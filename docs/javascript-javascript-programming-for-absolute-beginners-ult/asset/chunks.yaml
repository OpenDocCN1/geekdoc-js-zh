  trans: '

    请务必确保 `+` 符号和引号的位置正确，否则任何操作都无法运行。单引号和双引号的效果一样，只需确保开始和结束使用的引号类型一致即可。


    保存并重新加载网页——你应该能看到：


    变量包含的值为：25。


    它是真的还是假的？真


    你的第一个名字是什么？


    Johnny


    # 变量赋值


    当我们设置变量时，是这样做的：


    ```javascript

    var number1 = 25;

    ```


    但没有必要在同一行内为变量存储值；你也可以分越两行来完成：


    ```javascript

    var number1;

    number1 = 25;

    ```


    第 1 行创建了名为 `number1` 的变量，但内部没有存储任何值。第 2 行是存储值的地方——注意这次我们没有使用 `var`。这只有在设置变量时才需要，在设置值时不需要。


    你也可以给变量分配不同的值，如下：


    ```javascript

    var number1;

    number1 = 25;

    number1 = 150;

    ```


    由于 JavaScript 是一种顺序语言，代码会按行从上到下执行。我们在这里所做的是给变量赋值为值 25，然后在该变量中存储了另一个新数字。当存储一个新值时，旧值会被移除，因此名为
    `number1` 的变量现在的值将是 150，而不是 25。


    你也可以使用文本字符串来覆盖值，如下：


    ```javascript

    var number1;

    number1 = 25;

    number1 = "one hundred and fifty";

    ```


    这一次，尽管之前的值是数字，我们仍然在变量中存储了文本“one hundred and fifty”。没有其他编程语言会这样做，否则你会收到错误——不过 JavaScript
    并不太在乎，所以你可以这样做。


    在下一节中，我们将介绍数学运算符。


    # 数学运算符


    我们在变量上使用数学运算符，以便进行加、减、乘、除。这些是对应的符号：


    - 加号 (`+`) 用于加法

    - 减号 (`-`) 用于减法

    - 星号 (`*`) 用于乘法

    - 斜杠 (`/`) 用于除法

    - 百分号 (`%`) 用于模运算计算


    让我们练习一下这些运算符。创建一个新的网页，或者使用你在上一节中创建的那个。现在在 HEAD 部分添加两个 Javascript 标签，并在它们之间输入这段代码：


    ```javascript

    var number1 = 25;

    var number2 = 150;

    var total;

    total = number1 + number2;

    document.write( total );

    ```


    你的代码看起来应该像这样：


    ```html

    <!DOCTYPE HTML> <HTML> <HEAD> <TITLE>Mathematical Operators</TITLE> <SCRIPT LANGUAGE
    = "Javascript> var number1 = 25; var number2 = 150; var total; total = number1
    + number2; document.write( total ); </SCRIPT> </HEAD> <BODY> <HTML>

    ```


    保存并加载网页。你应该能在页面上看到数字 175。如果没有，请双检你的代码。


    我们将数字 25 和 150 分存储在两个名为 `number1` 和 `number2` 的独立变量中。然后我们设置了第三个我们称为 `total` 的变量。第
    4 行代码内容如下：


    ```javascript

    total = number1 + number2;

    ```


    在 `=` 符号的右侧是两个变量，用 `+` 符号隔开。这一次，这个 `+` 没有用于字符串拼接，而是用于加法。当 JavaScript 知道变量都包含数字时，它就知道要进行相加而不是连接它们。一个例子——在
    150 周加上引号：


    ```javascript

    var number2 = "150";

    ```


    保存并打开网页，你将看到这个：


    25150


    由于你将数字放在了引号中，你把它变成了文本，因此 JavaScript 将它们拼接在一起了，而不是相加。


    尝试这些练习题：


    ### 练习

    去掉 150 周的引号，然后将 `+` 改为 `-`。保存更改并刷新浏览器。你得到了什么？


    ### 练习

    现在将 `-` 改为 `*`，保存并刷新。你现在的总数是多少？


    ### 练习

    将 `+` 改为 `/`，保存并刷新。你现在得到了什么？


    你也可以可以在这些运算符上使用普通数字。看下面的代码——我们相加两个数字，并将结果存储在一个变量中：


    ```javascript

    var result;

    result = 12 + 36;

    document.write( result );

    ```


    JavaScript 将 `=` 符号右侧的数字相加，并将结果存储左侧的变量中。


    # 在变量中存储对象


    之前，我们使用 `document.write` 和 `alert` 信息处理不同的对象，类似于：


    ```javascript

    alert( window.innerWidth );

    ```


    这些值也可以存储在变量中。例如，如果你想将 `innerWidth` 的值存储在变量中，你可以这样做：


    ```javascript

    var width = window.innerWidth;

    ```


    存储值后，以后可以进行其他操作。


    ```javascript

    alert( width );

    ```


    在下一节中，我们将介绍运算符优先级。


    # 运算符优先级


    如果你愿意，可以使用两个以上的数字，并且可以混合数字和变量。编辑你代码中的 total 那行，使其如下：


    ```javascript

    total = number1 + number2;

    ```


    这里我们使用了除法符号，末尾是 2。这行代码看起来像这样：


    你认为结果是多少？你可能会认为 JavaScript 会先加两个数字再除以 2，但事实并非如此。为了告诉 JavaScript 你的需求，请使用括号：


    ```javascript

    total = (number1 + number2) / 2;

    ```


    如果你想让加法先执行，请这样写代码：


    ```javascript

    total = (number1 + number2) / 2;

    ```


    如果你想让第二个数字除以 2 再加上第一个数字，可以这样做：


    ```javascript

    total = number1 + (number2 / 2);

    ```


    看这段代码：


    ```javascript

    var result = 4 + 9 * 7;

    ```


    乘法运算符的优先级高于加法。如果你想让 4 和 9 相加后再乘以 7：


    ```javascript

    var result = (4 + 9) * 7;

    ```


    现在 (4 + 9) 等于 13，乘以 7 得到 91。


    看这个：


    ```javascript

    var result = 32 - 16 / 8;

    ```


    除法的优先级高于减法，所以 JavaScript 先将 16 除以 8 得到 2，然后从 32 中减去得到 30。现在，如果你加上括号：


    ```javascript

    var result = (32 - 16) / 8;

    ```


    看这个和式：


    ```javascript

    var result = 32 - 16 + 8;

    ```


    记住，减法和加法的优先级相同，所以这个式从左到右计算，答案是 24。然而，加上括号后我们得到了不同的答案：


    ```javascript

    var result = 32 - (16 + 8);

    ```


    在使用运算符时要非常小心，因为你可能得不到想要的结果！

