    what this is. In the IF statement we are using the Greater Than comparison operator
    (>) to see if the value in the variable called available width is over 800 pixels.
    If the value is more than 800 the condition will evaluate to true and a larger
    image is shown; if it is false, the small image is shown.


    Exercise


    Reduce your browser size and refresh to see what happens. If you go below 800
    in width you should find that the ELSE part is executed.


    Exercise


    Change > (greater than) to < (less than) and then change the document.write messages
    so they are correct. What happens now?


    The last operator to talk about is the === symbols. These are known as the identity
    operator and we use this when we want to check equality in a variable and that
    it is of the same type of variable. Look at this example:


    var identity = 27;


    if (identity === 27) {


    document.write("variable is the number 27");


    }


    else if (identity == 27) {


    document.write("variable is the text 27");


    }


    When you run this, the initial IF statement should evaluate true which means that
    the variable does contain the value of 27 and that it is of a number type. However,
    if you were to change the initial line to this:


    var identity = "27";


    Because we have placed 27 inside quotes, we turned it into a text string so, when
    we run the code again, the ELSE part will now evaluate true while the first bit
    evaluates to false.


    The === symbol gives you far more precision than the == symbol. Don’t worry yourself
    too much about this though; unless it is absolutely necessary, we will continue
    to use the == symbol.


    In the next part, we will be looking at logical operators.


    ## Logical Operators


    The best operators to use with conditional IF statements are logical operators.
    These provide you with many more options to use in your IF statements but there
    are only three that you really need to learn:


    ● && - Two ampersands mean AND


    ● || = Two pipe characters mean OR


    ● ! - One exclamation mark/point means NOT


    Let’s create this code for a web page. Create a new page or use your template


    <!DOCTYPE HTML>


    <HTML>


    <HEAD>


    <TITLE>Logical Operators</TITLE>


    <SCRIPT LANGUAGE = "Javascript"›


    var cookies_enabled = true;


    var javascript_enabled = false;


    if (cookies_enabled && javascript_enabled) { document.write( ALL OK - continue");


    else [


    document.write("ALL IS NOT OK - issue a warning.");


    </SCRIPT>


    </HEAD>


    <BODY>


    </BODY>


    </HTML>


    We start by setting up a pair of Boolean variables:


    var cookies_enabled = true;


    var javascript_enabled = false;


    Then we want to see what is inside each of the variables so we use the IF statement
    together with && (two ampersands) in between the round brackets:


    if ( cookies_enabled && javascript_enabled ) {


    Note that we have used a shorthand method of checking the Boolean variables:


    cookies_enabled && javascript_enabled


    When we could have written this:


    cookies_enabled == true && javascript_enabled == true


    However, when we check a Boolean variable, we can omit the ==true. By doing this,
    JavaScript will think that you are looking for a true value, which is what you
    are doing of course. The entire line will read “IF cookies_enabled equals true
    AND javascript_enabled equals true”.


    If both of these conditions are true the entire statement that is in between the
    round brackets will also be true. In this case, the initial document.write is
    going to be executed. But, if one of the conditions evaluates to false, the entire
    statement will be false and, in this case, the ELSE part gets executed.


    Type in the script and run it. Now edit javascript_enabled = false to read javascript_enabled
    = true. Save it, refresh and see what happens. You should see the first document.write
    gets printed.


    OR operators (||) are what let you check to see if one value evaluates to true.
    Edit the IF statement so it looks like this:


    if ( cookies_enabled || javascript_enabled ) {


    The entire line will now read “ IF cookies_enabled equals true OR javascript_enabled
    equals true”.


    On the first line of the code, change cookies_enabled = true to cookies_enabled
    = false Save the code and run it. You should see that, once again, the initial
    document.write is printed. Now set both of the variables to false and you will
    see that the ELSE part gets executed.


    So, the OR operators mean that only one bit of an IF statement has to evaluate
    true and that will make the whole statement true. Let’s look at a last example
    to clear that up a bit more. Edit your script so it reads like this:


    var age = 27;


    if ( age >= 18 && age <= 31 ) {


    document.write("Between 18 and 31");


    }


    else {


    document.write("Not Between 18 and 31");


    }


    The script is checking a range of ages. We set a variable named age with a value
    of 27 and then used an IF statement to check what the contents of the variable
    are. The following goes between the round brackets:


    age >= 18 && age <= 31


    This line says, “IF age is greater than or equal to 18 AND age is less than or
    equal to 31”. If both of these conditions are true, the entire statement is true
    and we will see the initial document.write executed. If one is false the whole
    statement will be false. To see that more clearly, change the value of the age
    variable to 15\. Save it and run it in your browser and you should see that the
    ELSE part of the statement is executed.


    ### Exercise


    Add in an ELSE IF statement to check a range of ages between 14 and 17,


    ## The NOT Operator


    Above, you saw how we check for a true value using a shorthand method:


    if ( cookies_enabled && javascript_enabled ) {


    This means that you do not need to type in cookies_enabled == true. The reason
    you can do this is that Javascript checks, by default, to see if the Boolean variables
    have true values. If you wanted to see if there was a false value you would use
    the NOT operator which is nothing more than an exclamation mark (!). Have a look
    at this example:


    if ( !cookies_enabled) {


    }


    Note that the variable named cookies_enabled now has a NOT operator in front of
    it. Javascript will check, by default, for a true value and. By putting the NOT
    operator into the equation, in front of the Boolean value, you are saying “if
    NOT true” Clearly, if something isn’t true then it must be false so, if you are
    looking for a quicker way of checking for false value types, add an exclamation
    mark in front of the Boolean variable.


    One of the more common uses of the NOT operator is in toggling Booleans to true
    or false and we do that like this:


    bool_value = !bool_value;'
