    # 引言


    首先，祝贺你花时间阅读我的 JavaScript 指南。我的本是引导你了解 JavaScript 的内部机制。我想让你确切知道 JavaScript 是什么、它是如何工作的，以及所有部分是如何组合在一起的，同时详细介绍一些与
    JavaScript 配合使用的 HTML 元素。


    JavaScript 是一种非常轻量级的语言，容易学习且具有动态性。Brendan Eich 在 1995 年于 Netscape（第一个浏览器所有者）工作时设计了它。JavaScript
    是一种基于 Web 的编程语言，用于结合 Java applets、图像和插件等组件创建网站和网页。JavaScript 是开源跨平台的，你会发现所有主流网站都使用它作为核心编程语言。


    为了帮助你学习，我包含了大量的示例供你亲自尝试——这是学习某事的最好方法，我希望它对你也有帮助。书中还穿插了几个练习，即你可以尝试的示例。这些练习被设计用于巩固你在特定章节中学到的知识，我没有为这些练习提供答案。它们仅仅是供你练习的一种，我敦促你反复练习直到有信心为止。这些练习不仅是为了测试你对主题的理解，还为了测试你是否学会了正确的代码编写方法。在书的最后，你会找到一个供你尝试的
    JavaScript 模拟测试，并附有答案。


    如果你准备好开始学习 JavaScript，让我们开始吧。


    感谢 [www.homeandlearn.co.uk](http://www.homeandlearn.co.uk) 为部分代码提供的帮助。


