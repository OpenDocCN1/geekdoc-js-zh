    Johnny\n\n# Variable Assignment\n\nWhen we set the variable, we did it like this:\n\
    \n```javascript\nvar number1 = 25;\n```\n\nBut there is no need to store values\
    \ in the variable on the same line; you can do it over two lines:\n\n```javascript\n\
