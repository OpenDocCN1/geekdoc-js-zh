    called cookiesEnabled. This is going to evaluate true or false, depending on the
    settings on the user’s browser. By inputting the name of a variable in the function
    call brackets, we have set an argument but you can also use values, such as text
    strings, numbers or Booleans as well as variable names.


    So, the value of cookiesEnabled will be passed to secondFunction but take a look
    at how we have now laid out secondFunction:


    function secondFunction( cookiesEnabled ) {


    Note that we also have a variable name in between the round brackets for secondFunction
    as well, the same variable as we had for myFunction. It doesn’t need to be the
    same; you can use whatever name you like, for example:


