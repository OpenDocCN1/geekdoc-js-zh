    <TITLE>Text Box Checker</TITLE>\n<SCRIPT LANGUAGE=\"javascript\">\nfunction validate()\
    \ {\nvar textbox_value = document.getElementById(\"Name\").value;\nif (textbox_value\
    \ ==\"\") {\nvar error = \"<span style=\\\"color:red\\\">Required</span>\";\n\
    document.getElementById(\"message\").innerHTML = error;\nreturn false;\n} else\
    \ {\n}\n</script>\n```\n"
