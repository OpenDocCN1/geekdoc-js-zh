    you want to convert. Then you have a dot and that is followed by the name of the
    method which is toUpperCase. This is then followed with the set of round brackets
    and the line ends, as usual, with the semicolon.


    Look to the left of the = symbol. Did you spot a new variable? When the conversion
    takes place, the new value will go into this variable which we have named new_postcode.
    There is a good reason why we store this new value in a brand-new variable – JavaScript
    strings are what we call immutable. This means that nothing can be changed, no
    characters in the string can be altered in any way. JavaScript comes up with a
    brand-new string and leaves the original one as it was.


    Add a new document.write at the end of the code and also add a BR tag to the first
    document.write:


    document.write(new_postcode + "<BR>");


    document.write( postcode );


    Save your code and run it in your browser. You should see new_postcode as SR2
    5JH while the original, untouched postcode is sr2 4jh.


    That said, you can also do this:


    var postcode = "sr2 4jh";


    postcode = postcode.toUpperCase();


    However, what you are doing here is making a new string on the right of the =
    symbol and then storing it in the variable called postcode.


    Exercise


    Edit the variable called postcode on line 1 of the code to SR2 4JH. Now convert
    it using toLowerCase.


    Next, we are going to look at another string method called indexOf.


    ## Strings - indexOf


    This method is used to let you know if there is a specific character in a text
    string, such as @ included in an email address. The one thing it will not do is
    look for all occurrences of the character, just the initial one and, if it can’t
    locate the character it will return -1 as a value. If it does find the character,
    the returned value will be the position the character is in the string, for example,
    4th character.


    Create a new page or edit your code to the following so that we can test indexOf
    out:


    var email = "meme@meme.com";


    var at_sign = email.indexOf(''@'');


    document.write( at_sign );


    What we have done here is set up a variable that will hold the value of an email
    address. We need to see there is a @ sign in the email address so we use indexOf
    in this way:


    var at_sign = email.indexOf(''@'');


    Once again, you begin to the right of the = symbol and input the name of the variable
    you want to look in. A dot follows that and then you have indexOf. The round brackets
    contain the character/s that you want to find and these must be inserted in between
    quotation marks. You are not limited to checking for a single character but, if
    you check for multiple characters the returned result will be the initial character
    of the string.


    When you run the following script, you will see a value of 4 returned. You could
    be forgiven for believing that the @ symbol in the address is actually at position
    5 but, remember, JavaScript indexing begins at 0.


    Remove the @ symbol from the address on the first code line and run the script
    again – a value of -1 should be returned. This information may be used within
    an IF statement in this way:


    if ( at_sign == -1 ) {


    document.write( "no @ sign in email address" );


    }


    else {


    document.write("email address contains @ sign");


    }


    This code only checks the variable called at_sign for a -1 value and will take
    the appropriate action. Add this to your code and test it. Then replace the @
    sign and run the code again.


    The next string method we look at is called charAt. 


    ## Strings - charAt'
