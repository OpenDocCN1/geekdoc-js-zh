    \ you can create a new page if you want:\n\n```javascript\n<SCRIPT LANGUAGE =\
    \ \"Javascript\">\nvar over_twentyone = true;\n\nif (over_twentyone != true) {\n\
    \  document.write(\"You’re not old enough!\");\n}\nelse {\n  document.write(\"\
    Congratulations - you are old enough!\");\n}\n</SCRIPT>\n```\n\nWhat this script\
    \ has done is given the variable named `over_twentyone` a value of `true`. We\
    \ are using an `IF` … `ELSE` statement to see what is in the variable so, in between\
    \ the round brackets is this:\n\n`over_twentyone != true`\n\nThis is saying “If\
    \ `over_twentyone` does not equal True” so if the variable doesn’t have what we\
    \ want we need something else to happen. However, it does have the `true` value\
    \ so JavaScript will jump to the `ELSE` part of the statement. This gives the\
    \ text of “Congratulations – you are old enough!) on the browser.\n\nSave and\
    \ test your work and then change `var over_twentyone = true` to read `var over_twentyone\
    \ = false`. Now save the code and run it again – you will see the message that\
    \ reads “You’re not old enough!”\n\nHave a go at this script:\n\n```javascript\n\
    <SCRIPT LANGUAGE = \"Javascript\">\nvar available_width = window.innerWidth;\n\
    \nif ( available_width > 800 ) {\n  document.write(\"Show large image\");\n}\n\
    else {\n  document.write(\"Show small image\");\n}\n</SCRIPT>\n```\n\nThe first\
    \ line is giving the browser the available `Inner Width` so we want to see what\
    \ this is. In the `IF` statement we are using the Greater Than comparison operator\
    \ (`>`) to see if the value in the variable called `available width` is over 800\
    \ pixels. If the value is more than 800 the condition will evaluate to true and\
    \ a larger image is shown; if it is false, the small image is shown.\n\n### Exercise\n\
    Reduce your browser size and refresh to see what happens. If you go below 800\
    \ in width you should find that the `ELSE` part is executed.\n\n### Exercise\n\
    Change `>` (greater than) to `<` (less than) and then change the `document.write`\
    \ messages so they are correct. What happens now?\n\nThe last operator to talk\
    \ about is the `===` symbols. These are known as the identity operator and we\
    \ use this when we want to check equality in a variable and that it is of the\
    \ same type of variable. Look at this example:\n\n```javascript\nvar identity\
    \ = 27;\n\nif (identity === 27) {\n  document.write(\"variable is the number 27\"\
    );\n}\nelse if (identity == 27) {\n  document.write(\"variable is the text 27\"\
    );\n}\n```\n\nWhen you run this, the initial `IF` statement should evaluate true\
    \ which means that the variable does contain the value of 27 and that it is of\
    \ a number type. However, if you were to change the initial line to this:\n\n\
    `var identity = \"27\";`\n\nBecause we have placed 27 inside quotes, we turned\
    \ it into a text string so, when we run the code again, the `ELSE` part will now\
    \ evaluate true while the first bit evaluates to false.\n\nThe `===` symbol gives\
    \ you far more precision than the `==` symbol. Don’t worry yourself too much about\
    \ this though; unless it is absolutely necessary, we will continue to use the\
    \ `==` symbol.\n\nIn the next part, we will be looking at logical operators.\n\
    \n## Logical Operators\n\nThe best operators to use with conditional `IF` statements\
    \ are logical operators. These provide you with many more options to use in your\
    \ `IF` statements but there are only three that you really need to learn:\n\n\
    - `&&` - Two ampersands mean AND\n- `||` - Two pipe characters mean OR\n- `!`\
    \ - One exclamation mark/point means NOT\n\nLet’s create this code for a web page.\
    \ Create a new page or use your template:\n\n```html\n<!DOCTYPE HTML>\n<HTML>\n\
    <HEAD>\n<TITLE>Logical Operators</TITLE>\n<SCRIPT LANGUAGE = \"Javascript\">\n\
    var cookies_enabled = true;\nvar javascript_enabled = false;\n\nif (cookies_enabled\
    \ && javascript_enabled) { \n  document.write(\"ALL OK - continue\");\n}\nelse\
    \ {\n  document.write(\"ALL IS NOT OK - issue a warning.\");\n}\n</SCRIPT>\n</HEAD>\n\
    <BODY>\n</BODY>\n</HTML>\n```\n\nWe start by setting up a pair of Boolean variables:\n\
    \n`var cookies_enabled = true;`\n`var javascript_enabled = false;`\n\nThen we\
    \ want to see what is inside each of the variables so we use the `IF` statement\
    \ together with `&&` (two ampersands) in between the round brackets:\n\n`if (\
    \ cookies_enabled && javascript_enabled ) {`\n\nNote that we have used a shorthand\
    \ method of checking the Boolean variables:\n\n`cookies_enabled && javascript_enabled`\n\
    \nWhen we could have written this:\n`cookies_enabled == true && javascript_enabled\
    \ == true`\n\nHowever, when we check a Boolean variable, we can omit the `== true`.\
    \ By doing this, JavaScript will think that you are looking for a true value,\
    \ which is what you are doing of course. The entire line will read “IF cookies_enabled\
    \ equals true AND javascript_enabled equals true”.\n\nIf both of these conditions\
    \ are true the entire statement that is in between the round brackets will also\
    \ be true. In this case, the initial `document.write` is going to be executed.\
    \ But, if one of the conditions evaluates to false, the entire statement will\
    \ be false and, in this case, the `ELSE` part gets executed.\n\nType in the script\
    \ and run it. Now edit `javascript_enabled = false` to read `javascript_enabled\
    \ = true`. Save it, refresh and see what happens. You should see the first `document.write`\
    \ gets printed.\n\nOR operators (`||`) are what let you check to see if one value\
    \ evaluates to true. Edit the `IF` statement so it looks like:\n\n`if ( cookies_enabled\
    \ || javascript_enabled ) {`\n\nThe entire line will now read “IF cookies_enabled\
    \ equals true OR javascript_enabled equals true”. On the first line, change `cookies_enabled\
    \ = true` to `cookies_enabled = false`. Save it, refresh and see what happens.\
    \ You should see the first `document.write` gets printed. If one of the conditions\
    \ evaluates to false, the `ELSE` part gets executed. \n\nLet’s look at a last\
    \ example to clear that up. Edit your script so it looks like this:\n\n```javascript\n\
    var age = 27;\n\nif (age >= 18 && age <= 31) {\n  document.write(\"Between 18\
    \ and 31\");\n}\nelse {\n  document.write(\"Not 18 and 31\");\n}\n```\n\nThe script\
    \ is checking a range of ages. We set a variable named `age` with a value of 27\
    \ and then used an `IF` statement to check what the contents are. The following\
    \ goes between the round brackets:\n\n`age >= 18 && age <= 31`\n\nThis line says,\
    \ “IF age is greater than or equal to 18 AND age is less than or equal to 31”.\
    \ If both of these conditions are true, the initial `document.write` is executed.\
    \ To see that more clearly, change the value of the `age` variable to 15. Save\
    \ it and run it and you should see that the `ELSE` part is executed.\n\n### Exercise\n\
    Add in an `ELSE IF` statement to check a range of ages between 14 and 17\n\n The\
    \ NOT Operator\n\nAbove, you saw how we check for a true value using a shorthand\
    \ method:\n\n`if ( cookies_enabled && javascript_enabled ) {`\n\nThis means that\
    \ you do not need to type in `cookies_enabled == true`. The reason you can do\
    \ this is that JavaScript checks, by default, to see if the Boolean variables\
    \ have true values. If you wanted to see if there was a false value you would\
    \ use the `NOT` operator which is nothing more than an exclamation mark (`!`).\
    \ Have a look at this example:\n\n`if (!cookies_enabled) {`\n\nNote that the variable\
    \ named `cookies_enabled` now has a `NOT` operator in front of it. JavaScript\
    \ will check, by default, for a true value and. By putting the `NOT` operator\
    \ into the equation, in front of the Boolean value, you are saying “if NOT true”.\n\
    \nOne of the more common uses of the `NOT` operator is in toggling Booleans to\
    \ true or false and we do that like this:\n\n```javascript\nbool_value = !bool_value;\n\
    ```\n"
