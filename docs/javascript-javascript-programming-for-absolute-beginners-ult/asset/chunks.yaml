  raw: 'This time, note that the word new and then a space now follows the = symbol.
    The word “Array” follows that, (always a capital A, never lowercase) and this
    is immediately followed by a set of round brackets. Inside these you can insert
    the number of positions that will be in the array if you want:


    var my_array = new Array(3);


    What this code is saying is that we want to set up an array that has three positions
    but you are not obliged to add in the number of positions if you don’t want to.
    However, when you do assign a value to each position, you must add in the index
    position, like this:


    var my_array = new Array( );


    my_array[0] = 10;


    my_array[1] = "ten";


    my_array[2] = true;


    The top line is setting up the array with the name of my_array. The following
    three lines then assign a  value to each of the positions that are in the array
    and this is the method we are going to use from now on when we set arrays up.


    ## Arrays and Loops


    Very often, you will use arrays and loops together and the reason for this is
    that the array index positions are numbers that can be swapped for loop variables.
    Try the following code to see how this works:


    var counter = 0;


    var lottery_numbers = new Array();


    while ( counter < 49 ) {


    lottery_numbers[counter] = counter + 1; 


    document.write( lottery_numbers[counter] + "<BR>" );


    counter++;


    }


    What this script is doing is assigning values to the lottery_numbers array using
    a while loop. This loop continues to go around, executing this line repeatedly:


    lottery_numbers[counter] = counter + 1;


    Instead of using the index positions and having to write each one out individually,
    like lottery_numbers[0], lottery_numbers[1], etc., instead we put the counter
    variable in place of the index number. The reason we can do this is that counter
    will change with every loop around and JavaScript is already aware of what is
    in counter; thus, it can be used as the index. After the = symbol, we can assign
    the value of the counter variable (plus 1) to each of the array positions.


    There is so much more that you can do with arrays and you will come across them
    again later. For now, we need to move on and talk about functions


    ## Functions


    Right now, the scripts we are using have been set so that they run the minute
    the page loads up in the browser but this isn’t necessary. Perhaps a better way
    would be to place the JavaScript code into a function. These are nothing more
    than additional segments of code that may be called into action. In fact, unless
    you call a specific function into action, it won’t do anything at all. Let’s have
    a look at how they work.


    A function that does not include any code will look like this:


    function myFunction() {


    }


    The word ‘function’ (with a lowercase f) is followed by a space. Then you add
    the name that you have chosen for your function. These are very similar to variables
    in that they may be named anything but cannot start with a number, cannot have
    any spaces in the name and should only contain numbers, letters, underscores and
    $ signs.


    This is followed by a set of round brackets and in these, we will add something
    called arguments. We will come to those later but next is set of curly brackets
    and that is where your code goes. There is no need for you to have your functions
    spread out over several lines, you can do this if you want:


    function myFunction() { alert("My Function"); }


    However, for the sake of clarity and readability, it is better to spread the functions
    out.


    Create a new page and on between your script tags, input the following code:


    function myFunction( ) {


    alert( "My Function" );


    }


    Your code should look something like this:


    <!DOCTYPE HTML>


    <HTML>


    <HEAD>


    <TITLE>-A Simple Function</TITLE>


    <SCRIPT LANGUAGE = "Javascript">


    function myFunction() {


    alert("my Function");


    </SCRIPT>


    </HEAD>


    <BODY>


    </BODY>


    </HTML>


    Save your code and load the page into the web browser. If nothing happens, then
    you did it right because the code that is between the curly brackets does not
    display. Why? Because we didn’t call that function into action – remember, when
    a function isn’t called into action it doesn’t do anything.


    There are several ways to call functions into action and one of those is through
    onLoad – an event of the browser window. Add this code to the BODY section of
    your script:


    <BODY onLoad = "myFunction()">


    After onLoad, there is an = symbol and after this, we have the name of the function
    that was created – this is the function that we want to call into action. It is
    best to put this function name in between a set of double or single quotes because
    some browsers won’t react unless those quotes are in place. You will also need
    a set of round brackets.


    Save the changes and load the page into the browser; you should now see an alert
    box on the screen – this tells you that the function has now been called into
    action


    ## Functions That Call Other Functions


    It is also possible for a function to call another function into action. You really
    don’t want one huge function that does it all so the best way is to have several
    smaller functions that each do something specific. Let’s say that you have a function
    that extracts values from a form whenever a button gets clicked.  You could then
    set up more functions that check, perhaps an email box to see if an input email
    is valid or that a checkbox has been correctly ticked. The point I am making is
    that it is much easier for you and for anyone who reads your code if you break
    it down into smaller, more manageable chunks that each does a specific job.


    Have a look at this simple example – one function is calling another function:


    <!DOCTYPE HTML> <HTML>


    <HEAD>


    <TITLE>A simple Function</TITLE>


    <SCRIPT LANGUAGE = "Javascript"› function myFunction()


    secondFunction();


    1


    function secondFunction()


    alert("my second Function");


    </SCRIPT>


    </HEAD>


    -BODY onload = "myFunction()"›


    </BODY>


    </HTML>


    We added another function to the code we wrote earlier – this is it:


    function secondFunction() {


    alert("My Second Function");


    }


    The code that is in between the curly brackets for the function is only an alert
    box. Let’s look at the first function:


    function myFunction() {


    secondFunction();


    }


    Now we don’t have the alert box in the first function but what we do have is this:


    secondFunction();


    So, when you want to call a function into action, all you do is input the name
    of the function, add in the round brackets and then end with the semicolon.


    Have a go for yourself. When you load up the page into a browser, the first thing
    that happens is the onLoad call in the BODY. This will then activate myFunction
    and when this is executed, it will then call secondFunction into action.


    ## Return Values


    Sometimes you are going to want something back from those functions. Let’s say
    that you are checking an email address to see if there are any errors in it; you
    will want the results from your code – is it valid or not? Or maybe you have a
    checkbox that asks a user to agree to the terms and conditions of your website
    – again, you want a result back. This is a value that we call the return value
    and this can be of a numerical value, a Boolean, a text string, even an object.
    However, there will only be one return value.


    Let’s edit secondFunction so that it will return a value:


    function secondFunction() {


    var alertString = "My Return Value";


    return alertString;


    }


    In this example, we created a variable that we called alertString. We set the
    value of this as a text string that reads, “My Return Value” and, to get the value
    from the function, we use this line:


    return alertString;


    To retrieve a value all you do is input the word, ‘return’ and follow it with
    a space. Next comes the name of the variable or the value that you want. In our
    case, we used the variable name alertString.


    We do need to make a change to firstFunction so that we can access the return
    value. Have a look at this:


    function myFunction() {


    var retVal = secondFunction();'
