- fmt: "\nWe haven't covered the `IF` statement yet but, even so, you should still\
    \ be able to figure out what is going on here. We tested a number with the modulus\
    \ operator and then say IF the modulus has a value of 1, “Odd number should be\
    \ written, ELSE,“Even number” gets written.\n\nNext, we are going to look at conditional\
    \ logic.\n\n## Conditional Logic\n\nEarlier, you learned that JavaScript is sequential\
    \ which means it executes code in sequence, as it is written. Sometimes, you won’t\
    \ want every line executed and you want to be able to control how your programming\
    \ works.\n\nOne way to do this is using conditional logic which is where the `IF`\
    \ statement comes in. Conditional logic is about what would happen IF a specified\
    \ condition is or isn’t met.\n\n### IF Statement\n\n`IF` statements are ideal\
    \ for when you want to control how your code flows. `IF` statements only evaluate\
    \ either True or False and they look like this:\n\n```\nif ( condition_to_test)\
    \ {\n\n}\n```\n\nBasically, an if statement consists of the word ‘if’ in lowercase\
    \ letters, followed by the condition to test inside a pair of round brackets.\
    \ That condition gets evaluated to see if it is true. If it is then the code that\
    \ is in between the curly brackets will be executed. If the condition evaluates\
    \ false, then that code is ignored. Have a look at the following example:\n\n\
    ```\nvar first_name = \"Johnny\";\n\nif ( first_name == \"Johnny\" ) {\n\ndocument.write(\
    \ \"First Name is Johnny \" + first_name );\n\n}\n```\n\nThe first line of this\
    \ code is storing a text string of “Johnny” in a variable named `first_name`.\
    \ Then we have the `IF` statement and the condition to be tested is in between\
    \ the round brackets:\n\n`first_name == \"Johnny\"`\n\nWe check to see if the\
    \ variable named first name has got the word “Johnny” in it. Note that there are\
    \ two `==` symbols between the variable and the text. This double `==` symbol\
    \ means “has a value of”. It is not assigning the value of “Johnny” to the variable\
    \ as it would if we had just a single `=` so, the entire line reads “IF the variable\
    \ called first name has a value of Johnny.” JavaScript tests that statement to\
    \ see if it is true – if it is, the code between those curly brackets will be\
    \ executed.\n\nTry the code out for yourself. Create your new web page and then\
    \ type in the above code between the JavaScript tags – it should look like this:\n\
    \n```html\n<!DOCTYPE HTML>\n\n<HTML>\n<HEAD>\n<TITLE>Basic If Statement</TITLE>\n\
    <SCRIPT LANGUAGE = \"Javascript\"> var first_name = \"Johnny\";\n\nif (first_name\
    \ —\"Johnny\") {\n\ndocument.write(\"First Name is Johnny \" + first_name);\n\n\
    </SCRIPT>\n\n</HEAD>\n\n<BODY>\n\n</BODY>\n\n</HTML>\n```\n\nDo make sure that\
    \ you have the right format for the `IF` statements. The first line only requires\
    \ a single `=` symbol because you are assigning the variable with the value of\
    \ “Johnny.” Between the round brackets in the `IF` statement, you require two\
    \ `==` symbols and you also require a pair of curly brackets – this is where your\
    \ code is going.\n\nSave and open the page in a browser; you should see this:\n\
    \nFirst Name is Johnny Johnny\n\nWhy have we got Johnny down twice? The first\
    \ one is because “Johnny” was typed between double quotes and the second is because\
    \ JavaScript always writes the value of the variable called `first_name`.\n\n\
    Delete one of those `==` symbols from the round brackets and change Johnny to\
    \ Billy\n\n```\nif ( first_name = \"Billy\" ) {\n```\n\nSave, and open in the\
    \ browser. This time, you should see this:\n\nFirst Name is Johnny Lenny\n\nAlthough\
    \ the value of “Johnny” was assigned to the variable in line 1, it was changed\
    \ by JavaScript to “Billy” and it did this because we removed one `=` symbol from\
    \ the double `==` symbols in the `IF` statement. This automatically assigns the\
    \ variable with a new value.\n\nBe careful when you do your conditions in between\
    \ round brackets in an `IF` statement – two `==` symbols will check the value\
    \ while a single `=` symbol assigns the value.\n\nNext, we are going to look at\
    \ the `IF…ELSE` statement.\n\n## IF ... ELSE\n\nYou can also put an `ELSE` bit\
    \ into your `IF` statement, useful for when you want to control what will happen\
    \ if the `IF` statement is False. Change the code you wrote to this:\n\n```\n\
    var first_name = \"Sammy\";\n\nif ( first_name == \"Johnny\" ) {\n\ndocument.write(\"\
    First Name is \" + first_name);\n\n}\n\nelse {\n\ndocument.write(\"First Name\
    \ is \" + first_name);\n\n}\n```\n\nThe first line changed “Johnny” to “Sammy”\
    \ and between those curly brackets, we now see:\n\n`document.write(\"First Name\
    \ is \" + first_name)`\n\nTake a look at the `ELSE` bit:\n\n```\nelse {\n\ndocument.write(\"\
    First Name is \" + first_name);\n}\n```\n\nIf you add `ELSE` to your `IF` statement,\
    \ it must have its own curly brackets – omit one and your code is not going to\
    \ work. Save the changes, run the code and you should see this:\n\nFirst Name\
    \ is Sammy\n\nThe first bit of the `IF` statement is checking the condition that\
    \ is in the round brackets. If it evaluates true, the code in the curly brackets\
    \ of the `IF` statement is executed. If it is false, JavaScript goes straight\
    \ to the `ELSE` bit and executes the code in the curly brackets for the `ELSE`\
    \ statement.\n\n## IF … ELSE IF\n\nThere is one more condition that you can add\
    \ – the `ELSE IF` statement, which looks like this:\n\n```\nif ( first_condition_to_test\
    \ ) {\n\n}\n\nelse if ( second_condition_to_test ) {\n}\n```\n\nNote that `ELSE\
    \ IF` is in two words – type it as one word (`ELSSEIF`) and your code isn’t work.\
    \ Each condition evaluates true or false – if a true value is found, the code\
    \ in the curly brackets will be executed and the `IF` statement will be exited,\
    \ skipping any remaining conditions.\n\n```\nif ( first_condition_to_test ) {\n\
    }\n\nelse if ( second_condition_to_test ) {\n}\n\nelse if ( third_condition_to_test\
    \ ) {\n\n}\n```\n\n```html\n<SCRIPT LANGUAGE = \"Javascript\"> var first_name\
    \ = \"Ginny\";\n\nif (first_name ==\"Johnny\") {\ndocument.write('First IF \"\
    \ + first_name);\n}\n\nelse if (first_name == \"mymy\")\n.writewrite(\"Second\
    \ \" \" first__););elseelse if (___ ==nynynyny { {..writewriteThirdThirdThird____\n\
    \n\n\n\n\n\n\n\n + +\nname);\n}\n\nelse\ndocument.write(\"ELSE PART \" + first_name);\n\
    }\n</SCRIPT>\n```\n\nNow, the first line has assigned `first_name` variable with\
    \ “Ginny” so you should be able to work out what is executed.\n\n### Exercise\n\
    \nChange “Ginny” into “Johnny” and then change it to “Sammy” and finally “Lenny”\
    \ just to see what will be printed each time. Now change the uppercase S on Sammy\
    \ to a lowercase s, giving you sammy – what will be printed?\n\n## Nested If Statements\n\
    \nYou may nest `IF` statements if you want to. Let’s say that you want to test\
    \ out a variable to find out the value in it but you also want to do other things\
    \ on it as well. You would do something like this:\n\n```\nif ( x > 1) {\n\nif\
    \ ( x == 2) {\n\n}\n\nelse if (x == 3 ) {\n\n}\n\n}\n```\n\nIn this code, we test\
    \ the variable `x` to see if it is greater than 1 but we also want to narrow this\
    \ down a little. If it is greater than 1, a nested `IF…ELSE` statement will be\
    \ executed, which will then look more closely at the variable called `x`.\n\n\
    ## Comparison Operators\n\nSo far, our `IF` statements have looked to see if a\
    \ condition evaluates true or false and have made use of the double `==` symbols.\
    \ There are some other operators that you may use as well and these are called\
    \ comparison operators. These are the more common ones and all will evaluate to\
    \ either true or false:\n\n- `!=`: Is not equal to\n- `>`: Greater Than\n- `<`:\
    \ Less Than\n- `>=`: Greater Than or equal to\n- `<=`: Less Than or equal to\n\
    - `===`: The same as and of the same variable type\n"
