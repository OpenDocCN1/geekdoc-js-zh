    ## The Browser Object Model


    Every browser is split up into separate parts or objects that may be accessed
    through JavaScript. As a whole, these objects are called the BOM or Browser Object
    Model, and at the top is the Window object. This object is representative of the
    whole browser – the menus, the toolbars, the entire page and everything on it.


    Beneath this Window object you will find lots more different objects which allow
    you to carry out other tasks, like redirecting users, get the browser window size,
    access every HTML element on the page, and a good deal more besides. The following
    are some of the more popular Windows objects:


    ● window.document – lets you access all the HTML elements


    ● window.history – allows you to access browsing history information. This is
    limited in use because you are not able to see which pages your users have visited,
    only the number of pages in the history. Other methods that you could access,
    if you wanted to, are history.forward, history.back and history.go.


