- fmt: '

    Now you can begin to use the console in Chrome so take the time out to explore
    it; learn what it is all about and how to use it.


    ### Shortcut


    There is a shortcut to open your console:


    ● Download and install Chrome

    ● In the address bar, type `about:blank` and a blank page will load


    ### Getting Started


    Now that you have set up your console, you can type `console.log()` at your command
    prompt – this will log you in. Now is the time to begin exploring and learn what
    JavaScript is all about – as I mentioned earlier, you will find lots of practical
    examples to help you out through the book so use them and learn. A couple of helpful
    hints – you can click the button that says `Preserve Log` to preserve anything
    that you input and if you want to save your work, right-click anywhere in the
    console and choose `Save As`.


    Now let’s look at text editors. You can choose any that you want but I would recommend
    Brackets.


    ### Brackets


    Brackets is open source and is specifically designed for web development. It is
    built using `JavaScript` making it the very best editor, providing plenty of useful
    tools and help for you to learn how to code much easier and much more effectively.


    1. Open your web browser and type in [http://brackets.io/](http://brackets.io/)

    2. Download the version that corresponds to your operating system – Linux, Windows
    or Mac


    When you open Brackets for the first time, you will be presented with a project
    named “Getting Started.” Onscreen instructions will show you how to use the features
    in Brackets.


    ● Opening a folder is simple – click `File>`Open Folder`. You will see this in
    the file tree that is to the left of your screen. This is your projects folder
    and it has some settings related to it. To move between projects, simply click
    on the root folder name in the tree or you can drag the relevant folder form your
    operating system into Brackets and it will open.


    ● Instead of showing your opened files in tabs, Brackets shows them in a list
    titles “Working Files” and you will find this above the tree. Clicking on a file
    in that tree will allow you to view the file but it won’t get put into the `Working
    Files` List. This way, you can look through the files without having to open each
    one. Any changes that are made to a file will be put automatically into the `Working
    Files` list and to add a file to the list without having to edit it first, you
    simply double-click the name.


    To begin with, a single editor will be on show in Brackets view but you can split
    it so you see two editors. These can be horizontal or vertical and to choose,
    click `View` and then on `Horizontal Split` or `Vertical Split`. The main view
    will now show as two and you can view two files at the same time. You will also
    get another `Working Files` list so you can see what is open in each pane. You
    can also drag files between the two panes.


    Brackets is very clever in that, whatever view layout you had for each project,
    it will remember it. Opening a project will show you which layout was there when
    you saved and closed the project. To close split view and go back to a single
    pane, just click on `View` and then on `No Split`. You won’t shut down any open
    files by doing this; the separate lists of `Working Files` will now be merged
    into one and all changes will be stored until you chose to discard or to save
    them.


    Have a play, learn your way around Brackets and then open a new console, ready
    to start coding.


    # Section 2: The Browser


    ## Your First JavaScript


    Open your text editor and input the following:


    ```html

    <!DOCTYPE HTML>

    <HTML>

    <HEAD>

    <TITLE>-A First Script</TITLE>

    </HEAD>

    <BODY>

    </BODY>

    </HTML>

    ```


    Here we have the beginnings of your webpage – the `HEAD` and `BODY` tags and the
    `TITLE` area. Save this as `first_script.html`. A word of note – if you use `Notepad`
    as your Editor, change `Save As` to `All File Types` otherwise you will have a
    text file and not an HTML page.


    Next, we are going to add some tags so, in-between the `BODY` tags, type in:


    ```html

    <SCRIPT LANGUAGE = "Javascript">

    alert("Hello World")

    </SCRIPT>

    ```


    You always add a program script between the opening and closing `<SCRIPT>` tags.
    One of the `SCRIPT` tag attributes is called `LANGUAGE` and this is what tells
    your browser the name of the script language that is in use – in our case, this
    is `JavaScript`. This is added after the `=` sign – note that the word `JavaScript`
    has been enclosed in double quotation marks. This isn’t absolutely necessary,
    you could even skip the `LANGUAGE` attribute altogether and have this:


    ```html

    <SCRIPT>

    alert("Hello World")

    </SCRIPT>

    ```


    ![](images/00002.gif)


    Do note that if you omit the forward slash at the start of the closing `SCRIPT`
    tag your code is not going to work. As you can with all HTML tags, your `SCRIPT`
    tags may be written in lowercase, if it is easier for you, like this:


    ```html

    <script>

    alert("Hello World")

    </script>

    ```


    Another note – while `SCRIPT` tags do not follow case sensitivity, `JavaScript`
    does. The code we have written is one line and all it is doing is displaying a
    popup dialog box that shows the words, “Hello, World”. Have a go at it. Make sure
    you save your works and then use `Windows Explorer` or `Windows` or `Finder` on
    the Mac to go to where the HTML file was saved. Double-click the file to run it
    in the browser.


    Change the `alert` line to read:


    `Alert("Hello World")`


    Note that `alert` is now started with a capitalized ‘A’. Save and load the page
    in the browser again and you will notice that the box now no longer shows up.
    Change back to a lowercase ‘a’, save and the box will reappear.


    These `alert` boxes display information to users. Between the round brackets,
    you input what text you want to see and make sure it is in set of marks – use
    single or double.


    ### Confirm and Prompt


    You can also have `Confirm` and `Prompt` boxes – the `Confirm` box will give you
    an OK and Cancel button and these are generally used with IF statements to determine
    which button is clicked. More about IF statement later but, to get a confirm box,
    simply type in:


    `confirm("OK or Cancel?")`


    Again, the text must be inserted between quotation marks. `Prompt` boxes are used
    when you need the user to input something. This is the code for the prompt box:


    `prompt("Favorite animal?", "Cat")`


    Note that there are two bits in between the brackets – first the heading and then
    the default text. Users will input text into a box on the dialog box and when
    they press the OK button, you get the input text and can do something with it
    – you will see more about this when we look at IF statements. For both these boxes,
    `Confirm` and `Prompt`, you must use lowercase letters.


    ## JavaScript Tag Placement


    There are three places where you can insert a `SCRIPT` tag:


    ● Between two `BODY` tags

    ● Between two `HEAD` tags

    ● In the `HEAD` section as a link to an external file


    Some say that the `SCRIPT` tags should go at the end of the `BODY` section, like
    this:


    ```html

    <!DOCTYPE HTML>

    <HTML>

    <HEAD>

    <TITLE>A First Script</TITLE>

    </HEAD>

    <BODY>


    HTML GOES HERE. JAVSCRIPT GOES AFTER HTML


    <SCRIPT LANGUAGE = "Javascript">

    confirm("OK or Cancel?")

    </SCRIPT>

    </BODY>

    </HTML>

    ```


    We do it this way because the web page will load before any script gets read –
    if the tag is in the `HEAD` section, the script gets parsed before the CSS or
    HTML elements get loaded.


    Most of the time, script tags are better placed in the `HEAD` section, like this:


    ```html

    <!DOCTYPE HTML>

    <HTML>

    <HEAD>

    </HEAD>

    <BODY>

    </BODY>

    </HTML>

    <TITLE>A First Script</TITLE>

    <SCRIPT LANGUAGE = "Javascript">

    confirm("OK or Cancel?")

    </SCRIPT>

    ```


    ![](images/00003.jpeg)


    ### Exercise


    Using the code from the last lesson, take the code from the `BODY` and put it
    into the `HEAD` section so that it looks something like the code above. Then,
    change the `Confirm` box so it is an `alert` message


