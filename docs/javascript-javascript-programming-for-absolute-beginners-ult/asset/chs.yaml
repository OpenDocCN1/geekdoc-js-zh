  \n.\n[/content)\n\n这将为你获取最后的 4 个字符，在一种情况下，它们是 `.com`。之前，我们在邮箱地址中查找了 `@` 符号，但如果用户输入了多个\
  \ `@` 符号来试图欺骗你，会发生什么呢？使用 `indexOf` 只会告诉你第一次出现的位置，并在找到第一个时停止。如果你使用循环，配合 `IF` 语句并结合\
  \ `substr` 使用，你就可以找到该邮箱地址中所有 `@` 符号的出现位置。看这个示例：\n\n```javascript\nvar at_sign =\
  \ \"@meme@meme@.com@\";\nvar counter = 0;\nvar i;\nfor ( i=0; i < at_sign.length;\
  \ i++ ) {\n  var char = at_sign.substr( i, 1 );\n  if (char == \"@\" ) {\n    counter++;\n\
  \  }\n}\ndocument.write(\"number of times @ appears is: \" + counter);\n```\n\n\
  邮箱地址被设置为包含 4 个 `@` 符号。然后，我们设置了两个变量——一个是计数器，另一个名为 `i` 的循环变量。所有的字符串都包含一个名为 `length`\
  \ 的属性——字符串中字符的数量。这就是 `for` 循环中第一行的看起来所示：\n\n`for ( i=0; i < at_sign.length; i++\
  \ )`\n\n我们继续循环，直到变量 `i` 不小于存储在变量 `at_sign` 中的邮箱地址长度。每次循环都会将 `i` 变量的值加 1，我们可以在编写\
  \ `substr` 方法时使用它：\n\n`var char = at_sign.substr( i, 1 );`\n\n在第一次循环中，`i` 的值为 0，所以\
  \ `substr` 将读取 `substr(0,1)`。这告诉 JavaScript 从第一个字符开始并获取 1 个字符。在下一次循环中，变量将包含值 1，所以\
  \ `substr` 读取 `substr(1,1)`。它将从第 2 个字符开始并抓取 1 个字符。以此持续，每次循环都使用 `substr` 抓取单个字符。`IF`\
  \ 语句将继续检查该字符是否为 `@` 符号——如果是，`counter` 就会加 1。\n\n所以，如果你需要检查字符串中的所有字符，你需要使用 `substr`\
  \ 方法。\n\n最后，我们将查看 `Split` 和 `Join`。\n\n## 字符串 - Split and Join\n\n最后，如果你想分割一个文本字符串，你将使用\
