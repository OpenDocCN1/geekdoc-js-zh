  \ again. \n\"## 以下是需要翻译的文本\n[content]\n\n\n\n\n当网页设计师被要求创建按特定方式布局和设计的网页时，设计师必须获取这一构思并将其拆解成更小的部分，然后每个部分都必须翻译成计算机可以理解的内容——这意味着所有指令必须按照正确的顺序排列，并使用正确的语法。\n\
  \n网站的每个页面都是使用一系列指令构建的，每个位（bit）都有各自的指令，且都处于正确的顺序。无论是哪种浏览器，它都是代码翻译过程中最大的参与者之一，将代码转换为我们可以在屏幕上轻松查看、并且在某些情况下可以进行交互的内容。人们很容易忘记，如果代码没有浏览器，它就无非仅仅是一个文本文件；只有当这些文本被放入浏览器时，真正的魔术才会发生。当用户打开网页时，浏览器将获取\
  \ `HTML` 以及任何其他需要的编程语言并对它们进行解释。\n\n从技术上来说，`CSS` 和 `HTML` 都不算编程语言；它们是样式信息（`CSS`）和页面结构（`HTML`）。然而，在你真正理解\
  \ `JavaScript` 之前，你确实需要了解 `CSS` 和 `HTML` 的基础知识——这些是所有应用程序和网页的前端。\n\n在 20 世纪 90 年代初，唯一提供的网络语言是\
  \ `HTML`。每个网站都是逐页进行编码的，这是一项长期工作。幸运的是，从那时起有了很大进步，现在有多种编程语言可以使用。我们只对 `JavaScript`\
  \ 以及 `CSS` 和 `HTML` 感感兴趣。\n\n### 概述\n\n`HTML` 用于网站的基础结构，然后我们使用 `CSS` 和 `JavaScript`\
  \ 对其进行修改和增强：\n\n* `CSS` 控制布局、格式和整体呈现\n* `JavaScript` 控制所有不同元素的行为\n\n让我们更详细地查看每一个工具工具，以便你理解每种工具是如何让网站运行的。我们将从\
  \ `HTML` 开始：\n\n### HTML\n\n这是你所看到的每个网站的核心，无论它有多复杂，或者涉及多少种不同的技术。它是任何网页设计师应该学习的最重要技能之一，如果你正在寻找学习如何创建网页内容，它是正确的起点。它也非常容易学习。\n\
  \n`HTML` 意味着超文本标记语言（Hypertext Markup Language）。“标记”部分意味着 `HTML` 不仅仅是一种使用另一种语言来执行功能的语言；它还使用标签（tags）来标识内容。可以这样想：拿一篇典型的文章，对页面内容进行标记。你可能会得出一个标题、一个副标题、正文，可能还有页面底部几张带有更多文本的图片。\n\
  \n标记语言（如 `HTML`）的工作原理相同，不同在于它不是使用文本来标记章节，而是使用代码。更具体地说，它使用 `HTML` 标签，也称为元素（elements）。标签的名称非常直观——标题标签、图像标签、段落标签等。\n\
  \n每个网站都有几个这样的标签，每个标签都表示页面上的内容类型。内容被封装在相关的标签中。例如，你现在正在阅读的所有都是一个段落的一部分。如果我们为这个网页编写代码，段落将以段落标签\
  \ `<p>` 开头。左括号表示标签，字母告诉计算机这是一个段落，而不是其他类型的内容。\n\n当一个标签被打开时，紧随其后的内容被认为包含在标签中，直到标签被关闭。当段落结束时，你将得到一个结束标签\
  \ `</p>`。它看起来和起始标签相同，但多了一个反斜杠。看看这个例子：\n\n```html\n<p>This would be a paragraph.</p>\n\
  ```\n\n通过 `HTML`，你可以添加标题、制作列表、控制换行、格式化你的段落、强调文本、插入图像、构建表格、控制样式、创建特殊字符以及许多其他功能。\n\
  \n### CSS\n\n当 `HTML` 构成网站的结构时，`CSS` 就是样式出现的地方。颜色、精美的字体、背景和动画都归功于 `CSS`。它设定了基调，这使得\
  \ `CSS` 变得非常强大，是任何网页设计师值得学习的极其强大的工具。`CSS` 也让网站能够适应不同尺寸的屏幕和所有类型的设备。\n\n虽然我不能向你展示\
  \ `CSS` 能做什么，但我可以要求你发挥想象力。我想让你想象一个网页——首先是纯 `HTML` 的，其次是带有许多色彩和花哨文字、漂亮背景图片的、带有 `CSS`\
  \ 和 `HTML` 的网页。\n\n在只有 `HTML` 的页面上，你将拥有所有内容但没有样式，只有纯文本。看起来精美的那个页面，你拥有文本和所有的样式，如果你能想象出来，这就是它们之间的区别。\n\
  \n简单来说，`CSS` 不非一组用于给标签分配属性的规则——专用于单个或多个标签、整个文档或多个文档。我们之所以有 `CSS`，是因为随着文本字体和不同颜色的演变，设计师们一直在努力让\
  \ `HTML` 保持完全适应。\n\n当 `HTML` 开发时，它并没有被设计成一种显示物理格式信息的方法。它只被设计为构建网页文档内容的方法，例如段落相对于标题。因为\
  \ `HTML` 无法跟上设计中的所有新功能，`CSS` 最终于 1996 年被出来。从那时起，我们可以从 `HTML` 文档中移除所有格式，并将其存储在 `CSS`\
  \ 中。\n\n`CSS` 代表层联样式表（Cascading Style Sheets），“样式表”一词是指对文档的引用。所有网页浏览器都有自己的默认样式表，因此每个网站都至少使用一个，无论设计师是否做了任何添加。\n\
  \n“层联”（cascading）这个词的含义在于：大多数网页设计师和开发者从具有默认样式的样式表开始，这些样式会被自定义的 `CSS` 覆盖。想象一下瀑布，想象水向下流动，碰到所有的石头。只有它最后碰到的那个石头会影响它的流向，`CSS`\
  \ 也是如此——最后的样式表才是告诉浏览器重要的指令。\n\n### JavaScript\n\n在三种语言中，`JavaScript` 是最复杂的，第一个测试版本直到\
  \ 1995 年才发布。如今，所有现代浏览器都支持 `JavaScript`，互联网上的几乎每个网站都使用它来实现更复杂强大的功能。\n\n简单来说，它是一种允许开发者设计交互式网站的编程语言。`JavaScript`\
  \ 的一个简单例子是你屏幕上看到的任何弹出框。当你上次在在线表单中输入某些信息时，屏幕上弹出一个确认框；它上面可能有几个按钮，也许“确定”和“取消”。那都是归功于\
  \ `JavaScript`。正如你在这本书的其他部分学到的，你可以在代码中使用 `IF … ELSE` 语句，告诉计算机当用户点击框上的一个按钮时执行某些操作，当点击另一个按钮时执行另一项操作。\n\
  \n\n\n\n\n坦率地说，学习任何语言的编程最难的部分其实是开始。一旦你开始，一旦你掌握了所有基础知识，你就会发现转向高级编程要容易得多。\n\n# JavaScript\
