    -   [设置背景图片]\n-   [删除除第一行外的所有表格行]\n-   [禁用链接]\n-   [更改 CSS 类]\n-   [设置背景颜色]\n\
    -   [添加前一组元素]\n-   [添加指定类]\n-   [添加两个类]\n-   [插入一些 HTML]\n-   [计算每个元素]\n-   [计算所有元素]\n\
    -   [为段落元素添加动画]\n\n# JAVASCRIPT 编程练习\n\n-   [显示当前日期和时间]\n-   [打印内容]\n-   [显示当前日期]\n\
    -   [计算三角形面积]\n-   [检查给定年份是否是闰年]\n-   [计算乘法和除法]\n-   [转换温度]\n-   [找出最大值]\n-  \
    \ [反转给定字符串]\n-   [替换每个字符]\n-   [将首字母大写]\n-   [将数字转换为小时和分钟]\n-   [计算给定字符串中的元音字母]\n\
    -   [创建新字符串]\n-   [连接两个字符串]\n-   [移动最后三个字符]\n-   [计算总和]\n-   [两个数字相加](ADD%20TWO%20DIGITS)\n\
    -   [检查给定年份是否是闰年](CHECK%20WHETHER%20A%20GIVEN%20YEAR%20IS%20A%20LEAP)\n-   [检查给定正数](CHECK%20GIVEN%20POSITIVE%20NUMBER)\n\
    -   [检查字符串是否以 'JAVA' 开头](CHECK%20A%20STRING%20STARTS%20WITH%20'JAVA')\n-   [检查两个给定整数值](CHECK%20TWO%20GIVEN%20INTEGER%20VALUES)\n\
    -   [找出最接近 100 的值](FIND%20A%20VALUE%20WHICH%20IS%20NEAREST%20TO%20100)\n\n# JQUERY\
    \ 编程练习\n\n## 检查 jQuery 是否加载\n\n### HTML 代码\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <script src=\"//code.jquery.com/jquery-1.11.1.min.js\"></script>\n<meta charset=\"\
    utf-8\">\n<title>Test if jQuery is loaded</title>\n</head>\n<body>\n<p>Click me!</p>\n\
    </body>\n</html>\n```\n\n### JAVASCRIPT 代码\n\n```\n$(\"p\").bind(\"click\", function(){\n\
    \  $( \"This is a click Event\").appendTo( \"body\" );\n});\n\n$(\"p\").bind(\"\
    dblclick\", function(){\n  $( \"This is a double-click Event\" ).appendTo( \"\
    body\" );\n});\n```\n\n### 输出\n\nClick me!\n\nThis is a click Event\n\n## 滚动到页面顶部\n\
    \n### HTML 代码\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"//code.jquery.com/jquery-1.11.1.min.js\"\
    ></script>\n<meta charset=\"utf-8\">\n<title>Scroll to the top of the page with\
    \ jQuery</title>\n</head>\n<body>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n\
    <p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n\
    <p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n\
    <p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<a href='#top'>Go\
    \ Top</a>\n</body>\n</html>\n```\n\n### JAVASCRIPT 代码\n\n```\n$(\"a[href='#top']\"\
    ).click(function() {\n  $(\"html, body\").animate({ scrollTop: 0 }, \"slow\");\n\
    \  return false;\n});\n```\n\n## 禁用右键菜单\n\n### 在 HTML 页面中\n\n#### HTML 代码\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"//code.jquery.com/jquery-1.11.1.min.js\"\
    ></script>\n<meta charset=\"utf-8\">\n<title>Disable right click menu in html\
    \ page using jquery</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n#### JAVASCRIPT\
    \ 代码\n\n```\n$(document).bind(\"contextmenu\",function(e){\n    return false;\n\
    });\n```\n\n## 禁用/启用表单提交按钮\n\n### HTML 代码\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <script src=\"//code.jquery.com/jquery-1.11.1.min.js\"></script>\n\t<meta charset=\"\
    utf-8\">\n\t<title>Disable/enable the form submit button</title>\n</head>\n<body>\n\
    <input id=\"accept\" name=\"accept\" type=\"checkbox\" value=\"y\"/>I accept<br>\n\
    <input id=\"submitbtn\" disabled=\"disabled\" name=\"Submit\" type=\"submit\"\
    \ value=\"Submit\" />\n</body>\n</html>\n```\n\n### JAVASCRIPT 代码\n\n```\n$('#accept').click(function()\
    \ {\n            if ($('#submitbtn').is(':disabled')) {\n        $('#submitbtn').removeAttr('disabled');\n\
    \    } else {\n        $('#submitbtn').attr('disabled', 'disabled');\n    }\n\
    });\n```\n\n### 输出\n\n![](img/754f8a8c8c8e54f1effee3be00683eac_9_0.png)\n\n##\
    \ 使用 jQuery 实现文本闪烁\n\n### HTML 代码\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script\
    \ src=\"//code.jquery.com/jquery-1.11.1.min.js\"></script>\n<meta charset=\"utf-8\"\
    >\n<title>Blink text using jQuery</title>\n</head>\n<body>\n<p>jQuery <span class=\"\
    blink\">Exercises</span> and Solution</p>\n</body>\n</html>\n```\n\n### JAVASCRIPT\
    \ 代码\n\n```\nfunction blink_text() {\n    $('.blink').fadeOut(500);\n    $('.blink').fadeIn(500);\n\
    }\nsetInterval(blink_text, 1000);\n```\n\n## 创建表格效果\n\n### 类似斑马条纹\n\n### HTML\
    \ 代码\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"//code.jquery.com/jquery-1.11.1.min.js\"\
    ></script>\n<meta charset=\"utf-8\">\n<style type=\"text/css\">.table_style {\n\
