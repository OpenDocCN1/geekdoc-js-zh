- md: "# JAVASCRIPT CODING EXERCISES\n\nCODING FOR BEGINNERS WITH HANDS ON PROJECTS\n\
    \nWRITTEN BY JJ TAM\n\nEDITED BY TAM SEL\n\n# JQUERY CODING EXERCISES\n\nCODING\
    \ FOR BEGINNERS WITH HANDS ON PROJECTS\n\n![](img/754f8a8c8c8e54f1effee3be00683eac_0_0.png)\n\
    \nWRITTEN BY JJ TAM\n\nEDITED BY TAM SEL\n\n# JQUERY AND JAVASCRIPT CODING EXERCISES\n\
    \n# CODING FOR BEGINNERS\n\nJJ TAM\n\n# JQUERY CODING EXERCISES\n\n- [CHECK JQUERY\
    \ IS LOADED]\n- [SCROLL TO THE TOP]\n- [DISABLE RIGHT CLICK MENU]\n- [BLINK TEXT]\n\
    - [CREATE TABLE EFFECT]\n- [MAKE FIRST WORD BOLD]\n- [UNDERLINE ALL THE WORDS]\n\
    - [CHANGE BUTTON TEXT USING JQUERY]\n- [ADD OPTIONS TO A DROP-DOWN LIST]\n- [SET\
    \ BACKGROUND-IMAGE]\n- [DELETE ALL TABLE ROWS EXCEPT FIRST ONE]\n- [DISABLE A\
    \ LINK]\n- [CHANGE A CSS CLASS]\n- [SET THE BACKGROUND COLOR]\n- [ADD THE PREVIOUS\
    \ SET OF ELEMENTS]\n- [ADD A SPECIFIED CLASS]\n- [ADD TWO CLASSES]\n- [INSERT\
    \ SOME HTML]\n- [COUNT EVERY ELEMENT]\n- [COUNT ALL ELEMENTS]\n- [ANIMATE PARAGRAPH\
    \ ELEMENT]\n\n# JAVASCRIPT CODING EXERCISES\n\n- [DISPLAY THE CURRENT DAY AND\
    \ TIME]\n- [PRINT THE CONTENTS]\n- [DISPLAY THE CURRENT DATE]\n- [FIND THE AREA\
    \ OF A TRIANGLE]\n- [CHECK WHETHER A GIVEN YEAR IS A LEAP YEAR]\n- [CALCULATE\
    \ MULTIPLICATION AND DIVISION]\n- [CONVERT TEMPERATURES]\n- [FIND THE LARGEST]\n\
    - [REVERSE A GIVEN STRING]\n- [REPLACE EVERY CHARACTER]\n- [CAPITALIZE THE FIRST\
    \ LETTER]\n- [CONVERT NUMBER TO HOURS AND MINUTES]\n- [COUNT VOWELS IN A GIVEN\
    \ STRING]\n- [CREATE A NEW STRING]\n- [CONCATENATE TWO STRINGS]\n- [MOVE LAST\
    \ THREE CHARACTER]\n- [COMPUTE THE SUM]\n- [ADD TWO DIGITS](ADD%20TWO%20DIGITS)\n\
    - [CHECK WHETHER A GIVEN YEAR IS A LEAP](CHECK%20WHETHER%20A%20GIVEN%20YEAR%20IS%20A%20LEAP)\n\
    - [CHECK GIVEN POSITIVE NUMBER](CHECK%20GIVEN%20POSITIVE%20NUMBER)\n- [CHECK A\
    \ STRING STARTS WITH 'JAVA'](CHECK%20A%20STRING%20STARTS%20WITH%20'JAVA')\n- [CHECK\
    \ TWO GIVEN INTEGER VALUES](CHECK%20TWO%20GIVEN%20INTEGER%20VALUES)\n- [FIND A\
    \ VALUE WHICH IS NEAREST TO 100](FIND%20A%20VALUE%20WHICH%20IS%20NEAREST%20TO%20100)\n\
    \n# JQUERY CODING EXERCISES\n\n## Check jQuery is loaded\n\n### HTML CODE\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"//code.jquery.com/jquery-1.11.1.min.js\"\
    ></script>\n<meta charset=\"utf-8\">\n<title>Test if jQuery is loaded</title>\n\
    </head>\n<body>\n<p>Click me!</p>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\
    \n```\n$(\"p\").bind(\"click\", function(){\n  $( \"This is a click Event\").appendTo(\
    \ \"body\" );\n});\n\n$(\"p\").bind(\"dblclick\", function(){\n  $( \"This is\
    \ a double-click Event\" ).appendTo( \"body\" );\n});\n```\n\n### OUTPUT\n\nClick\
    \ me!\n\nThis is a click Event\n\n## Scroll to the top of the page\n\n### HTML\
    \ CODE\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"//code.jquery.com/jquery-1.11.1.min.js\"\
    ></script>\n<meta charset=\"utf-8\">\n<title>Scroll to the top of the page with\
    \ jQuery</title>\n</head>\n<body>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n\
    <p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n\
    <p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n\
    <p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<p>jquery</p>\n<a href='#top'>Go\
    \ Top</a>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\n```\n$(\"a[href='#top']\"\
    ).click(function() {\n  $(\"html, body\").animate({ scrollTop: 0 }, \"slow\");\n\
    \  return false;\n});\n```\n\n## Disable right click menu\n\n### In html page\n\
    \n#### HTML CODE\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"//code.jquery.com/jquery-1.11.1.min.js\"\
    ></script>\n<meta charset=\"utf-8\">\n<title>Disable right click menu in html\
    \ page using jquery</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n#### JAVASCRIPT\
    \ CODE\n\n```\n$(document).bind(\"contextmenu\",function(e){\n    return false;\n\
    });\n```\n\n## Disable/enable the form submit button\n\n### HTML CODE\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n<script src=\"//code.jquery.com/jquery-1.11.1.min.js\"\
    ></script>\n\t<meta charset=\"utf-8\">\n\t<title>Disable/enable the form submit\
    \ button</title>\n</head>\n<body>\n<input id=\"accept\" name=\"accept\" type=\"\
    checkbox\" value=\"y\"/>I accept<br>\n<input id=\"submitbtn\" disabled=\"disabled\"\
    \ name=\"Submit\" type=\"submit\" value=\"Submit\" />\n</body>\n</html>\n```\n\
    \n### JAVASCRIPT CODE\n\n```\n$('#accept').click(function() {\n            if\
    \ ($('#submitbtn').is(':disabled')) {\n        $('#submitbtn').removeAttr('disabled');\n\
    \    } else {\n        $('#submitbtn').attr('disabled', 'disabled');\n    }\n\
    });\n```\n\n### OUTPUT\n\n![](img/754f8a8c8c8e54f1effee3be00683eac_9_0.png)\n\n\
    ## Blink text using jQuery\n\n### HTML CODE\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<script src=\"//code.jquery.com/jquery-1.11.1.min.js\"></script>\n<meta\
    \ charset=\"utf-8\">\n<title>Blink text using jQuery</title>\n</head>\n<body>\n\
    <p>jQuery <span class=\"blink\">Exercises</span> and Solution</p>\n</body>\n</html>\n\
    ```\n\n### JAVASCRIPT CODE\n\n```\nfunction blink_text() {\n    $('.blink').fadeOut(500);\n\
    \    $('.blink').fadeIn(500);\n}\nsetInterval(blink_text, 1000);\n```\n\n## Create\
    \ table effect\n\n### Like Zebra Stripes\n\n### HTML CODE\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<script src=\"//code.jquery.com/jquery-1.11.1.min.js\"></script>\n\
    <meta charset=\"utf-8\">\n<style type=\"text/css\">.table_style {\n    width:\
    \ 500px;\n    margin: 0px auto;\n}\ntable{\n    width: 100%;\n    border-collapse:\
    \ collapse;\n}\ntable tr td{\n    width: 50%;\n    border: 1px solid #ff751a;\n\
    \    padding: 5px;\n}\ntable tr th{\n    border: 1px solid #79ff4d;\n    padding:\
    \ 5px;\n}\n.zebra{\n    background-color: #ff0066;\n}\n</style>\n<title>Create\
    \ a Zebra Stripes table effect</title>\n</head>\n<body>\n<div class=\"table_style\"\
    >\n<table>\n<tr>\n<th>Student Name</th>\n<th>Marks in Science</th>\n</tr>\n<tr>\n\
    <td>James</td>\n<td>85.00</td>\n</tr>\n<tr>\n<td>David</td>\n<td>92.00</td>\n\
    </tr>\n<tr>\n<td>Arthur</td>\n<td>79.00</td>\n</tr>\n<tr>\n<td>George</td>\n<td>82.00</td>\n\
    </tr>\n</table>\n</div>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\n```\n\
    $(document).ready(function(){\n    $(\"tr:odd\").addClass(\"zebra\");\n});\n```\n\
    \n### OUTPUT\n\n| Student Name | Marks in Science |\n|---|---|\n| James | 85.00\
    \ |\n| David | 92.00 |\n| Arthur | 79.00 |\n| George | 82.00 |\n\n## Make first\
    \ word bold\n\n### HTML CODE\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script\
    \ src=\"//code.jquery.com/jquery-1.11.1.min.js\"></script>\n  <meta charset=\"\
    utf-8\">\n  <title>Make first word bold of all elements</title>\n</head>\n<body>\n\
    \  <p>PHP Exercises</p>\n  <p>Python Exercises</p>\n  <p>JavaScript Exercises</p>\n\
    \  <p>jQuery Exercises</p>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\n```\n\
    $('p').each(function(){\n    var pdata = $(this);\n    pdata.html( pdata.text().replace(/(^\\\
    w+)/,'$1') );\n});\n```\n\n### OUTPUT\n\n**PHP** Exercises\n\n**Python** Exercises\n\
    \n**JavaScript** Exercises\n\n**jQuery** Exercises\n\n## Underline all the words\n\
    \n### HTML CODE\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"https://code.jquery.com/jquery-git.js\"\
    ></script>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width\"\
    >\n<title>Underline all words of a text through jQuery</title>\n</head>\n<body>\n\
    <p>The best way we learn anything is by practice and exercise questions</p>\n\
    </body>\n</html>\n```\n\n### CSS CODE\n\n```\np span{\n    text-decoration: underline;\n\
    }\n```\n\n### JAVASCRIPT CODE\n\n```\n$('p').each(function() {\n\n    var text_words\
    \ = $(this).text().split(' ');\n\n    $(this).empty().html(function() {\n\n  \
    \      for (i = 0; i < text_words.length; i++) {\n            if (i === 0) {\n\
    \                $(this).append('<span>' + text_words[i] + '</span>');\n     \
    \       } else {\n                $(this).append(' <span>' + text_words[i] + '</span>');\n\
    \            }\n        }\n    });\n});\n```\n\n### OUTPUT\n\nThe best way we\
    \ learn anything is by practice and excercise\n\n## Change button text using jQuery\n\
    \n### HTML CODE\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"https://code.jquery.com/jquery-git.js\"\
    ></script>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width\"\
    >\n<title>Change button text using jQuery.</title>\n</head>\n<body>\n<input type='button'\
    \ value='Cancel' id='button1'>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\
    \n```\n//Uncomment the following code and see the changes.\n\n//$(\"#button1\"\
    ).prop('value', 'Save');\n```\n\n## Add options to a drop-down list using jQuery\n\
    \n### HTML CODE\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"https://code.jquery.com/jquery-git.js\"\
    ></script>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width\"\
    >\n<title>Add options to a drop-down list using jQuery.</title>\n</head>\n<body>\n\
    <p>List of Colors :</p>\n<select id='myColors'>\n<option value=\"Red\">Red</option>\n\
    <option value=\"Green\">Green</option>\n<option value=\"White\">White</option>\n\
    <option value=\"Black\">Black</option>\n</select>\n</body>\n</html>\n```\n\n###\
    \ JAVASCRIPT CODE\n\n```\nvar myOptions = {\n    val1 : 'Blue',\n    val2 : 'Orange'\n\
    };\nvar mySelect = $('#myColors');\n$.each(myOptions, function(val, text) {\n\
    \    mySelect.append(\n        $('<option></option>').val(val).html(text)\n  \
    \  );\n});\n```"
  mdcn: "\n# JAVASCRIPT 编程练习\n\n面向初学者的实践项目编程\n\n作者：JJ TAM\n\n编辑：TAM SEL\n\n# JQUERY\
    \ 编程练习\n\n面向初学者的实践项目编程\n\n![](img/754f8a8c8c8e54f1effee3be00683eac_0_0.png)\n\n\
    作者：JJ TAM\n\n编辑：TAM SEL\n\n# JQUERY 与 JAVASCRIPT 编程练习\n\n# 初学者编程\n\nJJ TAM\n\n\
    # JQUERY 编程练习\n\n-   [检查 jQuery 是否加载]\n-   [滚动到页面顶部]\n-   [禁用右键菜单]\n-   [文本闪烁效果]\n\
