  md: "# Find a value which is nearest to 100\n\n# HTML CODE\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width\">\n    <title>JavaScript program to find a value which is\
    \ nearest to 100 from two different given integer values.</title>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n# JAVASCRIPT CODE\n\n```\nfunction near_100(x, y) {\n\
    \    if (x != y)\n    {\n        x1 = Math.abs(x - 100);\n        y1 = Math.abs(y\
    \ - 100);\n\n        if (x1 < y1)\n        {\n            return x;\n        }\n\
    \        if (y1 < x1)\n        {\n            return y;\n        }\n        return\
    \ 0;\n    }\n    else\n        return false;\n}\n```"
