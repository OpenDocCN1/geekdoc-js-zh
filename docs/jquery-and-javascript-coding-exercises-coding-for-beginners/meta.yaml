    </tr>\n<tr>\n<td>Arthur</td>\n<td>79.00</td>\n</tr>\n<tr>\n<td>George</td>\n<td>82.00</td>\n\
    </tr>\n</table>\n</div>\n</body>\n</html>\n```\n\n### JAVASCRIPT 代码\n\n```\n$(document).ready(function(){\n\
    \    $(\"tr:odd\").addClass(\"zebra\");\n});\n```\n\n### 输出\n\n| 学生姓名 | 科学成绩 |\n\
    |---|---|\n| James | 85.00 |\n| David | 92.00 |\n| Arthur | 79.00 |\n| George\
    \ | 82.00 |\n\n## 使第一个单词加粗\n\n### HTML 代码\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
