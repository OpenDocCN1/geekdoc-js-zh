    $PAGE->requires->js(''/cook/yui_eventbasic.js'');

    echo $OUTPUT->header();

    ?>

    <form>

    <input type="button" id="btn1" value="Button 1" />

    </form>

    <?php

    echo $OUTPUT->footer();

    ?>

    ```'
