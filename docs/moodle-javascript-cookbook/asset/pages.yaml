  md: '# How it works...


    The user can type into the box to receive auto-complete suggestions as before,
    but may now use the combo style drop-down button instead to see a list of suggestions.


    When the user clicks the drop-down, the click event is fired.


    This click event does the following:


    +   - Hides the drop-down menu if it is displayed, which allows the user to toggle
    this list display/off.

    - If it is not displayed, it sets the focus to the box (allow the user to continue
    typing), and execute a blank query on the aut-complete widget, which will display
    the list of suggestions. Note that we explicitly enabled this blank query earlier
    when we defined the AutoComplete widget with the "minQueryLength: 0" option, which
    allowed queries of length 0 and after.


    # Displaying auto-updating data


    Another useful interface is the ability to display data that is constantly updated
    at a set interval. For example, this could be used to update a list of news headlines
    every five minutes, or update the display of live stock data every minute.


    In this recipe, we will take the basic example of a clock, displaying the full
    date and time on the page, and update it every second using the polling extension
    to the DataSource utility. This technique can be used to display any data from
    any data source, and update it as frequently as we like.


    # How to do it...


    In this example, we will set up a very simple PHP page, autoupdate.php, containing
    only one placeholder which we will display the current date and time:


    ```

    <?php

    require_once(dirname(__FILE__) . ''../config.php'');

    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    $PAGE->set_url(''/cook/autoupdate.php'');

    $PAGE->requires-js(''/cook/autoupdate.js'', true);

    echo OUTPUT->header();

    ?>

    <div id="txtUpdate"></div>

    <?php

    echo OUTPUT->footer();

    ?>

    ```'
