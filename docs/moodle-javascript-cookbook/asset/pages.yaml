    # How it works


    We used the addRule method of QuickForm to define the validation requirements:


    ```

    $mform->addRule(''mytext1'', ''Required'', ''required'', null, ''client'');

    ```


    This is controlled by the five arguments we passed to the addRule method:


    | Argument number | Description | Value |

    |---|---|---|n| 1 | The name of the element to apply the rule to | mytext1 |

    | 2 | The text to be displayed when validation fails | Required |

    | 3 | The name of the rule to be applied | required |

    | 4 | The format options of the rule (note that the required rule has no options,
    so here we pass a null value) | null |

    | 5 | Describes how to perform validation. This can be either client or server.
    Using client forces the validation to occur within the browser using JavaScript
    | client


