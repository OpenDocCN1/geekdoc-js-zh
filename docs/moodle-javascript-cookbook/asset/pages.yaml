    # How it works...


    We used the *Y.on* method to assign the events to their respective elements. When
    the page is executed, YUI manages these in a browser-specific manner, firing our
    events at the earliest but safest possible opportunity.


    When the events are fired, a call is made to our `printMessage` function, which
    prints a message, prefixed with a number indicating the event was fired. This
    is achieved by keeping a count with the global variable `order`, which starts
    at *1*. Every time we print a message, we include this number in the text, and
    increase its value by one, ready for the next message to be displayed.


