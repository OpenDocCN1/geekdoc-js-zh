    \ method is an anonymous function. This is just like a regular JavaScript function,\
    \ except that it has no name specified; hence it is \"anonymous\". A name is not\
    \ required, as it is not referred to again, it is simply passed directly to the\
    \ use method. This function accepts a single input parameter Y, which will be\
    \ a reference to the new instance of the YUI object. (Note that the use method\
