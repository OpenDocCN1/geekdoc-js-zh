  md: '# Enhancing Page Elements


    In this chapter, we will cover:


    +   - Adding a text box with auto-complete

    - Adding a combo box with auto-complete

    - Displaying auto-updating data

    - Enabling resizable elements

    - Adding custom tooltips

    - Adding custom button controls


    # Introduction


    The Yahoo! UI Library (YUI) offers a range of widgets and utilities to bring modern
    enhancements to your traditional page elements. In this chapter, we will look
    at a selection of enhancements, including features often seen on modern interactive
    interfaces, as:


    +   - Auto-complete: This feature suggests possible values to the user by searching
    against a list of suggestions as they start typing. We will look at two different
    ways of using this. First, by providing suggestions as the user types into a text
    box, and second, by providing a list of possible values for them to select from
    a combo box.

    - Auto-update: This technique will allow us to update an area of the page based
    on a timed interval, which has many uses as we''ll see. In this example, we will
    look at how to create a clock by updating the page at one second intervals. This
    technique could also be used, for example, to update a news feed every minute,
    or update stock information every hour.'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'Resizable elements: A simple enhancement allows users to dynamically resize
    elements to suit their needs. This could be applied to elements containing a significant
    amount of text which would allow the user to control the width of the text to
    suit their personal preference for ideal readability.


    Custom tooltips: Tooltips appear when hovered, displaying the associated title
    or alternative text (that is, a description of an image or the title of a hyperlink).
    This enhancement allows us to have more control over the look of the tooltips
    making them more visually appealing and more consistent with the overall look
    and feel of our page.


    Custom buttons: This enhancement allows us to completely restyle button elements,
    modifying their look and feel to be consistent with the rest of our page. This
    also allows us to have a consistent button style across different platforms and
    web browsers.


    > We will once again be using YUI Version 2 widgets and utilities the YUI Version
    3 framework. At the time of writing, YUI2 widgets have been ported to YUI3. This
    method allows us convenience of the improvements afforded by the YUI3 environment
    combined with the features of the widgets from YUI.


    # Adding a text box with auto-complete


    A common feature of web forms is the ability to provide suggestions as the user
    types, based on a list of possible values. In this example, we enhance a HTML
    input text element with this feature.


    This technique is useful in situations where we wish to offer suggestions to the
    user that they may or not choose to select, that is, suggesting existing tags
    to be applied to a new blog post. They can either select a suggested value that
    matches one they have started typing, or simply continue typing a new, unused
    tag.


    # How to do it...


    First, set up a basic Moodle page in the usual way. In this example, we create
    autocomplete.php with the following content:


    ```

    <?php

    require_once(dirname(__FILE__) . ''/../config.php'');


    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    $PAGE->set_url(''/cook/autocomplete.php'');

    $PAGE->requires_js(''/cook/autocomplete.js'', true);


    ?>

    ```'
  merge: -1
