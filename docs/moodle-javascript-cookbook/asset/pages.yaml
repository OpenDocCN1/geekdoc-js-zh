  md: '# Moodle and Yahoo! User Interface Library (YUI)


    If we take the example of a navigation control in the form of a list of links,
    we could implement a click event for each link by manually registering the event
    against the ID of the element. While this may be fine for a handful of links,
    as the list starts to get larger it becomes very cumbersome to manage these events.
    The more links there are, the more it becomes prone to mistakes and bugs. Would
    you want to write (and manage) code to register click events to 50 links by hand
    if you didn''t have to


    Fortunately, it happens that the YUI has a solution for just this type of problem,
    namely Event Delegation.


    **Event delegation** is a technique whereby we can designate a parent element
    to handle its children elements. Picking our example of a list of links, this
    means we can use the element containing our list to manage the events of the list
    in that list.


    In this case, we use event delegation to implement a click event handler for each
    one of a list of links. Our event handler will display an alert showing which
    link was clicked. Using this method we can add many links into the list as we
    want at any later time, avoiding the need to add or change any of our JavaScript
    code when we do so.


    # Getting ready


    We start by creating a PHP file `yui_delegation.php` with the following content:


    ```

    <?php

    require_once(dirname(__FILE__) . ''../config.php'');

    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    $PAGE->set_url(''/cook/yui_delegation.php'');

    $PAGE->requires-js(''/cook/yui_delegation.js'');

    echo $OUTPUT->header();

    <div id="container">

    <ul>

    <li id="li-1"><a href="#">Item 1</a></li>

    <li id="li-2"><a href="#">Item 2</a></li>

    <li id="li-3"><a href="#">Item 3</a></li>

    <li id="li-4"><a href="#">Item 4</a></li>

    <li id="li-5"><a href="#">Item 5</a></li>

    </ul>

    </div>

    <?php

    echo $OUTPUT->footer();

    ?>

    ```


