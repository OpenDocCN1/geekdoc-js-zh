    # How it works...


    First, we download the script.aculo.us files and save them in a folder named scriptaculous
    alongside our Moodle files in the cook sub-directory.


    Next, we create a PHP file where we will load the necessary JavaScript files.
    They are, in order:


    +   - /cook/prototype.js

    - /cook/scriptaculous/scriptaculous.js

    - /cook/scriptaculous/effects.js

    - /cook/external_scriptaculous.js


    We now add a div tag to the body of the PHP page, which contains some sample text.
    We apply the shake animation effect to this element, so we add an ID to the tag
    for future reference.


    Finally, we add some code to our JavaScript file external_scriptaculous.js. We
    set up a page load function, using Prototype as in the previous recipe. Inside
    this function, we will use script.aculo.us to apply a shake animation effect to
    our div element.'
