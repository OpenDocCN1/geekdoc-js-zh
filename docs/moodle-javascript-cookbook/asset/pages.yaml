  md: '# Moodle Forms Validation


    The first argument must be an array of the names of the two elements for comparison.


    The format option is in the form of a string which specifies the type of comparison
    to apply. In this example, we used eq (==), which specifies that the two fields
    must be equal. Each option has both a keyword and symbolic representation.


    The following is a list of possible format options for this type:


    | Format option | Description |

    |--- |--- |

    | eq == | The first element''s value is equal to the second element''s value |

    | eq != | The first element''s value is not equal to the second element''s value
    |

    | gt > | The first element''s numeric value is greater than the second element''s
    numeric value |

    | gt >= | The first element''s numeric value is greater or equal to the second
    element''s numeric value |

    | lt < | The first element''s numeric value is less than the second element''s
    numeric value |

    | lte <= | The first element''s numeric value is less than or equal to the second
    element''s numeric value


    Finally, the fifth argument must be set to server as the Moodle forms API does
    not support client-side comparisons.


