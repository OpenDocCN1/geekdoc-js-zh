  md: '# Moodle and Yahoo! User Interface Library (YUI)


    Here, we can see that our code has successfully initialized the YUI 3.2.0 environment
    and is ready to start using the features available within the YUI and its additional
    modules.


    # How it works...


    We have created a new instance of the global object YUI, and called the use method,
    passing in an anonymous function that contains the code we wish to run. When the
    new instance of the YUI object is fully loaded, it makes a call to our anonymous
    function, and our code is executed.


    In this example, our code displays a short message containing the version number
    of the YUI instance we created, confirming that we have a fully YUI 3 environment
    as a basis to implement further YUI features.


    # Loading additional YUI modules


    YUI has a host of all additional modules providing a wide range of functionalities.
    Some examples of commonly used functionalities provided by additional modules
    include:


    +   * Animation

    * Drag and drop

    * Manipulating DOM elements

    * Handling DOM events (this is an input button''s "click")

    * Handling data (JSON/XML)


    For a current list of all the modules available, please refer to the Yahoo! Developer
    website for YUI 3 at the URL: http://developer.yahoo.com/yui/3/


    # How to do it...


    The loading of additional modules is achieved via the use method of the YUI object.
    In the previous recipe we learned to run our code using the use method with the
    following syntax:


    ```

    YUI().use

    (function(Y) { /* code to execute */ });

    ```


    Note that the use method takes an arbitrary long number of arguments (one or more)
    and only the last argument must be the anonymous function described in the previous
    recipe. The preceding arguments are a list of one or more modules you wish to
    load. So, for example, to load the Animation module (anim) and the DOM Utility
    module (event), we would use the following syntax in place of the preceding one:


    ```

    YUI().use

    ( "anim", "event", function(Y) { /* code to execute */ } );

    ```'
