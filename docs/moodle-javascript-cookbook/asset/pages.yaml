  md: '# Advanced Layout Techniques


    The concept of a navigation menu is well established in the realm of graphical
    user interfaces, and these tried and tested design patterns have been naturally
    carried over to the web. The three navigation design patterns that we cover are
    as follows:


    +   - Fly-out menu: A typical example of this design pattern is the context menu
    that is displayed when we-click an object (for example, a file or folder).

    - Drop-down menu: This design pattern will be familiar from us within desktop
    applications that is the menu at the top of an application. This typically includes
    items as File, Edit, Tools, and so on.

    - Tree-view menu: This type of menu design is often seen in system file browsers,
    as it is a natural way to display the hierarchy of files and folders that are
    contained within a file system.


    There are many ways to organize the display of content beyond a linear collection
    of blocks. Again, well established techniques from traditional graphical user
    interfaces can be employed, with such the following:


    +   - Tabbed content: The style of organizing content is most familiar with the
    tabbed features that are available in all of the most popular web browsers in
    use.

    - Modal windows: Most useful for displaying content that requires the immediate
    attention of the user. It appears above all other content and must be acknowledged
    by the user before they can resume interacting with the rest of the page.


    # Adding a fly-out navigation menu


    The ''fly-out menu'' style of navigation is one that many users will be familiar
    with. It has appeared in various guises in desktop operating system user interfaces
    and website user interfaces alike, allows a complex navigation tree to be displayed
    efficiently, and can be easily traversed by the user.


    A typical example of this type of menu is the content-sensitive menu that is displayed
    when right-clicking almost any object in modern operating systems, including files,
    folders, blocks of highlighted text, and even directly on the desktop.


    This example will build such a menu by extending existing HTML markup with the
    YUI module-menuv.


