    call and create a new DataSource_IO base on that.


    +   8. Define how DataSource_IO will return the data to us by plugging in the
    DataSourceXML-io-plugin and providing it with a schema that describes the format
    of the XML that is returned from the Moodle web service.


    +   9. Define a function loadXML that will perform the request. This is done using
    the sendRequest method of the DataSource_IO object. This takes one parameter in
    the form of an object containing the following three objects:


