  md: '# Integrating External Libraries


    We will look at how to set up some of the more commonly used frameworks, and implement
    a basic "content ready" event handler for each one, that is, setting up JavaScript
    code to run when a particular element is fully loaded by the browser. Finally,
    we will look at some extensions for the Prototype framework, namely the script.aculo.us
    add-on. We will finish by implementing the Lightbox image-viewer extension.


    # Adding the jQuery framework


    The jQuery framework is a very well established framework, which is actively maintained
    and supported. It has similar goals to that of the YUI, namely to wrap up the
    most frequently used features of JavaScript, such as manipulating DOM elements,
    into a reusable, clean, cross-platform library. You may decide to use this framework
    in situations where you have a significant amount of pre-written code for the
    jQuery framework and it is not feasible whatever reason to rewrite it as native
    JavaScript or YUI library code.


    In this recipe, we will set up the jQuery framework, and write a small piece of
    code to verify that the library has loaded and is working correctly.


    # Getting ready


    We begin downloading the latest version of the jQuery framework. Visit the jQuery
    homepage at http://jquery.com/, and download the latest version. Save this to
    a location within your Moodle installation. Then we save it in a directory named
    nook in the main Moodle site files directories.


    > If you will be using of any external framework, including jQuery, for more than
    one module, you may consider saving the framework files to a shared location,
    such as the /lib folder of your Moodle installation. This allows you to maintain
    one central copy of the framework, without the inconvenience of maintaining and
    updating multiple copies in different locations.


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_160_0.png)


    We now have a copy of the jQuery framework saved locally. We can create a page
    to initialize the framework and use some jQuery code to ensure that it is working
    correctly.


    # How to do it...


    First, we create a new PHP page where we will set up a basic Moodle programming
    environment, and include the necessary files to run jQuery code. In this example,
    we create a file named external_jquery.php with the following content:


    ```

    <php

    require_once(dirname(__FILE__) . ''/../config.php'');

    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    ```'
