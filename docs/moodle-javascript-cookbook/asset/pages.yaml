    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_24_0.png)


    Note that we see the **Home** button, meaning that the footer of the page has
    loaded. This is because because our code is executed at the end of the `<body>`
    tag.


    # How to do it...


    We have created a page based on the blank template we created in the first recipe
    of this chapter. To this, we have added the following line:


    ```

    $PAGE->requires->js(''/cook/alert.js'');

    ```


    # How it works...


    We are using the Page Requirements Manager, $PAGE, which is an object that contains
    various methods for setting up additional components for a page. Here we have
    called the $PAGE->requires->js method, and passed the path to our .js file as
    a parameter.


    Moodle then adds this script to the list of scripts to be included within the
    final rendered page. A `<script>` tag similar to the following will be inserted
    before closing the `<body>` tag:


    ```

    <script type="text/javascript" src="http://localhost/moodle/lib/javascript.php?file=%2PCook%2PAlert&amp;rev=1"></script>

    ```


    > The is inserted at the end of the <body> tag, inline with the current best practice,
    offering the best page performance and a simplification of handling DOM-ready
    events among other reasons. For a further discussion of this technique, please
    refer to the Yahoo! Developer Network resource at the:

    http://developer.yahoo.com/performance/rules.html#js_bottom


    This code must be included **after** the Moodle configuration file config.php
    has been included. This is where the $PAGE object is set up for us.


    12'
