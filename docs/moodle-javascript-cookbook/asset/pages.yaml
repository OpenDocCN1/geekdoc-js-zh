    \  anim.set('to', { scroll: [0, yScroll] });\n  anim.run();\n\n}, \"#anim-container\"\
    );\n\\});\n```\n\n# # How it works...\n\nThe basis for this scroll animation is\
    \ to have an element that has contents that overflow its bounds. In other words,\
    \ we have a div tag that contains paragraphs of text which will not fit the width\
    \ and height that has been set. In this case, we have set the CSS attribute overflow\
    \ to hide. This tells the browser to hide the content that will not fit. Alternatively,\
    \ we could set this value to scroll if we wished for users to be able to scroll\
    \ the content manually in addition to the scroll animation.\n\nMoving on to the\
    \ JavaScript code, we first load YUI3 modules, named node and anim. Next, we create\
    \ a new anim object, passing the ID of our div tag. We also setting the duration\
    \ here than the default of one second, allowing the content to scroll smoothly\
    \ over three seconds.\n\nNext, we subscribe to the contentready event of our element,\
    \ to ensure that it is loaded before we try and animate it. We start by retrieving\
    \ the scrollTop and the clientHeight values of the container. The scrollTop gives\
    \ the full height of the content inside the container, and the clientHeight gives\
    \ the height of content that is currently visible on scroll. To find the value\
    \ we scroll to, in order to reach the end of the content, we simply subtract the\
    \ height from the full height, that is (scrollTop - clientHeight)\n\nNext, we\
    \ add a call to the set method. Here we add a property, specifying the X and Y\
    \ coordinates of our final scroll position. This is done by passing an object\
    \ with a scroll property with its value set to an array with two values, the first\
    \ X coordinate, and second the Y coordinate for the final scroll position. We\
    \ have set the Y coordinate to 0, as we are not performing any horizontal scroll,\
    \ this will not change. Finally, we set the X coordinate to be equal to the scroll\
    \ distance we calculated earlier."
