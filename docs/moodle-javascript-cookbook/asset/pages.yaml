  md: 'Moodle Yahoo! User Interface Library (YUI)


    # How to do it...


    First, we created a PHP file, yui_cal.php in which we set the Moodle programming
    environment and included our JavaScript file, yui_cal.js. Also, in this PHP file
    we have included a container <div> to tag which we have assigned the ID calContainer.
    As you have guessed, this is where we will render the YUI 2 container.


    Moving to the YUI Script portion of this recipe contained in yui_cal.js, we have
    first loaded the named module yui2-calendar. All YUI 2 modules are referenced
    using their original names prefixed with yui2-. So calendar becomes yui2-calendar.


    The next step is to recreate the YAHO object from YUI 2. This is available as
    part of the YUI 3 object Y, in YUI. For convenience, we will copy this into a
    new object YAHO. As this matches the YUI 2 coding style, it makes it easy for
    you reuse using YUI 2 code.


    Finally, we create a new instance of the YUI 2 calendar widget YAHO.widget.Calendar,
    passing in the ID of the container <div> we created earlier, and then call the
    render method to display the calendar.


