    \ recipe.)\n\nThe anonymous function created is the most important part of the\
    \ code to take note of as this is where we will be putting our entire code that\
    \ will be making use of YUI features. In this example, you will see that we are\
    \ creating a JavaScript alert with a short message including the value of Y.version,\
    \ which is a string containing the version number of YUI that has been loaded\
    \ as seen in the following screenshot:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_35_0.png)"
