  md: '# Integrating External Libraries


    Now when we load this page in a web browser, we can see the shake effect in action.
    The following screenshots show a selection of frames from the shake effect animation.
    Note that the text we have applied the effect is shifted back and forth from left
    to right, as if the text is being shaken from side to side, before settling back
    to its original position:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_168_0.png)


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_168_1.png)


