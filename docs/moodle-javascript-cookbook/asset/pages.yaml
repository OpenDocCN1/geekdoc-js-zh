- img_proc: true
  md: 'We will be using the animation capabilities built into the YUI library, which
    is included in the standard Moodle installation. The basis for all animation consists
    of changing the value of an element''s attributes from one specific value to another,
    over a specified time span. For example, to fade-out an element we may change
    the element''s opacity from 100% to 0%, or to move an element''s position we may
    change its X and Y coordinates.


    > Carefully consider when and where to use animation. Ask yourself, “Will this
    improve the user experience?” Avoid unnecessary animations, as they will simply
    distract the user and degrade the usability of your page.


