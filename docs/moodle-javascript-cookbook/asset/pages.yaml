    # Retrieving layout strings from Moodle


    Moodle makes use of language strings to support full multilingual internationalization.
    In practice, this makes strings that are used within the interface are held in
    language-specific files. For example, the string "Submit assignment" may be held
    in the relevant English language file, and this string may be referred to indirectly
    via a short name key.


    This makes it vital to support additional languages by creating files for those
    languages. As the code refers to the strings via their short name keys, it is
    easy to simply switch the set of language files, and the code will pick up the
    strings in the new preferred language. This happens automatically when a user
    changes their preferred language settings.


    When providing textual feedback to our JavaScript code, we should make use of
    Moodle''s language string system. This ensures our code is inherently multilingual
    and makes it easy for a non-developer to provide a language translation of our
