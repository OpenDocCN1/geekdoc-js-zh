    MooTools is a compact, modular, Object-Oriented JavaScript framework designed
    for the intermediate to advanced JavaScript developer. It allows you to write
    powerful, flexible, and cross-browser code with its elegant, well-documented,
    and coherent API.


    MooTools is essentially another alternative to UI or jQuery. You may want to install
    this framework if you wish to make use of some third party code based on MooTools,
    which is either not or impractical to port to native JavaScript. You can also
    rewrite it using Mood''s preferred JavaScript framework, YUI.


    We will create a simple MooTools script which will display a MooTools alert when
    the domready event is fired.


    # Getting ready


    We begin by downloading the latest version of the MooTools framework. Visit the
    MooTools homepage at http://mootools.net/, navigate to the download page, and
    download a suitable version of MooTools. In this example, we use the compressed
    version of MooTools Core 1.3 without compatibility.


    Save this file to a location within your Moodle installation. In this example,
    we will save it in a directory named cook in the main Moodle sites files directory.


    # How to do it...


    Setup a PHP page, external_mootools.php, that will be used to set up MooTools
    with the following content:


    ```

    <?php


    require_once(dirname(__FILE__) . ''../config.php'');


    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    $PAGE->set_url(''/cook/external_mootools.php'');

    $PAGE->requires->js(''/cook/mootools-core-1.3.js'');

    $PAGE->requires->js(''/cook/external_mootools.js'');


    echo OUTPUT_header();

    echo OUTPUT_footer();

    ?>

    ```


    Finally, we create a JavaScript file, external_mootools.js, into which we will
    add a simple MooTools script, as follows:'
