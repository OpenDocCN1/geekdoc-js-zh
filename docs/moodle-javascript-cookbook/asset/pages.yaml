    # How it works...


    We start with a div element code in the HTML that we will move to a new position.


    Moving on to the JavaScript code, we begin by creating a new anim object, passing
    the ID of our div element to the node property.


    Next, we subscribe to the div''s contentready and add code that will only run
    when the div has been completely loaded in the browser.


    First, when the div is loaded completely, our code retrieves the current X and
    Y coordinates so we know where the motion will move. Next, we call the set method
    of our anim object which allows us to set the to property to new X and Y coordinates.
    We will move the div to the right by 200px, so we add that distance to its current
    X coordinate, and leave the Y coordinate unchanged, as we will not be moving the
    div up or down.


    When the div is loaded completely, our code retrieves the current X and Y coordinates,
    and modifies them to the new values. adding 200px to the X coordinate, and leaving
    the Y coordinate unchanged. This has the effect of animating the div moving 200px
    to the right, over the default time span of 1 second.


