  md: '# There''s more...


    When we load the PHP page in our browser, the PHP code loads all of the required
    JavaScript files in the specified order. This order ensures that the dependency
    hierarchy is correct, meaning that Prototype is loaded before the `script.aculo`
    add-ons, and finally our custom JavaScript that makes use of the `script.aculo`
    add-on gets loaded.


    When our custom script file, `external_scriptabulous.js`, is loaded, it registers
    the shake animation on our `div` element to fire when the page is loaded completely.
    Finally, when we see the entire page has loaded completely in the browser, the
    load event is fired and we see the shake animation applied to our `div` tag.


    # Adding image enlargement with Lightbox


    Lightbox 2 is a very popular script based on `script.aculo.us` (and in turn, based
    on Prototype) which provides a slick way to open links to high-resolution versions
    of thumbnail images in a modal window.


    In this recipe, we will integrate Lightbox 2 into our page, and add an image thumbnail
    to which we will apply the Lightbox 2 functionality.


    # Getting ready


    First, we need to obtain a copy of Lightbox 2, by visiting `http://www.huddledogether.com/projects/lightbox2/`,
    and navigating to the download section. Download the ZIP file of the latest version,
    and unpack it to the `cook` subdirectory of the Moodle installation used in this
    example, is `/path/to/moodle/cook/lightbox2`.


    > Lightbox 2 contains links to images that are relative to the page on which you
    have loaded the script. To ensure that these images are available to the script,
    copy the images folder to the same location as your script, in our example, `/path/to/moodle/cook/images`.'
