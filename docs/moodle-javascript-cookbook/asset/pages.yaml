    \ = e.results[0];\n      }\n    }\n  };\n\n  var id = dataSource.setInterval(1000,request);\n\
    });\n```\n\nWe have a prepared container in the HTML to display the data.\n\n\
    We then define a DataSource object to use as the source of the data we will display.\
    \ In this example, we used a Function data source, that is, a data source which\
    \ simply uses the output of a native JavaScript function as its data (in this\
