  md: 'We must now instantiate a new Panel widget in our JavaScript, passing a configuration
    object with the following properties:


    | Name | Value | Description |

    | --- | --- | --- |

    | visible | false | Hides the window by default |

    | modal | true | Sets the window behavior to modal |

    | width | 300px | Sets desired width of window |

    | height | 150px | Sets desired height of window |

    | close | true | Displays a close button in the top-right corner of the window
    |

    | draggable | true | Allows the window to be moved by dragging |

    | fixedcenter | true | Displays the window in the center of the viewport |


    Next, we will subscribe to the panel''s hide event. The function we define here
    will be called whenever the window has been hidden, or when the user clicks the
    window''s close icon. In this function, we will reset the height of the <div>
    element that contains the modal panel, restoring it to its original height.


    Next, we call the `render` method of the new instance of the Panel widget.


    Finally, we define a function to display the window. In this example, we will
    attach that to the click, of our **Show** button.


