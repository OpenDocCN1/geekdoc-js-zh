    used as input to the web service method. In this case, we have only course ID
    as a value of 2.


    +   - cfg: this object which we define the HTTP method of the request (POST).
    It also allows us to set additional HTTP headers for the request. We use the Content-Type
    header to application/x-www-form-url-encoded to ensure our name-value pairs are
    correctly encoded.


