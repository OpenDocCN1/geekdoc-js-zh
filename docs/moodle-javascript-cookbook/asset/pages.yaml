  md: '# About the Author


    Alastair Hole is a web software developer, who is currently specializing in educational
    software, particularly that pertains to Further and Higher Education in the UK.
    His web development experience began in the post-dot-com boom era, working on
    business-to-business e-commerce web applications in the publishing industry with
    a focus on backoffice integration. He since transferred his talents to the educational
    sector and has created projects which have gone on to receive awards from organizations
    such as The Times Educational Supplement and the IMS Global Learning Consortium.


    Alastair is the author of the award-winning Moodle Content Package repository
    plugin in "MrCUTE--Moodle Repository: Create, Upload, Tag & Embed", which is an
    Open Source project commissioned by the Joint Information Systems Committee (JISC)
    that has seen significant use in Moodle sites worldwide, from Scotland to Australia.


