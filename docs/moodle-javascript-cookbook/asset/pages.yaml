  md: '# Preface


    Moodle is the best e-learning solution on the block and is revolutionizing courses
    on the Web. Using JavaScript in Moodle is very useful for administrators and dynamic
    developers, as it uses built-in libraries to provide the modern and dynamic experience
    that is expected by web users today.


    The Moodle JavaScript Cookbook will take you through the basics of combining Moodle
    with JavaScript and explain how JavaScript can be used along with Moodle. It will
    explain how to integrate Yahoo! User Interface Library (YUI) with Moodle. YUI
    will be the main focus of the book, and is the key to implementing modern, dynamic,
    feature-rich interfaces to help your users get a more satisfying and productive
    Moodle experience. It will enable you to add effects, make forms more responsive,
    use AJAX and animation, to create a richer user experience. You and a range of
    YUI features, such as pulling in and displaying information from other websites,
    enhancing existing UI elements to make users'' lives easier, and even adding animation
    to your pages for a nice finishing touch.


    # What this book covers


    Chapter 1, Combining Moodle and JavaScript. In this chapter, we will learn the
    basic techniques for integrating our JavaScript code with Moodle 2.0. We will
    learn several methods of including our JavaScript code in Moodle page through
    .js files, and how to get the code to run. Lastly, we will look at some best practices
    and how to make Moodle data and language strings available to your JavaScript.


    Chapter 2, Moodle and Yahoo! User Interface Library (YUI). In this chapter, we
    will learn the basics of working with YUI. We will learn how to initialize the
    YUI and make it ready for use within our code and load additional modules from
    both Version 2 and 3 of the YUI. We will also learn how to manage the execution
    of code by attaching events to your controls, and finally how to debug your code
    with YUI logging tools.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Preface


    Chapter 3, Moodle Forms Validation. Moodle provides a feature-rich web forms utility
    based on the PHP Extension and Application Repository (PEAR) library, QuickForm.
    Forms produced in Moodle not using this library are an exception. So, in this
    chapter, we will learn how to activate the built-in JavaScript validation functions,
    and also how to add our own custom JavaScript form logic.


    Chapter 4, Manipulating Data with YUI 3. In this chapter, we will look at the
    ways in which we can use JavaScript and YUI to retrieve and display data from
    a range of sources. Using these techniques, we can integrate all types of data
    into our Moodle applications—from weather forecasts, stock updates, and news feeds
    to any type of custom text-based data you may have from external sources, and
    even data from Moodle itself (the local Moodle system and any remote systems that
    your code is authorized to access), retrieved through Moodle''s webs API.


    Chapter 5, Working with Data. Database applications, as Moodle require efficient
    methods of displaying data to users, for example a table of assignment grades,
    or other recent user activity. This typically takes the form of an HTML table,
    the familiar grid of columns and rows. In this chapter, we will learn how to initialize
    a YUI DataSource, display data, sort columns, add paging, and enable editing of
    editing.


    Chapter 6, Enhancing Page Elements. The Yahoo! UI Library (YUI) offers a range
    of widgets and utilities to bring modern enhancements to your traditional page
    elements. In this chapter, we will look at a selection of these, including features
    seen on modern interactive interfaces such as auto-complete, auto-update, custom
    tooltip, and so on.


    Chapter 7, Advanced Layout Techniques. In this chapter, we will look at a selection
    of techniques available to design the way in which users interact with our content.
    First of all, we will look at the different ways in which we can present a navigation
    menu, giving the user a convenient list of the content that we are making available
    to them. Second, we will will at at two different ways in which we can present
    the actual content. We will also look at methods of enhancing the display and
    navigation of page content, by extending markup in the concept of "progressive
    enhancement".


    Chapter 8, Animating Components. Animation can provide beneficial effects in a
    range of situations. So, in this chapter, we will look at how bring elements on
    our pages to life with the use of animation.


    Chapter 9, Integrating External Libraries. In this chapter, we will look at the
    methods available to us for integrating external JavaScript libraries. We will
    also look at how to setup some of the more commonly used frameworks, and implement
    a basic "content ready" event handler for each one. Finally, we will look at some
    extensions for the Prototype framework, namely the script.aculo.us add-on, and
    we will finish by implementing the Lightbox image-viewer extension.


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_14_0.png)'
  merge: -1
  pgno: 14
