  md: '# How it works...


    When we build the PHP page including our input button, we assigned an ID to that
    button via the id attribute. This allows us to later refer to that button specifically
    from the JavaScript code.


    When our page is loaded in the browser, our JavaScript file is also loaded and
    executed, initializing our function `btn1_Click` is defined.


    Lastly, we used the Y.on method to assign this function to the click event of
    the button. The name of the event is simply "click" which all browsers understand.
    Our event handler is simply referenced by name, that is, `btnClick`. Lastly, we
    tell Y.on to apply the event handler to the element with ID `btn1` by passing
    the ID prefixed with a, like `#btn.


    > Y.on uses a CSS selector to refer to elements; hence the ID is prefixed with
    a # in the same way if we were defining a CSS selector.

    This is a powerful and flexible method for registering events as we could alternatively
    use the identifier `.btn` which would then register this event handler for all
    elements with the class attribute set to btn.


    # Attaching advanced DOM event handlers


    Sometimes we want to run JavaScript code when the page loads, rather than in respond
    to an action taken by the user (as in this example).


    A simple way to achieve this is to put our code directly in the JavaScript file
    outside of any functions or event handler. Using this method, our code would just
    executed straight after it is loaded. If we are following the best practice technique
    of loading our script files at the end of the body tag, our code would be executed
    after the main body content of the page has loaded.


    Note that Moodle implements this best practice for us automatically when we use
    the technique from a Loading JavaScript file recipe in Chapter 1, Combining Moodle
    and JavaScript unless we specify otherwise, as per the Loading JavaScript file
    in the `<head>` recipe. Using this latter technique of loading a script file from
    the `<head>`, our code would be executed before the rest of the page finished
    loading.


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_41_0.png)'
