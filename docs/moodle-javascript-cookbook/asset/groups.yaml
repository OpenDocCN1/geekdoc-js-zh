    > Due to the nature of the security restrictions of the underlying transport XMLHttpRequest,
    it is only possible to retrieve URLs from the same domain. To retrieve data from
    external domains, we must either use an alternative transport mechanism, or proxy
    the URI through the local domain. Both approaches are detailed in subsequent recipes.


    # # Using IO''s alternative transport method for requesting external URIs


    In this recipe, we will look at a method for retrieving data from an external
    domain. Due to security restrictions, it is not possible to make requests to an
    external URI with JavaScript''s XMLHttpRequest. YUI avoids this restriction by
    including a built-in alternative transport mechanism based on Adobe Flash. In
    this way, any trusted domain with a valid cross-domain policy file may be used
    as a source of data.


    # ## Getting ready


    First, we need to ensure that the remote domain is configured to accept incoming
    requests. This is done by installing a cross-domain policy file crossdomain.xml
    on the remote domain. This cross-domain policy file specifies which domains are
    authorized to make requests via Adobe Flash (.swf) applications.


    The following example configures the domain remote.example.com to accept incoming
    HTTP requests from any host except example.com.


    Contents of the http://remote.example.com/crossdomain.xml file are as follows:


    ```

    <?xml version="1.0"?>

    <!DOCTYPE cross-domain-policy SYSTEM

    "http://www.adobe.com/xml/tds/cross-domain-policy.dtd">

    <cross-domain-policy>

    <allow-access-from domain="*.example.com" />

    ```'
