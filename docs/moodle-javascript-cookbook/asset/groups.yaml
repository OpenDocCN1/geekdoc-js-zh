    \necho $OUTPUT->header();\n\n?>\n<div id=\"calContainer\"></div>\n<?php\necho\
    \ $OUTPUT->footer();\n?>\n```\n\n你会注意到 `yui_cal.php` 引用了位于 `cook` 目录的 JavaScript\
    \ 文件 `yui_cal.js`，其内容如下：\n\n```javascript\nYUI().use(\"yui2-calendar\", function(Y)\
    \ {\n  var YAHOO = Y.YUI2;\n  var cal = new YAHOO.widget.Calendar(\"calContainer\"\
