  - '[PAGE 29]


    # How to do it...


    Just after the call to $PAGE->requires->js, add the following code:


    ```

    $PAGE->requires->js_init_call(''hello'',

    array(''Hello'', $USER->username);

    ```


    The first parameter is a string containing the name of the JavaScript function
    we wish to call, which is hello in this case.


    The second parameter is a PHP array of values that are passed on to the JavaScript
    function in the order which they are defined.


    The use of an array allows the js_init_call method to support an arbitrary number
    of arguments, in this case: the message and username.


    # How it works...


    We have used the Page Requirement Manager to register the name of the function
    we wish to call and pass two additional parameters by the function inside a PHP
    array.


    When the document is rendered, the following JavaScript will be generated inside
    a <script> tag just before the end of the <body> tag:


    ```

    hello(Y, "Hello", "admin");

    ```


    # Ensuring compliance with XHTML Strict


    Moodle uses the DocType XHTML Strict. We should take care to ensure our JavaScript
    maintains compliance with this standard.


    Although it is avoided, it may occasionally be necessary to include JavaScript
    code within <script> tags that are embedded within the page. If this is the case,
    it is highly likely that the code will include characters that have special meaning
    to the XHTML Strict specification, for example & and <'', to name a few.


    # Getting ready


    Open the PHP file that contains the embedded JavaScript and locate the start and
    end <script> tags.'
