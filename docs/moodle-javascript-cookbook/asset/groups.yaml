    \ definition of the `datatable` object.\n\n### How to do it...\n\nModify the `dataTable`\
    \ definition to match the following code:\n\n```javascript\nvar dataTable = new\
    \ YAHOO.widget.ScrollingDataTable(\n    \"container\", columns, dataSource,\n\
    \    height: \"150px\"\n);\n```\n\n### How it works...\n\nUsed the alternative\
    \ control `ScrollingDataTable`, passing in a configuration object as the fourth\
    \ argument. This configuration object simply sets a height for the DataTable,\
    \ and any content that overflows this height will scroll. Similarly, we may set\
    \ a width to enable horizontal scrolling, or by a height and a width to enable\
    \ both horizontal and vertical scrolling.\n\nThe following screenshots show that\
