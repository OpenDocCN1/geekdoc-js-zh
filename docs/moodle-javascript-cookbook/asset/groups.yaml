    # About the Author


    Alastair Hole is a web software developer, who is currently specializing in educational
    software, particularly that pertains to Further and Higher Education in the UK.
    His web development experience began in the post-dot-com boom era, working on
    business-to-business e-commerce web applications in the publishing industry with
    a focus on backoffice integration. He since transferred his talents to the educational
    sector and has created projects which have gone on to receive awards from organizations
    such as The Times Educational Supplement and the IMS Global Learning Consortium.


    Alastair is the author of the award-winning Moodle Content Package repository
    plugin in "MrCUTE--Moodle Repository: Create, Upload, Tag & Embed", which is an
    Open Source project commissioned by the Joint Information Systems Committee (JISC)
    that has seen significant use in Moodle sites worldwide, from Scotland to Australia.


    Thank you to everyone who has contributed to this book''s completion, be it patience
    with missed deadlines or encouragement when all seemed overwhelming. Thank you,
    Ma and Pa Hole for their foresight in recognizing that one day I would teach myself
    to reassemble everything that I have ever unscrewed, detached, disassembled, or
    otherwise fiddled with. Thank you to The Internet for being an ever expanding
    well of autodidactic opportunity.


    And remember, "It''s just a ride. And we can change it any time we want."


    # About the Reviewers


    **Anthony Borrow, S.J.** is a Jesuit of the New Orleans Province who has been
    active in the Moodle community for five years. Anthony has an M.A. in Counseling
    from Saint Louis University, and a Masters of Divinity from the Jesuit School
    of Theology of Santa Clara University. Anthony has worked on the design and implementation
    of various database systems since 1992.


    Anthony serves the Moodle community as its CONTRIB Coordinator. In that role,
    Anthony has presented at various MoodleMoots (conferences) across the United States
    and provided in-house training opportunities for institutions learning how to
    implement Moodle. Anthony is training the Campus Minister at Cristoy Rey Jesuit
    (http://cristoreyejuit.org/) and provides technical advice to the Jesuit Secondary
    Education Association (http://jsea.org/) and the Jesuit Virtual Learning Academy
    (http://jvla.org/).


    Anthony is the co-author of the Honduras chapter of Teen Gangs: A Global View,
    and also has been a technical reviewer of various Pack books.


    > I am grateful to the Moodle community for continually inspiring me to learn
    about educational technologies and fostering an environment where every voice
    contributes to building that community.


    **Mauno Korpelainen** teaches Mathematics for high school and adult students in
    Hyvinkää, Finland, has been a PHM (Particularly Helpful Moodler) for several years,
    and is one of the moderators of the **moodle.org** forums.


    Susan Smith Nash is currently the Director of Education and Professional Development
    for the American Association of Petroleum Geologists (AAPG) in Tulsa, Oklahoma,
    and an adjunct professor at Excelsior College (Albany, NY). Previous to this,
    she was the Associate Dean for graduate programs at the College of Liberal Studies,
    University of Oklahoma, Norman, OK. She obtained her Ph.D., M.A. in English and
    a B.S. in Geology from the University of Oklahoma. Nash blogs at e-learning and
    has written articles and chapters for numerous publications, including Trends
    and Issues in Instructional Design and Technology (3rd ed), Mobile Information
    Technologies Adoption in Developing Countries: Effects and Implications. Her latest
    books include Moodle Teaching Techniques (Packt Publishing, 2010), E-Learners
    Survival Guide (Texture Press, 2009), and various others.


