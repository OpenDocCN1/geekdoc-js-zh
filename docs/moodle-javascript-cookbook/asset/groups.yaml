    :\"Item Five\"},\n    {\"name\":\"Item Six\"},\n    {\"name\":\"Item Seven\"},\n\
    \    {\"name\":\"Item Eight\"},\n    {\"name\":\"Item Nine\"},\n    {\"name\"\
    :\"Item Ten\"}\n  ]\n}\n```\n\n+   datasource_json.php: A PHP page with an input\
    \ buffer for initiating request and a textarea to display the results:\n```php\n\
    <?php\nrequire_once(dirname(__FILE_)) . '/../config.php';\n$PAGE->set_url('/cook/datasource_json.php');\n\
    $PAGE->requires->js('/cook/datasource_json.php');\necho OUTPUT->header();\n?>\n\
    <form>\n<textarea id=\"contents\" rows=\"10\"></textarea>\n<br />\n<input id=\"\
