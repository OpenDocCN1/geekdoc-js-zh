    \ for you to reuse using YUI 2 code.\n\nFinally, we create a new instance of the\
    \ YUI 2 calendar widget YAHO.widget.Calendar, passing in the ID of the container\
    \ `<div>` we created earlier, and then call the render method to display the calendar.\n\
    \nOur page should have a new calendar control rendered inside our `<div>` container\
    \ as seen in the following screenshot:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_38_0.png)\n\
    \n## How it works...\n\nWhen we load yui_cal.php in a browser, our page is rendered\
    \ including the container `<div>` for our calendar. When the page finishes downloading,\
    \ our JavaScript is executed.\n\nFrom our JavaScript, the YUI 2 Calendar module\
    \ is loaded first by YUI 3 in the same way we load YUI 3 modules, the difference\
    \ being we have used the name of a YUI 2 module prefixed with yui2-, that is,\
    \ yui2-calendar.\n\nNext, we have obtained a copy of the YUI 2 object YAHO by\
    \ copying it from the YUI 3 object Y.YUI2.\n\nFinally, we can use the new YAHOO\
    \ object to create a new instance of the Calendar widget, attaching it to our\
    \ container `<div>` and calling the render method to have it built and displayed.\n\
    \n## Attaching basic event handlers\n\nEvents are the basis for managing how the\
    \ user interface responds to particular actions taken by the user, primarily with\
    \ the keyboard and/or mouse. An event is a particular action taken in the context\
    \ of a particular DOM element. The following are two common examples:\n\n- An\
    \ input button has a click event, which occurs when the user clicks the mouse\
    \ while the mouse pointer is hovering over the button\n- An input text box has\
    \ a focus event, which occurs when the text box has gained focus, meaning the\
    \ user has moved the cursor into the text box with the mouse cursor or using the\
    \ Tab key\n\nTherefore, an event handler is a specific block of code (callback\
    \ function) that we have registered (attached) to a particular element and event\
    \ combination, that is, the input button and its click event.\n\nIn this recipe,\
    \ we will learn how to attach a click event handler to an HTML input button as\
    \ the first example. We will set up the code that an alert is displayed when the\
    \ button is clicked.\n\n## Getting ready\n\nWe begin by creating a new PHP file\
    \ yui_eventbasic.php in the cook directory, with the following content:\n\n```\n\
    <?php\nrequire_once(dirname(__FILE__) . '../config.php');\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/cook/yui_event.php');\n$PAGE->requires->js('/cook/yui_eventbasic.js');\n\
    echo $OUTPUT->header();\n?>\n<form>\n<input type=\"button\" id=\"btn1\" value=\"\
    Button 1\" />\n</form>\n<?php\necho $OUTPUT->footer();\n?>\n```\n\n## Moodle and\
    \ Yahoo! User Interface Library (YUI)\n\nYou will notice that yui_eventbasic.php\
    \ links to a JavaScript file yui_eventbasic.js, also in the cook directory, with\
    \ the following content:\n\n```\nYUI().use(\"node-base\", function(Y) {\n  var\
    \ btn1_Click = function(e) {\n    alert('Button clicked');\n  };\n  Y.on(\"click\"\
    , btn1_Click, \"#btn1\");\n});\n```\n\n## How to do it...\n\nWe have set up the\
    \ Moodle programming environment in the way now familiar in yui_eventbasic.php,\
    \ with the addition of a form with an input labeled **Button 1** with the ID btn1\
    \ as seen in the following screenshot:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_40_0.png)\n\
    \nThis is the button to which we shall register a click event, referring to by\
    \ its ID later on. This PHP file also includes the JavaScript file yui_eventbasic.js\
    \ from where we will set up the event.\n\nThe JavaScript in yui_eventbasic.js\
    \ begins by loading the module we require --node-base.\n\nNext, we have defined\
    \ a function btn1_Click which will serve as the click event handler. This function\
    \ simply displays an alert to demonstrate that the event has fired correctly.\n\
    \nLastly, we use the on method of the Y object to register the event, passing\
    \ three parameters as detailed in the following table:\n\n| Parameter | Value\
    \ |\n|---|---|\n| Name of the event | click |\n| Name of the function to register\
    \ | btn1_Click |\n| ID of the element to which the event pertains | btn1 |\n\n\
    We can load our PHP page in a web browser, and when we click on **Button 1**,\
    \ we will see the JavaScript alert pop up, letting us know that the click event\
    \ has fired correctly and called our event handler as seen in the following screenshot:\n\
    \n## How it works...\n\nWhen we build the PHP page including our input button,\
    \ we assigned an ID to that button via the id attribute. This allows us to later\
    \ refer to that button specifically from the JavaScript code.\n\nWhen our page\
    \ is loaded in the browser, our JavaScript file is also loaded and executed, initializing\
    \ our function `btn1_Click` is defined.\n\nLastly, we used the Y.on method to\
    \ assign this function to the click event of the button. The name of the event\
    \ is simply \"click\" which all browsers understand. Our event handler is simply\
    \ referenced by name, that is, `btnClick`. Lastly, we tell Y.on to apply the event\
    \ handler to the element with ID `btn1` by passing the ID prefixed with #, like\
    \ #btn.\n\n> Y.on uses a CSS selector to apply the event handler to the element\
    \ with ID `btn1` by passing the ID prefixed with #, like #btn.\n\n## Attaching\
    \ advanced event handlers\n\nSometimes we want to run code when the DOM is ready,\
    \ rather than after the page has loaded. Using this method is sufficient for cases\
    \ where the code does not depend upon certain elements being loaded. However,\
    \ in some cases, attempts to access a DOM element that is not fully loaded may\
    \ cause the rest of our script to fail, and in the worst case, it may even cause\
    \ an inferior browser to crash.\n\nThe YUI 3 library offers a set of significantly\
    \ more robust solutions to this problem, which can be relied upon all browsers\
    \ that YUI supports. It is these offerings which we will investigate, and they\
    \ take the form of the events described in the following table:\n\n| Event | Description\
    \ |\n|---|---|\n| domready | Fired when the DOM is fully loaded and can therefore\
    \ be accessed safely. This element refers to the DOM context of the page and is\
    \ not applied to a specific element. |\n| load | Applied to a specific DOM element.\
    \ It fires when the element is fully loaded by the browser. If applied to the\
    \ window element, this fires when the entire contents of the window has loaded,\
    \ including the page and any scripts, or images. |\n| available | Applied to a\
    \ specific DOM element. It fires when the element has loaded, but not necessarily\
    \ after the element's child elements have loaded. |\n| contentready | Applied\
    \ to a specific DOM element. It fires when the element and all of its child elements\
