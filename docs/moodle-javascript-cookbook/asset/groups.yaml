    set up a page load function, using Prototype as in the previous recipe. Inside
    this function, we will use script.aculo.us to apply a shake animation effect to
    our div element.'
  - '[PAGE 169]


    # There''s more...


    When we load the PHP page in our browser, the PHP code loads all of the required
    JavaScript files in the specified order. This order ensures that the dependency
    hierarchy is correct, meaning that Prototype is loaded before the `script.aculo`
    add-ons, and finally our custom JavaScript that makes use of the `script.aculo`
    add-on gets loaded.


    When our custom script file, `external_scriptabulous.js`, is loaded, it registers
    the shake animation on our `div` element to fire when the page is loaded completely.
    Finally, when we see the entire page has loaded completely in the browser, the
    load event is fired and we see the shake animation applied to our `div` tag.


    # Adding image enlargement with Lightbox


    Lightbox 2 is a very popular script based on `script.aculo.us` (and in turn, based
    on Prototype) which provides a slick way to open links to high-resolution versions
    of thumbnail images in a modal window.


    In this recipe, we will integrate Lightbox 2 into our page, and add an image thumbnail
    to which we will apply the Lightbox 2 functionality.


    # Getting ready


    First, we need to obtain a copy of Lightbox 2, by visiting `http://www.huddledogether.com/projects/lightbox2/`,
    and navigating to the download section. Download the ZIP file of the latest version,
    and unpack it to the `cook` subdirectory of the Moodle installation used in this
    example, is `/path/to/moodle/cook/lightbox2`.


    > Lightbox 2 contains links to images that are relative to the page on which you
    have loaded the script. To ensure that these images are available to the script,
    copy the images folder to the same location as your script, in our example, `/path/to/moodle/cook/images`.'
  - '[PAGE 170]


    # Integrating External Libraries


    # How to do it...


    Create a PHP page, external_lightbox.php, in which to set up Lightbox 2. Note
    that we will require a sample image for the example, in this case flower.jpg:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_170_0.png)


    The content of the PHP file is as follows:


    ```

    <?php

    require_once(dirname(__FILE__) . ''/..//config.php'');

    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    $PAGE->set_url(''/cook/external_lightbox.php'');

    $PAGE->requires->js(''/cook/prototype.js'');

    $PAGE->requires->js(''/cook/scriptaculous/scriptaculous.js'');

    $PAGE->requires->js(''/cook/scriptaculous/effects.js'');

    $PAGE->requires->js(''/cook/scriptaculous/builder.js'');

    $PAGE->requires->js(''/cook/lightbox2/js/lightbox.js'');

    $PAGE->requires->css(''/cook/lightbox2/css/lightbox.css'');


    echo $OUTPUT->header();


    <a href="flower.jpg" rel="lightbox"><img src="flower.jpg" width="150">\n<?php


    echo $OUTPUT->footer();

    ?>

    ```'
  - '[PAGE 171]


    We can now load this page in a web browser, and see the enhanced Lightbox image
    viewer in action. Firstly, a thumbnail of the flower image is displayed as normal:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_171_0.png)


    We can now click on this thumbnail to activate the detailed view of the full resolution
    image inside the modal Lightbox window, as shown in the following screenshot:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_171_1.png)'
  - '[PAGE 172]


    Integrating External Libraries


    # How it works...


    Once we have downloaded Lightbox 2 and saved it to a suitable location, we can
    begin implementing it in our PHP page external_lightbox.php. After setting up
    the standard Moodle programming environment, we begin including the following
    necessary JavaScript files, in specific order:


    +   1. /cook/prototype.js

    2. /cook/scriptaculous/scriptaculous.js

    3. /cook/scriptaculous/effects.js

    4. /cook/scriptaculous/builder.js

    5. /cook/lightbox2/js/lightbox.js


    The order is important, as there is a hierarchy of dependence. This means Lightbox
    2 requires script.aculo.us to be available, and in turn, script.aculo.us requires
    Prototype to


    Next, we include the Lightbox 2 CSS file /cook/lightbox2/css/lightbox.css.


    Finally, we add a thumbnail of our sample image, flower.jpg, and enclose it in
    a link (<a> tag) to the high-resolution version. We activate Lightbox 2 functionality
    on this thumbnail by adding a rel attribute and setting its value to lightbox.
    Now when we load the page, and click on the link, we see that the high-resolution
    image is displayed in an attractive modal image viewer.


    # There''s more...


    Lightbox 2 is very unobtrusive, which uses progressive enhancement techniques.
    This means we need to make only minimal changes to our existing HTML markup, that
    is, simply add the required rel attribute to the images for we wish to enable
    Lightbox. The result of this is that if JavaScript is not available in the user''s
    browser, they will still have a regular link through the high-resolution version
    of the image.


    Once all the requisite JavaScript and CSS files are loaded correctly in the page,
    Lightbox 2 will seamlessly activate the modal image viewer for all hyperlinks
    with the rel="lightbox" attribute set.'
