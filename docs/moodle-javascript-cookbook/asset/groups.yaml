    ## Adding paging\n\nIn this recipe, we will enable data paging. We will implement\
    \ the YUI Paginator control, and configure the DataTable to display rows in blocks\
    \ of five. The YUI 2 DataTable control is compatible with the Paginator control.\
    \ This allows us to enable familiar paging controls for our DataTable, which is\
    \ particularly useful for large data sets.\n\n### Getting ready\n\nOpen the `datatable.js`\
    \ file for editing. We will add an extra configuration object to add to the DataTable\
    \ constructor.\n\n### How to do it...\n\nFirst, we must include an additional\
