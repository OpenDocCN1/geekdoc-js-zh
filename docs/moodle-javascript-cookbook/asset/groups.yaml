    ?>\n```\n\n# Manipulating Data with YUI 3\n\ndatasource_json.js: The accompanying\
    \ JavaScript file containing the YUI data logic:\n\n```\nYUI().use('datasource-io',\
    \ 'datasource-jsonschema', 'node',\nfunction(Y) {\n  var dataSource = new Y.DataSource.IO({source:\"\
    ./data/json\"});\n  dataSource.plug(Y.Plugin.DataSourceJSONSchema, {\n    schema:\
