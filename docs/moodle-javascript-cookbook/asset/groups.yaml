- md: "\n# What you need for this book\n\nTo work with the code provided with the\
    \ recipes in this book, you will need an installation of Moodle 2.0 to run the\
    \ code with your favorite text editor for making any changes. Visit http://moodle.org/\
    \ for downloading links and installation instructions for Moodle 2.0.\n\n# Who\
    \ this book is for\n\nThis book is aimed at developers and administrators comfortable\
    \ with customizing Moodle with the use of plugin modules, themes, and patches\
    \ who want to make their site more dynamic. If you have prior knowledge of HTML,\
    \ PHP, and CSS and a good working knowledge of the underlying structure of Moodle,\
    \ then this book is for you. No prior experience with JavaScript is needed.\n\n\
    # Conventions\n\nIn this book, you will find a number of styles of text that distinguish\
    \ between different kinds of information. Here are some examples of these styles,\
    \ and an explanation of their meaning.\n\nCode words in text are shown as follows:\
    \ \"We will create a simple MooTools script that will display a JavaScript alert\
    \ when the domready event is fired.\"\n\nA block of code is set as follows:\n\n\
    ```\nwindow.addEventListener('domready', function() {\n  alert('Hello from MooTools');\n\
    });\n```\n\nWhen we wish to draw your attention to a particular part of a code\
    \ block, the relevant lines or items are set in bold:\n\n```\n{\n  key: \"title\"\
    ,\n  label: \"Title\",\n  formatter: \"string\",\n  sortable: true\n}\n```\n\n\
    # Preface\n\nNew terms and important words are shown in bold. Words that you see\
    \ on the screen, in menus or dialog boxes for example, appear in the text like\
    \ this: \"When the user clicks on the Show panel button, the window's show method\
    \ is called\".\n\n> Warnings or important notes appear in a box like this.\n\n\
    > Tips and tricks appear like this.\n\n# Reader feedback\n\nFeedback from our\
    \ readers is always welcome. Let us know what you think about this book—what you\
    \ liked or may have disliked. Reader feedback is important for us to develop titles\
    \ that you really get the out of.\n\nTo send us general feedback, please send\
    \ an e-mail to feedback@packtpub.com, and mention the book title via the subject\
    \ of your message.\n\nIf there is a book that you need and would like to see us\
    \ publish, please send us a note in the SUGGEST A TITLE form on www.packtpub.com\
    \ or e-mail suggest@packpub.com.\n\nIf there is a topic that you have expertise\
    \ in and you are interested in either writing or contributing to a book, see our\
    \ author guide on www.packtpub.com/authors.\n\n# Customer support\n\nNow that\
    \ you are the proud owner of a Packt book, we have a number of things to help\
    \ you to get the most from your purchase.\n\n# Downloading the example code\n\n\
    You can download the example code files for all Packt books you have purchased\
    \ from your account at http://www.PacktPub.com. If you purchased this book elsewhere,\
    \ you can visit http://www.PacktPub.com/support and register to have the files\
    \ e-mailed directly to you.\n\n# Errata\n\nAlthough we have taken every care to\
    \ ensure the accuracy of our content, mistakes happen. If you find a mistake in\
    \ one of our books—maybe a mistake in the text or the code—we would be grateful\
    \ if you would report this to us. By doing so, you can save other readers from\
    \ frustration and help improve subsequent versions of this book. If you find any\
    \ errata, please report them by visiting http://www.packpub.com/support, selecting\
    \ your book, clicking on the errata submission form link, and entering the details\
    \ of your errata. Once your errata are verified, your submission will be accepted\
    \ and the errata will be uploaded on our website, or added to any list of existing\
    \ errata, under the Errata section of that title. Any existing errata can be viewed\
    \ by selecting your title from http://www.packpub.com/support.\n\n# Piracy\n\n\
    Piracy of copyright material on the Internet is an ongoing problem across all\
    \ media. At Packt, we take the protection of our copyright and licenses very seriously.\
    \ If you come across illegal copies of our works, in any form, on the Internet,\
    \ please provide us with the location address or website name immediately so that\
    \ we can pursue a remedy.\n\nPlease contact us at copyright@packpub.com with a\
    \ link to the suspected pirated material.\n\nWe appreciate your help in protecting\
    \ our authors, and our ability to bring you valuable content.\n\n# Questions\n\
    \nYou can contact us at questions@packpub.com if you are having a problem with\
    \ any aspect of the book, and we will do our best to address it.\n\n# Combining\
    \ Moodle and JavaScript\n\nIn this chapter, we will cover:\n\n- Creating a new\
    \ Moodle PHP page\n- Loading a JavaScript file\n- Loading a JavaScript file in\
    \ <head>\n- Generating a JavaScript function call from PHP\n- Passing variables\
    \ from PHP to JavaScript\n- Ensuring compliance with XHTML Strict\n- Retrieving\
    \ language strings from Moodle\n\n# Introduction\n\nWeb pages and websites have\
    \ come a long way since their inception in the early 1990s (with the creation\
    \ of HTML). Modern web applications like Moodle now have far more in common with\
    \ desktop applications than the simple word processing documents they originally\
    \ modeled.\n\nOne key weapon in the modern web application's arsenal is the subject\
    \ of this book—JavaScript.\n\nIn essence, JavaScript is a programming language\
    \ that runs in a user's web browser rather than on the web server, allows programmers\
    \ to manipulate the web page via what is called the Document Object Model (DOM).\
    \ The DOM is a representation of the underlying HTML page, structured in a way\
    \ to provide access to each and every element within the HTML page. Modern browsers\
    \ now implement a standard version of the DOM, so it can be considered a cross-platform\
    \ technology.\n\n# Combining Moodle and JavaScript\n\nIn recent years, there has\
    \ been a significant uptake of the use of JavaScript frameworks. A JavaScript\
    \ framework is a library of JavaScript code that makes a JavaScript programmer's\
    \ life easier. Generally, they provide more efficient methods for performing the\
    \ most common tasks in JavaScript, such as locating DOM elements or wiring up\
    \ events to those elements.(An event is a function of an element. For example,\
    \ an HTML input button has a \"click\" event that is fired when the mouse is clicked\
    \ while the pointer is over the button.) Additionally, they provide abstraction\
    \ of browser-specific quirks, making it very easy to write cross-platform code\
    \ that works in the widest range of browsers.\n\nOne JavaScript framework is the\
    \ Yahoo User Interface library (YUI). YUI is the framework of choice for Moodle\
    \ 2.0, and is included with the standard Moodle 2.0 package. For this reason,\
    \ a substantial number of techniques covered in the later chapters will be based\
    \ on the YUI. The final chapter, we will briefly explore some other JavaScript\
    \ frameworks.\n\nPerhaps more important than \"how\" to use JavaScript is the\
    \ question of \"when\" to use it. If you are building an application that is to\
    \ be used in a public setting, then you should aim to make it as accessible as\
    \ possible to all types of users. With respect to JavaScript specifically, this\
    \ means that the core functionality of your site should be available to those\
    \ who, for whatever reason, cannot or will not use a browser that supports JavaScript(typical\
    \ examples include a mobile device with limited functionality, or a browser using\
    \ automated-to-speech or screen-reading software). These techniques form part\
    \ of what is known as \"progressive enhancement\".\n\nIn this chapter, we will\
    \ learn the basic techniques for integrating our JavaScript code with Moodle.\
    \ We will learn several methods of including our JavaScript code in a Moodle page\
    \ via .js files, and how to get the code to run. Lastly, we will look at some\
    \ best practices and also how to make Moodle data and language strings available\
    \ to your code.\n\n# Creating a new Moodle PHP page\n\nThe code examples we use\
    \ in the recipes throughout this book are all based on the template we will create\
    \ in this recipe. This template sets up the necessary Moodle environment and displays\
    \ the standard Moodle header and footer.\n\nThis will allow us to use the generic\
    \ techniques and techniques available to us within Moodle that pertain to JavaScript,\
    \ allowing you, as the developer, to decide how and where to apply them.\n"
