  - '[PAGE 59]


    # Adding custom validation with a Regular Expression


    Regular Expressions are a powerful method for matching the pattern of strings
    of text.

    Regular Expressions are a powerful method for matching the pattern of strings
    of text.

    This has particular relevance to text validation. In this recipe, we will add
    a simple regular

    expression to validate a URL which will require the text entered to begin with
    http://. This

    method does, however, allow any valid Regular Expression making it particularly
    flexible for

    validating any pattern that can be represented in a Regular Expression.


    # Getting ready


    Please refer to the first recipe in this chapter for details on how to prepare
    a QuickForm web

    form which is of this recipe.


    # How to do it...


    Add the following code to our form definition in validation_form.php, just after
    the field

    definition:


    ```

    $form->addElement(''text'', ''mytext5'', ''URL'');

    $form->addRule(''mytext5'', ''URL'', ''regex'', ''http://'', ''server'');

    ```


    When we test this new rule by entering a domain name instead of a full HTTP URL,
    our

    warning message will be displayed and once again we will not be able to submit
    the form until

    we have reformatted the text into a full HTTP URL, as seen in the following screenshot:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_59_0.png)


    # How it works...


    We used the validation type regex which takes a format option in the form of a
    standard

    Regular Expression. In this example, the Regular Expression is a very basic form
    of URL

    validation, which simply checks to see if the input begins with http://.'
