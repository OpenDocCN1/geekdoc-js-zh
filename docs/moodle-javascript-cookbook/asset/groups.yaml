    \ Prototype 的脚本。在该脚本中，我们使用 Prototype 的 `document observe` 方法为页面加载事件绑定一个 JavaScript\
    \ 警报。\n\n当我们在浏览器中加载此页面时，我们看到该事件已触发，并显示了 JavaScript 警报，如下图所示：\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_166_0.png)\n\
    \n## 工作原理...\n\nPHP 文件加载了 Prototype 框架。这确保了在我们在使用框架的自定义 JavaScript 加载之前，它已经加载并准备就绪。接下来，加载我们的\
    \ JavaScript，并使用 Prototype 注册一个在页面完成后运行的 JavaScript 警报。当页面在浏览器中完全加载后，我们将看到 JavaScript\
    \ 警报弹出，确认 Prototype 框架已正确加载。\n\n## 使用 Lightbox 添加图片\n\nLightbox 2 是一个非常流行的基于 `script.aculo.us`\
    \ 的脚本，包含许多用户界面增强功能，如动画、拖放和 AJAX 控制。在本教程中，我们将设置 Lightbox 2 并添加一个抖动动画以验证其是否已正确加载。\n\
