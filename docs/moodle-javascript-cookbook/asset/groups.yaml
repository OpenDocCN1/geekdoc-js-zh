    # Moodle and Yahoo! User Interface Library (YUI)


    Moodle includes a copy of the YUI as its preferred JavaScript library. YUI provides
    developers with access to a wide range of tools for enhancing their web applications:


    The YUI Library is a set of utilities and controls, written with JavaScript and
    CSS, for building highly interactive web applications using techniques such as
    DOM scripting, HTML and AJAX. YUI is available under a BSD license and is free
    for all users. YUI is proven, scalable, fast, and robust. Built by frontend engineers
    and contributors from around the world, it''s an industrial-strength JavaScript
    library for professionals who love JavaScript.


    Yahoo! Developer Network

    http://developer.yahoo.com/yui/


    In this chapter, we will learn the basics of working with YUI. We will learn how
    to initialize the YUI and make it ready for using our code and load additional
    modules from versions 2 and 3 of YUI. We will also learn how to manage the execution
    of code by attaching events to our controls, and finally how to debug code with
    YUI logging tools.


    # Initializing the YUI 3 library


    In this recipe, we will learn how to initialize the YUI 3 environment within Moodle,
    which will get us to start using YUI features. Moodle takes care of most of the
    initial setup, namely loading the required CSS and JavaScript files, so all we
    need to be concerned with is activating the YUI environment.


    This example will show how to execute JavaScript code from within the YUI environment.
    We will set up a small YUI script which will simply display a message including
    the version number of the active YUI environment in a JavaScript alert box.


    This provides a sample view of what is required to get YUI up and running that
    we will build on in the subsequent recipes.


    # Getting ready


    We begin by creating a new PHP file yui_init.php in the cook directory with the
    following content:


    ```

    <?php

    require_once(dirname(__FILE__) . ''/../config.php'');

    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    $PAGE->set_url(''/cook/yui_init.php'');

    $PAGE->set_js(''/cook/yui_init.js'');

    echo $OUTPUT->header();

    echo $OUTPUT->footer();

    ?>

    ```'
