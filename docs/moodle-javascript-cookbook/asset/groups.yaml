    \ Yahoo! 用户界面库 (YUI)。\n\n## 工作原理（How it works）\n\n我们使用 `YUI()` 方法创建 YUI 对象的一个新实例，并立即调用\
    \ `use` 方法。\n\n## 加载额外的模块（Loading additional modules）\n\nYUI 是一组用 JavaScript 和\
    \ CSS 编写的工具和控件，用于通过 DOM 脚本、HTML 和 AJAX 等技术构建高度交互的 Web 应用程序。YUI 以 BSD 许可提供，对所有用户免费。YUI\
    \ 被证明是成熟、可扩展、快速且健壮的。它由来自的前端工程师和贡献者构建，是一个为热爱 JavaScript 的人士提供的工业级 JavaScript 库。提供的额外模块包括：\n\
    - 动画\n- 拖放\n- 操作 DOM\n- 处理事件\n- 处理数据 (JSON/XML)\n\n有关所有模块的列表，请参考 Yahoo 网站：http://developer.yahoo.com/yui/\n\
    \n## 如何实现...\n\n加载额外的模块通过 YUI 的 `use` 方法实现。在之前的食谱中，我们学习了使用以下语法运行代码：\n\n```javascript\n\
    YUI().use(function(Y) { /* 执行代码 */ });\n```\n\n注意 `use` 方法接受任意数量的参数，最后一个参数必须是匿名函数。因此，例如，为了加载动画模块\
