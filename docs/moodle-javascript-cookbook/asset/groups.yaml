    * Comparing with another field

    * Adding a custom JavaScript validation function callback


    # Introduction


    We need to collect information from a user for a variety of reasons. For example,
    we get contact details or information about a problem they are having with our
    website. As is often the case, the most common solution to this problem is the
    use of a model from the real world: a form.'
  - "[PAGE 52]\n\n# Moodle Forms Validation –\n\nA basic web form is very similar\
    \ to its paper-based counterpart, presenting a series of elements on the page\
    \ where the user can enter the required information.\n\nWeb forms in that they\
    \ give us the opportunity to ensure the quality of the information provided as\
    \ it is entered. This process is known as form validation. Using this technique,\
    \ we can apply a range of checks and constraints on the information entered. We\
    \ can also ensure that all of these are satisfied before the user to submit the\
    \ completed form.\n\nMoodle provides a feature-rich web forms utility based on\
    \ the PHP Extension and Application Repository (PEAR) library, Quick.Form. Forms\
    \ produced in Moodle not using this library are an exception. In this chapter\
    \ we will learn how to activate the built-in JavaScript form validation functions,\
    \ and how to add our own JavaScript form validation logic.\n\nThe first recipe\
    \ will begin by setting up a QuickForm form and adding a simple text field with\
    \ validation. The subsequent recipes will build on this basic form and cover each\
    \ of the more advanced validation options available.\n\n# Adding a required field\n\
    \nIn this recipe, we will build a new form using the QuickForm library, comprised\
    \ of one text box with \"required field\" validation applied.\n\nThis type of\
    \ form validation is the simplest and most frequently used validation. It prevents\
    \ the user from leaving the field blank, but imposes no further restrictions on\
    \ what is actually entered.\n\n# Getting ready\n\nFirst, we will prepare the form\
    \ definition. Create a new file validation_form.php in the cook directory, with\
    \ the following content:\n\n```\n<?php\nrequire_once($CFG->libdir.'/formslib.php');\n\
    class validation_form extends moodleform\n{\n    function definition()\n    {\n\
    \        $mform =& $this->form;\n        $mform->addElement('text', 'mytext1',\
    \ 'Required');\n        $mform->addElement('submit', 'submitbutton', 'Submit');\n\
    \    }\n}\n?>\n```\n\nThis is a very simple form definition including one text\
    \ box, mytext1, and a submit button."
