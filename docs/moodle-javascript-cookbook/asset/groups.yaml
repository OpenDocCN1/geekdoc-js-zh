    \ `use` as follows:\n\n```javascript\nYUI().use(\"yui2-datatable\", \"yui2-paginator\"\
    , function(Y) {\n\nvar config = {\n  paginator : new YAHOO.widget.Paginator({\n\
    \    rowsPage: 5\n  })\n};\n```\n\nNext, we must pass this new configuration object\
    \ to the DataTable by passing it as the fourth argument to the constructor. Modify\
    \ the definition of the variable `DataTable` to match the following code:\n\n\
    ```javascript\nvar data = new YAHOO.widget.DataTable(\"container\", columns,\n\
    \  dataSource, config);\n```\n\n# Working with Tables\n\n### How it works...\n\
    \nThe DataTable allows us to pass a configuration object as the fourth argument.\n\
