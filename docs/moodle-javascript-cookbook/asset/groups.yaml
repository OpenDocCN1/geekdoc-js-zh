    datasource-function\", \"datasource-polling\", function(Y) {\n  var getDateString\
    \ = function() {\n    return new Date();\n  };\n\n  var dataSource = new Y.DataSource.Function({source:getDateString});\n\
    \n  var request = {\n    callback : {\n      success: function(e) {\n        document.getElementById('txtUpdate').innerHTML\
    \ = e.results[0];\n      }\n    }\n  };\n\n  var id = dataSource.setInterval(1000,request);\n\
    });\n```\n\nWe have a prepared container in the HTML to display the data.\n\n\
    We then define a DataSource object to use as the source of the data we will display.\
    \ In this example, we used a Function data source, that is, a data source which\
    \ simply uses the output of a native JavaScript function as its data (in this\
    \ case, the current date and time). Once again, this data source can be substituted\
    \ for any valid YUI data source, such as, a CSV of stock information or an RSS\
    \ feed of news headlines.\n\nNext, we define a request callback handler to display\
    \ the data.\n\nFinally, we register this handler with the DataSource object and\
    \ configure it to poll (update) this data source every second (1,000 milliseconds).\n\
    \n# How it works...\n\nWe have loaded YUI modules: datasource-function and datasource-polling.\n\
    \nThe first allows us to use a native JavaScript function as a DataSource, the\
    \ second allows us to get the DataSource to update or 'poll' for new data as often\
    \ as we specify.\n\nThe function data we have defined simply returns the current\
    \ date and time, and the callback handler simply writes the output into our container\
    \ element."
- md: "\n# Enhancing Page Elements\n\nAll that is left is to use the setInterval method\
    \ of the DataSource to register the defined callback function, and to configure\
    \ it to update every 1,000 milliseconds (1 second).\n\nWe now see, upon loading\
    \ the page, the full current date and time is displayed, and updated every second,\
    \ effectively creating a text based clock on the page, as shown in the following\
    \ screenshot:\n\n> Sun Oct 03 2010 13:41:32 GMT+0100 (BST)\n\n# Enabling resizable\
    \ elements\n\nAnother sample, but effective YUI2 utilize the resize utility. It\
    \ has a myriad uses from the simple (in this example, allowing a block of text\
    \ to be resizable), to the more complicated scenarios (such as resizable forms).\
    \ It allows a user to change the size of the element in question by just dragging\
    \ handles around the page, similar to how the user would resize any application\
    \ window in an operating system's GUI. This is most useful when the element contains\
    \ a large amount of content, allowing the user to size the element as required.\n\
    \n# How to do it...\n\nTo begin, set up a simple page, resize.php with a block\
    \ of text in a containing element, as follows:\n\n```php\n<?php\nrequire_once(dirname(__FILE__))\
    \ . '../config.php';\n$PAGE->set_content(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/cook/resize.php');\n$PAGE->requires->js('/cook/resize.js', true);\n\
    ?>\n```\n\n```php\n<?php\necho $OUTPUT->header();\n?>\n<div id=\"content\" style=\"\
    width:20em;padding:10em;\">\n<p>\nMoodle (abbreviation for Modular Object-Oriented\
    \ Dynamic Learning Environment) is a\nfree and open-source e-learning software\
    \ platform, also known as a Course Management System,\nLearning Management System,\
    \ or Virtual Learning Environment (VLE). As of October 2010 it had\na user base\
    \ of 49,952 registered and verified sites, serving 37 million users in 3.7 million\n\
    courses.</p>\n</div>\n<?php\necho $OUTPUT->footer();\n?>\n```\n\nThe associated\
    \ JavaScript resize.js is very simple:\n\n```javascript\nYUI().use(\"yui2-resize\"\
    , function (Y) {\n  var YAHOO = Y.YUI;\n  var resize = new YUI.util.Resize(\"\
    content\");\n});\n```\n\nInstantiate a new Resize object, and pass the name of\
    \ the element to make resizable or only argument.\n\nThis allows the element to\
    \ be resized in both axes, with resize handles on the right and bottom of the\
    \ element as seen in the following screenshot:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_113_0.png)\n\
    \n# How it works...\n\nInstantiating the Resize control and passing the element\
    \ to enhance in the constructor causes YUI to add resize handles to the element\
    \ which allows it to be resized horizontally and vertically.\n\n# Adding custom\
    \ tooltips\n\nHTML tooltips, set up through the title attributes of elements,\
    \ allow only text-based tooltips with no control over the layout. In this example,\
    \ we will enhance an existing element with the YUI Tooltip widget.\n\n# Enhancing\
    \ Page Elements\n\n# How to do it...\n\nTo begin, set up a PHP page, tooltip.php,\
    \ containing an image with the title attribute set:\n\n```php\n<?php\nrequire_once(dirname(__FILE__)\
