    # Preface


    Moodle is the best e-learning solution on the block and is revolutionizing courses
    on the Web. Using JavaScript in Moodle is very useful for administrators and dynamic
    developers, as it uses built-in libraries to provide the modern and dynamic experience
    that is expected by web users today.


    The Moodle JavaScript Cookbook will take you through the basics of combining Moodle
    with JavaScript and explain how JavaScript can be used along with Moodle. It will
