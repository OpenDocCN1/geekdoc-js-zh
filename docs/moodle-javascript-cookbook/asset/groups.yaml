    # Working with Data Tables


    In this chapter, we will cover:


    +   - Initializing a YUI DataSource

    - Displaying data

    - Basic column sorting

    - Adding paging

    - Enabling scrolling

    - Enabling editing


    # Introduction


    Database driven applications, such as Moodle, require efficient efficient methods
    of displaying data to users (for example, a table of assignment grades or other
    recent user activity). This typically takes the form of an HTML table, the familiar
    grid of columns and rows in the style of a spreadsheet. Though generated dynamically
    from a database on the server, by the time these tables are rendered to the browser
    they are fairly static, representing a non-interactive grid of data on screen.


    There is a lot of scope within JavaScript (and the YUI) for us to bring these
    static tables to life by enabling functionality more reminiscent of a spreadsheet
    application than a basic web page. Examples of this functionality include the
    following:


    +   - Sorting: The ability to sort columns alphabetically or numerically in ascending
    or descending order.'
  - '[PAGE 92]


    # Working with Data Tables


    +   * **Paging:** The ability to click through smaller "chunks" of the contents
    of the table by splitting it into pages of a certain size. This is a great way
    to handle scenarios where there may be a large number of records in the table
    and it would be impractical to display all on the screen simultaneously.


    +   * **Scrolling:** An alternative to paging for managing long lists of records
    that would be too cumbersome to display in one list.


    +   * **In-editing:** Allowing users to make quick updates to values in the table
    from the same interface that the user uses to view the data.


    YUI2 includes a powerful DataTable control which implements these features. This
    will be the focus of this chapter. We will start with a basic static HTML table
    of data and gradually enhance it with JavaScript and the YUI to implement the
    functionality, described in line with the best practice of progressive enhancement.


    The reason we are using a YUI 2 control instead of a YUI 3 control is that, at
    the time of writing, there is no suitable counterpart in YUI 3. However, we can
    easily load and use YUI 2 within the new YUI 3 framework, allowing us access to
    the features of both YUI 2 and 3.


    # Initializing YUI DataSource


    In this recipe, we will create a static HTML table of data in the classic way.
    Once we have created this table, we will go on using it as the basis for a data
    source object that we can in turn pass to YUI DataTable object.


    The DataTable control can be created based on any valid YAHOO.util.DataSource.
    In keeping with the spirit of the concept of progressive enhancement, in this
    example we will use an HTML table as the data source. This allows browsers with
    JavaScript enabled to take advantage of these enhancements.


    # How to do it...


    We begin by creating a PHP file (datatable.php) in the cook directory. This sets
    up a basic environment and displays our data in an HTML table:


    ```

    <php


    require_once(dirname(__FILE__) . ''../config.php'');


    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    $PAGE->set_url(''/cook/datatable.php'');

    $PAGE->requires-js(''/cook/datatable.js'', true);


    echo OUTPUT->header();

    ```


