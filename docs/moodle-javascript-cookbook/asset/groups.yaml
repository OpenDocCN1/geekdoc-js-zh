  - '[PAGE 81]


    # Chapter 4


    | Module | Purpose |

    | --- | --- |

    | datasource-io | Data retrieval |

    | datasource-jschema | Data parsing |

    | node | DOM access (for displaying data in page) |


    +   3. First, we define a new instance of DataSource.IO, passing the path to our
    data file.


    +   4. Next, we tell the data to use the DataSourceJSchema plug-in that we can
    easily parse our JSON data into our desired format.


    +   5. Next, we define a function loadJSON that performs the loading and parsing
    of the data. We call the sendRequest method of the data source, and define two
    callback functions: success and failure.


    +   6. For the success callback function, we iterate the contents of the response
    results to build a string which we display in the page''s textarea element.


    +   7. The failure callback function simply displays the message of the error
    that occurred. If it is well, we will not see this!


    +   8. Finally, we attach the loadJSON function to our Input button to allow the
    user to initiate the request.


    # How it works...


    When the page is loaded, a new DataSource.IO object is instantiated with the source
    set to the data file that we wish to retrieve. Additionally, the object is configured
    to use DataSourceJSchema that describes the format of the file and allows it to
    be automatically parsed into a format useful to us.


    When the user clicks the Input button, the click event is fired and our attached
    function called. This function performs the request to retrieve the data, and
    if everything is successful, the success callback function runs.


    This callback passed the response, which is an object generated from JSON data,
    in the format defined by the JSONSchema we supplied. In this example, we used
    the Array.each utility to build a string containing a list of the results, separated
    by line breaks, which we finally display in the textarea element.


