- md: '

    Setting the fifth argument to client specifies that it is a client-side callback
    function, and is therefore a JavaScript function. Note that setting this argument
    to server would allow the use of a PHP function for callback instead of a JavaScript
    function. Using an additional rule of this type would ensure that validation always
    occurs even if the user has disabled JavaScript in their web browser.


    It is important to note that the validation techniques we covered in this chapter
    mostly rely on JavaScript to be enabled in the user''s web browser. As a result
    of this, robust form validation must always be a combination of convenient client-side
    validation and server-side validation. This ensures that the data received will
    be validated regardless of what features are available within the end user''s
    web browser. This also ensures that potentially malicious clients that attempt
    to circumvent client-side validation are forced to undergo additional validation
    that occurs on the server.


    ## Manipulating Data with YUI 3


    In this chapter, we will cover:


    - Using IO to request a URI

    - Using IO''s alternative transport method for requesting external URIs

    - Using PHP as a proxy to load data from an external domain

    - Parsing XML with DataSource

    - Parsing JSON with DataSource

    - Parsing CSV data with DataSource

    - Retrieving data from a Moodle 2.0 web service


    ## Introduction


    In this chapter, we will look at the ways we can use JavaScript and YUI to retrieve
    and display data from a range of different sources. Using these techniques, we
    can integrate all types of data into our Moodle applications. This list includes
    weather forecasts, stock updates, news feeds, any type of custom text-based data
    you may have from external systems, and even data from Moodle itself (the local
    Moodle system and any remote systems that your code is authorized to access),
    retrieved via Moodle''s web services API.


    Moodle 2.0 includes version 3 of the Yahoo! User Interface Library (YUI 3). YUI
    3 has a rich data processing API which we will look at in this chapter. We will
    cover how to make a simple HTTP GET request to retrieve the contents of a file
    using the IO module, moving on to more complex scenarios such as retrieving data
    from an external domain, parsing a range of data formats, and the consumption
    of XML-based web services.

    '
