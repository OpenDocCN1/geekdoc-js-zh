    # Displaying content in a modal window


    The modal window is another user interface element which is widespread used in
    both operating system and web interfaces alike.


    If a window is described as ''modal'' it will temporarily block the user from
    accessing other parts of the application until the window has been closed. This
    is useful when the application requires some input from the user (for example,
    Yes/No confirmation) before the current workflow can continue.


    This example will show how to display content in a Modal window, overlaying the
    current page content. We will make use of the container module from YUI2 in lieu
    of any alternative native YUI3 at the time of writing.


    # How to do it...


    +   1. First, we define the markup, in this example, modal.php:


    ```

    <?php


    require_once(dirname(__FILE__)) . ''/../config.php'';


    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    $PAGE->set_url(''/cook/modal.php'');

    $PAGE->requires-js(''/cook/modal.js'', true);


    echo OUTPUT->header();


    ?>

    ```'
