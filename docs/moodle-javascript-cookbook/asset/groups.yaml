    \ {\n  var anim = new Y.Anim({\n    node: '#anim-container',\n    to: {\n    \
    \  opacity:1\n    }\n  });\n\n  Y.on(\"contentready\", function () {\n    anim.run();\n\
    \  });\n});\n```\n\n## Fading out an element\n\nIn this recipe, we will produce\
