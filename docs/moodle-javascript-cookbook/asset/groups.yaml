    \ leading libraries in use on the web today is the Yahoo! User Interface Library\
    \ (YUI).\n\n## How it works\n\nWe have created a new instance of the YUI object\
    \ with the method YUI() and immediately call the use method.\n\n## Loading additional\
    \ modules\n\nYUI has a set of utilities and controls, written with JavaScript\
    \ and CSS, for building highly interactive web applications using techniques such\
    \ as DOM scripting, HTML and AJAX. Providing a wide range of functionalities.\
    \ Some examples provided by additional modules include:\n- Animation\n- Drag and\
