    \ screenshot:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_133_0.png)\n\nNote the\
    \ background content is grayed-out and is inaccessible to the user until the window\
    \ is dismissed, in accordance with the modal concept. This allows the designer\
    \ to ensure that the user considers any particularly important information or\
    \ required actions immediately, before they resume their interaction with the\
    \ rest of the page.\n\n## 8\n## Animating Components\n\nIn this chapter, we will\
    \ cover:\n\n- Fading in an element\n- Fading out an element\n- Scrolling an element\n\
    - Resizing an element\n- Animating with Easing\n- Moving an element along a straight\
    \ path\n- Moving an element along a curved path\n- Changing an element's color\n\
    - Sequencing multiple animations\n\n## Introduction\n\nIn this chapter, we will\
    \ look at how to bring elements on our pages to life with the use of animation.\
    \ You must take a rational approach when it comes to where and where to add animation\
    \ into your pages. Try to keep the use of animation only to situations where it\
    \ will benefit the users' experience, and avoid bombarding them with animations\
    \ that serve no purpose.\n\nAnimation can provide beneficial effects in a range\
    \ of situations such as easing the transition from one element to another by fading\
    \ opacity, or by changing the color of an element that requires the user's attention\
    \ by gently pulsing from a light to a dark shade.\n\nWe will be using the animation\
    \ capabilities built into the YUI library, which is included in the standard Moodle\
    \ installation. The basis for all animation consists of changing the value of\
    \ an element's attributes from one specific value to another, over a specified\
    \ time span. For example, to fade-out an element we may change the element's opacity\
    \ from 100% to 0%, or to move an element's position we may change its X and Y\
    \ coordinates.\n\n> Carefully consider when and where to use animation. Ask yourself,\
    \ “Will this improve the user experience?” Avoid unnecessary animations, as they\
    \ will simply distract the user and degrade the usability of your page.\n\n##\
    \ Fading in an element\n\nIn this recipe, we will produce a fade-in effect by\
    \ animating a change in opacity of the element from 0% to 100%. This offers a\
    \ more subtle approach to making an element visible than simply changing from\
    \ invisible to visible, or from not displayed to displayed.\n\nHere we can see\
    \ the key steps in this animation by looking at a selection of frames:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_136_0.png)\n\
    \n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_136_1.png)\n\n## How to do it...\n\n\
    We begin by creating a PHP page to load the Moodle programming environment, which\
    \ in turn loads the YUI3 environment. Starting point, we require an element in\
    \ our page we wish to \"fade-in\". Additionally, we ensure that the element starts\
    \ hidden by setting the CSS 'opacity' to 0.\n\nNext, we need to add JavaScript\
    \ code to change the opacity from 0 to 1. We begin by creating a new YUI instance,\
    \ and loading two modules: `node` and `anim`.\n\nThe node module allows us to\
    \ access events to our page, and the anim module provides us with YUI's animation\
    \ capability. We have now loaded the necessary modules and we can create a new\
    \ instance of the anim module, passing in several parameters. The node parameter\
    \ is the ID of the element we wish to animate, and the to parameter is an object\
    \ containing the attributes we wish to animate, that is, the final values of the\
    \ attributes are changing over time.\n\nIn this example, we just include the opacity\
    \ attribute in the to parameter, and set it to 1, that is, 100%.\n\nFinally, we\
    \ subscribe to the contentready event of the element we are animating. This ensures\
    \ that the element will be loaded completely and is available for use before the\
    \ attached code runs. The code we attach here simply calls the run method of the\
