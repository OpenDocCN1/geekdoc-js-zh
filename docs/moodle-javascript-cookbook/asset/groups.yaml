    \ will reset the height of the <div> element that contains the modal panel, restoring\
    \ it to its original height.\n\nNext, we call the `render` method of the new instance\
    \ of the Panel widget.\n\nFinally, we define a function to display the window.\
    \ In this example, we will attach that to the click of our **Show** button.\n\n\
    When the page is loaded, our JavaScript hides our window content, and renders\
    \ it as a modal type window.\n\nWhen the user clicks the **Show Panel** button,\
    \ the window's `show` method is called. First, the containing <div> element's\
    \ height is set to match the height of the browser window and to ensure that the\
