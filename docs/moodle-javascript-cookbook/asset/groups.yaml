    # Combining Moodle and JavaScript


    In this chapter, we will cover:


    +   - Creating a new Moodle PHP page

    - Loading a JavaScript file

    - Loading a JavaScript file in <head>

    - Generating a JavaScript function call from PHP

    - Passing variables from PHP to JavaScript

    - Ensuring compliance with XHTML Strict

    - Retrieving language strings from Moodle


    # Introduction


    Web pages and websites have come a long way since their inception in the early
    1990s (with the creation of HTML). Modern web applications like Moodle now have
    far more in common with desktop applications than the simple word processing documents
    they originally modeled.


    One key weapon in the modern web application''s arsenal is the subject of this
    book—JavaScript.


    In essence, JavaScript is a programming language that runs in a user''s web browser
    rather than on the web server, allows programmers to manipulate the web page via
    what is called the Document Object Model (DOM). The DOM is a representation of
    the underlying HTML page, structured in a way to provide access to each and every
    element within the HTML page. Modern browsers now implement a standard version
    of the DOM, so it can be considered a cross-platform technology.'
  - '[PAGE 20]


    # Combining Moodle and JavaScript


    In recent years, there has been a significant uptake of the use of JavaScript
    frameworks. A JavaScript framework is a library of JavaScript code that makes
    a JavaScript programmer''s life easier. Generally, they provide more efficient
    methods for performing the most common tasks in JavaScript, such as locating DOM
    elements or wiring up events to those elements.(An event is a function of an element.
    For example, an HTML input button has a "click" event that is fired when the mouse
    is clicked while the pointer is over the button.) Additionally, they provide abstraction
    of browser-specific quirks, making it very easy to write cross-platform code that
    works in the widest range of browsers.


    One JavaScript framework is the Yahoo User Interface library (YUI). YUI is the
    framework of choice for Moodle 2.0, and is included with the standard Moodle 2.0
    package. For this reason, a substantial number of techniques covered in the later
    chapters will be based on the YUI. The final chapter, we will briefly explore
    some other JavaScript frameworks and libraries.


    Perhaps more important than "how" to use JavaScript is the question of "when"
    to use it. It is vital to consider the target audience of your web applications
    and infer from exactly how you use JavaScript.


    If you are building an application that is to be used in a public setting, then
    you should aim to make it as accessible as possible to all types of users. With
    respect to JavaScript specifically, this means that the core functionality of
    your site should be available to those who, for whatever reason, cannot or will
    not use a browser that supports JavaScript(typical examples include a mobile device
    with limited functionality, or a browser using automated-to-speech or screen-reading
    software). These techniques form part of what is known as "progressive enhancement".


    In this chapter, we will learn the basic techniques for integrating our JavaScript
    code with Moodle 2.0. We will learn several methods of including our JavaScript
    code in a Moodle page via .js files, and how to get the code to run. Lastly, we
    will look at some best practices and also how to make Moodle data and language
    strings available to your JavaScript code.


    # Creating a new Moodle PHP page


    The code examples we use in the recipes throughout this book are all based on
    the template we will create in this recipe. This template sets up the necessary
    Moodle environment and displays the standard Moodle header and footer.


    This will allow us to use the generic techniques and techniques available to us
    within Moodle that pertain to JavaScript, allowing you, as the developer, to decide
    how and where to apply them.


    In most instances, it is highly recommended to work with Moodle''s rich plugin
    infrastructure to extend any functionality. This allows you to keep your enhancements
    completely separate from the core of Moodle, preventing you from introducing bugs
    into the core code, and making the Moodle upgrade process just a case of ensuring
    that your particular plugins are copied to the upgraded Moodle installation.'
