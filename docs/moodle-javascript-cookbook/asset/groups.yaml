    Another sample, but effective YUI2 utilize the resize utility. It has a myriad
    uses from the simple (in this example, allowing a block of text to be resizable),
    to the more complicated scenarios (such as resizable forms). It allows a user
    to change the size of the element in question by just dragging handles around
    the page, similar to how the user would resize any application window in an operating
    system''s GUI. This is most useful when the element contains a large amount of
    content, allowing the user to size the element as required.


    # How to do it...


    To begin, set up a simple page, resize.php with a block of text in a containing
    element, as follows:


