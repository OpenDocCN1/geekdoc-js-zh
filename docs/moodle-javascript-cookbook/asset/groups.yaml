    # How it works...


    We start with a div element that we will be animating, setting the desired height
    and width, and also setting a reference ID.


    Next, we move on to the JavaScript code, beginning with creating a new anim object,
    passing the ID of our div. It is here that we will set the first animation in
    the chain, namely, resizing the element by shrinking its width and height to 180px
    and 50px respectively.


    Next, we will define the second animation in its own function, in this case, animEnd.
    This will be later attached to the first animation''s end event. Because of this,
    the first step performed in this function will be to detach this event to ensure
    the second animation occurs only once. Next, we use the set method to fade-out
    the div by changing the opacity to 0. The final step to be performed inside this
    function is to set this animation to run itself.


    Next, we register the function we just created animEnd, attaching it to the original
    anim object.


    In the final step, we set the animation to run when the div has been loaded completely,
    through its contentready event.


    The initial animation occurs in the standard fashion, animating the shrinking
    of the div element. As we have attached a function to the animation''s end event,
    this is called next upon completion of the first ''shrink'' animation.


    The second animation is activated from this event, causing the element to fade-out
    to opacity 0, completing the chain of two animations.


    Further animations may be sequenced by adding additional end event handlers in
    a sequence, that is, a third animation may be added by adding it to the animation''s
    end handler, from the second animation''s event handler function, and so on.'
