    we can be assured that the Dojo framework has loaded correctly.


    # Adding the Prototype framework


    In this recipe, we will set up the Prototype framework for use in our Moodle page.
    We will then set up a simple Prototype script to display a JavaScript alert when
    the page has been loaded completely.


    The following is a brief description of the framework from the Prototype website
    (http://www.prototypejs.org/):


    +   * Prototype is a JavaScript framework that aims to ease development of dynamic
    web applications.


    +   * Featuring a unique, easy-to-use toolkit for class-driven development and
    the nicest Ajax library around, Prototype is quickly becoming the codebase of
    choice for web application developers everywhere.


    Prototype is the basis for two extensions: script.aculo.us and Lightbox. We will
    look these in the next two recipes to further enhance the features available to
    us.


    # Getting ready


    We begin by obtaining a copy of the Prototype framework. Visit the Prototype website
    http://www.prototypejs.org/, and navigate to the download section. Download the
    latest stable version, and save it to your cook directory along with the other
    files used in this recipe.


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_165_0.png)'
- md: "\n## How to do it..\n\nWe now have a local copy of Prototype available. We\
    \ can create a page, external_prototype.php, where we will load the framework\
    \ along with our custom JavaScript file, as follows:\n\n```php\n<?php\n\nrequire_once(dirname(__FILE__)\
    \ . '../../config.php');\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/cook/external_prototype.php');\n$PAGE->requires->js('/cook/prototype.js');\n\
    $PAGE->requires->js('/cook/external_prototype.js');\necho $OUTPUT->header();\n\
    echo $OUTPUT->footer();\n?>\n```\n\nFinally, we create our custom JavaScript file,\
    \ external_prototype.js, with the following content:\n\n```javascript\ndocument.observe(\"\
    dom:loaded\", function() {\n    alert('Hello from Prototype');\n});\n```\n\nWe\
    \ create a PHP file which sets up the Moodle programming environment, and load\
    \ the Prototype framework file. Once the Prototype file has been loaded, we can\
    \ add our own JavaScript file containing the script that makes use of Prototype.\
    \ In this script, we use the document observe method of Prototype to attach a\
    \ JavaScript alert to the page's load event.\n\nWhen we load this page in a browser,\
    \ we see that this event has been fired, and the JavaScript alert is displayed,\
    \ as shown in the following screenshot:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_166_0.png)\n\
    \n## How it works...\n\nThe PHP file loads the Prototype framework. This ensures\
    \ that it has been loaded and is ready for use before our custom JavaScript that\
    \ uses the framework is loaded. Next, our JavaScript is loaded, and uses Prototype\
    \ to register a JavaScript alert to run when the page has finished loading. When\
    \ the page is completely loaded in the browser, we will see the JavaScript alert\
    \ pop-up, confirming that the Prototype framework has loaded correctly.\n\n##\
    \ Adding the script.aculo.us add-on to Prototype\n\nThe script.aculo.us library\
    \ is an add-on for Prototype that contains several user interface enhancements\
    \ such as animation, drag-and-drop and AJAX controls. In this recipe, we will\
    \ set up script.aculo.us and add a shake animation to verify it has loaded correctly.\n\
    \n### Getting ready\n\nFirst, we need to obtain a copy of script.aculo.us by visiting\
    \ http://script.aculo.us/, and navigating to the download page. Download the ZIP\
    \ archive of the current version, and unzip it into a folder named scriptaculous\
    \ inside the cook subdirectory of the Moodle installation used in this, that is,\
    \ /path/to/moodle/cook/scriptaculous.\n\n### How to do it...\n\nCreate a PHP file,\
    \ external_scriptaculous.php, with the following content:\n\n```php\n<?php\nrequire_once(dirname(__FILE__)\
    \ . '/../config.php');\n\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/cook/external_scriptaculous.php');\n$PAGE->requires->js('/cook/prototype.js');\n\
    $PAGE->requires->js('/cook/scriptaculous/scriptaculous.js');\n$PAGE->requires->js('/cook/scriptaculous/effects.js');\n\
    $PAGE->requires->js('/cook/external_scriptaculous.js');\necho $OUTPUT->header('header');\n\
    \n?>\n<div id=\"demo\">Hello from script.aculo.us</div>\n<?php\necho $OUTPUT->footer();\n\
    ?>\n```\n\nFinally, we create a JavaScript file, external_scriptaculous.js, with\
    \ the following content:\n\n```javascript\ndocument.observe(\"dom:loaded\", function()\
    \ {\n  Effect.Shake(\"demo\");\n});\n```\n\n## Integrating External Libraries\n\
    \nNow when we load this page in a web browser, we can see the shake effect in\
    \ action. The following screenshots show a selection of frames from the shake\
    \ effect animation. Note that the text we have applied the effect is shifted back\
    \ and forth from left to right, as if the text is being shaken from side to side,\
    \ before settling back to its original position:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_168_0.png)\n\
    \n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_168_1.png)\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_168_2.png)\n\
    \n## How it works...\n\nFirst, we download the script.aculo.us files and save\
    \ them in a folder named scriptaculous alongside our Moodle files in the cook\
    \ sub-directory.\n\nNext, we create a PHP file where we will load the necessary\
    \ JavaScript files. They are, in order:\n\n- /cook/prototype.js\n- /cook/scriptaculous/scriptaculous.js\n\
    - /cook/scriptaculous/effects.js\n- /cook/external_scriptaculous.js\n\nWe now\
    \ add a div tag to the body of the PHP page, which contains some sample text.\
    \ We apply the shake animation effect to this element, so we add an ID to the\
    \ tag for future reference.\n\nFinally, we add some code to our JavaScript file\
    \ external_scriptaculous.js. We set up a page load function, using Prototype as\
    \ in the previous recipe. Inside this function, we will use script.aculo.us to\
    \ apply a shake animation effect to our div element.\n\n## Adding image with Lightbox\n\
    \nLightbox 2 is a very popular script based on script.aculo.us (and in turn, based\
    \ on Prototype) which provides a slick way to open links to high-resolution versions\
    \ of images in a modal window. In this recipe, we will integrate Lightbox 2 into\
    \ our page, and add an image thumbnail to which we will apply Lightbox 2 functionality.\n\
    \n### Getting ready\n\nFirst, we need to obtain a copy of Lightbox 2, by visiting\
    \ http://lightbox.com/projects/lightbox2/, and navigating to the download section.\
    \ Download the ZIP file of the latest version, and unpack it to the `cook` subdirectory\
    \ of the Moodle installation used in this example, is `/path/to/moodle/cook/lightbox2`.\n\
    \nLightbox 2 contains links to images relative to the page on which you have loaded\
    \ the script. To ensure that these images are available to the script, copy the\
    \ images folder to the same location as your script, in our example, `/path/to/moodle/cook/images`.\n\
    \n## Integrating External Libraries\n\n### How to do it...\n\nCreate a PHP page,\
    \ external_lightbox.php, in which to set up Lightbox 2. Note that we will require\
    \ a sample image for the example, in this case flower.jpg:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_170_0.png)\n\
    \nThe content of the PHP file is follows:\n\n```php\n<?php\nrequire_once(dirname(__FILE__)\
    \ . '/../config.php');\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/cook/external_lightbox.php');\n$PAGE->requires->js('/cook/prototype.js');\n\
    $PAGE->requires->js('/cook/scriptaculous/scriptaculous.js');\n$PAGE->requires->js('/cook/scriptaculous/effects.js');\n\
    $PAGE->requires->js('/cook/scriptaculous/builder.js');\n$PAGE->requires->js('/cook/lightbox2/js/lightbox.js');\n\
    $PAGE->requires->css('/cook/lightbox2/css/lightbox.css');\n\necho $OUTPUT->header();\n\
    \n<a href=\"flower.jpg\" rel=\"lightbox\"><img src=\"flower.jpg\" width=\"150\"\
    >\n<?php\necho $OUTPUT->footer();\n?>\n```\n\nWe can now load this page in a web\
    \ browser, and see the enhanced Lightbox image viewer in action. Firstly, a thumbnail\
    \ of the flower image is displayed as normal:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_171_0.png)\n\
    \nWe can now click on this thumbnail to activate the detailed view of the full\
    \ resolution image inside the modal Lightbox window, as shown in the following\
    \ screenshot:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_171_1.png)\n\n### How\
    \ it works...\n\nOnce we have downloaded Lightbox 2 and saved it to a suitable\
    \ location, we can begin implementing it in our PHP page external_lightbox.php.\
    \ After setting up the standard Moodle programming environment, we begin including\
    \ the following necessary JavaScript files, in specific order:\n\n1. /cook/prototype.js\n\
    2. /cook/scriptaculous/scriptaculous.js\n3. /cook/scriptaculous/effects.js\n4.\
    \ /cook/scriptaculous/builder.js\n5. /cook/lightbox2/js/lightbox.js\n\nThe order\
    \ is important, as there is a hierarchy of dependence. This means Lightbox 2 requires\
    \ script.aculo.us to be available, and in turn, script.aculo.us requires Prototype\
    \ to.\n\nNext, we include the Lightbox 2 CSS file /cook/lightbox2/css/lightbox.css.\n\
    \nFinally, we add a thumbnail of our sample image, flower.jpg, and enclose it\
    \ in a link (`<a>` tag) to the high-resolution version. We activate Lightbox 2\
    \ functionality on this thumbnail by adding a rel attribute and setting its value\
    \ to lightbox. Now when we load the page, and click on the link, we see that the\
    \ high-resolution image is displayed in an attractive modal image viewer.\n\n\
    ### There's more...\n\nLightbox 2 is very unobtrusive, which uses progressive\
    \ enhancement techniques. This means we need to make only minimal changes to our\
    \ existing HTML markup, that is, simply add the required rel attribute to the\
    \ images for we wish to enable Lightbox. The result of this is that if JavaScript\
    \ is not available in the user's browser, they will still have a regular link\
    \ through the high-resolution version of the image.\n\nOnce all the requisite\
    \ JavaScript and CSS files are loaded correctly in the page, Lightbox 2 will seamlessly\
    \ activate the modal image viewer for all hyperlinks with the rel=\"lightbox\"\
    \ attribute set.\n"
  mdcn: "\n\n## 如何操作..\n\n我们现在已经有了 Prototype 的本地副本。我们可以创建一个名为 `external_prototype.php`\
    \ 的页面，在其中我们将加载框架以及自定义的 JavaScript 文件，如下所示：\n\n```php\n<?php\n\nrequire_once(dirname(__FILE__)\
    \ . '../../config.php');\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/cook/external_prototype.php');\n$PAGE->requires->js('/cook/prototype.js');\n\
    $PAGE->requires->js('/cook/external_prototype.js');\necho $OUTPUT->header();\n\
    echo $OUTPUT->footer();\n?>\n```\n\n最后，我们创建自定义的 JavaScript 文件 `external_prototype.js`，内容如下：\n\
    \n```javascript\ndocument.observe(\"dom:loaded\", function() {\n    alert('Hello\
    \ from Prototype');\n});\n```\n\n我们创建一个 PHP 文件来设置 Moodle 编程环境，并加载 Prototype 框架文件。一旦\
    \ Prototype 文件加载完成，我们就可以添加自己的 JavaScript 文件，其中包含使用 Prototype 的脚本。在该脚本中，我们使用 Prototype\
    \ 的 `document observe` 方法为页面加载事件绑定一个 JavaScript 警报。\n\n当我们在浏览器中加载此页面时，我们看到该事件已触发，并显示了\
    \ JavaScript 警报，如下图所示：\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_166_0.png)\n\
    \n## 工作原理...\n\nPHP 文件加载了 Prototype 框架。这确保了在我们在使用框架的自定义 JavaScript 加载之前，它已经加载并准备就绪。接下来，加载我们的\
    \ JavaScript，并使用 Prototype 注册一个在页面完成后运行的 JavaScript 警报。当页面在浏览器中完全加载后，我们将看到 JavaScript\
    \ 警报弹出，确认 Prototype 框架已正确加载。\n\n## 为 Prototype 添加 script.aculo.us 插件\n\n`script.aculo.us`\
    \ 库是 Prototype 的一个插件，包含许多用户界面增强功能，如动画、拖放和 AJAX 控制。在本教程中，我们将设置 `script.aculo.us`\
    \ 并添加一个抖动动画以验证它是否已正确加载。\n\n### 准备工作\n\n首先，我们需要通过访问 http://script.aculo.us/ 并导航到下载页面来获取\
    \ `script.aculo.us` 副本。下载当前版本的 ZIP 压缩包，并解压到 Moodle 安装目录中 `cook` 子目录下的名为 `scriptaculous`\
    \ 的文件夹中，即 `/path/to/moodle/cook/scriptaculous`。\n\n### 如何操作...\n\n创建一个 PHP 文件\
    \ `external_scriptaculous.php`，内容如下：\n\n```php\n<?php\nrequire_once(dirname(__FILE__)\
    \ . '/../config.php');\n\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/cook/external_scriptaculous.php');\n$PAGE->requires->js('/cook/prototype.js');\n\
    $PAGE->requires->js('/cook/scriptaculous/scriptaculous.js');\n$PAGE->requires->js('/cook/scriptaculous/effects.js');\n\
    $PAGE->requires->js('/cook/external_scriptaculous.js');\necho $OUTPUT->header('header');\n\
    \n?>\n<div id=\"demo\">Hello from script.aculo.us</div>\n<?php\necho $OUTPUT->footer();\n\
    ?>\n```\n\n最后，我们创建一个 JavaScript 文件 `external_scriptaculous.js`，内容如下：\n\n```javascript\n\
    document.observe(\"dom:loaded\", function() {\n  Effect.Shake(\"demo\");\n});\n\
    ```\n\n## 集成外部库\n\n现在当我们在网页浏览器中加载此页面时，我们可以看到抖动效果生效。以下截图显示了抖动动画效果的一些帧。请注意，我们应用效果的文本在左右之间移动，仿佛文本正在左右抖动，最后才回到原始位置：\n\
    \n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_168_0.png)\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_168_1.png)\n\
    \n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_168_2.png)\n\n## 工作原理...\n\n首先，我们下载\
    \ `script.aculo.us` 文件并将其保存到 `cook` 子目录中与 Moodle 文件并列的 `scriptaculous` 文件夹中。\n\
    \n接下来，我们创建一个 PHP 文件，在其中加载必要的 JavaScript 文件。它们按顺序为：\n\n- /cook/prototype.js\n-\
    \ /cook/scriptaculous/scriptaculous.js\n- /cook/scriptaculous/effects.js\n- /cook/external_scriptaculous.js\n\
    \n现在我们在 PHP 页面的 `body` 中添加一个 `div` 标签，其中包含一些示例文本。我们为此元素应用抖动动画效果，因此为了以后引用，我们为标签添加了\
    \ ID。\n\n最后，我们在我们的 JavaScript 文件 `external_scriptaculous.js` 中添加一些代码。我们设置了一个页面加载函数，像上一个教程一样使用\
    \ Prototype。在函数内部，我们将使用 `script.aculo.us` 为我们的 `div` 元素应用抖动动画效果。\n\n## 使用 Lightbox\
    \ 添加图片\n\nLightbox 2 是一个非常流行的基于 `script.aculo.us` 的脚本，包含许多用户界面增强功能，如动画、拖放和 AJAX\
    \ 控制。在本教程中，我们将设置 Lightbox 2 并添加一个抖动动画以验证其是否已正确加载。\n\n### 准备工作\n\n首先，我们需要通过访问 http://lbox2.com/\
    \ 并导航到下载页面来获取 Lightbox 2 副本。下载最新版本的 ZIP 压缩包，并将其解压到 Moodle 安装目录中 `cook` 子目录下的名为\
    \ `lightbox2` 的文件夹中，即 `/path/to/moodle/cook/lightbox2`。\n\nLightbox 2 是一个非常流行的基于\
    \ `script.aculo.us` 的脚本，包含许多用户界面增强功能，如动画、拖放和 AJAX 控制。在本教程中，我们将设置 Lightbox 2 并添加一个抖动动画以验证其是否已正确加载。\n\
    \n### 集成外部库\n\n### 如何操作...\n\n创建一个名为 `external_prototype.php` 的页面，在其中我们将加载框架以及我们自定义的\
    \ JavaScript 文件，如下所示：\n\n```php\n<?php\nrequire_once(dirname(__FILE__) . '../../config.php');\n\
    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n$PAGE->set_url('/cook/external_prototype.php');\n\
    $PAGE->requires->js('/cook/prototype.js');\n$PAGE->requires->js('/cook/external_prototype.js');\n\
    echo $OUTPUT->header();\necho $OUTPUT->footer();\n?>\n```\n\n最后，我们创建自定义的 JavaScript\
    \ 文件 `external_prototype.js`，内容如下：\n\n```javascript\ndocument.observe(\"dom:loaded\"\
