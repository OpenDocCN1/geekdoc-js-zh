  - '[PAGE 95]


    # Chapter 5


    The HTML table we have constructed consists of a standard two-column table with
    headers and rows clearly defined inside `&lt;head&gt;` and `&lt;th&gt;` tags Verifying
    that the table header information is stored correctly allows YUI 2 to ensure that
    it is not included as part of the actual data set.


    Moving on to our JavaScript code, we initialize a new YUI 3 environment in the
    standard way, loading the required module: `yui2-datatable`.


    There is currently no YUI 3 version of the DataObject, so we will use the YUI
    2 version. This is done by setting up the YUI 2 object YAHOO which is available
    in the object YUI2


    Next, we create a new YUI 2 DataSource, passing a reference to our HTML table
    with ID `cookie`. We then set the `responseType` of the DataTable to identify
    it as an HTML table.


    Finally, we set the `schema` of the DataTable with a key and also define the data
    type of the columns; in this case, `number` and `string` respectively.


    We have a YUI 2 DataSource populated from our HTML table. This can be used with
    any YUI 2 DataSource compatible code. In this example, we will pass this object
    to the YAHOO control to as the basis for an interactive data control.


    # How it works...


    We used mixture of YUI 2 and YUI 3 code. YUI 3 allows us to use the simplified
    syntax for loading modules, and YUI 2 allows us to use the DataTable control in
    lieu of YUI 3 replacement.


    YUI 3 provides us with an instance of YUI 2, which is available in `YUI2`. We
    copied this into the YAHOO object, for the convenience of being able to use exactly
    the same syntax as in native YUI  code.


    When we point the DataSource constructor at our HTML table, it is able to extract
    the data into a new YUI 2 DataSource object by using the `responseType YAHOO.util`.
    `DataSource.TYPE_HTMLDATABLE`.


    # Displaying data


    In this recipe, we use the DataSource object that we prepared from our HTML table
    in the previous recipe. We will use it as the basis for a new DataTable control,
    and we will begin to see the enhancements that this affords.


    Now we have a DataSource object available, we can move on creating the actual
    DataTable control. This example builds on the previous recipe, adding additional
    code to the existing JavaScript. However, it should be clear that the DataSource
    we built in the previous recipe may be substituted for any other (for example,
    a DataSource built from data retrieved from an XML web service).


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_95_0.png)'
