    \n## 2 Moodle 和 Yahoo! 用户界面库 (YUI)\n\n在本章中，我们将涵盖：\n\n- 初始化 YUI 3 库\n- 加载 YUI 3\
    \ 模块\n- 从 YUI 3 加载 YUI 2 模块\n- 绑定基础事件处理器\n- 绑定高级 DOM 事件处理器\n- 实现事件委托（Event Delegation）\n\
    - 使用 YUI 控制台进行调试\n\n# 简介（Introduction）\n\n编写 JavaScript 时，需要执行许多常见任务。其中很大一部分仅仅涉及到处理\
    \ Web 浏览器之间的差异。为了能够隐藏或将每个浏览器的特定细节抽象为标准接口，产生了被称为 JavaScript 库的工具集。今天 Web 上最广泛使用的库之一是\
    \ Yahoo! 用户界面库 (YUI)。\n\n# Moodle 和 Yahoo! 用户界面库 (YUI)\n\nMoodle 包含一个 YUI 副本作为其首选的\
    \ JavaScript 库。YUI 为开发者提供了广泛的工具来增强他们的 Web 应用程序：\n\nYUI 库是一组用 JavaScript 和 CSS\
    \ 编写的工具和控件，用于通过 DOM 脚本、HTML 和 AJAX 等技术构建高度交互的 Web 应用程序。YUI 以 BSD 许可提供，对所有用户免费。YUI\
    \ 被证明是成熟、可扩展、快速且健壮的。它由来自的前端工程师和贡献者构建，是一个为热爱 JavaScript 的人士提供的工业级 JavaScript 库。\n\
    \nYahoo! Developer Network\nhttp://developer.yahoo.com/yui/\n\n在本章中，我们将学习使用 YUI\
    \ 的基础知识。我们将学习如何初始化 YUI 并使其准备好供我们的代码使用，以及从 YUI 的 2 和 3 版本加载额外的模块。我们还将学习如何通过向我们的控件绑定事件来管理代码的执行，最后如何使用\
    \ YUI 日志工具调试代码。\n\n# 初始化 YUI 3 库\n\n在本食谱中，我们将学习如何在 Moodle 中初始化 YUI 3 环境，这将使我们能够使用\
    \ YUI 特性。Moodle 处理了大部分的初始设置，即加载所需的 CSS 和 JavaScript 文件，因此我们只需要关注激活 YUI 环境即可。\n\
    \n此示例将展示如何在 YUI 环境内部执行 JavaScript 代码。我们将设置一个小小的 YUI 脚本，它将简单地在 JavaScript alert\
    \ 框中显示包含活动 YUI 环境版本号的消息。\n\n这提供了一个让 YUI 运行所需的示例视图，我们将在随后的食谱中在此基础上构建。\n\n# 准备工作（Getting\
