    《Moodle JavaScript 食谱》将带你了解结合 Moodle 与 JavaScript 的基础知识，并解释如何配合 Moodle 一使用 JavaScript。它将解释如何将
    Yahoo! 用户界面库 (YUI) 集成到 Moodle 中。YUI 将是本书的重点，也是实现现代、动态、功能丰富的界面的关键，帮助你的用户获得更满意、更高效的
    Moodle 体验。它将使你能够添加特效、让表单响应迅速、使用 AJAX 和动画来创建更丰富的用户体验。你将学习一系列 YUI 特性，例如从其他网站获取并显示信息、增强现有的
    UI 元素以使用户生活更轻松，甚至为你的页面添加动画以达到锦睛之笔。


