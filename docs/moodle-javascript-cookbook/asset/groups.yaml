    $form->addRule(''mytext4'', ''Length 3-5'', ''rangelength'',

    array(3,5), ''client'');

    ```


    Now we can test this validation in a web browser and will notice that if we enter
    text falls outside the required range, our warning message will be displayed and
    the user will be unable to proceed as seen in the following screenshot:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_57_0.png)


    # How it works...


    We used the validation type, rangelength, which takes a format option in the form
    of an array containing two values: the lower and upper bounds for the length of
    an input. The use of an array here allows us easily to pass a pair of values in
    a single parameter to the addRule method.'
  - '[PAGE 58]


    Moodle Forms Validation –


    Now when a user attempts to submit text of length outside the required range,
    our warning message will be displayed and they will be unable to submit the form
    until the text meets the required validation rule.


    # Adding a valid e-mail address field


    In this recipe, we will add a rule that ensures the user has entered a valid e-mail
    address. This rule should be fairly self-explanatory. It simply checks that the
    text is the standard "user@example.com"


    # Getting ready


    Please refer to the first recipe in this chapter for details on how to prepare
    a QuickForm form which is the basis of this recipe.


    # How to do it...


    Add the following code to our form definition in validation_form.php just after
    the field definition:


    ```

    $mform->addElement(''text'', ''mytext6'', ''Email'');

    $mform->addRule(''mytext6'', ''Email'', ''email'', null, ''client'');

    ```


    Now we can test this by entering a domain name instead of a valid e-mail address.
    Notice that we are unable to submit the form, and our warning message is as seen
    in the following screenshot:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_58_0.png)


    # How it works...


    We used the validation type email which requires no format option, as the format
    of an e-mail address is pre-defined and is therefore not configurable. If the
    user has entered an invalid e-mail address, our warning message will be displayed
    and they will be unable to submit the form until they have corrected the format
    of the e-mail address.


