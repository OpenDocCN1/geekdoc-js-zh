    \ to 0%. This offers a more subtle approach to making an element invisible than\
    \ simply using CSS to change the visibility or display properties to hidden or\
    \ none.\n\nWe can see the key steps in this animation by looking at the following\
    \ selection of frames:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_138_0.png)\n"
