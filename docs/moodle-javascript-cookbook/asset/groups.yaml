    * Handling DOM events (this is an input button''s "click")

    * Handling data (JSON/XML)


    For a current list of all the modules available, please refer to the Yahoo! Developer
    website for YUI 3 at the URL: http://developer.yahoo.com/yui/3/


    # How to do it...


    The loading of additional modules is achieved via the use method of the YUI object.
    In the previous recipe we learned to run our code using the use method with the
