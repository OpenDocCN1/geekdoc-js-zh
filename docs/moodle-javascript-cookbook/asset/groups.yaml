    ?>\n```\n\nNotice that the preceding code references a JavaScript file yui_init.js,\
    \ which has the following content:\n\n```javascript\nYUI().use\n{\n  function(Y)\n\
    \  {\n    alert('Hello from YUI ' + Y.version);\n  }\n};\n```\n\n# How to do it?\n\
    \nWe have created a PHP file that sets up a Moodle programming environment and\
