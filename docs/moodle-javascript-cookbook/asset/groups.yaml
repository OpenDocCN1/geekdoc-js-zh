  - '[PAGE 55]


    # Adding a field with a maximum length


    In this recipe, we will define a field that has a maximum length constraint. This
    could be used when you require concise summary text to be entered, for example,
    when screen "real estate" is at a premium. Alternatively, it would be useful for
    situations when the particular column of a database into which the data will be
    saved only accepts a certain number of characters.


    # Getting ready


    Please refer to the first recipe in this chapter for details on how to prepare
    a QuickForm form which is the basis of this recipe.


    # How to do it...


    Add the following code to our form definition in validation_form.php just after
    the field definition:


    ```

    $mform->addElement(''text'', ''mytext2'', ''Max length 5'');

    $mform->addRule(''mytext2'', ''Max length 5'', 5, ''client'');

    ```


    When we try out this form by entering six characters, we are unable to submit
    the form and our validation warning message is displayed in the following screenshot:


    | Moodle JavaScript Cookbook |

    | Max length | Max length 5 |

    |---|---|

    | 123456 |

    | Submit |

    | Moodle Docs for this page

    | You are logged in as Admin User (Logout)|

    | Home |


    # How it works...


    We used the validation type maxLength which takes a format option in the form
    of an integer representing the maximum allowable length of the input.


    If the user enters text comprised of more characters than we have allowed (in
    this example, 5), the warning message we had configured is displayed and the user
    is unable to submit the form until the input is made valid, is reduced to five
    or fewer characters.'
- md: '

    # Moodle Forms Validation


    ## Adding a field with a minimum length


    In this recipe, we will apply a validation constraint that forces the user to
    enter text of a minimum number of characters. This could be used for cases where
    a certain number of characters are expected, for example, in a postal code or
    a telephone number.


    ### Getting ready


    Please refer to the first recipe in this chapter for details on how to prepare
    a QuickForm web form which is the basis of this recipe.


    ### How to do it...


    Add the following code to our form definition in validation_form.php just after
    the field definition:


    ```

    $mform->addElement(''text'', ''mytext3'', ''Min length 5'');

    $mform->addRule(''mytext3'', ''Min length 5'', ''minlength'', 5, ''client'');

    ```


    Now we can try this rule in the web browser. When we enter a string of only four
    characters, we are unable to submit the form and our warning message is displayed
    as seen in the following screenshot:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_56_0.png)


    ### How it works...


    We used the validation type minlength which takes a format option in the form
    of an integer representing the minimum allowable length of the input.


    In this case, we specified that the text must contain at least five characters.
    When we enter a string of four characters or less, we are unable to submit the
    form until we satisfy this minimum length by providing at least five characters.


    ## Adding a field length within a specified range


    In this recipe, we will learn how to add a rule to ensure the length of text entered
    falls into a specified range of numbers of characters. Again, this could be used
    to validate information, such as a telephone number whose length must fall in
    a particular range to be accepted.


    ### Getting ready


    Please refer to the first recipe in this chapter for details on how to prepare
    a QuickForm form which is the basis of this recipe.


    ### How to do it...


    Add the following code to form definition in validation_form.php just after the
    field definition:


    ```

    $form->addElement(''text'', ''mytext4'', ''Length 3-5'');

    $form->addRule(''mytext4'', ''Length 3-5'', ''rangelength'',

    array(3,5), ''client'');

    ```


    Now we can test this validation in a web browser and will notice that if we enter
    text falls outside the required range, our warning message will be displayed and
    the user will be unable to proceed as seen in the following screenshot:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_57_0.png)


    ### How it works...


    We used the validation type, rangelength, which takes a format option in the form
    of an array containing two values: the lower and upper bounds for the length of
    an input. The use of an array here allows us easily to pass a pair of values in
    a single parameter to the addRule method.


    ## Moodle Forms Validation


    Now when a user attempts to submit text of length outside the required range,
    our warning message will be displayed and they will be unable to submit the form
    until the text meets the required validation rule.


    ## Adding a valid e-mail address field


    In this recipe, we will add a rule that ensures the user has entered a valid e-mail
    address. This rule should be fairly self-explanatory. It simply checks that the
    text is the standard "user@example.com"


    ### Getting ready


    Please refer to the first recipe in this chapter for details on how to prepare
    a QuickForm form which is the basis of this recipe.


    ### How to do it...


    Add the following code to our form definition in validation_form.php just after
    the field definition:


    ```

    $mform->addElement(''text'', ''mytext6'', ''Email'');

    $mform->addRule(''mytext6'', ''Email'', ''email'', null, ''client'');

    ```


    Now we can test this by entering a domain name instead of a valid e-mail address.
    Notice that we are unable to submit the form, and our warning message is as seen
    in the following screenshot:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_58_0.png)


    ### How it works...


    We used the validation type email which requires no format option, as the format
    of an e-mail address is pre-defined and is therefore not configurable. If the
    user has entered an invalid e-mail address, our warning message will be displayed
    and they will be unable to submit the form until they have corrected the format
    of the e-mail address.


    ## Adding custom validation with a Regular Expression


    Regular Expressions are a powerful method for matching the pattern of strings
    of text. This has particular relevance to text validation. In this recipe, we
    will add a simple regular expression to validate a URL which will require the
    text entered to begin with http://. This method does, however, allow any valid
    Regular Expression making it particularly flexible for validating any pattern
    that can be represented in a Regular Expression.


    ### Getting ready


    Please refer to the first recipe in this chapter for details on how to prepare
    a QuickForm web form which is of this recipe.


    ### How to do it...


    Add the following code to our form definition in validation_form.php, just after
    the field definition:


    ```

    $form->addElement(''text'', ''mytext5'', ''URL'');

    $form->addRule(''mytext5'', ''URL'', ''regex'', ''http://'', ''server'');

    ```


    When we test this new rule by entering a domain name instead of a full HTTP URL,
    our warning message will be displayed and once again we will not be able to submit
    the form until we have reformatted the text into a full URL, as seen in the following
    screenshot:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_59_0.png)


    ### How it works...


    We used the validation type regex which takes a format option in the form of a
    standard Regular Expression.


    ## Moodle Forms Validation


    Note that Moodle forms does not support client-side regular expression. Therefore,
    the fifth argument must be set to server as opposed to client.


    ## Adding a field that accepts only alphabetic characters


    In this recipe, we will add a rule that forbids all characters except alphabetic,
    that is, letters.


    ### Getting ready


    Please refer to the first recipe in this chapter for details on how to prepare
    a QuickForm form which is the basis of this recipe.


    ### How to do it...


    Add the following code to your form definition in validation_form.php. Just after
    the field definition:


    ```

    $mform->addElement(''text'', ''mtext7'', ''Letters only'');

    $mform->addRule(''mtext7'', ''Letters only'', ''lettersonly'',

    null, ''client'');

    ```


    When we test this rule by entering numeric characters, our warning message is
    displayed and we are not able to submit the form as seen in the following screenshot:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_60_0.png)


    ### How it works...


    We used the validation type letteronly which does not require any format options.
    Now when a user attempts to submit the form after entering non-alphabetic characters,
    they will not be able to proceed but will be shown the validation warning we had
    configured.


    ## Adding a field that accepts only alphanumeric characters


    In this recipe, we will add a rule that accepts only alphanumeric characters,
    that is, the digits 0-9 and a-z in upper or lower case.


    ### Getting ready


    Please refer to the first recipe in this chapter for details on how to prepare
    a QuickForm web form which is the basis of this recipe.


    ### How to do it...


    Add the following code to our form definition in validation_form.php, just after
    the field definition:


    ```

    $form->addElement(''text'', ''mytext8'', ''Alpha-numeric'');

    $form->addRule(''mytext8'', ''Alpha-numeric'', ''alphanumeric'',

    null, ''client'');

    ```


    Now we can test this new rule by entering text including non-alphanumeric characters.
    In the following example, we have enclosed our text in non-alphanumeric double
    quotes. We see that the warning message is displayed and we are unable to submit
    the form as seen in the following screenshot:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_61_0.png)


    ### How it works...


    We used the validation type alphanumeric which does not require any format options.
    When a user enters any character that is not either a digit (0-9) or a letter
    (a-z in upper or lower case), a validation is displayed and they are unable to
    submit the form until they have removed the invalid characters.

