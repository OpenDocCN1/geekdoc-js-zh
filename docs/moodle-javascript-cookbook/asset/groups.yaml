  - '[PAGE 61]


    # Adding a field that accepts only alphanumeric characters


    In this recipe, we will add a rule that accepts only alphanumeric characters,
    that is, only the digits 0-9 and a-z in upper or lower case.


    # Getting ready


    Please refer to the first recipe in this chapter for details on how to prepare
    a QuickForm web form which is the basis of this recipe.


    # How to do it...


    Add the following code to our form definition in validation_form.php, just after
    the field definition:


    ```

    $form->addElement(''text'', ''mytext8'', ''Alpha-numeric'');

    $form->addRule(''mytext8'', ''Alpha-numeric'', ''alphanumeric'',

    null, ''client'');

    ```


    Now we can test this new rule by entering text including non-alphanumeric characters.
    In the following example, we have enclosed our text in non-alphanumeric double
    quotes. We see that the warning message is displayed and we are unable to submit
    the form as seen in the following screenshot:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_61_0.png)


    # How it works...


    We used the validation type alphanumeric which does not require any format options.
    When a user enters any character that is not either a digit (0-9) or a letter
    (a-z in upper or lower case), a validation is displayed and they are unable to
    submit the form until they have removed the invalid characters.'
- md: "\n# Adding a field that accepts only numeric characters\n\nIn this recipe,\
    \ we will add a rule that accepts only numeric characters, that is, digits 0-9.\
    \ This could be useful, for example, when the user is required to enter a reference\
    \ number or a currency value.\n\n# Getting ready\n\nPlease refer to the first\
    \ recipe in this chapter for details on how to prepare a QuickForm web form which\
    \ is the basis of this recipe.\n\n# How to do it...\n\nAdd the following code\
    \ to our definition in `validation_form.php`, just after the definition:\n\n```\n\
    $mform->addElement('text', 'mytext9', 'Numeric');\n$mform->addRule('mytext9',\
    \ 'Numeric', null, 'client');\n```\n\nWhen we test this new rule by entering non-numeric\
    \ characters (in this example, we entered the string `abc`) our validation warning\
    \ message is displayed and we are unable to submit the form as seen in the following\
    \ screenshot:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_62_0.png)\n\n# How it\
    \ works...\n\nWe use the validation type `numeric` which does not require any\
    \ format options. Now when a user enters anything other than the digits (0-9),\
    \ they will see a validation warning message and will be unable to proceed until\
    \ they have removed the invalid non-numeric characters.\n\n# Rejecting punctuation\
    \ characters\n\nIn this recipe, we will add a rule that prevents the input of\
    \ punctuation characters. This could be useful, for example, where you require\
    \ the title of a new document to not contain periods or commas.\n\n# Getting ready\n\
    \nPlease refer to the first recipe in this chapter for details on how to prepare\
    \ a QuickForm form which is the basis of this recipe.\n\n# How to do it...\n\n\
    Add the following code to our form definition in validation_form.php, just after\
    \ the field definition:\n\n```\n$mform->addElement('text', 'mtext10', 'No punctuation');\n\
    $mform->addRule('mtext10', 'No punctuation', 'nopunctuation', null, 'client');\n\
    ```\n\nWhen we test this rule by entering text that includes punctuation characters\
    \ (a comma or period), we see that the warning message is displayed and we are\
    \ unable to submit the form as seen in the following screenshot:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_63_0.png)\n\
    \n# How it works...\n\nWe use the validation nopunctuation which does not require\
    \ any format options. When a user enters text including any punctuation character,\
    \ the validation warning message will be displayed and they will be unable to\
    \ submit the form until they have removed the invalid characters.\n\n# Rejecting\
    \ input without a leading zero\n\nIn this recipe, we will add a rule that requires\
    \ a valid number to be entered, without a leading digit O. This is useful for\
    \ validating whole numbers without zero padding.\n\n## Getting ready\n\nPlease\
    \ refer to the first recipe in this chapter for details on how to prepare a QuickForm\
    \ form which is the base of this recipe.\n\n## How to do it...\n\nAdd the following\
    \ code to our form definition in validation_form.php, just after the field definition:\n\
    \n```\n$mform->addElement('text', 'mtext1', 'No leading zero');\n$mform->addRule('mtext1',\
    \ 'No leading zero', 'nonzero', null, 'client');\n```\n\nNow we can test the rule\
    \ by adding an invalid sequence of digits with a leading zero: 0123. We see that\
    \ our validation warning message is displayed and we are unable to submit the\
    \ form as seen in the following screenshot.\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_64_0.png)\n\
    \n## How it works...\n\nWe used the validation type nonzero which does not require\
    \ any format options. When a user attempts to enter text that contains a leading\
    \ zero, a validation warning message is displayed and they are unable to proceed\
    \ with the form submission until the invalid character has been removed.\n\n#\
    \ Comparing with another field\n\nIn this recipe, we will add a rule that allows\
    \ us to ensure the contents of two fields are identical. The classic example of\
    \ this type of validation is where the accuracy of the information we require\
    \ from the user is vital (for example, a password or an e-mail address). We ensure\
    \ they enter it twice, compare both the entries, and display a warning if they\
    \ are not identical.\n\n# Getting ready\n\nPlease refer to the first recipe in\
    \ this chapter for details on how to prepare a QuickForm form which is the base\
    \ of this recipe.\n\n# How to do it...\n\nAdd the following code to our form definition\
    \ in validation_form.php, just after the field definition:\n\n```\n$mform->addElement('text',\
    \ 'mtext11', 'Must match');\n$mform->addRule('mtext11', 'Must match', 'compare',\
    \ null, 'server');\n```\n\nNow we can test the rule by entering different values\
    \ into each text box. We see that our validation warning message is displayed\
    \ and we are unable to submit the form as seen in the following screenshot:\n\n\
    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_65_0.png)\n\n# How it works...\n\nWe\
    \ used the validation type `compare` which takes slightly different arguments.\
    \ The first argument must be an array of the names of the elements. The format\
    \ option is a string which specifies the type of comparison.\n\n| Format option\
    \ | Description |\n| :--- | :--- |\n| eq | The first element's value is equal\
    \ to the second |\n| != | The first element's value is not equal to the second\
    \ |\n| gt | The first element's value is greater than the second |\n| ge | The\
    \ first element's value is greater or equal to the second |\n| lt | The first\
    \ element's value is less than the second |\n| lte | The first element's value\
    \ is less or equal to the second |\n\n# Adding a custom JavaScript function callback\n\
    \nIn this recipe, we will look at how we can validate the contents of a box manually\
    \ using JavaScript. This gives us complete flexibility by allowing us to use any\
    \ tool available within JavaScript to validate the input. For example, we could\
    \ perform validation based on today's date, or even look up values against an\
    \ web service.\n\n# Getting ready\n\nPlease refer to the first recipe in this\
    \ chapter for details on how to prepare a QuickForm web which is the basis of\
    \ this recipe.\n\n# How to do it...\n\nAdd the following code to our form definition\
    \ in validation_form.php, just after the definition:\n\n```\n$mform->addElement('text',\
    \ 'mtext13', 'Custom');\n$mform->addRule('mtext13', 'Custom', 'callback', 'mycallback',\
    \ 'client');\n```\n\nWe specified a custom validation function callback. In our\
    \ example, we must edit validation.php to include a JavaScript file that includes\
    \ our callback function:\n\n```\n$PAGE->requires->js('/validation.js');\n```\n\
    \nLastly, we must add our callback function to validation.js:\n\n```javascript\n\
    function callback(input)\n{\n    if(input == 'valid')\n    {\n        return true;\n\
    \    }\n    else\n{\n        return false;\n    }\n}\n```\n\nWe simply test if\
    \ the input is equal to the string valid or not, and return a value true or false\
    \ respectively, but the function may contain any JavaScript necessary. We test\
    \ the rule by entering the text invalid and see that the validation fails and\
    \ our warning message is displayed as seen in the following screenshot:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_67_0.png)\n\
    \n# How it works...\n\nWe used the validation type callback which takes a format\
    \ option in the form of the name of a JavaScript function. The callback function\
    \ is called by the forms API, with value in question passed as the only parameter.\
    \ The custom login logic is applied to the value and the function must return\
    \ either true or false as desired.\n"
  mdcn: "\n\n# 添加仅接受数字字符的字段\n\n在本食谱中，我们将添加一条仅接受数字字符的规则，即数字 0-9。这在某些情况下非常有用，例如用户需要输入引用编号或货币值时。\n\
    \n# 准备工作\n\n请参考本章的第一个食谱，了解如何准备 QuickForm Web 表单的详情，这是本食谱的基础。\n\n# 如何实现...\n\n\
    将以下代码添加到我们 `validation_form.php` 的定义中，紧接在定义之后：\n\n```\n$mform->addElement('text',\
    \ 'mytext9', 'Numeric');\n$mform->addRule('mytext9', 'Numeric', null, 'client');\n\
    ```\n\n当我们通过输入非数字字符来测试此新规则时（在本例中，我们输入了字符串 `abc`），会显示验证警告消息，并且我们无法提交表单，如图所示：\n\n\
    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_62_0.png)\n\n# 工作原理...\n\n我们使用了 `numeric`\
    \ 验证类型，它不需要任何格式选项。现在，当用户输入数字（0-9）以外的任何内容时，他们将看到验证警告消息，并在移除无效的非数字字符之前无法继续。\n\n\
    # 拒绝标点字符\n\n在本食谱中，我们将添加一条防止输入标点字符的规则。这在某些情况下非常有用，例如您要求新文档标题不能包含句号或逗号。\n\n# 准备工作\n\
    \n请参考本章的第一个食谱，了解如何准备 QuickForm 表单的详情，这是本食谱的基础。\n\n# 如何实现...\n\n将以下代码添加到 `validation_form.php`\
    \ 中的表单定义中，紧接在字段定义之后：\n\n```\n$mform->addElement('text', 'mtext10', 'No punctuation');\n\
    $mform->addRule('mtext10', 'No punctuation', 'nopunctuation', null, 'client');\n\
    ```\n\n当我们通过输入包含标点字符的文本（逗号或句号）来测试此规则时，我们看到显示了警告消息，并且无法提交表单，如图所示：\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_63_0.png)\n\
    \n# 工作原理...\n\n我们使用了 `nopunctuation` 验证，它不需要任何格式选项。当用户输入包含任何标点字符的文本时，将显示验证警告消息，并在移除无效字符之前无法提交表单。\n\
    \n# 拒绝带领先零的输入\n\n在本食谱中，我们将添加一条规则，要求输入有效数字且不能有领先数字 0。这对于验证不带零填充的整数非常有用。\n\n## 准备工作\n\
    \n请参考本章的第一个食谱，了解如何准备 QuickForm 表单的详情，这是本食谱的基础。\n\n## 如何实现...\n\n将以下代码添加到 `validation_form.php`\
    \ 中的表单定义中，紧接在字段定义之后：\n\n```\n$mform->addElement('text', 'mtext1', 'No leading\
    \ zero');\n$mform->addRule('mtext1', 'No leading zero', 'nonzero', null, 'client');\n\
    ```\n\n现在我们可以通过添加一个带有领先零的无效数字序列（0123）来测试该规则。我们看到显示了验证警告消息，并且无法提交表单，如图所示。\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_64_0.png)\n\
    \n## 工作原理...\n\n我们使用了 `nonzero` 验证类型，它不需要任何格式选项。当用户尝试输入包含领先零的文本时，将显示验证警告消息，并在移除无效字符之前无法进行表单提交。\n\
    \n# 与另一个字段比较\n\n在本食谱中，我们将添加一条规则，允许确保两个字段的内容相同。此类验证的经典示例是我们从用户处获取的信息准确性至关重要（例如密码或电子邮件地址）。我们确保他们输入两次，比较两个条目，如果不一致则显示警告。\n\
    \n# 准备工作\n\n请参考本章的第一个食谱，了解如何准备 QuickForm 表单的详情，这是本食谱的基础。\n\n# 如何实现...\n\n将以下代码添加到\
    \ `validation_form.php` 中的表单定义中，紧接在字段定义之后：\n\n```\n$mform->addElement('text',\
    \ 'mtext11', 'Must match');\n$mform->addRule('mtext11', 'Must match', 'compare',\
    \ null, 'server');\n```\n\n现在我们可以通过在每个文本框中输入不同的值来测试此规则。我们看到显示了验证警告消息，并且无法提交表单，如图所示：\n\
    \n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_65_0.png)\n\n# 工作原理...\n\n我们使用了 `compare`\
    \ 验证类型，它的参数略不同。第一个参数必须是元素名称的数组。格式选项是一个字符串，用于指定比较类型。\n\n| 格式选项 |  |\n| :--- | :---\
    \ |\n| eq | 第一个元素的值等于第二个 |\n| != | 第一个元素的值不等于第二个 |\n| gt | 第一个元素的值大于第二个 |\n| ge\
    \ | 第一个元素的值大于等于第二个 |\n| lt | 第一个元素的值小于第二个 |\n| lte | 第一个元素的值小于等于第二个 |\n\n# 添加自定义\
    \ JavaScript 函数回调\n\n在本食谱中，我们将查看如何使用 JavaScript 手动验证输入框的内容。通过允许我们使用 JavaScript\
    \ 内的任何工具来验证输入，这提供了完全的灵活性。例如，我们可以根据今天的日期进行验证，甚至通过 Web 服务查询值。\n\n# 准备工作\n\n请参考本章的第一个食谱，了解如何准备\
    \ QuickForm Web 的详情，这是本食谱的基础。\n\n# 如何实现...\n\n将以下代码添加到 `validation_form.php` 的定义中，紧接在定义之后：\n\
    \n```\n$mform->addElement('text', 'mtext13', 'Custom');\n$mform->addRule('mtext13',\
    \ 'Custom', 'callback', 'mycallback', 'client');\n```\n\n我们指定了一个自定义验证函数回调。在示例中，我们必须编辑\
    \ `validation.php` 以引入包含我们回调函数的 JavaScript 文件：\n\n```\n$PAGE->requires->js('/validation.js');\n\
    ```\n\n最后，我们必须在 `validation.js` 中添加回调函数：\n\n```javascript\nfunction callback(input)\n\
    {\n    if(input == 'valid')\n    {\n        return true;\n    }\n    else\n  \
    \  {\n        return false;\n    }\n}\n```\n\n我们只需测试输入是否等于字符串 `valid`，并分别返回真值\
    \ true 或 false，但该函数可以包含任何必要的 JavaScript。我们通过输入文本 `invalid` 来测试规则，看到验证失败并显示了警告消息，如图所示：\n\
    \n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_67_0.png)\n\n# 工作原理...\n\n我们使用了 `callback`\
    \ 验证类型，它接受一个 JavaScript 函数名称作为格式选项。回调函数由表单 API 调用，并将待验证的值作为唯一参数传递。自定义逻辑被应用于该值，且该函数必须根据需要返回\
    \ true 或 false。\n\n"
