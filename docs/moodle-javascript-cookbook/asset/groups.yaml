  - '[PAGE 25]


    # Loading a JavaScript file in <head>


    In the previous recipe we learned the standard method of including a JavaScript
    file at the end of the document''s `<body>` tag.


    In this recipe, we will look at how to ensure our JavaScript file is included
    within the `<head>` tag. There are numerous reasons why you would require your
    file to be included within the `<head>`, for example if you need to use `document.write`
    to manually write `<head>` content.


    > If you are in any doubt, use the technique in the previous recipe. If you need
    to use the technique in this recipe, the chances are you will know exactly why.


    # Getting ready


    Once again, open the Moodle PHP file where we will add our .js file. We will use
    the simple example from the previous recipe as a basis, with the following changes:


    ```

    ```php

    require_once(dirname(__FILE__) . ''../config.php'');

    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    $PAGE->set_requires_js(''/cook/alert.js'', true);

    $PAGE->set_url(''/cook/requirejs_head.php'');

    echo $OUTPUT->header();

    echo $OUTPUT->footer();

    ?>

    ```

    ```


    Now when we load the page, we see that our JavaScript Alert is executed immediately,
    assuring us that our code is loading and executing correctly, as seen in the following
    screenshot:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_25_0.png)


    Note that the page underneath is blank at this stage, as our JavaScript code is
    being run from the `<head>` tag, before the rest of the page has loaded.'
- md: "\n## Combining Moodle and JavaScript\n\n### How to do it...\n\nYou will notice\
    \ that this code is almost identical to that of the previous recipe. The key difference\
    \ here is the parameters we have passed to the $PAGE->requires->js method. We\
    \ have passed a second optional parameter which determines whether or not the\
    \ <script> tag will be rendered within the document's <head> tag. In this case,\
    \ we set it to true to ensure the <script> tag is rendered as such.\n\n### How\
    \ it works...\n\nWe have called $PAGE->requires->js again, this time with two\
    \ parameters. The first is the path to the .js file we wish to include. The second\
    \ is a Boolean value which specifies whether or not to include the file within\
    \ the <head> tag of the HTML page.\n\nThe <script> tag that is rendered to the\
    \ document is identical to that of the previous recipe, with the crucial difference\
    \ that it is rendered within the <head> tag, rather than at the end of the <body>>\
    \ tag.\n\n## Generating a JavaScript function call from PHP\n\nWe have loaded\
    \ our JavaScript file, we need a method to execute it. Once again, we may use\
    \ the Page Requirements Manager $PAGE to generate a call to our JavaScript function.\n\
    \n> This recipe describes a basic technique for executing your JavaScript code\
    \ when the page is loaded. More sophisticated techniques based on handling DOM\
    \ events with the Yahoo! User Interface library will be covered in later chapters.\n\
    \n### Getting ready\n\nSet up a page requirejs_init.php with the following content:\n\
    \n```php\n<?php\nrequire_once(dirname(__FILE__), '/config.php');\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/course/requirejs_init.php');\n$PAGE->requires->js('/course/requirejs_init.js');\n\
    $PAGE->requires->js_call('hello');\necho $OUTPUT->header();\necho $OUTPUT->footer();\n\
    ?>\n```\n\nSet up the accompanying JavaScript file, requirejs_init.js, with the\
    \ following content:\n\n```javascript\nfunction hello(Y)\n{\n  alert('Hello World!');\n\
    }\n```\n\nNow when we load the page, we see that our JavaScript alert is executed,\
    \ assuring us that our code is loading and executing correctly, as seen in the\
    \ following screenshot:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_27_0.png)\n\
    \n### How to do it...\n\nWhen we wish to make a call to our JavaScript function\
    \ named hello. This is achieved with the js_init_call method. We pass one parameter,\
    \ which is a string containing the name of the function we wish to call, which\
    \ is hello.\n\n### How it works...\n\nWhen the document is rendered, the js_init_call\
    \ method ensures that a call to our JavaScript function is generated. This example\
    \ will generate the following JavaScript:\n\n```javascript\nhello(Y);\n```\n\n\
    This JavaScript is then included inside a <script> tag at the end of the <body>>\
    \ tag of the final page.\n\n## Passing variables from PHP to JavaScript\n\nIn\
    \ the previous recipe, we learned how to run our JavaScript function, but we did\
    \ not pass any data to it. In this recipe, we will pass two parameters to the\
    \ JavaScript function—a message to be displayed and the current user's username,\
    \ demonstrating how to make variable values from PHP available within our JavaScript\
    \ code.\n\n## Combining Moodle and JavaScript\n\n### Getting ready\n\nCreate a\
    \ new PHP file requirejs_init_data.php with the following content:\n\n```php\n\
    <?php\nrequire_once(dirname(__FILE__)) . './../config.php';\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/cook/requirejs_init_data.php');\n$PAGE->requirejs('js/cook/requirejs_init_data.js');\n\
    \n$PAGE->requires('js_init_call('hello', array('Hello', $USER->username));');\n\
    \necho $OUTPUT->header();\necho $OUTPUT->footer();\n?>\n```\n\nThis code sets\
    \ up a simple Moodle page and includes a JavaScript file requirejs_init_data.js\
    \ containing the basic \"Hello World\" function that we will call, which accepts\
    \ three parameters.\n\nNote that the first parameter Y, which is an instance of\
    \ the YUI object, is automatically passed to our function by the Page Requirements\
    \ Manager.\n\nThe two subsequent parameters are strings to be passed to the function:\
    \ message and username:\n\n```javascript\nfunction hello(Y, message, username)\n\
    {\n    alert(message + ' ', ' + username);\n}\n```\n\nNow when we load the page,\
    \ we see that our JavaScript alert is executed, displaying the message passed\
    \ along with the current user's (admin):\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_28_0.png)\n\
    \n### How to do it...\n\nJust after the call to $PAGE->requires->js, add the following\
    \ code:\n\n```php\n$PAGE->requires->js_init_call('hello', array('Hello', $USER->username));\n\
    ```\n\nThe first parameter is a string containing the name of the JavaScript function\
    \ we wish to call, which is hello in this case.\n\nThe second parameter is a PHP\
    \ array of values that are passed on to the JavaScript function in the order which\
    \ they are defined.\n\nThe use of an array allows the js_init_call method to support\
    \ an arbitrary number of arguments, in this case: the message and username.\n\n\
    ### How it works...\n\nWe have used the Page Requirement Manager to register the\
    \ name of the function we wish to call and pass two additional parameters by the\
    \ function inside a PHP array.\n\nWhen the document is rendered, the following\
    \ JavaScript will be generated inside a <script> tag just before the end of the\
    \ <body>> tag:\n\n```javascript\nhello(Y, \"Hello\", \"admin\");\n```\n\n## Ensuring\
    \ compliance with XHTML Strict\n\nMoodle uses the DocType XHTML Strict. We should\
    \ take care to ensure our JavaScript maintains compliance with this standard.\n\
    \nAlthough it is avoided, it may occasionally be necessary to include JavaScript\
    \ code within <script> tags that are embedded within the page. If this is the\
    \ case, it is highly likely that the code will include characters that have special\
    \ meaning to the XHTML Strict specification, for example & and <', to name a few.\n\
    \n### Getting ready\n\nOpen the PHP file that contains the embedded JavaScript\
    \ and locate the start and end <script> tags.\n\n### How to do it...\n\nAdd the\
    \ following code immediately after the opening <script> tag:\n\n```html\n<script\
    \ language=\"JavaScript\" type=\"text/javascript\">\n//<!CDATA[\n```\n\nAdd the\
    \ following code immediately before the closing <script> tag:\n\n```javascript\n\
    //]]>\n</script>\n```\n\n### How it works...\n\nThe CDATA tag we have used ensures\
    \ the browser does not attempt to parse the JavaScript as XHTML markup.\n\nAdditionally,\
    \ to avoid a conflict with JavaScript syntax, we use the CDATA section.\n\n##\
    \ Retrieving layout strings from Moodle\n\nMoodle makes use of language strings\
    \ to support internationalization. In practice, strings are held in language files.\
    \ For example, the string \"Submit assignment\" may be held in the relevant language\
    \ file. This happens automatically when a user changes their preferred language.\
    \ The code will pick up the new preferred language.\n\n### Getting ready\n\nIn\
    \ this example, we will retrieve the built-in Moodle language string and show\
    \ that it is available from our JavaScript code.\n\nWe start once again with a\
    \ basic Moodle page and associated .js file:\n\n```php\n<?php\nrequire_once(dirname(__FILE__))\
    \ . '../config.php';\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/cook/requirejs_init_lang.php');\n$PAGE->requires->js('/cook/requirejs_init_lang.js');\n\
    $PAGE->requires->string_for_js('course', 'moodle');\n$PAGE->requires->js_init_call('lang');\n\
    echo $OUTPUT->header();\necho $OUTPUT->footer();\n?>\n```\n\nAs you can see, this\
    \ code registers a call to a function lang which has been defined in the associated\
    \ .js file:\n\n```javascript\nfunction lang (Y)\n{\n    alert(M.str.moodle.course);\n\
    }\n```\n\nNow when we load the page, we see that our JavaScript alert is executed,\
    \ displaying the language string value we set up, as seen in the following screenshot:\n\
    \n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_31_0.png)\n\n### How to do it...\n\n\
    We have included our .js with the method now familiar-$PAGE->requires->js.\n\n\
    After this line we use a new feature of the Page Requirements Manager, the string_for_js\
    \ function:\n\n```php\n$PAGE->requires->string_for_js('course', 'moodle');\n```\n\
    \nFinally, we refer to this language string from our JavaScript code:\n\n```javascript\n\
    alert(M.str.moodle.course);\n```\n\n### How it works...\n\nWe call the string_for_js\
    \ method with two parameters: the name of the string we wish to retrieve and the\
    \ location of this string. In this example, we are retrieving the language string\
    \ for course from the core Moodle language file.\n"
  mdcn: "\n\n## 结合 Moodle 和 JavaScript\n\n### 如何实现...\n\n你会发现这段代码与上一个配方的代码几乎相同。这里的关键在于我们传递给\
    \ `$PAGE->requires->js` 方法的参数。我们传递了第二个可选参数，它决定了是否在文档的 `<head>` 标签内渲染 `<script>`\
    \ 标签。在例例中，我们将将其设置为 `true`，以确保 `<script>` 标签按此方式进行渲染。\n\n###其工作原理...\n\n我们再次调用了\
    \ `$PAGE->requires->js`，这次带有两个参数。第一个参数是我们想要包含的 `.js` 文件的路径。第二个参数是一个布尔值，用于指定是否在\
    \ HTML 页面的 `<head>` 标签中包含该文件。\n\n渲染到文档中的 `<script>` 标签与上一个配方中的相同，关键区别在于它被渲染在 `<head>`\
    \ 标签内，而不是在 `</body>` 标签的末尾。\n\n## 从 PHP 生成 JavaScript 函数调用\n\n我们已经加载了 JavaScript\
    \ 文件，我们需要一种方法来执行它。同样，我们可以使用页面需求管理器 `$PAGE` 来生成对我们 JavaScript 函数的调用。\n\n> 本配方描述了在页面加载时执行你的\
    \ JavaScript 代码的基本技术。基于使用 Yahoo! User Interface 库处理 DOM 事件的更复杂的将在将在章节中介绍。\n\n\
    ### 准备工作\n\n创建一个名为 `requirejs_init.php` 的 PHP 文件，内容如下：\n\n```php\n<?php\nrequire_once(dirname(__FILE__),\
    \ '/config.php');\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/course/requirejs_init.php');\n$PAGE->requires->js('/course/requirejs_init.js');\n\
    $PAGE->requires->js_call('hello');\necho $OUTPUT->header();\necho $OUTPUT->footer();\n\
    ?>\n```\n\n设置相应的 JavaScript 文件 `requirejs_init.js`，内容如下：\n\n```javascript\nfunction\
    \ hello(Y)\n{\n  alert('Hello World!');\n}\n```\n\n现在当我们加载页面时，我们看到 JavaScript\
    \ 警告已执行，这向我们证明了代码正在正确加载和执行，如下截图所示：\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_27_0.png)\n\
    \n### 如何实现...\n\n当我们想要调用名为 `hello` 的 JavaScript 函数时。这是通过 `js_init_call` 方法实现的。我们传递了一个参数，它是一个包含我们想要调用的函数名称字符串，即\
    \ `hello`。\n\n###其工作原理...\n\n当文档被渲染时，`js_init_call` 方法确保生成对我们 JavaScript 函数的调用。此示例将生成以下\
    \ JavaScript：\n\n```javascript\nhello(Y);\n```\n\n该 JavaScript 随后包含在最终页面 `</body>`\
    \ 标签最后的 `<script>` 标签内。\n\n## 从 PHP 将变量传递到 JavaScript\n\n在上一个配方中，我们学习了如何运行 JavaScript\
    \ 函数，但没有向它传递任何数据。在这个配方中，我们将向 JavaScript 函数传递两个参数——要显示的消息和当前用户的用户名，演示如何让 PHP 中的变量值在我们的\
    \ JavaScript 代码可用。\n\n## 结合 Moodle 和 JavaScript\n\n### 准备工作\n\n创建一个名为 `requirejs_init_data.php`\
    \ 的新 PHP 文件，内容如下：\n\n```php\n<?php\nrequire_once(dirname(__FILE__)) . './../config.php';\n\
    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n$PAGE->set_url('/cook/requirejs_init_data.php');\n\
    $PAGE->requirejs('js/cook/requirejs_init_data.js');\n\n$PAGE->requires('js_init_call('hello',\
    \ array('Hello', $USER->username));');\n\necho $OUTPUT->header();\necho $OUTPUT->footer();\n\
    ?>\n```\n\n这段代码设置了一个简单的 Moodle 页面并包含了 JavaScript 文件 `requirejs_init_data.js`，其中包含我们将调用的基础“Hello\
    \ World”函数，该函数接受三个参数。\n\n注意，第一个参数 `Y` 是 YUI 对象的实例，由页面需求管理器自动传递给我们的函数。\n\n后续两个参数是传递给函数的字符串：`message`\
    \ 和 `username`：\n\n```javascript\nfunction hello(Y, message, username)\n{\n  \
    \  alert(message + ' ', ' + username);\n}\n```\n\n现在当我们加载页面时，我们看到 JavaScript 警告已执行，显示了随之传递的消息以及当前用户（admin）：\n\
    \n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_28_0.png)\n\n### 如何实现...\n\n在调用 `$PAGE->requires->js`\
    \ 之后，添加以下代码：\n\n```php\n$PAGE->requires->js_init_call('hello', array('Hello',\
    \ $USER->username));\n```\n\n第一个参数是包含我们想要调用的 JavaScript 函数名称的字符串，在这种情况下是 `hello`。\n\
    \n第二个参数是一个 PHP 值数组，这些值按照定义的顺序传递给 JavaScript 函数。\n\n使用数组允许 `js_init_call` 方法支持任意数量的参数，在本例中：`message`\
    \ 和 `username`。\n\n###其工作原理...\n\n我们使用了页面需求管理器来注册我们想要调用的函数名称，并通过 PHP 数组中的函数传递了两个额外参数。\n\
    \n当文档被渲染时，以下 JavaScript 将将在 `</body>` 标签结束之前的 `<script>` 标签内生成：\n\n```javascript\n\
    hello(Y, \"Hello\", \"admin\");\n```\n\n## 确保符合 XHTML 严格标准\n\nMoodle 使用 `DocType\
    \ XHTML Strict`。我们应该注意确保我们的 JavaScript 符合此标准。\n\n尽管可以避免，但偶尔可能需要在嵌入页面中的 `<script>`\
    \ 标签内包含 JavaScript 代码。如果是这样，代码极有可能会包含对 XHTML Strict 规范具有特殊意义的字符，例如 `&` 和 `<` 等。\n\
    \n### 准备工作\n\n打开包含嵌入 JavaScript 的 PHP 文件，并找到开始和结束的 `<script>` 标签。\n\n### 如何实现...\n\
    \n在起始 `<script>` 标签之后立即添加以下代码：\n\n```html\n<script language=\"JavaScript\" type=\"\
    text/javascript\">\n//<!CDATA[\n```\n\n在结束的 `<script>` 标签之前立即添加以下代码：\n\n```javascript\n\
    //]]>\n</script>\n```\n\n###其工作原理...\n\n我们使用的 `CDATA` 标签确保浏览器不会尝试将 JavaScript\
    \ 解析为 XHTML 标记。\n\n此外，为了避免与 JavaScript 语法冲突，我们使用了 `CDATA` 。\n\n## 从 Moodle 获取布局字符串\n\
    \nMoodle 使用语言字符串来支持国际化。在实践中，字符串存储在语言文件中。例如，字符串“Submit assignment”可能存储在相应的语言文件中。当用户更改其偏好语言时会自动。\n\
    \n### 准备工作\n\n在本示例中，我们将获取内置的 Moodle 语言字符串并证明它在我们的 JavaScript 代码中可用。\n\n我们再次从一个基础\
    \ Moodle 页面和关联的 .js 文件开始：\n\n```php\n<?php\nrequire_once(dirname(__FILE__)) .\
    \ '../config.php';\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/cook/requirejs_init.php');\n$PAGE->requires->js('/cook/requirejs_init.js');\n\
    $PAGE->requires->string_for_js('course', 'moodle');\n$PAGE->requires->js_init_call('lang');\n\
    echo $OUTPUT->header();\necho $OUTPUT->footer();\n?>\n```\n\n如所示，这段代码注册了对函数 `lang`\
    \ 的调用，该函数定义在关联的 .js 文件中：\n\n```javascript\nfunction lang (Y)\n{\n    alert(M.str.moodle.course);\n\
    }\n```\n\n现在当我们加载页面时，我们看到 JavaScript 警告已执行，显示了我们设置的语言字符串值，如下截图所示：\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_31_0.png)\n\
    \n### 如何实现...\n\n我们使用熟悉的方法 `$PAGE->requires->js` 包含了我们的 .js 文件。\n\n在这一行之后，我们使用了页面需求管理器的一个新功能，`string_for_js`\
    \ 函数：\n\n```php\n$PAGE->requires->string_for_js('course', 'moodle');\n```\n\n\
    最后，我们在我们的 JavaScript 代码中引用此语言字符串：\n\n```javascript\nalert(M.str.moodle.course);\n\
    ```\n\n###其工作原理...\n\n我们调用 `string_for_js` 方法并带有两个参数：我们想要获取的字符串名称以及该字符串的位置。在本例中，我们从核心\
    \ Moodle 语言文件中获取 `course` 的语言字符串。\n\n"
