    \ reason may be, in this book, we wish to use features of the YUI 2 that have\
    \ not been re-implemented as native YUI 3 modules.\n\nIn this recipe, we will\
    \ learn how to load YUI 2 modules from YUI 3 by loading the Calendar widget from\
    \ YUI 2, inside a native YUI 3 script.\n\n# Getting ready\n\nWe begin creating\
    \ a new PHP file yui_cal.php in the cook directory with the following content:\n\
    \n```php\n<?php\nrequire_once(dirname(__FILE__) . './../config.php');\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
