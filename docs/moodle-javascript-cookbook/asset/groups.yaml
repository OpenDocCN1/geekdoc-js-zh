    , \"Bravo\", \"Beta\", \"Gamma\", \"Golf\"]\n  );\n  var autoCompleteText = new\
    \ YAHOO.widget.AutoComplete(\"txtInput\",\n  \"txtInput_container\", dataSource);\n\
    });\n```\n\n## How it works...\n\nOur HTML consists of three elements, a parent\
    \ div element, and the other two elements contained within it: an input text box,\
    \ and a placeholder div element to use to display the auto-complete suggestions.\n\
    \nOur JavaScript file defines a DataSource to be used to provide suggestions,\
    \ and then creates a new AutoComplete widget based on the HTML elements we have\
    \ already defined.\n\nIn this example, we use a `LocalDataSource` for simplicity,\
    \ but this may be substituted for any valid DataSource object, such as we we have\
    \ covered in previous chapters.\n\nOnce we have a DataSource object available,\
    \ we instantiate a new YUI2 AutoComplete widget, passing the following arguments:\n\
    \n- The name of the HTML input text element to provide auto-complete suggestions\n\
    - The name of the container element to use to display suggestions\n- A valid data\
    \ source object to use to find suggestions\n\n## Enhancing Page Elements\n\nNow\
    \ when the user starts typing into the text box, any matching auto-complete suggestions\
    \ are displayed and can be selected, as shown in the following screenshot:\n\n\
    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_108_0.png)\n\n## Adding a combo box with\
    \ auto-complete\n\nIn this example, we will use auto-complete in conjunction with\
    \ a combo box (drop-down list). This differs from the previous example in one\
    \ significant way—it includes a drop-down arrow button that allows the user to\
    \ see the complete list of values without typing first.\n\nThis is useful in situations\
    \ where the user may be unsure of a suitable value. In this case, they can click\
    \ the drop-down button to see suggestions without having to guess as they type.\
    \ Additionally, this method also supports the same match-as-you-type auto-complete\
    \ as that of the previous recipe.\n\n## How to do it...\n\nOpen the autocomplete.php\
    \ file from the previous recipe, and editing the following HTML code below the\
    \ text box auto-complete:\n\n```html\n<div style=\"width:15em;height:10em;\">\n\
    <input id=\"txtCombo\" type=\"text\" style=\"vertical-align:top;width:11em;\"\
    ><span id=\"toggle\"><<span>/</span></span></span>\n<div id=\"txtCombo_container\"\
    ></div>\n</div>\n```\n\nNext, open the JavaScript file autocomplete.js, and modify\
    \ it to match the following code:\n\n```javascript\nYUI().use(\"ui12-auto-complete\"\
    , \"ui12-datasource\", \"ui12-element\", \"ui12-yahoo-dom-event\", function (Y)\
    \ {\n\n  var YAHOO = Y.YUI;\n\n  var dataSource = new YAHOO.util.LocalDataSource(\n\
    \    [\"Alpha\", \"Bravo\", \"Beta\", \"Gamma\", \"Golf\"]\n  );\n\n  var autoCompleteText\
    \ = new YAHOO.widget.AutoComplete(\"txtInput\",\n  \"txtInput_container\", dataSource);\n\
    \n  var autoCompleteCombo = new YAHOO.widget.AutoComplete(\"txtCombo\",\n  \"\
    txtCombo_container\", dataSource, {minQueryLength: 0,\n  queryDelay: 0});\n\n\
    \  var toggler = YAHOO.util.Dom.get(\"toggle\");\n  var tButton = new YAHOO.widget.Button({container:toggler,\n\
    \  label:\"&arr;\"});\n  var toggle = function() {\n    if (autoCompleteCombo.isContainerOpen())\
    \ {\n      autoCompleteCombo.collapseContainer();\n    } else {\n      autoCompleteCombo.getInputEl().focus();\n\
    \      setTimeout(function() {\n        autoCompleteCombo.sendQuery(\"*\");\n\
    \      },0);\n    }\n  };\n  tButton.on(\"click\", toggle);\n});\n```\n\nYou will\
    \ notice that the HTML we added in this recipe is very similar to the last, with\
    \ the exception that we included a span element just after the text box. This\
    \ is used as a placeholder to insert a YUI2 control button.\n\nThis recipe is\
    \ much more complicated than the previous one, so we included some extra YUI modules:\
    \ element, button, and yahoo-dom-event.\n\nWe define the AutoComplete widget in\
    \ the same way as before, except we need to add two configuration options in an\
    \ object passed as the fourth argument.\n\nNext, we retrieve a reference to the\
    \ button placeholder, and instantiate a new Button widget to use the combo box\
    \ 'drop-down' button.\n\nFinally, we define a click handler for the button, and\
    \ register it.\n\nWe now see the list of suggestions, which can be displayed by\
    \ clicking the drop-down button, as shown in the following screenshot:\n\n| |\n\
    |:---|\n| Alpha |\n| Bravo |\n| Beta |\n| Gamma |\n| Golf |\n\n## How it works...\n\
    \nThe user can type into the box to receive auto-complete suggestions as before,\
    \ but may now use the combo style drop-down button instead to see a list of suggestions.\n\
    \nWhen the user clicks the drop-down, the click event is fired.\n\nThis click\
    \ event does the following:\n\n- Hides the drop-down menu if it is displayed,\
    \ which allows the user to toggle this list display/off.\n- If it is not displayed,\
    \ it sets the focus to the box (allow the user to continue typing), and execute\
    \ a blank query on the auto-complete widget, which will display the list of suggestions.\
    \ Note that we explicitly enabled this blank query earlier when we defined the\
    \ AutoComplete widget with the \"minQueryLength: 0\" option, which allowed queries\
    \ of length 0 and after.\n\n## Displaying auto-updating data\n\nAnother useful\
    \ interface is the ability to display data that is constantly updated at a set\
    \ interval. For example, this could be used to update a list of news headlines\
    \ every five minutes, or update the display of live stock data every minute.\n\
    \nIn this recipe, we will take the basic example of a clock, displaying the full\
    \ date and time on the page, and update it every second using the polling extension\
    \ to the DataSource utility. This technique can be used to display any data from\
    \ any data source, and update it as frequently as we.\n\n## How to do it...\n\n\
    In this example, we will set up a very simple PHP page, updatedate.php, containing\
    \ only one placeholder we will display:\n\n```php\n<?php\nrequire_once(dirname(__FILE__)\
    \ . '../config.php');\n$PAGE->set_context(CONTEXT_SYSTEM);\n$PAGE->set_url('/cook/updatedate.php');\n\
    $PAGE->requires_js('/cook/updatedate.js', true);\necho $OUTPUT->header();\n?>\n\
    <div id=\"txtUpdate\"></div>\n<?php\necho $OUTPUT->footer();\n?>\n```\n\nNext,\
    \ we define the JavaScript updatedate.js:\n\n```javascript\nYUI().use(\"datasource-function\"\
    , \"datasource-polling\", function(Y) {\n  var getDateString = function() {\n\
    \    return new Date();\n  };\n\n  var dataSource = new Y.DataSource.Function({source:getDateString});\n\
    \n  var request = {\n    callback: {\n      success: function(e) {\n        document.getElementById('txtUpdate').innerHTML\
    \ = e.results[0];\n      }\n    }\n  };\n\n  var id = dataSource.setInterval(1000,request);\n\
    });\n```\n\n"
