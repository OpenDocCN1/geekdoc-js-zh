- md: "\nNow this string is made available to us as part of Moodle's global JavaScript\
    \ namespace (M) in the format, M.str.<module name>.<string name>. In our example,\
    \ this is M.str.moodle.course.\n\nUsing this method, the strings we have set up\
    \ will be available to all subsequent JavaScript code. If we had simply passed\
    \ this string as a parameter to the JavaScript function, it would only be available\
    \ inside that function. If we required it to be available within additional functions,\
    \ we would have to repeat the process, making copies of the string and passing\
    \ those to the additional functions resulting in unnecessarily inefficient code.\n\
    \n## 2 Moodle and Yahoo! User Interface Library (YUI)\n\nIn this chapter, we will\
    \ cover:\n\n- Initializing the YUI 3 library\n- Loading YUI 3 modules\n- Loading\
    \ YUI 2 modules from YUI 3\n- Attaching basic event handlers\n- Attaching advanced\
    \ DOM event handlers\n- Implementing Event Delegation\n- Debugging with the YUI\
    \ console\n\n# Introduction\n\nThere are a lot of common tasks that need to be\
    \ performed when writing JavaScript. A large proportion of this simply involves\
    \ dealing with differences between web browsers. The need for a way to hide or\
    \ abstract the specifics of each browser into a standard interface gave rise to\
    \ sets of tools known as JavaScript libraries. One of the leading libraries in\
    \ use on the web today is the Yahoo! User Interface Library (YUI).\n\n# Moodle\
    \ and Yahoo! User Interface Library (YUI)\n\nMoodle includes a copy of the YUI\
    \ as its preferred JavaScript library. YUI provides developers with access to\
    \ a wide range of tools for enhancing their web applications:\n\nThe YUI Library\
    \ is a set of utilities and controls, written with JavaScript and CSS, for building\
    \ highly interactive web applications using techniques such as DOM scripting,\
    \ HTML and AJAX. YUI is available under a BSD license and is free for all users.\
    \ YUI is proven, scalable, fast, and robust. Built by frontend engineers and contributors\
    \ from around the world, it's an industrial-strength JavaScript library for professionals\
    \ who love JavaScript.\n\nYahoo! Developer Network\nhttp://developer.yahoo.com/yui/\n\
    \nIn this chapter, we will learn the basics of working with YUI. We will learn\
    \ how to initialize the YUI and make it ready for using our code and load additional\
    \ modules from versions 2 and 3 of YUI. We will also learn how to manage the execution\
    \ of code by attaching events to our controls, and finally how to debug code with\
    \ YUI logging tools.\n\n# Initializing the YUI 3 library\n\nIn this recipe, we\
    \ will learn how to initialize the YUI 3 environment within Moodle, which will\
    \ get us to start using YUI features. Moodle takes care of most of the initial\
    \ setup, namely loading the required CSS and JavaScript files, so all we need\
    \ to be concerned with is activating the YUI environment.\n\nThis example will\
    \ show how to execute JavaScript code from within the YUI environment. We will\
    \ set up a small YUI script which will simply display a message including the\
    \ version number of the active YUI environment in a JavaScript alert box.\n\n\
    This provides a sample view of what is required to get YUI up and running that\
    \ we will build on in the subsequent recipes.\n\n# Getting ready\n\nWe begin by\
    \ creating a new PHP file yui_init.php in the cook directory with the following\
    \ content:\n\n```php\n<?php\nrequire_once(dirname(__FILE__) . '/../config.php');\n\
    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n$PAGE->set_url('/cook/yui_init.php');\n\
