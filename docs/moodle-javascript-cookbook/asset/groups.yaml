    # Moodle Forms Validation -


    When we reload the validation.php page in a web browser and try to submit the
    form without entering anything into the text box, we will not be able to submit
    the form and will be presented with a warning explaining what we need to do proceed
    as seen in the following screenshot:


    | Moodle JavaScript Cookbook |

    |---||

    | My text * | Required |

    | [Submit] |

    | There are required fields in this form marked*. |

    | Moodle Docs for this page |

    | You are logged in as Admin User (Logout) |

    | Home |


    # How it works


    We used the addRule method of QuickForm to define the validation requirements:


    ```

    $mform->addRule(''mytext1'', ''Required'', ''required'', null, ''client'');

    ```


    This is controlled by the five arguments we passed to the addRule method:


    | Argument number | Description | Value |

    |---|---|---|n| 1 | The name of the element to apply the rule to | mytext1 |

    | 2 | The text to be displayed when validation fails | Required |

    | 3 | The name of the rule to be applied | required |

    | 4 | The format options of the rule (note that the required rule has no options,
    so here we pass a null value) | null |

    | 5 | Describes how to perform validation. This can be either client or server.
    Using client forces the validation to occur within the browser using JavaScript
    | client


    > This rule can be combined with any of the rules demonstrated in subsequent recipes.
    This ensures that the field is not only filled out, but in accordance with any
    additional constraints. Similarly, two or more of the rules may be combined wherever
    suitable.


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_54_0.png)


