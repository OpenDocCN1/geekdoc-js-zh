    \ a PHP page in which to initialize the framework. We create this file and set\
    \ up the Moodle programming environment, adding two JavaScript includes. The first\
    \ file to include is the jQuery file, and the second is our custom JavaScript\
    \ file which will contain our code which makes use of the jQuery framework. Note\
    \ that the main jQuery file must be included before any JavaScript uses the framework.\n\
    \nSimply including the jQuery file: `$PAGE->requires->js('/cook/jquery-1.4.4.min.js');`\
    \ in our page ensures that the framework is initialized and ready for use. In\
    \ this example, we included a very simple use of the framework, namely the ready\
    \ event of the page's object to display a JavaScript alert, confirming that the\
    \ framework is working correctly.\n\n## Adding the MooTools framework\n\nIn this\
    \ recipe, we will set up the MooTools framework for use in our example page.\n\
    \n## Integrating External Libraries\n\nThe following is a quick overview of the\
    \ framework from the MooTools website (http://mootools.net/):\n\nMooTools is a\
    \ compact, modular, Object-Oriented JavaScript framework designed for the intermediate\
    \ to advanced JavaScript developer. It allows you to write powerful, flexible,\
    \ and cross-browser code with its elegant, well-documented, and coherent API.\n\
    \nMooTools is essentially another alternative to UI or jQuery. You may want to\
    \ install this framework if you wish to make use of some third party code based\
    \ on MooTools, which is either not or impractical to port to native JavaScript.\
    \ You can also rewrite it using Mood's preferred JavaScript framework, YUI.\n\n\
    We will create a simple MooTools script which will display a MooTools alert when\
    \ the domready event is fired.\n\n## Getting ready\n\nWe begin by downloading\
    \ the latest version of the MooTools framework. Visit the MooTools homepage at\
    \ http://mootools.net/, navigate to the download page, and download a suitable\
    \ version of MooTools. In this example, we use the compressed version of MooTools\
    \ Core 1.3 without compatibility.\n\nSave this file to a location within your\
    \ Moodle installation. In this example, we will save it in a directory named cook\
    \ in the main Moodle sites files directory.\n\n## How to do it...\n\nSetup a PHP\
    \ page, external_mootools.php, that will be used to set up MooTools with the following\
    \ content:\n\n```php\n<?php\nrequire_once(dirname(__FILE__) . '../config.php');\n\
    \n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n$PAGE->set_url('/cook/external_mootools.php');\n\
    $PAGE->requires->js('/cook/mootools-core-1.3.js');\n$PAGE->requires->js('/cook/external_mootools.js');\n\
    \necho $OUTPUT->header();\necho $OUTPUT->footer();\n?>\n```\n\nFinally, we create\
    \ a JavaScript file, external_mootools.js, into which we will add a simple MooTools\
    \ script, as follows:\n\n```javascript\nwindow.addEvent('domready', function()\
    \ {\n  alert('Hello from MooTools');\n});\n```\n\nOnce we have saved a copy of\
    \ MooTools into our Moodle installation, we can set up a PHP file to create the\
    \ page which will run the MooTools code. We include two JavaScript files, the\
    \ first being the MooTools file, and the second being our custom JavaScript file\
    \ external_mootools.js. Note that the MooTools file must be included before the\
    \ file that makes use of it.\n\nWe can now load this page in a web browser, and\
    \ we will see the following JavaScript alert pop-up, proving to us that MooTools\
    \ has loaded correctly, ready for use:\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_163_0.png)\n\
    \n## How it works...\n\nWe loaded the MooTools framework before our own JavaScript\
    \ file, ensuring the framework is ready for use. The JavaScript code we added\
    \ here makes of the window's domready event to display a JavaScript alert after\
    \ the page has fully loaded. When we load the page, we see the alert pop-up, and\
    \ can be assured that MooTools has loaded correctly.\n\n## Adding the Dojo framework\n\
    \nIn this recipe, we will set up the Dojo framework for use within Moodle. We\
    \ will then create a simple Dojo script that displays a JavaScript alert when\
    \ the page has fully loaded, making use of Dojo's `addOnLoad` feature.\n\nA brief\
    \ description of the framework from the Dojo website (http://dojotoolkit.org/):\n\
    \n> Dojo saves you time, delivers performance, and scales with your development\
    \ process. It's the toolkit experienced developers turn to for building desktop\
    \ and mobile web experiences.\n\nA typical need for installing this framework\
    \ would be a situation where you wish to make use of a third party code, which\
    \ is either not or impractical to port to native JavaScript. You can also rewrite\
    \ it using Mood's preferred JavaScript framework, YUI.\n\n## Getting ready\n\n\
    We begin by downloading the latest version of the Dojo framework. Visit the Dojo\
    \ homepage at http://dojotoolkit.org/, navigate to the download page, and download\
    \ a suitable version of Dojo. In this example, we use the compressed version of\
    \ Dojo without compatibility.\n\n## How to do it...\n\nSetup a PHP page, external_dojo.php,\
    \ that will be used to set up Dojo with the following content:\n\n```php\n<?php\n\
    require_once(dirname(__FILE__) . '../config.php');\n\n$PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));\n\
    $PAGE->set_url('/cook/external_dojo.php');\n$PAGE->requires->js('/cook/dojo.js');\n\
    $PAGE->requires->js('/cook/external_dojo.js');\n\necho $OUTPUT->header();\necho\
    \ $OUTPUT->footer();\n?>\n```\n\nFinally, we create a JavaScript file, external_dojo.js,\
    \ into which we will add a simple Dojo script, as follows:\n\n```javascript\n\
    dojo.addOnLoad(function() {\n  alert('Hello from Dojo');\n});\n```\n\nOnce we\
    \ have saved a copy of Dojo into our Moodle installation, we can set up a PHP\
    \ file to create the page which will run the Dojo code. We include two JavaScript\
    \ files, the first being the Dojo file, and the second being our custom JavaScript\
    \ file external_dojo.js. Note that the Dojo file must be included before the file\
    \ that makes use of it.\n\nWe can now load this page in a web browser, and we\
    \ will see the following JavaScript alert pop-up, proving to us that Dojo has\
    \ loaded correctly, ready for use:\n\n## How it works...\n\nWe loaded the Dojo\
    \ framework before our own JavaScript file, ensuring the framework is ready for\
    \ use. The JavaScript code we added here makes of the window's domready event\
    \ to display a JavaScript alert after the page has fully loaded. When we load\
    \ the page, we see the alert pop-up, and can be assured that Dojo has loaded correctly.\n\
    \n## Adding the Prototype framework\n\nIn this recipe, we will set up the Prototype\
    \ framework for use in our example page. We will then set up a simple Prototype\
    \ script that displays a JavaScript alert when the page has been loaded completely.\n\
    \nThe following is a brief description of the framework from the Prototype website\
    \ (http://www.prototypejs.org/):\n\n- Prototype is a JavaScript framework that\
    \ aims to ease development of dynamic web applications.\n- Featering a unique,\
    \ easy-to-use toolkit for class-driven development and the nicest Ajax library\
    \ around, Prototype is quickly becoming the codebase of choice for web application\
    \ developers.\n\nPrototype is the basis for two extensions: script.aculo.us and\
    \ Lightbox. We will look these in the next two recipes to further enhance the\
    \ features available to us.\n\n## Getting ready\n\nWe begin by downloading the\
    \ latest version of the Prototype framework. Visit the Prototype homepage at http://www.prototypejs.org/,\
    \ navigate to the download page, and download a suitable version of Prototype.\
    \ In this example, we use the compressed version of Prototype without compatibility.\n"
