    \ for example, to load the Animation module (anim) and the event module (event),\
    \ we would use the following syntax in place:\n\n```javascript\nYUI().use(\"anim\"\
    , \"event\", function(Y) { /* code to execute } );\n```\n\n## Loading YUI 2 modules\
    \ from YUI 3\n\nThere can be reasons why we would want to load YUI 2 modules from\
    \ YUI 3. We may have a substantial amount of pre-written YUI 2 code that we wish\
