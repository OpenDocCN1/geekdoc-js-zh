    # 关于作者


    Alastair Hole 是一位 Web 开发人员，目前专注于教育软件，特别是与英国进阶教育和高等教育相关的软件。他的 Web 开发经验始于互联网泡沫后的时代，曾在出版行业的
    B2B 电子商务 Web 应用领域工作，侧重于后台集成。此后，他将才华转向教育领域，创建的项目获得了《时代报教育补充》（The Times Educational
    Supplement）和 IMS 全球学习联盟等组织的奖励。


    Alastair 是获奖插件 Moodle 内容包仓库插件“MrCUTE--Moodle 仓库：创建、上传、标记与嵌入”的作者，该插件是一个由联合信息系统委员会
    (JISC) 委托的开源项目，已从苏格兰到澳大利亚的全球 Moodle 站点被广泛使用。


    感谢所有对本书的完成做出贡献的人，无论是对错过截止日的耐心，还是在一切似乎都不可收拾时的鼓励。感谢 Ma 和 Pa Hole，你们远见卓识，预见到总有一天我会学会重新组装我曾拆卸、断开、拆解或以其他方式摆弄过的所有东西。感谢互联网提供了一个不断扩张的自学机会源。


    请记住，“这仅仅是一场旅程。我们可以随时任何时候改变它。”


    # 关于审核员


    **Anthony Borrow, S.J.** 是新奥尔良教区的耶稣会士，在 Moodle 社区已活跃五年。Anthony 拥有圣路易斯大学的咨询学硕士学位以及圣克拉拉大学耶稣会神学院的神学硕士学位。Anthony
    自1992年以来一直致力于各种数据库系统的设计和实现。


    Anthony 以贡献协调员的身份为 Moodle 社区服务。在该职位上，Anthony 曾在美国各地的 Moodle Moot（会议）上演讲，并为学习如何实施
    Moodle 的机构提供内部培训机会。Anthony 正在 Cristoy Rey 耶稣会（http://cristoreyejuit.org/）培训校园牧师，并为耶稣会中学教育协会（http://jsea.org/）和耶稣会虚拟学习学院（http://jvla.org/）提供技术建议。


    Anthony 是《青少年：全球展望》（Teen Gangs: A Global View）洪都拉斯章节的作者，并担任过多种 Pack 书籍的技术审核员。


    > 我感谢 Moodle 社区不断激励我学习教育技术，并营造了一个每个声音都能为构建该社区的环境。


    **Mauno Korpelainen** 在芬兰的 Hyvinkää 教高中生和成年人数学，多年来一直是 PHM（特别有帮助的 Moodle 用户），并是
    **moodle.org** 论坛的版主之一。


    Susan Smith Nash 目前是俄克拉荷马州图尔萨美国石油地质学家协会（AAPG）的教育与职业发展总监，也是纽约州奥尔巴尼 Excelsior 学院的兼任教授。在此之前，她是俄克拉荷马大学诺曼市文理学院研究生项目的副院长。她在俄克拉荷马大学获得博士、英语硕士和地质学学士学位。Nash  e-learning
    博客，并为许多出版物撰过文章和章节，包括《教学设计与技术的趋势与问题》（第三版）、发展中国家的移动技术采用：影响与意义》。她的最新著作包括《Moodle 教学技巧》（Packt
    Publishing, 2010）、《电子学习者生存指南》（Texture Press, 2009）以及其他书籍。


