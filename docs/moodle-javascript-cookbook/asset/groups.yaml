    # Introduction


    In this chapter, we will look at a selection of techniques available which are
    designed to enhance the users interact with our content. First of all, we will
    look at the different ways we can present a navigation menu, giving the user a
    convenient list of the content that we are making available to them. Secondly,
    we will look at two different ways we can present the actual content to those
    they have navigated.


    We will look at methods of enhancing the display and navigation of page content,
    by extending existing markup in keeping with the concept of ''progressive enhancement''.
    In this context, progressive enhancement essentially means that all the content
    will remain usable to users without JavaScript enabled, or without a suitably
    modern implementation of JavaScript enabled.'
