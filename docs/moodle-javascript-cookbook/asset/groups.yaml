    \ `Y`，该参数将是 YUI 对象新实例的引用。（注意，`use` 方法也用于加载额外的 YUI 模块；这是下一个食谱的主题。）\n\n创建的匿名函数是代码中最需要注意的部分，因为我们将所有利用\
    \ YUI 特性的代码都放在这里。在这个示例中，你将看到我们正在创建一个包含 `Y.version` 值的短消息的 JavaScript 警框，`Y.version`\
