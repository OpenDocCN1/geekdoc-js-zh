    # Debugging with the YUI console


    Debugging is one area where JavaScript has suffered in the past--there are a range
    of browser plugins which could help to some extent, but if we wish to debug an
    issue that occurs in a browser that doesn''t have these useful features, we have
    a problem!


    YUI''s answer to this problem is the YUI Console, as shown in the following image:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_48_0.png)


    This is a widget that displays a log of all messages that have been written to
    the console log. These include messages from existing YUI widgets and plugins,
    but may also include customized messages logged from our own JavaScript code.


    In this recipe, we will display the YIU console and log some example messages
    to it.


