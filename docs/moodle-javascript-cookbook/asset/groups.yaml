    </div>\n<?php\necho $OUTPUT->footer();\n?>\n```\n\n其次，我们需要创建 JavaScript 文件 `autocomplete.js`，代码如下：\n\
    \n```javascript\nYUI().use(\"yui2-autocomplete\", \"yui2-datasource\", function(Y)\
    \ {\n  var YAHOO = Y.YUI;\n  var dataSource = new YAHOO.util.LocalDataSource(\n\
    \    [\"Alpha\", \"Bravo\", \"Beta\", \"Gamma\", \"Golf\"]\n  );\n  var autoCompleteText\
    \ = new YAHOO.widget.AutoComplete(\"txtInput\",\n  \"txtInput_container\", dataSource);\n\
    });\n```\n\n## 工作原理...\n\n我们的 HTML 包含三个元素：一个父级 `div` 元素以及包含在它的两个元素：一个输入框和一个用于显示自动补全建议的占位\
    \ `div` 元素。\n\n我们的 JavaScript 文件定义了一个用于提供建议的 `DataSource`，然后根据我们已经定义的 HTML 元素创建了一个新的\
    \ `AutoComplete` 组件。\n\n在这个示例中，为了简单起见，我们使用了 `LocalDataSource`，但它可以被替换为任何有效的 `DataSource`\
    \ 对象，正如我们在之前的章节中涵盖的那样。\n\n一旦我们有了一个 `DataSource` 对象，我们就会实例化一个新的 YUI2 `AutoComplete`\
    \ 组件，并传递以下参数：\n\n- 提供自动补全建议的 HTML 输入文本元素的名称\n- 用于显示建议的容器元素的名称\n- 用于查找建议的有效数据源对象\n\
    \n## 增强页面元素\n\n现在，当用户开始在文本框中输入字时，任何匹配的自动补全建议都会显示出来并可以被，如下所示：\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_108_0.png)\n\
    \n## 添加带有自动补全的组合框\n\n在这个示例中，我们将自动补全与组合框（下拉列表）结合使用。这与上一个示例相比有一个显著不同之处——它包含一个下拉箭头按钮，允许用户在先输入之前查看完整的值列表。\n\
    \n这在用户可能不确定合适值的情况下非常有用。在这种情况下，他们可以点击下拉按钮查看建议，而无需在输入时进行猜测。此外，这种方法也支持与上一个配方相同的边输入边匹配自动补全。\n\
    \n## 如何实现...\n\n打开上一个配方的 `autocomplete.php` 文件，并编辑文本框自动补全下方的 HTML 代码：\n\n```html\n\
    <div style=\"width:15em;height:10em;\">\n<input id=\"txtCombo\" type=\"text\"\
    \ style=\"vertical-align:top;width:11em;\"><span id=\"toggle\"><<span>/</span></span></span>\n\
    <div id=\"txtCombo_container\"></div>\n</div>\n```\n\n接下来，打开 JavaScript 文件 `autocomplete.js`\
    \ 并将其修改为匹配以下代码：\n\n```javascript\nYUI().use(\"ui12-auto-complete\", \"ui12-datasource\"\
    , \"ui12-element\", \"ui12-yahoo-dom-event\", function (Y) {\n\n  var YAHOO =\
    \ Y.YUI;\n\n  var dataSource = new YAHOO.util.LocalDataSource(\n    [\"Alpha\"\
    , \"Bravo\", \"Beta\", \"Gamma\", \"Golf\"]\n  );\n\n  var autoCompleteText =\
    \ new YAHOO.widget.AutoComplete(\"txtInput\",\n  \"txtInput_container\", dataSource);\n\
    \n  var autoCompleteCombo = new YAHOO.widget.AutoComplete(\"txtCombo\",\n  \"\
    txtCombo_container\", dataSource, {minQueryLength: 0,\n  queryDelay: 0});\n\n\
    \  var toggler = YAHOO.util.Dom.get(\"toggle\");\n  var tButton = new YAHOO.widget.Button({container:toggler,\n\
    \  label:\"&arr;\"});\n  var toggle = function() {\n    if (autoCompleteCombo.isContainerOpen())\
    \ {\n      autoCompleteCombo.collapseContainer();\n    } else {\n      autoCompleteCombo.getInputEl().focus();\n\
    \      setTimeout(function() {\n        autoCompleteCombo.sendQuery(\"*\");\n\
    \      },0);\n    }\n  };\n  tButton.on(\"click\", toggle);\n});\n```\n\n你会注意到，我们在这个配方中添加的\
    \ HTML 与上一个非常相似，除了我们在文本框之后包含了一个 `span` 元素。它被用作插入 YUI2 控制按钮的占位符。\n\n这个配方比上一个复杂得多，因此包含了一些额外的\
    \ YUI 模块：`element`、`button` 和 `yahoo-dom-event`。\n\n我们以之前相同的方式定义 `AutoComplete`\
    \ 组件，但我们需要在作为第四个参数传递的对象中添加两个配置选项。\n\n接下来，我们获取了按钮占位符的引用，并实例化一个新的 `Button` 组件来作为组合框的“下拉”按钮。\n\
    \n最后，我们为按钮定义了一个点击处理程序并将其注册。\n\n我们现在可以看到建议列表，通过点击下拉按钮可以显示它，如下所示：\n\n| |\n|:---|\n\
    | Alpha |\n| Bravo |\n| Beta |\n| Gamma |\n| Golf |\n\n## 工作原理...\n\n用户可以像以前一样在框内输入内容以接收自动补全建议，但现在可以使用组合下拉按钮查看建议。\n\
    \n当用户点击下拉菜单时，会触发点击事件。\n\n此点击事件执行以下操作：\n\n- 如果下拉菜单已显示，则隐藏它，允许用户切换显示状态。\n- 如果未显示，则将焦点置于框内（允许继续输入），并在自动补全组件上执行空白查询，这将显示建议列表。注意，我们在早些定义\
    \ `AutoComplete` 组件时通过 `minQueryLength: 0` 选项显式启用了长度为0的查询。\n\n## 显示自动更新数据\n\n\
    另一个实用的界面是在设定间隔内不断更新数据。例如，这可以每五分钟更新一次新闻标题，或每分钟更新一次股票数据显示。\n\n在这个配方中，我们将采用时钟的基本示例，在页面上显示完整的日期和时间，并使用\
    \ `DataSource` 的扩展每秒更新一次。这种技术可以从任何数据源显示任何数据，并按照我们的频率更新。\n\n## 如何实现...\n\n在这个示例中，我们将设置一个简单的\
    \ PHP 页面 `updatedate.php`，其中包含一个我们要显示的占位符：\n\n```php\n<?php\nrequire_once(dirname(__FILE__)\
    \ . '../config.php');\n$PAGE->set_context(CONTEXT_SYSTEM);\n$PAGE->set_url('/cook/updatedate.php');\n\
    $PAGE->requires_js('/cook/updatedate.js', true);\necho $OUTPUT->header();\n?>\n\
    <div id=\"txtUpdate\"></div>\n<?php\necho $OUTPUT->footer();\n?>\n```\n\n接下来，我们定义\
    \ JavaScript `updatedate.js`：\n\n```javascript\nYUI().use(\"datasource-function\"\
    , \"datasource-polling\", function(Y) {\n  var getDateString = function() {\n\
    \    return new Date();\n  };\n\n  var dataSource = new Y.DataSource.Function({source:getDateString});\n\
    \n  var request = {\n    callback: {\n      success: function(e) {\n        document.getElementById('txtUpdate').innerHTML\
    \ = e.results[0];\n      }\n    }\n  };\n\n  var id = dataSource.setInterval(1000,request);\n\
    });\n```\n\n"
