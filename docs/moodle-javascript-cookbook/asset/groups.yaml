    # Combining Moodle and JavaScript


    # How to do it...


    You will notice that this code is almost identical to that of the previous recipe.
    The key difference here is the parameters we have passed to the $PAGE->requires->js
    method. We have passed a second optional parameter which determines whether or
    not the <script> tag will be rendered within the document''s <head> tag. In this
    case, we set it to true to ensure the <script> tag is rendered as such.


    # How it works...


    We have called $PAGE->requires->js again, this time with two parameters. The first
    is the path to the ._js file we wish to include. The second is a Boolean value
    which specifies whether or not to include the file within the <head> tag of the
    HTML page.


    The <script> tag that is rendered to the document is identical to that of the
    previous recipe, with the crucial difference that it is rendered within the <head>
    tag, rather than at the end of the <body> tag.


    # Generating a JavaScript function call from PHP


    We have loaded our JavaScript file, we need a method to execute it. Once again,
    we may use the Page Requirements Manager $PAGE to generate a call to our JavaScript
    function.


    > This recipe describes a basic technique for executing your JavaScript code when
    the page is loaded. More sophisticated techniques based on handling DOM events
    with the Yahoo! User Interface library will be covered in later chapters.


    # Getting ready


    Set up a page requirejs_init.php with the following content:


    ```

    <?php

    require_once(dirname(__FILE__), ''/config.php'');

    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    $PAGE->set_url(''/course/requirejs_init.php'');

    $PAGE->requires->js(''/course/requirejs_init.js'');

    $PAGE->requires->js_call(''hello'');

    echo $OUTPUT->header();

    echo $OUTPUT->footer();

    ?>

    ```'
