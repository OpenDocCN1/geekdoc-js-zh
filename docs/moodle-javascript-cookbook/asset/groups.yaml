    \ |\n| 2 | Moodle and Yahoo! User Interface Library (YUI) |\n| 3 | Moodle forms\
    \ validation |\n| 4 | Manipulating data |\n| 5 | Working with data tables |\n\
    | 6 | Enhancing page elements |\n| 7 | Advanced layout techniques |\n| 8 | Animating\
    \ components |\n| 9 | Integrating external libraries |\n\n# Working with Data\
    \ Tables\n\nThis page produces the layout, as shown in the following screenshot:\n\
    \n(Note: The screenshot mentioned in the original text appears to be represented\
    \ by the table provided above.)\n\nMoodle Docs for this page\nYou are logged in\
    \ as Admin User (Logout)\n\nNext, we add the necessary code to our associated\
    \ JavaScript file (datatables.js):\n\n```javascript\nYUI().use('yui2-datatable',\
    \ function(YUI) {\n  var YAHOO = YUI.YUI;\n\n  var dataSource = new YAHOO.util.DataSource(YAHOO.util.Dom.get('cookable'));\n\
    \  dataSource.responseType = YAHOO.util.DataSource.TYPE_HTMLTABLE;\n  dataSource.responseSchema\
    \ = {\n    fields:\n      { key: \"chapter\", parser: \"number\" },\n      { key:\
    \ \"title\", parser: \"string\" }\n    }\n  };\n});\n```\n\n# Chapter 5\n\nThe\
    \ HTML table we have constructed consists of a standard two-column table with\
    \ headers and rows clearly defined inside `<head>` and `<th>` tags. Verifying\
    \ that the table header information is stored correctly allows YUI 2 to ensure\
    \ that it is not included as part of the actual data set.\n\nMoving on to our\
    \ JavaScript code, we initialize a new YUI 3 environment in the standard way,\
    \ loading the required module: `yui2-datatable`.\n\nThere is currently no YUI\
    \ 3 version of the DataObject, so we will use the YUI 2 version. This is done\
    \ by setting up the YUI 2 object YAHOO which is available in the object YUI2.\n\
    \nNext, we create a new YUI 2 DataSource, passing a reference to our HTML table\
    \ with ID `cookie`. We then set the `responseType` of the DataTable to identify\
    \ it as an HTML table.\n\nFinally, we set the `schema` of the DataTable with a\
    \ key and also define the data type of the columns; in this case, `number` and\
    \ `string` respectively.\n\nWe have a YUI 2 DataSource populated from our HTML\
    \ table. This can be used with any YUI 2 DataSource compatible code. In this example,\
    \ we will pass this object to the YAHOO control as the basis for an interactive\
    \ data control.\n\n# How it works...\n\nWe used mixture of YUI 2 and YUI 3 code.\
    \ YUI 3 allows us to use the simplified syntax for loading modules, and YUI 2\
    \ allows us to use the DataTable control in lieu of YUI 3 replacement.\n\nYUI\
    \ 3 provides us with an instance of YUI 2, which is available in `YUI2`. We copied\
    \ this into the YAHOO object, for the convenience of being able to use exactly\
    \ the same syntax as in native YUI code.\n\nWhen we point the DataSource constructor\
    \ at our HTML table, it is able to extract the data into a new YUI 2 DataSource\
    \ object by using the `responseType YAHOO.util.DataSource.TYPE_HTMLTABLE`.\n\n\
    # Displaying data\n\nIn this recipe, we use the DataSource object that we prepared\
    \ from our HTML table in the previous recipe. We will use it as the basis for\
    \ a new DataTable control, and we will begin to see the enhancements that this\
    \ affords.\n\nNow we have a DataSource object available, we can move on creating\
    \ the actual DataTable control. This example builds on the previous recipe, adding\
    \ additional code to the existing JavaScript. However, it should be clear that\
    \ the DataSource we built in the previous recipe may be substituted for any other\
    \ (for example, a DataSource built from data retrieved from an XML web service).\n\
    \n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_95.png)\n\n# How to do it...\n\nOpen\
    \ the datatable.js file and add the column definition. The file should then match\
    \ the following:\n\n```javascript\nYUI().use('yui2-datatable', function(YUI) {\n\
    \  var YAHOO = YUI.YUI;\n\n  var dataSource = new YAHOO.util.DataSource(YAHOO.util.Dom.get('cookable'));\n\
    \  dataSource.responseType = YAHOO.util.DataSource.TYPE_HTMLTABLE;\n  dataSource.responseSchema\
    \ = {\n    fields:\n      { key: \"chapter\", parser: \"number\" },\n      { key:\
    \ \"title\", parser: \"string\" }\n    }\n  };\n\n  var columns = [\n    { key:\
    \ \"chapter\", label: \"Chapter No.\", formatter: \"number\" },\n    { key: \"\
    title\", label: \"Title\", formatter: \"string\" }\n  ];\n\n  var dataTable =\
    \ new YAHOO.widget.DataTable(\"container\", columns, dataSource);\n});\n```\n\n\
    We first create an array of objects containing the following properties:\n\n|\
    \ Property | Description |\n|---|---|\n| key | A key for the column |\n| label\
    \ | Text label for the column |\n| formatter | The type of data in the column\
    \ |\n\n![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_96.png)\n\nWe then create a YUI\
    \ 2 DataTable object which takes three arguments:\n1. The ID of a DOM object to\
    \ use as container\n2. The column definition created earlier\n3. The DataSource\
    \ object from which to populate the table\n\nThe DataTable uses the information\
    \ we provided in the column array to generate the table, as shown in the following\
    \ screenshot:\n\n| Chapter No. | Title |\n|---|---|\n| 1 | Combining Moodle and\
    \ JavaScript |\n| 2 | Moodle and Yahoo! User Interface Library (YUI) |\n| 3 |\
    \ Moodle forms validation |\n| 4 | Manipulating data |\n| 5 | Working with data\
    \ tables |\n| 6 | Enhancing page elements |\n| 7 | Advanced layout techniques\
    \ |\n| 8 | Animating components |\n| 9 | Integrating external libraries |\n\n\
    # Basic column sorting\n\nIn this recipe, we will enable column sorting. This\
    \ will allow the user to click on the header cells of the table to sort the entire\
    \ table alphabetically or numerically by that column. Clicking once will sort\
    \ ascending, and clicking a second time will sort descending.\n\n# Getting ready\n\
    \nOpen the datatable.js file for editing. We will modify the column definitions\
    \ to allow sorting.\n\n```javascript\nvar columns = {\n  key: \"chapter\",\n \
    \ label: \"Chapter No.\",\n  formatter: \"number\",\n  sortable: true,\n\n  key:\
    \ \"title\",\n  label: \"Title\",\n  formatter: \"string\",\n  sortable: true\n\
    };\n```\n\nWe added an extra property to each column definition: sortable.\n\n\
    Setting this to true activates the built-in column sorting functionality for each\
    \ column that we have enabled. The following screenshot shows that the DataTable\
    \ has been sorted alphabetically by the Title column, simply by clicking on the\
    \ column header:\n\n| Chapter No. | Title |\n|---|---|\n| 7 | Advanced layout\
    \ techniques |\n| 8 | Animating components |\n| 1 | Combining Moodle and JavaScript\
    \ |\n| 6 | Enhancing page elements |\n| 9 | Integrating external libraries |\n\
    | 4 | Manipulating data |\n| 2 | Moodle and Yahoo! User Interface Library (YUI)\
    \ |\n| 3 | Moodle forms validation |\n| 5 | Working with data tables |\n\nSimilarly,\
    \ we may sort the rows of the table by chapter number, in descending numerical\
