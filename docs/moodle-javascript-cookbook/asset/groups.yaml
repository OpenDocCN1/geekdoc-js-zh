    ## Chapter 1


    Please refer to the Moodle documentation at http://docs.moodle.org/ to decide
    which plugin framework suits your requirements.


    There may be rare cases when it is simply not possible to implement the functionality
    you desire inside the plugin frameworks, requiring the modification of core code.
    If this is the case, it is likely that the functionality you desire will be useful
    to all Moodle users. Therefore, you should engage with the Moodle development
    community to seek advice regarding the feasibility of having changes included
    in the new revision of the core code.


    If, however, you know for a fact that you definitely need to make changes to core
    code and those changes will be bespoke to use of Moodle, you may consider (as
    a last resort) modifying the core code files. Be aware that this method is not
    without issues, incurring significant disadvantages:


    - Keeping track of each change you make to each file, and merging these changes
    as you upgrade to future versions of Moodle. Version control systems such as CVS
    or GIT may assist you.

    - Your changes will not be subject to the same standard of testing and debugging
    as that of the official code.

    - Your changes will not be guaranteed to continue to work in future versions;
    you will need to fully test your changes with each future upgrade.


    So, as you can see, there is a trade-off in functionality versatility for each
    method of extending and enhancing Moodle; so you should choose wisely. If in doubt,
    use a plugin or theme!


    ## Getting ready


    To begin with, we will create a subfolder named cook within our Moodle installation
    where we will put all the files we will work throughout the book.


    Next we will create the PHP file blank.php, with the following:


    ```php

    <?php

    require_once (dirname(__FILE__) . ''/../config.php'');

    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    $PAGE->set_url(''/cook/blank.php'');

    echo OUTPUT->header();

    echo OUTPUT->footer();

    ?>

    ```


    ## Downloading the example code files


    > You can download the example code files for all Packt books you have purchased
    from your account at http://www.PacktPub.com. If you purchased this book elsewhere,
    you can visit http://www.PacktPub.com/support and register to have the files e-mailed
    to you.


    ## Combining Moodle and JavaScript


    We now have our template saved at /path/to/moodle/cook/blank.php.


    To test this new template, we can load it in a browser and check if all is well.
    Assuming we have a web server running with Moodle served at the base URL http://localhost/moodle,
    we can load the URL to test our new template: http://localhost/moodle/cook/blank.php.


    If the template is set up correctly, we will see a basic page with standard header
    and footer, similar to the following:


    ![](img/6eec08dbea5e7459c4bcd2ec593a6fd6_22_0.png)


    ## How to do it...


    We begin by using the PHP tags in the standard way, using <?php.


    Note that we have not used the shorthand notation of <??, as this goes against
    the Moodle programming guidelines and also general good practice.


    Next, we must include Moodle''s global configuration file. The inclusion of this
    file sets up the requisite Moodle programming environment, including two global
    variables we will make use of: $PAGE and $OUTPUT.


    $PAGE is defined as a central store of information about the current page we are
    generating in response to the user''s request.


    The PAGE object allows us to start defining the properties of the page, namely
    the context and the URL. The context of the page is the scope of the page, that
    is, in the Moodle system it is being used. We are using the System content; other
    examples are in Course or Module context.


    Next, we set the URL of the page. This mirrors our directory structure; so in
    this case we set it to /cook/blank.php.


    $OUTPUT is defined as an instance of core_renderer or one of its subclasses. Use
    it to generate HTML for output.


    The OUTPUT object allows us to generate the header and footer for our page, based
    on the current Moodle theme. This is done by calling the header and footer methods
    of the $OUTPUT object, and using echo to write them to the page.


    ## How it works...


    After opening the PHP tag, we can begin inserting the PHP code. We use require_once
    to include the Moodle configuration file (this ensures that the file is included
    once, and will halt execution of the page if the file is unavailable). The path
    to the configuration file is determined using the dirname function to get the
    path to the current file (using the built-in __FILE__ constant), and then traversing
    one directory (as we are in our cook subdirectory) to find the config.php file.


    Next, we get the page context by calling the set_context method of the $PAGE object.
    This takes a context instance. Retrieve the instance for the system context by
    passing the CONTEXT_SYSTEM constant to the get_context_instance function.


    The final usage of the $PAGE object is to set the page URL, which is done using
    the set_url method, in a web root URL path, which is /cook/blank.php in this case.


    Next, we need to use the $OUTPUT object to generate the header and footer of the
    page. Both header and footer methods return HTML as a string, so we can use the
    echo construct to write these strings to the page.


    ## Loading a JavaScript file


    A majority of the JavaScript we add will be contained within an external JavaScript
    file, which is a text file with a .js extension, which is a text file with a .js
    extension. In this recipe, we will learn how to use the $PAGE to include such
    a file.


    ## Getting ready


    Create a subfolder named cook within our Moodle installation where we will put
    all the files we will work throughout the book.


    Next we will create the PHP file blank.php, with the following:


    ```php

    <?php

    require_once (dirname(__FILE__) . ''/../config.php'');

    $PAGE->set_context(get_context_instance(CONTEXT_SYSTEM));

    $PAGE->set_url(''/cook/blank.php'');

    echo OUTPUT->header();

    echo OUTPUT->footer();

    ?>

    ```


