    Tuesday\":\n    console.log(\"It's the second day of the week.\");\n    break;\n\
    \  // ... more cases ...\n  default:\n    console.log(\"It's an unknown day.\"\
    );\n    break;\n}\n```\n\n在这个示例中，如果 `day` 变量的值为 \"Monday\"，将显示消息 \"It's the first\
    \ day of the week.\"。如果值为 \"Tuesday\"，则将显示消息 \"It's the second day of the week.\"\
    。如果该值不匹配任何 `case`，则将显示默认消息 \"It's an unknown day\"。\n\n## 3.2 循环语句\n\n循环语句允许我们多次执行某块代码。当我们想要重复执行某个任务或遍历数据集时，这些语句非常有用。JavaScript\
    \ 提供了几种循环语句，包括 `for` 循环、`while` 循环和 `do...while` 循环。\n\n### 3.2.1 for 循环\n\n`for`\
    \ 循环通常在我们预知迭代次数时使用。它由三部分组成：初始化、条件和更新。其语法如下：\n\n```javascript\nfor (initialization;\
    \ condition; update) {\n  // 每次迭代时执行的代码\n}\n```\n\n让我们来看一个 `for` 循环的示例：\n\n```javascript\n\
    for (var i = 1; i <= 5; i++) {\n  console.log(i);\n}\n```\n\n在这个示例中，循环将迭代五次，并显示\
    \ 1 到 5 的数字。\n\n### 3.2.2 while 循环\n\n`while` 循环用于我们预知具体迭代次数的情况。只要指定的条件为真，它就会继续执行代码块。其语法如下：\n\
    \n```javascript\nwhile (condition) {\n  // 每次迭代时执行的代码\n}\n```\n\n让我们来看一个 `while`\
    \ 循环的示例：\n\n```javascript\nvar i = 1;\nwhile (i <= 5) {\n  console.log(i);\n \
    \ i++;\n}\n```\n\n在这个示例中，循环将迭代五次，与之前的 `for` 循环示例相似。\n\n### 3.2.3 do...while 循环\n\
    \n`do...while` 循环类似于 `while` 循环，但它保证在检查条件之前至少执行一次代码块。其语法如下如下：\n\n```javascript\n\
    do {\n  // 每次迭代时执行的代码\n} while (condition);\n```\n\n让我们来看一个 `do...while` 循环的示例：\n\
    \n```javascript\nvar i = 1;\ndo {\n  console.log(i);\n  i++;\n} while (i <= 5);\n\
    ```\n\n在这个示例中，循环将迭代五次，与之前的示例一样。\n\n## 3.3 总结\n\n在本章中，我们探索了 JavaScript 控制流语句，包括条件语句和循环语句。我们学习了如何使用\
    \ `if` 和 `switch` 语句进行决策，以及如何使用 `for`、`while` 和 `do...while` 循环重复代码。理解控制流是至关重要的。\n\
    \n## 4: 函数\n\n在本章中，我们将探索函数，函数允许我们创建可重用的代码块。\n\n### 4.1 函数简介\n\n函数是设计用于执行特定任务的代码块。它们在被调用时执行。\n\
    \n### 4.2 函数声明\n\n要定义一个函数，我们使用 `function` 关键字。其基本语法如下：\n\n```javascript\nfunction\
    \ square(number) {\n  var result = number * number;\n  return result;\n}\n```\n\
    \n### 4.3 函数调用\n\n要执行函数，我们通过它的名称调用它。这里有一个函数调用的示例：\n\n```javascript\nvar number\
    \ = 5;\nvar squaredNumber = square(number);\nconsole.log(squaredNumber); // 输出:\
    \ 25\n```\n\n在这个示例中，我们将 `5` 作为参数传递给函数。\n\n### 4.4 参数与实参数\n\n函数可以接受参数，参数是传递给函数的值的占位符。参数允许函数具有灵活性并处理不同的值。当我们调用函数时，我们传递实参，实参是替换参数的实际值。\n\
    \n### 4.5 函数返回语句\n\n函数中的 `return` 语句用于指定函数应该返回的值。它标记了函数执行的结束，并将指定的值发送回调用者。\n\n\
    ### 4.6 函数作用域\n\nJavaScript 中的函数有它们自己的作用域。在函数内部声明的变量是局部作用域的，这意味着它们只能在函数内部访问。相反，在任何函数外部声明的变量具有全局作用域，可以从代码的任何地方访问。让我们通过示例来检查函数作用域的概念：\n\
    \n```javascript\nvar globalVariable = \"I'm a global variable\";\n\nfunction myFunction()\
    \ {\n  var localVariable = \"I'm a local variable\";\n  console.log(localVariable);\
    \ // 输出: I'm a local variable\n  console.log(globalVariable); // 输出: I'm a global\
    \ variable\n}\n\nmyFunction();\n\nconsole.log(localVariable); // 错误: localVariable\
    \ is not defined\nconsole.log(globalVariable); // 输出: I'm a global variable\n\
    ```\n"
