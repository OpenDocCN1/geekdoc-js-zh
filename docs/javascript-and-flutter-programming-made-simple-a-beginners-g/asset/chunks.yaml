- fmt: "\nIn this chapter, we explored animations and gestures in Flutter. Animations\
    \ allow us to create smooth and engaging user interfaces, while gestures enable\
    \ users to interact with the app through touch. We learned how to create animations\
    \ using `AnimatedContainer`, `AnimationController`, and `Tween`, and how to handle\
    \ gestures using `GestureDetector` and `Dismissible`.\n\nBy combining animations\
    \ and gestures, we can build interactive and visually appealing user experiences\
    \ that enhance the overall usability and enjoyment of our apps.\n\n# Chapter 11:\
    \ Building Custom Widgets\n\nIn Chapter 10, we explored animations and gestures\
    \ to add interactivity and engagement to our apps. Now, in Chapter 11, we will\
    \ dive into building custom widgets in Flutter. Custom widgets allow us to encapsulate\
    \ and reuse UI components, making our codebase more maintainable and organized.\
    \ In this chapter, we will learn how to create custom widgets from scratch, along\
    \ with practical examples to understand their implementation.\n\n## Why Build\
    \ Custom Widgets?\n\nFlutter provides a rich set of built-in widgets, but sometimes\
    \ our app's UI requirements go beyond the built-in offerings. Building custom\
    \ widgets enables us to create specialized components that perfectly fit our app's\
    \ design and functionality. Custom widgets also promote code reuse, as we can\
    \ use them multiple times throughout our app.\n\n## Creating a Stateless Custom\
    \ Widget\n\nA stateless custom widget is a widget that doesn't maintain any internal\
    \ state and is immutable. It is ideal for widgets with fixed content that doesn't\
    \ change over time.\n\nExample:\n\n```dart\nimport 'package:flutter/material.dart';\n\
    \nclass MyCustomButton extends StatelessWidget {\n  final String label;\n  final\
    \ VoidCallback onPressed;\n  MyCustomButton({required this.label, required this.onPressed});\n\
    \n  @override\n  Widget build(BuildContext context) {\n    return ElevatedButton(\n\
    \      onPressed: onPressed,\n      child: Text(label),\n    );\n  }\n}\n```\n\
    \nIn this example, we create a custom stateless widget called `MyCustomButton`.\
    \ It takes two parameters, `label` and `onPressed`, to customize the button's\
    \ text and behavior. The widget uses the built-in `ElevatedButton` to render the\
    \ button.\n\n## Creating a Stateful Custom Widget\n\nA stateful custom widget\
    \ is a widget that can maintain internal state and is mutable. It is suitable\
    \ for widgets that need to change their content or appearance over time.\n\nExample:\n\
    \n```dart\nimport 'package:flutter/material.dart';\n\nclass MyCounter extends\
    \ StatefulWidget {\n  @override\n  _MyCounterState createState() => _MyCounterState();\n\
    }\n\nclass _MyCounterState extends State<MyCounter> {\n  int _count = 0;\n  void\
    \ _incrementCounter() {\n    setState(() {\n      _count++;\n    });\n  }\n\n\
    \  @override\n  Widget build(BuildContext context) {\n    return Column(\n   \
    \   children: [\n        Text('Count: $_count'),\n        ElevatedButton(\n  \
    \        onPressed: _incrementCounter,\n          child: Text('Increment'),\n\
    \        ),\n      ],\n    );\n  }\n}\n```\n\nIn this example, we create a custom\
    \ stateful widget called `MyCounter`. It maintains an internal `_count` variable\
    \ and updates it when the button is pressed using the `setState()` method. The\
    \ widget displays the current count and a button to increment it.\n\n## Combining\
    \ Widgets to Create Complex Custom Widgets\n\nCustom widgets can be composed of\
    \ other built-in or custom widgets, enabling us to create more complex and specialized\
    \ UI components.\n\nExample:\n\n```dart\nimport 'package:flutter/material.dart';\n\
    \nclass MyCustomCard extends StatelessWidget {\n  final String title;\n  final\
    \ String content;\n  MyCustomCard({required this.title, required this.content});\n\
    \n  @override\n  Widget build(BuildContext context) {\n    return Card(\n    \
    \  child: Column(\n        children: [\n          ListTile(\n            title:\
