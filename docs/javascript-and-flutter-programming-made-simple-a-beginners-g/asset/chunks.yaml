    named routes for more structured navigation. We also saw how to pass data between
    screens, handle navigation results, and implement tab navigation, drawer navigation,
    and bottom navigation bar.


    Effective navigation is essential for creating a seamless user experience in your
    app. By mastering navigation techniques, you can design intuitive and efficient
    app navigation, ensuring that users can easily explore and interact with your
    app''s content and functionality.


    # # Chapter 8: Working with APIs and Networking


    In Chapter 7, we learned about navigating between screens in Flutter. Now, in
    Chapter 8, we will explore another critical aspect of app development - working
    with APIs and networking. APIs (Application Programming Interfaces) enable apps
    to interact with remote servers and retrieve data or perform actions. In this
    chapter, we will learn how to make HTTP requests, handle responses, and parse
    data from APIs using Flutter, along with practical examples.


    ## Making HTTP Requests


    To interact with APIs, we need to make HTTP requests to send data to the server
    or retrieve data from it. Flutter provides the `http` package, which simplifies
    making HTTP requests.


    ### Sending GET Requests


    A GET request is used to retrieve data from the server. Let''s make a simple GET
    request to fetch data from a hypothetical API:


    Example:


    ```dart


    import ''package:http/http.dart'' as http;


    void fetchData() async {


    final url = Uri.parse(''https://api.example.com/data'');


    final response = await http.get(url);


    if (response.statusCode == 200) {


    print(''Data fetched successfully!'');


    print(response.body); // The response data


    } else {


    print(''Failed to fetch data. Error code: ${response.statusCode}'');


    }


    }


    ```


    In this example, we use the `http.get` method to fetch data from the API. The
    response contains the data returned by the API. We check the `statusCode` to verify
    if the request was successful (200) or not.


    ### Sending POST Requests


    A POST request is used to send data to the server, such as submitting a form or
    creating a new resource.


    Example:


    ```dart


    import ''package:http/http.dart'' as http;


    void createResource() async {


    final url = Uri.parse(''https://api.example.com/resource'');


    final response = await http.post(url, body: {''name'': ''New Resource''});


    if (response.statusCode == 201) {


    print(''Resource created successfully!'');


    print(response.body); // The response data


    } else {


    print(''Failed to create resource. Error code: ${response.statusCode}'');


    }


    }


    ```


    In this example, we use the `http.post` method to send data to the API. We pass
    the data as a `Map` in the `body` parameter.


    ## Handling JSON Data


    APIs often return data in JSON (JavaScript Object Notation) format. Flutter provides
    built-in support to work with JSON data.


    ### Decoding JSON Data


    To decode JSON data into Dart objects, we use the `json.decode` method:


    Example:


    ```dart


    import ''dart:convert'';


    void parseJson(String jsonString) {


    final Map<String, dynamic> jsonData = json.decode(jsonString);


    final String name = jsonData[''name''];


    final int age = jsonData[''age''];


    print(''Name: $name'');


    print(''Age: $age'');


    }


    ```


    In this example, we decode the JSON data from a string and access its properties
    using key-value pairs.


    ### Encoding JSON Data


    To encode Dart objects into JSON data, we use the `json.encode` method:


    Example:


    ```dart


    import ''dart:convert'';


    String convertToJson() {


    final Map<String, dynamic> data = {


    ''name'': ''John Doe'',


    ''age'': 30,


    };


    final jsonString = json.encode(data);


    return jsonString;


    }


    ```


    In this example, we use the `json.encode` method to convert a `Map` into a JSON-formatted
    string.


    ## Using Packages for API Calls


    For more complex API interactions, we can use third-party packages that provide
    additional functionalities and abstractions.


    ### Dio Package


    The `dio` package is a powerful HTTP client for Flutter, supporting features like
    request and response interceptors, cancellation, and authentication.


    Example:


    ```dart


    import ''package:dio/dio.dart'';


    void fetchDataWithDio() async {


    final url = ''https://api.example.com/data'';


    final dio = Dio();


    try {


    final response = await dio.get(url);


    print(''Data fetched successfully!'');


    print(response.data); // The response data


    } catch (e) {


    print(''Failed to fetch data. Error: $e'');


    }


    }


    ```


    ### Retrofit Package


    The `retrofit` package simplifies working with APIs by using annotations to define
    API endpoints as Dart methods.


