    \n# 第 8 章：处理 API 和网络\n\n在第 7 章中，我们学习了如何在 Flutter 中在屏幕之间导航。现在，在第 8 章中，我们将探索应用开发的另一个关键方面——处理\
    \ API 和网络。API（应用程序接口）允许 App 与远程服务器交互并检索数据或执行操作。在本章中，我们将学习如何使用 Flutter 发送 HTTP\
    \ 请求、处理响应以及解析来自 API 的，并结合实际示例。\n\n## 发送 HTTP 请求\n\n为了与 API 交互，我们需要发送 HTTP 请求向服务器发送数据或从其检索数据。Flutter\
    \ 提供了 `http` 包，它简化了 HTTP 请求的发送。\n\n### 发送 GET 请求\n\nGET 请求用于从服务器检索数据。让我们发送一个简单的\
    \ GET 请求来从假设的 API 获取数据：\n\n示例：\n\n```dart\nimport 'package:http/http.dart' as\
    \ http;\nvoid fetchData() async {\n  final url = Uri.parse('https://api.example.com/data');\n\
    \  final response = await http.get(url);\n  if (response.statusCode == 200) {\n\
    \    print('Data fetched successfully!');\n    print(response.body); // The response\
    \ data\n  }\n}\n```\n\n在这个示例中，我们使用 `http.get` 方法从 API 获取数据。我们检查 `statusCode` 是否成功（200）。\n\
    \n### 发送 POST 请求\n\nPOST 请求用于向服务器发送数据，例如提交表单或创建资源。\n\n示例：\n\n```dart\nimport 'package:http/http.dart'\
    \ as http;\nvoid createResource() async {\n  final url = Uri.parse('https://api.example.com/resource');\n\
    \  final response = await http.post(url, body: {'name': 'New Resource'});\n  if\
    \ (response.statusCode == 201) {\n    print('Resource created successfully!');\n\
    \    print(response.body);\n  } else {\n    print('Failed to create resource.');\n\
    \  }\n}\n```\n\n在这个示例中，我们通过将 `Map` 作为 `body` 参数向 API 发送数据。\n\n## 处理 JSON 数据\n\n\
    API 通常以 JSON（JavaScript 对象表示）格式返回数据。Flutter 提供了处理 JSON 数据的支持。\n\n### 解码 JSON 数据\n\
    \n要将 JSON 数据解码为 Dart 对象，我们使用 `json.decode` 方法：\n\n示例：\n\n```dart\nimport 'dart:convert';\n\
    void parseJson(String jsonString) {\n  final Map<String, dynamic> jsonData = json.decode(jsonString);\n\
    \  final String name = jsonData['name'];\n  final int age = jsonData['age'];\n\
    \  print('Name: $name');\n  print('Age: $age');\n}\n```\n\n在这个示例中，我们从字符串解码 JSON\
    \ 数据并使用键值对访问其属性。\n\n### 编码 JSON 数据\n\n要将 Dart 对象编码为 JSON 数据，我们使用 `json.encode`\
    \ 方法：\n\n示例：\n\n```dart\nimport 'dart:convert';\nString convertToJson() {\n  final\
    \ Map<String, dynamic> data = {\n    'name': 'John Doe',\n    'age': 30,\n  };\n\
    \  final jsonString = json.encode(data);\n  return jsonString;\n}\n```\n\n在这个示例中，我们使用\
    \ `json.encode` 方法将 `Map` 转换为 JSON 字符串。\n\n 使用包调用 API\n\n对于更复杂的 API 交互，可以使用提供额外功能和抽象的第三方包。\n\
    \n### Dio 包\n\n`dio` 包是一个强大的 Flutter HTTP 客户端，支持请求和响应拦截器、取消和身份验证等功能。\n\n示例：\n\n\
    ```dart\nimport 'package:dio/dio.dart';\nvoid fetchDataWithDio() async {\n  final\
    \ url = 'https://api.example.com/data';\n  final dio = Dio();\n  try {\n    final\
