    # Chapter 3: JavaScript Control Flow Statements


    In Chapter 2, we learned about JavaScript syntax, operators, and expressions.
    Now, let''s explore control flow statements, which allow us to control the flow
    of execution in our code. Control flow statements enable us to make decisions
    and repeat actions based on specific conditions. Understanding control flow is
    essential for creating dynamic and interactive JavaScript programs.


    ### 3.1 Conditional Statements


    Conditional statements are used to execute different blocks of code based on specific
    conditions. They allow us to control the flow of execution by making decisions.
    JavaScript provides several conditional statements, including the `if` statement,
    the `if...else` statement, and the `switch` statement.


    ### 3.1.1 The if Statement


    The `if` statement is the simplest conditional statement. It executes a block
    of code if a given condition is true. Here''s the basic syntax of an `if` statement:


    ```javascript


    if (condition) {


    // code to be executed if the condition is true


    }


    ```


    Let''s see an example:


    ```javascript


    var age = 18;


    if (age >= 18) {


    console.log("You are eligible to vote.");


    }


    ```


    In this example, if the `age` variable is greater than or equal to 18, the message
    "You are eligible to vote" will be displayed.


    ### 3.1.2 The if...else Statement


    The `if...else` statement allows us to execute one block of code if a condition
    is true and another block of code if the condition is false. Here''s the syntax:


    ```javascript


    if (condition) {


    // code to be executed if the condition is true


    } else {


    // code to be executed if the condition is false


    }


    ```


    Let''s modify our previous example to include an `if...else` statement:


    ```javascript


    var age = 16;


    if (age >= 18) {


    console.log("You are eligible to vote.");


    } else {


    console.log("You are not eligible to vote yet.");


    }


    ```


    In this case, if the `age` variable is less than 18, the message "You are not
    eligible to vote yet" will be displayed.


    ### 3.1.3 The switch Statement


    The `switch` statement is used to perform different actions based on different
    conditions. It evaluates an expression and executes the corresponding case that
    matches the value of the expression. Here''s the syntax:


    ```javascript


    switch (expression) {


    case value1:


    // code to be executed if the expression matches value1


    break;


    case value2:


    // code to be executed if the expression matches value2


    break;


    default:


    // code to be executed if the expression doesn''t match any case


    break;


    }


    ```


