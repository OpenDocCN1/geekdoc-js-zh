- fmt: "\nTab navigation is a common navigation pattern used to switch between different\
    \ sections or categories within an app. Flutter provides the `TabBar` and `TabBarView`\
    \ widgets to implement tab navigation.\n\nExample:\n\n```dart\nclass TabNavigation\
    \ extends StatelessWidget {\n  @override\n  Widget build(BuildContext context)\
    \ {\n    return DefaultTabController(\n      length: 3,\n      child: Scaffold(\n\
    \        appBar: AppBar(\n          title: Text('Tab Navigation'),\n         \
    \ bottom: TabBar(\n            tabs: [\n              Tab(text: 'Tab 1'),\n  \
    \            Tab(text: 'Tab 2'),\n              Tab(text: 'Tab 3'),\n        \
    \    ],\n          ),\n        ),\n        body: TabBarView(\n          children:\
    \ [\n            Center(child: Text('Tab 1 Content')),\n            Center(child:\
    \ Text('Tab 2 Content')),\n            Center(child: Text('Tab 3 Content')),\n\
    \          ],\n        ),\n      ),\n    );\n  }\n}\n```\n\nIn this example, we\
    \ use the `TabBar` widget to create the tab bar at the top of the screen and the\
    \ `TabBarView` to display different content for each tab.\n\n## Drawer Navigation\n\
    \nA drawer is a side panel that contains navigation options, settings, or other\
    \ information. Flutter provides the `Drawer` widget to implement drawer navigation.\n\
    \nExample:\n\n```dart\nclass DrawerNavigation extends StatelessWidget {\n  @override\n\
    \  Widget build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(title:\
    \ Text('Drawer Navigation')),\n      drawer: Drawer(\n        child: ListView(\n\
    \          children: [\n            DrawerHeader(\n              child: Text('Drawer\
    \ Header'),\n              decoration: BoxDecoration(color: Colors.blue),\n  \
    \          ),\n            ListTile(\n              title: Text('Option 1'),\n\
    \              onTap: () {\n                Navigator.pop(context);\n        \
    \        // Handle option 1 tap\n              },\n            ),\n          \
    \  ListTile(\n              title: Text('Option 2'),\n              onTap: ()\
    \ {\n                Navigator.pop(context);\n                // Handle option\
    \ 2 tap\n              },\n            ),\n          ],\n        ),\n      ),\n\
    \      body: Center(child: Text('Main Content')),\n    );\n  }\n}\n```\n\nIn this\
    \ example, we use the `Drawer` widget to create the drawer panel with options.\
    \ When the user taps an option, we use `Navigator.pop` to close the drawer and\
    \ handle the tap event.\n\n## Bottom Navigation Bar\n\nA bottom navigation bar\
    \ is a common pattern used to switch between different sections or views in the\
    \ app. Flutter provides the `BottomNavigationBar` widget for implementing a bottom\
    \ navigation bar.\n\nExample:\n\n```dart\nclass BottomNavigation extends StatefulWidget\
    \ {\n  @override\n  _BottomNavigationState createState() => _BottomNavigationState();\n\
    }\nclass _BottomNavigationState extends State<BottomNavigation> {\n  int _currentIndex\
    \ = 0;\n  final List<Widget> _screens = [\n    Screen1(),\n    Screen2(),\n  \
    \  Screen3(),\n  ];\n\n  @override\n  Widget build(BuildContext context) {\n \
    \   return Scaffold(\n      appBar: AppBar(title: Text('Bottom Navigation')),\n\
    \      body: _screens[_currentIndex],\n      bottomNavigationBar: BottomNavigationBar(\n\
    \        currentIndex: _currentIndex,\n        onTap: (index) {\n          setState(()\
    \ {\n            _currentIndex = index;\n          });\n        },\n        items:\
    \ [\n          BottomNavigationBarItem(icon: Icon(Icons.home), label: 'Home'),\n\
    \          BottomNavigationBarItem(icon: Icon(Icons.search), label: 'Search'),\n\
    \          BottomNavigationBarItem(icon: Icon(Icons.person), label: 'Profile'),\n\
    \        ],\n      ),\n    );\n  }\n}\n```\n\nIn this example, we use the `BottomNavigationBar`\
    \ widget to create the bottom navigation bar with three items. The `onTap` callback\
    \ changes the `_currentIndex`, which updates the displayed screen based on the\
    \ selected item.\n\n## Conclusion\n\nIn this chapter, we explored different navigation\
    \ techniques in Flutter. We learned about basic navigation using `Navigator.push`\
    \ and `Navigator.pop`, as well as named routes for more structured navigation.\
    \ We also saw how to pass data between screens, handle navigation results, and\
    \ implement tab navigation, drawer navigation, and bottom navigation bar.\n\n\
    Effective navigation is essential for creating a seamless user experience in your\
    \ app. By mastering navigation techniques, you can design intuitive and efficient\
    \ app navigation, ensuring that users can easily explore and interact with your\
    \ app's content and functionality.\n\n# Chapter 8: Working with APIs and Networking\n\
    \nIn Chapter 7, we learned about navigating between screens in Flutter. Now, in\
    \ Chapter 8, we will explore another critical aspect of app development - working\
    \ with APIs and networking. APIs (Application Programming Interfaces) enable apps\
    \ to interact with remote servers and retrieve data or perform actions. In this\
    \ chapter, we will learn how to make HTTP requests, handle responses, and parse\
    \ data from APIs using Flutter, along with practical examples.\n\n## Making HTTP\
    \ Requests\n\nTo interact with APIs, we need to make HTTP requests to send data\
    \ to the server or retrieve data from it. Flutter provides the `http` package,\
    \ which simplifies making HTTP requests.\n\n### Sending GET Requests\n\nA GET\
    \ request is used to retrieve data from the server. Let's make a simple GET request\
    \ to fetch data from a hypothetical API:\n\nExample:\n\n```dart\nimport 'package:http/http.dart'\
    \ as http;\nvoid fetchData() async {\n  final url = Uri.parse('https://api.example.com/data');\n\
    \  final response = await http.get(url);\n  if (response.statusCode == 200) {\n\
    \    print('Data fetched successfully!');\n    print(response.body); // The response\
    \ data\n  } else {\n    print('Failed to fetch data. Error code: ${response.statusCode}');\n\
    \  }\n}\n```\n\nIn this example, we use the `http.get` method to fetch data from\
    \ the API. The response contains the data returned by the API. We check the `statusCode`\
    \ to verify if the request was successful (200) or not.\n\n### Sending POST Requests\n\
    \nA POST request is used to send data to the server, such as submitting a form\
    \ or creating a new resource.\n\nExample:\n\n```dart\nimport 'package:http/http.dart'\
    \ as http;\nvoid createResource() async {\n  final url = Uri.parse('https://api.example.com/resource');\n\
    \  final response = await http.post(url, body: {'name': 'New Resource'});\n  if\
    \ (response.statusCode == 201) {\n    print('Resource created successfully!');\n\
    \    print(response.body); // The response data\n  } else {\n    print('Failed\
    \ to create resource. Error code: ${response.statusCode}');\n  }\n}\n```\n\nIn\
    \ this example, we use the `http.post` method to send data to the API. We pass\
    \ the data as a `Map` in the `body` parameter.\n\n## Handling JSON Data\n\nAPIs\
    \ often return data in JSON (JavaScript Object Notation) format. Flutter provides\
    \ built-in support to work with JSON data.\n\n### Decoding JSON Data\n\nTo decode\
    \ JSON data into Dart objects, we use the `json.decode` method:\n\nExample:\n\n\
    ```dart\nimport 'dart:convert';\nvoid parseJson(String jsonString) {\n  final\
    \ Map<String, dynamic> jsonData = json.decode(jsonString);\n  final String name\
    \ = jsonData['name'];\n  final int age = jsonData['age'];\n  print('Name: $name');\n\
    \  print('Age: $age');\n}\n```\n\nIn this example, we decode the JSON data from\
