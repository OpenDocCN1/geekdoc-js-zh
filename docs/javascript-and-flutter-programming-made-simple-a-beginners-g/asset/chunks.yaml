    \      },\n      child: Container(\n        width: 100,\n        height: 100,\n\
    \        color: Colors.blue,\n      ),\n    );\n  }\n}\n```\n\n在这个示例中，我们创建了一个名为\
    \ `GestureDetectorExample` 的无状态组件，它使用 `GestureDetector` 组件来检测点击、双击、长按、滑动和平缩放手势。当检测到手势时，控制台会打印相应的消息。\n\
    \n### Dismissible\n\n`Dismissible` 组件允许我们实现通过滑动删除列表的功能。\n\n示例：\n\n```dart\nclass\
    \ DismissibleExample extends StatefulWidget {\n  @override\n  _DismissibleExampleState\
    \ createState() => _DismissibleExampleState();\n}\n\nclass _DismissibleExampleState\
    \ extends State<DismissibleExample> {\n  List<String> _items = List.generate(5,\
    \ (index) => 'Item ${index + 1}');\n\n  @override\n  Widget build(BuildContext\
    \ context) {\n    return ListView.builder(\n      itemCount: _items.length,\n\
    \      itemBuilder: (context, index) {\n        final item = _items[index];\n\
    \        return Dismissible(\n          key: Key(item),\n          direction:\
    \ DismissDirection.endToStart,\n          background: Container(\n           \
    \ color: Colors.red,\n            alignment: Alignment.centerRight,\n        \
    \    padding: EdgeInsets.symmetric(horizontal: 16.0),\n            child: Icon(Icons.delete,\
    \ color: Colors.white),\n          ),\n          onDismissed: (direction) {\n\
    \            setState(() {\n              _items.removeAt(index);\n          \
    \  });\n          },\n          child: ListTile(\n            title: Text(item),\n\
    \          ),\n        );\n      },\n    );\n  }\n}\n```\n\n## 动画与手势\n\n我们可以结合动画和手势来创建交互式的用户界面。\n\
    \n示例：\n\n```dart\nclass AnimatedGestureExample extends StatefulWidget {\n  @override\n\
    \  _AnimatedGestureExampleState createState() => _AnimatedGestureExampleState();\n\
    }\n\nclass _AnimatedGestureExampleState extends State<AnimatedGestureExample>\n\
