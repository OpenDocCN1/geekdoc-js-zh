    with a custom error message that includes the response status.


    Throwing an error in the Promise chain allows us to handle the error in the subsequent
    `catch()` block. This way, we can gracefully handle errors and provide appropriate
    feedback to the user.


    Additionally, you can also throw custom errors using the `throw` statement. For
    example:


    ```javascript


