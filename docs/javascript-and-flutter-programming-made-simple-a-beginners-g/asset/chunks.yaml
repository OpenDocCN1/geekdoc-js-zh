    \          alignment: _isExpanded ? Alignment.center : AlignmentDirectional.topCenter,\n\
    \          child: Text('Tap Me'),\n        ),\n      ),\n    );\n  }\n\n  @override\n\
    \  void dispose() {\n    _controller.dispose();\n    super.dispose();\n  }\n}\n\
    ```\n\n在这个示例中，我们结合动画和手势来创建一个展开和收起的容器。当点击容器时，它将使用 `AnimationController` 和 `GestureDetector`\
