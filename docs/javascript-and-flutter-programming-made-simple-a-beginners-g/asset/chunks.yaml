  raw: '```yaml


    name: my_app


    description: A new Flutter project


    # ...


    flutter:


    uses-material-design: true


    # Add the following line for internationalization


    dependencies:


    flutter:


    sdk: flutter


    flutter_localizations:


    sdk: flutter


    # Add the following line to specify the supported locales


    supportedLocales:


    - en


    - es


    - fr


    # Add the following line to specify the app''s default locale


    locale: en


    ```


    In this example, we add the `flutter_localizations` package as a dependency to
    our app. We also specify the supported locales (English, Spanish, and French)
    and set the default locale to English.


    ## Creating Language Files


    Next, we need to create language files for each supported language. These files
    will contain translations of the app''s text and content. The files should be
    organized in a `lib/l10n` directory.


    Example:


    ```


    my_app


    |-- lib


    |   |-- main.dart


    |   |-- l10n


    |   |   |-- app_localizations.dart


    |   |   |-- intl_en.arb


    |   |   |-- intl_es.arb


    |   |   |-- intl_fr.arb


    ```


    The `.arb` files (Application Resource Bundle) contain key-value pairs representing
    the original text and its translations.


    Example `.arb` file (intl_en.arb):


    ```json


    {


    "@@locale": "en",


    "greeting": "Hello!",


    "welcome": "Welcome to my app.",


    "button_label": "Press Me",


    "error": {


    "generic": "An error occurred.",


    "network": "Network error occurred.",


    "permission": "Permission denied."


    }


    }


    ```


    ## Generating Localization Classes


    To use the translations in our app, we need to generate localization classes from
    the `.arb` files. Flutter provides a tool called `flutter gen-l10n` to generate
    these classes.


    Run the following command in the terminal:


    ```


    flutter gen-l10n


    ```


    This will generate the `AppLocalizations` class in the `app_localizations.dart`
    file.


    Example `app_localizations.dart`:


    ```dart


    import ''package:flutter/foundation.dart'';


    import ''package:flutter/material.dart'';


    import ''package:flutter/services.dart'';


    import ''package:flutter/widgets.dart'';


    class AppLocalizations {


    AppLocalizations(this.locale);


    final Locale locale;


    static AppLocalizations of(BuildContext context) {


    return Localizations.of<AppLocalizations>(context, AppLocalizations)!;


    }


    static const LocalizationsDelegate<AppLocalizations> delegate =


    _AppLocalizationsDelegate();


    late Map<String, String> _localizedStrings;


    Future<bool> load() async {


    final jsonString =


    await rootBundle.loadString(''lib/l10n/intl_${locale.languageCode}.arb'');


    final Map<String, dynamic> jsonMap = json.decode(jsonString);


    _localizedStrings =


    jsonMap.map((key, value) => MapEntry(key, value.toString()));


    return true;


    }


    String translate(String key) {


    return _localizedStrings[key] ?? key;


    }


    // Define getters for frequently used translations


    String get greeting => translate(''greeting'');


    String get welcome => translate(''welcome'');


    String get buttonLabel => translate(''button_label'');


    String get errorGeneric => translate(''error.generic'');


    String get errorNetwork => translate(''error.network'');


    String get errorPermission => translate(''error.permission'');


    }


    class _AppLocalizationsDelegate


    extends LocalizationsDelegate<AppLocalizations> {


    const _AppLocalizationsDelegate();


    @override


    bool isSupported(Locale locale) {


    return [''en'', ''es'', ''fr''].contains(locale.languageCode);


    }


    @override


    Future<AppLocalizations> load(Locale locale) async {


    final localizations = AppLocalizations(locale);


    await localizations.load();


    return localizations;


    }


    @override


    bool shouldReload(_AppLocalizationsDelegate old) => false;


    }


    ```


    ## Implementing Localization in the App


    To use the generated localization class in our app, we need to wrap the `MaterialApp`
    with the `MaterialApp` widget and provide the `localizationsDelegates` and `supportedLocales`
    properties.


    Example:


    ```dart


    import ''package:flutter/material.dart'';


    import ''package:flutter_gen/gen_l10n/app_localizations.dart'';


    void main() {


    runApp(MyApp());


    }


    class MyApp extends StatelessWidget {


    @override


    Widget build(BuildContext context) {


    return MaterialApp(


    localizationsDelegates: AppLocalizations.delegate,


    supportedLocales: AppLocalizations.delegate.supportedLocales,


    locale: Locale(''en''), // Set the initial locale here


    home: MyHomePage(),


    );


    }


    }


    class MyHomePage extends StatelessWidget {


    @override


    Widget build(BuildContext context) {


    return Scaffold(


    appBar: AppBar(


    title: Text(AppLocalizations.of(context).greeting),


    ),


    body: Center(


    child: Text(AppLocalizations.of(context).welcome),


    ),


    );


    }


    }


    ```


    In this example, we set up the `MyApp` class with the `MaterialApp` widget and
    provide the `AppLocalizations.delegate` and `AppLocalizations.delegate.supportedLocales`
    properties. The initial locale is set to English.


    ## Changing the App Language


    To enable users to change the app''s language, we can use a `DropdownButton` or
    any other widget to select the desired language and call `setLocale` to update
    the app''s locale.


    Example:


    ```dart


    class MyApp extends StatelessWidget {


    @override


    Widget build(BuildContext context) {


    final appTitle = ''My App'';


    return MaterialApp(


    title: appTitle,


    localizationsDelegates: AppLocalizations.delegate,


    supportedLocales: AppLocalizations.delegate.supportedLocales,


    locale: Locale(''en''), // Set the initial locale here


    home: MyHomePage(),


    );


    }


    }


    class MyHomePage extends StatelessWidget {


    void _changeLanguage(BuildContext context, Locale locale) {


    AppLocalizations.delegate.load(locale).then((localizations) {


    Navigator.of(context).pushReplacement(MaterialPageRoute(


    builder: (context) => MyHomePage(),


    ));


    });


    }


    @override


    Widget build(BuildContext context) {


    final localizations = AppLocalizations.of(context


    );


    final appTitle = localizations.appTitle;


    return Scaffold(


    appBar: AppBar(


    title: Text(appTitle),


    actions: [


    IconButton(


    icon: Icon(Icons.language),


    onPressed: () {


    showDialog(


    context: context,


    builder: (context) {


    return AlertDialog(


    title: Text(''Select Language''),


    content: DropdownButton<Locale>(


    value: Localizations.localeOf(context),


    onChanged: (Locale? newLocale) {


    if (newLocale != null) {


    _changeLanguage(context, newLocale);


    }


    },


    items: AppLocalizations.delegate.supportedLocales


    .map<DropdownMenuItem<Locale>>(


    (locale) {


    return DropdownMenuItem<Locale>(


    value: locale,


    child: Text(locale.languageCode.toUpperCase()),


    );


    },


    ).toList(),


    ),


    );


    },


    );


    },


    ),


    ],


    ),


    body: Center(


    child: Text(localizations.welcome),


    ),


    );


    }


    }


    ```


    In this example, we add an `IconButton` to the `AppBar` that opens a `DropdownButton`
    dialog to select the desired language. When a new language is selected, the `_changeLanguage`
    function is called to update the app''s locale and rebuild the UI with the new
    language.


    ## Conclusion


    In this chapter, we explored internationalization and localization in Flutter.
    We learned how to set up internationalization, create language files, and generate
    localization classes. By implementing internationalization and localization, we
    can make our app accessible to users from different linguistic backgrounds and
    regions, providing a personalized and user-friendly experience.


    Using the `AppLocalizations` class, we can easily access translated content in
    our app and switch between different languages dynamically. Internationalization
    and localization are essential tools for creating global apps that cater to a
    diverse audience.


    # # Chapter 13: Deploying Flutter Apps


    In Chapter 13, we will explore the process of deploying Flutter apps to different
    platforms. Deploying an app means making it available to users on various devices
    and app stores. Flutter provides excellent tools and documentation to simplify
    the deployment process. In this chapter, we will learn how to deploy Flutter apps
    to Android, iOS, and the web with practical examples.


