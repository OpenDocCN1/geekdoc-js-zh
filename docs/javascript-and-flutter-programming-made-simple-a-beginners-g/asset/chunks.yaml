    \n在本章中，我们涵盖了 JavaScript 模块的基础知识，包括模块语法、实体的导出和导入以及模块化开发的最佳实践。我们还讨论了模块环境以及在不同场景下支持模块开发的可用工具。\n\
    \n通过采用模块化开发实践并利用 JavaScript 模块的力量，你可以创建更具维护性、可扩展性且组织良好的代码库。在下一章中，我们将深入探索 JavaScript\
    \ 中的类和面向对象编程，将我们的代码组织和重用性提升到一个新的高度。\n\n# 第 11 章：JavaScript 中的面向对象编程\n\n在本章中，我们将探索\
    \ JavaScript 中的面向对象编程 (OOP)。面向对象编程是一种强大的范式，允许我们将真实世界的实体建模为对象，在这些对象内部封装数据和行为，并在它们之间进行交互。JavaScript\
    \ 通过基于原型的继承系统支持 OOP 原则。\n\n### 11.1 面向对象编程简介\n\n面向对象编程是以“对象”为核心概念的编程范式。对象是类的实例，类充当蓝图，定义了该类对象的属性和行为。\n\
    \n面向对象编程的核心原则是：\n\n- 封装：封装允许我们将相关的数据（属性）和功能（方法）封装在对象内部，防止从外部直接访问，并通过定义的接口提供受控的访问。\n\
    - 继承：继承允许对象从其他对象继承属性和方法。它促进了代码复用以及类之间的层级关系。\n- 多态：多态允许不同类的对象被视为同一公共父类的对象。它允许根据共享的行为对对象进行灵活且可交换的使用。\n\
    \n### 11.2 在 JavaScript 中创建对象\n\n在 JavaScript 中，可以使用对象字面量（object literals）或构造函数创建对象。\n\
    \n对象字面量是一种通过直接定义属性和方法来创建对象的方便方法。这是一个示例：\n\n```javascript\nconst person = {\n \
    \ name: 'John',\n  age: 30,\n  greet() {\n    console.log(`Hello, my name is ${this.name}\
    \ and I'm ${this.age} years old.`);\n  }\n};\n\nperson.greet(); // 输出: Hello,\
    \ my name is John and I'm 30 years old.\n```\n\n构造函数提供了一种根据蓝图（类）使用 `new` 关键字创建对象的方法。这是一个示例：\n\
    \n```javascript\nfunction Person(name, age) {\n  this.name = name;\n  this.age\
    \ = age;\n}\n\nPerson.prototype.greet = function() {\n  console.log(`Hello, my\
    \ name is ${this.name} and I'm ${this.age} years old.`);\n};\n\nconst person =\
    \ new Person('John', 30);\nperson.greet(); // 输出: Hello, my name is John and I'm\
    \ 30 years old.\n```\n\n在这个示例中，我们定义了一个 `Person` 构造函数，接受 `name` 和 `age` 作为参数。我们使用\
    \ `this` 关键字将这些值赋值给对象。`greet()` 方法被添加到 `Person` 构造函数的原型上，以便在所有实例之间共享该功能。\n\n###\
    \ 11.3 JavaScript 中的继承与原型\n\nJavaScript 使用原型继承来实现对象之间的继承。每个对象都有一个名为 `[[Prototype]]`\
    \ 的内部属性，指向它的原型对象。原型用于从其他对象继承属性和方法。\n\n我们可以使用 `Object.create()` 方法或 ECMAScript\
    \ 2015 (ES6) 引入的 `class` 语法在对象之间创建继承关系。\n\n使用 `Object.create()` 的示例：\n\n```javascript\n\
    const personPrototype = {\n  greet() {\n    console.log(`Hello, my name is ${this.name}\
    \ and I'm ${this.age} years old.`);\n  }\n};\n\nconst person = Object.create(personPrototype);\n\
    person.name = 'John';\nperson.age = 30;\nperson.greet(); // 输出: Hello, my name\
    \ is John and I'm 30 years old.\n```\n\n在这个示例中，我们创建了一个 `personPrototype` 对象，作为\
    \ `person` 对象的原型。`person` 对象从 `personPrototype` 对象继承了 `greet()` 方法。\n\n或者，我们可以使用\
    \ `class` 语法来定义类并创建继承关系。这是一个示例：\n\n```javascript\nclass Person {\n  constructor(name,\
    \ age) {\n    this.name = name;\n    this.age = age;\n  }\n  greet() {\n    console.log(`Hello,\
    \ my name is ${this.name} and I'm ${this.age} years old.`);\n  }\n}\n\nclass Student\
    \ extends Person {\n  constructor(name, age, grade) {\n    super(name, age);\n\
    \    this.grade = grade;\n  }\n  study() {\n    console.log(`${this.name} is studying\
