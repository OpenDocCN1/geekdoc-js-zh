    \        child: Text('Tap Me'),\n      ),\n    );\n  }\n}\n```\n\n在这个示例中，我们创建了一个名为\
    \ `AnimatedContainerExample` 的有状态组件，它使用 `AnimatedContainer` 组件来对容器宽度、高度、颜色和对齐方式的变化制作动画。当点击容器时，`_isExpanded`\
    \ 状态会被切换，从而触发动画。\n\n### AnimationController 和 Tween\n\n对于更复杂的动画，我们可以使用 `AnimationController`\
    \ 和 `Tween` 对象来定义动画行为。\n\n示例：\n\n```dart\nclass AnimationControllerExample extends\
    \ StatefulWidget {\n  @override\n  _AnimationControllerExampleState createState()\
    \ =>\n      _AnimationControllerExampleState();\n}\n\nclass _AnimationControllerExampleState\n\
    \    extends State<AnimationControllerExample>\n    with SingleTickerProviderStateMixin\
    \ {\n  late AnimationController _controller;\n  late Animation<double> _animation;\n\
    \n  @override\n  void initState() {\n    super.initState();\n    _controller =\
