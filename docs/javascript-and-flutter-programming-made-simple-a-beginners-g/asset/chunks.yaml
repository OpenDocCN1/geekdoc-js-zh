    \n在本章中，我们学习了 Flutter 中的用户输入。现在，当你继续你的 Flutter 之之旅时，请记住要设计出具有交互性和吸引力的应用。\n\n###\
    \ 使用路由进行导航\n\nFlutter 使用路由系统在屏幕之间跳转。应用程序中的每个屏幕都由路由表示。Flutter 提供了 `Navigator` 小部件，它管理导航栈和过渡。最简单的导航形式是使用\
    \ `Navigator.push` 将新屏幕推入导航栈，并使用 `Navigator.pop` 弹出顶层屏幕并返回上一个屏幕。\n\n示例：\n\n```dart\n\
    // 屏幕 1\nNavigator.push(\n  context,\n  MaterialPageRoute(\n    builder: (context)\
