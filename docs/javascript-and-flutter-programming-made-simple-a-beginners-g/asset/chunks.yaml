    In this chapter, we have explored the basics of Dart, including data types, variables,
    functions, and control flow statements. Dart''s simplicity and flexibility make
    it an excellent language for building Flutter apps. Now that you have a solid
    understanding of Dart fundamentals, you are ready to dive deeper into Flutter
    development in the upcoming chapters.


    # # Chapter 4: Understanding Widgets and Layouts


    In Chapter 3, we explored the basics of Dart, the programming language used in
    Flutter. Now, in Chapter 4, we will dive into the core of Flutter development
    - understanding widgets and layouts. Widgets are the building blocks of Flutter
    apps, and they are responsible for creating the user interface. In this chapter,
    we will learn about different types of widgets, how to use them, and how to create
    layouts to arrange widgets on the screen.


    ## What are Widgets?


    In Flutter, everything is a widget - from simple elements like text and images
    to complex components like buttons, lists, and animations. Widgets are objects
    that define the structure and behavior of the user interface. They are lightweight
    and can be combined to create reusable and customizable components.


    ### Stateless vs. Stateful Widgets


    Flutter has two main types of widgets - stateless and stateful.


    #### Stateless Widgets


    Stateless widgets are immutable, meaning their properties cannot change once they
    are initialized. They are used for presenting data that does not change over time.
    Stateless widgets are simple, fast, and can be efficiently redrawn when needed.
    To create a stateless widget, extend the `StatelessWidget` class and override
    the `build` method.


    ```dart


    class MyStatelessWidget extends StatelessWidget {


    @override


    Widget build(BuildContext context) {


    return Container(


    child: Text("Hello, I am a stateless widget."),


    );


    }


    }


    ```


    #### Stateful Widgets


    Stateful widgets, on the other hand, can change their properties during the lifetime
    of the app. They are used for displaying data that can change or responding to
    user interactions. To create a stateful widget, extend the `StatefulWidget` class
    and create a separate `State` class that holds the mutable state.


    ```dart


    class MyStatefulWidget extends StatefulWidget {


    @override


    _MyStatefulWidgetState createState() => _MyStatefulWidgetState();


    }


    class _MyStatefulWidgetState extends State<MyStatefulWidget> {


    int count = 0;


    void incrementCounter() {


    setState(() {


    count++;


    });


    }


    @override


    Widget build(BuildContext context) {


    return Container(


    child: Column(


    children: [


    Text("Count: $count"),


    ElevatedButton(


    onPressed: incrementCounter,


    child: Text("Increment"),


    ),


    ],


    ),


    );


    }


    }


    ```


    ## Basic Widgets


    Flutter provides a rich set of built-in widgets for various purposes. Let''s explore
    some of the basic widgets and how to use them.


    ### Text Widget


    The `Text` widget is used to display simple text on the screen. You can customize
    the text style, alignment, and other properties.


    ```dart


    Text(


    "Hello, Flutter!",


    style: TextStyle(


    fontSize: 24,


    fontWeight: FontWeight.bold,


    color: Colors.blue,


    ),


    )


    ```


    ### Container Widget


    The `Container` widget is a versatile widget that allows you to customize its
    child''s size, padding, margin, and decoration.


    ```dart


    Container(


    width: 200,


    height: 100,


    color: Colors.green,


    child: Center(


    child: Text("Centered Text"),


    ),


    )


    ```


    ### Row and Column Widgets


    The `Row` and `Column` widgets are used to arrange children in a horizontal or
    vertical line, respectively.


    ```dart


    Row(


    children: [


    Icon(Icons.star),


    Icon(Icons.star),


    Icon(Icons.star),


    ],


    )


    ```


    ```dart


    Column(


    children: [


    Text("Item 1"),


    Text("Item 2"),


    Text("Item 3"),


    ],


    )


    ```


    ### Image Widget


    The `Image` widget is used to display images from various sources, such as the
    local assets, the network, or memory.


    ```dart


    Image.network("https://example.com/image.jpg")


    ```


    ### RaisedButton and FlatButton Widgets


    The `RaisedButton` and `FlatButton` widgets are used to create clickable buttons
    with different styles.


    ```dart


    RaisedButton(


    onPressed: () => print("Button pressed"),


    child: Text("Click Me"),


    )


    ```


    ### TextField Widget


    The `TextField` widget is used to capture user input as text.


    ```dart


    TextField(


    onChanged: (value) => print("User typed: $value"),


    decoration: InputDecoration(


    hintText: "Enter your name",


    ),


    )


    ```


    ## Layouts


    Flutter provides various layout widgets to arrange and align widgets on the screen.
    Some of the commonly used layout widgets are:


    ### Container Widget


    As we saw earlier, the `Container` widget can be used to define the size, padding,
    margin, and decoration of its child widget.


    ### Row and Column Widgets


    `Row` and `Column` widgets are used to arrange children in horizontal or vertical
    order. You can use `mainAxisAlignment` and `crossAxisAlignment` properties to
    control the alignment of children.


    ```dart


    Row(


    mainAxisAlignment: MainAxisAlignment.spaceEvenly,


    crossAxisAlignment: CrossAxisAlignment.center,


    children: [


    // Children widgets go here


    ],


    )


    ```


    ### Stack Widget


    The `Stack` widget allows you to stack widgets on top of each other. You can use
    `Positioned` widgets to control the position of the children within the stack.


    ```dart


    Stack(


    children: [


    Positioned(


    left: 50,


    top: 100,


    child: Text("Hello"),


    ),


    Positioned(


    right: 50,


    top: 100,


    child: Text("World"),


    ),


    ],


    )


    ```


    ### ListView Widget


    The `ListView` widget is used to create scrollable lists. It can have a finite
    number of children or generate children dynamically using a `ListView.builder`.


    ```dart


    ListView(


    children: [


    ListTile(title: Text("Item 1")),


    ListTile(title: Text("Item 2")),


    ListTile(title: Text("Item 3")),


    ],


    )


    ```


    ```dart


    ListView.builder(


    itemCount: items.length,


    itemBuilder: (context, index) {


    return ListTile(title: Text(items[index]));


    },


    )


    ```


