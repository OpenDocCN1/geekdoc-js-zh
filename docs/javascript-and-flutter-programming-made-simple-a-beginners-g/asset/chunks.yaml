    # # Chapter 11: Building Custom Widgets


    In Chapter 10, we explored animations and gestures to add interactivity and engagement
    to our apps. Now, in Chapter 11, we will dive into building custom widgets in
    Flutter. Custom widgets allow us to encapsulate and reuse UI components, making
    our codebase more maintainable and organized. In this chapter, we will learn how
    to create custom widgets from scratch, along with practical examples to understand
    their implementation.


    ## Why Build Custom Widgets?


    Flutter provides a rich set of built-in widgets, but sometimes our app''s UI requirements
    go beyond the built-in offerings. Building custom widgets enables us to create
    specialized components that perfectly fit our app''s design and functionality.
    Custom widgets also promote code reuse, as we can use them multiple times throughout
    our app.


    ## Creating a Stateless Custom Widget


    A stateless custom widget is a widget that doesn''t maintain any internal state
    and is immutable. It is ideal for widgets with fixed content that doesn''t change
    over time.


    Example:


    ```dart


    import ''package:flutter/material.dart'';


    class MyCustomButton extends StatelessWidget {


    final String label;


    final VoidCallback onPressed;


    MyCustomButton({required this.label, required this.onPressed});


    @override


    Widget build(BuildContext context) {


    return ElevatedButton(


    onPressed: onPressed,


    child: Text(label),


    );


    }


    }


    ```


    In this example, we create a custom stateless widget called `MyCustomButton`.
    It takes two parameters, `label` and `onPressed`, to customize the button''s text
    and behavior. The widget uses the built-in `ElevatedButton` to render the button.


    ## Creating a Stateful Custom Widget


    A stateful custom widget is a widget that can maintain internal state and is mutable.
    It is suitable for widgets that need to change their content or appearance over
    time.


    Example:


    ```dart


    import ''package:flutter/material.dart'';


    class MyCounter extends StatefulWidget {


    @override


    _MyCounterState createState() => _MyCounterState();


    }


    class _MyCounterState extends State<MyCounter> {


    int _count = 0;


    void _incrementCounter() {


    setState(() {


    _count++;


    });


    }


    @override


    Widget build(BuildContext context) {


    return Column(


    children: [


    Text(''Count: $_count''),


    ElevatedButton(


    onPressed: _incrementCounter,


    child: Text(''Increment''),


    ),


    ],


    );


    }


    }


    ```


    In this example, we create a custom stateful widget called `MyCounter`. It maintains
    an internal `_count` variable and updates it when the button is pressed using
    the `setState` method. The widget displays the current count and a button to increment
    it.


    ## Combining Widgets to Create Complex Custom Widgets


    Custom widgets can be composed of other built-in or custom widgets, enabling us
    to create more complex and specialized UI components.


    Example:


    ```dart


    import ''package:flutter/material.dart'';


    class MyCustomCard extends StatelessWidget {


    final String title;


    final String content;


    MyCustomCard({required this.title, required this.content});


    @override


    Widget build(BuildContext context) {


    return Card(


    child: Column(


    children: [


    ListTile(


    title: Text(title),


    ),


    Divider(),


    Padding(


    padding: EdgeInsets.all(16.0),


    child: Text(content),


    ),


    ],


    ),


    );


    }


    }


    ```


    In this example, we create a custom widget called `MyCustomCard`, which is a simple
    card that displays a title and content. It uses a `Card` widget as the base and
    composes it with a `Column`, `ListTile`, `Divider`, and `Padding`.


    ## Customizing Widgets with Properties


    Custom widgets can accept properties (also known as props or parameters) to customize
    their appearance and behavior.


    Example:


    ```dart


    import ''package:flutter/material.dart'';


    class MyCustomButton extends StatelessWidget {


    final String label;


    final VoidCallback onPressed;


    final Color? color;


    MyCustomButton({


    required this.label,


    required this.onPressed,


    this.color,


    });


    @override


    Widget build(BuildContext context) {


    return ElevatedButton(


    onPressed: onPressed,


    child: Text(label),


    style: ElevatedButton.styleFrom(


    primary: color,


    ),


    );


    }


    }


    ```


    In this example, we enhance our `MyCustomButton` widget to accept an optional
    `color` parameter. The button''s background color is now customizable, and if
    no color is provided, it will use the default color defined by `ElevatedButton`.


    ## Using Widget Composition and Inheritance


    Widget composition allows us to create more complex custom widgets by combining
    multiple widgets together. On the other hand, widget inheritance allows us to
    extend existing widgets to add or override functionality.


    Example:


    ```dart


    import ''package:flutter/material.dart'';


    class MyCustomButton extends StatelessWidget {


    final String label;


    final VoidCallback onPressed;


    MyCustomButton({required this.label, required this.onPressed});


    @override


    Widget build(BuildContext context) {


    return ElevatedButton(


    onPressed: onPressed,


    child: Text(label),


    );


    }


    }


    class MyColoredButton extends MyCustomButton {


    final Color color;


    MyColoredButton({required String label, required VoidCallback onPressed, required
    this.color})


    : super(label: label, onPressed: onPressed);


    @override


    Widget build(BuildContext context) {


    return ElevatedButton(


    onPressed: onPressed,


    child: Text(label),


    style: ElevatedButton.styleFrom(


    primary: color,


    ),


    );


    }


    }


    ```


    In this example, we create a custom widget called `MyColoredButton`, which extends
    `MyCustomButton`. We add a new property `color` to customize the button''s background
    color. By overriding the `build` method, we customize the appearance of the button
    to apply the provided color.


    ## Conclusion


    In this chapter, we explored building custom widgets in Flutter. Custom widgets
    allow us to create specialized and reusable components, promoting code organization
    and maintainability. We learned how to create stateless and stateful custom widgets,
    customize them with properties, and compose widgets to build more complex UI elements.


    With custom widgets, we can design unique and responsive user interfaces that
    perfectly fit our app''s needs. By using widget composition and inheritance, we
    can extend and enhance existing widgets, reducing code duplication and promoting
    code reuse.


    # # Chapter 12: Internationalization and Localization


    In Chapter 12, we will explore internationalization and localization in Flutter.
    Internationalization is the process of adapting an app to support multiple languages
    and regions, while localization is the process of translating the app''s content
    into different languages. Flutter provides excellent support for internationalization
    and localization, allowing us to create apps that can reach a global audience.
    In this chapter, we will learn how to implement internationalization and localization
    in Flutter with practical examples.


    ## Why Internationalization and Localization?


    Internationalization and localization are essential for reaching a wider audience
    and providing a personalized user experience for users from different linguistic
    backgrounds and regions. By making our app accessible in multiple languages, we
    can increase user engagement, satisfaction, and retention. Users are more likely
    to use an app that speaks their language and respects their cultural norms.


    ## Setting Up Internationalization


    To start internationalizing our app, we need to make some modifications to the
    `pubspec.yaml` file.


