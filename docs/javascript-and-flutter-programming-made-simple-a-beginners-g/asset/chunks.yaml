    up-to-date content for your users.


    # # Chapter 9: Storing Data with Local Persistence


    In Chapter 8, we explored working with APIs and networking to interact with remote
    servers and retrieve data. However, sometimes we need to store data locally on
    the device, even when the app is closed or restarted. In this chapter, we will
    delve into local data persistence in Flutter. We will learn about different methods
    of storing data locally, such as using shared preferences, files, and databases,
    along with practical examples to understand their implementation.


    ## Why Local Data Persistence?


    Local data persistence is crucial for apps that need to save user preferences,
    cached data, or other information that should persist across app sessions. Storing
    data locally also enables the app to function offline or in scenarios where an
    internet connection is not available.


    ## Shared Preferences


    Shared preferences are a simple way to store key-value pairs on the device. They
    are commonly used for storing user settings, such as language preferences or app
    theme.


    ### Storing Data with Shared Preferences


    To use shared preferences, we first need to add the `shared_preferences` package
    to our `pubspec.yaml` file and run `flutter pub get`.


    Example:


    ```dart


    import ''package:shared_preferences/shared_preferences.dart'';


    void savePreferences() async {


    final prefs = await SharedPreferences.getInstance();


    await prefs.setString(''username'', ''JohnDoe'');


    await prefs.setInt(''age'', 30);


    }


    void readPreferences() async {


    final prefs = await SharedPreferences.getInstance();


    final username = prefs.getString(''username'') ?? '''';


    final age = prefs.getInt(''age'') ?? 0;


    print(''Username: $username'');


    print(''Age: $age'');


    }


    ```


    In this example, we use `SharedPreferences.getInstance()` to obtain the shared
    preferences instance. We then use the `setString` and `setInt` methods to store
    data and the `getString` and `getInt` methods to read the data.


    ## File Storage


    File storage allows us to read and write data to files on the device. It is suitable
    for storing structured data or larger amounts of data.


    ### Writing Data to Files


    Example:


    ```dart


    import ''dart:io'';


    void writeToFile() async {


    final file = File(''data.txt'');


    await file.writeAsString(''Hello, world!'');


    }


    ```


    In this example, we use the `File` class to represent the file and the `writeAsString`
    method to write data to the file.


    ### Reading Data from Files


    Example:


    ```dart


    import ''dart:io'';


    void readFromFile() async {


    final file = File(''data.txt'');


    final content = await file.readAsString();


    print(''File content: $content'');


    }


    ```


    In this example, we use the `readAsString` method to read the content of the file.


    ## SQLite Database


    SQLite is a lightweight, serverless database engine that allows us to create,
    read, update, and delete data using SQL queries. It is suitable for more complex
    data structures and larger datasets.


    ### Working with SQLite


    To use SQLite in Flutter, we need to add the `sqflite` package to our `pubspec.yaml`
    file and run `flutter pub get`.


    Example:


    ```dart


    import ''package:sqflite/sqflite.dart'';


    import ''package:path/path.dart'';


    void initializeDatabase() async {


    final databasePath = await getDatabasesPath();


    final path = join(databasePath, ''my_database.db'');


    final database = await openDatabase(path, version: 1,


    onCreate: (db, version) {


    db.execute(''CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT)'');


    });


    // Insert data


    await database.insert(''users'', {''name'': ''John Doe''});


    // Query data


    final users = await database.query(''users'');


    // Print the result


    for (final user in users) {


    print(''User ID: ${user[''id'']}, Name: ${user[''name'']}'');


    }


    }


    ```


    In this example, we use the `sqflite` package to create and interact with an SQLite
    database. We define a database table using SQL in the `onCreate` callback and
    insert and query data from the table.


    ## Hive Database


    Hive is a lightweight and fast NoSQL database designed for Flutter. It offers
    excellent performance and is well-suited for storing structured data.


    ### Working with Hive


    To use Hive in Flutter, we need to add the `hive` and `hive_flutter` packages
    to our `pubspec.yaml` file and run `flutter pub get`.


    Example:


    ```dart


    import ''package:hive/hive.dart'';


    import ''package:hive_flutter/hive_flutter.dart'';


    void initializeHive() async {


    await Hive.initFlutter();


    // Define the Hive box


    Hive.registerAdapter(UserAdapter());


    final box = await Hive.openBox(''users'');


    // Insert data


    final user = User(id: 1, name: ''John Doe'');


    await box.put(1, user);


    // Read data


    final retrievedUser = box.get(1) as User;


    print(''User ID: ${retrievedUser.id}, Name: ${retrievedUser.name}'');


    }


    class User {


    final int id;


    final String name;


    User({required this.id, required this.name});


    }


    class UserAdapter extends TypeAdapter<User> {


    @override


    final typeId = 0;


    @override


    User read(BinaryReader reader) {


    return User(id: reader.readInt(), name: reader.readString());


    }


    @override


    void write(BinaryWriter writer, User obj) {


    writer.writeInt(obj.id);


    writer.writeString(obj.name);


    }


    }


    ```


    In this example, we use the `hive` and `hive_flutter` packages to create and interact
    with a Hive box. We define a custom `User` class and use a `TypeAdapter` to serialize
    and deserialize `User` objects.


