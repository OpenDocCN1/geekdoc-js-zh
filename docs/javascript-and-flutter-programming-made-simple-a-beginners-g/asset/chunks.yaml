    \ x = x + y; (x is now 7)\ny -= 1; // Equivalent to y = y - 1; (y is now 1)\n\
    ```\n\n## 2.2.3 Comparison Operators\n\nComparison operators are used to compare\
    \ values and return a Boolean result (`true` or `false`). They are commonly used\
    \ in conditional statements and loops. Here are some of the comparison operators\
    \ in JavaScript:\n\n- `==`: Checks if two values are equal.\n- `!=`: Checks if\
    \ two values are not equal.\n- `>`: Checks if the value on the left is greater\
    \ than the value on the right.\n- `<`: Checks if the value on the left is less\
    \ than the value on the right.\n- `>=`: Checks if the value on the left is greater\
    \ than or equal to the value on the right.\n- `<=`: Checks if the value on the\
    \ left is less than or equal to the value on the right.\n- `===`: Checks if two\
    \ values are strictly equal (both value and type).\n\nHere's an example demonstrating\
    \ the use of comparison operators:\n\n```javascript\nvar x = 5;\nvar y = 2;\n\
    console.log(x == y);    // false\nconsole.log(x > y);      // true\nconsole.log(x\
    \ <= 5);    // true\nconsole.log(x === \"5\"); // false\n```\n\n## 2.3 JavaScript\
    \ Expressions\n\nExpressions are combinations of values, variables, and operators\
    \ that produce a result. They can be as simple as a single value or as complex\
    \ as a combination of multiple operators and variables. Understanding expressions\
    \ is essential for writing dynamic and interactive JavaScript code.\n\n### 2.3.1\
    \ Arithmetic Expressions\n\nArithmetic expressions involve mathematical calculations\
    \ using arithmetic operators. Here's an example of an arithmetic expression:\n\
    \n```javascript\nvar x = 5;\nvar y = 2;\nvar result = (x + y) * 3;\nconsole.log(result);\
    \ // 21\n```\n\nIn this example, the expression `(x + y) * 3` performs addition\
    \ and multiplication to produce the result `21`.\n\n### 2.3.2 String Concatenation\n\
    \nIn JavaScript, the `+` operator is also used for string concatenation. It allows\
    \ you to combine two or more strings into a single string. Here's an example:\n\
    \n```javascript\nvar firstName = \"John\";\nvar lastName = \"Doe\";\nvar fullName\
    \ = firstName + \" \" + lastName;\nconsole.log(fullName); // \"John Doe\"\n```\n\
    \nIn this case, the `+` operator allows us to combine strings.\n\n### 2.3.3 Logical\
    \ Expressions\n\nLogical expressions involve operators like `&&`, `||`, and `!`.\
    \ They are used to determine the truth value of complex expressions. Here's an\
    \ example:\n\n```javascript\nvar x = true;\nvar y = false;\nvar result = x &&\
    \ y;\nconsole.log(result); // false\n```\n\nIn this example, the expression `x\
    \ && y` evaluates whether both operands are true, resulting in `false`.\n\n##\
    \ 2.4 Conclusion\n\nIn this chapter, we learned about assignment operators, comparison\
    \ operators, and expressions. We also explored arithmetic expressions, string\
    \ concatenation, and logical expressions. Understanding these foundational concepts\
    \ is crucial for writing effective JavaScript.\n\n# Chapter 3: JavaScript Control\
    \ Flow\n\nIn Chapter 2, we learned about syntax, operators, and expressions. Now,\
    \ let's explore control flow statements to make decisions.\n\n## 3.1 Conditional\
    \ Statements\n\nConditional statements are used to execute different blocks of\
    \ code based on conditions. JavaScript provides several conditional statements,\
    \ including the `if` statement, the `if...else` statement, and the `switch` statement.\n\
    \n### 3.1.1 The if Statement\n\nThe `if` statement is the simplest conditional\
    \ statement. It executes a block of code if a given condition is `true`. Here's\
    \ the basic syntax of an `if` statement:\n\n```javascript\nif (condition) {\n\
    \  // code to be executed if the condition is true\n}\n```\n\nLet's see an example:\n\
    \n```javascript\nvar age = 18;\nif (age >= 18) {\n  console.log(\"You are eligible\
    \ to vote.\");\n}\n```\n\nIn this example, if the `age` variable is greater than\
    \ or equal to `18`, the message \"You are eligible to vote.\" will be displayed.\n\
    \n### 3.1.2 The if...else Statement\n\nThe `if...else` statement allows us to\
    \ execute one block of code if a condition is `true` and another block of code\
    \ if the condition is `false`. Here's the syntax:\n\n```javascript\nif (condition)\
    \ {\n  // code to be executed if the condition is true\n} else {\n  // code to\
    \ be executed if the condition is false\n}\n```\n\nLet's modify our previous example\
    \ to include an `if...else` statement:\n\n```javascript\nvar age = 16;\nif (age\
    \ >= 18) {\n  console.log(\"You are eligible to vote.\");\n} else {\n  console.log(\"\
    You are not eligible to vote yet.\");\n}\n```\n\nIn this case, if the `age` variable\
    \ is less than `18`, the message \"You are not eligible to vote yet.\" will be\
    \ displayed.\n\n### 3.1.3 The switch Statement\n\nThe `switch` statement is used\
    \ to perform different actions based on different conditions. It evaluates an\
    \ expression and executes the corresponding case that matches the value of the\
    \ expression. Here's the syntax:\n\n```javascript\nswitch (expression) {\n  case\
    \ value1:\n    // code to be executed if the expression matches value1\n    break;\n\
    \  case value2:\n    // code to be executed if the expression matches value2\n\
    \    break;\n  default:\n    // code to be executed if the expression doesn't\
    \ match any case\n    break;\n}\n```\n"
