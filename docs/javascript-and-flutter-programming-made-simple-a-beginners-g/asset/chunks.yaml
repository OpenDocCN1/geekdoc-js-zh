    \ `Person` 类的 `Student` 类。`Student` 类有自己的构造函数，该函数通过调用 `super()` 方法来执行父类的构造函数。它还有一个专门针对学生的\
    \ `study()` 方法。\n\n通过利用继承，我们可以创建一个对象的层级结构，这些对象共享共同的属性行为，同时也可以根据特定目的对其进行扩展和定制。\n\
    \n### 11.4 JavaScript 中的多态\n\n多态允许不同类的对象被视为同一公共父类的对象。在 JavaScript 中，可以通过在不同的类中定义相同名称的方法来实现多态。\n\
    \n这是一个示例：\n\n```javascript\nclass Shape {\n  constructor() {\n    this.name =\
    \ 'Shape';\n  }\n  draw() {\n    console.log('Drawing a shape.');\n  }\n}\n\n\
    class Circle extends Shape {\n  constructor() {\n    super();\n    this.name =\
    \ 'Circle';\n  }\n  draw() {\n    console.log('Drawing a circle.');\n  }\n}\n\n\
    class Square extends Shape {\n  constructor() {\n    super();\n    this.name =\
    \ 'Square';\n  }\n  draw() {\n    console.log('Drawing a square.');\n  }\n}\n\n\
    const shape = new Shape();\nconst circle = new Circle();\nconst square = new Square();\n\
    \nshape.draw(); // Output: Drawing a shape.\ncircle.draw(); // Output: Drawing\
    \ a circle.\nsquare.draw(); // Output: Drawing a square.\n```\n\n在这个示例中，我们定义了一个带有\
    \ `draw()` 方法的 `Shape` 类。然后我们创建了 `Circle` 和 `Square` 类，它们继承自 `Shape` 类并用它们自己的实现覆盖了\
    \ `draw()` 方法。尽管调用了相同的方法名，每个对象根据其特定的类表现出不同的行为。\n\n多态允许我们编写可以与不同类对象互换运行的代码，提高了灵活性和扩展性。\n\
    \n### 11.5 总结\n\nJavaScript 中的面向对象编程通过利用对象、封装、继承和多态，为构建和组织代码提供了一种强大的方法。通过理解 OOP\
    \ 的原则和技术，我们可以创建更模块化、可重用且易维护的 JavaScript 应用。\n\n在本章中，我们探索了 JavaScript 面向对象编程的基础，包括创建对象、继承和多态。我们还讨论了如何使用构造函数和\
    \ ES6 引入的 `class` 语法。\n\n在下一章中，我们将深入 JavaScript 编程的另一个核心方面：错误处理和调试技术。理解如何处理错误和有效地调试代码将极大地提升我们的开发流程，并帮助我们构建健壮的\
    \ JavaScript 应用。\n\n# 第 12 章：JavaScript 中的错误处理与调试\n\n在本章中，我们将探索 JavaScript 中的错误处理和调试技术。作为开发者，遇到错误和\
    \ bug 是开发过程中的常见部分。能够有效地处理错误并调试代码对于构建健壮可靠的 JavaScript 应用至关重要。\n\n### 12.1 理解 JavaScript\
    \ 中的错误\n\nJavaScript 中的错误可能由于多种原因引起，例如语法错误、逻辑错误或运行时异常。当代码在执行过程中发生错误时，它可能会中断正常流程并可能导致应用程序崩溃。\n\
    \nJavaScript 提供了内置错误对象，如 `SyntaxError`、`TypeError` 和 `ReferenceError` 来表示不同类型的错误。这些错误对象包含了有用信息。\n\
    \n### 12.2 使用 try...catch 处理错误\n\n`try...catch` 语句用于封装可能抛错误的代码。如果 `try` 块内部发生错误，将执行\
    \ `catch` 块。这是一个示例：\n\n```javascript\ntry {\n  const result = someFunction();\n\
    } catch (error) {\n  console.log('发生错误:', error.message);\n}\n```\n\n### 12.3\
    \ 抛出自定义错误\n\n除了内置错误对象，JavaScript 还允许我们使用 `throw` 创建自定义错误。这是一个抛出错误的示例：\n\n```javascript\n\
    function divide(a, b) {\n  if (b === 0) {\n    throw new Error('不允许除零');\n  }\n\
    \  return a / b;\n}\n\ntry {\n  const result = divide(10, 0);\n  console.log(result);\n\
    } catch (error) {\n  console.log('发生错误:', error.message);\n}\n```\n\n### 12.4\
    \ 调试技术\n\n调试是识别并修复代码中 bug 的过程。JavaScript 提供了多种工具和技术：\n\n- **console.log**: 在代码的策略位置放置\
    \ `console.log` 语句允许我们向控制台输出值或消息。\n- **断点**: 现代浏览器提供了内置调试器的开发者工具。通过在特定代码行设置断点，我们可以暂停执行并检查变量状态。\n\
    - **调试工具**: 开发者工具还提供了一系列调试功能，如检查调用堆栈、监控网络请求、分析内存使用和性能剖析。\n- **错误信息**: 注意控制台中显示的错误信息可以为错误原因提供价值的见解。\n\
    - **代码审查**: 请求同事或同行审查我们的代码可以提供新的视角并识别潜在问题。\n- **小鸭子调试**: 向无生命物体解释我们的代码和正尝试解决的问题有助于发现逻辑错误。\n\
    \n### 12.5 处理异步错误\n\nJavaScript 经常涉及异步操作，例如发起网络请求或从数据库访问数据。处理异步代码中的错误需要不同的方法。一种常见方法是使用\
    \ Promise 和 `catch` 方法处理错误：\n\n```javascript\nasync function fetchData() {\n \
    \ try {\n    const response = await fetch('https://api.example.com/data');\n \
    \   const data = await response.json();\n    // 处理数据\n  } catch (error) {\n  \
    \  console.log('发生错误:', error.message);\n  }\n}\n\nfetchData();\n```\n\n"
