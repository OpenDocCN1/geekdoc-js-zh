- fmt: "\nIn this chapter, we explored different methods of local data persistence\
    \ in Flutter. We learned about `shared preferences` for storing simple key-value\
    \ pairs, `file storage` for reading and writing data to files, and `SQLite` and\
    \ `Hive` databases for more complex data structures and larger datasets.\n\nLocal\
    \ data persistence is vital for creating apps that can store and retrieve data\
    \ on the device, providing a seamless experience for users, even in offline scenarios.\
    \ By effectively implementing local data persistence, you can enhance your app's\
    \ functionality and improve user satisfaction.\n\n# Chapter 10: Animations and\
    \ Gestures\n\nIn Chapter 10, we will explore two essential aspects of app development\
    \ in Flutter - animations and gestures. Animations add life and interactivity\
    \ to our apps, while gestures allow users to interact with the app through touch.\
    \ We will learn how to create smooth animations and handle various gestures using\
    \ Flutter widgets and controllers, along with practical examples to understand\
    \ their implementation.\n\n## Animations\n\nAnimations are an essential part of\
    \ creating engaging and delightful user experiences in apps. Flutter provides\
    \ a rich set of animation widgets and controllers to create smooth and fluid animations.\n\
    \n### AnimatedContainer\n\nThe `AnimatedContainer` widget is a straightforward\
    \ way to animate changes to a container's properties, such as size, color, or\
    \ alignment.\n\nExample:\n\n```dart\nclass AnimatedContainerExample extends StatefulWidget\
    \ {\n  @override\n  _AnimatedContainerExampleState createState() =>\n      _AnimatedContainerExampleState();\n\
    }\n\nclass _AnimatedContainerExampleState extends State<AnimatedContainerExample>\
    \ {\n  bool _isExpanded = false;\n\n  @override\n  Widget build(BuildContext context)\
    \ {\n    return GestureDetector(\n      onTap: () {\n        setState(() {\n \
    \         _isExpanded = !_isExpanded;\n        });\n      },\n      child: AnimatedContainer(\n\
    \        duration: Duration(milliseconds: 500),\n        width: _isExpanded ?\
    \ 200 : 100,\n        height: _isExpanded ? 200 : 100,\n        color: _isExpanded\
    \ ? Colors.blue : Colors.red,\n        alignment:\n            _isExpanded ? Alignment.center\
    \ : AlignmentDirectional.topCenter,\n        child: Text('Tap Me'),\n      ),\n\
    \    );\n  }\n}\n```\n\nIn this example, we create a stateful widget called `AnimatedContainerExample`\
    \ that uses the `AnimatedContainer` widget to animate changes to the container's\
    \ width, height, color, and alignment. When the container is tapped, the `_isExpanded`\
    \ state is toggled, triggering the animation.\n\n### AnimationController and Tween\n\
    \nFor more complex animations, we can use `AnimationController` and `Tween` objects\
    \ to define the animation behavior.\n\nExample:\n\n```dart\nclass AnimationControllerExample\
    \ extends StatefulWidget {\n  @override\n  _AnimationControllerExampleState createState()\
    \ =>\n      _AnimationControllerExampleState();\n}\n\nclass _AnimationControllerExampleState\n\
    \    extends State<AnimationControllerExample>\n    with SingleTickerProviderStateMixin\
    \ {\n  late AnimationController _controller;\n  late Animation<double> _animation;\n\
    \n  @override\n  void initState() {\n    super.initState();\n    _controller =\
    \ AnimationController(\n      duration: Duration(seconds: 2),\n      vsync: this,\n\
    \    );\n    final animation = CurvedAnimation(\n      parent: _controller,\n\
    \      curve: Curves.easeInOut,\n    );\n    _animation = Tween<double>(begin:\
    \ 0, end: 1).animate(animation);\n  }\n\n  @override\n  Widget build(BuildContext\
    \ context) {\n    return GestureDetector(\n      onTap: () {\n        if (_controller.isCompleted)\
    \ {\n          _controller.reverse();\n        } else {\n          _controller.forward();\n\
    \        }\n      },\n      child: Center(\n        child: ScaleTransition(\n\
    \          scale: _animation,\n          child: Container(\n            width:\
    \ 100,\n            height: 100,\n            color: Colors.blue,\n          ),\n\
    \        ),\n      ),\n    );\n  }\n\n  @override\n  void dispose() {\n    _controller.dispose();\n\
    \    super.dispose();\n  }\n}\n```\n\nIn this example, we create a stateful widget\
    \ called `AnimationControllerExample` that uses `AnimationController` and `Tween`\
    \ to create a scale animation. When the container is tapped, the animation is\
    \ played in forward or reverse direction based on the current state of the animation.\n\
    \n## Gestures\n\nGestures are user interactions with the app, such as tapping,\
    \ swiping, dragging, or pinching. Flutter provides gesture detection widgets to\
    \ handle various types of user gestures.\n\n### GestureDetector\n\nThe `GestureDetector`\
    \ widget can detect various types of gestures and respond to them.\n\nExample:\n\
    \n```dart\nclass GestureDetectorExample extends StatelessWidget {\n  @override\n\
    \  Widget build(BuildContext context) {\n    return GestureDetector(\n      onTap:\
