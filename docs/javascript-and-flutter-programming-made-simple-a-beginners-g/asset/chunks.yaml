    \        ),\n      ),\n    );\n  }\n\n  @override\n  void dispose() {\n    _controller.dispose();\n\
    \    super.dispose();\n  }\n}\n```\n\n在这个示例中，我们创建了一个名为 `AnimationControllerExample`\
    \ 的有状态组件，使用 `AnimationController` 和 `Tween` 来创建一个缩放动画。当点击容器时，动画将根据动画的当前状态正向或反向播放。\n\
    \n## 手势\n\n手势是用户与应用的交互方式，例如点击、滑动、拖拽或缩放。Flutter 提供了手势检测组件来处理各种类型的用户手势。\n\n### GestureDetector\n\
    \n`GestureDetector` 组件可以检测各种类型的手势并对其做出响应。\n\n示例：\n\n```dart\nclass GestureDetectorExample\
    \ extends StatelessWidget {\n  @override\n  Widget build(BuildContext context)\
    \ {\n    return GestureDetector(\n      onTap: () {\n        print('Tapped');\n\
    \      },\n      onDoubleTap: () {\n        print('Double Tapped');\n      },\n\
    \      onLongPress: () {\n        print('Long Pressed');\n      },\n      onPanUpdate:\
    \ (details) {\n        print('Pan Update: ${details.globalPosition}');\n     \
