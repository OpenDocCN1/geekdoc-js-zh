    \ 谨慎使用默认导出：默认导出在某些情况下很有用，但应该节节使用。使用命名导出（named exports）可以更容易理解从模块导入了什么内容。\n- 最小化模块依赖：避免创建对其他模块有过度依赖的模块。这可以减少循环依赖的风险，并简化重构或移除模块的过程。\n\
