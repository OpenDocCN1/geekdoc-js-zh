  trans: "\n在本章中，我们探索了 Flutter 中本地数据持久化的不同方法。我们学习了用于存储简单键值对的 `shared preferences`，用于向文件读写句的\
    \ `file storage`，以及用于处理更复杂的数据结构和更大数据集的 `SQLite` 和 `Hive` 数据库。\n\n本地数据持久化对于创建可以在设备上存储和检索数据的应用至关重要，即使在离线场景下也能为用户提供无缝体验。通过有效实现本地数据持久化，你可以增强应用的功能并提高用户满意度。\n\
    \n# 第 10 章：动画与手势\n\n在第 10 章中，我们将探索 Flutter 开发中两个核心方面——动画和手势。动画为我们的应用增加了生命力和交互性，而手势允许用户通过触摸与应用进行交互。我们将学习如何使用\
    \ Flutter 组件和控制器来创建平滑的动画并处理各种手势，并结合实际示例来理解它们的实现。\n\n## 动画\n\n动画是创建应用中引人注目且愉悦的用户体验的重要部分。Flutter\
    \ 提供了一系列丰富的动画组件和控制器，用于创建平滑且流畅的动画。\n\n### AnimatedContainer\n\n`AnimatedContainer`\
    \ 组件是实现容器属性（如尺寸、颜色或对齐方式）变化变化的简单方法。\n\n示例：\n\n```dart\nclass AnimatedContainerExample\
    \ extends StatefulWidget {\n  @override\n  _AnimatedContainerExampleState createState()\
