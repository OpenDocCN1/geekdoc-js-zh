    ### Debugging with Breakpoints


    Breakpoints are markers in our code that pause the app''s execution when reached,
    allowing us to inspect the app''s state and variables at that point.


    Example:


    ```dart


    void main() {


    print(''App started''); // Add breakpoint here


    runApp(MyApp());


    }


    ```


    In this example, we add a breakpoint at the `print` statement. When the app is
    run in debugging mode, it will pause at this breakpoint, and we can inspect the
    app''s state and variables.


    ### Debugging with Flutter Inspector


    The Flutter Inspector is a tool integrated into Android Studio and Visual Studio
    Code that allows us to inspect and visualize the app''s widget tree.


    To use Flutter Inspector, follow these steps:


    1\. Open your Flutter project in Android Studio or Visual Studio Code.


    2\. Start your app in debugging mode.


    3\. In the IDE, click on the "Flutter Inspector" icon or press `Alt + Shift +
    V` (Visual Studio Code) or `Ctrl + Alt + Shift + I` (Android Studio).


