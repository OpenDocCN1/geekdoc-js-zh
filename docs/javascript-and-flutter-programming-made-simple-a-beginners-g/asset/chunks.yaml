    \ {\n    await tester.pumpWidget(MyButton(label: 'Click Me', onPressed: (){}));\n\
    \n    final buttonFinder = find.byType(ElevatedButton);\n    final textFinder\
    \ = find.text('Click Me');\n\n    expect(buttonFinder, findsOneWidget);\n    expect(textFinder,\
    \ findsOneWidget);\n\n    await tester.tap(buttonFinder);\n  });\n}\n```\n\n##\
    \ Flutter 中的调试\n\n### 日志（Logging）\n\n日志是在 Flutter 中调试代码的一种简单且有效的方法。我们可以使用 `print`\
    \ 函数在运行时向控制台打印消息。\n\n示例：\n\n```dart\nvoid main() {\n  print('App started');\n\
    \  runApp(MyApp());\n}\n```\n\n### 使用 DevTools 调试\n\nFlutter 提供了一个名为 DevTools\
    \ 的强大调试工具，允许我们检查和调试 Flutter 应用。要使用 DevTools，请遵循以下步骤：\n\n1. 以启用调试模式启动应用：\n```\n\
