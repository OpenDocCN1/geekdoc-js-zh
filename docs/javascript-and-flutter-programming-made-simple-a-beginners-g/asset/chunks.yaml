    \  bool _isExpanded = false;\n\n  @override\n  void initState() {\n    super.initState();\n\
    \    _controller = AnimationController(\n      vsync: this,\n      duration: Duration(milliseconds:\
    \ 500),\n    );\n  }\n\n  @override\n  Widget build(BuildContext context) {\n\
    \    return GestureDetector(\n      onTap: () {\n        setState(() {\n     \
    \     _isExpanded = !_isExpanded;\n          if (_isExpanded) {\n            _controller.forward();\n\
    \          } else {\n            _controller.reverse();\n          }\n       \
    \ });\n      },\n      child: Center(\n        child: Container(\n          width:\
