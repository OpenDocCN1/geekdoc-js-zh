    \ default` 语法表示。\n\n从模块导入实体，我们使用 `import` 关键字。我们可以导入特定的实体、将所有实体作为命名空间或导入默认导出。以下是从\
    \ `module.js` 模块导入实体的方法：\n\n```javascript\n// main.js\nimport { PI, double } from\
