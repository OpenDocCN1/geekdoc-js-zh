    \n### 6.8 Object Prototypes and Inheritance\n\nJavaScript is a prototype-based\
    \ language, which means objects can inherit properties and methods from other\
    \ objects. This concept is known as inheritance. Objects can have a prototype\
    \ object, which serves as a blueprint for the properties and methods it inherits.\n\
    \nIn JavaScript, inheritance is achieved through prototype chaining. Objects have\
    \ an internal `[[Prototype]]` property that references their prototype object.\
    \ If a property or method is not found in an object, JavaScript looks for it in\
    \ the object's prototype. This chain continues until the property or method is\
    \ found or until the end of the prototype chain is reached.\n\n### 6.9 Conclusion\n\
