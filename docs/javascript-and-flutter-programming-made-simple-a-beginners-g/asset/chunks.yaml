    \n# 第 6 章：JavaScript 对象\n\n在 JavaScript 中，对象是用于存储相关数据值对的复合类型。在第 5 章中，我们探索了数组，它们允许我们存储和操作元素。现在，让我们进入对象的世界及其强大功能！\n\
    \n## 6.1 对象初探\n\n在 JavaScript 中，对象是用于存储相关数据值对的复合类型。对象通过键（key）和值（value）来组织数据。键通常是字符串，而值可以是任何类型。\n\
    \n## 6.2 创建对象\n\n有多种方法可以创建对象。一种常见的方法是使用对象字面量，如下所示。这里有一个示例：\n\n```javascript\n\
    var person = {\n  name: \"John Doe\",\n  age: 30,\n  profession: \"Developer\"\
    \n};\n```\n\n在此示例中，我们创建了一个名为 `person` 的对象，包含三个属性：`name`、`age` 和 `profession`。\n\
    \n## 6.3 访问属性\n\n我们可以通过点符号法或括号法来访问对象的属性。点符号法是最常用的。这里有一个示例：\n\n```javascript\n\
    var car = {\n  make: \"Toyota\",\n  model: \"Camry\",\n  year: 2022\n};\n\nconsole.log(car.make);\
    \    // 输出: Toyota\nconsole.log(car[\"model\"]); // 输出: Camry\n```\n\n在此示例中，我们访问了\
    \ `car` 对象的 `make` 和 `model` 属性。\n\n## 6.4 修改属性\n\nJavaScript 对象是可变的，这意味着我们可以在创建后修改它们的属性。我们可以使用点符号法或括号法重新为属性赋值。这里有一个示例：\n\
    \n```javascript\nperson.age = 35;\ncar['year'] = 2023;\n```\n\n在此示例中，我们修改了 `person`\
    \ 对象的 `age` 属性和 `car` 对象的 属性。\n\n## 6.5 添加和删除属性\n\n我们可以通过向不存在的属性赋值为对象添加新属性。同样，我们可以使用\
    \ `delete` 关键字来删除属性。这里有一个示例：\n\n```javascript\nperson.gender = \"Male\";\ndelete\
    \ car.model;\n```\n\n在此示例中，我们为 `person` 对象添加了 `gender` 属性，并从 `car` 对象中删除了 `model`\
    \ 属性。\n\n## 6.6 对象方法\n\n除了属性，JavaScript 对象还可以包含方法。方法是与对象关联的函数，可以使用点符号法调用。\n\n\
    JavaScript 中的方法是与对象关联的函数，可以使用对象的属性执行操作或计算。来看这个示例：\n\n```javascript\nvar calculator\
    \ = {\n  add: function (a, b) {\n    return a + b;\n  },\n  subtract: function\
    \ (a, b) {\n    return a - b;\n  }\n};\n\nconsole.log(calculator.add(5, 3)); \
    \  // 输出: 8\nconsole.log(calculator.subtract(10, 4)); // 输出: 6\n```\n\n在此示例中，我们创建了一个名为\
    \ `calculator` 的对象，包含两个方法：`add` 和 `subtract`。这些方法可以使用点符号法调用，并传递所需的参数。\n\n## 6.7\
    \ 对象迭代\n\n我们可以使用各种技术来遍历对象的属性。一种常见方法是使用 `for...in` 循环，它允许我们遍历对象的枚举属性。这里有一个示例：\n\
    \n```javascript\nfor (var key in person) {\n  console.log(key + \": \" + person[key]);\n\
    }\n```\n"
