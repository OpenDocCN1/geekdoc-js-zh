    \ 调用并优雅地处理错误。\n\n处理 API 和网络连接是现代应用开发的基础部分。通过理解这些概念并有效地实现它们，你可以创建出能够与远程服务器交互、获取数据并为用户提供动态且最新内容的应用程序。\n\
    \n# 第 9 章：使用本地持久化存储数据\n在第 8 章中，我们探索了如何通过 API 和网络连接来与远程服务器交互并检索数据。然而，有时我们需要将数据存储在设备本地，即使在应用程序关闭或重启后也是如此。在本章中，我们将深入研究\
    \ Flutter 中的本地数据持久化。我们将学习在本地存储数据的多种不同方法，例如使用 shared preferences、文件和数据库，并结合实际示例来理解它们的实现方式。\n\
    \n## 为什么需要本地数据持久化？\n本地数据持久化对于需要保存用户偏好、缓存数据或其他跨应用会话持续的信息的应用程序至关重要。将数据存储在本地还可以允许应用程序在离线或无互联网连接的情况下运行。\n\
    \n## Shared Preferences\nShared preferences 是一种在设备上存储键值对的简单方法。它们通常用于存储用户设置，例如语言偏好或应用主题。\n\
    \n### 使用 Shared Preferences 存储数据\n要使用 shared preferences，我们首先需要在 `pubspec.yaml`\
    \ 文件中添加 `shared_preferences` 包并运行 `flutter pub get`。\n示例：\n```dart\nimport 'package:shared_preferences/shared_preferences.dart';\n\
    \nvoid savePreferences() async {\n  final prefs = await SharedPreferences.getInstance();\n\
    \  await prefs.setString('username', 'JohnDoe');\n  await prefs.setInt('age',\
    \ 30);\n}\n\nvoid readPreferences() async {\n  final prefs = await SharedPreferences.getInstance();\n\
    \  final username = prefs.getString('username') ?? '';\n  final age = prefs.getInt('age')\
    \ ?? 0;\n  print('Username: $username');\n  print('Age: $age');\n}\n```\n在这个示例中，我们使用\
    \ `SharedPreferences.getInstance()` 来获取 shared preferences 实例。然后我们使用 `setString`\
    \ 和 `setInt` 方法存储数据，并使用 `getString` 和 `getInt` 方法读取数据。\n\n## 文件存储\n文件存储允许我们对设备上的文件进行读写操作。它适合存储结构化数据或大量数据。\n\
    \n### 向文件写入数据\n示例：\n```dart\nimport 'dart:io';\n\nvoid writeToFile() async {\n\
    \  final file = File('data.txt');\n  await file.writeAsString('Hello, world!');\n\
    }\n```\n在这个示例中，我们使用 `File` 类来表示文件，并使用 `writeAsString` 方法将数据写入文件。\n\n### 从文件读取数据\n\
    示例：\n```dart\nimport 'dart:io';\n\nvoid readFromFile() async {\n  final file =\
    \ File('data.txt');\n  final content = await file.readAsString();\n  print('File\
    \ content: $content');\n}\n```\n\n## SQLite 数据库\nSQLite 是一个轻量级的无服务器数据库引擎，允许我们使用\
    \ SQL 创建、读取、更新和删除数据。它适用于复杂的数据结构和较大的数据集。\n\n### 使用 SQLite\n在 Flutter 中使用 SQLite，我们需要在\
    \ `pubspec.yaml` 文件中添加 `sqflite` 包并运行 `flutter pub get`。\n示例：\n```dart\nimport\
    \ 'package:sqflite/sqflite.dart';\nimport 'package:path/path.dart';\n\nvoid initializeDatabase()\
    \ async {\n  final databasePath = awaitDatabasesPath();\n  final path = join(databasePath,\
    \ 'my_database.db');\n  final database = await openDatabase(path, version: 1,\n\
    \      onCreate: (db, version) {\n    db.execute('CREATE TABLE users (id PRIMARY\
    \ KEY, name TEXT)');\n  });\n\n  // 插入数据\n  await database.insert('users', {'name':\
    \ 'John Doe'});\n\n  // 查询数据\n  final users = await database.query('users');\n\
    \n  // 打印结果\n  for (final user in users) {\n    print('User ID: ${user['id']},\
    \ Name: ${user['name']}');\n  }\n}\n```\n在这个示例中，我们使用 `sqflite` 包来创建并操作 SQLite\
    \ 数据库。我们在 `onCreate` 回调中使用 SQL 定义表，并插入和查询数据。\n\n## Hive 数据库\nHive 是一种专为 Flutter\
    \ 设计的轻量级快速 NoSQL 数据库。它提供了卓越的性能，非常适合存储结构化数据。\n\n### 使用 Hive\n在 Flutter 中使用 Hive，我们需要在\
    \ `pubspec.yaml` 中添加 `hive` 和 `hive_flutter` 包并运行 `flutter pub get`。\n示例：\n```dart\n\
