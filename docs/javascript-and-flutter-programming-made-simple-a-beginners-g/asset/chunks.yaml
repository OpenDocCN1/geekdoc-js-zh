    # # Chapter 10: Animations and Gestures


    In Chapter 10, we will explore two essential aspects of app development in Flutter
    - animations and gestures. Animations add life and interactivity to our apps,
    while gestures allow users to interact with the app through touch. We will learn
    how to create smooth animations and handle various gestures using Flutter widgets
    and controllers, along with practical examples to understand their implementation.


    ## Animations


    Animations are an essential part of creating engaging and delightful user experiences
    in apps. Flutter provides a rich set of animation widgets and controllers to create
    smooth and fluid animations.


    ### AnimatedContainer


    The `AnimatedContainer` widget is a straightforward way to animate changes to
    a container''s properties, such as size, color, or alignment.


    Example:


    ```dart


    class AnimatedContainerExample extends StatefulWidget {


    @override


    _AnimatedContainerExampleState createState() =>


    _AnimatedContainerExampleState();


    }


    class _AnimatedContainerExampleState extends State<AnimatedContainerExample> {


    bool _isExpanded = false;


    @override


    Widget build(BuildContext context) {


    return GestureDetector(


    onTap: () {


    setState(() {


    _isExpanded = !_isExpanded;


    });


    },


    child: AnimatedContainer(


    duration: Duration(milliseconds: 500),


    width: _isExpanded ? 200 : 100,


    height: _isExpanded ? 200 : 100,


    color: _isExpanded ? Colors.blue : Colors.red,


    alignment:


    _isExpanded ? Alignment.center : AlignmentDirectional.topCenter,


    child: Text(''Tap Me''),


    ),


    );


    }


    }


    ```


    In this example, we create a stateful widget called `AnimatedContainerExample`
    that uses the `AnimatedContainer` widget to animate changes to the container''s
    width, height, color, and alignment. When the container is tapped, the `_isExpanded`
    state is toggled, triggering the animation.


    ### AnimationController and Tween


    For more complex animations, we can use `AnimationController` and `Tween` objects
    to define the animation behavior.


    Example:


    ```dart


    class AnimationControllerExample extends StatefulWidget {


    @override


    _AnimationControllerExampleState createState() =>


    _AnimationControllerExampleState();


    }


    class _AnimationControllerExampleState


    extends State<AnimationControllerExample>


    with SingleTickerProviderStateMixin {


    late AnimationController _controller;


    late Animation<double> _animation;


    @override


    void initState() {


    super.initState();


    _controller = AnimationController(


    duration: Duration(seconds: 2),


    vsync: this,


    );


    final animation = CurvedAnimation(


    parent: _controller,


    curve: Curves.easeInOut,


    );


    _animation = Tween<double>(begin: 0, end: 1).animate(animation);


    }


    @override


    Widget build(BuildContext context) {


    return GestureDetector(


    onTap: () {


    if (_controller.isCompleted) {


    _controller.reverse();


    } else {


    _controller.forward();


    }


    },


    child: Center(


    child: ScaleTransition(


    scale: _animation,


    child: Container(


    width: 100,


    height: 100,


    color: Colors.blue,


    ),


    ),


    ),


    );


    }


    @override


    void dispose() {


    _controller.dispose();


    super.dispose();


    }


    }


    ```


    In this example, we create a stateful widget called `AnimationControllerExample`
    that uses `AnimationController` and `Tween` to create a scale animation. When
    the container is tapped, the animation is played in forward or reverse direction
    based on the current state of the animation.


    ## Gestures


    Gestures are user interactions with the app, such as tapping, swiping, dragging,
    or pinching. Flutter provides gesture detection widgets to handle various types
    of user gestures.


    ### GestureDetector


    The `GestureDetector` widget can detect various types of gestures and respond
    to them.


    Example:


    ```dart


    class GestureDetectorExample extends StatelessWidget {


    @override


    Widget build(BuildContext context) {


    return GestureDetector(


    onTap: () {


    print(''Tapped'');


    },


    onDoubleTap: () {


    print(''Double Tapped'');


    },


    onLongPress: () {


    print(''Long Pressed'');


    },


    onPanUpdate: (details) {


    print(''Pan Update: ${details.globalPosition}'');


    },


    onScaleUpdate: (details) {


    print(''Scale Update: ${details.scale}'');


    },


    child: Container(


    width: 100,


    height: 100,


    color: Colors.blue,


    ),


    );


    }


    }


    ```


    In this example, we create a stateless widget called `GestureDetectorExample`
    that uses the `GestureDetector` widget to detect tap, double tap, long press,
    pan, and scale gestures. When a gesture is detected, a corresponding message is
    printed to the console.


    ### Dismissible


    The `Dismissible` widget allows us to implement swipe-to-dismiss functionality
    for list items.


    Example:


    ```dart


    class DismissibleExample extends StatefulWidget {


    @override


    _DismissibleExampleState createState() => _DismissibleExampleState();


    }


    class _DismissibleExampleState extends State<DismissibleExample> {


    List<String> _items = List.generate(5, (index) => ''Item ${index + 1}'');


    @override


    Widget build(BuildContext context) {


    return ListView.builder(


    itemCount: _items.length,


    itemBuilder: (context, index) {


    final item = _items[index];


    return Dismissible(


    key: Key(item),


    direction: DismissDirection.endToStart,


    background: Container(


    color: Colors.red,


    alignment: Alignment.centerRight,


    padding: EdgeInsets.symmetric(horizontal: 16.0),


    child: Icon(Icons.delete, color: Colors.white),


    ),


    onDismissed: (direction) {


    setState(() {


    _items.removeAt(index);


    });


    },


    child: ListTile(


    title: Text(item),


    ),


    );


    },


    );


    }


    }


    ```


    In this example, we create a stateful widget called `DismissibleExample` that
    uses the `Dismissible` widget to create a list of items that can be dismissed
    by swiping from right to left. When an item is dismissed, it is removed from the
    list.


    ## Combining Animations and Gestures


    We can combine animations and gestures to create interactive and visually appealing
    user interfaces.


    Example:


    ```dart


    class AnimatedGestureExample extends StatefulWidget {


    @override


    _AnimatedGestureExampleState createState() => _AnimatedGestureExampleState();


    }


    class _AnimatedGestureExampleState extends State<AnimatedGestureExample>


    with SingleTickerProviderStateMixin {


    late AnimationController _controller;


    bool _isExpanded = false;


    @override


    void initState() {


    super.initState();


    _controller = AnimationController(


    vsync: this,


    duration: Duration(milliseconds: 500),


    );


    }


    @override


    Widget build(BuildContext context) {


    return GestureDetector(


    onTap: () {


    setState(() {


    _isExpanded = !_isExpanded;


    if (_isExpanded) {


    _controller.forward();


    } else {


    _controller.reverse();


    }


    });


    },


    child: Center(


    child: Container(


    width: 100,


    height: _controller.value * 100 + 100,


    color: Colors


    .blue,


    alignment: _isExpanded ? Alignment.center : AlignmentDirectional.topCenter,


    child: Text(''Tap Me''),


    ),


    ),


    );


    }


    @override


    void dispose() {


    _controller.dispose();


    super.dispose();


    }


    }


    ```


    In this example, we combine animations and gestures to create an expanding and
    collapsing container. When the container is tapped, it expands or collapses smoothly
    using `AnimationController` and `GestureDetector`.


