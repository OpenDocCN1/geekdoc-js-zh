    \n### 使用断点调试\n\n断点是代码中的标记，当程序运行到它们时会暂停应用的执行，允许我们检查该点的应用状态和变量。\n\n示例：\n\n```dart\n\
    void main() {\n  print('App started'); // 在此处添加断点\n  runApp(MyApp());\n}\n```\n\
    \n在这个示例中，我们在 `print` 语句处添加了断点。当以调试模式运行应用时，它将在此断点处暂停，我们可以检查此时应用的状态和变量。\n\n### 使用\
    \ Flutter Inspector 调试\n\nFlutter Inspector 是集成在 Android Studio 和 Visual Studio\
    \ Code 中的一个工具，允许我们检查和可视化查看应用的 widget 树。\n\n要使用 Flutter Inspector，请按照以下步骤操作：\n\n\
    1. 在 Android Studio 或 Visual Studio Code 中打开你的 Flutter 项目。\n2. 以调试模式启动你的应用。\n\
    3. 在 IDE 中，点击“Flutter Inspector”图标，或按 `Alt + Shift + V`（Visual Studio Code）或 `Ctrl\
    \ + Alt + Shift + I`（Android Studio）。\n4. Flutter Inspector 将打开，你可以用它来检查并交互应用的\
    \ widget 树。\n\n## 结论\n\n在本章中，我们探索了 Flutter 中的测试和调试。测试对于确保我们的代码按预期运行至关重要，Flutter\
    \ 提供了单元测试和 widget 测试等工具，帮助我们为应用编写有效的测试。\n\n调试对于识别和修复代码中的问题至关重要。我们学习了不同的调试技术，包括日志记录、使用\
    \ DevTools、断点以及 Flutter Inspector，用以检查和诊断 Flutter 应用中的问题。\n\n通过有效地对 Flutter 应用进行测试和调试，我们可以构建出高质量、可靠且高性能的程序，提供无缝的用户体验。\n\
    \n# 第 15 章：持续集成与交付\n\n在第 15 章中，我们将探索 Flutter 应用开发中的持续集成（CI）和持续交付（CD）。CI/CD 是一套自动化构建、测试和部署代码更改过程的实践。它帮助开发者维持高水平的代码质量，加速开发周期，并更高效地交付新功能和更新。在本章中，我们将学习如何使用\
    \ GitHub Actions 和 Firebase App Distribution 等热门工具，通过实际示例为 Flutter 应用设置 CI/CD\
    \ 流线。\n\n## Flutter 的持续集成 (CI)\n\n持续集成（CI）涉及在开发者向仓库推送新代码时，自动构建并测试代码更改。这确保了每次更改都能集成到主代码库，而不会引起冲突或破坏现有功能。\n\
    \n### 为 CI 设置 GitHub Actions\n\nGitHub Actions 是 GitHub 提供的一个强大的 CI/CD 平台。它允许开发者在仓库的\
    \ `.github/workflows` 目录中将工作流定义为代码。\n\n示例：`ci.yml`\n\n```yaml\nname: CI\non:\n\
    \  push:\n    branches:\n      - main\njobs:\n  build:\n    runs-on: ubuntu-latest\n\
    \    steps:\n      - name: Check out code\n        uses: actions/checkout@v2\n\
    \      - name: Setup Flutter\n        uses: subosito/flutter-action@v2\n     \
    \   with:\n          flutter-version: '2.2.3'  # 替换所需的 Flutter 版本\n      - name:\
    \ Get dependencies\n        run: flutter pub get\n      - name: Analyze code\n\
    \        run: flutter analyze\n      - name: Run tests\n        run: flutter test\n\
    ```\n\n在这个示例中，我们为 CI 设置了一个基础的 GitHub Actions 工作流。当有新代码推送到 `main` 分支时，工作流就会运行。它会检出代码，设置指定版本的\
    \ Flutter，获取依赖，使用 `flutter analyze` 分析代码，并运行 `flutter test` 测试。\n\n## Flutter\
    \ 的持续交付 (CD)\n\n持续交付（CD）涉及在代码更改通过 CI 测试后，自动将其部署到测试环境或生产环境。它允许开发者更频繁、更可靠地向用户交付新功能和错误修复。\n\
    \n### 为 CD 设置 Firebase App Distribution\n\nFirebase App Distribution 是 Firebase\
    \ 提供的平台，允许开发者向测试人员分发应用的预发布版本。它简化了共享和测试应用构建的过程。\n\n示例：`cd.yml`\n\n```yaml\nname:\
    \ CD\non:\n  push:\n    tags:\n      - 'v*.*.*'  # 匹配格式为 v1.2.3 的标签\njobs:\n \
    \ deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Check out code\n\
    \        uses: actions/checkout@v2\n      - name: Setup Flutter\n        uses:\
    \ subosito/flutter-action@v2\n        with:\n          flutter-version: '2.2.3'\
    \  # 替换所需的 Flutter 版本\n      - name: Get dependencies\n        run: flutter pub\
    \ get\n      - name: Build release APK\n        run: flutter build apk --release\n\
    \      - name: Deploy to Firebase App Distribution\n        uses: wzieba/Firebase-Distribution-Github-Action@v1.5\n\
    \        with:\n          appId: ${{ secrets.FIREBASE_APP_ID }}\n          token:\
    \ ${{ secrets.FIREBASE_TOKEN }}\n          groups: 'testers'\n          apkPath:\
    \ 'build/app/outputs/flutter-apk/app-release.apk'\n```\n\n在这个示例中，我们为 CD 设置了一个\
    \ GitHub Actions 工作流。当推送格式为 `v1.2.3` 的新 Git 标签时，工作流就会运行。它检出代码，设置指定版本的 Flutter，获取依赖，使用\
    \ `flutter build apk --release` 构建发布版 APK，并使用提供的 `appId`、`token` 和 `groups` 将其部署到\
    \ Firebase App Distribution。\n\n###密钥管理\n\n注意，Firebase 凭据和 API 密钥等敏感信息不应直接存储在工作文件中。相反，请使用\
    \ GitHub 仓库密钥（secrets）来安全地存储此类信息。在工作文件中，将 `${{ secrets.SECRET_NAME }}` 替换为实际的密钥名称。\n\
    \n"
