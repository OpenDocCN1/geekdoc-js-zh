  trans: "\n在本章中，我们探索了 Flutter 中的动画和手势。动画允许我们创建流畅且吸引人的用户界面，而手势则让用户能够通过触摸与应用进行交互。我们学习了如何使用\
    \ `AnimatedContainer`、`AnimationController` 和 `Tween` 创建动画，以及如何使用 `GestureDetector`\
    \ 和 `Dismissible` 处理手势。\n\n通过结合动画和手势，我们可以构建出交互性强且视觉良好的用户体验，从而提升应用程序的整体易用性和趣味。\n\
    \n# 第 11 章：构建自定义组件\n\n在第 10 章中，我们探索了动画和手势，以为应用添加交互性和参与度。现在，在第 11 章中，我们将深入如何在 Flutter\
    \ 中构建自定义组件。自定义组件允许我们封装和重用 UI 组件，使我们的代码库更具维护性且更有组织。在本章中，我们将学习如何从零开始创建自定义组件，并结合实际示例理解它们的实现方式。\n\
    \n## 为什么要构建自定义组件？\n\nFlutter 提供了丰富的内置组件集，但有时我们应用的 UI 需求会超出内置组件的范围。构建自定义组件允许我们创建完美符合应用设计和功能的定制化组件。自定义组件还促进了代码重用，因为我们可以在整个应用中多次使用它们。\n\
    \n## 创建无状态自定义组件\n\n无状态自定义组件是不维护任何内部状态且是不可变的组件。它非常适用于内容不随时间变化的固定内容组件。\n\n示例：\n\n\
    ```dart\nimport 'package:flutter/material.dart';\n\nclass MyCustomButton extends\
    \ StatelessWidget {\n  final String label;\n  final VoidCallback onPressed;\n\
    \  MyCustomButton({required this.label, required this.onPressed});\n\n  @override\n\
    \  Widget build(BuildContext context) {\n    return ElevatedButton(\n      onPressed:\
    \ onPressed,\n      child: Text(label),\n    );\n  }\n}\n```\n\n在这个示例中，我们创建了一个名为\
    \ `MyCustomButton` 的自定义无状态组件。它接受两个参数 `label` 和 `onPressed`，用于自定义按钮的文本和行为。该组件使用内置的\
    \ `ElevatedButton` 来渲染按钮。\n\n## 创建有状态自定义组件\n\n有状态自定义组件是可以维护内部状态且是可变的组件。它适用于需要随时间更改内容或外观的组件。\n\
    \n示例：\n\n```dart\nimport 'package:flutter/material.dart';\n\nclass MyCounter extends\
    \ StatefulWidget {\n  @override\n  _MyCounterState createState() => _MyCounterState();\n\
    }\n\nclass _MyCounterState extends State<MyCounter> {\n  int _count = 0;\n  void\
    \ _incrementCounter() {\n    setState(() {\n      _count++;\n    });\n  }\n\n\
    \  @override\n  Widget build(BuildContext context) {\n    return Column(\n   \
    \   children: [\n        Text('Count: $_count'),\n        ElevatedButton(\n  \
    \        onPressed: _incrementCounter,\n          child: Text('Increment'),\n\
    \        ),\n      ],\n    );\n  }\n}\n```\n\n在这个示例中，我们创建了一个名为 `MyCounter` 的自定义有状态组件。它维护了一个内部变量\
    \ `_count`，并在按钮被按下时使用 `setState()` 方法更新它。该组件显示当前计数值和一个用于递加的按钮。\n\n## 组合组件以创建复杂的自定义组件\n\
    \n自定义组件可以由其他内置组件或自定义组件组成，允许我们创建更复杂、更专门的 UI 组件。\n\n示例：\n\n```dart\nimport 'package:flutter/material.dart';\n\
    \nclass MyCustomCard extends StatelessWidget {\n  final String title;\n  final\
    \ String content;\n  MyCustomCard({required this.title, required this.content});\n\
    \n  @override\n  Widget build(BuildContext context) {\n    return Card(\n    \
    \  child: Column(\n        children: [\n          ListTile(\n            title:\
    \ Text(title),\n          ),\n          Divider(),\n          Padding(\n     \
    \       padding: EdgeInsets.all(16.0),\n            child: Text(content),\n  \
    \        ),\n        ],\n      ),\n    );\n  }\n}\n```\n\n在这个示例中，我们创建了一个名为 `MyCustomCard`\
    \ 的自定义组件，它是一个显示标题和内容的简单卡片。它使用 `Card` 组件作为基础，并与 `Column`、`ListTile`、`Divider` 和\
    \ `Padding` 组合。\n\n## 使用属性自定义组件\n\n自定义组件可以接受属性（也称为 props 或参数）来定制它们的外观和行为。\n\n\
    示例：\n\n```dart\nimport 'package:flutter/material.dart';\n\nclass MyCustomButton\
    \ extends StatelessWidget {\n  final String label;\n  final VoidCallback onPressed;\n\
    \  final Color? color;\n  MyCustomButton({\n    required this.label,\n    required\
    \ this.onPressed,\n    this.color,\n  });\n\n  @override\n  Widget build(BuildContext\
    \ context) {\n    return ElevatedButton(\n      onPressed: onPressed,\n      child:\
    \ Text(label),\n      style: ElevatedButton.styleFrom(\n        primary: color,\n\
    \      ),\n    );\n  }\n}\n```\n\n在这个示例中，我们增强了 `MyCustomButton` 组件，使其接受一个可选的 `color`\
    \ 参数。按钮的背景颜色现在是可以自定义的，如果没有提供颜色，它将使用 `ElevatedButton` 定义的默认颜色。\n\n## 使用组件组合和继承\n\
    \n组件组合允许我们通过组合多个组件来创建更复杂的自定义组件。另一方面，组件继承允许我们扩展现有组件以添加或覆盖功能。\n\n示例：\n\n```dart\n\
    import 'package:flutter/material.dart';\n\nclass MyCustomButton extends StatelessWidget\
    \ {\n  final String label;\n  final VoidCallback onPressed;\n  MyCustomButton({required\
    \ this.label, required this.onPressed});\n\n  @override\n  Widget build(BuildContext\
    \ context) {\n    return ElevatedButton(\n      onPressed: onPressed,\n      child:\
    \ Text(label),\n    );\n  }\n}\n\nclass MyColoredButton extends MyCustomButton\
    \ {\n  final Color color;\n  MyColoredButton({required String label, required\
    \ VoidCallback onPressed, required this.color})\n    : super(label: label, onPressed:\
    \ onPressed);\n\n  @override\n  Widget build(BuildContext context) {\n    return\
    \ ElevatedButton(\n      onPressed: onPressed,\n      child: Text(label),\n  \
    \    style: ElevatedButton.styleFrom(\n        primary: color,\n      ),\n   \
    \ );\n  }\n}\n```\n\n在这个示例中，我们创建了一个名为 `MyColoredButton` 的自定义组件，它继承自 `MyCustomButton`。我们添加了一个新属性\
    \ `color` 来自定义按钮背景颜色。通过重写 `build` 方法，我们根据提供的颜色定制按钮外观。\n\n## 总结\n\n在本章中，我们探索了在\
    \ Flutter 中构建自定义组件。自定义组件允许我们创建专门且可用的组件，促进了代码的组织和维护。我们学习了如何创建无状态和有状态的自定义组件，使用属性对其进行定制，并通过组合组件来构建更复杂的\
    \ UI 元素。\n\n通过自定义组件，我们可以设计出完美符合应用需求的独特且响应式的用户界面。通过组件组合和继承，我们可以扩展并增强现有组件，减少代码重复并促进代码重用。\n\
    \n# 第 12 章：国际化与本地化\n\n在第 12 章中，我们将探索 Flutter 中的国际化和本地化。国际化是适配应用程序以支持多种语言和地区的过程，而本地化是将应用内容翻译成不同语言的过程。Flutter\
    \ 为国际化和本地化提供了很好的支持，使我们能够创建面向全球观众的应用。在本章中，我们将学习如何通过实际示例在 Flutter 中实现国际化和本地化。\n\n\
    ## 设置国际化\n\n为了开始对应用国际化，我们需要对 `pubspec.yaml` 文件进行一些修改。\n\n示例：\n\n"
- fmt: "\n```yaml\nname: my_app\ndescription: A new Flutter project\n# ...\nflutter:\n\
    \  uses-material-design: true\n\n# Add the following line for internationalization\n\
    dependencies:\n  flutter:\n    sdk: flutter\n  flutter_localizations:\n    sdk:\
    \ flutter\n\n# Add the following line to specify the supported locales\nsupportedLocales:\n\
    \  - en\n  - es\n  - fr\n\n# Add the following line to specify the app's default\
    \ locale\nlocale: en\n```\n\nIn this example, we add the `flutter_localizations`\
    \ package as a dependency to our app. We also specify the supported locales (English,\
    \ Spanish, and French) and set the default locale to English.\n\n## Creating Language\
    \ Files\n\nNext, we need to create language files for each supported language.\
    \ These files will contain translations of the app's text and content. The files\
    \ should be organized in a `lib/l10n` directory.\n\nExample:\n\n```\nmy_app\n\
    |-- lib\n|   |-- main.dart\n|   |-- l10n\n|   |   |-- app_localizations.dart\n\
    |   |   |-- intl_en.arb\n|   |   |-- intl_es.arb\n|   |   |-- intl_fr.arb\n```\n\
    \nThe `.arb` files (Application Resource Bundle) contain key-value pairs representing\
    \ the original text and its translations.\n\nExample `.arb` file (intl_en.arb):\n\
    \n```json\n{\n  \"@@locale\": \"en\",\n  \"greeting\": \"Hello!\",\n  \"welcome\"\
    : \"Welcome to my app.\",\n  \"button_label\": \"Press Me\",\n  \"error\": {\n\
    \    \"generic\": \"An error occurred.\",\n    \"network\": \"Network error occurred.\"\
    ,\n    \"permission\": \"Permission denied.\"\n  }\n}\n```\n\n## Generating Localization\
    \ Classes\n\nTo use the translations in our app, we need to generate localization\
    \ classes from the `.arb` files. Flutter provides a tool called `flutter gen-l10n`\
    \ to generate these classes.\n\nRun the following command in the terminal:\n\n\
    ```\nflutter gen-l10n\n```\n\nThis will generate the `AppLocalizations` class\
    \ in the `app_localizations.dart` file.\n\nExample `app_localizations.dart`:\n\
    \n```dart\nimport 'package:flutter/foundation.dart';\nimport 'package:flutter/material.dart';\n\
    import 'package:flutter/services.dart';\nimport 'package:flutter/widgets.dart';\n\
    \nclass AppLocalizations {\n  AppLocalizations(this.locale);\n  final Locale locale;\n\
    \  static AppLocalizations of(BuildContext context) {\n    return Localizations.of<AppLocalizations>(context,\
    \ AppLocalizations)!;\n  }\n  static const LocalizationsDelegate<AppLocalizations>\
    \ delegate =\n    _AppLocalizationsDelegate();\n  late Map<String, String> _localizedStrings;\n\
    \  Future<bool> load() async {\n    final jsonString =\n        await rootBundle.loadString('lib/l10n/intl_${locale.languageCode}.arb');\n\
    \    final Map<String, dynamic> jsonMap = json.decode(jsonString);\n    _localizedStrings\
    \ =\n        jsonMap.map((key, value) => MapEntry(key, value.toString()));\n \
    \   return true;\n  }\n  String translate(String key) {\n    return _localizedStrings[key]\
    \ ?? key;\n  }\n  // Define getters for frequently used translations\n  String\
    \ get greeting => translate('greeting');\n  String get welcome => translate('welcome');\n\
    \  String get buttonLabel => translate('button_label');\n  String get errorGeneric\
    \ => translate('error.generic');\n  String get errorNetwork => translate('error.network');\n\
    \  String get errorPermission => translate('error.permission');\n}\n\nclass _AppLocalizationsDelegate\n\
    \    extends LocalizationsDelegate<AppLocalizations> {\n  const _AppLocalizationsDelegate();\n\
    \  @override\n  bool isSupported(Locale locale) {\n    return ['en', 'es', 'fr'].contains(locale.languageCode);\n\
    \  }\n  @override\n  Future<AppLocalizations> load(Locale locale) async {\n  \
    \  final localizations = AppLocalizations(locale);\n    await localizations.load();\n\
    \    return localizations;\n  }\n  @override\n  bool shouldReload(_AppLocalizationsDelegate\
    \ old) => false;\n}\n```\n\n## Implementing Localization in the App\n\nTo use\
    \ the generated localization class in our app, we need to wrap the `MaterialApp`\
