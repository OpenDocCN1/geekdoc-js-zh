    ```


    ### InkWell


    The `InkWell` widget is specifically designed for handling taps and ripples. It
    is commonly used for buttons and clickable elements.


    Example:


    ```dart


    InkWell(


    onTap: () {


    print(''Button Pressed'');


    },


    child: Container(


    padding: EdgeInsets.all(16),


    decoration: BoxDecoration(


    color: Colors.blue,


    borderRadius: BorderRadius.circular(8),


    ),


    child: Text(


    ''Click Me'',


    style: TextStyle(color: Colors.white),


    ),


    ),


    )


    ```


    ## Text Input


    Handling text input is essential for various tasks, such as creating forms, search
    bars, or chat interfaces. Flutter provides the `TextField` widget for text input
    handling.


    ### TextField


    The `TextField` widget allows users to enter text and provides options for keyboard
    type, validation, and input formatting.


    Example:


    ```dart


    TextField(


    onChanged: (text) {


    print(''User typed: $text'');


    },


    decoration: InputDecoration(


    hintText: ''Enter your name'',


    ),


    )


    ```


    ### FocusNode


    When dealing with multiple text fields or focusing on a particular field, we can
    use `FocusNode` to manage the focus state.


    Example:


    ```dart


    FocusNode _nameFocusNode = FocusNode();


    TextField(


    focusNode: _nameFocusNode,


    decoration: InputDecoration(


    hintText: ''Enter your name'',


    ),


    )


    ElevatedButton(


    onPressed: () {


    if (_nameFocusNode.hasFocus) {


    _nameFocusNode.unfocus();


    }


    },


    child: Text(''Dismiss Keyboard''),


    )


    ```


    ## Handling Form Submission


    When dealing with forms, you often need to handle form submissions when the user
    taps the submit button. Flutter provides a straightforward way to manage form
    submissions using the `Form` and `FormField` widgets.


    Example:


    ```dart


    class MyForm extends StatefulWidget {


    @override


    _MyFormState createState() => _MyFormState();


    }


    class _MyFormState extends State<MyForm> {


    final _formKey = GlobalKey<FormState>();


    String _name = '''';


    void _submitForm() {


    if (_formKey.currentState.validate()) {


    _formKey.currentState.save();


    print(''Form submitted with name: $_name'');


    }


    }


    @override


    Widget build(BuildContext context) {


    return Form(


    key: _formKey,


    child: Column(


    children: [


    TextFormField(


    validator: (value) {


    if (value.isEmpty) {


    return ''Please enter your name'';


    }


    return null;


    },


    onSaved: (value) {


    _name = value;


    },


    ),


    ElevatedButton(


    onPressed: _submitForm,


    child: Text(''Submit''),


    ),


    ],


    ),


    );


    }


    }


    ```


    In this example, we use the `Form` widget to wrap the form fields, and each `TextFormField`
    has a validator function to validate the user input. When the user taps the submit
    button, `_submitForm` is called to save the form data if it is valid.


    ## GestureDetector and DragTarget for Drag-and-Drop


    Flutter also supports drag-and-drop interactions using the `GestureDetector` and
    `DragTarget` widgets. You can implement custom drag-and-drop functionality easily.


    Example:


    ```dart


    class MyDragDrop extends StatefulWidget {


    @override


    _MyDragDropState createState() => _MyDragDropState();


    }


    class _MyDragDropState extends State<MyDragDrop> {


    String _draggedItem = ''Drag Me'';


    String _droppedItem = ''Drop Here'';


    @override


    Widget build(BuildContext context) {


    return Column(


    mainAxisAlignment: MainAxisAlignment.center,


    children: [


    GestureDetector(


    onLongPress: () {


    setState(() {


    _draggedItem = ''Dragging'';


    });


    },


    onLongPressUp: () {


    setState(() {


    _draggedItem = ''Drag Me'';


    });


    },


    child: Draggable<String>(


    data: _draggedItem,


    child: Container(


    padding: EdgeInsets.all(16),


    color: Colors.blue,


    child: Text(_draggedItem),


    ),


    feedback: Container(


    padding: EdgeInsets.all(16),


    color: Colors.blue.withOpacity(0.5),


    child: Text(_draggedItem),


    ),


    childWhenDragging: Container(),


    ),


    ),


    SizedBox(height: 20),


    DragTarget<String>(


    builder: (context, candidateData, rejectedData) {


    return Container(


    padding: EdgeInsets.all(16),


    color: Colors.green,


    child: Text(_droppedItem),


    );


    },


    onWillAccept: (data) {


    return data == ''Dragging'';


    },


    onAccept: (data) {


    setState(() {


    _droppedItem = ''Dropped'';


    });


    },


    ),


    ],


    );


    }


    }


    ```


    In this example, the `Draggable` widget represents the item that can be dragged,
    while the `DragTarget` widget represents the area where the item can be dropped.
    The `onWillAccept` callback determines whether the drop is allowed, and the `onAccept`
    callback is triggered when the item is dropped successfully.


    ## Conclusion


    In this chapter, we learned about handling user input in Flutter apps. Taps and
    gestures are essential for making our apps interactive and engaging. We explored
    various widgets, such as `GestureDetector`, `InkWell`, `TextField`, `Form`, and
    `Draggable`, to handle different types of user input effectively.


    As you continue your journey in Flutter, remember to design your user interface
    with user input in mind. Ensure that your app''s interactions are intuitive and
    responsive, providing a delightful user experience for your users.


    # # Chapter 7: Navigating between Screens


    In Chapter 6, we explored how to handle user input in Flutter apps. Now, in Chapter
    7, we will focus on another crucial aspect of app development - navigating between
    screens. Navigating between screens allows users to move from one part of the
    app to another, enabling the app to present different content and functionality.
    In this chapter, we will learn about different navigation techniques in Flutter
    and explore practical examples to understand how to implement them effectively.


    ## Basic Navigation with Routes


    Flutter uses a routing system to navigate between screens. Each screen in your
    app is represented by a route. Flutter provides the `Navigator` widget, which
    manages the navigation stack and transitions between screens.


    ### Navigator.push and Navigator.pop


    The simplest form of navigation is using `Navigator.push` to push a new screen
    onto the navigation stack and `Navigator.pop` to pop the top screen and return
    to the previous screen.


    Example:


    ```dart


    // Screen 1


    Navigator.push(


    context,


    MaterialPageRoute(


    builder: (context) => Screen2(),


    ),


    );


    // Screen 2


    Navigator.pop(context);


    ```


    ### Named Routes


    Named routes provide a more structured and maintainable approach to navigation.
    Instead of using anonymous routes, you define named routes in your app and navigate
    using those names.


    Example:


    ```dart


    // Main.dart


    void main() {


    runApp(MaterialApp(


    initialRoute: ''/'',


    routes: {


    ''/'': (context) => HomeScreen(),


    ''/details'': (context) => DetailsScreen(),


    },


    ));


    }


    // HomeScreen.dart


    Navigator.pushNamed(context, ''/details'');


    ```


    ### Passing Data between Screens


    Often, you need to pass data between screens during navigation. You can achieve
    this by passing arguments to the constructor of the new screen.


    Example:


    ```dart


    // HomeScreen.dart


    Navigator.push(


    context,


    MaterialPageRoute(


    builder: (context) => DetailsScreen(data: ''Hello from Home Screen!''),


    ),


    );


    // DetailsScreen.dart


    class DetailsScreen extends StatelessWidget {


    final String data;


    DetailsScreen({required this.data});


    @override


    Widget build(BuildContext context) {


    return Scaffold(


    appBar: AppBar(title: Text(''Details'')),


    body: Center(child: Text(data)),


    );


    }


    }


    ```


    ### Handling Navigation Results


    In some cases, you might need to receive a result from the navigated screen. You
    can achieve this using `Navigator.push` and `Navigator.pop` with a result.


    Example:


    ```dart


    // HomeScreen.dart


    final result = await Navigator.push(


    context,


    MaterialPageRoute(


    builder: (context) => DetailsScreen(),


    ),


    );


    // DetailsScreen.dart


    Navigator.pop(context, ''Result from Details Screen'');


    ```


