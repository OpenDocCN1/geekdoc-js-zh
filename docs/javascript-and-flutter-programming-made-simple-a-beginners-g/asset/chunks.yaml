    # Chapter 4: JavaScript Functions


    In Chapter 3, we explored control flow statements in JavaScript, which allowed
    us to make decisions and repeat code blocks. Now, let''s dive into JavaScript
    functions, which are an essential part of building modular and reusable code.


    ### 4.1 Introduction to Functions


    A function in JavaScript is a block of code that performs a specific task or calculates
    a value. Functions allow us to organize our code into logical and reusable units.
    They help improve code readability, promote code reusability, and make our programs
    more manageable.


    ### 4.2 Function Declaration


    In JavaScript, we can declare a function using the `function` keyword followed
    by the function name, a list of parameters (optional), and the code block enclosed
    in curly braces. Here''s the basic syntax of a function declaration:


    ```javascript


    function functionName(parameter1, parameter2, ...) {


    // code to be executed


    }


    ```


    Let''s define a simple function that calculates the square of a number:


    ```javascript


    function square(number) {


    var result = number * number;


    return result;


    }


    ```


    In this example, we declare a function called `square` that takes a parameter
    named `number`. Inside the function, we calculate the square of the `number` by
    multiplying it by itself and assign the result to a variable named `result`. Finally,
    we use the `return` statement to return the calculated result.


    ### 4.3 Function Invocation


    To execute a function and get the desired result, we need to invoke or call the
    function by using its name followed by parentheses `()` and passing the necessary
    arguments (if any). Here''s an example of invoking the `square` function:


    ```javascript


    var number = 5;


    var squaredNumber = square(number);


    console.log(squaredNumber); // Output: 25


    ```


    In this example, we assign the value `5` to the variable `number`. Then, we invoke
    the `square` function by passing `number` as an argument. The returned result,
    `25`, is assigned to the variable `squaredNumber`, which we then log to the console.


    ### 4.4 Function Parameters and Arguments


    Functions can accept parameters, which act as placeholders for values that are
    passed to the function during invocation. Parameters allow functions to be flexible
    and work with different values. When we invoke a function, we pass arguments,
    which are the actual values that replace the function parameters. Let''s modify
    our `square` function to take advantage of parameters:


    ```javascript


    function square(number) {


    var result = number * number;


    return result;


    }


    var number = 5;


    var squaredNumber = square(number);


    console.log(squaredNumber); // Output: 25


    ```


    In this example, the `number` parameter in the function declaration acts as a
    placeholder for the value we pass when invoking the function (`5` in this case).


    ### 4.5 Function Return Statement


    The `return` statement in a function is used to specify the value that the function
    should return. It marks the end of the function execution and sends the specified
    value back to the caller. Let''s modify our `square` function to include a return
    statement:


    ```javascript


    function square(number) {


    return number * number;


    }


    var number = 5;


    var squaredNumber = square(number);


    console.log(squaredNumber); // Output: 25


    ```


    In this updated version, the `return` statement directly returns the calculated
    result without using an intermediate variable.


    ### 4.6 Function Scope


    Functions in JavaScript have their own scope. Variables declared inside a function
    are locally scoped, meaning they can only be accessed within the function. Conversely,
    variables declared outside of any function have global scope and can be accessed
    from anywhere in the code. Let''s examine the concept of function scope with an
    example:


    ```javascript


    var globalVariable = "I''m a global variable";


    function myFunction() {


    var localVariable = "I''m a local variable";


    console.log(localVariable);     // Output: I''m a local variable


    console.log(globalVariable);    // Output: I''m a global variable


    }


    myFunction();


    console.log(localVariable);        // Error: localVariable is not defined


    console.log(globalVariable);       // Output: I''m a global variable'
