- img_proc: true
  md: '# Command Substitution


    +   A string enclosed in backticks (aka grave accents) will be treated as a UNIX
    shell command and executed.


    +   The output of the command will be returned.


    +   Variable substitution occurs inside backticks just as if they were double
    quotes.


    +   In a scalar context, a single string consisting of all the output of the command
    is returned.


    +   In an array context, an array of values is returned, one for each line of
    output.


    +   Examples:


    ```

    $lastline = `tail -1 some_file`;

    @all_lines = `cat some_file`;

    ```


    ```

    $last_boot = `who -b`;

    @who = `who`;

    ```


    +   The generalized form is


    ```

    qx/cmd/


    $last_boot = qx/who -b;

    @who = qx{who};

    ```'
