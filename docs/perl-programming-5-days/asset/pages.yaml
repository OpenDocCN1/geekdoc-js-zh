    $birth(''daughter'') = ''Sep 2'';


    print "$birth{ARGV[0]}\n"; # Select an index on the command line

    ```


    Perl5 offers alternate syntax for the comma operator (yes, it is actually an operator.)

    The new syntax is to use "equals greater-than":


    ```

    =>

    ```


    in place of the comma. Both => and , do the same thing, but using the => form
    in certain places (especially in object oriented code) makes for easier reading
    and understanding of what exactly is going on.


    In the above example, you would say


    ```

    %birth = (''mom'' => ''Oct 5'', ''dad'' => ''Nov 7'', ''bro'' => ''May 25'',

    ''sis'' => ''Jun 4'');

