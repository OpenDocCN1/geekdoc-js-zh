  md: "# Pattern Matching Overview\n\n+   - Pattern matching is a method of determining\
    \ if a specified text pattern occurs in a string.\n\n+   - Perl's operator /m/\
    \ / searches a string for a pattern and returns true if the string contains (matches)\
    \ the pattern.\n\nExample:\n\n```\n$ = <STDIN>;  # Read a line\nif (m/zzz/) {\
    \  # Test if 'zzz' is in $_\n    print \"You sleeping?\\n\";\n}\n```\n\n+   -\
    \ Unless otherwise specified,the string that is searched is $.\n\n+   - Two strings,\
    \ now:\n\n+    - To specify a different string, use the '=~' operator.\n\n+  \
    \ - If you're using slashes to delimit the pattern, the 'm' is optional.\n\n```\n\
    $in = <STDIN>;  # Read a line into $in\nif ($in ~ /zzz/) {  # Test if 'zzz' is\
    \ in $in\n    print \"You sleeping?\\n\";\n}\n```\n\n+   - Implies that with the\
    \ 'm', you can use a character other than a slash (often used with a pattern containing\
    \ slashes).\n\n```\n$in = <STDIN>;\nif ($in ~ m:/etc/passwd:) {\n    print \"\
