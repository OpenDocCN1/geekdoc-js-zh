  md: "# Handling Binary Data\n\n+   - `join()` and `split()` have analogous fixed-length\
    \ data functions called `pack()` and `unpack()`.\n\n+   - `unpack()` creates a\
    \ list from a scalar, as does `split()`. The elements to be extracted out of the\
    \ scalar are in known fixed positions in the scalar.\n\n+   - `pack()` creates\
    \ a scalar from a list, where the elements of the list are packed into the scalar\
    \ in fixed positions.\n\n+   - `pack()` and `unpack()` primary features are:\n\
    \  - Fixed-position, fixed-length strings are created (packed) or broken out (unpacked).\n\
    \  - ASCII-to-binary (pack) and binary-to-ASCII (unpack) conversions can take\
    \ place.\n\n+   - Example uses for `pack()` and `unpack()`:\n  - Creating records\
    \ that are formatted as fixed-length fields.\n  - Extracting fields from records\
    \ that are formatted as fixed-length fields.\n  - Writing and reading binary data\
    \ files (ON SAME MACHINE!!!).\n  - Sending/receiving binary structures to/from\
    \ Perl function calls, such as `socket()`."
