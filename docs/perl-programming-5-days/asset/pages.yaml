  md: '# Notes


    Actually, the print function can take an optional first parameter before the list
    of items to print. The optional first parameter is a filehandle (or a scalar variable
    containing the name of a filehandle) that tells the function where to send the
    output. If the first parameter is omitted, the function outputs to the currently
    selected filehandle, which is initially STDOUT when a program starts. We will
    talk about filehandles in the next chapter.


    The point to be made here is that the optional first parameter is not part of
    the list of print items, so do not put a comma after it. If you do, and Perl can
    detect that it is a filehandle, your program won''t compile or run - you will
    get an error message on that line. If the first parameter is an indirect filehandle,
    i.e., a scalar variable containing the name of a filehandle, Perl won''t be able
    to tell that it is a filehandle and it will print the contents of the variable
    as part of the list of print items to the currently selected filehandle.


    Final comment: most perl functions can be called with or without parentheses around
    the parameters.


    Consider:


    ```

    #!/usr/bin/perl


    print STDOUT "hello there\n", "second line\n"; # No parens around parms

    print (STDOUT "hello there\n", "second line\n");# Parens around parms

    $f = "STDOUT"; # Set $f to contain the name of the STDOUT filehandle

    print ($f "hello there\n", "second line\n"); # No comma after $f

    print ($f,"hello there\n","second line\n"); # Comma after $f

    ```


    Output:


    ```

    hello there

    second line

    hello there

    second line

    hello there

    second line

    STDOUThello there

    second line

    ```


    The following would result in an error before runtime:


    ```

    print (STDOUT, "hello there\n", "second line\n"); # Parens around parms

    ```'
