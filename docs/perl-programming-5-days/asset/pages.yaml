  md: '# UNIX Multitasking Concepts


    +   - A process in UNIX is an executing program.

    - Each process has a unique process id, an integer, called the PID.

    - Each process has an environment, which is accessible in Perl through the special
    associative array %ENV.

    - New processes are created by calling the `fork` function.

    - When a process creates another, the first is called the parent and the second
    is called the child.

    - The environment of a process is inherited from its parent.

    - A parent runs concurrently with a child. At any time a parent can suspend and
    wait for a child to complete.

    - A process terminates by calling `exit()`, or by executing “off the end” of the
    closing brace of the main package, or by being killed.'
