  md: "# Notes\n\nRemember that filehandles are a data type in Perl. You can create\
    \ them in the same way you create other variables: \n\nXYZ;\n\nYou can even load\
    \ them with data, but unless you know exactly what you are doing, this will not\
    \ accomplish anything useful. Filehandles are designed to be created and manipulated\
    \ using specific Perl functions like `open()` and `close()`.\n\nThe names of filehandles\
    \ follow the same naming rules as other data structures in Perl: they are case\
    \ sensitive, can be upper, lower or mixed case, and can be (reasonably) long.\
    \ A convention is to make filehandles all upper case, leaving all user-created\
    \ scalars, arrays, etc. lower case. Doing this improves readability. Since filehandles\
    \ don't have a special character associated with them, making upper case makes\
    \ them visually stand out.\n\nPerl predefines three filehandles, `STDIN`, `STDOUT`,\
    \ and `STDERR`.\n\n`print` and `printf` write to `STDOUT`, unless you specify\
    \ a different filehandle.\n\n`warn` and die write to `STDERR`.\n\nThe input operator,\
    \ `<`, reads from `STDIN`, unless you specify a different filehandle."
