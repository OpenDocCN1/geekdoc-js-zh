  md: '# Array Slices


    +   - An array slice is a list that is created by extracting selected elements
    of an array.

    - The elements are not necessarily contiguous.

    - If the slice that you want to extract from an array consists of contiguous elements,
    then you can use the range operator to select the slice.

    - Otherwise, just list the element indices separated by commas.


    ```

    # Same as @arr[3..5], or ($arr[3], $arr[4], $arr[5])

    @new = @arr[3,4,5];


    # First and last. Same as ($arr[0], $arr[#arr])

    @new = @arr[0,$#arr];


    # The entire array ($arr[ .. #arr])

    @new = @arr;

