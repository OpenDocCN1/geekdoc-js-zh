  md: "# Notes\n\nThe range operator, ..., creates a list that starts with the value\
    \ of the left operand and counts up to the value of the right operand.\n\n```\n\
    perl -e 'print (0..10);\n\n@arr = ('a'..'z');\nprint $arr[23]; $arr[1], $arr[$arr];\n\
    ```\n\n# Two lists become one list\nforeach $letter ('A'..'z') print $letter;\n\
    \nA warning is in order here. The range operator is very useful for creating lists\
    \ of constants. Just remember that you are actually creating a list. When you\
    \ write\n\n```\n@array = (1..1000);\n```\n\nyou actually create a list of 1000\
    \ values and assign the list to the array. This is great for initializing an array\
    \ to a set of sequential values.\n\nBut the list is created no matter what you\
    \ do with it. Often, people use the range operator to drive a loop a given number\
    \ of times:\n\n```\nfor (1..50) {\n  print \"one more time!\\\"\n}\n```\n\nBut\
    \ if you create a very big range, the entire list (and all the memory needed to\
    \ hold it) is created. This can use up excessive amounts of memory, as well as\
    \ becoming a performance hog:\n\n```\nfor (1..1000000) {\n  print \"Oh no...not\
    \ again!\\\"\n}\n```\n\nThis will actually create the list, using up 4MB of memory\
    \ to do it (assuming 4 bytes per integer). A better way to do this is to use another\
    \ form of the for loop as follows:\n\n```\nfor($x=1;$x<=1000000;$x++) {\n  print\
    \ \"at least I'm using less memory!\\\"\n}\n```\n\nThis only allocates the space\
    \ for the single scalar $x, which, since it is a number, should only take 4 bytes."
