  md: '# Notes


    Normal arrays are named lists of single elements, indexed by position. Hashes
    are named lists of pairs, index and element, known as ''key,value'' pairs. Additional
    example:


    ```

    #!/usr/bin/perl

    # File: birth.pl


    @ARGV = 1 && die "Usage: $0 name\n";n%birth = (''mom'', ''dad'', ''Oct 5'', ''Nov
    7'', ''bro'', ''May 25'', ''sis'', ''Jun 4'');

