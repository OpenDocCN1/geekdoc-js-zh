  md: '# The open Function


    +   Use open() to open a file and create/load the filehandle


    +   open(FH,"filex") opens the file filex on the (maybe

    new) filehandle FH.


    +   The default mode for open is read only; you can explicitly

    prepend the < character to the file name:


    ```

    open(FH,"<filex");

    ```


    +   If you want to open for write, you prepend the > to the file name:


    ```

    open(FH,">filex");

    ```


    Opening a file with > overwrites the file; to append, use >>:


    ```

    open(FH,">>filex");

    ```


    +   You can open for both read and write by putting a + in front of

    the >, < or >>.


    +   If you use the | character at the end of the quoted string, Perl

    executes the string as a Unix command; subsequent reads from

    the filehandle read from the Unix command''s output.


    ```

    open(FH,"find .-print|");

    $first_file = <FH>;

    ```


    +   A pipe character at the beginning of the quoted string will open a

    pipe to the command''s STDIN:


    ```

    open (FH,"|sort > file_sorted");

    ```'
