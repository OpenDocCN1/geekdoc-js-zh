  md: "# Notes\n\n(taken from the Perl5 man pages)\n\nThis is a trivial example which\
    \ calls a subroutine, PrintUID, to print out the UID of the process.\n\n```\n\
    sub PrintUID\n{\n    print \"UID is $\\n\";\n}\n```\n\nand here is the C to call\
    \ it\n\n```\nvoid\ncall_PrintUID())\n{\n    dSP;\n\n    PUSHMARK(sp);\n    perl_call_pv(\"\
    PrintUID\", G_DISCARD|G_NOARGS);\n}\n```\n\nSimple, eh. A few points to note about\
    \ this example.\nWe aren't passing any parameters to PrintUID so G_NOARGS can\
    \ be specified.\nIgnore dSP and PUSHMARK(sp) for now. We will be discussed in\
    \ the next example.\nWe aren't interested in anything returned from PrintUID,\
    \ so G_DISCARD is specified. Even if\nPrintUID was changed to actually return\
    \ some value(s), having specified G_DISCARD would\nmean that will be wiped by\
    \ the time control returns from perlcallpv. Because we specified\nG_DISCARD, it\
    \ is not necessary to check the value returned from perlcallsv. It will always\n\
    be 0.\nAs perlcallpv is being used, the Perl sub is specified as a C string.\n\
    \nNote: If you need to do this type of:\n\n+   1. Study the perl man pages for\
    \ perlcall(1) and perlapi(1).\n2. Very carefully work with the examples there.\n\
    3. Try to find someone to help you who has done this sort of thing before."
  merge: -1
