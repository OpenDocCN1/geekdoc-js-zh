  md: '# 184 Perl Programming


    # Notes


    ```

    #!/usr/bin/perl instance method

    #File: Name.pl


    package Name; # The name of a class


    sub new (# class method to create and return the reference to the "object"

    my $Class = shift @_; # first argument provided automatically by Perl

    my $this = {}; # create the reference to the anonymous hash

    bless $this, $Class; # bind the reference to the package (class) "Name"

    return $this; # return the reference to the caller as a scalar


    sub last_name (# instance method)

    $this = shift @_; # get the reference to the object which invoked me

    $$this(last_name) = shift @_; # assign to objects instance data


    sub first_name (# instance method)

    $this = shift @_; # get the reference to the object which invoked me

    $$this(first_name) = shift @_; # assign to objects instance data


    sub get_name (# instance method)

    $this = shift @_; # get the reference to the object which invoked me

    return $this(last_name); # return that object''s instance data


    1; # Return an arbitrary true value, so "require" doesn''t fail.


