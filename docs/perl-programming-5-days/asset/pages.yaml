  md: "# Process Creation with fork\n\n+   - The fork function in Perl calls the UNIX\
    \ fork(2) system call.\n\n+   - fork creates a new process as follows (this is\
    \ tricky):\n  - A (soon to be parent) process calls fork and enters the UNIX OS.\n\
    \  - UNIX allocates space for a new process (text and data segments).\n  - The\
    \ new text and data segments are initialized by copying the parent's segments.\n\
    \  - There are now two processes where before there was one.\n  - The processes\
    \ are identical except for their PIDs. The child has a new PID.\n\n+   - UNIX\
    \ returns from the fork call to the next line of code in the parent, just like\
    \ the return from any function call.\n\n+   - And UNIX “returns” from the fork\
    \ call to the child (who never really called fork) and begins execution of the\
    \ child at the next line of code."
