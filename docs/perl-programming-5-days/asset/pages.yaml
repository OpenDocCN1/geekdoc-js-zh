    \ ARE changing the value of the array that was passed. As we mentioned before\
    \ however, its size may not be changed.\n\n+   * Before references, the solution\
    \ to that problem was to pass a typeglob.\n\n```\n&some_sub (*a);\n...\nsub some_sub\n\
    \  local (**local_a) = @_;\n}\n```\n\nIn this way, changing @local_a is just like\
    \ changing the array that was passed.\n\n+   * What if you needed to pass two\
