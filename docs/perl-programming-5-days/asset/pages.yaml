  md: "# Notes\n\nThe child is an exact image of the parent except for its process\
    \ ID. The fork calls the child PID in the parent, and it returns zero in the child.\
    \ Since the code being executed by the two process is identical, and both return\
    \ from the fork, the return value from the fork is how each of them determines\
    \ whether they are the parent or the child.\n\nYou may be wondering how useful\
    \ it is to create a second process that is an exact image of the parent. Well,\
    \ the child branch after the fork will not be executed by the parent, so that\
    \ code can do child-related tasks, the parent branch can do parent related tasks.\
    \ This is how the examples that were discussed a few pages ago are implemented.\n\
