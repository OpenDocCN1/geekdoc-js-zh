  md: "# Special Characters\n\n+   * In an RE, a . matches *any* single character\
    \ (except newline)\n\n+   * You can narrow things down by using other special\
    \ characters.\n\n+   * \\w (word character) matches any character in the set A-Z,\
    \ a-z, 0-9, or _.\n  - \\W matches any character not in that set.\n\n+   * \\\
    s (whitespace character) matches a newline, carriage return, formfeed, tab, or\
    \ space character.\n  - \\S matches any non-space character.\n\n+   * \\d (digit\
    \ character) matches a digit, 0-9.\n  - \\D matches any non-digit character.\n\
    \nThe above are character classes; the generalized form of an RE class is a list\
    \ of characters in brackets, [].\n\n[A-Za-z_0-9] is the same as \\w.\n[\\n\\r\\\
    f\\t ] is the same as \\s.\n[0-9] is the same as \\d.\n\n+   * If the first character\
    \ after the opening [ is a caret, ^, then the character class matches any character\
    \ *not* listed.\n  - [^A-Za-z_0-9] is the same as \\W - any character other than\
    \ these.\n  - [^AEIOU ] matches any character that *isn't* a capital vowel."
