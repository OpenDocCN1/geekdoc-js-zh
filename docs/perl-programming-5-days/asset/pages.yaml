- img_proc: true
  md: "# Quantifiers (*, +, ?, {})\n\n+   * *Quantifiers* match a sequence of a single\
    \ character, of members of a character class, or of a subexpression.\n* * is the\
    \ least specific, matching any number, even zero, of its atom.\n* `\\d*` matches\
    \ any sequence of digits, or none at all.\n* `.*` is the general-purpose, match-anything-at-all\
    \ RE.\n* + matches one or more of its atom.\n* `\\d+` matches a sequence of digits.\n\
    * ? matches either zero or one of its atom; nothing else.\n* You can specify any\
    \ quantity of an atom in a RE using {}.\n  * `{n}` matches exactly *n* occurances\
    \ of an atom.\n    * `\\w\\d{4}\\s` matches a word character, followed by exactly\
    \ 4 digits, followed by a whitespace character.\n  * `{n,}` matches *n* or more\
    \ occurances of an atom.\n    * `\\w\\d{4,}\\s` matches a word character, followed\
    \ by at least 4 digits, followed by a whitespace character.\n  * `{n,m}` matches\
    \ at least *n* but no more than *m* occurances of an atom.\n    * `\\w\\d{4,7}\\\
    s` matches a word character, followed by 4, 5, 6, or 7 digits, followed by a whitespace\
    \ character."
