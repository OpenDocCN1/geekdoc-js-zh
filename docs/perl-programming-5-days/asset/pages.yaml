  md: "# Multiline REs\n\n+   You may use a single scalar variable to hold several\
    \ lines of text.\nn  - In general, a *line* is simply a string of characters ending\
    \ in a newline character.\n  - A scalar containing a string with embedded newline\
    \ characters can be called a *multiline* buffer.\n\n+   Normally, ^ or $ match\
    \ only the beginning or ending (before the first character or after the last non-newline\
    \ character, respectively) of the string being searched.\n\n+   When you use the\
    \ `m` modifier, ^ will match:\n  - The beginning of the string\n  - The position\
    \ immediately after any newline character embedded in the string (the beginning\
    \ of the next \"line\").\n\n+   When you use the `m` modifier, $ will match:\n\
    \  - The ending of the string.\n  - The position immediately before any newline\
    \ character embedded in the string (the end of the current \"line\").\n\nRead\
    \ the discussion of multiline vs. single-line REs in the Perl book."
