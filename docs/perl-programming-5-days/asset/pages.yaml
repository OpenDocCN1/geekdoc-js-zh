  md: "# Notes\n\nOften, the 'next' loop control statement is used when the loop is\
    \ complicated, and another level of nesting would be too deep.\n\n```\nopen (NUMBERS,\
    \ \"numfile\");\nwhile (<NUMBERS>) {\n    next if ($_ < 0);      # Skip negative\
    \ numbers\n    ...                   # Process positive numbers\n}\n```\n\nThe\
    \ most commonly used loop control statement is 'last'. This breaks out of a loop\
    \ and resumes execution at the next statement after the loop. Assume we are to\
    \ process a file till we reach the first negative number.\n\n```\nopen (NUMBERS,\
    \ \"numfile\");\nwhile (<NUMBERS>) {\n    last if ($_ < 0);      # Bail if we\
    \ see a negative\n    ...                   # Process positive numbers\n}\n#--\
    \ resume execution here\n```\n\nAn example of a LABEL follows. This example opens\
    \ a file named 'control' which contains names of files, one per line, that contain\
    \ numbers, one per line. The outer loop, labeled CONTROL; iterates through the\
    \ numbers while inner loop processes numbers (just prints them) from each numbers\
    \ file till it finds a negative number in a file, in which case the inner loop\
    \ closes the file and bombs out to the outer loop to open another numbers file.\n\
    \n```\n#!/usr/bin/perl\n#File: control.pl\n\nopen (CONTROL, \"control\") || die\
    \ \"Control file opened failed\\n\";n\nCONTROL:\nwhile ($numfile = <CONTROL>)\
    \ {      # Get name of next number file\n    print $numfile;\n    chomp $numfile;\n\
    \    open (NUMBERS, $numfile);\n    while (<NUMBERS>) {\n        if ($_ < 0) {\
    \           # Next file if negative\n            close(NUMBERS);\n           \
    \ next CONTROL;\n        }\n        print $_;               # Process positive\
    \ numbers\n    }\n}\n```"
