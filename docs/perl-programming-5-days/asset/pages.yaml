  md: '# "Compiling" Perl - dump() and undump


    +   - There is no true compiler for Perl.

    - One has been under development for some time; as of early 1998 (Perl5.004),
    it was in "alpha-3" release.

    - The dump() function can be used to produce a file which holds the binary image
    of a running Perl program.

    - dump() actually causes an immediate core dump of the Perl process.

    - The core file can then be executed by the undump program (assuming one exists
    for your host platform.).

    - This can, if handled properly, work like a compiled program, however, be aware
    that it is not as fast as true compiled C , and there can be significant side-effects.'
  merge: -1
