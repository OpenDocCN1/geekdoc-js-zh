  md: '# Notes


    Perl also supports C''s ternary operator, ?::


    It works similarly to an if-then-else construct, except it returns a value. The
    line


    ```

    $y = ( $x ? 5 : 10 );

    ```


    will evaluate $x as true or false. If $x is true, the ternary operator returns
    5 which is then (in our example) loaded into $y. If $x evaluates false, 10 would
    be returned instead.


    In Perl5, the ternary operator is now a legal lhs (left hand statement) as follows:


    ```

    ( $check ? $true : $false ) = ''abc'';

    ```


    Perl will test the value of $check. If it is true, the string ''abc'' will be
    loaded into $true.


    If $check evaluates false, $false will be loaded with ''abc''. Pretty weird!'
