  md: '# 22 Perl Programming


    # Notes


    It is true even in a multitasking operating system that only one program at a
    time can actually execute CPU instructions. However most programs request operating
    system services that would put the entire computer into a state in which it waits
    for an outside event to occur. In such states, the CPU becomes totally idle and
    has nothing to do on behalf of the occur until the outside event occurs. "Outside
    events" are called I/O events, which take place much more slowly than CPU execution.


    A multitasking operating system enables a program to run while others are waiting
    for I/O, thus getting more work done in the same amount of time than a sequencing
    singletasking operating system.


    From a higher level point of view, here are examples of the use of multitasking:


    +   1. Client/server - a server waits for a client request, then creates another
    process to fulfill the request while the server goes back to wait for another
    client request. This capability is important because the server may not have enough
    time to completely fulfill the first client request before another comes along,
    and thus client requests would be ignored.


    +   2. An application separates data collectors from the data processors (processing
    could mean simply saving data or it could mean performing calculations, lookups,
    translations, etc.)


    +   3. Existing programs can be reused (the UNIX "Toolbox Methodology") by running
