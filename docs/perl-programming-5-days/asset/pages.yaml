  md: '# One-Way Data Flow - Pipes


    +   - A UNIX pipe is a one-way data channel between two processes.

    - The processes must have a common ancestor (i.e., parent and child, or siblings).

    - Pipes are written to and read from through file descriptors (filehandles in
    Perl).

    - You create the pipe in the parent, allocating a ''write'' and a ''read'' filehandle,
    then you `fork` with inheritance of filehandles.

    - One of the processes writes to the pipe ''write'' filehandle, and the other
    reads from the pipe ''read'' filehandle.

    - Perl provides the `pipe()` function to create the pipe and attach the two filehandles.


    An example with diagrams in shown on the next pages ....'
