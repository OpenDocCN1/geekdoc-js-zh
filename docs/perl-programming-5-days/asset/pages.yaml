    \ to worry about fields overflowing\n  - Flexible format can be easier for users\
    \ and programmers\n\n+   * Disadvantages of variable-length data\n  - Delimiters\
    \ take storage and must be scanned for\n  - Binary data could be mistaken for\
    \ a delimiter\n  - Direct (random) access is not possible\n\n+   * Advantages\
    \ of fixed-length data\n  - No time or storage wasted on delimiters\n  - Records\
    \ can be located by calculation and seeking\n  - Binary data presents no problem\n\
    \n+   * Disadvantages of fixed-length data\n  - Maximum size of fields must be\
