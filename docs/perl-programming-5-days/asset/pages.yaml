  md: '# Notes


    Magic: If the variable being incremented (not decremented) is:


    +   1. A non-numeric string,


    +   2. Is either all alphas or alphas followed by numerics


    then it will be magically autoincremented as a string with carry.


    The "magic" version of the autoincrement operator is used when the variable being
    autoincremented is a string that meets the stated conditions. The operator will
    increment the string variable by treating alph characters as sort of a base-26
    number system with letters serving as numbers. The Camel book''s examples on page
    79 demonstrate this admirably. They look kind of like this:


    ```

    $var = ''99''; print ++$var;      # Prints 100 (non magic)

    $var = ''x5''; print ++$var;       # Prints x6

    $var = ''ab''; print ++$var;      # Prints ac

    $var = ''az''; print ++$var;      # Prints ba

    $var = ''ZZ''; print ++$var;      # Prints AAA

    $var = ''Zz''; print ++$var;      # Prints AAa

