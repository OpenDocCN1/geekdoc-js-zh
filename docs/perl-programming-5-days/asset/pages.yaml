  md: '# Notes


    in


    $c = [ ''Buzz'', ''Kiki'' ];


    $c is assigned to the anonymous array created by [''Buzz'', ''Kiki'']. That is,
    [''Buzz'', ''Kiki''] creates an array value that has no name - but, isn''t that
    just a list? No, it''s different: the composer operator, yields a *reference*
    to the array that has no name.


    $c = ( ''Buzz'', ''Kiki'' );


    creates a list and evaluates it in scalar context (which gives that what?), assigning
    the value to $c.


    @cat = ( ''Buzz'', ''Kiki'' );


    creates a list and evaluates it in list context, assigning it to the named array
    @cat - a normal array.


    $c = [ ''Buzz'', ''Kiki'' ];


    creates an array with no name, and assigns a *reference* to the array value to
    $c. There is no array name (beginning with @) for this array. $c is the only reference
    to this array data. We could assign the array data referenced by $c to an array
    variable:


    @kiki = @sc; # @sc is the array data pointed to by the reference in $sc


    Now we have a normal array, @kiki, like any other.


    So we see how


    $c = [ ''Buzz'', ''Kiki'' ];


    and


    $c = ( ''Buzz'', ''Kiki'' );


    are different. So, what happens if we do this?


    $c = \( ''Buzz'', ''Kiki'' );


    Shouldn''t this create a reference to the list value? Answer: no. This is actually
    Perl shorthand for


    $c = \( ''Buzz'', ''Kiki'' ); # A list of references to constants.


    That is, a list (of references) in scalar context.


    @kiki = \( ''Buzz'', ''Kiki'' ); # Same as @kiki = \( ''Buzz'', ''Kiki'' )


    creates an array of references, which is what we''ll be talking about in a page
    or two...


