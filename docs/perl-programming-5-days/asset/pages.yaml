  md: '# 282 Perl Programming


    # Notes


    The following is the list of bitmask values Perl5 recognizes for the -D flag.


    +   - 1 p Tokenizing and Parsing

    - 2 s Stack Snapshots

    - 4 l Label Stack Processing

    - 8 t Trace Execution

    - 16 o Operator Node Construction

    - 32 c String/Numeric Conversions

    - 64 P Print Preprocessor Command for -P

    - 128 m Memory Allocation

    - 256 f Format Processing

    - 512 r Regular Expression Parsing

    - 1024 x Syntax Tree Dump

    - 2048 u Tainting Checks

    - 4096 L Memory Leaks (not supported anonymous)

    - 8192 H Hash Dump --- usvalues())

    - 16384 X Scratchpad Allocation

    - 32768 D Cleaning Up


    The letters are also understood by -D and can be invoked in place of the bitmasks.
    For example, to run a script and see memory allocation as it occurs, run


    ```

    perl -D128 ddemo.pl

    ```


    To also see string to numeric conversions, you would use 128 + 32 or


    ```

    perl -D160 ddemo.pl

    ```


    You can also use the letters, as in


    ```

    perl -Dcm ddemo.pl

    ```


    The -D flag can also be set in your script at the interpreter line:


    ```

    #!/usr/bin/perl -D160

    ```


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_283_0.png)'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# The -w and -D Flags


    +   - Perl can be invoked with many options (flags) set from the command line.


    +   - The -w flag makes Perl print out warnings (non fatal errors) as it runs
    a program.


    +     - These are often very helpful in figuring out better ways to build a program.


    +     - The Perl authors highly recommend (just about demand) that you use -w
    whenever possible.


    +   - The -D flag allows you to see at run time many facets of what Perl is doing
    internally.


    +     - -D takes its argument a bitmask (in decimal) which tells it what to print
    out.


    +     - The perl executable must have been built with the DEBUGGING option.


    +   - For more information on these and other flags, see the Switches section
    of the Social Engineering chapter in the Camel book.'
