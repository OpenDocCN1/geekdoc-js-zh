  md: '# What Gets Created and Installed?


    +   - As of Perl5.003, the installation creates:


    +   - The Perl executable, `perl`.


    - This is commonly, though certainly not necessarily, installed in `/usr/local/bin`.


    +   - The Perl runtime libraries.


    - For example, `/usr/local/lib/perl5`.


    +   - The Perl documentation in a portable, convertible format (pod, "Plain Old
    Documentation").


    - Scripts can turn these files into UNIX manpages, HTML, and other formats.


    +   - The libraries include


    +   - Important common libraries and modules.


    +   - Optional modules selected in `Configure`.


    +   - A place to install additional modules you download or create.


    - These go under the `site_perl` subdirectory.


    +   - The Perl documentation `.pod` files.'
