  md: '# Notes


    The pattern we are searching for is the three character sequence ''zzz''. If the
    string that we are searching through contains AT LEAST three z''s in a row ANYWHERE
    in the string, then we say "We have a match." The match operator will return a
    true value (for conditional testing) if there is match, false otherwise.


    The ''=~'' operator is known as a ''pattern bind'' operator. When you use the
    ''=~'' operator to specify a search string other than the default _ then the expression:


    ```

    $string =~ /pattern/

    ```


    returns true or false, depending on whether the pattern is in the string or not.


    The slashes that delimit the pattern can be replaced by any other pair of characters
    (as long as you use the same character to start and end), but if you don''t use
    slashes then you must use the ''m'', as in m;pattern. When would you use other
    than slashes?


    There is also an /i modifier which can be used with a pattern match, as in


    ```

    if (m/zzz/i) {

    ```


    In this case, the match will be case insensitive - i.e. - it would match zzz or
    ZZZ or ZzZ, etc.'
