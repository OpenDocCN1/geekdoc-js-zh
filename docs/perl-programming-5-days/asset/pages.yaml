- img_proc: true
  md: '# 262 Perl Programming


    # Notes


    From the Perl 5.002 README document:


    # Installation


    +   1) Run Configure. This will figure out various things about your system. Some
    things Configure will figure out for itself, other things it will ask you. It
    will then proceed to make config.h, config.sh, and Makefile. You may have to explicitly
    say -sh Configure to ensure that Configure is run sh. If you''re a hotshot, run
    Configure -d to take all the defaults and not edit config.sh to patch up any flaws.


    Configure supports number of useful options. Run Configure -h to get a listing.
    To compile with gcc, for example, you can run Configure -Dcc=gcc, or answer ''gcc''
    at the cc prompt.


    +   2) Glance through config.h to make sure system dependencies are correct. Most
    of them should have been taken care of by running the Configure script.


    If you have any additional changes to make to the C definitions, they can be done
    in cflags.Sh. For instance, to turn off the optimizer in tome.c, find the line
    in the switch structure for tome.c and put the command optimize=''-g'' before
    the ;; To change the C flags for all the files, edit config.sh and change either
    Configure or optimizer.


    +   3) make


    This will look for all the includes and modify Makefile accordingly. Configure
    will offer to do this for you.


    +   4) make


    This will attempt to make perl in the current directory.


    If you can''t compile successfully, try adding -DCRIPPLED CC flag. (Just because
    you get no errors doesn''t mean it compiled right!) This simplifies some complicated
    expressions for compilers that get indigestion. If that has no effect, try turning
    off optimization. If you have missing routines, you probably do need to add some
    library or, or you need to undef some feature that Configure thought was there
    but is defective or incomplete.


    +   5) make test


    This will run the regression tests on the perl you just made. If it doesn''t say
    "All tests successful" something went wrong. See the README in the t directory.
    Note you can''t run it in background because this disables opening of /dev/tty.
    If "make test" bombs out, cd to the t directory and run TEST by hand to see if
    it makes any difference. If individuals test bomb, you can run them by hand, e.g.,
    ./perl op/groups.t


    +   6) make install


    This will put perl into a public directory (such as /usr/local/bin). It will also
    try to put the man pages in a reasonable place. It will not root the man page,
    however. You may need to root to do this. If you are not root, you must root the
    directories in question and you should ignore any messages about not working.


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_263_0.png)'
  merge: -1
  pgno: 263
