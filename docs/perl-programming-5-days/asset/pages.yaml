  md: '# Notes


    Actually to be more precise, this is "a hash of references to hashes of references
    to hashes."


    So, we started with a two-dimensional array (that is, an array of array references,
    or "array of arrays"). Then we created a hash of array references ("hash of arrays".)
    We changed that to a hash of hash references ("hash of hashes"), and finally,
    a hash of references to hashes of references to hashes ("hash of hashes of hashes").


    In each of these cases, the values in our data structure were all of the same
    type. For example, in the hash of arrays, all the hash values were references
    to arrays. But an array or hash value can be a reference to anything, regardless
    of what the other values are. So, we could create a hash whose values include
    actual scalars, references to scalars, references to arrays, references to hashes,
    references to subroutines, and so on.


    We could, for example, write subroutines and create variables, arrays, and hashes,
    all relating to pets. We could then create one big hash whose values are references
    to all these things. Of course, the subroutines and data would all be global to
    our program, but we could easily refer to the whole collection by referring to
    the hash; we could efficiently pass a reference to the hash to some subroutine
    which could then use any of the hash''s data or subroutines.


    Maybe you can see where all this is heading...


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_167_0.png)'
