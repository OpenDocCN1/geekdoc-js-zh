- img_proc: true
  md: '# Operators, Functions and Precedence


    +   - Perl has these “named unary operators” (NUO) and “list operators” (LO) that
    can act like operators or functions. They are subject to precedence evaluation
    in expressions.


    +   - If you use the function form of a NUO or LO by putting parentheses around
    its arguments, then it acts like a function with respect to precedence, and its
    precedence goes TO THE TOP.


    +   - Examples


    ```

    sqrt 4 * 4;               # * is higher than NUO:   4

    sqrt (4) * 4;             # ( is higher than *:   8

    sqrt(4) * 4;               # Look more like a function?

    ```


    ```

    rand $var1 * $var2;      # Do multiply first

    rand($var1) * $var2;      # Do multiply second

    ```


    ```

    @a = ("a","c",sort("e","b"),"a","d");

    print @a,"\n\n";               # Print acabde

    @a = ("a","c",sort("e","b"),"a","d");

    print @a,"\n\n";               # Print acbead",

    ```


    +   - You can use parentheses to remove doubt and clarify your code.


    +   - The rule is:


    +     - If it looks like a function, it *is* a function.'
