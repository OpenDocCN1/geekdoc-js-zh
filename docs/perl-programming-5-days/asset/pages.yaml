  md: "# require vs. use\n\n+   - Subroutine and variable definitions may appear in\
    \ a file outside your current Perl program source file.\n\n+   - This is a functionality\
    \ similar to \"#include\"s in C and C++.\n\n+   - In its most basic form, the\
    \ \"remote\" file may be used with either `require` or `use`.\n\n```\nrequire\
    \ \"filename\";      # causes \"filename\" to be\n                          #\
    \ loaded and run at runtime.\n```\n\n```\nuse filename; # causes filename.pm to\
    \ be\n              # loaded and run at compile time.\n```\n\n+   - You may `require`\
    \ any filename at all.\n\n+     Different packages may be declared and used in\
    \ the file and the filename is irrelevant (though it typically has .pl appended\
    \ to it to identify it as a perl library file).\n\n+   - The `use filename;` declaration\
    \ expects .pm (perl module) appended to `filename`.\n\n+     At least one package\
    \ within the file must be the same name as the file's basename (sans .pm)."
