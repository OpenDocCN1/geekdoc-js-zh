  md: "# Inheritance, the \"is-a\" Relationship\n\n+   - Inheritance is one of the\
    \ most important features in the OO model.\n- It allows us to use part or all\
    \ of another class's methods and add others to make our new class unique - reusability!\n\
    \nClass: Radio\nRadio has buttons, a speaker, a dial, and a receiver.\nRadio has\
    \ controls for volume, select station, on/off.\n\nClass: Stereo Radio (descendant\
    \ or subclass) of the Radio class)\nHas all the features of radio, PLUS another\
    \ speaker.\nStereo Radio has controls for volume, select station, on/off\nPLUS\
    \ speaker balance and FM Stereo select.\n\nClass: Stereo Radio w/Cassette Player\n\
    Has all the features of a Stereo Radio PLUS for the Cassette functions. Stereo\
    \ Radio w/Cassette Player has controls for volume, select station, on/off, speaker\
    \ balance and FM Stereo select PLUS cassette, play, fast forward, rewind, and\
    \ eject.\n\nRadio is the Base Class and Stereo Radio is Radio.\nStereo Radio w/Cassette\
    \ Player \"is-a\" Stereo Radio.\n\n+   - In Perl, the descendant class simply\
    \ names its ancestor classes in a special array named @ISA, and Perl will Look\
    \ in those classes for methods not found in the descendant.\n  - The descendant\
    \ should create an ancestor object in its new."
  merge: -1
