  md: '# Notes


    We could have created @pets:


    ```

    $c = \cat; $d = \dog; $f = \fish;

    @pets = ( $c, $d, $f );

    # List of scalars containing array references

    ```


    or,


    ```

    $c = [ ''Buzz'', ''Kiki'' ];

    $d = [ ''Rex'', ''Fido'', ''Bowser'' ];

    $f = [ ''Wanda'', ''Mr. Limpet'' ];

    @pets = ( $c, $d, $f );

    # List of scalars containing anonymous array references

    ```


    or,


    ```

    @pets = ( [@cat], [@dog], [@fish] ); # List of anonymous array references, items
    copied

    ```


    or even,


    ```

    @pets = ( [''Buzz'', ''Kiki''], [''Rex'', ''Fido'', ''Bowser''], [''Wanda'', ''Mr.
    Limpet''] );

    ```


    In every case, the @pets array contains three scalars, each of which is a reference
    to an array value.


    Consider the first example:


    ```

    $c = \cat; $d = \dog; $f = \fish;

    @pets = ( $c, $d, $f ); # List of scalars containing array references

    ```


    Now, $c is a reference to an array. We can dereference it, and get an element
    of the referenced array, like this:


    ```

    $x = $$c[1];

    $x = $$c[1]; # Same as $x = $$c[1]; the braces are optional in this case.

    ```


    Recall the infix dereference operator ->, which is another way to dereference
    an array or hash:


    ```

    $x = $c->[1]; # Same as $x = $$c[1]

    ```


    Now, nothing changes when the variable containing the reference to the array or
    hash is itself an array element, though you may need some braces


    ```

    $x = $$pets[0][1]; # Braces necessary, so that $pets[0] is dereferenced first.

    ```


    or, using the infix operator:


    ```

    $x = $$pets[0]->[1]; # $pets[0] is a reference to @cat, just as $c is.

    ```


    Finally, you can leave off the infix operator:


    ```

    $x = $$pets[0][1]; # Say... this is just a two-dimensional array!

    ```


    Why? Between each pair of adjacent brackets, the infix dereference operator is
    implied automatically.


    In fact, what we call a “two-dimensional array” is actually just an array of array
    references!


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_163_0.png)'
