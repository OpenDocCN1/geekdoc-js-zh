  md: '# Notes


    Many operators do not care what context they are being evaluated in and in will
    always return a scalar, even in an array context.


    For operators that care, the Perl book gives rules on how to determine if an operator
    "know" it is in an array or scalar context, and thus will return a LIST or a scalar.


    RULES:


    +   - Assigning to a scalar variable evaluates the right-hand side in a scalar
    context, while assigning to an array or to a list of scalar variables evaluates
    the right-hand side in an array context.


    +   - If a caring operator is being evaluated inside a LIST, then it will return
    a LIST, otherwise it will return a scalar.


    You can force an expression to be evaluated in a scalar context with the `scalar`
    operator:


    ```

    @a = ("one", "two", "three\); # @a is an array,

    @b = @a;                   # List context

    ```


    @b is now a copy of @a. But,


    ```

    @b = scalar @a;               # Scalar context

    ```


    The scalar value of @a (what''s an array''s scalar value?) is assigned as @b''s
    first and only element.'
