- img_proc: true
  md: '# Notes


    There is a lot of confusion whether Perl is a compiled or interpreted language.
    Most interpreted languages are very poor on performance due to their interpreting
    and running each line of a program in turn, as in shell scripts. Perl runs interpretively,
    in that the programs you run are written and run as "source" code, and Perl has
    the capability to modify itself programmatically as it runs. Perl runs much faster
    than most other interpreters, however, due to its capability to "pre-compile"
    and tokenize major portions of your program before it actually runs the script.


    Since much of the functionality of Perl maps directly onto C function calls, it
    makes sense for Perl to simply call the C library routines as it needs them. This
    "compilation" of Perl code dramatically speeds up Perl programs, making them,
    in some cases, almost as fast as truly compiled C programs.


    Don''t be confused by this and think that this means there is a "Perl compiler"
    which can create an actual binary executable (file) which can then be loaded and
    run like cat or grep; there is a way to make Perl into doing something like this,
    but it''s not efficient or easy (we will talk about this later in the course).
    Perl programs always run under the perl executable on your host computer. There''s
    no way around that.


    This means that, while Perl programs are fast to execute, and very fast to develop
    (in comparison to C, for example), always remember that you distribute Perl programs,
    you are distributing clear source code which the user can read, modify, and easily
    break.'
  merge: -1
  pgno: 15
- img_proc: true
  md: "# What is Perl?\n\n+   - Perl is an interpreted programming language.\n- Its\
    \ strengths are:\n  - Scanning and processing large amounts of text efficiently.\n\
    \  - Formatting and printing reports easily.\n  - Providing tremendous built-in\
    \ \"parsing\" functionality to reduce the need for ancillary code in a program.\n\
    \  - Great extensibility via libraries and modules.\n- Perl contains the following:\n\
    \  - Most of the statements and operators of C.\n  - Many of the library functions\
    \ provided in a C environment.\n  - Built-in functionality of `awk`, such as automatic\
    \ record input and field splitting (but much more of this than `awk`).\n  - Extended\
    \ regular expressions found in `awk`, with Perl extensions.\n  - The file manipulation\
    \ capabilities of shell scripts.\n  - Process control capabilities of UNIX."
  merge: -1
  pgno: 16
- img_proc: true
  md: "# Notes\n\nSeveral ways to run Perl programs:\n\n+   1. For short (one-liner)\
    \ programs, you can use the -e command line option to write and execute the program\
    \ on the command line:\n\n```\n$ perl -e 'foreach (@ARGV) {system(\"ls -ld $\\\
    $\") if -d}' *\n```\n\nBy the way, similar output will result from:\n\n```\n$\
    \ ls -ld * |grep ^\n```\n\n+   2. Use an editor such as vi and type the program\
    \ into a file, save prog.pl. Then type the following command at the shell prompt\
    \ (the prompt is a $):\n\n```\n$ perl prog.pl *\n```\n\nThe one-liner above might\
    \ look like this in prog.pl:\n\n```\nforeach (@ARGV) {\n  system(\"ls -ld $\\\
    $\") if -d;\n}\n```\n\n+   3. Use an editor to type a Perl program into a file,\
    \ insert a first line into the file so it looks like this:\n\n```\n#!/usr/bin/perl\n\
    foreach (@ARGV) {\n  system(\"ls -ld $\\$\") if -d;\n}\n```\n\nMake the program\
    \ executable:\n\n```\n$ chmod +x prog.pl\n```\n\nRun the program by just typing\
    \ its name, with command line arguments if any, which in this example are the\
    \ names of all files in the current directory:\n\n```\n$ prog.pl *\n```\n\nThis\
    \ method of running Perl programs (or any interpreted programs, such as awk and\
    \ shell programs) works on systems that support the concept of \"interpreter files.\\\
    \ The FIRST TWO characters in the file must be #!, and the pathname of the interpreter\
    \ must follow on the same line. See exec (2).\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_17_0.png)"
  merge: -1
  pgno: 17
- img_proc: true
  md: "# Running Perl Programs\n\n+   - Perl programs can be run several ways.\n-\
    \ The simplest way is to put the program in a file, say `prog.pl`, and type:\n\
    \n  $ perl prog.pl\n\n(The dollar sign here is the shell prompt)\n- This will\
    \ invoke the Perl interpreter, `perl`, which will interpret the program in the\
    \ file `prog.pl`.\n  - The `.pl` extension is not required; it's just a convention\
    \ some Perl programmers follow.\n- Some other ways to run Perl programs are described\
    \ on the facing page."
  merge: -1
