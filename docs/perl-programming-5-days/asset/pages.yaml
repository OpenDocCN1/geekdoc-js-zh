  md: '# Notes


    On NT, only a subset of the standard Perl5 Kit has been implemented. This is because
    there is usually no direct equivalent of the functionality in Windows NT.


    Any functions marked with ''***'' will not warn that they are not implemented.
    Providing this ''warn facility'' would require changes to the Perl 5 UNIX Distribution.
    Following are the unsupported functions:


    +   Network routines

    getnetbyname() getnetbyaddr() getnetent() getproto() getserv()

    sethostname() setnetent() setproto() setserv() endhostname()

    endnetent() endproto() endserv() socketpair()


    +   System V compatible IPC routines

    msgctl() msgget() msgrcv() msgsnd() semctl() semget() semop()

    smctl() shget() shmread() shmwrite()


    +   I/O routines

    **ioctl() **select($w, $x, $y, $z)

    The single argument version of this function HAS been implemented.


    +   Filesystem routines

    **chmod() chroot() **fcntl() flock() link() **lstat()

    **readlink() symlink() **sysread() **syswrite() **umask() **utime()


    +   Security-related routines

    crypt() **login() getpgrp() getppid() getpriority() getpwnam()

    getgrnam() getpwuid() getgrid() getpwent() getgent() setpwuid()

    setgroup() endent() endgr() setpgrp()


    +   Process-related routines

    fork() kill() pipe() setpriority() times()

    wait() waitpid()


    +   Miscellaneous routines

    alarm() **close() **dbmopen() **dump() syscall()'
