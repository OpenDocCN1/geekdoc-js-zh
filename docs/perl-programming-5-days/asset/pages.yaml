  md: "# Classes, Objects, and Methods in Perl\n\n+   - In Perl, a Class is simply\
    \ a package which provides methods to deal with objects.\n\n```\npackage Name;\
    \ # The name of a class\n```\n\n+   - In Perl, an Object is a reference to a \"\
    thing\" which knows it belongs to a particular package (that is, a Class) - the\
    \ bless operator tells it which package it belongs to.\n\n+   - The \"thing\"\
    \ may be an anonymous hash, anonymous array, scalar, or anonymous subroutine.\n\
    \n+   - The new method returns a reference to a \"thing\", most typically an anonymous\
    \ hash (an easily extensible data structure).\n\n```\nsub new\n    $class = shift\
    \ @_; # The first argument is provided\n    $this = {}; # Creates a reference\
    \ to an\n                # empty hash\n    bless $this, $class; # Binds the reference\
    \ to the\n                         # class (package) name\n    return $this; #\
    \ Returns the reference to the\n                  # caller for assignment\n```\n\
    \n+   - A Method is a subroutine that expects an object reference package name\
    \ as its first argument\n\n+   - This argument is provided automatically."
