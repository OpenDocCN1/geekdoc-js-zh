  md: '# File Descriptor Inheritance


    +   - In UNIX, when a process forks or execs, all open files are still open in
    the child.


    +   - In Perl, a fork leaves all filehandles open in the child also, because the
    child is an exact image of the parent.


    +   - In Perl, when a program execs, the filehandles STDIN, STDOUT, and STDERR
    are still open in the child. Others are not.


    +   - This mechanism allows a parent to attach any of STDIN, STDOUT or STDERR
    to a file on behalf of a child.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Notes


    Several crucial mechanisms play together here. First, we count on UNIX using the
    next lowest numbered available file descriptor whenever we open a file. This implies
    that if file descriptor 0, STDIN, is available, i.e., no file is open on STDIN,
    then if we open a file it will become STDIN! Second, when we fork a new process
    and then exec a new process into that process, its STDIN will be attached to whatever
    file we have opened on STDIN, because the file descriptor table is inherited across
    a fork, and is loaded (in Perl) across an exec with the current STDIN, STDOUT,
    and STDERR of the child.


    The ability to duplicate an open file descriptor table entry into another entry
    serves a very useful purpose: it allows you "move" a file descriptor from STDIN,
    STDOUT, or STDERR (0, 1, or 2) to another descriptor and "move" it back later.
    Our purpose is to save the entry for the open file attached to say, STDIN, then
    open another file on STDIN, and later put the original file back. The reason we
    wish to open another file on STDIN is to setup the STDIN for a child BEFORE we
    fork or exec.'
  merge: -1
