  md: '# Notes


    Perl5 and Functions:


    One of the changes in Perl5 is that all functions have become either Named Unary
    Operators or List Operators. There are no functions in Perl5!


    All this really means is for everything that was a function in Perl4, in Perl5
    parentheses are optional. In normal programming, most people use the parentheses
    just before, and the precedence issue still holds true. Don''t be surprised to
    see things like


    ```

    push @array, @array2;

    ```


    (in Perl4 you had to use parentheses around the arguments)


    We will still refer to many of these as "functions" (everyone does).


    Named Unary Operators:


    | alarm getpgrp localtime readlink |

    | caller gethostbyname log scalar |

    | chdir getnetbyname ord sin |

    | cos getnetbyname oct sleep |

    | chroot gtime require sqrt |

    | exit hex reset srand |

    | eval int rand umask |

    | exp length rmdir |


    The named unary operators and list operators can be used with or without parentheses
    around their arguments. When parentheses are used, they look like functions. In
    isolation, their use is equivalent to operators or functions. But in an expression,
    the precedence changes drastically when parentheses are put around the arguments.'
  merge: -1
