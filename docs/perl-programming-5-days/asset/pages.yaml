  md: "# Notes\n\nThere is a possible problem if you use an array to off-load @_ inside\
    \ the subroutine. Consider the following example:\n\n```\nsub foo {\n  (@x,@y)\
    \ = @_;\n  return @y;\n}\n```\n\nWe intend to be able to call the sub as follows:\n\
    \n```\nprint (&foo(@array1,@array2));\n```\n\nWe intend to have the sub return\
    \ the second array, but it doesn't. The problem is that Inside the sub, @x doesn't\
    \ know when to stop getting scalars from @_, so it soaks up all of them! We have\
    \ to add an additional argument at the front of the subroutine to pass the actual\
    \ size of the first array passed in:\n\n```\nsub foo {\n  ($size,@y) = @_;\n \
    \ @x = splice(@y,0,$size);\n  return @y;\n}\n```\n\nShortly, we will see a better\
    \ way to accomplish this."
