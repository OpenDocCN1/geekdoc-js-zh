  md: '# RE Options


    +   - Perl provides a variety of options (or *modifiers*) to the pattern-matching
    operators.


    +   - List options after the pattern delimiters.


    +   - Ignore case in searches.


    +   m/dobbs/i Dobbs, dobbs, DOBBS, dobBS, **etc.**


    +   - All occurrences (**global**), not just the first found in the string.


    +   s/NT/UNIX/g Change *all* NT to UNIX.


    +   - Treat string being searched as a **multi-line buffer** (more on this a moment).


    +   - Evaluate expression and use its value in substitution (`s///e`).


    +   - Use extended (Perl 5.002+) regular expressions (stay tuned...)


    # Notes


    Remember any non-word character is valid as a pattern delimiter.


    ```

    m:dobbs:i

    m|dobbs|i

    m!dobbs!i

    ```


    Bracketing-characters `{}, []()` can make a pattern more readable.


    ```

    m{dobbs}i

    ```


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_203_0.png)'
