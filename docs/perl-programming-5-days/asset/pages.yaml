  md: '# Notes


    The @ARGV array holds the command line arguments. The foreach loop assigns the
    value of the arguments to $word, one argument for each iteration of the loop.

    The line:


    ```

    open(PIPE,"find. -print |") || die "Pipe open failed";

    ```


    assigns the PIPE filehandle to be connected to output of the pipe, and each time
    the input operator <> operates on the filehandle, information is read from the
    pipe.

    The line:


    ```

    @files = <PIPE>;

    ```


    reads the entire output of the find command into the array $files, with one line
    of output assigned to each element of the array. If the line had said:


    ```

    $files = <PIPE>;

    ```


    then only one line would have been read from the pipe into the scalar variable
    $files. This is because of the difference between an array context and a scalar
    context we will discuss later in great detail.


    The next loop will assign the array elements of $files to the scalar variable
    $filename, one element at a time. This is exactly what the outer loop is doing
    with the @ARGV array. The $filename variable will be set equal to a pathname (one
    line of output from the find command) for each iteration of the loop.


    the chop operator (aka chop function) chops the last character of the string in
    $filename, which will be a newline character, and then the -T test checks if the
    file named in $filename is a text file. If so, then a handle named THIS is created,
    the file is opened and associated with the open file.


    The while loop sets the value of the scalar variable $line equal to each line
    of the open file by using the input operator <> on THIS, which reads a line from
    the file it is executed. Note that $line is a scalar, so the context of the <THIS>
    operation is a scalar context.

    The line:


    ```

    if ($line =~ /^\$/);

    ```


    checks the $line variable for the occurrence of the pattern in $word, which is
    the current command line argument. The =~ is a pattern operator, and the /^\$/
    is a regular expression.


    Finally, note that in the print statement, even the $filename and $line variables
    are enclosed in double quotes, their values are still used. Perl calls this interpolation.
    A shell would call it "weak-quoting".


    A few words on handlers. In Perl, a file is associated with a filehandle by calling
    the ''open'' function. After a file is opened, all file operations on it are done
    by referencing the filehandle. For example:


    ```

    open(BOOKFILE,"books"); # Open file "books", associate with file handle BOOKFILE

    $book = <BOOKFILE>; # Use input operator <> to read a line

    ...

    close(BOOKFILE);

    ```


    Refer to the Perl book for a description of the open function.


