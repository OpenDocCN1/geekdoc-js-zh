  md: '# What is Object-Oriented?


    +   - Object-Oriented Analysis and Design (OOA&D) is the process of designing
    and implementing a solution from a “data” perspective rather than a “process flow”
    (procedural) perspective.


    +   - Think in terms of “What am I manipulating?” rather than “What do I need
    to do?”


    +   - *Objects* represent “things”. For example, a radio.


    +   - Object *data* (or *attributes* or *fields*) are what describe an Object.
    A radio has a current volume, current station, it is on or off, etc.


    +   - Object *methods* are what you can do with/to an Object. Turn radio on/off,
    adjust volume, select station, etc.


    +   - A *Class* is the formal description of an Object and includes its name,
    its attributes (data), and what you can do with/it (methods)


    +   ☐ A Class is not a thing, but the description of a thing.


    You might describe your radio to a friend by telling them the brand name, how
    many megawatts of output it can produce, and all the nifty features it has. This
    is just the description. The Object (radio), is the “thing” you ask your friend
    to help you install in your car.


    +   - Object-Oriented Programming (OOP) is the process of implementing the Object-Oriented
    (OO) paradigm in a programming language (Perl, in our case) to solve a particular
    programming task.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Notes


    Many applications within your company may require a "name" object, an "address"
    object, and all the rest mentioned mentioned earlier. If care has been taken to
    make these classes general in nature, downstream development based on them can
    be much, much, faster and maintainence should be much easier.


    Be sure to "publish" your classes, document them, and get them into a class library
    so that others may use them. Providing a repository of these classes/ modules
    is a basic must in effectively implementing an OO solution within your company.


    Remember!


    Reusability is a major thing we''re looking for in the OO model. You may develop
    a solution using the OO method without reusability in mind. Developing the initial
    classes and/or modules can be a tedious task to do properly and may actually take
    longer than to solve the current problem in a procedural manner. Creating classes
    that can be reused by other developers in the future or that make maintainence
    more efficient is where the real payback is.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Why Use Object-Oriented Programming?


    +   - Data encapsulation.


    The data which belongs to each object is accessible only through the "public interface"
    for class. The public interface is the documented way (methods) to use the object.
    Perl does not enforce data encapsulation but the developer is encouraged to provide
    a well documented interface so that downstream developers may use these objects
    easily easily. Don''t publicly document the "private data" or "private methods".


    +   - Speed application development time.


    If implemented effectively, an Object-Oriented solution will help speed later
    application efforts which might use the same objects. Many pre-defined objects
    are available to the developer in the form of class libraries or, in Perl''s case,
    modules. The developer may inherit much of what is needed from these classes.
    This is reusability.


    +   - Ease maintenance overhead.


    If a change needs to be made to all of the objects of a particular class, the
    change need only be made in the class definition or the implementation of the
    methods. The user interface need not (should not, if possible) change.


    +   - Intuitve.


    Once you begin learning and implementing solutions using the OO paradigm, you
    will probably find it more intuitive than procedural development.'
  merge: -1
