- img_proc: true
  md: "# Notes\n\nConsider the following Perl program:\n\n```\n```#!/usr/bin/perl\n\
    foreach (@ARGV) {\n    system(\"ls -ld $\\$_ -d\");\n}\n```\n```\n\nThe program\
    \ is Intended to be run with command line arguments that are file names. For each\
    \ file that is a directory, or an \"ls -ld\" command on that file.\n\n+   The\
    \ second line begins a 'foreach' loop that comprises the entire program. For each\
    \ iteration of the loop, the special variable $_ will be set (as a string) to\
    \ the next command line argument. The command line arguments are stored in the\
    \ special array called @ARGV.\n\n+   The loop consists of a single statement,\
    \ the third line of the program. The statement is conditional, with the 'if' syntactically\
    \ FOLLOWING a call to the system(). The system() function, if called, will pass\
    \ the string \"ls -ld $\\$_ to the operating system, which will execute the string\
    \ as a command.\n\nUnder what condition will the system() function be called?\
    \ Well, the pseudo-code for the entire program looks like this:\n\n```\n```for\
    \ each line argument:\nset the variable $_ to the string value of the argument\n\
    if the file named in $_ is a directory\n    call the system() function to execute\
    \ \"ls -ld $\"\n```\n```\n\nAlternatively:\n\n```\n```for each line argument:\n\
    set the variable $_ to the string value of the argument\ncall the system() function\
    \ to execute \"ls -ld $\\$_\"\nIf the file named in $_ is a\ndirectory\n```\n\
    ```\n\nA more verbose version of this program. It takes less advantage of Perl's\
    \ automatic actions, and is more explicit:\n\n```\n```#!/usr/bin/perl\nforeach\
    \ $file (@ARGV) {\n    if (-d $file) {\n        system(\"ls -ld $file\");\n  \
    \  }\n}\n```\n```\n\nThe second line uses the 'foreach' loop instead of 'for'\
    \ (they are equivalent) and it specifies the variable name that the foreach loop\
    \ to assign strings to, instead of implicitly assigning them to the special variable.\
    \ The variable name is $file. The dollar sign in $file variable name is part of\
    \ the variable name. It is not a dereference operator as in shell programming\
    \ and in awk. The test for 'directories' on the third line is similar to that\
    \ of the shell's test command. If the -d operator is not given an argument containing\
    \ a file, it will test the contents of the $_ variable, assuming that the contents\
    \ are the name of a file that might be a directory.\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_19_0.png)"
  merge: -1
  pgno: 19
- img_proc: true
  md: "# Sample Program\n\n```\n#!/usr/bin/perl\n# File: prog.pl\n\nforeach (@ARGV)\n\
    {\n    system(\"ls -ld $\\_\") if -d;\n}\n```"
  merge: -1
