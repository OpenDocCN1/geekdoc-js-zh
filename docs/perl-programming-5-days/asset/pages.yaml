  md: '# Notes


    The local-address and remote-address specify the network id and host id of the
    local and remote hosts, in whatever format is defined by the protocol suite. The
    local process and remote process are used to identify the specific processes on
    each system that are involved in the connection, in whatever format is defined
    by the protocol suite.


    A logical choice for the process field in the endpoint would appear to be the
    process id (PID), but this turns out to be inappropriate for two reasons:


    +   1. A client program would not be able to have multiple connections to the
    same server program. By using a different port number for each connection the
    client can do this.


    +   2. Clients don''t know the PIDs of processes on remote machines, so they wouldn''t
    be able to connect to a desired server. The mechanism of well-known port numbers
    solves this.


    The list of well-known ports is kept (on UNIX systems) in the /etc/services file.
    The server computers *and* client computers must have an /etc/services file with
    the same port numbers in them. A client application that is going to access a
    service fills in the half-association for the service desired, and as part of
    the connection mechanism the client-side IP address (assuming TCP/IP) as well
    as ephemeral (temporary) port fills out the rest of the association, thereby establishing
    a unique identifier for the communication link.'
  merge: -1
