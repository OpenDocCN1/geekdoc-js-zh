  md: "# Data Structures of the Sockets API\n\nThe basic data structure for a socket\
    \ descriptor contains the following information:\n\n+   - Address Family\n- Socket\
    \ Type\n- Local IP Address\n- Remote IP Address\n- Local Port\n- Remote Port\n\
    \nThe generic address structure used by the sockets toolkit is the C sockaddr\
    \ structure, shown below (using 4.3BSD notation).\n\n```\nstruct sockaddr {\n\
    \    u_short sa_family;\n    char sa_data[14];\n};\n```\n\nThe address structure\
    \ for a specific protocol family is based on the generic sockaddr_; the AF_INET\
    \ family implementation is shown below.\n\n```\nstruct sockaddr_in {\n    u_short\
    \ sin_family; /* type of address */\n    u_short sin_port; /* port number */\n\
    \    u_long sin_addr; /* ip address */\n    char s a_zero[8]; /* unused */\n};\n\
    ```\n\nNote that the sockaddr_in structure fully defines an endpoint."
  merge: -1
  pgno: 250
- img_proc: true
  md: 'use Module; in Perl5 causes Perl to import (dynamically link) a specific module
    at run time.


    use Socket; tells Perl to load the Socket module, Socket.pm, which includes the
    definitions of subroutines and constants for socket programming.


    use Socket;


    ```

    socket(domain, type, protocol)

    ```


    The domain parameter specifies the communications domain where the communication
    will take place. A few of the many constants defined in Socket.pm:


    +   - AF_UNIX (UNIX internal protocols)

    - AF_INET (ARPA Internet protocols)

    - AF_ISO (ISO protocols)


    The socket has the indicated type, which specifies the semantics of communication.
    Types defined in Socket.pm include:


    +   - SOCK_STREAM (tcp protocol)

    - SOCK_DGRAM (udp protocol)

    - SOCK_RAW (internal network protocols and interfaces)


    The protocol number to use is particular to the “communication domain” in which
    communication is to take place.'
  merge: -1
