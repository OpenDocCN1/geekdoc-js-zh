- img_proc: true
  md: '# Notes


    Variable Scope in Perl


    In addition to having a value, variables may be thought of in terms of scope and
    duration. The scope of a variable is all of the `blocks of code` that can access
    variable directly from its symbol table. The duration of a variable is its lifetime
    (the life of the block, the life of the sub, the life of the program).


    In Perl, as we''ve discussed, unless you specifically make a variable local with
    the `local` operator, its scope is global and its duration is the life of the
    Perl program. If you use the local operator, the scope of the variable is the
    block in which it was declared `local`, and any subroutines called from that block.
    Its duration is the lifetime of the block in which it was declared.


    In addition to the `local` operator, Perl5 added the `my` operator. You might
    think of this operator as creating a “super-local” variable, analogous to the
    automatic (local) variables created in C or C++. A variable declared with `my`
    is scoped to the enclosing block only, and may not be accessed from any place
    outside that block, including subroutines called from that block. Using `my` is
    preferable to use `local` since it reduces the risk of unintentional variable
    name conflict during subroutine calls.


    Global variables (all those not declared to be `local` or `my`) reside in symbol
    tables. Symbol tables are created for each package that is created, allowing the
    developer to separate variables used in a Perl program into “semi-private” areas.
    All variables in all symbol tables are available globally. Perl does not provide
    a means to enforce `privacy` of variables in packages. All packages and their
    symbol tables are global.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Packages


    +   A package is a semi-private area to store variables and subroutines.


    +   Packages are global and exist as long as the program is running.


    +   The default package is main.


    +   All variables, unless created with local or my, are stored in the current
    package (default package main), and are globally accessible.


    +   Use the package declaration to create a package or set the current package.


    ```

    package Not_main; # set current package to Not_main

    $a = 7; # set the scalar $a in the package

    # Not_main to 7

    ```


    +   Use the "::" notation to resolve a reference to a package variable if it exists
    in another package other the current package.


    ```

    package main; # return to the main package

    $a = 3; # a scalar $a in the package main. NOT the

    # same as Not_main::

    $Not_main::a = 14; # resets the scalar "a"

    # in package Not_main to

    # a value of 14

    ```


    +   The current package set by a package declaration remains the current package
    until the end of the block in which the declaration was made or until another
    package statement is encountered.'
