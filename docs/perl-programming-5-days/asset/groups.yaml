- md: "\n## Overloaded Operators\n\n- Some OO languages (such as C++) allow operator\
    \ overloading.\n- You can make a standard language operator (+, =, *, etc.) behave\
    \ differently depending on the class of operands.\n\n- For example, one common\
    \ operator to overload would be the assignment operator \"=\":\n\n```perl\n$obj1\
    \ = new SomeClass;\n$obj2 = $obj1;\n```\n\n- Normally, $obj2 simply becomes another\
    \ reference to the same data and methods as $obj1, NOT a copy.\n\n- You would\
    \ overload the = operator so that if its right-hand operand is a SomeClass object,\
    \ then it creates a new object which is a copy of the right-hand operand (this\
    \ is often called a copy constructor), and assign a reference to the new object\
    \ to the variable on the left-hand side.\n\n- Many of Perl's built-in operators\
    \ can be overloaded using the overload.pm module.\n- The overload module does\
    \ provide a mechanism to \"fake\" the assignment operator; it will be invoked\
    \ when a mutator (like ++ or +=) is applied to $obj2 (see facing page code.)\n\
    \n## Notes\n\n```\n#!/usr/bin/perl\n#File: Name2.pl\n\npackage Name2; # The name\
    \ of a class\n\nsub new { # class method to create and return the reference to\
    \ the \"object\"\nmy $class = shift @_; # first argument provided automatically\
    \ by Perl\nmy $this = {}; # create the reference to the anonymous hash\n    bless\
    \ $this, $class; # bind the reference to the package (class) \"Name2\"\n    return\
    \ $this; # return the reference to the caller for assignment to a scalar\n}\n\n\
    sub set_last_name { instance method\n$this = shift @_; # get the reference to\
    \ the object which invoked me\n$this->{last_name} = shift @_; # assign to that\
    \ instance data\n}\n\nsub set_first_name { instance method\n$this = shift @_;\
    \ # get the reference to the object which invoked me\n$this->{first_name} = shift\
    \ @_; # assign to that objects instance data\n}\n\nsub get_last_name { instance\
    \ method\n$this = shift @_; # get the reference to the object which invoked me\n\
    return $this->{last_name}; # return that object's instance data\n}\n\nsub get_first_name\
    \ { instance method\n$this = shift @_; # get the reference to the object which\
    \ invoked me\nreturn $this->{first_name}; # return that object's instance data\n\
    }\n\nsub DESTROY {\nprint \"Goodbye from \\$_[0]->first_name, \", \\$_[0]->last_name,\
    \ \\n\";\n1; # Return an arbitrary value, so \"require\" doesn't fail.\n}\nDESTROY\
    \ will be called when the last reference to Name2 object goes out of scope:\n\
    ```\n\n```perl\n#!/usr/bin/perl\n#File: namename2.pl\nrequire \"Name2.pl\"; #\
    \ Pull in the definition of the Name2 class\n\n$name1 = new Name2;\n$name2 = new\
    \ Name2;\n$name1->set_last_name('Skywalker'); $name1->set_first_name('Luke');\n\
    $name2->set_last_name('Leia'); $name2->set_first_name('Princess');\nprint \"name1:\
    \ \", $name1->get_first_name, \\n\", $name1->get_last_name, \"\\n\";\nprint \"\
    name2: \", $name2->get_first_name, \\n\", $name2->get_last_name, \"\\n\";\n```\n\
    \nThe above code generates the following output:\n\n```\nLuke Skywalker\nPrincess\
    \ Leia\nGoodbye from Luke Skywalker\nGoodbye from Princess Leia\n```\n\n## Destructors\n\
    \n- Destructor methods are called automatically by Perl whenever the last reference\
    \ to an object goes out of scope.\n- The destructor must be called DESTROY.\n\
    - They are used for any cleanup above and beyond simple memory cleanup, which\
    \ Perl does automatically.\n- You may do things like close and remove temporary\
    \ files, remove lock files, close databases connections, etc.\n- Do not create\
    \ any new references to the object being destroyed.\n\n## Lab\n\n1. Copy PassWord.pl\
    \ to PassWord.pm and modify it to become a full object. You will need to create\
    \ a subroutine that will perform a bless $this with the data from the passwd file.\
    \ Do not update the other functions to shift off the first parameter into $this.\
    \ Lastly, you will need to copy passwordmain.pl and modify it to call your new\
    \ object. (Solution: passobobj.pl and PassWord.pm)\n\n2. Create a new module PassFunc.pm\
    \ to override the Print function. You will create a function new that will call\
    \ PassWord's new and then re-bless this into the called class. Do not forget to\
    \ add @ISA. In the Print function, you may call PassWord's Print by using SUPER\
    \ as the package name. (Solution: passfuncobj.pl and PassFunc.pm)\n\n3. (Optional)\
    \ In module Security.pm are several calls, CheckPassWd and SetPassWd, that can\
    \ be taken advantage of with a containment relationship. You will need to add\
    \ to PassWordFunc.pm 2 functions:\n\n1) CheckPassWd taking $this, login, and a\
    \ password to check as arguments.\n\n2) SetPassWd taking $this, login, and a password\
    \ to check as arguments.\n\n4. Modify PassWordFunc.pm to create a new. (Solution:\
    \ passobobj.pl and PassWord.pm)\n\nWait, the text seems fragmented fragmented.\
    \ Let me reconstruct based on the provided flow.\n\n## Chapter 15 - Advanced Regular\
    \ Expressions\n\n## Objectives\n\n- Begin using regular expressions.\n- Make effective\
    \ use of $1, $2 variables.\n- Deal with regular expressions.\n\n## Notes\n\nThe\
    \ Perl special variables $1, $2, ... are set to the substrings found in the **last**\
    \ RE evaluated.\n"
  mdcn: "\n\n## 重载运算符\n\n- 一些面向对象的语言（如 C++）允许运算符重载。\n- 你可以根据操作数的类型，让标准语言运算符（+, =,\
    \ *, 等）表现出不同的行为。\n\n- 例如，一个常见的重载运算符是赋值运算符 “=”：\n\n```perl\n$obj1 = new SomeClass;\n\
    $obj2 = $obj1;\n```\n\n- 通常情况下，$obj2 仅仅变成指向与 $obj1 相同数据和方法的另一个引用，而不是**拷贝**。\n\n\
    - 你可以重载 = 运算符，使得如果其右侧操作数是一个 `SomeClass` 对象，它就会创建一个右侧操作数的副本的新对象（这通常被称为拷贝构造函数），并将指向新对象的引用赋值给左侧的变量。\n\
    \n- Perl 的许多内置运算符可以使用 `overload.pm` 模块进行重载。\n- `overload` 模块确实提供了一种“伪造”赋值运算符的机制；当修改符（如\
    \ `++` 或 `+=`）应用于 $obj2 时，它会被调用（见对页代码）。\n\n## 注意事项\n\n```\n#!/usr/bin/perl\n#File:\
    \ Name2.pl\n\npackage Name2; # 类的名称\n\nsub new { # 创建并返回“对象”引用的类方法\nmy $class\
    \ = shift @_; # Perl 自动提供的第一个参数\nmy $this = {}; # 创建指向匿名哈希表的引用\n    bless $this,\
    \ $class; # 将引用绑定到包（类）\"Name2\"\n    return $this; # 返回引用给调用者以便赋值给标量\n}\n\nsub\
    \ set_last_name { 实例方法\n$this = shift @_; # 获取调用我的对象的引用\n$this->{last_name} =\
    \ shift @_; # 赋值给该实例数据\n}\n\nsub set_first_name { 实例方法\n$this = shift @_; # 获取调用我的对象的引用\n\
    $this->{first_name} = shift @_; # 赋值给该对象的实例数据\n}\n\nsub get_last_name { 实例方法\n\
    $this = shift @_; # 获取调用我的对象的引用\nreturn $this->{last_name}; # 返回该对象的实例数据\n}\n\n\
    sub get_first_name { 实例方法\n$this = shift @_; # 获取调用我的对象的引用\nreturn $this->{first_name};\
    \ # 返回该对象的实例数据\n}\n\nsub DESTROY {\nprint \"Goodbye from \\$_[0]->first_name,\
    \ \", \\$_[0]->last_name, \\n\";\n1; # 返回任意值，以便 \"require\" 不会失败。\n}\n```\n当 Name2\
    \ 对象的最后一个引用超出范围时，将调用 `DESTROY`：\n\n```\n\n```perl\n#!/usr/bin/perl\n#File: namename2.pl\n\
    require \"Name2.pl\"; # 引入 Name2 类的定义\n\n$name1 = new Name2;\n$name2 = new Name2;\n\
    $name1->set_last_name('Skywalker'); $name1->set_first_name('Luke');\n$name2->set_last_name('Leia');\
    \ $name2->set_first_name('Princess');\nprint \"name1: \", $name1->get_first_name,\
    \ \\n\", $name1->get_last_name, \"\\n\";\nprint \"name2: \", $name2->get_first_name,\
    \ \\n\", $name2->get_last_name, \"\\n\";\n```\n\n上述代码产生以下输出：\n\n```\nLuke Skywalker\n\
    Princess Leia\nGoodbye from Luke Skywalker\nGoodbye from Princess Leia\n```\n\n\
    ## 析构函数\n\n- 每当对象的最后一个引用超出范围时，Perl 会自动调用析构方法。\n- 析构方法必须命名为 `DESTROY`。\n- 它们用于执行除\
    \ Perl 自动内存内存清理之外的清理工作。\n- 你可以执行如关闭并删除临时文件、删除锁文件、关闭数据库连接等操作。\n- 不要为正在销的对象创建任何新引用。\n\
    \n## 实验\n\n1. 将 `PassWord.pl` 拷贝到 `PassWord.pm` 并修改其成为一个完整的对象。你需要创建一个子程序，使用来自\
    \ `passwd` 文件的数据对 `$this` 执行 `bless`。不要更新其他函数以将第一个参数移入 `$this`。最后，你需要拷贝 `passwordmain.pl`\
    \ 并修改它以调用你的新对象。（解决方案：passobobj.pl 和 PassWord.pm）\n\n2. 创建一个新模块 `PassFunc.pm` 来重写\
    \ `Print` 函数。你将创建一个 `new` 函数，它将调用 `PassWord` 的 `new` 然后将其重新绑定到被调用的类。不要忘记添加 `@ISA`。在\
    \ `Print` 函数中，你可以使用 `SUPER` 作为包名来调用 `PassWord` 的 `Print`。（解决方案：passfuncobj.pl\
    \ 和 PassFunc.pm）\n\n3. （可选）在模块 `Security.pm` 中有多个调用 `CheckPassWd` 和 `SetPassWd`\
    \ 可以利用包含关系。你需要在 `PassWordFunc.pm` 中添加两个函数：\n\n1) `CheckPassWd`，接受 `$this`、`login`\
    \ 和 `password` 作为参数。\n\n2) `SetPassWd`，接受 `$this`、`login` 和 `password` 作为参数。\n\
