  - "[PAGE 192]\n\n# Overloaded Operators\n\n+   - Some OO languages (such as C++)\
    \ allow operator overloading.\n  - You can make a standard language operator (+,\
    \ =, *, etc.) behave differently depending on the class of operands.\n\n+   -\
    \ For example, one common operator to overload would be the assignment operator\
    \ \"=\":\n\n```perl\n$obj1 = new SomeClass;\n$obj2 = $obj1;\n```\n\n+   - Normally,\
    \ $obj2 simply becomes another reference to the same data and methods as $obj1,\
    \ NOT a copy.\n\n+   - You would overload the = operator so that if its right-hand\
    \ operand is a SomeClass object, then it creates a new object which is a copy\
    \ of the right-hand operand (this is often called a copy constructor), and assign\
    \ a reference to the new object to the variable on the left-hand side.\n\n+  \
    \ - Many of Perl's built-in operators can be overloaded using the overload.pm\
    \ module.\n  - The overload module does provide a mechanism to \"fake\" the assignment\
    \ operator; it will be invoked when a mutator (like ++ or +=) is applied to $obj2\
    \ (see facing page code.)"
