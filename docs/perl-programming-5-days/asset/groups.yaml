    \ bind）”运算符。当你使用 `=~` 运算符指定一个除默认 `$_` 以外的搜索字符串时，表达式：\n\n```\n$string =~ /pattern/\n\
    ```\n\n返回真或假，取决于该模式是否在字符串中。\n\n界定模式的斜杠可以被任何其他字符对替换（只要开始和结束时使用相同的字符即可），但如果你不使用斜杠，则必须使用\
