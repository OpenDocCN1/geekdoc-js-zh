    \ element of @a, shortening @a by 1.\n  * Same as: $var = $a[$#a--]\n* push (@a,\
    \ LIST) pushes all values in LIST onto the end of @a.\n  * The length of @a is\
    \ increased by the length (# of values) of LIST.\n* shift (@a) is like pop (@a)\
    \ on the left end of @a.\n* shift (@a, LIST) is like push (@a, LIST) on the left\
