  - "[PAGE 178]\n\n# The bless Function\n\n+   - The bless function has two forms:\n\
    \n```\nless REF\nbless REF, CLASSNAME\n```\n  - The first form marks the reference\
    \ REF as belonging to the current package.\n  - The second form marks the reference\
    \ REF as belonging to the package CLASSNAME.\n\n+   - This is a way of making\
    \ a package's subroutines available via the scalar reference variable REF.\n\n\
    +   - REF may be a reference to anything!!! It still maintains its identity as\
    \ a \"whatever\", but may also be used to invoke subroutines from CLASSNAME.\n\
    \n+   - bless returns the reference for possible assignment to another scalar."
