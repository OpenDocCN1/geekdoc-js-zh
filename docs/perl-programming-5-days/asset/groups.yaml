  - '[PAGE 233]


    # Notes


    Several crucial mechanisms play together here. First, we count on UNIX using the
    next lowest numbered available file descriptor whenever we open a file. This implies
    that if file descriptor 0, STDIN, is available, i.e., no file is open on STDIN,
    then if we open a file it will become STDIN! Second, when we fork a new process
    and then exec a new process into that process, its STDIN will be attached to whatever
    file we have opened on STDIN, because the file descriptor table is inherited across
    a fork, and is loaded (in Perl) across an exec with the current STDIN, STDOUT,
    and STDERR of the child.


    The ability to duplicate an open file descriptor table entry into another entry
    serves a very useful purpose: it allows you "move" a file descriptor from STDIN,
    STDOUT, or STDERR (0, 1, or 2) to another descriptor and "move" it back later.
    Our purpose is to save the entry for the open file attached to say, STDIN, then
    open another file on STDIN, and later put the original file back. The reason we
    wish to open another file on STDIN is to setup the STDIN for a child BEFORE we
    fork or exec.'
- md: "\n# How UNIX Opens Files\n\n- Each process in UNIX has an integer-indexed file\
    \ descriptor table with one entry for each open file.\n- A Perl filehandle corresponds\
    \ to a UNIX file descriptor.\n- File descriptors 0, 1, and 2 are called standard\
    \ in, standard out, and standard error, respectively.\n- A filter is a program\
    \ that reads its standard in and writes its standard out, whatever files they\
    \ happened to be opened to.\n- The KEY to setting up filters in the parent is\
    \ this:\n- UNIX always uses the lowest available file descriptor when opening\
    \ a file.\n- Closing a file frees up the file descriptor used by that file.\n\
    - You can duplicate an open file descriptor into the next available entry.\n\n\
    # One-Way Data Flow - Pipes\n\n- A UNIX pipe is a one-way data channel between\
    \ two processes.\n- The processes must have a common ancestor (i.e., parent and\
    \ child, or siblings).\n- Pipes are written to and read from through file descriptors\
    \ (filehandles in Perl).\n- You create the pipe in the parent, allocating a 'write'\
    \ and a 'read' filehandle, then you `fork` with inheritance of filehandles.\n\
    - One of the processes writes to the pipe 'write' filehandle, and the other reads\
    \ from the pipe 'read' filehandle.\n- Perl provides the `pipe()` function to create\
    \ the pipe and attach the two filehandles.\n\nAn example with diagrams is shown\
    \ on the next pages ....\n\n# Notes\n\n```perl\n#!/usr/bin/perl\n# File: pipe_parent\n\
    ```\n\n# Dup (save) STDIN and STDOUT for later restoration to filenos 0 and 1\n\
    \n```\n----------------------------------------------------------------------\n\
    open(SI, \"<STDIN\"); # See Perl open() for \"&\" semantics.\nopen(SO, \">STDOUT\"\
    );\n```\n\n# Create a pipe on 0 and 1 for inheritance across fork\n# No need to\
    \ explicitly close STDIN and STDOUT. Opening\n# or creating a pipe on a filehandle\
    \ closes it.\n\n```\n----------------------------------------------------------------------\n\
    pipe(STDIN, STDOUT); # STDIN/STDOUT are attached to pipe.\n```\n\n# Start child,\
    \ inheriting STDIN and STDOUT attached to pipe.\n\n```\n----------------------------------------------------------------------\n\
    if (fork() == 0) {\n    exec(\"pipe_child\") || die \"exec pipe_child: $!\";\n\
    }\n```\n\n# Close the write side of the pipe since we will not be writing to,\n\
    # only reading from it. We must close it so we can detect EOF when\n# the child\
    \ closes its write side. The next read on a pipe after the\n# last writer closes\
    \ it will return EOF.\n\n```\n----------------------------------------------------------------------\n\
    close(STDDOUT);\nopen(STDDOUT, \">&SO\"); # Close write side of pipe (we must*)\n\
    # Put stdout back (to screen properly)\nselect STDIN; $| = 1; # And unbuffer it\
    \ for timely messages\n```\n\n# Dup STDIN (the read side of the pipe) into another\
    \ filehandle so we can\n# put stdin back to where it was before we messed with\
    \ it.\n\n```\nopen(R, \"<STDIN\"); # Dup stdin (read side) into new filehandle\
    \ R\nopen(STDIN, \">&R\"); # Put stdin back (to the keyboard probably)\n```\n\n\
    # Loop reading the pipe EOF\n\n```\nwhile ($ = <R>) {\n    print \"Parent read:\
    \ $_\";\n}\nprint \"Goodbye\\n\";\n```\n\n```perl\n#!/bin/perl\n# File: pipe_child\n\
    ```\n\n```\nclose(STDDOUT); # Child close read side of pipe.\nprint \"child here\\\
    n\"; # Write to pipe.\nprint \"second line\\n\"; # Use newlines to satisfy parents\
    \ in parent.\nprint \"We gone, bye\\n\";\nclose(STDIN); # Send EOF to reader (parent).\n\
    exit(0);\n```\n\n# Notes\n\nParent file descriptor table after file duping\n\n\
    ```\nopen(SI, \"<&STDIN\");\nopen(SO, \">&STDOUT\");\n```\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_237_0.png)\n\
    \nParent file descriptor table after opening pipe\n\n```\npipe(STDIN, STDOUT);\n\
    ```\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_237_1.png)\n\nDiagram continued\
    \ on next couple of pages ...\n\n# Notes\n\nParent and child relationship after\
    \ fork\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_238_0.png)\n\n# Notes\n\nParent\
    \ and child after exec and closing write side\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_239_0.png)\n\
    \n# Chapter 17 Multitasking with Perl 239\n\n# Notes\n\nThis program demonstrates\
    \ several interesting features. It is designed to act like the utility tee, except\
    \ that it can send output to processes through pipes rather than to a single file.\
    \ When it is started, it reads data from STDIN and writes to STDOUT. When you\
    \ want to send live data stream to another process also, you put the name of the\
    \ process to receive to.\n"
  mdcn: "\n\n# UNIX 如何打开文件\n\n- UNIX 中的每个进程都有一个整数索引的文件描述符表，每个打开的文件都对应一个条目。\n- Perl\
    \ 文件句柄（filehandle）对应于 UNIX 文件描述符。\n- 文件描述符 0、1 和 2 分别称为标准输入（standard in）、标准输出（standard\
    \ out）和标准错误（standard error）。\n- 过滤器是一个程序，它读取其标准输入并写入其标准输出，无论它们实际上打开的是什么文件。\n-\
    \ 在父进程中设置过滤器的关键在于：\n- UNIX 在打开文件时始终使用最低可用的文件描述符。\n- 关闭文件会释放该文件使用的文件描述符。\n- 你可以将已打开的文件描述符复制到下一个可用条目。\n\
    \n# 单向数据流 - 管道\n\n- UNIX 管道（pipe）是两个进程之间的单向数据通道。\n- 这些进程必须具有共同的祖先（即父子关系，或兄弟进程关系）。\n\
    - 管道通过文件描述符（Perl 中的文件句柄）进行写入和读取。\n- 你在父进程中创建管道，分配一个“写”句柄和一个“读”句柄，然后通过 `fork` 继承这些句柄。\n\
    - 其中一个进程向管道的“写”句柄写入，另一个进程从管道的“读”句柄读取。\n- Perl  `pipe()` 函数来创建管道并绑定两个文件句柄。\n\n\
    接下来的页面将显示带图的示例 ....\n\n# 注意事项\n\n```perl\n#!/usr/bin/perl\n# File: pipe_parent\n\
    ```\n\n# 复制 STDIN 和 STDOUT 以备后恢复到文件编号 0 和 1\n\n```\n----------------------------------------------------------------------\n\
    open(SI, \"<STDIN\"); # 关于 \"&\" 语义请参见 Perl open()。\nopen(SO, \">STDOUT\");\n\
    ```\n\n# 在 0 和 1 上创建管道以供跨 fork 继承\n# 无需显式关闭 STDIN 和 STDOUT。在文件句柄上打开\n# 或创建管道会关闭它。\n\
    \n```\n----------------------------------------------------------------------\n\
    pipe(STDIN, STDOUT); # STDIN/STDOUT 已绑定到管道。\n```\n\n# 启动子进程，继承绑定到管道的 STDIN 和 STDOUT。\n\
    \n```\n----------------------------------------------------------------------\n\
    if (fork() == 0) {\n    exec(\"pipe_child\") || die \"exec pipe_child: $!\";\n\
    }\n```\n\n# 关闭管道的写侧，因为我们不会写入，\n# 只从其读取。我们必须关闭它，以便在子进程关闭\n# 其写侧时检测到 EOF。最后一个写入者关闭后，\n\
    # 对管道的下一次读取将返回 EOF。\n\n```\n----------------------------------------------------------------------\n\
    close(STDDOUT);\nopen(STDDOUT, \">&SO\"); # 关闭管道的写侧（我们必须这样做）\n# 将 stdout 还原（以便正常显示）\n\
    select STDIN; $| = 1; # 并取消缓冲以确保及时输出消息\n```\n\n# 将 STDIN（管道的读侧）复制到另一个文件句柄，这样我们可以\n\
    # 将 stdin 恢复到我们操作之前的状态。\n\n```\nopen(R, \"<STDIN\"); # 将 stdin（读侧）复制到新文件句柄 R\n\
    open(STDIN, \">&R\"); # 将 stdin 恢复（可能是恢复到键盘）\n```\n\n# 循环读取管道的 EOF\n\n```\nwhile\
    \ ($ = <R>) {\n    print \"Parent read: $_\";\n}\nprint \"Goodbye\\n\";\n```\n\
    \n```perl\n#!/bin/perl\n# File: pipe_child\n```\n\n```\nclose(STDDOUT); # 子进程关闭管道的读侧。\n\
    print \"child here\\n\"; # 向管道写入。\nprint \"second line\\n\"; # 使用换行符满足父进程中的等待。\n\
    print \"We gone, bye\\n\";\nclose(STDIN); # 向读取者（父进程）发送 EOF。\nexit(0);\n```\n\n\
    # 注意事项\n\n文件复制后的父进程文件描述符表\n\n```\nopen(SI, \"<&STDIN\");\nopen(SO, \">&STDOUT\"\
    );\n```\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_237_0.png)\n\n打开管道后的父进程文件描述符表\n\
    \n```\npipe(STDIN, STDOUT);\n```\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_237_1.png)\n\
    \n图示在接下来的几页继续 ...\n\n# 注意事项\n\nfork 后的父子关系\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_238_0.png)\n\
    \n# 注意事项\n\nexec 和关闭写侧后的父子关系\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_239_0.png)\n\
    \n# 第 17 章 使用 Perl 进行多任务处理 239\n\n# 注意事项\n\n此程序演示了一些有趣的特性。它的设计作用类似于 tee 工具，不同之处它可以通过管道向进程输出，而不是向单个文件。当它启动时从\
    \ STDIN 读取数据并写入 STDOUT。当你想要也将实时数据流发送到另一个进程时，请输入接收进程的名称。\n\n"
