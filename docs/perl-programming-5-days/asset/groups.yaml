  - "[PAGE 95]\n\n# 94 Perl Programming\n\n# Notes\n\nThe modifier is always evaluated\
    \ before the expression that it is modifying, so Perl provides a do-BLOCK construct\
    \ that allows you to execute a block of statements once before the modifier is\
    \ evaluated. A BLOCK is a sequence of statements enclosed in curly braces.\n\n\
    ```\ndo {\n  E1;\n  E2;\n  E3;\n  ...\n} [ while E; | until E; ]\n```\n\nThis\
    \ construct is still considered to be a simple expression because there are things\
    \ that you can do in compound statements that you can't do with a do-BLOCK construct.\n\
    \nSo, the differences between\n\n```\nE1 while E2; and do { E1;\n  E2;\n  E3;\n\
    \  ...\n} while E;\n```\n\nare:\n\n+   1) The BLOCK is executed before E is evaluated,\
    \ thus ensuring that the statement (or statements) executes at least once, and\n\
    \n+   2) You can have multiple statements in a block.\n\nExample:\n\n```\n$count\
    \ = 5;\ndo { print $count-- } while $count;\n```\n\nis equivalent to:\n\n```\n\
    $count = 6;\nprint $count while $count--;\n```\n\nExample:\n\n```\ndo {\n  print\
    \ STDOUT \"Important information\\n\";\n  print KEEPPIT \"Important information\\\
    n\";\n} if $logging;\n```\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_95_0.png)"
