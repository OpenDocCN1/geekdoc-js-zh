  - "[PAGE 98]\n\n# Compound Statements\n\n+   - Compound statements control the flow\
    \ of execution of a program.\n- The facing page shows all of the forms of compound\
    \ statements.\n- Things to note:\n\n+   The statements controlled by a compound\
    \ statement must be in a BLOCK, even if there is only one statement. The curly\
    \ braces are mandatory.\n\n+   Several styles can be used\n\n```\nif ($flag) {\
    \ $flag = 0 } ;\n\nif ($flag) { # Traditional K&R style\n$flag = 0;\n}\n\nif ($flag)\
    \ {\n$flag = 0;\n}\n\nif ($flag) # Nope, not in Perl!\n$flag = 0; # if() must\
    \ be followed by a\n  # block.\n\n#BUT,\n$flag = 0 if $flag;      # A simple statement\n\
