    # C Data Structures


    +   Another use for pack and unpack is to translate to the C language.


    +   The C structures on the facing page map onto Perl''s needs as a packed structure
    containing the same data.


    +   Perl would create a `sockaddr_in` structure as follows:


    ```

    $sockaddr_in = pack(''S n a4 x8'', $AF_INET, $port, $IP_Addr);

    ```


    +   This maps directly onto the C structure needed by the sockets libraries.


    +   This is used routinely when perl must make a system call into the kernel (or
    some other UNIX process) which needs to see native machine data types.


    +   We will see this again in chapter 18.'
