    \ 'apt', 'city', 'state', 'zip'.\nKeys for the phone hash should be: 'area_code',\
    \ 'prefix', 'suffix'.\n\nThe value of the 'ssn' key is a simple scalar.\n\nEach\
    \ complex field (name, address, and phone) should be stored in a separate .pm\
    \ file as a Perl module and imported using the use operator into the main program.\
    \ Each .pm file should include all subroutines necessary to set and get the values\
    \ for that field.\n\n# Chapter 14 - Introduction to Object-Oriented Programming\
    \ in Perl\n\n# Chapter Objectives\n\n- Describe the benefits of Object Oriented\
    \ Programming.\n- Use the Perl5 syntax for implementing Object Oriented Programming.\n\
    - Design an Object Oriented solution in Perl5 implementing use, inheritance, data\
    \ encapsulation, and operator overloading.\n\n# Notes\n\nWhat would the objects\
    \ in a Name & Address Book application be? Let's name some:\n\nA person is an\
    \ object. You might describe a person as a group of other objects.\n\nA person\
    \ has a name, one or more addresses, one or more phone numbers, a SSN, physical\
    \ description, etc.\n\nA name is an object. It has last, first, and middle components.\
    \ An address is an object. It has a street name and number, apt/suite, city, state,\
    \ and zip.\n\nA phone number is an object. It has an area code, prefix, and suffix.\
    \ It may also include an extension or PIN number, etc.\n\nA SSN is just a number,\
    \ so would probably not be an object.\n\nA description is an object. It may have\
    \ height, weight, eye color, hair color, etc.\n\n# What is Object-Oriented?\n\n\
    - Object-Oriented Analysis and Design (OOA&D) is the process of designing and\
    \ implementing a solution from a “data” perspective rather than a “process flow”\
    \ (procedural) perspective.\n\n- Think in terms of “What am I manipulating?” rather\
    \ than “What do I need to do?”\n\n- *Objects* represent “things”. For example,\
    \ a radio.\n\n- Object *data* (or *attributes* or *fields*) are what describe\
    \ an Object. A radio has a current volume, current station, it is on or off, etc.\n\
    \n- Object *methods* are what you can do with/to an Object. Turn radio on/off,\
    \ adjust volume, select station, etc.\n\n- A *Class* is the formal description\
    \ of an Object and includes its name, its attributes (data), and what you can\
    \ do with/it (methods)\n\n- A Class is not a thing, but the description of a thing.\n\
    \nYou might describe your radio to a friend by telling them the brand name, how\
    \ many megawatts of output it can produce, and all the nifty features it has.\
    \ This is just the description. The Object (radio), is the “thing” you ask your\
    \ friend to help you install in your car.\n\n- Object-Oriented Programming (OOP)\
    \ is the process of implementing the Object-Oriented (OO) paradigm in a programming\
    \ language (Perl, in our case) to solve a particular programming task.\n\n# Notes\n\
    \nMany applications within your company may require a \"name\" object, an \"address\"\
    \ object, and all the rest mentioned mentioned earlier. If care has been taken\
    \ to make these classes general in nature, downstream development based on them\
    \ can be much, much, faster and maintenance should be much easier.\n\nBe sure\
    \ to \"publish\" your classes, document them, and get them into a class library\
    \ so that others may use them. Providing a repository of these classes/ modules\
    \ is a basic must in effectively implementing an OO solution within your company.\n\
    \nRemember!\n\nReusability is a major thing we're looking for in the OO model.\
    \ You may develop a solution using the OO method without reusability in mind.\
    \ Developing the initial classes and/or modules can be a tedious task to do properly\
    \ and may actually take longer than to solve the current problem in a procedural\
    \ manner. Creating classes that can be reused by other developers in the future\
    \ or that make maintenance more efficient is where the real payback is.\n\n# Why\
    \ Use Object-Oriented Programming?\n\n- Data encapsulation.\n\nThe data which\
    \ belongs to each object is accessible only through the \"public interface\" for\
    \ class. The public interface is the documented way (methods) to use the object.\
    \ Perl does not enforce data encapsulation but the developer is encouraged to\
    \ provide a well documented interface so that downstream developers may use these\
    \ objects easily. Don't publicly document the \"private data\" or \"private methods\"\
    .\n\n- Speed application development time.\n\nIf implemented effectively, an Object-Oriented\
    \ solution will help speed later application efforts which might use the same\
    \ objects. Many pre-defined objects are available to the developer in the form\
    \ of class libraries or, in Perl's case, modules. The developer may inherit much\
    \ of what is needed from these classes. This is reusability.\n\n- Ease maintenance\
    \ overhead.\n\nIf a change needs to be made to all of the objects of a particular\
    \ class, the change need only be made in the class definition or the implementation\
    \ of the methods. The user interface need not (should not, if possible) change.\n\
    \n- Intuitve.\n\nOnce you begin learning and implementing solutions using the\
    \ OO paradigm, you will probably find it more intuitive than procedural development.\n"
