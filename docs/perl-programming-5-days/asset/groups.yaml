    # to. (something like "SCALAR(0x80b6234)")

    ```


    While this is a valid and probably unique string to use as a hash key, you probably
    meant something like:


    ```

    $a = "one";

    \$a_ref = \$a;

    $myhash{\$$a_ref} = \$a;

    ```


    This will generate a key "one" whose associated value is "one".'
