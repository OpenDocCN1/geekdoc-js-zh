- md: "\n## Chapter 1 - Course Introduction\n\n## Course Objectives\n\n- Write scripts,\
    \ programs, and reusable modules in Perl.\n- Make effective use of Perl modules\
    \ written by others.\n\n## Notes\n\nThis course is intended for experienced programmers\
    \ with user level skills in the UNIX environment. Many programs will be written\
    \ during the class. The lecture topics and lab exercises concentrate on the Perl\
    \ language and its features, with less emphasis on application specific subjects.\n\
    \nThe particular applications that you will design, write, and work on during\
    \ this class are intended to demonstrate the use of Perl's capabilities and services\
    \ provided in UNIX programming environments. The example programs will provide\
    \ guidance when you get back to work and begin development on real projects.\n\
    \n## Course Overview\n\n- **Audience**: This is a programming course designed\
    \ for software development professionals. You will write many programs in this\
    \ class.\n- **Prerequisites**: User level skills in the UNIX environment, such\
    \ as file manipulation, editing, and use of utilities, are necessary. The ability\
    \ to write programs in a high level structured language (such as C or *awk*) is\
    \ very helpful in completing the exercises and understanding the lectures.\n-\
    \ **Classroom Environment:**\n  - UNIX software development system with one terminal\
    \ per student.\n  - Perl 5.0015 or higher installed.\n  - On-line Perl 5 manual\
    \ pages.\n\n## Chapter 2 - Overview of Perl\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_13_0.png)\n\
    \n## Chapter Objectives\n\n- Define what Perl is.\n- Run Perl programs various\
    \ ways.\n- Get a feel for Perl programming by reviewing example Perl programs.\n\
    \n## Notes\n\nThere is a lot of confusion whether Perl is a compiled or interpreted\
    \ language. Most interpreted languages are very poor on performance due to their\
    \ interpreting and running each line of a program in turn, as in shell scripts.\
    \ Perl runs interpretively, in that the programs you run are written and run as\
    \ \"source\" code, and Perl has the capability to modify itself programmatically\
    \ as it runs. Perl runs much faster than most other interpreters, however, due\
    \ to its capability to \"pre-compile\" and tokenize major portions of your program\
    \ before it actually runs the script.\n\nSince much of the functionality of Perl\
    \ maps directly onto C function calls, it makes sense for Perl to simply call\
    \ the C library routines as it needs them. This \"compilation\" of Perl code dramatically\
    \ speeds up Perl programs, making them, in some cases, almost as fast as truly\
    \ compiled C programs.\n\nDon't be confused by this and think that this means\
    \ there is a \"Perl compiler\" which can create an actual binary executable (file)\
    \ which can then be loaded and run like cat or grep; there is a way to make Perl\
    \ into doing something like this, but it's not efficient or easy (we will talk\
    \ about this later in the course). Perl programs always run under the perl executable\
    \ on your host computer. There's no way around that.\n\nThis means that, while\
    \ Perl programs are fast to execute, and very fast to develop (in comparison to\
    \ C, for example), always remember that you distribute Perl programs, you are\
    \ distributing clear source code which the user can read, modify, and easily break.\n\
    \n## What is Perl?\n\n- Perl is an interpreted programming language.\n- Its strengths\
    \ are:\n  - Scanning and processing large amounts of text efficiently.\n  - Formatting\
    \ and printing reports easily.\n  - Providing tremendous built-in \"parsing\"\
    \ functionality to reduce the need for ancillary code in a program.\n  - Great\
    \ extensibility via libraries and modules.\n- Perl contains the following:\n \
    \ - Most of the statements and operators of C.\n  - Many of the library functions\
    \ provided in a C environment.\n  - Built-in functionality of `awk`, such as automatic\
    \ record input and field splitting (but much more of this than `awk`).\n  - Extended\
    \ regular expressions found in `awk`, with Perl extensions.\n  - The file manipulation\
    \ capabilities of shell scripts.\n  - Process control capabilities of UNIX.\n\n\
    ## Notes\n\nSeveral ways to run Perl programs:\n\n1. For short (one-liner) programs,\
    \ you can use the -e command line option to write and execute the program on the\
    \ command line:\n\n```\n$ perl -e 'foreach (@ARGV) {system(\"ls -ld $$\") if -d}'\
    \ *\n```\n\nBy the way, similar output will result from:\n\n```bash\n$ ls -ld\
    \ * |grep ^\n```\n\n2. Use an editor such as vi and type the program into a file,\
    \ save prog.pl. Then type the following command at the shell prompt (the prompt\
    \ is a $):\n\n```bash\n$ perl prog.pl *\n```\n\nThe one-liner above might look\
    \ like this in prog.pl:\n\n```perl\nforeach (@ARGV) {\n  system(\"ls -ld $$\"\
    ) if -d;\n}\n```\n\n3. Use an editor to type a Perl program into a file, insert\
    \ a first line into the file so it looks like this:\n\n```perl\n#!/usr/bin/perl\n\
    foreach (@ARGV) {\n  system(\"ls -ld $$\") if -d;\n}\n```\n\nMake the program\
    \ executable:\n\n```bash\n$ chmod +x prog.pl\n```\n\nRun the program by just typing\
    \ its name, with command line arguments if any, which in this example are the\
    \ names of all files in the current directory:\n\n```bash\n$ prog.pl *\n```\n\n\
    This method of running Perl programs (or any interpreted programs, such as awk\
    \ and shell programs) works on systems that support the concept of \"interpreter\
    \ files.\" The FIRST TWO characters in the file must be #!, and the pathname of\
    \ the interpreter must follow on the same line. See exec (2).\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_17_0.png)\n\
    \n## Running Perl Programs\n\n- Perl programs can be run several ways.\n- The\
    \ simplest way is to put the program in a file, say `prog.pl`, and type:\n\n \
    \ $ perl perl prog.pl\n\n(The dollar sign here is the shell prompt)\n- This will\
    \ invoke the Perl interpreter, `perl`, which will interpret the program in the\
    \ file `prog.pl`.\n  - The `.pl` extension is not required; it's just a convention\
    \ some Perl programmers follow.\n- Some other ways to run Perl programs are described\
    \ on the facing page.\n\n## Notes\n\nConsider the following Perl program:\n\n\
    ```perl\n#!/usr/bin/perl\nforeach (@ARGV) {\n    system(\"ls -ld $_ -d\");\n}\n\
    ```\n\nThe program is intended to be run with command line arguments that are\
    \ file names. For each file that is a directory, it executes an \"ls -ld\" command\
    \ on that file.\n\n- The second line begins a 'foreach' loop that comprises the\
    \ entire program. For each iteration of the loop, the special variable $_ will\
    \ be set (as a string) to the next command line argument. The command line arguments\
    \ are stored in the special array called @ARGV.\n\n- The loop consists of a single\
    \ statement, the third line of the program. The statement is conditional, with\
    \ the 'if' syntactically following a call to the system(). The system() function,\
    \ if called, will pass the string \"ls -ld $_\" to the operating system, which\
    \ will execute the string as a command.\n\nUnder what condition will the system()\
    \ function be called? Well, the pseudo-code for the entire program looks like\
    \ this:\n\n```text\nfor each line argument:\nset the variable $_ to the string\
    \ value of the argument\nif the file named in $_ is a directory\n    call the\
    \ system() function to execute \"ls -ld $\"\n```\n\nAlternatively:\n\n```text\n\
    for each line argument:\nset the variable $_ to the string value of the argument\n\
    call the system() function to execute \"ls -ld $_\"\nIf the file named in $_ is\
    \ a directory\n```\n\nA more verbose version of this program. It takes less advantage\
    \ of Perl's automatic actions, and is more explicit:\n\n```perl\n#!/usr/bin/perl\n\
    foreach $file (@ARGV) {\n    if (-d $file) {\n        system(\"ls -ld $file\"\
    );\n    }\n}\n```\n\nThe second line uses the 'foreach' loop instead of 'for'\
    \ (they are equivalent) and it specifies the variable name that the foreach loop\
    \ assigns strings to, instead of implicitly assigning them to the special variable.\
    \ The variable name is $file. The dollar sign in $file variable name is part of\
    \ the variable name. It is not a dereference operator as in shell programming\
    \ and in awk. The test for 'directories' on the third line is similar to that\
    \ of the shell's test command. If the -d operator is not given an argument containing\
    \ a file, it will test the contents of the $_ variable, assuming that the contents\
    \ are the name of a file that might be a directory.\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_19_0.png)\n"
  mdcn: "\n\n## 第1章 - 课程介绍\n\n## 课程目标\n\n- 使用 Perl 编写脚本、程序和可用模块。\n- 有效利用他人编写的 Perl\
    \ 模块。\n\n## 注意事项\n\n本课程适用于在 UNIX 环境具有用户级技能的资深程序员。课程期间将编写许多程序。讲座主题和实验练习集中在 Perl\
    \ 语言及其特性上，对特定应用程序主题关注较少。\n\n你将在课程期间设计、编写和处理的特定应用程序旨在演示 Perl 在 UNIX 编程环境中的能力和提供的。示例程序将在你回到工作并开始开发真实项目时提供指导。\n\
    \n## 课程概览\n\n- **受众**：这是一门为软件开发专业人员设计的编程课程。你将在本课程中编写许多程序。\n- **预备条件**：需要具备 UNIX\
    \ 环境下的用户级技能，如文件操作、编辑和工具的使用。能够使用高级结构化语言（如 C 或 *awk*）编写程序的能力对于完成练习和理解讲座非常有帮助。\n\
    - **课堂环境**：\n  -带有 UNIX 软件开发系统，每个学生一个终端。\n  - 安装了 Perl 5.0015 或更高版本。\n  - 在线 Perl\
    \ 5 手册页。\n\n## 第2章 - Perl 概述\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_13_0.png)\n\
    \n## 课程目标\n\n- 定义什么是 Perl。\n- 以各种方式运行 Perl 程序。\n- 通过复习示例 Perl 程序感受 Perl 编程。\n\n\
    ## 注意事项\n\n关于 Perl 是编译型语言还是解释型语言存在很多困惑。大多数解释型语言由于需要逐行解释和运行程序的每一行（如 shell 脚本），因此性能很差。Perl\
    \ 以解释性的方式运行，即你运行的程序是以“源代码”的形式编写和运行的，并且 Perl 在运行时具有以程序方式修改自身的能力。然而，Perl 的运行速度比大多数其他解释器快得多，因为它在实际运行脚本之前，能够“预编译”并对程序的大部分进行分词。\n\
    \n由于 Perl 的许多功能直接映射到 C 函数调用，因此 Perl 在需要时直接调用 C 库例程是合理的。这种对 Perl 代码的“编译”极大地提高了\
    \ Perl 程序的运行速度，使得在某些情况下，它们几乎与真正编译的 C 程序一样快。\n\n不要被此误导，认为这意味着有一个“Perl 编译器”可以创建一个真正的二进制可执行文件（文件），然后可以像\
    \ cat 或 grep 那样加载和运行；有一种方法可以让 Perl 执行此类操作，但那并不高效，也不简单（我们将在课程稍后部分讨论这一点）。Perl 程序始终在宿主机电脑上的\
    \ perl 可执行文件运行。没有办法绕过这一点。\n\n这意味着，虽然 Perl 程序的执行速度很快，开发速度也非常快（与 C 相比），但请记住，当你分发\
    \ Perl 程序时，你分发的是纯源代码，用户可以读取、修改并轻松破坏它。\n\n## 什么是 Perl？\n\n- Perl 是一种解释型编程语言。\n\
    - 它的优势是：\n  - 高效地扫描和处理大量文本。\n  - 轻松地格式化和打印报告。\n  - 提供强大的内置“解析”功能，减少程序中对辅助代码的需求。\n\
    \  - 通过库和模块具有极强的扩展性。\n- Perl 包含以下内容：\n  - C 的大部分语句和操作符。\n  - C 环境提供的许多库函数。\n \
    \ - `awk` 的内置功能，如自动记录输入和字段分割（但比 `awk` 包含得多）。\n  - `awk` 中的的扩展正则表达式，并带有 Perl 扩展。\n\
    \  - shell 脚本的文件操作能力。\n  - UNIX 的进程控制能力。\n\n## 注意事项\n\n运行 Perl 程序的几种方法：\n\n1.\
    \ 对于短的（单行）程序，你可以使用 -e 命令行选项在命令行上编写并执行程序：\n\n```\n$ perl -e 'foreach (@ARGV) {system(\"\
    ls -ld $$\") if -d}' *\n```\n\n顺便提一下，类似的输出将由以下命令产生：\n\n```bash\n$ ls -ld *|grep\
    \ ^\n```\n\n2. 使用 vi 等编辑器将程序输入到文件中，保存为 prog.pl。然后在在 shell 提示符下输入以下命令（提示符为 $）：\n\
    \n```bash\n$ perl prog.pl *\n```\n\n上面的单行程序在 prog.pl 中看起来可能像这样：\n\n```perl\nforeach\
    \ (@ARGV) {\n  system(\"ls -ld $$\") if -d;\n}\n```\n\n3. 使用编辑器将 Perl 程序输入到文件中，在文件中插入第一行，使其看起来像这样：\n\
    \n```perl\n#!/usr/bin/perl\nforeach (@ARGV) {\n  system(\"ls -ld $$\") if -d;\n\
    }\n```\n\n使程序变为可执行：\n\n```bash\n$ chmod +x prog.pl\n```\n\n通过只需输入其名称（以及任何命令行参数，在本例中它们是当前目录下所有文件的名称）来运行程序：\n\
    \n```bash\n$ prog.pl *\n```\n\n这种运行 Perl 程序（或任何解释型程序，如 awk 和 shell 程序）的方法适用于支持“解释器文件”概念的系统。文件中的前两个字符必须是\
    \ #!，解释器的路径必须紧随在同一行。参见 exec (2)。\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_17_0.png)\n\
    \n## 运行 Perl\n\n- Perl 程序可以以多种方式运行。\n- 最简单的方法是将程序放在一个文件中，例如 prog.pl，然后输入：\n\n\
    \  $ perl prog.pl\n\n（这里的美元符号是 shell 提示符）\n- 这种方法将调用 perl 解释器来解释 prog.pl 文件。\n\
    - .pl 扩展不是必须的；它只是 Perl 程序员遵循的一种习惯。\n- 运行 Perl 的其他方法见该页。\n\n## 注意事项\n\n考虑以下 Perl\
    \ 程序：\n\n```perl\n#!/usr/bin/perl\nforeach (@ARGV) {\n  system(\"ls -ld $$\")\
    \ if -d;\n}\n```\n\n该程序旨在带有文件名的命令行参数运行。对于每一个目录，它都会执行 \"ls -ld\" 命令。\n\n- 第二行开始了一个\
    \ foreach 循环，在循环的每次迭代中，特殊变量 $_ 将设置为（字符串形式）下一个命令行参数。命令行参数存储在特殊数组 @ARGV 中。\n\n-\
    \ 循环由语句组成，即第三行。该语句是有条件的，if 跟随 system()。system() 函数如果被调用，会将字符串 \"ls -ld $_ 传递给操作系统，操作系统将执行该字符串。\n\
    \n在什么情况下会调用 system() 函数呢？整个程序的伪代码如下：\n\n```text\n对于每个命令行参数:\n将变量 $_ 设置为参数的值\n\
    如果名为 $_ 的文件是目录\n    调用 system() 函数执行 \"ls -ld $\"\n```\n\n或者：\n\n```text\n对于每个命令行参数:\n\
    将变量 $_ 设置为参数的值\n调用 system() 函数执行 \"ls -ld $_\"\n如果名为 $_ 的文件是目录\n```\n\n该程序的更冗余的版本。它较少利用\
    \ Perl 的自动操作，更加显式：\n\n```perl\n#!/usr/bin/perl\nforeach $file (@ARGV) {\n    if\
    \ (-d $file) {\n        system(\"ls -ld $file\");\n    }\n}\n```\n\n第二行使用了 foreach\
    \ 循环而不是 for（它们等效），并指定了 foreach 循环分配字符串的变量名，而不是隐式地分配给特殊变量。变量名为 $file ofile 变量名中的美元符号是变量名的一部分。它不是\
    \ shell 编程和 awk 中的引用操作符。第三行对“目录”的测试与 shell 的 test 命令相似。如果 -d 操作符没有接收到包含文件的参数，它将测试\
    \ $_ 变量的内容，假设其内容是可能是目录的文件名。\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_19_0.png)\n\
    \n"
