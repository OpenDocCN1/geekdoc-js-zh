    \ 在数组上下文中会将整个文件读取到数组中。如果你的文件很大（数百兆字节的文件），请使用循环（可能是 `while` 循环）一次读取并处理一行（或几行）。\n\
    \n# 输入操作符\n\n- `<>` 是一个上下文敏感的操作符，正如我们所见：\n- 在标量上下文中，`<FILEHANDLE>` 返回文件的下一行。\n\
