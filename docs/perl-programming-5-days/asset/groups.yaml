- md: "\n## How Do You Build Perl?\n\n- To get Perl:\n  - A. Download the distribution.\n\
    \  - B. uncompress and gunzip the file.\n    ```bash\n    gunzip -c perl5.003.tar\
    \ | tar xovf - cd perl5.003\n    ```\n  - C. Configure and build Perl (follow\
    \ the README directions).\n- To configure and build Perl (described in the file\
    \ INSTALL):\n  - 1. Run ./Configure. This analyzes your system and runs make depend,\
    \ which prepares Perl's makefiles.\n  - 2. Run make. This compiles the perl executable.\n\
    \  - 3. Run make test. This runs a suite of tests of Perl. If they don't all pass,\
    \ Perl still may be usable.\n  - 3. Run make install. This installs Perl and its\
    \ libraries for use.\n- To install Perl for general use, you may need to do some\
    \ or all of these steps as a privileged user (root, on a UNIX system).\n- Some\
    \ parts (like the man pages) are not automatically loaded.\n\n## What Gets Created\
    \ and Installed?\n\n- As of Perl5.003, the installation creates:\n  - The Perl\
    \ executable, `perl`.\n  - This is commonly, though certainly not necessarily,\
    \ installed in `/usr/local/bin`.\n  - The Perl runtime libraries.\n  - For example,\
    \ `/usr/local/lib/perl5`.\n  - The Perl documentation in a portable, convertible\
    \ format (pod, \"Plain Old Documentation\").\n  - Scripts can turn these files\
    \ into UNIX manpages, HTML, and other formats.\n  - The libraries include:\n \
    \   - Important common libraries and modules.\n    - Optional modules selected\
    \ in `Configure`.\n    - A place to install additional modules you download or\
    \ create.\n  - These go under the `site_perl` subdirectory.\n  - The Perl documentation\
    \ `.pod` files.\n\n## Notes\n\nOn NT, only a subset of the standard Perl5 Kit\
    \ has been implemented. This is because there is usually no direct equivalent\
    \ of the functionality in Windows NT.\n\nAny functions marked with '***' will\
    \ not warn that they are not implemented. Providing this 'warn facility' would\
    \ require changes to the Perl 5 UNIX Distribution. Following are the unsupported\
    \ functions:\n\n- Network routines\n  getnetbyname() getnetbyaddr() getnetent()\
    \ getproto() getserv()\n  sethostname() setnetent() setproto() setserv() endhostname()\n\
    \  endnetent() endproto() endserv() socketpair()\n\n- System V compatible IPC\
    \ routines\n  msgctl() msgget() msgrcv() msgsnd() semctl() semget() semop()\n\
    \  smctl() shget() shmread() shmwrite()\n\n- I/O routines\n  **ioctl() **select($w,\
    \ $x, $y, $z)\n  The single argument version of this function HAS been implemented.\n\
    \n- Filesystem routines\n  **chmod() chroot() **fcntl() flock() link() **lstat()\n\
    \  **readlink() symlink() **sysread() **syswrite() **umask() **utime()\n\n- Security-related\
    \ routines\n  crypt() **login() getpgrp() getppid() getpriority() getpwnam()\n\
    \  getgrnam() getpwuid() getgrid() getpwent() getgent() setpwuid()\n  setgroup()\
    \ endent() endgr() setpgrp()\n\n- Process-related routines\n  fork() kill() pipe()\
    \ setpriority() times()\n  wait() waitpid()\n\n- Miscellaneous routines\n  alarm()\
    \ **close() **dbmopen() **dump() syscall()\n\n## Differences Between Platforms\n\
    \n- The biggest differences between Perl running on different hardware and software\
    \ platforms are due to operating system differences.\n- Perl was created to run\
    \ on UNIX, and there it is happiest.\n- Many of the functions in Perl simply are\
    \ not supported on non-UNIX systems.\n- Even on UNIX, different versions may not\
    \ support certain functions in the same way.\n- Some functions are System V related:\
    \ an example is all the semaphore `semxx()` calls.\n- Some (or all) of the `getnetinfo()`\
    \ type functions are not available on many systems: `gethostbyname()` probably\
    \ is, but `getservbyport()` may not be.\n- Non-multitasking OS's obviously can't\
    \ multitask.\n- Some multi-tasking OS's do it differently: Microsoft NT, for example.\n\
    \n## Appendix 2 - The Perl Debugger\n\n## Notes\n\nThe -d option causes perl to\
    \ do a 'require perldb.pl' which executes some of the debugger code in perldb.pl\
    \ before your program begins, establishes several subroutines, and also essentially\
    \ causes perl to call a subroutine named DB before each line of code in your program.\
    \ The DB subroutine issues the debugger prompt and waits for a debug command.\n\
    \n## Overview of the Perl Debugger\n\n- The Perl distribution comes with a debugging\
    \ facility.\n- You invoke the debugger with the -d command line option.\n- This\
    \ automatically runs your program under control of the debugger.\n- Invocation\
    \ methods:\n\n```\n$ perl -d prog # In the shell\n#!/bin/perl -d # In a program\n\
    ```\n\n## 270 Perl Programming\n\n## Notes\n\n### Debugger Commands\n\n- T Stack\
    \ trace.\n- s Single step.\n- n Next, steps over subroutine.\n- r Return from\
    \ subroutine.\n- c Continue until breakpoint.\n- l List source.\n- p Print variable.\n\
    - x Print expression.\n- n Step over subroutine.\n- s Step into subroutine.\n\
    - u Step out of subroutine.\n- R Run until return.\n- ? Run until line.\n- b Set\
    \ breakpoint.\n- A Clear breakpoint.\n- d Delete breakpoint.\n- w Display variables.\n\
    - L Display locals.\n- G Display globals.\n- f Display functions.\n- h Display\
    \ help.\n- q Quit debugger.\n- c Display status.\n- / Search forward.\n- ? Search\
    \ backward.\n- ! Display line.\n- # Display line.\n- . Display line.\n- , Display\
    \ line.\n- ; Display line.\n- : Display line.\n- < Display line.\n- > Display\
    \ line.\n- = Display line.\n- | Display line.\n- & Display line.\n- * Display\
    \ line.\n- % Display line.\n- ' Display line.\n- \" Display line.\n- [ Display\
    \ line.\n- ] Display line.\n- { Display line.\n- } Display line.\n- / Display\
    \ line.\n- \\ Display line.\n- _ Display line.\n\n## Non-Debugger Commands\n\n\
    - If you type a line at the DB prompt that is not one of the debugger commands,\
    \ then the debugger will execute it as a Perl statement.\n- The statement can\
    \ refer to names in the program.\n- Example:\n\n```\nmain:(ddemo:4):    $x=0;\n\
    DB<1> $x=1\n\nDB<2> q\n```\n"
  mdcn: "\n\n## 如何构建 Perl？\n\n- 获取 Perl：\n  - A. 下载发行版。\n  - B. 解压并对文件进行 gunzip。\n\
    \    ```bash\n    gunzip -c perl5.003.tar | tar xovf - cd perl5.003\n    ```\n\
    \  - C. 配置并构建 Perl（遵循 README 指南）。\n- 配置并构建 Perl（在 INSTALL 文件中描述）：\n  - 1. 运行 `./Configure`。这会分析你的系统并运行\
    \ `make depend`，准备 Perl 的 makefiles。\n  - 2. 运行 `make`。这将编译 perl 可执行文件。\n  - 3.\
    \ 运行 `make test`。这将运行一组 Perl 测试。如果这些测试没有全部通过，Perl 仍然可以使用。\n  - 3. 运行 `make install`。这将安装\
    \ Perl 及其库供使用。\n- 为了通用使用安装 Perl，你可能需要以特权用户（UNIX 系统上的 root）执行这些步骤中的或全部。\n- 部分内容（如\
    \ man pages）不会自动加载。\n\n## 创建并安装了什么？\n\n- 截至 Perl5.003，安装会创建：\n  - Perl 可执行文件 `perl`。\n\
    \  - 这通常（但并非一定）安装在 `/usr/local/bin`。\n  - Perl 运行时库。\n  - 例如，`/usr/local/lib/perl5`。\n\
    \  - 可移植、可转换格式的 Perl 文档（pod, \"Plain Old Documentation\"）。\n  - 脚本可以将这些文件转换为 UNIX\
    \ manpages、HTML 和其他格式。\n  - 库包括：\n    - 重要的常用库和模块。\n    - 在 `Configure` 中选择的可选模块。\n\
    \    - 用于安装你下载或创建的其他模块的地方。\n  - 它们位于 `site_perl` 子目录下。\n  - Perl 文档 `.pod` 文件。\n\
    \n## 注意事项\n\n在 NT 上，只实现了标准 Perl5 套件的子集。这是因为在 Windows NT 中通常没有相应功能的直接等效物。\n\n任何标记为\
    \ '***' 的函数都不会警告它们尚未实现。提供这种“警告机制”需要修改 Perl 5 UNIX 分发版。以下是不支持的函数：\n\n- 网络例程\n \
    \ getnetbyname() getnetbyaddr() getnetent() getproto() getserv()\n  sethostname()\
    \ setnetent() setproto() setserv() endhostname()\n  endnetent() endproto() endserv()\
    \ socketpair()\n\n- System V 兼容 IPC 例程\n  msgctl() msgget() msgrcv() msgsnd()\
    \ semctl() semget() semop()\n  smctl() shget() shmread() shmwrite()\n\n- I/O 例程\n\
    \  **ioctl() **select($w, $x, $y, $z)\n  该函数的单参数版本已经**实现。\n\n- 文件系统例程\n  **chmod()\
    \ chroot() **fcntl() flock() link() **lstat()\n  **readlink() symlink() **sysread()\
    \ **syswrite() **umask() **utime()\n\n- 安全相关例程\n  crypt() **login() getpgrp()\
    \ getppid() getpriority() getpwnam()\n  getgrnam() getpwuid() getgrid() getpwent()\
    \ getgent() setpwuid()\n  setgroup() endent() endgr() setpgrp()\n\n- 进程相关例程\n\
    \  fork() kill() pipe() setpriority() times()\n  wait() waitpid()\n\n- 杂项例程\n\
    \  alarm() **close() **dbmopen() **dump() syscall()\n\n## 之间的差异\n\n- 在不同硬件和软件平台上运行\
    \ Perl 的最大差异在于操作系统的不同。\n- Perl 是为了在 UNIX 上运行而创建的，在那里运行最好。\n- Perl 中的许多函数在非 UNIX\
    \ 系统上不支持。\n- 即使在 UNIX 上，不同版本支持某些函数的方式可能不同。\n- 某些函数与 System V 相关：例如所有的信号量 `semxx()`\
    \ 调用。\n- 某些（或所有）`getnetinfo()` 类型函数在许多系统中不可用：`gethostbyname()` 可能可用，但 `getservbyport()`\
    \ 可能无效。\n- 非多任务操作系统显然不能并行。\n- 某些多任务操作系统的操作方式不同：例如 Microsoft NT。\n\n## 附录 2 - Perl\
    \ 调试器\n\n## 注意事项\n\n-d 选项导致 perl 执行 'require perldb.pl'，在你的程序开始之前执行 perldb.pl\
    \ 中的某些调试器代码，建立几个子程序，并且本质上导致 perl 在你程序的每行代码之前调用一个名为 DB 的子程序。DB 子程序发出调试器提示符并等待调试命令。\n\
    \n## Perl 调试器概述\n\n- Perl 分发版带有一个调试功能。\n- 你使用 -d 命令行选项调用调试器。\n- 这会自动在调试器的控制下运行你的程序。\n\
    - 调用方法：\n\n```\n$ perl -d prog # 在 shell 中\n#!/bin/perl -d # 在程序中\n```\n\n## 270\
    \ Perl 编程\n\n## 注意事项\n\n### 调试器命令\n\n- T 堆栈跟踪。\n- s 单步执行。\n- n 下一步，跳过子程序。\n- r\
    \ 从子程序返回。\n- c 继续执行到断点。\n- l 列出源码。\n- p 打印变量。\n- x 打印表达式。\n- n 跳过子程序。\n- s 进入子程序。\n\
    - u 跳出子程序。\n- R 运行到返回。\n- ? 运行到某行。\n- b 设置断点。\n- A 清除断点。\n- d 删除断点。\n- w 显示变量。\n\
    - L 显示局部变量。\n- G 显示全局变量。\n- f 显示函数。\n- h 显示帮助。\n- q 退出调试器。\n- c 显示状态。\n- / 向前搜索。\n\
    - ? 向后搜索。\n- ! 显示行。\n- # 显示行。\n- . 显示行。\n- , 显示行。\n- ; 显示行。\n- : 显示行。\n- < 显示行。\n\
    - > 显示行。\n- = 显示行。\n- | 显示行。\n- & 显示行。\n- * 显示行。\n- % 显示行。\n- ' 显示行。\n- \" 显示行。\n\
    - [ 显示行。\n- ] 显示行。\n- { 显示行。\n- } 显示行。\n- / 显示行。\n- \\ 显示行。\n- _ 显示行。\n\n## 非调试器命令\n\
    \n- 如果你在 DB 提示符处输入的一行不是调试器命令之一，那么调试器将其作为 Perl 语句执行。\n- 该语句可以引用程序中的名称。\n- 示例：\n\
    \n```\nmain:(ddemo:4):    $x=0;\nDB<1> $x=1\n\nDB<2> q\n```\n\n"
