- md: "\n## Chapter 8 - Regular Expressions\n\n## Chapter Objectives\n\n- Understand\
    \ the concept of pattern matching\n- Learn how to construct regular expressions.\n\
    - Use regular expressions in Perl programs.\n\n## Notes\n\nThe pattern we are\
    \ searching for is the three character sequence 'zzz'. If the string that we are\
    \ searching through contains AT LEAST three z's in a row ANYWHERE in the string,\
    \ then we say \"We have a match.\" The match operator will return a true value\
    \ (for conditional testing) if there is a match, false otherwise.\n\nThe '=~'\
    \ operator is known as a 'pattern bind' operator. When you use the '=~' operator\
    \ to specify a search string other than the default `_ then the expression:\n\n\
    ```\n$string =~ /pattern/\n```\n\nreturns true or false, depending on whether\
    \ the pattern is in the string or not.\n\nThe slashes that delimit the pattern\
    \ can be replaced by any other pair of characters (as long as you use the same\
    \ character to start and end), but if you don't use slashes then you must use\
    \ the 'm', as in `m;pattern`. When would you use other than slashes?\n\nThere\
    \ is also an `/i` modifier which can be used with a pattern match, as in\n\n```\n\
    if (m/zzz/i) {\n```\n\nIn this case, the match will be case insensitive - i.e.\
    \ - it would match zzz or ZZZ or ZzZ, etc.\n\n## Pattern Matching Overview\n\n\
    - Pattern matching is a method of determining if a specified text pattern occurs\
    \ in a string.\n- Perl's operator `/m/` searches a string for a pattern and returns\
    \ true if the string contains (matches) the pattern.\n\nExample:\n\n```\n$line\
    \ = <STDIN>;  # Read a line\nif (m/zzz/) {  # Test if 'zzz' is in $_\n    print\
    \ \"You sleeping?\\n\";\n}\n```\n\n- Unless otherwise specified, the string that\
    \ is searched is `$_`.\n- Two strings, now:\n- To specify a different string,\
    \ use the '=~' operator.\n- If you're using slashes to delimit the pattern, the\
    \ 'm' is optional.\n\n```\n$in = <STDIN>;  # Read a line into $in\nif ($in ~ /zzz/)\
    \ {  # Test if 'zzz' is in $in\n    print \"You sleeping?\\n\";\n}\n```\n\n- Implies\
    \ that with the 'm', you can use a character other than a slash (often used with\
    \ a pattern containing slashes).\n\n```\n$in = <STDIN>;\nif ($in ~ m:/etc/passwd:)\
    \ {\n    print \"It's the password file.\\n\";\n}\n```\n\n## The Substitution\
    \ Operator\n\n- The substitution operator `'s///'` behaves as a superset of the\
    \ match operator `'m//'`.\n- It searches a string for the pattern specified between\
    \ the first two delimiters, and if it finds a match, it replaces the portion of\
    \ the string that matched, with the replacement text specified between the second\
    \ two delimiters.\n\nExample:\n\n```perl\n# Replace Mom with Mother in $_\ns/Mom/Mother/g;\n\
    ```\n\n- The trailing 'g' in `s/Mom/Mother/g` says to replace ALL occurrences\
    \ of Mom in `$_`, instead of only the first. (g means global)\n- The substitution\
    \ string can contain Perl variables.\n\n## Notes\n\nAfter reading the facing page,\
    \ you may be wondering how to match a period. If you specify a period in a pattern,\
    \ it doesn't \"stand for\" or \"mean\" a period, it serves as a \"wildcard\" with\
    \ special meaning. To match a literal period, you need to remove the special meaning\
    \ of the period, i.e. to quote it. In an RE, you precede a metacharacter with\
    \ a backslash to remove the metachar's special meaning and make it stand for itself.\
    \ To see if `$_` has a period in it, you would say:\n\n```perl\nif ( /\\./ ) {\
    \ ... };\n```\n\nBy the way, an unquoted period metachar does match a literal\
    \ period too, because it matches any single character. But, if the match operator\
    \ returns true, it could have been any character that caused the match, so if\
    \ you specifically want to know if a period (or any other specific character,\
    \ specifically) is in the string then you better go with a literal.\n\nAn RE can\
    \ consist of alternatives, which are REs separated by a vertical bar.\n\nIf any\
    \ of the alternatives match, then the RE matches.\n\nExamples:\n\n```perl\n# Be\
    \ more low key\ns/ardent|fervent|passionate/warm/g;\n\n# Capture in @codes all\
    \ lines that start\n# with other than Ax or By\n@lines = <SOMEHANDLE>;\n@codes\
    \ = grep(!^Ax^By/, @lines);\n```\n\n## Regular Expressions\n\n- The patterns that\
    \ we have been talking about are called *regular expressions*, abbreviated *RE*.\n\
    - REs provide a comprehensive syntax for specifying patterns of text.\n\n```perl\n\
    # Replace all five character sequences\n# that match: a space, then 00, then any\n\
    # single character, then a space.\n/ 00. /AGENT/g;\n```\n\n- The period does not\
