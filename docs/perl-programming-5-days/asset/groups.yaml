    \ available from:\nhttp://www.perl.com/perl/faq/index.html\n\n# 262 Perl Programming\n\
    \n# Notes\n\nFrom the Perl 5.002 README document:\n\n# Installation\n\n- 1) Run\
    \ Configure. This will figure out various things about your system. Some things\
    \ Configure will figure out for itself, other things it will ask you. It will\
    \ then proceed to make config.h, config.sh, and Makefile. You may have to explicitly\
    \ say -sh Configure to ensure that Configure is run. If you're a hotshot, run\
    \ Configure -d to take all the defaults and not edit config.sh to patch up any\
    \ flaws.\n\nConfigure supports number useful options. Run Configure -h to get\
    \ a listing. To compile with gcc, for example, you can run Configure -Dcc=gcc,\
    \ or answer 'gcc' at the cc prompt.\n\n- 2) Glance through config.h to make sure\
    \ system dependencies are correct. Most of them should have been taken care of\
    \ by running the Configure script.\n\nIf you have any additional changes to make\
    \ to the C definitions, they can be done in cflags.sh. For instance, to turn off\
    \ the optimizer in tome.c, find the line in the switch structure for tome.c and\
    \ put the command optimize='-g' before the ;; To change the C flags for all the\
    \ files, edit config.sh and change either Configure or optimizer.\n\n- 3) make\n\
    \nThis will look for all the includes and modify Makefile accordingly. Configure\
    \ will offer to do this for you.\n\n- 4) make\n\nThis will attempt to make perl\
    \ in the current directory.\n\nIf you cant compile successfully, try adding -DCRIPPLED\
    \ CC flag. (Just because you get no errors doesn't mean it compiled right!) This\
    \ simplifies some complicated expressions for compilers that get indigestion.\
