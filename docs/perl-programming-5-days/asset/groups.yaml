    # # Chapter 10 - Quoting and Interpolation


    # ## Chapter Objectives


    +   * Use the three different forms of quoting.

    * Take advantage of the rich set of interpolation control characters.

    * Use `join` as an alternative to array interpolation.

    * Use `join` to create delimited records.

    * Create and use here documents as a form of multi-line quoting.'
  - '[PAGE 133]


    # Notes


    String literals can be more than one line long. The newline characters will become
    part of the string just like any other character, except you can''t see them.
    The only way you know that a string has a newline is because a newline appears
    within the string!


    ```

    #!/bin/perl

    # File multi.pl


    $multi = "This is what may

    be called a string paragraph.

    Clever, eh";


    print $multi, "\n";

    ```


    Why do we need to quote these string literals anyway?


    In order for the Perl program to be able to tell what you want it to do, often
    you must give it specific instructions. By putting quotes around a string of characters,
    you are doing several things: telling Perl to treat these characters as a single
    data object; to interpret certain things (notably \n) as having special meaning;
    and telling Perl to treat the string as literal characters. If you didn''t quote
    a string, Perl might think you are talking to filehandles, or calling certain
    functions. Quoting is important!'
  - '[PAGE 134]


    # String Literals


    +   * A string literal is a sequence of characters enclosed in (delimited by)
    single or double quotes.


    +   * Substitutions can occur inside double-quoted strings.


    +   * A substitution replaces certain characters in the string with something
    else.


    +   * Example


    ```

    $$v = "hello";

    print "$v", "\n";   # A list

    print "$v\n";                   # A scalar

    ```


    ```

    print ''$$v'', "\n";   # Single quotes

    print ''$$v\n'';                   # What???

    ```


    +   * Which "certain characters" in the example were replaced? Which weren''t?


    +   * Perl calls substitution "interpolation".


    +   * An array inside double quotes is turned into a constant string and will
    be dealt with in a scalar context:


    ```

    $line = "@date";

    ```


    +   * Elements of the array are normally separated by single spaces.'
  - '[PAGE 135]


    # Notes


    Backslash characters


    +   - \n Newline (line feed)

    - \r Return

    - \t Tab

    - \f Form feed

    - \b Backspace

    - \nnn Octal representation of ASCII (1,2, or 3 digits)

    - \xnn Hex representation of ASCII

    - \cX Control character, where x is one of A through z

    - \u Force next character to upper case

    - \l Force next character to lower case

    - \U Force characters to upper case

    - \L Force characters to lower case

    - \E End \U or L


    See the UNIX manual entry for ascii(type:man ascii) to see all the octal and hex
    representations of the ASCII character set.


    Examples


    ```

    print "\0101"; # A

    print "\0041"; # !

    print "\0007"; # bel

    ```


    Additional Perl5 characters


    +   - \v Vertical tab (whatever that is)

    - \a Alarm (bell)

    - \e Escape

    - \Q Quote regular expression metacharacters until\E'
  - '[PAGE 136]


    # Interpolation


    +   - Two types of interpolation are backslash substitution and variable substitution.


    +   - Variable substitution


    +   - Variable substitution replaces scalar or array variables with their values.


    +   - Braces are required around the variable identifier if extra characters follow
    immediately:


    ```

    $$prefix = "hot";

    print "${prefix}dog\n";

    ```


    +   - Backslash substitution


    +   - Certain characters, when preceded by a backslash, "make" other characters


    ```

    print "Fine.\n";

    print "MAKE\tMODEL\tYEAR\tPRICE\n";

    ```'
  - "[PAGE 137]\n\n# Notes\n\nIf you look in the Gory Details chapter, at its end\
    \ is a section on special variables. Perl has lots of these, and they do many\
    \ things. Because they can be so cryptic, perl5 introduced alternative names for\
    \ each, which describe what they do. For example, \"$\" can be accessed by the\
    \ name LIST_SEPARATOR.\n\nIn order to make these work, you must use the statement:\n\
    \n```\nuse English;\n```\n\nin your program before you use the names.\n\nIf the\
    \ first time perl \"sees\" an array is inside double quotes, it will generate\
    \ an error because perl assumes that an @ sign in front of an un-used name inside\
    \ double quotes is intended to be a literal.\n\n```\nprint \"@null_array\";\n\
    ```\n\nIn fact, you can't even assign inside double quotes because the quotes\
    \ make the = operator a literal:\n\n```\nprint \"@null_array = (1,2,'a')\";\n\
    ```\n\nHere's a nifty trick to print an array as a comma-separated list of quoted\
    \ fields:\n\n```\n#!/usr/bin/perl\n# File: quoter.pl\n\nop (PW, /etc/passwd )\
    \ \\| || die \"Can't open the password file.\\n\"\n$oldsep = $\\$; # Save this\
    \ for later.\n$ = q,'/',; # Change array interpolation string $\\$\nnwhile ($record\
    \ = <PW>) {\n  chomp $record;\n  $record = \"\\$\\$.record.\\$\"; # Outside quotes\
    \ for 1st & last fields.\n  @rec = split (/:, $record); # Split into array.\n\
    \  print \"@$rec\\n\"; # Interpolate with modified $\\$\n}\nclose (PW);\n```\n\
    \n```\n$$ = $oldsep; # Restore original $\\$ for later use in this script.\n```\n\
