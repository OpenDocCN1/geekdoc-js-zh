    4.  **Formatting**: Cleaned up the lists.\n\n[content]\n## Arrays of Arrays\n\n\
    - Let's say we create three ordinary arrays,\n\n```\n@cat = ( 'Buzz', 'Kiki' );\n\
    @dog = ( 'Rex', 'Fido', 'Bowser' );\n@fish = ( 'Wanda', 'Mr. Limpet' );\n```\n\
    \nWhat happens here?\n\n```\n@pets = ( @cat, @dog, @fish );\n```\n\n- Let's create\
    \ an array, each item of which is a *reference* to an array:\n\n```\n@pets = (\
    \ \\cat, \\dog, \\fish );\n```\n\n- We can now treat @pets as a two-dimensional\
    \ array.\n\n- To get an individual element,\n\n```\nprint $pets[1][2], \"\\n\"\
    ;\n```\n\n- To add an element to one of the arrays,\n\n```\n$pets[2][2] = 'Flounder';\
    \ # Add a fish to @pets.\nprint $pets[2][2], \"\\n\";\nprint $fish[2], \"\\n\"\
    ; # @fish was modified.\n```\n\n- To print out all the elements,\n\n```\nforeach\
    \ $animal ( @pets )\n{\n    print \"$animal: \\n\";\n    foreach $name ( $animal\
    \ )\n    {\n        print \" $name\\n\";\n    }\n}\n```\n\n## Notes\n\nWe could\
    \ have created @pets:\n\n```\n$c = \\cat; $d = \\dog; $f = \\fish;\n@pets = (\
    \ $c, $d, $f );\n# List of scalars containing array references\n```\n\nor,\n\n\
    ```\n$c = [ 'Buzz', 'Kiki' ];\n$d = [ 'Rex', 'Fido', 'Bowser' ];\n$f = [ 'Wanda',\
    \ 'Mr. Limpet' ];\n@pets = ( $c, $d, $f );\n# List of scalars containing anonymous\
    \ array references\n```\n\nor,\n\n```\n@pets = ( [@cat], [@dog], [@fish] ); #\
    \ List of anonymous array references, items copied\n```\n\nor even,\n\n```\n@pets\
    \ = ( ['Buzz', 'Kiki'], ['Rex', 'Fido', 'Bowser'], ['Wanda', 'Mr. Limpet'] );\n\
    ```\n\nIn every case, the @pets array contains three scalars, each of which is\
    \ a reference to an array value.\n\nConsider the first example:\n\n```\n$c = \\\
    cat; $d = \\dog; $f = \\fish;\n@pets = ( $c, $d, $f ); # List of scalars containing\
    \ array references\n```\n\nNow, $c is a reference to an array. We can dereference\
    \ it, and get an element of the referenced array, like this:\n\n```\n$x = $$c[1];\n\
    $x = $$c[1]; # Same as $x = $$c[1]; the braces are optional in this case.\n```\n\
    \nRecall the infix dereference operator ->, which is another way to dereference\
    \ an array or hash:\n\n```\n$x = $c->[1]; # Same as $x = $$c[1]\n```\n\nNow, nothing\
    \ changes when the variable containing the reference to the array or hash is itself\
    \ an array element, though you may need some braces\n\n```\n$x = $$pets[0][1];\
    \ # Braces necessary, so that $pets[0] is dereferenced first.\n```\n\nor, using\
    \ the infix operator:\n\n```\n$x = $$pets[0]->[1]; # $pets[0] is a reference to\
    \ @cat, just as $c is.\n```\n\nFinally, you can leave off the infix operator:\n\
    \n```\n$x = $$pets[0][1]; # Say... this is just a two-dimensional array!\n```\n\
    \nWhy? Between each pair of adjacent brackets, the infix dereference operator\
    \ is implied automatically.\n\nIn fact, what we call a “two-dimensional array”\
    \ is actually just an array of array references!\n\n## Arrays of References\n\n\
    - What we created on the previous page was an array of references.\n- @cat is\
    \ an array.\n- \\@cat is a reference to @cat.\n- Each element of @pets is a reference\
    \ to an array.\n\n- Remember how to dereference a reference?\n\n```\n$x = \\$y;\
    \ # Create a reference to scalar value of $y\nprint $$x; # Dereference $x, get\
    \ scalar value of $y\nprint ${($x); # Same ... braces around the name of the\n\
    # variable containing the reference, for\n# clarity. You could also think of {$x}\n\
    # as a BLOCK returning the reference in $x,\n# and ${$x} dereferences the returned\n\
    # reference. If that helps.\n```\n\nSame thing here; dereference a reference that's\
    \ an array element:\n\n```\nprint ${$pets[2]][1], \"\\n\";\n```\n\nWe could choose\
    \ to use the infix operator ->, since $pets[2] is a reference to an array.\n\n\
    ```\nprint $pets[2]->[1], \"\\n\";\n```\n\nOr, since this is exactly the same\
    \ as a “two-dimensional array\",\n\n```\nprint $pets[2][1], \"\\n\";\n```\n\n\
    ## A Hash of Arrays\n\n- We can use references to our three arrays as values in\
    \ a hash.\n- References cannot be used as hash keys.\n\n```\n%pets = ( 'cat',\
    \ \\cat, 'dog', \\dog, 'fish', \\fish );\n```\n\n- The keys of the %pets hash\
    \ are 'cat', 'dog', and 'fish'.\n\n- The values of the %pets hash are references\
