  - '[PAGE 138]


    # Array Substitution


    +   - Array elements are scalars so they are interpolated like any other scalar.


    $end = "Last array value is $array[#array]\n";


    +   - When entire arrays are interpolated, their elements are separated by the
    contents of the special variable $, whose default value is a single space.


    +   - Examples


    $spaced_out = "@array";


    $ = ":";

    $columns_sep = "@array";


    $ = "--"; # A string separator

    print "@array\n";


    +   - The join function could do the above as follows:


    $spaced_out = join(" ", @array);

    $colons_sep = join(":", @array);

    print join("--", @array), "\n";'
