    \ Operators\n\n- Perl's unary file test operators are somewhat akin to the UNIX\
    \ test command.\n- Given a file name (or an open filehandle), they return information\
    \ about the file.\n- If the file name argument is omitted, they test $_ (except\
    \ for -t).\n- Examples\n\n```perl\n$report = \"weekly.rpt\";\nif (-w $report)\n\
    {\n    print \"$report is writable\\n\";\n}\n```\n\n```perl\n#!/bin/perl\n# File:\
    \ listext.pl\n\n# This program lists the sizes and names of\n# all text files\
    \ in the current directory.\n\n@files = `ls`;      # Grab output of 'ls'\nchomp(@files);\
    \     # Chop newline off each filename\n\nforeach (@files)\n{\n    # Use $_ heavily\n\
    \    print (-s, \"\\t___\\n\") if -T;\n}\n```\n\n# Notes\n\nPerl also supports\
    \ C's ternary operator, ?::\n\nIt works similarly to an if-then-else construct,\
    \ except it returns a value. The line\n\n```perl\n$y = ( $x ? 5 : 10 );\n```\n\
    \nwill evaluate $x as true or false. If $x is true, the ternary operator returns\
    \ 5 which is then (in our example) loaded into $y. If $x evaluates false, 10 would\
    \ be returned instead.\n\nIn Perl5, the ternary operator is now a legal lhs (left\
    \ hand statement) as follows:\n\n```perl\n( $check ? $true : $false ) = 'abc';\n\
    ```\n\nPerl will test the value of $check. If it is true, the string 'abc' will\
    \ be loaded into $true.\n\nIf $check evaluates false, $false will be loaded with\
    \ 'abc'. Pretty weird!\n\n# Assignment Operator Notations\n\n- Like C, Perl provides\
    \ several shorthand operator notations.\n- Assignment from an operation that includes\
    \ the variable being assigned to, can be written in a shorthand notation:\n\n\
    ```perl\n$var OP= $value  means $var = $var OP $value\n\n# $total = $total + $count;\n\
    $total += $count;\n\n# Concatenate last name to the first name\n$name = $first;\n\
    $name .= \" $last\";  # Concatenate\n```\n\n- The pre and post increment and decrement\
    \ operators (called autoincrement or autodecrement) change the value of a variable\
    \ before or after its use in an expression.\n\n```perl\n# Put the value \"FREE\"\
    \ into first 5\n# elements of @first_five\nwhile ($head_count < 5) {\n  $first_five[$head_count++]\
    \ = \"FREE\";\n}\n\n# Bump count before totaling\n$total = $total + ++$count;\n\
    \n# Bump count after totaling\n$total = $total + $count++;\n```\n\n- Magic: If\
    \ the variable being incremented (not decremented) is:\n- a non-numeric string\n\
    - and is either all or alphas followed by numerics then it will be autoincremented\
    \ as a string with carry.\n\n# Notes\n\nMagic: If the variable being incremented\
    \ (not decremented) is:\n\n1. A non-numeric string,\n2. Is either all alphas or\
    \ alphas followed by numerics\n\nthen it will be magically autoincremented as\
    \ a string with carry.\n\nThe \"magic\" version of the autoincrement operator\
    \ is used when the variable being autoincremented is a string that meets the stated\
    \ conditions. The operator will increment the string variable by treating alphabetic\
    \ characters as sort of a base-26 number system with letters serving as numbers.\
    \ The Camel book's examples on page 79 demonstrate this admirably. They look kind\
    \ of like this:\n\n```perl\n$var = '99'; print ++$var;      # Prints 100 (non\
    \ magic)\n$var = 'x'; print ++$var;      # Prints y\n$var = 'ab'; print ++$var;\
    \      # Prints ac\n$var = 'az'; print ++$var;      # Prints ba\n$var = 'ZZ';\
    \ print ++$var;      # Prints AAA\n$var = 'z'; print ++$var;      # Prints aa\n\
    ```\n\nThe autoincrement operators are not magic. What would each of the above\
    \ print if --?\n\n# Range Operator\n\n- The range operator (..) behaves differently\
    \ depending on which context it is used (list or scalar).\n- In list context,\
    \ it generates a list of values ranging from the left to the right, counting by\
    \ one.\n- The range operator is \"magic\".\n\n```perl\n@top = (0..3);        \
    \      # (0,1,2,3)\n@hun = (0..100);\n@caps = ('A'..'Z');        # Magic\n@lowers\
    \ = ('a'..'z');      # Magic\n@alphas = ('A'..'z');      # Magic\n@alphas = ('a'..'dd');\
    \     # Magic\n# The next one is an array slice\n@ending = @hun[$5];\n```\n\n\
    - See the Perl book for a deep discussion of scalar operator.\n\n# Notes\n\nThere\
    \ is also a qw() operator, which is designed to quote words: delimited strings.\
    \ An example would be:\n\n```perl\n@array = qw(foo baz one two three);\n```\n\n\
    The qw() operator yields a list. Each word enclosed by qw() is an element of the\
    \ list. \nThe above example is equivalent to:\n\n```perl\n@array = ('foo', 'baz',\
    \ 'one', 'two', 'three');\n```\n\n# Quotation Operators\n\n- Perl has generalized\
    \ forms of the different kinds of quotation marks.\n- These allow you to delimit\
    \ text within operators other than the actual marks.\n- The q() operator is equivalent\
    \ to a pair of single-quotes.\n\n```perl\n$s = q(Isn't amazing); # same as single-quoted\
    \ string\n```\n\n- Without this operator, embedded quotes become troublesome:\n\
    \n```perl\n$s = 'Isn\\'t it amazing';\n$t = 'I said, The secret word is tomat.';\n\
    ```\n\n- The qq() operator is the same as a pair of double-quotes.\n\n```perl\n\
    print qq(\"Hello, World!\\n\");\n```\n\n- For all of the generalized quote operators\
    \ (there are some more):\n1. You can substitute any non-word character for /.\n\
    \n```perl\n$path = q(/usr/local/perl/);\n$path = qq(\"Program Files/$app\");\n\
    ```\n2. If you use (, [, or { to begin the quoted string, use the closing bracket\
    \ to end it:\n\n```perl\n$t = q{I said, The secret word is tomat.};\n```\n\n#\
    \ Notes\n\nThe tr() and y() operators scan an input string, and replace all occurrences\
    \ of a list of characters with some other character from a second list.\n\n```perl\n\
    $line = 'ABCDEFGHIBA';\n$line =~ tr/ABC/XYZ;\n```\n\n$line will now hold: XYZDEZYX.\n\
    y is simply a synonym for tr to make people happy.\n\n# Pattern Matching Operators\n\
    \n- m/STRING/ is the pattern match operator.\n- It returns true if the pattern\
    \ STRING is found inside $_\n- You can check other scalars by binding them to\
    \ the matching operator with the pattern operator, =~:\n\n```perl\n$data =~ m/foo/;\n\
    ```\n\n- The substitute operator goes one step further; if the pattern is found,\
    \ it replaces it with another string:\n\n```perl\ns/foo/bar/g;\n```\n\nwill change\
