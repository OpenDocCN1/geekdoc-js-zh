    }\n```\n\n## 注意事项\n\n范围运算符 ... 创建一个列表，该列表从左操作数的值开始，一直计数到右操作数的值。\n\n```perl\nperl\
    \ -e 'print (0..10);\n\n@arr = ('a'..'z');\nprint $arr[23]; $arr[1], $arr[$arr];\n\
