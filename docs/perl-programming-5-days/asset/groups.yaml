    **readlink() symlink() **sysread() **syswrite() **umask() **utime()


    +   Security-related routines

    crypt() **login() getpgrp() getppid() getpriority() getpwnam()

    getgrnam() getpwuid() getgrid() getpwent() getgent() setpwuid()

    setgroup() endent() endgr() setpgrp()


    +   Process-related routines

    fork() kill() pipe() setpriority() times()

    wait() waitpid()


    +   Miscellaneous routines

    alarm() **close() **dbmopen() **dump() syscall()'
  - '[PAGE 267]


    # Differences Between Platforms


    +   - The biggest differences between Perl running on different hardware and software
    platforms are due to operating system differences.


    +   - Perl was created to run on UNIX, and there it is happiest.


    +   - Many of the functions in Perl simply are not supported on non-UNIX systems.


    +   - Even on UNIX, different versions may not support certain functions in the
    same way.


    +   - Some functions are System V related: an example is all the semaphore `semxx()`
    calls.


    +   - Some (or all) of the `getnetinfo()` type functions are not available on
    many systems: `gethostbyname()` probably is, but `getservbyport()` may not be.


    +   - Non-multitasking OS''s obviously can''t multitask.


    +   - Some multi-tasking OS''s do it differently: Microsoft NT, for example.'
  - '[PAGE 268]


    # Appendix 2 - The Perl Debugger'
  - '[PAGE 269]


    # Notes


    The -d option causes perl to do a ''require perldb.pl'' which executes some of
    the debugger code in perldb.pl before your program begins, establishes several
    subroutines, and also essentially causes perl to call a subroutine named DB before
    each line of code in your program. The DB subroutine issues the debugger prompt
    and waits for a debug command.'
  - '[PAGE 270]


    # Overview of the Perl Debugger


    +   - The Perl distribution comes with a debugging facility.

    - You invoke the debugger with the -d command line option.

    - This automatically runs your program under control of the debugger.

    - Invocation methods:


    ```

    $ perl -d prog # In the shell

    #!/bin/perl -d # In a program

    ```'
  - '[PAGE 271]


    # 270 Perl Programming


    # Notes


    Debugger Commands


    +   - T Stack trace.

    - s Single step.

    - n Next, steps over subroutine calls.

    - r Return from current subroutine.

    - c [line] Continue, optionally inserts a one-time-only breakpoint at the specified
    line.

    - <CR> Repeat last n or s.

    - 1 min+incr List incr+1 lines starting at m.

    - 1 min-max List lines.

    - 1 line List line;

    - - List next window.

    - - List previous window.

    - w line List window around line.

    - l subroutine List subroutine.

    - f filename Switch to filename (from a previous ''require'' statement'').

    - /pattern/ Search for pattern; final / is optional.

    - ?pattern? Search backwards for pattern.

    - L List breakpoints and actions.

    - S List subroutine names.

    - t [line] [condition] Set breakpoint; defaults to the current execution line;
    breaks if it evaluates to true; defaults to ''\1''.

    - b subroutine [condition] Set breakpoint at first line of subroutine.

    - d [line] Delete breakpoint.

    - D Delete all breakpoints.

    - a [line] command Set an action to be done before the line is executed. Sequence:
    is check for breakpoint, print line if necessary, do action, prompt user if breakpoint
    or step, evaluate line.

    - V [pkg [vars]] List some (default all) variables in package (default current).

    - X [vars] Same as "V current_package [vars]"

    - < command Define command before prompt.

    - > command Define command after prompt.

    - ! number Redo command (default previous command).

    - ! -number Redo number th to last command.

    - H -number Display last commands (default all).

    - q or ^D Quit.

    - p expr Same as "print DB_OUT expr" in current package.

    - = [alias value] Define a command alias, or list current aliases.

    - command Execute a command alias as perl statement in current package.'
  - '[PAGE 272]


    # Debugger Commands


    +   - Listed on the facing page are debugger commands. They are also in the Perl
    book under the Debugging section in the Other Oddments chapter.


    +   - Look at the program ''ddemo'', then let''s run it and try some commands:


    ```

    $ perl -d ddemo

    Loading DB routines from perl5db.pl version 1

    Emacs support available.

