  - '[PAGE 122]


    # Overview of Subroutines


    +   A subroutine is declared as follows:


    sub NAME BLOCK


    +   The declaration can occur anywhere in a script with ''&'' or ''do'' operators:


    +   Subroutines can be called with either the ''&'' or ''do'' operators:


    &SUBROUTINE [ ( [LIST] ) ];


    do SUBROUTINE ( [LIST] ); # ''do'' is frowned # upon now.


    +   The return value of a subroutine is the value of the last statement executed
    in the subroutine BLOCK.


    +   The ''return'' statement can be used to explicitly return a value AND return
    from the subroutine.


    +   Return values can be either scalar values or array values. (We''ll see how
    ...)


    +   Variables in a subroutine are not local unless made so. (We''ll see how ...)


    +   In Perl5, the & and parens are optional if the subroutine has been pre-declared
    (if Perl knows that a subroutine of that name exists).


    +   This allows subroutines to look exactly like functions/operators.'
  - "[PAGE 123]\n\n# Notes\n\nThere is a possible problem if you use an array to off-load\
    \ @_ inside the subroutine. Consider the following example:\n\n```\nsub foo {\n\
    \  (@x,@y) = @_;\n  return @y;\n}\n```\n\nWe intend to be able to call the sub\
    \ as follows:\n\n```\nprint (&foo(@array1,@array2));\n```\n\nWe intend to have\
    \ the sub return the second array, but it doesn't. The problem is that Inside\
    \ the sub, @x doesn't know when to stop getting scalars from @_, so it soaks up\
    \ all of them! We have to add an additional argument at the front of the subroutine\
    \ to pass the actual size of the first array passed in:\n\n```\nsub foo {\n  ($size,@y)\
    \ = @_;\n  @x = splice(@y,0,$size);\n  return @y;\n}\n```\n\nShortly, we will\
    \ see a better way to accomplish this."
