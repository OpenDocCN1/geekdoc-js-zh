    \ \"hot_data\") || die \"hot_data is ice cold\";nnexti = 0;\nwhile (<INFILE>)\
    \ {\n    if (/\\^#]/) {  # By default, $_ is searched for RE's\n        push @hot,\
    \ $_;\n    }\n}\nprint @hot;\n```\n\nA note of warning:\n\nThe use of the input\
    \ operator as arrays makes it easy and fast to work with data stored in a line-oriented\
