    # Notes


    Refer to individual values of the array elements by numeric subscript, replacing
    the @ with $.


    ```

    $freshest = $candy[1];

    ```


    If you forget to use $ instead of @, this statement still appears to work,


    ```

    $freshest = @candy[1];

    ```


    However, something different is happening here (called an *array slice* - more
    in a few pages...). The value on the right is then a *list* value, rather than
    a scalar - a list of just one element: ($candy[1]). Since the variable on the
    left is a scalar, the list value on the right is then evaluated in scalar context.
    Recall that a *list* value in scalar context yields the lists last value, so the
    two statements above have the same side side effects, but for different reasons.'
