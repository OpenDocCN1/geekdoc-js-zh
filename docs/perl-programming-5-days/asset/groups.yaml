    \ 0 or more x's\n- `x+` Matches 1 or more x's\n- `x(m,n)` Matches at least m x's\
    \ but not more than n\n\n- `abc` Matches all of a,b, and c in order\n- `fee|fie|foe`\
    \ Matches one of fee, fie, or foe\n\n- `\\b` Matches a word boundary (outside\
    \ [] only)\n- `\\B` Matches a non-word boundary\n- `^` Anchors match to the beginning\
    \ of a line or string\n- `$` Anchors match to the end of a line or string\n\n\
    - Perl only:\n- `\\A` Match only at beginning of string\n- `\\Z` Match only at\
    \ end of string\n- `\\G` Match only where previous m//g left off\n\n## Lab\n\n\
    1. Write a program that opens and reads from the file `/etc/services`. If a line\
    \ begins with a word which ends in `tp`, print the line. (Solution: tpsvc.pl)\n\
    \n2. Write a program that opens and reads from the file `/etc/passwd`. If a line's\
    \ first field is a word that starts with one or more letters, and contains one\
    \ or more digits, print the line. (Solution: acct.pl)\n\n3. Print the lines from\
    \ files in this chapter's directory that contain the characters `^` and `$`. (Solution:\
    \ s2.pl)\n\n4. Change the 213 area code to 214 in all lines of `listp`. Before\
    \ changing it to 214, you should change it to something very visible like `###`\
    \ so that you can verify that the change did what you wanted. Don't actually modify\
    \ the contents of `listp` just print the changes. (Solution: s3.pl)\n\n5. Display\
    \ all lines of `regs` that:\n   a. Contain only numeric characters.\n   b. Contain\
    \ only uppercase alphas.\n   c. Consist of exactly two uppercase alphas, and nothing\
    \ else.\n   d. Consist of exactly three characters.\n   e. Contain a 5-digit number\
    \ starting with 12 and ending with 89.\n   f. Contain a 6-digit number starting\
    \ with 12 and ending with 89.\n   g. Contain a 5-digit number starting with 12\
    \ and ending with 89, with a 3, 4, or 5 in the middle.\n   h. Contain a 5-digit\
    \ number starting with 12 and ending with 89, with a 3 in the middle.\n   i. Contain\
    \ any number starting with 12 and ending with 89.\n   j. Contain any string starting\
    \ with 12 and ending with 89.\n   k. Contain exactly two uppercase alphas, and\
    \ anything else.\n(Solution: s5.pl)\n\n## Chapter 9 - Subroutines\n\n## Chapter\
    \ Objectives\n\n- Call subroutines in a number of different ways.\n- Pass in variables\
    \ to a subroutine.\n- Control scoping and lifetime of variables.\n- Return data\
    \ from subroutines.\n\n## Notes\n\nExample:\n\n```perl\n#!/usr/bin/perl\n# File:\
    \ ret.pl\n$return = 0;\n$return = &sub_one;\nprint \"main: $return\\n\";\n\nsub\
    \ sub_one {\n    98 + 1;\n    # or: return 99;\n}\n```\n\nExample:\n\n```perl\n\
    #!/usr/bin/perl\n# File: global.pl\n$a=5;\n&sub_two;\nprint \"main: $a\\n\";\n\
    \nsub sub_two {\n    print \"sub_two: $a\\n\";\n    $a = 6;\n}\n```\n\n## Overview\
    \ of Subroutines\n\n- A subroutine is declared as follows: `sub NAME BLOCK`\n\
    - The declaration can occur anywhere in script with `&` or `do` operators.\n-\
    \ Subroutines can be called with either the `&` or `do` operators: `&SUBROUTINE(LIST)`\n\
    - The return value of a subroutine is the last statement executed in the subroutine.\n\
    - The `return` statement can be used to explicitly return a value.\n- Return values\
    \ can be either scalar or array values.\n- Variables in a subroutine are not local\
    \ unless made so.\n- In Perl5, `&` and parens are optional if the subroutine name\
    \ has been pre-declared.\n- This allows subroutines to look exactly like functions.\n\
    \n## Notes\n\nThere is a possible problem if you use an array to load inside the\
    \ subroutine. Consider the following:\n\n```perl\nsub foo {\n    (@y) = @_;\n\
    \    return $y;\n}\n```\n\nWe intend to be able to call the sub as follows:\n\n\
    ```perl\nprint (&foo(@array2));\n```\n\nWe intend to have the sub return the second\
    \ array, but it doesn't. The problem is that inside the sub, `@_` doesn't know\
    \ when to stop getting scalars, so it soaks up all of them! We have to add an\
    \ additional argument at the front of the subroutine to pass the actual size of\
    \ the first array passed:\n\n```perl\nsub foo {\n    $size = shift;\n    (@y)\
    \ = @_;\n    @y = splice(@y, 0, $size);\n    return @y;\n}\n```\n\nShortly, we\
    \ will see a better way to accomplish this.\n\n## Passing Arguments\n\n- Arguments\
    \ are passed to a subroutine as a list.\n```perl\n&open_all('file1', 'file2',\
    \ \"other\");\n```\n\n- In the subroutine, the arguments are available in the\
    \ array `@_`.\n```perl\n$sum = add(1,2,3);\nprint \"$sum\\n\";\n\nsub add {\n\
    \    ($first, $second, $third) = @_;\n    return $first + $second + $third;\n\
    }\n```\n\n- The array `@_` is local, but its values are modifiable by the arguments.\n\
    ```perl\n$a = 0;\nfoo($a);\nprint \"$a\\n\"; # Prints 1\nsub foo {\n    $_[0]\
    \ = 1; # 0th element of @ refers to $a\n}\n```\n\n## Subroutine Variables\n\n\
    To modify the value of a global scalar or array in a subroutine:\n- Refer to it\
    \ by its name WITHOUT local declaration.\n\nTo modify the value of a passed scalar\
    \ or array in a subroutine:\n- Refer to it through `@_`, as in `$[0]=9`.\n\nTo\
    \ make a variable local AND prevent a global name conflict, use the `local()`\
    \ operator:\n\n```perl\nsub thing {\n  # Provide a meaningful name, might trash\
    \ global\n  ($possibly_global) = @;\n\n  # Get meaningful argument names, AND\
    \ make them local\n  local($passed_in1, $passed_in2) = @;\n\n  # Just create a\
    \ local variable to avoid global conflict\n  local($truly_local);\n}\n```\n\n\
    To modify the structure of a global array (i.e., push, pop, or change its size\
    \ in any way):\nPass the *name of the array.\n\nThe `my()` function in Perl5 allows\
    \ you to create a \"local\" variable which is truly local to that subroutine,\
    \ block, or eval, and is completely hidden from the outside world. It is considered\
    \ safer than local()` as the scope extends only to the subroutine itself, not\
    \ to other subroutines called from it (a local variable will be accessible to\
    \ a called subroutine).\n\n## Local Variables\n\n- To create local variables in\
    \ a subroutine, use the `local` operator.\n```perl\nlocal($VARS);\nlocal($VARS)\
    \ = (LIST);\n```\n\nExample:\n\n```perl\n#!/usr/bin/perl\n# File: pass.pl\n$b\
    \ = 1;\n$a = 5;\n&sub_one($a);\nprint \"main a: $a\\n\";\nprint \"main b: $b\\\
    n\";\n```\n\n```perl\nsub sub_one {\n    # local($b) = @_; # Uncomment NOT to\
    \ nail b.\n    ($b) = @_;\n    $b = 6;\n    # $_[0] = 99;      # Uncomment to\
    \ nail a.\n}\n```\n\n- To create 'super' local variables in a subroutine, use\
    \ the `my` operator.\n```perl\nmy($VARS);\nmy($VARS) = (LIST);\n```\n\n## Notes\n\
    \nExample 1. Does not refer to @a, only to elements of @a:\n\n```perl\n#!/usr/bin/perl\n\
    # Modifying all array elements in a subroutine\n@a = (1,2,3);\n&s1(@a);\nprint\
    \ \"main a: @a\\n\";\n\nsub s1 {\n    foreach elem (@_) {\n        $elem *= 2;\n\
    \    }\n}\n```\n\nExample 2. Refers to @a:\n\n```perl\n#!/usr/bin/perl\n@a = (1,2,3);\n\
    &s2(*a);    # NOTE *a, not @a\nprint \"main a: @a\\n\"\n\nsub s2 {\n    local(*arr)\
    \ = @_;\n    foreach elem (@arr) {\n        $elem *= 2;\n    }\n}\n```\n"
