    \ (as in \\n or \\t)\n  - Turn on/off upper or lower case (\\U, etc.)\n  - Backslash\
    \ can also \"quote\" the next character:\n\n```\nprint \"This is a double quote:\
    \ \"\\n\";\nprint \"This is a backslash: \\n\";\nprint \"The scalar is \\$see_me\\\
    n\";\n```\n\n- In a single-quoted string, no variable or backslash interpolation\
    \ occurs.\n\n```\nprint 'Single quotes leave $'var and \\n alone,\"\"\\n\";\n\
    print 'But, to see a backslash, double up:\\,\"\\n\";\nprint 'And to see a single\
    \ quote, backslash it:\\'\\n';\n```\n\n# Notes\n\nA complex example of using command\
    \ substitution is to run a ps command and then look at the result to check to\
    \ check on certain processes (maybe to check if they're still running).\n\n```\n\
    for (;;) {\n    @processes = `ps -ef`;\n    if (grep(/\\bootpd\\,@processes))\
    \ {\n        print \"It's still going!\\n\";\n    }\n    else {\n        print\
    \ \" bootpd no longer running!\\n\";\n        last;\n    }\n    sleep(10);\n}\n\
    ```\n\nBe aware that what Perl is doing here is starting the command as a child\
    \ process, and any options, arguments, etc. are sent to the utility.\n\nOn many\
