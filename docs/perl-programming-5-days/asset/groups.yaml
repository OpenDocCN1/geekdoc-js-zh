  mdcn: "\n\n## 实验\n\n1. 以下者之间的区别是什么：\n\n   - a. system (\"ls\")\n   - b. exec (\"\
    ls\")\n   - c. `ls`\n\n(答案: diffs)\n\n2. 编写程序验证子进程在 `fork` 之后的代码中可以通过名称访问父进程数据的副本，但在使用\
    \ `exec` 加载的程序代码中不能这样做。为什么会这样？（答案: fnames, enames）\n\n3. 在父子进程之间创建一个管道。父进程将循环，反复提示用户输入要运行的命令，通过管道将命令发送给子进程，子进程通过\
    \ `fork` 和 `exec` 该命令。验证在第一个命令完成之前，子进程可以执行第二个命令。（答案: pcloop）\n\n## 第 18 章 - Perl\
    \ 中的套接字编程\n\n### 章节目标\n\n- 使用 Berkeley Sockets API 的函数调用。\n- 在网络上进行进程间的通信。\n\n\
    ## 客户端与服务器\n\n- TCP/IP 提供点对点通信，但没有规定对端应用程序何时以及为何交互。\n- 客户端/服务器计算的根本依据是会合（rendezvous）问题。\n\
    - 因为 TCP/IP 没有提供任何在消息到达时自动启动程序的机制，因此程序必须在请求到达之前等待接受请求。\n- 定义：\n  - *客户端*（client）是为了追求服务（或服务）而发起点对点通信的应用。\n\
    \  - *服务器*（server）是等待客户端服务请求并对其处理的程序。服务器负责：\n    - 身份验证\n    - 授权\n    - 数据安全\n\
    \    - 隐私\n    - 保护\n    - （当然，还提供请求的服务！）\n\n## 笔记\n\n本地地址（local-address）和远程地址（remote-address）指定了本地和远程主机的网络\
    \ ID 和主机 ID，格式取决于协议套件的定义。本地进程和远程进程用于标识每个系统中参与连接的特定进程，格式同样取决于协议套件的定义。\n\n对于端点（endpoint）中的进程字段，逻辑选择似乎应该是进程\
    \ ID (PID)，但事实证明这在两个原因上是不恰当的：\n\n1. 客户端程序无法与同一个服务器程序建立多个连接。通过为每个连接使用不同的端口号，客户端可以实现这一点。\n\
    2. 客户端不知道远程机器上进程的 PID，因此它们无法连接到所需的服务器。已知端口号（well-known port numbers）的机制解决了这个问题。\n\
    \n已知端口列表（在 UNIX 系统上）保留在 `/etc/services` 文件中。服务器计算机*和*客户端计算机必须拥有具有相同端口号的 `/etc/services`\
    \ 文件。要访问服务的应用程序将填充所需服务的半关联（half-association），并作为连接机制的一部分，客户端侧 IP 地址（假设使用 TCP/IP）以及临时（ephemeral）端口将填充关联的其余部分，从而为通信链路建立一个唯一标识符。\n\
    \n## 端口与服务\n\n- 什么是关联（association）？\n\n为了通信，两个进程必须建立关联，这是一个五元组（5-tuple），完整标识组成连接的两个进程（一台计算机上的客户端和另一台计算机上的服务器）：\n\
    \n```\n{协议,\n本地地址, 本地进程,\n远程地址, 远程进程}\n```\n\n- 什么是端点（endpoint）？\n\n端点或套接字（socket，也称为“半关联”）指定连接的一半定义为：\n\
    \n```\n{协议, 地址, 进程}\n```\n\n- 什么是端口（port）？\n\n端口是一个整数，用于标识计算机上的特定进程；它是上述的进程成员。\n\
    \n**已知端口**（well-known port）由服务器程序使用，是机器所提供的服务的标识符。\n\n**临时端口**（ephemeral port）由客户端使用；临时端口由客户端程序从操作系统分配，并在客户端/服务器事务完成后返回给操作系统以供重用。\n\
    \n- 正如我们后面看到的，服务器有时也会使用临时端口。\n\n## Berkeley Sockets 伯克利套接字\n\n- TCP/IP 标准没有规定\
    \ API 的细节，仅概述了所需的行为；因此 TCP/IP API 的规范是松散的。\n- 通用的只有两种 TCP/IP API：*伯克利套接字*（Berkeley\
    \ Sockets）API 和 AT&T *TLI* API。\n  - 在实践中，Sockets API 占据主导地位。\n- 对于 UNIX 文件，有五个基本的\
    \ Perl 运算符用于输入输出：`open()`、`close()`、`read()`、`print()` 和 `seek()`。\n- 套接字库的设计者扩展了传统的\
    \ UNIX I/O 设施：\n  - 首先，他们扩展了文件描述符集合，使应用程序能够创建用于网络通信的描述符。（你相信“套接字描述符”吗？）\n  - 第二，他们扩展了\
    \ `read()` 和 `print()` 系统调用以与网络描述符配合工作。\n- 然而，必须添加新的系统调用以适应网络通信的特殊情况，这些情况无法完美地属于标准的\
    \ UNIX `open-read-write-close` 范式。\n\n## 笔记\n\n对面上的 C 结构映射到 Perl 的需求，是一个包含相同数据的压缩结构（packed\
    \ structure）—— Perl 将如下创建 `sockaddr_in` 结构：\n\n```\n$sockadd_in = pack('S n a',\
    \ $AF_INET, $port, $IP);\n```\n\n## 数据结构\n\n## 套接字 API的数据结构\n\n套接字的基本数据结构包含：\n\
    \n- 地址族（Address Family）\n- 套接字类型（Socket Type）\n- 本地 IP 地址\n- 远程 IP 地址\n- 本地端口\n\
    - 远程端口\n\n套接字工具使用的通用地址结构是 `sockaddr` 结构，所示（使用 BSD 表示法）：\n\n```c\nstruct sockaddr\
    \ {\n    unsigned short sa_family;\n    char sa_data[14];\n};\n```\n\n特定地址族的地址结构是\
    \ `sockaddr_in`，所示：\n\n```c\nstruct sockaddr_in {\n    unsigned short sin_family;\
    \ /* 地址类型 */\n    unsigned short sin_port;   /* 端口号 */\n    unsigned long sin_addr;\
    \    /* IP 地址 */\n    char sin_zero[8];          /* 未使用 */\n};\n```\n\n注意 `sockaddr_in`\
    \ 结构完整定义了一个端点。\n\n`use Module;` 使 Perl 在运行时导入特定的模块。\n\n`use Socket;` 告诉 Perl 加载\
    \ Socket 模块（Socket.pm），包含了套接字编程的程序和常量。\n\n`use Socket;`\n\n```\nsocket(domain,\
    \ type, protocol)\n```\n\n`domain` 参数指定通信发生的域。许多定义的常量包括：\n\n- AF_UNIX (UNIX 内部协议)\n\
    - AF_INET (ARPA 互联网协议)\n- AF_ISO (ISO 协议)\n\n套接字具有指定的类型，该类型指定了通信的语义。Socket 中定义的类型包括：\n\
    \n- SOCK_STREAM (tcp 协议)\n- SOCK_DGRAM (udp) 协议)\n- SOCK_RAW (内部网络协议和接口)\n\n使用的协议号取决于通信所在的“通信域”。\n\
    \n## 套接字系统调用\n\n- socket() - 创建通信端点。\n- bind() - 为套接字指定本地端点地址。\n- connect() -\
    \ 与远程服务器建立活动连接。\n- listen() - 将套接字置于被动模式以接受连接。\n- accept() - 提取下一个传入的连接请求。\n-\
    \ 数据的发送或接收取决于所编写的程序类型。\n  - 连接型：\n    - read(), print(), <>, printf()\n  - 无连接型：\n\
    \    - send(), recv()\n- 关于 `socket()` 调用的信息见对面。\n- 请参考《驼书》的 Perl 函数章节或在线 Perl\
    \ 文档获取这些描述。\n\n笔记\n\n无连接传输的典型场景所示。首先启动服务器，稍后客户端发送一个数据报文给服务器。\n\n## 无连接场景\n\n![Connectionless\
    \ scenario](img/7fc661985e26f441bbcce9ca3c796ad2_253_0.png)\n\n"
