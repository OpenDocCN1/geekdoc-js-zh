    ...


    l 10       # Show line 10


    l 3-6       # Show lines 3-6


    l 3+6       # Show lines 3-9


    w 10       # Show the lines around 10


    l subber    # Display subber

    ```'
  - '[PAGE 277]


    # Notes


    Hitting the <Enter> key will execute the previous s or n command, whichever was
    given most recently. You must give an s or n command before the <Enter> will do
    anything.


    Recall that any time the debugger pauses and displays the next line to be executed,
    you can give any command or non-command that you like. A very useful command used
    in single-stepping is the p command, which will print the values of variables,
    including arrays.


    ```

    DB<1>p $x

    DB<2>p @x

    DB<3>p "@x"      # Separators

    DB<4>print "@x" # Non-command

    ```'
  - '[PAGE 278]


    # Single Stepping


    +   - To get things rolling, you can either give the ''s'' or ''n'' single-step
    commands.


    +   - Both s and n cause a single statement to be executed, pausing and displaying
    the next statement before executing it.


    +   - The s command will enter subroutines and single step through them.


    +   - The n command will execute a call to a subroutine and will execute the entire
    subroutine without single-stepping through the subroutine lines; it will pause
    in the calling routine at the line after the line that called the subroutine.


    +   - The r command will execute the remainder of the statements in the current
    subroutine, then pause at the next line in the caller after the line that called
    the subroutine.


    +     If r is given in the main context, it will act like c.


    +   - The c command continues the program in full run mode (no single-stepping
    or pausing unless a breakpoint is encountered).'
  - '[PAGE 279]


    # 278 Perl Programming


    # Notes


    Breakpoint commands


    +   - b [line] [condition]


    Set a breakpoint. If line is omitted, sets a breakpoint on the line that is about
    to be executed. If a condition is specified, it is evaluated each time the statement
    is reached and a breakpoint is taken only if the condition is true. Breakpoints
    may only be set on lines that begin an executable statement.


    +   - b subname [condition]


    Set breakpoint at first executable line of subroutine.


    +   - c [line]


    Continue. Executes until the next breakpoint is reached; optionally inserts a
    one-time-only breakpoint at the specified line.


    +   - d [line]


    Delete breakpoint. If line is omitted, deletes the breakpoint on the line that
    is about to be executed.


    +   - D


    Delete all breakpoints.'
  - '[PAGE 280]


    # Setting and Clearing Breakpoints


    +   - The b command sets a breakpoint as specified on the facing page.


    +   - Continue (c) and return (r) commands will execute statements until they
    hit a breakpoint. You can then:


    +   - Examine variables


    +   - Begin single-stepping


    +   - Continue to the next breakpoint


    +   - Give any command or non-command


    +   - An optional [condition] is specified as it would appear inside the parentheses
    of a Perl if statement.


    +   - Example


    ```

    main::(ddemo:4): $x=0;

    DB<1> b 9

    DB<2> b 8 $x == 0

    DB<3> c

    continuing...

    subheader line 1

    leaving subber, $newvar = 99

    main::(ddemo:8): print $ret,"\n"

    DB<3>

    ```'
  - '[PAGE 281]


    <!-- no content -->'
  - "[PAGE 282]\n\n# Modifying the Debugger\n\n+   - If you wish to modify the behavior\
    \ of the debugger, you can:\n\n+   - Copy the source code to your directory\n\
    \  $ cp /usr/local/lib/perl5/perl5db.pl .\n\n+   - Modify it (learn it first)\n\
    \n+   - Run your program as follows:\n  $ perl -d -I. ddemo\n\n+   - The '-I.'\
    \ above means to add the current directory to the front of the search path for\
    \ included files.\n\n+   - The -d option tells Perl to include (require) perl5db.pl."
  - '[PAGE 283]


    # 282 Perl Programming


    # Notes


    The following is the list of bitmask values Perl5 recognizes for the -D flag.


    +   - 1 p Tokenizing and Parsing

    - 2 s Stack Snapshots

    - 4 l Label Stack Processing

    - 8 t Trace Execution

    - 16 o Operator Node Construction

    - 32 c String/Numeric Conversions

    - 64 P Print Preprocessor Command for -P

    - 128 m Memory Allocation

    - 256 f Format Processing

    - 512 r Regular Expression Parsing

    - 1024 x Syntax Tree Dump

    - 2048 u Tainting Checks

    - 4096 L Memory Leaks (not supported anonymous)

    - 8192 H Hash Dump --- usvalues())

    - 16384 X Scratchpad Allocation

    - 32768 D Cleaning Up


    The letters are also understood by -D and can be invoked in place of the bitmasks.
    For example, to run a script and see memory allocation as it occurs, run


    ```

    perl -D128 ddemo.pl

    ```


    To also see string to numeric conversions, you would use 128 + 32 or


    ```

    perl -D160 ddemo.pl

    ```


    You can also use the letters, as in


    ```

    perl -Dcm ddemo.pl

    ```


    The -D flag can also be set in your script at the interpreter line:


    ```

    #!/usr/bin/perl -D160

    ```


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_283_0.png)'
  - '[PAGE 284]


    # The -w and -D Flags


    +   - Perl can be invoked with many options (flags) set from the command line.


    +   - The -w flag makes Perl print out warnings (non fatal errors) as it runs
    a program.


    +     - These are often very helpful in figuring out better ways to build a program.


    +     - The Perl authors highly recommend (just about demand) that you use -w
    whenever possible.


    +   - The -D flag allows you to see at run time many facets of what Perl is doing
    internally.


    +     - -D takes its argument a bitmask (in decimal) which tells it what to print
    out.


    +     - The perl executable must have been built with the DEBUGGING option.


    +   - For more information on these and other flags, see the Switches section
    of the Social Engineering chapter in the Camel book.'
  - '[PAGE 285]


    # Lab


    +   1. Practice using the debugger with programs provided. Set and clear breakpoints,
    single step through and over subroutines, change variables that affect the flow
    of execution, display variables, etc.

    2. Modify the debugger to display a * after the line number of the current line
    when forms of the ''l'' or ''w'' commands are given. debugger to display a * after
    the line number of the current line when forms of the ''l'' or ''w'' commands
    are given.'
  - '[PAGE 286]


    # Appendix 3 - Miscellaneous Topics'
  - '[PAGE 287]


    # Notes


    A simple Hello World! widget script could be written as follows:


    ```

    #!/usr/bin/perl -w


    use strict;

    use Tk;

    my $main = new MainWindow;

    $main->Label(text => ''Hello World!'')

    ->pack;

    $main->Button(text => ''Quit'',

    -command => sub(exit))

    )->pack;


    MainLoop;

    ```


    The MainLoop; statement is the main widget event handler loop and is usually found
    in perl/Tk scripts (usually near the end of the main procedure after the widgets
    have been declared and packed). MainLoop; is actually a function call and you
    may see it written as


    MainLoop();, &Tk::MainLoop; &Tk::MainLoop();, etc.


    Most parameters in calls to perl/Tk routines are passed by reference.


    The following Tk widget primitives are available under perl/Tk:


    | Button | Menubutton |

    | Canvas | Message |

    | Checkbutton | Radiobutton |

    | Entry | Scale |

    | Frame | Scrollbar |

    | Label | Text |

    | Listbox | Toplevel |

    | Menu | |


    The following are Tix widget primitives available under perl/Tk:


    ```

    HList

    InputOnly

    ```


    A lot of other compound/composite/constructs are available.


    A good introduction to the primitives and how they may be used in conjunction
    with each other may be found in the demo scripts at: http://w4ls.cornell.edu/~pvhp/ptk/ptIMG.html


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_287_0.png)'
  - "[PAGE 288]\n\n# perl.tk\n\n+   * The Tk Toolkit is a set of compiled objects\
    \ which can be invoked from certain programming environments to produce Motif-like\
    \ Graphical User Interface applications\n\n+   * perl/tk (often called ptk) uses\
    \ Perl5’s OOP functionality to implement the graphical objects which create the\
    \ buttons, windows, etc on the screen.\n\n+   * To install perl/tk on your system,\
    \ you must have three things:\n  * A compiled Perl5 on the system.\n  * A (compiled)\
    \ copy of the Tk library.\n  * A linkable Xlib library for X-windows.\n\n+   *\
    \ Once the Tk module is available for Perl to use, you simply instantiate the\
    \ desired graphical objects from inside your Perl code as you would with any other\
    \ Perl objects."
- md: "\n## Notes\n\nDBperl is available for (at least) the following:\n\n- oraperl/\
    \ ORACLE 6 & 7 By Kevin Stock, kstock@auspex.com\n- sybperl/ SYBASE 4 By Michael\
    \ Peppler, mpeppler@itf.ch\n- ingperl/ INGRES By Tim Bunce timbo@ig.co.uk and\
    \ Ted Lemon\n- isqlperl/ INFORMIX By William Hails, bill@tardis.co.uk\n- interperl/\
    \ INTERBASE By Buzz Moschetti, buzz@bear.com\n- uniperl/ UNIFY 5.0 By Rick Wargo,\
    \ rickers@coe.drexel.edu\n- ppaperl/ POSTGRES By Igor Metz, metz@iam.unibe.ch\n\
    - btreeperl/ NDBM perl extensions. By John Conover, john@johncon.com\n- ctreeperl/\
    \ C-Tree perl extensions. By John Conover, john@johncon.com\n- duaperl/ X.500\
    \ Directory User Agent. By Eric Douglas.\n\n## DB Perls\n\n- Since Perl is so\
    \ good at working with text data, it is a natural for database front-end applications.\n\
    - Basic Perl can be used to provide the interface and to manipulate and format\
    \ data for actual databases from other vendors.\n- To enhance this capability,\
    \ Perl was expanded to allow direct interfaces to popular databases from inside\
    \ Perl itself.\n- To use a DB Perl, you must have the following:\n  - □ A built\
    \ copy (or the modules) for the DB Perl.\n  - □ A working version of the Database.\n\
    \  - □ A knowledge of the specific Database and how to interface with it.\n\n\
    ## Notes\n\n```\n#!/usr/local/bin/oraperl\n# tabinfo\n# Usage:      tabinfo base\
    \ user password table\n# Displays the structure of the specified table.\n# Note\
    \ that the field names are restricted to the length of the field.\n# This is mainly\
    \ to show the use of &ora_lengths, &ora_titles and &ora_types.\n\n# set debugging,\
    \ if requested\n$ora_debug = shift if $ARGV[0] =~ -#;\n\n# read the compulsory\
    \ arguments\n((($base = shift) &&\n($user = shift) &&\n($pass = shift) &&\n($table\
    \ = shift)) || die \"Usage: $0 base user password table...\\n\";\n\n# we need\
    \ this for the table of datatypes\n# require 'oraperl.ph';\n\nformat STDOUT TOP\
    \ =\nStructure of @<<<<<<<<<<<<<<<<<<<\n$table\n\nField name ----------------\
    \ | Length | Type | Type description\n.\n\nformat STDOUT =\n@<<<<<<<<<<<<<<<<<<<<<<\
    \ | @>>> | @>>> | @<<<<<<<<<<<<<<<<n\nname[$i], $length[$i], $type[$i], $ora_types($type[$i])\n\
    \n$lda = &ora_login($base, $user, $pass) || die $ora_errstr . \"\\n\";\n```\n\n\
    Example continued on facing page\n\nAppendix 3 Miscellaneous Topics 291\n\n##\
    \ oraperl Example\n\n```\ndo\n{\n  $csr = &ora_open($lda, \"select * from \\$table\"\
    ) || die \"\\$ora_errstr\\n\";\n\n  (@name = &ora_titles($csr, 0)) || die \\$ora_errstr\
    \ . \"\\n\";\n  (@length = &ora_lengths($csr) || die \\$ora_errstr . \"\\n\";\n\
    \  (@type = &ora_types($csr)) || die \\$ora_errstr . \"\\n\";\n\n  foreach $i\
    \ (0 .. \\$name)\n{\n    write;\n  }\n\n  &ora_close($csr);\n  \\$- = 0;\n} while\
    \ ($table = shift);\n\n&ora_logoff($lda);\n```\n\n## Notes\n\n(taken from the\
    \ Perl5 man pages)\n\nThis is a trivial example which calls a subroutine, PrintUID,\
    \ to print out the UID of the process.\n\n```\nsub PrintUID\n{\n    print \"UID\
    \ is $\\$\\n\";\n}\n```\n\nand here is the C to call it\n\n```c\nvoid\ncall_PrintUID()\n\
    {\n    dSP;\n\n    PUSHMARK(sp);\n    perl_call_pv(\"PrintUID\", G_DISCARD|G_NOARGS);\n\
    }\n```\n\nSimple, eh. A few points to note about this example.\nWe aren't passing\
    \ any parameters to PrintUID so G_NOARGS can be specified.\nIgnore dSP and PUSHMARK(sp)\
    \ for now. We will be discussed in the next example.\nWe aren't interested in\
    \ anything returned from PrintUID, so G_DISCARD is specified. Even if\nPrintUID\
    \ was changed to actually return some value(s), having specified G_DISCARD would\n\
    mean that will be wiped by the time control returns from perlcallpv. Because we\
    \ specified\nG_DISCARD, it is not necessary to check the value returned from perlcallsv.\
    \ It will always\nbe 0.\nAs perlcallpv is being used, the Perl sub is specified\
    \ as a C string.\n\nNote: If you need to do this type of:\n\n1. Study the perl\
    \ man pages for perlcall(1) and perlapi(1).\n2. Very carefully work with the examples\
    \ there.\n3. Try to find someone to help you who has done this sort of thing before.\n\
    \n## Running Perl from Inside a C/C++ Program\n\n- Perl can be called from C or\
    \ C++.\n- This provides access to Perl's strengths over C/C++, and allows compiled\
    \ applications to have sections written in Perl so that the users can modify them.\n\
    - Perl does this with a series of C functions which allow you to call Perl subroutines:\n\
    \n```c\nI32 perl_call_sv(SV* sv, I32 flags);\nI32 perl_call_pv(char *subname,\
    \ I32 flags);\nI32 perl_call_method(char *methname, I32 flags);\nI32 perl_call_argv(char\
    \ *subname, I32 flags, register char **argv);\n```\n\n- The flags parameter in\
    \ all the perl_call* functions consists of any combination of the symbols defined\
    \ below, OR'ed together.\n\nG_SCALAR: Calls the Perl sub in a scalar context.\
    \ G_SCALAR is the default flag setting for all the functions.\nG_ARRAY: Calls\
    \ the Perl sub in a list context.\nG_DISCARD: If you are not interested in the\
    \ values returned by the Perl sub then setting this flag will make Perl get rid\
    \ of them automatically for you.\nG_NOARGS: If you do not set this flag then you\
    \ may need to set this flag.\nG_EVAL: If the Perl sub has ability to terminate\
    \ abnormally, by this flag.\n\n## Notes\n\nWhen Perl sees a Perl script with its\
    \ setuid or setgid bits set, it will (assuming the taintperl program is on your\
    \ system) run the script under taintperl (suidperl on some systems). This special\
    \ version of Perl marks all command line arguments, environments, and any input\
    \ data streams as \"tainted\". These \"tainted\" variables may not then be used,\
    \ directly or indirectly, in any command which invokes a shell, modifies a file,\
    \ directory or process, or with an eval perl call. Variables associated with tainted\
    \ variables are also considered tainted. If you try to do something you shouldn't\
    \ with a setuid bit Perl script, you will get a run time error.\n\n## Calling\
    \ C/++ Objects from Perl\n\n- There is a way to call C objects from Perl using\
    \ XS.\n- This allows you to use compiled functions within Perl.\n- The XS interface\
    \ is combined with necessary Perl.\n- These XS libraries are dynamically linked\
    \ to Perl.\n- A simple example of rpc() follows:\n\n```c\n#include \"EXTERN.h\"\
    \n#include \"perl.h\"\n#include \"XSUB.h\"\n#include <rpc.h>\n\nMODULE = RPC\n\
    PACKAGE = RPC\n\nbool_t rpcgettime(char *host, time_t *timep)\nOUTPUT: timep\n\
    ```\n\n- You would call it from Perl as follows. The $status and $timep variables\
    \ will contain the output of the function.\n\n```perl\nuse RPC;\n$status = rpcgettime(\"\
    localhost\", $timep);\n```\n\n## Notes\n\nLook `dump()` in the text for a further\
    \ discussion.\n\n## \"Compiling\" Perl - dump() and undump\n\n- There is no true\
    \ compiler for Perl.\n- One has been under development for some time; as of early\
    \ 1998 (Perl5.04), it was in alpha-3 release.\n- The dump() function can be used\
    \ to produce a file which holds the binary image of a running Perl program.\n\
    - dump() actually causes an immediate core dump of the Perl process.\n- The core\
    \ file can then be executed by the undump program (assuming one exists for your\
    \ platform.).\n- This can, if handled properly, work like a compiled program,\
    \ however, be aware that it is not as fast as true C, and there can be significant\
    \ side-effects.\n\n## Notes\n\nRemember if someone tries hard enough and has enough\
    \ knowledge of the language and system, there is almost always some way for them\
    \ to get through the security. Use things like setuid programs only where you\
    \ really need them, and, if security is a real issue, only distribute compiled\
    \ versions of them widely (yes, that does mean writing them in C or C++, but who\
    \ ever said security was easy...).\n"
  mdcn: "\n\n## Notes\n\nDBperl 支持（至少）以下环境：\n\n- oraperl/ ORACLE 6 & 7，作者：Kevin Stock,\
    \ kstock@auspex.com\n- sybperl/ SYBASE 4，作者：Michael Peppler, mpeppler@itf.ch\n\
    - ingperl/ INGRES，作者：Tim Bunce timbo@ig.co.uk 和 Ted Lemon\n- isqlperl/ INFORMIX，作者：William\
    \ Hails, bill@tardis.co.uk\n- interperl/ INTERBASE，作者：Buzz Moschetti, buzz@bear.com\n\
    - uniperl/ UNIFY 5.0，作者：Rick Wargo, rickers@coe.drexel.edu\n- ppaperl/ POSTGRES，作者：Igor\
    \ Metz, metz@iam.unibe.ch\n- btreeperl/ NDBM perl 扩展。作者：John Conover, john@johncon.com\n\
    - ctreeperl/ C-Tree perl 扩展。作者：John Conover, john@johncon.com\n- duaperl/ X.500\
    \ 目录用户代理。作者：Eric Douglas。\n\n## DB Perls\n\n- 由于 Perl 非常擅长处理文本数据，因此它是数据库前端应用的自然选择。\n\
    - 基础 Perl 可提供接口，并对其他供应商的实际数据库进行操作和格式化。\n- 为了增强这种能力，Perl 进行了扩展，允许在 Perl 内部直接与流行的数据库交互。\n\
    - 要使用 DB Perl，你必须具备以下条件：\n  - □ DB Perl 的已构建副本（或模块）。\n  - □ 正在运行的数据库版本。\n  - □\
    \ 相应特定数据库以及如何与其交互的知识。\n\n## Notes\n\n```\n#!/usr/local/bin/oraperl\n# tabinfo\n\
    # 用法:      tabinfo base user password table\n# 显示指定表的结构。\n# 注意字段名限制在字段长度内。\n#\
    \ 这主要是为了展示 &ora_lengths, &ora_titles 和 &ora_types 的用法。\n\n# 如果需要，设置调试模式\n$ora_debug\
    \ = shift if $ARGV[0] =~ -#;\n\n# 读取强制参数\n((($base = shift) &&\n($user = shift)\
    \ &&\n($pass = shift) &&\n($table = shift)) || die \"Usage: $0 base user password\
    \ table...\\n\";\n\n# 我们需要这个数据类型表\n# require 'oraperl.ph';\n\nformat STDOUT TOP\
    \ =\n@<<<<<<<<<<<<<<<<<<<<<<<\n$table 的结构\n\n字段名 ---------------- | 长度 | 类型 |\
    \ 类型描述\n.\n\nformat STDOUT =\n@<<<<<<<<<<<<<<<<<<<<<< | @>>> | @>>> | @<<<<<<<<<<<<<<<<n\n\
    name[$i], $length[$i], $type[$i], $ora_types($type[$i])\n\n$lda = &ora_login($base,\
    \ $user, $pass) || die $ora_errstr . \"\\n\";\n```\n\n示例继续见下一页\n\n附录 3 杂题 291\n\
    \n## oraperl 示例\n\n```\ndo\n{\n  $csr = &ora_open($lda, \"select * from \\$table\"\
    ) || die \"\\$ora_errstr\\n\";\n\n  (@name = &ora_titles($csr, 0)) || die \\$ora_errstr\
    \ . \"\\n\";\n  (@length = &ora_lengths($csr) || die \\$ora_errstr . \"\\n\";\n\
    \  (@type = &ora_types($csr)) || die \\$ora_errstr . \"\\n\";\n\n  foreach $i\
    \ (0 .. \\$name)\n{\n    write;\n  }\n\n  &ora_close($csr);\n  \\$- = 0;\n} while\
    \ ($table = shift);\n\n&ora_logoff($lda);\n```\n\n## Notes\n\n(摘自 Perl5 手页)\n\n\
    这是一个简单的示例，它调用了一个子程序 `PrintUID` 来打印进程的 UID。\n\n```\nsub PrintUID\n{\n    print\
    \ \"UID is $\\$\\n\";\n}\n```\n\n这里是调用它的 C 语言代码\n\n```c\nvoid\ncall_PrintUID()\n\
    {\n    dSP;\n\n    PUSHMARK(sp);\n    perl_call_pv(\"PrintUID\", G_DISCARD|G_NOARGS);\n\
    }\n```\n\n很简单，对吧？关于这个示例有几点需要注意。\n我们没有向 PrintUID 传递任何参数，因此可以指定 G_NOARGS。\n暂时忽略\
    \ dSP 和 PUSHMARK(sp)。我们将在下一个示例中讨论它们。\n我们对 PrintUID 返回的任何内容感兴趣，因此指定了 G_DISCARD。即使\
    \ PrintUID 被更改为实际返回某些值，指定 G_DISCARD 也意味着在从 perlcallpv 返回时会被清除。因为我们指定了 G_DISCARD，所以没有必要检查\
    \ perlcallsv 的返回值。它将始终为 0。\n由于使用了 perlcallpv，Perl 子程序被指定为 C 字符串。\n\n注意：如果你需要执行此类操作：\n\
    \n1. 研究关于 perlcall(1) 和 perlapi(1) 的 perl 手页。\n2. 非常仔细地研究那里的示例。\n3. 尝试找一个以前做过这类事情的人来帮助你。\n\
    \n## 在 C/C++ 程序内部运行 Perl\n\n- 可以从 C 或 C++ 调用 Perl。\n- 这提供了利用 Perl 相比于 C/C++ 的优势，并允许编译后的应用程序包含用\
    \ Perl 编写的部分，以便用户可以修改它们。\n- Perl 通过一系列 C 函数实现这一点，这些函数允许你调用 Perl：\n\n```c\nI32\
    \ perl_call_sv(SV* sv, int flags);\nI32 perl_call(char *method, int flags, ...);\n\
    I32 perl_call_pv(char *method, int flags);\nI32 perl_call_s(char *method, int\
    \ flags, SV* args);\nI32 perl_call_array(char *method, int flags, SV* args);\n\
    I32 perl_call_list(char *method, int flags, SV* args);\nI32 perl_call_hash(char\
    \ *method, int flags, SV* args);\n```\n\n- flags 参数由以下符号组合：\n\nG_SCALAR: 在标量上下文中调用\
    \ Perl。G_SCALAR 是默认标志。\nG_ARRAY: 在列表上下文中调用 Perl。\nG_DISCARD: 如果你对 Perl 子程序的返回值不感兴趣，设置此标志后\
    \ Perl 会自动丢弃它们。G_NOARGS: 如果没有参数，则设置此标志。\nG_EVAL: 如果 Perl 子程序可能会异常终止，设置此标志。\n\n\
    ## Notes\n\n当 Perl 看到带有 setuid 或 setgid 位的 Perl 脚本时，参见正文中的 `dump()` 以了解进一步讨论。\n\
    \n"
