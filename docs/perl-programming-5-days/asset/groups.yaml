  - "[PAGE 53]\n\n# Notes\n\nThe each operator iterates (in apparently random order)\
    \ through all elements in the hash. Each new call to each returns a two-item list\
    \ consisting of the next key-value pair. After the last pair has been returned,\
    \ the next call to each returns an empty list; then each resets itself, and the\
    \ next each starts the iteration over the beginning. You can deliberately reset\
    \ each by using keys in scalar context.\n\nYou must not add new elements to a\
    \ hash while iterating through it with each, though you can use delete.\n\nPerl\
    \ uses hashes extensively internally to hold the information it needs to run itself.\
    \ Several of these internal structures are available to your program.\n\n%ENV\
    \ is a hash which is automatically loaded with the process's environment variables.\n\
    \n```\nprint $ENV{'TERM'}; # will print xterm, vt100, or whatever\n```\n\n%SIG\
    \ holds the names of signals as keys, and the procedures (usually subroutines)\
    \ to be triggered on receipt of each signal as values.\n\n```\n$SIG{'HUP'} = \\\
    sub_hup; # will call subroutine sub_hup when\n SIGHUP received\n```\n\n(Perl allows\
    \ you to send a signal to a process with its kill() function.)\n\nTo print the\
    \ entire environment of the script:\n\n```\nforeach $v (sort keys %ENV)\n{\n \
    \ print \"$v=$ENV{$v}\\n\";n}\n```\n\nAll entries in a hash can be deleted with\
    \ the reset() command:\n\n```\nreset (hash);\n```\n\nBe careful, because this\
    \ will wipe out all objects named hash, not just the hash!\n\nundef is safer if\
    \ it only deletes the specified variable;\n\n```\nundef (%hash);\n```\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_53_0.png)"
