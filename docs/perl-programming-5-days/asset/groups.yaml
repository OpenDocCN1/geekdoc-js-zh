    \ subroutine, the arguments are available in the array @_.\n```\n$sum = &addem(1,2,3);\n\
    print \"$sum\\n\";nprint &addem(1,2,3), \"\\n\";n```\n\n```\n```\nsub add {\n\
    \    ($first, $second, $third) = @;\n    return $first + $second + $third;\n}\n\
    ```\n```\n\n+   The array @_ is local, but its values are modifiable references\
