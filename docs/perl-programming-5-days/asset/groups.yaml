- md: "\n## Variable-Length (Delimited) Fields\n\n- Many applications operate on data\
    \ records that contain variable-length delimited fields.\n- Examples\n  - Our\
    \ cars file: white space delimited\n  - /etc/passwd: colon delimited\n- The length\
    \ of any given field can vary from record to record.\n- The join and split functions\
    \ handle data of this type.\n- join() joins together the elements of a list into\
    \ a string, putting a specified delimiter string between each element in the joined\
    \ string.\n- split() breaks a string into a list of elements; the string must\
    \ contain a delimiter between each desired list element.\n\n## Variable vs. Fixed\n\
    \n### Advantages of variable-length data\n- No need to worry about fields overflowing\n\
    - Flexible format can be easier for users and programmers\n\n### Disadvantages\
    \ of variable-length data\n- Delimiters take storage and must be scanned for\n\
    - Binary data could be mistaken for a delimiter\n- Direct (random) access is not\
    \ possible\n\n### Advantages of fixed-length data\n- No time or storage wasted\
    \ on delimiters\n- Records can be located by calculation and seeking\n- Binary\
    \ data presents no problem\n\n### Disadvantages of fixed-length data\n- Maximum\
    \ size of fields must be allocated, so pad bytes waste space\n- More meticulous\
    \ code required to process fixed fields\n\n## Handling Binary Data\n\n- `join()`\
    \ and `split()` have analogous fixed-length data functions called `pack()` and\
    \ `unpack()`.\n\n- `unpack()` creates a list from a scalar, as does `split()`.\
    \ The elements to be extracted out of the scalar are in known fixed positions\
    \ in the scalar.\n\n- `pack()` creates a scalar from a list, where the elements\
    \ of the list are packed into the scalar in fixed positions.\n\n- `pack()` and\
    \ `unpack()` primary features are:\n  - Fixed-position, fixed-length strings are\
    \ created (packed) or broken out (unpacked).\n  - ASCII-to-binary (pack) and binary-to-ASCII\
    \ (unpack) conversions can take place.\n\n- Example uses for `pack()` and `unpack()`:\n\
    \  - Creating records that are formatted as fixed-length fields.\n  - Extracting\
    \ fields from records that are formatted as fixed-length fields.\n  - Writing\
    \ and reading binary data files (ON SAME MACHINE!).\n  - Sending/receiving binary\
    \ structures to/from Perl function calls, such as `socket()`.\n\n## Notes\n\n\
    Synopsis of the pack() function:\n\n```\npack(TEMPLATE, LIST)\n```\n\npack() takes\
    \ the array or list passed as LIST and packs its values into a binary structure\
    \ which is returned in a scalar. TEMPLATE is a sequence of characters that specifies\
    \ the order and type of values to be packed into the structure. The characters\
    \ allowable for use in TEMPLATE are:\n\n- A An ascii string, will be space padded.\n\
    - a An ascii string, will be null padded.\n- c A signed char value.\n- C An unsigned\
    \ char value.\n- s A signed short value.\n- S An unsigned short value.\n- i A\
    \ signed integer value.\n- I An unsigned integer value.\n- l A signed long value.\n\
    - L An unsigned long value.\n- n A short in \"network\" order.\n- N A long in\
    \ \"network\" order.\n- f A single-precision float in the native format.\n- d\
    \ A double-precision float in the native format.\n- p A pointer to a string.\n\
    - P A pointer to a structure (fixed-length string)\n- v A short in \"VAX\" (little-endian)\
    \ order.\n- x A long in \"VAX\" (little-endian) order.\n- X A null byte.\n- @\
    \ Null fill to absolute position.\n- u A unencoded string.\n- b A bit string (ascending\
    \ bit order, like vec()).\n- B A bit string (descending bit order).\n- h A hex\
    \ string (low nibble first).\n- H A hex string (high nibble first).\n\nA letter\
    \ optionally be followed by a number which provides a repeat count for the letter.\
    \ The letter and repeat count together form a field specifier. Field specifier\
    \ may be separated by white space, which will be ignored.\n\nA count causes to\
    \ consume that many values from list, unless the letter is 'a' or 'A'. In those\
    \ cases, only one value (string) is taken from the list, but it is no space padded\
    \ up to the count if necessary. If the repeat count is '*', then the remaining\
    \ values in the list will be packed according to the letter type being repeated.\n\
    \n![](img/7fc661985e26f441bbcce9ca3c796ad2_215_0.png)\n\n## The pack() Function\n\
    \n```\n#!/bin/perl\n# File: pack (Pack Examples)\n\n# The associative array %persons\
    \ uses last names as\n# keys, and the values are first name (then space)\n# then\
    \ salary. Pack as salary, first name\n# in: long integer, and two character fields.\n\
    \n%persons = (\n  'smith', 'slim 5000',\n  'jones', 'joe 2000',\n  'curtis', 'curt\
    \ 4900',\n  'morgan', 'mike 5100'\n);\n\nopen(SALARIES, '>') || die \"Can't open\
    \ salaries:$!\";\n\nwhile ($last, $value) = each %persons ) {\n  $record = pack('L\
    \ A5', $value, $last);\n  print $record;\n}\n```\n\n## The unpack() Function\n\
    \n- The unpack() function does the reverse of pack().\n- unpack() takes a string\
    \ that is packed with contiguous bytes, and unpacks the values into an array.\n\
    - It understands the same list of TEMPLATE used by pack().\n\n```perl\n#!/bin/perl\n\
    # File: unpack\n\n# Unpack the records in the 'salaries' file.\n\nopen(SALARIES,\
    \ '<') || die \"Can't open salaries:$!\";\n\nwhile ($record = each SALARIES) {\n\
    \    ($salary, $first) = unpack(\"L A5\", $record);\n    print \"$first $last\
    \ makes $salary\\n\";\n}\nclose(SALARIES);\n```\n\n## The read() Function\n\n\
    - The program on the previous page't work correctly because <> operator needs\
    \ to know what \"line\" is.\n- The read() function will read a specified number\
    \ of bytes from a file.\n\n```perl\n#!/bin/perl\n# File: read\n\n# Unpack the\
    \ records in the 'salaries' file.\n\nopen(SALARIES, '<') || die \"Can't open salaries:$!\"\
    ;\n\nwhile (read(SALARIES, $record, 14)) { # ONLY CHANGE\n  ($salary, $first)\
    \ = unpack(\"L A5\", $record);\n  print \"$first $last makes $salary\\n\";\n}\n\
    close(SALARIES);\n```\n\n## Notes\n\nThe basic data structure for a socket descriptor\
    \ contains the following information:\n\n- Address Family\n- Socket Type\n- Local\
    \ IP Address\n- Remote IP Address\n- Local Port\n- Remote Port\n\nThe generic\
    \ address structure used by the sockets toolkit is the sockaddr structure, shown\
    \ below (using 4.3BSD notation).\n\n```\nstruct sockaddr {\n    u_short sa_family;\n\
    \    char    sa_data[14];\n};\n```\n\nThe address structure for a specific protocol\
    \ family is based on the generic sockaddr. The AF_INET family implementation is\
    \ shown below.\n\n```\nstruct sockaddr_in {\n    u_short sin_family;    /* type\
    \ of address */\n    u_short sin_port;      /* port number */\n    u_long sin_addr;\
    \       /* ip address */\n    char   s_zero[8];      /* unused      */\n};\n```\n\
    \nNote that the sockaddr_in structure fully defines an endpoint, as discussed\
    \ previously.\n\n## C Data Structures\n\n- Another use for pack and unpack is\
    \ to translate to the C language.\n- The C structures on the facing page map onto\
    \ Perl's needs as a packed structure containing the same data.\n- Perl would create\
    \ a `sockaddr_in` structure as follows:\n\n```\n$sockaddr_in = pack('S n a4 x8',\
    \ $AF_INET, $port, $IP_Addr);\n```\n\n- This maps directly onto the C structure\
    \ needed by the sockets libraries.\n- This is used routinely when perl must make\
    \ a system call into the kernel (or some other UNIX process) which needs to see\
    \ native machine data types.\n- We will see this again in chapter 18.\n\n## Chapter\
    \ 17 - Multitasking with Perl\n\n## Chapter Objectives\n\n- Describe why to use\
    \ multitasking applications.\n- Use the fork() call to create new processes.\n\
    - Use exec() to start a different program.\n- Communicate between processes on\
    \ the same system with UNIX pipes.\n\n## Perl Programming\n\n## Notes\n\nIt is\
    \ true even in a multitasking operating system that only one program at a time\
    \ can actually execute CPU instructions. However most programs request operating\
    \ system services that would put the entire computer into a state in which it\
    \ waits for an outside event to to occur. In such states, the CPU becomes totally\
    \ idle and has nothing to do on behalf of the occur until the outside event occurs.\
    \ \"Outside events\" are called I/O events, which take place much more slowly\
    \ than CPU execution.\n\nA multitasking operating system enables a program to\
    \ run while others are waiting for I/O, thus getting more work done in the same\
    \ amount of time than a singletasking operating system.\n\nFrom a higher level\
    \ point of view, here are examples of the use of multitasking:\n\n1. Client/server\
    \ - a server waits for a client request, then creates another process to fulfill\
    \ the request while the server goes back to wait for another client request.\n\
    2. An application separates data collectors from the data processors (processing\
    \ could mean simply saving data or it could mean performing calculations, lookups,\
    \ translations, etc.)\n3. Existing programs can be reused (the UNIX \"Toolbox\
    \ Methodology\") by running them as concurrent subprograms. Example: interactively\
    \ display pages of data without reinventing the pager wheel.\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_223_0.png)\n"
  mdcn: "\n\n## 变长度（分隔符）字段\n\n- 许多应用程序运行在包含变长度分隔符字段的数据记录上。\n- 示例\n  - 我们的 cars 文件：空白字符分隔\n\
    \  - `/etc/passwd`：冒号分隔\n- 任何给定字段的长度都可以随记录而变化。\n- `join` 和 `split` 函数处理此类类型的数据。\n\
    - `join()` 将列表中的元素组合成字符串，在组合后的字符串的每个元素之间插入指定的隔符字符串。\n- `split()` 将字符串拆分为元素列表；字符串在每个所需的列表元素之间必须包含一个分隔符。\n\
    \n## 变长度与固定长度\n\n### 变长度数据的优点\n- 不需要担心字段溢出\n- 灵活的格式对用户和程序员来说可能更容易用\n\n### 变长度数据的缺点\n\
    - 分隔符占用存储空间且必须进行扫描\n- 二进制数据可能被误认为分隔符\n- 无法进行直接（随机）访问\n\n### 固定长度数据的优点\n- 不在分隔符上浪费时间或存储\n\
    - 可以通过计算和寻定位记录\n- 二进制数据没有问题\n\n### 固定长度数据的缺点\n- 必须分配最大大小的字段，因此填充字节会浪费空间\n- 处理固定字段需要更细致的代码\n\
    \n## 处理二进制数据\n\n- `join()` 和 `split()` 具有类似的固定长度数据函数，称为 `pack()` 和 `unpack()`。\n\
    \n- `unpack()` 从标量创建一个列表，`split()` 也是如此。从标量中提取的元素位于标量中已知的固定位置。\n\n- `pack()` 从列表创建一个标量，列表的元素按固定位置打包到标量中。\n\
    \n- `pack()` 和 `unpack()` 的主要功能是：\n  - 创建（打包）或拆分（解包）固定位置、固定长度的字符串。\n  - 可以进行 ASCII\
    \ 到二进制（pack）和二进制到 ASCII（unpack）的转换。\n\n- `pack()` 和 `unpack()` 的示例用例：\n  - 创建格式化为固定长度字段的记录。\n\
    \  - 从格式化为固定长度字段的记录中提取字段。\n  - 写入和读取二进制文件（在同一台机器上！）。\n  - 向/从 Perl 函数调用发送/接收二进制结构，例如\
    \ `socket()`。\n\n## 注意事项\n\n`pack()` 函数的摘要：\n\n```\npack(TEMPLATE, LIST)\n```\n\
    \n`pack()` 接收作为 `LIST` 的数组或列表，并将其值打包成二进制结构返回标量。`TEMPLATE` 是字符序列，指定要打包到结构中的值的顺序和类型。`TEMPLATE`\
    \ 中允许使用的字符：\n\n- A 一个 ASCII 字符串，将用空格填充。\n- a 一个 ASCII 字符串，将用空字节填充。\n- c 有符号 char\
    \ 值。\n- C 无符号 char 值。\n- s 有符号 short 值。\n- S 无符号 short 值。\n- i 有符号整数值。\n- I 无符号整数值。\n\
    - l 有符号长型（long）值。\n- L 无符号长型（long）值。\n- n “网络”顺序的短整数。\n- N “网络”顺序的长整数。\n- f 原生格式的单精度浮点数。\n\
    - d 原生格式的双精度浮点数。\n- p 指字符串的指针。\n- P 指结构的指针（固定长度字符串）。\n- v \"VAX\"（小端）顺序的 short\
    \ 值。\n- x \"VAX\"（小端）顺序的 long 值。\n- X 空字节。\n- @ 填充到绝对位置的空。\n- u 未编码的字符串。\n- b\
    \ 位字符串（升位位序，类似于 `vec()`）。\n- B 位字符串（降位位序）。\n- h 十六进制字符串（低位字节在前）。\n- H 十六进制字符串（高位字节在前）。\n\
    \n字母后面可以可选跟一个数字，提供该字母的重复计数。字母和重复计数共同组成一个字段说明符。字段说明符可以用空白符分隔，空白符将被忽略。\n\n计数会导致从列表中消耗相应数量的值，除非字母是\
    \ 'a' 或 'A'。在这些情况下，只从列表中取一个值（字符串），但如果必要，它不会按计数填充空格。如果重复计数为 `*`，则列表中的剩余值将根据所重复的字母类型进行打包。\n\
    \n![](img/7fc661985e26f441bbcce9ca3c796ad2_215_0.png)\n\n## pack() 函数\n\n```perl\n\
    #!/bin/perl\n# File: pack (Pack Examples)\n\n# 关联数组 %persons 使用姓氏作为\n# 键，值是名字（然后是空格）\n\
    # 然后是薪水。将薪水、名字打包\n# 进入：长整数和两个字符字段中。\n\n%persons = (\n  'smith', 'slim 5000',\n\
    \  'jones', 'joe 2000',\n  'curtis', 'curt 4900',\n  'morgan', 'mike 5100'\n);\n\
    \nopen(SALARIES, '>') || die \"Can't open salaries:$!\";\n\nwhile ($last, $value)\
    \ = each %persons ) {\n  $record = pack('L A5', $value, $last);\n  print $record;\n\
    }\n```\n\n## unpack() 函数\n\n- `unpack()` 函数执行 `pack()` 的反操作。\n- `unpack()` 接收一个用连续字节打包的字符串，并将值解包到数组中。\n\
    - 它理解与 `pack()` 使用相同的 `TEMPLATE` 列表。\n\n```perl\n#!/bin/perl\n# File: unpack\n\
    \n# 解包 'salaries' 文件中的记录。\n\nopen(SALARIES, '<') || die \"Can't open salaries:$!\"\
    ;\n\nwhile ($record = each SALARIES) {\n    ($salary, $first) = unpack(\"L A5\"\
    , $record);\n    print \"$first $last makes $salary\\n\";\n}\nclose(SALARIES);\n\
    ```\n\n## read() 函数\n\n- 上页的程序没有正常工作，因为 `<>` 运算符需要知道什么是“行”。\n- `read()` 函数将从文件中读取指定数量的字节。\n\
    \n```perl\n#!/bin/perl\n# File: read\n\n# 解包 'salaries' 文件中的记录。\n\nopen(SALARIES,\
    \ '<') || die \"Can't open salaries:$!\";\n\nwhile (read(SALARIES, $record, 14))\
    \ { # 仅修改此处\n  ($salary, $first) = unpack(\"L A5\", $record);\n  print \"$first\
    \ $last makes $salary\\n\";\n}\nclose(SALARIES);\n```\n\n## 注意事项\n\nsocket 描述符的基本数据结构包含以下信息：\n\
    \n- 地址族\n- Socket 类型\n- 本地 IP 地址\n- 远程 IP 地址\n- 本地端口\n- 远程端口\n\nsockets 工具包使用的通用地址结构是\
    \ `sockaddr` 结构，如下所示（使用 4.3BSD 符号）。\n\n```\nstruct sockaddr {\n    u_short sa_family;\n\
    \    char    sa_data[14];\n};\n```\n\n特定协议族的地址结构基于通用的 `sockaddr`。AF_INET 族的实现如下所示。\n\
    \n```\nstruct sockaddr_in {\n    u_short sin_family;    /* 地址类型 */\n    u_short\
    \ sin_port;      /* 端口号 */\n    u_long sin_addr;       /* IP 地址 */\n    char \
    \  s_zero[8];      /* 未使用 */\n};\n```\n\n注意，如前所述，`sockaddr_in` 结构完整定义了一个端。\n\n\
    ## C 数据结构\n\n- `pack` 和 `unpack` 的另一个用途是翻译成 C 语言。\n- 对应面的 C 结构映射到 Perl 的需求，包含相同数据的打包结构。\n\
    - Perl 将创建一个 `sockaddr_in` 结构，如下：\n\n```\n$sockaddr_in = pack('S n a4 x8', $AF_INET,\
    \ $port, $IP_Addr);\n```\n\n- 这直接映射到 sockets 库所需的结构。\n- 当 Perl 必须调用内核（或其他需要原生机器数据的\
    \ UNIX 进程）时会经常这样做。\n- 我们将在第 18 章再次看到。\n\n## 第 17 章 - 使用 Perl 进行多任务\n\n## 目标\n\n\
    - 描述为什么使用多任务应用程序。\n- 使用 `fork()` 调用创建新进程。\n- 使用 `exec()` 启动不同的程序。\n- 使用 Unix 管道进程间通信。\n\
    \n## Perl 编程\n\n## Notes\n\n即使在多任务操作系统，一次只有一个程序可以执行 CPU 指令，这也是真实的。但是，大多数程序请求的操作系统服务会让整个计算机进入等待外部事件发生的状态。在这些状态下，CPU\
    \ 将完全空闲，在外部事件发生之前无法代表做任何工作。“外部事件”被称为 I/O 事件，其发生速度比 CPU 执行慢得多。\n\n多任务操作系统允许程序在等待\
    \ I/O 时运行其他程序，从而在相同时间内完成比单任务操作系统更多的工作。\n\n从更高层次的角度来看，这里是多任务使用的示例：\n\n1. 客户端/服务器\
    \ - 服务器等待客户端请求，然后创建另一个进程来履行请求，同时服务器返回等待另一个客户端请求。\n2. 将数据收集器与数据处理器分离（处理可能仅意味着保存数据，也可能意味着计算、查找、翻译等）。\n\
    3. 通过作为并发子程序运行来重用现有程序（Unix “工具箱方法”）。例如：交互式地显示数据页而无需重新发明分页器。\n\n"
