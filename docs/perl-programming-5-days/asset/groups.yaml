  - "[PAGE 63]\n\n# Notes\n\nRemember that filehandles are a data type in Perl. You\
    \ can create them in the same way you create other variables: \n\nXYZ;\n\nYou\
    \ can even load them with data, but unless you know exactly what you are doing,\
    \ this will not accomplish anything useful. Filehandles are designed to be created\
    \ and manipulated using specific Perl functions like `open()` and `close()`.\n\
    \nThe names of filehandles follow the same naming rules as other data structures\
    \ in Perl: they are case sensitive, can be upper, lower or mixed case, and can\
    \ be (reasonably) long. A convention is to make filehandles all upper case, leaving\
    \ all user-created scalars, arrays, etc. lower case. Doing this improves readability.\
    \ Since filehandles don't have a special character associated with them, making\
    \ upper case makes them visually stand out.\n\nPerl predefines three filehandles,\
    \ `STDIN`, `STDOUT`, and `STDERR`.\n\n`print` and `printf` write to `STDOUT`,\
    \ unless you specify a different filehandle.\n\n`warn` and die write to `STDERR`.\n\
    \nThe input operator, `<`, reads from `STDIN`, unless you specify a different\
    \ filehandle."
  - '[PAGE 64]


    # The open Function


    +   Use open() to open a file and create/load the filehandle


    +   open(FH,"filex") opens the file filex on the (maybe

    new) filehandle FH.


    +   The default mode for open is read only; you can explicitly

    prepend the < character to the file name:


    ```

    open(FH,"<filex");

    ```


    +   If you want to open for write, you prepend the > to the file name:


    ```

    open(FH,">filex");

    ```


    Opening a file with > overwrites the file; to append, use >>:


    ```

    open(FH,">>filex");

    ```


    +   You can open for both read and write by putting a + in front of

    the >, < or >>.


    +   If you use the | character at the end of the quoted string, Perl

    executes the string as a Unix command; subsequent reads from

    the filehandle read from the Unix command''s output.


    ```

    open(FH,"find .-print|");

    $first_file = <FH>;

    ```


    +   A pipe character at the beginning of the quoted string will open a

    pipe to the command''s STDIN:


    ```

    open (FH,"|sort > file_sorted");

    ```'
