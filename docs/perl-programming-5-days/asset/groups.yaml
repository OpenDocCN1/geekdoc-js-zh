    $ARGV[$#ARGV] 是最后一个元素，因为 #ARGV 是最后一个元素的下标\n- 下面使用了 @ARGV 的构造。这些结构适用于任何数组。\n- 查看\
    \ Perl 的 shift 函数。\n- 问题：为什么 'while' 循环最终会停止？\n- 答案：while 语句 while (@ARGV) 在标量上下文中运行。@ARGV\
    \ 在标量上下文中返回数组的元素个数。shift 运算符每次减少该数字。\n- Perl 支持多维数组语法：\n\n```perl\n$ARRAY[3] =\
