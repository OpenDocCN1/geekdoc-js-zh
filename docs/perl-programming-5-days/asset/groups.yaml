  - '[PAGE 298]


    # "Compiling" Perl - dump() and undump


    +   - There is no true compiler for Perl.

    - One has been under development for some time; as of early 1998 (Perl5.004),
    it was in "alpha-3" release.

    - The dump() function can be used to produce a file which holds the binary image
    of a running Perl program.

    - dump() actually causes an immediate core dump of the Perl process.

    - The core file can then be executed by the undump program (assuming one exists
    for your host platform.).

    - This can, if handled properly, work like a compiled program, however, be aware
    that it is not as fast as true compiled C , and there can be significant side-effects.'
  - '[PAGE 299]


    # Notes


    When Perl sees a Perl script with it''s setuid or setgid bits set, it will (assuming
    the taintperl program is on your system) run the script under taintperl (suidperl
    on some systems). This special version of Perl marks all command line arguments,
    environments, and any input data streams as "tainted". These "tainted"Variables
    may not then be used, directly or indirectly, in any command which invokes a shell,
    modifies a file, directory or process, or with an eval perl call. Variables associated
    with tainted variables are also considered tainted. If you try to do something
    you shouldn''t with a setuid bit Perl script, you will get a run time error.


    Remember if someone tries hard enough and has enough knowledge of the language
    and system, there is almost always some way for them to get through the security.
    Use things like setuid programs only where you really need them, and, if security
    is a real issue, only distribute compiled versions of them widely (yes, that does
    mean writing them in C or C++, but who ever said security was easy...).'
- md: "\n## Perl and Other setuid() Things\n\n- The setuid() system call allows a\
    \ program (if its setuid bit is set) to assume the user-ID of another user as\
    \ it runs.\n\n- Many UNIX utilities do this routinely - they have to as part of\
    \ their function:\n  - passwd\n  - login\n  - mail, mailx, elm\n\n- Perl allows\
    \ you to create scripts which can also change their uid and gid at runtime.\n\n\
    - The actual id values are set with four special variables:\n  ```\n  $> effective\
    \ user id\n  $< real user id\n  $) effective group id\n  $( real group id\n  ```\n\
    \n- Perl programs which are allowed to change the real ids are potential security\
    \ problems, because a knowledgeable user could take an otherwise benign program\
    \ and turn it into a blatant security breach of giving them root access.\n\n-\
    \ taintperl, a special version of the Perl executable, prevents this.\n\n## Perl,\
