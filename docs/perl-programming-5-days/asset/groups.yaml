  - "[PAGE 293]\n\n# Notes\n\n(taken from the Perl5 man pages)\n\nThis is a trivial\
    \ example which calls a subroutine, PrintUID, to print out the UID of the process.\n\
    \n```\nsub PrintUID\n{\n    print \"UID is $\\n\";\n}\n```\n\nand here is the\
    \ C to call it\n\n```\nvoid\ncall_PrintUID())\n{\n    dSP;\n\n    PUSHMARK(sp);\n\
    \    perl_call_pv(\"PrintUID\", G_DISCARD|G_NOARGS);\n}\n```\n\nSimple, eh. A\
    \ few points to note about this example.\nWe aren't passing any parameters to\
    \ PrintUID so G_NOARGS can be specified.\nIgnore dSP and PUSHMARK(sp) for now.\
    \ We will be discussed in the next example.\nWe aren't interested in anything\
    \ returned from PrintUID, so G_DISCARD is specified. Even if\nPrintUID was changed\
    \ to actually return some value(s), having specified G_DISCARD would\nmean that\
    \ will be wiped by the time control returns from perlcallpv. Because we specified\n\
    G_DISCARD, it is not necessary to check the value returned from perlcallsv. It\
    \ will always\nbe 0.\nAs perlcallpv is being used, the Perl sub is specified as\
    \ a C string.\n\nNote: If you need to do this type of:\n\n+   1. Study the perl\
    \ man pages for perlcall(1) and perlapi(1).\n2. Very carefully work with the examples\
    \ there.\n3. Try to find someone to help you who has done this sort of thing before."
  - "[PAGE 294]\n\n# Running Perl from Inside a C/C++ Program\n\n+   - Perl can be\
    \ called from C or C++.\n  - This provides access to Perl's strengths over C/C++,\
    \ and allows compiled applications to have sections written in Perl so that the\
    \ users can modify them.\n- Perl does this with a series of C functions which\
    \ allow you to call Perl subroutines:\n\n```\nI32 perl_call_sv(SV* sv, I32 flags);\n\
    I32 perl_call_pv(char *subname, I32 flags);\nI32 perl_call_method(char *methname,\
    \ I32 flags);\nI32 perl_call_argv(char *subname, I32 flags, register char **argv);\n\
    ```\n\n+   - The flags parameter in all the perl_call* functions consists of any\
    \ combination of the symbols defined below, OR'ed together.\n\nG_SCALAR Calls\
    \ the Perl sub in a scalar context. G_SCALAR is the default flag setting for all\
    \ the functions.\n\nG_ARRAY Calls the Perl sub in a list context.\nG_DISCARD If\
    \ you are not interested in the values returned by the Perl sub then setting this\
    \ flag will make Perl get rid of them automatically for you.\nG_NOARGS If you\
    \ do not set this flag then you may need to explicitly get rid of temporary values.\n\
    G_EVAL If the Perl sub you are calling has the ability to terminate abnormally,\
    \ e.g. by calling die() or by not actually existing, you can catch this type of\
    \ event by specify by this flag setting."
  - '[PAGE 295]


    # Notes


    Using either the C-to-Perl or the Perl-to-C interface is not a task to be taken
    lightly. There is much to learn, and you need an intimate knowledge of Perl, C
    (or C++), XS, UNIX, your compiler, etc. to really be comfortable. But there are
    some tasks which can''t be accomplished any other way.


    Module developers use XS to include functionality that''s implemented in dynamically
    loadable C programs.'
  - '[PAGE 296]


    # Calling C/C++ Objects from a Perl Program


    +   - Perl allows you to call compiled objects from within a Perl script using
    a library extension language called XS.


    +   - The XS interface is combined with the desired C library to create a library
    which is callable by Perl.


    +   - The XS compiler, xsubpp, creates functions which know how to interface with
    the perl executable at run time.


    +   - These XS libraries are dynamically linked to Perl as necessary.


    +   - A simple example of an XUSUB follows; it demonstrates possible interface
    to the rpcbgettime() function.


    ```

    #include "EXTERN.h"

    #include "perl.h"

    #include "XSUB.h"

    #include <rpc/rpc.h>


    MODULE = RPC PACKAGE = RPC


    bool_t

    rpcbgettime(host,timep)

    char * host

    time_t &timep

    OUTPUT:

    timep

    ```


    +   - You would call it from Perl as follows. The $status and $timep variables
    will contain the output of the function.


    ```

    use RPC;

    $status = rpcbgettime("localhost", $timep);

    ```'
