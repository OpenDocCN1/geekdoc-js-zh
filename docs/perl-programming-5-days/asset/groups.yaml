    # Notes


    There are currently two different versions of Perl available and in use today:
    Perl4 and Perl5. This class concentrates on features which are common to both
    of them, but also covers many of the features available only in Perl5.


    Perl5 added, among other things:


    +   - Changes in syntax.

    - Eased usability and legibility by making many cryptic variable names more English-like.

    - Expanded and made more useful error and warning messages; see the -w flag

    - Expanded on many features like embeddibility in C and C++ and extensibility.

    - Regular Expression enhancements.

    - Reference variables and the ability to create complex, nested data structures.

    - All the necessary pieces to permit Object-Oriented programming in Perl.


    All this was done while making Perl5 mostly backwards-compatible with Perl4. The
    things which are not backwards compatible things which you weren''t supposed to
    do in Perl4 anyway, but Perl4 let you get away with them. Perl5 does not. We will
    see many examples of these differences and similarities throughout the course.'
