  - '[PAGE 62]


    # Filehandles


    +   - A filehandle is a name you associate with a file for the purposes of reading
    or writing to the file.


    +   - The open function creates a filehandle and associates it with a file.


    ```

    open(PWDFILE, "/etc/passwd");

    ```


    +   - The input operator < uses the filehandle to read from the file.


    ```

    $user = <PWDFILE>; # Read a line from /etc/passwd

    ```


    +   - There are several ways to write to a file through a filehandle.


    +   - open(PWDFILE, "/etc/passwd");


    does the following:


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_62_0.png)


    +   1. Finds /etc/passwd on the disk


    +   2. Opens it for read


    +   3. Assigns the filehandle PWDFILE to the connection


    +   4. You subsequently access the file through the filehandle by name.


    +   - close(PWDFILE) will flush the buffers and close the connection.'
- md: "\n# Notes\n\nRemember that filehandles are a data type in Perl. You can create\
    \ them in the same way you create other variables: \n\n```perl\nXYZ;\n```\n\n\
    You can even load them with data, but unless you know exactly what you are doing,\
    \ this will not accomplish anything useful. Filehandles are designed to be created\
    \ and manipulated using specific Perl functions like `open()` and `close()`.\n\
    \nThe names of filehandles follow the same naming rules as other data structures\
    \ in Perl: they are case sensitive, can be upper, lower or mixed case, and can\
    \ be (reasonably) long. A convention is to make filehandles all upper case, leaving\
    \ all user-created scalars, arrays, etc. lower case. Doing this improves readability.\
    \ Since filehandles don't have a special character associated with them, making\
    \ upper case makes them visually stand out.\n\nPerl predefines three filehandles,\
    \ `STDIN`, `STDOUT`, and `STDERR`.\n\n`print` and `printf` write to `STDOUT`,\
    \ unless you specify a different filehandle.\n\n`warn` and `die` write to `STDERR`.\n\
    \nThe input operator, `<`, reads from `STDIN`, unless you specify a different\
    \ filehandle.\n\n# The open Function\n\n- Use open() to open a file and create/load\
    \ the filehandle\n- open(FH,\"filex\") opens the file filex on the (maybe new)\
    \ filehandle FH.\n- The default mode for open is read only; you can explicitly\
    \ prepend the `<` character to the file name:\n\n```perl\nopen(FH,\"<filex\");\n\
    ```\n\n- If you want to open for write, you prepend the `>` to the file name:\n\
    \n```perl\nopen(FH,\">filex\");\n```\n\nOpening a file with > overwrites the file;\
    \ to append, use >>:\n\n```perl\nopen(FH,\">>filex\");\n```\n\n- You can open\
    \ for both read and write by putting a + in front of the >, < or >>.\n\n- If you\
    \ use the `|` character at the end of the quoted string, Perl executes the string\
    \ as a Unix command; subsequent reads from the filehandle read from the Unix command's\
    \ output.\n\n```perl\nopen(FH,\"find .-print|\");\n$first_file = <FH>;\n```\n\n\
    - A pipe character at the beginning of the quoted string will open a pipe to the\
    \ command's STDIN:\n\n```perl\nopen (FH,\"|sort > file_sorted\");\n```\n\n# Notes\n\
    \nOne way the second example might be changed would be to take fuller advantage\
    \ of the use of the special variable `$_`. Regular expression testing takes place\
    \ in the special variable `$_` by default, so there is no reason to be explicit\
    \ about it:\n\n```perl\nopen (INFILE, \"hot_data\") || die \"hot_data is ice cold\"\
    ;\nwhile (<INFILE>) {\n    if (/\\/) { # By default, $_ is searched for RE\n \
    \       next; # This will cause next iteration of while\n    } else {\n      \
    \  push @hot, $_;\n    }\n}\nprint @hot;\n```\n\nFor those who are familiar with\
    \ regular expressions, could test for lines that do not start with #, rather than\
    \ test for and ignore them:\n\n```perl\nopen (INFILE, \"hot_data\") || die \"\
    hot_data is ice cold\";\nnexti = 0;\nwhile (<INFILE>) {\n    if (!^#/) { # By\
    \ default, $_ is searched for RE\n        push @hot, $_;\n    }\n}\nprint @hot;\n\
    ```\n\nA note of warning: The use of the input operator as arrays makes it easy\
    \ and fast to work with data stored in line-oriented sense. Don't forget that\
    \ Perl will, in array context, read the entire file into the array. If your file\
    \ is very big (hundred-megabyte file), use a loop (probably while loop) to read\
    \ and work a line (or few lines) at a time.\n\n# The Input Operator\n\n- `<>`\
    \ is a context-sensitive operator, as we have seen:\n- In scalar context, `<FILEHANDLE>`\
    \ returns the next line from the file.\n- Each invocation of `<FILEHANDLE>` increments\
    \ the file pointer to the next line.\n- In list context, `<FILEHANDLE>` returns\
    \ the rest of the file, one element.\n\n```perl\nopen(INFILE, \"hot_data\") ||\
    \ die \"hot_data is ice cold\";\n$codeline = <INFILE>; # Get first line from file\n\
    @hot = <INFILE>; # Read rest of file into @hot\nprint $codeline;\nprint @hot;\n\
    ```\n\n- If `<FILEHANDLE>` appears in the conditional of a 'while' loop itself,\
    \ then it reads until EOF.\n\n```perl\n#!/usr/bin/perl\n# File: hot.pl\nopen(INFILE,\
    \ \"hot_data\") || die \"hot_data is ice cold\";\n$nexti = 0;\nwhile (<INFILE>)\
    \ {\n  if ($_ =~ /^#/) { # If line starts with #, then\n    next; # cause iteration\
    \ of 'while' loop.\n  } else {\n    hot[$nexti++] = $;\n  }\n}\nprint @hot;\n\
    ```\n\n# Notes\n\nHere for comparison, are several ways of handling line arguments:\n\
    \n```perl\n# Read each line in command-line file and assign to $_.\nwhile (<>)\
    \ { # or: while ($_ = <ARGV>) or while (<ARGV>)\n  # $_ contains current line\
    \ from current file\n  # Also, $ARGV is the name of the currently open file\n\
    }\n```\n\n```perl\n# Read each line in command-line file and assign to $arg.\n\
    while ($arg = <>) {\n  # $arg contains current line from current file\n  # Also,\
    \ $ARGV is the filehandle of the currently open file\n}\n```\n\n```perl\n# Assign\
    \ the strings of @ARGV to $_, one at a time.\nforeach (@ARGV) {\n  # $_ contains\
    \ the argument string\n  open(FILE, $_); # Open the file (if it is the name of\
    \ file)\n}\n```\n\n```perl\n# Assign the strings of @ARGV to $arg, one at a time.\n\
    foreach (@ARGV) {\n  # $arg contains the argument string\n  open(FILE, $arg);\
    \ # Open the file (if it is the name of file)\n}\n```\n\n```perl\n# Another way\
    \ to work through the command-line args\nwhile (@ARGV) {\n  # While there are\
    \ still elements in @ARGV\n  $file = shift @ARGV; # Get the next one\n  open(FILE,\
    \ $file); # Open the file (assuming it is the name of file)\n  while ($line =\
    \ <ARGV>) { # Iteratively read lines from file\n    print $line; # And just print\
    \ them for a demo\n  }\n}\n```\n\n# Default Input Operator\n\n- If the input operator\
    \ is used without a filehandle between the angle-brackets, then either:\n  A.\
    \ Reads from the concatenation of all files named by the array @ARGV, in order,\
    \ till EOF on the last file; the effective file handle is FIFO.\n  B. If there\
    \ are no elements in this array when the empty input operator is encountered,\
    \ then it reads from STDIN.\n\nExample, executed as: `null.pl [file ...]`\n\n\
    ```perl\n#!/usr/bin/perl\n# File: null.pl\n\nwhile (<>) { # Read @ARGV files,\
    \ or STDIN\n  if (/^[^#]/) { # That RE again ...\n    $hot[$++] = $;\n  }\n}\n\
    ```\n\n- To determine the name of the file being currently read from, look at\
    \ the special variable $ARGV.\n\n# Notes\n\nActually, the print function can take\
    \ an optional first parameter before the list of items to print. The optional\
    \ first parameter is a filehandle (or a scalar variable containing the name of\
    \ a filehandle) that tells the function where to send the output. If the first\
    \ parameter is omitted, the function outputs to the currently selected filehandle,\
    \ which is initially STDOUT when a program starts. We will talk about filehandles\
    \ in the next chapter.\n\nThe point to be made here is that the optional first\
    \ parameter is not part of the list of print items, so do not put a comma after\
    \ it. If you do, and Perl can detect that it is a filehandle, your program won't\
    \ compile or run - you will get an error message on that line. If the first parameter\
    \ is an indirect filehandle, i.e., a scalar variable containing the name of a\
    \ filehandle, Perl won't be able to tell that it is a filehandle and it will print\
    \ the contents of the variable as part of the list of items to the currently selected\
    \ filehandle.\n\nFinal comment: most perl functions can be called with or without\
    \ parentheses around the parameters.\n\nConsider:\n\n```perl\n#!/usr/bin/perl\n\
    \nprint STDOUT \"hello there\\n\", \"second line\\n\"; # No parens around params\n\
    print (STDOUT \"hello there\\n\", \"second line\\n\");# Parens around params\n\
    $f = \"STDOUT\"; # Set $f to contain the name of the STDOUT filehandle\nprint\
    \ ($f \"hello there\\n\", \"second line\\n\"); # No comma after $f\nprint ($f,\"\
    hello there\\n\",\"second line\\n\"); # Comma after $f\n```\n\nOutput:\n\n```\n\
    hello there\nsecond line\nhello there\nsecond line\nhello there\nsecond line\n\
    STDOUThello there\nsecond line\n```\n\nThe following would result in an error\
    \ before runtime:\n\n```perl\nprint (STDOUT, \"hello there\\n\", \"second line\\\
    n\"); # Parens around parms\n```\n"
  mdcn: "\n\n# 注意\n\n记住文件句柄（filehandles）是 Perl 中的一种数据类型。你可以像创建其他变量一样创建它们：\n\n```perl\n\
    XYZ;\n```\n\n你甚至可以用数据来加载它们，但除非你确切知道自己在做什么，否则不会产生任何有用的结果。文件句柄的设计是为了使用特定的 Perl 函数（如\
    \ `open()` 和 `close()`）来创建和操作。\n\n文件句柄的命名遵循 Perl 中其他数据结构的相同命名规则：它们对大小写敏感，可以是大写、小写或混合写，且长度可以（合理地）很。一种惯是将文件句柄全部大大写，而让所有用户创建的标量、数组等保持小写。这样做可以提高可读性。由于文件句柄没有关联特殊字符，使用大写会让它们在视觉上脱颖而出。\n\
    \nPerl 预定义的三个句句柄：`STDIN`、`STDOUT` 和 `STDERR`。\n\n`print` 和 `printf` 写入 `STDOUT`，除非你指定了不同的文件句柄。\n\
    \n`warn` 和 `die` 写入 `STDERR`。\n\n输入操作符 `<` 从 `STDIN` 读取，除非你指定了不同的文件句柄。\n\n# open\
    \ 函数\n\n- 使用 `open()` 打开一个文件并创建/加载文件句柄。\n- `open(FH,\"filex\")` 在（可能是新的）文件句柄 `FH`\
    \ 上打开文件 `filex`。\n- `open` 的默认模式是只读；你可以显式地在文件名前加上 `<` 字符：\n\n```perl\nopen(FH,\"\
    <filex\");\n```\n\n- 如果你想以写模式打开，在文件名前加上 `>`：\n\n```perl\nopen(FH,\">filex\");\n\
    ```\n\n使用 `>` 打开文件会覆盖原文件；若要追加，请使用 `>>`：\n\n```perl\nopen(FH,\">>filex\");\n```\n\
    \n- 你可以通过在 `>`、`<` 或 `>>` 前面加上 `+` 来同时以读写模式打开。\n\n- 如果你在引号字符串的末尾使用 `|` 字符，Perl\
    \ 会将该字符串作为 Unix 命令执行；后续从文件句柄的读取将从 Unix 命令的输出中读取。\n\n```perl\nopen(FH,\"find .-print|\"\
    );\n$first_file = <FH>;\n```\n\n- 在引号字符串开头使用管道符 `|` 将打开一个通到该命令 STDIN 的管道：\n\n\
    ```perl\nopen (FH,\"|sort > file_sorted\");\n```\n\n# 注意\n\n修改第二个示例的另一种方法是充分利用特殊变量\
    \ `$_`。正则表达式测试默认在特殊变量 `$_` 中进行，因此没有必要显式地写出它：\n\n```perl\nopen (INFILE, \"hot_data\"\
    ) || die \"hot_data is ice cold\";\nwhile (<INFILE>) {\n    if (/\\/) { # 默认，对\
