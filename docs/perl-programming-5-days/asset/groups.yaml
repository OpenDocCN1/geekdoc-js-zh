- md: "\n## Chapter 13 - Packages and Modules\n\n## Chapter Objectives\n\n- Create\
    \ and use packages.\n- Reuse source code via the require or use mechanism.\n-\
    \ Use the BEGIN and END subroutines to construct and destruct packages.\n- bless\
    \ a reference into knowing which package it belongs to.\n\n## Notes\n\nVariable\
    \ Scope in Perl\n\nIn addition to having a value, variables may be thought of\
    \ in terms of scope and duration. The scope of a variable is all of the `blocks\
    \ of code` that can access variable directly from its symbol table. The duration\
    \ of a variable is its lifetime (the life of the block, the life of the sub, the\
    \ life of the program).\n\nIn Perl, as we've discussed, unless you specifically\
    \ make a variable local with the `local` operator, its scope is global and its\
    \ duration is the life of the Perl program. If you use the local operator, the\
    \ scope of the variable is the block in which it was declared `local`, and any\
    \ subroutines called from that block. Its duration is the lifetime of the block\
    \ in which it was declared.\n\nIn addition to the `local` operator, Perl5 added\
    \ the `my` operator. You might think of this operator as creating a “super-local”\
    \ variable, analogous to the automatic (local) variables created in C or C++.\
    \ A variable declared with `my` is scoped to the enclosing block only, and may\
    \ not be accessed from any place outside that block, including subroutines called\
    \ from that block. Using `my` is preferable to use `local` since it reduces the\
    \ risk of unintentional variable name conflict during subroutine calls.\n\nGlobal\
    \ variables (all those not declared to be `local` or `my`) reside in symbol tables.\
    \ Symbol tables are created for each package that is created, allowing the developer\
    \ to separate variables used in a Perl program into “semi-private” areas. All\
    \ variables in all symbol tables are available globally. Perl does not provide\
    \ a means to enforce `privacy` of variables in packages. All packages and their\
    \ symbol tables are global.\n\n## Packages\n\n- A package is a semi-private area\
    \ to store variables and subroutines.\n- Packages are global and exist as long\
    \ as the program is running.\n- The default package is main.\n- All variables,\
    \ unless created with local or my, are stored in the current package (default\
    \ package main), and are globally accessible.\n- Use the package declaration to\
    \ create a package or set the current package.\n\n```\npackage Not_main; # set\
    \ current package to Not_main\n$a = 7; # set the scalar $a in the package\n# Not_main\
    \ to 7\n```\n\n- Use the \"::\" notation to resolve a reference to a package variable\
    \ if it exists in another package other the current package.\n\n```\npackage main;\
    \ # return to the main package\n$a = 3; # a scalar $a in the package main. NOT\
    \ the\n# same as Not_main::\n$Not_main::a = 14; # resets the scalar \"a\"\n# in\
    \ package Not_main to\n# a value of 14\n```\n\n- The current package set by a\
    \ package declaration remains the current package until the end of the block in\
    \ which the declaration was made or until another package statement is encountered.\n\
    \n## BEGIN and END Routines\n\n- * BEGIN and END are special subroutines provided\
    \ by Perl\n- * BEGIN subroutines will be executed as soon as they are completely\
    \ defined.\n- Each package has its own set of BEGIN/END subroutines.\n- Multiple\
    \ BEGIN subroutines are allowed within a program and will be executed in the order\
    \ encountered without regard to the package in which they are defined.\n- BEGIN\
    \ blocks may be used to “pre-declare” subroutines, pull in subroutine or variable\
    \ definitions from other files, initialize variables, open and read files, etc.\n\
    - END subroutines will be executed as late as possible.\n- Multiple END subroutines\
    \ are allowed within a program and will be executed in the reverse order in which\
    \ they are encountered.\n- END blocks may be used to take care of clean-up after\
    \ errors or during program termination.\n- END block will be executed even if\
    \ your program terminates with a die.\n\n## Notes\n\nAlthough some books on Perl5\
    \ will tell you that pulling in a subroutine definition from another file in a\
    \ BEGIN block will allow you to use that subroutine as a list operator (without\
    \ parents around its argument list), experimentation has shown that this is only\
    \ true if the BEGIN block that does the require or use comes before the usage\
    \ of the subroutine. However, you may use the imported subroutine in the subroutine\
    \ form (parents around argument list), even if it is imported via a BEGIN block\
    \ which occurs somewhere after the usage of the subroutine in the program.\n\n\
    ![](img/7fc661985e26f441bbcce9ca3c796ad2_173_0.png)\n\n## require vs. use\n\n\
    - Subroutine and variable definitions may appear in a file outside your current\
    \ Perl program source file.\n- This is a functionality similar to \"#include\"\
    s in C and C++.\n- In its most basic form, the \"remote\" file may be used with\
    \ either `require` or `use`.\n\n```\nrequire \"filename\";      # causes \"filename\"\
    \ to be\n# loaded and run at runtime.\n```\n\n```\nuse filename; # causes filename.pm\
    \ to be\n# loaded and run at compile time.\n```\n\n- You may `require` any filename\
    \ at all.\n- Different packages may be declared and used in the file and the filename\
    \ is irrelevant (though it typically has .pl appended to it to identify it as\
    \ a perl library file).\n- The `use filename;` declaration expects .pm.\n- At\
    \ least one package within the file must be the same as the filename.\n\n## Notes\n\
    \nSetting up a module to export symbols:\n\nAt minimum, the following lines need\
    \ to appear in your file order for calling program to import symbols into their\
    \ current package:\n\npackage my; # must be that same as filename.\n\nuse Exporter;\
    \ # using Perl's Exporter module.\n@ISA=qw(Exporter); # says current package has\
    \ access to\n\nAll of the symbols in the following array will be placed in calling\
    \ package if caller uses first form of use:\n\n```\n@EXPORT = qw(symbol1, symbol2,\
    \ symbol3, ...);\n```\n\nIf a module does not export anything, subroutines and\
    \ other variables are still available to the \"using\" program via the packages\
    \ declared in:\n\nThe symbols in the following array are available for import\
    \ into caller's environment:\n\nNote about the @INC array:\n\nEach Perl program\
    \ is launched with the @INC array populated based on the host system's configuration.\
    \ This array holds the names of directories which will be searched for files mentioned\
    \ in require and use declarations. Developers may add directory path information\
    \ into this array to meet their needs.\n\n```\npush (@INC, \"/usr/local/perltools\"\
    );\n```\n\n## Modules\n\n- A Perl module is a file whose name ends with .pm, and\
    \ in which exists a package with the same name as the file’s basename.\n- Modules\
    \ often export symbol(s) to the “using” program\n- These symbols can become part\
    \ of the using code’s current package and could overwrite symbols for subroutines\
    \ that already exist in that package at the time of the use declaration.\n- A\
    \ module must be set up to allow a user to import its symbols.\n\n- Three basic\
    \ forms of use that may appear in an importing program:\n  1. Auto-import everything\
    \ the module exports into current package:\n     use Filename;\n  2. Only import\
    \ listed items into package:\n     use Filename(classname, subname, ...);\n  3.\
    \ Don’t import anything into current package:\n     use Filename();\n\n- If the\
    \ module uses the @EXPORT array, the caller must use the first form of use.\n\n\
    - If the module uses the @EXPORT_OK array, the caller must use the second form\
    \ of use.\n\n- If the module doesn’t export anything, the caller should use the\
    \ third form of use.\n- This form may also be used to keep the module from populating\
    \ the caller’s package with its exported symbols.\n"
  mdcn: "\n\n## 第 13 章 - 包与模块\n\n## 章节目标\n\n- 创建并使用包。\n- 通过 `require` 或 `use` 机制重用源代码。\n\
    - 使用 `BEGIN` 和 `END` 子程序来构造和销毁包。\n- 使用 `bless` 引用以指明其所属的包。\n\n## 注意事项\n\nPerl\
    \ 中的变量作用域\n\n除了值之外，还可以从作用域（scope）和持续时间（duration）的角度来考虑变量。变量的作用域是可以从其符号表中直接访问变量的所有`代码块`。变量的持续时间是其生命周期（块的生命、子程序的生命、程序的生命）。\n\
    \n在 Perl 中，正如我们讨论过的，除非你特地使用 `local` 操作符将变量声明为局部，否则它的作用域是全局的，持续时间是 Perl 程序的生命周期。如果你使用\
    \ `local` 操作符，变量的作用域是声明为 `local` 的块以及从该块调用的任何子程序。它的持续时间是声明该块的生命周期。\n\n除了 `local`\
    \ 操作符外，Perl5 还增加了 `my` 操作符。你可以认为这个运算符创建了一个“超局部”变量，类似于 C 或 C++ 中创建的自动（局部）变量。用 `my`\
    \ 声明的变量作用域仅限于其闭包块，不能从该块外的任何地方访问，包括从该块调用的子程序。使用 `my` 比使用 `local` 更好，因为它减少了子程序调用期间意外变量名冲突的风险。\n\
    \n全局变量（所有未声明为 `local` 或 `my` 的变量）存储在符号表中。为每个创建的包创建一个符号表，允许开发者将 Perl 程序中使用的变量分离到“半私有”区域。所有符号表中的变量都是全局可用的。Perl\
    \ 没有提供强制包内变量`私有性`的方法。所有包及其符号表都是全局的。\n\n## 包\n\n- 包是一个存储变量和子程序的半私有区域。\n- 包是全局的，只要程序运行它们一直存在。\n\
    - 默认包是 `main`。\n- 所有的变量（除非用 `local` 或 `my` 创建）都存储在当前包（默认包 `main`）中，并且可以全局访问。\n\
    - 使用 `package` 声明来创建包或设置当前包。\n\n```\npackage Not_main; # 设置当前包为 Not_main\n$a =\
    \ 7; # 设置包中的标量 $a\n# 在 Not_main 中为 7\n```\n\n- 如果变量存在于当前包之外的另一个包中，使用 \"::\" 符号来解析对该包变量的引用。\n\
    \n```\npackage main; # 返回主包\n$a = 3; # 包 main 中的标量 $a。它与\n# Not_main::a 不是同一个\n\
    $Not_main::a = 14; # 重置包 Not_main 中的\n# 标量 \"a\" 值为\n# 14\n```\n\n- 由 `package`\
    \ 声明设置的当前包将保持为当前包，直到执行该声明的块结束，或者遇到另一个 `package` 语句。\n\n## BEGIN 和 END 例程\n\n-\
    \ *BEGIN 和 END 是 Perl 提供的特殊子程序*。\n- *BEGIN 子程序会在完全定义后立即执行*。\n- 每个包都有自己的一套 BEGIN/END\
    \ 子程序。\n- 程序中允许存在多个 BEGIN 子程序，它们将按照遇到的顺序执行，而不考虑它们定义所在的包。\n- BEGIN 块可用于“预声明”子程序、从其他文件引入子程序或变量定义、初始化变量、打开并读取文件等。\n\
    - END 子程序将尽可能晚地执行。\n- 程序中允许存在多个 END 子程序，它们将按照遇到的相反顺序执行。\n- END 块可用于处理错误后或程序终止时的清理工作。\n\
    - 即使你的程序因 `die` 终止，END 块也会执行。\n\n## 注意事项\n\n尽管某些关于 Perl5 的书籍会告诉你，在 BEGIN 块中从另一个文件引入子程序定义将允许你将该子程序作为列表操作符使用（无需在其参数列表周围加括号），但实验表明，只有当执行\
    \ `require` 或 `use` 的 BEGIN 块位于该子程序的使用之前，这才是正确的。然而，你仍然子程序的形式（在参数列表周围加括号）使用导入的子程序，即使它是通过发生在程序中子程序使用之后的某个\
    \ BEGIN 块导入的。\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_173_0.png)\n\n## require\
    \ vs. use\n\n- 子程序和变量定义可能出现在你当前 Perl 程序源文件之外。\n- 这种功能类似于 C 和 C++ 中的 `\"#include\"\
    `。\n- 在最基本的形式中，“远程”文件可以使用 `require` 或 `use`。\n\n```\nrequire \"filename\";   \
    \   # 导致 \"filename\" 在运行时\n# 加载并运行。\n```\n\n```\nuse filename; # 导致 filename.pm\
    \ 在编译时\n# 加载并运行。\n```\n\n- 你可以 `require` 任何文件名。\n- 文件中可以声明并使用不同的包，文件名并不相关（尽管它通常以\
    \ .pl 结尾以识别其为 perl 库文件）。\n- `use filename;` 声明期望的是 .pm 文件。\n- 文件中至少有一个包与文件名相同。\n\
    \n## 注意事项\n\n设置模块以导出符号：\n\n至少需要以下行按顺序出现在你的文件中，以便调用程序将符号导入到其当前包中：\n\npackage my;\
    \ # 必须与文件名相同\n\nuse Exporter; # 使用 Exporter 模块。\n@ISA=qw(Exporter); # 表示当前包可以访问\n\
    \n如果调用者使用以下形式的 `use`，则数组中的所有符号将放入调用包中：\n\n```\n@EXPORT = qw(symbol1, symbol2,\
    \ symbol3, ...);\n```\n\n如果模块没有导出任何内容，通过声明的包仍然可以使用符号：\n\n以下数组中的符号可以导入到调用者的环境中：\n\
    \n关于 @INC 数组的说明：\n\n每个 Perl 程序启动时根据主机系统的配置填充 @INC 数组。该数组包含了搜索 `require` 和 `use`\
    \ 声明的文件的目录。开发者可以向此数组添加路径信息以满足需求。\n\n```\npush (@INC, \"/usr/local/perltools\"\
    );\n```\n\n## 模块\n\n- Perl 模块是以 .pm 结尾的文件，其中存在与文件名同名的包。\n- 模块经常向“使用”程序导出符号\n-\
    \ 这些符号可以成为使用代码当前包的一部分，并可能在 `use` 声明时覆盖该包中已存在的符号。\n- 模块必须设置为允许用户导入其符号。\n\n- 程序中出现的三个基本\
    \ `use` ：\n  1. 将模块导出的所有内容导入到当前包：\n     use Filename;\n  2. 仅将列出的项导入包：\n     use\
    \ Filename(classname, subname, ...);\n  3. 不向当前包导入任何内容：\n     use Filename();\n\
    \n- 如果模块使用 @EXPORT 数组，调用者必须使用第一种 `use`形式。\n\n- 如果模块使用 @EXPORT_OK 数组，调用者必须使用第二种\
    \ `use` 。\n\n- 如果模块没有导出任何内容，调用者应该使用第三种 `use` 。\n- 这种形式也可用于防止模块将其导出的符号填充到调用者的包中。\n\
    \n"
