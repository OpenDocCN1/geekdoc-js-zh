    \ `do-BLOCK` 结构，允许你在求值修饰符之前执行一次语句块。`BLOCK` 是用大括号括起来的语句序列。\n\n```perl\ndo {\n \
    \ E1;\n  E2;\n  E3;\n  ...\n} [ while E; | until E; ]\n```\n\n这种结构仍然被视为简单表达式，因为在复合语句中可以做的事情是\
    \ `do-BLOCK` 结构无法完成的。\n\n因此，\n\n```perl\nE1 while E2;  与 do { E1;\n  E2;\n  E3;\n\
    \  ...\n} while E;\n```\n\n之间的区别在于：\n\n- 1) `BLOCK` 在 E 求值之前执行，从而确保语句（或多个语句）至少执行一次，并且\n\
    \n- 2) 你可以在块中包含多个语句。\n\n示例：\n\n```perl\n$count = 5;\ndo { print $count-- } while\
    \ $count;\n```\n\n等同于：\n\n```perl\n$count = 6;\nprint $count while $count--;\n\
