  - "[PAGE 212]\n\n# Variable-Length (Delimited) Fields\n\n+   - Many applications\
    \ operate on data records that contain variable-length delimited fields.\n- Examples\n\
    \  - Our cars file: white space delimited\n  - /etc/passwd: colon delimited\n\
    - The length of any given field can vary from record to record.\n- The join and\
    \ split functions handle data of this type.\n- join() joins together the elements\
    \ of a list into a string, putting a specified delimiter string between each element\
    \ in the joined string.\n- split() breaks a string into a list of elements; the\
    \ string must contain a delimiter between each desired list element."
  - "[PAGE 213]\n\n# Variable vs. Fixed\n\n+   * Advantages of variable-length data\n\
    \  - No need to worry about fields overflowing\n  - Flexible format can be easier\
    \ for users and programmers\n\n+   * Disadvantages of variable-length data\n \
    \ - Delimiters take storage and must be scanned for\n  - Binary data could be\
    \ mistaken for a delimiter\n  - Direct (random) access is not possible\n\n+  \
    \ * Advantages of fixed-length data\n  - No time or storage wasted on delimiters\n\
    \  - Records can be located by calculation and seeking\n  - Binary data presents\
    \ no problem\n\n+   * Disadvantages of fixed-length data\n  - Maximum size of\
    \ fields must be allocated, so pad bytes waste space\n  - More meticulous code\
    \ required to process fixed fields"
  - "[PAGE 214]\n\n# Handling Binary Data\n\n+   - `join()` and `split()` have analogous\
    \ fixed-length data functions called `pack()` and `unpack()`.\n\n+   - `unpack()`\
    \ creates a list from a scalar, as does `split()`. The elements to be extracted\
    \ out of the scalar are in known fixed positions in the scalar.\n\n+   - `pack()`\
    \ creates a scalar from a list, where the elements of the list are packed into\
    \ the scalar in fixed positions.\n\n+   - `pack()` and `unpack()` primary features\
    \ are:\n  - Fixed-position, fixed-length strings are created (packed) or broken\
    \ out (unpacked).\n  - ASCII-to-binary (pack) and binary-to-ASCII (unpack) conversions\
    \ can take place.\n\n+   - Example uses for `pack()` and `unpack()`:\n  - Creating\
    \ records that are formatted as fixed-length fields.\n  - Extracting fields from\
    \ records that are formatted as fixed-length fields.\n  - Writing and reading\
    \ binary data files (ON SAME MACHINE!!!).\n  - Sending/receiving binary structures\
    \ to/from Perl function calls, such as `socket()`."
  - '[PAGE 215]


    # Notes


    Synopsis of the pack() function:


    ```

    pack(TEMPLATE, LIST)

    ```


    pack() takes the array or list passed as LIST and packs its values into a binary
    structure which is returned in a scalar. TEMPLATE is a sequence of characters
    that specifies the order and type of values to be packed into the structure. The
    characters allowable for use in TEMPLATE are:


    +   - A An ascii string, will be space padded.

    - a An ascii string, will be null padded.

    - c A signed char value.

    - C An unsigned char value.

    - s A signed short value.

    - S An unsigned short value.

    - i A signed integer value.

    - I An unsigned integer value.

    - l A signed long value.

    - L An unsigned long value.

    - n A short in "network" order.

    - N A long in "network" order.

    - f A single-precision float in the native format.

    - d A double-precision float in the native format.

    - p A pointer to a string.

    - P A pointer to a structure (fixed-length string)

    - v A short in "VAX" (little-endian) order.

    - x A long in "VAX" (little-endian) order.

    - X A null byte.

    - @ Null fill to absolute position.

    - u A unencoded string.

    - b A bit string (ascending bit order, like vec()).

    - B A bit string (descending bit order).

    - h A hex string (low nibble first).

    - H A hex string (high nibble first).


    A letter optionally be followed by a number which provides a repeat count for
    the letter. The letter and repeat count together form a field specifier. Field
    specifies may be separated by white space, which will be ignored.


    A count causes to consume that many values from list, unless the letter is ''a''
    or ''A''. In those cases, only one value (string) is taken from the list, but
    it is no of space padded up to the count if necessary. If the repeat count is
    ''*'', then the remaining values in the list will be packed according to the letter
    type being repeated.


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_215_0.png)'
