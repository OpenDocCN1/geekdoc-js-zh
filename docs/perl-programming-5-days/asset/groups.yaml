    # The Symbol Table


    +   * The compiler keeps track of the symbols used in the program, and the memory
    locations of their values, in a symbol table.


    +   * The symbol table is actually a hash whose name is the name of the current
    package with two ''::'' appended to it.


    %main::


    The keys of this hash are the variable names:


