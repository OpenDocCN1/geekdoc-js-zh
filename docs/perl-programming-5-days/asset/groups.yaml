  - "[PAGE 300]\n\n# tainperl and Other setuid() Things\n\n+   - The setuid() system\
    \ call allows a program (if its setuid bit is set) to assume the user-ID of another\
    \ user as it runs.\n\n+   - Many UNIX utilities do this routinely - they have\
    \ to as part of their function:\n    - passwd\n  - login\n  - mail, mailx, elm\n\
    \n+   - Perl allows you to create scripts which can also change their uid and\
    \ gid at runtime.\n\n+   - The actual id values are set with four special variables:\n\
    \  ```\n  $> effective user id\n  $< real user id\n  $) effective group id\n \
    \ $( real group id\n  ```\n\n+   - Perl programs which are allowed to change the\
    \ real ids are potential security problems, because a knowledgeable user could\
    \ take an otherwise benign program and turn it into a blatant security breach\
    \ of giving them root access.\n\n+   - taintperl, a special version of the Perl\
    \ executable, prevents this."
  - "[PAGE 301]\n\n# Perl, the Web, and CGI Scripts\n\n+   - The growth of the web\
    \ has created a huge new increase in Perl's popularity.\n\n+   - Creation and\
    \ maintenance of web pages and processing of web forms and databases demand a\
    \ language exactly like Perl.\n  - Portable across the many systems web servers\
    \ run on.\n  - Great text and pattern-processing capability.\n  - High-performance\
    \ (for a scripting language) with rapid program development.\n  - Extensible and\
    \ interoperable.\n\n+   - A common use of Perl scripts is for the processing of\
    \ CGI (Common Gateway Interface) data from web-page forms.\n\n+   - A popular\
    \ module (available from CPAN) for this is `CGI.pm`, developed by Lincoln Stein.\n\
    \  - `CGI.pm` makes it easy to parse CGI data.\n  - It provides routines for dynamically\
    \ generating HTML text."
