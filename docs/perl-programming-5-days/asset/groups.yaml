- md: "\n# Notes\n\n## List commands\n\n- 1 min+incr List incr+1 lines starting at\
    \ min. If min is omitted, starts where last listing left off. If incr is omitted,\
    \ previous value of incr is used.\n- 1 min-max List lines in the indicated range.\n\
    - 1 line List just the indicated line.\n- 1 List next window.\n- - List previous\
    \ window.\n- w line List window around line.\n- 1 subname List subroutine. If\
    \ it's a long subroutine it just lists the beginning. Use \"l\" to list more.\n\
    \n## Listing Lines\n\n- The l and w commands (list and window) will display source\
    \ lines of your program.\n- Examples\n\n```\nl 1        # Show all lines, a few\
    \ at a time\nl 1\nl 1\n...\n\nl 10       # Show line 10\n\nl 3-6       # Show\
    \ lines 3-6\n\nl 3+6       # Show lines 3-9\n\nw 10       # Show the lines around\
    \ 10\n\nl subber    # Display subber\n```\n\n# Notes\n\nHitting the <Enter> key\
    \ will execute the previous s or n command, whichever was given most recently.\
    \ You must give an s or n command before the <Enter> will do anything.\n\nRecall\
    \ that any time the debugger pauses and displays the next line to be executed,\
    \ you can give any command or non-command that you like. A very useful command\
    \ used in single-stepping is the p command, which will print the values of variables,\
    \ including arrays.\n\n```\nDB<1>p $x\nDB<2>p @x\nDB<3>p \"@x\"      # Separators\n\
    DB<4>print \"@x\" # Non-command\n```\n\n# Single Stepping\n\n- To get things rolling,\
    \ you can either give the 's' or 'n' single-step commands.\n- Both s and n cause\
    \ a single statement to be executed, pausing and displaying the next statement\
    \ before executing it.\n- The s command will enter subroutines and single step\
    \ through them.\n- The n command will execute a call to a subroutine and will\
    \ execute the entire subroutine without single-stepping through the subroutine\
    \ lines; it will pause in the calling routine at the line after the line that\
    \ called the subroutine.\n- The r command will execute the remainder of the statements\
    \ in the current subroutine, then pause at the next line in the caller after the\
    \ line that called the subroutine.\n- If r is given in the main context, it will\
    \ act like c.\n- The c command continues the program in full run mode (no single-stepping\
    \ or pausing unless a breakpoint is encountered).\n\n# 278 Perl Programming\n\n\
    # Notes\n\n## Breakpoint commands\n\n- b [line] [condition] Set a breakpoint.\
    \ If line is omitted, sets a breakpoint on the line that is to be executed. If\
    \ a condition is specified, it is evaluated each time the statement is reached\
    \ and a breakpoint is taken only if the condition is true. Breakpoints may be\
    \ set on lines that begin an executable statement.\n- b subname [condition] Set\
    \ breakpoint at first executable line of subroutine.\n- c [line] Continue until\
    \ the next breakpoint is reached; optionally inserts a one-time breakpoint at\
    \ the specified line.\n- d [line] Delete breakpoint. If line is omitted, deletes\
    \ the breakpoint on the line that is to be executed.\n- D Delete all breakpoints.\n\
    \n## Setting and Clearing Breakpoints\n\n- The b command sets a breakpoint as\
    \ specified.\n- Continue (c) and return (r) commands will execute statements until\
    \ they hit a breakpoint. You can then:\n- Examine variables\n- Begin single-stepping\n\
    - Continue to the next breakpoint\n- Give any command or non-command\n- An optional\
    \ [condition] is specified as it would appear inside the parentheses of a Perl\
    \ statement.\n- Example\n\n```\nmain(demo:4): $x=0;\nDB<1> b 9\nDB<2> b $x ==\
    \ 0\nDB<3> c\ncontinuing...\nline 1 leaving subroutine, $newvar = 9\nmain(demo:8):\
    \ print \"$ret\"\nDB<3>\n```\n\n# Modifying the Debugger\n\n- If you wish to modify\
    \ the behavior of the debugger, you can:\n- Copy the source code to your directory:\
    \ cp /usr/local/lib/perl/perldb.pl\n- Modify it (learn it first): Run your program\
    \ as follows: perl -d -I. demo\n- The '-I.' means to add the current directory\
    \ to the front of the search path for included files.\n- The -d option tells Perl\
    \ to include (require) perldb.pl.\n\n# 282 Perl Programming\n\n# Notes\n\nThe\
    \ following is the list of bitmask values Perl recognizes for the -D flag.\n\n\
    - 1 | Tokenizing and Parsing\n- 2 | Stack Snapshots\n- 4 | Label Stack Processing\n\
    - 8 | Trace Execution\n- 16 | Operator Node Construction\n- 32 | String/Numeric\
    \ Conversions\n- 64 | Preprocessor Command for -P\n- 128 | Memory Allocation\n\
    - 256 | Format Processing\n- 512 | Regular Expression Parsing\n- 1024 | Syntax\
    \ Tree Dump\n- 2048 | Tainting Checks\n- 4096 | Memory Leaks (not supported)\n\
    - 8192 | Hash Dump\n- 16384 | Scratchpad Allocation\n- 32768 | Cleaning Up\n\n\
    The letters are also understood by -D and can be invoked in place of the bitmasks.\
    \ For example, to run a script and see memory allocation as it occurs, run\n\n\
    ```\nperl -D128 demo.pl\n```\n\nTo also see string to numeric conversions, you\
    \ would use -D128+32 or\n\n```\nperl -D160 demo.pl\n```\n\nYou can also use the\
    \ letters, as in\n\n```\nperl -Dcm demo.pl\n```\n\nThe -D flag can also be set\
    \ in your script at the interpreter line:\n\n```\n#!/usr/bin/perl -D160\n```\n\
    \n# The -w and -D Flags\n\n- Perl can be invoked with many options (flags) set\
    \ from the command line.\n- The -w flag makes Perl print out warnings (non fatal\
    \ errors) as it runs a program.\n- These are often very helpful in figuring out\
    \ better ways to build a program.\n- The Perl authors highly recommend (just about\
    \ demand) that you use -w whenever possible.\n- The -D flag allows you to see\
    \ at run time many facets of what Perl is doing internally.\n- -D takes its argument\
    \ a bitmask (in decimal) which tells it what to print out.\n- The perl executable\
    \ must have been built with the DEBUGGING option.\n- For more information on these\
    \ and other flags, see the Switches section of the Social Engineering chapter\
    \ in the Camel book.\n\n# Lab\n\n1. Practice using the debugger with programs\
    \ provided. Set and clear breakpoints, single step through and over subroutines,\
    \ change variables that affect the flow of execution, display variables, etc.\n\
    2. Modify the debugger to display a * after the line number of the current line\
    \ when forms of the 'l' or 'w' commands are given.\n\n# Appendix 3 - Miscellaneous\
    \ Topics\n\n# Notes\n\nA simple Hello World! widget script could be written as\
    \ follows:\n\n```\n#!/usr/bin/perl -w\n\nuse strict;\nuse Tk;\nmy $main = new\
    \ MainWindow;\n$main->Label(text => 'Hello World!')\n->pack;\n$main->Button(text\
    \ => 'Quit',\n-command => sub(exit))\n)->pack;\n\nMainLoop;\n```\n\nThe MainLoop\
    \ statement is the main event handler loop and is usually found in perl/ scripts\
    \ after the widgets have been declared and packed. MainLoop is actually a function\
    \ call and you may see it written as MainLoop(), &Tk::MainLoop(), etc.\n\nMost\
    \ parameters in calls to perl/Tk routines are passed by reference.\n\nThe following\
    \ Tk primitives are available under perl/Tk:\n\n| Button | Menubutton |\n| Canvas\
    \ | Message |\n| Checkbutton | Radiobutton |\n| Entry | Scale |\n| Frame | Scrollbar\
    \ |\n| Label | Text |\n| Listbox | Toplevel |\n| Menu | |\n\nThe following are\
    \ Tix primitives available under perl/Tk:\n\n```\nHList\nInputOnly\n```\n\nA lot\
    \ of other compound/composite/constructs are available.\n\nA good introduction\
    \ to the primitives and how they may be used in conjunction with each other may\
    \ be found in the demo scripts at: http://w4ls.cornell.edu/~pvhp/ptk/ptIMG.html\n\
    \n# perl.tk\n\n- The Tk Toolkit is a set of compiled objects which can be invoked\
    \ from certain programming environments to produce Motif-like Graphical Interface\
    \ applications\n- perl/tk (often called ptk) uses Perl’s OOP functionality to\
    \ implement the graphical objects which create the buttons, windows, etc on the\
    \ screen.\n- To install perl/tk on your system, you must have three things:\n\
    \  * A compiled Perl5 on the system.\n  * A (compiled) copy of the Tk library.\n\
    \  * A linkable Xlib library for X-windows.\n- Once the Tk module is available\
    \ for Perl to use, you simply instantiate the desired graphical objects from inside\
    \ your Perl code as you would with any other Perl objects.\n"
  mdcn: "\n\n# 笔记\n\n## 列表命令\n\n- `1 min+incr List` 从 `min` 开始列出 `incr+1` 行。如果省略了\
    \ `min`，则从上一次列表停止的地方开始。如果省略了 `incr`，则使用 `incr` 的原有值。\n- `1 min-max List` 列出指定范围内的行。\n\
    - `1 line List` 仅列出指定的行。\n- `1 List` 显示下一个窗口。\n- `- List` 显示上一个窗口。\n- `w line\
    \ List` 列出行附近的窗口。\n- `1 subname List` 列出子程序。如果子程序很长，它只列出开头。使用 \"l\" 列出更多。\n\n\
    ## 列出行\n\n- `l` 和 `w` 命令（list 和 window）将显示你程序的源代码行。\n- 示例\n\n```\nl 1        #\
    \ 显示所有行，一次显示几个\nl 1\nl 1\n...\n\nl 10       # 显示第 10 行\n\nl 3-6       # 显示第 3-6\
    \ 行\n\nl 3+6       # 显示第 3-9 行\n\nw 10       # 显示第 10 行附近的行\n\nl subber    # 显示\
    \ subber\n```\n\n# 笔记\n\n按下 <Enter> 键将执行上一次的 `s` 或 `n` 命令，以最后给出的为准。在 <Enter> 起作用之前，你必须给出一个\
    \ `s` 或 `n` 命令。\n\n记住，每当调试器暂停并显示要执行的下一行时，你可以输入任何喜欢的命令或非命令。单步执行中一个非常有用的命令是 `p`，它会打印变量的值，包括数组。\n\
    \n```\nDB<1>p $x\nDB<2>p @x\nDB<3>p \"@x\"      # 分隔符\nDB<4>print \"@x\" # 非命令\n\
    ```\n\n# 单步执行\n\n- 为了让程序运行，你可以提供 's' 或 'n' 单步命令。\n- `s` 和 `n` 都会导致执行一条语句，在执行下一个语句之前暂停并显示该语句。\n\
    - `s` 命令将进入子程序并在其中进行单步执行。\n- `n` 命令将执行对子程序的调用，并将执行整个子程序，而不单步执行子程序的内部行；它将在调用程序中、调用子程序的行之后的下一行暂停。\n\
    - `r` 命令将执行当前子程序中剩余的语句，然后在调用程序中、调用子程序的行之后的下一行处暂停。\n- 如果在主环境中给出 `r`，它的作用类似于 `c`。\n\
    - `c` 命令以全速运行模式继续执行程序（除非遇到断点，否则不会单步执行或暂停）。\n\n# 278 Perl 编程\n\n# 笔记\n\n## 断点命令\n\
    \n- `b [line] [condition]` 设置断点。如果省略了 `line`，则在要执行的行上设置断点。如果指定了条件，则每次到达该语句时都会评估该条件，只有当条件为真时才会触发断点。断点可以设置在起始可执行语句的行上。\n\
    - `b subname [condition]` 在子程序的第一行可执行行设置断点。\n- `c [line]` 继续直到遇到下一个断点；可选在指定的行处插入一次性断点。\n\
    - `d [line]` 删除断点。如果省略了 `line`，则删除要执行的行上的断点。\n- `D` 删除所有断点。\n\n## 设置和清除断点\n\n\
    - `b` 命令按指定设置断点。\n- 继续 (c) 和返回 (r) 命令将执行语句，直到遇到断点。然后你可以：\n- 检查变量\n- 开始单步执行\n-\
    \ 继续到下一个断点\n- 输入任何命令或非命令\n- 可选的 `[condition]` 指定方式与其在 Perl 语句括号内出现是一的。\n- 示例\n\
    \n```\nmain(demo:4): $x=0;\nDB<1> b 9\nDB<2> b $x == 0\nDB<3> c\ncontinuing...\n\
    line 1 leaving subroutine, $newvar = 9\nmain(demo:8): print \"$ret\"\nDB<3>\n\
    ```\n\n# 修改调试器\n\n- 如果你想修改调试器的行为，你可以：\n  - 将源代码复制到你的目录：`cp /usr/local/lib/perl/perldb.pl`\n\
    \  - 修改它（先学习它）：如下所示运行你的程序：`perl -d -I. demo`\n  - `-I.` 意味着将当前目录添加到包含文件的搜索路径前端。\n\
    \  - `-d` 选项告诉 Perl 包含（require）`perldb.pl`。\n\n# 282 Perl 编程\n\n# 笔记\n\n以下是 Perl\
    \ 为 -D 标志识别的位掩码值列表。\n\n- 1 | 分词化和解析\n- 2 | 栈快照\n- 4 | 标签栈处理\n- 8 | 跟踪执行\n- 16\
    \ | 运算符节点构造\n- 32 | 字符串/数字转换\n- 64 | 用于 -P 的预处理器命令\n- 128 | 内存分配\n- 256 | 格式处理\n\
    - 512 | 解析\n- 1024 | 语法转储\n- 2048 | 污染性检查\n- 4096 | 内存泄漏\n- 8192 | 栈转储\n- 16384\
    \ | 内存分配\n- 32768 | 清理\n\n- 为了启动，可以提供 's' 或 'n' 单步命令。\n- 使用调试器提供的程序。设置和清除断点，单步执行并跳过子程序，显示变量，等。\n\
    - 当 `l` 或 `w` 命令给出时，调试器显示行号。\n\n# 附录 3 - 杂项\n\n# 笔记\n\n一个简单的 Hello World! 脚本可以这样写：\n\
    \n```\n#!/usr/bin/perl -w\n\nuse strict;\nuse Tk;\nmy $main = new MainWindow;\n\
    $main->Label(text => 'Hello World!')\n->pack;\n$main->Button(text => 'Quit',\n\
    -command => sub(exit))\n)->pack;\n\nMainLoop;\n```\n\nMainLoop 通常位于组件定义和 pack\
    \ 之后。MainLoop 实际上是一个函数调用，你可能会看到像 `MainLoop()`、`&Tk::MainLoop()` 等写法。\n\n大多数调用调用的参数通过引用传递。\n\
    \nperl/Tk 下可用的 Tk 组件：\n\n| Button | Menubutton |\n| Canvas | Message |\n| Checkbutton\
    \ | Radiobutton |\n| Entry | Scale |\n| Frame | Scrollbar |\n| Label | Text |\n\
    | Listbox | Toplevel |\n| Menu | |\n\nperl/Tk 下可用的 Tix 组件：\n\n```\nHList\nInputOnly\n\
    ```\n\n还有许多其他复合/构造是可用的。\n\n关于组件以及如何结合使用的良好介绍，可以在示例脚本中找到：http://w4ls.cornell.edu/~pvhp/ptk/ptIMG.html\n\
    \n# perl.tk\n\n- Tk Toolkit是一组编译对象，可以从某些编程环境中调用以产生类似 Motif 的图形界面应用程序\n- perl/tk（通常称为\
    \ ptk）使用 Perl 的 OOP 功能来实现创建屏幕上的按钮、窗口等图形对象\n- 在系统上安装 perl/tk 需要三样东西：\n  * 系统上编译好的\
    \ Perl5\n  * Tk 库的编译副本\n  * 用于 X 窗口的可链接 Xlib 库\n- 一旦 Tk 模块供 Perl 使用，你就可以像处理其他任何\
    \ Perl 对象一样，在 Perl 代码中实例化所需的图形对象。\n\n"
