    * Multiple BEGIN subroutines are allowed within a program and will be executed
    in the order encountered without regard to the package in which they are defined.

    * BEGIN blocks may be used to “pre-declare” subroutines, pull in subroutine or
    variable definitions from other files, initialize variables, open and read files,
    etc.

    * END subroutines will be executed as late as possible.

    * Multiple END subroutines are allowed within a program and will be executed in
    the reverse order in which they are encountered.

    * END blocks may be used to take care of clean-up after errors or during program
    termination.

    * END block will be executed even if your program terminates with a die.


    # Notes


    Although some books on Perl5 will tell you that pulling in a subroutine definition
    from another file in a BEGIN block will allow you to use that subroutine as a
    list operator (without parents around its argument list), experimentation has
    shown that this is only true if the BEGIN block that does the require or use comes
    before the usage of the subroutine. However, you may use the imported subroutine
    in the subroutine form (parents around argument list), even if it is imported
    via a BEGIN block which occurs somewhere after the usage of the subroutine in
    the program.


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_173_0.png)'
  - "[PAGE 174]\n\n# require vs. use\n\n+   - Subroutine and variable definitions\
    \ may appear in a file outside your current Perl program source file.\n\n+   -\
    \ This is a functionality similar to \"#include\"s in C and C++.\n\n+   - In its\
    \ most basic form, the \"remote\" file may be used with either `require` or `use`.\n\
    \n```\nrequire \"filename\";      # causes \"filename\" to be\n              \
    \            # loaded and run at runtime.\n```\n\n```\nuse filename; # causes\
    \ filename.pm to be\n              # loaded and run at compile time.\n```\n\n\
    +   - You may `require` any filename at all.\n\n+     Different packages may be\
    \ declared and used in the file and the filename is irrelevant (though it typically\
    \ has .pl appended to it to identify it as a perl library file).\n\n+   - The\
    \ `use filename;` declaration expects .pm (perl module) appended to `filename`.\n\
    \n+     At least one package within the file must be the same name as the file's\
    \ basename (sans .pm)."
  - '[PAGE 175]


    # Notes


    Setting up a module to export symbols:


    At a minimum, the following lines need to appear in your module file in order
    for a calling program to import the module''s symbols into their current package:


    package myPackage; #must be that same as base filename.


    use Exporter(); #using Perl''s Exporter module.

    @ISA=qw(Exporter); # says current package has access to

    # Exporter''s methods and members.


    # All of the symbols in the following array will be placed in the

    # calling programs current package if caller uses first form of

    # use: use myPackage.


    ```

    @EXPORT = qw(symbol1, symbol2, symbol3, ...);

    noror,

    ```


    # The symbols in the following array are available for import into

    # the caller''s current environment if the caller is using the

    # second form of use: use myPackage(symbol1, symbol2, ...).


    ```

    @EXPORT_OK = qw(symbol1, symbol2, symbol3, ...);

    ```


    If a module does not export anything, subroutines and other variables are still
    available to the

    "using" program via the packages declared in the module.


    Note about the @INC array:


    Each Perl program is launched with the @INC array populated based on the host
    system''s

    configuration. This array holds the names of directories which will be searched
    for files mentioned in

    require and use declarations. Developers may add directory path information into
    this array to\meet their needs.


    ```

    push (@INC, "/usr/local/perltools");

    ```'
  - "[PAGE 176]\n\n# Modules\n\n+   - A Perl module is a file whose name ends with\
    \ .pm, and in which exists a package with the same name as the file’s basename.\n\
    \n+   - Modules often export symbol(s) to the “using” program\n  - These symbols\
    \ can become part of the using code’s current package and could overwrite symbols\
    \ for subroutines that already exist in that package at the time of the use declaration.\n\
    \  - A module must be set up to allow a user to import its symbols.\n\n+   - Three\
    \ basic forms of use that may appear in an importing program:\n  1. Auto-import\
    \ everything the module exports into current package:\n     use Filename;\n  2.\
    \ Only import listed items into package:\n     use Filename(classname, subname,\
    \ ...);\n  3. Don’t import anything into current package:\n     use Filename();\n\
    \n+   - If the module uses the @EXPORT array, the caller must use the first form\
    \ of use.\n\n+   - If the module uses the @EXPORT_OK array, the caller must use\
    \ the second form of use.\n\n+   - If the module doesn’t export anything, the\
    \ caller should use the third form of use.\n  - This form may also be used to\
    \ keep the module from populating the caller’s package with its exported symbols."
