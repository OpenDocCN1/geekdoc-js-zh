  - '[PAGE 49]


    # Notes


    ```

    # Get first three and last two

    @new = @arr[0..2, $arr-1, $arr];

    ```


    ```

    # But what''s this? It''s the value of the last element in the list.

    $new = @arr[0..2, $arr-1, $arr]; # Same as $arr[$arr]

    ```


    Regarding the last example, when a list is used in a scalar context, it returns
    the value of the last element of the list, BUT only for comma separated lists.


    If the list is generated by the range operator, but it is in a scalar context,
    then the range operator will behave as a scalar range operator. In the last example,
    the range operator is part of a list (the one inside the brackets) so it acts
    like an array context range operator, but the entire expression is in a scalar
    context because the entire expression is an assignment to a scalar.


    Another interesting function is splice(). It allows you to replace an interior
    section of an array with a new list of data objects. The generalized syntax is


    ```

    splice (target_array, start_index, num_elem, list)

    ```


    The line


    ```

    @old = splice (@array, 4, 9, @extra);

    ```


    will remove the elements indexed 4 through (4+9) in the array @array, and put
    in their place the list derived from the array @extra. splice returns the elements
    removed.'
  - '[PAGE 50]


    # Array Slices


    +   - An array slice is a list that is created by extracting selected elements
    of an array.

    - The elements are not necessarily contiguous.

    - If the slice that you want to extract from an array consists of contiguous elements,
    then you can use the range operator to select the slice.

    - Otherwise, just list the element indices separated by commas.


    ```

    # Same as @arr[3..5], or ($arr[3], $arr[4], $arr[5])

    @new = @arr[3,4,5];


    # First and last. Same as ($arr[0], $arr[#arr])

    @new = @arr[0,$#arr];


    # The entire array ($arr[ .. #arr])

    @new = @arr;

    ```


    Note to specify a slice, you use the array name, starting with @, with brackets
    which contain the list of subscripts.


    ```

    @arr[4] # An array slice, with one element.

    $arr[4] # A scalar, the 5th of @arr.

    ```'
  - '[PAGE 51]


    # Notes


    Normal arrays are named lists of single elements, indexed by position. Hashes
    are named lists of pairs, index and element, known as ''key,value'' pairs. Additional
    example:


    ```

    #!/usr/bin/perl

    # File: birth.pl


    @ARGV = 1 && die "Usage: $0 name\n";n%birth = (''mom'', ''dad'', ''Oct 5'', ''Nov
    7'', ''bro'', ''May 25'', ''sis'', ''Jun 4'');

    %birth(''son'') = ''Jan 22'';

    $birth(''daughter'') = ''Sep 2'';


    print "$birth{ARGV[0]}\n"; # Select an index on the command line

    ```


    Perl5 offers alternate syntax for the comma operator (yes, it is actually an operator.)

    The new syntax is to use "equals greater-than":


    ```

    =>

    ```


    in place of the comma. Both => and , do the same thing, but using the => form
    in certain places (especially in object oriented code) makes for easier reading
    and understanding of what exactly is going on.


    In the above example, you would say


    ```

    %birth = (''mom'' => ''Oct 5'', ''dad'' => ''Nov 7'', ''bro'' => ''May 25'',

    ''sis'' => ''Jun 4'');

    ```


    It makes it more readable.'
  - '[PAGE 52]


    # Hashes


    +   - Hashes are easy to learn about and use.

    - Normal arrays are indexed by number (typically starting at 0).


    ```

    @thing = (''one'', ''two'', ''three'');

    print $thing[1];   # Prints ''two''

    ```


    +   - Hashes use strings as indices.

    - Note that you refer to an entire hash with a percent sign, %, as opposed to
    an @ sign for a normal array.

    - Also, you access individual elements with curly braces as opposed to brackets.


    ```

    %thing = (''first'', ''one'', ''second'', ''two'', ''third'', ''three'');

    print $thing(''second'');   # Prints ''two''

    ```'
- md: "\n## Notes\n\nThe each operator iterates (in apparently random order) through\
    \ all elements in the hash. Each new call to each returns a two-item list consisting\
    \ of the next key-value pair. After the last pair has been returned, the next\
    \ call to each returns an empty list; then each resets itself, and the next each\
    \ starts the iteration over the beginning. You can deliberately reset each by\
    \ using keys in scalar context.\n\nYou must not add new elements to a hash while\
    \ iterating through it with each, though you can use delete.\n\nPerl uses hashes\
    \ extensively internally to hold the information it needs to run itself. Several\
    \ of these internal structures are available to your program.\n\n%ENV is a hash\
    \ which is automatically loaded with the process's environment variables.\n\n\
    ```perl\nprint $ENV{'TERM'}; # will print xterm, vt100, or whatever\n```\n\n%SIG\
    \ holds the names of signals as keys, and the procedures (usually subroutines)\
    \ to be triggered on receipt of each signal as values.\n\n```perl\n$SIG{'HUP'}\
    \ = \\&sub_hup; # will call subroutine sub_hup when\nSIGHUP received\n```\n\n\
    (Perl allows you to send a signal to a process with its kill() function.)\n\n\
    To print the entire environment of the script:\n\n```perl\nforeach $v (sort keys\
    \ %ENV)\n{\n  print \"$v=$ENV{$v}\\n\";\n}\n```\n\nAll entries in a hash can be\
    \ deleted with the reset() command:\n\n```perl\nreset (hash);\n```\n\nBe careful,\
    \ because this will wipe out all objects named hash, not just the hash!\n\nundef\
    \ is safer if it only deletes the specified variable;\n\n```perl\nundef (%hash);\n\
    ```\n\n## Hash Functions\n\n- Three operators provide hash iteration mechanisms:\n\
    \  - each\n  - keys\n  - values\n\n- The each operator returns a two-element list\
    \ consisting of the key and value for the next value of a hash.\n  - Perl magically\
    \ remembers where you are in the hash.\n\n- The keys operator returns a list consisting\
    \ of all the hash keys.\n\n```perl\nforeach $k ( keys %myhash )\n{\n    print\
    \ \"Value for key $k is $myhash{$k}\\n\";\n}\n```\n\n- The values operator returns\
    \ a list consisting of all the hash values.\n```perl\n@vals = values %myhash;\n\
    print \"Values in myhash: @vals\\n\";\n```\n\n- The delete operator removes an\
    \ element (and its key) from a hash:\n```perl\ndelete $hash{key};\n```\n\n- The\
    \ undef operator undefines an entire hash:\n```perl\nundef %hash;\n```\n\n## Notes\n\
    \nPerl5 has somewhat modified the way Perl handles lists evaluated in a scalar\
    \ context. The man page for perlfunc(1) states, in part:\n\n> \"Remember the following\
    \ rule: There is no general rule for converting a list into a scalar!\"\n\nEach\
    \ operator and function decides which it would be most appropriate to return in\
    \ a scalar context. Some operators return the length of the list that would have\
    \ been returned in a list context. Some operators return the first value in the\
    \ list. Some operators return the last value in the list. Some operators return\
    \ a count of successful operations. In general, do what you want, unless you want\
    \ consistency.\n\nIt is said that an array context is a context that \"wants\"\
    \ an array.\n\n```perl\n# Left side \"wants\" a scalar, so the array\n# produces\
    \ its number of elements\n\n$num_elem = scalar @stings; $num_elem contains number\
    \ of elements in @stings\n\n# In an unnamed list, the scalar value of the list\n\
    # is the value of its last element (read about the comma operator)\n\n$last_elem\
    \ = ('first', 'second', 'third', 'fourth');\nprint \"$last_elem\\n\";\n# Will\
    \ print: fourth\n```\n\n```perl\n# What happens here?\n$n = stat(\"/unix\");\n\
    \n# How about here?\n$n = @n = stat(\"/unix\");\n```\n\nA list value (such as\
    \ that returned by stat) can be indexed just like an array can! Suppose we only\
    \ want the 8th element (file size) of the list returned by stat:\n\n```perl\n\
    $size = (stat(\"/unix\")) [7];\n```\n\nPerl programmers often use this with functions\
    \ like stat and localtime (look up localtime in the Perl book).\n\n## Scalar and\
    \ List Contexts Revisited\n\n- In an assignment statement:\n  1. Assignment to\
    \ a scalar variable evaluates the right-hand side in scalar context.\n  2. Assignment\
    \ to an array, or to a list of scalar variables, evaluates the right-hand side\
    \ in list context.\n\n- Example: The input operator will input into either a scalar\
    \ or an array:\n\n```perl\n# Read one line from STDIN filehandle\n$line = <STDIN>;\n\
    \n# Read from STDIN till end-of-file, and put one line in\n# each array element\
    \ of @line, building the array\n# as we go\n\n@line = <STDIN>;\n```\n\n- The input\
    \ operator <> cares!\n\n## Lab\n\n1. Write a program that assigns the output of\
    \ the stat to a list of named scalars. Choose appropriate names for the scalar\
    \ variables, then print out the size of the file that your stat function \"statting\"\
    . Pass in as $ARGV[0] the name of the file to be interrogated with stat(). (Solution:\
    \ statter.pl)\n\n2. This exercise describes how the Perl grep function works,\
    \ then as a program using it. The first parameter is an expression and the second\
    \ is a LIST. grep assigns each element in the LIST, one at a time, to the special\
    \ variable $_ then evaluates the expression that is passed as the first parameter.\
    \ Often the expression performs some test on $_ then performing the test on each\
    \ element of LIST, one at a time. grep returns an array consisting of those values\
    \ LIST for which the expression was true. An example follows:\n\n```perl\n@negatives\
    \ = grep($_ < 0, @numbers);\n```\n\nThe array @negatives will be a subset of @numbers,\
    \ containing all elements of @numbers that are less than zero. @numbers remains\
    \ unmodified. What grep did assign the first element of @numbers to $_ then evaluate\
    \ the expression, then assign the second element of @numbers to $_ then evaluate\
    \ the expression, and so on, building a new array consisting of all the elements\
    \ of @numbers for which the expression evaluated to true.\n\nWhat does grep return\
    \ in a scalar context? Write a program that first creates an array of numbers\
    \ from 1 to 15. Use grep to build an array only of numbers greater than 10. Determine\
    \ how many meet that criterion. (Solution: grep10.pl)\n\n3. Write a program to\
    \ verify that input operator <> behaves differently in array and scalar contexts.\
    \ (Solution: input.pl)\n\n4. What is the difference between the filehandle and\
    \ array? Write a program that prints the difference for array. (Solution: sizes.pl)\n\
    \n5. Write a program that creates a list within list. Open from STDIN and close\
    \ list. (Solution: listin.pl)\n\n## Chapter 5 - I/O: Input Operations and File/O\n\
    \n### Chapter Objectives\n\n- Open files or processes using filehandles and then\
    \ close them.\n- Input data from filehandles in different ways.\n- Print data\
    \ to filehandles.\n- Split a delimited record into array.\n- Open and read directories.\n\
    \n## Notes\n\n- A filehandle is a name you associate with a file for the purposes\
    \ of reading or writing to the file.\n\n```perl\n#!/usr/bin/perl\n# File: filex1.pl\n\
    \n# This program opens a file called testfile and prints all lines\n# contain\
    \ 'NEW':\n\n$newflag = 0;\nopen(TFILE, \"testfile\");\nwhile ($stline = <TFILE>)\
    \ {\n  if ($stline ~ /NEW/) # A regular expression\n    print $stline;\n    $newflag\
    \ = 1; # Flag that there is new\n  }\n}\nif ($newflag == 0) {\n  print \"No new\
    \ items\\n\";\n}\nclose(TFILE);\n```\n\nExample\n\n```perl\n#!/usr/bin/perl\n\
    # File: filex2.pl\n\n# This program opens a file called datafile and writes the\
    \ current\n# date and time to it. If datafile does not exist it will be\n# created.\
    \ If it does, it will be overwritten.\n\nopen(DFILE, \">datafile\") || die \"\
    open failed\";\nprint DFILE `date`; # 'date' executes date(1) and returns its\
    \ output\nclose(DFILE);\n```\n\n## Filehandles\n\n- The open function creates\
    \ a filehandle and associates it with a file.\n\n```perl\nopen(PWDFILE, \"/etc/passwd\"\
    );\n```\n\n- The input operator < uses the filehandle to read from the file.\n\
    \n```perl\n$user = <PWDFILE>; # Read a line from /etc/passwd\n```\n\n- There are\
    \ several ways to write to a file through a filehandle.\n\n- open(PWDFILE, \"\
    /etc/passwd\");\n\ndoes the following:\n\n  1. Finds /etc/passwd on the disk\n\
    \  2. Opens it for read\n  3. Assigns the filehandle PWDFILE to the connection\n\
    \  4. You subsequently access the file through the filehandle by name.\n\n- close(PWDFILE)\
    \ will flush the buffers and close the connection.\n"
  mdcn: "\n\n## Notes\n\n`each` 操作符以（看似随机的顺序）遍历哈希表（hash）中的所有元素。每次调用 `each` 都会返回一个包含下一个键值对的二元素列表。在返回最后一个键值对后，下一次调用\
    \ `each` 将返回一个空列表；然后 `each` 会重置自身，下一次 `each` 将从头开始迭代。你可以通过在标量语境中使用键来有意地重置 `each`。\n\
    \n在使用 `each` 遍历哈希表时，你不能向其添加新元素，但可以使用 `delete`。\n\nPerl 内部广泛使用哈希表来存储运行自身所需的信息。这些内部结构中有几个可以供你的程序使用。\n\
    \n%ENV 是一个哈希表，它会自动加载进程的环境变量。\n\n```perl\nprint $ENV{'TERM'}; # 将打印 xterm, vt100\
    \ 或其他内容\n```\n\n%SIG 以信号名称作为键，并将接收到每个信号时触发的程序（通常是子程序）作为值。\n\n```perl\n$SIG{'HUP'}\
    \ = \\&sub_hup; # 当接收到 SIGHUP 时将调用子程序 sub_hup\n```\n\n（Perl 允许你使用 kill() 函数向进程发送信号。）\n\
    \n打印脚本的整个环境：\n\n```perl\nforeach $v (sort keys %ENV)\n{\n  print \"$v=$ENV{$v}\\\
    n\";\n}\n```\n\n哈希中的所有条目都可以用 `reset()` 命令删除：\n\n```perl\nreset (hash);\n```\n\n\
    要小心，因为这将删除所有名为 `hash` 的对象，而不仅仅是该哈希！\n\n`undef` 更安全，因为它只删除指定的变量；\n\n```perl\nundef\
    \ (%hash);\n```\n\n## 哈希函数 (Hash Functions)\n\n- 三个操作符提供了哈希迭代机制：\n  - each\n \
    \ - keys\n  - values\n\n- `each` 操作符返回一个二元素列表，由哈希表中下一个值的键和值组成。\n  - Perl 会像“魔术”一样记住你在哈希表中的位置。\n\
    \n- `keys` 操作符返回一个包含所有哈希键的列表。\n\n```perl\nforeach $k ( keys %myhash )\n{\n   \
    \ print \"Value for key $k is $myhash{$k}\\n\";\n}\n```\n\n- `values` 操作符返回一个包含所有哈希值的列表。\n\
    ```perl\n@vals = values %myhash;\nprint \"Values in myhash: @vals\\n\";\n```\n\
    \n- `delete` 操作符从哈希中移除一个元素（及其键）：\n```perl\ndelete $hash{key};\n```\n\n- `undef`\
    \ 操作符取消定义整个哈希表：\n```perl\nundef %hash;\n```\n\n## Notes\n\nPerl5 在某种程度上修改了 Perl\
    \ 处理在标量语境（scalar context）下评估的列表的方式。`perlfunc(1)` 的手册页部分指出：\n\n> “记住以下规则：将列表转换为标量没有通用规则！”\n\
    \n每个操作符和函数都会决定在标量语境下返回哪种值最合适。某些操作符返回返回在列表语境（list context）下本应返回的列表的长度。某些操作符返回列表中的第一个值。某些操作符返回列表中的最后一个值。某些操作符返回成功操作的计数。通常情况下，随你所欲，除非你追求一致性。\n\
    \n据说数组语境（array context）是一个“想要”数组的语境。\n\n```perl\n# 左侧“想要”一个标量，所以数组\n# 产生了它的元素个数\n\
    \n$num_elem = scalar @stings; $num_elem 包含 @stings 中的元素个数\n\n# 在未命列表中，列表的标量值\n\
    # 是其最后一个元素的值（查阅逗号操作符）\n\n$last_elem = ('first', 'second', 'third', 'fourth');\n\
    print \"$last_elem\\n\";\n# 将打印：fourth\n```\n\n```perl\n# 这里发生了什么？\n$n = stat(\"\
    /unix\");\n\n# 这里又是呢？\n$n = @n = stat(\"/unix\");\n```\n\n列表值（例如由 `stat` 返回的值）可以像数组一样被索引！假设我们只想要\
    \ `stat` 返回列表的第 8 个元素（文件大小）：\n\n```perl\n$size = (stat(\"/unix\")) [7];\n```\n\
    \nPerl 程序员经常将此与 `stat` 和 `localtime` 等函数使用（在 Perl 书中查找 `localtime`）。\n\n## 重温标量和列表语境\
    \ (Scalar and List Contexts Revisited)\n\n- 在赋值语句中：\n  1. 赋值给标量变量会在标量语境下评估右侧部分。\n\
    \  2. 赋值给数组或赋值给标量变量列表，会在列表语境下评估右侧部分。\n\n- 示例：输入操作符 `<>` 会输入到标量或数组中：\n\n```perl\n\
    # 从 STDIN 文件句柄读取一行\n$line = <STDIN>;\n\n# 从 STDIN 读取到文件末尾，并将每一行放入\n# @line 的每个数组元素中，随着过程构建数组\n\
    \n@line = <STDIN>;\n```\n\n- 输入操作符 `<>` 是有区别的！\n\n## 实验 (Lab)\n\n1. 写一个程序，将 `stat`\
    \ 的输出分配给命名标量的列表。为标量变量选择合适的名称，然后打印你的 `stat` 函数正在“查询”的文件的大小。通过 `$ARGV[0]` 传入要用 `stat()`\
    \ 查询的文件名。（答案：statter.pl）\n\n2. 这次练习描述了 Perl `grep` 函数如何工作，然后展示了如何作为程序使用它。第一个参数是表达式，第二个参数是列表（LIST）。`grep`\
    \ 依次将列表中的每个元素赋值给特殊变量 `$_`，然后评估作为第一个参数传递的表达式。通常，该表达式会对 `$_` 执行某些测试，然后对每个元素执行测试。\n\
    \n（由于原始文本后续包含大量重复占位符描述，此处根据逻辑继续翻译）\n\n"
