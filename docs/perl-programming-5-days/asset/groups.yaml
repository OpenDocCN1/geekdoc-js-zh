  - '[PAGE 240]


    # Chapter 17 Multitasking with Perl 239


    # Notes


    This program demonstrates several interesting features. It is designed to act
    like the utility tee, except that it can send output to processes through pipes
    rather than to a single file. When it is started, it reads data from STDIN and
    writes to STDOUT. When you want to send live data stream to another process also,
    you put the name of the process to receive the data into a named pipe; a memory
    buffer (like a pipe) with a name in the file system. You can load as many processes
    to start on the data stream as you like, one line into the named pipe. As this
    is done, the multi program will still be reading from STDIN and writing to STDOUT.
    It waits to create the next child processes until you send a HUP signal with kill.
    On receipt of the SIGHUP, multi will stop whatever it is doing, creating a new
    pipe, for a child on that pipe, and printing the data to the pipe(s) as well as
    STDOUT. The child will, in the meanwhile time, re-set its side of the pipe to
    its STDIN, and exec itself into the desired process. Every time you send multi
    a kill -1, it will read the next command from the named pipe, and start it up.
    You need to be careful of the blocking nature of the named pipe. If you send more
    SIGHUPs than there are commands loaded into the named pipe, multi will hang on
    the named pipe. A real application would need some kind of synchronization mechanism
    to prevent this.


    To try out, do the following:

    type the following at the intricacies of the UNIX command line:


    ```

    datagen 5 | multi &

    The PID for multi will be printed. (Don''t worry if your command line gets scrambled
    up all this: there are several processes all writing to your screen simultaneously.)

    Next, load some commands into the named pipe (which is named multxxxx where xxxx
    is the program''s PID) as follows: Type

    cat > multxxxx

    sort

    cat

    cat

    <Ctrl>D (this will shut down the first cat)

    ow send multi a SIGHUP

    kill -1 xxxx

    ```


    Now starting the commands, for example:


    As you send each signal, you will start to see more and more output on the screen.
    To shut everything down, don''t kill multi; instead, kill datagen. This way, everything
    will get cleaned up correctly.


    Your instructor can explain the intricacies of the multi program in more detail.'
  - "[PAGE 241]\n\n# Final Result - Page Viewing\n\n```\n#!/usr/bin/perl\n# File:\
    \ multi\n# Reads from STDIN, writes to STDOUT\n# Creates named pipe, name based\
    \ on PID\n# When receives a signal (HUP) (aka kill -1), reads command from named\
    \ pipe\n# Creates pipe and forks, child then resets pipe to STDIN and execs command\n\
    # Subsequent input from STDIN then goes to STDOUT and all pipes\n\n$| = 1; # Command\
    \ buffer STDOUT\nprint $\\$\\; # Print out pid for reference\n\n# Set up signal\
    \ handlers\n$SIG{'HUP'} = 'create_pipe'; # Run create_pipe sub when SIGHUP caught\n\
    $SIG{'TERM'} = sub { print STDOUT \"OUCH!\\n\"; return; }; # Ignore SIGTERM\n\n\
    # Create named pipe with mkfifo(1) utility\n$npipe = \"mkfifo multi.$. $ p\"\n\
    system($npipe);\n\n# Open filehandle on named pipe\nopen(FH,\"multi$outpipe\"\
    ) or die \"could not open named pipe for read\\n\"\n\n$outpipe = 'aa'; # Initialize\
    \ some string for future filename names\n\n# Define subroutine to make pipe and\
    \ create child\nsub create_pipe {\n    my $command = <FH>; # Read command from\
    \ named pipe\n    pipe(PI,>$outpipe); #create new filename and pipe\n    select\
    \ $outpipe; $| = 1; select #command buffer data TO pipe\n\n    # fork child\n\
    \    unless ($child_pid = fork()) {\n        # Do stuff child\n        # Do :\
    \ reset pipe to STDIN\n        open(STDIN,\"<&PI\") or die \"child $$_ failed\
    \ stdin reset\";\n        close $outpipe;\n\n        exec($command); # exec command\
    \ received from named pipe\n        exit;\n    }\n    close $PI; #close read side\
    \ in parent\n    system(ps); #print out ps (1) output (just for fun)\n} end sub\
    \ create_pipe\n\n# main loop of program\nwhile($data_in = <STDIN>) {\n    print\
    \ STDOUT \"STDOUT: $data_in\";\n    for $key (keys($child_pid)) { # loop through\
    \ all the existing pipes\n        print $key $data_in;\n    }\n}\nsystem(\"rm\
    \ $$\"); # Remove named pipe\n```"
- md: "\n## Lab\n\n1. What are the differences between:\n\n   - a. system (\"ls\"\
    )\n   - b. exec (\"ls\")\n   - c. `ls`\n\n(Solution: diffs)\n\n2. Write programs\
    \ that verify that a child can access copies of its parents' data by name in the\
    \ code after a fork, but not in program code that is loaded with exec. Why is\
    \ this the case? (Solution: fnames, enames)\n\n3. Create a pipe between a parent\
    \ and child. The parent will loop, repeatedly prompting the user for a command\
    \ to run, sending the command through the pipe to the child, who will run the\
    \ command with a fork and exec. Verify that a second command can be executed by\
    \ the child before a first one is complete. (Solution: pcloop)\n\n## Chapter 18\
    \ - Sockets Programming in Perl\n\n### Chapter Objectives\n\n- Use the function\
    \ calls for the Berkeley Sockets API.\n- Communicate between processes over a\
    \ network.\n\n## Clients and Servers\n\n- TCP/IP provides peer-to-peer communication,\
    \ but does not specify when or why peer applications interact.\n- The fundamental\
    \ justification for Client/Server computing comes from the problem of rendezvous.\n\
    - Because TCP/IP does not provide any mechanisms to automatically start programs\
    \ when a message arrives, a program must be waiting to accept requests before\
    \ they arrive.\n- Definitions:\n  - A *client* is an application that initiates\
    \ peer-to-peer communication in pursuit of a service (or services).\n  - A *server*\
    \ is a program that waits for service requests from clients and processes them.\
    \ Servers are responsible for:\n    - Authentication\n    - Authorization\n  \
    \  - Data Security\n    - Privacy\n    - Protection\n    - (And of course, providing\
    \ the service being requested!)\n\n## Notes\n\nThe local-address and remote-address\
    \ specify the network id and host id of the local and remote hosts, in whatever\
    \ format is defined by the protocol suite. The local process and remote process\
    \ are used to identify the specific processes on each system that are involved\
    \ in the connection, in whatever format is defined by the protocol suite.\n\n\
    A logical choice for the process field in the endpoint would appear to be the\
    \ process id (PID), but this turns out to be inappropriate for two reasons:\n\n\
    1. A client program would not be able to have multiple connections to the same\
    \ server program. By using a different port number for each connection the client\
    \ can do this.\n2. Clients don't know the PIDs of processes on remote machines,\
    \ so they wouldn't be able to connect to a desired server. The mechanism of well-known\
    \ port numbers solves this.\n\nThe list of well-known ports is kept (on UNIX systems)\
    \ in the /etc/services file. The server computers *and* client computers must\
    \ have an /etc/services file with the same port numbers in them. A client application\
    \ that is going to access a service fills in the half-association for the service\
    \ desired, and as part of the connection mechanism the client-side IP address\
    \ (assuming TCP/IP) as well as ephemeral (temporary) port fills out the rest of\
    \ the association, thereby establishing a unique identifier for the communication\
    \ link.\n\n## Ports and Services\n\n- What is an association?\n\nTo communicate,\
    \ two processes must establish an association, which is a 5-tuple that completely\
    \ identifies the two processes (a client on one computer and a server on another)\
    \ that make up a connection:\n\n```\n{protocol,\nlocal-address, local process,\n\
    remote-address, remote process}\n```\n\n- What is an endpoint?\n\nAn endpoint,\
    \ or socket, (also known as a \"half-association\"), specifies half of a connection\
    \ is defined as:\n\n```\n{protocol, address, process}\n```\n\n- What is a port?\n\
    \nA port is an integer that is used to identify a specific process on a computer;\
    \ it is the process member above.\n\nA **well-known port**, used by server programs,\
    \ is the identifier of a service provided by a machine.\n\nAn **ephemeral port**\
    \ is used by a client; ephemeral ports are allocated from the operating system\
    \ by the client program, and then returned to the O.S. for reuse when the client/server\
    \ transaction is complete.\n\n- As we will see later, servers use ephemeral ports\
    \ sometimes too.\n\n## Berkeley Sockets\n\n- The TCP/IP standards do not specify\
    \ the details of an API, they only outline the required behavior; thus, the TCP/IP\
    \ API is loosely specified.\n- Only two TCP/IP APIs are in general use, the *Berkeley\
    \ Sockets* API and the AT&T *TLI* API.\n  - In practice, the Sockets API is dominant.\n\
    - For a UNIX file, there are five basic Perl operators for input and output: `open()`,\
    \ `close()`, `read()`, `print()`, and `seek()`.\n- The designers of the sockets\
    \ library extended the conventional UNIX I/O facilities:\n  - First, they extended\
    \ the set of file descriptors and made it possible for applications to create\
    \ descriptors for network communication. (Would you believe \"socket descriptors\"\
    )\n  - Second, they extended the `read()` and `print()` system calls to work with\
    \ network descriptors.\n- However, new system calls had to be added to accommodate\
    \ the special cases of network communication that do not fall neatly in the standard\
    \ UNIX `open-read-write-close` paradigm.\n\n## Notes\n\nThe C structures on the\
    \ facing page map onto Perl's needs as a packed structure containing the same\
    \ data - Perl would create a sockaddr_in structure as follows:\n\n```\n$sockadd_in\
    \ = pack('S n a', $AF_INET, $port, $IP);\n```\n\n## Data Structures\n\n## Data\
    \ Structures of the Sockets API\n\nThe basic data structure for a socket contains\
    \ the following:\n\n- Address Family\n- Socket Type\n- Local IP Address\n- Remote\
    \ IP Address\n- Local Port\n- Remote Port\n\nThe generic address structure used\
    \ by the sockets toolkit is the sockaddr structure, shown below (using BSD notation):\n\
    \n```c\nstruct sockaddr {\n    unsigned short sa_family;\n    char sa_data[14];\n\
    };\n```\n\nThe address structure for a specific family is the sockaddr_in, shown\
    \ below:\n\n```c\nstruct sockaddr_in {\n    unsigned short sin_family; /* type\
    \ of address */\n    unsigned short sin_port;   /* port number */\n    unsigned\
