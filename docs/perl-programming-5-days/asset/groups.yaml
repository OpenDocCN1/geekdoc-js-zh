  - "[PAGE 198]\n\n# Substrings\n\n+   - You can group parts of a RE with parentheses.\n\
    \n+   - The characters matched by a portion of an RE which is in parentheses is\
    \ called a *substring*, and is tucked away by Perl for for or later reference.\n\
    \nIf a substring is matched, its value is stored in the Perl special variable\
    \ `$1.\n\n```\nm/(B[ao]r?b) Dobbs;      # If \"Barb Dobbs\" or \"Bob Dobbs\"\n\
    \                             # (or \"Borb\" or \"Dobbs\") is\n              \
    \               # found, save firstname in $1.\n```\n\nAdditional substrings,\
    \ left-to-right, will be in $2, $3, $4, etc.\n\n+   - Change \"script\" and \"\
    program\" to\n# \"script file\" and \"program file\"\nwhile(<()>) {\n  s/(script|program)/$1\
    \ file/g;\n  print;                # Print all lines\n}\n\n```\n# Swap first and\
    \ last characters on line\nwhile(<()>) {\n  s/^(.).*)(.).*)$/$3$2$1/\n  print;\n\
    }\n```\n\n+   - The Perl special variables $1, $2, ... are set to the substrings\
    \ found in the **last** RE evaluated!"
