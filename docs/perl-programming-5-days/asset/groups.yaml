  - '[PAGE 147]


    # References


    +   - Any scalar variable can hold a *reference*.


    +   - A reference (sometimes called a *hard* reference) is a scalar whose value
    is the address at which another variable''s value is stored, and the type of the
    other variable.


    +   - A *symbolic* reference is a scalar whose value is the name of another variable.


    +   - Hard references must be created with explicit mechanisms and dereferenced
    with explicit mechanisms.


    +   - Symbolic references must be dereferenced explicitly.


    +   - References are used in Perl for the same reasons that pointers are used
    in other languages; efficiency, performance, control, etc.'
  - '[PAGE 148]


    # Creating References


    +   - Use the unary backslash operator to create a hard reference


    ```

    $a = 6;

    $b = \$a; ("one","two","three\ # Create 3-element array

    $c_ref = \$c_arr; # Creates a reference to the array


    %d hash = ("one" => 1,"two" => 2,"three" => 3); #A hash

    $sub_ref = \%dhash # Creates a reference to the hash


    some_sub { return "hi"; } # A subroutine

    $sub_ref = \$some_sub; # Creates a reference to the sub

    ```


    +   - To create a symbolic reference, simply assign the entry which is to be the
    reference string value which is the name of another variable.


    ```

    $c = "a"; #Assign the string value "a" to the scalar "$c"

    print \$\$c, "\n"; # Prints 6

    ```


    +   - Using a typglob notation creates an "alias", NOT a reference


    ```

    *tg = \$a; # Creates a symbol table for $tg

    # which SHARES the same storage location

    # as $a. This is an alias.

    $tg = 1024; # changes the value of $a and $tg to 1024.

    # Note that no dereferencing was needed.

    ```


    +   - Any reference may be reassigned to point to something else or actually become
    a normal variable any later in the program.'
  - '[PAGE 149]


    # Notes


    To get the value referred to a variable that contains a reference, simply precede
    the entire variable name with the character associated with the type of the variable
    references. That is, a scalar variable name always starts with $; if a variable
    references a scalar, precede the entire name of the reference variable with a
    $:


    ```

    $cat = ''Meow.''; # $cat is a scalar.

    $scref = \$cat; # $scref is a reference to a scalar.

    print $$scref # Print the scalar referred to by $cat.

    ```


    If variables are an array, precede the entire name of the variable with a @.


    ```

    $speak = (''Meow.'', ''Woof!'', ''Ribbet.''); # $speak is an array.

    $speakref = @$speak; # $speakref is a reference to an array.

    print $$speakref # Print the array referred to by $speakref.

    ```


    Remember that each array element is a scalar, so to get the value of an array
    element by using a reference to the array, use:


    ```

    print $$speakref[2]; # Print the third element of the array

    # referred to by $speakref.

    ```


    # The Infix Dereference, or "Arrow", Operator


    If a reference variable refers to an array (or a hash), you can use an alternate
    syntax to get individual elements (infixed) of the array. It''s called the infix
    dereference operator, because it''s inserted (infix) between the reference variable
    name and the brackets; it looks like arrow:


    ```

    print $$speakref->[2]; # Print the third element of the array

    # referred to by $speakref.

    ```


    For a hash,


    ```

    %speak = (''cat'', ''Meow.'', ''dog'', ''Woof!'', ''frog'', ''Ribbet'');

    $speakref = \$speak; # $speakref is a reference to a hash.

    print $$speakref(''frog''); # Print the value for key ''frog''.

    print $$speakref->(''frog''); # Print the value for key ''frog''.

    ```


    Why? Why not. Find many this syntax easier to read. You''ll find it used much
    more than the other syntax.


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_149_0.png)'
