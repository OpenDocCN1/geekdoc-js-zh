  - "[PAGE 19]\n\n# Notes\n\nConsider the following Perl program:\n\n```\n```#!/usr/bin/perl\n\
    foreach (@ARGV) {\n    system(\"ls -ld $\\$_ -d\");\n}\n```\n```\n\nThe program\
    \ is Intended to be run with command line arguments that are file names. For each\
    \ file that is a directory, or an \"ls -ld\" command on that file.\n\n+   The\
    \ second line begins a 'foreach' loop that comprises the entire program. For each\
    \ iteration of the loop, the special variable $_ will be set (as a string) to\
    \ the next command line argument. The command line arguments are stored in the\
    \ special array called @ARGV.\n\n+   The loop consists of a single statement,\
    \ the third line of the program. The statement is conditional, with the 'if' syntactically\
    \ FOLLOWING a call to the system(). The system() function, if called, will pass\
    \ the string \"ls -ld $\\$_ to the operating system, which will execute the string\
    \ as a command.\n\nUnder what condition will the system() function be called?\
    \ Well, the pseudo-code for the entire program looks like this:\n\n```\n```for\
    \ each line argument:\nset the variable $_ to the string value of the argument\n\
    if the file named in $_ is a directory\n    call the system() function to execute\
    \ \"ls -ld $\"\n```\n```\n\nAlternatively:\n\n```\n```for each line argument:\n\
    set the variable $_ to the string value of the argument\ncall the system() function\
    \ to execute \"ls -ld $\\$_\"\nIf the file named in $_ is a\ndirectory\n```\n\
    ```\n\nA more verbose version of this program. It takes less advantage of Perl's\
    \ automatic actions, and is more explicit:\n\n```\n```#!/usr/bin/perl\nforeach\
    \ $file (@ARGV) {\n    if (-d $file) {\n        system(\"ls -ld $file\");\n  \
    \  }\n}\n```\n```\n\nThe second line uses the 'foreach' loop instead of 'for'\
    \ (they are equivalent) and it specifies the variable name that the foreach loop\
    \ to assign strings to, instead of implicitly assigning them to the special variable.\
    \ The variable name is $file. The dollar sign in $file variable name is part of\
    \ the variable name. It is not a dereference operator as in shell programming\
    \ and in awk. The test for 'directories' on the third line is similar to that\
    \ of the shell's test command. If the -d operator is not given an argument containing\
    \ a file, it will test the contents of the $_ variable, assuming that the contents\
    \ are the name of a file that might be a directory.\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_19_0.png)"
- md: "\n# Sample Program\n\n```perl\n#!/usr/bin/perl\n# File: prog.pl\n\nforeach\
    \ (@ARGV)\n{\n    system(\"ls -ld $_\") if -d;\n}\n```\n\n# Notes\n\nThis program,\
    \ `menu.pl`, displays a menu of user-selectable actions. The program executes\
    \ an infinite loop using the C-style `for(;;)` construct, waiting for the user\
    \ to type a choice. After performing the action chosen by the user, the program\
    \ clears the screen and replays the menu. The program terminates when the user\
    \ selects the menu choice.\n\nThe `system(clear)` function tells the operating\
    \ system to execute the `clear` command, just as if it had been typed on the keyboard.\n\
    \nThe line:\n\n```\n$choice = <STDIN>; chop $choice;\n```\n\nreads one line into\
    \ the variable `$choice` from the file identified by the file handle `STDIN`,\
    \ using the input operator `<`. The `chop` function chops off the newline character\
    \ that was read from `STDIN` and stored into `$choice`.\n\nThe line:\n\n```\n\
    last if $choice eq \"e\";\n```\n\nexits the `for` loop using the Perl control\
    \ flow statement `last` if the user chose. If we had not chopped the newline we\
    \ would have said:\n\n```\nlast if $choice eq \"\\n\";\n```\n\nAfter setting the\
    \ variable `$command` based on `$choice`, the `system()` function is called once\
    \ again to execute the command.\n\nFinally, the line:\n\n```\n<STDIN>;\n```\n\n\
    simply reads a line from the standard input. The intent is to wait for the user\
    \ to hit the `<Enter>` key before clearing the screen and redisplaying the menu.\
    \ The standalone `<STDIN>` actually reads one line and discards it.\n\nNote that\
    \ a semicolon must terminate each simple statement. A compound statement (a sequence\
    \ of simple statements, enclosed in braces) is not terminated with a semicolon.\n\
    \n# Another Sample Program\n\n```perl\n#!/usr/bin/perl\n# File: menu.pl\n\nfor\
    \ (;;) {\n    system(\"clear\");      # Clear the screen\n    print \"\\n\\n\"\
    ;\n    print \" l. List Files\\n\";\n    print \" p. Print Working Directory Name\\\
    n\";\n    print \" w. List Users Logged On\\n\";\n    print \" e. Exit Menu\\\
    n\";\n    print \"\\n\\n\";\n    print \" Enter choice: \";\n    $choice = <STDIN>;\
    \ chop $choice;\n    last if ($choice eq \"e\");\n\n    if ($choice eq \"l\")\
    \ { $command = \"ls\"; }\n    elsif ($choice eq \"p\") { $command = \"pwd\"; }\n\
    \    elsif ($choice eq \"w\") { $command = \"who\"; }\n    else { next; }\n\n\
    \    print \"\\n\\n\";\n    system($command);\n    print \"\\n\\n\";\n}\n\nprint\
    \ 'Hit <Enter> to continue:';\n\n<STDIN              # Wait for the enter key\n\
    ```\n\n# Notes\n\nThe @ARGV array holds the command line arguments. The foreach\
    \ loop assigns the value of the arguments to $word, one argument for each iteration\
    \ of the loop.\n\nThe line:\n\n```\nopen(PIPE,\"find . -print |\") || die \"Pipe\
    \ open failed\";\n```\n\nassigns the PIPE filehandle to be connected to output\
    \ of the pipe, and each time the input operator <> operates on the filehandle,\
    \ information is read from the pipe.\n\nThe line:\n\n```\n@files = <PIPE>;\n```\n\
    \nreads the entire output of the find command into the array $files, with one\
    \ line of output assigned to each element of the array. If the line had said:\n\
    \n```\n$files = <PIPE>;\n```\n\nthen only one line would have been read from the\
    \ pipe into the scalar variable $files. This is because of the difference between\
    \ an array context and a scalar context we will discuss later in great detail.\n\
    \nThe next loop will assign the array elements of $files to the scalar variable\
    \ $filename, one element at a time. This is exactly what the outer loop is doing\
    \ with the @ARGV array. The $filename variable will be set equal to a pathname\
    \ (one line of output from the find command) for each iteration of the loop.\n\
    \nthe chop operator (aka chop function) chops the last character of the string\
    \ in $filename, which will be a newline character, and then the -T test checks\
    \ if the file named in $filename is a text file. If so, then a handle named THIS\
    \ is created, the file is opened and associated with the open file.\n\nThe while\
    \ loop sets the value of the scalar variable $line equal to each line of the open\
    \ file by using the input operator <> on THIS, which reads a line from the file\
    \ it is executed. Note that $line is a scalar, so the context of the <THIS> operation\
    \ is a scalar context.\n\nThe line:\n\n```\nif ($line =~ /^\\$/);\n```\n\nchecks\
    \ the $line variable for the occurrence of the pattern in $word, which is the\
    \ current command line argument. The =~ is a pattern operator, and the /^\\$/\
    \ is a regular expression.\n\nFinally, note that in the print statement, even\
    \ the $filename and $line variables are enclosed in double quotes, their values\
    \ are still used. Perl calls this interpolation. A shell would call it \"weak-quoting\"\
    .\n\nA few words on handlers. In Perl, a file is associated with a filehandle\
    \ by calling the 'open' function. After a file is opened, all file operations\
    \ on it are done by referencing the filehandle. For example:\n\n```perl\nopen(BOOKFILE,\"\
    books\"); # Open file \"books\", associate with handle BOOKFILE\n$book = <BOOKFILE>;\
    \ # Use input operator <> to read a line\nclose(BOOKFILE);\n```\n\nRefer to the\
    \ Perl book for a description of the open function.\n\n# Yet Another Example\n\
    \n```perl\n#!/usr/bin/perl\n# File: dgrep.pl\n# A program to:\n# 1) open input\
    \ pipe\n# 2) find all files in the current directory\n# 3) subdirectories\n# 4)\
    \ print the names of text files\n# 5) that contain words\n# 6) specified on the\
    \ command line\n\nopen(PIPE,\"find -print |\") || die \"Pipe open failed\";\n\
    @files = <PIPE>;\nchop @files;\n\nforeach $word (@ARGV) {\n    foreach $filename\
    \ (@files) {\n        if (-T $filename) {\n            open(THIS,$filename) ||\
    \ die \"File open failed\";\n            while ($line = <THIS>) {\n          \
    \      if ($line =~ /$word/) {\n                    print \"$filename: $line\\\
    n\";\n                }\n            }\n            close(THIS);\n        }\n\
    \    }\n}```\n\n# Notes\n\nThere are currently different versions of Perl available\
    \ and in use: Perl4 and Perl5. This class concentrates on features which are common\
    \ to both, but also covers many of the features available only in Perl5.\n\nPerl5\
    \ added, among other things:\n\n- Changes in syntax.\n- Improved usability and\
    \ legibility by making cryptic variable names English-like.\n- Enhanced more useful\
    \ error and warning messages.\n- Extensibility like C++.\n- Reference variables\
    \ and the ability to create complex, nested data structures.\n- Object-Oriented\
    \ programming.\n\nAll this was done while making Perl5 mostly backwards-compatible\
    \ with Perl4. Things which you supposed to do in Perl4, Perl5 does not. We will\
    \ see many examples of these differences throughout the course.\n\n# Lab\n\n1.\
    \ What is the significance of the special variable $_?\n2. Write a program to\
    \ echo command line arguments (Solution: args.pl).\n3. What would happen in the\
    \ program dgrep.pl if we used the automatically set variable $_ in each of the\
    \ foreach loops instead of explicit variables $word and $filename?\n4. Modify\
    \ the program menu.pl so that it will prompt the user for a command and then execute\
    \ it (Solution: cmd.pl).\n5. Write a program that opens a file and loops to read\
    \ each line from the file into a variable and prints the variable to the screen,\
    \ prepending each line with its line number (Solution: liner.pl).\n\n# Chapter\
    \ 3 - Perl Variables\n\n# Chapter Objectives\n\n- Create and use the three native\
    \ data types (scalars, arrays, and hashes).\n- Take advantage of scalar vs. list\
    \ context.\n- Use the repetition operator in a scalar or list context.\n\n# Notes\n\
    \nRefer to the Perl book for discussions on arrays and lists.\n\n# Perl Programming\n\
    \n# Notes\n\nThe way Perl handles the difference between string and numeric data\
    \ is to define both a string value and a numeric value for variables, then wait\
    \ until use to see what type is required. For example, consider the use of the\
    \ numeric addition operator (a plus sign:+) versus the string concatenation operator\
    \ (a period:.).\n\n```perl\n$five = 5; $six = 6;\n$n = $five + $six;\n$s = $five\
    \ . $six;\nprint \"$n\\n\";\nprint \"$s\\n\";\n```\n\nOutput:\n\n```\n11\n56\n\
    ```\n"
