    \n```perl\nopen (INFILE, \"hot_data\") || die \"hot_data is ice cold\";\nnexti\
    \ = 0;\nwhile (<INFILE>) {\n    if (!^#/) { # 默认，对 $_ 进行正则搜索\n        push @hot,\
