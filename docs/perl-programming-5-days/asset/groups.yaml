    # Lab


    1. Write a program that assigns the output of the stat to a list of named scalars.
    Choose appropriate names for the scalar variables, then print out the size of
    the file that your stat function "statting". Pass in as $ARGV[0] the name of the
    file to be interrogated with stat(). (Solution: statter.pl)


    2. This exercise describes how the Perl grep function works, then as a program
    using it. The first parameter is an expression and the second is a LIST. grep
    assigns each element in the LIST, one at a time, to the special variable $_ then
    evaluates the expression that is passed as the first parameter. Often the expression
    performs some test on $_ then performing the test on each element of LIST, one
    at a time. grep returns an array consisting of those values LIST for which the
    expression was true. An example follows:


    ```

    @negatives = grep($_ < 0, @numbers);

    ```


    The array @negatives will be a subset of @numbers, containing all elements of
    @numbers that are less than zero. @numbers remains unmodified. What grep did assign
    the first element of @numbers to $_ then evaluate the expression, then assign
    the second element of @numbers to $_ then evaluate the expression, and so on,
    building a new array consisting of all the elements of @numbers for which the
    expression evaluated to true.


    What does grep return in a scalar context? Write a program that first creates
    an array of numbers from 1 to 15, then uses grep to build a second array consisting
    only of the numbers greater than 10. Also use grep to determine how many numbers
    meet that criterion. (Solution: great10.pl)


    3. Write a program to verify that the input operator <> when used to input from
    STDIN behaves differently in array and scalar contexts. (Solution: input.pl)'
