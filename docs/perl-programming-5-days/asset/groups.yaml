  - '[PAGE 110]


    # The Substitution Operator


    +   * The substitution operator ''s///'' behaves as a superset of the match operator
    ''m//''.


    +   * It searches a string for the pattern specified between the first two delimiters,
    and if it finds a match, it replaces the portion of the string that matched, with
    the replacement text specified between the second two delimiters.


    Example:


    ```

    # Replace Mom with Mother in $_

    s/Mom/Mother/g;

    ```


    +   * The trailing ''g'' in s/Mom/Mother/g says to replace ALL occurrences of
    Mom in $_, instead of only the first. (g means global)


    +   * The substitution string can contain Perl variables.'
  - '[PAGE 111]


    # Notes


    After reading the facing page, you may be wondering how to match a period. If
    you specify a period in a pattern, it doesn''t "stand for" or "mean" a period,
    it serves as a "wildcard" with special meaning. To match a literal period, you
    need to remove the special meaning of the period, i.e., to quote it. In an RE,
    you precede a metachar with a backslash to remove the metachar''s special meaning
    and make it stand for itself. To see if $_ has a period in it, you would say:


    ```

    if ( /\./ ) { ... };

    ```


    By the way, an unquoted period metachar does match a literal period too, because
    it matches any single character. But, if the match operator returns true, it could
    have been any character that caused the match, so if you specifically want to
    know if a period (or any other specific character, specifically) is in the string
    then you better go with a literal.


    An RE can consist of alternatives, which are REs separated by a vertical bar.


    If any of the alternatives match, then the RE matches.


    Examples:


    ```

    # Be more low key

    s/ardent|fervent|passionate/warm/g;


    # Capture in @codes all lines that start

    # with other than Ax or By

    @lines = <SOMEHANDLE>;

    @codes = grep(!^Ax^By/, @lines);

    ```'
  - '[PAGE 112]


    # Regular Expressions


    +   The patterns that we have been talking about are called *regular expressions*,
    abbreviated *RE*.


    +   REs provide a comprehensive syntax for specifying patterns of text.


    ```

    # Replace all five character sequences

    # that match: a space, then 00, then any

    # single character, then a space.

    / 00. /AGENT/g;

    ```


    +   The period does not match a period: rather it matches any character except
    ''\n''.


    +   The spaces and 00 are literals.


    +   The period is known as an *atom*, a *metacharacter*, or a *special character*.


    +   In an RE, the . matches any single character.


    +   REs are part of many UNIX utilities, such as `awk`, `sed`, and `vi`.


    +   Perl extends REs far beyond any of these.


    +   REs are actually easier to use than they might appear.'
  - '[PAGE 113]


    # Notes


    Perl RE Special Characters


    +   - . Matches any character except newline

    - [a-z0-9] Matches any single character of set

    - [^a-z-Z0-9] Matches any single character not in set

    - \d Matches a digit, same as [0-9]

    - \D Matches a non-digit, same as [0-9]

    - \w Matches an alphanumeric (word) character [a-zA-Z0-9_]

    - \W Matches a non-word character [^a-zA-Z0-9_]

    - \s Matches a whitespace char (space, tab, newline...)

    - \n Matches a newline

    - \r Matches a return

    - \t Matches a tab

    - \f Matches a formfeed

    - \b Matches a backspace (inside [] only)

    - \0 Matches a null character

    - \000 Also matches a null character

    - \nn Matches an ASCII character of that octal value

    - \xnn Matches an ASCII control character of that hexadecimal value

    - \cX Matches an ASCII control character <ctrl>X

    - \metachar Matches the character itself (\, \, \ \*)'
  - "[PAGE 114]\n\n# Special Characters\n\n+   * In an RE, a . matches *any* single\
    \ character (except newline)\n\n+   * You can narrow things down by using other\
    \ special characters.\n\n+   * \\w (word character) matches any character in the\
    \ set A-Z, a-z, 0-9, or _.\n  - \\W matches any character not in that set.\n\n\
    +   * \\s (whitespace character) matches a newline, carriage return, formfeed,\
    \ tab, or space character.\n  - \\S matches any non-space character.\n\n+   *\
    \ \\d (digit character) matches a digit, 0-9.\n  - \\D matches any non-digit character.\n\
    \nThe above are character classes; the generalized form of an RE class is a list\
    \ of characters in brackets, [].\n\n[A-Za-z_0-9] is the same as \\w.\n[\\n\\r\\\
    f\\t ] is the same as \\s.\n[0-9] is the same as \\d.\n\n+   * If the first character\
    \ after the opening [ is a caret, ^, then the character class matches any character\
    \ *not* listed.\n  - [^A-Za-z_0-9] is the same as \\W - any character other than\
    \ these.\n  - [^AEIOU ] matches any character that *isn't* a capital vowel."
  - "[PAGE 115]\n\n# Quantifiers (*, +, ?, {})\n\n+   * *Quantifiers* match a sequence\
    \ of a single character, of members of a character class, or of a subexpression.\n\
    * * is the least specific, matching any number, even zero, of its atom.\n* `\\\
    d*` matches any sequence of digits, or none at all.\n* `.*` is the general-purpose,\
    \ match-anything-at-all RE.\n* + matches one or more of its atom.\n* `\\d+` matches\
    \ a sequence of digits.\n* ? matches either zero or one of its atom; nothing else.\n\
    * You can specify any quantity of an atom in a RE using {}.\n  * `{n}` matches\
    \ exactly *n* occurances of an atom.\n    * `\\w\\d{4}\\s` matches a word character,\
    \ followed by exactly 4 digits, followed by a whitespace character.\n  * `{n,}`\
    \ matches *n* or more occurances of an atom.\n    * `\\w\\d{4,}\\s` matches a\
    \ word character, followed by at least 4 digits, followed by a whitespace character.\n\
    \  * `{n,m}` matches at least *n* but no more than *m* occurances of an atom.\n\
    \    * `\\w\\d{4,7}\\s` matches a word character, followed by 4, 5, 6, or 7 digits,\
    \ followed by a whitespace character."
  - '[PAGE 116]


    # Assertions (^, $, \b, \B)


    +   - Assert anchor a pattern to a specific location in a string.


    +   - ^ and $ anchor a pattern to the beginning or ending, respectively, of a
    string.


    /^s\d/ matches a line starting with s followed by a digit.


    /sh$/ matches a line ending with sh.


    +   - \b anchors a pattern to a word boundary.


    +   - A word boundary is simply a position with a word character (\w) on one side
    and a non-word character (\W) on the other.


    +   - \B matches a non-word boundary - a position with a word character (\w) on
    either side.


    # Notes


    What is matched by:


    ```

    /^[^\][] /

    ```'
