    \n- In a double-quoted string, we've seen the backslash character doing two things:\n\
    \  - Make a non-printable character (as in \\n or \\t)\n  - Turn on/off upper\
    \ or lower case (\\U, etc.)\n  - Backslash can also \"quote\" the next character:\n\
    \n```\nprint \"This is a double quote: \"\\n\";\nprint \"This is a backslash:\
    \ \\n\";\nprint \"The scalar is \\$see_me\\n\";\n```\n\n- In a single-quoted string,\
    \ no variable or backslash interpolation occurs.\n\n```\nprint 'Single quotes\
    \ leave $'var and \\n alone,\"\"\\n\";\nprint 'But, to see a backslash, double\
    \ up:\\,\"\\n\";\nprint 'And to see a single quote, backslash it:\\'\\n';\n```\n\
    \n# Notes\n\nA complex example of using command substitution is to run a ps command\
