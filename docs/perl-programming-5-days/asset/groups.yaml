    # 54 Perl Programming


    # Notes


    Perl5 has somewhat modified the way Perl handles lists evaluated in a scalar context.
    The man page for perlfunc(1) states, in part:


    > "Remember the following rule: There is no general rule for converting a list
    into a scalar!


    Each operator and function decides which it would be most appropriate to return
    in a scalar context. Some operators return the length of the list that would have
    been returned in a list context. Some operators return the first value in the
    list. Some operators return the last value in the list. Some operators return
    a count of successful operations. In general, do what you want, unless you want
    consistency.


    It is said that an array context is a context that "wants" an array.


    ```

    # Left side "wants" a scalar, so the array

    # produces its number of elements


    $num_elem = $stings; $num_elem contains number of elements in @stings


    # In an unnamed list, the scalar value of the list

    # is the value of its last element (read about the comma operator)


    $last_elem = (''first'', ''second'', ''third'', ''fourth'');

    print "$last_elem\n";

    # Will print: fourth

    ```


    ```

    # What happens here?

    $n = stat("/unix");


    # How about here?

    $n = @n = stat("/unix");

    ```


    A list value (such as that returned by stat) can be indexed just like an array
    can! Suppose we only want the 8th element (file size) of the list returned by
    stat:


    ```

    $size = (stat("/unix")) [7];

    ```


    Perl programmers often use this with functions like stat and localtime (look up
    localtime in the Perl book).


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_55_0.png)'
