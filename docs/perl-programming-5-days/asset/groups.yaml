    # Example - The @ARGV Array


    +   * Consider the array @ARGV, the list of command line arguments.


    $ARGV[0] is the first element

    $ARGV[$#ARGV] is the last element, because

    $#ARGV is the subscript of the last element of @ARGV

    * The facing page shows several constructs using the @ARGV array. These types
    of constructs will work with any array.

    * See the Perl book on the shift function.

    * Question: Why does the ''while'' loop eventually stop?

    * Answer: The while statement


    ```perl

    while (@ARRAY)

    ```\operates in a scalar context. @ARGV, in a scalar context, returns the number
    of elements in the array. The shift operator decrements that number each time
    it executes.

    * Perl5 supports multi-dimensional array syntax:


    ```perl

    $ARRAY[3][5] = "xyz";n```'
