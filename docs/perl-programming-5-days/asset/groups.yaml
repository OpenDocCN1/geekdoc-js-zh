  - '[PAGE 248]


    # Berkeley Sockets


    +   - The TCP/IP standards do not specify the details of an API, they only outline
    the required behavior; thus, the TCP/IP API is loosely specified.


    +   - Only two TCP/IP APIs are in general use, the *Berkeley Sockets* API and
    the AT&T *TLI* API.


    +     - In practice, the Sockets API is dominant.


    +   - For a UNIX file, there are five basic Perl operators for input and output:
    `open()`, `close()`, `read()`, `print()`, and `seek()`.


    +   - The designers of the sockets library extended the conventional UNIX I/O
    facilities:


    +     - First, they extended the set of file descriptors and made it possible
    for applications to create descriptors for network communication. (Would you believe
    "socket descriptors")


    +     - Second, they extended the `read()` and `print()` system calls to work
    with network descriptors.


    +   - However, new system calls had to be added to accommodate the special cases
    of network communication that do not fall neatly in the standard UNIX `open-read-write-close`
    paradigm.'
