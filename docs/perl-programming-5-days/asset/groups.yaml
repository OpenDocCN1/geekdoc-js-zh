  - '[PAGE 181]


    # Notes


    What would the objects in a Name & Address Book application be? Let''s name some:


    A person is an object. You might describe a person as a group of other objects.


    A person has a name, one or more addresses, one or more phone numbers, a SSN,
    physical description, etc.


    A name is an object. It has last, first, and middle components. An address is
    an object. It has a street name and number, apt/suite, city, state, and zip.


    A phone number is an object. It has an area code, prefix, and suffix. It may also
    include an extension or PIN number, etc.


    A SSN is just a number, so would probably not be an object.


    A description is an object. It may have height, weight, eye color, hair color,
    etc.'
  - '[PAGE 182]


    # What is Object-Oriented?


    +   - Object-Oriented Analysis and Design (OOA&D) is the process of designing
    and implementing a solution from a “data” perspective rather than a “process flow”
    (procedural) perspective.


    +   - Think in terms of “What am I manipulating?” rather than “What do I need
    to do?”


    +   - *Objects* represent “things”. For example, a radio.


    +   - Object *data* (or *attributes* or *fields*) are what describe an Object.
    A radio has a current volume, current station, it is on or off, etc.


    +   - Object *methods* are what you can do with/to an Object. Turn radio on/off,
    adjust volume, select station, etc.


    +   - A *Class* is the formal description of an Object and includes its name,
    its attributes (data), and what you can do with/it (methods)


    +   ☐ A Class is not a thing, but the description of a thing.


    You might describe your radio to a friend by telling them the brand name, how
    many megawatts of output it can produce, and all the nifty features it has. This
    is just the description. The Object (radio), is the “thing” you ask your friend
    to help you install in your car.


    +   - Object-Oriented Programming (OOP) is the process of implementing the Object-Oriented
    (OO) paradigm in a programming language (Perl, in our case) to solve a particular
    programming task.'
  - '[PAGE 183]


    # Notes


    Many applications within your company may require a "name" object, an "address"
    object, and all the rest mentioned mentioned earlier. If care has been taken to
    make these classes general in nature, downstream development based on them can
    be much, much, faster and maintainence should be much easier.


    Be sure to "publish" your classes, document them, and get them into a class library
    so that others may use them. Providing a repository of these classes/ modules
    is a basic must in effectively implementing an OO solution within your company.


    Remember!


    Reusability is a major thing we''re looking for in the OO model. You may develop
    a solution using the OO method without reusability in mind. Developing the initial
    classes and/or modules can be a tedious task to do properly and may actually take
    longer than to solve the current problem in a procedural manner. Creating classes
    that can be reused by other developers in the future or that make maintainence
    more efficient is where the real payback is.'
  - '[PAGE 184]


    # Why Use Object-Oriented Programming?


    +   - Data encapsulation.


    The data which belongs to each object is accessible only through the "public interface"
    for class. The public interface is the documented way (methods) to use the object.
    Perl does not enforce data encapsulation but the developer is encouraged to provide
    a well documented interface so that downstream developers may use these objects
    easily easily. Don''t publicly document the "private data" or "private methods".


    +   - Speed application development time.


    If implemented effectively, an Object-Oriented solution will help speed later
    application efforts which might use the same objects. Many pre-defined objects
    are available to the developer in the form of class libraries or, in Perl''s case,
    modules. The developer may inherit much of what is needed from these classes.
    This is reusability.


    +   - Ease maintenance overhead.


    If a change needs to be made to all of the objects of a particular class, the
    change need only be made in the class definition or the implementation of the
    methods. The user interface need not (should not, if possible) change.


    +   - Intuitve.


    Once you begin learning and implementing solutions using the OO paradigm, you
    will probably find it more intuitive than procedural development.'
- md: "\n## 184 Perl Programming\n\n### Notes\n```perl\n#!/usr/bin/perl\n#File: Name.pl\n\
    \npackage Name; # The name of a class\n\nsub new (# class method to create and\
    \ return the reference to the \"object\")\n    my $Class = shift @_; # first argument\
    \ provided automatically by Perl\n    $this = {}; # create a reference to an anonymous\
    \ hash\n    bless $this, $Class; # bind the reference to the package (class) \"\
    Name\"\n    return $this; # return the reference to the caller\n\nsub last_name\
    \ (# instance method)\n    my $this = shift @_; # get the reference to the object\
    \ which invoked me\n    $this->{last_name} = shift @_; # assign objects instance\
    \ data\n\nsub first_name (# instance method)\n    my $this = shift @_; # get the\
    \ reference to the object which invoked me\n    $this->{first_name} = shift @_;\
    \ # assign objects instance data\n\nsub get_name (# instance method)\n    my $this\
    \ = shift @_; # get the reference to the object which invoked me\n    return $this->{last_name};\
    \ # return object's instance data\n\n1; # Return an arbitrary true value, so \"\
    require\" doesn't fail.\n```\n\nWe use this class in any program:\n```perl\n#!/usr/bin/perl\n\
    #File: namemain.pl\n\nrequire \"Name.pl\"; # Pull in the definition of the name\
    \ class\n\n$name1 = new Name;\n$name2 = new Name;\n$name1->last_name('Skywalker');\
    \ $name1->first_name('Luke');\n$name2->last_name('Leia'); $name2->first_name('Princess');\n\
    print $name1->first_name, \" \", $name1->last_name, \"\\n\";\nprint $name2->first_name,\
    \ \" \", $name2->last_name, \"\\n\";\n```\nThe above code generates the following\
    \ output:\n```\nLuke Skywalker\nPrincess Leia\n```\n\n## Classes, Objects, and\
    \ Methods in Perl\n\n- In Perl, a Class is simply a package which provides methods\
    \ to deal with objects.\n- In Perl, an Object is a reference to a \"thing\" which\
    \ knows it belongs to a particular package - the bless operator tells it which\
    \ package it belongs to.\n- The \"thing\" may be an anonymous hash, anonymous\
    \ array, or subroutine.\n- The new method returns a reference to a \"thing\",\
    \ typically an anonymous hash (an extensible data structure).\n- A Method is a\
    \ subroutine that expects an object reference as its first argument.\n- This argument\
    \ is provided automatically.\n\n### Notes\n```perl\n#!/usr/bin/perl\n#File: FormalName.pl\n\
    \nrequire \"Name.pl\";      # Pull in the definition of the Name class\n\npackage\
    \ FormalName;\nISA = qw(Name );        # The name of a new class\n# We say that\
    \ a FormalName \"is-a\" Name\n\nsub new {\n    my $class = shift @_;\n    $this\
    \ = new Name;      # Instead of creating another anonymous hash, we use the one\
    \ from Name\n    return bless $this, $class;\n}\n\nsub set_title {          #\
    \ adds a new instance method\n    my $this = shift @_;\n    $this->{title} = shift\
    \ @_;\n}\n\nsub get_title {          # adds a new instance method\n    my $this\
    \ = shift @_;\n    return $this->{title};\n}\n\n1; # Return an arbitrary true\
    \ value, so \"require\" doesn't fail.\n```\n\nWe can now use our new, inherited\
    \ FormalName class:\n```perl\n#!/usr/bin/perl\n#File: formalnamemain.pl\n\nrequire\
    \ \"Name.pl\";      # Pull in the definition of the FormalName class.\n\n$name1\
    \ = new FormalName;\n$name2 = new FormalName;\n$name1->last_name('Skywalker');\
    \ $name1->first_name('Luke');\n$name1->set_title(\"The Honorable\");\n$name2->last_name('Leia');\
    \ $name2->first_name('Princess');\n$name2->set_title(\"The Royal Highness\");\n\
    print $name1->get_title, \" \", $name1->first_name, \" \", $name1->last_name,\
    \ \"\\n\";\nprint $name2->get_title, \" \", $name2->first_name, \" \", $name2->last_name,\
    \ \"\\n\";\n```\nThe above code generates the following output:\n```\nThe Honorable\
    \ Luke Skywalker\nHer Royal Highness Princess Leia\n```\n\n## Inheritance, the\
    \ \"is-a\" Relationship\n\n- Inheritance is one of the most important features\
    \ in the OO model. It allows us to use part or all of another class's methods\
    \ and add others to make our new class unique - reusability!\n- In Perl, the descendant\
    \ class simply names its ancestor named ISA, and Perl will look in those classes\
    \ for methods not found in the descendant. The descendant should create an ancestor\
    \ object in its new.\n- Radio has buttons, a dial, and receiver.\n- Stereo has\
    \ controls for volume, station, and off, all the features of Radio.\n- Cassette\
    \ Player has controls for volume, station, play, fast forward, rewind, and eject.\n\
    \n### Notes\n```perl\n#!/usr/bin/perl\n#File: Employee.pl\n\nuse Name; # \"Name.pm\"\
    \npackage Employee; # The name of a base class\n\nsub new {\n    my $class = shift\
    \ @_; # first argument provided automatically by Perl\n    $this = {}; # create\
    \ a reference to an empty hash\n    bless $this, $class; # bind the reference\
    \ to the package (class) \"Employee\"\n    return $this; # return the reference\
    \ to the caller\n}\n\nsub initialize {\n    my $this = shift @_;\n    $this->{name}\
    \ = new Name; # Initialize instance data\n}\n\nsub set_ssn {\n    my $this = shift\
    \ @_;\n    $this->{ssn} = shift @_; # assign instance data\n}\n\nsub get_ssn {\n\
    \    my $this = shift @_;\n    return $this->{ssn};\n}\n\nsub display {\n    my\
    \ $this = shift @_;\n    return $this->{name}->get_name(), \" SSN: \", $this->get_ssn(),\
    \ \"\\n\";\n}\n```\nWe can use our Employee class:\n```perl\n#!/usr/bin/perl\n\
    #File: empmain.pl\n\nrequire \"Employee.pl\";\n$emp1 = new Employee;\n$emp2 =\
    \ new Employee;\n$emp1->last_name('Skywalker'); $emp1->first_name('Luke');\n$emp2->last_name('Leia');\
    \ $emp2->first_name('Princess');\n$emp1->set_ssn(\"333-33-334\");\n$emp2->set_ssn(\"\
    999-99-999\");\n$emp1->display();\n$emp2->display();\n```\nThe above code generates\
    \ the following output:\n```\nSkywalker, SSN: 333-33-334\nLeia, SSN: 999-99-999\n\
    ```\n\n## Containment, the \"has-a\" Relationship\n\n- Many objects have other\
    \ objects as data members - this is called containment.\n- An Employee record\
    \ may consist of simple data, like a Social Security Number, or contain more complex\
    \ constructs like our Name or FormalName class.\n- In this case, an employee record\
    \ \"has-a\" Name; a Name object would be a data member to the Employee object.\n\
    - Since the Perl compiler needs to check the containing class's use of member\
    \ object methods at compile time, the contained object should be a Perl Module:\
    \ a .pm, included with use.\n- In fact, to provide the greatest flexibility and\
    \ reuse, you'll define all your classes as Perl Modules.\n\n### Notes\n```perl\n\
    #!/usr/bin/perl\n#File: ovloadtest.pl\n\nuse FormalName; # use our FormalName.pm\
    \ module\n\n$name1 = new FormalName;\n$name1->set_title(\"Big Furry\");\n$name1->first_name(\"\
    Chew\");\n$name1->last_name(\"Bacca\");\n\n$name_2 = $name1; # Now $name2 points\
    \ to the same thing as $name1\nprint \"name_1: \", $name1->get_title(), \" \"\
    , $name1->first_name(), \" \", $name1->last_name(), \"\\n\";\nprint \"name_2:\
    \ \", $name2->get_title(), \" \", $name2->first_name(), \" \", $name2->last_name(),\
    \ \"\\n\";\n\n# Uncomment to reset name_2 to no longer point to same thing as\
    \ $name1\n# $name_2 = new FormalName;\n\n$name_2->set_title(\"Big Scarey\");\n\
    #$name_2->first_name(\"Darth\"); # Let's see what happens...\n$name_2->last_name(\"\
    Vader\");\n\nprint \"name_1: \", $name1->get_title(), \" \", $name1->first_name(),\
    \ \" \", $name1->last_name(), \"\\n\";\nprint \"name_2: \", $name2->get_title(),\
    \ \" \", $name2->first_name(), \" \", $name2->last_name(), \"\\n\";\n```\nThe\
    \ above code generates the following output:\n```\nname_1: Big Furry Chew Bacca\n\
    name_2: Big Furry Chew Bacca\nname_1: Big Scarey Chew Vader\nname_2: Big Scarey\
    \ Chew Vader\n```\n"
  mdcn: "\n\n## 184 Perl Programming\n\n### Notes\n```perl\n#!/usr/bin/perl\n#File:\
    \ Name.pl\n\npackage Name; # 类的名称\n\nsub new (# 用于创建并返回“对象”引用的类方法)\n    my $Class\
    \ = shift @_; # 自动提供的第一个参数\n    $this = {}; # 创建匿名哈希的引用\n    bless $this, $Class;\
    \ # 将引用绑定到包（类）\"Name\"\n    return $this; # 将引用返回给调用者\n\nsub last_name (# 实例方法)\n\
    \    my $this = shift @_; # 获取调用该方法的对象引用\n    $this->{last_name} = shift @_; #\
    \ 为对象分配实例数据\n\nsub first_name (# 实例方法)\n    my $this = shift @_; # 获取调用该方法的对象引用\n\
    \    $this->{first_name} = shift @_; # 为对象分配实例数据\n\nsub get_name (# 实例方法)\n  \
    \  my $this = shift @_; # 获取调用该方法的对象引用\n    return $this->{last_name}; # 返回对象的实例数据\n\
    \n1; # 返回一个任意真值，以便 \"require\" 不会失败。\n```\n\n我们在任何程序中使用此类：\n```perl\n#!/usr/bin/perl\n\
    #File: namemain.pl\n\nrequire \"Name.pl\"; # 引入 Name 类的定义\n\n$name1 = new Name;\n\
    $name2 = new Name;\n$name1->last_name('Skywalker'); $name1->first_name('Luke');\n\
    $name2->last_name('Leia'); $name2->first_name('Princess');\nprint $name1->first_name,\
    \ \" \", $name1->last_name, \"\\n\";\nprint $name2->first_name, \" \", $name2->last_name,\
    \ \"\\n\";\n```\n上述代码生成了以下输出：\n```\nLuke Skywalker\nPrincess Leia\n```\n\n## Perl\
    \ 中的类、对象和方法\n\n- 在 Perl 中，类（Class）仅仅是一个提供处理对象方法的包（package）。\n- 在 Perl 中，对象（Object）是对某个“东西”的引用，它知道自己属于某个特定的包——`bless`\
    \ 操作符告诉它它属于哪个包。\n- 这个“东西”可以是一个匿名哈希、匿名数组或子程序。\n- `new` 方法返回一个对“东西”的引用，通常是一个匿名哈希（一个扩展的数据结构）。\n\
    - 方法（Method）是一个期望将对象引用作为第一个参数的子程序。\n- 该参数是自动提供的。\n\n### Notes\n```perl\n#!/usr/bin/perl\n\
    #File: FormalName.pl\n\nrequire \"Name.pl\";      # 引入 Name 类的定义\n\npackage FormalName;\n\
    ISA = qw(Name );        # 新类的名称\n# 我们说 FormalName \"是一个\" (is-a) Name \n\nsub\
    \ new {\n    my $class = shift @_;\n    $this = new Name;      # 不再创建另一个匿名哈希，而是使用来自\
    \ Name 的那个\n    return bless $this, $class;\n}\n\nsub set_title {          # 添加一个新的实例方法\n\
    \    my $this = shift @_;\n    $this->{title} = shift @_;\n}\n\nsub get_title\
    \ {          # 添加一个新的实例方法\n    my $this = shift @_;\n    return $this->{title};\n\
    }\n\n1; # 返回一个任意真值，以便 \"require\" 不会失败。\n```\n\n我们现在可以使用新的、继承的 FormalName 类：\n\
    ```perl\n#!/usr/bin/perl\n#File: formalnamemain.pl\n\nrequire \"Name.pl\";   \
    \   # 引入 FormalName 类的定义。\n\n$name1 = new FormalName;\n$name2 = new FormalName;\n\
    $name1->last_name('Skywalker'); $name1->first_name('Luke');\n$name1->set_title(\"\
    The Honorable\");\n$name2->last_name('Leia'); $name2->first_name('Princess');\n\
    $name2->set_title(\"The Royal Highness\");\nprint $name1->get_title, \" \", $name1->first_name,\
    \ \" \", $name1->last_name, \"\\n\";\nprint $name2->get_title, \" \", $name2->first_name,\
    \ \" \", $name2->last_name, \"\\n\";\n```\n上述代码生成了以下输出：\n```\nThe Honorable Luke\
    \ Skywalker\nHer Royal Highness Princess Leia\n```\n\n## 继承与“是一个”关系\n\n- 继承是面向对象（OO）模型中最重要的特征之一。它允许我们使用另一个类的部分或全部方法，并添加其他方法使我们的新类独具一性——可复用！\n\
    - 在 Perl 中，后代类只需将其祖先类命名为 `ISA`，Perl 将会在这些类中查找后代类未找到的方法。后代类应该在其 `new` 方法中创建一个祖先对象。\n\
    - 收音机有按钮、旋钮和接收器。\n- 音响有音量、电台和关闭控制，包含了收音机的所有功能。\n- 磁带播放器有音量、电台、播放、快进、倒退和退出控制。\n\
    \n### Notes\n```perl\n#!/usr/bin/perl\n#File: Employee.pl\n\nuse Name; # \"Name.pm\"\
    \npackage Employee; # 基类的名称\n\nsub new {\n    my $class = shift @_; # Perl 自动提供的第一个参数\n\
    \    $this = {}; # 创建一个空哈希的引用\n    bless $this, $class; # 将引用绑定到包（类）\"Employee\"\
    \n    return $this; # 将引用返回给调用者\n}\n\nsub initialize {\n    my $this = shift @_;\n\
    \    $this->{name} = new Name; # 初始化实例数据\n}\n\nsub set_ssn {\n    my $this = shift\
    \ @_;\n    $this->{ssn} = shift @_; # 分配实例数据\n}\n\nsub get_ssn {\n    my $this\
    \ = shift @_;\n    return $this->{ssn};\n}\n\nsub display {\n    my $this = shift\
    \ @_;\n    return $this->{name}->get_name(), \" SSN: \", $this->get_ssn(), \"\\\
    n\";\n}\n```\n我们可以使用 Employee 类：\n```perl\n#!/usr/bin/perl\n#File: empmain.pl\n\
