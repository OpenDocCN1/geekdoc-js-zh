    \ .pm 文件中，并使用 use 运算符导入到主程序。每个 .pm 文件应该包含设置和获取该字段值所需的所有子程序。\n\n# 什么是面向对象？\n\n\
    - 面向对象分析设计 (OOA&D) 是从“数据”视角而非“过程”视角设计和实现解决方案的过程。\n\n- 以“我在操作什么？”而不是“我需要做什么？”来思考。\n\
    \n- *Objects* 代表“东西”。例如，一个 *data*（或 *attributes* 或 *fields*）是对象的。\n\n- *methods*\
    \ 是你可以对对象做的事情。\n\n- *Class* 是对对象的描述。\n\n- 这里的 *methods* 是你可以对对象做的事情。\n\n- *Class*\
    \ 是对对象的正式描述。\n\n- *Class* 是一个类，但它是对“东西”的描述。\n\n- 这里的 *Class* 是一个类的描述。\n\n- 面向对象编程\
    \ (OOP) 是使用编程语言（本例中为 Perl）来解决特定任务的过程。\n\n# Notes\n\n公司中的许多应用程序可能需要“姓名”对象、“地址”对象以及之前提到的其他内容。如果对这些类进行了通用性处理，基于此的开发将快得多，维护也应该更容易。\n\
    \n确保“发布”你的类，对它们进行文档记录，并将它们放入类库以便他人使用。在公司内部有效实现 OO 解决方案是基本要求。\n\n记住！\n\n可重用是我们在\
    \ OO 模型中寻找的主要特征。你可能在不考虑可重用的情况下使用 OO 方法开发解决方案。正确开发初始类/模块可能是一项任务，实际上可能比以过程方式解决问题花费长时间。\n\
    \n# 为什么要使用面向对象编程？\n\n- 数据封装。\n\n属于每个对象的数据仅可以通过类的“公共接口”访问。公共接口是使用对象的文档化方式（子程序）。Perl\
    \ 不强制执行数据封装，但鼓励开发者提供良好的文档接口，以便下游人员轻松使用这些对象。不要公开记录“私有数据”或“私有方法”。\n\n- 加速应用开发时间。\n\
    \n如果实现有效，面向对象的解决方案将有助于可能使用相同对象的后续工作。许多预定义对象以类库或在 Perl 中以模块的形式提供给开发者。开发者可以从这些类中继承大部分所需。这就是可重用。\n\
    \n- 减少维护开销。\n\n如果需要对特定类的所有对象进行更改，只需在类定义或方法的实现中进行更改。用户界面不需要（如果可能，应该）改变。\n\n- 直观。\n\
    \n一旦开始学习并使用 OO 范式实现解决方案，你可能会发现它比过程化开发更直观。\n\n"
