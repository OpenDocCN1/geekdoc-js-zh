  - "[PAGE 202]\n\n# RE Special Variables\n\n+   - In addition to the variables $1,\
    \ $2, etc., evaluation of an RE can set other special variables as well.\n\n+\
    \   - $+ returns whatever the last bracket (substring) matched.\n\n+   - && returns\
    \ the entire matched string.\n\n+   - $ returns everything before the matched\
    \ string.\n\n+   - '$' returns everything after the matched string.\n\n+   - +\
    \ is useful when you don't know which form an RE might match.\n\n+   - Example\n\
    \n```\n#!/usr/bin/perl\n# File: getac\n# Run: $ getac < telnos\n\n# Assume phone\
    \ number formats of:\n# (303) 841-7723\n# 303-841-7723\n# We can get the area\
    \ code as follows:\n\nwhile (<>) {\n\n    # A left paren, then 3 digits,\n   \
    \ # then a right paren, OR\n    # 3 digits then a -.\n\n    /(\\d{3})\\) | (\\\
    d\\\\d)-;/\n    $ac = $+; # $+ is the matched substring\n    print \"$ac\\n\"\n\
    }\n```"
  - '[PAGE 203]


    # RE Options


    +   - Perl provides a variety of options (or *modifiers*) to the pattern-matching
    operators.


    +   - List options after the pattern delimiters.


    +   - Ignore case in searches.


    +   m/dobbs/i Dobbs, dobbs, DOBBS, dobBS, **etc.**


    +   - All occurrences (**global**), not just the first found in the string.


    +   s/NT/UNIX/g Change *all* NT to UNIX.


    +   - Treat string being searched as a **multi-line buffer** (more on this a moment).


    +   - Evaluate expression and use its value in substitution (`s///e`).


    +   - Use extended (Perl 5.002+) regular expressions (stay tuned...)


    # Notes


    Remember any non-word character is valid as a pattern delimiter.


    ```

    m:dobbs:i

    m|dobbs|i

    m!dobbs!i

    ```


    Bracketing-characters `{}, []()` can make a pattern more readable.


    ```

    m{dobbs}i

    ```


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_203_0.png)'
  - "[PAGE 204]\n\n# Multiline REs\n\n+   You may use a single scalar variable to\
    \ hold several lines of text.\nn  - In general, a *line* is simply a string of\
    \ characters ending in a newline character.\n  - A scalar containing a string\
    \ with embedded newline characters can be called a *multiline* buffer.\n\n+  \
    \ Normally, ^ or $ match only the beginning or ending (before the first character\
    \ or after the last non-newline character, respectively) of the string being searched.\n\
    \n+   When you use the `m` modifier, ^ will match:\n  - The beginning of the string\n\
    \  - The position immediately after any newline character embedded in the string\
    \ (the beginning of the next \"line\").\n\n+   When you use the `m` modifier,\
    \ $ will match:\n  - The ending of the string.\n  - The position immediately before\
    \ any newline character embedded in the string (the end of the current \"line\"\
    ).\n\nRead the discussion of multiline vs. single-line REs in the Perl book."
  - "[PAGE 205]\n\n# 204 Perl Programming\n\n# Notes\n\nIf a pattern is contained\
    \ in parentheses, then whatever was matched by the RE inside the parentheses can\
    \ be referred to later. (What?)\n\nQuick, examples!\n\n```\n# Change \"script\"\
    \ and \"program\" to\n# \"script file\" and \"program file\"\nwhile(<>)\n{\n \
    \   s/(script|program)/$1 file/g;\n    print;      # Print all lines\n}\n```\n\
    \n```\n# Swap first and last characters on line\nwhile(<>)\n{\n    s/^\\(.).*)(.)$/$3$2$1/;\n\
    \    print;\n}\n```"
  - '[PAGE 206]


    # Substituting with an Expression


    +   - The s/// substitutes a replacement string for the matched data.


    ```

    s/\bBob(\s+[A-Z]\w*)/Barb$1;      # Replace name "Bob"

    # with "Barb"

    # preserving lastname.

    ```


    +   - The replacement string can contain literal text or Perl variables, including
    backreferences ($1, $2, ...).


    ```

    $rad = 73;

    $area = "Area is circlearea";

    $area ~ s/circlearea/$rad * $rad * 3.1415/

    print "$area\n";

    ```


    Output:


    Area is 73 * 73 * 3.1415


    +   - The e modifier causes Perl to


    +   1. Evaluate the replacement string as an expression.

    2. Convert its value to a string.

    3. Use the value for substitution.


    ```

    $rad = 73;

    $area = "Area is circlearea";

    $area ~ s/circlearea/$rad * $rad * 3.1415/e;

    print "$area\n";

    ```


    Output:


    Area is 16741.0535'
  - "[PAGE 207]\n\n# # Notes\n\nRegular Expressions\n\n+   * `[a-z0-9]` Matches any\
    \ character except newline\n* `\\w` Matches any single character of set\n* `[^a-z0-9]`\
    \ Matches any single character not in set\n* `\\d` Matches a digit, same as `[0-9]`\n\
    * `\\D` Matches a non-digit, same as `[^0-9]`\n* `\\w` Matches an alphanumeric\
    \ (word) character `[a-zA-Z0-9_]`\n* `\\W` Matches a non-word character `[^a-zA-Z0-9_]`\n\
    * `\\s` Matches a whitespace character (space, tab, newline...)\n* `\\S` Matches\
    \ a non-whitespace character\n* `\n` Matches a newline\n* `\r` Matches a return\n\
    * `\t` Matches a tab\n* `\\f` Matches a formfeed\n* `\b` Matches a backspace (inside\
    \ [] only)\n* `\\000` Also matches a null character\n* `\\onn` Matches an ASCII\
    \ character of that octal value\n* `\\knn` Matches an ASCII character of that\
    \ hexadecimal value\n* `\\cX` Matches an ASCII control character <ctrl>X\n* `\\\
    metachar` Matches the character itself (`\\`, `\\.`, `\\*`)\n\nGroup pattern elements\
    \ and remembers the match for later backreferences\n\n+   * `\\1` Matches whatever\
    \ first of parens matched\n* `\\2` Matches whatever second of parens matched\n\
    * `\\3` and so on...\n\n+   * `x?` Matches 0 or 1 x's, where x is any of above\n\
    * `x*` Matches 0 or more x's\n* `x+` Matches 1 or more x's\n* `{m,n}` Matches\
    \ at least m x's but no more than n\n\n+   * `abc` Matches all of a,b, and c in\
    \ order\n* `fee|foe` Matches one of one, fee, or foe\n\n+   * `\b` Matches a word\
    \ boundary (outside [] only)\n* `\\B` Matches a non-word boundary of a line or\
    \ string\n* `^` Anchors match to the beginning of a line or string\n* `$` Anchors\
    \ match to the end of a line or string\n\nPerl5 only:\n\n+   * `\\A` Match only\
    \ at beginning of string\n* `\\Z` Match only at end of string\n* `\\G` Match only\
    \ where previous m//g left off\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_207_0.png)"
  - '[PAGE 208]


    # Perl5 RE Extensions


    +   - Perl 5.002 introduced the \x modifier for pattern-match operators.


    +   - When you use the \x modifier, you can:


    +   - Embed arbitrary whitespace characters on the RE.


    ```

    m/

    (\W*)

    Dobbs

    (\W*)

    /x;

    ```

    - Only *quoted* (backslashed) whitespace will be considered part of the pattern.


    +   - Embed comments in the RE


    ```

    m{\ # Using braces to delimit the pattern

    (\W*) # Grab all non-word chars before $name

    $name

    (\W*) # Grab all non-word chars after $name

    }x;

    ```


    +   - This can make a complex RE much more readable.'
