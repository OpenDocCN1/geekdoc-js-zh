  - '[PAGE 234]


    # How UNIX Opens Files


    +   - Each process in UNIX has an integer-indexed file descriptor table with one
    entry for each open file.


    +   - A Perl filehandle corresponds to a UNIX file descriptor.


    +   - File descriptors 0, 1, and 2 are called standard in, standard out, and standard
    error, respectively.


    +   - A filter is a program that reads its standard in and writes its standard
    out, whatever files they happened to be opened to.


    +   - The KEY to setting up filters in the parent is this:


    +   - UNIX always uses the lowest available file descriptor when opening a file.


    +   - Closing a file frees up the file descriptor used by that file.


    +   - You can duplicate an open file descriptor into the next available entry.'
