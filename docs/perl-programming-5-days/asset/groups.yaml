  - "[PAGE 128]\n\n# Passing Names\n\n+   * The @_ array contains references to scalar\
    \ or array arguments.\n\n+   * This allows you to modify the values of scalars\
    \ or array elements that are passed in.\n\n+   * But if you wish to modify the\
    \ size of an array, you must pass its name using the * operator.\n\n+   * *NAME\
    \ (called a typeglob) containing actual symbol table pointers of all data types\
    \ named *NAME*: scalars, arrays, filehandles, subroutines, etc.\n\nHere's how\
    \ to use it:\n\n```\n#!/bin/perl\n# File: names.pl\n\n@a = (1,2,3);\n&thing(*a);\
    \ # Pass everything named 'a'\nprint \"main a: @a\\n\";n\nsub thing {\n    # Catch\
    \ everything named 'a'\n    local(*b) = @_;\n\n    # Refer to the array named\
    \ 'a'\n    unshift(@b, 'P'); # Modifies $$a\n}\n```"
