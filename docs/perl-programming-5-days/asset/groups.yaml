    Perl5 allows the use of the RE ? to make the "greedy" modifiers *, +, and {m,n}
    "non-greedy".


    If you use \d+ will it match the longest sequence of digits it finds.


    The RE \d+? will now match just 1 digit.


    The variables $+$, $$, `$, and `$ are global, and subject to all the dangerous
    side effects that all globals are subject to. In particular, these variables may
    be modified in modules whose functions you call. So, if you use these (or even
    the $1, $2,... variables), be sure to capture their values immediately after the
    pattern match, before any other executable statements.'
- md: "\n## RE Special Variables\n\n- In addition to the variables $1, $2, etc., evaluation\
    \ of an RE can set other special variables as well.\n- $+ returns whatever the\
    \ last bracket (substring) matched.\n- && returns the entire matched string.\n\
    - $ returns everything before the matched string.\n- '$' returns everything after\
    \ the matched string.\n- + is useful when you don't know which form an RE might\
    \ match.\n- Example\n\n```perl\n#!/usr/bin/perl\n# File: getac\n# Run: $ getac\
    \ < telnos\n\n# Assume phone number formats of:\n# (303) 841-7723\n# 303-841-7723\n\
    # We can get the area code as follows:\n\nwhile (<>) {\n\n    # A left paren,\
    \ then 3 digits,\n    # then a right paren, OR\n    # 3 digits then a -.\n\n \
    \   /(\\d{3})\\)|(\\d{3})-/;\n    $ac = $+; # $+ is the matched substring\n  \
    \  print \"$ac\\n\"\n}\n```\n\n## RE Options\n\n- Perl provides a variety of options\
    \ (or *modifiers*) to the pattern-matching operators.\n- List options after the\
    \ pattern delimiters.\n- Ignore case in searches.\n  - m/dobbs/i Dobbs, dobbs,\
    \ DOBBS, dobBS, etc.\n- All occurrences (**global**), not just the first found\
    \ in the string.\n  - s/NT/UNIX/g Change *all* NT to UNIX.\n- Treat string being\
    \ searched as a **multi-line buffer** (more on this a moment).\n- Evaluate expression\
    \ and use its value in substitution (`s///e`).\n- Use extended (Perl 5.002+) regular\
    \ expressions (stay tuned...)\n\n## Notes\n\nRemember any non-word character is\
    \ valid as a pattern delimiter.\n\n```\nm:dobbs:i\nm|dobbs|i\nm!dobbs!i\n```\n\
    \nBracketing-characters `{}, []()` can make a pattern more readable.\n\n```\n\
    m{dobbs}i\n```\n\n## Multiline REs\n\n- You may use a single scalar variable to\
    \ hold several lines of text.\n- In general, a *line* is simply a string of characters\
    \ ending in a newline character.\n- A scalar containing a string with embedded\
    \ newline characters can be called a *multiline* buffer.\n\n- Normally, ^ or $\
    \ match only the beginning or ending (before the first character or after the\
    \ last non-newline character, respectively) of the string being searched.\n\n\
    - When you use the `m` modifier, ^ will match:\n  - The beginning of the string\n\
    \  - The position immediately after any newline character embedded in the string\
    \ (the beginning of the next \"line\").\n\n- When you use the `m` modifier, $\
    \ will match:\n  - The ending of the string.\n  - The position immediately before\
    \ any newline character embedded in the string (the end of the current \"line\"\
    ).\n\nRead the discussion of multiline vs. single-line REs in the Perl book.\n\
    \n## 204 Perl Programming\n\n## Notes\n\nIf a pattern is contained in parentheses,\
    \ then whatever was matched by the RE inside the parentheses can be referred to\
    \ later. (What?)\n\nQuick, examples!\n\n```perl\n# Change \"script\" and \"program\"\
    \ to\n# \"script file\" and \"program file\"\nwhile(<>)\n{\n    s/(script|program)/$1\
    \ file/g;\n    print;      # Print all lines\n}\n```\n\n```perl\n# Swap first\
    \ and last characters on line\nwhile(<>)\n{\n    s/^\\(.).*)(.)$/$3$2$1/;\n  \
    \  print;\n}\n```\n\n## Substituting with an Expression\n\n- The s/// substitutes\
    \ a replacement string for the matched data.\n\n```perl\ns/\\bBob(\\s+[A-Z]\\\
    w*)/Barb$1;      # Replace name \"Bob\"\n# with \"Barb\"\n# preserving lastname.\n\
    ```\n\n- The replacement string can contain literal text or Perl variables, including\
    \ backreferences ($1, $2, ...).\n\n```perl\n$rad = 73;\n$area = \"Area is circlearea\"\
    ;\n$area ~ s/circlearea/$rad * $rad * 3.1415/;\nprint \"$area\\n\";\n```\n\nOutput:\n\
    \nArea is 73 * 73 * 3.1415\n\n- The e modifier causes Perl to:\n  1. Evaluate\
    \ the replacement string as an expression.\n  2. Convert its value to a string.\n\
    \  3. Use the value for substitution.\n\n```perl\n$rad = 73;\n$area = \"Area is\
    \ circlearea\";\n$area ~ s/circlearea/$rad * $rad * 3.1415/e;\nprint \"$area\\\
    n\";\n```\n\nOutput:\n\nArea is 16741.0535\n\n## Notes\n\nRegular Expressions\n\
    \n| Pattern | Description |\n| :--- | :--- |\n| `[a-z0-9]` | Matches any character\
    \ except newline |\n| `\\w` | Matches any single character of set |\n| `[^a-z0-9]`\
    \ | Matches any single character not in set |\n| `\\d` | Matches a digit, same\
    \ as `[0-9]` |\n| `\\D` | Matches a non-digit, same as `[^0-9]` |\n| `\\w` | Matches\
    \ alphanumeric (word) character `[a-zA-Z0-9_]` |\n| `\\W` | Matches non-word character\
    \ `[^a-zA-Z0-9_]` |\n| `\\s` | Matches a whitespace character (space, tab, newline)\
    \ |\n| `\\S` | Matches a non-whitespace character |\n| `\\n` | Matches a newline\
    \ |\n| `\\r` | Matches a return |\n| `\\f` | Matches formfeed |\n| `\\b` | Matches\
    \ a word boundary (inside only) |\n| `\\0` | Matches a null character |\n| `\\\
    o` | Matches ASCII character of that octal value |\n| `\\x` | Matches ASCII character\
    \ of that hexadecimal value |\n| `\\cX` | Matches ASCII control character |\n\
    | `\\` | Matches the character itself (`\\.`, `\\*`) |\n\nGroup elements and remembers\
    \ the match for later\n\n- `\\1` Matches whatever first parens matched\n- `\\\
    2` Matches whatever second parens matched\n- `\\3` and so on...\n\n- `x?` Matches\
    \ 0 or 1 x, where x is any of above\n- `x*` Matches 0 or more x\n- `x+` Matches\
    \ 1 or more x\n- `{m,n}` Matches at least m x, but no more than n\n\n- `abc` Matches\
    \ all of a, b, and c in order\n- `a|bc` Matches one of a, b, or c\n\n- `\\b` Matches\
    \ a word boundary (outside only)\n- `\\B` Matches a non-word boundary of a line\
    \ or string\n- `^` Anchors match to the beginning of a line or string\n- `$` Anchors\
    \ match to the end of a line or string\n\nPerl5 only:\n\n- `\\A` Match only at\
    \ beginning of string\n- `\\Z` Match only at end of string\n- `\\G` Match only\
    \ where previous match left off\n\n## Perl RE Extensions\n\n- Perl 5.002 introduced\
    \ the x modifier for pattern-match operators.\n- When you use the x modifier,\
    \ you can:\n  - Embed arbitrary whitespace characters on the RE.\n\n```perl\n\
    m/\n(\\W*)\nname\n/x;\n- *quoted* (backslashed) whitespace will be considered\
    \ part of the pattern.\n\n- Embed comments in the RE\n\n```perl\nm{\\ # Using\
    \ braces to delimit the pattern\n(\\W*) # Grab all non-word chars before $name\n\
    $name\n(\\W*) # Grab all non-word chars after $name\n}x;\n```\n\n- This can make\
    \ a complex RE much more readable.\n\n## Lab\n\n1. Write a program that opens\
    \ /etc/passwd and reads its entire contents into a single scalar variable. With\
    \ subexpressions and the multiline-buffer modifier, use a single RE to extract\
    \ the list of all names that start with a letter and contain at least one digit.\
    \ (Solution: mre.pl)\n2. Write two different REs that will match social security\
    \ numbers. (Solution: ssn)\n3. Write an RE that will match either of the following\
    \ date formats:\n   MM-DD-YY\n   MM/DD/YY\n   Don't forget to consider the possible\
    \ range of values for each character position (for example, there are only 12\
    \ months.) (Solution: date_res)\n4. Starting with your RE in #3 above, write a\
    \ subroutine to capture the month, day, and year in an associative array called\
    \ 'dates'. Call your subroutine from a program that has opened the file called\
    \ 'mydata'. The date is found on the second line. (Solution: array_dates)\n5.\
    \ What are two ways to assign the value of exactly what was matched by an RE?\
    \ (Solution: 2forall)\n6. What will be printed by the following program:\n\n```perl\n\
    $line = \"The last programmer quit\";\n$line ~ /(programmer)| (coder)/;\nprint\
    \ '$&', \"$&\\n\";\nprint '$', \"$\\n\";\nprint q|$', $1, \"$|\\n\";\nprint '$+',\
    \ \"$+\\n\";\n```\n(Solution: programmer)\n\n## Chapter 16 - Binary Data Structures\n\
    \n## Chapter Objectives\n\n- Compare variable-length and fixed-length record processing\
    \ in Perl.\n- Understand the uses of `pack()` and `unpack()` functions.\n- Write\
    \ programs that use the `read()`, `pack()`, and `unpack()` functions.\n\n## Notes\n\
    \nExamples\n\n```perl\n#!/usr/bin/perl\n# File: splitter\n\n# Typical passwd line:\n\
    # root:x:0:0:root:root:/home/root/bin/ksh\n\n@ARGV != 1 && die \"Usage: splitter\
    \ id\"\nopen (PASSWORD, \"/etc/passwd\");\nwhile (<PASSWORD>) {\n    if (^$ARGV[0])\
    \ {\n        ($name, $password, $uid, $gid, $comment, $dir, $shell) = split(':');\n\
    \        print \"$name $uid $dir\\n\";\n    }\n}\n\n#!/usr/bin/perl\n# File: joiner\n\
    \n# Join together the command line arguments, separated by double dashes\n--).\n\
    # Put the result into a file called \"cmdcode\".\n\n$all = join('-', @ARGV);\n\
    open(CODE, \">cmdcode\") || die \"Can't open cmdcode: $!\\n\";\nprint CODE $all,\
    \ \"\\n\";\nclose(CODE);\n```\n"
  mdcn: "\n\n## RE 特殊变量\n\n- 除了 $1, $2 等变量外，评估 RE（正则表达式）还可以设置其他特殊变量。\n- `$+` 返回上一次匹配的括号（子字符串）。\n\
    - `&&` 返回整个匹配到的字符串。\n- `$` 返回匹配字符串之前的所有内容。\n- `'$'` 返回匹配字符串之后的所有内容。\n- 当你不知道 RE\
    \ 可能会匹配哪种形式时，`+` 非常有用。\n- 示例\n\n```perl\n#!/usr/bin/perl\n# File: getac\n# 运行:\
    \ $ getac < telnos\n\n# 假设电话号码格式为：\n# (303) 841-7723\n# 303-841-7723\n# 我们可以如下获取区号：\n\
    \nwhile (<>) {\n\n    # 左括号，然后是 3 位数字，\n    # 然后是右括号，或者\n    # 3 位数字后跟一个连字符。\n\
    \n    /(\\d{3})\\)|(\\d{3})-/;\n    $ac = $+; # $+ 是匹配到的子字符串\n    print \"$ac\\\
    n\"\n}\n```\n\n## RE 选项\n\n- Perl 为模式匹配操作符提供了多种选项（或*修饰符*）。\n- 在模式分隔符之后列出选项。\n\
    - 搜索时忽略大小写。\n  - m/dobbs/i 匹配 Dobbs, dobbs, DOBBS, dobBS 等。\n- 匹配所有出现的情况（**全局**），而不仅仅是字符串中找到的第一个。\n\
    \  - s/NT/UNIX/g 将*所有* NT 更改为 UNIX。\n- 将被搜索的字符串视为**多行缓冲区**（稍后将详细介绍）。\n- 评估表达式并将其值用于在替换中（`s///e`）。\n\
    - 使用扩展正则表达式（Perl 5.002+）（请期待……）\n\n## 注意事项\n\n记住任何非单词字符都可以作为有效的模式分隔符。\n\n```\n\
    m:dobbs:i\nm|dobbs|i\nm!dobbs!i\n```\n\n界定字符 `{}, []()` 可以使模式更具可读性。\n\n```\nm{dobbs}i\n\
    ```\n\n## 多行 RE\n\n- 你可以使用单个标量变量来存储多行文本。\n- 通常，*行*简单来说是以换行符结束的字符字符串。\n- 包含嵌入换行符的字符串的标量可以称为*多行*缓冲区。\n\
    \n- 通常，`^` 或 `$` 仅匹配被搜索字符串的开头或结尾（分别是第一个字符之前或最后一个非换行字符之后）。\n\n- 当你使用 `m` 修饰符时，`^`\
    \ 将匹配：\n  - 字符串的开头\n  - 字符串中嵌入的任何换行符之后的后续位置（下一“行”的开头）。\n\n- 当你使用 `m` 修饰符时，`$`\
    \ 将匹配：\n  - 字符串的结尾。\n  - 字符串中嵌入的任何换行符之前的标记（当前“行”的结尾）。\n\n请在 Perl 书中阅读关于多行 RE 与单行\
    \ RE 的讨论。\n\n## 204 Perl 编程\n\n## 注意事项\n\n如果模式包含在括号中，那么括号内 RE 匹配到的任何内容稍后都可以被引用（什么？）\n\
    \n快速，看示例！\n\n```perl\n# 将 \"script\" 和 \"program\" 改为\n# \"script file\" 和 \"\
    program file\"\nwhile(<>)\n{\n    s/(script|program)/$1 file/g;\n    print;  \
    \    # 打印所有行\n}\n```\n\n```perl\n# 交换行的第一个和最后一个字符\nwhile(<>)\n{\n    s/^\\(.).*)(.)$/$3$2$1/;\n\
    \    print;\n}\n```\n\n## 使用表达式进行替换\n\n- `s///` 用替换字符串替换匹配到的数据。\n\n```perl\ns/\\\
    bBob(\\s+[A-Z]\\w*)/Barb$1;      # 替换名字 \"Bob\"\n# 为 \"Barb\"\n# 保留姓氏。\n```\n\n\
    - 替换字符串可以包含字面文本或 Perl 变量，包括反引用（$1, $2, ...）。\n\n```perl\n$rad = 73;\n$area = \"\
    Area is circlearea\";\n$area ~ s/circlearea/$rad * $rad * 3.1415/;\nprint \"$area\\\
    n\";\n```\n\n输出：\n\nArea is 73 * 73 * 3.1415\n\n- `e` 修饰符导致 Perl：\n  1. 将替换字符串作为表达式评估。\n\
    \  2. 将其值转换为字符串。\n  3. 使用该值进行替换。\n\n```perl\n$rad = 73;\n$area = \"Area is circlearea\"\
    ;\n$area ~ s/circlearea/$rad * $rad * 3.1415/e;\nprint \"$area\\n\";\n```\n\n\
    输出：\n\nArea is 16741.0535\n\n## 注意事项\n\n正则表达式\n\n| 模式 | 说明 |\n| :--- | :--- |\n\
    | `[a-z0-9]` | 匹配除换行符外的任何字符 |\n| `\\w` | 匹配集合中的任何单个字符 |\n| `[^a-z0-9]` | 匹配不在集合中的任何单个字符\
    \ |\n| `\\d` | 匹配数字，等同于 `[0-9]` |\n| `\\D` | 匹配非数字，等同于 `[^0-9]` |\n| `\\w` | 匹配字母数字（单词）字符\
    \ `[a-zA-Z0-9_]` |\n| `\\W` | 匹配非单词字符 `[^a-zA-Z0-9_]` |\n| `\\s` | 匹配空白字符（空格、制表符、换行符）\
    \ |\n| `\\S` | 匹配非空白字符 |\n| `\\n` | 匹配换行符 |\n| `\\r` | 匹配回车 |\n| `\\f` | 匹配分页符\
    \ |\n| `\\b` | 匹配单词边界 |\n| `\\0` | 匹配空字符 |\n| `\\o` | 匹配八进制值 |\n| `\\x` | 匹配十六进制值\
    \ |\n| `\\cX` | 匹配控制字符 |\n| `\\` | 匹配反斜杠 |\n| `\\*` | 匹配星号 |\n| `$1` | 引用第一个捕获组\
    \ |\n| `$2` | 引用第二个捕获组 |\n| `$3` | 引用第三个捕获组 |\n| `$&` | 整个匹配到的字符串 |\n| `$ `` |\
    \ 匹配字符串之前的内容 |\n| `$+` | 匹配到的最后一个括号（子字符串） |\n| `$'` | 匹配字符串之后的内容 |\n| `^` | 匹配开头\
    \ |\n| `$` | 匹配结尾 |\n| `*` | 匹配 0 次或多次 |\n| `+` | 匹配 1 次或多次 |\n| `?` | 匹配 0 次或\
    \ 1 次 |\n| `{n}` | 匹配 n 次 |\n| `{n,m}` | 匹配 n 到 m 次 |\n| `{n,}` | 匹配 n 次以上 |\n\
    | `|` | 逻辑或 |\n| `.` | 匹配任意字符（除换行符） |\n| `[]` | 字符集 |\n| `^` | 在字符集中取反 |\n| `()`\
    \ | 分组 |\n| `{}` | 扩展限定 |\n| ` ` | 字符界定符 |\n\n"
