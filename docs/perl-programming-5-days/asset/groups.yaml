    \n# 命令替换\n\n- 被反引号（也称为 grave accents）包围的字符串将被视为 UNIX shell 命令并执行。\n- 命令的输出将被返回。\n\
    - 反引号内部的变量替换与双引号相同。\n- 在标量上下文中，返回一个包含所有命令输出的单个字符串。\n- 在数组上下文中，返回一个值数组，每行输出对应一个值。\n\
    - 示例：\n\n```perl\n$lastline = `tail -1 some_file`;\n@all_lines = `cat some_file`;\n\
    ```\n\n```perl\n$last_boot = `who -b`;\n@who = `who`;\n```\n\n- 通用形式为：\n\n```perl\n\
    qx/cmd/\n\n$last_boot = qx/who -b;\n@who = qx{who};\n```\n\n# Here Documents（在此文档）\n\
    \n- 转向《骆驼书》中的“The Gory Details”章节，学习另一种优秀的引用方法，被称为行定向引用，或 *here documents*。\n\n\
    # 实验\n\n1. 如何在一行中连续打印 8 个反斜杠？（答案：back8.sh）\n\n2. 以下代码会打印什么：\n\n```perl\nprint\
    \ \"\"\", \"\\n\"\nprint \"\"\"\", \"\\n\";\n```\n\n3. 从 `print` 函数的角度来看，这两行之间的区别是什么：\n\
    \n```perl\nprint \"Sum is $sum\\n\"\nprint \"Sum is $sum\", \"\\n\";\n```\n\n\
    4. 编写一个循环程序，每次迭代请求一行输入。打印该行并将所有字母转为大写。当遇到字符串 \"quit\" 时停止。记住 'eq' 运算符用于比较字符串的相等性。（答案：caps.pl）\n\
    \n5. 每行打印一个数组的元素。先使用 `foreach` 循环，然后使用数组插值，最后使用 `join` 函数。（答案：array1.pl）\n\n6.\
    \ 编写一个程序打印以下内容（带有适当的时间）：\n\n```\nThe system was most recently booted up at 5:53\
    \ on May 14.\n```\n（答案：boott.pl）\n\n7. 创建一个名为 `some_file` 的文件（内容如下所示然后编写一个包含以下代码行的程序：\n\
    \n```perl\n$lastline = `tail -1 some_file`;\n@all_lines = `cat some_file`;\n```\n\
    \n打印 `$lastline` 和 `@all_lines` 的值，使输出**完全**如下：\n\n```\nfour\none\ntwo\nthree\n\
    four\n```\n提示：数组插值的分隔符是什么？（答案：somef.pl）\n\n# 第11章 - 引用\n\n# 章节目标\n\n- 创建并使用两种形式的引用和别名。\n\
    - 构建变量的引用。\n- 构建匿名数据的引用。\n- 描述 Perl 如何使用符号表。\n\n# 引用\n\n- 任何标量变量都可以包含一个*引用*。\n\
    - 引用（有时称为*硬引用*）是一个标量，其值是存储另一个变量值的地址以及该变量的类型。\n- *符号引用*是一个标量，其值是另一个变量的名称。\n- 硬引用必须通过显式机制创建，并用显式机制进行解引用。\n\
    - 符号引用必须显式地解引用。\n- Perl 中使用引用的原因与其他语言中使用指针的原因相同：效率、性能、控制等。\n\n# 创建引用\n\n- 使用单元反斜杠运算符创建硬引用：\n\
    \n```perl\n$a = 6;\n$b = \\$a;\n(\"one\",\"two\",\"three\"); # 创建3元素数组\n$c_ref\
    \ = \\@c_arr; # 创建指向数组的引用\n\n%dhash = (\"one\" => 1,\"two\" => 2,\"three\" =>\
    \ 3); # 一个哈希表\n$sub_ref = \\%dhash # 创建指向哈希表的引用\n\nsub some_sub { return \"hi\"\
    ; } # 子程序\n$sub_ref = \\$some_sub; # 创建指向子程序的引用\n```\n\n- 创建符号引用，只需将另一个变量的名称字符串赋值即可：\n\
    \n```perl\n$c = \"a\"; # 将字符串值 \"a\" 赋值给标量 \"$c\"\nprint \\$\\$c, \"\\n\";\n```\n"
