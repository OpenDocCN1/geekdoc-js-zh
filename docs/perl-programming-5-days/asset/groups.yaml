    # Notes


    This program, `menu.pl`, displays a menu of user-selectable actions. The program
    executes an infinite loop using the C-style `for(;;)` construct, waiting for the
    user to type a choice. After performing the action chosen by the user, the program
    clears the screen and replays the menu. The program terminates when the user selects
    the menu choice.


    The `system(clear)` function tells the operating system to execute the `clear`
    command, just as if it had been typed on the keyboard.


    The line:


    ```

    $choice = <STDIN>; chop $choice;

    ```


    reads one line into the variable `$choice` from the file identified by the file
    handle `STDIN`, using the input operator `<`. The `chop` function chops off the
    newline character that was read from `STDIN` and stored into `$choice`.


    The line:


    ```

    last if $choice eq "e";

    ```


    exits the `for` loop using the Perl control flow statement `last` if the user
    chose. If we had not chopped the newline we would have said:


    ```

    last if $choice eq "\n";

    ```


    After setting the variable `$command` based on `$choice`, the `system()` function
    is called once again to execute the command.


    Finally, the line:


    ```

    <STDIN>;

    ```


    simply reads a line from the standard input. The intent is to wait for the user
    to hit the `<Enter>` key before clearing the screen and redisplaying the menu.
    The standalone `<STDIN>` actually reads one line and discards it.


    Note that a semicolon;,; must terminate each simple statement. A compound statement
    (a sequence of simple statements, enclosed in braces) is not terminated with a
    semicolon.'
