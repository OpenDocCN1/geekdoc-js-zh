  mdcn: "\n\n## Perl 及其他 setuid() 相关\n\n- `setuid()` 系统调用允许程序（如果设置了其 setuid 位）在运行时假设另一个用户的用户\
    \ ID（user-ID）。\n\n- 许多 UNIX 工具程序例行执行此操作 - 它们作为功能的一部分必须这样做：\n  - passwd\n  - login\n\
    \  - mail, mailx, elm\n\n- Perl 允许你创建脚本，这些脚本也可以运行时更改它们的 uid 和 gid。\n\n- 实际的 id\
    \ 值通过四个特殊变量来设置：\n  ```\n  $> effective user id\n  $< real user id\n  $) effective\
    \ group id\n  $( real group id\n  ```\n\n- 允许更改真实 ID 的 Perl 程序存在潜在的安全问题，因为精通此道的的用户可以利用一个无害的程序并将其显而易见的安全漏洞，赋予他们\
    \ root 权限。\n\n- `taintperl` 是 Perl 可执行文件的特殊版本，用以防止这种情况。\n\n## Perl、Web 与 CGI 脚本\n\
    \n- Web 的增长使得 Perl 的流行程度大幅提升。\n\n- 网页的创建与维护，以及网页表单和数据库的处理，需要一种完全像 Perl 一样的语言：\n\
    \  - 可以在运行 Web 服务器的许多系统上可移植的。\n  - 强大的文本和模式处理能力。\n  - 高性能（对于脚本语言而言）且程序开发快速。\n\
    \  - 可扩展且具有互操作性。\n\n- Perl 脚本的一个常见用途是处理来自网页表单的 CGI（通用网关接口）数据。\n\n-为此流行的模块（从 CPAN\
