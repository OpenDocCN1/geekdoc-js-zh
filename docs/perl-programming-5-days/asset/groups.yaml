    \ Perl Programming\n\n## Notes\n\nThe modifier is always evaluated before the\
    \ expression that it is modifying, so Perl provides a do-BLOCK construct that\
    \ allows you to execute a block of statements once before the modifier is evaluated.\
    \ A BLOCK is a sequence of statements enclosed in curly braces.\n\n```perl\ndo\
    \ {\n  E1;\n  E2;\n  E3;\n  ...\n} [ while E; | until E; ]\n```\n\nThis construct\
    \ is still considered to be a simple expression because there are things that\
    \ you can do in compound statements that you can't do with a do-BLOCK construct.\n\
    \nSo, the differences between\n\n```perl\nE1 while E2; and do { E1;\n  E2;\n \
    \ E3;\n  ...\n} while E;\n```\n\nare:\n\n- 1) The BLOCK is executed before E is\
    \ evaluated, thus ensuring that the statement (or statements) executes at least\
    \ once, and\n\n- 2) You can have multiple statements in a block.\n\nExample:\n\
    \n```perl\n$count = 5;\ndo { print $count-- } while $count;\n```\n\nis equivalent\
    \ to:\n\n```perl\n$count = 6;\nprint $count while $count--;\n```\n\nExample:\n\
    \n```perl\ndo {\n  print STDOUT \"Important information\\n\";\n  print KEEPPIT\
    \ \"Important information\\n\";\n} if $logging;\n```\n\n## Simple Statement Modifiers\n\
    \n- An expression can be followed by a modifier:\n\n```perl\nE1 if E2;\nE1 unless\
