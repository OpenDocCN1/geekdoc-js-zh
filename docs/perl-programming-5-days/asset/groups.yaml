  - '[PAGE 71]


    # Notes


    It''s about time we look more closely at the chop function (if you haven''t already
    looked it up.) chop simply removes the last character of its string argument.


    ```

    $fish = "trouts";

    chop $fish; # $fish is now "trout"

    ```


    The chop function returns the character it chopped off.


    If its argument is a list, then chop chops the last character off each element
    of the list.


    ```

    @plural = (''cats'', ''dogs'', ''frogs'');

    @singular = chop @plural;

    ```


    Because Perl preserves the trailing newline character when it reads a line from
    a file or from standard input, chop has traditionally been used to chop off the
    newline.


    ```

    $choice = <STDIN>;

    chop $choice;

    ```


    Now, if there is no trailing newline character, chop will chop off whatever character
    it finds at the end of the string. You have to be careful that you chop only where
    it is needed.


    Perl adds the chop function. chop does the same thing as chop, but is safer because
    it chops, er, that is, chops, off the last character only if that character is
    a newline. So, you are less likely to remove a significant character from the
    end of a string.


    The special variable /, the input record separator, is actually what chop looks
    for and chops off. Look up both chop and the $/ variable in the Perl book.'
