    \ have other objects as data members\n  - This is called containment.\n- An Employee\
    \ record may consist of simple data, like a Social Security Number.\n- It would\
    \ also contain more complex constructs like our Name or FormalName class.\n  -\
    \ In this case, an employee record \"has-a\" Name; a Name object would be a data\
    \ member to the Employee object.\n- Since the Perl compiler needs to check the\
    \ containing class's use of member object methods at compile time, the contained\
    \ object should be a Perl Module: a .pm, included with use.\n  - In fact, to provide\
    \ the greatest flexibility and reuse, you'll define all your classes as Perl Modules."
