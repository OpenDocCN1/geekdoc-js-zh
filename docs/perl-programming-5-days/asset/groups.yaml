  mdcn: "\n\n# 什么是单任务和多任务？\n\n- 像 DOS 这样的单任务环境一次只能运行一个程序。\n- 当单任务程序在等待 I/O 时，CPU 会处于空闲状态。\n\
    - 像 UNIX 这样的多任务环境可以并发运行多个程序。\n  - 可以实现更高的系统利用率。\n\n# 注意事项\n\nUNIX 在创建每个进程时都会为其分配一个唯一的\
    \ PID。应用程序使用 PID 有许多原因，例如创建唯一的文件名、等待特定的子进程终止、向其他进程发送信号。`ps (1)` 命令可以显示 PID。\n\n\
    环境变量以 (NAME,VALUE) 对列表的形式存储。这些键值对从父进程继承，即它们在 `fork` 时代被复制到子进程的环境中。Perl 通过关联数组\
    \ `%ENV` 访问环境变量。变量名是键，其值是数组的值。\n\n例如：`$homedir = $ENV{HOME};`\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_225_0.png)\n\
    \n# UNIX 多任务概念\n\n- UNIX 中的进程是一个正在执行的程序。\n- 每个进程都有一个唯一的进程 ID（一个整数），称为 PID。\n-\
    \ 每个进程都有一个环境，在 Perl 中可以通过特殊关联数组 `%ENV` 访问。\n- 通过调用 `fork` 函数创建新进程。\n- 当一个进程创建另一个进程时，第一个被称为父进程，第二个被称为子进程。\n\
    - 进程的环境从其父进程继承。\n- 父进程与子进程并发运行。父进程在任何时候都可以暂停并等待子进程完成。\n- 进程通过调用 `exit()` 或被杀死来终止。\n\
    \n# 注意事项\n\n除了 PID 之外，子进程是父进程的完全镜像。`fork` 调用在父进程中调用子进程，并在子进程中返回零。由于两个进程执行的代码完全相同，且它们都从\
    \ `fork` 返回，因此 `fork` 的返回值是它们判断自己是父进程还是子进程的依据。\n\n你可能在想，创建一个与父进程完全镜像的第二个进程有多用。事实上，`fork`\
    \ 之后的子分支不会被父进程执行，因此该代码可以执行与子进程相关的任务，而父分支可以执行父进程任务。这就是几页前讨论的示例的实现方式。\n\n```perl\n\
    #!/usr/bin/perl\n# 在后台拷贝大文件\n# 让用户继续处理其他事情\n\nprint \"Enter the name of the large\
    \ file to copy: \";\nchop($biggie = <STDIN>);\nprint \"Enter the name of the system\
    \ to copy to: \";\nchop($destination = <STDIN>);\n\n# 调用 fork 创建另一个进程来执行拷贝\nif\
    \ (fork == 0) { # 子分支\n    fork($biggie, $destination);\n    print \"$biggie copy\
    \ complete.\\n\";\n    exit(0);\n} # 子进程结束\nelse { # 父分支\n    print \"The copy\
    \ of $biggie is underway.\\n\";\n    print \"What should I do now?\\n\";\n   \
    \ chop($answer = <STDIN>);\n\n    # ... (省略表示父进程代码)\n}\n# 父进程结束\n```\n\n让我们来看看\
    \ fork1、fork2 和 fork3？\n\n![](/7fc661985e26f441bbcce9ca3c796ad_227_0.png)\n\n\
    # 使用 fork 创建进程\n\n- Perl 中的 `fork` 函数调用 `fork(2)` 系统调用。\n- `fork` 创建新进程的过程如下（这很微妙）：\n\
    \  - 一个进程（即将成为父进程）调用 fork 并进入 UNIX 操作系统。\n  - UNIX 为新进程分配空间（文本段和数据段）。\n  - 新的文本段和数据段通过复制父进程的段来初始化。\n\
    \  - 现在原本有一个进程的地方变成了两个进程。子进程拥有新的 PID。\n- UNIX 从 `fork` 调用返回到父进程的下一行代码，就像从任何函数调用返回一样。\n\
    - 而 UNIX 从 `fork` 调用“返回”到子进程（它从未调用过 `fork`），并从下一行代码开始执行执行。\n\n# Perl 编程\n\n# 注意事项\n\
    \n在之前的 `fork` 示例中，子进程的“程序”是 `fork` 子分支中的代码。该“程序”嵌入在包含父进程的同一个程序中。但通常当你创建一个子进程来执行多任务处理时，你希望运行存储在磁盘文件中的预存程序。它可能是一个\
    \ UNIX 工具，也可能是你或他人编写的程序。\n\n子进程在 `fork` 系统调用期间产生，目的是创建所有必要的内部 UNIX 段、表等以支持新进程。随后，子进程在从\
    \ `fork` 调用返回后，立即调用 `exec` 将新程序加载到新创建的进程中。新程序将在程序的第一行代码开始执行。\n\n示例\n\n```perl\n\
    #!/usr/bin/perl\n# 文件: execer\n# 演示父进程创建一个执行另一个程序的子进程\n\nprint \"File to sort?\
    \ \";\nchop($sortfile = <STDIN>);\n\nif (-f $sortfile) {\n    print \"CAUTION:\
    \ FILE $sortfile WILL BE MODIFIED!\\n\";\n    print \"Continue? (y/n)\";\n   \
    \ chop($answer = <STDIN>);\n    if ($answer != \"y\") { exit(0); } # 退出\n}\nelse\
    \ {\n    print \"Can't find $sortfile.\\n\";\n    exit(-1);\n}\n\nsystem(\"sort\
    \ $sortfile\");\n\n# 调用 fork 创建另一个进程来执行拷贝\nif (fork == 0) { # 子分支\n    exec(\"\
    sort $sortfile\");\n} else { # 父分支\n    print \"The copy is underway.\\n\";\n\
    }\n```\n\n"
