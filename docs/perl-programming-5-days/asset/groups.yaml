    \ $Port, \"\\0\\0\\0\\0\");\n\nselect(NS); $l = 1; select(stdout);\n\nsocket($S,\
    \ $AF_INET, $SOCK_STREAM, 0) || die \"socket: $!\";nbind($S,$this) || die \"bind:\
    \ $!\";nlisten($S,5) || die \"connect: $!\";\n\nselect($S); $l = 1; select(stdout);\n\
    \n$con = 0;\nprint \"Listening for connection 1...\\n\";nfor(;;) {\n\t($addr =\
    \ accept(NS,$S)) || die \"$\";\n\t$con++;\n\tif (($Child[$con] = fork()) == 0)\
    \ {\n\t\tprint \"accept ok\\n\";\n\t\t($af,$port,$inetaddr) = unpack($sockaddr,$addr);\n\
    \t\t$inetaddr = inet_ntoa($inetaddr);\n\t\tprint \"con: $af $port $inetaddr\\\
