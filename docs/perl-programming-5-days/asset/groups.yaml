  - '[PAGE 223]


    # 22 Perl Programming


    # Notes


    It is true even in a multitasking operating system that only one program at a
    time can actually execute CPU instructions. However most programs request operating
    system services that would put the entire computer into a state in which it waits
    for an outside event to occur. In such states, the CPU becomes totally idle and
    has nothing to do on behalf of the occur until the outside event occurs. "Outside
    events" are called I/O events, which take place much more slowly than CPU execution.


    A multitasking operating system enables a program to run while others are waiting
    for I/O, thus getting more work done in the same amount of time than a sequencing
    singletasking operating system.


    From a higher level point of view, here are examples of the use of multitasking:


    +   1. Client/server - a server waits for a client request, then creates another
    process to fulfill the request while the server goes back to wait for another
    client request. This capability is important because the server may not have enough
    time to completely fulfill the first client request before another comes along,
    and thus client requests would be ignored.


    +   2. An application separates data collectors from the data processors (processing
    could mean simply saving data or it could mean performing calculations, lookups,
    translations, etc.)


    +   3. Existing programs can be reused (the UNIX "Toolbox Methodology") by running
    them as concurrent subprograms. Example: interactively display pages of data without
    reinventing the pager wheel.


    ![](img/7fc661985e26f441bbcce9ca3c796ad2_223_0.png)'
- md: "\n# What are Single and Multitasking?\n\n- A singletasking environment like\
    \ DOS can only run one program at a time.\n- When a singletasking program waits\
    \ for I/O, the CPU sits idle.\n- A multitasking environment like UNIX can run\
    \ several programs concurrently.\n  - Higher utilization of the system can be\
    \ achieved.\n\n# Notes\n\nA unique PID is assigned by UNIX to each process when\
    \ it is created. Applications use PIDs for many reasons such as creating unique\
    \ file names, waiting for specific children to terminate, sending signals to other\
    \ processes. The ps (1) command shows PIDs.\n\nThe environment variables are stored\
    \ as a list of (NAME,VALUE) pairs. The pairs are inherited from the parent, i.e.,\
    \ they are duplicated into the child's environment at fork time. Perl provides\
    \ access to the environment through the associative array %ENV. The variable names\
    \ are the keys, and their values are the array values.\n\nFor example: $homedir\
    \ = $ENV{HOME};\n\n![](img/7fc661985e26f441bbcce9ca3c796ad2_225_0.png)\n\n# UNIX\
    \ Multitasking Concepts\n\n- A process in UNIX is an executing program.\n- Each\
    \ process has a unique process id, an integer, called the PID.\n- Each process\
    \ has an environment, which is accessible in Perl through the special associative\
    \ array %ENV.\n- New processes are created by calling the `fork` function.\n-\
    \ When a process creates another, the first is called the parent and the second\
    \ is called the child.\n- The environment of a process is inherited from its parent.\n\
    - A parent runs concurrently with a child. At any time a parent can suspend and\
    \ wait for a child to complete.\n- A process terminates by calling `exit()`, or\
    \ by being killed.\n\n# Notes\n\nThe child is an exact image of the parent except\
    \ for its PID. The fork calls the child in parent and it returns zero in the child.\
    \ Since the code being executed by two processes is identical and both return\
    \ from the fork, the return value from the fork is how each of them determines\
    \ whether they are the parent or child.\n\nYou may be wondering how useful it\
    \ is to create a second process that is an exact image of the parent. Well, child\
    \ branch after the fork will not be executed by the parent, so that code can do\
    \ child-related tasks, parent branch can do parent tasks. This is how examples\
    \ that were discussed a few pages ago are implemented.\n\n```perl\n#!/usr/bin/perl\n\
    # Copy a large file across the background\n# Let the user continue on other things.\n\
    \nprint \"Enter the name of the large file to copy: \";\nchop($biggie = <STDIN>);\n\
    print \"Enter the name of the system to copy to: \";\nchop($destination = <STDIN>);\n\
    \n# Call fork to create another process to do this copy\nif (fork == 0) { # Child\
    \ branch\n    fork($biggie, $destination);\n    print \"$biggie copy complete.\\\
    n\";\n    exit(0);\n} # End of child\nelse { # Parent branch\n    print \"The\
    \ copy of $biggie is underway.\\n\";\n    print \"What should I do now?\\n\";\n\
    \    chop($answer = <STDIN>);\n\n    # ... (ellipsis to indicate parent code)\n\
