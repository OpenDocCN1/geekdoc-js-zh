  - '[PAGE 244]


    # Clients and Servers


    +   - TCP/IP provides peer-to-peer communication, but does not specify when or
    why peer applications interact.


    +   - The fundamental justification for Client/Server computing comes from the
    problem of rendezvous.


    +   - Because TCP/IP does not provide any mechanisms to automatically start programs
    when a message arrives, a program must be waiting to accept requests before they
    arrive.


    +   - Definitions:


    +   - A *client* is an application that initiates peer-to-peer communication in
    pursuit of a service (or services).


    +   - A *server* is a program that waits for service requests from clients and
    processes them. Servers are responsible for:


    Authentication

    Authorization

    Data Security

    Privacy

    Protection

    (And of course, providing the service being requested!)'
  - '[PAGE 245]


    # Notes


    The local-address and remote-address specify the network id and host id of the
    local and remote hosts, in whatever format is defined by the protocol suite. The
    local process and remote process are used to identify the specific processes on
    each system that are involved in the connection, in whatever format is defined
    by the protocol suite.


    A logical choice for the process field in the endpoint would appear to be the
    process id (PID), but this turns out to be inappropriate for two reasons:


    +   1. A client program would not be able to have multiple connections to the
    same server program. By using a different port number for each connection the
    client can do this.


    +   2. Clients don''t know the PIDs of processes on remote machines, so they wouldn''t
    be able to connect to a desired server. The mechanism of well-known port numbers
    solves this.


    The list of well-known ports is kept (on UNIX systems) in the /etc/services file.
    The server computers *and* client computers must have an /etc/services file with
    the same port numbers in them. A client application that is going to access a
    service fills in the half-association for the service desired, and as part of
    the connection mechanism the client-side IP address (assuming TCP/IP) as well
    as ephemeral (temporary) port fills out the rest of the association, thereby establishing
    a unique identifier for the communication link.'
  - '[PAGE 246]


    # Ports and Services


    +   - What is an association?


    To communicate, two processes must establish an association, which is a 5-tuple
    that completely identifies the two processes (a client on one computer and a server
    on another) that make up a connection:


    ```

    {protocol,

    local-address, local process,

    remote-address, remote process}

    ```


    +   - What is an endpoint?


    An endpoint, or socket, (also known as a "half-association"), specifies half of
    a connection is defined as:


    ```

    {protocol, address, process}

    ```


    +   - What is a port?


    A port is an integer that is used to identify a specific process on a computer;
    it is the process member above.


    A **well-known port**, used by server programs, is the identifier of a service
    provided by a machine.


    An **ephemeral port** is used by a client; ephemeral ports are allocated from
    the operating system by the client program, and then returned to the O.S. for
    reuse when the client/server transaction is complete.


    - As we will see later, servers use ephemeral ports sometimes too.'
