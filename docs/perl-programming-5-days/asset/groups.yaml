    \ = <STDIN>; chop $choice;\n```\n\n使用输入操作符 `<` 从文件句柄 `STDIN` 标识的文件中读取一行到变量 `$choice`\
    \ 中。`chop` 函数删掉从 `STDIN` 读取并存储在 `$choice` 中的换行符。\n\n这一行：\n\n```\nlast if $choice\
    \ eq \"e\";\n```\n\n如果用户选择了退出，则该行将使用 Perl 控制流语句 `last` 退出 `for` 循环。如果我们没有删掉换行符，我们应该写成：\n\
    \n```\nlast if $choice eq \"\\n\";\n```\n\n根据 `$choice` 设置变量 `$command` 后，再次调用\
    \ `system()` 函数执行该命令。\n\n最后，这一行：\n\n```\n<STDIN>;\n```\n\n简单地从标准输入读取一行。其意图是等待用户按下\
    \ `<Enter>` 键后再清屏并重新显示菜单。独立的 `<STDIN>` 实际上读取了一行并将其丢弃。\n\n注意，每个简单语句必须以分号结束。复合语句（用大括号括起来的一系列简单语句）不需要分号结束。\n\
    \n# 另一个示例程序\n\n```perl\n#!/usr/bin/perl\n# File: menu.pl\n\nfor (;;) {\n    system(\"\
    clear\");      # 清屏\n    print \"\\n\\n\";\n    print \" l. List Files\\n\";\n\
    \    print \" p. Print Working Directory Name\\n\";\n    print \" w. List Users\
    \ Logged On\\n\";\n    print \" e. Exit Menu\\n\";\n    print \"\\n\\n\";\n  \
    \  print \" Enter choice: \";\n    $choice = <STDIN>; chop $choice;\n    last\
    \ if ($choice eq \"e\");\n\n    if ($choice eq \"l\") { $command = \"ls\"; }\n\
    \    elsif ($choice eq \"p\") { $command = \"pwd\"; }\n    elsif ($choice eq \"\
    w\") { $command = \"who\"; }\n    else { next; }\n\n    print \"\\n\\n\";\n  \
    \  system($command);\n    print \"\\n\\n\";\n}\n\nprint 'Hit <Enter> to continue:';\n\
    \n<STDIN              # 等待回车键\n```\n\n# Notes\n\n@ARGV 数组存储了命令行参数。`foreach` 循环将参数的值赋值给\
    \ $word，循环的每次迭代处理一个参数。\n\n这一行：\n\n```\nopen(PIPE,\"find . -print |\") || die \"\
    Pipe open failed\";\n```\n\n将 PIPE 文件句柄连接到管道的输出，每当输入操作符 `<>` 对文件句柄进行操作时，就会从管道中读取信息。\n\
    \n这一行：\n\n```\n@files = <PIPE>;\n```\n\n将 `find` 命令的全部输出读取到数组 `$files` 中，每行输出被分配给数组的每个元素。如果该行写的是：\n\
    \n```\n$files = <PIPE>;\n```\n\n那么只有一行会被从管道读取到标量变量 `$files` 中。这是因为数组上下文和标量上下文之间的区别，我们将在稍后详细讨论。\n\
    \n下一个循环将把 `$files` 的数组元素逐个赋值给标量变量 `$filename`。这正是外层循环对 @ARGV 数组所做的事情。在循环的每次迭代中，$filename\
    \ 变量都将赋值为文件路径（来自 `find` 命令的一行输出）。\n\n`chop` 操作符（又名 chop 函数）删掉 `$filename` 字符串的最后一个字符（这将是一个换行符），然后\
    \ `-T` 测试检查 `$filename` 中指定的文件是否为文本文件。如果是，则创建一个名为 THIS 的句柄，打开文件并与打开的文件关联。\n\n\
    `while` 循环通过在 THIS 上使用输入操作符 `<>` 将标量变量 `$line` 的值设置为打开文件的每一行，这会从其执行的文件中读取一行。注意\
    \ `$line` 是一个标量，因此 `<THIS>` 操作的上下文是标量上下文。\n\n这一行：\n\n```\nif ($line =~ /^\\$/);\n\
    ```\n\n检查 `$line` 变量是否出现模式 `$word`（即当前的命令行参数）。`~=` 是模式操作符，而 `/^\\$/` 是一个正则表达式。\n\
    \n最后，注意在 `print` 语句中，即使 $filename 和 $line 变量被包含在双引号中，它们的值仍然会被使用。Perl 将此称为插值（interpolation）。Shell\
    \ 则称为“弱引用”。\n\n关于处理器的几句话。在 Perl 中，通过调用 `open` 函数将文件与文件句柄关联。文件打开后，所有文件操作都通过引用文件句柄完成。例如：\n\
    \n```perl\nopen(BOOKFILE,\"books\"); # 打开文件 \"books\"，关联到句柄 BOOKFILE\n$book =\
    \ <BOOKFILE>; # 使用输入操作符 <> 读取一行\nclose(BOOKFILE);\n```\n\n请参考 Perl 书获取描述。\n\n\
    # 另一个示例\n\n```perl\n#!/usr/bin/perl\n# File: dgrep.pl\n# 一个程序用于：\n# 1) 打开管道\n\
    # 2) 查找当前目录下所有文件\n# 3) 指定目录\n# 4) 打印文本文件\n# 5) 包含单词\n# 6) 命令行指定\n\nopen(PIPE,\"\
    find . -print |\") || die \"Pipe open failed\";\n@files = <PIPE>;\nchop @files;\n\
    \nforeach $word (@ARGV) {\n    foreach $filename (@files) {\n        if (-T $filename)\
    \ {\n            open(THIS,$filename) || die \"Open failed\";\n            while\
    \ ($line = <THIS>) {\n                if ($line =~ /$word/) {\n              \
    \      print \"$filename: $line\\n\";\n                }\n            }\n    \
    \        close(THIS);\n        }\n    }\n}```\n\n# Notes\n\n目前有两个版本的 Perl 可用：Perl4\
    \ 和 Perl5。本文关注通用特性，但也涵盖了许多仅 Perl5 可用的功能。\n\n# Lab\n\n1. 特殊变量 $_ 的意义是什么？\n2. 写一个打印命令行参数的程序（Solution:\
    \ args.pl）。\n3. 如果在 dgrep.pl 的每个 foreach 循环中使用自动设置变量 $_ 而不是显式变量 $word 和 $filename，会发生什么？\n\
    4. 修改 menu.pl 程序，使其提示用户输入命令并执行该命令（Solution: cmd.pl）。\n5. 写一个程序打开文件并循环读取文件的每一行到变量中，打印该变量并在行前加上行号（Solution:\
    \ liner.pl）。\n\n"
