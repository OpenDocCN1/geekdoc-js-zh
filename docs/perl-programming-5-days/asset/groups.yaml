    # Notes


    $ARRAY returns the subscript of the last element of @ARRAY, not the number of
    elements in @nARRAY.


    ```

    @greetings = ("hi", "hello", "howdy");

    print "\$greetings[$\$greetings]\n";    # howdy

    ```


    Modifying $$ARRAY changes the length of @ARRAY. The push, pop, shift, and unshift
    functions take this of.


    A pop implementation using Perl operators (Note: the native pop is faster):


    ```

    $val = $array[$#array];  #array--;

    ```


    A push implementation:


    ```

    $array[++\$array] = $val;  # Note preincrement

    ```'
