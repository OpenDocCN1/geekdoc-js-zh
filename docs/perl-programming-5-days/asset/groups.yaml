- md: "\n## Passing Names\n\n- The `@_` array contains references to scalar or array\
    \ arguments.\n- This allows you to modify the values of scalars or array elements\
    \ that are passed in.\n- But if you wish to modify the size of an array, you must\
    \ pass its name using the `*` operator.\n- `*NAME` (called a typeglob) containing\
    \ actual symbol table pointers of all data types named `*NAME`: scalars, arrays,\
    \ filehandles, subroutines, etc.\n\nHere's how to use it:\n\n```perl\n#!/bin/perl\n\
    # File: names.pl\n\n@a = (1,2,3);\n&thing(*a); # Pass everything named 'a'\nprint\
    \ \"main a: @a\\n\";\nsub thing {\n    # Catch everything named 'a'\n    local(*b)\
    \ = @_;\n\n    # Refer to the array named 'a'\n    unshift(@b, 'P'); # Modifies\
    \ $$a\n}\n```\n\n#\n\n# Returning Values\n\n# Notes\n\nThe expression returning\
    \ the return value will be evaluated in a scalar context if the subroutine was\
    \ called in a scalar context, and in an array context if called in an array context.\n\
    \n# Returning Values\n\nReturn values can be either scalar values or array values.\n\
    \n```perl\n#!/usr/bin/perl\n# File: subby.pl\n\n$num = \\&subby;\n@num = \\&subby;\n\
    print \"$num : @num\\n\";\n\nsub subby {\n    local(@array) = ('book', 'mag',\
    \ 'news');\n\n    # What will be returned? Why?\n    return @array;\n}\n```\n\n\
    - Perl returns the array as a list, which creates the \"list in a scalar context\"\
    \ problem we saw in Chapter 4.\n- Since this may return the first or last element,\
    \ or the number of elements in the list, you should always catch the return as\
    \ an array to be sure.\n\n# Lab\n\n- 1. What happens if a reference to a non-local\
    \ variable in a subroutine is the first reference to that variable in the entire\
    \ program? (Solution: `vref.pl`)\n- 2. Write a program that calls a subroutine\
    \ to open a file where the file name is passed as an argument to the subroutine,\
    \ and the filehandle is the same name as the file name. Return the filehandle\
    \ to the main program and verify successful read from the file in the main. (Solution:\
    \ `fname.pl`)\n- 3. Write a modular program with no global variables that:\n \
    \ a) calls one subroutine to open the files named in the file 'control',\n  b)\
    \ calls a second to read all the numbers from each file, and calculate several\
    \ sums: one per file, and total,\n  c) calls a third to display a table of the\
    \ results.\n(Solution: `sums.pl`)\n\n## Chapter 10 - Quoting and Interpolation\n\
    \n## Chapter Objectives\n\n- Use the three different forms of quoting.\n- Take\
    \ advantage of the rich set of interpolation control characters.\n- Use `join`\
    \ as an alternative to array interpolation.\n- Use `join` to create delimited\
    \ records.\n- Create and use here documents as a form of multi-line quoting.\n\
    \n# Notes\n\nString literals can be more than one line long. The newline characters\
    \ will become part of the string just like any other character, except you can't\
    \ see them. The only way you know that a string has a newline is because a newline\
    \ appears within the string!\n\n```perl\n#!/bin/perl\n# File multi.pl\n\n$multi\
    \ = \"This is what may\nbe called a string paragraph.\nClever, eh\";\n\nprint\
    \ $multi, \"\\n\";\n```\n\nWhy do we need to quote these string literals anyway?\n\
    \nIn order for the Perl program to be able to tell what you want it to do, often\
    \ you must give it specific instructions. By putting quotes around a string of\
    \ characters, you are doing several things: telling Perl to treat these characters\
    \ as a single data object; to interpret certain things (notably \\n) as having\
    \ special meaning; and telling Perl to treat the string as literal characters.\
    \ If you didn't quote a string, Perl might think you are talking to filehandles,\
    \ or calling certain functions. Quoting is important!\n\n# String Literals\n\n\
    - A string literal is a sequence of characters enclosed (delimited by) single\
    \ or double quotes.\n- Substitutions can occur inside double-quoted strings.\n\
    - A substitution replaces certain characters in the string with something else.\n\
    - Example\n\n```perl\n$$v = \"hello\";\nprint \"$v\", \"\\n\";   # a list\nprint\
    \ \"$v\\n\";                   # a scalar\n```\n\n```perl\nprint '$$v', \"\\n\"\
    ;   # Single quotes\nprint '$$v\\n';                   # What???\n```\n\n- Which\
    \ \"certain characters\" in the example were replaced? Which weren't?\n- Perl\
    \ calls substitution \"interpolation\".\n- An array inside double quotes is turned\
    \ into a constant string and will be dealt with in a scalar context:\n\n```perl\n\
    $line = \"@date\";\n```\n\n- Elements of the array are normally separated by single\
    \ spaces.\n\n# Notes\n\nBackslash characters\n\n- \\n Newline (line feed)\n- \\\
    r Return\n- \\t Tab\n- \\f Form feed\n- \\b Backspace\n- \\nnn Octal representation\
    \ of ASCII (1,2, or 3 digits)\n- \\xnn Hex representation of ASCII\n- \\cX Control\
    \ character\n- \\u Force next to upper\n- \\l Force next to lower\n- \\U Force\
    \ next to upper\n- \\L Force next to lower\n- \\E End\n- \\v Vertical tab\n- \\\
    a Bell\n- \\e Escape\n- \\Q Quote\n- \\x Hex representation\n- \\C Control character\n\
    - \\B Backspace\n- \\f Form feed\n- \\r Return\n- \\n Newline\n- \\t Tab\n\n#\
    \ Interpolation\n\n- Two types of interpolation: backslash and variable substitution.\n\
    - Variable substitution requires braces around the identifier if it follows immediately:\n\
    \n```perl\n$prefix = \"hot\";\nprint \"${prefix}\\n\";\n```\n\n- Backslash substitution\n\
    \n- Special variables like $ can do many things. For example, if you use it in\
    \ a string, it will show the output separator.\n\n```perl\nprint \"Fine.\";\n\
    ```\n\n- When the first time Perl sees an @ sign inside a double-quoted string,\
    \ it assumes it's intended to be a literal:\n\n```perl\n$ = \"@array\";\n```\n\
    \nIn fact, you can't even assign inside double quotes because the @ sign is a\
    \ literal:\n\n```perl\nprint \"@array = (1,2,'a')\";\n```\n\nHere's a nifty trick\
    \ to print an array as a comma-separated list:\n\n```perl\n#!/usr/bin/perl\n#\
    \ File: quoter.pl\n\nopen(PW, \"/etc/passwd\") || die \"Can't open the password\
    \ file.\\n\";\n$oldsep = $/; # Save this for later.\n$/ = '/'; # Change array\
    \ interpolation string\nwhile ($record = <PW>) {\n  chomp $record;\n  $record\
    \ = \"$record\"; # Outside quotes for 1st & last fields.\n  @rec = split(/:/,\
    \ $record); # Split into array.\n  print \"@rec\\n\"; # Interpolate with modified\
    \ $\n}\nclose(PW);\n```\n\n```perl\n$/ = $oldsep; # Restore original $ for later\
    \ use in script.\n```\n\n# Array Substitution\n\n- Array elements are scalars\
    \ so they are interpolated like any other scalar.\n\n$end = \"Last array value\
    \ is $array[#array]\\n\";\n\n- When entire arrays are interpolated, their elements\
    \ are separated by the contents of the special variable $, whose default value\
    \ is a single space.\n\n- The join function could do the above as follows:\n\n\
    ```perl\n$spaced_out = join(\" \", @array);\n$colons_sep = join(\":\", @array);\n\
    print join(\"--\", @array), \"\\n\";\n```\n\n# Notes\n\nIn double quotes, backslashes:\n\
    \n1. Make a non-printable character (as in \\n or \\t).\n2. Turn on/off upper\
    \ or lower case (\\U, etc.).\n3. Quote (i.e., remove any special meaning of) the\
    \ next character.\n\nIn single quotes, backslashes:\n\n1. Quote backslashes: \\\
    \\\n2. Quote single quotes: \\'\n"
  mdcn: "\n\n## 传递名称\n\n- `@_` 数组包含了对标量或数组参数的引用。\n- 这允许你修改传入的标量值或数组元素的值。\n- 但如果你想修改数组的大小，必须使用\
    \ `*` 操作符传递它的名称。\n- `*NAME`（称为类型通配符 typeglob）包含所有名为 `*NAME` 的数据类型的实际符号表指针：标量、数组、文件句柄、子例程等。\n\
    \n以下是使用方法：\n\n```perl\n#!/bin/perl\n# File: names.pl\n\n@a = (1,2,3);\n&thing(*a);\
    \ # 传递所有名为 'a' 的内容\nprint \"main a: @a\\n\";\nsub thing {\n    # 捕获所有名为 'a' 的内容\n\
    \    local(*b) = @_;\n\n    # 引用名为 'a' 的数组\n    unshift(@b, 'P'); # 修改 $$a\n}\n\
    ```\n\n#\n\n# 返回值\n\n# 注意事项\n\n如果子程序是在标量上下文中被调用的，则返回值的表达式将在标量上下文中求值；如果是在数组上下文中调用的，则在数组上下文中求值。\n\
    \n# 返回值\n\n返回值可以是标量值也可以是数组值。\n\n```perl\n#!/usr/bin/perl\n# File: subby.pl\n\n\
    $num = \\&subby;\n@num = \\&subby;\nprint \"$num : @num\\n\";\n\nsub subby {\n\
    \    local(@array) = ('book', 'mag', 'news');\n\n    # 将返回什么？为什么？\n    return\
    \ @array;\n}\n```\n\n- Perl 将数组作为列表返回，这产生了我们在第四章中看到的“标量上下文中的列表”问题。\n- 由于这可能会返回第一个元素、最后一个元素或列表元素数量，你应该始终以数组形式接收以确保。\n\
    \n# 实验\n\n- 1. 如果子程序中非局部变量的引用是该变量在整个程序中的第一个引用会发生什么？（解决方案：`vref.pl`）\n- 2. 编写一个程序调用子程序打开一个文件，文件名作为参数传递，文件句柄名称与文件名相同。将文件句柄返回给主程序，并在主程序中验证是否成功从文件中读取。（解决方案：`fname.pl`）\n\
    - 3. 编写一个没有全局变量的模块化：\n  a) 调用一个子程序打开'control' 文件中命的文件，\n  b) 调用第二个子程序读取每个文件的所有数字，并计算几个和：每个文件一个，以及总计，\n\
    \  c) 调用第三个子程序显示结果表格。\n（解决方案：`sums.pl`）\n\n## 第10章 - 引用与插值\n\n## 章节目标\n\n- 使用三种不同的引用形式。\n\
    - 利用丰富的插值控制字符集。\n- 使用 `join` 作为数组插值的替代方案。\n- 使用 `join` 创建分隔符记录。\n- 创建并使用“在此文档”（here\
    \ documents）作为多行引用的形式。\n\n# 注意事项\n\n字符串字面量可以长多行。换行符将成为字符串的一部分，就像其他字符一样，只是你看不见它们。你知道字符串包含换行的唯一方法是因为字符串内部出现了换行符！\n\
    \n```perl\n#!/bin/perl\n# File multi.pl\n\n$multi = \"This is what may\nbe called\
    \ a string paragraph.\nClever, eh\";\n\nprint $multi, \"\\n\";\n```\n\n我们到底为什么要引用这些字符串字面量呢？\n\
    \n为了让 Perl 程序能够判断你想让它做什么，通常必须给它提供特定的指令。通过在字符字符串加上引号，你正在做几件事：告诉 Perl 将这些字符视为单个数据对象；将某些内容（特别是\
    \ \\n）解释为特殊含义；并告诉 Perl 将字符串视为字面字符。如果你不给字符串加引号，Perl 可能会认为你正在操作文件句柄，或调用某些函数。引用是非常重要的！\n\
    \n# 字符串字面量\n\n- 字符串字面量是用单引号或双引号包围（定界）的字符序列。\n- 双引号字符串内部可以发生替换。\n- 替换会将字符串中的某些字符替换为其他内容内容。\n\
    - 示例\n\n```perl\n$$v = \"hello\";\nprint \"$v\", \"\\n\";   # 一个列表\nprint \"$v\\\
    n\";                   # 一个标量\n```\n\n```perl\nprint '$$v', \"\\n\";   # 单引号\n\
    print '$$v\\n';                   # 什么什么？？\n```\n\n- 示例中的哪些“某些字符”被替换了？哪些没有？\n\
    - Perl 将替换称为“插值”（interpolation）。\n- 双引号内的数组会被转换为常量字符串，并在标量上下文中进行处理：\n\n```perl\n\
    $line = \"@date\";\n```\n\n- 数组元素通常由单空格分隔。\n\n# 注意事项\n\n反斜杠字符\n\n- \\n 换行（行符）\n\
    - \\r 回车\n- \\t 制表符\n- \\f 换页符\n- \\b 退格\n- \\nnn ASCII 的八进制表示（1、2 或 3 位数字）\n\
    - \\xnn ASCII 的十六进制表示\n- \\cX 控制字符\n- \\u 强制后续为大写\n- \\l 强制后续为小写\n- \\U 强制后续为大写\n\
    - \\L 强制后续为小写\n- \\E 结束\n- \\v 垂直制表符\n- \\a 铃声\n- \\e 转义键\n- \\Q 引用\n- \\x 十六进制表示\n\
    - \\C 控制字符\n- \\B 退格\n- \\f 换页符\n- \\r 回车\n- \\n 换行\n- \\t 制表符\n\n# 插值\n\n- 两种插值类型：反斜杠和变量替换。\n\
    - 变量替换在紧跟标识符时需要括号：\n\n```perl\n$prefix = \"hot\";\nprint \"${prefix}\\n\";\n```\n\
    \n- 反斜杠替换\n\n- 特殊变量如 $ 可以执行很多操作。例如，如果你在字符串中使用它，它将显示分隔符。\n\n```perl\nprint \"Fine.\"\
    ;\n```\n\n- 当 Perl 在双引号字符串第一次看到 @ 符号时，假设它是字面量：\n\n```perl\n$ = \"@array\";\n```\n\
    \n事实上，你甚至不能在双引号内赋值，因为 @ 符号是字面量：\n\n```perl\nprint \"@array = (1,2,'a')\";\n```\n\
