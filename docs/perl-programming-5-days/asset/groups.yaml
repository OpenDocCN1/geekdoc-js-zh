  - '[PAGE 69]


    # Notes


    Actually, the print function can take an optional first parameter before the list
    of items to print. The optional first parameter is a filehandle (or a scalar variable
    containing the name of a filehandle) that tells the function where to send the
    output. If the first parameter is omitted, the function outputs to the currently
    selected filehandle, which is initially STDOUT when a program starts. We will
    talk about filehandles in the next chapter.


    The point to be made here is that the optional first parameter is not part of
    the list of print items, so do not put a comma after it. If you do, and Perl can
    detect that it is a filehandle, your program won''t compile or run - you will
    get an error message on that line. If the first parameter is an indirect filehandle,
    i.e., a scalar variable containing the name of a filehandle, Perl won''t be able
    to tell that it is a filehandle and it will print the contents of the variable
    as part of the list of print items to the currently selected filehandle.


    Final comment: most perl functions can be called with or without parentheses around
    the parameters.


    Consider:


    ```

    #!/usr/bin/perl


    print STDOUT "hello there\n", "second line\n"; # No parens around parms

    print (STDOUT "hello there\n", "second line\n");# Parens around parms

    $f = "STDOUT"; # Set $f to contain the name of the STDOUT filehandle

    print ($f "hello there\n", "second line\n"); # No comma after $f

    print ($f,"hello there\n","second line\n"); # Comma after $f

    ```


    Output:


    ```

    hello there

    second line

    hello there

    second line

    hello there

    second line

    STDOUThello there

    second line

    ```


    The following would result in an error before runtime:


    ```

    print (STDOUT, "hello there\n", "second line\n"); # Parens around parms

    ```'
- md: "\n## The print Function\n\n- The print function prints a string or a list of\
    \ strings.\n- print concatenates the strings in the list.\n- Look carefully at\
    \ the following:\n\n```perl\n# Print: hellothere\nprint(\"hello\", \"there\",\
    \ \"\\n\"); # Comma-separated list\nprint(\"hello\", \"there\", \"\\n\"); # Same,\
    \ but parentheses\n# not needed (Why not?)\n```\n\n```perl\n# Print: hello there\n\
    print(\"hello\", \"there\", \"\\n\"); # Space in \"hello\"\nprint @array;\n```\n\
    \n```perl\n# Print @array elements, no spacing\nprint @array;\n```\n\n```perl\n\
    # Print @array elements, interpolate spacing\n#(Perl just does this)\nprint \"\
    @array\";\n```\n\n```perl\n# Print @array elements, interpolate spacing and\n\
    # do a newline\nprint \"@array\\n\";\n```\n\n- Perl also has the printf (print\
    \ formatted) function, which works just like C's.\n\n```perl\nprintf(\"%04d %4.4f\
    \ %s\\n\", 42, 42, 42);\n```\n\n## Notes\n\nIt's about time we look more closely\
    \ at the chop function (if you haven't already looked it up.) chop simply removes\
    \ the last character of its string argument.\n\n```perl\n$fish = \"trouts\";\n\
    chop $fish; # $fish is now \"trout\"\n```\n\nThe chop function returns the character\
    \ it chopped off.\n\nIf its argument is a list, then chop chops the last character\
    \ off each element of the list.\n\n```perl\n@plural = ('cats', 'dogs', 'frogs');\n\
    @singular = chop @plural;\n```\n\nBecause Perl preserves the trailing newline\
    \ character when it reads a line from a file or from standard input, chop has\
    \ traditionally been used to chop off the newline.\n\n```perl\n$choice = <STDIN>;\n\
    chop $choice;\n```\n\nNow, if there is no trailing newline character, chop will\
    \ chop off whatever character it finds at the end of the string. You have to be\
    \ careful that you chop only where it is needed.\n\nPerl adds the chop function.\
    \ chop does the same thing as chop, but is safer because it chops, er, that is,\
    \ chops, off the last character only if that character is a newline. So, you are\
    \ less likely to remove a significant character from the end of a string.\n\n\
    The special variable /, the input record separator, is actually what chop looks\
    \ for and chops off. Look up both chop and the $/ variable in the Perl book.\n\
    \n## File Operation Functions\n\n- Nearly all return scalars: which ones don't?\n\
    - If you don't know UNIX then you must learn it here!\n- Some useful functions:\n\
