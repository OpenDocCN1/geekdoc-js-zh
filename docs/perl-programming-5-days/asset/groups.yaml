- md: "\n# Library Donation Form\n\nDate: Apr 29, 2019\nName of Donor: Sahnova, Jane\n\
    Publication date: 1998/99\nWas item purchased: [Y / N]\nComplimentary copy from\
    \ publisher: [Y/N]\nNotes: NAS\n\n# Arrays and Hashes 41\n\nLibrary Information:\n\
    No. of copies in the collection:\nASH____ PROG____\nSAC____ STC____\n\nSend for\
    \ Cataloguing ____\nBook Sale ____\n\n- Use array slices.\n- Splice into an array\
    \ with new data.\n\n# Notes\n\nRefer to individual values of the array elements\
    \ by numeric subscript, replacing the @ with $.\n\n```\n$freshest = $candy[1];\n\
    ```\n\nIf you forget to use $ instead of @, this statement still appears to work,\n\
    \n```\n$freshest = @candy[1];\n```\n\nHowever, something different is happening\
    \ here (called an *array slice* - more in a few pages...). The value on the right\
    \ is then a *list* value, rather than a scalar - a list of just one element: ($candy[1]).\
    \ Since the variable on the left is a scalar, the list value on the right is then\
    \ evaluated in scalar context. Recall that a *list* value in scalar context yields\
    \ the list last value, so the two statements above have the same side side effects,\
    \ but for different reasons.\n\n# Arrays\n\n- A Perl array variable stores an\
    \ ordered set of scalar values.\n\n@candy = ( 'Pez', 'Mentos', 'Altoids', 'Smarties'\
    \ );\n- Array subscripts start at 0 (just like in C).\n  - The Perl special variable\
    \ $[ actually controls the base subscript of arrays in your program.\n- Refer\
    \ to the entire array with the array name, which always starts with @.\n\npush\
    \ @candy, ( 'M&M', 'Goobers' );\n- Refer to individual elements of the array elements\
    \ by numeric subscript, replacing the @ with $.\n\n$freshest = $candy[1];\n- $@arrayname\
    \ contains the subscript of the array's last element.\n  - So, $arrayname[$arrayname]\
    \ is always the last element of $@arrayname.\n  - Since Perl array indices start\
    \ at 0, $@arrayname is one less than the number of elements in @arrayname (as\
    \ long as you don't mess with ${})\n- Remember that an array name (starting with\
    \ @) in scalar context yields the number of elements in the array.\n  - This is\
    \ just a convenient feature of Perl array variables.\n\n# Notes\n\n```\n#!/usr/bin/perl\n\
    # File: args.pl\n\n# foreach loop to print out command line args\n--------------------\n\
    print \"foreach: \";\nforeach $a (@ARGV) { # $a is a scalar, @ARGV is an array\n\
    \    print \"$a\";\n}\nprint \"\\n\";\n\n# ranged for loop\n-----------------\n\
    print \"ranged for: \";\nforeach $i (0..$ARGV) { # $i is a scalar, 0..$ARGV is\
    \ a list\n    print \"$ARGV[$i]\";\n}\nprint \"\\n\";\n\n# indexed for loop\n\
    ----------------\nprint \"indexed for: \";\nfor ($i = 0; $i<=$ARGV; $i++) {\n\
    \    print \"$ARGV[$i]\";\n}\nprint \"\\n\";\n\n# Interpolated array\n----------------\n\
    print \"interpolated array: \";\nprint \"@ARGV\\n\"; # Double quotes ensure spaces\
    \ in output\n\n# Uninterpolated array\n----------------\nprint \"uninterpolated\
    \ array: \";\nprint @ARGV, \"\\n\"; # No spaces in output\n\n# while loop (last\
    \ in program because shift wipes out @ARGV)\nprint \"while: \";\nwhile (@ARGV)\
    \ { # while loop returns false after shift exhausts @ARGV\n    $arg = shift @ARGV;\n\
    \    print $arg, \" \";\n}\nprint \"\\n\"\n\n args.pl one three four\nforeach:\
    \ one three four\nranged for: one three four\nindexed for: one three four\ninterpolated\
    \ array: one three four\nuninterpolated array: one three four\nwhile: one three\
    \ four\n\n# Example - The @ARGV Array\n\n- Consider the array @ARGV, the list\
    \ of command line arguments.\n\nARGV[0] is the first element\n$ARGV[$#ARGV] is\
    \ the last element, because #ARGV is the subscript of the last element\n- The\
    \ following constructs using @ARGV. These types of constructs will work with any\
    \ array.\n- See the Perl shift function.\n- Question: Why does the 'while' loop\
    \ eventually stop?\n- Answer: The while statement while (@ARGV) operates in scalar\
    \ context. @ARGV, in scalar context, returns the number of elements in the array.\
    \ The shift operator decrements that number each time.\n- Perl supports multi-dimensional\
    \ array syntax:\n\n```perl\n$ARRAY[3] = \"xyz\";\n```\n\n# Notes\n\n$ARRAY returns\
    \ the subscript of the last element, not the number of elements in @greetings.\n\
    \n```\n@greetings = (\"hi\", \"hello\", \"howdy\");\nprint \"$greetings[$#greetings]\\\
    n\"; # howdy\n```\nModifying @greetings changes the length of @greetings. The\
    \ push, pop, and unshift functions take this.\n\nA pop implementation using Perl\
    \ operators (Note: the native pop is faster):\n\n```\n$val = $array[$#array];\
    \ # array--;\n```\n\nA push implementation:\n\n```\n$array[++array] = $val; #\
    \ Note preincrement\n```\n\n# Array and List Functions\n\n- pop (@a) returns the\
    \ last (right) element of @a, shortening @a by 1.\n  - Same as: $var = $a[$#a--]\n\
    - push (@a, LIST) pushes all values in LIST onto the end of @a.\n  - The length\
    \ of @a is increased by the length of values of LIST.\n- shift (@a) is like pop\
    \ (@a) on the left end of @a.\n- shift (@a, LIST) is like push (@a, LIST) on the\
    \ left end of @a.\n\n# Notes\n\n```\n# Get first three and last two\n@new = @arr[0..2,\
    \ $arr-1, $arr];\n```\n\n```\n# But what's this? It's the value of the last element\
    \ in the list.\n$new = @arr[0..2, $arr-1, $arr]; # Same as $arr[$arr]\n```\nRegarding\
    \ the last example, when a list is used in a scalar context, it returns the value\
    \ of the last element of the list, BUT for comma separated lists.\n\nIf the list\
    \ is generated by the range operator, but it is in a scalar context, then the\
    \ range operator will behave as a scalar range operator. In the last example,\
    \ the range operator is part of a list (the one inside the brackets) so it acts\
    \ like an array context range operator, but the entire expression is in a scalar\
    \ context because the entire expression is an assignment to a scalar.\n\nAnother\
    \ interesting function is splice(). It allows you to replace an interior section\
    \ of an array with a new list of data objects. The generalized syntax is\n\n```\n\
    splice (target_array, start_index, num_elem, list)\n```\n\nThe line\n\n```\n@old\
    \ = splice (@array, 4, 9, @extra);\n```\n\nwill remove the elements indexed 4\
    \ through (4+9) in the array @array, and put in their place the list derived from\
    \ the array @extra. splice returns the elements removed.\n\n# Array Slices\n\n\
    - An array slice is a list that is created by extracting selected elements of\
    \ an array.\n- The elements are not necessarily contiguous.\n- If the slice that\
    \ you want to extract from an array consists of contiguous elements, then you\
    \ can use the range operator to select the slice.\n- Otherwise, just list the\
    \ element indices separated by commas.\n\n```\n# Same as @arr[3..5], or ($arr[3],\
    \ $arr[4], $arr[5])\n@new = @arr[3,4,5];\n\n# First and last. Same as ($arr[0],\
    \ $arr[#arr])\n@new = @arr[0,$#arr];\n\n# The entire array ($arr[..#arr])\n@new\
    \ = @arr;\n```\n\n# Notes\n\nTo specify a slice, you use the array name, with\
    \ brackets which contain the subscripts.\n\n```\n@arr[4] # An array slice, with\
    \ one element.\n```\nThe 5th of @arr.\n\nNormal arrays are named lists of single\
    \ elements, indexed by position. Hashes are named lists of pairs, known as 'key,value'\
    \ pairs. Additional example:\n\n```\n#!/usr/bin/perl\n# File: birth.pl\n\n@ARGV\
    \ = 1 && die \"Usage: $0 name\\n\";\n%birth = ('mom', 'dad', 'Oct 5', 'Nov 7',\
    \ 'bro', 'May 25', 'sis', 'Jun 4');\n%birth('son') = 'Jan 22';\n$birth('daughter')\
    \ = 'Sep 2';\n\nprint \"$birth{ARGV[0]}\\n\"; # Select an index on the command\
    \ line\n```\n\nPerl offers alternate syntax for the comma operator (yes, it is\
    \ actually an operator.)\nThe new syntax is to use \"equals greater-than\":\n\n\
    ```\n=>\n```\n\nin place of the comma. Both => and , do the same thing, but using\
    \ the => form in certain places (especially in object oriented code) makes for\
    \ easier reading and understanding of what exactly is going on.\n\nIn the above\
    \ example, you would say\n\n```\n%birth = ('mom' => 'Oct 5', 'dad' => 'Nov 7',\
    \ 'bro' => 'May 25', 'sis' => 'Jun 4');\n```\n\nIt makes it more readable.\n\n\
    # Hashes\n\n- Hashes are easy to learn about and use.\n- Normal arrays are indexed\
    \ by number (typically starting at 0).\n\n```\n@thing = ('one', 'two', 'three');\n\
    print $thing[1];   # Prints 'two'\n```\n\n- Hashes use strings as indices.\n-\
    \ Note that you refer to an entire hash with a percent sign, %, as opposed to\
    \ an @ sign for a normal array.\n- Also, you access individual elements with curly\
    \ braces as opposed to brackets.\n"
  mdcn: "\n\n# 图书捐赠表\n\n日期：2019年4月29日\n捐赠者姓名：Sahnova, Jane\n出版日期：1998/99\n物品是否购买：[是\
    \ / 否]\n出版商赠送副本：[是/否]\n备注：无\n\n# 数组与哈希表 41\n\n图书馆信息：\n馆藏副本数：\nASH____ PROG____\n\
    SAC____ STC____\n\n送往编目处 ____\n书刊义卖 ____\n\n- 使用数组切片（array slices）。\n- 使用新数据拼接数组（splice）。\n\
    \n# 笔记\n\n通过数字下标引用数组元素的单独值，将 @ 替换为 $。\n\n```\n$freshest = $candy[1];\n```\n\n\
    如果你忘记使用 $ 而不是了 @，这句语句看起来仍然可以工作：\n\n```\n$freshest = @candy[1];\n```\n\n然而，这里发生了一些不同的事情（被称为*数组切片*\
    \ - 更多信息见后几页……）。右侧的值是一个*列表*（list）值，而不是标量——一个仅包含一个元素的列表：($candy[1])。由于左侧变量是标量，右侧的列表值在标量上下文中求值。记住，标量上下文中的*列表*值产生列表最后一个值，因此上述两个语句具有相同的副作用，但原因不同。\n\
    \n# 数组\n\n- Perl 数组变量存储了一个有序的标量值集合。\n\n@candy = ( 'Pez', 'Mentos', 'Altoids',\
    \ 'Smarties' );\n- 数组下标从 0 开始（就像 C 语言一样）。\n  - Perl 特殊变量 $[ 实际上控制你程序中数组的基础下标。\n\
    - 使用数组名引用整个数组，数组名始终以 @ 开头。\n\npush @candy, ( 'M&M', 'Goobers' );\n- 通过数字下标引用数组元素的单独值，将\
    \ @ 替换为 $。\n\n$freshest = $candy[1];\n- $@arrayname 包含数组最后一个元素的下标。\n  - 所以，$arrayname[$#arrayname]\
    \ 始终是 $@arrayname 的最后一个元素。\n  - 于 Perl 数组索引从 0 开始，$@arrayname 比 @arrayname 中的元素个数少\
    \ 1（只要你没有动过 ${}）。\n- 记住在标量上下文中，以 @ 开头的数组名会产生数组中的元素个数。\n  - 这仅仅是 Perl 数组变量的一个方便特性。\n\
    \n# 笔记\n\n```\n#!/usr/bin/perl\n# File: args.pl\n\n# 使用 foreach 循环打印命令行参数\n--------------------\n\
    print \"foreach: \";\nforeach $a (@ARGV) { # $a 是标量，@ARGV 是数组\n    print \"$a\"\
    ;\n}\nprint \"\\n\";\n\n# 范围 for 循环\n-----------------\nprint \"ranged for: \"\
    ;\nforeach $i (0..$ARGV) { # $i 是标量，0..$ARGV 是一个列表\n    print \"$ARGV[$i]\";\n\
    }\nprint \"\\n\";\n\n# 索引 for 循环\n----------------\nprint \"indexed for: \";\n\
    for ($i = 0; $i<=$ARGV; $i++) {\n    print \"$ARGV[$i]\";\n}\nprint \"\\n\";\n\
    \n# 插值数组\n----------------\nprint \"interpolated array: \";\nprint \"@ARGV\\n\"\
