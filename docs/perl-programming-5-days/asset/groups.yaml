    $pet(\"snake\") = \"Monty\";\n$species = \"rat\";\nprint \"$pet[$species] is $species\\\
    n\";"
  - '[PAGE 33]


    # Notes


    Perl keeps all data objects, including variables, in a set of internal symbol
    tables. These tables keep track of all the variables and other things you create
    in your Perl program. The tables basically hold the names of the variables, filehandles,
    subroutines, etc., and pointers to where the actual actual contents are stored
    inside the Perl executable at runtime.


    Doing this way allows Perl to dynamically manage these data objects behind the
    scenes, freeing the developer to concentrate on the program, not the mechanics
    of where, when and how variables are created and located (as you do in C). It
    also allows Perl to “effortlessly” grow the size of variables as needed. In a
    C environment, the programmer must explicitly allocate memory space for each and
    every variable. This is then locked into the compiled program. If the size (e.g.,
    the number of characters in a string) needs to grow at runtime, the programmer
    must build in a section of code which accommodates this.


    Perl does all this for you. This makes working with scalars and arrays which are
    fed data from the outside world (as in a file) very easy: Perl can accommodate
    a single scalar holding one byte or one billion bytes.'
  - "[PAGE 34]\n\n# Variable Naming\n\n+   * A Perl variable is (normally) global\
    \ to the entire program.\n\n+   * Scalars, arrays, and other Perl things that\
    \ have names each have their own namespace.\n\n+   - The following are all different\
    \ and legal in the same program:\n\n```\n$life = \"A moveable feast\";\n@life\
    \ = (\"magazine\", \"cereal\", \"game\", \"being\");\n%life = (\"Riley\", \"good\"\
    ,\n\"dog's\", \"bad\",\n\"the party\", \"fun\");\nsub life() {\n  print \"Life\
    \ is a tragedy to those who feel, \",\n  \"and a comedy to those who think.\\\
    n\";\n}\n```"
  - "[PAGE 35]\n\n# Notes\n\nThe range operator, ..., creates a list that starts with\
    \ the value of the left operand and counts up to the value of the right operand.\n\
    \n```\nperl -e 'print (0..10);\n\n@arr = ('a'..'z');\nprint $arr[23]; $arr[1],\
    \ $arr[$arr];\n```\n\n# Two lists become one list\nforeach $letter ('A'..'z')\
    \ print $letter;\n\nA warning is in order here. The range operator is very useful\
    \ for creating lists of constants. Just remember that you are actually creating\
    \ a list. When you write\n\n```\n@array = (1..1000);\n```\n\nyou actually create\
    \ a list of 1000 values and assign the list to the array. This is great for initializing\
    \ an array to a set of sequential values.\n\nBut the list is created no matter\
    \ what you do with it. Often, people use the range operator to drive a loop a\
    \ given number of times:\n\n```\nfor (1..50) {\n  print \"one more time!\\\"\n\
    }\n```\n\nBut if you create a very big range, the entire list (and all the memory\
    \ needed to hold it) is created. This can use up excessive amounts of memory,\
    \ as well as becoming a performance hog:\n\n```\nfor (1..1000000) {\n  print \"\
    Oh no...not again!\\\"\n}\n```\n\nThis will actually create the list, using up\
    \ 4MB of memory to do it (assuming 4 bytes per integer). A better way to do this\
    \ is to use another form of the for loop as follows:\n\n```\nfor($x=1;$x<=1000000;$x++)\
    \ {\n  print \"at least I'm using less memory!\\\"\n}\n```\n\nThis only allocates\
    \ the space for the single scalar $x, which, since it is a number, should only\
    \ take 4 bytes."
  - "[PAGE 36]\n\n# Lists\n\n+   - Perl is rich in operators for dealing with lists.\n\
    - A list is an ordered set of scalars.\n\n'COBOL', 'ALGOL', 'SNOBOL', 'SPITBOL'\n\
    \nA named list is called an *array*.\n\n@oldlangs = ('COBOL', 'ALGOL', 'SNOBOL',\
    \ 'SPITBOL');\n- Parentheses are necessary around a list if precedence of operators\
    \ causes a problem. The = operator has higher precedence than the , operator.\n\
    \n@ftypes = ('html','cgi','pl','txt','gif','jpg');\n- Parentheses also \"create\"\
    \ a list:\n\n($scalar) = @foo;\n\nwill load the first element of @foo in $scalar\
    \ by creating an \"ordered list\" of one element.\n- If a scalar in a list is\
    \ a variable, it can be assigned to:\n\n($first, $second, $third) = \n('porridge',\
    \ 'chair', 'bed')\n($first, $second) = ($second, $first);"
  - '[PAGE 37]


    # Notes


    Many operators do not care what context they are being evaluated in and in will
    always return a scalar, even in an array context.


    For operators that care, the Perl book gives rules on how to determine if an operator
    "know" it is in an array or scalar context, and thus will return a LIST or a scalar.


    RULES:


    +   - Assigning to a scalar variable evaluates the right-hand side in a scalar
    context, while assigning to an array or to a list of scalar variables evaluates
    the right-hand side in an array context.


    +   - If a caring operator is being evaluated inside a LIST, then it will return
    a LIST, otherwise it will return a scalar.


    You can force an expression to be evaluated in a scalar context with the `scalar`
    operator:


    ```

    @a = ("one", "two", "three\); # @a is an array,

    @b = @a;                   # List context

    ```


    @b is now a copy of @a. But,


    ```

    @b = scalar @a;               # Scalar context

    ```


    The scalar value of @a (what''s an array''s scalar value?) is assigned as @b''s
    first and only element.'
  - "[PAGE 38]\n\n# Scalar and List Contexts\n\n+   - Perl expressions are evaluated\
    \ in a scalar or list context.\n  - Operators may behave differently in different\
    \ contexts.\n\n+   - In scalar context,\n  - The value of a scalar is, well, the\
    \ scalar.\n  - The value of a list is the list's *last item*.\n  - The value of\
    \ an array is the *number of items in the array*.\n\n+   - In list context,\n\
    \  - The value of a scalar is a list of just one item.\n  - The value of a list\
    \ is, well, the list itself.\n  - The value of an array is the array's list of\
    \ items."
