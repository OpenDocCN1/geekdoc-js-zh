  - "[PAGE 30]\n\n# Three Types of Variables\n\n+   * Perl has three distinct data\
    \ types: scalars, arrays, and hashes.\n* Scalars\n  - Either numbers or strings,\
    \ with automatic conversion supplied by Perl as needed.\n* Arrays\n  - Arrays\
    \ are named lists of scalars.\n  - Arrays are numerically indexed starting at\
    \ 0.\n* Hashes\n  - Hashes are indexed by arbitrary strings, not by numbers.\n\
    \  - In awk (and older versions of Perl documentation), these are called associative\
    \ arrays.\n* Variables used in a program are not \"defined\" or declared before\
    \ use."
  - '[PAGE 31]


