    \n一个使用 Perl 算符的 pop 实现（注意：原生的 pop 更快）：\n\n```\n$val = $array[$#array]; # array--;\n\
    ```\n\n一个 push 的实现：\n\n```\n$array[++array] = $val; # 注意预自增\n```\n\n# 数组和列表函数\n\
    \n- pop (@a) 返回 @a 的最后一个（右侧）元素，使 @a 缩短 1。\n  - 等同于：$var = $a[$#a]\n  - push (@a)\
    \ 将新元素添加到 @a 的末尾。\n  - unshift (@a) 从 @a 的头部插入元素。\n  - splice 允许对数组进行拼接或替换。\n\n\
    # 数组切片\n\n- 数组切片是通过提取元素创建的列表。\n- 切片不一定是连续的。\n- 如果你想从数组提取的切片是连续的，可以使用范围操作符。\n-\
