    \ except `\\n`.\n- The spaces and 00 are literals.\n- The period is known as an\
    \ *atom*, a *metacharacter*, or a *metacharacter*.\n\n## Quantifiers (*, +, {})\n\
    \n- *Quantifiers* match a sequence of an atom, of a character class, or of a subexpression.\n\
    - * is the least specific, matching any number, even zero, of its atom.\n- `\\\
    d*` matches any sequence of digits, or none at all.\n- `.*` is the general-purpose,\
    \ match-anything RE.\n- + matches one or more of its atom.\n- `\\d+` matches a\
    \ sequence of digits.\n- ? matches either zero or one of its atom; nothing else.\n\
    - You can specify any quantity of an atom in a RE using {}.\n  * `{n}` matches\
