    \ sequences**\n\n## CHAPTER 2 Basic JavaScript\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_27_0.png)\n\
    \n**Figure 2.1** A string with tabs and newlines\n\ncan be used to align text\
