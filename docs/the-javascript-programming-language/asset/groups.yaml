    While there is much much more beyond the material presented in this book, the
    core ideas of (1) the DOM for reading/or writing the content of a web page directly,
    plus (2) events for responding to user activities within a web page, form the
    foundation of dynamic HTML. Before we go beyond this foundation, let''s take a
    quick breath to examine the mechanics of this HTML-JavaScript combination is delivered
    to a web browser.


    In the previous section, event handlers were specified as JavaScript fragments
    set as attributes right within HTML tags. This is one way to get JavaScript "into"
    a web page. Two other mechanisms are also commonly used for this:


    +   - Direct inclusion of JavaScript in the HTML content

    - Linking to a JavaScript file that is downloaded separately


    Both mechanisms actually use the same HTML tag: Depending on how you use the tag,
    the browser either invokes JavaScript found right in the web page or loads a separate
    file and runs it.

    Here is the "direct inclusion" version of script:


    ```

    <script type="text/javascript">

    var displayMessage = function(message) {

    document.getElementById("message").innerHTML = message;

    };

    </script>

    ```


    When the web browser gets to this part of the web page, it executes the included
    code. In this particular example, the result will be the definition of a displayMessage
    function. Subsequent script tags, as well as event handlers, will now be able
    to invoke this function as needed.

    To reference a separate file, an src attribute is added to the script tag.


    ```

    <script type="text/javascript" src="messageUtilities.js"></script>

    ```


    Upon encountering this tag, the web browser will download JavaScript in messageUtilities.js
    from the same location as the original HTML and then execute the content of that
    file. For example, if messageUtilities.js defines an emailMessage function, then
    that will be defined as a result of loading the messageUtilities.js file. If messageUtilities.js
    defines a top-level timestamp variable, then that variable will be accessible
    to any other JavaScript code within that web page.'
- md: "\n## 5.2 Dynamic HTML\n\nWhen a separate script file is given, script's body\
    \ is ignored. Don't bother doing this:\n\n```javascript\n<script type=\"text/javascript\"\
    \ src=\"messageUtilities.js\">\n  var displayHelp = function() {\n    alert(\"\
    Please visit our support website.\");\n  };\n</script>\n```\n\nIn this case, the\
    \ code in messageUtilities.js is downloaded and executed, the code defining the\
    \ displayHelp function is never defined. Just break this up into separate script\
    \ tags—you can include any script tags as you like, of either type, within an\
    \ HTML file. The browser treats all of tags as if they were one script code is\
    \ executed in the order in which the tags appear.\n\nThese JavaScript inclusion\
    \ mechanisms contribute to an overall JavaScript environment within which all\
    \ scripts run. Thus the typical JavaScript content of a dynamic HTML site, whether\
    \ included directly in the HTML or loaded from separate files, consists mainly\
    \ of function and variable definitions. As a page is loaded and rendered by the\
    \ browser, these functions and variables cumulatively become available for access.\
    \ When page loading finishes, user activity that triggers events that call those\
    \ defined functions or access those variables as needed.\n\nThe built-up JavaScript\
    \ environment remains valid until the next page is loaded, either by the user\
    \ clicking on a link or a reload of the web page. Thus the displayMessage function\
    \ defined in the earlier examples will persist for as long as the web browser\
    \ stays on the page that defined it. If the browser loads a new page, function\
    \ goes away. If the browser reloads the page, then displayMessage remains available,\
    \ but what really happened behind the scenes was that the \"old\" displayMessage\
    \ function was discarded, and the page's script defines it once more.\n\n## 5.2.5\
    \ Other Related Built-In Objects\n\nIn addition to document, which is a JavaScript\
    \ object representation of a web page's content and structure, other web browser-related\
    \ JavaScript objects are available. We just list them here and leave full details\
    \ to materials outside of this book:\n\n- window: The window in which a web page\
    \ is being displayed.\n- navigator: The web browser application itself.\n- screen:\
    \ The user's display screen.\n\n## CHAPTER 5 Interaction\n\nUsing these objects\
    \ is pretty much identical to using document—they're always available, you can\
    \ read or write them by accessing their properties, and you can make them do things\
    \ by accessing the functions that you define. The difference is that they are,\
    \ after all, different objects, so the specific properties and functions that\
    \ they have be different from those in document. As always, look up more information\
    \ on these objects to see all of the juicy details.\n\n## 5.2.6 Timed or Ongoing\
    \ Activity\n\nFor this section on dynamic HTML, we present two functions that\
    \ are not strictly related to the web environment, but are nonetheless useful\
    \ in giving web pages an active “live” feel. These functions, setTimeout and setInterval,\
    \ facilitate deferred or ongoing activity. In other words, allow code to be run\
    \ at that exact point in a script, but rather at some point in the future or at\
    \ predefined intervals.\n\nEnter this script into http://javascript.cs.lmu.edu/playground—but\
    \ don't click Run right away:\n\n```javascript\nvar timeoutStr = document.getElementById(\"\
    input1\").value;\nvar timeout = parseInt(timeoutStr) + 1000;\ndocument.getElementById(\"\
    status\").innerHTML = \"Wait for it...\";\nsetTimeout(function() { document.getElementById(\"\
    status\").innerHTML = \"Liftoff!\"; }, timeout);\n```\n\nBefore running the program,\
    \ enter a number, in seconds, into the Input1 text field. The green status should\
    \ change to Wait for it ... and stay that for the number of seconds you entered.\
    \ The message will change to Liftoff!\n\nYou have just used the setTimeout function\
    \ to defer the calling of a JavaScript function for a specific number of milliseconds\
    \ (thus explaining the preponing of 1000s in this section's examples). setTimeout\
    \ returns immediately, allowing your code to do other things while the deferred\
    \ function “waits” in the background until the designated amount of time has elapsed.\
    \ During that time, your code may have done a bunch of other things, including\
    \ additional computation and handling events. To see this in action, add an alert\
    \ call after the line with setTimeout and then run the script again. Note how\
    \ the alert box appears immediately after you click Run, with Liftoff! appearing\
    \ later (remember to type some number of seconds into Input1 so that things don't\
    \ happen too quickly).\n\nNow try this program:\n\n```javascript\nsetInterval(function()\
    \ { document.getElementById(\"status\").innerHTML = \nnew Date(); }, 1000);\n\
    ```\n\n## 5.3 Introduction to Ajax\n\nThis time, you're using setInterval. Like\
    \ setTimeout, setInterval defers the calling of a function for some number of\
    \ milliseconds. Unlike setTimeout, setInterval repeats the function call, between\
    \ pauses (intervals) of the given amount of time. In the preceding example, the\
    \ green status area of the playground gets a by-the-second update of the current\
    \ date and time. The function is called repeatedly, for forever. Without writing\
    \ additional code, you would need to reload a page, close the browser window,\
    \ or visit a new site to end the repeated calls.\n\nWith additional code, you\
    \ can exert better control over setTimeout and setInterval. When invoked, these\
    \ functions actually return something—a value that serves as an identifier for\
    \ the particular \"deferred call\" represented by the timeout or interval function.\
    \ This identifier can be used in clearTimeout and clearInterval, respectively,\
    \ to stop or cancel the pending function call(s). To use these functions, your\
    \ code as here:\n\n```javascript\n// starting a timeout or interval, save the\
    \ returned ID.\nvar timeoutID = setTimeout(function, someDuration);\nvar intervalID\
    \ = setInterval(anotherFunction, anotherDuration);\n\n/* any other code runs here...\
    \ */\n\n// whenever a timeout or interval must be canceled, invoke:\nclearTimeout(timeoutID);\n\
    clearInterval(intervalID);\n```\n\nVisit http://javascript.cs.lmu.edu/deferred\
    \ for a concrete demonstration of this family of functions. You can also use web\
    \ page to review the HTML and JavaScript files are packaged, as discussed in Section\
    \ 5.2.5.\n\nAt this point, you should have the information needed to fully understand\
    \ the phone conversion page that was introduced in Section 5.1. Now would be a\
    \ good time to revisit http://javascript.cs.lmu.edu/phone-form to see how the\
    \ JavaScript interactions described above come together to produce a relatively\
    \ useful, and (we hope) fairly understandable, browser-based application.\n\n\
    When you're ready, we can go ahead and cap off this book with an introduction\
    \ to Ajax, which combines JavaScript and dynamic HTML with the rest of the Web\
    \ to realize the full interactive potential of each of these technologies.\n\n\
    ## 5.3 Introduction to Ajax\n\nCongratulations—you're almost done. Having come\
    \ this far with this book, you should now know, among other things:\n\n## CHAPTER\
    \ 5 Interaction\n\n- The overall look (syntax) and meaning (semantics) of the\
    \ JavaScript scripting/programming language (Chapters 1 to 4)\n- The way a web\
    \ browser “exposes” a web page's HTML content as a tree of JavaScript objects\
    \ starting with document (Section 5.2.1)\n- The way a user's interactions with\
    \ a web page can trigger JavaScript code to change the current content of the\
    \ web page, or otherwise respond to the user's activities (Section 5.2.3)\n\n\
    This knowledge forms the foundation for developing browser applications such as\
    \ the one shown in Section 5.1. Such web pages are essentially downloadable applications\
    \ that can run within a web browser without requiring additional plug-ins or “native”\
    \ (to the operating system) code.\n\nThrough all of this, one last aspect of the\
    \ Web remains unused—and that is the Web itself. No web page is an island; any\
    \ website's usefulness and power derives at least partially from its access to/from\
    \ other sites on the Internet. So far, the only connectivity mechanisms we've\
    \ seen are the link or anchor—an explicit HTML tag that, when clicked, makes the\
    \ browser discard of its current web page and reload page in its entirety—plus\
    \ the src variant of script tag which causes the browser to download and run a\
    \ .js file from the Web. Nevertheless, it is possible to communicate with the\
    \ Web without causing the full HTML downloading-rendering sequence to start over.\
    \ This ability, coupled with JavaScript and dynamic HTML, forms the basis of Ajax\
    \ (Asynchronous JavaScript and XML).\n\n## 5.3.1 Ajax in Action\n\nTo Ajax in\
    \ action, you generally need look no further than any website that claims to use\
    \ “Web 2.0” technology. Scrolling maps or lists, live updates, and dynamic filters\
    \ that don't change addresses or load new pages are very likely using Ajax to\
    \ accomplish these effects. For a simple example with code that is short enough\
    \ to easily digest, we've written a small Ajax-style application that you can\
    \ access at http://javascript.cs.lmu.edu/ajax-sample.\n\nYou can use the View\
    \ Source feature of your web browser to look at the HTML (and thus the DOM) of\
    \ that sample application. To see the JavaScript code that drives this example\n"
  mdcn: "\n\n## 5.2 动态 HTML\n\n当提供单独的脚本文件时，脚本的主体部分将被忽略。不要费精力做这种事：\n\n```javascript\n\
    <script type=\"text/javascript\" src=\"messageUtilities.js\">\n  var displayHelp\
    \ = function() {\n    alert(\"Please visit our support website.\");\n  };\n</script>\n\
    ```\n\n在这种情况下，`messageUtilities.js` 中的代码会被下载并执行，而定义 `displayHelp` 函数的代码将永远不会被定义。只需将它们拆分为独立的\
    \ `script` 标签即可——你可以在 HTML 文件中包含任意数量、任意类型的 `script` 标签。浏览器将所有标签视为一个整体脚本，并按照标签出现的顺序执行代码。\n\
    \n这些 JavaScript 包含机制构成了一个整体的 JavaScript 环境，所有脚本都在该环境中运行。因此，动态 HTML 网站典型的 JavaScript\
    \ 内容（无论是直接包含在 HTML 中还是从单独文件加载的）主要由函数和变量定义组成。当页面被浏览器加载并渲染时，这些函数和变量会累积变得可访问。当页面加载完成后，用户活动将触发事件，根据需要调用这些定义的函数或访问这些变量。\n\
    \n构建的 JavaScript 环境将一直有效，直到加载下一个页面（通过用户点击链接或刷新 页面）。因此，在前面的示例中定义的 `displayMessage`\
    \ 函数只要 浏览器停留在定义它的页面上，它就会一直存在。如果浏览器加载了新页面，该函数就会消失。如果浏览器刷新了页面，那么 `displayMessage`\
    \ 仍然可用，但实际上发生的情况是“旧”的 `displayMessage` 函数被丢弃了，而页面的脚本重新定义了它。\n\n## 5.2.5 其他相关的内置对象\n\
    \n除了 `document`（它是网页内容和结构的 JavaScript 对象表示）之外，还有其他与 Web 浏览器相关的 JavaScript 对象。我们在这里在这里列出它们，并将完整细节留给本书以外的材料：\n\
    \n- window: 正在显示网页的窗口。\n- navigator: Web 浏览器应用程序本身。\n- screen: 用户的显示器。\n\n## 第\
    \ 5 章 交互\n\n使用这些对象与使用 `document` 几乎相同——它们总是可用的，你可以通过访问它们的属性来读取或写入它们，并可以通过访问你定义的函数来让它们执行操作。区别在于，它们毕竟是不同的对象，因此它们拥有的特定属性和函数必须与\
    \ `document` 中的不同。一如既常，请查找这些对象的更多信息以查看所有精彩的细节。\n\n## 5.2.6 定时或持续的活动\n\n关于动态 HTML\
    \ 的这一部分，我们介绍了两个与 Web 环境并非严格相关的函数，但它们对于为网页提供活跃的“实时”感仍然有用。这两个函数 `setTimeout` 和 `setInterval`\
    \ 促进了延迟执行或持续执行的活动。换句话说，它们允许代码在脚本的精确位点运行，而不是在未来的某个点或预定义的间隔时间运行。\n\n将此脚本输入 http://javascript.cs.lmu.edu/playground——但不要立即点击\
    \ Run：\n\n```javascript\nvar timeoutStr = document.getElementById(\"input1\").value;\n\
    var timeout = parseInt(timeoutStr) + 1000;\ndocument.getElementById(\"status\"\
    ).innerHTML = \"Wait for it...\";\nsetTimeout(function() { document.getElementById(\"\
    status\").innerHTML = \"Liftoff!\"; }, timeout);\n```\n\n在运行程序之前，在 Input1 文本框输入一个数字（以秒为单位）。绿色状态应该变为\
    \ `Wait for it ...` 并持续你输入的秒数。消息将变为 `Liftoff!`。\n\n你刚刚使用 `setTimeout` 函数来延迟在特定毫秒数后调用\
    \ JavaScript 函数（这解释了本节示例中提前 1000 毫秒的原因）。`setTimeout` 会立即返回，允许你的代码执行其他事情，而被延迟的函数在后台“等待”，直到指定的时间过去。在此期间，你的代码可能已经做了许多其他事情，包括额外的计算和事件处理。要看到此效果，请在\
    \ `setTimeout` 的行之后添加一个 `alert` 调用，然后再次运行脚本。注意看在点击 Run 后，alert框立即出现，而 `Liftoff!`\
    \ 稍后出现（记得在 Input1 中输入几秒数，以免事情发生得太快）。\n\n现在尝试这个程序：\n\n```javascript\nsetInterval(function()\
    \ { document.getElementById(\"status\").innerHTML = \nnew Date(); }, 1000);\n\
    ```\n\n## 5.3 Ajax 简介\n\n这次你使用的是 `setInterval`。与 `setTimeout` 类似，`setInterval`\
    \ 延迟在若干毫秒后调用函数。与 `setTimeout` 不同，`setInterval` 在给定的时间间隔（间隔）之间重复调用函数。在上一个示例中，练习场的绿色状态区域每秒更新一次当前日期和时间。该函数被反复调用，直到地止。如果不编写额外的代码，你需要刷新页面、关闭浏览器窗口或访问新网站来结束重复调用。\n\
    \n通过额外的代码，你可以对 `setTimeout` 和 `setInterval` 实施更好的控制。当调用这些函数时，它们实际上会返回某些内容——该值作为由\
    \ `timeout` 或 `interval` 函数代表的特定“延迟调用”的标识符。该标识符可以分别用于 `clearTimeout` 和 `clearInterval`，以停止或取消待处理的函数调用。要使用这些函数，你的代码如下：\n\
    \n```javascript\n// 一个超时或间隔，保存返回的 ID。\nvar timeoutID = setTimeout(function, someDuration);\n\
    var intervalID = setInterval(anotherFunction, anotherDuration);\n\n/* 此处运行任何其他代码...\
    \ */\n\n// 每当必须取消超时或间隔时，调用：\nclearTimeout(timeoutID);\nclearInterval(intervalID);\n\
    ```\n\n访问 http://javascript.cs.lmu.edu/deferred 查看这一系列函数的具体演示。你也可以使用网页查看 HTML\
    \ 和 JavaScript 文件是如何打包的，正如第 5.2.5 节所讨论的那样。\n\n此时，你应该已经拥有充分理解第 5.1 节介绍的电话转换页所需的信息。现在是回到\
    \ http://javascript.cs.lmu.edu/phone-form 的好时候，看看上述 JavaScript 交互是如何结合在一起并产生一个相当实用且（我们希望）相当易懂的浏览器应用程序的。\n\
    \n当你准备好后，我们可以通过介绍 Ajax 来圆满本书，Ajax 将 JavaScript、动态 HTML 与 Web 的其他部分结合，以实现这些技术的全部交互潜力。\n\
    \n## 5.3 Ajax 简介\n\n恭喜——你快要完了。读这本书到这里，你现在应该已经知道了（其他内容）：\n\n## 第 5 章 交互\n\n- JavaScript\
    \ 脚本/编程语言的整体外观（语法）和含义（语义）（第 1 到 4 章）\n- Web 浏览器如何将网页的 HTML 内容“暴露”为从 `document`\
    \ 开始的 JavaScript 对象树（第 5.2.1 节）\n- 用户与网页的交互如何触发 JavaScript 代码更改网页的当前内容，或其他对用户的活动活动做出响应（第\
    \ 5.2.3 节）\n\n这些知识构成了开发如第 5.1 节所示的浏览器应用程序的基础。此类网页本质上是可下载的应用程序，可以在 Web 浏览器中运行，而不需要额外的插件或“原生”（操作系统的）代码。\n\
    \n通过这一切，Web 的最后一个方面仍然未被使用——那就是 Web 本身。没有任何网页是孤岛；任何网站的实用性和力量至少部分源于它对互联网上其他网站的访问/来自。到目前为止，我们看到的唯一连接机制是链接或锚点——一种显式的\
    \ HTML 标签，点击后会让浏览器丢弃当前网页并重新加载整个页面——再加上 `script` 标签的变体，它会导致浏览器从 Web 下载并运行 .js 文件。尽管如此，可以在不导致整个\
    \ HTML 下载-渲染序列重新开始的情况下与 Web 通信。这种能力结合 JavaScript 和动态 HTML，构成了 Ajax（异步 JavaScript\
    \ 和 XML）的基础。\n\n## 5.3.1 Ajax 实际演示\n\n要看到 Ajax 的实际应用，通常查看任何声称使用“Web 2.0”技术的网站即可。滚动地图或列表、实时更新以及不改变地址或加载新页面的动态过滤器很可能在使用\
    \ Ajax 来实现这些效果。为了提供一个简短且易于消化的代码简单示例，我们编写了一个小型 Ajax 风格应用程序，你可以通过 http://javascript.cs.lmu.edu/ajax-sample\
    \ 访问。\n\n你可以使用 Web 浏览器的查看源代码功能查看该示例应用程序的 HTML（以及 DOM）。要查看驱动此示例的 JavaScript 代码"
