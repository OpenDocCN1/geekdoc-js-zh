    # 2.2 Variables


    Values can be stored in variables for later use. You must first declare a variable
    to bring it into existence. You may specify an initial value in the declaration;
    if you do not, the value stored in the variable will be the special value undefined.


    After the declaration, you are free to use the variable. You can also store a
    new value in a variable by a process called assignment, which replaces (overwrites)
    the existing value stored in the variable.


    ```

    var x = 2;               // Declares x, initializing it to 2.

    alert(x);                // Alerts 2.

    alert(10 * x);            // Alerts 20.

    var y;                   // Declares y, without an explicit initial value.

    alert(y);                // Alerts undefined.

    y = x * 5;               // Assigns 10 to y, because x is still 2.

    var z = y;               // Declares z, initializes it to 10.

    y = "dog";             // Assigns "dog10" to y, overwriting the old value 10.

    alert(y + z);            // Alerts "dog10", because z is still 10.

    ```


    +   3. We''ll see how objects are treated as strings in Chapter 4.'
