- md: "\n## 3.2 Variable Scope\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_42_0.png)\n\
    \nvariable and one variable that is local to the codecs function. Updating the\
    \ local variable in no way affects the top-level one, even though they share the\
    \ same name.\n\nIn lines 5-11, the array message grows with the datapoints of\
    \ every character in the variable text, except that space characters are skipped\
    \ if the variable remove_spaces is true. The interesting thing is that remove_spaces\
    \ is defined outside the function; however, it can be referred to by code inside\
    \ the function body. This is a common scenario in many programming languages:\
    \ “outer” variables are visible to “inner” regions of a script. It is also very\
    \ useful: alert and prompt and friends exist at the top level, and we don't want\
    \ them hidden from function bodies. Figure 3.5 illustrates our situation at the\
    \ end of the function body.\n\nMore technically, function activation objects are\
    \ linked together, from the inside out, forming what is called a scope chain.\
    \ When using a name from code inside the datapoints function, JavaScript first\
    \ looks for\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_42_1.png)\n\n**Figure\
    \ 3.4** At function entry\n\n# CHAPTER 3 Functions\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_43_0.png)\n\
    \n**Figure 3.5** At the end of the function body\n\nname in the function's activation\
    \ object. If the name is not found, it moves along the scope chain and looks for\
    \ the name in the next object. The object containing all the top-level variables\
    \ is last on the chain. As a consequence:\n\n- Inside the function, the name message\
    \ will always refer to the inner variable of that name, never the outer one.\n\
    - Because the chain runs “outward” only, code outside of a function cannot see\
    \ any variables inside the function.\n\nThe second point, though it follows directly\
    \ from the language rules defining chains, still merits an example:\n\n```javascript\n\
    var say_hello = function() {\n  var message = \"Hello\";\n  alert(message + \"\
    !!!\");\n}\n```\n\n```javascript\nmessage = \"Goodbye\"; // This isn't the inner\
    \ variable.\nsay_hello(); // Alerts \"Hello!!!\"\n```\n\nThe fact that local variables\
    \ are protected from outside interference means that functions are an excellent\
    \ way to package and share code. Furthermore, a function gets its own copies of\
    \ its local variables and parameters every time it is called, so you never have\
    \ to worry about a variable named x defined in one function clashing with a variable\
    \ named x in another function. They are two separate variables.\n\n- 2. The fact\
    \ that each call gets its own copies supports an extremely powerful programming\
    \ technique called recursion, whose underlying theory is explained in any computer\
    \ science textbook.\n\n## 3.3 Function Statements\n\nJavaScript's function *statement*\
    \ provides an alternative way to declare a variable and assign it a function value.\
    \ The following statement declares and initializes a variable called cubed:\n\n\
    ```javascript\nfunction cubed(x) {\n  return x * x * x;\n}\n```\n\nWe prefer to\
    \ use the longer form, as it makes clear that functions are values.\n\n## 3.4\
    \ Functions as Arguments to Functions\n\nAll programmers realize at some point\
    \ writing the same code over and over is a bad thing. If you had to, say, encrypt\
    \ a large batch of credit card numbers, you certainly wouldn't duplicate the 50\
    \ or so lines of encryption code for each credit card number. Rather, you would\
    \ write an encryption function taking the credit number as a parameter.³ Now your\
    \ code follows the DRY (Don't Repeat Yourself) principle—a good thing.\n\nSometimes\
    \ these two functions, both of which return arrays generated by manipulating each\
    \ element of an input array in a particular way:\n\n```javascript\nvar square_all\
    \ = function(a) {\n  var result = [];\n  for (var i = 0; i < a.length; i++) {\n\
    \    result[i] = a[i] * a[i];\n  }\n  return result;\n};\n\nvar capitalize_all\
    \ = function(a) {\n  var result = [];\n  for (var i = 0; i < a.length; i++) {\n\
    \    result[i] = a[i].toUpperCase();\n  }\n  return result;\n}\n```\n\nThese two\
    \ functions *differ* in only one small way. The first function squares an element;\
    \ the latter capitalizes it. We can code the common structure once and parametrize\
    \ it by the small difference? JavaScript makes this very easy:\n\n```javascript\n\
    var do_all = function(a, f) {\n  var result = [];\n  for (var i = 0; i < a.length;\
    \ i++) {\n    result[i] = f(a[i]);\n  }\n  return result;\n};\n```\n\nThe actual\
    \ operation you perform on each array element (e.g., squaring, capitalizing) is\
    \ now passed as an argument:\n\n```javascript\nvar square_all = function(a) {\n\
    \  return do_all(a, function(x) { return x * x; });\n};\nvar capitalize_all =\
    \ function(a) {\n  return do_all(a, function(x) { return x.toUpperCase(); });\n\
    };\n```\n\nIf placing an entire function value in the middle of a return statement\
    \ looks cryptic, you can define these arguments separately:\n\n```javascript\n\
    var square = function(x) { return x * x; };\nvar capitalize = function(x) { return\
    \ x.toUpperCase(); };\nvar square_all = function(a) { return do_all(a, square);\
    \ };\nvar capitalize_all = function(a) { return do_all(a, capitalize); };\n```\n\
    \nRemember from the previous chapter how calling sort works? You can, if desired,\
