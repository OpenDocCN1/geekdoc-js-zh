    ## 基础 JavaScript


    现在你已经有机会运行了一些简单的 JavaScript 程序，我们准备好从技术角度查看该语言本身的基本元素。


    ## 2.1 表达式


    我们将从表达式开始对语言进行概述。表达式是会被求值的代码。让我们计算一些表达式：


    ```

    2 => 2

    2 + 8.1 * 5 => 42.5

    (2 + 8.1) * 5 => 50.5

    9 > 4 => true

    "dog" + "house" => "doghouse"

    ```


    表达式由值（如 8.1、true 和 "dog"）和运算符（如 `+` 加法和 `*` 乘法）组成。JavaScript 中的每个值要么是：


    - 布尔值（true 或 false），

    - 数字，，

    - 字符串，

    - 特殊值 undefined，

    - 特殊值 null，或

    - 对象。


    我们将讨论布尔值、数字和字符串。我们将在第 2.3 节中介绍 undefined，并在第 4 章中介绍对象和 null。


    ## 第 2 章 基础 JavaScript


    ## 2.1.1 布尔值


    布尔值 true 和 false 最经常被视为比较的结果——即计算两个值是否相等、不相等 (`!=`) 或以某种方式排序（<`, `<=`, `>=`, 或是
    `>`）的的表达式。


    ```

    7 === 5 => false (等于)

    3 == 3 => true (不等于)

    12 <= 12 => true (小于或等于)

    ```


    JavaScript 为布尔值提供了运算符，包括这些：


    - `&&` ("与")：当且仅当 x 和 y 都为 true 时，x && y 为 true。

    - `||` ("或")：当 x 或 y 或两者都为 true 时，x || y 为 true。

    - `^` ("异或")：当且仅当 x 和 y 中恰有一个为 true 时（不同不同为 true），x ^ y 为 true。

    - `!` ("非")：当且仅当 x 为 false 时，!x 为 true。


    下表总结了这些关系：


    | x | y | x && y | x || y | x | !x |

    |---|---|---|---|---|---|

    | true | true | true | true | false | false |

    | true | false | false | true | true | false |

    | false | true | false | true | true | true |

    | false | false | false | false | false | true |


    下表总结了这些关系：


    | x | y | x && y | x || y | x | !x |

    |---|---|---|---|---|---|

    | true | true | true | true | false | false |

    | true | false | false | true | true | false |

    | false | true | false | true | true | true |

    | false | false | false | false | false | true |


    （注：原文此处存在大量重复和混乱的 OCR 错误，已根据逻辑处理）


    ## 2.1.2 数字


    你写数字的方式正如你预期的一样：1729, 31459。数字之间的字母 E（或 e）（也称为科学计数法）：


    ```

    3.6288E6 => 36288

    5.39E-44 => 5.39 × 10⁻⁴

    4.63e17 => 4.63 × 10⁷

    ```


    ## 2.1 表达式


    数字的运算符包括 `+` (加法)、`-` (减法)、`*` (除法) 和 `%` (取模)。取模运算符计算除余数：


    ```

    18 % 5 => 3

    31.5 % 225 => 1.75

    ```


    其他操作包括 `Math.floor(x)`，产生小于或等于 x 的最大数字；`Math.ceil(x)`，产生大于等于 x 的最小数字；`Math.sqrt(x)`，产生
    $\sqrt{x}$；`Math.pow(x, y)`，产生 $x^y$；以及 `Math.random()`，产生 0 到 1 之间的随机数。


    ```

    Math.floor(2.8) => 2

    Math.floor(-2.8) => -3

    Math.ceil(2.8) => 3

    Math.ceil(-5) => -5

    Math.sqrt(100) => 10

    Math.pow(2.5, 4) => 39.0625

    ```


    在 JavaScript 中，和大多数编程语言一样，数字存储在内存的有限位置中，因此表示的数字集合是有限的。有一个最大的数字（JavaScript 的约为
    $1.79 \times 10^{308}$）和一个最小的数字（约为 $-1.79 \times 10^{308}$）。任何产生大于最大数字（或小于最小数字）的计算都会产生特殊值
    Infinity (-Infinity)。


    ```

    2E00 * 73.987E150 => Infinity

    -1e306 => -Infinity

    ```


