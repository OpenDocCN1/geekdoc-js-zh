    ## Glossary


    **Ajax** An acronym for Asynchronous JavaScript and XML, which is a style of JavaScript
    web programming where requests are made to a server and where responses, generally
    but not necessarily in XML, are processed at some later time without leaving the
    current web page.


    **Array** A collection of values, indexed from 0. A true JavaScript array has
    a length property that, if assigned a value by a script, will expand and shrink
    the array.


    **Character** A named symbol, such as PLUS SIGN, MUSICAL SYMBOL F CLEF, CHEROKEE
    LETTER QV, or WHITE CHESS KNIGHT. Do not confuse a character with a glyph, which
    is a picture of a character. For example, the two distinct letters P and CYRILLIC
    LETTER ER can both be represented with the glyph P; similarly, the distinct GREEK
    LETTER TERMA and N-ARY SUMATION can both be represented with the glyph Σ.


    **Character Set** A collection of characters, each of which is tagged with a unique
    integer called its codepoint. For example, in the Unicode Character Set, the character
    CYRILLIC SMALL LETTER Y has codepoint 44E (hex). Popular character sets in use
    today are Unicode, ASCII, and ISO-8859-1.


    **Constructor** A function that creates a new object.


    **DOM** An acronym for document object model, which represents the structure and
    content of a web page as a JavaScript object.


    **Event** An action such as a page load, button press, or stroke, to which a script
    may wish to respond.


    **Expression** A chunk of code that is evaluated.


    **Function** Code that can be called, generally with arguments. JavaScript, unlike
    some languages, treats functions as values that can be assigned to variables and
    passed as arguments to other functions.


    **Loop** A chunk of code that is performed multiple times, until some condition
    becomes true (or false—but if you think about it, that''s pretty much the same
    thing).


    **Object** A value made up of named properties.


    **Prototype** An object holding properties intended to be shared by a number of
    similar objects.


    **Script** A sequence of statements intended to be executed as a single unit.


    **Statement** A unit of execution within a script. The JavaScript statements are
    the empty statement, variable declaration, evaluation, block, if, for, while,
    continue, break, return, with, switch, throw, and try.


    **String** A text value. Strings can be viewed as a sequence of symbols or characters.
    Thus they have length, and individual characters in the string can be accessed
    by a numeric index starting from zero.


    **Type** A particular set of values. All values in JavaScript belong to one of
    six types: undefined, null, Boolean, number, string, or object.


    **Unicode** An internationally standardized character set, containing hundreds
    of thousands of characters. It is the native character set of JavaScript.


    **Variable** A named “container” for a value. The variable can be updated by assigning
    it a new value.


    - [Cro01] Douglas Crockford. Javascript: The world''s most misunderstood programming
    language. http://javascript.crockford.com/javascript.html, 2001. Accessed May
