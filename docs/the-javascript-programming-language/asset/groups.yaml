    ## CHAPTER 5 Interaction


    ### 5.3.4 Overall Ajax Structure


    You may have noticed by now that an effective Ajax application can''t just be
    "thrown together." Rather, creating one takes genuine planning, design, and discipline.
    To recap, a full-fledged Ajax application consists of the following main parts:


    - A model of the data involved in the application. What information is presented
    initially? What new information will the user provide as or she interacts with
    the web page? What updated information must be retrieved from the Web based on
    the user''s input? How does this information translate to the web page?


    - A well-planned view of the application in the form of the web page that the
    user initially accesses. This web page must have all relevant components properly
    identified (via the id attribute in the HTML tag) for easy manipulation by JavaScript.
    Outgoing information comes from interactive components such as text fields, buttons,
    and selection lists, while incoming information can show up pretty anywhere on
    the page.


    - A set of JavaScript functions that effectively control the application behaves.
    These functions determine when and how information moves from one place to another.
    Proper setting of event handlers in the original HTML (e.g., onclick, focus, keyup)
    helps trigger the interaction cycle by allowing the browser to call the right
    JavaScript code when the user does something of interest. Code triggered by these
    events can then manipulate content completely located (e.g., change the state
    of other controls, update their values, modify other displayed information) or
    seek new information from the network via XMLHttpRequest. When this information
    arrives, code triggered by the onchange handler updates the displayed content
    accordingly. It is this latter activity that forms the basis of what is now called
    Ajax-style programming.


    "Control" does not necessarily have to be user-triggered, either. Web pages that
    exhibit "live update" behavior without distinct browser reloads having ongoing
    activity, set up through JavaScript''s built-in setTimeout or setInterval functions,
    that is triggered automatically at set times. This also constitutes a form of
    control and ultimately has the same structure: At some point, a function is called,
    and this function uses XMLHttpRequest to initiate an automatic update of the web
    page''s content.


    As you venture further into Ajax, keep this overall structure in mind. It will
    help to "calibrate" the decision over which technology or mechanism to use and
    when, while making your combined HTML and JavaScript code easier to understand
    and to follow.⁵


    ### 5.3.5 Where''s the XML?


    You might have noticed that the examples used in this section exchange plain text
    information to do their work—easy to read, easy to understand. But doesn''t the
    "X" in Ajax stand for "XML," also known as eXtensible Markup Language? Yes, it
    does—but no, Ajax does not necessarily use XML. In that respect, "Ajax" is a bit
    of a misnomer. But it certainly sounds better than "AJAT" (text), "AJAPT" (plain
    text), "AJAD" (data), or any other.


    For this book, we''ve chosen to elide the use of XML because it requires additional
    complexity. The key is that in addition to plain text, we use data format that
    best suits the application.


    JavaScript can be embedded directly into HTML, or it can be referenced from a
    separate file. Both techniques use the HTML script tag.


    ## Chapter Summary


    - Beyond alert and prompt, web pages constitute another technology.

    - The current web page is known as document object (DOM). Unlike "regular" JavaScript,
    DOM properties are frequently "hotwired" to the web page.

    - JavaScript code responds to user activity through events.


    > ⁵ Some readers may recognize this structure and information flow as MVC (model-view-controller)
    architecture. That''s exactly what it is—if you''re interested, look it up.


