  mdcn: "\n\n## 5.3 Ajax 简介\n\n观察源代码，注意哪些部分看起来是熟悉的，哪些是不熟悉的。在这次 Ajax 介绍结束时，你应该对它的运作原理有一个整体的认识。\n\
    \n### 5.3.2 核心秘诀：XMLHttpRequest\n\nAjax 风格网页（呃，应用程序）的核心特征是，它可以在不从跳转到另一个网页的情况下发送并接收新信息。动态\
    \ HTML 处理用户活动并将其解释为要发送回服务器的新信息，这通常会触发该服务器的响应，响应包含新的或更新的信息，而这些信息现在必须显示给用户。此时，动态\
    \ HTML 再次接管，因为来自服务器的信息被回馈到 DOM 中，导致网页内容发生更新。\n\n这种连接性有一个限制：出于安全考虑，应用程序只能从托管原始\
    \ Ajax 网页的同一台服务器检索信息。例如，你通过 http://javascript.cs.lmu.edu 访问的文本中的 Ajax 代码只能向 http://javascript.cs.lmu.edu\
    \ 建立网络连接。这种限制被称为沙箱安全模型——它旨在保护向任何任意机器或互联网进行各种连接的网页……这种行为在很多情况下可能是恶意的，而且会将责任完全推到你的电脑上！\n\
    \n考虑到这一点，让我们进入实际代码。为动态 HTML 添加 Ajax 的新成分是什么？意乎所料，它只是“另一个”内置的 JavaScript 对象：`XMLHttpRequest`。如果\
    \ Web 浏览器的 JavaScript 环境包含 `XMLHttpRequest`，那么它就具备 Ajax 能力。快速搜索即可给你这些浏览器的最新列表，尽管此时此，除非你正在运行非常旧的软件（按计算机年而不是人类年计算！），否则你可以确信你的浏览器和目标用户的浏览器都会带有\
    \ `XMLHttpRequest`。\n\n使用 `XMLHttpRequest` 很容易；难点在于弄清楚何时使用它（这个问题稍后讨论）。事实上，你可以在通常的地方——一个\
    \ JavaScript 草稿页面中创建并调用一个 `XMLHttpRequest`。将此脚本输入我们在 http://javascript.cs.lmu.edu/playground\
    \ 的“增强”版本中，或者直接前往 http://javascript.cs.lmu.edu/ajax 跳过输入过程：\n\n```javascript\n\
    // 设置一些每个人都想看到的对象。\nvar xml;\nvar status = document.getElementById(\"status\"\
    );\n```\n\n- 此函数处理请求状态的变化。\n\n```javascript\nvar stateChanged = function() {\n\
    \  var state = xmlHttp.readyState;\n  switch (state) {\n    case 0: status.innerHTML\
    \ += \"Not initialized.\"; break;\n    case 1: status.innerHTML += \"Setup...\"\
    ; break;\n    case 2: status.innerHTML += \"...Sent...\"; break;\n    case 3:\
    \ status.innerHTML += \"...In Process\"; break;\n    case 4: status.innerHTML\
    \ += \"...Complete\"; break;\n    // 在这里处理数据。\n}}\n};\n\n// 这是主脚本序列。\nstatus.innerHTML\
    \ = \"\";\nif (XMLHttpRequest) {\n  xmlHttp = new XMLHttpRequest();\n  xmlHttp.onreadystatechange\
    \ = stateChanged;\n}\n\n// 我们期望 Input 1 中有一个 URL。\nxmlHttp.open(\"GET\", document.getElementById(\"\
