    \ node's list of children. It is equivalent to inserting a new HTML tag into a\
    \ page's HTML source, within the tag that corresponds to the invoked DOM node.\n\
    \nSo far, we have described three functions and properties that you will use most\
    \ of them, a lot more is available in the DOM. For a comprehensive list, web searches\
    \ as \"JavaScript DOM properties\" or \"JavaScript DOM reference\" should yield\
    \ sites that contain this information. Popular sites include those hosted at http://www.w3schools.com/js/js_obj_htmldom.asp,\n"
  mdcn: "\n\n# 第 5 章 交互\n\n另一个内置对象，它可能是这组对象中最复杂的一个。此外，由于 DOM 充当网页用户与 JavaScript 功能之间的桥梁，它包含了“事件”的概念，事件代表了在你的\
    \ JavaScript 代码显式活动之外“发生”的事情。事件包括当前用户在网页上采取的动作，甚至是 Web 浏览器执行的后台活动，例如你可能安排了提前或定期执行的任务，或者通过网络传入的数据。\n\
    \n位于 http://javascript.cs.lmu.edu/scratch 的基础草稿页本身就是一个网页，因此它可以作为一个 JavaScript\
    \ 对象被可见。在草稿页中输入以下内容并运行它：\n\n```\nalert(document);\n```\n\n你看到了什么？你当然看到了一个 alert\
    \ 对话框，但它包含什么？它显然不是 `null` 或 `undefined`。这至少说明 `document` 是一个实实在在、预定义的对象。alert\
    \ 消息准确地告诉了这一点。\n\n由于 `document` 是一个内置对象，它必须拥有属性。要查看其中一些属性，请输入并运行此脚本：\n\n```javascript\n\
    var i = 0;\nfor (var property in document) {\n  alert(property);\n  i = i + 1;\n\
    \  if (i > 4) {\n    break;\n  }\n}\n```\n\n你看到连续五个 alert 对话框，每个都有一个像 `bgColor`、`width`\
    \ 或 `getElementById` 这样的名称。我们无法在这里给你确定的列表，因为不同的浏览器可能会以不同的顺序列出 `document` 的属性（它们可能包含其他浏览器没有的属性）。但请注意，从代码角度来看，这正是遍历任何旧\
    \ JavaScript 对象属性的方法。\n\n上述脚本中的 `i` 计数器限制了显示的属性数量；如果没有它，你必须多次按下 Enter 或 Return\
    \ 键。不过，有一种更舒适的方法查看 `document` 的所有属性。尝试这个脚本：\n\n```javascript\nvar footer = document.getElementById(\"\
    footer\");\nfooter.innerHTML = \"<b>document properties:</b><br/>\";\nfor (var\
    \ property in document) {\n  footer.innerHTML += property + \"<br/>\";\n}\n```\n\
    \n## 5.2 动态 HTML\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_68_0.png)\n\n图 5.2\
    \ JavaScript 草稿页，其脚本已将 document 的属性追加到内容中\n\n现在发生了什么？你应该能看到与图 5.2 类似的内容。你的脚本更改了草稿页的实际内容。这就是动态\
    \ HTML 的精髓——对文档的更改会立即体现为浏览器窗口的变化。这种能力代表了传统 `alert` 函数的潜在替代方案。\n\n“DOM 对象”并不仅限于\
    \ `document` 或其直接属性。在它下方是一个整个对象树，其中 `document` 位于顶部。如果你熟悉 HTML，情况会更棒了：这棵树的结构与网页的\
    \ HTML 结构并行。图 5.3 为我们现在熟悉的 JavaScript 草稿页说明了这一点。树的单个元素（例如 `document`、`p`、`form`）被称为“节点”（nodes）{每个\
    \ DOM 节点都包含额外的节点（例如 `head` 包含 `meta` 和 `title`），包含节点的节点是父节点，而被包含节点的父节点是子节点。子节点可能只有一个父节点；`document`\
    \ 是唯一没有父节点的节点，它是树的根。\n\n有没有替代 `prompt` 的方法？如果向网页中添加内容对应于显示输出，那么读取页面的可用户编辑部分（如文本区域、复选框、单选按钮、列表等）对应于接收输入就是合逻辑的。事实上事实确实如此。尝试这个脚本：\n\
    \n```javascript\nvar scriptArea = document.getElementById('scriptArea');\nvar\
    \ footer = document.getElementById('footer');\nfooter.innerHTML = \"<pre>\" +\
    \ scriptArea.value + \"</pre>\";\n```\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_69_0.png)\n\
    \n图 5.3 JavaScript 脚本页的 HTML 和 document 表示，为了简洁起见省略了段落文本；HTML 标签与 document 属性之间的并行关系（其属性的属性等）。\n\
    \n当你运行此脚本时，你会发现网页上被追加了看起来与草稿页文本区域内容完全相同的内容。那是因为它就是草稿页文本区域的内容——你只是要求 JavaScript\
    \ 访问该文本并将其复制到页面底部（也称为页面的“页脚”）！\n\n该脚本用另一种机制从用户处接收信息替换了 `prompt`；具体来说，它读取草稿页文本区域的内容。基础草稿页还有另一个机制：`Run按钮`。点击按钮的能力被算作用户输入。\n\
    \n在继续之前还有最后一件事：当我们说 DOM 将网页上的所有内容都暴露给 JavaScript 时，我们可以做*任何事情*。接下来的脚本演示了这种灵活性——即使是按钮在大多数其他环境中通常是神圣不可侵的（或者无法动态更改），在\
    \ DOM 中也是可以随意处理的：\n\n```javascript\nvar runButton = document.getElementById(\"\
    runButton\");\nrunButton.value = \"Please Execute This Script as Soon As Possible\"\
    ;\n```\n\n但为什么停于此呢？按钮永远越多越好：\n\n```javascript\nvar form = document.getElementById(\"\
    scratch\");\nvar newButton = document.createElement(\"input\");\nnewButton.type\
    \ = \"button\";\nnewButton.value = \"I'm New! But I Do Nothing...\";\nform.appendChild(newButton);\n\
    ```\n\n（不用说，你真的应该在这里输入并运行这些代码，以获得最大的收获——没有截图可以让你逃脱。）\n\n## 5.2.2 为了乐趣和利润的元素与 ID\n\
    \nHTML 定义了许多我们在基础草稿页中演示之外的对象。为了向你介绍更多 DOM 元素而不需要要求你从头开始整个页面，我们移动到一个包含更多可操作对象的新草稿页。该页面可以在图\
    \ 5.4 中看到，并可以在 http://javascript.info/eduplayground 在访问。\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_70_0.png)\n\
    \n**图 5.4** 带有更多你可以操作的 DOM 元素的 JavaScript 草稿页\n\n在我们深入研究这个新页面之前，让我们揭开目前为止使用的一些属性的神秘面。顶级\
    \ `document` 对象（图 5.3）具有以下函数：\n\n- **getElementById(name)**: 此函数查找并以 JavaScript\
    \ 对象的形式返回 HTML 中 `id` 属性设置为 `name` 的页面元素。\n- **createElement(type)**: 此函数创建一个新的\
    \ HTML 元素，就像在 `type` 中指定的标签被写入原始 HTML 文件中一样。新元素尚未添加到页面中（`appendChild` 函数负责这一点），因此你可以认为元素在你自定义其属性时存在于一个“等待区域”。\n\
    \n动态 HTML 活动通常从调用 `document.getElementById` 开始，以便“到达”你想要操作的 DOM 节点。这种操作涉及读取或写入如下的属性：\n\
    \n- **innerHTML**: 此属性适用于对应于 HTML 块（如 `<p> ...</p>` 或 `<div> ... </div>`）的节点，它代表出现在该块的起始和结束标签内的确切\
    \ HTML 代码。为此属性分配新值将立即更改网页的相应部分。\n- **value**: 此属性适用于大多数用户输入节点，它代表该元素当前的内容，例如文本字段中的文本、按钮的状态或列表中的当前选择。与\
    \ `innerHTML` 一样，给此属性赋值会立即修改网页中相应的元素。\n\n`document` 内部的 DOM 节点也有它们自己的函数；这些我们目前只使用了\
