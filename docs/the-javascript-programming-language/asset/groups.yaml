    \ 会根据需要被修饰或处理，从而赋值给 DOM 中某处组件的某个属性。如果是这样，用户就能看到这些信息，他们随后的操作现在就可以基于这些信息了。\n\n##\
    \ 第 5 章 交互\n\n### 5.3.4 整体 Ajax 结构\n\n你可能已经注意到，一个有效的 Ajax 应用不能只是“随手凑合”的。相反，创建一个应用需要真正的规划、设计和纪律。回顾一下，一个完整的\
    \ Ajax 应用由以下主要部分组成：\n\n- 涉及应用的数据模型（Model）。最初显示哪些信息？用户在与网页交互时会提供哪些新信息？根据用户的输入，必须从网络检索哪些更新信息？这些信息如何转换到网页上？\n\
    \n- 经过良好规划的应用程序视图（View），以用户最初访问的网页形式呈现。该网页必须正确识别所有相关组件（通过 HTML 标签中的 `id` 属性），以便\
    \ JavaScript 进行操作。输出信息来自交互式组件，如文本框、按钮和选择列表，而输入信息可以出现在页面的任何地方。\n\n- 一组有效地控制应用行为的\
    \ JavaScript 函数（控制层/Controller）。这些函数决定了信息何时以及如何从一个地方移动到另一个地方。在原始 HTML 中恰当设置事件处理程序（例如\
    \ `onclick`、`focus`、`keyup`）有助于触发交互周期，允许浏览器在用户执行感兴趣的操作时调用正确的 JavaScript 代码。由这些事件触发的代码可以完全操作本地内容（例如更改其他控制控件的状态、更新它们的值、修改其他显示信息），或者通过\
    \ `XMLHttpRequest` 从网络寻求新信息。当这些信息到达时，由 `onchange` 处理程序触发的代码会相应地更新显示的内容。正是这种后者的活动形成了现在所谓的\
    \ Ajax 风格编程的基础。\n\n“控制”并不一定得是由用户触发的。表现出“实时更新”行为的网页在没有明显的浏览器重加载的情况下持续持续活动，这些活动通过\
    \ JavaScript 内置的 `setTimeout` 或 `setInterval` 函数设置，它们会在设定的时间自动触发。这也构成了控制的形式，并最终具有相同的结构：在某点，调用了一个函数，该函数使用\
    \ `XMLHttpRequest` 启动网页内容的自动更新。\n\n当你进一步深入研究 Ajax 时，请记住这个整体结构。它有助于“校准”关于何时以及使用何种技术或机制的决策，同时让你组合的\
    \ HTML 和 JavaScript 代码更容易理解和遵循。⁵\n\n### 5.3.5 XML 在哪儿？\n\n你可能注意到本节使用的示例通过交换纯文本信息来工作——易读、易懂。但\
    \ Ajax 中的“X”不就代表“XML”（即可扩展标记语言）吗？是的，它确实代表——但不，Ajax 并不一定使用 XML。在这方面，“Ajax”是一个有点误导的名称。但它听起来确实比“AJAT”（文本）、“AJAPT”（纯文本）、“AJAD”（数据）或任何其他名称要好得多。\n\
    \n对于本书，我们选择了省略对 XML 的使用，因为它增加了复杂性。关键在于，除了纯文本外，我们还使用了最适合应用程序的数据格式。\n\nJavaScript\
    \ 可以直接嵌入 HTML 中，也可以从单独的文件引用。\n\n## 章节总结\n\n- 除了 `alert` 和 `prompt`，网页还构成了另一种技术。\n\
    - 当前网页被称为文档对象模型（DOM）。与“普通”JavaScript 不同，DOM 属性经常被硬连到网页上。\n- JavaScript 通过事件响应用户活动。\n\
    \n> ⁵ 部分读者可能将这种结构和信息流识别为 MVC（模型-视图-控制器）架构。如果你感兴趣，可以查一下。\n\n## 练习\n\n1. 运行第 64\
    \ 页列出的单语句，确保清楚它们的作用。\n   (a) 识别没有产生直接影响的单语句。\n   (b) 识别受那个“隐形”语句影响的其他单语句。可以查阅而不是通过尝试错误。无论是哪种方法，请单独运行这些单语句以验证你的答案。\n\
