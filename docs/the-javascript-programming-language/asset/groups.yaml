    # 5.2 Dynamic HTML 69


    Of course, (almost) never see event handling assigned by user-entered code that
    runs in. Instead, the dynamic web pages that we “just know” how to handle events.
    In substance, such pages aren''t doing anything differently from what you just
    did. Instead, the little events are already included as part of the web page''s
    files, including an option to encode them as attributes of HTML tags.


    To see event handling that is set up directly within the page''s source, visit
    http://javascript.cs.lmu.edu/boxes. This page displays a number of HTML boxes
    that you can drag around. They also “light up” as your mouse rolls over them.
    If you view the HTML source of boxes.html, you''ll see like this:


    ```

    <div id="bozi"

    class="box"

    style="left:100px; top:100px; width:200px; height:150px;"

    ononmouseover="highlight(this);"

    ononmouseout="unhighlight(this);"

    ononmousedown="startMove(this, event);"

    ononmousemove="move(this, event);"

    ononmouseup="endMove(this);">Hello world!</div>

    ```


    These tags show how event handler scripts can run in the HTML source. Every user
    interface event has a corresponding HTML attribute


    With events, dynamic HTML rounds out into complete, self-contained package. When
    you access a dynamic HTML site, the web browser loads the HTML source. This source
    is displayed to the user as a web page, and is simultaneously exposed to JavaScript
    as the document object. As the user reads the web page, he or she may move the
    mouse, click, press a key, or do something else. If any of these events have associated
    with a script, the browser runs that script. More likely, the script will access
    the DOM and manipulate it somehow, by changing some value or adding/removing elements.
    Once the script finishes, the user is back to looking at the web page, which is
    now different from the one that was originally read by the browser. The cycle
    goes on, until the user requests a new web page. The cycle begins again. These
    event loops go on ad infinitum, until the user quits the web browser.'
