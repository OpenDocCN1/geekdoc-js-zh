    # ## 2.1 Expressions


    We''ll start our overview of the language with expressions. An expression is code
    that is evaluated. Let''s evaluate some expressions:


    ```

    2 => 2

    2 + 8.1 * 5 => 42.5

    (2 + 8.1) * 5 => 50.5

    9 > 4 => true

    "dog" + "house" => "doghouse"

    ```


    Expressions are made up of values, such as 8.1, true, and "dog", and operators,
    such as + (addition) and * (multiplication). Every value in JavaScript is either


    +   - A Boolean (true or false),

    - A number,

    - A string,

    - The special value undefined,

    - The special value null, or

    - An object.


    We''ll discuss Booleans, numbers, and strings. We''ll cover undefined in Section
