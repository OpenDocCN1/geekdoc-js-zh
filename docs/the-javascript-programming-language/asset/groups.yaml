    # Afterword


    As we reach the end of this book, you might have noticed that we both started
    and finished the text with an introduction. First, we introduced you to JavaScript
    as a programming language; eventually, we capped off with an introduction to Ajax,
    an extremely powerful application of JavaScript enabling truly interactive software
    delivered over the Web. This is, of course, by design: With all worthwhile subjects,
    there are no real endpoints, just transitions to other (deeper, broader) areas.
    You started by seeing JavaScript as a pure programming language, without the distractions
    or hype that accompany technology bandwags and trends. In the end, presumably
    with a better grasp of the language, you find yourself at the cusp of using JavaScript
    to implement a class of applications that have already transformed the way many
    people use the World Wide Web, and whose full potential has yet to be realized.


    So where do you go from here? Presuming that we''ve gotten your attention and
    interest with this little volume, the true answer of "anywhere" actually isn''t
    that far off. We certainly did not cover all of the JavaScript language (a much
    longer book would be required for that), nor did we mention many professional
    JavaScript libraries used in the real world today. Instead, we sometimes used
    phrases such as "beyond the scope of this book," or "leave the details to you."
    Those are good places to start: Find something that made you wish it were covered,
    find information that goes into deeper detail in those areas, and try to apply
    that information.


    +   - If you are interested in the JavaScript language, pick up a language reference,
    where you will encounter advanced and powerful features such as exceptions, reflection,
    enumeration, and something called "duck typing." Learn more about closures and
    regular expressions. Find out about labeled statements, the typeof operator, the
    constructor


