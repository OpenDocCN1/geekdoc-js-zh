    What happens now? You should see something that''s not unlike Figure 5.2. Your
    script has changed the actual content of the scratch page. This is the essence
    of dynamic HTML—changes to document are immediately manifested as changes to the
    browser window. This capability represents a potential replacement for the venerable
    alert function.


    The "DOM object" does not stop with document or its immediate properties. What
    lies beneath is an entire tree of objects, with document at the top. And if you
    are familiar with HTML, it gets even better: the structure of this tree parallels
    the structure of the web page''s HTML. Figure 5.3 illustrates this for our now-familiar
    JavaScript scratch page. Individual elements of the tree (e.g., document, p, form)
    are called nodes; each DOM node contains additional nodes (e.g., head contains
    meta and title), the containing node is a parent node, while the contained nodes''s
    parents are children. A child node may have only one parent; document, the only
    node that has no parent is the root of the tree.


    How about a replacement for prompt? If adding content to a web page corresponds
    to displaying output, then it makes sense that reading the usereditable sections
    of a page, such as text areas, check boxes, radio buttons, lists, and more, would
    correspond to receiving input. In fact, this is the case. Try this script:


    ```

    var scriptArea = document.getElementById(''scriptArea'');

    var footer = document.getElementById(''footer'');

    footer.innerHTML = "<pre>" + scriptArea.value + "</pre>";

    ```'
