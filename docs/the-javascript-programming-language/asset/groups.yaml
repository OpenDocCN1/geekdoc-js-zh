    # 5.3.2 The Secret Ingredient: XMLHttpRequest


    The central characteristic of an Ajax-style web page (er, application) is that
    it can send and receive new information without shifting from one web to another.
    Dynamic HTML processes user activity and interprets it into new information to
    be sent back to a server, typically elicits a response from that server, consisting
    of new or updated information that must now be displayed back to the user. At
    this point, dynamic HTML takes over again, as the information from the server
    is fed back into the DOM, resulting in updates to the web page''s content.


    There is one catch to this connectivity: For security purposes, an application
    may retrieve information only from the same server that hosted the original Ajax
    web page. For example, the Ajax code in text, which you have reached via http://javascript.cs.lmu.edu,
    can make network connections to only http://javascript.cs.lmu.edu. This restriction
    is called a sandbox security model—it is meant to protect web pages that make
    all kinds of connections to any arbitrary machine or the Internet... behavior
    that, more often than not, may be quite malicious, while putting the blame squarely
    on your computer!


    With this caveat in mind, let''s move to some actual code. What''s the new ingredient
    that adds Ajax to dynamic HTML? Not surprisingly, it''s "just another" built-in
    JavaScript object: XMLHttpRequest. A web browser is Ajax capable if its JavaScript
    environment includes XMLHttpRequest. A quick search would give you an up-to-minute
    list of these browsers, although at this point, unless you''re running really
    old software (in computer years, not human years!), you can be confident that
    your browser and your target users'' browsers—will have XMLHttpRequest.


    Using XMLHttpRequest is easy; it''s figuring out when to use it''s trickier (on
    that issue later). In fact, you can create and invoke an XMLHttpRequest in the
    usual place—a JavaScript scratch page. Type this script into our "enhanced" version
