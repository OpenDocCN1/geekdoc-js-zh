- md: "\n## 5.2 Dynamic HTML\n\nhttp://www.mozilla.org/docs/dom, and finally the authoritative\
    \ standard-defined by the World Wide Web Consortium (W3C) at http://www.w3.org/DOM.\
    \ Most of these sites have a search function or outline that is based on the actual\
    \ object, function, and property names within the DOM, such as the handful just\
    \ listed.\n\nWe're ready to start working with our new playground page. The key\
    \ to reaching the element (tag) that you want is use getElementById. But, as they\
    \ say, with this power comes a responsibility: The HTML source must make sure\
    \ that the elements you want have assigned to them in the first place. This is\
    \ a key aspect of the HTML-JavaScript symbiosis: for JavaScript to get to (and\
    \ manipulate) the web page must be marked with identifiers for the tags the scripts\
    \ will care about.\n\nIt's easy to spot the IDs in a web page. While viewing our\
    \ new page in a browser, select browser's View Source, Page Source, or a similarly\
    \ named command. This opens a new window showing the HTML code for the web page.\
    \ Every tag with an id attribute (example, <p id=\"description\">) is an element\
    \ that you can reach using getElementById.\n\nTake a moment to get the ID's tag\
    \ in the page, and then type of this in script:\n\n```javascript\n// Grab the\
    \ elements that we need.\nvar input1 = document.getElementById(\"input1\");\n\
    var input2 = document.getElementById(\"input2\");\nvar status = document.getElementById(\"\
    status\");\n\n// Read the required values.\nvar number1 = parseFloat(input1.value);\n\
    var number2 = parseFloat(input2.value);\n\n// Write the result.\nstatus.innerHTML\
    \ = number1 + \" + \" + number2 + \" = \" + (number1 + number2);\n```\n\nYou've\
    \ just written a simple adder! The script grabs the input1 and input2 text fields\
    \ from the page, converts the text within those fields (the value property) into\
    \ numbers via the built-in parseFloat function, and adds the resulting numbers\
    \ together. While addition might be trivial, this script is meant to show you\
    \ how judicious assignment of IDs to HTML elements makes it extremely easy, with\
    \ the help of getElementById, to access and modify the content of a web page—including\
    \ content that solicits user input, such as the input fields.\n\n- 2. Of course,\
    \ the correctness of this adder is subject to the correctness of JavaScript arithmetic\
    \ in general, as discussed in Chapter 2.\n\nOf course, the labeling and information\
    \ on the page doesn't really say \"adder\", so let's tweak the web page accordingly\
    \ with this script:\n\n```javascript\ndocument.getElementById(\"header\").innerHTML\
    \ =\n  \"A Simple Dynamic HTML Adder\";\ndocument.getElementById(\"introduction\"\
    ).innerHTML =\n  \"This page adds two numbers.\";\ndocument.getElementById(\"\
