    \ ARABIC SHADDA ISOLATED FORM\n11D22 MUSICAL SYMBOL F CLEF\n\nAn old version of\
    \ the codepoint-to-character mapping can be found in the source [Uni08].\nString\
    \ values are written within double quotes (e.g., \"hello\") or single quotes (e.g.,\
