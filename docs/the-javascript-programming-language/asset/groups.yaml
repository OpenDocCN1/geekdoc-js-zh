    \ [5, 2]\na.push(3, 10);               // 现在 a 是 [3, 10, 5, 2]\nalert(a[0]); \
    \               // 弹出 3 并 a 改为 [3, 5, 2]\nalert(a.shift());           // 弹出 3\
    \ 并 a 改为 [10]\nb.push(b[0], 1);            // 现在 b 是 [7, 3, 5, 2, 10, 1]\nb.sort();\
    \                    // 现在 b 是 [1, 10, 2, 3, 5, 7]\n```\n\n什么？10 是怎么跑到 1 和 2 之间的？答案是数组可以包含任何类型的值——只是在排序时，JavaScript\
    \ 将所有值都视为字符串。字符串 \"1\" 小于 \"10\"，而 \"10\" 小于 \"2\"。那么如何进行数值排序呢？你必须等到下一章才能得到问题的答案。\n\
    \n给定一个数组 a，表达式 `a.length` 产生 a 中的元素数量。给 `a.length` 赋值可以增大或缩小数组；新值将被设置为 `undefined`。你也可以通过给超出数组末尾的索引位置赋值来扩展数组。\n\
    \n```\nvar a = [9, 3, 2, 1, 8, 7, 3];     // a[7] 到 a[19] 现在是 undefined。\na[20]\
    \ = 6;                      // 弹出 21。\nalert(a.length);                // 弹出 21。\n\
    a.length = 50;                  // a[21] 到 a[49] 均为 undefined。\na.length = 3;\
    \                   // 现在 a 是 [9, 3, 2]。\n```\n\n# 第 2 章 基础 JavaScript\n\n## 2.4\
    \ 语句\n\n我们通过查看语句来完成基础 JavaScript 的概述。表达式计算值，而语句产生动作。事实上，脚本是语句的序列，每条语句在脚本运行时都会被执行。\n\
    \n在本节中，我们将涵盖最常见的 JavaScript 语句，并提供包含它们的脚本。你会注意到，我们在每个语句结束时都加了分号（；），除非它已经以右括号（}）结尾。虽然不是严格要求的，但这是一种非常推荐的做法。漏掉分号可能会导致很多问题（参见\
    \ [ECM99, Sec.7.9]）。\n\n### 2.4.1 声明语句\n\n声明语句只是声明一个变量。\n\n```\nvar count = 0;\n\
    var dogs = [\"Sparky\", \"Spot\", \"Spike\"];\nvar response;\n```\n\n### 2.4.2\
    \ 表达式语句\n\n表达式语句评估表达式并忽略其值。因此，只有那些对后续计算产生影响的表达式语句（如赋值）是有用的。\n\n```\n2 + 2;   \
    \            // 合法语句，但完全没用。\nx = 1 + (y = 4);      // 将 4 赋值给 y，然后将 5 赋值给 x。\n\
    count++;             // 自增非常常见。\nalert(\"hi\");         // 这个绝对有可见的影响。\n```\n\n\
    ### 2.4.3 条件执行\n\n程序通常需要在某些条件下执行一件事，在另一种条件下执行另一件事。`if` 语句根据各种条件从多个可选执行中执行执行一个。该语句的通用格式是一个部分、零或多个\
    \ `else` 部分以及可选的 `else` 部分。条件按从上下的顺序评估。\n\n```\nif (score >= 90) {\n  grade =\
    \ \"A\";\n} else if (score >= 80) {\n  grade = \"B\";\n} else if (score >= 70)\
    \ {\n    grade = \"C\";\n} else {\n    grade = \"F\";\n}\n```\n\n有时你可能更喜欢条件表达式而不是语句：\n\
    \n```javascript\ngrade = (score >= 90) ? \"A\" : \"B\";\n```\n\n另一种条件是 `switch`\
    \ 语句，它将值与情况进行比较。例如：\n\n```\nswitch (direction) {\n  case \"north\":\n    // 执行其他事情\n\
    \    break;\n  case \"south\":\n    // 执行其他事情\n    break;\n  case \"east\":\n\
    \    // 执行其他事情\n    break;\n  case \"west\":\n    // 执行其他事情\n    break;\n  default:\n\
    \    // 执行其他事情\n}\n```\n\n`break` 语句将终止整个循环。当你数组中查找某些内容时，这种行为特别有用。\n\n```\n//\
    \ 查找数组中第一个偶数的索引位置。\nfor (var i = 0; i < array.length; i++) {\n  if (array[i] %\
    \ 2 == 0) {\n    alert(\"在 \" + i + \" 找到偶数\");\n    break;\n  }\n}\n```\n\n`continue`\
    \ 语句立即开始循环的下次迭代，而不完成当前迭代。当循环中的部分迭代产生有用信息时，它非常有用。\n\n```javascript\n// 计算数组中所有正值的和。\n\
    var sum = 0;\nfor (var i = 0; i < array.length; i++) {\n  if (array[i] < 0) {\
    \ // 跳过非正数。\n    continue;\n  }\n  sum += array[i]; // 累加正数。\n}\nalert(\"正数的和为\
    \ \" + sum);\n```\n\n## 2.4.4 循环\n\nJavaScript 还有我们在第 4 章将遇到的另一种 `for` 循环。\n\n\
    `while` 循环重复代码直到条件变为为假。例如：\n\n```javascript\nvar i = 0;\nwhile (i < 5) {\n  console.log(i);\n\
    \  i++;\n}\n```\n\n当你使用计数器时，`for` 循环是编写 `while` 循环的一种更简洁的方式。\n\n```javascript\n\
    for (var i = 0; i < 5; i++) {\n  console.log(i);\n}\n```\n\n"
