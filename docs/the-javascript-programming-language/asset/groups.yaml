    # 3.2 Variable Scope


    ```

    // Call the function, using the return value.

    var numberOfRubiksCubeBlocks = cubed(3) - 1;


    // Function calls can be nested.

    alert(cubed(5));                                  // Alerts 125.

    ```


    If you don''t pass enough arguments, the extra parameters will be initialized
    to undefined.


    ```

    var show = function(x, y) { alert(x + " " + y); };

    show(1);                               // Alerts "i undefined".

    ```


    It is not uncommon to see functions with no parameters. For example:


    ```

    var diceRoll = function() { return 1 + Math.floor(6 * Math.random()); };

    ```


    To run this function, you must write diceRoll(), not simply diceRoll.

    The former expression calls the function; the latter simply is the function.

    Figure 3.2 shows the difference.


    ![](img/8b2f777e78c0b5f77130ace12a52e3b1_40_0.png)


    # 3.2 Variable Scope


    Each time you call a function, JavaScript immediately creates something called
    an activation object that holds all the parameters and any variables defined in
    the body of the function. It also creates and initializes a special variable called
    arguments, though this is beyond the scope of this book.

    These variables are different from variables outside of the function—even those
    with the same name, as we shall soon see.'
