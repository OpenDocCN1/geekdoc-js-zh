    \ URLs and scratch pages make it easy to write and experiment with JavaScript\
    \ code quickly and conveniently. However, they do not handle the distribution\
    \ and sharing of JavaScript programs once the code has been deemed ready for prime\
    \ time.\n\nTo allow other users to partake of your latest and greatest scripts,\
