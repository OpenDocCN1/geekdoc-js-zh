    \ `finishes` 在逻辑上、数学上、科学上都是无法编写的？\n\n## 第 4 章 对象\n\nJavaScript 值有两种类型：简单值（数字、布尔值、字符串、`null`\
    \ 和 `undefined`）和对象。本章将介绍如何定义和使用对象。\n\n### 4.1 对象表示法\n\n在 JavaScript 中，对象拥有属性，属性拥有值。属性值也可以是对象，从而允许复杂的结构。对象字面量是一个定义新对象的表达式；以下是几个示例。\n\
    \n```javascript\nvar dress =\n  { size: 4, color: \"green\", brand: \"DKNY\",\
    \ price: 834.95 };\nvar location = {\n  latitude: 31.131013,\n  longitude: 29.976977\n\
