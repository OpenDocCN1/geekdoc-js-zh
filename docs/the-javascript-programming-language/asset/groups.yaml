    # 5.2.3 Events


    Now that you''ve seen how scripts can read, write, and have total control over
    the content of a web page, a chicken-and-egg question may have emerged in your
    mind: Who runs the scripts? With the scratch pages so far, you write the code
    and then it “happen”. This is not how it works. Scripts just run. This section
    discusses precisely how these scripts happen, using HTML/JavaScript’s mechanism.


    An event is a term for something that may happen during the life of a program,
    outside of the code that is currently being executed. If a program cares about
    a particular event—for example, it may need to respond to mouse clicks—then an
    event handler is set up for that event. The handler is nothing fancy; it is a
    function. What distinguishes event handlers from other functions is, once set
    up, they are called “automatically” when an event takes place.


    > 3. Yes you guessed it—there’s more to this topic than can be said within the
    scope of this.'
