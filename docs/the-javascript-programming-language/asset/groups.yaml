    # 5.3.5 Where''s the XML?


    You might have noticed that the examples used in this section exchange plain text
    information to do their work—easy to read, easy to understand. But doesn''t the
    "X" in Ajax stand for "XML," also known as eXtensible Markup Language? Yes, it
    does—but no, Ajax does not necessarily use XML. In that respect, "Ajax" is a bit
    of a misnomer. But it certainly sounds better than "AJAT" (text), "AJAPT" (plain
    text), "AJAD" (data), or any other alternative you might think up. That''s just
    a hafta that many have still—we still use our cool-sounding acronyms.


    For this book, we''ve chosen to elide the use of XML because it requires a whole
    bunch of additional baggage. The bottom line is that, in addition to plain text,
    Ajax-style applications exchange any kind of information that they''d like with
    their servers: images, documents, and, yes, XML. The key is to choose the data
    format that best suits the needs of the application. XML, with its ability to
    represent structured relation, potentially complex information, is generally used
    when the data exchanged possesses, well, structure and complexity. But in the
    end, it is just one option among many for creating dynamic, information-rich,
    yet efficient web applications.


    # Chapter Summary


    +   - Beyond alert and prompt, web pages constitute another technology that allows
    users to interact with JavaScript programs.

    - The current web page is visible to JavaScript as the built-in document object,
    which has properties, structure, and functions just like any other JavaScript
    object.

    - The JavaScript object representation of a web page is known as the document
    object (DOM). Unlike "regular" JavaScript properties, DOM properties are frequently
    "hotwired" to the web page, so that modifications to those properties result in
    immediate changes to the web page''s visible content—thus the name dynamic HTML
    (DTHTML).

    - JavaScript code responds to user activity through events, which "hook up" user
    actions on web elements of interest or importing data from network connections
    with the scripts that handle events.


    > ⁵ Some readers may recognize this structure and information flow as an MVC (model-view-controller)
    architecture. That''s exactly what it is—if you''re interested, look it up.'
