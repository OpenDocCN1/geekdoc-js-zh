    \ in order, from top to bottom.\n\n```\nif (score >= 90) {\n  grade = \"A\";\n\
    } else if (score >= 80) {\n  grade = \"B\";\n} else if (score >= 70) {\n    grade\
    \ = \"C\";\n} else {\n    grade = \"F\";\n}\n```\n\nSometimes you may prefer a\
    \ conditional expression instead of statement:\n\n```javascript\ngrade = (score\
    \ >= 90) ? \"A\" : \"B\";\n```\n\nAnother kind of conditional, the switch statement,\
    \ compares a value against cases. For example:\n\n```\nswitch (direction) {\n\
    \  case \"north\":\n    // do something else\n    break;\n  case \"south\":\n\
    \    // do something else\n    break;\n  case \"east\":\n    // do something else\n\
    \    break;\n  case \"west\":\n    // do something else\n    break;\n  default:\n\
    \    // do something else\n}\n```\n\nThe break statement will terminate entire\
    \ loop. This behavior is especially useful when you are looking for something\
    \ in an array.\n\n```\n// Find the index position of the first even number in\
    \ array.\nfor (var i = 0; i < array.length; i++) {\n  if (array[i] % 2 == 0) {\n\
