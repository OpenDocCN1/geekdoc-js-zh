    \ Incrementing is actually quite common.\nalert(\"hi\");         // This one definitely\
    \ has a visible effect.\n```\n\n### 2.4.3 Conditional Execution\n\nPrograms often\
    \ need to do one thing under conditions and something else under conditions. The\
    \ if statement does exactly one of a number of alternative executions, based on\
    \ various conditions. The general form of this statement is to have one part,\
