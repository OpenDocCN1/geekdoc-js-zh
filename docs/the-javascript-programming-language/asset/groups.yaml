  mdcn: "\n\n# 编写和运行 JavaScript\n\n## 1.2.3 JavaScript 文件\n\nJavaScript URL 和临时页面（scratch\
    \ pages）让你能够快速方便地编写和实验 JavaScript 代码。然而，一旦代码被认为已经准备好发布，它们就无法处理 JavaScript 程序的分发和共享。\n\
    \n为了让其他用户可以使用你最新、最出脚本，你必须将 JavaScript 程序保存在单独的文件中。网络浏览器就可以下载这些文件并运行它们，就像它们运行 JavaScript\
    \ URL 或 JavaScript 临时页的内容一样。区别在于，它们不需要直接输入（如你使用 URL 和临时页面时所的那样），网络浏览器可以自行获取代码。\n\
    \n由于本书致力于专门关注 JavaScript 作为一种编程语言，而不是 JavaScript 作为一种网络技术，我们将刻意推迟有关在网络浏览器应用程序中使用\
    \ JavaScript 代码的分发和共享的内容，直到第 5.2.4 节。\n\n## 1.2.4 注释\n\n看看下面的脚本。你发现它有什么不寻常之处吗？（不用说，试着输入并运行它。）\n\
    \n```javascript\n/*\n* 我们将多次输出某些文本。\n*/\nvar echo = function(s) {\n  return s\
    \ + \" \" + s;\n}\n\nalert(echo(\"pizza\"));\nalert(echo(\"money\"));\n\n// 我们也可以输出用户提供的内容。\n\
    alert(echo(prompt(\"Type something to echo:\")));\n```\n\n示例开头 /* 和 */ 之间的块，以及末尾附近以\
    \ // 开头的行，看起来不像代码——它们看起来像是普通的英语。这是因为它们确实是普通的英语；/* 和 */ 之间的文本，以及两个斜杠（// 到行尾）之后的任何文本都被称为注释。注释允许人类语言成为脚本的一部分，帮助读者稍更好地理解编程人员的意图。当\
    \ JavaScript 看到 /* 时，它知道跳过之后的所有内容，直到看到 */。当 JavaScript 看到 // 时，它会忽略从那里到行尾的所有内容。\n\
    \n在实践中，高度鼓励在代码中大量包含注释；无论编程专家变得多么优秀，用普通的英语（或你熟悉的任何其他会说、会读或写的语言）来阅读某些内容通常比阅读代码要容易。当你作为一个程序员团队的一员并阅读你没有编写的代码时，甚至当你回顾自己写过但一段时间未见的代码时，这一点变得变得尤为重要。\n\
    \n# 第 1 章节 引言\n\n## 1.3 你的第一个非平凡脚本\n\n现在我们已经建立了编写和运行 JavaScript 的简单机制，让我们来看一个稍微复杂一点的脚本。这里的目的是展示一个非平凡脚本像什么样；在那个时候，你不需要理解每一行的含义。在\
    \ http://javascript.cs.lmu.edu/ 中输入以下内容：\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_15_0.png)\n\
    \n```javascript\n// 向用户询问一个数字短语。\nvar phrase = prompt('Please enter a phone number\
    \ \"phrase:\");');\n\n// 每个字母与电话键数字的对应。\nvar conversion = {A: 2, B: 2, C: 2, D:\
    \ 3, E: 3, F: 3, G: 4, H: 4, I: 4, J: 5, K: 5, L: 5, M: 6, N: 6, O: 6, P: 7, Q:\
    \ 7, R: 7, S: 7, T: 8, U: 8, V: 8, W: 9, X: 9, Y: 9, Z: 9};\n// 一一次构建一个数字。\nvar\
    \ phoneNumber = \"\"\nfor (var index = 0; index < phrase.length; index++) {\n\
    \  var symbol = phrase[index].toUpperCase();\n  phoneNumber += conversion[symbol];\n\
    }\n\nalert(\"You want to dial \" + phoneNumber + \".\");\n```\n\n如之前提到的，代码必须绝对精确——完整地复制所有内容。如果你不信任自己的复制，可以访问\
    \ http://javascript.cs.lmu.edu/scratch/phrase-to-phone 获取一个已经预加载了该脚本的临时页面版本。\n\
    \n假设你正确地输入了此脚本，在临时页面上运行应该显示一个请求“Please enter a phone number 'phrase'”的对话框。输入一个有效的电话短语，如\
    \ (800) DENTIST（或 310) GROCERY），应该会得到第二个对话框，给出该短语对应的电话号码。图 1.3 显示了基于电话号码 (212)\
    \ GET-CTR 的截图序列。\n\n逐行检查此脚本，即使没有之前的编程经验，也可以看到它的内容如何与其运行时的行为相对应。首先，记住 JavaScript\
