    # 4.2 Object Values


    The following two facts about objects are essential to understanding how

    uuse objects correctly and efficiently, and should be memorized:


    +   * Every evaluation of an object literal creates a brand-new object.


    +   * The value of an object literal expression is not really the object itself,

    but rather a reference, or pointer, to it.


    We need to tell this story in pictures. Figure 4.1 shows the result of

    executing a script that declares three variables and creates two objects.

    Note how the two object facts are reflected in the following:


    +   * Because two separate object literals are evaluated, two distinct ob-

    jects are created, even though each object contains the same proper-

    ties with the same values.


    +   * Although the code seems to suggest the objects themselves are stored

    inside the variables, the variables contain only references.


    The use of references means that one object can be simultaneously referred

    by more than one variable. Either variable can be used to update the

    object''s properties, and can be used to see these updates. See Fig-

    are 4.2.


    You can disassociate an object from a variable by assigning a different

    value to the variable. The special value null is particularly useful in this

    regard. It''s generally used to represent the notion of a "pointer to nothing",

    as as shown in Figure 4.3.


    Every object you create up storage space. When an object ceases

    to be referenced from any variable, it becomes known as garbage. JavaScript

    garbage eventually gets picked up, freeing the storage space it occupied

    for you to create new objects. Generating garbage is a good thing; it''s a

    bad thing to hold on objects you will never use again, as that space will

    never be freed up. A program that loses memory because unused objects

    are not being reclaimed is said to have a memory leak.


    ![](img/8b2f777e78c0b5f77130ace12a52e3b1_52_0.png)


