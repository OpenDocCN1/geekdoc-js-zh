    when an operator is applied to a value of an unexpected type, JavaScript will
    find a suitable treatment for your value. When a Boolean is expected, false, the
    empty string ("" or ''''),''), undefined, null, and NaN are treated as false and
    everything else is treated as true. When a string is expected, nonstrings are
    treated as you might expect—for example, true as "true" and 100 as "100". When
    a number is expected, undefined is treated as NaN, null and false are 0, and true
    is 1. Strings that look like numbers are treated as numbers; those that don''t
    like NaN-number conversion kicks in for most arithmetic operations, but not for
    addition, because pesky plus symbol (+) does string concatenation instead!


    ```

    "dog" + 256  => "dog256"

    "dog" * 256  => NaN

    "100" + 256  => 100256

    "100" * 256  => 25600

    "100" * "256"  => 25600

