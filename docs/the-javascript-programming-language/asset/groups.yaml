- md: "\n# Contents\n\n- Afterword 85\n- Book Website Guide 87\n- Glossary 89\n- Bibliography\
    \ 91\n- Index 93\n\n# About This Book\n\n## Introduction\n\nThis short guide introduces\
    \ the JavaScript™ programming language. It is targeted to students taking a general-interest\
    \ computer science course (CS50) who need material on a specific programming language\
    \ to complete a language-neutral primary text. For this reason, we limit our coverage\
    \ to the \"good parts\" subset of the JavaScript language. While no previous programming\
    \ experience is assumed, it is fast-paced and at times includes material not traditionally\
    \ presented at the introductory level. Therefore, it is also suitable for seasoned\
    \ programmers who are new to the language and desire a practical adventure. Sections\
    \ with advanced material that can be safely skipped are marked with an asterisk\
    \ (*).\n\nWhile the book strives to teach basic programming practice, it is ultimately\
    \ about the JavaScript language, and includes details of objects, functions, constructors,\
    \ and prototypes. Understanding a language's structural foundation is necessary\
    \ to express oneself effectively in the language. Of course, we do not neglect\
    \ the fact that JavaScript is the primary language for making web browsers more\
    \ interactive. Given that web programming is only one application area of JavaScript,\
    \ however, we defer coverage of this topic until after much of the language has\
    \ been covered in detail.\n\nBecause the book is concise, it's best read to cover.\
    \ We start with the rationale for the JavaScript language and quickly introduce\
    \ several short example programs. The middle chapters of the text cover the major\
    \ elements of the language in a rather technical fashion, illustrated with ready-to-run\
    \ example code. The last chapter explores JavaScript's use on the World Wide Web,\
    \ briefly introducing HTML and Ajax. We encourage readers to enter and run the\
    \ sample code, and to work through the many exercises at the end of each chapter.\n\
    \nvii\n\n# About This Book\n\nWe do hope that readers who have picked up this\
    \ book only to satisfy a required course in JavaScript will nevertheless gain\
    \ the knowledge and skills necessary to move on to study the interesting and rewarding\
    \ disciplines of computer science and software engineering.\n\n# Text Website\n\
    \nVisit http://www.jpubub.com/catalog/9780673665680 for errata, additional exercises,\
    \ solutions, and more sample code.\n\n# Acknowledgments\n\nWe are grateful to\
    \ Loren Abrams, Hervé Franceschi, and B. J. Johnson for their insight and comments;\
    \ all took significant time and effort to help us improve the text a great deal.\
    \ Thanks also to Mike Megally and Matt Werner for giving us their overall impressions.\n\
    \nLove and thanks to Mei Lyn, Aidan, Anton, and Aila for their support and perspective.\n\
    \n> -JDND\n\nFinally, Tim Anderson, Acquisitions Editor; Melissa Potter, Editorial\
    \ Assistant; Amy Rose, Production Director; Ashlee Hazeltine, Production Assistant;\
    \ and their Jones and Bartlett colleagues were instrumental in encouraging this\
    \ book and seeing it through the entire production process.\n\n# Introduction\n\
    \nRather than introducing you to JavaScript, this chapter takes the approach of\
