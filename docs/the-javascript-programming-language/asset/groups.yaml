    # 目录


    - 后记 85

    - 书籍网站指南 87

    - 术语表 89

    - 参考文献 91

    - 索引 93


    # 关于本书


    ## 引言


    本简短指南介绍了 JavaScript™ 编程语言。它针对的是通修计算机科学课程（CS50）的学生，这些学生需要特定的编程语言材料来完成一本与语言无关的主文本。因此，我们将范围限制在
    JavaScript 语言的“优秀部分”子集。虽然我们假设读者没有之前的编程经验，但它的节奏很快，且有时包含传统上入门水平不会介绍的内容。因此，它也适用于对该语言陌生并渴望实战冒险的资深程序员。可以安全跳过的高级章节已标记了星号
    (*）。


    尽管本书旨在教授基础编程实践，但它根结底是关于 JavaScript 语言，包含了对象、函数、构造函数和原型的细节。理解语言的结构基础对于在该语言中有效地表达自己是必要的。当然，我们没有忽视
    JavaScript 是让网络浏览器更具交互性的主要语言这一事实。鉴于网络编程只是 JavaScript 的一个应用领域，我们将该主题的介绍推到了详细介绍大部分语言内容之后。


    由于本书非常简洁，最好从头到尾阅读。我们从 JavaScript 语言的原理开始，并迅速介绍了几个短小的示例程序。书的中间章节以相当技术的方式涵盖了语言的主要元素，并配有可以直接运行的示例代码。最后一章探索了
    JavaScript 在万维网上的用法，简要介绍了 HTML 和 Ajax。我们鼓励读者输入并运行示例代码，并完成章节末尾许多练习。


    vii


    # 关于本书


    我们真心希望那些为了满足 JavaScript 课程要求而拿起这本书的读者，能够获得必要的知识和技能，以便继续学习有趣且有回报的计算机科学和软件工程学科。


    # 文本网站


    访问 http://www.jpubub.com/catalog/9780673665680 获取勘误说明、额外练习、答案和更多示例代码。


    # 致谢


    感谢 Loren Abrams、Hervé Franceschi 和 B. J. Johnson 的见解和评论；他们都花费了大量时间和精力帮助我们大大改进了文本。感谢
    Mike Megally 和 Matt Werner 为我们提供整体印象。


    感谢 Mei Lyn、Aidan、Anton 和 Aila 的支持和观点。


    > -JDND


    最后，Tim Anderson（收购编辑）、Melissa Potter（编辑助理）、Amy Rose（制作总监）、Ashlee Hazeltine（制作助理）以及他们的
    Jones and Bartlett 同事在鼓励本书和完成整个制作过程中起了关键作用。


    # 引言


    本章并不是向你介绍 JavaScript，而是带你入门。在简要讨论了为什么 JavaScript 值得学习之后，我们立即进入编写和运行各种真实的 JavaScript
    程序。


    ## 1.1 为什么选择 JavaScript？


    JavaScript 是今天使用的许多编程语言之一，主要作为允许网页变得“动态”或“交互式”的技术而闻名。每种编程语言都有自己的优点、独特特征、支持者和反对者，所有这些都构成了学习该语言的价值的理由。在
    JavaScript 的情况下，该语言值得学习的原因有以下这些：


    - 得益于网络浏览器的普及，几乎任何计算设备都可以“开箱即用”运行 JavaScript。不需要安装、下载或设置。

    - JavaScript 程序与网页内容的集成程度比任何其他当前编程语言的程序都更好，能够在“纯”网页中（无需插件或扩展）实现可拖拽对象、可滚动地图、动画和实时效果、3D
    渲染等。


    无论人们对该语言有多少误解，JavaScript 都是一种极其强大且极其流行的编程语言（某些人认为它是目前使用最流行的语言）。


    # 第1章 引言


    在编程语言领域，流行性往往意味着重要性。


    ## 1.2 编写和运行 JavaScript


    要编写和运行 JavaScript 程序，你需要以下资源：


    - 一个网络浏览器


    就这些。虽然从技术上说这一单一要求可能取决于各种条件（例如，它必须是“现代”网络浏览器；必须启用 JavaScript；你必须拥有 JavaScript 的“良好实现”），但在书中我们采取乐观（且很可能）的立场，认为你今天使用的浏览器已经准备好并愿意运行
    JavaScript。所以，启动浏览器，从最简单的方法开始：浏览器自己的地址栏。


    ### 1.2.1 JavaScript URL


    在你的网络浏览器中输入以下“Hello world!”：


    ```javascript

    javascript:alert("Hello world!")

    ```


    让你的浏览器访问此地址（通常通过按 Enter 或 Return 键），你的浏览器应该弹出一个窗口，上面惊讶地写着“Hello world!”


    图 1.1 展示了该程序在运行不同操作系统的两个浏览器中的样子（其他浏览器和平台看起来非常相似）。底层网站不会影响显示——你要求浏览器执行一个 JavaScript
    程序（`alert("Hello world!")`），而浏览器照从了。为了强调网络浏览器的普及性，泛指 JavaScript，，书中的屏幕截图将刻意混合不同的浏览器和平台。除非另有说明，书中的所有内容在你的设备上都应该运行良好。最终显示可能看起来不同，但底层行为保持不变。


    ### 1.2.2 JavaScript 草稿页


    在单行文本字段中编写 JavaScript 很快就会变得很麻烦，我们开发了一个“草稿页”，通过它你可以更容易输入脚本。网站 http://javascript.cs.lmu.edu/scratch
    托管了此类草稿页的原始版本（图 1.2）。


    ![](img/8b2f777e78c0b5f77130ace12a52e3b1_12_0.png)


    **图 1.1** Linux 上的 Firefox 和 Windows XP 上的 Chrome 显示 JavaScript "Hello world!"


    ![](img/8b2f777e78c0b5f77130ace12a52e3b1_12_1.png)


    **图 1.2** 一个原始的 JavaScript 草稿页


    要使用此功能，在文本区域输入脚本，然后点击 **Run** 按钮。对于第 1.2 节中的简易示例，你会输入：


    ```javascript

    alert(''Hello world!'');

    ```


    这与你在地址栏中输入的内容相同，*除了*没有了 `javascript:` 前缀。该前缀不是语言的一部分；它是一个告诉浏览器如何解释文本的标记。因为草稿页期望且只有在
    JavaScript 下才能正常工作，所以这个前缀现在是不需要的。


    意不意外，点击 Run 导致的结果与之前完全相同。这是因为浏览器运行的是完全相同的程序——唯一的区别在于你输入的方式。


    你可能想通过输入和运行接下来的简短示例来稍微适应这个环境。我们不会对这些示例进行大部分解释；它们的目的不是教你语言，而是让你习惯输入和运行 JavaScript
    的过程。如果你已经有一定的编程经验，选择这些示例是为了预览 JavaScript 的一些有趣且独特的方面，因此快速扫描一遍会很有用。


    记住按照所示内容准确输入。如果程序运行不符合预期，请检查你输入的内容以确保它与给定的程序匹配。此外，欢迎通过细小更改并观察结果来实验这些脚本。


    - 此程序模拟单次掷骰子——每当你运行它时，都会得到一个一到六之间的随机数：


    ```javascript

    alert("You rolled a " + (Math.floor(Math.random() * 6) + 1) + "!");

    ```


    - 这个程序根据你熟悉的 20 世纪 40 年代节目玩简单的“填空”游戏：


    ```javascript

    alert("I like " + prompt("请输入城市:") + " in " + prompt("请输入月份:") + ", how about
    you?");

    ```


    - 这两行代码对于懒得处理大小写的人来说非常棒：


    ```javascript

    alert(prompt("要大喊的内容:").toUpperCase());

    alert(prompt("大喊内容（全大写）").toLowerCase());

    ```


    - 这是一个运行用户输入的另一个脚本的脚本。你认为哪一点更有趣——在 JavaScript 中可以做到这一点，还是脚本可以短到这样？


    ```javascript

    new Function(prompt("输入脚本:")));();

    ```


    注意这些括号——它们必须按照所示内容输入。当你在这个程序的提示框中输入的脚本是程序本身时，你认为会发生什么？


