    # 5.3 Introduction to Ajax


    This time, you''re using setInterval. Like setTimeout, setInterval defers the
    calling of a function for some number of milliseconds. Unlike setTimeout, setInterval
    repeats the function call, between pauses (intervals) of the given amount of time.
    In the preceding example, the green status area of the playground gets a by-the-second
    update of the current date and time. The function is called repeatedly, for forever.
    Without writing additional code, you would need to reload a page, close the browser
    window, or visit a new site to end the repeated calls.


    With additional code, you can exert better control over setTimeout and setInterval.
    When invoked, these functions actually return something—a value that serves as
    an identifier for the particular "deferred call" represented by the timeout or
    interval function. This identifier can be used in clearTimeout and clearInterval,
    respectively, to stop or cancel the pending function call(s). To use these functions,
    your code as here:


    ```

    // starting a timeout or interval, save the returned ID.

    var timeoutID = setTimeout(function, someDuration);

    var intervalID = setInterval(anotherFunction, anotherDuration);


    /* any other code runs here... */


    // whenever a timeout or interval must be canceled, invoke:

    clearTimeout(timeoutID);

    clearInterval(intervalID);

    ```


    Visit http://javascript.cs.lmu.edu/deferred for a concrete demonstration of this
    family of functions. You can also use web page to review the HTML and JavaScript
    files are packaged, as discussed in Section 5.2.5.


    At this point, you should have the information needed to fully understand the
    phone conversion page that was introduced in Section 5.1. Now would be a good
    time to revisit http://javascript.cs.lmu.edu/phone-form to see how the JavaScript
    interactions described above come together to produce a relatively useful, and
    (we hope) fairly understandable, browser-based application.


    When you''re ready, we can go ahead and cap off this book with an introduction
    to Ajax, which combines JavaScript and dynamic HTML with the rest of the Web to
    realize the full interactive potential of each of these technologies.


    # 5.3 Introduction to Ajax


    Congratulations—you''re almost done. Having come this far with this book, you
    should now know, among other things:'
  - '[PAGE 83]


    # CHAPTER 5 Interaction


    ■ The overall look (syntax) and meaning (semantics) of the JavaScript scripting/programming
    language (Chapters 1 to 4)

    ■ The way a web browser “exposes” a web page''s HTML content as a tree of JavaScript
    objects starting with document (Section 5.2.1)

    ■ The way a user''s interactions with a web page can trigger JavaScript code to
    change the current content of the web page, or otherwise respond to the user''s
    activities (Section 5.2.3)


    This knowledge forms the foundation for developing browser applications such as
    the one shown in Section 5.1. Such web pages are essentially downloadable applications
    that can run within a web browser without requiring additional plug-ins or “native”
    (to the operating system) code.

    Through all of this, one last aspect of the Web remains unused—and that is the
    Web itself. No web page is an island; any website''s usefulness and power derives
    at least partially from its access to/from other sites on the Internet. So far,
    the only connectivity mechanisms we''ve seen are the link or anchor—an explicit
    HTML tag that, when clicked, makes the browser discard of its current web page
    and reload page in its entirety—plus the src variant of script tag which causes
    the browser to download and run a .js file from the Web. Nevertheless, it is possible
    to communicate with the Web without causing the full HTML downloading-rendering
    sequence to start over. This ability, coupled with JavaScript and dynamic HTML,
    forms the basis of Ajax (Asynchronous JavaScript and XML). As with the rest of
    this book, we cannot cover Ajax in full detail, but this section introduces you
    to its primary concepts and mechanisms.


    # 5.3.1 Ajax in Action


    To Ajax in action, you generally need look no further than any website that claims
    to use “Web 2.0” technology. Scrolling maps or lists, live updates, and dynamic
    filters that don''t change addresses or load new pages are very likely using Ajax
    to accomplish these effects. For a simple example with code that is short enough
    to easily digest, we''ve written a small Ajax-style application that you can access
    at http://javascript.cs.lmu.edu/ajax-sample.


    You can use the View Source feature of your web browser to look at the HTML (and
    thus the DOM) of that sample application. To see the JavaScript code that drives
    this example'
