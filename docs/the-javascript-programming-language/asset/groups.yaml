    \n使用引用意味着一个对象可以同时被多个变量引用。任何一个变量都可以用于更新对象的属性，并用于查看这些更新。见图 4.2。\n\n你可以通过为变量分配不同的值来将对象与变量解除关联。特殊值\
    \ `null` 在这方面特别有用。它通常用于表示“指向空无”的概念，如图 4.3 所示。\n\n你创建的每个对象都会占用存储空间。当一个对象不再被任何变量引用时，它被称为垃圾。JavaScript\
    \ 垃圾最终会被清理，释放它所占用的存储空间供你创建新对象。产生垃圾是好事；持有再也不会使用的对象是坏事，因为那些空间永远不会被释放。一个因为未使用的对象未被回收而丢失内存的程序被称为内存泄漏。\n\
    \n![](img/8b2f777e78c0b5f77130ace12a52e3b1_52_0.png)\n\n图 4.1 三个变量和两个对象\n\n```javascript\n\
    var a = {x:1, y:2};\nvar b = a;\nvar c = {x:1, y:2};\nb.y = 3;\nalert(a.y); //\
    \ 3\n```\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_53_0.png)\n\n图 4.2 更新共享对象的属性\n\
    \n```javascript\nvar a = {x:1, y:2};\nvar b = a;\nvar c = {x:1, y:2};\nb.y = 3;\n\
    c = null;\n```\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_53_1.png)\n\n图 4.3\
    \ 给变量赋值 null\n\n### 4.3 原型\n\n考虑一个处理地球点的脚本。为了避免为地球表上的成千上万个点重复编写“latitude”和“longitude”，我们可以尝试这样的脚本：\n\
    \n```javascript\n// 这个函数在每次调用时都会新点。\nmake_point = function(lat, lon) {\n  return\
    \ {\n    latitude: lat,\n    longitude: lon,\n    is_valid: function() {\n   \
    \   return Math.abs(this.latitude) <= 90 &&\n             Math.abs(this.longitude)\
    \ <= 180;\n    },\n    antipodes: function() {\n      return make_point(-this.latitude,\
    \ -this.longitude);\n    },\n    arctic_circle: function() {\n      return this.latitude\
    \ > 66.5608;\n    }\n  };\n};\n\nvar mauna_ke = make_point(19, -155);\nalert(mauna_ke.arctic_circle());\
    \ // false\nalert(mauna_ke.is_valid()); // true\nalert(mauna_ke.antipodes());\
    \ // -19\n\nvar north_pole = make_point(90, 0);\nalert(north_pole.arctic_circle());\
    \ // true\nalert(north_pole.is_valid()); // true\nalert(north_pole.antipodes());\
    \ // -90\n```\n\n当然，这种代码非常浪费。我们创建的每个点都需要空间来存储所有函数，见图 4.4。\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_54_0.png)\n\
    \n图 4.4 浪费的拷贝\n\n幸运的是，JavaScript 的设计者意识到共享属性的必要性。由于这个原因，他们给每个对象提供了一个指向另一个对象的隐藏属性，称为原型。当你尝试读取对象的属性时，JavaScript\
    \ 会在对象中查找。如果那里没有，就会搜索原型。图 4.5 显示了一个持有我们点的共享属性的原型。\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_54_1.png)\n\
    \n图 4.5 对象共享原型\n\nJavaScript 在创建对象时附加原型。让我们看看它是如何实现的。\n\n正如前面提到的，JavaScript 函数是对象。每个函数都有（至少）两个属性：`length`（声明中的参数数量）和\
    \ `prototype`（如果函数通过 new 调用，将附加到所有创建的对象）。当以这种方式调用函数（例如 `new Point(...)`）时，JavaScript\
    \ 会执行一些魔法：\n\n- 它创建一个全新的对象。\n- 它将这个新对象的原型设置为该 `prototype` 属性的值。\n- 它执行函数，并将 `this`\
    \ 的设置为新对象。\n- 除非你显式返回其他内容，否则它从函数返回新对象。\n\n打算配合 `new` 使用的函数是构造函数创建新类型（例如点）的惯例是编写构造函数来填充每个实例特有的属性，而将共享属性放入原型中。对于点，我们可以定义并使用以下构造函数：\n\
