    # 4.5 Native, Built-In, and Host Objects


    # 4.5 Native, Built-In, and Host Objects


    JavaScript programs are designed to run inside some host environment, such as
    a cell phone, web browser, Adobe Acrobat, or Adobe Photoshop. Objects you create
    in a JavaScript program, as well as a handful of built-in objects are called native
    objects. Objects provided by the host environment are called host objects. Web
    browsers, for instance, supply host objects such as windows, documents, buttons,
    cookies, frames, browsing histories, menus, text fields, and many more. You''ll
    see some of these in the next chapter.


    Among the few built-in JavaScript objects are Object, Function, Number, Boolean,
    String, Date, Array, RegExp and Error. One of the more useful of these objects
    is the constructor function Date. The expression new Date() creates a date object
    for the current time. If necessary, you may then modify properties of the date
    (e.g., the month or year) by calling functions such as setMonth and setYear.


    ```

    var d = new Date();

    d.setFullYear(''2285'');

    d.setMonth(8);

    d.setDate(20);

    d.setHours(18);

    d.setMinutes(29);

    d.alert(d);

    ```


    For this code, we got the following alert (your output may differ):


    Sun 20 2285 18:29:54 GMT-0700 (PDT)


    Note the month value. JavaScript uses 0 through 11—beware!


