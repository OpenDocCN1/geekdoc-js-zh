    ```\n\n我们更倾向于使用较长的形式，因为它清楚地表明函数是值。\n\n## 3.4 作为函数参数的函数\n\n所有程序员在某个时刻都会意识到，反复编写相同的代码是一件坏。如果你必须（例如）加密大批信用卡号，你肯定不会为每个信用卡号复制那\
    \ 50 多行的加密代码。相反，你会写一个加密函数，将信用卡号作为参数传入.³现在你的代码遵循了 DRY（不要重复自己）原则——这是一件好事。\n\n有时，这两个函数都通过以特定方式处理输入数组的每个元素来返回新生成的数组：\n\
    \n```javascript\nvar square_all = function(a) {\n  var result = [];\n  for (var\
    \ i = 0; i < a.length; i++) {\n    result[i] = a[i] * a[i];\n  }\n  return result;\n\
    };\n\nvar capitalize_all = function(a) {\n  var result = [];\n  for (var i = 0;\
    \ i < a.length; i++) {\n    result[i] = a[i].toUpperCase();\n  }\n  return result;\n\
    }\n```\n\n这两个函数仅在一种微小方式上*不同*。第一个函数对元素求平方；后者将其转换为大写。我们可以编写一次通用结构，并通过这个微小差异将其参数化？JavaScript\
    \ 让这变得非常简单：\n\n```javascript\nvar do_all = function(a, f) {\n  var result = [];\n\
    \  for (var i = 0; i < a.length; i++) {\n    result[i] = f(a[i]);\n  }\n  return\
    \ result;\n};\n```\n\n你对每个数组元素执行的实际操作（例如，平方、转大写）现在现在作为参数传递：\n\n```javascript\n\
    var square_all = function(a) {\n  return do_all(a, function(x) { return x * x;\
    \ });\n};\nvar capitalize_all = function(a) {\n  return do_all(a, function(x)\
