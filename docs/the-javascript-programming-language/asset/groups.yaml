    , \"Spot\", \"Spike\\];\nvar response;\n```\n\n# 2.4.2 The Expression Statement\n\
    \nAn expression statement evaluates an expression and ignores its value. Therefore\
    \ the only useful kinds of expression statements are those that have an effect\
    \ on subsequent computation, like assignment.\n\n```\n2 + 2;               //\
    \ A legal statement, but completely useless.\nx = 1 + (y = 4);      // Assigns\
    \ 4 to y and then 5 to x.\ncount++;             // Incrementing is actually quite\
    \ common.\nalert(\"hi\");         // This one definitely has a visible effect.\n\
    ```\n\n# 2.4.3 Conditional Execution\n\nPrograms often need to do one thing under\
    \ conditions and something else under conditions. The if statement does exactly\
