    \ complex object in the bunch. In addition, because the DOM serves as the liaison\
    \ between web page users and JavaScript's functionality, it includes the concept\
    \ of events, which represent things that \"happen\" outside the explicit activity\
    \ in your JavaScript code. Events includes actions taken by the current user on\
    \ the web page or even background activity performed by the web browser, such\
    \ as something that you might have scheduled for advance or periodic execution\
    \ or incoming data over the network.\n\nThe rudimentary scratch page at http://javascript.cs.lmu.edu/scratch\
    \ is itself a web page, and therefore, is visible as a JavaScript object. Type\
    \ this into the scratch page and run it:\n\n```\nalert(document);\n```\n\nWhat\
    \ do you see? You see an alert dialog box, of course, but what does it contain?\
    \ It certainly isn't null or undefined. That, us the very least, document is a\
    \ bona fide, predefined object. The alert message tells you precisely that.\n\n\
    Because document is a built-in object, it must have properties. To see some of\
    \ them, enter and run this script:\n\n```javascript\nvar i = 0;\nfor (var property\
    \ in document) {\n  alert(property);\n  i = i + 1;\n  if (i > 4) {\n    break;\n\
    \  }\n}\n```\n\nYou see a sequence of five alert dialogs, each with a name such\
    \ as bgColor, width, or getElementById. We can't give you a definitive list here,\
    \ because different browsers may list document's properties in different orders\
    \ (they may include properties that other browsers won't have). But note how,\
    \ code-wise, this is exactly how you would iterate through the properties of any\
    \ old JavaScript object.\n\nThe i counter in the preceding script limits the number\
    \ of properties shown to you; without it, you would have to press Enter or Return\
    \ a number of times. There is, however, a more palatable way to view all of document's\
    \ properties. Try this script:\n\n```javascript\nvar footer = document.getElementById(\"\
    footer\");\nfooter.innerHTML = \"<b>document properties:</b><br/>\";\nfor (var\
    \ property in document) {\n  footer.innerHTML += property + \"<br/>\";\n}\n```\n\
    \n## 5.2 Dynamic HTML\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_68_0.png)\n\n\
    Figure 5.2 The JavaScript scratch page, with a script that has appended document's\
    \ properties to its content\n\nWhat happens now? You should see something that's\
    \ not unlike Figure 5.2. Your script has changed the actual content of the scratch\
    \ page. This is the essence of dynamic HTML—changes to document are immediately\
    \ manifested as changes to the browser window. This capability represents a potential\
    \ replacement for the venerable alert function.\n\nThe \"DOM object\" does not\
    \ stop with document or its immediate properties. What lies beneath is an entire\
    \ tree of objects, with document at the top. And if you are familiar with HTML,\
    \ it gets even better: the structure of this tree parallels the structure of the\
    \ web page's HTML. Figure 5.3 illustrates this for our now-familiar JavaScript\
    \ scratch page. Individual elements of the tree (e.g., document, p, form) are\
    \ called nodes; each DOM node contains additional nodes (e.g., head contains meta\
    \ and title), the containing node is a parent node, while the contained nodes's\
    \ parents are children. A child node may have only one parent; document, the only\
    \ node that has no parent is the root of the tree.\n\nHow about a replacement\
    \ for prompt? If adding content to a web page corresponds to displaying output,\
    \ then it makes sense that reading the usereditable sections of a page, such as\
    \ text areas, check boxes, radio buttons, lists, and more, would correspond to\
    \ receiving input. In fact, this is the case. Try this script:\n\n```javascript\n\
    var scriptArea = document.getElementById('scriptArea');\nvar footer = document.getElementById('footer');\n\
    footer.innerHTML = \"<pre>\" + scriptArea.value + \"</pre>\";\n```\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_69_0.png)\n\
    \nFigure 5.3 HTML and document representations of the JavaScript script page,\
    \ with paragraph text elided for brevity; the parallels between HTML tags and\
    \ document's properties (the properties of its properties, etc.).\n\nWhen you\
    \ run this script, you should find that the web page has been appended with something\
    \ that looks exactly like the content of the scratch page's text area. That's\
    \ because it is the content of the scratch page's text area—you have just asked\
    \ JavaScript to access that text and copy it to the bottom of the page (also known\
    \ as the page's \"footer\")!\n\nThe script has replaced `prompt` with another\
    \ mechanism for receiving information from the the user; specifically, it reads\
    \ the content of the scratch page's text area. The rudimentary scratch page has\
    \ one other mechanism: the `Run button`. The ability to click a button counts\
    \ as user input.\n\nOne last thing before we move on: When we say the DOM exposes\
    \ everything on a web page to JavaScript, we can do *everything*. This following\
    \ script demonstrates this flexibility—even-buttons, whose content is typically\
    \ sacrosanct in most other environments (or else not changeable on the fly), are\
    \ fair game in the DOM:\n\n```javascript\nvar runButton = document.getElementById(\"\
    runButton\");\nrunButton.value = \"Please Execute This Script as Soon As Possible\"\
    ;\n```\n\nBut why stop there? You can never have too many buttons:\n\n```javascript\n\
