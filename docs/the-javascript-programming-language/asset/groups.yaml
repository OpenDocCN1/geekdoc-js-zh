    \ reached through an intermediary style property. These properties pertain to\
    \ a distinct standard Cascading Style Sheets (CSS).\n\n## 5.2.3 Events\n\nMost\
    \ of the time, events refer to actions performed by a user. For example, mouse\
    \ activity triggers \"mouse events,\" keyboard actions trigger \"key events,\"\
    \ and so on. If you think about it, such user activity is indeed, a good fit for\
    \ events: Users can move the mouse at any time, press keys at any time, or do\
    \ anything else at time. Thus the only way for your program to respond to such\
    \ activities is through an event handler. There are non-user-triggered events,\
    \ though; you'll read about a particularly one in Section 5.3. But for now, let's\
    \ stick with things that a user might do.\n\nThe page http://javascript.edu/playground\
    \ does not, by default, handle any events in a custom way. Let's add a trivial\
    \ event handler just to get things started:\n\n```javascript\ndocument.getElementById(\"\
    header\").onclick =\nfunction() { alert(this.innerHTML); };\n```\n\nWhen you run\
    \ this script, nothing will seem to happen. Something has happened, however: the\
    \ page has been told to handle click events on the page element whose ID is header.\
    \ This element happens to be the large heading of the page—click on now and see\
