    \ and run JavaScript: your browser's own address field.\n\n### 1.2.1 JavaScript\
    \ URLs\n\nType this \"Hello world!\" into your web browser:\n\n```javascript\n\
    javascript:alert(\"Hello world!\")\n```\n\nMake your browser go to this address\
    \ (typically by pressing the Enter or Return key), and your browser should respond\
    \ with a window that says, surprisingly enough, \"Hello world!\"\n\nFigure 1.1\
    \ illustrates this program looks in two browsers running on different operating\
    \ systems (other browsers and platforms will look very similar). The underlying\
    \ website does not affect the display—you've asked that the browser executes a\
    \ JavaScript program (alert(\"Hello world!\")) and the browser has obliged. To\
    \ emphasize the ubiquity of web browsers, by extension, JavaScript, screenshots\
    \ throughout this book will intentionally mix browsers and platforms. Unless otherwise\
    \ noted, everything in this book should run just fine on what you have. The final\
    \ displays may look different, but the underlying behavior remains the same.\n\
    \n### 1.2.2 JavaScript Scratch Pages\n\nWriting JavaScript in a one-line text\
    \ field gets very old very quickly, we've developed a \"scratch page\" through\
    \ which you can enter scripts more easily. The website http://javascript.cs.lmu.edu/scratch\
    \ hosts a rudimentary version of such a scratch page (Figure 1.2).\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_12_0.png)\n\
    \n**Figure 1.1** JavaScript \"Hello world!\" in Firefox on Linux and Chrome on\
