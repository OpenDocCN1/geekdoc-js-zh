    ## 术语表


    **Ajax** 是 Asynchronous JavaScript and XML 的缩写，是一种 JavaScript Web 编程编程风格，在其中向服务器发送请求，并在稍后的时间处理响应（通常是
    XML，但并不一定），而无需离开当前网页页。


    **Array**（数组）一个从 0 开始索引的数值集合。真正的 JavaScript 数组具有 `length` 属性，如果通过脚本为其赋值，该属性将扩展或缩小数组。


    **Character**（字符）一个命名的符号，例如加号 PLUS SIGN、音乐符号高音谱 F CLEF、切罗基字母 QV 或白色国际象棋骑士。不要将字符与字形（glyph）混淆，字形是字符的图像。例如，两个不同的字母
    P 和西里尔字母 ER 都可以用字形 P 表示；同样，不同的希腊字母 TERMA 和 N 叉求和符号 SUMATION 都可以用字形 Σ 表示。


    **Character Set**（字符集）一组字符的集合，每个字符都标记有一个称为码点（codepoint）的唯一整数。例如，在 Unicode 字符集中，西里尔字母小写
    Y 的码点是 44E（十六进制）。现今常用的字符集有 Unicode、ASCII 和 ISO-8859-1。


    **Constructor**（构造函数）一个创建新对象的函数。


    **DOM** 是 document object model（文档对象模型）的缩写，它将网页的结构和内容表示为 JavaScript 对象。


    **Event**（事件）一种动作，例如页面加载、按钮按下或点击，脚本可能希望对此做出响应。


    **Expression**（表达式）一段被求值的代码。


    **Function**（函数）可以被调用的代码，通常带有参数。JavaScript 与某些语言不同，将函数视为值，可以赋值给变量并作为参数传递给其他函数。


    **Loop**（循环）一段被执行多次的代码，直到某个条件变为真（或为假——但如果你仔细想的话，这几乎是一样的）。


    **Object**（对象）一个由命名属性组成的值。


    **Prototype**（原型）一个包含属性的对象，这些属性供许多相似的对象共享。


    **Script**（脚本）一段意图作为单元单元执行的语句序列。


    **Statement**（语句）脚本内部的执行单元。JavaScript 语句包括空语句、变量声明、求值、块、if、for、while、continue、break、return、with、switch、throw
    和 try。


    **String**（字符串）一个文本值。字符串可以视为符号或字符的序列。因此，它们具有长度，可以通过从 0 开始的数字索引访问字符串中的单个字符。


    **Type**（类型）一组特定的值。JavaScript 中的所有值都属于六类型之一：undefined、null、Boolean、number、string
    或 object。


    **Unicode**（统一字符编码）一种国际标准的字符集，包含数十万个字符。它是 JavaScript 的原生字符集。


    **Variable**（变量）一个用于数值的命名“容器”。可以通过为其分配新值来更新变量。


