    regexes are generally delimited with slashes (/ ... /). We speak of regex as matching
    strings. For example:


    +   /dog|rat|cat/ matches any string containing "dog" or "rat" or "cat," the "/"
    character means or.

    /colou?r/ matches any string containing "color" or "colour," because the question
    mark means optional.


    The complete list of built-ins, and their properties and behavior, can be found
    in [ECM99].'
