    's me.'' This 20-character string (about lines) illustrates the code for escaping\
    \ a quote character.\n- '\\u03a8\\u03b8\\u03b7\\u03b1' This string names the capital\
    \ of Greece, Αθηνα.\n\nThe \"control characters\" mentioned in Table 2.1 affect\
    \ how a string is displayed. The most common of these are the newline \\n, which\
    \ causes the rest of the string to be written on the next line, and the tab, \\\
    t, which\n\n| Character | Description |\n| :--- | :--- |\n| ' | The single-quote\
    \ character (used to get the single-quote character in a string surrounded by\
    \ single quotes) |\n| \" | The double-quote character (used to get the double-quote\
    \ character in a string surrounded by double quotes) |\n| \\xhh | Where hh is\
    \ a two-digit hexadecimal value, is the character whose codepoint is that value\
    \ |\n| \\hhhh | Where hhhh is a four-digit hexadecimal value, is the character\
    \ whose codepoint is that value |\n| \\n, \\t, \\b, \\f, \\r, \\v | The control\
    \ characters newline, tab, backspace, form-feed, carriage return, and vertical\
