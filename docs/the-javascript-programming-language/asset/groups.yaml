    \ every statement with a semicolon (;), unless it already ends with a right brace\
    \ (}). While not strictly required, this is a highly recommended practice. Leaving\
    \ out semicolons can be very problematic (see [ECM99, Sec.7.9]).\n\n### 2.4.1\
    \ The Declaration Statement\n\nA declaration statement just declares a variable.\n\
    \n```\nvar count = 0;\nvar dogs = [\"Sparky\", \"Spot\", \"Spike\"];\nvar response;\n\
    ```\n\n### 2.4.2 The Expression Statement\n\nAn expression statement evaluates\
    \ an expression and ignores its value. Therefore the only useful kinds of expression\
    \ statements are those that have an effect on subsequent computation, like assignment.\n\
    \n```\n2 + 2;               // A legal statement, but completely useless.\nx =\
