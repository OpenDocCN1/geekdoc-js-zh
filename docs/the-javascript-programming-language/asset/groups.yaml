    \ DOM 节点对应的标签内插入一个新的 HTML 标签。\n\n到为止，我们描述了三个你将使用大部分的函数和属性，DOM 中还有更多可用内容。关于完整列表，在网络上搜索“JavaScript\
    \ DOM properties”或“JavaScript DOM reference”应该会产生包含此类信息的网站。热门网站包括托管在 http://www.w3schools.com/js/js_obj_htmldom.asp\
    \ 的，\n\n"
