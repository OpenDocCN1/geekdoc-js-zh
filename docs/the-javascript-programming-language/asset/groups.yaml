    \n**图 1.3** 你第一个非平凡脚本的截图，以 (212) GET-CTR 作为要拨打的电话短语\n\n那么，实际执行的第一行是以 `phrase =\
    \ prompt` 开头的那个行……\n\n在网络浏览器中运行时，JavaScript 可以执行 `prompt`，在这种情况下，它会让网络浏览器显示一个对话框，请求拨打“电话短语”。技术上，`prompt`\
    \ 被称为“函数”，你将在第 3 章学习更多关于函数的知识。\n\n为了将电话号码中的字母转换为数字 0-9，使用了一个名为 `conversion` 的\
    \ *JavaScript 对象*。JavaScript 对象在第 4 章中会有更详细的介绍；目前可以说 `conversion` 定义了一个可能的字母到数字的“翻译”列表。每个翻译（例如，“A”对应\
    \ 2，“Q”对应 7）都用逗号 (,) 分隔，字母和数字部分用冒号 (:) 隔开。字母出现在冒号之前，与每个字母对应的数字出现在冒号之后：例如，字母“D”、“E”和“F”对应数字\
    \ 3；“T”、“U”和“V”对应数字 8；以此此类推。\n\n通过执行以 `for` 开头的代码块，脚本会遍历电话短语中的每个符号，确定其与脚本大写版本的对应关系。未列在\
    \ `conversion` 中的符号将保持未转换状态。`for` 块被称为 *循环*，因为它会根据条件重复某些活动。一旦短语中的每个符号都处理完毕，`alert`\
    \ 就会将结果显示给用户。脚本随后返回到常规的网页。\n\n## 1.4 另一个非平凡脚本\n\n在我们详细介绍 JavaScript 之前，这里有另一个（可选）脚本可以尝试。与之前的脚本一样，这个示例的目的仅仅是让你熟悉较长程序的外观和感觉。该脚本在线可用——如果你反感，可以访问\
    \ http://javascript.cs.lmu.edu/scratch/phone-phrase/：\n\n```javascript\n/**\n\
    \ * 此函数将数字转换为与该数字对应的\n * 随机按键键盘字母。非数字也会被转换。\n */\nvar getRandomFromDigit = function(digit)\
    \ {\n  var conversion = [\"ABC\", \"DEF\", \"GHI\", \"JKL\", \"MNO\", \"PQRS\"\
    , \"TUV\", \"XYZ\"];\n  // 0 和 1 不转换为字母。\n  var possibleLetters = conversion[digit\
    \ - 2];\n  return possibleLetters[Math.floor(Math.random() * possibleLetters.length)];\n\
    };\n\n// 向用户询问电话号码。\nvar phoneNumber = prompt(\"Please enter a phone number:\"\
    );\n\n/**\n * “数字”是任何数字、空格、括号和破折线的序列。\n * \"match\" 之后的代码看起来很吓人，但在高级脚本\n * 中很常见。现在，只需确保准确输入即可。\n\
    \ */\nif(phoneNumber.match(/^[0-9\\-\\(\\)\\s]*$/)) {\n  // 一个字符地构建电话号码。\n  var\
    \ mnemonic = \"\";\n  for (var index = 0; index < phoneNumber.length; index++)\
    \ {\n    mnemonic = mnemonic + getRandomFromDigit(phoneNumber[index]);\n  }\n\
    \  alert(mnemonic + \" is a possible equivalent of \" + phoneNumber + \".\");\n\
    } else {\n  // 至少有一个不是数字、空格、括号\n  // 或破折线的字符。\n  alert(phoneNumber + \" 无法解释为电话号码。\"\
    );\n}\n```\n\n当你运行脚本时，首先会收到请求你输入电话号码。输入一个有效的电话号码（脚本对它认为的“电话号码”其实非常宽松）会产生一个警框，给出该数字随机选择的字母。图\
