    # 2.3 Arrays


    An array is composed of a sequence of values. You identify the first value in
    array as a[0], the second as a[1], and so on. Arrays are written with square brackets
    (e.g., [2, 3, 7]). You can add items to the end of the array with push and to
    the beginning of the array with shift. You can remove items from the end with
    pop and from the front with shift. You can also sort arrays.


    ```

    var a = [];                  // a is an array of length 0

    var b = [3, 5];               // b has length 2

    b.push(2);                   // Now b is [3, 5, 2]

    b.shift();                  // Now b is [5, 2]

    a.push(3, 10);               // Now a is [3, 10, 5, 2]

    alert(a[0]);                // Alerts 3 and changes a to [3, 5, 2]

    lert(a.shift());           // Alerts 3 and changes a to [10]

    b.push(b[0], 1);            // Now b is [7, 3, 5, 2, 10, 1]

    b.sort();                    // Now b is [1, 10, 2, 3, 5, 7]

    ```


    What? How did 10 get between 1 and 2? The answer is that arrays can contain any
    kind of value—not JavaScript treats all values as strings when sorting. The string
    "1" is less than "10", which is less than "2". So how do you sort numerically?
    You have to wait until the next chapter for the answer to this question.


    Given an array a, the expression a.length yields the number of elements in a.
    Assigning to a.length can grow or shrink the array; new values are set to undefined.
    You may also grow an array by assigning to an index position beyond the end of
    the array.


    ```

    var a = [9, 3, 2, 1, 8, 7, 3];     // a[7] through a[19] now undefined.

    a[20] = 6;                      // Alerts 21.

    alert(a.length);                // Alerts 21.

    a.length = 50;                  // a[21] through a[49] all undefined.

    a.length = 3;                   // Now a is [9, 3, 2].

    ```'
