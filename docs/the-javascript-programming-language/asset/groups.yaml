    \ in your own words, the behavior of each of the scripts:\n\n```\nvar i = 0;\n\
    while (i < 10) {\n  continue;\n  i++;\n}\nalert(\"All done\");\n```\n\n```\nfor\
    \ (var i = 0; i < 10; i++) {\n  continue;\n}\nalert(\"All done\");\n```\n\n# Functions\n\
    \nA function is an object that carries out a specific computation; it is written\
    \ once but can be run over and over again. This chapter illustrates how to define\
    \ and use functions, spending some time on one of JavaScript's most useful and\
    \ powerful features: the ability to pass functions as arguments to other functions.\n\
    \n## 3.1 Function Definitions and Function Calls\n\nConceptually, a function transforms\
    \ inputs to outputs. Figure 3.1 shows the “computation” of an account balance\
    \ after $t$ years, given a starting balance $p$, and an annual percentage rate\
    \ $r$, compounded $n$ times per year.\nIn JavaScript, a function consists of a\
    \ block of executable code, called its *body*, together with zero or more “inputs,”\
    \ called *parameters*. The following examples show how function values are written\
    \ in JavaScript.\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_38_0.png)\n\n# CHAPTER\
    \ 3 Functions\n\n```\n// A function that computes the cube of a number.\nfunction\
    \ function(x) { return x * x * x; }\n\n// A function that computes an account\
    \ balance.\nfunction function(p, n, r, t) { return p * Math.pow(1 + (r / n), n\
    \ * t); }\n\n// A function that alerts a message twice, without returning anything.\n\
    function function(message) { alert(message); alert(\"I said: \" + message + \"\
    !\"); }\n```\n\nBecause functions exist to be reused, you will generally see function\
    \ values assigned to variables.\n\n```javascript\n// Returns the area of a circle\
    \ with radius r.\nvar circle_area = function(r) { return Math.PI * r * r; }\n\n\
    // Returns the sum of all elements in an array.\nvar sum = function(a) {\n  var\
    \ result = 0;\n  for (var i = 0; i < a.length; i++) {\n    result += a[i];\n \
    \ }\n  return result;\n};\n\n// Reverses all strings in an array.\nvar reverse_all\
    \ = function(a) {\n  for (var i = 0; i < a.length; i++) {\n    a[i] = a[i].reverse();\n\
    \  }\n};\n\n// Uppercases all strings in an array.\nvar uppercase_all = function(a)\
    \ {\n  for (var i = 0; i < a.length; i++) {\n    a[i] = a[i].toUpperCase();\n\
    \  }\n};\n\n// Whether x evenly divides y.\nvar divides = function(x, y) { return\
    \ x % y === 0; };\n```\n\nTo use, \"call,\" a function, you \"pass\" it a parenthesized\
    \ list of arguments. The function's body will run with those arguments in place\
    \ of its parameters. A return statement, if any, is used to pass the result of\
    \ a computation back to the \"caller.\" Functions that finish without executing\
    \ a return statement return undefined.\n\n```javascript\n// Assign a function\
    \ value to a variable.\nvar cubed = function(x) { return x * x * x; };\n```\n\n\
    ## 3.2 Variable Scope\n\n```javascript\n// Call the function, using the return\
    \ value.\nvar numberOfRubiksCubeBlocks = cubed(3) - 1;\n\n// Function calls can\
    \ be nested.\nalert(cubed(5));                                  // Alerts 125.\n\
    ```\n\nIf you don't pass enough arguments, the extra parameters will be initialized\
    \ to undefined.\n\n```javascript\nvar show = function(x, y) { alert(x + \" \"\
    \ + y); };\nshow(1);                               // Alerts \"1 undefined\".\n\
    ```\n\nIt is not uncommon to see functions with no parameters. For example:\n\n\
    ```javascript\nvar diceRoll = function() { return 1 + Math.floor(6 * Math.random());\
    \ };\n```\n\nTo run this function, you must write diceRoll(), not simply diceRoll.\
    \ The former calls the function; the latter simply is. Figure 3.2 shows the. ![](img/8b2f777e78c0b5f77130ace12a52e3b1_40_0.png)\n\
    \n# CHAPTER 3 Functions\n\nWe'll use the following script to illustrate how JavaScript\
    \ treats variables, as we soon see:\n\n```javascript\nvar remove_spaces = true;\n\
    var message = prompt(\"Enter a message\");\nvar codpoints = function(text) {\n\
    \  var message = [];\n  for (var i = 0; i < text.length; i++) {\n    if (remove_spaces\
    \ && text[i] == \" \") {\n      continue;\n    }\n    message.push(text.charCodeAt(i));\n\
    \  }\n  return message;\n}\n```\n\nEach time you call a function, JavaScript creates\
    \ an activation object that holds the parameters and local variables. These variables\
    \ are different from variables outside the function—even those with the same name.\n\
    \n1. Note this very important distinction between top-level variables and local\
    \ variables. Top-level variables are declared and initialized when they are first\
    \ encountered, but local variables come into existence immediately when the function\
    \ in which they are declared is called.\n"
