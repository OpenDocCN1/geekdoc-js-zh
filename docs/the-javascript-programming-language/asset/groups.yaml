    Bearach\", \"Máiréad\", \"Aisling\"]\n};\n```\n\n定义对象后，你可以使用点号（.）或方括号访问其属性。\n\n\
    ```javascript\np.country => \"Ireland\"\np[\"country\"] => \"Ireland\"\np.birth.year\
    \ => 1952\np.birth[\"year\"] => 1952\np[\"birth\"].year => 1952\np[\"birth\"][\"\
    year\"] => 1952\np.kids[1] => \"Seán\"\np[\"kids\"][1] => \"Seán\"\n```\n\n属性名可以是字符串（带或不带引号）或非负整数（0,\
    \ 1, 2, ...）。我们之前见过的数组是具有整数属性以及一个名为 `length` 属性的对象。函数也是对象。\n\n属性的点号表示法更简洁，但不能用于整数属性（即你不能写\
    \ `.1.`），而且如果属性是 JavaScript 的保留字，也无法使用点号（我们在第 21 页看到过这些）。在这些情况下，必须使用方括号表示法（例如\
    \ `a[10]`、`a[\"var\"]`）。\n\n定义对象时没有必要完整指定所有属性。你可以以后根据需要添加（或删除）属性：\n\n```javascript\n\
    var dog = {}; // 一个没有属性的对象。\ndog.name = \"Kärl\"; // 现在对象有一个属性。\nalert(dog);\n\
    dog.breed = \"Rottweiler\"; // 现在对象有两个属性。\ndelete dog.name; // 现在又变成了一个属性。\n```\n\
    \n对象的属性可以是（且通常也是）函数值。在这样的函数中，该表达式指向包含该函数的对象。\n\n```javascript\nvar vector = {\n\
    \  i: 4,\n  j: -3,\n  magnitude: function() {return Math.sqrt(this.i*this.i+this.j*this.j)};\n\
    };\nalert(vector.magnitude()); // 弹出 5\nvector.i = 0;\nalert(vector.magnitude());\
    \ // 弹出 3\n```\n\n### 4.2 对象值\n\n关于对象的两个事实对于理解如何正确高效地使用对象至关重要，应该牢记：\n\n- 每一个对对象字面量的求都会创建一个全新的对象。\n\
    - 对象字面量表达式的值并不是对象本身，而是指向它的引用或指针。\n\n我们需要用图示来讲述这个故事。图 4.1 显示了执行一个声明三个变量并创建两个对象的脚本的结果。注意这两个对象事实是如何反映在后续内容中的：\n\
