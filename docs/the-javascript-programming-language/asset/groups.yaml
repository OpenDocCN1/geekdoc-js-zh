    \ Nothing...\";\nform.appendChild(newButton);\n```\n\n(Needless to say, you really\
    \ should type and run these here to get the most out of what you're reading—there\
    \ are no screenshots to let you off the hook.)\n\n## 5.2.2 Elements and IDs for\
    \ Fun and Profit\n\nHTML defines a large number of objects beyond those illustrated\
    \ in our rudimentary scratch page. To introduce you to more DOM elements without\
    \ requiring you to write entire pages from scratch, we move to a new scratch page\
    \ that includes more objects to manipulate. This page can be seen in Figure 5.4\
    \ and is accessible online at http://javascript.info/eduplayground.\n\n![](img/8b2f777e78c0b5f77130ace12a52e3b1_70_0.png)\n\
    \n**Figure 5.4** A JavaScript scratch page with more DOM elements that you can\
    \ manipulate\n\nBefore we dive further into this new page, let's demystify some\
    \ of the properties that we have used so far. The top-level document object (Figure\
    \ 5.3) has the following functions:\n\n- **getElementById(name)**: This function\
    \ locates and returns, as a JavaScript object, the page element whose id attribute\
    \ in HTML has been set to name.\n- **createElement(type)**: This function creates\
    \ a new HTML element, as if the tag specified in type were written into the original\
    \ HTML file. The new element does not get added to the page yet (the function\
    \ appendChild does that), so you can think of element as existing in a \"holding\
    \ area\" as you customize its properties.\n\nDynamic HTML activity typically starts\
    \ with a call to document.getElementById so to \"get to\" the DOM node that you\
    \ want to manipulate. This manipulation involves reading or writing properties\
    \ such as the following:\n\n- **innerHTML**: This property, which is available\
    \ for nodes that correspond to HTML blocks as <p> ...</p> or <div> ... </div>,\
    \ represents the exact HTML code that appear within that block's opening and closing\
    \ tags. Assigning a new value to this property results in an immediate change\
    \ to the corresponding section of the web page.\n- **value**: This property, which\
    \ is available for most nodes that user input, represents the current content\
    \ of that element, such as the text within a text field, the state of a button,\
