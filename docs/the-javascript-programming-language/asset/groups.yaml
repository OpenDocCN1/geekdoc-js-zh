    \n// Set the event handler.\ndocument.getElementById(\"check\").onclick = handleCheckClick;\n\
    ```\n"
  mdcn: "\n\n## 5.2 动态 HTML\n\n参考 http://www.mozilla.org/docs/dom，以及最后由世界维网联盟（W3C）在\
    \ http://www.w3.org/DOM 定义的权威标准。这些网站中的大多数都具有基于 DOM 内部实际对象、函数和属性名称的搜索功能或大纲，例如刚才列出的那几个。\n\
    \n我们已经准备好开始操作新的沙盒页面了。要访问你想要的元素（标签）的关键是使用 `getElementById`。但正如俗所说，权力越大，责任越大：HTML\
    \ 源代码必须确保你想要的元素首先已经给它们分配了 ID。这是 HTML-JavaScript 共生关系的一个关键方面：为了让 JavaScript 能够访问（并操作）网页，必须为脚本将关心的标签标记上标识符。\n\
    \n在网页中识别 ID 很容易。在浏览器中查看我们的新页面时，选择浏览器的“查看源代码”、“页面源代码”或类似的命令。这会打开一个新窗口，显示该网页的 HTML\
    \ 代码。每一个带有 `id` 属性的标签（例如 `<p id=\"description\">`）都是你可以使用 `getElementById` 访问的元素。\n\
    \n请花点时间获取页面中的 ID 标签，然后在脚本中输入以下内容：\n\n```javascript\n// 获取我们需要的元素。\nvar input1\
    \ = document.getElementById(\"input1\");\nvar input2 = document.getElementById(\"\
    input2\");\nvar status = document.getElementById(\"status\");\n\n// 读取所需值。\nvar\
    \ number1 = parseFloat(input1.value);\nvar number2 = parseFloat(input2.value);\n\
    \n// 写入结果。\nstatus.innerHTML = number1 + \" + \" + number2 + \" = \" + (number1\
    \ + number2);\n```\n\n你刚刚写了一个简单的加法器！脚本从页面中获取 `input1` 和 `input2` 文本框，通过内置的 `parseFloat`\
    \ 函数将这些字段内的文本（`value` 属性）转换为数字，并将结果数字相加。虽然加法可能很微不足，但这个脚本旨在向你展示：通过对 HTML 元素谨慎地分配\
    \ ID，借助 `getElementById` 的帮助，可以极其容易地访问和修改网页的内容——包括请求用户输入的内容（如输入字段）。\n\n- 2. 当然，这个加法器的正确性取决于\
    \ JavaScript 算术的通用正确性，正如第 2 章所讨论的。\n\n当然，页面上的标签和信息并没有真正写着“加法器”，所以让我们用这个脚本相应地调整网页：\n\
    \n```javascript\ndocument.getElementById(\"header\").innerHTML =\n  \"简单的动态 HTML\
    \ 加法器\";\ndocument.getElementById(\"introduction\").innerHTML =\n  \"此页面用于两个数字相加.\"\
    ;\ndocument.getElementById(\"instructions\").innerHTML = \"+ +\n  \"在下方的每个字段中输入数字，\"\
    \ +\n  \"将加法脚本粘贴到文本区域，\" +\n  \"然后点击 <Add/> 按钮\";\ndocument.getElementById(\"\
    inputLabel\").innerHTML = \" 加数 1\";\ndocument.getElementById(\"input2Label\"\
    ).innerHTML = \" 加数 2\";\ndocument.getElementById(\"status\").innerHTML = \"\"\
    ;\ndocument.getElementById(\"runButton\").innerHTML = \" 执行\";\n```\n\n```javascript\n\
    // 让其他所有内容都隐藏。\nvar idsToHide = [\"check\", \"checkLabel\", \"row2\", \"row3\"\
    ];\nfor (var index = 0; index < idsToHide.length; index++) {\n  document.getElementById(idsToHide[index]).style.display\
    \ = \"none\";\n}\n// 最后的提醒：我们需要单独粘贴\n// 脚本。\nalert(\"别忘记粘贴/输入加法器脚本！\");\n```\n\
    \n一旦运行此脚本，请将其替换为纯加法脚本。注意，只要刷新页面，这些更改就会“持久有效”。你所操作的 JavaScript 对象会与页面保持在一起，直到被读取到浏览器窗口。网页承载了\
    \ JavaScript 的“生命周期”：对象、变量、函数以及其他一切在网页关闭、刷新或替换时会被丢弃，由下一个页面中出现的任何 DOM/脚本/变量取代。\n\
    \n以下单行代码集合展示了你并不局限于文本值或 `innerHTML`；你可以自由运行你最感兴趣的部分。单行代码可能会影响多个一个元素。例如，选择一个单选按钮会自动取消另一个单选按钮。此外，其中一行代码没有立即的可见效果，但会影响后续某些行的行为——你能认出是那行吗？\n\
    \n```javascript\ndocument.getElementById(\"input1\").disabled = true;\ndocument.getElementById(\"\
    check\").disabled = true;\ndocument.getElementById(\"check\").checked = true;\n\
    document.getElementById(\"radio2\").checked = true;\n// 单选按钮是互斥的。\ndocument.getElementById(\"\
    radio4\").checked = true;\ndocument.getElementById(\"password\").value = \"swordfish\"\
    ;\ndocument.getElementById(\"password\").readOnly = true;\n```\n\n```javascript\n\
    document.getElementById(\"category\").selectedIndex = 2;\ndocument.getElementById(\"\
    category\").style[\"vertical-align\"] = \"bottom\";\ndocument.getElementById(\"\
    wonder\").multiple = true;\ndocument.getElementById(\"wonder\").style.float =\
    \ \"right\";\ndocument.getElementById(\"wonder\").options[1].selected = true;\n\
    document.getElementById(\"wonder\").options[3].selected = true;\ndocument.getElementById(\"\
    status\").style.border = \"medium outset #000\";\ndocument.getElementById(\"status\"\
    ).style[\"text-align\"] = \"right\";\n```\n\n你已经注意到，纯视觉属性——只影响 HTML 元素的外观（例如颜色、字体、边框、可见性、边距），而不影响其数据或行为（例如已选中/未选中、启用/禁用）——是通过中间属性\
    \ `style`访问的。这些属性属于一个不同的标准级联样式表（CSS）。（注：原文此处有大量重复，已精简）。\n\n## 5.2.3 事件\n\n大多数时候，事件指的是用户执行的操作。例如，移动鼠标会触发“鼠标事件”，按键会触发“键盘事件”，以此此类推。如果你仔细考虑，程序响应此类活动的唯一方式就是通过事件处理器。尽管也有非用户触发的事件；你将在第\
    \ 5.3 节中读到一个特殊的。但目前，让我们专注于用户可能执行的操作。\n\nhttp://javascript.edu/playground 默认并不以自定义方式处理任何事件。让我们添加一个简易的事件处理器来开始：\n\
    \n```javascript\ndocument.getElementById(\"header\").onclick =\nfunction() { alert(this.innerHTML);\
    \ };\n```\n\n当你运行此脚本时，似乎什么都没有发生。然而，确实发生了：页面已被告知处理 ID 为 header 的页面元素的点击事件。这个元素恰好是网页的大标题——现在点击它看看会发生什么。\n\
    \n简单，但可能没什么用。这里有一个你更有可能在“实战”中看到的。再次，将其输入 http://javascript.cse.edu/playground\
    \ 并运行脚本：\n\n```javascript\n/*n 启用或禁用下拉菜单。\n*/\nvar setCategoryEnabled = function(enabled)\
    \ {\n  // 回想 JavaScript 中 \"1\" 意味着“不”\n  document.getElementById(\"category\"\
    ).disabled = !enabled;\n}\n\n/*\n* 根据“勾选”框是否被选中\n* 启用或禁用下拉菜单。\n*/\nvar handleCheckClick\
    \ = function() {\n  setCategoryEnabled(this.checked);\n}\n\n// 同步下拉菜单和复选框。\nsetCategoryEnabled(document.getElementById(\"\
    check\").checked);\n\n// 设置事件处理器。\ndocument.getElementById(\"check\").onclick\
    \ = handleCheckClick;\n```\n\n"
