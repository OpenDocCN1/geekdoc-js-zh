    ```\n// Computes the sum of all positive values in array.\nvar sum = 0;\nfor (var\
    \ i = 0; i < array.length; i++) {\n  if (array[i] < 0) { // Skip nonpositives.\n\
    \    continue;\n  }\n  sum += array[i]; // Accumulate positives.\n}\nalert(\"\
    Sum of positives is \" + sum);\n```\n\nThis completes our overview of the most\
