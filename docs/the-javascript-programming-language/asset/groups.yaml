    \ };\n```\n\n记得上一章中 `sort` 是如何工作的吗？如果需要，当第一个参数小于第二个参数时你可以返回负值；如果它们相等，则返回零；如果第一个更大，则返回正值。-\
    \ 3. 当这个概念变成你的本能时，你已经超越了编程白带水平。\n\n## 3.5 从函数返回的函数\n\n函数不仅可以传递给其他函数，还可以被返回。假设你需要一个加\
