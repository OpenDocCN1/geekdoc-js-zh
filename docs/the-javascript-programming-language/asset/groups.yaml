    - 数组是一个从 0 开始索引的值的集合。\n\n- JavaScript 语句包括声明、表达式语句、条件语句、循环以及 `break` 和 `continue`\
    \ 语句。\n\n# 练习题\n\n- 1. 设置 `x = 10, y = 4, b = false`。求出以下表达式的值：\n**(a) x * y >\
    \ 25 && !b ? y % -3 : 2**\n**(b) --y * 4 ===2 || (b --true)**\n\n- 2. 了解数值运算符：`<<`,\
    \ `>>`, `>>>`, `-` 和 `^`。用你自己的语言描述每一种。在控制台或草稿页面中尝试它们。\n\n- 3. 查阅 JavaScript 参考手册（纸质或在线），列出语言中所有的\
    \ `Math` 操作。\n\n- 4. 下面表达式代表什么？\n\n```\nMath.random() < 0.75 ? \"Heads\" : \"\
    Tails\"\n```\n\n- 5. 求出以下表达式的值：\n**(a) 5 / 0**\n**(b) 0 / 0**\n**(c) Infinity\
    \ + Infinity**\n**(d) Infinity - Infinity**\n**(e) Infinity * Infinity**\n**(f)\
    \ Infinity / Infinity**\n\n- 6. 用你自己的语言解释：变量值为 `undefined` 与变量未定义时发生的错误之间的区别。\n\
    \n- 7. 写一个（单行）脚本，使用亚美尼亚语、阿拉伯语、希伯来语、印地语、中文或其他任何使用非字母脚本的显示问候消息。\n\n- 8. 在网络上或 JavaScript\
    \ 参考书中查找数组操作 `slice` 和 `splice` 的细节。在草稿页面上实验这些操作，直到你能够用自己的语言解释它们为止。\n\n- 9. 表达式\
    \ `x < y ? x : y` 有什么用？\n\n- 10. 在第 24 页的“老鼠非常智能”示例中，当数组项之一为空字符串时发生了什么？当数组项是数字时发生了什么？值为\
    \ `undefined` 时发生了什么？你可能需要修改并运行脚本来找出。\n\n- 11. 查找关于字符串 `split` 操作的信息。求出以下表达式的值：\n\
    \n- (a) `\"one three\".split(\" \")`\n\n- (b) `\"abracabra\".split(\"a\")`\n\n\
    - 12. 写一个脚本，提示用户输入包含空格分隔的数字字符串，然后提示最小值、最大值和和。例如，如果输入 `2 9 3 4`，脚本应该提示 `Minimum\
    \ is -9, Maximum is 4, Sum is 1`。\n\n- 13. 写一个脚本，反复提示用户输入一个单词或短语，直到输入空字符串为止。在输入过程中将所有输入收集到一个数组中。将所有字符串转换为大写，然后对数组进行排序。最后，弹出数组，每个条目单独占一行。\n\
    \n- 14. 写一个脚本，提示用户输入一个字符串，然后提示输入字符串是否为回文。回文是正读和反读都相同的字符串——例如 \"I\"、\"racecar\"\
    。尝试脚本的变体，使其对字母大小写不敏感（例如允许 \"Abba\"）并忽略非字母（例如允许 \"Madam, I'm Adam\"）。\n\n- 15.\
    \ 用你自己的语言解释以下每个脚本的行为：\n\n```\nvar i = 0;\nwhile (i < 10) {\n  continue;\n  i++;\n\
    }\nalert(\"All done\");\n```\n\n```\nfor (var i = 0; i < 10; i++) {\n  continue;\n\
    }\nalert(\"All done\");\n```\n\n"
