    # CHAPTER 2 Basic JavaScript


    Interestingly, = is not the only assignment operator:


    | var x = 5; | // Same as x = x + 30, x now 35. |

    | x += 30; | // Same as x = x - 2, x now 33. |

    | x -= 2; | |

    | x += -4; | // Same as x = x + -4, x now -132. |

    | x = false; | |

    | x ||= true; | // Same as x = x || true, x now true. |


    Variables can also be updated with the ++ (increment) and -- (decrement) operators.
    These can be tricky! When placed in front of a variable, the operator updates
    the variable *before* the expression is evaluated. If the operator follows the
    variable, the variable is updated *after* the evaluation.


    | var x = 5; | // Now x is 6. |

    | x++; | |

    | y = x++; | // y gets 6, THEN x becomes 7. |

    | z = ++x; | // First z is bumped to 8, THEN z gets 8. |


    Attempting to use a variable without first declaring it generates an error, as
    the following script illustrates:


    ```

    alert(next_song);

    ```


    The actual error you''ll receive depends on what you''re using to run JavaScript;
    perhaps a window will pop up with the words “next_song is not defined.” Some systems
    have a *console*, *error*, or *debug* window that maintains a running list of
    issues.


    Perhaps strangely, this script gives us no error:


    ```

    next_song = "Purple Haze";

    ```


    We say “strange” because this line doesn''t look like a declaration; it looks
    like an assignment. JavaScript, though, treats it as a declaration if the variable
    isn''t already declared. This automatic declaration is considered by many experts
    to be a language design flaw, for technical reasons beyond the scope of this book.
    Its existence means it is important to *always use var* when declaring variables.


    Variable names are subject to two rules. First, the name must begin with a letter,
    the $ character, or the _ character, and contain only letters, digits, ''s, and
    ''$ thereafter.


