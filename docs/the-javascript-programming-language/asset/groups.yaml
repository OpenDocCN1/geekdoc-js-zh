    # CHAPTER 2 Basic JavaScript


    # 2.1.1 Booleans


    The Boolean values true and false are most often seen as the results of comparisons—expressions
    that compute whether two values are equal, not equal (!=), or ordered in some
    fashion (<, <=, >=, or >).


    ```

    7 === 5 => false (equal to)

    3 == 3 => true (not equal to)

    12 <= 12 => true (less than or equal to)

    ```


    JavaScript provides operators on Boolean values, including these:


    +   - && ("and"): x && y is true if and only if x and y are both true.

    - || ("or"): x || y is true if and if either x or y, or both, are true.

    - ^ ("exclusive or"): x ^ y is true if and only if exactly one of x and y is true
    (not both).

    - ! ("not"): !x is true if and only if x is false.


    The following table summarizes these relationships:


    | x | y | x && y | x || y | x | !x |

    |---|---|---|---|---|---|

    | true | true | true | true | false | false |

    | true | false | false | true | true | false |

    | false | true | false | true | true | true |

    | false | false | false | false | false | true |


    Do not confuse the operators && || with & and |; the two are little-used in JavaScript
    applications. Also, do not confuse their cousins == and !=; [Cro08a, p. 109].
    The == operator, for example, considers a few things to be equal to each other
    that you might not expect; however experienced programmers sometimes find them
    useful.


    # 2.1.2 Numbers


    You write numbers pretty much as you''d expect: 1729, 3.141592, and 29972948.
    The letter E (or e) sandwiched between two numbers expresses the value “number
    before E times 10 raised after E” (also known as scientific notation):


    ```

    3.6288E6 => 3.6288 × 10⁶ => 3628800

    5.390E-44 => 5.390 × 10⁻⁴⁴

    4.63e170 => 4.63 × 10¹⁷⁰

    ```'
