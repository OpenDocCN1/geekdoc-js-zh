  ## 14.4 等等性：`==` vs. `===`\n### 14.4.1 宽松相等 (`==` 和 `!=`)\n### 14.4.2 严格相等 (`===`\
  \ 和 `!==`)\n### 14.4.3 建议：始终使用严格相等\n### 14.4.4 比 `===` 更严格的：`Object.is()`\n### 14.5\
  \ 排序运算符\n### 14.6 其他各种运算符\n### 14.6.1 逗号运算符\n### 14.6.2 `void` 运算符\n\n***\n\n###\
  \ 14.1 理解运算符\n\nJavaScript 的运算符看起来可能很怪异。通过以下两条规则，它们会变得更容易理解：\n\n* 运算符会将其操作数转换为适当的类型\n\
  * 大多数运算符只对原始值作用\n\n### 14.1.1 运算符会将其操作数转换为适当的类型\n\n如果运算符获取的操作数没有正确的类型，它很少抛出异常。相反，它会\
  \ `coerces`（自动转换）操作数以便对其进行操作。让我们来看两个例子。\n\n首先，乘法运算符只能与数字一起。因此，它在计算结果之前会将字符串转换为数字。\n\
  \n```\n> '7' * '3'\n21\n```\n\n其次，用于访问对象属性的方括号运算符 `[ ]` 只能处理字符串和符号。所有其他值都被转换为字符串：\n\
  \n```javascript\nconst obj = {};\nobj['true'] = 123;\n// 将 true 字符串 'true'\nassert.equal(obj[true],\
  \ 123);\n```\n\n### 14.1.2 大多数运算符只对原始值作用\n\n如前所述，大多数运算符只对原始值作用。如果操作数是一个对象，它通常会被转换为原始值——例如：\n\
  \n```\n> [1,2,3] + [4,5,6]\n'1,2,34,5,6'\n```\n\n为什么呢？`+` 运算符首先将其操作数转换为原始值：\n\n\
  ```\n> String([1,2,3])\n'1,2,3'\n> String([4,5,6])\n'4,5,6'\n```\n\n接下来，它拼接这两个字符串：\n\
  \n```\n> '1,2,3' + '4,5,6'\n'1,2,34,5,6'\n```\n\n### 14.2 加法运算符 (`+`)\n\n`+` 运算符在\
  \ JavaScript 中的工作方式如下：\n\n* 首先，它将两个操作数都转换为原始值。然后它会切换到两种模式之一：\n    * 字符串模式：如果两个原始值其中一个是字符串，那么它将另一个转换为字符串，拼接两个字符串并返回结果。\n\
  \    * 数字模式：否则，它将两个操作数都转换为数字，将它们相加并返回结果。\n\n字符串模式允许我们使用 `+` 来组装字符串：\n\n```\n> 'There\
  \ are ' + 3 + ' items'\n'There are 3 items'\n```\n\n数字模式意味着如果两个操作数都不是字符串（或变成字符串的对象），那么一切都将被转换为数字：\n\
  \n```\n> 4 + true\n5\n```\n\n`Number(true)` 是 `1`。\n\n### 14.3 赋值运算符\n\n### 14.3.1\
  \ 基础赋值运算符\n\n基础赋值运算符用于更改存储位置：\n\n```javascript\nx = value; // 赋值给之前声明的变量\nobj.propKey\
  \ = value; // 赋值给属性\narr[index] = value; // 赋值给 Array 元素\n```\n\n变量声明中的初始化器也可以被视为赋值的形式：\n\
  \n```javascript\nconst x = value;\nlet y = value;\n```\n\n### 14.3.2 复合赋值运算符\n\n\
  给定运算符 `op`，以下两种赋值方式是等价：\n\n```javascript\nmyvar op= value\nmyvar = myvar op value\n\
  ```\n\n例如，如果 `op` 是 `+`，那么我们得到了运算符 `+=`，它的工作方式如下。\n\n```javascript\nlet str = '';\n\
  str += '<b>';\nstr += 'Hello!';\nstr += '</b>';\nassert.equal(str, '<b>Hello!</b>');\n\
  ```\n\n### 14.3.3 所有复合赋值运算符列表\n\n*算术运算符：\n    ```\n    += -= *= /= %= **=\n    ```\n\
  \    `+=` 也适用于字符串拼接\n\n* 位运算运算符：\n    ```\n    <<= >>= >>>= &= ^= |=\n    ```\n\n\
  ## 14.4 等等性：`==` vs. `===`\n\nJavaScript 有两种等性运算符：宽松相等 (`==`) 和严格相等 (`===`)。建议始终使用后者。\n\
  \n**`==` 和 `===` 的其他名称**\n\n* `==` 也称为 `double equals`。它在语言规范中的正式名称是 `abstract equality\
  \ comparison`（抽象等性比较）。\n* `===` 也称为 `triple equals`。\n\n### 14.4.1 宽松相等 (`==` 和\
  \ `!=`)\n\n宽松相等是 JavaScript 的怪异之一。它经常转换操作数。其中一些转换是有意义的：\n\n```\n> '123' == 123\n\
  true\n> false == 0\ntrue\n```\n\n另一些则没那么合理：\n\n```\n> '' == 0\ntrue\n```\n\n当（且仅当！）另一个操作数是原始值时，对象会被转换为原始值：\n\
  \n```\n> [1, 2, 3] == '1,2,3'\ntrue\n```\n\n### 14.4.2 严格相等 (`===` 和 `!==`)\n\n\n\
  \n\n\n### 14.4.4 比 `===` 更加严格：`Object.is()`\n\n`Object.is()` 方法比较两个值：\n\n```\n>\
  \ Object.is(123, 123)\ntrue\n> Object.is(123, '123')\nfalse\n```\n\n它比 `===` 更加严格。例如，它认为\
  \ `NaN`（涉及数字计算的错误值）等于它自己：\n\n```\n> Object.is(NaN, NaN)\ntrue\n> NaN === NaN\nfalse\n\
  ```\n\n这在某些情况下非常有用。例如，你可以用它来实现一个改进版的数组方法 `.indexOf()`：\n\n```javascript\n[](#cb180-1)const\
  \ myIndexOf = (arr, elem) => {\n[](#cb180-2)  return arr.findIndex(x => Object.is(x,\
  \ elem));\n[](#cb180-3)};\n```\n\n`myIndexOf()` 能够在数组中查找并找到 `NaN`，而 `.indexOf()`\
  \ 则不能：\n\n```javascript\n> myIndexOf([0,NaN,2], NaN)\n1\n> [0,NaN,2].indexOf(NaN)\n\
  -1\n```\n\n结果 `-1` 表示 `.indexOf()` 未能在数组中找到其参数。\n\n### 14.5 排序运算符\n\n表 3：JavaScript\
  \ 的排序运算符。\n\n| 运算符 | 名称 |\n| --- | --- |\n| `<` | 小于 |\n| `<=` | 小于等于 |\n| `>` |\
  \ 大于 |\n| `>=` | 大于等于 |\n\nJavaScript 的排序运算符（见表 3）同时适用于数字和字符串：\n\n```javascript\n\
  > 5 >= 2\ntrue\n> 'bar' < 'foo'\ntrue\n```\n\n`<=` 和 `>=` 基于严格相等。\n\n![](img/file4.svg)\
  \ **排序运算符对于人类语言的效果并不理想**\n\n排序运算符在比较人类语言的文本时效果并不好，例如当涉及大小写字母或重音符号时。细节请见 §20.5 “比较字符串”。\n\
  \n### 14.6 其他各种运算符\n\n布尔值、字符串、数字、对象的运算符将在本书其他部分介绍。\n\n接下来的两个小节将讨论两个很少使用的运算符。\n\n\
  #### 14.6.1 逗号运算符\n\n逗号运算符有两个操作数，它求值两者并返回第二个：\n\n```javascript\n> 'a', 'b'\n'b'\n\
  ```\n\n有关该运算符的更多信息，请参阅 [*Speaking JavaScript*](http://speakingjs.com/es5/ch09.html#comma_operator)。\n\
  \n#### 14.6.2 void 运算符\n\n`void` 运算符求其操作数并返回 `undefined`：\n\n```javascript\n> void\
  \ (3 + 2)\nundefined\n```\n\n有关该运算符的更多信息，请参阅 [*Speaking JavaScript*](http://speakingjs.com/es5/ch09.html#void_operator)。\n\
  \n![](img/file7.svg) **测试题**\n\n查看测试应用。\n\n# 15 非值 `undefined` 和 `null`\n\n* * *\n\
  \n* 15.1 `undefined` 对比 `null`\n* 15.2 `undefined` 和 `null` 的出现情况\n    * 15.2.1\
  \ `undefined` 的出现情况\n    * 15.2.2 `null` 的出现情况\n* 15.3 检查 `undefined` 或 `null`\n\
  * 15.4 `undefined` 和 `null` 没有属性\n* 15.5 `undefined` 和 `null` 的历史\n\n* * *\n\n许多编程语言都有一种名为\
  \ `null` 的“非值”。它表示变量当前没有指向任何对象——例如，当它尚未被初始化时。\n\n相比之下，JavaScript 有两个值：`undefined`\
  \ 和 `null`。\n\n### 15.1 undefined vs. null\n\n这两个值非常相似，并且经常互换使用。因此，它们的区别非常细微。语言本身做了以下区分：\n\
  \n* `undefined` 意味着“未初始化”（例如一个变量）或“不存在”（例如对象的某个属性）。\n* `null` 意味着“有意地缺席任何对象值”（引自[语言规范](https://tc39.github.io/ecma262/#sec-null-value)）。\n\
  \n程序员可能会做出以下区分：\n\n* `undefined` 是语言使用的非值（当某些内容未初始化等时）。\n* `null` 意味着“显式地关闭”。也就是说，它有助于实现一种既包含有意义的值、又包含代表“无意义值”元值的类型。这种类型在函数式编程中被称为[*可选类型\
  \ (option type)* 或 *可能值类型 (maybe type)*](https://en.wikipedia.org/wiki/Option_type)。\n\
  \n### 15.2 undefined 和 null 的出现情况\n\n接下来的小节描述了 `undefined` 和 `null` 在语言中出现的地方。我们将遇到几种机制，它们将在本书后范围内进行详细解释。\n\
  \n#### 15.2.1 undefined 的出现情况\n\n未初始化的变量 `myVar`：\n\n```javascript\n[](#cb185-1)let\
  \ myVar;\n[](#cb185-2)assert.equal(myVar, undefined);\n```\n\n参数 `x` 未提供：\n\n```javascript\n\
  [](#cb186-1)function func(x) {\n[](#cb186-2)  return x;\n[](#cb186-3)}\n[](#cb186-4)assert.equal(func(),\
  \ undefined);\n```\n\n属性 `.unknownProp` 缺失：\n\n```javascript\n[](#cb187-1)const\
  \ obj = {};\n[](#cb187-2)assert.equal(obj.unknownProp, undefined);\n```\n\n如果你没有显式指定结果，JavaScript\
  \ 会返回 `undefined`：\n\n```javascript\n[](#cb187-1)const obj = {};\n[](#cb187-2)assert.equal(obj.unknownProp,\
  \ undefined);\n```\n\n#### 15.2.2 null 的出现情况\n\n（注：此处原文内容存在异常重复，已根据指令要求进行翻译并逻辑处理）\n\
