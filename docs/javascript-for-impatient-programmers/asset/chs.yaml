  \ 专注于 JavaScript 和 Web 开发。他自 1995 年起就开始开发 Web 应用程序。1999 年，他在一家德国初创公司担任技术经理，该公司后来扩展到了国际。2010\
  \ 年，他在慕尼黑大学获得信息学博士学位。自 2011 年以来，他一直在写关于 Web 开发博客博客并为 eBay、美国银行和 OReilly Media 等公司提供培训。他居住在德国慕尼黑。\n\
