  \ JavaScript 中的整数\n    * 17.11.1 转换为整数\n    * 17.11.2 JavaScript 中的整数范围\n* 17.12\
  \ 数字的精度：小心小数\n\n## 17.1 JavaScript 只有浮点数\n\n本章涵盖了 JavaScript 的单一类型 `number`。\n\n\
  JavaScript 只有浮点数。它们都是*双精度*（doubles）浮点数，即根据 IEEE 754 标准实现的 64 位浮点数。\n\n你可以不带小数表示整数和浮点数：\n\
  \n```javascript\n> 98 === 98.0\ntrue\n```\n\n## 17.2 数字字面量\n\n让我们来看字面量。\n\n### 17.2.1 整数字面量\n\
  \n若干*整数字面量*允许你用不同的进制表示整数：\n\n```javascript\n// 二进制（2 进制）\nassert.equal(0b11, 3);\n\
  \n// 八进制（8 进制）\nassert.equal(0o10, 8);\n\n// 十进制（10 进制）：\nassert.equal(35, 35);\n\
  \n// 十进制（16 进制）\nassert.equal(0xE7, 231);\n```\n\n### 17.2.2 浮点数字面量\n\n浮点数只能用 10\
  \ 进制表示。\n\n分数/小数：\n\n```javascript\n> 35.0\n35\n```\n\n指数：`eN` 表示 ×10^N\n\n```javascript\n\
  > 3e2\n300\n> 3e-2\n0.03\n> 0.3e2\n30\n```\n\n### 17.2.3 语法陷阱：整数字面量的属性\n\n访问整数字面量的属性会带来一个陷阱：如果整数字面量后面紧跟一个点，那么该点会被解释为小数点：\n\
  \n```javascript\n7.toString(); // 语法错误\n```\n\n有四种方法绕过这个陷阱：\n\n```javascript\n7.0.toString()\n\
  (7).toString()\n7..toString()\n7 .toString()  // 点前有空格\n```\n\n## 17.3 算术运算符\n\n\
  ### 17.3.1 二元算术运算符\n\n表 5 列出了 JavaScript 的二元算术运算符。\n\n表 5：二元算术运算符。\n\n| 运算符 | 名称\
  \ |  | 示例 |\n\n\n\n\n\n| --- | --- | --- | --- |\n| `n + m` | 加法 | ES1 | `3 + 4`\
  \ `→` `7` |\n| `n - m` | 减法 | ES1 | `9 - 1` `→` `8` |\n| `n * m` | 乘法 | ES1 | `3\
  \ * 2.25` `→` `6.75` |\n| `n / m` | 除法 | ES1 | `5.625 / 5` `→` `1.125` |\n| `n %\
  \ m` | 取余 | ES1 | `8 % 5` `→` `3` |\n| | | | `-8 % 5` `→` `-3` |\n| `n ** m` | 幂\
  \ | ES2016 | `4 ** 2` `→` `16` |\n\n#### 17.3.1.1 `%` 是取余运算符\n\n`%%` 是取余运算符，而不是取模（modulo）运算符。它的结果与第一个操作数的符号一致：\n\
  \n```\n> 5 % 3\n2\n> -5 % 3\n-2\n```\n\n关于取余和取模区别的更多信息，请参考 2ality 上的博客文章节取余运算符 vs\
  \ 取模运算符（带有 JavaScript 代码）”](https://2ality.com/2019/08/remainder-vs-modulo.html)。\n\
  \n### 17.3.2 元加 (`+`) 和 元取反 (`-`)\n\n表 [6] 总结了元加加 (`+`) 和元取反 (`-`) 这两个运算符。\n\n表\
  \ 6：元加加 (`+`) 和元取反 (`-`) 运算符。\n\n| 运算符 | 名称 | | 示例 |\n| --- | --- | --- | --- |\n\
  | `+n` | 元加加 | ES1 | `+(-7)` `→` `-7` |\n| `-n` | 元取反 | ES1 | `-(-7)` `→` `7` |\n\
  \n这两个运算符都会将其操作数强制转换为数字：\n\n```\n> +'5'\n5\n> +'-12'\n-12\n> -'9'\n-9\n```\n\n因此，元加加允许我们将任意值转换为数字。\n\
  \n### 17.3.3 递增 (`++`) 和 递减 (`--`)\n\n递增运算符 `++` 存在前缀版本和后缀版本。在两个版本中，它都会破坏性地向其操作数加\
  \ 1。因此，它的操作数必须是一个可以更改的存储位置。\n\n递减运算符 `--` 的原理相同，但是从其操作数减 1。接下来的两个示例解释了前缀版本和后缀版本之间的区别。\n\
  \n表 [7] 总结了递增和递减运算符。\n\n表 7：递增运算符和递减运算符。\n\n| 运算符 | 名称 | | 示例 |\n| --- | --- | ---\
  \ | --- |\n| `v++` | 递增 | ES1 | `let v=0; [v++, v]` `→` `[0, 1]` |\n| `++v` | 递增\
  \ | ES1 | `let v=0; [++v, v]` `→` `[1, 1]` |\n| `v--` | 递减 | ES1 | `let v=1; [v--,\
  \ v]` `→` `[1, 0]` |\n| `--v` | 递减 | ES1 | `let v=1; [--v, v]` `→` `[0, 0]` |\n\n\
  接下来，我们将查看这些运算符的使用示例。\n\n前缀 `++` 和前缀 `--` 先改变其操作数然后返回它们。\n\n```\nlet foo = 3;\nassert.equal(++foo,\
  \ 4);\nassert.equal(foo, 4);\nlet bar = 3;\nassert.equal(--bar, 2);\nassert.equal(bar,\
  \ 2);\n```\n\n后缀 `++` 和后缀 `--` 返回其操作数然后改变它们。\n\n```\nlet foo = 3;\nassert.equal(foo++,\
  \ 3);\nassert.equal(foo, 4);\nlet bar = 3;\nassert.equal(bar--, 3);\nassert.equal(bar,\
  \ 2);\n```\n\n#### 17.3.3.1 操作数：不仅是变量\n\n你也可以将这些运算符应用于属性值：\n\n```\nconst obj = {\
  \ a: 1 };\n++obj.a;\nassert.equal(obj.a, 2);\n```\n\n以及应用于数组元素：\n\n```\nconst arr\
  \ = [ 4 ];\narr[0]++;\nassert.deepEqual(arr, [5]);\n```\n\n**练习：Number 运算符**\n\n\
  `exercises/numbers-math/is_odd.mjs`\n\n### 17.4 转换为数字\n\n三种将值转换为数字的方法：\n\n* `Number(value)`\n\
  * `+value`\n* `parseFloat(value)` （与其他两种不同！）\n\n建议：使用 `Number()`。表 [8] 总结了它的工作原理。\n\
  \n表 8：值转换为数字。\n\n| `x` | `Number(x)` |\n| --- | --- |\n| `undefined` | `NaN` |\n\
  | `null` | `0` |\n| boolean | `false` `→` `0`, `true` `→` `1` |\n| number | `x`\
  \ (无变化) |\n| string | `''` `→` `0`，忽略前导后空格 |\n| object | 可配置（例如通过 `valueOf()`） |\n\
  \n示例：\n\n```\nassert.equal(Number(123.45), 123.45);\nassert.equal(Number(''), 0);\n\
  assert.equal(Number('\\n 123.45\\t'), 123.45);\nassert.equal(Number('xyz'), NaN);\n\
  ```\n\n对象转换为数字——通过覆盖 `valueOf()`：\n\n```\nNumber({ valueOf() { return 123 } })\n\
  ```\n\n**练习：转换为数字**\n\n`exercises/numbers-math/parse_number.mjs`\n\n### 17.5 错误值\n\
  \n发生错误时返回两种数字值：\n\n* `NaN`\n* `Infinity`\n\n## 17.6 错误值：NaN\n\n`NaN` 是“不是数字”的缩写。讽的是，JavaScript\
  \ 认为它是数字：\n\n```\ntypeof NaN\n'number'\n```\n\n什么时候返回 `NaN`？\n\n如果无法解析数字，则返回 `NaN`：\n\
  \n```\n> Number('$')\nNaN\n> Number(undefined)\nNaN\n```\n\n如果无法执行操作，则返回 `NaN`：\n\
  \n```\n> Math.log(-1)\nNaN\n> Math.sqrt(-1)\nNaN\n```\n\n如果操作数是 `NaN`，则返回 `NaN`（传播）：\n\
  \n```\n> NaN - 3\nNaN\n> 7 ** NaN\nNaN\n```\n\n#### 17.6.1 检查 NaN\n\n`NaN` 是唯一不等于它自身的\
  \ JavaScript 值：\n\n```\nconst n = NaN;\nassert.equal(n === n, false);\n```\n\n以下是检查值\
  \ `x` 是否为 `NaN` 的几种方法：\n\n```\nconst x = NaN;\nassert.equal(Number.isNaN(x), true);\
  \ // 优选\nassert.equal(Object.is(x, NaN), true);\nassert.equal(x !== x, true);\n\
  ```\n\n在最后一行，我们使用比较来检测 `NaN`。\n\n#### 17.6.2 在数组中查找 NaN\n\n某些数组方法无法找到 `NaN`：\n\n\
  ```\n> [NaN].indexOf(NaN)\n-1\n```\n\n其他一些可以：\n\n```\n> [NaN].includes(NaN)\ntrue\n\
  > [NaN].findIndex(x => Number.isNaN(x))\n0\n> [NaN].find(x => Number.isNaN(x))\n\
  NaN\n```\n\n遗憾，没有简单的经验法则。你必须检查每个方法是否处理了 `NaN`。\n\n## 17.7 错误值：Infinity\n\n什么时候返回错误值\
  \ `Infinity`？\n\n如果数字太大，则返回 `Infinity`：\n\n```\n> Math.pow(2, 1023)\n8.9884656743158e+307\n\
  > Math.pow(2, 1024)\nInfinity\n```\n\n如果存在除零操作，则返回 `Infinity`：\n\n```\n> 5 / 0\n\
  Infinity\n> -5 / 0\n-Infinity\n```\n\n#### 17.7.1 作为默认值的 Infinity\n\n`Infinity`\
  \ 大所有其他数字（`NaN` 除外），因此是一个良好的默认值：\n\n```javascript\nfunction findMinimum(numbers)\
  \ {\n  let min = Infinity;\n  for (const n of numbers) {\n    if (n < min) min =\
  \ n;\n  }\n  return min;\n}\nassert.equal(findMinimum([5, -1, 2]), -1);\nassert.equal(findMinimum([]),\
  \ Infinity);\n```\n\n#### 17.7.2 检查 Infinity\n\n这些是检查值 `x` 是否为 `Infinity` 的两种常用方法：\n\
  \n```javascript\nconst x = Infinity;\nassert.equal(x === Infinity, true);\nassert.equal(Number.isFinite(x),\
  \ false);\n```\n\n**练习：比较数字**\n\n`exercises/numbers-math/find_max_test.mjs`\n\n\
  ## 17.8 数字的精度：小心小数\n\n在内部，JavaScript 浮点数以二进制表示（根据 IEEE 754 标准）。这意味着小数（十进制）不能总是被精确表示：\n\
  \n```\n> 0.1 + 0.2\n0.30000000000000004\n> 1.3 * 3\n3.9000000000000004\n> 1.4 *\
  \ 100000000000000\n139999999999999.98\n```\n\n因此，在 JavaScript 中进行算术运算时，需要考虑舍入误差。\n\
  \n继续阅读以了解这种现象的解释。\n\n**练习：基础**\n\n查看 [测试应用程序]。\n\n## 17.9（高级）\n\n本章剩余的所有章节都是高级内容。\n\
  \n## 17.10 背景：浮点精度\n\n在 JavaScript 中，对数字的计算并不总是产生正确的结果——例如：\n\n```\n> 0.1 + 0.2\n\
  0.3000000000000004\n```\n\n\n\n\n为了理解其原因，我们需要探索 JavaScript 内部如何表示浮点数。它使用三个整数来实现，总共占用\
  \ 64 位存储空间（双精度精度）：\n\n| 组件 | 大小 | 整数范围 |\n| --- | --- | --- |\n| 符号 | 1 位 | [0,\
  \ 1] |\n| 小数部分 | 52 位 | [0, 2⁵²−1] |\n| 指数 | 11 位 | [−1023, 1024] |\n\n由这些整数表示的浮点数计算方式如下：\n\
  \n> `(–1)^(sign)` × `0b1.fraction` × `2^(exponent)`\n\n这种表示法无法编码零，因为它的第二个组件（涉及 `fraction`）始终有一个前导的\
  \ `1\\.`。因此，零是通过特殊的指数 `-1023` 和小数部分 `0` 来编码的。\n\n### 17.10.1 浮点数的简化表示法\n\n为了方便后续讨论，我们简化了上述表示法：\n\
  \n* 我们不再使用 2 进制（二进制），而是使用 10 进制（十进制），因为大多数人更熟悉后者。\n* `fraction` 是被解释为分数的自然数（小数点后的数字）。我们切换到\
  \ `mantissa`（尾数），它是一个被解释为其自身的整数。因此，指数的使用方式发生了变化，但它的基本作用没有改变。\n* 由于 `mantissa` 是一个整数（带有自己的符号），我们不再需要单独的符号位了。\n\
  \n新的表示法工作如下：\n\n> `mantissa × 10^(exponent)`\n\n让我们尝试用这种表示法处理几个浮点数。\n\n* 对于整数 `-123`，我们主要需要\
  \ `mantissa`：\n  ```\n  > -123 * (10 ** 0)\n  -123\n  ```\n* 对于数字 `1.5`，我们想象在 `mantissa`\
  \ 之后有一个小数点。我们使用负指数将该点向左移动一位：\n  ```\n  > 15 * (10 ** -1)\n  1.5\n  ```\n* 对于数字 `0.25`，我们将小数点向左移动两位：\n\
  \  ```\n  > 25 * (10 ** -2)\n  0.25\n  ```\n\n带有负指数的表示法也可以写成分母带有正指数的分数：\n\n```\n\
  > 15 * (10 ** -1) === 15 / (10 ** 1)\ntrue\n> 25 * (10 ** -2) === 25 / (10 ** 2)\n\
  true\n```\n\n这些分数有助于我们理解为什么存在我们的编码无法表示的数字：\n\n* `1/10` 可以被表示。它已经具备所需的格式：分母是 10 的幂。\n\
  * `1/2` 可以表示为 `5/10`。通过将分子和分母乘以 5，我们将分母中的 `2` 转换成了 10 的幂。\n* `1/4` 可以表示为 `25/100`。通过将分子和分母乘以\
  \ 25，我们将分母中的 `4` 转换成了 10 的幂。\n* `1/3` 无法表示。没有办法将分母转换为 10 的幂。（10 的质因数是 `2` 和 `5`。因此，任何只包含这些质因数的分母都可以通过将分子分母乘以足够的\
  \ 2 和 5 来转换为 10 的幂。如果分母包含不同的质因数，那么我们就无能为力。）\n\n结束这次之旅，我们切回 2 进制：\n\n* `0.5 = 1/2`\
  \ 可以用 2 进制表示，因为分母已经是 2 的幂。\n* `0.25 = 1/4` 可以用 2 进制表示，因为分母已经是 2 的幂。\n* `0.1 = 1/10`\
  \ 无法表示，因为分母无法转换为 2 的幂。\n* `0.2 = 2/10` 无法表示，因为分母无法转换为 2 的幂。\n\n现在我们知道为什么 `0.1 +\
  \ 0.2` 没有产生正确的结果：在内部，这两个操作数都无法被精确表示。\n\n使用小数进行精确计算的唯一方法是在内部切换到 10 进制。对于许多编程语言来说，2\
  \ 进制是默认的，10 进制是一个选项。例如，Java 有 [`BigDecimal`](https://docs.oracle.com/javase/8/docs/api/java/math/BigDecimal.html)\
  \ 类，而 Python 有 [`decimal`](https://docs.python.org/3/library/decimal.html) 模块。目前有计划为\
  \ JavaScript 添加类似的内容：[ECMAScript 提案 “Decimal”](https://github.com/tc39/proposals/blob/master/stage-0-proposals.md)\
  \ 目前处于阶段 0。\n\n## 17.11 JavaScript 中的整数\n\nJavaScript 没有专门用于整数的特殊类型。相反，它们仅仅是不带小数部分的普通（浮点型）数字：\n\
  \n```\n> 1 === 1.0\ntrue\n> Number.isInteger(1.0)\ntrue\n```\n\n在本节中，我们将查看一些处理这些伪整数的工具。\n\
  \n### 17.11.1 转换为整数\n\n将数字转换为整数的推荐方法是使用 `Math` 对象的方法之一：\n\n* `Math.floor(n)`：返回最大的小于\
  \ `n` 的整数 `i`：\n  ```\n  > Math.floor(2.1)\n  2\n  > Math.floor(2.9)\n  2\n  ```\n\
  * `Math.ceil(n)`：返回最小的大于等于 `n` 的整数 `i`：\n  ```\n  > Math.ceil(2.1)\n  3\n  > Math.ceil(2.9)\n\
  \  3\n  ```\n* `Math.round(n)`：返回“最接近” `n` 的整数，`.5` 向上舍入：\n  ```\n  > Math.round(2.4)\n\
  \  2\n  > Math.round(2.5)\n  3\n  ```\n* `Math.trunc(n)`：移除 `n` 的任何小数部分（小数点后的部分），将其转换为整数：\n\
  \  ```\n  > Math.trunc(2.1)\n  2\n  > Math.trunc(2.9)\n  2\n  ```\n\n有关舍入的更多信息，请参阅\
  \ 18.3 “Rounding`。\n\n### 17.11.2 整数范围\n\n这些是 JavaScript 中重要的整数范围：\n\n* **安全整数（Safe\
  \ integers）：** 可以被 JavaScript “安全地”表示（关于其含义将在下一小节详细介绍）\n  * 精度：53 位加符号位\n  * 范围：`(−2⁵³,\
  \ 2⁵³)`\n* **数组索引**\n  * 精度：32 位，无符号\n  * 范围：`[0, 2³²−1)`（不包括最大值）\n  * 类型数组（Typed\
  \ Arrays）具有更大的 53 位范围（安全且无符号）\n* **位运算符**（位 wise 运算，等）\n  * 精度：32 位\n  * 无符号右移 (`>>>`）的范围：无符号，`[0,\
  \ 2³²)`\n  * 所有位运算符的范围：有符号，`(−2³¹, 2³¹)`\n\n### 17.11.3 安全整数\n\n这是 JavaScript 中*安全*的整数范围（53\
  \ 位加一个符号位）：\n\n> `(−2⁵³–1, 2⁵³–1]`\n\n如果一个整数由仅一个数字表示，则它是*安全*的。由于 JavaScript 数字被编码为分数乘以\
  \ 2 的幂次，较大的整数也可以被表示，但它们之间存在间隙。\n\n例如（18014398509481984 是 `2⁵⁴`）：\n\n```\n> 18014398509481984\n\
  18014398509481984\n> 18014398509481985\n18014398509481984\n> 18014398509481986\n\
  18014398509481984\n> 18014398509481987\n1801439850948198\n```\n\n以下 `Number` 属性有助于判断一个整数是否安全：\n\
  \n```\nassert.equal(Number.MAX_SAFE_INTEGER, (2 ** 53) - 1);\nassert.equal(Number.MIN_SAFE_INTEGER,\
  \ -Number.MAX_SAFE_INTEGER);\nassert.equal(Number.isSafeInteger(5), true);\nassert.equal(Number.isSafeInteger('5'),\
  \ false);\nassert.equal(Number.isSafeInteger(5.1), false);\nassert.equal(Number.isSafeInteger(Number.MAX_SAFE_INTEGER),\
  \ true);\nassert.equal(Number.isSafeInteger(Number.MAX_SAFE_INTEGER+1), false);\n\
  ```\n\n![](img/file6.svg) **练习：检测安全整数**\n\n`exercises/numbers-math/is_safe_integer_test.mjs`\n\
  \n#### 17.11.3.1 安全计算\n\n让我们看看涉及整数的计算。\n\n以下结果错误且不安全的，尽管它的两个操作数都是安全的：\n\n```\n>\
  \ 9007199254740990 + 3\n9007199254740992\n```\n\n以下结果是安全的但是错误的。第一个操作数是不安全的；第二个操作数是安全的：\n\
  \n```\n> 9007199254740995 - 10\n9007199254740986\n```\n\n因此，表达式 `a op b` 的结果正确的当且仅当：\n\
  \n```\nisSafeInteger(a) && isSafeInteger(b) && isSafeInteger(a op b)\n```\n\n也就是说，两个操作数和结果都必须是。\n\
  \n## 17.12 位运算符\n\n### 17.12.1 内部，位运算符与 32 位整数工作\n\n\n\n\n在内部，JavaScript 的位操作符与\
  \ 32 位整数工作。它们按照以下步骤产生结果：\n\n*   输入（JavaScript 数字）：首先将 1–2 个操作数转换为 JavaScript 数字（64\
  \ 位浮点数），然后转换为 32 位整数。\n*   计算（32 位整数）：实际操作处理 32 位整数并产生一个 32 位整数。\n*   输出（JavaScript\
  \ 数字）：在返回结果之前，它会被转换回 JavaScript 数字。\n\n### 17.12.1.1 操作数和结果的类型\n\n对于每个位操作符，本书都提到了其操作数和结果的类型。每种类型始终是以下两种类型之一：\n\
  \n| 类型 | 描述 | 大小 | 范围 |\n| --- | --- | --- | --- |\n| Int32 | 有符号 32 位整数 | 32 位（含符号位）\
  \ | [−2³¹, 2³¹) |\n| Uint32 | 无符号 32 位整数 | 32 位 | [0, 2³²) |\n\n考虑到之前提到的步骤，我建议假定位操作符内部与无符号\
  \ 32 位整数工作（“计算”步骤），而 `Int32` 和 `Uint32` 只影响 JavaScript 数字与整数之间的转换（“输入”和“输出”步骤）。\n\
  \n### 17.12.1.2 将 JavaScript 数字显示为无符号 32 位整数\n\n在探索位操作符时，偶尔将 JavaScript 数字以二进制表示显示为无符号\
  \ 32 位整数会有帮助。这就是 `b32()` 的作用（其实现将在后文显示）：\n\n```\nassert.equal(\n  b32(-1),\n  '11111111111111111111111111111111');\n\
  assert.equal(\n  b32(1),\n  '00000000000000000000000000000001');\nassert.equal(\n\
  \  b32(2 ** 31),\n  '10000000000000000000000000000000');\n```\n\n### 17.12.2 二进制位操作符\n\
  \n表 9：二进制位操作符。\n\n| 操作 | 名称 | 类型签名 | |\n| --- | --- | --- | --- |\n| `num1 & num2`\
  \ | 位与 (Bitwise And) | Int32 × Int32 `→` Int32 | ES1 |\n| `num1 | num2` | 位或或 (Bitwise\
  \ Or) | Int32 × Int32 `→` Int32 | ES1 |\n| `num1 ^ num2` | 位异异 (Bitwise Xor) | Int32\
  \ × Int32 `→` Int32 | ES1 |\n\n二进制位操作符组合其操作数的位来产生结果：\n\n```\n> (0b1010 & 0b0011).toString(2).padStart(4,\
  \ '0')\n'0010'\n> (0b1010 | 0b0011).toString(2).padStart(4, '0')\n'1011'\n> (0b1010\
  \ ^ 0b0011).toString(2).padStart(4, '0')\n'1001'\n```\n\n### 17.12.3 位取反\n\n表 10：位取反操作符。\n\
  \n| 操作 | 名称 | 类型签名 | |\n| --- | --- | --- | --- |\n| `~num` | 位取反 (Bitwise Not)，按码\
  \ | Int32 `→` Int32 | ES1 |\n\n位取反操作符反转其操作数的每个二进制位：\n\n```\n> b32(~0b100)\n'11111111111111111111111111111011'\n\
  ```\n\n### 17.12.4 位移操作符\n\n表 11：位移操作符。\n\n| 操作 | 名称 | 类型签名 | |\n| --- | --- | ---\
  \ | --- |\n| `num << count` | 左移 (Left shift) | Int32 × Uint32 `→` Int32 | ES1 |\n\
  | `num >> count` | 有符号右移 (Signed right shift) | Int32 × Uint32 `→` Int32 | ES1 |\n\
  | `num >>> count` | 无符号右移 (Unsigned right shift) | Uint32 × Uint32 `→` Uint32 |\
  \ ES1 |\n\n移动操作符将二进制位向左或向右移动：\n\n```\n> (0b10 << 1).toString(2)\n'100'\n```\n\n\
  `>>` 保留符号位，`>>>` 则不：\n\n```\n> b32(0b10000000000000000000000000000000 >> 1)\n'11000000000000000000000000000000'\n\
  > b32(0b10000000000000000000000000000000 >>> 1)\n'01000000000000000000000000000000'\n\
  ```\n\n### 17.12.5 `b32()`：以二进制表示 32 位整数\n\n我们现在已经用过几次 `b32()`。以下是它的实现：\n\n```javascript\n\
  /**\n * 以二进制表示返回 n 作为无符号 32 位整数的字符串。\n */\nfunction b32(n) {\n  // >>> 确保符号位不被解释\n\
  \  return (n >>> 0).toString(2).padStart(32, '0');\n}\nassert.equal(\n  b32(6),\n\
  \  '00000000000000000000000000000110');\n```\n\n`n >>> 0` 意味着我们将 `n` 右移 0 位。因此，从原则上说，`>>>`\
  \ 操作没有变化，但它仍然会将 `n` 强制转换为无符号 32 位整数：\n\n```\n> 12 >>> 0\n12\n> -12 >>> 0\n4294967284\n\
  > (2**32 + 1) >>> 0\n1\n```\n\n### 17.13 快速参考：数字\n\n### 17.13.1 数字的全局函数\n\nJavaScript\
  \ 有以下四个数字的全局函数：\n\n*   `isFinite()`\n*   `isNaN()`\n*   `parseFloat()`\n*   `parseInt()`\n\
  \n然而，使用 `Number` 的对应方法（`Number.isFinite()` 等）更好，它们的陷阱更少。它们在 ES6 中引入，并在下文中讨论。\n\n\
  ### 17.13.2 `Number` 的静态属性\n\n*   `.EPSILON: number`\n    1 与下一个可表示浮点数之间的差。通常，机器精度提供了舍入误差边界。\n\
  *   `.MAX_SAFE_INTEGER: number`\n    JavaScript 可以表示的最大整数。\n*   `.MAX_VALUE: number`\n\
  \    最大的有限数字。\n*   `.MIN_SAFE_INTEGER: number`\n    JavaScript 可以表示的最小整数。\n*   `.MIN_VALUE:\
  \ number`\n    最小的正数。\n*   `.NEGATIVE_INFINITY: number`\n    相当于全局的 `-Infinity`。\n\
  *   `.POSITIVE_INFINITY: number`\n    相当于全局的 `Infinity`。\n*   `.NaN: number`\n \
  \   相当于全局的 `NaN`。\n\n### 17.13.3 `Number` 的静态方法\n\n*   `.isFinite(num: number):\
  \ boolean`\n    如果 `num` 是实际数字（既不是 `Infinity` 也不是 `NaN`），则返回 `true`。\n\n```\n> Number.isFinite(Infinity)\n\
  false\n> Number.isFinite(-Infinity)\nfalse\n> Number.isFinite(NaN)\nfalse\n> Number.isFinite(123)\n\
  true\n```\n\n*   `.isInteger(num: number): boolean`\n    如果 `num` 是数字且没有小数部分，则返回\
  \ `true`。\n\n```\n> Number.isInteger(-17)\ntrue\n> Number.isInteger(33)\ntrue\n\
  > Number.isInteger(33.1)\nfalse\n> Number.isInteger('33')\nfalse\n> Number.isInteger(NaN)\n\
  false\n> Number.isInteger(Infinity)\nfalse\n```\n\n*   `.isNaN(num: number): boolean`\n\
  \    如果 `num` 的值为 `NaN`，则返回 `true`。\n\n```\n> Number.isNaN(NaN)\ntrue\n> Number.isNaN(123)\n\
  false\n> Number.isNaN('abc')\nfalse\n```\n\n*   `.isSafeInteger(num: number): boolean`\n\
  \    如果 `num` 是数字且无歧地表示整数，则返回 `true`。\n\n```\n> Number.isSafeInteger(17)\ntrue\n\
  > Number.isSafeInteger(33)\ntrue\n> Number.isSafeInteger(33.1)\nfalse\n> Number.isSafeInteger('33')\n\
  false\n```\n\n*   `.parseFloat(str: string): number`\n    将其参数转换为字符串并解析为浮点数。对于将字符串转换为数字，`Number()`（忽略两端空格）通常是\
  \ `Number.parseFloat()`（忽略领先空格和非法后续字符并可能隐藏问题）更好的选择。\n\n```\n> Number.parseFloat('\
  \ 123.4#')\n123.4\n> Number(' 123.4#')\nNaN\n```\n\n*   `.parseInt(str: string,\
  \ radix=10): number`\n    将其参数转换为字符串并解析为整数，忽略领先空格和非法后续字符：\n\n```\n> Number.parseInt('\
  \  123#')\n123\n```\n\n    参数 `radix` 指定了要解析数字基数：\n\n```\n> Number.parseInt('101',\
  \ 2)\n5\n> Number.parseInt('FF', 16)\n255\n```\n\n\n\n\n不要使用此方法将数字转换为整数：强制转换为字符串效率很低。而且，在遇到第一个非数字之前停止并不是移除数字小数部分的良好算法。这里有一个错误的示例：\n\
  \n```\n> Number.parseInt(1e21, 10) // 错误\n1\n```\n\n使用 `Math` 的其中一个舍入函数将数字转换为整数更好：\n\
  \n```\n> Math.trunc(1e21) // 正确\n1e+21\n```\n\n### 17.13.4 `Number.prototype` 的方法\n\
  \n(`Number.prototype` 是存储数字方法的地方。）\n\n*   `.toExponential(fractionDigits?: number):\
  \ string` ^([ES3])\n\n    返回一个用指数计数法表示数字的字符串。通过 `fractionDigits`，你可以指定与指数相乘的数字应显示多少位数（默认显示所有必要的位数）。\n\
  \n    示例：数字太小，无法通过 `.toString()` 获取正数指数。\n\n```\n> 1234..toString()\n'1234'\n\n\
  > 1234..toExponential() // 3 位小数\n'1.234e+3'\n> 1234..toExponential(5)\n'1.23400e+3'\n\
  > 1234..toExponential(1)\n'1.2e+3'\n```\n\n    示例：分数不够小，无法通过 `.toString()` 获取负数指数。\n\
  \n```\n> 0.003.toString()\n'0.003'\n> 0.003.toExponential()\n'3e-3'\n```\n\n*  \
  \ `.toFixed(fractionDigits=0): string` ^([ES3])\n\n    返回数字的不带指数的表示，，保留 `fractionDigits`\
  \ 位小数。\n\n```\n> 0.00000012.toString() // 带有指数\n'1.2e-7'\n\n> 0.00000012.toFixed(10)\
  \ // 无指数\n'0.0000001200'\n> 0.00000012.toFixed()\n'0'\n```\n\n    如果数字是 10²¹ 或更大，即使是\
  \ `.toFixed()` 也会使用指数：\n\n```\n> (10 ** 21).toFixed()\n'1e+21'\n```\n\n*   `.toPrecision(precision?:\
  \ number): string` ^([ES3])\n\n    用法类似于 `.toString()`，但 `precision` 指定了应显示多少位。如果\
  \ `precision` 缺失，则使用 `.toString()`。\n\n```\n> 1234..toPrecision(3)  // 需要指数计数法\n\
  '1.23e+3'\n\n> 1234..toPrecision(4)\n'1234'\n\n> 1234..toPrecision(5)\n'1234.0'\n\
  \n> 1.234.toPrecision(3)\n'1.23'\n```\n\n*   `.toString(radix=10): string` ^([ES1])\n\
  \n    返回数字的字符串表示。\n\n    默认情况下，你得到一个 10 进制数字结果：\n\n```\n> 123.456.toString()\n'123.456'\n\
  ```\n\n    如果你想让数字具有不同的进制，可以通过 `radix` 指定：\n\n```\n> 4..toString(2) // 二进制（底 2）\n\
  '100'\n> 4.5.toString(2)\n'100.1'\n\n> 255..toString(16) // 十六进制（底 16）\n'ff'\n>\
  \ 255.66796875.toString(16)\n'ff.ab'\n\n> 1234567890..toString(36)\n'kf12oi'\n```\n\
  \n    `parseInt()` 提供了逆操作：它将包含包含给定进制的整数（无小数！）数字的字符串转换为数字。\n\n```\n> parseInt('kf12oi',\
  \ 36)\n1234567890\n```\n\n### 17.13.5 来源\n\n*   Wikipedia\n\n*   [TypeScript 内置类型定义](https://github.com/Microsoft/TypeScript/blob/master/lib/)\n\
  \n*   [MDN JavaScript 文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript)\n\
  \n*   [ECMAScript 语言规范](https://tc39.github.io/ecma262/)\n\n![](img/file7.svg) **测试：进阶**\n\
  \n查看测试应用。\n\n# 18 `Math`\n\n* * *\n\n*   18.1 数据属性\n*   18.2 指数、根、对数\n*   18.3 舍入\n\
  *   18.4 三角函数\n*   18.5 其他各种函数\n*   18.6 来源\n\n* * *\n\n`Math` 是一个具有用于处理数字的数据属性和方法的对象。你可以把它看作简版的模块：它在\
  \ JavaScript 拥有模块之前很久就已经创建了。\n\n### 18.1 数据属性\n\n*   `Math.E: number` ^([ES1])\n\
  \n    欧拉数，自然对数的底，约等于 2.7182818284590452354。\n\n*   `Math.LN10: number` ^([ES1])\n\
  \n    10 的自然对数，约为 2.302585092994046。\n\n*   `Math.LN2: number` ^([ES1])\n\n    2\
  \ 的自然对数，约为 0.693147180559945。\n\n*   `Math.LOG10: number` ^([ES1])\n\n    以 10 为底的\
  \ `e` 的对数，约为 0.434294481903251。\n\n*   `Math.LOG2: number` ^([ES1])\n\n    以 2 为底的\
  \ `e` 的对数，约为 1.442695040888963。\n\n*   `Math.PI: number` ^([ES1])\n\n    数学常数 `π`，圆周长与直径的比值，约为\
  \ 3.141592653589793。\n\n*   `Math.SQRT1: number` ^([ES1])\n\n    1 的平方根，约为 1.00000000000000。\n\
  \n*   `Math.SQRT2: number` ^([ES1])\n\n    2 的平方根，约为 1.414213562373095。\n\n## 18.2\
  \ 指数、根、对数\n\n*   `Math.cbrt(x): number` ^([ES6])\n\n    返回 `x` 的立方根。\n\n```\n> Math.cbrt(8)\n\
  2\n```\n\n*   `Math.exp(x): number` ^([ES6])\n\n    返回 `e` 的 `x` 次方。\n\n```\n> Math.exp(1)\n\
  2.718281828459045\n```\n\n*   `Math.pow(x, y): number` ^([ES1])\n\n    返回 `x` 的\
  \ `y` 次方。\n\n```\n> Math.pow(2, 3)\n8\n> Math.pow(25, 0.5)\n5\n```\n\n*   `Math.sqrt(x):\
  \ number` ^([ES1])\n\n    返回 `x` 的平方根。\n\n```\n> Math.sqrt(9)\n3\n```\n\n## 18.3\
  \ 舍入\n\n舍入意味着将任意数字转换为整数（不带小数部分的数字）。以下函数实现了不同的方法。\n\n*   `Math.ceil(x): number` ^([ES1])\n\
  \n    返回满足 `x` ≤ `i` 的最小（最接近 −∞ 的）整数 `i`。\n\n```\n> Math.ceil(2.1)\n3\n> Math.ceil(2.9)\n\
  3\n```\n\n*   `Math.floor(x): number` ^([ES1])\n\n    返回满足 `i` ≤ `x` 的最大（最接近 +∞\
  \ 的）整数 `i`。\n\n```\n> Math.floor(2.1)\n2\n> Math.floor(2.9)\n2\n```\n\n*   `Math.round(x):\
  \ number` ^([ES1])\n\n    返回离 `x` 最近的整数。如果 `x` 的小数部分为 `.5`，则 `.round()` 向上入入（向正无穷方向舍入）：\n\
  \n```\n> Math.round(2.4)\n2\n> Math.round(2.5)\n3\n```\n\n*   `Math.trunc(x): number`\
  \ ^([ES6])\n\n    移除 `x` 的小数部分并返回得到的整数。\n\n```\n> Math.trunc(2.1)\n2\n> Math.trunc(2.9)\n\
  2\n```\n\n表 12 显示了几个代表性输入下舍入函数的结果。\n\n\n\n\n\n表 12：`Math` 的舍入函数。注意负数时的变化情况，因为“更大”始终意味着“更接近正无穷”。\n\
  \n|  | `-2.9` | `-2.5` | `-2.1` | `2.1` | `2.5` | `2.9` |\n| --- | --- | --- | ---\
  \ | --- | --- | --- |\n| `Math.floor` | `-3` | `-3` | `-3` | `2` | `2` | `2` |\n\
  | `Math.ceil` | `-2` | `-2` | `-2` | `3` | `3` | `3` |\n| `Math.round` | `-3` |\
  \ `-2` | `-2` | `2` | `3` | `3` |\n| `Math.trunc` | `-2` | `-2` | `-2` | `2` | `2`\
  \ | `2` |\n\n### 18.4 三角函数\n\n所有角度均以弧度为单位。使用以下两个函数在角度和弧度之间转换。\n\n```javascript\n\
  function degreesToRadians(degrees) {\n  return degrees / 180 * Math.PI;\n}\nassert.equal(degreesToRadians(90),\
  \ Math.PI/2);\n\nfunction radiansToDegrees(radians) {\n  return radians / Math.PI\
  \ * 180;\n}\nassert.equal(radiansToDegrees(Math.PI), 180);\n```\n\n*   `Math.acos(x:\
  \ number): number` ^([ES1])\n    返回 `x` 的反余弦（反正余弦）。\n    ```\n    > Math.acos(0)\n\
  \    1.5707963267948966\n    > Math.acos(1)\n    0\n    ```\n\n*   `Math.acosh(x:\
  \ number): number` ^([ES6])\n    返回 `x` 的反双曲余弦。\n\n*   `Math.asin(x: number): number`\
  \ ^([ES1])\n    返回 `x` 的反正弦（反正正弦）。\n    ```\n    > Math.asin(0)\n    0\n    > Math.asin(1)\n\
  \    1.5707963267948966\n    ```\n\n*   `Math.asinh(x: number): number` ^([ES6])\n\
  \    返回 `x` 的反双曲正弦。\n\n*   `Math.atan(x: number): number` ^([ES1])\n    返回 `x` 的反正切（反正正切）。\n\
  \n*   `Math.atanh(x: number): number` ^([ES6])\n    返回 `x` 的反双曲正切。\n\n*   `Math.atan2(y:\
  \ number, x: number): number` ^([ES1])\n    返回商 `y/x` 的反正切。\n\n*   `Math.cos(x:\
  \ number): number` ^([ES1])\n    返回 `x` 的余弦。\n    ```\n    > Math.cos(0)\n    1\n\
  \    > Math.cos(Math.PI)\n    -1\n    ```\n\n*   `Math.cosh(x: number): number`\
  \ ^([ES6])\n    返回 `x` 的双曲余弦。\n\n*   `Math.hypot(...values: number[]): number` ^([ES6])\n\
  \    返回 `values` 平方和的平方根（勾股定理）：\n    ```\n    > Math.hypot(3, 4)\n    5\n    ```\n\
  \n*   `Math.sin(x: number): number` ^([ES1])\n    返回 `x` 的正弦。\n    ```\n    > Math.sin(0)\n\
  \    0\n    > Math.sin(Math.PI / 2)\n    1\n    ```\n\n*   `Math.sinh(x: number):\
  \ number` ^([ES6])\n    返回 `x` 的双曲正弦。\n\n*   `Math.tan(x: number): number` ^([ES1])\n\
  \    返回 `x` 的正切。\n    ```\n    > Math.tan(0)\n    0\n    > Math.tan(1)\n    1.5574077246549023\n\
  \    ```\n\n*   `Math.tanh(x: number): number;` ^([ES6])\n    返回 `x` 的双曲正切。\n\n\
  ### 18.5 其他各种函数\n\n*   `Math.abs(x: number): number` ^([ES1])\n    返回 `x` 的绝对值。\n\
  \    ```\n    > Math.abs(3)\n    3\n    > Math.abs(-3)\n    3\n    > Math.abs(0)\n\
  \    0\n    ```\n\n*   `Math.clz32(x: number): number` ^([ES6])\n    计算 32 位整数 `x`\
  \ 的领先零位数。用于 DSP 算法。\n    ```\n    > Math.clz32(0b01000000000000000000000000000000)\n\
  \    1\n    > Math.clz32(0b00100000000000000000000000000000)\n    2\n    > Math.clz32(2)\n\
  \    30\n    > Math.clz32(1)\n    31\n    ```\n\n*   `Math.max(...values: number[]):\
