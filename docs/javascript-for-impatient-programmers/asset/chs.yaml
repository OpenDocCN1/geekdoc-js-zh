  \ JavaScript 代码？\n\n* * *\n\n## 6.1 JavaScript 的良好参考有哪些？\n\n请参阅 §7.3 “JavaScript\
  \ 引用”。\n\n## 6.2 我如何发现哪些地方支持哪些 JavaScript 特性？\n\n这本书通常会提到某个特性是属于 ECMAScript 5（旧版浏览器要求）还是新版本。要获取更详细的信息（包括\
  \ ES5 之前的版本），网上有几个很好的兼容性表：\n\n*   [各种引擎的 ECMAScript 兼容性表](http://kangax.github.io/compat-table/es5/)（由\
  \ [kangax](https://twitter.com/kangax), [webbedspace](https://twitter.com/webbedspace),\
  \ [zloirock](https://twitter.com/zloirock) 维护）\n*   [Node.js 兼容性表](https://node.green)（由\
  \ [William Kapke](https://twitter.com/williamkapke) 维护）\n*   Mozilla 的 [MDN Web\
  \ Docs](https://developer.mozilla.org/en-US/docs/Web/JavaScript) 为每个特性提供了表格，描述了相关的\
