  ### 11.2.2 运行练习\n\n* 本书中通过路径引用练习。\n* 例如：`exercises/quizzes-exercises/first_module_test.mjs`\n\
  * 在每个文件内部：\n    * 第一行包含运行练习的命令。\n    * 后后的行描述了你需要执行的操作。\n\n### 11.3 JavaScript 中的单元测试\n\
  \n书中的所有练习都是通过测试框架 [AVA](https://github.com/avajs/ava) 运行的测试。本节将简要介绍。\n\n### 11.3.1\
  \ 一个典型的测试\n\n典型的测试代码分为两部分：\n\n* 部分 1：被测试的代码。\n* 部分 2：针对代码的测试。\n\n以以下两个文件为例：\n\n\
  * `id.mjs`（被测试的代码）\n* `id_test.mjs`（测试）\n\n#### 11.3.1.1 部分 1：代码\n\n代码本身位于 `id.mjs`\
  \ 中：\n\n```\nexport function id(x) {\n  return x;\n}\n```\n\n这里的关键点是：你想要测试的内容都必须导出（export）。否则，测试代码将无法访问它。\n\
  \n#### 11.3.1.2 部分 2：测试\n\n无需担心测试的具体细节\n\n你不需要担心测试的具体细节：它们总是已经为你实现好了。因此，你只需要阅读它们，而不需要编写它们。\n\
  \n代码的测试位于 `id_test.mjs` 中：\n\n```javascript\n// npm t demos/quizzes-exercises/id_test.mjs\n\
  \nimport test from 'ava'; // (A)\nimport {strict as assert} from 'assert'; // (B)\n\
  import {id} from './id.mjs'; // (C)\n\ntest('My test', t => { // (D)\n  assert.equal(id('abc'),\
  \ 'abc'); // (E)\n});\n```\n\n该测试文件的核心是 E 行 —— 一个断言：`assert.equal()` 指定了 `id('abc')`\
  \ 的预期结果为 `'abc'`。\n\n至于其他几行：\n\n* 最开头的注释显示了运行测试的 shell 命令。\n* 行 A：我们导入了测试框架。\n*\
  \ 行 B：我们导入了断言库。AVA 内置了断言，但 `assert` 模块让我们保持与原生 Node.js 的兼容性。\n* 行 C：我们导入了要测试的函数。\n\
  * 行 D：我们定义了一个测试。通过调用函数 `test()` 实现：\n    * 第一个参数：测试的名称。\n    * 第二个参数：测试代码，通过箭头函数提供。参数\
  \ `t` 让我们可以使用 AVA 的测试 API（断言等）。\n\n要运行测试，我们在命令行中执行以下命令：\n\n```bash\nnpm t demos/quizzes-exercises/id_test.mjs\n\
  ```\n\n`t` 是 `test` 的缩写。也就是说，该命令的完整版本是：\n\n```bash\nnpm test demos/quizzes-exercises/id_test.mjs\n\
  ```\n\n练习：你的第一个练习\n\n以下练习让你初次体验练习长什么样子的：\n\n* `exercises/quizzes-exercises/first_module_test.mjs`\n\
  \n### 11.3.2 AVA 中的异步测试\n\n阅读\n\n你可以将这一节推迟到读到关于异步编程的章节。\n\n为异步代码编写测试需要额外的工作：测试稍后接收结果，并且必须向\
  \ AVA 信号它尚未完成。以下小节将探讨实现这一点的三种方法。\n\n#### 11.3.21 通过回调实现异步性\n\n如果我们调用 `test.cb()`\
  \ 而不是 `test()`，AVA 会切换到基于回调的异步处理。当我们完成异步工作时，我们必须调用 `t.end()`：\n\n```javascript\n\
  test.cb('divideCallback', t => {\n  divideCallback(8, 4, (error, result) => {\n\
  \    if (error) {\n      t.end(error);\n    } else {\n      assert.strictEqual(result,\
  \ 2);\n      t.end();\n    }\n  });\n});\n```\n\n#### 11.3.2.2 通过 Promise 实现异步性\n\
  \n如果测试返回一个 Promise，AVA 会切换到基于 Promise 的异步处理。如果 Promise 被履行（fulfilled），则认为测试成功；如果\
  \ Promise 被拒绝（rejected），则认为失败。\n\n```javascript\ntest('dividePromise 1', t => {\n\
  \  return dividePromise(8, 4)\n    .then(result => {\n      assert.strictEqual(result,\
  \ 2);\n    });\n});\n```\n\n#### 11.3.2.3 作为“函数体”的异步函数\n\n异步函数总是返回 Promise。因此，异步函数是实现异步测试的一种方便方法。以下代码等同于之前的示例。\n\
  \n```javascript\ntest('dividePromise 2', async t => {\n  const result = await dividePromise(8,\
  \ 4);\n  assert.strictEqual(result, 2);\n  // 不需要显式返回\n});\n```\n\n你不需要显式返回任何内容：隐式返回的\
  \ `undefined` 用于履行该异步函数返回的 Promise。如果测试代码抛出异常，异步函数将处理拒绝返回的 Promise。\n\n# 12 变量与赋值\n\
