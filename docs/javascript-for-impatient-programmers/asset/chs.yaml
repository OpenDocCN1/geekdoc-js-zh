  \ 带有日期和时间的字符串\n\n### 44.7.4 其他方法\n\n本章描述了 JavaScript 用于日期的 API——`Date` 类。\n\n###\
  \ 44.1 最佳实践：避免内置的 `Date`\n\nJavaScript 的 `Date` API 使用起来非常笨重。因此，对于任何与日期相关的操作，最好依赖第三方库。流行的库包括：\n\
  \n- `Moment.js`\n- `Day.js`\n- `Luxon`\n- `js-joda`\n- `date-fns`\n\n请参阅博客文章“为什么你不应该使用\
  \ Moment.js”以了解这些库的优缺点。此外，TC39 正在为 JavaScript 开发新的日期 API：`temporal`。\n\n### 44.1.1\
  \ 在日期库中需要注意的项\n\n有两点需要记住：\n\n- Tree-shaking（摇树优化）可以显著减小库的大小。这是一种技术，只向 Web 服务器部署被导入的库导出项。\n\
  - 对时区的支持：`Date` 不支持时区，这引入了许多陷阱并是一个主要的弱点。确保你的日期库支持时区。\n\n### 44.2 时间标准\n\n### 44.2.1\
  \ 背景：UTC vs. Z vs. GMT\n\nUTC、Z 和 GMT 是指定时间的几种虽相似但有细微区别的方法：\n\n- `UTC`（协调世界时）是所有时区所依据的时间标准。时区是相对于它指定的。也就是说，没有任何国家或地区将\
  \ `UTC` 作为其时区。\n- `Z`（祖鲁时区）是一种军事时区，通常用于航空和军事领域，作为 `UTC+0` 的另一种名称。\n- `GMT`（格林维治标准时间）是某些欧洲和非洲国家使用的时区。它是\
  \ `UTC` 加上零小时，因此与 `UTC` 时间相同。\n\n来源：\n- TimeDate.com 的“The Difference Between GMT\
  \ and UTC”\n- TimeDate.com 的“Z – Zulu Time Zone (Military Time)”\n\n### 44.2.2 日期不支持时区\n\
  \n日期支持以下时间标准：\n\n- 本地时区（取决于当前位置）\n- `UTC`\n- 时间偏移量（相对于 `UTC`）\n\n根据操作的不同，只有部分选项可用。例如，在将日期转换为字符串或提取月份等时间单位时，你只能在本地时区和\
  \ `UTC` 之间选择。\n\n在内部，`Dates` 被存储为 `UTC`。当从本地时区转换到本地时区时，必要的偏移量通过日期确定。在以下示例中，本地时区是\
  \ `Europe/Paris`：\n\n```javascript\n// CEST（欧洲中部夏令时间）\nassert.equal(\n  new Date('2122-06-29').getTimezoneOffset(),\
  \ -120);\n\n// CET（欧洲中部时间）\nassert.equal(\n  new Date('2122-12-29').getTimezoneOffset(),\
  \ -60);\n```\n\n每当你创建或转换日期时，你都需要留意正在使用的时间标准——例如：`new Date()` 使用本地时区，而 `.toISOString()`\
  \ 使用 `UTC`。\n\n```javascript\n> new Date(2077, 0, 27).toISOString()\n'2077-01-26T23:00:00.000Z'\n\
  ```\n\n`Dates` 将 0 解释为 1 月。本地时区中的日期是 27 号，但在 `UTC` 中是 26 号。\n\n**记录每个操作支持的时间标准**\n\
  \n在本章的剩余部分，每个操作都注明了支持的时间标准。\n\n#### 44.2.2.1 无法指定时区的缺点\n\n无法指定时区有两个缺点：\n\n- 它使得无法支持多个时区。\n\
  - 它可能导致与位置有关的 bug。例如，上一个示例产生的结果取决于它所在的位置。为了安全起见：\n    - 尽可能使用基于 UTC 的操作\n    - 在解析字符串时使用\
  \ `Z` 或时间偏移量\n\n### 44.3 背景：日期时间格式 (ISO)\n\n`Date` 时间格式描述了：\n\n- `Date.parse()`、`new\
  \ Date()` 接受的字符串\n- `Date.prototype.toISOString()` 返回的字符串（始终是最长的格式）\n\n以下是由 `.toISOString()`\
  \ 返回的日期时间字符串示例：\n\n```javascript\n'2033-05-28T15:59:59.123Z'\n```\n\n`Date` 时间格式具有以下结构：\n\
  \n- 日期格式：`Y`=年；`M`=月；`D`=日\n  ```\n  YYYY-MM-DD\n  YYYY-MM\n  YYYY\n  ```\n- 时间格式：`T`=分隔符（字符串\
  \ `'T'`）；`H`=小时；`m`=分钟；`s`=秒和毫秒；`Z`=祖鲁时区（字符串 `'Z'`）\n  ```\n  THH:mm:ss.sss\n  THH:mm:ss.sssZ\n\
  \n  THH:mm:ss\n  THH:mm:ssZ\n\n  THH:mm\n  THH:mmZ\n  ```\n- 日期时间格式：日期格式后跟时间格式。\n\
  \  - 例如（最长）：`YYYY-MM-DDTHH:mm:ss.sssZ`\n\n除了 `Z`（`UTC+0`），我们还可以指定相对于 `UTC` 的时间偏移：\n\
  \n- `THH:mm+HH:mm`\n- `THH:mm-HH:mm`\n\n### 44.3.1 提示：附加 `Z` 以使日期解析具有确定性\n\n如果在字符串末尾添加\
  \ `Z`，日期解析在不同位置就不会产生不同的结果：\n\n- 没有 `Z`：输入在 Europe/Paris 时区是 27 号，输出在 `UTC` 中是 26\
  \ 号。\n\n  ```javascript\n  > new Date('2077-01-27T00:00').toISOString()\n  '2077-01-26T23:00:00.000Z'\n\
  \  ```\n\n- 有 `Z`：输入是 27 号，输出是 27 号。\n\n\n\n\n\n```\n> new Date('2077-01-27T00:00Z').toISOString()\n\
  '2077-01-27T00:00:00.000Z'\n```\n\n## 44.4 时间值\n\n`time value`（时间值）通过自 1970 年 1\
  \ 月 1 日 00:00:00 UTC 以来的毫秒数表示日期。\n\n时间值可用于创建 `Dates`：\n\n```javascript\nconst timeValue\
  \ = 0;\nassert.equal(\n  new Date(timeValue).toISOString(),\n  '1970-01-01T00:00:00.000Z');\n\
  ```\n\n将 `Date` 转换为数字会返回其时间值：\n\n```javascript\n> Number(new Date(123))\n123\n```\n\
  \n比较运算符会将将其操作数转换为数字。因此，你可以使用这些运算符来比较 `Dates`：\n\n```javascript\nassert.equal(\n\
  \  new Date('1972-05-03') < new Date('2001-12-23'), true);\n// 内部：\nassert.equal(73699200000\
  \ < 1009065600000, true);\n```\n\n### 44.4.1 创建时间值\n\n以下方法可以创建时间值：\n\n*   `Date.now():\
  \ number` (UTC)\n\n    将当前时间作为时间值返回。\n\n*   `Date.parse(dateTimeStr: string): number`\
  \ (本地时区, UTC, 时间偏移量)\n\n    解析 `dateTimeStr` 并返回对应的时间值。\n\n*   `Date.UTC(year, month,\
  \ date?, hours?, minutes?, seconds?, milliseconds?): number` (UTC)\n\n    返回指定 UTC\
  \ 日期时间的时间值。\n\n### 44.4.2 获取和设置时间值\n\n*   `Date.prototype.getTime(): number` (UTC)\n\
  \n    返回与 `Date` 对应的时间值。\n\n*   `Date.prototype.setTime(timeValue)` (UTC)\n\n  \
  \  将 `this` 设置为由 `timeValue` 编码的日期。\n\n## 44.5 创建 Dates\n\n### 44.5.1 通过数字创建日期\n\
  \n`new Date(year: number, month: number, date?: number, hours?: number, minutes?:\
  \ number, seconds?: number, milliseconds?: number)` (本地时区)\n\n有两个参数存在陷阱：\n\n*  \
  \ 对于 `month`（月份），0 代表 1 月，1 代表 2 月，依此类推。\n\n*   如果 0 ≤ `year` ≤ 99，则会加上 1900 年：\n\
  \n    ```javascript\n    > new Date(12, 1, 22, 19, 11).getFullYear()\n    1912\n\
  \    ```\n\n    这就是为什么在本章的其它地方，我们避免使用时间单位 `year` 并始终使用 `fullYear`。但在这种情况下，我们没有选择。\n\
  \n示例：\n\n```javascript\n> new Date(2077,0,27, 21,49).toISOString() // CET (UTC+1)\n\
  '2077-01-27T20:49:00.000Z'\n```\n\n注意输入的小时（21）与输出的小时（20）不同。前者指本地时区，后者指 UTC。\n\n\
  ### 44.5.2 从字符串解析日期\n\n`new Date(dateTimeStr: string)` (本地时区, UTC, 时间偏移量)\n\n如果结尾有\
  \ `Z`，则使用 UTC：\n\n```javascript\n> new Date('2077-01-27T00:00Z').toISOString()\n\
  '2077-01-27T00:00:00.000Z'\n```\n\n如果末尾没有 `Z` 或时间偏移量，则使用本地时区：\n\n```javascript\n\
  > new Date('2077-01-27T00:00').toISOString() // CET (UTC+1)\n'2077-01-26T23:00:00.000Z'\n\
  ```\n\n如果字符串仅包含日期，则它被解释为 UTC：\n\n```javascript\n> new Date('2077-01-27').toISOString()\n\
  '2077-01-27T00:00:00.000Z'\n```\n\n### 44.5.3 创建日期的其他方法\n\n*   `new Date(timeValue:\
  \ number)` (UTC)\n\n    ```javascript\n    > new Date(0).toISOString()\n    '1970-01-01T00:00:00.000Z'\n\
  \    ```\n\n*   `new Date()` (UTC)\n\n    相当于 `new Date(Date.now())`。\n\n## 44.6 Getters\
