  \ ^([R, ES6])\n\n    返回关于接收者键的可迭代器。\n\n```\n> [...['a', 'b'].keys()]\n[ 0, 1 ]\n\
  ```\n\n*   `.lastIndexOf(searchElement: T, fromIndex=this.length-1): number` ^([R,\
  \ ES5])\n\n    返回最后一个严格等于 `searchElement` 的元素的索引。如果没有该元素则返回 `-1`。从索引 `fromIndex`\
  \ 开始搜索，并访问较低的索引。\n\n```\n> ['a', 'b', 'a'].lastIndexOf('a')\n2\n> ['a', 'b', 'a'].lastIndexOf('a',\
  \ 1)\n0\n> ['a', 'b', 'a'].lastIndexOf('c')\n-1\n```\n\n*   `.map<U>(mapFunc: (value:\
  \ T, index: number, array: Array<T>) => U, thisArg?: any): U[]` ^([R, ES5])\n\n\
  \    返回一个新数组，其中每个元素都是 `mapFunc` 应用于接收者对应元素的结果。\n\n```\n> [1, 2, 3].map(x => x *\
  \ 2)\n[ 2, 4, 6 ]\n> ['a', 'b', 'c'].map((x, i) => i)\n[ 0, 1, 2 ]\n```\n\n*   `.pop():\
  \ T | undefined` ^([W, ES3])\n\n    删除并返回接收者的最后一个元素。也就是说，它将接收者的末端视为栈。是 `.push()`\
  \ 的相反操作。\n\n```\n> const arr = ['a', 'b', 'c'];\n> arr.pop()\n'c'\n> arr\n[ 'a',\
  \ 'b' ]\n```\n\n*   `.push(...items: T[]): number` ^([W, ES3])\n\n    在接收者的末尾添加零或多个\
  \ `items`。也就是说，它将接收者的末端视为栈。返回变化后接收者的长度。是 `.pop()` 的相反操作。\n\n```\n> const arr = ['a',\
  \ 'b'];\n> arr.push('c', 'd')\n4\n> arr\n[ 'a', 'b', 'c', 'd' ]\n```\n\n*   `.reduce<U>(callback:\
  \ (accumulator: U, element: T, array: T[]) => U, init?: U): U` ^([R, ES5])\n\n \
  \   该方法产生接收者的摘要：将所有数组元素传递给 `callback`，将摘要（参数 `accumulator`）与当前元素结合并返回下一个 `accumulator`：\n\
  \n```\n[](#cb830-1)accumulator_0 = callback(init, arr[0]);\n[](#cb830-2)accumulator_1\
  \ = callback(accumulator_0, arr[1]);\n[](#cb830-3)accumulator_2 = callback(accumulator_1,\
  \ arr[2]);\n// 等等\n```\n\n    `.reduce()` 在访问所有数组元素后的最后一个结果。\n\n```\n> [1, 2, 3].reduce((accu,\
  \ x) => accu + x, 0)\n6\n> [1, 2, 3].reduce((accu, x) => accu + String(x), '')\n\
  '123'\n```\n\n    如果未提供 `init`，则使用索引 0 的元素，并访问索引 1 的元素。因此数组长度至少为 1。\n\n*   `.reduceRight<U>(callback:\
  \ (accumulator: U, element: T, array: T[]) => U, init?: U): U` ^([R, ES5])\n\n \
  \   工作类似于 `.reduce()`，但反向访问数组，从最后一个元素开始。\n\n```\n> [1, 2, 3].reduceRight((accu,\
  \ x) => accu + String(x), '')\n'321'\n```\n\n*   `.reverse(): this` ^([W, ES1])\n\
  \n    重新排列接收者的元素使其反序，并返回接收者。\n\n```\n> const arr = ['a', 'b', 'c'];\n> arr.reverse()\n\
  [ 'c', 'b', 'a' ]\n> arr\n[ 'c', 'b', 'a' ]\n```\n\n*   `.shift(): T | undefined`\
  \ ^([W, ES3])\n\n    删除并返回接收者的第一个元素。是 `.unshift()` 的相反操作。\n\n```\n> const arr =\
  \ ['a', 'b', 'c'];\n> arr.shift()\n'a'\n> arr\n[ 'b', 'c' ]\n```\n\n*   `.slice(start=0,\
  \ end=this.length): T[]` ^([R, ES3])\n\n    返回一个包含接收者的从（包含）`start` 到（不包含）`end`的新数组。\n\
  \n```\n> ['a', 'b', 'c'].slice(1, 3)\n[ 'b', 'c' ]\n> ['a', 'b'].slice() // 拷贝\n\
  [ 'a', 'b' ]\n```\n\n    允许负索引并将其加上 `.length`：\n\n```\n> ['a', 'b', 'c'].slice(-2)\n\
  [ 'b', 'c' ]\n```\n\n*   `.some(callback: (value: T, index: number, array: Array<T>)\
  \ => boolean, thisArg?: any): boolean` ^([R, ES5])\n\n    如果 `callback` 对至少一个元素返回真值，则返回\
  \ `true`。否则返回 `false`。一旦接收到真值就会停止。该方法对应数学中的存在量化（“存在”，`∃`）。\n\n```\n> [1, 2, 3].some(x\
  \ => x < 0)\nfalse\n> [1, -2, 3].some(x => x < 0)\ntrue\n```\n\n    相关方法：`.every()`（对于所有）。\n\
  \n*   `.sort(compareFunc?: (a: T, b: T) => number): this` ^([W, ES1])\n\n    排序接收者并返回它。默认，它对元素的字符串表示进行排序。它是按字典顺序和字符的代码值（字符码）进行的：\n\
  \n```\n> ['pie', 'cookie', 'éclair', 'Pie', 'Cookie', 'Éclair'].sort()\n[ 'Cookie',\
  \ 'Pie', 'cookie', 'pie', 'Éclair', 'éclair' ]\n> [200, 3, 10].sort()\n[ 10, 200,\
  \ 3 ]\n```\n\n    你可以通过 `compareFunc` 自定义排序顺序，该函数返回一个数字：\n\n    *   如果 `a < b` 则为\n\
  \n    *   如果 `a === b` 则为零\n    *   如果 `a > b` 则为正\n\n    排序数字的技巧（带有数值溢出或下流的风险）：\n\
  \n```\n> [200, 3, 10].sort((a, b) => a - b)\n[ 3, 10, 200 ]\n```\n\n![](img/file5.svg)\
  \ **`.sort()` 是稳定的**\n\n    从 ECMAScript 2019 开始，排序被保证是稳定的：如果元素在排序时认为是相等的，那么排序就不会改变这些元素的顺序（它们之间）。\n\
  \n*   `.splice(start: number, deleteCount=this.length-start, ...items: T[]): T[]`\
  \ ^([W, ES3])\n\n    在索引 `start` 处，删除 `deleteCount` 个元素并插入 `items`。它返回被删除的元素。\n\n\
  \n\n\n\n```\n> const arr = ['a', 'b', 'c', 'd'];\narr.splice(1, 2, 'x', 'y')\n[\
  \ 'b', 'c' ]\n> arr\n[ 'a', 'x', 'y', 'd' ]\n```\n\n`start` 可以为负数，如果是负数则会加到 `.length`\
  \ 上：\n\n```\n> ['a', 'b', 'c'].splice(-2, 2)\n[ 'b', 'c' ]\n```\n\n*   `.toString():\
  \ string` ^([R, ES1])\n\n    通过 `String()` 将所有元素转换为字符串，用逗号分隔它们进行拼接，并返回结果。\n\n```\n\
  > [1, 2, 3].toString()\n'1,2,3'\n> ['1', '2', '3'].toString()\n'1,2,3'\n> [].toString()\n\
  ''\n```\n\n*   `.unshift(...items: T[]): number` ^([W, ES3])\n\n    将 `items` 插入到接收者的开头，并返回修改后的长度。\n\
  \n```\n> const arr = ['c', 'd'];\narr.unshift('e', 'f')\n4\n> arr\n[ 'e', 'f', 'c',\
  \ 'd' ]\n```\n\n*   `.values(): Iterable<T>` ^([R, ES6])\n\n    返回一个关于接收者值的迭代器。\n\
  \n```\n> [...['a', 'b'].values()]\n[ 'a', 'b' ]\n```\n\n### 31.12.4 来源\n\n*   [TypeScript\
