  \n### 1.1 关于内容\n\n### 1.1.1 本书中写了什么？\n\n这本书通过提供尽可能一致的现代视角，让初学者学习 JavaScript 变得不那么困难。\n\
  \n亮点：\n\n* 通过最初关注现代特性来快速上手。\n* 大多数章节都提供了测试驱动的练习和测验。\n* 涵盖了 JavaScript 的所有核心特性，直到并包含\
  \ ES2019。\n* 可的高级章节允许你进行深入探索。\n\n不需要预先具备 JavaScript ，但你应该知道如何编程。\n\n### 1.1.2 本书未涵盖哪些内容？\n\
  \n* 某些功能未被涵盖。\n\n### 1.1.3 这本书对于急躁的人来说不是太长了吗？\n\n## 1.2 预览和购买此书\n\n### 1.2.1 我如何预览书籍、练习题和测验？\n\
