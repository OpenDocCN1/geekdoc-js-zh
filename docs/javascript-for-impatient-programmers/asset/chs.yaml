  *   Wikipedia\n*   [TypeScript 内置类型定义](https://github.com/Microsoft/TypeScript/blob/master/lib/)\n\
  *   [MDN JavaScript 文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript)\n\
  *   [ECMAScript 语言规范](https://tc39.github.io/ecma262/)\n\n# 19 Unicode – 简介绍\n\n\
  Unicode 是用于表示文本的标准。Unicode 的第一个版本于 1991 年 10 月发布。注意负数时的变化情况，因为“更大”始终意味着“更接近正无穷”。\n\
  \n## 19.1 代码点与代码单元\n\n理解理解所需的两个概念至关重要：\n\n*   *代码点*（Code points）是表示字符的数字。\n*   *代码单元*（Code\
  \ units）是存储或传输 Unicode 的数字。\n\nUnicode 的第一个版本是 16 位的。从那时以后，字符数量大幅增加，点的大小也扩展到了 21\
  \ 位。这 21 位被划分为 17 个平面，每个平面 16 位：\n\n*   平面 0：**基本语言平面 (BMP)**，0x0000–xFFFF\n   \
  \ 包含几乎所有现代语言字符（拉丁、亚洲等）以及许多符号。\n\n*   平面 1：补充语言平面 (SMP)，0x10000–1FFFF\n    支持古代文字系统（如埃及象形文字和楔形文字）以及额外的现代文字系统。支持表情和其他许多符号。\n\
  \n*   平面 2：补充表字平面 (SIP)，0x20000–2FFFF\n    包含 CJK（中、日、韩）表字。\n\n*   平面 3–13：未分配\n\
  \n*   平面 14：补充特殊用途平面 (SSP)，0xE0000–xEFFFF\n    包含非图形字符，如标签字符和变体选择器。\n\n*   平面 15–16：补充私用区\
  \ (S PUA A/B)，0xF0000–10FFFF\n    供 ISO 和 Unicode 组织之外的方分配字符。未标准化。\n\n平面 1-16 被称为**抽象平面**（astral\
  \ planes）。\n\n检查几个字符的代码点：\n\n```\n> 'A'.codePointAt(0).toString(16)\n'41'\n> 'ü'.codePointAt(0).toString(16)\n\
  'fc'\n> 'π'.codePointAt(0).toString(16)\n'3c0'\n> '\U0001F642'.codePointAt(0).toString(16)\n\
  '1f642'\n```\n\n十六进制数告诉我们前三个字符位于平面 0（16 位以内），而表情符号位于平面 1。\n\n### 19.1.2 代码点：UTF-32,\
  \ UTF-16, UTF-8\n\n编码代码点的主要方法是三种“Unicode 转换格式”（UTF）：UTF-32、UTF-16、UTF-8。每个格式末尾的数字表示其代码单元的大小（位）。\n\
  \n#### 19.1.2.1 UTF-32\n\n\n\n\nUTF-32 使用 32 位来存储代码单元，导致每个代码点对应一个代码单元。这是唯一`固定长度编码`的格式，其他格式都使用不同数量的代码单元来编码单个代码点。\n\
  \n### 19.1.2.2 UTF-16 (Unicode 转换格式 16)\n\nUTF-16 使用 16 位代码单元。它按如下方式编码代码点：\n\n*\
  \   BMP（Unicode 的前 16 位）存储在单个代码单元中。\n*   星际平面：BMP 包含 `0x10_000` 个代码点。考虑到 Unicode\
  \ 总共有 `0x110_000` 个代码点，我们仍然需要编码剩余的 `0x100_000` 个代码点（20 位）。BMP 有两个未分配的代码点范围提供了必要的存储空间：\n\
  \    *   高 10 位（高位代理，`leading surrogate`）：`0xD800-0xDBFF`\n    *   低 10 位（低位代理，`trailing\
  \ surrogate`）：`0xDC00-0xDFFF`\n\n换句话说，末尾两个十六进制数字贡献了 8 位。但只有当 BMP 以以下任意一组双位组合开头时，我们才能使用这\
  \ 8 位：\n\n*   `D8`, `D9`, `DA`, `DB`\n*   `DC`, `DD`, `DE`, `DF`\n\n每个代理对有 4 组供选择，剩余的\
  \ 2 位就源于此。\n\n因此，每个 UTF-16 代码单元始终是高位代理、低位代理或编码一个 BMP 代码点。\n\n以下是 UTF-16 编码代码点的示例：\n\
  \n*   代码点 `0x03C0`（π）位于 BMP 中，因此可以用单个 UTF-16 代码单元表示：`0x03C0`。\n*   代码点 `0x1F642`（\U0001F642\
  ）位于星际平面中，由两个代码单元表示：`0xD83D` 和 `0xDE42`。\n\n### 19.1.2.3 UTF-8 (Unicode 转换格式 8)\n\
  \nUTF-8 使用 8 位代码单元。它使用 1–4 个代码单元来编码一个代码点：\n\n| 代码点 | 代码单元 |\n| :--- | :--- |\n|\
  \ 0000–007F | `0bbbbbbb` (7 位) |\n| 0080–07FF | `110bbbbb, 10bbbbbb` (5+6 位) |\n\
  | 0800–FFFF | `1110bbbb, 10bbbbbb, 10bbbbbb` (4+6+6 位) |\n| 10000–1FFFFF | `11110bbb,\
  \ 10bbbbbb, 10bbbbbb, 10bbbbbb` (3+6+6+6 位) |\n\n说明：\n\n*   每个代码单元的位前缀告诉我们：\n  \
  \  *   它是代码单元序列中的第一个吗？如果是，后面会有多少代码单元？\n    *   它是代码单元序列中的第二个或后续吗？\n*   `0000–007F`\
  \ 范围内的字符映射与 ASCII 相同，这使得它与旧软件具有某种程度的兼容性。\n\n三个示例：\n\n| 字符 | 代码点 | 代码单元 |\n| :---\
  \ | :--- | :--- |\n| A | 0x0041 | 01000001 |\n| π | 0x03C0 | 11001111, 10000000\
  \ |\n| `\U0001F642` | 0x1F642 | 11110000, 10011111, 10011001, 10000010 |\n\n###\
  \ 19.2 Web 开发中使用的编码：UTF-16 和 UTF-8\n\nWeb 开发中使用的 Unicode 编码格式是 UTF-16 和 UTF-8。\n\
  \n### 19.2.1 内部源码：UTF-16\n\nECMAScript 规范内部使用 UTF-16 表示源码。\n\n### 19.2.2 字符串：UTF-16\n\
  \nJavaScript 字符串中的字符基于 UTF-16 代码单元：\n\n```\n> const smiley = '\U0001F642';\n> smiley.length\n\
  2\n> smiley === '\\uD83D\\uDE42' // 代码单元\ntrue\n```\n\n有关关于 Unicode 和字符串的更多信息，请参阅\
  \ [§20.6 “文本原子：Unicode 字符、JavaScript 字符、字形簇”。\n\n### 19.2.3 文件中的源码：UTF-8\n\n如今 HTML\
  \ 和 JavaScript 几乎总是编码为 UTF-8。\n\n例如，现在 HTML 文件通常是开始的：\n\n```html\n<!doctype html>\n\
  <html\n<head>\n  <meta charset=\"UTF-8\">\n  ···\n```\n\n对于在浏览器中加载的 HTML 模块，[标准编码](https://html.spec.whatwg.org/multipage/webappapis.html#fetch-a-single-module-script)\
  \ 也是 UTF-8。\n\n## 19.3 字形簇 – 真正的字符\n\n一旦你考虑到世界上许多书写系统，“字符”的概念就会变得极其复杂。\n\n一方面，是以代码点表示的\
  \ Unicode 字符。\n\n另一方面，是`字形簇`（grapheme clusters）。字形簇与屏幕或纸张上显示的符号最为接近。它被定义为“水平可分割的文本单元”。因此，[Unicode\
  \ 文档](https://unicode.org/reports/tr29/#Grapheme_Cluster_Boundaries) 也将其称为`用户感知字符`（user-perceived\
  \ character）。编码一个字形簇需要一个或多个代码点字符。\n\n例如，印地文 *kshi* 由 4 个代码点编码。我们使用展开运算符（`...`）将字符串拆分为包含代码点字符的\
  \ `Array`（详情请参阅 [§20.6.1 “处理代码点”）：\n\n> ![分割字形簇]\n\n\n\n\n\n*   Unix 换行：`'\\n'`\n\
  *   Windows 换行：`'\\r\\n'`\n*   制表符：`'\\t'`\n*   反斜线：`\\\\'`\n\n反斜线还允许你在字面量内部使用该字面量的分隔符：\n\
  \n```\n[](#cb317-1)assert.equal(\n[](#cb317-2)  'She said: \"Let\\'s go!\"',\n[](#cb317-3)\
  \  \"She said: \\\"Let's go!\\\"\");\n```\n\n### 20.2 访问字符和代码点\n\n### 20.2.1 访问\
  \ JavaScript 字符\n\nJavaScript 没有额外的字符数据类型 – 字符总是被表示为为字符串。\n\n```\n[](#cb318-1)const\
  \ str = 'abc';\n[](#cb318-2)\n[](#cb318-3)// 读取指定索引处的字符\n[](#cb318-4)assert.equal(str[1],\
  \ 'b');\n[](#cb318-5)\n[](#cb318-6)// 计算字符串中的字符数：\n[](#cb318-7)assert.equal(str.length,\
  \ 3);\n```\n\n### 20.2.2 通过 `for-of` 和展开运算符访问 Unicode 代码点字符\n\n通过 `for-of` 或展开运算符（`...`）迭代字符串会访问\
  \ Unicode 代码点字符。每个代码点字符由 1–2 个 JavaScript 字符编码。有关更多信息，请参阅 §20.6 “文本的原子：Unicode 字符、JavaScript\
  \ 字符、字形聚簇”。\n\n以下是如何通过 `for-of` 迭代字符串的代码点字符的：\n\n```\n[](#cb319-1)for (const ch\
  \ of 'x\U0001F642y') {\n[](#cb319-2)  console.log(ch);\n[](#cb319-3)}\n[](#cb319-4)//\
  \ 输出：\n[](#cb319-5)// 'x'\n[](#cb319-6)// '\U0001F642'\n[](#cb319-7)// 'y'\n```\n\
  \n以下是如何通过展开运算符将字符串转换为代码点字符数组 Array 的：\n\n```\n[](#cb320-1)assert.deepEqual([...'x\U0001F642\
  y'], ['x', '\U0001F642', 'y']);\n```\n\n## 20.3 通过 `+` 进行字符串拼接\n\n如果至少有一个操作数是字符串，加法运算符（`+`）会将任何非字符串转换为字符串并拼接结果：\n\
  \n```\n[](#cb321-1)assert.equal(3 + ' times ' + 4, '3 times 4');\n```\n\n如果至少有一个操作数是字符串，加法运算符（`+`）会将任何非字符串转换为字符串并拼接结果：\n\
  \n```\n[](#cb321-1)assert.equal(3 + ' times ' + 4, '3 times 4');\n```\n\n如果至少有一个操作数是字符串，加法运算符（`+`）会将任何非字符串转换为字符串并拼接结果：\n\
  \n```\n[](#cb321-1)assert.equal(3 + ' times ' + 4, '3 times 4');\n```\n\n如果至少有一个操作数是字符串，加法运算符（`+`）会将任何非字符串转换为字符串并拼接结果：\n\
  \n```\n[](#cb321-1)assert.equal(3 + ' times ' + 4, '3 times 4');\n```\n\n如果至少有一个操作数是字符串，加法运算符（`+`）会将任何非字符串转换为字符串并拼接结果：\n\
  \n```\n[](#cb321-1)assert.equal(3 + ' times ' + 4, '3 times 4');\n```\n\n如果至少有一个操作数是字符串，加法运算符（`+`）会将任何非字符串转换为字符串并拼接结果：\n\
  \n```\n[](#cb321-1)assert.equal(3 + ' times ' + 4, '3 times 4');\n```\n\n如果至少有一个操作数是字符串，加法运算符（`+`）会将任何非字符串转换为字符串并拼接结果：\n\
  \n```\n[](#cb321-1)assert.equal(3 + ' times ' + 4, '3 times 4');\n```\n\n如果至少有一个操作数是字符串，加法运算符（`+`）会将任何非字符串转换为字符串并拼接结果：\n\
  \n```\n[](#cb321-1)assert.equal(3 + ' times ' + 4, '3 times 4');\n```\n\n如果至少有一个操作数是字符串，加法运算符（`+`）会将任何非字符串转换为字符串并拼接结果：\n\
  \n```\n[](#cb321-1)assert.equal(3 + ' times ' + 4, '3 times 4');\n```\n\n### 20.4\
  \ 转换为字符串\n\n以下是三种 `String()` 将值转换为字符串的转换：\n\n*   `String(x)`\n*   `+x`\n*   `x.toString()`\n\
  \n### 20.4.1 字符串化对象\n\n如果至少有一个操作数是字符串，加法运算符（`+`）会将任何非字符串转换为字符串并拼接结果：\n\n```\n[](#cb321-1)assert.equal(3\
  \ + ' times ' + 4, '3 times 4');\n```\n\n如果至少有一个操作数是字符串，加法运算符（`+`）会将任何非字符串转换为字符串并拼接结果：\n\
  \n```\n[](#cb321-1)assert.equal(3 + ' times ' + 4, '3 times 4');\n```\n\n### 20.4.2\
  \ 自定义对象的字符串化\n\n你可以通过实现 `toString()` 方法来覆盖对象的默认的字符串化方式：\n\n```\n[](#cb328-1)const\
  \ obj = {\n[](#cb328-2)  toString() {\n[](#cb328-3)    return 'hello';\n[](#cb328-4)\
  \  }\n[](#cb328-5)};\n[](#cb328-6)\nassert.equal(String(obj), 'hello');\n```\n\n\
  ### 20.4.3 值的字符串化的另一种方式\n\nJSON 数据格式是值的文本表示。因此，`JSON.stringify`](ch46.xhtml_JSON.stringify)\
  \ 也可以将值转换为字符串：\n\n```\n> JSON.stringify({a: 1})\n'{\"a\":1}'\n> JSON.stringify(['a',\
  \ ['b']])\n'[\"a\",[\"b\"]]\n```\n\n注意事项是 JSON 只支持 `null`、布尔值、数字、字符串、数组和对象（它总是将对象视为通过对象字面量创建的）。\n\
  \n提示：第三参数允许你开启多行输出并指定缩进量——例如：\n\n```\n[](#cb330-1)console.log(JSON.stringify({first:\
  \ 'Jane', last: 'Doe'}, null, 2));\n```\n\n该语句产生了以下输出：\n\n```\n{\n  \"first\": \"\
  Jane\",\n  \"last\": \"Doe\"\n}\n```\n\n### 20.5 比较字符串\n\n字符串可以通过以下运算符进行比较：\n\n\
  ```\n< <= > >=\n```\n\n有一个重要的注意事项需要考虑：这些运算符基于 JavaScript 字符的数值进行比较的。这意味着 JavaScript\
  \ 用于字符串的顺序与不同的。\n\n正确地比较文本超出了本书的范围。它通过[国际化 API (`Intl`)](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference_Objects/Intl)\
  \ 支持。\n\n\n\n\n\n```javascript\nconst str = '\U0001F642a';\nassert.equal(str.length,\
  \ 3);\n\nfor (const codePointChar of str) {\n  console.log(codePointChar);\n}\n\n\
  // Output:\n// '\U0001F642'\n// 'a'\n```\n\n展开（`...`）到数组字面量 也是基于迭代并访问 Unicode 字符的：\n\
  \n```javascript\n> [...'\U0001F642a']\n[ '\U0001F642', 'a' ]\n```\n\n这使其成为统计 Unicode\
  \ 字符的良好工具：\n\n```javascript\n> [...'\U0001F642a'].length\n2\n> '\U0001F642a'.length\n\
  3\n```\n\n### 20.6.2 使用代码单元（字符码）\n\n字符串的索引和长度基于 JavaScript 字符（以 UTF-16 代码单元表示）。\n\
  \n要用十六进制形式指定代码单元，可以使用“代码单元转义”（`code unit escape`）：\n\n```javascript\n> '\\uD83D\\\
  uDE42'\n'\U0001F642'\n```\n\n你可以使用 `String.fromCharCode()`。`Char code` 是标准库中 `code\
  \ unit` 的名称：\n\n```javascript\n> String.fromCharCode(0xD83D) + String.fromCharCode(0xDE42)\n\
  '\U0001F642'\n```\n\n要获取字符的字符码，使用 `.charCodeAt()`：\n\n```javascript\n> '\U0001F642\
  '.charCodeAt(0).toString(16)\n'd83d'\n```\n\n### 20.6.3 注意事项：字形簇（grapheme clusters）\n\
  \n在处理可能用任何人类语言的文本时，最好在字形簇的边界处分割，而不是在 Unicode 字符的边界处。\n\nTC39 正在开发 [`Intl.Segmenter`](https://github.com/tc39/proposal-intl-segmenter)，这是\
  \ ECMAScript 国际化 API 的提案，用于支持 Unicode 分段（沿字形簇边界、单词边界、句子边界等）。\n\n在该提案成为标准之前，你可以可以使用现有的几个库之一（可以在网上搜索“JavaScript\
  \ grapheme”）。\n\n### 20.7 快速参考：字符串\n\n字符串是不可变的；没有任何字符串方法会修改它们自身的字符串。\n\n### 20.7.1\
  \ 转换为字符串\n\n表 13 描述了如何将各种值转换为字符串。\n\n表 13：将值转换为字符串\n\n| `x` | `String(x)` |\n| ---\
  \ | --- |\n| `undefined` | `'undefined'` |\n| `null` | `'null'` |\n| 布尔值 | `false`\
  \ → `'false'`, `true` → `'true'` |\n| 数字值 | 示例：`123` → `'123'` |\n| 字符串值 | `x`（输入，保持不变）\
  \ |\n| 对象 |通过 `toString()` 等方式进行配置 |\n\n### 20.7.2 字符的数值表示\n\n*   **Char code（字符码）**：用数值表示\
  \ JavaScript 字符。JavaScript 对 `Unicode code unit` 的称呼。\n\n    *   大小：16 位，无符号\n \
  \   *   将数字转换为字符：`String.fromCharCode()`\n    *   将字符转换为数字：字符串方法 `.charCodeAt()`\n\
  \n*   **Code point（码点）**：用数值表示 Unicode 字符。\n\n    *   大小：21 位，无符号（17 个平面，每个 16 位）\n\
  \    *   将数字转换为字符：`String.fromCodePoint()`\n    *   将字符转换为数字：字符串方法 `.codePointAt()`\n\
  \n### 20.7.3 字符串运算符\n\n```javascript\n// 通过 [] 访问字符\nconst str = 'abc';\nassert.equal(str[1],\
  \ 'b');\n\n// 通过 + 拼接字符串\nassert.equal('a' + 'b' + 'c', 'abc');\nassert.equal('take\
  \ ' + 3 + ' oranges', 'take 3 oranges');\n```\n\n### 20.7.4 `String.prototype`：查找与匹配\n\
  \n(`String.prototype` 是存储字符串方法的地方。）\n\n*   `.endsWith(searchString: string, endPos=this.length):\
  \ boolean`\n\n    如果字符串的长度为 `endPos` 时会以 `searchString` 结尾，则返回 `true`。否则返回 `false`。\n\
  \n    ```javascript\n    > 'foo.txt'.endsWith('.txt')\n    true\n    > 'abcde'.endsWith('cd',\
  \ 4)\n    true\n    ```\n\n*   `.includes(searchString: string, startPos=0): boolean`\n\
  \n    如果字符串包含 `searchString` 则返回 `true`，否则返回 `false`。搜索从 `startPos` 开始。\n\n    ```javascript\n\
  \    > 'abc'.includes('b')\n    true\n    > 'abc'.includes('b', 2)\n    false\n\
  \    ```\n\n*   `.indexOf(searchString: string, minIndex=0): number`\n\n    返回 `searchString`\
  \ 在字符串中出现的最低索引，否则返回 `-1`。任何返回的索引将是 `minIndex` 或更高。\n\n    ```javascript\n    > 'abab'.indexOf('a')\n\
  \    0\n    > 'abab'.indexOf('a', 1)\n    2\n    > 'abab'.indexOf('c')\n    -1\n\
  \    ```\n\n*   `.lastIndexOf(searchString: string, maxIndex=Infinity): number`\n\
  \n    返回 `searchString` 在字符串中出现的最高索引，否则返回 `-1`。任何返回的索引将是 `maxIndex` 或更低。\n\n   \
  \ ```javascript\n    > 'abab'.lastIndexOf('ab', 2)\n    2\n    > 'abab'.lastIndexOf('ab',\
  \ 1)\n    0\n    > 'abab'.lastIndexOf('ab')\n    2\n    ```\n\n*   `.match(regExp:\
  \ string | RegExp): RegExpMatchArray | null`\n\n    如果 `regExp` 是没有设置标记 `/g` 的正则表达式，则\
  \ `.match()` 返回字符串中 `regExp` 的第一个匹配项。如果没有匹配项，则返回 `null`。如果 `regExp` 是字符串，则在执行前述步骤之前，它被用于创建一个正则表达式（类似于\
  \ `new RegExp()` 的参数）。\n\n    结果具有以下类型：\n\n    ```javascript\n    interface RegExpMatchArray\
  \ extends Array<string> {\n      index: number;\n      input: string;\n      groups:\
  \ undefined | {\n        [key: string]: string\n      };\n    }\n    ```\n\n   \
  \ 编号的捕获组变为数组索引（这就是为什么它继承了 `Array`）。命名捕获组变为 `.groups` 的属性。\n\n    ```javascript\n\
  \    > 'ababb'.match(/a+)/)\n    { 0: 'a', index: 0, input: 'ababb', groups: undefined\
  \ }\n    > 'ababb'.match(/(a+)/)\n    { 0: 'a', index: 0, input: 'ababb', groups:\
  \ { 1: 'a' } }\n    ```\n\n    在此模式下，使用 `exec`。如果设置了标记 `/g`，`.match()` 返回包含所有匹配项的数组，如果没有匹配项则返回\
  \ `null`。\n\n    ```javascript\n    > 'ababb'.match(/a+)/g)\n    [ 'a', 'a' ]\n\
  \    > 'ababb'.match(/(a+)/g)\n    [ 'a', 'a' ]\n    > 'abab'.match(/x/g)\n    null\n\
  \    ```\n\n*   `.search(regExp: string | RegExp): number`\n\n    返回 `regExp` 在字符串中出现的索引。如果\
  \ `regExp` 是字符串，则它被用于创建一个正则表达式（类似于 `new RegExp()` 的参数）。\n\n    ```javascript\n \
  \   > 'a2b'.search(/[0-9]/)\n    1\n    > 'a2b'.search('[0-9]')\n    1\n    ```\n\
  \n*   `.startsWith(searchString: string, startPos=0): boolean`\n\n    如果 `searchString`\
  \ 出现在字符串索引 `startPos` 处，则返回 `true`。否则返回 `false`。\n\n    ```javascript\n    > '.gitignore'.startsWith('.')\n\
  \    true\n    > 'abcde'.startsWith('bc', 1)\n    true\n    ```\n\n### 20.7.5 `String.prototype`：提取\n\
  \n*   `.slice(start=0, end=this.length): string`\n\n    返回从索引 `start`（包含）到索引 `end`（不包含）的字符串子串。如果索引为负数，则会加上\
  \ `.length`（`-1` 变为 `this.length-1` 等）。\n\n    ```javascript\n    > 'abc'.slice(1,\
  \ 3)\n    'bc'\n    > 'abc'.slice(1)\n    'bc'\n    > 'abc'.slice(-2)\n    'bc'\n\
  \    ```\n\n*   `.split(separator: string | RegExp, limit?: number): string[]`\n\
  \n    将字符串分割为子串数组——即分隔符之间的字符串。`separator` 可以是字符串：\n\n    ```javascript\n    > 'a\
  \ | b | c'.split('|')\n    [ 'a ', ' b ', ' c' ]\n    ```\n\n    也可以是正则表达式：\n\n\
  \    ```javascript\n    > 'a : b : c'.split(/ *: */)\n    [ 'a', 'b', 'c' ]\n  \
  \  > 'a : b : c'.split(/( *):( *)/)\n    [ 'a', ' ', ' ', 'b', ' ', ' ', 'c' ]\n\
  \    ```\n\n    最后的调用演示了正则表达式中组捕获的内容会成为返回数组的元素。\n\n\n\n\n\n**警告：`.split('')` 将字符串拆分为\
  \ JavaScript 字符。** 这在处理星宇 Unicode 字符（编码为两个 JavaScript 字符）时效果并不好。例如，表情符号就是星宇字符：\n\
  \n```javascript\n> '\U0001F642X\U0001F642'.split('')\n[ '\\uD83D', '\\uDE42', 'X',\
  \ '\\uD83D', '\\uDE42' ]\n```\n\n相反，使用扩展运算符会更好：\n\n```javascript\n> [...'\U0001F642\
  X\U0001F642']\n[ '\U0001F642', 'X', '\U0001F642' ]\n```\n\n* `.substring(start:\
  \ number, end=this.length): string` ^([ES1])\n\n  使用 `.slice()` 代替此方法。`.substring()`\
  \ 在旧版引擎中的实现并不一致，且不支持负数索引。\n\n### 20.7.6 `String.prototype`: 组合\n\n* `.concat(...strings:\
  \ string[]): string` ^([ES3])\n\n  返回字符串与 `strings` 拼接后的结果。`'a'.concat('b')` 等于\
  \ `'a'+'b'`。后者更为流行。\n\n```javascript\n> 'ab'.concat('cd', 'ef', 'gh')\n'abcdefgh'\n\
  ```\n\n* `.padEnd(len: number, fillString=' '): string` ^([ES2017])\n\n  在字符串末尾添加\
  \ `fillString` 的（片段），直到达到指定的长度 `len`。如果长度已经达到或超过了 `len`，则原样返回。\n\n```javascript\n\
  > '#'.padEnd(2)\n'# '\n> 'abc'.padEnd(2)\n'abc'\n> '#'.padEnd(5, 'abc')\n'#abca'\n\
  ```\n\n* `.padStart(len: number, fillString=' '): string` ^([ES2017])\n\n  在字符串开头添加\
  \ `fillString` 的（片段），直到达到指定的长度 `len`。如果长度已经达到或超过了 `len`，则原样返回。\n\n```javascript\n\
  > '#'.padStart(2)\n' #'\n> 'abc'.padStart(2)\n'abc'\n> '#'.padStart(5, 'abc')\n\
  'abca#'\n```\n\n* `.repeat(count=0): string` ^([ES6])\n\n  返回拼接 `count` 次后的字符串。\n\
  \n```javascript\n> '*'.repeat()\n''\n> '*'.repeat(3)\n'***'\n```\n\n### 20.7.7 `String.prototype`:\
  \ 转换\n\n* `.normalize(form: 'NFC'|'NFD'|'NFKC'|'NFKD' = 'NFC'): string` ^([ES6])\n\
  \n  根据 [Unicode 规范化形式](https://unicode.org/reports/tr15/)规范化字符串。\n\n* [1 of 2] `.replace(searchValue:\
  \ string | RegExp, replaceValue: string): string` ^([ES3])\n\n  将 `searchValue`\
  \ 的匹配项替换为 `replaceValue`。如果 `searchValue` 是字符串，则只替换第一个精确匹配。如果 `searchValue` 是不带\
  \ `/g` 标志的正则表达式，则只替换第一个匹配。如果 `searchValue` 是带有 `/g` 标志的正则表达式，则替换所有匹配项。\n\n```javascript\n\
  > 'x.x.'.replace('.', '#')\n'x#x.'\n> 'x.x.'.replace(/./, '#')\n'#.x.'\n> 'x.x.'.replace(/./g,\
  \ '#')\n'####'\n```\n\n  `replaceValue` 中的特殊字符有：\n\n  * `$$`: 变为 `$`\n  * `$n`:\
  \ 变为数字分组 `n` 的捕获内容（遗憾的是，`$0` 代表字符串 `'$0'`,而不代表整个匹配项）\n  * `$&`: 变为整个匹配项\n  * `$\
  \ `: 变为匹配项之前的所有内容\n  * `$'`: 变为匹配项之后的所有内容\n\n  示例：\n\n```javascript\n> 'a 2020-04\
  \ b'.replace(/([0-9]{4})-([0-9]{2})/, '|$2|')\n'a |04| b'\n> 'a 2020-04 b'.replace(/([0-9]{4})-([0-9]{2})/,\
  \ '|$&|')\n'a |2020-04| b'\n> 'a 2020-04 b'.replace(/([0-9]{4})-([0-9]{2})/, '|$`|')\n\
  'a |a | b'\n```\n\n  同时也支持命名捕获组 (ES2018)：\n\n  * `$<name>` 变为命名分组 `name` 的捕获内容\n\
  \n  示例：\n\n```javascript\nassert.equal(\n  'a 2020-04 b'.replace(/(?<year>[0-9]{4})-(?<month>[0-9]{2})/,\
  \ '|$<month>|'),\n  'a |04| b');\n);\n```\n\n* [2 of 2] `.replace(searchValue: string\
  \ | RegExp, replacer: (...args: any[]) => string): string` ^([ES3])\n\n  如果第二个参数是函数，匹配项将被替换为函数返回的字符串。其参数\
  \ `args` 为：\n\n  * `matched: string`. 完整的匹配\n  * `g1: string|undefined`. 数字分组 1\
  \ 的捕获内容\n  * `g2: string|undefined`. 数字分组 2 的捕获内容\n  * （等等等）\n  * `offset: number`.\
  \ 匹配项在输入字符串中的位置？\n  * `input: string`. 整个输入字符串\n\n```javascript\nconst regexp =\
  \ /([0-9]{4})-([0-9]{2})/;\nconst replacer = (all, year, month) => '|' + all + '|';\n\
  assert.equal(\n  'a 2020-04 b'.replace(regexp, replacer),\n  'a |2020-04| b');\n\
  ```\n\n\n\n\n\n在我们深入研究 `template literal` 和 `tagged template` 这两个功能之前，让我们先来看看 `template`\
  \ 一词的多种含义。\n\n## 21.1 消除歧义：“template”\n\n尽管以下三者在名称中都包含 `template`，且看起来很相似，但它们之间存在着显著的区别：\n\
  \n*   `text template`（文本模板）是一个从数据到文本的函数。它经常用于 Web 开发，通常通过文本文件定义。例如，以下文本定义了 [Handlebars](https://handlebarsjs.com)\
  \ 库的模板：\n\n```\n<div class=\"entry\">\n  <h1>{{title}}</h1>\n  <div class=\"body\"\
  >\n    {{body}}\n  </div>\n</div>\n```\n\n这个模板有两个待填充的空白：`title` 和 `body`。它的用法如下：\n\
  \n```javascript\n// 第一步：获取模板文本，例如从文本文件。\nconst tmplFunc = Handlebars.compile(TMPL_TEXT);\
  \ // 编译字符串\nconst data = {title: 'My page', body: 'Welcome to my page!'};\nconst\
  \ html = tmplFunc(data);\n```\n\n*   `template literal`（模板字面量）类似于字符串字面量，但具有额外的功能——例如插值。它由反引号界定：\n\
  \n```javascript\nconst num = 5;\nassert.equal(`Count: ${num}!`, 'Count: 5!');\n\
  ```\n\n*   在语法上，`tagged template`（标签模板）是一个跟在函数（或者准确地说，求值为函数的表达式）后面的模板字面量。这会导致函数被调用。它的参数派自模板字面量的内容。\n\
  \n```javascript\nconst getArgs = (...args) => args;\nassert.deepEqual(\n  getArgs`Count:\
  \ ${5}!`,\n  [['Count: ', '!'], 5] );\n```\n\n注意，`getArgs()` 同时接收字面量的文本和通过 `${}`\
  \ 插值的数据。\n\n## 21.2 Template literals\n\n与普通字符串字面量相比，模板字面量有两个新特性。\n\n首先，它支持 `string\
  \ interpolation`（字符串插值）：如果你在 `${}` 内部放入一个动态计算的值，它会被转换为字符串并插入到该字面量返回的字符串中。\n\n```javascript\n\
  const MAX = 100;\nfunction doSomeWork(x) {\n  if (x > MAX) {\n    throw new Error(`At\
  \ most ${MAX} allowed: ${x}!`);\n  }\n  // ···\n}\nassert.throws(\n  () => doSomeWork(101),\n\
  \  {message: 'At most 100 allowed: 101!'});\n```\n\n其次，模板字面量可以跨行：\n\n```javascript\n\
  const str = `this is\na text with\nmultiple lines`;\n```\n\n模板字面量始终产生字符串。\n\n##\
  \ 21.3 Tagged templates\n\nA 行中的表达式是一个 `tagged template`。它等同于调用 `tagFunc()`，并传入\
  \ B 行数组中列出的参数。\n\n```javascript\nfunction tagFunc(...args) {\n  return args;\n}\n\
  \nconst setting = 'dark mode';\nconst value = true;\n\nassert.deepEqual(\n  tagFunc`Setting\
  \ ${setting} is ${value}!`, // (A)\n  [['Setting ', ' is ', '!'], 'dark mode', true]\
  \ // (B)\n);\n```\n\n第一个反引号之前的函数被称为 `tag function`（标签函数）。它的参数是：\n\n*   `Template\
  \ strings`（模板字符串，第一个参数）：一个包含插值 `${}` 周围文本片段的数组。\n\n    *   示例中：`['Setting ', ' is\
  \ ', '!']`\n\n*   `Substitutions`（剩余参数）：插值值。\n\n    *   示例中：`'dark mode'` 和 `true`\n\
  \n字面量的静态（固定）部分（模板字符串）与动态部分（插值）分开。标签函数可以返回任意值。\n\n### 21.3.1 Cooked vs. raw template\
  \ strings（高级）\n\n到目前为止，我们只看到了模板字符串的 `cooked interpretation`（已解释）。但标签函数实际上有两种解释方式：\n\
  \n*   `cooked interpretation`：其中反斜杠具有特殊含义。例如，`\\t` 产生一个制表符。这种对模板字符串的解释存储在第一个参数的数组中。\n\
  *   `raw interpretation`（原始解释）：其中反斜杠没有特殊含义。例如，`\\t` 会产生两个字符——一个反斜杠和一个字母 `t`。这种对模板字符串的解释存储在第一个参数的\
  \ `.raw` 属性中（一个数组）。\n\n下面的标签函数 `cookedRaw` 同时使用了两者：\n\n```javascript\nfunction cookedRaw(templateStrings,\
  \ ...substitutions) {\n  return {\n    cooked: [...templateStrings], // 拷贝数组元素\n\
  \    raw: templateStrings.raw,\n    substitutions,\n  };\n}\nassert.deepEqual(\n\
  \  cookedRaw`\\t${'subst'}\\n`,\n  {\n    cooked: ['\\t', '\\n'],\n    raw: ['\\\
  t', '\\n'],\n    substitutions: ['subst'],\n  });\n```\n\n原始解释通过 `String.raw` 类似的应用实现了原始字符串字面量。标签模板非常适合支持小型\
  \ ` languages`（所谓的领域特定语言`）。我们将继续看几个例子。\n\n### 21.3.2 Tag function library: lit-html\n\
  \n[lit-html](https://github.com/Polymer/lit-html) 是一个基于标签模板的模板库，被[前端框架 Polymer](https://www.polymer-project.org/)\
  \ 使用：\n\n```javascript\nimport {html, render} from 'lit-html';\nconst template =\
  \ (items) => html`\n  <ul>\n    ${\n      repeat(items,\n        (item) => item.id,\n\
  \        (item, index) => html`<li>${index}. ${item.name}</li>`\n      )\n    }\n\
  \  </ul>`;\n```\n\n`repeat()` 是一个用于循环的自定义函数。它的第二个参数为第三个参数返回的值生成唯一键。注意该参数使用了了嵌套的标签模板。\n\
  \n### 21.3.3 Tag function library: re-template-tag\n\n[re-template-tag](https://github.com/rauschma/re-template-tag)\
  \ 是一个用于组合正则表达式的简单库。用 `re` 标记的模板会产生正则表达式。其主要优势是，你可以通过 `${}`（A 行）插值正则表达式和纯文本：\n\n\
  ```javascript\nconst RE_YEAR = re`(?<year>[0-9]{4})`;\nconst RE_MONTH = re`(?<month>[0-9]{2})`;\n\
  const RE_DAY = re`(?<day>[0-9]{2})`;\nconst RE_DATE = re`/${RE_YEAR}-${RE_MONTH}-${RE_DAY}/u`;\
  \ // (A)\n\nconst match = RE_DATE.exec('2017-01-27');\nassert.equal(match.groups.year,\
  \ '2017');\n```\n\n### 21.3.4 Tag function library: graphql-tag\n\n[graphql-tag\
  \ 库](https://github.com/apollographql/graphql-tag) 允许你通过标签模板创建 GraphQL 查询：\n\n```javascript\n\
  import gql from 'graphql-tag';\n\nconst query = gql`\n  {\n    user(id: 5) {\n \
  \     firstName\n      lastName\n    }\n  }\n`;\n```\n\n此外，还有插件可以在 Babel、TypeScript\
  \ 等中预编译此类查询。\n\n## 21.4 Raw string literals\n\n原始字符串字面量通过标签函数 `String.raw` 实现。它们是字符串字面量，其中反斜杠不会产生特殊作用（例如转义字符等）：\n\
  \n当数据包含反斜杠时，这非常有用——例如带有正则表达式的字符串：\n\n```javascript\nassert.equal(String.raw`\\back`,\
  \ '\\\\back');\n\nconst regex1 = /^\\./;\nconst regex2 = new RegExp('^\\\\.');\n\
  const regex3 = new RegExp(String.raw`^\\.`);\n```\n\n\n\n\n这三个正则表达式是等价的。对于普通的字符串字面量，你必须写两次反斜杠来在该字面量对其进行转义。对于原始字符串字面量（raw\
  \ string literal），你不需要这样做。\n\n原始字符串字面量也用于指定 Windows 文件路径：\n\n```javascript\nconst\
  \ WIN_PATH = String.raw`C:\\foo\\bar`;\nassert.equal(WIN_PATH, 'C:\\\\foo\\\\bar');\n\
  ```\n\n## 21.5 (高级)\n\n其余章节均为高级内容\n\n## 21.6 多行模板字符串字量与缩进\n\n如果你在模板字符串字量中使用多行文本，有两个目标是相互冲突的：一方面，模板字符串字量应该被缩进以适应源代码；另一方面，它的内容行应该从最左侧列开始。\n\
  \n例如：\n\n```javascript\nfunction div(text) {\n  return `\n<div>\n  ${text}\n</div>\n\
  \ ```\n}\nconsole.log('Output:');\nconsole.log(\n  div('Hello!')\n  // 将空格替换为中间点：\n\
  \  .replace(/ /g, '·')\n  // 将 \\n 替换为 #\\n：\n  .replace(/\\n/g, '#\\n')\n);\n```\n\
  \n由于缩进的存在，模板字符串字量很好地适应了源代码。的是，输出也是缩进的。我们不希望开头有换行符，结尾有换行符加两个空格。\n\n```\nOutput:\n\
  #\n····<div>#\n····Hello!#\n····</div>#\n··\n```\n\n有两种方法可以修复这个问题：通过标签模板（tagged\
  \ template）或对模板字符串字量的结果进行裁剪（trim）。\n\n### 21.6.1 修复：用于取消缩进的模板标签\n\n第一种修复方法是使用自定义模板标签来移除不需要的空白。它利用初始换行后的第一行来确定文本开始的列，并缩短所有的缩进。它还删除了最开头的换行符和末尾的缩进。其中一种模板标签是\
  \ [Desmond Brand 的 `dedent`](https://github.com/dmnd/dedent)：\n\n```javascript\n\
  import dedent from 'dedent';\nfunction divDedented(text) {\n  return dedent`\n<div>\n\
  \  ${text}\n</div>\n ```replace(/\\n/g, '#\\n');\n}\nconsole.log('Output:');\nconsole.log(divDedented('Hello!'));\n\
  ```\n\n这一次，输出不再是缩进的：\n\n```\nOutput:\n<div>#\n  Hello!#\n</div>\n```\n\n### 21.6.2 修复：`.trim()`\n\
  \n第二种修复方法更快，但也更粗略：\n\n```javascript\nfunction divDedented(text) {\n  return `\n\
  <div>\n  ${text}\n</div>\n ```trim().replace(/\\n/g, '#\\n');\n}\nconsole.log('Output:');\n\
  console.log(divDedented('Hello!'));\n```\n\n字符串方法 `.trim()` 移除开头和结尾的多余空白，但内容本身必须从最左侧列开始。这种解决方案的优点是不需要自定义标签函数。缺点是它看起来很丑。\n\
  \n输出与 `dedent` 相同：\n\n```\nOutput:\n<div>#\n  Hello!#\n</div>\n```\n\n## 21.7 通过模板字符串字量进行简单模板\n\
  \n虽然模板字符串字量看起来像文本模板，但并不能看出如何使用它们进行（文本）模板化：文本模板从对象获取数据，而模板字符串字量从变量获取数据。解决方案是在函数体中使用模板字符串字量，其参数接收模板化数据——例如：\n\
  \n```javascript\nconst tmpl = (data) => `Hello ${data.name}!`;\nassert.equal(tmpl({name:\
  \ 'Jane'}), 'Hello Jane!');\n```\n\n### 21.7.1 更复杂的示例\n\n作为一个更复杂的例子，我们想要获取地址数组并生成一个\
  \ HTML 表格。这个数组是：\n\n```javascript\nconst addresses = [\n  { first: '<Jane>', last:\
  \ 'Bond' },\n  { first: 'Lars', last: '<Croft>' },\n];\n```\n\n生成 HTML 表格的 `tmpl()`\
  \ 函数如下：\n\n```javascript\nconst tmpl = (addrs) => `\n<<table>\n  ${addrs.map(\n\
  \    (addr) => `\n<tr>\n<td>${escapeHtml(addr.first)}</td>\n<td>${escapeHtml(addr.last)}</td>\n\
  </tr>\n ```trim()\n  ).join('')}\n</<table>\n`.trim();\n```\n\n这段代码包含两个模板化函数：\n\n\
  *   第一个（第 1 行）接收 `addrs`（一个包含地址的数组），并返回一个表格的字符串。\n*   第二个（第 4 行）接收 `addr`（一个包含地址的对象），并返回一个表格行的字符串。注意末尾的\
  \ `.trim()`。\n\n### 21.7.2 简单的 HTML 转义\n\n以下函数对纯文本进行转义，以便在 HTML 中显示：\n\n```javascript\n\
  function escapeHtml(str) {\n  return str\n    .replace(/&/g, '&amp;')\n    .replace(/</g,\
  \ '&lt;')\n    .replace(/>/g, '&gt;')\n    .replace(/\"/g, '&quot;')\n    .replace(/'/g,\
  \ '&#39;');\n}\n```\n\n\n\n\n```javascript\nconst COLOR_BLUE = 'Blue';\n```\n\n\
  好的一方面，记录该常量会产生很有用的输出。坏的一方面，存在将无关的值误认为颜色的风险，因为内容相同的字符串被认为是相等的：\n\n```javascript\n\
  const MOOD_BLUE = 'Blue';\nassert.equal(COLOR_BLUE, MOOD_BLUE);\n```\n\n我们可以通过符号（symbols）来解决这个问题：\n\
  \n```javascript\nconst COLOR_BLUE = Symbol('Blue');\nconst MOOD_BLUE = Symbol('Blue');\n\
  assert.notEqual(COLOR_BLUE, MOOD_BLUE);\n```\n\n让我们使用以符号为值的常量来实现一个函数：\n\n```javascript\n\
  const COLOR_RED    = Symbol('Red');\nconst COLOR_ORANGE = Symbol('Orange');\nconst\
  \ COLOR_YELLOW = Symbol('Yellow');\nconst COLOR_GREEN  = Symbol('Green');\nconst\
  \ COLOR_BLUE   = Symbol('Blue');\nconst COLOR_VIOLET = Symbol('Violet');\n\nfunction\
  \ getComplement(color) {\n  switch (color) {\n    case COLOR_RED:\n      return\
  \ COLOR_GREEN;\n    case COLOR_ORANGE:\n      return COLOR_BLUE;\n    case COLOR_YELLOW:\n\
  \      return COLOR_VIOLET;\n    case COLOR_GREEN:\n      return COLOR_RED;\n  \
  \  case COLOR_BLUE:\n      return COLOR_ORANGE;\n    case COLOR_VIOLET:\n      return\
  \ COLOR_YELLOW;\n    default:\n      throw new Exception('Unknown color: '+color);\n\
  \  }\n}\nassert.equal(getComplement(COLOR_YELLOW), COLOR_VIOLET);\n```\n\n## 22.1.2\
  \ Symbols：唯一的属性键\n\n对象中属性（字段）的键被用于两个层级：\n\n*   程序在基础级别运行。该层级的键反映了程序所解决的问题。\n*  \
  \ 库和 ECMAScript 在元级别（meta-level）运行。该层级的键供处理基础级别数据和代码的服务使用。其中一个键就是 `'toString'`。\n\
  \n以下代码演示了差异：\n\n```javascript\nconst pt = {\n  x: 7,\n  y: 4,\n  toString() {\n\
  \    return `(${this.x}, ${this.y})`;\n  },\n};\nassert.equal(String(pt), '(7, 4)');\n\
  ```\n\n属性 `.x` 和 `.y` 存在于基础级别。它们持有 `pt` 所代表的点坐标，并用于解决问题——对点的计算。方法 `.toString()`\
  \ 存在于元级别。它被 JavaScript 用于将此对象转换为字符串。\n\n元级别属性绝不能干扰基础级别属性。也就是说，它们的键绝不能重叠。当语言和库都贡献于元级别时，这非常困难。例如，现在已无法给新的元级别方法起一个简单的名称（如\
  \ `toString`），因为它们可能与现有的基础级别名称冲突。Python 解决此问题的方案是在特殊名称的前后加上双划线：`__init__`、`__iter__`、`__hash__`\
  \ 等。然而，即使有了这种解决方案，库仍然拥有自己的元级别属性，因为这些属性可能与未来的语言属性冲突。\n\n用作属性键的符号帮助了我们：每个符号都是唯一的，且符号键永远不会与其他任何字符串键或符号键冲突。\n\
  \n### 22.1.2.1 示例：带有元级别方法的库\n\n作为一个例子，假设我们正在编写一个库，如果对象实现了某个特殊方法，则对其进行不同的处理。以下是为此类方法定义属性键并在对象中实现它的样子：\n\
  \n```javascript\nconst specialMethod = Symbol('specialMethod');\nconst obj = {\n\
  \  _id: 'kf12oi',\n  [specialMethod]() { // (A)\n    return this._id;\n  }\n};\n\
  assert.equal(obj[specialMethod](), 'kf12oi');\n```\n\nA 行中的方括号允许我们指定该方法必须具有 `specialMethod`\
  \ 键。更多细节请见 [§28.5.2 “计算属性键”]。\n\n### 22.2 公共符号\n\n在 ECMAScript 中起着特殊作用的符号被称为*公开符号*（publicly\
  \ known symbols）。示例包括：\n\n*   `Symbol.iterator`：使对象变为*可迭代的*。它是返回迭代器的方法的键。关于此主题的更多信息，请参阅\
  \ [§30 “同步迭代”]。\n*   `Symbol.hasInstance`：自定义 `instanceof` 的工作方式。如果对象实现了带有该键的方法，它就可以用于该运算符的右侧。例如：\n\
  \n```javascript\nconst PrimitiveNull = {\n  Symbol.hasInstance {\n    return x ===\
  \ null;\n  }\n};\nassert.equal(null instanceof PrimitiveNull, true);\n```\n\n* \
  \  `Symbol.toStringTag`：影响默认的 `.toString()` 方法。\n\n```javascript\n> String({})\n\
  '[object Object]'\n> String({ [Symbol.toStringTag]: 'is no money' })\n'[object is\
  \ no money]'\n```\n\n注意：通常重写 `.toString()` 更好。\n\n**练习：公开符号**\n\n*   `Symbol.toStringTag`:\
  \ `exercises/symbols/to_string_tag_test.mjs`\n*   `Symbol.hasInstance`: `exercises/symbols/has_instance_test.mjs`\n\
  \n## 22.3 符号符号\n\n将符号 `sym` 转换为另一种原始类型会发生什么？表 [14] 提供了答案。\n\n表 14：符号转换为其他原始类型的的结果。\n\
  \n| 转换为 | 显式转换 | 强制转换（隐式转换） |\n| --- | --- | --- |\n| boolean | `Boolean(sym)` `→`\
  \ OK | `!sym` `→` OK |\n| number | `Number(sym)` `→` `TypeError` | `sym*2` `→` `TypeError`\
  \ |\n| string | `String(sym)` `→` OK | `''+sym` `→` `TypeError` |\n|    | `sym.toString()`\
  \ `→` OK | `${sym}` `` `→` `TypeError` |\n\n符号的一个关键陷阱是将其转换为其他内容时抛出异常的频率。背后的逻辑是什么？首先，转换为数字没有任何意义，应该应该警告。其次，将符号转换为字符串对于诊断输出确实很有用。但警告无意中将符号转换为字符串（另一种类型的属性）也是有意义的：\n\
  \n```javascript\nconst obj = {};\nconst sym = Symbol();\nassert.throws(\n  () =>\
  \ { obj['__'+sym+'__'] = true },\n  { message: 'Cannot convert a Symbol to a string'\
  \ });\n```\n\n缺点是异常使得符号的操作变得复杂。在通过加运算符组合字符串时，必须显式转换符号：\n\n```javascript\n> const\
  \ mySymbol = Symbol('mySymbol');\n> 'Symbol used: ' + mySymbol\nTypeError: Cannot\
  \ convert a Symbol to a string\n> 'Symbol used: ' + String(mySymbol)\n'Symbol used:\
  \ Symbol(mySymbol)'\n```\n\n**测验** 查看 [quiz]。\n\n# 23 控制流语句\n\n* * *\n\n*   23.1\
  \ 控制流语句的条件\n*   23.2 控制循环：`break` 和 `continue`\n    *   23.2.1 `break`\n    *  \
  \ 23.2.2 `break` 加标签：离开任何标记语句\n    *   23.2.3 `continue`\n*   23.3 `if` 语句\n   \
  \ *   23.3.1 `if` 语句的语法\n*   23.4 `switch` 语句\n    *   23.4.1 `switch` 语句的第一个示例\n\
  \    *   23.4.2 别忘记 `return` 或 `break`！\n    *   23.4.3 空的分句\n\n\n\n\n\n## 23.4.4\
  \ 通过 `default` 子句检查非法值\n### 23.5 `while` 循环\n### 23.5.1 `while` 循环示例\n### 23.6 `do-while`\
  \ 循环\n### 23.7 `for` 循环\n### 23.7.1 `for` 循环示例\n### 23.8 `for-of` 循环\n### 23.8.1\
  \ `const`: `for-of` 对比 `for`\n### 23.8.2 遍历可迭代对象（iterables）\n### 23.8.3 遍历数组的 `[index,\
  \ element]` 数组\n### 23.9 `for-await-of` 循环\n## 23.10 `for-in` 循环（避免使用）\n\n本章涵盖了以下控制流语句：\n\
  \n* `if` 语句 (ES1)\n* `switch` 语句 (ES3)\n* `while` 循环 (ES1)\n* `do-while` 循环 (ES3)\n\
  * `for` 循环 (ES1)\n* `for-of` 循环 (ES6)\n* `for-await-of` 循环 (ES2018)\n* `for-in`\
  \ 循环 (ES1)\n\n在介绍实际的控制流语句之前，让我们来看两个控制循环的运算符。\n\n### 23.1 控制流语句的条件\n\n`if`、`while`\
  \ 和 `do-while` 具有在原则上是布尔值的条件。然而，条件只需要是 `truthy`（真值，强制转换为布尔值时为 `true`）即可被接受。换句话说，以下两个控制流语句等效的：\n\
  \n```\nif (value) {}\nif (Boolean(value) === true) {}\n```\n\n这是所有 `falsy`（假值）值的列表：\n\
  \n* `undefined`, `null`\n* `false`\n* `0`, `NaN`\n* `''`\n\n所有其他值均为真值。更多信息，请参阅 [§16.2\
  \ “Falsy and truthy values”]。\n\n### 23.2 控制循环：`break` 和 `continue`\n\n两个运算符 `break`\
  \ 和 `continue` 可用于在语句内部控制循环和其他语句。\n\n### 23.2.1 `break`\n\n`break` 有两个版本：一个带有操作数，另一个不带操作数。后者可以在以下语句中使用：`while`、`do-while`、`for`、`for-of`、`for-await-of`、`for-in`\
  \ 和 `switch`。它会立即离开当前语句：\n\n```\nfor (const x of ['a', 'b', 'c']) {\n  console.log(x);\n\
  \  if (x === 'b') break;\n  console.log('---')\n}\n// 输出:\n// 'a'\n// '---'\n//\
  \ 'b'\n```\n\n### 23.2.2 标签 `break`：离开任何标签语句\n\n带有操作数的 `break` 在任何地方均有效。其操作数是一个\
  \ `label`（标签）。标签可以放在任何语句之前，包括块。`break foo` 离开标签为 `foo` 的语句：\n\n```\nfoo: { // 标签\n\
  \  if (condition) break foo; // 标签 break\n}\n```\n\n在下面的示例中，我们使用带标签的 `break` 在成功时以不同的方式离开循环（A\
  \ 行）。然后我们跳过紧随循环之后的内容，那是我们在失败时会到达的地方。\n\n```javascript\nfunction findSuffix(stringArray,\
  \ suffix) {\n  let result;\n  search_block: {\n    for (const str of stringArray)\
  \ {\n      if (str.endsWith(suffix)) {\n        // 成功:\n        result = str;\n\
  \        break search_block; // (A)\n      }\n    } // for\n    // 失败:\n    result\
  \ = '(Untitled)';\n  } // search_block\n  return { suffix, result };\n// 等同于: {suffix,\
  \ result}\n}\nassert.deepEqual(\n  findSuffix(['foo.txt', 'bar.html'], '.html'),\n\
  \  { suffix: '.html', result: 'bar.html' }\n);\nassert.deepEqual(\n  findSuffix(['foo.txt',\
  \ 'bar.html'], '.mjs'),\n  { suffix: '.mjs', result: '(Untitled)' }\n);\n```\n\n\
  ### 23.2.3 `continue`\n\n`continue` 仅在 `while`、`do-while`、`for`、`for-of`、`for-await-of`\
  \ 和 `for-in` 内部有效。它会立即离开当前的循环迭代并继续下一次——例如：\n\n```\nconst lines = [\n  'Normal line',\n\
  \  '# Comment',\n  'Another normal line',\n];\nfor (const line of lines) {\n  if\
  \ (line.startsWith('#')) continue;\n  console.log(line);\n}\n// 输出:\n// 'Normal\
  \ line'\n// 'Another normal line'\n```\n\n### 23.3 `if` 语句\n\n这是两个简单的 `if` 语句：一个只有一个“then”分支，另一个同时包含“then”分支和“else”分支：\n\
  \n```\nif (cond) {\n  // then 分支\n}\nif (cond) {\n  // then 分支\n} else {\n  // else\
  \ 分支\n}\n```\n\n`else` 后面可以跟另一个 `if` 语句，而不是块：\n\n```\nif (cond) {\n  // then 分支\n\
  } else if (cond2) {\n  // else 分支\n}\n```\n\n到目前为止，`else` 一直是一个块，但它可以用分号终止：\n\n\
  ```\nif (true) console.log('Yes'); else console.log('No');\n```\n\n这意味着 `else if`\
  \ 并不是一个独立的构造结构；它仅仅是一个 `if` 语句。\n\n### 23.4 `switch` 语句\n\n`switch` 语句结构如下：\n\n```\n\
  switch (expression) {\n  body\n}\n```\n\n`switch` 的体由零或多个 `case` 子句组成：\n\n```\n\
  case expression:\n  statements\n```\n\n可选地，还有一个 `default` 子句：\n\n```\ndefault:\n\
  \  statements\n```\n\n`switch` 的执行过程如下：\n\n* 它评估 switch 表达式。\n* 它跳转到第一个表达式与 switch\
  \ 表达式结果相同的 `case` 子句。\n* 否则，如果没有这样的子句，则跳转到 `default` 子句。\n* 否则，如果没有 `default` 子句，则什么都不做。\n\
  \n### 23.4.1 `switch` 的第一个示例\n\n让我们来看一个例子：以下函数将数字 1–7 转换为星期几的名称。\n\n```javascript\n\
  function dayWeek(num) {\n  switch (num) {\n    case 1:\n      return 'Monday';\n\
  \    case 2:\n      return 'Tuesday';\n    case 3:\n      return 'Wednesday';\n\
  \    case 4:\n      return 'Thursday';\n    case 5:\n      return 'Friday';\n  \
  \  case 6:\n      return 'Saturday';\n    case 7:\n      return 'Sunday';\n  }\n\
  }\nassert.equal(dayWeek(5), 'Friday');\n```\n\n### 23.4.2 忘记使用 `return` 或 `break`！\n\
  \n在 `case` 子句的末尾，执行会继续到下一个 `case` 子句，除非你使用了 `return` 或 `break`——例如：\n\n```javascript\n\
  function englishToFrench(english) {\n  let french;\n  switch (english) {\n    case\
  \ 'hello':\n      french = 'bonjour';\n    case 'goodbye':\n      french = 'au revoir';\n\
  \  }\n  return french;\n}\n// 结果应该是 'bonjour'！\nassert.equal(englishToFrench('hello'),\
  \ 'au revoir');\n```\n\n\n\n\n也就是说，我们对 `dayOfTheWeek()` 的实现之所以有效是因为我们使用了 `return`。我们可以通过使用\
  \ `break` 来修复 `englishToFrench()`：\n\n```javascript\nfunction englishToFrench(english)\
  \ {\n  let french;\n  switch (english) {\n    case 'hello':\n      french = 'bonjour';\n\
  \      break;\n    case 'goodbye':\n      french = 'au revoir';\n      break;\n\
  \  }\n  return french;\n}\nassert.equal(englishToFrench('hello'), 'bonjour'); //\
  \ ok\n```\n\n### 23.4.3 空子句\n\ncase 子句的语句可以省略，这实际上允许我们在每个 case 子句中使用多个 case 表达式：\n\
  \n```javascript\nfunction isWeekDay(name) {\n  switch (name) {\n    case 'Monday':\n\
  \    case 'Tuesday':\n    case 'Wednesday':\n    case 'Thursday':\n    case 'Friday':\n\
  \      return true;\n    case 'Saturday':\n    case 'Sunday':\n      return false;\n\
  \  }\n}\nassert.equal(isWeekDay('Wednesday'), true);\nassert.equal(isWeekDay('Sunday'),\
  \ false);\n```\n\n### 23.4.4 通过 `default` 子句检查非法值\n\n如果 `switch` 表达式没有其他匹配项，则跳转到\
  \ `default` 子句。这使得它非常适用于错误检查：\n\n```javascript\nfunction isWeekDay(name) {\n  switch\
  \ (name) {\n    case 'Monday':\n    case 'Tuesday':\n    case 'Wednesday':\n   \
  \ case 'Thursday':\n    case 'Friday':\n      return true;\n    case 'Saturday':\n\
  \    case 'Sunday':\n      return false;\n    default:\n      throw new Error('Illegal\
  \ value: '+name);\n  }\n}\nassert.throws(\n  () => isWeekDay('January'),\n  {message:\
  \ 'Illegal value: January'});\n```\n\n**练习：`switch`**\n\n* `exercises/control-flow/number_to_month_test.mjs`\n\
  * 额外奖励：`exercises/control-flow/is_object_via_switch_test.mjs`\n\n## 23.5 while 循环\n\
  \n`while` 循环具有以下语法：\n\n```javascript\nwhile («condition\") {\n  «statements»\n}\n\
  ```\n\n在每次循环迭代之前，`while` 会评估 `condition`：\n\n* 如果结果为假（falsy），循环结束。\n* 如果结果为真（truthy），则再执行一次\
  \ `while` 体。\n\n### 23.5.1 while 循环示例\n\n以下代码使用了 `while` 循环。在每次循环迭代中，它通过 `.shift()`\
  \ 移除 `arr` 的第一个元素并将其打印。\n\n```javascript\nconst arr = ['a', 'b', 'c'];\nwhile (arr.length\
  \ > 0) {\n  const elem = arr.shift(); // 移除第一个元素\n  console.log(elem);\n}\n// 输出：\n\
  // 'a'\n// 'b'\n// 'c'\n```\n\n如果条件始终评估为 `true`，那么 `while` 就是一个无限循环：\n\n```javascript\n\
  while (true) {\n  if (Math.random() === 0) break;\n}\n```\n\n## 23.6 do-while 循环\n\
  \n`do-while` 循环的工作方式与 `while` 非常相似，但它是在每次循环迭代*之后*检查其条件，而不是之前。\n\n```javascript\n\
  let input;\ndo {\n  input = prompt('Enter text:');\n  console.log(input);\n} while\
  \ (input !== ':q');\n```\n\n`prompt()` (https://developer.mozilla.org/en-US/docs/Web/API/Window/prompt)\
  \ 是 浏览器中可用的全局函数。它提示用户输入文本并返回结果。\n\n## 23.7 for 循环\n\n`for` 循环具有以下语法：\n\n```javascript\n\
  for («initialization»; «condition»; «post_iteration») {\n  «statements»\n}\n```\n\
  \n第一行是循环的 `head`（头部），控制 `body`（循环的剩余部分）执行的频率。它包含三个部分，每个部分都是可选的：\n\n* `initialization`：为循环设置变量等。通过\
  \ `let` 或 `const` 声明的变量只存在循环内部。\n* `condition`：在每次迭代之前检查此条件。如果它为假，循环停止。\n* `post_iteration`：在每次循环迭代后执行代码。\n\
  \n因此，`for` 循环等于以下 `while` 循环：\n\n```javascript\n«initialization»\nwhile («condition»)\
  \ {\n  «statements»\n  «post_iteration»\n}\n```\n\n### 23.7.1 for 循环示例\n\n例如，这是如何通过\
  \ `for` 循环从零数到二：\n\n```javascript\nfor (let i=0; i<3; i++) {\n  console.log(i);\n\
  }\n// 输出：\n// 0\n// 1\n// 2\n```\n\n这是如何通过 `for` 循环打印 `Array` 的内容：\n\n```javascript\n\
  const arr = ['a', 'b', 'c'];\nfor (let i=0; i<arr.length; i++) {\n  console.log(arr[i]);\n\
  }\n// 输出：\n// 'a'\n// 'b'\n// 'c'\n```\n\n如果你省略了头部的所有三个部分，就会得到一个无限循环：\n\n```javascript\n\
  for (;;) {\n  if (Math.random() === 0) break;\n}\n```\n\n## 23.8 for-of 循环\n\n`for-of`\
  \ 循环遍历一个 `iterable`（可迭代对象）——一种支持迭代协议的数据容器。每次迭代的值都存储在头部指定的变量中：\n\n```javascript\n\
  for («iteration_variable» of «iterable») {\n  «statements»\n}\n```\n\n迭代变量通常通过声明创建：\n\
  \n```javascript\nconst iterable = ['hello', 'world'];\nfor (const elem of iterable)\
  \ {\n  console.log(elem);\n}\n// 输出：\n// 'hello'\n// 'world'\n```\n\n但你也可以使用一个已经存在的（可变的）变量：\n\
  \n```javascript\nconst iterable = ['hello', 'world'];\nlet elem;\nfor (elem of iterable)\
  \ {\n  console.log(elem);\n}\n```\n\n### 23.8.1 const: for-of vs. for\n\n注意，在 `for-of`\
  \ 循环中你可以使用 `const`。迭代变量对于每次迭代来说仍然是不同的（它在迭代期间不能改变）。将其想象为在每次新的作用域中都执行了一个新的 `const`\
  \ 声明。\n\n相比之下，在 `for` 循环中，如果值发生变化，你必须通过 `let` 或 `var` 声明变量。\n\n### 23.8.2 遍历可迭代对象\n\
  \n如前，`for-of` 适用于任何可迭代对象，而不仅仅是 `Arrays` —— 例如，`Sets`：\n\n```javascript\nconst set\
  \ = new Set(['hello', 'world']);\nfor (const elem of set) {\n  console.log(elem);\n\
  }\n```\n\n### 23.8.3 遍历数组的 [index, element] 对\n\n最后，你还可以使用 `for-of` 来遍历 `Arrays`\
  \ 的 `[index, element]` 条目：\n\n```javascript\nconst arr = ['a', 'b', 'c'];\nfor (const\
  \ [index, elem] of arr.entries()) {\n  console.log(`${index} -> ${elem}`);\n}\n\
  // 输出：\n// '0 -> a'\n// '1 -> b'\n// '2 -> c'\n```\n\n通过 `[index, element]`，我们正在使用解构来访问\
  \ `Array` 元素。\n\n**练习：for-of**\n\n`exercises/control-flow/array_to_string_test.mjs`\n\
  \n## 23.9 for-await-of 循环\n\n`for-await-of` 类似于 `for-of`，但它处理异步可迭代对象而不是同步对象。并且它只能在\
  \ `async` 函数和 `async` 生成器中使用。\n\n```javascript\nfor await (const item of asyncIterable)\
  \ {\n  // ···\n}\n```\n\n`for-await-of` 在异步迭代章节中有详细描述。\n\n## 23.10 for-in 循环（避免使用）\n\
  \n**建议：不要使用 for-in 循环**\n\n`for-in` 有若干个陷阱。因此，最好是避免使用它。\n\n这是一个正确使用 `for-in` 的示例，它涉及样板代码（行\
  \ A）：\n\n\n\n\n\n```javascript\nfunction getOwnPropertyNames(obj) {\n  const result\
  \ = [];\n  for (const key in obj) {\n    if ({}.hasOwnProperty.call(obj, key)) {\
  \ // (A)\n      result.push(key);\n    }\n  }\n  return result;\n}\nassert.deepEqual(\n\
  \  getOwnPropertyNames({ a: 1, b:2 }),\n  ['a', 'b']);\nassert.deepEqual(\n  getOwnPropertyNames(['a',\
  \ 'b']),\n  ['0', '1']); // strings!\n```\n\n我们可以不使用 `for-in` 来实现相同的功能，这通常是更好的：\n\
  \n```javascript\nfunction getOwnPropertyNames(obj) {\n  const result = [];\n  for\
  \ (const key of Object.keys(obj)) {\n    result.push(key);\n  }\n  return result;\n\
  }\n```\n\n![](img/file7.svg) **测试**\n\n查看测试应用。\n\n# 24 异常处理\n\n* 24.1 动机：抛出和捕获异常\n\
