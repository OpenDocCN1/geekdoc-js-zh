  * `SyntaxError`: 表示发生了解析错误。\n* `TypeError`: 用于表示操作未成功，且当没有其他 `NativeError` 对象能作为对失败原因的合适指示时使用。\n\
  * `URIError`: 表示其中一个全局 URI 处理函数的使用方式与其定义不兼容。\n\n### 24.4.1 错误对象的属性\n\n考虑 `Error`\
  \ 的一个实例 `err`：\n\n```javascript\n[](#cb458-1)const err = new Error('Hello!');\n\
  [](#cb458-2)assert.equal(String(err), 'Error: Hello!');\n```\n\n`err` 的两个属性 特别有用：\n\
  \n* `.message`: 仅包含错误信息。\n\n  ```javascript\n  [](#cb459-1)assert.equal(err.message,\
  \ 'Hello!');\n  ```\n\n* `.stack`: 包含堆栈跟踪。所有主流浏览器都支持它。\n\n  ```javascript\n  [](#cb460-1)assert.equal(\n\
  \  [](#cb460-2)err.stack,\n  [](#cb460-3)`\n  [](#cb460-4)Error: Hello!\n  [](#cb460-5)\
