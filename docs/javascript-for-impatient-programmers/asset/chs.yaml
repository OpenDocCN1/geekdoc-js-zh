  \n\n\n\nJSON 规范由 Douglas Crockford 于 2001 年发布在 [`json.org`](http://json.org/) 上。他解释道：\n\
  \n> 我发现了 JSON。我不声称自己发明了 JSON，因为它在自然界中已经存在。我所做的是发现了它，为它命名，并描述了它的用处。我不声称自己是第一个发现它的人；我知道在我发现它至少一年之前就有其他人发现了它。我发现的最早出现情况是，Netscape\
  \ 的某人早在 1996 年就在使用 JavaScript 数组字面量进行数据通信了，这至少比我偶然产生这个想法至少早了五年。\n\n后来，JSON 被标准化为\
  \ [ECMA-404](https://www.ecma-international.org/publications/standards/Ecma-404.htm)：\n\
  \n* 第一版：2013 年 10 月\n* 第二版：2017 年 12 月\n\n#### 45.1.1 JSON 的语法是固定的\n\n引用 ECMA-404\
  \ 标准：\n\n> 因为它非常简单，预计 JSON 语法永远不会改变。这为 JSON 作为一种基础表示法提供了巨大的稳定性。\n\n因此，JSON 永远不会引入诸如可选的尾逗号、注释或未引号键等改进——无论它们是否被认为是必要的。然而，这为创建编译为纯\
  \ JSON 的 JSON 超集留下了空间。\n\n#### 45.2 JSON 语法\n\nJSON 由 JavaScript 的以下部分组成：\n\n* 复合类型（Compound）：\n\
  \    * 对象字面量：\n        * 属性键是双引号字符串。\n        * 属性值是 JSON 值。\n        * 不允许尾逗号。\n\
  \    * 数组字面量：\n        * 元素是 JSON 值。\n        * 不允许空隙或尾逗号。\n* 原子类型（Atomic）：\n  \
  \  * `null`（但不包含 `undefined`）\n    * 布尔值\n    * 数字（排除 `NaN`、`+Infinity`、`-Infinity`）\
  \    * 字符串（必须双引号）\n\n因此，你无法在 JSON 中（直接）表示循环结构。\n\n#### 45.3 使用 `JSON` API\n\n全局命名空间对象\
  \ `JSON` 包含了处理 JSON 数据的方法。\n\n##### 45.3.1 `JSON.stringify(data, replacer?, space?)`\n\
  \n`.stringify()` 将 JavaScript `data` 转换为 JSON 字符串。在本节中，我们忽略参数 `replacer`；它在 §45.4\
  \ “自定义字符串化和解析” 中进行了解释。\n\n###### 45.3.1.1 结果：单行文本\n\n如果你只提供第一个参数，`.stringify()`\
  \ 返回单行文本：\n\n```\n[](#cb1217-1)assert.equal(\n[](#cb1217-2)  JSON.stringify({foo:\
  \ ['a', 'b']}),\n[](#cb1217-3)  '{\"foo\":[\"a\",\"b\"]}' );\n```\n\n###### 45.3.1.2\
  \ 结果：缩进行的树\n\n如果你为 `space` 提供一个非负整数，则 `.stringify()` 返回一个或多行，并根据每层嵌套按 `space` 个的数进行缩进：\n\
  \n```\n[](#cb1218-1)assert.equal(\n[](#cb1218-2)JSON.stringify({foo: ['a', 'b']},\
  \ null, 2),\n[](#cb1218-3)`{\n[](#cb1218-4) \"foo\": \n[ \"a\",\n[](#cb1218-6) \"\
  b\"\n[](#cb1218-7) ]\n[](#cb1218-8)}`);\n```\n\n###### 45.3.1.3 关于 JavaScript 数据如何字符串化的细节\n\
  \n**原始值（Primitive values）：**\n\n* 支持的原始值将按预期进行字符串化：\n\n```\n> JSON.stringify('abc')\n\
  '\"abc\"'\n> JSON.stringify(123)\n'123'\n> JSON.stringify(null)\n'null'\n```\n\n\
  * 不支持的数字：`'null'`\n\n```\n> JSON.stringify(NaN)\n'null'\n> JSON.stringify(Infinity)\n\
  'null'\n```\n\n* 其他不支持的原始类型值不会被字符串化；它们产生结果 `undefined`：\n\n```\n> JSON.stringify(undefined)\n\
  undefined\n> JSON.stringify(Symbol())\nundefined\n```\n\n**对象（Objects）：**\n\n* 如果对象有一个方法\
  \ `.toJSON()`，则该方法的结果将被进行字符串化：\n\n```\n> JSON.stringify({toJSON() {return true}})\n\
  'true'\n```\n\n日期有一个返回字符串的 `.toJSON()` 方法：\n\n```\n> JSON.stringify(new Date(2999,\
  \ 11, 31))\n'\"2999-12-30T23:00:00.000Z\"'\n```\n\n* 包装（Wrapped）原始值将被解包并进行字符串化：\n\
  \n```\n> JSON.stringify(new Boolean(true))\n'true'\n> JSON.stringify(new Number(123))\n\
  '123'\n```\n\n* 数组被字符串化为数组字面量。不支持的数组元素将像 `null` 一样被字符串化：\n\n```\n> JSON.stringify([undefined,\
  \ 123, Symbol()])\n'[null,123,null]'\n```\n\n* 除了函数外，所有其他对象都会被字符串化为对象字面量。具有不支持值的属性将被忽略：\n\
  \n```\n> JSON.stringify({a: Symbol(), b: true})\n'{\"b\":true}'\n```\n\n* 函数不会被字符串化：\n\
  \n```\n> JSON.stringify(() => {})\nundefined\n```\n\n##### 45.3.2 `JSON.parse(text,\
  \ reviver?)`\n\n`.parse()` 将 JSON `text` 转换为 JavaScript 值。在本节中，我们忽略参数 `reviver`；它在\
  \ §45.4 “自定义字符串化和解析” 中进行了解释。\n\n这是一个使用 `.parse()` 的示例：\n\n```\n> JSON.parse('{\"\
  foo\":[\"a\",\"b\"]}')\n{ foo: [ 'a', 'b' ] }\n```\n\n##### 45.3.3 示例：在 JSON 之间转换\n\
  \n以下类实现了从 JSON（行 A）和到 JSON（行 B）的转换。\n\n```\n[](#cb1229-1)class Point {\n[](#cb1229-2)\
  \  static fromJson(jsonObj) { // (A)\n[](#cb1229-3)    return new Point(jsonObj.x,\
  \ jsonObj.y);\n[](#cb1229-4)  }\n[](#cb1229-5)\n[](#cb1229-6)  constructor(x, y)\
  \ {\n[](#cb1229-7)    this.x = x;\n[](#cb1229-8)    this.y = y;\n[](#cb1229-9) \
  \ }\n[](#cb1229-10) \n[](#cb1229-11)  toJSON() { // (B)\n[](#cb1229-12)    return\
  \ {x: this.x, y: this.y};\n[](#cb1229-13)  }\n[](#cb1229-14)}\n```\n\n* 将 JSON 转换为点：我们使用静态方法\
  \ `Point.fromJson()` 解析 JSON 并创建 `Point` 的实例。\n\n```\n[](#cb1230-1)assert.deepEqual(\n\
  [](#cb1230-2)  Point.fromJson(JSON.parse('{\"x\":3,\"y\":5}')),\n[](#cb1230-3) \
  \ new Point(3, 5) );\n```\n\n* 将点转换为 JSON：`JSON.stringify()` 在内部调用了之前提到的方法 `.toJSON()`。\n\
  \n```\n[](#cb1231-1)assert.equal(\n[](#cb1231-2)  JSON.stringify(new Point(3, 5)),\n\
  [](#cb1231-3)  '{\"x\":3,\"y\":5}' );\n```\n\n![](img/file6.svg) **练习：将对象转换为 JSON**\
  \ \n\n`exercises/json/to_from_test.mjs`\n\n#### 45.4 自定义字符串化和解析（高级）\n\n字符串化和解析可以按如下方式自定义：\n\
  \n* `JSON.stringify(data, replacer?, space?)`\n\n    可选参数 `replacer` 包含：\n\n   \
  \ * 一个包含属性名称的数组。如果 `data` 中的某个值被字符串化为对象字面量，则只考虑这些属性。其他属性均被忽略。\n\n    * 一个值访问者（value\
  \ visitor），一个在字符串化之前转换 JavaScript 数据函数。\n\n* `JSON.parse(text, reviver?)`\n\n  \
  \  可选参数 `reviver` 包含一个值访问者，可以在返回解析 JSON 之前对其转换。\n\n###### 45.4.1 `.stringify()`：指定要字符串化的对象属性\n\
  \n如果 `.stringify()` 的第二个参数是数组，则只有其中提到的对象属性会被包含在结果中：\n\n```\n[](#cb1232-1)const obj\
  \ = {\n[](#cb1232-2)  a: 1,\n[](#cb1232-3)  b: {\n[](#cb1232-4)    c: 2,\n[](#cb1232-5)\
  \    d: 3,\n[](#cb1232-6)  }\n[](#cb1232-7)};\n[](#cb1232-8)assert.equal(\n[](#cb1232-9)\
  \  JSON.stringify(obj, ['b', 'c']),\n[](#cb1232-10)  '{\"b\":{\"c\":2}}');\n```\n\
  \n###### 45.4.2 `.stringify()` 和 `.parse()`：值访问者\n\n我所说的*值访问者*是一个转换 JavaScript 数据的函数：\n\
  \n* `JSON.stringify()` 允许参数 `replacer` 中的值访问者在字符串化之前转换 JavaScript 数据。\n\n* `JSON.parse()`\
  \ 允许参数 `reviver` 中的值访问者在返回解析后的 JavaScript 数据之前对其进行转换。\n\n\n\n\n\n在本节中，JavaScript\
  \ 数据被视为一棵值树。如果数据是原子的，它就是一个只有一个根节点的树。树中的所有值都会被逐个传递给值访问者（value visitor）。根据访问者返回的内容，当前值会被省略、更改或保留。\n\
  \n值访问者具有以下类型签名：\n\n```\ntype ValueVisitor = (key: string, value: any) => any;\n\
  ```\n\n参数为：\n\n*   `value`: 当前值。\n*   `this`: 当前值的父节点。根值 `r` 的父节点是 `{'': r}`。\n\
  \    *   注意：`this` 是一个隐式参数，且仅当值访问者是普通函数时才可用。\n\n*   `key`: 当前值在其父节点中的键名或索引。根值的键为\
  \ `''`。\n\n值访问者可以返回：\n\n*   `value`：意味着不会任何变化。\n*   一个不同的值 `x`：导致输出树中的 `value` 被替换为\
  \ `x`。\n*   `undefined`：导致 `value` 在输出树中被省略。\n\n### 45.4.3 示例：访问值\n\n以下代码展示了值访问者看到值的顺序：\n\
  \n```javascript\nconst log = [];\nfunction valueVisitor(key, value) {\n  log.push({this:\
  \ this, key, value});\n  return value; // no change\n}\n\nconst root = {\n  a: 1,\n\
  \  b: {\n    c: 2,\n    d: 3,\n  }\n};\nJSON.stringify(root, valueVisitor);\nassert.deepEqual(log,\
  \ [\n  { this: { '': root }, key: '',  value: root },\n  { this: root        , key:\
  \ 'a', value: 1 },\n  { this: root        , key: 'b', value: root.b },\n  { this:\
  \ root.b      , key: 'c', value: 2 },\n  { this: root.b      , key: 'd', value:\
  \ 3 },\n]);\n```\n\n我们可以看到，`JSON.stringify()` 的替换器（replacer）是自上向下访问值的（先根节点，后叶子节点）。这种方向的原因是我们正在将\
  \ JavaScript 值转换为 JSON 值。单个 JavaScript 对象可能会展开成一棵兼容 JSON 的值树。相比之下，`JSON.parse()`\
  \ 的还原器（reviver）是自下向上访问值的（先叶子节点，后根节点）。这种方向的原因是我们正在将 JSON 值组装成 JavaScript 值。因此，我们需要在转换整体之前先转换各个部分。\n\
  \n### 45.4.4 示例：值的字符串化\n\n`JSON.stringify()` 对表达式对象没有特殊支持——它会像处理普通对象一样对它们进行字符串化：\n\
  \n```javascript\nconst obj = {\n  name: 'abc',\n  regex: /abc/ui\n};\nassert.equal(\n\
  \  JSON.stringify(obj),\n  '{\"name\":\"abc\",\"regex\":{}}'\n);\n```\n\n我们可以通过替换器来修复这个问题：\n\
  \n```javascript\nfunction replacer(key, value) {\n  if (value instanceof RegExp)\
  \ {\n    return {\n      __type__: 'RegExp',\n      source: value.source,\n    \
  \  flags: value.flags,\n    };\n  } else {\n    return value; // no change\n  }\n\
  }\nassert.equal(\n  JSON.stringify(obj, replacer, 2),\n  `{\n    \"name\": \"abc\"\
  ,\n    \"regex\": {\n      \"__type__\": \"RegExp\",\n      \"source\": \"abc\"\
  ,\n      \"flags\": \"iu\"\n    }\n  }`\n);\n```\n\n### 45.4.5 示例：值的解析\n\n为了 `JSON.parse()`\
  \ 上一节的结果，我们需要一个还原器：\n\n```javascript\nfunction reviver(key, value) {\n  // 非常简单的检查\n\
  \  if (value && value.__type__ === 'RegExp') {\n    return new RegExp(value.source,\
  \ value.flags);\n  } else {\n    return value;\n  }\n}\nconst str = `{\n  \"name\"\
  : \"abc\",\n  \"regex\": {\n    \"__type__\": \"RegExp\",\n    \"source\": \"abc\"\
  ,\n    \"flags\": \"iu\"\n  }\n}`;\nassert.deepEqual(\n  JSON.parse(str, reviver),\n\
  \  {\n    name: 'abc',\n    regex: /abc/ui,\n  }\n);\n```\n\n## 45.5 FAQ\n\n###\
  \ 45.5.1 为什么 JSON 不支持注释？\n\nDouglas Crockford 在 [2012 年 5 月 1 日的一篇 Google+ 帖子中](https://web.archive.org/web/20190308024153/https://plus.google.com/+DouglasCrockfordEsq/posts/RK8qyGVaGSr)\
  \ 解释了原因：\n\n> 我移除 JSON 中的注释是因为我看到人们正利用它们来存放解析指令，这种做法会破坏互操作性。我知道注释的缺失让有些人感到难过，但不应该这样。\n\
  \n> 假设你正在使用 JSON 来存储配置文件，并且你想对其进行注释。尽管去插入你喜欢的任何注释吧。在交给你的 JSON 解析器之前，先通过 JSMin（一个\
  \ JavaScript 压缩工具）处理一下即可。\n\n# 46 下一步：Web 开发概述（额外内容）\n\n* * *\n\n*   46.1 避免感到压力的小技巧\n\
  *   46.2 Web 开发值得学习的内容\n\n\n\n\n\n以下是 Web 开发中值得学习的几点：\n\n*   浏览器 API，例如 `Document\
  \ Object Model` (`DOM`)，它是浏览器在内存中对 HTML 的表示。它们是任何前端开发的基础。\n\n*   与 JavaScript 相关的技术，如\
  \ HTML 和 CSS。\n\n*   前端框架：当你开始 Web 开发时，在不使用任何库的情况下编写用户界面会很有启发性。一旦你感到更有信心，前端框架会让很多事情变得简单，特别是对于大型应用程序。流行的框架包括\
  \ `React`、`Angular`、`Vue`、`Ember` 和 `Svelte`。\n\n*   `Node.js` 是最流行的服务端 JavaScript\
  \ 平台。但它也允许你在命令行中运行 JavaScript。大多数与 JavaScript 相关的工具（甚至是编译器！）都是基于 `Node.js` 的 JavaScript\
  \ 实现的，并通过 `npm` 安装。学习 `Node.js` 的良好方法是使用它来编写 Shell 脚本。\n\n*   JavaScript 工具链：现代\
  \ Web 开发涉及许多工具。在本章的后后部分，将对当前的工具生态系统进行概述。\n\n*   渐进式 Web 应用（Progressive web apps）：渐进式\
  \ Web 应用背后的核心思想是为 Web 应用提供传统上只有原生应用才具有的功能——例如：移动和桌面操作系统上的原生安装；离线运行；向用户显示通知。Google\
  \ 发布了一个[清单](https://developers.google.com/web/progressive-web-apps/checklist)，详细说明了什么特性使一个\
  \ Web 应用具有“渐进性”。其最低要求是：\n\n    *   应用必须通过 `HTTPS` 提供服务（而不是不安全的 `HTTP`）。\n\n    *\
  \   应用必须有一个 `Web App Manifest 文件`，指定应用名称和图标等元数据（通常有多个分辨率）。还必须存在图标文件。\n\n    *  \
  \ 应用必须有一个 `service worker`：它是应用程序的基础层，运行在后台，位于独立的进程中（独立于 Web 页面）。它的职责之一是在没有网络连接时保持应用程序正常运行。其中，有两个机制可以帮助它实现这一点：它是一个本地代理，监控应用程序的所有\
  \ Web 资源请求；它还可以访问浏览器缓存。因此，在最初缓存了所有关键资源后，它可以在应用程序离线时使用缓存来满足请求。`service worker` 的其他功能包括在后台同步数据；接收服务器发送的推送消息；以及上述的向用户显示通知。\n\
  \n学习 Web 开发（包括及超出 JavaScript ）的一个良好资源是 [MDN Web Docs](https://developer.mozilla.org/en-US/docs/Learn)。\n\
  \n### 46.2.1 关注 WebAssembly (Wasm)!\n\n[WebAssembly](https://webassembly.org) 是一个构建在大多数\
  \ JavaScript 引擎中的通用虚拟机。你将获得以下的工作分配：\n\n*   JavaScript 用于动态、高级别的代码。\n\n*   WebAssembly\
  \ 用于静态、低级别的代码。\n\n对于静态代码，`WebAssembly` 速度非常快：`C/C++` 代码编译为 `WebAssembly` 后，其速度大约是编译为原生（[源码](https://arxiv.org/abs/1901.09056)）代码的\
  \ 50%。用例包括支持新的视频格式、机器学习、游戏等。\n\n`WebAssembly` 作为各种语言的编译目标效果良好。这意味着 JavaScript 将被编译为\
  \ `WebAssembly` 或被另一种语言取代吗？\n\n#### 46.2.1.1 JavaScript 会编译为 WebAssembly 吗？\n\n\
  JavaScript 引擎对 JavaScript 的高度动态特性进行了许多优化。如果你想将 JavaScript 编译为 `WebAssembly`，你必须在\
  \ `WebAssembly` 之上实现这些优化。结果将比当前的引擎慢，并且具有相似的代码库。因此，你不会从中获得任何收益。\n\n#### 46.2.1.2\
  \ JavaScript 会被另一种语言取代吗？\n\n`WebAssembly` 意味着 JavaScript 即将被另一种语言取代吗？`WebAssembly`\
  \ 确实让在 浏览器中支持 JavaScript 以外的语言变得更容易。但这些语言在该平台上面临许多挑战：\n\n*   所有的浏览器 API 都基于 JavaScript。\n\
  \n*   其他语言的运行时（标准库等）会产生额外的内存开销，而 JavaScript 的运行时已经内置在 Web 浏览器中了。\n\n*   JavaScript\
  \ 广为人知，拥有许多库和工具等。\n\n此外，`WebAssembly` 生态系统的许多部分（例如调试）仍在进行中。\n\n对于动态代码，JavaScript\
  \ 相对较快。因此，在可预见的未来，它可能仍然是高级代码最流行的选择。对于低级代码，将更多静态语言（如 `Rust`）编译为 `WebAssembly` 是一个有趣的选项。\n\
  \n鉴于它仅仅是一个虚拟机，关于 `WebAssembly` 实际相关的知识并不多。但值得关注它在 Web 开发中不断演变的角色。它作为一种独立的虚拟机也变得流行；例如受到\
  \ [WebAssembly System Interface](https://github.com/WebAssembly/WASI)的支持。\n\n##\
  \ 46.3 示例：基于工具的 JavaScript 工作流\n\n![](img/file41.svg)\n\n图 32：一个经典的、非常简单的 Web 应用：一个\
  \ HTML 文件引用一个 JavaScript 文件 `code.js`，后者赋予前者交互性。`code.js` 使用库 `library.js`，该库也必须由\
  \ HTML 文件加载。\n\n图. 32 描绘了一个经典的 Web 应用——当时 Web 开发还不那么复杂（既有好处，也有坏端）：\n\n*   `index.html`\
  \ 包含在 Web 浏览器中打开的 HTML 文件。\n\n*   `code.js` 包含 `index.html` 加载并使用的 JavaScript 代码。\n\
  \n*   该代码依赖于库 `library.js`，这是一个手动下载并放在 `code.js` 旁的文件。它通过全局变量访问。注意，HTML 文件需要为 `code.js`\
  \ 加载依赖 `library.js`。`code.js` 无法自己做到这一点。\n\n从那时起，JavaScript 工作流变得更加复杂。图 33 显示了这样的工作流——一种基于\
  \ JavaScript 打包器 `webpack` 的流。\n\n![](img/file42.svg)\n\n图 33：这是使用打包器 `webpack`\
  \ 开发 Web 应用时的工作流。我们的 Web 应用由多个模块组成。我们告诉 `webpack` 从哪一个开始执行（所谓的“入口点”）。然后它分析入口点的导入、导入的导入等，以确定运行应用程序需要哪些代码。所有这些代码都被放在一个的脚本文件中。\n\
  \n让我们检查涉及此工作流的各个部分（数据、工具、技术）：\n\n*   应用程序本身由多个用 `TypeScript` 编写的模块组成——`TypeScript`\
  \ 是 JavaScript 的静态类型超集。每个文件都是一个 ECMAScript 模块，加上静态类型注解。\n\n*   应用程序使用的库现在通过 npm\
  \ 包管理器 下载并安装。它还透明地处理`传递性依赖`——如果此包依赖于其他包等。\n\n*   所有 `TypeScript` 文件都通过 `loader`（`webpack`\
  \ 的一个插件）编译为纯 JS。\n\n*   工具 `webpack` 将所有纯 JavaScript 文件合并成单个 JavaScript 脚本文件。这个过程被称为“打包”（bundling）。打包有两个原因：\n\
  \n    *   在 Web 浏览器中，下载单个文件通常更快。\n\n    *   在打包期间，可以进行各种优化，例如剔除未使用的代码。\n\n基本结构仍然相同：HTML\
  \ 文件通过 `<script>` 元素加载 JavaScript 脚本文件。但是：\n\n*   代码现在是模块化的，而无需 HTML 文件知道各个模块。\n\
  \n*   `bundle.js` 只包含运行应用程序所需的代码（而不是整个 `library.js`）。\n\n*   我们使用包管理器来安装代码所依赖的库。\n\
  \n*   这些库不再通过全局变量访问，而是通过 ES 模块规范符访问。\n\n在现代浏览器中，你还可以将包以模块的形式交付（而不是作为脚本文件）。\n\n\n\
  \n\n\n# 46.4 JavaScript 工具概览\n\n现在我们已经看到了一种工作流，让我们来看看 JavaScript 世界中流行的各种类工具。你将看到工具的类别以及许多特定工具的名称。前者要重要得多。随着工具的流行和过时，名称会发生变化，但我想让你们至少看到其中一些。\n\
  \n## 46.4.1 构建（Building）：从你编写的 JavaScript 到你部署的 JavaScript\n\n`Building` JavaScript\
  \ 意味着将你编写的 JavaScript 转换成你最终可以部署的 JavaScript。以下工具通常会涉及到这个过程：\n\n*   **转译器 (Transpilers)**：转译器是一种将源代码编译为源代码的编译器。JavaScript\
  \ 社区中流行的两种转译器有：\n    *   `Babel` 将即将发布和现代的 JavaScript 特性编译为语言的老版本。这意味着你可以在代码中使用新特性，仍然可以在旧版浏览器上运行它。\n\
  \    *   `TypeScript` 是 JavaScript 的超集。简单来说，它是 JavaScript 的最新版本加上静态类型检查。\n\n*  \
  \ **压缩器 (Minifiers)**：压缩器将 JavaScript 编译为等效的更小的（即字符更少的）JavaScript。它通过重命名变量、移除注释、移除空白等等来实现。\n\
  \n    例如，给定以下输入：\n\n    ```\n    let numberOfOccurrences = 5;\n    if (Math.random())\
  \ {\n      // Math.random() is not zero\n      numberOfOccurrences++\n    }\n  \
  \  ```\n\n    压缩器可能会产生：\n\n    ```javascript\n    let a=5;Math.random()&&a++;\n\
  \    ```\n\n    *   流行的压缩器包括：[UglifyJS](http://lisperator.net/uglifyjs/), [babel-minify](https://github.com/babel/minify),\
  \ [Terser](https://github.com/terser-js/terser) 以及 [Closure Compiler](https://developers.google.com/closure/compiler/)。\n\
  \n*   **打包器 (Bundlers)**：编译并优化 JavaScript 应用的代码。打包器的输入是许多文件——整个应用程序的所有代码加上它使用的库。打包器合并这些输入文件以生成较少的输出文件（[这往往能提高性能](https://medium.com/@asyncmax/the-right-way-to-bundle-your-assets-for-faster-sites-over-http-2-437c37efe3ff)）。\n\
  \n    打包器通过如 `tree-shaking` 等技术最小化其输出尺寸。Tree-shaking 是一种死代码消除的形式：只有那些在某些地方导入的模块导出（考虑所有代码并包括间接导入）会被放入输出中。\n\
  \n    在打包时执行转译和压缩等编译步骤也是常见的。在这种情况下，打包器依赖于之前提到的以库形式存在的工具。\n\n    *   流行的打包器包括 `webpack`,\
  \ `browserify`, `Rollup` 和 `Parcel`。\n\n所有这些工具和构建步骤通常通过所谓的`任务运行器 (task runners)`（想想\
  \ Unix 中的“make”）进行协调。它们有：\n\n*   专门的任务运行器：`grunt`, `gulp`, `broccoli` 等。\n*   可以作为简单任务运行器的工具：`npm`（通过其“scripts”）和\
  \ `webpack`（通过插件）。\n\n## 46.4.2 静态备检查 (Static checking)\n\n`Static checking` 意味着`静态`地（在不运行的情况下）分析源代码。它可以用于检测各种问题。工具包括：\n\
  \n*   **Linter (Linters)**：检查源代码中的问题模式、未使用变量等。如果你仍在学习这种语言，Linter 特别有用，因为它们会指出你是否做错了什么。\n\
  \    *   流行的 Linter 包括 `JSLint`, `JSHint`, `ESLint`\n*   **代码风格检查器 (Code style checkers)**：检查代码格式是否正确。它们考虑缩进、括号后的空格、逗号后的空格等。\n\
  \    *   示例：`JSCS` (JavaScript 代码风格检查器)\n*   **代码格式化工具 (Code formatters)**：根据你可以自定义的规则自动为你格式化代码。\n\
  \    *   示例：`Prettier`\n*   **类型检查器 (Type checkers)**：为 JavaScript 添加静态类型检查。\n \
  \   *   流行的类型检查器：`TypeScript`（它也是一种转译器），`Flow`。\n\n## 46.4.3 测试 (Testing)\n\nJavaScript\
  \ 有许多测试框架——例如：\n\n*   单元测试：`Jasmine`, `Mocha`, `AVA`, `Jest`, `Karma` 等。\n*   集成测试：`Jenkins`,\
  \ `Travis CI` 等。\n*   用户界面测试：`CasperJS`, `Protractor`, `Nightwatch.js`, `TestCafé`\
  \ 等。\n\n## 46.4.4 包管理器 (Package managers)\n\nJavaScript 最流行的包管理器是 `npm`。它最初是 Node.js\
  \ 的包管理器，但从那时也成为客户端 Web 开发和任何类型工具的主流。\n\n有 `npm` 的替代方案，但它们都以不同的方式基于 `npm` 的软件注册表：\n\
  \n*   [Yarn](https://yarnpkg.com/en/) 是对 `npm` 的不同实现；它开创的一些特性现在也被 `npm` 支持。\n* \
  \  [pnpm](https://github.com/pnpm/pnpm) 专注于在本地安装包时节省空间。\n\n## 46.4.5 库 (Libraries)\n\
  \n*   各种辅助函数：`lodash`（最初基于 `Underscore.js` 库）是最流行的通用库之一。\n*   数据结构：\n    *   [Immutable.js](https://github.com/immutable/js)\
  \ 提供了不可变数据。\n    *   [Immer](https://github.com/immerjs/immer) 允许你使用草稿语法处理不可变状态。\n\
  *   国际化：\n    *   使用了[`Intl`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Global_Objects/Intl)\
  \ API。\n*   实现服务的实现：\n    *   `REST` (表现层状态转移)。\n    *   [GraphQL](https://graphql.org/)\
  \ 查询语言。\n\n## 46.5 与 JavaScript 无关工具\n\n考虑到 JavaScript 只是产物之一：\n\n*   **CSS**：\n\
  \    *   `压缩器 (Minifiers)`：减小 CSS 尺寸。\n    *   `处理器 (Preprocessors)`：让你编写 CSS。\n\
  \    *   `框架 (Frameworks)`：提供布局。\n*   **图像**：自动优化图像。\n\n# 47 索引\n\n（注：原文中的索引部分似乎只是运算符和符号的列表，它们已经按照规则进行了格式化。）\n\
