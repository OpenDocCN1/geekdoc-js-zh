  \ 迭代和循环\n    * 33.5.5 本节来源\n* 33.6 常见: Maps\n    * 33.6.1 我什么时候应该用 Map，什么时候应该用对象？\n\
  \    * 33.6.2 我什么时候会 Map 对象作为 Map 的键？\n    * 33.6.3 为什么 Maps 保持条目的插入顺序？\n    * 33.6.4\
  \ 为什么 Maps 有 `.size`，而 Arrays 有 `.length`？\n* *\n\n在 ES6 之前，JavaScript 还没有用于字典的数据结构，并且（滥用）了对象来实现从字符串到任意值的映射。ES6\
  \ 引入了 `Maps`，它是从任意值到任意值的字典结构。\n\n### 33.1 使用 Maps\n\n`Map` 实例将键映射到值。单个键值映射被称为 `entry`（条目）。\n\
  \n### 33.1.1 创建 Maps\n\n创建 `Maps` 有三种常用方法。\n\n首先，你可以使用不带任何参数的构造函数创建一个空的 `Map`：\n\
  \n```\nconst emptyMap = new Map();\nassert.equal(emptyMap.size, 0);\n```\n\n其次，你可以将一个包含键值“对”（具有两个元素的数组）的可迭代对象传递给构造函数：\n\
  \n```\nconst map = new Map([\n  [1, 'one'],\n  [2, 'two'],\n  [3, 'three'], // 尾随逗号会被忽略\n\
  ]);\n```\n\n第三，`.set()` 方法向 `Map` 中添加条目，并且可以链式调用：\n\n```\nconst map = new Map()\n\
  \  .set(1, 'one')\n  .set(2, 'two')\n  .set(3, 'three');\n```\n\n### 33.1.2 复制 Maps\n\
  \n正如我们之后将看到的，`Maps` 也是关于键值对的可迭代对象。因此，你可以使用构造函数创建一个 `Map` 的拷贝。该拷贝是**浅拷贝**：键和值是相同的；它们不会被复制。\n\
  \n```\nconst original = new Map()\n  .set(false, 'no')\n  .set(true, 'yes');\nconst\
  \ copy = new Map(original);\nassert.deepEqual(original, copy);\n```\n\n### 33.1.3\
  \ 处理条目\n\n`.set()` 和 `.get()` 用于写入和读取值（给定键）。\n\n```\nconst map = new Map();\nmap.set('foo',\
  \ 123);\nassert.equal(map.get('foo'), 123);\n// 未知键：\nassert.equal(map.get('bar'),\
  \ undefined);\n// 条目缺失时使用默认值：\nassert.equal(map.get('bar'), '');\n```\n\n`.has()`\
  \ 检查 `Map` 是否具有给定键的条目。`.delete()` 删除条目。\n\n```\nconst map = new Map([['foo', 123]]);\n\
  assert.equal(map.has('foo'), true);\nassert.equal(map.delete('foo'), true);\nassert.equal(map.has('foo'),\
  \ false);\n```\n\n### 33.1.4 确定 Map 的大小并清空它\n\n`.size` 包含 `Map` 中的条数目。`.clear()`\
  \ 移除 `Map` 的所有条目。\n\n```\nconst map = new Map()\n  .set('foo', true)\n  .set('bar',\
  \ false);\nassert.equal(map.size, 2);\nmap.clear();\nassert.equal(map.size, 0);\n\
  ```\n\n### 33.1.5 获取 Map 的键和值\n\n`.keys()` 返回关于 `Map` 键的可迭代对象：\n\n```\nconst map\
  \ = new Map()\n  .set(false, 'no')\n  .set(true, 'yes');\nfor (const key of map.keys())\
  \ {\n  console.log(key);\n}\n// 输出：\n// false\n// true\n```\n\n我们可以使用展开 (`...`)\
  \ 将 `.keys()` 返回的可迭代对象转换为 `Array`：\n\n```\nassert.deepEqual(\n  [...map.keys()],\
  \ \n  [false, true]);\n```\n\n`.values()` 的作用类似于 `.keys()`，但针对的是值而不是键。\n\n\n\n\n\
  \nMap 实例也是条目的可迭代对象。在下面的代码中，我们使用 `destructuring`（解构）来访问 map 的键和值：\n\n```javascript\n\
  for (const [key, value] of map) {\n  console.log(key, value);\n}\n// Output:\n//\
  \ false, 'no'\n// true, 'yes'\n```\n\n### 33.1.7 按照插入顺序列出：条目、键、值\n\nMap 会记录条目创建的顺序，并在列出条目、键或值时遵循该顺序：\n\
  \n```javascript\nconst map1 = new Map([\n  ['a', 1],\n  ['b', 2],\n]);\nassert.deepEqual(\n\
  \  [...map1.keys()], ['a', 'b']);\n\nconst map2 = new Map([\n  ['b', 2],\n  ['a',\
  \ 1],\n]);\nassert.deepEqual(\n  [...map2.keys()], ['b', 'a']);\n```\n\n### 33.1.8\
  \ 在 Map 和对象之间转换\n\n只要 `Map` 仅使用字符串和符号（symbols）作为键，你就可以将其转换为对象（通过 `Object.fromEntries()`）：\n\
  \n```javascript\nconst map = new Map([\n  ['a', 1],\n  ['b', 2],\n]);\nconst obj\
  \ = Object.fromEntries(map);\nassert.deepEqual(\n  obj, {a: 1, b: 2});\n```\n\n\
  你也可以将对象转换为具有字符串或符号键的 `Map`（通过 `Object.entries()`）：\n\n```javascript\nconst obj =\
  \ {\n  a: 1,\n  b: 2,\n};\nconst map = new Map(Object.entries(obj));\nassert.deepEqual(\n\
  \  map, new Map([['a', 1], ['b', 2]]));\n```\n\n### 33.2 示例：计数字符\n\n`countChars()`\
  \ 返回一个 `Map`，将字符映射到它们出现的次数。\n\n```javascript\nfunction countChars(chars) {\n  const\
  \ charCounts = new Map();\n  for (let ch of chars) {\n    ch = ch.toLowerCase();\n\
  \    const prevCount = charCounts.get(ch) || 0;\n    charCounts.set(ch, prevCount+1);\n\
  \  }\n  return charCounts;\n}\n\nconst result = countChars('AaBccc');\nassert.deepEqual(\n\
  \  [...result],\n  [\n    ['a', 2],\n    ['b', 1],\n    ['c', 3],\n  ]);\n```\n\n\
  ### 33.3 关于 Map 键的更多细节（进阶）\n\n任何值都可以作为键，甚至是一个对象：\n\n```javascript\nconst map = new\
  \ Map();\n\nconst KEY1 = {};\nconst KEY2 = {};\n\nmap.set(KEY1, 'hello');\nmap.set(KEY2,\
  \ 'world');\n\nassert.equal(map.get(KEY1), 'hello');\nassert.equal(map.get(KEY2),\
  \ 'world');\n```\n\n#### 33.3.1 哪些键被认为是相等的？\n\n大多数 `Map` 操作需要检查一个值是否等于键中的一个。它们通过内部操作\
  \ `SameValueZero` 实现，该操作的作用类似于 `===`，但它认为 `NaN` 与自身相等。\n\n因此，你可以像使用任何其他值一样，在 `Maps`\
  \ 中将 `NaN` 作为键：\n\n```javascript\n> const map = new Map();\n> map.set(NaN, 123);\n\
  > map.get(NaN)\n123\n```\n\n不同的对象始终被认为是不同的。这是无法更改的（目前——配置键的相等性已在 TC39 的长期路线图中）。\n\
  \n```javascript\n> new Map().set({}, 1).set({}, 2).size\n2\n```\n\n### 33.4 缺失的\
  \ Map 操作\n\n#### 33.4.1 对 Map 进行映射和过滤\n\n你可以对 `Array` 使用 `.map()` 和 `.filter()`，但\
  \ `Map` 没有这样的操作。解决方案是：\n\n1. 将 `Map` 转换为 `[key, value]` 数组的 `Array`。\n2. 对该 `Array`\
  \ 进行映射或过滤。\n3. 将结果转换回 `Map`。\n\n我将使用以下 `Map` 来演示它是如何工作的：\n\n```javascript\nconst\
  \ originalMap = new Map()\n  .set(1, 'a')\n  .set(2, 'b')\n  .set(3, 'c');\n```\n\
  \n映射 `originalMap`：\n\n```javascript\nconst mappedMap = new Map( // step 3\n  [...originalMap]\
  \ // step 1\n  .map(([k, v]) => [k * 2, '_' + v]) // step 2\n);\n```\n\n过滤 `originalMap`：\n\
  \n```javascript\nconst filteredMap = new Map( // step 3\n  [...originalMap] // step\
  \ 1\n  .filter(([k, v]) => k < 3) // step 2\n);\n```\n\n#### 33.4.2 合并 Maps\n\n\
  没有合并 `Maps` 的方法，因此我们必须使用类似于之前的变方法。让我们合并以下 `Maps`：\n\n```javascript\nconst map1 =\
  \ new Map()\n  .set(1, 'one')\n  .set(2, 'two')\n  .set(3, 'three');\n\nconst map2\
  \ = new Map()\n  .set(2, 'two')\n  .set(3, 'three')\n  .set(4, 'four');\n```\n\n\
  要合并 `map1` 和 `map2`，我们通过展开 (`...`) 将它们转换为 `Arrays`，然后将结果转换为 `Map`：\n\n```javascript\n\
  const combinedMap = new Map([......map1, ...map2]);\n```\n\n\n\n\n```javascript\n\
  const map = new Map([[1, 'one'], [2, 'two']]);\nassert.equal(map.delete(1), true);\n\
  assert.equal(map.delete(5), false); // nothing happens\nassert.deepEqual(\n  [...map.entries()],\n\
  \  [[2, 'two']]);\n```\n\n### 33.5.3 `Map<K,V>.prototype`: 处理所有条目\n\n* `.get .size:\
  \ number` ^([ES6])\n\n返回此 Map 包含多少条目。\n\n```javascript\nconst map = new Map([[1,\
  \ 'one'], [2, 'two']]);\nassert.equal(map.size, 2);\n```\n\n* `.clear(): void` ^([ES6])\n\
  \n移除此 Map 中所有的条目。\n\n```javascript\nconst map = new Map([[1, 'one'], [2, 'two']]);\n\
  assert.equal(map.size, 2);\nmap.clear();\nassert.equal(map.size, 0);\n```\n\n###\
  \ 33.5.4 `Map<K,V>.prototype`: 迭代与循环\n\n迭代和循环都是按照条目被添加到 Map 的顺序进行的。\n\n* `.entries():\
  \ Iterable<[K,V]>` ^([ES6])\n\n返回一个可迭代对象，其中包含 Map 中每个条目对应的一个 [key, value] 对。这些值对是长度为\
  \ 2 的数组。\n\n```javascript\nconst map = new Map([[1, 'one'], [2, 'two']]);\nfor (const\
  \ entry of map.entries()) {\n  console.log(entry);\n}\n// 输出:\n// [1, 'one']\n//\
  \ [2, 'two']\n```\n\n* `.forEach(callback: (value: V, key: K, theMap: Map<K,V>)\
  \ => void, thisArg?: any): void` ^([ES6])\n\n第一个参数是回调函数，它会为 Map 中的每个条目被调用一次。如果提供了\
  \ `thisArg`，则在每次调用时 `this` 将被设置为它。否则，`this` 被设置为 `undefined`。\n\n```javascript\n\
  const map = new Map([[1, 'one'], [2, 'two']]);\nmap.forEach((value, key) => console.log(value,\
  \ key));\n// 输出:\n// 'one', 1\n// 'two', 2\n```\n\n* `.keys(): Iterable<K>` ^([ES6])\n\
  \n返回一个遍历 Map 中所有键的可迭代对象。\n\n```javascript\nconst map = new Map([[1, 'one'], [2,\
  \ 'two']]);\nfor (const key of map.keys()) {\n  console.log(key);\n}\n// 输出:\n//\
  \ 1\n// 2\n```\n\n* `.values(): Iterable<V>` ^([ES6])\n\n返回一个遍历 Map 中所有值的可迭代对象。\n\
  \n```javascript\nconst map = new Map([[1, 'one'], [2, 'two']]);\nfor (const value\
  \ of map.values()) {\n  console.log(value);\n}\n// 输出:\n// 'one'\n// 'two'\n```\n\
  \n* `[Symbol.iterator](): Iterable<[K,V]>` ^([ES6])\n\n迭代 Map 的默认方式。与 `.entries()`\
  \ 相同。\n\n```javascript\nconst map = new Map([[1, 'one'], [2, 'two']]);\nfor (const\
  \ [key, value] of map) {\n  console.log(key, value);\n}\n// 输出:\n// 1, 'one'\n//\
  \ 2, 'two'\n```\n\n### 33.5.5 本节来源\n\n* [TypeScript 内置类型定义](https://github.com/Microsoft/TypeScript/blob/master/lib/)\n\
  \n## 33.6 FAQ: Maps\n\n### 33.6.1 我什么时候应该使用 Map，什么时候应该使用对象？\n\n如果你需要一个键既不是字符串也不是符号的字典类数据结构，你别无选择：你必须使用\
  \ `Map`。\n\n然而，如果你的键是字符串或符号，你必须决定是否使用对象。一个大致的通用指南是：\n\n* 是否存在一个固定的键集合（在开发时已知）？\n\
  \n  那么使用对象 `obj` 并通过固定键访问值：\n\n```javascript\nconst value = obj.key;\n```\n\n* 键的集合会在运行时发生变化吗？\n\
  \n  那么使用 Map `map` 并通过存储在变量中的键访问值：\n\n```javascript\nconst theKey = 123;\nmap.get(theKey);\n\
  ```\n\n### 33.6.2 我在什么情况下会将对象作为 Map 的键？\n\n你通常希望 Map 的键通过值进行比较（如果两个键的内容相同，则认为它们是相等的）。这排除了对象。但是，对象作为键有一个用例：向对象外部挂载数据。但该用例使用\
  \ `WeakMaps` 效果更好，因为 `WeakMaps` 中的条目不会防止键被垃圾回收（详情请参阅下一章）。\n\n### 33.6.3 为什么 Maps\
  \ 保留了条目的插入顺序？\n\n原则上，Maps 是无序的。保持条目顺序的主要目的是为了列出条目、键或值的操作是确定性的。这有助于，例如测试。\n\n###\
  \ 33.6.4 为什么 Maps 有 `.size`，而 Arrays 有 `.length`？\n\n在 JavaScript 中，可索引序列（如数组和字符串）具有\
  \ `.length`，而未索引的集合（如 Maps 和 Sets）具有 `.size`：\n\n* `.length` 基于索引；它始终是最高索引加一。\n\n\
  * `.size` 统计元素的数量。\n\n# 34 WeakMaps (`WeakMap`)\n\n* *\n\nWeakMaps 与 Maps 类似，但有以下不同：\n\
  \n* 它们是黑盒，只有当你同时拥有 weakmap 和键时，才能访问值。\n* WeakMap 的键是**弱引用的（weakly held）。\n\n###\
  \ 34.1 WeakMaps 是黑盒\n\n检查 `WeakMap` 内部的内容是不可能的：\n\n* 例如，你无法对键、值或条目进行迭代或循环。你无法计算大小。\n\
  * 此外，你无法清空 WeakMap —— 你必须创建一个新的实例。\n\n这些限制实现了一种安全属性。引用 [Mark Miller](https://github.com/tc39/tc39-notes/blob/master/meetings/2014-11/nov-19.md#412-should-weakset-have-a-clear-method-mark)：\n\
  \n> 从 weakmap 键到值的映射只能被同时拥有 weakmap 和键的人观察或影响。如果使用 `clear()`，只拥有 WeakMap 的人将能够影响\
  \ WeakMap 键到值的映射。\n\n## 34.2 WeakMap 的键是弱引用的\n\nWeakMap 的键被说是*弱引用的（weakly held）*：通常，如果一个对象引用另一个对象，那么只要前者存在，后者就无法被垃圾回收。在\
  \ WeakMap 中，情况不同：如果一个对象是键且没有在其他地方引用，即使 WeakMap 仍然存在，它也可以被垃圾回收。这会导致相应的条目被移除（但没有办法观察这一点）。\n\
  \n### 34.2.1 所有 WeakMap 键必须是对象\n\n所有的 WeakMap 键必须是对象。如果你使用原始值，会报错：\n\n```javascript\n\
  const wm = new WeakMap();\nwm.set(123, 'test') // TypeError: Invalid value used\
  \ as weak map key\n```\n\n如果使用原始值作为键，WeakMaps 就不再是黑盒了。但考虑到原始值永远不会被垃圾回收，你无法从弱引用键中获益，直接使用普通的\
  \ Map 即可。\n\n### 34.2.2 用例：向对象挂载值\n\n这是 WeakMaps 的主要用例：你可以使用它们来向对象外部挂载值——例如：\n\n\
  \n\n\n\n```\nconst wm = new WeakMap();\n{\n  const obj = {};\n  wm.set(obj, 'attachedValue');\
  \ // (A)\n}\n// (B)\n```\n\n在 A 行中，我们为 `obj` 附加了一个值。在 B 行，`obj` 已经可以被回收了，尽管 `wm`\
  \ 仍然存在。这种为对象附加值的技术等同于将该对象的某个属性存储在外部。如果 `wm` 是一个属性，之前的代码将如下：\n\n```\n{\n  const obj\
  \ = {};\n  obj.wm = 'attachedValue';\n}\n```\n\n### 34.3 示例\n\n### 34.3.1 通过 WeakMaps\
  \ 缓存计算结果\n\n通过 `WeakMaps`，你可以将之前计算的结果与对象关联，而无需担心内存管理。以下函数 `countOwnKeys()` 就是一个示例：它在\
  \ `WeakMap` `cache` 中缓存了之前的的结果。\n\n```javascript\nconst cache = new WeakMap();\n\
  function countOwnKeys(obj) {\n  if (cache.has(obj)) {\n    return [cache.get(obj),\
  \ 'cached'];\n  } else {\n    const count = Object.keys(obj).length;\n    cache.set(obj,\
  \ count);\n    return [count, 'computed'];\n  }\n}\n```\n\n如果我们在对象 `obj` 上使用此函数，你可以看到结果只在第一次调用时进行计算，而第二次调用时使用了缓存值：\n\
  \n```javascript\n> const obj = { foo: 1, bar: 2};\n> countOwnKeys(obj)\n[2, 'computed']\n\
  > countOwnKeys(obj)\n[2, 'cached']\n```\n\n### 34.3.2 在 WeakMaps 中存储私有数据\n\n在以下代码中，`WeakMaps`\
  \ `_counter` 和 `_action` 被用于存储 `Countdown` 实例虚拟属性的值：\n\n```javascript\nconst _counter\
  \ = new WeakMap();\nconst _action = new WeakMap();\n\nclass Countdown {\n  constructor(counter,\
  \ action) {\n    _counter.set(this, counter);\n    _action.set(this, action);\n\
  \  }\n  dec() {\n    let counter = _counter.get(this);\n    counter--;\n    _counter.set(this,\
  \ counter);\n    if (counter === 0) {\n      _action.get(this)();\n    }\n  }\n\
  }\n\n// 这两个伪属性是真正的私有的：\nassert.deepEqual(\n  Object.keys(new Countdown()),\n  []);\n\
  ```\n\n这是 `Countdown` 的使用方式：\n\n```javascript\nlet invoked = false;\n\nconst cd\
  \ = new Countdown(3, () => invoked = true);\n\ncd.dec(); assert.equal(invoked, false);\n\
  cd.dec(); assert.equal(invoked, false);\ncd.dec(); assert.equal(invoked, true);\n\
  ```\n\n**练习：用于 WeakMaps 处理私有数据**\n\n`exercises/weakmaps/weakmaps_private_data_test.mjs`\n\
  \n## 34.4 WeakMap API\n\n`WeakMap` 的构造函数和四个方法的工作原理与其 `Map` 对应方法相同：\n\n* `new WeakMap<K,\
  \ V>(entries?: Iterable<[K, V]>)` [ES6]\n* `.delete(key: K) : boolean` [ES6]\n*\
  \ `.get(key: K) : V` [ES6]\n* `.has(key: K) : boolean` [ES6]\n* `.set(key: K, value:\
  \ V) : this` [ES6]\n\n**测试题**\n参见测试题。\n\n## 35 Set（集合）\n\n* **使用 Set**\n    * 创建\
  \ Set\n    * 添加、删除、检查成员身份\n    * 确定 Set 的大小并清空\n    * 遍历 Set\n* **使用 Set 的示例**\n\
  \    * 从数组中去重\n    * 创建 Unicode 字符（码点）的集合\n* **哪些 Set 元素被认为是相等的？**\n* **缺失的 Set\
  \ 操作**\n    * 并集 (`a` ∪ `b`)\n    * 交集 (`a` ∩ `b`)\n    * 差集 (`a` \\ `b`)\n    *\
  \ 对 Set 进行映射\n    * 过滤 Set\n* **快速参考：Set<T>****\n    * 构造函数\n    * `Set<T>.prototype`:\
  \ 单个 Set 元素\n    * `Set<T>.prototype`: 所有 Set 元素\n    * `Set<T>.prototype`: 遍历和循环\n\
  \    * 与 `Map` 的对称性\n* **常见：Set**\n    * 为什么 Set 有 `.size`，而数组有 `.length`？\n\n在\
  \ ES6 之前，JavaScript 还没有用于集合的数据结构。相反，使用了两种替代方案：\n\n* 使用对象的键作为字符串的集合。\n* 使用数组作为任意值的集合。缺点是检查成员身份（判断数组是否包含某个值）速度较慢。\n\
  \n从 ES6 开始，JavaScript 引入了 `Set` 数据结构，它可以包含任意值并能够快速执行成员检查。\n\n### 35.1 使用 Set\n\n\
  ### 35.1.1 创建 Set\n\n创建 Set 有三种常用方法。\n\n首先，你可以使用不带任何参数的构造函数创建一个空的 Set：\n\n```javascript\n\
  const emptySet = new Set();\nassert.equal(emptySet.size, 0);\n```\n\n其次，你可以向构造函数传递一个可迭代对象（例如数组）。迭代的值将成为新\
  \ Set 的元素：\n\n```javascript\nconst set = new Set(['red', 'green', 'blue']);\n```\n\
  \n第三，`.add()` 方法向 Set 添加元素并支持链式调用：\n\n```javascript\nconst set = new Set()\n  .add('red')\n\
  \  .add('green')\n  .add('blue');\n```\n\n### 35.1.2 添加、删除、检查成员身份\n\n`.add()` 向\
  \ Set 添加一个元素：\n\n```javascript\nconst set = new Set();\nset.add('red');\n```\n\n\
  `.has()` 检查一个元素是否为 Set 的成员：\n\n```javascript\nassert.equal(set.has('red'), true);\n\
  ```\n\n`.delete()` 从 Set 中删除一个元素：\n\n```javascript\nassert.equal(set.delete('red'),\
  \ true); //发生了删除\nassert.equal(set.has('red'), false);\n```\n\n### 35.1.3 确定 Set\
  \ 的大小并清空\n\n`.size` 包含 Set 中元素的数量：\n\n```javascript\nconst set = new Set()\n  .add('foo')\n\
  \  .add('bar');\nassert.equal(set.size, 2);\n```\n\n`.clear()`  Set 中所有的元素：\n\n\
  ```javascript\nset.clear();\nassert.equal(set.size, 0);\n```\n\n### 35.1.4 遍历 Set\n\
  \nSet 是可迭代的，`for-of` 循环按你预期的方式工作：\n\n```javascript\nconst set = new Set(['red',\
  \ 'green', 'blue']);\nfor (const x of set) {\n  console.log(x);\n}\n// 输出：\n// 'red'\n\
  // 'green'\n// 'blue'\n```\n\n可以看出，Set 保持了*插入顺序*。也就是说，元素按照它们被添加的顺序进行迭代。\n\n由于 Set\
  \ 可迭代的，你可以使用扩展运算符（`...`）将它们转换为数组：\n\n```javascript\nconst set = new Set(['red',\
  \ 'green', 'blue']);\nconst arr = [...set]; // ['red', 'green', 'blue']\n```\n\n\
  \n\n\n将数组转换为 Set 再转换回来，可以移除数组中的重复项：\n\n```\n[](#cb934-1)assert.deepEqual(\n[](#cb934-2)\
  \  [...new Set([1, 2, 1, 2, 3, 3, 3])],\n[](#cb934-3)  [1, 2, 3]);\n```\n\n### 35.2.2\
  \ 创建 Unicode 字符集（代码点）的集合\n\n字符串是可迭代的，因此可以作为 `new Set()` 的参数：\n\n```\n[](#cb935-1)assert.deepEqual(\n\
  [](#cb935-2)  new Set('abc'),\n[](#cb935-3)  new Set(['a', 'b', 'c']));\n```\n\n\
  ## 35.3 Set 元素如何被认为是等等的？\n\n与 Map 键一样，Set 元素的比较方式类似于 `===`，不同之处点是 `NaN` 等于它自己。\n\
  \n```\n> const set = new Set([NaN, NaN, NaN]);\n> set.size\n1\n> set.has(NaN)\n\
  true\n```\n\n与 `===` 一样，两个不同的对象永远不会被认为是等等的（目前没有办法改变这一点）：\n\n```\n> const set = new\
  \ Set();\n\n> set.add({});\n> set.size\n1\n\n> set.add({});\n> set.size\n2\n```\n\
  \n## 35.4 缺失的 Set 操作\n\nSet 缺少了几个常用操作。此类操作通常可以通过以下方式实现：\n\n*   通过展开到数组字字量中 将输入的\
  \ Sets 转换为数组（Arrays）。\n*   在数组上执行该操作。\n*   将结果转换为 Set 并返回。\n\n### 35.4.1 并集 (`a`\
  \ ∪ `b`)\n\n计算两个 Set `a` 和 `b` 的并集意味着创建一个包含 `a` 和 `b` 中所有元素的 Set。\n\n```\n[](#cb938-1)const\
  \ a = new Set([1,2,3]);\n[](#cb938-2)const b = new Set([4,3,2]);\n[](#cb938-3)//\
  \ 使用展开来连接两个可迭代对象\n[](#cb938-4)const union = new Set([...a, ...b]);\n[](#cb938-5)\n\
  [](#cb938-6)assert.deepEqual([...union], [1, 2, 3, 4]);\n```\n\n### 35.4.2 交集 (`a`\
  \ ∩ `b`)\n\n计算两个 Set `a` 和 `b` 的交集意味着创建一个包含 `a` 中同时存在于 `b` 中的元素的 Set。\n\n```\n[](#cb939-1)const\
  \ a = new Set([1,2,3]);\n[](#cb939-2)const b = new Set([4,3,2]);\n[](#cb939-3)const\
  \ intersection = new Set(\n[](#cb939-4)  [...a].filter(x => b.has(x)));\n[](#cb939-5)\n\
  [](#cb939-6)assert.deepEqual([...intersection], [2, 3]);\n```\n\n### 35.4.3 差集 (`a`\
  \ \\ `b`)\n\n计算两个 Set `a` 和 `b` 的差集意味着创建一个包含 `a` 中不在 `b` 中的元素的 Set。此操作有时也称为*减法*\
  \ (−)。\n\n```\n[](#cb940-1)const a = new Set([1,2,3]);\n[](#cb940-2)const b = new\
  \ Set([4,3,2]);\n[](#cb940-3)const difference = new Set(\n[](#cb940-4)  [...a].filter(x\
  \ => !b.has(x)));\n[](#cb940-5)\n[](#cb940-6)assert.deepEqual([...difference], [1]);\n\
  ```\n\n### 35.4.4 对 Set 进行映射（Mapping）\n\nSet 没有 `.map()` 方法。但我们可以借用数组拥有的方法：\n\n\
  ```\n[](#cb941-1)const set = new Set([1, 2, 3]);\n[](#cb941-2)const mappedSet =\
  \ new Set([...set].map(x => x * 2));\n[](#cb941-3)\n[](#cb941-4)// 将 mappedSet 转换为数组以检查内容\n\
  [](#cb941-5)assert.deepEqual([...mappedSet], [2, 4, 6]);\n```\n\n### 35.4.5 过滤 Set\n\
  \n我们不能直接对 Set 使用 `.filter()`，因此需要使用相应的的数组方法：\n\n```\n[](#cb942-1)const set = new\
  \ Set([1, 2, 3, 4, 5]);\n[](#cb942-2)const filteredSet = new Set([...set].filter(x\
  \ => (x % 2) === 0));\n[](#cb942-3)\n[](#cb942-4)assert.deepEqual([...filteredSet],\
  \ [2, 4]);\n```\n\n## 35.5 快速参考：`Set<T>`\n\n### 35.5.1 构造函数\n\n*   `new Set<T>(values?:\
  \ Iterable<T>)` ^([ES6])\n\n    如果你不提供参数 `values`，则会创建一个空的 Set。如果你提供了，则迭代后的值将作为元素添加到\
  \ Set 中。例如：\n\n    ```\n[](#cb943-1)const set = new Set(['red', 'green', 'blue']);\n\
  \    ```\n\n### 35.5.2 `Set<T>.prototype`: 单 Set 元素\n\n*   `.add(value: T): this`\
  \ ^([ES6])\n\n    将 `value` 添加到此 Set 中。此方法返回 `this`，这意味着它可以进行链式调用。\n\n    ```\n\
  [](#cb944-1)const set = new Set(['red']);\n[](#cb944-2)set.add('green').add('blue');\n\
  [](#cb944-3)assert.deepEqual([...set], ['red', 'green', 'blue']);\n```\n\n*   `.delete(value:\
  \ T): this` ^([ES6])\n\n    从此 Set 中移除 `value`。如果删除了内容则返回 `true`，否则返回 `false`。\n\
  \n    ```\n[](#cb945-1)const set = new Set(['red', 'green', 'blue']);\n[](#cb945-2)set.delete('red');\
  \ // true\n[](#cb945-3)set.delete('yellow'); // false\n    ```\n\n*   `.has(value:\
  \ T): boolean` ^([ES6])\n\n    检查 `value` 是否在此 Set 中。\n\n    ```\n[](#cb946-1)const\
  \ set = new Set(['red', 'green']);\n[](#cb946-2)set.has('red'); // true\n[](#cb946-3)set.has('blue');\
  \ // false\n```\n\n### 35.5.3 `Set<T>.prototype`: 所有元素\n\n*   `.size: number` ^([ES6])\n\
  \n    返回此 Set 中有多少个元素。\n\n    ```\n[](#cb947-1)const set = new Set(['red', 'green',\
  \ 'blue']);\n[](#cb947-2)set.size // 3\n```\n\n*   `.clear(): void` ^([ES6])\n\n\
  \    从此 Set 中移除所有元素。\n\n    ```\n[](#cb948-1)const set = new Set(['red', 'green',\
  \ 'blue']);\n[](#cb948-2)set.clear();\n[](#cb948-3)set.size // 0\n```\n\n### 35.5.4\
  \ 迭代\n\n*   `.values(): Iterable<T>` ^([ES6])\n\n    返回一个对所有元素的迭代器。\n\n    ```\n\
  [](#cb949-1)const set = new Set(['red', 'green']);\n[](#cb949-2)for (const x of\
  \ set.values()) {\n[](#cb949-3)  console.log(x);\n}\n```\n\n*   `[Symbol.iterator]()`\
  \ ^([ES6])\n\n    默认迭代方式。与 `.values()` 相同。\n\n    ```\n[](#cb950-1)const set = new\
  \ Set(['red', 'green']);\n[](#cb950-2)for (const x of set) {\n[](#cb950-3)  console.log(x);\n\
  }\n    ```\n\n### 35.5.5 与 Map 的对称性\n\n以下两个方法主要存在是为了让 Set 和 Map 具有相似的接口。每个 Set 元素被处理为一个键和值都是元素的\
  \ Map 条目。\n\n*   `Set.prototype.entries(): Iterable<[T,T]>` ^([ES6])\n\n*   `Set.prototype.keys():\
  \ Iterable<T>` ^([ES6])\n\n`.entries()` 允许将 Set 转换为 Map：\n\n```\n[](#cb952-1)const\
  \ set = new Set(['a', 'b', 'c']);\n[](#cb952-2)const map = new Map(set.entries());\n\
  [](#cb952-3)assert.deepEqual([...map.entries()],\n[](#cb952-4)  [['a','a'], ['b','b'],\
  \ ['c','c']]);\n```\n\n## 35.6 FAQ: Sets\n\n### 35.6.1 为什么 Set 有 `.size` 而数组有 `.length`？\n\
  \n该问题的答案位于 §33.6.4 “为什么 Map 有 `.size` 而数组有 `.length`?”。\n\n![](img/file7.svg)  **测试**\n\
  \n查看测验应用。\n\n# 36 WeakSets (`WeakSet`)\n\n* * *\n\n*   36.1 示例：标记对象以安全使用方法](#ch037.xhtml_example-marking-objects-as-safe-to-use-with-a-method)\n\
  *   36.2 WeakSet API](#ch037.xhtml_weakset-api)\n\n* * *\n\nWeakSets 与 Set 相似，但区别在于：\n\
  \n*   它们持有对象而不会防止这些对象被垃圾回收。\n\n\n\n\n*   它们是黑盒：只有当我们同时拥有 `WeakSet` 和一个值时，才能从 `WeakSet`\
  \ 中获取任何数据。支持的方法仅有 `.add()`、`.delete()` 和 `.has()`。请参阅作为黑盒的 WeakMaps 章节，了解为什么 `WeakSets`\
  \ 不允许迭代、循环和清空。\n\n由于我们无法遍历它们的元素，`WeakSets` 的使用场景并不多。它们确实可以允许我们标记对象。\n\n## 36.1 示例：将对象标记为安全可以使用某种方法\n\
  \n[Domenic Denicola 展示](https://mail.mozilla.org/pipermail/es-discuss/2015-June/043027.html)了类\
  \ `Foo` 如何确保其方法仅适用于它创建的实例：\n\n```javascript\nconst foos = new WeakSet();\n\nclass\
  \ Foo {\n  constructor() {\n    foos.add(this);\n  }\n\n  method() {\n    if (!foos.has(this))\
  \ {\n      throw new TypeError('Incompatible object!');\n    }\n  }\n}\n\nconst\
  \ foo = new Foo();\nfoo.method(); // works\n\nassert.throws(\n  () => {\n    const\
  \ obj = {};\n    Foo.prototype.method.call(obj); // throws an exception\n  },\n\
  \  TypeError\n);\n```\n\n## 36.2 WeakSet API\n\n`WeakSet` 的构造函数和三个方法的工作方式与 `Set`\
  \ 等效项 相同：\n\n*   `new WeakSet<T>(values?: Iterable<T>)` ([ES6])\n*   `.add(value:\
  \ T): this` ([ES6])\n*   `.delete(value: T): boolean` ([ES6])\n*   `.has(value:\
  \ T): boolean` ([ES6])\n\n# 37 解构\n\n* * *\n\n*   37.1 初探解构\n*   37.2 构建 vs. 提取\n\
  *   37.3 我们可以在解构？\n*   37.4 对象解构\n    *   37.4.1 属性值简写\n    *   37.4.2 剩余属性\n  \
  \  *   37.4.3 语法陷阱：通过对象解构赋值\n*   37.5 数组解构\n    *   37.5.1 数组解构适用于任何迭代器\n    * \
  \  37.5.2 剩余元素\n*   37.6 解构示例\n    *   37.6.1 数组解构：交换变量值\n    *   37.6.2 数组解构：返回数组的操作\n\
  \    *   37.6.3 对象解构：多个返回值\n*   37.7 如果模式部分不匹配任何项会发生什么？\n    *   37.7.1 对象解构与缺失属性\n\
  \    *   37.7.2 数组解构与缺失元素\n*   37.8 哪些值无法解构？\n    *   37.8.1 不能对 `undefined` 和 `null`\
  \ 进行对象解构\n    *   37.8.2 不能对非迭代值进行数组解构\n*   37.9 （高级）](#ch038.xhtml_advanced-4)\n\
  *   37.10��默认值\n    *   37.10.1 数组解构中的默认值\n    *   37.10.2 对象解构中的默认值\n*   37.11 参数定义与解构相似\n\
  *   37.12 嵌套解构\n\n* * *\n\n## 37.1 初探解构\n\n在普通赋值中，你一次提取一条数据——例如：\n\n```javascript\n\
  const arr = ['a', 'b', 'c'];\nconst x = arr[0]; // 提取\nconst y = arr[1]; // 提取\n\
  ```\n\n使用解构，你可以通过模式同时提取多条数据。`=` 的左侧是一个模式。在以下代码中：\n\n```javascript\nconst arr = ['a',\
  \ 'b', 'c'];\nconst [x, y] = arr; // 解构\n```\n\n`x` 是 'a'，`y` 是 'b'。\n\n## 37.2 构建\
  \ vs. 提取\n\n为了理解解构，考虑到 JavaScript 有两个相反的概念：\n\n*   你可以*构建*数据，例如通过设置（setting）。\n\
  *   你可以*提取*数据，例如通过获取（getting）。\n\n构建如下：\n\n```javascript\nconst jane = { first:\
  \ 'Jane', last: 'Doe' };\n```\n\n提取如下：\n\n```javascript\nconst { first, last } =\
  \ jane;\n```\n\n解构模式在语法上与用于构建的字面量相似。但它们出现在数据接收的地方（例如赋值的左侧），而不是数据创建的地方（例如赋值的右侧）。\n\
  \n## 37.3 我们可以在哪里解构？\n\n解构模式可以用在“数据汇点”处，例如：\n\n*   变量声明：\n\n    ```javascript\n\
  \    const [a] = ['x'];\n    assert.equal(a, 'x');\n    let [b] = ['y'];\n    assert.equal(b,\
  \ 'y');\n    ```\n\n*   赋值：\n\n    ```javascript\n    let b;\n    [b] = ['z'];\n\
  \    assert.equal(b, 'z');\n    ```\n\n*   参数定义：\n\n    ```javascript\n    const\
  \ f = ([x]) => x;\n    assert.equal(f(['a']), 'a');\n    ```\n\n注意，变量声明包括 `for-of`\
  \ 循环中的 `const` 和 `let` 声明：\n\n```javascript\nconst arr = ['a', 'b'];\nfor (const\
  \ [index, element] of arr.entries()) {\n    console.log(index, element);\n}\n//\
  \ 输出:\n// 0 'a'\n// 1 'b'\n```\n\n在接下来的两个章节中，我们将深入探讨两种解构：对象解构和数组解构。\n\n\n\n\n\n\
  `Object-destructuring`（对象解构）允许你通过类似于对象字量字的模式来批量提取属性值：\n\n```javascript\nconst address\
  \ = {\n  street: 'Evergreen Terrace',\n  number: '742',\n  city: 'Springfield',\n\
  \  state: 'NT',\n  zip: '49007',\n};\n\nconst { street: s, city: c } = address;\n\
  assert.equal(s, 'Evergreen Terrace');\nassert.equal(c, 'Springfield');\n```\n\n\
  你可以将这种模式想象成覆盖在数据之上的透明罩：模式键 `'street'` 在数据中找到了匹配项。因此，数据值 `'Evergreen Terrace'` 被赋值给模式变量\
  \ `s`。\n\n你也可以对原始值进行对象解构：\n\n```javascript\nconst {length: len} = 'abc';\nassert.equal(len,\
  \ 3);\n```\n\n你还可以对数组进行对象解构：\n\n```javascript\nconst {0:x, 2:y} = ['a', 'b', 'c'];\n\
  assert.equal(x, 'a');\nassert.equal(y, 'c');\n```\n\n为什么这可以得通？数组索引也是属性。\n\n### 37.4.1\
  \ 属性值简写\n\n对象字面量支持属性值简写，对象模式也是如此：\n\n```javascript\nconst { street, city } = address;\n\
  assert.equal(street, 'Evergreen Terrace');\nassert.equal(city, 'Springfield');\n\
  ```\n\n![](img/file6.svg) **练习：对象解构**\n\n`exercises/destructuring/object_destructuring_exrc.mjs`\n\
  \n### 37.4.2 剩余属性 (Rest properties)\n\n在对象字面量中，你可以展开属性（spread properties）。在对象模式中，你可以剩余属性（必须放在最后）：\n\
  \n```javascript\nconst obj = { a: 1, b: 2, c: 3 };\nconst { a: propValue, ...remaining\
  \ } = obj; // (A)\n\nassert.equal(propValue, 1);\nassert.deepEqual(remaining, {b:2,\
  \ c:3});\n```\n\n剩余属性变量（例如 `remaining`，行 A）被赋值为一个对象，该对象包含所有未在模式中提到的数据属性及其键值。\n\n\
  `remaining` 也可以被视为非破坏性地从 `obj` 中移除属性 `a` 的结果。\n\n### 37.4.3 语法陷阱：通过对象解构赋值\n\n如果我们在赋值语句中使用对象解构，将会遇到一个由语法歧义引起的陷阱——你不能用大括号开头语句，因为\
  \ JavaScript 会认为你正在开始一个块：\n\n```javascript\nlet prop;\nassert.throws(\n  () => eval(\"\
  {prop} = { prop: 'hello' };\"),\n  {\n    name: 'SyntaxError',\n    message: 'Unexpected\
  \ token =',\n  });\n```\n\n![](img/file5.svg) **为什么用 `eval()`?**\n\n`eval()` 延迟了解析（从而延迟了\
  \ `SyntaxError`），直到 `assert.throws()` 的回调函数执行。如果不使用它，在代码被解析时就会得到错误，`assert.throws()`\
  \ 甚至不会被执行。\n\n解决方法是将整个赋值语句放在括号中：\n\n```javascript\nlet prop;\n({prop} = { prop:\
  \ 'hello' });\nassert.equal(prop, 'hello');\n```\n\n### 37.5 数组解构 (Array-destructuring)\n\
  \n`Array-destructuring`（数组解构）允许你通过类似于数组字量量的模式来批量提取数组元素：\n\n```javascript\nconst\
  \ [x, y] = ['a', 'b'];\nassert.equal(x, 'a');\nassert.equal(y, 'b');\n```\n\n你可以通过在数组模式内部留空来跳过元素：\n\
  \n```javascript\nconst [, x, y] = ['a', 'b', 'c']; // (A)\nassert.equal(x, 'b');\n\
  assert.equal(y, 'c');\n```\n\n行 A 中数组模式的第一个元素为空，这就是为什么索引为 0 的数组元素被忽略了。\n\n### 37.5.1\
  \ 数组解构适用于任何迭代对象\n\n数组解构可以应用于任何可迭代的值，而不仅仅是数组：\n\n```javascript\n// Set 是可迭代的\nconst\
  \ mySet = new Set().add('a').add('b').add('c');\nconst [first, second] = mySet;\n\
  assert.equal(first, 'a');\nassert.equal(second, 'b');\n\n// 字符串也是可迭代的\nconst [a,\
  \ b] = 'xyz';\nassert.equal(a, 'x');\nassert.equal(b, 'y');\n```\n\n### 37.5.2 剩余元素\
  \ (Rest elements)\n\n在数组字面量中，你可以展开元素。在数组模式中，你可以有剩余元素（必须放在最后）：\n\n```javascript\n\
  const [x, y, ...remaining] = ['a', 'b', 'c', 'd']; // (A)\n\nassert.equal(x, 'a');\n\
  assert.equal(y, 'b');\nassert.deepEqual(remaining, ['c', 'd']);\n```\n\n剩余元素变量（例如\
  \ `remaining`，行 A）被赋值为一个数组，其中包含了解构值中所有尚未被提到的元素。\n\n### 37.6 解构示例\n\n### 37.6.1 数组解构：交换变量值\n\
  \n你可以使用数组解构来交换两个变量的值，而不需要临时变量：\n\n```javascript\nlet x = 'a';\nlet y = 'b';\n\n\
  [x,y] = [y,x]; // 交换\n\nassert.equal(x, 'b');\nassert.equal(y, 'a');\n```\n\n###\
  \ 37.6.2 数组解构：返回数组的操作\n\n当操作返回数组时，数组解构非常有用，例如正则表达式的方法 `.exec()`：\n\n```javascript\n\
  // 跳过索引 0 的元素（整个匹配项）：\nconst [, year, month, day] =\n  .exec();\n```\n\n### 37.6.3\
  \ 对象解构：多个返回值\n\n考虑一个函数 `findElement()`，它接收值和索引，并返回一个布尔值表示该元素是否为调用者寻找的元素。以下实现返回索引和值：\n\
  \n```javascript\nfunction findElement(arr, predicate) {\n  for (let index=0; index\
  \ < arr.length; index++) {\n    const value = arr[index];\n    if (predicate(value))\
  \ {\n      // 我们找到了东西：\n      return { value, index };\n    }\n  }\n  // 我们什么都没找到：\n\
  \  return { value: undefined, index: -1 };\n}\n```\n\n解构帮助我们处理 `findElement()` 的结果：\n\
  \n```javascript\nconst arr = [7, 8, 6];\n\nconst {value, index} = findElement(arr,\
  \ x => x % 2 === 0);\nassert.equal(value, 8);\nassert.equal(index, 1);\n```\n\n\
  由于我们处理的是属性键，因此提到 `value` 和 `index` 的顺序并不重要：\n\n```javascript\nconst {index, value}\
  \ = findElement(arr, x => x % 2 === 0);\n```\n\n关键点在于，如果我们只对两个结果中的一个感兴趣，解构同样非常好用：\n\
  \n```javascript\nconst arr = [7, 8, 6];\n\nconst {value} = findElement(arr, x =>\
  \ x % 2 === 0);\nassert.equal(value, 8);\n\nconst {index} = findElement(arr, x =>\
  \ x % 2 === 0);\nassert.equal(index, 1);\n```\n\n所有这些便利性的结合使得这种处理多个返回值的方法变得非常多功能。\n\
  \n\n\n\n\n如果模式的部分没有匹配项，会发生什么？这与使用非批处理操作符的情况相同：你会得到 `undefined`。\n\n### 37.7.1 对象解构与缺失的属性\n\
  \n如果对象模式中的某个属性在右侧没有匹配项，你会得到 `undefined`：\n\n```javascript\nconst {prop: p} = {};\n\
  assert.equal(p, undefined);\n```\n\n### 37.7.2 数组解构与缺失的元素\n\n如果数组模式中的某个元素在右侧没有匹配项，你会得到\
  \ `undefined`：\n\n```javascript\nconst [x] = [];\nassert.equal(x, undefined);\n\
  ```\n\n![](img/file7.svg) **测验：基础**\n\n查看测验应用。\n\n### 37.8 哪些值不能被解构？\n\n### 37.8.1\
  \ 你不能对 `undefined` 和 `null` 进行对象解构\n\n只有当要解构的值为 `undefined` 或 `null` 时，对象解构才会失败。也就是说，每当通过点操作符访问属性会失败时，解构也会失败。\n\
  \n```javascript\nassert.throws(\n  () => { const {prop} = undefined; },\n  {\n \
  \   name: 'TypeError',\n    message: \"Cannot destructure property `prop` of \"\
  \ +\n      \"'undefined' or 'null'.\",\n  }\n);\nassert.throws(\n  () => { const\
  \ {prop} = null; },\n  {\n    name: 'TypeError',\n    message: \"Cannot destructure\
  \ property `prop` of \" +\n      \"'undefined' or 'null'.\",\n  }\n);\n```\n\n###\
  \ 37.8.2 你不能对不可迭代值进行数组解构\n\n数组解构要求解构的值是可迭代的。因此，你不能对 `undefined` 和 `null` 进行数组解构。你也不能对不可迭代的对象进行数组解构：\n\
  \n```javascript\nassert.throws(\n  () => { const [x] = {}; },\n  {\n    name: 'TypeError',\n\
  \    message: '{} is not iterable',\n  }\n);\n```\n\n## 37.9 （高级）\n\n剩余的所有章节都是高级内容。\n\
  \n## 37.10 默认值\n\n通常情况下，如果模式没有匹配项，对应的变量将被设置为 `undefined`：\n\n```javascript\nconst\
  \ {prop: p} = {};\nassert.equal(p, undefined);\n```\n\n如果你想使用不同的值，则需要指定一个 `默认值`（通过\
  \ `=` 指定）：\n\n```javascript\nconst {prop: p = 123} = {}; // (A)\nassert.equal(p,\
  \ 123);\n```\n\n在 A 行中，我们指定了 `p` 的默认值为 `123`。之所以使用该默认值，是因为我们正在解构的数据中没有名为 `prop`\
  \ 的属性。\n\n### 37.10.1 数组解构中的默认值\n\n在这里，我们有两个默认值赋值给变量 `x` 和 `y`，因为在被解构的数组中不存在对应的元素。\n\
  \n```javascript\nconst [x=1, y=2] = [];\nassert.equal(x, 1);\nassert.equal(y, 2);\n\
  ```\n\n数组模式中第一个元素的默认值为 `1`；第二个元素的默认值为 `2`。\n\n### 37.10.2 对象解构中的默认值\n\n你也可以为对象解构指定默认值：\n\
  \n```javascript\nconst {first: f='', last: l=''} = {};\nassert.equal(f, '');\nassert.equal(l,\
  \ '');\n```\n\n在被解构的对象中，属性键 `first` 和属性键 `last` 都不存在。因此，使用了默认值。\n\n使用属性值简写时，这段代码变为：\n\
  \n```javascript\nconst {first='', last=''} = {};\nassert.equal(first, '');\nassert.equal(last,\
  \ '');\n```\n\n### 37.11 参数定义与解构相似\n\n考虑到我们在本章中学习的知识，参数定义与数组模式（剩余元素、默认值等）有许多共同点。事实上，以下函数声明是等等效的：\n\
  \n```javascript\nfunction f1(pattern1, pattern2) {\n  // ...\n}\nfunction f2(...args)\
  \ {\n  const [pattern1, pattern2] = args;\n  // ...\n}\n```\n\n### 37.12 嵌套解构\n\n\
  到目前为止，我们只在解构中使用变量作为`赋值目标`（数据汇点）。但你也可以将模式作为赋值目标，这允许你嵌套任意深度的模式：\n\n```javascript\n\
  const arr = [\n  { first: 'Jane', last: 'Bond' },\n  { first: 'Lars', last: 'Croft'\
  \ },\n];\nconst [, {first}] = arr;\nassert.equal(first, 'Lars');\n```\n\n在 A 行的数组模式中，索引\
  \ 1 处有一个嵌套的对象模式。嵌套模式可能会变得难以理解，因此最好适节使用。\n\n![](img/file7.svg) **测验：高级**\n\n查看测验应用。\n\
  \n## 38 同步生成器（高级）\n\n### 38.1 什么是同步生成器？\n\n同步生成器是函数定义和方法定义的特殊版本，它们总是返回同步可迭代器：\n\n\
  ```javascript\n// 生成器函数声明\nfunction* genFunc1() { /*...*/ }\n\n// 生成器函数表达式\nconst\
  \ genFunc2 = function* () { /*...*/ };\n\n// 对象字字量中的生成器方法定义\nconst obj = {\n  *generatorMethod()\
  \ {\n    // ...\n  }\n};\n\n// 类定义中的生成器方法定义\n// (类声明或类表达式)\nclass MyClass {\n  *generatorMethod()\
  \ {\n    // ...\n  }\n}\n```\n\n星号 (`*`) 将函数和方法标记为生成器：\n\n*   函数：伪关键字 `function*`\
  \ 是关键字 `function` 和星号的组合。\n*   方法：`*` 是一个修饰符（类似于 `static` 和 `get`）。\n\n### 38.1.1\
  \ 生成器函数返回可迭代对象并通过 `yield` 填充它们\n\n如果你调用一个生成器函数，它会返回一个可迭代对象（实际上是一个也是可迭代的迭代器）。生成器通过\
  \ `yield` 运算符填充该可迭代对象：\n\n\n\n\n\n```javascript\nfunction* genFunc1() {\n  yield\
  \ 'a';\n  yield 'b';\n}\n\nconst iterable = genFunc1();\n// 将可迭代器转换为数组，以检查内部内容：\n\
  assert.deepEqual([...iterable], ['a', 'b']);\n\n// 你也可以使用 for-of 循环\nfor (const\
  \ x of genFunc1()) {\n  console.log(x);\n}\n// 输出:\n// 'a'\n// 'b'\n```\n\n### 38.1.2\
  \ `yield` 会暂停生成器函数\n\n使用生成器函数涉及以下步骤：\n\n* 调用该函数会返回一个迭代器 `iter`（它本身也是一个可迭代对象）。\n\
  * 重复迭代 `iter` 会反复调用 `iter.next()`。每次调用，它都会进入生成器函数的体内，直到遇到一个返回值的 `yield`。\n\n因此，`yield`\
  \ 的作用并不仅仅是向可迭代对象添加值——它还会暂停并退出生成器函数：\n\n* 像 `return` 一样，`yield` 会退出函数体并返回一个值（通过 `.next()`）。\n\
  * 与 `return` 不同，如果重复调用（`.next()`），执行将直接从 `yield` 之后的地方恢复。\n\n让我们通过下面的生成器函数来检查这意味着什么。\n\
  \n```javascript\nlet location = 0;\nfunction* genFunc2() {\n  location = 1; yield\
  \ 'a';\n  location = 2; yield 'b';\n  location = 3;\n}\n```\n\n为了使用 `genFunc2()`，我们必须先创建一个迭代器/可迭代对象\
  \ `iter`。此时 `genFunc2()` 暂停在它的函数体“之前”。\n\n```javascript\nconst iter = genFunc2();\n\
  // genFunc2() 现在暂停在函数体“之前”：\nassert.equal(location, 0);\n```\n\n`iter` 实现了迭代协议。因此，我们通过\
  \ `iter.next()` 来控制 `genFunc2()` 的执行。调用该方法会恢复暂停的 `genFunc2()` 并执行它，直到遇到 `yield`。然后执行暂停，`.next()`\
  \ 返回 `yield` 的操作数：\n\n```javascript\nassert.deepEqual(\n  iter.next(), {value: 'a',\
  \ done: false});\n// genFunc2() 现在暂停在第一个 yield 之后：\nassert.equal(location, 1);\n\
  ```\n\n注意，产出的值 `'a'` 被封装在一个对象中，这是迭代器始终传递其值的方式。\n\n我们再次调用 `iter.next()`，执行从之前暂停的地方继续。当我们遇到第二个\
  \ `yield` 时，`genFunc2()` 暂停，`.next()` 返回产出的值 `'b'`。\n\n```javascript\nassert.deepEqual(\n\
  \  iter.next(), {value: 'b', done: false});\n// genFunc2() 现在暂停在第二个 yield 之后：\n\
  assert.equal(location, 2);\n```\n\n我们再次调用一次 `iter.next()`，执行一直持续到离开 `genFunc2()`\
  \ 的函数体：\n\n```javascript\nassert.deepEqual(\n  iter.next(), {value: undefined, done:\
  \ true});\n// 我们已经到达 genFunc2() 的结束：\nassert.equal(location, 3);\n```\n\n这一次，`.next()`\
  \ 结果的属性 `.done` 为 `true`，这意味着迭代器已完成。\n\n### 38.1.3 为什么 `yield` 会暂停执行？\n\n`yield`\
  \ 暂停执行有什么好处？为什么它不像简单的像数组方法 `.push()` 那样工作并向可迭代对象填充值而不暂停？\n\n由于暂停机制，生成器提供了协程的许多特性（想象成协作多任务的进程）。例如，当你请求可迭代对象的下一个值时，该值是按需计算（懒性）的。以下两个生成器函数演示了这意味着。\n\
  \n```javascript\n/**\n * 返回关于行的可迭代对象\n */\nfunction* genLines() {\n  yield 'A line';\n\
  \  yield 'Another line';\n  yield 'Last line';\n}\n\n/**\n * 输入：行的可迭代对象\n * 输出：带编号行的可迭代对象\n\
  \ */\nfunction* numberLines(lineIterable) {\n  let lineNumber = 1;\n  for (const\
  \ line of lineIterable) { // 输入\n    yield lineNumber + ': ' + line; // 输出\n   \
  \ lineNumber++;\n  }\n}\n```\n\n注意 `numberLines()` 中的 `yield` 出现在 `for-of` 循环内部。`yield`\
  \ 可以用于循环内部，但不能用于回调函数内部（稍后详述）。\n\n让我们结合这两个生成器来产生可迭代对象 `numberedLines`：\n\n```javascript\n\
  const numberedLines = numberLines(genLines());\nassert.deepEqual(\n  numberedLines.next(),\
  \ {value: '1: A line', done: false});\nassert.deepEqual(\n  numberedLines.next(),\
  \ {value: '2: Another line', done: false});\n```\n\n在这里使用生成器的关键优势是一切都是增量工作的：通过 `numberedLines.next()`，我们只向\
  \ `numberLines()` 请求一个带编号的行。反之，它只向 `genLines()` 请求一个未编号的行。\n\n这种增量机制会继续有效，例如，如果\
  \ `genLines()` 从一个大文件中读取行：如果我们向 `numberLines()` 请求带编号的行，只要 `genLines()` 有第一行，我们就能立即得到。如果没有生成器，`numberLines()`\
  \ 将先读取所有行，然后 `numberLines()` 再返回它们。因此，我们必须等待直到获取第一行。\n\n### 38.1.4 示例：对可迭代对象进行映射\n\
  \n以下函数 `map()` 类似于 `.map()` 方法，但它返回的是一个可迭代对象而不是数组，并且按需产生结果。\n\n```javascript\nfunction*\
  \ map(iterable, func) {\n  let index = 0;\n  for (const x of iterable) {\n    yield\
  \ func(x, index);\n    index++;\n  }\n}\nconst iterable = map(['a', 'b'], x => x\
  \ + x);\nassert.deepEqual([...iterable], ['aa', 'bb']);\n```\n\n### 38.2 调用生成器\n\
  \n#### 38.2.1 通过 `yield*`\n\n让我们先检查一下*不起作用*的：我们到为止还没看到。遗憾的是，一种简单的方法失败了：\n\n```javascript\n\
  function* bar() {\n  yield 'a';\n  yield 'b';\n}\nfunction* foo() {\n  // 如果调用 bar():什么都不会发生：\n\
  \  bar();\n}\nassert.deepEqual([...foo()], []);\n```\n\n为什么这不起通？函数调用 `bar()` 返回一个可迭代对象，而我们忽略了它。\n\
  \n我们想要的是 `foo()` 产出 `bar()` 所产出的所有内容。这正是 `yield*` 运算符的作用：\n\n```javascript\nfunction*\
  \ bar() {\n  yield 'a';\n  yield 'b';\n}\nfunction* foo() {\n  yield* bar();\n}\n\
  assert.deepEqual([...foo()], ['a', 'b']);\n```\n\n换句话说，之前的 `foo()` 大约等于：\n\n```javascript\n\
  function* foo() {\n  for (const x of bar()) {\n    yield x;\n  }\n}\n```\n\n注意 `yield*`\
  \ 可以与任何可迭代对象：\n\n```javascript\nfunction* gen() {\n  yield* [1, 2];\n}\nassert.deepEqual([...gen()],\
  \ [1, 2]);\n```\n\n### 38.2.2 示例：遍历树\n\n\n\n\n\n`yield*` 允许我们在生成器中进行递归调用，这在遍历树等递归数据结构时非常有用。以以下二叉树的数据结构为例：\n\
  \n```javascript\nclass BinaryTree {\n  constructor(value, left=null, right=null)\
  \ {\n    this.value = value;\n    this.left = left;\n    this.right = right;\n \
  \ }\n\n  /** 前序遍历：父节点在子节点之前 */\n  [Symbol.iterator]() {\n    yield this.value;\n\
  \    if (this.left) {\n      // 等同于 yield* this.left[Symbol.iterator]()\n      yield*\
  \ this.left;\n    }\n    if (this.right) {\n      yield* this.right;\n    }\n  }\n\
  }\n```\n\n方法 `[Symbol.iterator]()` 为迭代协议的支持，这意味着我们可以使用 `for-of` 循环来遍历 `BinaryTree`\
  \ 的实例：\n\n```javascript\nconst tree = new BinaryTree('a',\n  new BinaryTree('b',\n\
  \    new BinaryTree('c'),\n    new BinaryTree('d')),\n  new BinaryTree('e'));\n\n\
  for (const x of tree) {\n  console.log(x);\n}\n// 输出:\n// 'a'\n// 'b'\n// 'c'\n\
  // 'd'\n// 'e'\n```\n\n![](img/file6.svg)  **练习：遍历嵌套数组**\n\n`exercises/sync-generators/iter_nested_arrays_test.mjs`\n\
  \n## 38.3 背景：外部迭代 vs 内部迭代\n\n为了准备下一节做准备，我们需要学习遍历对象“内部”值的两种不同迭代风格：\n\n*   **外部迭代（拉取\
  \ pull）**：你的代码通过迭代协议向对象请求值。例如，`for-of` 循环基于 JavaScript 的迭代协议：\n\n    ```javascript\n\
  \    for (const x of ['a', 'b']) {\n      console.log(x);\n    }\n    // 输出:\n \
  \   // 'a'\n    // 'b'\n    ```\n\n*   **内部迭代（推送 push）**：你将一个回调函数传递给对象的方法，该方法将值传递给回调。例如，数组拥有\
  \ `.forEach()` 方法：\n\n    ```javascript\n    ['a', 'b'].forEach((x) => {\n     \
  \ console.log(x);\n    });\n    // 输出:\n    // 'a'\n    // 'b'\n    ```\n\n下一节将提供这两种迭代风格的示例。\n\
  \n## 38.4 生成器的用例：复用遍历\n\n生成器的一个重要用例是提取和复用遍历。\n\n### 38.4.1 需要复用的遍历\n\n举例来说，考虑以下函数，它遍历文件树并记录它们的路径（它使用\
  \ [Node.js API](https://nodejs.org/en/docs/) 来此操作）：\n\n```javascript\nfunction logPaths(dir)\
  \ {\n  for (const fileName of fs.readdirSync(dir)) {\n    const filePath = path.resolve(dir,\
  \ fileName);\n    console.log(filePath);\n    const stats = fs.statSync(filePath);\n\
  \    if (stats.isDirectory()) {\n      logPaths(filePath); // 递归调用\n    }\n  }\n\
  }\n```\n\n考虑以下目录：\n\n```\nmydir/\n    a.txt\n    b.txt\n    subdir/\n        c.txt\n\
  ```\n\n让我们记录 `mydir/` 内部的路径：\n\n```javascript\nlogPaths('mydir');\n\n// 输出:\n//\
  \ 'mydir/a.txt'\n// 'mydir/b.txt'\n// 'mydir/subdir'\n// 'mydir/subdir/c.txt'\n\
  ```\n\n我们如何复用这种遍历并做一些记录路径以外的事？\n\n### 38.4.2 内部迭代（推送 push）\n\n复用遍历的一种方法是通过内部迭代：每个被遍历的值都会被传递给回调函数。\n\
  \n```javascript\nfunction visitPaths(dir, callback) {\n  for (const fileName of\
  \ fs.readdirSync(dir)) {\n    const filePath = path.resolve(dir, fileName);\n  \
  \  callback(filePath);\n    const stats = fs.statSync(filePath);\n    if (stats.isDirectory())\
  \ {\n      visitPaths(filePath, callback);\n    }\n  }\n}\nconst paths = [];\nvisitPaths('mydir',\
  \ p => paths.push(p));\nassert.deepEqual(paths, [\n  'mydir/a.txt',\n  'mydir/b.txt',\n\
  \  'mydir/subdir',\n  'mydir/subdir/c.txt'\n]);\n```\n\n### 38.4.3 外部迭代（拉取 pull）\n\
  \n复用遍历另一种方法是通过外部迭代：我们可以写一个生成器。\n\n```javascript\nfunction* iterPaths(dir) {\n  for\
  \ (const fileName of fs.readdirSync(dir)) {\n    const filePath = path.resolve(dir,\
  \ fileName);\n    yield filePath;\n    const stats = fs.statSync(filePath);\n  \
  \  if (stats.isDirectory()) {\n      yield* iterPaths(filePath);\n    }\n  }\n}\n\
  const paths = [...iterPaths('mydir')];\n```\n\n## 38.5 生成器的高级特性\n\n`yield*` 允许我们在生成器中进行递归调用，这在遍历树等递归数据结构时非常有用。以以下二叉树的数据结构为例：\n\
  \n```javascript\nclass BinaryTree {\n  constructor(value, left=null, right=null)\
  \ {\n    this.value = value;\n    this.left = left;\n    this.right = right;\n \
  \ }\n\n  /** 前序遍历：父节点在子节点之前 */\n  [Symbol.iterator]() {\n    yield this.value;\n\
  \    if (this.left) {\n      // 等同于 yield* this.left[Symbol.iterator]()\n      yield*\
  \ this.left;\n    }\n    if (this.right) {\n      yield* this.right;\n    }\n  }\n\
  }\n```\n\n方法 `[Symbol.iterator]()` 为迭代协议的支持，这意味着我们可以使用 `for-of` 循环来遍历 `BinaryTree`\
  \ 的实例：\n\n```javascript\nconst tree = new BinaryTree('a',\n  new BinaryTree('b',\n\
  \    new BinaryTree('c'),\n    new BinaryTree('d')),\n  new BinaryTree('e'));\n\n\
  for (const x of tree) {\n  console.log(x);\n}\n// 输出:\n// 'a'\n// 'b'\n// 'c'\n\
  // 'd'\n// 'e'\n```\n\n\n\n\n普通函数是`同步的`：调用者会等待被调用者完成其计算。行 A 中的 `divideSync()` 是一个同步函数调用：\n\
  \n```\n[](#cb1015-1)function main() {\n[](#cb1015-2)  try {\n[](#cb1015-3)    const\
  \ result = divideSync(12, 3); // (A)\n[](#cb1015-4)    assert.equal(result, 4);\n\
  [](#cb1015-5)  } catch (err) {\n[](#cb1015-6)    assert.fail(err);\n[](#cb1015-7)\
  \  }\n[](#cb1015-8)}\n```\n\n### 39.1.2 JavaScript 在单进程中顺序执行任务\n\n默认情况下，JavaScript\
  \ `tasks` 是在单进程中按顺序执行的函数。它们看起来像这样：\n\n```\n[](#cb1016-1)while (true) {\n[](#cb1016-2)\
  \  const task = taskQueue.dequeue();\n[](#cb1016-3)  task(); // run task\n[](#cb1016-4)}\n\
  ```\n\n这个循环也被称为 `event loop`（事件循环），因为事件（如点击鼠标）会将任务添加到队列中。\n\n由于这种协作式多任务的风格，我们不希望某个任务阻塞其他任务的执行，例如当它正在等待来自服务器的结果时。下一个小节将探讨如何处理这种情况。\n\
  \n### 39.1.3 基于回调的异步函数\n\n如果 `divide()` 需要服务器来计算它的结果呢？那么结果应该以不同的方式交付：调用者不应该（同步地）等待直到结果就绪；当结果就绪时，应该通知它（异步）。异步交付结果的一种方法是给\
  \ `divide()` 一个回调函数，它使用该函数来通知调用者。\n\n```\n[](#cb1017-1)function main() {\n[](#cb1017-2)\
  \  divideCallback(12, 3,\n[](#cb1017-3)    (err, result) => {\n[](#cb1017-4)   \
  \   if (err) {\n[](#cb1017-5)        assert.fail(err);\n[](#cb1017-6)      } else\
  \ {\n[](#cb1017-7)        assert.equal(result, 4);\n[](#cb1017-8)      }\n[](#cb1017-9)\
  \    });\n[](#cb1017-10)}\n```\n\n当存在异步函数调用时：\n\n```\n[](#cb1018-1)divideCallback(x,\
  \ y, callback)\n```\n\n随后会发生以下步骤：\n\n*   `divideCallback()` 向服务器发送请求。\n\n*   然后当前任务\
  \ `main()` 完成，可以执行其他任务。\n\n*   当来自服务器的响应到达时，它是以下情况之一：\n\n    *   一个错误 `err`：那么下一个任务会被添加到队列中。\n\
  \n        ```\n        [](#cb1019-1)taskQueue.enqueue(() => callback(err));\n  \
  \      ```\n\n    *   一个结果 `r`：那么下一个任务会被添加到队列中。\n\n        ```\n        [](#cb1020-1)taskQueue.enqueue(()\
  \ => callback(null, r));\n        ```\n\n### 39.1.4 基于 Promise 的异步函数\n\nPromise\
  \ 包含两个东西：\n\n*   一种标准模式，使得处理回调变得更简单。\n\n*   构建 `async functions`（异步函数，下一个小节的主题）的基础机制。\n\
  \n调用一个基于 Promise 的函数如下：\n\n```\n[](#cb1021-1)function main() {\n[](#cb1021-2)  dividePromise(12,\
  \ 3)\n[](#cb1021-3)    .then(result => assert.equal(result, 4))\n[](#cb1021-4) \
  \   .catch(err => assert.fail(err));\n[](#cb1021-5)}\n```\n\n### 39.1.5 Async functions\n\
  \n看待异步函数的一种方式是作为基于 Promise 代码的更好的语法：\n\n```\n[](#cb1022-1)async function main()\
  \ {\n[](#cb1022-2)  try {\n[](#cb1022-3)    const result = await dividePromise(12,\
  \ 3); // (A)\n[](#cb1022-4)    assert.equal(result, 4);\n[](#cb1022-5)  } catch\
  \ (err) {\n[](#cb1022-6)    assert.fail(err);\n[](#cb1022-7)  }\n[](#cb1022-8)}\n\
  ```\n\n我们在行 A 中调用的 `dividePromise()` 与上一节中的基于 Promise 函数相同。但现在我们有了看起来同步的语法来处理该调用。`await`\
  \ 只能在一种特殊的函数中使用，即 `async function`（注意 `function` 关键字前面的 `async` 关键字）。`await` 会暂停当前的异步函数并从其返回。一旦等待的结果就绪，函数的执行将从上次停止的地方继续。\n\
  \n### 39.1.6 下一步工作\n\n*   在本章中，我们将看到同步函数调用是如何工作的。我们还将探索 JavaScript 通过其 `event loop`\
  \ 在单进程中执行代码的方式。\n\n*   本章也描述了通过回调实现的异步性。\n\n*   后续章节涵盖了 Promises 和 async functions。\n\
  \n*   系列关于异步编程的章节以关于异步迭代的章节结束，该章节与同步迭代 相似，但迭代值是异步交付的。\n\n## 39.2 调用栈 (call stack)\n\
  \n每当一个函数调用另一个函数时，我们都需要记住在后函数完成后返回哪里。这通常通过一个栈来实现——即 `call stack`（调用栈）：调用者将其要返回的位置推入栈中，而被调用者在完成后跳转到该位置。\n\
  \n这是一个发生了多次调用的示例：\n\n```\n[](#cb1023-1)function h(z) {\n[](#cb1023-2)  const error\
  \ = new Error();\n[](#cb1023-3)  console.log(error.stack);\n[](#cb1023-4)}\n[](#cb1023-5)function\
  \ g(y) {\n[](#cb1023-6)  h(y + 1);\n[](#cb1023-7)}\n[](#cb1023-8)function f(x) {\n\
  [](#cb1023-9)  g(x + 1);\n[](#cb1023-10)}\n[](#cb1023-11)f(3);\n[](#cb1023-12)//\
  \ done\n```\n\n最初，在运行这段代码之前，调用栈是空的。在第 11 行的函数调用 `f(3)` 后，栈有一个条目：\n\n*   第 12 行（顶层作用域中的位置）\n\
  \n在第 9 行的函数调用 `g(x + 1)` 后，栈有两个条目：\n\n*   第 10 行（`f()` 中的位置）\n*   第 12 行\n\n在第 6\
  \ 行的函数调用 `h(y + 1)` 后，栈有三个条目：\n\n*   第 7 行（`g()` 中的位置）\n*   第 10 行（`f()` 中的位置）\n\
  *   第 12 行\n\n在第 3 行打印 `error` 会产生以下输出：\n\n```\nError: \n    at h (async-js/stack_trace.mjs:2:17)\n\
  \    at g (async-js/stack_trace.mjs:6:3)\n    at f (async-js/stack_trace.mjs:9:3)\n\
  \    at async-js/stack_trace.mjs:11:1\n```\n\n这是 `Error` 对象创建位置的所谓 `stack trace`。注意它记录的是调用，而不是返回。在第\
  \ 2 行创建异常是另一次调用。在第 3 行之后，每个一个条目都会从调用栈中移除。当函数 `f` 完成，我们回到作用域且栈是空的。当代码片段结束时就像隐式的 `return`。\n\
  \n## 39.4 如何避免阻塞 JavaScript 进程\n\n\n\n\n\n### 39.4.1 浏览器的用户界面可能会阻塞\n\n浏览器的许多用户界面机制也运行在\
  \ JavaScript 进程中（作为任务）。因此，长时间运行的 JavaScript 代码可能会阻塞用户界面。让我们来看一个演示这一点的网页。你有两种方法可以尝试该页面：\n\
  \n* 你可以[在线运行](http://rauschma.github.io/async-examples/blocking.html)。\n* 你可以在包含练习题的仓库中打开以下文件：`demos/async-js/blocking.html`\n\
  \n以下 HTML 是该页面的用户界面：\n\n```\n[](#cb1026-1)<a id=\"block\" href=\"\">Block</a>\n\
  [](#cb1026-2)<div id=\"statusMessage\"></div>\n[](#cb1026-3)<button>Click me!</button>\n\
  ```\n\n原理是：当你点击“Block（阻塞）”，将通过 JavaScript 执行一个长时间运行的循环。在循环期间，你无法点击按钮，因为浏览器/JavaScript\
  \ 进程被阻塞了。\n\nJavaScript 代码的简化版本如下：\n\n```\n[](#cb1027-1)document.getElementById('block')\n\
  [](#cb1027-2)  .addEventListener('click', doBlock); // (A)\n[](#cb1027-3)\n[](#cb1027-4)function\
  \ doBlock(event) {\n[](#cb1027-5)  // ···\n[](#cb1027-6)  displayStatus('Blocking...');\n\
  [](#cb1027-7)  // ···\n[](#cb1027-8)  sleep(5000); // (B)\n[](#cb1027-9)  displayStatus('Done');\n\
  [](#cb1027-10)}\n[](#cb1027-11)\n[](#cb1027-12)function sleep(milliseconds) {\n\
  [](#cb1027-13)  const start = Date.now();\n[](#cb1027-14)  while ((Date.now() -\
  \ start) < milliseconds);\n[](#cb1027-15)}\n[](#cb1027-16)function displayStatus(status)\
  \ {\n[](#cb1027-17)  document.getElementById('statusMessage')\n[](#cb1027-18)  \
  \  .textContent = status;\n[](#cb1027-19)}\n```\n\n这些是代码的关键部分：\n\n* 行 A：我们告诉浏览器每当\
  \ ID 为 `block` 的 HTML 元素被点击时，调用 `doBlock()`。\n* `doBlock()` 显示状态信息，然后调用 `sleep()`\
  \ 阻塞 JavaScript 进程 5000 毫秒（行 B）。\n* `sleep()` 通过循环直到足够的时间通过来阻塞 JavaScript 进程。\n\
  * `displayStatus()` 在 ID 为 `statusMessage` 的 `<div>` 中显示状态消息。\n\n### 39.4.2 如何避免阻塞浏览器？\n\
  \n有几种方法可以防止长时间运行的操作阻塞浏览器：\n\n* 操作可以*异步地*交付其结果：：某些操作（例如下载）可以与 JavaScript 进程并发执行。触发此类操作的\
  \ JavaScript 代码会注册一个回调，一旦操作完成，该回调将带有结果被调用。调用通过任务队列处理。这种交付结果风格被称为*异步*，因为调用者不需要等待结果准备绪。普通函数调用同步地交付其结果。\n\
  * 在单独的进程中执行长时间计算：可以通过所谓的 *Web Workers* 实现。Web Workers 是与主进程并发运行的重量级进程。每个 Web Worker\
  \ 都有自己的运行时环境（全局变量等）。它们是完全隔离的，必须通过消息传递进行通信。请参考 [MDN Web Docs](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API)\
  \ 获取更多信息。\n* 在长时间计算期间进行休息。下一个小节将解释如何做到。\n\n### 39.4.3 休息\n\n以下全局函数在延迟 `ms` 毫秒后执行其参数\
  \ `callback`（类型签名经过简化的——`setTimeout()` 具有更多功能）：\n\n```\n[](#cb1028-1)function setTimeout(callback:\
  \ () => void, ms: number): any\n```\n\n该函数返回一个*句柄*（ID），可以通过以下全局函数来*清除*超时（取消回调的执行）：\n\
  \n```\n[](#cb1029-1)function clearTimeout(handle?: any): void\n```\n\n`setTimeout()`\
  \ 在浏览器和 Node.js 中均可用。下一个小节将展示它的用法。\n\n![](img/file2.svg) **`setTimeout()` 让任务得以休息**\n\
  \n查看 `setTimeout()` 的另一种方式是：当前任务休息，并在稍后通过回调继续。\n\n### 39.4.4 运行到完成的语义\n\nJavaScript\
  \ 为任务提供了一种保证：\n\n> 每个任务在执行下一个任务之前总是会完成（“运行到完成”）。\n\n结果是，任务不需要担心在处理数据时数据正在被更改（*并发修改*）。这简化了\
  \ JavaScript 中的编程。\n\n接下来的示例演示了这一保证：\n\n```\n[](#cb1030-1)console.log('start');\n\
  [](#cb1030-2)setTimeout(() => {\n[](#cb1030-3)  console.log('callback');\n[](#cb1030-4)},\
  \ 0);\n// 输出：\n// start\n// end\n// callback\n```\n\n`setTimeout()` 将任务放入任务队列，在当前代码片段结束之后才执行。`ms`\
  \ 参数仅指定了它何时进入队列，而不是它何时运行。即使 `ms` 为 `0`，它也会在当前代码完成之后运行。\n\n### 39.5 交付结果的模式\n\n为了防止在等待长时间运行的操作完成时阻塞主进程，结果通常以异步方式交付。有三种流行的模式：\n\
  \n* 事件\n* 回调\n* Promise\n\n前两种模式将在接下来的小节中解释。Promise 将后续章节解释。\n\n### 39.5.1 通过事件交付结果\n\
  \n事件作为一种模式的工作如下：\n\n* 它们用于异步交付值。\n* 可以执行一次或多次。\n* 该模式中有三个角色：\n    * *事件*（一个对象）携带交付的数据。\n\
  \    * *事件监听器*是通过参数接收事件的函数。\n    * *事件源*发送事件并允许注册事件监听器。\n\nJavaScript 世界中存在这种模式的多种变体。我们来看三个示例。\n\
  \n#### 39.5.1.1 事件：IndexedDB\n\nIndexedDB 是内置在浏览器中的数据库。这是使用它的示例：\n\n```\n[](#cb1031-1)const\
  \ openRequest = indexedDB.open('MyDatabase', 1); // (A)\n[](#cb1031-2)\n[](#cb1031-3)openRequest.onsuccess\
  \ = (event) => {\n[](#cb1031-4)  const db = event.target.result;\n[](#cb1031-5)\
  \  // ···\n[](#cb1031-6)};\n[](#cb1031-7)\n[](#cb1031-8)openRequest.onerror = (error)\
  \ => {\n[](#cb1031-9)  console.error(error);\n[](#cb1031-10)};\n```\n\n`indexedDB`\
  \ 调用操作有一种异常的方式：\n\n* 每个操作都有关联创建*请求对象*的方法。例如，在行 A 中，操作是“open”，方法是 `.open()`，请求对象是\
  \ `openRequest`。\n* 操作参数通过请求对象提供，而不是通过方法的参数。例如，事件监听器（函数）存储在 `.onsuccess` 和 `.onerror`\
  \ 属性中。\n* 操作的调用是通过方法添加到任务队列的（在行 A 中）。这意味着我们在调用已添加到队列之后才对其进行配置。只有运行到完成的语义才能让我们免受竞态条件的影响，并确保操作在当前代码片段结束之后运行。\n\
  \n#### 39.5.1.2 事件：`XMLHttpRequest`\n\n`XMLHttpRequest` API 允许我们在 浏览器内部进行下载。这是我们下载\
  \ `http://example.com/textfile.txt` 文件的方法：\n\n\n\n\n```\nconst xhr = new XMLHttpRequest();\
  \ // (A)\nxhr.open('GET', 'http://example.com/textfile.txt'); // (B)\nxhr.onload\
  \ = () => { // (C)\n  if (xhr.status == 200) {\n    processData(xhr.responseText);\n\
  \  } else {\n    assert.fail(new Error(xhr.statusText));\n  }\n};\nxhr.onerror =\
  \ () => { // (D)\n  assert.fail(new Error('Network error'));\n};\nxhr.send(); //\
  \ (E)\n\nfunction processData(str) {\n  assert.equal(str, 'Content of textfile.txt\\\
  n');\n}\n```\n\n使用此 API，我们首先创建一个请求对象（行 A），然后对其进行配置，最后激活它（行 E）。配置包括：\n\n*   指定使用哪种\
  \ HTTP 请求方法（行 B）：`GET`、`POST`、`PUT` 等。\n*   注册一个监听器（行 C），如果可以下载内容，该监听器会被通知。在监听器内部，我们仍然需要判断下载的内容是否包含我们请求的数据，或者是否发生了错误。注意，部分结果数据是通过请求对象\
  \ `xhr` 传递的。（我不喜欢这种输入和输出数据混合的方式。）\n*   注册一个监听器（行 D），如果发生网络错误，该监听器会被通知。\n\n#### 39.5.1.3\
  \ 事件：DOM\n\n我们已经从 §39.4.1 “浏览器用户界面可能会阻塞` 中看到过 DOM 事件的运行。以下代码也处理了 `click` 事件：\n\n\
  ```\nconst element = document.getElementById('my-link'); // (A)\nelement.addEventListener('click',\
  \ clickListener); // (B)\n\nfunction clickListener(event) {\n  event.preventDefault();\
  \ // (C)\n  console.log(event.shiftKey); // (D)\n}\n```\n\n我们首先请求浏览器获取 ID 为 `'my-link'`\
  \ 的 HTML 元素（行 A）。然后我们为所有的 `click` 事件添加一个监听器（行 B）。在监听器中，我们首先告诉浏览器不要执行默认操作（行 C）——跳转到链接目标。然后，如果当前按下了\
  \ Shift 键，我们就在控制台打印日志（行 D）。\n\n### 39.5.2 通过回调函数传递异步结果\n\n回调是处理异步结果的另一种模式。它们仅用于一次性结果，其优点是比事件更简洁。\n\
  \n例如，考虑一个函数 `readFile()`，它读取一个文本文件并异步返回其内容。如果使用 Node.js 风格的回调，如下调用 `readFile()`：\n\
  \n```\nreadFile('some-file.txt', {encoding: 'utf8'},\n  (error, data) => {\n   \
  \ if (error) {\n      assert.fail(error);\n      return;\n    }\n    assert.equal(data,\
  \ 'The content of some-file.txt\\n');\n  });\n```\n\n有一个回调同时处理成功和失败。如果第一个参数不是 `null`，则发生了错误。否则，可以在第二个参数中找到结果。\n\
  \n![](img/file6.svg) **练习：基于回调的代码**\n\n以下练习使用了异步代码的测试，这与同步代码的测试不同。更多信息请参阅 §11.3.2\
  \ “AVA 中的异步测试`。\n\n*   从同步代码到基于回调的代码：`exercises/async-js/read_file_cb_exrc.mjs`\n\
  *   实现基于回调的 `.map()`：`exercises/async-js/map_cb_test.mjs`\n\n### 39.6 异步代码：缺点\n\n\
  在很多情况下，无论是在浏览器还是 Node.js 中，你都别无选择，必须使用异步代码。在本章中，我们看到了此类代码可以使用的几种模式。它们都有两个缺点：\n\n\
  *   异步代码比同步代码更冗长。\n*   如果你调用了异步代码，你的代码也必须变成异步的。这是因为你不能同步地等待异步结果。异步代码具有传染性。\n\n第一个缺点在使用了\
  \ Promises（在下一章 中介绍）后得到了缓解，并在 async 函数（在下章节 中介绍）中大部分消失。\n\n遗憾，异步代码的传染性并没有消失。但由于\
  \ async 函数可以很容易在同步和异步之间切换，这一点得到了缓解。\n\n### 39.7 资源\n\n*   [“救命，我卡在事件循环里了”](https://vimeo.com/96425312)，Philip\
  \ Roberts（视频）。\n*   [“Event loops`](https://www.w3.org/TR/html5/webappapis.html#event-loops)，HTML5\
  \ 规范中的章节。\n\n# 40 用于异步编程的 Promises\n\n* * *\n\n*   40.1 使用 Promises 的基础\n    * \
  \  40.1.1 使用基于 Promise 的函数`\n    *   40.1.2 什么是 Promise？\n    *   40.1.3 实现基于 Promise\
  \ 的函数`\n    *   40.1.4 Promise 的状态\n    *   40.1.5 `Promise.resolve()`：创建一个带有给定值的已履行\
  \ Promise`\n    *   40.1.6 `Promise.reject()`：创建一个带有给定值的拒绝的 Promise`\n\n\n\n\n##\
  \ 40.1 使用 Promises 的基础\n\nPromises 是一种异步交付结果的模式。\n\n### 40.1.1 使用基于 Promise 的函数\n\
  \n以下代码是使用基于 Promise 的函数 `addAsync()` 的示例（其实现稍后显示）：\n\n```javascript\naddAsync(3,\
  \ 4)\n  .then(result => { // 成功\n    assert.equal(result, 7);\n  })\n  .catch(error\
  \ => { // 失败\n    assert.fail(error);\n  });\n```\n\nPromises 与事件模式类似：有一个对象（一个 `Promise`），我们在其中注册回调函数：\n\
  \n* 方法 `.then()` 注册处理结果的回调函数。\n* 方法 `.catch()` 注册处理错误的回调函数。\n\n基于 Promise 的函数返回一个\
  \ `Promise`，并在完成时（如果且的话）发送一个结果或错误。该 `Promise` 将其传递给相关的回调函数。\n\n与事件模式不同，Promises\
  \ 针对一次性结果进行了优化：\n\n* 结果（或错误）会被缓存，因此在结果（或错误）发送之前或之后注册回调函数没有关系。\n* 我们可以链式调用 Promise\
  \ 方法 `.then()` 和 `.catch()`，因为它们都返回 `Promises`。这有助于按顺序调用多个异步函数。稍后会详细介绍。\n\n### 40.1.2\
  \ 什么是 Promise？\n\n什么是 `Promise`？有两种方式来看待它：\n\n* 一方面，它是最终将交付的最终结果的占位符或容器。\n* 另一方面，它是一个允许我们注册监听器的对象。\n\
  \n### 40.1.3 实现基于 Promise 的函数\n\n这是一个基于 Promise 的函数的实现，用于相加两个数字 `x` 和 `y`：\n\n```javascript\n\
  function addAsync(x, y) {\n  return new Promise(\n    (resolve, reject) => { //\
  \ (A)\n      if (x === undefined || y === undefined) {\n        reject(new Error('Must\
  \ provide two parameters'));\n      } else {\n        resolve(x + y);\n      }\n\
  \    });\n}\n```\n\n`addAsync()` 立即调用 `Promise` 构造函数。该函数的实际实现位于传递给该构造函数的调中（行 A）。该回调提供了两个函数：\n\
  \n* `resolve` 用于交付结果（在成功的情况下）。\n* `reject` 用于交付错误（在失败的情况下）。\n\n### 40.1.4 Promise\
  \ 的状态\n\n![](img/file40.svg)\n\n图 31：一个 Promise 可以处于三种状态之一：等待中（pending）、已完成（fulfilled）或已拒绝（rejected）。如果一个\
  \ `Promise` 处于最终（非等待）状态，则被称为 `settled`（已确定）。\n\n图 31 描述了 `Promise` 可能处于的三种状态。Promises\
  \ 专注于一次性结果，并保护我们免受竞态条件的影响（注册太早或太晚）：\n\n* 如果我们过早注册了 `.then()` 回调或 `.catch()` 回调，它会在\
  \ `Promise` 状态确定后立即收到通知。\n* 一旦 `Promise` 状态确定，状态值（结果或错误）就会被缓存。因此，如果在定格后调用 `.then()`\
  \ 或 `.catch()`，它们将接收到缓存的值。\n\n此外，一旦 `Promise` 状态确定，它的状态和状态值就不能再改变。这有助于使代码具有可预测性，并强制了\
  \ Promises 的一次性本质。\n\n![](img/file5.svg)\n\n某些 Promises 永远不会处于确定状态\n\n`Promise`\
  \ 可能永远不会处于状态。例如：\n\n```javascript\nnew Promise(() {})\n```\n\n### 40.1.5 Promise.resolve():创建一个带有给定值已完成的\
  \ Promise\n\n`Promise.resolve(x)` 创建一个以值 `x` 已完成的 `Promise`：\n\n```javascript\n\
  Promise.resolve(123)\n  .then(x => {\n    assert.equal(x, 123);\n  });\n```\n\n\
  如果参数已经是一个 `Promise`，则原样返回：\n\n```javascript\nconst abcPromise = Promise.resolve('abc');\n\
  assert.equal(abcPromise, abc);\n```\n\n因此，给定任意任意值 `x`，我们可以使用 `Promise.resolve(x)`\
  \ 来确保我们有一个 `Promise`。注意，名称是 `resolve` 而不是 `fulfill`，因为如果参数是一个被拒绝的 Promise，`.resolve()`\
  \ 将返回一个被拒绝的 `Promise`。\n\n### 40.1.6 Promise.reject():创建一个带有给定值被拒绝的 Promise\n\n\
  `Promise.reject(err)` 创建一个以值 `err` 被拒绝的 `Promise`：\n\n```javascript\nconst myError\
  \ = new Error('My error!');\nPromise.reject(myError)\n  .catch(err => {\n    assert.equal(err,\
  \ myError);\n  });\n```\n\n### 40.1.7 在 .then() 回调中返回和抛出\n\n`.then()` 处理完成的情况。它还返回一个新的\
  \ `Promise`。该 `Promise` 如何确定取决于回调内部发生了什么。让我们来看这三种情况。\n\n#### 40.1.7.1 返回非 Promise\
  \ 值\n\n首先，回调可以返回一个非 Promise 值。因此，`.then()` 返回的 `Promise` 将以该值已完成（如行 B 所示）：\n\n```javascript\n\
  Promise.resolve('abc')\n  .then(str => {\n    return str; // (A)\n  })\n  .then(str2\
  \ => {\n    assert.equal(str2, 'abc'); // (B)\n  });\n```\n\n#### 40.1.7.2 返回 Promise\n\
  \n其次，回调返回一个 Promise `p`（行 A）。因此，`.then()` 返回的 `Promise` 被 `p` 替换。换句话：`.then()` 已经返回的\
  \ `Promise` 实际上被 `p` 替换了。\n\n```javascript\nPromise.resolve('abc')\n  .then(str\
  \ => {\n    return Promise.resolve(123); // (A)\n  })\n  .then(num => {\n    assert.equal(num,\
  \ 123);\n  });\n```\n\n#### 40.1.7.3 抛出异常\n\n第三，回调可以抛出一个异常。因此，`.then()` 返回的 `Promise`\
  \ 被该异常拒绝。这意味着同步错误被转换成了异步错误。\n\n```javascript\nconst myError = new Error('My error!');\n\
  Promise.resolve('abc')\n  .then(str => {\n    throw myError;\n  })\n  .catch(err\
  \ => {\n    assert.equal(err, myError);\n  });\n```\n\n### 40.1.8 .catch() 及其回调\n\
  \n`.then()` 和 `.catch()` 唯一区别是后者由拒绝触发，而不是完成。然而，这两种方法都以相同的方式将其回调的操作转换为 Promise。例如，在下面的代码中，行\
  \ A 中 `.catch()` 回调返回的值成为一个完成值：\n\n```javascript\nconst err = new Error();\nPromise.reject(err)\n\
  \  .catch(e => {\n    assert.equal(e, err);\n    // 发生了错误，使用默认值\n    return 'default\
  \ value'; // (A)\n  })\n  .then(str => {\n    assert.equal(str, 'default value');\n\
  \  });\n```\n\n### 40.1.9 链式调用方法\n\n`.then()` 和 `.catch()` 总是返回 Promise。这允许我们创建任意长度的方法调用链：\n\
  \n\n\n\n\n```javascript\nfunction myAsyncFunc() {\n  return asyncFunc1() // (A)\n\
  \    .then(result1 => {\n      // ···\n      return asyncFunc2(); // a Promise\n\
  \    })\n    .then(result2 => {\n      // ···\n      return result2 || '(Empty)';\
  \ // not a Promise\n    })\n    .then(result3 => {\n      // ···\n      return asyncFunc4();\
  \ // a Promise\n    });\n}\n```\n\n由于链式调用，行 A 中的 `return` 返回的是最后一个 `.then()` 的结果。\n\
  \n在某种程度上，`.then()` 是同步分号的异步版本：\n\n*   `.then()` 按顺序执行两个异步操作。\n*   分号按顺序执行两个同步操作。\n\
  \n我们还可以将 `.catch()` 加入到其中，并让它同时处理多个错误源：\n\n```javascript\nasyncFunc1()\n  .then(result1\
  \ => {\n    // ···\n    return asyncFunction2();\n  })\n  .then(result2 => {\n \
  \   // ···\n  })\n  .catch(error => {\n    // 失败：处理 asyncFunc1(), asyncFunc2()\n\
  \    // 以及任何在之前的回调中抛出的（同步）异常\n  });\n```\n\n### 40.1.10 Promises 的优势\n\n在处理一次性结果时，这些是\
  \ Promises 相比于普通回调的一些优势：\n\n*   基于 Promise 的函数和方法的类型签名更简洁：如果一个函数是基于回调的，某些参数是关于输入的，而末尾的一个或两个回调是关于输出的。使用\
  \ Promises，所有与输出相关的都通过返回值来处理。\n*   链式处理异步步骤变得更加方便。\n*   Promises 同时处理异步错误（通过拒绝/rejections）和同步错误：在\
  \ `new Promise()`、`.then()` 和 `.catch()` 的回调内部，异常会被转换为拒绝。相比之下，如果我们使用回调来处理异步，异常通常不会由我们自动处理；我们必须自己处理。\n\
  *   Promises 是一个单一的标准，正在缓慢地取代几种互不兼容的替代方案。例如，在 Node.js 中，许多函数现在都有基于 Promise 的版本。新的异步浏览器\
  \ API 通常也是基于 Promise 的。\n\nPromises 最大的优势之一在于不需要直接操作它们：它们 `async functions` 的基础，是一种用于执行异步计算的同步外观语法。异步函数在下一章中介绍。\n\
  \n### 40.2 示例\n\n看到 Promises 的运行有助于理解它们。让我们来看一些示例。\n\n### 40.2.1 Node.js: 异步读取文件\n\
  \n考虑以下文本文件 `person.json`，其中包含 JSON 数据：\n\n```json\n{\n  \"first\": \"Jane\",\n \
  \ \"last\": \"Doe\"\n}\n```\n\n让我们来看两个读取此文件并将其解析为对象的版本。第一个是基于回调的版本。第二个是基于 Promise\
  \ 的版本。\n\n#### 40.2.1.1 基于回调的版本\n\n以下代码读取该文件的内容并将其转换为 JavaScript 对象。它基于 Node.js\
  \ 风格的回调：\n\n```javascript\nimport * as fs from 'fs';\nfs.readFile('person.json',\n\
  \  (error, text) => {\n    if (error) { // (A)\n      // 失败\n      assert.fail(error);\n\
  \    } else {\n      // 成功\n      try { // (B)\n        const obj = JSON.parse(text);\
  \ // (C)\n        assert.deepEqual(obj, {\n          first: 'Jane',\n          last:\
  \ 'Doe',\n        });\n      } catch (e) {\n        // 无效\n        assert.fail(e);\n\
  \      }\n    }\n  });\n```\n`fs` 是一个用于文件操作 Node.js 内置模块。我们使用基于回调的 `fs.readFile()`\
  \ 来读取文件。如果成功，内容将通过 `text` 参数以字符串形式传递。注意有两个错误处理机制：行 A 中的 `if` 处理异步错误，而行 B 中的 `try`\
  \ 处理同步错误。\n\n#### 40.2.1.2 基于 Promise 的版本\n\n以下代码使用了 `asyncFunc()`，它返回一个 Promise（稍后会解释）：\n\
  \n```javascript\nasyncFunc1()\n  .then(result1 => {\n    // ···\n    return asyncFunction2();\n\
  \  })\n  .then(result2 => {\n    // ···\n  })\n  .catch(err => {\n    // 失败\n  \
  \  assert.fail(err);\n  });\n```\n注意 `XMLHttpRequest()` 的结果和错误是如何通过 `resolve()`\
  \ 和 `reject()` 处理的：成功的结果会导致返回的 Promise 被填充（行 A）。\n\n### 2.2 浏览器：`XMLHttpRequest`\n\
  \n我们之前见过用于下载数据的 `XMLHttpRequest` 事件。以下函数将该 API  Promise 化：\n\n```javascript\nfunction\
  \ httpGet(url) {\n  return new Promise(\n    (resolve, reject) => {\n      const\
  \ xhr = new XMLHttpRequest();\n      xhr.open('GET', url);\n      xhr.onload = ()\
  \ => {\n        if (xhr.status === 200) {\n          resolve(xhr.responseText);\
  \ // (A)\n        } else {\n          // 出错了 (404, 等)\n          reject(new Error(xhr.statusText));\
  \ // (B)\n        }\n      };\n      xhr.onerror = () => {\n        reject(new Error('Network\
  \ error')); // (C)\n      };\n      xhr.send();\n    }\n  );\n}\n```\n这是 `httpGet()`\
  \ 的使用方法：\n\n```javascript\nhttpGet('http://example.com/textfile.txt')\n  .then(content\
  \ => {\n    assert.equal(content, 'Content of textfile.txt\\n');\n  })\n  .catch(error\
  \ => {\n    assert.fail(error);\n  });\n```\n\n![](img/file6.svg) **练习：Promise 的超时**\n\
  \n`exercises/promises/promise_timeout_test.mjs`\n\n### 40.2.3 Node.js: `util.promisify()`\n\
  \n`util.promisify()` 是一个工具函数，可以将基于回调的函数 `f` 转换为基于 Promise 的函数。也就是说，我们正从这种类型签名：\n\
  \n```typescript\nf(arg_1, ···, arg_n, (err: Error, result: T) => void) : void\n\
  ```\n\n变为这种类型签名：\n\n```typescript\nf(arg_1, ···, arg_n) : Promise<T>\n```\n\n\n\n\
  \n\n以下代码将基于回调的 `fs.readFile()`（行 A）转换为 Promise 版本，并使用了它：\n\n```javascript\nimport\
  \ * as fs from 'fs';\nimport {promisify} from 'util';\n\nconst readFileAsync = promisify(fs.readFile);\
  \ // (A)\n\nreadFileAsync('some-file.txt', {encoding: 'utf8'})\n  .then(text =>\
  \ {\n    assert.equal(text, 'The content of some-file.txt\\n');\n  })\n  .catch(err\
  \ => {\n    assert.fail(err);\n  });\n```\n\n![](img/file6.svg) **练习：`util.promisify()`**\n\
  \n*   使用 `util.promisify()`：`exercises/promises/read_file_async_exrc.mjs`\n*   手写实现\
  \ `util.promisify()`：`exercises/promises/my_promisify_test.mjs`\n\n### 40.2.4 浏览器：Fetch\
  \ API\n\n所有现代浏览器都支持 Fetch，这是一种新的基于 Promise 的下载数据的 API。你可以将其视为 `XMLHttpRequest` 的\
  \ Promise 版本。以下是 [该 API](https://fetch.spec.whatwg.org/#fetch-api) 的节录：\n\n```typescript\n\
  interface Body {\n  text() : Promise<string>;\n  ···\n}\ninterface Response extends\
  \ Body {\n  ···\n}\ndeclare function fetch(str) : Promise<Response>;\n```\n\n这意味着我们可以如下所示使用\
  \ `fetch()`：\n\n```javascript\nfetch('http://example.com/textfile.txt')\n  .then(response\
  \ => response.text())\n  .then(text => {\n    assert.equal(text, 'Content of textfile.txt\\\
  n');\n  });\n```\n\n![](img/file6.svg) **练习：使用 Fetch API**\n\n`exercises/promises/fetch_json_test.mjs`\n\
  \n### 40.3 错误处理：不要混合使用拒绝（rejections）和异常（exceptions）\n\n实现函数和方法的规则：\n\n> 不要将（异步）拒绝和（同步）异常混合使用。\n\
  \n这使得我们的同步和异步代码更具预测性且更简单，因为我们可以始终关注单一的错误处理机制。\n\n对于基于 Promise 的函数和方法，该规则意味着它们永远不应该抛出异常。遗憾的是，很容易不小心犯这种错——例如：\n\
  \n```javascript\n// 不要这样做\nfunction asyncFunc() {\n  doSomethingSync(); // (A)\n\
  \  return doSomethingAsync()\n    .then(result => {\n      // ···\n    });\n}\n\
  ```\n\n问题在于，如果第 A 行抛出了异常，那么 `asyncFunc()` 就会抛出一个异常。该函数的调用者只期望接收到拒绝，而没有对处理异常做好准备。我们有三种方法可以修复这个问题。\n\
  \n我们可以将整个函数体封装在 `try-catch` 语句中，如果抛出异常，则返回一个被拒绝的 Promise：\n\n```javascript\n// 方案\
  \ 1\nfunction asyncFunc() {\n  try {\n    doSomethingSync();\n    return doSomethingAsync()\n\
  \      .then(result => {\n        // ···\n      });\n  } catch (err) {\n    return\
  \ Promise.reject(err);\n  }\n}\n```\n\n鉴于 `.then()` 会将异常转换为拒绝，我们可以在 `.then()` 回调内部执行\
  \ `doSomethingSync()`。为了做到这一点，我们通过 `Promise.resolve()` 启动 Promise 链。我们忽略该初始 Promise\
  \ 的完成值 `undefined`。\n\n```javascript\n// 方案 2\nfunction asyncFunc() {\n  return\
  \ Promise.resolve()\n    .then(() => {\n      doSomethingSync();\n      return doSomethingAsync();\n\
  \    })\n    .then(result => {\n      // ···\n    });\n}\n```\n\n最后，`new Promise()`\
  \ 也会将异常转换为拒绝。因此，使用这个构造函数与之前的方案类似：\n\n```javascript\n// 方案 3\nfunction asyncFunc()\
  \ {\n  return new Promise((resolve, reject) => {\n      doSomethingSync();\n   \
  \   resolve(doSomethingAsync());\n    })\n    .then(result => {\n      // ···\n\
  \    });\n}\n```\n\n### 40.4 基于 Promise 的函数同步启动，异步就绪\n\n大多数基于 Promise 的函数执行方式如下：\n\
  \n*   它们的执行立即开始，是同步的（在当前任务中）。\n*   但它们返回的 Promise 保证是异步就绪（在稍后的任务中）——如果会的话。\n\n以下代码演示了这一点：\n\
  \n```javascript\nfunction asyncFunc() {\n  console.log('asyncFunc');\n  return new\
  \ Promise(\n    (resolve, _reject) => {\n      console.log('new Promise');\n   \
  \   resolve();\n    }\n  );\n}\nasyncFunc()\n  .then(() => {\n    console.log('then()');\n\
  \  });\nconsole.log('END');\n// 输出：\n// asyncFunc\n// new Promise\n// then()\n//\
  \ END\n```\n\n### 40.5 `Promise.all()`：并发与数组\n\n#### 40.5.1 顺序执行 vs 并发执行\n\n考虑以下代码：\n\
  \n```javascript\nconst asyncFunc1 = () => Promise.resolve('one');\nconst asyncFunc2\
  \ = () => Promise.resolve('two');\n\nasyncFunc1()\n  .then(result1 => {\n    assert.equal(result1,\
  \ 'one');\n    return asyncFunc2();\n  })\n  .then(result2 => {\n    assert.equal(result2,\
  \ 'two');\n  });\n```\n\n以这种方式使用 `.then()` 会*顺序**执行基于 Promise 的函数：只有在 `asyncFunc1()`\
  \ 的结果就绪后，才会执行 `asyncFunc2()`。\n\n静态方法 `Promise.all()` 有助于更*并发*地执行基于 Promise 的函数：\n\
  \n```javascript\nPromise.all([asyncFunc1(), asyncFunc2()])\n  .then(arr => {\n \
  \   assert.deepEqual(arr, ['one', 'two']);\n  });\n```\n\n它的类型签名为：\n\n```typescript\n\
  Promise.all<T>(promises: Iterable<Promise<T>>): Promise<T[]>\n```\n\n参数 `promises`\
  \ 是 Promise 的可迭代对象。结果是一个单一的 Promise，其状态转换如下：\n\n*   当且当所有输入 Promise 都完成时，输出 Promise\
  \ 将通过包含所有完成值的数组而完成。\n*   一旦有一个输入 Promise 被拒绝，输出 Promise 就会被该输入 Promise 的拒绝值所拒绝。\n\
  \n换句话说：我们从一个 Promise 的可迭代对象变为一个数组的 Promise。\n\n#### 40.5.2 并发性提示：关注操作启动的时间\n\n判断异步代码具有“并发性”的提示：关注异步操作何时启动的，而不是关注它们的\
  \ Promise 是如何处理的。\n\n\n\n\n\n例如，以下每个函数都会并发执行 `asyncFunc1()` 和 `asyncFunc2()`，因为它们几乎是在同一时间启动的。\n\
  \n```javascript\nfunction concurrentAll() {\n  return Promise.all([asyncFunc1(),\
  \ asyncFunc2()]);\n}\n\nfunction concurrentThen() {\n  const p1 = asyncFunc1();\n\
  \  const p2 = asyncFunc2();\n  return p1.then(r1 => p2.then(r2 => [r1, r2]));\n\
  }\n```\n\n另一方面，以下两个函数按顺序执行 `asyncFunc1()` 和 `asyncFunc2()`：`asyncFunc2()` 只在 `asyncFunc1()`\
  \ 的 Promise 完成后后才被调用。\n\n```javascript\nfunction sequentialThen() {\n  return asyncFunc1()\n\
  \    .then(r1 => asyncFunc2()\n      .then(r2 => [r1, r2]));\n}\n\nfunction sequentialAll()\
  \ {\n  const p1 = asyncFunc1();\n  const p2 = p1.then(() => asyncFunc2());\n  return\
  \ Promise.all([p1, p2]);\n}\n```\n\n### 40.5.3 `Promise.all()` 是分叉合并（fork-join）\n\
  \n`Promise.all()` 与并发模式“分叉合并”松散地相关——例如：\n\n```javascript\nPromise.all([\n    //\
  \ 分叉异步计算\n    httpGet('http://example.com/file1.txt'),\n    httpGet('http://example.com/file2.txt'),\n\
  \  ])\n  // 合并异步计算\n  .then(([text1, text2]) => {\n    assert.equal(text1, 'Content\
  \ of file1.txt\\n');\n    assert.equal(text2, 'Content of file2.txt\\n');\n  });\n\
  ```\n\n`httpGet()` 是我们之前实现的 `XMLHttpRequest` 的 Promise 版本。\n\n### 40.5.4 通过 `Promise.all()`\
  \ 实现异步 `.map()`\n\n数组转换方法（如 `.map()`、`.filter()` 等）是为同步计算设计的——例如：\n\n```javascript\n\
  function timesTwoSync(x) {\n  return 2 * x;\n}\nconst arr = [1, 2, 3];\nconst result\
  \ = arr.map(timesTwoSync);\nassert.deepEqual(result, [2, 4, 6]);\n```\n\n如果 `.map()`\
  \ 的回调函数是一个基于 Promise 的函数（一个将普通值映射为 Promise 的函数）会发生什么？那么 `.map()` 的结果是一个 Promise\
  \ 数组。遗憾的是，这不是普通代码可以处理的数据。幸运的是，我们可以通过 `Promise.all()` 这个问题：它将 Promise 数组转换为一个 Promise，其解析结果为包含普通值的数组。\n\
  \n```javascript\nfunction timesTwoAsync(x) {\n  return new Promise(resolve => resolve(x\
  \ * 2));\n}\nconst arr = [1, 2, 3];\nconst promiseArr = arr.map(timesTwoAsync);\n\
  Promise.all(promiseArr)\n  .then(result => {\n    assert.deepEqual(result, [2, 4,\
  \ 6]);\n  });\n```\n\n#### 40.5.4.1 一个更真实的例子\n\n以下代码是一个更真实的例子：在分叉合并的章节中，我们有一个下载两个由固定\
  \ URL 标识的资源的示例。让我们这段代码片段转换为一个接受 URL 数组并下载相应资源的函数：\n\n```javascript\nfunction downloadTexts(urls)\
  \ {\n  const promisedTexts = urls.map(httpGet);\n  return Promise.all(promisedTexts);\n\
  }\n\ndownloadTexts([\n    'http://example.com/file1.txt',\n    'http://example.com/file2.txt',\n\
  \  ])\n  .then(texts => {\n    assert.deepEqual(\n      texts, [\n        'Content\
  \ of file1.txt\\n',\n        'Content of file2.txt\\n',\n      ]);\n  });\n```\n\
  练习：`Promise.all()` 与列出文件 `exercises/list_files_async_test.mjs`\n\n## 40.6 链式调用技巧\n\
  \n本节给出链式调用技巧。\n\n### 40.6.1 链式错误：丢失尾部\n\n问题：\n\n```javascript\nfunction foo() {\n\
  \  const promise = asyncFunc();\n  promise.then(result => {\n    // ···\n  });\n\
  \  return promise;\n}\n```\n\n计算从 `asyncFunc()` 返回的 Promise 开始。但之后，计算继续并通过通过 `.then()`\
  \ 创建了另一个 Promise。`foo()` 返回了前者，但本应返回后者。修复方法如下：\n\n```javascript\nfunction foo()\
  \ {\n  const promise = asyncFunc();\n  return promise.then(result => {\n    // ···\n\
  \  });\n}\n```\n\n### 40.6.2 链式错误：嵌套\n\n问题：\n\n```javascript\nasyncFunc1()\n  .then(result1\
  \ => {\n    return asyncFunc2()\n      .then(result2 => { // (A)\n        // ···\n\
  \      });\n  });\n```\n\nA 行 `.then()` 是嵌套的。扁平结构会更好：\n\n```javascript\nasyncFunc1()\n\
  \  .then(result1 => {\n    return asyncFunc2();\n  })\n  .then(result2 => {\n  \
  \  // ···\n  });\n```\n\n### 40.6.3 链式错误：不必要的嵌套\n\n另一个可以避免的嵌套示例：\n\n```javascript\n\
  asyncFunc1()\n  .then(result1 => {\n    if (result1 < 0) {\n      return asyncFuncA()\n\
  \        .then(resultA => 'Result: ' + resultA);\n    } else {\n      return asyncFuncB()\n\
  \        .then(resultB => 'Result: ' + resultB);\n    }\n  });\n```\n\n我们可以再次获得扁平结构：\n\
  \n```javascript\nasyncFunc1()\n  .then(result1 => {\n    return result1 < 0 ? asyncFuncA()\
  \ : asyncFuncB();\n  })\n  .then(resultAB => {\n    return 'Result: ' + resultAB;\n\
  \  });\n```\n\n### 40.6.4 并不是所有的嵌套都是坏\n\n在下面的代码中，我们实际上从嵌套中受益：\n\n```javascript\n\
  db.open()\n  .then(connection => { // (A)\n    return connection.select({ name:\
  \ 'Jane' })\n      .then(result => { // (B)\n        // 处理结果\n        // 使用 `connection`\
  \ 执行更多查询\n      })\n      // ···\n      .finally(() => {\n        connection.close();\
  \ // (C)\n      });\n  })\n```\n\n我们在 A 行接收异步结果。在 B 行，我们进行嵌套是为了在回调函数和 C 行中访问 `connection`\
  \ 变量。\n\n### 40.6.5 链式错误：创建 Promise 而不是链式\n\n问题：\n\n```javascript\nclass Model {\n\
  \  insertInto(db) {\n    return new Promise((resolve, reject) => { // (A)\n    \
  \  db.insert(this.fields)\n        .then(resultCode => {\n          this.notifyObservers({event:\
  \ 'created', model: this});\n          resolve(resultCode);\n        }).catch(err\
  \ => {\n          reject(err);\n        })\n    });\n  }\n  // ···\n}\n```\n\n在\
  \ A 行，我们创建了一个 Promise 来交付 `db.insert()` 的结果。这非常冗余，并且可以简化：\n\n```javascript\nclass\
  \ Model {\n  insertInto(db) {\n    return db.insert(this.fields)\n      .then(resultCode\
  \ => {\n        this.notifyObservers({event: 'created', model: this});\n       \
  \ return resultCode;\n      });\n  }\n  // ···\n}\n```\n\n\n\n\n核心思想是，我们不需要创建一个\
  \ `Promise`；我们可以直接返回 `.then()` 调用的结果。另一个益处是，我们不需要捕获并重新拒绝 `db.insert()` 的失败。我们只需将其拒绝状态传递给\
  \ `.insertInto()` 的调用者即可。\n\n## 40.7 进阶主题\n\n- 除了 `Promise.all()` 之外，还有 `Promise.race()`，它并不经常使用，并在\
  \ [*Exploring ES6*](https://exploringjs.com/es6/ch_promises.html#_timing-out-via-promiserace)\
  \ 中有所描述。\n- *Exploring ES6* 有一个[章节](https://exploringjs.com/es6/ch_promises.html#sec_demo-promise)\
  \ 展示了 `Promises` 的一个非常简单的实现。如果你想更深入地理解 `Promises` 的工作原理，这可能会有所帮助。\n\n# 41 异步函数\n\
  \n***\n\n粗而言之，`async functions` 为使用 `Promises` 的代码提供了更好的语法。因此，为了使用 `async` 函数，我们应该理解\
  \ `Promises`。它们在上一章中进行了解释。\n\n### 41.1 异步函数：基础\n\n考虑以下异步函数：\n\n```\nasync function\
  \ fetchJsonAsync(url) {\n  try {\n    const request = await fetch(url); // async\n\
  \    const text = await request.text(); // async\n    return JSON.parse(text); //\
  \ sync\n  }\n  catch (error) {\n    assert.fail(error);\n  }\n}\n```\n\n上述这段看起来相当同步的代码，等同于直接使用\
  \ `Promises` 的以下代码：\n\n```javascript\nfunction fetchJsonViaPromises(url) {\n  return\
  \ fetch(url) // async\n    .then(request => request.text()) // async\n    .then(text\
  \ => JSON.parse(text)) // sync\n    .catch(error => {\n      assert.fail(error);\n\
  \    });\n}\n```\n\n关于异步函数 `fetchJsonAsync()` 的几点观察：\n\n- `async` 函数用关键字 `async`\
  \ 标记。\n- 在 `async` 函数的体内部，我们编写基于 `Promise` 的代码就像它们是同步的一样。每当值为 `Promise` 时，我们只需要应用\
  \ `await` 操作符。该操作符会暂停 `async` 函数，并在 `Promise` 稳定（settled）后恢复它：\n  - 如果 `Promise`\
  \ 成功（fulfilled），`await` 返回成功的值。\n  - 如果 `Promise` 拒绝（rejected），`await` 抛出拒绝的值。\n\
  - `async` 函数的结果始终是一个 `Promise`：\n  - 任何被返回（显式或隐式）的值都用于完成该 `Promise`。\n  - 任何抛出的异常都用于拒绝该\
  \ `Promise`。\n\n`fetchJsonAsync()` 和 `fetchJsonViaPromises()` 的调用方式相同，如下：\n\n```javascript\n\
  fetchJsonAsync('http://example.com/person.json').then(obj => {\n  assert.deepEqual(obj,\
  \ {\n    first: 'Jane',\n    last: 'Doe',\n  });\n```\n\n### 直接基于 Promise 的异步函数\n\
  \n从外部看，几乎无法区分一个 `async` 函数和一个返回 `Promise` 的函数。\n\n### 41.1.1 异步构造结构\n\nJavaScript\
  \ 拥有以下可调用实体的 `async` 版本。它们的角色或是普通函数或方法：\n\n```javascript\n// 异步函数声明\nasync function\
  \ func1() {}\n\n// 异步函数表达式\nconst func2 = async function () {};\n\n// 异步箭头函数\nconst\
  \ func3 = async () => {};\n\n// 对象字面量中的异步方法定义\nconst obj = { async m() };\n\n//\
  \ 类定义中的异步方法定义\nclass MyClass { async m() {}\n```\n\n### 异步函数 (Asynchronous functions)\
  \ vs. async 函数 (async functions)\n\n`asynchronous function` 和 `async function` 这两个术语之间的区别微妙但很重要：\n\
  \n- `asynchronous function` 是任何异步交付结果的函数——例如，基于回调的函数或基于 `Promise` 的函数。\n- `async\
  \ function` 是通过特殊语法定义的，涉及 `async` 和 `await` 关键字。由于这两个关键字，它也被称为 async/await。`async`\
  \ 函数基于 `Promises`，因此也是异步函数（这听起来有些困惑）。\n\n## 41.2 从异步函数中返回\n\n### 41.2.1 异步函数总是返回\
  \ Promise\n\n每个 `async` 函数总是返回一个 `Promise`。\n\n在 `async` 函数内部，我们通过 `return`（行 A）完成结果\
  \ `Promise`：\n\n```javascript\nasync function asyncFunc() {\n  return 123; // (A)\n\
  }\nasyncFunc().then(result => {\n  assert.equal(result, 123);\n});\n```\n\n像通常一样，如果我们返回任何内容，将为我们返回\
  \ `undefined`：\n\n```javascript\nasync function asyncFunc() {\n}\nasyncFunc().then(result\
  \ => {\n  assert.equal(result, undefined);\n});\n```\n\n我们通过 `throw`（行 A）拒绝结果 `Promise`：\n\
  \n```javascript\nasync function asyncFunc() {\n  throw new Error('Problem!'); //\
  \ (A)\n}\nasyncFunc().catch(err => {\n  assert.deepEqual(err, new Error('Problem!'));\n\
  });\n```\n\n\n\n\n*   在 `.catch(err => { ··· })` 内部使用 `return q`\n\n### 41.2.3 执行异步函数：同步启动，异步完成（进阶）\n\
  \n异步函数的执行方式如下：\n\n*   当异步函数启动时，会创建一个结果对应的 `Promise` `p`。\n*   然后执行函数体。执行可以通过两种方式离开函数体：\n\
  \    *   在处理 `p` 的同时可以**永久地**离开：\n        *   `return` 会使 `p` 变为（fulfilled）。\n \
  \       *   `throw` 会使 `p` 变为（rejected）。\n    *   通过 `await` 等待另一个 `Promise` `q`\
  \ 完成时，执行也可以**暂时地**离开。异步会被暂停，执行离开。一旦 `q` 完成，执行将恢复。\n*   在执行首次离开函数体（无论是永久还是暂时）后，返回\
  \ Promise `p`。\n\n注意，结果 `p` 的完成通知是异步发生的，这与所有 Promise 的情况都是如此。\n\n以下代码演示了异步函数是如何同步启动的（A\
  \ 行），然后当前任务结束（C 行），最后结果 Promise 异步完成的（B 行）。\n\n```\nasync function asyncFunc() {\n\
  \  console.log('asyncFunc() starts'); // (A)\n  return 'abc';\n}\nasyncFunc().\n\
  .then(x => { // (B)\n  console.log(`Resolved: ${x}`);\n});\nconsole.log('Task ends');\
  \ // (C)\n\n// 输出:\n// 'asyncFunc() starts'\n// 'Task ends'\n// 'Resolved: abc'\n\
  ```\n\n## 41.3 `await`：与 Promise 操作\n\n`await` 运算符只能在异步函数和异步生成器中使用（后者在 §42.2 “异步生成器`\
  \ 中进行了解释）。它的操作数通常是一个 Promise，并会导致以下步骤：\n\n*   当前异步函数被暂停并返回。这一步与 `yield` 在同步生成器 中的工作方式相似。\n\
  *   最终，当前任务完成，继续处理任务队列。\n*   当且只要 Promise 完成时，异步函数将在新任务中恢复：\n    *   如果 Promise\
  \ 变为（fulfilled），`await` 返回完成值。\n    *   如果 Promise 变为（rejected），`await` 抛出拒绝值。\n\
  \n继续阅读以了解更多 `await` 如何处理各种状态下的 Promise。\n\n### 41.3.1 `await` 和已完成的 Promise\n\n\
  如果其操作数最终是一个完成的 Promise，`await` 将返回其完成值：\n\n```\nassert.equal(await Promise.resolve('yes!'),\
  \ 'yes!');\n```\n\n非 Promise 值也是允许的，并且会被直接传递（同步地，且不会暂停异步函数）：\n\n```\nassert.equal(await\
  \ 'yes!', 'yes!');\n```\n\n### 41.3.2 `await` 和被拒绝的 Promise\n\n如果其操作数是被拒绝的 Promise，那么\
  \ `await` 将抛出拒绝值：\n\n```javascript\ntry {\n  await Promise.reject(new Error());\n\
  \  assert.fail(); // 我们永远不会到达这里\n} catch (e) {\n  assert.equal(e instanceof Error,\
  \ true);\n}\n```\n\n`Error` 实例（包括其子类的实例）会被特殊对待并同样被抛出：\n\n```javascript\ntry {\n\
  \  await new Error();\n  assert.fail(); // 我们永远不会到达这里\n} catch (e) {\n  assert.equal(e\
  \ instanceof Error, true);\n}\n```\n\n**练习：通过异步函数 Fetch API**\n\n`exercises/async-functions/fetch_json2_test.mjs`\n\
  \n### 41.3.3 `await` 是浅层的（我们不能在回调函数中使用它）\n\n如果我们在一个异步函数内部并想通过 `await` 暂停它，我们必须直接在该函数内部这样做；我们不能在嵌套函数（例如回调函数）内部它。这意味着暂停是*浅层*的。\n\
  \n例如，以下代码无法执行：\n\n```\nasync function downloadContent(urls) {\n  urls.map(url =>\
  \ {\n    await fetch(url); // 语法错误！\n  });\n}\n```\n\n原因是普通的箭头函数不允许在体内部使用 `await`。好吧，让我们尝试异步箭头函数：\n\
  \n```javascript\nasync function downloadContent(urls) {\n  urls.map(async (url)\
  \ => {\n    await fetch(url);\n  });\n}\n```\n\n等一下，这不起作用，因为 `map` 返回的是 Promise\
  \ 数组，而不是值。一种解决方案是使用 `Promise.all()`：\n\n```javascript\nasync function downloadContent(urls)\
  \ {\n  await Promise.all(urls.map(async (url) => {\n    await fetch(url);\n  }));\n\
  }\n```\n\n\n\n\n\n```javascript\nasync function concurrentPromiseAll() {\n  const\
  \ result = await Promise.all([\n    paused('first'), paused('second')\n  ]);\n \
  \ assert.deepEqual(result, ['first', 'second']);\n}\n\n// Output:\n// 'START first'\n\
  // 'START second'\n// 'END first'\n// 'END second'\n```\n\n在这里，两个异步函数是同时启动的。一旦两者都已就（settled），`await`\
  \ 就会返回一个包含履行结果的 `Array`，或者——如果至少有一个 `Promise` 被拒绝（rejected）——则返回一个异常。\n\n回顾 [§40.5.2\
  \ “并发提示：关注操作何时开始”]可知，关键在于我们何时开始一个基于 `Promise` 的计算，而不是我们如何处理其结果。因此，以下代码与上一个代码具有同等的“并发性”：\n\
  \n```javascript\nasync function concurrentAwait() {\n  const resultPromise1 = paused('first');\n\
  \  const resultPromise2 = paused('second');\n\n  assert.equal(await resultPromise1,\
  \ 'first');\n  assert.equal(await resultPromise2, 'second');\n}\n// Output:\n//\
  \ 'START first'\n// 'START second'\n// 'END first'\n// 'END second'\n```\n\n## 41.7 使用异步函数的技巧\n\
  \n### 41.7.1 如果我们“只触发而不不管结果”，则不需要 `await`\n\n在处理基于 `Promise` 的函数时，并不需要 `await`；只有当我们想要暂停并等待直到返回的\
  \ `Promise` 就绪时，才需要它。如果我们只是只想启动一个异步操作，那么就不需要它：\n\n```javascript\nasync function\
  \ asyncFunc() {\n  const writer = openFile('someFile.txt');\n  writer.write('hello');\
  \ // 不等待\n  writer.write('world'); // 不等待\n  await writer.close(); // 等待文件关闭\n}\n\
  ```\n\n在这段代码中，我们没有 `await` `.write()`，因为我们不在乎它何时完成。然而，我们确实希望等待直到 `.close()` 完成。\n\
  \n注意：每次调用 `.write()` 都是同步启动的。这防止了竞态条件的发生。\n\n### 41.7.2 `await` 并忽略结果是有意义的\n\n偶尔使用\
  \ `await` 即使忽略它的结果也是有意义的，例如：\n\n```javascript\nawait longRunningAsyncOperation();\n\
  console.log('Done!');\n```\n\n在这里，我们使用 `await` 来等待一个长时间运行的异步操作完成。这确保了日志记录确实在该操作完成*之后*发生。\n\
  \n# 42 异步迭代\n\n### 42.1 [基础异步迭代]\n\n#### 42.1.1 [协议：异步迭代]\n\n#### 42.1.2 [直接使用异步迭代]\n\
  \n#### 42.1.3 [通过 `for-await-of` 使用异步迭代]\n\n### 42.2 [异步生成器]\n\n#### 42.2.1 [示例：通过异步生成器创建异步迭代器]\n\
  \n#### 42.2.2 [示例：将同步迭代器转换为异步迭代器]\n\n#### 42.2.3 [示例：将异步迭代器转换为 `Array`]\n\n####\
  \ 42.2.4 [示例：转换异步迭代器]\n\n#### 42.2.5 [示例：对异步迭代器进行 map 操作]\n\n### 42.3 [在 Node.js\
  \ 流上进行异步迭代]\n\n#### 42.3.1 [Node.js 流：通过回调 (push) 实现异步]\n\n#### 42.3.2 [Node.js\
  \ 流：通过异步迭代 (pull) 实现异步]\n\n#### 42.3.3 [示例：从块到行]\n\n**必要知识**\n\n对于本章，你应该熟悉以下内容：\n\
  \n* [Promises]\n* [Async functions]\n\n## 42.1 基础异步迭代\n\n### 42.1.1 [协议：异步迭代]\n\n\
  为了理解异步迭代，让我们先复习一下同步迭代。它包含以下内容：\n\n```typescript\ninterface Iterable {\n  [Symbol.iterator]()\
  \ : Iterator;\n}\ninterface Iterator {\n  next() : IteratorResult;\n}\ninterface\
  \ IteratorResult {\n  value: any;\n  done: boolean;\n}\n```\n\n`Iterable` 是一个内容可以被迭代的结构。`Iterator`\
  \ 是迭代器的工厂。每个 `.next()` 都返回一个 `done`。\n\n接口如下：\n\n```typescript\ninterface Iterable\
  \ {\n  [Symbol.asyncIterator]() : Iterator;\n}\ninterface Iterator {\n  next() :\
  \ Promise<IteratorResult>;\n}\ninterface IteratorResult {\n  value: any;\n  done:\
  \ boolean;\n}\n```\n\n与同步接口的唯一区别在于 `.next()` 的返回类型。\n\n### 42.1.2 [直接使用异步迭代]\n\n\
  以下代码直接使用了异步协议：\n\n```javascript\nconst asyncIterable = syncToAsyncIterable(['a',\
  \ 'b']); // (A)\nconst asyncIterator = asyncIterable[Symbol.asyncIterator]();\n\n\
  // 调用 .next() 直到 .done 为 true：\nasyncIterator.next() // (B)\n  .then(iteratorResult\
  \ => {\n    assert.deepEqual(\n      iteratorResult,\n      { value: 'a', done:\
  \ false });\n    return asyncIterator.next(); // (C)\n  })\n  .then(iteratorResult\
  \ => {\n    assert.deepEqual(\n      iteratorResult,\n      { value: 'b', done:\
  \ false });\n    return asyncIterator.next(); // (D)\n  })\n  .then(iteratorResult\
  \ => {\n    assert.deepEqual(\n      iteratorResult,\n      { value: undefined,\
  \ done: true });\n  });\n```\n\n在行 A 中，我们为值 `'a'` 和 `'b'` 创建了一个异步迭代器。我们稍后后会看到 `syncToAsyncIterable()`\
  \ 的实现。\n\n\n\n\n\n```javascript\nasync function f() {\n  const asyncIterable = syncToAsyncIterable(['a',\
  \ 'b']);\n  const asyncIterator = asyncIterable[Symbol.asyncIterator]();\n\n  //\
  \ Call .next() until .done is true:\n  assert.deepEqual(\n    await asyncIterator.next(),\n\
  \    { value: 'a', done: false });\n  assert.deepEqual(\n    await asyncIterator.next(),\n\
  \    { value: 'b', done: false });\n  assert.deepEqual(\n    await asyncIterator.next(),\n\
  \    { value: undefined, done: true });\n}\n```\n\n### 42.1.3 通过 `for-await-of`\
  \ 使用异步迭代\n\n异步迭代协议并不是为了直接使用的。支持它的语言语言结构之一是 `for-await-of` 循环，它是 `for-of` 循环的异步版本。它可以用于异步函数和*异步生成器*（将在本章后文介绍）中。以下是\
  \ `for-await-of` 的用法示例：\n\n```javascript\nfor await (const x of syncToAsyncIterable(['a',\
  \ 'b'])) {\n  console.log(x);\n}\n// 输出:\n// 'a'\n// 'b'\n```\n\n`for-await-of`\
  \ 相对灵活。除了异步迭代器外，它还支持同步迭代器：\n\n```javascript\nfor await (const x of ['a', 'b']) {\n\
  \  console.log(x);\n}\n// 输出:\n// 'a'\n// 'b'\n```\n\n它还支持封装在 Promise 中的同步值的同步迭代器：\n\
  \n```javascript\nconst arr = [Promise.resolve('a'), Promise.resolve('b')];\nfor\
  \ await (const x of arr) {\n  console.log(x);\n}\n// 输出:\n// 'a'\n// 'b'\n```\n\n\
  **练习：将异步迭代器转换为数组**\n\n警告：我们很快就会 `exercises/async-iteration/async_iterable_to_array.mjs`\
  \ 中看到此练习的解答。\n\n### 42.2 异步生成器\n\n异步生成器同时是两个物体：\n\n- 一个异步函数（输入）：我们可以使用 `await` 和\
  \ `for-await-of` 来获取数据。\n- 一个返回异步迭代器的生成器（输出）：我们可以使用 `yield` 和 `yield*` 来产生数据。\n\n\
  **异步生成器与同步生成器非常相似**\n\n由于异步生成器和同步生成器非常相似，我将不再解释 `yield` 和 `yield*` 是如何工作的。如果你有疑问，请参阅“同步生成器”。因此，一个异步生成器具有：\n\
  \n- 输入可以是：\n    - 同步的（单值、同步迭代器）\n    - 异步的（Promises、异步迭代器）。\n- 输出是一个异步迭代器。\n\n它的结构如下：\n\
  \n```javascript\nasync function* asyncGen() {\n  // 输入：Promises, 异步迭代器\n  const\
  \ x = await somePromise;\n  for await (const y of asyncIterable) {\n    //··\n \
  \ }\n  // 输出\n  yield someValue;\n  yield* otherGen();\n}\n```\n\n### 42.2.1 示例：通过异步生成器创建异步迭代器\n\
  \n让我们来看一个例子。以下代码创建了一个包含三个数字的异步迭代器：\n\n```javascript\nasync function* yield123()\
  \ {\n  for (let i=1; i<=3; i++) {\n    yield i;\n  }\n}\n```\n\n`yield123()` 的结果符合异步迭代协议吗？\n\
  \n```javascript\n(async () {\n  const asyncIterable = yield123();\n  const asyncIterator\
  \ = asyncIterable[Symbol.asyncIterator]();\n  assert.deepEqual(\n    await asyncIterator.next(),\n\
  \    { value: 1, done: false });\n  assert.deepEqual(\n    await asyncIterator.next(),\n\
  \    { value: 2, done: false });\n  assert.deepEqual(\n    await asyncIterator.next(),\n\
  \    { value: 3, done: false });\n  assert.deepEqual(\n    await asyncIterator.next(),\n\
  \    { value: undefined, done: true });\n})();\n```\n\n我们将代码封装在一个立即执行的异步函数中。\n\n\
  ### 42.2.2 示例：将同步迭代器转换为异步迭代器\n\n以下异步生成器将同步迭代器转换为异步迭代器。它实现了了之前之前过的 `syncToAsyncIterable()`\
  \ 函数。\n\n```javascript\nasync function* syncToAsyncIterable(syncIterable) {\n  for\
  \ (const elem of syncIterable) {\n    yield elem;\n  }\n}\n```\n\n注意：在这种情况下，输入是同步的（不需要\
  \ `await`）。\n\n### 42.2.3 示例：将异步迭代器转换为数组\n\n以下函数是之前一个练习的解答。它将异步迭代器转换为数组（类似于展开操作，但是针对异步迭代器而非同步迭代器）。\n\
  \n```javascript\nasync function asyncIterableToArray(asyncIterable) {\n  const result\
  \ = [];\n  for await (const value of asyncIterable) {\n    result.push(value);\n\
  \  }\n  return result;\n}\n```\n\n注意，在这种情况下我们无法使用异步生成器：我们通过 `for-await-of` 获取输入，并返回一个封装在\
  \ Promise 中的数组。后者的要求排除了异步生成器。\n\n这是对 `asyncIterableToArray()` 的测试：\n\n```javascript\n\
  async function* createAsyncIterable() {\n  yield 'a';\n  yield 'b';\n}\nconst asyncIterable\
  \ = createAsyncIterable();\nassert.deepEqual(\n  await asyncIterableToArray(asyncIterable),\
  \ // (A)\n  ['a', 'b']\n);\n```\n\n注意 A 行中的 `await`，它用于解包 `asyncIterableToArray()`\
  \ 返回的 Promise。为了让 `await` 起作用，这段代码片段必须在异步函数内部运行。\n\n### 42.2.4 示例：转换异步迭代器\n\n让我们实现一个异步生成器，通过转换现有的异步迭代器产生一个新的异步迭代器。\n\
  \n```javascript\nasync function* timesTwo(asyncNumbers) {\n  for await (const x\
  \ of asyncNumbers) {\n    yield x * 2;\n  }\n}\n```\n\n为了测试这个函数，我们使用了上一节中的 `asyncIterableToArray()`。\n\
  \n```javascript\nasync function* createAsyncIterable() {\n  for (let i=1; i<=3;\
  \ i++) {\n    yield i;\n  }\n}\nassert.deepEqual(\n  await asyncIterableToArray(timesTwo(createAsyncIterable())),\n\
  \  [2, 4, 6]\n);\n```\n\n**练习：异步生成器**\n\n警告：我们很快就会在 `exercises/async-iteration/number_lines.mjs`\
  \ 中看到此练习的解答。\n\n### 42.2.5 示例：对异步迭代器进行映射\n\n提醒一下，这是如何对同步迭代器进行映射：\n\n```javascript\n\
  function* mapSync(iterable, func) {\n  let index = 0;\n  for (const x of iterable)\
  \ {\n    yield func(x, index);\n    index++;\n  }\n}\nconst syncIterable = mapSync(['a',\
  \ 'b', 'c'], s => s.repeat(3));\nassert.deepEqual(\n  [...syncIterable],\n  ['aaa',\
  \ 'bbb', 'ccc']\n);\n```\n\n异步版本如下：\n\n```javascript\nasync function* mapAsync(asyncIterable,\
  \ func) { // (A)\n  let index = 0;\n  for await (const x of asyncIterable) { //\
  \ (B)\n    yield func(x, index);\n    index++;\n  }\n}\n```\n\n\n\n\n\n注意同步实现和异步实现之间有多么相似。唯一的两处区别在于\
  \ A 行中的 `async` 和 B 行中的 `await`。这等同于将一个同步函数转换为异步函数——我们只需要添加 `async` 关键字以及偶尔使用的 `await`\
  \ 即可。\n\n为了测试 `mapAsync()`，我们使用了辅助函数 `asyncIterableToArray()` (在本章稍后的部分显示]：\n\n\
  ```\n[](#cb1123-1)async function* createAsyncIterable() {\n[](#cb1123-2)  yield\
  \ 'a';\n[](#cb1123-3)  yield 'b';\n[](#cb1123-4)}\n[](#cb1123-5)const mapped = mapAsync(\n\
  [](#cb1123-6)  createAsyncIterable(), s => s.repeat(3));\n[](#cb1123-7)assert.deepEqual(\n\
  [](#cb1123-8)  await asyncIterableToArray(mapped), // (A)\n[](#cb1123-9)  ['aaa',\
  \ 'bbb']);\n```\n\n再次，我们使用 `await` 来解包 Promise（A 行），且这段代码必须在异步函数内部运行。\n\n![](img/file6.svg)\
  \ 练习：`filterAsyncIter()` \n\n`exercises/async-iteration/filter_async_iter_test.mjs`\n\
  \n## 42.3 对 Node.js 流进行异步迭代\n\n### 42.3.1 Node.js 流：通过回调实现异步（推）\n\n传统上，从 Node.js\
  \ 流进行异步读取是通过回调完成的：\n\n```\n[](#cb1124-1)function main(inputFilePath) {\n[](#cb1124-2)\
  \  const readStream = fs.createReadStream(inputFilePath,\n[](#cb1124-3)    { encoding:\
  \ 'utf8', highWaterMark: 1024 });\n[](#cb1124-4)  readStream.on('data', (chunk)\
  \ => {\n[](#cb1124-5)    console.log('>>> '+chunk);\n[](#cb1124-6)  });\n[](#cb1124-7)\
  \  readStream.on('end', () => {\n[](#cb1124-8)    console.log('### DONE ###');\n\
  [](#cb1124-9)  });\n[](#cb1124-10)}\n```\n\n也就是说，由流处于控制状态，并向读取者推送数据。\n\n### 42.3.2\
  \ Node.js 流：通过异步迭代实现异步（拉）\n\n从 Node.js 10 开始，我们也可以使用异步迭代从流中读取：\n\n```\n[](#cb1125-1)async\
  \ function main(inputFilePath) {\n[](#cb1125-2)  const readStream = fs.createReadStream(inputFilePath,\n\
  [](#cb1125-3)    { encoding: 'utf8', highWaterMark: 1024 });\n[](#cb1125-4)\n[](#cb1125-5)\
  \  for await (const chunk of readStream) {\n[](#cb1125-6)    console.log('>>> '+chunk);\n\
  [](#cb1125-7)  }\n[](#cb1125-8)  console.log('### DONE ###');\n[](#cb1125-9)}\n\
  ```\n\n这一次，由读取者处于控制状态，并从流中拉取数据。\n\n### 42.3.3 示例：从块到行\n\nNode.js 流对数据块（任意长度的片段）进行迭代。下面的异步生成器将基于块的异步可迭代器转换为行的异步可迭代器：\n\
  \n```\n[](#cb1126-1)/**\n[](#cb1126-2) * 参数：块的异步可迭代（字符串）\n[](#cb1126-3) * 结果：行的异步可迭代（包含换行符）\n\
  [](#cb1126-4) */\n[](#cb1126-5)async function* chunksToLines(chunksAsync) {\n[](#cb1126-6)\
  \  let previous = '';\n[](#cb1126-7)  for await (const chunk of chunksAsync) { //\
  \ input\n[](#cb1126-8)    previous += chunk;\n[](#cb1126-9)    let eolIndex;\n[](#cb1126-10)\
  \    while ((eolIndex = previous.indexOf('\\n')) >= 0) {\n[](#cb1126-11)      //\
  \ 行包含行尾（Windows 的 '\\r\\n' 或 Unix 的 '\\n'）\n[](#cb1126-12)      const line = previous.slice(0,\
  \ eolIndex+1);\n[](#cb1126-13)      yield line;\n[](#cb1126-14)      previous =\
  \ previous.slice(eolIndex+1);\n[](#cb1126-15)    }\n[](#cb1126-16)  }\n[](#cb1126-17)\
  \  if (previous.length > 0) {\n[](#cb1126-18)    yield previous;\n[](#cb1126-19)\
  \  }\n```将 `chunksToLines()` 应用于块的异步可迭代器（由 `chunkIterable()` 产生）：\n\n```\n[](#cb1127-1)async\
  \ function* chunkIterable() {\n[](#cb1127-2)  yield 'First';\n[](#cb1127-3)  yield\
  \ 'Sec';\n[](#cb1127-4)  yield 'Third';\n[](#cb1127-5)  yield 'our';\n}\nconst lines\
  \ = chunksToLines(chunkIterable());\nfor await (const line of lines) {\n  console.log(line);\n\
  }\n```\n\n现在我们有一个行的异步可迭代器，可以使用 `numberLines()` 对这些行进行编号：\n\n```\n[](#cb1128-1)async\
  \ function* numberLines(lines) {\n[](#cb1128-2)  let lineNumber = 1;\n[](#cb1128-3)\
  \  for await (const line of lines) {\n[](#cb1128-4)    yield lineNumber + ': ' +\
  \ line;\n[](#cb1128-5)    lineNumber++;\n[](#cb1128-6)  }\n}\n```\n\n```javascript\n\
  const numberedLines = numberLines(lines);\nfor await (const line of numberedLines)\
  \ {\n  console.log(line);\n}\n```\n\n输出：\n```\n1: First\n2: Sec\n3: Third\n4: our\n\
  ```\n\n\n\n\n\n### 43.1 创建正则表达式\n\n### 43.1.1 字面量与构造函数\n\n创建正则表达式的两种主要方式是：\n\n*\
  \   字面量（Literal）：静态编译（在加载时）。\n    ```\n    /abc/ui\n    ```\n\n*   构造函数（Constructor）：动态编译（在运行时）。\n\
  \n    ```\n    new RegExp('abc', 'ui')\n    ```\n\n这两种正则表达式都包含相同的两个部分：\n\n*   `body`\
  \ `abc` – 实际的正则表达式。\n\n*   `flags` `u` 和 `i`。标志用于配置如何解释模式。例如，`i` 启用不区分大小写的匹配。可用标志列表将在本章后续部分给出。\n\
  \n### 43.1.2 克隆和非破坏性地修改正则表达式\n\n构造函数 `RegExp()` 有两种变体：\n\n*   `new RegExp(pattern\
  \ : string, flags = '')` (ES3)\n\n    根据 `pattern` 指定创建一个新的正则表达式。如果缺少 `flags`，则使用空字符串\
  \ `''`。\n\n*   `new RegExp(regExp : RegExp, flags = regExp.flags)` (ES6)\n\n   \
  \ 克隆 `regExp`。如果提供了 `flags`，则由其决定克隆的标志。\n\n第二种变体用于克隆正则表达式，并对其进行修改。标志是不可变的，这是更改它们的唯一方法——例如：\n\
  \n```\nfunction copyAndAddFlags(regExp, flagsToAdd='') {\n  // 构造函数不允许重复的标志；\n \
  \ // 确保没有重复：\n  const newFlags = [...new Set(regExp.flags + flagsToAdd)].join('');\n\
  \  return new RegExp(regExp, newFlags);\n}\nassert.equal(/abc/i.flags, 'i');\nassert.equal(copyAndAddFlags(/abc/i,\
  \ 'g').flags, 'gi');\n```\n\n### 43.2 语法\n\n### 43.2.1 语法字符\n\n在正则表达式的顶层，以下`语法字符`是特殊的。它们通过在前面加上反斜杠（`\\\
  `）来进行转义。\n\n```\n\\ ^ $ . * + ? ( ) [ ] { } |\n```\n\n在正则表达式字面量中，你必须转义斜杠：\n\n```\n\
  > /\\//.test('/')\ntrue\n```\n\n在 `new RegExp()` 的参数中，你不需要转义斜杠：\n\n```\n> new RegExp('/').test('/')\n\
  true\n```\n\n### 43.2.2 基础原子\n\n`原子`（Atoms）是正则表达式的基础构建模块。\n\n*   `模式字符`（Pattern\
  \ characters）是*除*语法字符（`^`、`$` 等）的所有字符。模式字符匹配自身。示例：`A b %`\n\n*   `.` 匹配任何字符。你可以使用标志\
  \ `/s` (`dotall`）来控制点是否匹配行终止符（下文详细介绍）。\n\n*   `字符转义`（Character escapes）（每个转义匹配一个固定字符）：\n\
  \n    *   控制转义（针对少数控制字符）：\n        *   `\\f`: 换页 (FF)\n        *   `\\n`: 换行符 (LF)\n\
  \        *   `\\r`: 回车 (CR)\n        *   `\\t`: 制表符\n        *   `\\v`: 垂直制符\n \
  \   *   任意控制字符：`\\cA` (Ctrl-A)，…… `\\cZ` (Ctrl-Z)\n    *   Unicode 编码单元：`\\u00E4`\n\
  \    *   Unicode 代码点（需要标志 `/u`）：`\\u{1F44D}`\n\n*   `字符类转义`（Character class escapes）（每个转义匹配字符集中的一个）：\n\
  \n    *   `\\d`: 数字（等同于 `[0-9]`）\n        *   `\\D`: 非数字\n    *   `\\w`: “单词”字符（等同于\
  \ `[A-Za-z0-9_]`，与编程语言中的标识符相关）\n        *   `\\W`: 非单词字符\n    *   `\\s`: 空白（空格、制表符、行终止符等）\n\
  \        *   `\\S`: 非空白\n    *   `Unicode 属性转义` (ES2018)：`\\p{White_Space}`、`\\\
  P{White_Space}` 等。\n        *   需要标志 `/u`。\n        *   在下一个小节中描述。\n\n### 43.2.3\
  \ Unicode 属性转义 (ES2018)\n\n#### 43.2.3.1 Unicode 字符属性\n\n在 Unicode 标准中，每个字符都有`属性`（properties）——描述它的元数据。属性在定义字符的性质方面起着重要作用。引用[Unicode\
  \ 标准第 3.3 节，D3](http://www.unicode.org/versions/Unicode9.0.0/ch03.pdf)：\n\n> 字符的语义由其身份、规范属性和行为决定。\n\
  \n以下是属性的几个示例：\n\n*   `Name`: 唯一名称，由大写字母、数字、连字符和空格组成——例如：\n    *   A: `Name = LATIN\
  \ CAPITAL LETTER A`\n    *   `\U0001F642`: `Name = SLIGHTLY SMILING FACE`\n*   `General_Category`:\
  \ 对字符分类——例如：\n    *   x: `General_Category = Lowercase_Letter`\n    *   $: `General_Category\
  \ = Currency_Symbol`\n*   `White_Space`: 用于标记不可见的空白字符，如空格、制表符和换行——例如：\n    *   \\\
  t: `White_Space = True`\n    *   π: `White_Space = False`\n*   `Age`: 引入该字符的 Unicode\
  \ 标准版本——例如，欧元符号 €是在 Unicode 标准 2.1 版本中加入的。\n    *   €: `Age = 2.1`\n*   `Block`:\
  \ 代码点的连续范围。区块不重叠，且它们的名称是唯一的。\n\n#### 43.2.3.2 Unicode 属性转义\n\nUnicode 属性转义的看起来如下：\n\
  \n1.  `\\p{prop=value}`：匹配属性为 `value` 的字符。\n2.  `\\P{prop=value}`：匹配不具有 `value`\
  \ 的字符。\n3.  `\\p{prop}`：匹配所有 `prop` 为 True 的字符。\n4.  `\\P{prop}`：匹配所有 `prop` 为 False\
  \ 的字符。\n\n所有这些都需要 `/u` 标志。\n\n扩展阅读：\n\n*   Unicode 属性及其值的列表：[\"Unicode 标准附录 #44:\
  \ Unicode 字符数据库\"](https://unicode.org/reports/tr44/#Properties) (编辑：Mark Davis,\
  \ Laurențiu Iancu, Ken Whistler)\n\n### 43.2.4 字符类\n\n*字符类*（character class）在方括号中封装了*类范围*（class\
  \ ranges）。类范围指定了一个字符集：\n\n*   `[«class ranges»]` 匹配集合中的任何字符。\n*   `[^«class ranges»]`\
  \ 匹配不在集合中的任何字符。\n\n类范围的规则：\n\n*   非语法字符代表自身：`[abc]`\n*   只有以下四个字符是特殊的，且必须通过斜杠进行转义：`^\
  \ \\ - ]`\n    *   `^` 仅当它位于开头时才需要转义。\n    *   `-` 如果它位于开头或结尾则不需要转义。\n*   字符转义（`\\\
  n`、`\\u{1F4D}` 等）具有通常含义。\n    *   注意：`\\b` 代表退格符。在正则表达式的其他地方，它匹配单词边界。\n*   字符类转义（`\\\
  d`、`\\p{White_Space}` 等）具有通常含义。\n*   字符范围通过连字符指定：`[a-z]`\n\n### 43.2.5 分组\n```\n\
  \n\n\n\n*   位置捕获组：`(#+)`\n    *   反向引用：`\\1`, `\\2` 等\n*   命名捕获组 `^([ES2018])`：`(?<hashes>#+)`\n\
  \    *   反向引用：`\\k<hashes>`\n*   非捕获组：`(?:#+)`\n\n### 43.2.6 量词\n\n默认情况下，所有量词都是`贪婪`的（它们会尽可能多匹配字符）：\n\
  \n*   `?`: 匹配零或一次\n*   `*`: 匹配零或多次\n*   `+`: 匹配一次或多次\n*   `{n}`: 匹配 `n` 次\n*   `{n,}`:\
  \ 匹配 `n` 次或多次\n*   `{n,m}`: 匹配至少 `n` 次，最多 `m` 次。\n\n要使它们变为*懒惰*的（以便它们匹配尽可能少的字符），请在它们后面加上问号（`?`）：\n\
  \n```\n> /\".*\"/.exec('\"abc\"def\"')[0]  // 贪婪\n'\"abc\"def\"'\n> /\".*?\"/.exec('\"\
  abc\"def\"')[0] // 懒惰\n'\"abc\"'\n```\n\n### 43.2.7 断言\n\n*   `^` 仅匹配输入的开头\n*  \
  \ `$` 仅匹配输入的结尾\n*   `\\b` 仅在单词边界匹配\n    *   `\\B` 仅在不在单词边界时匹配\n\n#### 43.2.7.1 瞻断言\n\
  \n**正向预瞻断言**：`(?=«pattern»)` 如果 `pattern` 匹配后续内容，则匹配。\n\n示例：后面跟着 `X` 的小写字母序列。\n\n\
  ```\n> 'abcX def'.match(/[a-z]+(?=X)/g)\n[ 'abc' ]\n```\n\n注意，`X` 本身不是匹配子字符串的一部分。\n\
  \n**负向预瞻断言**：`(?!«pattern»)` 如果 `pattern` 不匹配后续内容，则匹配。\n\n示例：后面没有跟着 `X` 的小写字母序列。\n\
  \n```\n> 'abcX def'.match(/[a-z]+(?!X)/g)\n[ 'ab', 'def' ]\n```\n\n#### 43.2.7.2\
  \ 后置断言 ^([ES2018])\n\n**正向后置断言**：`(?<=«pattern»)` 如果 `pattern` 匹配之前的内容，则匹配。\n\n\
  示例：前面有 `X` 的小写字母序列。\n\n```\n> 'Xabc def'.match(/(?<=X)[a-z]+/g)\n[ 'abc' ]\n```\n\
  \n**负向后置断言**：`(?<!«pattern»)` 如果 `pattern` 不匹配之前的内容，则匹配。\n\n示例：前面没有 `X` 的小写字母序列。\n\
  \n```\n> 'Xabc def'.match(/(?<!X)[a-z]+/g)\n[ 'bc', 'def' ]\n```\n\n示例：将“.js”替换为“.html”，但不在“Node.js”中替换。\n\
  \n```\n> 'Node.js: index.js and main.js'.replace(/(?<!Node)\\.js/g, '.html')\n'Node.js:\
  \ index.html and main.html'\n```\n\n### 43.2.8 析取 (`|`)\n\n注意：此运算符的优先级较低。必要时使用分组：\n\
  \n*   `^aa|zz$` 匹配所有以 `aa` 开头或以 `zz` 结尾的字符串。注意 `|` 的优先级低于 `^` 和 `$`。\n*   `^(aa|zz)$`\
  \ 匹配字符串 `'aa'` 和 `'zz'`。\n*   `^a(a|z)z$` 匹配字符串 `'aaz'` 和 `'azz'`。\n\n### 43.3 标志\n\
  \n表 20：这些是 JavaScript 支持的正则表达式标志。\n\n| 字面量标志 | 属性名 | ES | 说明 |\n| --- | --- | ---\
  \ | --- |\n| `g` | `global` | ES3 | 多次匹配 |\n| `i` | `ignoreCase` | ES3 | 忽略大小写匹配\
  \ |\n| `m` | `multiline` | ES3 | `^` 和 `$` 匹配行 |\n| `s` | `dotall` | ES2018 | 点号匹配换行符\
  \ |\n| `u` | `unicode` | ES6 | Unicode 模式（推荐） |\n| `y` | `sticky` | ES6 | 匹配之间不留字符\
  \ |\n\n以下是 JavaScript 可用的正则表达式标志（表 20 提供了概述）：\n\n*   `/g` (`global`）：从根本上改变了以下方法的工作：\n\
  \    *   `RegExp.prototype.test()`\n    *   `RegExp.prototype.exec()`\n    *   `String.prototype.match()`\n\
  \n简单来说，没有 `/g` 时，这些方法只考虑字符串中的第一个匹配项。有了 `/g`，它们会考虑所有匹配项。\n\n*   `/i` (`ignoreCase`）：开启忽略大小写的匹配：\n\
  \n```\n> /a/.test('A')\nfalse\n> /a/i.test('A')\ntrue\n```\n\n*   `/m` (`multiline`）：如果启用此标志，`^`\
  \ 匹配每行的开头，`$` 匹配每行的结尾。如果没有，`^` 匹配整个输入字符串的开头，`$` 匹配整个输入字符串的结尾。\n\n```\n> 'a1\\na2\\\
  na3'.match(/^a./gm)\n[ 'a1', 'a2', 'a3' ]\n> 'a1\\na2\\na3'.match(/^a./g)\n[ 'a1'\
  \ ]\n```\n\n*   `/u` (`unicode`）：此标志开启正则表达式的 Unicode 模式。该模式将在下一节中解释。\n\n*   `/y`\
  \ (`sticky`）：此标志主要在配合 `/g` 使用时才有意义。当两者都开启时，任何匹配都必须紧跟在上一个匹配之后（即它必须从正则表达式对象的 `.lastIndex`\
  \ 索引开始）。因此，第一个匹配必须在索引 0 处。\n\n```\n> 'a1a2 a3'.match(/a./)\n```\n\n\n\n\n\n```\n\
  > /^\\uD83D\\uDE80{3}$/.test('\\uD83D\\uDE80\\uDE80\\uDE80')\ntrue\n```\n\n### 43.4\
  \ 正则表达式对象的属性\n\n注意：\n\n* 严格来说，只有 `.lastIndex` 是一个真正的实例属性。所有其他属性都是通过 getter 实现的。\n\
  * 因此，`.lastIndex` 是唯一的可变属性。所有其他属性都是只读的。如果你想想更改它们，需要复制该正则表达式（详情请参阅 `43.1.2 “克隆与非破坏性地修改正则表达式”`）。\n\
  \n### 43.4.1 作为属性的标志\n\n每个正则表达式标志（flag）都以更长、更具描述性的属性形式存在：\n\n```javascript\n> /a/i.ignoreCase\n\
  true\n> /a/.ignoreCase\nfalse\n```\n\n这是标志属性的完整列表：\n\n* `.dotall` (`/s`)\n* `.global`\
  \ (`/g`)\n* `.ignoreCase` (`/i`)\n* `.multiline` (`/m`)\n* `.sticky` (`/y`)\n* `.unicode`\
  \ (`/u`)\n\n### 43.4.2 其他属性\n\n每个正则表达式还具有以下属性：\n\n* `.source` ^([ES3]): 正则表达式模式\n\
  \n  ```javascript\n  > /abc/ig.source\n  'abc'\n  ```\n\n* `.flags` ^([ES6]): 正则表达式的标志\n\
  \n  ```javascript\n  > /abc/ig.flags\n  'gi'\n  ```\n\n* `.lastIndex` ^([ES3]):\
  \ 当开启标志 `/g` 时使用。详情请参阅 `43.6 “标志 \\`/g\\` 及其陷阱”`。\n\n### 43.5 处理正则表达式的方法\n\n###\
  \ 43.5.1 一般情况下，正则表达式可以匹配字符串中的任何位置\n\n注意，通常情况下，正则表达式会匹配字符串中的任何位置：\n\n```javascript\n\
  > /a/.test('__a__')\ntrue\n```\n\n你可以通过使用断言（如 `^`）或使用标志 `/y` 来改变这一点：\n\n```javascript\n\
  > /^a/.test('__a__')\nfalse\n> /^a/.test('a__')\ntrue\n```\n\n### 43.5.2 `regExp.test(str)`:\
  \ 是否匹配？ ^([ES3])\n\n当 `regExp` 匹配 `str` 时，正则表达式方法 `.test()` 返回 `true`：\n\n```javascript\n\
  > /bc/.test('ABCD')\nfalse\n> /bc/i.test('ABCD')\ntrue\n> /\\.mjs$/.test('main.mjs')\n\
  true\n```\n\n使用 `.test()` 时，通常应该避免使用 `/g` 标志。如果你使用它，通常在每次调用该方法时不会得到相同的结果：\n\n```javascript\n\
  > const r = /a/g;\n> r.test('aab')\ntrue\n> r.test('aab')\ntrue\n> r.test('aab')\n\
  false\n```\n\n结果由于 `/a/` 在字符串中有两个匹配项。在找到所有匹配项后，`.test()` 返回 `false`。\n\n### 43.5.3\
  \ `str.search(regExp)`: 匹配项在哪个索引？ ^([ES3])\n\n字符串方法 `.search()` 返回 `str` 中匹配 `regExp`\
  \ 的第一个索引：\n\n```javascript\n> '_abc_'.search(/abc/)\n1\n> 'main.mjs'.search(/\\\
  .mjs$/)\n4\n```\n\n### 43.5.4 `regExp.exec(str)`: 捕获组 ^([ES3])\n\n#### 43.5.4.1\
  \ 获取第一次匹配的匹配对象\n\n在没有标志 `/g` 的情况下，`.exec()` 返回 `regExp` 在 `str` 中第一次匹配的捕获结果：\n\n\
  ```javascript\nassert.deepEqual(\n  /(a+)b/.exec('ab aab'),\n  {\n    0: 'ab',\n\
  \    1: 'a',\n    index: 0,\n    input: 'ab aab',\n    groups: undefined,\n  }\n\
  );\n```\n\n结果是一个具有以下属性的*匹配对象*：\n\n* `[0]`: 正则表达式匹配的完整子字符串\n* `[1]`: 第 1 个位置组的捕获（以此此类推）\n\
  * `.index`: 匹配发生在何处？\n* `.input`: 用于进行匹配的字符串\n* `.groups`: 命名组的捕获\n\n#### 43.5.4.2\
  \ 命名捕获组 ^([ES2018])\n\n上一个示例包含一个位置组。以下示例演示了命名组：\n\n```javascript\nassert.deepEqual(\n\
  \  /(?<as>a+)b/.exec('ab aab'),\n  {\n    0: 'ab',\n    1: 'a',\n    index: 0,\n\
  \    input: 'ab aab',\n    groups: { as: 'a' },\n  }\n);\n```\n\n在 `.exec()` 的结果中，你可以看到命名组也是一个位置组——它的捕获存在两次：\n\
  \n* 一次作为位置捕获（属性 `'1'`）。\n* 一次作为命名捕获（属性 `groups.as`）。\n\n#### 43.5.4.3 遍历多个匹配项\n\n\
  如果你想检索正则表达式的所有匹配项（而不仅仅是第一个），你需要开启标志 `/g`。然后你可以多次调用 `.exec()` 并每次获取一个匹配项。在最后一次匹配后，`.exec()`\
  \ 返回 `null`。\n\n```javascript\n> const regExp = /(a+)b/g;\n> regExp.exec('ab aab')\n\
  { 0: 'ab', 1: 'a', index: 0, input: 'ab aab', groups: undefined }\n> regExp.exec('ab\
  \ aab')\n{ 0: 'aab', 1: 'aa', index: 3, input: 'ab aab', groups: undefined }\n>\
  \ regExp.exec('ab aab')\nnull\n```\n\n因此，你可以按照如下方式遍历所有匹配项：\n\n```javascript\nconst\
  \ regExp = /(a+)b/g;\nconst str = 'ab aab';\nlet match;\n// 通过真值检查 null\n// 替代方案：使用\
  \ while\nwhile ((match = regExp.exec(str)) !== null) {\n  // ...\n}\n```\n\n\n\n\
  \n如果替换值是一个函数，你可以计算每个替换内容。在接下来的示例中，我们将找到的每个非负整数乘以 2。\n\n```javascript\nassert.equal(\n\
  \  '3 cats and 4 dogs'.replace(/[0-9]+/g, (all) => 2 * Number(all)),\n  '6 cats\
  \ and 8 dogs'\n);\n```\n\n替换函数接收以下参数。注意它们与匹配对象（match objects）是多么相似。这些参数都是位置参数，但我包含了人们可能使用的命名方式：\n\
  \n* `all`: 完整匹配\n* `g1`: 第 1 个位置分组的捕获\n* 等等\n* `index`: 匹配发生在哪里？\n* `input`: 正在其中替换的字符串\n\
  * `groups`: 命名分组的捕获（一个对象）\n\n![](img/file6.svg) **练习：通过 `.replace()` 和命名分组更改引号**\n\
  \n`exercises/regexps/change_quotes_test.mjs`\n\n### 43.5.7 处理正则表达式的其它方法\n\n`String.prototype.split()`\
  \ 在字符串的章节中有描述。`String.prototype.split()` 的第一个参数可以是字符串或正则表达式。如果是后者，则分组的捕获将出现在结果中：\n\
  \n```javascript\n> 'a:b : c'.split(':')\n[ 'a', 'b ', ' c' ]\n> 'a:b : c'.split(/\
  \ *: */)\n[ 'a', 'b', 'c' ]\n> 'a:b : c'.split(/( *):( *)/)\n[ 'a', '', '', 'b',\
  \ ' ', ' ', 'c' ]\n```\n\n### 43.6 标志 `/g` 及其陷阱\n\n以下两个正则表达式方法在开启 `/g` 标志时工作方式不同：\n\
  \n* `RegExp.prototype.exec()`\n* `RegExp.prototype.test()`\n\n然后它们可以被重复调用，并交付字符串内部所有的匹配项。正则表达式的属性\
  \ `.lastIndex` 用于跟踪字符串内部的当前位置——例如：\n\n```javascript\nconst r = /a/g;\nassert.equal(r.lastIndex,\
  \ 0);\nassert.equal(r.test('aa'), true); // 第 1 次匹配？\nassert.equal(r.lastIndex,\
  \ 1); // 第一次匹配后\nassert.equal(r.test('aa'), true); // 第 2 次匹配？\nassert.equal(r.lastIndex,\
  \ 2); // 第二次匹配后\nassert.equal(r.test('aa'), false); // 第 3 次匹配？\nassert.equal(r.lastIndex,\
  \ 0); // 重新开始\n```\n\n接下来的小节解释了使用 `/g` 的陷阱。随后是一个解释如何绕过这些陷阱的小节。\n\n#### 43.6.1 陷阱：你不能内联带有标志\
  \ `/g` 的正则表达式\n\n带有 `/g` 标志的正则表达式不能被内联。例如，在下面的 `while` 循环中，每每次检查条件时都会创建一个新的正则表达式。因此，它的\
  \ `.lastIndex` 始终为 0，循环永远不会终止。\n\n```javascript\nlet count = 0;\n// 死循环\nwhile (/a/g.test('babaa'))\
  \ {\n  count++;\n}\n```\n\n#### 43.6.2 陷阱：移除 `/g` 可能会破坏代码\n\n如果代码期望一个带有 `/g` 的正则表达式，并且对\
  \ `.exec()` 或 `.test()` 的结果进行循环，那么一个没有 `/g` 的正则表达式可能会导致死循环：\n\n```javascript\nfunction\
  \ countMatches(regExp) {\n  let count = 0;\n  // 死循环\n  while (regExp.exec('babaa'))\
  \ {\n    count++;\n  }\n  return count;\n}\ncountMatches(/a/); // 缺少：标志 /g\n```\n\
  \n为什么？因为 `.exec()` 总是返回第一个结果（一个匹配对象），而永远不返回 `null`。\n\n#### 43.6.3 陷阱：添加 `/g` 可能会破坏代码\n\
  \n对于 `.test()`，还有另一个注意事项：如果你想精确地检查一次正则表达式是否匹配字符串，那么正则表达式不能有 `/g`。否则，你通常每次调用 `.test()`\
  \ 都会得到不同的结果：\n\n```javascript\nfunction isMatching(regExp) {\n  return regExp.test('Xa');\n\
  }\nconst myRegExp = /^X/g;\nassert.equal(isMatching(myRegExp), true);\nassert.equal(isMatching(myRegExp),\
  \ false);\n```\n\n通常情况下，如果你打算以这种方式使用 `.test()`，你就不会添加 `/g`。但这种情况可能会发生，例如你使用同一个正则表达式来执行测试和替换。\n\
  \n#### 43.6.4 陷阱：如果 `.lastIndex` 不是 0，代码可能会破坏\n\n如果你通过 `.exec()` 或 `.test()` 多次匹配正则表达式，输入内部的当前位置将存储在正则表达式的属性\
  \ `.lastIndex` 中。因此，如果 `.lastIndex` 不是 0，多次匹配的代码可能会被破坏：\n\n```javascript\nfunction\
  \ countMatches(regExp) {\n  let count = 0;\n  while (regExp.exec('babaa')) {\n \
  \   count++;\n  }\n  return count;\n}\nconst myRegExp = /a/g;\nmyRegExp.lastIndex\
  \ = 4;\nassert.equal(countMatches(myRegExp), 1); // 应该是 3\n```\n\n注意，对于新创建的正则表达式`.lastIndex`\
  \ 总是 0，但如果同一个正则表达式被多次使用，则可能不是。\n\n#### 43.6.5 处理 `/g` 和 `.lastIndex`\n\n为了处理 `/g`\
  \ 和 `.lastIndex`，我们将实现以下函数：\n\n它计算 `regExp` 在 `str` 中出现的次数。我们如何防止 `regExp` 破坏我们的代码？让我们看看三种方法。首先，如果未设置\
  \ `/g` 或 `.lastIndex` 不是 0，我们可以抛出异常：\n\n```javascript\nfunction countMatches(regExp,\
  \ str) {\n  if (!regExp.global) {\n    throw new Error('regExp 必须设置 /g');\n  }\n\
  \  if (regExp.lastIndex !== 0) {\n    throw new Error('lastIndex 必须为 0');\n  }\n\
  \  let count = 0;\n  while (regExp.test(str)) {\n    count++;\n  }\n  return count;\n\
  }\n```\n\n其次，我们可以克隆参数。这样做的好处是 `regExp` 不会被改变。\n\n```javascript\nfunction countMatches(regExp,\
  \ str) {\n  const cloneFlags = regExp.flags + (regExp.global ? '' : 'g');\n  const\
  \ clone = new RegExp(regExp, cloneFlags);\n  let count = 0;\n  while (clone.test(str))\
  \ {\n    count++;\n  }\n  return count;\n}\n```\n\n第三，我们可以使用 `.match()` 来计数，它不改变也不依赖\
  \ `.lastIndex`。\n\n```javascript\nfunction countMatches(regExp, str) {\n  if (!regExp.global)\
  \ {\n    throw new Error('regExp 必须设置 /g');\n  }\n  return (str.match(regExp) ||\
  \ []).length;\n}\n```\n\n### 43.7 处理正则表达式的技巧\n\n#### 43.7.1 为正则表达式转义任意文本\n\n以下函数转义任意文本，使其在放入正则表达式时能够被字面匹配：\n\
  \n```javascript\nfunction escapeForRegExp(str) {\n  return str.replace(/[\\\\^$.+?()[\\\
  ]{}|]/g, '\\\\$&'); // (A)\n}\nassert.equal(escapeForRegExp('[yes?]'), String.raw`\\\
  [yes?\\]`);\nassert.equal(escapeForRegExp('_g_'), String.raw`_g_`);\n```\n\n在行 A，我们转义了所有的语法字符。我们必须谨慎选择，因为正则表达式标志\
  \ `/u` 禁止了许多转义——例如：`\\a \\: \\-`\n\n正则表达式方法 `.replace()` 只允许你替换一次纯文本。通过 `escapeForRegExp()`，我们可以绕过这个限制并多次替换纯文本：\n\
  \n```javascript\nconst plainText = ':-)';\nconst regExp = new RegExp(escapeForRegExp(plainText),\
  \ 'ug');\nassert.equal(':-) :-) :-)'.replace(regExp, '\U0001F642'), '\U0001F642\
  \ \U0001F642 \U0001F642');\n```\n\n### 43.7.2 匹配所有或无匹配\n\n\n\n\n有时，你可能需要一个匹配所有内容或无内容的正则表达式——例如作为默认值。\n\
  \n- 匹配所有内容：`/(?:)/`\n\n  空分组 `()` 匹配所有内容。我们将其设置为非捕获分组（通过 `?:`），以避免不的工作。\n\n```javascript\n\
  > /(?:)/.test('')\ntrue\n> /(?:)/.test('abc')\ntrue\n```\n\n- 匹配为空：`/.^/`\n\n  `^`\
  \ 仅匹配字符串的开头。点 `.` 将匹配位置移到第一个字符之后，现在 `^` 不再匹配了。\n\n```javascript\n> /.^/.test('')\n\
  false\n> /.^/.test('abc')\nfalse\n```\n\n# 44 日期 (`Date`)\n\n### 44.1 最佳实践：避免内置的\
  \ `Date`\n\n### 44.1.1 在日期库中需要注意的项\n\n### 44.2 时间标准\n\n### 44.2.1 背景：UTC vs. Z vs.\
  \ GMT\n\n### 44.2.2 日期不支持时区\n\n### 44.3 背景：日期时间格式 (ISO)\n\n### 44.3.1 提示：附加 `Z`\
  \ 以使日期解析具有确定性\n\n### 44.4 时间值\n\n### 44.4.1 创建时间值\n\n### 44.4.2 获取和设置时间值\n\n###\
