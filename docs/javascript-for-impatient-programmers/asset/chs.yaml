  ### 6.4 为什么 JavaScript 经常静默失败？\n\nJavaScript 经常静默失败。让我们来看两个例子。\n\n第一个例子：如果操作符的操作数没有适当的类型，它们将根据需要进行转换。\n\
  \n```\n> '3' * '5'\n15\n```\n\n第二个例子：如果算术计算失败，你得到的是错误值而不是异常。\n\n```\n> 1 / 0\nInfinity\n\
  ```\n\n静默失败的原因是历史性的：JavaScript 直 ECMAScript 3 才有异常。从那时起，设计者一直试图避免静默失败。\n\n### 6.5\
