  \n### 27.12.1 示例：动态加载模块\n\n### 27.12.2 `import()` 的用例\n\n## 27.13 通过 `import()`\
  \ 动态加载模块\n\n### 27.13.1 预览：`import.meta.url`\n\n### 27.13.2 `import.meta.url` 与\
  \ `class`\n\n### 27.13.3 Node.js 上的 `import.meta.url`\n\n### 27.13.4 Polyfills：模拟原生功能（高级）\n\
  \n\n\n\n\n```javascript\nvar myModule = (function () { // Open IIFE\n  // Imports\
  \ (via global variables)\n  var importedFunc1 = otherModule1.importedFunc1;\n  var\
  \ importedFunc2 = otherModule2.importedFunc2;\n\n  // Body\n  function internalFunc()\
  \ {\n    // ···\n  }\n  function exportedFunc() {\n    importedFunc1();\n    importedFunc2();\n\
  \    internalFunc();\n  }\n\n  // Exports (assigned to global variable `myModule`)\n\
  \  return {\n    exportedFunc: exportedFunc,\n  };\n})(); // Close IIFE\n```\n\n\
  `myModule` 是一个全局变量，被赋值为立即执行的函数表达式的结果。该函数表达式始于第一行，并在最后一行被调用。\n\n这种封装代码片段的方法被称为*立即调用函数表达式*（IIFE，由\
  \ Ben Alman 命名）。我们从 IIFE 中获得了什么？`var` 不是块级作用域（像 `const` 和 `let` 那样），它是函数作用域的：为 `var`\
  \ 声明的变量创建新作用域的唯一方法是通过函数或方法（对于 `const` 和 `let`，你可以使用函数、方法或块 `{}`）。因此，示例中的 IIFE 将所有以下变量隐藏在全局作用域之外，并尽量减少了命名冲突：`importedFunc1`、`importedFunc2`、`internalFunc`、`exportedFunc`。\n\
  \n注意我们以特定的方式使用 IIFE：在最后，我们选择想要导出的内容并通过对象字面量返回它。这被称为*揭示模块模式*（由 Christian Heilmann\
  \ 命名）。\n\n这种模拟模块的方法存在几个问题：\n\n*   脚本文件中的库通过全局变量导出和导入功能，这存在命名冲突的风险。\n*   依赖关系没有显式声明，脚本没有内置方法来加载其所依赖的脚本。因此，网页不仅需要加载页面所需的脚本，还要加载这些脚本的依赖项、依赖项的依赖项等。而且必须按照正确的顺序进行加载！\n\
  \n### 27.4 ES6 之前创建的模块系统\n\n在 ECMAScript 6 之前，JavaScript 并没有内置模块。因此，使用该语言灵活的语法在语言*内部*实现了自定义的模块系统。其中两种流行的两种：\n\
  \n*   CommonJS（面向服务端）\n*   AMD（异步模块定义，面向客户端）\n\n### 27.4.1 服务端：CommonJS 模块\n\n原始\
  \ CommonJS 模块标准是为了服务器和桌面平台创建的。它是原始 Node.js 模块系统的基础，并在那里获得了巨大的普及。对这种普及做出贡献的包括 Node\
  \ 的 npm 包管理器以及允许在客户端使用 Node 模块的工具（browserify、webpack 等）。\n\n从现在起，*CommonJS 模块*指的是该标准的\
  \ Node.js 版本（它包含一些额外功能）。这是一个 CommonJS 模块的示例：\n\n```javascript\n// Imports\nvar importedFunc1\
  \ = require('./other-module1.js').importedFunc1;\nvar importedFunc2 = require('./other-module2.js').importedFunc2;\n\
  \n// Body\nfunction internalFunc() {\n  // ···\n}\nfunction exportedFunc() {\n \
  \ importedFunc1();\n  importedFunc2();\n  internalFunc();\n}\n\n// Exports\nmodule.exports\
  \ = {\n  exportedFunc: exportedFunc,\n};\n```\n\nCommonJS 的特征可以描述如下：\n\n*   为服务器设计。\n\
  *   模块旨在*同步*加载（导入者会等待被导入的模块加载并执行）。\n*   语法紧凑。\n\n### 27.4.2 客户端：AMD（异步模块定义）模块\n\n\
  创建 AMD 模块格式是为了比 CommonJS 格式更容易在浏览器中使用。它最流行的实现是 [RequireJS](https://requirejs.org)。以下是一个\
  \ AMD 模块的示例。\n\n```javascript\ndefine(['./other-module1.js', './other-module2.js'],\n\
  \  function (otherModule1, otherModule2) {\n    var importedFunc1 = otherModule1.importedFunc1;\n\
  \    var importedFunc2 = otherModule2.importedFunc2;\n\n    function internalFunc()\
  \ {\n      // ···\n    }\n    function exportedFunc() {\n      importedFunc1();\n\
  \      importedFunc2();\n      internalFunc();\n    } \n    return {\n      exportedFunc:\
  \ exportedFunc,\n    };\n  });\n```\n\nAMD 的特征可以描述如下：\n\n*   为浏览器设计。\n*   模块旨在*异步*加载。对于浏览器来说这是一项关键要求，因为代码无法等待模块完成下载。一旦模块可用，必须收到通知。\n\
  *   语法稍微复杂一些。\n\n优点是，AMD 模块可以直接执行。相比之下，CommonJS 模块必须在部署前进行编译，或者必须动态生成并评估自定义源代码（认为\
  \ `eval()` {\n  // ···\n}\n\nexport function exportedFunc() {\n  importedFunc1();\n\
  \  importedFunc2();\n  internalFunc();\n}\n```\n\n从现在起，“模块”意味着“ECMAScript 模块”。\n\
  \n### 27.5.1 ES 模块：语法、语义、加载 API\n\nES 模块的完整标准包含以下部分：\n\n1.  语法（代码如何编写）：什么是模块？如何声明导入和导出？等等。\n\
  2.  语义（代码如何执行）：变量绑定是如何导出的？导入是如何与导出连接的？等等。\n3.  一个用于配置模块加载的程序化加载 API。\n\n第 1 和第 2\
  \ 部分在 ES6 中引入的。第 3 部分的工作正在进行中。\n\n## 27.6 命名导出和导入\n\n\n\n\n\n### 27.6.1 命名导出 (Named\
  \ exports)\n\n每个模块可以有零或多个*命名导出*。\n\n例如，考虑以下两个文件：\n\n```\nlib/my-math.mjs\nmain.mjs\n\
  ```\n\n模块 `my-math.mjs` 有两个命名导出：`square` 和 `LIGHTSPEED`。\n\n```\n[](#cb524-1)//\
  \ 未导出，模块内私有\n[](#cb524-2)function times(a, b) {\n[](#cb524-3)  return a * b;\n[](#cb524-4)}\n\
  [](#cb524-5)export function square(x) {\n[](#cb524-6)  return times(x, x);\n[](#cb524-7)}\n\
  [](#cb524-8)export const LIGHTSPEED = 299792458;\n```\n\n要导出某些内容，我们在声明前面加上 `export`\
  \ 关键字。未导出的实体是模块内私有的，无法从外部访问。\n\n### 27.6.2 命名导入 (Named imports)\n\n模块 `main.mjs`\
  \ 有一个命名导入，`square`：\n\n```\n[](#cb525-1)import {square} from './lib/my-math.mjs';\n\
  [](#cb525-2)assert.equal(square(3), 9);\n```\n\n它也可以重命名其导入的内容：\n\n```\n[](#cb526-1)import\
  \ {square as sq} from './lib/my-math.mjs';\n[](#cb526-2)assert.equal(sq(3), 9);\n\
  ```\n\n#### 27.6.2.1 语法陷阱：命名导入并不是解构赋值\n\n命名导入和解构赋值看起来相似：\n\n```\n[](#cb527-1)import\
  \ {foo} from './bar.mjs'; // 导入\n[](#cb527-2)const {foo} = require('./bar.mjs');\
  \ // 解构赋值\n```\n\n但它们非常不同：\n\n- 导入与它们的导出之间保持着连接。\n- 你可以在解构模式内部再次进行解构，但 导入语句中的 `{}`\
  \ 不能嵌套。\n- 重命名的语法是不同的：\n\n  ```\n    [](#cb528-1)import {foo as f} from './bar.mjs';\
  \ // 导入\n    [](#cb528-2)const {foo: f} = require('./bar.mjs'); // 解构赋值\n  ```\n\
  \n原理：解构赋值让人联想起对象字面量（包括嵌套），而导入则唤起了重命名的概念。\n\n![](img/file6.svg) **练习：命名导出**\n\n`exercises/modules/export_named_test.mjs`\n\
  \n### 27.6.3 命名空间导入 (Namespace imports)\n\n*命名空间导入*是命名导入的替代方案。如果我们对模块进行命名空间导入，它将变成一个对象，其属性就是所有的命名导出。如果使用命名空间导入，`main.mjs`\
  \ 看起来如下所示：\n\n```\n[](#cb529-1)import * as myMath from './lib/my-math.mjs';\n[](#cb529-2)assert.equal(myMath.square(3),\
  \ 9);\n[](#cb529-3)\n[](#cb529-4)assert.deepEqual(\n[](#cb529-5)  Object.keys(myMath),\
  \ ['LIGHTSPEED', 'square']);\n```\n\n### 27.6.4 命名导出样式：内联与子句（高级）\n\n我们目前为止看到的命名导出样式是*内联的*：我们通过在实体前加上\
  \ `export` 关键字来导出。\n\n但我们也可以使用独立的*导出句 (export clauses)*。例如，这是使用导出句的 `lib/my-math.mjs`\
  \ 看起来的样子：\n\n```\n[](#cb530-1)function times(a, b) {\n[](#cb530-2)  return a * b;\n\
  [](#cb530-3)}\n[](#cb530-4)function square(x) {\n[](#cb530-5)  return times(x, x);\n\
  [](#cb530-6)}\n[](#cb530-7)const LIGHTSPEED = 299792458;\n[](#cb530-8)\n[](#cb530-9)export\
  \ { square, LIGHTSPEED }; // 有分号！\n```\n\n使用导出句，我们可以在导出之前进行重命名并在内部使用不同的名称：\n\n```\n\
  [](#cb531-1)function times(a, b) {\n[](#cb531-2)  return a * b;\n[](#cb531-3)}\n\
  [](#cb531-4)function sq(x) {\n[](#cb531-5)  return times(x, x);\n[](#cb531-6)}\n\
  [](#cb531-7)const LS = 299792458;\n//...\nexport {\n  sq as square,\n  LS as LIGHTSPEED,\
  \ // 末尾逗号是可选的\n};\n```\n\n## 27.7 默认导出与导入 (Default exports and imports)\n\n每个模块最多有一个*默认导出*。其理念是该模块*就是*默认导出的值。\n\
  \n![](img/file2.svg) **避免混合使用命名导出和默认导出**\n\n一个模块可以同时拥有命名导出和默认导出，但通常每个模块只坚持一种导出样式更好。\n\
  \n作为默认导出的示例，考虑以下两个文件：\n\n```\nmy-func.mjs\nmain.mjs\n```\n\n模块 `my-func.mjs` 有一个默认导出：\n\
  \n```\n[](#cb533-1)const GREETING = 'Hello!';\n[](#cb533-2)export default function\
  \ () {\n[](#cb533-3)  return GREETING;\n[](#cb533-4)}\n```\n\n模块 `main.mjs` 默认导入导出的函数：\n\
  \n```\n[](#cb534-1)import myFunc from './my-func.mjs';\n[](#cb534-2)assert.equal(myFunc(),\
  \ 'Hello!');\n```\n\n注意语法上的区别：命名导入周围的大括号 `{}` 表示我们正在进入模块*内部*，而默认导入*就是*模块本身。\n\n\
  ![](img/file3.svg) **默认导出的用例是什么？**\n\n默认导出最常见的用例是包含单个函数或单个类的模块。\n\n### 27.7.1 默认导出的两种样式\n\
  \n执行默认导出有两种样式。\n\n首先，你可以用 `export default` 为现有声明标记标签：\n\n```\n[](#cb535-1)export\
  \ default function foo() {} // 没有分号！\n[](#cb535-2)export default class Bar {} //\
  \ 没有分号！\n```\n\n其次，你可以直接默认导出值。在这种样式下，`export default` 本身非常像一个声明。\n\n```\n[](#cb536-1)export\
  \ default 'abc';\n[](#cb536-2)export default\n```\n\n#### 27.7.1.1 为什么会有这些样式？\n\n\
  原因是 `export default` 不能定义多个值，但 `export` 可以。考虑以下代码：\n\n```\n[](#cb537-1)export bar,\
  \ baz;\n```\n\n![](img/file6.svg) **练习：默认导出**\n\n`exercises/modules/export_default.mjs`\n\
  \n### 27.7.2 作为命名导出的默认导出（高级）\n\n在内部，默认导出只是命名为 `default` 的命名导出。作为示例，考虑之前的 `my-func.mjs`：\n\
  \n```\n[](#cb538-1)const GREETING = 'Hello!';\n[](#cb538-2)export default function\
  \ () {\n[](#cb538-3)  return GREETING;\n[](#cb538-4)}\n```\n\n以下模块 `my-func2.mjs`\
  \ 等效于该：\n\n```\n[](#cb539-1)const GREETING = 'Hello!';\n[](#cb539-2)export {\n \
  \ greet as default,\n};\n```\n\n对于导入，我们可以使用普通的默认导入：\n\n```\n[](#cb540-1)import myFunc\
  \ from './my-func2.mjs';\n[](#cb540-2)assert.equal(myFunc(), 'Hello!');\n```\n\n\
  或者我们可以使用命名导入：\n\n```\n[](#cb541-1)import {default as myFunc} from './my-func2.mjs';\n\
  [](#cb541-2)assert.equal(myFunc(), 'Hello!');\n```\n\n默认导出也可以通过命名空间导入的 `.default`\
  \ 属性可用：\n\n```\n[](#cb542-1)import * as mf from './my-func2.mjs';\n[](#cb542-2)assert.equal(mf.default(),\
  \ 'Hello!');\n```\n\n![](img/file3.svg) **default 作为变量名时是非法的吗？**\n\n`default` 不能作为变量名，但它可以作为导出名称，也可以作为属性名称：\n\
  \n```\n[](#cb543-1)const obj = {\n[](#cb543-2)  default: 123,\n};\n[](#cb543-3)assert.equal(obj.default,\
  \ 123);\n```\n\n## 27.8 关于导出和导入的更多细节\n\n### 27.8.1 导入是导出的只读视图\n\n到为止，我们直观地使用了导入和导出，一切似乎符合预期。但现在是时候仔细观察导入和导出之间是如何相关的。\n\
  \n考虑以下两个模块：\n\n```\ncounter.mjs\nmain.mjs\n```\n\n`counter.mjs` 导出了一个（可变的！）变量和一个函数：\n\
  \n```\n[](#cb545-1)export let counter = 3;\n[](#cb545-2)export function incCounter()\
  \ {\n[](#cb545-3)  counter++;\n[](#cb545-4)}\n```\n\n`main.mjs` 命名导入了两个导出。当我们使用\
  \ `incCounter()` 时，我们发现与 `counter` 的连接是实时的——我们可以始终访问该变量的实时状态：\n\n\n\n\n\n```javascript\n\
  import { counter, incCounter } from './counter.mjs';\n\n// 导入的值 `counter` 是实时的\n\
  assert.equal(counter, 3);\nincCounter();\nassert.equal(counter, 4);\n```\n\n请注意，虽然连接是实时的且我们可以读取\
  \ `counter`，但无法更改此变量（例如，通过 `counter++`）。\n\n这种处理导入方式有两个好处：\n\n* 模块更易拆分，因为以前共享的变量可以变成导出（exports）。\n\
  * 这种行为对于支持透明的循环引用至关重要。更多信息请阅读后文。\n\n### 27.8.2 ESM 对循环引用的透明支持（高级）\n\nESM 支持透明的循环引用。为了理解如何实现这一点，请考虑以下示例：图\
  \ 16 显示了模块导入其他模块的有向图。情况下，`P` 导入 `M` 就是这个循环。\n\n![](img/file25.svg)\n\n图 16：模块导入模块的有向图：`M`\
  \ 导入 `N` 和 `O`，`N` 导入 `P` 和 `Q`，等等。\n\n解析后，这些模块分两个阶段进行设置：\n\n* **实例化（Instantiation）**：访问每个模块并将其导入与其导出连接起来。在父模块实例化之前，其所有子模块必须先实例化。\n\
  * **评估（Evaluation）**：执行模块的主体。再次，子模块先于父模块被评估。\n\n这种方法能够正确处理循环引用，归功于 ES 模块的两个特性：\n\
  \n* 由于 ES 模块的静态结构，导出在解析后就已经确定了。这使得在子模块 `M` 之前实例化 `P` 成为可能：`P` 已经查找 `M` 的导出。\n* 当\
  \ `P` 被评估时，`M` 还没有被评估。然而，`P` 中的实体已经可以引用来自 `M` 的导入。它们只是还不能使用这些值，因为导入的值会在稍后填充。例如，`P`\
  \ 中的一个函数可以访问来自 `M` 的导入。唯一的限制是，我们必须等到 `M` 评估完成之后才能调用该函数。\n\n导入在稍后填充能够实现是因为它们是导出的“实时不可变视图”（live\
  \ immutable views）。\n\n### 27.9 npm 包\n\n*npm 软件注册表*是 Node.js 和浏览器发布 JavaScript\
  \ 库和应用的主流方式。它通过 *npm 包管理器*（简称：`npm`）管理。软件以所谓的*包（packages）的形式发布。包是一个包含任意文件的目录，以及一个位于顶层、描述该包的\
  \ `package.json` 文件。例如，当 `npm` 在目录 `foo/` 内部创建一个空包时，你会得到这个 `package.json`：\n\n```json\n\
  {\n  \"name\": \"foo\",\n  \"version\": \"1.0.0\",\n  \"description\": \"\",\n \
  \ \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"Error: no\
  \ test specified\\\" && exit 1\"\n  },\n  \"keywords\": [],\n  \"author\": \"\"\
  ,\n  \"license\": \"ISC\"\n}\n```\n\n这些属性中的包含简单的元数据：\n\n* `name` 指定此包的名称。一旦上传到 npm\
  \ 注册表，就可以通过 `npm install foo` 安装。\n* `version` 用于版本管理，并遵循[语义化版本](https://semver.org)，包含三个数字：\n\
  \    * **主版本（Major version）**：进行不兼容的 API 更改时增加。\n    * **次版本（Minor version）**：以向后兼容的方式添加功能时增加。\n\
  \    * **补丁版本（Patch version）**：进行向后兼容的更改时增加。\n* `description`、`keywords`、`author`\
  \ 可以更容易找到包。\n* `license` 明确了你可以如何使用此包。\n\n其他属性允许高级配置：\n\n* `main`：指定“是”该包的模块（在本章稍后解释）。\n\
  * `scripts`：你可以通过 `npm run` 执行的命令。例如，可以通过 `npm run test` 执行脚本 `test` 。\n\n有关 `package.json`\
  \ 的更多信息，请参阅 [npm 文档](https://docs.npmjs.com/files/package.json)。\n\n### 27.9.1 包安装在目录\
  \ `node_modules/` 内部\n\n`npm` 总是将包安装在 `node_modules` 目录内。通常有很多这样的目录。`npm` 使用哪一个取决于用户当前所在的目录。例如，如果我们在目录\
  \ `/tmp/a/b/` 内部，`npm` 会尝试在当前目录、其父目录、父目录的父目录等处查找 `node_modules`。换句话说，它搜索以下位置链*：\n\
  \n* `/tmp/a/b/node_modules`\n* `/tmp/a/node_modules`\n* `/tmp/node_modules`\n\n\
  在安装包 `foo` 时，`npm` 使用最近的 `node_modules`。例如，如果我们在 `/tmp/a/b/` 内部且该目录下有一个 `node_modules`，那么\
  \ `npm` 会把包放在该目录下：\n\n```\n/tmp/a/b/node_modules/foo/\n```\n\n在导入模块时，我们可以使用特殊的模块\
  \ specifier 来告诉 Node.js 我们想从已安装的包导入它。具体工作原理将在稍后解释。现在，考虑以下示例：\n\n```javascript\n\
  // /home/jane/proj/main.mjs\nimport * as theModule from 'the-package/the-module.mjs';\n\
  ```\n\n为了找到 `the-module.mjs`（Node.js 优先为 ES 模块使用 `.mjs` 后后缀），Node.js 会向上遍历 `node_module`\
  \ 链并搜索以下位置：\n\n* `/home/jane/proj/node_modules/the-package/the-module.mjs`\n* `/home/jane/node_modules/the-package/the-module.mjs`\n\
  * `/home/node_modules/the-package/the-module.mjs`\n\n### 27.9.2 为什么可以用 npm 安装前端库？\n\
  \n在 `node_modules` 目录中查找已安装的模块仅由 Node.js 支持。那么为什么我们也可以用 `npm` 安装浏览器库呢？\n\n这是通过打包工具）。因此，我们避免使用驼峰，以便“本地”文件的名称与\
  \ npm 包一致。仅使用小写字母还可以减少大小敏感文件系统与不敏感文件系统之间的冲突：前者区分名称相同但大小不同的文件；后者则不。\n* 将短横线文件名转换为小驼峰\
  \ JavaScript 变量名有明确的规则。由于我们命名命名空间，这些规则适用于命名空间导入和默认导入。\n\n我也喜欢下划线命名的模块文件名，因为你可以直接将这些名称用于命名空间（无需任何翻译）：\n\
  \n```javascript\nimport * as my_module from './my_module.mjs';\n```\n\n但这种风格不适用于默认导入：我喜欢命名空间对象使用下划线，但对于函数等并不是一个好的选择。\n\
  \n### 27.11 模块 specifier\n\n*模块 specifier* 是标识模块的字符串。它们在浏览器和 Node.js 中的工作方式略有不同。在查看差异之前，我们需要了解不同类别的模块\
  \ specifier。\n\n### 27.11.1 模块 specifier 的类别\n\n\n\n\n\n在 ES 模块中，我们区分以下几类指定符（specifiers）。这些类别源自\
  \ CommonJS 模块。\n\n*   相对路径：以点开头。例如：\n```\n'./some/other/module.mjs'\n'../../lib/counter.mjs'\n\
  ```\n\n*   绝对路径：以斜杠开头。例如：\n```\n'/home/jane/file-tools.mjs'\n```\n\n*   URL：包含协议（技术上来说，路径也是\
  \ URL）。例如：\n```\n'https://example.com/some-module.mjs'\n'file:///home/john/tmp/main.mjs'\n\
  ```\n\n*   裸路径（Bare path）：不以点、斜杠或协议开头，且由一个不带扩展名的单一文件名组成。例如：\n```\n'lodash'\n'the-package'\n\
  ```\n\n*   深层导入路径：以裸路径开头并包含至少一个斜杠。例如：\n```\n'the-package/dist/the-module.mjs'\n\
  ```\n\n## 27.11.2 浏览器中的 ES 模块指定符\n\n浏览器处理模块指定符的方式如下：\n\n*   相对路径、绝对路径和 URL 按预期方式工作。它们都必须指向真实文件（与\
  \ CommonJS 不同，CommonJS 允许省略文件名扩展名等）。\n\n*   模块的文件扩展名并不重要，只要它们以 `text/javascript`\
  \ 内容类型提供服务即可。\n\n*   裸路径将如何被处理目前尚不清楚。你最终可能能够通过查找表将它们映射到其他指定符。\n\n注意，像 `webpack`](#ch047.xhtml_bundler)\
  \ 这种将模块合并为少量文件的打包工具通常比浏览器。。是因为它们在构建/编译时运行（而不是运行时），并且可以通过遍历文件系统搜索文件。\n\n## 27.11.3\
  \ Node.js 中的 ES 模块指定符\n\n![](img/file4.svg) **Node.js 对 ES 模块的支持仍然处于新阶段**\n\n你可能需要通过命令行标记来开启它。详情请参阅\
  \ [Node.js 文档](https://nodejs.org/api/esm.html)。\n\nNode.js 处理模块指定符的方式如下：\n\n* \
  \  相对路径的解析方式与 Web 浏览器相同——相对于当前模块的路径。\n\n*   目前不支持绝对路径。作为替代方案，你可以使用以 `file:///` 开头的\
  \ URL。你可以通过 `url.pathToFileURL()` 创建此类 URL。\n\n*   URL 指定符仅支持 `file:` 作为协议。\n\n\
  *   裸路径被解释为包名，并相对于最近的 `node_modules` 目录进行解析。应该加载哪个模块取决于查看包 `package.json` 中的 `\"\
  main\"` 属性（类似于 CommonJS）。\n\n*   深层导入路径也相对于最近的 `node_modules` 目录进行解析。它们包含文件名，因此始终能够明确指代哪个模块。\n\
  \n除了裸路径外，所有指定符都必须引用实际文件。也就是说，ESM 支持以下 CommonJS 特性：\n\n*   CommonJS 会自动添加缺失的文件名扩展名。\n\
  *   如果存在带有 `\"main\"` 属性的 `foo/package.json`，CommonJS 可以导入目录 `foo`。\n*   如果存在模块\
  \ `foo/index.js`，CommonJS 可以导入目录 `foo`。\n\n所有内置的 Node.js 模块都可以通过裸路径访问，并具有具名的 ESM\
  \ 导出——例如：\n\n```\nimport * as path from 'path';\nimport {strict as assert} from\
  \ 'assert';\n\nassert.equal(\n  path.join('a/b/c', '../d'), 'a/b/d');\n```\n\n###\
  \ 27.11.3.1 Node.js 中的文件名扩展名\n\nNode.js 支持以下默认文件名扩展名：\n\n*   `.mjs` 用于 ES 模块\n*\
  \   `.cjs` 用于 CommonJS 模块\n\n`.js` 扩展名代表 ESM 或 CommonJS。具体是哪一个通过“最近的” `package.json`（在当前目录、父目录等）进行配置的。这种方式使用\
  \ `package.json` 方法与包无关。\n\n在那个 `package.json` 中，有一个 `\"type\"` 属性，它有两个设置：\n\n*\
  \   `\"commonjs\"`（默认值）：扩展名为为 `.js` 或无扩展名的文件被解释为 CommonJS 模块。\n*   `\"module\"`：扩展名为为\
  \ `.js` 或无扩展名的文件被解释为 ESM 模块。\n\n### 27.11.3.2 将非文件源代码解释为 CommonJS 或 ESM\n\n并不是所有\
  \ Node.js 执行的源代码都来自文件。你也可以通过 `stdin`、`--eval` 和 `--print` 发送代码。命令行选项 `--input-type`\
  \ 允许你指定如何解释此类代码：\n\n*   作为 CommonJS（默认）：`--input-type=commonjs`\n*   作为 ESM：`--input-type=module`\n\
  \n## 27.12 通过 `import()` 动态加载模块\n\n到为止，导入模块的唯一方法是通过 `import` 语句。该语句有几个局限性：\n\n*\
  \   你必须在模块的顶层使用它。也就是说，例如，你不能在块内部导入内容。\n*   模块指定符总是固定的。也就是说，你不能根据条件更改导入的内容。你不能动态组装指定符。\n\
  \n`import()` 运算符改变了这一点。让我们来看它的使用示例。\n\n### 27.12.1 示例：动态加载模块\n\n考虑以下文件：\n\n```\n\
  lib/my-math.mjs\nmain1.mjs\nmain2.mjs\n```\n\n我们已经见过模块 `my-math.mjs`：\n\n```\n//\
  \ 未导出，模块内私有\nfunction times(a, b) {\n  return a * b;\n}\nexport function square(x)\
  \ {\n  return times(x, x);\n}\nexport const LIGHTSPEED = 299792458;\n```\n\n这是在\
  \ `main1.mjs` 中使用 `import()` 的样子：\n\n```\nconst dir = './lib/';\nconst moduleSpecifier\
  \ = dir + 'my-math.mjs';\n\nfunction loadConstant() {\n  return import(moduleSpecifier)\n\
  \  .then(myMath => {\n    const result = myMath.LIGHTSPEED;\n    assert.equal(result,\
  \ 299792458);\n    return result;\n  });\n}\n```\n\n`.then()` 方法是 `Promises` 的一部分，用于处理异步结果的机制，将在稍后介绍](#ch41.xhtml_promises）。\n\
  \n上述两点在之前是不可能的：\n\n*   我们在函数内部导入（而不是顶层）。\n*   模块指定符来自变量。\n\n接下来，我们将在 `main2.mjs`\
  \ 中实现相同的功能，但通过所谓的 `async function`，它为 `Promises` 提供了更好的语法。\n\n```\nconst dir = './lib/';\n\
  const moduleSpecifier = dir + 'my-math.mjs';\n\nasync function loadConstant() {\n\
  \  const myMath = await import(moduleSpecifier);\n  const result = myMath.LIGHTSPEED;\n\
  \  assert.equal(result, 299792458);\n  return result;\n}\n```\n\n![](img/file3.svg)\
  \ **为什么 `import()` 是运算符而不是函数？**\n\n尽管它的工作方式很像函数，但 `import()` 是运算符：为了相对于当前模块解析指定符，它需要知道是从哪个模块调用的。普通无法无法运算符那样隐式地接收这种信息。它可能需要一个参数。\n\
  \n## 27.12.2 `import()` 的用例\n\n#### 27.12.2.1 按需加载代码\n\n网络应用的一些功能不需要启动时存在，可以按需加载。这时\
  \ `import()` 就很有帮助，因为你可以将此类功能放入模块中——例如：\n\n```\nbutton.addEventListener('click',\
  \ event => {\n  import('./dialogBox.mjs')\n    .then(dialogBox => {\n      dialogBox.open();\n\
  \    })\n    .catch(error => {\n      /* 错误处理 */\n    })\n});\n```\n\n#### 27.12.2.2\
  \ 模块的条件加载\n\n我们可能根据条件是否真来加载模块。例如，一个带有补丁 的模块，用于在旧平台上使新功能可用。\n\n\n\n\n\n```javascript\n\
  if (isLegacyPlatform()) {\n  import('./my-polyfill.mjs')\n    .then(···);\n}\n```\n\
  \n## 27.12.2.3 计算出的模块规格符\n\n对于国际化等应用，能够动态计算模块规格化符将非常有帮助：\n\n```javascript\nimport(`messages_${getLocale()}.mjs`)\n\
  \  .then(···);\n```\n\n## 27.13 预览：`import.meta.url`\n\n[```import.meta``](https://github.com/tc39/proposal-import-meta)\
  \ 是由 Domenic Denicola 提出的一个 ECMAScript 特性。`import.meta` 对象持有当前模块的元数据。\n\n它最重要的属性是\
  \ `import.meta.url`，它包含一个当前模块文件 URL 的字符串。例如：\n\n```\n'https://example.com/code/main.mjs'\n\
  ```\n\n### 27.13.1 `import.meta.url` 和 `URL` 类\n\n`URL` 类可以通过浏览器和 Node.js 中的全局变量访问。你可以在\
  \ [Node.js 文档](https://nodejs.org/api/url.html#url_class_url) 中查询其完整功能。在使用 `import.meta.url`\
  \ 时，它的构造函数特别有用：\n\n```javascript\nnew URL(input: string, base?: string|URL)\n```\n\
  \n参数 `input` 包含要解析的 URL。如果提供了第二个参数 `base`，它可以是相对路径。\n\n换句话说，此构造函数允许我们相对于基础 URL 解析相对路径：\n\
  \n```\n> new URL('other.mjs', 'https://example.com/code/main.mjs').href\n'https://example.com/code/other.mjs'\n\
  > new URL('../other.mjs', 'https://example.com/code/main.mjs').href\n'https://example.com/other.mjs'\n\
  ```\n\n这就是我们如何获取指向当前模块旁文件 `data.txt` 的 `URL` 实例：\n\n```javascript\nconst urlOfData\
  \ = new URL('data.txt', import.meta.url);\n```\n\n### 27.13.2 Node.js 上的 `import.meta.url`\n\
  \n在 Node.js 中，`import.meta.url` 始终是一个带有 `file:` URL 的字符串——例如：\n\n```\n'file:///Users/rauschma/my-module.mjs'\n\
  ```\n\n#### 27.13.2.1 示例：读取模块的兄弟文件\n\n许多 Node.js 文件系统操作接受路径字符串或 `URL` 实例。这使我们能够读取当前模块的兄弟文件\
  \ `data.txt`：\n\n```javascript\nimport {promises as fs} from 'fs';\n\nasync function\
  \ main() {\n  const urlOfData = new URL('data.txt', import.meta.url);\n  const str\
  \ = await fs.readFile(urlOfData, {encoding: 'UTF-8'});\n  assert.equal(str, 'This\
  \ is textual data.\\n');\n}\nmain();\n```\n\n`main()` 是一个异步函数，见 §41 “异步函数` 中的解释。\n\
  \n[`fs.promises`](https://nodejs.org/api/fs.html#fs_fs_promises_api) 包含了基于 Promise\
  \ 的版本 `fs` API，可以与异步函数一起使用。\n\n#### 27.13.2.2 `file:` URL 与路径之间的转换\n\nNode.js 模块\
  \ [`url`](https://nodejs.org/api/url.html) 有两个用于在 `file:` URL 和路径之间转换函数：\n\n* `fileURLToPath(url:\
  \ URL|string): string`\n  将 `file:` URL 转换为路径。\n\n* `pathToFileURL(path: string):\
  \ URL`\n  将路径转换为 `file:` URL。\n\n如果你需要可以在本地文件系统中使用的路径，那么 `URL` 实例的 `.pathname` 属性并不总是有效：\n\
  \n```javascript\nassert.equal(\n  new URL('file:///tmp/with%20space.txt').pathname,\n\
  \  '/tmp/with%20space.txt');\n```\n\n因此，使用 `fileURLToPath()` 更好：\n\n```javascript\n\
  import * as url from 'url';\nassert.equal(\n  url.fileURLToPath('file:///tmp/with%20space.txt'),\n\
  \  '/tmp/with space.txt'); // Unix 上的结果\n```\n\n同样，`pathToFileURL()` 所做的不仅仅是向绝对路径前面加上\
  \ `'file://'`。\n\n## 27.14 Polyfills：模拟原生 Web 平台特性（高级）\n\n**后端也有 polyfills**\n\n\
  这一部分关于前端开发和 Web 浏览器，但类似的思想也适用于后端开发。\n\n*Polyfills* 有助于解决我们在 JavaScript 开发 Web 应用时面临的冲突：\n\
  \n* 一方面，我们想要使用现代 Web 平台特性，让应用更好和或让开发更容易。\n* 另一方面，应用应该在尽可能多的浏览器上运行。\n\n给定一个 Web 平台特性\
  \ X：\n\n* X 的 `polyfill`是一段代码。如果它在已经内置支持 X 的平台上执行，它将什么都不做。否则，它会在该平台上提供该特性。在后一种情况下，被\
  \ polyfill 的特性（大部分）与原生实现无异。为了实现这一点，polyfill 通常会进行全局更改。例如，它可能会修改全局数据或配置全局模块加载器。Polyfills\
  \ 通常被封装为模块。\n  * [`polyfill`](https://remysharp.com/2010/10/08/what-is-a-polyfill)\
  \ 术语由 Remy Sharp 创造。\n  * `speculative polyfill` 是针对提议中的 Web 平台特性（尚未标准化）的 polyfill。\n\
