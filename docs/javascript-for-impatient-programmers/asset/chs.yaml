  \ 12.9.4 闭包的使用场景\n* 12.10 延伸阅读\n\n\n\n\n\n这些是 JavaScript 声明变量的主要方式：\n\n- `let` 声明可变变量。\n\
  - `const` 声明`constants`（不可变变量）。\n\n在 ES6 之前，还有 `var`。但它有许多怪特性，因此在现代 JavaScript 中最好避免使用。你可以在\
  \ [*Speaking JavaScript](http://speakingjs.com/es5/ch16.html) 中阅读更多相关信息。\n\n###\
  \ 12.1 `let`\n\n通过 `let` 声明的变量是可变的：\n\n```javascript\nlet i;\ni = 0;\ni = i + 1;\n\
  assert.equal(i, 1);\n```\n\n你也可以同时进行声明和赋值：\n\n```javascript\nlet i = 0;\n```\n\n\
  ### 12.2 `const`\n\n通过 `const` 声明的变量是不可变的。你必须始终初始化：\n\n```javascript\nconst i =\
  \ 0; // 必须初始化\nassert.throws(\n  () => { i = i + 1 },\n  {\n    name: 'TypeError',\n\
  \    message: 'Assignment to constant variable.',\n  }\n);\n```\n\n### 12.2.1 `const`\
  \ 和不可变性\n\n在 JavaScript 中，`const` 意味着`binding`（变量名与变量值之间的关联）是不可变的。值本身可能是可变的，例如示例中的\
  \ `obj`。\n\n```javascript\nconst obj = { prop: 0 };\n\n// 允许：更改 `obj` 的属性\nobj.prop\
  \ = obj.prop + 1;\nassert.equal(obj.prop, 1);\n\n// 不允许：给 `obj` 赋值\nassert.throws(\n\
  \  () => { obj = {} },\n  {\n    name: 'TypeError',\n    message: 'Assignment to\
  \ constant variable.',\n  }\n);\n```\n\n### 12.2.2 `const` 和循环\n\n你可以在 `for-of`\
  \ 循环中使用 `const`，其中每次迭代都会创建一个新的绑定：\n\n```javascript\nconst arr = ['hello', 'world'];\n\
  for (const elem of arr) {\n  console.log(elem);\n}\n// 输出：\n// 'hello'\n// 'world'\n\
  ```\n\n但在普通的 `for` 循环中，你必须使用 `let`：\n\n```javascript\nconst arr = ['hello', 'world'];\n\
  for (let i=0; i<arr.length; i++) {\n  const elem = arr[i];\n  console.log(elem);\n\
  }\n```\n\n## 12.3 决定使用 `const` 还是 `let`\n\n我建议遵循以下规则决定使用 `const` 还是 `let`：\n\n-\
  \ `const` 表示绑定不可变，变量永远不会改变其值。优先使用它。\n- `let` 表示变量的值会改变。只有在无法使用 `const` 时才使用它。\n\n\
  **练习：`const`**\n\n`exercises/variables-assignment/const_exrc.mjs`\n\n### 12.4 变量的作用域\n\
  \n变量的`scope`（作用域）是程序中可以访问它的区域。考虑以下代码：\n\n```javascript\n{ // 范围 A。可访问 x\n  const\
  \ x = 0;\n  assert.equal(x, 0);\n  { // 范围 B。可访问 x, y\n    const y = 1;\n    assert.equal(x,\
  \ 0);\n    assert.equal(y, 1);\n    { // 范围 C。可访问 x, y, z\n      const z = 2;\n\
  \      assert.equal(x, 0);\n      assert.equal(y, 1);\n      assert.equal(z, 2);\n\
  \    }\n  }\n}\n// 外部。不可访问：x, y, z\nassert.throws(\n  () => console.log(x),\n  {\n\
  \    name: 'ReferenceError',\n    message: 'x is not defined',\n  }\n);\n```\n\n\
  - 范围 A 是 `x` 的`direct scope`（直接作用域）。\n- 范围 B 和 C 是范围 A 的`inner scopes`（内部作用域）。\n\
  - 范围 A 是范围 B 和 C 的`outer scope`（外部作用域）。\n\n变量在其直接作用域及其内部的所有作用范围内都是可的。通过 `const`\
  \ 和 `let` 声明的变量是`block-scoped`（块级作用域），因为它们的作用域始终是最内层的块。\n\n### 12.4.1 变量遮蔽\n\n你不能在同一层级两次声明同一个变量：\n\
  \n```javascript\nassert.throws(\n  () => {\n    let x = 1; let x = 2;\n  },\n  {\n\
  \    name: 'SyntaxError',\n    message: \"Identifier 'x' has already been declared\"\
  ,\n  }\n);\n```\n\n**为什么用 `eval()`？**\n\n`eval()` 延迟了解析（因此延迟了 `SyntaxError`），直到\
  \ `assert.throws()` 的回调执行。如果我们不使用它，在这段代码被解析时就会报错，导致 `assert.throws()` 无法执行。\n\n\
  然而，你可以嵌套一个块，并使用与块外部相同的变量名 `x`：\n\n```javascript\nconst x = 1;\nassert.equal(x, 1);\n\
  {\n  const x = 2;\n  assert.equal(x, 2);\n}\nassert.equal(x, 1);\n```\n\n在块内部，内部的\
  \ `x` 是唯一可访问的同名变量。内部的 `x` 被称为`shadow`（遮蔽）外部的 `x`。一旦离开该块，你就可以再次访问旧值。\n\n**测验：基础**\n\
  \n查看 quiz app。\n\n## 12.5 (高级)\n\n所有剩余章节均为高级内容。\n\n### 12.6 术语：静态 vs 动态\n\n这两个形容词描述了编程语言中的现象：\n\
  \n- `Static`（静态）意味着与源代码有关，可以在不执行代码的情况下确定。\n- `Dynamic`（动态）意味着运行时。\n\n让我们看看这两个术的示例。\n\
  \n### 12.6.1 静态现象：变量的作用域\n\n变量作用域是一种静态现象。考虑以下代码：\n\n```javascript\nfunction f()\
  \ {\n  const x = 3;\n  // ···\n}\n```\n\n`x` 是`statically`（静态地或词法地）`scoped`。也就是说，它的作用域是固定的，不会在运行时改变。变量作用域形成了一个静态树（通过静态嵌套）。\n\
  \n### 12.6.2 动态现象：函数调用\n\n函数调用是一种动态现象。考虑以下代码：\n\n```javascript\nfunction g(x) {}\n\
  function h(y) {\n  if (Math.random()) g(y); // (A)\n}\n```\n\n行 A 中的函数调用是否发生，只能在运行时决定。函数调用形成了一个动态树（通过动态调用）。\n\
  \n## 12.7 全局变量和全局对象\n\nJavaScript 的变量作用域是嵌套的。它们形成一棵树：\n\n- 最外层的作用是树的根。\n- 直接包含在该作用域内的范围是根的子节点。\n\
  - 以此类推。\n\n根被称为`global scope`（全局作用域）。在 浏览器中，唯一直接在该作用域的地方是脚本的顶层。全局作用域的变量称为`global\
  \ variables`（全局变量），随处可访问。全局变量有两种：\n\n- `Global declarative variables`（全局声明变量）是普通变量。\n\
  \  - 它们只能在脚本顶层通过 `const`、`let` 和类声明创建。\n- `Global object variables`（全局对象变量）存储在所谓的`global\
  \ object`的属性中。\n  - 它们在脚本顶层通过 `var` 和函数声明创建。\n  - 可以通过全局变量 `globalThis` 访问全局对象。它可以创建、读取和删除全局对象变量。\n\
  \  - 除此之外，全局对象变量的行为像普通变量一样。\n\n下面的 HTML 片段演示了 `globalThis` 和两种全局变量。\n\n\n\n\n\n\
  ```\n[](#cb111-1)<script>\n[](#cb111-2)  const declarativeVariable = 'd';\n[](#cb111-3)\
  \  var objectVariable = 'o';\n[](#cb111-4)</script>\n[](#cb111-5)<script>\n[](#cb111-6)\
  \  // All scripts share the same top-level scope:\n[](#cb111-7)  console.log(declarativeVariable);\
  \ // 'd'\n[](#cb111-8)  console.log(objectVariable); // 'o'\n[](#cb111-9) \n[](#cb111-10)\
  \  // Not all declarations create properties of the global object:\n[](#cb111-11)\
  \  console.log(globalThis.declarativeVariable); // undefined\n[](#cb111-12)  console.log(globalThis.objectVariable);\
  \ // 'o'\n[](#cb111-13)</script>\n```\n\n每个 `ECMAScript` 模块都有自己的作用域。因此，存在于模块顶层的变量并不是全局变量。图\
  \ 5 展示了各种作用域之间的关系。\n\n![](img/file12.svg)\n\n图 5：全局作用域是 JavaScript 最外层的作用域。它有两种变量：`对象变量`（通过`全局对象`管理）和普通的`声明变量`。每个\
  \ `ECMAScript` 模块都有自己的作用域，该作用域包含在全局作用域内。\n\n### 12.7.1 `globalThis`\n\n![](img/file4.svg)\
  \ **`globalThis` 是新的**\n\n`globalThis` 是一个新特性。请确保你的目标 JavaScript 引擎支持它。如果没有，请切换到下面提到的替代方案。\n\
  \n全局变量 `globalThis` 是访问全局对象的新标准方式。它的名字来源于它在全局作用域下与 `this` 相同的值。\n\n![](img/file5.svg)\
  \ **`globalThis` 并不总是直接指向全局对象**\n\n例如，在浏览器中，[存在间接层](https://2ality.com/2019/08/global-this.html#window-proxy)。这种间接层通常难以察觉，但确实存在且可以被观察。\n\
  \n#### 12.7.1.1 `globalThis` 的替代方案\n\n访问全局对象的旧方法取决于平台：\n\n*   全局变量 `window`：是引用全局对象的经典方式。但在\
  \ Node.js 和 Web Workers 中不起作用。\n\n*   全局变量 `self`：在 Web Workers 和通用浏览器中可用。但 Node.js\
  \ 不支持。\n\n*   全局变量 `global`：仅在 Node.js 中可用。\n\n#### 12.7.1.2 `globalThis` 的用例\n\n\
  由于后兼容，全局对象现在被认为是 JavaScript 无法消除的错误。它对性能有负面影响且通常令人困惑。\n\n`ECMAScript` 6 引入了若干特性，使得更容易避免全局对象——例如：\n\
  \n*   `const`、`let` 和 `class` 声明在全局作用域中使用时不会为全局对象创建属性。\n\n*   每个 `ECMAScript` 模块都有自己的局部作用域。\n\
  \n通常通过变量访问全局对象变量，而不是通过 `globalThis` 的属性访问更好。前者在所有 JavaScript 平台上始终表现一致。\n\n网络上的教程偶尔通过\
  \ `window.globVar` 访问全局变量 `globVar`。但 `window.` 前缀并不是必要的，我建议省略它：\n\n```\n[](#cb112-1)window.encodeURIComponent(str);\
  \ // 否\n[](#cb112-2)encodeURIComponent(str); // 是\n```\n\n因此，`globalThis` 的用例相对较少——例如：\n\
  \n*   Polyfills，用于为旧版 JavaScript 引擎添加新特性。\n\n*   特性检测，用于查找 JavaScript 引擎支持哪些特性。\n\
  \n### 12.8 声明：作用域与激活\n\n这些是声明的两个关键方面：\n\n*   作用域（Scope）：声明的实体在哪里被看到？这是一个静态特征。\n\n\
  *   激活（Activation）：我什么时候可以访问某个实体？这是一个动态特征。某些实体一旦进入其作用域就可以被访问。而对于其他实体，我们必须等待执行到达它们的声明处。\n\
  \n表 1 总结了各种声明如何处理这些方面。\n\n表 1：声明的方面。“重复”描述了一个声明是否可以（在作用域内）使用相同的名称。“全局属性”描述了声明在脚本的全局作用域中执行时是否会向全局对象添加属性。`TDZ`\
  \ 表示 `临时性死区`（后文会解释）。(*) 函数声明通常是块级作用域的，但在非严格模式](#ch009.xhtml_strict-mode) 下是函数作用域的。\n\
  \n| | 作用域 | 激活 | 重复 | 全局属性 |\n| --- | --- | --- | --- | --- |\n| `const` | 块 | 声明\
  \ (TDZ) | `✘` | `✘` |\n| `let` | 块 | 声明 (TDZ) | `✘` | `✘` |\n| `function` | 块 |\
  \ 开始 | `✔` | `✔` |\n| `class` | 块 | 声明 (TDZ) | `✘` | `✘` |\n| `import` | 模块 | 开始\
  \ | `✘` | `✘` |\n| `var` | 函数 | 开始 | `✔` | `✔` |\n\n### 12.8.1 `const` 和 `let`\n\
  \n`const` 和 `let` 具有临时性死区（TDZ），即从块开始到变量声明之间的这段时期。在此期间访问变量会导致 `ReferenceError`。\n\
  \n接下来的章节将详细描述 `const` 和 `let`。\n\n#### 12.8.1.1 `const`\n\n`const` 声明一个块级作用域的常量，其不能重新赋值。它必须在声明时初始化。\n\
  \n以下代码说明了临时性死区：\n\n```\n[](#cb114-1)if (true) { // 进入作用域，TDZ\n[](#cb114-2)  // tmp\
  \ 未初始化：\n[](#cb114-3)  assert.throws(() => tmp = 'abc'), ReferenceError);\n[](#cb114-4)\
  \  assert.throws(() => console.log(tmp), ReferenceError);\n[](#cb114-5)\n[](#cb114-6)\
  \  let tmp; // TDZ 结束\n[](#cb114-7)  assert.equal(tmp, undefined);\n[](#cb114-8)}\n\
  ```\n\n`const` 和 `let` 在 TDZ 方面行为相似，但 `const` 不能被重新赋值。\n\n#### 12.8.1.2 `let`\n\n\
  `let` 声明一个可以重新赋值的块级作用域变量。\n\n下一个示例显示临时性死区是*时间性的*的：\n\n```\n[](#cb115-1)if (true)\
  \ { // 进入 myVar 作用域，TDZ 开始\n[](#cb115-2)  const func = () => {\n[](#cb115-3)   \
  \ console.log(myVar); // 后执行\n[](#cb115-4)  };\n[](#cb115-5)  // 我们处于 TDZ 之中：\n\
  [](#cb115-6)  // 访问 myVar 会导致 ReferenceError\n[](#cb115-7)\n[](#cb115-8)  let myVar\
  \ = 3; // TDZ 结束\n[](#cb115-9)  func(); // OK，在 TDZ 之外调用\n[](#cb115-10)}\n```\n\n\
  ### 12.8.2 函数声明与早期激活\n\n![](img/file0.svg) **关于函数的更多信息**\n\n在本节中，我们正在使用函数——在我们有机会正确学习它们之前。希望一切仍然清晰。任何不理解的地方，请参\
  \ §25 “可调用值`。\n\n函数声明在进入其作用域时始终执行，无论它位于该作用域的哪个位置。这允许你在声明之前调用函数 `foo()`：\n\n```\n\
  [](#cb116-1)assert.equal(foo(), 123); // OK\n[](#cb116-2)function foo() { return\
  \ 123; }\n```\n\n`foo()` 的早期激活意味着之前的代码等同于：\n\n\n\n\n\n```javascript\nfunction foo()\
  \ { return 123; }\nassert.equal(foo(), 123);\n```\n\n如果你通过 `const` 或 `let` 声明函数，那么它不会被“早期激活”（early\
  \ activation）。在下面的示例中，你只能在 `bar()` 声明之后使用它。\n\n```javascript\nassert.throws(\n \
  \ () => bar(), // 声明之前\n  ReferenceError);\n\nconst bar = () => { return 123; };\n\
  \nassert.equal(bar(), 123); // 声明之后 \n```\n\n### 12.8.2.1 在没有早期激活的情况下提前调用\n\n即使函数\
  \ `g()` 没有被早期激活，只要我们遵循以下规则：`f()` 必须在 `g()` 声明之后被调用，它就可以被前面的函数 `f()`（在同一作用域内）调用。\n\
  \n```javascript\nconst f = () => g();\nconst g = () => 123;\n\n// 我们在 g() 声明后调用\
  \ f():\nassert.equal(f(), 123);\n```\n\n模块的函数通常在其整个主体执行完毕后才被调用。因此，在模块中，很少需要担心函数的顺序。\n\
  \n最后，注意早期激活是如何自动维持上述规则的：当进入一个作用域时，所有的函数声明都会先执行，在进行任何调用之前。\n\n### 12.8.2.2 早期激活的陷阱\n\
  \n如果你依赖早期激活在函数声明之前调用函数，那么你需要小心确保它不会访问尚未早期激活的数据。\n\n```javascript\nfuncDecl();\n\n\
  const MY_STR = 'abc';\nfunction funcDecl() {\n  assert.throws(\n    () => MY_STR,\n\
  \    ReferenceError);\n}\n```\n\n如果你在 `MY_STR` 声明之后再调用 `funcDecl()`，问题就会消失。\n\n\
  ### 12.8.2.3 早期激活的优缺点\n\n我们已经看到早期激活存在陷阱，而且在不使用它的情况下也可以获得它的大部分益处。因此，避免早期激活会更好。但我对此并不持强烈反对意见，并且正如之前提到的，我经常使用函数声明，因为我喜欢它们的语法。\n\
  \n### 12.8.3 类声明没有被早期激活\n\n尽管类声明在某些方面与函数声明相似，但类声明并没有被早期激活：\n\n```javascript\nassert.throws(\n\
  \  () => new MyClass(),\n  ReferenceError);\n\nclass MyClass {}\n\nassert.equal(new\
  \ MyClass() instanceof MyClass, true);\n```\n\n为什么呢？考虑以下类声明：\n\n```javascript\n\
  class MyClass extends Object {}\n```\n\n`extends` 的操作数是一个表达式。因此，你可以像这样做：\n\n```javascript\n\
  const identity = x => x;\nclass MyClass extends identity(Object) {}\n```\n\n对此类表达式的求值必须在提到它的地方进行。任何任何都会导致混乱。这解释了为什么类声明没有被早期激活。\n\
  \n### 12.8.4 var: 变量提升（部分早期激活）\n\n`var` 是一种声明变量的旧方式，早于 `const` 和 `let`（现在更倾向于使用它们）。考虑以下\
  \ `var` 声明。\n\n```javascript\nvar x = 123;\n```\n\n该声明包含两个部分：\n\n* 声明 `var x`：`var`\
  \ 声明变量的作用域是最近的内部函数，而不是最近的内部块（像大多数其他声明那样）。这种变量在作用作用域开始时就已经处于激活状态，并初始化为 `undefined`。\n\
  * 赋值 `x = 123`：赋值始终在原地执行。\n\n下面的代码演示了 `var` 的效果：\n\n```javascript\nfunction f()\
  \ {\n  // 部分早期激活：\n  assert.equal(x, undefined);\n  if (true) {\n    var x = 123;\n\
  \    // 赋值在原地执行：\n    assert.equal(x, 123);\n  }\n  // 作用域是函数：\n  assert.equal(x,\
  \ 123);\n}\n```\n\n### 12.9 闭包\n\n在探索闭包之前，我们需要学习学习绑定变量和自由变量。\n\n### 12.9.1 绑定变量\
  \ vs. 自由变量\n\n根据作用域，有一组被提到的变量。在这些变量中，我们区分：\n\n* **绑定变量**（Bound variables）在作用域内部声明。它们是参数和局部变量。\n\
  * **自由变量**（Free variables）在作用域外部声明。它们也被称为非局部变量。\n\n考虑以下代码：\n\n```javascript\nfunction\
  \ func(x) {\n  const y = 123;\n  console.log(z);\n}\n```\n\n在 `func()` 的体中，`x` 和\
  \ `y` 是绑定变量。`z` 是自由变量。\n\n### 12.9.2 什么是闭包？\n\n那么什么是闭包呢？闭包是一个函数加上一个在其“出生地”存在的变量的连接。\n\
  \n保持这种连接的意义是什么？它为函数的自由变量提供了值——例如：\n\n```javascript\nfunction funcFactory(value)\
  \ {\n  return () => {\n    return value;\n  };\n}\nconst func = funcFactory('abc');\n\
  assert.equal(func(), 'abc'); // (A)\n```\n\n`funcFactory` 返回一个赋值给 `func` 的闭包。由于\
  \ `func` 有与其出生地变量的连接，当它在行 A 被调用时，仍然可以访问自由变量 `value`（尽管它已经“逃逸”了它的作用域）。\n\n**JavaScript\
  \ 中的所有函数都是闭包**\n\nJavaScript 通过闭包支持静态作用域。因此，每个函数都是闭包。\n\n### 12.9.3 示例：自增器工厂\n\n\
  下面的函数返回自增器（一个我自起的名字）。自增器是一个内部存储一个数字的函数。当它被调用时，它通过将参数加到该数字上更新该数字并返回新值。\n\n```javascript\n\
  function createInc(startValue) {\n  return (step) => { // (A)\n    startValue +=\
  \ step;\n    return startValue;\n  };\n}\nconst inc = createInc(5);\nassert.equal(inc(2),\
  \ 7);\n```\n\n我们可以看到行 A 创建的函数通过自由变量 `startValue` 保留其内部数字。这次我们不仅从出生作用域读取，还利用它来存储我们修改并在函数调用间持续的数据。\n\
  \n我们可以通过局部变量在出生作用域中创建更多的存储槽：\n\n```javascript\nfunction createInc(startValue) {\n\
  \  let index = -1;\n  return (step) => {\n    startValue += step;\n    index++;\n\
  \    return [index, startValue];\n  };\n}\nconst inc = createInc(5);\nassert.deepEqual(inc(2),\
  \ [0, 7]);\nassert.deepEqual(inc(2), [1, 9]);\nassert.deepEqual(inc(2), [2, 11]);\n\
  ```\n\n### 12.9.4 闭包的用例\n\n闭包有什么用？\n\n* 首先，它们仅仅是静态作用域的实现。因此，它们为回调提供了上下文数据。\n* 它们也可以用于函数来存储跨函数调用的状态。`createInc()`\
  \ 就是这样一个例子。\n* 它们还可以为对象（通过字面量或类产生）提供私有数据。其工作原理的细节在 Exploring ES6*](https://exploringjs.com/es6/ch_classes.html#_private-data-via-constructor-environments)\
  \ 中解释。\n\n**测试：高级**\n\n查看测试应用。\n\n## 12.10 延伸阅读\n\n有关底层如何处理变量（如 ECMAScript 规范所述）的更多信息，请参阅\
  \ §26.4 “Closures and environments”。\n\n\n\n\n\n在本章中，我们将探讨 JavaScript 有哪些类型的的值。\n\
  \n![](img/file0.svg) **辅助工具：`===`**\n\n在本章中，我们会偶尔使用严格相等运算符。如果 `a` 和 `b` 相等，则 `a\
  \ === b` 结果为 `true`。其具体含义请参见 [§14.4.2 “严格相等 (`===` 和 `!==`)”]。\n\n### 13.1 什么是类型？\n\
  \n在本章中，我将类型视为值的集合——例如，`boolean` 类型即是集合 { `false`, `true` }。\n\n## 13.2 JavaScript\
  \ 的类型层级结构\n\n![](img/file13.svg)\n\n图 6：JavaScript 类型的部分层级结构。缺少了错误类、与原始类型相关的类等。该图暗示了并非所有对象都是\
  \ `Object` 的实例。\n\n图 [6] 显示了 JavaScript 的类型层级结构。我们从这张图中学习到了什么？\n\n*   JavaScript\
  \ 区分了两种值：原始值和对象。我们很快就会看到它们之间的差。。\n*   该图区分了对象和 `Object` 类的实例。每个 `Object` 实例都是对象，但反之则不然。然而，你在实践中遇到的几乎所有对象都是\
  \ `Object` 的实例——例如，通过对象字面量创建的对象。关于此主题的更多详细信息请参见 [§29.4.3.4 “不是 Object 实例的对象”]。\n\
  \n## 13.3 语言规范中的类型\n\nECMAScript 规范总共知道七种类型。这些类型的名称如下（我使用的是 TypeScript 的名称，而不是规范中的名称）：\n\
  \n*   `undefined`，只有一个元素 `undefined`\n*   `null`，只有一个元素 `null`\n*   `boolean`，包含元素\
  \ `false` 和 `true` \n\n*   `number`，所有数字的类型（例如 `-123`, `3.141`）。\n*   `string`，所有字符串的类型（例如\
  \ `'abc'`）。\n*   `symbol`，所有符号的类型（例如 `Symbol('My Symbol')`）。\n*   `object`，所有对象的类型（不同于\
  \ `Object`，后者是 `Object` 类及其子类所有实例的类型）。\n\n## 13.4 原始值 vs. 对象\n\n规范对值做了重要的区分：\n\n\
  *   原始值是类型 `undefined`、`null`、`boolean`、`number`、`string`、`symbol` 的元素。\n*   所有其他值都是对象。\n\
  \n与 Java（JavaScript 此处的灵感来源）不同，原始值并不是二等公民。它们与对象之间的区别更为微妙。简而言之：\n\n*   原始值：是 JavaScript\
  \ 中数据的原子构建块。\n    *   它们是**按值传递**（passed by value）：当原始值赋值给变量或传递给函数时，它们的内容会被复制。\n\
  \    *   它们是**按值比较**（compared by value）：比较两个原始值时，比较的是它们的内容。\n*   对象：是复合数据。\n   \
  \ *   它们是**按身份传递**（passed by identity，我的术语）：当对象赋值给变量或作为参数传递给函数时，它们的*身份*（想象指针）会被复制。\n\
  \    *   它们是**按身份比较**（compared by identity，我的术语）：比较两个对象时，比较的是它们的身份。\n\n除此之外，原始值和对象非常相似：它们都拥有*属性*（键值对），并且可以用于相同的位置。\n\
  \n接下来，我们将深入深入查看原始值和对象。\n\n### 13.4.1 原始值（简写：primitives）\n\n#### 13.4.1.1 原始值是不可变的\n\
  \n你不能改变、添加或删除原始值的属性：\n\n```\n[](#cb130-1)let str = 'abc';\n[](#cb130-2)assert.equal(str.length,\
  \ 3);\n[](#cb130-3)assert.throws(\n[](#cb130-4)  () => { str.length = 1 },\n[](#cb130-5)\
  \  /^TypeError: Cannot assign to read only property 'length'/\n[](#cb130-6));\n\
  ```\n\n#### 13.4.1.2 原始值是按值传递的\n\n原始值是按值传递的：变量（包括参数）存储原始值的内容。当将原始值赋值给变量或作为参数传递给函数时，其内容会被复制。\n\
  \n```\n[](#cb131-1)let x = 123;\n[](#cb131-2)let y = x;\n[](#cb131-3)assert.equal(y,\
  \ 123);\n```\n\n#### 13.4.1.3 原始值是按值比较的\n\n原始值是按值比较的：比较两个原始值时，我们比较它们的内容。\n\n```\n\
  [](#cb132-1)assert.equal(123 === 123, true);\n[](#cb132-2)assert.equal('abc' ===\
  \ 'abc', true);\n```\n\n要了解这种比较方式的特殊之处，请继续阅读了解对象是如何比较的。\n\n### 13.4.2 对象\n\n对象在\
  \ §28 “单个对象”和后续章节中有详细介绍。在这里，我们主要关注它们如何与原始值不同。\n\n让我们先探索创建对象的两种常见方式：\n\n*   对象字面量：\n\
  \n    ```\n[const obj = {\n[](#cb133-2)  first: 'Jane',\n[](#cb133-3)  last: 'Doe',\n\
  [](#cb133-4)};\n    ```\n\n    对象字面量以花括号 `{}` 开始和结束。它创建了一个具有两个属性的对象。第一个属性的键为 `'first'`（一个字符串），值为\
  \ `'Jane'`。第二个属性的键为 `'last'`，值为 `'Doe'`。关于对象字面量的更多信息，请参阅 [§28.2.1 “对象字面量：属性”]。\n\
  \n*   数组字面量：\n\n    ```\n[](#cb134-1)const arr = ['foo', 'bar'];\n    ```\n\n  \
  \  数组字面量以方括号 `[]` 开始和结束。它创建了一个包含两个*元素*的 `Array`（数组）：`'foo'` 和 `'bar'`。关于数组字面量的更多信息，请参阅\
  \ [§31.2.1 “创建、读取、写入数组”]。\n\n#### 13.4.2.1 对象默认是可变的\n\n默认情况下，你可以自由地更改、添加和删除对象的属性：\n\
  \n```\n[](#cb135-1)const obj = {};\n[](#cb135-2)\n[](#cb135-3)obj.foo = 'abc'; //\
  \ 添加一个属性\n[](#cb135-4)assert.equal(obj.foo, 'abc');\n[](#cb135-5)\n[](#cb135-6)obj.foo\
  \ = 'def'; // 修改一个属性\n[](#cb135-7)assert.equal(obj.foo, 'def');\n```\n\n#### 13.4.2.2\
  \ 对象是按身份传递的\n\n对象是按身份传递的（passed by identity，我的术语）：变量（包括参数）存储对象的*身份*。\n\n对象的身份就像指向*堆*上对象实际数据的指针（或透明引用，想象\
  \ JavaScript 引擎的共享主内存）。\n\n当将对象赋值给变量或作为参数传递给函数时，其身份会被复制。每个对象字面量都会在堆上创建一个新的对象并返回其身份。\n\
  \n\n\n\n\n```javascript\nconst a = {}; // fresh empty object\n// Pass the identity\
  \ in `a` to `b`:\nconst b = a;\n\n// Now `a` and `b` point to the same object\n\
  // (they “share” that object):\nassert.equal(a === b, true);\n\n// Changing `a`\
  \ also changes `b`:\na.foo = 123;\nassert.equal(b.foo, 123);\n```\n\nJavaScript\
  \ 使用 `garbage collection`（垃圾回收）来自动管理内存：\n\n```javascript\nlet obj = { prop: 'value'\
  \ };\nobj = {};\n```\n\n现在 `obj` 的旧值 `{ prop: 'value' }` 是 `garbage`（不再使用）。JavaScript\
  \ 会在某个时间点自动 回收它（将其从内存中移除），如果有足够的空内存，可能永远不会回收。\n\n![](img/file5.svg) **详情：按身份传递**\n\
  \n“按身份传递”意味着对象的身份（一个透明的引用）是按值传递的。这种方法也被称为[“按共享传递”](https://en.wikipedia.org/wiki/Evaluation_strategy#Call_by_sharing)。\n\
  \n#### 13.4.2.3 对象按身份比较\n\n对象是`按身份比较的`（我的术语）：只有当两个变量包含相同的对象身份时，它们才相等。如果它们引用内容相同的不同对象，它们是不相等的。\n\
  \n```javascript\nconst obj = {}; // fresh empty object\nassert.equal(obj === obj,\
  \ true); // 相同的身份\nassert.equal({} === {}, false); // 身份不同，内容相同\n```\n\n## 13.5\
  \ 运算符 `typeof` 和 `instanceof`：值的类型是什么？\n\n`typeof` 和 `instanceof` 两个运算符允许你确定给定的值\
  \ `x` 具有什么类型：\n\n```javascript\nif (typeof x === 'string') ···\nif (x instanceof\
  \ Array) ···\n```\n\n它们之间有什么区别？\n\n*   `typeof` 区分规范中的 7 种类型（减去了一个遗漏，增加了一个项）。\n\
  *   `instanceof` 测试哪个类创建了给定的值。\n\n![](img/file2.svg) **经验法则：`typeof` 用于原始值；`instanceof`\
  \ 用于对象**\n\n### 13.5.1 `typeof`\n\n表 2：`typeof` 运算符的结果。\n\n| `x` | `typeof x` |\n\
  | --- | --- |\n| `undefined` | `'undefined'` |\n| `null` | `'object'` |\n| Boolean\
  \ | `'boolean'` |\n| Number | `'number'` |\n| String | `'string'` |\n| Symbol |\
  \ `'symbol'` |\n| Function | `'function'` |\n| 所有其他对象 | `'object'` |\n\n表 2 列出了\
  \ `typeof` 的所有结果。它们大致对应于语言规范中的 7 种类型。遗憾的是，有两处不同，它们语言的特性：\n\n*   `typeof null` 返回\
  \ `'object'` 而不是 `'null'`。这是一个 Bug。遗憾的是，它无法修复。TC39 尝试过修复，但破坏了 Web 上太多的代码。\n*   函数的\
  \ `typeof` 应该是 `'object'`（函数是对象）。为函数引入单独的类别会引起混惑。\n\n![](img/file6.svg) **练习：关于\
  \ `typeof` 的两个练习**\n\n*   `exercises/values/typeof_exrc.mjs`\n*   附加题：`exercises/values/is_object_test.mjs`\n\
  \n### 13.5.2 `instanceof`\n\n该运算符回答一个问题：值 `x` 是否由类 `C` 创建？\n\n```javascript\nx instanceof\
  \ C\n```\n\n例如：\n\n```javascript\n> (function() {}) instanceof Function\ntrue\n\
  > ({}) instanceof Object\ntrue\n> [] instanceof Array\ntrue\n```\n\n原始值不是任何东西实例：\n\
  \n```javascript\n> 123 instanceof Number\nfalse\n> '' instanceof String\nfalse\n\
  > '' instanceof Object\nfalse\n```\n\n![](img/file6.svg) **练习：`instanceof`**\n\n\
  `exercises/values/instanceof_exrc.mjs`\n\n## 13.6 类和构造函数\n\nJavaScript 原始的对象工厂是\
  \ `constructor functions`（构造函数）：即当你通过 `new` 运算符调用它们时，会返回自身“实例”的普通函数。\n\nES6 引入了\
  \ `classes`（类），它们主要是是构造函数的更好的语法。\n\n在本书中，我交替使用 `constructor function` 和 `class`\
  \ 术语。\n\n类可以被视为将规范中的单一类型 `object` 划子类型——它们为我们提供了比规范中有限 7 种更多的类型。每个类都是它创建的对象的类型。\n\
  \n### 13.6.1 与原始类型关联的构造函数\n\n每个原始类型（`undefined` 和 `null` 的规范内部类型除外）都有一个关联的 `constructor\
  \ function`（视为类）：\n\n*   构造函数 `Boolean` 与布尔值关联。\n*   构造函数 `Number` 与数字关联。\n*   构造函数\
  \ `String` 与字符串关联。\n*   构造函数 `Symbol` 与符号关联。\n\n这些函数中的每一个都充当着多个角色——例如 `Number`：\n\
  \n*   你可以将其用作函数使用，并将值转换为数字：\n    ```javascript\n    assert.equal(Number('123'),\
  \ 123);\n    ```\n*   `Number.prototype` 为数字提供了属性——例如方法 `.toString()`：\n    ```javascript\n\
  \    assert.equal((123).toString, Number.prototype.toString);\n    ```\n*   `Number`\
  \ 是一个用于数字工具函数的命名空间/容器对象——例如：\n    ```javascript\n    assert.equal(Number.isInteger(123),\
  \ true);\n    ```\n*   最后，你也可以将 `Number` 作为类使用并创建数字对象。这些对象与真实的数字不同，应该避免。\n    ```javascript\n\
  \    assert.notEqual(new Number(123), 123);\n    assert.equal(new Number(123).valueOf(),\
  \ 123);\n    ```\n\n#### 13.6.1.1 包装原始值\n\n与原始类型相关的构造函数称为 `wrapper types`（包装类型），因为它们提供了将原始值转换为的标准方法。在此过程中，原始值被“包装”在对象中。\n\
  \n```javascript\nconst prim = true;\nassert.equal(typeof prim, 'boolean');\nassert.equal(prim\
  \ instanceof Boolean, false);\n\nconst wrapped = Object(prim);\nassert.equal(typeof\
  \ wrapped, 'object');\nassert.equal(wrapped instanceof Boolean, true);\nassert.equal(wrapped.valueOf(),\
  \ prim); // 解除\n```\n\n包装在实践中很少重要，但它在语言规范内部被用于给原始值赋予属性。\n\n## 13.7 类型转换\n\n在 JavaScript\
  \ 中，值转换为其他类型有两种方式：\n\n*   显式转换：通过 `String()` 等函数。\n*   `Coercion`（强制转换/自动转换）：当操作接收到无法处理的操作数/参数时发生。\n\
  \n### 13.7.1 类型显式转换\n\n与原始类型关联的函数显式地将值转换为类型：\n\n```javascript\n> Boolean(0)\nfalse\n\
  > Number('123')\n123\n> String(123)\n'123'\n```\n\n你也可以使用 `Object()` 将值转换为对象：\n\n\
  ```javascript\n> typeof Object(123)\n'object'\n```\n\n### 13.7.2 强制转换（自动转换）\n\n\
  对于许多操作，如果类型不匹配，JavaScript 会自动转换操作数/参数。这种自动转换被称为强制转换。\n\n例如，乘法运算符会将操作数转换为数字：\n\n\
  ```javascript\n> '7' * '3'\n21\n```\n\n许多内置函数也会进行强制转换。例如，`parseInt()` 会将其参数转换为字符串（解析在第一个非数字字符处停止）：\n\
  \n```javascript\n> parseInt(123.45)\n123\n```\n\n![](img/file6.svg) **练习：将值转换为原始值**\n\
  \n`exercises/values/conversion_exrc.mjs`\n\n![](img/file7.svg) **测验**\n\n参见 测验应用。\n\
