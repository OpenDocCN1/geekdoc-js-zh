  * 感谢审阅。\n\n\n\n\n## 2.1 如何阅读此书\n\n### 2.1.1 我应该以什么顺序阅读书中的内容？\n\n这本书是三书合一：\n\n* \
  \  你可以用它尽可能快地开始 JavaScript。这种“模式”适合没有耐心的人：\n\n    *   从第 7 章“大局”开始阅读。\n\n    * \
  \  跳过所有标记为“高级（advanced）”的章节和节，以及所有快速参考内容。\n\n*   它能让你全面了解当前的 JavaScript。在这种“模式”下，你阅读所有内容，不跳过高级内容和快速参考内容。\n\
  \n*   它可以作为参考书。如果你对某个主题感兴趣，可以通过目录或索引找到相关信息。由于基础和高级内容是混合的，你需要的所有内容通常都在同一个地方。\n\n\
  测验和练习对于帮助你练习和记忆所学知识起着重要作用。\n\n### 2.1.2 为什么某些章节和小节被标记为“(advanced)”？\n\n有几个章节和小节被标记为“(advanced)”。其意图是你最初可以跳过它们。也就是说，你只需阅读基础（非高级）内容，就可以快速获得\
  \ JavaScript 的工作知识。\n\n随着你知识的演进，稍后可以回到部分或全部高级内容。\n\n### 2.1.3 为什么某些章节被标记为“(bonus)”？\n\
