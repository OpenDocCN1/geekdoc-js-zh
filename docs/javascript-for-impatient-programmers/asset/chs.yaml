  \n### 2.3 我拥有纸质版\n\n### 2.3.1 我可以获得数字版的折扣吗？\n\n如果你购买了纸质版，可以获得数字版的折扣。[纸质版的首页](https://exploringjs.com/impatient-js/es2019/)\
  \ 解释了具体方法。\n\n遗憾的是，反过来是不行的：如果你购买了数字版，无法获得纸质版的折扣。\n\n### 2.3.2 我可以提交错误或查看已提交的错误吗？\n\
  \n在[纸质版的首页](https://exploringjs.com/impatient-js/es2019/)上，你可以提交错误并查看已提交的错误。\n\n\
  ### 2.3.3 书中有包含 URL 的在线列表吗？\n\n[纸质版的首页](https://exploringjs.com/impatient-js/es2019/)\
  \ 列出了你在纸质版脚注中看到的所有 URL。\n\n## 2.4 符号和约定\n\n### 2.4.1 什么是类型签名（type signature）？为什么我在书中看到静态类型？\n\
  \n例如，你可能会看到：\n\n```\n[]Number.isFinite(num: number): boolean\n```\n\n这被称为 `Number.isFinite()`\
  \ 的 `type signature`。这种符号（尤其是 `num` 的静态类型 `number` 和结果的 `boolean`）并不是真实的 JavaScript。这种符号借自编译为\
  \ JavaScript 的语言 TypeScript（它大部分只是 JavaScript 加上静态类型）。\n\n为什么要使用这种符号？它可以帮助你快速了解函数的工作原理。该符号在[一篇\
  \ 2ality 的博客文章](https://2ality.com/2018/04/type-notation-typescript.html)中进行了详细解释，但通常相对直观。\n\
  \n### 2.4.2 带图标的注释是什么意思？\n\n![](img/file0.svg) **阅读说明**\n\n解释如何最好地阅读内容。\n\n![](img/file1.svg)\
  \ **外部内容**\n\n指向额外的外部内容。\n\n![](img/file2.svg) **提示**\n\n提供与当前内容相关的提示。\n\n![](img/file3.svg)\
  \ **问题**\n\n提出并回答与当前内容相关的问题（类似于 FAQ）。\n\n![](img/file4.svg) **警告**\n\n警告陷阱等。\n\n\
  ![](img/file5.svg) **详情**\n\n提供额外的细节，补充当前内容。它类似于脚注。\n\n![](img/file6.svg) **练习**\n\
  \n提到你可以在此处执行的测试驱动练习的路径。\n\n![](img/file7.svg) **测验**\n\n表示当前章节（部分章节）有一个测验。\n\n\n\
  \n\n*   在 ES6 之前，通过 `function` 和 `.prototype` 实现对象工厂和继承是非常笨拙的。ES6 引入了类（classes），为这些机制提供了更方便语法。\n\
  *   传统上，JavaScript 没有内置模块。ES6 在语言中添加了它们。\n\n最后，尽管 JavaScript 的标准库非常有限，但是：\n*   已经有添加更多功能的[计划](https://github.com/tc39/proposal-javascript-standard-library)。\n\
  *   许多库可以通过 [npm 软件注册表](https://www.npmjs.com) 轻松获取。\n\n### 3.2 JavaScript 的优点\n\
  \n在优点方面，JavaScript 提供了许多优势。\n\n### 3.2.1 社区\n\nJavaScript 的流行意味着它拥有良好的支持和完善的文档。每当你用\
  \ JavaScript 创建任何东西时，你都可以确信会有很多人对此（可能）感兴趣。而且如果你需要，你可以从庞大的 JavaScript 程序员池中进行招聘。\n\
  \n没有单一实体控制 JavaScript —— 它由由许多组织组成的委员会 TC39 演进。该语言通过一个鼓励公众反馈的开放过程进行演进。\n\n### 3.2.2\
  \ 实用性\n\n通过 JavaScript，你可以为许多客户端编写应用程序。以下是几个示例技术：\n*   [渐进式 Web 应用](https://developers.google.com/web/progressive-web-apps/)\
  \ 可以原生安装在 Android 和许多桌面操作系统上。\n*   [Electron](https://electronjs.org) 让你构建跨平台桌面应用。\n\
  *   [React Native](https://facebook.github.io/react-native/) 允许你编写具有原生用户界面的 iOS\
  \ 和 Android 应用。\n*   [Node.js](https://nodejs.org/) 为编写 shell 脚本提供了广泛的支持（除了作为 Web\
  \ 服务器平台）。\n\nJavaScript 许多服务器平台和服务的支持——例如：\n*   Node.js（以下许多服务基于 Node.js 或支持其 API）\n\
  *   ZEIT Now\n*   Microsoft Azure Functions\n*   AWS Lambda\n*   Google Cloud Functions\n\
  \nJavaScript 有许多数据技术可供使用：许多数据库都支持它，并且存在中间层（如 `GraphQL`）。此外，标准数据格式 `JSON`（JavaScript\
  \ 对象表示法）](#ch046.xhtml_ch_json) 基于 JavaScript 并由其标准库支持。\n\n最后，JavaScript 的很多、甚至是大部分工具是用\
  \ JavaScript 编写的。这包括 IDE、构建工具等。因此，你以安装库相同的方式安装它们，并可以使用 JavaScript 对它们进行自定义。\n\n\
  ### 3.2.3 语言\n\n*   可以通过 JavaScript 宇宙中的事实标准 —— [npm 软件注册表](https://www.npmjs.com)\
  \ 获得许多库。\n*   如果你对“纯原生”JavaScript 不满意，添加更多功能相对容易：\n    *   你可以通过 [Babel](https://babeljs.io)\
  \ 将未来和现代语言特性编译到当前和过去的 JavaScript 版本。\n    *   你可以通过 [TypeScript](https://www.typescriptlang.org)\
  \ 和 [Flow](https://flow.org) 添加静态类型。\n    *   你可以使用 ReasonML，它本质上是带有 JavaScript\
  \ 语法的 OCaml。它可以被编译为 JavaScript 或原生代码。\n*   该语言是灵活的：它是动态的，并同时支持面向对象编程和函数式编程。\n* \
  \  对于这样一种动态语言来说，JavaScript 的速度快得惊人。\n    *   每当速度不够快时，你可以切换到 WebAssembly，它是内置在大多数\
  \ JavaScript 引擎中的通用虚拟机。它可以以接近原生的速度运行静态代码。\n\n### 3.3 JavaScript 的优缺点：创新\n\nJavaScript\
  \ 生态系统中充满了大量创新：实现用户界面的新方法、优化软件交付的新方式等。优点是你会不断学到新东西；缺点是，不断的变化有时会让人精疲力竭。幸运的是，最近情况有所放缓：所有的\
  \ ES6 内容（对语言的一次重大现代化）正趋于稳定，某些工具和工作流也是如此。\n\n![](img/file7.svg) **测验**\n\n查看 测验应用。\n\
  \n# 4 JavaScript 的本质（附录）\n\n* * *\n*   4.1 JavaScript 的影响\n*   4.2 JavaScript 的本质\n\
  \    *   4.2.1 JavaScript 经常静默失败\n*   4.3 JavaScript 入门提示\n* * *\n\n### 4.1 JavaScript\
  \ 的影响\n\n当 JavaScript 在 1995 年创建时，它受到了几种编程语言的影响：\n*   JavaScript 的语法很大程度上基于 Java。\n\
  *   Self 启发了 JavaScript 的原型继承。\n*   闭包和环境借用自 Scheme。\n*   AWK 影响了 JavaScript 的函数（包括\
  \ `function` 关键字）。\n*   JavaScript 的字符串、数组和正则表达式从 Perl 中汲灵感。\n*   HyperTalk 启发了浏览器中通过\
  \ `onclick` 实现事件处理。\n\n随着 ECMAScript 6，新的影响引入了 JavaScript：\n*   生成器（Generators）借用自\
  \ Python。\n*   箭头函数的语法来自 CoffeeScript。\n*   C++ 贡献了 `const` 关键字。\n*   解构（Destructuring）受到\
  \ Lisp 的解构绑定（destructuring bind）的启发。\n*   模板字字量（Template literals）来自 E 语言（在其中被称为\
  \ `quasi literals`）。\n\n### 4.2 JavaScript 的本质\n\n这些是该语言的几个特征：\n*   它的语法属于 C 语言族（大括号等）。\n\
  *   它是一门动态语言：大多数对象可以在运行时以各种方式被更改，可以直接创建对象等。\n*   它是一门动态类型语言：变量没有固定的静态类型，你可以为任何变量赋值任何值。\n\
  *   它具有函数式编程特性：一等函数、闭包、通过 `bind()` 实现的部分应用。\n*   它具有面向对象特性：可变状态、对象、继承、类等。\n*   它经常静默失败：详见下一节。\n\
  *   它以源代码的形式部署。但这些源代码通常会经过*压缩*（以减少存储）。并且已经有了[二进制源码的计划](https://github.com/tc39/proposal-binary-ast)。\n\
  *   JavaScript 是网络平台的一部分——它是内置在浏览器中的语言。但它也被用于其他领域例如 Node.js 中的服务器和 shell 脚本。\n*\
  \   JavaScript 引擎在底层优化低效的语言机制。例如，原则上 JavaScript 数组是字典，但如果具有连续索引，引擎在底层会连续存储数组。\n\n\
  ### 4.2.1 JavaScript 经常静默失败\n\nJavaScript 经常静默失败。让我们看两个示例。\n\n第一个示例：如果操作符的操作数类型不合适，将进行必要的转换。\n\
  \n```\n> '3' * '5'\n15\n```\n\n第二个示例：如果算术计算失败，你会得到一个错误值而不是异常。\n\n```\n> 1 / 0\n\
  Infinity\n```\n\n静默失败的原因是历史性的：JavaScript 直到 ECMAScript 3 才有了异常。从以后，设计者一直试图避免静默失败。\n\
  \n\n\n\n\n* 你可以通过 [TypeScript](https://www.typescriptlang.org) 或 [Flow](https://flow.org)\
  \ 对 JavaScript 进行静态类型化。\n* 你可以通过 [ESLint](https://eslint.org) 等 linter 工具检查问题和反模式。\n\
  * 你可以通过 [Prettier](https://prettier.io) 等代码格式化工具自动格式化你的代码。\n* 与社区联系：\n* Twitter\
  \ 在 JavaScript 程序员中非常流行。作为一种介于口语和书面语之间的交流方式，它非常适合交换知识。\n* 许多城市定期举办免费聚会，人们聚集在一起学习与\
  \ JavaScript 相关的主题。\n* JavaScript 会议是另一种与其他 JavaScript 程序员见面的方便方式。\n* 阅读书籍和博客。网上有很多免费的资料！\n\
  \n# 5 JavaScript 的历史与演变\n\n## 5.1 JavaScript 是如何产生的\n\nJavaScript 由 Brendan Eich\
  \ 在 1995 年 5 月在 10 天内创建的。Eich 当时在 Netscape 工作，为他们的网页浏览器 `Netscape Navigator` 实现了\
  \ JavaScript。\n\n当时的想法是客户端网页主要的交互部分将用 Java 实现。JavaScript 的本意是作为这些部分的胶水语言，并让 HTML\
  \ 稍微具有交互性。考虑到它辅助 Java 的角色，JavaScript 必须看起来像 Java。这排除了如 Perl、Python、TCL 等现有的解决方案。\n\
  \n最初，JavaScript 的名称更改过几次：\n* 它的代号是 `Mocha`。\n* 在 Netscape Navigator 2.0 beta 版中（1995\
  \ 年 9 月），它被称为 `LiveScript`。\n* 在 Netscape Navigator 2.0 beta 3 中（1995 年 12 月），它获得了最终名称\
  \ `JavaScript`。\n\n## 5.2 标准 JavaScript\n\nJavaScript 有两个标准：\n* ECMA-262 由国际电子工业组织（Ecma\
  \ International）托管。它是主标准。\n* ISO/IEC 16262 由国际标准化组织（ISO）和国际电工委员会（IEC）托管。这是一个次要标准。\n\
  \n这些标准描述的语言被称为 `ECMAScript`，而不是 `JavaScript`。之所以选择不同的名称是因为 Sun 公司（现为 Oracle）拥有后一个名称的商标。“ECMAScript”中的“ECMA”源于托管主标准的组织。\n\
  \n该组织的原始名称是 `ECMA`，是 `European Computer Manufacturers Association`（欧洲计算机制造商协会）的缩写。后来它改为\
  \ `Ecma International`（“Ecma”是一个专有名词，而不是缩写），因为组织的活动已扩展到欧洲以外。最初的大写缩写解释了 ECMAScript\
  \ 的拼写。\n\n原则上，JavaScript 和 ECMAScript 指的是同一个意思。\n* `JavaScript` 术语指该语言及其实现。\n* `ECMAScript`\
  \ 术语指语言标准和语言版本。\n\n因此，`ECMAScript 6` 是语言的一个版本（第 6 版）。\n\n### 5.3 ECMAScript 版本时间线\n\
  \n这是 ECMAScript 版本的简要时间线：\n* ECMAScript 1 (1997 年 6 月)：标准的第一个版本。\n* ECMAScript 2\
  \ (1998 年 6 月)：为了保持 ECMA-262 与 ISO 标准同步而的小型更新。\n* ECMAScript 3 (1999 年 12 月)：增加了许多核心功能\
  \ – `[...] 正则表达式、更好的字符串处理、新的控制语句 [do-while, switch], try/catch 异常处理，[...]`\n* ECMAScript\
  \ 4 (2008 年 7 月废弃)：本应是一次巨大的升级（带有静态类型、模块、命名空间等），但结果过于野心勃勃并导致了语言维护者之间的分歧。\n* ECMAScript\
  \ 5 (2009 年 12 月)：带来了微小的改进 – `strict mode`。\n* ECMAScript 5.1 (2011 年 6 月)：另一次为了与\
  \ Ecma 同步一致的更新。\n* ECMAScript 6 (2015 年 6 月)：第一个以年份命名的版本。\n* ECMAScript 2016 (2016\
  \ 年 6 月)：首次年度发布。\n* ECMAScript 2017 (2017 年 6 月)：第二次年度发布。\n* 后的 ECMAScript 版本（ES2018\
  \ 等）总在 6 月批准。\n\n## 5.4 Ecma 技术第 39 委员会 (TC39)\n\nTC39 是演进 JavaScript 的委员会。严格来说，其成员是公司：Adobe、Apple、Facebook、Google、Microsoft、Opera\
  \ 等。每两个月，TC39 会举行会议，由成员任命的代表和受邀专家参加。这些会议的纪要会在 [GitHub 仓库](https://github.com/tc39/tc39-notes/)\
  \ 中公开。\n\n### 5.5 TC39 流程\n\n随着 ECMAScript 6，当时发布流程中的两个问题变得显而易见：\n* 如果发布之间间隔过长，那么早早准备好的功能必须等待很长时间才能发布。而晚准备准备的功能则面临为了赶截止日期而仓促发布的风险。\n\
  * 功能通常在实现之前很久就已经设计好了。因此，与实现和使用相关的设计缺陷太晚才被发现。\n\n针对这些问题，TC39 制定了新的 `TC39 流程`：\n*\
  \ ECMAScript 特性独立设计并经过阶段，从阶段 0 (`strawman`) 开始，到阶段 4 (`finished`) 结束。\n* 特别是后期阶段需要原型实现和真实世界的测试，导致设计与实现之间的反馈循环。\n\
  * ECMAScript 版本每年发布一次，包含所有在发布截止日期之前达到阶段 4 的功能。\n\n结果：更小、增量式的发布，其功能已经过过测试。图 1 阐释了\
  \ TC39 流程。\n\n![](img/file8.svg)\n\n图 1：每个 ECMAScript 特性提案都会经过从 0 到 4 编号的阶段。`Champions`\
  \ 是支持特性作者的 TC39 成员。Test 262 是一套测试，用于检查 JavaScript 引擎是否符合语言规范。\n\nES2016 是第一个根据 TC39\
  \ 流程设计的 ECMAScript 版本。\n\n### 5.5.1 提示：以单个功能和阶段来思考，而不是 ECMAScript 版本\n\n直到以及包括 ES6，最常见的做法是根据\
  \ ECMAScript 版本来考虑 JavaScript —— 例如，“这个浏览器支持 ES6 了吗？”从 ES2016 开始，最好以单个功能来思考：一旦某个功能达到阶段\
  \ 4，你就可以安全地使用它（如果你的目标 JavaScript 引擎支持它）。你不需要等到下一次 ECMAScript 发布。\n\n## 5.6 FAQ：TC39\
  \ 流程\n\n### 5.6.1 [我最喜欢的提议功能]进展得如何？\n\n\n\n\n\n如果你想知道各种提议的功能处于什么阶段，请参阅 [GitHub 仓库\
  \ `proposals`](https://github.com/tc39/proposals)。\n\n### 5.6.2 有官方的 ECMAScript\
  \ 特性列表吗？\n\n有的，TC39 仓库列出了[已完成的提案](https://github.com/tc39/proposals/blob/master/finished-proposals.md)，并提到了它们是在哪些\
  \ ECMAScript 版本中引入的。\n\n## 5.7 演进中的 JavaScript：不要破坏网页\n\n偶尔会出现的一个想法是通过移除旧特性和怪癖（quirks）来清理\
  \ JavaScript。虽然这个想法的吸引力显而易见，但它也有重大的副作用。\n\n让我们假设我们创建了一个不向后兼容的 JavaScript 版本，并修复了它所有的缺陷。结果，我们将遇到以下问题：\n\
  \n*   JavaScript 引擎变得变得臃肿：它们需要同时支持旧版本和新版本。IDE 和构建工具等工具也是如此。\n*   程序员需要并且不断意识到不同版本之间的差异。\n\
  *   你必须将现有的代码库迁移到新版本（这可能是一项巨大的工作），或者你可以混合版本，这样重构就会变得困难，因为你无法在不改变代码的情况下在版本之间移动代码。\n\
  *   你必须以某种方式为每段代码（无论是文件还是嵌入网页的代码）指定它是用哪个版本编写的。每一个可以想象到的解决方案都有优缺点。例如，`严格模式` **测试**\n\
  \n查看测试应用。\n\n# 6 FAQ：JavaScript\n\n* * *\n\n*   6.1 JavaScript 的良好参考有哪些？\n*   6.2\
