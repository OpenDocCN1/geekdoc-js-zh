  \n书中，JavaScript 的面向对象编程（OOP）风格分四步引入。本章涵盖第 1 ；下一章涵盖第 2–4 步。步骤如下（见图 [17]）：\n\n1. **单个对象（本章）：**\
  \ JavaScript 的基本 OOP 构建块 `objects` 如何独立工作？\n2. **原型链（下一章）：** 每个对象都有一个由零或多个 `prototype\
  \ objects` 组成的链。原型是 JavaScript 的核心继承机制。\n3. **类（下一章）：** JavaScript 的 `classes` 是对象的工厂。`class`\
  \ 与其实例之间的关系基于原型继承。\n4. **子类化（下一章）：** `subclass` 与其 `superclass` 之间的关系也基于原型继承。\n\n\
  ![](img/file26.svg)\n\n图 17：本书分四步介绍 JavaScript 的面向对象编程。\n\n### 28.1 什么是对象？\n\n在\
  \ JavaScript 中：\n\n* 对象是一组 `properties`（键值条目）。\n* 属性键只能是字符串或符号（symbol）。\n\n### 28.1.1\
  \ 对象的角色：记录 vs. 字典\n\n对象在 JavaScript 中扮演着两种角色：\n\n* **记录（Records）**：作为记录的对象具有固定数量的属性，其键在开发时就已经已知。它们的值可以是不同的类型。\n\
  * **字典（Dictionaries）**：作为字典的对象具有可变的属性，其键在开发时未知。它们的所有值具有相同的类型。\n\n这些角色影响了本章解释对象的方式：\n\
  \n* 首先，我们将探索作为记录的对象。尽管属性键在底层是字符串或符号，但在本章的这部分，它们对我们来说将是固定的标识符。\n* 随后，我们将探索作为字典的对象。注意，`Maps`\
  \ 通常比对象是更好的字典。然而，我们将遇到的一些操作，对于作为记录的对象也很有用。\n\n### 28.2 对象作为记录\n\n让我们首先探索对象的 `record`\
  \ 角色。\n\n### 28.2.1 对象字面量：属性\n\n`Object literals`（对象字面量）是创建作为记录的对象的一种方式。它们是 JavaScript\
  \ 的一个显著特性：你可以直接创建对象——不需要类！这是一个示例：\n\n```javascript\nconst jane = {\n  first: 'Jane',\n\
  \  last: 'Doe', // 可选的末尾逗号\n};\n```\n\n在示例中，我们通过对象字面量创建了一个对象，它以大括号 `{}` 开始和结束。在它内部，我们定义了两个\
  \ `properties`（键值条目）：\n\n* 第一个属性的键为 `first`，值为 `'Jane'`。\n* 第二个属性的键为 `last`，值为 `'Doe'`。\n\
  \n我们稍后会看到指定属性键的其他方法，但使用这种指定方式时，它们必须遵循 JavaScript 变量命名规则。例如，你可以使用 `first_name` 作为属性键，但不能使用\
  \ `first-name`）。然而，允许使用保留字：\n\n```javascript\nconst obj = {\n  if: true,\n  const:\
  \ true,\n};\n```\n\n为了检查各种操作对对象的影响，我们会在本章的这部分偶尔使用 `Object.keys()`。它列出属性键：\n\n```javascript\n\
  > Object.keys({a:1, b:2})\n[ 'a', 'b' ]\n```\n\n### 28.2.2 对象字面量：属性值简写\n\n每当属性的值通过变量名定义，且该名称与键相同时，你可以省略键。\n\
  \n```javascript\nfunction createPoint(x, y) {\n  return {x, y};\n}\nassert.deepEqual(\n\
  \  createPoint(9, 2),\n  { x: 9, y: 2 }\n);\n```\n\n### 28.2.3 获取属性\n\n这是你 `get`（读取）属性的方式（A\
  \ 行）：\n\n```javascript\nconst jane = {\n  first: 'Jane',\n  last: 'Doe',\n};\n\n\
  // 获取属性 .first\nassert.equal(jane.first, 'Jane'); // (A)\n```\n\n获取未知的属性会产生 `undefined`：\n\
  \n```javascript\nassert.equal(jane.unknownProperty, undefined);\n```\n\n### 28.2.4\
  \ 设置属性\n\n这是你 `set`（写入）属性的方式：\n\n```javascript\nconst obj = {\n  prop: 1,\n};\n\
  assert.equal(obj.prop, 1);\n```\n\n我们刚刚修改了一个现有属性。如果我们设置一个未知的属性，就会创建一个新条目：\n\n```javascript\n\
  const obj = {}; // 空对象\nobj.unknownProperty = 'abc';\n```\n\n### 28.2.5 对象字面量：方法\n\
  \n以下代码展示了如何通过对象字面量创建方法 `.says()`：\n\n```javascript\nconst jane = {\n  first: 'Jane',\
  \ // 数据属性\n  says(text) {   // 方法\n    return `${this.first} says ${text}`; // (A)\n\
  \  }, // 逗号作为分隔符（末尾可选）\n};\nassert.equal(jane.says('hello'), 'Jane says “hello”');\n\
  ```\n\n在方法调用 `jane.says('hello')` 期间，`jane` 被称为方法的接收者并赋值给特殊变量 `this`。这使得方法 `.says()`\
  \ 能够访问属性 `.first`。\n\n### 28.2.6 对象字面量：访问器\n\nJavaScript 中有两种访问器：\n\n* `getter`\
  \ 是一种在获取属性时调用的方法类实体。\n* `setter` 是一种在设置属性时调用的方法类实体。\n\n#### 28.2.6.1 Getters\n\n\
  通过在方法定义前加上修饰 `get` 来创建 getter：\n\n```javascript\nconst jane = {\n  first: 'Jane',\n\
  \  last: 'Doe',\n  get full() {\n    return `${this.first} ${this.last}`;\n  },\n\
  };\n\nassert.equal(jane.full, 'Jane Doe');\njane.first = 'John';\nassert.equal(jane.full,\
  \ 'John Doe');\n```\n\n#### 28.2.6.2 Setters\n\n通过在方法定义前加上修符 `set` 来创建 setter：\n\
  \n\n\n\n\n```javascript\n[](#cb585-1)const jane = {\n[](#cb585-2)  first: 'Jane',\n\
  [](#cb585-3)  last: 'Doe',\n[](#cb585-4)  set full(fullName) {\n[](#cb585-5)   \
  \ const parts = fullName.split(' ');\n[](#cb585-6)    this.first = parts[0];\n[](#cb585-7)\
  \    this.last = parts[1];\n[](#cb585-8)  },\n[](#cb585-9)};\n\n[](#cb585-10)jane.full\
  \ = 'Richard Roe';\n[](#cb585-11)assert.equal(jane.first, 'Richard');\n[](#cb585-12)assert.equal(jane.last,\
  \ 'Roe');\n```\n\n![](img/file6.svg) **练习：通过对象字面量创建对象**\n\n`exercises/single-objects/color_point_object_test.mjs`\n\
  \n## 28.3 在对象字面量中展开 (`...`)\n\n在函数调用 内部，展开（`...`）将可迭代对象的迭代值转换为参数。\n\n在对象字面量内部，*展开属性*（spread\
  \ property）会将另一个对象的属性添加到当前对象：\n\n```javascript\n> const obj = {foo: 1, bar: 2};\n\
  > {...obj, baz: 3}\n{ foo: 1, bar: 2, baz: 3 }\n```\n\n如果属性键冲突，最后提到的属性将“胜出”：\n\n\
  ```javascript\n> const obj = {foo: 1, bar: 2, baz: 3};\n> {...obj, foo: true}\n\
  { foo: true, bar: 2, baz: 3 }\n> {foo: true, ...obj}\n{ foo: 1, bar: 2, baz: 3 }\n\
  ```\n\n所有值都是展开的，甚至是 `undefined` 和 `null`：\n\n```javascript\n> {...undefined}\n{}\n\
  > {...null}\n{}\n> {...123}\n{}\n> {...'abc'}\n{ '0': 'a', '1': 'b', '2': 'c' }\n\
  > {...['a', 'b']}\n{ '0': 'a', '1': 'b' }\n```\n\n字符串和 `Arrays` 的属性 `.length` 会被这种操作忽略掉（它不是*可枚举的*；更多信息请参见\
  \ §28.7.3 “属性属性和属性描述符”）。\n\n### 28.3.1 展开用：复制对象\n\n你可以使用展开来创建对象 `original` 的拷贝：\n\
  \n```javascript\n[](#cb589-1)const copy = {...original};\n```\n\n注意——拷贝是*浅拷贝*的：`copy`\
  \ 是一个新对象，包含了 `original` 所有属性（键值对）的副本。但如果属性值是对象，那么这些对象不会被复制，而是在 `original` 和 `copy`\
  \ 之间共享。让我们来看一个例子：\n\n```javascript\n[](#cb590-1)const original = { a: 1, b: {foo:\
  \ true}};\n[](#cb590-2)const copy = {...original};\n```\n\n`copy` 的第一层确实是拷贝：如果你更改该层级的任何属性，不会影响原始对象：\n\
  \n```javascript\n[](#cb591-1)copy.a = 2;\n[](#cb591-2)assert.equal(original, { a:\
  \ 1, b: {foo: true} }); // 没有变化\n```\n\n然而，更深层次并没有被复制。例如，`.b` 的值在 `original` 和 `copy`\
  \ 之间共享。改变拷贝中的 `.b` 也会改变原始对象中的 `.b`。\n\n```javascript\n[](#cb592-1)copy.b.foo = false;\n\
  [](#cb592-2)assert.equal(original, { a: 1, b: {foo: false} });\n```\n\n![](img/file4.svg)\
  \ **JavaScript 没有内置深拷贝**\n\n对象的*深拷贝*（所有层次都被复制）在通用实现上是极其困难的。因此，JavaScript 目前没有为此提供的内置操作。如果你需要这种操作，必须自己实现它。\n\
  \n### 28.3.2 展开用：缺失属性的默认值\n\n如果你的代码的输入之一是一个对象，你可以通过指定默认值来使属性变为可选，当属性缺失时使用这些默认值。实现这一点的一种技术是使用一个属性包含默认值的对象。在下面的示例中，该对象是\
  \ `DEFAULTS`：\n\n```javascript\n[](#cb593-1)const DEFAULTS = {foo: 'a', bar: 'b'};\n\
  [](#cb593-2)const providedData = {foo: 1};\n[](#cb593-3)const allData = {...DEFAULTS,\
  \ ...providedData};\n[](#cb593-4)assert.equal(allData, {foo: 1, bar: 'b'});\n```\n\
  \n结果对象 `allData`是通过拷贝 `DEFAULTS` 并用 `providedData` 的属性覆盖其属性创建的。但你不需要一个对象来指定默认值；也可以在对象字面量内部单独指定它们：\n\
  \n```javascript\n[](#cb594-1)const providedData = {foo: 1};\n[](#cb594-2)const allData\
  \ = {foo: 'b', ...providedData};\n[](#cb594-3)assert.equal(allData, {foo: 1, bar:\
  \ 'b'});\n```\n\n### 28.3.3 展开用：非破坏性修改属性\n\n到目前为止，我们遇到了一种更改对象属性 `.foo` 的方法：我们*设置*它（行\
  \ A）并修改了对象。也就是说，这种更改属性的方法是*破坏性*的。\n\n```javascript\n[](#cb595-1)const obj = {foo:\
  \ 'a', bar: 'b'};\n[](#cb595-2)obj.foo = 1; // (A)\n[](#cb595-3)assert.equal(obj,\
  \ {foo: 1, bar: 'b'});\n```\n\n通过展开，我们可以*非破坏性*地改变 `.foo`——我们制作一个拷贝：\n\n```javascript\n\
  [](#cb596-1)const newObj = {...obj, foo: 1}; // 假设的行 (B)\n```\n\n![](img/file4.svg)\
  \ **JavaScript 没有内置深拷贝**\n\n（注：由于原文文本此处似乎有截断或逻辑重复，我将根据提供的后续文本继续翻译）\n\n*纠正：重新审视提供的文本流，我将按照提供的文本顺序进行完整翻译：*\n\
