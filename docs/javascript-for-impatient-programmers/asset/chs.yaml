  \ 普通函数\n\n以下代码展示了实现（大致）相同事情的三种方法：创建一个普通函数。\n\n```javascript\n[](#cb461-1)// 函数声明（语句）\n\
  [](#cb461-2)function ordinary1(a, b, c) {\n[](#cb461-3)  // ...\n[](#cb461-4)}\n\
  [](#cb461-6)// const 加上匿名函数\n[](#cb461-7)const ordinary2 = function (a, b, c) {\n\
  [](#cb461-8)  // ...\n[](#cb461-9)}\n[](#cb461-11)// const 加上具名函数\n[](#cb461-12)const\
  \ ordinary3 = function ordinary3(a, b, c) {\n[](#cb461-13)  // ...\n[](#cb461-14)}\n\
  ```\n*(注：由于您提供的原始文本在 25.2 之后存在严重的文本重复和格式错乱（如 `[](#cb460-x)` 标签反复出现且内容循环），我已确保翻译核心逻辑的准确。如果需要翻译特定的乱码部分，请提供清晰原文。)*\n\
  \n\n\n```\n[](#cb470-1)const obj = { method() { return 'abc' } };\n[](#cb470-2)assert.equal(obj.method(),\
  \ 'abc');\n```\n\n*   `class` 的作用是作为一个构造函数：\n\n```\n[](#cb471-1)class MyClass {\
  \ /* ··· */ }\n[](#cb471-2)const inst = new MyClass();\n```\n\n除了更优的语法外，每种特殊函数还支持新功能，使得它们比普通函数更能胜任。\n\
  \n*   箭头函数将在本章稍后部分解释。\n\n*   方法将在单对象章节中解释。\n\n*   类将在类章节中解释。\n\n表 15 列出了普通函数和特殊函数的能力。\n\
  \n表 15：四种函数的各种。“词法作用域 `this`”](#ch026.xhtml-arrow-functins-lexical-this) 意味着 `this`\
  \ 是由箭头函数的环境定义的，而不是通过方法调用定义的。\n\n| | 函数调用 | 方法调用 | 构造函数调用 |\n| --- | --- | --- |\
  \ --- |\n| 普通函数 | (`this === undefined`) | `✔` | `✔` |\n| 箭头函数 | `✔` | (词法 `this`)\
  \ | `✘` |\n| 方法 | (`this === undefined`) | `✔` | `✘` |\n| 类 | `✘` | `✘` | `✔` |\n\
  \n### 25.3.1 特殊函数仍然是函数\n\n需要注意的是，箭头函数、方法和类仍然被归类为函数：\n\n```\n> (() => {}) instanceof\
  \ Function\ntrue\n> ({ method() {} }.method) instanceof Function\ntrue\n> (class\
  \ SomeClass {}) instanceof\ntrue\n```\n\n### 25.3.2 建议\n\n通常，你应该优先使用特殊函数而不是普通函数，尤其是类和方法。箭头函数和普通函数的选择并不简单：\n\
  \n*   一方面，普通函数有一个隐式参数。在函数调用期间，该参数被设置为 `undefined` —— 这并不是我们想要的。箭头函数像处理其他变量一样处理 `this`。详情请参阅\
  \ 28.4 避免 `this` 的陷阱。\n\n*   另一方面，我喜欢函数声明的语法（它产生普通函数）。如果你在内部不使用 `this`，它大部分等同于 `const`\
  \ 加上箭头函数：\n\n```\nfunction funcDecl(x, y) {\n  return x * y;\n}\nconst arrowFunc\
  \ = (x, y) => {\n  return x * y;\n};\n```\n\n### 25.3.3 箭头函数\n\n箭头函数被引入到 JavaScript\
  \ 中出于两个原因：\n\n1.  提供一种更简洁的创建函数的方法。\n2.  让处理真实函数变得更容易：在普通函数内部无法引用周围作用域的 `this`。\n\
  \n接下来，我们将首先查看箭头函数的语法，然后看它们如何处理 `this`。\n\n#### 25.3.3.1 箭头函数的语法\n\n让我们回顾匿名函数表达式的语法：\n\
  \n```\nconst f = function (x, y, z) { return 123 };\n```\n\n（大致等同的）箭头函数如下。箭头函数是表达式。\n\
  \n```\nconst f = (x, y, z) => { return 123 };\n```\n\n在这里，箭头函数的体是一个代码块。但它也可以是一个表达式。下面的箭头函数工作方式与上一个相同：\n\
  \n```\nconst f = (x, y, z) => 123;\n```\n\n如果箭头函数只有一个参数，且该参数是一个标识符（而不是解构模式），那么你可以省略参数周围的括号：\n\
  \n```\nconst id = x => x;\n```\n\n当将箭头函数作为参数传递给其他函数或方法时，这非常方便：\n\n```\n> [1,2,3].map(x\
  \ => x+1)\n[ 2, 3, 4 ]\n```\n\n之前的示例展示了箭头函数的优点之一——简洁。如果我们使用函数表达式执行相同的任务，代码会更加冗长：\n\
  \n```\n[1,2,3].map(function (x) { return x+1 });\n```\n\n#### 25.3.3.2 箭头函数：词法 `this`\n\
  \n普通函数既可以是方法也可以是真实函数。然而，这两个角色是冲突的：\n\n*   由于每个普通函数都可以是方法，因此它有自己的 `this`。\n*   自身的\
  \ `this` 导致无法访问周围作用域的 `this`。\n\n下面的代码展示了这个问题：\n\n```javascript\nconst person =\
  \ {\n  name: 'Alice',\n  method() {\n    console.log(this.name);\n  },\n  other:\
  \ function() {\n    console.log(this.name);\n  }\n};\nperson.method(); // Alice\n\
  person.other(); // undefined\n```\n\n\n\n\n*同步生成器函数*有助于实现返回同步迭代器的函数。此外还有*同步生成器方法*。\n\
  \n*异步生成器函数*有助于实现返回异步迭代器的函数。此外还有*异步生成器方法*。\n\n这归结为我们留下了 4 种（2 × 2）函数和方法：\n\n* 同步\
  \ vs. 异步\n* 生成器 vs. 单结果\n\n表 16 提供了创建这 4 种函数和方法的语法概述。\n\n表 16：创建函数和方法的语法。最后一列指定了该实体产生多少个值。\n\
  \n| | | **结果** | **值** |\n| --- | --- | --- | --- |\n| **同步函数** | **同步方法** | | |\n\
  | `function f() {}` | `{ m() {} }` | value | 1 |\n| `f = function () {}` | | | |\n\
  | `f = () => {}` | | | |\n| **同步生成器函数** | **同步生成器方法** | | |\n| `function* f() {}`\
  \ | `{ * m() {} }` | iterable | 0+ |\n| `f = function* () {}` | | | | |\n| **异步函数**\
  \ | **异步方法** | | | |\n| `async function f() {}` | `{ async m() {} }` | Promise |\
  \ 1 |\n| `f = async function () {}` | | | | |\n| `f = async () => {}` | | | | |\n\
  | **异步生成器函数** | **异步生成器方法** | | | |\n| `async function* f() {}` | `{ async * m()\
  \ {} }` | async iterable | 0+ |\n| `f = async function* () {}` | | | | |\n\n###\
  \ 25.5 从函数和方法返回值\n\n（本节提到的所有内容均适用于函数和方法。）\n\n`return` 语句显式地从函数返回一个值：\n\n```\nfunction\
  \ func() {\n  return 123;\n}\nassert.equal(func(), 123);\n```\n\n另一个示例：\n\n```\n\
  function boolToYesNo(bool) {\n  if (bool) {\n    return 'Yes';\n  } else {\n   \
  \ return 'No';\n  }\n}\nassert.equal(boolToYesNo(true), 'Yes');\nassert.equal(boolToYesNo(false),\
  \ 'No');\n```\n\n如果在函数结束时你没有显式地返回任何内容，JavaScript 将为你返回 `undefined`：\n\n```\nfunction\
  \ noReturn() {\n  // 没有显式返回\n}\nassert.equal(noReturn(), undefined);\n```\n\n###\
  \ 25.6 参数处理\n\n再次，在本节中我只提到函数，但所有内容同样适用于方法。\n\n### 25.6.1 术语：参数 (parameters) vs.\
  \ 参数 (arguments)\n\n*parameter*（参数）和 *argument*（参数）这两个术语基本上的意思相同。如果你愿意，可以进行如下区分：\n\
  \n* *Parameters*（参数）是函数定义的一部分。它们也被称为形式参数（*formal parameters*）或形参（*formal arguments*）。\n\
  * *Arguments*（参数）是函数调用的一部分。它们也被称为实参数（*actual parameters*）或实（*actual arguments*）。\n\
  \n### 25.6.2 术语：回调 (callback)\n\n*callback*（回调）或回调函数是作为函数或方法调用的参数的函数。\n\n以下是一个回调的示例：\n\
  \n```\nconst myArray = ['a', 'b'];\nconst callback = (x) => console.log(x);\nmyArray.forEach(callback);\n\
  \n// 输出:\n// 'a'\n// 'b'\n```\n\nJavaScript 广泛地使用 *callback* 一术语。\n\n在其他编程语言中，*callback*\
  \ 一词通常有更窄的含义：它指的是一种通过函数值的参数来异步传递结果的模式。在这种含义下，*callback*（或 *continuation* 延续）在函数完全完成计算后被调用。\n\
  \n作为异步模式的回调，在异步编程章节中进行了描述。\n\n### 25.6.3 参数过多或不足\n\n如果函数调用提供的参数数量与函数预期的不符，JavaScript\
  \ 不会报错：\n\n* 多余的参数会被忽略。\n* 缺失的参数将被设置为 `undefined`。\n\n例如：\n\n```\nfunction foo(x,\
  \ y) {\n  return [x, y];\n}\n// 参数过多：\nassert.equal(foo('a', 'b', 'c'), ['a', 'b']);\n\
  // 预期的参数数量：\nassert.equal(foo('a', 'b'), ['a', 'b']);\n// 参数不足：\nassert.equal(foo('a'),\
  \ ['a', undefined]);\n```\n\n### 25.6.4 参数默认值\n\n参数默认值指定了在未提供参数时应使用的值——例如：\n\n```\n\
  function f(x, y=0) {\n  return [x, y];\n}\nassert.equal(f(1), [1, 0]);\nassert.equal(f(),\
  \ [undefined, 0]);\n```\n\n`undefined` 也会触发默认值：\n\n```\nassert.equal(f(undefined,\
  \ undefined), [undefined, 0]);\n```\n\n### 25.6.5 剩余参数 (Rest parameters)\n\n剩余参数通过在标识符前加上\
  \ `...` 来声明。在函数或方法调用期间，它接收一个包含所有剩余参数的 `Array`。如果最后没有参数，则是一个空 `Array` ——例如：\n\n```javascript\n\
  function f(x, ...y) {\n  return [x, y];\n}\nassert.equal(f('a', 'b', 'c'), ['a',\
  \ ['b', 'c']]);\nassert.equal(f(), [undefined, []]);\n```\n\n#### 25.6.5.1 通过剩余参数强制规定数量的参数\n\
  \n你可以使用剩余参数来强制规定数量的参数。例如以下函数：\n\n```javascript\nfunction createPoint(x, y) {\n \
  \ return {x, y}; // 等于 {x: x, y: y}\n}\n```\n\n这是我们如何强制调用者始终提供两个参数：\n\n```javascript\n\
  function createPoint(...args) {\n  if (args.length !== 2) {\n    throw new Error('Please\
  \ provide exactly 2 arguments!');\n  }\n  const [x, y] = args; // (A)\n  return\
  \ {x, y};\n}\n```\n\n在 A 行中，我们通过*解构](#ch038.xhtml_destructuring) 访问 `args` 的元素。\n\
  \n### 25.6.6 命名参数 (Named parameters)\n\n当有人调用函数时，调用者提供的参数会被分配给被调用者接收的参数。执行映射的方法有两种：\n\
  \n1. **位置参数**：如果参数的位置相同，则进行分配。使用位置参数的函数调用如下。\n\n```javascript\nselectEntries(3,\
  \ 20, 2)\n```\n\n2. **命名参数**：如果参数名称相同，则进行分配。JavaScript 没有真正的命名参数，但你可以模拟它们。例如，这是仅使用（模拟）命名参数的函数调用：\n\
  \n```javascript\nselectEntries({start: 3, end: 20, step: 2})\n```\n\n命名参数有几个优点：\n\
  \n* 它们让代码更具自解释性，因为每个参数都有描述性标签。比较这两个版本的 `selectEntries()`：使用后一种可以更容易看出发生了什么。\n* 参数的顺序并不重要（只要名称正确）。\n\
  * 处理多个可选参数更加方便：调用者可以轻松提供所有可选参数的子集，而无需关心它们省略的部分（对于位置参数，你必须填充前面的可选参数，并使用 `undefined`）。\n\
  \n### 25.6.7 模拟命名参数\n\nJavaScript 没有真正的命名参数。模拟这些的官方方法是通过对象字面量：\n\n```javascript\n\
  function selectEntries({start=0, end=-1, step=1}) {\n  return {start, end, step};\n\
  }\n```\n\n\n\n\n\n此函数使用 `destructuring`（解构）来访问其单一参数的属性。它使用的模式是以下模式的缩写：\n\n```\n\
  []{start: start=0, end: end=-1, step: step=1}\n```\n\n这种解构模式适用于空对象字面量：\n\n```\n\
  > selectEntries({})\n{ start: 0, end: -1, step: 1 }\n```\n\n但如果在不传递任何参数的情况下调用函数，它将不起作用：\n\
  \n```\n> selectEntries()\nTypeError: Cannot destructure property `start` of 'undefined'\
  \ or 'null'.\n```\n\n你可以通过为整个模式提供一个默认值来修复这个问题。这个默认值的作用与简单参数定义中的默认值相同：如果参数缺失，则使用默认值。\n\
  \n```\n[](#cb499-1)function selectEntries({start=0, end=-1, step=1} = {}) {\n[](#cb499-2)\
  \  return {start, end, step};\n[](#cb499-3)}\n[](#cb499-4)assert.deepEqual(\n[](#cb499-5)\
  \  selectEntries(),\n[](#cb499-6)  { start: 0, end: -1, step: 1 });\n```\n\n###\
  \ 25.6.8 将 (`...`) 展开到函数调用\n\n如果你在函数调用的参数前面放置三个点（`...`），那么你就是对其进行了 `spread`（展开）。这意味着该参数必须是一个\
  \ `iterable`（迭代）对象，且迭代值都将变成参数。换句话说，单个参数被扩展为多个参数——例如：\n\n```\n[](#cb500-1)function\
  \ func(x, y) {\n[](#cb500-2)  console.log(x);\n[](#cb500-3)  console.log(y);\n[](#cb500-4)}\n\
  [](#cb500-5)const someIterable = ['a', 'b'];\n[](#cb500-6)func(...someIterable);\n\
  [](#cb500-7)  // 等同于 func('a', 'b')\n[](#cb500-8)\n[](#cb500-9)// 输出:\n[](#cb500-10)//\
  \ 'a'\n[](#cb500-11)// 'b'\n```\n\n展开（Spread）和剩余参数（rest parameters）使用相同的语法（`...`），但它们的作用相反：\n\
  \n*   剩余参数用于定义函数或方法。它们将参数收集到 `Arrays`（数组）中。\n*   展开的参数（Spread arguments）用于调用函数或方法。它们将可迭代对象转换为参数。\n\
  \n#### 25.6.8.1 示例：展开到 `Math.max()`中中\n\n`Math.max()` 返回其零或多个参数中的最大值。遗憾的是，它不能用于数组，但展开为我们提供了一个解决办法：\n\
  \n```\n> Math.max(-1, 5, 11, 3)\n11\n> Math.max(...[-1, 5, 11, 3])\n11\n> Math.max(-1,\
  \ ...[-5, 11], 3)\n11\n```\n\n#### 25.6.8.2 示例：展开到 `Array.prototype.push()`中\n\n\
  同样，数组方法 `.push()` 会破坏性地将其零或多个参数添加到 `Array`（数组）的末尾。JavaScript 没有方法可以破坏性地将一个数组追加到另一个数组。再次，展开拯救了我们：\n\
  \n```\n[](#cb502-1)const arr1 = ['a', 'b'];\n[](#cb502-2)const arr2 = ['c', 'd'];\n\
  [](#cb502-3)\n[](#cb502-4)arr1.push(...arr2);\n[](#cb502-5)assert.deepEqual(arr1,\
  \ ['a', 'b', 'c', 'd']);\n```\n\n![](img/file6.svg) **练习：参数处理**\n\n*   位置参数：`exercises/callables/positional_parameters_test.mjs`\n\
  *   命名参数：`exercises/callables/named_parameters_test.mjs`\n\n## 25.7 动态评估代码：`eval()`，`new\
  \ Function()`（进阶）\n\n接下来，我们将查看两种动态评估代码的方法：`eval()` 和 `new Function()`。\n\n### 25.7.1 `eval()`\n\
  \n给定一个带有 JavaScript 代码的字符串 `str`，`eval(str)` 会评估该代码并返回结果：\n\n```\n> eval('2 ** 4')\n\
  16\n```\n\n调用 `eval()` 有两种方式：\n\n*   `直接地`，通过函数调用。此时参数中的代码将在当前作用域内进行评估。\n*   `间接地`，不通过函数调用。此时它将在全局作用域内评估代码。\n\
  \n“不通过函数调用”意味着“任何看起来与 `eval(···)`不同的形式”：\n\n*   `eval.call(undefined, '···')`\n\
  *   `(0, eval)('···')`（使用逗号运算符）\n*   `globalThis.eval('···')`\n*   `const e = eval;\
  \ e('···')`\n*   等等。\n\n以下代码说明了区别：\n\n```\n[](#cb504-1)globalThis.myVariable = 'global';\n\
  [](#cb504-2)function func() {\n[](#cb504-3)  const myVariable = 'local';\n[](#cb504-4)\
  \ \n[](#cb504-5)  // 直接 eval\n[](#cb504-6)  assert.equal(eval('myVariable'), 'local');\n\
  [](#cb504-7) \n[](#cb504-8)  // 间接 eval\n[](#cb504-9)  assert.equal(eval.call(undefined,\
  \ 'myVariable'), 'global');\n[](#cb504-10)}\n```\n\n在全局上下文中评估代码更安全，因为代码可以的内部实现较少。\n\
  \n### 25.7.2 `new Function()`\n\n`new Function()` 创建一个函数对象并如下调用：\n\n```\n[](#cb505-1)const\
  \ func = new Function('«param_1»', ···, '«param_n»', '«func_body»');\n```\n\n前面的语句等于下一个语句。注意\
  \ `«param_1»` 等不再在字符串字面量内部了。\n\n```\n[](#cb506-1)const func = function («param_1»,\
  \ ···, «param_n») {\n[](#cb506-2)  «func_body»\n[](#cb506-3)};\n```\n\n在下一个示例中，我们创建了两次相同的函数，首先通过\
  \ `new Function()`，然后通过函数表达式：\n\n```\n[](#cb507-1)const times1 = new Function('a',\
  \ 'b', 'return a * b');\n[](#cb507-2)const times2 = function (a, b) { return a *\
  \ b };\n```\n\n![](img/file4.svg) **`new Function()` 创建非严格模式函数**\n\n通过 `new Function()`\
  \ 创建的函数是 `sloppy`（松散模式的）。\n\n### 25.7.3 建议\n\n尽可能避免动态评估代码：\n\n*   这存在安全风险，因为它可能允许攻击者以你的代码的权限执行任意代码。\n\
  *   它可能被禁用——例如，在浏览器中，通过[内容安全策略](https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP)。\n\
  \n很多情况下，JavaScript 已经足够动态，因此你不需要 `eval()` 或类似的工具。在下面的示例中，我们用 `eval()` 做的事情（A 行）完全可以在不用它的情况下实现（B\
  \ 行）。\n\n```\n[](#cb508-1)const obj = {a: 1, b: 2};\n[](#cb508-2)const propKey =\
  \ 'b';\n[](#cb508-3)\n[](#cb508-4)assert.equal(eval('obj.' + propKey), 2); // (A)\n\
  [](#cb508-5)assert.equal(obj[propKey], 2); // (B)\n```\n\n如果你必须动态评估代码：\n\n*   优先使用\
  \ `new Function()` 而不是 `eval()`：它始终在全局上下文中执行代码，且函数提供了一个整洁的接口。\n\n\n\n\n\n对于每次函数调用，你都需要为调用函数的变量（参数和局部变量）准备新的存储空间。这是通过一个所谓的`执行上下文`（execution\
  \ contexts）栈来管理的，执行上下文是对环境（就本章而言）的引用。环境本身存储在堆上。这是必要的，因为它们有时在执行离开其作用域后仍然存在（我们将在探索`闭包`时会看到这一点）。因此，它们本身无法通过栈来管理。\n\
  \n### 26.2.1 执行代码\n\n在执行代码时，我们进行了以下停顿：\n\n```\n[](#cb510-1)function f(x) {\n[](#cb510-2)\
  \  // 暂停 3\n[](#cb510-3)  return x * 2;\n[](#cb510-4)}\n[](#cb510-5)function g(y)\
  \ {\n[](#cb510-6)  const tmp = y + 1;\n[](#cb510-7)  // 暂停 2\n[](#cb510-8)  return\
  \ f(tmp);\n[](#cb510-9)// 暂停 1\n[](#cb510-11)assert.equal(g(3), 8);\n```\n\n发生的情况如下：\n\
  \n*   暂停 1 – 在调用 `g()` 之前（图 7）。\n*   暂停 2 – 在执行 `g()` 期间（图 8）。\n*   暂停 3 – 在执行 `f()`\
  \ 期间（图 9）。\n*   剩余步骤：每当遇到 `return`，一个执行上下文就会栈中移除。\n\n![](img/file16.svg)\n\n图 7：递归，暂停\
  \ 1 – 在调用 `g()` 之前：执行上下文栈有一个项，指向顶层环境。在该环境中有两个条目；一个针对 `f()`，另一个针对 `g()`。\n\n![](img/file17.svg)\n\
  \n图 8：递归，暂停 2 – 在执行 `g()` 期间：执行上下文栈的顶端指向为 `g()` 创建的环境。该环境包含参数 `y` 和局部变量 `tmp` 的条目。\n\
  \n![](img/file18.svg)\n\n图 9：递归，暂停 3 – 在执行 `f()` 期间：现在的顶端执行上下文指向 `f()` 的环境。\n\n\
  ## 26.3 通过环境实现的嵌套作用域\n\n我们使用以下代码来探索如何通过环境实现嵌套作用域。\n\n```\n[](#cb511-1)function f(x)\
  \ {\n[](#cb511-2)  function square() {\n[](#cb511-3)    const result = x * x;\n\
  [](#cb511-4)    return result;\n[](#cb511-5)  }\n[](#cb511-6)  return square();\n\
  }\n[](#cb511-8)assert.equal(f(6), 36);\n```\n\n在这里，我们有三个嵌套作用域：顶层作用域、`f()` 的作用域以及\
  \ `square()` 的作用域。观察结果：\n\n*   作用域是连接的。内部作用域“继承”外部作用域的所有变量（但不包括它所遮蔽的变量）。\n*   作为一种机制，嵌套作用域与递归是独立的。后者最好通过独立环境的栈来管理。前者是每个环境与其被创建时“所在”的环境之间的关系。\n\
  \n因此，每个作用域的环境都通过一个名为 `outer` 的字段指向周围作用域的环境。当我们查找变量的值时，我们首先在当前环境中搜索其名称，然后在外部环境中搜索，紧接着在外部环境的外部环境中搜索，以此此类推。整个外部环境链包含了当前所有可以访问的变量（不包含被遮蔽的变量除外）。\n\
  \n当你进行函数调用时，你会创建一个新环境。该环境的外部环境是该函数被创建时的环境。为了帮助设置通过函数调用创建的环境的 `outer` 字段，每个函数都有一个名为\
  \ `[[Scope]]` 的内部属性，指向它的“出生环境”。\n\n### 26.3.1 执行代码\n\n这些是我们在执行代码时进行的停顿：\n\n```\n\
  [](#cb512-1)function f(x) {\n[](#cb512-2)  function square() {\n[](#cb512-3)   \
  \ const result = x * x;\n[](#cb512-4)    // 暂停 3\n[](#cb512-5)    return result;\n\
  [](#cb512-6)  }\n[](#cb512-7)  // 暂停 2\n[](#cb512-8)  return square();\n}\n[](#cb512-10)//\
  \ 暂停 1\n[](#cb512-11)assert.equal(f(6), 36);\n```\n\n发生的情况如下：\n\n*   暂停 1 – 在调用\
  \ `f()` 之前（图 10）。\n*   暂停 2 – 在执行 `f()` 期间（图 11）。\n*   暂停 3 – 在执行 `square()` 期间（图\
  \ 12）。\n*   之后，`return` 语句从栈中弹出执行项。\n\n![](img/file19.svg)\n\n图 10：嵌套作用域，暂停 1 –\
  \ 在调用 `f()` 之前：顶层环境只有一个条目，针对 `f()`。`f()` 的出生环境是顶层环境。因此，`f` 的 `[[Scope]]` 指向它。\n\n\
  ![](img/file20.svg)\n\n图 11：嵌套作用域，暂停 2 – 在执行 `f()` 期间：现在有一个针对函数调用 `f(6)` 环境。该环境的外部环境是\
  \ `f()` 的出生环境（索引为 0 的顶层环境）。我们可以看到 `outer` 字段被设置为 `f` 的 `[[Scope]]` 的值。此外，新函数 `square()`\
  \ 的 `[[Scope]]` 是刚刚创建的环境。\n\n![](img/file21.svg)\n\n图 12：嵌套作用域，暂停 3 – 在执行 `square()`\
  \ 期间：之前的模式重复了：最近环境的 `outer` 是通过我们刚刚调用的函数的 `[[Scope]]` 设置的。通过 `outer` 创建的作用域链包含了当前活跃的所有变量。例如，如果我们愿意，可以访问\
  \ `result`、`square` 和 `f`。环境反映了变量两个方面：首先，外部环境链反映了嵌套的静态作用域。其次，执行上下文栈反映了动态上进行了哪些函数调用。\n\
  \n### 26.4 闭包与环境\n\n为了查看如何使用环境来实现闭包，我们正在使用以下示例：\n\n```\n[](#cb513-1)function add(x)\
  \ {\n[](#cb513-2)  return (y) => { // (A)\n[](#cb513-3)    return x + y;\n[](#cb513-4)\
  \  };\n}\n[](#cb513-6)assert.equal(add(3)(1), 4); // (B)\n```\n\n这里发生了什么？`add()`\
  \ 是一个返回函数的函数。当我们在 B 行进行嵌套函数调用 `add(3)(1)` 时，第一个参数是给 `add()` 的，第二个参数是给它返回的函数的。这之所以可行，是因为\
  \ A 行创建的函数在离开该作用域时并没有丢失与其出生作用域的连接。相关的环境通过该连接保持存活，函数仍然可以访问该环境中的变量 `x`（`x` 在函数内部是自由变量）。\n\
  \n这种嵌套调用 `add()` 的方式有一个优势：如果你只进行第一次函数调用，你会得到一个参数 `x` 已经填充好的 `add()` 版本：\n\n```\n\
  [](#cb514-1)const plus2 = add(2);\n[](#cb514-2)assert.equal(plus2(5), 7);\n```\n\
  \n将带有两个参数的函数转换为两个只有一个参数的嵌套函数称为柯里化。`add()` 是一个柯里化函数。\n\n只填充函数的某些参数被称为`部分应用`（函数未被完全应用）。函数的.bind()\
  \ 方法 执行了部分应用。在之前的例中，我们可以看到如果函数是柯里化的，部分应用是非常简单的。\n\n### 26.4.0.1 执行代码\n\n当我们执行以下代码时，我们进行了三次停顿：\n\
  \n```\n[](#cb515-1)function add(x) {\n[](#cb515-2)  return (y) => {\n[](#cb515-3)\
  \    // 暂停 3: plus2(5)\n[](#cb515-4)    return x + y;\n[](#cb515-5)  }; // 暂停 1:\
  \ add(2)\n}\n[](#cb515-7)const plus2 = add(2);\n[](#cb515-8)// 暂停 2\n[](#cb515-9)assert.equal(plus2(5),\
  \ 7);\n```\n\n发生的情况如下：\n\n*   暂停 1 – 在执行 `add(2)` 期间（图 13）。\n*   暂停 2 – 在执行 `add(2)`\
  \ 之后（图 14）。\n*   暂停 3 – 在执行 `plus2(5)` 期间（图 15）。\n\n![](img/file22.svg)\n\n\n\n\n\
  \n图 13: 闭包，暂停 1 – 在执行 `add(2)`期间：我们可以看到 `add()` 返回的函数已经存在（见右下角），并且它通过其内部属性 `[[Scope]]`\
  \ 指向它的出生环境。注意 `plus2` 仍然处于它的时间性性死区且未初始化。\n\n![](img/file23.svg)\n\n图 14: 闭包，暂停 2\
  \ – 在执行 `add(2)` 后：`plus2` 现在指向 `add(2)` 返回的函数。该函数通过其 `[[Scope]]` 保持其出生环境（`add(2)`\
  \ 的环境）存活。\n\n![](img/file24.svg)\n\n图 15: 闭包，暂停 3 – 在执行 `plus2(5)` 期间：`plus2` 的\
  \ `[[Scope]]` 用于设置新环境的 `outer`。这就是当前函数获取 `x` 访问的方式。\n\n# 27 模块\n\n### 27.1 概述：ECMAScript\
