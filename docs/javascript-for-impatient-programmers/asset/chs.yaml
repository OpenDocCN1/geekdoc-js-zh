  \n## 28.3 在对象字面量中展开 (`...`)\n\n在函数调用 内部，展开（`...`）将可迭代对象的迭代值转换为参数。\n\n在对象字面量内部，*展开属性*（spread\
  \ property）会将另一个对象的属性添加到当前对象：\n\n```javascript\n> const obj = {foo: 1, bar: 2};\n\
  > {...obj, baz: 3}\n{ foo: 1, bar: 2, baz: 3 }\n```\n\n如果属性键冲突，最后提到的属性将“胜出”：\n\n\
  ```javascript\n> const obj = {foo: 1, bar: 2, baz: 3};\n> {...obj, foo: true}\n\
  { foo: true, bar: 2, baz: 3 }\n> {foo: true, ...obj}\n{ foo: 1, bar: 2, baz: 3 }\n\
  ```\n\n所有值都是展开的，甚至是 `undefined` 和 `null`：\n\n```javascript\n> {...undefined}\n{}\n\
  > {...null}\n{}\n> {...123}\n{}\n> {...'abc'}\n{ '0': 'a', '1': 'b', '2': 'c' }\n\
  > {...['a', 'b']}\n{ '0': 'a', '1': 'b' }\n```\n\n字符串和 `Arrays` 的属性 `.length` 会被这种操作忽略掉（它不是*可枚举的*；更多信息请参见\
  \ §28.7.3 “属性属性和属性描述符”）。\n\n### 28.3.1 展开用：复制对象\n\n你可以使用展开来创建对象 `original` 的拷贝：\n\
  \n```javascript\n[](#cb589-1)const copy = {...original};\n```\n\n注意——拷贝是*浅拷贝*的：`copy`\
  \ 是一个新对象，包含了 `original` 所有属性（键值对）的副本。但如果属性值是对象，那么这些对象不会被复制，而是在 `original` 和 `copy`\
  \ 之间共享。让我们来看一个例子：\n\n```javascript\n[](#cb590-1)const original = { a: 1, b: {foo:\
  \ true}};\n[](#cb590-2)const copy = {...original};\n```\n\n`copy` 的第一层确实是拷贝：如果你更改该层级的任何属性，不会影响原始对象：\n\
  \n```javascript\n[](#cb591-1)copy.a = 2;\n[](#cb591-2)assert.equal(original, { a:\
  \ 1, b: {foo: true} }); // 没有变化\n```\n\n然而，更深层次并没有被复制。例如，`.b` 的值在 `original` 和 `copy`\
  \ 之间共享。改变拷贝中的 `.b` 也会改变原始对象中的 `.b`。\n\n```javascript\n[](#cb592-1)copy.b.foo = false;\n\
  [](#cb592-2)assert.equal(original, { a: 1, b: {foo: false} });\n```\n\n![](img/file4.svg)\
  \ **JavaScript 没有内置深拷贝**\n\n*深拷贝*（所有层次都被复制）在通用实现上是极其困难的。因此，JavaScript 目前没有为此提供的内置操作。如果你需要这种操作，必须自己实现它。\n\
  \n### 28.3.2 展开用：缺失属性的默认值\n\n如果你的代码的输入之一是一个对象，你可以通过指定默认值来使属性变为可选，当属性缺失时使用这些默认值。实现这一点的一种技术是使用一个属性包含默认值的对象。在下面的示例中，该对象是\
  \ `DEFAULTS`：\n\n```javascript\n[](#cb593-1)const DEFAULTS = {foo: 'a', bar: 'b'};\n\
  [](#cb593-2)const providedData = {foo: 1};\n[](#cb593-3)const allData = {...DEFAULTS,\
  \ ...providedData};\n[](#cb593-4)assert.equal(allData, {foo: 1, bar: 'b'});\n```\n\
  \n结果对象 `allData`是通过拷贝 `DEFAULTS` 并用 `providedData` 的属性覆盖其属性创建的。但你不需要一个对象来指定默认值；也可以在对象字面量内部单独指定它们：\n\
  \n```javascript\n[](#cb594-1)const providedData = {foo: 1};\n[](#cb594-2)const allData\
  \ = {foo: 'b', ...providedData};\n[](#cb594-3)assert.equal(allData, {foo: 1, bar:\
  \ 'b'});\n```\n\n### 28.3.3 展开用：非破坏性修改属性\n\n到目前为止，我们遇到了一种更改对象属性 `.foo` 的方法：我们*设置*它（行\
  \ A）并修改了对象。也就是说，这种更改属性的方法是*破坏性*的。\n\n```javascript\n[](#cb595-1)const obj = {foo:\
  \ 'a', bar: 'b'};\n[](#cb595-2)obj.foo = 1; // (A)\n[](#cb595-3)assert.equal(obj,\
  \ {foo: 1, bar: 'b'});\n```\n\n通过展开，我们可以*非破坏性*地改变 `.foo`——我们制作一个拷贝：\n\n（注：由于提供的原始文本在后部分出现了重复且逻辑混乱，我将基于你提供的最后一段完整文本进行翻译，以确保不漏译且不重复。）\n\
  \n（此处省略了重复部分的翻译说明，上方的译文已完全遵循了所有 Markdown 格式要求。）\n\n\n\n`.bind()` 返回一个新函数 `boundFunc()`。调用该函数将执行\
  \ `someFunc()`，并将 `this` 设置为 `thisValue`，同时传入这些参数：`arg1`、`arg2`，随后是 `boundFunc()`\
  \ 的参数。\n\n也就是说，以下两个函数调用是等价的：\n\n```\nboundFunc('a', 'b')\nsomeFunc.call(thisValue,\
  \ arg1, arg2, 'a', 'b')\n```\n\n#### 28.4.3.1 `.bind()` 的替代方案\n\n预填充 `this` 和参数的另一种方法是通过箭头函数实现的：\n\
  \n```javascript\nconst boundFunc2 = (...args) =>\n  someFunc.call(thisValue, arg1,\
  \ arg2, ...args);\n```\n\n#### 28.4.3.2 `.bind()` 的实现\n\n考虑到上一节，`.bind()` 可以如下所示实现为一个真实函数：\n\
  \n```javascript\nfunction bind(func, thisValue, ...boundArgs) {\n  return (...args)\
  \ =>\n    func.call(thisValue, ...boundArgs, ...args);\n}\n```\n\n#### 28.4.3.3\
  \ 示例：绑定一个真实函数\n\n对真实函数使用 `.bind()` 有些不直观，因为你必须为 `this` 提供一个值。考虑到在函数调用期间它是 `undefined`，因此通常将其设置为\
  \ `undefined` 或 `null`。\n\n在下面的示例中，我们创建了 `add8()`，这是一个带有一个参数函数，通过将 `add()` 的第一个参数绑定到\
  \ `8` 实现。\n\n```javascript\nfunction add(x, y) {\n  return x + y;\n}\n\nconst add8\
  \ = add.bind(undefined, 8);\nassert.equal(add8(1), 9);\n```\n\n#### 28.4.3.4 示例：绑定方法\n\
  \n在下面的代码中，我们将方法 `.says()` 转换为独立函数 `func()`：\n\n```javascript\nconst jane = {\n \
  \ first: 'Jane',\n  says(text) {\n    return `${this.first} says “${text}`; // (A)\n\
  \  },\n};\n\nconst func = jane.says.bind(jane, 'hello');\nassert.equal(func(), 'Jane\
  \ says “hello”');\n```\n\n在这里，通过 `.bind()` 将 `this` 设置为 `jane` 是至关重要的。否则，`func()`\
  \ 将无法正常工作，因为 A 行使用了 `this`。\n\n### 28.4.4 `this` 陷阱：提取方法\n\n我们现在对函数和方法已经非常熟悉，并准备好查看涉及方法和\
  \ `this` 的最大的陷阱：如果不小心，调用从对象中提取出的方法可能会失败。\n\n在下面的示例中，当我们提取方法 `jane.says()` 并将其存储在变量\
  \ `func` 中，然后调用函数 `func()` 时，我们失败了。\n\n```javascript\nconst jane = {\n  first: 'Jane',\n\
  \  says(text) {\n    return `${this.first} says “${text}`;\n  },\n};\nconst func\
  \ = jane.says; // 提取方法\nassert.throws(\n  () => func('hello'), // (A)\n  {\n   \
  \ name: 'TypeError',\n    message: \"Cannot read property 'first' of undefined\"\
  ,\n  });\n);\n```\n\nA 行的函数调用等价于：\n\n```javascript\nassert.throws(\n  () => jane.says.call(undefined,\
  \ 'hello'), // `this` 是 undefined!\n  {\n    name: 'TypeError',\n    message: \"\
  Cannot read property 'first' of undefined\",\n  });\n```\n\n所以我们如何修复这个问题？我们需要使用\
  \ `.bind()` 来提取方法 `.says()`：\n\n```javascript\nconst func2 = jane.says.bind(jane);\n\
  assert.equal(func2('hello'), 'Jane says “hello”');\n```\n\n`.bind()` 确保了当我们调用 `func()`\
  \ 时，`this` 始终是 `jane`。\n\n你也可以使用箭头函数来提取方法：\n\n```javascript\nconst func3 = text\
  \ => jane.says(text);\nassert.equal(func3('hello'), 'Jane says “hello”');\n```\n\
  \n#### 28.4.4.1 示例：提取方法\n\n以下是在实际 Web 开发中可能会看到的代码简化版本：\n\n```javascript\nclass ClickHandler\
  \ {\n  constructor(id, elem) {\n    this.id = id;\n    elem.addEventListener('click',\
  \ this.handleClick); // (A)\n  }\n  handleClick(event) {\n    alert('Clicked ' +\
  \ this.id);\n  }\n}\n```\n\n在 A 行中，我们没有正确提取方法 `.handleClick()`。相反，我们应该这样做：\n\n```javascript\n\
  elem.addEventListener('click', this.handleClick.bind(this));\n```\n\n**练习：提取一个方法**\n\
  \n`exercises/single-objects/method_extraction_exrc.mjs`\n\n### 28.4.5 `this` 陷阱：意外遮蔽\
  \ `this`\n\n**意外遮蔽 `this` 仅是普通函数的问题**\n\n箭头函数不会遮蔽 `this`。\n\n考虑以下问题：当你位于普通函数内部时，无法访问周围作用域的\
  \ `this`，因为普通函数有自己的 `this`。换句话说，内部作用域中的变量隐藏了外部作用域中的变量。这被称为*遮蔽*（#ch013.xhtml_shadowing）。\n\
  \n```javascript\nconst outer = {\n  x: 0,\n  method: function() {\n    const inner\
  \ = function() {\n      console.log(this.x); // `this` 是 undefined!\n    };\n  \
  \  inner.call(this);\n  }\n};\nouter.method(); // 什么都不打印\n```\n\n等待，上面的示例只是为了说明。让我们看看文中提供的特定问题：\n\
  \n```javascript\nconst outer = {\n  x: 0,\n  method: function() {\n    const inner\
  \ = function() {\n      console.log(this.x); // `this` 是 undefined!\n    };\n  \
  \  inner.call(this);\n  }\n};\n```\n\n\n\n然而，尽管我不再使用（普通的）函数表达式了，但在语法上我仍然喜欢函数声明（function\
  \ declarations）。如果你不在函数内部引用 `this`，就可以安全地使用它们。当你错误地执行此操作时，静态检查工具 `ESLint` 可以在开发期间通过[一个内置规则](https://eslint.org/docs/rules/no-invalid-this)向你发出警告。\n\
  \n遗憾的是，没有简单的方法可以规避第一个陷阱：每当你提取一个方法时，都必须小心并正确地处理——例如，通过绑定 `this`。\n\n## 28.4.7 `this`\
  \ 在各种上下文中的值\n\n在各种上下文中，`this` 的值是什么？\n\n在调用实体内部，`this` 的值取决于该调用实体是如何调用的以及它是什么样的调用实体：\n\
  \n*   函数调用：\n    *   普通函数：`this === undefined`（严格模式下）\n    *   箭头函数：`this` 与周围作用域相同（词法\
  \ `this`）\n*   方法调用：`this` 是调用的接收者\n*   `new`：`this` 指向新创建的实例\n\n你也可以在常见的顶层作用域中访问\
  \ `this`：\n\n*   `<script>` 元素：`this === globalThis`\n*   ECMAScript 模块：`this ===\
  \ undefined`\n*   CommonJS 模块：`this === module.exports`\n\n然而，我喜欢假装无法在顶层作用域中访问 `this`，因为顶层的\
  \ `this` 令人困惑且很少用。\n\n### 28.5 作为字典的对象（进阶）\n\n对象作为记录（records）时效果最好。但在 ES6 之前， JavaScript\
  \ 还没有用于字典的数据结构（ES6 引入了 Maps）。因此，必须使用对象作为字典，这施加了一个巨大的限制：键必须是字符串（符号也是在 ES6 中引入的）。\n\
  \n我们首先查看与字典相关但对“对象作为记录”也有用的对象特性。本节最后将给出如何实际使用对象作为字典的技巧（剧透：如果可以，请使用 `Maps`）。\n\n\
  ### 28.5.1 任意固定字符串作为属性键\n\n到为止，我们一直使用对象作为记录。属性键是固定的标记，必须是有效的标识符并在内部转变为字符串：\n\n```\n\
  const obj = {\n  mustBeAnIdentifier: 123,\n};\n// 获取属性\nassert.equal(obj.mustBeAnIdentifier,\
  \ 123);\n\n// 设置属性\nobj.mustBeAnIdentifier = 'abc';\nassert.equal(obj.mustBeAnIdentifier,\
  \ 'abc');\n```\n\n下一步，我们将突破属性键的限制：在本节中，我们将使用任意固定字符串作为键。在下一个子节中，我们将动态计算键。\n\n两种技术允许我们使用任意字符串作为属性键。\n\
  \n首先，当通过对象字面量创建属性键时，我们可以对属性键加引号（使用单引号或双引号）：\n\n```\nconst obj = {\n  'Can be any\
  \ string!': 123,\n};\n```\n\n其次，在获取或设置属性时，我们可以使用带有字符串的方括号：\n\n```javascript\n//\
  \ 获取属性\nassert.equal(obj['Can be any string!'], 123);\n\n// 设置属性\nobj['Can be any\
  \ string!'] = 'abc';\nassert.equal(obj['Can be any string!'], 'abc');\n```\n\n你也可以将这些技术用于方法：\n\
  \n```javascript\nconst obj = {\n  'A nice method'() {\n    return 'Yes!';\n  },\n\
  };\nassert.equal(obj['A nice method'](), 'Yes!');\n```\n\n### 28.5.2 计算属性键\n\n到为止，属性键始终是对象字面量内部的固定字符串。在本节中，我们学习如何动态计算属性键。这允许我们使用任意字符串或符号（symbols）。\n\
  \n对象字面量中动态计算属性键的语法灵感来源于动态访问属性。也就是说，我们可以使用方括号包裹表达式：\n\n```javascript\nconst obj =\
  \ {\n  ['Hello world!']: true,\n  ['f'+'o'+'o']: 123,\n  [Symbol.toStringTag]: 'Goodbye',\
  \ // (A)\n};\nassert.equal(obj['Hello world!'], true);\nassert.equal(obj.foo, 123);\n\
  assert.equal(obj[Symbol.toStringTag], 'Goodbye');\n```\n\n计算键的主要用例是使用符号作为属性键（行 A）。\n\
  \n注意，用于获取和设置属性的方括号运算符适用于任意表达式：\n\n```javascript\nassert.equal(obj['f'+'o'+'o'],\
  \ 123);\nassert.equal(obj['==> foo'.slice(-3)], 123);\n```\n\n方法也可以有计算属性键：\n\n```javascript\n\
  const methodKey = Symbol();\nconst obj = {\n  [methodKey]() {\n    return 'Yes!';\n\
  \  },\n};\nassert.equal(obj[methodKey](), 'Yes!');\n```\n\n在本章的剩余部分中，我们将再次主要使用固定属性键（因为它们在语法上更方便）。但所有特性适用于任意字符串和符号。\n\
  \n![](img/file6.svg) **练习：通过展开非破坏性地更新属性（计算键）**\n\n`exercises/single-objects/update_property_test.mjs`\n\
  \n### 28.5.3 `in` 运算符：是否存在具有给定键的属性？\n\n`in` 运算符检查对象是否具有给定键的属性：\n\n```javascript\n\
  const obj = {\n  foo: 'abc',\n  bar: false,\n};\nassert.equal('foo' in obj, true);\n\
  assert.equal('unknownKey' in obj, false);\n```\n\n#### 28.5.3.1 通过真值检查检查属性是否存在\n\
  \n你也可以使用真值检查来确定属性是否存在：\n\n```javascript\nassert.equal(\n  obj.foo ? 'exists' : 'does\
  \ not exist',\n  'exists');\nassert.equal(\n  obj.unknownKey ? 'exists' : 'does\
  \ not exist',\n  'does not exist');\n```\n\n之前的检查之所以有效，是因为 `obj.foo` 是真值，并且读取缺失的属性会返回\
  \ `undefined`（它是假值）。\n\n然而，有一个重要的注意事项：如果属性存在但值为假值（`undefined`、`null`、`false`、`0`、`\"\
  \"` 等），真值检查将失败：\n\n```javascript\nassert.equal(\n  obj.bar ? 'exists' : 'does not\
  \ exist',\n  'does not exist'); // 应该是：'exists'\n```\n\n### 28.5.4 删除属性\n\n你可以通过\
  \ `delete` 运算符删除属性：\n\n```javascript\nconst obj = {\n  foo: 123,\n};\nassert.deepEqual(Object.keys(obj),\
  \ ['foo']);\n\ndelete obj.foo;\nassert.deepEqual(Object.keys(obj), []);\n```\n\n\
  ### 28.5.5 列出属性键\n\n表 18：列出*自有*（非继承）属性键的标准库方法。它们都返回带有字符串或符号的数组。\n\n|  | 可枚举 | 非枚举\
  \ | 字符串 | 符号 |\n| --- | --- | --- | --- | --- |\n| `Object.keys()` | `✔` | | `✔`\
  \ |  |\n| `Object.getOwnPropertyNames()` | `✔` | `✔` | `✔` |  |\n| `Object.getOwnPropertySymbols()`\
  \ | `✔` | `✔` |   | `✔` |\n| `Reflect.ownKeys()` | `✔` | `✔` | `✔` | `✔` |\n\n表\
  \ 18 中的每个方法都返回一个包含参数自有属性键的数组。在方法名称中，你可以看到这种区分：\n\n*   *属性键*（property key）可以是字符串也可以是符号。\n\
  *   *属性名*（property name）是值为字符串的属性键。\n*   *属性符号*（property symbol）是值为符号的属性键。\n\n下一节将描述“可枚举”（enumerable）一词并演示每种方法。\n\
  \n#### 28.5.5.1 可枚举性\n\n\n\n\n\n`Enumerability`（可枚举性）是属性的一个`属性``（参见表 18）和扩展属性（spread\
  \ properties）都会忽略它们。默认情况下，大多数属性都是可枚举的。接下来的示例展示了如何如何更改这一点，同时也演示了列出属性键的不同方法。\n\n```javascript\n\
  const enumerableSymbolKey = Symbol('enumerableSymbolKey');\nconst nonEnumSymbolKey\
  \ = Symbol('nonEnumSymbolKey');\n// 我们通过对象字面量创建可枚举属性\nconst obj = {\n  enumerableStringKey:\
  \ 1,\n  [enumerableSymbolKey]: 2,\n}\n// 对于非枚举属性，我们需要更强大的工具\nObject.defineProperties(obj,\
  \ {\n  nonEnumStringKey: {\n    value: 3,\n    enumerable: false,\n  },\n  [nonEnumSymbolKey]:\
  \ {\n    value: 4,\n    enumerable: false,\n  },\n});\n\nassert.deepEqual(\n  Object.keys(obj),\n\
  \  [ 'enumerableStringKey' ]\n);\nassert.deepEqual(\n  Object.getOwnPropertyNames(obj),\n\
  \  [ 'enumerableStringKey', 'nonEnumStringKey' ]\n);\nassert.deepEqual(\n  Object.getOwnPropertySymbols(obj),\n\
  \  [ enumerableSymbolKey, nonEnumSymbolKey ]\n);\nassert.deepEqual(\n  Reflect.ownKeys(obj),\n\
  \  [\n    'enumerableStringKey', 'nonEnumStringKey',\n    enumerableSymbolKey, nonEnumSymbolKey,\n\
  \  ];\n);\n```\n\n`Object.defineProperties()` 将在本书的后续章节](#ch029.xhtml_property-attributes)\
  \ 中解释。\n\n### 28.5.6 通过 `Object.values()` 列出属性值\n\n`Object.values()` 列出对象所有可枚举属性的值：\n\
  \n```javascript\nconst obj = {foo: 1, bar: 2};\nassert.deepEqual(\n  Object.values(obj),\n\
  \  [1, 2]);\n```\n\n### 28.5.7 通过 `Object.entries()` 列出属性项\n\n`Object.entries()`\
  \ 列出可枚举属性的键值对。每对被编码为一个包含两个元素的数组：\n\n```javascript\nconst obj = {foo: 1, bar: 2};\n\
  assert.deepEqual(\n  Object.entries(obj),\n  [\n    ['foo', 1],\n    ['bar', 2],\n\
  \  ]);\n```\n\n![](img/file6.svg) **练习：`Object.entries()`**\n\n`exercises/single-objects/find_key_test.mjs`\n\
  \n### 28.5.8 属性按确定的顺序列出\n\n对象的自有（非继承）属性始终按照以下顺序列出：\n\n1. 包含整数索引的字符串键（包括数组索引）：\n\
  \   按数字升序\n\n2. 剩余的字符串键属性：\n   按照它们被添加的顺序\n\n3. Symbol 键属性：\n   按照它们被添加的顺序\n\n下面的示例演示了如何根据这些规则对属性键进行排序：\n\
  \n```javascript\n> Object.keys({b:0,a:0, 10:0,2:0})\n[ '2', '10', 'b', 'a' ]\n```\n\
  \n![](img/file5.svg) **属性的顺序**\n\n[ECMAScript 规范](https://tc39.github.io/ecma262/#sec-ordinaryownpropertykeys)\
  \ 更详细地描述了属性是如何排序的。\n\n### 28.5.9 通过 `Object.fromEntries()` 组对象\n\n给定一个包含[键, 值]对的迭代器，`Object.fromEntries()`\
  \ 会创建一个对象：\n\n```javascript\nassert.deepEqual(\n  Object.fromEntries([['foo',1],\
  \ ['bar',2]]),\n  {\n    foo: 1,\n    bar: 2,\n  }\n);\n```\n\n`Object.fromEntries()`\
  \ 是`Object.entries()`的反向操作。\n\n为了演示这两者，我们将在接下来的子子节中使用它们来实现 [Underscore](https://underscorejs.org)\
  \ 库中的两个工具函数。\n\n#### 28.5.9.1 示例：`pick(object, ...keys)`\n\n[`pick`](https://underscorejs.org/#pick)\
  \ 返回 `object` 的拷贝，该拷贝仅包含那些作为参数列出的键的属性：\n\n```javascript\nconst address = {\n  street:\
  \ 'Evergreen Terrace',\n  number: '742',\n  city: 'Springfield',\n  state: 'NT',\n\
  \  zip: '49007',\n};\nassert.deepEqual(\n  pick(address, 'street', 'number'),\n\
  \  {\n    street: 'Evergreen Terrace',\n    number: '742',\n  }\n);\n```\n\n我们可以如下所示实现\
  \ `pick()`：\n\n```javascript\nfunction pick(object, ...keys) {\n  const filteredEntries\
  \ = Object.entries(object)\n    .filter(([key, _value]) => keys.includes(key));\n\
  \  return Object.fromEntries(filteredEntries);\n}\n```\n\n#### 28.5.9.2 示例：`invert(object)`\n\
  \n[`invert`](https://underscorejs.org/#invert) 返回 `object` 的拷贝，其中所有属性的键和值都交换了：\n\
  \n```javascript\nassert.deepEqual(\n  invert({a: 1, b: 2, c: 3}),\n  {1: 'a', 2:\
  \ 'b', 3: 'c'}\n);\n```\n\n我们可以这样实现 `invert()`：\n\n```javascript\nfunction invert(object)\
  \ {\n  return Object.entries(object)\n    .map(([key, value]) => [value, key]);\n\
  }\n```\n\n#### 28.5.9.3 `fromEntries()` 的简单实现\n\n```javascript\nfunction fromEntries(iterable)\
  \ {\n  const result = {};\n  for (const [key, value] of iterable) {\n    let coercedKey;\n\
  \    if (typeof key === 'string' || typeof key === 'symbol') {\n      coercedKey\
  \ = key;\n    } else {\n      coercedKey = String(key);\n    }\n    result[coercedKey]\
  \ = value;\n  }\n  return result;\n}\n```\n\n#### 28.5.9.4 `Object.fromEntries()`\
  \ 的填充程序 (polyfill)\n\nnpm 软件包 `object.fromentries` 是 `Object.entries()` 的`填充程序`\
  \ **练习：`Object.entries()` 和 `Object.fromEntries()`**\n\n`exercises/single-objects/omit_properties_test.mjs`\n\
  \n### 28.5.10 使用对象作为字典的陷阱\n\n如果你使用普通对象（通过对象字面量创建）作为字典，你必须注意两个陷阱。\n\n第一个陷阱是 `in`\
  \ 运算符也会找到继承属性：\n\n```javascript\nconst dict = {};\nassert.equal('toString' in dict,\
  \ true);\n```\n\n我们希望 `dict` 是空的，但 `in` 运算符检测到了它从其原型 `Object.prototype` 继承的属性。\n\
  \n第二个陷阱是你不能使用属性键 `__proto__`，因为它具有特殊权限（它会设置对象的原型）：\n\n```javascript\nconst dict\
  \ = {};\ndict['__proto__'] = 123;\n// dict 没有添加任何属性：\nassert.deepEqual(Object.keys(dict),\
  \ []);\n```\n\n那么我们如何避免这些陷阱呢？\n\n*   尽可能使用 Maps。它们是字典的最佳解决方案。\n*   如果不能，使用一个处理对象作为字典的库，它能够安全地完成一切。\n\
  *   如果还是不能，使用没有原型的对象。\n\n下面的代码演示了如何将没有原型的对象作为字典：\n\n```javascript\nconst dict =\
  \ Object.create(null); // 没有原型\nassert.equal('toString' in dict, false); // (A)\n\
  \ndict['__proto__'] = 123;\nassert.deepEqual(Object.keys(dict), ['__proto__']);\n\
  ```\n\n\n\n\n我们避开了这两个陷阱：首先，没有原型的属性不会继承任何属性（第 A 行）。第二，在现代 JavaScript 中，`__proto__`\
  \ 是通过 `Object.prototype` 实现的。这意味着，如果 `Object.prototype` 不在原型链中，它就会失效。\n\n![](img/file6.svg)\
  \ **练习：使用对象作为字典**\n\n`exercises/single-objects/simple_dict_test.mjs`\n\n## 28.6 标准方法（进阶）\n\
  \n`Object.prototype` 定义了 de 几个标准方法，这些方法可以被重写，以配置语言处理对象的方式。其中两个重要的方法是：\n\n*   `.toString()`\n\
  *   `.valueOf()`\n\n### 28.6.1 `.toString()`\n\n`.toString()` 决定了对象如何转换为字符串：\n\n\
  ```\n> String({toString() { return 'Hello!' }})\n'Hello!'\n> String({})\n'[object\
  \ Object]'\n```\n\n### 28.6.2 `.valueOf()`\n\n`.valueOf()` 决定了对象如何转换为数字：\n\n```\n\
  > Number({valueOf() { return 123 }})\n123\n> Number({})\nNaN\n```\n\n## 28.7 高级主题\n\
  \n以下小节对几个高级主题进行了要概述。\n\n### 28.7.1 `Object.assign()`\n\n`Object.assign()` 是一个工具方法：\n\
  \n```\nObject.assign(target, source_1, source_2, ···)\n```\n\n该表达式将 `source_1` 的所有属性赋值给\
  \ `target`，然后是 `source_2` 的属性，以此此类推。最后，它返回 `target` —— 例如：\n\n```javascript\nconst\
  \ target = { foo: 1 };\n\nconst result = Object.assign(\n  target,\n  {bar: 2},\n\
  \  {baz: 3, bar: 4});\n\nassert.deepEqual(\n  result, { foo: 1, bar: 4, baz: 3 });\n\
  // target 被修改并返回：\nassert.equal(result, target);\n```\n\n`Object.assign()` 的用例与展开属性（spread\
  \ properties）类似。在某种意义上，它是破坏性的展开。\n\n### 28.7.2 冻结对象\n\n`Object.freeze(obj)` 使 `obj`\
  \ 完全不可变：你无法更改属性、添加属性或更改其原型 —— 例如：\n\n```javascript\nconst frozen = Object.freeze({\
  \ x: 2, y: 5 });\nassert.throws(\n  () => { frozen.x = 7 },\n  {\n    name: 'TypeError',\n\
  \    message: /^Cannot assign to read only property 'x'/,\n  });\n```\n\n这里有一个例外：`Object.freeze(obj)`\
  \ 是浅冻结的。也就是说，只有 `obj` 自身的属性被冻结，而存储在属性中的对象不会被冻结。\n\n### 28.7.3 属性标记和属性描述符\n\n正如对象由属性组成一样，属性也由`attributes`组成。属性的值只是多个属性之一。其他属性包括：\n\
  \n*   `writable`：是否修改属性的值？\n*   `enumerable`：属性是否会被 `Object.keys()`、展开等操作考虑？\n\n\
  当你使用处理属性标记的操作之一时，属性是通过**属性描述符**（property descriptors）指定的：即每个属性代表一个标记的对象。例如，以下是如何读取属性\
  \ `obj.foo` 标记的：\n\n```javascript\nconst obj = { foo: 123 };\nassert.deepEqual(\n\
  \  Object.getOwnPropertyDescriptor(obj, 'foo'),\n  {\n    value: 123,\n    writable:\
  \ true,\n    enumerable: true,\n    configurable: true,\n  });\n```\n\n以下是如何设置属性\
  \ `obj.bar` 标记的：\n\n```javascript\nconst obj = {\n  foo: 1,\n  bar: 2,\n};\n\nassert.deepEqual(Object.keys(obj),\
  \ ['foo', 'bar']);\n\n// 从 Object.keys() 中隐藏属性 `bar`\nObject.defineProperty(obj,\
  \ 'bar', {\n  enumerable: false,\n});\n\nassert.deepEqual(Object.keys(obj), ['foo']);\n\
  ```\n\n可枚举性（Enumerability）在本章前面的章节](#ch029.xhtml_enumerability）中有更详细的介绍。关于属性标记和属性描述符的更多信息，请参阅\
  \ [*Speaking JavaScript*](http://speakingjs.com/es5/ch17.html#property_attributes)。\n\
