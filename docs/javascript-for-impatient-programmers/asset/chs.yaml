  \    将 `values` 转换为数字并返回最小的一个。\n    ```\n    > Math.min(3, -5, 24)\n    -5\n   \
  \ ```\n\n*   `Math.random(): number` ^([ES1])\n    返回一个伪随机数 `n`，其中 0 ≤ `n` < 1。\n\
