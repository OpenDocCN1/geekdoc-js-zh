  \    - 8.9.2 严格模式下的改进\n\n### 8.1 JavaScript 语法概述\n\n### 8.1.1 基础语法\n\n注释：\n\n```javascript\n\
  // 单行注释\n/*\n带有\n多行\n的注释\n*/\n```\n\n原始（原子化）值：\n\n```javascript\n// 布尔值\ntrue\n\
  false\n\n// 数字（JavaScript 仅只有一种数字类型）\n-123\n1.141\n\n// 字符串（JavaScript 没有字符类型）\n\
  'abc'\n\"abc\"\n```\n\n断言（assertion）描述了计算结果是什么，如果这些预期不正确，则抛出异常。例如，下面的断言说明 `7 加 1`\
  \ 的结果必须是 `8`：\n\n```javascript\nassert.equal(7 + 1, 8);\n```\n\n`assert.equal()`\
  \ 是一个方法调用（对象是 `assert`），带有两个参数：实际结果和预期结果。它是 Node.js 断言的一部分，将在本书后后部分 中解释。\n\n在浏览器或\
  \ Node.js 的控制台中打印日志：\n\n```javascript\nconsole.log('Hello!');\nconsole.error('Something\
  \ went wrong!');\n```\n\n运算符：\n\n```javascript\n// 布尔运算符\ntrue && false\ntrue ||\
  \ false\n\n// 数字运算符\n3 + 4\n5 - 1\n3 * 4\n9 / 3\n\n// 字符串运算符\n'a' + 'b'\n'I see\
  \ ' + 3\n\n// 比较运算符\n3 < 4\n3 <= 4\n'abc' === 'abc'\n'abc' !== 'def'\n```\n\n声明变量：\n\
  \n```javascript\nlet x; // 声明 x（可变的）\nx = 3; // 给 x 赋值\nlet y = 5; // 声明并赋值\nconst\
  \ z = 8; // 声明 z（不可变的）\n```\n\n控制流语句：\n\n```javascript\n// 条件语句\nif (x < 0) { //\
  \ x 小于零吗？\n  x = -x;\n}\n```\n\n普通函数声明：\n\n```javascript\n// add1 拥有参数 a 和 b\nfunction\
  \ add1(a, b) {\n  return a + b;\n}\n// 调用函数 add1()\nassert.equal(add1(5, 2), 7);\n\
  ```\n\n箭头函数表达式（特别用于函数调用和方法调用的参数）：\n\n```javascript\nconst add2 = (a, b) => { return\
  \ a + b };\n// 调用函数 add2()\nassert.equal(add2(5, 2), 7);\n\n// 等同于 add2:\nconst\
  \ add3 = (a, b) => a + b;\n```\n\n之前的代码包含以下箭头函数（expression 和 statement 术将在本章后后部分\
  \ 中解释）：\n\n```javascript\n// 体为代码块的箭头函数\n(a, b) => { return a + b }\n\n// 体为表达式的箭头函数\n\
  (a, b) => a + b\n```\n\n对象：\n\n```javascript\n// 通过对象字面量创建一个普通对象\nconst obj = {\n\
  \  first: 'Jane', // 属性\n  last: 'Doe', // 属性\n  getFullName() { // 属性（方法）\n   \
  \ return this.first + ' ' + this.last;\n  },\n};\n\n// 获取属性值\nassert.equal(obj.first,\
  \ 'Jane');\n// 设置属性值\nobj.first = 'Janey';\n\n// 调用方法\nassert.equal(obj.getFullName(),\
  \ 'Janey Doe');\n```\n\n数组（数组也是对象）：\n\n```javascript\n// 通过数组字面量创建一个数组\nconst arr\
  \ = ['a', 'b', 'c'];\n\n// 获取数组元素\nassert.equal(arr[1], 'b');\n// 设置数组元素\narr[1]\
  \ = 'β';\n```\n\n### 8.1.2 模块\n\n每个模块都是一个单独的文件。考虑，以下两个包含模块的文件：\n\n```\nfile-tools.mjs\n\
  main.mjs\n```\n\n`file-tools.mjs` 模块导出其函数 `isTextFilePath()`：\n\n```javascript\n\
  export function isTextFilePath(filePath) {\n  return filePath.endsWith('.txt');\n\
  }\n```\n\n\n\n\n\n`main.mjs` 中的模块导入了整个 `path` 模块以及 `isTextFilePath()` 函数：\n\n```\n\
  // Import whole module as namespace object `path`\nimport * as path from 'path';\n\
  // Import a single export of module file-tools.mjs\nimport {isTextFilePath} from\
  \ './file-tools.mjs';\n```\n\n### 8.1.3 法定的变量和属性名\n\n变量名和属性名的语法类别被称为 `identifier`（标识符）。\n\
  \n标识符允许包含字符：\n\n* Unicode 字母：`A`–`Z`，`a`–`z`（等）\n* `$`, `_`\n* Unicode 数字：`0`–`9`（等）\n\
  \    * 变量名不能以数字开头\n\n某些单词在 JavaScript 中具有特殊含义，被称为 `reserved`（保留字）。例如：`if`、`true`、`const`。\n\
  \n保留字不能用变量名：\n\n```javascript\nconst if = 123;\n  // SyntaxError: Unexpected token\
  \ if\n```\n\n但它们允许作为属性名：\n\n```javascript\nconst obj = { if: 123 };\nobj.if\n123\n\
  ```\n\n### 8.1.4 命名风格\n\n连接单词的常用命名风格有：\n\n* 驼峰命名（Camel case）：`threeConcatenatedWords`\n\
  * 下划线命名（Underscore case，也称为 `snake case`）：`three_concatenated_words`\n* 连字符命名（Dash\
  \ case，也称为 `kebab case`）：`three-concatenated-words`\n\n### 8.1.5 命名的大小写\n\n通常情况下，JavaScript\
  \ 使用驼峰命名，常量除外。\n\n小写：\n\n* 函数、变量：`myFunction`\n* 方法：`obj.myMethod`\n* CSS：\n   \
  \ * CSS 实体：`special-class`\n    * 对应的 JavaScript 变量：`specialClass`\n\n大写：\n\n* 类：`MyClass`\n\
  * 常量：`MY_CONSTANT`\n    * 常量也经常使用驼峰命名：`myConstant`\n\n### 8.1.6 命名约定\n\n以下命名约定在\
  \ JavaScript 中非常流行。\n\n如果参数名以下划线开头（或本身就是下划线），则意味着该参数未被使用——例如：\n\n```javascript\n\
  arr.map((_x, i) => i)\n```\n\n如果对象的属性名以下划线开头，则该属性被认为是私有的：\n\n```javascript\nclass\
  \ ValueWrapper {\n  constructor(value) {\n    this._value = value;\n  }\n}\n```\n\
  \n### 8.1.7 分号应该放在哪里？\n\n放在语句末尾：\n\n```javascript\nconst x = 123;\nfunc();\n```\n\
  \n但如果该语句以大括号结尾，则不需要加：\n\n```javascript\nwhile (false) {\n  // ···\n} // 无分号\n\n\
  function func() {\n  // ···\n} // 无分号\n```\n\n然而，在这样的语句后添加分号并不是语法错误——它被解释为空语句：\n\
  \n```javascript\n// Function declaration followed by empty statement:\nfunction\
  \ func() {\n  // ···\n};\n```\n\n**测验：基础**\n\n查看测验应用。\n\n## 8.2 (进阶)\n\n本章剩余的所有章节都是进阶内容。\n\
  \n### 8.3 标识符\n\n### 8.3.1 有效标识符（变量名等）\n\n起始字符：\n\n* Unicode 字母（包括带重音的字符如 `é` 和\
  \ `ü` 以及来自非拉丁字母的字符，如 `α`）\n* `$`\n* `_`\n\n后续字符：\n\n* 合法的起始字符\n* Unicode 数字（包括东阿拉伯数字）\n\
  * 一些其他 Unicode 标记和标点符号\n\n示例：\n\n```javascript\nconst ε = 0.0001;\nconst строка\
  \ = '';\nlet _tmp = 0;\nconst $foo2 = true;\n```\n\n### 8.3.2 保留字\n\n保留字不能作为变量名，但作为属性名。\n\
  \n所有的 JavaScript `keywords`（关键字）都是保留字：\n\n> `await` `break` `case` `catch` `class`\
  \ `const` `continue` `debugger` `default` `delete` `do` `else` `export` `extends`\
  \ `finally` `for` `function` `if` `import` `in` `instanceof` `let` `new` `return`\
  \ `static` `super` `switch` `this` `throw` `try` `typeof` `var` `void` `while` `with`\
  \ `yield`\n\n以下标记也是关键字，但目前在语言中未使用：\n\n> `enum` `implements` `package` `protected`\
  \ `interface` `private` `public`\n\n以下字面量是保留字：\n\n> `true` `false` `null`\n\n从技术上说，这些单词并不是保留的，但你也应该避免它们，因为它们是关键字：\n\
  \n> `Infinity` `NaN` `undefined` `async`\n\n也不应该使用全局变量名（`String`、`Math` 等）作为你自己的变量。\n\
  \n### 8.4 语句 vs 表达式\n\n在本节中，我们将探索 JavaScript 如何区分两种语法结构：`statements`（语句）和 `expressions`（表达式）。之后我们将发现，相同的语法取决于其使用位置可能会产生问题。\n\
  \n我们假设存在语句和表达式\n\n为了简单起见，我们假设 JavaScript 中只有语句和表达式。\n\n### 8.4.1 语句\n\n`statement`（语句）是可以执行并执行某种操作的代码段。例如，`if`\
  \ 是一个语句：\n\n```javascript\nlet myStr;\nif (x > y) {\n  myStr = 'Yes';\n} else {\n\
  \  myStr = 'No';\n}\n```\n\n语句的另一个示例：函数声明。\n\n```javascript\nfunction twice(x) {\n\
  \  return x + x;\n}\n```\n\n### 8.4.2 表达式\n\n`expression`（表达式）是可以求值并产生值的代码段。例如，括号之间的代码是一个表达式：\n\
  \n```javascript\nlet myStr = (condition ? 'Yes' : 'No');\n```\n\n在括号之间使用的运算符 `?:`\
  \ 被称为 `ternary operator`（三元运算符）。它是 `if` 语句的表达式版本。\n\n让我们看更多表达式示例。我们输入表达式，REPL 为我们求值：\n\
  \n```javascript\n> 'ab' + 'cd'\n'abcd'\n> Number('123')\n123\n> true || false\n\
  true\n```\n\n### 8.4.3 哪里允许使用什么？\n\nJavaScript 源代码中的当前位置决定了你可以使用哪种语法结构：\n\n* 函数体必须是语句序列：\n\
  \n```javascript\nfunction max(x, y) {\n  if (x > y) {\n    return x;\n  } else {\n\
  \    return y;\n  }\n}\n```\n\n* 函数调用或方法调用的参数必须是表达式：\n\n```javascript\nconsole.log('ab'\
  \ + 'cd', Number('123'));\n```\n\n然而，表达式可以作为语句使用。它们被称为 `expression statements`（表达式语句）。相反，在需要表达式的地方，可以使用语句。\n\
  \n以下代码演示了任何 `bar()` 都可以表达式或语句——取决于上下文：\n\n```javascript\nfunction f() {\n  console.log(bar());\
  \ // bar() 是表达式\n  bar(); // bar(); 是语句\n}\n```\n\n### 8.5 歧义语法\n\nJavaScript 有一些语法上存在歧义的编程结构：相同的语法在语句上下文或表达式上下文中解释不同。本节将探讨这种现象及其引起的问题。\n\
  \n### 8.5.1 相同语法：函数声明和函数表达式\n\n`function declaration`（函数声明）是一个语句：\n\n```javascript\n\
  function id(x) {\n  return x;\n}\n```\n\n`function expression`（函数表达式）是一个表达式（等号右侧）：\n\
  \n```javascript\nconst id = function me(x) {\n  return x;\n};\n```\n\n### 8.5.2\
  \ 相同语法：对象字面量和块\n\n在以下代码中，`{}` 是一个 `object literal`（对象字面量）：创建一个空对象的表达式。\n\n```javascript\n\
  const obj = {};\n```\n\n这是一个空代码块（一个语句）：\n\n```javascript\n{}\n}\n```\n\n### 8.5.3\
  \ 消除歧义\n\n\n\n\n歧义性仅在语句上下文中才会成为问题：当 JavaScript 解析器遇到歧义语法时，它并不知道这是一个普通语句还是一个表达式语句。例如：\n\
  \n*   如果语句以 `function` 开头：它是一个函数声明还是函数表达式？\n*   如果语句以 `{` 开头：它是一个对象字面量还是代码块？\n\n\
  为了解决这种歧义，以 `function` 或 `{` 开头的语句永远不会被解释为表达式。如果你想让一个表达式语句以这两个标记之一开头，你必须将其包裹在括号中：\n\
  \n```\n[](#cb40-1)(function (x) { console.log(x) })('abc');\n[](#cb40-2)\n[](#cb40-3)//\
  \ 输出:\n[](#cb40-4)// 'abc'\n```\n\n在这段代码中：\n\n1.  我们首先通过一个函数表达式创建一个函数：\n    ```\n\
  \    [](#cb41-1)function (x) { console.log(x) }\n    ```\n2.  然后我们调用该函数：`('abc')`\n\
  \n(1) 中所示代码片段之所以被解释为表达式，是因为我们将其包裹在了括号中。如果我们不这样做，就会得到语法错误，因为此时 JavaScript 期望一个函数声明并对缺少函数名报错。此外，你不能在函数声明后紧跟一个函数调用。\n\
  \n在书的后面，我们将看到更多由语法歧义引起的陷阱：\n\n*   通过对象解构进行赋值\n*   从箭头函数返回对象字面量\n\n### 8.6 分号\n\n\
  ### 8.6.1 分号的经验法则\n\n每条语句都以分号结束：\n\n```\n[](#cb42-1)const x = 3;\n[](#cb42-2)someFunction('abc');\n\
  [](#cb42-3)i++;\n```\n\n但以代码块结尾的语句除外：\n\n```\n[](#cb43-1)function foo() {\n[](#cb43-2)\
  \  // ···\n[](#cb43-3)}\n[](#cb43-4)if (y > 0) {\n[](#cb43-5)  // ···\n[](#cb43-6)}\n\
  ```\n\n以下情况稍显复杂：\n\n```\n[](#cb44-1)const func = () => {}; // 有分号！\n```\n\n整个 `const`\
  \ 声明（一条语句）以分号结束，但在它内部有一个箭头函数表达式。也就是说，以大括号结尾的并不是语句本身，而是嵌入的箭头函数表达式。这就是为什么结尾有一个分号的原因。\n\
  \n### 8.6.2 分号：控制语句\n\n控制语句的主体本身也是语句。例如，这是 `while` 循环的语法：\n\n```\n[](#cb45-1)while\
  \ (condition)\n[](#cb45-2)  statement\n```\n\n主体可以是一个单一语句：\n\n```\n[](#cb46-1)while\
  \ (a > 0) a--;\n```\n\n但代码块也是语句，因此也是控制语句的合法的主体：\n\n```\n[](#cb47-1)while (a > 0)\
  \ {\n[](#cb47-2)  a--;\n[](#cb47-3)}\n```\n\n如果你想让循环有一个空主体，你的第一个选择是空语句（只是一个分号）：\n\
  \n```\n[](#cb48-1)while (processNextItem() > 0);\n```\n\n你的第二个选择是空代码块：\n\n```\n\
  [](#cb49-1)while (processNextItem() > 0) {}\n```\n\n### 8.7 自动分号插入 (ASI)\n\n虽然我建议始终写分号，但在\
  \ JavaScript 中，大多数分号都是可选的。使这成为可能的机制被称为 `自动分号插入` (ASI)。在某种程度上，它纠正了语法错误。\n\nASI 的工作如下。对语句的解析继续，直到遇到以下情况之一：\n\
  \n*   一个分号\n*   行终止符后跟着非法标记\n\n换句话说，ASI 可以视为在换行处插入分号。接下来的章节将介绍 ASI 的陷阱。\n\n### 8.7.1\
  \ 意外触发的 ASI\n\n关于 ASI 的好消息是——如果你不依赖它并始终写分号——那么你只需要注意一个陷阱。那就是 JavaScript 禁止在某些标记后换行。如果你确实插入了换行，分号也会被插入。\n\
  \n这种情况下最具有实际意义的标记是 `return`。考虑以下代码：\n\n```\n[](#cb50-1)return\n[](#cb50-2){\n[](#cb50-3)\
  \  first: 'jane'\n[](#cb50-4)};\n```\n\n这段代码被解析为：\n\n```\n[](#cb51-1)return;\n[](#cb51-2){\n\
  [](#cb51-3)  first: 'jane';\n[](#cb51-4)}\n[](#cb51-5);\n```\n\n即：\n\n*   不带操作数的返回语句：`return;`\n\
  *   代码块的开始：`{`\n*   带有标签 `first:` 的表达式语句 `'jane';`\n*   代码块的结束：`}`\n*   空语句：`;`\n\
  \nJavaScript 为什么要这样做？它是为了防止在 `return` 之后的行中意外地返回一个值。\n\n### 8.7.2 意外未触发的 ASI\n\n\
  在某些情况下，当你认为 ASI 应该触发时，它却*没有*触发。这让不喜欢分号的人的生活变得更加复杂，因为他们需要注意这些情况。以下是三个例子。还有更多。\n\n\
  **示例 1：** 意外的函数调用。\n\n```\n[](#cb52-1)a = b + c\n[](#cb52-2)(d + e).print()\n```\n\
  \n解析为：\n\n```\n[](#cb53-1)a = b + c(d + e).print();\n```\n\n**示例 2：** 意外的除法。\n\n\
  ```\n[](#cb54-1)a = b\n[](#cb54-2)/hi/g.exec(c).map(d)\n```\n\n解析为：\n\n```\n[](#cb55-1)a\
  \ = b / hi / g.exec(c).map(d);\n```\n\n**示例 3：** 意外的属性访问。\n\n```\n[](#cb56-1)someFunction()\n\
  [](#cb56-2)['ul', 'ol'].map(x => x + x)\n```\n\n执行方式为：\n\n```\n[](#cb57-1)const\
  \ propKey = ('ul','ol'); // 逗号运算符\n[](#cb57-2)assert.equal(propKey, 'ol');\n[](#cb57-3)\n\
  [](#cb57-4)someFunction()[propKey].map(x => x + x);\n```\n\n### 8.8 分号：最佳实践\n\n\
  我建议你始终写分号：\n\n*   我喜欢它给代码带来的视觉结构——你可以清楚地看到语句何时结束。\n*   需要记住的规则更少。\n*   大多数 JavaScript\
  \ 程序员都使用分号。\n\n然而，也有人不喜欢分号带来的视觉杂乱。如果你也是之一：不写分号的代码*是*合法的。我建议你使用工具来帮助避免错误。\n\n*  \
  \ 自动代码格式化工具 [Prettier](https://prettier.io/) 可以配置为不使用分号。例如，如果它遇到以括号开头的行，会在前面加上分号。\n\
  *   静态检查工具 [ESLint](https://eslint.org/) 有一条规则](https://eslint.org/docs/rules/semi)\
  \ 可以告诉你偏好的风格（始终使用分号或尽可能少的分号），并警告你关键问题。\n\n## 8.9 严格模式与松散模式\n\n从 ECMAScript 5 开始，JavaScript\
  \ 有两种执行模式：\n\n*   普通的“松散模式”是脚本的默认模式（模块的前身，受浏览器支持）。\n*   严格模式是模块和类的默认模式，可以在脚本中开启（方法稍后介绍）。在这种模式下，松散模式的许多陷阱被消除，并且会抛出更多异常。\n\
  \n现代 JavaScript 代码中很少遇到松散模式，它们大多位于模块。在书中，我假设始终开启严格模式。\n\n### 8.9.1 开启严格模式\n\n在脚本文件和\
  \ CommonJS 模块中，你可以通过在第一行放置以下代码开启整个文件的严格模式：\n\n```\n[](#cb58-1)'use strict';\n```\n\
  \n这个“指令”的巧妙之处在于，早期的 ECMAScript 版本会直接忽略它：它是一个无所事事的表达式语句。\n\n\n\n\n```javascript\n\
  function sloppyFunc() {\n  undeclaredVar1 = 123;\n}\nsloppyFunc();\n// 创建全局变量 `undeclaredVar1`:\n\
  assert.equal(undeclaredVar1, 123);\n```\n\n严格模式表现更好，并会抛出一个 `ReferenceError`。这使得更容易检测拼写错误。\n\
  \n```javascript\nfunction strictFunc() {\n  'use strict';\n  undeclaredVar2 = 123;\n\
  }\nassert.throws(\n  () => strictFunc(),\n  {\n    name: 'ReferenceError',\n   \
  \ message: 'undeclaredVar2 is not defined',\n  });\n```\n\n`assert.throws()` 方法表示它的第一个参数（一个函数）在调用时会抛出一个\
  \ `ReferenceError`。\n\n### 8.9.2.2 函数声明在严格模式下是块作用域，在宽松模式下是函数作用域\n\n在严格模式下，通过函数声明创建的变量仅存在于最内层的嵌套块中：\n\
  \n```javascript\nfunction strictFunc() {\n  'use strict';\n  {\n    function foo()\
  \ { return 123 }\n  }\n  return foo(); // ReferenceError\n}\nassert.throws(\n  ()\
  \ => strictFunc(),\n  {\n    name: 'ReferenceError',\n    message: 'foo is not defined',\n\
  \  });\n```\n\n在宽松模式下，函数声明是函数作用域的：\n\n```javascript\nfunction sloppyFunc() {\n \
  \ {\n    function foo() { return 123 }\n  }\n  return foo(); // 正常\n}\nassert.equal(sloppyFunc(),\
  \ 123);\n```\n\n### 8.9.2.3 宽松模式在更改不可变数据时不抛出异常\n\n在严格模式下，如果你尝试更改不可变数据，会得到一个异常：\n\
  \n```javascript\nfunction strictFunc() {\n  'use strict';\n  true.prop = 1; // TypeError\n\
  }\nassert.throws(\n  () => strictFunc(),\n  {\n    name: 'TypeError',\n    message:\
  \ \"Cannot create property 'prop' on boolean 'true'\",\n  });\n```\n\n在宽松模式下，赋值将失败：\n\
  \n```javascript\nfunction sloppyFunc() {\n  true.prop = 1; // 静默失败\n  return true.prop;\n\
  }\nassert.equal(sloppyFunc(), undefined);\n```\n\n**进阅读：宽松模式** 欲了解更多关于宽松模式与严格模式差异的信息，请参阅\
  \ [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Strict_mode)。\n\n\
  **测试：高级** 请参阅 [quiz]。\n\n# 9 控制台：交互式 JavaScript 行\n\n## 9.1 尝试运行 JavaScript 代码\n\
  \n你有许多选项可以快速运行 JavaScript 代码段。下面的小节描述了其中一些。\n\n### 9.1.1 浏览器控制台\n\nWeb 浏览器有所谓的 `consoles`：交互式命令行，你可以通过\
  \ `console.log()` 向其打印文本，并在其中运行代码段。打开控制台的方法因浏览器而异。图 3 显示了 Google Chrome 的控制台。\n\n\
  要查找如何在你的 浏览器中打开控制台，可以搜索“console-of-your-browser”。以下是常用 Web 浏览器的页面：\n\n*   [Apple\
  \ Safari](https://developer.apple.com/safari/tools/)\n*   [Google Chrome](https://developers.google.com/web/tools/chrome-devtools/console/)\n\
  *   [Microsoft Edge](https://docs.microsoft.com/en-us/microsoft-edge/devtools-guide/console)\n\
  *   [Mozilla Firefox](https://developer.mozilla.org/en-US/docs/Tools/Web_Console/Opening_the_Web_Console)\n\
  \n图 3：在访问网页时打开了浏览器“Google Chrome”的控制台（在窗口下半部分）。\n\n### 9.1.2 Node.js REPL\n\n`REPL`\
  \ 代表 `read-eval-print loop`（读取-评估-打印循环），基本上意味着 `命令行`。要使用它，你必须首先通过操作系统命令行使用 `node`\
  \ 命令启动 Node.js。然后与其交互的情况如图 4 所示：`>` 之后的文本是用户的输入；其他所有内容都是 Node.js 的输出。\n\n图 4：启动和使用\
  \ Node.js REPL（交互式命令行）。\n\n**阅读：REPL 交互** 我偶尔会通过 REPL 交互演示 JavaScript。那时我也使用大于符号（`>`）来标记输入——例如：\n\
  \n```\n> 3 + 5\n8\n```\n\n### 9.1.3 其他选项\n\n其他选项包括：\n\n*   有很多 Web 应用允许你在 浏览器中实验\
  \ JavaScript——例如，[Babel 的 REPL](https://babeljs.io/repl)。\n*   还有用于运行 JavaScript\
  \ 的原生应用和 IDE 插件。\n\n**控制台通常在非严格模式下运行** 在现代 JavaScript 中，大多数代码（例如模块）都在严格模式下执行。然而，控制台通常在非严格模式下运行。因此当你使用控制台执行本书中的代码时，偶尔可能会得到略不同的结果。\n\
  \n### 9.2 `console.*` API：打印数据及更多\n\n在本章中，我们只查看以下打印方法（“打印”意味着在控制台中显示）：\n\n*   `console.log()`\n\
  *   `console.error()`\n\n### 9.2.1 打印值：`console.log()` (stdout)\n\n该操作有两种变体：\n\n\
  ```javascript\nconsole.log(...values: any[]): void\nconsole.log(pattern: string,\
  \ ...values: any[]): void\n```\n\n#### 9.2.1.1 打印多个值\n\n第一种变体在控制台上打印值的表示：\n\n```javascript\n\
  console.log('abc', 123, true);\n// 输出: abc 123 true\n```\n\n在最后，`console.log()`\
  \ 总是打印一个换行符。因此，如果你带零参数调用它，它只会打印换行符。\n\n#### 9.2.1.2 打印带有替换的字符串\n\n第二种变体执行字符串替换：\n\
  \n```javascript\nconsole.log('Test: %s %j', 123, 'abc');\n// 输出: Test: 123 \"abc\"\
  \n```\n\n这些是你可以用于替换的一些指令：\n\n*   `%s` 将相应的值转换为字符串并插入其中。\n    ```javascript\n   \
  \ console.log('%s %s', 'abc', 123);\n    // 输出: abc 123\n    ```\n*   `%o` 插入对象的字符串表示。\n\
  \    ```javascript\n    console.log('%o', {foo: 123, bar: 'abc'});\n    // 输出: {\
  \ foo: 123, bar: 'abc' }\n    ```\n*   `%j` 将值转换为 JSON 字符串并插入其中。\n    ```javascript\n\
  \    console.log('%j', {foo: 123, bar: 'abc'});\n    // 输出: {\"foo\":123,\"bar\"\
  :\"abc\"}\n    ```\n*   `%%` 插入单个 `%`。\n\n\n\n\n\n```\nconsole.log('%s%%', 99);\n\
  // Output:\n// 99%\n```\n\n### 9.2.2 打印错误信息：`console.error()` (stderr)\n\n`console.error()`\
  \ 的用法与 `console.log()` 相同，但它记录的内容被视为错误信息。对于 Node.js 来说，这意味着在 Unix 上输出将到 `stderr`\
  \ 而不是 `stdout`。\n\n### 9.2.3 通过 `JSON.stringify()` 打印嵌套对象\n\n`JSON.stringify()`\
  \ 有时对于打印嵌套对象非常有用：\n\n```\nconsole.log(JSON.stringify({first: 'Jane', last: 'Doe'},\
  \ null, 2));\n```\n\n输出：\n\n```\n{\n  \"first\": \"Jane\",\n  \"last\": \"Doe\"\n\
  }\n```\n\n# 10 断言 API\n\n* * *\n\n* 10.1 软件开发中的断言\n* 10.2 断言在本书是如何使用的\n    * 10.2.1\
  \ 通过断言在代码示例中记录结果\n    * 10.2.2 通过断言实现测试驱动的练习\n* 10.3 普通比较 vs. 深度比较\n* 10.4 快速参考：module\
  \ `assert` 模块\n    * 10.4.1 普通相等性\n    * 10.4.2 深度相等性\n    * 10.4.3 预期异常\n    *\
  \ 10.4.4 另一个工具函数\n\n* * *\n\n### 10.1 软件开发中的断言\n\n在软件开发中，断言是指关于值或代码段必须为真的陈述。如果它们不是真的，则会抛出异常。Node.js\
  \ 通过其内置模块 `assert` 支持断言——例如：\n\n```\nimport {strict as assert} from 'assert';\n\
  assert.equal(3 + 5, 8);\n```\n\n该断言表示 3 加 5 的预期结果是 8。该导入语句使用了推荐的 `strict` 版本的 `assert`。\n\
  \n## 10.2 断言在本书是如何使用的\n\n在本书中，断言有两种使用方式：在代码示例中记录结果，以及实现测试驱动的练习。\n\n### 10.2.1 通过断言在代码示例中记录结果\n\
  \n在代码示例中，断言表达了预期的结果。例如，以下函数：\n\n```\nfunction id(x) {\n  return x;\n}\n```\n\n`id()`\
  \ 返回它的参数。我们可以通过断言展示它的运行情况：\n\n```\nassert.equal(id('abc'), 'abc');\n```\n\n在示例中，我通常省略了导入\
  \ `assert` 的语句。\n\n使用断言的动机是：\n\n* 你可以精确地指定预期结果。\n* 代码示例可以自动测试，这确保了它们确实有效。\n\n###\
  \ 10.2.2 通过断言实现测试驱动的练习\n\n本书的练习是测试驱动的，通过测试框架 AVA 实现。测试内部的检查通过 `assert` 方法进行。\n\n\
  以下是此类测试的示例：\n\n```\n// 对于该练习，你必须实现 hello() 函数。\n// 测试检查你是否正确完成。\ntest('First exercise',\
  \ t => {\n  assert.equal(hello('world'), 'Hello world!');\n  assert.equal(hello('Jane'),\
  \ 'Hello Jane!');\n  assert.equal(hello('John'), 'Hello John!');\n  assert.equal(hello(''),\
  \ 'Hello !');\n});\n```\n\n更多信息请参阅第 11 章“开始测验与练习”。\n\n## 10.3 普通比较 vs. 深度比较\n\n\
  严格的 `equal()` 使用 `===` 来比较值。因此，一个对象只等于它本身——即使对象具有相同的内容（因为 `===` 不比较对象的内容，只比较它们的标识性）：\n\
  \n```\nassert.notEqual({foo: 1}, {foo: 1});\n```\n\n`deepEqual()` 是比较对象的更好选择：\n\n\
  ```\nassert.deepEqual({foo: 1}, {foo: 1});\n```\n\n该方法也适用于数组：\n\n```\nassert.notEqual(['a',\
  \ 'b', 'c'], ['a', 'b', 'c']);\nassert.deepEqual(['a', 'b', 'c'], ['a', 'b', 'c']);\n\
  ```\n\n## 10.4 快速参考：module `assert` 模块\n\n完整文档请参见[Node.js 文档](https://nodejs.org/api/assert.html)。\n\
  \n### 10.4.1 普通相等性\n\n* `function equal(actual: any, expected: any, message?: string):\
  \ void`\n\n    `actual === expected` 必须为 `true`。如果不是，则会抛出 `AssertionError`。\n\n\
  \    ```\n    assert.equal(3+3, 6);\n    ```\n\n* `function notEqual(actual: any,\
  \ expected: any, message?: string): void`\n\n    `actual !== expected` 必须为 `true`。如果不是，则会抛出\
  \ `AssertionError`。\n\n    ```\n    assert.notEqual(3+3, 22);\n    ```\n\n可选的最后一个参数\
  \ `message` 可用于解释断言的含义。如果断言失败，该消息将用于设置所抛出的 `AssertionError`。\n\n```\nlet e;\ntry\
  \ {\n  const x = 3;\n  assert.equal(x, 8, 'x must be equal to 8')\n} catch (err)\
  \ {\n  assert.equal(x, 8)\n}\n```\n\n### 10.4.2 深度相等性\n\n* `function deepEqual(actual:\
  \ any, expected: any, message?: string): void`\n\n    `actual === expected` 必须为\
  \ `true`。如果不是，则会抛出 `AssertionError`。\n\n    ```\n    assert.equal(3+3, 6);\n   \
  \ ```\n\n* `function notEqual(actual: any, expected: any, message?: string): void`\n\
  \n    `actual !== expected` 必须为 `true`。如果不是，则会抛出 `AssertionError`。\n\n    ```\n\
  \    assert.notEqual(3+3, 22);\n    ```\n\n可选的最后一个参数 `message` 可用于解释断言的含义。如果断言失败，该消息将用于设置所抛出的\
  \ `AssertionError`。\n\n```\nlet e;\ntry {\n  const x = 3;\n  assert.equal(x, 8,\
  \ 'x must be equal to 8')\n} catch (err) {\n  assert.equal(x, 8)\n}\n```\n\n###\
  \ 10.4.3 预期异常\n\n如果你想（或预期）接收异常，则需要 `throws()`：此函数调用其第一个参数 `block`，并且只有在它抛出异常时才成功。可以使用额外的参数来指定异常的内容。\n\
  \n* `function throws(block: Function, message?: string): void`\n\n    ```\n    assert.throws(\n\
  \      () => {\n        null.prop;\n      },\n      TypeError);\n    ```\n\n* `function\
  \ throws(block: Function, error: Function, message?: string): void`\n\n    ```\n\
  \    assert.throws(\n      () => {\n        null.prop;\n      },\n      /^TypeError:\
  \ Cannot read property 'prop'$/);\n    ```\n\n* `function throws(block: Function,\
  \ error: Object, message?: string): void`\n\n    ```\n    assert.throws(\n     \
  \ () => {\n        null.prop;\n      },\n      {\n        name: 'TypeError',\n \
  \       message: `Cannot read property 'prop' of null`,\n      }\n    );\n    ```\n\
  \n### 10.4.4 另一个工具函数\n\n* `function fail(message: string | Error): never`\n\n  \
  \  调用时始终抛出 `AssertionError`。这在单元测试中偶尔有用。\n\n    ```\n    try {\n      functionThatShouldThrow();\n\
  \      assert.fail();\n    } catch (_) {\n      // Success\n    }\n    ```\n\n\n\
  \n\n\n### 11.1 测验\n### 11.2 练习\n### 11.2.1 安装练习\n### 11.2.2 运行练习\n### 11.3 JavaScript\
  \ 中的单元测试\n### 11.3.1 一个典型的测试\n### 11.3.2 AVA 中的异步测试\n\n在大多数章节中，都包含了测验和练习。这是一项付费功能，但提供了全面的预览。本章将解释如何开始使用它们。\n\
