  \n### 16.3.2 用用例：是否提供了参数？\n\n### 16.3.3 用用例：属性是否存在？\n\n## 16.4 条件元运算符 (`? :`)\n\n\
  ### 16.5 二元逻辑运算符：与 (`x && y`)、或 (`x || y`)\n\n### 16.5.1 逻辑与 (`x && y`)\n\n### 16.5.2\
  \ 逻辑或 (`||`)\n\n### 16.5.3 通过逻辑或 (`||`) 设置默认值\n\n### 16.6 逻辑非 (`!`)\n\n***\n\n原始布尔类型\
  \ `boolean` 包含两个值——`false` 和 `true`：\n\n```\n> typeof false\n'boolean'\n> typeof\
  \ true\n'boolean'\n```\n\n### 16.1 转换为布尔值\n\n![](img/file5.svg) **“转换为 [type]”的含义**\n\
  \n“转换为 [type]”是“将任意值转换为类型 [type]的值”的简写。\n\n以下是你可以将任意值 `x` 转换为布尔的三种方法：\n\n*   `Boolean(x)`\n\
  \n    最具描述性；推荐使用。\n\n*   `x ? true : false`\n\n    使用条件运算符（在本章后面 中解释）。\n\n*   `!!x`\n\
  \n    使用了逻辑非运算符 (`!`)。该运算符将其操作数强制转换为布尔值。再次应用一次以获得非取反的结果。\n\n表 4 描述了各种值如何转换为布尔值。\n\
  \n表 4：将值转换为布尔值。\n\n| `x` | `Boolean(x)` |\n| --- | --- |\n| `undefined` | `false`\
  \ |\n| `null` | `false` |\n| 布尔值 | `x` (无变化) |\n| 数字值 | `0` → `false`, `NaN` → `false`\
  \ |\n| | 其他数字 → `true` |\n| 字符串值 | `''` → `false` |\n| | 其他字符串 → `true` |\n| 对象值\
  \ | 始终为 `true` |\n\n## 16.2 假值和真值\n\n在检查 `if` 语句、`while` 循环或 `do-while` 循环的条件时，JavaScript\
  \ 的机制与你预期的不同。例如，以下条件：\n\n```\nif (value) {}\n```\n\n在许多编程语言中，该条件等于：\n\n```\nif (value\
  \ === true) {}\n```\n\n然而，在 JavaScript 中，它等于：\n\n```\nif (Boolean(value) === true)\
  \ {}\n```\n\n也就是说，JavaScript 会检查 `value` 在转换为布尔时是否为 `true`。这种检查非常常见，因此引入了以下名称：\n\
  \n*   如果一个值转换为布尔值时为 `true`，则称为*真值 (truthy)*。\n*   如果一个值转换为布尔值时为 `false`，则称为*假值 (falsy)*。\n\
  \n每个值要么是真值要么是假值。参考表 4，我们可以列出详细的假值列表：\n\n*   `undefined`, `null`\n*   `false`\n*\
  \   `0`, `NaN`\n*   `''`\n\n所有其他值（包括所有对象）都是真值：\n\n```\n> Boolean('abc')\ntrue\n\
  > Boolean([])\ntrue\n> Boolean({})\ntrue\n```\n\n### 16.2.1 检查真值或假值性\n\n```\nif\
  \ (x) {\n  // x 是真值\n}\n\nif (!x) {\n  // x 是假值\n}\n\nif (x) {\n  // x 是真值\n} else\
  \ {\n  // x 是假值\n}\n\nconst result = x ? 'truthy' : 'falsy';\n```\n\n最后一行使用的条件运算符在本章后面\
  \ 中解释。\n\n![](img/file6.svg) **练习题：真值**\n\n`exercises/booleans/truthiness_exrc.mjs`\n\
  \n## 16.3 基于真值的存在检查\n\n在 JavaScript 中，如果你读取一个不存在的内容（例如缺失的参数或属性），你通常会得到结果 `undefined`。\n\
  \n基于真值的存在检查是不精确的。\n\n```javascript\nif (obj.prop !== undefined) {\n```\n\n### 16.3.1\
  \ 陷阱：基于真值的存在检查不精确\n\n基于真值的存在检查是不精确的。考虑以下情况：\n\n```\nif (x) {\n  // x 是真值\n} else\
  \ {\n  // x 是假值\n}\n```\n\n### 16.3.2 用用例：是否提供了参数？\n\n基于真值的存在检查是不精确的。考虑以下情况：\n\n\
  ```\nif (x) {\n  // x 是真值\n} else {\n  // x 是假值\n}\n```\n\n### 16.3.3 用用例：属性是否存在？\n\
  \n存在检查是不精确的。考虑以下情况：\n\n```\nif (x) {\n  // x 是真值\n} else {\n  // x 是假值\n}\n```\n\
  \n\n\n\n\n`Short-circuiting` 意味着意味着如果第一个操作数已经决定了结果，那么第二个操作数就不会被求值。另一个延迟评估操作数的运算符是条件运算符。通常，所有操作数在执行操作之前都会求值。\n\
  \n例如，逻辑与 (`&&`) 如果第一个操作数为虚假（falsy），则不会求值第二个操作数：\n\n```\nconst x = false && console.log('hello');\n\
  // 无输出\n```\n\n如果第一个操作数为真（truthy），则执行 `console.log()`：\n\n```javascript\nconst x\
  \ = true && console.log('hello');\n// 输出:\n// 'hello'\n```\n\n### 16.5.1 逻辑与 (`x\
  \ && y`)\n\n表达式 `a && b`（`a` 与 `b`）的求值如下：\n\n1. 求值 `a`。\n2. 结果为假吗？如果是，返回它。\n3. 否则，求值\
  \ `b` 并返回结果。\n\n也就是说，以下两个表达式大致等价：\n\n```\na && b\n!a ? a : b\n```\n\n示例：\n\n```\n\
  > false && true\nfalse\n> false && 'abc'\nfalse\n\n> true && false\nfalse\n> true\
  \ && 'abc'\n'abc'\n\n> '' && 'abc'\n''\n```\n\n### 16.5.2 逻辑或 (`||`)\n\n表达式 `a ||\
  \ b`（`a` 或 `b`）的求值如下：\n\n1. 求值 `a`。\n2. 结果为真吗？如果是，返回它。\n3. 否则，求值 `b` 并返回结果。\n\n\
  也就是说，以下两个表达式大致等价：\n\n```\na || b\na ? a : b\n```\n\n示例：\n\n```\n> true || false\n\
  true\n> true || 'abc'\ntrue\n\n> false || true\ntrue\n> false || 'abc'\n'abc'\n\n\
  > 'abc' || 'def'\n'abc'\n```\n\n### 16.5.3 通过逻辑或 (`||`) 使用默认值\n\n有时你会接收一个值，并且只想在它既不是\
  \ `null` 也不是 `undefined` 时才使用它。否则，你想使用一个默认值作为回备方案。你可以通过 `||` 运算符实现这一点：\n\n```javascript\n\
  const valueToUse = valueReceived || defaultValue;\n```\n\n以下代码展示了一个真实世界的示例：\n\n\
  ```javascript\nfunction countMatches(regex, str) {\n  const matchResult = str.match(regex);\
  \ // null 或 Array\n  return (matchResult || []).length;\n}\n```\n\n如果 `regex` 在\
  \ `str` 内部有一个或多个匹配项，`.match()` 会返回一个数组。如果没有匹配项，遗憾的是它返回 `null`（而不是空数组）。我们通过 `||`\
  \ 运算符修复了这个问题。\n\n**练习：通过或运算符 (`||`) 使用默认值**\n\n`exercises/booleans/default_via_or_exrc.mjs`\n\
  \n## 16.6 逻辑非 (`!`)\n\n表达式 `!x`（非 `x`）的求值如下：\n\n1. 求值 `x`。\n2. 它是真吗？如果是，返回 `false`。\n\
  3. 否则，返回 `true`。\n\n示例：\n\n```\n> !false\ntrue\n> !true\nfalse\n\n> !0\ntrue\n>\
  \ !123\nfalse\n\n> !''\ntrue\n> !'abc'\nfalse\n```\n\n**测验**\n\n查看测试应用。\n\n# 17 数字\n\
