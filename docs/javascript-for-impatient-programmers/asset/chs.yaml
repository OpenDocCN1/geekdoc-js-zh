  \n# 32 类型数组：处理二进制数据（进阶）\n\n* * *\n\n*   32.1 API 基础\n    *   32.1.1 类型数组用场景\n  \
  \  *   32.1.2 核心类：`ArrayBuffer`, 类型数组, `DataView`\n    *   32.1.3 使用类型数组\n    *\
  \   32.1.4 使用 DataView\n*   32.2 元素类型\n    *   32.2.1 处理溢出和下溢\n    *   32.2.2 字节序\n\
  *   32.3 关于类型数组的更多信息\n*   32.3.1 静态方法 `«ElementType»Array.from()``\n    *   32.3.2\
  \ 类型数组是可迭代的\n    *   32.3.3 类型数组与普通数组\n    *   32.3.4 类型数组转换为普通数组及反之\n    *   32.3.5\
  \ 合并类型数组\n*   32.4 快速参考：索引 vs 偏移\n*   32.5 快速参考：ArrayBuffers\n    *   32.5.1 `new\
  \ ArrayBuffer()`\n    *   32.5.2 `ArrayBuffer` 的静态方法\n    *   32.5.3 `ArrayBuffer.prototype`\
  \ 的属性\n*   32.6 快速参考：类型数组\n    *   32.6.1 `TypedArray<T>` 的静态方法\n    *   32.6.2\
  \ `TypedArray<T>.prototype` 的属性\n    *   32.6.3 `new «ElementType»Array()`\n   \
  \ *   32.6.4 `«ElementType»Array` 的静态属性\n    *   32.6.5 `«ElementType»Array.prototype`\
  \ 的属性\n*   32.7 快速参考：DataViews\n    *   32.7.1 `new DataView()`\n    *   32.7.2\
  \ `DataView.prototype` 的属性\n\n### 32.1 API 基础\n\n网络上的许多数据是二进制的。在 2011 年之前，JavaScript\
  \ 并不能很好地处理二进制数据。随着 ECMAScript 6，语言引入了类型数组来处理二进制数据。\n\n### 32.1.1 类型数组用场景\n\n类型数组的主要用途是：\n\
  \n*   处理二进制数据：`ArrayBuffer`、`DataView` 等。\n*   与原生 API 交互：WebGL、`Canvas` 等。\n* \
  \  在网络协议、图像文件和文件格式中处理二进制数据。\n\n### 32.1.2 核心类：`ArrayBuffer`, 类型数组, `DataView`\n\n\
  `ArrayBuffer` 是一个固定长度的原始二进制数据缓冲区。你不能直接访问或操作其内容；你必须使用视图（类型数组或 `DataView`）。\n\n类型数组为在\
  \ `ArrayBuffer` 中读取和写入二进制数据提供了底层接口。每种类型数组（例如 `Uint8Array`、`Int16Array`、`Float32Array`）定义了元素的大小和类型。\n\
  \n### 32.1.3 使用类型数组\n\n类型数组的使用与普通数组相似，但几点不同：\n\n*   它们将数据存储在 `ArrayBuffers` 中。\n\
  *   所有元素都初始化为零。\n*   所有元素具有相同的类型。向类型数组写入值会将其强制转换为该类型。读取值则产生普通的数字。\n*   类型数组的长度是不可变的；它无法更改。\n\
  \nDataViews 允许你解释 `ArrayBuffer` 中的字节。例如，`DataView` 可以根据所使用的方法，将相同的字节作为 8 位整数或 32\
  \ 位浮点数读取。\n\n\n\n\n\n```javascript\nconst typedArray = new Int16Array(2);\nassert.equal(typedArray[1],\
  \ 0); // initialized with 0\ntypedArray[1] = 72;\nassert.equal(typedArray[1], 72);\n\
  ```\n\n### 32.1.4 使用 DataViews\n\n`DataViews` 的使用方式如下：\n\n```javascript\nconst dataView\
  \ = new DataView(new ArrayBuffer(4));\nassert.equal(dataView.getInt16(0), 0);\n\
  assert.equal(dataView.getUint8(0), 0);\ndataView.setUint8(0, 5);\n```\n\n## 32.2\
  \ 类型\n\n表 19：Typed Array API 支持的元素类型。\n\n| 元素 | Typed Array | 字节 | 描述 | |\n| ---\
  \ | --- | --- | --- | --- |\n| `Int8` | `Int8Array` | 1 | 8 位有符号整数 | ES6 |\n| `Uint8`\
  \ | `Uint8Array` | 1 | 8 位无符号整数 | ES6 |\n| `Uint8C` | `Uint8ClampedArray` | 1 |\
  \ 8 位无符号整数 | ES6 |\n| | | |（限幅转换） | ES6 |\n| `Int16` | `Int16Array` | 2 | 16 位有符号整数\
  \ | ES6 |\n| `Uint16` | `Uint16Array` | 2 | 16 位无符号整数 | ES6 |\n| `Int32` | `Int32Array`\
  \ | 4 | 32 位有符号整数 | ES6 |\n| `Uint32` | `Uint32Array` | 4 | 32 位无符号整数 | ES6 |\n\
  | `Float32` | `Float32Array` | 4 | 32 位浮点数 | ES6 |\n| `Float64` | `Float64Array`\
  \ | 8 | 64 位浮点数 | ES6 |\n\n表 [19] 列出了所有可用的元素类型。这些类型（例如 `Int32`）出现在两个位置：\n\n- 它们是\
  \ Typed Arrays 元素的类型。例如，所有 `Int32Array` 元素的类型都是 `Int32`。元素类型是 Typed Arrays 唯一不同之处。\n\
  - 当你使用 `.getInt32()` 和 `.setInt32()` 等方法时，它们是 `ArrayBuffer` 访问其 `DataView` 的视角。\n\
  \n元素类型 `Uint8C` 是特殊的：`DataView` 不支持它，仅是为了启用 `Uint8ClampedArray`。这种 Typed Array 被\
  \ `canvas` 元素使用（取代了 `CanvasPixelArray`），在其他情况下应避免使用。`Uint8C` 和 `Uint8` 的唯一区别在于溢出和下溢的处理方式（在下一节中解释）。\n\
  \n### 32.2.1 处理溢出和下溢\n\n通常，当值超出元素类型的范围时，会使用取模运算将其转换为范围内的值。对于有符号和无符号整数，这意味着：\n\n\
  - 最大值加 1 将转换为最小值（无符号整数为 0）。\n- 最小值减 1 将转换为最大值。\n\n以下函数有助于说明转换是如何运作的：\n\n```javascript\n\
  function setAndGet(typedArray, value) {\n  typedArray[0] = value;\n  return typedArray[0];\n\
  }\n```\n\n无符号 8 位整数的取模转换：\n\n```javascript\nconst uint8 = new Uint8Array(1);\n//\
  \ 范围最大值\nassert.equal(setAndGet(uint8, 255), 255);\n// 溢出\nassert.equal(setAndGet(uint8,\
  \ 256), 0);\n// 范围最小值\nassert.equal(setAndGet(uint8, 0), 0);\n// 下溢\nassert.equal(setAndGet(uint8,\
  \ -1), 255);\n```\n\n有符号 8 位整数的取模转换：\n\n```javascript\nconst int8 = new Int8Array(1);\n\
  // 范围最大值\nassert.equal(setAndGet(int8, 127), 127);\n// 溢出\nassert.equal(setAndGet(int8,\
  \ 128), -128);\n// 范围最小值\nassert.equal(setAndGet(int8, -128), -128);\n// 下溢\nassert.equal(setAndGet(int8,\
  \ -129), 127);\n```\n\n限幅转换有所不同：\n\n- 所有下溢值都被转换为最小值。\n- 所有溢值都被转换为最大值。\n\n```javascript\n\
  const uint8c = new Uint8ClampedArray(1);\n// 范围最大值\nassert.equal(setAndGet(uint8c,\
  \ 255), 255);\n// 溢出\nassert.equal(setAndGet(uint8c, 256), 255);\n// 范围最小值\nassert.equal(setAndGet(uint8c,\
  \ 0), 0);\n// 下溢\nassert.equal(setAndGet(uint8c, -1), 0);\n```\n\n### 32.2.2 字节序\n\
  \n每当一种类型（如 `Uint16`）被存储为多个字节的序列时，*字节序*（endianness）至关重要：\n\n- 大端序（Big endian）：最高字节在前。例如，`Uint16`\
  \ 值 0x4321 被存储为两个字节——先是 0x43，后是 0x21。\n- 小端序（Little endian）：最低字节在前。例如，`Uint16` 值\
  \ 0x4321 被存储为两个字节——先是 0x21，后是 0x43。\n\n字节序通常取决于 CPU 架构并在原生 API 中保持一致。Typed Arrays\
  \ 用于与这些 API 通信，这就是为什么它们的字节序遵循平台字节序且无法更改。\n\n另一方面，协议和二进制文件的字节序各异，但在跨平台格式中是固定的。因此，我们必须能够以任何字节序访问数据。`DataViews`\
  \ 正适用于这种场景，并允许你在获取或设置值时指定字节序。\n\n引用 Wikipedia 关于字节序的描述：\n\n- 大端序表示是数据网络中最常见的约定；Internet\
  \ 协议族（如 IPv4、IPv6、TCP 和 UDP）协议中的字段是以大端序传输的。由于此原因，大端字节序也被网络字节序。\n- 小端存储在微处理器中很流行，部分原因是英特尔公司对微处理器设计产生了深远的历史影响。\n\
  \n其他排列也是可能的。这些通常被称为*中端序*（middle-endian）或*混合字节序*（mixed-endian）。\n\n## 32.3 关于 Typed\
  \ Arrays 的更多信息\n\n在本节中，`ElementTypeArray` 代表 `Int8Array`、`Uint8Array` 等。`ElementType`\
  \ 代表 `Int8`、`Uint8` 等。\n\n### 32.3.1 静态方法 `ElementTypeArray.from()`\n\n该方法的类型签名为：\n\
  \n```javascript\n.from<S>(\n  source: Iterable<S>|ArrayLike<S>,\n  mapfn?: S =>\
  \ ElementType, thisArg?: any\n): «ElementType»Array\n```\n\n`.from()` 将 `source`\
  \ 转换为 `this` 的实例（一个 Typed Array）。\n\n例如，普通 Array 是可迭代的，可以使用此方法转换：\n\n```javascript\n\
  assert.equal(Uint16Array.from([0, 1, 2]), Uint16Array.of(0, 1, 2));\n```\n\nTyped\
  \ Arrays 也是可迭代的：\n\n```javascript\nassert.equal(Uint16Array.from(Uint8Array.of(0,\
  \ 1, 2)), Uint16Array.of(0, 1, 2));\n```\n\n`source` 也可以是一个*类数组对象*：\n\n```javascript\n\
  assert.equal(Uint16Array.from({0:0, 1:1, 2:2, length: 3}), Uint16Array.of(0, 1,\
  \ 2));\n```\n\n#### 32.3.1.1 陷阱：在 Typed Array 类型之间转换时进行映射\n\n静态方法 `.from()` 可以可选地同时进行映射并在\
  \ Typed Array 类型之间转换。使用该方法时出错的概率较小。\n\n为了了解为什么，让我们先将一个 Typed Array 转换为更高精度的 Typed\
  \ Array。如果我们使用 `.from()` 进行映射，结果将是正确的。否则，你必须先转换再进行映射。\n\n\n\n\n```\nconst typedArray\
  \ = Int8Array.of(127, 126, 125);\nassert.deepEqual(\n  Int16Array.from(typedArray,\
  \ x => x * 2),\n  Int16Array.of(254, 252, 250));\n\nassert.deepEqual(\n  Int16Array.from(typedArray).map(x\
  \ => x * 2),\n  Int16Array.of(254, 252, 250)); // OK\nassert.deepEqual(\n  Int16Array.from(typedArray.map(x\
  \ => x * 2)),\n  Int16Array.of(-2, -4, -6)); // wrong\n```\n\n如果我们将从一个类型数组转换为精度较低的类型数组，通过\
  \ `.from()` 进行映射会产生正确的的结果。否则，我们必须先进行映射然后转换。\n\n```\nassert.deepEqual(\n  Int8Array.from(Int16Array.of(254,\
  \ 252, 250), x => x / 2),\n  Int8Array.of(127, 126, 125));\n\nassert.deepEqual(\n\
  \  Int8Array.from(Int16Array.of(254, 252, 250).map(x => x / 2)),\n  Int8Array.of(127,\
  \ 126, 125)); // OK\nassert.deepEqual(\n  Int8Array.from(Int16Array.of(254, 252,\
  \ 250)).map(x => x / 2),\n  Int8Array.of(-1, -2, -3)); // wrong\n```\n\n问题在于，如果通过\
  \ `.map()` 进行映射，输入类型和输出类型是相同的。相比之下，`.from()` 从任意输入类型转换为你通过其接收者指定的输出类型。\n\n### 32.3.2\
  \ 类型数组是可迭代的\n\n类型数组是可迭代的。这意味着你可以使用 `for-of` 循环和其他基于迭代的机制：\n\n```\nconst ui8 = Uint8Array.of(0,\
  \ 1, 2);\nfor (const byte of ui8) {\n  console.log(byte);\n}\n// 输出:\n// 0\n// 1\n\
  // 2\n```\n\nArrayBuffers 和 DataViews 是不可迭代的。\n\n### 32.3.3 类型数组与普通数组\n\n类型数组与普通数组非常相似：它们有\
  \ `.length` 属性，可以通过中括号运算符 `[]` 访问元素，并且拥有大多数标准数组方法。它们与普通数组在以下方面有所不同：\n\n*   类型数组拥有缓冲区。类型数组\
  \ `ta` 的元素并不存储在 `ta` 中，而是存储在关联的 `ArrayBuffer` 中，可以通过 `ta.buffer` 访问：\n\n    ```\n\
  \    const ta = new Uint16Array(2); // 2 个元素\n    assert.deepEqual(\n      ta.buffer,\
  \ new ArrayBuffer(4)); // 4 字节\n    ```\n\n*   类型数组用零初始化：\n\n    *   `new Array(4)`\
  \ 创建一个没有任何元素的普通数组。它只有四个空位（小于 `.length` 且没有关联元素的索引）。\n    *   `new Uint8Array(4)`\
  \ 创建了一个四个元素均为 0 的类型数组。\n\n    ```\n    assert.deepEqual(new Uint8Array(4), Uint8Array.of(0,\
  \ 0, 0, 0));\n    ```\n\n*   类型数组的所有元素都具有相同的类型：\n\n    *   设置元素会将值转换为该类型。\n\n  \
  \      javascript\n        const ta = new Uint8Array(1);\n        ta[0] = 257;\n\
  \        assert.equal(ta[0], 1); // 257 % 256 (溢出)\n\n        ta[0] = '2';\n   \
  \     assert.equal(ta[0], 2);\n        ```\n\n    *   获取元素返回数字。\n\n        ```javascript\n\
  \        const ta = new Uint8Array(1);\n        assert.equal(ta[0], 0);\n      \
  \  assert.equal(typeof ta[0], 'number');\n        ```\n\n*   类型数组的 `.length` 衍生自其\
  \ `ArrayBuffer` 且永远改变（除非切换到不同的 `ArrayBuffer`）。\n*   普通数组可以有空位；类型数组不能。\n\n### 32.3.4\
  \ 类型数组与普通数组之间的转换\n\n要将普通数组转换为类型数组，你可以将其传递给类型数组构造函数（它接受类数组对象和类型数组）或 `ElementType`Array.from()`（它接受可迭代对象和类数组对象）。例如：\n\
  \n```\nconst ta1 = new Uint8Array([0, 1, 2]);\nconst ta2 = Uint8Array.from([0, 1,\
  \ 2]);\nassert.deepEqual(ta1, ta2);\n```\n\n要将类型数组转换为普通数组，可以使用展开运算符或 `Array.from()`（因为类型数组是可迭代的）：\n\
  \n```\nassert.deepEqual(\n  [...Uint8Array.of(0, 1, 2)], [0, 1, 2] );\nassert.deepEqual(\n\
  \  Array.from(Uint8Array.of(0, 1, 2)), [0, 1, 2] );\n```\n\n### 32.3.5 合并类型数组\n\n\
  类型数组没有像普通数组那样的 `.concat()` 方法。解决办法是使用它们的重载方法 `.set()`：\n\n```\n.set(typedArray:\
  \ TypedArray, offset=0): void\n.set(arrayLike: ArrayLike<number>, offset=0): void\n\
  ```\n\n它将现有的 `typedArray` 或 `arrayLike` 拷贝到接收者中，索引处为 `offset`。`TypedArray` 是所有具体类型数组类的虚拟抽象超类。\n\
  \n以下函数使用该方法将零或多个类型数组（或类数组对象）拷贝到 `resultConstructor` 的实例中：\n\n```javascript\nfunction\
  \ concatenate(resultConstructor, ...arrays) {\n  let totalLength = 0;\n  for (const\
  \ arr of arrays) {\n    totalLength += arr.length;\n  }\n  const result = new resultConstructor(totalLength);\n\
  \  let offset = 0;\n  for (const arr of arrays) {\n    result.set(arr, offset);\n\
  \    offset += arr.length;\n  }\n  return result;\n}\n```\n\n\n\n\n如果 `arg` 是一个对象且是\
  \ `ArrayBuffer` 的 `view`（即如果它是一个 `Typed Array` 或 `DataView`），则返回 `true`。\n\n###\
  \ 32.5.3 `ArrayBuffer.prototype` 的属性\n\n*   `get .byteLength(): number`\n\n    返回此\
  \ `ArrayBuffer` 以字节为单位的容量。\n\n*   `.slice(startIndex: number, endIndex=this.byteLength)`\n\
  \n创建一个一个新的 `ArrayBuffer`，其中包含此 `ArrayBuffer` 中索引大于或等于 `startIndex` 且小于 `endIndex`\
  \ 的字节。`start` 和 `endIndex` 可以为负数（请参见 §32.4 “快速引用：索引与偏移量`）。\n\n## 32.6 快速引用：类型数组\
  \ (Typed Arrays)\n\n各种 Typed Array 对象的属性分两个步骤介绍：\n\n1.  `TypedArray`：首先，我们查看所有 Typed\
  \ Array 类的抽象超类（这已在本章节开始的类图所示）。我将该超类称为 `TypedArray`，但无法从 JavaScript 直接访问它。`TypedArray.prototype`\
  \ 包含了所有 Typed Array 的方法。\n\n2.  `«ElementType»Array`：具体的 Typed Array 类被称为 `Uint8Array`、`Int16Array`、`Float32Array`\
  \ 等。这些是你通过 `new`、`.of` 和 `.from()` 使用的类。\n\n### 32.6.1 `TypedArray<T>` 的静态方法\n\n\
  两个静态 `TypedArray` 方法都由其子类（`Uint8Array` 等）继承。`TypedArray` 是抽象的。因此，你始终通过子类使用这些方法，因为子类是具体的并且可以拥有直接实例。\n\
  \n*   `.from<S>(source: Iterable<S>|ArrayLike<S>, mapfn?: S => T, thisArg?: any)\
  \ : instanceof this`\n\n    将可迭代对象（包括数组和类型数组）或类数组对象转换为 `this` 的实例（`instanceof this`\
  \ 是我为了表达这一事实而发明的说法）。\n\n```\n    assert.deepEqual(\n      Uint16Array.from([0, 1,\
  \ 2]),\n      Uint16Array.of(0, 1, 2));\n    ```\n\n    可选的 `mapfn` 允许你在 `source`\
  \ 的元素成为结果元素之前对其进行转换。\n\n    ```\n    assert.deepEqual(\n      Int16Array.from(Int8Array.of(127,\
  \ 126, 125), x => x * 2),\n      Int16Array.of(254, 252, 250));\n    ```\n\n*  \
  \ `.of(...items: number[]): instanceof this`\n\n    创建一个 `this` 的新实例，其元素为 `items`（被强制转换为元素类型）。\n\
  \n    ```\n    assert.deepEqual(\n      Int16Array.of(-1234, 5, 67),\n      new\
  \ Int16Array([-1234, 5, 67]) );\n    ```\n\n### 32.6.2 `TypedArray<T>.prototype`\
  \ 的属性\n\nTyped Array 方法接受负数索引（它们的工作方式类似于传统的数组方法）。偏移量必须是非负的。详细信息请参阅 §32.4 “快速引用：索引与偏移量`。\n\
  \n#### 32.6.2.1 Typed Array 特有的属性\n\n以下属性是 Typed Array 特有的；普通数组没有它们：\n\n*   `get\
  \ .buffer(): ArrayBuffer`\n\n    返回支持此 Typed Array 的缓冲区。\n\n*   `get .length():\
  \ number`\n\n    返回此 Typed Array 缓冲区的元素长度。\n\n*   `get .byteLength(): number`\n\n\
  \    返回此 Typed Array 缓冲区以字节为单位的大小。\n\n*   `get .byteOffset(): number`\n\n    返回此\
  \ Typed Array 在其 `ArrayBuffer` 内部“起始”位置的偏移量。\n\n*   `.set(typedArray: TypedArray,\
  \ offset=0): void`\n\n*   `.set(arrayLike: ArrayLike<number>, offset=0): void`\n\
  \n    将第一个参数的所有元素拷贝到此 Typed Array。参数中索引 0 的元素被写入此 Typed Array 的索引 `offset` 处（依此类推）。有关类数组对象的更多信息，请参阅\
  \ §31.4 “类数组对象`。\n\n*   `.subarray(startIndex=0, endIndex=this.length): TypedArray<T>`\n\
  \n    返回一个新的 Typed Array，它与此 Typed Array 相同的缓冲区，但范围（通常）更小。如果 `startIndex` 为非负，则结果\
  \ Typed Array 的第一个元素是 `this[startIndex]`，第二个是 `this[startIndex+1]`（依此类推）。如果 `startIndex`\
  \ 为负，则它将进行适当的转换。\n\n#### 32.6.2.2 数组方法\n\n以下方法与普通数组的方法基本相同：\n\n*   `.copyWithin(target:\
  \ number, start: number, end=this.length): this`\n\n*   `.entries(): Iterable<[number,\
  \ T]>`\n\n*   `.every(callback: (value: T, index: number, array: TypedArray<T>)\
  \ => boolean, thisArg?: any): boolean`\n\n*   `.fill(value: T, start=0, end=this.length):\
  \ this`\n\n*   `.filter(callback: (value: T, index: number, array: TypedArray<T>)\
  \ => any, thisArg?: any): T[]`\n\n*   `.find(predicate: (value: T, index: number,\
  \ obj: T[]) => boolean, thisArg?: any): T | undefined`\n\n*   `.findIndex(predicate:\
  \ (value: T, index: number, obj: T[]) => boolean, thisArg?: any): number`\n\n* \
  \  `.forEach(callback: (value: T, index: number, array: TypedArray<T>) => void,\
  \ thisArg?: any): void`\n\n*   `.includes(searchElement: T, fromIndex=0): boolean`\n\
  \n*   `.indexOf(searchElement: T, fromIndex=0): number`\n\n*   `.join(separator\
  \ = ','): string`\n\n*   `.keys(): Iterable<number>`\n\n*   `.lastIndexOf(searchElement:\
  \ T, fromIndex=this.length-1): number`\n\n*   `.map<U>(mapFunc: (value: T, index:\
  \ number, array: TypedArray<T>) => U, thisArg?: any): U[]`\n\n*   `.reduce<U>(callback:\
  \ (accumulator: U, currentValue: T, index: number, array: TypedArray<T>) => U, thisArg?:\
  \ any, initialValue?: U): U`\n\n*   `.reduceRight<U>(callback: (accumulator: U,\
  \ currentValue: T, index: number, array: TypedArray<T>) => U, thisArg?: any, initialValue?:\
  \ U): U`\n\n*   `.reverse(): this`\n\n*   `.slice(start=0, end=this.length): T[]`\n\
  \n*   `.some(callback: (value: T, index: number, array: TypedArray<T>) => boolean,\
  \ thisArg?: any): boolean`\n\n*   `.sort(compareFunc?: (a: T, b: T) => number):\
  \ this`\n\n*   `.toString(): string`\n\n*   `.values(): Iterable<number>`\n\n有关这些方法如何工作的细节，请参阅\
  \ [31.12.3 `Array<T>.prototype` 方法]。\n\n每个 Typed Array 构造函数的名称都遵循 `«ElementType»Array`\
  \ 的模式，其中 `«ElementType»` 是元素类型之一。这意味着 Typed Array 有九种构造函数：\n\n*   `Float32Array`,\
  \ `Float64Array`\n\n*   `Int8Array`, `Int16Array`, `Int32Array`\n\n*   `Uint8Array`,\
  \ `Uint8ClampedArray`, `Uint16Array`, `Uint32Array`\n\n每个构造函数都有四个*重载*版本——其行为取决于接收多少个参数以及它们的类型：\n\
  \n*   `new «ElementType»Array(buffer: ArrayBuffer, byteOffset=0, length=0)`\n\n\
  \    创建一个缓冲区为 `buffer` 的 `«ElementType»Array`。它从指定的 `byteOffset` 开始访问缓冲区并具有指定的 `length`。注意，`length`\
  \ 计算的是 Typed Array 的元素（每个 1-8 字节），而不是字节。\n\n*   `new «ElementType»Array(length=0)`\n\
  \n    创建一个具有指定 `length` 和相应缓冲区的 `«ElementType»Array`。缓冲区以字节为单位的大小为\n\n    ```\n\
  \    length * «ElementType»Array.BYTES_PER_ELEMENT\n    ```\n\n*   `new «ElementType»Array(source:\
  \ TypedArray)`\n\n    创建一个 `«ElementType»Array` 的新实例，其元素与 `source` 的元素相同，但被转换为 `ElementType`。\n\
  \n*   `new «ElementType»Array(source: ArrayLike<number>)`\n\n    创建一个 `«ElementType»Array`\
  \ 的新实例，其元素与 `source` 的元素相同，但被转换为 `ElementType`。有关类数组对象的更多信息，请参阅 §31.4 “类数组对象`。\n\
  \n### 32.6.4 `«ElementType»Array` 的静态属性\n\n*   `«ElementType»Array.BYTES_PER_ELEMENT:\
  \ number`\n\n\n\n\n\n计算存储单个元素所需的字节数：\n\n```\n> Uint8Array.BYTES_PER_ELEMENT\n1\n\
  > Int16Array.BYTES_PER_ELEMENT\n2\n> Float64Array.BYTES_PER_ELEMENT\n8\n```\n\n\
  ### 32.6.5 `«ElementType»Array.prototype` 的属性\n\n* `.BYTES_PER_ELEMENT: number`\n\
  \n与 `«ElementType»Array.BYTES_PER_ELEMENT` 相同。\n\n## 32.7 快速参考：DataViews\n\n###\
  \ 32.7.1 `new DataView()`\n\n* `new DataView(buffer: ArrayBuffer, byteOffset=0,\
  \ byteLength=buffer.byteLength-byteOffset)`\n\n创建一个新的 `DataView`，其数据存储在 `ArrayBuffer`\
  \ `buffer` 中。默认情况下，新的 `DataView` 可以访问 `buffer` 的所有内容。最后两个参数允许你更改这一点。\n\n### 32.7.2\
  \ `DataView.prototype` 的属性\n\n在本节的剩余部分，`«ElementType»` 指以下之一：\n\n* `Float32`, `Float64`\n\
  * `Int8`, `Int16`, `Int32`\n* `Uint8`, `Uint16`, `Uint32`\n\n这些是 `DataView.prototype`\
  \ 的属性：\n\n* `get .buffer()`\n  返回此 `DataView` 的 `ArrayBuffer`。\n* `get .byteLength()`\n\
  \  返回此 `DataView` 可以访问的字节数。\n* `get .byteOffset()`\n  返回此 `DataView` 开始访问其缓冲区中字节的偏移量。\n\
  * `.get«ElementType»(byteOffset: number, littleEndian=false)`\n  从此 `DataView` 的缓冲区中读取一个值。\n\
  * `.set«ElementType»(byteOffset: number, value: number, littleEndian=false)`\n \
  \ 向此 `DataView` 的缓冲区中写入 `value`。\n\n# 33 Maps (`Map`)\n\n* *\n\n* 33.1 使用 Maps\n\
