    \ `curry` 调用和当前调的所有参数传递给它。它使用 `Array.concat` 方法将两个参数数组合并在一起。\n\n遗憾的是，正如我们之前看到的，`arguments`\
    \ 数组不是一个数组，因此它没有 `concat` 方法。为了解决这个问题，我们将在两个 `arguments` 数组上都应用 `array.slice`\
    \ 方法。这会产生在 `concat` 方法下正常运行的数组：\n\n```javascript\nFunction.method('curry', function\
    \ ( ) {\n  var slice = Array.prototype.slice,\n  args = slice.apply(arguments),\n\
    \  that = this;\n  return function ( ) {\n    return that.apply(null, args.concat(slice.apply(arguments)));\n\
    \  };\n});\n```\n\n## 记忆化 (Memoization)\n\n函数可以使用对象来记住之前操作的结果，从而避免不必要的工作。JavaScript\
    \ 的对象和数组非常适合这一点。\n\n假设我们想要一个递归函数来计算斐波那契数。斐波那契数是两个一个斐波那契数之和。前两个是 0 和 1：\n\n```javascript\n\
    var fibonacci = function (n) {\n  return n < 2 ? n : fibonacci(n - 1) + fibonacci(n\
    \ - 2);\n};\n\nfor (var i = 0; i <= 10; i += 1) {\n  document.writeln('// ' +\
    \ i + ': ' + fibonacci(i));\n}\n// 0: 0\n// 1: 1\n// 2: 1\n// 3: 2\n// 4: 3\n\
    // 5: 5\n// 6: 8\n// 7: 13\n// 8: 21\n// 9: 34\n// 10: 55\n```\n\n这种方法虽然可行，但它做了大量不必要的工作。`fibonacci`\
    \ 函数被调用了 453 次。我们调用了它 11 次，它在计算可能已经计算过的值时自己调用了 442 次。如果我们对函数进行 `memoize`，可以显著减少它的工作量。\n\
    \n我们将记忆化的结果保留在一个 `memo` 数组中，并将其隐藏在闭包中。当函数被调用时，它首先查找自己是否已经知道结果。如果是，它可以立即返回结果：\n\
    \n```javascript\nvar fibonacci = (function ( ) {\n  var memo = [0, 1];\n  var\
    \ fib = function (n) {\n    var result = memo[n];\n    if (typeof result !== 'number')\
    \ {\n      result = fib(n - 1) + fib(n - 2);\n      memo[n] = result;\n    }\n\
    \    return result;\n  };\n  return fib;\n})();\n```\n"
