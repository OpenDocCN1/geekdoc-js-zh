    \ from other languages. A *regular expression* is the specification of the syntax\
    \ of a simple language. Regular expressions are used with methods to search, replace,\
    \ and extract information from strings. The methods that work with regular expressions\
    \ are `regexp.exec`, `regexp.test`, `string.match`, `string.replace`, `string.search`,\
    \ and `string.split`.\n\nRegular expressions came from the mathematical study\
    \ of formal languages. Ken Thompson adapted Stephen Kleene’s theoretical work\
    \ on type-3 languages into a practical pattern matcher that could be embedded\
