    \ 和 `arguments`。`this` 参数在面向对象编程中非常重要，它的值由*调用模式*决定。`JavaScript` 中四种调用模式：方法调用模式、函数调用模式、构造函数调用模式和\
    \ apply 调用模式。\n\n## 方法调用模式\n\n当一个函数被存储为对象时，我们称之为*方法*。当方法被调用时，`this` 会绑定到该对象。\n\
    \n```javascript\n// 创建一个具有值和递增方法的 myObject。\nvar myObject = {\n  value: 0,\n \
