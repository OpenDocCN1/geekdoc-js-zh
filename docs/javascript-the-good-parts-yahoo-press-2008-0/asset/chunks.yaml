  trans: "\n汉诺塔是一个著名的谜题。该设备包括三根柱子和一组直径不同、中心带孔的圆盘。初始设置是将所有圆盘堆放在源柱上，小圆盘在大圆盘之上。目标是通过一次移动一个圆盘到另一个柱子，将堆移动到目标柱，且永远不要将大盘放在小盘之上。这个谜题有一个简单的递归解：\n\
    \n```javascript\nvar hanoi = function hanoi(disc, src, aux, dst) {\n  if (disc\
    \ > 0) {\n    hanoi(disc - 1, src, dst, aux);\n    document.writeln('Move disc\
    \ ' + disc + ' from ' + src + ' to ' + dst);\n    hanoi(disc - 1, aux, src, dst);\n\
    \  }\n};\n\nhanoi(3, 'Src', 'Aux', 'Dst');\n```\n\n它为三个圆盘产生了以下解：\n将圆盘 1 从 Src\
    \ 移动到 Dst\n将圆盘 2 从 Src 移动到 Aux\n将圆盘 1 从 Dst 移动到 Aux\n将圆盘 3 从 Src 移动到 Dst\n将圆盘\
    \ 1 从 Aux 移动到 Src\n将圆盘 2 从 Aux 移动到 Dst\n将圆盘 1 从 Src 移动到 Dst\n\n`hanoi` 函数将圆盘堆从一个柱子移动到另一个柱子，必要时使用辅助柱。它将问题分解为三个子问题。首先，它通过将底部圆盘上方的子堆移动到辅助柱来揭露底部圆盘。然后它可以将底部圆盘移动到目标柱。最后，它可以将子堆从辅助柱移动到目标柱。子堆的移动通过递归地调用自身来处理这些子问题。\n\
    \n`hanoi` 函数接收的参数是要移动的圆盘编号以及要使用的三根柱子。当它调用自身时，是为了处理当前正在操作的圆盘上面的圆盘。最终，它将以一个不存在的圆盘编号调用。在这种情况下，它什么都不做。这种“无所事事”的操作让我们相信该函数不会无限递归。\n\
    \n递归函数在处理树形结构（如浏览器的文档对象模型 DOM）时可以非常有效。每个递归调用都获得树的一块较小部分来处理：\n\n### 第 4 章：函数\n\n\
    ```javascript\n// 定义一个 walk_the_DOM 函数，它按照 HTML 源代码顺序\n// 访问树的每个节点，从某个给定的节点\n\
    // 开始。它调用一个函数，并依次传递\n// 每个节点。walk_the_DOM 调用\n// 自身来处理每个子节点。\nvar walk_the_DOM\
    \ = function walk(node, func) {\n  func(node);\n  node = node.firstChild;\n  while\
    \ (node) {\n    walk(node, func);\n    node = node.nextSibling;\n  }\n};\n\n//\
    \ 定义一个 getElementsByAttribute 函数。它\n// 接收一个属性名称字符串和一个可选的\n// 匹配值。它调用 walk_the_DOM，传递一个\n\
    // 在节点中查找属性名称的函数。匹配的节点被累积在\n// 数组中。\nvar getElementsByAttribute = function (att,\
    \ value) {\n  var results = [];\n  walk_the_DOM(document.body, function (node)\
    \ {\n    var actual = node.nodeType === 1 && node.getAttribute(att);\n    if (typeof\
    \ actual === 'string' && (actual === value || typeof value !== 'string')) {\n\
    \      results.push(node);\n    }\n  });\n  return results;\n};\n```\n\n某些语言提供了`尾递归优化`。这意味着如果一个函数返回递归调用自身的结果，那么该调用将被替换为循环，这可以显著提高速度。遗憾的是，JavaScript\
    \ 目前没有提供尾递归优化。深度递归的函数可能会因为耗尽返回栈而失败：\n\n```javascript\n// 使用尾递归实现阶乘函数。\n// 它是尾递归的，因为\n\
    // 返回了调用自身的结果。\n// JavaScript 目前没有优化这种形式。\nvar factorial = function factorial(i,\
    \ a) {\n  a = a || 1;\n  if (i < 2) {\n    return a;\n  }\n  return factorial(i\
    \ - 1, a * i);\n};\n\ndocument.writeln(factorial(4)); // 24\n```\n\n### 递归\n\n\
    ### 作用域\n编程语言中的`作用域`(Scope）控制变量和参数的可见性和生命周期。这对程序员来说是一项重要的服务，因为它减少了命名冲突并提供了自动内存管理：\n\
    \n```javascript\nvar foo = function () {\n  var a = 3, b = 5;\n  var bar = function\
    \ () {\n    var b = 7, c = 11;\n    // 在此时，a 是 11，b 是 7，c 是 11\n    a += b + c;\n\
    \    // 在此时，a 是 21，b 是 7，c 是 11\n  };\n  // 在此时，a 是 3，b 是 5，且 c 未定义\n  bar();\n\
    \  // 在此时，a 是 21，b 是 5\n};\n```\n\n大多数具有 C 语法的语言都具有块级作用域。在块（用大括号括起来的语句列表）中定义的所有变量在块外部外部都是不可见的。在块中定义的变量可以在块执行完毕后释放。这是一件好事。\n\
    \n遗憾的是，JavaScript 并没有块级作用域，尽管它的块语法暗示了它有。这种混淆可能是产生错误的根源。\n\nJavaScript 确实有函数级作用域。这意味着在函数中定义的参数和变量在函数外部是不可见的，而在函数内部任何地方定义的变量在函数内部任何地方都是可见的。\n\
    \n在许多现代语言中，建议尽可能晚声明变量，即在第一次使用的地方。对于 JavaScript 来说这是一个糟糕的建议，因为它缺乏块级作用域。因此，最好的方法是在函数体的顶部声明函数中使用的所有变量。\n\
    \n### 闭包\n关于作用域的好消息是，内部函数可以访问它们定义所所在函数的参数和变量（此函数和参数除外）。这是一个非常好的事情。\n\n我们的 `getElementsByAttribute`\
    \ 函数之所以运作是因为它声明了一个 `results` 变量，而它传递给 `walk_the_DOM` 的内部函数也可以访问该 `results` 变量。\n\
    \n更有趣的情况是内部函数的生命周期比其外部函数更长。\n\n早些，我们创建了一个 `myObject`，它包含一个值和一个递增方法。假设我们想保护该值免受未经授权的。\n\
    \n我们不再使用对象字面量来初始化 `myObject`，而是通过调用一个返回对象字面量的函数来初始化 `myObject`。该函数定义了一个 `value`\
    \ 变量。该变量对于 `increment` 和 `getValue` 方法来说始终可用，但函数的作用域将其隐藏在程序的其余部分之外：\n\n```javascript\n\
    var myObject = (function () {\n  var value = 0;\n  return {\n    increment: function\
    \ (inc) {\n      value += typeof inc === 'number' ? inc : 1;\n    },\n    getValue:\
    \ function () {\n      return value;\n    }\n  };\n}(());\n```\n\n我们没有将一个函数赋值给\
    \ `myObject`。我们赋值的是调用该函数的结果。注意最后一行的 `()`。该函数返回一个包含两个方法的对象，这些方法继续享有访问 `value` 变量的特权。\n\
    \n本章早前的 `Quo` 构造函数产生了一个具有 `status` 属性和 `get_status` 方法的对象。但这看起来并不无趣。为什么要对一个你可以可以直接访问的属性调用\
    \ getter 方法呢？如果 `status` 属性是私有的，它会更有用。所以，让我们定义一种不同的 `quo` 函数来实现这一点：\n\n```javascript\n\
    var quo = function (status) {\n  return {\n    get_status: function () {\n   \
    \   return status;\n    }\n  };\n};\n\n// 创建一个 quo 的实例。\nvar myQuo = quo(\"amazed\"\
    );\ndocument.writeln(myQuo.get_status());\n```\n\n这个 `quo` 函数设计为不带 `new` 前缀使用，因此名称没有大写。当我们调用\
    \ `quo` 时，它返回一个包含 `get_status` 方法的新对象。该对象的引用被存储在 `myQuo` 中。即使 `quo` 已经返回，`get_status`\
    \ 方法仍然拥有特权访问 `quo` 的 `status` 属性。\n\n"
- fmt: "\n`get_status` does not have access to a copy of the parameter; it has access\
    \ to the parameter itself. This is possible because the function has access to\
    \ the context in which it was created. This is called `closure*.\n\nLet’s look\
    \ at a more useful example:\n\n```javascript\n// Define a function that sets a\
    \ DOM node's color\n// to yellow and then fades it to white.\nvar fade = function\
    \ (node) {\n  var level = 1;\n  var step = function ( ) {\n    var hex = level.toString(16);\n\
    \    node.style.backgroundColor = '#FFFF' + hex + hex;\n    if (level < 15) {\n\
    \      level += 1;\n      setTimeout(step, 100);\n    }\n  };\n  setTimeout(step,\
    \ 100);\n};\nfade(document.body);\n```\n\nWe call `fade`, passing it `document.body`\
    \ (the node created by the HTML `<body>` tag).\n\n`fade` sets `level` to `1`.\
    \ It defines a `step` function. It calls `setTimeout`, passing it the `step` function\
    \ and a time (100 milliseconds). It then returns—`fade` has finished.\n\nSuddenly,\
    \ about a 10th of a second later, the `step` function gets invoked. It makes a\
    \ base 16 character from `fade`’s `level`. It then modifies the background color\
    \ of `fade`’s node. It then looks at `fade`’s `level`. If it hasn’t gotten to\
    \ white yet, it then increments `fade`’s `level` and uses `setTimeout` to schedule\
    \ itself to run again.\n\n# Chapter 4: Functions\n\nSuddenly, the `step` function\
    \ gets invoked again. But this time, `fade`’s `level` is `2`. `fade` returned\
    \ a while ago, but its variables continue to live as long as they are needed by\
    \ one or more of `fade`’s inner functions.\n\nIt is important to understand that\
    \ the inner function has access to the actual variables of the outer functions\
    \ and not copies in order to avoid the following problem.\n\n### BAD EXAMPLE\n\
    ```javascript\n// Make a function that assigns event handler functions to an array\
    \ of nodes the wrong way.\n// When you click on a node, an alert box is supposed\
    \ to display the ordinal of the node.\n// But it always displays the number of\
    \ nodes instead.\nvar add_the_handlers = function (nodes) {\n  var i;\n  for (i\
    \ = 0; i < nodes.length; i += 1) {\n    nodes[i].onclick = function (e) {\n  \
    \    alert(i);\n    };\n  }\n};\n// END BAD EXAMPLE\n```\n\nThe `add_the_handlers`\
    \ function was intended to give each handler a unique number `i`. It fails because\
    \ the handler functions are bound to the variable `i`, not the value of the variable\
    \ `i` at the time the function was made.\n\n### BETTER EXAMPLE\n```javascript\n\
    // Make a function that assigns event handler functions to an array of nodes.\n\
    // When you click on a node, an alert box will display the ordinal of the node.\n\
    var add_the_handlers = function (nodes) {\n  var helper = function (i) {\n   \
    \ return function (e) {\n      alert(i);\n    };\n  };\n  var i;\n  for (i = 0;\
    \ i < nodes.length; i += 1) {\n    nodes[i].onclick = helper(i);\n  }\n};\n```\n\
    \nAvoid creating functions within a loop. It can be wasteful computationally,\
    \ and it can cause confusion, as we saw with the bad example. We avoid the confusion\
    \ by creating a `helper` function outside of the loop that will deliver a function\
    \ that binds to the current value of `i`.\n\n# Callbacks\n\nFunctions can make\
    \ it easier to deal with discontinuous events. For example, suppose there is a\
    \ sequence that begins with a user interaction, making a request of the server,\
    \ and finally displaying the server’s response. The naïve way to write that would\
    \ be:\n\n```javascript\nrequest = prepare_the_request( );\nresponse = send_request_synchronously(request);\n\
    display(response);\n```\n\nThe problem with this approach is that a synchronous\
    \ request over the network will leave the client in a frozen state. If either\
    \ the network or the server is slow, the degradation in responsiveness will be\
    \ unacceptable.\n\nA better approach is to make an asynchronous request, providing\
    \ a callback function that will be invoked when the server’s response is received.\
    \ An asynchronous function returns immediately, so the client isn’t blocked:\n\
    \n```javascript\nrequest = prepare_the_request( );\nsend_request_asynchronously(request,\
    \ function (response) {\n  display(response);\n});\n```\n\nWe pass a function\
    \ parameter to the `send_request_asynchronously` function that will be called\
    \ when the response is available.\n\n# Module\n\nWe can use functions and closure\
    \ to make modules. A module is a function or object that presents an interface\
    \ but that hides its state and implementation. By using functions to produce modules,\
    \ we can almost completely eliminate our use of global variables, thereby mitigating\
    \ one of JavaScript’s worst features.\n\nFor example, suppose we want to augment\
    \ `String` with a `deentityify` method. Its job is to look for HTML entities in\
    \ a string and replace them with their equivalents. It makes sense to keep the\
    \ names of the entities and their equivalents in an object.\n\nBut where should\
    \ we keep the object? We could put it in a global variable, but global variables\
    \ are evil. We could define it in the function itself, but that has a runtime\
    \ cost because the literal must be evaluated every time the function is invoked.\
    \ The ideal approach is to put it in a closure, and perhaps provide an extra method\
    \ that can add additional entities:\n\n```javascript\nString.method('deentityify',\
    \ function ( ) {\n  // The entity table. It maps entity names to\n  // characters.\n\
    \  var entity = {\n    quot: '\"',\n    lt: '<',\n    gt: '>'\n  };\n  // Return\
    \ the deentityify method.\n  return function ( ) {\n    // This is the deentityify\
    \ method. It calls the string\n    // replace method, looking for substrings that\
    \ start\n    // with '&' and end with ';'. If the characters in\n    // between\
