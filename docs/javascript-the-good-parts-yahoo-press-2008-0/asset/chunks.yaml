  trans: "\n\nJavaScript 程序中一个常见的错误是在需要数组的地方使用了对象，或者在需要对象的地方使用了数组。规则非常简单：当属性名是较小的连续整数时，你应该使用数组。否则，请使用对象。\n\
    \nJavaScript 本身对数组和对象之间的区别也感到困惑。`typeof` 运算符报告数组的类型为 `'object'`，这并没有什么帮助。\n\n\
    JavaScript 并没有一个良好的机制来区分数组和对象。我们可以通过定义自己的 `is_array` 函数来弥补这一缺陷：`var is_array =\
    \ function (value) {`\n\n```javascript\nvar is_array = function (value) {\n  return\
    \ value && typeof value === 'object' && value.constructor === Array;\n};\n```\n\
    \n遗憾的是，它无法识别在不同窗口或帧中构造的数组。如果我们想准确检测那些外部数组，就必须付出更多努力：\n\n```javascript\nvar is_array\
    \ = function (value) {\n  return Object.prototype.toString.apply(value) === '[object\
    \ Array]';\n};\n```\n\n## 方法\n\nJavaScript 提供了一系列用于操作数组的方法。这些方法是存储在 `Array.prototype`\
    \ 中的函数。在第 3 章中我们看到 `Object.prototype` 可以被扩展。`Array.prototype` 也可以被扩展。\n\n例如，假设我们想添加一个数组方法，允许对数组进行计算：\n\
    \n```javascript\nArray.method('reduce', function (f, value) {\n  var i;\n  for\
    \ (i = 0; i < this.length; i += 1) {\n    value = f(this[i], value);\n  }\n  return\
    \ value;\n});\n```\n\n通过向 `Array.prototype` 添加一个函数，每个数组都会继承该方法。在这种情况下，我们定义了一个\
    \ `reduce` 方法，它接受一个函数和一个起始值。对于数组的每个元素，它都会调用该函数并传入当前元素和当前值，计算出一个新值。完成后，它会返回该值。如果我们传入一个加两个数字的函数，它就会计算和；如果我们传入一个乘两个数字的函数，它就会计算乘积：\n\
    \n```javascript\n// 创建一个数字数组。\nvar data = [4, 8, 15, 16, 23, 42];\n\n// 定义两个简单的函数。一个用于加两个\n\
    // 数字。另一个用于相乘两个数字。\nvar add = function (a, b) {\n  return a + b;\n};\nvar mult\
    \ = function (a, b) {\n  return a * b;\n};\n\n// 调用数据的 reduce 方法，传入\n// add 函数。\n\
    var sum = data.reduce(add, 0); // sum 为 108\n\n// 再次调用 reduce 方法，这次传入\n// mult\
    \ 函数。\nvar product = data.reduce(mult, 1);\n// product 为 7418880\n```\n\n由于数组本质上是一个对象，我们可以直接向单个数组添加方法：\n\
    \n```javascript\n// 给 data 数组添加一个求和函数。\ndata.total = function ( ) {\n  return\
    \ this.reduce(add, 0);\n};\ntotal = data.total( ); // total 为 108\n```\n\n由于字符串\
    \ `'total'` 不是整数，因此向数组添加 `total` 属性不会改变它的长度。当属性名是整数时，数组是最有用的，但它们仍然是对象，而对象可以接受任何字符串作为属性名。\n\
    \n在数组上使用第 3 章中的 `Object.create` 方法是没有意义的，因为它产生的是对象而不是数组。生成的对象将继承数组的值和方法，但它将没有特殊的\
    \ `length` 属性。\n\n## 第 6 章：数组\n\n### 维度\n\nJavaScript 数组通常不会被初始化。如果你用 `[]` 请求一个新数组，它是空的。如果你访问不存在的元素，将得到\
    \ `undefined` 值。如果你意识到这一点，或者如果你在尝试检索每个元素之前自然地设置了它们，那么一切都正常。但如果你正在实现的算法假设每个元素都从已知值（如\
    \ `0`）开始，那么你必须自己手动准备数组。\n\nJavaScript 应该提供某种形式的 `Array.dim` 方法来做到，但我们可以轻松地修正这个疏忽：\n\
    \n```javascript\nArray.dim = function (dimension, initial) {\n  var a = [], i;\n\
    \  for (i = 0; i < dimension; i += 1) {\n    a[i] = initial;\n  }\n  return a;\n\
    };\n\n// 创建一个包含 10 个零的数组。\nvar myArray = Array.dim(10, 0);\n```\n\nJavaScript\
    \ 没有超过一维的数组，但像大多数 C 语言一样，它可以拥有数组的数组：\n\n```javascript\nvar matrix = [\n  [0, 1,\
    \ 2],\n  [3, 4, 5],\n  [6, 7, 8]\n];\nmatrix[2][1] // 7\n```\n\n要创建一个二维数组或数组的数组，你必须自己构建数组：\n\
    \n```javascript\nfor (i = 0; i < n; i += 1) {\n  my_array[i] = [];\n}\n// 注意：Array.dim(n,\
    \ []) 在这里不起作用。\n// 每个元素都会获得同一个元素的引用。\n```\n\n矩阵的单元格初始为 `undefined`。如果你想它们有不同的初始值，必须显式设置。再次，JavaScript\
    \ 应该提供更好的支持。我们可以修正这一点：\n\n```javascript\nArray.matrix = function (m, n, initial)\
    \ {\n  var a, i, j, mat = [];\n  for (i = 0; i < m; i += 1) {\n    a = [];\n \
    \   for (j = 0; j < n; j += 1) {\n      a[j] = initial;\n    }\n    mat[i] = a;\n\
    \  }\n  return mat;\n};\n\n// 创建一个填充零的 4x4 矩阵。\nvar matrix = Array.matrix(4, 4,\
    \ 0);\n```\n\n// 创建单位矩阵的方法。\nArray.identity = function (n) {\n  var i, mat = Array.matrix(n,\
    \ 0);\n  for (i = 0; i < n; i += 1) {\n    mat[i][i] = 1;\n  }\n  return mat;\n\
    };\n\nvar myMatrix = Array.identity(4);\n\n## 第 7 章\n\n### 正则表达式\n\n*Whereas the\
    \ contrary bringeth bliss,*\n*And is a pattern of celestial peace.*\n*Whom should\
    \ we match with Henry, being a king...*\n——威廉·莎士比亚，《亨利六世第一》\n\nJavaScript 的许多功能都是借自其他语言。*正则表达式*（regular\
    \ expression）是简单语言语法的规范。正则表达式配合方法用于搜索、替换和从字符串中提取信息。配合正则表达式的方法有 `regexp.exec`、`regexp.test`、`string.match`、`string.replace`、`string.search`\
    \ 和 `string.split`。\n\n正则表达式来源于形式语言的数学研究。肯·汤普（Ken Thompson）将斯蒂芬·克莱尼（Stephen Kleene）对类型语言的理论工作转化为编辑器和编程语言中的实用模式匹配器。\n\
    \nJavaScript 中正则表达式的语法符合贝尔实验室的最初公式，并从 Perl 取了一些重新解释和扩展。编写正则表达式的规则可能异常复杂，因为它们在某些位置将字符解释为运算符，而在稍微不同的位置解释为字面量。比编写困难的是，这使得正则表达式难以阅读且修改危险。\n\
    \n为了缓解这一点，我稍微简化了规则。按照这里的介绍，正则表达式将不再那么简练，但也会更容易正确使用。\n\n"
- fmt: "\nAll of the parts of a regular expression are pushed tightly together, making\
    \ them almost indecipherable. This is a particular concern when they are used\
    \ in security applications for scanning and validation. If you cannot read and\
    \ understand a regular expression, how can you have confidence that it will work\
    \ correctly for all inputs?\n\nYet, despite their obvious drawbacks, regular expressions\
    \ are widely used.\n\n## An Example\n\nHere is an example. It is a regular expression\
    \ that matches URLs. The pages of this book are not infinitely wide, so I broke\
    \ it into two lines. In a JavaScript program, the regular expression must be on\
    \ a single line. Whitespace is significant:\n\n```javascript\nvar parse_url =\
    \ /^(?:([A-Za-z]+):)?(\\/{0,3})([0-9.\\-A-Za-z]+) (?::(\\d+))?(?:\\/([^?#]*))?(?:\\\
    ?([^#]*))?(?:#(.*))?$/;\n```\n\n`var url = “http://www.ora.com:80/goodparts?q#fragment”;`\
    \ Let’s call `parse_url`’s `exec` method. If it successfully matches the string\
    \ that we pass it, it will return an array containing pieces extracted from the\
    \ url:\n\n```javascript\nvar url = \"http://www.ora.com:80/goodparts?q#fragment\"\
    ;\nvar result = parse_url.exec(url);\nvar names = ['url', 'scheme', 'slash', 'host',\
    \ 'port', 'path', 'query', 'hash'];\nvar blanks = ' ';\nvar i;\nfor (i = 0; i\
    \ < names.length; i += 1) {\n  document.writeln(names[i] + ':' + blanks.substring(names[i].length),\
    \ result[i]);\n}\n```\n\nThis produces:\n\n```text\nurl: http://www.ora.com:80/goodparts?q#fragment\n\
    scheme: http\nslash: //\nhost: www.ora.com\nport: 80\npath: goodparts\nquery:\
    \ q\nhash: fragment\n```\n\n## Chapter 7: Regular Expressions\n\nIn [Chapter 2,](#index_split_000.html_p21)\
    \ we used railroad diagrams to describe the JavaScript language. We can also use\
    \ them to describe the languages defined by regular expressions. That may make\
    \ it easier to see what a regular expression does. This is a railroad diagram\
    \ for `parse_url`.\n\n`parse_url`\n`scheme`\n`begin string`\n`letter`\n`:`\n`slash`\n\
    `/`\n`/`\n`/`\n`host`\n`letter or digit`\n`or` `.` `or` `-`\n`port`\n`:`\n`digit`\n\
    `path`\n`any character`\n`/`\n`except` `?` `or` `#`\n`query`\n`any character`\n\
    `?`\n`except` `#`\n`hash`\n`#`\n`any character`\n`except line end`\n`end string`\n\
    \n66 | |\n## Chapter 7: Regular Expressions\n\nRegular expressions cannot be broken\
    \ into smaller pieces the way that functions can, so the track representing `parse_url`\
    \ is a long one.\n\nLet’s factor `parse_url` into its parts to see how it works.\n\
    \n`^`\n\nThe `^` character indicates the beginning of the string. It is an anchor\
    \ that prevents `exec` from skipping over a non-URL-like prefix.\n\n`(?:([A-Za-z]+):)?`\n\
    \nThis factor matches a scheme name, but only if it is followed by a `:` (colon).\
    \ The `(?:...)` indicates a noncapturing group. The suffix `?` indicates that\
    \ the group is optional.\n\n## An Example\n\n67 | |\n\nIt means *repeat zero or\
    \ one time*. The `(...)` indicates a capturing group. A capturing group copies\
    \ the text it matches and places it in the result array. Each capturing group\
    \ is given a number. This first capturing group is 1, so a copy of the text matched\
    \ by this capturing group will appear in `result[1]`. The `[]` indicates a character\
    \ class. This character class, `A-Za-z`, contains 26 uppercase letters and 26\
    \ lowercase letters. The hyphens indicate ranges, from `A` to `Z`. The suffix\
    \ `+` indicates that the character class will be matched one or more times. The\
    \ group is followed by the `:` character, which will be matched literally.\n\n\
    `(\\/{0,3})`\n\nThe next factor is capturing group 2. `\\/` indicates that a `/`\
    \ (slash) character should be matched. It is escaped with `\\` (backslash) so\
    \ that it is not misinterpreted as the end of the regular expression literal.\
    \ The suffix `{0,3}` indicates that the `/` will be matched 0 or 1 or 2 or 3 times.\n\
    \n`([0-9.\\-A-Za-z]+)`\n\nThe next factor is capturing group 3. It will match\
    \ a host name, which is made up of one or more digits, letters, or `.` or ``.\
    \ The `-` was escaped as `\\-` to prevent it from being confused with a range\
    \ hyphen.\n\n`(?::(\\d+))?`\n\nThe next factor optionally matches a port number,\
    \ which is a sequence of one or more digits preceded by a `:`. `\\d` represents\
    \ a digit character. The series of one or more digits will be capturing group\
    \ 4.\n\n`(?:\\/([^?#]*))?`\n\nWe have another optional group. This one begins\
    \ with a `/`. The character class `[^?#]` begins with a `^`, which indicates that\
    \ the class includes all characters *except `?` and `#*. The `*` indicates that\
    \ the character class is matched zero or more times.\n\nNote that I am being sloppy\
    \ here. The class of all characters *except `?` and `#* includes line-ending characters,\
    \ control characters, and lots of other characters that really shouldn’t be matched\
    \ here. Most of the time this will do what we want, but there is a risk that some\
    \ bad text could slip through. Sloppy regular expressions are a popular source\
    \ of security exploits. It is lot easier to write sloppy regular expressions than\
    \ rigorous regular expressions.\n\n`(?:\\?([^#]*))?`\n\nNext, we have an optional\
    \ group that begins with a `?`. It contains capturing group 6, which contains\
    \ zero or more characters that are not `#`.\n\n`(#(.*))?`\n\nWe have a final optional\
    \ group that begins with `#`. The `.` will match any character except a line-ending\
    \ character.\n\n`$`\n\n68 | |\n## Chapter 7: Regular Expressions\n\nThe `$` represents\
    \ the end of the string. It assures us that there was no extra material after\
    \ the end of the URL.\n\nThose are the factors of the regular expression `parse_url`.\n\
    \nIt is possible to make regular expressions that are more complex than `parse_url`,\
    \ but I wouldn’t recommend it. Regular expressions are best when they are short\
    \ and simple. Only then can we have confidence that they are working correctly\
    \ and that they could be successfully modified if necessary.\n\nThere is a very\
    \ high degree of compatibility between JavaScript language processors.\n\nThe\
    \ part of the language that is *least* portable is the implementation of regular\
    \ expressions. Regular expressions that are very convoluted are more likely to\
    \ have portability problems. Simplicity is the best strategy.\n\nLet’s look at\
    \ another example: a regular expression that matches numbers. Numbers can have\
    \ an integer part with an optional minus sign, an optional fractional part, and\
    \ an optional exponent part.\n\n```javascript\nvar parse_number = /^-?\\d+(?:\\\
    .\\d*)?(?:e[+\\]?\\d+)?$/i;\nvar test = function (num) {\n  document.writeln(parse_number.test(num));\n\
    };\n\ntest('1'); // true\ntest('number'); // false\ntest('98.6'); // true\ntest('132.21.86.100');\
    \ // false\ntest('123.45E-67'); // true\ntest('123.45D-67'); // false\n```\n\n\
    `parse_number` successfully identified the strings that conformed to our specification\
    \ and those that did not, but for those that did not, it gives us no information\
    \ on why or where they failed.\n\nLet’s break down `parse_number`.\n\n`/^ $/i`\n\
    \nWe again use `^` and `$` to anchor the regular expression. This causes all the\
    \ characters in the text to be matched against the regular expression. If we had\
    \ omitted the anchors, the regular expression would tell us if a string contains\
    \ a number. With the anchors, it tells us if the string contains only a number.\
    \ If we included just the `^`, it would match strings starting with a number.\
    \ If we included just the `$`, it would match strings ending with a number.\n\n\
    When you press them all together again, it is visually quite confusing:\n\n`/^(?:([A-Za-z]+):)?(\\\
    /{0,3})([0-9.\\-A-Za-z]+)(?::(\\d+))?(?:\\/([^?#]*))?(?:\\?([^#]*))?(?:#(.*))?$/\n\
    ```\n\n## An Example\n\n69 | |\n`parse_number`\n`begin string`\n`-`\n`digit`\n\
    `end string`\n`.`\n`digit`\n`e`\n`+`\n`digit`\n`-`\n\nThe `i` flag causes case\
    \ to be ignored when matching letters. The only letter in our pattern is `e`.\
    \ We want that e to also match `E`. We could have written the e factor as `[Ee]`\
    \ or `(?:E|e)`, but we didn’t have to because we used the `i` flag.\n\n`-?`\n\n\
    The `?` suffix on the minus sign indicates that the minus sign is optional.\n\n\
    `\\d+`\n"
