    \ 4 章](#index_split_000.html_p42)。\n\n## 函数\n\n`|`\n\n**19**\n\n# 第 3 章\n\n# 对象\n\
    \n*Upon a homely object Love can wink.*\n—威廉·莎士\n\n**JavaScript 的简单类型是数字、字符串、布尔值（`true`\
    \ 和 `false`）、`null` 和 `undefined`。所有其他值都是*对象*。在 JavaScript 中，数组、函数、正则表达式当然都是对象。\n\
    \n对象是属性的容器，每个属性有一个名称和一个值。属性名称可以是任何字符串，包括空字符串。属性值可以是 `undefined` 外的任何 JavaScript\
    \ 值。\n\n对象用于收集和组织数据。对象可以包含其他对象，因此可以轻松地表示树或图结构。\n\nJavaScript 包含了原型链功能，允许一个对象继承另一个对象的属性。在使用良好时，这可以减少对象的初始化内存消耗。\n\
    \n## 对象字面量\n\n对象字面量是创建新对象的方便表示法。\n\n对象字面量是包裹着零或多个键值对的大括号。它可以出现在表达式的地方：`var empty_object\
    \ = {};`\n\n```\nvar stooge = {\n\"first-name\": \"Jerome\",\n\"last-name\": \"\
    Howard\"\n};\n```\n\n**20**\n\n属性名称可以是任何字符串，包括空字符串。对象字面量中属性名称的引号如果该名称是法的 JavaScript\
    \ 名称且不是保留字，则是可选的。因此，`\"first-name\"` 的引号是必须的，但 `first_name` 则。逗号用于分隔这些对。\n\n属性的值可以从任何表达式获取，包括另一个对象字面量。对象可以嵌套：\n\
    \n```javascript\nvar flight = {\n  airline: \"Oceanic\",\n  number: 815,\n  departure:\
    \ {\n    IATA: \"SYD\",\n    time: \"2004-09-22 14:55\",\n    city: \"Sydney\"\
    \n  },\n  arrival: {\n    IATA: \"LAX\",\n    time: \"2004-09-23 10:42\",\n  \
    \  city: \"Los Angeles\"\n  }\n};\n```\n\n**检索**\n\n"
- fmt: "\nValues can be retrieved from an object by wrapping a string expression in\
    \ a `[]` suffix. If the string expression is a string literal, and if it is a\
    \ legal JavaScript name and not a reserved word, then the `.` notation can be\
    \ used instead. The `.` notation is preferred because it is more compact and it\
    \ reads better: `stooge[\"first-name\"] // \"Jerome\"`\n\n`flight.departure.IATA\
    \ // \"SYD\"`\n\nThe undefined value is produced if an attempt is made to retrieve\
    \ a nonexistent member:\n\n`stooge[\"middle-name\"] // undefined`\n\n`flight.status\
    \ // undefined`\n\n`stooge[\"FIRST-NAME\"] // undefined`\n\nThe `||` operator\
    \ can be used to fill in default values: `var middle = stooge[\"middle-name\"\
    ] || \"(none)\"; var status = flight.status || \"unknown\";`\n\nAttempting to\
    \ retrieve values from undefined will throw a `TypeError` exception. This can\
    \ be guarded against with the `&&` operator:\n\n`flight.equipment // undefined`\n\
    `flight.equipment.model // throw \"TypeError\"`\n\n`flight.equipment && flight.equipment.model\
    \ // undefined` Retrieval\n\n|\n\n21\n\n## Update\n\nA value in an object can\
    \ be updated by assignment. If the property name already exists in the object,\
    \ the property value is replaced:\n\n`stooge['first-name'] = 'Jerome';`\n\nIf\
    \ the object does not already have that property name, the object is augmented:\
    \ `stooge['middle-name'] = 'Lester';`\n\n`stooge.nickname = 'Curly';`\n`flight.equipment\
    \ = {\nmodel: 'Boeing 777'\n};`\n\n`flight.status = 'overdue';`\n\n## Reference\n\
    \nObjects are passed around by reference. They are never copied: `var x = stooge;`\n\
    \n`x.nickname = 'Curly';`\n\n`var nick = stooge.nickname;`\n`// nick is 'Curly'\
    \ because x and stooge`\n`// are references to the same object`\n\n`var a = {},\
    \ b = {}, c = {};`\n`// a, b, and c each refer to a`\n`// different empty object`\n\
    `a = b = c = {};`\n`// a, b, and c all refer to`\n`// the same empty object`\n\
    \n## Prototype\n\nEvery object is linked to a prototype object from which it can\
    \ inherit properties. All objects created from object literals are linked to `Object.prototype`,\
    \ an object that comes standard with JavaScript.\n\nWhen you make a new object,\
    \ you can select the object that should be its prototype.\n\nThe mechanism that\
    \ JavaScript provides to do this is messy and complex, but it can be significantly\
    \ simplified. We will add a `create` method to the `Object` function. The `create`\
    \ method creates a new object that uses an old object as its prototype. There\
    \ will be much more about functions in the next chapter.\n\n```javascript\nif\
    \ (typeof Object.create !== 'function') {\n  Object.create = function (o) {\n\
    \    var F = function () {};\n    F.prototype = o;\n    return new F();\n  };\n\
    }\n```\n\n22\n\n|\n\n## Chapter 3: Objects\n\n`var another_stooge = Object.create(stooge);`\n\
    \nThe prototype link has no effect on updating. When we make changes to an object,\
    \ the object’s prototype is not touched:\n\n`another_stooge['first-name'] = 'Harry';`\n\
    `another_stooge['middle-name'] = 'Moses';`\n`another_stooge.nickname = 'Moe';`\n\
    \nThe prototype link is used only in retrieval. If we try to retrieve a property\
    \ value from an object, and if the object lacks the property name, then JavaScript\
    \ attempts to retrieve the property value from the prototype object. And if that\
    \ object is lacking the prop, then it goes to *its* prototype, and so on until\
    \ the process finally bottoms out with `Object.prototype`. If the desired property\
    \ exists nowhere in the prototype chain, then the result is the `undefined` value.\
    \ This is called *delegation*.\n\nThe prototype relationship is a dynamic relationship.\
    \ If we add a new property to a prototype, that property will immediately be visible\
    \ in all of the objects that are based on that prototype:\n\n`stooge.profession\
    \ = 'actor';`\n`another_stooge.profession // 'actor'`\n\n[We will see more about\
    \ the prototype chain in Chapter 6](#index_split_000.html_p74)\n\n## Reflection\n\
    \nIt is easy to inspect an object to determine what properties it has by attempting\
    \ to retrieve the properties and examining the values obtained. The `typeof` operator\
    \ can be very helpful in determining the type of a property: `typeof flight.number\
    \ // 'number'`\n\n`typeof flight.status // 'string'`\n`typeof flight.arrival //\
    \ 'object'`\n`typeof flight.manifest // 'undefined'`\n\nSome care must be taken\
    \ because any property on the prototype chain can produce a value:\n\n`typeof\
    \ flight.toString // 'function'`\n`typeof flight.constructor // 'function'`\n\n\
    There are two approaches to dealing with these undesired properties. The first\
    \ is to have your program look for and reject function values. Generally, when\
    \ you are reflecting, you are interested in data, and you should be aware that\
    \ some values could be functions.\n\nThe other approach is to use the `hasOwnProperty`\
    \ method, which returns true if the object has a particular property. The `hasOwnProperty`\
    \ method does not look at the prototype chain:\n\n`flight.hasOwnProperty('number')\
    \ // true`\n`flight.hasOwnProperty('constructor') // false`\n\nReflection\n\n\
    |\n\n23\n\n## Enumeration\n\nThe `for` in statement can loop over all of the property\
    \ names in an object. The enumeration will include all of the properties—including\
    \ functions and prototype properties that you might not be interested in—so it\
    \ is necessary to filter out the values you don’t want. The most common filters\
    \ are the `hasOwnProperty` method and using `typeof` to exclude functions:\n\n\
    ```javascript\nvar name;\nfor (name in another_stooge) {\n  if (typeof another_stooge[name]\
    \ !== 'function') {\n    document.writeln(name + ': ' + another_stooge[name]);\n\
    \  }\n}\n```\n\nThere is no guarantee on the order of the names, so be prepared\
    \ for the names to appear in any order. If you want to assure that the properties\
    \ appear in a particular order, it is best to avoid the `for` in statement entirely\
    \ and instead make an array containing the names of the properties in the correct\
    \ order: `var i;`\n\n`var properties = [\n  'first-name',\n  'middle-name',\n\
    \  'last-name',\n  'profession'\n];`\n\n`for (i = 0; i < properties.length; i\
    \ += 1) {\n  document.writeln(properties[i] + ': ' + another_stooge[properties[i]]);\n\
    }`\n\nBy using `for` instead of `for in`, we were able to get the properties we\
    \ wanted without worrying about what might be dredged up from the prototype chain,\
    \ and we got them in the correct order.\n\n## Delete\n\nThe `delete` operator\
    \ can be used to remove a property from an object. It will remove a property from\
    \ the object if it has one. It will not touch any of the objects in the prototype\
    \ linkage.\n\nRemoving a property from an object may allow a property from the\
    \ prototype linkage to shine through:\n\n`another_stooge.nickname // 'Moe'`\n\
    `// Remove nickname from another_stooge, revealing`\n`// the nickname of the prototype.`\n\
    \n`delete another_stooge.nickname;`\n`another_stooge.nickname // 'Curly'`\n\n\
    24\n\n|\n\n## Chapter 3: Objects\n\n## Global Abatement\n\nJavaScript makes it\
    \ easy to define global variables that can hold all of the assets of your application.\
    \ Unfortunately, global variables weaken the resiliency of programs and should\
    \ be avoided.\n\nOne way to minimize the use of global variables is to create\
    \ a single global variable for your application: `var MYAPP = {};`\n\nThat variable\
    \ then becomes the container for your application: `MYAPP.stooge = {\n\"first-name\"\
    : \"Joe\",\n\"last-name\": \"Howard\"\n};`\n\n`MYAPP.flight = {\nairline: \"Oceanic\"\
    ,\nnumber: 815,\ndeparture: {\nIATA: \"SYD\",\ntime: \"2004-09-22 14:55\",\ncity:\
    \ \"Sydney\"\n},\narrival: {\nIATA: \"LAX\",\ntime: \"2004-09-23 10:42\",\ncity:\
    \ \"Los Angeles\"\n}\n};`\n\nBy reducing your global footprint to a single name,\
    \ you significantly reduce the chance of bad interactions with other applications,\
    \ widgets, or libraries. Your program also becomes easier to read because it is\
    \ obvious that `MYAPP.stooge` refers to a top-level structure. In the next chapter,\
    \ we will see ways to use `closure` for information hiding, which is another effective\
    \ global abatement technique.\n\nGlobal Abatement\n\n|\n\n25\n\n# CHAPTER 4\n\n\
    ## Functions\n\n*Why, every fault’s condemn’d ere it be done:*\n\n*Mine were the\
    \ very cipher of a function...*\n\n—William Shakespeare, *Measure for Measure*\n"
