  trans: "\n\n选项规范以 `/*jslint` 开头。注意在 `j` 之前没有空格。该规范包含一系列名称/值对，其中名称是 `JSLint` 选项，值是\
    \ `true` 或 `false`。选项规范的优先级高于选项对象。所有选项默认均为 `false`。表 C-1 列出了在使用 JSLint 时可用的选项。\n\
    \n### 表 C-1. JSLint 选项\n\n| 选项 | 含义 |\n| :--- | :--- |\n| adsafe | 如果应该强制 `ADsafe.org`\
    \ 规则，则为 true |\n| bitwise | 如果不允许位运算符，则为 true |\n| browser | 如果应该预定义标准浏览器全局变量，则为\
    \ true |\n| cap | 如果允许使用大写 HTML，则为 true |\n| debug | 如果允许 `debugger` 语句，则为 true\
    \ |\n| eqeqeq | 如果要求使用 `===`，则为 true |\n| evil | 如果允许 `eval`，则为 true |\n| forin\
    \ | 如果允许未过滤的 `for in` 语句片段，则为 true |\n| fragment | 如果允许 HTML 片段，则为 true |\n| laxbreak\
    \ | 如果不检查语句换行，则为 true |\n| nomen | 如果应该检查名称，则为 true |\n| on | 如果允许 HTML 事件处理程序，则为\
    \ true |\n| passfail | 如果遇到第一个错误就停止扫描，则为 true |\n| plusplus | 如果不允许 `++` 和 `--`，则为\
    \ true |\n| rhino | 如果应该预定义 `Rhino` 环境全局变量，则为 true |\n| undef | 如果 `undefined`\
    \ 全局变量是错误，则为 true |\n| white | 如果应用严格的空格规则，则为 true |\n| widget | 如果应该预定义 `Yahoo!\
    \ Widgets` 全局变量，则为 true |\n\n```\n/*JSLint comment\nname: JSLint true\n*/\noption:\
    \ string: false,\noption: /*global\n/*jslint\n/*members\n```\n\n### 分号\n\nJavaScript\
    \ 使用类 C 语法，需要使用分号来分隔语句。JavaScript 试图通过分号插入机制使分号变为可选。这是危险的。\n\n和 C 一样，JavaScript\
    \ 有 `++`、`--` 和 `&` 运算符，它们可以是前缀或后缀。歧消除是通过分号完成的。\n\n在 JavaScript 中，换行符可以是空白符，也可以充当分号。这用另一种歧义替换了另一种。\n\
    \nJSLint 期望每个语句后面都跟着 `;`，`for`、`function`、`if`、`switch`、`try` 和 `while` 除外。JSLint\
    \ 不期望看到不的分号或空语句。\n\n#### 换行\n\n为了进一步防止分号插入机制掩盖错误，JSLint 期望长语句仅在这些标点符号或运算符之一之后进行换行：\n\
    \n`, ; : { } ( [ = < > ? ! + - * / % ~ ^ | &`\n`== != <= >= += -= *= /= %= ^=\
    \ |= &= << >> || &&`\n`=== !== <<= >>= >>> >>>=`\n\nJSLint 不期望看到长语句在标识符、字符串、数字、结束符或后缀运算符之后换行：\n\
    \n`) ] . ++ --`\n\n---\n\n### 附录 C: JSLint\n\nJSLint 允许你开启“容忍松散换行”（`laxbreak`）选项。分号插入可能会掩盖复制/粘贴错误。如果你始终在运算符后换行，那么\
    \ JSLint 能够更好地发现这些错误。\n\n#### 逗号\n\n逗号运算符可能导致极其复杂的表达式。它还会掩盖一些编程错误。\n\nJSLint 期望看到逗号作为分隔符，而不是运算符（`for`\
    \ 语句的初始化和递部分除外）。它不期望在数组字面量中省略元素。不应使用额外的逗号。数组字面量或对象字面量的最后一个元素之后不应出现逗号，因为某些浏览器可能会产生误解。\n\
    \n#### 强制块\n\nJSLint 期望 `for` 语句将使用块——即用大括号 (`{}`) 包裹的语句。\n\nJavaScript 允许这样写\
    \ `if`：\n\n```javascript\nif (condition)\nstatement;\n```\n\n这种形式被认为在许多程序员编写同一段代码的项目中容易导致错误。这就是为什么\
    \ JSLint 期望使用块：\n\n```javascript\nif (condition) {\n  statements;\n}\n```\n\n\
    经验表明这种形式更具健壮性。\n\n#### 禁止块\n\n在许多语言中，块引入了作用域。在块中引入的变量在块外部可见。\n\n在 JavaScript 中，块不引入作用域。只有函数作用域。在函数任何地方引入变量在函数的任何地方都是可见的。JavaScript\
    \ 的块会误导经验丰富的程序员并导致错误，因为熟悉的语法产生了错误的承诺。\n\nJSLint 期望块仅出现在 `function`、`if`、`switch`、`while`、`for`、`do`\
    \ 和 `try` 语句中，其他地方不在。`else` 或 `for in` 上的无块 `if` 语句是一个例外。\n\n#### 表达式语句\n\n表达式语句应该是赋值、函数/方法调用或\
    \ `delete`。所有其他表达式语句都被视为错误。\n\n#### for in 语句\n\n`for in` 语句允许遍历对象所有属性的名称。遗憾的是，它还会遍历所有通过原型链继承的成员。这产生了一个糟糕的副作用：当感兴趣的是数据成员时，它却提供了方法函数。\n\
    \n每个 `for in` 语句的体都应该封装在一个带有过滤的 `if` 语句中。`if` 可以选择特定类型或范围的值，可以排除函数，也可以可以排除原型上的属性。例如：\n\
    \n```javascript\nfor (name in object) {\n  if (object.hasOwnProperty(name)) {\n\
    \    ....\n  }\n}\n```\n\n#### switch 语句\n\n`switch` 语句中常见的错误是忘记 `break` 语句，导致无意外的贯穿。JSLint\
    \ 期望在每个 `case` 或 `default` 之后都有一个 `break` 语句。\n\n#### var 语句\n\nJavaScript 允许\
    \ `var` 定义发生在函数的任何地方。JSLint 则更为严格。\n\nJSLint 期望：\n- `var` 仅声明一次，且在在使用之前声明。\n-\
    \ `function` 在使用之前声明。\n- 参数不会被声明为 `vars`。\n\nJSLint 不期望：\n- 将参数数组声明为 `var`。\n\
    - 在块中声明变量。这是因为块没有作用域。这可能会导致意外的后果，因此请在函数顶部定义所有变量。\n\n#### with 语句\n\n`with` 语句旨在为访问嵌套对象的成员提供简便方法。遗憾的是，它在设置新成员时表现非常糟糕。永远不要使用\
    \ `with` 语句。用 `var` 代替。\n\nJSLint 不期望看到 `with` 语句。\n\n#### =\n\nJSLint 不期望在 `if`\
    \ 或 `while` 语句的条件部分看到赋值语句。这是因为更有可能：\n\n```javascript\nif (a = b) {\n  ...\n}\n\
    ```\n\n本意是：\n\n```javascript\nif (a == b) {\n  ...\n}\n```\n\n如果你确实打算赋值，请将其放在另一对括号中：\n\
    \n```javascript\nif ((a = b)) {\n  ...\n}\n```\n\n#### == 和 !=\n\n`==` 和 `!=`\
    \ 运算符在比较之前会进行类型转换。这是糟糕的，因为它会导致 `' \\f\\r\\n\\t ' == 0` 为真。这可能会掩盖类型错误。\n\n与以下值比较时，始终使用\
    \ `===` 或 `!==` 运算符，它们不会进行类型转换：`0`、`''`、`undefined`、`null`、`false`、`true`。\n\n\
    如果你想要类型转换，请使用短形式。而不是：`(foo != 0)`\n\n直接说：`(foo)`\n\n而不是：`(foo == 0)`\n\n说：`(!foo)`\n\
    \n始终使用 `===` 和 `!==` 运算符是优选的。有一个“不允许 == 和 !=”（`eqeqeq`）选项，它要求在所有情况下都使用 `===` 和\
    \ `!==`。\n\n"
