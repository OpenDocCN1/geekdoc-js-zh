    By hiding the prototype jazz, it now looks a bit less alien. But have we really
    improved anything? We now have constructor functions that act like classes, but
    at the edges, there may be surprising behavior. There is no privacy; all properties
    are public. There is no access to super methods.


    Even worse, there is a serious hazard with the use of constructor functions. If
    you forget to include the `new` prefix when calling a constructor function, then
    `this` will not be bound to a new object. Sadly, this will be bound to the global
    object, so instead of augmenting your new object, you will be clobbering global
    variables. That is really bad. There is no compile warning, and there is no runtime
    warning.


    This is a serious design error in the language. To mitigate this problem, there
    is a convention that all constructor functions are named with an initial capital,
    and that nothing else is spelled with an initial capital. This gives us a prayer
    that visual inspection can find a missing `new`. A much better alternative is
    to not use `new` at all.


    The pseudoclassical form can provide comfort to programmers who are unfamiliar
    with JavaScript, but it also hides the true nature of the language. The classically
    inspired notation can induce programmers to compose hierarchies that are unnecessarily
    deep and complicated. Much of the complexity of class hierarchies is motivated
    by the constraints of static type checking. JavaScript is completely free of those
    constraints. In classical languages, class inheritance is the only form of code
    reuse.


    JavaScript has more and better options.


