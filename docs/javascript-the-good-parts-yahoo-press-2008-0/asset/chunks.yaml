    \ And setting the clock is a struggle. We cope with the complexity of feature-driven\
    \ design by finding and sticking with the good parts.\n\nIt would be nice if products\
    \ and programming languages were designed to have only good parts.\n\n100\n\n\
    |\n\n# Chapter 10: Beautiful Features \n\n## APPENDIX A: Awful Parts\n\n*That\
    \ will prove awful both in deed and word.*\n—William Shakespeare, *Pericles, Prince\
    \ of Tyre*\n\nIn this appendix, I present the problematic features of JavaScript\
    \ that are not easily avoided. You must be aware of these things and be prepared\
    \ to cope.\n\n### Global Variables\n\nThe worst of all of JavaScript’s bad features\
    \ is its dependence on global variables. A `global variable` is a variable that\
    \ is visible in every scope. Global variables can be a convenience in very small\
    \ programs, but they quickly become unwieldy as programs get larger. Because a\
    \ `global variable` can be changed by any part of the program at any time, they\
    \ can significantly complicate the behavior of the program. Use of global variables\
    \ degrades the reliability of the programs that use them.\n\nGlobal variables\
    \ make it harder to run independent subprograms in the same program. If the subprograms\
    \ happen to have global variables that share the same names, then they will interfere\
    \ with each other and likely fail, usually in difficult to diagnose ways.\n\n\
    Lots of languages have global variables. For example, Java’s `public static` members\
    \ are global variables. The problem with JavaScript isn’t just that it allows\
    \ them, it requires them. JavaScript does not have a linker. All compilation units\
    \ are loaded into a common global object.\n\nThere are three ways to define global\
    \ variables. The first is to place a `var` statement outside of any function:\n\
    \n```\nvar foo = value;\n```\n\nThe second is to add a property directly to the\
    \ global object. The global object is the container of all global variables. In\
    \ web browsers, the global object goes by the name `window`:\n\n```javascript\n\
    window.foo = value;\n```\n\n101\n\nThe third is to use a variable without declaring\
    \ it. This is called `implied global`: `foo = value;`\n\nThis was intended as\
    \ a convenience to beginners by making it unnecessary to declare variables before\
    \ using them. Unfortunately, forgetting to declare a variable is a very common\
    \ mistake. JavaScript’s policy of making forgotten variables global creates bugs\
    \ that can be very difficult to find.\n\n### Scope\n\nJavaScript’s syntax comes\
    \ from C. In all other C-like languages, a block (a set of statements wrapped\
    \ in curly braces) creates a scope. Variables declared in a block are not visible\
    \ outside of the block. JavaScript uses the block syntax, but does not provide\
    \ block scope: a variable declared in a block is visible everywhere in the function\
    \ containing the block. This can be surprising to programmers with experience\
    \ in other languages.\n\nIn most languages, it is generally best to declare variables\
    \ at the site of first use. That turns out to be a bad practice in JavaScript\
    \ because it does not have block scope. It is better to declare all variables\
    \ at the top of each function.\n\n### Semicolon Insertion\n\nJavaScript has a\
    \ mechanism that tries to correct faulty programs by automatically inserting semicolons.\
    \ Do not depend on this. It can mask more serious errors.\n\nIt sometimes inserts\
    \ semicolons in places where they are not welcome. Consider the consequences of\
    \ semicolon insertion on the `return` statement. If a `return` statement returns\
    \ a value, that value expression must begin on the same line as the `return`:\n\
    \n```javascript\nreturn\n{\n  status: true\n};\n```\n\nThis appears to return\
    \ an object containing a `status` member. Unfortunately, semicolon insertion turns\
    \ it into a statement that returns `undefined`. There is no warning that semicolon\
    \ insertion caused the misinterpretation of the program. The problem can be avoided\
    \ if the `{` is placed at the end of the previous line and not at the beginning\
    \ of the next line:\n\n```javascript\nreturn {\n  status: true\n};\n```\n\n102\n\
