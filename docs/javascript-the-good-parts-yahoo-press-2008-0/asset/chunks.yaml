  trans: "\n\n`JavaScript: The Good Parts` 封面上的动物是常见的橘蝶（`Danaus chrysippus`）。在亚洲以外，这种昆虫也被称为非洲金斑。它是一种中型蝴蝶，特征是亮橙色的翅膀，上面有六个黑斑点和交替的黑白条纹。\n\
    \n千年来，科学家和艺术家一直注意到它引人注目的外观。作家弗拉基米尔·纳博科夫（Vladimir Nabokov）——他一位著名的鳞翅学家——在《纽约时报》对\
    \ Alice Ford 的著作《Audubon’s Butterflies, Moths, and Other Studies》（The Studio Publications\
    \ 出版）一篇颇为严厉的书评中，对这种蝴蝶表达了赞赏之词。在书中，福德将 19 世纪奥杜邦时期之前及期间所作的图画标记为“科学上 [sic] 不成熟的”。\n\
    \n针对福德，纳博科夫写道：“这种不成熟完全是她自己的问题。她本可以参考约翰·阿伯特（John Abbot） 1797 年对北美鳞翅虫的惊人描绘，或者 18\
    \ 世纪和 19 世纪初德国鳞翅学家那些精美的图表。她本可以回到大约 33 世纪前的图特摩斯四世或阿蒙霍菲普三世的时代，在那里发现不是显而易见的圣甲虫，而是带有奇妙埃及蝴蝶的壁画（巧妙地结合了我们红粉蝶的纹理和非洲金斑蝶的身体）。”\n\
    \n虽然常见橘蝶的美是其魅力的一部分，但它的外也可能是致命的。\n\n在幼虫阶段，蝴蝶会摄入对鸟类（它的主要捕食者）有害的碱，鸟类通常会被这种昆虫的花纹所吸引。进食常见橘蝶后，鸟会反复呕吐——有时甚至是致命。如果鸟活下来，它会告诉其他鸟避开这种昆虫，这种昆虫也可以通过其贴近地面、悠闲蜿行的飞行模式来识别。\n\
    \n封面图像来自 `Dover’s Animals`。封面字体是 `Adobe ITC Garamond`。正文字体是 `Linotype Birka`；标题字体是\
    \ `Adobe Myriad Condensed`；代码字体是 `LucasFont’s TheSans Mono Condensed`。\n\n# 文档大纲\n\
