    \ `count[word]` 真值的测试不够具体。\n\n我们本可以写成：\n\n```javascript\nif (typeof count[word]\
    \ === 'number') {\n```\n\n# 附录 A：糟糕的部分\n\n# 附录 B：坏掉的部分\n\n*而，我祈求你告诉我，你究竟是爱我的哪一个坏点才先爱上我的？*\n\
    ——威廉·莎士比亚，《错事谐华》\n\n在这个附录中，我将介绍 JavaScript 中一些容易避免的缺陷特性。通过简单地避免这些特性，你可以让 JavaScript\
    \ 成为一种更好的语言，让自己成为一个更好的程序员。\n\n## ==\n\nJavaScript 有两组相等运算符：`===` 和 `!==`，以及它们的邪恶双胞胎\
    \ `==` 和 `!=`。好的运算符按照你预期的方式工作。如果两个操作数的类型相同且值相同，那么 `===` 产生 `true`，`!==` 产生 `false`。\n\
    \n当操作数类型相同时，这对邪恶双胞胎的表现是正确的；但如果它们类型不同，它们会尝试进行值转换。它们执行此操作的规则复杂且难以记忆。以下是一些有趣的用例：\n\
    \n```javascript\n'' == '0' // false\n0 == '' // true\n0 == '0' // true\nfalse\
    \ == 'false' // false\nfalse == '0' // true\nfalse == undefined // false\nfalse\
    \ == null // false\nnull == undefined // true\n' \\t\\r\\n ' == 0 // true\n```\n\
    \n缺乏传递性令人担忧。我的建议是永远不要使用这对邪恶双胞胎。相反，始终使用 `===` 和 `!==`。上面的所有比较使用 `===` 运算符都会产生 `false`。\n\
    \n## with 语句\n\nJavaScript 有 `with` 语句，旨在在访问对象属性时提供简写。遗憾的是，它的结果有时是不可预测的，因此应该避免使用。\n\
    \n该语句：\n\n```javascript\nwith (obj) {\n  a = b;\n}\n```\n\n的效果与以下代码相同：\n\n```javascript\n\
    if (obj.a === undefined) {\n  a = obj.b === undefined ? b : obj.b;\n} else {\n\
    \  obj.a = obj.b === undefined ? b : obj.b;\n}\n```\n\n所以，它等于这些语句中的某一个：\n\n```javascript\n\
    a = b;\na = obj.b;\nobj.a = b;\nobj.a = obj.b;\n```\n\n通过阅读程序无法判断将得到哪条语句。它可能会在程序的每次运行之间发生变化。它甚至在程序运行过程中都会发生变化。如果你无法阅读程序并理解它将要做什么，就不可能相信它能正确地执行你的要求。\n\
    \n仅仅是因为该语言的存在，`with` 语句显著放慢了 JavaScript 处理器的速度，因为它阻碍了变量名的词法绑定。它的初衷是好的，但如果语言中没有它会更好。\n\
    \n## eval\n\n`eval` 函数将字符串传递给 JavaScript 编译器并执行结果。\n\n它是 JavaScript 中最被误用的特性。它最常被那些对语言理解不完全的人使用。例如，如果你知道点表示法，但不知道下标表示法，你可能会写：\n\
