    **Using JSON Securely**


    JSON is particularly easy to use in web applications because JSON is JavaScript.
    A JSON text can be turned into a useful data structure with the eval function:
    var myData = eval(''('' + myJSONText + '')'');


    (The concatenation of the parentheses around the JSON text is a workaround for
    an ambiguity in JavaScript’s grammar.)


    The eval function has horrendous security problems, however. Is it safe to use
    eval to parse a JSON text? Currently, the best technique for obtaining data from
    a server in a web browser is through XMLHttpRequest. XMLHttpRequest can obtain
    data only from the same server that produced the HTML. evaling text from that
    server is no less secure than the original HTML. But, that assumes the server
    is malicious. What if the server is simply incompetent?'
