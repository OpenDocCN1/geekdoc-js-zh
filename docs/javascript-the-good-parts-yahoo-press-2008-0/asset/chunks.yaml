  trans: "\n\n更大的问题是测试一个值是否为对象。`typeof` 无法区分 `null` 和对象但你可以区分，因为 `null` 是虚值（falsy），而所有对象都是真值（truthy）：\n\
    \n```javascript\nif (my_value && typeof my_value === 'object') {\n  // my_value\
    \ is an object or an array!\n}\n```\n\n另参见章节“NaN”和“伪数组”。\n\n不同的实现对正则表达式对象的类型处理不一致。某些实现报告：\n\
    \n```\ntypeof /a/\n```\n\n为 'object'，而另一些则说它是 'function'。如果能报告为 'regexp' 可能更有用，但标准并不允许。\n\
    \n### parseInt\n\n`parseInt` 是一个将字符串转换为整数的函数。它在遇到非数字字符时停止，因此 `parseInt(\"16\"\
    )` 和 `parseInt(\"16 tons\")` 产生相同的结果。如果函数能以某种方式告知我们额外的文本就很好，但它并没有。\n\n如果字符串的第一个字符是\
    \ 0，则该字符串将以 8 进制而非 10 进制进行评估。在 8 进制中，8 和 9 不是数字，因此 `parseInt(\"08\")` 和 `parseInt(\"\
    09\")` 的结果均为 0。这个错误会导致解析日期和时间的程序出现问题。幸运的是，`parseInt` 可以接受一个进制参数（radix），使得 `parseInt(\"\
    08\",10)` 产生 8。我建议你始终提供进制参数。\n\n### +\n\n`+` 运算符可以执行加或拼接。它执行哪种取决于参数的类型。如果其中一个操作数为空字符串，它会产生另一个操作数转换为字符串的结果。如果两个操作数都是数字，它会产生和。否则，它将两个操作数转换为字符串并将其拼接。这种复杂的行为是\
    \ bug 的常见来源。如果你打算用 `+` 相加，请确保两个操作数都是数字。\n\n### 浮点数\n\n二进制浮点数不擅长处理小数，因此 `0.1 +\
    \ 0.2` 不等于 `0.3`。这是 JavaScript 中经常被报告的 bug，它是采用 IEEE 二进制浮点数运算标准（IEEE 754）的有意结果。该标准适用于许多应用，但它违反了你在中学中学到的关于数字的大部分知识。\n\
    \n### 104\n\n### |\n\n### 附录 A：糟糕的部分\n\n幸运的是，浮点中的整数算术是精确的，因此通过缩放可以避免小数表示误差。\n\n\
    例如，美元值可以通过乘以 100 转换为整数分值。然后可以精确地相加分。总和可以除以 100 转换回美元。人们在数钱时对结果的精确性有合理的预期。\n\n\
    ### NaN\n\n值 `NaN` 是 IEEE 754 定义的一个特殊量。它代表 *不是数字*（not a number），尽管：\n\n```javascript\n\
    typeof NaN === 'number' // true\n```\n\n当尝试将一个不符合数字格式的字符串转换为数字时，就会产生该值。例如：\n\n\
    ```javascript\n+ '0' // 0\n+ 'oops' // NaN\n```\n\n如果 `NaN` 是算术运算中的操作数，那么 `NaN`\
    \ 将是结果。因此，如果你有一链产生 `NaN` 结果的公式，那么至少有一个输入是 `NaN`，或者在某处生成了 `NaN`。\n\n你可以测试 `NaN`。正如我们所看到的，`typeof`\
    \ 无法区分数字和 `NaN`，事实证明 `NaN` 不等于它自己。所以，令人的是：\n\n```javascript\nNaN === NaN // false\n\
    NaN !== NaN // true\n```\n\nJavaScript 提供了一个 `isNaN` 函数可以区分数字和 `NaN`：\n\n```javascript\n\
    isNaN(NaN) // true\nisNaN(0) // false\nisNaN('oops') // true\nisNaN('0') // false\n\
    ```\n\n`isFinite` 函数是确定一个值是否可以作为数字的最佳方法，因为它拒绝了 `NaN` 和 `Infinity`。遗憾的是，`isFinite`\
    \ 会尝试将其操作数转换为数字，所以如果一个值实际上不是数字，它就一个好的测试。你可能想定义自己的 `isNumber` 函数：\n\n```javascript\n\
    var isNumber = function isNumber(value) {\n  return typeof value === 'number'\
    \ && isFinite(value);\n}\n```\n\n### 伪数组\n\nJavaScript 没有真正的数组。这并不是坏事。JavaScript\
    \ 的数组非常用用。不需要给它们指定维度，而且永远不会产生越界错误。但它们的性能可能比真正的数组糟糕得多。\n\n### 伪数组\n\n### |\n\n\
    ### 105\n\n`typeof` 运算符不区分数组和对象。要确定一个值是数组，你还需要咨询它的 `constructor` 属性：\n\n```javascript\n\
    if (my_value && typeof my_value === 'object' && my_value.constructor === Array)\
    \ {\n  // my_value is an array!\n}\n```\n\n如果数组是在不同的帧或窗口中创建的，该测试将产生假阴性。当值可能在另一个帧中创建时，这种测试更可靠：\n\
    \n```javascript\nif (Object.prototype.toString.apply(my_value) === '[object Array]'){\n\
    \  // my_value is truly an array!\n}\n```\n\n`arguments` 数组不是数组；它是一个带有 `length`\
    \ 成员的对象。这些测试不会将 `arguments` 数组识别为数组。\n\n### 虚值\n\nJavaScript 有一组惊人的虚值，如表 A-1 所示。\
    \ \n\n*表 A-1. JavaScript 的许多虚值*\n\n| 值 | 类型 |\n| --- | --- |\n| 0 | Number |\n\
    | NaN (not a number) | Number |\n| '' (empty string) | String |\n| false | Boolean\
    \ |\n| null | Object |\n| undefined | Undefined |\n\n这些值都是虚值，但它们不是可替代的。例如，这种判断对象是否缺少成员的方法是错误的：`value\
    \ = myObject[name];`。\n\n```javascript\nif (value == null) {\n  alert(name + '\
    \ not found.');\n}\n```\n\n`undefined` 是缺失成员的值，但该代码段测试的是 `null`。它使用了 `==` 运算符（参见\
    \ 附录 B），），该运算符会进行类型转换，而不是更可靠的 `===` 运算符。有时这两个错误会互相抵消。有时不会。\n\n### 106\n\n### |\n\
    \n### 附录 A：糟糕的部分\n\n`undefined` 和 `NaN` 不是常量。它们是全局变量，你可以它们的值。这本应是不可能的，但确实可以。不要这样做。\n\
    \n### hasProperty\n\n在第 3 章 中，`hasOwnProperty` 方法被用来解决 `for` 语句中的问题。遗憾的是，`hasOwnProperty`\
    \ 是一个方法而不是运算符，所以在任何对象中它都可以被替换为一个非函数的值：\n\n```javascript\nvar name;\nanother_stooge.hasOwnProperty\
    \ = null; // trouble\nfor (name in another_stooge) {\n  if (another_stooge.hasOwnProperty(name))\
    \ { // boom\n    document.writeln(name + ': ' + another_stooge[name]);\n  }\n\
    }\n```\n\n### Object\n\nJavaScript 对象从未为空，因为它们可以从原型链获取成员。有时这很重要。例如，假设你编写一个程序统计文本中每个单词出现的次数。我们可以使用\
    \ `toLowerCase` 方法将文本转换为小写，然后使用 `split` 方法配合正则表达式生成单词数组。然后我们可以遍历单词并统计每个单词出现的次数：\n\
    \n```javascript\nvar i;\nvar word;\nvar text = \"This oracle of comfort has so\
    \ pleased me, \" +\n\"That when I am in heaven I shall desire \" +\n\"To see what\
    \ this child does, \" +\n\"and praise my Constructor.\";\nvar words = text.toLowerCase(\
    \ ).split(/[\\s,.]+/);\nvar count = {};\nfor (i = 0; i < words.length; i += 1)\
    \ {\n  word = words[i];\n  if (count[word]) {\n    count[word] += 1;\n  } else\
    \ {\n    count[word] = 1;\n  }\n}\n```\n\n如果我们看结果，`count['this']` 是 2，`count.heaven`\
    \ 是 1，但 `count.constructor` 包含一个奇怪的字符串。原因是 `count` 对象继承自 `Object.prototype`，而\
    \ `Object.prototype` 包含一个名为 **Object** 的成员\n\n### |\n\n### 107\n\n其值为 `Object`\
    \ 的构造。`+=` 运算符像 `+` 运算符一样，当操作数不是数字时执行的是拼接而非加法。`Object` 是一个函数，所以 `+=` 以某种方式将其转换为字符串并在其屁股上拼接一个\
    \ 1。\n\n"
