    **Semicolon**


    JavaScript uses a C-like syntax, which requires the use of semicolons to delimit
    statements. JavaScript attempts to make semicolons optional with a semicolon insertion
    mechanism. This is dangerous.


    Like C, JavaScript has ++ and -- and ( operators, which can be prefixes or suffixes.


