    这与目前的时尚潮流径然不同。今天大多数语言都是*经典*的。原型继承具有强大的表达力，但并没有被广泛理解。\n\n`JavaScript` 本身对它的原型特性并不自信，因此它提供了一种让人想起经典语言的对象创建语法。很少有经典程序员认为原型继承是可以接受的，而这种受经典启发的语法掩盖了语言真正的原型本质。这简直是两得兼失。\n\
    \n```javascript\n// 创建一个名为 Quo 的构造函数。\n// 它创建一个带有 status 属性的对象。\n```\n\n"
