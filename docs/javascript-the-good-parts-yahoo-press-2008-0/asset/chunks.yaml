    ## Object Specifiers


    It sometimes happens that a constructor is given a very large number of parameters.


    This can be troublesome because it can be difficult to remember the order of arguments.
    In such cases, it can be friendlier if the constructor takes a single object,
    and the code is much easier to read. So, instead of:


    ```javascript

    var myObject = maker(f, l, m, s);

    ```


