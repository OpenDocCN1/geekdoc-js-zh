    | 85\n// 产生\n11.001001000011111101101010100010001000010110100011\n3.1103755242102643\n\
    3.243f6a8885a3\n3.141592653589793\n\n### Object\n`object.hasOwnProperty(name)`\n\
    如果 `object` 包含名为 `name` 的属性，则 `hasOwnProperty` 方法返回 true。\n\n该方法不会检查原型链。如果 `name`\
    \ 是 `hasOwnProperty`，则该方法无用：\n```javascript\nvar a = {member: true};\nvar b =\
    \ Object.create(a); // 来自第 3 章\nvar t = a.hasOwnProperty('member'); // t 为 true\n\
    var u = b.hasOwnProperty('member'); // u 为 false\nvar v = b.member; // v 为 true\n\
    ```\n\n### RegExp\n`regexp.exec(string)`\n`exec` 方法是使用正则表达式的方法中最强大（也是最慢）的一个。如果它成功匹配了\
    \ `regexp` 和 `string`，它将返回一个数组。数组的第 0 个元素将包含匹配 `regexp` 的字符串。第 1 个元素是分组 1 捕获的文本，第\
    \ 2 个元素是分组 2 捕获的文本，以此此类推。如果匹配失败，则返回 null。\n\n如果 `regexp` 带有 `g` 标记，情况会复杂一些。搜索不是从字符串索引\
    \ 0 开始，而是从 `regexp.lastIndex` 位置（初始为零）开始。如果匹配成功，`regexp.lastIndex` 将设置为匹配项后第一个字符的位置。如果匹配失败，`regexp.lastIndex`\
    \ 将重置为 0。\n\n这允许你通过在循环中调用 `exec` 来搜索字符串中模式的多次出现。有几点需要注意：如果你提前退出循环，必须在再次进入循环之前手动将\
    \ `regexp.lastIndex` 重置为 0。此外，`^` 因子仅在 `regexp.lastIndex` 为 0 时才匹配：\n\n```javascript\n\
    // 将简单的 html 文本拆分为标签和文本。\n// （实体化方法请参见 string.replace。）\n// 对于每个标签或文本，产生一个包含以下内容的数组\n\
    // [0] 完整的匹配标签或文本\n// [1] 如果存在，则为 /\n// [2] 标签名\n// [3] 如果存在，则为属性\nvar text =\
    \ '<html><body bgcolor=linen><p>' +\n'This is <b>bold<\\/b>!<\\/p><\\/body><\\\
    /html>'; // 86\n```\n\n第 8 章：方法\n```javascript\nvar tags = /[^<>]+|<(\\/?)([A-Za-z]+)([^<>]*)>/g;\
    \ var a, i;\n\nwhile ((a = tags.exec(text))) {\n  for (i = 0; i < a.length; i\
    \ += 1) {\n    document.writeln(('// [' + i + '] ' + a[i]).entityify( ));\n  }\n\
    \  document.writeln( );\n}\n// 结果：\n// [0] <html>\n// [1]\n// [2] html\n// [3]\n\
    // [0] <body bgcolor=linen>\n// [1]\n// [2] body\n// [3] bgcolor=linen\n// [0]\
    \ <p>\n// [1]\n// [2] p\n// [3]\n// [0] This is\n// [1] undefined\n// [2] undefined\n\
    // [3] undefined\n// [0] <b>\n// [1]\n// [2] b\n// [3]\n// [0] bold\n// [1] undefined\n\
    // [2] undefined\n// [3] undefined\n// [0] </body>\n// [1] /\n// [2] b\n// [3]\n\
    // [0] !\n// [1] undefined\n// [2] undefined\n// [3] undefined\n// [0] </p>\n\
    // [1] /\n// [2] p\n// [3]\n// [0] </body> // RegExp 87\n// [1] /\n// [2] body\n\
    // [3]\n// [0] </html>\n// [1] /\n// [2] html\n// [3]\n```\n\n`regexp.test(string)`\n\
    `test` 方法是使用正则表达式的方法中最简单（也是最快）的。如果 `regexp` 匹配 `string`，它返回 true；否则返回 false。不要在此方法上使用\
    \ `g` 标记：\n```javascript\nvar b = /&.+;/.test('frank &amp; beans'); // b 为 true\n\
    ```\ntest 可以实现为：\n```javascript\nRegExp.method('test', function (string) {\n \
    \ return this.exec(string) !== null;\n});\n```\n\n### String\n`string.charAt(pos)`\n\
    `charAt` 方法返回该 `string` 中位置 `pos` 上的字符。如果 `pos` 小于 0 或大于或等于 `string.length`，它返回空字符串。JavaScript\
    \ 没有字符类型。该方法的结果是一个字符串：\n```javascript\nvar name = 'Curly';\nvar initial = name.charAt(0);\
    \ // initial 为 'C'\n```\ncharAt 可以实现为：\n```javascript\nString.method('charAt',\
    \ function (pos) {\n  return this.slice(pos, pos + 1);\n});\n```\n\n`string.charCodeAt(pos)`\n\
    `charCodeAt` 方法与 `charAt` 相同，但它不是返回字符串，而是返回该 `string` 中位置 `pos` 处字符的码点值的整数表示。如果\
    \ `pos` 小于 0 或大于或等于 `string.length`，它返回 NaN：\n```javascript\nvar name = 'Curly';\n\
    var initial = name.charCodeAt(0); // initial 为 67\n```\n\n`string.concat(string...)`\n\
    `concat` 方法通过拼接其他字符串来创建一个新字符串。它很少被使用，因为 `+` 运算符更方便：\n```javascript\nvar s = 'C'.concat('a',\
    \ 't'); // s 为 'Cat'\n```\n\n`string.indexOf(searchString, position)`\n`indexOf`\
    \ 方法在 `string` 中搜索 `searchString`。如果找到，它返回第一个匹配字符的位置；否则返回 -1。可选的 `position` 参数导致搜索从字符串中的某个指定位置开始：//\
    \ 88\n```javascript\nvar text = 'Mississippi';\nvar p = text.indexOf('ss'); //\
    \ p 为 2\np = text.indexOf('ss', 3); // p 为 5\np = text.indexOf('ss', 6); // p\
    \ 为 -1\n```\n\n`string.lastIndexOf(searchString, position)`\n`lastIndexOf` 方法类似于\
    \ `indexOf` 方法，不同之处在于从字符串末尾而不是开头开始搜索：\n```javascript\nvar text = 'Mississippi';\n\
    var p = text.lastIndexOf('ss'); // p 为 5\np = text.lastIndexOf('ss', 3); // p\
    \ 为 2\np = text.lastIndexOf('ss', 6); // p 为 5\n```\n\n`string.localeCompare(that)`\n\
    `localeCompare` 方法比较两个字符串。字符串的规则未指定。如果此 `string` 小于 `that` 字符串，结果为负数。如果它们相等，结果为零。这与\
    \ `array` 的约定相似。\n```javascript\nvar m = ['a', 'A', 'aa', 'Aa', 'aaa'];\nm.sort(function\
    \ (a, b) {\n  return a.localeCompare(b);\n});\n// m（在某些区域设置下）如上\n```\n\n`string.match(regexp)`\n\
    `match` 方法匹配字符串和正则表达式。它的执行方式取决于 `g` 标记。如果没有 `g` 标记，则 `string.match(regexp)` 的结果与\
    \ `regexp.exec(string)` 相同。但如果 `regexp` 带有 `g` 标记，它会产生包含所有匹配项的数组，但排除捕获分组：\n```javascript\n\
    var text = '<html><body bgcolor=linen><p>' +\n'This is <b>bold<\\/b>!<\\/p><\\\
    /body><\\/html>'; var tags = /[^<>]+|<(\\/?)([A-Za-z]+)([^<>]*)>/g; var a, i;\n\
    \na = text.match(tags);\nfor (i = 0; i < a.length; i += 1) {\n  document.writeln(('//\
    \ [' + i + '] ' + a[i]).entityify( ));\n}\n// 结果为：\n// [0] <html>\n// [1] <body\
    \ bgcolor=linen>\n// [2] <p>\n// [3] This is\n// [4] <b>\n// [5] bold\n// [6]\
    \ </body>\n// [7] !\n// [8] </p>\n// [9] </body>\n// [10] </html>\n```\n\n`string.replace(searchValue,\
    \ replaceValue)`\n`replace` 方法对此 `string` 执行搜索和替换操作，产生一个新字符串。`searchValue` 参数可以是字符串或正则表达式对象。如果是字符串，则*仅*替换\
    \ `searchValue` 的第一个出现处，所以：\n```javascript\nvar result = \"mother_in_law\".replace('_',\
    \ '-'); //产生 \"mother-in_law\"，这可能会让人失望\n```\n如果 `searchValue` 是正则表达式且带有 `g` 标记，则它将替换所有出现处。如果它没有带有\
    \ `g` 标记，则只替换第一个出现处。\n\n`replaceValue` 可以是字符串或函数。如果 `replaceValue` 是字符串，字符 `$`\
    \ 有特殊含义：\n```javascript\n// 捕获括号内的 3 个数字\nvar oldareacode = /\\((\\d{3})\\)/g;\n\
    var p = '(555)666-1212'.replace(oldareacode, '$1-'); // p 为 '555-666-1212'\n```\n\
    \n### Dollar sequence\n| 序列 | 替换 |\n| --- | --- |\n| $$ | $ |\n| $& | 匹配文本 |\n\
    | $*number* | 捕获分组文本 |\n| $` | 匹配项前的文本 |\n| $' | 匹配项后的文本 |\n\n"
