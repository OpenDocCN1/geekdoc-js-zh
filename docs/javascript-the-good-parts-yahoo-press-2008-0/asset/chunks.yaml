    **Regular Expressions**


    *Whereas the contrary bringeth bliss,*


    *And is a pattern of celestial peace.*


    *Whom should we match with Henry, being a king...*


    —William Shakespeare, *The First Part of Henry the Sixth* Many of JavaScript’s
    features were borrowed from other languages. The syntax came from Java, functions
    came from Scheme, and prototypal inheritance came from Self.


    JavaScript’s Regular Expression feature was borrowed from Perl.


    A *regular expression* is the specification of the syntax of a simple language.
    Regular expressions are used with methods to search, replace, and extract information
    from strings. The methods that work with regular expressions are regexp.exec,
    regexp.test, string.match, string.replace, string.search, and string.split. These
    will all be described in [Chapter 8.](#index_split_000.html_p94) Regular expressions
    usually have a significant performance advantage over equivalent string operations
    in JavaScript.


