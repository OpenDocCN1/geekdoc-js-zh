    JavaScript, it is language independent. It can be used to exchange data between
    programs written in all modern programming languages. It is a text format, so
    it is readable by humans and machines. It is easy to implement and easy to use.
    There is a lot of material about JSON at [*http://www.JSON.org/*](http://www.JSON.org/).


    **JSON Syntax**


    JSON has six kinds of values: objects, arrays, strings, numbers, booleans (true
    and false), and the special value null. Whitespace (spaces, tabs, carriage returns,
    and newline characters) may be inserted before or after any value. This can make
    JSON


    texts easier for humans to read. Whitespace may be omitted to reduce transmission
    or storage costs.


    A JSON object is an unordered container of name/value pairs. A name can be any
    string. A value can be any JSON value, including arrays and objects. JSON objects
    can be nested to any depth, but generally it is most effective to keep them relatively
    flat. Most languages have a feature that maps easily to JSON objects, such as
    an object, struct, record, dictionary, hash table, property list, or associative
    array.


    The JSON array is an ordered sequence of values. A value can be any JSON value,
    including arrays and objects. Most languages have a feature that maps easily onto
    JSON arrays, such as an array, vector, list, or sequence.


    **136**


