    \ this.replace(/&([^&;]+);/g,\n      function (a, b) {\n        var r = entity[b];\n\
    \        return typeof r === 'string' ? r : a;\n      }\n    );\n  };\n}());\n\
    ```\n\nNotice the last line. We immediately invoke the function we just made with\
    \ the `()` operator. That invocation creates and returns the function that becomes\
    \ the `deentityify` method.\n\n```javascript\ndocument.writeln('&lt;&quot;&gt;'.deentityify(\
    \ )); // <\"> \n```\n\nThe module pattern takes advantage of function scope and\
    \ closure to create relationships that are binding and private. In this example,\
    \ only the `deentityify` method has access to the entity data structure.\n\nThe\
    \ general pattern of a module is a function that defines private variables and\
    \ functions; creates privileged functions which, through closure, will have access\
    \ to the private variables and functions; and that returns the privileged functions\
    \ or stores them in an accessible place.\n\nUse of the module pattern can eliminate\
    \ the use of global variables. It promotes information hiding and other design\
    \ practices. It is very effective in encapsulating applications and other singletons.\n\
    \nIt can also be used to produce objects that are secure. Let’s suppose we want\
    \ to make an object that produces a serial number:\n\n```javascript\nvar serial_maker\
    \ = function ( ) {\n  // Produce an object that produces unique strings. A\n \
    \ // unique string is made up of two parts: a prefix\n  // and a sequence number.\
    \ The object comes with\n  // methods for setting the prefix and sequence\n  //\
    \ number, and a gensym method that produces unique\n  // strings.\n  var prefix\
    \ = '';\n  var seq = 0;\n  return {\n    set_prefix: function (p) {\n      prefix\
    \ = String(p);\n    },\n    set_seq: function (s) {\n      seq = s;\n    },\n\
    \    gensym: function ( ) {\n      var result = prefix + seq;\n      seq += 1;\n\
    \      return result;\n    }\n  };\n};\n\nvar seqer = serial_maker( );\nseqer.set_prefix('Q');\n\
    seqer.set_seq(1000);\nvar unique = seqer.gensym( ); // unique is \"Q1000\"\n```\n"
