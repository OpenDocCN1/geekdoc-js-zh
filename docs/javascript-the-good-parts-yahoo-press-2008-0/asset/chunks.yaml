  trans: "\n\n# 第 8 章：方法\n\n```javascript\nreturn a < b ? -1 : 1;\n\n}\n\nreturn typeof\
    \ a < typeof b ? -1 : 1;\n\n});\n\n// m 是 [4, 8, 15, 16, 23, 42, 'a', 'aa', 'bb']\n\
    ```\n\n如果不区分大小写，那么你的比较函数应该在比较之前将操作数转换为小写。另请参见本章后半部分的 `string.localeCompare`。\n\
    \n通过更智能的比较函数，我们可以对对象数组进行排序。为了让通用情况更简单，我们将编写一个生成比较函数的函数：80\n\n```javascript\n//\
    \ 函数 by 接收一个成员名称字符串并返回\n// 一个比较函数，该函数可以用于排序\n// 包含该成员的对象数组。\nvar by = function\
    \ (name) {\n  return function (o, p) {\n    var a, b;\n    if (typeof o === 'object'\
    \ && typeof p === 'object' && o && p) {\n      a = o[name];\n      b = p[name];\n\
    \      if (a === b) {\n        return 0;\n      }\n      if (typeof a === typeof\
    \ b) {\n        return a < b ? -1 : 1;\n      }\n      return typeof a < typeof\
    \ b ? -1 : 1;\n    } else {\n      throw {\n        name: 'Error',\n        message:\
    \ '按 ' + name + ' 排序时预期一个对象';\n      };\n    }\n  };\n};\n\nvar s = [\n  {first:\
    \ 'Joe', last: 'Besser'},\n  {first: 'Moe', last: 'Howard'},\n  {first: 'Joe',\
    \ last: 'DeRita'},\n  {first: 'Shemp', last: 'Howard'},\n  {first: 'Larry', last:\
    \ 'Fine'},\n  {first: 'Curly', last: 'Howard'}\n];\ns.sort(by('first')); // s\
    \ 是 [\n// {first: 'Curly', last: 'Howard'},\n// {first: 'Joe', last: 'DeRita'},\n\
    // {first: 'Joe', last: 'Besser'},\n// {first: 'Larry', last: 'Fine'},\n// {first:\
    \ 'Moe', last: 'Howard'},\n// {first: 'Shemp', last: 'Howard'}\n// ]\n```\n\n\
    `sort` 方法不是稳定的，因此：\n`s.sort(by('first')).sort(by('last'));` 无法保证产生正确的顺序。如果你想对多个键进行排序，你仍然需要做更多工作。我们可以修改\
    \ `by` 使其接收第二个参数，即另一个比较方法，该方法会在主键产生匹配时被调用以打破平局：\n\n```javascript\n// 函数 by 接收一个成员名称字符串和一个\n\
    // 可选的次要比较函数，并返回\n// 一个比较函数，可以用于排序\n// 包含该成员的对象数组。次要比较函数\n// 用于在 o[name] 和 p[name]\
    \ 相同时打破平局。\nvar by = function (name, minor) {\n  return function (o, p) {\n  \
    \  var a, b;\n    if (o && p && typeof o === 'object' && typeof p === 'object')\
    \ {\n      a = o[name];\n      b = p[name];\n      if (a === b) {\n        return\
    \ typeof minor === 'function' ? minor(o, p) : 0;\n      }\n      if (typeof a\
    \ === typeof b) {\n        return a < b ? -1 : 1;\n      }\n      return typeof\
    \ a < typeof b ? -1 : 1;\n    } else {\n      throw {\n        name: 'Error',\n\
    \        message: '按 ' + name + ' 排序时预期一个对象';\n      };\n    }\n  };\n};\n\ns.sort(by('last',\
    \ by('first'))); // s 是 [\n// {first: 'Joe', last: 'Besser'},\n// {first: 'Joe',\
    \ last: 'DeRita'},\n// {first: 'Larry', last: 'Fine'},\n// {first: 'Curly', last:\
    \ 'Howard'},\n// {first: 'Moe', last: 'Howard'},\n// {first: 'Shemp', last: 'Howard'}\n\
    // ]\n```\n\n## 数组\n\n`array.splice(start, deleteCount, item...)`\n`splice` 方法从\
    \ `array` 中删除元素，并用新的 `item` 替换它们。`start` 参数是 `array` 中位置的数字。`deleteCount` 参数是从该位置开始删除的元素个数。如果有额外的参数，这些\
    \ `item` 将被插入到该位置。它返回一个包含被删除元素的数组。\n\n`splice` 最流行的用法是从数组中删除元素。不要将 `splice` 与\
    \ `slice` 混淆：\n\n```javascript\nvar a = ['a', 'b', 'c'];\nvar r = a.splice(1,\
    \ 1, 'ache', 'bug');\n// a 是 ['a', 'ache', 'bug', 'c']\n// r 是 ['b']\n```\n\n\
    `splice` 可以这样实现：\n\n```javascript\nArray.method('splice', function (start, deleteCount)\
    \ {\n  var max = Math.max,\n      min = Math.min,\n      delta,\n      element,\n\
    \      insertCount = max(arguments.length - 2, 0), k = 0,\n      len = this.length,\n\
    \      new_len,\n      result = [],\n      shift_count;\n  start = start || 0;\n\
    \  if (start < 0) {\n    start += len;\n  }\n  start = max(min(start, len), 0);\n\
    \  deleteCount = max(min(typeof deleteCount === 'number' ? deleteCount : len -\
    \ start), 0);\n  delta = insertCount - deleteCount;\n  new_len = len + delta;\n\
    \  while (k < deleteCount) {\n    element = this[start + k];\n    if (element\
    \ !== undefined) {\n      result[k] = element;\n    }\n    k += 1;\n  }\n  shift_count\
    \ = len - start - deleteCount;\n  if (delta < 0) {\n    k = start + insertCount;\n\
    \    while (shift_count) {\n      this[k] = this[k - delta];\n      k += 1;\n\
    \      shift_count -= 1;\n    }\n    this.length = new_len;\n  } else if (delta\
    \ > 0) {\n    k = 1;\n    while (shift_count) {\n      this[k] = this[k - delta];\n\
    \      k += 1;\n      shift_count -= 1;\n    }\n    this.length = new_len;\n \
    \ }\n```\n"
- fmt: "\n```javascript\ndocument.writeln(Math.PI.toString( ));\n```\n\n### Number\n\
    | 85\n// Produces\n11.001001000011111101101010100010001000010110100011\n3.1103755242102643\n\
    3.243f6a8885a3\n3.141592653589793\n\n### Object\n`object.hasOwnProperty(name)`\n\
    The `hasOwnProperty` method returns true if the `object` contains a property having\
    \ the `name`.\n\nThe prototype chain is not examined. This method is useless if\
    \ the `name` is `hasOwnProperty`:\n```javascript\nvar a = {member: true};\nvar\
    \ b = Object.create(a); // from Chapter 3\nvar t = a.hasOwnProperty('member');\
    \ // t is true\nvar u = b.hasOwnProperty('member'); // u is false\nvar v = b.member;\
    \ // v is true\n```\n\n### RegExp\n`regexp.exec(string)`\nThe `exec` method is\
    \ the most powerful (and slowest) of the methods that use regular expressions.\
    \ If it successfully matches the `regexp` and the `string`, it returns an array.\
    \ The 0 element of the array will contain the substring that matched the `regexp`.\
    \ The 1 element is the text captured by group 1, the 2 element is the text captured\
    \ by group 2, and so on. If the match fails, it returns null.\n\nIf the `regexp`\
    \ has a `g` flag, things are a little more complicated. The searching begins not\
    \ at position 0 of the string, but at position `regexp.lastIndex` (which is initially\
    \ zero). If the match is successful, then `regexp.lastIndex` will be set to the\
    \ position of the first character after the match. An unsuccessful match resets\
    \ `regexp.lastIndex` to 0.\n\nThis allows you to search for several occurrences\
    \ of a pattern in a string by calling `exec` in a loop. There are a couple things\
    \ to watch out for. If you exit the loop early, you must reset `regexp.lastIndex`\
    \ to 0 yourself before entering the loop again. Also, the `^` factor matches only\
    \ when `regexp.lastIndex` is 0:\n\n```javascript\n// Break a simple html text\
    \ into tags and texts.\n// (See string.replace for the entityify method.)\n//\
    \ For each tag or text, produce an array containing\n// [0] The full matched tag\
    \ or text\n// [1] The /, if there is one\n// [2] The tag name\n// [3] The attributes,\
    \ if any\nvar text = '<html><body bgcolor=linen><p>' +\n'This is <b>bold<\\/b>!<\\\
    /p><\\/body><\\/html>'; // 86\n```\n\nChapter 8: Methods\n```javascript\nvar tags\
    \ = /[^<>]+|<(\\/?)([A-Za-z]+)([^<>]*)>/g; var a, i;\n\nwhile ((a = tags.exec(text)))\
    \ {\n  for (i = 0; i < a.length; i += 1) {\n    document.writeln(('// [' + i +\
    \ '] ' + a[i]).entityify( ));\n  }\n  document.writeln( );\n}\n// Result:\n//\
    \ [0] <html>\n// [1]\n// [2] html\n// [3]\n// [0] <body bgcolor=linen>\n// [1]\n\
    // [2] body\n// [3] bgcolor=linen\n// [0] <p>\n// [1]\n// [2] p\n// [3]\n// [0]\
    \ This is\n// [1] undefined\n// [2] undefined\n// [3] undefined\n// [0] <b>\n\
    // [1]\n// [2] b\n// [3]\n// [0] bold\n// [1] undefined\n// [2] undefined\n//\
    \ [3] undefined\n// [0] </b>\n// [1] /\n// [2] b\n// [3]\n// [0] !\n// [1] undefined\n\
    // [2] undefined\n// [3] undefined\n// [0] </p>\n// [1] /\n// [2] p\n// [3]\n\
    // [0] </body> // RegExp 87\n// [1] /\n// [2] body\n// [3]\n// [0] </html>\n//\
    \ [1] /\n// [2] html\n// [3]\n```\n\n`regexp.test(string)`\nThe `test` method\
    \ is the simplest (and fastest) of the methods that use regular expressions. If\
    \ the `regexp` matches the `string`, it returns true; otherwise, it returns false.\
    \ Do not use the `g` flag with this method:\n```javascript\nvar b = /&.+;/.test('frank\
    \ &amp; beans'); // b is true\n```\ntest could be implemented as:\n```javascript\n\
    RegExp.method('test', function (string) {\n  return this.exec(string) !== null;\n\
    });\n```\n\n### String\n`string.charAt(pos)`\nThe `charAt` method returns the\
    \ character at position `pos` in this `string`. If `pos` is less than zero or\
    \ greater than or equal to `string.length`, it returns the empty string. JavaScript\
    \ does not have a character type. The result of this method is a string:\n```javascript\n\
    var name = 'Curly';\nvar initial = name.charAt(0); // initial is 'C'\n```\ncharAt\
    \ could be implemented as:\n```javascript\nString.method('charAt', function (pos)\
    \ {\n  return this.slice(pos, pos + 1);\n});\n```\n\n`string.charCodeAt(pos)`\n\
    The `charCodeAt` method is the same as `charAt` except that instead of returning\
    \ a string, it returns an integer representation of the code point value of the\
    \ character at position `pos` in that `string`. If `pos` is less than zero or\
    \ greater than or equal to `string.length`, it returns NaN:\n```javascript\nvar\
    \ name = 'Curly';\nvar initial = name.charCodeAt(0); // initial is 67\n```\n\n\
    `string.concat(string...)`\nThe `concat` method makes a new string by concatenating\
    \ other strings together. It is rarely used because the `+` operator is more convenient:\n\
    ```javascript\nvar s = 'C'.concat('a', 't'); // s is 'Cat'\n```\n\n`string.indexOf(searchString,\
    \ position)`\nThe `indexOf` method searches for a `searchString` within a `string`.\
    \ If it is found, it returns the position of the first matched character; otherwise,\
    \ it returns –1. The optional `position` parameter causes the search to begin\
    \ at some specified position in the `string`: // 88\n```javascript\nvar text =\
    \ 'Mississippi';\nvar p = text.indexOf('ss'); // p is 2\np = text.indexOf('ss',\
    \ 3); // p is 5\np = text.indexOf('ss', 6); // p is -1\n```\n\n`string.lastIndexOf(searchString,\
    \ position)`\nThe `lastIndexOf` method is like the `indexOf` method, except that\
    \ it searches from the end of the string instead of the front:\n```javascript\n\
    var text = 'Mississippi';\nvar p = text.lastIndexOf('ss'); // p is 5\np = text.lastIndexOf('ss',\
    \ 3); // p is 2\np = text.lastIndexOf('ss', 6); // p is 5\n```\n\n`string.localeCompare(that)`\n\
    The `localeCompare` method compares two strings. The rules for how the strings\
    \ are compared are not specified. If this `string` is less than `that` string,\
    \ the result is negative. If they are equal, the result is zero. This is similar\
    \ to the convention for the `array`.\n```javascript\nvar m = ['a', 'A', 'aa',\
    \ 'Aa', 'aaa'];\nm.sort(function (a, b) {\n  return a.localeCompare(b);\n});\n\
    // m (in some locale) is as above\n```\n\n`string.match(regexp)`\nThe `match`\
    \ method matches a string and a regular expression. How it does depends on `g`\
    \ flag. If there is no `g` flag, then the result of `string.match(regexp)` is\
    \ the same as `regexp.exec(string)`. However, if the `regexp` has the `g` flag,\
    \ then it produces an array of all the matches but excludes capturing groups:\n\
    ```javascript\nvar text = '<html><body bgcolor=linen><p>' +\n'This is <b>bold<\\\
    /b>!<\\/p><\\/body><\\/html>'; var tags = /[^<>]+|<(\\/?)([A-Za-z]+)([^<>]*)>/g;\
    \ var a, i;\n\na = text.match(tags);\nfor (i = 0; i < a.length; i += 1) {\n  document.writeln(('//\
    \ [' + i + '] ' + a[i]).entityify( ));\n}\n// The result is:\n// [0] <html>\n\
    // [1] <body bgcolor=linen>\n// [2] <p>\n// [3] This is\n// [4] <b>\n// [5] bold\n\
    // [6] </body>\n// [7] !\n// [8] </p>\n// [9] </body>\n// [10] </html>\n```\n\n\
    `string.replace(searchValue, replaceValue)`\nThe `replace` method does a search\
    \ and replace operation on this `string`, producing a new string. The `searchValue`\
    \ argument can be a string or a regular expression object. If it is a string,\
    \ *only* the first occurrence of the `searchValue` is replaced, so:\n```javascript\n\
    var result = \"mother_in_law\".replace('_', '-'); // produces \"mother-in_law\"\
    , which might be a disappointment\n```\nIf `searchValue` is a regular expression\
    \ and if it has the `g` flag, then it will replace all occurrences. If it does\
    \ not have the `g` flag, then it will replace only the first occurrence.\n\nThe\
    \ `replaceValue` can be a string or a function. If `replaceValue` is a string,\
    \ the character `$` has special meaning:\n```javascript\n// Capture 3 digits within\
    \ parens\nvar oldareacode = /\\((\\d{3})\\)/g;\nvar p = '(555)666-1212'.replace(oldareacode,\
    \ '$1-'); // p is '555-666-1212'\n```\n\n### Dollar sequence\n| Sequence | Replacement\
    \ |\n| --- | --- |\n| $$ | The $ |\n| $& | The matched text |\n| $*number* | Capture\
    \ group text |\n| $` | The text preceding the match |\n| $' | The text following\
    \ the match |\n"
