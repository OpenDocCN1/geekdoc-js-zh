    The danger can be avoided by using the JSON.parse method instead of eval (see
    [*http://*](http://www.JSON.org/json2.js)


    [*www.JSON.org/json2.js*).](http://www.JSON.org/json2.js) JSON.parse will throw
    an exception if the text contains anything dangerous. It is recommended that you
    always use JSON.parse instead of eval to defend against server incompetence. It
    is also good practice for the day when the browser provides safe data access to
    other servers.


    **Using JSON Securely**


