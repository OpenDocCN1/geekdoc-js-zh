    \ 获取。本书描述的语言是 ECMAScript 的一个真子集。本书没有描述整门语言，因为它去掉了糟糕的部分。这里的处理并非详尽。它避开了边缘情况。你也应该这样做。边缘处充满了危险和痛苦。\n\
    \n附录 C 描述了一个名为 JSLint 的编程工具，它是一个 JavaScript 解析器，可以分析 JavaScript 程序并报告其中包含的糟糕部分。JSLint\
    \ 提供了 JavaScript 开发中通常缺乏的严谨性。它能让你确信你的程序只包含良好的部分。\n\nJavaScript 是一门充满鲜明对比的语言。它包含许多错误和尖锐的边缘，所以你可能会想：“我为什么要用\
    \ JavaScript？”有两个答案。第一个答案是你没有选择。Web 已经成为应用开发的重要平台，而 JavaScript 是唯一在所有浏览器中都存在的语言。遗憾的是，Java\
    \ 在那个环境下失败了；如果它没有失败，那么对于渴望强类型经典语言的人来说可能就有一个选择了。但 Java 确实失败了，而 JavaScript 正在蓬勃发展，这证明了\
    \ JavaScript 在某些方面是做得正确的。\n\n另一个答案是，尽管存在缺陷，*JavaScript 真的非常优秀*。它轻量级且富有表现力。一旦你掌握了它，函数式编程会非常有趣。\n\
    \n但为了用好这门语言，你必须充分了解它的局限性。我会以某种粗暴的方式强调这些局限性。不要让这让你气馁。良好的部分足以补偿糟糕的部分。\n\n## 一个简单的测试场\n\
    \n如果你有一个 Web 浏览器和任何文本编辑器，你就拥有了运行 JavaScript 程序所需的所有工具。首先，创建一个名为 `program.html`\
    \ 的 HTML 文件：\n\n```html\n<html><body><pre><script src=\"program.js\">\n\n</script></pre></body></html>\n\
    ```\n\n然后，在同一目录下创建一个名为 `program.js` 的文件：\n`document.writeln('Hello, world!');`\n\
    \n接下来，在浏览器中打开你的 HTML 文件查看结果。在整本书中，使用 `method` 方法来定义新方法。它的定义如下：\n\n```javascript\n\
    Function.prototype.method = function (name, func) {\n  this.prototype[name] =\
    \ func;\n  return this;\n};\n```\n\n将在第 4 章中解释。\n\n# 第 1 章：良好的部分\n\n## 第 2 章：语法\n\
    \n*我很熟悉它：*\n*我很久以前就在语法中读过它。*\n——威廉·莎士比亚，《提图斯·安德洛尼库》本章介绍了 JavaScript 良好部分的语法，提供了语言结构的快速概述。我们将使用铁路图（railroad\
    \ diagrams）来表示语法。\n\n解释这些图的规则很简单：\n\n• 从左边缘开始，沿着轨道移动到右边缘。\n• 在移动过程中，会在椭圆形中遇到字面量，在矩形中遇到规则或描述。\n\
    • 任何可以通过轨道完成的序列都是合法的。\n• 任何无法通过轨道完成的序列都是不合法的。\n• 两端各有一个杠的铁路图允许在任意两个标记之间插入空白。两端各有两个杠的铁路图则不允许。\n\
    \n本章介绍的良好部分的语法比整门语言的语法简单得多。\n\n### 空格\n\n空白可以采取格式化字符或注释的形式。空白通常是无关紧要，但有时需要使用空白来分隔否则会合并成单个标记的字符序列。例如，在：\n\
    \n```javascript\nvar that = this;\n```\n\n`var` 和 `that` 之间的空格不能删除，但其他空格可以删除。\n\
    \n***whitespace***\n***space***\n***tab***\n***line***\n***end***\n/\n/\n***any\
    \ character***\n***except line end***\n***any character***\n*\n***except*** *\
    \ ***and*** /\n/\n*\n\nJavaScript 提供了两种形式的注释：用 `/* */` 形成的块注释和以 `//` 开行的行注释。大量使用注释来提高程序的可读性。确保注释始终准确描述代码。过时的注释比没有注释糟。\n\
    \n`/* */` 形式的块注释来自一种名为 PL/I 的语言。PL/I 选择这些奇怪的组合作为注释符号，是因为它们在该语言的程序中不太出现，除非是在字符串字面量中。在\
    \ JavaScript 中，这些组合也可能出现在正则表达式字面量中，因此块注释对于注释代码块是不安全的。例如：\n\n```javascript\n/*\n\
    var rm_a = /a*/\n```\n`*/` 会导致语法错误。因此，建议避免 `/* */` 注释，改用 `//` 注释。\n\n### 标识\n\n\
    名称是一个字母，后面跟着更多字母、数字或下划线。名称不能是这些保留字：\n\n`abstract`, `boolean`, `break`, `byte`,\
    \ `case`, `char`, `class`, `const`, `continue`, `debugger`, `default`, `do`, `double`,\
    \ `else`, `enum`, `export`, `extends`, `false`, `final`, `finally`, `float`, `for`,\
    \ `function`, `goto`, `if`, `implements`, `import`, `in`, `instanceof`, `int`,\
    \ `interface`, `long`, `new`, `null`, `package`, `private`, `protected`, `public`,\
    \ `return`, `short`, `static`, `super`, `switch`, `synchronized`, `this`, `throw`,\
    \ `throws`, `transient`, `true`, `try`, `typeof`, `var`, `volatile`, `void`, `while`,\
    \ `with`。\n\n大多数保留字都没有使用。不允许使用保留字命名变量或参数。糟糕的是，不允许在对象字面量或点之后使用保留字作为对象的属性名。名称用于语句、变量、参数、属性名、运算符和标签。\n\
    \n### 数字\n\nJavaScript 只有一种数字类型。在内部，没有独立的整数类型，因此 `1` 和 `1.0` 是相同的值。这是一个巨大的便利，因为完全避免了短整数溢出的问题，而且你对数字唯一知道的就是它是一个数字。避免了一大类数值类型错误。\n\
    \n# 数字\n\n| | 7\n\n`0`\n***integer***\n***any digit***\n***except*** 0\n***digit***\n\
    ***fraction***\n`.`\n***digit***\n***exponent***\n`e`\n`+`\n***digit***\n`E`\n\
    `-`\n\n如果数字字面量带有指数部分，则字面量的值通过 `e` 之前的部分乘以 10 的 `e` 之后的次方计算得出。所以 `100` 和 `1e2`\
    \ 是同一个数字。\n\n可以使用 `–` 前缀运算符形成负数。\n\n`NaN` 值是一个数值，是无法产生正常结果的操作的结果。`NaN` 不等于任何值，包括它本身。你可以用\
    \ `isNaN(number*)` 函数检测 `NaN`。\n\n`Infinity` 值表示所有大于 `1.79769313486231570e+308`\
    \ 的值。\n\n"
- fmt: "\nNumbers have methods (see [Chapter 8]). JavaScript has a `Math` object that\
    \ contains a set of methods that act on numbers. For example, the `Math.floor(number)`\
    \ method can be used to convert a number into an integer.\n\n## Strings\n\nA string\
    \ literal can be wrapped in single quotes or double quotes. It can contain zero\
    \ or more characters. The \\ (backslash) is the escape character. JavaScript was\
    \ built at a time when Unicode was a 16-bit character set, so all characters in\
    \ JavaScript are 16 bits wide.\n\nJavaScript does not have a character type. To\
    \ represent a character, make a string with just one character in it.\n\n### String\
    \ Literals\n\n| Type | Description |\n| :--- | :--- |\n| `string literal` | any\
    \ Unicode character except `\"` and `\\` and control character; escaped character\
    \ |\n| `string literal` | any Unicode character except `'` and `\\` and control\
    \ character; escaped character |\n| `escaped character` | `\\` |\n| `\"` | double\
    \ quote |\n| `'` | single quote |\n| `\\` | backslash |\n| `/` | slash |\n| `b`\
    \ | backspace |\n| `f` | formfeed |\n| `n` | new line |\n| `r` | carriage return\
    \ |\n| `t` | tab |\n| `u` | 4 hexadecimal digits |\n\nThe escape sequences allow\
    \ for inserting characters into strings that are not normally permitted, such\
    \ as backslashes, quotes, and control characters. The `\\u` convention allows\
    \ for specifying character code points numerically.\n\n```\n\"A\" === \"\\u0041\"\
    \n```\n\nStrings have a `length` property. For example, `\"seven\".length` is\
    \ 5.\n\nStrings are immutable. Once it is made, a string can never be changed.\
    \ But it is easy to make a new string by concatenating other strings together\
    \ with the `+` operator.\n\nTwo strings containing exactly the same characters\
    \ in the same order are considered to be the same string. So:\n\n```javascript\n\
    'c' + 'a' + 't' === 'cat'\n```\nis true.\n\n[Strings have methods (see Chapter\
    \ 8).]\n\n```javascript\n'cat'.toUpperCase() === 'CAT'\n```\n\n## Statements\n\
    \nA compilation unit contains a set of executable statements. In web browsers,\
    \ each `<script>` tag delivers a compilation unit that is compiled and immediately\
    \ executed.\n\nLacking a linker, JavaScript throws them all together in a common\
    \ global namespace. There is more on global variables in [Appendix A].\n\nWhen\
    \ used inside of a function, the `var` statement defines the function’s private\
    \ variables.\n\nThe `switch`, `while`, `for`, and `do` statements are allowed\
    \ to have an optional *label* prefix that interacts with the `break` statement.\n\
    \nStatements tend to be executed in order from top to bottom. The sequence of\
    \ execution can be altered by the conditional statements (`if` and `switch`),\
    \ by the looping statements (`while`, `for`, and `do`), by the disruptive statements\
    \ (`break`, `return`, and `throw`), and by function invocation.\n\nA block is\
    \ a set of statements wrapped in curly braces. Unlike many other languages, blocks\
    \ in JavaScript do not create a new scope, so variables should be defined at the\
    \ top of the function, not in blocks.\n\nThe `if` statement changes the flow of\
    \ the program based on the value of the expression. The *then* block is executed\
    \ if the expression is *truthy*; otherwise, the optional `else` branch is taken.\n\
    \n### Statement Syntax\n\n| Structure | Syntax |\n| :--- | :--- |\n| `var statements`\
    \ | `var name = expression;` |\n| `expression statement` | `expression;` |\n|\
    \ `disruptive statement` | `break`, `return`, `throw` |\n| `try statement` | `try\
    \ { block } catch (name) { block }` |\n| `label` | `name:` |\n| `if statement`\
    \ | `if (expression) { block } else { block }` |\n| `switch statement` | `switch\
    \ (expression) { case clause: statements }` |\n| `while statement` | `while (expression)\
    \ { block }` |\n| `for statement` | `for (initialization; condition; increment)\
    \ { block }` |\n| `do statement` | `do { block } while (expression);` |\n| `block`\
    \ | `{ statements }` |\n\n### Falsy Values\n\nHere are the *falsy* values:\n*\
    \ `false`\n* `null`\n* `undefined`\n* The empty string `''`\n* The number `0`\n\
    * The number `NaN`\n\nAll other values are truthy, including `true`, the string\
    \ `'false'`, and all objects.\n\n### Switch Statement\n\nThe `switch` statement\
    \ performs a multiway branch. It compares the expression for equality with all\
    \ of the specified cases. The expression can produce a number or a string. When\
    \ an exact match is found, the statements of the matching case clause are executed.\
    \ If there is no match, the optional `default` statements are executed.\n\nA `case\
    \ clause` contains one or more case expressions. The case expressions need not\
    \ be constants. The statement following a clause should be a disruptive statement\
    \ to prevent fall-through into the next case. The `break` statement can be used\
    \ to exit from a `switch`.\n\n### While Statement\n\nThe `while` statement performs\
    \ a simple loop. If the expression is falsy, then the loop will break. While the\
    \ expression is truthy, the block will be executed.\n\n### For Statement\n\nThe\
    \ `for` statement is a more complicated looping statement. It comes in two forms.\n\
    \nThe conventional form is controlled by three optional clauses: the *initialization*,\
    \ the *condition*, and the *increment*. First, the initialization is done, which\
    \ typically initializes the loop variable. Then, the *condition* is evaluated.\
    \ Typically, this tests the loop variable against a completion criterion. If the\
    \ *condition* is omitted, then a *condition* of `true` is assumed. If the *condition*\
    \ is falsy, the loop breaks. Otherwise, the block is executed, then the *increment*\
    \ executes, and then the loop repeats with the *condition*.\n\n```javascript\n\
    for (initialization; condition; increment) { block }\n```\n\nThe other form (called\
    \ `for in`) enumerates the property names (or keys) of an object. On each iteration,\
    \ another property name string from the `object` is assigned to the `variable`.\
    \ It is usually necessary to test `object.hasOwnProperty(variable)` to determine\
    \ whether the property name is truly a member of the object or was found instead\
    \ on the prototype chain.\n\n```javascript\nfor (myvar in obj) {\n  if (obj.hasOwnProperty(myvar))\
    \ {\n    ...\n  }\n}\n```\n\n### Do Statement\n\nThe `do` statement is like the\
    \ `while` statement except that the expression is tested after the block is executed\
    \ instead of before. That means that the block will always executed at least once.\n\
    \n### Try Statement\n\nThe `try` statement executes a block and catches any exceptions\
    \ that were thrown by the block. The `catch` clause defines a new *variable* that\
    \ will receive the exception object.\n\n### Throw Statement\n\nThe `throw` statement\
    \ raises an exception. If the `throw` statement is in a `try` block, then control\
    \ goes to the `catch` clause. Otherwise, the function invocation is abandoned,\
    \ and control goes to the `catch` clause of the `try` in the calling function.\
    \ The expression is usually an object literal containing a `name` property and\
    \ a `message` property. The catcher of the exception can use that information\
    \ to determine what to do.\n\n### Return Statement\n\nThe `return` statement causes\
    \ the early return from a function. It can also specify the value to be returned.\
    \ If a return expression is not specified, then the return value will be `undefined`.\
    \ JavaScript does not allow a line end between the `return` and the expression.\n\
    \n### Break Statement\n\nThe `break` statement causes the exit from a loop statement\
    \ or a `switch` statement. It can optionally have a *label* that will cause an\
    \ exit from the labeled statement.\n"
