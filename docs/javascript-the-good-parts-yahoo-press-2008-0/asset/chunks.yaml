    \n`string.search(regexp)` The `search` method is like the `indexOf` method, except\
    \ that it takes a regular expression object instead of a string. It returns the\
    \ position of the first character of the first match, if there is one, or –1 if\
    \ the search fails. The `g` flag is ignored. There is no `position` parameter:\
    \ `var text = 'and in it he says \"Any damn fool could'; var pos = text.search(/[\"\
    ']/); // pos is 18`\n\n`string.slice(start, end)` The `slice` method makes a new\
    \ string by copying a portion of another `string`. If the `start` parameter is\
    \ negative, it adds `string.length` to it. The `end` parameter is optional, and\
    \ its default value is `string.length`. If the `end` parameter is negative, then\
    \ `string.length` is added to it. The `end` parameter is one greater than the\
    \ position of the last character. To get n characters starting at position `p`,\
    \ use `string.slice(p,p + n)`. Also see `string.substring` and `array.slice`,\
    \ later and earlier in this chapter, respectively.\n\n```javascript\nvar text\
    \ = 'and in it he says \"Any damn fool could';\nvar a = text.slice(18); // a is\
    \ '\"Any damn fool could'\nvar b = text.slice(0, 3); // b is 'and'\nvar c = text.slice(-5);\
    \ // c is 'could'\nvar d = text.slice(19, 32); // d is 'Any damn fool'\n```\n\n\
    `string.split(separator, limit)` The `split` method creates an array of strings\
    \ by splitting this `string` into pieces. The optional `limit` parameter can limit\
    \ the number of pieces that will be split. The `separator` parameter can be a\
    \ string or a regular expression.\n\nIf the `separator` is the empty string, an\
    \ array of single characters is produced: `var digits = '0123456789'; var a =\
    \ digits.split('', 5); // a is ['0', '1', '2', '3', '4']`\n\nOtherwise, the `string`\
    \ is searched for all occurrences of the `separator`. Each unit of text between\
    \ the separators is copied into the array. The `g` flag is ignored: `var ip =\
    \ '192.168.1.0'; var b = ip.split('.'); // b is ['192', '168', '1', '0'] var c\
    \ = '|a|b|c|'.split('|'); // c is ['', 'a', 'b', 'c', '']`\n\n```javascript\n\
    var text = 'last, first ,middle';\nvar d = text.split(/\\s*,\\s*/);\n// d is ['last',\
    \ 'first', 'middle']\n```\n\nThere are some special cases to watch out for. Text\
    \ from capturing groups will be included in the split:\n\n```javascript\nvar e\
    \ = text.split(/\\s*(,)\\s*/);\n// e is ['last', ',', 'first', ',', 'middle']\n\
    ```\n\nSome implementations suppress empty strings in the output array when the\
    \ `separator` is a regular expression:\n\n```javascript\nvar f = '|a|b|c|'.split(/\\\
    |/);\n// f is ['a', 'b', 'c'] on some systems, and\n// f is ['', 'a', 'b', 'c',\
    \ ''] on others\n```\n\n`string.substring(start, end)` The `substring` method\
    \ is the same as the `slice` method except that it doesn’t handle the adjustment\
    \ for negative parameters. There is no reason to use the `substring` method. Use\
    \ `slice` instead.\n\n`string.toLocaleLowerCase()` The `toLocaleLowerCase` method\
    \ produces a new string that is made by converting this `string` to lowercase\
    \ using the rules for the locale. This is primarily for the benefit of Turkish\
    \ because in that language ‘I’ converts to `ı`, not ‘i’.\n\n`string.toLocaleUpperCase()`\
    \ The `toLocaleUpperCase` method produces a new string that is made by converting\
    \ this `string` to uppercase using the rules for the locale. This is primarily\
    \ for the benefit of Turkish, because in that language ‘i’ converts to ‘ ’, not\
    \ ‘I’.\n\n`string.toLowerCase()` The `toLowerCase` method produces a new string\
    \ that is made by converting this `string` to lowercase.\n\n`string.toUpperCase()`\
    \ The `toUpperCase` method produces a new string that is made by converting this\
    \ `string` to uppercase.\n\n`string.fromCharCode(char)` The `fromCharCode` method\
    \ creates a string from a sequence of UTF-16 code units.\n\n```javascript\nvar\
    \ a = String.fromCharCode(67, 97, 116); // a is 'Cat'\n```\n"
