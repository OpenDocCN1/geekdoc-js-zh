    \ operator`\n\n`type of`\n`typeof`\n\n`to number`\n`+`\n\n`negate`\n`-`\n\n`logical\
    \ not`\n`!`\n\nThe values produced by `typeof` are `'number'`, `'string'`, `'boolean'`,\
