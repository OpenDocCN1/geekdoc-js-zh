  trans: "\n\n`get_status` 并没有访问参数的副本；它访问的是参数本身。之所以可以，是因为该函数可以访问它创建时的上下文。这被称为闭包（closure*）。\n\
    \n让我们来看一个更有用的例子：\n\n```javascript\n// 定义一个函数，将 DOM 节点的颜色设置为\n// 黄色，然后逐渐淡变为白色。\n\
    var fade = function (node) {\n  var level = 1;\n  var step = function ( ) {\n\
    \    var hex = level.toString(16);\n    node.style.backgroundColor = '#FFFF' +\
    \ hex + hex;\n    if (level < 15) {\n      level += 1;\n      setTimeout(step,\
    \ 100);\n    }\n  };\n  setTimeout(step, 100);\n};\nfade(document.body);\n```\n\
    \n我们调用 `fade`，并向它传递 `document.body`（由 HTML `<body>` 标签创建的节点）。\n\n`fade` 将 `level`\
    \ 设置为 `1`。它定义了一个 `step` 函数。它调用了 `setTimeout`，传递了 `step` 函数和时间（100 毫秒）。然后它返回——`fade`\
    \ 执行完毕。\n\n突然，大约 1/10 秒后，`step` 函数被调用。它根据 `fade` 的 `level` 生成一个 16 进制字符。然后它修改了\
    \ `fade` 节点的背景颜色。接着，它查看 `fade` 的 `level`。如果还没有变成白色，它就会增加 `fade` 的 `level` 并使用\
    \ `setTimeout` 调度自己再次运行。\n\n# 第 4 章：函数\n\n突然，`step` 函数再次被调用。但这一次，`fade` 的 `level`\
    \ 是 `2`。虽然 `fade` 已经返回了一多会儿，但只要一个或多个 `fade` 的内部函数还需要它们，这些变量就会继续存在。\n\n重要的一是，内部函数访问的是外部函数的实际变量，而不是副本，以避免出现以下问题。\n\
    \n### 错误示例\n```javascript\n// 错误地创建一个函数，将事件处理函数分配给一个节点数组。\n// 当你点击一个节点时，弹框本应该显示该节点的序号。\n\
    // 但它总是显示节点的总数而不是序号。\nvar add_the_handlers = function (nodes) {\n  var i;\n  for\
    \ (i = 0; i < nodes.length; i += 1) {\n    nodes[i].onclick = function (e) {\n\
    \      alert(i);\n    };\n  }\n};\n// 错误示例结束\n```\n\n`add_the_handlers` 函数本打算给每个处理程序提供一个唯一的数字\
    \ `i`。它失败了，是因为处理程序函数绑定的是变量 `i`，而不是函数创建时变量 `i` 的值。\n\n### 更好的示例\n```javascript\n\
    // 创建一个函数，将事件处理函数分配给节点数组。\n// 当你点击一个节点时，弹框将显示该节点的序号。\nvar add_the_handlers = function\
    \ (nodes) {\n  var helper = function (i) {\n    return function (e) {\n      alert(i);\n\
    \    };\n  };\n  var i;\n  for (i = 0; i < nodes.length; i += 1) {\n    nodes[i].onclick\
    \ = helper(i);\n  }\n};\n```\n\n避免在循环内部创建函数。这在计算上可能是浪费的，并且正如我们在错误示例中看到的，它可能会引起混乱。我们通过在循环外部创建一个\
    \ `helper` 函数来避免这种混乱，该函数将返回一个绑定到当前 `i` 值的函数。\n\n# 回调函数\n\n函数可以让处理不连续事件变得更容易。例如，假设有一个序列：开始于用户交互，向服务器发送请求，最后显示服务器的响应。这种操作朴素的写法是：\n\
    \n```javascript\nrequest = prepare_the_request( );\nresponse = send_request_synchronously(request);\n\
    display(response);\n```\n\n这种方法的问题在于，网络上的同步请求会让客户端处于冻结状态。如果网络或服务器较慢，响应能力的下降将是不可接受的。\n\
    \n更好的方法是进行异步请求，并提供一个回调函数，该函数将在收到服务器响应时被调用。异步函数会立即返回因此客户端不会被阻塞：\n\n```javascript\n\
    request = prepare_the_request( );\nsend_request_asynchronously(request, function\
    \ (response) {\n  display(response);\n});\n```\n\n我们向 `send_request_asynchronously`\
    \ 函数传递了一个函数参数，该参数将在响应可用时被调用。\n\n# 模块\n\n我们可以使用函数和闭包来构建模块。模块是一个提供接口但隐藏其状态和实现的函数或对象。通过使用函数来生成模块，我们几乎可以完全消除对全局变量的使用，从而缓解\
    \ JavaScript 最糟糕的特性之一。\n\n例如，假设我们想为 `String` 添加一个 `deentityify` 方法。它的工作是查找字符串中的\
    \ HTML 实体并将其替换为等效字符。将实体名称及其等效字符存储在一个对象中是有意义的。\n\n但我们应该把这个对象放在哪里呢？我们可以把它放在全局变量中，但全局变量是糟糕的。我们可以在函数内部定义它，但这样会有运行时成本，因为每次调用函数时字面量都要进行求值。理想的方法将其放入闭包中，或许提供一个可以添加额外实体的额外方法：\n\
    \n```javascript\nString.method('deentityify', function ( ) {\n  // 实体表。它将实体名称映射到\n\
    // 字符。\n  var entity = {\n    quot: '\"',\n    lt: '<',\n    gt: '>'\n  };\n \
    \ // 返回 deentityify 方法。\n  return function ( ) {\n    // 这是 deentityify 方法。它调用字符串\n\
    \    // replace 方法，查找以 '&' 开头\n    // 并以 ';' 结尾的字符串。如果中间的\n    // 字符在实体表中，将实体\n\
    \    // 替换为表中的字符。它使用了\n    // 正则表达式（第 7 章）。\n    return this.replace(/&([^&;]+);/g,\n\
    \      function (a, b) {\n        var r = entity[b];\n        return typeof r\
    \ === 'string' ? r : a;\n      }\n    );\n  };\n}());\n```\n\n注意最后一行。我们使用 `()`\
    \ 运算符立即调用了刚刚创建的函数。这次调用创建并返回了成为 `deentityify` 方法的函数。\n\n```javascript\ndocument.writeln('&lt;&gt;'.deentityify(\
    \ )); // <>\n```\n\n模块模式利用函数作用域和闭包来创建绑定且私有的关系。在这个例子中，只有 `deentityify` 方法可以访问实体数据结构。\n\
    \n模块的通用模式是：一个定义私有变量和函数的函数；创建通过闭包访问私有变量和函数的特权函数；并返回这些特权函数或将其存储在可访问的地方。\n\n模块模式的使用可以消除全局变量的使用。它促进了信息隐藏和其他设计实践。在封装应用程序和其他单例时非常有效。\n\
    \n它还可以用于生成安全的对象。假设我们想创建一个生成序列号的对象：\n\n```javascript\nvar serial_maker = function\
    \ ( ) {\n  // 创建一个生成唯一字符串的对象。一个\n  // 字符串由两部分组成：前缀\n  // 和序列号。对象带有设置前缀\n  // 和序列号的方法，以及一个生成唯一\n\
    \  // 字符串的 gensym 方法。\n  var prefix = '';\n  var seq = 0;\n  return {\n    set_prefix:\
    \ function (p) {\n      prefix = String(p);\n    },\n    set_seq: function (s)\
    \ {\n      seq = s;\n    },\n    gensym: function ( ) {\n      var result = prefix\
    \ + seq;\n      seq += 1;\n      return result;\n    }\n  };\n};\n\nvar seqer\
    \ = serial_maker( );\nseqer.set_prefix('Q');\nseqer.set_seq(1000);\nvar unique\
    \ = seqer.gensym( ); // unique 是 \"Q1000\"\n```\n\n"
