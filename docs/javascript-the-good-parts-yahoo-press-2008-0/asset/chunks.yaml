    \n### 字符串字面量\n\n| 类型 | 说明 |\n| :--- | :--- |\n| `string literal` | 除 `\"` 和 `\\\
    ` 以及控制字符以外的任何 Unicode 字符；转义字符 |\n| `string literal` | 除 `'` 和 `\\` 以及控制字符以外的任何\
    \ Unicode 字符；转义字符 |\n| `escaped character` | `\\` |\n| `\"` | 双引号 |\n| `'` | 单引号\
    \ |\n| `\\` | 反斜杠 |\n| `/` | 斜杠 |\n| `b` | 退格 |\n| `f` | 换页 |\n| `n` | 换行 |\n\
    | `r` | 回车 |\n| `t` | 制表符 |\n| `u` | 4 位十六进制数字 |\n\n转义序列允许在字符串中插入通常不允许的字符，例如反斜杠、引号和控制字符。`\\\
    u` 约定允许以数值形式指定字符代码点。\n\n```\n\"A\" === \"\\u0041\"\n```\n\n字符串具有 `length` 属性。例如，`\"\
    seven\".length` 为 5。\n\n字符串是不可变的。一旦创建，字符串就永远无法更改。但通过 `+` 运算符将其他字符串拼接在一起很容易创建一个新字符串。\n\
    \n两个包含完全相同字符且顺序相同的字符串被认为是相同的字符串。因此：\n\n```javascript\n'c' + 'a' + 't' === 'cat'\n\
    ```\n结果为 true。\n\n[字符串拥有各种方法（参见第 8 章）。]\n\n```javascript\n'cat'.toUpperCase()\
    \ === 'CAT'\n```\n\n## 语句\n\n编译单元包含一组可执行的语句。在浏览器中，每个 `<script>` 标签交付一个编译单元，该单元会被编译并立即执行。\n\
    \n由于缺少链接器，JavaScript 将它们全部抛在一个公共全局命名空间中。关于全局变量的更多信息请参见[附录 A]。\n\n在函数内部使用时，`var`\
    \ 语句定义函数的私有变量。\n\n`switch`、`while`、`for` 和 `do` 语句允许有一个可选的*标签*前缀，用于与 `break` 语句交互。\n\
    \n语句倾向于从上到下执行。执行顺序可以通过条件语句（`if` 和 `switch`）、循环语句（`while`、`for` 和 `do`）、中断语句（`break`、`return`\
    \ 和 `throw`）以及函数调用来改变。\n\n块是用花括号括的一组语句。与其他许多语言不同，JavaScript 中的块不会创建新的作用域，因此变量应该定义在函数的顶部而不是块中。\n\
    \n`if` 语句根据表达式的值改变程序的流。如果表达式为*真值 (truthy)*，则执行 *then* 块；否则，执行可选的 `else` 分支。\n\n\
    ### 语句语法\n\n| 结构 | 语法 |\n| :--- | :--- |\n| `var statements` | `var name = expression;`\
    \ |\n| `expression statement` | `expression;` |\n| `disruptive statement` | `break`,\
    \ `return`, `throw` |\n| `try statement` | `try { block } catch (name) { block\
    \ }` |\n| `label` | `name:` |\n| `if statement` | `if (expression) { block } else\
    \ { block }` |\n| `switch statement` | `switch (expression) { case clause: statements\
    \ }` |\n| `while statement` | `while (expression) { block }` |\n| `for statement`\
    \ | `for (initialization; condition; increment) { block }` |\n| `do statement`\
    \ | `do { block } while (expression);` |\n| `block` | `{ statements }` |\n\n###\
    \ 假值 (Falsy Values)\n\n以下是*假值*：\n* `false`\n* `null`\n* `undefined`\n* 空字符串 `''`\n\
    * 数字 `0`\n* 数字 `NaN`\n\n所有其他值均为真值，包括 `true`、字符串 `'false'` 以及所有对象。\n\n### Switch\
    \ 语句\n\n`switch` 语句执行多路分支。它将表达式与所有指定的 case 进行等值比较。表达式可以产生一个数字或字符串。当找到精确匹配时，将执行匹配的\
    \ case 子句中的语句。如果没有匹配，则执行可选的 `default` 语句。\n\n`case clause` 包含一个或多个 case 表达式。case\
    \ 表达式不需要是常量。子句后的语句应该是中断语句，以防止贯穿（fall-through）到下一个 case。`break` 语句用于退出 `switch`。\n\
    \n### While 语句\n\n`while` 语句执行一个简单的循环。如果表达式为假值，则循环将中断。只要表达式为真值，就会执行该块。\n\n###\
    \ For 语句\n\n`for` 语句是一种更复杂的循环语句。它有两种形式。\n\n传统形式由三个可选子句控制：*初始化*、*条件*和*增量*。首先执行初始化，这通常初始化循环变量。然后评估*条件*。这通常测试循环变量是否符合完成标准。如果省略条件，则假设条件为\
    \ `true`。如果条件为假值，循环中断。否则，执行块，然后执行增量，最后根据条件重复。\n\n```javascript\nfor (initialization;\
    \ condition; increment) { block }\n```\n\n另一种形式（称为 `for in`）遍历对象的属性名（键）。在每次迭代中，对象的另一个属性名会被赋值给变量。通常需要测试\
    \ `object.hasOwnProperty(variable)` 以确定属性名确实是对象的成员，还是从原型链上找到的。\n\n```javascript\n\
    for (myvar in obj) {\n  if (obj.hasOwnProperty(myvar)) {\n    ...\n  }\n}\n```\n\
    \n### Do 语句\n\n`do` 语句类似于 `while` 语句，但是在执行块之后测试表达式。这意味着块将至少执行一次。\n\n### Try 语句\n\
    \n`try` 语句执行一个块并捕获该块抛出的任何异常。`catch` 子句定义了一个新变量来接收异常对象。\n\n### Throw 语句\n\n`throw`\
    \ 语句抛出异常。如果 `throw` 语句位于 `try` 块中，则跳转到 `catch` 子句。否则，函数调用被放弃，控制转移到调用函数中 `try`\
    \ 的 `catch` 子句。表达式通常是一个包含 `name` 属性和 `message` 属性 get 对象字面量。异常的捕获者可以使用这些信息决定做什么。\n\
    \n### Return 语句\n\n`return` 语句导致从函数提前返回。它还可以指定要返回的值。如果没有指定 return 表达式，则返回值将为 `undefined`。JavaScript\
    \ 不允许在 `return` 和表达式之间换行。\n\n### Break 语句\n\n`break` 语句导致退出循环语句或 `switch` 语句。它可选地带有一个*标签*，用于退出带有标签的语句。\n\
    \n"
