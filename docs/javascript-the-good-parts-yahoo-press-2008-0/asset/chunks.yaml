    those choices were good, if unusual. But there was one choice that was particularly
    bad: JavaScript depends on global variables for linkage. All of the top-level
    variables of all compilation units are tossed together in a common namespace called
    *the global* *object*. This is a bad thing because global variables are evil,
    and in JavaScript they are fundamental. Fortunately, as we will see, JavaScript
    also gives us the tools to mitigate this problem.


    In a few cases, we can’t ignore the bad parts. There are some unavoidable awful
    parts, which will be called out as they occur. They will also be summarized in'
