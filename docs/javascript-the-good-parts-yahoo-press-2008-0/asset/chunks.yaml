  trans: "\n\n可以通过用 `[]` 后缀包裹字符串表达式从对象中检索值。如果该字符串表达式是一个字符串字面量，并且它是合法的 JavaScript 名称且不是保留字，则可以使用\
    \ `.` 符号。优先使用 `.` 符号，因为它更紧凑且可读性更好：`stooge[\"first-name\"] // \"Jerome\"`\n\n`flight.departure.IATA\
    \ // \"SYD\"`\n\n如果尝试检索不存在的成员，将产生 `undefined` 值：\n\n`stooge[\"middle-name\"] //\
    \ undefined`\n\n`flight.status // undefined`\n\n`stooge[\"FIRST-NAME\"] // undefined`\n\
    \n可以使用 `||` 运算符来填充默认值：`var middle = stooge[\"middle-name\"] || \"(none)\"; var\
    \ status = flight.status || \"unknown\";`\n\n尝试从 `undefined` 获取值将抛出 `TypeError`\
    \ 异常。可以使用 `&&` 运算符来防御：\n\n`flight.equipment // undefined`\n`flight.equipment.model\
    \ // throw \"TypeError\"`\n\n`flight.equipment && flight.equipment.model // undefined`\
    \ \n\n|\n\n21\n\n|\n\n## 更新\n\n可以通过赋值更新对象中的值。如果属性名在对象中已存在，则属性值将被替换：\n\n`stooge['first-name']\
    \ = 'Jerome';`\n\n如果对象中还没有该属性名，则对象会被扩展：`stooge['middle-name'] = 'Lester';`\n\n\
    `stooge.nickname = 'Curly';`\n`flight.equipment = {\nmodel: 'Boeing 777'\n};`\n\
    \n`flight.status = 'overdue';`\n\n## 引用\n\n对象是通过引用传递的。它们从不会被复制：`var x = stooge;`\n\
    \n`x.nickname = 'Curly';`\n\n`var nick = stooge.nickname;`\n`// nick 是 'Curly'\
    \ 因为 x 和 stooge`\n`// 是指向同一个对象的引用`\n\n`var a = {}, b = {}, c = {};`\n`// a, b,\
    \ 和 c 分别指向`\n`// 不同的空对象`\n`a = b = c = {};`\n`// a, b, 和 c 都指向`\n`// 同一个空对象`\n\
    \n## 原型\n\n每个对象都链接到一个原型对象，从那里继承属性。所有通过对象字面量创建的对象都链接到 `Object.prototype`，这是一个 JavaScript\
    \ 标准带的对象。\n\n当你创建一个新对象时，可以选择一个对象作为其原型。\n\nJavaScript 提供用于此操作的机制既杂乱又复杂，但可以显著简化。我们将为\
    \ `Object` 函数添加一个 `create` 方法。`create` 方法创建一个使用旧对象作为其原型的新对象。下一章将介绍更多关于函数的知识。\n\
    \n```javascript\nif (typeof Object.create !== 'function') {\n  Object.create =\
    \ function (o) {\n    var F = function () {};\n    F.prototype = o;\n    return\
    \ new F();\n  };\n}\n```\n\n22\n\n|\n\n## 第 3 章：对象\n\n`var another_stooge = Object.create(stooge);`\n\
    \n原型链接对更新没有影响。当我们对对象进行更改时，对象的原型不会被触及：\n\n`another_stooge['first-name'] = 'Harry';`\n\
    `another_stooge['middle-name'] = 'Moses';`\n`another_stooge.nickname = 'Moe';`\n\
    \n原型链接仅用于检索。如果我们尝试从对象中检索属性值，且该对象缺少该属性名，那么 JavaScript 将尝试从原型对象中检索属性值。如果该对象也缺少该属性，它将去*它的*原型，依此类推，直到过程最终在\
    \ `Object.prototype` 处结束。如果所需的属性在原型链的任何地方都不存在，结果为 `undefined` 值。这被称为*委托*（delegation）。\n\
    \n原型关系是一种动态关系。如果我们向原型添加一个新属性，该属性将立即在所有基于该原型的对象中可见：\n\n`stooge.profession = 'actor';`\n\
    `another_stooge.profession // 'actor'`\n\n将在第 6 章中看到更多关于原型链的内容\n\n## 反思\n\n通过尝试检索属性并检查获得的值，很容易检查对象以确定它拥有哪些属性。`typeof`\
    \ 运算符对于确定属性类型非常有帮助：`typeof flight.number // 'number'`\n\n`typeof flight.status\
    \ // 'string'`\n`typeof flight.arrival // 'object'`\n`typeof flight.manifest //\
    \ 'undefined'`\n\n必须小心，因为原型链上的任何属性都可能产生值：\n\n`typeof flight.toString // 'function'`\n\
    `typeof flight.constructor // 'function'`\n\n处理这些不必要的属性有两种方法。第一种是让你的程序查找并拒绝函数值。通常情况下，当你进行反射（reflection）时，你感兴趣的是数据，你应该意识到某些值可能是函数。\n\
    \n另一种方法是使用 `hasOwnProperty` 方法，如果对象拥有特定属性，该方法返回 `true`。`hasOwnProperty` 方法不会查找原型链：\n\
    \n`flight.hasOwnProperty('number') // true`\n`flight.hasOwnProperty('constructor')\
    \ // false`\n\n反射\n\n|\n\n23\n\n|\n\n## 枚举\n\n`for...in` 语句可以遍历对象中所有的属性名。枚举将包含所有属性——包括你可能感兴趣的函数和原型属性——因此有必要过滤掉你不需要的值。最常见的过滤器是\
    \ `hasOwnProperty` 方法以及使用 `typeof` 排除函数：\n\n```javascript\nvar name;\nfor (name\
    \ in another_stooge) {\n  if (typeof another_stooge[name] !== 'function') {\n\
    \    document.writeln(name + ': ' + another_stooge[name]);\n  }\n}\n```\n\n名称的顺序没有保证，因此要准备好名称以任何顺序出现。如果你想确保属性按特定顺序出现，最好完全避免使用\
    \ `for...in` 语句，而是创建一个包含正确顺序的属性名的数组：`var i;`\n\n`var properties = [\n  'first-name',\n\
    \  'middle-name',\n  'last-name',\n  'profession'\n];`\n\n`for (i = 0; i < properties.length;\
    \ i += 1) {\n  document.writeln(properties[i] + ': ' + another_stooge[properties[i]]);\n\
    }`\n\n通过使用 `for` 代替 `for...in`，我们能够在不担心从原型链中可能捞出什么的情况下，获取我们需要的属性，并按照正确的顺序获取了它们。\n\
    \n## 删除\n\n`delete` 运算符可以用于从对象中删除属性。如果对象具有该属性，它将将其删除。它不会触及原型链接中的任何对象。\n\n从对象中删除属性可能会让原型链接中的属性显现：\n\
    \n`another_stooge.nickname // 'Moe'`\n`// 从 another_stooge 中移除 nickname，从而显示`\n\
    `// 原型的 nickname.`\n\n`delete another_stooge.nickname;`\n`another_stooge.nickname\
    \ // 'Curly'`\n\n24\n\n|\n\n## 第 3 章：对象\n\n## 全局抑制\n\nJavaScript 允许轻松定义全局变量，可以存储你应用程序的所有资源。遗憾的是，全局变量会削弱程序的健壮性，应该避免使用。\n\
    \n尽量减少全局变量使用的一种方法是为你的应用程序创建一个单一全局变量：`var MYAPP = {};`\n\n该变量随后成为应用程序的容器：`MYAPP.stooge\
    \ = {\n\"first-name\": \"Joe\",\n\"last-name\": \"Howard\"\n};`\n\n`MYAPP.flight\
    \ = {\nairline: \"Oceanic\",\nnumber: 815,\ndeparture: {\nIATA: \"SYD\",\ntime:\
    \ \"2004-09-22 14:55\",\ncity: \"Sydney\"\n},\narrival: {\nIATA: \"LAX\",\ntime:\
    \ \"2004-09-23 10:42\",\ncity: \"Los Angeles\"\n}\n};`\n\n通过将你的全局足迹减少到单一名称，你显著减少了与其他应用程序、插件或库发生不良交互的可能性。你的程序也变得更容易读，因为显然\
    \ `MYAPP.stooge` 指的是顶层结构。在下一章中，我们将看到使用 `closure` 进行信息隐藏的方法，这是另一种有效的全局抑制技术。\n\n\
    全局抑制\n\n|\n\n25\n\n# 第 4 章\n\n## 函数\n\n*为什么，每一处错误在被犯前就已经被定判了：*\n\n*我的正是函数的数字符号……*\n\
    \n——威廉·莎士比亚，《尺度量》\n\n"
- fmt: "\nThe best thing about `JavaScript` is its implementation of functions. It\
    \ got almost everything right. But, as you should expect with `JavaScript`, it\
    \ didn’t get everything right.\n\nA function encloses a set of statements. Functions\
    \ are the fundamental modular unit of `JavaScript`. They are used for code reuse,\
    \ information hiding, and composition.\n\nFunctions are used to specify the behavior\
    \ of objects. Generally, the craft of programming is the factoring of a set of\
    \ requirements into a set of functions and data structures.\n\n## Function Objects\n\
    \nFunctions in `JavaScript` are objects. Objects are collections of name/value\
    \ pairs having a hidden link to a prototype object. Objects produced from object\
    \ literals are linked to `Object.prototype`. Function objects are linked to `Function.prototype`\
    \ (which is itself linked to `Object.prototype`). Every function is also created\
    \ with two additional hidden properties: the function’s context and the code that\
    \ implements the function’s behavior.\n\nEvery function object is also created\
    \ with a `prototype` property. Its value is an object with a `constructor` property\
    \ whose value is the function. This is distinct from the hidden link to `Function.prototype`.\
    \ The meaning of this convoluted construction will be revealed in the next chapter.\n\
    \nSince functions are objects, they can be used like any other value. Functions\
    \ can be stored in variables, `objects`, and `arrays`. Functions can be passed\
    \ as arguments to functions, and functions can be returned from functions. Also,\
    \ since functions are objects, functions can have methods.\n\nThe thing that is\
    \ special about functions is that they can be invoked.\n\n## 26\n\n## Function\
    \ Literal\n\nFunction objects are created with function literals:\n\n```javascript\n\
    // Create a variable called add and store a function\n// in it that adds two numbers.\n\
    var add = function (a, b) {\n  return a + b;\n};\n```\n\nA function literal has\
    \ four parts. The first part is the reserved word `function`.\n\nThe optional\
    \ second part is the function’s name. The function can use its name to call itself\
    \ recursively. The name can also be used by debuggers and development tools to\
    \ identify the function. If a function is not given a name, as shown in the previous\
    \ example, it is said to be *anonymous*.\n\nThe third part is the set of parameters\
    \ of the function, wrapped in parentheses.\n\nWithin the parentheses is a set\
    \ of zero or more parameter names, separated by commas. These names will be defined\
    \ as variables in the function. Unlike ordinary variables, instead of being initialized\
    \ to `undefined`, they will be initialized to the arguments supplied when the\
    \ function is invoked.\n\nThe fourth part is a set of statements wrapped in curly\
    \ braces. These statements are the body of the function. They are executed when\
    \ the function is invoked.\n\nA function literal can appear anywhere that an expression\
    \ can appear. Functions can be defined inside of other functions. An inner function\
    \ of course has access to its parameters and variables. An inner function also\
    \ enjoys access to the parameters and variables of the functions it is nested\
    \ within. The function object created by a function literal contains a link to\
    \ that outer context. This is called *closure*. This is the source of enormous\
    \ expressive power.\n\n## Invocation\n\nInvoking a function suspends the execution\
    \ of the current function, passing control and parameters to the new function.\
    \ In addition to the declared parameters, every function receives two additional\
    \ parameters: `this` and `arguments`. The `this` parameter is very important in\
    \ object oriented programming, and its value is determined by the *invocation\
    \ pattern*. There are four patterns of invocation in `JavaScript`: the method\
    \ invocation pattern, the function invocation pattern, the constructor invocation\
    \ pattern, and the apply invocation pattern.\n\n## Invocation\n\n## 27\n\nInvoking\
    \ a function suspends the execution of the current function, passing control and\
    \ parameters to the new function. In addition to the declared parameters, every\
    \ function receives two additional parameters: `this` and `arguments`. The `this`\
    \ parameter is very important in object oriented programming, and its value is\
    \ determined by the *invocation pattern*. There are four patterns of invocation\
    \ in `JavaScript`: the method invocation pattern, the function invocation pattern,\
    \ the constructor invocation pattern, and the apply invocation pattern.\n\n##\
    \ The Method Invocation Pattern\n\nWhen a function is stored as an object, we\
    \ call it a *method*. When a method is invoked, `this` is bound to the object.\n\
    \n```javascript\n// Create myObject with a value and increment method.\nvar myObject\
    \ = {\n  value: 0,\n  increment: function (inc) {\n    this.value += typeof inc\
    \ === 'number' ? inc : 1;\n  }\n};\n\n// Invoke increment as a method.\nmyObject.increment();\
    \ // 1\nconsole.log(myObject.value); // 1\n\nmyObject.increment(2); // 3\nconsole.log(myObject.value);\
    \ // 3\n```\n\nWhen a function is not the property of an object, it is invoked\
    \ as a function. When it is invoked, `this` is bound to the global object.\n\n\
    ## The Function Invocation Pattern\n\nWhen a function is not the property of an\
    \ object, it is invoked as a function. When it is invoked, `this` is bound to\
    \ the global object. This was a mistake in the design of the language. Had the\
    \ language been designed correctly, when the inner function is invoked, `this`\
    \ would still be bound to the outer function. A consequence of this error is that\
    \ a method cannot employ an inner function to help its work because the inner\
    \ function does not share the method’s access to the object. Fortunately, there\
    \ is an easy workaround. If the method defines a variable and assigns it the value\
    \ of `this`, the inner function will have access to `this` through that variable.\
    \ By convention, the name of that variable is `that`:\n\n```javascript\n// Augment\
    \ myObject with a double method.\nmyObject.double = function () {\n  var that\
    \ = this; // Workaround.\n  var helper = function () {\n    that.value = add(that.value,\
    \ that.value);\n  };\n  helper(); // Invoke helper as a function.\n};\n\n// Invoke\
    \ double as a method.\nmyObject.double();\nconsole.log(myObject.value); \n```\n\
    \n## The Constructor Invocation Pattern\n\nIf a function is invoked with the new\
    \ prefix, then a new object will be created with a hidden link to the value of\
    \ the function’s `prototype` member, and `this` will be bound to that new object.\n\
    \nThe new prefix also changes the behavior of the `return` statement. We will\
    \ see more about that next.\n\n## 28\n\n## Functions\n\n`JavaScript` is a *prototypal*\
    \ inheritance language. That means that objects can inherit properties directly\
    \ from other objects. The language is class-free.\n\nThis is a radical departure\
    \ from the current fashion. Most languages today are *classical*. Prototypal inheritance\
    \ is powerfully expressive, but is not widely understood.\n\n`JavaScript` itself\
    \ is not confident in its prototypal nature, so it offers an object-making syntax\
    \ that is reminiscent of the classical languages. Few classical programmers found\
    \ prototypal inheritance to be acceptable, and classically inspired syntax obscures\
    \ the language’s true prototypal nature. It is the worst of both worlds.\n\n```javascript\n\
    // Create a constructor function called Quo.\n// It makes an object with a status\
    \ property.\n```\n"
