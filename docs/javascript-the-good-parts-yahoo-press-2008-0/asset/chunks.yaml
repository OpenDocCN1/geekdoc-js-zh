    to appear in any order. If you want to assure that the properties appear in a
    particular order, it is best to avoid the for in statement entirely and instead
    make an array containing the names of the properties in the correct order: var
    i;


    var properties = [


    ''first-name'',


    ''middle-name'',


    ''last-name'',


    ''profession''


    ];


    for (i = 0; i < properties.length; i += 1) {


    document.writeln(properties[i] + '': '' +


    another_stooge[properties[i]]);


    }


    By using for instead of for in, we were able to get the properties we wanted without
    worrying about what might be dredged up from the prototype chain, and we got them
    in the correct order.


    **Delete**


    The delete operator can be used to remove a property from an object. It will remove
    a property from the object if it has one. It will not touch any of the objects
    in the prototype linkage.


    Removing a property from an object may allow a property from the prototype linkage
    to shine through:


    another_stooge.nickname // ''Moe''


    // Remove nickname from another_stooge, revealing


    // the nickname of the prototype.


    **24**


    **|**


    **Chapter 3: Objects**


    delete another_stooge.nickname;


    another_stooge.nickname // ''Curly''


    **Global Abatement**


    JavaScript makes it easy to define global variables that can hold all of the assets
    of your application. Unfortunately, global variables weaken the resiliency of
    programs and should be avoided.


    One way to minimize the use of global variables is to create a single global variable
    for your application:


    var MYAPP = {};


    That variable then becomes the container for your application: MYAPP.stooge =
    {


    "first-name": "Joe",


    "last-name": "Howard"


    };


    MYAPP.flight = {


    airline: "Oceanic",


    number: 815,


    departure: {


    IATA: "SYD",


    time: "2004-09-22 14:55",


    city: "Sydney"


    },


    arrival: {


    IATA: "LAX",


    time: "2004-09-23 10:42",


    city: "Los Angeles"


    }


    };


    By reducing your global footprint to a single name, you significantly reduce the
    chance of bad interactions with other applications, widgets, or libraries. Your
    program also becomes easier to read because it is obvious that MYAPP.stooge refers
    to a top-level structure. In the next chapter, we will see ways to use closure
    for information hiding, which is another effective global abatement technique.


    **Global Abatement**


    **|**


    **25**


    **CHAPTER 4**


    **Functions**


    *Why, every fault’s condemn’d ere it be done:*


    *Mine were the very cipher of a function...*


    —William Shakespeare, *Measure for Measure*'
