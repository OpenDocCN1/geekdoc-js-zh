  trans: "\n\n`JavaScript` 最棒的一点在于它对函数的实现。它几乎做得非常到位。但正如你对 `JavaScript` 的预期那样，它并没有把一切都做对。\n\
    \n函数封装了一组语句。函数是 `JavaScript` 的基本模块单元。它们用于代码重用、信息隐藏和组合。\n\n函数用于指定对象的行为。通常情况下，编程的艺术是将一组需求分解为一组函数和数据结构。\n\
    \n## 函数对象\n\n`JavaScript` 中的函数是对象。对象是键/值对的集合，并有一个指向原型对象的隐藏链接。从对象字面量产生的对象链接到 `Object.prototype`。函数对象链接到\
    \ `Function.prototype`（其本身又链接到 `Object.prototype`）。每个函数在创建时还带有两个额外的隐藏属性：函数的上下文和实现函数行为的代码。\n\
    \n每个函数对象在创建时还会包含 `prototype` 属性。它的值是一个带有 `constructor` 属性的对象，而该 `constructor`\
    \ 属性的值就是函数本身。这与指向 `Function.prototype` 的隐藏链接是不同的。这种复杂构造的含义将在下一章揭示。\n\n由于函数是对象，它们可以像任何其他值一样被使用。函数可以存储在变量、`objects`\
    \ 和 `arrays` 中。函数可以作为参数传递给函数，也可以从函数返回。此外，由于函数是对象，函数也可以拥有方法。\n\n函数的特殊之处在于它们是可以被调用的。\n\
