    \ in: by testing for membership with the `hasOwnProperty` method or by looking\
    \ for specific types. In this case, our test for the truthiness of `count[word]`\
    \ was not specific enough.\n\nWe could have written instead:\n\n```javascript\n\
    if (typeof count[word] === 'number') {\n```\n\n# Appendix A: Awful Parts\n\n#\
    \ APPENDIX B: Bad Parts\n\n*And, I pray thee now, tell me for which of my bad\
    \ parts didst thou first fall in love with me?*\n—William Shakespeare, *Much Ado\
    \ About Nothing*\n\nIn this appendix, I present some of the problematic features\
    \ of JavaScript that are easily avoided. By simply avoiding these features, you\
    \ make JavaScript a better language, and yourself a better programmer.\n\n## ==\n\
    \nJavaScript has two sets of equality operators: `===` and `!==`, and their evil\
    \ twins `==` and `!=`. The good ones work the way you would expect. If the two\
    \ operands are of the same type and have the same value, then `===` produces `true`\
    \ and `!==` produces `false`.\n\nThe evil twins do the right thing when the operands\
    \ are of the same type, but if they are of different types, they attempt to coerce\
    \ the values. The rules by which they do that are complicated and unmemorable.\
    \ These are some of the interesting cases:\n\n```javascript\n'' == '0' // false\n\
    0 == '' // true\n0 == '0' // true\nfalse == 'false' // false\nfalse == '0' //\
    \ true\nfalse == undefined // false\nfalse == null // false\nnull == undefined\
    \ // true\n' \\t\\r\\n ' == 0 // true\n```\n\nThe lack of transitivity is alarming.\
    \ My advice is to never use the evil twins. Instead, always use `===` and `!==`.\
    \ All of the comparisons just shown produce `false` with the `===` operator.\n\
    \n## with Statement\n\nJavaScript has a `with` statement that was intended to\
    \ provide a shorthand when accessing the properties of an object. Unfortunately,\
    \ its results can sometimes be unpredictable, so it should be avoided.\n\nThe\
    \ statement:\n\n```javascript\nwith (obj) {\n  a = b;\n}\n```\n\ndoes the same\
    \ thing as:\n\n```javascript\nif (obj.a === undefined) {\n  a = obj.b === undefined\
    \ ? b : obj.b;\n} else {\n  obj.a = obj.b === undefined ? b : obj.b;\n}\n```\n\
    \nSo, it is the same as one of these statements:\n\n```javascript\na = b;\na =\
    \ obj.b;\nobj.a = b;\nobj.a = obj.b;\n```\n\nIt is not possible to tell from reading\
    \ the program which of those statements you will get. It can vary from one running\
    \ of the program to the next. It can even vary while the program is running. If\
    \ you can’t read a program and understand what it is going to do, it is impossible\
    \ to have confidence that it will correctly do what you want.\n\nSimply by being\
    \ in the language, the `with` statement significantly slows down JavaScript processors\
    \ because it frustrates the lexical binding of variable names. It was well intentioned,\
    \ but the language would be better if it didn’t have it.\n\n## eval\n\nThe `eval`\
    \ function passes a string to the JavaScript compiler and executes the result.\n\
    \nIt is the single most misused feature of JavaScript. It is most commonly used\
    \ by people who have an incomplete understanding of the language. For example,\
    \ if you know about the dot notation, but are ignorant of the subscript notation,\
    \ you might write:\n\n```javascript\neval(\"myValue = myObject.\" + myKey + \"\
    ;\");\n```\n\ninstead of:\n\n```javascript\nmyvalue = myObject[myKey];\n```\n\n\
    The `eval` form is much harder to read. This form will be significantly slower\
    \ because it needs to run the compiler just to execute a trivial assignment statement.\
    \ It also own JSLint (see Appendix C), so the tool’s ability to detect problems\
    \ is significantly reduced.\n\nThe `eval` function also compromises the security\
    \ of your application because it grants too much authority to the `eval’d text.\
    \ And it compromises the performance of the language as a whole in the same way\
    \ that the `with` statement does.\n\nThe `Function` constructor is another form\
    \ of `eval`, and should similarly be avoided.\n\nThe browser provides `setTimeout`\
    \ and `setInterval` functions that can take string arguments or function arguments.\
    \ When given string arguments, `setTimeout` and `setInterval` act as `eval`. The\
    \ string argument form also should be avoided.\n\n## continue Statement\n\nThe\
    \ `continue` statement jumps to the top of the loop. I have never seen a piece\
    \ of code that was not improved by refactoring it to remove the `continue` statement.\n\
    \n## switch Fall Through\n\nThe `switch` statement was modeled after the FORTRAN\
    \ IV computed go to statement.\n\nEach case falls through into the next case unless\
    \ you explicitly disrupt the flow.\n\nSomeone wrote to me once suggesting that\
    \ JSLint should give a warning when a case falls through into another case. He\
    \ pointed out that this is a very common source of errors, and it is a difficult\
    \ error to see in the code. I answered that that was all true, but that the benefit\
    \ of compactness obtained by falling through more than compensated for the chance\
    \ of error.\n\nThe next day, he reported that there was an error in JSLint. It\
    \ was misidentifying an error. I investigated, and it turned out that I had a\
    \ case that was falling through. In that moment, I achieved enlightenment. I no\
    \ longer use intentional fall throughs.\n\nThat discipline makes it much easier\
    \ to find the unintentional fall throughs.\n\nThe worst features of a language\
    \ aren’t the features that are obviously dangerous or useless. Those are easily\
    \ avoided. The worst features are the attractive nuisances, the features that\
    \ are both useful and dangerous.\n\n## Block-less Statements\n\nAn `if` or `while`\
    \ or `do` or `for` statement can take a block or a single statement. The single\
    \ statement form is another attractive nuisance. It offers the advantage of saving\
    \ two characters, a dubious advantage. It obscures the program’s structure so\
    \ that sub-sequent manipulators of the code can easily insert bugs. For example:\n\
    \n```javascript\nif (ok)\n  t = true;\n```\n\ncan become:\n\n```javascript\nif\
    \ (ok)\n  t = true;\n  advance();\n```\n\nwhich looks like:\n\n```javascript\n\
    if (ok) {\n  t = true;\n  advance();\n}\n```\n\nbut which actually means:\n\n\
    ```javascript\nif (ok) {\n  t = true;\n}\nadvance();\n```\n\nPrograms that appear\
    \ to do one thing but actually do another are much harder to get right. A disciplined\
    \ and consistent use of blocks makes it easier to get it right.\n\n## ++ --\n\n\
    The increment and decrement operators make it possible to write in an extremely\
    \ terse style. In languages such as C, they made it possible to write one-liners\
    \ that could do string copies:\n\n```javascript\nfor (p = src, q = dest; !*p;\
    \ p++, q++) *q = *p;\n```\n\nThey also encourage a programming style that, as\
    \ it turns out, is reckless. Most of the buffer overrun bugs that created security\
    \ vulnerabilities were due to code like this.\n\nIn my own practice, I observed\
    \ that when I used `++` and `--`, my code tended to be too tight, too tricky,\
    \ too cryptic. So, as a matter of discipline, I don’t use them any more.\n\nI\
    \ think that as a result, my coding style has become cleaner.\n\n## Bitwise Operators\n\
    \nJavaScript has the same set of bitwise operators as Java:\n\n`&` and\n\n`|`\
    \ or\n\n`^` xor\n\n`~` not\n\n`>>` signed right shift\n\n`>>>` unsigned right\
    \ shift\n\n`<<` left shift\n\nIn Java, the bitwise operators work with integers.\
    \ JavaScript doesn’t have integers. It only has double precision floating-point\
    \ numbers. So, the bitwise operators convert their number operands into integers,\
    \ do their business, and then convert them back. \n\nIn most languages, these\
    \ operators are very close to the hardware and very fast. In JavaScript, they\
    \ are very far from the hardware and very slow. JavaScript is rarely used for\
    \ doing bit manipulation.\n\nAs a result, in JavaScript programs, it is more likely\
    \ that `&` is a mistyped `&&` operator.\n\nThe presence of the bitwise operators\
    \ reduces some of the language’s redundancy, making it easier for bugs to hide.\n\
    \n## function Statement Versus the function Expression\n\nJavaScript has a function\
    \ statement as well as a function expression. This is confusing because they can\
    \ look exactly the same. A function statement is shorthand for a `var` statement\
    \ with a function value.\n\nThe statement:\n\n```javascript\nfunction foo( ) {}\n\
    ```\n"
