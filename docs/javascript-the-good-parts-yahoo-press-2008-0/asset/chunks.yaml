    **Chapter 7: Regular Expressions**


    In [Chapter 2,](#index_split_000.html_p21) we used railroad diagrams to describe
    the JavaScript language. We can also use them to describe the languages defined
    by regular expressions. That may make it easier to see what a regular expression
    does. This is a railroad diagram for parse_url.


    ***parse_url***


    ***scheme***


    ***begin string***


    ***letter***


    :


    ***slash***


    /


    /


    /


    ***host***


    ***letter or digit***


    ***or*** . ***or*** -


    ***port***


    :


    ***digit***


    ***path***


    ***any character***


    /


    ***except*** ? ***or*** #


    ***query***


