    \ Quo 实例。\nvar myQuo = new Quo(\"confused\");\ndocument.writeln(myQuo.get_status(\
    \ // // confused\n```\n\n那些意图配合 `new` 前缀使用的函数被称为*构造函数*（constructors）。按照约定，它们被存储在名称大大写的变量中。如果在没有\
    \ `new` 前缀的情况下调用了构造函数，可能会在没有编译时或运行时警告的情况下发生非常糟糕的事情，因此大写首字母的命名约定非常重要。\n\n不建议使用这种风格的构造函数。我们将在下一章中看到更好的替代方案。\n\
    \n### Apply 调用模式\n\n由于 JavaScript 是一门函数式面向对象的语言，因此函数可以拥有方法。\n\n`apply` 方法允许我们构建一个参数数组，用于调用函数。它还允许我们选择此值的值。`apply`\
    \ 方法接受两个参数：第一个是应该绑定到 `this` 的值；第二个是参数数组。\n\n```javascript\n// 创建一个包含 2 个数字的数组并将它们相加。\n\
    var array = [3, 4];\nvar sum = add.apply(null, array); // sum 为 7\n\n// 创建一个带有\
    \ status 成员的对象。\nvar statusObject = {\n  status: 'A-OK'\n};\n\n// statusObject\
    \ 没有继承自 Quo.prototype，\n// 但即使 statusObject 没有 get_status 方法，\n// 我们仍然可以在 statusObject\
    \ 上调用 get_status 方法。\nvar status = Quo.prototype.get_status.apply(statusObject);\n\
    // status 为 'A-OK'\n```\n\n30 |\n\n# 第 4 章：函数\n\n### 参数 (Arguments)\n\n当函数被调用时，一个额外的、可用的参数是\
    \ `arguments` 数组。它让函数能够访问调用时提供的所有参数，包括未分配给参数的冗余参数。这使得编写接收数量参数的函数成为可能：\n\n```javascript\n\
    // 创建一个相加很多内容的函数。\n// 注意，在函数内部定义变量 sum\n// 不会与函数外部定义的 sum 冲突。\n// 函数只看得看到内部的那个。\n\
    var sum = function () {\n  var i, sum = 0;\n  for (i = 0; i < arguments.length;\
    \ i += 1) {\n    sum += arguments[i];\n  }\n  return sum;\n};\n\ndocument.writeln(sum(4,\
    \ 8, 15, 16, 23, 42)); // 108\n```\n\n这不是一个特别实用的模式。在第 6 章，中，我们将看到如何为数组添加类似的方法。\n\
    \n由于设计上的错误，`arguments` 并不是真正的数组。它是一个类数组对象。\n\n`arguments` 拥有 `length` 属性，但它缺少所有的数组方法。我们将在本章结束看到该设计错误导致的。\n\
    \n### 返回 (Return)\n\n当函数被调用时，它从第一条语句开始执行，并在遇到关闭函数体的 `}` 时结束。这导致函数将控制权返回给调用该函数的程序部分。\n\
    \n`return` 语句可以导致函数提前返回。当执行 `return` 时，函数会立即返回，不再执行剩余的语句。\n\n函数始终会返回一个值。如果未指定返回值，则返回\
    \ `undefined`。\n\n如果函数是带有 `new` 前缀调用的，且返回值不是对象，则改为返回 `this`（新对象）。\n\n返回 | 31 |\n\
    \n### 异常 (Exceptions)\n\nJavaScript 提供了一种异常处理机制。异常是寻常（但并非完全出意之外）的意外，它们会干扰程序的正常流程。当检测到此类意外时，你的程序应该抛出一个异常：\n\
    \n```javascript\nvar add = function (a, b) {\n  if (typeof a !== 'number' || typeof\
    \ b !== 'number') {\n    throw {\n      name: 'TypeError',\n      message: 'add\
    \ needs numbers'\n    };\n  }\n  return a + b;\n}\n```\n\n### `throw` 语句中断函数的执行。它应该被赋予一个异常对象，其中包含一个\
    \ `name` 属性来标识异常类型，以及一个描述性的 `message` 属性。你也可以添加其他属性。\n\n异常对象将被传递到 `try` 语句的 `catch`\
    \ 子句：\n\n```javascript\n// 创建一个 try_it 函数，它错误地调用新的 add\n// 函数。\nvar try_it = function\
    \ () {\n  try {\n    add(\"seven\");\n  } catch (e) {\n    document.writeln(e.name\
    \ + ': ' + e.message);\n  }\n}\n\ntry_it();\n```\n\n如果在 `try` 块内抛出异常，控制将转移到 `catch`\
    \ 子句。\n\n`try` 语句有一个 `catch` 块，可以捕所有异常。如果你的处理取决于异常的类型，那么异常处理程序必须检查 `name` 以确定异常的类型。\n\
    \n### 扩展类型 (Augmenting Types)\n\nJavaScript 允许语言的基本类型被*扩展*。在第 3 章，中，我们看到向 `Object.prototype`\
    \ 添加方法可以使该方法对所有对象可用。这对于函数、数组、字符串、数字、正则表达式和布尔值同样有效。\n\n例如，通过扩展 `Function.prototype`，我们可以让所有函数都拥有一个方法：\n\
    \n32 |\n\n# 第 4 章：函数\n\n```javascript\nFunction.prototype.method = function (name,\
    \ func) {\n  this.prototype[name] = func;\n  return this;\n};\n```\n\n通过向 `Function.prototype`\
    \ 扩展一个方法，我们不再需要输入属性的名称。那部分丑陋的代码现在可以隐藏了。\n\nJavaScript 没有单独整数类型，因此有时需要提取数字的整数部分。JavaScript\
    \ 提供的该方法很丑。我们可以通过向 `Number.prototype` 添加一个整数方法来修复它。它根据数字的正负使用 `Math.ceil` 或 `Math.floor`：\n\
    \n```javascript\nNumber.method('integer', function () {\n  return Maththis < 0\
    \ ? 'ceil' : 'floor';\n});\n\ndocument.writeln((-10 / 3).integer( )); -3\n```\n\
    \nJavaScript 缺少一个删除字符串两端空格的方法。这是一个容易修复的疏漏：\n\n```javascript\nString.method('trim',\
    \ function () {\n  return this.replace(/^\\s+|\\s+$/g, '');\n});\n\ndocument.writeln('\"\
    ' + \" neat \".trim( ) + '\"');\n```\n\n我们的 `trim` 方法使用了正则表达式。我们将在第 7 章](#index_split_000.html_p81)中更多地学习正则表达式。\n\
    \n通过扩展基本类型，我们可以显著提高语言的表达能力。由于 JavaScript 原型继承的动态性，所有值都会被赋予新方法，即使是在方法创建之前创建的值。\n\
    \n基本类型的原型是公共结构，因此在混合库时必须小心。一种防御性技术是在已知方法缺失时才添加方法：\n\n```javascript\n// 条件地添加方法。\n\
    Function.prototype.method = function (name, func) {\n  if (!this.prototype[name])\
    \ {\n    this.prototype[name] = func;\n  }\n  return this;\n};\n```\n\n另一个问题是\
    \ `for in` 语句与原型的交互不佳。我们在第 3 章中见过缓解该问题的方法：我们可以使用 `hasOwnProperty` 方法过滤掉继承的属性，也可以查找特定的类型。\n\
    \n**扩展类型** | 33 |\n\n### 递归 (Recursion)\n\n*递归*函数是指会调用自身（直接或间接）的函数。递归是一种强大的编程技术，其中问题被分为一组相似的子问题，每个子问题都通过简单的解决方案来解决。通常，递归函数通过反复调用自身来解决其子问题。\n\
    \n"
- fmt: "\nThe Towers of Hanoi is a famous puzzle. The equipment includes three posts\
    \ and a set of discs of various diameters with holes in their centers. The setup\
    \ stacks all of the discs on the source post with smaller discs on top of larger\
    \ discs. The goal is to move the stack to the destination post by moving one disc\
    \ at a time to another post, never placing a larger disc on a smaller disc. This\
    \ puzzle has a trivial recursive solution:\n\n```javascript\nvar hanoi = function\
    \ hanoi(disc, src, aux, dst) {\n  if (disc > 0) {\n    hanoi(disc - 1, src, dst,\
    \ aux);\n    document.writeln('Move disc ' + disc + ' from ' + src + ' to ' +\
    \ dst);\n    hanoi(disc - 1, aux, src, dst);\n  }\n};\n\nhanoi(3, 'Src', 'Aux',\
    \ 'Dst');\n```\n\nIt produces this solution for three discs:\nMove disc 1 from\
    \ Src to Dst\nMove disc 2 from Src to Aux\nMove disc 1 from Dst to Aux\nMove disc\
    \ 3 from Src to Dst\nMove disc 1 from Aux to Src\nMove disc 2 from Aux to Dst\n\
    Move disc 1 from Src to Dst\n\nThe `hanoi` function moves a stack of discs from\
    \ one post to another, using the auxiliary post if necessary. It breaks the problem\
    \ into three subproblems. First, it uncovers the bottom disc by moving the substack\
    \ above it to the auxiliary post. It can then move the bottom disc to the destination\
    \ post. Finally, it can move the substack from the auxiliary post to the destination\
    \ post. The movement of the substack is handled by calling itself recursively\
    \ to work out those subproblems.\n\nThe `hanoi` function is passed the number\
    \ of the disc it is to move and the three posts it is to use. When it calls itself,\
    \ it is to deal with the disc that is above the disc it is currently working on.\
    \ Eventually, it will be called with a nonexistent disc number. In that case,\
    \ it does nothing. That act of nothingness gives us confidence that the function\
    \ does not recurse forever.\n\nRecursive functions can be very effective in manipulating\
    \ tree structures such as the browser’s Document Object Model (DOM). Each recursive\
    \ call is given a smaller piece of the tree to work on:\n\n### Chapter 4: Functions\n\
    \n```javascript\n// Define a walk_the_DOM function that visits every\n// node\
    \ of the tree in HTML source order, starting\n// from some given node. It invokes\
    \ a function,\n// passing it each node in turn. walk_the_DOM calls\n// itself\
    \ to process each of the child nodes.\nvar walk_the_DOM = function walk(node,\
    \ func) {\n  func(node);\n  node = node.firstChild;\n  while (node) {\n    walk(node,\
    \ func);\n    node = node.nextSibling;\n  }\n};\n\n// Define a getElementsByAttribute\
    \ function. It\n// takes an attribute name string and an optional\n// matching\
    \ value. It calls walk_the_DOM, passing it a\n// function that looks for an attribute\
    \ name in the\n// node. The matching nodes are accumulated in a\n// results array.\n\
    var getElementsByAttribute = function (att, value) {\n  var results = [];\n  walk_the_DOM(document.body,\
    \ function (node) {\n    var actual = node.nodeType === 1 && node.getAttribute(att);\n\
    \    if (typeof actual === 'string' && (actual === value || typeof value !== 'string'))\
    \ {\n      results.push(node);\n    }\n  });\n  return results;\n};\n```\n\nSome\
    \ languages offer the `tail recursion optimization`. This means that if a function\
    \ returns the result of invoking itself recursively, then the invocation is replaced\
    \ with a loop, which can significantly speed things up. Unfortunately, JavaScript\
    \ does not currently provide tail recursion optimization. Functions that recurse\
    \ very deeply can fail by exhausting the return stack:\n\n```javascript\n// Make\
    \ a factorial function with tail\n// recursion. It is tail recursive because\n\
    // it returns the result of calling itself.\n// JavaScript does not currently\
    \ optimize this form.\nvar factorial = function factorial(i, a) {\n  a = a ||\
    \ 1;\n  if (i < 2) {\n    return a;\n  }\n  return factorial(i - 1, a * i);\n\
    };\n\ndocument.writeln(factorial(4)); // 24\n```\n\n### Recursion\n\n### Scope\n\
    `Scope` in a programming language controls the visibility and lifetimes of variables\
    \ and parameters. This is an important service to the programmer because it reduces\
    \ naming collisions and provides automatic memory management:\n\n```javascript\n\
    var foo = function () {\n  var a = 3, b = 5;\n  var bar = function () {\n    var\
    \ b = 7, c = 11;\n    // At this point, a is 11, b is 7, and c is 11\n    a +=\
    \ b + c;\n    // At this point, a is 21, b is 7, and c is 11\n  };\n  // At this\
    \ point, a is 3, b is 5, and c is not defined\n  bar();\n  // At this point, a\
    \ is 21, b is 5\n};\n```\n\nMost languages with C syntax have block scope. All\
    \ variables defined in a block (a list of statements wrapped with curly braces)\
    \ are not visible from outside of the block. The variables defined in a block\
    \ can be released when execution of the block is finished. This is a good thing.\n\
    \nUnfortunately, JavaScript does not have block scope even though its block syntax\
    \ suggests that it does. This confusion can be a source of errors.\n\nJavaScript\
    \ does have function scope. That means that the parameters and variables defined\
    \ in a function are not visible outside of the function, and that a variable defined\
    \ anywhere within a function is visible everywhere within the function.\n\nIn\
    \ many modern languages, it is recommended that variables be declared as late\
    \ as possible, at the first point of use. That turns out to be bad advice for\
    \ JavaScript because it lacks block scope. So instead, it is best to declare all\
    \ of the variables used in a function at the top of the function body.\n\n###\
    \ Closure\nThe good news about scope is that inner functions get access to the\
    \ parameters and variables of the functions they are defined within (with the\
    \ exception of this and arguments). This is a very good thing.\n\nOur `getElementsByAttribute`\
    \ function worked because it declared a `results` variable, and the inner function\
    \ that it passed to `walk_the_DOM` also had access to the `results` variable.\n\
    \nA more interesting case is when the inner function has a longer lifetime than\
    \ its outer function.\n\nEarlier, we made a `myObject` that had a value and an\
    \ increment method. Suppose we wanted to protect the value from unauthorized changes.\n\
    \nInstead of initializing `myObject` with an object literal, we will initialize\
    \ `myObject` by calling a function that returns an object literal. That function\
    \ defines a `value` variable. That variable is always available to the `increment`\
    \ and `getValue` methods, but the function’s scope keeps it hidden from the rest\
    \ of the program:\n\n```javascript\nvar myObject = (function () {\n  var value\
    \ = 0;\n  return {\n    increment: function (inc) {\n      value += typeof inc\
    \ === 'number' ? inc : 1;\n    },\n    getValue: function () {\n      return value;\n\
    \    }\n  };\n}(());\n```\n\nWe are not assigning a function to `myObject`. We\
    \ are assigning the result of invoking that function. Notice the `()` on the last\
    \ line. The function returns an object containing two methods, and those methods\
    \ continue to enjoy the privilege of access to the `value` variable.\n\nThe `Quo`\
    \ constructor from earlier in this chapter produced an object with a `status`\
    \ property and a `get_status` method. But that doesn’t seem very interesting.\
    \ Why would you call a getter method on a property you could access directly?\
    \ It would be more useful if the `status` property were private. So, let’s define\
    \ a different kind of `quo` function to do that:\n\n```javascript\nvar quo = function\
    \ (status) {\n  return {\n    get_status: function () {\n      return status;\n\
    \    }\n  };\n};\n\n// Make an instance of quo.\nvar myQuo = quo(\"amazed\");\n\
    document.writeln(myQuo.get_status());\n```\n\nThis `quo` function is designed\
    \ to be used without the `new` prefix, so the name is not capitalized. When we\
    \ call `quo`, it returns a new object containing a `get_status` method. A reference\
    \ to that object is stored in `myQuo`. The `get_status` method still has privileged\
    \ access to `quo`’s `status` property even though `quo` has already returned.\n"
