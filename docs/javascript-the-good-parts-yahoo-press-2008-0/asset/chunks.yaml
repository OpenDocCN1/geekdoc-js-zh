    # 第一章


    ## 好的部分


    …抛开我那些优点不谈，我并无其他之处。


    ——威廉·莎士比亚，《温莎的贤妇娘》


    当我还是一个年轻的初级程序员时，我会学习我所用语言的每一个特性，并在编写代码时尝试使用所有这些特性。我想这可能是一种炫耀的方式，而且我想这之所以奏效，是因为当你想知道如何使用某个特定特性时，我就是那个你要找的那个人。


    最终，我发现某些特性带来的麻烦远大于其价值。其中一些特性的定义糟糕，因此更容易导致可移植性问题。有些特性导致的代码难以阅读或修改。有些特性诱使我写出过于晦涩且容易出错的代码。而还有某些特性本身就是设计错误。有时候，语言设计者也会犯错。


    大多数编程语言都包含好的部分和坏的部分。我发现，通过只使用好的部分并避开坏的部分，我可以成为一名更优秀的程序员。毕竟，你怎么能用坏的部分构建出好东西呢？


    标准委员会很少能从语言中消除缺陷，因为这样做会导致所有依赖于这些坏部分的糟糕程序发生崩溃。他们通常无能为力，除了在现有的缺陷堆上继续堆砌新特性。而新特性并不总是能和谐地相互作用，从而产生更多的坏部分。


    但*你*有权定义自己的子集。你可以通过完全依赖好的部分来编写出更好的程序。


    JavaScript 是一门坏部分多得离谱的语言。它在令人惊人的短时间内从无存在变成了全球采用。它从未在实验室里经历过可以进行尝试和打光的阶段。它被原封不动地直接带入了
    Netscape Navigator 2，而且当时还非常粗糙。当 Java™ applets 失败后，JavaScript 默认成为了“Web 语言”。JavaScript
    的流行几乎完全与其作为编程语言的质量无关。


    ### 1


    幸运的是，JavaScript 拥有一些极其出色的好的部分。在 JavaScript 中，存在着一种美丽、优雅且高度表达的语言，它被埋没在一堆热腾腾的良好意图和失误之下。JavaScript
    最出色的本质被隐藏得如此彻底，以至于多年来，人们对 JavaScript 的主流观点是它是一个丑陋、无能的玩具。我在这里的意图是揭 JavaScript 的优秀之处，它是一种卓越的动态编程语言。JavaScript
    是一块大理石，我不断凿掉那些不美丽的特性，直到语言的真实本质显现。


    我相信，我雕刻出的这个优雅子集远优于语言本身，它更可靠、更易读、更易维护。


    本书不会尝试完全描述这门语言。相反，它将侧重于好的部分，并偶尔给出警告以避开坏的部分。这里描述的子集可以用于构建各种大小可靠且易读的程序。


    通过只关注好的部分，我们可以缩短学习时间，增加健壮性，并拯救一些树。


    也许学习好的部分最大的益处在于，你可以避免“忘记坏部分”的需求。忘记糟糕的模式是非常困难的。这是一项我们大多数人极度不愿面对的痛苦任务。有时候，语言子集化是为了让学生更易学习。但在这一次，我将
    JavaScript 子集化是为了让它更适合专业人士使用。


    ## 为什么选择 JavaScript？


    JavaScript 是一门坏部分多得离谱的语言。它在令人惊人的短时间内从无存在变成了全球采用。它从未在实验室里经历过可以进行尝试和打光的阶段。它被原封不动地直接带入了
    Netscape Navigator 2，而且当时还非常粗糙。当 Java™ applets 失败后，JavaScript 默认成为了“Web 语言”。JavaScript
    的流行几乎完全与其作为编程语言的质量无关。


    ### 1


    幸运的是，JavaScript 拥有一些极其出色的好的部分。在 JavaScript 中，存在着一种美丽、优雅且高度表达的语言，它被埋没在一堆热腾腾的良好意图和失误之下。JavaScript
    最出色的本质被隐藏得如此彻底，以至于多年来，人们对 JavaScript 的主流观点是它是一个丑陋、无能的玩具。我在这里的意图是揭 JavaScript 的优秀之处，它是一种卓越的动态编程语言。JavaScript
    是一块大理石，我不断凿掉那些不美丽的特性，直到语言的真实本质显现。


    我相信，我雕刻出的这个优雅子集远优于语言本身，它更可靠、更易读、更易维护。


    ## 第一章：好的部分


    ### 分析 JavaScript


    JavaScript 构建在非常好的和一些糟糕的想法之上。


    非常好的想法包括函数、松散类型、动态对象和丰富的字面量表示。糟糕的主意包括基于全局变量的编程模型。


    如今大多数语言的趋势是强类型。理论上，强类型允许编译器在编译时检测出一类错误。我们越早检测并修复错误，成本就越低。JavaScript 是一门类型化语言，因此
    JavaScript 编译器无法检测类型错误。对于那些从强类型语言转向 JavaScript 的人来说，这可能会令他们报警。但事实证明强类型并不能消除仔细测试的需求。而且我在工作中发现，强检查所发现的那种错误并不是我担心的错误。相反，我发现松散类型是解放性的。我不需要构建复杂的类层次结构。我也永远不需要类型转换或与类型系统斗争来获得我想要的行为。


    JavaScript 有一种非常强大的对象字面量表示法。只需列出其组件即可创建对象。这种表示法是流行的数据交换格式 JSON 的灵感来源。（有关 JSON
    的更多内容请参见附录 E.#index_split_001.html_p152）


    JavaScript 中一个有争议的特性是原型继承。JavaScript 拥有一个无类的对象系统，对象直接从其他对象继承属性。这非常强大，但对于受过经典训练的程序员来说是陌生的。如果你尝试将经典设计模式直接应用于
    JavaScript，你将感到挫败。但如果你学会顺着 JavaScript 的原型本质工作，你的努力将得到回报。


    JavaScript 因其关键想法的选择而饱受诋毁。尽管在大多数情况下，这些选择是好的，即使是不寻常的。但有一个选择特别糟糕：JavaScript 依赖全局变量进行链接。所有编译单元的所有顶层变量都被丢进在一个称为全局对象的公共命名空间中。这是一件坏事，因为全局变量是邪恶的，而在
    JavaScript 中它们是基础性的。幸运的是，正如我们将看到的，JavaScript 同时也给了我们解决这个问题的工具。


    在某些情况下，我们无法忽略坏部分。有一些无法避免的糟糕部分，会在它们出现时被标出来。它们也将在下文中总结。


