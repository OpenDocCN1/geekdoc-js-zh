  trans: "\n\n我也添加了块作用域（block scope）。块作用域并不是一个必要的特性，但没有它会让经验程序员感到困惑。我包含块作用域是因为我预见到我的解析器会被用来解析非\
    \ JavaScript 的语言，而这些语言会正确处理作用域。我为解析器编写的代码风格并不在乎是否存在块作用域。我建议你也采用这种编写方式。\n\n当我开始考虑这本书时，我想要将“子集”的想法推得更远，展示如何对现有的编程语言通过排除低价值功能之外不做任何更改，来对其进行重大改进。\n\
    \n我们看到了许多功能驱动的产品设计，在这些设计中，功能的成本没有得到适当考虑。功能可能对消费者产生负面价值，因为它们让产品更难理解和使用。我们发现，人们喜欢那种“用就好用”的产品。事实证明，这种“用就好用”的设计比堆砌长功能列表的设计要困难得多。\n\
    \n功能具有规范成本、设计成本和开发成本。还有测试成本和可靠性成本。功能越多，越容易出现问题，或者容易与其他功能产生糟糕的交互。在软件系统中，存在存储成本，这种成本正变得可以忽略不计；但在移动应用中，这种成本再次变得显著。性能成本是上升的，因为摩尔定律不适用于电池。\n\
    \n## 优美的特性\n\n具有文档成本。每个功能都增加了手册页数，增加了培训成本。为少数用户提供价值的功能会给所有用户带来成本。因此，在设计产品和编程语言时，我们希望做好核心功能——即好的部分——因为那里是我们创造大部分价值的地方。\n\
    \n我们都能在使用的产品中找到好的部分。我们看重简单性，当简单性没有被提供给我们时，我们就自己去创造。我的微波炉有许多功能，但我唯一使用的只有 `cook`\
    \ 和 `clock`。而设置时钟是一场苦战。我们通过寻找并坚持使用那些好的部分来应对功能驱动设计的复杂性。\n\n如果产品和编程语言在设计时只包含好的部分，那就太好了。\n\
    \n100\n\n|\n\n# 第 10 章：优美的特性 \n\n## 附录 A：糟糕的部分\n\n*那将在言语和行动上证明是糟糕的。*\n—威廉·莎士比亚，《提尔的普里克斯》\n\
    \n在这个附录中，我介绍了 JavaScript 中那些难以避免的问题性特性。你必须意识到这些事情并做好应对准备。\n\n### 全局变量\n\nJavaScript\
    \ 所有糟糕特性中最糟糕的应该是它对全局变量的依赖。`global variable` 是在每个作用域内都可见的变量。在非常小的程序中，全局变量可以是一种便利，但随着程序变大，它们很快变得难以管理。因为\
    \ `global variable` 可以被程序的任何部分在任何时间更改，它们会显著复杂化程序的行为。使用全局变量会降低使用它们的程序的可靠性。\n\n\
    全局变量使得在同一个程序中运行独立的子程序变得更加困难。如果子程序恰好拥有同名的全局变量，那么它们将相互干扰并可能失败，通常是以一种难以诊断的方式失败。\n\
    \n许多语言都有全局变量。例如，Java 的 `public static` 成员就是全局变量。JavaScript 的问题不仅在于它允许这些变量的存在，更在于它要求必须有这些变量。JavaScript\
    \ 没有链接器。所有的编译单元都被加载到一个公共的全局对象中。\n\n定义全局变量有三种方法。第一种是将 `var` 语句放在任何函数之外：\n\n```\n\
    var foo = value;\n```\n\n第二种是直接向全局对象添加属性。全局对象是所有全局变量的容器。在网页浏览器中，全局对象的名为 `window`：\n\
    \n```javascript\nwindow.foo = value;\n```\n\n101\n\n第三种是在不声明变量的情况下使用变量。这被称为 `implied\
    \ global`（隐式全局）：`foo = value;`\n\n这本意是为了给初学者提供便利，让他们无需在使用变量之前进行声明。遗憾的是，遗忘声明变量是一个非常常见的错误。JavaScript\
    \ 将遗忘的变量设为全局的策略创建了非常难以发现的 bug。\n\n### 作用域\n\nJavaScript 的语法源自 C。在所有其他类 C 语言中，块（一组用大括号括起来的语句）会创建一个作用域。在块中声明的变量在块外是不可见的。JavaScript\
    \ 使用了块语法，但没有提供块作用域：在块中声明的变量在包含该块的函数范围内都是可见的。对于有其他语言经验的程序员来说，这可能会令惊讶。\n\n在大多数语言中，最好的做法是在第一次使用的地方声明变量。这在\
    \ JavaScript 中被证明是一种坏习惯，因为它没有块作用域。在每个函数的顶部声明所有变量更好。\n\n### 分号自动插入\n\nJavaScript\
    \ 有一种机制，尝试通过自动插入分号来修正错误的程序。不要依赖这一点。它可能会掩盖更严重的错误。\n\n它有时会在不希望的地方插入分号。考虑分号自动插入对\
    \ `return` 语句的影响。如果 `return` 语句返回一个值，那么该值表达式必须与 `return` 位于同一行：\n\n```javascript\n\
    return\n{\n  status: true\n};\n```\n\n这看起来是返回一个包含 `status` 成员的对象。遗憾的是，分号自动插入将其变成了一个返回\
    \ `undefined` 的语句。并没有警告说分号自动插入导致了对程序的误读。如果将 `{` 放在上一行的末尾而不是而不是下一行的开头，就可以避免这个问题：\n\
    \n```javascript\nreturn {\n  status: true\n};\n```\n\n102\n\n|\n\n# 附录 A：糟糕的部分\n\
    \n### 预留字\n\n以下单词在 JavaScript 中是预留的：\n\n`abstract` `boolean` `break` `byte` `case`\
    \ `catch` `char` `class` `const` `continue` `debugger` `default` `delete` `do`\
    \ `double` `else` `enum` `export` `extends` `false` `final` `finally` `float`\
    \ `for` `function` `goto` `if` `implements` `import` `in` `instanceof` `int` `interface`\
    \ `long` `native` `new` `null` `package` `private` `protected` `public` `return`\
    \ `short` `static` `super` `switch` `synchronized` `this` `throw` `throws` `transient`\
    \ `true` `try` `typeof` `var` `volatile` `void` `while` `with` 这些词中的大多数没有在语言中使用。\n\
    \n它们不能用于命名名或参数名。当预留字被用作对象字面量中的键时，必须加上引号。它们不能与点表示法配合，因此有时需要使用括号表示法：\n\n```javascript\n\
    var method; // ok\n\nvar class; // illegal\n\nobject = {box: value}; // ok\n\n\
    object = {case: value}; // illegal\n\nobject = {'case': value}; // ok\n\nobject.box\
    \ = value; // ok\n\nobject.case = value; // illegal\n\nobject['case'] = value;\
    \ // ok\n```\n\n### Unicode\n\nJavaScript 设计时，Unicode 预计最多有 65,536 个字符。从那以后它增长到超过\
    \ 100 万个字符的容量。JavaScript 的字符是 16 位的。足够涵盖原始的 65,536 个（现在被称为基础语言平面）。剩余的一百万个字符中的每一个都可以由一对字符来表示。Unicode\
    \ 认为这一对是一个单个字符，而 JavaScript 认为这一对是两个不同的字符。\n\n### typeof\n\n`typeof` 运算符返回一个识别操作数类型的字符串。所以：`typeof\
    \ 98.6` 产生 `'number'`。遗憾的是：\n\n```javascript\ntypeof null\n```\n\n返回 `'object'`\
    \ 而不是 `'null'`。哎。测试 null 的更好方法是简单的：`my_value === null`\n\ntypeof\n\n|\n\n103\n\
    \n"
- fmt: "\nA bigger problem is testing a value for objectness. `typeof` cannot distinguish\
    \ between null and objects, but you can because null is falsy and all objects\
    \ are truthy:\n\n```javascript\nif (my_value && typeof my_value === 'object')\
    \ {\n  // my_value is an object or an array!\n}\n```\n\nAlso see the later sections\
    \ “NaN” and “Phony Arrays.”\n\nImplementations disagree on the type of regular\
    \ expression objects. Some implementations report that:\n\n```\ntypeof /a/\n```\n\
    \nis 'object', and others say that it is 'function'. It might have been more useful\
    \ to report 'regexp', but the standard does not allow that.\n\n### parseInt\n\n\
    `parseInt` is a function that converts a string into an integer. It stops when\
    \ it sees a nondigit, so `parseInt(\"16\")` and `parseInt(\"16 tons\")` produce\
    \ the same result. It would be nice if the function somehow informed us about\
    \ the extra text, but it doesn’t.\n\nIf the first character of the string is 0,\
    \ then the string is evaluated in base 8 instead of base 10. In base 8, 8 and\
    \ 9 are not digits, so `parseInt(\"08\")` and `parseInt(\"09\")` produce 0 as\
    \ their result. This error causes problems in programs that parse dates and times.\
    \ Fortunately, `parseInt` can take a radix parameter, so that `parseInt(\"08\"\
    ,10)` produces 8. I recommend that you always provide the radix parameter.\n\n\
    ### +\n\nThe `+` operator can add or concatenate. Which one it does depends on\
    \ the types of the parameters. If either operand is an empty string, it produces\
    \ the other operand converted to a string. If both operands are numbers, it produces\
    \ the sum. Otherwise, it converts both operands to strings and concatenates them.\
    \ This complicated behavior is a common source of bugs. If you intend `+` to add,\
    \ make sure that both operands are numbers.\n\n### Floating Point\n\nBinary floating-point\
    \ numbers are inept at handling decimal fractions, so `0.1 + 0.2` is not equal\
    \ to `0.3`. This is the most frequently reported bug in JavaScript, and it is\
    \ an intentional consequence of having adopted the IEEE Standard for Binary Floating-Point\
    \ Arithmetic (IEEE 754). This standard is well-suited for many applications, but\
    \ it violates most of the things you learned about numbers in middle school.\n\
    \n### 104\n\n### |\n\n### Appendix A: Awful Parts\n\nFortunately, integer arithmetic\
    \ in floating point is exact, so decimal representation errors can be avoided\
    \ by scaling.\n\nFor example, dollar values can be converted to whole cents values\
    \ by multiplying them by 100. The cents then can be accurately added. The sum\
    \ can be divided by 100 to convert back into dollars. People have a reasonable\
    \ expectation when they count money that the results will be exact.\n\n### NaN\n\
    \nThe value `NaN` is a special quantity defined by IEEE 754. It stands for *not\
    \ a number*, even though:\n\n```javascript\ntypeof NaN === 'number' // true\n\
    ```\n\nThe value can be produced by attempting to convert a string to a number\
    \ when the string is not in the form of a number. For example:\n\n```javascript\n\
    + '0' // 0\n+ 'oops' // NaN\n```\n\nIf `NaN` is an operand in an arithmetic operation,\
    \ then `NaN` will be the result. So, if you have a chain of formulas that produce\
    \ `NaN` as a result, at least one of the inputs was `NaN`, or `NaN` was generated\
    \ somewhere.\n\nYou can test for `NaN`. As we have seen, `typeof` does not distinguish\
    \ between numbers and `NaN`, and it turns out that `NaN` is not equal to itself.\
    \ So, surprisingly:\n\n```javascript\nNaN === NaN // false\nNaN !== NaN // true\n\
    ```\n\nJavaScript provides an `isNaN` function that can distinguish between numbers\
    \ and `NaN`:\n\n```javascript\nisNaN(NaN) // true\nisNaN(0) // false\nisNaN('oops')\
    \ // true\nisNaN('0') // false\n```\n\nThe `isFinite` function is the best way\
    \ of determining whether a value can be used as a number because it rejects `NaN`\
    \ and `Infinity`. Unfortunately, `isFinite` will attempt to convert its operand\
    \ to a number, so it is not a good test if a value is not actually a number. You\
    \ may want to define your own `isNumber` function:\n\n```javascript\nvar isNumber\
    \ = function isNumber(value) {\n  return typeof value === 'number' && isFinite(value);\n\
    }\n```\n\n### Phony Arrays\n\nJavaScript does not have real arrays. That isn’t\
    \ all bad. JavaScript’s arrays are really easy to use. There is no need to give\
    \ them a dimension, and they never generate out-of-bounds errors. But their performance\
    \ can be considerably worse than real arrays.\n\n### Phony Arrays\n\n### |\n\n\
    ### 105\n\nThe `typeof` operator does not distinguish between arrays and objects.\
    \ To determine that a value is an array, you also need to consult its `constructor`\
    \ property:\n\n```javascript\nif (my_value && typeof my_value === 'object' &&\
    \ my_value.constructor === Array) {\n  // my_value is an array!\n}\n```\n\nThat\
    \ test will give a false negative if an array was created in a different frame\
    \ or window. This test is more reliable when the value might have been created\
    \ in another frame:\n\n```javascript\nif (Object.prototype.toString.apply(my_value)\
    \ === '[object Array]'){\n  // my_value is truly an array!\n}\n```\n\nThe `arguments`\
    \ array is not an array; it is an object with a `length` member. These tests will\
    \ not identify the `arguments` array as an array.\n\n### Falsy Values\n\n[JavaScript\
    \ has a surprisingly large set of falsy values, shown in Table A-1.](#index_split_001.html_p122)\n\
    \n*Table A-1. The many falsy values of JavaScript*\n\n| Value | Type |\n| ---\
    \ | --- |\n| 0 | Number |\n| NaN (not a number) | Number |\n| '' (empty string)\
    \ | String |\n| false | Boolean |\n| null | Object |\n| undefined | Undefined\
    \ |\n\nThese values are all falsy, but they are not interchangeable. For example,\
    \ this is the wrong way to determine if an object is missing a member: `value\
    \ = myObject[name];`.\n\n```javascript\nif (value == null) {\n  alert(name + '\
    \ not found.');\n}\n```\n\n`undefined` is the value of missing members, but the\
    \ snippet is testing for `null`. It is using the `==` operator (see [Appendix\
    \ B),](#index_split_001.html_p125)) which does type coercion, instead of the more\
    \ reliable `===` operator. Sometimes those two errors cancel each other out. Sometimes\
    \ they don’t.\n\n### 106\n\n### |\n\n### Appendix A: Awful Parts\n\n`undefined`\
    \ and `NaN` are not constants. They are global variables, and you can change their\
    \ values. That should not be possible, and yet it is. Don’t do it.\n\n### hasProperty\n\
    \nIn [Chapter 3,](#index_split_000.html_p36) the `hasOwnProperty` method was offered\
    \ as a filter to work around a problem with the `for` statement. Unfortunately,\
    \ `hasOwnProperty` is a method, not an operator, so in any object it could be\
    \ replaced with a different function or a value that is not a function:\n\n```javascript\n\
    var name;\nanother_stooge.hasOwnProperty = null; // trouble\nfor (name in another_stooge)\
    \ {\n  if (another_stooge.hasOwnProperty(name)) { // boom\n    document.writeln(name\
    \ + ': ' + another_stooge[name]);\n  }\n}\n```\n\n### Object\n\nJavaScript’s objects\
    \ are never truly empty because they can pick up members from the prototype chain.\
    \ Sometimes that matters. For example, suppose you are writing a program that\
    \ counts the number of occurrences of each word in a text. We can use the `toLowerCase`\
    \ method to normalize the text to lowercase, and then use the `split` method with\
    \ a regular expression to produce an array of words. We can then loop through\
    \ the words and count the number of times we see each one:\n\n```javascript\n\
    var i;\nvar word;\nvar text = \"This oracle of comfort has so pleased me, \" +\n\
    \"That when I am in heaven I shall desire \" +\n\"To see what this child does,\
    \ \" +\n\"and praise my Constructor.\";\nvar words = text.toLowerCase( ).split(/[\\\
    s,.]+/);\nvar count = {};\nfor (i = 0; i < words.length; i += 1) {\n  word = words[i];\n\
    \  if (count[word]) {\n    count[word] += 1;\n  } else {\n    count[word] = 1;\n\
    \  }\n}\n```\n\nIf we look at the results, `count['this']` is 2 and `count.heaven`\
    \ is 1, but `count.constructor` contains a crazy looking string. The reason is\
    \ that the `count` object inherits from `Object.prototype`, and `Object.prototype`\
    \ contains a member named **Object**\n\n### |\n\n### 107\n\nconstructor whose\
    \ value is `Object`. The `+=` operator, like the `+` operator, does concatenation\
    \ rather than addition when its operands are not numbers. `Object` is a function,\
    \ so `+=` converts it to a string somehow and concatenates a 1 to its butt.\n"
