    from Perl. The rules for writing regular expressions can be surprisingly complex
    because they interpret characters in some positions as operators, and in slightly
    different positions as literals. Worse than being hard to write, this makes regular
    expressions hard to read and dangerous to modify. It is necessary to have a fairly
    complete understanding of the full complexity of regular expressions to correctly
    read them.


