    -]?\\d+)?`\n\n这是另一个可选的非捕获组。它匹配 `e`（或 `E`）、一个可选的符号以及一个或多个数字。\n\n## 构建\n\n创建 `RegExp`\
    \ 对象有两种方法。正如我们在示例中所看到的，首选的方法是使用正则表达式字面量。\n\n`regexp literal`\n\n`regexp choice`\n\
    \n`/`\n\n`/`\n\n`g`\n\n`i`\n\n`m`\n\n**70**\n\n**|**\n\n## 第 7 章：正则表达式\n\n正则表达式字面量被包含在斜杠之间。这可能有点棘手，因为斜杠也被用作除法运算符和注释符号。\n\
    \n`RegExp` 上可以设置三个标志。它们由字母 `g`、`i` 和 `m` 表示，如表 7-1 所示。这些标志直接附加在 `RegExp` 字面量的末尾：\n\
    \n```javascript\n// 创建一个匹配\n// JavaScript 字符串的正则表达式对象。\nvar my_regexp = /\"(?:\\\
    \\.|[^\\\\\\\"])*\"/g;\n```\n\n*表 7-1.正则表达式的标志*\n\n| 标志 | 含义 |\n| :--- | :---\
    \ |\n| g | 全局（多次匹配；具体含义随方法而异） |\n| i | 不敏感（忽略字符大小写） |\n| m | 多行（^ 和 $ 可以匹配行结束字符）\
    \ |\n\n创建正则表达式的另一种方法是使用 `RegExp` 构造函数。构造函数接受一个字符串并编译成 `RegExp` 对象。在构建字符串时必须小心，因为反斜杠在正则表达式中的含义与字符串字面量中有所不同。通常需要双写反斜杠并转义引号：\n\
    \n```javascript\n// 创建一个匹配\n// JavaScript 字符串的正则表达式对象。\nvar my_regexp = new RegExp(\"\
    '(?:\\\\\\\\.|[^\\\\\\\\\\\\'])*'\", 'g'));\n```\n\n第二个参数是指定标志的字符串。当必须在运行时使用程序员无法获取的材料生成正则表达式时，`RegExp`\
    \ 构造函数非常有用。\n\n`RegExp` 对象包含表 7-2](#index_split_000.html_p87)列出的属性。\n\n*表 7-2.\
    \ RegExp 对象的属性*\n\n| 属性 | 用途 |\n| :--- | :--- |\n| global | 如果使用了 `g` 标志则为 true。\
    \ |\n| ignoreCase | 如果使用了 `i` 标志则为 true。 |\n| lastIndex | 下次 exec 匹配开始的索引。初始为零。\
    \ |\n| multiline | 如果使用了 `m` 标志则为 true。 |\n| source | 正则表达式的源文本。 |\n\n## 构建\n\n\
    **|**\n\n**71**\n\n由正则表达式字面量创建的 `RegExp` 对象共享同一个实例：\n\n```javascript\nfunction\
    \ make_a_matcher( ) {\n  return /a/gi;\n}\n\nvar x = make_a_matcher( );\nvar y\
    \ = make_a_matcher( );\n\n// 注意：x 和 y 是同一个对象！\nx.lastIndex = 10;\ndocument.writeln(y.lastIndex);\
    \ // 10\n```\n\n## 元素\n\n让我们更仔细地观察组成正则表达式的元素。\n\n### Regexp 选择\n\n`regexp choice`\n\
    \n`regexp sequence`\n\n`|`\n\n一个 `regexp choice` 包含一个或多个 `regexp sequences`。序列之间由\
    \ `|`（竖线）字符分隔。如果任何一个序列匹配，则该选择（choice）匹配。它会尝试按顺序匹配每个序列。因此：\n\n`\"into\".match(/in|int/)`\n\
    \n匹配 `into` 中的 `in`。它不会匹配 `int`，因为 `in` 的匹配已经成功了。\n\n### Regexp 序列\n\n`regexp\
    \ sequence`\n\n`regexp factor`\n\n`regexp quantifier`\n\n一个 `regexp sequence`\
    \ 包含一个或多个 `regexp factors`。每个因子后面可以可选地跟随一个量词，量词决定了因子允许出现的次数。如果没有量词，则该因子将被匹配一次。\n\
    \n**72**\n\n**|**\n\n## 第 7 章：正则表达式\n\n### Regexp 因子\n\n`regexp factor`\n\n除 `/`\
    \ `and` `\\` 之外的任何 Unicode 字符\n\n`[` `and` `]` `and` `(` `and` `)` `and` `{` `and`\
    \ `}` `and` `?` `and`\n\n`+` `and` `*` `and` `|` 控制字符\n\n`regexp escape`\n\n`regexp\
    \ class`\n\n`regexp group`\n\n`regexp factor` 可以是一个字符、括号分组、字符类或转义序列。除了控制字符和特殊字符外，所有字符都被视为字面量：\n\
    \n`\\ / [ ] ( ) { } ? + * | . ^ $`\n\n如果需要字面量匹配这些字符，必须使用 ` ` 前缀对其进行转义。如果不确定，可以给任何特殊字符加上\
    \ `\\` 前缀以使其变为字面量。`\\` 前缀不会让字母或数字变为字面量。\n\n未转义的 `.` 匹配除行结束符外的任何字符。\n\n未转义的 `^`\
    \ 在 `lastIndex` 属性为零时匹配文本的开头。当指定 `m` 标志时，它也可以匹配行结束字符。\n\n未转义的 `$` 匹配文本的结尾。当指定\
    \ `m` 标志时，它也可以匹配行结束字符。\n\n### Regexp 转义\n\n反斜杠字符在 regexp 因子和字符串中都表示转义，但在 regexp\
    \ 因子中的工作方式不同。与字符串一样，`\\f` 是分页符，`\\n` 是换行符，`\\r` 是回车符，`\\t` 是制表符，而 `\\u` 允许 16\
    \ 位 Unicode。\n\n`\\d` 等于 `[0-9]`。它匹配一个数字。`\\D` 是相反的：`[⁰-9]`。\n\n`\\s` 等于 `[\\\
    f\\n\\r\\t]`。`\\S` 是相反的：`^\\f\\n\\r\\t]`。\n\n`\\w` 等于 `[0-9A-z_]`。`\\W` 是相反的：`[⁰-9A-z_]`。\n\
    \n`\\b` 是单词边界边界。`\\B` 是非单词边界。\n\n`\\\\` 是反斜杠。`\\0` 是十六进制数字。\n"
- fmt: "\nA noncapturing group has a `(?:` prefix. A noncapturing group simply matches;\
    \ it does not capture the matched text. This has the advantage of slight faster\
    \ performance. Noncapturing groups do not interfere with the numbering of capturing\
    \ groups.\n\n### Positive lookahead\n\nA positive lookahead group has a `(?=`\
    \ prefix. It is like a noncapturing group except that after the group matches,\
    \ the text is rewound to where the group started, effectively matching nothing.\
    \ This is not a good part.\n\n### Negative lookahead\n\nA negative lookahead group\
    \ has a `(?!` prefix. It is like a positive lookahead group, except that it matches\
    \ only if it fails to match. This is not a good part.\n\n### Regexp Class\n\n\
    ***regexp class***\n\n```\n[\n^\n***any Unicode character except*** / ***and***\
    \ \\\n]\n```\n\n***and*** [ ***and*** ] ***and*** ^ ***and*** - ***and*** ***control\
    \ character*** - ***regexp class escape***\n\n### Regexp class escape\n\n***regexp\
    \ class escape***\n\nA `regexp class` is a convenient way of specifying one of\
    \ a set of characters. For example, if we wanted to match a vowel, we could write\
    \ `(?:a|e|i|o|u)`, but it is more conveniently written as the class `[aeiou]`.\n\
    \nClasses provide two other conveniences. The first is that ranges of characters\
    \ can be specified. So, the set of 32 ASCII special characters:\n\n`! \" # $ %\
    \ & ' ( ) * + , - . / : ; < = > ? @ [ \\ ] ^ _ ` { | } ~`\n\ncould be written\
    \ as:\n\n`(?:!|\"|#|\\$|%|&|'|\\(|\\)|\\*|\\+|,|-|\\.|\\/|:|;|<|=|>|@|\\[|\\\\\
    |]|\\^|_|` |\\{|\\||\\}|~)` **Elements** **|** **75**\n\nbut is slightly more\
    \ nicely written as:\n\n`[!-\\/:-@\\[-`{-~]`\n\nwhich includes the characters\
    \ from `!` through `/` and `:` through `@` and `[` through ` ` and `{` through\
    \ `~`. It is still pretty nasty looking.\n\nThe other convenience is the complementing\
    \ of a class. If the first character after the `[` is `^`, then the class excludes\
    \ the specified characters.\n\nSo `[^!-\\/:-@\\[-`{-~]` matches any character\
    \ that is *not* one of the ASCII special characters.\n\n### Regexp Class Escape\n\
    \n***regexp class escape***\n\n***backspace***\n`\\b`\n\n***not***\n\n***formfeed***\n\
    `\\f`\n\n***newline***\n`\\n`\n\n***digit***\n`\\D` `\\d`\n\n***carriage*** ***whitespace***\
    \ `\\r`\n\n***return*** `\\S` `\\s`\n\n***tab*** `\\t` ***word character*** `\\\
    W` `\\w`\n\n***literal*** `\\u` `***4*** ***hexadecimal*** ***any special character***\
    \ ***digits***\n\nThe rules of escapement within a character class are slightly\
    \ different than those for a regexp factor. `[\\b]` is the backspace character.\
    \ Here are the special characters that should be escaped in a character class:\n\
    \n- `/ [ \\ ] ^`\n\n### Regexp Quantifier\n\nA `regexp factor` may have a `regexp\
    \ quantifier` suffix that determines how many times the factor should match. A\
    \ number wrapped in curly braces means that the factor should match that many\
    \ times. So, `/www/` matches the same as `/w{3}/`. `{3,6}` will match 3, 4, 5,\
    \ or 6 times. `{3,}` will match 3 or more times.\n\n**76** **|** **Chapter 7:\
    \ Regular Expressions**\n\n***regexp quantifier***\n\n`?` `?` `*` `+` `{` `***integer***\
    \ `,` `***integer*** `}`\n\n`?` is the same as `{0,1}`. `*` is the same as `{0,}`.\
    \ `+` is the same as `{1,}` Matching tends to be greedy, matching as many repetitions\
    \ as possible up to the limit, if there is one. If the quantifier has an extra\
    \ `?` suffix, then matching tends to be lazy, attempting to match as few repetitions\
    \ as possible. It is usually best to stick with the greedy matching.\n\n### Elements\n\
    **|** **77**\n\n### CHAPTER 8\n\n### Methods\n\n*Though this be madness, yet there\
    \ is method in ’t.*\n—William Shakespeare, *The Tragedy of Hamlet, Prince of Denmark*\
    \ JavaScript includes a small set of standard methods that are available on the\
    \ standard types.\n\n#### Array\n\n`array.concat(item...)`\n\nThe `concat` method\
    \ produces a new array containing a shallow copy of this `array` with the `item`s\
    \ appended to it. If an `item` is an array, then each of its elements is appended\
    \ individually. Also see `array.push(item...)` later in this chapter.\n\n```javascript\n\
    var a = ['a', 'b', 'c'];\nvar b = ['x', 'y', 'z'];\nvar c = a.concat(b, true);\n\
    // c is ['a', 'b', 'c', 'x', 'y', 'z', true]\n```\n\n`array.join(separator*)`\
    \ The `join` method makes a string from an `array`. It does this by making a string\
    \ of each of the `array`’s elements, and then concatenating them all together\
    \ with a `separator` between them. The default `separator` is `','`. To join without\
    \ separation, use an empty string as the `separator`.\n\nIf you are assembling\
    \ a string from a large number of pieces, it is usually faster to put the pieces\
    \ into an array and join them than it is to concatenate the pieces with the `+`\
    \ operator:\n\n```javascript\nvar a = ['a', 'b', 'c'];\na.push('d');\nvar c =\
    \ a.join(''); // c is 'abcd'\n```\n\n**78**\n\n`array.pop()`\n\nThe `pop` and\
    \ `push` methods make an `array` work like a stack. The `pop` method removes and\
    \ returns the last element of `array`. If the `array` is empty, it returns `undefined`.\n\
    \n```javascript\nvar a = ['a', 'b', 'c'];\nvar c = a.pop(); // c is 'c' \n```\n\
    \n`array.push(item...)`\n\nThe `push` method appends `items` to the end of an\
    \ `array`. Unlike the `concat` method, it modifies the `array` and returns the\
    \ new length.\n\n```javascript\nvar a = ['x', 'y', 'z'];\nvar c = a.push(true);\
    \ // c is 5\n```\n\n`array.reverse()`\n\nThe `reverse` method modifies the `array`\
    \ by reversing the order of elements.\n\n```javascript\nvar a = ['c', 'b'];\n\
    var b = a.reverse(); // b is ['b', 'a']\n```\n\n`array.shift()`\n\nThe `shift`\
    \ method removes the first element from an `array` and returns it. If the `array`\
    \ is empty, it returns `undefined`.\n\n```javascript\nvar a = ['a', 'b', 'c'];\n\
    var c = a.shift(); // c is 'a', a is ['b', 'c']\n```\n\n#### Array\n**|** **79**\n\
    \n`array.slice(start*, end*)` The `slice` method makes a shallow copy of a portion\
    \ of an `array`. The first element copied will be `array[start]`. It stops before\
    \ `array[end]`. The `end` parameter is optional, and the default is `array.length`.\
    \ If either parameter is negative, `array.length` will be added to them to make\
    \ them nonnegative. If `start` is greater than or equal to `length`, the result\
    \ will be a empty array. Do not confuse `slice` with `splice`.\n\n```javascript\n\
    var a = ['a', 'b', 'c'];\nvar b = a.slice(0, 1); // b is ['a']\nvar c = a.slice(1);\
    \ // c is ['b', 'c']\nvar d = a.slice(1, 2); // d is ['b']\n```\n\n`array.sort(comparefn*)`\
    \ The `sort` method sorts the contents of an `array` in place. It sorts arrays\
    \ of numbers incorrectly:\n\n```javascript\nvar n = [4, 8, 15, 16, 23, 42];\n\
    n.sort();\n// n is [15, 16, 23, 4, 42, 8]\n```\n\nJavaScript’s default comparison\
    \ function assumes that the elements to be sorted are strings. It isn’t clever\
    \ enough to test the type of the elements before comparing them, so it converts\
    \ the numbers to strings as it compares them, ensuring a shockingly incorrect\
    \ result. Fortunately, you may replace the comparison function with your own.\
    \ Your comparison function should take two parameters and return 0 if the two\
    \ parameters are equal, a negative number if the first parameter should come first,\
    \ and a positive number if the second parameter should come first.\n\n```javascript\n\
    n.sort(function (a, b) {\n  return a - b;\n});\n// n is [4, 8, 15, 16, 23, 42];\n\
    ```\n\nThat function will sort numbers, but it doesn’t sort strings. If we want\
    \ to be able to sort any array of simple values, we must work harder:\n\n```javascript\n\
    var m = ['aa', 'bb', 'a', 4, 8, 15, 16, 23, 42];\nm.sort(function (a, b) {\n \
    \ if (a === b) {\n    return 0;\n  }\n  if (typeof a === typeof b) {\n[/"
