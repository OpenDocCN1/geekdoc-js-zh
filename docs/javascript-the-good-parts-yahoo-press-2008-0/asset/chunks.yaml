- fmt: "\nAn option specification starts with `/*jslint`. Notice that there is no\
    \ space before the `j`. The specification contains a sequence of name/value pairs,\
    \ where the names are `JSLint` options and the values are `true` or `false`. An\
    \ option specification takes precedence over the option object. All of the options\
    \ default to `false`. [Table C-1](#index_split_001.html_p133) lists the options\
    \ available in using JSLint.\n\n### Table C-1. JSLint options\n\n| Option | Meaning\
    \ |\n| :--- | :--- |\n| adsafe | true if `ADsafe.org` rules should be enforced\
    \ |\n| bitwise | true if bitwise operators should not be allowed |\n| browser\
    \ | true if the standard browser globals should be predefined cap |\n| cap | true\
    \ if uppercase HTML should be allowed |\n| debug | true if `debugger` statements\
    \ should be allowed |\n| eqeqeq | true if `===` should be required |\n| evil |\
    \ true if `eval` should be allowed |\n| forin | true if unfiltered `for in` statements\
    \ should be allowed fragment |\n| fragment | true if HTML fragments should be\
    \ allowed |\n| laxbreak | true if statement breaks should not be checked |\n|\
    \ nomen | true if names should be checked |\n| on | true if HTML event handlers\
    \ should be allowed |\n| passfail | true if the scan should stop on first error\
    \ |\n| plusplus | true if `++` and `--` should not be allowed |\n| rhino | true\
    \ if the `Rhino` environment globals should be predefined undef |\n| undef | true\
    \ if `undefined` global variables are errors |\n| white | true if strict whitespace\
    \ rules apply |\n| widget | true if the `Yahoo! Widgets` globals should be predefined\
    \ |\n\n```\n/*JSLint comment\nname: JSLint true\n*/\noption: string: false,\n\
    option: /*global\n/*jslint\n/*members\n```\n\n### Semicolon\n\nJavaScript uses\
    \ a C-like syntax, which requires the use of semicolons to delimit statements.\
    \ JavaScript attempts to make semicolons optional with a semicolon insertion mechanism.\
    \ This is dangerous.\n\nLike C, JavaScript has `++`, `--` and `&` operators, which\
    \ can be prefixes or suffixes. The disambiguation is done by the semicolon.\n\n\
    In JavaScript, a linefeed can be whitespace, or it can act as a semicolon. This\
    \ replaces one ambiguity with another.\n\nJSLint expects that every statement\
    \ be followed by `;` except for `for`, `function`, `if`, `switch`, `try`, and\
    \ `while`. JSLint does not expect to see unnecessary semicolons or the empty statement.\n\
    \n#### Line Breaking\n\nAs a further defense against the masking of errors by\
    \ the semicolon insertion mechanism, JSLint expects long statements to be broken\
    \ only after one of these punctuation characters or operators:\n\n`, ; : { } (\
    \ [ = < > ? ! + - * / % ~ ^ | &`\n`== != <= >= += -= *= /= %= ^= |= &= << >> ||\
    \ &&`\n`=== !== <<= >>= >>> >>>=`\n\nJSLint does not expect to see a long statement\
    \ broken after an identifier, a string, a number, a closer, or a suffix operator:\n\
    \n`) ] . ++ --`\n\n---\n\n### Appendix C: JSLint\n\nJSLint allows you to turn\
    \ on the “Tolerate sloppy line breaking” (`laxbreak`) option. Semicolon insertion\
    \ can mask copy/paste errors. If you always break lines after operators, then\
    \ JSLint can do a better job of finding those errors.\n\n#### Comma\n\nThe comma\
    \ operator can lead to excessively tricky expressions. It can also mask some programming\
    \ errors.\n\nJSLint expects to see the comma used as a separator, but not as an\
    \ operator (except in the initialization and incrementation parts of the `for`\
    \ statement). It does not expect to see elided elements in array literals. Extra\
    \ commas should not be used. A comma should not appear after the last element\
    \ of an array literal or object literal because it can be misinterpreted by some\
    \ browsers.\n\n#### Required Blocks\n\nJSLint expects that if `for` statements\
    \ will be made with blocks—that is, with statements enclosed in braces (`{}`).\n\
    \nJavaScript allows an `if` to be written like this:\n\n```javascript\nif (condition)\n\
    statement;\n```\n\nThat form is known to contribute to mistakes in projects where\
    \ many programmers are working on the same code. That is why JSLint expects the\
    \ use of a block:\n\n```javascript\nif (condition) {\n  statements;\n}\n```\n\n\
    Experience shows that this form is more resilient.\n\n#### Forbidden Blocks\n\n\
    In many languages, a block introduces a scope. Variables introduced in a block\
    \ are not visible outside of the block.\n\nIn JavaScript, blocks do not introduce\
    \ a scope. There is only function-scope. A variable introduced anywhere in a function\
    \ is visible everywhere in the function. JavaScript’s blocks confuse experienced\
    \ programmers and lead to errors because the familiar syntax makes a false promise.\n\
    \nJSLint expects blocks with `function`, `if`, `switch`, `while`, `for`, `do`,\
    \ and `try` statements and nowhere else. An exception is made for an unblocked\
    \ `if` statement on an `else` or `for in`.\n\n#### Expression Statements\n\nAn\
    \ expression statement is expected to be an assignment, a function/method call,\
    \ or `delete`. All other expression statements are considered errors.\n\n####\
    \ for in Statement\n\nThe `for in` statement allows for looping through the names\
    \ of all of the properties of an object. Unfortunately, it also loops through\
    \ all of the members that were inherited through the prototype chain. This has\
    \ the bad side effect of serving up method functions when the interest is in the\
    \ data members.\n\nThe body of every `for in` statement should be wrapped in an\
    \ `if` statement that does filtering. `if` can select for a particular type or\
    \ range of values, it can exclude functions, or it can exclude properties from\
    \ the prototype. For example:\n\n```javascript\nfor (name in object) {\n  if (object.hasOwnProperty(name))\
    \ {\n    ....\n  }\n}\n```\n\n#### switch Statement\n\nA common error in `switch`\
    \ statements is to forget `break` statement, resulting in unintended fall-through.\
    \ JSLint expects a `break` statement after each `case` or `default`.\n\n#### var\
    \ Statement\n\nJavaScript allows `var` definitions to occur anywhere within a\
    \ function. JSLint is stricter.\n\nJSLint expects that:\n- A `var` will be declared\
    \ only once, and that it will be declared before it is used.\n- A `function` will\
    \ be declared before it is used.\n- Parameters will not be declared as vars.\n\
    \nJSLint does not expect:\n- The arguments array to be declared as a `var`.\n\
    - That a variable will be declared in a block. This is because blocks do not have\
    \ scope. This can have unexpected consequences, so define all variables at the\
    \ top of the function.\n\n#### with Statement\n\nThe `with` statement was intended\
    \ to provide a shorthand in accessing members in deeply nested objects. Unfortunately,\
    \ it behaves very badly when setting new members. Never use the `with` statement.\
    \ Use a `var` instead.\n\nJSLint does not expect to see a `with` statement.\n\n\
    #### =\n\nJSLint does not expect to see an assignment statement in the condition\
    \ part of `if` or `while` statement. This is because it is more likely that:\n\
    \n```javascript\nif (a = b) {\n  ...\n}\n```\n\nwas intended to be:\n\n```javascript\n\
    if (a == b) {\n  ...\n}\n```\n\nIf you really intend an assignment, wrap it in\
    \ another set of parentheses:\n\n```javascript\nif ((a = b)) {\n  ...\n}\n```\n\
    \n#### == and !=\n\nThe `==` and `!=` operators do type coercion before comparing.\
    \ This is bad because it causes `' \\f\\r\\n\\t ' == 0` to be true. This can mask\
    \ type errors.\n\nWhen comparing to any of the following values, always use the\
    \ `===` or `!==` operators, which do not do type coercion: `0`, `''`, `undefined`,\
    \ `null`, `false`, `true`.\n\nIf you want the type coercion, then use the short\
    \ form. Instead of: `(foo != 0)`\n\njust say: `(foo)`\n\nAnd instead of: `(foo\
    \ == 0)`\n\nsay: `(!foo)`\n\nUse of the `===` and `!==` operators is always preferred.\
    \ There is a “Disallow == and !=” (`eqeqeq`) option, which requires the use of\
    \ `===` and `!==` in all cases.\n"
