    };\n\nvar myMatrix = Array.identity(4);\n```\n\n## CHAPTER 7\n\n### Regular Expressions\n\
    \n*Whereas the contrary bringeth bliss,*\n*And is a pattern of celestial peace.*\n\
    *Whom should we match with Henry, being a king...*\n—William Shakespeare, *The\
