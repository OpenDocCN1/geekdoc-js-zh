    **Appendix C: JSLint**


    JSLint allows you to turn on the “Tolerate sloppy line breaking” (laxbreak) option.


    Semicolon insertion can mask copy/paste errors. If youalways break lines after
    operators, then JSLint can do a better job of finding those errors.


    **Comma**


    The comma operator can lead to excessively tricky expressions. It can also mask
    some programming errors.


    JSLint expects to see the comma used as a separator, but not as an operator (except
    in the initialization and incrementation parts of the for statement). It does
    not expect to see elided elements in array literals. Extra commas should not be
    used. A comma should not appear after the last element of an array literal or
    object literal because it can be misinterpreted by some browsers.


    **Required Blocks**


    JSLint expects that if and for statements will be made with blocks—that is, with
    statements enclosed in braces ({}).


    JavaScript allows an if to be written like this:


    if (condition)


    statement;


    That form is known to contribute to mistakes in projects where many programmers
    are working on the same code. That is why JSLint expects the use of a block: if
    (condition) {


    statements;


    }


    Experience shows that this form is more resilient.


    **Forbidden Blocks**


    In many languages, a block introduces a scope. Variables introduced in a block
    are not visible outside of the block.


    In JavaScript, blocks do not introduce a scope. There is only function-scope.
    A variable introduced anywhere in a function is visible everywhere in the function.
    JavaScript’s blocks confuse experienced programmers and lead to errors because
    the familiar syntax makes a false promise.


    JSLint expects blocks with function, if, switch, while, for, do, and try statements
    and nowhere else. An exception is made for an unblocked if statement on an else
    or for in.


    **Forbidden Blocks**


    **|**


    **119**


    **Expression Statements**


    An expression statement is expected to be an assignment, a function/method call,
    or delete. All other expression statements are considered errors.


    **for in Statement**


    The for in statement allows for looping through the names of all of the properties
    of an object. Unfortunately, it also loops through all of the members that were
    inherited through the prototype chain. This has the bad side effect of serving
    up method functions when the interest is in the data members.


    The body of every for in statement should be wrapped in an if statement that does
    filtering. if can select for a particular type or range of values, it can exclude
    functions, or it can exclude properties from the prototype. For example: for (name
    in object) {


    if (object.hasOwnProperty(name)) {


    ....


    }


    }


    **switch Statement**


    A common error in switch statements is to forget to place a break statement after
    each case, resulting in unintended fall-through. JSLint expects that the statement
    before the next case or default is one of these: break, return, or throw.


    **var Statement**


    JavaScript allows var definitions to occur anywhere within a function. JSLint
    is stricter.


    JSLint expects that:


    • A var will be declared only once, and that it will be declared before it is
    used.


    • A function will be declared before it is used.


    • Parameters will not also be declared as vars.


    JSLint does not expect:


    • The arguments array to be declared as a var.


    • That a variable will be declared in a block. This is because JavaScript blocks
    do not have block scope. This can have unexpected consequences, so define all
    variables at the top of the function body.


    **120**


    **|**


    **Appendix C: JSLint**


    **with Statement**


    The with statement was intended to provide a shorthand in accessing members in
    deeply nested objects. Unfortunately, it behaves very badly when setting new members.
    Never use the with statement. Use a var instead.


    JSLint does not expect to see a with statement.


    **=**


    JSLint does not expect to see an assignment statement in the condition part of
    an if or while statement. This is because it is more likely that: if (a = b) {


    ...


    }


    was intended to be:


    if (a == b) {


    ...


    }


    If you really intend an assignment, wrap it in another set of parentheses: if
    ((a = b)) {


    ...


    }


    **== and !=**


    The == and != operators do type coercion before comparing. This is bad because
    it causes '' \f\r \n\t '' == 0 to be true. This can mask type errors.


    When comparing to any of the following values, always use the === or !== operators,
    which do not do type coercion:


    0 '''' undefined null false true


    If you want the type coercion, then use the short form. Instead of: (foo != 0)


    just say:


    (foo)


    And instead of:


    (foo == 0)


    say:


    (!foo)


    **== and !=**


    **|**


    **121**


    Use of the === and !== operators is always preferred. There is a “Disallow ==
    and !=”


    (eqeqeq) option, which requires the use of === and !== in all cases.


    **Labels**


    JavaScript allows any statement to have a label, and labels have a separate namespace.


    JSLint is stricter.


    JSLint expects labels only on statements that interact with break: switch, while,
    do, and for. JSLint expects that labels will be distinct from variables and parameters.


    **Unreachable Code**


    JSLint expects that a return, break, continue, or throw statement will be followed
    by a } or case or default.


