    \ 8 章中描述。\n\n## 数组字面量\n\n数组字面量为创建新的数组值提供了非常方便的表示法。数组字面量是一对方括号，包裹零或多个用逗号分隔的值。数组字面量可以出现在任何表达式的地方。第一个值将获得属性名\
    \ `'0'`，第二个值将获得属性名 `'1'`，依此类推：\n\n```javascript\nvar empty = [];\nvar numbers\
    \ = [\n  'zero', 'one', 'two', 'three', 'four',\n  'five', 'six', 'seven', 'eight',\
    \ 'nine'\n];\nempty[1] // undefined\nnumbers[1] // 'one'\nempty.length // 0\n\
    numbers.length // 10\n```\n\n对象字面量：\n\n```javascript\nvar numbers_object = {\n\
    \  '0': 'zero', '1': 'one', '2': 'two',\n  '3': 'three', '4': 'four', '5': 'five',\n\
    \  '6': 'six', '7': 'seven', '8': 'eight',\n  '9': 'nine'\n};\n```\n\n产生了相似的结果。`numbers`\
    \ 和 `numbers_object` 都是包含 10 个属性的对象，这些属性具有完全相同的名称和值。但也存在显著差异。`numbers` 继承自 `Array.prototype`，而\
    \ `numbers_object` 继承自 `Object.prototype`，因此 `numbers` 继承了更多有用的方法。此外，`numbers`\
    \ 获得了神秘的 `length` 属性，而 `numbers_object` 没有。\n\n在大多数语言中，数组的元素被要求是相同类型的。JavaScript\
    \ 允许数组包含任何混合值：\n\n```javascript\nvar misc = [\n  'string', 98.6, true, false,\
    \ null, undefined,\n  ['nested', 'array'], {object: true}, NaN,\n  Infinity\n\
    ];\nmisc.length // 10\n```\n\n## 长度\n\n每个数组都有一个 `length` 属性。与大多数语言不同，JavaScript\
    \ 的数组长度不是上界。如果你存储一个下标大于或等于当前长度的元素，长度将增加以包含该新元素。没有数组越界错误。\n\n`length` 属性是数组中最大的整数属性名加一。这并不一定是数组中属性的数量：\n\
    \n```javascript\nvar myArray = [];\nmyArray.length // 0\nmyArray[1000000] = true;\n\
    myArray.length // 1000001\n// myArray 包含一个属性。\n```\n\n`length` 属性可以显式设置。将长度增大不会分配更多空间。将长度减小会导致所有下标大于或等于新长度的属性被删除：\n\
    \n```javascript\nnumbers.length = 3;\n// numbers 是 ['zero', 'one', 'two']\n```\n\
    \n可以通过给当前长度赋值在数组末尾添加新元素：\n\n```javascript\nnumbers[numbers.length] = 'shi';\n\
    // numbers 是 ['zero', 'one', 'two', 'shi']\n```\n\n有时使用 `push` 方法完成相同的事情会更方便：\n\
    \n```javascript\nnumbers.push('go');\n// numbers 是 ['zero', 'one', 'two', 'shi',\
    \ 'go']\n```\n\n## 删除\n\n由于 JavaScript 的数组是对象，可以使用 `delete` 运算符从数组中删除元素：\n\n```javascript\n\
    delete numbers[2];\n// numbers 是 ['zero', 'one', undefined, 'shi', 'go']\n```\n\
    \n遗憾的是，这会在数组中留下一个洞。这是因为被删除元素右侧的元素保留了原始名称。你通常希望将右侧每个元素的名称都减一。\n\n幸运的是，JavaScript\
    \ 数组有一个 `splice` 方法。它可以对数组进行手术，删除数量数量元素并用其他元素替换它们。第一个参数是数组中的序数。第二个参数是要删除的元素数量。任何额外的参数都将插入数组的该位置：\n\
    \n```javascript\nnumbers.splice(2, 1);\n// numbers 是 ['zero', 'one', 'shi', 'go']\n\
    ```\n\n值为 'shi' 的属性的键从 '3' 变为 '2'。因为删除属性之后的每个属性都必须移除并用新键重新插入，对于大数组，这可能并不很快。\n\n\
    ## 枚举\n\n由于 JavaScript 的数组是对象，可以使用 `for in` 语句遍历数组的所有属性。遗憾的是，`for in` 不保证属性的顺序，而大多数数组应用期望元素按数值顺序产生。此外，仍然存在从原型链中挖掘出意外属性的问题。\n\
    \n幸运的是，传统的 `for` 语句避免了这些问题。JavaScript 的 `for` 语句与大多数 C 类语言中的类似。它由三个子句控制——第一个初始化循环，第二个是\
    \ while 条件，第三个是递增：\n\n```javascript\nvar i;\nfor (i = 0; i < myArray.length; i\
    \ += 1) {\n  document.writeln(myArray[i]);\n}\n```\n\n**混淆**\n\n"
- fmt: "\nA common error in JavaScript programs is to use an object when an array\
    \ is required or an array when an object is required. The rule is simple: when\
    \ the property names are small sequential integers, you should use an array. Otherwise,\
    \ use an object.\n\nJavaScript itself is confused about the difference between\
    \ arrays and objects. The `typeof` operator reports that the type of an array\
    \ is `'object'`, which isn’t very helpful.\n\nJavaScript does not have a good\
    \ mechanism for distinguishing between arrays and objects. We can work around\
    \ that deficiency by defining our own `is_array` function: `var is_array = function\
    \ (value) {`\n\n```javascript\nvar is_array = function (value) {\n  return value\
    \ && typeof value === 'object' && value.constructor === Array;\n};\n```\n\nUnfortunately,\
    \ it fails to identify arrays that were constructed in a different window or frame.\
    \ If we want to accurately detect those foreign arrays, we have to work a little\
    \ harder:\n\n```javascript\nvar is_array = function (value) {\n  return Object.prototype.toString.apply(value)\
    \ === '[object Array]';\n};\n```\n\n## Methods\n\nJavaScript provides a set of\
    \ methods for acting on arrays. The methods are functions stored in `Array.prototype`.\
    \ In [Chapter 3,](#index_split_000.html_p36) we saw that `Object.prototype` can\
    \ be augmented. `Array.prototype` can be augmented as well.\n\nFor example, suppose\
    \ we want to add an array method that will allow us to do computation on an array:\n\
    \n```javascript\nArray.method('reduce', function (f, value) {\n  var i;\n  for\
    \ (i = 0; i < this.length; i += 1) {\n    value = f(this[i], value);\n  }\n  return\
    \ value;\n});\n```\n\nBy adding a function to `Array.prototype`, every array inherits\
    \ the method. In this case, we defined a `reduce` method that takes a function\
    \ and a starting value. For each element of the array, it calls the function with\
    \ an element and the value, and computes a new value. When it is finished, it\
    \ returns the value. If we pass in a function that adds two numbers, it computes\
    \ the sum. If we pass in a function that multiplies two numbers, it computes the\
    \ product:\n\n```javascript\n// Create an array of numbers.\nvar data = [4, 8,\
    \ 15, 16, 23, 42];\n\n// Define two simple functions. One will add two\n// numbers.\
    \ The other will multiply two numbers.\nvar add = function (a, b) {\n  return\
    \ a + b;\n};\nvar mult = function (a, b) {\n  return a * b;\n};\n\n// Invoke the\
    \ data's reduce method, passing in the\n// add function.\nvar sum = data.reduce(add,\
    \ 0); // sum is 108\n\n// Invoke the reduce method again, this time passing\n\
    // in the multiply function.\nvar product = data.reduce(mult, 1);\n// product\
    \ is 7418880\n```\n\nBecause an array is really an object, we can add methods\
    \ directly to an individual array:\n\n```javascript\n// Give the data array a\
    \ total function.\ndata.total = function ( ) {\n  return this.reduce(add, 0);\n\
    };\ntotal = data.total( ); // total is 108\n```\n\nSince the string `'total'`\
    \ is not an integer, adding a `total` property to an array does not change its\
    \ length. Arrays are most useful when the property names are integers, but they\
    \ are still objects, and objects can accept any string as a property name.\n\n\
    It is not useful to use the `Object.create` method from [Chapter 3](#index_split_000.html_p36)\
    \ on arrays because it produces an object, not an array. The object produced will\
    \ inherit the array’s values and methods, but it will not have the special length\
    \ property.\n\n## Chapter 6: Arrays\n\n### Dimensions\n\nJavaScript arrays usually\
    \ are not initialized. If you ask for a new array with `[]`, it will be empty.\
    \ If you access a missing element, you will get the `undefined` value. If you\
    \ are aware of that, or if you will naturally set every element before you attempt\
    \ to retrieve it, then all is well. But if you are implementing algorithms that\
    \ assume that every element starts with a known value (such as `0`), then you\
    \ must prep the array yourself.\n\nJavaScript should have provided some form of\
    \ an `Array.dim` method to do this, but we can easily correct this oversight:\n\
    \n```javascript\nArray.dim = function (dimension, initial) {\n  var a = [], i;\n\
    \  for (i = 0; i < dimension; i += 1) {\n    a[i] = initial;\n  }\n  return a;\n\
    };\n\n// Make an array containing 10 zeros.\nvar myArray = Array.dim(10, 0);\n\
    ```\n\nJavaScript does not have arrays of more than one dimension, but like most\
    \ C languages, it can have arrays of arrays:\n\n```javascript\nvar matrix = [\n\
    \  [0, 1, 2],\n  [3, 4, 5],\n  [6, 7, 8]\n];\nmatrix[2][1] // 7\n```\n\nTo make\
    \ a two-dimensional array or an array of arrays, you must build the arrays yourself:\n\
    \n```javascript\nfor (i = 0; i < n; i += 1) {\n  my_array[i] = [];\n}\n// Note:\
    \ Array.dim(n, []) will not work here.\n// Each element would get a reference\
    \ to the same\n// array, which would be very bad.\n```\n\nThe cells of an empty\
    \ matrix will initially have the value `undefined`. If you want them to have a\
    \ different initial value, you must explicitly set them. Again, JavaScript should\
    \ have provided better support for matrixes. We can correct this:\n\n```javascript\n\
