  trans: "\n正则表达式的所有部分都紧紧地挤在一起，使得它们几乎无法辨认。当它们被用于安全应用程序进行扫描和验证时，这是一个特别需要关注的问题。如果你无法读取和理解一个正则表达式，又如何确信它对所有输入都能正常工作呢？\n\
    \n然而，尽管有这些明显的缺点，正则表达式仍然被广泛使用。\n\n## 示例\n\n这是一个示例。这是一个匹配 URL 的正则表达式。这本书的页面并不是无限宽的，因此我将其分成了两行。在\
    \ JavaScript 程序中，正则表达式必须在单行内。空格是有意义的：\n\n```javascript\nvar parse_url = /^(?:([A-Za-z]+):)?(\\\
    /{0,3})([0-9.\\-A-Za-z]+) (?::(\\d+))?(?:\\/([^?#]*))?(?:\\?([^#]*))?(?:#(.*))?$/;\n\
    ```\n\n`var url = “http://www.ora.com:80/goodparts?q#fragment”;` 我们来调用 `parse_url`\
    \ 的 `exec` 方法。如果它成功匹配了我们传递的字符串，它将返回一个包含从 url 中提取的片段的数组：\n\n```javascript\nvar\
    \ url = \"http://www.ora.com:80/goodparts?q#fragment\";\nvar result = parse_url.exec(url);\n\
    var names = ['url', 'scheme', 'slash', 'host', 'port', 'path', 'query', 'hash'];\n\
    var blanks = ' ';\nvar i;\nfor (i = 0; i < names.length; i += 1) {\n  document.writeln(names[i]\
    \ + ':' + blanks.substring(names[i].length), result[i]);\n}\n```\n\n这产生了以下结果：\n\
    \n```text\nurl: http://www.ora.com:80/goodparts?q#fragment\nscheme: http\nslash:\
    \ //\nhost: www.ora.com\nport: 80\npath: goodparts\nquery: q\nhash: fragment\n\
    ```\n\n## 第 7 章：正则表达式\n\n在第 2 章，中，我们使用了铁道图（railroad diagrams）来描述 JavaScript 语言。我们也可以用它们来描述由正则表达式定义的语言。这可能让我们更容易看到正则表达式在做什么。这里是\
    \ `parse_url` 的铁道图。\n\n`parse_url`\n`scheme`\n`begin string`\n`letter`\n`:`\n\
    `slash`\n`/`\n`/`\n`/`\n`host`\n`letter or digit`\n`or` `.` `or` `-`\n`port`\n\
    `:`\n`digit`\n`path`\n`any character`\n`/`\n`except` `?` `or` `#`\n`query`\n`any\
    \ character`\n`?`\n`except` `#`\n`hash`\n`#`\n`any character`\n`except line end`\n\
    `end string`\n\n66 | |\n## 第 7 章：正则表达式\n\n正则表达式不能像函数那样被拆成更小的部分，因此代表 `parse_url`\
    \ 的轨道是非常长的。\n\n让我们把 `parse_url` 分解为它的各个部分，看看它是如何工作的。\n\n`^`\n\n`^` 字符表示字符串的开始。它是一个锚点，防止\
    \ `exec` 跳过非 URL 类的的前缀。\n\n`(?:([A-Za-z]+):)?`\n\n这个因子匹配一个方案名称，但仅当它后面跟着 `:`（冒号）时。`(?:...)`\
    \ 表示一个非捕获组。后缀 `?` 表示该组是可选的。\n\n## 示例\n\n67 | |\n\n它的意思是*重复零或一次*。`(...)` 表示一个捕获组。捕获组会复制它匹配的文本并将其放入结果数组中。每个捕获组都被赋予一个数字。这第一个捕获组是\
    \ 1，因此该捕获组匹配的文本副本将出现在 `result[1]` 中。`[]` 表示一个字符类。这个字符类 `A-Za-z` 包含 26 个大写字母和 26\
    \ 个小写字母。连字符表示范围，从 `A` 到 `Z`。后缀 `+` 表示该字符类将被匹配一次或多次。该组后面紧跟着 `:` 字符，该字符将以字面形式匹配。\n\
    \n`(\\/{0,3})`\n\n下一个因子是捕获组 2。`\\/` 表示应该匹配一个 `/`（斜杠）字符。它用 `\\`（反斜杠）进行了转义，以免被误读为正则表达式字面量的结束。后缀\
    \ `{0,3}` 表示 `/` 将被匹配 0、1、2 或 3 次。\n\n`([0-9.\\-A-Za-z]+)`\n\n下一个因子是捕获组 3。它将匹配一个主机名，该主机由一个或多个数字、字母或\
    \ `.` 或 `` 组成。`-` 被转义为 `\\-`，以防止它与范围连字符混淆。\n\n`(?::(\\d+))?`\n\n下一个因子可选地匹配端口号，它是一个以\
    \ `:` 前缀的一个或多个数字的序列。`\\d` 表示数字字符。这一系列一个或多个数字将成为捕获组 4。\n\n`(?:\\/([^?#]*))?`\n\n\
    我们有另一个可选组。这个组以 `/` 开头。字符类 `[^?#]` 以 `^` 开头，表示该类包含除 `?` 和 `#` 之外的所有字符。`*` 表示该字符类被匹配零次或多次。\n\
    \n注意我这里写得很草率。除 `?` 和 `#` 之外的所有字符类包含了行结束符、控制字符以及许多实际上不应该在这里被匹配的字符。大多数情况下，这能达到我们的目的，但存在某些恶意文本溜进去的风险。草率的正则表达式是安全漏洞的常见来源。写草率的正则表达式比写严谨的正则表达式容易得多。\n\
    \n`(?:\\?([^#]*))?`\n\n接下来，我们有一个以 `?` 开头的可选组。它包含捕获组 6，包含零或多个非 `#` 的字符。\n\n`(#(.*))?`\n\
    \n我们有最后一个以 `#` 开头的可选组。`.` 将匹配除行结束符之外的任何字符。\n\n`$`\n\n68 | |\n## 第 7 章：正则表达式\n\n\
    `$` 表示字符串的结束。它确保了在 URL 结束之后没有额外的材料。\n\n这些就是正则表达式 `parse_url` 的各个因子。\n\n可以编写比 `parse_url`\
    \ 更复杂的正则表达式，但我不建议这样做。正则表达式在短且简单时效果最好。只有这样我们才能确信它们运行正常。JavaScript 处理器之间有很高的兼容性。复杂的正则表达式更容易出现移植性问题。简单是最好的策略。\n\
    \n让我们看另一个例子：匹配数字的正则表达式。数字可以带有整数部分、可选的小数部分和一个可选的指数部分。\n\n```javascript\nvar parse_number\
    \ = /^-?\\d+(?:\\.\\d*)?(?:e[+]?\\d+)?$/i;\nvar test = function (num) {\n  document.writeln(parse_number.test(num));\n\
    };\n\ntest('1'); // true\ntest('number'); // false\ntest('98.6'); // true\ntest('132.21.86100');\
    \ // false\ntest('123.45E-67'); // true\ntest('D7'); // false\n```\n\n`parse_number`\
    \ 成功识别了符合规范的字符串和不符合的字符串，但对于不符合的字符串，它没有告诉我们为什么或在哪里失败。\n\n让我们分解 `parse_number`。\n\
    \n`/^ $/i`\n\n我们再次使用 `^` 和 `$` 来固定正则表达式。这导致文本中的所有字符都与正则表达式匹配。如果我们省略锚点，正则表达式将告诉我们字符串是否包含数字。有了锚点，它告诉我们字符串是否仅包含数字。如果我们只包含\
    \ `^`，它将匹配以数字开头的字符串。如果我们只包含 `$`，它将匹配以数字结尾的字符串。\n\n当你再次把它们挤在一起时，视觉上非常困惑：\n\n```javascript\n\
    /^(?:([A-Za-z]+):)?(\\/{0,3})([0-9.\\-A-Za-z]+)(?::(\\d+))?(?:\\/([^?#]*))?(?:\\\
    ?([^#]*))?(?:#(.*))?$/\n```\n\n"
