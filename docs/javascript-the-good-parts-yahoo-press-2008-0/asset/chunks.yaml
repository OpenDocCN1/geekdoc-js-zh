    **99**


    Features have a documentation cost. Every feature adds pages to the manual, increasing
    training costs. Features that offer value to a minority of users impose a cost
    on all users. So, in designing products and programming languages, we want to
    get the core features—the good parts—right because that is where we create most
    of the value.


    We all find the good parts in the products that we use. We value simplicity, and
    when simplicity isn’t offered to us, we make it ourselves. My microwave oven has
    tons of features, but the only ones I use are cook and the clock. And setting
    the clock is a struggle. We cope with the complexity of feature-driven design
