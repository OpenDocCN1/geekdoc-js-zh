    JSLint expects that `+` will not be followed by `+` or `++`, and that `-` will
    not be followed by `-` or `--`. A misplaced space can turn `+ +` into `++`, an
    error that is difficult to see. Use parentheses to avoid confusion.


    ## ++ and --


    The `++` (increment) and `--` (decrement) operators have been known to contribute
    to bad code by encouraging excessive trickiness. They are second only to faulty
    architecture in enabling viruses and other security menaces. The JSLint option
    `plusplus` prohibits the use of these operators.


    ## Bitwise Operators


    JavaScript does not have an integer type, but it does have bitwise operators.
    The bitwise operators convert their operands from floating-point to integers and
    back, so they are not nearly as efficient as they are in C or other languages.
    They are rarely useful in browser applications. The similarity to the logical
    operators can mask some programming errors. The bitwise option prohibits the use
    of these operators.


    ## eval Is Evil


    The `eval` function and its relatives (`Function`, `setTimeout`, and `setInterval`)
    provide access to the JavaScript compiler. This is sometimes useful, but in most
    cases it indicates the presence of extremely bad coding. The `eval` function is
    the most misused feature of JavaScript.


    ## 122


    |


    ## Appendix C: JSLint


    ## void


    In most C-like languages, `void` is a type. In JavaScript, `void` is a prefix
    operator that always returns `undefined`. JSLint does not expect to see `void`
    because it is confusing and not very useful.


    ## Regular Expressions


    Regular expressions are written in a terse and cryptic notation. JSLint looks
    for problems that may cause portability problems. It also attempts to resolve
    visual ambiguities by recommending explicit escapement.


    JavaScript’s syntax for regular expression literals overloads the `/` character.
    To avoid ambiguity, JSLint expects that the character preceding a regular expression
    literal is a `(` or `=` or `:` or `,` .


    ## Constructors and new


    Constructors are functions that are designed to be used with the `new` prefix.
    The `new` prefix creates a new object based on the function’s prototype, and binds
    that object to the function’s implied `this` parameter. If you neglect to use
    the `new` prefix, no new object will be made, and this will be bound to the global
    object. This is a serious mistake.


    JSLint enforces the convention that constructor functions be given names with
    initial uppercase letters. JSLint does not expect to see a function invocation
    with an initial uppercase name unless it has the `new` prefix. JSLint does not
    expect to see the `new` prefix used with functions whose names do not start with
    initial uppercase.


    JSLint does not expect to see the wrapper forms `new Number`, `new String`, or
    `new Boolean`.


    JSLint does not expect to see `new Object` (use `{}` instead).


    JSLint does not expect to see `new Array` (use `[]` instead).


    ## Not Looked For


    JSLint does not do flow analysis to determine that variables are assigned values
    before they are used. This is because variables are given a value (`undefined`)
    that is a reasonable default for many applications.


    JSLint does not do any kind of global analysis. It does not attempt to determine
    that functions used with `new` are really constructors (except by enforcing capitalization
    conventions), or that method names are spelled correctly.


    ## Not Looked For


    |


    ## 123


    ## HTML


    JSLint is able to handle HTML text. It can inspect the JavaScript content contained
    within `<script>...</script>` tags and event handlers. It also inspects the HTML
    content, looking for problems that are known to interfere with JavaScript:


    - All tag names must be in lowercase.

    - All tags that can take a close tag (such as `</p>`) must have a close tag.

    - All tags are correctly nested.

    - The entity `&lt;` must be used for literal `<`.


    JSLint is less anal than the sycophantic conformity demanded by XHTML, but more
    strict than the popular browsers.


    JSLint also checks for the occurrence of `</` in string literals. You should always
    write `<\/` instead. The extra backslash is ignored by the JavaScript compiler,
    but not by the HTML parser. Tricks like this should not be necessary, and yet
    they are.


    There is an option that allows use of uppercase tag names. There is also an option
    that allows the use of inline HTML event handlers.


    ## JSON


    JSLint can also check that JSON data structures are well formed. If the first
    character JSLint sees is `{` or `[`, then it strictly enforces the JSON rules.
    See [Appendix E.](#index_split_001.html_p152)


    ## Report


    If JSLint is able to complete its scan, it generates a function report. It lists
    the following for each function:


    - The line number on which it starts.

    - Its name. In the case of anonymous functions, JSLint will “guess” the name.

    - The parameters.

    - Closure: the variables and parameters that are declared in the function that
    are used by its inner functions.

    - Variables: the variables declared in the function that are used only by the
    function.

    - Unused: the variables that are declared in the function that are not used. This
    may be an indication of an error.

    - Outer: variables used by this function that are declared in another function.

    - Global: global variables that are used by this function.

    - Label: statement labels that are used by this function.


    The report will also include a list of all of the member names that were used.


