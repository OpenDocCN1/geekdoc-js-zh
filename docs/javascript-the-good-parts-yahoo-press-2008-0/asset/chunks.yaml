    不合格的服务器可能无法正确进行 JSON 编码。如果它通过拼接字符串来构建 JSON 文本而不是使用标准的 JSON 编码器，那么它可能会无意中发送危险的内容。如果它作为代理，在不判断其格式是否正确的情况下直接传递
    JSON 文本，也可能再次发送危险的内容。


    通过使用 `JSON.parse` 方法代替 `eval` 可以避免这种危险（参见 [`www.JSON.org/json2.js`](http://www.JSON.org/json2.js)）。如果文本包含任何危险内容，`JSON.parse`
    将抛出异常。建议你始终使用 `JSON.parse` 代替 `eval` 以防服务器不合格。当浏览器为其他服务器提供安全数据访问时，这也是良好的做法。


    ## 安全地使用 JSON


    外部数据与 `innerHTML` 之间的交互存在另一种危险。一种常见的 Ajax 模式是服务器发送一个 HTML 文本片段，将其赋值给 HTML 元素的
    `innerHTML` 属性。这是一个非常糟糕的做法。


    如果 HTML 文本包含 `<script>` 标签或等等内容，恶意脚本将会运行。这同样可能是由于服务器不合格导致的。


    具体的危险是什么？如果恶意脚本在你的页面上运行，它就可以访问页面的所有状态和能力。它可以与你的服务器进行交互，而你的服务器无法区分恶意请求和合法请求。恶意脚本可以访问全局对象，从而访问应用程序中除闭包隐藏的变量以外的所有数据。它拥有
    `document` 对象的权限，从而访问用户看到的所有内容。它还赋予了恶意脚本与用户对话的能力。浏览器的地址栏和所有防钓鱼界面元素（chrome）都会告诉用户该对话框是值得信任的。


    `document` 对象还让恶意脚本能够访问网络，允许它加载更多恶意脚本、探测你防火墙内的站点，或将它学到的秘密发送到世界上任何服务器。


    这种危险是 JavaScript 全局对象的直接后果，而全局对象是 JavaScript 许多坏部分中最糟糕的部分。这些危险并不是由 Ajax、JSON、`XMLHttpRequest`
    或 Web 2.0（无论那是什么）引起的。这些危险从 JavaScript 引入以来一直存在于浏览器中，并将一直持续到 JavaScript 被替换或修复。请小心。


    ## JSON 解析器


    这是一个用 JavaScript 实现的 JSON 解析器：


    ```javascript

    var json_parse = function () {


    // 这是一个可以解析 JSON 文本并产生 JavaScript

    // 数据结构的函数。它是一个简单的递归下降解析器。

    // 我们在另一个函数内部定义该函数以避免创建

    // 全局变量。

    var at, // 当前字符的索引

    ch, // 当前字符

    escapee = {

    ''"'': ''"'',

    ''\\'': ''\\'',

    ''/'': ''/'',

    b: ''b'',

    f: ''\f'',

    n: ''\n'',

    r: ''\r'',

    t: ''\t''

    },


    text,

    error = function (m) {

    // 当发生错误时调用错误。

    throw {

    name: ''SyntaxError'',

    message: m,

    at: at,

    text: text

    };

    },


    next = function (c) {

    // 如果提供了 c 参数，验证它是否与当前字符匹配。

    if (c && c !== ch) {

    error("Expected ''" + c + "’ instead of ''" + ch + "''");

    }

    // 获取下一个字符。如果没有更多字符了，

    // 返回空字符串。

    ch = text.charAt(at);

    at += 1;

    return ch;

    },


    number = function () {

    // 解析数字值。

    var number,

    string = '''';

    if (ch === ''-'') {

    string = ''-'';

    next(''-'');

    }

    while (ch >= ''0'' && ch <= ''9'') {

    string += ch;

    next();

    }

    if (ch === ''.'') {

    string += ''.'';

    while (next() && ch >= ''0'' && ch <= ''9'') {

    string += ch;

    }

    }

    if (ch === ''e'' || ch === ''E'') {

    string += ch;

    next();

    if (ch === ''-'' || ch === ''+'') {

    string += ch;

    next();

    }

    while (ch >= ''0'' && ch <= ''9'') {

    string += ch;

    next();

    }

    }

    number = +string;

    if (isNaN(number)) {

    error("Bad number");

    } else {

    return number;

    }

    },


    string = function () {

    // 解析字符串值。

    var hex,

    i,

    string = '''',

    uffff;

    // 在解析字符串值时，我们必须查找 " 和 \ 字符。

    if (ch === ''"'') {

    while (next()) {

    if (ch === ''"'') {

    next();

    return string;

    } else if (ch === ''\\'') {

    next();

    if (ch === ''u'') {

    uffff = 0;

    for (i = 0; i < 4; i += 1) {

    hex = parseInt(next(), 16);

    if (!isFinite(hex)) {

    break;

    }

    uffff = uffff * 16 + hex;

    }

    string += String.fromCharCode(uffff);

    } else if (typeof escapee[ch] === ''string'') {

    string += escapee[ch];

    } else {

    break;

    }

    }

    } else {

    string += ch;

    }

    }

    error("Bad string");

    },


    white = function () {

    // 跳过空白字符。

    while (ch && ch <= '' '') {

    next();

    }

    },


    word = function () {

    // true, false 或 null。

    switch (ch) {

    case ''t'':

    return true;

    case ''f'':

    return false;

    case ''n'':

    return null;

    default:

    error("Unexpected ''" + ch + "''");

    }

    },


    array = function () {

    // 解析数组。

    var array = [];

    if (ch === ''['') {

    next();

    if (ch === '']'') {

    return array;

    }

    while (ch) {

    array.push(value());

    white();

    if (ch === '']'') {

    return array;

    }

    next();

    }

    }

    error("Bad array");

    },


    object = function () {

    // 解析对象。

    var key,

    object = {};

    if (ch === ''{'') {

    next();

    if (ch === ''}'') {

    return object;

    }

    while (ch) {

    key = string();

    white();

    object[key] = value();

    white();

    if (ch === ''}'') {

    return object;

    }

    next();

    }

    }

    error("Bad object");

    },


    value = function () {

    // 解析 JSON 值。它可以是对象、数组、字符串、数字或单词。

    white();

    switch (ch) {

    case ''{'':

    return object();

    case ''['':

    return array();

    case ''"'':

    return string();

    case ''-'':

    return number();

    default:

    return word();

    }

    };


    // 返回 json_parse 函数。它可以访问上述所有的

    // 函数和变量。

    return function (source, reviver) {

    var result;

    text = source;

    at = 0;

    ch = '' '';

    result = value();

    if (ch) {

    error("Syntax error");

    }

    // 如果存在 reviver 函数，我们遍历新结构，

    // 将每个键/值对传递给 reviver 函数进行可能的

    // 转换，从一个持有空键结果的临时对象开始。如果没有 reviver 函数，我们直接返回

    // 结果。

    return typeof reviver === ''function'' ?

    function walk(holder, key) {

    var k, v, value = holder[key];

    if (value && typeof value === ''object'') {

    for (k in value) {

    if (Object.hasOwnProperty.call(value, k)) {

    v = walk(value, k);

    if (v !== undefined) {

    value[k] = v;

    } else {

    delete value[k];

    }

    }

    }

    }

    }

    return reviver.call(holder, key, value);

    }({'''': result}, '''') : result;

    };

    }();

