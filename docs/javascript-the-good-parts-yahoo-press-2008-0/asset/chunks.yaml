    **100**


    **|**


    **Chapter 10: Beautiful Features**


    **APPENDIX A**


    **Awful Parts**


    *That will prove awful both in deed and word.*


    —William Shakespeare, *Pericles, Prince of Tyre*


    In this appendix, I present the problematic features of JavaScript that are not
    easily avoided. You must be aware of these things and be prepared to cope.


    **Global Variables**


    The worst of all of JavaScript’s bad features is its dependence on global variables.
    A *global variable* is a variable that is visible in every scope. Global variables
    can be a convenience in very small programs, but they quickly become unwieldy
    as programs get larger. Because a global variable can be changed by any part of
    the program at any time, they can significantly complicate the behavior of the
    program. Use of global variables degrades the reliability of the programs that
    use them.


    Global variables make it harder to run independent subprograms in the same program.
    If the subprograms happen to have global variables that share the same names,
    then they will interfere with each other and likely fail, usually in difficult
    to diagnose ways.


    Lots of languages have global variables. For example, Java’s public static members
    are global variables. The problem with JavaScript isn’t just that it allows them,
    it requires them. JavaScript does not have a linker. All compilation units are
    loaded into a common global object.


    There are three ways to define global variables. The first is to place a var statement
    outside of any function:


    var foo = value;


    The second is to add a property directly to the global object. The global object
    is the container of all global variables. In web browsers, the global object goes
    by the name window:


    window.foo = value;


    **101**


    The third is to use a variable without declaring it. This is called *implied global*:
    foo = value;


    This was intended as a convenience to beginners by making it unnecessary to declare
    variables before using them. Unfortunately, forgetting to declare a variable is
    a very common mistake. JavaScript’s policy of making forgotten variables global
    creates bugs that can be very difficult to find.


    **Scope**


    JavaScript’s syntax comes from C. In all other C-like languages, a block (a set
    of statements wrapped in curly braces) creates a scope. Variables declared in
    a block are not visible outside of the block. JavaScript uses the block syntax,
    but does not provide block scope: a variable declared in a block is visible everywhere
    in the function containing the block. This can be surprising to programmers with
    experience in other languages.


    In most languages, it is generally best to declare variables at the site of first
    use. That turns out to be a bad practice in JavaScript because it does not have
    block scope. It is better to declare all variables at the top of each function.


    **Semicolon Insertion**


    JavaScript has a mechanism that tries to correct faulty programs by automatically
    inserting semicolons. Do not depend on this. It can mask more serious errors.


    It sometimes inserts semicolons in places where they are not welcome. Consider
    the consequences of semicolon insertion on the return statement. If a return statement
    returns a value, that value expression must begin on the same line as the return:
    return


    {


    status: true


    };


    This appears to return an object containing a status member. Unfortunately, semicolon
    insertion turns it into a statement that returns undefined. There is no warning
    that semicolon insertion caused the misinterpretation of the program. The problem
    can be avoided if the { is placed at the end of the previous line and not at the
    beginning of the next line:


    return {


    status: true


    };


    **102**


    **|**


    **Appendix A: Awful Parts**


    **Reserved Words**


    The following words are reserved in JavaScript:


    abstract boolean break byte case catch char class const continue debugger default
    delete do double else enum export extends false final finally float for function
    goto if implements import in instanceof int interface long native new null package
    private protected public return short static super switch synchronized this throw
    throws transient true try typeof var volatile void while with Most of these words
    are not used in the language.


    They cannot be used to name variables or parameters. When reserved words are used
    as keys in object literals, they must be quoted. They cannot be used with the
    dot notation, so it is sometimes necessary to use the bracket notation instead:
    var method; // ok


    var class; // illegal


    object = {box: value}; // ok


    object = {case: value}; // illegal


    object = {''case'': value}; // ok


    object.box = value; // ok


    object.case = value; // illegal


    object[''case''] = value; // ok


    **Unicode**


    JavaScript was designed at a time when Unicode was expected to have at most 65,536


    characters. It has since grown to have a capacity of more than 1 million characters.


    JavaScript’s characters are 16 bits. That is enough to cover the original 65,536


    (which is now known as the Basic Multilingual Plane). Each of the remaining million
    characters can be represented as a pair of characters. Unicode considers the pair
    to be a single character. JavaScript thinks the pair is two distinct characters.


    **typeof**


    The typeof operator returns a string that identifies the type of its operand.
    So: typeof 98.6


    produces ''number''. Unfortunately:


    typeof null


    returns ''object'' instead of ''null''. Oops. A better test for null is simply:
    my_value === null


    **typeof**


