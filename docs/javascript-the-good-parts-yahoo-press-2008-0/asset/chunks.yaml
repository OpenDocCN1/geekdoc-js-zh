    *God give us leisure for these rites of love!*\n*Once more, adieu: be valiant,\
    \ and speed well!*\n—William Shakespeare\n\nJavaScript Object Notation (JSON)\
    \ is a lightweight data interchange format. It is based on JavaScript’s object\
    \ literal notation, one of JavaScript’s best parts. Even though it is a subset\
    \ of JavaScript, it is language independent. It can be used to exchange data between\
    \ programs written in all modern programming languages. It is a text format, so\
    \ it is readable by humans and machines. It is easy to implement and easy to use.\
    \ There is a lot of material about JSON at `http://www.JSON.org/`.\n\n## JSON\
    \ Syntax\n\nJSON has six kinds of values: objects, arrays, strings, numbers, booleans\
    \ (true and false), and the special value `null`. Whitespace (spaces, tabs, carriage\
    \ returns, and newline characters) may be inserted before or after any value.\
    \ This can make JSON texts easier for humans. JSON object is an unordered container\
    \ of name-value pairs. Whitespace may be omitted to reduce transmission costs.\
    \ JSON array is an ordered list. JSON string is wrapped in double quotes. The\
    \ `\\` character is used for escape. JSON allows `/` character to be escaped so\
    \ that JSON can be embedded in HTML `<script>` tags. JSON allows `<\\/` which\
    \ does not confuse HTML. JSON numbers are like JavaScript numbers. A leading zero\
    \ is not allowed on integers because some languages use that to indicate octal.\
    \ A number can be an integer, real, or scientific. That’s it. That is all of JSON.\n\
    \n```json\n{\n\"first\": \"Jerome\", \"middle\": \"Lester\", \"last\": \"Howard\"\
    , \"nick-name\": \"Curly\", \"born\": 1903, \"died\": 1952, \"quote\": \"nyuk-nyuk-nyuk!\"\
    },\n{{\"first\": \"Harry\", \"middle\": \"Moses\", \"last\": \"Howard\", \"nick-name\"\
    : \"Moe\", \"born\": 1897, \"died\": 1975, \"quote\": \"Why, you!\"},\n{{\"first\"\
    : \"Louis\", \"last\": \"Feinberg\", \"nick-name\": \"Larry\", \"born\": 1902,\
    \ \"died\": 1975, \"quote\": \"I'm sorry. Moe, it was an accident!\"}\n```\n\n\
    #### Using JSON Securely\n\nJSON is particularly easy to use in web applications\
    \ because JSON is JavaScript. A JSON text can be turned into a useful data structure\
    \ with the `eval` function:\n\n```javascript\nvar myData = eval('(' + myJSONText\
    \ + ')');\n```\n\n(The concatenation of the parentheses around the JSON text is\
    \ a workaround for an ambiguity in JavaScript’s grammar.)\n\nThe `eval` function\
    \ has horrendous security problems, however. Is it safe to use `eval` to parse\
    \ a JSON text? Currently, the best technique for obtaining data from a server\
    \ in a web browser is through `XMLHttpRequest`. `XMLHttpRequest` can obtain data\
    \ only from the same server that produced the HTML. evaling text from that server\
    \ is no less secure than the original HTML. But, that assumes the server is malicious.\
    \ What if the server is simply incompetent?\n"
