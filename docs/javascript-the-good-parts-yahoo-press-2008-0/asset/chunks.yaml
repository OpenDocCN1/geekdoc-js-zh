    A JSON string is wrapped in double quotes. The \ character is used for escapement.


    JSON allows the / character to be escaped so that JSON can be embedded in HTML


    <script> tags. HTML does not allow the sequence </ except to start the </script>
    tag. JSON allows <\/, which produces the same result but does not confuse HTML.


    JSON numbers are like JavaScript numbers. A leading zero is not allowed on integers
    because some languages use that to indicate the octal. That kind of radix confusion
    is not desirable in a data interchange format. A number can be an integer, real,
    or scientific.


    That’s it. That is all of JSON. JSON’s design goals were to be minimal, portable,
    tex-tual, and a subset of JavaScript. The less we need to agree on in order to
    interoperate, the more easily we can interoperate.


