    **Conventions Used in This Book**


    The following typographical conventions are used in this book: *Italic*


    Indicates new terms, URLs, filenames, and file extensions.


    Constant width


    Indicates computer coding in a broad sense. This includes commands, options, variables,
    attributes, keys, requests, functions, methods, types, classes, modules, properties,
    parameters, values, objects, events, event handlers, XML and XHTML tags, macros,
    and keywords.


    **Constant width bold**


    Indicates commands or other text that should be typed literally by the user.


