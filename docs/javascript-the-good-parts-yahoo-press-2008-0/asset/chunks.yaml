    **CHAPTER 9**


    **Style**


    *Here is a silly stately style indeed!*


    —William Shakespeare, *The First Part of Henry the Sixth* Computer programs are
    the most complex things that humans make. Programs are made up of a huge number
    of parts, expressed as functions, statements, and expressions that are arranged
    in sequences that must be virtually free of error. The runtime behavior has little
    resemblance to the program that implements it. Software is usually expected to
    be modified over the course of its productive life. The process of converting
    one correct program into a different correct program is extremely challenging.


    Good programs have a structure that anticipates—but is not overly burdened by—


    the possible modifications that will be required in the future. Good programs
    also have a clear presentation. If a program is expressed well, then we have the
    best chance of being able to understand it so that it can be successfully modified
    or repaired.


    These concerns are true for all programming languages, and are especially true
    for JavaScript. JavaScript’s loose typing and excessive error tolerance provide
    little compile-time assurance of our programs’ quality, so to compensate, we should
    code with strict discipline.


    JavaScript contains a large set of weak or problematic features that can undermine
    our attempts to write good programs. We should obviously avoid JavaScript’s worst
    features. Surprisingly, perhaps, we should also avoid the features that are often
    useful but occasionally hazardous. Such features are attractive nuisances, and
    by avoiding them, a large class of potential errors is avoided.


    The long-term value of software to an organization is in direct proportion to
    the quality of the codebase. Over its lifetime, a program will be handled by many
    pairs of hands and eyes. If a program is able to clearly communicate its structure
    and characteristics, it is less likely to break when it is modified in the never-too-distant
    future.


    **94**


    JavaScript code is often sent directly to the public. It should always be of publication
    quality. Neatness counts. By writing in a clear and consistent style, your programs
    become easier to read.


    Programmers can debate endlessly on what constitutes good style. Most programmers
    are firmly rooted in what they’re used to, such as the prevailing style where
    they went to school, or at their first job. Some have had profitable careers with
    no sense of style at all. Isn’t that proof that style doesn’t matter? And even
    if style doesn’t matter, isn’t one style as good as any other?


    It turns out that style matters in programming for the same reason that it matters
    in writing. It makes for better reading.


    Computer programs are sometimes thought of as a write-only medium, so it matters
    little how it is written as long as it works. But it turns out that the likelihood
    a program will work is significantly enhanced by our ability to read it, which
    also increases the likelihood that it actually works as intended. It is also the
    nature of software to be extensively modified over its productive life. If we
    can read and understand it, then we can hope to modify and improve it.'
