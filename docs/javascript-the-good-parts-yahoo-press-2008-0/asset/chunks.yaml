    # CHAPTER 1


    ## Good Parts


    …setting the attractions of my good parts aside I have no other charms.


    —William Shakespeare, *The Merry Wives of Windsor*


    When I was a young journeyman programmer, I would learn about every feature of
    the languages I was using, and I would attempt to use all of those features when
    I wrote. I suppose it was a way of showing off, and I suppose it worked because
    I was the guy you went to if you wanted to know how to use a particular feature.


    Eventually I figured out that some of those features were more trouble than they
    were worth. Some of them were poorly specified, and so were more likely to cause
    portability problems. Some resulted in code that was difficult to read or modify.
    Some induced me to write in a manner that was too tricky and error-prone. And
    some of those features were design errors. Sometimes language designers make mistakes.


    Most programming languages contain good parts and bad parts. I discovered that
    I could be a better programmer by using only the good parts and avoiding the bad
    parts. After all, how can you build something good out of bad parts?


    It is rarely possible for standards committees to remove imperfections from a
    language because doing so would cause the breakage of all of the bad programs
    that depend on those bad parts. They are usually powerless to do anything except
    heap more features on top of the existing pile of imperfections. And the new features
    do not always interact harmoniously, thus producing more bad parts.


    But *you* have the power to define your own subset. You can write better programs
    by relying exclusively on the good parts.


    JavaScript is a language with more than its share of bad parts. It went from nonexistence
    to global adoption in an alarmingly short period of time. It never had an interval
    in the lab when it could be tried out and polished. It went straight into Netscape
    Navigator 2 just as it was, and it was very rough. When Java™ applets failed,
    JavaScript became the “Language of the Web” by default. JavaScript’s popularity
    is almost completely independent of its qualities as a programming language.


    ### 1


    Fortunately, JavaScript has some extraordinarily good parts. In JavaScript, there
    is a beautiful, elegant, highly expressive language that is buried under a steaming
    pile of good intentions and blunders. The best nature of JavaScript is so effectively
    hidden that for many years the prevailing opinion of JavaScript was that it was
    an unsightly, incompetent toy. My intention here is to expose the goodness in
    JavaScript, an out-standing, dynamic programming language. JavaScript is a block
    of marble, and I chip away the features that are not beautiful until the language’s
    true nature reveals itself.


    I believe that the elegant subset I carved out is vastly superior to the language
    as a whole, being more reliable, readable, and maintainable.


    This book will not attempt to fully describe the language. Instead, it will focus
    on the good parts with occasional warnings to avoid the bad. The subset that will
    be described here can be used to construct reliable, readable programs small and
    large.


    By focusing on just the good parts, we can reduce learning time, increase robustness,
    and save some trees.


    Perhaps the greatest benefit of studying the good parts is that you can avoid
    the need to unlearn the bad parts. Unlearning bad patterns is very difficult.
    It is a painful task that most of us face with extreme reluctance. Sometimes languages
    are subsetted to make them work better for students. But in this case, I am subsetting
    JavaScript to make it work better for professionals.


    ## Why JavaScript?


    JavaScript is a language with more than its share of bad parts. It went from nonexistence
    to global adoption in an alarmingly short period of time. It never had an interval
    in the lab when it could be tried out and polished. It went straight into Netscape
    Navigator 2 just as it was, and it was very rough. When Java™ applets failed,
    JavaScript became the “Language of the Web” by default. JavaScript’s popularity
    is almost completely independent of its qualities as a programming language.


    ### 1


    Fortunately, JavaScript has some extraordinarily good parts. In JavaScript, there
    is a beautiful, elegant, highly expressive language that is buried under a steaming
    pile of good intentions and blunders. The best nature of JavaScript is so effectively
    hidden that for many years the prevailing opinion of JavaScript was that it was
    an unsightly, incompetent toy. My intention here is to expose the goodness in
    JavaScript, an out-standing, dynamic programming language. JavaScript is a block
    of marble, and I chip away the features that are not beautiful until the language’s
    true nature reveals itself.


    I believe that the elegant subset I carved out is vastly superior to the language
    as a whole, being more reliable, readable, and maintainable.


    ## Chapter 1: Good Parts


    ### Analyzing JavaScript


    JavaScript is built on very good ideas and a few bad ones.


    The very good ideas include functions, loose typing, dynamic objects, and expressive
    literal notation. The bad ideas include a programming model based on global variables.


    The fashion in most languages today demands strong typing. The theory is that
    strong typing allows a compiler to detect a large class of errors at compile time.
    The sooner we can detect and repair errors, the less they cost us. JavaScript
    is a typed language, so JavaScript compilers are unable to detect type errors.
    This can be alarming to people who are coming to JavaScript from strongly typed
    languages. But it turns out that strong typing does not eliminate the need for
    careful testing. And I have found in my work that the sorts of errors strong checking
    finds are not the errors I worry about. On the other hand, I find loose typing
    to be liberating. I don’t need to form complex class hierarchies. And I never
    have to cast or wrestle with the type system to get the behavior that I want.


    JavaScript has a very powerful object literal notation. Objects can be created
    simply by listing their components. This notation was the inspiration for JSON,
    the popular data interchange format. (There will be more about JSON in Appendix
    E.#index_split_001.html_p152)


    A controversial feature in JavaScript is prototypal inheritance. JavaScript has
    a class-free object system in which objects inherit properties directly from other
    objects. This is really powerful, but it is unfamiliar to classically trained
    programmers. If you attempt to apply classical design patterns directly to JavaScript,
    you will be frustrated. But if you learn to work with JavaScript’ prototypal nature,
    your efforts will be rewarded.


    JavaScript is much maligned for its choice of key ideas. For the most part, though,
    those choices were good, if unusual. But there was one choice that was particularly
    bad: JavaScript depends on global variables for linkage. All of the top-level
    variables of all compilation units are tossed together in a common namespace called
    the global object. This is a bad thing because global variables are evil, and
    in JavaScript they are fundamental. Fortunately, as we will see, JavaScript also
    gives us the tools to mitigate this problem.


    In a few cases, we can’t ignore the bad parts. There are some unavoidable awful
    parts, which will be called out as they occur. They will also be summarized in

