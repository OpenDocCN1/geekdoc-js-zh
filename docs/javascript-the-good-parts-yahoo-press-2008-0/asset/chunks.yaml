    \ are reserved in JavaScript:\n\n`abstract` `boolean` `break` `byte` `case` `catch`\
    \ `char` `class` `const` `continue` `debugger` `default` `delete` `do` `double`\
    \ `else` `enum` `export` `extends` `false` `final` `finally` `float` `for` `function`\
    \ `goto` `if` `implements` `import` `in` `instanceof` `int` `interface` `long`\
