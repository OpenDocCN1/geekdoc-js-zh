  trans: "\n\n如果 `replaceValue` 是一个函数，它将在每次匹配时被调用，函数返回的字符串将用作替换文本。传递给函数的第一个参数是匹配的文本。第二个参数是捕获组\
    \ 1 的文本，下一个参数是捕获组 2 的文本，以此此类推：\n\n```javascript\nString.method('entityify', function\
    \ ( ) {\n  var character = {\n    '<' : '&lt;',\n    '>' : '&gt;',\n    '&' :\
    \ '&amp;',\n    '\"' : '&quot;'\n  };\n  // 返回 string.entityify 方法，该方法\n  // 返回调用\
    \ replace 方法的结果。\n  // 它的 replaceValue 函数返回在对象中\n  // 查找字符的结果。这种对对象的使用\n  // 通常比\
    \ switch 语句性能。\n  return function ( ) {\n    return this.replace(/[<>&\"]/g, function\
    \ (c) {\n      return character[c];\n    });\n  };\n}( ));\n\nalert(\"<&>\".entityify(\
    \ )); // &lt;&amp;&gt;\n```\n\n`string.search(regexp)` `search` 方法类似于 `indexOf`\
    \ 方法，不同在于它接受一个正则表达式对象而不是字符串。如果存在匹配，它返回第一个匹配的首字符的位置；如果搜索失败则返回 -1。`g` 标志被忽略。没有 `position`\
    \ 参数：`var text = 'and in it he says \"Any damn fool could'; var pos = text.search(/[\"\
    ']/); // pos is 18`\n\n`string.slice(start, end)` `slice` 方法通过复制另一个 `string` 的部分来创建一个新字符串。如果\
    \ `start` 参数为负数，则会对其加上 `string.length`。`end` 参数是可选的，其默认值为 `string.length`。如果 `end`\
    \ 参数为负数，则会对其加上 `string.length`。`end` 参数比最后一个字符的位置加一。要获取从位置 `p` 开始的 n 个字符，请使用 `string.slice(p,p\
    \ + n)`。另请参见本章后部分的 `string.substring` 和之前的 `array.slice`。\n\n```javascript\nvar\
    \ text = 'and in it he says \"Any damn fool could';\nvar a = text.slice(18); //\
    \ a is '\"Any damn fool could'\nvar b = text.slice(0, 3); // b is 'and'\nvar c\
    \ = text.slice(-5); // c is 'could'\nvar d = text.slice(19, 32); // d is 'Any\
    \ damn fool'\n```\n\n`string.split(separator, limit)` `split` 方法通过将此 `string`\
    \ 拆分为若干部分来创建一个字符串数组。可选的 `limit` 参数可以限制拆分的数量。`separator` 参数可以是字符串或正则表达式。\n\n如果\
    \ `separator` 是空字符串，则产生一个由单个字符组成的数组：`var digits = '0123456789'; var a = digits.split('',\
    \ 5); // a is ['0', '1', '2', '3', '4']`\n\n否则，会在 `string` 中搜索 `separator` 的所有出现处。分隔符之间的每个文本单元都会复制到数组中。`g`\
    \ 标志被忽略：`var ip = '192.168.1.0'; var b = ip.split('.'); // b is ['192', '168',\
    \ '1', '0'] var c = '|a|b|c|'.split('|'); // c is ['', 'a', 'b', 'c', '']`\n\n\
    ```javascript\nvar text = 'last, first ,middle';\nvar d = text.split(/\\s*,\\\
    s*/);\n// d is ['last', 'first', 'middle']\n```\n\n有一些特殊情况需要注意。来自捕获组的文本将包含在拆分：\n\
    \n```javascript\nvar e = text.split(/\\s*(,)\\s*/);\n// e is ['last', ',', 'first',\
    \ ',', 'middle']\n```\n\n某些实现在 `separator` 为正则表达式时，会抑制输出数组中的空字符串：\n\n```javascript\n\
    var f = '|a|b|c|'.split(/\\|/);\n// 在某些系统上 f 为 ['a', 'b', 'c']，\n// 在其他系统上 f 为\
    \ ['', 'a', 'b', 'c', '']\n```\n\n`string.substring(start, end)` `substring` 方法与\
    \ `slice` 方法相同，但不处理负参数的调整。没有理由使用 `substring` 方法。请改用 `slice`。\n\n`string.toLocaleLowerCase()`\
    \ `toLocaleLowerCase` 方法产生一个新字符串，该字符串通过使用区域规则将此 `string` 转换为小写。这主要是为了土耳语的考虑，因为在那种语言中‘I’转换为\
    \ `ı`，而不是‘i’。\n\n`string.toLocaleUpperCase()` `toLocaleUpperCase` 方法产生一个新字符串，该字符串通过使用区域规则将此\
    \ `string` 转换为大写。这主要是为了土耳语的考虑，因为在那种语言中‘i’转换为‘ '，而不是‘I’。\n\n`string.toLowerCase()`\
    \ `toLowerCase` 方法产生一个新字符串，该字符串通过将此 `string` 转换为小写。\n\n`string.toUpperCase()`\
    \ `toUpperCase` 方法产生一个新字符串，该字符串通过将此 `string` 转换为大写。\n\n`string.fromCharCode(char)`\
    \ `fromCharCode` 方法根据一组 UTF-16 代码单元创建一个字符串。\n\n```javascript\nvar a = String.fromCharCode(67,\
    \ 97, 116); // a is 'Cat'\n```\n\n"
