    JSLint 期望 `+` 后面不会跟随 `+` 或 `++`，且 `-` 后面不会跟随 `-` 或 `--`。一个错误的空格可以将 `+ +` 变成 `++`，这是一个难以发现的错误。请使用括号来避免混淆。


    ## ++ 和 --


    `++`（自增）和 `--`（自减）运算符被认为会由于过度追求技巧性而导致糟糕的代码。在引发病毒和其他安全威胁方面，它们的危害仅次于错误的架构设计。JSLint
    选项 `plusplus` 禁止使用这些运算符。


    ## 位运算符


    JavaScript 没有整数类型，但它确实有位运算符。位运算符会将操作数从浮点数转换为整数反反亦然，因此它们的效率远没有 C 或或其他语言中那么高。它们在浏览器应用程序中很少用。它们与逻辑运算符的相似性可能会掩盖某些编程错误。位运算选项禁止使用这些运算符。


    ## eval 是邪恶


    `eval` 函数及其相关函数（`Function`、`setTimeout` 和 `setInterval`）提供了访问 JavaScript 编译接口。这有时是有用的，但在大多数情况下，它意味着存在极其糟糕的代码。`eval`
    函数是 JavaScript 中被误用最多的特性。


    ## 122


    |


    ## 附录 C：JSLint


    ## void


    在大多数 C 类语言中，`void` 是一种类型。在 JavaScript 中，`void` 是一个前缀运算符，始终返回 `undefined`。JSLint
    不期望看到 `void`，因为它容易混淆且没用。


    ## 正则表达式


    正则表达式以简洁且晦涩的符号编写。JSLint 会寻找可能导致移植性问题的问题。它还尝试通过建议显式转义来解决视觉歧义。


    JavaScript 的正则表达式字面量语法重载了 `/` 字符。为了避免歧义，JSLint 期望正则表达式字面量之前的字符是 `(` 或 `=` 或 `:`
    或 `,`。


    ## 构造函数和 new


    构造函数是设计用于配合 `new` 前缀使用的函数。`new` 前缀根据函数的原型创建一个对象，并将该对象绑定到函数的隐含 `this` 参数上。如果你忽略了
    `new` 前缀，将不会创建新对象，而是将其绑定到全局对象上。这是一个严重的错误。


    JSLint 强制执行一种约定：构造函数的名称应以首字母大写开头。除非有 `new` 前缀，否则 JSLint 不期望看到首字母大写函数的函数调用。JSLint
    不期望对名称不以首字母大写头的函数使用 `new` 前缀。


    JSLint 不期望看到 `new Number`、`new String` 或 `new Boolean` 包装形式。


    JSLint 不期望看到 `new Object`（请用 `{}` 代替）。


    JSLint 不期望看到 `new Array`（请用 `[]` 代替）。


    ## 未查找


    JSLint 不进行流分析来确定变量在使用之前是否已赋值。这是因为变量会被赋予一个值（`undefined`），这对于许多应用程序来说是一个合理的默认值。


    JSLint 不进行任何形式的全局分析。它不会尝试确定用于 `new` 的函数是否真的是构造函数（通过强制大小写约定除外），或者方法名是否拼写正确。


    ## 未查找


    |


    ## 123


    ## HTML


    JSLint 能够处理 HTML 文本。它可以检查包含在 `<script>...</script>` 标签和事件处理器中的 JavaScript 内容。它还检查
    HTML 内容，寻找已知会干扰 JavaScript 的问题：


    - 所有标签名必须是小写字母。

    - 所有可以有闭合标签的标签（如 `</p>`）必须有闭合标签。

    - 所有标签都已正确嵌套。

    - 实体 `&lt;` 必须用于字面量 `<`。


    JSLint 没有像 XHTML 所要求的那种盲从从那么刻板，但比流行的浏览器更严格。


    JSLint 还会检查字符串字面量中是否出现 `</`。你应该始终写成 `<\/`。额外的反斜杠会被 JavaScript 编译器忽略，但不会被 HTML
    解析器忽略。这种技巧本不应该是必要的，但事实确实是如此。


    有一个选项允许使用大写标签名。还有一个选项允许使用内联 HTML 事件处理器。


    ## JSON


    JSLint 还可以检查 JSON 数据结构是否符合良好规范。如果 JSLint 看到的第一个字符是 `{` 或 ``，那么它将严格执行 JSON 规则。参见[附录
    E.


    ## 报告


    如果 JSLint 能够完成扫描，它会生成一个函数报告。它列出了每个函数的以下内容：


    - 它开始的行号。

    - 名字。对于匿名函数，JSLint 会“猜”名称。

    - 参数。

    - 闭包：在函数内部声明并在内部函数使用的变量和参数。

    - 变量：在函数内部声明仅在该函数使用的变量。

    - 未使用：在函数内部声明未使用的变量。这可能是错误的指示。

    - 外部：此函数使用但在另一个函数中定义的变量。

    - 全局：此函数使用的全局变量。

    - 标签：此函数使用的语句标签。


    报告还包含所有已使用的成员名称列表。


