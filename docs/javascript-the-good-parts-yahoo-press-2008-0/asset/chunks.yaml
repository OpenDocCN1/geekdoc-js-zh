    ?


    ***except*** #


    ***hash***


    #


    ***any character***


    ***except line end***


    ***end string***


    Regular expressions cannot be broken into smaller pieces the way that functions
    can, so the track representing parse_url is a long one.


    Let’s factor parse_url into its parts to see how it works.


    ^


    The ^ character indicates the beginning of the string. It is an anchor that prevents
    exec from skipping over a non-URL-like prefix.


    (?:([A-Za-z]+):)?


    This factor matches a scheme name, but only if it is followed by a : (colon).
    The (?:...) indicates a noncapturing group. The suffix ? indicates that the group
    is optional.


    **An Example**


    **|**


    **67**


    It means *repeat zero or one time*. The (...) indicates a capturing group. A capturing
    group copies the text it matches and places it in the result array. Each capturing
    group is given a number. This first capturing group is 1, so a copy of the text
    matched by this capturing group will appear in result[1]. The [...] indicates
    a character class. This character class, A-Za-z, contains 26 uppercase letters
    and 26 lowercase letters. The hyphens indicate ranges, from A to Z. The suffix
    + indicates that the character class will be matched one or more times. The group
    is followed by the : character, which will be matched literally.


    (\/{0,3})


    The next factor is capturing group 2\. \/ indicates that a / (slash) character
    should be matched. It is escaped with \ (backslash) so that it is not misinterpreted
    as the end of the regular expression literal. The suffix {0,3} indicates that
    the / will be matched 0


    or 1 or 2 or 3 times.


    ([0-9.\-A-Za-z]+)


    The next factor is capturing group 3\. It will match a host name, which is made
    up of one or more digits, letters, or . or –. The – was escaped as \- to prevent
    it from being confused with a range hyphen.


    (?::(\d+))?


    The next factor optionally matches a port number, which is a sequence of one or
    more digits preceded by a :. \d represents a digit character. The series of one
    or more digits will be capturing group 4.


    (?:\/([^?#]*))?


    We have another optional group. This one begins with a /. The character class
    [^?#]


    begins with a ^, which indicates that the class includes all characters *except
    ? and #*.


    The * indicates that the character class is matched zero or more times.


    Note that I am being sloppy here. The class of all characters *except ? and #*
    includes line-ending characters, control characters, and lots of other characters
    that really shouldn’t be matched here. Most of the time this will do what we want,
    but there is a risk that some bad text could slip through. Sloppy regular expressions
    are a popular source of security exploits. It is a lot easier to write sloppy
    regular expressions than rigorous regular expressions.


    (?:\?([^#]*))?


    Next, we have an optional group that begins with a ?. It contains capturing group
    6, which contains zero or more characters that are not #.


    (?:#(.*))?


    We have a final optional group that begins with #. The . will match any character
    except a line-ending character.


    $


    **68**


    **|**


    **Chapter 7: Regular Expressions**


    The $ represents the end of the string. It assures us that there was no extra
    material after the end of the URL.


    Those are the factors of the regular expression parse_url.*


    It is possible to make regular expressions that are more complex than parse_url,
    bu t I wouldn’t recommend it. Regular expressions are best when they are short
    and simple. Only then can we have confidence that they are working correctly and
    that they could be successfully modified if necessary.


    There is a very high degree of compatibility between JavaScript language processors.


    The part of the language that is *least* portable is the implementation of regular
    expressions. Regular expressions that are very complicated or convoluted are more
    likely to have portability problems. Nested regular expressions can also suffer
    horrible performance problems in some implementations. Simplicity is the best
    strategy.


    Let’s look at another example: a regular expression that matches numbers. Numbers
    can have an integer part with an optional minus sign, an optional fractional part,
    and an optional exponent part.


