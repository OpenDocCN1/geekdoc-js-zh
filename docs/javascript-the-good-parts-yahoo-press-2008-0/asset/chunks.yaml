    \nJavaScript Object Notation (JSON) is a lightweight data interchange format.\
    \ It is based on JavaScript’s object literal notation, one of JavaScript’s best\
    \ parts. Even though it is a subset of JavaScript, it is language independent.\
    \ It can be used to exchange data between programs written in all modern programming\
    \ languages. It is a text format, so it is readable by humans and machines. It\
    \ is easy to implement and easy to use. There is a lot of material about JSON\
    \ at `http://www.JSON.org/`.\n\n## JSON Syntax\n\nJSON has six kinds of values:\
    \ objects, arrays, strings, numbers, booleans (true and false), and the special\
    \ value `null`. Whitespace (spaces, tabs, carriage returns, and newline characters)\
    \ may be inserted before or after any value. This can make JSON texts easier for\
    \ humans. JSON object is an unordered container of name-value pairs. Whitespace\
    \ may be omitted to reduce transmission costs. JSON array is an ordered list.\
    \ JSON string is wrapped in double quotes. The `\\` character is used for escape.\
    \ JSON allows `/` character to be escaped so that JSON can be embedded in HTML\
    \ `<script>` tags. JSON allows `<\\/` which does not confuse HTML. JSON numbers\
    \ are like JavaScript numbers. A leading zero is not allowed on integers because\
    \ some languages use that to indicate octal. A number can be an integer, real,\
    \ or scientific. That’s it. That is all of JSON. JSON’s goals were to be minimal,\
    \ portable, texual. The less we need to agree on in order to interoperate, the\
    \ more easily we can.\n\n**JSON Syntax**\n**|**\n**137**\n\n`JSON string`\n`any\
    \ Unicode character except`\n`\"`\n`\"`\n`\"` `and` `\\` `and control character`\n\
    `escaped character`\n`any Unicode character except`\n`'`\n`'`\n`'` `and` `\\`\
    \ `and control character`\n`escaped character`\n`switch statement`\n`switch`\n\
