    An incompetent server might not do the JSON encoding correctly. If it builds JSON
    texts by slapping together some strings rather than using a proper JSON encoder,
    then it could unintentionally send dangerous material. If it acts as a proxy and
    simply passes JSON text through without determining whether it is well formed,
    then it could send dangerous material again.


    The danger can be avoided by using the `JSON.parse` method instead of `eval` (see
    [http://www.JSON.org/json2.js](http://www.JSON.org/json2.js)). `JSON.parse` will
    throw an exception if the text contains anything dangerous. It is recommended
    that you always use `JSON.parse` instead of `eval` to defend against server incompetence.
    It is also good practice for the day when the browser provides safe data access
    to other servers.


    ## Using JSON Securely


    There is another danger in the interaction between external data and `innerHTML`.
    A common Ajax pattern is for the server to send an HTML text fragment that gets
    assigned to the `innerHTML` property of an HTML element. This is a very bad practice.


    If the HTML text contains a `<script>` tag or its equivalent, then an evil script
    will run. This again could be due to server incompetence.


    What specifically is the danger? If an evil script gets to run on your page, it
    gets access to all of the state and capabilities of the page. It can interact
    with your server, and your server will not be able to distinguish the evil requests
    from legitimate requests. The evil script has access to the global object, which
    gives it access to all of the data in the application except for variables hidden
    in closures. It has access to the `document` object, which gives it access to
    everything that the user sees. It also gives the evil script the capability to
    dialog with the user. The browser’s location bar and all of the anti-phishing
    chrome will tell the user that the dialog should be trusted.


    The `document` object also gives the evil script access to the network, allowing
    it to load more evil scripts, or to probe for sites within your firewall, or to
    send the secrets it has learned to any server in the world.


    This danger is a direct consequence of JavaScript’s global object, which is far
    and away the worst part of JavaScript’s many bad parts. These dangers are not
    caused by Ajax or JSON or `XMLHttpRequest` or Web 2.0 (whatever that is). These
    dangers have been in the browser since the introduction of JavaScript, and will
    remain until JavaScript is replaced or repaired. Be careful.


    ## A JSON Parser


    This is an implementation of a JSON parser in JavaScript:


    ```javascript

    var json_parse = function () {


    // This is a function that can parse a JSON text, producing a JavaScript

    // data structure. It is a simple, recursive descent parser.

    // We are defining the function inside of another function to avoid creating

    // global variables.

    var at, // The index of the current character

    ch, // The current character

    escapee = {

    ''"'': ''"'',

    ''\\'': ''\\'',

    ''/'': ''/'',

    b: ''b'',

    f: ''\f'',

    n: ''\n'',

    r: ''\r'',

    t: ''\t''

    },


    text,

    error = function (m) {

    // Call error when something is wrong.

    throw {

    name: ''SyntaxError'',

    message: m,

    at: at,

    text: text

    };

    },


    next = function (c) {

    // If a c parameter is provided, verify that it matches the current character.

    if (c && c !== ch) {

    error("Expected ''" + c + "’ instead of ''" + ch + "''");

    }

    // Get the next character. When there are no more characters,

    // return the empty string.

    ch = text.charAt(at);

    at += 1;

    return ch;

    },


    number = function () {

    // Parse a number value.

    var number,

    string = '''';

    if (ch === ''-'') {

    string = ''-'';

    next(''-'');

    }

    while (ch >= ''0'' && ch <= ''9'') {

    string += ch;

    next();

    }

    if (ch === ''.'') {

    string += ''.'';

    while (next() && ch >= ''0'' && ch <= ''9'') {

    string += ch;

    }

    }

    if (ch === ''e'' || ch === ''E'') {

    string += ch;

    next();

    if (ch === ''-'' || ch === ''+'') {

    string += ch;

    next();

    }

    while (ch >= ''0'' && ch <= ''9'') {

    string += ch;

    next();

    }

    }

    number = +string;

    if (isNaN(number)) {

    error("Bad number");

    } else {

    return number;

    }

    },


    string = function () {

    // Parse a string value.

    var hex,

    i,

    string = '''',

    uffff;

    // When parsing for string values, we must look for " and \ characters.

    if (ch === ''"'') {

    while (next()) {

    if (ch === ''"'') {

    next();

    return string;

    } else if (ch === ''\\'') {

    next();

    if (ch === ''u'') {

    uffff = 0;

    for (i = 0; i < 4; i += 1) {

    hex = parseInt(next(), 16);

    if (!isFinite(hex)) {

    break;

    }

    uffff = uffff * 16 + hex;

    }

    string += String.fromCharCode(uffff);

    } else if (typeof escapee[ch] === ''string'') {

    string += escapee[ch];

    } else {

    break;

    }

    } else {

    string += ch;

    }

    }

    error("Bad string");

    },


    white = function () {

    // Skip whitespace.

    while (ch && ch <= '' '') {

    next();

    }

    },


    word = function () {

    // true, false, or null.

    switch (ch) {

    case ''t'':

    return true;

    case ''f'':

    return false;

    case ''n'':

    return null;

    default:

    error("Unexpected ''" + ch + "''");

    }

    },


    array = function () {

    // Parse an array.

    var array = [];

    if (ch === ''['') {

    next();

    if (ch === '']'') {

    return array;

    }

    while (ch) {

    array.push(value());

    white();

    if (ch === '']'') {

    return array;

    }

    next();

    }

    }

    error("Bad array");

    },


    object = function () {

    // Parse an object.

    var key,

    object = {};

    if (ch === ''{'') {

    next();

    if (ch === ''}'') {

    return object;

    }

    while (ch) {

    key = string();

    white();

    object[key] = value();

    white();

    if (ch === ''}'') {

    return object;

    }

    next();

    }

    }

    error("Bad object");

    },


    value = function () {

    // Parse a JSON value. It could be an object, an array, a string, a number, or
    a word.

    white();

    switch (ch) {

    case ''{'':

    return object();

    case ''['':

    return array();

    case ''"'':

    return string();

    case ''-'':

    return number();

    default:

    return word();

    }

    };


    // Return the json_parse function. It will have access to all of the above

    // functions and variables.

    return function (source, reviver) {

    var result;

    text = source;

    at = 0;

    ch = '' '';

    result = value();

    if (ch) {

    error("Syntax error");

    }

    // If there is a reviver function, we walk the new structure

    // passing each name/value pair to the reviver function for possible

    // transformation, starting with a temporary object that holds the result

    // in an empty key. If there is not a reviver function, we simply return the

    // result.

    return typeof reviver === ''function'' ?

    function walk(holder, key) {

    var k, v, value = holder[key];

    if (value && typeof value === ''object'') {

    for (k in value) {

    if (Object.hasOwnProperty.call(value, k)) {

    v = walk(value, k);

    if (v !== undefined) {

    value[k] = v;

    } else {

    delete value[k];

    }

    }

    }

    }

    return reviver.call(holder, key, value);

    }({'''': result}, '''') : result;

    };

    }();

