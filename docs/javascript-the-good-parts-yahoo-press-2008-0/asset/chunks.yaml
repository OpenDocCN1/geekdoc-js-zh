    \ object Love can wink.*\n—William Shakespeare, *The Two Gentlemen of Verona*\n\
    \nThe simple types of JavaScript are numbers, strings, booleans (`true` and `false`),\
    \ null, and undefined. All other values are *objects*. Numbers, strings, and booleans\
    \ are object-like in that they have methods, but they are immutable. Objects in\
