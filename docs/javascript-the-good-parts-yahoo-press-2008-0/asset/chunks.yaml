    Throughout this book I have used a consistent style. My intention was to make
    the code examples as easy to read as possible. I used whitespace consistently
    to give you more cues about the meaning of my programs.


    I indented the contents of blocks and object literals four spaces. I placed a
    space between `if` and `(` so that the `if` didn’t look like a function invocation.
    Only in invocations do I make `(` adjacent with the preceding symbol. I put spaces
    around all infix operators except for `.` and `[`, which do not get spaces because
    they have higher precedence. I use a space after every comma and colon.


    I put at most one statement on a line. Multiple statements on a line can be misread.


    If a statement doesn’t fit on a line, I will break it after a comma or a binary
    operator.


    That gives more protection against copy/paste errors that are masked by semicolon
    insertion. (The tragedy of semicolon insertion will be revealed in [Appendix A.)](#index_split_001.html_p117)
    I indent the remainder of the statement an extra four spaces, or eight spaces
    if four would be ambiguous (such as a line break in the condition part of an `if`
    statement).


    I *always* use blocks with structured statements such as `if` and `while` because
    it is less error prone. I have seen:


    ```

    if (a)

    b( );

    ```


    become:


    ```

    if (a)

    b( );

    c( );

    ```


    ### Style


    **|**


    **95**


    which is an error that is very difficult to spot. It looks like:


    ```

    if (a) {

    b( );

    c( );

    }

    ```


    but it means:


    ```

    if (a) {

    b( );

    }

    c( );

    ```


    Code that appears to mean one thing but actually means another is likely to cause
    bugs. A pair of braces is really cheap protection against bugs that can be expensive
    to find.


    I always use the K&R style, putting the `{` at the end of a line instead of the
    front, because it avoids a horrible design blunder in JavaScript’s return statement.


    I included some comments. I like to put comments in my programs to leave information
    that will be read at a later time by people (possibly myself) who will need to
    understand what I was thinking. Sometimes I think about comments as a time machine
    that I use to send important messages to future me.


    I struggle to keep comments up-to-date. Erroneous comments can make programs even
    harder to read and understand. I can’t afford that.


    I tried to not waste your time with useless comments like this: `i = 0; // Set
    i to zero.`


    In JavaScript, I prefer to use line comments. I reserve block comments for formal
    documentation and for commenting out.


    I prefer to make the structure of my programs self-illuminating, eliminating the
    need for comments. I am not always successful, so while my programs are awaiting
    perfection, I am writing comments.


    JavaScript has C syntax, but its blocks don’t have scope. So, the convention that
    variables should be declared at their first use is really bad advice in JavaScript.
    JavaScript has function scope, but not block scope, so I declare all of my variables
    at the beginning of each function. JavaScript allows variables to be declared
    after they are used.


    That feels like a mistake to me, and I don’t want to write programs that look
    like mistakes. I want my mistakes to stand out. Similarly, I never use an assignment
    expression in the condition part of an `if` because:


    ```

    if (a = b) { ... }

    ```


    is probably intended to be:


    ```

    if (a === b) { ... }

    ```


    **96**


    **|**


    **Chapter 9: Style**


    I want to avoid idioms that look like mistakes.


    I never allow `switch` cases to fall through to the next case. I once found a
    bug in my code caused by an unintended fall through immediately after having made
    a vigor-ous speech about why fall through was sometimes useful. I was fortunate
    in that I was able to learn from the experience. When reviewing the features of
    a language, I now pay special attention to features that are sometimes useful
    but occasionally dangerous. Those are the *worst parts* because it is difficult
    to tell whether they are being used correctly. That is a place where bugs hide.


    Quality was not a motivating concern in the design, implementation, or standardization
    of JavaScript. That puts a greater burden on the users of the language to resist
    the language’s weaknesses.


    JavaScript provides support for large programs, but it also provides forms and
    idioms that work against large programs. For example, JavaScript provides conveniences
    for the use of global variables, but global variables become increasingly problematic
    as programs scale in complexity.


    I use a single global variable to contain an application or library. Every object
    has its own namespace, so it is easy to use objects to organize my code. Use of
    closure provides further information hiding, increasing the strength of my modules.


    **Style**


    **|**


    **97**


    **CHAPTER 10**


    **Beautiful Features**


    *Thus, expecting thy reply, I profane my lips on thy foot, my eyes on thy picture,
    and my heart on thy every part. Thine, in the dearest design of industry...*


    —William Shakespeare, *Love’s Labor’ Lost*


    I was invited last year to contribute a chapter to Andy Oram’s and Greg Wilson’s
    *Beautiful Code* (O’Reilly), an anthology on the theme of beauty as expressed
    in computer programs. I wanted to write my chapter in JavaScript. I wanted to
    use it to present something abstract, powerful, and useful to show that the language
    was up to it. And I wanted to avoid the browser and other venues in which JavaScript
    is typecast. I wanted to show something respectable with some heft to it.


    I immediately thought of Vaughn Pratt’s Top Down Operator Precedence parser, which
    I use in JSLint (see [Appendix C.)](#index_split_001.html_p131) Parsing is an
    important topic in computing.


    The ability to write a compiler for a language in itself is still a test for the
    complete-ness of a language. I wanted to include all the code for a parser in
    JavaScript.


    But my chapter was just one of 30 or 40, so I felt constrained in the number of
    pages I could consume. A further complication was that most of my readers would
    have no experience with JavaScript, so I would also have to introduce the language
    and its peculiarities.


    So, I decided to subset the language. That way, I wouldn’t have to parse the whole
    language, and I wouldn’t have to describe the whole language. I called the subset
    Simplified JavaScript. Selecting the subset was easy: it included just the features
    that I needed to write a parser. This is how I described it in *Beautiful Code*:
    Simplified JavaScript


    The subset contained the best of the Good Parts. Even though it was a small language,
    it was very expressive and powerful. JavaScript has lots of additional features
    that really don’t add very much, and as you’ll find in the appendixes that follow,
    it has lot of features with negative value. There was nothing ugly or bad in the
    subset. All of that fell away.


    Simplified JavaScript isn’t strictly a subset. I added a few new features. The
    simplest was adding `pi` as a simple constant. I did that to demonstrate a feature
    of the parser.


    I also demonstrated a better reserved word policy and showed that reserved words
    are unnecessary. In a function, a word cannot be used as both a variable or parameter
    name and a language feature. You can use a word for one or the other, and the
    programmer gets to choose. That makes a language easier to learn because you don’t
    need to be aware of features you don’t use. And it makes the language easier to
    extend because it isn’t necessary to reserve more words to add new features.

