  trans: "\n比 `.then()` 链更易于阅读和维护。\n\n## 在 React 中处理异步 UI 更新\n\n在 React 中，UI 更新不应阻塞渲染。通常使用\
    \ `useEffect()` 钩子来处理 API 调用而不冻结 UI。\n\n#### 示例：使用 `useEffect()` 获取数据\n\n```jsx\n\
    import React, { useState, useEffect } from \"react\";\n\nfunction UserList() {\n\
    \  const [users, setUsers] = useState([]);\n  const [loading, setLoading] = useState(true);\n\
    \n  useEffect(() => {\n    fetch(\"https://jsonplaceholder.typicode.com/users\"\
    )\n      .then(response => response.json())\n      .then(data => {\n        setUsers(data);\n\
    \        setLoading(false);\n      });\n  }, []);\n\n  return loading ? <p>Loading...</p>\
    \ : <ul>{users.map(user => <li key={user.id}>{user.name}</li>)}</ul>;\n}\n```\n\
    \n- 处理 API 获取，而不阻塞渲染。\n- 在数据可用之前显示加载状态。\n\n## 优化异步 UI 更新\n\n1. **使用骨架屏 (Skeleton\
    \ Screens)**：在数据加载时显示占位符。\n2. **缓存数据**：避免不必要的 API 调用（例如 `localStorage`）。\n3. **输入请求防抖\
    \ (Debounce)**：对于实时搜索字段，防止过度的 API 请求。\n\n# 9.4 用于实时 GUI 更新的 WebSockets\n\n## WebSocket\
    \ 简介\n\nWebSockets 允许客户端与服务器之间的双向通信，实现无需轮询的实时更新。\n\n### 为什么使用 WebSockets？\n\n\
    - 立即推送更新（例如聊天应用、股票指数）。\n- 比轮询更高效（减少不必要的请求）。\n- 客户端与服务器之间的持久连接。\n\n## 在 JavaScript\
    \ 中设置 WebSockets\n\n`WebSocket` API 实现了实时数据传输。\n\n#### 示例：建立 WebSocket 连接\n\n\
    ```javascript\nconst socket = new WebSocket(\"wss://example.com/socket\");\nsocket.onopen\
    \ = () => {\n  console.log(\"WebSocket connection established\");\n};\nsocket.onmessage\
    \ = (event) => {\n  console.log(\"Received:\", event.data);\n};\nsocket.onclose\
    \ = () => {\n  console.log(\"WebSocket connection closed\");\n};\n```\n\n当新数据到达时，高效更新\
    \ UI。\n\n## 在 React 中实现 WebSockets\n\n使用 React 和 WebSockets，我们可以实时更新 UI。\n\n```jsx\n\
    import React, { useState, useEffect } from \"react\";\n\nfunction ChatApp() {\n\
    \  const [messages, setMessages] = useState([]);\n  const socket = new WebSocket(\"\
    wss://example.com/chat\");\n\n  useEffect(() => {\n    socket.onmessage = (event)\
    \ => {\n      setMessages(prevMessages => [...prevMessages, event.data]);\n  \
    \  };\n    return () => socket.close();\n  }, []);\n\n  return (\n    <ul>\n \
    \     {messages.map((msg, index) => <li key={index}>{msg}</li>)}\n    </ul>\n\
    \  );\n}\nexport default ChatApp;\n```\n\n消息在到达时立即更新。\n\n## WebSockets 的用场景\n\n\
    - 聊天应用（例如 WhatsApp Web）。\n- 实时通知（例如实时警报）。\n- 股票市场跟踪（例如实时价格更新）。\n\n# 9.5 在 React\
    \ 中实现 CRUD 操作\n\n## 理解 GUI 应用中的 CRUD\n\nCRUD（创建、读取、更新、删除）操作允许应用程序动态管理数据。\n\n|\
    \ 操作 | HTTP 方法 | 示例端点 |\n| :--- | :--- | :--- |\n| Create | `POST` | `/users`\
    \ |\n| Read | `GET` | `/users/:id` |\n| Update | `PUT` 或 `PATCH` | `/users/:id`\
    \ |\n| Delete | `DELETE` | `/users/:id` |\n\n## 在 React 中实现 CRUD\n\n使用 React Hooks\
    \ (`useState`, `useEffect`) 和 `axios`，我们可以实现 CRUD 操作。\n\n### 1. 获取数据（读取）\n\n```jsx\n\
    import React, { useState, useEffect } from \"react\";\nimport axios from \"axios\"\
    ;\n\nfunction UserList() {\n  const [users, setUsers] = useState([]);\n  useEffect(()\
    \ => {\n    axios.get(\"https://jsonplaceholder.typicode.com/users\")\n      .then(response\
    \ => setUsers(response.data));\n  }, []);\n\n  return (\n    <ul>\n      {users.map(user\
    \ => <li key={user.id}>{user.name}</li>)}\n    </ul>\n  );\n}\nexport default\
    \ UserList;\n```\n\n显示来自 API 的用户列表。\n\n### 2. 创建新用户（创建）\n\n```jsx\nfunction CreateUser()\
    \ {\n  const [name, setName] = useState(\"\");\n  const handleSubmit = (event)\
    \ => {\n    event.preventDefault();\n    axios.post(\"https://jsonplaceholder.typicode.com/users\"\
    , { name })\n      .then(response => console.log(\"User created:\", response.data));\n\
    \  };\n  return (\n    <form onSubmit={handleSubmit}>\n      <input type=\"text\"\
    \ value={name} onChange={e => setName(e.target.value)} />\n      <button type=\"\
    submit\">Add User</button>\n    </form>\n  );\n}\n```\n\n创建新用户并将数据发送到服务器。\n\n\
    ### 3. 更新用户数据（更新）\n\n```jsx\nfunction UpdateUser({ userId }) {\n  const [name,\
    \ setName] = useState(\"\");\n  const handleUpdate = () => {\n    axios.put(`https://jsonplaceholder.typicode.com/users/${userId}`,\
    \ { name })\n      .then(response => console.log(\"User updated:\", response.data));\n\
    \  };\n  return (\n    <div>\n      <input type=\"text\" value={name} onChange={e\
    \ => setName(e.target.value)} />\n      <button onClick={handleUpdate}>Update\
    \ User</button>\n    </div>\n  );\n}\n```\n\n更新服务器上的用户数据。\n\n### 4. 删除用户（删除）\n\
    \n```jsx\nfunction DeleteUser({ userId }) {\n  const handleDelete = () => {\n\
    \    axios.delete(`https://jsonplaceholder.typicode.com/users/${userId}`)\n  \
    \    .then(() => console.log(\"User deleted\"));\n  };\n  return <button onClick={handleDelete}>Delete</button>;\n\
    }\n```\n\n从数据库中删除用户。\n\n- 异步 UI 更新确保了流畅的数据获取，而不阻塞渲染。\n- WebSockets 允许应用程序中的实时更新。\n\
    - CRUD 操作允许应用程序动态地创建、读取、更新和删除数据。\n\n通过实现这些概念，开发者可以使用 React 构建高度动态、实时且具有交互性的 GUI\
    \ 应用。\n\n# 第 10 章\n\n# GUI 开发中的性能优化\n\n优化 GUI 应用的性能可以确保流畅的用户体验、更快的加载速度以及提高效率。基于\
    \ JavaScript 的 UI 中的性能瓶颈会导致界面卡顿、渲染缓慢、过度重新渲染和内存泄漏。在本章中，我们将探索识别瓶颈的技术，并使用记忆化（memoization）和懒加载（lazy\
    \ loading）优化 React 应用。\n\n## 10.1 识别 JavaScript GUI 性能瓶颈\n\n### 常见的 JavaScript\
    \ GUI 性能问题\n\n1. **不必要的重绘和重流** – 频繁的 DOM 会减慢 UI。\n2. **React 组件中过度重新渲染** – 导致\
    \ UI 卡顿和内存泄漏。\n3. **阻塞 JavaScript 执行** – 大型型同步任务会冻结 UI。\n4. **低效的 API 调用** – 未优化的网络请求会减慢数据获取。\n\
    5. **大型 JavaScript 包** – 增加了页面加载时间。\n\n### 使用浏览器开发者工具识别瓶颈\n\n大多数性能瓶颈可以使用 Chrome\
    \ DevTools、`Lighthouse` 和 `React DevTools` 检测到。\n\n#### 1. Chrome DevTools – Performance\
    \ 标签页\n\n测量 UI 性能：\n1. 打开 Chrome DevTools (`F12` 或 `Ctrl + Shift + I`)。\n2. 导航到\
    \ `Performance` 标签页。\n3. 点击 `Record`，与 UI 交互并分析缓慢的渲染操作。\n\n寻找：\n- 长时间运行的任务（主线程被阻塞）。\n\
    - 过度的布局偏移（重流）。\n- 导致 UI 卡顿的密集 JavaScript 执行。\n\n#### 2. React DevTools – 高亮不必要的渲染\n\
    \nReact DevTools 有助于识别不必要的重新渲染：\n1. 在 Chrome 中安装 React DevTools。\n2. 打开 `Profiler`\
    \ 标签页。\n3. 点击 \"Record\"，与 UI 交互并检查不必要的重新渲染的组件。\n\n优化提示：使用 `React.memo()` 防止重新渲染。\n\
    \n#### 3. Lighthouse – 测量页面速度和 JavaScript 性能\n\n`Lighthouse` 是 Chrome 内置的性能审核工具。\n\
    \n运行 Lighthouse：\n1. 打开 Chrome DevTools > 往到 `Lighthouse` 标签页。\n2. 选择 `Performance`\
    \ 并点击 `Generate Report`。\n3. 审查需要改进的区域（JavaScript 执行时间、阻塞渲染资源等）。\n\n### 需要监控的关键性能指标\n\
    \n| 指标 | 描述 | 理想值 |\n\n"
- fmt: "\n| First Contentful Paint (FCP) | Time taken to render the first visible\
    \ element | < 1.8s |\n| :--- | :--- | :--- |\n| Time to Interactive (TTI) | Time\
    \ taken before user interactions are responsive | < 5s |\n| JavaScript Execution\
    \ Time | Time taken for JavaScript to run on page load | Minimize as much as possible\
    \ |\n| Component Re-Render Time | Time taken for a React component to re-render\
    \ | Keep below 16ms per frame |\n\nOnce bottlenecks are identified, the next step\
    \ is optimizing React applications using memoization and lazy loading .\n\n* *\n\
    \n## 10.2 Using React’s Memoization and Lazy Loading for Optimization\n\n### 1.\
    \ React Memoization: Preventing Unnecessary Re-Renders\n\nIn React, every state\
    \ or prop change  triggers a re-render . If components re-render unnecessarily,\
    \ performance degrades.\n\n#### Techniques to Prevent Unnecessary Re-Renders\n\
    \n- `React.memo()` – Memoizes functional components.\n- `useMemo()` – Memoizes\
    \ expensive computations.\n- `useCallback()` – Memoizes functions to avoid recreating\
    \ them on every render.\n\n* *\n\n### Using `React.memo()` to Optimize Component\
    \ Rendering\n\n`React.memo()` �prevents a component from re-rendering if its props\
    \ do not change .\n\n#### Example: Without `React.memo()` (Unnecessary Re-Renders)\n\
    \n```jsx\nfunction ChildComponent({ name }) {\n  console.log(\"Child Rendered!\"\
    );\n  return <p>Hello, {name}</p>;\n}\n\nfunction ParentComponent() {\n  const\
    \ [count, setCount] = useState(0);\n  return (\n    <div>\n      <button onClick={()\
    \ => setCount(count + 1)}>Increment</button>\n      <ChildComponent name=\"John\"\
    \ />\n    </div>\n  );\n}\n```\n\nIssue: `ChildComponent` re-renders even though\
    \ `name` never changes .\n\n* *\n\n#### Optimized Version Using `React.memo()`\n\
    \n```jsx\nimport React, { memo, useState } from \"react\";\nconst ChildComponent\
    \ = memo(({ name }) => {\n  console.log(\"Child Rendered!\");\n  return <p>Hello,\
    \ {name}</p>;\n});\n\nfunction ParentComponent() {\n  const [count, setCount]\
    \ = useState(0);\n  return (\n    <div>\n      <button onClick={() => setCount(count\
    \ + 1)}>Increment</button>\n      <ChildComponent name=\"John\" />\n    </div>\n\
    \  );\n}\n```\n\nNow `ChildComponent` only re-renders when `name` changes .\n\n\
    * *\n\n### Using `useMemo()` for Expensive Calculations\n\nIf a component performs\
    \ heavy computations , `useMemo()` caches the result to avoid recalculating on\
    \ every render .\n\n#### Example: Without `useMemo()` (Slow Performance)\n\n```jsx\n\
    function ExpensiveComponent({ num }) {\n  const result = Array.from({ length:\
    \ 1e7 }, () => num).reduce((acc, val) => acc + val, 0);\n  return <p>Computed:\
    \ {result}</p>;\n}\n```\n\nIssue: Computation runs every time the parent re-renders\
    \ , even if `num` doesn’t change.\n\n* *\n\n#### Optimized Version Using `useMemo()`\n\
    \n```jsx\nimport React, { useMemo } from \"react\";\nfunction ExpensiveComponent({\
    \ num }) {\n  const result = useMemo(() => {\n    return Array.from({ length:\
    \ 1e7 }, () => num).reduce((acc, val) => acc + val, 0);\n  }, [num]);\n  return\
    \ <p>Computed: {result}</p>;\n}\n```\n\nNow, computation only runs when `num`\
    \ changes .\n\n* *\n\n### Using `useCallback()` for Memoizing Functions\n\nEvery\
    \ function inside a component gets recreated on each render , even if it doesn’t\
    \ change.\n\n#### Example: Without `useCallback()` (New Function on Every Render)\n\
    \n```jsx\nfunction ParentComponent() {\n  const handleClick = () => console.log(\"\
    Button Clicked\");\n  return <button onClick={handleClick}>Click Me</button>;\n\
    }\n```\n\nIssue: `handleClick` is recreated every render , causing child components\
    \ to re-render.\n\n* *\n\n#### Optimized Version Using `useCallback()`\n\n```jsx\n\
    import React, { useCallback } from \"react\";\nfunction ParentComponent() {\n\
    \  const handleClick = useCallback(() => {\n    console.log(\"Button Clicked\"\
    );\n  }, []);\n  return <button onClick={handleClick}>Click Me</button>;\n}\n\
    ```\n\nNow, `handleClick` remains the same across renders .\n\n* *\n\n### 2. Lazy\
    \ Loading Components with `React.lazy()`\n\nLoading all components upfront increases\
    \ page load time . Lazy loading  ays the loading of components until needed .\n\
    \n#### Example: Lazy Loading Components\n\n```jsx\nimport React, { Suspense, lazy\
    \ } from \"react\";\nconst LazyComponent = lazy(() => import(\"./HeavyComponent\"\
    ));\nfunction App() {\n  return (\n    <Suspense fallback={<p>Loading...</p>}>\n\
    \      <LazyComponent />\n    </Suspense>\n  );\n}\n```\n\nImproves performance\
    \ by loading components on demand.\n\n* *\n\n### Conclusion\n\n- Identifying bottlenecks\
    \ using Chrome DevTools and React Profiler helps optimize JavaScript performance.\n\
    - Memoization (`React.memo()`, `useMemo()`, `useCallback()`) prevents unnecessary\
    \ re-renders.\n- Lazy loading (`React.lazy()`) improves initial load time by deferring\
    \ component loading.\n\nBy implementing these optimization techniques, developers\
    \ can significantly enhance GUI performance , ensuring smooth and efficient React\
    \ applications.\n\n# 10.3 Optimizing Images and Assets for GUI Performance\n\n\
    ## Introduction to Asset Optimization in GUI Development\n\nImages, fonts, and\
    \ other media assets play a significant role in GUI applications, but if not optimized,\
    \ they can slow down loading times, increase bandwidth usage, and degrade user\
    \ experience. Asset optimization ensures that applications load quickly, improving\
    \ performance and SEO.\n\n### Common Performance Issues with Images and Assets\n\
    \n1. Large Image Files – Increases page load time.\n2. Unoptimized Image Formats\
    \ – Older formats like PNG and JPEG aren’t always efficient.\n3. Lack of Lazy\
    \ Loading – �uses unnecessary resource loading.\n4. Too Many HTTP Requests – Each\
    \ asset requires a separate network request.\n5. Render-Blocking Fonts and Stylesheets\
    \ – Delays page rendering.\n\n## 1. Choosing the Right Image Format\n\nSelecting\
    \ the right image format can drastically reduce file sizes �while maintaining\
    \ quality.\n\n| Image Format | Best For | Pros | Cons |\n| :--- | :--- | :---\
    \ | :--- |\n| JPEG | Photos, large images | Small file size, widely supported\
    \ | Lossy compression reduces quality |\n| PNG | Graphics with transparency |\
    \ High-quality, supports transparency | Larger file sizes |\n| WebP | All-purpose,\
    \ web images | 30% smaller than PNG, high quality | Not supported in all browsers\
    \ |\n| AVIF | Next-gen compression | Better than WebP, smallest size | Limited\
    \ browser support |\n| SVG | Icons, illustrations | Scalable, no quality loss\
    \ | Not ideal for complex images |\n\nUse WebP or AVIF for modern web apps. �\
    \ Use SVG for vector graphics.\n\n#### Example: Using WebP in HTML\n\n```html\n\
    <picture>\n  <source srcset=\"image.webp\" type=\"image/webp\">\n  <img src=\"\
    image.jpg\" alt=\"Optimized Image\">\n</picture>\n```\n\nFallback ensures compatibility\
    \ with browsers that don’t support WebP.\n\n* *\n\n## 2. Compression Techniques\n\
    \nReducing image size without losing quality is crucial for performance.\n\n###\
    \ Recommended Tools for Compression\n\n| Tool | Usage |\n| :--- | :--- |\n| TinyPNG\
    \ | Compress PNG and JPEG images |\n| Squoosh | Convert and compress images (supports\
    \ WebP, AVIF) |\n| ImageMagick | CLI-based bulk image processing |\n| Cloudinary\
    \ | On-the-fly image optimization for web apps |\n\nUse tools like TinyPNG before\
    \ uploading images. � For dynamic image optimization, use Cloudinary or Imgix.\n\
    \n* *\n\n## 3. Lazy Loading Images for Performance\n\nLazy loading defers image\
    \ loading until they are visible in the viewport , reducing initial load time.\n\
    \n#### Example: Native Lazy Loading in HTML\n\n```html\n<img src=\"image.jpg\"\
    \ loading=\"lazy\" alt=\"Lazy Loaded Image\">\n```\n\nReduces bandwidth consumption.\
    \   Improves perceived load time.\n\n## 4. Using a Content Delivery Network (CDN)\n\
    \nA CDN caches and delivers images and assets from servers closest to the user\
    \ , reducing latency.\n\n### Popular CDN Providers\n\n- Cloudflare\n- AWS CloudFront\n\
    - Google Cloud CDN\n\nUse CDNs for hosting images, fonts, and scripts.\n\n* *\n\
    \n# 10.4 Server-Side Rendering (SSR) vs Client-Side Rendering (CSR)\n\n## Understanding\
    \ Rendering in GUI Development\n\nRendering determines how UI components are processed\
    \ and displayed  in a web application. There are two primary rendering approaches:\n"
