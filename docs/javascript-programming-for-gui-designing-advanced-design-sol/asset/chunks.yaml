    \      <ul id=\"menu\" role=\"menu\" style={{ display: isOpen ? \"block\" : \"\
    none\" }}>\n        <li role=\"menuitem\">项目 1</li>\n        <li role=\"menuitem\"\
    >项目 2</li>\n        <li role=\"menuitem\">项目 3</li>\n      </ul>\n    </div>\n\
    \  );\n}\n\nexport default AccessibleDropdown;\n```\n\n使用了 `aria-expanded` 和 `aria-controls`\
    \ 以获得更好的可访问性。\n\n## 11.3 键盘导航与屏幕阅读器兼容性\n\n### 为什么键盘导航至关重要？\n\n许多用户依赖键盘导航而不是鼠标，包括：\n\
    \n* 使用屏幕阅读器的视障用户。\n* 行动能力不便的用户。\n* 偏好使用快捷键的高级用户。\n\n### 1. 让 GUI 具有键盘可访问性\n\n\
    | 功能 | 最佳实践 |\n| :--- | :--- |\n| 确保焦点可见性 | 使用 `:focus` 样式（`outline: 2px solid\
    \ blue;`） |\n| 使用 `tabindex` 进行导航 | 确保所有交互元素都有 `tabindex=\"0\"` |\n| 提供跳过链接 |\
    \ <a href=\"#main\" class=\"skip-link\">跳过到内容</a> |\n\n通过使用 `Tab` 和 `Shift+Tab`\
    \ 键进行导航进行测试。\n\n### 2. 让 GUI 友好屏幕阅读器\n\n屏幕阅读器将文本转换为语音。为了提高兼容性：\n\n* 使用适当的语义化 HTML（例如，按钮使用\
    \ `<button>` 而不是 `<div>`）。\n* 确保表单标签清晰（`<label for=\"name\">名称：</label>`）。\n*\
    \ 避免使用 `display: none;` 隐藏元素（请改用 `aria-hidden=\"true\"`）。\n\n#### 示例：屏幕阅读器友好型表单\n\
    \n```html\n<label for=\"email\">电子邮件地址:</label>\n<input type=\"email\" id=\"email\"\
    \ aria-required=\"true\">\n```\n\n确保屏幕阅读器能够理解输入字段。\n\n***\n\n### 测试可访问性\n\n使用这些工具测试可访问性：\n\
    \n* Lighthouse (Chrome 开发者工具) – 可访问性审计。\n* Axe DevTools – 检测 ARIA 问题。\n* NVDA\
    \ (Windows), VoiceOver (Mac) – 屏幕阅读器测试。\n\n运行可访问性审计以确保符合 WCAG 标准。\n\n* 网络可访问性确保了所有用户的包容性设计。\n\
    * ARIA 角色、属性和状态提升了 UI 的可访问性。\n* 键盘导航和屏幕阅读器支持对于可用性至关重要。\n\n通过实现这些技术，开发者可以创建完全可访问、用户友好且符合法规的\
    \ GUI 应用。\n\n## 11.4 颜色对比与字体可读性指南\n\n### 颜色对比与字体可读性简介\n\n适当的颜色对比字体可读性对于确保所有用户（包括视觉受障者）能够轻松阅读和操作图形用户界面\
    \ (GUI) 关关重要。对比度低、字体过小或字体选择不当会导致许多用户（包括色盲、视力低下或认知障碍患者）无法使用应用程序。\n\n### 1. 理解颜色对比\n\
    \n颜色对比是指文本与其背景之间的亮度差异。对比度太差会导致文本难以阅读，特别是对于视觉受障的用户而言。\n\n#### WCAG 对比要求\n\n《Web\
    \ 内容可访问性指南》(WCAG) 定义的对比要求如下：\n\n| WCAG 级别 | 最小对比比例 |\n| :--- | :--- |\n| AA (标准合规)\
    \ | 普通文本 4.5:1，大号文本 3:1 |\n| AAA (增强合规) | 普通文本 7:1，大号文本 4.5:1 |\n\n普通文本 = `14px`（常规字重）\n\
    大号文本 = `18px`（加粗）或 `24px`（常规）\n\n### 2. 如何检查对比度比例\n\n有几种工具可以帮助检查对比度比例：\n\n| 工具\
    \ | 用法 |\n| :--- | :--- |\n| WebAIM Contrast Checker | 检查文本与背景的对比度 |\n| Lighthouse\
    \ (Chrome 开发者工具) | 执行可访问性审计 |\n| Color Oracle | 模拟色盲 |\n\n使用对比度检查器确保符合 WCAG 标准。\n\
    \n### 3. 选择可访问的颜色\n\n某些用户会有色盲或难以区分相似色调的问题。为了适应他们：\n\n不要仅依赖颜色来传达含义。在使用颜色的同时使用图案、文本标签或图标。确保\
    \ UI 元素之间有足够的对比度。\n\n#### 示例：糟糕 vs 良好的对比度\n\n对比度差（难以阅读）：\n\n```css\n.button {\n\
    \  background-color: lightgray;\n  color: white;\n}\n```\n\n对比度良好（易阅读）：\n\n```css\n\
    .button {\n  background-color: #0055cc; /* 深蓝色 */\n  color: #ffffff; /* 白色 */\n\
    }\n```\n\n在浅色背景上使用深色文字，反之亦然。\n\n### 4. 字体可读性指南\n\n排版影响用户阅读和处理文本的难易程度。字体在不同的屏幕尺寸和分辨率下都应该是清晰的。\n\
    \n#### 4.1 选择可读的字体\n\n数字界面应使用无衬线字体，如 Arial, Helvetica, Roboto。\n正文避免使用脚本或装饰性字体。\n\
    确保字母和行之间有适当的间距。\n\n| 字体类型 | 最佳用例 |\n| :--- | :--- |\n| 无衬线字体 (如 Arial, Roboto,\
    \ Helvetica) | 正文、UI 元素 |\n| 衬线字体 (如 Times New Roman, Georgia) | 长文本内容、印刷媒体 |\n\
    | 等宽字体 (如 Courier, Consolas) | 代码段、技术内容 |\n\n***\n\n### 4.2 最佳字体大小和间距\n\n| 排版规则\
    \ | 最佳实践 |\n| :--- | :--- |\n| 正文大小 | 至少 `16px` 以保证可读性 |\n| 标题 | 使用更大的尺寸（`24px+`）以建立层级\
    \ |\n| 行高 (Leading) | 字体大小的 `1.5x` 以保证可读性 |\n| 字间距 (Tracking) | `0.12em` - `0.16em`\
    \ 以提高可读性 |\n\n为了可访问性，不要使用小于 `14px` 的文本。\n\n### 4.3 字体可读性的最佳实践\n\n在文本和背景之间使用适当的对比度。确保文本不会过于拥挤或间距过密。在主字体不可用时提供备用字体。允许用户调整字体大小而不破坏布局。\n\
    \n#### 示例：良好 vs 糟糕的字体使用\n\n可读性较差：\n\n```css\nbody {\n  font-family: \"Cursive\"\
    ;\n  font-size: 12px;\n  line-height: 1;\n}\n```\n\n可读性较好：\n\n```css\nbody {\n\
    \  font-family: \"Arial\", sans-serif;\n  font-size: 16px;\n  line-height: 1.5;\n\
    }\n```\n\n文本应该是可以调整而不破坏 UI 布局的。\n\n## 11.5 包容性 GUI 设计的最佳实践\n\n### 包容性设计简介\n\n\
    包容性设计确保所有用户（无论能力如何）都能有效地访问和使用 GUI 应用程序。这种方法超越了基础的可访问性合规，旨在为各种用户创建体验。\n\n### 1.\
    \ 包容性 GUI 设计的核心原则\n\n1. 灵活性 – 设计适用于不同用户和设备的界面。\n2. 简单性 – 保持 UI 元素直观且易于导航。\n3.\
    \ 可见性 – 确保关键元素清晰可辨。\n4. 用户控制 – 允许用户根据其需求定制体验。\n5. 辅助技术支持 – 确保与屏幕阅读器、语音控制和替代输入设备的兼容性。\n\
    \n为可访问性设计可以提高人的可用性。\n\n### 2. 实现包容性 UI 元素\n\n| UI 元素 | 最佳实践 |\n| :--- | :--- |\n\
    \n"
