    }\n```\n\n#### 如何安装 Material UI\n```bash\nnpm install @mui/material @emotion/react\
    \ @emotion/styled\n```\n\n| 框架 | 最佳场景 |\n| :--- | :--- |\n| `Bootstrap` | 快速原型、传统\
    \ Web 应用 |\n| `Tailwind CSS` | 自定义设计、现代 UI |\n| `Material UI` | 企业级应用、基于 React\
    \ 的应用 |\n\n## 6.3 React 中的 Styled Components\n\n### 什么是 Styled Components？\nStyled\
    \ Components 是一个 CSS-in-JS 库，允许开发者在 JavaScript 中编写组件作用的样式。\n\n### 为什么使用 Styled\
    \ Components？\n- **作用域样式**：无全局冲突。\n- **动态样式**：基于组件 props 的样式。\n- **与 React 集成良好**：使用组件化的语法。\n\
    \n### 如何使用 Styled Components\n#### 第 1 步：安装 Styled Components\n```bash\nnpm install\
    \ styled-components\n```\n#### 第 2 步：创建样式组件\n```javascript\nimport styled from\
    \ \"styled-components\";\n\nconst Button = styled.button`\n  background-color:\
    \ ${props => (props.primary ? \"blue\" : \"gray\")};\n  color: white;\n  padding:\
    \ 10px 20px;\n  border-radius: 5px;\n  border: none;\n  cursor: pointer;\n\n \
    \ &:hover {\n    background-color: ${props => (props.primary ? \"darkblue\" :\
    \ \"darkgray\")};\n  }\n`;\n\nfunction App() {\n  return (\n    <div>\n      <Button\
    \ primary>主按钮</Button>\n      <Button>次按钮</Button>\n    </div>\n  );\n}\n```\n"
