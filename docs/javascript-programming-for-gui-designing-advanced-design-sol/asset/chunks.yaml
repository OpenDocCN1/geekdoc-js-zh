    ## 10.2 Using React’s Memoization and Lazy Loading for Optimization


    ### 1. React Memoization: Preventing Unnecessary Re-Renders


    In React, every state or prop change  triggers a re-render . If components re-render
    unnecessarily, performance degrades.


    #### Techniques to Prevent Unnecessary Re-Renders


    React.memo()  – Memoizes functional components.


    useMemo()  – Memoizes expensive computations.


    useCallback()  – Memoizes functions to avoid recreating them on every render.


    * * *


    ### Using React.memo()  to Optimize Component Rendering


    React.memo()  prevents a component from re-rendering if its props do not change
    .


    #### Example: Without React.memo()  (Unnecessary Re-Renders)


    jsx


    CopyEdit


    function ChildComponent({ name }) {


    console.log("Child Rendered!");


    return <p>Hello, {name}</p>;


    }


    function ParentComponent() {


    const [count, setCount] = useState(0);


    return (


    <div>


    <button onClick={() => setCount(count + 1)}>Increment</button>


    <ChildComponent name="John" />


    </div>


    );


    }


    Issue:   ChildComponent  re-renders even though name  never changes .


    * * *


    #### Optimized Version Using React.memo()


    jsx


    CopyEdit


    import React, { memo, useState } from "react";


    const ChildComponent = memo(({ name }) => {


    console.log("Child Rendered!");


    return <p>Hello, {name}</p>;


    });


    function ParentComponent() {


    const [count, setCount] = useState(0);


    return (


    <div>


    <button onClick={() => setCount(count + 1)}>Increment</button>


    <ChildComponent name="John" />


    </div>


    );


    }


    Now ChildComponent only re-renders when name  changes.


    * * *


    ### Using useMemo()  for Expensive Calculations


    If a component performs heavy computations , useMemo()  caches the result to avoid
    recalculating on every render .


    #### Example: Without useMemo()  (Slow Performance)


    jsx


    CopyEdit


    function ExpensiveComponent({ num }) {


    const result = Array.from({ length: 1e7 }, () => num).reduce((acc, val) => acc
    + val, 0);


    return <p>Computed: {result}</p>;


    }


    Issue:  Computation runs every time the parent re-renders , even if num  doesn’t
    change.


    * * *


    #### Optimized Version Using useMemo()


    jsx


    CopyEdit


    import React, { useMemo } from "react";


    function ExpensiveComponent({ num }) {


    const result = useMemo(() => {


    return Array.from({ length: 1e7 }, () => num).reduce((acc, val) => acc + val,
    0);


    }, [num]);


    return <p>Computed: {result}</p>;


    }


    Now, computation only runs when num  changes.


    * * *


    ### Using useCallback()  for Memoizing Functions


    Every function inside a component gets recreated on each render , even if it doesn’t
    change.


    #### Example: Without useCallback()  (New Function on Every Render)


    jsx


    CopyEdit


    function ParentComponent() {


    const handleClick = () => console.log("Button Clicked");


    return <button onClick={handleClick}>Click Me</button>;


    }


    Issue:   handleClick   is recreated every render , causing child components to
    re-render.


    * * *


    #### Optimized Version Using useCallback()


    jsx


    CopyEdit


    import React, { useCallback } from "react";


    function ParentComponent() {


    const handleClick = useCallback(() => {


    console.log("Button Clicked");


    }, []);


    return <button onClick={handleClick}>Click Me</button>;


    }


    Now, handleClick  remains the same across renders.


    * * *


    ### 2\. Lazy Loading Components with React.lazy()


    Loading all components upfront increases page load time . Lazy loading  delays
    the loading of components until needed .


    #### Example: Lazy Loading Components


    jsx


    CopyEdit


    import React, { Suspense, lazy } from "react";


    const LazyComponent = lazy(() => import("./HeavyComponent"));


    function App() {


    return (


    <Suspense fallback={<p>Loading...</p>}>


    <LazyComponent />


    </Suspense>


    );


    }


    Improves performance by loading components on demand.


    * * *


    ### Conclusion


    ​● ​ Identifying bottlenecks using Chrome DevTools and React Profiler helps optimize
    JavaScript performance.


    ​● ​ Memoization ( React.memo() , useMemo() , useCallback() ) prevents unnecessary
    re-renders.


    ​● ​ Lazy loading ( React.lazy() ) improves initial load time by deferring component
    loading.


    By implementing these optimization techniques, developers can significantly enhance
    GUI performance , ensuring smooth and efficient React applications.


    # 10.3 Optimizing Images and Assets for GUI Performance


    ## Introduction to Asset Optimization in GUI Development


    Images, fonts, and other media assets play a significant role in GUI applications,
    but if not optimized, they can slow down loading times, increase bandwidth usage,
    and degrade user experience. Asset optimization ensures that applications load
    quickly, improving performance and SEO.


    ### Common Performance Issues with Images and Assets


    ​1\. ​ Large Image Files  – Increases page load time.


    ​2\. ​ Unoptimized Image Formats  – Older formats like PNG and JPEG aren’t always
    efficient.


    ​3\. ​ Lack of Lazy Loading  – Causes unnecessary resource loading.


    ​4\. ​ Too Many HTTP Requests  – Each asset requires a separate network request.


    ​5\. ​ Render-Blocking Fonts and Stylesheets  – Delays page rendering.


    ## 1. Choosing the Right Image Format


    Selecting the right image format can drastically reduce file sizes  while maintaining
    quality.


    | Image Format | Best For | Pros | Cons |


    | JPEG | Photos, large images | Small file size, widely supported | Lossy compression
    reduces quality |


    | PNG | Graphics with transparency | High-quality, supports transparency | Larger
    file sizes |


    | WebP | All-purpose, web images | 30% smaller than PNG/JPEG, high quality | Not
    supported in all older browsers |


    | AVIF | Next-gen compression | Better than WebP, smallest size | Limited browser
    support |


    | SVG | Icons, logos, illustrations | Scalable, no quality loss | Not ideal for
    complex images |


    Use WebP or AVIF for modern web apps.   Use SVG for icons and vector graphics.


    #### Example: Using WebP in HTML


    html


    CopyEdit


    <picture>


    <source srcset="image.webp" type="image/webp">


    <img src="image.jpg" alt="Optimized Image">


    </picture>


    Fallback ensures compatibility with browsers that don’t support WebP.


    * * *


    ## 2\. Image Compression Techniques


    Reducing image size without losing quality is crucial for performance.


    ### Recommended Tools for Compression


    | Tool | Usage |


    | TinyPNG | Compress PNG and JPEG images |


    | Squoosh | Convert and compress images (supports WebP, AVIF) |


    | ImageMagick | CLI-based bulk image processing |


    | Cloudinary | On-the-fly image optimization for web apps |


    Use tools like TinyPNG before uploading images.   For dynamic image optimization,
    use Cloudinary or Imgix.


    * * *


    ## 3. Lazy Loading Images for Performance


    Lazy loading defers image loading until they are visible in the viewport , reducing
    initial load time.


    #### Example: Native Lazy Loading in HTML


    html


    CopyEdit


    <img src="image.jpg" loading="lazy" alt="Lazy Loaded Image">


    Reduces bandwidth consumption.   Improves perceived load time.


    ## 4. Using a Content Delivery Network (CDN)


    A CDN caches and delivers images and assets from servers closest to the user ,
    reducing latency.


    ### Popular CDN Providers


    ​● ​ Cloudflare


    ​● ​ AWS CloudFront


    ​● ​ Google Cloud CDN


    Use CDNs for hosting images, fonts, and scripts.


    * * *


