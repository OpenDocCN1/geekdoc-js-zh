  trans: "\n\n在构建仪表板（Dashboard）之前，请考虑以下因素：\n\n- **目的**：它将显示哪些数据？\n- **用户体验 (UX)**：哪些功能可以提高易用性？\n\
    - **性能**：它加载和更新数据的效率有多高？\n- **响应式**：它能在不同屏幕尺寸上正常工作吗？\n\n## 常见仪表板组件\n\n| 组件 | 目的\
    \ | 示例 |\n| :--- | :--- | :--- |\n| 侧边栏导航 | 允许用户在部分间导航 | 包含报告、分析、设置链接的菜单 |\n|\
    \ 页眉（导航栏） | 显示用户信息、通知、搜索框 | 用户名、注销按钮、搜索输入 |\n| 组件（卡片） | 显示摘要指标 | 总用户数、营收、性能指标\
    \ |\n| 数据可视化 | 用于洞察的图表和图表 | 折线图、柱状图、饼图 |\n| 表格与列表 | 显示详细记录 | 用户列表、销售报告、交易日志 |\n\
    | 过滤器与排序 | 允许用户精炼数据 | 日期选择器、下拉菜单、搜索框 |\n\n将仪表板拆分为组件可以提高模块化和可维护性。\n\n## 设计仪表板布局\n\
    \nReact 仪表板通常使用 flexbox 或 grid 布局进行构建。\n\n我们将使用 `React` + `CSS Grid` + `Material\
    \ UI` 来创建一个响应式的仪表板。\n\n## 1. 设置 React 仪表板项目\n\n### 步骤 1：创建新的 React 应用\n\n```sh\n\
    npx create-react-app react-dashboard\ncd react-dashboard\nnpm install @mui/material\
    \ @emotion/react @emotion/styled react-chartjs-2 chart.js\n```\n\n### 步骤 2：创建项目结构\n\
    \n```bash\n/src\n/components\nSidebar.js\nNavbar.js\nDashboard.js\nChartComponent.js\n\
    TableComponent.js\n```\n\n## 2. 创建基础仪表板布局\n\n`App.js` (主布局)\n\n```jsx\nimport\
    \ React from \"react\";\nimport Sidebar from \"./components/Sidebar\";\nimport\
    \ Dashboard from \"./components/Dashboard\";\nimport { Box } from \"@mui/material\"\
    ;\n\nfunction App() {\n  return (\n    <Box display=\"flex\">\n      <Sidebar\
    \ />\n      <Dashboard />\n    </Box>\n  );\n}\n\nexport default App;\n```\n使用\
    \ `Material UI` 的 `Box` 来管理布局。\n\n## 3. 实现侧边栏导航\n\n`Sidebar.js`\n\n```jsx\nimport\
    \ React from \"react\";\nimport { Drawer, List, ListItem, ListItemText } from\
    \ \"@mui/material\";\n\nfunction Sidebar() {\n  return (\n    <Drawer variant=\"\
    permanent\">\n      <List>\n        <ListItem button>\n          <ListItemText\
    \ primary=\"Dashboard\" />\n        </ListItem>\n        <ListItem button>\n \
    \         <ListItemText primary=\"Reports\" />\n        </ListItem>\n      </List>\n\
    \    </Drawer>\n  );\n}\n\nexport default Sidebar;\n```\n可折叠的侧边栏可以提升导航体验。\n\n\
    ## 4. 添加顶部导航栏\n\n`Navbar.js`\n\n```jsx\nimport React from \"react\";\nimport {\
    \ AppBar, Toolbar, Typography } from \"@mui/material\";\n\nfunction Navbar() {\n\
    \  return (\n    <AppBar position=\"static\">\n      <Toolbar>\n        <Typography\
    \ variant=\"h6\">Dashboard</Typography>\n      </Toolbar>\n    </AppBar>\n  );\n\
    }\n\nexport default Navbar;\n```\n提供品牌展示、用户信息和搜索功能。\n\n## 13.2 使用 Chart.js 实现数据可视化\n\
    \n### 为什么使用 Chart.js？\n\n轻量且快速。支持多种图表类型（柱状、折线、饼图等）。通过 `react-chartjs-2` 可轻松集成到\
    \ `React`。\n\n### 1. 设置 Chart.js\n\n安装依赖项：\n\n```sh\nnpm install react-chartjs-2\
    \ chart.js\n```\n`react-chartjs-2` 是 `Chart.js` 的 React 封装器。\n\n### 2. 创建折线图组件\n\
    \n`ChartComponent.js`\n\n```jsx\nimport React from \"react\";\nimport { Line }\
    \ from \"react-chartjs-2\";\nimport { Chart as ChartJS, CategoryScale, LinearScale,\
    \ PointElement, LineElement, Title, Tooltip, Legend } from \"chart.js\";\n\nChartJS.register(CategoryScale,\
    \ LinearScale, PointElement, LineElement, Title, Tooltip, Legend);\n\nconst data\
    \ = {\n  labels: [\"Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\"],\n  datasets: [\n\
    \    {\n      label: \"Revenue\",\n      data: [1200, 1900, 3000, 5000, 7000],\n\
    \      borderColor: \"blue\",\n      borderWidth: 2,\n    },\n  ],\n};\n\nfunction\
    \ ChartComponent() {\n  return <Line data={data} />;\n}\n\nexport default ChartComponent;\n\
    ```\n在仪表板中动态地可视化数据。\n\n### 3. 为销售添加柱状图\n\n`BarChartComponent.js`\n\n```jsx\nimport\
    \ React from \"react\";\nimport { Bar } from \"react-chartjs-2\";\n\nconst data\
    \ = {\n  labels: [\"Product A\", \"Product B\", \"Product C\"],\n  datasets: [\n\
    \    {\n      label: \"Sales\",\n      data: [100, 200, 300],\n      backgroundColor:\
    \ [\"red\", \"green\", \"blue\"],\n    },\n  ],\n};\n\nfunction BarChartComponent()\
    \ {\n  return <Bar data={data} />;\n}\n\nexport default BarChartComponent;\n```\n\
    图表显示趋势、对比和统计数据。\n\n## 13.3 添加过滤器、排序选项和用户偏好\n\n### 1. 实现数据过滤器\n\n过滤器允许用户精炼显示的数据。\n\
    \n#### 添加日期过滤器\n\n`FilterComponent.js`\n\n```jsx\nimport React, { useState } from\
    \ \"react\";\nimport { TextField } from \"@mui/material\";\n\nfunction FilterComponent({\
