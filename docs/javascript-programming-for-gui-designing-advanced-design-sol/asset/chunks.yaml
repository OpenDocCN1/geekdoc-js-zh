    \n#### Example: React Functional Component\n\n```jsx\nfunction Button({ label\
    \ }) {\n  return <button className=\"custom-button\">{label}</button>;\n}\n\n\
    export default Button;\n```\n\n#### Using the Button Component\n\n```jsx\nimport\
    \ Button from \"./Button\";\n\nfunction App() {\n  return (\n    <div>\n     \
    \ <Button label=\"Click Me\" />\n      <Button label=\"Submit\" />\n    </div>\n\
    \  );\n}\n```\n\n| Feature | Vanilla JavaScript | React Component-Based UI |\n\
    | :--- | :--- | :--- |\n| Reusability | Manual function-based | Built-in component\
    \ reuse |\n| Encapsulation | Limited | Fully encapsulated logic |\n| State Handling\
    \ | Requires event listeners | Built-in `useState()` hook |\n| Rendering Updates\
    \ | Manual DOM updates | Automatic reconciliation |\n\n`React`’s component-based\
    \ structure ensures an efficient and scalable UI architecture.\n\n## 7.2 Event\
    \ Listeners and User Interactions in JavaScript\n\n### Understanding Event Listeners\n\
    \nEvent listeners detect user actions (e.g., clicks, keyboard inputs, mouse movements)\
    \ and execute predefined functions in response.\n\n### Common Event Listeners\
    \ in JavaScript\n\n| Event | Trigger | Example Use Case |\n| :--- | :--- | :---\
    \ |\n| `click` | When a user clicks an element | Submitting a form |\n| `mouseover`\
    \ | When a user hovers over an element | Tooltip display |\n| `keydown` | When\
    \ a key is pressed | Typing in a search bar |\n| `change` | When an input field\
    \ changes | Validating user input |\n| `submit` | When a form is submitted | Preventing\
    \ default form actions |\n\n### Handling Click Events\n\nClick events allow interaction\
    \ with buttons, links, and other UI elements.\n\n#### Example: Handling a Click\
    \ Event\n\n```javascript\ndocument.getElementById(\"myButton\").addEventListener(\"\
    click\", function() {\n  alert(\"Button Clicked!\");\n});\n```\n\nWhen the button\
    \ is clicked, an alert box appears.\n\n### Handling Keyboard Events\n\nKeyboard\
