    )\n  .then(response => response.json()) // 将响应转换为 JSON\n  .then(data => {\n  \
    \  data.forEach(user => {\n      console.log(`User: ${user.name}, Email: ${user.email}`);\n\
    \    });\n  })\n  .catch(error => console.error(\"Error fetching data:\", error));\n\
    ```\n\n简单且轻量。与 `axios` 相比，错误处理能力有限。\n\n### 使用 `axios` 获取 API 数据\n\n`axios` 提供了更好的方法，具有自动\
    \ JSON 转换和改进的错误处理机制。\n\n#### 安装 `axios`\n\n```sh\nnpm install axios\n```\n\n####\
    \ 示例：使用 `axios` 获取数据\n\n```javascript\nimport axios from \"axios\";\naxios.get(\"\
    https://jsonplaceholder.typicode.com/users\")\n  .then(response => console.log(response.data))\n\
    \  .catch(error => console.error(\"API Error:\", error));\n```\n\n自动将响应转换为 JSON。更有效地处理错误。\n\
    \n### 在 React 中使用 `useEffect()` 获取数据\n\n在 React 函数组件中，`useEffect()` Hook 经常用于在组件挂载时获取数据。\n\
    \n#### 示例：在 React 中获取 API 数据\n\n```jsx\nimport React, { useState, useEffect }\
    \ from \"react\";\nimport axios from \"axios\";\n\nfunction UserList() {\n  const\
    \ [users, setUsers] = useState([]);\n  useEffect(() => {\n    axios.get(\"https://jsonplaceholder.typicode.com/users\"\
    )\n      .then(response => setUsers(response.data))\n      .catch(error => console.error(\"\
    Error:\", error));\n  }, []); // 仅在组件挂载时运行一次\n\n  return (\n    <div>\n      <h2>User\
    \ List</h2>\n      <ul>\n        {users.map(user => (\n          <li key={user.id}>{user.name}\
    \ - {user.email}</li>\n        ))}\n      </ul>\n    </div>\n  );\n}\n\nexport\
    \ default UserList;\n```\n\n在组件挂载时获取数据。通过使用空依赖数组 `[]` 防止不必要的重复获取。\n\n### 处理加载状态和错误\n\
    \n在获取 API 数据时，处理加载状态和错误是最佳实践。\n\n#### 示例：显示加载和错误状态\n\n```jsx\nfunction UserList()\
    \ {\n  const [users, setUsers] = useState([]);\n  const [loading, setLoading]\
    \ = useState(true);\n  const [error, setError] = useState(null);\n\n  useEffect(()\
    \ => {\n    axios.get(\"https://jsonplaceholder.typicode.com/users\")\n      .then(response\
    \ => {\n        setUsers(response.data);\n        setLoading(false);\n      })\n\
    \      .catch(error => {\n        setError(\"Error fetching data\");\n       \
    \ setLoading(false);\n      });\n  }, []);\n\n  if (loading) return <p>Loading...</p>;\n\
    \  if (error) return <p>{error}</p>;\n\n  return (\n    <ul>\n      {users.map(user\
    \ => (\n        <li key={user.id}>{user.name} - {user.email}</li>\n      ))}\n\
    \    </ul>\n  );\n}\n```\n\n通过显示加载状态来提升用户体验。优雅地处理 API 错误。\n\n### 优化 API 请求\n\n\
    为了防止不必要的 API 调用并提高性能：\n\n- 使用缓存机制（例如将结果存储在状态或本地存储中）。\n- 对搜索输入进行 API 防抖处理（例如使用\
    \ `lodash.debounce()`）。\n- 对大数据集进行分页，而不是一次性获取所有数据。\n\n## 9.2 理解 GUI 应用中的 REST\
    \ 和 GraphQL\n\n### REST 和 GraphQL 简介\n\nAPI 通常遵循 `REST`（表述状态转移）或 `GraphQL` 架构来传递数据。\n\
    \n| 特性 | REST API | GraphQL API |\n| :--- | :--- | :--- |\n| 数据检索 | 获取定义的数据结构（固定端点）\
    \ | 客户端指定所需的精确数据 |\n| 性能 | 可能会过度获取或获取不足 | 仅获取必要的字段（效率更高） |\n| 灵活性 | 灵活性较低，需要多个端点\
    \ | 灵活性更高，单个端点支持多个查询 |\n| 使用场景 | 具有标准 CRUD 操作的简单应用 | 需要优化数据获取的复杂应用 |\n\n### REST\
    \ API 概述\n\nREST API 遵循基于资源的架构，每个实体都通过端点暴露。\n\n#### REST API 中的常用 HTTP 方法\n\n\
    | 方法 | 目的 | 示例端点 |\n| :--- | :--- | :--- |\n| `GET` | 获取数据 | `/users` |\n| `POST`\
    \ | 创建新资源 | `/users` |\n| `PUT` | 更新现有资源 | `/users/:id` |\n| `DELETE` | 移除资源 |\
    \ `/users/:id` |\n\n#### 示例：从 REST API 获取数据\n\n```javascript\nfetch(\"https://api.example.com/users\"\
    )\n  .then(response => response.json())\n  .then(data => console.log(data))\n\
    \  .catch(error => console.error(\"Error fetching users:\", error));\n```\n\n\
    简单且被广泛采用。对于复杂的数据结构可能需要多次请求。\n\n### GraphQL API 概述\n\nGraphQL 是一种用于 API 的查询语言，允许客户端请求它们需要的数据。。\n\
    \n 示例：用户的 GraphQL 查询\n\n```graphql\n{\n  users {\n    id\n    name\n    email\n\
    \  }\n}\n```\n\n与 REST 不同（REST 每个实体具有固定结构），GraphQL 允许客户端定义它们想要的精确数据。\n\n#### 示例：从\
    \ GraphQL API 获取数据\n\n```javascript\nimport { request, gql } from \"graphql-request\"\
    ;\nconst query = gql`\n{\n  users {\n    id\n    name\n    email\n  }\n}\n`;\n\
    request(\"https://api.example.com/graphql\", query)\n  .then(data => console.log(data))\n\
    \  .catch(error => console.error(\"Error fetching users:\", error));\n```\n\n\
    优化的数据获取（无过度获取）。减少了所需的 API 调用次数。需要设置 GraphQL 服务器。\n\n### 何时使用 REST vs GraphQL\n\
    \n| 场景 | 最佳选择 |\n| :--- | :--- |\n| 简单的 CRUD 操作 | REST API |\n| 在单个请求中获取嵌套数据 |\
    \ GraphQL |\n| 标准化 API 集成（第三方服务） | REST API |\n| 具有选择性数据需求的高动态 UI | GraphQL |\n\
    \n- 高效地获取 API 数据对于实时 GUI 应用至关重要。\n- `REST` API 适用于传统的 CRUD 操作并被广泛使用。\n- `GraphQL`\
    \ API 为复杂应用提供了更好的灵活性和优化的查询。\n\n通过掌握数据获取技术和 API 集成，开发者可以构建提供动态体验的交互式实时 GUI 应用。\n\
    \n# 9.3 处理异步 UI 更新\n\n## 异步 UI 更新简介\n\n在现代 GUI 应用中，许多交互依赖于异步操作，例如：\n\n- 从 API\
    \ 获取数据。\n- 在不刷新页面的情况下提交表单。\n- 动态加载新内容（例如无限滚动）。\n\n由于 JavaScript 是单线程的，这些操作必须异步异步处理，以防止\
    \ UI 阻塞并确保流畅的用户体验。\n\n## 理解 JavaScript 中的异步操作\n\n### 1. 回调函数 (Callbacks)\n\n回调是作为参数传递稍后执行的函数。\n\
    \n#### 示例：使用回调获取数据\n\n```javascript\nfunction fetchData(callback) {\n  setTimeout(()\
    \ => {\n    callback(\"Data loaded successfully!\");\n  }, 2000);\n}\n\nfetchData((message)\
    \ => {\n  console.log(message);\n});\n```\n\n 回调地狱：回调可能会变得深度嵌套，导致代码难以维护。\n\n###\
    \ 2. Promises (.then() 和 .catch() )\n\nPromises 允许更清晰地处理异步任务。\n\n#### 示例：使用 Promises\n\
    \n```javascript\nfunction fetchData() {\n  return new Promise((resolve, reject)\
    \ => {\n    setTimeout(() => {\n      resolve(\"Data loaded successfully!\");\n\
    \    }, 2000);\n  });\n}\n\nfetchData().then((message) => console.log(message));\n\
    ```\n\n与回调相比提高了可读性。\n\n### 3. Async/Await（现代方法）\n\nasync 和 await 通过让异步操作看起来像同步一样来了异步操作。\n\
    \n#### 示例：使用 async/await 获取数据\n\n```javascript\nasync function fetchData() {\n\
    \  return \"Data loaded successfully!\";\n}\n\nasync function displayData() {\n\
    \  const result = await fetchData();\n  console.log(result);\n}\n\ndisplayData();\n\
    ```\n"
- fmt: "\nEasier to read and maintain than `.then()` chains.\n\n## Handling Asynchronous\
    \ UI Updates in React\n\nIn React, UI updates should not block rendering. The\
    \ `useEffect()` hook is commonly used to handle API calls without freezing the\
    \ UI.\n\n#### Example: Fetching Data with `useEffect()`\n\n```jsx\nimport React,\
    \ { useState, useEffect } from \"react\";\n\nfunction UserList() {\n  const [users,\
    \ setUsers] = useState([]);\n  const [loading, setLoading] = useState(true);\n\
    \n  useEffect(() => {\n    fetch(\"https://jsonplaceholder.typicode.com/users\"\
    )\n      .then(response => response.json())\n      .then(data => {\n        setUsers(data);\n\
    \        setLoading(false);\n      });\n  }, []);\n\n  return loading ? <p>Loading...</p>\
    \ : <ul>{users.map(user => <li key={user.id}>{user.name}</li>)}</ul>;\n}\n```\n\
    \n- Handles API fetching without blocking rendering.\nDisplays loading state until\
    \ data is available.\n\n## Optimizing Asynchronous UI Updates\n\n1. **Use Skeleton\
    \ Screens**: Show placeholders while data loads.\n2. **Cache Data**: Avoid unnecessary\
    \ API calls (e.g., `localStorage`).\n3. **Debounce Input Requests**: For real-time\
    \ search fields, prevent excessive API requests.\n\n# 9.4 WebSockets for Real-Time\
    \ GUI Updates\n\n## Introduction to WebSockets\n\nWebSockets enable bi-directional\
    \ communication between the client and the server, allowing real-time updates\
    \ without polling.\n\n### Why Use WebSockets?\n\n- Push updates instantly (e.g.,\
    \ chat apps, stock tickers).\n- More efficient than polling (reduces unnecessary\
    \ requests).\n- Persistent connection between client and server.\n\n## Setting\
    \ Up WebSockets in JavaScript\n\nThe `WebSocket` API enables real-time data transfer.\n\
    \n#### Example: Establishing a WebSocket Connection\n\n```javascript\nconst socket\
    \ = new WebSocket(\"wss://example.com/socket\");\nsocket.onopen = () => {\n  console.log(\"\
    WebSocket connection established\");\n};\nsocket.onmessage = (event) => {\n  console.log(\"\
    Received:\", event.data);\n};\nsocket.onclose = () => {\n  console.log(\"WebSocket\
    \ connection closed\");\n};\n```\n\nEfficiently updates UI when new data arrives.\n\
    \n## Implementing WebSockets in React\n\nUsing React and WebSockets, we can update\
    \ the UI in real time.\n\n#### Example: Real-Time Chat UI with WebSockets\n\n\
    ```jsx\nimport React, { useState, useEffect } from \"react\";\n\nfunction ChatApp()\
    \ {\n  const [messages, setMessages] = useState([]);\n  const socket = new WebSocket(\"\
    wss://example.com/chat\");\n\n  useEffect(() => {\n    socket.onmessage = (event)\
    \ => {\n      setMessages(prevMessages => [...prevMessages, event.data]);\n  \
    \  };\n    return () => socket.close();\n  }, []);\n\n  return (\n    <ul>\n \
    \     {messages.map((msg, index) => <li key={index}>{msg}</li>)}\n    </ul>\n\
    \  );\n}\nexport default ChatApp;\n```\n\nMessages update instantly as they arrive.\n\
    \n## Use Cases for WebSockets\n\n- Chat applications (e.g., WhatsApp Web).\n-\
    \ Live notifications (e.g., real-time alerts).\n- Stock market tracking (e.g.,\
    \ real-time price updates).\n\n# 9.5 Implementing CRUD Operations in React\n\n\
    ## Understanding CRUD in GUI Applications\n\nCRUD (Create, Read, Update, Delete)\
    \ operations allow applications to manage data dynamically.\n\n| Operation | HTTP\
    \ Method | Example Endpoint |\n| :--- | :--- | :--- |\n| Create | `POST` | `/users`\
    \ |\n| Read | `GET` | `/users/:id` |\n| Update | `PUT` or `PATCH` | `/users/:id`\
    \ |\n| Delete | `DELETE` | `/users/:id` |\n\n## Implementing CRUD in React\n\n\
    Using React Hooks (`useState`, `useEffect`) and `axios`, we can implement CRUD\
    \ operations.\n\n### 1. Fetching Data (Read)\n\n```jsx\nimport React, { useState,\
    \ useEffect } from \"react\";\nimport axios from \"axios\";\n\nfunction UserList()\
    \ {\n  const [users, setUsers] = useState([]);\n  useEffect(() => {\n    axios.get(\"\
    https://jsonplaceholder.typicode.com/users\")\n      .then(response => setUsers(response.data));\n\
    \  }, []);\n\n  return (\n    <ul>\n      {users.map(user => <li key={user.id}>{user.name}</li>)}\n\
    \    </ul>\n  );\n}\nexport default UserList;\n```\n\nDisplays a list of users\
    \ from an API.\n\n### 2. Creating a New User (Create)\n\n```jsx\nfunction CreateUser()\
    \ {\n  const [name, setName] = useState(\"\");\n  const handleSubmit = (event)\
    \ => {\n    event.preventDefault();\n    axios.post(\"https://jsonplaceholder.typicode.com/users\"\
    , { name })\n      .then(response => console.log(\"User created:\", response.data));\n\
    \  };\n  return (\n    <form onSubmit={handleSubmit}>\n      <input type=\"text\"\
    \ value={name} onChange={e => setName(e.target.value)} />\n      <button type=\"\
    submit\">Add User</button>\n    </form>\n  );\n}\n```\n\nCreates a new user and\
    \ sends data to the server.\n\n### 3. Updating User Data (Update)\n\n```jsx\n\
    function UpdateUser({ userId }) {\n  const [name, setName] = useState(\"\");\n\
    \  const handleUpdate = () => {\n    axios.put(`https://jsonplaceholder.typicode.com/users/${userId}`,\
    \ { name })\n      .then(response => console.log(\"User updated:\", response.data));\n\
    \  };\n  return (\n    <div>\n      <input type=\"text\" value={name} onChange={e\
    \ => setName(e.target.value)} />\n      <button onClick={handleUpdate}>Update\
    \ User</button>\n    </div>\n  );\n}\n```\n\nUpdates user data on the server.\n\
    \n### 4. Deleting a User (Delete)\n\n```jsx\nfunction DeleteUser({ userId }) {\n\
    \  const handleDelete = () => {\n    axios.delete(`https://jsonplaceholder.typicode.com/users/${userId}`)\n\
    \      .then(() => console.log(\"User deleted\"));\n  };\n  return <button onClick={handleDelete}>Delete</button>;\n\
    }\n```\n\nRemoves a user from the database.\n\n- Asynchronous UI updates ensure\
    \ smooth data fetching without blocking rendering.\n- WebSockets enable real-time\
    \ updates in applications.\n- CRUD operations allow applications to create, read,\
    \ update, and delete data dynamically.\n\nBy implementing these concepts, developers\
    \ can build highly dynamic, real-time, and interactive GUI applications with React.\n\
    \n# Chapter 10\n\n# Performance Optimization in GUI Development\n\nOptimizing\
    \ performance in GUI applications ensures smooth user experience, faster load\
    \ times, and improved efficiency. Performance bottlenecks in JavaScript-based\
    \ UIs can result in laggy interfaces, slow rendering, excessive re-renders, and\
    \ memory leaks. In this chapter, we will explore techniques for identifying bottlenecks\
    \ and optimizing React applications using memoization and lazy loading.\n\n##\
    \ 10.1 Identifying Bottlenecks in JavaScript GUI Performance\n\n### Common JavaScript\
    \ GUI Performance Issues\n\n1. **Unnecessary Repaints and Reflows** – Frequent\
    \ DOM changes slow down the UI.\n2. **Excessive Re-Renders in React Components**\
    \ – Causes UI lag and memory leaks.\n3. **Blocking JavaScript Execution** – Large\
    \ synchronous tasks freeze the UI.\n4. **Inefficient API Calls** – Unoptimized\
    \ network requests slow down data fetching.\n5. **Large JavaScript Bundles** –\
    \ Increases page load time.\n\n### Using Browser Developer Tools to Identify Bottlenecks\n\
    \nMost performance bottlenecks can be detected using Chrome DevTools, `Lighthouse`,\
    \ and `React DevTools`.\n\n#### 1. Chrome DevTools – Performance Tab\n\nTo measure\
    \ UI performance:\n1. Open Chrome DevTools (`F12` or `Ctrl + Shift + I`).\n2.\
    \ Navigate to the `Performance` tab.\n3. Click `Record`, interact with the UI,\
    \ and analyze slow rendering operations.\n\nLook for:\n- Long-running tasks (main\
    \ thread blocked).\n- Excessive layout shifts (reflows).\n- Heavy JavaScript execution\
    \ causing UI lag.\n\n#### 2. React DevTools – Highlighting Unnecessary Renders\n\
    \nReact DevTools helps in identifying unnecessary re-renders:\n1. Install React\
    \ DevTools in Chrome.\n2. Open the `Profiler` tab.\n3. Click \"Record\", interact\
    \ with the UI, and check components that re-render unnecessarily.\n\nOptimization\
    \ Tip: Use `React.memo()` to prevent re-renders.\n\n#### 3. Lighthouse – Measuring\
    \ Page Speed and JavaScript Performance\n\n`Lighthouse` is a built-in performance\
    \ auditing tool in Chrome.\n\nTo run Lighthouse:\n1. Open Chrome DevTools > Go\
    \ to the `Lighthouse` tab.\n2. Select `Performance` and click `Generate Report`.\n\
    3. Review areas needing improvement (JavaScript execution time, render-blocking\
    \ resources, etc.).\n\n### Key Performance Metrics to Monitor\n\n| Metric | Description\
    \ | Ideal Value |\n"
  raw: 'Easier to read and maintain  than .then()  chains.


    * * *


    ## Handling Asynchronous UI Updates in React


    In React, UI updates should not block rendering . The useEffect()  hook is commonly
    used to handle API calls without freezing the UI .


    #### Example: Fetching Data with useEffect()


    jsx


    CopyEdit


    import React, { useState, useEffect } from "react";


    function UserList() {


    const [users, setUsers] = useState([]);


    const [loading, setLoading] = useState(true);


    useEffect(() => {


    fetch("https://jsonplaceholder.typicode.com/users")


    .then(response => response.json())


    .then(data => {


    setUsers(data);


    setLoading(false);


    });


    }, []);


    return loading ? <p>Loading...</p> : <ul>{users.map(user => <li key={user.id}>{user.name}</li>)}</ul>;


    }


    Handles API fetching without blocking rendering.


    Displays loading state until data is available.


    * * *


    ## Optimizing Asynchronous UI Updates


    ​1\. ​ Use Skeleton Screens:  Show placeholders while data loads.


    ​2\. ​ Cache Data:  Avoid unnecessary API calls (e.g., localStorage).


    ​3\. ​ Debounce Input Requests:  For real-time search fields, prevent excessive
    API requests.


    * * *


    # 9.4 WebSockets for Real-Time GUI Updates


    ## Introduction to WebSockets


    WebSockets enable bi-directional communication  between the client and the server,
    allowing real-time updates without polling.


    ### Why Use WebSockets?


    Push updates instantly  (e.g., chat apps, stock tickers).


    More efficient than polling  (reduces unnecessary requests).


    Persistent connection between client and server.


    * * *


    ## Setting Up WebSockets in JavaScript


    The WebSocket API enables real-time data transfer.


    #### Example: Establishing a WebSocket Connection


    javascript


    CopyEdit


    const socket = new WebSocket("wss://example.com/socket");


    socket.onopen = () => {


    console.log("WebSocket connection established");


    };


    socket.onmessage = (event) => {


    console.log("Received:", event.data);


    };


    socket.onclose = () => {


    console.log("WebSocket connection closed");


    };


    Efficiently updates UI when new data arrives.


    * * *


    ## Implementing WebSockets in React


    Using React and WebSockets , we can update the UI in real time.


    #### Example: Real-Time Chat UI with WebSockets


    jsx


    CopyEdit


    import React, { useState, useEffect } from "react";


    function ChatApp() {


    const [messages, setMessages] = useState([]);


    const socket = new WebSocket("wss://example.com/chat");


    useEffect(() => {


    socket.onmessage = (event) => {


    setMessages(prevMessages => [...prevMessages, event.data]);


    };


    return () => socket.close();


    }, []);


    return (


    <ul>


    {messages.map((msg, index) => <li key={index}>{msg}</li>)}


    </ul>


    );


    }


    export default ChatApp;


    Messages update instantly as they arrive.


    ## Use Cases for WebSockets


    ​● ​ Chat applications  (e.g., WhatsApp Web).


    ​● ​ Live notifications  (e.g., real-time alerts).


    ​● ​ Stock market tracking  (e.g., real-time price updates).


    * * *


    # 9.5 Implementing CRUD Operations in React


    ## Understanding CRUD in GUI Applications


    CRUD ( Create, Read, Update, Delete ) operations allow applications to manage
    data dynamically .


    | Operation | HTTP Method | Example Endpoint |


    | Create | POST | /users |


    | Read | GET | /users/:id |


    | Update | PUT  or PATCH | /users/:id |


    | Delete | DELETE | /users/:id |


    * * *


    ## Implementing CRUD in React


    Using React Hooks ( useState , useEffect ) and axios , we can implement CRUD operations.


    ### 1\. Fetching Data (Read)


    jsx


    CopyEdit


    import React, { useState, useEffect } from "react";


    import axios from "axios";


    function UserList() {


    const [users, setUsers] = useState([]);


    useEffect(() => {


    axios.get("https://jsonplaceholder.typicode.com/users")


    .then(response => setUsers(response.data));


    }, []);


    return (


    <ul>


    {users.map(user => <li key={user.id}>{user.name}</li>)}


    </ul>


    );


    }


    export default UserList;


    Displays a list of users from an API.


    ### 2. Creating a New User (Create)


    jsx


    CopyEdit


    function CreateUser() {


    const [name, setName] = useState("");


    const handleSubmit = (event) => {


    event.preventDefault();


    axios.post("https://jsonplaceholder.typicode.com/users", { name })


    .then(response => console.log("User created:", response.data));


    };


    return (


    <form onSubmit={handleSubmit}>


    <input type="text" value={name} onChange={e => setName(e.target.value)} />


    <button type="submit">Add User</button>


    </form>


    );


    }


    Creates a new user and sends data to the server.


    * * *


    ### 3. Updating User Data (Update)


    jsx


    CopyEdit


    function UpdateUser({ userId }) {


    const [name, setName] = useState("");


    const handleUpdate = () => {


    axios.put(`https://jsonplaceholder.typicode.com/users/${userId}`, { name })


    .then(response => console.log("User updated:", response.data));


    };


    return (


    <div>


    <input type="text" value={name} onChange={e => setName(e.target.value)} />


    <button onClick={handleUpdate}>Update User</button>


    </div>


    );


    }


    Updates user data on the server.


    * * *


    ### 4\. Deleting a User (Delete)


    jsx


    CopyEdit


    function DeleteUser({ userId }) {


    const handleDelete = () => {


    axios.delete(`https://jsonplaceholder.typicode.com/users/${userId}`)


    .then(() => console.log("User deleted"));


    };


    return <button onClick={handleDelete}>Delete</button>;


    }


    Removes a user from the database.


    * * *


    ​● ​ Asynchronous UI updates ensure smooth data fetching without blocking rendering.


    ​● ​ WebSockets enable real-time updates in applications.


    ​● ​ CRUD operations allow applications to create, read, update, and delete data
    dynamically.


    By implementing these concepts, developers can build highly dynamic, real-time,
    and interactive GUI applications  with React.


    # Chapter 10


    # Performance Optimization in GUI Development


    Optimizing performance in GUI applications ensures smooth user experience, faster
    load times, and improved efficiency . Performance bottlenecks in JavaScript-based
    UIs can result in laggy interfaces, slow rendering, excessive re-renders, and
    memory leaks . In this chapter, we will explore techniques for identifying bottlenecks
    and optimizing React applications using memoization and lazy loading .


    * * *


    ## 10.1 Identifying Bottlenecks in JavaScript GUI Performance


    ### Common JavaScript GUI Performance Issues


    ​1\. ​ Unnecessary Repaints and Reflows  – Frequent DOM changes slow down the
    UI.


    ​2\. ​ Excessive Re-Renders in React Components  – Causes UI lag and memory leaks.


    ​3\. ​ Blocking JavaScript Execution  – Large synchronous tasks freeze the UI.


    ​4\. ​ Inefficient API Calls  – Unoptimized network requests slow down data fetching.


    ​5\. ​ Large JavaScript Bundles  – Increases page load time.


    * * *


    ### Using Browser Developer Tools to Identify Bottlenecks


    Most performance bottlenecks can be detected using Chrome DevTools, Lighthouse,
    and React DevTools .


    #### 1. Chrome DevTools – Performance Tab


    To measure UI performance:


    ​1\. ​ Open Chrome DevTools  ( F12  or Ctrl + Shift + I ).


    ​2\. ​ Navigate to the Performance  tab.


    ​3\. ​ Click Record , interact with the UI, and analyze slow rendering operations.


    Look for:


    ​● ​ Long-running tasks  (main thread blocked).


    ​● ​ Excessive layout shifts (reflows) .


    ​● ​ Heavy JavaScript execution causing UI lag .


    * * *


    #### 2. React DevTools – Highlighting Unnecessary Renders


    React DevTools helps in identifying unnecessary re-renders :


    ​1\. ​ Install React DevTools  in Chrome.


    ​2\. ​ Open the Profiler  tab.


    ​3\. ​ Click "Record" , interact with the UI, and check components that re-render
    unnecessarily.


    Optimization Tip:  Use React.memo()  to prevent re-renders.


    * * *


    #### 3. Lighthouse – Measuring Page Speed and JavaScript Performance


    Lighthouse is a built-in performance auditing tool in Chrome.


    To run Lighthouse :


    ​1\. ​ Open Chrome DevTools  > Go to the Lighthouse  tab.


    ​2\. ​ Select Performance  and click Generate Report .


    ​3\. ​ Review areas needing improvement ( JavaScript execution time, render-blocking
    resources, etc. ).


