  trans: "\n\nStyled Components 在 React 应用中处理基于组件的样式效果最好，而传统的 CSS 则更适合全局样式和布局管理。\n\
    \n- 像 `Bootstrap`、`Tailwind` 和 `Material UI` 等 CSS 框架简化了 GUI 设计。\n- Styled Components\
    \ 为 React 提供了组件作用域和动态的样式方法。\n- 选择正确的样式方法取决于项目规模、复杂性和可维护性。\n\n使用最佳样式实践可以确保 GUI\
    \ 应用是响应式的、可扩展的且易维护的。\n\n# 6.4 用于组件样式的 CSS-in-JS 和 Emotion.js\n\n## CSS-in-JS 简介\n\
    \nCSS-in-JS 是一种现代的样式方法，允许直接在 JavaScript 文件中编写 CSS，通常位于 React 组件内部。这种方法消除了全局作用域冲突，实现了动态样式，并通过将样式限制在特定组件内提升了可维护性。\n\
    \n### 为什么使用 CSS-in-JS？\n\n- **封装**：样式作用限于组件，避免了冲突。\n- **动态样式**：样式可以根据 `props`、`state`\
    \ 或 `theme` 设置发生变化。\n- **无需独立的样式表**：减少了对外部 `.css` 文件的需求。\n- **性能优化**：仅在需要时应用 CSS，防止产生不必要的开销。\n\
    \n### 流行的 CSS-in-JS 库\n\n| 库 | 特性 | 最佳用例 |\n| :--- | :--- | :--- |\n| Styled Components\
    \ | 标签模板字符串、基于 prop 的样式 | React 中基于组件的样式 |\n| Emotion.js | 优化的样式、强大的主题、灵活的 CSS-in-JS\
    \ | 动态且可扩展的主题 |\n| JSS (CSS-in-JS) | 内联样式、作用域选择器、支持原生 JS | 原生 JS 样式需求 |\n\n虽然\
    \ `Styled Components` 是一种流行的 CSS-in-JS 解决方案，但 `Emotion.js` 提供了一个高度灵活、高性能且可扩展的样式系统，使其大型\
    \ React 应用的理想选择。\n\n## Emotion.js 简介\n\nEmotion.js 是一个强大的 CSS-in-JS 库，为 React\
    \ 和 JavaScript 应用提供了灵活的样式解决方案。它允许开发者：\n\n- 使用 JavaScript 对象或模板字符串编写样式。\n- 根据 `props`\
    \ 和 `themes` 动态更改样式。\n- 通过避免不必要的重新渲染来优化性能。\n\n### 安装 Emotion.js\n\n```sh\nnpm\
    \ install @emotion/react @emotion/styled\n```\n\n### 使用 Emotion.js 进行组件样式设计\n\n\
    Emotion 支持两种组件样式的主要方式：\n\n1. Styled Components 方法\n2. CSS Prop 方法\n\n### 1. Styled\
    \ Components 方法\n\n这种方法与 `Styled Components` 类似，但使用的是 `Emotion` 的 API。\n\n####\
    \ 示例：带有动态样式的按钮\n\n```jsx\nimport styled from \"@emotion/styled\";\n\nconst Button\
    \ = styled.button`\nbackground-color: ${(props) => (props.primary ? \"blue\" :\
    \ \"gray\")};\ncolor: white;\npadding: 10px 20px;\nborder: none;\nborder-radius:\
    \ 5px;\ncursor: pointer;\nfont-size: 16px;\n&:hover {\nbackground-color: ${(props)\
    \ => (props.primary ? \"darkblue\" : \"darkgray\")};\n}\n`;\n\nfunction App()\
    \ {\n  return (\n    <div>\n      <Button primary>主按钮</Button>\n      <Button>次按钮</Button>\n\
    \    </div>\n  );\n}\n\nexport default App;\n```\n\n### 为什么在 Emotion 中使用 Styled\
    \ Components？\n\n- **封装的样式**：防止 CSS 泄漏。\n- **动态 Props**：样式根据组件 `props` 变化。\n-\
    \ **响应式设计**：可以直接使用 `media queries`。\n\n### 2. CSS Prop 方法\n\nEmotion 允许使用 `css`\
    \ `prop` 来定义内联样式，而无需创建单独的样式组件。\n\n#### 示例：使用 CSS Prop\n\n```jsx\n/** @jsxImportSource\
    \ @emotion/react */\nimport { css } from \"@emotion/react\";\n\nconst buttonStyle\
    \ = css`\nbackground-color: green;\ncolor: white;\npadding: 12px;\nborder: none;\n\
    cursor: pointer;\n&:hover {\nbackground-color: darkgreen;\n}\n`;\n\nfunction App()\
    \ {\n  return <button css={buttonStyle}>点击我</button>;\n}\n\nexport default App;\n\
    ```\n\n### 使用 CSS Prop 的优势\n\n- **代码少** – 无需创建单独的样式组件。\n- **更灵活** – 可以轻松直接将样式应用到\
    \ `JSX`。\n- **支持动态样式** – 可与 `props` 和 `state` 使用。\n\n## Emotion.js vs. Styled\
    \ Components：选择哪一个？\n\n| 特性 | Emotion.js | Styled Components |\n| :--- | :---\
    \ | :--- |\n| 性能 | 渲染更快且样式经过优化 | 销销略大 |\n| 主题支持 | 优秀 | 良好 |\n| CSS Prop 支持 | |\
    \ |\n| 基于组件的样式 | | |\n\n### 何时使用 Emotion.js？\n\n- 用于渲染速度敏感的高性能应用。\n- 当需要动态主题时（例如：深色模式、用户自定义主题）。\n\
    - 当同时使用基于 JavaScript 对象的样式和样式组件时。\n\nEmotion.js 提供了两者的结合——一个具有高性能和极佳灵活性的强大 CSS-in-JS\
    \ 解决方案。\n\n# 6.5 动态主题和深色模式实现\n\n## 什么是 GUI 中的主题（Theming）？\n\n主题是指根据用户偏好或系统设置动态更改应用的视觉外观。最常见的用例是深色模式，即\
    \ `UI` 在亮色和深色配色方案之间切换。\n\n### 为什么要实现主题？\n\n- **提高无障碍性**：深色模式在低光环境下可减少眼睛疲劳。\n-\
    \ **增强用户体验**：用户可以根据自己的偏好自定义 `UI`。\n\n*** 实现主题的方法\n\n有多种方法可以在 GUI 中实现动态主题：\n\n\
    1. 使用 CSS 变量\n2. 使用 Context API\n3. 使用 Emotion.js 或 Styled Components\n\n### 1.\
    \ 使用 CSS 变量实现主题\n\nCSS 变量允许在亮色和深色之间切换。\n\n#### 步骤 1：定义 CSS 变量\n\n```css\n:root\
    \ {\n--bg-color: white;\n--text-color: black;\n}\n[data-theme=\"dark\"] {\n--bg-color:\
    \ black;\n--text-color: white;\n}\nbody {\nbackground-color: var(--bg-color);\n\
    color: var(--text-color);\n}\n```\n\n#### 步骤 2：使用 JavaScript 切换主题\n\n```javascript\n\
    function toggleTheme() {\n  const currentTheme = document.documentElement.getAttribute(\"\
    data-theme\");\n  document.documentElement.setAttribute(\n    \"data-theme\",\n\
    \    currentTheme === \"dark\" ? \"light\" : \"dark\"\n  );\n}\n```\n**优点**：简单高效。\n\
    **缺点**：无法直接在 JavaScript 样式中使用。\n\n### 2. 使用 Context API 实现主题\n\n对于 React 应用，我们可以使用\
    \ `Context` 全局管理主题。\n\n#### 步骤 1：创建主题上下文\n\n```jsx\nimport React, { createContext,\
    \ useState, useContext } from \"react\";\n\nconst ThemeContext = createContext();\n\
    \nexport function ThemeProvider({ children }) {\n  const [theme, setTheme] = useState(\"\
    light\");\n\n  function toggleTheme() {\n    setTheme((prevTheme) => (prevTheme\
    \ === \"light\" ? \"dark\" : \"light\"));\n  }\n\n  return (\n    <ThemeContext.Provider\
    \ value={{ theme, toggleTheme }}>\n      {children}\n    </ThemeContext.Provider>\n\
    \  );\n}\n\nexport function useTheme() {\n  return useContext(ThemeContext);\n\
    }\n```\n\n#### 步骤 2：在组件中使用主题\n\n```jsx\nfunction App() {\n  const { theme, toggleTheme\
    \ } = useTheme();\n  return (\n    <div style={{ backgroundColor: theme === \"\
    dark\" ? \"black\" : \"white\" }}>\n      <button onClick={toggleTheme}>切换主题</button>\n\
    \    </div>\n  );\n}\n```\n**优点**：跨组件无缝工作。\n**缺点**：需要额外的设置和重新渲染。\n\n### 3. 使用\
    \ Emotion.js 实现主题\n\nEmotion.js 拥有内置的主题支持，可以轻松地切换样式。\n\n#### 步骤 1：定义主题对象\n\n```jsx\n\
    import { ThemeProvider } from \"@emotion/react\";\n\nconst lightTheme = {\n  bg:\
    \ \"white\",\n  text: \"black\",\n};\n\nconst darkTheme = {\n  bg: \"black\",\n\
    \  text: \"white\",\n};\n```\n\n#### 步骤 2：在组件中使用主题\n\n```jsx\nimport styled from\
    \ \"@emotion/styled\";\nimport { useState } from \"react\";\n\nconst Container\
    \ = styled.div`\nbackground-color: ${(props) => props.theme.bg};\ncolor: ${(props)\
    \ => props.theme.text};\npadding: 20px;\n`;\n```\n\n"
