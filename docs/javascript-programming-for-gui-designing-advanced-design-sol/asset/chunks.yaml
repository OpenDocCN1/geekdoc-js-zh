    ### 1\. Why Use WebSockets?


    Unlike HTTP requests, WebSockets establish a persistent connection , enabling
    real-time messaging without polling the server .


    Advantages of WebSockets:


    ​● ​ Instant message delivery  (no delays like HTTP polling).


    ​● ​ Efficient data transfer  (reduces bandwidth usage).


