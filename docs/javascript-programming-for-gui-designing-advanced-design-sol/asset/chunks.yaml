  trans: "\n\n| 首次内容绘制 (FCP) | 渲染第一个可见元素所需的时间 | < 1.8s |\n| :--- | :--- | :--- |\n\
    | 可交互时间 (TTI) | 用户交互产生响应之前的时间 | < 5s |\n| JavaScript 执行时间 | 页面加载时 JavaScript 运行所需的时间\
    \ | 尽可能减少 |\n| 组件重新渲染时间 | React 组件重新渲染所需的时间 | 保持每帧低于 16ms |\n\n一旦确定了瓶颈，下一步是使用记忆化（memoization）和懒加载（lazy\
    \ loading）优化 React 应用。\n\n* *\n\n## 10.2 使用 React 的记忆化和懒加载进行优化\n\n### 1. React\
    \ 记忆化：防止不必要的重新渲染\n\n在 React 中，任何状态（state）或 prop 的改变都会触发重新渲染。如果组件无必要的重新渲染，性能就会下降。\n\
    \n#### 防止不必要的重新渲染的技巧\n\n- `React.memo()` – 对函数组件进行记忆化。\n- `useMemo()` – 对高开销计算进行记忆化。\n\
    - `useCallback()` – 对函数进行记忆化，避免在每次渲染时重新创建它们。\n\n* *\n\n### 使用 `React.memo()` 优化组件渲染\n\
    \n`React.memo()` 如果其 props 没有发生变化，则防止组件重新渲染。\n\n#### 示例：不使用 `React.memo()`（不必要的重新渲染）\n\
    \n```jsx\nfunction ChildComponent({ name }) {\n  console.log(\"Child Rendered!\"\
    );\n  return <p>Hello, {name}</p>;\n}\n\nfunction ParentComponent() {\n  const\
    \ [count, setCount] = useState(0);\n  return (\n    <div>\n      <button onClick={()\
    \ => setCount(count + 1)}>Increment</button>\n      <ChildComponent name=\"John\"\
    \ />\n    </div>\n  );\n}\n```\n\n问题：即使 `name` 从不改变，`ChildComponent` 也会重新渲染。\n\
    \n* *\n\n#### 使用 `React.memo()` 的优化版本\n\n```jsx\nimport React, { memo, useState\
    \ } from \"react\";\nconst ChildComponent = memo(({ name }) => {\n  console.log(\"\
    Child Rendered!\");\n  return <p>Hello, {name}</p>;\n});\n\nfunction ParentComponent()\
    \ {\n  const [count, setCount] = useState(0);\n  return (\n    <div>\n      <button\
    \ onClick={() => setCount(count + 1)}>Increment</button>\n      <ChildComponent\
    \ name=\"John\" />\n    </div>\n  );\n}\n```\n\n现在，只有当 `name` true 时，`ChildComponent`\
    \ 才会重新渲染。\n\n* *\n\n### 使用 `useMemo()` 进行高开销计算\n\n如果组件执行沉重计算，`useMemo()` 会缓存结果以避免在每次渲染时重新计算。\n\
    \n#### 示例：不使用 `useMemo()`（性能缓慢）\n\n```jsx\nfunction ExpensiveComponent({ num })\
    \ {\n  const result = Array.from({ length: 1e7 }, () => num).reduce((acc, val)\
    \ => acc + val, 0);\n  return <p>Computed: {result}</p>;\n}\n```\n\n问题：每次父组件重新渲染时计算都会运行，即使\
    \ `num` 没有改变。\n\n* *\n\n#### 使用 `useMemo()` 的优化版本\n\n```jsx\nimport React, { useMemo\
    \ } from \"react\";\nfunction ExpensiveComponent({ num }) {\n  const result =\
    \ useMemo(() => {\n    return Array.from({ length: 1e7 }, () => num).reduce((acc,\
    \ val) => acc + val, 0);\n  }, [num]);\n  return <p>Computed: {result}</p>;\n\
    }\n```\n\n现在，只有当 `num` 改变时计算才会运行。\n\n* *\n\n### 使用 `useCallback()` 缓存函数\n\n组件内部的每个函数每次渲染时都会重新创建，即使它们没有改变。\n\
    \n#### 示例：不使用 `useCallback()`（每次渲染都创建新函数）\n\n```jsx\nfunction ParentComponent()\
    \ {\n  const handleClick = () => console.log(\"Button Clicked\");\n  return <button\
    \ onClick={handleClick}>Click Me</button>;\n}\n```\n\n问题：`handleClick` 每次渲染都会重新创建，导致子组件重新渲染。\n\
    \n* *\n\n#### 使用 `useCallback()` 的优化版本\n\n```jsx\nimport React, { useCallback\
    \ } from \"react\";\nfunction ParentComponent() {\n  const handleClick = useCallback(()\
    \ => {\n    console.log(\"Button Clicked\");\n  }, []);\n  return <button onClick={handleClick}>Click\
    \ Me</button>;\n}\n```\n\n现在，`handleClick` 在不同渲染之间保持不变。\n\n* *\n\n### 2. 使用 `React.lazy()`\
    \ 懒加载组件\n\n预加载所有组件会增加页面加载时间。懒加载会将组件的加载推到需要时。\n\n#### 示例：懒加载组件\n\n```jsx\nimport\
    \ React, { Suspense, lazy } from \"react\";\nconst LazyComponent = lazy(() =>\
    \ import(\"./HeavyComponent\"));\nfunction App() {\n  return (\n    <Suspense\
    \ fallback={<p>Loading...</p>}>\n      <LazyComponent />\n    </Suspense>\n  );\n\
    }\n```\n\n通过按需加载组件提高性能。\n\n* *\n\n### 结论\n\n- 使用 Chrome DevTools 和 React Profiler\
    \ 识别瓶颈有助于优化 JavaScript 性能。\n- 记忆化（`React.memo()`、`useMemo()`、`useCallback()`）防止不必要的重新渲染。\n\
    - 懒加载（`React.lazy()`）通过推迟组件加载提高初始加载时间。\n\n通过实现这些优化技术，开发者可以显著增强 GUI 性能，确保 React\
    \ 应用的流畅和高效。\n\n# 10.3 为 GUI 性能优化图像和资源\n\n## GUI 开发中资源优化简介\n\n图像、字体和其他媒体资源在 GUI\
    \ 应用中起着重要作用，但如果不进行优化，它们会减慢加载速度并影响用户体验。资源优化确保应用程序快速加载。\n\n### 图像和资源的常见性能问题\n\n\
    1. 大图像文件——增加加载时间。\n2. 未优化的图像格式——并不总是高效的。\n3. 缺乏懒加载——增加了资源加载。\n4. 过多的 HTTP 请求——每个资源都需要单独请求。\n\
    5. 阻塞渲染的字体和样式表——延迟渲染。\n\n## 1. 选择正确的图像格式\n\n选择正确的图像格式可以显著减少文件大小。\n\n| 格式 | 适用场景\
    \ | 优点 | 缺点 |\n| :--- | :--- | :--- | :--- |\n| JPEG | 照片、大图像 | 广泛支持 | |\n| PNG\
    \ | 具有透明度的图形 | 质量高、支持透明 | 文件大小较大 |\n| WebP | 通用、网页图像 | 比 PNG 小 30%、高质量 | |\n|\
    \ AVIF | 下一代压缩 | 比 WebP 更优、体积最小 | 浏览器支持有限 |\n| SVG | 图标、插图 | 可缩放、无质量损失 | 不适合复杂图像\
    \ |\n\n为现代 Web 应用使用 WebP 或 AVIF。使用 SVG 处理矢量图形。\n\n#### 示例：在 HTML 中使用 WebP\n\n\
    ```html\n<picture>\n  <source srcset=\"image.webp\" type=\"image/webp\">\n  <img\
    \ src=\"image.jpg\" alt=\"优化图像\">\n</picture>\n```\n\n确保与不支持 WebP 的浏览器兼容。\n\n\
    * *\n\n## 2. 压缩技术\n\n在不损失质量的情况下缩小图像大小至关重要。\n\n### 推荐的压缩工具\n\n| 工具 | 用途 |\n| :---\
    \ | :--- |\n| TinyPNG | 压缩 PNG 和 JPEG |\n| Squoosh | 转换和压缩图像（支持 WebP, AVIF） |\n\
    | ImageMagick | 基于命令行批量图像处理 |\n| Cloudinary | Web 应用动态图像优化 |\n\n上传前使用 TinyPNG\
    \ 等工具。对于动态图像优化，使用 Cloudinary 或 Imgix。\n\n* *\n\n## 3. 为了性能懒加载图像\n\n懒加载在图像进入视口时延迟加载，减少初始加载时间。\n\
    \n#### 示例：HTML 中的原生懒加载\n\n```html\n<img src=\"image.jpg\" loading=\"lazy\" alt=\"\
    懒加载图像\">\n```\n\n减少带宽消耗。提升感知加载时间。\n\n## 4. 使用内容分发网络 (CDN)\n\nCDN 从距离用户最近的服务器缓存并交付图像和服务，减少延迟。\n\
    \n### 流行的 CDN 提供商\n\n- Cloudflare\n- AWS CloudFront\n- Google Cloud CDN\n\n使用\
    \ CDN 托管图像、字体和脚本。\n\n* *\n\n# 10.4 服务端渲染 (SSR) 与 客户端渲染 (CSR)\n\n## 理解 GUI 开发中的渲染\n\
    \n渲染决定了 UI 组件如何在 Web 应用中被处理和显示。主要有两种渲染方式：\n\n"
- fmt: "\n- Client-Side Rendering (CSR) – The browser fetches a minimal HTML page\
    \ and renders content dynamically using `JavaScript`.\n- Server-Side Rendering\
    \ (SSR) – The server generates the full HTML page before sending it to the browser.\n\
    \n## 1. Client-Side Rendering (CSR)\n\nIn `CSR`, `JavaScript` runs on the client\
    \ side to dynamically generate and update UI components.\n\n### Pros of CSR\n\
    - Faster initial page load since only the essential assets are loaded.\n- Smooth,\
    \ dynamic user interactions (ideal for SPAs - Single Page Applications).\n- Efficient\
    \ for applications with complex client-side logic.\n\n### Cons of CSR\n- Poor\
    \ SEO by default (search engines struggle with `JavaScript`-rendered content).\n\
    - Slow initial content rendering (blank page before `JavaScript` loads).\n\n####\
    \ Example: CSR in React\n\n```jsx\nimport React, { useState, useEffect } from\
    \ \"react\";\n\nfunction Users() {\n  const [users, setUsers] = useState([]);\n\
    \  useEffect(() => {\n    fetch(\"https://jsonplaceholder.typicode.com/users\"\
    )\n      .then(res => res.json())\n      .then(data => setUsers(data));\n  },\
    \ []);\n\n  return (\n    <ul>\n      {users.map(user => <li key={user.id}>{user.name}</li>)}\n\
    \    </ul>\n  );\n}\n```\n\nUI loads dynamically after the `JavaScript` bundle\
    \ is fetched.\n\n## 2. Server-Side Rendering (SSR)\n\nIn `SSR`, the server generates\
    \ the `HTML` before sending it to the client, improving SEO and performance.\n\
    \n### Pros of SSR\n- Faster initial load time (HTML is fully rendered before reaching\
    \ the browser).\n- SEO-friendly (search engines can crawl content easily).\n-\
    \ Improved performance on slow networks and devices.\n\n### Cons of SSR\n- Increased\
    \ server load (server must process every request).\n- Slower page transitions\
    \ compared to `CSR`.\n\n#### Example: SSR in Next.js\n\n```jsx\nimport React from\
    \ \"react\";\n\nexport async function getServerSideProps() {\n  const res = await\
    \ fetch(\"https://jsonplaceholder.typicode.com/users\");\n  const users = await\
    \ res.json();\n  return { props: { users } };\n}\n\nfunction Users({ users })\
    \ {\n  return (\n    <ul>\n      {users.map(user => <li key={user.id}>{user.name}</li>)}\n\
    \    </ul>\n  );\n}\n\nexport default Users;\n```\n\nHTML is pre-rendered on the\
    \ server, improving SEO.\n\n## 3. CSR vs. SSR: When to Use Which?\n\n| Factor\
    \ | CSR (Client-Side) | SSR (Server-Side) |\n| :--- | :--- | :--- |\n| SEO | Poor\
    \ | Excellent |\n| Initial Load Time | Slower | Faster |\n| Performance | Better\
    \ for interactive apps | Better for static content |\n| Server Load | Minimal\
    \ | Higher |\n\nUse `CSR` for interactive dashboards, real-time apps. Use `SSR`\
    \ for SEO-heavy sites (e.g., blogs, e-commerce).\n\n## 10.5 Profiling and Debugging\
    \ GUI Performance Issues\n\n### Tools for Profiling and Debugging\nOptimizing\
    \ performance requires profiling and debugging slow UI elements.\n\n### 1. Chrome\
    \ DevTools – Performance Profiling\n- Open `DevTools` (`F12`) > Navigate to the\
    \ `Performance` tab.\n- Click `Record` and interact with the UI.\n- Analyze paint\
    \ times, `JavaScript` execution, and layout shifts.\n- Detects slow scripts, excessive\
    \ repaints.\n\n### 2. React DevTools – Profiling Component Rendering\n- Open `React\
    \ DevTools` > Go to the `Profiler` tab.\n- Click `Record`, interact with the UI.\n\
    - Identify components that render too frequently.\n- Use `React.memo()` and `useMemo()`\
    \ to optimize slow components.\n\n### 3. Lighthouse – Measuring Page Speed\n-\
    \ Open `DevTools` > Go to the `Lighthouse` tab.\n- Run a performance audit.\n\
    - Identifies slow-loading assets, render-blocking scripts.\n\n## 4. Common GUI\
    \ Performance Fixes\n\n| Issue | Solution |\n| :--- | :--- |\n| Slow Image Loading\
    \ | Use `WebP`, lazy loading, CDN |\n| Heavy JavaScript Execution | Optimize functions,\
    \ use `Web Workers` |\n| Frequent Repaints & Reflows | Minimize DOM updates, batch\
    \ updates |\n| Large JavaScript Bundles | Code splitting, lazy loading |\n\n-\
    \ Optimize images using `WebP`, lazy loading, and `CDNs`.\n- Use `CSR` for dynamic\
    \ applications and `SSR` for SEO-focused apps.\n- Profile performance using `DevTools`,\
    \ `Lighthouse`, and `React Profiler`.\n\nBy implementing these techniques, developers\
    \ can ensure smooth, efficient, and high-performing GUI applications.\n\n# Chapter\
    \ 11: Enhancing Accessibility in GUI Design\n\n## 11.1 What is Web Accessibility?\n\
    \n### Introduction to Web Accessibility\nWeb accessibility ensures that all users,\
    \ including those with disabilities, can navigate, understand, and interact with\
    \ web applications effectively. It is an essential aspect of inclusive design,\
    \ enabling people with visual, auditory, motor, and cognitive impairments to use\
    \ digital interfaces without barriers.\n\n### Why is Web Accessibility Important?\n\
    - **Inclusivity**: Provides equal access to content and services for everyone.\n\
    - **Legal Compliance**: Many countries enforce accessibility laws, such as `ADA`\
    \ (Americans with Disabilities Act) and `WCAG` (Web Content Accessibility Guidelines).\n\
    - **Better User Experience**: Improves navigation, readability, and usability\
    \ for all users.\n- **SEO Benefits**: Search engines prioritize accessible websites.\n\
    \n### Understanding WCAG Guidelines\nThe Web Content Accessibility Guidelines\
    \ (`WCAG`) provide a framework for creating accessible web applications. `WCAG`\
    \ is built on four principles, known as `POUR`:\n\n| Principle | Description |\
    \ Example |\n| :--- | :--- | :--- |\n| Perceivable | Users must be able to perceive\
    \ information | Text alternatives for images, captions for videos |\n| Operable\
    \ | Users must be able to navigate and interact | Keyboard navigation, no time-dependent\
    \ content |\n| Understandable | Content should be easy to read and understand\
    \ | Clear instructions, readable fonts |\n| Robust | Works with assistive technologies\
    \ | Compatible with screen readers and browsers |\n\n`WCAG` Levels:\n- `A`: Basic\
    \ accessibility.\n- `AA`: Recommended standard (required for legal compliance\
    \ in many regions).\n- `AAA`: Highest level of accessibility.\n\n### Common Accessibility\
    \ Barriers in GUI Applications\n\n| Barrier | Impact | Solution |\n| :--- | :---\
    \ | :--- |\n| Lack of alt text for images | Screen readers can’t describe images\
    \ | Use `<img alt=\"Description\">` |\n| Poor color contrast | Difficult for visually\
    \ impaired users | Follow minimum contrast ratio (4.5:1) |\n| Non-semantic HTML\
    \ | Screen readers can’t interpret elements properly | Use proper `HTML5` semantic\
    \ elements |\n| Inaccessible forms | Users can’t navigate forms properly | Add\
    \ labels and focus indicators |\n\n### Basic Accessibility Best Practices\nUse\
    \ semantic `HTML` (`<button>`, `<nav>`, `<header>` instead of `<div>`). Provide\
    \ alternative text (`alt`) for images. Ensure sufficient color contrast. Make\
    \ content operable with a keyboard (no mouse required). Use `ARIA` attributes\
    \ for enhanced accessibility (covered in the next section).\n\n## 11.2 Implementing\
    \ ARIA for GUI\n\n### What is ARIA (Accessible Rich Internet Applications)?\n\
    `ARIA` (Accessible Rich Internet Applications) is a set of attributes that improve\
    \ accessibility when native `HTML` elements are not enough. `ARIA` helps assistive\
    \ technologies interpret complex UIs, such as modals, tooltips, and interactive\
    \ widgets.\n\n### ARIA Roles, Properties, and States\nARIAARIA attributes fall\
    \ into three main categories:\n1. **Roles**: Define the purpose of an element\
    \ (e.g., `alert`, `dialog`).\n2. **Properties**: Provide additional context (e.g.,\
    \ `aria-label`, `aria-labelledby`).\n3. **States**: Define UI changes (e.g., `aria-expanded`,\
    \ `aria-hidden`).\n\n### 1. ARIA Roles\n`ARIA` roles help define the function\
    \ of an element.\n\n| ARIA Role | Purpose | Example Usage |\n| :--- | :--- | :---\
    \ |\n| `role=\"alert\"` | Screen readers announce it as an alert | `<div role=\"\
    alert\">Error occurred!</div>` |\n| `role=\"dialog\"` | Defines a modal or popup\
    \ | `<div role=\"dialog\">Are you sure?</div>` |\n| `role=\"navigation\"` | Defines\
    \ navigation links | `<nav role=\"navigation\">...</nav>` |\n\nUse `ARIA` roles\
    \ when `HTML` elements don’t provide enough meaning.\n\n### 2. ARIA Properties\n\
    `ARIA` properties provide additional information about elements.\n\n| ARIA Property\
    \ | Usage | Example |\n| :--- | :--- | :--- |\n| `aria-label` | Labels elements\
    \ without visible text | `<button aria-label=\"Close\">X</button>` |\n"
