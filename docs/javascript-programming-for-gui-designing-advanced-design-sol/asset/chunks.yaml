    \n***\n\n## 14.2 设置实时消息 WebSocket\n\n### 1. 为什么要使用 WebSocket？\n\n与 `HTTP` 请求不同，`WebSockets`\
    \ 建立了持久连接，无需轮询服务器即可实现实时消息。\n\n`WebSockets` 的优势：\n- 即时消息传递（没有 `HTTP` 延迟）。\n- 高效的数据传输（减少带宽消耗）。\n\
    - 支持多用户聊天应用。\n\n***\n\n### 2. 使用 Node.js 设置 WebSocket 服务器\n\n#### 步骤 1：安装依赖\n\n\
    ```sh\nmkdir chat-server\ncd chat-server\nnpm init -y\nnpm install express socket.io\n\
    ```\n\n#### 步骤 2：创建 WebSocket 服务器\n\n`server.js`\n\n```javascript\nconst express\
    \ = require(\"express\");\nconst http = require(\"http\");\nconst { Server } =\
    \ require(\"socket.io\");\nconst cors = require(\"cors\");\n\nconst app = express();\n\
    app.use(cors());\n\nconst server = http.createServer(app);\nconst io = new Server(server,\
    \ { origin: \"*\" });\n\nio.on(\"connection\", (socket) => {\n  console.log(\"\
    User connected:\", socket.id);\n  socket.on(\"sendMessage\", (message) => {\n\
    \    // 向所有用户广播\n    io.emit(\"receiveMessage\", message);\n  });\n  socket.on(\"\
    disconnect\", () => {\n    console.log(\"User disconnected:\", socket.id);\n \
    \ });\n});\n\nserver.listen(5000, () => console.log(\"Server running on port 5000\"\
    ));\n```\n\n消息广播。\n\n***\n\n### 3. 在 React 中连接 WebSocket\n\n#### 步骤 1：安装客户端\n\n\
    ```sh\nnpm install socket.io-client\n```\n\n#### 步骤 2：修改组件使用 WebSocket\n\n`ChatWindow.js`\n\
    \n```jsx\nimport React, { useState, useEffect } from \"react\";\nimport { Box,\
    \ TextField, List, ListItem, ListItemText } from \"@mui/material\";\nimport {\
    \ io } from \"socket.io-client\";\n\nconst socket = io(\"http://localhost:5000\"\
    );\n\nfunction ChatWindow() {\n  const [messages, setMessages] = useState([]);\n\
    \  const [message, setMessage] = useState(\"\");\n\n  useEffect(() => {\n    socket.on(\"\
    receiveMessage\", (msg) => {\n      setMessages((prev) => [...prev, msg]);\n \
    \   });\n    return () => {\n      socket.off(\"receiveMessage\");\n    };\n \
    \ }, []);\n\n  const sendMessage = () => {\n    if (message.trim() !== \"\") {\n\
    \      const msgData = { text: message, sender: \"You\" };\n      socket.emit(\"\
    sendMessage\", msgData);\n      setMessages((prev) => [...prev, msgData]);\n \
    \     setMessage(\"\");\n    }\n  };\n\n  return (\n    <Box width=\"400px\" height=\"\
    500px\" border=\"1px solid #ccc\" borderRadius=\"8px\" p={2} display=\"flex\"\
    \ flexDirection=\"column\">\n      <List style={{ flex: 1, overflowY: \"auto\"\
    \ }}>\n        {messages.map((msg, index) => (\n          <ListItem key={index}>\n\
    \            <ListItemText primary={msg.text} secondary={msg.sender} />\n    \
    \      </ListItem>\n        ))}\n      </List>\n      <Box display=\"flex\">\n\
    \        <TextField fullWidth value={message} onChange={(e) => setMessage(e.target.value)}\
    \ placeholder=\"Type a message...\" />\n        <Button onClick={sendMessage}\
    \ variant=\"contained\">Send</Button>\n      </Box>\n    </Box>\n  );\n}\n\nexport\
    \ default ChatWindow;\n```\n\n现在消息可以实时发送和接收！\n\n***\n\n## 14.3 实现用户认证与状态检测\n\n\
    ### 1. 添加用户认证\n\n#### 步骤 1：安装 Firebase\n\n```sh\nnpm install firebase\n```\n\n\
    #### 步骤 2：初始化 Firebase\n\n`firebaseConfig.js`\n\n```javascript\nimport { initializeApp\
    \ } from \"firebase/app\";\nimport { getAuth, signInWithPopup, GoogleAuthProvider\
    \ } from \"firebase/auth\";\n\nconst firebaseConfig = { /* 添加 Firebase 凭据 */ };\n\
    const app = initializeApp(firebaseConfig);\nconst auth = getAuth(app);\nconst\
    \ provider = new GoogleAuthProvider();\nexport { auth, provider, signInWithPopup\
    \ };\n```\n\n#### 步骤 3：创建登录组件\n\n`Login.js`\n\n```jsx\nimport React from \"react\"\
    ;\nimport { auth, provider, signInWithPopup } from \"../firebaseConfig\";\n\n\
    function Login({ setUser }) {\n  const login = () => {\n    signInWithPopup(auth,\
    \ provider).then((result) => {\n      setUser(result.user);\n    });\n  };\n \
    \ return <button onClick={login}>使用 Google 登录</button>;\n}\nexport default Login;\n\
    ```\n\n现在用户可以使用 Google 登录了。\n\n***\n\n### 2. 使用 WebSocket 检测在线用户\n\n修改 WebSocket\
    \ 服务器以跟踪用户：\n\n```javascript\nconst users = new Set();\n\nio.on(\"connection\"\
    , (socket) => {\n  users.add(socket.id);\n  io.emit(\"updateUsers\", Array.from(users));\n\
    \n  socket.on(\"disconnect\", () => {\n    users.delete(socket.id);\n    io.emit(\"\
    updateUsers\", Array.from(users));\n  });\n});\n```\n\n现在应用可以跟踪在线用户！\n\n***\n\n\
    ## 14.4 使用 React Context 优化聊天性能\n\n### 聊天中的状态管理简介\n\n聊天应用程序不断更新消息、用户状态和 UI 状态。状态管理面临挑战：\n\
    - 频繁的重新渲染可能会降低性能。\n- 全局状态共享困难。\n- 认证和状态检测应该是可访问的。\n\n解决方案：使用 React Context\n\n\
    - 提供全局状态管理，避免属性层层传递（prop drilling）。\n- 高效更新特定组件。\n- 通过隔离状态变化来减少重新渲染。\n\n### 1.\
    \ 设置 React Context\n\n`ChatContext.js`\n\n```jsx\nimport React, { createContext,\
    \ useState, useEffect } from \"react\";\nimport { io } from \"socket.io-client\"\
    ;\n\nconst socket = io(\"http://localhost:5000\");\n\nexport const ChatContext\
    \ = createContext();\n\nexport function ChatProvider({ children }) {\n  const\
    \ [user, setUser] = useState(null);\n  const [messages, setMessages] = useState([]);\n\
    \  const [onlineUsers, setOnlineUsers] = useState([]);\n\n  useEffect(() => {\n\
    \    socket.on(\"receiveMessage\", (message) => {\n      setMessages((prev) =>\
    \ [...prev, message]);\n    });\n    socket.on(\"updateUsers\", (users) => {\n\
    \      setOnlineUsers(users);\n    });\n    return () => {\n      socket.off(\"\
    receiveMessage\");\n      socket.off(\"updateUsers\");\n    };\n  }, []);\n\n\
    \  const sendMessage = (message) => {\n    const msgData = { text: message, sender:\
    \ user?.displayName || \"Guest\" };\n    socket.emit(\"sendMessage\", msgData);\n\
    \    setMessages((prev) => [...prev, msgData]);\n  };\n\n  return (\n    <ChatContext.Provider\
    \ value={{ user, setUser, messages, sendMessage, onlineUsers }}>\n      {children}\n\
    \    </ChatContext.Provider>\n  );\n}\n```\n\n高效管理全局聊天状态。避免了不必要的属性传递。\n\n### 步骤\
    \ 2：用 Chat Context 包裹 App\n\n修改 `App.js` 以包含 `ChatProvider`:\n\n```jsx\nimport\
    \ React from \"react\";\nimport { ChatProvider } from \"./ChatContext\";\nimport\
    \ ChatWindow from \"./components/ChatWindow\";\nimport Login from \"./components/Login\"\
    ;\n\nfunction App() {\n  return (\n    <ChatProvider>\n      <Login />\n     \
    \ <ChatWindow />\n    </ChatProvider>\n  );\n}\n\nexport default App;\n```\n\n\
    现在所有组件都可以通过 `ChatContext` 访问聊天状态。\n\n### 步骤 3：在聊天窗口中使用 Context\n\n修改 `ChatWindow.js`:\n\
    \n"
