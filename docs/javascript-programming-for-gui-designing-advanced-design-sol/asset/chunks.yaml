  trans: "\n\n```javascript\nconst [isDark, setIsDark] = useState(false);\n\nreturn\
    \ (\n  <ThemeProvider theme={isDark ? darkTheme : lightTheme}>\n    <Container>\n\
    \      <button onClick={() => setIsDark(!isDark)}>Toggle Theme</button>\n    </Container>\n\
    \  </ThemeProvider>\n);\n}\n\nexport default App;\n```\n\n优点：在 styled components\
    \ 中原生工作。\n\n缺点：需要 `Emotion.js` 依赖。\n\n- `Emotion.js` 是一个强大的 CSS-in-JS 库，允许基于组件的样式化。\n\
    - 动态主题可以使用 CSS 变量、`React Context` 或 `Emotion.js` 实现。\n- 选择正确的主方案取决于项目的规模、复杂性和性能需求。\n\
    \n通过这些技术，开发者可以创建视觉吸引力、感知主题且支持自定义样式和深模式的 GUI 应用程序。\n\n# 第 7 章：创建动态和交互式 UI\n\n现代\
    \ Web 应用需要动态且交互式的用户界面 (UI)，能够实时响应用户操作。本章将探索基于组件的设计、事件处理以及在 `JavaScript` 和 `React`\
    \ 中管理用户输入，确保交互流畅、引人入胜且高效。\n\n## 7.1 基于组件的设计概念\n\n### 组件化 UI 设计简介\n\n基于组件的设计是一种构建用户界面的模块化方法，将\
    \ UI 元素拆分为独立的、可重用的组件。这种方法改进了 Web 开发中的可维护性、可扩展性和可重用性。\n\n**为什么使用基于组件的设计？**\n- **可重用性**：组件可以在应用程序中多次使用。\n\
    - **可维护性**：更容易调试和更新单个组件。\n- **可扩展性**：允许团队独立地处理不同的 UI 组件。\n- **性能优化**：当数据变化时，只有必要的组件会更新。\n\
    \n### 组件化设计的核心原则\n\n1. **封装**：每个组件管理自己的逻辑和 UI，而不影响其他组件。\n2. **可重用性**：组件应该是模块化的且自适应的，以便跨项目重用。\n\
    3. **组合**：通过组合较小的组件构建复杂的 UI。\n4. **状态管理**：组件应高效地处理状态以优化性能。\n\n### JavaScript 中的组件化\
    \ UI\n\n即使在 `Vanilla JavaScript` 中，开发者也可以使用函数创建一个基础的组件系统。\n\n#### 示例：创建一个可重用的\
    \ JavaScript 组件\n\n```javascript\nfunction createButton(label) {\n  const button\
    \ = document.createElement(\"button\");\n  button.innerText = label;\n  button.classList.add(\"\
    custom-button\");\n  return button;\n}\n\n// 使用\ndocument.body.appendChild(createButton(\"\
    Click Me\"));\n```\n\n虽然这种方法可行，但 `React` 提供了一种更强大、更有结构化的组件实现方式。\n\n### React 中的组件化\
    \ UI\n\n在 `React` 中，组件分为：\n\n1. **函数组件**（无状态或带有 hooks）。\n2. **类组件**（旧方法，已被 hooks\
    \ 替换）。\n\n#### 示例：React 函数组件\n\n```jsx\nfunction Button({ label }) {\n  return\
    \ <button className=\"custom-button\">{label}</button>;\n}\n\nexport default Button;\n\
    ```\n\n#### 使用 Button 组件\n\n```jsx\nimport Button from \"./Button\";\n\nfunction\
    \ App() {\n  return (\n    <div>\n      <Button label=\"Click Me\" />\n      <Button\
    \ label=\"Submit\" />\n    </div>\n  );\n}\n```\n\n| 特性 | Vanilla JavaScript |\
    \ React 组件化 UI |\n| :--- | :--- | :--- |\n| 可重用性 | 手动基于函数 | 内置组件重用 |\n| 封装性 |\
    \ 有限 | 完全封装的逻辑 |\n| 状态处理 | 需要事件监听器 | 内置的 `useState()` hook |\n| 渲染更新 | 手动 DOM\
    \ 更新 | 自动协调 |\n\n`React` 的组件化结构确保了高效且可扩展的 UI 架构。\n\n## 7.2 JavaScript 中的事件监听器和用户交互\n\
    \n### 理解事件监听器\n\n事件监听器检测用户操作（例如点击、键盘输入、鼠标移动）并相应执行预定义的函数。\n\n### JavaScript 中常见的事件监听器\n\
    \n| 事件 | 触发条件 | 使用用例 |\n| :--- | :--- | :--- |\n| `click` | 用户点击元素时 | 提交表单 |\n\
    | `mouseover` | 用户鼠标悬停在元素上时 | 显示提示框 |\n| `keydown` | 按下键时 | 在搜索栏中打字 |\n| `change`\
    \ | 输入字段变化时 | 验证用户输入 |\n| `submit` | 提交表单时 | 防止默认表单行为 |\n\n### 处理点击事件\n\n点击事件允许与按钮、链接和其他\
    \ UI 元素进行交互。\n\n#### 示例：处理点击事件\n\n```javascript\ndocument.getElementById(\"myButton\"\
    ).addEventListener(\"click\", function() {\n  alert(\"Button Clicked!\");\n});\n\
    ```\n\n当按钮被点击时，会弹出一个警告框。\n\n### 处理键盘事件\n\n键盘事件允许实时跟踪用户输入。\n\n#### 示例：检测按键\n\n\
    ```javascript\ndocument.addEventListener(\"keydown\", function(event) {\n  console.log(`Key\
    \ Pressed: ${event.key}`);\n});\n```\n\n当用户按下按键时，按键名称将记录在控制台中。\n\n### 处理输入事件\n\
    \n输入事件允许实时的表单验证。\n\n#### 示例：Textarea 中的实时字符计数\n\n```javascript\nconst textarea\
    \ = document.getElementById(\"commentBox\");\nconst counter = document.getElementById(\"\
    charCount\");\ntextarea.addEventListener(\"input\", function() {\n  counter.innerText\
    \ = `Characters: ${textarea.value.length}`;\n});\n```\n\n这会在用户打字时实时更新字符数。\n\n\
    ### 用于高效 UI 交互的事件委托\n\n与其为多个元素单独添加事件监听器，不如事件委托允许处理事件。\n\n#### 示例：列表上的事件委托\n\n\
    ```javascript\ndocument.getElementById(\"itemList\").addEventListener(\"click\"\
    , function(event) {\n  if (event.target.tagName === \"LI\") {\n    alert(`You\
    \ clicked: ${event.target.innerText}`);\n  }\n});\n```\n\n这种方法即使动态添加新项也能处理事件。\n\
    \n## 7.3 React 中处理用户输入和表单\n\n### React 中的表单\n\n`React` 中的表单与传统表单不同，因为 `React`\
    \ 组件使用状态来管理输入。\n\n### 使用 `useState()` 控制表单输入\n\n`React` 组件应该管理状态以确保交互流畅。\n\n####\
    \ 示例：受控输入框\n\n```jsx\nimport { useState } from \"react\";\n\nfunction Form() {\n\
    \  const [name, setName] = useState(\"\");\n  return (\n    <div>\n      <input\n\
    \        type=\"text\"\n        value={name}\n        onChange={(e) => setName(e.target.value)}\n\
    \      />\n      <p>Name: {name}</p>\n    </div>\n  );\n}\n```\n\n这确保了输入字段的实时更新。\n\
    \n### React 中的表单提交\n\n默认情况下，表单在提交时会刷新。阻止这种行为允许自定义处理。\n\n#### 示例：阻止默认表单提交\n\n```jsx\n\
    function Form() {\n  const [email, setEmail] = useState(\"\");\n  function handleSubmit(event)\
    \ {\n    event.preventDefault();\n    alert(`Email Submitted: ${email}`);\n  }\n\
    \  return (\n    <form onSubmit={handleSubmit}>\n      <input\n        type=\"\
    email\"\n        value={email}\n        onChange={(e) => setEmail(e.target.value)}\n\
    \      />\n      <button type=\"submit\">Submit</button>\n    </form>\n  );\n\
    }\n```\n\n`Form` 不刷新页面。`Email` 状态动态更新。\n\n### 处理多个表单输入\n\n与其管理多个 `useState()`\
    \ hook，不如使用单个状态对象跟踪所有的表单字段。\n\n#### 示例：处理多个字段\n\n```jsx\nfunction Form() {\n \
    \ const [formData, setFormData] = useState({ name: \"\", email: \"\" });\n  function\
    \ handleChange(event) {\n    setFormData({\n      ...formData,\n      [event.target.name]:\
    \ event.target.value,\n    });\n  }\n  return (\n    <form>\n      <input\n  \
    \      name=\"name\"\n        value={formData.name}\n        onChange={handleChange}\n\
    \        placeholder=\"Name\"\n      />\n      <input\n        name=\"email\"\n\
    \        value={formData.email}\n        onChange={handleChange}\n        placeholder=\"\
    Email\"\n      />\n      <button type=\"submit\">Submit</button>\n    </form>\n\
    \  );\n}\n```\n\n这种方法的优点是：\n- 简化了大型表单的状态管理。\n- 对于处理多个字段具有可扩展性。\n\n"
- fmt: "\n- Component-based design improves UI reusability and scalability.\n- JavaScript\
    \ event listeners enable interactive user experiences.\n- React’s `useState()`\
    \ hook simplifies form handling and state management.\n\nBy mastering these techniques,\
    \ developers can build dynamic, interactive, and efficient user interfaces that\
    \ enhance user experience and engagement.\n\n# 7.4 Validating User Input Using\
    \ JavaScript and React Hook Form\n\n## Introduction to User Input Validation\n\
    \nUser input validation ensures that the data entered by users is correct, secure,\
    \ and follows predefined rules before being processed. Proper validation helps:\n\
    \n- Prevent invalid or malicious data from entering the system.\n- Improve user\
    \ experience by providing instant feedback.\n- Reduce errors and security vulnerabilities,\
    \ such as SQL injection and XSS attacks.\n\nValidation can be performed:\n\n1.\
    \ Client-side (JavaScript or React) – Faster and provides instant feedback.\n\
    2. Server-side (Backend validation) – Ensures security by validating data before\
    \ processing.\n\n## 1. Validating User Input in Vanilla JavaScript\n\nBefore moving\
    \ to React, let’s explore basic JavaScript form validation.\n\n### Example: Validating\
    \ an Email Input\n\n```html\n<form id=\"userForm\">\n<input type=\"email\" id=\"\
    email\" placeholder=\"Enter your email\" />\n<span id=\"error-message\" style=\"\
    color: red;\"></span>\n<button type=\"submit\">Submit</button>\n</form>\n\n<script>\n\
    document.getElementById(\"userForm\").addEventListener(\"submit\", function(event)\
    \ {\nevent.preventDefault();\nconst email = document.getElementById(\"email\"\
    ).value;\nconst errorMessage = document.getElementById(\"error-message\");\nif\
    \ (!email.includes(\"@\") || !email.includes(\".\")) {\nerrorMessage.innerText\
    \ = \"Invalid email format!\";\n} else {\nerrorMessage.innerText = \"\";\nalert(\"\
    Form submitted successfully!\");\n}\n});\n</script>\n```\n\nInstant validation\
    \ without reloading the page. Not scalable for large forms.\n\n## 2. Validating\
    \ User Input in React\n\nIn React, handling validation manually for multiple fields\
    \ can be cumbersome. Instead, we use `React Hook Form` , a lightweight library\
    \ that simplifies form validation.\n\n### Why Use React Hook Form?\n\n- Optimized\
    \ Performance: Uses uncontrolled components, reducing re-renders.\n- Simplifies\
    \ Form Handling: Fewer `useState()` calls, leading to cleaner code.\n- Built-in\
    \ Validation: Works with `Yup` schema validation for complex forms.\n\n### 3.\
    \ Setting Up React Hook Form\n\nTo install React Hook Form, run:\n\n```sh\nnpm\
    \ install react-hook-form\n```\n\nThen, import it inside a React component:\n\n\
    ```jsx\nimport { useForm } from \"react-hook-form\";\n```\n\n### 4. Basic Validation\
    \ Using React Hook Form\n\nLet’s create a simple form with validation for name\
    \ and email.\n\n```jsx\nimport React from \"react\";\nimport { useForm } from\
    \ \"react-hook-form\";\n\nfunction UserForm() {\nconst {\n  register,\n  handleSubmit,\n\
    \  formState: { errors },\n} = useForm();\nconst onSubmit = (data) => {\nalert(JSON.stringify(data,\
    \ null, 2));\n};\n\nreturn (\n<form onSubmit={handleSubmit(onSubmit)}>\n<input\
    \ {...register(\"name\", { required: \"Name is required\" })} placeholder=\"Name\"\
    \ />\n{errors.name && <span style={{ color: \"red\" }}>{errors.name.message}</span>}\n\
    <input\n{...register(\"email\", {\nrequired: \"Email is required\",\npattern:\
    \ { value: /^\\S+@\\S+$/i, message: \"Invalid email format\" },\n})}\nplaceholder=\"\
    Email\"\n/>\n{errors.email && <span style={{ color: \"red\" }}>{errors.email.message}</span>}\n\
    <button type=\"submit\">Submit</button>\n</form>\n);\n}\nexport default UserForm;\n\
    ```\n\nPrevents submission if validation fails. Displays real-time error messages.\n\
    \n### 5. Advanced Validation Using Yup Schema\n\nReact Hook Form supports schema-based\
    \ validation using `Yup`.\n\n#### Step 1: Install Yup and @hookform/resolvers\n\
    \n```sh\nnpm install @hookform/resolvers yup\n```\n\n#### Step 2: Use Yup Schema\
    \ in React Hook Form\n\n```jsx\nimport React from \"react\";\nimport { useForm\
    \ } from \"react-hook-form\";\nimport { yupResolver } from \"@hookform/resolvers/yup\"\
    ;\nimport * as yup from \"yup\";\n\nconst schema = yup.object().shape({\nname:\
    \ yup.string().required(\"Name is required\"),\nemail: yup.string().email(\"Invalid\
    \ email\").required(\"Email is required\"),\npassword: yup.string().min(6, \"\
    Password must be at least 6 characters\"),\n});\n\nfunction UserForm() {\nconst\
    \ { register, handleSubmit, formState: { errors } } = useForm({\nresolver: yupResolver(schema),\n\
    });\n\nreturn (\n<form onSubmit={handleSubmit((data) => alert(JSON.stringify(data)))}>\n\
    <input {...register(\"name\")} placeholder=\"Name\" />\n{errors.name && <span>{errors.name.message}</span>}\n\
    <input {...register(\"email\")} placeholder=\"Email\" />\n{errors.email && <span>{errors.email.message}</span>}\n\
    <input type=\"password\" {...register(\"password\")} placeholder=\"Password\"\
    \ />\n{errors.password && <span>{errors.password.message}</span>}\n<button type=\"\
    submit\">Submit</button>\n</form>\n);\n}\nexport default UserForm;\n```\n\nEnsures\
    \ data is valid before submission. Reduces manual validation logic.\n\n## 7.5\
    \ Optimizing Input Handling for Performance\n\nHandling input fields efficiently\
    \ is critical for performance, especially in large applications. Here’s how to\
    \ optimize:\n\n### 1. Use Uncontrolled Components for Performance\n\nIn React,\
    \ input elements can be controlled (`useState()`) or uncontrolled (`ref`) .\n\n\
    | Component Type | Performance | When to Use |\n| :--- | :--- | :--- |\n| Controlled\
    \ (`useState()`) | Slower (re-renders on every keystroke) | Small forms, needs\
    \ real-time updates |\n| Uncontrolled (`useRef()`) | Faster (direct DOM manipulation)\
    \ | Large forms, fewer updates |\n\n#### Example: Using `useRef()` for Optimized\
    \ Input Handling\n\n```jsx\nimport React, { useRef } from \"react\";\nfunction\
    \ Form() {\nconst nameRef = useRef();\nfunction handleSubmit(event) {\nevent.preventDefault();\n\
    alert(`Name: ${nameRef.current.value}`);\n}\n\nreturn (\n<form onSubmit={handleSubmit}>\n\
    <input ref={nameRef} placeholder=\"Enter Name\" />\n<button type=\"submit\">Submit</button>\n\
    </form>\n);\n}\nexport default Form;\n```\n\nNo unnecessary re-renders. Better\
    \ for large forms.\n\n### 2. Optimize Input Rendering with useCallback()\n\nIf\
    \ using `useState()`, wrap event handlers in `useCallback()` to prevent unnecessary\
    \ re-renders.\n\n#### Example: Optimize Input Handler\n\n```jsx\nimport React,\
    \ { useState, useCallback } from \"react\";\nfunction OptimizedForm() {\nconst\
    \ [text, setText] = useState(\"\");\nconst handleChange = useCallback((event)\
    \ => {\nsetText(event.target.value);\n}, []);\n\nreturn <input type=\"text\" value={text}\
    \ onChange={handleChange} />;\n}\nexport default OptimizedForm;\n```\n\nAvoids\
    \ creating a new function on every render.\n\n### 3. Debounce Input Changes for\
    \ Performance\n\nFor real-time input handling (e.g., search fields), debounce\
    \ input to reduce API calls.\n\n#### Example: Debouncing Input\n\n```jsx\nimport\
    \ React, { useState } from \"react\";\nimport { debounce } from \"lodash\";\n\n\
    function SearchBox() {\nconst [query, setQuery] = useState(\"\");\nconst handleSearch\
    \ = debounce((text) => {\nconsole.log(\"Searching for:\", text);\n}, 500); //\
    \ Waits 500ms before calling function\n\nreturn <input onChange={(e) => handleSearch(e.target.value)}\
    \ placeholder=\"Search...\" />;\n}\nexport default SearchBox;\n```\n\nPrevents\
    \ excessive re-renders. Improves performance for API-based inputs.\n\n# Chapter\
    \ 8\n\n# Implementing Responsive and Adaptive GUI\n\n## 8.1 Difference Between\
    \ Responsive and Adaptive UI\n\n### Introduction\n"
  raw: '​● ​ Component-based design  improves UI reusability and scalability .


    ​● ​ JavaScript event listeners  enable interactive user experiences .


    ​● ​ React’s useState()  hook  simplifies form handling  and state management
    .


    By mastering these techniques, developers can build dynamic, interactive, and
    efficient user interfaces  that enhance user experience and engagement.


    # 7.4 Validating User Input Using JavaScript and React Hook Form


    ## Introduction to User Input Validation


    User input validation ensures that the data entered by users is correct, secure,
    and follows predefined rules  before being processed. Proper validation helps:


    ​● ​ Prevent invalid or malicious data  from entering the system.


    ​● ​ Improve user experience  by providing instant feedback .


    ​● ​ Reduce errors  and security vulnerabilities , such as SQL injection and XSS
    attacks .


    Validation can be performed:


    ​1\. ​ Client-side (JavaScript or React)  – Faster and provides instant feedback.


    ​2\. ​ Server-side (Backend validation)  – Ensures security by validating data
    before processing.


    ## 1. Validating User Input in Vanilla JavaScript


    Before moving to React, let’s explore basic JavaScript form validation .


    ### Example: Validating an Email Input


    html


    CopyEdit


    <form id="userForm">


    <input type="email" id="email" placeholder="Enter your email" />


    <span id="error-message" style="color: red;"></span>


    <button type="submit">Submit</button>


    </form>


    <script>


    document.getElementById("userForm").addEventListener("submit", function(event)
    {


    event.preventDefault();


    const email = document.getElementById("email").value;


    const errorMessage = document.getElementById("error-message");


    if (!email.includes("@") || !email.includes(".")) {


    errorMessage.innerText = "Invalid email format!";


    } else {


    errorMessage.innerText = "";


    alert("Form submitted successfully!");


    }


    });


    </script>


    Instant validation without reloading the page.   Not scalable for large forms.


    ## 2. Validating User Input in React


    In React , handling validation manually for multiple fields can be cumbersome.
    Instead, we use React Hook Form , a lightweight library that simplifies form validation.


    ### Why Use React Hook Form?


    Optimized Performance:  Uses uncontrolled components , reducing re-renders.


    Simplifies Form Handling:  Fewer useState()  calls, leading to cleaner code.


    Built-in Validation:  Works with Yup  schema validation for complex forms.


    ### 3\. Setting Up React Hook Form


    To install React Hook Form, run:


    sh


    CopyEdit


    npm install react-hook-form


    Then, import it inside a React component:


    jsx


    CopyEdit


    import { useForm } from "react-hook-form";


    ### 4. Basic Validation Using React Hook Form


    Let’s create a simple form with validation  for name and email .


    jsx


    CopyEdit


    import React from "react";


    import { useForm } from "react-hook-form";


    function UserForm() {


    const {


    register,


    handleSubmit,


    formState: { errors },


    } = useForm();


    const onSubmit = (data) => {


    alert(JSON.stringify(data, null, 2));


    };


    return (


    <form onSubmit={handleSubmit(onSubmit)}>


    <input {...register("name", { required: "Name is required" })} placeholder="Name"
    />


    {errors.name && <span style={{ color: "red" }}>{errors.name.message}</span>}


    <input


    {...register("email", {


    required: "Email is required",


    pattern: { value: /^\S+@\S+$/i, message: "Invalid email format" },


    })}


    placeholder="Email"


    />


    {errors.email && <span style={{ color: "red" }}>{errors.email.message}</span>}


    <button type="submit">Submit</button>


    </form>


    );


    }


    export default UserForm;


    Prevents submission if validation fails.   Displays real-time error messages.


    ### 5. Advanced Validation Using Yup Schema


    React Hook Form supports schema-based validation  using Yup .


    #### Step 1: Install Yup and @hookform/resolvers


    sh


    CopyEdit


    npm install @hookform/resolvers yup


    #### Step 2: Use Yup Schema in React Hook Form


    jsx


    CopyEdit


    import React from "react";


    import { useForm } from "react-hook-form";


    import { yupResolver } from "@hookform/resolvers/yup";


    import * as yup from "yup";


    const schema = yup.object().shape({


    name: yup.string().required("Name is required"),


    email: yup.string().email("Invalid email").required("Email is required"),


    password: yup.string().min(6, "Password must be at least 6 characters"),


    });


    function UserForm() {


    const { register, handleSubmit, formState: { errors } } = useForm({


    resolver: yupResolver(schema),


    });


    return (


    <form onSubmit={handleSubmit((data) => alert(JSON.stringify(data)))}>


    <input {...register("name")} placeholder="Name" />


    {errors.name && <span>{errors.name.message}</span>}


    <input {...register("email")} placeholder="Email" />


    {errors.email && <span>{errors.email.message}</span>}


    <input type="password" {...register("password")} placeholder="Password" />


    {errors.password && <span>{errors.password.message}</span>}


    <button type="submit">Submit</button>


    </form>


    );


    }


    export default UserForm;


    Ensures data is valid before submission.   Reduces manual validation logic.


    ## 7.5 Optimizing Input Handling for Performance


    Handling input fields efficiently is critical for performance , especially in
    large applications. Here’s how to optimize:


    ### 1. Use Uncontrolled Components for Performance


    In React, input elements can be controlled  ( useState() ) or uncontrolled  (
    ref ).


    | Component Type | Performance | When to Use |


    | Controlled ( useState() ) | Slower (re-renders on every keystroke) | Small forms,
    needs real-time updates |


    | Uncontrolled ( useRef() ) | Faster (direct DOM manipulation) | Large forms,
    fewer updates |


    #### Example: Using useRef()  for Optimized Input Handling


    jsx


    CopyEdit


    import React, { useRef } from "react";


    function Form() {


    const nameRef = useRef();


    function handleSubmit(event) {


    event.preventDefault();


    alert(`Name: ${nameRef.current.value}`);


    }


    return (


    <form onSubmit={handleSubmit}>


    <input ref={nameRef} placeholder="Enter Name" />


    <button type="submit">Submit</button>


    </form>


    );


    }


    export default Form;


    No unnecessary re-renders.   Better for large forms.


    ### 2\. Optimize Input Rendering with useCallback()


    If using useState() , wrap event handlers in useCallback()  to prevent unnecessary
    re-renders .


    #### Example: Optimizing Input Handler


    jsx


    CopyEdit


    import React, { useState, useCallback } from "react";


    function OptimizedForm() {


    const [text, setText] = useState("");


    const handleChange = useCallback((event) => {


    setText(event.target.value);


    }, []);


    return <input type="text" value={text} onChange={handleChange} />;


    }


    export default OptimizedForm;


    Avoids creating a new function on every render.


    ### 3. Debounce Input Changes for Performance


    For real-time input handling (e.g., search fields) , debounce input to reduce
    API calls .


    #### Example: Debouncing Input


    jsx


    CopyEdit


    import React, { useState } from "react";


    import { debounce } from "lodash";


    function SearchBox() {


    const [query, setQuery] = useState("");


    const handleSearch = debounce((text) => {


    console.log("Searching for:", text);


    }, 500); // Waits 500ms before calling function


    return <input onChange={(e) => handleSearch(e.target.value)} placeholder="Search..."
    />;


    }


    export default SearchBox;


    Prevents excessive re-renders.   Improves performance for API-based inputs.


    * * *


    ​● ​ JavaScript and React Hook Form  enable efficient form validation .


    ​● ​ Schema validation using Yup  simplifies error handling .


    ​● ​ Performance optimizations , such as useRef() , useCallback() , and debouncing
    , reduce unnecessary re-renders .


    By implementing these techniques, developers can build fast, responsive, and error-free
    user interfaces .


    # Chapter 8


    # Implementing Responsive and Adaptive GUI


    ## 8.1 Difference Between Responsive and Adaptive UI


