  trans: "\n\n- 基于组件的设计提高了 UI 的可重用性和可扩展性。\n- JavaScript 事件监听器实现了交互式用户体验。\n- React\
    \ 的 `useState()` 钩子简化了表单处理和状态管理。\n\n通过掌握这些技术，开发者可以构建动态、交互式且高效的用户界面，从而提升用户体验和参与度。\n\
    \n# 7.4 使用 JavaScript 和 React Hook Form 验证用户输入\n\n## 用户输入验证简介\n\n用户输入验证确保用户输入的数据在处理之前是正确、安全的，并符合预定义的规则。妥当的验证有助于：\n\
    \n- 防止无效或恶意数据进入系统。\n- 通过提供即时反馈来改善用户体验。\n- 减少错误和安全漏洞，例如 SQL 注入和 XSS 攻击。\n\n验证可以在以下位置执行：\n\
    \n1. 客户端（JavaScript 或 React）—— 速度更快且能提供即时反馈。\n2. 服务端（后端验证）—— 在处理数据之前通过验证确保安全性。\n\
    \n## 1. 在原生 JavaScript 中验证用户输入\n\n在转向 React 之前，让我们先探索基础的 JavaScript 表单验证。\n\n\
    ### 示例：验证邮箱输入\n\n```html\n<form id=\"userForm\">\n<input type=\"email\" id=\"\
    email\" placeholder=\"Enter 邮箱\" />\n<span id=\"error-message\" style=\"color:\
    \ red;\"></span>\n<button type=\"submit\">Submit</button>\n</form>\n\n<script>\n\
    document.getElementById(\"userForm\").addEventListener(\"submit\", function(event)\
    \ {\nevent.preventDefault();\nconst email = document.getElementById(\"email\"\
    ).value;\nconst errorMessage = document.getElementById(\"error-message\");\nif\
    \ (!email.includes(\"@\") || !email.includes(\".\")) {\nerrorMessage.innerText\
    \ = \"邮箱格式无效!\";\n} else {\nerrorMessage.innerText = \"\";\nalert(\"表单提交成功!\"\
    );\n}\n});\n</script>\n```\n\n无需刷新页面即可即时验证。对于大型表单而言扩展性不足。\n\n## 2. 在 React 中验证用户输入\n\
    \n在 React 中，手动处理多个字段的验证可能会非常麻烦。相反，我们使用 `React Hook Form`，这是一个简化表单验证的轻量级库。\n\n\
    ### 为什么使用 React Hook Form？\n\n- 优化性能：使用非受控组件，减少重新渲染。\n- 简化表单处理：减少了 `useState()`\
    \ 调用，使代码更整洁。\n- 内置验证：配合 `Yup` 模式验证处理复杂表单。\n\n### 3. 设置 React Hook Form\n\n安装 React\
    \ Hook Form，请运行：\n\n```sh\nnpm install react-hook-form\n```\n\n然后，在 React 组件中导入它：\n\
    \n```jsx\nimport { useForm } from \"react-hook-form\";\n```\n\n### 4. 使用 React\
    \ Hook Form 进行基础验证\n\n让我们创建一个带有姓名和邮箱验证的简单表单。\n\n```jsx\nimport React from \"react\"\
    ;\nimport { useForm } from \"react-hook-form\";\n\nfunction UserForm() {\nconst\
    \ {\n  register,\n  handleSubmit,\n  formState: { errors },\n} = useForm();\n\
    const onSubmit = (data) => {\nalert(JSON.stringify(data, null, 2));\n};\n\nreturn\
    \ (\n<form onSubmit={handleSubmit(onSubmit)}>\n<input {...register(\"name\", {\
    \ required: \"名称必填项\" })} placeholder=\"Name\" />\n{errors.name && <span style={{\
    \ color: \"red\" }}>{errors.name.message}</span>}\n<input\n{...register(\"email\"\
    , {\nrequired: \"邮箱必填项\",\npattern: { value: /^\\S+@\\S+$/i, message: \"邮箱格式无效\"\
    \ },\n})}\nplaceholder=\"Email\"\n/>\n{errors.email && <span style={{ color: \"\
    red\" }}>{errors.email.message}</span>}\n<button type=\"submit\">Submit</button>\n\
    </form>\n);\n}\nexport default UserForm;\n```\n\n验证失败时阻止提交。显示实时错误信息。\n\n### 5.\
    \ 使用 Yup Schema 进行高级验证\n\nReact Hook Form 支持使用 `Yup` 进行基于模式的验证。\n\n#### 第 1 步：安装\
    \ Yup 和 @hookform/resolvers\n\n```sh\nnpm install @hookform/resolvers yup\n```\n\
    \n#### 第 2 步：在 React Hook Form 中使用 Yup Schema\n\n```jsx\nimport React from \"\
    react\";\nimport { useForm } from \"react-hook-form\";\nimport { yupResolver }\
    \ from \"@hookform/resolvers/yup\";\nimport * as yup from \"yup\";\n\nconst schema\
    \ = yup.object().shape({\nname: yup.string().required(\"名称必填项\"),\nemail: yup.string().email(\"\
    邮箱无效\").required(\"邮箱必填项\"),\npassword: yup.string().min(6, \"密码至少包含 6 个字符\"),\n\
    });\n\nfunction UserForm() {\nconst { register, handleSubmit, formState: { errors\
    \ } } = useForm({\nresolver: yupResolver(schema),\n});\n\nreturn (\n<form onSubmit={handleSubmit((data)\
    \ => alert(JSON.stringify(data)))}>\n<input {...register(\"name\")} placeholder=\"\
    Name\" />\n{errors.name && <<span>>{errors.name.message}</span>}\n<input {...register(\"\
    email\")} placeholder=\"Email\" />\n{errors.email && <<span>{errors.email.message}</span>}\n\
    <input type=\"password\" {...register(\"password\")} placeholder=\"Password\"\
    \ />\n{errors.password && <<span>{errors.password.message}</span>}\n<button type=\"\
    submit\">Submit</button>\n</form>\n);\n}\nexport default UserForm;\n```\n\n确保在提交前数据有效。减少了手动验证逻辑。\n\
    \n## 7.5 优化输入处理以性能\n\n高效处理输入字段对于性能至关重要，特别是在大型应用程序中。以下是优化方法：\n\n### 1. 使用非受控组件优化性能\n\
    \n在 React 中，输入元素可以是受控的 (`useState()`) 或非受控的 (`ref`)。\n\n| 组件类型 | 性能 | 使用场景 |\n\
    | :--- | :--- | :--- |\n| 受控 (`useState()`) | 较慢（每次按键都会重新渲染） | 小型表单，需要实时更新 |\n\
    | 非受控 (`useRef()`) | 更快（直接操作 DOM） | 大型表单，更新频率低 |\n\n#### 示例：使用 `useRef()` 优化输入处理\n\
    \n```jsx\nimport React, { useRef } from \"react\";\nfunction Form() {\nconst nameRef\
    \ = useRef();\nfunction handleSubmit(event) {\nevent.preventDefault();\nalert(`Name:\
    \ ${nameRef.current.value}`);\n}\n\nreturn (\n<form onSubmit={handleSubmit}>\n\
    <input ref={nameRef} placeholder=\"Enter Name\" />\n<button type=\"submit\">Submit</button>\n\
    </form>\n);\n}\nexport default Form;\n```\n\n没有不必要的重新渲染。更适合大型表单。\n\n### 2. 使用\
    \ useCallback() 优化输入渲染\n\n如果使用 `useState()`，将事件处理程序封装在 `useCallback()` 中以防止不必要的重新渲染。\n\
    \n#### 示例：优化输入处理器\n\n```jsx\nimport React, { useState, useCallback } from \"react\"\
    ;\nfunction OptimizedForm() {\nconst [text, setText] = useState(\"\");\nconst\
    \ handleChange = useCallback((event) => {\nsetText(event.target.value);\n}, []);\n\
    \nreturn <input type=\"text\" value={text} onChange={handleChange} />;\n}\nexport\
    \ default OptimizedForm;\n```\n\n避免每次渲染都创建一个新函数。\n\n### 3. 使用防抖（Debounce）输入变化优化性能\n\
    \n对于实时输入处理（例如搜索框），对输入进行防抖以减少 API 调用。\n\n#### 示例：输入防抖\n\n```jsx\nimport React,\
    \ { useState } from \"react\";\nimport { debounce } from \"lodash\";\n\nfunction\
    \ SearchBox() {\nconst [query, setQuery] = useState(\"\");\nconst handleSearch\
    \ = debounce((text) => {\nconsole.log(\"Searching for:\", text);\n}, 500); //\
    \ 等待 500ms 后调用函数\n\nreturn <input onChange={(e) => handleSearch(e.target.value)}\
    \ placeholder=\"Search...\" />;\n}\nexport default SearchBox;\n```\n\n防止过度的重新渲染。提高基于\
    \ API 的输入性能。\n\n# 第 8 章\n\n# 实现响应式与自适应 GUI\n\n## 8.1 响应式 UI 与自适应 UI 的区别\n\n###\
    \ 简介\n\n"
- fmt: '

    Modern web applications need to function seamlessly across various devices, screen
    sizes, and resolutions. This is where responsive and adaptive design come into
    play, ensuring a consistent and user-friendly experience.


    ## What is Responsive UI?


    Responsive UI (Responsive Web Design - RWD) dynamically adjusts and reflows elements
    based on the screen size. This is achieved using CSS media queries, fluid layouts,
    and flexible images.


    ### Key Features of Responsive UI:


    - Uses a single design that adjusts fluidly across all devices. Relies on CSS
    media queries and flexible grids.

    - Ensures smooth transitions across screen sizes. Preferred for modern web applications.


    ### Example of Responsive UI:


    ```css

    /* Default styles */

    .container {

    width: 100%;

    max-width: 1200px;

    margin: 0 auto;

    }

    /* Responsive adjustments */

    @media (max-width: 768px) {

    .container {

    padding: 20px;

    }

    }

    ```


    A responsive website adjusts its layout, font sizes, and images dynamically as
    the screen size changes.


    ## What is Adaptive UI?


    Adaptive UI (Adaptive Web Design - AWD) loads predefined layouts based on the
    device’s screen size. Instead of dynamically resizing, the site detects the device
    type and loads the appropriate layout.


    ### Key Features of Adaptive UI:


    - Uses multiple fixed layouts for different screen sizes. Device detection determines
    which layout to display. More control over UI on different devices. Better performance
    for specific screen sizes.


    ### Example of Adaptive UI:


    ```html

    <!-- Desktop Layout -->

    <link rel="stylesheet" media="screen and (min-width: 1024px)" href="desktop.css">

    <!-- Tablet Layout -->

    <link rel="stylesheet" media="screen and (max-width: 1023px) and (min-width: 768px)"
    href="tablet.css">

    <!-- Mobile Layout -->

    <link rel="stylesheet" media="screen and (max-width: 667px)" href="mobile.css">

    ```


    Here, the browser loads only the relevant CSS file based on the device type.


    ## Comparison: Responsive vs Adaptive UI


    | Feature | Responsive UI | Adaptive UI |

    | :--- | :--- | :--- |

    | Approach | Flexible layout adjusts dynamically | Predefined layouts for different
    devices |

    | Performance | May be slower on mobile due to real-time adjustments | Faster
    since only relevant layout loads |

    | Implementation Complexity | Uses CSS media queries and fluid grids | Requires
    multiple static layouts |

    | Best Use Case | Websites that need flexibility across devices | Apps needing
    optimized layouts for specific devices |


    Responsive UI is the preferred approach for modern web applications due to its
    flexibility, while Adaptive UI is ideal for applications requiring device-specific
    optimization.


    ## 8.2 Media Queries and Flexible Layouts in CSS


    ### Introduction to Media Queries


    CSS media queries enable developers to apply different styles based on screen
    size, resolution, and orientation.


    ### Basic Syntax of Media Queries


    ```css

    @media (max-width: 768px) {

    body {

    background-color: lightgray;

    }

    }

    ```


    If the viewport width is `768px` or smaller, the background color changes.


    ### Common Breakpoints for Responsive Design


    Breakpoints define specific screen widths where UI adjustments occur.


    | Device Type | Breakpoint |

    | :--- | :--- |

    | Small Phones | `max-width: 480px` |

    | Tablets | `max-width: 768px` |

    | Laptops | `max-width: 1024px` |

    | Desktops | `min-width: 1025px` |


    ### Example: Adjusting Layouts for Different Screen Sizes


    ```css

    .container {

    width: 90%;

    margin: auto;

    }

    /* Tablets */

    @media (max-width: 768px) {

    .container {

    width: 100%;

    padding: 10px;

    }

    }

    /* Mobile */

    @media (max-width: 480px) {

    .container {

    flex-direction: column;

    }

    }

    ```


    ### Flexible Grid Layouts in CSS


    CSS Grid and Flexbox make it easier to create fluid layouts.


    ### Using Flexbox for a Responsive Layout


    ```css

    .container {

    display: flex;

    flex-wrap: wrap;

    justify-content: space-between;

    }

    /* Stack elements on smaller screens */

    @media (max-width: 600px) {

    .container {

    flex-direction: column;

    }

    }

    ```


    ### Using CSS Grid for Responsive Design


    ```css

    .grid-container {

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

    }

    ```


    Automatically adjusts column width based on available space.


    ### Responsive Images and Videos


    Images should scale proportionally to prevent distortion.


    ### Making Images Responsive


    ```css

    img {

    max-width: 100%;

    height: auto;

    }

    ```


    Prevents images from exceeding container width.


    ## 8.3 Making GUIs Responsive Using JavaScript


    ### Why Use JavaScript for Responsiveness?


    While CSS media queries handle most responsiveness, JavaScript enhances interactivity,
    such as:


    - Detecting screen size changes dynamically.

    - Adjusting UI elements based on user interactions.

    - Modifying styles dynamically when needed.


    ### 1. Detecting Window Resize in JavaScript


    Using JavaScript, you can detect screen size changes and apply dynamic styling.


    ### Example: Change Navbar Style on Resize


    ```javascript

    window.addEventListener("resize", function() {

    if (window.innerWidth < 600) {

    document.body.style.backgroundColor = "lightblue";

    } else {

    document.body.style.backgroundColor = "white";

    }

    });

    ```


    Dynamically updates background color based on screen width.


    ### 2. Responsive Navigation Menus


    Many websites use JavaScript-based mobile menus.


    ### Example: Toggle Mobile Menu


    ```html

    <button id="menu-btn">☰ Menu</button>

    <nav id="mobile-menu" style="display: none;">

    <a href="#">Home</a>

    <a href="#">About</a>

    </nav>

    <script>

    document.getElementById("menu-btn").addEventListener("click", function() {

    const menu = document.getElementById("mobile-menu");

    menu.style.display = menu.style.display === "none" ? "block" : "none";

    });

    </script>

    ```


    Shows or hides the menu when the button is clicked.


    ### 3. Dynamically Adjusting Layouts Using JavaScript


    JavaScript can be used to adjust UI elements dynamically based on window size.


    ### Example: Adjust Card Layout Based on Screen Width


    ```javascript

    function adjustLayout() {

    const cards = document.querySelectorAll(".card");

    if (window.innerWidth < 600) {

    cards.forEach(card => card.style.width = "100%");

    } else {

    cards.forEach(card => card.style.width = "45%");

    }

    }

    window.addEventListener("resize", adjustLayout);

    adjustLayout(); // Run function on page load

    ```


    Ensures the layout adapts dynamically when the window resizes.


    ### 4. Responsive Font Sizes Using JavaScript


    Font sizes should adjust based on screen width.


    ### Example: Adjust Font Size Dynamically


    ```javascript

    function adjustFontSize() {

    const heading = document.querySelector("h1");

    heading.style.fontSize = window.innerWidth < 600 ? "20px" : "40px";

    }

    window.addEventListener("resize", adjustFontSize);

    adjustFontSize(); // Run function initially

    ```


    Improves readability on smaller screens.


    - Responsive UI adjusts fluidly, while Adaptive UI loads different layouts.

    - CSS media queries and flexible layouts make interfaces adapt to screen sizes.

    - JavaScript enhances responsiveness by dynamically modifying UI elements.


    By combining CSS media queries, flexible layouts, and JavaScript interactivity,
    developers can create powerful, adaptive, and fully responsive GUI applications
    for all screen sizes.


    ## 8.4 React’s Responsive Component Libraries


    ### Introduction to Responsive Component Libraries in React


    React provides several UI libraries that simplify the process of creating responsive
    and adaptive user interfaces. These libraries offer prebuilt, customizable components
    that adjust dynamically to various screen sizes, eliminating the need for extensive
    manual styling.


    ### Why Use a Responsive UI Library?


    - Faster Development – Reduces the time spent writing CSS.

    - Consistency – Ensures a uniform design across devices.

    - Accessibility – Many libraries include built-in accessibility features.

