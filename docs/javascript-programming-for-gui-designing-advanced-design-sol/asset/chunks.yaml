  trans: "\n\n-   原生 JavaScript 手动管理状态，但缺乏结构化的工具。\n-   React 的 `useState` 非常适合简单的状态管理，而\
    \ `useReducer` 则更适合复杂的逻辑。\n\n通过使用 React Hooks，开发者可以高效地管理状态，从而提高 GUI 应用程序的性能、可扩展性和用户体验。\n\
    \n# 5.4 使用 Redux 实现全局状态\n\n## 全局状态管理简介\n\n在复杂的 GUI 应用中，当多个组件需要共享和更新数据时，状态管理变得具有挑战性。像\
    \ `useState` 和 `useReducer` 这样的本地状态解决方案对于孤立组件有效，但在处理多个组件必须访问的全局状态时就力不从心。\n\n###\
    \ 什么是全局状态？\n\n全局状态是指整个应用程序中多个组件都需要访问的数据。例子包括：\n- 用户身份验证状态（例如：登录状态、用户配置）。\n- 主题设置（例如：深色模式或浅色模式）。\n\
    - 购物车数据（例如：添加的项目列表）。\n- 通知和警报。\n\n### 为什么本地状态不足以处理全局状态\n\n| 问题 | 本地状态的问题 | 全局状态的解决方案\
    \ |\n| :--- | :--- | :--- |\n| 数据共享 | 组件需要通过 props 钻（props drilling）传递数据 | 数据存储在中心化的状态中\
    \ |\n| 状态同步 | 多个组件之间的重复状态会导致不一致 | 状态更新是全局且一致的 |\n| 性能 | 每个状态发生变化的组件都会发生重新渲染 |\
    \ 优化的状态更新减少了不必要的重新渲染 |\n\n这就是 Redux 发挥作用的地方。\n\n## 什么是 Redux？\n\nRedux 是一个用于 JavaScript\
    \ 应用程序的状态管理库，通常与 React 一起使用。它提供了一个中央 store 来高效管理全局状态。\n\n### 为什么要使用 Redux？\n\n\
    1. 可预测的状态管理 – 使用单一事实来源，减少错误和不一致性。\n2. 可扩展性 – 适用于具有复杂状态逻辑的大型应用程序。\n3. 性能优化 – 通过仅更新\
    \ UI 的必要部分防止组件必要的重新渲染。\n\n### Redux 架构\n\nRedux 遵循严格的单向数据流：\n1. `Action` → 描述应该发生什么。\n\
    2. `Reducer` → 决定状态如何变化。\n3. `Store` → 持有整个应用程序的状态。\n4. `Dispatch` → 触发 action\
    \ 以更新状态。\n5. `Selector` → 提取并向组件提供特定的状态数据。\n\n## 在 React 应用中设置 Redux\n\n### 第\
    \ 1 步：安装 Redux 和 React-Redux\n\n```sh\nnpm install redux react-redux\n```\n\n\
    React-Redux 是官方绑定库，允许 React 组件与 Redux 交互。\n\n### 第 2 步：创建 Redux Store\n\nstore\
    \ 保存整个应用程序的状态。\n\n#### store.js\n\n```javascript\nimport { createStore } from\
    \ \"redux\";\n\n// 初始状态\nconst initialState = {\n  count: 0\n};\n\n// Reducer\
    \ 函数\nfunction counterReducer(state = initialState, action) {\n  switch (action.type)\
    \ {\n    case \"INCREMENT\":\n      return { count: state.count + 1 };\n    case\
    \ \"DECREMENT\":\n      return { count: state.count - 1 };\n    default:\n   \
    \   return state;\n  }\n}\n\n// 创建 Redux Store\nconst store = createStore(counterReducer);\n\
    export default store;\n```\n\n### 第 3 步：将 Store 给 React\n\n使用 `Provider` 组件让所有组件都能访问\
    \ Redux store。\n\n#### index.js\n\n```javascript\nimport React from \"react\"\
    ;\nimport ReactDOM from \"react-dom\";\nimport { Provider } from \"react-redux\"\
    ;\nimport store from \"./store\";\nimport App from \"./App\";\n\nReactDOM.render(\n\
    \  <Provider store={store}>\n    <App />\n  </Provider>,\n  document.getElementById(\"\
    root\")\n);\n```\n\n### 第 4 步：将组件连接到 Redux\n\nReact 组件可以使用 `useSelector()` 访问\
    \ Redux 状态，并使用 `useDispatch()` 分发 action。\n\n#### Counter 组件\n\n```javascript\n\
    import React from \"react\";\nimport { useSelector, useDispatch } from \"react-redux\"\
    ;\n\nfunction Counter() {\n  const count = useSelector((state) => state.count);\n\
    \  const dispatch = useDispatch();\n  return (\n    <div>\n      <p>Count: {count}</p>\n\
    \      <button onClick={() => dispatch({ type: \"INCREMENT\" })}>+</button>\n\
    \      <button onClick={() => dispatch({ type: \"DECREMENT\" })}>-</button>\n\
    \    </div>\n  );\n}\n\nexport default Counter;\n```\n\n## 使用 Redux 的优势\n\n- 中心化状态\
    \ – 所有数据都存储在单一位置，使调试更容易。\n- 可预测性 – 由于状态变化通过 actions 和 redu 发生，行为是可预测的。\n- 中间件支持\
    \ – 支持异步状态更新（例如用于 API 请求的 `redux-thunk`）。\n- 模板代码 – 需要多个文件来处理 actions、reducers\
    \ 和 store 设置。\n- 小型应用的开销 – 对于状态管理需求最小的应用并不理想。\n\n对于更简单的全局状态管理，开发者经常探索 Redux 的替代方案，如\
    \ `MobX`、`Zustand` 和 `Recoil`。\n\n# 5.5 替代状态管理工具：MobX, Zustand, Recoil\n\n虽然 Redux\
    \ 被广泛使用，但并不是状态管理的唯一解决方案。其他几个库提供了更简单、灵活的方法。\n\n## 1. MobX: 响应式状态管理\n\n什么是 MobX？MobX\
    \ 是一个自动跟踪变化并响应式更新组件的状态管理库。\n\n### 为什么要使用 MobX？\n\n- 更少的模板代码 – 不需要 reducers 或 action\
    \ 类型。\n- 可观察状态 – 组件仅在需要时才重新渲染。\n- 于扩展 – 适用于大型应用程序。\n\n### 基础示例：在 React 中使用 MobX\n\
    \n```sh\nnpm install mobx mobx-lite\n```\n\n#### store.js\n\n```javascript\nimport\
    \ { makeAutoObservable } from \"mobx\";\n\nclass CounterStore {\n  count = 0;\n\
    \  constructor() {\n    makeAutoObservable(this);\n  }\n  increment() {\n    this.count++;\n\
    \  }\n  decrement() {\n    this.count--;\n  }\n}\n\nexport default new CounterStore();\n\
    ```\n\n#### Counter 组件\n\n```javascript\nimport React from \"react\";\nimport\
    \ { observer } from \"mobx-lite\";\nimport counterStore from \"./store\";\n\n\
    const Counter = observer(() => (\n  <div>\n    <p>Count: {counterStore.count}</p>\n\
    \    <button onClick={() => counterStore.increment()}>+</button>\n    <button\
    \ onClick={() => counterStore.decrement()}>-</button>\n  </div>\n));\n\nexport\
    \ default Counter;\n```\n自动状态跟踪 – 设置极少 – 比 Redux 可预测性较低\n\n## 2. Zustand: 轻量级替代方案\n\
    \n什么是 Zustand？Zustand 是一个极简的状态管理库，结合了 `useState` 的简单性与全局状态管理。\n\n### 为什么要使用 Zustand？\n\
    \n- 不需要 Provider – 无需 `Provider` 组件即可工作。\n-  API – 使用 hooks 轻松更新。\n\n### 基础示例：使用\
    \ Zustand\n\n```sh\nnpm install zustand\n```\n\n#### store.js\n\n```javascript\n\
    import create from \"zustand\";\n\nconst useStore = create((set) => ({\n  count:\
    \ 0,\n  increment: () => set((state) => ({ count: state.count + 1 })),\n  decrement:\
    \ () => set((state) => ({ count: state.count - 1 })),\n}));\n\nexport default\
    \ useStore;\n```\n\n#### Counter 组件\n\n```javascript\nimport React from \"react\"\
    ;\nimport useStore from \"./store\";\n\nfunction Counter() {\n  const { count,\
    \ increment, decrement } = useStore();\n  return (\n    <div>\n      <p>Count:\
    \ {count}</p>\n      <button onClick={increment}>+</button>\n      <button onClick={decrement}>-</button>\n\
    \    </div>\n  );\n}\n\nexport default Counter;\n```\n快速且轻量 – 无模板代码 – 生态系统有限\n\
    \n## 3. Recoil: 适用于 React 的状态管理\n\n什么是 Recoil？Recoil 是一个专为 React 设计的状态管理库。\n\n\
    ### 为什么要使用 Recoil？\n\n- Simple API – 使用 `atom` 和 `selector` 概念。\n- 与 React 良好集成\
    \ – 针对 React 应用程序进行了完全优化。\n\n### 基础示例：使用 Recoil\n\n```sh\nnpm install recoil\n\
    ```\n\n#### Counter Atom\n\n```javascript\nimport { atom } from \"recoil\";\n\n\
    export const counterState = atom({\n  key: \"counterState\",\n  default: 0,\n\
    });\n```\n\n#### Counter 组件\n\n```javascript\nimport { useRecoilState } from \"\
    recoil\";\n```\n"
- fmt: "\n```javascript\nimport { counterState } from \"./store\";\n\nfunction Counter()\
    \ {\n  const [count, setCount] = useRecoilState(counterState);\n\n  return (\n\
    \    <div>\n      <p>Count: {count}</p>\n      <button onClick={() => setCount(count\
    \ + 1)}>+</button>\n      <button onClick={() => setCount(count - 1)}>-</button>\n\
    \    </div>\n  );\n}\n```\nGreat for React developers. Easier to use than `Redux`.\
    \ Still experimental.\n\n## Final Comparison\n\n| Library | Best For |\n| :---\
    \ | :--- |\n| `Redux` | Large-scale apps with strict state management |\n| `MobX`\
    \ | Reactive state with minimal boilerplate |\n| `Zustand` | Lightweight state\
    \ management |\n| `Recoil` | React-focused state management |\n\nChoosing the\
    \ right tool depends on the complexity and scalability needs of the project.\n\
    \n# Chapter 6: Styling Components Effectively\n\n## 6.1 CSS vs JavaScript Styling:\
    \ Best Practices\n\n### Introduction to Styling\nStyling is a critical aspect\
    \ of GUI development, determining the visual appeal and usability of a web application.\
    \ There are two primary ways to style components in modern web development:\n\
    1. **CSS (Cascading Style Sheets)**: Traditional approach using external stylesheets\
    \ or inline styles.\n2. **JavaScript Styling**: Uses JavaScript-based techniques\
    \ like `Styled Components`, `CSS-in-JS`, or inline styles.\n\n### CSS-Based Styling:\
    \ Pros & Cons\nCSS styling involves using external `.css` files, inline styles,\
    \ or embedded styles within the HTML.\n\n#### Pros of CSS-Based Styling\n- **Separation\
    \ of Concerns**: Keeps styling separate from logic.\n- **Better Performance**:\
    \ Styles are optimized and cached by the browser.\n- **Easier to Maintain**: Applications\
    \ benefit from reusable classes.\n- **Supports Media Queries**: Essential for\
    \ responsive designs.\n\n#### Cons of CSS-Based Styling\n- **Global Scope Issues**:\
    \ Classes can conflict across components.\n- **Harder to Update**: Changing styles\
    \ dynamically requires manipulating class names.\n\n### JavaScript-Based Styling:\
    \ Pros & Cons\nJavaScript styling includes inline styles, `CSS-in-JS` libraries,\
    \ and `Styled Components`.\n\n#### Pros of JavaScript Styling\n- **Component-Based**:\
    \ Styles are tied to individual components (good for modularity).\n- **Dynamic\
    \ Styling**: Easier to change styles based on state or props.\n- **No Global Scope\
    \ Issues**: Prevents accidental style overrides.\n\n#### Cons of JavaScript Styling\n\
    - **Performance Overhead**: Inline styles do not leverage CSS optimizations.\n\
    - **More Complexity**: Mixing styles and logic reduces readability.\n\n### Best\
    \ Practices for Styling\n1. **Use CSS for Static Styles**: Keep static styles.\n\
    2. **Follow a Naming Convention (e.g., BEM)**: Prevents class conflicts in large\
    \ projects.\n```css\n.button { background-color: blue; }\n.button--primary { background-color:\
