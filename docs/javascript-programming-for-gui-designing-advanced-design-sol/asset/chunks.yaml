    import { Box } from \"@mui/material\";\n\nfunction App() {\n  const [cart, setCart]\
    \ = useState([]);\n  const handleAddToCart = (product, quantity) => {\n    setCart((prevCart)\
    \ => {\n      const existingItem = prevCart.find((item) => item.id === product.id);\n\
    \      if (existingItem) {\n        return prevCart.map((item) => item.id ===\
    \ product.id ? { ...item, quantity: item.quantity + quantity } : item);\n    \
    \  }\n      return [...prevCart, { ...product, quantity }];\n    });\n  };\n \
    \ const handleRemoveFromCart = (id) => {\n    setCart(cart.filter((item) => item.id\
    \ !== id));\n  };\n  return (\n    <Box display=\"flex\" gap={4}>\n      <ProductList\
    \ onAddToCart={handleAddToCart} />\n      <Cart cartItems={cart} onRemoveFromCart={handleRemoveFromCart}\
    \ />\n    </Box>\n  );\n}\n\nexport default App;\n```\nUsers can add and remove\
    \ items from the cart dynamically.\n\n## 15.3 Handling State Management for Shopping\
    \ Cart\n\n### 1. Using Context API for Cart State\n\nFor better scalability, we\
    \ move cart state into Context API.\n\n##### Step 1: Create Cart Context\n\n`CartContext.js`\n\
    \n```jsx\nimport React, { createContext, useState } from \"react\";\nexport const\
    \ CartContext = createContext();\nexport function CartProvider({ children }) {\n\
    \  const [cart, setCart] = useState([]);\n  const addToCart = (product, quantity)\
    \ => {\n    setCart((prevCart) => {\n      const existingItem = prevCart.find((item)\
    \ => item.id === product.id);\n      if (existingItem) {\n        return prevCart.map((item)\
    \ =>\n          item.id === product.id ? { ...item, quantity: item.quantity +\
    \ quantity } : item\n        );\n      }\n      return [...prevCart, { ...product,\
    \ quantity }];\n    });\n  };\n  const removeFromCart = (id) => {\n    setCart(cart.filter((item)\
    \ => item.id !== id));\n  };\n  return (\n    <CartContext.Provider value={{ cart,\
    \ addToCart, removeFromCart }}>\n      {children}\n    </CartContext.Provider>\n\
    \  );\n}\n```\nManages cart state globally.\n\n### 2. Using Context in Components\n\
    \nWrap `App.js` with `CartProvider`:\n\n```jsx\nimport React from \"react\";\n\
    import { CartProvider } from \"./CartContext\";\nimport ProductList from \"./components/ProductList\"\
    ;\nimport Cart from \"./components/Cart\";\nimport { Box } from \"@mui/material\"\
    ;\n\nfunction App() {\n  return (\n    <CartProvider>\n      <Box display=\"flex\"\
    \ gap={4}>\n        <ProductList />\n        <Cart />\n      </Box>\n    </CartProvider>\n\
    \  );\n}\n\nexport default App;\n```\nNow `ProductList` and `Cart` can access\
    \ global cart state.\n\n- Interactive product cards improve user experience.\n\
    - Cart functionality enables dynamic shopping experience.\n- Context API optimizes\
    \ state management.\n\nThis approach ensures a scalable and user-friendly e-commerce\
    \ platform with React.\n\n# 15.4 Connecting the Frontend to a Payment API\n\n\
    ## Introduction to Payment Integration in E-Commerce\n\nA crucial part of an e-commerce\
    \ platform is the checkout and payment process. Integrating a Payment API allows\
    \ users to securely make purchases. In this section, we will connect our React\
    \ e-commerce frontend to a payment gateway like `Stripe`.\n\nKey Features of Payment\
    \ Integration:\n- Secure transactions – Payments are processed via encrypted APIs.\n\
    - Support for multiple payment methods – Credit/Debit cards, PayPal, Apple Pay,\
    \ etc.\n- Real-time validation – Prevents failed or fraudulent transactions.\n\
    \n## 1. Choosing a Payment API\n\nPopular payment gateways include:\n\n| Payment\
    \ API | Features |\n| :--- | :--- |\n| Stripe | Easy setup, supports subscriptions,\
    \ fraud prevention |\n| PayPal | Trusted globally, integrates PayPal wallets |\n\
    | Razorpay | Best for Indian markets, supports UPI payments |\n| Square | Ideal\
    \ for POS (Point of Sale) businesses |\n\nWe will use `Stripe` for seamless credit\
    \ card processing in React.\n\n## 2. Setting Up Stripe API\n\n### Step 1: Create\
    \ a Stripe Account\n\n- Go to Stripe and create an account.\n- Get your API keys\
    \ from the Stripe Dashboard.\n\n### Step 2: Install Stripe in React\n\n```sh\n\
    npm install @stripe/react-stripe-js @stripe/stripe-js\n```\nThese packages allow\
    \ integration with `Stripe`’s payment system.\n\n### Step 3: Create a Stripe Payment\
    \ Component\n\n`CheckoutForm.js`\n\n```jsx\nimport React, { useState } from \"\
    react\";\nimport { CardElement, useStripe, useElements } from \"@stripe/react-stripe-js\"\
    ;\nimport { Box, Button, Typography } from \"@mui/material\";\n\nfunction CheckoutForm({\
    \ totalAmount }) {\n  const stripe = useStripe();\n  const elements = useElements();\n\
    \  const [loading, setLoading] = useState(false);\n  const handleSubmit = async\
    \ (event) => {\n    event.preventDefault();\n    setLoading(true);\n    if (!stripe\
    \ || !elements) return;\n    const { error, paymentMethod } = await stripe.createPaymentMethod({\n\
    \      type: \"card\",\n      card: elements.getElement(CardElement),\n    });\n\
    \    if (error) {\n      console.error(error);\n      setLoading(false);\n   \
    \ } else {\n      console.log(\"Payment successful!\", paymentMethod);\n     \
    \ setLoading(false);\n    }\n  };\n  return (\n    <Box>\n      <Typography variant=\"\
    h6\">Pay ${totalAmount.toFixed(2)}</Typography>\n      <form onSubmit={handleSubmit}>\n\
    \        <CardElement />\n        <Button type=\"submit\" variant=\"contained\"\
    \ disabled={!stripe || loading}>\n          {loading ? \"Processing...\" : \"\
    Pay Now\"}\n        </Button>\n      </form>\n    </Box>\n  );\n}\n\nexport default\
    \ CheckoutForm;\n```\nHandles payment submission with `Stripe`.\n\n### Step 4:\
    \ Wrap Checkout in Stripe Provider\n\nModify `App.js` to include `Stripe`:\n\n\
    ```jsx\nimport React from \"react\";\nimport { Elements } from \"@stripe/react-stripe-js\"\
    ;\nimport { loadStripe } from \"@stripe/stripe-js\";\nimport CheckoutForm from\
    \ \"./components/CheckoutForm\";\n\nconst stripePromise = loadStripe(\"your_publishable_key\"\
    );\n\nfunction App() {\n  return (\n    <Elements stripe={stripePromise}>\n  \
    \    <CheckoutForm totalAmount={99.99} />\n    </Elements>\n  );\n}\n\nexport\
    \ default App;\n```\nNow the checkout page is connected to `Stripe`.\n\n## 5.\
    \ Handling Payment Processing in the Backend\n\nStripe payments require a backend\
    \ server to process transactions securely.\n\n### Step 1: Install Stripe in Backend\n\
    \n```sh\nnpm install stripe cors dotenv\n```\nBackend will handle actual payment\
    \ processing.\n\n### Step 2: Create a Stripe Payment Route\n\n`server.js` (Node.js/Express\
    \ Backend)\n\n```javascript\nrequire(\"dotenv\").config();\nconst express = require(\"\
    express\");\nconst cors = require(\"cors\");\nconst stripe = require(\"stripe\"\
    )(process.env.STRIPE_SECRET_KEY);\n\nconst app = express();\napp.use(cors());\n\
    app.use(express.json());\n\napp.post(\"/create-payment-intent\", async (req, res)\
    \ => {\n  const { amount } = req.body;\n  try {\n    const paymentIntent = await\
    \ stripe.paymentIntents.create({\n      amount: amount * 100, // Convert to cents\n\
    \      currency: \"usd\",\n    });\n    res.json({ clientSecret: paymentIntent.client_secret\
    \ });\n  } catch (error) {\n    res.status(500).json({ error: error.message });\n\
    \  }\n});\n\napp.listen(5000, () => console.log(\"Server running on port 5000\"\
    ));\n```\nHandles payment processing securely.\n\n### 6. Connecting Frontend to\
