    \ to `Styled Components` but uses `Emotion`’s API.\n\n#### Example: Button with\
    \ Dynamic Styling\n\n```jsx\nimport styled from \"@emotion/styled\";\n\nconst\
    \ Button = styled.button`\nbackground-color: ${(props) => (props.primary ? \"\
