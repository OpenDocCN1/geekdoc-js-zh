    \      type=\"date\"\n      value={date}\n      onChange={(e) => {\n        setDate(e.target.value);\n\
    \        onFilter(e.target.value);\n      }}\n    />\n  );\n}\n\nexport default\
    \ FilterComponent;\n```\n根据用户输入动态地过滤数据。\n\n### 2. 在表格中排序数据\n\n排序允许用户根据标准组织记录。\n\
    \n#### 可排序表格组件\n\n`TableComponent.js`\n\n```jsx\nimport React, { useState } from\
    \ \"react\";\nimport { Table, TableBody, TableCell, TableHead, TableRow, TableSortLabel\
    \ } from \"@mui/material\";\n\nconst data = [\n  { name: \"John\", sales: 300\
    \ },\n  { name: \"Jane\", sales: 500 },\n  { name: \"Doe\", sales: 200 },\n];\n\
    \nfunction TableComponent() {\n  const [order, setOrder] = useState(\"asc\");\n\
    \  const handleSort = () => {\n    setOrder(order === \"asc\" ? \"desc\" : \"\
    asc\");\n  };\n  const sortedData = [...data].sort((a, b) => (order === \"asc\"\
    \ ? a.sales - b.sales : b.sales - a.sales));\n  return (\n    <Table>\n      <TableHead>\n\
    \        <TableRow>\n          <TableCell>Name</TableCell>\n          <TableCell>\n\
