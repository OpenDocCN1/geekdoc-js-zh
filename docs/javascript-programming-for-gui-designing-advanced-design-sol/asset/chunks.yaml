    \        <ProductCard product={product} onAddToCart={onAddToCart} />\n       \
    \ </Grid>\n      ))}\n    </Grid>\n  );\n}\n\nexport default ProductList;\n```\n\
    \n动态显示多个产品卡片。\n\n## 15.2 实现加入购物车功能\n\n### 1. 创建购物车组件\n\n购物车应该：\n- 显示已选商品。\n- 允许更新数量。\n\
    - 动态计算总价。\n- 支持移除物品。\n\n### 2. 实现加入购物车逻辑\n\n`Cart.js`\n\n```jsx\nimport React\
    \ from \"react\";\nimport { Box, List, ListItem, ListItemText, Button, Typography\
    \ } from \"@mui/material\";\n```\n\n"
