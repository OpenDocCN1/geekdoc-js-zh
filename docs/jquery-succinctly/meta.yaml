  - "[PAGE 14]\n\n# Chapter 1 Core jQuery\n\n**Base concept behind jQuery**\n\nWhile\
    \ some conceptual variations exist (e.g. functions like $.ajax) in the jQuery\
    \ API, the central concept behind jQuery is \"find something, do something.\"\
    \ More specifically, select DOM element(s) from an HTML document and then do something\
    \ with them using jQuery methods. This is the big picture concept.\n\nTo drive\
    \ this concept home, reflect upon the code below.\n\n**Sample: sample1.html**\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <!-- jQuery will change\
    \ this -->\n    <a href=\"\"></a>\n    <!-- to this <a href=\"http://www.jquery.com\"\
    >jQuery.</a> -->\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>\n        jQuery('a').text('jQuery').attr('href', 'http://www.jquery.com');\n\
    \    </script>\n</body>\n</html>\n```\n\nNotice that in this HTML document we\
    \ are using jQuery to select a DOM element (<a>). With something selected, we\
    \ then do something with the selection by invoking the jQuery methods **text(),\
    \ attr(), and appendTo().**\n\nThe **text** method called on the wrapped <a> element\
    \ and set the display text of the element to be \"jQuery.\" The **attr** call\
    \ sets the **href** attribute to the jQuery Web site.\n\nGrokking the \"find something,\
    \ do something\" foundational concept is critical to advancing as a jQuery developer."
  - "[PAGE 15]\n\n# The concept, behind the concept, behind jQuery\n\nWhile selecting\
    \ something and doing something is the core concept behind jQuery, I would like\
    \ to extend this concept to include creating something as well. Therefore, the\
    \ concept behind jQuery could be extended to include first creating something\
    \ new, selecting it, and then doing something with it. We could call this the\
    \ concept, behind the concept, behind jQuery.\n\nWhat I am trying to make obvious\
    \ is that you are not stuck with only selecting something that is already in the\
    \ DOM. It is additionally important to grok that jQuery can be used to create\
    \ new DOM elements and then do something with these elements.\n\nIn the code example\
    \ below, we create a new `<a>` element that is not in the DOM. Once created, it\
    \ is selected and then manipulated.\n\n# Sample: sample2.html\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n    <body>\n        <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n        <script>\n            jQuery('<a>jQuery</a>').attr('href',\
    \ 'http://www.jquery.com').appendTo('body');\n        </script>\n    </body>\n\
    </html>\n```\n\nThe key concept to pick up here is that we are creating the `<a>`\
    \ element on the fly and then operating on it as if it was already in the DOM.\n\
    \n# jQuery requires HTML to run in standards mode or almost-standards mode\n\n\
    There are known issues with jQuery methods not working correctly when a browser\
    \ renders an HTML page in quirks mode. Make sure when you are using jQuery that\
    \ the browser interprets the HTML in standards mode or almost standards mode by\
    \ using a [valid doctype](http://example.com).\n\nTo ensure proper functionality,\
    \ code examples in this book use the HTML 5 doctype.\n\n```\n<!DOCTYPE html>\n\
    ```"
- md: "## Waiting on the DOM to be ready\n\njQuery fires a custom event named **ready**\
    \ when the DOM is loaded and available for manipulation. Code that manipulates\
    \ the DOM can run in a handler for this event. This is a common pattern seen with\
    \ jQuery usage.\n\nThe following sample features three coded examples of this\
    \ custom event in use.\n\n## Sample: sample3.html\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n    <head>\n        <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n        <script>\n            // Standard.\n            jQuery(document).ready(function\
    \ () { alert('DOM is ready!'); });\n\n            // Shortcut, but same thing\
    \ as above.\n            jQuery(function () { alert('No really, the DOM is ready!');\
    \ });\n\n            // Shortcut with fail-safe usage of $. Keep in mind that\
    \ a reference\n            // to the jQuery function is passed into the anonymous\
    \ function.\n            jQuery(function ($) {\n                    alert('Seriously\
    \ its ready!');\n                    // Use $() without fear of conflicts.\n \
    \           });\n        </script>\n    </head>\n    <body></body>\n</html>\n\
    ```\n\nKeep in mind that you can attach as many **ready()** events to the document\
    \ as you would like. You are not limited to only one. They are executed in the\
    \ order they were added.\n\n## Executing jQuery code when the browser window is\
    \ completely loaded\n\nTypically, we do not want to wait for the **window.onload**\
    \ event. That is the point of using a custom event like **ready()** that will\
    \ execute code before the window loads, but after the DOM is ready to be traversed\
    \ and manipulated.\n\nHowever, sometimes we actually do want to wait. While the\
    \ custom **ready()** event is great for executing code once the DOM is available,\
    \ we can also use jQuery to execute code once the entire Web page (including all\
    \ assets) is completely loaded.\n\nThis can be done by attaching a load event\
    \ handler to the **window** object. jQuery provides the **load()** event method\
    \ that can be used to invoke a function once the window is completely loaded.\
    \ Below, I provide an example of the **load()** event method in use.\n\n## Sample:\
    \ sample4.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n    <head>\n     \
    \   <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n        <script>\n            // Pass window to the jQuery function\
    \ and attach\n            // event handler using the load() method shortcut.\n\
    \            jQuery(window).load(function(){      alert('The page and all its\
    \ assets are loaded!'); });\n        </script>\n    </head>\n\n    <body></body>\n\
    </html>\n```\n\n## Include all CSS files before including jQuery\n\nAs of jQuery\
    \ 1.3, the library no longer guarantees that all CSS files are loaded before it\
    \ fires the custom **ready()** event. Because of this change in jQuery 1.3, you\
    \ should always include all CSS files before any jQuery code. This will ensure\
    \ that the browser has parsed the CSS before it moves on to the JavaScript included\
    \ later in the HTML document. Of course, images that are referenced via CSS may\
    \ or may not be downloaded as the browser parses the JavaScript.\n\n## Using a\
    \ hosted version of jQuery\n\nWhen embedding jQuery into a Web page, most people\
    \ choose to download the [source code](https://docs.google.com/) and link to it\
    \ from a personal domain/host. However, there are other options that involve someone\
    \ else hosting the jQuery code for you.\n\nGoogle hosts several versions of the\
    \ jQuery source code with the intent of it being used by anyone. This is actually\
    \ very handy. In the code example below I am using a <script> element to include\
    \ a minified version of jQuery that is hosted by Google.\n\n```\n<script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    ```\n\nGoogle also hosts several previous versions of the jQuery source code,\
    \ and for each version, minified and non-minified variants are provided. I recommend\
    \ using the non-minified variant during development, as debugging errors is always\
    \ easier when you are dealing with non-minified code.\n\nA benefit of using a\
    \ Google hosted version of jQuery is that it is reliable, fast, and potentially\
    \ cached.\n\n## Executing jQuery code when DOM is parsed without using ready()\n\
    \nThe custom ready() event is not entirely needed. If your JavaScript code does\
    \ not affect the DOM, you can include it anywhere in the HTML document. This means\
    \ you can avoid the ready() event altogether if your JavaScript code is not dependent\
    \ on the DOM being intact.\n\nMost JavaScript nowadays, especially jQuery code,\
    \ will involve manipulating the DOM. This means the DOM has to be fully parsed\
    \ by the browser in order for you to operate on it. This fact is why developers\
    \ have been stuck on the window.onload roller coaster ride for a couple of years\
    \ now.\n\nTo avoid using the ready() event for code that operates on the DOM,\
    \ you can simply place your code in an HTML document before the closing </body>\
    \ element. Doing so ensures the DOM is completely loaded, simply because the browser\
    \ will parse the document from top to bottom. If you place your JavaScript code\
    \ in the document after the DOM elements it manipulates, there is no need to use\
    \ the ready() event.\n\nIn the example below, I have forgone the use of ready()\
    \ by simply placing my script before the document body closes. This is the technique\
    \ I use throughout this book and on the majority of sites I build.\n\n## Sample:\
    \ sample5.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <p>\n\
    \        Hi, I'm the DOM! Script away!</p>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>        alert(jQuery('p').text()); </script>\n</body>\n\
    </html>\n```\n\nIf I were to place the `<script>` before the `<p>` element, it\
    \ would execute before the browser had loaded the `<p>` element. This would cause\
    \ jQuery to assume the document does not contain any `<p>` elements. However,\
    \ if I were to use the jQuery custom `ready()` event, then jQuery would not execute\
    \ the code until the DOM was ready. But why do this, when we have control over\
    \ the location of the `<script>` element in the document? Placing jQuery code\
    \ at the bottom of the page avoids having to use the `ready()` event. In fact,\
    \ placing all JavaScript code at the bottom of a page is a proven [performance\
    \ strategy](http://).\n\n## Grokking jQuery chaining\n\nOnce you have selected\
    \ something using the jQuery function and created a wrapper set, you can actually\
    \ chain jQuery methods to the DOM elements contained inside the set. Conceptually,\
    \ jQuery methods continue the chain by always returning the jQuery wrapper set,\
    \ which can then be used by the next jQuery method in the chain. Note: Most jQuery\
    \ methods are chainable, but not all.\n\nYou should always attempt to reuse the\
    \ wrapped set by leveraging chaining. In the code below, the `text()`, `attr()`,\
    \ and `addClass()` methods are being chained.\n\n**Sample: sample6.html**\n\n\
    ```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <a></a>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n      $('a').text('jQuery') // Sets text to jQuery,\
    \ and then returns $('a').\n         .attr('href', 'http://www.jquery.com/') //\
    \ Sets the href attribute and then returns $('a').\n         .addClass('jQuery');\
    \ // Sets class and then returns $('a').\n    })(jQuery) </script>\n</body>\n\
    </html>\n```\n\n## Breaking the chain with destructive methods\n\nAs mentioned\
    \ before, not all jQuery methods maintain the chain. Methods like `text()` can\
    \ be chained when used to set the text node of an element. However, `text()` actually\
    \ breaks the chain when used to get the text node contained within an element.\n\
    \nIn the example below, `text()` is used to set and then get the text contained\
    \ within the `<p>` element.\n\n## Sample: sample7.html\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <p></p>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        var theText = $('p').text('jQuery').text();\
    \ // Returns the string \"jQuery\".\n        alert(theText);\n        // Cannot\
    \ chain after text(). The chain is broken.\n        // A string is returned, not\
    \ the jQuery object.\n    })(jQuery) </script>\n</body>\n</html>\n```\n\nGetting\
    \ the text contained within an element using `text()` is a prime example of a\
    \ broken chain because the method will return a string containing the text node,\
    \ but not the jQuery wrapper set.\n\nIt should be no surprise that if a jQuery\
    \ method does not return the jQuery wrapper set, the chain is thereby broken.\
    \ This method is considered to be destructive.\n\n## Using destructive jQuery\
    \ methods and exiting destruction using end()\n\njQuery methods that alter the\
    \ original jQuery wrapper set selected are considered to be destructive. The reason\
    \ is that they do not maintain the original state of the wrapper set. Not to worry;\
    \ nothing is really destroyed or removed. Rather, the former wrapper set is attached\
    \ to a new set.\n\nHowever, fun with chaining does not have to stop once the original\
    \ wrapped set is altered. Using the `end()` method, you can back out of any destructive\
    \ changes made to the original wrapper set. Examine the usage of the `end()` method\
    \ in the following example to understand how to operate in and out of DOM elements."
  mdcn: "\n## 等待 DOM 就绪\n\n当 DOM 加载完毕并可供操作时，jQuery 会触发一个名为 **ready** 的自定义事件。操作 DOM\
    \ 的代码可以放在该事件的处理程序中运行。这是 jQuery 使用中常见的模式。\n\n以下示例展示了此自定义事件的三种使用方式。\n\n## 示例：sample3.html\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n    <head>\n        <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \        <script>\n            // 标准用法。\n            jQuery(document).ready(function\
    \ () { alert('DOM is ready!'); });\n\n            // 快捷方式，与上面的写法效果相同。\n      \
    \      jQuery(function () { alert('No really, the DOM is ready!'); });\n\n   \
    \         // 带安全措施的快捷方式。请注意，\n            // jQuery 函数的引用被传递给了匿名函数。\n        \
    \    jQuery(function ($) {\n                    alert('Seriously its ready!');\n\
    \                    // 可以放心使用 $()，不会有冲突。\n            });\n        </script>\n\
    \    </head>\n    <body></body>\n</html>\n```\n\n请记住，你可以根据需要为文档附加任意多个 **ready()**\
    \ 事件。并不限于一个。它们会按照添加的顺序依次执行。\n\n## 当浏览器窗口完全加载后执行 jQuery 代码\n\n通常，我们不希望等待 **window.onload**\
    \ 事件。这正是使用 **ready()** 等自定义事件的意义所在——它在窗口加载前、但 DOM 已就绪可遍历和操作时执行代码。\n\n然而，有时我们确实需要等待。虽然自定义的\
    \ **ready()** 事件在 DOM 可用时执行代码非常方便，但我们也希望使用 jQuery 在整个网页（包括所有资源）完全加载后再执行代码。\n\n\
    这可以通过为 **window** 对象附加 load 事件处理程序来实现。jQuery 提供了 **load()** 事件方法，可用于在窗口完全加载后调用一个函数。下面我提供一个使用\
    \ **load()** 事件方法的示例。\n\n## 示例：sample4.html\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n    <head>\n        <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n        <script>\n            // 将 window 传递给 jQuery 函数，并使用 load()\
    \ 方法\n            // 快捷方式附加事件处理程序。\n            jQuery(window).load(function(){\
    \      alert('The page and all its assets are loaded!'); });\n        </script>\n\
    \    </head>\n\n    <body></body>\n</html>\n```\n\n## 在包含 jQuery 之前包含所有 CSS 文件\n\
    \n从 jQuery 1.3 开始，该库不再保证在触发自定义 **ready()** 事件之前加载所有 CSS 文件。由于 jQuery 1.3 的这一变更，你应该始终在包含任何\
    \ jQuery 代码之前包含所有 CSS 文件。这将确保浏览器在继续处理 HTML 文档中稍后包含的 JavaScript 之前，已经解析了 CSS。当然，通过\
    \ CSS 引用的图片是否在浏览器解析 JavaScript 时下载，则不确定。\n\n## 使用托管版本的 jQuery\n\n当将 jQuery 嵌入到网页中时，大多数人选择下载[源代码](https://docs.google.com/)并从个人域名/主机链接到它。然而，还有其他选择，即由他人代为托管\
    \ jQuery 代码。\n\nGoogle 托管了多个版本的 jQuery 源代码，供任何人使用。这实际上非常方便。在下面的代码示例中，我使用一个 <script>\
    \ 元素来包含由 Google 托管的 jQuery 压缩版本。\n\n```\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n```\n\nGoogle 还托管了 jQuery 源代码的多个以前的版本，并且为每个版本都提供了压缩版和非压缩版。我建议在开发期间使用非压缩版，因为处理非压缩代码时调试错误总是更容易。\n\
    \n使用 Google 托管版本的 jQuery 的好处在于它可靠、快速，并且可能被缓存。\n\n## 不使用 ready() 在 DOM 解析后执行 jQuery\
    \ 代码\n\n自定义的 ready() 事件并非完全必需。如果你的 JavaScript 代码不影响 DOM，你可以将其放在 HTML 文档中的任何位置。这意味着，如果你的\
    \ JavaScript 代码不依赖于完整的 DOM，你可以完全避免使用 ready() 事件。\n\n如今大多数 JavaScript，尤其是 jQuery\
    \ 代码，都会涉及操作 DOM。这意味着 DOM 必须被浏览器完全解析后你才能对其进行操作。这一事实正是开发者多年来一直困扰于 window.onload\
    \ 这个 \"过山车\" 的原因。\n\n对于需要操作 DOM 的代码，要避免使用 ready() 事件，你只需将代码放在 HTML 文档中 `</body>`\
    \ 元素之前即可。这样做确保了 DOM 已完全加载，因为浏览器会从上到下解析文档。如果你将 JavaScript 代码放在它所操作的 DOM 元素之后，则无需使用\
    \ ready() 事件。\n\n在下面的示例中，我没有使用 ready()，而是简单地将我的脚本放在文档 body 关闭之前。这是我在本书以及我构建的大多数网站中使用的技术。\n\
    \n## 示例：sample5.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n   \
    \ <p>\n        Hi, I'm the DOM! Script away!</p>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>        alert(jQuery('p').text()); </script>\n</body>\n\
    </html>\n```\n\n如果我将 `<script>` 放在 `<p>` 元素之前，它会在浏览器加载 `<p>` 元素之前执行。这将导致 jQuery\
    \ 认为文档不包含任何 `<p>` 元素。然而，如果我使用 jQuery 自定义的 `ready()` 事件，那么 jQuery 将等到 DOM 就绪后才执行代码。但是，既然我们可以控制\
    \ `<script>` 元素在文档中的位置，为什么还要这样做呢？将 jQuery 代码放在页面底部可以避免使用 `ready()` 事件。事实上，将所有\
    \ JavaScript 代码放在页面底部是一个经过验证的[性能策略](http://)。\n\n## 理解 jQuery 链式操作\n\n一旦你使用 jQuery\
    \ 函数选择了某些元素并创建了一个包装集，你实际上可以将 jQuery 方法链接到包装集内包含的 DOM 元素上。从概念上讲，jQuery 方法通过始终返回\
    \ jQuery 包装集来延续链，该包装集随后可以被链中的下一个 jQuery 方法使用。注意：大多数 jQuery 方法是可链接的，但并非全部。\n\n\
    你应该始终尝试通过利用链式操作来重用包装集。在下面的代码中，`text()`、`attr()` 和 `addClass()` 方法被链接在一起。\n\n**示例：sample6.html**\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <a></a>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n      $('a').text('jQuery') // 设置文本为 jQuery，然后返回\
    \ $('a')。\n         .attr('href', 'http://www.jquery.com/') // 设置 href 属性，然后返回\
    \ $('a')。\n         .addClass('jQuery'); // 设置 class，然后返回 $('a')。\n    })(jQuery)\
    \ </script>\n</body>\n</html>\n```\n\n## 使用破坏性方法中断链\n\n如前所述，并非所有 jQuery 方法都保持链式操作。像\
    \ `text()` 这样的方法在用于设置元素的文本节点时可以链接。然而，`text()` 在用于获取元素内包含的文本节点时实际上会中断链。\n\n在下面的示例中，`text()`\
    \ 被用于设置然后获取 `<p>` 元素内包含的文本。\n\n## 示例：sample7.html\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<body>\n    <p></p>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        var theText = $('p').text('jQuery').text();\
    \ // 返回字符串 \"jQuery\"。\n        alert(theText);\n        // 无法在 text() 之后链接。链被中断了。\n\
    \        // 返回的是一个字符串，而不是 jQuery 对象。\n    })(jQuery) </script>\n</body>\n</html>\n\
    ```\n\n使用 `text()` 获取元素内包含的文本是链中断的一个典型例子，因为该方法将返回一个包含文本节点的字符串，而不是 jQuery 包装集。\n\
    \n如果一个 jQuery 方法不返回 jQuery 包装集，那么链就被中断了，这不足为奇。这种方法被认为是破坏性的。\n\n## 使用破坏性 jQuery\
    \ 方法并通过 end() 退出破坏\n\n会改变所选原始 jQuery 包装集的 jQuery 方法被认为是破坏性的。原因在于它们没有保持包装集的原始状态。不用担心，并没有什么被真正破坏或移除。相反，之前的包装集被附加到了一个新的集合上。\n\
    \n然而，一旦原始包装集被改变，链式操作的乐趣并不一定要停止。使用 `end()` 方法，你可以退出对原始包装集所做的任何破坏性更改。查看以下示例中 `end()`\
    \ 方法的用法，以了解如何在 DOM 元素中进退操作。\n"
