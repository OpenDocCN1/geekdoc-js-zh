    \ to animate me! </div>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($) {\n        jQuery.fx.off = true;\n     \
    \   $('div').slideUp(); // Does not animate, hides immediately.\n    })(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\nWhen **off** is set to **true**, all the\
    \ effect methods will not animate and will instead be hidden and shown immediately\
