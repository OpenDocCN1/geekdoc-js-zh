  md: "# Grokking the jQuery fading methods\n\nThree concepts need to be called out\
    \ when using the fadeIn(), fadeOut(), and fadeTo() methods.\n\n+   - Unlike other\
    \ effect methods, fading methods only adjust the opacity of an element. It is\
    \ assumed when using these effect methods that any element being faded already\
    \ has a height and width.\n- Fading animations will fade elements from their current\
    \ opacity.\n- Using the fadeOut() method will fade an element from its current\
    \ opacity, and then once 100% faded, it will change the CSS display property of\
    \ the element to \"none.\"\n\nEach of the aforementioned points is illustrated\
    \ in the code below.\n\n# Sample: sample99.html\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<body>\n    <!-- Elements being faded should have a width and\
