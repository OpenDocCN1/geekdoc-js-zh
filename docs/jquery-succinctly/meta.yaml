    ></script>\n\t<script>  (function ($) {\n\t\tfunction recursiveAnimate()\n\t\t\
    { $('div').slideToggle('slow', recursiveAnimate); };\n\t\trecursiveAnimate();\
    \ $('div:animated').text('I am animating');\n\t})(jQuery); </script>\n</body>\n\
    </html>\n```\n\n# Using **show()**, **hide()**, and **toggle()**, without animation\n\
    \nUsing the **show()**, **hide()**, and **toggle()** methods with a parameter\
    \ will cause the elements being shown or hidden to animate by changing CSS properties:\
    \ height, width, opacity, margin, padding. It is possible to skip the animations\
    \ for hiding and showing elements simply by not passing any parameters. This changes\
    \ how these methods adjust the visibility of an element. Affected elements will\
    \ simply appear or disappear without any animation by adjusting the CSS **display**\
    \ property instead.\n\n**Sample: sample96.html**\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<head>\n\t<style type=\"text/css\">\n\t\tdiv\n\t\t{\n\t\t\theight:\
    \ 100px;\n\t\t\twidth: 100px;\n\t\t\tbackground-color: red;\n\t\t\tcolor: white;\n\
    \t\t\tmargin: 5px;\n\t\t}\n\t</style>\n</head>\n<body>\n```"
