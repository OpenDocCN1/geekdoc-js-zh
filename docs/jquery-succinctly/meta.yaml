    })(jQuery); </script>\n</body>\n</html>\n```\n\nYou could also update any characters\
    \ that are contained in a string returned from `html()`. This means you can not\
    \ only update text, but also update and replace DOM elements via a regular expression.\n\
    \n# Grokking the .contents() method\n\nThe `.contents()` method can be used to\
    \ find all the child element nodes, including text nodes contained inside of an\
    \ element. However, there is a catch. If the retrieved contents contain only text\
    \ nodes, the selection will be placed inside the wrapper set as a single text\
    \ node. However, if the contents you are retrieving have one or more element nodes\
    \ amongst the text nodes, then the `.contents()` method will contain text nodes\
    \ and element nodes. Examine the code below to grasp this concept.\n\nSample:\
    \ sample48.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <p>I\
    \ love using jQuery!</p>\n    <p>I love <strong>really</strong> using jQuery!</p>\n\
    \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // Alerts \"I love using jQuery!\"\
    \ because no HTML elements exist.\n        alert($('p:first').contents().get(0).nodeValue);\n\
    \        // Alerts \"I love\".\n        alert($('p:last').contents().get(0).nodeValue);\n\
    \        // Alerts \"really\" but is an HTML element, not a text node.\n     \
    \   alert($('p:last').contents().eq(1).text());\n        // Alerts \"using jQuery!\"\
    \n        alert($('p:last').contents().get(2).nodeValue);\n    })(jQuery); </script>\n\
    </body>\n</html>\n```\n\nNotice that when an item in the wrapper set is a text\
    \ node, we have to extract the value by using `.get(0).nodeValue`. The `contents()`\
    \ method is handy for extracting text node values. It is possible to extract only\
    \ the text nodes from a DOM structure using `contents()`."
