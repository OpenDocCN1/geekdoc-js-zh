    \ id=\"oneTwoThree\"></div>\n    <div id=\"0\"></div>\n    <div id=\"zero\"><div>\n\
    \n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n<script>  (function ($) {\n        //James Padolsey filter extension.\n\
    \        jQuery.expr[':'].regex = function (elem, index, match) {\n          \
    \  var matchParams = match[3].split(','), validLabels = /^(data|css):/, attr =\
    \ {\nmethod: matchParams[0].match(validLabels) ? matchParams[0].split(':')[0]\
    \ : 'attr',\nproperty: matchParams.shift().replace(validLabels, '') }, regexFlags\
    \ = 'ig', regex = new\nRegExp(matchParams.join('').replace(/^\\s+|\\s+$/g, ''),\
    \ regexFlags);\n            return regex.test(jQuery(elem)[attr.method](attr.property));\n\
    \        }\n        // Select div's where the id attribute contains numbers.\n\
    \        alert($('div:regex(id,[0-9])').length); // Alerts \"2\".\n        //\
