  md: "# Chapter 9 Effects\n\n# Disable all jQuery effect methods\n\nIt is possible\
    \ to disable all of the animating methods jQuery provides by simply setting the\
    \ value of the **off** property to **true**.\n\n# Sample: sample92.html\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <div style=\"height: 100px; width:\
