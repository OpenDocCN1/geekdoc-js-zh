    \    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {  // Alerts middle, by filtering out\
    \ the first\n      // and last <p> elements in the wrapper set.\n      alert($('p').filter(':not(:first):not(:last)').text());\n\
    \    })(jQuery); </script>\n</body>\n</html>\n```\n\n> **注意：**\n> 使用 **filter()**\
    \ 时，始终要问自己是否绝对必要。例如，`$('p').filter(':not(:first):not(:last)')` 可以在不使用 **filter()**\
    \ 的情况下，通过将表达式作为自定义选择器传递给 jQuery 函数来编写：`$('p:not(:first):not(:last)')`。\n\n另一方面，**find()**\
    \ 方法可用于进一步查找当前选定元素的后代。可以将 **find()** 更多地视为用已经选定的元素内封装的新元素来更新或更改当前包装集。例如，下面的代码将通过使用\
    \ **find()** 将包装集从 `<p>` 元素更改为两个 `<strong>` 元素。\n\n### 示例: sample37.html\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <p><strong>first</strong></p>\n\
    \    <p>middle</p>\n    <p><strong>last</strong></p>\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n<script> (function ($) {\n  // Alerts \"strong\".\n  alert($('p').find('strong').get(0).nodeName);\n\
    })(jQuery); </script>\n</body>\n</html>\n```\n\n> **注意：**\n> 实际上，你可以使用 `andSelf()`\
    \ 将使用 `find()` 方法之前的包装集中的元素与当前元素组合起来——例如，`$('p').find('strong').andSelf()`。\n\n\
    需要记住的概念是，`filter()` 只会减少（或过滤）包装集中当前选定的元素，而 `find()` 实际上可以创建一个全新的包装元素集。\n\n> **注意：**\n\
    > `find()` 和 `filter()` 都是破坏性方法，可以通过使用 `end()` 来撤销，这将把包装集恢复到使用 `find()` 或 `filter()`\
    \ 之前的状态。\n\n## 向 `filter()` 传递函数而非表达式\n\n在匆忙创建用于选择元素的自定义过滤器之前，更合理的做法可能是简单地向遍历方法\
    \ `filter()` 传递一个函数，该函数允许你检查包装集中的每个元素是否满足特定情况。\n\n例如，假设你想用一个 `<p>` 元素包装 HTML 页面中所有尚未被此元素包装的\
    \ `<img>` 元素。\n\n你可以创建一个自定义过滤器来完成此任务，或者你可以使用 `filter()` 方法，通过向其传递一个函数来确定元素的父级是否为\
    \ `<p>` 元素，如果不是，则在将剩余的 `<img>` 元素用 `<p>` 元素包装之前，从集合中移除该元素。\n\n在以下示例中，我选择 HTML\
    \ 页面中的每个 `<img>` 元素，然后向 `filter()` 方法传递一个函数，该函数用于迭代包装集中的每个元素（使用 `this`），检查 `<img>`\
    \ 元素的父元素是否为 `<p>` 元素。\n"
