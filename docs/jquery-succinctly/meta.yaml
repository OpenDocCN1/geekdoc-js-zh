    ></script>\n    <script> (function ($) {\n        $('div').hover(function () \n\
    \        { $(this).stop().animate({ left: 75 }, 'fast'); },\n          function\
    \ () { $(this).stop().animate({ left: 20 }, 'fast'); });\n    })(jQuery); </script>\n\
    </body>\n</html>\n```\n\nRemove the **stop()** methods from the code and roll\
    \ the mouse over the element several times to see the ghost animations occur.\
    \ Continuously rolling over the element in the page will result in animation buildup,\
    \ which is typically not the desired result.\n\n**Notes:**\nAdditionally, it is\
    \ possible to not only stop the current animation in the queue for the select\
