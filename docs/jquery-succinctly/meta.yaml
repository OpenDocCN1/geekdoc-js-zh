- img_proc: true
  md: "In addition to this list of standard handlers, you can also leverage `bind()`\
    \ to attach jQuery custom handlers—e.g. `mouseenter` and `mouseleave`—as well\
    \ as any custom handlers you may create.\n\nTo remove standard handlers or custom\
    \ handlers, we simply pass the `unbind()` method the handler name or custom handler\
    \ name that needs to be removed—e.g. `jQuery('a').unbind('click')`. If no parameters\
    \ are passed to `unbind()`, it will remove all handlers attached to an element.\n\
    \nThese concepts just discussed are expressed in the code example below.\n\n#\
    \ Sample: sample65.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <input type=\"text\" value=\"click me\" />\n    <br />\n    <br />\n    <button>remove\
    \ events</button>\n    <div id=\"log\" name=\"log\"></div>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n      // Bind events\n      $('input').bind('click',\
    \ function () { alert('You clicked me!'); });\n      $('input').bind('focus',\
    \ function () {\n          // alert and focus events are a recipe for an endless\
    \ list of dialogs\n          // we will log instead\n          $('#log').html('You\
    \ focused this input!');\n      });\n      // Unbind events\n      $('button').click(function\
    \ () {\n          // Using shortcut binding via click()\n          $('input').unbind('click');\n\
    \          $('input').unbind('focus');\n          // Or, unbind all events   \
    \  // $('button').unbind();\n      });\n    })(jQuery); </script>\n</body>\n</html>\n\
    ```\n\n> **Notes:**\njQuery provides several shortcuts to the `bind()` method\
    \ for use with all standard DOM events, which excludes custom jQuery events like\
    \ `mouseenter` and `mouseleave`. Using these shortcuts simply involves substituting\
    \ the event's name as the method name—e.g. `.click()`, `.mouseout()`, `.focus()`."
