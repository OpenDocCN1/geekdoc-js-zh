- md: "## Determining if a check box or radio button is selected or cleared\n\nWe\
    \ can determine if a check box input or radio button input is selected or cleared\
    \ by using the :checked form filter. Examine the code below for several usages\
    \ of the :checked filter.\n\n**Notes:** If the check box or radio button is already\
    \ selected, using val() will not clear the input element.\n\nSample: sample57.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <input checked=\"\
    checked\" type=\"checkbox\" />\n    <input checked=\"checked\" type=\"radio\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n        // Alerts \"true\".\n        alert($('input:checkbox').is(':checked'));\n\
    \        // Or, added to wrapper set if checked. Alerts \"1\".\n        alert($('input:checkbox:checked').length);\n\
    \        // Alerts \"true\".\n        alert($('input:radio').is(':checked'));\n\
    \        // Or, added to wrapper set if checked. Alerts \"1\".\n        alert($('input:radio:checked').length);\n\
    \    })(jQuery); </script>\n</body>\n</html>\n```\n\n## How to determine if a\
    \ form element is hidden\n\nYou can determine if a form element is hidden using\
    \ the :hidden form filter. Examine the code below for several usages of the :checked\
    \ filter.\n\nSample: sample58.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<body>\n    <input type=\"hidden\" />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // Alerts \"true\".\n      \
    \  alert($('input').is(':hidden'));\n        // Or, added to wrapper set if hidden.\
    \ Alerts \"1\".\n        alert($('input:hidden').length);\n    })(jQuery); </script>\n\
    </body>\n</html>\n```\n\n## Setting/getting the value of an input element\n\n\
    The `val()` method can be used to set and get the attribute value of an input\
    \ element (button, checkbox, hidden, image, password, radio, reset, submit, text).\
    \ Below, I set the value for each input in `val()` and then alert the value using\
    \ the `val()` method.\n\nSample: sample59.html\n\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<body>\n    <input type=\"button\" />\n    <input type=\"checkbox\"\
    \ />\n    <input type=\"hidden\" />\n    <input type=\"image\" />\n    <input\
    \ type=\"password\" />\n    <input type=\"radio\" />\n    <input type=\"reset\"\
    \ />\n    <input type=\"submit\" />\n    <input type=\"text\" />\n    <script\
    \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n        $('input:button').val('I am a button');\n\
    \        $('input:checkbox').val('I am a check box');\n        $('input:hidden').val('I\
    \ am a hidden input');\n        $('input:image').val('I am an image');\n     \
    \   $('input:password').val('I am a password');\n        $('input:radio').val('I\
    \ am a radio');\n        $('input:reset').val('I am a reset');\n        $('input:submit').val('I\
    \ am a submit');\n        $('input:text').val('I am a text');\n        // Alerts\
    \ input's value attribute.\n        alert($('input:button').val());\n        alert($('input:checkbox').val());\n\
    \        alert($('input:hidden').val());\n        alert($('input:image').val());\n\
    \        alert($('input:password').val());\n        alert($('input:radio').val());\n\
    \        alert($('input:reset').val());\n        alert($('input:submit').val());\n\
    \        alert($('input:text').val());\n    })(jQuery); </script>\n</body>\n</html>\n\
    ```\n\n## Setting/getting the selected option of a select element\n\nUsing the\
    \ `val()` method, you can set the selected value of a `<select>` element by passing\
    \ the `val()` method a string representing the value assigned to the `<option>`\
    \ element.\n\nTo get the value of the `<select>` element, use the `val()` method\
    \ again to determine which option is selected. The `val()` method in this scenario\
    \ will return the selected option's attribute value.\n\n### Sample: sample60.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <select id=\"s\" name=\"\
    s\">\n        <option value=\"option1\">option one</option>\n        <option value=\"\
    option2\">option two</option>\n    </select>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // Set the selected option in\
    \ the select element to \"option two\".\n        $('select').val('option2');\n\
    \        // Alerts \"option2\".\n        alert($('select').val());\n    })(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n## Setting/getting selected options of a\
    \ multi-select element\n\nUsing the `val()` method, you can set the selected values\
    \ of a multi-select element by passing the `val()` method an array containing\
    \ the corresponding values.\n\nTo get the selected options in a multi-select element,\
    \ we again use the val() method to retrieve an array of the options that are selected.\
    \ The array will contain the value attributes of the selected options.\n\n###\
    \ Sample: sample61.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <select size=\"4\" multiple=\"multiple\">\n        <option value=\"option1\"\
    >option one</option>\n        <option value=\"option2\">option two</option>\n\
    \        <option value=\"option3\">option three</option>\n        <option value=\"\
    option4\">option four</option>\n    </select>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n        // Set the value of the selected\
    \ options.\n        $('select').val(['option2', 'option4']);\n        // Get the\
    \ selected values.\n        alert($('select').val().join(', ')); // Alerts, \"\
    option2, option4\".\n    })(jQuery); </script>\n</body>\n</html>\n```\n\n## Setting/getting\
    \ text contained within a textarea\n\nYou can set the text node contents of a\
    \ `<textarea>` element by passing the val() method a text string to be used as\
    \ the text. To get the value of a `<textarea>` element, we again use the val()\
    \ method to retrieve the text contained within.\n\n### Sample: sample62.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <textarea></textarea>\n\
    \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // Set the text contained within.\n\
    \        $('textarea').val('I am a textarea');\n        // Alerts \"I am a textarea\"\
    .\n        alert($('textarea').val());\n    })(jQuery); </script>\n</body>\n</html>\n\
    ```\n\n## Setting/getting the value attribute of a button element\n\nYou can set\
    \ the value attribute of a button element by passing the `val()` method a text\
    \ string.\nTo get the value of a button element, use the `val()` method again\
    \ to retrieve the text.\n\n### Sample: sample63.html\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <button>Button</button>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // Set the value: <button value=\"\
    I am a Button Element\">.\n        $('button').val('I am a Button Element')\n\
    \        // Alerts \"I am a Button Element\".\n        alert($('button').val());\n\
    \    })(jQuery); </script>\n</body>\n</html>\n```\n\n## Editing select elements\n\
    \njQuery makes some of the common tasks associated with editing select elements\
    \ trivial. Below are some of those tasks with coded examples.\n\n```javascript\n\
    // Add options to a select element at the end.\n$('select').append('<option value=\"\
    \">option</option>');\n// Add options to the start of a select element.\n$('select').prepend('<option\
    \ value=\"\">option</option>');\n// Replace all the options with new options.\n\
    $('select').html('<option value=\"\">option</option><option value=\"\">option</option>');\n\
    // Replace items at a certain index using the :eq() selecting filter to\n// select\
    \ the element, and then replace it with the .replaceWith() method.\n$('select\
    \ option:eq(1)').replaceWith('<option value=\"\">option</option>');\n// Set the\
    \ select elements' selected option to index 2.\n$('select option:eq(2)').attr('selected',\
    \ 'selected');\n// Remove the last option from a select element.\n$('select option:last').remove();\n\
    // Select an option from a select element via its\n// order in the wrapper set\
    \ using custom filters.\n$('#select option:first');\n```"
