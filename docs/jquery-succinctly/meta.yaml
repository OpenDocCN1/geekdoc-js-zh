  md: "You can attach unlimited handlers to a single DOM element using jQuery.\njQuery\
    \ provides the one() event handling method to conveniently bind an event to DOM\n\
    elements that will be executed once and then removed. The one() method is just\
    \ a wrapper\nfor bind() and unbind().\n\n# Programmatically invoke a specific\
    \ handler via short event methods\n\nThe shortcut syntax—e.g. .click(), mouseout(),\
    \ and focus()—for binding an event handler\nto a DOM element can also be used\
    \ to invoke handlers programmatically. To do this, simply use\nthe shortcut event\
    \ method without passing it a function. In theory, this means that we can bind\
    \ a\nhandler to a DOM element and then immediately invoke that handler. Below,\
    \ I demonstrate this\nvia the click() event.\n\n# Sample: sample66.html\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\t<a>Say Hi</a>\n\t<!--clicking this\
    \ element will alert \"hi\" -->\n\t<a>Say Hi</a>\n\t<!--clicking this element\
    \ will alert \"hi\" -->\n\t<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n\t<script>\n\t\t(function ($) {\n\t\t\t// Bind a click handler to\
    \ all <a> and immediately invoke their handlers.\n\t\t\t$('a').click(function\
    \ () { alert('hi') }).click();\n\t\t\t// Page will alert twice. On page load,\
    \ a click\n\t\t\t// is triggered for each <a> in the wrapper set.\n\t\t})(jQuery);\n\
    \t</script>\n</body>\n</html>\n```\n\n> **Notes:**\nIt is also possible to use\
    \ the event trigger() method to invoke specific handlers—e.g.\njQuery('a').click(function(){\
    \ alert('hi') }).trigger('click'). This will also work with\nnamespaced and custom\
    \ events.\n\n# jQuery normalizes the event object\n\njQuery normalizes the event\
    \ object according to W3C standards. This means that when the\nevent object is\
    \ passed to a function handler, you do not have to worry about browser-specific\n\
    implementations of the event object (e.g. Internet Explorer's window.event). You\
    \ can use the\nfollowing attributes and methods of the event object worry-free\
    \ from browser differences\nbecause jQuery normalizes the event object."
