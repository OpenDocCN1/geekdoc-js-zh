    \    };\n    })(jQuery); jQuery('#counter1').count();\n    </script>\n</body>\n\
    </html>\n```\n\n> **注意：**\n通过将插件添加到 **jQuery.fn** 对象，我们本质上是在说我们的插件希望使用 jQuery\
    \ 函数来选择一个上下文（DOM 元素）。如果你的插件不需要特定的上下文（换句话说，一组需要在其上操作的 DOM 元素），你可能不需要将此插件附加到 `$.fn`。将其添加为\
    \ jQuery 命名空间中的实用函数可能更有意义。\n\n## 示例： sample84.html\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <div id=\"counter1\"></div>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script>  (function ($) {\n    $.fn.count = function () {\n        // \"\
