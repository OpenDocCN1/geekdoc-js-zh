    \ href=\"http://www.jQuery.com\">jQuery</a>')\n\t\t\t.appendTo('body');\n\t})(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\nThe point here is that just because you\
    \ remove() elements does not mean they are removed from the jQuery wrapper set."
  - "[PAGE 58]\n\n# Chapter 5 HTML Forms\n\n# Disable/enable form elements\n\nUsing\
    \ jQuery, you can easily disable form elements by setting the disabled attribute\
    \ value of a form element to disabled. To do this, we simply select an input,\
