    ></script>\n    <script> (function ($) {\n        $('#button')\n            .attr('disabled',\
    \ 'disabled');\n    })(jQuery); </script>\n</body>\n</html>\n```\n\nTo enable\
    \ a disabled form element, we simply remove the disabled attribute using `removeAttr()`\
    \ or set the disabled attribute value to be empty using `attr()`.\n\n# Sample:\
    \ sample52.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <input\
