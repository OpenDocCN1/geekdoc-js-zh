    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <div>\n        <div>\n\
    \            <div id=\"context\"><a href=\"#\">jQuery</a></div>\n        </div>\n\
    \    </div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // Alerts \"object HTMLDocument\"\
    \ in Firefox.\n        // Same as $('a', document).context;\n        alert($('a').context);\n\
    \        // Alerts \"object HTMLDivElement\" in Firefox.\n        alert($('a',\
    \ $('#context')[0]).context);\n    })(jQuery); </script>\n</body>\n</html>\n```\n\
    \n## Creating entire DOM structure, including DOM events, in a single chain\n\n\
    By leveraging chaining and jQuery methods, you can create not only a single DOM\
    \ element, but entire DOM structures. Below I create an unordered list of jQuery\
    \ links that I then add to the DOM.\n\n**Sample: sample21.html**\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        jQuery('<ul></ul>')\n      \
    \      .append('<li><a>jQuery.com</a></li><li><a>jQuery Documentation</a></li>')\n\
    \            .find('a:first')\n            .attr('href', 'http://www.jquery.com')\n\
    \            .end()\n            .find('a:eq(1)')\n            .attr('href', 'http://docs.jquery.com')\n\
    \            .end()\n            .appendTo('body');\n    })(jQuery); </script>\n\
    </body>\n</html>\n```\n\n```\n.attr('href', 'http://docs.jquery.com')\n.end()\n\
    .find('a')\n.click(function () { return confirm('Leave this page?'); })\n.end()\n\
    .appendTo('body');\n})(jQuery); </script>\n</body>\n</html>\n```\n\nThe concept\
    \ you need to take away from the previous example is that jQuery can be used to\
    \ craft and operate complex DOM structures. Using jQuery methods alone, you can\
    \ whip up most any DOM structure you might need.\n\n# Chapter 2 Selecting\n\n\
    ## Custom jQuery filters can select elements when used alone\n\nIt is not necessary\
    \ to provide an actual element in conjunction with a filter, such as `$('div:hidden')`.\
    \ It is possible to simply pass the filter alone, anywhere a selector expression\
    \ is expected.\n\nSome examples:\n\n```\n// Selects all hidden elements\n$(':hidden');\n\
    // Selects all div elements, then selects only even elements\n$('div').filter(':even');\n\
    ```\n\n## Grokking the :hidden and :visible filter\n\nThe custom jQuery selector\
    \ filters `:hidden` and `:visible` do not take into account the CSS visibility\
    \ property as one might expect. The way jQuery determines if an element is hidden\
    \ or visible is if the element consumes any space in the document. To be exact,\
    \ an element is visible if its browser-reported `offsetWidth` or `offsetHeight`\
    \ is greater than 0. That way, an element that might have a CSS `display` value\
    \ of `block` contained in an element with a `display` value of `none` would accurately\
    \ report that it is not visible.\n\nExamine the code carefully and make sure you\
    \ understand why the value returned is `true` even though the `<div>` being selected\
    \ has an inline style of `display:block`.\n\n**Sample: sample22.html**\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <div id=\"parentDiv\" style=\"\
    display: none;\">\n        <div id=\"childDiv\" style=\"display: block;\"></div>\n\
    \    </div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n        // Returns true because the parent\
    \ div is hidden, so the\n        // encapsulated div reports zero offsetWidth\
    \ and offsetHeight.\n        alert($('#childDiv').is(':hidden'));\n    })(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n## Using the **is()** method to return a\
    \ Boolean value\n\nIt is often necessary to determine if the selected set of elements\
    \ does, in fact, contain a specific element. Using the **is()** method, we can\
    \ check the current set against an expression/filter. The check will return **true**\
    \ if the set contains at least one element that is selected by the given expression/filter.\
    \ If it does not contain the element, a **false** value is returned. Examine the\
    \ following code:\n\n**Sample: sample23.html**\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<body>\n    <div id=\"i0\">jQuery</div>\n    <div id=\"i1\">jQuery</div>\n\
    \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function($){\n        // Returns true.\n        alert($('div').is('#i1'));\n\
    \        // Returns false. Wrapper set contains no <div> with id=\"i2\".\n   \
    \     alert($('div').is('#i2'));\n        // Returns false. Wrapper set contains\
    \ no hidden <div>\n        alert($('div').is(':hidden'));\n    })(jQuery);  </script>\n\
    </body>\n</html>\n```\n\nIt should be apparent that the second **alert()** will\
    \ return a value of false because our wrapper set did not contain a **<div>**\
    \ that had an **id** attribute value of **i2**. The **is()** method is quite handy\
    \ for determining if the wrapper set contains a specific element.\n\n> **Notes:**\n\
    > As of jQuery 1.3, the **is()** method supports all expressions. Previously,\
    \ complex expressions such as those containing hierarchy selectors (such as +,\
    \ ~, and >) always returned **true**.\n> Filter is used by other internal jQuery\
    \ functions. Therefore, all rules that apply there, apply here, as well.\n> Some\
    \ developers use **is('.class')** to determine if an element has a specific class.\
    \ Don't forget that jQuery already has a method for doing this called **hasClass('class')**,\
    \ which can be used on elements that contain more than one class value. But truth\
    \ be told, **hasClass()** is just a convenient wrapper for the **is()** method.\n\
    \n## You can pass jQuery more than one selector expression\n\nYou can provide\
    \ the jQuery function's first parameter several expressions separated by a comma:\
    \ `$('expression, expression, expression')`. In other words, you are not limited\
    \ to selecting elements using only a single expression. For example, in the example\
    \ below, I am passing the jQuery function three expressions separated by a comma.\n\
    \n**Sample: sample24.html**\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <div>jQuery </div>\n    <p>is the </p>\n    <ul>\n        <li>best!</li>\n\
    \    </ul>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n        // Alerts jQuery is the best!\n\
    \        alert($('div, p, ul li').text());\n        // Inefficient way. Alerts\
    \ jQuery is the best!\n        alert($('div').text() + $('p').text() + $('ul li').text());\n\
    \    })(jQuery); </script>\n</body>\n</html>\n```\n\nEach of these expressions\
    \ selects DOM elements that are all added to the wrapper set. We can then operate\
    \ on these elements using jQuery methods. Keep in mind that all the selected elements\
    \ will be placed in the same wrapper set. An inefficient way to do this would\
    \ be to call the jQuery function three times, once for each expression.\n\n##\
    \ Checking wrapper set .length to determine selection\n\nIt is possible to determine\
    \ if your expression has selected anything by checking if the wrapper set has\
    \ a length. You can do so by using the array property `length`. If the `length`\
    \ property does not return 0, then you know at least one element matches the expression\
    \ you passed to the jQuery function. For example, in the code below we check the\
    \ page for an element with an `id` of \"notHere.\" Guess what? It is not there!\n\
    \n**Sample: sample25.html**\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n        // Alerts \"0\".\n        alert($('#notHere').length);\n\
    \    })(jQuery); </script>\n</body>\n</html>\n```\n\n> **Notes:**\n> If it is\
    \ not obvious, the length property can also report the number of elements in the\
    \ wrapper set—stated another way, how many elements were selected by the expression\
    \ passed to the jQuery function.\n\n## Creating custom filters for selecting elements\n\
    \nThe capabilities of the jQuery selector engine can be extended by creating your\
    \ own custom filters. In theory, all you are doing here is building upon the custom\
    \ selectors that are already part of jQuery. For example, say we would like to\
    \ select all elements on a Web page that are absolutely positioned. Since jQuery\
    \ does not already have a custom :positionAbsolute filter, we can create our own.\n\
    \n**Sample: sample26.html**\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <div style=\"position: absolute\">absolute</div>\n    <span style=\"position:\
    \ absolute\">absolute</span>\n    <div>static</div>\n    <div style=\"position:\
    \ absolute\">absolute</div>\n    <div>static</div>\n    <span style=\"position:\
    \ absolute\">absolute</span>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> function ($) {\n        // Define custom filter by extending\
    \ $.expr[':']\n        $.expr[':'].positionAbsolute = function (element)\n   \
    \     { return $(element).css('position') === 'absolute'; };\n        // How many\
    \ elements in the page are absolutely positioned?\n        alert($(':positionAbsolute').length);\
    \ // Alerts \"4\"\n        // How many div elements are absolutely positioned?\n\
    \        alert($('div:positionAbsolute').length); // Alerts \"2\".\n```"
  mdcn: "\n可以使用 **context** 属性来确定 jQuery 函数执行 DOM 查询时的上下文。以下我通过两个编码示例展示如何获取 context\
