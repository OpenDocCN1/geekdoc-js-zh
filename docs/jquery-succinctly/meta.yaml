  md: "# You can pass jQuery more than one selector expression\n\nYou can provide\
    \ the jQuery function's first parameter several expressions separated by a comma:\
    \ `$('expression, expression, expression')`. In other words, you are not limited\
    \ to selecting elements using only a single expression. For example, in the example\
    \ below, I am passing the jQuery function three expressions separated by a comma.\n\
    \n# Sample: sample24.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <div>jQuery </div>\n    <p>is the </p>\n    <ul>\n        <li>best!</li>\n\
    \    </ul>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n        // Alerts jQuery is the best!\n\
    \        alert($('div, p, ul li').text());\n        // Inefficient way. Alerts\
    \ jQuery is the best!\n        alert($('div').text() + $('p').text() + $('ul li').text());\n\
    \    })(jQuery); </script>\n</body>\n</html>\n```\n\nEach of these expressions\
    \ selects DOM elements that are all added to the wrapper set. We can then operate\
    \ on these elements using jQuery methods. Keep in mind that all the selected elements\
    \ will be placed in the same wrapper set. An inefficient way to do this would\
    \ be to call the jQuery function three times, once for each expression.\n\n# Checking\
    \ wrapper set .length to determine selection\n\nIt is possible to determine if\
    \ your expression has selected anything by checking if the wrapper set has a length.\
    \ You can do so by using the array property `length`. If the `length` property\
    \ does not return 0, then you know at least one element matches the expression\
    \ you passed to the jQuery function. For example, in the code below we check the\
    \ page for an element with an `id` of \"notHere.\" Guess what? It is not there!\n\
    \n# Sample: sample25.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n```"
