    # Code examples


    This book relies heavily on code examples to express jQuery concepts. The code
    samples are available at [https://bitbucket.org/syncfusion/jquery-succinctly](https://bitbucket.org/syncfusion/jquery-succinctly).


    Code samples are provided as individual HTML files. A Visual Studio 2010 project
