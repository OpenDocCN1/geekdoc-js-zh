    \ </script>\n</body>\n</html>\n```\n\n## Grokking the **stop()** animation method\n\
    \nIt is often necessary to stop an animation currently in progress before starting\
    \ another. For example, when using the custom **mouseenter** and **mouseleave**\
    \ events (or **hover()** method), you may unintentionally trigger an element that\
    \ is already animating due to a previous **mouseenter** or **mouseleave** event.\
    \ This causes a buildup of queued animations, which results in a sluggish interface.\
    \ To avoid this, simply use the **stop()** method to stop the current animation\
    \ before starting a new one.\n\n### Sample: sample94.html\n\n```\n<!DOCTYPE html>\n\
