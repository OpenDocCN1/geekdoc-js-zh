    \  alert($('li:nth-child(0)').text()); // Alerts nothing. There is no 0 index.\n\
    \    })(jQuery); </script>\n</body>\n</html>\n```\n\n## 使用正则表达式通过搜索属性值选择元素\n\n\
    当用于选择元素的 jQuery 属性过滤器不够强大时，可以尝试使用正则表达式。James Padolsey 编写了一个不错的过滤选择器扩展，允许我们创建自定义正则表达式进行过滤。我在这里提供了一个代码示例，但请务必查看\
    \ http://james.padolsey.com 上的文章以获取所有详细信息。\n\n### 示例: sample33.html\n\n```html\n\
