    \   // By index.\n        alert($('li:nth-child(1)').text()); // Alerts \"1\"\
    .\n        // By even.\n        alert($('li:nth-child(even)').text()); // Alerts\
    \ \"246810\".\n        // By odd.\n        alert($('li:nth-child(odd)').text());\
    \ // Alerts \"13579\".\n        // By equation.\n        alert($('li:nth-child(3n)').text());\
    \ // Alerts \"369\".\n        // Remember this filter uses a 1 index.\n      \
    \  alert($('li:nth-child(0)').text()); // Alerts nothing. There is no 0 index.\n\
    \    })(jQuery); </script>\n</body>\n</html>\n```\n\n## Selecting elements by\
    \ searching attribute values using regular expressions\n\nWhen the jQuery attribute\
    \ filters used to select elements are not robust enough, try using regular expressions.\
    \ James Padolsey has written a nice extension to the filter selectors that will\
    \ allow us to create custom regular expressions for filtering. I have provided\
    \ a code example here, but make sure you also check out the article on http://james.padolsey.com\
    \ for all the details.\n\n### Sample: sample33.html\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <div id=\"123\"></div>\n    <div id=\"oneTwoThree\"\
    ></div>\n    <div id=\"0\"></div>\n    <div id=\"zero\"><div>\n\n<script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    <script>  (function ($) {\n        //James Padolsey filter extension.\n      \
    \  jQuery.expr[':'].regex = function (elem, index, match) {\n            var matchParams\
    \ = match[3].split(','), validLabels = /^(data|css):/, attr = {\nmethod: matchParams[0].match(validLabels)\
    \ ? matchParams[0].split(':')[0] : 'attr',\nproperty: matchParams.shift().replace(validLabels,\
    \ '') }, regexFlags = 'ig', regex = new\nRegExp(matchParams.join('').replace(/^\\\
    s+|\\s+$/g, ''), regexFlags);\n            return regex.test(jQuery(elem)[attr.method](attr.property));\n\
    \        }\n        // Select div's where the id attribute contains numbers.\n\
    \        alert($('div:regex(id,[0-9])').length); // Alerts \"2\".\n        //\
    \ Select div's where the id attribute contains the string \"Two\".\n        alert($('div:regex(id,\
    \ Two)').length); // Alerts \"1\".\n    })(jQuery); </script>\n</body>\n</html>\n\
    ```\n\n## Difference between selecting direct children vs. all descendants\n\n\
    Direct children elements only can be selected by using the combiner > or by way\
    \ of the children() traversing method. All descendants can be selected by using\
    \ the * CSS expression. Make sure you clearly understand the difference between\
    \ the two. The example below demonstrates the differences.\n\n### Sample: sample34.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <div>\n        <p><strong><span>text</span></strong></p>\n\
    \        <p><strong><span>text</span></strong></p>\n    </div>\n    <script\n\
    src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n        // Each statement alerts \"2\" because\
    \ there are\n        // two direct child <p> elements inside of <div>.\n     \
    \   alert($('div').children().length);\n        // or\n        alert($('>*', 'div').length);\n\
    \        alert($('div').find('>*').length);\n\n        // Each statement alerts\
    \ 6 because the <div> contains\n        // 6 descendants, not including the text\
    \ node.\n        alert($('div').find('*').length);\n        // or\n        alert($('*',\
    \ 'div').length);\n    })(jQuery); </script>\n</body>\n</html>\n```\n\n## Selecting\
    \ direct child elements when a context is already set\n\nIt is possible to use\
    \ the combiner > without a context to select direct child elements when a context\
    \ has already been provided. Examine the code below.\n\n### Sample: sample35.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <ul id=\"firstUL\"\
    >\n        <li>text</li>\n        <li>\n            <ul id=\"secondUL\">\n   \
    \             <li>text</li>\n                <li>text</li>\n            </ul>\n\
    \        </li>\n        <li>text</li>\n    </ul>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // Select only the direct <li>\
    \ children. Alerts \"3\".\n        alert($('#ul:first').find('> li').length);\
    \ // or\n        alert($(\"> li\", 'ul:first').length);\n    }\n    )(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\nBasically, '> element' can be used as an\
    \ expression when a context has already been determined.\n\n## Chapter 3 Traversing\n\
    \n## Difference between **find()** and **filter()** methods\n\nThe **filter()**\
    \ method is used to filter the current set of elements contained within the wrapper\
    \ set. Its usage should be left to tasks that require filtering a set of elements\
    \ that are already selected. For example, the code below will filter the three\
    \ `<p>` elements contained in the wrapper set.\n\n### Sample: sample36.html\n\n\
    ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <p><strong>first</strong></p>\n\
    \    <p>middle</p>\n    <p><strong>last</strong></p>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {  // Alerts middle, by filtering out\
    \ the first\n      // and last <p> elements in the wrapper set.\n      alert($('p').filter(':not(:first):not(:last)').text());\n\
    \    })(jQuery); </script>\n</body>\n</html>\n```\n\n> **Notes:**\n> When using\
    \ **filter()**, always ask yourself if it is absolutely necessary. For example,\
    \ `$('p').filter(':not(:first):not(:last)')` could be written without **filter()**\
    \ by passing the jQuery function the expressions as custom selectors `$('p:not(:first):not(:last)')`.\n\
    \nThe **find()** method, on the other hand, can be used to further find descendants\
    \ of the currently selected elements. Think of **find()** more like updating or\
    \ changing the current wrapped set with new elements that are encapsulated within\
    \ the elements that are already selected. For example, the code below will change\
    \ the wrapped set from `<p>` elements to two `<strong>` elements by using **find()**.\n\
    \n### Sample: sample37.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
    <body>\n    <p><strong>first</strong></p>\n    <p>middle</p>\n    <p><strong>last</strong></p>\n\
    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n<script> (function ($) {\n  // Alerts \"strong\".\n  alert($('p').find('strong').get(0).nodeName);\n\
    })(jQuery); </script>\n</body>\n</html>\n```\n\n> **Notes:**\n> You can actually\
    \ combine the elements in the wrapper previous to using the `find()` method with\
    \ the current elements by using `andSelf()`—e.g. `$('p').find('strong').andSelf()`.\n\
    \nThe concept to take away is that `filter()` will only reduce (or filter) the\
    \ currently selected elements in the wrapper set while `find()` can actually create\
    \ an entirely new set of wrapped elements.\n\n> **Notes:**\n> Both `find()` and\
    \ `filter()` are destructive methods that can be undone by using `end()`, which\
    \ will revert the wrapped set back to its previous state before `find()` or `filter()`\
    \ were used.\n\n## Passing `filter()` a function instead of an expression\n\n\
    Before you run off and create a custom filter for selecting elements, it might\
    \ make more sense to simply pass the traversing `filter()` method a function that\
    \ will allow you to examine each element in the wrapper set for a particular scenario.\n\
    \nFor example, let's say you would like to wrap all `<img>` elements in an HTML\
    \ page with a `<p>` element that is currently not wrapped with this element.\n\
    \nYou could create a custom filter to accomplish this task, or you could use the\
    \ `filter()` method by passing it a function that will determine if the element's\
    \ parent is a `<p>` element, and if not, then remove the element from the set\
    \ before you wrap the `<img>` elements remaining in the set with a `<p>` element.\n\
    \nIn the following example, I select every `<img>` element in the HTML page, and\
    \ then I pass the `filter()` method a function that is used to iterate over each\
    \ element (using `this`) in the wrapper set, checking to see if the `<img>` elements'\
    \ parent element is a `<p>` element."
  mdcn: "\n## 深入理解 :nth-child() 过滤器\n\n:nth-child() 过滤器有许多用途。例如，假设你只想选择 `<ul>` 元素内每第三个\
    \ `<li>` 元素。使用 :nth-child() 过滤器可以实现。请研究以下代码，以更好地理解如何使用 :nth-child() 过滤器。\n\n###\
    \ 示例: sample32.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
