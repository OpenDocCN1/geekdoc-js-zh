  md: "# How to determine if a form element is disabled or enabled\n\nUsing the jQuery\
    \ form filter expressions `:disabled` or `:enabled`, it is rather easy to select\
    \ and determine (Boolean value) if a form element is disabled or enabled. Examine\
    \ the code below for clarification.\n\n# Sample: sample53.html\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <input name=\"button\" type=\"button\"\
    \ id=\"button1\" />\n    <input name=\"button\" type=\"button\" id=\"button2\"\
    \ disabled=\"disabled\" />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n      // Is it enabled?\n      alert($('#button1').is(':enabled'));\
    \ // Alerts true.\n      // Or, using a filter.\n      alert($('#button1:enabled').length);\
