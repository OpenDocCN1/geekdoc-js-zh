    # Chapter 10 AJAX


    # The jQuery ajax() function is the lowest-level abstraction


    The jQuery ajax() function is the lowest level of abstraction available for XMLHttpRequests
    (aka AJAX). All the other jQuery AJAX functions, such as load(), leverage the
    ajax() function. Using the ajax() function provides the greatest functionality
    available for XMLHttpRequests. jQuery also provides other higher-level abstractions
    for doing very specific types of XMLHttpRequests. These functions are essentially
    shortcuts for the ajax() method.


    These shortcut methods are:


    +   - load()

    - get()

    - getJSON()

    - getScript()

    - post()


    The point to take away is that while the shortcuts are nice at times, they all
    use ajax() behind the scenes. And, when you want all the features and customizations
    that jQuery offers when it comes to AJAX, then you should just use the ajax()
    method.


    > **Notes:**

    By default, the ajax() and load() AJAX functions both use the GET HTTP protocol.


    # jQuery supports cross-domain JSONP


    JSON with Padding (JSONP) is a technique that allows the sender of an HTTP request,
    where JSON is returned, to provide a name for a function that is invoked with
    the JSON object as a parameter of the function. This technique does not use XHR.
    It uses the script element so data can be pulled into any site, from any site.
    The purpose is to circumvent the same-source policy limitations of XMLHttpRequest.


    Using the getJSON() jQuery function, you can load JSON data from another domain
    when a JSONP callback function is added to the URL. As an example, here is what
    a URL request would look like using the Flickr API.


    http://api.flickr.com/services/feeds/photos_public.gne?tags=resig&tagmode=all&format=json&jsoncallback=?'
  - "[PAGE 99]\n\nThe **?** value is used as a shortcut that tells jQuery to call\
    \ the function that is passed as a parameter of the **getJSON()** function. You\
    \ could replace the **?** with the name of another function if you do not want\
    \ to use this shortcut.\n\nBelow, I am pulling into a Web page, using the Flickr\
    \ JSONP API, the most recent photos tagged with “resig.” Notice that I am using\
    \ the **?** shortcut so jQuery will simply call the callback function I provided\
    \ the **getJSON()** function. The parameter passed to the callback function is\
    \ the JSON data requested.\n\n# Sample: sample100.html\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n\n$.getJSON(\"http://api.flickr.com/services/feeds/photos_public.gne?tags=resig&tagmode=all&format=json&jsoncallback=?\"\
    ,\n        // Using ? just means call the callback function provided.\n      \
    \  function (data) { // Data is the JSON object from Flickr.\n            $.each(data.items,\
    \ function (i, item) { $('<img />').attr(\"src\",\nitem.media.m).appendTo('body');\
    \ if (i == 30) return false; });\n        });\n    })(jQuery); </script>\n</body>\n\
    </html>\n```\n\n> **Notes:**\nMake sure you check the API of the service you are\
    \ using for the correct usage of the callback. As an example, Flickr uses the\
    \ name **jsoncallback=?** whereas Yahoo! and Digg use the name **callback=?**.\n\
    \n# Stop a browser from caching XHR requests\n\nWhen doing an XHR request, Internet\
    \ Explorer will cache the response. If the response contains static content with\
    \ a long shelf life, caching may be a good thing. However, if the content being\
    \ requested is dynamic and could change by the second, you will want to make sure\
    \ that the request is not cached by the browser. One possible solution is to append\
    \ a unique query string value to the end of the URL. This will ensure that for\
    \ each request the browser is requesting a unique URL.\n\n```\n// Add unique query\
    \ string at end of the URL.\nurl:'some?nocache='+(new Date()).getTime()\n```"
- md: "Another solution, which is more of a global solution, is to set up all AJAX\
    \ requests by default to contain the no-cache logic we just discussed. To do this,\
    \ use the **ajaxSetup** function to globally switch off caching.\n\n```javascript\n\
    $.ajaxSetup({\n    cache: false // True by default. False means caching is off.\n\
    });\n```\n\nNow, in order to overwrite this global setting with individual XHR\
    \ requests, you simply change the cache option when using the **ajax()** function.\
    \ Below is a coded example of doing an XHR request using the **ajax()** function,\
    \ which will overwrite the global setting and cache the request.\n\n```javascript\n\
    $.ajaxSetup({\n    cache: false // True by default. False means caching is off.\n\
    });\n\njQuery.ajax({ cache: true, url: 'some', type: 'POST' });\n```"
  mdcn: "\n另一种更全局性的解决方案是，默认设置所有AJAX请求都包含我们刚才讨论的无缓存逻辑。为此，可以使用 **ajaxSetup** 函数在全局范围内关闭缓存。\n\
    \n```javascript\n$.ajaxSetup({\n    cache: false // 默认为true。设置为false表示关闭缓存。\n\
    });\n```\n\n现在，为了用单独的XHR请求覆盖这个全局设置，你只需在使用 **ajax()** 函数时更改 `cache` 选项。下面是一个使用\
    \ **ajax()** 函数发起XHR请求的代码示例，该请求将覆盖全局设置并缓存请求。\n\n```javascript\n$.ajaxSetup({\n\
    \    cache: false // 默认为true。设置为false表示关闭缓存。\n});\n\njQuery.ajax({ cache: true,\
    \ url: 'some', type: 'POST' });\n```\n"
