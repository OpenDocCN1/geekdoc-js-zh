  md: "# Chapter 2 Selecting\n\n# Custom jQuery filters can select elements when used\
    \ alone\n\nIt is not necessary to provide an actual element in conjunction with\
    \ a filter, such as `$('div:hidden')`. It is possible to simply pass the filter\
    \ alone, anywhere a selector expression is expected.\n\nSome examples:\n\n```\n\
    // Selects all hidden elements\n$(':hidden');\n// Selects all div elements, then\
    \ selects only even elements\n$('div').filter(':even');\n```\n\n# Grokking the\
    \ :hidden and :visible filter\n\nThe custom jQuery selector filters `:hidden`\
    \ and `:visible` do not take into account the CSS visibility property as one might\
    \ expect. The way jQuery determines if an element is hidden or visible is if the\
    \ element consumes any space in the document. To be exact, an element is visible\
    \ if its browser-reported `offsetWidth` or `offsetHeight` is greater than 0. That\
    \ way, an element that might have a CSS `display` value of `block` contained in\
    \ an element with a `display` value of `none` would accurately report that it\
    \ is not visible.\n\nExamine the code carefully and make sure you understand why\
    \ the value returned is `true` even though the `<div>` being selected has an inline\
    \ style of `display:block`.\n\n# Sample: sample22.html\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <div id=\"parentDiv\" style=\"display: none;\"\
    >\n        <div id=\"childDiv\" style=\"display: block;\"></div>\n    </div>\n\
    \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n        // Returns true because the parent\
    \ div is hidden, so the\n        // encapsulated div reports zero offsetWidth\
    \ and offsetHeight.\n        alert($('#childDiv').is(':hidden'));\n    })(jQuery);\
    \ </script>\n</body>\n</html>\n```"
