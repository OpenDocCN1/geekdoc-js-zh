  md: "# Chapter 8 Plugins\n\n# Use the $ alias when constructing a plugin\n\nWhen\
    \ writing a jQuery plugin, the same conflict prevention routine used with regular,\
    \ old jQuery code should be implemented. With this in mind, all plugins should\
    \ be contained inside a private scope where the $ alias can be used without fear\
    \ of conflicts or surprising results.\n\nThe coding structure below should look\
    \ familiar as it is used in almost every code example in this book and explained\
    \ in Chapter 1.\n\n**Sample: sample82.html**\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<body>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> alert(jQuery(document).jquery);\n        // Don't use\
    \ $ here. It is not reliable.\n        (function ($) {\n            // Can use\
    \ $ without fear of conflicts.\n            alert($(document).jquery);\n     \
    \   })(jQuery);  </script>\n</body>\n</html>\n```\n\n# New plugins attach to jQuery.fn\
    \ object to become jQuery methods\n\nNew plugins are attached to the **jQuery.fn**\
    \ object, as this is a shortcut or alias for **jQuery.prototype**. In our coding\
    \ example below, we are adding the count plugin to the **jQuery.fn** object. By\
    \ doing this, we are creating our own custom jQuery method that can be used on\
    \ a wrapped set of DOM elements.\n\nBasically, a plugin attached to **jQuery.fn**\
    \ allows us to create our own custom methods similar to any found in the API.\
    \ This is because when we attach our plugin function to **jQuery.fn**, our function\
    \ is included in the prototype chain—**$.fn.count = function(){}**—for jQuery\
    \ objects created using the jQuery function. If that blows your mind, just remember\
    \ that adding a function to **jQuery.fn** means that the keyword **this** inside\
    \ of the plugin function will refer to the jQuery object itself."
