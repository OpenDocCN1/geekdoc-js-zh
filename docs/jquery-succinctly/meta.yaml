    ```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <div style=\"position: absolute\"\
    >absolute</div>\n    <span style=\"position: absolute\">absolute</span>\n    <div>static</div>\n\
    \    <div style=\"position: absolute\">absolute</div>\n    <div>static</div>\n\
    \    <span style=\"position: absolute\">absolute</span>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> function ($) {\n        // 通过扩展 $.expr[':'] 来定义自定义过滤器\n\
    \        $.expr[':'].positionAbsolute = function (element)\n        { return $(element).css('position')\
    \ === 'absolute'; };\n        // 页面中有多少个元素是绝对定位的？\n        alert($(':positionAbsolute').length);\
    \ // 提示 \"4\"\n        // 有多少个 div 元素是绝对定位的？\n        alert($('div:positionAbsolute').length);\
