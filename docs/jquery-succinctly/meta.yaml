  md: "# Determining if an element is animating using :animated\n\nThe custom **:animated**\
    \ selector filter can be used to select elements that are currently animating.\
    \ Below, I use this custom selector filter to add text to an animating <div> element.\n\
    \n**Sample: sample95.html**\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \t<div style=\"height: 100px; width: 100px; background-color: red; color: white\"\
