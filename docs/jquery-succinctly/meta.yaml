    ## 第 3 章 遍历\n\n## **find()** 和 **filter()** 方法的区别\n\n**filter()** 方法用于过滤包装集内当前包含的元素集。其使用应留给那些需要过滤已选元素集的任务。例如，下面的代码将过滤包装集中的三个\
