    ></script>\n    <script> (function($){\n        // Alerts \"0\".\n        alert($('#notHere').length);\n\
    \    })(jQuery); </script>\n</body>\n</html>\n```\n\n> **Notes:**\nIf it is not\
    \ obvious, the length property can also report the number of elements in the wrapper\
    \ set—stated another way, how many elements were selected by the expression passed\
    \ to the jQuery function.\n\n# Creating custom filters for selecting elements\n\
    \nThe capabilities of the jQuery selector engine can be extended by creating your\
    \ own custom filters. In theory, all you are doing here is building upon the custom\
    \ selectors that are already part of jQuery. For example, say we would like to\
    \ select all elements on a Web page that are absolutely positioned. Since jQuery\
