- md: '## Chapter 6 Events

    - Not limited to a single ready() event

    - Attaching/removing events using bind() and unbind()

    - Programmatically invoke a specific handler via short event methods

    - jQuery normalizes the event object

    - Event object attributes

    - Event object methods

    - Grokking event namespacing

    - Grokking event delegation

    - Applying event handlers to DOM elements regardless of DOM updates using live()

    - Adding a function to several event handlers

    - Cancel default browser behavior with preventDefault()

    - Cancel event propagation with stopPropagation()

    - Cancelling default behavior and event propagation via return false

    - Create custom events and trigger them via trigger()

    - Cloning events as well as DOM elements

    - Getting X and Y coordinates of the mouse in the viewport

    - Getting X and Y coordinates of the mouse relative to another element


    ## Chapter 7 jQuery and the Web Browser

    - Disabling the right-click contextual menu

    - Scrolling the browser window


    ## Chapter 8 Plugins

    - Use the $ alias when constructing a plugin

    - New plugins attach to jQuery.fn object to become jQuery methods

    - Inside a plugin, this is a reference to the current jQuery object

    - Using each() to iterate over the jQuery object and provide a reference to each
    element in the object using the this keyword

    - Plugin returning jQuery object so jQuery methods or other plugins can be chained
    after using plugin

    - Default plugin options

    - Custom plugin options

    - Overwriting default options without altering original plugin code

    - Create elements on the fly, invoke plugins programmatically

    - Providing callbacks and passing context


    ## Chapter 9 Effects

    - Disable all jQuery effect methods

    - Grokking the `stop()` animation method

    - Determining if an element is animating using `:animated`

    - Using `show()`, `hide()`, and `toggle()`, without animation

    - Grokking sequential and nonsequential animations

    - `Animate()` is the base, low-level abstraction

    - Grokking the jQuery fading methods


    ## Chapter 10 AJAX

    - The jQuery `ajax()` function is the lowest-level abstraction

    - jQuery supports cross-domain JSONP

    - Stop a browser from caching XHR requests


    ## The Story behind the *Succinctly* Series of Books


    Daniel Jebaraj, Vice President

    Syncfusion, Inc.


    ## Staying on the cutting edge

    As many of you may know, Syncfusion is a provider of software components for the
    Microsoft platform. This puts us in the exciting but challenging position of always
    being on the cutting edge.


    Whenever platforms or tools are shipping out of Microsoft, which seems to be about
    every other week these days, we have to educate ourselves, quickly.


    ## Information is plentiful but harder to digest

    In reality, this translates into a lot of book orders, blog searches, and Twitter
    scans.


    While more information is becoming available on the Internet and more and more
    books are being published, even on topics that are relatively new, one aspect
    that continues to inhibit us is the inability to find concise technology overview
    books.


    We are usually faced with two options: read several 500+ page books or scour the
    Web for relevant blog posts and other articles. Just as everyone else who has
    a job to do and customers to serve, we find this quite frustrating.


    ## The *Succinctly* series

    This frustration translated into a deep desire to produce a series of concise
    technical books that would be targeted at developers working on the Microsoft
    platform.


    We firmly believe, given the background knowledge such developers have, that most
    topics can be translated into books that are between 50 and 100 pages.


    This is exactly what we resolved to accomplish with the *Succinctly* series. Isn''t
    everything wonderful born out of a deep desire to change things for the better?


    ## The best authors, the best content

    Each author was carefully chosen from a pool of talented experts who shared our
    vision. The book you now hold in your hands, and the others available in this
    series, are a result of the authors'' tireless work. You will find original content
    that is guaranteed to get you up and running in about the time it takes to drink
    a few cups of coffee.


    ## Free forever

    Syncfusion will be working to produce books on several topics. The books will
    always be free. Any updates we publish will also be free.


    ## Free? What is the catch?

    There is no catch here. Syncfusion has a vested interest in this effort.


    As a component vendor, our unique claim has always been that we offer deeper and
    broader frameworks than anyone else on the market. Developer education greatly
    helps us market and sell against competing vendors who promise to “enable AJAX
    support with one click,” or “turn the moon to cheese!”


    ## Let us know what you think

    If you have any topics of interest, thoughts, or feedback, please feel free to
    send them to us at succinctly@syncfusion.com.


    We sincerely hope you enjoy this book and that it helps you better understand
    the topic of study. Thank you for reading.'
  mdcn: '

    ## 第6章 事件

    - 不仅限于单一的 ready() 事件

    - 使用 bind() 和 unbind() 附加/移除事件

    - 通过简短事件方法以编程方式调用特定的处理程序

    - jQuery 对事件对象进行标准化处理

    - 事件对象属性

    - 事件对象方法

    - 深入理解事件命名空间

    - 深入理解事件委托

    - 使用 live() 将事件处理程序应用于 DOM 元素，无论 DOM 如何更新

    - 将函数添加到多个事件处理程序

    - 使用 preventDefault() 取消浏览器默认行为

    - 使用 stopPropagation() 取消事件传播

    - 通过 return false 取消默认行为和事件传播

    - 创建自定义事件并通过 trigger() 触发

    - 克隆事件以及 DOM 元素

    - 获取鼠标在视口中的 X 和 Y 坐标

    - 获取鼠标相对于另一个元素的 X 和 Y 坐标


    ## 第7章 jQuery 与网页浏览器

    - 禁用右键上下文菜单

    - 滚动浏览器窗口


    ## 第8章 插件

    - 构建插件时使用 $ 别名

    - 新插件附加到 jQuery.fn 对象以成为 jQuery 方法

    - 在插件内部，`this` 是对当前 jQuery 对象的引用

    - 使用 each() 遍历 jQuery 对象，并使用 `this` 关键字提供对对象中每个元素的引用

    - 插件返回 jQuery 对象，以便在使用插件后可以链式调用 jQuery 方法或其他插件

    - 默认插件选项

    - 自定义插件选项

    - 在不修改原始插件代码的情况下覆盖默认选项

    - 动态创建元素，以编程方式调用插件

    - 提供回调函数并传递上下文


    ## 第9章 效果

    - 禁用所有 jQuery 效果方法

    - 深入理解 `stop()` 动画方法

    - 使用 `:animated` 确定元素是否正在执行动画

    - 使用 `show()`、`hide()` 和 `toggle()`，无动画效果

    - 深入理解顺序和非顺序动画

    - `Animate()` 是基础的、底层的抽象

    - 深入理解 jQuery 淡入淡出方法


    ## 第10章 AJAX

    - jQuery 的 `ajax()` 函数是底层抽象

    - jQuery 支持跨域 JSONP

    - 阻止浏览器缓存 XHR 请求


    ## *Succinctly* 系列书籍背后的故事


    Daniel Jebaraj，副总裁

    Syncfusion, Inc.


    ## 保持技术前沿

    正如你们许多人可能知道的，Syncfusion 是微软平台软件组件的提供商。这使我们处于一个令人兴奋但又充满挑战的位置——始终处于技术前沿。


    每当微软推出新的平台或工具时——如今这似乎每两周就有一次——我们都必须快速地自我学习。


    ## 信息丰富但更难消化

    实际上，这意味着大量的图书订单、博客搜索和 Twitter 浏览。


    虽然互联网上可用的信息越来越多，出版的书籍也越来越多，甚至包括一些相对较新的话题，但持续阻碍我们的一个方面是找不到简洁的技术概览书籍。


    我们通常面临两种选择：阅读几本超过500页的书籍，或在网上搜寻相关的博客文章和其他文章。就像其他有工作要做、有客户要服务的人一样，我们发现这相当令人沮丧。


    ## *Succinctly* 系列

    这种沮丧转化为一种强烈的愿望，即制作一系列简洁的技术书籍，面向在微软平台上工作的开发者。


    我们坚信，考虑到这些开发者的背景知识，大多数主题都可以转化为50到100页之间的书籍。


    这正是我们决心通过 *Succinctly* 系列实现的目标。一切美好的事物难道不都是源于改变现状的深切愿望吗？


    ## 最好的作者，最好的内容

    每位作者都是从一群与我们有共同愿景的才华横溢的专家中精心挑选出来的。你手中现在拿着的这本书，以及本系列中的其他书籍，都是作者们不懈努力的结果。你会发现原创内容，保证在喝几杯咖啡的时间里就能让你上手并运行。


    ## 永久免费

    Syncfusion 将致力于制作多个主题的书籍。这些书籍将始终免费。我们发布的任何更新也将是免费的。


    ## 免费？有什么陷阱吗？

    这里没有陷阱。Syncfusion 在这项工作中有着既得利益。


    作为组件供应商，我们独特的主张一直是，我们提供的框架比市场上任何其他供应商都更深入、更广泛。开发者教育极大地帮助我们进行市场营销和销售，与那些承诺“一键启用
    AJAX 支持”或“把月亮变成奶酪！”的竞争供应商抗衡。


    ## 告诉我们你的想法

    如果你有任何感兴趣的话题、想法或反馈，请随时通过 succinctly@syncfusion.com 发送给我们。


    我们真诚地希望你喜欢这本书，并希望它能帮助你更好地理解学习主题。感谢你的阅读。

    '
