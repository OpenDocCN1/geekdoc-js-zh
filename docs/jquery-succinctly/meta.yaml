  md: "```\n        $('div').slideDown(); // It will now animate.\n    })(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n# Grokking the **stop()** animation method\n\
    \nIt is often necessary to stop an animation currently in progress before starting\
    \ another. For example, when using the custom **mouseenter** and **mouseleave**\
    \ events (or **hover()** method), you may unintentionally trigger an element that\
    \ is already animating due to a previous **mouseenter** or **mouseleave** event.\
    \ This causes a buildup of queued animations, which results in a sluggish interface.\
    \ To avoid this, simply use the **stop()** method to stop the current animation\
    \ before starting a new one.\n\n**Sample: sample94.html**\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <div style=\"height: 100px; width: 100px; background-color:\
    \ red; position: absolute;\n        left: 20px;\"> \n        Hover over Me! \n\
    \    </div>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        $('div').hover(function () \n\
    \        { $(this).stop().animate({ left: 75 }, 'fast'); },\n          function\
    \ () { $(this).stop().animate({ left: 20 }, 'fast'); });\n    })(jQuery); </script>\n\
    </body>\n</html>\n```\n\nRemove the **stop()** methods from the code and roll\
    \ the mouse over the element several times to see the ghost animations occur.\
    \ Continuously rolling over the element in the page will result in animation buildup,\
    \ which is typically not the desired result.\n\n**Notes:**\nAdditionally, it is\
    \ possible to not only stop the current animation in the queue for the select\
    \ element but also the entire queue by passing the **stop()** method a parameter\
    \ of true. This will effectively stop all queued animations, active and inactive."
