  md: "# Chapter 1 Core jQuery\n\n**Base concept behind jQuery**\n\nWhile some conceptual\
    \ variations exist (e.g. functions like $.ajax) in the jQuery API, the central\
    \ concept behind jQuery is \"find something, do something.\" More specifically,\
    \ select DOM element(s) from an HTML document and then do something with them\
    \ using jQuery methods. This is the big picture concept.\n\nTo drive this concept\
    \ home, reflect upon the code below.\n\n**Sample: sample1.html**\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <!-- jQuery will change this -->\n  \
    \  <a href=\"\"></a>\n    <!-- to this <a href=\"http://www.jquery.com\">jQuery.</a>\
    \ -->\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>\n        jQuery('a').text('jQuery').attr('href', 'http://www.jquery.com');\n\
    \    </script>\n</body>\n</html>\n```\n\nNotice that in this HTML document we\
    \ are using jQuery to select a DOM element (<a>). With something selected, we\
    \ then do something with the selection by invoking the jQuery methods **text(),\
    \ attr(), and appendTo().**\n\nThe **text** method called on the wrapped <a> element\
    \ and set the display text of the element to be \"jQuery.\" The **attr** call\
    \ sets the **href** attribute to the jQuery Web site.\n\nGrokking the \"find something,\
    \ do something\" foundational concept is critical to advancing as a jQuery developer."
  merge: -1
  pgno: 14
- img_proc: true
  md: "# The concept, behind the concept, behind jQuery\n\nWhile selecting something\
    \ and doing something is the core concept behind jQuery, I would like to extend\
    \ this concept to include creating something as well. Therefore, the concept behind\
    \ jQuery could be extended to include first creating something new, selecting\
    \ it, and then doing something with it. We could call this the concept, behind\
    \ the concept, behind jQuery.\n\nWhat I am trying to make obvious is that you\
    \ are not stuck with only selecting something that is already in the DOM. It is\
    \ additionally important to grok that jQuery can be used to create new DOM elements\
    \ and then do something with these elements.\n\nIn the code example below, we\
    \ create a new `<a>` element that is not in the DOM. Once created, it is selected\
    \ and then manipulated.\n\n# Sample: sample2.html\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n    <body>\n        <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n        <script>\n            jQuery('<a>jQuery</a>').attr('href',\
    \ 'http://www.jquery.com').appendTo('body');\n        </script>\n    </body>\n\
    </html>\n```\n\nThe key concept to pick up here is that we are creating the `<a>`\
    \ element on the fly and then operating on it as if it was already in the DOM.\n\
    \n# jQuery requires HTML to run in standards mode or almost-standards mode\n\n\
    There are known issues with jQuery methods not working correctly when a browser\
    \ renders an HTML page in quirks mode. Make sure when you are using jQuery that\
    \ the browser interprets the HTML in standards mode or almost standards mode by\
    \ using a [valid doctype](http://example.com).\n\nTo ensure proper functionality,\
    \ code examples in this book use the HTML 5 doctype.\n\n```\n<!DOCTYPE html>\n\
    ```"
  merge: -1
  pgno: 15
- img_proc: true
  md: "# Waiting on the DOM to be ready\n\njQuery fires a custom event named **ready**\
    \ when the DOM is loaded and available for manipulation. Code that manipulates\
    \ the DOM can run in a handler for this event. This is a common pattern seen with\
    \ jQuery usage.\n\nThe following sample features three coded examples of this\
    \ custom event in use.\n\n# Sample: sample3.html\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n    <head>\n        <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n        <script>\n            // Standard.\n            jQuery(document).ready(function\
    \ () { alert('DOM is ready!'); });\n\n            // Shortcut, but same thing\
    \ as above.\n            jQuery(function () { alert('No really, the DOM is ready!');\
    \ });\n\n            // Shortcut with fail-safe usage of $. Keep in mind that\
    \ a reference\n            // to the jQuery function is passed into the anonymous\
    \ function.\n            jQuery(function ($) {\n                    alert('Seriously\
    \ its ready!');\n                    // Use $() without fear of conflicts.\n \
    \           });\n        </script>\n    </head>\n    <body></body>\n</html>\n\
    ```\n\nKeep in mind that you can attach as many **ready()** events to the document\
    \ as you would like. You are not limited to only one. They are executed in the\
    \ order they were added.\n\n# Executing jQuery code when the browser window is\
    \ completely loaded\n\nTypically, we do not want to wait for the **window.onload**\
    \ event. That is the point of using a custom event like **ready()** that will\
    \ execute code before the window loads, but after the DOM is ready to be traversed\
    \ and manipulated."
  merge: -1
  pgno: 16
- img_proc: true
  md: "However, sometimes we actually do want to wait. While the custom **ready()**\
    \ event is great for executing code once the DOM is available, we can also use\
    \ jQuery to execute code once the entire Web page (including all assets) is completely\
    \ loaded.\n\nThis can be done by attaching a load event handler to the **window**\
    \ object. jQuery provides the **load()** event method that can be used to invoke\
    \ a function once the window is completely loaded. Below, I provide an example\
    \ of the **load()** event method in use.\n\n# Sample: sample4.html\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n    <head>\n        <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n        <script>\n            // Pass window to the jQuery function\
    \ and attach\n            // event handler using the load() method shortcut.\n\
    \            jQuery(window).load(function(){      alert('The page and all its\
    \ assets are loaded!'); });\n        </script>\n    </head>\n\n    <body></body>\n\
    </html>\n```\n\n# Include all CSS files before including jQuery\n\nAs of jQuery\
    \ 1.3, the library no longer guarantees that all CSS files are loaded before it\
    \ fires the custom **ready()** event. Because of this change in jQuery 1.3, you\
    \ should always include all CSS files before any jQuery code. This will ensure\
    \ that the browser has parsed the CSS before it moves on to the JavaScript included\
    \ later in the HTML document. Of course, images that are referenced via CSS may\
    \ or may not be downloaded as the browser parses the JavaScript.\n\n# Using a\
    \ hosted version of jQuery\n\nWhen embedding jQuery into a Web page, most people\
    \ choose to download the [source code](https://docs.google.com/) and link to it\
    \ from a personal domain/host. However, there are other options that involve someone\
    \ else hosting the jQuery code for you."
  merge: -1
  pgno: 17
- img_proc: true
  md: "Google hosts several versions of the jQuery source code with the intent of\
    \ it being used by anyone. This is actually very handy. In the code example below\
    \ I am using a <script> element to include a minified version of jQuery that is\
    \ hosted by Google.\n\n```\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n```\n\nGoogle also hosts several previous versions of the jQuery source\
    \ code, and for each version, minified and non-minified variants are provided.\
    \ I recommend using the non-minified variant during development, as debugging\
    \ errors is always easier when you are dealing with non-minified code.\n\nA benefit\
    \ of using a Google hosted version of jQuery is that it is reliable, fast, and\
    \ potentially cached.\n\n# Executing jQuery code when DOM is parsed without using\
    \ ready()\n\nThe custom ready() event is not entirely needed. If your JavaScript\
    \ code does not affect the DOM, you can include it anywhere in the HTML document.\
    \ This means you can avoid the ready() event altogether if your JavaScript code\
    \ is not dependent on the DOM being intact.\n\nMost JavaScript nowadays, especially\
    \ jQuery code, will involve manipulating the DOM. This means the DOM has to be\
    \ fully parsed by the browser in order for you to operate on it. This fact is\
    \ why developers have been stuck on the window.onload roller coaster ride for\
    \ a couple of years now.\n\nTo avoid using the ready() event for code that operates\
    \ on the DOM, you can simply place your code in an HTML document before the closing\
    \ </body> element. Doing so ensures the DOM is completely loaded, simply because\
    \ the browser will parse the document from top to bottom. If you place your JavaScript\
    \ code in the document after the DOM elements it manipulates, there is no need\
    \ to use the ready() event.\n\nIn the example below, I have forgone the use of\
    \ ready() by simply placing my script before the document body closes. This is\
    \ the technique I use throughout this book and on the majority of sites I build.\n\
    \n# Sample: sample5.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <p>\n```"
  merge: -1
  pgno: 18
- img_proc: true
  md: "```\n        Hi, I'm the DOM! Script away!</p>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>        alert(jQuery('p').text()); </script>\n</body>\n\
    </html>\n```\n\nIf I were to place the `<script>` before the `<p>` element, it\
    \ would execute before the browser had loaded the `<p>` element. This would cause\
    \ jQuery to assume the document does not contain any `<p>` elements. However,\
    \ if I were to use the jQuery custom `ready()` event, then jQuery would not execute\
    \ the code until the DOM was ready. But why do this, when we have control over\
    \ the location of the `<script>` element in the document? Placing jQuery code\
    \ at the bottom of the page avoids having to using the `ready()` event. In fact,\
    \ placing all JavaScript code at the bottom of a page is a proven [performance\
    \ strategy](http://).\n\n# Grokking jQuery chaining\n\nOnce you have selected\
    \ something using the jQuery function and created a wrapper set, you can actually\
    \ chain jQuery methods to the DOM elements contained inside the set. Conceptually,\
    \ jQuery methods continue the chain by always returning the jQuery wrapper set,\
    \ which can then be used by the next jQuery method in the chain. Note: Most jQuery\
    \ methods are chainable, but not all.\n\nYou should always attempt to reuse the\
    \ wrapped set by leveraging chaining. In the code below, the `text()`, `attr()`,\
    \ and `addClass()` methods are being chained.\n\n**Sample: sample6.html**\n\n\
    ```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <a></a>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n      $('a').text('jQuery') // Sets text to jQuery,\
    \ and then returns $('a').\n         .attr('href', 'http://www.jquery.com/') //\
    \ Sets the href attribute and then returns $('a').\n         .addClass('jQuery');\
    \ // Sets class and then returns $('a').\n    })(jQuery) </script>\n</body>\n\
    </html>\n```"
  merge: -1
  pgno: 19
- img_proc: true
  md: "# Breaking the chain with destructive methods\n\nAs mentioned before, not all\
    \ jQuery methods maintain the chain. Methods like `text()` can be chained when\
    \ used to set the text node of an element. However, `text()` actually breaks the\
    \ chain when used to get the text node contained within an element.\n\nIn the\
    \ example below, `text()` is used to set and then get the text contained within\
    \ the `<p>` element.\n\n# Sample: sample7.html\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<body>\n    <p></p>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        var theText = $('p').text('jQuery').text();\
    \ // Returns the string \"jQuery\".\n        alert(theText);\n        // Cannot\
    \ chain after text(). The chain is broken.\n        // A string is returned, not\
    \ the jQuery object.\n    })(jQuery) </script>\n</body>\n</html>\n```\n\nGetting\
    \ the text contained within an element using `text()` is a prime example of a\
    \ broken chain because the method will return a string containing the text node,\
    \ but not the jQuery wrapper set.\n\nIt should be no surprise that if a jQuery\
    \ method does not return the jQuery wrapper set, the chain is thereby broken.\
    \ This method is considered to be destructive.\n\n# Using destructive jQuery methods\
    \ and exiting destruction using end()\n\njQuery methods that alter the original\
    \ jQuery wrapper set selected are considered to be destructive. The reason is\
    \ that they do not maintain the original state of the wrapper set. Not to worry;\
    \ nothing is really destroyed or removed. Rather, the former wrapper set is attached\
    \ to a new set.\n\nHowever, fun with chaining does not have to stop once the original\
    \ wrapped set is altered. Using the `end()` method, you can back out of any destructive\
    \ changes made to the original wrapper set. Examine the usage of the `end()` method\
    \ in the following example to understand how to operate in and out of DOM elements."
  merge: -1
  pgno: 20
- img_proc: true
  md: "# Sample: sample8.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <style>\n        .last\n        {\n            background: #900;\n      \
    \  }\n    </style>\n    <ul id=\"list\">\n        <li></li>\n        <li>\n  \
    \          <ul>\n                <li></li>\n                <li></li>\n      \
    \          <li></li>\n            </ul>\n        </li>\n        <li></li>\n  \
    \      <li></li>\n    </ul>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        $('#list') // Original wrapper\
    \ set.\n            .find('> li') // Destructive method.\n                .filter(':last')\
    \ // Destructive method.\n                    .addClass('last')\n            \
    \    .end() // End .filter(':last').\n            .find('ul') // Destructive method.\n\
    \                .css('background', '#ccc')\n                .find('li:last')\
    \ // Destructive method.\n                    .addClass('last')\n            \
    \    .end() // End .find('li:last')\n            .end() // End .find('ul')\n \
    \       .end() // End .find('> li')\n        .find('li') // Back to the orginal\
    \ $('#list')\n            .append('I am an &lt;li&gt;');\n    })(jQuery); </script>\n\
    </body>\n</html>\n```\n\n# Aspects of the jQuery function\n\nThe jQuery function\
    \ is multifaceted. We can pass it differing values and string formations that\
    \ it can then use to perform unique functions. Here are several uses of the jQuery\
    \ function:"
  merge: -1
  pgno: 21
- img_proc: true
  md: "+   - Select elements from the DOM using CSS expressions and custom jQuery\
    \ expressions, as well as selecting elements using DOM references: `jQuery('p\
    \ > a')` or `jQuery(':first')` and `jQuery(document.body)`\n- Create HTML on the\
    \ fly by passing HTML string structures or DOM methods that create DOM elements:\
    \ `jQuery('<div id=\"nav\"></div>')` or `jQuery(document.createElement('div'))`\n\
    - A shortcut for the ready() event by passing a function to the jQuery function:\
    \ `jQuery(function($){ /* Shortcut for ready() */ })`\n\nEach of these usages\
    \ is detailed in the code example below.\n\n# Sample: sample9.html\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> jQuery(function($){ // Pass jQuery a function.\n    \
    \    // Pass jQuery a string of HTML.\n        $('<p></p>').appendTo('body');\n\
    \        // Pass jQuery an element reference.\n        $(document.createElement('a')).text('jQuery').appendTo('p');\n\
    \        // Pass jQuery a CSS expression.\n        $('a:first').attr('href', 'http://www.jquery.com');\n\
    \        // Pass jQuery a DOM reference.\n        $(document.anchors[0]).attr('jQuery');\n\
    \    }); </script>\n</body>\n</html>\n```\n\n# Grokking when the keyword this\
    \ refers to DOM elements\n\nWhen attaching events to DOM elements contained in\
    \ a wrapper set, the keyword `this` can be used to refer to the current DOM element\
    \ invoking the event. The following example contains jQuery code that will attach\
    \ a custom `mouseenter` event to each `<a>` element in the page. The native JavaScript\
    \ `mouseover` event fires when the cursor enters or exits a child element, whereas\
    \ jQuery's `mouseenter` does not.\n\nSample: sample10.html\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <a id=\"link1\">jQuery.com</a>\n    <a id=\"link2\"\
    >jQuery.com</a>\n    <a id=\"link3\">jQuery.com</a>\n```"
  merge: -1
  pgno: 22
- img_proc: true
  md: "```\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n<script> (function ($)\n{\n    $('a').mouseenter(\n        function\
    \ () { alert(this.id); });\n})(jQuery);\n</script>\n</body>\n</html>\n```\n\n\
    Inside the anonymous function that is passed to the **mouseenter()** method, we\
    \ use the keyword **this** to refer to the current <a> element. Each time the\
    \ mouse touches the \"jQuery.com\" text, the browser will alert which element\
    \ has been moused-over by identifying its **id** attribute value.\n\nIn the previous\
    \ example, it is also possible to take the **this** reference and pass it to the\
    \ jQuery function so that the DOM element is wrapped with jQuery functionality.\n\
    \nSo instead of this:\n\n```\n// Access the ID attribute of the DOM element.\n\
    alert(this.id);\n```\n\nWe could have done this:\n\n```\n// Wrap the DOM element\
    \ with a jQuery object,\n// and then use attr() to access ID value.\nalert($(this).attr('id'));\n\
    ```\n\nThis is possible because the jQuery function not only takes selector expressions,\
    \ it will also take references to DOM elements. In the code, **this** is a reference\
    \ to a DOM element.\n\nThe reason you might want to wrap jQuery functionality\
    \ around a DOM element should be obvious. Doing so gives you the ability to use\
    \ jQuery chaining, should you have need for it.\n\nIterating over a set of elements\
    \ contained in the jQuery wrapper set is somewhat similar to the concept we just\
    \ discussed. By using the jQuery **each()** method, we can iterate over each DOM\
    \ element contained in a wrapper set. This allows access to each DOM element individually,\
    \ via the usage of the **this** keyword.\n\nBuilding upon the markup in the previous\
    \ example, we can select all <a> elements in the page and use the **each()** method\
    \ to iterate over each <a> element in the wrapper set, accessing its **id** attribute.\
    \ Here is an example."
  merge: -1
  pgno: 23
- img_proc: true
  md: "# Sample: sample11.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body><a\
    \ id=\"link1\">jQuery.com</a> <a id=\"link2\">jQuery.com</a> <a\nid=\"link3\"\
    >jQuery.com</a>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n        $('a').each(function(){\n \
    \           // Loop that alerts the id value for every <a> in the page.\n    \
    \        alert($(this).attr('id')); // \"this\" refers to the current element\
    \ in the loop.\n        });\n    })(jQuery); </script>\n</body>\n</html>\n```\n\
    \nIf you were to load the HTML in a browser, the browser would alert for the id\
    \ value of each <a> element in the page. Since there are three <a> elements in\
    \ the page, you get three iterations via the each() method and three alert windows.\n\
    \n# Extracting elements from a wrapper set, using them directly without jQuery\n\
    \nJust because you wrap jQuery functionality around an HTML element does not mean\
    \ you lose access to the actual DOM element itself. You can always extract an\
    \ element from the wrapper set and operate on the element via native JavaScript.\
    \ For example, in the code below I am setting the title attribute of the <a> element\
    \ in the HTML page by manipulating the native title property of the <a> DOM element.\n\
    \n# Sample: sample12.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <a>jQuery.com</a>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n        // Using DOM node properties\
    \ to set the title attribute.\n        $('a').get(0).title = 'jQuery.com';\n \
    \       // Manipulation of DOM element using jQuery methods.\n        $('a').attr('href',\
    \ 'http://www.jquery.com');\n    })(jQuery);\n    </script>\n```"
  merge: -1
  pgno: 24
- img_proc: true
  md: "```\n</body>\n</html>\n```\n\nAs demonstrated, jQuery provides the handy **get()**\
    \ method for accessing DOM elements at a specific index in the wrapper set.\n\n\
    But there is another option here. You can avoid using the **get()** method by\
    \ simply using the square bracket array notation on the jQuery object itself.\
    \ In the context of our prior code example:\n\nThis code:\n\n```\n$('a').get(0).title\
    \ = 'jQuery.com';\n```\n\nCould become this:\n\n```\n$('a')[0].title = 'jQuery.com';\n\
    ```\n\nBoth allow access to the actual DOM element. Personally, I prefer square\
    \ bracket notation. It is faster because it uses native JavaScript to retrieve\
    \ the element from an array, instead of passing it to a method.\n\nHowever, the\
    \ **get()** method provides a slick solution for placing all of the DOM elements\
    \ into a native array. By simply calling the **get()** method without passing\
    \ it an index parameter, the method will return all of the DOM elements in the\
    \ wrapper set in a native JavaScript array.\n\nTo demonstrate, let's take **get()**\
    \ for a test drive. In the code below, I am placing all the <a> elements into\
    \ an array. I then use the array to access the title property of the third <a>\
    \ DOM object on the page.\n\n# Sample: sample13.html\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <a href=\"http://www.jquery.com\" title=\"anchor1\"\
    >jQuery.com</a>\n    <a href=\"http://www.jquery.com\" title=\"anchor2\">jQuery.com</a>\n\
    \    <a href=\"http://www.jquery.com\" title=\"anchor3\">jQuery.com</a>\n    <script\n\
    src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script>  (function ($) {\n        var arrayOfAnchors = $('a').get(); //\
    \ Create native array from wrapper set.\n        alert(arrayOfAnchors[2].title);\
    \ // Alerts the third link.\n            })</script>\n</body>\n</html>\n```"
  merge: -1
  pgno: 25
- img_proc: true
  md: "```\n$(jQuery);\n</script>\n</body>\n</html>\n```\n\n> **Notes:**\nUsing `get()`\
    \ will end jQuery's chaining. It will take the wrapper set and change it into\
    \ a simple array of DOM elements that are no longer wrapped with jQuery functionality.\
    \ Therefore, using the `.end()` method cannot restore chaining after `.get()`.\n\
    \n# # Checking to see if the wrapper set is empty\n\nBefore you begin to operate\
    \ on a wrapper set, it is logical to check that you have, in fact, selected something.\
    \ The simplest solution is to use an `if` statement to check if the wrapper set\
    \ contains any DOM elements.\n\n# ## Sample: sample14.html\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <a>jQuery</a>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>\n        if (jQuery('a').get(0)) { // Is there an element\
    \ in the set?\n            jQuery('a').attr('href', 'http://www.jquery.com');\n\
    \        }\n        if (jQuery('a').length) { // Check the length of the set.\
    \ Can also use .size()\n            jQuery('a').attr('title', 'jQuery');\n   \
    \     }\n    </script>\n</body>\n</html>\n```\n\nThe truth of the matter is the\
    \ above `if` statements are not totally necessary, because jQuery will fail silently\
    \ if no elements are found. However, each method chained to any empty wrapper\
    \ set still gets invoked. So while we could actually forgo the use of the `if`\
    \ statements, it is likely a good rule of thumb to use them. Invoking methods\
    \ on an empty wrapper set could potentially cause unnecessary processing, as well\
    \ as undesirable results if methods return values other than the wrapper set,\
    \ and those values are acted upon."
  merge: -1
  pgno: 26
- img_proc: true
  md: "# Creating an alias by renaming the jQuery object itself\n\njQuery provides\
    \ the `noConflict()` method, which has several uses—namely, the ability to replace\
    \ `$` with another alias. This can be helpful in three ways: It can relinquish\
    \ the use of the `$` sign to another library, help avoid potential conflicts,\
    \ and provide the ability to customize the namespace/alias for the jQuery object.\n\
    \nFor example, let's say that you are building a Web application for company XYZ.\
    \ It might be nice to customize jQuery so that instead of having to use `jQuery('div').show()`\
    \ or `$('div').show()` you could use `XYZ('div').show()` instead.\n\n# Sample:\
    \ sample15.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <div>Syncfusion.,\
    \ Inc.</div>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>\n        var Syncfusion = jQuery.noConflict();\n    \
    \    // Do something with jQuery methods.\n        alert(Syncfusion(\"div\").text());\n\
    \    </script>\n</body>\n</html>\n```\n\n> **Notes:**\nBy passing the `noConflict()`\
    \ function a Boolean value of true, you can completely undo what jQuery has introduced\
    \ into the Web page. This should only be used in extreme cases because it will,\
    \ more than likely, cause issues with jQuery plugins.\n\n# Using .each() when\
    \ implicit iteration is not enough\n\nHopefully, it is obvious that if you have\
    \ an HTML page (example below) with three empty `<div>` elements, the following\
    \ jQuery statement will select all three elements on the page, iterate over the\
    \ three elements (implicit iteration), and will insert the text \"I am a div\"\
    \ in all three `<div>` elements.\n\n# Sample: sample16.html\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <div></div>\n```"
  merge: -1
  pgno: 27
- img_proc: true
  md: "```\n<div></div>\n<div></div>\n<script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n<script>  (function ($) {\n    $('div').text('I am a div');\n})(jQuery);\n\
    </script>\n</body>\n</html>\n```\n\nThis is considered implicit iteration because\
    \ jQuery code assumes you would like to manipulate all three elements, which requires\
    \ iterating over the elements selected and setting the text node value of each\
    \ `<div>` with the text \"I am a div.\" When this is done by default, it is referred\
    \ to as implicit iteration.\n\nThis is pretty handy. For the most part, the majority\
    \ of the jQuery methods will apply implicit iteration. However, other methods\
    \ will only apply to the first element in the wrapper set. For example, the jQuery\
    \ method `attr()` will only access the first element in the wrapper set when used\
    \ to get an attribute value.\n\n> **Notes:**\nWhen using the `attr()` method to\
    \ set an attribute, jQuery will actually apply implicit iteration to set the attribute\
    \ and its value to all the elements in the wrapper set.\n\nIn the code below,\
    \ the wrapper set contains all `<div>` elements in the page, but the `attr()`\
    \ method only returns the `id` value of the first element contained in the wrapper\
    \ set.\n\n# Sample: sample17.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n\
    <body>\n    <div id=\"div1\">I am a div</div>\n    <div id=\"div2\">I am a div</div>\n\
    \    <div id=\"div3\">I am a div</div>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function($){\n        // Alerts attribute value for\
    \ first element in wrapper set.\n        alert($('div').attr('id')); // Alerts\
    \ \"div1\".\n    })(jQuery); </script>\n</body>\n</html>\n```"
  merge: -1
  pgno: 28
- img_proc: true
  md: "For the sake of demonstration, assume your goal is actually to get the **id**\
    \ attribute value for each element on the page. You could write three separate\
    \ jQuery statements accessing each `<div>` element's **id** attribute value. If\
    \ we were to do that, it might look something like this:\n\n```\n$('#div1').attr('id');\n\
    $('#div2').attr('id');\n$('#div3').attr('id');\n// or\nvar $divs = $('div'); //\
    \ Cached query.\n$divs.eq(0).attr('id'); // Start with 0 instead of 1.\n$divs.eq(1).attr('id');\n\
    $divs.eq(2).attr('id');\n```\n\nThat seems a bit verbose, no? Wouldn't it be nice\
    \ if we could loop over the wrapper set and simply extract the **id** attribute\
    \ value from each of the `<div>` elements? By using the `$().each()` method, we\
    \ invoke another round of iteration when our wrapper set requires explicit iteration\
    \ to handle multiple elements.\n\nIn the code example below, I use the `$().each()`\
    \ method to loop over the wrapper set, access each element in the set, and then\
    \ extract its **id** attribute value.\n\n# Sample: sample18.html\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <div id=\"div1\">div1</div>\n    <div\
    \ id=\"div2\">div2</div>\n    <div id=\"div3\">div3</div>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function($){\n        // 3 alerts, one for each div.\n        $('div').each(function(){\n\
    \            // \"this\" is each element in the wrapper set.\n            alert($(this).attr('id'));\n\
    \            // Could also be written: alert(this.id);\n        });\n    })(jQuery);\n\
    \    </script>\n</body>\n</html>\n```"
