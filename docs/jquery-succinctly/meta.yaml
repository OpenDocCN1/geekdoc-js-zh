    # Sample: sample100.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n\n$.getJSON(\"http://api.flickr.com/services/feeds/photos_public.gne?tags=resig&tagmode=all&format=json&jsoncallback=?\"\
    ,\n        // Using ? just means call the callback function provided.\n      \
    \  function (data) { // Data is the JSON object from Flickr.\n            $.each(data.items,\
    \ function (i, item) { $('<img />').attr(\"src\",\nitem.media.m).appendTo('body');\
    \ if (i == 30) return false; });\n        });\n    })(jQuery); </script>\n</body>\n\
    </html>\n```\n\n> **Notes:**\nMake sure you check the API of the service you are\
    \ using for the correct usage of the callback. As an example, Flickr uses the\
    \ name **jsoncallback=?** whereas Yahoo! and Digg use the name **callback=?**.\n\
    \n# Stop a browser from caching XHR requests\n\nWhen doing an XHR request, Internet\
    \ Explorer will cache the response. If the response contains static content with\
    \ a long shelf life, caching may be a good thing. However, if the content being\
    \ requested is dynamic and could change by the second, you will want to make sure\
    \ that the request is not cached by the browser. One possible solution is to append\
    \ a unique query string value to the end of the URL. This will ensure that for\
    \ each request the browser is requesting a unique URL.\n\n```\n// Add unique query\
    \ string at end of the URL.\nurl:'some?nocache='+(new Date()).getTime()\n```"
  merge: -1
  pgno: 99
- img_proc: true
  md: "Another solution, which is more of a global solution, is to set up all AJAX\
    \ requests by default to contain the no-cache logic we just discussed. To do this,\
    \ use the **ajaxSetup** function to globally switch off caching.\n\n```\n$.ajaxSetup({\n\
    \    cache: false // True by default. False means caching is off.\n});\n```\n\n\
    Now, in order to overwrite this global setting with individual XHR requests, you\
    \ simply change the cache option when using the **ajax()** function. Below is\
    \ a coded example of doing an XHR request using the **ajax()** function, which\
    \ will overwrite the global setting and cache the request.\n\n```\n$.ajaxSetup\
    \ ({ cache: false // True by default. False means caching is off.\n});\n\njQuery.ajax({\
    \ cache: true, url: 'some', type: 'POST' });\n```"
  merge: -1
  pgno: 100
