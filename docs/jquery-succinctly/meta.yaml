  md: "With a clear understanding of manipulating the set itself, we can augment our\
    \ understanding of selecting elements by using filters that select elements that\
    \ have unique relationships with other elements within the actual DOM. jQuery\
    \ provides several selectors to do this. Some of these selectors are custom, while\
    \ some are well known CSS expressions for selecting DOM elements.\n\n+   - ancestor\
    \ descendant\n- parent > child\n- prev + next\n- prev ~ siblings\n- :nth-child(selector)\n\
    - :first-child\n- :last-child\n- :only-child\n- :empty\n- :has(selector)\n- :parent\n\
    \nUsage of these selector filters will select elements based on their relationship\
    \ within the DOM as pertaining to other elements in the DOM. To demonstrate this\
    \ concept, let's look at some code.\n\n# Sample: sample28.html\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <ul>\n        <li>1</li>\n        <li>2</li>\n\
    \        <li>3</li>\n        <li>4</li>\n        <li>5</li>\n    </ul>\n    <ul>\n\
    \        <li>1</li>\n        <li>2</li>\n        <li>3</li>\n        <li>4</li>\n\
    \        <li>5</li>\n    </ul>\n    <script\n        src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // Remember that text() combines\
    \ the contents of all\n        // elements in the wrapper set into a single string.\n\
    \        alert($('li:nth-child(2)').text()); // Alerts \"22\".\n    });</script>\n\
    </body>\n</html>\n```"
