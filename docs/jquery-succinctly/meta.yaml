    \n**示例：sample24.html**\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n \
    \   <div>jQuery </div>\n    <p>is the </p>\n    <ul>\n        <li>best!</li>\n\
    \    </ul>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
