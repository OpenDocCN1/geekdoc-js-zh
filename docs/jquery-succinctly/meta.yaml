    ```\n\n## 理解 :hidden 和 :visible 过滤器\n\n自定义的 jQuery 选择器过滤器 `:hidden` 和 `:visible`\
    \ 并不像人们通常认为的那样考虑 CSS 的 `visibility` 属性。jQuery 判断元素是否隐藏或可见的方式是看该元素是否在文档中占据任何空间。确切地说，如果元素在浏览器报告的\
    \ `offsetWidth` 或 `offsetHeight` 大于 0，则该元素是可见的。这样，一个可能具有 `display:block` CSS 值但被包含在一个\
    \ `display:none` 的元素内的元素，会准确报告为不可见。\n\n仔细检查代码，确保你理解为什么返回值是 `true`，即使被选中的 `<div>`\
