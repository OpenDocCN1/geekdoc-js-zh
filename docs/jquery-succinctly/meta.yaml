  md: "Imagine the possibilities ahead of you with the ability to enforce iteration\
    \ anytime you please.\n\n> **Notes:**\njQuery also provides a `$.each` function,\
    \ not to be confused with the `$().each` method, which is used specifically to\
    \ iterate over a jQuery wrapper set. The `$.each` method can actually be used\
    \ to iterate over any old JavaScript array or object. It is essentailly a substitue\
    \ for native JavaScript loops.\n\n# Elements in jQuery wrapper set returned in\
    \ document order\n\nThe selector engine will return results in document order\
    \ as opposed to the order in which the selectors were passed in. The wrapper set\
    \ will be populated with the selected elements based on the order each element\
    \ appears in the document, from top to bottom.\n\nSample: sample19.html\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <h1>h1</h1>\n    <h2>h2</h2>\n\
    \    <h3>h3</h3>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // We pass in h3 first, but\
    \ h1 appears earlier in\n        // the document, so it is first in the wrapper\
    \ set.\n        alert($('h3, h2, h1').get(0).nodeName);\n        // Alerts \"\
    H1\".\n    })(jQuery);\n    </script>\n</body>\n</html>\n```\n\n# Determining\
    \ context used by the jQuery function\n\nThe default context used by the jQuery\
    \ function when selecting DOM elements is the document element (e.g. `$('a', document)`).\
    \ This means that if you do not provide the jQuery function (e.g. `jQuery()`)\
    \ with a second parameter to be used as the context for the DOM query, the default\
    \ context used is the document element, more commonly known as `<body>`."
