  md: "Using the **animate()** method, you can set animations to occur non-sequentially\
    \ or at the same time by passing all the CSS property changes to a single `animate()`\
    \ method call. In the code below, the `<div>` will animate its width and border\
    \ left width at the same time.\n\n# Sample: sample98.html\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <div style=\"height: 100px; width: 100px; background-color:\
    \ red; position: absolute; left: 20px; border: 1px solid #ff9933\">Animate me!\
    \ </div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n        // Both width and borderLeftWidth\
    \ properties will animate simultaneously.\n        $('div').animate({ width: '200px',\
    \ borderLeftWidth: '10px' }, 1000);\n    })(jQuery); </script>\n</body>\n</html>\n\
    ```\n\n# Animate() is the base, low-level abstraction\n\nThe **animate()** method\
    \ is the base method that is used to construct all the pre-configured animations—e.g.\
    \ **hide()**, **slideDown()**. It provides the ability to change (over time) the\
    \ values of style properties.\n\nHere is what you need to know when using this\
    \ method.\n\n+   - Only properties that take numeric values are supported. In\
    \ other words, you can't animate the value of, say, the **backgroundColor** property\
    \ (at least not without a [plugin](plugin)). Also, properties that take more than\
    \ one value like **backgroundPosition** can't be animated.\n- You can animate\
    \ CSS properties by using em and % where applicable.\n- Relative animations can\
    \ be specified using \"+=\" or \"-=\" in front of the property value. This would,\
    \ for example, move an element positively or negatively relative to its current\
    \ position.\n- If you specify an animation duration of 0, the animation will immediately\
    \ set the elements to their end state.\n- As a shortcut, if a value of **toggle**\
    \ is passed, an animation will simply reverse from where it is and animate to\
    \ that end.\n- All CSS properties set via a single **animate()** method will animate\
    \ at the same time."
