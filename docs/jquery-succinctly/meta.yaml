    \ best!\n        alert($('div').text() + $('p').text() + $('ul li').text());\n\
    \    })(jQuery); </script>\n</body>\n</html>\n```\n\n这些表达式中的每一个都会选择 DOM 元素，这些元素都被添加到包装器集合中。然后我们可以使用\
    \ jQuery 方法来操作这些元素。请记住，所有选中的元素都将放在同一个包装器集合中。一个低效的方法是调用 jQuery 函数三次，每个表达式调用一次。\n\
    \n## 检查包装器集合的 .length 来确定选择结果\n\n通过检查包装器集合是否具有 length 属性，可以判断你的表达式是否选中了任何内容。你可以使用数组属性\
    \ `length` 来做到这一点。如果 `length` 属性不返回 0，那么你就知道至少有一个元素与你传递给 jQuery 函数的表达式匹配。例如，在下面的代码中，我们检查页面中是否存在一个\
    \ `id` 为 \"notHere\" 的元素。猜猜怎么着？它不在那里！\n\n**示例：sample25.html**\n\n```\n<!DOCTYPE\
