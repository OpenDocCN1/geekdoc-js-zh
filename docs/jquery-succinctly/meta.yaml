    \ events—e.g. `click.unique` or\n`myclick.unique`.\n\n# Grokking event delegation\n\
    \nEvent delegation relies on event propagation (a.k.a. bubbling). When you click\
    \ an `<a>` inside of a `<li>`, which is inside of a `<ul>`, the click event bubbles\
    \ up the DOM from the `<a>` to the `<li>` to the `<ul>` and so on, until each\
    \ ancestor element with a function assigned to an event handler fires.\n\nThis\
    \ means if we attach a click event to a `<ul>` and then click an `<a>` that is\
    \ encapsulated inside of the `<ul>`, eventually the click handler attached to\
    \ the `<ul>`, because of bubbling, will be invoked. When it is invoked, we can\
    \ use the event object (`event.target`) to identify which element in the DOM actually\
    \ caused the event bubbling to begin. Again, this will give us a reference to\
    \ the element that started the bubbling.\n\nBy doing this, we can seemingly add\
    \ an event handler to a great deal of DOM elements using only a single event handler/declaration.\
    \ This is extremely useful; for example, a table with 500 rows where each row\
    \ requires a click event can take advantage of event delegation. Examine the code\
    \ below for clarification.\n\nSample: sample70.html\n\n```\n<!DOCTYPE html>\n\
