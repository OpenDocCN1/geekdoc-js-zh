  md: "# Using the **is()** method to return a Boolean value\n\nIt is often necessary\
    \ to determine if the selected set of elements does, in fact, contain a specific\
    \ element. Using the **is()** method, we can check the current set against an\
    \ expression/filter. The check will return **true** if the set contains at least\
    \ one element that is selected by the given expression/filter. If it does not\
    \ contain the element, a **false** value is returned. Examine the following code:\n\
    \n# Sample: sample23.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <div id=\"i0\">jQuery</div>\n    <div id=\"i1\">jQuery</div>\n    <script\n\
    src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script>  (function($){\n        // Returns true.\n        alert($('div').is('#i1'));\n\
    \        // Returns false. Wrapper set contains no <div> with id=\"i2\".\n   \
    \     alert($('div').is('#i2'));\n        // Returns false. Wrapper set contains\
    \ no hidden <div>\n        alert($('div').is(':hidden'));\n    })(jQuery);  </script>\n\
    </body>\n</html>\n```\n\nIt should be apparent that the second **alert()** will\
    \ return a value of false because our wrapper set did not contain a **<div>**\
    \ that had an **id** attribute value of **i2**. The **is()** method is quite handy\
    \ for determining if the wrapper set contains a specific element.\n\n> **Notes:**\n\
    As of jQuery 1.3, the **is()** method supports all expressions. Previously, complex\
    \ expressions such as those containing hierarchy selectors (such as +, ~, and\
    \ >) always returned **true**.\nFilter is used by other internal jQuery functions.\
    \ Therefore, all rules that apply there, apply here, as well.\nSome developers\
    \ use **is('.class')** to determine if an element has a specific class. Don't\
    \ forget that jQuery already has a method for doing this called **hasClass('class')**,\
    \ which can be used on elements that contain more than one class value. But truth\
    \ be told, **hasClass()** is just a convenient wrapper for the **is()** method."
