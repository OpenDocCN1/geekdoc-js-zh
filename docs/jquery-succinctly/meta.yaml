    We sincerely hope you enjoy this book and that it helps you better understand
    the topic of study. Thank you for reading.'
- md: "## About the Author\n\nCody Lindley is a Christian, husband, son, father, brother,\
    \ outdoor enthusiast, and [client-side engineer](https://example.com/engineer).\
    \ Since 1997 he has been passionate about HTML, CSS, [JavaScript](https://example.com/javascript),\
    \ Flash, interaction design, interface design, and HCI. He is best known in the\
    \ jQuery community for creating [Thickbox](https://example.com/thickbox), a modal/dialog\
    \ solution. In 2008 he officially joined the jQuery team as an evangelist. His\
    \ current focus is on client-side optimization techniques as well as speaking\
    \ and [writing about jQuery](https://example.com/jquery). He is currently employed\
    \ by [TandemSeven](https://example.com/tandemseven).\n\n## Introduction\n\n*jQuery\
    \ Succinctly* was written to express, in short-order, the concepts essential to\
    \ intermediate and advanced jQuery development. Its purpose is to instill in you,\
    \ the reader, practices that jQuery developers take as common knowledge. Each\
    \ chapter contains concepts essential to becoming a seasoned jQuery developer.\n\
    \nThis book is intended for three types of readers. The first is someone who has\
    \ read introductory material on jQuery and is looking for the next logical step.\
    \ The second type of reader is a JavaScript developer, already versed in another\
    \ library, now trying to quickly learn jQuery. The third reader is I, the author.\
    \ I crafted this book to be used as my own personal reference point for jQuery\
    \ concepts. This is exactly the type of book I wish every JavaScript library had\
    \ available.\n\n## Preface\n\nBefore you begin, it is important to understand\
    \ the various stylistic nuances employed throughout this book. Please do not skip\
    \ this section because it contains information that will aid you as you read.\n\
    \n## jQuery semantics\n\nThe term \"jQuery function\" refers to the jQuery constructor\
    \ function (`jQuery()` or alias `$()`) that is used to create an instance of the\
    \ jQuery object.\n\nThe term \"wrapper set\" refers to DOM elements that are wrapped\
    \ within jQuery methods. Specifically, this term is used to refer to the elements\
    \ selected using the jQuery function. You may have heard this referred to as a\
    \ \"jQuery collection.\" In this book I will be using the term \"wrapper set\"\
    \ instead of \"jQuery collection.\"\n\n## How the book is structured\n\nThe book\
    \ is organized into chapters loosely based on the arrangement of the [jQuery API\
    \ documentation](https://api.jquery.com/). Each chapter contains isolated jQuery\
    \ concepts relevant to the chapter's title.\n\n## More code, less words\n\nThis\
    \ book is purposely written with the intention that the reader will examine the\
    \ code examples closely. The text should be viewed as secondary to the code itself.\
    \ It is my opinion that a code example is actually worth a thousand words. Do\
    \ not worry if you initially find the explanations in the book to be confusing.\
    \ Examine the code. Tinker with it. Reread the code comments. Repeat this process\
    \ until the material becomes clear. This is the level of expertise I hope you\
    \ achieve, where documented code is all that is necessary for you to understand\
    \ new development concepts.\n\n## Why oh why did I use alert() for code examples?\n\
    \nBelieve me, I hate the `alert()` method as much as you do. But like it or not,\
    \ it works reliably in every browser. To borrow a line from Dr. Seuss: It works\
    \ \"Here, there, and everywhere!\" It is not necessarily ideal, but I did not\
    \ want the added complexity of `console` solutions to adversely affect code clarity.\
    \ It is my goal to cut away any code overhead not directly supporting the concepts\
    \ being taught.\n\n## Color coding\n\nCode will be colored using normal JavaScript\
    \ syntax highlighting (as in Visual Studio). This will help you understand the\
    \ code, but you will be just fine reading this material on a monochrome eBook\
    \ reader such as the Kindle.\n\nSample: color.html\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n\n<body>\n\t<!-- HTML comment -->\n\t<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n\t<script>\n\t\t// JavaScript comment\n\t\tvar focusOnThisCode = true;\n\
    \t</script>\n</body>\n\n</html>\n```\n\n## Completely grok jQuery text() before\
    \ reading this book\n\nThe code examples in this book make heavy use of the jQuery\
    \ text() method. You need to be aware that the text() method, when used on a wrapper\
    \ set containing more than one element, will actually combine and return a string\
    \ of text contained in all elements of the wrapper set. This might be confusing\
    \ if you were expecting it to return only the text in the first element of the\
    \ wrapper set. Below is an example of how the text() method concatenates the strings\
    \ found in the elements of a wrapper set.\n\nSample: grok-text.html\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n\n<body>\n\t<span>I</span>\n\t<span>love</span>\n\
    \t<span>jQuery</span>\n\t<span>!</span>\n\t<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n\t<script>\nalert(jQuery('span').text()); // Alerts \"I love jQuery!\"\
    \n</script>\n</body>\n</html>\n```\n\n## Code examples\n\nThis book relies heavily\
    \ on code examples to express jQuery concepts. The code samples are available\
    \ at [https://bitbucket.org/syncfusion/jquery-succinctly](https://bitbucket.org/syncfusion/jquery-succinctly).\n\
    \nCode samples are provided as individual HTML files. A Visual Studio 2010 project\
    \ is also provided for easy navigation. You can select any file, right-click,\
    \ and select the **View in Browser** option to test the code.\n\n![](img/9c8cbb49889dfa2daf176a943643ef7c_13_0.png)\n\
    \nThe name of the sample file is always included above its code block in the format\
    \ **Sample: $file-name.html**.\n\nI encourage you to download the code and follow\
    \ along. I authored this book counting on the fact that you will need to tinker\
    \ with the code while you are reading and learning.\n\n## Chapter 1 Core jQuery\n\
    \n**Base concept behind jQuery**\n\nWhile some conceptual variations exist (e.g.\
    \ functions like $.ajax) in the jQuery API, the central concept behind jQuery\
    \ is \"find something, do something.\" More specifically, select DOM element(s)\
    \ from an HTML document and then do something with them using jQuery methods.\
    \ This is the big picture concept.\n\nTo drive this concept home, reflect upon\
    \ the code below.\n\n**Sample: sample1.html**\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<body>\n    <!-- jQuery will change this -->\n    <a href=\"\"></a>\n \
    \   <!-- to this <a href=\"http://www.jquery.com\">jQuery.</a> -->\n    <script\
    \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script>\n        jQuery('a').text('jQuery').attr('href', 'http://www.jquery.com');\n\
    \    </script>\n</body>\n</html>\n```\n\nNotice that in this HTML document we\
    \ are using jQuery to select a DOM element (<a>). With something selected, we\
    \ then do something with the selection by invoking the jQuery methods **text(),\
    \ attr(), and appendTo().**\n\nThe **text** method called on the wrapped <a> element\
    \ and set the display text of the element to be \"jQuery.\" The **attr** call\
    \ sets the **href** attribute to the jQuery Web site.\n\nGrokking the \"find something,\
    \ do something\" foundational concept is critical to advancing as a jQuery developer.\n\
    \n## The concept, behind the concept, behind jQuery\n\nWhile selecting something\
    \ and doing something is the core concept behind jQuery, I would like to extend\
    \ this concept to include creating something as well. Therefore, the concept behind\
    \ jQuery could be extended to include first creating something new, selecting\
    \ it, and then doing something with it. We could call this the concept, behind\
    \ the concept, behind jQuery.\n\nWhat I am trying to make obvious is that you\
    \ are not stuck with only selecting something that is already in the DOM. It is\
    \ additionally important to grok that jQuery can be used to create new DOM elements\
    \ and then do something with these elements.\n\nIn the code example below, we\
    \ create a new `<a>` element that is not in the DOM. Once created, it is selected\
    \ and then manipulated.\n\n### Sample: sample2.html\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n    <body>\n        <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n        <script>\n            jQuery('<a>jQuery</a>').attr('href',\
    \ 'http://www.jquery.com').appendTo('body');\n        </script>\n    </body>\n\
    </html>\n```\n\nThe key concept to pick up here is that we are creating the `<a>`\
    \ element on the fly and then operating on it as if it was already in the DOM.\n\
    \n## jQuery requires HTML to run in standards mode or almost-standards mode\n\n\
    There are known issues with jQuery methods not working correctly when a browser\
    \ renders an HTML page in quirks mode. Make sure when you are using jQuery that\
    \ the browser interprets the HTML in standards mode or almost standards mode by\
    \ using a [valid doctype](http://example.com).\n\nTo ensure proper functionality,\
    \ code examples in this book use the HTML 5 doctype.\n\n```\n<!DOCTYPE html>\n\
    ```"
  mdcn: "\n## 关于作者\n\n科迪·林德利是一位基督徒、丈夫、儿子、父亲、兄弟、户外运动爱好者，也是一名[前端工程师](https://example.com/engineer)。自1997年以来，他一直对HTML、CSS、[JavaScript](https://example.com/javascript)、Flash、交互设计、界面设计和人机交互充满热情。他在jQuery社区最为人知的是创建了模态框/对话框解决方案[Thickbox](https://example.com/thickbox)。2008年，他正式加入jQuery团队，担任技术布道师。他目前专注于前端优化技术，并进行演讲和[撰写关于jQuery的文章](https://example.com/jquery)。他目前受雇于[TandemSeven](https://example.com/tandemseven)。\n\
    \n## 简介\n\n*《jQuery精粹》*旨在快速阐述中级和高级jQuery开发所必需的核心概念。本书的目的是向读者灌输jQuery开发者视为常识的实践方法。每一章都包含了成为资深jQuery开发者所必需的核心概念。\n\
    \n本书面向三类读者。第一类是已经阅读过jQuery入门材料，并寻找下一步学习方向的读者。第二类是已经精通其他JavaScript库的开发者，现在希望快速学习jQuery。第三类读者是我自己，即本书的作者。我编写本书，将其作为我个人对jQuery概念的参考手册。这正是我希望每一本JavaScript库书籍都能提供的类型。\n\
    \n## 前言\n\n在开始之前，了解本书所采用的各种风格细节非常重要。请不要跳过本节，因为它包含的信息将有助于你的阅读。\n\n## jQuery语义\n\
    \n术语“jQuery函数”是指用于创建jQuery对象实例的jQuery构造函数（`jQuery()` 或别名 `$()`）。\n\n术语“包装集”是指被jQuery方法包装的DOM元素。具体来说，该术语用于指代使用jQuery函数选中的元素。你可能听说过它被称为“jQuery集合”。在本书中，我将使用“包装集”而非“jQuery集合”。\n\
    \n## 本书结构\n\n本书的章节组织大致基于[jQuery API文档](https://api.jquery.com/)的排列方式。每一章都包含与该章标题相关的、独立的jQuery概念。\n\
    \n## 代码为先，文字为辅\n\n本书刻意编写，旨在让读者仔细研究代码示例。文字应被视为代码本身的辅助。在我看来，一个代码示例实际上价值千言万语。如果你最初觉得书中的解释令人困惑，请不要担心。仔细研究代码。动手尝试。重新阅读代码注释。重复这个过程，直到材料变得清晰。这正是我期望你达到的精通水平，即理解新的开发概念仅需阅读文档化的代码。\n\
    \n## 为什么我用了alert()作为代码示例？\n\n相信我，我像你一样讨厌`alert()`方法。但无论喜欢与否，它在每个浏览器中都能可靠地工作。借用苏斯博士的一句话：它“在这里、那里和\
    \ everywhere”都能用！这未必是理想的选择，但我不希望`console`解决方案增加的复杂性影响代码的清晰度。我的目标是去除任何不直接支持所教概念的冗余代码。\n\
    \n## 颜色编码\n\n代码将使用标准的JavaScript语法高亮进行着色（如Visual Studio中所示）。这将帮助你理解代码，但即使在像Kindle这样的单色电子书阅读器上阅读本书，你也会毫无问题。\n\
    \n示例：color.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n\n<body>\n\t<!--\
    \ HTML注释 -->\n\t<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n\t<script>\n\t\t// JavaScript注释\n\t\tvar focusOnThisCode = true;\n\
    \t</script>\n</body>\n\n</html>\n```\n\n## 在阅读本书前，请完全理解jQuery的text()方法\n\n本书中的代码示例大量使用了jQuery的text()方法。你需要知道，当text()方法应用于包含多个元素的包装集时，它实际上会组合并返回包装集中所有元素包含的文本字符串。如果你原本期望它只返回包装集中第一个元素的文本，这可能会令人困惑。下面是text()方法如何连接包装集中元素内字符串的示例。\n\
    \n示例：grok-text.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n\n<body>\n\t\
    <span>I</span>\n\t<span>love</span>\n\t<span>jQuery</span>\n\t<span>!</span>\n\
    \t<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n\t<script>\nalert(jQuery('span').text()); // 弹出 \"I love jQuery!\"\
    \n</script>\n</body>\n</html>\n```\n\n## 代码示例\n\n本书主要依靠代码示例来表达jQuery概念。代码示例可在\
    \ [https://bitbucket.org/syncfusion/jquery-succinctly](https://bitbucket.org/syncfusion/jquery-succinctly)\
    \ 获取。\n\n代码示例以单个HTML文件的形式提供。还提供了一个Visual Studio 2010项目以便于浏览。你可以选择任何文件，右键单击，然后选择**在浏览器中查看**选项来测试代码。\n\
    \n![](img/9c8cbb49889dfa2daf176a943643ef7c_13_0.png)\n\n示例文件的名称始终以其代码块上方 **Sample:\
    \ $file-name.html** 的格式包含。\n\n我鼓励你下载代码并跟随学习。我编写本书时，就预期到你将在阅读和学习过程中需要动手尝试代码。\n\n\
    ## 第1章 核心jQuery\n\n**jQuery背后的基本概念**\n\n尽管jQuery API中存在一些概念上的变体（例如`$.ajax`等函数），但jQuery背后的核心概念是“找到某个东西，然后做一些事情”。更具体地说，是从HTML文档中选择DOM元素，然后使用jQuery方法对它们进行操作。这是宏观的概念。\n\
    \n为了深入理解这个概念，请思考下面的代码。\n\n**示例：sample1.html**\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<body>\n    <!-- jQuery将修改此处 -->\n    <a href=\"\"></a>\n    <!-- 改为 <a\
    \ href=\"http://www.jquery.com\">jQuery.</a> -->\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>\n        jQuery('a').text('jQuery').attr('href', 'http://www.jquery.com');\n\
    \    </script>\n</body>\n</html>\n```\n\n注意，在这个HTML文档中，我们使用jQuery选择了一个DOM元素（`<a>`）。选中某个元素后，我们通过调用jQuery方法**text()**、**attr()**和**appendTo()**对选中的元素进行操作。\n\
    \n在包装好的`<a>`元素上调用的**text**方法将元素的显示文本设置为“jQuery”。**attr**调用将**href**属性设置为jQuery网站。\n\
    \n理解“找到某个东西，然后做一些事情”这一基础概念，对于jQuery开发者进阶至关重要。\n\n## 概念背后的概念，jQuery背后的概念\n\n虽然选择某个东西并做一些事情是jQuery背后的核心概念，但我想扩展这个概念，使其也包括“创建某个东西”。因此，jQuery背后的概念可以扩展为：首先创建新的东西，选择它，然后对它做一些事情。我们可以称之为“概念背后的概念，jQuery背后的概念”。\n\
    \n我试图说明的是，你不仅可以选择DOM中已经存在的东西。同样重要的是，要理解jQuery可以用来创建新的DOM元素，然后对这些元素进行操作。\n\n在下面的代码示例中，我们创建了一个不在DOM中的新`<a>`元素。一旦创建，它被选中，然后被操作。\n\
    \n### 示例：sample2.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n    <body>\n\
    \        <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n        <script>\n            jQuery('<a>jQuery</a>').attr('href',\
    \ 'http://www.jquery.com').appendTo('body');\n        </script>\n    </body>\n\
    </html>\n```\n\n这里需要掌握的关键概念是，我们动态创建了`<a>`元素，然后像它已经在DOM中一样对其进行操作。\n\n## jQuery要求HTML以标准模式或近乎标准模式运行\n\
    \n已知当浏览器以怪异模式渲染HTML页面时，jQuery方法可能无法正常工作。在使用jQuery时，请确保浏览器通过使用[有效的文档类型声明](http://example.com)以标准模式或近乎标准模式解释HTML。\n\
    \n为确保功能正常，本书中的代码示例使用HTML 5文档类型。\n\n```\n<!DOCTYPE html>\n```\n"
