- md: "## Selecting form elements by type\n\nIt is possible to select form elements\
    \ by their type—e.g. `$('input:checkbox')`. jQuery provides the following form\
    \ type filters for selecting form elements by their type.\n\n- :text\n- :password\n\
    - :radio\n- :checkbox\n- :submit\n- :image\n- :reset\n- :file\n- :button\n\n##\
    \ Selecting all form elements\n\nYou can select all form elements by using the\
    \ `:input` form filter. This filter will select more than just input elements,\
    \ it will select any `<textarea>`, `<select>`, or `<button>` elements as well.\
    \ In the coded example below, take notice of the length of the wrapper set when\
    \ using the `:input` filter.\n\n**Sample: sample64.html**\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <input type=\"button\" value=\"Input\
    \ Button\" />\n    <input type=\"checkbox\" />\n    <input type=\"file\" />\n\
    \    <input type=\"hidden\" />\n    <input type=\"image\" />\n    <input type=\"\
    password\" />\n    <input type=\"radio\" />\n    <input type=\"reset\" />\n  \
    \  <input type=\"submit\" />\n    <input type=\"text\" />\n    <select>\n    \
    \    <option>Option</option>\n    </select>\n    <textarea></textarea>\n    <button>Button</button>\n\
    \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n        // Alerts \"13\" form elements\n\
    \        alert($(':input').length);\n    })(jQuery); </script>\n</body>\n</html>\n\
    ```\n\n## Chapter 6 Events\n\n## Not limited to a single **ready()** event\n\n\
    It is important to keep in mind that you can declare as many custom **ready()**\
    \ events as you would like. You are not limited to attaching a single **.ready()**\
    \ event to the document. The **ready()** events are executed in the order that\
    \ they are included.\n\n> **Notes:**\nPassing the jQuery function, a function—e.g.\
    \ `jQuery(function(){//code here})`—is a shortcut for `jQuery(document).ready()`.\n\
    \n## Attaching/removing events using **bind()** and **unbind()**\n\nUsing the\
    \ **bind()** method—e.g. `jQuery('a').bind('click',function(){})`—you can add\
    \ any of the following standard handlers to the appropriate DOM elements.\n\n\
    - blur\n- focus\n- load\n- resize\n- scroll\n- unload\n- beforeunload\n- click\n\
    - dblclick\n- mousedown\n- mouseup\n- mousemove\n- mouseover\n- mouseout\n- change\n\
    - select\n- submit\n- keydown\n- keypress\n- keyup\n- error\n\nObviously, based\
    \ on DOM standards, only certain handlers coincide with particular elements. In\
    \ addition to this list of standard handlers, you can also leverage `bind()` to\
    \ attach jQuery custom handlers—e.g. `mouseenter` and `mouseleave`—as well as\
    \ any custom handlers you may create.\n\nTo remove standard handlers or custom\
    \ handlers, we simply pass the `unbind()` method the handler name or custom handler\
    \ name that needs to be removed—e.g. `jQuery('a').unbind('click')`. If no parameters\
    \ are passed to `unbind()`, it will remove all handlers attached to an element.\n\
    \nThese concepts just discussed are expressed in the code example below.\n\n###\
    \ Sample: sample65.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <input type=\"text\" value=\"click me\" />\n    <br />\n    <br />\n    <button>remove\
    \ events</button>\n    <div id=\"log\" name=\"log\"></div>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n      // Bind events\n      $('input').bind('click',\
    \ function () { alert('You clicked me!'); });\n      $('input').bind('focus',\
    \ function () {\n          // alert and focus events are a recipe for an endless\
    \ list of dialogs\n          // we will log instead\n          $('#log').html('You\
    \ focused this input!');\n      });\n      // Unbind events\n      $('button').click(function\
    \ () {\n          // Using shortcut binding via click()\n          $('input').unbind('click');\n\
    \          $('input').unbind('focus');\n          // Or, unbind all events   \
    \  // $('button').unbind();\n      });\n    })(jQuery); </script>\n</body>\n</html>\n\
    ```\n\n> **Notes:**\njQuery provides several shortcuts to the `bind()` method\
    \ for use with all standard DOM events, which excludes custom jQuery events like\
    \ `mouseenter` and `mouseleave`. Using these shortcuts simply involves substituting\
    \ the event's name as the method name—e.g. `.click()`, `.mouseout()`, `.focus()`.\n\
    \nYou can attach unlimited handlers to a single DOM element using jQuery. jQuery\
    \ provides the one() event handling method to conveniently bind an event to DOM\
    \ elements that will be executed once and then removed. The one() method is just\
    \ a wrapper for bind() and unbind().\n\n## Programmatically invoke a specific\
    \ handler via short event methods\n\nThe shortcut syntax—e.g. `.click()`, `.mouseout()`,\
    \ and `.focus()`—for binding an event handler to a DOM element can also be used\
    \ to invoke handlers programmatically. To do this, simply use the shortcut event\
    \ method without passing it a function. In theory, this means that we can bind\
    \ a handler to a DOM element and then immediately invoke that handler. Below,\
    \ I demonstrate this via the click() event.\n\n### Sample: sample66.html\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <a>Say Hi</a>\n    <!--clicking\
    \ this element will alert \"hi\" -->\n    <a>Say Hi</a>\n    <!--clicking this\
    \ element will alert \"hi\" -->\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>\n        (function ($) {\n            // Bind a click\
    \ handler to all <a> and immediately invoke their handlers.\n            $('a').click(function\
    \ () { alert('hi') }).click();\n            // Page will alert twice. On page\
    \ load, a click\n            // is triggered for each <a> in the wrapper set.\n\
    \        })(jQuery);\n    </script>\n</body>\n</html>\n```\n\n> **Notes:**\nIt\
    \ is also possible to use the event trigger() method to invoke specific handlers—e.g.\
    \ `jQuery('a').click(function(){ alert('hi') }).trigger('click')`. This will also\
    \ work with namespaced and custom events.\n\n## jQuery normalizes the event object\n\
    \njQuery normalizes the event object according to W3C standards. This means that\
    \ when the event object is passed to a function handler, you do not have to worry\
    \ about browser-specific implementations of the event object (e.g. Internet Explorer's\
    \ window.event). You can use the following attributes and methods of the event\
    \ object worry-free from browser differences because jQuery normalizes the event\
    \ object.\n\n## Event object attributes\n\n- event.type\n- event.target\n- event.data\n\
    - event.relatedTarget\n- event.currentTarget\n- event.pageX\n- event.pageY\n-\
    \ event.result\n- event.timeStamp\n\n## Event object methods\n\n- event.preventDefault()\n\
    - event.isDefaultPrevented()\n- event.stopPropagation()\n- event.isPropagationStopped()\n\
    - event.stopImmediatePropagation()\n- event.isImmediatePropagationStopped()\n\n\
    To access the normalized jQuery event object, simply pass the anonymous function,\
    \ passed to a jQuery event method, a parameter named \"event\" (or whatever you\
    \ want to call it). Then, inside of the anonymous callback function, use the parameter\
    \ to access the event object. Below is a coded example of this concept.\n\n###\
