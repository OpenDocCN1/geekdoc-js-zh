  - "[PAGE 83]\n\n# Chapter 8 Plugins\n\n# Use the $ alias when constructing a plugin\n\
    \nWhen writing a jQuery plugin, the same conflict prevention routine used with\
    \ regular, old jQuery code should be implemented. With this in mind, all plugins\
    \ should be contained inside a private scope where the $ alias can be used without\
    \ fear of conflicts or surprising results.\n\nThe coding structure below should\
    \ look familiar as it is used in almost every code example in this book and explained\
    \ in Chapter 1.\n\n**Sample: sample82.html**\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<body>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> alert(jQuery(document).jquery);\n        // Don't use\
    \ $ here. It is not reliable.\n        (function ($) {\n            // Can use\
    \ $ without fear of conflicts.\n            alert($(document).jquery);\n     \
    \   })(jQuery);  </script>\n</body>\n</html>\n```\n\n# New plugins attach to jQuery.fn\
    \ object to become jQuery methods\n\nNew plugins are attached to the **jQuery.fn**\
    \ object, as this is a shortcut or alias for **jQuery.prototype**. In our coding\
    \ example below, we are adding the count plugin to the **jQuery.fn** object. By\
    \ doing this, we are creating our own custom jQuery method that can be used on\
    \ a wrapped set of DOM elements.\n\nBasically, a plugin attached to **jQuery.fn**\
    \ allows us to create our own custom methods similar to any found in the API.\
    \ This is because when we attach our plugin function to **jQuery.fn**, our function\
    \ is included in the prototype chain—**$.fn.count = function(){}**—for jQuery\
    \ objects created using the jQuery function. If that blows your mind, just remember\
    \ that adding a function to **jQuery.fn** means that the keyword **this** inside\
    \ of the plugin function will refer to the jQuery object itself."
- md: "## Inside a plugin, **this** is a reference to the current jQuery object\n\n\
    When you attach a plugin to the **jQuery.fn** object, the keyword **this** used\
    \ inside of the attached plugin function will refer to the current jQuery object.\n\
    \n## Sample: sample83.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <div id=\"counter1\"></div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n    $.fn.count = function () {\n  \
    \      var $this = $(this); // \"this\" is the jQuery object.\n        $this.text('0');\
    \ // Sets the counter start number to zero.\n        var myInterval = window.setInterval(function\
    \ () {\n            // Interval for counting.\n            var currentCount =\
    \ parseFloat($this.text());\n            var newCount = currentCount + 1;\n  \
    \          $this.text(newCount + '');\n        }, 1000);\n    };\n    })(jQuery);\
    \ jQuery('#counter1').count();\n    </script>\n</body>\n</html>\n```\n\n> **Notes:**\n\
    By adding a plugin to the **jQuery.fn** object, we are essentially saying that\
    \ our plugin would like to use the jQuery function to select a context (DOM elements).\
    \ If your plugin does not require a specific context (in other words a set of\
    \ DOM elements) in which it needs to operate, you might not need to attach this\
    \ plugin to the $.fn. It might make more sense to add it as a utility function\
    \ in the jQuery namespace.\n\n## Sample: sample84.html\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <div id=\"counter1\"></div>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script>  (function ($) {\n    $.fn.count = function () {\n        // \"\
    this\" is equal to jQuery('#counter1').\n        alert(this); // Alerts jQuery\
    \ object.\n        alert(this[0]); // Alerts div element.\n        alert(this[0].id);\
    \ // Alerts \"counter1\".\n    };\n    })(jQuery); jQuery('#counter1').count();\n\
    \    </script>\n</body>\n</html>\n```\n\nIt is critical that you grok exactly\
    \ what the keyword **this** is referring to in the plugin function.\n\n## Using\
    \ **each()** to iterate over the jQuery object and provide a reference to each\
    \ element in the object using the **this** keyword\n\nUsing **each()**, we can\
    \ create an implicit iteration for our plugin. This means that if the wrapper\
    \ set contains more than one element, our plugin method will be applied to each\
    \ element in the wrapper set.\n\nTo do this, we use the jQuery utility **each()**\
    \ function, which is a generic iterator for both objects and arrays, basically\
    \ simplifying looping. In the code example below, we use the function to iterate\
    \ over the jQuery object itself. Inside of the function that is passed to **each()**,\
    \ the keyword **this** will refer to the elements in the jQuery wrapper set.\n\
    \n## Sample: sample85.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <div id=\"counter1\"></div>\n    <div id=\"counter2\"></div>\n    <script\
    \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script>    (function ($) {\n        $.fn.count = function () {\n       \
    \     this.each(function () {\n                // \"this\" is the current jQuery\
    \ object.\n                var $this = $(this);\n                $this.text('0');\
    \ // Sets the counter start number.\n                var myInterval = window.setInterval(function\
    \ () {\n                    // Interval for counting.\n                    var\
    \ currentCount = parseFloat($this.text());\n                    var newCount =\
    \ currentCount + 1;\n                    $this.text(newCount + '');\n        \
    \        }, 1000);\n            });\n        };\n    })(jQuery); jQuery('#counter1,\
    \ #counter2').count();\n    </script>\n</body>\n</html>\n```\n\nUsing the `each()`\
    \ function is critical if you would like a plugin to employ implicit iteration.\n\
    \n## Plugin returning jQuery object so jQuery methods or other plugins can be\
    \ chained after using plugin\n\nTypically, most plugins return the jQuery object\
    \ itself so that the plugin does not break the chain. In other words, if a plugin\
    \ does not specifically need to return a value, it should continue the chain so\
    \ that additional methods can be applied to the wrapper set. In the code below,\
    \ we are returning the jQuery object with the `return this;` statement so that\
    \ chaining will not be broken. Notice that I am chaining on the `parent()` and\
    \ `append()` methods after I call the `count()` plugin.\n\n## Sample: sample86.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <div id=\"counter1\"\
    ></div>\n    <div id=\"counter2\"></div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>    (function ($) {\n        $.fn.count = function ()\
    \ {\n            return this.each(function () {\n                // Return the\
    \ jQuery object, or \"this\" after each()\n                var $this = $(this);\n\
    \                $this.text('0');\n                var myInterval = window.setInterval(function\
    \ () {\n                    var currentCount = parseFloat($this.text());\n   \
    \                 var newCount = currentCount + 1;\n                    $this.text(newCount\
    \ + '');\n                }, 1000);\n            });\n        };\n    })(jQuery);\
    \ jQuery('#counter1, #counter2').count().parent() // Chaining continues because\
    \ jQuery object is returned.\n        .append('<p>Chaining still works!</p>');\n\
    \    </script>\n</body>\n</html>\n```\n\n> **Notes:**\nIt is possible to make\
    \ the plugin a destructive method by simply not returning the jQuery object.\n\
    \n## Default plugin options\n\nPlugins typically contain default options that\
    \ will act as the baseline default configuration for the plugins' logic. These\
    \ options are used when the plugin is invoked. In the code below, I am creating\
    \ a `defaultOptions` object containing a single property (`startCount`) and value\
    \ (`0`). This object is stored on the count function `$.fn.count.defaultOptions`.\
    \ We do this so the options are configurable from outside the plugin.\n\n## Sample:\
    \ sample87.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <div\
    \ id=\"counter1\"></div>\n    <div id=\"counter2\"></div>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script>\n        (function ($) {\n            $.fn.count = function () {\n\
    \                return this.each(function () {\n                    var $this\
    \ = $(this);\n                    // Sets the counter start number to zero.\n\
    \                    $this.text($.fn.count.defaultOptions.startCount + '');\n\
    \                    var myInterval = window.setInterval(function () {\n     \
    \                   var currentCount = parseFloat($this.text());\n           \
    \             var newCount = currentCount + 1;\n                        $this.text(newCount\
    \ + '');\n                    }, 1000);\n                });\n            };\n\
    \            $.fn.count.defaultOptions = { startCount: 100 };\n        })(jQuery);\n\
    \        jQuery('#counter1, #counter2').count();\n    </script>\n</body>\n</html>\n\
    ```\n\n## Custom plugin options\n\nTypically, the default plugin options can be\
    \ overwritten with custom options. In the code below, I pass in a `customOptions`\
    \ object as a parameter to the plugin function. This object is combined with the\
    \ `defaultOptions` object to create a single `options` object. We use the jQuery\
    \ utility method `extend()` to combine multiple objects into a single object.\
    \ The `extend()` method provides the perfect utility for overwriting an object\
    \ with new properties. With this code in place, the plugin can now be customized\
    \ when invoked. In the example, we pass the `count` plugin a custom number (500)\
    \ to be used as the starting point for the count. This custom option overrides\
    \ the default option (0).\n\n## Sample: sample88.html\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <div id=\"counter1\"></div>\n    <div id=\"counter2\"\
    ></div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n        $.fn.count = function (customOptions)\
    \ {\n            // Create new option, extend object with defaultOptions and customOptions.\n\
    \            var options = $.extend({}, $.fn.count.defaultOptions, customOptions);\n\
    \            return this.each(function () {\n                var $this = $(this);\
    \ // Sets the counter start number to the default\n                          \
    \          // option value\n                                    // or to a custom\
    \ option value if it is passed to the plugin.\n                $this.text(options.startCount\
    \ + '');\n                var myInterval = window.setInterval(function () {\n\
    \                    var currentCount = parseFloat($this.text());\n          \
    \          var newCount = currentCount + 1;\n                    $this.text(newCount\
    \ + '');\n                }, 1000);\n            });\n        };\n        $.fn.count.defaultOptions\
    \ = { startCount: 100 };\n    })(jQuery);  // Passing a custom option overrides\
    \ default.\n        jQuery('#counter1, #counter2').count({ startCount: 500 });\n\
    \    </script>\n</body>\n</html>\n```\n\n## Overwriting default options without\
    \ altering original plugin code\n\nSince default options are accessible from outside\
    \ a plugin, it is possible to reset the default options before invoking the plugin.\
    \ This can be handy when you want to define your own options without altering\
    \ the plugin code itself. Doing so can simplify plugin invocations because you\
    \ can, in a sense, globally set up the plugin to your liking without forking the\
    \ original plugin code itself.\n\n## Sample: sample89.html\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <div id=\"counter1\"></div>\n    <div\
    \ id=\"counter2\"></div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n        $.fn.count = function (customOptions)\
    \ {\n```"
  mdcn: "\n## 在插件内部，**this** 是对当前 jQuery 对象的引用\n\n当你将一个插件附加到 **jQuery.fn** 对象时，在附加的插件函数内部使用的关键词\
    \ **this** 将引用当前的 jQuery 对象。\n\n## 示例： sample83.html\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <div id=\"counter1\"></div>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script>  (function ($) {\n    $.fn.count = function () {\n        var $this\
