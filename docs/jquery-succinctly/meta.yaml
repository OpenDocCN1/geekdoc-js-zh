    \   <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n        // 返回 true，因为父 div 是隐藏的，所以\n \
    \       // 被包裹的 div 报告 offsetWidth 和 offsetHeight 为零。\n        alert($('#childDiv').is(':hidden'));\n\
    \    })(jQuery); </script>\n</body>\n</html>\n```\n\n## 使用 **is()** 方法返回布尔值\n\n\
    经常需要判断选中的元素集合是否确实包含特定元素。使用 **is()** 方法，我们可以将当前集合与一个表达式/过滤器进行检查。如果集合中至少有一个元素被给定的表达式/过滤器选中，则检查将返回\
    \ **true**。如果不包含该元素，则返回 **false** 值。检查以下代码：\n\n**示例：sample23.html**\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <div id=\"i0\">jQuery</div>\n    <div\
    \ id=\"i1\">jQuery</div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function($){\n        // 返回 true。\n        alert($('div').is('#i1'));\n\
    \        // 返回 false。包装器集合中不包含 id=\"i2\" 的 <div>。\n        alert($('div').is('#i2'));\n\
    \        // 返回 false。包装器集合中不包含隐藏的 <div>\n        alert($('div').is(':hidden'));\n\
    \    })(jQuery);  </script>\n</body>\n</html>\n```\n\n很明显，第二个 **alert()** 将返回\
    \ false，因为我们的包装器集合中不包含 **id** 属性值为 **i2** 的 **<div>**。**is()** 方法对于判断包装器集合是否包含特定元素非常方便。\n\
