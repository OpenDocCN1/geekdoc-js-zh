    \ red;\"></div>\n    <button>Fade the rest of the way</button>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n        $('div').fadeTo('slow', 0.50);\n      \
    \  $('button').click(function () {\n            // Fade from current opacity to\
    \ zero,\n            // and then hide element via display:none\n            $('div').fadeOut('slow');\n\
    \        });\n    })(jQuery); </script>\n</body>\n</html>\n```"
