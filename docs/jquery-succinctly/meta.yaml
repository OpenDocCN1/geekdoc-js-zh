    \ absolute\">absolute</span>\n    <div>static</div>\n    <div style=\"position:\
    \ absolute\">absolute</div>\n    <div>static</div>\n    <span style=\"position:\
    \ absolute\">absolute</span>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> function ($) {\n        // Define custom filter by extending\
