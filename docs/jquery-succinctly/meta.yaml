  md: "**one-indexed.** Meaning, for example, `:nth-child(1)` will return the first\
    \ child element, but trying to use `:nth-child(0)` will not work. Using `:nth-child(0)`\
    \ will always select nothing.\n\nUsing `:first` will select the first element\
    \ in the set while `:last` will select the last element in the set. Remember that\
    \ they filter the set based on the relationship (numerical hierarchy starting\
    \ at 0) within the set, but not the elements' relationships in the context of\
    \ the DOM. Given this knowledge, it should be obvious why the filters `:first`,\
    \ `:last`, and `:eq(index)` will always return a single element.\n\nIf it is not\
    \ obvious, allow me to explain further. The reason that `:first` can only return\
    \ a single element is because there can only be one element in a set that is considered\
    \ first when there is only one set. This should be fairly logical. Examine the\
    \ code below to see this concept in action.\n\n# Sample: sample27.html\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <ul>\n        <li>1</li>\n  \
    \      <li>2</li>\n        <li>3</li>\n        <li>4</li>\n        <li>5</li>\n\
    \    </ul>\n    <ul>\n        <li>6</li>\n        <li>7</li>\n        <li>8</li>\n\
