  md: "# Default plugin options\n\nPlugins typically contain default options that\
    \ will act as the baseline default configuration for the plugins' logic. These\
    \ options are used when the plugin is invoked. In the code below, I am creating\
    \ a `defaultOptions` object containing a single property (`startCount`) and value\
    \ (`0`). This object is stored on the count function `$.fn.count.defaultOptions`.\
    \ We do this so the options are configurable from outside the plugin.\n\n# Sample:\
    \ sample87.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <div\
    \ id=\"counter1\"></div>\n    <div id=\"counter2\"></div>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script>\n        (function ($) {\n            $.fn.count = function () {\n\
    \                return this.each(function () {\n                    var $this\
    \ = $(this);\n                    // Sets the counter start number to zero.\n\
    \                    $this.text($.fn.count.defaultOptions.startCount + '');\n\
    \                    var myInterval = window.setInterval(function () {\n     \
    \                   var currentCount = parseFloat($this.text());\n           \
    \             var newCount = currentCount + 1;\n                        $this.text(newCount\
    \ + '');\n                    }, 1000);\n                });\n            };\n\
    \            $.fn.count.defaultOptions = { startCount: 100 };\n        })(jQuery);\n\
    \        jQuery('#counter1, #counter2').count();\n    </script>\n</body>\n</html>\n\
    ```\n\n# Custom plugin options\n\nTypically, the default plugin options can be\
    \ overwritten with custom options. In the code below, I pass in a `customOptions`\
    \ object as a parameter to the plugin function. This object is combined with the\
    \ `defaultOptions` object to create a single `options` object. We use the jQuery\
    \ utility method `extend()` to combine multiple objects into a single object.\
    \ The `extend()` method provides the perfect utility for overwriting an object\
    \ with new properties. With this code in place, the plugin can now be customized\
    \ when invoked. In the example, we pass the `count` plugin a custom number (500)\
    \ to be used as the starting point for the count. This custom option overrides\
    \ the default option (0)."
