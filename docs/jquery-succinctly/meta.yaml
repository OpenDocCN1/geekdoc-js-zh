    \ || {});\n        return this.each(function () {\n            $(this).fadeOut().fadeIn('normal',\
    \ function () { // Callback for fadeIn()\n                // Call complete() function,\
    \ pass it \"this\".\n                if ($.isFunction(options.complete)) {\n \
