    \  alert(this[0]); // 弹出 div 元素。\n        alert(this[0].id); // 弹出 \"counter1\"\
    。\n    };\n    })(jQuery); jQuery('#counter1').count();\n    </script>\n</body>\n\
    </html>\n```\n至关重要的是，你需要完全理解插件函数中关键词 **this** 所指代的内容。\n\n## 使用 **each()** 遍历 jQuery\
    \ 对象，并使用 **this** 关键词提供对象中每个元素的引用\n\n使用 **each()**，我们可以为插件创建隐式迭代。这意味着如果包装集包含多个元素，我们的插件方法将应用于包装集中的每个元素。\n\
    \n为此，我们使用 jQuery 实用函数 **each()**，它是对象和数组的通用迭代器，基本上简化了循环。在下面的代码示例中，我们使用该函数来遍历 jQuery\
    \ 对象本身。在传递给 **each()** 的函数内部，关键词 **this** 将引用 jQuery 包装集中的元素。\n\n## 示例： sample85.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <div id=\"counter1\"\
    ></div>\n    <div id=\"counter2\"></div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>    (function ($) {\n        $.fn.count = function ()\
    \ {\n            this.each(function () {\n                // \"this\" 是当前的 jQuery\
    \ 对象。\n                var $this = $(this);\n                $this.text('0');\
    \ // 设置计数器的起始数字。\n                var myInterval = window.setInterval(function\
    \ () {\n                    // 计数间隔。\n                    var currentCount = parseFloat($this.text());\n\
