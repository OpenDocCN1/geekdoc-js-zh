    \ so on, until each ancestor element with a function assigned to an event handler\
    \ fires.\n\nThis means if we attach a click event to a `<ul>` and then click an\
    \ `<a>` that is encapsulated inside of the `<ul>`, eventually the click handler\
    \ attached to the `<ul>`, because of bubbling, will be invoked. When it is invoked,\
    \ we can use the event object (`event.target`) to identify which element in the\
    \ DOM actually caused the event bubbling to begin. Again, this will give us a\
    \ reference to the element that started the bubbling.\n\nBy doing this, we can\
    \ seemingly add an event handler to a great deal of DOM elements using only a\
    \ single event handler/declaration. This is extremely useful; for example, a table\
    \ with 500 rows where each row requires a click event can take advantage of event\
    \ delegation. Examine the code below for clarification.\n\n## Sample: sample70.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <ul>\n        <li><a\
    \ href=\"#\">remove</a></li>\n        <li><a href=\"#\">remove</a></li>\n    \
    \    <li><a href=\"#\">remove</a></li>\n        <li><a href=\"#\">remove</a></li>\n\
    \        <li><a href=\"#\">remove</a></li>\n        <li><a href=\"#\">remove</a></li>\n\
    \    </ul>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n$('ul').click(function (event) { //\
    \ Attach click handler to <ul> and pass event object.\n    // event.target is\
    \ the <a>.\n    $(event.target).parent().remove(); // Remove <li> using parent()\n\
    \    return false; // Cancel default browser behavior, stop propagation.\n});\n\
    })(jQuery); </script>\n</body>\n</html>\n```\n\nNow, if you were to literally\
    \ click on one of the actual bullets of the list and not the link itself, guess\
    \ what? You'll end up removing the `<ul>`. Why? Because all clicks bubble. So\
    \ when you click on the bullet, the event.target is the `<li>`, not the `<a>`.\
    \ Since this is the case, the parent() method will grab the `<ul>` and remove\
    \ it. We could update our code so that we only remove an `<li>` when it is being\
    \ clicked from an `<a>` by passing the parent() method an element expression.\n\
    \n```javascript\n$(event.target).parent('li').remove();\n```\n\nThe important\
    \ point here is that you have to manage carefully what is being clicked when the\
    \ clickable area contains multiple encapsulated elements due to the fact that\
    \ you never know exactly where the user may click. Because of this, you have to\
    \ check to make sure the click occurred from the element you expected it to.\n\
    \n# Applying event handlers to DOM elements regardless of DOM updates using live()\n\
    \nUsing the handy live() event method, you can bind handlers to DOM elements currently\
    \ in a Web page and those that have yet to be added. The live() method uses event\
    \ delegation to make sure that newly added/created DOM elements will always respond\
    \ to event handlers regardless of DOM manipulations or dynamic changes to the\
    \ DOM. Using live() is essentially a shortcut for manually having to set up event\
    \ delegation. For example, using live() we could create a button that creates\
    \ another button indefinitely.\n\n## Sample: sample71.html\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <button>Add another button</button>\n\
    \    <script\n        src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        $('button').live('click', function\
    \ ()\n{ $(this).after(\"<button>Add another button</button>\"); }});\n})(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\nAfter examining the code, it should be obvious\
    \ that we are using `live()` to apply event delegation to a parent element (`<body>`\
    \ element in the code example) so that any button element added to the DOM always\
    \ responds to the click handler.\n\nTo remove the live event, we simply use the\
    \ `die()` method—e.g. `$('button').die()`.\n\nThe concept to take away is the\
    \ `live()` method could be used to attach events to DOM elements that are removed\
    \ and added using AJAX. In this way, you would forgo having to rebind events to\
    \ new elements introduced into the DOM after the initial page load.\n\n> **Notes:**\n\
    `live()` supports the following handlers: `click`, `dblclick`, `mousedown`, `mouseup`,\
    \ `mousemove`, `mouseover`, `mouseout`, `keydown`, `keypress`, `keyup`.\n`live()`\
    \ only works against a selector.\n`live()` by default will stop propagation by\
    \ using `return false` within the function sent to the `live()` method.\n\n# Adding\
    \ a function to several event handlers\n\nIt is possible to pass the event `bind()`\
    \ method several event handlers. This makes it possible to attach the same function,\
    \ written once, to many handlers. In the code example below, we attach a single\
    \ anonymous callback function to the click, keypress, and resize event handlers\
    \ on the document.\n\n## Sample: sample72.html\n\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<body>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // Responds to multiple events.\n\
    \        $(document).bind('click keypress resize', function (event) { alert('A\
    \ click, keypress, or resize event occurred on the document.'); });\n    })(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n# Cancel default browser behavior with preventDefault()\n\
    \nWhen a link is clicked or a form is submitted, the browser will invoke its default\
    \ functionality associated with these events. For example, click an `<a>` link\
    \ and the Web browser will attempt to load the value of the `<a>` href attribute\
    \ in the current browser window. To stop the browser from performing this type\
    \ of functionality, you can use the preventDefault() method of the jQuery normalized\
    \ event object.\n\n## Sample: sample73.html\n\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<body>\n    <a href=\"http://www.jquery.com\">jQuery</a>\n   \
    \ <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // Stops browser from navigating.\n\
    \        $('a').click(function (event) { event.preventDefault(); });\n    })(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n# Cancel event propagation with stopPropagation()\n\
    \nEvents propagate (a.k.a. bubble) up the DOM. When an event handler is fired\
    \ for any given element, the invoked event handler is also invoked for all ancestor\
    \ elements. This default behavior facilitates solutions like event delegation.\
    \ To prohibit this default bubbling, you can use the jQuery normalized event method\
    \ stopPropagation().\n\n## Sample: sample74.html\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <div><span>stop</span></div>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n        $('div').click(function (event) {\n   \
    \         // Attach click handler to <div>.\n            alert('You clicked the\
    \ outer div');\n        });\n\n        $('span').click(function (event) {\n  \
    \          // Attach click handler to <span>.\n            alert('You clicked\
    \ a span inside of a div element');\n        });\n    })(jQuery); </script>\n\
    </body>\n</html>\n```"
  mdcn: "\n## 示例：sample68.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n      $(window).bind('resize', function\
    \ ()\n      { alert('I have no namespace'); });\n\n      $(window).bind('resize.unique',\
    \ function () { alert('I have a unique namespace');\n});\n\n        // 仅从事件处理程序中移除\
    \ resize.unique 函数\n        $(window).unbind('resize.unique')\n    })(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n在上面的代码中，我们向 resize 处理程序添加了两个函数。第二个（按文档顺序）添加的\
    \ resize 事件使用了事件命名空间，然后立即使用 unbind() 移除该事件。我这样做是为了说明第一个附加的函数并未被移除。事件命名空间使我们能够标记和移除分配给单个\
    \ DOM 元素上同一处理程序的独特函数。\n\n除了移除与单个 DOM 元素和处理程序关联的特定函数外，我们还可以使用事件命名空间来专门调用（使用 trigger()）附加到\
    \ DOM 元素的特定处理程序和函数。在下面的代码中，两个 click 事件被添加到 `<a>`，然后使用命名空间，只调用其中一个。\n\n## 示例：sample69.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <a>click</a>\n   \
    \ <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n      $('a').bind('click',\n      \
    \  function () { alert('You clicked me') });\n      $('a').bind('click.unique',\n\
    \            function () { alert('You Trigger click.unique') });  // 调用传递给 click.unique\
    \ 的函数\n      $('a').trigger('click.unique');\n    })(jQuery); </script>\n</body>\n\
    </html>\n```\n\n> **注意：**\n命名空间的深度或数量没有限制——例如 `resize.layout.headerFooterContent`。\n\
    命名空间是保护、调用、移除任何插件可能需要的专属处理程序的绝佳方式。\n命名空间既适用于自定义事件，也适用于标准事件——例如 `click.unique`\
    \ 或 `myclick.unique`。\n\n# 理解事件委托\n\n事件依赖于事件传播（也称为冒泡）。当你点击位于 `<ul>` 内的 `<li>`\
    \ 中的 `<a>` 时，click 事件会从 `<a>` 冒泡到 `<li>` 再到 `<ul>`，以此类推，直到每个被分配了事件处理程序函数的祖先元素触发。\n\
    \n这意味着，如果我们为 `<ul>` 附加一个 click 事件，然后点击封装在 `<ul>` 内的 `<a>`，由于冒泡，最终附加到 `<ul>` 的\
    \ click 处理程序将被调用。当它被调用时，我们可以使用事件对象（`event.target`）来识别 DOM 中实际导致事件冒泡开始的元素。同样，这将为我们提供启动冒泡的元素的引用。\n\
    \n通过这样做，我们似乎可以仅使用单个事件处理程序/声明为大量 DOM 元素添加事件处理程序。这非常有用；例如，一个有 500 行且每行都需要 click\
    \ 事件的表格可以利用事件委托。请查看下面的代码以进行澄清。\n\n## 示例：sample70.html\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <ul>\n        <li><a href=\"#\">remove</a></li>\n\
    \        <li><a href=\"#\">remove</a></li>\n        <li><a href=\"#\">remove</a></li>\n\
    \        <li><a href=\"#\">remove</a></li>\n        <li><a href=\"#\">remove</a></li>\n\
    \        <li><a href=\"#\">remove</a></li>\n    </ul>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n$('ul').click(function (event) { //\
    \ 将 click 处理程序附加到 <ul> 并传递事件对象。\n    // event.target 是 <a>。\n    $(event.target).parent().remove();\
    \ // 使用 parent() 移除 <li>\n    return false; // 取消默认浏览器行为，停止传播。\n});\n})(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n现在，如果你实际点击的是列表中的项目符号本身而不是链接，你猜会怎样？你最终会移除整个\
    \ `<ul>`。为什么？因为所有的点击都会冒泡。所以当你点击项目符号时，event.target 是 `<li>`，而不是 `<a>`。既然如此，parent()\
    \ 方法会获取到 `<ul>` 并将其移除。我们可以通过向 parent() 方法传递一个元素表达式来更新代码，以便仅在从 `<a>` 点击时才移除 `<li>`。\n\
    \n```javascript\n$(event.target).parent('li').remove();\n```\n\n这里的重点是，由于可点击区域包含多个封装的元素，你必须仔细管理被点击的内容，因为你永远无法确切知道用户可能点击哪里。因此，你必须检查以确保点击发生在你预期的元素上。\n\
    \n# 使用 live() 将事件处理程序应用于 DOM 元素（无论 DOM 是否更新）\n\n使用便捷的 live() 事件方法，你可以将处理程序绑定到当前网页中的\
    \ DOM 元素以及尚未添加的元素。live() 方法使用事件委托，以确保新添加/创建的 DOM 元素始终响应事件处理程序，无论 DOM 操作或动态更改如何。使用\
    \ live() 本质上是手动设置事件委托的快捷方式。例如，使用 live() 我们可以创建一个按钮，该按钮可以无限地创建另一个按钮。\n\n## 示例：sample71.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <button>Add another\
    \ button</button>\n    <script\n        src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        $('button').live('click', function\
    \ ()\n{ $(this).after(\"<button>Add another button</button>\"); }});\n})(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n检查代码后，很明显我们使用了 `live()` 来对父元素（代码示例中的 `<body>`\
    \ 元素）应用事件委托，这样添加到 DOM 的任何按钮元素始终会响应 click 处理程序。\n\n要移除 live 事件，我们只需使用 `die()` 方法——例如\
    \ `$('button').die()`。\n\n要理解的概念是，`live()` 方法可用于将事件附加到使用 AJAX 移除和添加的 DOM 元素。这样，你就可以省去在初始页面加载后重新绑定事件到新引入\
    \ DOM 的元素的步骤。\n\n> **注意：**\n`live()` 支持以下处理程序：`click`、`dblclick`、`mousedown`、`mouseup`、`mousemove`、`mouseover`、`mouseout`、`keydown`、`keypress`、`keyup`。\n\
    `live()` 仅对选择器有效。\n`live()` 默认会通过在发送给 `live()` 方法的函数中使用 `return false` 来停止传播。\n\
    \n# 将函数添加到多个事件处理程序\n\n可以将事件 `bind()` 方法传递给多个事件处理程序。这使得将一个编写的相同函数附加到多个处理程序成为可能。在下面的代码示例中，我们附加了一个匿名回调函数到文档的\
    \ click、keypress 和 resize 事件处理程序上。\n\n## 示例：sample72.html\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // 响应多个事件。\n        $(document).bind('click\
    \ keypress resize', function (event) { alert('文档上发生了点击、按键或调整大小事件。'); });\n   \
    \ })(jQuery); </script>\n</body>\n</html>\n```\n\n# 使用 preventDefault() 取消默认浏览器行为\n\
    \n当点击链接或提交表单时，浏览器将调用与这些事件关联的默认功能。例如，点击 `<a>` 链接，Web 浏览器将尝试在当前浏览器窗口中加载 `<a>` href\
    \ 属性的值。要阻止浏览器执行此类型的功能，你可以使用 jQuery 规范化事件对象的 preventDefault() 方法。\n\n## 示例：sample73.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <a href=\"http://www.jquery.com\"\
    >jQuery</a>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // 阻止浏览器导航。\n        $('a').click(function\
    \ (event) { event.preventDefault(); });\n    })(jQuery); </script>\n</body>\n\
    </html>\n```\n\n# 使用 stopPropagation() 取消事件传播\n\n事件在 DOM 中传播（也称为冒泡）。当为任何给定元素触发事件处理程序时，所有祖先元素的事件处理程序也会被调用。这种默认行为有助于像事件委托这样的解决方案。要禁止这种默认的冒泡行为，你可以使用\
    \ jQuery 规范化的事件方法 stopPropagation()。\n\n## 示例：sample74.html\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <div><span>stop</span></div>\n    <script\
    \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n        $('div').click(function (event) {\n   \
    \         // 将 click 处理程序附加到 <div>。\n            alert('You clicked the outer\
    \ div');\n        });\n\n        $('span').click(function (event) {\n        \
    \    // 将 click 处理程序附加到 <span>。\n            alert('You clicked a span inside\
    \ of a div element');\n        });\n    })(jQuery); </script>\n</body>\n</html>\n\
    ```\n"
