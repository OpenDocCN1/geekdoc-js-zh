  md: "# Grokking the text() method\n\nOne might incorrectly assume that the `text()`\
    \ method only returns the text node of the first element in a wrapper set. However,\
    \ it will actually join the text nodes of all elements contained in a wrapper\
    \ set and then return the concatenated value as a single string. Make sure you\
    \ are aware of this functionality, or you might get some unexpected results.\n\
    \n# Sample: sample46.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <div>1,</div>\n    <div>2,</div>\n    <div>3,</div>\n    <div>4</div>\n \
    \   <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        alert($('div').text()); // Alerts\
    \ \"1,2,3,4\"\n    })(jQuery); </script>\n</body>\n</html>\n```\n\n# Update or\
    \ remove characters using a regular expression\n\nUsing the JavaScript `replace()`\
    \ method combined with some jQuery functionality, we can very easily update or\
    \ remove any pattern of characters from the text contained within an element.\n\
    \n# Sample: sample47.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <p>\n        I really hate using JavaScript.   I mean really hate it!   \
    \ It is the best twister\n            ever!\n    </p>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\nvar $p = $('p');\n    // Replace 'hate'\
    \ with 'love'.\n    $p.text($p.text().replace(/hate/ig, 'love'));\n    // Remove\
    \ 'twister' and replace it with nothing.\n    $p.text($p.text().replace(/twister/ig,\
    \ ''));   // Keep in mind that text() returns a string, not the jQuery object.\n\
    ```"
