- md: "## Grokking the text() method\n\nOne might incorrectly assume that the `text()`\
    \ method only returns the text node of the first element in a wrapper set. However,\
    \ it will actually join the text nodes of all elements contained in a wrapper\
    \ set and then return the concatenated value as a single string. Make sure you\
    \ are aware of this functionality, or you might get some unexpected results.\n\
    \n## Sample: sample46.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <div>1,</div>\n    <div>2,</div>\n    <div>3,</div>\n    <div>4</div>\n \
    \   <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        alert($('div').text()); // Alerts\
    \ \"1,2,3,4\"\n    })(jQuery); </script>\n</body>\n</html>\n```\n\n## Update or\
    \ remove characters using a regular expression\n\nUsing the JavaScript `replace()`\
    \ method combined with some jQuery functionality, we can very easily update or\
    \ remove any pattern of characters from the text contained within an element.\n\
    \n## Sample: sample47.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <p>\n        I really hate using JavaScript.   I mean really hate it!   \
    \ It is the best twister\n            ever!\n    </p>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\nvar $p = $('p');\n    // Replace 'hate'\
    \ with 'love'.\n    $p.text($p.text().replace(/hate/ig, 'love'));\n    // Remove\
    \ 'twister' and replace it with nothing.\n    $p.text($p.text().replace(/twister/ig,\
    \ ''));   // Keep in mind that text() returns a string, not the jQuery object.\n\
    \    // That is how the replace() string method is chained after using text()\n\
    })(jQuery); </script>\n</body>\n</html>\n```\n\nYou could also update any characters\
    \ that are contained in a string returned from `html()`. This means you can not\
    \ only update text, but also update and replace DOM elements via a regular expression.\n\
    \n## Grokking the .contents() method\n\nThe `.contents()` method can be used to\
    \ find all the child element nodes, including text nodes contained inside of an\
    \ element. However, there is a catch. If the retrieved contents contain only text\
    \ nodes, the selection will be placed inside the wrapper set as a single text\
    \ node. However, if the contents you are retrieving have one or more element nodes\
    \ amongst the text nodes, then the `.contents()` method will contain text nodes\
    \ and element nodes. Examine the code below to grasp this concept.\n\n## Sample:\
    \ sample48.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <p>I\
    \ love using jQuery!</p>\n    <p>I love <strong>really</strong> using jQuery!</p>\n\
    \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // Alerts \"I love using jQuery!\"\
    \ because no HTML elements exist.\n        alert($('p:first').contents().get(0).nodeValue);\n\
    \        // Alerts \"I love\".\n        alert($('p:last').contents().get(0).nodeValue);\n\
    \        // Alerts \"really\" but is an HTML element, not a text node.\n     \
    \   alert($('p:last').contents().eq(1).text());\n        // Alerts \"using jQuery!\"\
    \n        alert($('p:last').contents().get(2).nodeValue);\n    })(jQuery); </script>\n\
    </body>\n</html>\n```\n\nNotice that when an item in the wrapper set is a text\
    \ node, we have to extract the value by using `.get(0).nodeValue`. The `contents()`\
    \ method is handy for extracting text node values. It is possible to extract only\
    \ the text nodes from a DOM structure using `contents()`.\n\n## Sample: sample49.html\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\t<p>jQuery gives me <strong>more\
    \ <span>power</span></strong> than any other web tool!\n\t</p>\n\t<script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\t\
    <script> (function($){  $('p')      .find('*') // Select all nodes.\n\t\t.andSelf()\
    \ // Include <p>.\n\t\t.contents() // Grab all child nodes, including text.\n\t\
    \t.filter(function() {return this.nodeType == Node.TEXT_NODE;}) // Remove non-text\
    \ nodes.\n\t\t.each(function (i, text) { alert(text.nodeValue) }); // Alert text\
    \ contained in wrapper set.\n\t})(jQuery); </script>\n</body>\n</html>\n```\n\n\
    ## Using remove() does not remove elements from wrapper set\n\nWhen you use remove(),\
    \ a DOM snippet from the DOM the elements contained in the removed DOM structure\
    \ are still contained within the wrapper set. You could remove an element, operate\
    \ on that element, and then actually place that element back into the DOM, all\
    \ within a single jQuery chain.\n\n## Sample: sample50.html\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n\t<div>remove me</div>\n\t<script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\t\
    <script> (function ($) {\n\t\t$('div')\n\t\t\t.remove().html('<a href=\"http://www.jQuery.com\"\
    >jQuery</a>')\n\t\t\t.appendTo('body');\n\t})(jQuery); </script>\n</body>\n</html>\n\
    ```\n\nThe point here is that just because you remove() elements does not mean\
    \ they are removed from the jQuery wrapper set.\n\n## Chapter 5 HTML Forms\n\n\
    ## Disable/enable form elements\n\nUsing jQuery, you can easily disable form elements\
    \ by setting the disabled attribute value of a form element to disabled. To do\
    \ this, we simply select an input, and then using the `attr()` method, we set\
    \ the disabled attribute of the input to a value of disabled.\n\n## Sample: sample51.html\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <input name=\"button\"\
    \ type=\"button\" id=\"button\" value=\"Click me\"/>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        $('#button')\n            .attr('disabled',\
    \ 'disabled');\n    })(jQuery); </script>\n</body>\n</html>\n```\n\nTo enable\
    \ a disabled form element, we simply remove the disabled attribute using `removeAttr()`\
    \ or set the disabled attribute value to be empty using `attr()`.\n\n## Sample:\
    \ sample52.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <input\
    \ name=\"button\" type=\"button\" id=\"button\" value='Click me' disabled=\"disabled\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){ $('#button').removeAttr('disabled');\n\
    \        // or\n        // $('#button').attr('disabled', '');\n    })(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n## How to determine if a form element is\
    \ disabled or enabled\n\nUsing the jQuery form filter expressions `:disabled`\
    \ or `:enabled`, it is rather easy to select and determine (Boolean value) if\
    \ a form element is disabled or enabled. Examine the code below for clarification.\n\
    \n## Sample: sample53.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <input name=\"button\" type=\"button\" id=\"button1\" />\n    <input name=\"\
    button\" type=\"button\" id=\"button2\" disabled=\"disabled\" />\n    <script\
    \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n      // Is it enabled?\n      alert($('#button1').is(':enabled'));\
    \ // Alerts true.\n      // Or, using a filter.\n      alert($('#button1:enabled').length);\
    \ // Alerts \"1\".\n      // Is it disabled?\n      alert($('#button2').is(':disabled'));\
    \ // Alerts \"true\".\n      // Or, using a filter.\n      alert($('#button2:disabled').length);\
    \ // Alerts \"1\".\n    })(jQuery); </script>\n</body>\n</html>\n```\n\n## Selecting/clearing\
    \ a single check box or radio button\n\nYou can select a radio button input or\
    \ check box by setting its `checked` attribute to `true` using the `attr()`.\n\
    \n## Sample: sample54.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <input name=\"\" value=\"\" type=\"checkbox\" />\n    <input name=\"\" value=\"\
    \" type=\"radio\" />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n      // Set all check boxes or radio\
    \ buttons to selected.\n      $('input:checkbox,input:radio').attr('checked',\
    \ 'checked');\n    })(jQuery); </script>\n</body>\n</html>\n```\n\nTo clear a\
    \ radio button input or check box, simply remove the checked attribute using the\
    \ `removeAttr()` method or set the `checked` attribute value to an empty string.\n\
    \n## Sample: sample55.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <input name=\"\" type=\"checkbox\" value=\"Test1\" checked=\"checked\">\n\
    \    <input name=\"\" type=\"radio\" value=\"Test2\" checked=\"checked\">\n  \
    \  <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){  $('input').removeAttr('checked');\n})(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n## Selecting/clearing multiple check boxes\
    \ or radio button inputs\n\nYou can use jQuery's `val()` on multiple check-box\
    \ inputs or radio-button inputs to set the inputs to checked. This is done by\
    \ passing the `val()` method an array containing a string that coincides with\
    \ the check box input or radio button input value attribute.\n\n## Sample: sample56.html\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <input type=\"radio\"\
    \ value=\"radio1\">\n    <input type=\"radio\" value=\"radio2\">\n    <input type=\"\
    checkbox\" value=\"checkbox1\">\n    <input type=\"checkbox\" value=\"checkbox2\"\
    >\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n      // Check all radio and check-box\
    \ inputs on the page.\n      $('input:radio,input:checkbox').val(['radio1', 'radio2',\
    \ 'checkbox1', 'checkbox2']);\n      // Use explicit iteration to clear.\n   \
    \   // $('input:radio,input:checkbox').removeAttr('checked');\n      // or\n \
    \     // $('input:radio,input:checkbox').attr('checked', '');\n})(jQuery); </script>\n\
    </body>\n</html>\n```"
  mdcn: "\n## 深入理解 text() 方法\n\n你可能会错误地假设 `text()` 方法只返回包装器集中第一个元素的文本节点。然而，它实际上会连接包装器集中所有元素的文本节点，然后将连接后的值作为单个字符串返回。请务必了解这一功能，否则可能会得到一些意外的结果。\n\
    \n## 示例：sample46.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n  \
    \  <div>1,</div>\n    <div>2,</div>\n    <div>3,</div>\n    <div>4</div>\n   \
    \ <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        alert($('div').text()); // Alerts\
    \ \"1,2,3,4\"\n    })(jQuery); </script>\n</body>\n</html>\n```\n\n## 使用正则表达式更新或移除字符\n\
    \n结合使用 JavaScript 的 `replace()` 方法和一些 jQuery 功能，我们可以非常轻松地更新或移除元素内文本中的任何字符模式。\n\
    \n## 示例：sample47.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n  \
    \  <p>\n        I really hate using JavaScript.   I mean really hate it!    It\
    \ is the best twister\n            ever!\n    </p>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\nvar $p = $('p');\n    // Replace 'hate'\
    \ with 'love'.\n    $p.text($p.text().replace(/hate/ig, 'love'));\n    // Remove\
    \ 'twister' and replace it with nothing.\n    $p.text($p.text().replace(/twister/ig,\
    \ ''));   // Keep in mind that text() returns a string, not the jQuery object.\n\
    \    // That is how the replace() string method is chained after using text()\n\
    })(jQuery); </script>\n</body>\n</html>\n```\n\n你也可以更新从 `html()` 返回的字符串中包含的任何字符。这意味着你不仅可以更新文本，还可以通过正则表达式更新和替换\
    \ DOM 元素。\n\n## 深入理解 .contents() 方法\n\n`.contents()` 方法可用于查找所有子元素节点，包括包含在元素内的文本节点。然而，这里有一个注意事项。如果检索到的内容只包含文本节点，那么选择将作为一个单独的文本节点放置在包装器集中。但是，如果你检索的内容在文本节点之间包含一个或多个元素节点，那么\
    \ `.contents()` 方法将包含文本节点和元素节点。请研究下面的代码以掌握此概念。\n\n## 示例：sample48.html\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <p>I love using jQuery!</p>\n\
    \    <p>I love <strong>really</strong> using jQuery!</p>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // Alerts \"I love using jQuery!\"\
    \ because no HTML elements exist.\n        alert($('p:first').contents().get(0).nodeValue);\n\
    \        // Alerts \"I love\".\n        alert($('p:last').contents().get(0).nodeValue);\n\
    \        // Alerts \"really\" but is an HTML element, not a text node.\n     \
    \   alert($('p:last').contents().eq(1).text());\n        // Alerts \"using jQuery!\"\
    \n        alert($('p:last').contents().get(2).nodeValue);\n    })(jQuery); </script>\n\
    </body>\n</html>\n```\n\n请注意，当包装器集中的项是文本节点时，我们必须使用 `.get(0).nodeValue` 来提取值。`contents()`\
    \ 方法对于提取文本节点值非常方便。可以使用 `contents()` 从 DOM 结构中仅提取文本节点。\n\n## 示例：sample49.html\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\t<p>jQuery gives me <strong>more\
    \ <span>power</span></strong> than any other web tool!\n\t</p>\n\t<script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\t\
    <script> (function($){  $('p')      .find('*') // Select all nodes.\n\t\t.andSelf()\
    \ // Include <p>.\n\t\t.contents() // Grab all child nodes, including text.\n\t\
    \t.filter(function() {return this.nodeType == Node.TEXT_NODE;}) // Remove non-text\
    \ nodes.\n\t\t.each(function (i, text) { alert(text.nodeValue) }); // Alert text\
    \ contained in wrapper set.\n\t})(jQuery); </script>\n</body>\n</html>\n```\n\n\
    ## 使用 remove() 不会从包装器集中移除元素\n\n当你使用 `remove()` 时，被移除的 DOM 结构中包含的元素仍然包含在包装器集中。你可以移除一个元素，对该元素进行操作，然后实际上将该元素放回\
    \ DOM 中，所有这些都在一个 jQuery 链中完成。\n\n## 示例：sample50.html\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n\t<div>remove me</div>\n\t<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n\t<script> (function ($) {\n\t\t$('div')\n\t\t\t.remove().html('<a\
    \ href=\"http://www.jQuery.com\">jQuery</a>')\n\t\t\t.appendTo('body');\n\t})(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n这里的重点是，仅仅因为你 `remove()` 了元素，并不意味着它们已从 jQuery\
    \ 包装器集中移除。\n\n## 第5章 HTML 表单\n\n## 禁用/启用表单元素\n\n使用 jQuery，你可以通过将表单元素的 disabled\
    \ 属性值设置为 disabled 来轻松禁用表单元素。为此，我们只需选择一个 input，然后使用 `attr()` 方法，将 input 的 disabled\
    \ 属性设置为值 disabled。\n\n## 示例：sample51.html\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<body>\n    <input name=\"button\" type=\"button\" id=\"button\" value=\"\
    Click me\"/>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        $('#button')\n            .attr('disabled',\
    \ 'disabled');\n    })(jQuery); </script>\n</body>\n</html>\n```\n\n要启用已禁用的表单元素，我们只需使用\
    \ `removeAttr()` 移除 disabled 属性，或使用 `attr()` 将 disabled 属性值设置为空。\n\n## 示例：sample52.html\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <input name=\"button\"\
    \ type=\"button\" id=\"button\" value='Click me' disabled=\"disabled\" />\n  \
    \  <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){ $('#button').removeAttr('disabled');\n\
    \        // or\n        // $('#button').attr('disabled', '');\n    })(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n## 如何确定表单元素是禁用还是启用\n\n使用 jQuery 表单过滤器表达式\
    \ `:disabled` 或 `:enabled`，可以相当容易地选择并确定（布尔值）表单元素是禁用还是启用。请研究下面的代码以进行澄清。\n\n## 示例：sample53.html\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <input name=\"button\"\
    \ type=\"button\" id=\"button1\" />\n    <input name=\"button\" type=\"button\"\
    \ id=\"button2\" disabled=\"disabled\" />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n      // Is it enabled?\n      alert($('#button1').is(':enabled'));\
    \ // Alerts true.\n      // Or, using a filter.\n      alert($('#button1:enabled').length);\
    \ // Alerts \"1\".\n      // Is it disabled?\n      alert($('#button2').is(':disabled'));\
    \ // Alerts \"true\".\n      // Or, using a filter.\n      alert($('#button2:disabled').length);\
    \ // Alerts \"1\".\n    })(jQuery); </script>\n</body>\n</html>\n```\n\n## 选择/清除单个复选框或单选按钮\n\
    \n你可以通过使用 `attr()` 将 `checked` 属性设置为 `true` 来选择单选按钮或复选框。\n\n## 示例：sample54.html\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <input name=\"\" value=\"\
