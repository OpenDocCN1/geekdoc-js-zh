  - "[PAGE 76]\n\n# Cancel default browser behavior with preventDefault()\n\nWhen\
    \ a link is clicked or a form is submitted, the browser will invoke its default\
    \ functionality associated with these events. For example, click an <a> link and\
    \ the Web browser will attempt to load the value of the <a> href attribute in\
    \ the current browser window. To stop the browser from performing this type of\
    \ functionality, you can use the preventDefault() method of the jQuery normalized\
    \ event object.\n\n# Sample: sample73.html\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<body>\n    <a href=\"http://www.jquery.com\">jQuery</a>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n        // Stops browser from navigating.\n   \
    \     $('a').click(function (event) { event.preventDefault(); });\n    })(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n# Cancel event propagation with stopPropagation()\n\
    \nEvents propagate (a.k.a. bubble) up the DOM. When an event handler is fired\
    \ for any given element, the invoked event handler is also invoked for all ancestor\
    \ elements. This default behavior facilitates solutions like event delegation.\
    \ To prohibit this default bubbling, you can use the jQuery normalized event method\
    \ stopPropagation().\n\n# Sample: sample74.html\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<body>\n    <div><span>stop</span></div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        $('div').click(function (event)\
    \ {\n            // Attach click handler to <div>.\n            alert('You clicked\
    \ the outer div');\n        });\n\n        $('span').click(function (event) {\n\
    \            // Attach click handler to <span>.\n            alert('You clicked\
    \ a span inside of a div element');\n```"
- md: "## Cancelling default behavior and event propagation via `return false`\n\n\
    In the code example above, the event handler attached to the `<div>` element will\
    \ not be triggered.\n\nReturning false—e.g. `return false`—is the equivalent of\
    \ using both `preventDefault()` and `stopPropagation()`.\n\nSample: sample75.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body><span><a href=\"javascript:alert('You\
    \ clicked me!')\" class=\"link\">click me</a></span>\n<script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n\t<script> $(function($){    $('span').click(function(){\n\t// Add\
    \ click event to <span>.\n\twindow.location='http://www.jquery.com';    });\n\t\
    $('a').click(function(){\n\t\t// Ignore clicks on <a>.\n\t\treturn false;\n\t\
    });\n})(jQuery); </script>\n</body>\n</html>\n```\n\nIf you were to comment out\
    \ the `return false` statement in the code above, `alert()` would get invoked\
    \ because by default the browser will execute the value of the `href`. Also, the\
    \ page would navigate to jQuery.com due to event bubbling.\n\n## Create custom\
    \ events and trigger them via trigger()\n\nWith jQuery, you have the ability to\
    \ manufacture your own custom events using the `bind()` method. This is done by\
    \ providing the `bind()` method with a unique name for a custom event.\n\nNow,\
    \ because these events are custom and not known to the browser, the only way to\
    \ invoke custom events is to programmatically trigger them using the jQuery `trigger()`\
    \ method. Examine the code below for an example of a custom event that is invoked\
    \ using `trigger()`.\n\nSample: sample76.html\n\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<body>\n    <div>jQuery</div>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n    $('div').bind('myCustomEvent', function\
    \ () {\n        // Bind a custom event to <div>.\n        window.location = 'http://www.jquery.com';\n\
    \    });\n        $('div').click(function () {\n            // Click the <div>\
    \ to invoke the custom event.\n            $(this).trigger('myCustomEvent');\n\
    \        })\n    })(jQuery); </script>\n</body>\n</html>\n```\n\n## Cloning events\
    \ as well as DOM elements\n\nBy default, cloning DOM structures using the `clone()`\
    \ method does not additionally clone the events attached to the DOM elements being\
    \ cloned. In order to clone the elements and the events attached to the elements\
    \ you must pass the `clone()` method a Boolean value of `true`.\n\nSample: sample77.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <button>Add another\
    \ button</button>\n    <a href=\"#\" class=\"clone\">Add another link</a>\n  \
    \  <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n    $('button').click(function () {\n\
    \        var $this = $(this);\n        $this.clone(true).insertAfter(this);\n\
    \        // Clone element and its events.\n        $this.text('button').unbind('click');\
    \ // Change text, remove event.\n    });\n        $('.clone').click(function ()\
    \ {\n            var $this = $(this);\n            $this.clone().insertAfter(this);\
    \ // Clone element, but not its events.\n            $this.text('link').unbind('click');\
    \ // Change text, remove event.\n        });\n    })(jQuery); </script>\n</body>\n\
    </html>\n```\n\n## Getting X and Y coordinates of the mouse in the viewport\n\n\
    By attaching a mousemove event to the entire page (document), you can retrieve\
    \ the X and Y coordinates of the mouse pointer as it moves around inside in the\
    \ viewport over the canvas. This is done by retrieving the pageY and pageX properties\
    \ of the jQuery normalized event object.\n\nSample: sample78.html\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n$(document).mousemove(function (e) {\n\
    \        // e.pageX - gives you the X position.\n        // e.pageY - gives you\
    \ the Y position.\n        $('body').html('e.pageX = ' + e.pageX + ', e.pageY\
    \ = ' + e.pageY);\n    });\n    })(jQuery); </script>\n</body>\n</html>\n```\n\
    \n## Getting X and Y coordinates of the mouse relative to another element\n\n\
    It is often necessary to get the X and Y coordinates of the mouse pointer relative\
    \ to an element other than the viewport or entire document. This is usually done\
    \ with ToolTips, where the ToolTip is shown relative to the location that the\
    \ mouse is hovering. This can easily be accomplished by subtracting the offset\
    \ of the relative element from the viewport's X and Y mouse coordinates.\n\nSample:\
    \ sample79.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <!--\
    \ Move mouse over div to get position relative to the div -->\n    <div style=\"\
    margin: 200px; height: 100px; width: 100px; background: #ccc; padding: 20px\"\
    > relative to this </div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>\n        (function($) {\n            $('div').mousemove(function(e)\
    \ {\n                //relative to this div element instead of document.\n   \
    \             var relativeX = e.pageX - this.offsetLeft;\n                var\
    \ relativeY = e.pageY - this.offsetTop;\n                $(this).html('releativeX\
    \ = ' + relativeX + ', releativeY = ' + relativeY);\n            });\n       \
    \ })(jQuery);\n    </script>\n</body>\n</html>\n```\n\n## Chapter 7 jQuery and\
    \ the Web Browser\n\n### Disabling the right-click contextual menu\n\nUsing JavaScript,\
    \ you can disable the browser's native right-click contextual menu. Doing so with\
    \ jQuery is a snap. We simply cancel the **contextmenu** event.\n\nSample: sample80.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) { $(document).bind('contextmenu', function\
    \ () { return false;\n}); })(jQuery); </script>\n</body>\n</html>\n```\n\n###\
    \ Scrolling the browser window\n\nWhile there are numerous plugins for scrolling\
    \ the browser window, doing so can be trivial when a simple scroll is required.\
    \ By setting the **scrollTop** CSS property on the `<html>` and `<body>` elements,\
    \ it is possible to control the position of the horizontal or vertical scrolling.\
    \ In the code below, I use the **animate()** method to animate the horizontal\
    \ scrolling to a specific element in the page.\n\nSample: sample81.html\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <style>\n        li\n       \
    \ {\n            padding-bottom: 500px;\n        }\n    </style>\n    <ul>\n \
    \       <li><a href=\"#\" class=\"next\">Next</a></li>\n        <li><a href=\"\
    #\" class=\"next\">Next</a>/<a href=\"#\" class=\"prev\">Previous</a></li>\n \
    \       <li><a href=\"#\" class=\"next\">Next</a>/<a href=\"#\" class=\"prev\"\
    >Previous</a></li>\n        <li><a href=\"#\" class=\"prev\">Previous</a></li>\n\
    \    </ul>\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n<script> (function ($) {\n    $('.next')\n        .click(function\
    \ () { $('html, body').animate({ scrollTop:\n$(this).parent().next().find('a').offset().top\
    \ }, 1000); });\n    $('.prev')\n        .click(function () { $('html, body').animate({\
    \ scrollTop:\n$(this).parent().prev().find('a').offset().top }, 1000); });\n})(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n## Chapter 8 Plugins\n\n### Use the $ alias\
    \ when constructing a plugin\n\nWhen writing a jQuery plugin, the same conflict\
    \ prevention routine used with regular, old jQuery code should be implemented.\
    \ With this in mind, all plugins should be contained inside a private scope where\
    \ the $ alias can be used without fear of conflicts or surprising results.\n\n\
    The coding structure below should look familiar as it is used in almost every\
    \ code example in this book and explained in Chapter 1.\n\n**Sample: sample82.html**\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> alert(jQuery(document).jquery);\n        // Don't use\
    \ $ here. It is not reliable.\n        (function ($) {\n            // Can use\
    \ $ without fear of conflicts.\n            alert($(document).jquery);\n     \
    \   })(jQuery);  </script>\n</body>\n</html>\n```\n\n### New plugins attach to\
    \ jQuery.fn object to become jQuery methods\n\nNew plugins are attached to the\
    \ **jQuery.fn** object, as this is a shortcut or alias for **jQuery.prototype**.\
    \ In our coding example below, we are adding the count plugin to the **jQuery.fn**\
    \ object. By doing this, we are creating our own custom jQuery method that can\
    \ be used on a wrapped set of DOM elements.\n\nBasically, a plugin attached to\
    \ **jQuery.fn** allows us to create our own custom methods similar to any found\
    \ in the API. This is because when we attach our plugin function to **jQuery.fn**,\
    \ our function is included in the prototype chain—**$.fn.count = function(){}**—for\
    \ jQuery objects created using the jQuery function. If that blows your mind, just\
    \ remember that adding a function to **jQuery.fn** means that the keyword **this**\
    \ inside of the plugin function will refer to the jQuery object itself."
  mdcn: "\n## 通过 `return false` 取消默认行为和事件传播\n\n在上述代码示例中，附加到 `<div>` 元素的事件处理程序将不会被触发。\n\
    \n返回 false——例如 `return false`——等同于同时使用 `preventDefault()` 和 `stopPropagation()`。\n\
    \n示例：sample75.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body><span><a\
    \ href=\"javascript:alert('You clicked me!')\" class=\"link\">click me</a></span>\n\
    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n\t<script> $(function($){    $('span').click(function(){\n\t// 为 <span>\
    \ 添加点击事件。\n\twindow.location='http://www.jquery.com';    });\n\t$('a').click(function(){\n\
    \t\t// 忽略 <a> 上的点击。\n\t\treturn false;\n\t});\n})(jQuery); </script>\n</body>\n\
    </html>\n```\n\n如果你注释掉上述代码中的 `return false` 语句，`alert()` 将会被调用，因为默认情况下浏览器会执行 `href`\
    \ 的值。同时，由于事件冒泡，页面会跳转到 jQuery.com。\n\n## 创建自定义事件并通过 trigger() 触发它们\n\n使用 jQuery，你可以使用\
    \ `bind()` 方法来创建自定义事件。这可以通过为 `bind()` 方法提供一个唯一的自定义事件名称来实现。\n\n现在，由于这些事件是自定义的，浏览器并不知晓，所以调用自定义事件的唯一方法是使用\
    \ jQuery 的 `trigger()` 方法以编程方式触发它们。请查看下面的代码示例，了解如何使用 `trigger()` 调用自定义事件。\n\n\
    示例：sample76.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n   \
    \ <div>jQuery</div>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n    $('div').bind('myCustomEvent', function\
    \ () {\n        // 将自定义事件绑定到 <div>。\n        window.location = 'http://www.jquery.com';\n\
    \    });\n        $('div').click(function () {\n            // 点击 <div> 以调用自定义事件。\n\
    \            $(this).trigger('myCustomEvent');\n        })\n    })(jQuery); </script>\n\
    </body>\n</html>\n```\n\n## 克隆事件和 DOM 元素\n\n默认情况下，使用 `clone()` 方法克隆 DOM 结构并不会额外克隆附加到被克隆\
    \ DOM 元素的事件。为了克隆元素及其附加的事件，你必须向 `clone()` 方法传递一个布尔值 `true`。\n\n示例：sample77.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <button>Add another\
    \ button</button>\n    <a href=\"#\" class=\"clone\">Add another link</a>\n  \
    \  <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n    $('button').click(function () {\n\
    \        var $this = $(this);\n        $this.clone(true).insertAfter(this);\n\
    \        // 克隆元素及其事件。\n        $this.text('button').unbind('click'); // 更改文本，移除事件。\n\
    \    });\n        $('.clone').click(function () {\n            var $this = $(this);\n\
    \            $this.clone().insertAfter(this); // 克隆元素，但不克隆其事件。\n            $this.text('link').unbind('click');\
    \ // 更改文本，移除事件。\n        });\n    })(jQuery); </script>\n</body>\n</html>\n```\n\
    \n## 获取鼠标在视口中的 X 和 Y 坐标\n\n通过将 mousemove 事件附加到整个页面（document），你可以获取鼠标指针在画布上移动时的\
    \ X 和 Y 坐标。这是通过获取 jQuery 规范化事件对象的 pageY 和 pageX 属性来实现的。\n\n示例：sample78.html\n\n\
    ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n$(document).mousemove(function (e) {\n\
    \        // e.pageX - 给出 X 位置。\n        // e.pageY - 给出 Y 位置。\n        $('body').html('e.pageX\
    \ = ' + e.pageX + ', e.pageY = ' + e.pageY);\n    });\n    })(jQuery); </script>\n\
    </body>\n</html>\n```\n\n## 获取鼠标相对于另一个元素的 X 和 Y 坐标\n\n通常需要获取鼠标指针相对于视口或整个文档之外的另一个元素的\
    \ X 和 Y 坐标。这通常用于工具提示（ToolTips），其中工具提示显示在鼠标悬停位置的相对位置。这可以通过从视口的 X 和 Y 鼠标坐标中减去相对元素的偏移量轻松实现。\n\
    \n示例：sample79.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n \
    \   <!-- 将鼠标移过 div 以获取相对于该 div 的位置 -->\n    <div style=\"margin: 200px; height:\
    \ 100px; width: 100px; background: #ccc; padding: 20px\"> relative to this </div>\n\
    \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>\n        (function($) {\n            $('div').mousemove(function(e)\
    \ {\n                // 相对于这个 div 元素而不是 document。\n                var relativeX\
    \ = e.pageX - this.offsetLeft;\n                var relativeY = e.pageY - this.offsetTop;\n\
    \                $(this).html('releativeX = ' + relativeX + ', releativeY = '\
    \ + relativeY);\n            });\n        })(jQuery);\n    </script>\n</body>\n\
    </html>\n```\n\n## 第7章 jQuery 与 Web 浏览器\n\n### 禁用右键上下文菜单\n\n使用 JavaScript，你可以禁用浏览器的原生右键上下文菜单。使用\
    \ jQuery 来实现这一点非常简单。我们只需取消 **contextmenu** 事件即可。\n\n示例：sample80.html\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) { $(document).bind('contextmenu', function\
    \ () { return false;\n}); })(jQuery); </script>\n</body>\n</html>\n```\n\n###\
    \ 滚动浏览器窗口\n\n虽然有众多用于滚动浏览器窗口的插件，但当只需要简单滚动时，实现这一点可以轻而易举。通过设置 `<html>` 和 `<body>`\
    \ 元素的 **scrollTop** CSS 属性，可以控制水平或垂直滚动的位置。在下面的代码中，我使用 **animate()** 方法将水平滚动动画化到页面中的特定元素。\n\
    \n示例：sample81.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n \
    \   <style>\n        li\n        {\n            padding-bottom: 500px;\n     \
    \   }\n    </style>\n    <ul>\n        <li><a href=\"#\" class=\"next\">Next</a></li>\n\
    \        <li><a href=\"#\" class=\"next\">Next</a>/<a href=\"#\" class=\"prev\"\
    >Previous</a></li>\n        <li><a href=\"#\" class=\"next\">Next</a>/<a href=\"\
    #\" class=\"prev\">Previous</a></li>\n        <li><a href=\"#\" class=\"prev\"\
    >Previous</a></li>\n    </ul>\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n<script> (function ($) {\n    $('.next')\n        .click(function\
    \ () { $('html, body').animate({ scrollTop:\n$(this).parent().next().find('a').offset().top\
    \ }, 1000); });\n    $('.prev')\n        .click(function () { $('html, body').animate({\
    \ scrollTop:\n$(this).parent().prev().find('a').offset().top }, 1000); });\n})(jQuery);\
    \ </script>\n</body>\n</html>\n```\n\n## 第8章 插件\n\n### 构造插件时使用 $ 别名\n\n编写 jQuery\
    \ 插件时，应采用与常规 jQuery 代码相同的防冲突例程。考虑到这一点，所有插件都应包含在一个私有作用域内，在那里可以使用 $ 别名而无需担心冲突或意外结果。\n\
    \n下面的代码结构应该看起来很熟悉，因为它几乎用于本书中的每个代码示例，并在第1章中有解释。\n\n**示例：sample82.html**\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> alert(jQuery(document).jquery);\n        // 不要在这里使用 $。它不可靠。\n\
    \        (function ($) {\n            // 可以使用 $ 而无需担心冲突。\n            alert($(document).jquery);\n\
    \        })(jQuery);  </script>\n</body>\n</html>\n```\n\n### 新插件附加到 jQuery.fn\
    \ 对象成为 jQuery 方法\n\n新插件附加到 **jQuery.fn** 对象上，因为这是 **jQuery.prototype** 的快捷方式或别名。在下面的编码示例中，我们正在将\
    \ count 插件添加到 **jQuery.fn** 对象。通过这样做，我们正在创建自己的自定义 jQuery 方法，该方法可用于包装好的 DOM 元素集合。\n\
    \n基本上，附加到 **jQuery.fn** 的插件允许我们创建自己的自定义方法，类似于 API 中的任何方法。这是因为当我们把插件函数附加到 **jQuery.fn**\
    \ 时，我们的函数就被包含在原型链中——**$.fn.count = function(){}**——对于使用 jQuery 函数创建的 jQuery 对象。如果这让你感到困惑，只需记住，将函数添加到\
    \ **jQuery.fn** 意味着插件函数内部的 **this** 关键字将指向 jQuery 对象本身。\n"
