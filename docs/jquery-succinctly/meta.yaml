  md: '# Chapter 6 Events


    # Not limited to a single **ready()** event


    It is important to keep in mind that you can declare as many custom **ready()**
    events as you would like. You are not limited to attaching a single **.ready()**
    event to the document. The **ready()** events are executed in the order that they
    are included.


    > **Notes:**

    Passing the jQuery function, a function—e.g. `jQuery(funciton(){//code here})`—is
    a shortcut for `jQuery(document).ready()`.


    # Attaching/removing events using **bind()** and **unbind()**


    Using the **bind()** method—e.g. `jQuery(''a'').bind(''click'',function(){})`—you
    can add any of the following standard handlers to the appropriate DOM elements.


    +   - blur

    - focus

    - load

    - resize

    - scroll

    - unload

    - beforeunload

    - click

    - dblclick

    - mousedown

    - mouseup

    - mousemove

    - mouseover

    - mouseout

    - change

    - select

    - submit

    - keydown

    - keypress

    - keyup

    - error


    Obviously, based on DOM standards, only certain handlers coincide with particular
    elements.'
