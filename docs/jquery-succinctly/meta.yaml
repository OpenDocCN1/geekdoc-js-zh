  mdcn: "\n## 示例：sample8.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n\
    \    <style>\n        .last\n        {\n            background: #900;\n      \
    \  }\n    </style>\n    <ul id=\"list\">\n        <li></li>\n        <li>\n  \
    \          <ul>\n                <li></li>\n                <li></li>\n      \
    \          <li></li>\n            </ul>\n        </li>\n        <li></li>\n  \
    \      <li></li>\n    </ul>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        $('#list') // 原始包装器集。\n    \
    \        .find('> li') // 破坏性方法。\n                .filter(':last') // 破坏性方法。\n\
    \                    .addClass('last')\n                .end() // 结束 .filter(':last')。\n\
    \            .find('ul') // 破坏性方法。\n                .css('background', '#ccc')\n\
    \                .find('li:last') // 破坏性方法。\n                    .addClass('last')\n\
    \                .end() // 结束 .find('li:last')\n            .end() // 结束 .find('ul')\n\
    \        .end() // 结束 .find('> li')\n        .find('li') // 回到原始的 $('#list')\n\
    \            .append('I am an &lt;li&gt;');\n    })(jQuery); </script>\n</body>\n\
    </html>\n```\n\n## jQuery 函数的各个方面\n\njQuery 函数具有多面性。我们可以向其传递不同的值和字符串格式，它就能利用这些执行独特的功能。以下是\
    \ jQuery 函数的几种用法：\n\n- 使用 CSS 表达式和自定义 jQuery 表达式从 DOM 中选择元素，以及使用 DOM 引用选择元素：`jQuery('p\
    \ > a')` 或 `jQuery(':first')` 和 `jQuery(document.body)`\n- 通过传递 HTML 字符串结构或创建\
    \ DOM 元素的 DOM 方法来动态创建 HTML：`jQuery('<div id=\"nav\"></div>')` 或 `jQuery(document.createElement('div'))`\n\
    - 通过向 jQuery 函数传递一个函数作为 `ready()` 事件的快捷方式：`jQuery(function($){ /* ready() 的快捷方式\
    \ */ })`\n\n下面的代码示例详细说明了每种用法。\n\n## 示例：sample9.html\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> jQuery(function($){ // 向 jQuery 传递一个函数。\n        // 向\
    \ jQuery 传递一个 HTML 字符串。\n        $('<p></p>').appendTo('body');\n        // 向\
    \ jQuery 传递一个元素引用。\n        $(document.createElement('a')).text('jQuery').appendTo('p');\n\
    \        // 向 jQuery 传递一个 CSS 表达式。\n        $('a:first').attr('href', 'http://www.jquery.com');\n\
    \        // 向 jQuery 传递一个 DOM 引用。\n        $(document.anchors[0]).attr('jQuery');\n\
    \    }); </script>\n</body>\n</html>\n```\n\n## 理解关键字 this 何时引用 DOM 元素\n\n当为包装器集中包含的\
    \ DOM 元素附加事件时，可以使用关键字 `this` 来引用触发事件的当前 DOM 元素。以下示例包含一段 jQuery 代码，它将为页面中的每个 `<a>`\
    \ 元素附加一个自定义的 `mouseenter` 事件。原生 JavaScript 的 `mouseover` 事件在光标进入或离开子元素时都会触发，而\
    \ jQuery 的 `mouseenter` 则不会。\n\n示例：sample10.html\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <a id=\"link1\">jQuery.com</a>\n    <a id=\"link2\"\
    >jQuery.com</a>\n    <a id=\"link3\">jQuery.com</a>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($)\n    {\n        $('a').mouseenter(\n  \
    \          function () { alert(this.id); });\n    })(jQuery);\n    </script>\n\
    </body>\n</html>\n```\n\n在传递给 **mouseenter()** 方法的匿名函数内部，我们使用关键字 **this** 来引用当前的\
    \ `<a>` 元素。每当鼠标悬停在 \"jQuery.com\" 文本上时，浏览器将通过识别其 **id** 属性值来警告鼠标悬停在哪个元素上。\n\n\
    在前面的示例中，也可以获取 **this** 引用并将其传递给 jQuery 函数，以便用 jQuery 功能包装该 DOM 元素。\n\n因此，与其这样：\n\
    \n```javascript\n// 访问 DOM 元素的 ID 属性。\nalert(this.id);\n```\n\n我们可以这样做：\n\n```javascript\n\
    // 用 jQuery 对象包装 DOM 元素，\n// 然后使用 attr() 访问 ID 值。\nalert($(this).attr('id'));\n\
    ```\n\n这是可行的，因为 jQuery 函数不仅接受选择器表达式，它也会接受对 DOM 元素的引用。在代码中，**this** 是对一个 DOM 元素的引用。\n\
    \n你可能想要用 jQuery 功能包装 DOM 元素的原因应该是显而易见的。这样做让你能够使用 jQuery 链式调用，以防你需要。\n\n遍历 jQuery\
    \ 包装器集中包含的元素集与我们刚刚讨论的概念有些相似。通过使用 jQuery 的 **each()** 方法，我们可以遍历包装器集中包含的每个 DOM 元素。这允许通过使用\
    \ **this** 关键字单独访问每个 DOM 元素。\n\n在前一个示例的标记基础上，我们可以选择页面中的所有 `<a>` 元素，并使用 **each()**\
    \ 方法遍历包装器集中的每个 `<a>` 元素，访问其 **id** 属性。下面是一个示例。\n\n## 示例：sample11.html\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<body><a id=\"link1\">jQuery.com</a> <a id=\"\
    link2\">jQuery.com</a> <a\nid=\"link3\">jQuery.com</a>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n        $('a').each(function(){\n \
    \           // 循环警告页面中每个 <a> 的 id 值。\n            alert($(this).attr('id')); //\
    \ \"this\" 指向循环中的当前元素。\n        });\n    })(jQuery); </script>\n</body>\n</html>\n\
    ```\n\n如果你在浏览器中加载 HTML，浏览器将警告页面中每个 `<a>` 元素的 id 值。由于页面中有三个 `<a>` 元素，你将通过 each()\
    \ 方法获得三次迭代和三个警告窗口。\n\n## 从包装器集中提取元素，直接使用它们而不经过 jQuery\n\n仅仅因为你用 jQuery 功能包装了一个\
    \ HTML 元素，并不意味着你失去了对实际 DOM 元素本身的访问。你总是可以从包装器集中提取一个元素，并通过原生 JavaScript 操作该元素。例如，在下面的代码中，我通过操作\
    \ `<a>` DOM 元素的原生 title 属性来设置 HTML 页面中 `<a>` 元素的 title 属性。\n\n## 示例：sample12.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <a>jQuery.com</a>\n\
    \    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n        // 使用 DOM 节点属性设置 title 属性。\n\
    \        $('a').get(0).title = 'jQuery.com';\n        // 使用 jQuery 方法操作 DOM 元素。\n\
    \        $('a').attr('href', 'http://www.jquery.com');\n    })(jQuery);\n    </script>\n\
    </body>\n</html>\n```\n\n如所示，jQuery 提供了便捷的 **get()** 方法，用于访问包装器集中特定索引处的 DOM 元素。\n\
    \n但这里还有另一个选择。你可以通过直接在 jQuery 对象上使用方括号数组表示法来避免使用 **get()** 方法。在我们之前的代码示例上下文中：\n\
    \n这段代码：\n\n```javascript\n$('a').get(0).title = 'jQuery.com';\n```\n\n可以变成这样：\n\
    \n```javascript\n$('a')[0].title = 'jQuery.com';\n```\n\n两者都允许访问实际的 DOM 元素。就个人而言，我更喜欢方括号表示法。它更快，因为它使用原生\
    \ JavaScript 从数组中检索元素，而不是将其传递给方法。\n\n然而，**get()** 方法提供了一个巧妙的解决方案，可以将所有 DOM 元素放入一个原生数组中。只需在不传递索引参数的情况下调用\
    \ **get()** 方法，该方法将在一个原生 JavaScript 数组中返回包装器集中的所有 DOM 元素。\n\n为了演示，让我们试用一下 **get()**。在下面的代码中，我将所有\
    \ `<a>` 元素放入一个数组中。然后，我使用该数组访问页面上第三个 `<a>` DOM 对象的 title 属性。\n\n## 示例：sample13.html\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <a href=\"http://www.jquery.com\"\
    \ title=\"anchor1\">jQuery.com</a>\n    <a href=\"http://www.jquery.com\" title=\"\
    anchor2\">jQuery.com</a>\n    <a href=\"http://www.jquery.com\" title=\"anchor3\"\
    >jQuery.com</a>\n    <script\nsrc=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n        var arrayOfAnchors = $('a').get();\
    \ // 从包装器集创建原生数组。\n        alert(arrayOfAnchors[2].title); // 警告第三个链接。\n     \
    \       })</script>\n</body>\n</html>\n```\n"
