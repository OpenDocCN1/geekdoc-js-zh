- md: "$(jQuery);\n</script>\n</body>\n</html>\n\n> **Notes:**\nUsing `get()` will\
    \ end jQuery's chaining. It will take the wrapper set and change it into a simple\
    \ array of DOM elements that are no longer wrapped with jQuery functionality.\
    \ Therefore, using the `.end()` method cannot restore chaining after `.get()`.\n\
    \n## Checking to see if the wrapper set is empty\n\nBefore you begin to operate\
    \ on a wrapper set, it is logical to check that you have, in fact, selected something.\
    \ The simplest solution is to use an `if` statement to check if the wrapper set\
    \ contains any DOM elements.\n\n### Sample: sample14.html\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<body>\n    <a>jQuery</a>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>\n        if (jQuery('a').get(0)) { // Is there an element\
    \ in the set?\n            jQuery('a').attr('href', 'http://www.jquery.com');\n\
    \        }\n        if (jQuery('a').length) { // Check the length of the set.\
    \ Can also use .size()\n            jQuery('a').attr('title', 'jQuery');\n   \
    \     }\n    </script>\n</body>\n</html>\n```\n\nThe truth of the matter is the\
    \ above `if` statements are not totally necessary, because jQuery will fail silently\
    \ if no elements are found. However, each method chained to any empty wrapper\
    \ set still gets invoked. So while we could actually forgo the use of the `if`\
    \ statements, it is likely a good rule of thumb to use them. Invoking methods\
    \ on an empty wrapper set could potentially cause unnecessary processing, as well\
    \ as undesirable results if methods return values other than the wrapper set,\
    \ and those values are acted upon.\n\n## Creating an alias by renaming the jQuery\
    \ object itself\n\njQuery provides the `noConflict()` method, which has several\
    \ uses—namely, the ability to replace `$` with another alias. This can be helpful\
    \ in three ways: It can relinquish the use of the `$` sign to another library,\
    \ help avoid potential conflicts, and provide the ability to customize the namespace/alias\
    \ for the jQuery object.\n\nFor example, let's say that you are building a Web\
    \ application for company XYZ. It might be nice to customize jQuery so that instead\
    \ of having to use `jQuery('div').show()` or `$('div').show()` you could use `XYZ('div').show()`\
    \ instead.\n\n### Sample: sample15.html\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<body>\n    <div>Syncfusion., Inc.</div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>\n        var Syncfusion = jQuery.noConflict();\n    \
    \    // Do something with jQuery methods.\n        alert(Syncfusion(\"div\").text());\n\
    \    </script>\n</body>\n</html>\n```\n\n> **Notes:**\nBy passing the `noConflict()`\
    \ function a Boolean value of true, you can completely undo what jQuery has introduced\
    \ into the Web page. This should only be used in extreme cases because it will,\
    \ more than likely, cause issues with jQuery plugins.\n\n## Using .each() when\
    \ implicit iteration is not enough\n\nHopefully, it is obvious that if you have\
    \ an HTML page (example below) with three empty `<div>` elements, the following\
    \ jQuery statement will select all three elements on the page, iterate over the\
    \ three elements (implicit iteration), and will insert the text \"I am a div\"\
    \ in all three `<div>` elements.\n\n### Sample: sample16.html\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<body>\n    <div></div>\n    <div></div>\n    <div></div>\n\
    \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function ($) {\n    $('div').text('I am a div');\n\
    })(jQuery);\n</script>\n</body>\n</html>\n```\n\nThis is considered implicit iteration\
    \ because jQuery code assumes you would like to manipulate all three elements,\
    \ which requires iterating over the elements selected and setting the text node\
    \ value of each `<div>` with the text \"I am a div.\" When this is done by default,\
    \ it is referred to as implicit iteration.\n\nThis is pretty handy. For the most\
    \ part, the majority of the jQuery methods will apply implicit iteration. However,\
    \ other methods will only apply to the first element in the wrapper set. For example,\
    \ the jQuery method `attr()` will only access the first element in the wrapper\
    \ set when used to get an attribute value.\n\n> **Notes:**\nWhen using the `attr()`\
    \ method to set an attribute, jQuery will actually apply implicit iteration to\
    \ set the attribute and its value to all the elements in the wrapper set.\n\n\
    In the code below, the wrapper set contains all `<div>` elements in the page,\
    \ but the `attr()` method only returns the `id` value of the first element contained\
    \ in the wrapper set.\n\n### Sample: sample17.html\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<body>\n    <div id=\"div1\">I am a div</div>\n    <div id=\"\
    div2\">I am a div</div>\n    <div id=\"div3\">I am a div</div>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script>  (function($){\n        // Alerts attribute value for first element\
    \ in wrapper set.\n        alert($('div').attr('id')); // Alerts \"div1\".\n \
    \   })(jQuery); </script>\n</body>\n</html>\n```\n\nFor the sake of demonstration,\
    \ assume your goal is actually to get the **id** attribute value for each element\
    \ on the page. You could write three separate jQuery statements accessing each\
    \ `<div>` element's **id** attribute value. If we were to do that, it might look\
    \ something like this:\n\n```\n$('#div1').attr('id');\n$('#div2').attr('id');\n\
    $('#div3').attr('id');\n// or\nvar $divs = $('div'); // Cached query.\n$divs.eq(0).attr('id');\
    \ // Start with 0 instead of 1.\n$divs.eq(1).attr('id');\n$divs.eq(2).attr('id');\n\
    ```\n\nThat seems a bit verbose, no? Wouldn't it be nice if we could loop over\
    \ the wrapper set and simply extract the **id** attribute value from each of the\
    \ `<div>` elements? By using the `$().each()` method, we invoke another round\
    \ of iteration when our wrapper set requires explicit iteration to handle multiple\
    \ elements.\n\nIn the code example below, I use the `$().each()` method to loop\
    \ over the wrapper set, access each element in the set, and then extract its **id**\
    \ attribute value.\n\n### Sample: sample18.html\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<body>\n    <div id=\"div1\">div1</div>\n    <div id=\"div2\"\
    >div2</div>\n    <div id=\"div3\">div3</div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function($){\n        // 3 alerts, one for each div.\n\
    \        $('div').each(function(){\n            // \"this\" is each element in\
    \ the wrapper set.\n            alert($(this).attr('id'));\n            // Could\
    \ also be written: alert(this.id);\n        });\n    })(jQuery);\n    </script>\n\
    </body>\n</html>\n```\n\nImagine the possibilities ahead of you with the ability\
    \ to enforce iteration anytime you please.\n\n> **Notes:**\njQuery also provides\
    \ a `$.each` function, not to be confused with the `$().each` method, which is\
    \ used specifically to iterate over a jQuery wrapper set. The `$.each` method\
    \ can actually be used to iterate over any old JavaScript array or object. It\
    \ is essentially a substitute for native JavaScript loops.\n\n## Elements in jQuery\
    \ wrapper set returned in document order\n\nThe selector engine will return results\
    \ in document order as opposed to the order in which the selectors were passed\
    \ in. The wrapper set will be populated with the selected elements based on the\
    \ order each element appears in the document, from top to bottom.\n\n### Sample:\
    \ sample19.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <h1>h1</h1>\n\
    \    <h2>h2</h2>\n    <h3>h3</h3>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // We pass in h3 first, but\
    \ h1 appears earlier in\n        // the document, so it is first in the wrapper\
    \ set.\n        alert($('h3, h2, h1').get(0).nodeName);\n        // Alerts \"\
    H1\".\n    })(jQuery);\n    </script>\n</body>\n</html>\n```\n\n## Determining\
    \ context used by the jQuery function\n\nThe default context used by the jQuery\
    \ function when selecting DOM elements is the document element (e.g. `$('a', document)`).\
    \ This means that if you do not provide the jQuery function (e.g. `jQuery()`)\
    \ with a second parameter to be used as the context for the DOM query, the default\
    \ context used is the document element, more commonly known as `<body>`."
  mdcn: "\n$(jQuery);\n</script>\n</body>\n</html>\n\n> **注意：**\n使用`get()`会结束jQuery的链式调用。它会将包装集转换为一个简单的DOM元素数组，这些元素不再具有jQuery功能的包装。因此，在`.get()`之后使用`.end()`方法无法恢复链式调用。\n\
    \n## 检查包装集是否为空\n\n在对包装集进行操作之前，检查是否确实选择了某些内容是合乎逻辑的。最简单的解决方案是使用`if`语句检查包装集是否包含任何DOM元素。\n\
    \n### 示例：sample14.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n \
    \   <a>jQuery</a>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>\n        if (jQuery('a').get(0)) { // 集合中是否有元素？\n   \
    \         jQuery('a').attr('href', 'http://www.jquery.com');\n        }\n    \
    \    if (jQuery('a').length) { // 检查集合的长度。也可以使用 .size()\n            jQuery('a').attr('title',\
    \ 'jQuery');\n        }\n    </script>\n</body>\n</html>\n```\n\n事实是，上面的`if`语句并非完全必要，因为如果找不到元素，jQuery会静默失败。但是，链接到任何空包装集的每个方法仍然会被调用。因此，虽然我们实际上可以不用`if`语句，但使用它们可能是一个好的经验法则。在空包装集上调用方法可能会导致不必要的处理，如果方法返回的值不是包装集，并且这些值被用于后续操作，则可能产生不理想的结果。\n\
    \n## 通过重命名jQuery对象本身来创建别名\n\njQuery提供了`noConflict()`方法，它有多种用途——即能够用另一个别名替换`$`。这在三个方面很有帮助：它可以将`$`符号的使用权让给另一个库，帮助避免潜在的冲突，并提供为jQuery对象自定义命名空间/别名的能力。\n\
    \n例如，假设你正在为XYZ公司构建一个Web应用程序。自定义jQuery可能会很不错，这样你就不必使用`jQuery('div').show()`或`$('div').show()`，而是可以使用`XYZ('div').show()`。\n\
    \n### 示例：sample15.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n \
    \   <div>Syncfusion., Inc.</div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>\n        var Syncfusion = jQuery.noConflict();\n    \
    \    // 使用jQuery方法做一些事情。\n        alert(Syncfusion(\"div\").text());\n    </script>\n\
    </body>\n</html>\n```\n\n> **注意：**\n通过向`noConflict()`函数传递一个布尔值true，你可以完全撤销jQuery引入到网页中的内容。这应该只在极端情况下使用，因为它很可能导致jQuery插件出现问题。\n\
    \n## 当隐式迭代不够时使用.each()\n\n希望很明显，如果你有一个HTML页面（如下例所示），其中包含三个空的`<div>`元素，下面的jQuery语句将选择页面上的所有三个元素，遍历这三个元素（隐式迭代），并在所有三个`<div>`元素中插入文本\"\
    I am a div\"。\n\n### 示例：sample16.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n<body>\n    <div></div>\n    <div></div>\n    <div></div>\n    <script src=\"\
    http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script>  (function ($) {\n    $('div').text('I am a div');\n})(jQuery);\n\
    </script>\n</body>\n</html>\n```\n\n这被称为隐式迭代，因为jQuery代码假设你想操作所有三个元素，这需要遍历选定的元素，并用文本\"\
    I am a div\"设置每个`<div>`的文本节点值。当默认完成此操作时，称为隐式迭代。\n\n这非常方便。在大多数情况下，大多数jQuery方法会应用隐式迭代。然而，其他方法仅应用于包装集中的第一个元素。例如，当用于获取属性值时，jQuery方法`attr()`仅访问包装集中的第一个元素。\n\
    \n> **注意：**\n当使用`attr()`方法设置属性时，jQuery实际上会应用隐式迭代来将属性及其值设置给包装集中的所有元素。\n\n在下面的代码中，包装集包含页面中所有的`<div>`元素，但`attr()`方法仅返回包装集中包含的第一个元素的`id`值。\n\
    \n### 示例：sample17.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n \
    \   <div id=\"div1\">I am a div</div>\n    <div id=\"div2\">I am a div</div>\n\
    \    <div id=\"div3\">I am a div</div>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script>  (function($){\n        // 弹出包装集中第一个元素的属性值。\n       \
    \ alert($('div').attr('id')); // 弹出 \"div1\"。\n    })(jQuery); </script>\n</body>\n\
    </html>\n```\n\n为了演示，假设你的目标实际上是获取页面上每个元素的**id**属性值。你可以编写三个单独的jQuery语句来访问每个`<div>`元素的**id**属性值。如果我们这样做，它可能看起来像这样：\n\
    \n```\n$('#div1').attr('id');\n$('#div2').attr('id');\n$('#div3').attr('id');\n\
    // 或者\nvar $divs = $('div'); // 缓存的查询。\n$divs.eq(0).attr('id'); // 从0开始而不是1。\n\
    $divs.eq(1).attr('id');\n$divs.eq(2).attr('id');\n```\n\n这看起来有点冗长，不是吗？如果我们能够循环遍历包装集，并简单地从每个`<div>`元素中提取**id**属性值，那不是很好吗？通过使用`$().each()`方法，当我们的包装集需要显式迭代来处理多个元素时，我们调用了另一轮迭代。\n\
    \n在下面的代码示例中，我使用`$().each()`方法循环遍历包装集，访问集合中的每个元素，然后提取其**id**属性值。\n\n### 示例：sample18.html\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n    <div id=\"div1\">div1</div>\n\
    \    <div id=\"div2\">div2</div>\n    <div id=\"div3\">div3</div>\n    <script\
    \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function($){\n        // 3次弹出，每个div一次。\n        $('div').each(function(){\n\
    \            // \"this\" 是包装集中的每个元素。\n            alert($(this).attr('id'));\n\
    \            // 也可以写成：alert(this.id);\n        });\n    })(jQuery);\n    </script>\n\
    </body>\n</html>\n```\n\n想象一下，能够随时强制进行迭代，这为你带来的可能性。\n\n> **注意：**\njQuery还提供了一个`$.each`函数，不要与专门用于迭代jQuery包装集的`$().each`方法混淆。`$.each`方法实际上可以用于迭代任何旧的JavaScript数组或对象。它本质上是原生JavaScript循环的替代品。\n\
    \n## jQuery包装集中的元素按文档顺序返回\n\n选择器引擎将按文档顺序返回结果，而不是选择器传入的顺序。包装集将根据每个元素在文档中从上到下出现的顺序填充选定的元素。\n\
    \n### 示例：sample19.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<body>\n \
    \   <h1>h1</h1>\n    <h2>h2</h2>\n    <h3>h3</h3>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n    <script> (function ($) {\n        // 我们先传入h3，但h1在文档中出现得更早，\n \
    \       // 所以它在包装集中是第一个。\n        alert($('h3, h2, h1').get(0).nodeName);\n  \
    \      // 弹出 \"H1\"。\n    })(jQuery);\n    </script>\n</body>\n</html>\n```\n\n\
    ## 确定jQuery函数使用的上下文\n\njQuery函数在选择DOM元素时使用的默认上下文是文档元素（例如，`$('a', document)`）。这意味着如果你没有为jQuery函数（例如，`jQuery()`）提供第二个参数作为DOM查询的上下文，那么使用的默认上下文是文档元素，通常被称为`<body>`。\n"
