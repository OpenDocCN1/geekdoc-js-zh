    src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"></script>\n\
    \    <script> (function ($) {\n        jQuery.fx.off = true;\n        $('div').slideUp();\n\
    \        jQuery.fx.off = false; // Turn animation back on.\n    })($); </script>\n\
    </body>\n</html>\n```"
