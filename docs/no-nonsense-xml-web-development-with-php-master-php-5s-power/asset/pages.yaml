  md: "# Chapter 7: Manipulating XML with PHP\n\nWith a modified document in hand,\
    \ you can now do several things with it. The most common is to output the XML\
    \ code of the modified document, either to a file on the server, or to the Web\
    \ browser.\n\n# Printing XML from DOM\n\nPrinting a DOM structure as XML code\
    \ is fairly straightforward. All we have to use is the saveXML method of the DOMDocument.\
    \ By setting the formatOutput property to true first, you can produce natively\
    \ indented XML code.\n\n```\n$doc->formatOutput = true;\necho '<p>Updated XML\
    \ source code:</p>';\necho '<pre>' htmlspecialchars($doc->saveXML()) . '</pre>';\n\
    ```\n\nWe've barely scratched the surface of DOM functionality with this discussion.\
    \ We'll get into a lot more in this and later chapters, though—especially we'll\
    \ need to create XML documents on-the-fly.\n\n# Using SimpleXML\n\nBefore the\
    \ introduction of SimpleXML in PHP 5, developers could only manipulate and process\
    \ XML with SAX and DOM. Both of these approaches required the developer to have\
    \ a thorough understanding of what he or she was getting into.\n\nThen, along\
    \ came SimpleXML. As the name implies, SimpleXML seeks to simplify the way a PHP\
    \ developer interacts with, processes, and manipulates XML data. What makes it\
    \ so wonderful? Basically, SimpleXML loads XML into a hierarchy of objects and\
    \ arrays of objects. It then allows you to access that array using familiar methods\
    \ like foreach loops and array indexes.\n\nTo put it another way, the developers\
    \ before SimpleXML recognized the fact that a large part of XML usage concerns\
    \ the extraction and processing of information, so they made those types of operations\
    \ very easy.\n\nAs we saw in Chapter 4, SimpleXML assigns each tag in an XML file\
    \ a property that matches its element name. Take a look at this very simple XML\
    \ document:\n\n```\n<document>\n  <msg>Hello</msg>\n</document>\n```"
  merge: -1
  pgno: 195
- img_proc: true
  md: "Here, we'd be able to access the value of the <msg> tag using PHP’s object\
    \ oriented arrow notation as follows:\n\necho $xml->msg;\n\n# Element Name Changes\
    \ Affect PHP Code\n\nThere's a huge drawback to this approach! If your XML element\
    \ names change for any reason, you'll have to go back and change your SimpleXML\
    \ logic to match the new names. The best way to avoid problems is to make sure\
    \ your XML documents are already stable and structured the way you need. If you\
    \ make changes to the XML after you start coding PHP, be sure to go back and change\
    \ your code to match.\n\nLet's go over each of the major features of SimpleXML.\n\
    \n# Loading XML Documents\n\nSimpleXML has to work on something, so the first\
    \ thing you need to do is identify the XML you want to process. SimpleXML can\
    \ either load a file into memory or work with XML code in the form of a PHP string.\n\
    \nTo open a file, use the simplexml_load_file function, like this:\n\n```\nFile:\
    \ simpleldemo.php (excerpt)\n```\n\n```\n$keywords = simplexml_load_file('keyword-data2.xml');\n\
    ```\n\nYou could also provide your XML as a variable, then load that variable\
    \ into memory using the simplexml_load_string function:\n\n```\nFile: simpleldemo2.php\
    \ (excerpt)\n```\n\n```\n$xml = <<<XML\n<?xml version=\"1.0\" encoding=\"iso-8859-1*?>\n\
    <keywords>\n  <keyword status=\"live\">XML</keyword>\n  <keyword status=\"in progress\"\
    >PHP</keyword>\n  <keyword status=\"live\">Perl</keyword>\n  <keyword status=\"\
    live\">JavaScript</keyword>\n  <keyword status=\"in progress\">ASP</keyword>\n\
    </keywords>\nXML;\n$keywords = simplexml_load_string($xml);\n```"
  merge: -1
  pgno: 196
- img_proc: true
  md: "# Chapter 7: Manipulating XML with PHP\n\n# Declaring PHP Strings with Heredocs\n\
    \nThe PHP string containing the XML code in the above example is declared using\
    \ heredoc syntax. If you're unfamiliar with this syntax, you can read about it\
    \ in the PHP Manual.3\n\nRegardless of the approach you take, the result will\
    \ be a hierarchy of objects and arrays called $keywords. We can now access different\
    \ parts of that structure using standard PHP object and array syntax.\n\n# The\
    \ XML Element Hierarchy\n\nWhen an XML element contains multiple child elements\
    \ with the same name (as does our keywords element in this example), those children\
    \ are stored as an array in the object hierarchy. We can therefore use array indexes\
    \ to access the various keywords we need. For example, we can use this syntax\
    \ to access the various keywords stored in our XML document:\n\n```\necho $keywords->keyword[0];\
    \ // prints \"XML\"\necho $keywords->keyword[1]; // prints \"PHP\"\n```\n\nNote\
    \ that in each case, we use the $keywords object, which represents the root element\
    \ of the document, followed by the arrow operator, and the name of the child node[0]\
    \ we are interested in (in this case, keyword). As this is an array, we use keyword[0]\
    \ to access the first keyword element. To access the second, we use keyword[1],\
    \ and so on.\n\nSometimes, you might want to obtain all the values in an XML element\
    \ array created by SimpleXML. As you might see, you can use a simple PHP loop\
    \ to loop over this to:\n\n```\necho '<ul>';nforeach ($keywords->keyword as $kw)\
    \ {\n  echo '<li>' . htmlspecialchars($kw) . '</li>';\n}\necho '</ul>';\n```\n\
    \nFile: simpledemo.php/simpledemo2.php (excerpt)\n\necho '<//ul>';';\n\nWhen an\
    \ element element contains only one child element of a given type, however, no\
    \ array is created. Instead, you can access the element directly. Let's say that\
    \ our XML file wasn't quite simple as it is. Let's suppose that it had another\n\
    \n> 3 http://www.php.net/language.types.string#language.types.syntax.heredoc"
  merge: -1
  pgno: 197
- img_proc: true
  md: "of elements—child nodes of each keyword element. Here's what that might look\
    \ like:\n\n```\n<keywords>\n  <keyword status=\"live\">\n    <name>XML</name>\n\
    \    <url>http://www.example.com/xml/</url>\n  </keyword>\n  <keyword status=\"\
    in progress\">\n    <name>PHP</name>\n    <url>http://www.example.com/php/</url>\n\
    \  </keyword>\n  ...\n</keywords>\",\n```\n\nIf we wanted to print out the name\
    \ and url element values for the first keyword, here's how we could do it:\n\n\
    ```\necho $keywords->keyword[0]->name; // \"XML\"\necho $keywords->keyword[0]->url;\
    \ // \"http://www.example.com/xml/\"\n```\n\nIt doesn't get any easier than that!\
    \ SimpleXML is so much easier than working with a DOM structure or declaring customX\
    \ handler functions.\n\nAs we have seen, SimpleXML element objects may be used\
    \ where strings are required and they will behave as strings, containing the text\
    \ value that the corresponding XML element contains. It is important to be aware,\
    \ however, that these objects are not in fact strings. This distinction comes\
    \ into effect in cases where a string is not required, and therefore PHP will\
    \ not perform the conversion for you. Here's an example:\n\n```\nif ($keywords->keyword[0]\
    \ == 'XML') {\necho 'The first keyword is XML.';\n}\n```\n\nLooking at our sample\
    \ XML document, we would expect this if statement to execute and display the message,\
    \ but it won't because $keywords->keyword[0] is an object, and is therefore not\
    \ equal to the string 'XML'. In order to make this code behave as expected, you\
    \ must perform the conversion yourself by casting the object to a string:\n\n\
    ```\nif ((string)$keywords->keyword[0] == 'XML') {\necho 'The first keyword is\
    \ XML.';\n}\n```"
