  md: '# More than Structure...


    XML documents are more than just a sequence of elements. If you take another,

    closer look at our product or DVD listing examples, you''ll notice two things:


    +   - The documents are self-describing, as we''ve already discussed.


    +   - The documents are really a hierarchy of nested objects.


    Let''s elaborate on the first point very quickly. We''ve already said that (most

    not all) XML documents are self-describing. This feature, combined with all that

    content encapsulated in opening and closing tags, takes all XML documents far

    past the realm of mere data and into the revered halls of information.


    Data can comprise a string of characters or numbers, such as 5551238888.

    This string can represent anything from a laptop''s serial number, to a pharmacy''s

    pcription ID, to a phone number in the United States. But the only way to

    turn this data into information (and therefore make it useful) is to add context

    to it—once you have context, <phone country="us">5551238888</phone> leaves no
    doubt that this

    seemingly arbitrary string of numbers is in fact a U.S. phone number.


    When you take into account the second point—that an XML document is really

    a hierarchy of objects—all sorts of possibilities open up. Remember what we

    discussed before—that, in an XML document, one element contains all the others?

    Well, that root element becomes the root of our hierarchical tree. You can think

    of that tree as a family tree, with the root element having various children (in

    this case, product elements), and each of those having various children (name,

    description, and so on). In turn, each product element has various siblings (other

    product elements) and a parent (the root), as shown in Figure 1.1.'
  merge: -1
