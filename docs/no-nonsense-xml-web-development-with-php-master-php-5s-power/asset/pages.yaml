  md: "# Second Case: Using an External DTD for Memos\n\nOur first case was simple\
    \ enough—an internal memo DTD and XML file. In that case, we embedded the DTD\
    \ right into the file. This is a practical thing to do when you're only dealing\
    \ with a small number of files for each DTD, but in Amalgated's case, they'll\
    \ be dealing with tens (if not hundreds) of thousands of memos.\n\nThere's no\
    \ way that you will have to maintain all those copies of the DTD separately. Instead,\
    \ you will have to a single DTD that is included in all of your XML files. What\
    \ you do is copy your DTD code out of your XML document and save it in a separate\
    \ file called internalmemo.dtd. Don't copy the DOctype line, or the last line\
    \ that closes off the brackets!\n\nWhen you're finished, your DTD file should\
