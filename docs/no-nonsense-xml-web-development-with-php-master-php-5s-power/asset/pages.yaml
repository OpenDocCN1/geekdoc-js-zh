    # Viewing Raw XML in Firefox


    You can also use Firefox (and other Mozilla browsers like Netscape 8) to view
    your XML files. Firefox is a popular open-source browser, and at the time this
    book wanted to print the latest version was 1.0.4. You can download a free copy
    from the Mozilla website.


    Viewing raw XML in Firefox is basically the same as viewing it in Internet Explorer,
    so you can see from Figure 1.6.


    Firefox''s built-in parser is non-validating, so you won''t be able to use it
    to check for document validity. However, it''s comforting to know that the good
    folks at the Mozilla Foundation are planning to add a validating parser in a future
    release.


    # Options for Using a Validating Parser


    Okay, so both Internet Explorer and Firefox will check your XML for well-formedness,
    but you need to know for future reference how to check that an XML file is valid
    (i.e. conforms to a DTD).² How do you do that?


    Well, there are a couple of options, listed below.


    # Using an Online Validating Parser


    There are various well-known online validating XML parsers. All you have to visit
    the appropriate page, upload your document, and the parser will validate it. Brown
    University''s Scholarly Technology Group sponsors one of the most famous parsers:


    ```

    http://www.stg.brown.edu/service/xmlvalid/

    ```


    > ¹http://www.mozilla.org/

    ²Our current product listing example does not have an associated DTD, and thus
    cannot be validated. We''ll look at DTDs in Chapter 3, at which point you''ll
    be able to try validating your XML.'
