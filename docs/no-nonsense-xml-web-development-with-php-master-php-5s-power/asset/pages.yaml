  md: '# About The Author


    Thomas Myer is the founding principal of Triple Dog Dare Media, an Austin, TX-based
    Web consultancy that specializes in building database- and XML-driven dynamic
    sites. He first entered the field of Web development in 1996 when he learned Perl.
    He was introduced to XML shortly thereafter and has worked with it extensively
    to build document repositories, search engine indexes, content portal taxonomies,
    online product catalogs, and business logic frameworks.


    # About The Technical Director


    Joe Marini has been active in the Web and graphics software industries for more
    than 15 years. He was an original member of the Dreamweaver engineering team at
    Macromedia, and has also held prominent roles in creating products such as QuarkXPress,
    mFactory’s mTropolis, and Extensis QX-Tools. Today Joe is a Senior Program Manager
    at Microsoft.


    # About The Technical Director


    As Technical Director for SitePoint, Kevin Yank oversees all of its technical
    publications—books, articles, newsletters and blogs. He has written over 50 articles
    for SitePoint on technologies including PHP, XML, ASP.NET, Java, JavaScript and
    CSS, but is perhaps best known for his book, Build Your Own Database Driven Website
    Using PHP & MySQL, also from SitePoint. Kevin now lives in Melbourne, Australia.
    In his spare time he enjoys light aircraft and learning the fine art of improvised.
    You go big red fire engine!


    # About SitePoint


    SitePoint specializes in publishing fun, practical and easy-to-understand content
    for Web professionals.


    Visit http://www.sitepoint.com/ to access our books, newsletters, articles and
    forums.'
