  md: "# Creating Handlers\n\nBefore we can do anything else with SAX in PHP, we have\
    \ to create the functions that “handle” the start tags, end tags, and character\
    \ data. These functions will be called by the SAX parser as it processes the XML—we\
    \ don’t call these functions ourselves.\n\nOur first handler, which we will call\
    \ start_element, will be responsible for handling all the start tags in our XML\
    \ document. We could name this handler anything we liked; as you’ll see in a moment,\
    \ we will tell PHP the names of the handlers we’ve created for it.\n\nThe handler\
    \ function for start tags must accept three arguments: a reference to the SAX\
    \ parser (which we’ll create shortly), the name of the element whose start tag\
    \ has been encountered, and an array of the element’s attributes (and their values).\n\
    \nAs you can see below, the handler in this case is nothing more than a switch\
    \ statement that looks for an XML tag name, and responds by outputting the proper\
    \ HTML code.\n\n```\nfunction start_element($parser, $element_name, $element_attrs)\
    \ {\n  switch ($element_name) {\n    case 'KEYWORD':\n      echo '<h1>Keywords</h1></ul>';\n\
    \      break;\n    case 'KEYWORD':\n      echo '<li></li>';\n      break;\n  }\n\
    }\n```\n\n# In SAX, all Tag Names are Uppercase\n\nBy default, the SAX parser\
    \ in PHP performs a process called case folding, in which any lowercase characters\
    \ in tag or attribute names are replaced with their uppercase equivalents before\
    \ they are handed to your handler functions. This is why the element names ‘KEYWORDS’\
    \ and ‘KEYWORD’ in this example are all in uppercase. If it really bugs you, the\
    \ PHP Manual contains some information² on how to disable case folding, but it’s\
    \ easier just to go with the flow and accommodate it.\n\n> ² http://www.php.net/xml#xml.case-folding"
  merge: -1
  pgno: 187
- img_proc: true
  md: "# Creating the Parser and Processing the XML\n\nWe'll call our next handler\
    \ function end_element. This handler is called to respond to end tags in the document,\
    \ and uses the same switch statement structure we saw above to output the appropriate\
    \ HTML code when each tag is detected:\n\n```\nfunction end_element($parser, $element_name)\
    \ {\n    switch ($element_name) {\n        case 'KEYWORDS':\n            echo\
    \ '</ul>';\n            break;\n        case 'KEYWORD':\n            echo '</li>';\n\
    \            break;\n    }\n}\n```\n\nFile: saxdemo.php (excerpt)\n\nFinally,\
    \ we need a way to handle character data. Let's create a character_data function\
    \ that prints out the value of every node it sees. Remember in XML, \"character\
    \ data\" is the name given to any text that's not markup; this handler would print\
    \ out all the stuff that resides between an element's start and end code:\n\n\
    File: saxdemo.php (excerpt)\n\n```\nfunction character_data($parser, $data) {\n\
    \    echo htmlentities($data);\n}\n```\n\nNow we've defined our custom tag and\
    \ content handling functions, it's time to instantiate our parser and get to work.\n\
    \n# Creating the Parser and Processing the XML\n\nThe next steps are relatively\
    \ easy—most of the heavy lifting is handled by our handler functions. All we have\
    \ to do is create our parser and tell it which functions we've created to handle\
    \ start tags, end tags, and character data:\n\nFile: saxdemo.php (excerpt)\n\n\
    ```\n$parser = xml_parser_create();\nxml_set_element_handler($parser, 'start_element',\
    \ 'end_element');\nxml_set_character_data_handler($parser, 'character_data');\n\
    ```\n\nOnce we've done that, we can use the standard PHP fopen function to open\
    \ our XML document:"
  merge: -1
  pgno: 188
- img_proc: true
  md: "# Chapter 7: Manipulating XML with PHP\n\n```\n$fp = fopen('keyword-data.xml',\
    \ 'r')\nor die(\"Cannot open keyword-data.xml!\");\n```\n\nThe XML document in\
    \ hand, we can use a simple while loop to read in manageable chunks (4KB is a\
    \ reasonable size), and run them through the parser with the xml_parse function.\
    \ If there's an error at any point, we use PHP's die function to print the error\
    \ message supplied by xml_error_string based on the error number given by xml_get_error_code.\
    \ xml_get_current_line_number is used to point to the specific line where the\
    \ error occurred.\n\n```\nwhile($data = fread($fp, 4096)) {\n  xml_parse($parser,\
    \ $data, feof($fp))\n  or die(sprintf('XML ERROR: %s at line %d',\n    xml_error_string(xml_get_error_code($parser)),\n\
    \    xml_get_current_line_number($parser)));\n}\n```\n\nOnce we're done with our\
    \ loop, we free the parser with xml_parser_free.\n\n```\nxml_parser_free($parser);\n\
    ```\n\nThat was a lot to take in, so let's step though the tasks again:\n\n+ \
    \  1. Create handlers for start tags, end tags, and character data.\n2. Initiate\
    \ your parser.\n3. Register your custom handlers with the parser.\n4. Open the\
    \ XML file.\n5. Loop through the file, sending each chunk of data through the\
    \ parser.\n6. Use built-in error trapping to detect problems.\n7. Free up the\
    \ parser once you're done.\n\nAs you can see, the SAX approach is very simple\
    \ and straightforward. However, it lacks some of the more powerful features of\
    \ other approaches, like DOM."
  merge: -1
  pgno: 189
