    # Our First Case: A Corporate Memo


    You work for Amalgamated International, LLC. The big boss comes into your office
    because he heard a rumor that you''re an XML wizard. This is really great news,
    because he''s just come back from a conference where he learned that XML is a
    terrific way to get your internal corporate memos under control.


    He instructs you to figure out how to get all the corporate memos into XML, and
    yes, they need to be validated, because they will be used later by an application
    that''s capable of searching through the memos.


    The first thing you do is take a look at the dozens of corporate memos you and
    your colleagues have received in the past few months. After a day or two of close
    examination, a pattern emerges.


    Just by looking at them, you can see that all memos have the following elements:


    +   - Date

    - Sender

    - Recipient list

    - Priority

    - Subject line

    - One or more paragraphs

    - Signature block

    - Preparer''s initials


    You''re sure that there''s more to it than that, so you decide to gather more
    information. When you talk to your department''s administrative assistant, he
    fills in the rest of the picture:


    +   - There is always some kind of departmental code assigned to the file. This
    code is not always printed on the physical memos, but is always used as'
