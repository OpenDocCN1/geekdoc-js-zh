  md: '# Chapter 5: XSLT in Detail


    So, how can you perform a sort and have the numbers appear in the right order—based
    on the resulting sort, not the source XML? This can be done with the help of the
    XSLT position function. The number element supports a value attribute with which
    you can control the number that is displayed. position gives the position of the
    current element within the (sorted) group of elements, it''s exactly the number
    we want:


    ```

    <xsl:template match="product">

    <p><xsl:number format="1" value="position()"></p>

    <xsl:apply-templates/> (<xsl:value-of select="@sku"/></p>

    </xsl:template>

    ```


    File: number-position.xsl (excerpt)


    The resulting list is shown in Figure 5.8.


    You may be wondering why numbering and positioning has to be so complicated. You
    may ask why you can''t just use an HTML ordered list:


    ```

    <xsl:template match="catalog">

    <h1>Product Listing/</h1>

    <p><em>Total products: <xsl:value-of select="count(product)"/> </em></p>

    <ol>

    <xsl:apply-templates select="product">

    <xsl:sort/>

    </xsl:apply-templates/>

    </ol>

    </xsl:template>


    <xsl:template match="product">

    <li><xsl:apply-templates/> (<xsl:value-of select="@sku"/>) </li>

    </xsl:template>

    ```


    HTML''s <ol> tag is a great way to make numbering work, and works regardless of
    the sort, since the numbering is performed by the browser. However, something
    like that won''t help if you''re outputting plain text. XSLT numbering provides
    a more general solution, which will work even when HTML output isn''t an option.'
  merge: -1
