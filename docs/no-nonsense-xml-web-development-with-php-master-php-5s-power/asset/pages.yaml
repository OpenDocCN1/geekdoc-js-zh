  md: 'Figure 6.5. The XSLT output is correctly displayed in Firefox (at last).


    ![](img/193b3c728296f42a8b0b0affe63e1530_172_0.png)


    Why not use similar techniques to replace the entire displayed document, rather
    than just the contents of the body? A limitation of Internet Explorer''s DOM implementation
    actually prevents this, once again. Internet Explorer uses completely different
    DOM libraries to work with documents displayed in the browser and to perform XSLT
    transformations of documents in memory. These two libraries were not designed
    to work together. The Sarissa library makes a valiant attempt at overcoming this
    limitation, but the importNode method that is used here to copy nodes from the
    transformed document to the displayed document will only work on elements that
    are allowed within the body of an HTML document, forcing us to approach the problem
    as we did.


    Thankfully, you''ll rarely perform an XSLT transformation on the client side to
    produce a full HTML document for display. More often, you''ll use XSLT to generate
    a small document fragment, in which case the technique shown here of inserting
    the result using the DOM is completely appropriate, not an inconvenient alternative.


