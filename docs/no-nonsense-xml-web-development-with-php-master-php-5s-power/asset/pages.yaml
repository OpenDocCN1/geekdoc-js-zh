  md: '# Creating Your First Basic RSS Feed


    For the description, use <description> tags:


    <description>Everything you need to know to create PHP scripts that are PayPal
    friendly.</description>


    To make this particular group of tags and content into an RSS item, we need to
    place it within an item element:


    ```

    <item>

    <title>Making PHP work with PayPal</title>

    <link>http://www.tripledogdarearemedia.com/articles/paypal-php.html</link>

    <description>Everything you need to know to create PHP scripts that are PayPal
    friendly.</description>

    </item>

    ```


    Congratulations, you''ve completed your first RSS item! We''re not done yet. We
    need to place our item into a channel element. Channels describe the source of
    the information—usually, your Website.


    RSS channels have the same elements as RSS items: title, link, and description.
    For example, here''s a channel containing the RSS item we created:


    ```

    <channel>

    <title>Ecommerce Development</title>

    <link>http://www.tripledogdarearemedia.com/articles/</link>

    <description>If it''s about ecommerce and Web development, we''ll write about
    it!</description>

    <item>

    <title>Making PHP work with PayPal</title>

    <link>http://www.tripledogdarearemedia.com/articles/paypal-php.html</link>

    <description>Everything you need to know to create PHP scripts that are PayPal
    friendly.</description>

    </item>

    </channel>

    ```


    All you have to do now is wrap the entire file with an <rss> tag, add the XML
    declaration, and you have a well-formed RSS feed:'
