    Next, we process the body text. Remember that we are planning to store our article
    body information as HTML, which means it will contain a bunch of tags. If we use
    DOM, as we have so far, to output this value as, it''ll work just fine, but the
    resulting XML file will be difficult to read, with character entities like &lt;
    and &gt; scattered throughout.


    As mentioned in Chapter 1, to keep the code readable we will instill the body
    text as a CDATA section within our XML file, so that special characters do not
    have to be converted to character entities. Instead of using createcreateTextNode,
    we''ll use createCDATASection. We''ll place all the HTML text from the form inside
    that command.


    ```

    $body = $doc->createElement(''body'');

