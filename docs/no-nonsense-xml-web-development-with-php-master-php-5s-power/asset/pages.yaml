    In addition to the method and indent attributes, we have specified a number of
    new attributes here:


    +   - omit-xml-declaration: This tells the processor not to add a <xml?> declaration
    to the top of the output document. Internet Explorer for Windows displays XHTML
    documents in Quirks Mode when this declaration is present, by omitting we can
    ensure that this browser will display it in the more desirable Standards Compliance
    mode.


    +   - media-type: Though not required by current browsers, setting this attribute
    to application/xhtml+xml offers another way for the browser to identify the output
    as an XHTML document, rather than plain XML.


    +   - encoding: Sets the character encoding of the output document, controlling
    which characters are escaped as character references (&amp;);


    +   - doctype-public doctype-system: These two attributes provide the values needed
    to generate the DOTYPE declaration for the output document. In this example, we''ve
    specified values for an XHTML 1.0 Transitional document, but you could also specify
    an XHTML 1.0 Strict if that''s what you need:


