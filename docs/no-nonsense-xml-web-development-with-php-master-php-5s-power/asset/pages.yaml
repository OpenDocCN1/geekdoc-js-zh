  md: '# Processing a Request


    Now that you''ve created a method and registered it with an XML-RPC server, you
    have to process an incoming request. To do this, you have first to capture the
    incoming HTTP POST data, which contains the request:


    ```

    $requestXml = @HTTP_RAW_POST_DATA;

    ```


    Now hand the request to the xmlrpc_server_call_method function, which identifies
    the method that was called, extracts any arguments, then dispatches it to the
    function you registered:


    ```

    $response = xmlrpc_server_call_method($xmlRpcServer, $requestXml, '''');

    ```


    Finally, let''s send the XML response back to the client:


    ```

    header(''content-type: text/xml'');necho $response;

    ```


    Once you''ve printed a response for the client, you can free up your resources
    using the xmlrpc_server_destroy function:


    ```

    xmlrpc_server_destroy($xmlRpcServer);

    ```


