  md: '# Making our Test Script Cross-Browser Compatible


    This code should print the transformed XML to the page for display. Let''s look
    at the differences between this and the Internet Explorer-specific code of the
    previous example.


    First, we must use the Sarissa class'' getDomDocument method to create XML documents
    in memory:


    File: jsTest-ie2.html (excerpt)


    ```

    var xml = Sarissa.getDomDocument();

    ```


    We must also use a class called XSLTProcessor to perform the style transformation.
    After creating the object, we load our style''s DOM representation using importStylesheets:


    File: jsTest-ie2.html (excerpt)


    ```

    var xslt = new XSLTProcessor();

    xlt.importStylesheets(xsl);

    ```


    Now, whereas Internet Explorer lets us transform our document directly to an XML
    string, other browsers (and therefore Sarissa) only support transforming a DOM
    representation of the output document. We must use the Sarissa class'' serialize
    method to convert it to a string for output:


    ```

    File: jsTest-ie2.html (excerpt)

    out out = xslt.transformToDocument(xml);

    document.write(Sarissa.serialize(out));

    ```


    Now, if you test this script in Internet Explorer, you''ll see that it produces
    the same output as the browser-specific example. Unfortunately, as 6.3 illustrates,
    we run into a bit of a glitch when we test the script in Firefox and other browsers.⁵


    What''s going on? If you use JavaScript''s alert function to display the XML of
    the output document, you''ll see the code in Figure 6.4. While this is a perfectly
    valid XHTML document, a namespace prefix of 00 has been used for the XHTML tags,
    instead of allowing XHTML to be the default namespace in the document. As a result,
    the built-in CSS rules that the browser uses do not match any of the tags, and
    you get unset output.


    > ⁵This issue was fixed with the release of Firefox 1.5 (after this book first
    went to print), where the example should work perfectly. If you need to support
    users running older browsers like Firefox 1.0, read on for the work-around; otherwise,
    feel free to skip to the next section.'
