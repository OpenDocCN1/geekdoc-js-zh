  md: '# Well-Formedness and Validity


    ated every time you want to create alternate displays of that information: all
    you have to do is create a style sheet or transformation to make your XML presentable
    in a given medium.


    For example, if you stored your information in a word processing program, it would
    contain all kinds of information about the way it would appear on the printed
    page—lots of bolding, font sizes, and tables. Unfortunately, if document also
    had to be posted to the Web as an HTML document, someone would have to convert
    it (either manually or via software), clean it up, and test it. Then, if someone
    else made changes to the original document, those changes wouldn''t cascade to
    the HTML version. If yet another person wanted to take the information and use
    it in a slide presentation, they might run the risk of using outdated information
    from the HTML version. Even if they got the right information into their presentation,
    you''d still need to track three locations in which your information lived. As
    you can see, it can get messy!


    Now, if the same information was stored in XML, you could create three different
    XSLT files to transform the XML into HTML, a slide presentation, and a printer-friendly
    format such as PostScript. If you made changes to the XML file, the other files
    would also change automatically once you passed the XML file through the process.
    (This notion, by the way, is an essential component of single-sourcing—i.e. having
    a “single source” for any information that’s reused in another application.)


    As you can see, separating information from presentation makes your XML documents
    reusable, and can save hassles and headaches in environments where a lot of information
    needs to be stored, processed, handled, and exchanged.


    Here''s another example. This book will actually be stored as XML (in the DocBook
    schema). That means the publisher can generate PDFs for its Website, make-print-ready
    files for the printer, and potentially create ebooks in the future. All formats
    will be generated from the same source, and all will be created using different
    style sheets to process the base XML files.


    # Well-Formedness and Validity


    We''ve talked a little bit about XML, what it''s used for, how it looks, how to
    conceptualize it, and how to transform it. One of the most powerful advantages
    of XML, of course, is that it allows you to define your own language.


    However, this most powerful feature also exposes great weakness of XML. If all
    of us start defining our own languages, we run the risk of being unable to un-'
  merge: -1
