  md: '# 10


    # XML and Databases


    Welcome to the last chapter of the book! We have only one more thing to cover:
    the relationship between XML and databases, which will be the focus of this chapter.
    Once we''ve discussed the theory, we''ll get our hands dirty adding to our CMS
    a PHP script-and database tables that will give us the ability to back up versions
    of our XML content.


    # XML and Databases


    If you''ve been around Web application development for any period of time, you
    probably know that most PHP, ASP, ColdFusion, and JSP development out there right
    now involves a database. Case of choice for most developers is MySQL. You may
    already be very familiar with the tasks of building tables, defining fields, extracting
    data, and adding, updating, and deleting records.


    Throughout this book, we''ve mostly talked about XML. You could say that XML is
    a document-centric technology—the shape or format that XML takes is usually some
    kind of document or file. But to focus on XML''s document-centricity ignores the
    fact that XML is essentially a self-describing semantic unit that contains discrete
    capsules of data. It also belies the fact that an increasing amount of XML traffic
    occurs in non-document contexts—think about all those SOAP requests and responses
    flying back and forth over HTTP, for example.'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'Indeed, at times, an XML document looks very much like a database. It''s this
    duality—document and database—that makes working with XML so intriguing.


    But how does XML work with actual databases, and vice versa? Why would we use
    them together? When would we use one and not the other? Is it appropriate to use
    both at the same time? Can you store XML in database tables? Is it possible to
    convert between SQL and XML data formats? What''s the best type of database to
    work with: relational, post-relational, or a native XML database?


    Let''s take a stroll down the path created by these questions, and see if we can''t
    shed a little light on the subject.


    # Why use XML and Databases Together?


    This question seems like the most obvious place to start. If you''re using a database,
    why use XML? And if you''re using XML, why use a database? Well, the answers to
    these questions can take you down many paths.


    For example, you might use your database to store a series of revisions to XML
    content. When you create a piece of XML content, you could store this XML-tagged
    content in the database with a revision ID. If you make any updates to that content,
    each of updates could also be stored with its own specific revision ID. If you
    then wanted to retrieve a particular version of your XML content, you''d have
    a relatively easy way to do it: you''d retrieve the initial piece of content along
    with its revisions, and construct the revised content from those pieces.


    Another example might involve XML primarily in a data-centric way (in other words,
    as data parcels for your Web Services). Storing this XML in a database provides
    a record of the transactions that occur over time.


    # Relational Database? Native XML Database? Somewhere in Between?


    The next thing we need to tackle is the type of database we''ll use when working
    with XML. As of this writing, the market offers four different approaches:


    # Relational


    Under this approach'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Relational Database? Native XML Database? Somewhere in Between?


    suitable for the database (which is table-column-row-oriented) to store. In the
    language of database vendors, this process is known as “decomposing” XML structures
    to an atomic level.


    With very simple XML documents, this process is straightforward. However, with
    lots of attributes, elements, namespaces, and external entities, we''d need to
    be very careful in order to make this approach work. And don''t forget that, depending
    on your needs, you''re also likely to need a means of converting the values stored
    in the database back into a self-contained XML document—potentially more work
    to occupy the wee hours in the face of impending deadlines.


    # Native XML


    A variety of vendors provide both commercial and open source native XML databases.
    These products allow you to store XML documents (also called snippets or node
    collections) directly into the database without having to shoehorn XML structures
    into conventional database tables. Information queries, extractions, and merges
    are handled with tools like XPath, XQuery, and XSLT, either inside or outside
    the database application. As such, anyone who has experience with these XML technologies
    can, in many cases, use that knowledge to work with native XML databases.


    At the time of this writing, few native XML databases support the full XML feature
    set, and insufficient key tests have been run to establish interoperability and
    portability between environments. In fact, there’s safety in choosing a relational
    (or post-relational) approach, simply because the user community is larger, and
    has already done a good job of figuring out practices.


    Following are some links to articles about native XML databases:


    +   - Introduction to Native XML Databases

    http://www.xml.com/pub/a/2001/10/31/nativexmldb.html


    +   - Native XML Databases: Bad Idea for Data?

    http://www.ibm.com/developerworks/xml/library/x-xdnat.html


    +   - Native XML Database Vendors

    http://www.service-architecture.com/products/xml_databases.html'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Chapter 10: XML and Databases


    # Post-relational


    So-called post-relational databases are relational databases with built-in support
    for XML and object-oriented data structures. This gives us the ability to store
    hierarchical or recursive information in a single field, run complex full-text
    searches, and/or use XPath/XQuery¹ to retrieve data.


    # Flat-file


    A flat-file database is a very simple type of database in which each line represents
    a record. Each field in a record can be of fixed length or varying length with
    some kind of delimiter (such as a comma). Because a flat-file database has no
    relational capabilities, this approach can generate a lot of redundant information.


    One way to store XML in a flat-file database would be to create a lookup file
    that contained pointers to XML document files, with a title for each file.


    Which of these approaches is best? Again, the answer is, "it depends." One of
    the biggest factors in choosing one approach over another will be your level of
    experience with software development in general, and database development in particular.
    A more support is available for relational databases, so if you think you''ll
    benefit from a large community of peers to help you the sticky spots, which might
    be the best way to go.


    Another big factor to consider is the type of data you intend to store. If the
    structure of your XML information is uniform and predictable, then it will fit
    nicely into the regimented fields required by a relational database. If your native
    XML database format''s ability to store data in whatever format it may take will
    be a huge benefit.


    Finally, consider what you intend to do with the XML information once it''s in
    the database. If you''re just running queries and extracting different elements
    (or collections of elements), the native XML format will do nicely—in fact, you''ll
    be able to use native tools like XPath and XQuery. On the other hand, if you need
    to perform calculations (like sum, average, and count) or run relational lookups
    on your XML information, you''ll want the features of a relational database. For
    instance, if you want to look up a unique ID, then figure how many outstanding
    invoices that customer has, it''s not likely that the native XML database will
    have any built-in tools to help you. In such circumstances, you''ll need to build
    those tools yourself.


    > ¹XQuery is a query language that is analogous to SQL and allows you to formulate
    searches on XML nodes and content.'
