- img_proc: true
  md: "# Chapter 5: XSLT in Detail\n\n```\n<xsl:if>\n```\n\nContinuing with our product\
    \ listing example, let's imagine that we only want to display those products whose\
    \ SKU is greater than 100,000. How would this work in a style sheet?\n\nThe answer\
    \ is to use the <xsl:if> tag. This instruction allows you to set a test, and then\
    \ do something based on the results. In the following style sheet, we use this\
    \ technique to print out those products that have an SKU above 100,000.\n\n```\n\
    <xsl:template match=\"catalog\">\n<h1>Product Listing</h1>\n<ol>\n  <xsl:apply-templates\
    \ select=\"product\">\n    <xsl:sort/>\n  </xsl:apply-templates>\n</ol>\n</xsl:template>\n\
    ```\n\nFile: conditional.xsl (excerpt)\n\n```\n<xsl:template match=\"product\"\
    >\n<xsl:if test=\"@sku &gt; 100000\">\n  <li><xsl:apply-templates/>\n    (<xsl:value-of\
    \ select=\"@sku\"/>)\n  </li>\n</xsl:if>\n</xsl:template>\n```\n\nNotice first\
    \ that we wrap the entire output in an HTML ordered list. Second, notice that\
    \ we use <xsl:if> to perform our test in the second template block:\n\n```\n<xsl:if\
    \ test=\"@sku &gt; 100000\">\n```\n\nFile: conditional.xsl (excerpt)\n\nEvery\
    \ element must have a corresponding test attribute. In this particular case, we're\
    \ testing the value of the sku attribute (@ in XPath notation). If it's over 100,000,\
    \ we print the product name. &gt;, as you'll know from HTML, is the escaped form\
    \ of >, the greater-than symbol.\n\n# Escaping Less-Than and Greater-Than\n\n\
    ![](img/193b3c728296f42a8b0b0affe63e1530_143_0.png)\n\nSince the less-than (<)\
    \ and greater-than (>) symbols are used to start and end tags in XML, you must\
    \ escape these characters when you use them in some other capacity. This includes\
    \ using them as operators in XPath expressions."
  merge: -1
  pgno: 143
- img_proc: true
  md: 'Thus, if you want to perform a "less than" test, you must escape the < operator
    as &lt; :


    ```

    <xsl:if test="@sku &lt; 100000">

    ```


    If you forget to escape a special character like this, chances are you''ll be
    facing an error message when you try to process a file using the style sheet.


    Figure 5.9 shows how the output displays in a Web browser.


    # Figure 5.9. Conditional processing using <xsl:if>.


    ![](img/193b3c728296f42a8b0b0affe63e1530_144_0.png)


    # <xsl:choose>


    What''s the difference between <xsl:if> and <xsl:choose>? The if element only
    allows you to test one condition at a time, whereas a choose element can have
    multiple branches, each of which responds to a different condition.


    Let''s keep working on our product example. In the last section, we used an if
    element to print out any product that had an SKU over 100,000. This time, we''re
    going to use choose to format the different products depending on their SKU values.'
  merge: -1
  pgno: 144
- img_proc: true
  md: "# Chapter 5: XSLT in Detail\n\nFile: conditional2.xsl (excerpt)\n\n```\n<xsl:template\
    \ match=\"product\">\n  <xsl:choose>\n    <xsl:when test=\"@sku &lt; 100000\"\
    >\n      <li><strong><xsl:apply-templates/>/>\n      (<xsl:value-of select=\"\
    @sku\"/>)</strong></li>\n    </xsl:when>\n    <xsl:when test=\"@sku &lt; 50000\"\
    >\n      <li><em><xsl:apply-templates/>/>\n      (<xsl:value-of select=\"@sku\"\
    />)</em></li>\n    </xsl:when>\n    <xsl:otherwise>\n      <li><xsl:apply-templates/>/>\n\
    \      (<xsl:value-of select=\"@sku\"/>)</li>\n    </xsl:otherwise>\n  </xsl:choose>\n\
    </xsl:template>\n```\n\nAs you can see, the <xsl:when> plays host to a number\
    \ of <xsl:when> tags, and optionally a <xsl:otherwise> tag. The test attributes\
    \ of the whens are checked in order, and the first one that is found to be true\
    \ determines which branch is executed. If none of the tests works out, then the\
    \ contents of the optional branch are processed instead.\n\nOur two branches in\
    \ this case are fairly straightforward. In the first branch, we check to see if\
    \ the SKU is greater than 100,000. If it is, then we print out the product's name\
    \ and its SKU in bold (<strong></strong>). In the second branch, we test to see\
    \ if the value of the SKU is greater than 50,000. If it is, we display the product's\
    \ name and SKU in italics (<em></em>). The otherwise handles any remaining products,\
    \ displaying them normally.\n\nFigure 5.10 shows the results."
  merge: -1
  pgno: 145
- img_proc: true
  md: "# Figure 5.10. Conditional processing using xsl:choose.\n\n![](img/193b3c728296f42a8b0b0affe63e1530_146_0.png)\n\
    \n# Looping Through XML Data\n\nWith <xsl:for-each>, you can loop through a set\
    \ of XML elements, each element as you specify. This looping construct is very\
    \ useful when you need to repeat a process or function multiple times, and it\
    \ can be a great time-saver over writing a template to do the job. In the example\
    \ below, we'll use for-each instead of apply-templates to print out the products\
    \ in your catalog.\n\nFile: foreach.xsl (excerpt)\n\n```\n<xsl:template match=\"\
    catalog\">\n  <h1>Product Listing</h1>\n  <ol>\n    <xsl:for-each select=\"product\"\
    >\n      <li><xsl:apply-templates/></li>\n    </xsl:for-each>\n  </ol>\n</xsl:template>\n\
    ```"
  merge: -1
  pgno: 146
- img_proc: true
  md: "As you can see, the for-each loop construct allows us to process XML data quickly,\
    \ and in a very concise manner. Although apply-templates provide greater flexibility\
    \ and is generally easier to maintain and extend, sometimes the simplicity of\
    \ a for-each is exactly what you need.\n\nWith templates, you can even add conditional\
    \ processing to print only the product nodes that have certain SKUs:\n\nFile:\
    \ foreach-conditional.xsl (excerpt)\n\n```\n<xsl:template match=\"catalog\">\n\
    \  <h1>Product Listing</h1>\n  <ol>\n    <xsl:for-each select=\"product\">\n \
    \     <xsl:if test=\"@sku &gt; 10000\">\n        <li><xsl:apply-templates/></li>\n\
    \      </xsl:if>\n    </xsl:for-each>\n  </ol>\n</xsl:template>\n```\n\nnAnother\
    \ way to achieve this would be to use a predicate in the XPath query for the for-each:\n\
    \nFile: foreach-conditional2.xsl (excerpt)\n\n```\n<xsl:template match=\"catalog\"\
    >\n  <h1>Product Listing</h1>\n  <ol>\n    <xsl:for-each select=\"product[@sku\
    \ &gt; 10000]\">\n      <li><xsl:value-of select=\".\"/></li>\n    </xsl:for-each>\n\
    \  </ol>\n</xsl:template>\n```\n\nSome might argue that this alternative method\
    \ is more elegant, pithy, and compact, while others might prefer the programmatic\
    \ structure of an if nested inside the for-each loop.\n\n# # Our CMS Project\n\
    \nIn the last chapter, we took a giant leap forward with our CMS, building most\
    \ of the public pages we'll need to make our site work. In this chapter, we're\
    \ going to finish the search engine and start adding some formatting rules to\
    \ our documents."
