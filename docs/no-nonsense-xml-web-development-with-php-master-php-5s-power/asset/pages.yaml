- img_proc: true
  md: "# Chapter 3: DTDs for Consistency\n\nonly does the use of a parameter entity\
    \ reduce typing, it also simplifies maintenance of the DTD. If, in the future,\
    \ you wanted to add another element (sidebar) as an acceptable child of those\
    \ elements, you'd only have to update the %accept-entity;\n\n```\n<ENTITY % acceptable\
    \ \"(%CDATA|b|i|u|citation|dialog|sidebar)\">\n```\n\nExternal entities point\
    \ to external information that can be copied into your XML document at runtime.\
    \ For example, you could include a stock ticker, inventory list, or other file,\
    \ using an external entity.\n\n```\n<ENTITY favorites SYSTEM \"http://www.example.com/favstocks.xml\"\
    >\n```\n\nIn this case, we are using the SYSTEM keyword to indicate that the entity\
    \ is a file that resides on a server. You'd use the entity in your XML documents\
    \ as follows:\n\n```\n<section>\n<heading>Current Favorite Stock Picks</heading>\n\
    \  &favquotes;\n</section>\n```\n\n# External DTDs\n\nThe DTD example we saw at\
    \ the start of this chapter appeared within the DOTYPE declaration at the top\
    \ of the XML document. This is okay for experimentation purposes, but with many\
    \ projects, you'll likely have dozens—or hundreds—files that must conform to the\
    \ same DTD. In these cases, it's much smarter to put the DTD in a separate file,\
    \ then refer it from your XML documents.\n\nAn external DTD is usually a file\
    \ with extension of .dtd—for example, letter.dtd. This external DTD contains the\
    \ same notational rules set forth for an internal DTD.\n\nTo reference this external\
    \ DTD, you need to add two things to your XML document. First, you must edit the\
    \ XML declaration to include the attribute standalone=\"no\":\n\n```\n<xml version=\"\
    1.0\" standalone=\"no\"?>\n```\n\nThis tells a validating parser to validate the\
    \ XML document against a separate DTD file. You must then add a DOTYPE declaration\
    \ that points to the external DTD, like this:"
