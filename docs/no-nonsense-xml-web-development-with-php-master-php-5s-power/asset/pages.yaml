  md: '# Figure 7.2. Keyword processing example.


    ![](img/193b3c728296f42a8b0b0affe63e1530_192_0.png)


    So, the results are identical to those we achieved with SAX. The main difference
    is the approach taken: in SAX, we had to create custom handlers to handle different
    tags as they rolled off the assembly line one after the other; with DOM, we get
    to access the different levels of a hierarchical node structure in any order we
    like.


    There''s one additional point that can be made about working with XML and DOM.
    If you want to change what is output, or the format of your XML changes, it''s
    much easier to keep up with these alterations in DOM than in SAX.


    For example, imagine each of our keyword elements had a status attribute, like
    this:


