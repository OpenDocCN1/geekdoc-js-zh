  md: '# XML Namespaces


    XML Namespaces were invented to rectify a common problem: the collision of documents
    using identical element names for different data.


    Let''s revisit a namespace example from this chapter’s introduction. Imagine you
    were running a bookstore and had an inventory file (called inventory.xml, naturally),
    in which you used a title element to store book titles. It''s also say that—unlikely
    though it sounds—your XML document becomes mixed with a mortgage broker’s master
    record file. In this file, the broker has used title to store information about
    a property’s legal title.


    A human being could probably figure out that one title has nothing to do with
    the other, but an application that tried to sort it would go nuts. We need a way
    to distinguish between the two different semantic universes in which these identical
    elements exist.


    Let''s get even more ambiguous: imagine you had an inventory.xml file in your
    bookstore that used the title element to store book titles, and a separate sales.xml
    file that used the title element to store the same information, but in a completely
    different context. Your inventory file stores information about books on the shelf,
    but the sales file stores information about books that have been bought by customers.


    In either situation, regardless of the chaos that lies between the contexts of
    these identical terms, we need a way to properly label each context.


    Namespaces to the rescue! XML namespaces allow you to create a unique namespace
    based on a URI (Uniform Resource Identifier), give that namespace prefix, and
    apply that prefix to XML document elements.


    # Declaring Namespaces


    To use and declare a namespace, we must first tie the namespace to a URL. Notice
    that I didn''t say URL—a specific location that you can reach (although a URI
    can be a URL). A URI is simply a unique identifier that distinguishes one thing
    (say, an XML document standard) from another. URIs can take the following forms:


    +   - Uniform Resource Locator: a specific protocol, machine address, and file
    path (e.g. http://www.tripleddogmedia.com/index.php).'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# Chapter 2: XML in Practice


    URN Uniform Resource Name: a persistent name that doesn''t point to an actual
    location for the resource, but still identifies it uniquely. For example, all
    published books have an ISBN. The ISBN uniquely identifies the book, but nowhere
    in the ISBN is there any indication as to shelf it sits on in any particular bookstore.
    However, armed with the ISBN, you could walk into the store, as an employee to
    search for you, and could take you right to the book (provided, of course, that
    it was in stock).


    The following are examples of good URIs:


    ```

    http://www.tripleledogaremedia.com/XML/Namespaces/1

    urn:bookstore-inventory-namespace

    ```


    We want to use our namespace throughout our XML documents, though, the last thing
    we want to do is type out an entire URI every time we need to distinguish one
    context from another. So, we define a prefix to our namespace to ease the strain
    on our typing fingers:


    ```

    inv="urn:bookstore-inventory-namespace"

    ```


    But, wait—we’re not done yet! We need a way to tell the XML parser that we’re
    creating a namespace. The agreed way to do that is to fix the namespace declaration
    with xmlns; like this:


    ```

    xmlns:inv="urn:bookstore-inventory-namespace"

    ```


    At this point, we have something useful. If we needed to, we could add our prefix
    to appropriate elements to disambiguate (I love that term!) and potentially ambiguous
    usage, like this:


    ```

    <inv:title>Build Your XML-Powered Web Site</inv:title>

    <title>Title Deed to the house on 123 Main St., YourTown</title>

    ```


    Names make it very clear that <inv:title> is very different from <title>.


    # Placing Namespace Declarations in your XML Documents


    In most cases, placing your namespace declarations will be rather easy. They’re
    commonly located in the root element of a document, like so:'
  merge: -1
  pgno: 61
- img_proc: true
  md: '```

    <inventory xmlns="inv:urn:bookstore-inventory-namespace">

    ...

    </inventory>

    ```


    Please note, however, that namespaces have scope. Namespaces affect the element
    in which they are declared, as well as all the children of that element. In, as
    you''ll see when we discuss XSLT later, we will use the xslt prefix in the very
    element in which we define the XSL namespace:


    ```

    <xsl:stylesheet

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform"

    xmlns="http://www.w3.org/1999/xhtml"

    version="1.0">

    ```


    Any namespace declaration that''s placed in a root element becomes available to
    all elements in that document. However, if you want to limit your namespace scope
    to a certain part of a document, feel free to do so—remembering, of course, that
    this can get pretty tricky. My advice is to declare your namespaces in the document''s
    root element, then use the prefixes when you need them.


    # Using Default Namespaces


    It would become pretty tiresome to have to type a prefix for every single element
    in a document..Fortunately, you can declare a default namespace that doesn''t
    contain a prefix. This namespace will apply to all elements that don''t contain
    prefixes.


    Let''s take another look at a typical opening <xsl:stylesheet> tag for an XSLT
    file:


    ```

    <xsl:stylesheet

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform"

    xmlns="http://www.w3.org/1999/xhtml"

    version="1.0">

    ```


    The non-prefixed namespace: xmlns="http://www.w3.org/1999/xhtml" In an XSLT file,
    this namespace governs all elements that aren''t specifically prefixed as XSLT
    elements, identifying them as XHTML tags. On the other side of the coin, all XSLT
    elements must be given the xsl: prefix.'
