  md: '# Appendix A: PHP XML Functions


    # Properties


    data


    The data string contained in the processing instruction.


    target


    The target of the processing instruction. Read-only.


    # DOMText


    Represents a string of plain text in an XML document. Extends DOMCharacterData,
    inheriting all of that class''s properties and methods.


    To create a new DOMText object directly, use the class''s object constructor.


    ```

    $text = new DOMText([string value]);

    ```


    where value, if specified, the text string in the node. If no value is specified,
    an empty text node is created.


    ![](img/193b3c728296f42a8b0b0affe63e1530_313_0.png)


    # Don''t Use the Constructor!


    It is standard practice to create a new text node using the createNode method
    of the DOMDocument object with which it should be associated.


    # Methods


    ```

    bool $text->isWhitespaceElementContent()

    ```


    Returns TRUE if this node contains only whitespace, the document has been validated,
    and the DTD requires that the parent element of this text node contains child
    elements (no text nodes). In other words, returns TRUE if this text node is insignificant
    whitespace for validation purposes (and likely application purposes).


    ```

    DOMText $text->splitText(int offset)

    ```


    Splits this text node into two nodes, where this node will contain text content
    up to specified offset and the new node will contain the remaining content (if
    any). The new node is inserted as a sibling following this node in the document
    (if it has a parent node), and is returned as a DOMText object.'
