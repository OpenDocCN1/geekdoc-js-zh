  md: '# Displaying XML in a Browser


    In Chapter 2, we went over some basic XSLT and CSS using a very simple XML document.
    In this chapter, we''re going to revisit some of those concepts with a more complex
    document. Once we''ve taken care of that, we''ll return to our CMS project and
    start building the display pages for our site.


    # A Word on XPath


    We''ve already been exposed to XSLT to a small degree. We used it to transform
    an XML letter to mother into something that could be displayed in a browser window.
    In this chapter, we''re going to use a much more complex document as our starting
    point, and we''ll learn how to use XPath.


    Understanding XPath is the key to making effective use of XSLT. XPath is used
    in a variety of applications and technologies, however, XSLT is where its power
    and versatility shine.


    For all intents and purposes, XPath is a query language. It allows us to declare-ively
    specify a "path" to an element or group of elements in an XML document. It uses
    a simple notation that is very similar to directory paths (hence the name XPath).
    You''ve already seen XPath in action within XSLT through some of the earlier examples.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Chapter 4: Displaying XML in a Browser


    When we put together a template, we normally use XPath to establish a match. For
    example, we can always handle the root of an XML document like:


    ```

    <xsl:template match="/">

    ```


    With XPath, you can select all elements that have a particular tag name. For example,
    this template will match all the <title> tags in the document:


    ```

    <xsl:template match="title">

    ```


    Or, you could match elements depending on their location within an XML file. To
    match <title> tags that have a <memo> tag as their parent, you would use this
    expression:


    ```

    <xsl:template match="memo/title">

    ```


    As you can see, the basic XPath syntax looks like a file path on your computer.
    That because XML documents and your computer''s file system are both hierarchical
    in nature. But you can go a step further and set conditions on which elements
    are matched within your specified path. These conditions are called predicates,
    and appear within square brackets following the element name you wish to set conditions
    for.


    This example contains a predicate to make sure that it matches only <title> tags
    whose priority attribute is set to hot:


    ```

    <xsl:template match="title[@priority=''hot'']">

    ```


    The @ symbol identifies priority in this example as an attribute name, not a tag
    name.


    XPath also has a number of useful functions built in. For example, if you need
    to get the first or last element of a series, you can use XPath to do this template
    will match the first <para> tag within each <memo> tag:


    ```

    <xsl:template match="memo/para[first()"]

    ```


    This template will match the first <para> tag within the last <memo> tag:


    ```

    <xsl:template match="memo[last()]/para[first()"]

    ```'
  merge: -1
  pgno: 103
- img_proc: true
  md: "Although most practical applications are relatively simple, XPath can get quite\
    \ twisty when it needs to be. The XPath Recommendation¹ is quite a useful reference\
    \ to these areas of complexity.\n\nI've been giving you examples within XSLT context,\
    \ but XPath is used in a lot of different places, including PHP 5's new SimpleXML\
    \ API. We'll get into SimpleXML a little later.\n\n# # Practical XSLT Application\n\
    \nInstead of using a simple letter to mother, let's use something a bit more complex:\
    \ a book chapter. Book chapters provide an excellent opportunity to understand\
    \ the arbitrary complexity of most XML documents.\n\nIf you were to look at a\
    \ typical book chapter (like this one), you'd probably think of it as a flow of\
    \ information. From the perspective of an XML document designer, however, a book\
    \ chapter can be intimidatingly complex. Chapters can have titles and sections,\
    \ and those sections can have titles. There are paragraphs throughout—some along\
    \ the chapter (for example, introductory paragraphs), but others along sections.\
    \ Sections contain subsections. Paragraphs contain text in italics, bold text,\
    \ and other inline markup. In fact, one could have different types of paragraphs,\
    \ like notes, warnings, and tips. We mustn't forget that chapters can also hold\
    \ non-textual content, in the form of images, graphs, and other visual materials.\
    \ There are lots of possibilities for displaying these kinds of information.\n\
    \nHere's a very short chapter might look like:\n\n```\n<xml version=\"1.0\"?>\n\
    <xml-stylesheet type=\"text/xsl\" href=\"chapter2html.xsl\"?>\n<chapter id=\"\
    example\">\n<title>XML Example</title>\n<para type=\"intro\">This is an introductory\
    \ paragraph. It doesn't\nbelong to all of the sections.</para>\n<section>\n  <title>Main\
    \ Section</title>\n  <para type=\"intro\">This is the <b>first/</b> paragraph\
    \ of the\nfirst section.</para>\n  <para>Second paragraph.</para>\n  <para type=\"\
    note\">This is a note!</para>\n```"
