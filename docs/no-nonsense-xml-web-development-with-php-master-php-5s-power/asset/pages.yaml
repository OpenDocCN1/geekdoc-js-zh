    # DTD and XML Schema


    A document type definition (DTD) is a set of rules that governs the order in which
    elements can be used, and the kind of information each can contain. XML Schema
    is a newer standard with capabilities that extend beyond those of DTDs. While
    a DTD can provide only general control over element ordering and containment,
    schemas are a lot more specific. They can, for example, allow elements to appear
    only a certain number of times, or require elements to contain specific types
