    # Building an XML-RPC Client that Counts Articles


    Now that we have a server, it''s time to create a client. However, I''ve got some
    bad news: the XML-RPC extension for PHP doesn''t make HTTP requests by itself.
    However, it *does* come with some very handy include files that allow you to create
    clients easily.


    First, you''ll have to download the XML-RPC EPI PHP extension source package from
    http://xmlrpc-epi.sourceforge.net/. Click the Downloads link on that site and
    grab the latest version of the xmlrpc-epi-php package (0.51 as of this writing).
    Extract the file and copy the contents of the /sample/utils directory (including
    utils.php) into a directory in your PHP include_path. In the next couple of examples,
    I''ll assume you''ve placed in your include_path a directory named xmlrpc_utils
    containing these files. I''ve included these files in the code archive for your
    convenience.


    Once we have the necessary library files installed, we can make short work of
    the client. The function that does the work when we call our methods is xu_rpc_http_concise.
    This function is defined in the xmlrpc_utils/utils.php file that''s now located
    in our PHP include_path.


    Let''s get on with the example. The first thing we have to do in our client script
    includes the XML-RPC utility library:


    File: rpccclient-count.php (excerpt)


    ```

    <?php

    error_reporting(E_ALL ^ E_NOTICE);

    include_once ''xmlrpc_utils/utils.php'';

    ```


    Note that I''ve disabled reporting of notice-level errors at the top of this script,
    as the utils.php produces several of these.


    Next, set three variables, $server, $port, and $uri, to point to your server,
    the port on which the server is listening, and the location of the XML-RPC server
    script you set up, respectively. You''ll be using these variables soon.'
