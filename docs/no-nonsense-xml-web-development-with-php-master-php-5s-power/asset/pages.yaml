  md: "We can then use the SimpleXML API to do whatever’s required—for example, to\
    \ search for and display nodes with a certain attribute value.\n\nFile: sxmldemos5.php\
    \ (excerpt)\n\n```\n$keywords = simplexml_import_dom($doc);\necho '<ul>';\nforeach\
    \ ($keywords->xpath('keyword[@status=\"live\"]') as $kw) {\n    echo '<li>' .\
    \ htmlspecialchars($kw) . '</li>';\n}\necho '</ul>';\n```\n\nThis will display\
    \ the list of keywords with a status of live, including “JSP”, which was added\
    \ using DOM.\n\n# When to Use the Different Methods\n\nYou might be wondering\
    \ it’s appropriate to use SAX, DOM, and/or SimpleXML. Here are a few rules of\
    \ thumb:\n\n+   - If you have a very simple XML document that needs only linear\
    \ processing, and you don’t need to modify the document, SAX is a good candidate.\n\
    \n+   - If you need to process a more complex XML document, but only to extract\
    \ information, SimpleXML is a good choice.\n\n+   - If you need to create XML\
    \ documents from scratch, or make heavy modifications to existing documents, use\
    \ DOM.\n\n# Our CMS Project\n\nIt’s now time to create the administrative side\
    \ of our CMS. Our administrative tools will allow authorized users to log in to\
