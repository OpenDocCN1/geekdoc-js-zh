    > First of all, if you prefer Internet Explorer, the situation will improve with
    the next example, which conforms to Internet Explorer''s assumption that the result
    of a transformation must be HTML, not plain text as it was in this example.


    > As for the other browsers in popular use, including Safari and Opera, do not
    support XSLT. For this reason, it is not yet practical to rely on browser support
    for XSL in a real-world website. As we''ll learn in Chapter 7, it is far more
    sensible to use XSLT on the server side, where it is safe from incompatibilities.


    > For now, however, the solid XSLT capabilities built into Firefox (and to a lesser
    degree, Internet Explorer) provide a convenient means to learn what XSLT is capable
