  md: '# Chapter 3: DTDs for Consistency


    The rest of the DTD is devoted to explaining two things:


    1. The proper order of elements in the XML document.

    2. The proper content of elements in the XML document.


    In the next few sections, I''ll walk you through the most important parts of element
    declarations. Then, we''ll work on attribute and entity declarations. Once we
    have all that under our belts, we''ll get our hands dirty building some sample
    XML files with DTDs.


    # Element Declarations


    Let''s have a look at the next line of the DTD above: the one that comes after
    the DOCTYPE.


    ```

    <ELEMENT letter (to,from,message)>

    ```


    This is called an element declaration. You can declare elements in any order you
    want, but they all must be declared in the DTD. To keep things simple, though,
    and to mirror the order in which elements appear in the actual XML file, I''d
    suggest that do what we''ve done here: declare your root element first.


    A DTD element declaration consists of a tag name and a definition in parentheses.
    These parentheses can contain rules for any of:


    +   - Plain text


    +   - A single child element


    +   - A sequence of elements


    In this case, we want the letter element to contain, in order, the elements to,
    from, and message. As you can see, the sequence of child elements is delimited.


    In fact, to be more precise, the sequence not only specifies the order in which
    the elements should appear, but also, how many of each element should appear.
    In this case, the element declaration specifies that one of each element must
    appear in the sequence. If our file contained two from elements, for example,
    it would be as invalid as if it listed the message element before to.'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'Naturally, there will come a time when you''ll need to specify more than just
    one of each element. How will you do that? With a neat little system of notation,
    defined in Table 3.1, which may remind you of UNIX regular expressions.


    # ### 3.1. XML Element Declaration Notation


    | Symbol | Meaning |

    | --- | --- |

    | ? | Element can appear only once, if at all.<br>`<!ELEMENT letter (to,from,message,sig?)`<br>(one
    optional sig) |

    | + | Element must appear at least once.<br>`<!ELEMENT letter (to,from,message,sig+)>`<br>(one
    or more sigs) |

    | * | Element can appear as many times as necessary, or none at all.<br>`<!ELEMENT
    letter (to,from,message,sig*)>`<br>(zero or more sigs) |

    | \| | Defines a choice between elements.<br>`<!ELEMENT letter (to,from,message,sig|ps)>`<br>(end
    letter with either sig or ps) |

    | () | Defines the grouping of elements.<br>`<!ELEMENT letter ((to,from,message)|#PCDATA)>`<br>(letter
    has to, from, and message just text) |


    With this notation as a backdrop, you can get pretty creative:


    Require at least two instances of an element.


    ```

    <!ELEMENT chapter (title,para,para+)>

    ```


    (at least two paras)


    Apply element count modifiers to element groups.


    ```

    <!ELEMENT chapter ((title,para+))>

    ```'
