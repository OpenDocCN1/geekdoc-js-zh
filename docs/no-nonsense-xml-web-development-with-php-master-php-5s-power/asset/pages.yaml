    appear in the article body. The best way to do this is to use a CDATA section
    within our XML document. XML parsers ignore tags, comments, and other XML syntax
    within a CDATA section—it simply passes the code through a text string, without
    trying to interpret it. Here''s what this looks like:


    ```

    <body><![CDATA[

    <h1>Creating an XML-powered CMS</h1>

    <p>Here is all of our paragraph information. ..</p>

    </body>


    <article id="123">

    <author>Tom Myr</author>

    <headline>Creating an XML-powered CMS</headline>

    <description>This article will show how to create an XML-powered content management
    system</description>

    <pubdate>2004-01-20</pubdate>

    <status>live</status>

    <keywords>XML CMS</keywords>

    <body><![CDATA[

    <h1>Creating an XML-powered CMS</h1>

    <p>In this article...</p>

    </body>

    </article>

    ```


