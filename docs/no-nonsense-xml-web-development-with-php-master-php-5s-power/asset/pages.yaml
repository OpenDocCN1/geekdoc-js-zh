  md: '# Our First Case: A Corporate Memo


    part of the filename. These codes help designate the memo''s department of origin
    (accounting, finance, marketing, etc.).


    +   There is almost always a blind copy list on each memo—in other words, a list
    of recipients who, though they received it, are not listed anywhere on the memo
    as having received it.


    +   Many memos also have an expiration date. At Amalgamated, if a given memo has
    no expiration date, the information on the memo is deemed good for 180 days. Most
    memos contain information with lifetimes of less six months, so most employees
    never see this kind of information. Other memos—those concerning HR policies,
    for instance—may have expiration dates that are years away.


    With this information in hand, you begin to create a DTD for XML-based memos.


    Although your first impulse might be to run out and create a sample XML memo document,
    please resist that urge for now. There''s nothing wrong with this approach—indeed,
    it does provide useful modeling techniques. However, right now, we want to work
    with DTDs, then apply what we know to the building of the XML document.


    So, the first thing you need to do is declare a DOTYPE. Because these memos are
    internal to the company, and there may be a need for a separate external memo
    DOTYPE, you decide to use internalmemo as your root element name:


    ```

    <xml version="1.0"?>

    <!DOCTYPE internalmemo [

    ```


    Now, it''s time to define your elements. The first element—the root element—is
    internalmemo. This element will contain all the other elements, which hold date,
    sender, recipient, subject line, and all information. Because these represent
    a lot of elements, it would be useful to split your document into two logical
    partitions: header and body. The header will contain recipient, subject line,
    date, and other information. The body will contain the actual text of the memo.


    Here is the element declaration for our root element:


    ```

    <!ELEMENT internalmemo (header,body)>

    ```'
