  md: '# Introduction to XML


    In this chapter, we''ll cover the basics of XML—essentially, most of the information
    you''ll need to know to get a handle on this exciting technology. After we''re
    done exploring some terminology and examples, we''ll jump right in and start working
    with XML documents. Then, we''ll spend some time starting the project we''ll develop
    through the course of this book: building an XML-powered management system.


    # An Introduction to XML


    Who has heard of XML? Okay, just about everybody. If ever there were a candidate
    for “Most Hyped Technology” during the late 90s and the current decade, it''s
    XML (though Java would be a close contender for the title).


    When I talk about XML with developers, designers, technical writers, or other
    Web professionals, the most common question I''m asked is, “What''s the big deal?”
    In this book, I''ll explain exactly what the big deal is—how XML can be used to
    make your Web applications smarter, more versatile, and more powerful. I''ll try
    to stay away from the grandstanding hafta that has characterized much of the discussion
    of XML; instead, I''ll give you the background and know-how you''ll need to make
    XML a part of your professional skillset.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Chapter 1: Introduction to XML


    # # What is XML?


    So, what is XML? Whenever a group of people asks this question, I always look
    at the individuals’ body language. A significant portion of the group leans forward
    eagerly, wanting to learn more. The others either roll their eyes in anticipation
    of hype and half-formed theories, or cringe in fear of a long, dry history of
    markup languages. As a result, I’ve learned to keep my explanation brief.


    The essence of XML is in its name: Extensible Markup Language.


    Extensible


    XML is extensible. It lets you define your own tags, the order in which they occur,
    and how they should be processed or displayed. Another way to think about extensibility
    is to consider that XML allows all of us to extend our notion of what a document
    is: it can be a file that lives on a file server, or it can be a transient pulse
    of data that flows between two computer systems (in the case of Web Services).


    Markup


    The most recognizable feature of XML is its tags, or elements (to be more accurate).
    In fact, the elements you’ll create in XML will be very similar to the elements
    you’ve already been in your HTML documents. However, XML allows you to define
    your own set of tags.


    Language


    XML is a language that’s very similar to HTML. It’s much more flexible than HTML
    which allows you to create your own custom tags. However, it’s important to realize
    that XML is not just a language. XML is a meta-language: a language that allows
    us to create or define other languages. For example, with XML we can create other
    languages, such as RSS, MathML (a mathematical markup language), and even tools
    like XSLT. More on this later.


    # # Why Do We Need XML?


    Okay, we know what it is, but why do we need XML? We need it because HTML is specifically
    designed to describe documents for display in a Web browser, and not much else.
    It becomes cumbersome if you want to display documents in a mobile device or anything
    that’s even slightly complicated, such as translating the content from German
    to English. HTML’s sole purpose is to allow anyone to quickly create Web documents
    that can be shared with other people. XML,'
  merge: -1
  pgno: 23
- img_proc: true
  md: "# Why Do We Need XML?\n\non the other hand, isn’t just suited to the Web—it\
    \ can be used in a variety of different contexts, some of which may not have anything\
    \ to do with humans interacting with content (for example, Web Services use XML\
    \ to send requests and responses back and forth).\n\nHTML rarely (if ever) provides\
    \ information about how the document is structured or what it means. In a layman’s\
    \ terms, HTML is a presentation document, whereas XML is a data-description language.\n\
