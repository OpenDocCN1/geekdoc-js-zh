- img_proc: true
  md: "# Sorting\n\nXSLT's sort element can be a big here. It allows you to sort nodes\
    \ in alphabetical or numerical order, as well as in ascending (a, b, c) or descending\
    \ (z, y) order.\n\nLet's take a look at a hypothetical XML file, which contains\
    \ a list of products in a catalog. As you can see from the example below, the\
    \ product listing is not in any discernible order.\n\n```\n<?xml version=\"1.0\"\
    \ encoding=\"iso-8859-1\"?>\n<catalog>\n  <product sku=\"212993\">Lamp</product>\n\
    \  <product sku=\"488839\">Folder</product>\n  <product sku=\"198102\">Stapler</product>\n\
    \  <product sku=\"91882\">Notebook</product>\n  <product sku=\"873638\">Inbox</product>\n\
    \  <product sku=\"192839\">Desk</product>\n  <product sku=\"66553\">Pen</product>\n\
    \  <product sku=\"382839\">Calculator</product>\n</catalog>\n```\n\nFile: productlisting.xml\n\
    \n# Sorting Alphabetically\n\nYou can sort this product list in ascending alphabetical\
    \ order by adding an <xsl:sort> tag as a child of the <xsl:apply-templates> tag\
    \ used to select the product elements.\n\n```\n<xsl:template match=\"catalog\"\
