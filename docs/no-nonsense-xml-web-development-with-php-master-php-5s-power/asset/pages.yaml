  md: '# Chapter 1: Introduction to XML


    # Semantics and Other Jargon


    You''re going to be hearing a lot of talk about "semantics" and other linguistics
    terms in this chapter. It''s unavoidable, so bear with me. Semantics is the study
    of meaning in language.


    Humans are much better at semantics than computers, because humans are really
    good at deriving meaning. For example, if I asked you to list many names for "female
    animals" as you could, you''d probably start with "lioness," "tigress," "ewe,"
    "doe" and so. If you presented them with a list of these names and asked to provide
    a category that contained all, it''s likely you say something like "female animals."
    Furthermore, if I asked you a lioness, you''d say,


    you might say "pride," "hunt," "savannah," "Africa," and the like. From there,
    you could make the leap to other wild cats, to house cats and maybe even dogs
    (cats and dogs are both pets, after all). With very little effort, you''d be able
    to build a stunning semantic landscape,


    Needless to say, computers are really bad at this game, which is a shame, as many
    computing tasks require semantic skill. That''s why we need to give computers
    as much help we can.


    For example, a human can probably deduce that the <h2>` tag in the above document
    has been used to tag a product name within a product listing. Furthermore, a human
    might be able to guess that the first paragraph after an <h2> holds the description,
    and that the next two paragraphs contain price and shipping information, in bold.


    However, even a cursory glance at the rest of the document reveals some very human
    errors. For example, the last product name is encapsulated in <h3> tags, not <h2>
    tags. This product listing also displays a price before the description, and the
    price is italicized of appearing in bold.


    A computer program (and even some humans) that tried to decipher this document
    wouldn''t be able to make the kinds of semantic leaps required to make sense of
    it. The computer would be able only to render the document to a browser with the
    styles associated with each tag. HTML is chiefly a set of instructions for rendering
    documents inside a Web browser; it''s not a method of structuring documents to
    bring out their meaning.


    If the above document were created in XML, it might look a little like this:'
