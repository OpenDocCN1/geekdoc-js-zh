    # What’s the Point of Learning all this?


    After reading all this, some of you may still be wondering, "Well, this is pretty
    silly—I can do all with PHP on the server side and not have to worry how different
    browsers handle things."


    I have a few answers for that sort of sentiment:


    +   1. You’re exactly right.

    2. Don’t forget that learning the DOM is a useful tool not only for processing
    XML data in general, but for fiddling with the structures of HTML documents. This
    is a fundamental component of Dynamic HTML (DHTML) node collapsing, and the better
    you understand it, the better you can apply other DHTML techniques.

    3. You need to remember that it’s sometimes very useful to offload certain kinds
    of processing to the client. While this particular example showed a hard-coded
    navigation menu, it’s not difficult to imagine a more customized example that
    uses data stored in cookies on the user’s machine to create a personalized navigation
    menu. That kind of work can be left to the client without burdening the server
    unnecessarily.


    XML can be seen as a linear sequence of characters and tags, but it can also be
    seen as a hierarchical tree structure. Having an understanding of the way XML
    documents are loaded into the DOM can only enhance your ability to make decisions
    about what type of server-side parsing you will.


    There is nothing inherently magical about XML besides the fact that it provides
    a standardized representation of data; in fact, with semantically appropriate
    tags, it can become information. What is somewhat magical is the fact that XML'
