  md: '# Figure 7.4. Displaying only live keywords.


    ![](img/193b3c728296f42a8b0b0affe63e1530_194_0.png)


    # Creating Nodes


    As I mentioned earlier, the DOM allows you to add new nodes, and manipulate existing
    ones. Let''s create a new keyword element and add it to our existing DOM structure.


    We can add a new node using the create_element method of the DOMDocument object.
    All we have to do is pass in the name of our new node, and optionally its value
    node (which it should contain):


    File: domdemo4.php (excerpt)


    ```

    $newKW = $doc->createElement(''keyword'', ''XSLT'');

    ```


    Once that''s, we have to attach the new keyword node to our DOM structure. We
    can do so using the appendChild method, but we must be careful to tell the DOM
    exactly where we''re adding the node.


    In our case, the job is very easy. All we have to do is add our new keyword element
    to our established $root variable (remember, this variable represents our root
    element—in this case, keywords).


    File: domdemo4.php (excerpt)


    ```

    $root->appendChild($newKW);

    ```'
  merge: -1
