    # Creating an Inner Page


    We have the homepage all roughed out. Now, we need to build another template that
    will handle the display of the rest of the site’s content. We’ll get this work
    started now, and come back to it later as necessary.


    For now, all we have to do is make a copy of index.php and call it inner.php—this
    will maintain the same includes and layout as our homepage. We’ll make a few minor
    changes to this new template, in particular, to the code that is used to extract
    information from the correct file in the xml directory.


    An id variable will be passed in the query string, which will correspond to the
    filename of the XML file that contains the associated content. So the ID webcopy3
    will correspond to a file named webcopy3.xml in the xml directory.


    Since we’re using input from the browser (the id variable) as a filename in a
    script, we must be sure to check that the value passed is not a security risk.
    Otherwise, we could find our script turned against us as a clever hacker submits
    a value that points to some sensitive file on the system. For our purposes, a
    regular expression that verifies that the variable contains an alphanumeric string
    (only numbers and letters) will suffice.


    With these considerations in mind, here’s the code that loads the XML file associated
    with the supplied ID:


    File: innerpage.php (excerpt)


    ```

    <?php

    include_once ''common.inc.php'';

    if (!isset($_GET[''id'']) || eregi(''/^[a-z0-9]+$/'', $_GET[''id''])) {

    return;

    }

    $file = $fileDir . $_GET[''id''] . ''.xml'';

    $inner = simplexml_load_file($file);

    ?>

    ```


    With the file loaded, we must put the values inside for display in the template.
    In this instance, we’re using a single template file to display two different
    types of content: news items (news123.xml) and Web copy (webcopy123.xml). If you
    refer back to Chapter 2, where we defined these XML formats, you’ll see that the
    Web copy has navigationlabel and body elements that news items do not. We’ll have
    to detect these to make sure our template displays the right thing.


    102'
