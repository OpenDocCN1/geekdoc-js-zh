  md: 'coming from the way we''ve formatted the code in the style sheet. Each of our
    three main templates begins with a line break and then some whitespace before
    the label, which is being carried through to the output.


    But wait—what about the line break and whitespace that ends each template? Why
    isn''t that getting through to the output? Well by default, the XSLT standard³
    mandates that whenever there is only whitespace (including line breaks) between
    two tags, the whitespace should be ignored. But when there is between two tags
    (e.g. TO:), then the whitespace in and around that should be passed to the output.


    # Avoid Whitespace Insanity


    The majority of XML books and tutorials out completely ignore these whitespace
    treatment issues. And it''s true that whitespace doesn''t matter a lot of time
    when you''re dealing exclusively with XML documents (as opposed to formatted text),
    it''s likely to sneak in on you and bite you in the butt eventually. Best to get
    a good grasp of it, rather than waiting for it to set when you least expect it.


    The <xsl:text> tag is useful for controlling the effects of whitespace in our
    style sheets. All that it outputs the text it contains, even if it is just whitespace.
    Here''s the adjusted version of our style sheet, with <xsl:text> tags used to
    isolate text we want to:


    ```

    <xsl:stylesheet version="1.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    <xsl:output method="text"/>

    <xsl:template match="letter">

    <xsl:apply-templates select="*" />

    </xsl:template>

    <xsl:template match="to">

    <xsl:text>TO: </xsl:text>

    <xsl:apply-templates/>

    </xsl:text>

    </xsl:text>

    <xsl:template></></template>

    <xsl:template match="from">

    <xsl:text>FROM: </xsl:text>

    <xsl:apply-templates/>

    </xsl:text>

    </xsl:text>

    ```


    > ³ http://www.w3.org/TR/xslt#strip'
