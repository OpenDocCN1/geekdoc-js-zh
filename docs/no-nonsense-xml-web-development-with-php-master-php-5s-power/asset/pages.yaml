    ```

    <title>Buddha''s Delight</title>

    <desc>A feast for the senses!</desc>

    <price>$4.95</price>

    </meal>

    </menu>

    ```


    If it is suitable for your application, you can instead create a string variable
    to hold the XML data, then feed it to the parser. Notice to do this, you must
    use the loadXML method instead of the load method:


    File: clientsidetring-ie.html (excerpt)


    ```

    <script type="text/javascript">

    var xmlcode = ''<?xml version="1.0" encoding="iso-8859-1"?>'';

    xmlcode += ''<menu><meal>'';

    xmlcode += ''<title>Buddha\''s Delight</title>'';

    xmlcode += ''<desc>A feast for the senses!</desc>'';

    xmlcode += ''<price>$4.95</price>'';

    xmlcode += ''</meal></menu>'';


    var xml = new ActiveX("Microsoft.XMLDOM");

    xml.async = false;

    xml.loadXML(xmlcode);


    </script>

    ```


    # Accessing Different parts of the Document


    Now that we''ve successfully loaded a DOM representation of an XML document, we
    can access the information it contains in a variety of ways. In theory, the properties
    and methods used to do this are specified by the W3C DOM recommendations<sup>1</sup>
    but in practice different browsers (especially Internet Explorer) have defined
    their own interfaces, sometimes loosely inspired by the standard.


    When the parser loads an XML document, what it gives you in return is a reference
    to the document itself. From this, in our example, the menu element), you can
    get a reference to the root element in the document createElement. The children
    of that element are in accessible through the childNodes property.


    File: clientside-ie.html (excerpt)


    ```

    var nodes = xml.documentElement.childNodes;

    ```


    > 1http://www.w3.org/DOM/DOMTR'
