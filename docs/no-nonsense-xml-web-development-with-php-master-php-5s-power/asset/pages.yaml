  md: '# Chapter 1: Introduction to XML


    <br> tag, on the other hand, does not normally contain any attributes—it just
    signifies a line break.


    Remember that in XML all opening tags must be matched by a closing tag. For empty
    elements, you can use a single empty-element tag to replace this:


    ```

    <myEmptyElement></myEmptyElement>

    ```


    with this:


    ```

    <myEmptyElement/>

    ```


    The / at the end of this tag basically tells the parser that the element starts
    and ends here. It''s an efficient shorthand method that you can use to mark empty
    elements quickly.


    # The XML Declaration


    The line right at the top of our example is called the XML declaration:


    ```

    <?xml version="1.0"?>

    ```


    It''s not strictly necessary to include this line, but it''s the best way to make
    sure that any device that reads the document will know that it''s an XML document,
    and to which version of XML conforms.


    # Entities


    I mentioned entities earlier. An entity is a hadry construct, at its simplest,
    allows you to define special characters for insertion into your documents. If
    you have worked with HTML, you know that &lt; entity inserts a < character into
    a document. You can''t use the actual character because it would be treated as
    the start of a tag, so you replace it with the appropriate entity instead.


    XML, true to its extensible nature, allows you to create your own entities. Let''s
    say that your company''s copyright notice has to go on every single document.
    Instead of typing this notice over and again, you could create an entity reference
    called copyright_notice with the proper text, then use it in your XML documents
    as &copyright_notice;. What a time-saver!


    We''ll cover entities in more detail later on.'
