  md: 'manned support system set up to track your inquiries, and if our support staff
    are unable to answer your question, they send it straight to me. Suggestions for
    improvement as well as notices of any mistakes you may find are especially welcome.


    # Acknowledgements


    Picture this scene: Simon Mackie (my very talented editor) calls me from Australia,
    basically to tell me to back up, stop whining, and please just finish the damn
    book. Without Simon''s perseverance none of this would have been possible, especially
    when I hit the wall around Chapter 8.


    A Colleague once told me that without deadlines, nothing would get done; that''s
    still true, but I''d like to add that without great editing, no book would ever
    get done.


    Simon had a team of very smart reviewers who pored over every sentence and illustration
    in this book. Without their sharp eyes, this book would have been a shambling
