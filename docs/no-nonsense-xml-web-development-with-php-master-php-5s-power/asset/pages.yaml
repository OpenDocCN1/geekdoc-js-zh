- img_proc: true
  md: '# Chapter 5: XSLT in Detail


    Imagine I told you to look here:


    ```

    ../File.xml

    ```


    In this case, you''d know to look in the directory “above” your current working
    directory. What if I gave you this location?


    ```

    /home/File.xml

    ```


    You''d go all the way to the root of your directory hierarchy, and look in the
    home directory for the appropriate file. Experienced users know instinctively
    that some of these file path notations could point to the same file, or they could
    point to three completely different files, depending on the current working directory.


    XPath works in much the same way. You can always grab the root element of a document
    using this expression:


    ```

    /*

    ```


    As in file paths, the slash (/) represents root of the document structure, and
    the asterisk (*) is the wildcard that will match any XML element that occurs at
    that location. Since XML documents must have a single root element, this expression
    will match that one element, whatever it may be.


    XPath also lets you seek out and find all elements with a particular name in the
    document:


    ```

    //title

    ```


    The double-slash (//) notation in XPath means “this element or any of its descendants,
    named...” When it occurs at the start of the XPath expression, “this element”
    refers to the root of the document. The particular expression shown here will
    therefore locate any title elements anywhere in the document.


    Rather than looking for elements throughout the document, you could match only
    certain elements, depending on their context:


    ```

    memo/title

    ```


    This expression matches title elements that are children of a memo element that
    is a child of the current element. Adding double-slashes in various places can
    loosen up the requirements of this expression. For example, memo//title would
    match title elements occurring anywhere inside memo, the memo element, not only
    its children. //memo/title would match title elements that were children'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'of a memo element found anywhere in the document, not a child of the current
    element. And for the ultimate in flexibility, //memo//title would match title
    elements located anywhere inside a memo element found anywhere in the document.


    As with file paths, you can use the . and .. notation as well. Predictably, .
    is shorthand for "the current node" and .. is shorthand for "parent of the current
    node".


    If XPath were just good at retrieving nodes based on paths that would be terrific.
    As we first saw in Chapter 4, XPath also allows us to be more discriminating in
    our searches. For example, we may want to retrieve only those elements for which
    a certain attribute value is set:


    ```

    title[@priority=''hot'']

    ```


    This expression grabs title elements that are children of the current element,
    but only those that have a priority attribute set to hot. The predicate (the portion
    of the expression in square brackets) acts as a filter, restricting the results
    to those that satisfy criteria. In this case, the @ symbol in front of priority
    indicates that we''re referring to an attribute, not an element name.


    What if you want to retrieve all title nodes for which any priority value is set?
    You''d use this expression:


    ```

    title[@priority]

    ```


    You can use similar notation to find elements that have a certain value. For example,
    let''s say that in a slightly different schema, we''re storing the text value
    within a tag, not as an attribute. If we wanted to retrieve all the title elements
    that have a priority element containing a value of hot, here''s how we''d it:


    ```

    title[priority=''hot'']

    ```


    Let''s continue to mix and match. Here''s how you''d pick out all the date child
    elements of title elements anywhere in the document that have a priority attribute
    with a value of hot:


    ```

    //title[@priority=''hot'']]/date

    ```'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Chapter 5: XSLT in Detail


    XPath also provides selectors that can operate on logical node positions. For
    example, retrieve the first and last title elements of any memo elements respectively,
    you''d use:


    ```

    memo/title[first()]

    ```


    ```

    memo/title[last()]

    ```


    You could also select the first title elements of any memo elements using an index
    selector:


    ```

    memo/title[1]

    ```


    This is actually shorthand for the following:


    ```

    memo/title[position()]=1

    ```


    In other cases, you might need to select multiple branches within the same document.
    Here''s an example that shows how you pick out memo titles and authors at the
    same time:


    ```

    memo/title|memo/author

    ```


    As you can see, the XPath query language is powerful and flexible—it allows you
    to retrieve just about any combination of nodes from an XML document, which can
    make all the difference when you''re working with XSLT and other XML technologies.


    # Programmatic Aspects of XSLT


    In this section, we''re going to cover sorting, counting, numbering, conditional
    processing, and looping in XSLT. The goal is to give you a solid background in
    some of the more programmatic aspects of XSLT. Yes, there is more to XSLT than
    just displaying stuff in a browser!


    # Sorting


    Sometimes, you may want to change the order of the nodes in your XML document.
    In fact, if you''re using some kind of software process to create a file (such
    as an inventory readout), it''s likely that the nodes will be output in the same
    order in which they were written to the file.'
