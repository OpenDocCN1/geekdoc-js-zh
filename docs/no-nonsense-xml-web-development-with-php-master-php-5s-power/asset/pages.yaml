  md: '# Properties


    wholeText

    Returns the text of this and all adjacent text nodes in the document (including
    expanded entities). Read-only.


    # DOMXPath


    An object of this type enables XPath queries to be applied to an XML document.

    To create a new DOMXPath object, use the class''s object constructor:


    ```

    $xpath = new DOMXPath(DOMDocument doc);

    ```


    where doc is the document to which queries will be applied.


    # Methods


    bool $xpath->registerNamespace(string prefix, string namespaceURI)

    Registers a namespace prefix for a namespaceURI with this object, so that XPath
    expressions that include a namespace prefix will correctly map that prefix to
    the equivalent namespace in the document.


    mixed $xpath->evaluate(string expression[, DOMNode contextnode)

    Evaluates an XPath expression returning either a single node object (e.g., a DOMElement)
    or a DOMNodeList containing all the matching nodes. The expression is evaluated
    relative to the specified contextnode, or relative to the root element if one
    is specified.


    ```

    mixed $xpath->query(string expression[, DOMNode contextnode);

    ```


    Works just like evaluate, except that the result is always returned as a DOMNodeList,
    even if only a single node matches the query.


    # Properties


    document

    The document that this object will query. Read-only.'
