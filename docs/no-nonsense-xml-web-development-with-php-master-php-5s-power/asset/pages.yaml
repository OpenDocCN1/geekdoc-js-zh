- img_proc: true
  md: "# DTDs\n\n<!ELEMENT paragraph (#CDATA|b|i|u|highpriority)*> <!-- right! This\
    \ notation allows the paragraph element to contain any combination of plain text\
    \ and b, i, u, and highpriority elements. Note that with mixed content like this,\
    \ you have no control over the number or order of the elements that are used.\n\
    \n# Empty Elements\n\nWhat about elements such as the hr and br, which in HTML\
    \ contain no content at all? These are called empty elements, and are declared\
    \ in a DTD as follows:\n\n```\n<ELEMENT hr EMPTY>\n<!ELEMENT br EMPTY>\n```\n\n\
    So far, most of these makes good sense. Let's talk about attribute declarations\
    \ next.\n\n# Attribute Declarations\n\nRemember attributes? They're the extra\
    \ bits of information that hang around inside the opening tags of XML elements.\
    \ Fortunately, attributes can be controlled by DTDs, using what's called an attribute\
    \ declaration.\n\nAn attribute declaration is structured differently than an element\
    \ declaration. For one thing, we define it with ATTLIST instead of !ELEMENT. Also,\
    \ we must include in the declaration the name of the element that contains the\
    \ attribute(s), followed by a list of attributes and their possible values.\n\n\
    For example, let's say we have an XML element that contained a number of attributes:\n\
    \n```\n<actor actorid=\"HF1234\" gender=\"male\" type=\"superstar\">\nHarrison\
    \ Ford/</actor>\n```\n\nThe element and attribute declarations for that element\
    \ might look like:\n\n```\n<ELEMENT actor (#CDATA)>\n<!ATTLIST actor\n  actorid\
    \ ID #REQUIRED\n  gender (male|female) #REQUIRED\n  type CDATA #IMPLIED>\n```\n\
    \nThe easiest attribute to understand is type—it contains CDATA, or data. Basically,\
    \ this attribute can contain any string of characters or numbers."
