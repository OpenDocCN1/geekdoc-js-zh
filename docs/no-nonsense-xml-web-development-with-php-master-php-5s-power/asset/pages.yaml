  md: 'In our CMS project, we''ll use the database to store backups and versions of
    our XML documents. As such, we''ll take the relational database approach.


    # Converting Relational Data to XML


    Before we entrust our precious content to a database, let''s make sure we can
    get that XML data back again. Let''s try doing exactly that with a MySQL database,
    first using the phpMyAdmin tool, then using mysqldump command, and finally, with
    the help of a hand-rolled converter in PHP.


    After we''ve gained some experience converting database data to XML, we''ll move
    on to look at our CMS project.


    # Using phpMyAdmin to Export XML


    You''re probably already familiar with phpMyAdmin, the all-purpose MySQL interface
    that''s built in PHP to allow you to administer your MySQL databases. But did
    you know that you could use phpMyAdmin to export your MySQL data in XML format?
    You can—and it can be a definite time-saver!


    Figure 10.1. The phpMyAdmin main screen.


    ![](img/193b3c728296f42a8b0b0affe63e1530_270_0.png)


    Let''s use the phpMyAdmin tool, shown in Figure 10.1, to export a table full of
    data to XML format. First, click the plus sign that appears next to the name of
    the database that contains the table you want. Click that table name, then click
    the Export tab located at the top of the display.


    In the Export screen, choose the Export to XML Format and Save as File options,
    then click Go. Figure 10.2 shows the Export screen in action.'
