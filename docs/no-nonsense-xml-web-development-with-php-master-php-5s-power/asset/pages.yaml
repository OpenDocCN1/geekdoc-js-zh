  md: '# Chapter 2: XML in Practice


    The first thing we want to do is match the letter element that contains the rest
    of our document. This is fairly straightforward:


    ```

    <xsl:template match="letter">

    <xsl:apply-templates select="*"/>

    </xsl:template>

    ```


    This very simple batch of XSLT simply states: “when you encounter a letter element
    at the root of the document, apply any templates associated with the elements
    it contains.” Let’s break this down.


    The <xsl:template> tag is used to create a template, with the match attribute
    indicating element(s) it should match. The value of this attribute is an XPath
    expression (we''ll learn more about XPath later). In this case, the /letter value
    indicates that the template should match the letter elements at the root of the
    document. Were the simple letter, the template would match letter elements throughout
    the document.


    Now, this <xsl:template> tag contains only an <xsl:apply-templates> tag, which
    means that it doesn''t actually output anything itself. Rather, the <xsl:apply-templates>
    tag sends the processor looking for other elements with matching templates.


    By default, apply-templates will match not only elements, but text and even whitespace
    as well. XSLT processors have a default of, or implicit templates, one of which
    simply outputs any text or whitespace it encounters. Since we want to ignore any
    text or whitespace that appears between the tags <letter>, we use the select attribute
    of apply-templates to tell the processor to look for child elements in its search.
    We do this with another XPath expression: * means “all child elements of the current
    element.”


    Now, we''ve got our processor looking for elements inside letter, so we''d better
    give it some templates to match them!


    ```

    <xsl:template match="to">

    TO: <xsl:apply-templates/>

    </xsl:template>

    <xsl:template match="from">

    FROM: <xsl:apply-templates/>

    </xsl:template>

    <xsl:template match="message">

    ```


