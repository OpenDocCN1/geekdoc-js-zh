  md: "# Finishing our Search Engine\n\nThe stripes function used here is new to PHP\
    \ 5. It performs a case-insensitive search of its first argument for the second\
    \ argument, and returns false if the value was not found. In this case, we're\
    \ using it to look for the search term in the variable XML element values.\n\n\
    In the last line, we must cast the value of the status element to ((string)$item->status),\
    \ in order to compare it with the string 'live', because SimpleXML actually stores\
    \ the information as an object. You'll notice we've also cast a couple of other\
    \ values (such as $xmlItem['id']) before storing them in variables. Functions\
    \ like stripes that take only string values perform this conversion automatically,\
    \ which is why the values of the keywords, headline, and description elements\
    \ are used directly. Casting values is a fact of life in fully object languages\
    \ like Java, but in PHP it's a rare necessity.\n\nWe run a test to see if $items\
    \ array has a length greater than zero, and print out the appropriate result:\
    \ a search list, or a message stating that no content items found to match that\
    \ search term.\n\nFile search.php (excerpt)\n\n```\nif (count($items) > 0) {\n\
    \  echo '<h1>Search Results for ' . htmlspecialchars($term)\n  echo '</h1>';\n\
    \  echo '<table border=\"1\" cellspacing=\"0\" cellpadding=\"3\"\n       width=\"\
    85%\"' . '';\n  echo '<tr valign=\"top\"><th>Content Item</th><th>Content Item</th>\n\
    \       </tr>';\n  foreach ($items as $item) {\n    echo '<tr valign=\"top\"><td><a\
    \ href=\"innerpage.php?id=' .\n      $item['id'] . ''>';\n    echo htmlspecialchars($item['headline'])\
    \ . ' </a></td>';\n    echo '<td>';\n    echo preg_replace('[0-9]', '', $item['id']);\n\
    \    echo '</td>\n</tr>';\n  }\n  echo '</table>';\n} else {\n  echo '<h1>Sorry!</h1>';\n\
    \  echo '<p>No files found with the search term ' .\n      htmlspecialchars($term)\
