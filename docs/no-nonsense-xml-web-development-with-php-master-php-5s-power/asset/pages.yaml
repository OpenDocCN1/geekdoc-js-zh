    \nIf the Delete checkbox was checked for this author, we want to remove the corresponding\
    \ entry from the XML data. But before we can do that, we must first check if there\
    \ is any existing article content that is attributable to the author. What should\
    \ happen if existing content is found up to you, really: you could simply delete\
    \ the offending content, assign the content to a special \"anonymous\" author\
    \ ID; or you prompt the user for a course of action. For this example, we'll skip\
    \ the deletion and collect the author's ID in an array variable, $deleteFailures;\
