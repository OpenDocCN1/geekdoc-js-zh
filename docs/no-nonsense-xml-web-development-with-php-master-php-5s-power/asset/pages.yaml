    To save or print out the updated XML code, we''d use the asXML method:

    echo $keywords->asXML();


    # Fixing SimpleXML Shortcomings with DOM


    As simple as SimpleXML is, it does have a few shortcomings.

    For one thing, it''s not possible (at the time of writing) to add new nodes to
    an XML

    document, just change the values of existing ones. Nor is it possible to delete

    nodes. Style sheets cannot easily be attached to your XML for transformational

    purposes. And, as you''ve seen, the PHP code is highly dependent on the

    names of the XML tags—if they change, updating the code can be a real headache.


    However, SimpleXML has a very handy feature that allows it to operate

    with other PHP XML functionality. Namely, this functionality allows you to

    import DOM documents and convert them into SimpleXML data structures.


    What''s the benefit of that? The functionality allows you to do some of the heavy

    lifting using native DOM functionality in PHP; you can then convert it to Sim-

    pleXML and do the rest of your work.


    To see this in action, let''s start by loading up an XML document with DOM

    and making a change to that we can do with SimpleXML:


    ```

    $doc = new DOMDocument();

    $doc->preserveWhitespace = false;

    $doc->load(''keyword-data2.xml'');

    $root = $doc->createElement

    ```


    ```

    $newKW = $doc->createElement(''keyword'', ''JSP'');

    $newKW->setAttribute(''status'', ''live'');

    $root->appendChild($newKW);

    ```


    With a new element added to the DOM structure, we can use the

    simplexml_import_dom function to import it into a SimpleXML data structure.


    ![](img/193b3c728296f42a8b0b0affe63e1530_201_0.png)'
