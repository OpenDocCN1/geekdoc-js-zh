  md: "Chapter 5: XSLT in Detail\n\n# # Counting\n\nSorting the product listing by\
    \ SKU is good, but it might be nice to provide a total count of products as well.\
    \ We can use XPath's count function to print out the number of elements matched\
    \ by a particular expression. In the following example, I've added a count of\
    \ elements to the SKU sort example:\n\nFile: sort-count.xsl (excerpt)\n\n```\n\
    <xsl:template match=\"catalog\">\n  <h1>Product Listing</h1>\n  <p><em>Total products:\
    \ <xsl:value-of select=\"count(product)\"/></em></p>\n  <xsl:apply-templates select=\"\
    product\">\n    <xsl:sort select=\"@sku\" data-type=\"number\"/>\n  </xsl:apply-templates>\n\
    </xsl:template>\n```\n\nFigure 5.5 shows how this appears in a Web browser.\n\n\
    # Figure 5.5. Counting products.\n\n![](img/193b3c728296f42a8b0b0affe63e1530_137_0.png)"
