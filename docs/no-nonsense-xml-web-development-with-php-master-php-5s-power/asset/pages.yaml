  md: '# 9


    # XML and Web Services


    It''s time to talk about Web Services—specialized mini-programs that applications
    written in any language can access over the Internet, thanks to XML. For the most
    part, we''ll look at XML-RPC—anan older, but simpler XML standard for Web Services—but
    we''ll also make time for a glance at the latest protocol, SOAP. After that, we''ll
    dive in and add a simple Web Service to our CMS, where we''ll use XML-RPC to provide
    information about articles in the system. This will provide yet another means
    for our content to be distributed across the Web.


    # What is a Web Service?


    A Web Service is, as its name implies, any service made available over the Web.
    But what does that mean?


    In other words, Web Services take the human-centric Web to the next level. The
    Web today is mostly about humans using browsers to search for and download information.
    Web Services provide an application-centric vision of the Web, in which applications
    provide services and information to each other. Web Services use XML-based messages
    to allow applications to interact with each other in an automated fashion.


    Most Web Services are designed in such a way that that individual programming
    languages don''t really matter—I might build my Web Service with PHP, and'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Chapter 9: XML and Web Services


    someone might build a program to interact with it using ASP.NET, but who cares?
    The fact is, we''re passing standard XML messages back and forth, and so that
    becomes the glue that holds everything together regardless of what language originated
    the messages.


    What makes for a good Web Service? Well, for one thing, they should be self-describing,
    with easy-to-understand public interfaces. Another thing that makes for a good
    Web Service is its discoverability. If you publish a Web Service, it should be
    easy to find by those who need to use it. There''s a whole cloud of peripheral
    technologies surrounding Web Services that address their description and discovery.
    We won''t cover these technologies in this book; instead, we will focus on building
    practical Web Services.


    The three most common XML data formats used for building Web Services are:


    +   XML Remote Procedure Call (XML-RPC)

    This chapter will demonstrate this method.


    +   Simple Object Access Protocol (SOAP)

    We will be taking a brief glance at SOAP.


    +   Custom XML documents

    We won''t be covering this aspect of Web Services in this chapter.


    # What''s the Big Deal?


    To many folks, Web Services don''t seem all different from CGI scripts or even
    the kind of PHP, ASP.NET, and JSP scripts that extract information from databases.
    In fact, companies long ago realized they needed software that could interact
    with other software—card processors being one major example.


    So here''s the big deal. Until the age of Web Services (sounds impressive, no?)
    most of these efforts were largely ad hoc. They used proprietary methods and approaches,
    myriad programming languages, and nonstandard ways of requesting services and
    information.


    A bank, let''s say, might have a system in place that runs on Java but specially
    formatted queries to service requests. It might have an arcane set of commands
    that must be sent in just the right way to work... and the result of a query might
    come back as fixed-length data records that have to be parsed just so. Another
    bank might have a C++ system to do the very same thing, but it might use colon-delimited
    data files and command sequences similar'
  merge: -1
  pgno: 243
- img_proc: true
  md: 'to UNIX commands, because most of its clients interact via a UNIX shell. To
    work with either of these banks, you would have to write customized software that
    understood the needs and quirks of each system.


    Web Services strive to do away with this confusion. We can standardize the way
    you get requests for information, standardize the way you respond to these requests,
    and publish the interface so that others can easily request services. In this
    case, it doesn''t matter if you''re using Java or the other guy wants to use Perl
    or PHP.


    The other big deal focuses on removing the human user from a number of interactions.
    Let''s face it: if you could reroute some of the more mundane requests you receive
    every day, wouldn''t you do it?


    # What are Web Services Good?


    Any time you want to share information that is otherwise hard to find, or is frequently
    accessed, you have a candidate for a Web Service. Let me give you a couple of
    examples.


    Let''s say that you run a bookstore in a small town. In fact, you run a specialty
    bookstore selling detective and crime novels only. You decide to boost your Website''s
    offerings, by listing select detective novels available on Amazon.com.


    Granted, you could enter these items manually into your inventory listing, or
    you could write a PHP script to go scrape Amazon.com pages for information. Both
    approaches leave a lot to be desired.


    Instead, you could sign up to Amazon.com''s Web Service, which allows you to query
    an inventory listing based on multiple criteria, and get back a list of those
    items. You can then write code to format the list and post it automatically onto
    your Website. Stock quotes, weather reports, travel alerts, and auctions are all
    good candidates for this sort of approach.


    Here''s another example: one involving Web Services as the great integrator. You
    work for a Fortune 100 company that has gigabytes of data stored away in ancient,
    reliable mainframes. Someone from the Marketing department calls your boss, wanting
    access to this data. But you don''t have time to teach this person how to work
    the mainframe, and, even if you did, it''s not a good idea to give the user direct
    access.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Chapter 9: XML and Web Services


    So you build a Web Service that allows data queries to the mainframe, and transmits
    any result sets back to the user in XML format. The business doesn''t have to
    understand where the data is, what it looks like, or even how to get it. All or
    she has to do is send in an XML-formatted request; your Web Service replies with
    its own XML response.


    All across the corporate world, Web Services are being used to solve these kinds
    of "last mile" with integration, not to mention their value as a quick way to
    keep aging systems viable.


    | Where to find Web Services |

    | You can find some of the more popular Web Services at these locations: |

    | Amazon.com | http://www.amazon.com/gp/aws/landing.html |

    | Google Web APIs | http://www.google.com/apis/ |

    | XMethods Service Listing | http://www.xmethods.net/ |


    # XML-RPC


    XML-RPC is a very simple protocol that uses XML messages to perform remote procedure
    calls. A remote procedure call is a fancy way to describe a program on one computer
    calling a function stored on another computer.


    XML-RPC requests are sent via HTTP POST, and responses are embedded in the HTTP
    response. XML-RPC is platform-independent and very easy to learn. You can find
    out more about the XML-RPC standard at http://www.xmlrpc.com/.


    Here''s a very simple hypothetical example involving a weather service. All a
    user has to do is provide standard method name and pass in a US ZIP code to get
    back a temperature reading:


    ```

    <?xml version="1.0" encoding="ISO-8859-1"?>

    <methodCall>

    <methodName>getCurrentTempZip</methodName>

    <params>

    <param><value>78701</value></param>

    </params>

    </methodCall>

    ```'
