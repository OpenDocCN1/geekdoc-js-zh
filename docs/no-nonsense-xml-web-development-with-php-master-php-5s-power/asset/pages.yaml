    # Managing Authors, Administrators, and Categories\n\nI'm going to cover authors,\
    \ administrators, and categories together because in terms of function and structure,\
    \ they are all very similar. Instead of each author, administrator, or category\
    \ residing in a separate file (as is the case for articles and news items), what\
    \ we are talking about here are lists of authors, administrators, and categories.\
    \ We can take advantage of this fact in the way that we display and update the\
    \ listed information.\n\nLet's go through each of these lists, one at a time,\
    \ so you can see how we handle these kinds of structures.\n\n# Managing Authors\n\
