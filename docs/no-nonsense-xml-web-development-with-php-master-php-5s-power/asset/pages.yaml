  md: '# 8


    # RSS and RDF


    We''ve covered a good deal of information in this book, including XML, XSLT, XPath,
    and PHP functions for processing XML. In this chapter, we''re going to take what
    we''ve learned and apply it to RSS and RDF, two exciting technologies that are
    used to share and disseminate XML data.


    # What are RSS and RDF?


    Depending on where you look and who you ask, RSS stands for Really Simple Syndication,
    Rich Site Summary, or RDF Site Summary. Regardless of what the acronym stands
    for, RSS is an XML format for distributing or syndicating content. For example,
    Weblogs, or "blogs," are syndicated using this kind of XML format.


    RDF stands for Resource Description Framework, which forms the backbone of some
    but not all RSS standards. It''s a metadata standard for describing Web resources—not
    only the Web pages themselves, but also their authors, the dates and times at
    which they were last updated, their keywords and titles, and so on. That''s all
    I''m going to say about this for the moment—we''ll pick up a discussion of RSS
    versions after we''ve run through a basic example.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Chapter 8: RSS and RDF


    # What’s the Big Deal?


    Imagine that you’re a cartoonist or columnist working in relative obscurity on
    a small city’s daily newspaper. You create good stuff, but you’re not known well
    outside your local region. The easiest way to make more money and reach a wider
    audience is to do what other respected writers and cartoonists have done for decades—syndicate
    your material! If you strike the right syndication deal, your articles or art
    may start appearing in dozens or hundreds of media outlets, thereby increasing
    your pay and your exposure.


    Syndication is also a good thing from the reader’s point of view. In this modern
    age, you no longer have to send away your hometown paper in order to keep up with
    your favorite columnists or cartoonists. It’s very likely that your favorite columnist
    or cartoonist is featured in your local newspaper.


    It’s the same idea online. You may or not get rich by syndicating your content,
    but you can certainly increase your exposure. Syndication also represents a convenient
    service for your audience members, who don’t have to remember to search for your
    content or visit your site and dig through all other information to see if you’ve
    published anything new—users simply subscribe and keep getting updates. If you
    have RSS up and running, whenever you add an article or other interesting content
    item to your site, you can create an RSS entry for this content. This new entry
    will show up in RSS aggregators and listings belonging to your subscribers.


    # What Kind of Information Should be Featured in an RSS Feed?


    When you create an RSS feed, keep these rules of thumb in mind:


    +   1. The content must be list-oriented. List-oriented content includes news
    headlines, article summaries, rankings, job listings, search result listings,
    event calendars, press release summaries, and other information.

    2. The content should cover topics in which your audience has an interest. Another
    way to look at this is to ask yourself, is the content useful or instructional?
    Does it keep subscribers up-to-date with an industry or its trends? Is the material
    newsw?

    3. To warrant use of the RSS feed format, the content should change frequently.'
