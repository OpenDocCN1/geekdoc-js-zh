  md: "# XML-RPC Requests\n\nAn XML-RPC request is very simple: each request is a\
    \ combination of HTTP headers and XML content. The XML content is a single XML\
    \ root element is methodCall. This root element contains two other elements, method-Name\
    \ and params. The methodName identifies the function to call, while the params\
    \ element contains a list of param elements that represent arguments or data passed\
    \ to the function.\n\nHere's a sample request that calls a getAccountBalance method.\
    \ We pass in two parameters: an account ID and a password for that account:\n\n\
    ```\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n<methodCall>\n  <methodName>getAccountBalance</methodName>\n\
    \  <params>\n    <param>\n      <value>\n        <struct>\n          <member>\n\
    \            <name>accountId</name>\n            <value><string>1939302011</string></value>\n\
    \          </member>\n          <member>\n            <name>password</name>\n\
    \            <value><string>fakepassword</string></value>\n          </member>\n\
    \        </struct>\n      </value>\n    </param>\n  </params>\n</methodCall>\n\
    ```\n\nThe HTTP header part of the request would look something like this:\n\n\
    ```\nPOST /targetscript HTTP/1.1\nUser-Agent: identifier\nHost: script.host.name\n\
    Content-Type: text/xml\nContent-Length: request length in bytes\n```\n\nThe sections\
    \ shown in italics above will change from request to request, and from client\
    \ to client. For instance, if the script listens for requests is located at"
  merge: -1
