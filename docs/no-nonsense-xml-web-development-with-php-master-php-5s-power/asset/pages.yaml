  md: '# What if I Can''t Get a Validating Parser?


    If you can get your hands on a validating parser, don''t panic. For most purposes,
    an online resource will do the job nicely. If you work in a company that has an
    established software development group, chances are that one of the XML-savvy
    developers has already set up a good validating parser.


    About the content management system we will work on over the course of this book?
    Well, we won''t need to validate our XML documents until we get close to the project''s
    end, when we start to do with Web Services, and need to figure out how to accept
    XML content from (and send content to) organizations in the world at large.


    # Starting Our CMS Project


    Now we''ve introduced XML and played around with some documents and parsers, it''s
    time to start our project. Throughout this book, we''ll spend time building an
    XML-powered Website. Specifically, we''re going to build an XMLpowered content
    management system. This project will help ground your skills as you obtain firsthand
    experience with practical XML development techniques, issues, and processes.


    # So... What''s a Content Management System?


    A content management system (henceforth referred to as a CMS) is a piece of server-side
    software that''s used to create, publish, and maintain content easily and efficiently
    on a Website. It usually consists of the following components:


    +   - A data back-end (comprising XML or database tables) that contains all your
    articles, news stories, images, and other content.

    - A data display component—usually templates or other pages—onto which your articles,
    images, etc., are “painted” by the CMS for display to site visitors.

    - A data administration component. This usually comprises easy-to-use HTML forms
    that allow site administrators to create, edit, publish, and delete articles in
    some kind of secure workflow. The data administration portion of a CMS is usually
    the most complicated, and this is the section on which you''ll likely spend most
    of your development time.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Chapter 1: Introduction to XML


    Over the past decade, CMSs have been created using a range of different scripting
    languages including Perl/CGI, ASP, TCL, JSP, Python, and PHP. Each of these languages
    has its own pros and cons, but we''ll use PHP with XML to build our CMS.


    # Requirements Gathering


    Before you build any kind of CMS, first you must gather information that defines
    the basic requirements for the project.


    The goal of the CMS is to make things easier for those who need to develop and
    run the site. And making things easier means having to do more homework-before!
    Although you may groan at the thought of this kind of exercise, a set of well-defined
    requirements can make the project run a lot smoother.


    What kind of requirements do we need to gather? Essentially, requirements fall
    into three major categories:


    +   - What kind of content will the CMS handle? How is each type of content broken
    down? (The more complete your understanding of this issue, the easier it''ll be
    to create and manage your XML files.)


    +   - Who will be visiting the site, and what behaviors do these users expect
    to find? (For example, they will want to browse a hierarchical list of articles,
    search for articles by keyword, see links to related articles, or all three?)


    +   - What do the site administrators need to do? (For example, they may need
    to log in securely, create content, edit content, publish content, and delete
    content. If your CMS will provide different roles for administrative users—such
    as site administrators, editors, and writers—your system will become more complex.)


    As you can see, we''ve barely scratched the surface, and already we''ve uncovered
    a number of issues that need addressing. Let''s tackle them one at a time.


    # CMS Content and Metadata


    If you''re going to build a content management system, it''s logical to expect
    you''re going to want to put content into it. However, it''s not always as easy!


    The most common failing I''ve seen on dozens of CMS engagements on which I''ve
    worked is that most of the companies that actually take the time to think'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Requirements Gathering


    about content only think about one thing: “articles!" I''m not exactly why that
    is, I''d venture to guess that articles are what most folks are exposed to when
    they read newspapers, magazines, or Websites, so it''s the first—and only—content
    type that comes to mind.


    But if you''re going to build a workable CMS, you''ll have to think beyond “articles”
    and define your content types more clearly. There''s a whole range of content
    types that need management: PDFs, images, news stories, multimedia presentations,
    user reviews of whitepapers/PDFs, and much, much more. In the world of XML, each
    of these different types of content is, naturally enough, called a document-type.


    The second common failing I see is an inability to successfully convince site
    owners that content means more than just "articles." What''s even harder is to
    convince them that you have to know as much as you possibly can about each content
    type if you''re going to successfully build their CMS.


    It''s not good enough to know that you''ll be serving PDF files, news stories,
    images, and so on. You also have to know how each of these content types will
    break out into its separate components, or metadata. Metadata means “data about
    data and it is immensely useful to the CMS developer. Each article, for instance,
    will have various pieces of metadata, such as a headline, author name, and keywords,
    each of which the CMS needs to track.


    The only way to understand a content type''s metadata is to research it—in other
    words, ask yourself and others a whole lot of questions about that piece of content.


    The final challenge—to define various types of metadata—can be a blessing in disguise.
    In my experience, once people grasp the importance of metadata, they race off
    in every direction and collect every single piece of metadata that they find about
    given in every content type. Usually, we developers end up with random bits of
    information that aren''t very useful and will never be used. For example, the
    client might start to track the date on which article is first drafted. In most
    cases, this is unimportant information—the reader certainly doesn''t care!


    Obviously, it''s important to look for the right kinds of metadata, like these:


    # Provenance Metadata


    Who created the content? When was it first published? When should it automatically
    be removed from the site, or archived? How is this document uniquely identified
    in the system? Who holds the copyright to it?'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Chapter 1: Introduction to XML


    # Organizational/Administrative Metadata


    If you''re using category listings for your content, where will any individual
    piece of content live within that category system? What other content is it related
    to? Which keywords describe the content for indexing or search purposes (in other
    words, how do we find the content)? Who should have access to the content (the
    entire public, only site subscribers, or company staff)?


    # Physical/Structural Metadata


    Is the content ASCII text, an XML snippet, or a binary file, like a PDF or image?
    If it''s a file, where does it reside on the server? What is the file''s MIME
    type?


    # Descriptive Metadata


    If it''s an article, what''s the headline? Does the CMS view an article body as
    being separate from headings and paragraphs, or are all these items seen as one
    big lump of XML?


    Gathering metadata can be very tricky. Let''s take a look at a seemingly trivial
    issue: handling metadata about authors of articles. At first glance, we could
    say that all of our articles should contain elements for author name and email
    address, and leave it at that. However, we may later decide that we want visitors
    to search or browse articles by author. In this case, it would make more sense
    to have a centralized list of authors, each with his or her own unique ID. This
    would eliminate the possibility of having Tom Myer and Thomas Myer as "separate”
    just because the name was entered differently in individual articles.


    Having a separate author listing would also allow us to easily set bylines for
    each author, in a pen name. It would also allow us to track author information
    across content types. We''d know, for instance, if a particular author has penned
    articles, written reviews, or uploaded files. Of course, agreeing on this approach
    means that we need to do other work later on, such as building administrative
    interfaces for author listings.


    Once you''ve figured out the metadata for a given content type, you can move on
    to the next content type. Eventually, you''ll have a clear picture of all the
    content types you want your site to support.


    What''s the point of all this activity? Well, just think of metadata as one of
    the three pillars of your XML-powered CMS. (The other two are site functionality
    and site design. In many ways, metadata affect both and, thus, the user''s experience
    of your site.) Every piece of metadata could potentially drive some kind of site
    behavior'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'rior, but each piece of metadata also must be managed by the administration
    tools you set up.


    # Site Behavior


    Site behavior should always be based on (and driven by) metadata. For example,
    if you''re collecting keywords for all of your articles, you should be able to
    build a keyword-driven search engine for your site. If you''re not collecting
    keyword information and want a keyword-driven search engine, you''d better back
    up and figure out how to add to your content types.


    Typical site behavior for a CMS-powered Website includes by content categories,
    browsing by author, searching on titles and keywords, dynamic news sidebars. Additionally,
    many XML- and database-powered sites feature homepages that boost dynamically
    updated content, such as Top Ten Downloads, latest news headlines, and so on.


    # CMS Administration


    CMS will need to have an administrative component for each content type. It will
    also have to administer pieces of information that have nothing to do with content
    types, such as users who are authorized to log in to the CMS, and the privileges
    each of them.


    It goes without saying that your administrative interface has to be secure, otherwise,
    anyone could click to your CMS and start deleting content, making unauthorized
    changes to existing content, or adding new content that you may not want to have
    on your site.


    In cases in more than one person or department is involved with publishing content
    via the CMS, you''ll need to consider workflow. A workflow is simply a set of
    rules that allow you to define who does what, when, and how. For example, your
    workflow might stipulate that a user with writer privileges may create an article,
    but that only a production editor can approve content for publication on the site.


    In many cases, CMS workflows emulate actual workflows that exist in publication
    and marketing departments. Because we''re dealing with XML, we have a great opportunity
    to build a workflow system that''s modular and flexible enough to take into account
    different requirements.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Defining your Content Types


    We want to publish articles and news stories on our site. We definitely want to
    keep track of authors and site administrators, and we also want to build a search
    engine. We will also need to keep a record of all the copy on each of our site''s
    pages, as well as binary files as images and PDFs. That’s a lot of work! For now,
    let’s just step through the process of defining an article.


    You may be asking, “Why are we messing around with content types at all?” It does
    seem like a silly thing for a developer to be doing, but it’s actually the most
    vital task in building an XML-powered site. When I build an application, I try
    to define the content types first, because I find that all the other elements
    cascade from there. Because we’ve already spent some time discussing the structure
    of XML documents, and gathering requirements for the documents that will reside
    in our system, let’s jump right in and start to define our article content type.


    # Articles


    The articles in our CMS will be the mainstay of our site. In addition to the article
    text, each of our articles will be endowed with the following pieces of metadata:


    +   - A unique identifier

    - A headline

    - A short description

    - An author

    - A keyword listing

    - A publication date, which records when an article went live

    - Its status


    Our article content type requires a root element that contains all the others;
    we can use `<article>` as that element. This not only makes sense from a “keep
    it simple” standpoint, but it is semantically appropriate, too.


    Furthermore, because we need to identify each article in our system uniquely with
    an ID of some sort, it makes sense to add an id attribute to the root element'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'will contain this value. A unique identifier will ensure that no mistakes occur

    when we try to edit, delete, or view an existing article.


    Now, each of our articles will have an author, so we need to reserve a spot for

    that information. There are literally dozens of ways to do this, but we''ll take
    the

    simplest approach for now:


    ```

    <article id="123">

    <author>Tom Myer</author>

    </article>

    ```


    # Looking for the DTD?


    ![](img/193b3c728296f42a8b0b0affe63e1530_50_0.png)


    In Chapter 3, we''ll discuss document type definitions (DTDs)—the traditional

    means to structure the rules for an XML file—in detail. For now, I think it

    makes more sense to continue our discussion in the where we''ve already

    chosen.


    Our article will need a headline, a short description, a publication date, and
    some

    keywords. The <headline> is very simple—it can have its own element nested

    under the <article> element. Likewise, the <description> and <pubdate> ele-

    ments be nested under <article>.


    The keyword listing can be handled in one of two ways. You could create

    <article> a <keywords> element that itself was able to contain numerous

    <keyword> items:


    ```

    <article id="123">

    <author>Tom Myer</author>

    <headline>Creating an XML-powered CMS</headline>

    <description>This article will show you how to create an

    XML-powered content management system</description>

    <pubdate>2004-01-20</pubdate>

    <keywords>

    <keyword>XML</keyword>

    <keyword>CMS</keyword>

    </keywords>

    </article>

    ```


    This approach will satisfy the structure nuts out, but it turns out to be too

    complicated for the way we will eventually use these keywords. It turns out that

    all you really need is to list your keywords in a single <keywords> element, sep-

    arated by spaces:'
  merge: -1
  pgno: 50
