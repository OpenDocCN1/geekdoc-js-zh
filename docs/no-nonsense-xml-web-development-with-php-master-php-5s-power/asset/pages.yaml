    # Elements that Contain Only Text


    Let''s keep looking at our original DTD. After the letter declaration, we see
    these three declarations:


    ```

    <ELEMENT to (#PCDATA)>

    <ELEMENT from (#PCDATA)>

    <ELEMENT message (#PCDATA)>

    ```


    Here, we use #PCDATA to define the contents of our elements. #PCDATA stands for
    parsed character data, and refers to anything other than XML elements. Whenever
    you see this notation in a DTD, you know that the element must contain only text.


    # Mixed Content


    If you want to have something like this in your XML document?

    <paragraph>This is a paragraph in which items are <b>bolded</b>, <i>italicized</i>,
    and even <u>underlined</u>. Some items are even deemed <highpriority>high priority</highpriority>.

    </paragraph>


    You''d probably think that you need to declare the paragraph element as containing
    a sequence of #PCDATA and other elements, like this:


    ```

    <ELEMENT paragraph (#PCDATA,b,i,u,highpriority)> <-- wrong! -->

    ```


    You might think that, but you''d be wrong! The proper way to declare an element
    with mixed content is to separate its elements using the | symbol and add a *
    at the end of the element declaration:'
  merge: -1
