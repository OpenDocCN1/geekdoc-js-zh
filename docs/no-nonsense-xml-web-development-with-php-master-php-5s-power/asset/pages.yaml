    Next, we add an attribute to the article node. The ID will be the word article
    followed by a timestamp. On the off-chance that more than one article is created
    in the same second, we check for an existing file with the same ID in its name,
    and increment the timestamp by one until a non-clashing ID is found.


    ```

    $timestamp = date(''YmdHis'');

    do {

    $id = ''article'' . $timestamp++;

    } while (file_exists($fileDir . $id . ''.xml''));

    $root->setAttribute(''id'', $id);

    ```


    Now that we''ve created the root, it''s time to create each of that element''s
    children, in the correct order. The first is author. Notice that the author element
    is a child of article, and the ID is a child of author.


    ```

    $author = $doc->createElement(''author'');

    $root->appendChild($author);

    $atext = $doc->createTextNodeNode($_POST[''author'']);

    $author->appendChild($atext);

    ```


