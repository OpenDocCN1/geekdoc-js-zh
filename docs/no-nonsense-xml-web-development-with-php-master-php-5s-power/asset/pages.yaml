  md: '# 3 DTDs for Consistency


    So far, we''ve created some very simple XML documents and learned what they''re
    made of. We''ve also walked through some very simple examples in which we''ve
    transformed XML into something else, be it text, HTML, or different XML. Now,
    it''s time to learn how to make your XML documents consistent.


    # Consistency in XML


    Ralph Waldo Emerson, the great American thinker and essayist, once said, "A foolish
    consistency is the hobgoblin of little minds." Well, foolish or not, in the world
    of XML, we like consistency. In fact, in many contexts, consistency can be a very
    beautiful thing.


    Remember that XML allows you to create any kind of language you want. We''ve already
    seen some varying examples in this book: from a letter to a mom, to articles and
    news stories. In many cases, as long as you follow the rules of well-formedness,
    just about anything goes XML.


    However, there will come a time when you need your XML document to follow some
    rules—to pass a validity test—and those times will require that your data be consistently
    formatted. For example, our CMS should not allow a piece of data that''s supposed
    to be in the admin information file to show up in a content file. What we need
    is a way to enforce that kind of rule.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# Chapter 3: DTDs Consistency


    In XML, there are two ways to set up consistency rules: DTDs and XML Schema. A
    DTD (document type definition) is a tried and true (if not old-fashioned) of achieving
    consistency. It has a peculiar, non-XML syntax that many XML newcomers find rather
    limiting, but which evokes a comfortable, hometown charm among the old-school
    XML programmers. XML Schema is newer, faster, better, and so on; it does a lot
    more, and is written like any other XML document, but many find it as esoteric
    as DTDs.


    Information on DTDs and XML Schema could fill thick volumes if we gave it a chance.
    Each of these technologies contains lots of hidden nodes and crannies crammed
    with rules, exceptions, notations, and stories. But, remember why we''re here:
    we must learn as much as we need to know, then apply that knowledge as we build
    an XML-powered Website.


    # Fun with Terminology


    Speaking of side stories, did you know that DTD actually stands for two things?
    It stands not just for document type definition, but also document type declaration.
    The declaration consists of the lines of code that make up the definition. Since
    the distinction is a tenuous one, we''ll just call them both "DTD" and move on!


    This chapter will focus on DTDs, as you''re still a beginner, and providing information
    on XML Schema would be overkill. However, I will take a few minutes to explain
    XML Schema at a high level, and provide some comparisons with DTDs.


    Just a warning before we start this chapter: consistency in XML is probably the
    hardest aspect we''ve covered so far, because DTDs can be pretty esoteric things.
    However, I think you''ll find it worth your while, since using a DTD will prevent
    many problems down the road.


    # What''s the Big Deal About Consistency?


    Okay, before we get started, let''s ask a very obvious question: "Why, oh oh why,
    are we sitting here on a lovely Saturday afternoon talking about the importance
    of consistency in XML documents? Aren''t we out in the park with our loyal dog
    Rover, a picnic basket, and our wonderful significant other?


    Well, you''ve actually asked two questions there. I can''t answer the second one,
    because I really don''t want to get into your personal life right now. As for
    the first question, many possible answers spring to mind:


    +   1. There will be a pop quiz later, so you''d better know your stuff.'
  merge: -1
  pgno: 81
- img_proc: true
  md: "+   2. Your boss told you to learn it.\n\n+   3. You need to share your XML\
    \ document with another company/department/organization, and they expect your\
    \ information in a certain format.\n\n+   4. Your application requires that the\
    \ XML documents given to it pass certain tests.\n\nAlthough answers 1 and 2 can\
    \ loom large in one's life, answers 3 and 4 are more solid to understand the importance\
    \ of consistency in XML documents. Using a system to ensure consistency allows\
    \ your XML documents to interact with all kinds of applications, contexts, and\
    \ business systems—not just your. In layman's terms, a DTD with your XML documents\
    \ makes them easier to share with the outside world.\n\n# DTDs\n\nHow DTDs work\
    \ is relatively simple. If you supply a DTD along with your XML file, then the\
    \ XML parser will compare the content of the document with the rules that are\
    \ set out in the DTD. If the document does not conform to the rules specified\
    \ by the DTD, the parser raises an error and indicates where the processing failed.\n\
    \nDTDs are suchstrange creatures that the best way to describe them is to just\
    \ jump in and start writing them, so that exactly what we're going to do. A DTD\
    \ might look something like this:\n\n```\n<!DOCTYPE letter [\n  <!ELEMENT letter\
    \ (to,from,message)>\n  <!ELEMENT to (#PCDATA)>\n  <!ELEMENT from (#PCDATA)>\n\
    \  <!ELEMENT message (#PCDATA)>\n>\n```\n\nThose of you are paying attention should\
    \ have noticed some remarkable similarities between this DTD and the Letter to\
    \ Mother example that we worked on in Chapter 2. In fact, if you look closely,\
    \ each line of the DTD provides a clue as to how our letter should be structured.\n\
    \nThe first line of the DTD, which begins with <!DOCTYPE, indicates that our document\
    \ type is letter. Any document we create on the basis of this DTD must therefore\
    \ have a letter as its root element, or the document won't be valid."
