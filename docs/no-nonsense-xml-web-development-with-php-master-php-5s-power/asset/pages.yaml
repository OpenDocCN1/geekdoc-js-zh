  md: "To ensure that everyone plays by the rules, you need a DTD (a document type\
    \ definition), or schema. Basically, a DTD provides instructions about the structure\
    \ of your particular XML document. It's a like a rule book that states tags are\
    \ legal, and where. Once you have a DTD in place, anyone who creates product listings\
    \ for your application will have to follow the rules. We'll get into DTDs a little\
    \ later. For now, though, let's continue with the basics.\n\n# # A Closer Look\
    \ at the XML Example\n\nFrom the casual observer's viewpoint, a given XML document,\
    \ such as the one we saw in the previous section, appears to be no more than a\
    \ bunch of tags and letters. But there's more to it than that!\n\n# # A Structural\
    \ Viewpoint\n\nLet's consider our XML example from a structural standpoint. No,\
    \ not the kind of structure we belong to a document by marking it up with XML\
    \ tags; let's look at this example on a more granular level. I want to examine\
    \ the contents of a typical XML file, character by character.\n\nThe simplest\
    \ XML elements contain an opening tag, a closing tag, and some content. The opening\
    \ tag begins with a left angle bracket (<), followed by an element name that contains\
    \ letters and numbers (but no spaces), and finishes with a right angle bracket\
    \ (>). In XML, content is usually parsed data. It could consist of plain text,\
    \ other XML elements, and more exotic things like XML entities, comments, and\
    \ processing instructions (all of which we'll see later). Following the content\
    \ is the closing tag, which exhibits the same spelling and capitalization as your\
    \ opening tag, but with one tiny change: a / appears right before the element\
    \ name.\n\nHere are a few examples of valid XML elements:\n\n```\n<myElement>some\
    \ content here</myElement>\n<elements>\n  <element>one</element>\n  <element>two</element>\n\
    </elements>\n```"
