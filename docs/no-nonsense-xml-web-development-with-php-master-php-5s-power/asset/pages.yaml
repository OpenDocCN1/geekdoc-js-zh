  md: 'Chapter 6: Manipulating XML with JavaScript/DHTML


    # Making our Test Script Cross-Browser Compatible


    We now know that we have to make our little script work in both IE and Mozilla-based
    browsers like Firefox. Each type of browser handles XML loading in a different
    fashion, so any script that will work on both will have to do some browser detection
    and respond accordingly.


    The hard way to do this is to learn from scratch how to load XML in Firefox and
    Internet Explorer, and all the necessary browser detection yourself. A better
    way is to open your Web browser, and download the latest copy of the Sarissa JavaScript
    library. The package comes with a number of JavaScript (.js) files, and various
    documentation files.


    Basically, Sarissa makes it possible for you to use a single API to make your
    JavaScript XML handling in both types of browser. It''s a huge time-saver! It
    works fairly reliably on Internet Explorer 5.5 and above, Firefox 1.0 and above,
    Netscape 6 and above, and Mozilla 1.6 above.


    This example uses Sarissa to achieve what we do in the last section:


    File: jsTest-ie2.html (excerpt)


    ```

    <script type="text/javascript" src="sarissa/sarissa.js"></script>

    <script type="text/javascript">

    var xml = Sarissa.getDomDocument();

    xml.async = false;

    xml.load("test.xml");


    var xsl = Sarissa.getDomDocument();

    xsl.async = false;

    xsl.load("test.xml");


    window.onload = function() {

    var xslt = new XSLTProcessor();

    xslt.importStylesheets(xsl);

    var out = xsl.transformToDocument(xml);

    document.write(Sarissa.serialize(out));

    }

    </script>

    ```


