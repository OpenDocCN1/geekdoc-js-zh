  md: '# Telling the World about your Feed


    owners can easily point their PHP-, ASP.NET-, Perl-, Python-, and JSP-based RSS
    tools toward your feed, and add to their own sites pointers to your information.


    A link to our sample RSS feed might look like this:


    ```

    <a href="headline.xml">RSS feed/</a>

    ```


    To further promote your RSS feed, you can also include a <link> tag in your page
    header (<head>), so that RSS-enabled browsers and search engines can see your
    feed:


    ```

    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="headline.xml"
    />

    ```


    That''s all there is to it!


    # Subscribing to RSS Aggregators


    RSS aggregators, or news aggregators, are services that allow you to add your
    RSS feed to an existing catalog of RSS feeds. Other users can search for and subscribe
    to your feed, either on the Web or through a standalone, downloadable RSS feed
    reader (also called an aggregator). Here are two of the most popular RSS news
    aggregators:


    +   - Is Free is a long-standing Web-based news aggregator. Using the free service,
    you can create customized “pages” for different topics, then have headlines from
    various resources automatically filled into those pages.


    +   - Radio UserLand, a popular blog-building tool, is also another long-standing
    news aggregator. You can subscribe to a feed simply by entering its URL.


    # Make your RSS is Valid


    These services will likely require you to validate your RSS file before you submit
    it. You can find numerous RSS validators by Googling “rss validators,” or one
    is available from the W3C:


    http://www.w3.org/RDF/Validator/


    Now that we''ve covered the basics of RSS, let''s dig into the details a little
    more.


    ![](img/193b3c728296f42a8b0b0affe63e1530_226_0.png)'
