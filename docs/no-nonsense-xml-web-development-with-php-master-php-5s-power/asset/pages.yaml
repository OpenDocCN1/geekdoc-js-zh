  md: '# Manipulating XML with PHP


    In previous chapters, we processed XML on the client-side using DOM and XSLT.
    Now, we''re going to learn how to process XML on the server side, using such tools
    as SAX, DOM, and SimpleXML.


    Generally speaking, there are two ways to handle XML processing: the Document
    Object Model (DOM), which we have already seen, and the Simple API for XML (SAX).
    With the DOM, you build a hierarchical tree structure to which you can refer repeatedly.
    With SAX, you treat XML documents as a series of events—one event per element
    or attribute—and respond to those events as the document is parsed.


    Each approach has its pros and cons. DOM builds memory-intensive trees, but, once
    they''re built, the DOM provides plenty of tools to navigate, process, and manipulate
    those tree structures. SAX is one really good at handling XML documents in a linear
    fashion, which means less flexibility; however, it is fast and easy to learn.


    PHP 5.0 provides a third approach to handling XML processing—an approach that
    we''ve already seen in action. SimpleXML builds a hierarchical object structure
    like the DOM. The difference is that this structure is optimized for extracting
    and processing information, whereas the DOM provides a more general-purpose, heavy
    API for manipulating the structure of the tree.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Chapter 7: Manipulating XML with PHP


    In this chapter, we''ll cover SAX, DOM, and SimpleXML, in that order. By the end
    of these discussions, you should have a good understanding of how the different
    fetch APIs can be used to handle XML documents.


    # Using SAX


    Imagine that you build an XML document, break it apart and lay it end to end on
    an assembly line. You can see processing instructions, start tags, content, end
    tags, and so on, all laid out before you in a long line.


    You hit a button and your document starts to move down the assembly line, past
    a guy with a bullhorn. Every time a tag, comment, entity, processing instruction,
    or chunk of text (character data) goes by, the guy with the bullhorn shouts out
    "I see a ..." That''s pretty much what happens with the SAX parser.


    Unfortunately, to do anything interesting with SAX, you have to hand-roll your
    own functions to start tags, end tags, and character data, by taking immediate
    action in response to each. If you want to store any information from the document
    in a temporary data structure for later use, you have to figure out for yourself—SAX
    won''t do it for you. They don''t call it the Simple API for XML for nothing!


    So, why would you use SAX? It might be especially handy in the following situations:


    +   - You''re dealing with a large XML document that would take up too much memory
    if it were turned into a DOM tree.


    +   - You need to get your parser up and running quickly.


    +   - You''re doing a limited amount of processing, or processing that is straightforward
    and linear (i.e. translating particular XML elements into HTML elements).


    +   - You don''t need to modify the original XML document.


    The right circumstances (a large XML document, for instance), SAX will run around
    DOM. However, it''s important to understand that, in some cases, it is really
    more appropriate to use a tree structure—we''ll discuss those cases a little later.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Using SAX


    The default SAX parser for PHP is Expat,¹ a C library that''s durable, tried,
    and true, and is enabled by default in most PHP installations. You don''t need
    to install any additional libraries—everything is built into PHP already. How
    do you use it? Let''s step through a very quick tutorial.


    The first step is to create a simple XML file for processing. Here''s the file
    we''ll use in this section:


    ```

    <?xml version="1.0" encoding="iso-8859-1"?>

    <keywords>

    <keyword>XML</keyword>

    <keyword>PHP</keyword>

    <keyword>Perl</keyword>

    <keyword>JavaScript</keyword>

    <keyword>ASP</keyword>

    </keywords>

    ```


    File: keyword-data.xml


    Great—now, we''re ready to code some PHP! Before we begin, though, it''s a good
    idea to have an idea of the end result we want to achieve. In this case, we want
    to transform this list of keyword elements into an HTML bullet list, as illustrated
    in Figure 7.1.


    # Figure 7.1. A SAX-processed list of keywords.


    ![](img/193b3c728296f42a8b0b0affe63e1530_186_0.png)


    +   * XML

    * PHP

    * Perl

    * JavaScript

    * ASP


    > ¹ http://expat.sourceforge.net/'
