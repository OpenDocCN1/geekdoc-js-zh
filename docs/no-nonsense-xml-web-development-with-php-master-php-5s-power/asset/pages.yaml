  md: '# Why Start with the Display Side?


    building the display pages for our project—the homepage, other internal pages,
    news sidebars, search widgets, and more.


    Before we do that, though, let''s recap the list of requirements we gathered

    the display pages:


    +   - The display side of our Website will only display articles and other content

    that has a status of “live.”


    +   - The search engine will retrieve articles by keywords, headlines, and descrip-

    tions, and only display those pieces that have a status of “live.”


    +   - The Website will display a list of authors by which site visitors can browse,

    but it only displays those authors who have live articles posted on the site.


    # Why Start with the Display Side?


    You may be asking yourself, “Why is Tom starting with the display side? We

    haven’t even built the admin tool for all the content it will display.”


    That’s a good question. I decided to start with the display side because:


    +   - It is much simpler than the admin tool, and gives us a chance to build some

    straightforward XML tools with PHP without having to get bogged down in

    detail.


    +   - It means that we have to work from our requirements. Remember, we took

    time to specify what each file would look like; now, all we have to do is

    work from these specs. As long as we continue to work from our specifications,

    everything will work together once it’s done.


    So, let’s get with our display pages. We’ll begin with an include file that

    we can use on all of our pages.


    # Creating a Common Include File


    Because our Website will entail some complex interaction between PHP and

    XML, it’s a good idea to store your most needed functions and variables in a

    separate file, then include that file in all your other pages.


    We’re going to create this include file and start to add some information to it:'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Chapter 4: Displaying XML in a Browser


    ```

    <?php

    session_start();


    $fileDir = $_SERVER[''DOCUMENT_ROOT''] . ''/xml/'';

    ?>

    ```


    This file will eventually contain many necessary variables that we''ll use later
    in the project.


    Before we go on to create a rudimentary homepage, let''s create an include file
    that contains a search widget.


    # Creating a Search Widget Include File


    All of our public display pages will offer a search widget, so it''s a good idea
    to create a file that contains the needed form elements:


    ```

    <form id="searchWidget" method="post" action="doSearch.php">

    Search:

    <input name="term" type="text" id="term" />

    <input name="search" type="submit" id="search" value="Search" />

    </form>

    ```


    As with our common include file, we''ll be using the PHP include command to include
    this form on all of our pages. In this case, we do so because it lowers maintenance
    costs: we only have to edit the form once to affect the whole site.


    Note that the action is set to a file called doSearch.php. We will work on that
    file soon—it''s the file that will process XML and return search results to visitors.


