  md: '# Chapter 9: XML and Web Services


    Before we get started, I have to warn you that the PHP XML-RPC functions aren’t
    necessarily a joy to use, but they provide a solid base from which to create your
    own XML-RPC-based Web Services.


    # Building an XML-RPC Server


    PHP comes with an optional extension for writing and consuming XML-RPC services.
    This extension isn’t enabled by default; you’ll need to compile it using --with-xmlrpc
    on Unix-style installations, or add the php_xmlrpc.dll file to your php.ini file
    on Windows.


    PHP’s XML-RPC extension has several functions that deal with servers, the most
    important being:


    +   - xmlrpc_server_create Tells PHP to create a new server.


    +   - xmlrpc_server_register_method Registers a PHP function with the XML-RPC
    client, making it available to requesting clients as a method.


    +   - xmlrpc_server_call_method Passes a client request to the server and sends
    the server’s response back to the client.


    +   - xmlrpc_server_destroy Frees up memory used by an XML-RPC server.


    Let’s get started!


    # Your First XML-RPC Method


    The first thing we need is to define and register the functions we want to expose
    as XML-RPC methods. This will allow XML-RPC clients to make requests and get back
    meaningful responses.


    For our XML-RPC server, we want to provide functionality around the articles on
    our Website. The first method we want to create provides a raw count of live articles
    available on the site. Let’s start by building the PHP function that will support
    this method.


    Every function that will be registered as an XML-RPC method must take three arguments,
    in this order:


    > If reconfiguring PHP isn’t an option for you, an alternative is to use the XML-RPC
    package in PEAR [http://pear.php.net/package/XML_RPC].'
