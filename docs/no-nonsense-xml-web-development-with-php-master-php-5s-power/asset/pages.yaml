  md: '# Appendix B: CMS Administration Tool


    In this appendix, we''re going to finish the CMS administration tool. We''re going
    to pick up where we left off in Chapter 7, to build administrative forms and components
    for our remaining content types. When we''re finished, the administration tool
    will be able to handle Web copy and news items, not just articles; it will also
    allow you to manage administrators, authors, and categories.


    # Picking Up Where We Left Off


    In Chapter 7, which was the last point at which we spent significant time on the
    CMS administration tool, we built a login and verification page, an administrative
    index page, and the forms and logic required to add, edit, and delete articles.


    In this appendix, we''re going to repeat this process for Web copy, news items,
    authors, site administrators, and categories. The first two items, Web copy and
    news items, will be very similar in functionality and structure to articles; the
    last three will be a good opportunity to examine some alternative ways of handling
    XML information.


    Every time we add another set of pages to the administration tool, we want to
    provide access to those pages on the administrative index page. When we''re done,
    our administrative index content will look like Figure B.1.


    Let''s get started.


    # Managing Web Copy


    Web copy is very similar to articles in terms of its structure, although it does
    different XML elements. It''s also similar to articles in terms of its function;
    however, Web copy items are used in the kinds of Web pages that are more typically
    likened to "About Us," "Contact Us," and other such pages.


    Users often want to know who authored an article; with Web copy, this is usually
    not the case. Web copy typically has to include a headline and navigation label
    that''s appropriate to the site''s navigation; not so with articles—usually, they''re'
