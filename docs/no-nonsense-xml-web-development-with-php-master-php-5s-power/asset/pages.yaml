    # # Parsing our Feed with SimpleXML


    We are going to parse this feed with SimpleXML. The first thing we need to do
    is load that file into our parser and then do our work. For this example, we''ll
    use a local file for the RSS feed:


    File: parsers.php (excerpt)


    ```

    <?php

    $rssfeed = simplexml_load_file(''headlines.xml'');

    ```


    Of course, in the real world, we would more likely be loading the RSS feed from
    another site. Frankly, you can pass SimpleXML a URL just as easily:


    ```

    $rssfeed = simplexml_load_file(

    ''http://www.tripledogardaremedia.com/sample.rss'');

    ```


    Once we have loaded it into SimpleXML, all we have to do is looping through each
    channel in the file with a simple foreach loop. Along the way, we''ll print out
    the channel''s title, description, and link:


    File: parsers.php (excerpt)


    ```

    foreach ($rssfeed->channel as $channel) {

    echo ''<h1>'' . htmlspecialchars($channel->title) . ''</h1>'';

    echo ''<p>'' . htmlspecialchars($channel->description) . ''</p>'';

    echo ''<p><a href="'' . htmlspecialchars($channel->link) . ''">'' . htmlspecialchars($channel->description)
    . ''</a></p>'';

    ```


    Now we''ve printed out that, we can start an inner loop and print out each item.
    For this exercise, I''ve decided to use a bullet list, but you could just easily
    format it as a data table:


    File: parsers.php (excerpt)


    ```

    <ul>

    foreach ($channel->item as $item) {

    echo ''<li><a href="'' . htmlspecialchars($item->link) . ''">'' . htmlspecialchars($item->title)
    . ''</a><br>'' . htmlspecialchars($item->description) . ''</li>'';

    }

    </ul>

    ?>

    ```'
