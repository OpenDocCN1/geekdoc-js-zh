  md: "# XPath Queries\n\n# # XPath Queries\n\nThere is another way to filter XML\
    \ elements based on an attribute's value; it involves using the xpath method we\
    \ saw in Chapter 4. You'll recall that this method allows us to pass XPath queries\
    \ into SimpleXML and receive the results in the form of an array.\n\nThe easiest\
    \ way to grab all the keyword elements that have their status attribute set to\
    \ live is to run the following XPath query from the keyword element in our document:\n\
    \n```\nkeyword[@status=\"live\"]\n```\n\nThis query will look at all keyword elements\
    \ that are children of the current element, and extract those that have a status\
    \ of live. Here's how to do it with SimpleXML:\n\nFile: smxlde04.php (excerpt)\n\
    \n```\nforeach ($keywords->xpath('keyword[@status=\"live\"]') as $kw) {\n  echo\
    \ '<li>' . htmlentities($kw) . '</li>';\n}\n```\n\nWhat does our XPath query buy\
    \ us? For one thing, we no longer have to perform a string comparison inside PHP;\
    \ XPath takes care of that for us. If you are familiar with SQL statement to do\
    \ the work of filtering database values before returning them to your script.\
    \ Furthermore, our code is now a bit simpler to look at, and hopefully, easier\
    \ to maintain.\n\nGranted, you may look at the second construction and say to\
    \ yourself, “That's so much more complicated than casting an object to a string\
    \ for comparison purposes.”\n\nWell, say tomayto, say tomahto. And in Texas, say\
    \ say tuhmater.\n\n# # Using SimpleXML to Update XML\n\nIf you are already beginning\
    \ to like SimpleXML, I have some good news! SimpleXML allows you to update values\
    \ in a straightforward fashion. Let's say we wanted to change the third keyword\
    \ in our example from PHP to JSP. Here's how we do it:\n\n179"
