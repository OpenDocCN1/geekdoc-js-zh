  md: '# Creating Your First Basic RSS Feed


    Let''s create an RSS file (or feed) from scratch. No matter how big, small, simple,
    or complicated the feed may be, at the heart of every RSS file lies a list of
    content items. Your RSS file can contain one item, 1,000 items, or anything in
    between (or beyond), but without at least one item, you really don''t have an
    RSS file.


    What does such an item comprise? Three very important parts:


    +   - A title

    - A link

    - A description


    Let''s say that you maintain a Website that covers the world of Web development.
    In particular, your articles explore a particular niche: ecommerce Web development.
    Furthermore, let imagine that you''ve just published a new article about the use
    of PHP to integrate PayPal into a Website. Now you want to point to this article
    and let your subscribers know it''s available to them.


    It''s likely that you gave your article HTML <title> and <meta name="description">
    tags. You don''t have to use this title and description when you create your RSS
    item, it certainly doesn''t hurt. However, you do have to accurately point to
    the proper URL to allow subscribers to link to the information.


    Here''s how your information might look before we start to wrap XML tags around
    each piece:


    ```

    Making PHP work with PayPal

    http://www.tripleddogaremedia.com/articles/paypal-php.html

    Everything you need to know to create PHP scripts that are PayPal friendly.

    ```


    To denote a title, we''ll use <title> tags:


    ```

    <title>Making PHP work with PayPal</title>

    ```


    For the URL, use <link> tags:


    ```

    <link>http://www.tripleddogaremedia.com/articles/paypal-php.html</link>

    ```'
