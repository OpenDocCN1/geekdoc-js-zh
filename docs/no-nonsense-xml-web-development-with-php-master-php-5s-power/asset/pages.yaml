  md: "# XML-RPC Responses\n\nThere are two kinds of XML-RPC responses: the successful\
    \ and the unsuccessful. The unsuccessful responses are called faults. Faults vary\
    \ from one implementation to another, but usually a fault returns a a struct that\
    \ tells you where and why your code went wrong. For example, there might be a\
    \ problem on line 20 of your request, because no method exists to handle the request\
    \ you sent in (a common error if you happen to spell badly).\n\nHere's how a fault\
    \ might appear:\n\n```\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n<methodResponse>\n\
    \  <fault>\n    <value>\n      <struct>\n        <member>\n          <name>faultCode</name>\n\
    \          <value>\n            <int>20</int>\n          </value>\n        </member>\n\
    \        <member>\n          <name>faultString</name>\n          <value>\n   \
    \         <string>No method exists by that name.</string>\n          </value>\n\
    \        </member>\n      </struct>\n    </value>\n  </fault>\n</methodResponse>\n\
    ```\n\nSuccessful XML-RPC responses also contain a methodResponse root element,\
    \ but this time it contains a params element. In the current version of XML-RPC,\
    \ a response can contain only one param child element of params, but that param\
    \ can contain an array or struct to pass back multiple values if needed.\n\nHere's\
    \ an example response to our example request from the previous section. Notice\
    \ that we use a struct to return multiple pieces of information from the original\
    \ request:\n\n```\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n<methodResponse>\n\
    ```"
