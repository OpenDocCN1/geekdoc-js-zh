    # Managing News Items


    News items are designed to contain those short snippets of information that are
    posted on our site''s left-hand side navigation area. Here''s a refresher of what
    a news item might look like:


    ```

    <?xml version="1.0" encoding="iso-8859-1"?>

    <news id="news2004104061004">

    <author>1</author>

    <categoryid>1</categoryid>

    <headline>XML CMS Almost Ready!</headline>

    <url>http://www.myxmlbook.com/</url>

    <description>The XML CMS is finally almost ready for shipping.</description>

    <pubdate>2004-10-14</pubdate>

    <status>live</status>

    <keywords>xml</keywords>

    </news>

    ```


    You''ll notice that the news content item has many of the same elements as our
    articles, including authorid, categoryid, headline, description, pubdate, status,
    and keywords. It doesn''t have a body element, but it contains a unique element,
    url.


    For the administration system, we''re going to follow the pattern we used for
    Web copy and articles, so I''ll present the code for each of the forms and scripts
    with little or no commentary.'
