  md: "# Chapter 9: XML and Web Services\n\nBut I'm afraid that that's where the similarities\
    \ end. SOAP is a much more robust environment for handling heavy-duty requests.\
    \ It is also much more complicated to use, though it is more extensible than XML-RPC,\
    \ SOAP allows for user-defined data types, the ability to specify the message\
    \ recipient, and some other features.\n\nSince XML-RPC does everything we need\
    \ in this book and more, we'll only pause for a high-level overview of SOAP. To\
    \ get a feel for it, let's revisit our simple weather service, this time using\
    \ SOAP:\n\n```\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n<env:Envelope\n\
    \ <xmlns:env=\"http://www.w3.org/2001/09/soap-envelope/\">\n <env:Body>\n <w:getTempByZip>\n\
    \ <xmlns:w=\"http://www.example.com/weather\">\n <w:zip>78701</w:zip>\n </w:getTempByZip>\n\
    \ </env:Body>\n</env:Envelope>\n```\n\nA couple of things need to be addressed\
    \ right away:\n\n+   - SOAP is structurally and syntactically more complex than\
    \ XML-RPC. It uses XML namespaces and can even use XML schemas (a complex successor\
    \ to DTDs).\n\n+   - A SOAP request consists of at least two structural elements:\
    \ an Envelope and a Body. The Envelope contains the Body, and the Body contains\
    \ your request.\n\n+   - Apart from XML-RPC, a SOAP request identifies a method\
    \ and provides a list of parameters that get passed to the Web Service.\n\nAs\
    \ with XML-RPC, a SOAP request begins a response. Let's take a look at what a\
    \ really simple response to our request looks like:\n\n```\n<?xml version=\"1.0\"\
    \ encoding=\"ISO-8859-1\"?>\n<env:Envelope\n <xmlns:env=\"http://www.w3.org/2001/09/soap-envelope/\"\
    >\n <env:Body>\n <w:getTemperatureResponse\n <xmlns:w=\"http://www.example.com/weather\"\
    >\n <w:temp>98</w:temp>\n </w:getTemperatureResponse>\n </env:Body>\n</env:Envelope>\n\
    ```"
