  md: '# Transforming XML into HTML


    Now, it''s time to make things a little more complex. Let''s transform the XML
    document into HTML. Here''s the great part—you won''t have to touch the original
    XML document (aside from pointing it at a new style sheet, that is). All you''ll
    need to create a new XML file:


    ```

    <xsl:stylesheet version="1.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    <xsl:output method="html"/>

    <xsl:template match="letter">

    <html>

    <head><title>Letter</title></head>

    <body><xsl:apply-templates/></body>

    </html>

    </xsl:template>

    <xsl:template match="to">

    <b>TO: </br><xsl:apply-templates/><br>

    </xsl:template>

    <xsl:template match="from">

    <b>FROM: </br><xsl:apply-templates/><br>

    </xsl:template>

    <xsl:template match="message">

    <b>MESSAGE: </br><xsl:apply-templates/><br>

    </xsl:template>

    </xsl:stylesheet>

    ```


    File: letter2html.xsl


    Right away, you''ll notice that the style''s output element now specifies an output
    method of html. Additionally, our first template now outputs the basic tags to
    produce the framework of an HTML document, and doesn''t bother pressing the whitespace
    in the source document with a select attribute.


    Other than that, these instructions don''t differ from our text-only style sheet.
    In fact, the only changes we''ve made have been to tag the label for each line
    to be bold, and end each line with an HTML line break (<br/>). We no longer need
    the <text> tags, since our HTML <b> and <br/> perform the same function.


    All we have to do now is edit our XML file to make sure that the <xml-stylesheet>
    instruction references our new style sheet (letter-html.xml in the code archive),
    and we''re ready to display the results in a Web browser.


    > Note the space following each label, is inside the <b> tag so that it won''t
    be ignored by the processor.'
