  md: '# 5


    # XSLT in Detail


    In Chapter 2 and Chapter 4, you got some exposure to XSLT, and learned some basic
    tips for displaying XML in a Web browser. Now it''s time to uncover some of XSLT''s
    more advanced syntax. The goal of this chapter is to help you get a better understanding
    of the power of XSLT. Once we''ve taken care of that, we''ll return to our CMS
    project and start applying XSLT rules to the display pages we built in the last
    chapter. First, though, let''s take another look at XPath.


    # XPath


    You''ve already been exposed to XPath in our work with XSLT so far, but in keeping
    with the theme of this chapter, let''s stop and take a closer look at it now.


    Without XPath, you really can''t control XSLT (or other XML technologies) with
    any kind of granularity. To draw an analogy, trying to use XSLT without a knowledge
    of XPath is like trying to understand databases without knowing Structured Query
    Language (SQL). Just like SQL, XPath is a query language, but its syntax is more
    closely related to file paths.


    For example, if you were working on a UNIX machine and I told you to open the
    following file, you''d know to look in your current working directory:


    ```

    File.xml

    ```'
