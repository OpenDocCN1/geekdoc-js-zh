- img_proc: true
  md: "# Numbering\n\nIf you need to add numbered lists to your XSLT output, use the\
    \ <xsl:number> tag. In this example, we'll use it to print a number next to each\
    \ product in the list.\n\nLet's see the example first. Then, we'll step through\
    \ it to see how it's done.\n\nFile: number.xsl (excerpt)\n\n```\n<xsl:template\
    \ match=\"catalog\">\n  <h1>Product Listing</h1>\n  <p><em>Total products: <xsl:value-of\
    \ select=\"count(product)\"/>/</em></p>\n  <xsl:apply-templates select=\"product\"\
    />\n</xsl:template>\n\n<xsl:template match=\"product\">\n  <p><xsl:number format=\"\
    1. \" /><xsl:apply-templates>\n  (<xsl:value-of select=\"sku\"/>)</p>\n</xsl:template>\n\
    ```\n\nNotice that this style sheet is almost the same as our last one, except\
    \ that, here, we aren't sorting the results. Furthermore, in the second template,\
    \ we've added a number element-This tells XSLT to output a number, based on the\
    \ format attribute, counting up for each element in a series of nodes matched\
    \ by this plate.\n\nThe format attribute lets you creating numbering schemes using\
    \ integers, integers with leading zeros, upper- and lowercase letters, and upper-\
    \ and lowercase Roman numerals. Simply supply a value that indicates how you'd\
    \ like the first number in the series to look, and XSLT will take it from there.\
    \ In this example, the value 1. indicates that we want an integer followed by\
    \ a period (.) and then a space. In this context, 1 is a special character that\
    \ tells XSLT we want to write out integers. Table 5.1 provides a summary of these\
    \ special characters.\n\n# Table 5.1. format Attribute Number Codes\n\n| Code\
    \ | Results | Code | Results |\n|---|---|---|--|\n| 1 | 1 2 3 4 ... | A | A C\
    \ D E F ... |\n| 01 | 01 02 03 04 ... | i | i ii iii v ... |\n| a | a b c d e\
    \ f ... | I | II III IV V ... ||"
  merge: -1
  pgno: 138
