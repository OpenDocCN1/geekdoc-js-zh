  md: '# Before We Get Started


    # Before We Get Started


    I''m going to show you straightforward ways to get up and running with RSS. I
    am aware, though, some parts of RSS/RDF (especially RDF syntax) can be obscure
    and confusing. You might not know which elements of the RDF syntax are required,
    for example, because the RDF specification can be pretty hard to plow through.
    The goal of this chapter is merely to provide you with a clear idea of how the
    world of RSS works.


    To begin, let''s take a look at RSS in action. Figure 8.1 shows a program called
    SharpReader reading an RSS feed from sitepoint.com. To read an RSS feed, all you
    have to do is SharpReader with the URL of that feed.


    Once you know where a feed is located, you can click the Subscribe button on SharpReader
    to keep receiving updates. If sitepoint.com updates its RSS feed, then subscribers,
    too, receive updates. In fact, if you have SharpReader running, little windows
    will pop up, displaying headlines from your subscribed feeds, on the side of your
    screen.


    # Figure 8.1. Using SharpReader to view the SitePoint RSS feed.


    ![](img/193b3c728296f42a8b0b0affe63e1530_222_0.png)'
