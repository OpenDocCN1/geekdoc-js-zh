  md: '# Matching Attribute Values with XPath


    Luckily, XPath lets us specify matches based on attribute values, too. In XPath,
    we use a predicate (a condition in square brackets) to match an attribute value.
    To isolate intro paragraphs, for example, we would use the XPath expression para[@type=''intro''].


    We should definitely take advantage of this ability and distinguish each of our
    paragraph types visually. It''s italicize all introductory paragraphs, and put
    gray boxes around notes and warnings. We can also make sure that warnings are
    displayed in red text.


    Now, we''ve already seen a template that can take care of normal paragraphs, which
    have no type attribute:


    File: chapter2html.xsl (excerpt)


    ```

    ```<xsl:template match="para">

    <p><xsl:apply-templates/></p>

    </xsl:template>

    ```

    ```


    Our template for introductory paragraphs is quite similar:


    File: chapter2html.xsl (excerpt)


    ```

    ```<xsl:template match="para[@type=''intro'']" priority="1">

    <p><i><xsl:apply-templates//></i></p>

    </xsl:template>

    ```

    ```


    Note the priority attribute on this template. Since an introductory paragraph
    would match both XPath expressions, para and para[@type=''intro''], we need to
    give some indication as to which of the two templates should be used. By default,
    XSL templates have a priority between -0.5 and 0.5, depending on the XPath expression
    in the match attribute. To make sure our introductory paragraphs use this second
    template, we therefore assign a priority of 1. Normal paragraphs will continue
    to use the first template, since they don''t match the higher-priority second
    template.


    With what we''ve just learned in mind, here are the templates for warnings and
    notes. Notice that we''ve added a style attribute to the opening <p> tag in each
    template to provide the desired style information for these paragraph types.


    > ²In a practical application, you should instead put these style properties in
    a CSS file and <link it to the HTML document. These templates would then use class
    attributes on the <p> tags to invoke the appropriate formatting.


    89'
