  md: '# A Closer Look at the XML Example


    Elements, Tags, or Nodes?


    I''ll refer to XML elements, XML tags, and XML nodes at different points in this
    book. What''s the deal? Well, for the layman, these terms are interchangeable,
    but if you want to get technical (and who''d want to do that in a technical book?)
    each has a very precise meaning:


    +   - An element consists of an opening tag, its attributes, any content, and
    a closing tag.


    +   - A tag—either opening or closing—is used to mark the start or end of an element.


    +   - A node is part of the hierarchical structure that makes an XML document.
    "Node" is a generic term that applies to any type of XML document object, including
    elements, attributes, comments, processing instructions, and plain text.


    If you''re used to working with HTML, you''ve probably created many documents
    that are missing end tags, use different capitalization in opening and closing
    tags, and contain improperly nested tags.


    You won''t be able to get away with any of that in XML! In this language, `<element>`
    is different from the `<ELEMENT>` tag, and both are different from the `<MyElement>`
    tag. If your opening tag is `<element>` and your closing tag is `</MyElement>`,
    your document won''t be valid.


    +   - If you use attributes on any elements, then attribute values must be single-
    or double-quoted. No longer can you get by with bare attribute values like you
    did in HTML! Let''s see an example. The following is okay in HTML:


    ```

    h1 class=topHeader

    ```


    In XML, you''d have to put quotes (either single or double) around the attribute
    value, like this:


    ```

    h1 class="topHeader">

    ```


    Also, if you nest your elements properly (i.e. close an element before closing
    another element that is inside it), your document won''t be valid. (I know keep
    mentioning validity—we''ll talk about it in detail soon!) For example, Web browsers
    don''t generally complain about this:


    ```

    <b>Some text that is bold, some that is <i>italicized</b>

    ```'
  merge: -1
