  md: "# Using XPath to Discern Element Context\n\nThe title element near the top\
    \ of the document is the chapter title, and should be handled differently from\
    \ the title elements in the different nested sections. Likewise, para elements\
    \ that denote warnings or introductions should be handled differently from other\
    \ paragraphs.\n\nLet's handle the title elements first. Chapter titles should\
    \ be formatted with <h1> tags. Other title elements, which serve as nested section\
    \ titles, should use incrementally smaller headings (<h2>, <h3>, and so on) in\
    \ accordance with the level of nesting.\n\nTo distinguish between these different\
    \ title types, you can use XPath notation. To pick out title elements that are\
    \ children of the chapter tag, we can use the XPath expression chapter/title.\
    \ To pick out title elements in top-level sections, we can use chapter/section/title,\
    \ and so forth.\n\nHere's an effective set of templates to handle the titles in\
    \ our document:\n\n```\n<xsl:template match=\"chapter/title\">\n  <h1><xsl:apply-templates/></h1>\n\
    </xsl:template>\n\n<xsl:template match=\"chapter/section/title\">\n  <h2><xsl:apply-templates/></h2>\n\
    </xsl:template>\n\n<xsl:template match=\"chapter/section/section/title\">\n  <h3><xsl:apply-templates/></h3>\n\
    </xsl:template>\n\n<xsl:template match=\"chapter/section/section/section/title\"\
    >\n  <h4><xsl:apply-templates/></h4>\n</xsl:template>\n```\n\nFigure 4.2 shows\
    \ how this code displays in the browser."
