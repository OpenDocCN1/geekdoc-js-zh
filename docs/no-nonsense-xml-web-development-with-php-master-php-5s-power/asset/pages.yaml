    | 10,000-Foot View of XML Schema |

    | The XML Schema standard fulfills the same requirements as DTDs: it allows you
    to control the structure and content of an XML document. But, if it serves the
    same purpose as DTDs, would we use XML Schema? |

    | Well, DTDs have a few disadvantages: |

    | DTD notation has little to do with XML syntax, and therefore cannot be parsed
    or validated the way an XML document can. |

    | All declarations are global, so you can''t define two different elements with
    the same name, even if they appear in different contexts. |

    | DTDs cannot strictly control the type of information given an element or attribute
    can. |


    XML Schema is written in XML, so it can be parsed by an XML parser. XML Schema
    allows you, through the use of XML namespaces, to define different elements with
    the same name. Finally, XML Schema provides very fine control over the kinds of
    data contained in an element or attribute.


    Now, for major drawbacks: if you thought that DTDs were esoteric, then you won''t
    be pleased by the complexity introduced by XML Schema. Most of the criticism aimed
    at XML Schema is focused on its complexity and length. In fact, at first glance,
    a schema''s versatility will remind you of your motor-mouth friend who hogs the
    airspace at any gathering.


    We won''t get much of a chance to work with XML Schema in this book, but there
    are many fine books available on the subject.


