    # DOMProcessingInstruction


    Represents a processing instruction (i.e., `<?target data>`) in an XML document.
    Extends DOMNode, inheriting all of that class’s properties and methods.


    To create a new DOMProcessingInstruction object directly, use the class’s constructor:


    ```

    $pi = new DOMProcessingInstruction(string target[, string data]);

    ```


    where target is the processing instruction’s target and data is the data contained
    in the processing instruction.


    > Don’t Use the Constructor!


    If you directly create a new DOMProcessingInstruction object, it will be read-only
    until you add it to the document (e.g. with appendChild). To create a writable
    DOMProcessingInstruction, use the DOMDocument object’s createProcessingInstruction
    method instead.'
