    # ## SAX Functions


    The PHP SAX implementation supports James Clark''s expat parser. The SAX toolkit
    lets you parse XML documents only—it doesn''t support XML document validation.
    It supports the US-ASCII, ISO-8859-1 and UTF-8 character encodings.


    # ## Error Code Constants


    The SAX implementation uses the following integer constants as error codes:


    +   - XML_ERROR_NONE

    - XML_ERROR_NO_MEMORY

    - XML_ERROR_SYNTAX

