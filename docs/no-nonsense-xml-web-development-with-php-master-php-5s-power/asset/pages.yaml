  md: '# Appendix A: PHP XML Functions


    # Function Listing


    In addition to the objects listed above, the DOM API includes the following standalone
    function:


    DOMXlement dom_import_simplexml(SimpleMLElement node)


    Converts a SimpleXML element object into a DOMElement, which may be imported into
    a DOMDocument (using its importNode method) and used with the DOM API.


    # SimpleXML Functions


    SimpleXML is new to PHP 5. As its name implies, it provides a simplified way to
    access the content of XML documents.


    # Function Listing


    The following SimpleXML functions are used to load an XML document or fragment.


    ```

    SimpleMLElement simplexml_import_dom(DOMNode node[, string class_name])

    ```


    This function takes a node object from the DOM API and converts it into a SimpleXML
    representation of the document or fragment. If an error occurs, FALSE is returned
    instead.


    ```

    SimpleMLElement simplexml_load_file(string filename)

    ```


    This function will convert the XML code in filename into a SimpleXML representation
    of the document or fragment. If an error occurs, FALSE is returned instead.


    ```

    SimpleMLElement simplexml_load_string(string data)

    ```


    This function will convert a string of XML code (data) into a SimpleXML representation
    of the document or fragment. If an error occurs, FALSE is returned instead.'
