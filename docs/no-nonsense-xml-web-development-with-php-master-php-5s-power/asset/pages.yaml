    In later chapters, I’ll go into plenty of detail on both CSS and XSLT, but I wanted
    to make a brief point here. Because we’ve taken the time to create XML documents,
    our information is no longer locked inside proprietary formats such as word processors
    or spreadsheets. Furthermore, it no longer has to be “re-cre-'
