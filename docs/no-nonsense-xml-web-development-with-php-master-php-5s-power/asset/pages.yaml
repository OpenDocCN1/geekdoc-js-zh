- img_proc: true
  md: '# Chapter 3: DTDs for Consistency


    Acceptable values for this attribute might be “superstar”, “leading man”, or even
    “dinosaur”. As developers, we can''t exert much control over what is placed in
    an attribute of type CDATA.


    Do you see #IMPLIED right after CDATA? In DTD-speak, this means that the attribute
    is optional. Don''t ask why they didn''t use #OPTIONAL—this legacy has been passed
    down from the days of SGML, XML''s more complex predecessor.


    Let''s take a look at the gender attribute''s definition. This attribute is #REQUIRED,
    so a value for it has to be supplied with every actor element. Instead of any
    arbitrary text, however, the DTD limits the values to male or female.


    If, in our document, an actor element fails to contain a gender attribute with
    values other than male or female, then our document would be deemed invalid.


    Let''s look at the most complex attribute value in our example, then we''ll stop
    talking about attribute and element declarations. The actor attribute has been
    designated an ID. In DTD-speak, an ID attribute must contain a unique value, which
    is handy for product codes, database keys, and other identifying factors.


    In our example, we want the actorid to uniquely identify each actor in the list.
    The ID type set for the actorid attribute ensures our XML document is valid if
    and only if a unique actorid is assigned to each actor.


    Some other rules that you need to follow for IDs include:


    +   - ID values must start with a letter or underscore.


    +   - There can only be one ID attribute assigned to an element.


    Incidentally, if you want to declare an attribute that must contain a reference
    to a unique ID that is assigned to an element somewhere in the document, you can
    declare it with the IDREF attribute type. We won''t have any use for this attribute
    type in this book, however.


    # Entity Declarations


    Back in Chapter 1, we talked a little bit about entities. An entity is a piece
    of XML code that can be used (and reused) in a document with an entity reference.
    For example, the entity reference &lt; is used to represent the < character, an
    XML built-in entity.'
