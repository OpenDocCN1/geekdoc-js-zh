  md: '# Chapter 1: Introduction to XML


    In XML, improper nesting of elements would cause the program reading the document
    to raise an error.


    As XML allows you to create any language you want, the inventors of XML had to
    institute a special rule, which happens to be closely related to the proper nesting
    rule. The rule states each XML document must contain a single root element in
    which all the document''s other elements are contained. As we''ll see later, almost
    every single piece of XML development you''ll do is facilitated by this simple
    rule.


    # Attributes


    Did you notice the <productListing> opening tag in our example? Inside the tag,
    following the element, was the data title="ABC Products". This is called an attribute.


    You can think of attributes as adjectives—they provide additional information
    about the element that may make any sense as content. If you''ve worked with HTML,
    you''re familiar with such attributes as the src (file source) on the <img> tag.


    What information should be contained in an attribute? What should appear between
    the tags of an element? This is a subject of much debate, but don''t worry, there
    really are no wrong answers here. Remember: you''re the one defining your own
    language. Some developers (including me!) apply this rule of thumb: use attributes
    to store data that doesn''t necessarily need to be displayed to a user of the
    information. Another common rule of thumb is to consider the length of the data.
    Potentially large data should be placed inside a tag; shorter data can be placed
    in an attribute. Typically, attributes are used to "embellish" the data contained
    within the tag.


    Let''s examine this issue a little more closely. Let''s say that you wanted to
    create an XML document to keep track of your DVD collection. Here''s a short snippet
    of the code you might use:


    ```

    <dvdCollection>

    <dvd>

    <id></id>

    <title>Raiders of the Lost Ark</title>

    <release-year>1981</release-year>

    <director>Steven Spielberg</director>

    <actors>

    <actor>Harrison Ford</actor>

    ```'
