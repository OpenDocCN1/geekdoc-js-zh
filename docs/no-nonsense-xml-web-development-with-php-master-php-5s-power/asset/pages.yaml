  md: '# SimpleXMLElement Methods


    When an XML document or fragment is loaded with SimpleXML, a SimpleXMLElement
    object is the result. This object supports the following methods:


    ```

    string $simplexml->asXML()

    ```


    Converts this document or fragment into a string of XML code.


    ```

    SimpleXMLElement $simplexml->attributes()

    ```


    Returns a SimpleXMLElement object that may be treated as an associative array
    of attribute names to attribute values for this element.


    ```

    SimpleXMLElement $simplexml->children()

    ```


    Returns a SimpleXMLElement object that may be treated as an array of the children
    of this element.


    ```

    array $simplexml->xpath(string path)

    ```


    Evaluates the XPath expression given in path relative to this SimpleXML node.
    Returns an array of SimpleXMLElement objects that match the query.'
