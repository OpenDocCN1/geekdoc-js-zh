  md: '# Preface


    Off and on, I run a workshop called XML for Mere Mortals. The title attracts an
    audience that''s much wider than your typical Web developer needing to bone up
    on the subject. I train technical writers, project managers, database geeks—even
    the occasional business owner who''s trying to get a handle on the exciting possibilities
    of XML.


    If I had to give this book a subtitle, it would be, "XML for Mere Mortals," because
    every time I sat down to write a chapter, I tried to picture the kind of folks
    who show up at my workshops—intelligent and curious, with a wide range of technical
    proficiency, but all of them feeling a little overwhelmed by the terminology,
    processes, and technologies. With any luck, this approach will serve you.


    This book has two goals: to introduce readers to a large part of the XML world,
    and to walk them, step by step, through the creation of an XML-powered Website.
    Let''s talk about each of those goals in more detail.


    If we were to take the time to introduce you to the entire spectrum of XML technologies,
    it would take a twice (or thrice) as big as the one you''re currently holding.
    There''s a lot to talk about when you start at XML, so I had to pick my battles.
    For instance, we''ll notice that we discuss DTDs, but we don''t cover XML Schemas.
    We talk a lot about XPath, but we don''t cover XQuery or XLink. The idea of this
    title is to get your feet (and perhaps your ankles, shins, and knees) wet in the
    topic of XML, and to make feel comfortable to go out and learn more.


    The second goal involves building your XML-powered Website. I build both XML and
    database-powered dynamic Websites for a living, and I tried to pour as much as
    I know about the process into the limited space available. As we work to build
    the project that''s developed through the course of this book, I''ll take you
    through the requirements gathering and analysis phases, then show you how to convert
    that into real XML documents and working code. Yes, we are building a content
    management system, but a simplified one without the heavy workflow or other capabilities
    you see in other systems. Nevertheless, what you''ll end up with is a simple,
    powerful system that can get a Website up and running quickly.


    Every time I teach a class or workshop, I feel that I can learn from my students
    as they learn from me—that, in fact, I learn more as I continue to teach.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Writing this book was very much like that, because it forced me to organize
    my thoughts and approaches into a more coherent fashion.


    I hope you find the book a useful introduction to the incredibly fascinating topic
    of XML. I know that many experts will not agree with the approaches I took here,
    and I''d like to say that I understand all your disagreements, but writing a book
    for the novice requires the concepts be presented from a slightly different perspective.
    If you wish to provide me with feedback, or you have any questions, feel free
    to drop me a line: tom@tripledogremedia.com.


    # Who Should Read this Book?


    This book is intended for the XML beginner. You should have some working knowledge
    of the Web, including HTML and some JavaScript skills, experience with a server-side
    programming language.


    In this book, we use PHP 5 on the server side, and I''ll assume that you have
    had some exposure to PHP. However, I always try to explain what''s going on, particularly
    as I work with XML concepts with which you may have little or no past experience.


    If you''ve ever fiddled with JavaScript, worked with a database, set up an ecommerce
    system, or programmed in PHP, ASP, or Perl, you''ll likely have no problem following
    what we do within these pages.


    # What''s in this Book?


    Here''s what we''ll cover:


    +   Chapter 1: Introduction to XML


    +   This chapter introduces XML. We talk about elements, tags, attributes, entities,
    and we get into semantics. We explore the difference between wellformedness and
    validity, then get our hands dirty with some examples. We also start gathering
    requirements for our project.


    +   Chapter 2: XML in Practice


    +   It''s time to meet the XML family, namely XHTML, XML Namespaces, and Extensible
    Stylesheet Language Transformations (XSLT). In addition to playing with these
    technologies, we gather the final requirements for our project.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Chapter 3: DTDs for Consistency


    This chapter is all about consistency. In particular, we look at Document Type
    Definitions (DTDs), a language that describes the requirements that are necessary
    for an XML document to be valid; that is, suitable for use in a particular system.
    We finish the chapter by refining some of the requirements we''ve gathered for
    our project.


    # Chapter 4: Displaying XML in a Browser


    In this chapter, we talk about XSLT and how to use it to transform XML for display
    in a browser. We explore some of the basics of XSLT and introduce XPath. At the
    end of the chapter, we build many of the public display templates we need for
    our project.


    # Chapter 5: XSLT in Detail


    This chapter picks up the last one left off. We delve much deeper into the programmatic
    aspects of XSLT, such as foreach loops, conditionals, sorting, counting, and using
    XPath. In our project, we use this knowledge to leverage XPath on the server side,
    and to create an XSLT-driven site map.


    # Chapter 6: Manipulating XML with JavaScript/DHTML


    Here, we learn how to manipulate XML with client-side tools. We learn about the
    Document Object Model (DOM) and the differences between the handling of XML in
    Internet Explorer compared to Firefox and other Mozilla-based browsers. On the
    project side of things, we add categories to our content structure, and use client-side
    XML processing to allow users to browse the site''s content by category.


    # Chapter 7: Manipulating XML with PHP


    In the previous chapter, our work was mostly on the client side. Now we tackle
    the server side, specifically addressing the question of PHP 5 as we explore the
    differences between SAX, DOM, and SimpleXML function libraries working with XML.
    We further our project work as we start to build our administrative tool files,
    including login/verification templates and article create/update/delete templates.


    # Chapter 8: RSS and RDF


    RSS is a hot topic right now. It provides a means for Website monitor sites they
    don''t have time to visit regularly, and for Web applications to make use of content
    that''s syndicated from third-party Websites and other information sources. In
    this chapter, we delve into the specifics of the different varieties of RSS that
    are available (including RDF, which forms the basis of RSS 1.0), and discuss news
    aggregators, the parsing of feeds with PHP, and'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Preface


    more. We finish the chapter with the addition of an RSS feed to our Web project.


    # Chapter 9: XML and Web Services


    It''s time to look at Web Services. The emphasis of this chapter is XML-RPC, an
    older standard for Web Services that''s easy to work with, but we do mention SOAP,
    a newer standard in this area. On the project side, we create an XML-RPC server
    (and clients) that search for articles on our site.


    # Chapter 10: XML and Databases


    This final chapter considers XML and databases. We talk about the need to use
    databases and XML together, explore the differences between relational and native
    XML databases, and investigate the task of storing XML information in a database.
    We hand-roll an SQL-to-XML converter, then do the same thing using a ready-made
    solution, phpMyAdmin. Lastly, we create a MySQL backup system for our XML project
    files.


    # Appendix A: PHP XML Functions


    This appendix contains a complete reference to the SAX, DOM, and SimpleXML functions
    that PHP 5 supports for working with XML.


    # Appendix B: CMS Administration Tool


    This appendix completes our work on the project''s administrative tools. We''ll
    build forms and scripts to handle news items, Web copy, authors, administrators,
    and categories.


    # The Book''s Website


    Located at http://www.sitepoint.com/books/xml1/, the Website supporting this book
    will give you access to the following facilities:


    # The Code Archive


    As you progress through the text, you''ll note that most of the code listings
    are labelled with filenames, and a number of references are made to the code archive.
    This is a downloadable ZIP archive that contains complete code for all the examples
    presented in this book.


    xii'
  merge: -1
