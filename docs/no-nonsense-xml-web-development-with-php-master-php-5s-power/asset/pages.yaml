  md: "# Chapter 8: RSS and RDF\n\nthat are PayPal friendly.</description>\n<item>\n\
    \nAgain, this looks a lot like the RSS 0.91 version, except for the RDF about\
    \ attribute, which provides a URI that uniquely identifies the item. This is the\
    \ URI that the items element points to the channel in order to include it in the\
    \ channel.\n\n# Adding Information with Dublin Core\n\nNow, when you saw the namespace\
    \ declarations that were required at the top of an RSS 1.0 file, I bet you thought,\
    \ \"Oh man, I have to type all that every time I create an RSS feed? Nuts to that.\"\
    \ Well, who can blame you? As it turns out however, giving the RSS 1.0 benefit\
    \ of XML namespaces allows us to extend the format with tags from other XML namespaces:\n\
    \nThe people behind RSS have provided three additional sets of XML tags, each\
    \ with its own namespace (these are called modules), as part of the RSS 1.0 specification.\
    \ The most popular of these are the Dublin Core¹¹set of metadata elements, which\
    \ lets you specify additional properties for channels and items in your RSS feeds.\n\
    \nTo use Dublin Core, you need to declare its namespace in your RSS feed, with\
    \ the others:\n\nFile: headlinedc.rdf (excerpt)\n\n```\n<rdf:RDF\n  xmlns:rdf=\"\
    http://www.w3.org/1999/02/22-rdf-syntax-ns#\"\n  xmlns:dc=\"http://purl.org/dc/elements/1.1/\"\
    \n  xmlns:rss=\"http://purl.org/rss/1.0/\">\n```\n\nYou can add Dublin Core elements\
    \ to your RSS feed. Here's a bit of Dublin Core flair:\n\nFile: headlinedc.rdf\
    \ (excerpt)\n\n```\n<item rdf:about=\n  \"http://www.tripledogdarearemedia.com/articles/paypal-php.html\"\
    \n  <title>Making PHP work with PayPal</title>\n  <link>\n    http://www.tripledogdarearemedia.com/articles/paypal-php.html\n\
