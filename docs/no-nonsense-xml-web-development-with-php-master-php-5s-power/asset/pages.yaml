  md: '# Going Beyond the Basics


    Notice in our example that we were using a particular version of RSS.


    File: headline.xml (excerpt)


    ```

    <rss version="0.91">

    ```


    This RSS is known as Really Simple Syndication, and was jointly developed by Netscape
    and Userland Corporation. ⁴ The idea behind this version of RSS is to provide
    a very simple tool for content syndication.


    As you already know from the example, with RSS version 0.91, you can have one
    or more channel elements, with each at least one item element. Each element must
    contain a title and a link and can also contain a description element. The same
    goes for the channels themselves.


    Other channel metadata tags that you can include:


    ```

    <image> to specify a thumbnail image for the channel

    ```


    ```

    <webMaster> to provide email addresses for those responsible for the feed

    <managingEditor>

    ```


    ```

    <lastBuildDate> to indicate when the feed was last updated

    ```


    For the details on these and other RSS 0.91 elements, you can refer to the RSS
    0.91 specification. ⁵More recent versions of the specification exist. Both RSS
    0.92⁶ (December 2000) and RSS 2.0⁷ (October 2002) add more tags, and lift restrictions
    on certain tags (e.g. in 0.91 the <link> tag had to point to an HTTP or FTP resource;
    any valid URI will do). But since 0.91 is forwards compatible with these standards
    (a valid RSS 0.91 document is also a valid RSS 2.0 document), RSS 0.91 continues
    to be the best starting place for beginners who don''t need the more advanced
    features of the later standards.


    > ⁴ http://www.userland.com/

    ⁵ http://backend.userland.com/rss091

    ⁶ http://backend.userland.com/rss092

    ⁷ http://blogs.law.harvard.edu/tech/rss'
