- img_proc: true
  md: 'understand anything anyone else says. Thus, the creators of XML had to set
    down some rules that would describe a “legal” XML document.


    There are two levels of “legality” in XML:


    +   - Well-formed


    +   - Validity


    A well-formed XML document follows these rules (most of which we’ve already discussed):


    +   - An XML document must contain a single root element that contains all other
    elements.


    +   - All elements must be properly nested.


    +   - All elements must be closed either with a closing tag or with a “self-closing”
    empty-element tag (i.e. <tag/>).


    +   - All attribute values must be quoted.


    A valid XML document is both well-formed and follows all the rules set down in
    that document’s DTD (document type definition). A valid document, then, is nothing
    more then a well-formed document that adheres to its DTD.


    The question then becomes, why have two levels of legality? A good question, indeed!


    For the most part, you will only care that your documents are well-formed. In
    fact, most XML parsers (software that reads your XML documents) are non-validating
    (i.e. they don’t care if your documents are valid)—and includes those found in
    Web browsers like Firefox and Internet Explorer. Well-formedness allows you to
    create hoc XML documents that can be generated, added to an application, and tested
    quickly.


    For other applications that are more mission-critical, you’ll want to use a DTD
    within your XML documents, then run these documents through a validating parser.


    The bottom line? Well-formedness is mandatory, but validity is an extra, optional
    step.'
  merge: -1
