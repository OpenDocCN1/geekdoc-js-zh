    # When to use RSS 1.0


    When you look at the different versions of RSS, you might ask yourself when you
    would use which version. That’s a good question.


    For most cases, as in most of the examples in this chapter, you would use the
    0.91 version of RSS, or possibly version 2.0 if you like its advanced features.
    These formats provide the simplest, quickest, and easiest solution for your feeds.
    These versions of RSS are not hard to understand, and building systems that process
    them is not hard to do.


    RSS 1.0 provides more robust syntax that allows you to incorporate specialized
    tags for additional information. For example, you can use Dublin Core’s set of
    tags to track information about authors, publication dates, last-edit dates, and
    so on. You can devise your own sets of tags and mix them in for your own devious
    purposes, all within the generalized resource description framework provided by
    RDF.


    ![](img/193b3c728296f42a8b0b0affe63e1530_232_0.png)


    # A Brief Note on Atom


    The AtomEnabled¹³ is a recently-devised initiative to develop standard APIs and
    data formats for publishing content on the Web. It includes its own XML-based
    syndication format¹⁴ that presents an alternative to RSS feeds. Sam Ruby of IBM
    is often credited with many of the core ideas behind Atom, which include common
    metadata terms to support the description of author name, publication date, resource
    identifier and location, and content.


    There isn''t enough space in this book to cover Atom, but you might wish to look
    into the format and possibly support it along with the RSS version(s)


    +   ¹² http://dublincore.org/

    ¹³ http://www.atomabled.org/

    ¹⁴ http://www.atomabled.org/developers/syndication/atom-format-spec.php'
