  md: "# Using DOM\n\nNow that you know something about SAX, it’s time to understand\
    \ how PHP’s DOM functionality works. The DOM is a robust, complex piece of engineering\
    \ designed to handle a raft of contingencies. In fact, being able to handle anything\
    \ you throw at it is the major strength of DOM. Its major weakness is that it’s\
    \ very complex and can be overwhelming—not to mention that it can really bog down\
    \ your resources if you load a large document into memory.\n\nWe’ve already discussed\
    \ the same DOM—mostly on the client side. On the server side, we’re talking about\
    \ the same DOM—luckily for us, it’s a standardized interface. The easiest way\
    \ to talk about DOM on the server is to compare it with what we already know about\
    \ SAX. From the previous section that you can use SAX to process XML documents\
    \ in a linear fashion.\n\nPHP’s DOM functionality takes a different approach.\
    \ It loads an XML document into memory and converts it into its hierarchical object\
    \ structure, providing two very important features that SAX does not. The first\
    \ is that the XML structure can be manipulated in memory, allowing nodes to be\
    \ added, removed, changed, and rearranged. The second is that DOM allows the document\
    \ to be inspected again and again, in random-access fashion, instead of just linearly.\n\
    \nLet’s reuse our simple XML file from the SAX section so we can make an apples-to-apples\
    \ comparison:\n\n```\n<?xml version=\"1.0\" encoding=\"iso-8859-1\"?>n<keywords>\n\
    \  <keyword>XML</keyword>\n  <keyword>PHP</keyword>\n  <keyword>Perl</keyword>\n\
    \  <keyword>JavaScript</keyword>\n  <keyword>ASP</keyword>\n</keywords>\n```\n\
    \nNow that we have a file, let’s create a DOM parser and load our XML.\n\n# Creating\
    \ a DOM Parser\n\nTo create our parser, we create a DOMDocument object. Before\
    \ we use it, we’ll turn its whitespace handling feature off to prevent spaces,\
    \ tabs, and line breaks between tabs being treated as text nodes:"
  merge: -1
  pgno: 190
- img_proc: true
  md: "# Chapter 7: Manipulating XML with PHP\n\n```\n$doc = new DOMDocument();\n\
    $doc->preserveWhitespace = false;\n```\n\nNext, we load our XML document and grab\
    \ a reference to our document element:\n\n```\n$doc->load(\"keyword-data.xml\"\
    );\n$root = $doc->documentElement;\n```\n\n# Retrieving Elements\n\nOnce we've\
    \ created the parser and loaded our XML file, we can retrieve information from\
    \ the document. One of the easiest ways to work with the DOM is to retrieve elements\
    \ using the getTagName method.\n\nThe getTagName method allows you to grab all\
    \ elements contained within another element that have a particular name. We can\
    \ use this method to grab the individual keyword elements in the sample document\
    \ and store them in an array:\n\n```\n$keywords = $root->getElementsByTagName('keyword');\n\
    ```\n\nSince we called the method on the root element of the document, the $keywords\
    \ array now contains every keyword element in the XML document. We can now iterate\
    \ through the $keywords array to make sure each element is valid. We can then\
    \ perform some processing on that element:\n\n```\necho '<ul>';\nforeach ($keywords\
    \ as $kw) {\n    echo '<li>' . htmlspecialchars($kw->nodeValue) . 'li';\n}\necho\
    \ '</ul>';\n```\n\nThe result would appear in the Web browser as shown in Figure\
    \ 7.2."
  merge: -1
  pgno: 191
