  md: "# Chapter 10: XML and Databases\n\nFor instance, in your Website's database,\
    \ you had a database named website containing a table named survey that you wanted\
    \ to dump out to an XML file, you'd run the following command from the command\
    \ line:\n\n```\nmysqldump -u user mypass --xml website survey > survey.xml\n```\n\
    \nRunning this command with MySQL version 4.1 produces an XML file that has the\
    \ following format:\n\n```\n<?xml version=\"1.0\"?>\n<mysqldump>\n<database name=\"\
    tableName\">\n  <table structure name=\"table\" Type=\"unsigned\">\n    <field\
    \ Field=\"field1\" Type=\"int(10)\" />\n    <key Table=\"fieldkeyword\" Non_unique=\"\
    0\" Key_name=\"PRIMARY\" />\n    <options Name=\"tableName\" Engine=\"MyISAM\"\
    \ Version=\"9\" ... />\n  </table>\n  <table data name=\"tableName\">\n  <row>\n\
    \    <field name=\"field1\">data</field>\n  </row>\n\n<!-- more row tags follow\
    \ -->\n\n  </table_data>\n</database>\n</mysqldump>\n```\n\nThe XML output is\
    \ contained within a <mysqldump> tag. In this case, it has one child tag, <database>,\
    \ whose name attribute indicates the database whose contents are being dumped.\
    \ The <database> contains two tags: <table_structure> and <table_data>. The <table_structure>\
    \ contains information about the structure of the table's being dumped, as the\
    \ fields it contains, its formats, the related key information, and the mysqldump\
    \ options used to create that dump. The <table_data> contains the name of the\
    \ table being dumped, and holds a series of <row> tags, which represent the actual\
    \ rows of data. Each <row> tag contains one or more <field> tags that hold the\
    \ data for fields.\n\nAs you can see, it wouldn't be hard to put together a simple\
    \ shell script that contained the username, password, database name, table name,\
    \ and output file name of a database, to run it periodically using cron. That\
    \ shell script would look something like this:"
