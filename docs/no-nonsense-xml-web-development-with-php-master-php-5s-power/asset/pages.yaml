  md: "So far, the only change from RSS 0.91's channel element is the addition of\
    \ an RDF about attribute to the tag. At a glance, you might think that it makes\
    \ no sense to put the URL of the site to which this channel refers in this attribute,\
    \ since it's already given by the link element inside the channel. This attribute\
    \ actually serves as a unique identifier for the channel, as required by RDE It\
    \ is a simple convention of RDF that a URI is used for this purpose, in the same\
    \ way that URIs are used to identify XML namespaces.\n\nBut if you got upset about\
    \ the about attribute, you aren't going to like the rest of the channel element\
    \ at...\n\nFile: headline.rdf (excerpt)\n\n```\n<items>\n  <rdf:Seq>\n    <rdf:li\
    \ resource=\"http://www.tripledogdaremedia.com/articles/paypal-php.html\"/>\n\
    \  </rdf:Seq>\n</items>\n</channel>\n```\n\nInstead of embedding a list of item\
    \ elements right inside the channel, RSS 1.0 follows the RDF requirement that\
    \ all the things the document describes (be they channels, items, or even images)\
    \ appear as children of the root element. Instead, the channel contains a single\
    \ item element, which contains an RDF table of contents (TOC).\n\nRDF supports\
    \ at least two types of TOC: bags and sequences. A bag is the RDF equivalent of\
    \ an HTML unordered list (<ul>), whereas a sequence is like an ordered list (<ol>).\
    \ The order of items in RSS feeds is important, RSS 1.0 uses an RDF sequence (<rdf:Seq>).\
    \ A sequence contains one or more list items (<rdf:li), each with an RDF resource\
    \ that points to the unique URI for an item in the feed.\n\nWith the channel taken\
    \ care of, we can now define our items:\n\nFile: headline.rdf (excerpt)\n\n```\n\
    <item rdf:about=\n\"http://www.tripledogdaremedia.com/articles/paypal-php.html\"\
    >\n<title>Making PHP work with PayPal</title>\n<link>\nhttp://www.tripledogdaremedia.com/articles/paypal-php.html\n\
    </link>\n<description>Everything you need to know to create PHP scripts</description>\n\
    ```"
