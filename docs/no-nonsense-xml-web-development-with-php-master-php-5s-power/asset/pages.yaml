  md: "```\n// Clear the current document body\nwhile (docBody.hasChildNodes()) {\n\
    \  docBody.removeChild(docBody.firstChild);\n}\n```\n\nThe methods and properties\
    \ used here, now, are part of the DOM standard and are relatively self-explanatory.\
    \ hasChildNodes returns true if the element has child nodes; removeChild removes\
    \ a node from the element; and the firstChild property is equivalent to childNodes.item(0).\n\
    \nWith the body of the displayed document now empty, we can fill it with nodes\
    \ from our transformation output document:\n\n```\n// Refill it with the 'out'\
    \ document body's children\nfor (var i = 0; i < outBody.childNodes.length; i++)\
    \ {\n  var node = outBody.childNodes.item(i);\n  node = document.importNode(node,\
    \ true);\n  docBody.appendChild(node);\n}\n```\n\nThis code is a little less self-explanatory,\
    \ but is equally straightforward. The for loop iterates through each of the child\
    \ nodes of the body of the transformation output document, using the length property\
    \ of the childNodes collection to get the number of nodes. We use the importNode\
    \ method of the currently-displayed document to create copies of each of these\
    \ nodes (including their contents, as indicated by the true second argument) for\
    \ use in document. Those nodes are then added to the currently-displayed document's\
    \ body element using the appendChild method.\n\nThe result of this process is\
    \ that the contents of the transformed document are added to and displayed as\
    \ part of the existing page, as shown in Figure 6.5. This solution is effective\
    \ so long as you didn't need to display the document title, or anything else inside\
    \ the head element of the transformation output."
