    - XML_ERROR_TAG_MISMATCH

    - XML_ERROR_DUPLICATE_ATTRIBUTE

    - XML_ERROR_JUNK_AFTER_DOC_ELEMENT

    - XML_ERROR_PARAM_ENTITY_REF

    - XML_ERROR_UNDEFINED_ENTITY

    - XML_ERROR_RECURSIVE_ENTITY_REF'
