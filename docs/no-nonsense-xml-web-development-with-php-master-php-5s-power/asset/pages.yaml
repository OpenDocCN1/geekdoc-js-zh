  md: "# RDF and RSS 1.0\n\nRSS 1.0 is something of a lone wolf. Although it was designed\
    \ to do the same thing as other versions of RSS, it has very little to do with\
    \ the other standards. In many ways, it is actually more advanced than RDF 2.0,\
    \ and it is therefore the preferred choice of many forward-looking Web developers.\n\
    \nFirst of all, the \"RSS\" in RSS 1.0 stands for RDF Site Summary. This particular\
    \ flavor of RSS, released just prior to RSS 0.92 in December 2000, RDF, the Resource\
    \ Description Framework, to define what the files look like. In a handwaved sort\
    \ of way, RDF is a standard for describing anything and what it has to do with\
    \ anything else. Vague enough for you?\n\nWithout actually getting into the details\
    \ of RDF, which is quite a powerful and complex collection of specifications,\
    \ let me assure that there is a lot more to it than an XML document format for\
    \ describing lists of things; in the context of RSS 1.0, that's exactly how it's\
    \ used. RSS 1.0 documents can take part in larger software systems designed around\
    \ RDF. One such system that is still in the planning stages is the Semantic Web,\
    \ a re-imagination of the World Wide Web that will allow computer programs to\
    \ seek out and pull disparate services and bits of information from across the\
    \ Web to accomplish tasks for you, without your having to track down all those\
    \ things you.\n\nBut hey, that is all coming tomorrow (or possibly the day after\
    \ tomorrow). Right now, the complexity of RDF makes syndicating content with RSS\
    \ 1.0 a little more difficult than with the other RSS standards. Let's see how\
    \ just difficult... Here's the RSS 1.0 version of the simple RSS 0.91 we saw earlier:\n\
    \n```\n<xml version=\"1.0\"?>\n<rdf xmlns=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\"\
    \\ xmlns=\"http://purl.org/rss/1.0/\">\n <channel>\n  rdf:about=\"http://www.tripledogdaremedia.com/articles/\"\
    >\n  <title>Ecommerce Development</title>\n  <link>http://www.tripledogdaremedia.com/articles/</link>\n\
    \  <description>If it's about ecommerce and Web development,\n```\n\n8 http://web.resource.org/rss/1.0/\n\
    9 http://www.w3.org/RDF/\n10 http://www.w3.org/2001/sw/"
