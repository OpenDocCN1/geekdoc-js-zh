  md: '# 6 Manipulating XML with JavaScript/DHTML


    In this chapter, we''re going to learn how to manipulate XML data within your
    visitors'' browsers with JavaScript and HTML. Along the way, you''ll be introduced
    to the Document Object Model (DOM).


    Learning how to work with client-side tools and XML can be a very valuable bridge
    to success in future projects. Combined with knowledge of server-side XML processing,
    client-side skills can give you quite an edge in a complex project.


    # Why Use Client-Side Scripting?


    At first glance, it seems pretty silly to process XML data on the client side
    when such powerful languages as PHP, ASP.NET, Java, and Perl exist to handle processing
    on the back end. But, if you''ve been around the world of Web development for
    any length of time, you''ll know that there are circumstances in which it makes
    sense to handle things on the server side, and other conditions that suit processing
    on the client side.


    Processing data on the client side can help relieve server load and give the visitor
    a better, more responsive experience of your site. For example, the use of server-side
    programming to perform a task as simple as sorting a column in a table, or formatting
    some data, is unnecessary; it also forces the user to wait longer than'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Chapter 6: Manipulating XML with JavaScript/DHTML


    they should have to for such trivial operations. Client-side processing of XML
    data can be a big help in situations like this.


    # Working with the DOM


    What is the DOM? It''s the Document Object Model, a W3C Standard that allows you,
    the programmer, to put together a document dynamically, and to navigate and manipulate
    its structure and content.


    In this chapter, we''re going to spend some time on the DOM. Consider this discussion
    a precursor to Chapter 7, where we''ll get into more detail with PHP''s SimpleXML
    library, and discuss DOM and SAX, two alternate approaches to processing XML documents.
    There''s a lot to cover, so buckle your seat belts and get ready!


    # Loading Documents into Memory


    Earlier, we mentioned that most programming languages that interface with XML
    use an XML parser to load XML documents into memory. Once they''re loaded, information
    in the documents can be retrieved and manipulated through the Document Object
    Model (DOM).


    You can visualize the DOM''s structure as a tree of nodes. The root of the tree
    is a Document node, which has one or more child nodes that branch off from this
    trunk. Each of these child nodes may in turn contain child nodes of their own,
    and so on.


    Every node in the document offers some standardized functionality, described by
    the DOM standard as the Node interface. The DOM standard supports roughly a dozen
    node types, each of which contains specialized functionality on top of the standard
    Node interface. The Document is one such node type. Element, Attr, and Text are
    others.


    There are two useful methods by which we can load a DOM representation of an existing
    XML document on the client side. The first is to load XML code from an existing
    file; the second is to create the code as a JavaScript string and load it into
    the parser that way. A third method involves creating what''s called an XML Data
    Island directly inline with the HTML content, but, as this method works only in
    Internet Explorer, we won''t cover it here.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'We''ll examine both of the common methods in a moment, but first we need to
    learn how to instantiate an XML parser.


    # Using the XML Parser


    To manipulate or traverse an XML XMLDOM document in Internet Explorer, we first
    have to instantiate the Microsoft XMLDOM parser. In Internet Explorer 5.0 and
    above, we can instantiate the parser using JavaScript.


    ```

    <script type="text/javascript">

    var xml = new ActiveXObject("Microsoft.XMLDOM");

    ...

    </script>

    ```


    # Internet Explorer only


    Although we will eventually implement a cross-browser solution for manipulating
    XML data on the client side, let''s start with an Internet Explorer-only solution
    for simplicity.


    Once the parser is instantiated, we can load a file into it using a series of
    commands. In this example, we load a file named menu.xml into the parser.


    ```

    <script language="JavaScript">

    var xml = new ActiveXObject("Microsoft.XMLDOM");

    xml.async = false;

    xml.load("menu.xml");

    ...

    </script>

    ```


    # Why Set xml.async?


    Setting the async property of the xml variable to false ensures that the parser
    will wait until the document is fully loaded before it does anything else.


    Here''s the XML file we''ll use for the examples that follow in this section:


    ```

    <?xml version="1.0" encoding="iso-8859-1">\n<menu>

    <meal>

    ```'
