  md: '# USE XML TO BUILD FUTURE-PROOF, FLEXIBLE PHP APPLICATIONS TODAY!


    No-Nonsense XML Web Development with PHP shows you how to put XML in use in PHP-powered
    Websites with practical examples, straightforward explanations, and ready-to-use
    code.


    Unlike other dry, boring, and theoretical writing on XML, this book doesn’t cover
    the entire spectrum of XML technologies; it covers practical applications of XML
    that are useful to you right now.


    +   - Build an XML-based Content Management System

    - Master PHP 5’s advanced XML functionality.

    - Create RSS feeds for your site.

    - Manipulate XML using XSLT, SimpleXML, DOM, and SAX.

    - Learn how to use XML-RPC to add Web Services to your site.

    - Write consistent XML using DTDs.


    ![](img/193b3c728296f42a8b0b0affe63e1530_403_0.png)


    ABOUT THOMAS MYER

    Thomas Meyer is the founding principal of Triple Dog Dare Media, a Texas-driven
    consultancy that specializes in building database- and XML-driven dynamic sites.
    He has worked with XML extensively to build document repositories, search engine
    indexes, content portal taxonomies, online product catalogs, and business logic
    frameworks.


    | SITEPOINT BOOKS |

    | Advocate best practice techniques |

    | Lead you through practical examples |

    | Provide working code for your Website |

    | Make learning easy and fun |


    ![](img/193b3c728296f42a8b0b0affe63e1530_403_1.png)


    Visit us on the Web at sitepoint.com for sales and support email books@sitepoint.com'
