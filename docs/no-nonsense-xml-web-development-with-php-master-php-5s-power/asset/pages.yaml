    \nxmlns=\"http://purl.org/rss/1.0/\">\n```\n\nAs these declarations, RSS 1.0 is\
    \ actually a mixture of at least two groups of XML tags and attributes: the RDF\
    \ standard tags/attributes, which are given the rdf: namespace prefix, and the\
    \ RSS-specific tags/attributes, which will use the default namespace. As required\
    \ by the RDF standard, the root element of the document is RDF.\n\nThings become\
    \ a little more familiar with the channel element:\n\n```\n<channel\n  rdf:about=\"\
    http://www.tripleddogaredaremedia.com/articles/\"\n  <title>Ecommerce Development</title>\n\
    \  <link>http://www.tripleddogaredaremedia.com/articles/</link>\n  <description>If\
