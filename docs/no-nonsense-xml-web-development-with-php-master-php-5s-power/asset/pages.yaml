  pgno: 87
- img_proc: true
  md: 'XML supports a number of built-in entities (among &lt; &gt;, &quote; &amp;)
    that don''t ever need to be declared inside a DTD. With entity declarations, you
    can define your own entities—something I think you''ll find useful in your XML
    career.


    There are different types of entities, including general, parameter, and external.
    Let''s go over each very quickly.


    General entities are basically used as substitutes for commonly-used segments
    of XML code. For example, there is an entity declaration that holds the copyright
    information for a company:


    ```

    <!ENTITY copyright "#xA9; 2004 by Triple Dog Dare Media">

    ```


    Now that we''ve declared this entity, we could use it in our documents like so:


    ```

    <footer>&copy;</footer>>

    ```


    When the parser sees &copy;, an entity reference, it looks for its entity declaration
    and substitutes the text we''ve declared as the entity.


    There are a couple of restrictions on entity declarations:


    +   Circular references are not allowed. The following is a no-no:


    ```

    <!ENTITY entity1 "&entity2; is a real pain to deal with!"

    <!ENTITY entity2 "Or so &entity1;would like you to believe!">

    ```


    +   We cannot reference a general entity anywhere but in the XML document proper.
    For entities that you can use in a DTD, you need parameter entities.


    Parameter entities are both defined and referenced within DTDs. They are generally
    used to keep DTDs organized and to reduce the typing required to write them. Parameter
    entity names start with the % sign. Here''s an example of a parameter entity,
    and its use in a DTD:


    ```

    <!ENTITY % acceptable "#(CDATA|b|i|u|citation|dialog)**">

    <!ELEMENT paragraph %acceptable;>

    <!ELEMENT sidebar %acceptable;>

    <!ELEMENT note %acceptable;>

    ```


    What this says is that each of the elements paragraph, intro, sidebar, and note
    can contain regular text as well as b, i, u, citation, and dialog elements.'
