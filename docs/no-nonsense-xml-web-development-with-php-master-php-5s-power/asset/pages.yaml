  md: '# Getting to Know XSLT


    XSLT, as I mentioned earlier in the chapter, stands as a tool that you can use
    for Extensible Stylesheet Language Transformations. Think of it as a tool you
    can use to transform your XML documents into other documents. Here are some of
    the possibilities:


    +   - XML into HTML or raw ASCII text.


    +   - Transform XML into other dialects of XSLT.


    +   - Pull out all the passages tagged as Spanish, French, or German to create
    foreign-language versions of your XML document.


    Not bad—and we barely scratched the surface!


    XSLT is a rules-based, or functional language. It''s not like other programming
    languages (e.g. PHP or JSP) that are procedural or object-oriented. Instead, XSLT
    requires you to apply a series of rules (called “templates”) that tell it what
    to do when it encounters the various elements of an XML document.


    For instance, upon identifying an XML <p> tag in the input document, a rule could
    instruct XSLT to convert it into an HTML <p> tag.


    Because XSLT can be a little bewildering even for veteran programmers, the best
    way to tackle it is to walk through a series of examples. That way, I can give
    you the practical information you''ll need to get started, and you can learn the
    key concepts along the way. As XHTML, countless books, articles, and Websites
    are devoted to XSLT; use these to continue your education.


    # Your First XSLT Exercise


    Let''s get started with XSLT. For our first exercise, we''ll reuse the very simple
    Letter to Mother example we saw in the CSS section. We''ll also create a basic
    Extensible Stylesheet Language (XSL) file to transform XML. Keeping both these
    elements simple will give us the opportunity to step through the major concepts
    involved.


    First, let''s create the XSL file. This file will contain all the instructions
    we''ll need in order to transform the XML elements into raw text.


    In what will become a recurring theme in the world of XML, XSL files are in fact
    XML files in their own right. They must therefore follow the rules that apply
    to'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'all XML documents: an XSL file must contain a root element, all attribute values
    must be quoted, and so on.


    All XSL documents begin with a stylesheet element This element contains information
    that the XSLT processor needs to do its job:


    File: letter2text.xsl (excerpt)


    ```

    <xsl:stylesheet version="1.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    ```


    The version attribute is required. In most cases, you''d use 1.0, as this is the
    most widely supported version at the time of this writing.


    The xmlns:xsl attribute is used to declare an XML namespace xs1. With your stylesheet
    transformation to work at all, you must declare an XML namespace for the URI http://www.w3.org/1999/XSL/Transform
    in your opening <stylesheet> tag. In our example, we will use an xsl prefix on
    all of the stylesheet-related tags in our XSL documents to associate them with
    this namespace. You''ll find this is common practice when working with XSL.


    The next element will be the output element, which is used to define the type
    of output you want from the XSL file. For this example, we will use text as our
    method:


    File: letter2text.xsl (excerpt)


    ```

    <xsl:output method="text" />

    ```


    Other possible values for the method attribute include html and xml, but we''ll
    cover those a little later.


    We come to the heart of XSLT—the template and apply-templates elements. Together,
    these two elements match the transformations happen.


    Put simply, the XSLT processor (for our immediate purposes, the browser) starts
    reading the input document, looking for elements that match any of the template
    elements in our style sheet. When one is found, the contents of the corresponding
    template element tells the processor what to output before continuing its search.
    Where a template contains an apply-templates element, the XSLT processor will
    search for XML elements contained within the current element and apply templates
    associated with them.


    There are some exceptions and additional complications we''ll see as we move forward,
    but for now, that''s really all there is to it.'
