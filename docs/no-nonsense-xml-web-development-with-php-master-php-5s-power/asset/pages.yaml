    # Using XSLT to Transform XML into other XML


    What happens if we need to transform your own XML document into an XML document
    that meets the needs of another organization or person? For instance, what if
    our letter document, which uses <to>, <from>, and <message> tags inside a <letter>
    tag, needed to have different names, say <recipient>, <sender>, and <body>


    Not to worry—XSLT will save the day! And, with the two previous examples, we don''t
    even need to worry about changing the source XML document. All we have to do is
    create a new XSL file, and we''re set.


    As before, we''ll open with the standard stylesheet element, but this time, we''ll
    choose xml as our output method. We''re also going to instruct XSLT to indent
    the result using XML:


    ```

    <xsl:stylesheet version="1.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    <xsl:output method="xml" indent="yes"/>

    ```'
