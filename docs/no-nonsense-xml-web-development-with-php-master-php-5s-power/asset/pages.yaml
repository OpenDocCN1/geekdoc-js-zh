    # Disable Magic Quotes


    All of the PHP scripts in this book assume you have the magic quotes feature of
    PHP disabled. This can be done by setting the magic_quotes_gpc option in your
    server''s php.ini file to Off.


    If this feature is on, you''ll find a lot of unwanted backslashes (\) appearing
    in your content as you manipulate it using the administration scripts we''ll develop
    in this section and in Appendix B.


