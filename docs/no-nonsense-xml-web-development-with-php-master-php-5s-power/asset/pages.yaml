  md: '# Chapter 5: XSLT in Detail


    ```

    <product sku="91882"></product>

    <product sku="873638">Inbox</product>

    <product sku="192839">Desk</product>

    <product sku="66553">Pen</product>

    <product sku="38289">Calculator</product>

    </catalog>

    ```


    If we want to sort using the sku attribute, we must first add a data-type attribute
    to the sort element, so that it knows it''s sorting numbers and not text values
    (the default). There are three valid values for this attribute: text, number,
    and qname. For now, we will concentrate on number, because it will allow us to
    sort the lists on the numeric SKUs.¹


    We also have to tell XSLT what to look at when performing the sort. To do this,
    we use the select attribute of the sort element.


    ```

    <xsl:template match="catalog">

    <h1>Product Listing</h1>

    <xsl:apply-templates select="product">

    <xsl:sort select="@sku" data-type="number" />

    </xsl:apply-templates>

    </xsl:template>

    ```


    File: sort-sku.xsl (excerpt)


    What''s happening here is that for each element to be sorted, the select attribute
    of the sort element provides an XPath expression that locates the data to be used
    in performing the sort. In this case, @sku points to the sku attribute of each
    product element.


    Figure 5.3 shows the results of this XSLT processing.


    What happens if we want to display the SKU as well as the product name? We can
    simply modify the template for our product elements to output the value using
    a value-of.


    ```

    <xsl:template match="product">

    <p><xsl:value-of select="@sku" /> - <xsl:apply-templates/></p>

    </xsl:template>

    ```


    File: sort-sku-show.xsl (excerpt)


    Figure 5.4 shows the new display.


    ¹SKU stands for Stock Keeping Unit, which is simply a unique numeric ID for a
    product for.'
