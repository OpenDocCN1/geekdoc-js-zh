    # Setting up a Cron Schedule to Run Periodically


    Now that we have the PHP script working with our MySQL database, we need to set
    up a cron schedule to run at different times—for instance, shortly after midnight,
    and in the early afternoon.


    We could set our cron task to run twice a day (at 12:30am and 2:30pm) with the
    following crontab entry (assuming the name of our backup script is xml-backup.php):


    ```

    30 0,14 * * * /usr/bin/php /path/to/xmlbackup.php

    ```


    For full details of setting up cron tasks, run man crontab at the command prompt
    of your Linux (or similar) server.


    On Windows servers, you can instead set this up using the Task Scheduler and the
    command-line interface version of PHP.


    The key is to balance the need to make frequent version updates against our performance
    requirements. The result? A quick script makes a backup of all our files. We can
    now use the MySQL backup to restore files if needed, or even to perform database
    queries of our XML content.


