  md: "# Table 9.1. Simple XML-RPC Data Types\n\n| Data Type | Example |\n|--- |---\
    \ |\n| int or i4 | <int>98</int><br><i4>98</i4> |\n| 32-bit integers between -2,147,483,648\
    \ and 2,147,483,647 | |\n| double | <double>98.6</double> |\n| 64-bit floating\
    \ point numbers | |\n| boolean | <boolean>1</boolean> |\n| true (1) or false (0)\
    \ | |\n| string | <string>Hello there</string> |\n| ASCII text | |\n| dateTime.iso8601\
    \ | <dateTime.iso8601>20050701T16:31:22</dateTime.iso8601> |\n| Dates in ISO8601\
    \ format (YYYY-MM-DDTHMM:SS) | |\n| base64 | <base64>SGVsb8sIFdvcmxxIQ==</base64>\
    \ |\n| Binary information encoded in Base64 | |\n\nSo much for simple types; what\
    \ about complex types? Well, there are two complex types—arrays and structs—which\
    \ are made up of combined simple types. For example, an array may contain numerous\
    \ double or string values.\n\nAn array is indicated by an array element, which\
    \ is just a list of values in a single data element. The following example could\
    \ be a list of temperatures taken at a clinic:\n\n```\n<value>\n  <array>\n  \
    \  <data>\n      <value><double>98.7</double></value>\n      <value><double>99.3</double></value>\n\
    \      <value><double>99.5</double></value>\n      <value><double>97.9</double></value>\n\
    \    </data>\n  </array>\n</value>\n```"
