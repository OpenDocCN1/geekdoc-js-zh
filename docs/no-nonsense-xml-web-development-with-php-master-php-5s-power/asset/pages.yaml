    # Our CMS Project


    Now that we''ve learned how to use JavaScript to load XML data, and to work with
    that data, let''s use these newfound skills to add some capabilities to our CMS
    project.


    # Browser Compatibility Concerns


    ![](img/193b3c728296f42a8b0b0affe63e1530_178_0.png)


    As I have already mentioned, client-side XML processing is currently not supported
    in all browsers. In particular, Safari and Opera browsers do not yet support the
    simplest of XSLT transformations. If you plan to develop a CMS for public consumption,
    you should steer clear of such techniques until wider browser support for these
    features is available. The server-side techniques I''ll present in Chapter 7 are
    more powerful and free of browser incompatibilities.


    For the sake of example, I''ll implement a couple of minor features of our CMS
    using client-side XML processing, but for real-world applications you should keep
    browser compatibility issues in mind.


    Right now, we can display Web copy, articles, news items, and the like. At some
    point, though, you can imagine that the Website will be full of content items.
    There may be hundreds of articles, news items, and so on. So many, in fact, the
    content items may become a little hard to sift through.


    What we need to do is add categories to the site. A smart, centralized category
    listing, and an easy way to assign content items to categories, can make it easier
    for visitors to navigate an otherwise undifferentiated mass of content.


    When I start talking about categorization, most of my friends and colleagues usually
    roll their eyes and yearn to leave the room. But I love to talk about categorization,
    ontologies, and things like that. I find them utterly fascinating in all kinds
    of ways. However, I promise to restrain myself in this chapter—isn''t a book about
    categorization, after all.


    The easiest way to get about all this is to jump right in and discuss things as
    we go along. I''ll try to keep the more esoteric discussions dejected to sidebars,
    so you can come back to them later if you''re in a hurry right now.


    Here is a category listing for a site devoted to Web development topics:'
