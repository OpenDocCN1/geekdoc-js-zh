- img_proc: true
  md: '# Accessing Different parts of the Document


    The childNodes property, and thus nodes variable in this example, contains a NodeList.
    In accordance with the DOM standard, you can access the elements of a NodeList
    by passing a numical index to the item method, with 0 corresponding to the first
    node in the list. In this example, therefore, nodes.item(0) would return a reference
    to the first child element of the menu element—the meal element.


    The DOM standard calls for nodes to support a textContent property, which would
    return all of the text contained by a given element and all of its descendants.
    Internet Explorer doesn''t support this property, but it does support a nonstandard
    text property that does the same. We can use this property to print out all of
    the text contained in the first meal element in the document:


    ```

    File: clientside-ie.html (excerpt)

    ```


    ```

    document.write(nodes.item(0).text);

    ```


    The result should look something like this:


    Buddha''s Delight A feast for the senses! $4.95


    If we want to print out the text in the title element of the first meal? To do
    this, we''d need to modify our JavaScript slightly:


    ```

    var nodes = xml.documentElement.childNodes.item(0).childNodes;

    document.write(nodes.item(0).text);

    ```


    When we run the code now, the text “Buddha’s Delight” is displayed in the browser
    window.


    # NodeLists as Arrays


    ![](img/193b3c728296f42a8b0b0affe63e1530_162_0.png)


    Internet Explorer (and indeed many other DOM implementations) lets you treat NodeLists
    as arrays to simplify the code you use to work with them. In this example, you
    could use array syntax to access nodes instead of the item method:


    ```

    var nodes = xml.documentElement.childNodes[0].childNodes;

    document.write(nodes[0].text);

    ```


    This method of accessing text values within an XML file by numerical index is
    useful, but it can get a little cumbersome. Fortunately, there is another way
    to approach the problem.'
