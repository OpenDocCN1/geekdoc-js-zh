  md: "# Chapter 7: Manipulating XML with PHP\n\nIf you're not a PHP guru, it can\
    \ be a little hard to figure out when you have to cast to a string and when PHP\
    \ will do it for you. The examples in this book should help somewhat, but if in\
    \ doubt, cast the value to a string yourself—that way you'll be sure your PHP\
    \ is treating the value as you intended.\n\n# XML Attribute Values\n\nYou can\
    \ access the value of an attribute by treating the element object as an array,\
    \ and using the attribute's name as an array key.\n\nFor example, to print out\
    \ the value of the first keyword element's status attribute, we could use the\
    \ following:\n\n```\necho $keywords->keyword[0]['status']; // prints \"live\"\n\
    ```\n\nAs element values, however, things become tricky when you try to compare\
    \ attribute values to PHP strings, as they are actually objects at heart. For\
    \ example, imagine you want to display only \"live\" keywords. You might assume\
    \ that it would be as easy as this:\n\n```\nforeach ($keywords->keyword as $kw)\
    \ {\n  if ($kw['status'] == 'live') { // wrong!\n    echo '<li>' . htmlspecialchars($kw)\
    \ . '</li>';\n  }\n}\n```\n\nThe above snippet looks reasonable. However, PHP\
    \ can't compare apples to oranges—so none of the keywords will be displayed.\n\
    \nTo make this work, we have to cast our attribute object to a string:\n\n```\n\
    foreach ($keywords->keyword as $kw) {\n  if ((string)$kw['status'] == 'live')\
    \ {\n    echo '<li>' . htmlspecialchars($kw) . '</li>';\n  }\n}\n```\n\nLet's\
    \ call this \"the hard way.\" An easier method of filtering the values you retrieve\
    \ from an XML document exists, thanks to XPath."
  merge: -1
