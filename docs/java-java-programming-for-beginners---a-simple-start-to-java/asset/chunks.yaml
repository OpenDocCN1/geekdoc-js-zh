    \ `case` 为真时执行某些操作。`default` 情况不需要 `break`。但是，根据惯例，建议使用它。\n\n示例实现：\n\n```java\n\
    public class myTest {\n    public static void main(string args[]){\n        char\
    \ mygrade = ‘A’;\n        switch(mygrade)\n        {\n        case value1:\n//Statements\n\
    break;\n        case value2 :\n//Statements\nbreak;\ndefault:\n//Optional\n}\n\
    \    }\n}\n```\n（注：原文 switch 示例代码逻辑不完整，根据指令严格保留代码块不翻译）\n[/content]\n```\n*(抱歉，由于回复生成中出现了逻辑混乱，请以最终为准的翻译结果。)*\n\
