  trans: "\n\n# HTML（超文本标记语言）是一种用于创建网页的语言。事实上，这种语言从第一个网页诞生起就一直被使用。然而，随着更新、更好的版本的引入，其功能也随之演进。\n\
    \n已知，这种语言源于 `SGML`（标准泛化标记语言），它早期被用于文档出版。HTML 继承了 `SGML` 的格式化功能概念及其语法。\n\n就浏览器而言，HTML\
    \ 使用中最有趣且有益的方面面之一，是浏览器同时支持向后兼容和前向兼容。虽然向后兼容通常很容易实现，但前向兼容却非常棘手，因为在这种情况下，其问题领域是无限大的。然而，为了实现这一点，浏览器被设计为忽略它们无法识别的标签。\n\
    \n多年来，HTML 一直是人们追求。但随着时间的推移，人们感到需要更多，而另一种名为 `XML`（可扩展标记语言）的技术出现催了这种需求。尽管 `XML`\
    \ 与 `HTML` 有许多相似之处，但两者之间存在许多根本性的区别。首先，`XML` 要求标签匹配，即每一个起始标签都必须存在一个结束标签。\n\n此外，`XML`\
    \ 允许你创建自己的标签，因为它不像 `HTML` 那样拥有固定的标签集。\n\n`XML` 中使用的标签是元标签，或者是描述包含在起始和结束标签之间数据的标签。为了确保\
    \ `XML` 文档的有效性，使用名为 `XSD`（XML 架构）的技术。然而，这种技术无法用于验证 `HTML` 文档，因为 `HTML` 文档缺乏定义的结构。\n\
    \n`W3C`（万维网联盟）引入了 `XHTML` 来尝试修复 `HTML` 的缺陷。根据 `XHTML` 规范，`HTML` 文档被强制遵循用于 `XML`\
    \ 的格式规范。因此，这允许使用 `XSD` 工具对 `HTML` 文档进行验证。尽管在框架中集成 `XML` 解决了一些问题，但某些问题仍然出现。现代重大问题之一是对多媒体集成增长的需求。虽然\
    \ `CSS` 执行了一定的格式化，但它已无法满足日益增长的需求。\n\n为了支持交互和动画视觉，该组合中添加了名为 `JavaScript` 的编程支持。然而，这种支持的初始版本对程序员来说难以理解，且执行速度缓慢。这导致了如\
    \ `Flash` 等插件的引入，以获得关注。这些插件完成了预期的任务，但浏览器与多媒体的集成在本质上仍然松散。\n\n`HTML5` 并不是 `XHTML`\
    \ 的演进形式。相反，`HTML5` 可以被更好地描述为 `HTML 4.01` 的重新发明形式，以及 `HTML`、`CSS` 和 `JavaScript`\
    \ 如何结合使用来解决用户群体增长的需求。\n\n## 语义标记\n`HTML5` 的基本特性是强调行为、表现和结构的分离。网站开发的语义标记指定了文档的结构。换句话说，它指定了标签的含义以及它们将为你完成什么。另一方面，行为和表现分别由\
    \ `CSS` 和 `JavaScript` 管理。\n\n## HTML5 元素\n在 `HTML` 中，一个元素简单来说包含起始标签、内容和结束标签的语句。因此，当你写下：\n\
    \n```html\n<div>\n  <b>This is my world!</b>\n</div>\n```\n\n在这个示例中，`div` 元素包含了从\
    \ `<div>` 到 `</div>` 的所有内容。因此，`<b>` 和 `<b></b>` 标签也是 `div` 元素的一部分。\n\n在这里说明这一点很重要：`HTML5`\
    \ 是不区分大小写的。因此，无论你为粗体标签写 `<B>` 还是 `<b>`，浏览器都会认为两者是相同的。\n\n然而，`W3C` 标准建议对标签使用小写。\n\
    \n## 在 HTML5 中操作元素\n`HTML5` 定义了超过 100 个元素。这些元素及其定义在附录中提供。\n\n### 如何向元素添加属性？\n\
    附加数据可以以属性的形式添加到起始标签中。属性通常可以表示为 `name=”value”`。属性 `name` 的值被包含在引号内。对于起始标签中可以添加的属性数量没有限制。对于这些属性，属性有一个名称，但没有值。\n\
    \n示例：\n```html\n<div id=\"main\" class=\"mainContent\"></div>\n```\n\n在这里，`id`\
    \ 和 `class` 是属性，其中 `id` 唯一标识元素，`class` 指定了该 `div` 所属的 CSS 样式。\n\n### 布尔属性\n可以使用几种类型的属性。最常用的类型之一是布尔属性。布尔属性可以从允许的值集中获取一个值。一些可能的值包括：\n\
    - Checked\n- Disabled\n- Selected\n- Readonly\n\n有两种方法指示布尔属性的值。\n\n```html\n<input\
    \ type=\"checkbox\" name=\"vegetable\" value=\"Broccoli\" checked=\"\" />\n<input\
    \ type=\"checkbox\" name=\"vegetable\" value=\"Broccoli\" checked='checked' />\n\
    ```\n在第一情况下，没有给出值而是是假设的。尽管后者看起来像是冗余的形式，但它是更优选的形式，特别是当你使用 `jQuery` 的时候。\n\n###\
    \ 全局属性引用\n`HTML5` 中有一组命名属性可供任何元素使用。这些属性包括 `accesskey`、`spellcheck` 和 `draggable`\
    \ 以及其他许多。\n\n### 空元素\n某些元素在任何情况下都不包含内容。这些元素包括 `<link>`、`<br>` 和 `<area>` 以及其他许多。\n\
    \n### 自闭标签\n如果你使用的元素不包含内容，那么可以使用自闭标签。这种标签的示例是 `<br/>`。然而，请注意，像 `<div>` 标签即使没有内容也必须写成\
    \ `</div>`。\n\n### 如何添加扩展属性\n由你定义的任何属性被称为扩展属性。当你需要时，可以为这个自定义属性命名并赋值。\n\n### 如何添加注释\n\
    可以使用 `!` 和两个连字符（`--`）添加注释。添加注释的语法如下：`<!--text-->`。\n\n你也可以使用以下语法添加条件注释：\n`<![if\
    \ IE 7]><html class=\"no-js ie6\" lang=\"en\"><![endif]> 这种注释。\n\n## 如何创建 HTML\
    \ 文档\nHTML 文档可以简单地描述为包含元数据、内容和结构的框架。\n\nHTML 文档必须以 `<!DOCTYPE html>` 标签。在 `HTML5`\
    \ 中，该声明指示浏览器以无兼容模式或 HTML5 模式运行。\n\n下一个标签应该是 `<html>`。该元素内部包含了 `<head>` 和 `<body>`。`<head>`\
    \ 元素可以包含 HTML 文档的元数据，使用 `<meta>` 标签声明和定义。`<head>` 元素还包含 `<title>` 元素，其作用如下：\n\
    - 被搜索引擎使用\n- 内容显示在浏览器工具栏中\n- 为页面提供默认名称\n\n`<body>` 元素包含了 HTML 文档上显示的任何其他信息。一个示例\
    \ HTML 文档如下：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\"\
    \ />\n  <title>TITLE OF DOC</title>\n</head>\n<body>\n  CONTENT\n</body>\n</html>\n\
    ```\n\n注意：\n1. 特殊字符如 `>` 或 `<` 是 HTML 语法的组成部分，可以通过名称或数字在 HTML 文档中使用。它们的用法语法为：`&entity_name;`\
    \ 或 `&entity_number;`\n\n附录包含了要使用的实体名称和数字表格。\n\n"
