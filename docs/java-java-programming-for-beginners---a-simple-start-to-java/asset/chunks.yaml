    \ irrespective of whether an exemption has happened or not. Utilizing a `finally`\
    \ piece permits you to run any cleanup-sort statements that you need to execute,\
    \ regardless of what happens in the secured code.\n\n### Creating An Exception\n\
    \nYou can make your own exemptions in Java. Remember the accompanying focuses\
    \ when composing your classes for exceptions:\n\n- All exemptions must be an offspring\
    \ of `Throwable`.\n- If you need to compose a checked exemption that is naturally\
