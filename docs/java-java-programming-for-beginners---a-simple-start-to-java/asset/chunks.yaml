  trans: "\n\nJavaScript 关键字是被保留的，不能使用。\n\n请注意，JavaScript 与 HTML 不同，它是区分大小写的。因此，`VAL`\
    \ 和 `val` 是两个不同的变量。此外，建议变量名应当描述其用途。例如，如果我们把变量命名为 `result`，那么显而易见该变量将包含代码计算出的结果值。\n\
    \nJavaScript 的另一个约定是命名变量时，使其首字母小写。然而，变量名中后续每个单词的首字母都要大写。一个例子是变量名 `arrayResult`。此外，不建议使用下划线\
    \ `_` 和美元符号 `$`，但它们在 jQuery 对象中会被使用。\n\n### 环境\n一组完整的变量及其包含的值构成了所谓的环境。因此，每当你在浏览器中加载新网页时，你都在创建一个新环境。以\
    \ Windows 8 为例，它在应用程序启动时会创建一个环境，并在应用程序结束时销毁该环境。\n\n### 函数\n一组实现特定目的的语句被称为函数。使用函数的目的是代码复用。如果你的程序在内部多次使用某项功能，则将其实现为函数，并在需要时调用。由于函数是从代码内部调用的，因此可以从代码向函数发送参数。执行后，函数会将一个值返回给调用函数。函数声明和定义的语法如下：\n\
    \n```javascript\nfunction multiply(a, b){\nreturn a*b;\n}\n```\n\n函数名之前必须始终带有关键字\
    \ `function`。变量 `a` 和 `b` 是传入函数的参数，函数返回通过计算 `a*b` 得到的值。这是一个简单的函数，但你可以根据所需的功能实现复杂且庞大的函数。\n\
    \n现在你已经实现了函数，可能在想如何调用该函数。这是一个示例：\n\n```javascript\nvar x=2;\nvar y=5;\nvar c=multiply(x,\
    \ y);\n```\n\n在这里，`x` 和 `y` 是函数 `multiply` 将作为参数接收的。\n\nJavaScript 是一种弱类型语言。这意味着如果你传递给函数的参数数量多于其预期的，系统仅会使用所需的前\
    \ `n` 个参数并丢弃剩余部分。这种功能的优势是，你可以使用已经实现的函数，并传递额外的参数来扩展该函数并为其添加功能。另一方面，如果你无意中传递了错误数量的参数，将无法获得任何错误提示。\n\
    \nJavaScript 还提供了一些用于与用户交互的内置函数。这些函数如下：\n\n#### alert\n此函数会弹出一个带有消息的警告框，用户点击 OK\
    \ 按钮后系统恢复运行。示例实现：\n\n```javascript\nalert('Alert message!');\n```\n\n#### prompt\n\
    此函数向用户显示一个文本框并要求其输入。你可以在提供的文本框中提供默认值，用户可以点击 OK 按钮确认输入的内容是正确的。示例实现：\n\n```javascript\n\
    var result = prompt('Enter a value', 'default value');\n```\n\n#### confirm\n\
    此消息让用户选择确定或取消某个操作。示例实现：\n\n```javascript\nvar result = confirm('Do you wish to\
    \ proceed?');\n```\n\n#### 函数作用域\n你定义的每个变量都拥有一个作用域，即定义它所在的函数。\n\n#### 函数嵌套\n函数可以在任意层级嵌套。\n\
    \n#### 类型转换\n在编写代码时，处理数据类型转换是非常重要的。\n\n#### 条件编程\n在编写代码时，你可能需要处理各种条件。\n\n####\
    \ if-else\n`if-else` 结构用于条件逻辑。\n\n```javascript\nif(condition) {\n    //code\n\
    }\nelse {\n    //code\n}\n```\n\n考虑一个需要验证输入的场景：\n\n```javascript\nvar userAge\
    \ = prompt('Enter your age: ');\nif(isNaN(userAge)) {\n    alert('Age is invalid!');\n\
    } else {\n    //code\n}\n```\n\n#### if-else if\n另一种条件编程结构是 `if-else if` 结构。该结构允许你声明多个条件及其相关的操作。\n\
    \n```javascript\nif(condition) {\n    //code\n}\nelse if(condition) {\n    //code\n\
    }\nelse {\n    //code\n}\n```\n\n#### Switch\n`switch` 结构用于处理多个条件。它比多个 `if-else\
    \ if` 语句更有效，因为它使用了跳转表。\n\n```javascript\nvar userChoice = prompt('Choose an alphabet:\
    \ a, b, c', 'e');\nswitch (userChoice) {\n    case 'a':\n        alert('a chosen\\\
    n');\n        break;\n    case 'b':\n        alert('b chosen\\n');\n        break;\n\
    \    case 'c':\n        alert('c chosen\\n');\n        break;\n    default:\n\
    \        alert('None of the alphabets chosen\\n');\n        break;\n}\n```\n"
- fmt: '

    Also, it is a good practice to use a `break` statement in the default case as
    well.


    ### Note

    If you wish to determine if a keyword has been assigned any value or not, you
    can use the following code:


    ```javascript

    if(c)

    {

    //code

    }

    else

    {

    //code

    }

    ```


    If the variable `c` has been assigned a not-null value, then the `if` condition
    is true and the corresponding code is executed. On the other hand, if the value
    of variable `c` is `undefined` or `null`, the code within the `else` construct
    is executed.


    ### Note

    The value of the following conditions will always be true:

    - `”” == 0`

    - `null == undefined`

    - `''123'' == 123`

    - `false == 0;`


    Please note that JavaScript converts the type of the variable concerned for compatibility
    in comparisons. However, if you want to compare both the value and type of two
    variables, then JavaScript provides another set of operators, `===` and `!==`.
    When the comparisons for the values mentioned in the above example are done using
    this operator, the resultant will always be `false`.


    ### Implementing Code Loops

    Looping is an important and commonly used construct of any programming language.
    You will be faced by several situations when you need to perform the same set
    of instructions, a given number of times. In order to implement this scenario,
    loops have to be used. Loop constructs available in JavaScript include `for`,
    `while` and `do-while`.


    The `while` loop includes a condition and as long as the condition remains true,
    the loop continues to execute. The `do–while` loop is a modification of the `while`
    loop. If the condition in the `while` is false, the `while` loop will not execute
    at all. On the other hand, even if the `while` condition is false, the `do-while`
    loop executes at least once.


    Syntax for `while` loop:

    ```javascript

    while(condition)

    {

    //code

    }

    ```


    Syntax for `do-while` loop:

    ```javascript

    do

    {

    //code

    }

    while(condition)

    ```


    The last type of loop available in JavaScript is `for` loop. The `for` loop allows
    you to initialize the looping variable, check for condition and modify the looping
    variable in the same statement.


    Syntax:

    ```javascript

    for(initialize; condition; modify)

    {

    //code

    }

    ```


    Sample code:

    ```javascript

    for(i=0; i<10; i=i+1)

    {

    //code

    }

    ```

    This loop will run 10 times.


    ### Note

    1. If at any point in time, you wish the loop to break, you can use the `break`
    statement.

    2. If you do not specify a condition or specify a condition that is always true,
    the loop will run infinitely.


    ### Error Handling

    Exceptions are expected to occur at several points in your code. Therefore, it
    is best to implement a mechanism that can help you deal with these exceptions
    and avoid crashing.


    An exception can be described as an illegal operation or any condition that is
    unexpected and not ordinary. A few examples of exceptions include unauthorized
    memory access.


    You can perform exception handling at your own level by validating the values
    of variables before performing any operations. for instance, before performing
    division, it is advisable to check if the value of the denominator is equal to
    zero. Any operation that involves division of a number by zero raises the divide-by-zero
    exception.


    However, there are other situations that cannot be handled in this manner. For
    instance, if the network connection breaks abruptly, you cannot do anything to
    pre-emptively handle the situation. Therefore, for situations like these, `try`,
    `catch` and `finally` keywords are used.


    The code that is expected to throw an exception is put inside the `try` block.
    This exception, upon its occurrence, is caught by the `catch` block, which executes
    code that is supposed to be executed immediately after an exception is caught.
    The `catch` may also be followed by the `finally` block, which performs the final
    cleanup. This block is executed after the execution of `try` and `catch` blocks.


    Syntax:

    ```javascript

    try

    {

    //code

    }

    catch(exception name)

    {

    //code

    }

    finally

    {

    //code

    }

    ```


    ### Working with Objects

    JavaScript allows user access to a number of existing objects. One of these objects
    is an array. This section discusses all the basics related to this chapter. Dealing
    with objects in JavaScript also includes creation and handling of customized objects.
    However, this topic shall be covered in the chapter on JavaScript and jQuery.


    #### Arrays

    A collection of similar objects that are sequenced contiguously are referred to
    as an array.


    This array is given a name and each element can be accessed using the indexer,
    in the following form:

    Let `arrName[]` be an array of names. The element `arrName[2]` refers to the third
    element of the array.


    An array can be created using the following three methods: Insertion of Items
    Using Indexer


    An array can be created using the `new` keyword and then, elements can be added
    into the array by assigning values to independent elements of the array. The `new`
    keyword creates an instance of the object `Array` using the constructor for the
    same.


    Sample implementation:

    ```javascript

    var arrName = new Array();

    arrName [0] = ‘Jack’;

    arrName [1] = ‘Alex’;

    ```


    **Condensed Array**

    The second type of implementation also uses the `new` keyword. However, in this
    case, the values are assigned to the elements as arguments to the constructor
    of the `Array` object.


    Sample implementation:

    ```javascript

    var arrName = new Array(''Jack, ''Alex'');

    ```


    **Literal Array**

    In this type of array definition, values are provided within the square brackets.


    Sample implementation:

    ```javascript

    var arrName = [ ‘Jack, ‘Alex’];

    ```


    The advantage of using the first type of definition is that it allows you to assign
    values to the elements anywhere in the code. On the other hand, the second and
    third type of implementation requires you to have the exact list of elements with
    you beforehand.


    There are some properties associated with all object. The one property that can
    come in handy to you is `length`, which is a read-only value and when called return
    the number of elements present in the array. You can use this property in loops
    and conditions.


    Objects can also have their own functions. These functions are called methods.
    The methods available for Array include:


    - `concat`: Returns an array, which is the concatenation of the two arrays supplied
    to it.

    - `indexOf`: Finds the location of the element concerned in the array and returns
    the index of the.

    - `join`: This method concatenates all the values present in the array. However,
    all these values are separated by a comma by default. You can specify a delimiter
    of your choice as well.

    - `lastIndexOf`: This method works similarly as `indexOf`. However, it performs
    the search from the last element of the array. Therefore, it returns the index
    of the last element that matches the specified criterion.

    - `pop`: Removes the last element and returns its value.

    - `push`: Adds the concerned element to the end of the array and returns the changed
    value of length.

    - `reverse`: This method reverses the order of the array elements. The original
    array is modified by this method.

    - `shift`: Removes and returns the first value. If the array is empty, then undefined
    is returned.

    - `slice`: This method requires two arguments, start index and end index. A new
    array is created with elements same as the elements present at indexes (start
    index) and (end index – 1).

    - `sort`: This method sorts the elements and modifies the original array.

    - `splice`: This method removes and adds elements to the specified array. The
    arguments taken by this method are start index (index from where the system should
    start removing elements), number of elements to be removed and elements to be
    added. If the value passed for number of elements is 0, then no elements are deleted.
    On the other hand, if this value is greater than the size of the array, all elements
    from the start index to the end of the array are deleted.

    - `toString`: This method creates a string, which is a comma separated concatenated
    string of all the elements present in the array.

    - `unshift`: This method adds an element at the first location of the array and
    return the modified value of length.

