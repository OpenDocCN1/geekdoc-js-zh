    empname: Mary John\nempage: 25\nempcompensation: 2000\n\n### 基本数据类型\n\n变量只是用于存储值的内存区域。这意味着当你创建一个变量时，你就在内存中节省了一些空间。根据变量的数据类型，工作框架会分配内存并决定可以放入所持内存的内容。\n\
    \n因此，通过为变量指定不同的数据类型，你可以在这些变量中存储整数、小数或字符。\n\nJava 中有两种可用的数据类型：\n1. 引用/对象数据类型\n\
    2. 基本数据类型\n\n### 基本数据类型\n\nJava 支持八种基本信息类型。基本数据类型由语言预言定义，并用口令命名。本节将详细讨论这些数据类型。\n\
