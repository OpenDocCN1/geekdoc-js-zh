    The most appropriate approach to make a string is to use the following statement:
    String mystring = “Hi world!”;


    At whatever point it experiences a string exacting in your code, the compiler
    makes a String object with its value for this situation, “Hi world!’.


    Similarly as with other objects, you can make Strings by utilizing a constructor
    and a new keyword. The String class has eleven constructors that permit you to
    give the starting estimation of the string utilizing diverse sources, for example,
    a cluster of characters.


