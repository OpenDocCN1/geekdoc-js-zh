    \n下面的代码展示了你如何解析 URL 字符串并根据它生成响应。\n\n```javascript\nvar http = require(‘http’);\n\
    var url = require(‘url’);\nhttp.createServer(function (request, response) {\n\
    \  var url_parts = url.parse(request.url, true);\n  response.writeHead(200, {‘Content-Type’:\
    \ ‘text/plain’}); response.end(‘Hey ‘ + url_parts.query.name + ‘.\\n’);\n  console.log(‘Handled\
    \ request from ‘ + url_parts.query.name);\n}).listen(8080, ‘localhost’);\nconsole.log(‘Server\
    \ is running at: http://localhost:8080/’);\n```\n\n你可以以之前代码类似的方式测试这段代码的运行。\n\n\
    ## 如何创建 Node.js 模块\n\n你可以通过编写函数形式的代码创建模块，然后从主代码中调用这些模块。\n\n```javascript\nvar\
    \ myHttp = require(‘http’);\nvar myUrl = require(‘url’);\nfunction start(){\n\
    \  http.createServer(function (request, response) {\n    var url_parts = url.parse(request.url,\
    \ true);\n    response.writeHead(200, {‘Content-Type’: ‘text/plain’});\n    response.end(‘Hello\
    \ ‘ + url_parts.query.name + ‘!\\n’);\n    console.log(‘Handled request from ‘\
    \ + url_parts.query.name);\n  }).listen(8080, ‘localhost’);\n  console.log(‘Server\
    \ running at http://localhost:8080/’);\n}\nexports.start = start;\n```\n\n当你将这段代码保存到文件中时，一个模块就被创建了。其他函数可以通过\
    \ `require` 函数使用此模块。例如，如果文件保存为 `sample1.js`，则可以在另一个函数中使用以下方式使用 `start()`：`var\
    \ samplex = require(‘./sample1.js’);`\n\n`sample1.start();`\n\n## 如何创建 Node.js\
    \ 包\n\n模块集合被称为应用程序。一旦发布了包，就可以被安装和使用。例如考虑一个包含不同数学模块的包。\n\n根文件夹必须包含以下内容：\n- `README.md`\n\
    - `\\packName`\n- `\\lib`\n  - `main.js`\n- `\\bin`\n  - `mod1.js`\n  - `mod2.js`\n\
    \n## 创建聚合模块\n\n你可能只想为用户提供一个访问对象。用户应该能够通过该对象访问包中的所有模块。为了实现这一点，必须在 `bin` 文件夹中创建一个\
    \ `main.js` 模块，并在其中定义要包含在 `module.exports` 中的模块。\n\n## 如何创建 README.md 文件\n\n`README.md`\
    \ 文件是一个帮助文件，开发者可以将其作为使用你的包的启动指南。该文件的扩展名为 `.md`，它是 markdown 的缩写。这种格式使得文件中编写的文本具有可读性。\n\
    \n下面是此类文件的示例文件：\n\n```\nsamplePackage package\n====================\n```\n\n在\
    \ `samplePackage` 中，可用函数有：\n- `add`: 执行两个数字相加并显示结果。\n- `sub`: 从一个数字中减去另一个数字并显示结果。\n\
    \n## 如何创建 package.json 文件\n\n此文件包含包的元数据，可以使用命令手动创建：\n\n`npm init`\n\n此命令创建一个文件，稍后可以编辑。示例文件如下：\n\
    \n```json\n{\n  “name”: “sample”,\n  “version”: “0.0.0”,\n  “description”: “这是一个示例文件”,\n\
    \  “main”: “main.js”,\n}\n```\n\n## 如何发布包\n\n如前所述，包可以通过结构定义。当你发布包时，它将对所有用户可见。为了执行此操作，你需要在发布任何包之前创建一个账户。要发布包，你只需要进入根目录并输入命令：`npm\
    \ publish`\n\n## 如何安装和使用包\n\n发布的包可以被任何用户下载和安装。你只需要进入文件夹并输入命令：`npm install samplePackage`。这本地安装包。另一方面，如果你想全局安装包，可以使用命令：`npm\
    \ install -g samplePackage`。对于全局安装，你需要使用命令 `npm link` 创建应用程序的链接。\n\n全局安装路径是一个节点。你可以使用\
    \ `cd` 命令进入 `node_modules` 文件夹。进入该文件夹后，可以使用 `npm install contoso` 来启动安装。你现在可以编写使用该包的代码。示例如下：\n\
    \n```javascript\nvar samplePackage = require(‘samplePackage’);\nvar finalResult\
    \ = 0;\nconsole.log();\nfinalResult = samplePackage.add (5,10);\nconsole.log(‘add\
    \ (5,10) = ‘ + finalResult);\nconsole.log();\nresult = samplePackage.sub (50,10);\n\
    console.log(‘sub(50,10) = ‘ + finalResult);\nconsole.log();\nconsole.log(‘done’);\n\
    ```\n\n这段代码测试了包的模块。你可以使用 `node main` 执行代码。\n\n该包可以使用 `npm uninstall samplePackage`\
    \ 进行本地卸载。然而，如果你想全局卸载包，可以使用 `npm uninstall -g samplePackage`。\n\n## 如何使用 Express\n\
    \n1. 第一步是安装 Node.js 并创建一个存放所有 .js 文件和项目的示例。此外，你必须安装 Express，它是一个用于 Node.js 开发的\
