- fmt: "\nYou can make an exhibit by utilizing the `new` operator with the accompanying\
    \ statement: `myarray = new datatype[sizeofarray];`\n\nThe above declaration does\
    \ two things:\n\n1. It makes an exhibit with the help of the `new` operator in\
    \ the following manner: `new datatype[arraysize];`\n2. It relegates the reference\
    \ of the recently made array to the variable `myarray`.\n\nProclaiming a array\
    \ variable, making an exhibit, and doling out the reference of the show to the\
    \ variable can be consolidated in one declaration, as appeared: `datatype[] myarray\
    \ = new datatype[sizeofarray];`\n\nOn the other hand, you can also make clusters\
    \ in the following manner: `datatype[] myarray = {val0, val1, …, valk};`\n\nThe\
    \ components of the array are gotten to through the record. Array lists are 0-based;\
    \ that is, they begin from 0 to go up to `myarray.length-1`.\n\n### Sample Implementation\n\
    \nThe declaration shown below declares an array, `myarray`, makes a cluster of\
    \ 10 components of double type and doles out its reference to `myarray`: `double[]\
    \ myarray = new double[10];`\n\n### Handling Arrays\n\nAt the point when handling\
    \ components of an array, we frequently utilize either `for` or `foreach` in light\
    \ of the fact that the majority of the components in an array are of the same\
    \ sort and the extent of the exhibit is known.\n\n#### Example\n\n```java\npublic\
    \ class Mytestarray {\n    public static void main(string[] args) {\n        double[]\
    \ myarray = {0.5, 1.2, 2.2, 3.4, 4.7};\n        for (int k = 0; k < myarray.length;\
    \ k++) {\n            System.out.println(myarray[k] + ” “);\n        }\n     \
    \   double aggregate = 0;\n        for (int k = 0; k < myarray.length; k++) {\n\
    \            aggregate += myarray[k];\n        }\n        System.out.println(“Aggregate\
    \ value = ” + aggregate);\n        double maxval = myarray[0];\n        for (int\
    \ k = 1; k < mylist.length; k++) {\n            if (myarray[i] > maxval)\n   \
    \             maxval = myarray[k];\n        }\n        System.out.println(“Max\
    \ Value is ” + maxval);\n    }\n}\n```\n\nThis would create the accompanying result:\n\
    0.5 1.2 2.2 3.4 4.7\nAggregate = 12.0\nMax Value is 4.7\n\n### The foreach Loops\n\
    \nJDK 1.5 presented another for construct, which is known as `foreach` loop or\
    \ extended for loop. This construct empowers you to cross the complete array successively\
    \ without utilizing an extra variable.\n\n#### Sample Implementation\n\n```java\n\
    public class Mytestarray {\n    public static void main(string[] args) {\n   \
    \     double[] myarray = {0.5, 1.2, 2.2, 3.4, 4.7};\n        for (double i: myarray)\
    \ {\n            System.out.println(i);\n        }\n    }\n}\n```\n\nThis would\
    \ deliver the accompanying result:\n0.5 1.2 2.2 3.4 4.7\n\n### Passing Arrays\
    \ to Methods\n\nGenerally, just as you can pass primitive values to methods or\
    \ functions, you can likewise pass arrays to systems. Case in point, the accompanying\
    \ method shows the components in an int array:\n\n```java\npublic static void\
    \ printarr(int[] arr) {\n    for (int k = 0; k < arr.length; k++) {\n        System.out.print(arr[k]\
    \ + ” “);\n    }\n}\n```\n\nYou can summon it by passing an array. Case in point,\
    \ the accompanying declaration conjures the `printarr` function to show the elements\
    \ of the array.\n`printarr(new int[]{0, 3, 5, 3, 1});`\n\nThe compilation and\
    \ execution of this code yields the following result: 0 3 5 3 1\n\n### How Can\
