  trans: "\n此用例中的元素。列表的元素简单地表示为项目符号。\n\n### 描述列表\n这种类型的列表使用 `<dl>` 元素声明。使用该元素，你可以提供一个包含零或多个术语的描述。此外，列表的元素使用\
    \ `<dt>` 元素声明，用于指定术语，并使用 `<dd>` 给出该术语的描述。\n\n### 自定义列表\n开发者可以使用 CSS 样式来创建自定义列表。在这种情况下，可以为嵌套列表的每一层创建不同的样式规则。\n\
    \n### 使用表格\n在网页中安排和展示数据的另一种格式是表格。表格使用 `<table>` 元素声明，并以行-列格式表示数据。表格的单元格使用 `<tr>`\
    \ 和 `<td>` 元素定义。`<tr>` 用于行，而 `<td>` 用于列。\n\n尽管 HTML5 表格是开发者可用的最强大的结构之一，但理解何时以及在何处最合适地使用表格是非常重要的。以下是不应使用表格的原因：为网页页创建的表格在读取到\
    \ `</table>` 标签之前不会渲染。另一方面，如果使用 `<div>` 元素创建相同的结构，内容将在读取时进行渲染。\n\n表格极其难以维护。\n\n\
    表格对于辅助功能设备来说难以解释。\n\n#### 示例实现：\n```html\n<table>\n<tr>\n<td>Frank</td>\n<td>1978</td>\n\
    </tr>\n<tr>\n<td>David</td>\n<td>1967</td>\n</tr>\n<tr>\n<td>Alex</td>\n<td>1989</td>\n\
    </tr>\n</table>\n```\n\n上面创建的表格看起来如下：\nFrank\n1978\nDavid 1967\nAlex\n1989\n\n\
    当你观察表格时，你一定已经意识到，除非我们了所谓的表头，否则表格是不完整的。这可以使用 `<th>` 元素完成。你可以同时在垂直和水平方向上创建表头。例如，我们可以在上面使用的代码中定义以下表头：\n\
    \n```html\n<table>\n<tr>\n<th>Name</th>\n<th>Year of Birth</th>\n</tr>\n<tr>\n\
    <td>Franky</td>\n<td>1978</td>\n</tr>\n<tr>\n<td>David</td>\n<td>1967</td>\n</tr>\n\
    <tr>\n<td>Alex</td>\n<td>1989</td>\n</tr>\n</table>\n```\n\n该代码生成的表格如下所示：\nName\n\
    Year of Birth\nFranky 1978\nDavid\n1967\nAlex\n1989\n\n在上面的情况下，表头仅仅是字体大一些。然而，你可以通过样式规则按你想要对它们进行样式。可以通过以下方式实现：\n\
    ```css\nth {\n  background-color: black;\n  color: white\n}\n```\n\n此样式规则将表格表头的单元格涂成黑色，并用白色编写文本。\n\
    \n大多数浏览器的默认行为是将所有的 `<tr>` 元素放在 `<tbody>` 中，表示这是表格的主体。然而，显式定义 `<tbody>` 是一个良好的习惯。此外，`<thead>`\
    \ 和 `<tfoot>` 也可以显式定义。可以使用 CSS 单独对表格的头部、主体和页脚设置样式。根据规则，你可以有一个头部元素、一个或多个主体元素和一个页脚元素。\n\
    \n在创建的表格中必须添加的下一个重要内容特性是表格标题。为了定义表格标题，使用了 `<caption>` 元素。\n\n在某些情况下，你可能觉得需要对单独列设置样式。考虑到表格在\
    \ HTML 中本质上是以行为为中心的，这可能看起来是一项艰巨的任务。虽然你有 `<tr>` 元素来识别行，但没有用于识别列的 `<tc>` 元素。`<td>`\
    \ 元素识别单元格。然而，你仍然可以使用 `<colgroup>` 或 `<col>` 元素对单独列设置样式。`<table>` 元素可以包含 `<colgroup>`\
    \ 元素，它包含了作为该组元素一部分的列的 `<col>` 元素。此外，`<col>` 元素还有一个 `span` 属性用于定义作为该组一部分的列。下面提供了一个解释其工作原理的示例实现：\n\
    \n```html\n<colgroup>\n  <col span=\"2\" class=\"vHeader\" />\n</colgroup>\n```\n\
    \n用于这组列设置样式的 CSS 样式规则可能如下：\n```css\n.vHeader {\n  color: red;\n}\n```\n\n虽然目前讨论的表格是普通表格，但\
    \ HTML5 也支持不规则表格，这可以描述为每行的列数不同的表格。`rowspan` 和 `colspan` 属性可以用于管理表格的布局。\n\n###\
    \ 第 6 章：JAVASCRIPT 和 JQUERY\n你可能已经习惯了 JavaScript 的强大。在 JavaScript 章节中，你已经学习了如何创建和添加\
    \ JavaScript 来使网页动态化。Web 开发最大的挑战是设计可以在任何浏览器上运行良好的网页元素，因为不同的浏览器对不同的元素提供支持，这使得寻找共同点变得困难。\n\
    \n本章通过教你如何创建对象并使用它们，在 JavaScript 开发上更进了一步。此外，它向你引入了 jQuery 的概念，尝试创建兼容的代码。\n\n\
    #### 如何创建 JavaScript 对象\n从数字到字符串在 JavaScript 中都是对象。因此，了解如何创建对象至关重要。创建对象的简单方法是使用对象字面量语法。以下示例说明了这一点：\n\
    ```javascript\nvar customer1 = {\n  yearOfBirth: 2000,\n  name: 'Alex',\n  getCustomerInfo:\
    \ function () {\n    return 'Customer: ' + this.name + ' ' + this.yearOfBirth;\n\
    \  }\n};\n```\n这段代码创建了一个对象 `customer1`，拥有成员 `name` 和 `yearOfBirth`。注意 `this` 关键字的使用，它可以正确地访问或引用对象的值。\n\
    \n此外，你还可以使用 `new` 关键字动态地创建对象。继承的方法包括：`constructor`、`isPrototypeOf`、`hasOwnProperty`、`toLocaleString`、`propertyIsEnumerable`、`valueOf`、`toString`。一旦对象已创建，可以通过以下方式添加属性：\n\
    ```javascript\nfunction getCustomer(myName, myYearOfBirth) {\n  var newCust =\
    \ new Object();\n  newCust.name = myName;\n  newCust.yearOfBirth = myYearOfBirth;\n\
    \  newCust.getCustomerInfo = function () {\n    return 'Customer: ' + this.name\
    \ + ' ' + this.yearOfBirth;\n  };\n  return newCust;\n}\n```\n这段代码动态创建了一个对象 `newCust`。可以通过以下方式创建多个实例：\n\
    ```javascript\nvar cust1 = getCustomer('Alex', 1978);\nvar cust2 = getCustomer('David',\
    \ 1986);\n```\n尽管 JavaScript 不支持特定的 `class` 关键字，但可以使用上述方法模拟类。\n\n#### 命名空间\n实现命名空间没有特定的\
    \ `namespace` 关键字。然而，可以使用类和对象的概念来实现。如果你将变量和方法分类到对象并作为这些对象的实例访问它们，那么你就将这些对象的名称放在全局命名空间中，并将变量的作用范围限制在它们所属的对象中。\n\
    \n#### 实现继承\n通过创建对象并根据它们的共同特征对对象进行分类，可以在 JavaScript 中定义对象之间的“是”关系。例如，如果你正在为公司的员工实现一个对象。你可以为特定类型的对象创建对象，如\
    \ `managerTechnical`、`managerGeneral`、`technicalStaff`、`recruitmentStaff` 和 `officeStaff`，然后将它们分类为对象\
    \ `technicalStaff`（包含 `managerTechnical` 和 `technicalStaff` 对象）以及 `adminStaff`（包含\
    \ `managerGeneral`、`recruitmentStaff` 和 `officeStaff`）。以类似的方法，也可以定义新函数。\n"
- fmt: "\n`JQuery` is a library of browser-compatible helper functions, which you\
    \ can use in your code to minimize the efforts required for typing, implementation\
    \ and testing. These functions are essentially written in JavaScript. Therefore,\
    \ you can also call `jquery`, a JavaScript library.\n\nThe list of functionalities\
    \ that are available in `jQuery` include:\n- `Attributes`: which is a group of\
    \ methods that can be used for getting and setting attributes of the DOM elements.\n\
    - `Ajax`: which a group of methods that provide support for synchronous and asynchronous\
    \ server calls.\n- `Core Methods`: are the fundamental `jQuery` functions.\n-\
    \ `Callbacks` object: an object provided for management of callbacks.\n- `Data\
    \ Methods`: methods that facilitate the creation of association between DOM elements\
    \ and arbitrary data.\n- `CSS Methods`: methods that can be used for getting and\
    \ setting CSS-related properties.\n- `Dimensions`: methods that can be used for\
    \ accessing and manipulating the dimensions of DOM elements.\n- `Deferred` object:\
    \ an object that is capable of registering multiple callbacks while maintaining\
    \ the data of state change and propagating the same from one callback to the next.\n\
    - `Forms`: methods that are used for controlling form-related controls.\n- `Traversing`:\
    \ a group of methods that provide support for traversing the DOM.\n- `Effects`:\
    \ methods that can be used for creating animations for your webpage.\n- `Events`:\
    \ methods used to perform event-based execution.\n- `Selectors`: methods that\
    \ can be used for accessing elements of DOM in CSS selectors.\n- `Offset`: methods\
    \ that are used to position the DOM elements.\n- `Utilities`: which is a group\
    \ of utility methods.\n\nBefore getting to use `jQuery`, you will need to include\
    \ it into your project. Once you have installed it and you are ready to use it\
    \ to your project, the next step is to learn how to use it.\n\nFirst things first,\
    \ you need to reference the `jQuery` library on the webpage that needs to use\
    \ it in the following manner:\n\n```html\n<script type=\"text/javascript\" src=\"\
    Scripts/qunit.js\"></script>\n<script src=\"Scripts/jquery-1.8.2.js\"></script>\n\
    ```\n\nThe next thing to know is that the `jQuery` code that you are hoping to\
    \ use in your HTML page lies in the `jQuery` namespace, which has an alias `$.`.\
    \ Therefore, you can write either `jQuery.jFeature` or `$.jFeature` when referring\
    \ to a feature of `jQuery`.\n\nBefore, you can start using it in your webpages,\
    \ you will also need to change the `default.js` file as follows:\n\n```javascript\n\
    function initialize() {\n    txtInput = $('#txtInput');\n    txtResult = $('#txtResult');\n\
    \    clear();\n}\n```\n\nThis allows you to use `jQuery` and CSS selectors by\
    \ matching them using their IDs.\n\nAlso, as you move ahead with coding using\
    \ `jQuery`, remember to refresh the screen using `Ctrl+F5` after making any changes\
    \ as the browser may not be able to catch the JavaScript modification right away.\
    \ Moreover, use `jQuery` objects as much as possible because the cross-browser\
    \ compatibility that they offer.\n\nA DOM object can be referenced from a `jQuery`\
    \ wrapper in the following manner: `var domElement = $('#txtInput')[0];`.\n\n\
    Here is a simple code that checks if the element exists before referencing it:\n\
    \n```javascript\nvar domElement;\nif($('#txtInput').length > 0){\n    domElement\
    \ = $('#txtInput')[0];\n}\n```\n\n### How to Create a jQuery wrapper for Referencing\
    \ a DOM element\n\nA `jQuery` wrapper can be created from a DOM element reference\
    \ in the following manner: `var myDoc = $(document);`, `var inText = $(this).text();`.\n\
    \nThe first statement assigns the wrapped object to the variable. On the other\
    \ hand, the second statement wraps the object referenced using `this`.\n\n###\
    \ How to Add Event Listeners\n\n`jQuery` provides the `.on` method for subscribing\
    \ to events. Besides this, you can unsubscribe using the `.off` method. These\
    \ methods can be used in the following manner:\n\n```javascript\n$('#btnSubmitInfo').on('click',\
    \ onSubmit);\n$('#btnSubmitInfo').off('click', onSubmit);\n```\n\n### How to Trigger\
    \ Event Handlers\n\n`JQuery` provides triggers or the method `triggerHandler`,\
    \ for triggering event handlers or handler code execution. This can be done in\
    \ the following manner:\n\n```javascript\n$('#btnSubmitInfo').triggerHandler('click');\n\
    ```\n\n### Initialization Code\n\nYou will often be faced with the requirement\
    \ to run an initialization code upon the loading of an HTML document. You can\
    \ do this using `jQuery` in the following manner:\n\n```html\n<script>\n$(document).ready(function\
    \ () {\n    initializationFunction();\n});\n</script>\n```\n\nThis can be placed\
    \ at the bottom of the HTML document. It will call the `initializationFunction`.\n\
    \n## CHAPTER 7: FORMS\n\nIn the previous chapters, you have already studied how\
    \ HTML documents can be created and manipulated. Taking a lead from them, we can\
    \ now move on to understanding forms, which is one of the most crucial and commonly\
    \ used units of content in webpage development.\n\nSimply, a form is a way in\
    \ which data is collected and sent to a location where it can be processed, which\
    \ is a server in most cases. However, since we are yet to discuss server side\
    \ scripting, we will focus on sending the data to an email address. However, it\
    \ is important to note that we do not recommend this practice and it is used only\
    \ for understanding purposes.\n\n### Web Communications\n\nBefore moving to the\
    \ working of forms, it is important to know some basics of HTTP. A typical web\
    \ communication consists of the following activities:\n1. When a user browses\
    \ a webpage, a request for access to a web server resource is initiated by sending\
    \ a `GET` HTTP request.\n2. The request is processed by the server and sends a\
    \ response to the browser using HTTP protocol.\n3. The browser process the server\
    \ response and presents it to the user in the form of a ‘form’.\n4. The user enters\
    \ inputs to the form and upon hitting the submit or enter button, this data is\
    \ sent to the server, using HTTP protocol.\n5. This data is again processed by\
    \ the server and the server posts its response to the browser, which is displayed\
    \ on the webpage.\n\n### Web Servers\n\nOriginally, web servers were designed\
    \ to receive and process requests and send the results back to the browser using\
    \ HTTP. Initially, when the web pages were simple, such web servers were able\
    \ to process a good number of requests per unit time. There were no states involved\
    \ as sending and receiving requests were as simple as opening a connection, transferring\
    \ data and closing the connection.\n\nThe new age web servers are much more equipped\
    \ that these simple web servers. The web servers of today implement what is called\
    \ the ‘keep alive’ features, which ensures that the connection remains open for\
    \ a definite period of time in which subsequent requests by the same browser can\
    \ be entertained.\n\n### Web Browsers\n\nThe web browser is a desktop application,\
    \ which displays web pages and manages user interactions between the webpages\
    \ and the server. The communication between the web servers and pages is established\
    \ using technologies like AJAX and Asynchronous JavaScript.\n\n### How is Data\
    \ Submitted to the Web Server\n\nAn HTML form can be created using the `<form>`\
    \ element in the following manner:\n\n```html\n<form method=\"post\" action=\"\
    getCustomerInformation.aspx\" >\n    Customer Number:\n    <input type=\"text\"\
    \ name=\"Number\" />\n    <input type=\"submit\" value=\"Get Customer Information\"\
    \ />\n</form>\n```\n\nThis form takes in the customer number and returns a page\
    \ that displays the details of the customer.\n\nHowever, it is important to note\
    \ that not all elements can be used for submitting data in a form. The allowed\
    \ elements for this purpose are:\n- `<textarea>`: It takes a multi-line input.\n\
    - `<button>`: It is a clickable button, which can be placed on any content or\
    \ image.\n- `<select>`: It is a drop-down list, which allows multiple selections.\
    \ The selected options can be identified using jQuery: `$('option:selected')`.\n\
    - `<input type='checkbox'>`: It is a checkbox, which has a value attribute used\
    \ for setting as well as reading the status of the checkbox. The jQuery for identifying\
    \ checked checkboxes is: `$('input[type=checkbox]:checked')`.\n"
