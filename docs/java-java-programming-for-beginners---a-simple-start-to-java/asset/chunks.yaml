    \ `init` 策略后自然会被调用。同样，当客户端在离开其他页面后返回包含 applet 的页面时，该方法会被调用。\n- `stop`：该方法在客户端离开\
    \ applet 所在的页面时随之调用。因此，它可以在同一个 applet 中被反复调用。\n- `destroy`：该技术仅在程序关闭时被调用。由于 applet\
    \ 设计用于运行在 HTML 页面上，在客户端离开包含 applet 的页面后，你不应该经常释放资源。\n- `paint`：该方法在 `start()`\
    \ 方法之后立即被调用。此外，每当程序中 applet 需要重绘自己时，都需要调用此方法。`paint()` 方法继承自 `java.awt`。\n\n###\
    \ 一个“Hello, World”Applet\n\n下面是一个名为 `BasicApplet.java` 的基础 applet：\n\n```java\n\
    import java.applet.*;\nimport java.awt.*;\n\npublic class BasicApplet extends\
    \ Applet {\n    public void paint (Graphics gx) {\n        gx.drawstring (“Say\
    \ Hello To The World!”, 35, 70);\n    }\n}\n```\n\n这些 import 将类引入到我们的 applet 类范围内：`java.awt.graphics`、`java.applet.applet`。\n\
    \n没有这些 import ，Java 编译器将无法识别 applet 类引用的 `Applet` 和 `Graphics` 类。\n\n### Applet\
    \ 类\n\n每个 applet 都是 `java.applet.applet` 类的扩展。基础 `Applet` 类提供了特定的 `Applet` 类可以调用的方法来从程序连接中获取数据和管理。这些包含了以下操作的方法：\n\
    \n- 获取 applet 的参数\n- 获取包含 applet 的 HTML 记录的系统区域\n- 获取 applet 类注册表的系统区域\n- 在程序中打印状态消息\n\
    - 获取图片\n- 获取声音\n- 播放声音\n- 执行 applet 的尺寸调整\n\n此外，`Applet` 类提供了一个接口，视图或程序可以通过它获取有关\
    \ applet 的数据并控制 applet 的执行。视图可以：\n\n- 请求有关 applet 表单、创建者版权的数据\n- 请求 applet 感知参数的描述\n\
    - 执行 applet 初始化\n- 执行 applet 销毁\n- 开始 applet 的执行\n- 停止 applet 的执行\n\n`Applet`\
    \ 类允许这些每个方法的默认用法。这些执行可以根据需要重写。“Say Hello To The World!”applet 本身是完整的。但作为实现的一部分，只重写了\
    \ `paint()` 函数。\n\n初学者 jQuery、JavaScript 和 HTML5 入门教程\n*软件工程师编写*\n作者 Scott Sanderson\n\
    \n## 目录\n\n- [第 1 章：引言](https://docs.google.com/document/d/1PEmpr_dft0fjFxGmZpN0Vk8E1eNfbwhMsOYisITJptw/edit#heading=h.2xcytpi)\n\
    - [第 2 章：HTML5 基础](https://docs.google.com/document/d/1PEmpr_dft0fjFxGmZpN0Vk8E1eNfbwhMsOYisITJptw/edit#heading=h.1ci93xb)\n\
    - [第 3 章：JavaScript 基础](https://docs.google.com/document/d/12YBHe7wYK07gdt9Lpl8LCpRyx2SVBnKprZK1EWgMM/edit#heading=h.3whwml4)\n\
    - [第 4 章：CSS3 基础](https://docs.google.com/document/d/12YBHe7wYK07gdt9Lpl8LCpRyx2SVBnKprZK1EWgMM/edit#heading=h.2bn6wsx)\n\
    \n"
- fmt: "\n# HTML (Hyper Text Markup Language) is a language used for creating web\
    \ pages. In fact, this language has been in use since the first webpage was made.\
    \ However, the functionality has evolved as newer and better versions of the language\
    \ were introduced.\n\nThe language is known to have originated from `SGML` (Standard\
    \ Generalized Markup Language), which was earlier used for document publishing.\
    \ HTML has inherited the concept of formatting features and their syntax from\
    \ `SGML`.\n\nOne of the most interesting and beneficial facet of HTML usage, as\
    \ far as browsers are concerned, is that browsers support both backward as well\
    \ as forward compatibility. While backward compatibility is usually easy to achieve,\
    \ forward compatibility is tricky as the problem domain, in this case, is infinitely\
    \ large. However, in order to implement this, browsers were designed to ignore\
    \ tags that it did not recognize.\n\nFor years, HTML remained all that people\
    \ wanted. However, with time, people felt the need for more, which was catalyzed\
    \ by the presence of another technology called `XML` (eXtensible Markup Language).\
    \ Although, `XML` shares a lot of similarities with `HTML`, there exist many fundamental\
    \ differences between the two. Firstly, `XML` requires tag matching in the sense\
    \ that for every starting tag, a closing tag must inevitably exist.\n\nBesides\
    \ this, `XML` allow you to create your own tags as it does not possess a fixed\
    \ set of tags like `HTML`.\n\nThe tags used in `XML` are meta-tags or tags that\
    \ describe the data that is included between the starting and closing tag. In\
    \ order to ensure the validity of the `XML` document, a technology called `XSD`\
    \ (XML Schema Definition) is used. However, this technology cannot be used for\
    \ validating `HTML` documents because `HTML` documents lack a well-defined structure.\n\
    \nThe `W3C` (World Wide Web Consortium) introduced `XHTML` as an attempt to fix\
    \ the flaws of `HTML`. According to the `XHTML` specification, `HTML` documents\
    \ were forced to adhere to the format specifications used for `XML`. Therefore,\
    \ this allowed the use of `XSD` tools for validation of `HTML` documents. Although,\
    \ the integration of `XML` in the framework fixed some issues, some issues continued\
    \ to crop up. One of the staggering issues of the modern times was the growing\
    \ need for integration of multimedia. While `CSS` did perform formatting of some\
    \ level, it was becoming inadequate for the growing demands of users.\n\nIn order\
    \ to provide support for interactivity and animated visuals, a programmable support\
    \ called `JavaScript` was added to this ensemble. However, initial versions of\
    \ this support were difficult for programmers to understand and slow on execution\
    \ time incurred. This led to the introduction of plug-ins like `Flash` to get\
    \ the attention that it did. These plugins did what was expected of them, but\
    \ the browser-multimedia integration was still loose in nature.\n\n`HTML5` is\
    \ not an evolved form of `XHTML`. On the contrary, `HTML5` can be better described\
    \ as the reinvented form of `HTML 4.01` and how `HTML`, `CSS` and `JavaScript`\
    \ can be used together to solve the growing needs of the user base.\n\n## Semantic\
    \ Markup\nThe fundamental feature of `HTML5` is that it stresses on separation\
    \ of behaviour, presentation and structure. The semantic markup of a website development\
    \ specifies the structure of the document. In other words, it specifies the meaning\
    \ of tags and what they will do for you. On the other hand, behaviour and presentation\
    \ are governed by `CSS` and `JavaScript` respectively.\n\n## HTML5 Elements\n\
    In `HTML`, an element is simply a statement that contains a beginning tag, content\
    \ and a closing tag. Therefore, when you write,\n\n```html\n<div>\n  <b>This is\
    \ my world!</b>\n</div>\n```\n\nIn this example, the `div` elements includes everything\
    \ from `<div>` to `</div>`. therefore, the `<b><b></b>` tag is also a part of\
    \ the `div` element.\n\nIt is important to state here that `HTML5` is not case\
    \ sensitive. Therefore, regardless of whether you write `<B>` or `<b>` for the\
    \ bold tag, the browser will consider the two same.\n\nHowever, the use of lower\
    \ case for tags is recommended by the `W3C` standards.\n\n## Working with Elements\
    \ in HTML5\n`HTML5` defines more than a 100 elements. These elements, with their\
    \ definitions are provided in Appendix.\n\n### How to add attributes to elements?\n\
    Additional data can be added to the begin tag in the form of attributes. An attribute\
    \ can be generally represented as, `name=”value”`. The value for the attribute\
    \ `name` is enclosed within quotes. There is no restriction on the number of attributes\
    \ that can be added to the begin tag. For these attributes, the attribute has\
    \ a name, but it does not have a value.\n\nExample:\n```html\n<div id=”main” class=”mainContent\"\
    ></div>\n```\n\nHere, `id` and `class` are attributes where `id` uniquely identifies\
    \ the element and `class` specifies the CSS style to which this `div` belongs.\n\
    \n### Boolean Attributes\nSeveral types of attributes can be used. One of the\
    \ most commonly used types is Boolean attribute. The Boolean attribute can take\
    \ a value from the allowable set of values. Some possible values include:\n- Checked\n\
    - Disabled\n- Selected\n- Readonly\n\nThere are two ways to indicate the value\
    \ of a Boolean attribute.\n\n```html\n<input type=“checkbox” name=“vegetable”\
    \ value=“Broccoli” checked=” />\n<input type=“checkbox” name=“vegetable” value=“Broccoli”\
    \ checked='checked' />\n```\nIn the first case, the value is not given and is\
    \ assumed. Although, the latter seems like a redundant form, it is the more preferred\
    \ form, particularly if you are using `jQuery`.\n\n### Global Attribute Reference\n\
    There is a set of named attributes available in `HTML5`, which can be used with\
    \ any element. Examples of these attributes include `accesskey`, `spellcheck`\
    \ and `draggable`, in addition to several others.\n\n### Void Elements\nSome elements\
    \ do not have to contain content under any circumstance. These elements include\
    \ `<link>`, `<br>` and `<area>`, in addition to many others.\n\n### Self-closing\
    \ Tags\nIf you are using an element that does not contain any content, then you\
    \ can use a self closing tag. An example of this tag is `<br/>`. However, please\
    \ note that other tags like `<div>` have to be written as `</div>` even if they\
    \ do not have content.\n\n### How to Add Expando Attributes\nAny attribute that\
    \ you as author define is known as expando attribute. You can give this custom\
    \ attribute a name and assign a value to the same as when required.\n\n### How\
    \ to Add Comments\nComments can be added using a `!` and two hyphens (`--`). The\
    \ syntax for adding comments is as follows: `<!--text-->`.\n\nYou can also add\
    \ conditional comments using the following syntax:\n`<![if IE 7]><html class=\"\
    no-js ie6\" lang=\"en\"><![endif]> This comment determines if the browser being\
    \ used is an earlier version released than IE7.\n\n## How to Create HTML Document\n\
    An HTML document can simply be described as a frame that contains metadata, content\
    \ and a structure.\n\nThe HTML document must start with the tag `<!DOCTYPE html>`.\
    \ In `HTML5`, the declaration is an indication to the browser that it should work\
    \ in no-quirks mode or HTML5 compliant mode.\n\nThe next tag should be `<html>`.\
    \ This element includes within itself the elements `<head>` and `<body>`. The\
    \ `<head>` element can contain the metadata for the HTML document, which is declared\
    \ and defined using the `<meta>` tag. The `<head>` element also contains the `<title>`\
    \ element, which serves the following purposes:\n- Used by search engines\n- This\
    \ content is displayed in the browser toolbar\n- Gives a default name to the page\n\
    \nThe `<body>` element includes any other information that is to be displayed\
    \ on the HTML document. A sample HTML document is given below:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\" />\n  <title>TITLE OF DOC</title>\n\
    </head>\n<body>\n  CONTENT\n</body>\n</html>\n```\n\nNote:\n1. Special character\
    \ like `>` or `<`, which are a part of the HTML syntax, can be used on the HTML\
    \ doc using their name or number. The syntax for their usage is: `&entity_name;`\
    \ or `&entity_number;`\n\nThe appendix contains the table of entity names and\
    \ numbers to be used.\n"
  raw: 'HTML (Hyper Text Markup Language) is a language used for creating web pages.
    In fact, this language has been in use since the first webpage was made. However,
    the functionality has evolved as newer and better versions of the language were
    introduced.


    The language is known to have originated from SGML (Standard Generalized Markup
    Language), which was earlier used for document publishing. HTML has inherited
    the concept of formatting features and their syntax from SGML.


    One of the most interesting and beneficial facet of HTML usage, as far as browsers
    are concerned, is that browsers support both backward as well as forward compatibility.
    While backward compatibility is usually easy to achieve, forward compatibility
    is tricky as the problem domain, in this case, is infinitely large. However, in
    order to implement this, browsers were designed to ignore tags that it did not
    recognize.


    For years, HTML remained all that people wanted. However, with time, people felt
    the need for more, which was catalyzed by the presence of another technology called
    XML


    (eXtensible Markup Language). Although, XML shares a lot of similarities with
    HTML, there exist many fundamental differences between the two. Firstly, XML requires
    tag matching in the sense that for every starting tag, a closing tag must inevitably
    exist.


    Besides this, XML allow you to create your own tags as it does not possess a fixed
    set of tags like HTML.


    The tags used in XML are meta-tags or tags that describe the data that is included
    between the starting and closing tag. In order to ensure the validity of the XML
    document, a technology called XSD (XML Schema Definition) is used. However, this
    technology cannot be used for validating HTML documents because HTML documents
    lack a well-defined structure.


    The W3C (World Wide Web Consortium) introduced XHTML as an attempt to fix the


    flaws of HTML. According to the XHTML specification, HTML documents were forced
    to adhere to the format specifications used for XML. Therefore, this allowed the
    use of XSD tools for validation of HTML documents. Although, the integration of
    XML in the framework fixed some issues, some issues continued to crop up. One
    of the staggering issues of the modern times was the growing need for integration
    of multimedia. While CSS did perform formatting of some level, it was becoming
    inadequate for the growing demands of users.


    In order to provide support for interactivity and animated visuals, a programmable
    support called JavaScript was added to this ensemble. However, initial versions
    of this support were difficult for programmers to understand and slow on execution
    time incurred. This led to the introduction of plug-ins like Flash to get the
    attention that it did. These plugins did what was expected of them, but the browser-multimedia
    integration was still loose in nature.


    HTML5 is not an evolved form of XHTML. On the contrary, HTML5 can be better described
    as the reinvented form of HTML 4.01 and how HTML, CSS and JavaScript can be used
    together to solve the growing needs of the user base.


    **Semantic Markup**


    The fundamental feature of HTML5 is that it stresses on separation of behaviour,
    presentation and structure. The semantic markup of a website development specifies
    the structure of the document. In other words, it specifies the meaning of tags
    and what they will do for you. On the other hand, behaviour and presentation are
    governed by CSS and JavaScript respectively.


    **HTML5 Elements**


    In HTML, an element is simply a statement that contains a beginning tag, content
    and a


    closing tag. Therefore, when you write,


    <div>


    <b>This is my world!</b>


    </div>


    In this example, the div elements includes everything from <div> to </div>. therefore,
    the


    <b></b> tag is also a part of the div element.


    It is important to state here that HTML5 is not case sensitive. Therefore, regardless
    of whether you write <B> or <b> for the bold tag, the browser will consider the
    two same.


    However, the use of lower case for tags is recommended by the W3C standards.


    **Working with Elements in HTML5**


    HTML5 defines more than a 100 elements. These elements, with their definitions
    are provided in Appendix.


    ***How to add attributes to elements?***


    Additional data can be added to the begin tag in the form of attributes. An attribute
    can be generally represented as, name=”value”. The value for the attribute name
    is enclosed within quotes. There is no restriction on the number of attributes
    that can be added to the begin tag. For these attributes, the attribute has a
    name, but it does not have a value.


    Example:


    <div id=”main” class=”mainContent”></div>


    Here, id and class are attributes where id uniquely identifies the element and
    class specifies the CSS style to which this div belongs.


    ***Boolean Attributes***


    Several types of attributes can be used. One of the most commonly used types is
    Boolean


    attribute. The Boolean attribute can take a value from the allowable set of values.
    Some possible values include:


    Checked


    Disabled


    Selected


    Readonly


    There are two ways to indicate the value of a Boolean attribute.


    <input type=“checkbox” name=“vegetable” value=“Broccoli” checked=” />


    <input type=“checkbox” name=“vegetable” value=“Broccoli” checked=‘checked’ />
    In the first case, the value is not given and is assumed. Although, the latter
    seems like a redundant form, it is the more preferred form, particularly if you
    are using jQuery.


    ***Global Attribute Reference***


    There is a set of named attributes available in HTML5, which can be used with
    any element. Examples of these attributes include accesskey, spellcheck and draggable,
    in addition to several others.


    ***Void Elements***


    Some elements do not have to contain content under any circumstance. These elements
    include <link>, <br> and <area>, in addition to many others.


    ***Self-closing Tags***


    If you are using an element that does not contain any content, then you can use
    a self closing tag. An example of this tag is <br/>. However, please note that
    other tags like


    <div> have to be written as <div></div> even if they do not have any content.


    ***How to Add Expando Attributes***


    Any attribute that you as the author define is known as expando attribute. You
    can give this custom attribute a name and assign a value to the same as and when
    required.


    ***How to Add Comments***


    Comments can be added using a ! and two hyphens (-). The syntax for adding comments
    is as follows:


    <!—text —>


    You can also add conditional comments using the following syntax:


    <!—[if lte IE 7]> <html class=“no-js ie6” lang=“en”> <![endif]—> This comment
    determines if the browser being used is an earlier version released earlier than
    IE7.


    **How to Create HTML Document**


    An HTML document can simply be described as a frame that contains metadata, content
    and a structure.


    The HTML document must start with the tag <!DOCTYPE html>. In HTML5, the declaration
    is an indication to the browser that it should work in no-quirks mode or HTML5
    compliant mode.


    The next tag should be <html>. This element includes within itself the elements
    <head> and <body>. The <head> element can contain the metadata for the HTML document,
    which is declared and defined using the <meta> tag. The <head> element also contains
    the


    <title> element, which serves the following purposes: Used by search engines


    This content is displayed in the browser toolbar


    Gives a default name to the page.


    The <body> element includes any other information that is to be displayed on the
    HTML


    document.


    A sample HTML document is given below:


    <!DOCTYPE html>


    <html>


    <head>


    <meta charset=“utf-8” />


    <title>TITLE OF DOC</title>


    </head>


    <body>


    CONTENT


    </body>


    </html>


    Note:


    1\. Special character like ‘>’ or ‘<’, which are a part of the HTML syntax, can
    be used on the HTML doc using their name or number. The syntax for their usage
    is:


    &entity_name or &entity_number


    The appendix contains the table of entity names and numbers to be used.'
