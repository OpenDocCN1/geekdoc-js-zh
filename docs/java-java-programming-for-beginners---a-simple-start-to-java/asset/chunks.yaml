    2. White space created using tabs, line breaks and spaces is normalized by HTML
    into a single space. Therefore, if you want to use multiple spaces, you must use
    the non-breaking space character. For example, if you want to display 10 mph such
    that `10` and `mph` are not separated by a newline, you can write `10 &nbsp;mph`.


    ## How to Embed Content


    Now that you know how to create HTML documents with your content, you may want
    to embed content into the document from other sources. This content may be text
    from another HTML document or flash applications.


    ### Inline Frames


    Inline frames are used to embed HTML documents inline with the content of the
    current HTML document. Therefore, in a way, this element creates nested browsers
    as multiple web page are loaded in the same window. These are implemented using
    the `<iframe>` element. Nested browsing contexts can be navigated using:


    - `window.parent` – This `WindowProxy` object represents the parent browsing context.

    - `window.top` – This `WindowProxy` object represents the top-level browsing context
    window.

    - `window.frameElement` – This represents the browsing context container and if
    there is no context container, it returns null.


    The syntax of the `<iframe>` element is as follows:


    ```html

    <iframe src=“name”></iframe>

    ```


    Here the name of the attribute defines the name of the browsing context. This
    name can be any string like `‘sample.html’`. However, the strong should not start
    with an underscore as names starting with underscore are reserved for special
    key names like `_blank`.


    ### Sandboxing


    Sandboxing is used for avoiding the introduction of pop-ups or any other malware
    in your HTML document. In order to implement this, the attribute `sandbox` is
    used. You can use this attribute in the following manner:


    ```html

    <iframe sandbox=”keywords” src=“name”></iframe

    ```


    When you use sandboxing, several restrictions are imposed on the called context.
    These restrictions include disabling forms, scripts, plugins and any frame other
    than itself. You can force the system to override these restrictions using keywords
    like:

    - `allow-same-origin`

    - `allow-scripts`

    - `allow-forms`

    - `allow-top-navigation`


    Multiple keywords can be used by separating them using a space.


    ### Seamless Embedding


    The `seamless` attribute can be used in the `<iframe>` element for embedding of
    content in a manner than this content appears to be part of the main content.
    This attribute can be used in the following manner:


    ```html

    <iframe seamless=”” src=“name”></iframe>

    <iframe seamless src=“name”></iframe>

    <iframe seamless=“seamless” src=“name”></iframe>

    ```


    This attribute may not be supported by many browsers. Therefore, you can use CSS
    to achieve a similar effect.


    ### Hyperlinks


    Hyperlinks can be implemented using the `<a>` element. This element can be used
    to link both external (a different HTML document) as well as internal (another
    location in the same HTML document) links.


    All links are underlined and depending upon the nature of the link, the colour
    of the link changes.

    - Blue - Unvisited link

    - Purple - Visited link

    - Red - Active link


    The first attribute of the `<a>` element is `href`, which is given the value of
    the URL.


    Syntax for external links:

    ```html

    <a href=”address”>Text</a>

    ```


    Syntax for internal links:

    ```html

    <a href=”#id”>Text</a>

    ```


    The `id` here is the `id` of the tag to which you want the link to jump onto.
    However, if you use only the `#` value, the link jumps to the top of the page.


    The other attribute used with the `<a>` element is `target`, which allows you
    to control the behaviour of the link. For instance, if you want the link to open
    in another window, then this requirement can be specified using this attribute.
    The following can be used:

    - `_blank`: This opens the link in a new browser window.

    - `_parent`: This opens the link in the parent window.

    - `_self`: This opens the link in the current window and is the default setting.

    - `_top`: This opens the link in the topmost frame of the current window.

    - `_iframe_name`: This opens the link in the `<iframe>` element of the specified
    name. This is generally used in menus.


    Hyperlinks can also be used to send emails using the following syntax:


    ```html

    <a href=“mailto:email address”>Text</a>

    ```


    When the user clicks on the link, an email will be sent to the specified email
    address.


    ## Embedding Images


    The `<img>` element is used for adding images to the HTML document. The `<img>`
    tag is a void element and does not require a closing tag.


    The required tag for this element is `src`, which specifies the absolute or relative
    address at which the image is stored. Another attribute than can be used with
    the `<img>` tag is `target`, which is used to specify the text that must be displayed
    in case the image is not available.


    Syntax:

    ```html

    <img src=”address” target=”alternative text”>

    ```


    It is important to note that you only give references to images and they are not
    embedded into the HTML document, in actuality. The allowed image formats are `jpeg`,
    `svg`, `png` and `gif`.


    ### How to Create Image Map


    The `<map>` element can be used to create a clickable image map. In order to create
    a link between the map and image, you must set a `name` of the map and use this
    name in the `usemap` attribute of the `img` tag.


    The area of the map element is defined using `<area>` element. This is a self-closing
    tag that is used to define the area of the map. The area of the map can be set
    using the attributes `shape`, `href`, `alt` and `coords`.


    The `shape` attribute can be give the values `poly`, `circle`, `rect` or `default`.
    The default value sets the area as the size of the image. The `href` and `alt`
    attributes are used in the same manner as the `<a>` element. Lastly, the `coords`
    attribute are defined according to the shape chosen:

    - `poly`: `x, y, x, y`

    - `circle`: `x, y, radius`

    - `rect`: `x, y, x, y`


    For the polygon, the starting and ending coordinates should be the same. In case
    a discrepancy in this exists, a closing value is added.


    Example:

    ```html

    <img src=”worldmap.gif” width=“145” height=“126” alt=“World Map” usemap=”#country”
    />

    <map name="country”>

    <area shape=”circle” coords=”105,50,30” href=”China.html” alt=”China” />

    <area shape=”default” href=”InvalidCountry.html” alt=”Please Try Again” />

    </map>

    ```


    ## Embedding Plug-ins


    Plugins can likewise be embedded into HTML documents using `<embed>` and `<object>`
    elements. Although, both these elements perform similar tasks, they were created
    by different browsers. As a result, they coexist in HTML5. While the `<embed>`
    element provides ease of use, the `<object>` element provides more functionality
    to the user. Syntax for these two elements is given below:


    ### The <embed> tag


    ```html

    <embed src=“Flash.swf”> </embed>

    ```


    The `src` attribute specifies the url or address of the file to be embedded. Other
    attributes that are taken by the `<embed>` element includes:

    - `type`: used to specify the MIME type of the content.

    - `height`: used to specify the content height in pixels.

    - `width`: used to specify the content width in pixels.


    As mentioned previously, some browsers may not support `<embed>` element. Therefore,
    if you are using it in your document, you must add fallback content specification.
    For instance, if you are embedding a flash file, you must redirect the user to
    the download link of flash player if the browser does not support it already.


    You can do this in the following manner:


    ```html

    <embed src=“Flash.swf” >

    <a href=“link for downloading flash player”>

    <img src=”address of the image for download flash player” alt=“Download Adobe
    Flash player” />

    </a>

    </embed>

    ```


    ### The <object> tag


    The `<object>` tag allows you to embed a variety of multimedia files like video,
    audio, PDF, applets and Flash. The element accepts the following attributes:

    - `type`: used to specify the MIME type of data.

    - `form`: used to specify the form id or ids of the object.

