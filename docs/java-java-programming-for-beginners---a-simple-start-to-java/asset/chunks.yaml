    **CHAPTER 1: INTRODUCTION**


    If there is one application development framework that can be termed as comprehensive,
    then HTML5 wins the bid hands down. Although, the specification for HTML5 is not
    yet complete, most modern web browsers support the popular features on device,
    which range from a Smartphone to a desktop. What that means is that you just have
    to write one application and it will run on your devices without any interoperability
    issues.


    There is no doubt about the fact that HTML5 is the future of web application development
    and if you wish to remain in the league, you need to think futuristically and
    equip yourself to deal the technological challenges that the future is about to
    throw at you. The scope of HTML5 is evident from the fact that most of the major
    players of the industry and setting their eyes on this technology and giving in
    full support to the same.


    If the multi-faceted functionality and high-on features characteristics of HTML5
    intrigue you and you want to start writing your own applications right away, but
    you do not know how and where to begin, then this book is just for you. This book
    covers everything that you shall require to create working applications with the
    help of HTML, JavaScript/JQuery and CSS. However, it is not a reference guide.
    We hope to give you practical knowledge so that you can get to development as
    quickly as possible.


    This book is a perfect start-up guide and covers all the basic facets of HTML5,
    JavaScript and CSS development. It covers everything from the very basics to all
    that you shall require in your tryst with this framework. The first three chapters
    introduce you to these three technologies, giving you some ground to start with.


