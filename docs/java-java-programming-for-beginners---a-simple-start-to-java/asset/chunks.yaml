  trans: "\n\n这定义了网站特定的内容，这些内容预计不会在不同网页之间发生变化，例如页眉。\n\n`application`\n这定义了指定的区域是一个\
    \ Web 应用程序。\n\n`contentinfo`\n这定义了网页中包含的关于网页的信息，例如版权信息。这些信息大部分是页脚内容的一部分。\n\n`complementary`\n\
    这定义了页面中的一个区域，该区域在脱离页面时也具有意义。\n\n`main`\n使用此子角色类来定义网页的主要内容。\n\n`form`\n这定义了网页中预期接收网页输入的区域。\n\
    \n`search`\n此子角色类用于定义网页上用于获取用户搜索查询并显示搜索结果的位置。\n\n`navigation`\n包含导航链接的区域是此子角色类的一部分。\n\
    \n这些角色可以用于提供语义化。然而，HTML5 包含的新元素本身就具有语义。尽管如此，某些某些 HTML5 中无法提供的实用工具，对于这些工具，可以使用\
    \ `role` 属性。\n\n### 如何使用 `<div>` 元素控制格式？\n\n如前所述，“<div>` 元素本质上是不可见的，不会为元素提供任何语义。然而，如果你只想将其用于格式化目的，那么它是实现此目的的完美选择。\n\
    \n### 如何添加主题分隔符？\n\n可以使用空元素 `<hr/>` 来添加主题分隔符，它用于表示从一组内容到另一组内容的过渡。\n\n### 如何对内容进行注释？\n\
    \n有几个元素可用于注释。这些包括你已经使用了很久的 `<<b>>` 和 `<i>`。然而，除了它们所表示的样式之外，它们现在有了新的含义。例如，`<<b>>`\
    \ 元素表示“**粗体**”（bold）样式。此外，HTML5 增加了“对有特殊关注的文本范围，但语气、重要性级别或含义没有变化”的含义。\n\n虽然在这一语境下使用粗体样式更有意义，但你仍然可以使用此元素来表示评论中的产品名称或关键词。同样，`<<strong>`\
    \ 元素指示内容的相对重要性，而 `<i>` 表示相关内容语气或含义的变化。此外，`<<em>>` 元素用于读者将交替发读的文本。\n\n### 如何使用\
    \ `<abbr>` 处理缩写词和略语？\n\n在 HTML 的之前的版本中，`<acronym>` 元素用于此目的。然而，该元素已过时，用于此目的的新元素是\
    \ `<abbr>`。它是一个内联元素，通常与 `<<em>>` 和 `<<strong>>` 等内联元素一起使用。\n\n### 元素 - `<address>`\n\
    \n此元素用于定义网页所有者或作者的联系信息。\n\n### 引用与引文\n\n你可以使用 `<<blockquote>>` 元素来指示特定文本为引用，它用于长引文，而\
    \ `<q>` 用于行内引用。你可以使用 `cite` 属性或 `<cite>` 元素来提到引用的来源。\n\n然而，在 `<q>` 和 `<<blockquote>>`\
    \ 元素内部使用 `<cite>` 元素被认为是更好的方法。请记住，`<cite>` 元素只能提到作品名称，其他信息元素（如作者姓名和出版地）不包含在内。\n\
    \n### 如何在 HTML5 中记录代码？\n\n有两个元素 `<code>` 和 `<samp>` 用于记录代码。虽然 `<code>` 元素用于记录源代码，而\
    \ `<sample>` 元素用于代码的输出。下面给出了如何操作的 HTML 示例：\n\n```html\n<code class=\"maintainWhiteSpace\"\
    >\nechoContent('Screen’);\n\nfunction echoContent(name)\n{\nalert('This is' +\
    \ name + '.');\n}\n</code>\n\n<samp class=\"maintainWhiteSpace\">\nThis is Screen.\n\
    </samp>\n```\n\n### `<pre>` 元素\n\n在这里需要说明的是，这些元素不会保留空格。因此，需要为此目的实现一个类。该类应该像：`style`\
    \ 规则。\n\n```css\n.maintainWhiteSpace {\n    white-space: pre;\n}\n```\n\n某些浏览器可能不支持此\
    \ `style` 规则。因此，对于此类浏览器，建议使用 `<pre>` 元素。因此，`<pre>` 元素可以定义预格式规则。\n\n### `<var>`\
    \ 元素\n\n此元素用于声明其内部指定的文本是一个变量。例如：\n\n```html\n<p>\n变量 <var>i</var> 代表循环执行的迭代次数。\n\
    </p>\n```\n\n### `<br/>` 和 `<wbr/>` 元素\n\n`<br/>` 元素实现换行。相反，`<wbr/>` 实现单词换行。\n\
    \n### `<dfn>` 元素\n\n有时你可能想要定义一个术语。可以使用 `<dfn>` 元素来实现，它接受标题作为其属性之一。\n\n### 制作图表（Figures）\n\
    \n图像和图表是任何网页内容的不可或缺的一部分。因此，每个图表也可以被视为内容单元，它可能由一个标题和一个指向其所属页面的引用组成。为了定义一个或多个图像，使用了\
    \ `<figure>` 元素。`<figurecaption>` 元素可以用于定义图表。\n\n然而，在这里需要说明，`<figure>` 元素没有赋予图表位置任何重要性，该位置与内容一同包含。然而，如果图表的位置和位置对你很重要，那么你应该考虑使用\
    \ `<<div>>` 元素。\n\n### `<summary>` 和 `<details>` 元素\n\n`<summary>` 元素包含摘要，可以以折叠列表的形式显示，通过\
    \ `<details>` 元素实现。\n\n### 其他注释\n\n除了上述之外，还有一些可用的注释，包括：\n\n- `<s>` 用于删除线文本\n-\
    \ `<u>` 用于下划线\n- `<mark>` 用于高亮文本\n- `<ins>` 用于指示文本已插入\n- `<del>` 用于指示文本已删除\n-\
    \ `<small>` 用于指示文本必须以较小的字体打印\n- `<sub>` 表示文本为下标\n- `<sup>` 表示文本为上标\n- `<time>`\
    \ 用于指示文本表示时间和日期\n- `<kbd>` 用于指示文本为用户输入\n\n### 语言元素\n\n你可能需要在文本中使用中文、日语或韩语来源的字符。为了支持这种包含，可以使用\
    \ `<ruby>` 元素。在此元素内部，其他元素如 `<bdi>` 和 `<bdo>` 用于定义文本的隔离和方向。此外，`<rt>` 和 `<rp>` 元素也可用于在\
    \ `<ruby>` 文本中放置注释或括号。\n\n"
- fmt: "\nelements in this case. The elements of the lists are simply represented\
    \ as bullet points.\n\n### Description Lists\nThis type of a list is declared\
    \ using the `<dl>` element. Using this element, you can give a description containing\
    \ zero or more terms. Besides this, the elements of the list are declared using\
    \ the `<dt>` element, which specifies the term, and `<dd>`, which gives a description\
    \ of the term.\n\n### Custom Lists\nThe developer can make use of CSS styles to\
    \ create custom lists. In this case, a different style rule can be created for\
    \ each level of a nested list.\n\n### Working with Tables\nAnother format for\
    \ arranging and presenting data in webpages is tables. Tables are declared using\
    \ the `<table>` element and represents data in a rows-columns format. The cells\
    \ of the tables are defined using the `<tr>` and `<td>` elements. While `<tr>`\
    \ is used for rows, `<td>` is used for columns.\n\nDespite that fact that HTML5\
    \ tables are one of the most powerful constructs available to the developer, it\
    \ is important to understand how and where tables can be most appropriately used.\
    \ Here are the reasons why tables should not be used: The table created for a\
    \ web page is not rendered until the `</table>` tag is read. On the other hand,\
    \ if the same construct is created using the `<div>` element, the content will\
    \ be rendered as it is read.\n\nTables are extremely difficult to maintain.\n\n\
    Tables are difficult to interpret for accessibility devices.\n\n#### Sample Implementation:\n\
    ```html\n<table>\n<tr>\n<td>Frank</td>\n<td>1978</td>\n</tr>\n<tr>\n<td>David</td>\n\
    <td>1967</td>\n</tr>\n<tr>\n<td>Alex</td>\n<td>1989</td>\n</tr>\n</table>\n```\n\
    \nThe table created above will look like:\nFrank\n1978\nDavid 1967\nAlex\n1989\n\
    \nAs you observe the table, you must have realized that the table is not complete\
    \ unless we define what is called the table headers. This can be done using the\
    \ `<th>` element. You can create table headers both vertically and horizontally.\
    \ For example, we can define the following table header in the code used above.\n\
    \n```html\n<table>\n<tr>\n<th>Name</th>\n<th>Year of Birth</th>\n</tr>\n<tr>\n\
    <td>Franky</td>\n<td>1978</td>\n</tr>\n<tr>\n<td>David</td>\n<td>1967</td>\n</tr>\n\
    <tr>\n<td>Alex</td>\n<td>1989</td>\n</tr>\n</table>\n```\n\nThe resulting table\
    \ for this code will look like this:\nName\nYear of Birth\nFranky 1978\nDavid\n\
    1967\nAlex\n1989\n\nIn the above case, the table headers are simply of a larger\
    \ font size. However, you can style these as you want by style rules. This can\
    \ be done in the following manner:\n```css\nth {\n  background-color: black;\n\
    \  color: white\n}\n```\n\nThis style rule will color the cells of the table headers\
    \ with black color and the text will be written in white.\n\nThe normal behavior\
    \ of most browsers is to automatically place all the `<tr>` elements in the `<tbody>`,\
    \ indicating that this is the body of the table. However, it is a good practice\
    \ to define the `<tbody>` explicitly. Besides this, the `<thead>` and `<tfoot>`\
    \ can also be explicitly defined. The header, body and footer of the table can\
    \ be individually styled using CSS. As a rule, you can have one header element,\
    \ one or more body elements and one footer element.\n\nThe next important content\
    \ feature that must be added to the table created above is the table caption.\
    \ In order to define the table caption, the `<caption>` element is used.\n\nIn\
    \ some cases, you may feel the need to style individual columns. This may seem\
    \ like a difficult task considering the fact that tables are essentially row centric\
    \ in HTML. While you have `<tr>` elements to identify rows, there are no `<tc>`\
    \ elements for identifying columns. The `<td>` element identifies a cell. However,\
    \ you can still style individual columns using the `<colgroup>` or `<col>` elements.\
    \ The `<table>` element can have the `<colgroup>` element, which includes the\
    \ `<col>` elements for columns that are a part of this group of elements. In addition,\
    \ the `<col>` element also has a `span` attribute for defining the columns that\
    \ are a part of this group. A sample implementation to explain how this works\
    \ is given below:\n\n```html\n<colgroup>\n  <col span=\"2\" class=\"vHeader\"\
    \ />\n</colgroup>\n```\n\nThe CSS style rule for styling this group of columns\
    \ can be something like this –\n```css\n.vHeader {\n  color: red;\n}\n```\n\n\
    While the tables discussed till now are regular tables, HTML5 also supports irregular\
    \ tables, which can be described as tables that have a different number of columns\
    \ for each row. The `rowspan` and `colspan` attributes can be used for managing\
    \ the layout of the table.\n\n### CHAPTER 6: JAVASCRIPT AND JQUERY\nYou must have\
    \ got a hang of the power of JavaScript already. In the chapter on JavaScript,\
    \ you have already learnt how to create and adding JavaScript for making web pages\
    \ dynamic. The biggest challenge of web development is to design webpage elements\
    \ that can run just as well on any browser as different browsers provide support\
    \ for different elements, making it difficult to find a common ground.\n\nThis\
    \ chapter takes you a step further in JavaScript development by teaching you how\
    \ to create objects and use them. Besides this, it also introduces you to the\
    \ concept of jQuery, which attempts at creating browser-compatible code.\n\n####\
    \ How to Create JavaScript Objects\nAnything from numbers to strings are objects\
    \ in JavaScript. Therefore, it is essential to know how to create objects. The\
    \ simplest way to create objects is using object literal syntax. The following\
    \ example illustrates how it is:\n```javascript\nvar customer1 = {\n  yearOfBirth:\
    \ 2000,\n  name: 'Alex',\n  getCustomerInfo: function () {\n    return 'Customer:\
    \ ' + this.name + ' ' + this.yearOfBirth;\n  }\n};\n```\nThis code creates an\
    \ object `customer1`, with the data members `name` and `yearOfBirth` and the member\
    \ function `getCustomerInfo`. It is also important to note the use of `this` keyword,\
    \ which accesses the values correctly used or referenced for the object.\n\nBesides\
    \ this, you can also create objects dynamically using the `new` keyword. The methods\
    \ inherited include: `constructor`, `isPrototypeOf`, `hasOwnProperty`, `toLocaleString`,\
    \ `propertyIsEnumerable`, `valueOf`, `toString`. Once the object has been created,\
    \ properties can be added to the same in the following manner:\n```javascript\n\
    function getCustomer(myName, myYearOfBirth) {\n  var newCust = new Object();\n\
    \  newCust.name = myName;\n  newCust.yearOfBirth = myYearOfBirth;\n  newCust.getCustomerInfo\
    \ = function () {\n    return 'Customer: ' + this.name + ' ' + this.yearOfBirth;\n\
    \  };\n  return newCust;\n}\n```\nThis code creates an object `newCust` dynamically.\
    \ Several instances of this can be created in the following manner:\n```javascript\n\
    var cust1 = getCustomer('Alex', 1978);\nvar cust2 = getCustomer('David', 1986);\n\
    ```\nAlthough, JavaScript doesn’t support a particular keyword `class`, but you\
    \ can simulate classes using the method mentioned above.\n\n#### Namespaces\n\
    There is no specific keyword like `namespace` for implementing namespaces. However,\
    \ namespaces can be implemented using the concepts of classes and objects. If\
    \ you classify variables and methods into objects and access them as instances\
    \ of these objects, then you are placing only the names of these objects in the\
    \ global namespace, reducing the scope of the variables to the object that they\
    \ belong.\n\n#### Implementing Inheritance\nYou can define ‘is-a’ relationships\
    \ between objects in JavaScript by creating objects and then classifying those\
    \ objects on the basis of their common characteristics. For instance, if you are\
    \ implementing an object for employee of a company. You can create objects for\
    \ specific types of objects like `managerTechnical`, `managerGeneral`, `technicalStaff`,\
    \ `recruitmentStaff` and `officeStaff` and then classify them into objects, `technicalStaff`,\
    \ which includes the objects `managerTechnical` and `technicalStaff`, and `adminStaff`,\
    \ which includes the `managerGeneral`, `recruitmentStaff` and `officeStaff`. In\
    \ a similar manner, new functions can also be defined.\n"
