    \ $-32768$。\n`short` 信息类型可以像 `byte` 一样节省内存。\n\n示例：\n```\nshort short x = 20\n\
    ```\n\n#### int:\n\n`int` 信息类型是 32 位的带符号补码整数。\n\n最大值为 $2^{31}-1$，等于 $2147483647$。该值也包含在范围内。\n\
    最小值为 $-2^{31}$，等于 $-2147483648$。\n`int` 通常作为小数性质的默认信息类型。\n\n示例：\n```\nint x =\
