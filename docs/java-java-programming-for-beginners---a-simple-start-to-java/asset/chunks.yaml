    perform.


    </p>


    **The < *br /*> and < *wbr /*> Elements** The <br/> element implements a line
    break. On the other hand, the <wbr/> implements a word break.


    **The <dfn> Element**


    There may be occasions when you wish to define a term. This can be done using
    the


    <dfn> element, which takes title as one of its attributes.


    **Working with Figures**


    Images and figures are an integral part of any web page content. Therefore, every
    figure can also be viewed as a unit of content, which may consist of a caption
    and a reference from the page to which it may belong. In order to define one or
    more images, the <figure> element is used. The element <figurecaption> can be
    used for defining the caption of the figure.


    However, it is important to mention here that the <figure> element does not give
    any importance to the position of the figure and the same is included along with
    the content.


    However, if the position and location of the figure is of importance to you.,
    then you must consider using the <div> element.


    **The <summary> and <details> Elements**


    The element <summary> contains the summary of the content of the webpage, which
    can be displayed in the form of a collapsible list using the <details> element.
    Therefore, when you load a page, only the contents of the <summary> element will
    be displayed, while the contents of the <details> element are displayed when the
    user clicks on the summary.


    **Other Annotations**


    In addition to the above mentioned, there are a few more annotations available,
    which include:


    < *s*> - Used for striking out text


    < *u*> - Used for underlining text


    < *mark*> - Used for highlighting text


    < *ins*> - Used for indicating that the text has been inserted


    < *del*> - Used for indicating that the text has been deleted


    < *small*> - used for indicating that the text must be printed in fine letters


    < *sub*> - Indicates that the text is a subscript


    < *sup*> - Indicates that the text is a superscript


    < *time*> - Used for indicating that the text denotes time and date


    < *kbd*> - used for indicating that the text is a user input **Language Elements**


    You may need to use characters of Chinese, Japanese or Korean origin in your text.
    In order to support this inclusion, the element <ruby> can be used. Inside this
    element, other elements like <bdi> and <bdo>, for defining the isolation and direction
    of text. Besides this, <rt> and <rp> elements can also be used for placing notation
    or parentheses in the text of <ruby> element.


    **Working with Lists**


    In HTML5, several elements for defining unordered, ordered and descriptive lists
    exist. A fourth category of ‘Custom lists’ is also present to allow customization
    by the developer.


    The list items for all these are declared using the <li> element. Moreover, all
    the three types of lists support list nesting.


    ***Ordered Lists***


    Ordered lists are declared using the element <ol> and the elements of ‘order’
    in this list are brought about by an automatic numbering of the elements that
    are included in this list.


    The attributes that can be used with ordered lists include: start - Used to set
    the starting number of the list


    reversed - Used for declaring if the list has to be ordered in an ascending or
    descending order


    type – Used for declaring the type of the list, which can be A, a, 1 or I.


    ***Unordered Lists***


    This type of a list is declared using the <ul> element and there is no numbering
    of'
