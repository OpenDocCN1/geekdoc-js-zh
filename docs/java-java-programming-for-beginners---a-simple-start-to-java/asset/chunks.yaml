    \ `FileOutputStream`\n\n`FileOutputStream` 用于创建文件并向其中写入文本。如果文件目前不存在，该流会在打开它进行输出之前创建一个文件。这里有两个可以用于创建\
    \ `FileOutputStream` 对象的构造函数。\n\n#### 方法 1:\n```\nOutputStream myfx = new FileOutputStream(\"\
    c:/java/hi\")\n```\n\n#### 方法 2:\n```\nFile myfx = new File(\"c:/java/hi\");\n\
    OutputStream myfx = new FileOutputStream(myfx);\n```\n\n当你掌握并控制了 `OutputStream`\
    \ 对象时，有一份辅助方法列表，这些方法可以用于与流保持联系或对流执行不同的操作。\n\n`public void write(int w) throws\
    \ IOException {}`\n此方法将标记的字节组合到输出流中。\n\n`protected void finalize() throws IOException\
    \ {}`\n该策略清理与记录相关的所有关联。此外，它还保证了用于该文件输出流的本地方法能够被调用。此方法可能会抛出异常。\n\n`public void\
    \ close() throws IOException {}`\n此方法关闭文件的输出流。此外，它释放了与文档相关的任何框架资源。此方法也会抛出一个 `IOException`。\n\
    \n`public void write(byte[] w)`\n此方法从指定的字节数组中将 `w.length` 个字节组合到 `OutputStream`\
    \ 中。\n\n其他可用的强制输出流如下：`ByteArrayOutputStream`、`DataOutputStream`。\n\n#### 示例实现:\n\
    ```java\nimport java.io.*;\n\npublic class Mytestfile{\n    public static void\
    \ main(string args[]){\n        try{\n            byte bytewrite [] = {45,64,22,49,1};\n\
    \            OutputStream myos = new FileOutputStream(\"mytest.txt\");\n     \
    \       for(int i=0; i < bytewrite.length ; i++){\n                myos.write(\
    \ bytewrite[x] );\n            }\n            myos.close();\n            InputStream\
    \ myis = new FileInputStream(\"mytest.txt\");\n            int sizex = myis.available();\n\
    \            for(int z=0; z< sizex; z++){\n                System.out.print((char)myis.read()\
    \ + “ “);\n            }\n            myis.close();\n        }catch(IOException\
    \ e){\n            System.out.print(\"Exception Caught!\");\n        }\n    }\n\
    }\n```\n上述代码将创建一个文件 `mytest.txt` 并以并行组织组合给定的数字。相同的结果将输出到 `stdout` 屏幕。\n\n### 文件导航与\
    \ I/O\n\n我们通过接触几个不同的类来了解文件导航和 I/O 的基础知识。\n\n- `File` 类\n- `FileWriter` 类\n- `FileReader`\
    \ 类\n\n### 目录\n\n目录是一个 `File`，它可以包含不同目录和文件的列表。你利用 `File` 对象创建目录，列出索引中可访问的文档。要获取完整信息，请查看可以访问\
    \ `File` 项的所有技术列表以及通过索引识别的项。\n\n#### 创建目录\n\n有两个实用的 `File` 工具方法可以创建目录：`mkdirs()`\
    \ 方法会同时创建目录和索引中的所有元素。\n\n`mkdir()` 方法创建一个目录，成功时返回 true，失败时返回 false。失败表示 `File`\
    \ 对象中指定的路径已存在，或者由于整个路径尚存在而无法创建索引。\n\n#### 示例实现:\n```java\nimport java.io.File;\n\
    \npublic class MyCreateDir {\n    public static void main(String args[]) {\n \
    \       String directoryname = \"/tmp/user/java/bin”;\n        File dir = new\
    \ File(directoryname);\n        dir.mkdirs();\n    }\n}\n```\n\n#### 列出目录\n\n\
    你可以利用 `File` 类提供的 `list()` 方法来提供索引中所有可访问记录和目录的列表。\n\n#### 示例实现:\n```java\nimport\
    \ java.io.File;\n\npublic class MyReadDir {\n    public static void main(String[]\
    \ args) {\n        File myfile = null;\n        String[] paths;\n        try{\n\
    \            myfile = new File(\"/tmp\");\n            mypaths = file.list();\n\
    \            for(String path:mypaths)\n            {\n                System.out.println(path);\n\
    \            }\n        }catch(Exception e){\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n### 异常处理\n\n在程序执行期间，可能会遇到异常或特殊情况。由于这些情况，系统可能会崩溃。异常可能由于多种原因引起。其中一些包括：\n\
    \n- 找不到需要打开的文件。\n- 客户端输入了无效信息。\n- 通中丢失了系统关联，或者 JVM 已耗尽了所有可用内存。\n\n这些特殊情况有些是由客户端错误造成的，有些是开发者失误造成的，有些是以某种方式进入你代码的物理故障。要了解\
    \ Java 中异常处理的工作原理，你必须理解异常的三种分类：\n\n- **错误 (Errors)**：这些完全不是特殊情况。因此，错误可以被定义为超出客户端或软件工程师理解范围和控制能力的问题。在你的代码中，它们通常会被忽略，因为你偶尔可以处理错误。例如，如果发生栈溢出（stack\
    \ overflow）。\n- **运行时异常 (Runtime Exceptions)**：这是最可能被开发者规避的特殊情况。它们通常在运行时发生。\n\
    - **检点异常 (Checked Exceptions)**：这是通常可以被开发者预测的特殊情况。例如，如果需要打开文件但找不到，就会发生此类异常。这些异常情况在编译时无法被忽略。\n\
    \n#### 异常层次结构\n\n所有异常类都是 `java.lang.Exception` 类的子类型。该类是 `Throwable` 类的子类。除了异常类，还有一个名为\
    \ `Error` 的子类，它也自于 `Throwable` 类。这些特殊情况通常不会被 Java 程序捕获。错误是由运行时环境产生的。示例异常是内存溢出。`Exception`\
    \ 类有两个主要的子类：`IOException` 和 `RuntimeException`。\n\n#### 异常方法\n\n以下是 `Throwable`\
    \ 类可用的方法。\n\n`public Throwable getcause()`\n此方法返回由 `Throwable` 对象指定的异常原因。\n\n\
    `public String getmessage()`\n此方法返回异常的完整消息和细节。此消息通常在 `Throwable` 构造函数中。\n\n`public\
    \ void printstacktrace()`\n此方法将 `toString()` 的结果连同堆栈跟踪打印到 `System.err`（错误输出流）。\n\
    \n`public String tostring()`\n此方法返回关于该类的详细信息。\n\n`public Throwable fillinstacktrace()`\n\
    此方法用当前的堆栈跟踪填充 `Throwable` 对象的堆栈，添加到堆栈中的任何现有数据。\n\n`public Stacktraceelement []\
    \ getstacktrace()`\n此方法返回一个包含堆栈跟踪中每个元素的数组。\n\n索引为 0 的组件指向调用栈的最高点，而最后一个组件指向调用栈的基底。\n\
    \n#### 获取异常\n\n程序通过 `try` 和 `catch` 关键字的组合来发现异常。在 `try` 范围周围设置可能产生异常的代码。此范围内的代码被称为安全代码，`try/catch`\
    \ 的结构如下所示：\n\n```\ntry {\n    // 可能会产生异常的代码\n}catch(nameofexception exp_1) {\n\
    \    // 异常发生时执行的代码\n}\n```\n\n"
