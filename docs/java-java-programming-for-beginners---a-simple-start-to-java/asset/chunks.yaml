  trans: "\n\n`JQuery` 是一个浏览器兼容的辅助函数库，你可以在代码中使用它来尽量减少输入、实现和测试所需的精力。这些函数本质上是用 JavaScript\
    \ 编写的。因此，你也可以调用 `jquery`，这是一个 JavaScript 库。\n\n`jQuery` 提供的功能列表包括：\n- `Attributes`（属性）：一组用于获取和设置\
    \ DOM 元素属性的方法。\n- `Ajax`：一组提供同步和异步服务器调用支持的方法。\n- `Core Methods`（核心方法）：基础的 `jQuery`\
    \ 函数。\n- `Callbacks`（回调对象）：用于管理回调函数的对象。\n- `Data Methods`（数据方法）：便于 DOM 元素与任意数据之间建立关联的方法。\n\
    - `CSS Methods`（CSS 方法）：用于获取和设置 CSS 相关属性的方法。\n- `Dimensions`（尺寸）：用于访问和操作 DOM 元素尺寸的方法。\n\
    - `Deferred`（延迟对象）：一个能够注册多个回调，同时维护状态更改的数据并将状态从一个回调传递到下一个回调的对象。\n- `Forms`（表单）：用于控制表单相关控件的方法。\n\
    - `Traversing`（遍历）：一组支持 DOM 遍历的方法。\n- `Effects`（效果）：用于为网页创建动画的方法。\n- `Events`（事件）：用于执行基于事件的操作的方法。\n\
    - `Selectors`（选择器）：用于通过 CSS 选择器访问 DOM 元素的方法。\n- `Offset`（偏移）：用于定位 DOM 元素的方法。\n\
    - `Utilities`（工具）：一组工具方法。\n\n在使用 `jQuery` 之前，你将需要将其包含在你的项目中。一旦你安装了它并准备好将其用于你的项目，下一步就是学习如何使用它。\n\
    \n首先，你需要在按照以下方式在需要使用它的网页上引引用 `jQuery` 库：\n\n```html\n<script type=\"text/javascript\"\
    \ src=\"Scripts/qunit.js\"></script>\n<script src=\"Scripts/jquery-1.8.2.js\"\
    ></script>\n```\n\n接下来需要知道的是，你希望在 HTML 页面使用的 `jQuery` 代码位于 `jQuery` 命名空间，该命名空间有一个别名\
    \ `$`。因此，在引用 `jQuery` 的功能时，你可以写 `jQuery.jFeature` 或 `$.jFeature`。\n\n在开始在网页中使用它之前，你还需要按照如下方式更改\
    \ `default.js` 文件：\n\n```javascript\nfunction initialize() {\n    txtInput = $('#txtInput');\n\
    \    txtResult = $('#txtResult');\n    clear();\n}\n```\n\n这允许你通过使用 ID 匹配来使用 `jQuery`\
    \ 和 CSS 选择器。\n\n此外，当你继续使用 `jQuery` 编写代码时，请记住在进行任何更改后使用 `Ctrl+F5` 刷新屏幕，因为浏览器可能无法立即捕获\
    \ JavaScript 的修改。此外，尽可能使用 `jQuery` 对象，因为它们提供了跨浏览器兼容性。\n\n可以通过以下方式从 `jQuery` 包装器引用\
    \ DOM 对象：`var domElement = $('#txtInput')[0];`。\n\n这是一段简单的代码，在引用元素之前检查该元素是否存在：\n\
    \n```javascript\nvar domElement;\nif($('#txtInput').length > 0){\n    domElement\
    \ = $('#txtInput')[0];\n}\n```\n\n### 如何创建 jQuery 包装器来引用 DOM 元素\n\n可以通过以下方式从 DOM\
    \ 元素引用创建 jQuery 包装器：`var myDoc = $(document);`，`var inText = $(this).text();`。\n\
    \n第一条语句将包装的对象赋值给变量。另一方面，第二条语句包装了使用 `this` 引用的对象。\n\n### 如何添加事件监听器\n\n`jQuery`\
    \ 提供了 `.on` 方法来订阅事件。此外，你可以使用 `.off` 方法取消订阅。这些方法可以按照以下方式使用：\n\n```javascript\n\
    $('#btnSubmitInfo').on('click', onSubmit);\n$('#btnSubmitInfo').off('click', onSubmit);\n\
    ```\n\n### 如何触发事件处理器\n\n`JQuery` 提供了触发器（triggers）或 `triggerHandler` 方法来触发事件处理器或处理器代码的执行。可以通过以下方式实现：\n\
    \n```javascript\n$('#btnSubmitInfo').triggerHandler('click');\n```\n\n### 初始化代码\n\
    \n你经常会面临在加载 HTML 文档时运行初始化代码的需求。你可以按照以下方式使用 `jQuery` 实现：\n\n```html\n<script>\n\
    $(document).ready(function () {\n    initializationFunction();\n});\n</script>\n\
    ```\n\n这可以放在 HTML 文档的底部。它将调用 `initializationFunction`。\n\n## 第 7 章：表单\n\n在之前的章节中，你已经学习了如何创建和操作\
    \ HTML 文档。以它们为基础，我们现在可以开始理解表单，这是网页开发中最关键且最常用的内容单元之一。\n\n简单来说，表单是一种收集数据并发送到可以进行处理的位置的方法，在大多数情况下那里是服务器。然而，由于我们还没有讨论服务器端脚本，我们将重点关注将数据发送到电子邮件地址。但是，需要注意的是，我们不建议这种做法，它仅用于理解目的。\n\
    \n### 网络通信\n\n在进入表单的工作之前，了解 HTTP 的一些基础知识是重要的。典型的网络通信由以下活动组成：\n1. 当用户浏览网页时，通过发送\
    \ `GET` HTTP 请求发起对网络服务器资源的访问请求。\n2. 服务器处理请求并使用 HTTP 协议向浏览器发送响应。\n3. 浏览器处理服务器的响应并以“表单”的形式呈现给用户。\n\
    4. 用户向表单输入内容并在点击提交或回车后，数据通过 HTTP 协议发送到服务器。\n5. 服务器再次处理这些数据并将响应发布到浏览器，显示在网页上。\n\
    \n### 服务器\n\n最初，网络服务器的设计是为了接收和处理请求，并通过 HTTP 将结果传回浏览器。最初当网页非常简单时，这样的服务器能够在单位时间内处理相当数量的请求。当时没有涉及状态，因为发送和接收请求就像打开连接、传输数据并关闭连接。\n\
    \n现在的网络服务器比这些简单的服务器配备得多。现在的网络服务器实现了所谓的“保持连接”（keep alive）功能，确保连接在一定时间内保持开启，以便同一个浏览器的后续请求。\n\
    \n### 浏览器\n\n浏览器是一个桌面应用程序，用于显示网页并管理网页与服务器之间的交互。服务器与页面之间的通信是通过 AJAX 和异步 JavaScript\
    \ 等技术建立的。\n\n### 数据如何提交到服务器\n\n可以使用以下方式使用 `<form>` 元素创建 HTML 表单：\n\n```html\n\
    <form method=\"post\" action=\"getCustomerInformation.aspx\" >\n    客户编号：\n  \
    \  <input type=\"text\" name=\"Number\" />\n    <input type=\"submit\" value=\"\
    获取客户信息\" />\n</form>\n```\n\n该表单接收编号并返回一个显示客户详情的页面。\n\n注意的是，并不是所有元素都可以用于表单提交数据。用于此目的的元素有：\n\
    - `<textarea>`：接受多行输入。\n- `<button>`：可点击的按钮，可以放置在任何内容或图像上。\n- `<select>`：下拉列表，允许多选。可以使用\
    \ jQuery 识别选中的选项：`$('option:selected')`。\n- `<input type='checkbox'>`：复选框，具有 value\
    \ 属性，用于设置以及读取复选框的状态。识别已勾选复选框的 jQuery 为：`$('input[type=checkbox]:checked')`。\n\n"
- fmt: "\n- `<input type=’button’>` - It is a clickable button, which has a text prompt.\n\
    - `<input type=’datetime’>` - It is a control, which is date and time (UTC).\n\
    - `<input type=’date’>` - It is a control, which is date-only.\n- `<input type=’email’>`\
    \ - It is a file-select field, which has a browse button for uploading a file.\n\
    - `<input type=’color’>` - It is a color picker.\n- `<input type=’hidden’>` -\
    \ It is a hidden input field.\n- `<input type=’datetime-local’>` - It is a control,\
    \ which is date and time (any timezone).\n- `<input type=’month’>` - It is a month-year\
    \ control.\n- `<input type=’image’>` - It is an image submit button.\n- `<input\
    \ type=’password’>` - It is a password field, with masked characters.\n- `<input\
    \ type=’number’>` - It is a numeric field.\n- `<input type=’range’>` - It is a\
    \ control, which accepts a numeric value and defines the allowed range of values.\n\
    - `<input type=’radio’>` - It is an option button, which has a value attribute\
    \ for setting and reading the status of the button. The jQuery used for identifying\
    \ the marked radio buttons is `$(‘input[type=radio]:checked’`.\n- `<input type=’search’>`\
    \ - It is a text field, which is used for entering the search string.\n- `<input\
    \ type=’reset’>` - It is a button that can be used for resetting the fields of\
    \ a form.\n- `<input type=’url’>` - It is a URL field.\n- `<input type=’tel’>`\
    \ - It is a telephone number field.\n- `<input type=’submit’>` - It is a submit\
    \ button.\n- `<input type=’time’>` - It is a control, which accepts a time value.\n\
    - `<input type=’text’>` - It is a single-line text field.\n- `<input type=’week’>`\
    \ - It is a week-year control.\n\n## The `<label>` Element\n\nIt is the element\
    \ that is used to convey the meaning of an element to the user. The text in this\
    \ element is displayed inside the textbox, which is auto-removed when the user\
    \ clicks on it. You can also specify the style of a label.\n\n## Specifying Parent\
    \ Forms\n\nThere may be situations where the submission elements of a form may\
    \ not lie inside the same construct. Therefore, gathering data, in this case,\
    \ can be quite a challenge. In order to address this issue, HTML5 provides an\
    \ attribute, `id`, which can be set for multiple form elements. This shall allow\
    \ data collection from different form elements in one go.\n\n## How to Trigger\
    \ Form Submission\n\nUpon triggering, all the data collected from the submission\
    \ elements of the form or forms of the same id is sent to the server using an\
    \ HTTP method. The `<input>` element can be used for triggering form submission.\
    \ Besides this, you can also use JavaScript for this purpose. In order to implement\
    \ this, you must give an `id` to the concerned form, `myFirstForm`. The `default.js`\
    \ file, which is linked to the HTML document, must contain the following code:\n\
    \n```javascript\n$(document).ready(function () {\n  $(‘#myFirstButton’).on(‘click’,\
    \ submitMyFirstForm);\n});\n\nfunction submitMyFirstForm() {\n  $(‘#myFirstForm’).submit();\n\
    }\n```\n\nIf the method attribute of the form is not given any value, then it\
    \ is set to a default `GET`.\n\nMoreover, the `action` attribute will also have\
    \ a default value. Therefore, the button click will reference the page to same\
    \ page. However, the URL will now include a `QueryString`, which is a combination\
    \ of values selection or entered by the user. For instance, if the form requests\
    \ the user to enter Customer ID and the user enters 1245, then the `QueryString`\
    \ will be:\n\n`customerID=1245`\n\nThis `QueryString` will be appended to the\
    \ URL in the following manner: `Mywebpage.asp?customerID=1245`\n\nIt is also important\
    \ to mention here that the `QueryString` is URI encoded. Therefore, special characters\
    \ are represented by specific values. For instance, a space is represented as\
    \ ‘+` and exclamation mark (`!`) as `%21`. Name-value pair is represented as `name=value`\
    \ and name-value pairs are separated by `&`.\n\n## How to Serialize the Form\n\
    \nYou can serialize the form using the jQuery `serialize` method. This can be\
    \ done in the following manner:\n\n```javascript\nvar myFormData = $(‘#myFirstForm’).serialize();\n\
    ```\n\nYou can decode the URI-encoded string using the following:\n\n```javascript\n\
    var data = decodeURIComponent(myFormData);\n```\n\n## Using Autofocus Attribute\n\
    \nBy default, the focus is not set to any element of the form. However, you can\
    \ set focus using the `focus` method, which can be implemented in the following\
    \ manner: `$(‘input[name=“firstName”]’).focus();`.\n\nHowever, you can also set\
    \ `autofocus` in the following manner:\n\n```html\n<input type=“text” name=“firstName”\
    \ autofocus=“autofocus”/>\n```\n\n## How to Use Data Submission Constraints\n\n\
    A form can send data only if it satisfies the following constraints:\n- Name attribute\
    \ must be set.\n- You must have set the value of form submission element.\n- The\
    \ `<form>` element must have its form submission element defined and form submission\
    \ elements should not be disabled.\n- If multiple submit buttons have in implemented,\
    \ the values will be submitted only on the click of the activated submit button.\n\
    - Select the check boxes.\n- Select the Option buttons.\n- The `<option>` elements\
    \ must have set `<option>` elements.\n- If there is a file selection field, one\
    \ of the fields must be selected.\n- The `declare` attribute of the object elements\
    \ must be set.\n\nAlways remember that the reset buttons don’t send any data and\
    \ the form need not be.\n\n## How to Use POST or GET\n\nThere are two HTTP methods\
    \ available for submitting data: `GET` and `POST`. In the former case, the URL\
    \ is appended with the `QueryString`. However, in case of the latter, the information\
    \ is sent within the message body.\n\n## Form Validation\n\nIt is beneficial to\
    \ understand that the root of all security issues in application is user data.\
    \ The moment you decide to open your application to user data and interactions,\
    \ you are making your application vulnerable to security threats. Therefore, you\
    \ need to validate any data you receive before processing it.\n\nValidation can\
    \ be provided at the browser or server end. However, server side validation is\
    \ recommended as browser-level validation can be easily manipulated.\n\nThe simplest\
    \ form of validation that you can implement is using the `required` attribute\
    \ in `<select>` element. You can set this attribute in the following manner:\n\
    \n```html\n<select name=“dateOfBirth” required=“required”>\n```\n\nThe validation\
    \ error generated is browser dependent and each browser has a different method\
    \ of communication to the user that a field is required.\n\nThe addition of time,\
    \ date and type based inputs in HTML5 makes validation much simpler as they can\
    \ directly be matched to see if they have valid input values or not. Besides this,\
    \ email, numbers and ranges can also be easily validated. HTML5 performs validation\
    \ and matches it with the `:valid` or `:invalid` pseudoclasses. If the validation\
    \ is successful, the value is matched to `:valid`, else it is matched to `:invalid`.\
    \ However, if a value is not `required`, it is matched to `:optional` pseudoclass.\
    \ Besides this, the `placeholder` attribute is also available...\n\n## CHAPTER\
    \ 8: WEB SERVICES\n\nAll the chapters discussed till now dealt with browser level\
    \ coding and scripting. However, now it is time to move on to server side scripting.\
    \ This chapter focuses on the use of JavaScript at the server level, which is\
    \ possible with the help of Node.js, and how you can work around with web services.\n\
    \n### Basics of Node.js\n\nNode.js is a platform, which is made on Google Chrome,\
    \ and can be used for creating scalable and flexible applications. It allows you\
    \ to write JavaScript code for the server. However, before you can begin, you\
    \ must download and install Node.js on your system.\n\n### Writing a Basic Code\n\
    \nThe first step is to open any text editor and create a file named `myFile.js`.\
    \ In the file, write the code:\n\n```javascript\nvar http = require(‘http’);\n\
    ```\n"
