  trans: "\n\n此方法返回一个字符串，该字符串是包含数组中所有值的、以逗号分隔的拼接字符串。\n\n### 注意事项\n\n1. 在使用函数时，你可以传递整个数组（使用数组名称）或数组的某个特定元素（使用\
    \ `array name[indexer]`）。\n2. 可以通过索引器访问元素来修改数组元素。例如，`arrName[1] = ‘Danny’`；将值\
    \ ‘Danny’ 赋值给数组的第二个元素。\n\n### DOM 对象\n\n在构建应用程序时，你需要访问的主要对象是与其关联的 DOM 对象。这种访问对于你控制并获取网页上发生事件的通知是必要的。\n\
    \nDOM 是对象层级结构的表示。可以使用内置的 `document` 变量来访问这些对象。该变量引用 DOM 并执行搜索，可能会返回一个活跃的（active）或静态的（static）`NodeList`。由于活跃的\
    \ `NodeList` 包含一个不断变化的元素列表，而静态的 `NodeList` 包含不随时间变化的元素。由于获取静态的 `NodeList` 耗时较长，建议选择适用于活跃\
    \ `NodeList` 的搜索方法。\n\nDOM 可用的搜索方法包括：\n\n#### `getElementById`\n此方法返回具有指定 ID 的第一个元素的引用。\n\
    \n#### `getElementsByTagName`\n此方法返回具有指定标签名的活跃 `NodeList`。\n\n#### `getElementsByName`\n\
    此方法返回具有指定名称的活跃 `NodeList`。这是单选项按钮（option buttons）的首选方法。\n\n#### `getElementsByClass`\n\
    此方法返回具有指定类名的活跃 `NodeList`。然而，此方法不支持 Internet Explorer 8 及之前的版本。\n\n#### `querySelector`\n\
    此方法接受 CSS 选择器作为参数并返回第一个匹配的元素。然而，此方法不支持 Internet Explorer 7 及之前的版本。\n\n#### `querySelectorAll`\n\
    此方法接受 CSS 选择器作为参数并返回所有匹配的元素。因此，它返回一个静态的 `NodeList`。然而，此方法不支持 Internet Explorer\
    \ 7 及之前的版本。\n\n### 事件\n\n如果你将 JavaScript 视为一个引擎，那么事件就是赋予它所需火花的。\n\n事件可能发生在两种情况下。第一类事件是发生在用户交互期间的事件。用户可能会点击图像或输入文本。所有这些都被归类为事件。\n\
    \n此外，系统状态的变化也被视为事件。例如，如果视频开始或停止，就称发生了一个事件。DOM 允许你捕获事件并执行相应的代码。\n\n在 JavaScript\
    \ 中，事件基于发布-订阅方法论。在创建对象时，开发者可以发布与该对象相关的事件。此外，每当使用该对象时，都可以向该对象添加事件处理器。事件处理函数会通知被订阅的事件事件已经触发。此通知包含了有关事件的信息，如鼠标位置和按键点击，以及其他与事件相关的若干其他细节。\n\
    \n#### 捕获事件\n在某些情况下，事件可能会绑定到按钮点击上，而该按钮可能位于超链接内部。在这种情况下，元素是嵌套的。因此，事件在触发时会沿着 DOM\
    \ 层级结构向下传递。这个过程被称为事件捕获。然而，一旦事件到达元素，它就会向上冒泡。这个过程被称为事件冒泡。事件在层级结构中的移动为开发者提供了根据需要订阅或取消传播的机会。\n\
    \n#### 订阅事件\n可以使用函数 `addEventListener` 进行订阅过程。该函数需要三个参数：事件、事件发生时需要调用的函数，以及一个决定该函数是否在捕获或冒泡过程中被调用的布尔值（true\
    \ – 捕获，false – 冒泡）。通常，此值被设置为 false。正如 W3C 标准中提到的，这是订阅的首选方法。\n\n示例代码：\n```javascript\n\
    var btn = document.getElementById(‘btnDownload’);\nbtn.addEventListener(‘click’,\
    \ initiateDownload, false);\n```\n\n然而，也存在其他方法，包括为 html 标签提供在线订阅。这会将事件订阅到冒泡过程中。使用这种方法的优点是它是最古老且最受接受的方法。因此，你可以确保无论使用哪种浏览器，这种方法都能生效。请查看下方的标签以了解如何操作。\n\
    \n```html\n<button id=‘btnDownload’ onclick=‘initiateDownload();’ >Download</button>\n\
    ```\n\n你也可以使用使用 JavaScript 订阅事件的传统订阅过程：\n\n```javascript\nvar btn = document.getElementById(‘btnDownload’);\n\
    btn.onclick = initiateDownload;\n```\n\n#### 取消订阅\n可以使用函数 `removeEventListener`\
    \ 取消订阅，它接受与 `addEventListener` 相同的参数 set。对于上一个示例中使用的 `btn` 变量，可以通过以下方式实现：\n\n\
    ```javascript\nvar btn = document.getElementById(‘btnDownload’);\nbtn.removeEventListener(‘click’,\
    \ initiateDownload, false);\n```\n\n#### 如何取消传播？\n使用函数 `stopPropagation` 执行此操作。可以通过以下方式实现：\n\
    \n```javascript\nvar btn = document.getElementById(‘btnDownload’);\nbtn.addEventListener(‘click’,\
    \ initiateDownload, false);\n\nfunction initiateDownload (e){\n  //download\n\
    \  e.stopPropagation();\n}\n```\n\n#### 如何阻止默认操作？\n可以通过以下方式使用函数 `preventDefault`\
    \ 来实现：\n```javascript\nvar hyperlink = document.getElementById(‘linkSave’);\n\
    hyperlink.addEventListener(‘click’, saveData, false);\n\nfunction saveData(e){\n\
    \  //save\n  e.preventDefault();\n\n```\n\nJavaScript 还提供了 `this` 关键字，如果你想访问触发事件的元素，可以使用它。\n\
    \n#### 窗口事件\n当前浏览器窗口由 `window` 变量表示，它是 Window 对象的实例。与此对象相关的事件有：afterprint, beforeonload,\
    \ beforeprint, error, blur, haschange, load, message, focus, online, offline,\
    \ pageshow, pagehide, redo, popstate, storage, resize, unload, undo。\n\n#### 表单事件\n\
    在 HTML 表单内部发生的动作触发事件有：change, blur, focus, contextmenu, forminput, formchange,\
    \ invalid, input, select。\n\n#### 键盘事件\n键盘触发的事件有：keyup, keypress, keydown。\n\n\
    #### 鼠标事件\n鼠标触发的事件有：click, drag, drop, scroll, dblclick, dragenter, dragstart,\
    \ dragend, dragover, dragleave, mousemove, mousedown, mouseover, mouseout, mousewheel,\
    \ mouseup。\n\n#### 媒体事件\n视频、图像和音频等媒体元素也会触发事件：canplay, abort, waiting, durationchange,\
    \ canplaythrough, ended, emptied, loadeddata, error, loadstart, loadedmetadata,\
    \ play, pause, progress, playing, ReadyState, ratechange, seeking, seeked, suspend,\
    \ stalled, volumechange, timeupdate。\n\n### 第 4 章：CSS3 基础\n\n级联样式表或 CSS 提供了网页所闻名的呈现效果。\n\
    \n尽管 HTML 能够为网页提供基本结构，但 CSS 为开发者提供了大量的设计选项。此外，它是快速且高效的，这使得它成为更受欢迎的设计工具。\n\nCSS\
    \ 已知演变自 SGML（标准化通用标记语言）。这些努力的目标是标准化网页外观的方式。该技术的最新版本是 CSS3，它是 50 个模块的集合。\n\n"
- fmt: "\nThe most powerful characteristic of `CSS` is its cascading ability. Simply,\
    \ it allows a webpage to take its styles from multiple sheets in such a manner\
    \ that changes to the style in subsequently read sheets overwrite the style already\
    \ implemented from one or more of the previous sheets.\n\n## How to Define and\
    \ Apply Style\n\nThe definition and application of a style involves two facets\
    \ or parts, selector and declaration. While the selector determines the area of\
    \ the webpage that needs to be styled, the declaration block describes the style\
    \ specifications that have to be implemented. In order to illustrate how it works,\
    \ let us consider the following example:\n\n```css\nbody {\n  color: white;\n\
    }\n```\n\nIn this example, the selector selects the `body` of the webpage and\
    \ the declaration block defines that the font color should be changed to white.\
    \ This is a simple example and declarations and selectors can be much more complex\
    \ than this.\n\n## How to Add Comments\n\nComments can be added to the style sheet\
    \ using the following format:\n\n```css\n/*write the comment here*/\n```\n\n##\
    \ How to Create an Inline Style\n\nEvery element has an associated global attribute,\
    \ `style`. This global attribute can be manipulated within the tag for that element\
    \ to modify the appearance of that element. This type of styling does not require\
    \ you to specify the selector. Only the declaration block is required. An example\
    \ of how this is done is given below:\n\n```html\n<body style='color: white;'>\n\
    </body>\n```\n\nThis HTML tag performs the same functionality as the `CSS` code\
    \ specified in the previous section. The advantage of using this approach is that\
    \ the style information given in this manner overwrites any other styling information.\
    \ Therefore, if you need to use different-style for one element while the rest\
    \ of the document needs to follow a different style, then you can use a stylesheet\
    \ for the document and specify the style for this element in its tag.\n\n## How\
    \ to Use Embedded Style\n\nAnother approach for accomplishing the same outcome\
    \ as inline styles is to use the `<style>` element within the element concerned,\
    \ for defining its style specification. Here is how this can be done:\n\n```html\n\
    <!DOCTYPE html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n<head>\n  <title></title>\n\
    \  <style>\n    body {\n      color: white;\n    }\n  </style>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n## How to Create External Style Sheet\n\nFor usages where\
    \ you wish to use the same style for the complete webpage or a number of webpages,\
    \ the best approach is to use an external style sheet.\n\nThis external style\
    \ sheet can be linked to the HTML page in the following manner:\n\n```html\n<!DOCTYPE\
    \ html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n<head>\n  <title></title>\n\
    \  <link rel='stylesheet' type='text/css' href='Content/mainstyle.css' />\n</head>\n\
    <body>\n</body>\n</html>\n```\n\nYou must create a file `mainstyle.css`, in the\
    \ `Content` folder, and put the style rule specified below into the file.\n\n\
    ```css\nbody {\n  color: white;\n}\n```\n\n## Defining Media\n\nIt is important\
    \ to note that a style sheet can contain as many style rules as you want.\n\n\
    Besides this, you can also link different `CSS` files for different media. The\
    \ different media types are as follows:\n\n- all\n- embossed\n- braille\n- print\n\
    - handheld\n- speech\n- screen\n- tv\n- tty\n\nThe media used can be defined in\
    \ the following manner:\n\n```html\n<link rel='stylesheet' type='text/css' href='Content/all.css'\
    \ media='all' />\n```\n\n## Defining Character Encoding\n\nYou can also define\
    \ the character encoding used, using the following format. Style sheet:\n\nPlace\
    \ the following line above the style rule in the style sheet.\n\n```css\n@charset\
    \ 'UTF-8';\n```\n\nHTML page:\n\nYou must place this line above the link element.\n\
    \n```html\n<meta http-equiv='Content-Type' content='text/html;charset=UTF-8' >\n\
    ```\n\n## Importing style Sheets\n\nAs your web pages becomes complex, the style\
    \ sheets used shall also grow in complexity.\n\nTherefore, you may need to use\
    \ many style sheets. You can import the style rules present in one style sheet\
    \ to another by using:\n\n```css\n@import url('/Content/header.css');\n```\n\n\
    Here, `header.css` is imported and the `url` gives the relative address of the\
    \ style sheet to be imported.\n\n## Importing Fonts\n\nFonts can be imported using\
    \ the following format:\n\n```css\n@font-face {\n  font-family: newFont;\n  src:\
    \ url('New_Font.ttf'),\n  url('New_Font.eot'); /* IE9 */\n}\n```\n\n## Selectors,\
    \ Specificity and Cascading\n\nSelectors can be of three types: class selectors,\
    \ ID selectors and element selectors. The element selector type is the simplest\
    \ and requires you to simply name the element that needs to be used. For instance,\
    \ if you wish to change the background color of the `body`, then the element selector\
    \ used is `body`.\n\nWhile declaring any element, you can assign an `ID` to it\
    \ using the `id` attribute. You can use this ID prefixed with a `#` as a selector.\
    \ For example, if you have created a button with ID `btnID`, then the ID selector\
    \ for this will be `#btnID`. Similarly, you can assign a class name to an element\
    \ using the `class` attribute. Class name can be used prefixed by a dot (`.`)\
    \ in the following manner, `.className`.\n\nHowever, if you wish to select all\
    \ the elements of the webpage, then asterisk (`*`) to it.\n\n## Using Descendent\
    \ and Child Selectors\n\nYou may wish to apply a particular style to a descendant\
    \ of a selector. This can be done by specifying the complete selector change.\
    \ It can be done in the following manner:\n\n```css\nli a {\n  color: black;\n\
    }\n```\n\nOn the other hand, you may want to apply to an element only if it is\
    \ a direct child of the selector. This can be implemented by specifying the parent\
    \ and child separated by a greater than (`>`) sign, in the following manner:\n\
    \n```css\nli > a {\n  color: white;\n}\n```\n\n## Pseudo-element and Pseudo-class\
    \ Selectors\n\nNow that you know how to apply styles to specific elements, let\
    \ us move on to implementing styles to more specific sections like the first line\
    \ of second paragraph. In order to style elements that cannot be classified on\
    \ the basis of name, content or is not a part of the DOM tree can be styled using\
    \ pseudo-classes. The available pseudo-classes include:\n\n- `:visited`\n- `:link`\n\
    - `:hover`\n- `:active`\n- `:checked`\n- `:focus`\n- `:nth-last-child(n)`\n- `:not`\n\
    - `:only-child`\n- `:nth-child(n)`\n- `:lang(language)`\n- `:first-of-type`\n\
    - `:only-of-type`\n\nIf you want to access information of the DOM tree that is\
    \ not otherwise, you can use pseudo-elements. Pseudo-elements include:\n\n- `::first-letter`\n\
    - `::first-line`\n- `::after`\n- `::before`\n\n## Grouping Selectors\n\nMultiple\
    \ selectors can be used for a style rule. These selectors must be separated by\
    \ commas. Sample implementation:\n\n```css\nbody, button {\n  color: white;\n\
    }\n```\n\n## Using Adjacent Selectors\n\nIf you want to style the first heading\
    \ in a div or any similar adjacent elements, the selector is constructed using\
    \ a plus sign (`+`) between the two selectors. Sample implementation:\n\n```css\n\
    div + h1 {\n  color: white;\n}\n```\n\n## Sibling Selectors\n\nSibling selectors\
    \ are similar to adjacent selectors except for the fact that all the matching\
    \ elements are styled as against adjacent selectors, which only style the first\
    \ matching element. The selector is constructed using a tilde (`~`) sign between\
    \ the two selectors. Sample implementation:\n\n```css\ndiv ~ h1 {\n  color: white;\n\
    }\n```\n\n## Using Attribute Selector\n\nThis selector selects all the elements\
    \ for which the specified attribute exists. The selector is written in this form:\n\
    \n```css\na[title]\n```\n\nThis selector will select all the links for which the\
    \ title attribute has been specified.\n\nMoreover, this selector type can be modified\
    \ into attribute-value selector by specifying the attribute value in the following\
    \ manner:\n\n```css\na[title = value]\n```\n\n## In-Built Styles of Browsers\n\
    \nEvery browser has a built-in stylesheet, which is applied to all the webpages\
    \ opened using this browser. In fact, this stylesheet is applied before any other\
    \ style sheet. You can define your own style sheet for the browser using the Accessibility\
    \ option in Tools. However, user style sheets are browser specific. Therefore,\
    \ if you open a different browser, the style sheet you defined may not be accessible.\n"
