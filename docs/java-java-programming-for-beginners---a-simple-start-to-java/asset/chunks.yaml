  trans: "\n\n`try` 块包含了对你尝试获取的异常类型的声明。如果在受保护代码中发生了异常，则会检查在尝试后执行的 `catch` 块。如果 `try`\
    \ 块中发生了此类特殊情况，异常将传递到 `catch` 块，该异常也会作为系统参数进行传递。\n\n### 示例实现：\n\n```java\nimport\
    \ java.io.*;\n\npublic class MyException{\n    public static void main(string\
    \ args[]){\n        try{\n            int myarr[] = new int[2];\n            System.out.println(\"\
    This statement attempts to access the third element of the array:\" + a[3]);\n\
    \        }catch(arrayindexoutofboundsexception e_1){\n            System.out.println(\"\
    The thrown exception is: \" + e_1);\n        }\n        System.out.println(\"\
    Exception: Out of Bounds\");\n    }\n}\n```\n\n这将输出相应的结果：\n```\nThe thrown exception\
    \ is: java.lang.arrayindexoutofboundsexception: 3\nException: Out of Bounds\n\
    ```\n\n### 使用多个 try 块\n\n单段代码可以有多个 `catch` 块来捕捉不同的异常。多个 `try/catch` 块的结构如下：\n\n\
    ```java\ntry {\n    // 要测试的语句\n}catch(exceptiontype1 e_1) {\n    // catch 块 1\n\
    }\ncatch(exceptiontype2 e_2) {\n    // catch 块 2\n}catch(exceptiontype3 e_3) {\n\
    \    // catch 块 3\n}\n```\n\n这段代码使用了三个 catch。然而，你可以根据需要使用任意数量的 `catch` 块。如果在保护代码中异常，异常将被抛出并首先被第一个\
    \ `catch` 块捕获。如果异常类型匹配，则执行该 `catch` 块。但是，如果异常类型不匹配，异常将由下一个 `catch` 块捕获。此过程将持续，直到找到匹配的异常类型或检查完所有的\
    \ `catch` 块为止。\n\n### 示例实现：\n\n```java\ntry{\n    filex = new Fileinputstream(nameoffile);\n\
    \    num = (byte) filex.read();\n}catch(IOException e_1) {\n    e_1.printstacktrace();\n\
    \    return -1;\n}catch(filenotfoundexception f_1){\n    f_1.printstacktrace();\n\
    \    return -1;\n}\n```\n\n### throws 关键字\n\n如果系统没有处理受检异常（checked exception），方法必须使用\
    \ `throws` 关键字声明它。`throws` 关键字出现在方法签的末尾。你可以利用 `throw` 关键字抛出异常，无论是新实例化的异常还是你刚刚发现的特殊情况。\n\
    \n### finally 关键字\n\n`finally` 关键字用于指定一段在程序中最后执行的代码。无论是否发生异常，`finally` 代码块都会可靠地执行。使用\
    \ `finally` 允许你运行任何需要执行的清理类语句，无论受保护代码发生了什么情况。\n\n### 创建异常\n\n你可以在 Java 中创建自己的异常。在编写异常类时，请记住以下重点：\n\
    \n- 所有异常都必须是 `Throwable` 的子类。\n- 如果你需要创建一个自然允许“处理或声明规则”（Handle or Declare Rule）的受检异常，你必须创建一个\
    \ `Exception` 类的扩展类。\n- 如果你需要创建一个运行时异常（runtime exception），你必须创建一个 `RuntimeException`\
    \ 类的扩展类。\n\n你可以使用以下结构创建自己的异常：`class MyNewException extends Exception{ }`\n\n###\
    \ 常见异常\n\n在 Java 中，可以将异常（Exceptions）和错误（Errors）分为类：\n\n1. **程序异常**：这些特殊情况由应用程序或\
    \ API 工程师明确抛出。例如：`Illegalargumentexception`、`IllegalStateException`。\n2. **JVM\
    \ 异常**：这些是仅或始终由 JVM 抛出的异常/错误。该类的某些异常包括 `ArrayIndexOutOfBoundsException`、`NullPointerException`\
    \ 和 `ClassCastException`。\n\n### 接口与包\n\n抽象方法组合在一起形成一个包。类实现接口，从而继承接口的抽象方法。接口不是类。\n\
    \n编写接口与编写类很像。然而，它们是两个独立的概念。类描述了对象的属性和行为。另一方面，接口包含了类应该实现的行为。\n\n除非实现接口的类是抽象的，否则接口的所有方法都需要在类中实现。接口在以下方面与类相似：\n\
    \n- 接口定义在一个具有 `.java` 扩展名的文件中，其接口名称与文件名匹配。\n- 接口可以包含任意数量的方法。\n- 接口出现在包中，其相关的字节码文件必须位于与包名匹配的目录结构中。\n\
    - 接口的字节码出现在 `.class` 记录中。\n\n另一方面，接口在某些方面是独特且不同的。这些是：\n\n- 接口不包含任何构造函数。\n- 接口无法实例化。\n\
    - 接口不能包含实例字段。接口的要求是其中的主字段必须是 `final` 和 `static` 的。\n- 所有方法必须是抽象方法。\n- 接口可以扩展不同的接口。\n\
    - 类不访问接口。实际上，类是实现接口。\n\n### 声明接口\n\n为了声明接口，你必须使用 `interface` 关键字。这是一个用于声明接口的简单示例。声明接口的标准结构和语句顺序如下：\n\
    \n```java\nimport java.lang.*;\n\npublic interface Interfacename {\n    // 语句\n\
    }\n```\n"
