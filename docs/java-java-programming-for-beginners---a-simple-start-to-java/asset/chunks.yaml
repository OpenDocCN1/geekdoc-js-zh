    ## Introduction


    Java, the programming language, was introduced by Sunystems. This work was initiated
    by James Gosling and the final version of Java was released in 1995.


    The rising popularity of Java, as a programming platform and language, has led
    to the development of several tools and configurations, for instance, the J2SE
    and JEE are two such configurations.


    The biggest advantage of using the Java platform is the fact that it allows you
    to run your code at any machine. So, you just need to write your code once and
    expect it to run everywhere.


    ### Object Oriented


    In Java, everything is an object. Java can be effectively stretched out and extended
    to unimaginable dimensions since it is focused around the Object model.


    ### Independent of the platform


    Dissimilar to numerous other programming dialects including C and C++, when Java
    is aggregated, it is not converted into a form, which is particular to any machine.
    Instead, it is converted into machine-independent byte code. This byte code is
    conveyed over the web and deciphered by Virtual Machines or `JVM` on whichever
    stage it is generally run.


