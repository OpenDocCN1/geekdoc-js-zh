  trans: "\n\n`CSS` 最强大的特性是它的层级联能力。简单来说，它允许网页从多个样式表中获取样式，使得后续读取的样式表中对样式的更改将覆盖从之前一个或多个一个样式表中已实现的样式。\n\
    \n## 如何定义和应用样式\n\n样式的定义和应用涉及两个方面或部分：选择器（selector）和声明（declaration）。虽然选择器决定了网页中需要设置样式的区域，而声明块则描述了必须实现的样式规范。为了说明其工作原理，让我们考虑以下示例：\n\
    \n```css\nbody {\n  color: white;\n}\n```\n\n在这个示例中，选择器选择了网页的 `body`，而声明块定义了字体颜色应更改为白色。这是一个简单的示例，实际应用中声明和选择器可以比这复杂得多。\n\
    \n## 如何添加注释\n\n可以使用以下格式在样式表中添加注释：\n\n```css\n/*在此处写下注释*/\n```\n\n## 如何创建内联样式\n\
    \n每个元素都有一个关联的全局属性 `style`。可以在该元素的标签内对此全局属性进行操作，以修改该元素的外观。这种类型的样式不需要你指定选择器。只需要声明块即可。下面是这种操作的示例：\n\
    \n```html\n<body style='color: white;'>\n</body>\n```\n\n此 HTML 标签执行与上一节中指定的 `CSS`\
    \ 代码相同的功能。使用这种方法的优点是，这种方式提供的样式信息会覆盖任何其他样式信息。因此，如果你需要为一个元素使用不同的样式，而文档的其他部分需要遵循不同的样式，那么你可以为文档使用样式表，并在标签中为该元素指定样式。\n\
    \n## 如何使用嵌入样式\n\n实现与内联样式相同效果另一种方法是在相关元素内部使用 `<style>` 元素来定义其样式规范。以下是实现方法：\n\n\
    ```html\n<!DOCTYPE html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n<head>\n\
    \  <title></title>\n  <style>\n    body {\n      color: white;\n    }\n  </style>\n\
    </head>\n<body>\n</body>\n</body>\n</html>\n```\n\n## 如何创建外部样式表\n\n对于希望在整个网页或多个网页中使用相同样式的用法，最佳方法是使用外部样式表。\n\
    \n该外部样式表可以通过以下方式链接到 HTML 页面：\n\n```html\n<!DOCTYPE html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
    <head>\n  <title></title>\n  <link rel='stylesheet' type='text/css' href='Content/mainstyle.css'\
    \ />\n</head>\n<body>\n</body>\n</html>\n```\n\n你必须在 `Content` 文件夹中创建一个 `mainstyle.css`\
    \ 文件，并将下面指定的样式规则放入该文件中。\n\n```css\nbody {\n  color: white;\n}\n```\n\n## 定义媒体\n\
    \n需要注意的是，样式表可以包含你任意数量的样式规则。\n\n此外，你还可以为不同的媒体链接不同的 `CSS` 文件。不同的媒体类型如下：\n\n- all（全部）\n\
    - embossed（压凸的）\n- braille（盲文）\n- print（打印）\n- handheld（手持）\n- speech（语音）\n- screen（屏幕）\n\
    - tv（电视）\n- tty（电传终端）\n\n使用的媒体可以通过以下方式定义：\n\n```html\n<link rel='stylesheet' type='text/css'\
    \ href='Content/all.css' media='all' />\n```\n\n## 定义字符编码\n\n你也可以使用以下格式定义使用的字符编码。样式表：\n\
    \n将以下行放在样式表中样式规则上方。\n\n```css\n@charset 'UTF-8';\n```\n\nHTML 页面：\n\n你必须将此行放在\
    \ link 元素上方。\n\n```html\n<meta http-equiv='Content-Type' content='text/html;charset=UTF-8'\
    \ >\n```\n\n## 导入样式表\n\n随着你的网页变得复杂，所使用的样式表也将随之变得复杂。\n\n因此，你可能需要使用许多样式表。你可以使用 `@import`\
    \ 将一个样式中的样式规则导入到另一个样式表中：\n\n```css\n@import url('/Content/header.css');\n```\n\
    \n在这里，导入了 `header.css`，`url` 给出了要导入样式表的相对地址。\n\n## 导入字体\n\n可以使用以下格式导入字体：\n\n```css\n\
    @font-face {\n  font-family: newFont;\n  src: url('New_Font.ttf'),\n  url('New_Font.eot');\
    \ /* IE9 */\n}\n```\n\n## 选择器、优先级与层级\n\n选择器有三种类型：类选择器、ID 选择器和元素选择器。元素选择器类型是最简单的，它要求你只需命名需要使用的元素。例如，如果你想更改\
    \ `body` 的背景颜色，那么使用的元素选择器就是 `body`。\n\n在声明任何元素时，可以使用 `id` 属性为其分配一个 `ID`。你可以使用带有\
    \ `#` 前缀的该 ID 作为选择器。例如，如果你创建了一个 ID 为 `btnID` 的按钮，那么该按钮的 ID 选择器为 `#btnID`。同样，可以使用\
    \ `class` 属性为元素分配类名。类名可以通过点 (`.`) 前缀以如下方式使用，即 `.className`。\n\n然而，如果你想选择所有元素，可以使用星号\
    \ (`*`)。\n\n## 元素与后代选择器\n\n既然你已经知道如何选择所有元素，让我们移动到为特定的元素设置样式。你可能想选择所有元素，可以使用星号\
    \ `*`。\n\n另一方面，你可能想对某个选择器的后代应用样式。这可以通过指定空格分隔的父元素元素选择器来实现。实现方式如下：\n\n```css\ndiv\
    \ a {\n  color: white;\n}\n```\n\n如果你只想对某个选择器的直接子应用样式，可以使用大于号 (`>`) 符号。实现如下：\n\
    \n```css\ndiv > a {\n  color: white;\n}\n```\n\n## 伪元素与伪类选择器\n\n现在你已经知道如何为特定元素设置样式，让我们转向通过伪类设置特定的部分。你可以根据名称、内容或状态使用伪类设置样式。可用的伪类包括：\n\
    \n- `:visited`（已访问）\n- `:link`（链接）\n- `:hover`（悬停）\n- `:active`（激活）\n- `:checked`（已检查）\n\
    - `:focus`（聚焦）\n- `:nth-last-child(n)`（倒数 n 个）\n- `:not`（不是）\n- `:only-child`（唯一子）\n\
    - `:nth-child(n)`（第 n 个）\n- `:lang(language)`（语言）\n- `:first-of-type`（同类型第一个）\n\
    - `:only-of-type`（唯一类型）\n\n如果你想访问其他方式无法访问 DOM 树信息，可以使用伪元素。伪元素包括：\n\n- `::first-letter`（首字母）\n\
    - `::first-line`（第一行）\n- `::after`（后元素）\n- `::before`（前元素）\n\n## 分组选择器\n\n多个选择器可以用于样式规则。这些选择器必须用逗号分隔。示例如下：\n\
    \n```css\nbody, button {\n  color: white;\n}\n```\n\n## 使用相邻选择器\n\n如果你想设置 div\
    \ 中的第一个标题或类似的相邻元素，选择器使用加号 (`+`) 连接两个选择器。示例如下：\n\n```css\ndiv + h1 {\n  color:\
    \ white;\n}\n```\n\n## 兄弟选择器\n\n兄弟选择器与相邻选择器相似，但它们会设置所有匹配元素，而相邻选择器只设置第一个匹配元素。选择器使用波浪号\
    \ (`~`) 连接两个选择器。示例如下：\n\n```css\ndiv ~ h1 {\n  color: white;\n}\n```\n\n## 使用属性选择器\n\
    \n此选择器选择所有具有指定属性的元素。写法形式如下：\n\n```css\na[title]\n```\n\n此选择器将选择所有指定了 title 属性的链接。\n\
    \n此外，这种选择器类型可以通过按如下方式指定属性值修改为属性值选择器：\n\n```css\na[title = value]\n```\n\n## 浏览器的内置样式\n\
    \n每个浏览器都有一个内置样式表，该表应用于所有使用此浏览器打开的网页。事实上，该样式表会在任何其他样式表之前应用。你可以使用工具中的“无障碍”选项为浏览器定义自己的样式表。然而，用户样式表是特定于浏览器的。因此，如果你打开另一个浏览器，可能无法访问你定义的样式表。\n\
    \n"
- fmt: "\nIn case, you want your user-defined stylesheet to override any other style\
    \ specified in the HTML page, then you can use the `!important` modifier. This\
    \ modifier sets highest priority for the specified style statement. Sample implementation:\n\
    \n```css\nbody {\n  color: white !important;\n}\n```\n\n## Cascading of Styles\n\
    \nThe precedence and priority of the styles are decided on the basis of the following\
    \ parameters.\n\n- Importance\n- Specificity\n- Textual Order\n\n## Working with\
    \ CSS Properties\n\nNow that you are thorough with the use of selectors, the next\
    \ step is to look at CSS properties.\n\n### Color\n\nOne of the most crucial properties\
    \ that are used in a web page is color, which can be defined using ARGB, RGB and\
    \ color names. `RGB` value are typically defined using a decimal number, which\
    \ lies between 0-255.\n\n- `white #ffffff`\n- `red #ff0000`\n- `black #000000`\n\
    - `green #008000`\n\nColor values can also be used instead of the color name.\
    \ An example of how this can be used is given below.\n\n```css\nbody {\n  color:\
    \ #ffffff;\n}\n```\n\nAnother way to specify the color is using the `RGB` function,\
    \ which specifies the values of parameters using a number between 0-255 or percentage.\
    \ Example of this type of declaration is given below:\n\n```css\nh1 { color: rgb(255,0,0);\
    \ }\n```\n\nOther ways to specify color are `RGBA`, which accepts 4 values and\
    \ `HSL`, which defines values for hue, saturation and lightness.\n\n### Transparency\n\
    \nThe transparency or opacity are defined by a value between `0.0` (invisible)\
    \ and `1.0` (opaque).\n\n### Text\n\nAs far as text is concerned, `font-face`\
    \ and `font-size` can be specified. These properties can be defined in the following\
    \ manner:\n\n```css\nh1 { font-family: arial, verdana, sans-serif; }\nh1 { font-size:\
    \ 12px; }\n```\n\n## The CSS Box Model\n\nThe `CSS Box Model` assumes that a webpage\
    \ can be considered to be made up of boxes. The spacing between these boxes are\
    \ given by margins and padding settings. These properties can be given values\
    \ in the following manner:\n\n```css\nmargin: 15px;\npadding: 25px;\nborder: 10px;\n\
    ```\n\n### Positioning `<div>` elements\n\nThe element used for creating page\
    \ layouts is `<div>`. Although, HTML5 recommends the use of semantic markup instead\
    \ of `div` elements, there are still used for content that cannot be styled using\
    \ semantic markup. A `div` element can be imagined as a rectangular block and\
    \ is declared in the following manner:\n\n```html\n<div>\n  <!--other elements\
    \ are enclosed within this area-->\n</div>\n```\n\nProperties used to define the\
    \ position of a `div` element include: The position of the `div` element can be\
    \ defined using the properties, `top`, `bottom`, `left` and `right`, in pixels.\n\
    \nA property, `position`, is used to define if the position specified is static\
    \ or relative.\n\nThe `float` property can be used to allow elements to float\
    \ to the right or left and is defined as `float: left` or `float: right`. The\
    \ `clear` property places a clear element right after the floating element.\n\n\
    You can also change the manner in which the browser calculates width with the\
    \ help of the `box-sizing` property. This property can take three values: `content-box`\
    \ (default setting), `border-box` and `padding-box`.\n\n### Centering Content\n\
    \nIf you are using a fixed width, the `div` element can be centered using the\
    \ properties, `margin-left` and `margin-right`. If you fix the width and set the\
    \ margins to `auto`, the extra space on the margins is equally divided. It can\
    \ be done in the following manner:\n\n```css\n#container {\n  width: 850px;\n\
    \  margin-left: auto;\n  margin-right: auto;\n}\n```\n\n## CHAPTER 5: HTML5 EXPLAINED\n\
    \nThe chapter focuses on the basics of HTML5 and how they can be used for creating\
    \ high performance, new-generation pages. However, most of the elements explained\
    \ in that chapter included elements that HTML5 has received from its predecessors.\
    \ This chapter takes you a step further in your quest of learning HTML5, introducing\
    \ concepts that are newly added to this technology.\n\nIn the previous chapter\
    \ on CSS, we introduced the concept of `<div>` element to you. This element is\
    \ preferred over all its alternatives as far as page layout creation is concerned.\n\
    \nWhile some people also use the `<table>` element, it is usually not a recommended\
    \ solution as it is difficult to maintain as well use. However, both the concepts\
    \ are elaborated upon this chapter.\n\n### Semantic Markup\n\nThe `<div>` and\
    \ `<span>` elements are the most commonly used and recommended elements for positioning\
    \ and formatting content. However, it is recommended that you should use different\
    \ `<div>` elements for specifying different sections of the page like header and\
    \ footer. This shall allow you to position them individually and in a more organized\
    \ manner. Therefore, the W3C has named these new elements with names like `<footer>`\
    \ and `<header>`.\n\n### Browser Support\n\nIt is true that your HTML code will\
    \ not be read by any of your users. However, there are other tools and machines\
    \ that are constantly parsing your code. These tools include web crawlers, which\
    \ indexes webpages for searching and `NVDA` (Non-Visual Desktop Access) devices,\
    \ which are used by many users with special needs as an alternative for reading\
    \ and comprehending web pages. Therefore, they require you to use tags that are\
    \ understandable.\n\n### How to Create HTML5 Documents\n\nAlthough, the above\
    \ discussion clearly mentions the importance of using meaning tags and prohibits\
    \ the use of tags like `<div>` and `<span>`, you may still have to use them for\
    \ styling purposes. As you read on, you will realize how semantic tags must be\
    \ supplied for providing meaning to your tags. It is important to mention here\
    \ that semantic tags should be used carefully, and if you realize there is a need\
    \ to define custom elements, then go ahead and use the `<div>` and `<span>` elements.\n\
    \n### How to Create HTML5 Layout Container\n\nA layout container, as the name\
    \ suggests, is a container that entails the layout of a page. In other words,\
    \ the container contains the different sections of the layout in a manner. As\
    \ a developer, you can easily distinguish between `div` elements on the basis\
    \ of their class names and IDs. However, this is not true for browsers. Therefore,\
    \ there has to be a way by which you can ask the browser to interpret elements.\
    \ For instance, you may want to ask the browser to focus on a certain `div` element\
    \ upon opening. All this and more can be done with the help of layout containers\
    \ that express elements in such a manner that are understandable to both the browser\
    \ and the user.\n\nSome of the commonly used elements for creating a layout container\
    \ include:\n\n- `<header>`: Used to define the header section or the topmost section\
    \ of the HTML document.\n- `<footer>`: Used to define the footer section or the\
    \ bottom-most section of the HTML document.\n- `<nav>`: Used to define the section\
    \ that contains all the navigational links.\n- `<aside>`: Generally used for sidebars\
    \ and separates the content in the `<aside>` element from the content that is\
    \ outside this element.\n- `<section>`: Defines a part of the whole section and\
    \ is named with elements `<h1>` through `<h6>`.\n- `<article>`: Defines a complete\
    \ unit of content, which you can copy from one location to another. An example\
    \ of such a unit is a blog post.\n\n### Using Roles\n\nThe `role` attribute can\
    \ be declared inside the `<div>` and `<aside>` elements. The role class hierarchy\
    \ and the usage of roles for providing specific meanings, as far as far as accessibility\
    \ is concerned, is defined in `WAI-ARIA` (Web Accessible Initiative - Accessible\
    \ Rich Internet Applications).\n\nOne of the parent role classes is the landmark\
    \ role class, which defines the navigational landmarks on the webpage. The child\
    \ classes of the parent role class include: `banner`.\n"
