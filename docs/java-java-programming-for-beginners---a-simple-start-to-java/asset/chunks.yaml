    \n## 文件处理\n\n你在日常 I/O 编程中可能需要的所有类都包含在 `java.io` 包中。该包中的流泛泛代表了输出和输入位置。此外，Java 支持的流包括对象、基本数据类型和本地化字符。流可以简单地描述为排列成序列的数据。\n\
    \n虽然 `inputStream` 可以用于从源输入数据，而 `OutputStream` 可用于向汇点输出数据。Java 提供的 I/O 支持是灵活且广泛的。本似乎涵盖了\
    \ Java 文件处理的所有基本方面。\n\n### 字节流\n\nJava 中的字节流用于执行 8 位字节的输出和输入。尽管有许多与字节流标识的类，但最常用的类是\
