- fmt: "\nThis method returns a string, which is the concatenated, comma-separated\
    \ string containing all the values present in the array.\n\n### Note\n\n1. When\
    \ working with functions, you can pass the whole array (using the array name)\
    \ or a particular element of the array (using `array name[indexer]`).\n2. Array\
    \ elements can be modified by accessing the element using the indexer. For example,\
    \ `arrName[1] = ‘Danny’`; assigns the value ‘Danny’` to the second element of\
    \ the array.\n\n### DOM objects\n\nThe primary objects that you need to access\
    \ while building an application, are the DOM objects associated with it. This\
    \ access is necessary for you to control and get notified about events that are\
    \ occurring on the webpage.\n\nThe DOM is a representation of a hierarchy of objects.\
    \ These objects can be accessed using the `document` variable, which is built-in.\
    \ This variable references the DOM and performs a search, which may return an\
    \ active or static `NodeList`. While the active `NodeList` contains a list of\
    \ elements that keep changing, the static `NodeList` contains elements that do\
    \ not change over time. Since the retrieval of the static `NodeList` takes longer,\
    \ it is advisable to choose search methods that work with active `NodeList`.\n\
    \nThe search methods available for DOM include:\n\n#### `getElementById`\nThis\
    \ method returns a reference to the first element that has the specified ID.\n\
    \n#### `getElementsByTagName`\nThis method returns the active `NodeList`, which\
    \ has the specified tag name.\n\n#### `getElementsByName`\nThis method returns\
    \ the active `NodeList`, which has the specified name. This is a preferred method\
    \ for option buttons.\n\n#### `getElementsByClass`\nThis method returns the active\
    \ `NodeList`, which has the specified class name. However, this method is not\
    \ supported by Internet Explorer version 8 and earlier.\n\n#### `querySelector`\n\
    This method accepts CSS selector as parameter and return the first matched element.\
    \ However, this method is not supported by Internet Explorer version 7 and earlier.\n\
    \n#### `querySelectorAll`\nThis method accepts CSS selector as parameter and return\
    \ all the matched elements. Therefore, it returns a static `NodeList`. However,\
    \ this method is not supported by Internet Explorer version 7 and earlier.\n\n\
    ### Events\n\nIf you look at JavaScript as an engine, then events are what give\
    \ it the required spark.\n\nEvents can occur in two situations. The first type\
    \ of events are those that occur during user interactions. A user may click an\
    \ image or enter text. All these are classified as events.\n\nBesides this, changes\
    \ in state of the system are also considered an event. For instance, if a video\
    \ starts or stops, an event is said to have occurred. The DOM allows you to capture\
    \ events and execute code for the same.\n\nIn JavaScript, events are based on\
    \ the publish-subscribe methodology. Upon creation of an object, the developer\
    \ can publish the events that are related to this object. Moreover, event handlers\
    \ can be added to this object whenever it is used. The event handler function\
    \ notifies the subscribed events that the event has been triggered. This notification\
    \ includes information about the event like location of the mouse and key-presses,\
    \ in addition to several other details relevant to the event.\n\n#### Capturing\
    \ events\nThere may be situations when an event may be attached to a button click,\
    \ which may lie inside a hyperlink. In this situation, there is nesting of elements.\
    \ Therefore, the event, when triggered, is passed down the DOM hierarchy. This\
    \ process is called event capturing. However, once the event has reached the element,\
    \ this event is bubbled up the hierarchy. This process is called event bubbling.\
    \ This movement of the event across the hierarchy gives the developer an opportunity\
    \ to subscribe or cancel the propagation, on need basis.\n\n#### Subscribing to\
    \ event\nThe function, `addEventListener`, can be used for the subscription process.\
    \ This function requires three arguments, the event, the function that needs to\
    \ be called for the event and a Boolean value that determines if the function\
    \ will be called during the capture or bubble process (true – capture, false –\
    \ bubble). Mostly, this value is set to false. This is the preferred method for\
    \ subscription as it is mentioned in the W3C standard.\n\nSample Code:\n```javascript\n\
    var btn = document.getElementById(‘btnDownload’);\nbtn.addEventListener(‘click’,\
    \ initiateDownload, false);\n```\n\nHowever, other methods also exist, which include\
    \ giving an online subscription to the html tag. This subscribes the event to\
    \ the bubble process. The advantage of using this method is that it is the oldest\
    \ and most accepted method. therefore, you can be sure that this method will work,\
    \ regardless of what browser you are using. Please see the tag below to understand\
    \ how this can be done.\n\n```html\n<button id=‘btnDownload’ onclick=‘initiateDownload();’\
    \ >Download</button>\n```\n\nYou can also use the traditional subscription process\
    \ that uses JavaScript for subscribing the event:\n\n```javascript\nvar btn =\
    \ document.getElementById(‘btnDownload’);\nbtn.onclick = initiateDownload;\n```\n\
    \n#### Unsubscribing\nEvents can be unsubscribed using the function, `removeEventListener`,\
    \ which takes the same set of parameters as `addEventListener`. For the `btn`\
    \ variable used in the previous example, this can be done in the following manner:\n\
    \n```javascript\nvar btn = document.getElementById(‘btnDownload’);\nbtn.removeEventListener(‘click’,\
    \ initiateDownload, false);\n```\n\n#### How to cancel propagation?\nThe function,\
    \ `stopPropagation`, is used for performing this operation. This can be done in\
    \ the following manner:\n\n```javascript\nvar btn = document.getElementById(‘btnDownload’);\n\
    btn.addEventListener(‘click’, initiateDownload, false);\n\nfunction initiateDownload\
    \ (e){\n  //download\n  e.stopPropagation();\n}\n```\n\n#### How to prevent the\
    \ default operation?\nThis can be done by using the function, `preventDefault`,\
    \ in the following manner:\n```javascript\nvar hyperlink = document.getElementById(‘linkSave’);\n\
    hyperlink.addEventListener(‘click’, saveData, false);\n\nfunction saveData(e){\n\
    \  //save data\n  e.preventDefault();\n}\n```\n\nJavaScript also provides the\
    \ `this` keyword, which can be used if you wish to access the event causing element,\
    \ on a frequent basis.\n\n#### Window Event\nThe current browser window is represented\
    \ by the `window` variable, which is an instance of the Window object. The following\
    \ events are associated with this object: afterprint, beforeonload, beforeprint,\
    \ error, blur, haschange, load, message, focus, online, offline, pageshow, pagehide,\
    \ redo, popstate, storage, resize, unload, undo.\n\n#### Form Event\nThe actions\
    \ that occur inside an HTML form trigger the events: change, blur, focus, contextmenu,\
    \ forminput, formchange, invalid, input, submit, select.\n\n#### Keyboard Event\n\
    The keyboard triggers the following events: keyup, keypress, keydown.\n\n####\
    \ Mouse Event\nThe mouse triggers the following events: click, drag, drop, scroll,\
    \ dblclick, dragenter, dragstart, dragend, dragover, dragleave, mousemove, mousedown,\
    \ mouseover, mouseout, mousewheel, mouseup.\n\n#### Media Event\nMedia elements\
    \ like videos, images and audios also trigger events: canplay, abort, waiting,\
    \ durationchange, canplaythrough, ended, emptied, loadeddata, error, loadstart,\
    \ loadedmetadata, play, pause, progress, playing, ReadyState, ratechange, seeking,\
    \ seeked, suspend, stalled, volumechange, timeupdate.\n\n### CHAPTER 4: BASICS\
    \ OF CSS3\n\nCascading Style Sheets or CSS provide the presentation that webpages\
    \ are known for.\n\nAlthough, HTML is capable of providing a basic structure to\
    \ the webpage, CSS offers developers host of design options. Besides this, it\
    \ is fast and efficient, which makes it an all more popular design tool.\n\nCSS\
    \ is known to have evolved from SGML (Standardized Generalized Markup Language).\
    \ The goal of efforts made in this direction was to standardize the manner in\
    \ which web pages looked. The latest version of this technology is CSS3, which\
    \ is a collection of 50 modules.\n"
