    \n詹姆斯·高林（James Gosling）于 1991 年 6 月开始开发 Java 编程语言，用于他众多机顶盒创业项目之一。该编程语言最初被称为 `Oak`（橡树），这个名字源于\
    \ Gosling 办公室外的一棵橡树。后来，这个名字被改为 `Green`，并从字典中随机挑选的单词列表中重命名为 `Java`。\n\nSun 公司于\
    \ 1995 年发布了首个开放版本 `Java 1.0`。它保证了“一次编写，随运行”（WORA），在主流平台上提供了无成本的运行环境。2006 年 11\
    \ 月 13 日，Sun 公司根据 GNU 通用公共许可证（`GPL`）的条款将 `Java` 的大部分内容免费并开源。2007 年 5 月 8 日，Sun\
    \ 公司完成了这一程序，使 `Java` 的大部分核心代码变得免费且开源，除了 Sun 公司不拥有版权的一小部分代码外。\n\n## 前提条件\n\n为了运行和实验本书中的示例，你需要一台配备至少\
    \ 64 MB RAM 的 Pentium 200-MHz 机器。你还需要配套的编程平台：\n\n- 记事本或任何文字处理器\n- Java JDK 5\n\
    - Linux 7.1 或 Windows XP 或更高操作系统\n\n## Java - 基础语法\n\n一个基础的 Java 程序可以分为几个结构和元素。通常，它可以被描述为对象的集合，这些对象通过调用彼此的程序相互通信。以下是对象和类的基本定义：\n\
    \n### 类\n类可以被描述为蓝图，描绘了其对象的所有行为和状态。\n\n### 对象\n对象由两个组件组成，即方法和属性或变量。例如，如果你考虑小狗的例子，那么它具有以下属性或状态：`name`、`color`\
    \ 和 `breed`。此外，它还具有以下行为，包括汪汪、摇尾和消耗。任何对象无非是类的实例。\n\n### 实例变量\n每个对象都有一组变量。对象的状态是由程序执行期间分配给这些变量的属性组成的。\n\
    \n### 方法\n方法是方法的定义。此外，一个类可以包含许多方法。在这些方法中，逻辑等行为被编写，信息被控制，所有活动被执行。\n\n## 第一个 Java\
    \ 程序\n\n为了开始基础的 Java 编程，让我们来看这个标准的 Hello World 程序。\n\n```java\npublic class MyFirstJavaProgram\
    \ {\n    public static void main(String []args) {\n        System.out.println(\"\
    Say Hello World To The World!\");\n    }\n}\n```\n\n如你所示，程序在 `main()` 函数中使用单行代码，打印出“Hello\
    \ World!”的语句。但在在此之前，让我们看看你在执行该文件时必须遵循的步骤。\n\n1. 打开任何文本编辑器并将此代码粘贴到文件中。\n2. 以 `.java`\
    \ 扩展名保存文件。例如，你可以将文件保存为 `Sample.java`。\n3. 下一步是打开系统的命令提示符并将其切换到保存文件所在的目录。例如，如果你将文件保存在\
    \ `C:\\`，那么你必须将提示符切换到同一个目录。\n4. 为了编译代码，你必须输入：`javac Sample.java`\n5. 如果没有错误，将自动跳转到下一行。你现在可以使用以下命令执行代码：`java\
    \ Sample.java`\n\n你应该能在在屏幕上看到以下输出：\n\nSay Hello World To The World!\n\n## 基础语法\n\
    \n关于 Java 程序，记住以下几点至关重要。\n\n### 类名\n对于所有类名，第一个字母应当大写。如果使用几个单词来构建一个类名，那么每个内部单词的第一个字母都应当大写。例如，一个标准的类名如下：`class\
    \ Sampleclass`\n\n### 大小写敏感\nJava 是区分大小写的，这意味着标识 `Hi` 和 `hi` 在 Java 中具有不同的含义。\n\
    \n### 方法名\n所有系统名称都应该以小写字母开头。如果使用几个单词来构建方法名，那么每个内部单词的第一个字母都应当大写。这种惯的示例如下：`public\
    \ void mysamplemethod ()`\n\n### 文件名\n记录名称必须与类名精确匹配。在保存文件时，你应该使用类名进行保存。记住 Java\
    \ 是区分大小写的，并在名称末尾加上 `.java`。如果文件名和类名不匹配，系统将无法编译。\n\n考虑类名 `Sample` 的例子。在这种情况下，你必须将文件命名为\
    \ `sample.java`。\n\n`public static void main(string args[])`\nJava 系统处理从 `main()`\
    \ 函数开始，这是每个 Java 程序必不可少的部分。\n\n## Java 标识符\n\n所有 Java 组件都需要名称。用于类、变量和方法的名称被称为标识符。在\
    \ Java 中，关于标识符有几点需要记住。它们遵循以下标准：\n\n- 所有标识符都应当以字母开头（从 a 到 z）、下划线（`_`）或特殊字符（`$`）。\n\
    - 在第一个字符之后，标识符可以是任何字符。\n- 不能使用关键字作为标识符。\n- 最重要的是，标识符是区分大小写的。所以 `Sample` 不等于 `sample`。\n\
    \n标识符的示例包括 `$salary`、`age`。\n\n## Java 修饰符\n\n与其他编程语言一样，可以使用修饰符来修改类和方法。修饰符有两种：\n\
    \n- 访问修饰符：`public`、`default` 和 `private`\n- 非访问修饰符：`static`、`final` 和 `abstract`\n\
    \n我们将在后续章节研究更多关于修饰符的知识。\n\n## Java 变量\n\nJava 支持多种变量。这些变量类型包括：\n\n- 实例变量（非静态变量）\n\
    - 类变量（静态变量）\n- 局部变量\n\n## Java 数组\n\n数组是存储相同类型变量的连续内存位置。另一方面，数组本身是内存中的一个对象。我们将在研究如何声明、创建和实例化这些。\n\
    \n## Java 枚举\n\n枚举是在 Java 5.0 中作为包引入的。枚举限制变量只能具有一组预定义的属性。此标识列表中的属性被称为枚举。使用枚举可以减少代码中的错误数量。例如，如果我们考虑一个咖啡馆的应用程序，可以将杯子尺寸限制为特大、大号、中和小号。这将确保不允许请求菜单或应用程序列出的尺寸之外的尺寸。\n\
    \n请注意，枚举可以独立声明，也可以在类内部声明。此外，也可以在枚举体内创建方法、变量和构造函数。\n\n## Java 关键字\n\nJava 中的关键字或保留字如下表所示。根据规则，这些单词不能作为变量或常量的名称。\n\
    \n`assert`, `abstract`, `break`, `boolean`, `case`, `byte`, `char`, `catch`, `const`,\
    \ `class`, `default`, `continue`, `double`, `do`, `enum`, `else`, `final`, `extends`,\
    \ `float`, `finally`, `goto`, `for`, `implements`, `if`, `instanceof`, `import`,\
    \ `int`, `long`, `interface`, `new`, `native`, `private`, `package`, `protected`,\
    \ `return`, `public`, `static`, `short`, `super`, `strictfp`, `synchronized`,\
    \ `switch`, `throw`, `this`, `transient`, `throws`, `while`。\n\n"
