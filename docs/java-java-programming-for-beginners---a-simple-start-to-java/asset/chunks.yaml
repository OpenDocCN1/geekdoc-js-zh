    \n## Java 字面量\n\n`Java` 中的字面量量（Literal）是固定值的源代码表示。它们在代码中被具体地表述，不经过任何计算。字面量可以分配给任何原始类型的变量。例如：\n\
    \n```java\nbyte x = 86;\nchar x = “a”\n```\n\n`int`、`byte`、`short` 和 `long` 也可以以十六进制（16\
    \ 进制）、十进制（10 进制）或八进制（8 进制）数字框架表示。在使用这些数字框架表示字面量时，使用前缀 `0` 用于表示八进制，而前缀 `0x` 表示十六进制。例如，\n\
    \n```java\nint numd = 134;\nint numo = 0243;\nint numx = 0x95;\n```\n\n`Java`\
    \ 中的 `String` 字面量的确定方式与大多数其他编程语言一样，通过在双引号之间封装一组字符来确定。\n\n字符串字面量的示例为：\n\n“Hi Everyone”\
    \ “two\\nlines” “\"these characters are inside quotes\"”\n\n字符串类型的字面量可以包含任何 Unicode\
    \ 字符。例如：`String news = “\\u0001”`\n\n你也可以在 `Java` 中使用转义序列。以下是你可以使用的转义序列列表：\n\n\
    - 双引号 - `\"`\n- 回车 (0x0d) - `\\r`\n- 换行 (0x0a) - `\\n`\n- 单引号 - `'`\n- 退格 (0x08)\
    \ - `\\b`\n- 换页符 (0x0c) - `\\f`\n- 制表符 - `\\t`\n- 空格 (0x20) - `\\s`\n- 八进制字符 (ddd)\
    \ - `\\ddd`\n- 反斜杠 - `\\`\n- 十六进制 Unicode 字符 (xxxx) - `\\uxxxx`\n\n## 变量类型\n\n\
    变量为我们提供了代码可以控制的具名空间。`Java` 中的每个变量都有特定的类型，该类型决定了变量内存的大小和格式；存储在内存内存中的值范围；以及可以连接到变量的操作集合。在使用变量之前，你必须对所有变量进行显式声明。变量可以用以下方式声明：`Data\
    \ type <variable name>;`\n\n这里 `data type` 是 `Java` 的数据类型之一。另一方面，变量是与变量关联的名称或标识符。要声明多个指定类型的变量，你可以使用用逗号分隔的列表。以下是声明的几个示例：\n\
    \n以下声明声明了三个整数变量。\n\n```java\nint x, y, z;\n```\n\n同样，也可以声明其他数据类型的变量。\n\n`Java`\
    \ 支持三种类型的变量。这些类型如下：\n1. 类/静态变量\n2. 实例变量\n3. 局部变量\n\n## 局部变量\n\n局部变量在方法、构造函数或作用域中声明。\n\
    \n局部变量在进入构造函数或方法时创建，一旦离开方法、构造函数或作用域，该变量将被销毁。\n\n访问修饰符不能用于局部变量。\n\n局部变量仅在声明的方法、构造函数或作用域内部可见。\n\
    \n局部变量在栈级别执行。\n\n这些变量没有默认值。因此，局部变量在第一次使用之前必须被声明并分配一个初始值。\n\n### 示例实现：\n\n在这里，`age`\
    \ 是一个局部变量。它在 `pupage()` 方法内部被刻画，其作用范围仅限于此方法。\n\n```java\npublic class myTest{\n\
    \    open void newfunc(){\n        int myvar = 1;\n        myvar = myvar + 10;\n\
    \        System.out.println(“The value of myvar is: ” + myvar);\n    }\n    public\
    \ static void main(string args[]){\n        mytest = new myTest ();\n        mytest.myfunc();\n\
    \    }\n}\n```\n\n此代码执行的输出为：\n`The value of myvar is: 11`\n\n## 实例变量\n\n实例变量的声明在类内部进行。然而，它是在方法、构造函数或任何作用域之外创建的。\n\
    \n实例变量在使用 `new` 关键字创建对象时创建，在对象被销毁时销毁。\n\n当内存中为项目分配空间时，会为每个变量值创建一个空间。\n\n实例变量可以在类级别上在使用之前或之后声明。\n\
    \n实例变量持有必须被多个方法、构造函数或部分引用的值，或者对象表示的整个类中必须可用的关键部分。\n\n实例变量可以赋予访问修饰符。\n\n实例变量有默认值。对于数字，默认值是\
    \ 0。\n\n然而，对于布尔值，它是 false，对于对象引用，它是无效的。值可以在语句中或构造函数内部分配。\n\n实例变量对于类中的所有方法、构造函数和作用域都是可见的。通常，建议将这些变量设为私（访问级别）。\n\
    \n然而，可以使用访问修饰符为这些变量赋予子类可见性。\n\n实例变量可以通过调用变量名在类内部获取。\n\n以下语句可用于此目的：`Objectreference.varilename.`\n\
    \n### 示例实现：\n\n```java\nimport java.io.*;\n\npublic class Employerecord{\n   \
    \ public String empname;\n    private double empcompensation;\n    public Employee\
    \ (String name){\n        empname = name;\n    }\n    public void initsalary(double\
    \ empsalary){\n        empcompensation = empsalary;\n    }\n    public void printemployee(){\n\
    \        System.out.println(“Employee name : ” + empname);\n        System.out.println(“Employee\
    \ salary :” + empcompensation);\n    }\n    public static void main(string args[]){\n\
    \        Employerecord employee1 = new Employerecord(“Mary”);\n        employee1.initsalary(7500);\n\
    \        employee1.printemployee();\n    }\n}\n```\n编译执行交付：\n`Employee name :\
    \ Mary`\n`Employee salary :7500.0`\n\n## 类/静态变量\n\n类变量又称为静态变量，在类中使用 `static` 关键字声明，但在构造函数或方法之外。\n\
    \n无论创建多少对象，每个类都只有一个类变量的副本。\n\n静态变量很少用于定义的常量。\n\n常量是声明为 `private/public`、`static`\
    \ 和 `final` 的变量。\n\n常量不会从其初始值发生变化。\n\n静态变量存储在静态内存中。静态变量在系统启动时创建，在执行停止时销毁。\n\n\
    可见性与实例变量相同。在任何情况下，大多数静态变量声明为公共，因为它们对类的客户端可见的。\n\n这些变量的默认值与实例变量相同。对于数字，默认值通常是 0。然而，对于对象引用是无效的。值可以在语句中或构造函数内部分配。此外，值可以在唯一的静态初始化块中分配。\n\
    \n静态变量可以通过调用类名获取：`Classname.variablename.`\n\n当声明类变量为 `public static final` 时，变量名（常量）必须全部大写。此外，静态变量不是私有的，且命名规范与局部和实例变量相同。\n\
    \n### 示例实现：\n\n```java\nimport java.io.*;\n\npublic class Employerecord{\n   \
    \ private static double empcompensation;\n    public static final String empdept\
    \ = “HR “;\n    public static void main(string args[]){\n        empcompensation\
    \ = 7500;\n        System.out.println(empdept+” Compensation: ”+empcompensation);\n\
    \    }\n}\n```\n此代码的编译将创建随附的结果：\n`HR  Compensation: 7500.0`\n"
- fmt: "\nModifiers are catchphrases that you add to definitions to change their implications.\
    \ The Java programming language has a wide and mixed bag of modifiers, including\
    \ the accompanying:\n\n## Non-Access Modifiers\n\n## Java Access Modifiers\n\n\
    In order to utilize a modifier, you incorporate its catchphrase in the meaning\
    \ of a class, variable or method. The modifier goes before whatever is left of\
    \ the announcement.\n\n### Access Control Modifiers\nJava gives various access\
    \ modifiers to set access levels for classes, variables, routines and constructors.\
    \ The four right to gain access are:\n\n- `Private`: visible to the class.\n-\
    \ `Default`: visible to the bundle. No modifiers are required.\n- `Secured`: visible\
    \ to all subclasses and package.\n- `Public`: visible to the world.\n\n### Non\
    \ Access Modifiers\nJava gives various non-access modifiers to attain numerous\
    \ other usefulness.\n\n- `Static`: The `static` modifier for making class variables\
    \ and methods.\n- `Final`: The `final` modifier for concluding the executions\
    \ of classes, variables and methods.\n- `Abstract`: This modifier is used for\
    \ for creating abstract methods and classes.\n- `Volatile and Synchronized`: These\
    \ modifiers are typically used for threads.\n\n## Operators in Java\n\nThe operator\
    \ set in Java is extremely rich. Broadly, the operators available in Java are\
    \ divided in the following categories:\n\n- Relational Operators\n- Arithmetic\
    \ Operators\n- Logical Operators\n- Bitwise Operators\n- Misc Operators\n- Assignment\
    \ Operators\n\n## The Arithmetic Operators\n\nOperations in Java are used in essentially\
    \ the same manner as in algebra. They are used with variables for performing arithmetic\
    \ operations. Here is a list of arithmetic operators available in Java.\n\n| Operation\
    \ | Operator | Description |\n| :--- | :--- | :--- |\n| Addition | `+` | Adds\
    \ the values of two variables |\n| Subtraction | `-` | Subtracts the values of\
    \ two variables |\n| Multiplication | `*` | Multiplies the values of two variables\
    \ |\n| Division | `/` | Divides the values of two variables. The resultant value\
    \ is the the |\n| Modulus | `%` | remainder of division |\n| Increment | `++`\
    \ | Increases the value by 1 |\n| Decrement | `--` | Decreases the value by 1\
    \ |\n\n## The Relational Operators\n\nJava also supports several relational operators.\
    \ The list of relational operators that are supported by Java are given below.\n\
    \n| Operation | Operator | Description |\n| :--- | :--- | :--- |\n| Equal To |\
    \ `==` | Compares the values of two variables for equality |\n| Not Equal To |\
    \ `!=` | Compares the values of two variables for inequality |\n| Greater Than\
    \ | `>` | Checks if one value is greater than the other value |\n| Lesser Than\
    \ | `<` | Checks if one value is lesser than the other value |\n| Greater Than\
    \ Or Equal | `>=` | Checks if one value is greater than or equal to the other\
    \ value |\n| Lesser Than Or Equal | `<=` | Checks if one value is lesser than\
    \ or equal to the other value |\n\n## The Bitwise Operators\n\nThe bitwise operators\
    \ available in Java can be easily applied to a number of data types.\n\nThese\
    \ data types include `byte`, `short`, `long`, `int` and `char`. Typically, any\
    \ bitwise operator performs the concerned operation bit-wise. For instance, if\
    \ you consider the example of an integer `x`, which has the value `60`. Therefore,\
    \ the binary equivalent of `x` is `00111100`.\n\nConsider another variable `y`,\
    \ with the value `13` or `00001101`. If we perform the bitwise operation `&` on\
    \ these two numbers, then you will get the following result: `x&y = 0000 1100`\n\
    \nThe table shown below shows a list of bitwise operators that are available in\
    \ Java.\n\n| Operation | Operator | Description |\n| :--- | :--- | :--- |\n| BINARY\
    \ AND | `&` | Performs the AND operation |\n| BINARY OR | `\\|` | Performs the\
    \ OR operation |\n| BINARY XOR | `^` | Performs the XOR operation |\n| ONE’S COMPLEMENT\
    \ | `~` | Performs the complementation operation on a unary variable |\n| BINARY\
    \ LEFT SHIFT | `<<` | Performs the left shifting of bits |\n| BINARY RIGHT SHIFT\
    \ | `>>` | Performs the right shifting of bits |\n\nIn addition to the above mentioned,\
    \ Java also supports right shift zero fill operator (`>>>`), which fills the shifted\
    \ bits on the right with zero.\n\n## The Logical Operators\n\nLogical operators\
    \ are an integral part of any operator set. The logical operators supported by\
    \ Java are listed in the table below.\n\n| Operation | Operator | Description\
    \ |\n| :--- | :--- | :--- |\n| Logical AND | `&&` | Returns True if both the conditions\
    \ mentioned are true |\n| Logical OR | `\\|\\|` | Returns True if one or both\
    \ the conditions mentioned are true |\n| Logical NOT | `!` | Returns True if the\
    \ condition mentioned is False |\n\n## The Assignment Operators\n\nThere are following\
    \ assignment operators supported by Java language:\n\n| Operation | Operator |\
    \ Description |\n| :--- | :--- | :--- |\n| Simple assignment | `=` | Assigns a\
    \ value on the right to the variable in the left |\n| Add - assignment | `+=`\
    \ | Adds the value on the right to the value of the variable on the left and assigns\
    \ the resultant to the variable on the left |\n| Subtract assignment | `-=` |\
    \ Subtracts the value on the right to the value of the variable on the left and\
    \ assigns the resultant to the variable on the left |\n| Multiply - assignment\
    \ | `*=` | Multiplies the value on the right to the value of the variable on the\
    \ left and assigns the resultant to the variable on the left |\n| Divide - assignment\
    \ | `/=` | Divides the value on the right to the value of the variable on the\
    \ left and assigns the resultant to the variable on the left |\n| Modulus assignment\
    \ | `%=` | It takes the modulus of the LHS and RHS and assigns the resultant to\
    \ the variable on the left |\n| Left shift assignment | `<<=` | It takes the left\
    \ shift of the LHS and RHS and assigns the resultant to the variable on the left\
    \ |\n| Right shift assignment | `>>=` | It takes the right shift of the LHS and\
    \ RHS and assigns the assignment to the variable on the left |\n| Bitwise AND\
    \ assignment | `&=` | It takes the bitwise AND of the LHS and RHS and assigns\
    \ the resultant to the variable on the left |\n| Bitwise XOR assignment | `^=`\
    \ | It takes the bitwise XOR of the LHS and RHS and assigns the resultant to the\
    \ variable on the left |\n| Bitwise OR assignment | `|=` | It takes the bitwise\
    \ OR of the LHS and RHS and assigns the resultant to the variable on the left\
    \ |\n\n## Misc Operators\n\nIn addition to the above mentioned, there are several\
    \ other operators, which are supported by Java.\n\n### Conditional Operator (\
    \ ? :)\nThe conditional operator is a ternary operator that contains three operands.\
    \ Essentially, this operator is used for the evaluation of boolean expressions.\
    \ The operator tests the first operand or condition and if the condition is true,\
    \ then the second value is assigned to the variable. However, if the condition\
    \ is false, the third operand is assigned to the variable.\n\nThe syntax of this\
    \ operator is as follows:\n`variable a = (<condition>) ? valueiftrue : valueiffalse`\n\
    \n```\npublic class myTest {\n    public static void main(String args[]) {\n \
    \       int x, y;\n        x = 5;\n        y = (x == 5) ? 15: 40;\n        System.out.println(\"\
    y = \" + y);\n        y = (x == 34) ? 60: 95;\n        System.out.println(\"x\
    \ = \" + y);\n    }\n}\n```\nThe compilation and execution of this code shall\
    \ give the following result: y = 15 y = 95\n\n### instanceof Operator\nOnly object\
    \ reference variables can be used with this operator. The objective of this operator\
    \ is to check is an object is an instance of an exiting class. The syntax of this\
    \ operator is as follows:\n`(<object reference variable>) instanceof(<interface/class>)`\n\
    \n```java\npublic class myTest {\n    public static void main(String args[]) {\n\
    \        int x = 4;\n        boolean resultant = x instanceof int;\n        System.out.println(resultant);\n\
    \    }\n}\n```\nThe output of this code shall be true. This operator can also\
    \ be used in comparison. A sample implementation of this is given below:\n\n```java\n\
    class Animal {}\npublic class Monkey extends Animal {\n    public static void\
    \ main(String args[]) {\n        Animal newa = new Monkey();\n        boolean\
    \ resultant = newa instanceof Monkey;\n        System.out.println(resultant);\n\
    \    }\n}\n```\nThe output for this code will also be true.\n"
