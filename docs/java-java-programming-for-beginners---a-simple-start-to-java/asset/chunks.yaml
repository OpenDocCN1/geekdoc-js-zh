    Interfaces show up in packages, and their relating bytecode file must be in a
    directory structure that matches the name of the package.


    The bytecode of an interface shows up in a .class record.


    On the other hand, an interface is unique and different from a class in a few
    ways. These are:


    An interface does not contain any constructors.


    Interface cannot be instantiated


    Instance fields cannot be contained in an interface. It is a requirement of interfaces
    that the main fields in them must be final and static.


    It is a requirement that all of the methods must be abstract methods.


    An interface can extend different interfaces.


    A class does not access an interface. Actually, a class implements an interface.


    **Declaring Interfaces**


    In order to declare an interface, you must use the interface keyword. Here is
    a straightforward illustration that can be used for declaring an interface. The
    standard structure and order of statements that can be used for this purpose are
    as follows: import java.lang.*;


    public interface Interfacename {


    //Statements


    }


    Interfaces have the accompanying properties:


    An interface is verifiably dynamic. You don’t have to utilize the keyword abstract
    when declaring an interface.


    Each method in an interface is additionally dynamic, so the keyword abstract is
    not required.


    Methods in an interface are certainly public.


    Sample Implementation


    interface MyAnimal {


    public void eatinghabits();


    public void walkinghabits();


    }


    **Packages**


    Packages are utilized as a part of Java so as to avert naming clashes, to control
    access, to make seeking/placing and utilization of classes, interfaces, identifications
    and annotations less demanding, in addition to several others. A Package can be
    described as a collection of related types (classes, interfaces, counts and annotations)
    giving access security and name space administration.


    A few packages available in Java are::


    java.io – all the classes for output and input are available in this package java.lang
    – all the major classes are available in this package Developers can create their
    own packages or package collections of classes/interfaces, and so on. It is a
    decent practice to collect related classes executed by you so that a software
    engineer can undoubtedly discover that the interfaces, classes, annotations and
    counts can be connected. Since the package makes another namespace, there won’t
    be any name clashes with names in different packages. Utilizing packages, it is
    less demanding to give access control and it is likewise simpler to find the related
    classes.


    At the point when you create a package, you ought to pick a name and put a explanation
    with that name at the highest point of each source record that contains the classes,
    interfaces, lists, and annotation sorts that you need to incorporate in the package.
    The package declaration ought to be the first line in the source record. There
    can be one and


    only declaration in each one source record, and it applies to various sorts in
    the file. In the event that a declaration of interface is not utilized, then the
    interfaces, class, annotation and specifications will be put in a package, which
    will be unnamed.


