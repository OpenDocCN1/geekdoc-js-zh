    **CHAPTER 6: JAVASCRIPT AND JQUERY**


    You must have got a hang of the power of JavaScript already. In the chapter on
    JavaScript, you have already learnt how to create and adding JavaScript for making
    web pages dynamic. The biggest challenge of web development is to design webpage
    elements that can run just as well on any browser as different browsers provide
    support for different elements, making it difficult to find a common ground.


    This chapter takes you a step further in JavaScript development by teaching you
    how to create objects and use them. Besides this, it also introduces you to the
    concept of jQuery, which attempts at creating browser-compatible code. Although,
    it cannot promise 100%


    browser compatibility, but it certainly solves the day-to-day issues regarding
    the same.


    **How to Create JavaScript Objects**


    Anything from numbers to strings are objects in JavaScript. Therefore, it is essential
    to


    know how to create and deal with these effectively. The simplest way to create
    objects in JavaScript is using the object literal syntax. The following example
    illustrates how it is done.


    var customer1 = {


    yearOfBirth: 2000,


    name: ‘Alex’,


    getCustomerInfo: function () {


    return ‘Customer: ‘ + this.name + ‘ ‘ + this.yearOfBirth;


    }


    };


    This code creates an object customer1, with the data members, name and yearOfBirth
    and the member function getCustomerInformation. It is also important to note the
    use of *this* keyword, which accesses the values correctly being used or referenced
    for the object concerned.


    Besides this, you can also create objects dynamically using the new keyword. The
    methods inherited include:


    constructor


    isPrototypeOf


    hasOwnProperty


    toLocalString


    propertyIsEnumerable


    valueOf


    toString


    Once the object has been created, properties can be added to the same in the following


    manner:


    function getCustomer(myName, myYearOfBirth) {


    var newCust = new Object();


    newCust.name = myName;


    newCust.yearOfBirth = myYearOfBirth;


    newCust.getCustomerInfo = function () {


    return ‘Customer: ‘ + this.name + ‘ ‘ + this.yearOfBirth;


    };


    return newCust;


    }


    This code creates an object newCust dynamically. Several instances of this can
    be created in the following manner:


    var cust1 = getCustomer (‘Alex’, 1978);


    var cust2 = getCustomer (‘David’, 1986);


    Although, JavaScript doesn’t support a particular keyword ‘class’, but you can
    simulate classes using the method mentioned above.


    **Namespaces**


    There is no specific keyword like *namespace* for implementing namespaces. However,
    namespaces can be implemented using the concepts of classes and objects. If you
    classify variables and methods into objects and access them as instances of these
    objects, then you are placing only the names of these objects in the global namespace,
    reducing the scope of the variables to the object that they belong.


    **Implementing Inheritance**


    You can define ‘is-a’ relationships between objects in JavaScript by creating
    objects and then classifying those objects on the basis of their common characteristics.
    For instance, if you are implementing an object for employee of a company. You
    can create objects for specific types of objects like managerTechnical, managerGeneral,
    technicalStaff, recruitmentStaff and officeStaff and then classify them into objects,
    technicalStaff, which includes the objects managerTechnical and technicalStaff,
    and adminStaff, which includes the managerGeneral, recruitmentStaff and officeStaff.
    In a similar manner, new functions can also be defined.


    **Working with jQuery**'
