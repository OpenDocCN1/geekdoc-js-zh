    \ *formidable* 包：`npm install`\n\n此命令在本地安装包。因此，你需要在 `myApp.js` 中添加一行允许文件引用该包：`var\
    \ formidable = require('formidable');`\n\n5. 示例 `myApp.js` 文件应该像这样所示：\n```javascript\n\
    var express = require('express');\nvar app = express();\nvar formidable = require('formidable');\n\
    app.use('/forms', express.static(__dirname + '/public'));\napp.post('/SubmitHeyPost',\
    \ function (request, response) {\n  if (request.method.toLowerCase() == 'post')\
    \ {\n    var form = new formidable.IncomingForm();\n    form.parse(request, function\
    \ (err, files) {\n      // processing logic\n    });\n  }\n});\n// ... remaining\
    \ logic\n```\n\n"
- fmt: "\nThis type of web services is also referred to as big web services. An example\
    \ of such services is `WCF` or `Windows Communication Foundation`. Arbitrary web\
    \ services expand their realm of operations by not mapping their operations to\
    \ only aspects of the protocol.\n\nAs a result, they provide more functionality,\
    \ which include many security mechanisms and message routing.\n\nThis type of\
    \ web services possess a typical interface format, which can be used by the client\
    \ for reading and parsing information. As a result, the client can make calls\
    \ to the service immediately. A common API format is the `Web Services Description\
    \ Language` (`WSDL`). In case of arbitrary web services, the client must assemble\
    \ its request with the help of a `SOAP` (`Simple Object Access Protocol`) message.\
    \ This web service does not use the `HTTP` protocol and instead uses the `TCP`.\n\
    \n### How to Create RESTful Web Service using Node.js\n\nIn the example mentioned\
    \ previously, the `samplePackage` can be exposed as web service.\n\nThe `GET`\
    \ method can be used on the package and the operation is passed as a parameter.\
    \ A good RESTful implementation of this package can look something like this:\
    \ `http://localhost:8080/samplePackage?operation=add&x=1&y=5`\n\n### How to Use\
    \ AJAX to Call Web Service\n\nWeb services can be called asynchronously using\
    \ `AJAX`, which is in actuality a `JavaScript`. Instead of making a call to the\
    \ server and repainting the HTML document, `AJAX` just calls back to the server.\
    \ In this case, the screen is not repainted. A sample implementation is given\
    \ below:\n\nA `MyPage.html` can be created with the following code:\n\n```html\n\
    <!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n  <title></title>\n\
    \  <script type=\"text/javascript\" src=\"/scripts/jquery-1.8.2.min.js\"></script>\n\
    \  <script type=\"text/javascript\" src=\"/scripts/default.js\"></script>\n</head>\n\
    <body>\n  <form id=\"myForm\">\n    Enter Value of X:<input type=\"text\" id=\"\
    x\" /><br />\n    Enter Value of Y:<input type=\"text\" id=\"y\" /><br />\n  \
    \  Result of Operation: <span id=\"result\"></span><br />\n    <button id=\"btnAdd\"\
    \ type=\"button\">Add the Numbers</button>\n  </form>\n</body>\n</html>\n```\n\
    \nThe `default.js` file must be modified to contain the code required for processing\
    \ these functions. Be sure to check the version of `jQuery` and whether it matches\
    \ the version name that you have mentioned in your `default.js` file. The `<form>`\
    \ element used here is only a means of arranging the format of data and the data\
    \ is not actually sent via the form to the server. The `JavaScript` and `jQuery`\
    \ access the data entered and perform the `AJAX` call.\n\n### How to Use XMLHttpRequest\n\
    \nThe object that actually makes an `AJAX` call is `XMLHttpRequest`, which can\
    \ be used for sending/receiving XML and other types of data. This object can be\
    \ used in the following manner:\n\n```javascript\nvar xmlhttp=new XMLHttpRequest();\n\
    xmlhttp.open(\"GET\",\" \"/add?x=50&y=1\",false);\nxmlhttp.send();\nvar xmlDoc=xmlhttp.responseXML;\n\
    ```\n\nThe first line creates the object while the second line sets up the use\
    \ of `GET` method with the specified `QueryString` and the use of `'false'` indicates\
    \ that the operation must be performed asynchronously. The next line sends the\
    \ request and the last line sets the response to a variable, which can be later\
    \ read and parsed for processing the response.\n\nHowever, the output generated\
    \ is `JSON` and not `XML`, therefore the `default.js` file must be changed to:\n\
    \n```javascript\n$(document).ready(function () {\n  $('#btnAdd').on('click', addTwoNum)\n\
    });\n\nfunction addTwoNum() {\n  var x = document.getElementById('x').value;\n\
    \  var y = document.getElementById('y').value;\n  var result = document.getElementById('finalResult');\n\
    \  var xmlhttp = new XMLHttpRequest();\n  xmlhttp.open(\"GET\", \"/add?x=\" +\
    \ x + \"&y=\" + y , false); \n  xmlhttp.send();\n  var jsonObject = JSON.parse(xmlhttp.response);\n\
    \  result.innerHTML = jsonObject.result;\n}\n```\n\nThe code extracts the `x`\
    \ and `y` values from the `<input>` element for the same. After this, the `XMLHttpObject`\
    \ is created and the `open` method is called using the `QueryString`. After the\
    \ execution of the `send` function, the response string is parsed. In order to\
    \ test the page, you can give the command:\n\n```bash\nnode app\n```\n\nThis command\
    \ starts the web service, after which you can open the browser window with the\
    \ link: `http://localhost:8080/SamplePage.html`\n\nthis code is operational now.\
    \ However, you may wish to perform the `AJAX` call in an asynchronous manner.\
    \ For this, you must locate the `open` method and change the `'false'` parameter\
    \ to `'true'`. Besides this, you will also be required to subscribe to `onreadystateschange`\
    \ for managing asynchronous call. This can be implemented in the following manner:\n\
    \n```javascript\nfunction addTwoNum () {\n  var a = document.getElementById('a').value;\n\
    \  var b = document.getElementById('b').value;\n  var result = document.getElementById('finalResult');\n\
    \  var xmlhttp = new XMLHttpRequest();\n  xmlhttp.onreadystatechange = function\
    \ () {\n    if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {\n      var\
    \ jsonObject = JSON.parse(xmlhttp.response);\n      result.innerHTML = jsonObject.result;\n\
    \    }\n  }\n  xmlhttp.open(\"GET\", \"/add?a=\" + a + \"&b=\" + b , true);\n\
    }\n```\n\nThe states are:\n0 - Uninitialized\n1 - Loaded\n2 - Interactive\n4 -\
    \ Completed\n"
