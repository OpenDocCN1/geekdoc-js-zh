  trans: "\n\n这种类型的 Web 服务也被大型 Web 服务。此类服务的示例是 `WCF` 或 `Windows Communication Foundation`（Windows\
    \ 通信框架）。任意 Web 服务通过不将其操作仅映射到协议的某些方面，扩展了其运行范围。\n\n因此，它们提供了更多功能，包括许多安全机制和消息路由。\n\
    \n这种类型的 Web 服务具有典型的接口格式，客户端可以使用它来读取和解析信息。因此，客户端可以立即调用该服务。一种常见的 API 格式是 `Web Services\
    \ Description Language`（`WSDL`）。对于任意 Web 服务，客户端必须在 `SOAP`（简单对象访问协议）消息的帮助下组装其请求。这种\
    \ Web 服务不使用 `HTTP` 协议，而是使用 `TCP`。\n\n### 如何使用 Node.js 创建 RESTful Web 服务\n\n在之前提到的示例中，`samplePackage`\
    \ 可以暴露为 Web 服务。\n\n可以在该包上使用 `GET` 方法并将操作作为参数传递。该包的一个良好 RESTful 实现可能像这样：`http://localhost:8080/samplePackage?operation=add&x=1&y=5`\n\
    \n### 如何使用 AJAX 调用 Web 服务\n\n可以使用 `AJAX` 异步调用 Web 服务，`AJAX` 实际上是 `JavaScript`。`AJAX`\
    \ 并不是向服务器调用并重绘 HTML 文档，而是直接回调服务器。在这种情况下，屏幕不会重绘。下面给出了一个示例实现：\n\n可以使用以下代码创建一个 `MyPage.html`：\n\
    \n```html\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n\
    \  <title></title>\n  <script type=\"text/javascript\" src=\"/scripts/jquery-1.8.2.min.js\"\
    ></script>\n  <script type=\"text/javascript\" src=\"/scripts/default.js\"></script>\n\
    </head>\n<body>\n  <form id=\"myForm\">\n    Enter Value of X:<input type=\"text\"\
    \ id=\"x\" /><br />\n    Enter Value of Y:<input type=\"text\" id=\"y\" /><br\
    \ />\n    Result of Operation: <span id=\"result\"></span><br />\n    <button\
    \ id=\"btnAdd\" type=\"button\">Add the Numbers</button>\n  </form>\n</body>\n\
    </html>\n```\n\n必须修改 `default.js` 文件以包含处理这些功能所需的代码。务必检查 `jQuery` 的版本以及它是否与你在 `default.js`\
    \ 文件中提到的版本名称匹配。此处使用的 `<form>` 元素仅用于排列数据格式的方法，数据实际上并没有通过表单发送到服务器。`JavaScript` 和\
    \ `jQuery` 访问输入的数据并执行 `AJAX` 调用。\n\n### 如何使用 XMLHttpRequest\n\n实际执行 `AJAX` 用的对象是\
    \ `XMLHttpRequest`，它可以用于发送/接收 XML 以及其他类型的数据。该对象可以使用以下方式使用：\n\n```javascript\n\
    var xmlhttp=new XMLHttpRequest();\nxmlhttp.open(\"GET\",\" \"/add?x=50&y=1\",false);\n\
    xmlhttp.send();\nvar xmlDoc=xmlhttp.responseXML;\n```\n\n第一行创建对象，第二行设置使用带有指定 `QueryString`\
    \ 的 `GET` 方法，使用 `'false'` 表示操作必须同步方式执行。下一行发送请求，最后一行将响应设置给变量，稍后可以读取并解析以处理响应。\n\n\
    然而，生成的输出是 `JSON` 而不是 `XML`，因此 `default.js` 文件必须更改为：\n\n```javascript\n$(document).ready(function\
    \ () {\n  $('#btnAdd').on('click', addTwoNum)\n});\n\nfunction addTwoNum() {\n\
    \  var x = document.getElementById('x').value;\n  var y = document.getElementById('y').value;\n\
    \  var result = document.getElementById('finalResult');\n  var xmlhttp = new XMLHttpRequest();\n\
    \  xmlhttp.open(\"GET\", \"/add?x=\" + x + \"&y=\" + y , false); \n  xmlhttp.send();\n\
    \  var jsonObject = JSON.parse(xmlhttp.response);\n  result.innerHTML = jsonObject.result;\n\
    }\n```\n\n代码从 `<input>` 元素提取了 `x` 和 `y` 值。之后，创建了 `XMLHttpObject` 并使用 `QueryString`\
    \ 调用 `open` 方法。在执行 `send` 函数后，解析响应字符串。为了测试页面，你可以输入命令：\n\n```bash\nnode app\n```\n\
    \n该命令启动 Web 服务，之后你就可以使用链接打开浏览器窗口：`http://localhost:8080/SamplePage.html`\n\n这段代码现在可以运行了。但是，你可能希望以异步方式执行\
    \ `AJAX` 调用。为了实现，你必须找到 `open` 方法并将 `'false'` 参数更改为 `'true'`。此外，你还需要订阅 `onreadystateschange`\
    \ 来管理异步调用。这可以通过以下方式实现：\n\n```javascript\nfunction addTwoNum () {\n  var a = document.getElementById('a').value;\n\
    \  var b = document.getElementById('b').value;\n  var result = document.getElementById('finalResult');\n\
    \  var xmlhttp = new XMLHttpRequest();\n  xmlhttp.onreadystatechange = function\
    \ () {\n    if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {\n      var\
    \ jsonObject = JSON.parse(xmlhttp.response);\n      result.innerHTML = jsonObject.result;\n\
    \    }\n  }\n  xmlhttp.open(\"GET\", \"/add?a=\" + a + \"&b=\" + b , true);\n\
    }\n```\n\n状态有：\n0 - 未初始化\n1 - 已加载\n2 - 交互完成\n4 - 已完成\n\n"
