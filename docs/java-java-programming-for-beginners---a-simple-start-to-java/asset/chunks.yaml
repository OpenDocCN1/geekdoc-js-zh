    此外，在 `default` 情况中也使用 `break` 语句也是一种良好的习惯。


    ### 注意

    如果你想确定一个关键字是否已分配了值，可以使用以下代码：


    ```javascript

    if(c)

    {

    //code

    }

    else

    {

    //code

    }

    ```


    如果变量 `c` 已经分配了一个非空值，则 `if` 条件为真并执行相应的代码。相反，如果变量 `c` 的值为 `undefined` 或 `null`，则执行
    `else` 结构中的代码。


    ### 注意

    以下条件的值将始终为真：

    - `”” == 0`

    - `null == undefined`

    - `''123'' == 123`

    - `false == 0;`


    请注意，JavaScript 会在进行比较时转换相关变量的类型以保持兼容性。然而，如果你想同时比较两个变量的值和类型，JavaScript 提供了另一组运算符，`===`
    和 `!==`。当使用此运算符对上述示例中提到的值进行比较时，结果将始终为 `false`。


    ### 实现代码循环

    循环是任何编程语言中重要且常用的结构。当你需要执行指定次数的同一组指令时，会遇到几种情况。为了实现这种场景，必须使用循环。JavaScript 中提供的循环结构包括
    `for`、`while` 和 `do-while`。


    `while` 循环包含一个条件，只要条件保持为真，循环就会执行。`do–while` 循环是 `while` 循环的修改。如果 `while` 中的条件为假，`while`
    循环将完全不执行。相反，即使 `while` 条件为假，`do-while` 循环至少执行一次。


    `while` 循环的语法：

    ```javascript

    while(condition)

    {

    //code

    }

    ```


    `do-while` 循环的语法：

    ```javascript

    do

    {

    //code

    }

    while(condition)

    ```


    JavaScript 中最后一种循环类型是 `for` 循环。`for` 循环允许你在同一语句中初始化循环变量、检查条件并修改循环变量。


    语法：

    ```javascript

    for(initialize; condition; modify)

    {

    //code

    }

    ```


    示例代码：

    ```javascript

    for(i=0; i<10; i=i+1)

    {

    //code

    }

    ```

