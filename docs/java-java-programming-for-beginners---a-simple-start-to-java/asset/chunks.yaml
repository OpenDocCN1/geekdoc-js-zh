  raw: 'JavaScript keywords are reserved and cannot be used.


    Please note that JavaScript, unlike HTML is case sensitive. Therefore VAL and
    val are two different variables. Also, it is recommended that the variable name
    should be such that it describes the purpose for which it is being used. For example,
    if we name a variable result, it is evident that this variable will contain the
    result value computed by the code.


    Another convention used in JavaScript is to name variables such that the first
    letter of the variable name is lowercase. However, every subsequent word in variable
    name starts with a capital letter. An example of this is the variable name, arrayResult.
    Besides this, the use


    of underscore and dollar sign is discouraged. However, they are used in jQuery
    objects.


    ***Environment***


    A complete set of variables and the values they contain form what is called the
    environment. Therefore, whenever you load a new webpage in the browser, you are
    creating a new environment. If you take the example of Windows 8, it creates an
    environment when an application starts and the same is destroyed when the application
    ends.


    ***Functions***


    A set of statements that solve a purpose are referred to as a function. The purpose
    of using functions is code reuse. If your program uses functionality multiple
    times in the program, then it is implemented as a function, which can be called
    as and when required. Since, a function is to be called from within the code,
    parameters can be sent to the function from the code. Upon execution, the function
    returns a value to the calling function. The syntax for function declaration and
    definition is as follows:


    function multiply(a, b){


    return a*b;


    }


    The name of the function must always be preceded with the keyword function. The
    variables a and b are parameters passed into the function and the function return
    the value obtained by computing a*b. This is a simple function, but you can implement
    complex and large function depending upon the functionality desired.


    Now that you have implemented the function, you must be wondering as to how the
    function is called. Here is an example:


    var x=2;


    var y=5


    var c=multiply(x, y);


    Here, x and y are arguments that the function multiply will receive as parameters.


    JavaScript is a loosely typed language. What that means is that if you pass more
    arguments to a function than what it is expecting, the system simply uses the
    first n arguments required and discards the rest. The advantage of this functionality
    is that you can use already implemented functions and pass the extra argument
    to scale the function and add functionality to it. On the other hand, you will
    not be able to get any indication of error if you unintentionally pass the wrong
    number of arguments.


    JavaScript also provides some built-in functions for interacting with the user.
    These functions are as follows:


    alert


    This function raises an alert with a message and the system resumes operation
    after the user clicks on the OK button. Sample implementation:


    alert(‘Alert message!’);


    prompt


    This function presents a textbox to the user and asks him or her to give input.
    You can supply the default value in the presented textbox and the user can click
    on the OK button to accept that the value entered is correct. Sample implementation:
    var result = prompt(‘Enter a value’, ‘default value’);


    confirm


    This message gives the user the choice to OK or CANCEL an action. Sample implementation:


    var result = confirm(‘Do you wish to proceed?’); *Function Scope*


    Each variable that you declare possesses a scope of operation, which is the function
    within which the variable has been declared. This is called the local scope. Unlike,
    many other languages, which define local scope by the curly braces within which
    the variable lies, JavaScript’s local scope is same as function scope.


    In addition to this, JavaScript also supports the concept of global scope, in
    which variables can be declared global and thus, can be used anywhere in the program.


    *Nesting Functions*


    Functions can be nested at any level. In other words, a function can be called
    from within another function, which could have been called from a different function.
    However, it is important to note that the scope of variable is within the function
    in which they are declared.


    ***Conversion of One Data Type to Another***


    The prompt function discussed in the previous function returns a string. However,
    you had asked the user to enter a number. In such a scenario, a string to number
    conversion may be required. In JavaScript, a variable can be converted from one
    type to another using the following functions:


    Number Function


    This function converts the object supplied to it into number data type. However,
    if the function is unable to perform the conversion, *NaN* is returned.


    String Function


    This function converts the object supplied to it into string data type.


    ***Conditional Programming***


    While writing code, you will faced with several situation where you need to execute
    a different set of instructions if the condition is true and another set of instructions
    if the same is false.


    *if-else*


    In order to implement such scenarios, you can use the if-else construct.


    Syntax:


    If(condition)


    {


    //code


    }


    else


    {


    //code


    }


    Consider a scenario in which you ask the user to enter his or her age using prompt
    function. Now, you must validate if the age is a valid number, before performing
    any computation on the value supplied. This is an ideal scenario of implementing
    conditional programming. Sample implementation for this scenario is:


    var userAge = prompt(‘Enter your age: ’, ‘’);


    if(isNaN(userAge))


    {


    alert(‘Age entered is invalid!’);


    }


    else


    {


    //code


    }


    In this sample code, the if clause checks if the entered value is a number. If
    the condition is true, that is the object entered is not a number, the user is
    given an alert message.


    However, if the condition is false, the code for else is executed.


    It is important to note here that for single statements, it is not necessary to
    use curly braces. The above mentioned code can also be written as:


    var userAge = prompt(‘Enter your age: ’, ‘’);


    if(isNaN(userAge))


    alert(‘Age entered is invalid!’);


    else


    //code


    However, it is a good practice to use curly braces as there is scope of adding
    additional code later on.


    *if-else if*


    Another conditional programming construct is if-else if construct. This construct
    allows you to declare multiple conditions and the actions associated with them.
    The syntax is: if(condition)


    {


    //code


    }


    else if(condition)


    {


    //code


    }


    else


    {


    //code


    }


    *Switch*


    Multiple else ifs can be implemented using this construct. The execution overhead
    is high for this conditional programming construct as conditions are sequentially
    checked for validity. As an alternative, another keyword, switch, is available,
    which implements multiple conditions in the form of a jump table. Therefore, the
    execution overhead for switch is lesser than that of if-else if.


    Sample implementation:


    var userChoice = prompt(‘Choose an alphabet: a, b, c’, ‘e’); switch (userChoice)
    {


    case ‘a’:


    alert(‘a chosen\n’);


    break;


    case ‘b’:


    alert(‘b chosen\n’);


    break;


    case ‘c’:


    alert(‘c chosen\n’);


    break;


    default:


    alert(‘None of the alphabets chosen\n’);


    break;


    };


    The switch construct matches that value entered by the user with the values presented
    in the cases. If a matching value is found, the case is executed. However, in
    case, none of the case values match the entered input, the default case is executed.
    Besides this, you can also use conditions in case values and the case for which
    the condition holds true is executed.


    If you do not use the break statement after the code of a case, all the cases
    following the matching case will be executed. For example, if the user enters
    ‘b’ for the above example and there are no break statements after the case code,
    then the output will be: b chosen


    c chosen


    None of the alphabets chosen'
