  trans: "\n\n在情况下，如果你希望用户定义的样式表覆盖 HTML 页面中指定的任何其他样式，可以使用 `!important` 修饰符。该修饰符为指定的样式语句设置最高优先级。示例实现：\n\
    \n```css\nbody {\n  color: white !important;\n}\n```\n\n## 样式级联\n\n样式的优先级和顺序是以下参数决定的。\n\
    \n- 重要性 (Importance)\n- 特性 (Specificity)\n- 文本顺序 (Textual Order)\n\n## 使用 CSS\
    \ 属性\n\n既然你已经熟悉选择器的用法，下一步是查看 CSS 属性。\n\n### 颜色\n\n网页最重要的属性之一是颜色，可以使用 ARGB、RGB\
    \ 和颜色名称定义。`RGB` 值通常使用小数定义，范围在 0-255 之间。\n\n- `white #ffffff`\n- `red #ff0000`\n\
    - `black #000000`\n- `green #008000`\n\n颜色值也可以代替颜色名称。下面给出了这种用法的一个示例。\n\n```css\n\
    body {\n  color: #ffffff;\n}\n```\n\n指定颜色的另一种方法是使用 `RGB` 函数，它使用 0-255 之间的数字或百分比来指定参数值。此类声明的示例所示：\n\
    \n```css\nh1 { color: rgb(255,0,0); }\n```\n\n指定颜色的其他方法是 `RGBA`（接受 4 个值）和 `HSL`（定义色调、饱和度和亮度）。\n\
    \n### 透明度\n\n透明度或不透明度由 `0.0`（不可见）到 `1.0`（不透明）之间的值定义。\n\n### 文本\n\n至于文本，可以指定 `font-face`\
    \ 和 `font-size`。这些属性可以用以下方式定义：\n\n```css\nh1 { font-family: arial, verdana, sans-serif;\
    \ }\nh1 { font-size: 12px; }\n```\n\n## CSS 盒模型\n\n`CSS Box Model` 假设网页可以被是由盒子组成的。盒子之间的间距由外边距（margins）和内边距（padding）设置给出。这些属性可以用以下方式赋值：\n\
    \n```css\nmargin: 15px;\npadding: 25px;\nborder: 10px;\n```\n\n### 定位 `<div>`\
    \ 元素\n\n用于创建页面布局的元素是 `<div>`。虽然 HTML5 建议使用语义化标记代替 `div` 元素，但它们仍用于无法使用语义化标记进行样式的内容。`div`\
    \ 元素可以被想象为一个矩形块，并按以下方式声明：\n\n```html\n<div>\n  <!--其他元素包含在此区域内-->\n</div>\n```\n\
    \n用于定义 `div` 元素位置的属性包括：可以使用 `top`、`bottom`、`left` 和 `right` 属性以像素单位定义 `div` 元素的位置。\n\
    \n属性 `position` 用于定义指定的位置是静态的（static）还是相对的（relative）。\n\n`float` 属性允许元素向右或向左浮动，定义为\
    \ `float: left` 或 `float: right`。`clear` 属性在浮动元素之后放置一个清除元素。\n\n你还可以通过 `box-sizing`\
    \ 属性改变浏览器计算宽度的方式。该属性可以取三个值：`content-box`（默认设置）、`border-box` 和 `padding-box`。\n\
    \n### 居中内容\n\n如果你使用固定宽度，可以使用 `margin-left` 和 `margin-right` 属性居中 `div` 元素。如果你固定宽度并将边缘设置为\
    \ `auto`，边距的额外空间将平均平分。可以通过以下方式实现：\n\n```css\n#container {\n  width: 850px;\n \
    \ margin-left: auto;\n  margin-right: auto;\n}\n```\n\n## 第 5 章：HTML5 详解\n\n本章重点介绍\
    \ HTML5 的基础知识以及如何使用它们创建高性能的新一代页面。然而，该章节解释的大多数元素包含了 HTML5 从其前身中继承的元素。本章将你在学习 HTML5\
    \ 的道路上更进一步，引入了该技术新增的概念。\n\n在上一关于 CSS 的章节中，我们向你引入了 `<div>` 元素的概念。在创建页面布局方面，该元素优于其所有的替代方案。\n\
    \n虽然一些人也使用 `<table>` 元素，但它通常不是推荐的解决方案，因为它难以维护和使用。然而，这两个概念将在本章中进行详细阐述。\n\n### 语义化标记\n\
    \n`<div>` 和 `<span>` 元素是定位和格式化内容最常用且推荐的元素。然而，建议使用不同的 `<div>` 元素来指定页面的不同部分，如头部（header）和页脚（footer）。这将允许你单独且组织地对它们进行定位。因此，W3C\
    \ 为这些新元素命名为如 `<footer>` 和 `<header>` 等名称。\n\n### 浏览器支持\n\n你的 HTML 代码不会被你的任何用户读取。但是，还有其他工具和机器不断解析你的代码。这些工具包括用于搜索索引网页的网络爬虫，以及\
    \ `NVDA`（非视觉桌面访问）设备，它被许多特殊需求的用户作为阅读和理解网页的替代方案。因此，它们要求你使用可理解的标签。\n\n### 如何创建 HTML5\
    \ 文档\n\n尽管上述讨论明确提到了使用语义标记的重要性并限制了对 `<div>` 和 `<span>` 等标签的使用，但你可能仍将它们用于样式目的。在继续阅读时，你会意识到必须为标记提供含义。如果你意识到需要定义自定义元素，请继续使用\
    \ `<div>` 和 `<span>` 元素。\n\n### 如何创建 HTML5 布局容器\n\n布局容器正如其名，是布局的容器。也就是说，容器以某种方式包含了布局的不同部分。作为开发者，你可以根据类名和\
    \ ID 区分 `div` 元素。然而，对于浏览器并非如此。因此，必须有一种方式可以请求浏览器解释元素。例如，你可能希望浏览器在打开时关注某个 `div`\
    \ 元素。这一切以及更多可以通过布局容器来实现，以浏览器和用户都能理解的方式表达元素。\n\n创建布局容器的常用元素包括：\n\n- `<header>`：用于定义文档的头部部分或顶部。\n\
    - `<footer>`：用于定义文档的页脚部分或底部。\n- `<nav>`：用于定义包含所有导航链接的部分。\n- `<aside>`：通常用于侧边栏，并将\
    \ `<aside>` 元素的内容与外部内容隔离开。\n- `<section>`：定义整个部分的一部分，并使用 `<h1>` 到 `<h6>` 元素命名。\n\
    - `<article>`：定义的内容单元，你可以从一个位置复制到另一个位置。此类单元的示例是博客文章。\n\n### 使用角色\n\n`role` 属性声明在\
    \ `<div>` 和 `<aside>` 元素内部。角色层级结构以及使用角色提供特定含义（就可访问性而言）定义在 `WAI-ARIA`（Web 可访问倡议\
    \ - 丰富互联网应用程序）中。\n\n父角色类之一是地标角色类，它定义了网页上的导航地标。父角色类的子类包括：`banner`。\n\n"
- fmt: "\nThis defines website specific content that is not expected to change from\
    \ one webpage to another like headers.\n\n`application`\nThis defines that the\
    \ specified area is a web application.\n\n`contentinfo`\nThis defines the information\
    \ included in the webpage about the webpage like copyright information. This information\
    \ is mostly a part of the footer content.\n\n`complementary`\nThis defines a section\
    \ of the page that is meaningful when detached from the page as well.\n\n`main`\n\
    The main web page content is defined using this child role class.\n\n`form`\n\
    This defines the area of the webpage that is expected to take webpage inputs.\n\
    \n`search`\nThis child role class is used to define the location on the webpage\
    \ that is used for getting the search query from the user and displaying the results\
    \ of the search.\n\n`navigation`\nThe area containing navigational links is a\
    \ part of this child role class.\n\nThese roles can be used for providing meaning.\
    \ However, the new elements included in HTML5 are meaningful themselves. Yet,\
    \ there are some utilities that are not available in HTML5 and for these, `role`\
    \ attribute can be used.\n\n### How to Control format using `<div>` element?\n\
    \nAs mentioned previously, the `<div>` element is essentially invisible and does\
    \ not provide any meaning to the element. However, if you wish to use it for formatting\
    \ purposes only, then it is perfect for this purpose.\n\n### How to Add Thematic\
    \ Breaks?\n\nThe void element `<hr/>` can be used for adding thematic breaks,\
    \ which are used for denoting a transition from one set of content to another.\n\
    \n### How to Annotate Content?\n\nThere are several elements available for annotation.\
    \ These include `<b>` and `<i>`, which you have been using for ages. However,\
    \ they have new meanings now, in addition to the style that they denote. For instance,\
    \ the `<b>` element denotes the style ‘bold’. In addition to this, HTML5 adds\
    \ the meaning ‘span of text with special focus, but no change in mood, importance\
    \ level or implication.’\n\nAlthough, the use of the bold style makes more sense\
    \ in this context, but you can still use this element for denoting names of products\
    \ in reviews or keywords. Similarly, the element `<strong>` indicates the relative\
    \ importance of content and `<i>` denotes a change in mood or implication of the\
    \ content concerned. Besides this, the `<em>` element is used for text that will\
    \ be alternatively pronounced by the reader.\n\n### How to Use `<abbr>` for Acronyms\
    \ and Abbreviations?\n\nIn the previous versions of HTML, the `<acronym>` element\
    \ was used for this purpose. However, this element has become obsolete and the\
    \ new element used for this purpose is `<abbr>`. It is an inline element, which\
    \ is generally used with other inline elements like `<em>` and `<strong>`.\n\n\
    ### Element - `<address>`\n\nThis element is used for defining the contact information\
    \ of the owner or the author of the webpage.\n\n### Quotations and Citations\n\
    \nYou can indicate that a particular text is a quote by using the element `<blackquote>`,\
    \ which is used for a long quotation, and `<q>`, which is used for an inline quotation.\
    \ You can mention the source of the quotation using the `cite` attribute or the\
    \ `<cite>` element.\n\nHowever, using the `<cite>` element inside `<q>` and `<blackquote>`\
    \ elements is considered a better approach. Please remember that the `<cite>`\
    \ element can only mention the name of the work and other information elements\
    \ like author’s name and location of publishing, are not included here.\n\n###\
    \ How to Document Code in HTML5?\n\nThere are two elements, `<code>` and `<samp>`,\
    \ are used for documenting code. While the element `<code>` is used for documenting\
    \ the source code, the element `<sample>` is used for the output of the code.\
    \ A sample HTML for how this is done is given below:\n\n```html\n<code class=\"\
    maintainWhiteSpace\">\nechoContent('Screen’);\n\nfunction echoContent(name)\n\
    {\nalert('This is' + name + '.');\n}\n</code>\n\n<samp class=\"maintainWhiteSpace\"\
    >\nThis is Screen.\n</samp>\n```\n\n### The `<pre>` Element\n\nIt is important\
    \ to mention here that these elements do not preserve the whitespace. Therefore,\
    \ a class needs to be implemented for this purpose. This class should look like:\
    \ `style` rule.\n\n```css\n.maintainWhiteSpace {\n    white-space: pre;\n}\n```\n\
    \nSome browsers may not support this `style` rule. Therefore, for such browsers,\
    \ it is advisable to use the element `<pre>`. Therefore, `<pre>` element can be\
    \ used for defining the pre-formatting rules.\n\n### The `<var>` Element\n\nThis\
    \ element is used to declare that the text specified inside it, is a variable.\
    \ Example:\n\n```html\n<p>\nThe variable <var>i</var> represents the number of\
    \ iterations for the loop to perform.\n</p>\n```\n\n### The `<br/>` and `<wbr/>`\
    \ Elements\n\nThe `<br/>` element implements a line break. On the other hand,\
    \ the `<wbr/>` implements a word break.\n\n### The `<dfn>` Element\n\nThere may\
    \ be occasions when you wish to define a term. This can be done using the `<dfn>`\
    \ element, which takes title as one of its attributes.\n\n### Working with Figures\n\
    \nImages and figures are an integral part of any web page content. Therefore,\
    \ every figure can also be viewed as a unit of content, which may consist of a\
    \ caption and a reference from the page to which it may belong. In order to define\
    \ one or more images, the `<figure>` element is used to. The element `<figurecaption>`\
    \ can be used for defining the caption of the figure.\n\nHowever, it is important\
    \ to mention here that the `<figure>` element does not give any importance to\
    \ the position of the figure and the same is included along with the content.\
    \ However, if the position and location of the figure is of importance to you.,\
    \ then you must consider using the `<div>` element.\n\n### The `<summary>` and\
    \ `<details>` Elements\n\nThe element `<summary>` contains the summary of the\
    \ content, which can be displayed in the form of collapsible list using the `<details>`\
    \ element. Therefore, when you load a page, only the contents of `<summary>` element\
    \ will be displayed, while the contents of `<details>` are displayed when the\
    \ user clicks on summary.\n\n### Other Annotations\n\nIn addition to the above\
    \ mentioned, there are a few more annotations available, which include\n\n- `<s>`\
    \ - Used for striking out text\n- `<u>` - Used for underlining text\n- `<mark>`\
    \ - Used for highlighting text\n- `<ins>` - Used for indicating that the text\
    \ has been inserted\n- `<del>` - Used for indicating that the text has been deleted\n\
    - `<small>` - used for indicating that the text must be printed in fine letters\n\
    - `<sub>` - Indicates that the text is a subscript\n- `<sup>` - Indicates that\
    \ the text is a superscript\n- `<time>` - Used for indicating that the text denotes\
    \ time and date\n- `<kbd>` - used for indicating that the text is user input\n\
    \n### Language Elements\n\nYou may need to use characters of Chinese, Japanese\
    \ or Korean origin in your text. In order to support this inclusion, the element\
    \ `<ruby>` can be used. Inside this element, other elements like `<bdi>` and `<bdo>`,\
    \ for defining the isolation and direction of text. Besides this, `<rt>` and `<rp>`\
    \ elements can also be used for placing notation or parentheses in the text of\
    \ `<ruby>` element.\n\n### Working with Lists\n\nIn HTML5, several elements for\
    \ defining unordered, ordered and descriptive lists exist. A fourth category of\
    \ ‘Custom lists’ is also present to allow customization by the developer.\n\n\
    The list items for all these are declared using the `<li>` element. Moreover,\
    \ all the three types of lists support list nesting.\n\n#### Ordered Lists\n\n\
    Ordered lists are declared using the `<ol>` element and the elements of ‘order’\
    \ in this list are brought about by an automatic numbering of the elements that\
    \ are included in this list.\n\nThe attributes that can be used with ordered lists\
    \ include:\n- `start`: Used to set the starting number of the list\n- `reversed`:\
    \ Used for declaring if the list has to be ordered in an ascending or descending\
    \ order\n- `type`: Used for declaring the type of the list, which can be A, a,\
    \ 1 or I.\n\n#### Unordered Lists\n\nThis type of list is declared using the `<ul>`\
    \ element and there is no numbering of\n"
