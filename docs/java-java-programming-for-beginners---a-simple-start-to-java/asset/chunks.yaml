  trans: "\n\n可以想象调用一个在对象最后销毁之前会被调用的方法。该方法被称为 `finalize()`，它可以被用于确保项目能够整洁地结束。例如，你可以利用\
    \ `finalize()` 来验证该对象拥有的打开记录已关闭。要向类中添加终结器（finalizer），你基本上只需要调用 `finalize()`。Java\
    \ 运行时将在重用该类对象的任意时间点调用该技术。\n\n在此函数内部，你将指出在对象被移除之前必须执行的活动。使用和实现此函数的语法如下：\n\n```java\n\
