    \ in point, the method demonstrated underneath returns an array that is the inversion\
    \ of an alternate array:\n\n```java\npublic static int[] revarr(int[] myarr) {\n\
    \    int[] resultarr = new int[myarr.length];\n    for (int k = 0, i = resultarr.length\
    \ - 1; k <= myarr.length/2; k++, i- -) {\n        resultarr[j] = myarr[k];\n \
    \   }\n    return resultarr;\n}\n```\n\n### The Arrays Class\n\nThe `java.util.arrays`\
    \ class contains different functions for sorting and seeking values from array,\
