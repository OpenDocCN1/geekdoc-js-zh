    \ `int` 更大的内存范围时使用。\n\n示例：\n```\nlong x = 100L, long y = -200L\n```\n\n#### float:\n\
    \n`float`是一种数据类型，以其单精度著称，32 位 IEEE 754 浮点数。\n\n`float` 通常用于大型浮点数数组中节省内存。\n该数据类型的默认值为\
