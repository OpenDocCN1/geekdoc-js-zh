    Data Methods are methods that facilitate the creation of association between DOM


    elements and arbitrary data.


    CSS Methods are methods that can be used for getting and setting CSS-related properties.


    Dimensions are methods that can be used for accessing and manipulating the dimensions
    of DOM elements.


    Deferred object is an object that is capable of registering multiple callbacks
