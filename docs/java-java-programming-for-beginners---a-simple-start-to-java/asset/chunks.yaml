    \ It may be assigned a value directly or the value may be computed by substituting\
    \ and computing an expression composed of operands and operators. It is important\
    \ to note that an operand can be another expression as well.\n\n### Number Data\
    \ Type\n\nThe number data type is a primitive data type and it is internally stored\
    \ as a floating point number, which is a 64 bit, double precision number. This\
    \ 64 bit field stores the sign, exponent and fraction. While the leftmost bit\
    \ is reserved for sign, the bits 0 to 51 are reserved for storing the fraction\
    \ and bits 52-62 are used for the exponent.\n\nBecause of memory limitation on\
    \ the system, 253 is the highest integer that can be stored.\n\nIt is important\
    \ to note that integer calculations generate a precise value. However, fractional\
    \ data calculation may give imprecise results. Therefore, these values have to\
    \ be truncated.\n\nIn addition to numbers and strings, JavaScript also supports\
    \ the use of the following special characters:\n\n- `undefined`: specifies that\
