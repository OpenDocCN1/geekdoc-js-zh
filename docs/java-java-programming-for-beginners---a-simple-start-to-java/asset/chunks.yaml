    Java is intended to be not difficult to learn. In the event that you understand
    the essential idea of OOP, Java would not be difficult to ace.


    ### Secure


    With Java’s security framework, it empowers to create frameworks, which are free
    of viruses and tampering. Public-key encryption is used as the core authentication
    strategy.


    ### Independent of Machine Architecture


    Java compiler produces an object file format, which is independent of the architecture
    of the machine. The assembled code can be executed on numerous processors, with
    the single requirement that they must all have Java runtime framework.


    ### Portability


    The fact that Java code is machine and platform independent makes it extremely
    compact. Compiler in Java is composed in ANSI C with a clean convey limit, which
    is a POSIX subset.


    ### Robustness


    Java tries to kill circumstances, which can lead to potential system failures,
    by stressing chiefly on runtime checking and compile time checking.


    ### Support for Multithreaded Applications


    With Java’s multithreaded feature, it is conceivable to compose programs that
