    \ 用于指定对象名称。\n- `height`: 用于指定对象以像素为单位的高度。\n- `width`: 用于指定对象以像素为单位的宽度。\n\n在上述所有属性中，必须提及\
    \ `data` 或 `type` 属性。\n\n可以使用 `<param>` 标签将数据传递到 `<object>` 元素，它是 `name` 和 `value`\
    \ 属性的组合。可以使用该标签声明多个参数。\n\n```html\n<object data=\"file.wav\">\n  <param name=\"\
    autoplay\" value=\"false\" />\n</object>\n```\n\n### 注意：\n1. `<object>` 元素必须始终位于\
    \ `<body>` 元素内部。\n2. HTML5 仅支持上述列出的属性以及 `<object>` 元素的全局属性。\n\n# 第 3 章：JavaScript\
    \ 基础\n\n交互是任何网站的一个重要方面。为了与听众建立更好的联系，为网站添加行为至关重要。这可以是简单的按钮，也可以是复杂的动画。这些任务可以使用 JavaScript\
    \ 来，JavaScript 是一种网络和编程语言。本章将介绍 JavaScript，并将帮助你立即开始学习 JavaScript。\n\n## 背景\n\n\
    JavaScript 是客户端脚本的首选编程语言。与大众的认知相反，JavaScript 与 Java 没有任何关系。事实上，它与 ECMAScript 具有相似之处。此外，这种编程语言与\
    \ C 和 C++ 等其他编程语言之间唯一的共同点是它们使用大括号。JavaScript 的国际标准在 ISO/IEC 16262 和 ECMA-262 规范中给出。\n\
    \n该编程语言最重要的特征之一是它是无类型的。换句话说，使用变量时没有必要指定其类型。例如，如果你给一个变量赋值了一个字符串，稍后可以给同一个变量赋值一个整数。变量使用关键字\
    \ `var` 进行声明。\n\n## 数据与表达式\n\n任何程序都会访问、操纵并向用户表示数据。数据以不同的类型和形式存在。这些数据可以很容易地分解为值。在\
    \ JavaScript 中，数据可以表示为原始值、对象或函数。\n\n最低层的数据表示被称为原始数据类型，包括 `null`、`undefined`、`number`、`string`\
    \ 和 `Boolean`。\n\nJavaScript 中定义了几个内置对象。这些包括 `Object` 对象、全局对象、`Array` 对象、`Function`\
    \ 对象、`Boolean` 对象、`String` 对象、`Math` 对象、`Number` 对象、`RegExp` 对象、`Date` 对象、`Error`\
    \ 对象和 `JSON` 对象。\n\n任何可调用的对象被称为函数。如果函数与对象关联，它也被称为方法。\n\n数据通过表达式产生，表达式是任何生成值的代码的名称。它可以直接被赋值，或者通过替换和计算由操作数和运算符组成的表达式来计算值。需要注意的是，操作数也可以是另一个表达式。\n\
    \n### 数字数据类型\n\n数字数据类型是一种原始数据类型，它在内部被存储为浮点数，即 64 位双精度数。这 64 位字段存储了符号、指数和尾数。最左侧的位留给符号，0\
    \ 到 51 位留用于存储尾数，52 到 62 位用于指数。\n\n由于系统的内存限制，253 是可以存储的最大整数。\n\n需要注意的是，整数计算会生成一个精确的值。然而，小数数据的计算可能会给出不精确的结果。因此，这些值必须被截断。\n\
    \n除了数字和字符串外，JavaScript 还支持使用以下特殊字符：\n\n- `undefined`: 指定值尚未赋值。\n- `NaN`: 代表“不是数字”。\n\
    - `-Infinity`: 任何小于 -1.7976931348623157E + 10308 的数字都用 `Infinity` 表示。\n- `Infinity`:\
    \ 任何超过 1.7976931348623157E + 10308 的数字都用 `Infinity` 表示。\n\n### 字符串数据类型\n\n字符串可以简单地描述为字符集合。每当你在引号内声明字符时，系统都会解释为字符串。示例字符串包括：\n\
    \n- ‘Hello World!’\n- “Hello World!”\n\n然而，如果你想将引号作为字符串字符，则必须在字符之前添加 `\\'`。示例字符串：\n\
    \n- ‘You\\'re Welcome’\n- “You\\'re Welcome”\n\nJavaScript 还支持其他转义序列，如用于制表的 `\\\
    t` 和用于换行的 `\\n`。\n\n### 布尔数据类型\n\n布尔数据类型是一种二进制数据类型，返回 true 或 false。这些运算符通常用于指示比较的结果。例如，`10\
    \ > 5` 将得到 ‘true’ 而 `5 > 10` 将得到 ‘false’。\n\n### 数字数据类型的操作\n\n为了执行计算，使用了运算符。JavaScript\
    \ 支持所有基础运算符，运算符的优先级如下：\n\n- 加法和减法的优先级相同。\n- 乘法和除法的优先级相同。\n- 乘法和除法的优先级高于加法和减法。\n\
    - 如果一个表达式包含多个相同优先级的运算符，则表达式从左到右计算。\n\n除了基础运算符，JavaScript 还支持模运算符 `%`。该运算符执行除法并返回余数。例如，`23%7`\
    \ 等于 2。\n\n### 一元运算符\n\n虽然加减法运算符需要操作数，但某些运算符只需要一个。此类运算符示例是 `typeof`，它返回数据的类型。例如，`typeof\
    \ 12` 返回 ‘number’。注意 `+` 和 `-` 也可以作为一元运算符使用，当它们用于指定数字的符号时。\n\n### 逻辑运算符\n\nJavaScript\
    \ 提供了三种逻辑运算符，即非 (`!`)、或 (`||`) 和与 (`&&`)。这些操作的结果是布尔值（真或假）。结果根据以下规则计算：\n\n- 与 (`&&`)：二元运算符。两个条件都必须真。\n\
    - 或 (`||`)：二元运算符。至少有一个条件为真。\n- 非 (`!`)：一元运算符。条件的值被取反。\n\n例如：\n- ‘Red’ != ‘Blue’\
    \ && 5 > 1` = ‘true’\n- ‘Red’ != ‘Blue’ && 5 < 1` = ‘false’\n- ‘Red’ == ‘Blue’\
    \ && 5 < 1` = ‘false’\n\n对于条件运算符，JavaScript 使用短路求值。换句话说，如果第一个条件的值为 ‘false’，系统就不会评估另一个条件直接给出结果。\n\
    \n# 在 JavaScript 中编写代码\n\n任何以分号结尾的语句被称为语句。与必须产生值的表达式不同，语句可能会产生值。\n\n## 变量\n\n\
    数据操作通过变量完成。数据存储在内存中，对该内存位置的命名引用称为变量。任何标识符通过在其前面加上关键字 `var` 来声明为变量。变量定义的示例：\n\n\
    ```javascript\nvar result;\n```\n\n此语句声明了变量 `result`。你也可以在声明的同时定义变量，使用如下语句：\n\n\
    ```javascript\nvar result = 0;\nvar result = 23*4+6;\n```\n\n在命名变量时必须遵循某些规则。这些规则如下：\n\
    - 变量名可以是数字和字符的组合。\n- 变量名不能以数字开头。\n- 变量名中允许的特殊字符是下划线 (_) 和美元符号 ($)。\n- 变量名中不应有空格。例如，‘result\
    \ value’ 是允许的。\n\n"
