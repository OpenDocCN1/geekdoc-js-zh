    **CHAPTER 3: BASICS OF JAVASCRIPT**


    Interaction is an important facet of any website. In order to connect with the
    audience in a better way, it is vital to add behaviour to the website. This can
    be as simple as buttons or as complex as animations. These tasks can be added
    using JavaScript, which is a web and programming language. This chapter introduces
    JavaScript and shall help you get started with JavaScript on an immediate basis.


    **Background**


    JavaScript is the preferred programming language for client side scripting. Contrary
    to popular belief, JavaScript is in no way related to Java. In fact, it finds
    resemblance to ECMAScript. Besides this, the only common thing between this programming
    language and other programming languages like C and C++ is that it uses curly
    braces. The international standard for JavaScript is given in ISO/IEC 16262 and
    ECMA-262


    specification.


    One of the most important features of this programming language is that it is
    untyped. In other words, specifying the type of a variable is not necessary for
    using it. For example, if you have assigned a string to a variable, you can later
    assign an integer to the same variable. Variables are declared using the keyword
    *var*.


    **Data and Expressions**


    Any program accesses, manipulates and represents data to the user. Data is available
    in different types and forms. This data can be easily decomposed into values.
    In JavaScript, data may be represented as a primitive value, object or function.


    The data representation at the lowest level is known as primitive data type and
    includes null, undefined, number, string and Boolean.


    Several built-in objects are defined in JavaScript. These entail the Object object,
    global object, Array object, Function object, Boolean object, String object, Math
    object, Number object, the RegExp object, Date object, Error object and JSON object.


    Any object that is callable is called a function. It may also be referred to as
    a method if the function is associated with an object.


    Data is produced by using expressions, which is a name given to any code that
    generates a value. It may be assigned a value directly or the value may be computed
    by substituting and computing an expression composed of operands and operators.
    It is important to note that an operand can be another expression as well.


    ***Number Data Type***


    The number data type is a primitive data type and it is internally stored as a
    floating point number, which is a 64 bit, double precision number. This 64 bit
    field stores the sign, exponent and fraction. While the leftmost bit is reserved
    for sign, the bits 0 to 51 are reserved for storing the fraction and bits 52-62
    are used for the exponent.


    Because of memory limitation on the system, 253 is the highest integer that can
    be stored.


    It is important to note that integer calculations generate a precise value. However,
    fractional data calculation may give imprecise results. Therefore, these values
    have to be truncated.


    In addition to numbers and strings, JavaScript also supports the use of the following
    special characters.


    undefined specifies that the value has not been assigned yet.


    *NaN stands for ‘* Not a Number’


    -Infinity any number that is less than -1.7976931348623157E + 10308 is denoted
    by Infinity.


    Infinity - any number that exceeds the value 1.7976931348623157E + 10308 is denoted
    by Infinity.


    ***String Data Type***


    A string can simply be described as a collection of characters. Whenever you declare
    character(s) within quotes, the system interprets as a string. Sample strings
    include:


    ‘Hello World!’


    “Hello World!”


    However, if you want to include quotes as characters in the string, then you must
    add ‘\’


    before the character. Sample string:


    ‘You\’re Welcome’


    “You\’re Welcome”


    JavaScript also supports other escape sequences like \t for tab and \n for newline.


    ***Boolean Data Type***


    The Boolean data type is a binary data type and return either true or false. These
    operators are commonly used to indicate results of comparisons. For example, 10
    > 5 will give ‘true’ while 5 > 10 will give ‘false’.


    ***Operations on Number data Type***


    In order to perform calculations, operators are used. JavaScript supports all
    the basic operators and the operator precedence is as follows:


    Addition and subtraction have the same precedence.


    Multiplication and division have the same precedence.


    The precedence of multiplication and division is higher than that of addition
    and subtraction.


    If an expression contains several operators of the same precedence, then the expression
    is evaluated from left to right.


    In addition to the basic operators, JavaScript also supports modulo (%) operator.
    This operator performs division and returns the remainder as result. For example,
    23%7 is equal to 2.


    ***Unary Operators***


    While operators like addition and subtraction need to operands to execute, some
    operators require only one. An example of such operators is *typeof*, which returns
    the datatype of the data. For example, *typeof 12* returns ‘number’. Please note
    that ‘+’ and ‘-‘ can also be used as unary operators. This is the case when they
    are used to specify the sign of a number.


    ***Logical Operators***


    Three logical operators are available for use in JavaScript namely, Not (!), Or
    (||) and And (&&). The results of operations that involve these operators are
    Boolean (true or false).


    The results of these operations are computed in accordance with the following:
    AND (&&) Binary operator


    Both the conditions must be true


    OR (||)


    Binary operator


    At least one of the conditions must be true


    NOT (!)


    Unary operator


    The value of the condition determined is complemented.


    For example,


    ‘Red’ != ‘Blue’ && 5 > 1 = ‘true’


    ‘Red’ != ‘Blue’ && 5 < 1 = ‘false’


    ‘Red’ == ‘Blue’ && 5 < 1 = ‘false’


    For conditional operators, JavaScript uses short-circuit evaluation. In other
    words, if the value of the first condition is computed to be ‘false’, the system
    does not evaluate the other condition and directly presents the result.


    **Writing Code in JavaScript**


    Any statement followed by a semicolon is referred to as a statement. This statement
    may or may not produce a value unlike expressions, which must inadvertently produce
    a value.


    ***Variables***


    Manipulation of data is performed with the help of variables. Data is stored in
    the memory


    and a named reference to this memory location is called a variable. Any identifier
    is declared as a variable by preceding it with a keyword *var*. A sample declaration
    of a variable is:


    *var result;*


    This statement declares a variable *result*. You may also define the variable
    as you declare it using a statement like this:


    *var result = 0;*


    or


    *var result = 23*4+6;*


    Certain rules have to be followed while naming variables. These rules are as follows:
    A variable name can be a combination of numbers and characters.


    A variable name cannot start with a number.


    The only special characters allowed in variable names is underscore (_) and dollar
    sign($).


    There should not be any whitespace in the variable name. For example, ‘result
    value’ is not allowed.'
