    A property, position, is used to define if the position specified is static or
    relative.


    The float property can be used to allow elements to float to the right or left
    and is defined as float: left or float: right.


    The clear property places a clear element right after the floating element.


    You can also change the manner in which the browser calculates width with the
    help of the box-sizing property. This property can take three values: content-box
    (default setting), border-box and padding-box.


    *Centering Content*


    If you are using a fixed width, the div element can be centered using the properties,
    margin-left and margin-right. If you fix the width and set the margins to *auto,*
    the extra space on the margins is equally divided. It can be done in the following
    manner:


    #container {


    width: 850px;


    margin-left: auto;


    margin-right: auto;


    }


    **CHAPTER 5: HTML5 EXPLAINED**


    The chapter focuses on the basics of HTML5 and how they can be used for creating
    high performance, new-generation pages. However, most of the elements explained
    in that chapter included elements that HTML5 has received from its predecessors.
    This chapter takes you a step further in your quest of learning HTML5, introducing
    concepts that are newly added to this technology.


    In the previous chapter on CSS, we introduced the concept of <div> element to
    you. This element is preferred over all its alternatives as far as page layout
    creation is concerned.


    While some people also use the <table> element, it is usually not a recommended
    solution as it is difficult to maintain as well use. However, both the concepts
    are elaborated upon this chapter.


    **Semantic Markup**


    The <div> and <span> elements are the most commonly used and recommended elements
    for positioning and formatting content. However, it is recommended that you should
    use different <div> elements for specifying different sections of the page like
    header and footer. This shall allow you to position them individually and in a
    more organized manner.


    Therefore, the W3C has named these new elements with names like <footer> and


    <header>.


    **Browser Support**


    It is true that your HTML code will not be read by any of your users. However,
    there are other tools and machines that are constantly parsing your code. These
    tools include web crawlers, which indexes webpages for searching and NVDA (Non-Visual
    Desktop Access) devices, which are used by many users with special needs as an
    alternative for reading and comprehending web pages. Therefore, they require you
    to use tags that are


    understandable.


    **How to Create HTML5 Documents**


    Although, the above discussion clearly mentions the importance of using meaning
    tags and prohibits the use of tags like <div> and <span>, you may still have to
    use them for styling purposes. As you read on, you will realize how semantic tags
    must be supplied for providing meaning to your tags. It is important to mention
    here that semantic tags should be used carefully, and if you realize that there
    is a need to define custom elements, then go ahead and use the <div> and <span>
    elements. However, be sure to add an ID and class-name to the elements that describe
    their meaning as well as possible.


    **How to Create HTML5 Layout Container**


    A layout container, as the name suggests, is a container that entails the layout
    of a page. In other words, the container contains the different sections of the
    layout or its children in such a manner that they can be positioned in a flexible
    manner. As a developer, you can easily distinguish between <div> elements on the
    basis of their class names and IDs.


    However, this is not true for browsers.


    Therefore, there has got to be a way by which you can ask the browser to interpret
    elements. For instance, you may want to ask the browser to focus on a certain
    <div> element upon opening. All this and more can be done with the help of layout
    containers that express elements in such a manner that they are understandable
    to both the browser and the user.


    Some of the commonly used elements for creating a layout container include:


    < *header*>


    It is used to define the header section or the topmost section of the HTML


    document. This element can also be defined inside the <article> element.


    < *footer*>


    It is used to define the footer section or the bottom-most section of the HTML


    document. This element can also be defined inside the <article> element.


    < *nav*>


    It is used to define the section that contains all the navigational links.


    < *aside*>


    This element is generally used for sidebars and separates the content in the <aside>
    element from the content that is outside this element.


    < *section*>


    This element defines a part of the whole section and is named with the elements


    <h1>, <h2>, <h3>, <h4>, <h5> and <h6>.


    < *article*>


    This element defines a complete unit of content, which you can copy from one location
    to another. An example of such a unit is a blog post.


    **Using Roles**


    The role attribute can be declared inside the <div> and <aside> elements. The
    role class hierarchy and the usage of roles for providing specific meanings, as
    far as far as accessibility is concerned, is defined in WAI-ARIA (Web Accessible
    Initiative -


    Accessible Rich Internet


    Applications).


    One of the parent role classes is the landmark role class, which defines the navigational
    landmarks on the webpage. The child classes of the parent role class include:
    banner'
