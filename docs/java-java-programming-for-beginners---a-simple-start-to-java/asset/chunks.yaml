    body {


    color: white;


    }


    ***Defining Media***


    It is important to note that a style sheet can contain as many style rules as
    you want.


    Besides this, you can also link different CSS files for different media. The different
    media types are as follows:


    all


    embossed


    braille


    print


    handheld


    speech


    screen


    tv


    tty


    The media used can be defined in the following manner:


    <link rel=‘stylesheet’ type=‘text/css’ href=‘Content/all.css’ media=’all’ />


    ***Defining Character Encoding***


    You can also define the character encoding used, using the following format: Style
    sheet:


    Place the following line above the style rule in the style sheet.


    @charset ‘UTF-8’;


    HTML page:


    You must place this line above the link element.


    <meta http-equiv=‘Content-Type’ content=‘text/html;charset=UTF-8’ >


    ***Importing style Sheets***


    As your web pages becomes complex, the style sheets used shall also grow in complexity.


    Therefore, you may need to use many style sheets. You can import the style rules
    present in one style sheet to another by using:


    @import url(‘/Content/header.css’);


    Here, header.css is imported and the url gives the relative address of the style
    sheet to be


    imported.


    ***Importing Fonts***


    Fonts can be imported using the following format:


    @font-face {


    font-family: newFont;


    src: url(‘New_Font.ttf’),


    url(‘New_Font.eot’); /* IE9 */


    **Selectors, Specificity and Cascading**


    Selectors can be of three types, class selectors, ID selectors and element selectors.
    The element selector type is the simplest and requires you to simply name the
    element that needs to be used. For instance, if you wish to change the background
    color of the body, then the element selector used is *body.*


    While declaring any element, you can assign an ID to it using the id attribute.
    You can use this ID prefixed with a # as a selector. For example, if you have
    created a button with ID


    btnID, then the ID selector for this will be #btnID. Similarly, you can assign
    a class name to an element using the class attribute. Class name can be used prefixed
    by a dot(.) in the following manner, .className.


    However, if you wish to select all the elements of the webpage, then asterisk
    (*) to it.


    ***Using Descendent and Child Selectors***


    You may wish to apply a particular style to a descendant of a selector. This can
    be done by specifying the complete selector change. It can be done in the following
    manner: li a {


    text-color: black;


    }


    On the other hand, you may want to apply to an element only if it is a direct
    child of the selector. This can be implemented by specifying the parent and child
    separated by a greater than (>) sign, in the following manner:


    li > a {


    color: white;


    }


    ***Pseudo-element and Pseudo-class Selectors***


    Now that you know how to apply styles to specific elements, let us move on to
    implementing styles to more specific sections like the first line of the second
    paragraph. In order to style elements that cannot be classified on the basis of
    name, content or is not a part of the DOM tree can be styled using pseudo-classes.
    The available pseudo-classes include:


    :visited


    :link


    :hover


    :active


    :checked


    :focus


    :nth-last-child(n)


    :not


    :only-child


    :nth-child(formula)


    :lang(language)


    :first-of-type


    :only-of-type


    If you want to access information of the DOM tree that is not accessible otherwise,
    you can use pseudo-elements. Pseudo-elements include:


    ::first-letter


    ::first-line


    ::after


    ::before


    ***Grouping Selectors***


    Multiple selectors can be used for a style rule. These selectors must be separated
    by commas. Sample implementation:


    body, button {


    color: white;


    }


    ***Using Adjacent Selectors***


    If you want to style the first heading in a div or any similar adjacent elements,
    the selector is constructed using a plus sign (+) between the two selectors. Sample
    implementation: div + h1 {


    color: white;


    }


    ***Sibling Selectors***


    Sibling selectors are similar to adjacent selectors except for the fact that all
    the matching elements are styled as against adjacent selectors, which only style
    the first matching element. The selector is constructed using a ~ sign between
    the two selectors. Sample


    implementation:


    div ~ h1 {


    color: white;


    }


    ***Using Attribute Selector***


    This selector selects all the elements for which the specified attribute exists.
    The selector is written in this form:


    a[title]


    This selector will select all the links for which the title attribute has been
    specified.


    Moreover, this selector type can be modified into attribute-value selector by
    specifying the attribute value in the following manner:


    a[title = value]


    ***In-Built Styles of Browsers***


    Every browser has a built-in stylesheet, which is applied to all the webpages
    opened using this browser. In fact, this stylesheet is applied before any other
    style sheet. You can define your own style sheet for the browser using the Accessibility
    option in Tools. However, user style sheets are browser specific. Therefore, if
    you open a different browser, the style sheet you defined may not be accessible.'
