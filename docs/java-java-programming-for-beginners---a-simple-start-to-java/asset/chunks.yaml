    \ `-Infinity`: any number that is less than -1.7976931348623157E + 10308 is denoted\
    \ by `Infinity`.\n- `Infinity`: any number that exceeds the value 1.7976931348623157E\
    \ + 10308 is denoted by `Infinity`.\n\n### String Data Type\n\nA string can simply\
    \ be described as a collection of characters. Whenever you declare character(s)\
    \ within quotes, the system interprets as a string. Sample strings include:\n\n\
    - ‘Hello World!’\n- “Hello World!”\n\nHowever, if you want to include quotes as\
