    \ type=’hidden’>` - 这是一个隐藏输入字段。\n- `<input type=’datetime-local’>` - 这是一个控件，显示日期和时间（任意时区）。\n\
    - `<input type=’month’>` - 这是一个月-年控件。\n- `<input type=’image’>` - 这是一个图像提交按钮。\n\
    - `<input type=’password’>` - 这是一个密码字段，带有掩码字符。\n- `<input type=’number’>` - 这是一个数值字段。\n\
    - `<input type=’range’>` - 这是一个控件，接受数值并定义允许的数值范围。\n- `<input type=’radio’>` -\
    \ 这是一个单选按钮，具有用于设置和读取按钮状态的 value 属性。用于识别已选单选按钮的 jQuery 是 `$(‘input[type=radio]:checked’`。\n\
    - `<input type=’search’>` - 这是一个文本字段，用于输入搜索字符串。\n- `<input type=’reset’>` -这是一个用于重置表单字段的按钮。\n\
    - `<input type=’url’>` - 这是一个 URL 字段。\n- `<input type=’tel’>` - 这是一个电话号码字段。\n\
    - `<input type=’submit’>` - 这是一个提交按钮。\n- `<input type=’time’>` - 这是一个控件，接受时间值。\n\
    - `<input type=’text’>` - 这是一个单行文本字段。\n- `<input type=’week’>` - 这是一个周-年控件。\n\n\
    ## `<label>` \n\n它是用于向用户传达元素的含义。该元素中的文本显示在文本框内，当用户点击它时，会自动移除。你还可以指定标签的样式。\n\n\
    ## 指定父表单\n\n在某些情况下，表单的提交元素可能不在同一个结构中。因此，在这种情况下，收集数据可能是一个巨大的挑战。为了解决这个问题，HTML5 提供了\
    \ `id` 属性，可以为多个表单元素设置。这将允许一次性从不同的表单元素中收集数据。\n\n## 如何触发表单提交\n\n触发时，从表单或相同 id 的表单的提交元素收集的所有数据都将使用\
    \ HTTP 方法发送到服务器。`<input>` 元素可以触发表单提交。此外，你也可以使用 JavaScript 实现此目的。为了实现这一点，你必须给相关的表单指定一个\
    \ `id`，`myFirstForm`。链接到 HTML 文档的 `default.js` 文件必须包含以下代码：\n\n```javascript\n\
    $(document).ready(function () {\n  $(‘#myFirstButton’).on(‘click’, submitMyFirstForm);\n\
    });\n\nfunction submitMyFirstForm() {\n  $(‘#myFirstForm’).submit();\n}\n```\n\
    \n如果没有给 method 属性赋值，则设置为默认的 `GET`。\n\n此外，`action` 属性也会有一个默认值。因此，点击按钮将引用相同的页面。但现在\
    \ URL 将包含一个 `QueryString`，它是用户选择或输入的值的组合。例如，如果表单要求用户输入客户 ID，而用户输入了 1245，那么 `QueryString`\
    \ 将是：\n\n`customerID=1245`\n\n此 `QueryString` 将按以下方式附加到 URL：`Mywebpage.asp?customerID=1245`\n\
    \n这里还需要提到的是，`QueryString` 是经过 URI 编码的。因此，特殊字符由特定的值表示。例如，空格表示为‘+’，感叹号（`!`）表示为 `%21`。键值对表示为\
    \ `name=value`，键值对之间用 `&` 分隔。\n\n## 如何序列化表单\n\n你可以使用 jQuery 的 `serialize` 方法对表单进行序列化。可以通过以下方式实现：\n\
    \n```javascript\nvar myFormData = $(‘#myFirstForm’).serialize();\n```\n\n你可以使用以下方法解码\
    \ URI 编码的字符串：\n\n```javascript\nvar data = decodeURIComponent(myFormData);\n```\n\
    \n## 使用 Autofocus 属性\n\n默认情况下，焦点没有设置在表单的任何元素上。但你可以使用 `focus` 方法设置焦点，其实现方式如下：`$(‘input[name=“firstName”]’).focus();`。\n\
    \n不过，你也可以通过以下方式设置 `autofocus`：\n\n```html\n<input type=“text” name=“firstName”\
    \ autofocus=“autofocus”/>\n```\n\n## 如何使用数据提交约束\n\n表单只有在满足以下约束时才能发送数据：\n- 必须设置\
    \ name 属性。\n- 你必须设置表单提交元素的值。\n- `<form>` 元素必须定义了表单提交元素，且表单元素不应被禁用。\n- 如果实现了多个提交按钮，则只有在点击激活的提交按钮时才会提交值。\n\
    - 选择勾选框。\n- 选择单选框。\n- `<option>` 元素必须有。\n- 如果有选择字段。\n- 对象的 `declare` 属性必须设置。\n\
    \n始终记住，重置按钮不会发送任何数据。\n\n## 如何使用 POST 或 GET\n\n提交数据有两种 HTTP 方法可用：`GET` 和 `POST`。在前一种情况下，URL\
    \ 会附加 `QueryString`。而在后一种情况下，信息是在消息正文中发送。\n\n## 表单验证\n\n了解所有安全问题的根源在于用户数据是有益的。当你决定向用户开放数据和交互时，你就让应用程序容易受到安全威胁。因此，在处理接收到的任何数据之前，你需要对其进行验证。\n\
    \n验证可以在浏览器端或服务器端提供。然而，建议在服务器端验证，因为浏览器级验证很容易被操控。\n\n最简单的验证形式是在 `<select>` 元素中使用\
    \ `required` 属性。你可以通过以下方式设置该属性：\n\n```html\n<select name=“dateOfBirth” required=“required”>\n\
    ```\n\n生成的验证错误取决于浏览器，每个浏览器与用户通信的方法不同。\n\n增加了时间、日期和基于类型的输入使得验证变得简单得多，因为可以直接检查它们是否具有有效值。此外，电子邮件、数字和范围也可以轻松验证。HTML5\
    \ 执行验证并与 `:valid` 或 `:invalid` 伪类进行匹配。如果验证成功，则匹配 `:valid`，否则匹配 `:invalid`。然而，如果一个值不是\
    \ `required`，它将匹配 `:optional` 伪类。此外，`placeholder` 属性也可用……\n\n## 第 8 章：网络服务\n\n\
    到为止的所有章节都涉及浏览器端的编码和脚本。然而，现在是时候转向服务器端脚本了。本章重点关注在服务器端使用 JavaScript，这可以通过 Node.js\
    \ 的帮助实现，以及如何处理网络服务。\n\n### Node.js 基础\n\n第一步是打开任何文本编辑器并创建一个名为 `myFile.js` 的文件。在文件中，编写代码：\n\
