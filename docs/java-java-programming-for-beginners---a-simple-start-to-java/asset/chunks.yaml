    the JavaScript modification right away. Moreover, use jQuery objects as much as
    possible because the cross-browser compatibility that they offer.


    A DOM object can be referenced from a jQuery wrapper in the following manner:
    var domElement = $(‘#txtInput’)[0];


    Here is a simple code that checks if the element exists before referencing it.


    var domElement;


    if($(‘#txtInput’).length > 0){


    domElement = $(‘#txtInput’)[0];


    }


    **How to Create a jQuery wrapper for Referencing a DOM element** A jQuery wrapper
    can be created from a DOM element reference in the following manner: var myDoc
    = $(document);


    var inText = $(this).text();


    The first statement assigns the wrapped object to the variable. On the other hand,
    the


    second statement wraps the object referenced using *this*.


    **How to Add Event Listeners**


    jQuery provides the .on method for subscribing to events. Besides this, you can
    unsubscribe using the .off method. These methods can be used in the following
    manner: $(‘#btnSubmitInfo’).on(‘click’, onSubmit);


    $(‘#btnSubmitInfo’).off(‘click’, onSubmit);


    **How to Trigger Event Handlers**


    JQuery provides triggers or the method, triggerHandler, for triggering event handlers
    or handler code execution. This can be done in the following manner: $(‘#btnSubmitInfo’).triggerHandler(‘click’);


    **Initialization Code**


    You will often be faced with the requirement to run an initialization code upon
    the loading of an HTML document. You can do this using jQuery in the following
    manner:


    <script>


    $(document).ready(function () {


    initializationFunction();


    });


    </script>


    This can be placed at the bottom of the HTML document. It will call the initializationFunction.


    **CHAPTER 7: FORMS**


    In the previous chapters, you have already studied how HTML documents can be created


    and manipulated. Taking a lead from them, we can now move on to understanding
    forms, which is one of the most crucial and commonly used units of content in
    webpage development.


    Simply, a form is a way in which data is collected and sent to a location where
    it can be processed, which is a server in most cases. However, since we are yet
    to discuss server side scripting, we will focus on sending the data to an email
    address. However, it is important to note that we do not recommend this practice
    and it is used only for understanding purposes.


    **Web Communications**


    Before moving to the working of forms, it is important to know some basics of
    HTTP. A typical web communication consists of the following activities: 1\. When
    a user browses a webpage, a request for access to a web server resource is initiated
    by sending a GET HTTP request.


    2\. The request is processed by the server and sends a response to the browser
    using HTTP protocol.


    3\. The browser process the server response and presents it to the user in the
    form of a


    ‘form’.


    4\. The user enters inputs to the form and upon hitting the submit or enter button,
    this data is sent to the server, using HTTP protocol again.


    5\. This data is again processed by the server and the server posts its response
    to the browser, which is displayed on the webpage.


    **Web Servers**


    Originally, web servers were designed to receive and process requests and send
    the results back to the browser using HTTP. Initially, when the web pages were
    simple, such web servers were able to process a good number of requests per unit
    time. There were no states


    involved as sending and receiving requests were as simple as opening a connection,
    transferring data and closing the connection.


    The new age web servers are much more equipped that these simple web servers.
    The web servers of today implement what is called the ‘keep alive’ features, which
    ensures that the connection remains open for a definite period of time in which
    subsequent requests by the same browser to the server can be entertained.


    **Web Browsers**


    The web browser is a desktop application, which displays web pages and manages
    user interactions between the webpages and the server. The communication between
    the web servers and pages is established using technologies like AJAX and Asynchronous
    JavaScript.


    **How is Data Submitted to the Web Server**


    An HTML form can be created using the <form> element in the following manner:


    <form method=“post” action=“getCustomerInformation.aspx” > Enter Customer Number:


    <input type=“text” name=“Number” />


    <input type=“submit” value=“Get Customer Information” />


    </form>


    This form takes in the customer number and returns a page that displays the details
    of the customer.


    However, it is important to note that not all elements can be used for submitting
    data in a form. The allowed elements for this purpose are:


    <textarea> - It takes a multi-line input


    <button> - It is a clickable button, which can be placed on any content or image.


    <select> - It is a drop-down list, which allows multiple selections. The selected
    options can be identified using jQuery: $(‘option:selected’)


    <input type=’checkbox’> - It is a checkbox, which has a value attribute used for
    setting as well as reading the status of the checkbox. The jQuery for identifying
    checked checkboxes is: $(‘input[type=checkbox]:checked’)'
