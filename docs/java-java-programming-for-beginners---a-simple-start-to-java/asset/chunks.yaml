  trans: "\n\n修饰符（Modifiers）是您添加到定义中以改变其含义的短语。Java 语言拥有广泛且混合的修饰符，包括以下：\n\n## 非访问修饰符\n\
    \n## Java 访问修饰符\n\n为了使用修饰符，您将其短语整合到类、变量或方法的含义中。修饰符位于声明剩余部分之前。\n\n### 访问控制修饰符\n\
    Java 提供了各种访问修饰符来为类、变量、程序和构造函数设置访问级别。获取访问权限的四种是：\n\n- `Private`：对类可见。\n- `Default`：对包可见。不需要修饰符。\n\
    - `Secured`：对所有子类和包可见。\n- `Public`：对世界可见。\n\n### 非访问修饰符\nJava 提供了各种非访问修饰符来实现许多其他用用。\n\
    \n- `Static`：用于创建类变量和方法的 `static` 修饰符。\n- `Final`：用于结束类、变量和方法执行的 `final` 修饰符。\n\
    - `Abstract`：此修饰符用于创建抽象方法和类。\n- `Volatile and Synchronized`：这些修饰符通常用于线程。\n\n##\
    \ Java 中的运算符\n\nJava 中的运算符集合非常丰富。广而言之，Java 可用的运算符分为以下几类：\n\n- 关系运算符\n- 算术运算符\n\
    - 逻辑运算符\n- 位运算符\n- 杂项运算符\n- 赋值运算符\n\n## 算术运算符\n\nJava 中的操作方式本质上与代数相同。它们与变量配合执行算术操作。以下是\
    \ Java 中可用的算术运算符列表。\n\n| 操作 | 运算符 | 描述 |\n| :--- | :--- | :--- |\n| 加法 | `+` |\
    \ 将两个变量的值相 |\n| 减法 | `-` | 将两个变量的值相减 |\n| 乘法 | `*` | 将两个变量的值相 |\n| 除法 | `/` |\
    \ 除两个变量的值。结果值是 |\n| 取模 | `%` | 除余数 |\n| 递增 | `++` | 将值加 1 |\n| 递减 | `--` | 将值减\
    \ 1 |\n\n## 关系运算符\n\nJava 还支持几种关系运算符。下面列出了 Java 支持的关系运算符列表。\n\n| 操作 | 运算符 | 描述\
    \ |\n| :--- | :--- | :--- |\n| 等于 | `==` | 比较两个变量是否相等 |\n| 不等于 | `!=` | 比较两个变量是否不等\
    \ |\n| 大于 | `>` | 检查一个值是否大于另一个值 |\n| 小于 | `<` | 检查一个值是否小于另一个值 |\n| 大于等于 | `>=`\
    \ | 检查一个值是否大于或等于另一个值 |\n| 小于等于 | `<=` | 检查一个值是否小于或等于另一个值 |\n\n## 位运算符\n\nJava\
    \ 可用的位运算符很容易应用于多种数据类型。\n\n这些数据类型包括 `byte`、`short`、`long`、`int` 和 `char`。通常，任何位运算符都会按位执行相关操作。例如，考虑整数\
    \ `x` 的值为 `60`。因此，`x` 的二进制等效值是 `00111100`。\n\n考虑另一个变量 `y`，值为 `13` 或 `00001101`。如果我们对这两个数字执行位运算\
    \ `&`，那么你将得到结果：`x&y = 0000 1110`\n\n下面的表显示了 Java 中可用的位运算符列表。\n\n| 操作 | 运算符 | 描述\
    \ |\n| :--- | :--- | :--- |\n| 二位与 | `&` | 执行 与 操作 |\n| 二位或 | `\\|` | 执行 或 操作\
    \ |\n| 二位异或 | `^` | 执行 异或 操作 |\n| 一位位取反 | `~` | 对一元变量执行取反操作 |\n| 二位左移 | `<<` |\
    \ 执行位的左移 |\n| 二位右移 | `>>` | 执行位的右移 |\n\n除了上述之外，Java 还支持右移零填充运算符 (`>>>`)，它用零填充右侧移出的位。\n\
    \n## 逻辑运算符\n\n逻辑运算符是任何运算符集不可或缺的一部分。Java 支持的逻辑运算符列在下表中。\n\n| 操作 | 运算符 | 描述 |\n\
    | :--- | :--- | :--- |\n| 逻辑与 | `&&` | 如果提到的两个条件都为真，则返回 True |\n| 逻辑或 | `\\|\\\
    |` | 如果提到的一个或两个条件都为真，则返回 True |\n| 逻辑非 | `!` | 如果提到的条件为假，则返回 True |\n\n## 赋值运算符\n\
    \nJava 语言支持以下赋值运算符：\n\n| 操作 | 运算符 | 描述 |\n| :--- | :--- | :--- |\n| 简单赋值 | `=`\
    \ | 将右侧的值赋给左侧的变量 |\n| 加赋值 | `+=` | 将右侧的值加到左侧变量的值并将结果赋给左侧变量 |\n| 减赋值 | `-=` | 将右侧的值从左侧变量的值中减并将结果赋给左侧变量\
    \ |\n| 乘赋值 | `*=` | 将右侧的值乘以左侧变量的值并将结果赋给左侧变量 |\n| 除赋值 | `/=` | 将左侧变量的值除以右侧的值并将结果赋给左侧变量\
    \ |\n| 取模赋值 | `%=` | 左侧变量的值对右侧的值取模 |\n| 左移赋值 | `<<=` | 执行左移并赋值 |\n| 右移赋值 | `>>=`\
    \ | 执行右移并赋值 |\n| 位与赋值 | `&=` | 执行位与操作并赋值 |\n| 位异或赋值 | `^=` | 执行位异或操作并赋值 |\n| 位或赋值\
    \ | `|=` | 执行位或操作并赋值 |\n\n## 杂项运算符\n\n除了上述之外，Java 还支持几种其他运算符。\n\n### 条件运算符 ( ?\
    \ :)\n条件运算符是一个包含三个操作数的运算符。本质上，该运算符用于布尔表达式的评估。该运算符测试第一个操作数或条件，如果条件为真，则将第二个值赋给变量。然而，如果条件为假，则将第三个操作数赋给变量。\n\
    \n该运算符的语法如下：\n`变量 a = (<条件>) ? 真值 : 假值`\n\n```\npublic class myTest {\n    public\
    \ static void main(String args[]) {\n        int x, y;\n        x = 5;\n     \
    \   y = (x == 5) ? 15: 40;\n        System.out.println(\"y = \" + y);\n      \
    \  y = (x == 34) ? 60: 95;\n        System.out.println(\"x = \" + y);\n    }\n\
    }\n```\n编译并执行此代码将得到以下结果：y = 15 x = 95\n\n### instanceof 运算符\n只有对象引用变量可以使用此运算符。该运算符的目标是检查一个对象是否是现有类的实例。该运算符的语法如下：\n\
    `(<对象引用变量>) instanceof(<接口/类>)`\n\n```\npublic class myTest {\n    public static\
    \ void main(String args[]) {\n        int x = 4;\n        boolean resultant =\
    \ x instanceof int;\n        System.out.println(resultant);\n    }\n}\n```\n此代码的输出应为\
    \ true。此运算符也可以用于比较。一个示例实现如下：\n\n```\nclass Animal {}\npublic class Monkey extends\
    \ Animal {\n    public static void main(String[] args[]) {\n        Animal newa\
    \ = new Monkey();\n        boolean resultant = newa instanceof Monkey;\n     \
    \   System.out.println(resultant);\n    }\n}\n```\n此代码的输出也将为 true。\n\n"
