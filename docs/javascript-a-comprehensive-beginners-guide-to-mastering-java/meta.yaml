    # # Chapter 1: What is JavaScript


    JavaScript, abbreviated JS, is a high-level programming language introduced to
    add specific programs to web pages, and it has been adopted by all major web browsers.
    JavaScript can be used to build interactive web applications to function appropriately
    without reloading every page per-action. JavaScript is used to create different
    forms of activities within web pages and is one of the essential components of
    the World Wide Web (www), which are HTML (Hypertext Markup Language) and CSS (Cascading
    Style Sheets). JavaScript and HTML are used to develop web pages. JavaScript brings
    a page to life by adding special effects such as sliders, pop-ups, form validations,
    etc. CSS determines the color intensity, image size, background colors, typeface,
    font size, etc.


    # Client-Side JavaScript


    Client-Side JavaScript is the usual form of JavaScript language. The script must
    be inserted or referenced by an HTML document so that the browser can interpret
    the code. It enables web pages to include interactive programs with the user,
    develop HTML content dynamically, and command the browser. Users JavaScript code
    when they want to submit forms and also determine if all entries are valid before
    it transfers them to the server.


    # Advantages of JavaScript'
  - '[PAGE 7]


    · With JavaScript, users can organize input before getting the page sent to the
    server, which automatically reduces loads on the server.


    · JavaScript enables swift response to page visitors. The page does not have to
    reload before visitors can see if there was an error in typing.


    · JavaScript is used to build a reactive interface that gives a reaction when
    the mouse hovers over them.


    # Limitations of JavaScript


    JavaScript programming language lacks the following essential features. They are:


    +   · For security reasons, client-side JavaScript does not read or write files


    +   · JavaScript for networking applications


    +   · JavaScript does not contain multiprocessor capabilities


    # JavaScript Development Tools


    You do not need an expensive development tool to write JavaScript codes. You can
    write with a simple text editor such as Microsoft FrontPage, Macromedia Dreamweaver
    MX, Macromedia HomeSite 5, etc.


    # Javascript Placement


    JavaScript code is inserted anywhere in an HTML document. However, you want to
    insert JavaScript code in an HTML file like this:


    The Script within <head></head> part.


    The Script within <body></body> part.'
