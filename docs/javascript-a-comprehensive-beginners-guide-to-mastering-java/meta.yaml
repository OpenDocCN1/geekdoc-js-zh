  md: '# Chapter 12: Asynchronous Programming


    The processor is a vital part of a computer that performs the individual steps
    that balance our programs. The speed level of something like a loop that influences
    numbers completion depends on the processor''s speed. A lot of programs communicate
    with things outside of the processor. For instance, they may interact through
    a computer network or demand for data from the hard disk, which is quite slower
    than obtaining it from memory. In part, the operating system handles this part
    and will change the processor between various programs that are running.


    Asynchronicity


    In the asynchronous programming model, everything occurs one at a time. If you
    call a function that executes a long duration action, results will return when
    the operation completes only. No other action would be able to take place during
    execution. An asynchronous model enables several things to occur at the same time.
    When an action begins, the program does not stop running. When the task completes,
    it notifies the program and can access the result (for instance, the information
    read from disk). You can differentiate between synchronous and asynchronous programming
    through a little example: a program that obtains two resources from the network
    and then unifies the results.'
