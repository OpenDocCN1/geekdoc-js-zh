    # Debugging


    When a program displays an error, the next thing is to determine the problem and
    get it fixed. The error message will point directly at a particular line in your
    block of code. Take a look at the error description, and you will find the problematic
    line. This example program tries to transform a whole number into a string within
    set base (decimal, binary, and so on) by continuously selecting the last digit
    and dividing the number to eradicate the digit.


    ```

    function numberToString(n, base = 10) {

    let result = "", sign = "";

    if (n < 0) {

    sign = "-";

    n = -n;

    }

    do {

    result = String(n % base) + result;

    n /= base;

    } while (n > 0);

    return sign + result;

    }

    console.log(numberToString(13, 10));

    n// -> 1.5e-3231.3e-3221.3e-3211.3e-3201.3e-3191.3e...-3181.3

    ```'
