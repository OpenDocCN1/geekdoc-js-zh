    \ JavaScript 函数值来表示 Egg 函数的值。求值的递归布局与解析器的布局相似，两者在解析时通过评估器结合解析器并执行 `evaluate`，但将它们分离可以让程序结构更清晰。这就是组合\
    \ Egg 所需的所有。\n\n## 特殊形式\n\n`specialForms` 对象描述了 Egg 中独特的语法。它将单词与访问此类形式的函数关联。目前它是空的。让我们插入\
    \ `if`。\n\n```javascript\nspecialForms.if = (args, scope) => {\n  if (args.length\
    \ != 3) {\n    throw new SyntaxError(\"Wrong number of args to if\");\n  } else\
    \ if (evaluate(args[0], scope) !== false) {\n    return evaluate(args[1], scope);\n\
    \  } else {\n    return evaluate(args[2], scope);\n  }\n};\n```\n\nEgg 的 `if`\
    \ 结构期望三个参数。它会访问第一个，如果值不是 `false`，则移动访问第二个。否则，访问第三个。`if` 形式看起来更像 JavaScript 的三元运算符\
    \ `?:` 而不是 JavaScript 的语句。它是一个表达式而不是语句，并提供一个值（第二个或第三个参数的结果）。Egg 在处理条件值方面与 JavaScript\
    \ 不同。它不会将零或空字符串视为 `false`，只有在调用函数之前，才会访问函数的参数。\n\n```javascript\nspecialForms.while\
