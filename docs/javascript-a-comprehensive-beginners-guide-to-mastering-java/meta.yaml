    # 引言


    JavaScript 是一种遵循 ECMAScript 规范的卓越且成熟的编程语言。该编程语言由强类型系统、大括号语法、高质量函数和基于原型的面向对象组成。配合
    HTML 和 CSS，JavaScript 是世界维网的重要技术之一。JavaScript 促进了可交互网页的实现，是 Web 应用的关键组成部分。几乎每个网站都使用
    JavaScript，所有主要的网页浏览器都包含 JavaScript 引擎以确保正常运行。Brendan Eich 在 1995 年于 Netscape
    Communications 时开发了 JavaScript。JavaScript 有助于功能型、事件驱动、基于原型和面向对象的编程风格。JavaScript
    通过确认用户在客户端执行的操作来升级 Web 用户界面。你可以将 JavaScript 引擎插入不同类型的主机软件中，包括数据库、Web 服务器以及非网络相关的程序（如文字处理器）。


    本书将进一步解释 JavaScript 的概念，旨在帮助你在没有压力的情况下学习和理解 JavaScript 语言。学习 JavaScript 需要 HTML、文本编辑器、网页浏览器和
    CSS 知识。要开始学习，必要的工具之一是文本编辑器，它是编写代码所需的。你还需要一个浏览器来查看开发的网页。有不同类型的文本编辑器，如 Sublime Text、Notepad++，以及如
    Firefox、Google Chrome 等浏览器。


