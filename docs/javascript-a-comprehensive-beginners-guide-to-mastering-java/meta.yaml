    ## 第 2 章：值、类型和运算符


    在计算机世界中，存在数据。你可以创建新数据、读取数据和更改数据，它们都被存储为一系列看似连续的位（bits）。将位定义为接收强或弱信号、以及来自计算机内部高或低电荷的
    0 和 1。所有数据和信息片段都被描述为 0 和 1 的序列，并用位表示。


    ### 值


    深吸一口气，想象一片比特海洋。最新的 PC 在数据存储中包含超过 300 亿个位。我们使用位来创建值。计算机能够正常运行，是因为每一位信息都被拆分成了值。每个值由一个影响其角色的类型组成，值可以是数字、文本或函数等。要生成值，你需要调用它的名称，它会从存储的地方出现。


    ### 算术


    算术是处理数字的主要任务。对多个数字进行乘法、加法和减法产生另一个数字的操作称为算术运算。以下是在 JavaScript 中的示例：


    ```javascript

    100 + 4 * 11

    ```


    `+` 和 `*` 符号被称为运算符，第一个表示加法，另一个表示乘法。在两个值之间插入运算符将产生另一个值。`-` 运算符用于减法，`/` 运算符用于除法。如果运算符在没有括号的情况下一起出现，运算符的优先级决定了它们的应用方式。如果几个优先级相同的运算符相邻出现（如
    `1 - 2 + 1`），则从左到右应用：`(1 - 2) + 1`。


    ### 特殊数字


    JavaScript 由三个唯一值组成，它们行为不像数字但被视为数字。`Infinity`（无穷）和 `-Infinity`（负无穷）是前两个，代表正无穷和负无穷，最后一个值是
    `NaN`。NaN 表示“不是数字”，尽管它是一个数字类型的值。


    ### 字符串


    字符串是数字的序列。字符串是下一个数据类型，它们代表文本。字符串将其内容限制在引号中。


    > `Down the walkway path.`

    > "On top of the roof."

    > ''I am at home.''


    使用不同类型的引号（如双引号、单引号或反引号）来标记字符串。字符串必须匹配至关重要。引号内的元素由 JavaScript 创建一个字符串值。JavaScript
    使用 Unicode 标准为每个需要的字符分配数字，包括阿拉伯语、亚美尼亚语、日语等。你不能对字符串进行减法、乘法或除法，但你可以使用 `+` 运算符，它不是相加而是将两个字符串拼接在一起。拼接意味着将字符串胶在一起。


    ### 一元运算符


    符号并不代表所有的运算符。你可以用单词写出一些运算符。一个清晰的例子是某种类型的运算符，这个运算符创建一个带有 `typeof console.log` 名称的字符串值：`console.log(typeof
    4.5)`


    ```javascript

    // -> number

    console.log(typeof "x")

    // -> string

    ```


    第二个显示的运算符被称为二元运算符，因为它们使用两个值；使用一个值的运算符是一元运算符 `console.log(- (10 - 2))`。


    ```javascript

    // -> -8

    ```


    字体 布尔值


    布尔是一种仅在两种可能性之间区分的值，如“开启”和“关闭”等。布尔值只包含 `true` 和 `false`。


    ### 比较


    比较是创建布尔值的方法：`console.log(3 > 2)`


    ```javascript

    // -> true

    ```


    ```javascript

    console.log(3 < 2)

    ```


    ```javascript

    // false

    ```


    `>` 和 `<` 字符分别代表“大于”和“小于”符号。你可以在布尔中使用二元运算符来确定包含的值是 `true` 还是 `false`。


    你可以同样地比较字符串。


    ```javascript

    console.log("Aardvark") < "Zoroaster")

    ```


    ```javascript

    // true

    ```


    你可以按照字母顺序指示字符串，大写字母通常比小写字母“小”，所以 `"Z" < "a"`，且非字母字符（`!`、`\` 等）也存在于排序中。当 JavaScript
    想要比较字符串时，它从左到右识别字符，单独区分 Unicode 编码。


    这里是其他相关的运算符：`<=`（小于等于）、>=`（大于等于）、`==`（等于）、`!=`（不等于）。当 JavaScript 想要比较字符串时，它从左到右识别字符，单独区分
    Unicode 编码。（注：OCR 文本有重复，我将遵循逻辑流）。


