  md: '# Introduction


    JavaScript is a distinguished and deciphered programming language that adheres
    to the ECMAScript specification. The programming language consists of high-powered
    typing, the curly bracket syntax, top-quality functions, and prototype-based object-orientation.
    Accompanied by HTML and CSS, JavaScript is one of the significant technologies
    of the World Wide Web. JavaScript facilitates interchangeable web pages and is
    a vital part of web applications. Almost every website utilizes JavaScript, and
    all the significant web browsers consist of the JavaScript engine to function
    correctly. Brendan Eich developed JavaScript in 1995 when he was with Netscape
    Communications. JavaScript aids functional, event-driven, prototype-based and
    object-oriented programming styles. JavaScript upgrades web user interface by
    affirming activities taken on the client-side by the user. You can insert JavaScript
    engines into different types of host software, which includes databases and web
    servers, and non-web related programs like word processors.


    The concepts of JavaScript are explained further in this book with the goal to
    help you learn and understand JavaScript language without pressure. The knowledge
    of HTML, text editor, web browser, and CSS are all that''s needed to learn JavaScript.
    To get the learning process started, one of the essential tools is a text editor,
    and it is required to write codes. You''ll also a browser to unveil your developed
    web pages. There are different types of text editors such as the Sublime Text,'
