  mdcn: "\n\n本章将介绍 JavaScript 值的四种类型：字符串、数字、undefined 值和布尔值。这些值通过将它们的名称作为 `true`、`null`\
    \ 或值（如 `1`、`\"ABC\"`）产生。运算符可以整合并更改值。我们查看了用于算术（`+`, `-`, `*`, `/` 和 `%`）、字符串拼接（`+`）、比较（`==`,\
    \ `===`, `!=`, `<=`, `<`, `>=`）和逻辑（`&&`, `||`）的二元运算符，以及各种元运算符（`!` 取反、`typeof`\
    \ 查找值的类型）以及根据第三值选择两个值之一的三元运算符（`?:`）。你将获得足够的信息像小计算器一样使用 JavaScript，并在后续章节中不断进步。\n\
    \n# 练习\n\n编写一个 JavaScript 练习，通过用户定义的名称构建一个变量。\n\n解决方案\n\n# HTML 代码:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\"\
    \ content=\"width=device-width\">\n<title>使用用户定义的名称创建变量</title>\n</head>\n<body>\n\
    \n</</body>>\n</html>\n```\n\n# JavaScript 代码:\n\n```javascript\nvar var_name\
    \ = 'abcd';\nvar n = 120;\nthis[var_name] = n;\nconsole.log(this[var_name])\n\
    ```\n\n## 第 3 章：程序结构\n\n我们将开始扩展 JavaScript 编程语言命令，超越句子片段和名词。\n\n### 表达式与语句\n\n\
    产生一个值的代码块被称为**表达式**。精确写为如 `22` 的单值字面量被称为表达式。在二元运算符中设置为两个表达式的表达式，或在括号内的表达式都是表达式。一个可以像人类语言翻译一样容纳其他表达式的表达式。它使我们能够开发叙述任意复杂计算的表达式。当一个表达式类似于句子片段时，JavaScript\
    \ 语句将完成该句子。语句列表被称为**程序**，最易访问的语句类型是以分号结尾的一行代码。\n\n例如：\n\n```javascript\n;\nfalse;\n\
    ```\n\n通过此功能，语句可以独立存在，它还可以为屏幕添加偶尔更改颜色的特性，或修改机器的内部状态以影响其后的后续语句。\n\n### 绑定\n\nJavaScript\
    \ 使用变量的**绑定**来存储值，例如：\n\n获取钱 → `5 * 5;`\n\n`let` 是该语句中的关键字，意味着该句子将指定一个绑定，并可以使用\
    \ `=` 运算符和表达式附带绑定名称和值。将定义的绑定作为表达式使用，即一个包含绑定值的表达式。下面是一个示例：\n\n```javascript\nlet\
    \ ten = 10;\nconsole.log(ten * ten);\n// → 100\n```\n\n`=` 运算符用于现有的绑定，以从设置值中移除绑定并将其指向新值。\n\
    `let mood = \"light\";`\n\n```javascript\nconsole.log(mood);\n// → light\nmood\
    \ = \"dark\";\nconsole.log(mood);\n// → dark\n```\n\n定义绑定但不赋值值将导致没有内容可供。因此，请求绑定的值会产生\
    \ `undefined` 值。你可以通过逗号分隔的单一语句定义多个绑定，\n\n```javascript\nlet one = 1, two = 2;\n\
    console.log(one + two);\n// → 3\n```\n\n使用 `var` 和 `const` 关键字来熟悉地开发绑定：\n`var\
    \ name = \"Ayad\";`\n\n```javascript\nconst greeting = \"Hello \";\nconsole.log(greeting\
    \ + name);\n// -> Hello Ayad\n```\n\n`const` 词意味着**常量**。它描述了一种坚定的绑定，在其整个生命周期内指向其设置的值。这些词通常用于声明一个名称绑定到一个值，以便稍后轻松引用。\n\
    \n### 绑定名称\n\n尽管有一些如 `const`、`class`、`default`、`break`、`continue`、`delete` 或 `else`\
    \ 等保留字，但任何单词都可以作为绑定名称，它也可以包含数字，但语句不能以数字开头。绑定名称还可以包含美元符号（`$`）或下划线（`_`），但不接受任何其他特殊字符或标点符号。\n\
    \n### 环境\n\n在特定时刻存在的绑定和值的组被称为**环境**。当你启动程序时，环境持有语言标准绑定，并通常包含创建与系统环境交互的绑定。例如，浏览器携带了可以与启动的网站通信的函数，以及读取键盘和鼠标输入的函数。\n\
