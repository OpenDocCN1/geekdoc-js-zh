    Tick\"), 500);` 等待并不是理想的工作，但当你运行像动画更新或检查函数耗时是否超过指定时间之类的程序时，它是适用的。通过回调连续运行多个异步任务意味着你必须继续设置新函数，以控制操作后计算的延续。\n\
