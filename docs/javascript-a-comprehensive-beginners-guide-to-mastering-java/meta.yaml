    \ the precedence of the operators decides the way they are applied. If several\
    \ operators with the same precedence show right next to each other like 1 - 2\
    \ + 1, apply them left to right: (1 - 2) + 1.\n\n### Special numbers\n\nJavaScript\
    \ consists of three unique values that do not act like numbers but are regarded\
    \ as numbers. Infinity and -Infinity are the first two, which mean the positive\
    \ and negative infinities, and the last value is the NaN. NaN says “not a number,”\
    \ although it is a value of the number type.\n\n### Strings\n\nA string is the\
    \ succession of numbers. The string is the next data type, and they represent\
    \ text. Strings confine their content in quotes.\n\n> `Down the walkway path.`\n\
    > \"On top of the roof.\"\n> 'I am at home.'\n\nQuotes are used in different types\
