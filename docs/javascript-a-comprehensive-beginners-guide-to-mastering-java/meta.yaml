    # # Chapter 5: Data Structures:

    Objects and Arrays


    Data layouts develop from Booleans, strings, and numbers fragments. Several types
    of information use more than one chunk. Objects enable the user to collate values
    together with other objects to develop more compound layouts. In this chapter,
    you will understand the concepts of solving a real problem at hand.


    ### Data sets


    If you want to work with a lot of digital data, you must represent the digital
    data in the machine memory. For instance, you need to represent a group of numbers
    like 2, 3, 5, 7, and 11. Now let''s get prolific with our use of strings as strings
    can contain a lot of data. We will use 2 3 5 7 11 as the representation. JavaScript
    programming language offers a unique data type for saving sequences of values,
    which is called an array. Write an array as a list of values within the between
    square brackets, differentiated by commas.


    ```javascript

    let listOfNumbers = [2, 3, 5, 7, 11];

    console.log(listOfNumbers[2]);

    // → 5

    console.log(listOfNumbers[0]);

    // → 2

    console.log(listOfNumbers[2 - 1]);

    // → 3

    ```


    The notation used to get elements within an array also utilize the square brackets.
    A complete square brackets pair right after an expression that contains another
    expression within. When you start counting elements in an array, you begin from
    zero and not one. Therefore the first element is redeemed with listOfNumbers[0].


    ### Properties


    The previous chapters have contained expressions like `myList.length` (to calculate
    the length of a string) and `Math.max` (the maximum function). These are properties
    that can approach property values. Virtually all JavaScript values contain properties.
    The few values that do not contain properties are null and undefined. If you access
    a property with a nonzero, the result will be an error.


    ```javascript

    null.length;

    // -> TypeError: null has no properties

    ```


    In JavaScript, the two major ways to evaluate properties are with a dot and square
    brackets. `value.x` and `value[x]` can evaluate the property on value, not particularly
    the same property. How you use x is different from how you use a dot.


    If you want to use the dot, the text you input after the dot is the name of the
    property. And if you''re going to use the square brackets, the expression within
    the brackets is accessed to redeem the property name. `Value.x` delivers the property
    of value called “x”, while `value[x]` accesses the expression x and utilize the
    result, transformed into a string as the name of the property. If the property
    you want is named color, you should type `value.color`. You can withdraw the property
    that the value called within the binding i, type `value[i]`. The name of properties
    are strings, but the dot notation performs with only valid binding names. Therefore
    if you want to evaluate a property named 2 or John Doe, use the square brackets:
    `value[2]` or `value["John Doe"]`.


    The elements within an array save as the properties of an array that utilize numbers
    as property names. An array''s length property determines how many items it contains.
    The name of that property is a valid, binding name. Type `array.length` to determine
    the length of an array, it is much easier to type than the `array["length"]`.


    ### Methods


    The string and array objects accommodate several properties that store function
    values.


    ```javascript

    let doh = "Doh";

    console.log(typeof doh.toUpperCase);

    // -> function

    console.log(doh.toUpperCase());

    // -> Doh

    ```


    Each string consists of a `toUpperCase` property. When you call this property,
    it sends back a copy of the string whereby all the containing letters transform
    into uppercase. Although the `toUpperCase` do not go through an argument, the
    function can evaluate the string "Doh," which is the property of the value called
    above. Properties that consist of functions are known as methods. The below example
    illustrates two methods that can be used to influence arrays.


    ```javascript

    let sequence = [1, 2, 3];

    sequence.push(4);

    console.log(sequence);

    // -> [1, 2, 3, 4]

    sequence.pop();

    console.log(sequence);

    // -> [1, 2, 3]

    ```


    The `push` method adds an element to the end of an array. The `pop` method removes
    the last element from an array and returns it. The `shift` method removes the
    first element from an array. The `unshift` method adds an element to the beginning
    of an array. The `splice` method can change the contents of an array by removing
    or replacing existing elements. The `slice` method returns a shallow copy of a
    portion of an array into a new array object. The `join` method joins all the elements
    of an array into a string. The `filter` method creates a new array with all elements
    that pass the test implemented by the provided function. The `map` method creates
    a new array by performing a function on each array element. The `reduce` method
    executes a reducer function on each element of the array, resulting in a single
    output value. The `sort` method sorts the elements of an array in place. The `forEach`
    method calls a provided function once for each element.


    The `in` operator returns true if the specified property is in an object. The
    `hasOwnProperty()` method returns true if the object has the specified property
    as its own property.


    ```javascript

    let person = {name: "Alice", age: 25};

    console.log("name" in person); // true

    console.log("gender" in person); // false

    console.log(person.hasOwnProperty("name")); // true

    console.log(person.hasOwnProperty("id")); // false

    ```

