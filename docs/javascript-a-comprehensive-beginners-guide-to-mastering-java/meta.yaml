    \ protected. It is only for personal use. You cannot amend, distribute, use, quote\
    \ or paraphrase any part, or the content within this book, without the consent\
    \ of the author or publisher.\n\n# Disclaimer Notice:\n\nPlease note the information\
    \ contained within this document is for educational and entertainment purposes\
    \ only. All effort has been executed to present accurate, up to date, reliable,\
    \ complete information. No warranties of any kind are declared or implied. Readers\
    \ acknowledge that the author do not engage in the rendering of legal, financial,\
    \ medical, or professional advice. The content within this book has been derived\
    \ from various sources. Please consult a licensed professional before attempting\
    \ any techniques outlined in this book.\n\nBy reading this document, the reader\
    \ agrees that under no circumstances is the author responsible for any losses,\
    \ direct or indirect, that are incurred as a result of the use of the information\
    \ contained within this document, including, but not limited to, errors, omissions,\
    \ or inaccuracies.\n\n# TABLE OF CONTENTS\n\n- Introduction\nChapter 1: What is\
    \ JavaScript\nChapter 2: Values, Types, and Operators\nChapter 3: Program Structure\n\
    Chapter 4: Functions\nChapter 5: Data Structures: Objects and Arrays\nChapter\
    \ 6: Higher-Order Functions\nChapter 7: The Secret Life of Objects\nChapter 8:\
    \ A Robot\nChapter 9: Bugs and Errors\nChapter 10: Regular Expressions\nChapter\
    \ 11: Modules\nChapter 12: Asynchronous Programming\nConclusion\n\n# Introduction\n\
    \nJavaScript is a distinguished and deciphered programming language that adheres\
    \ to the ECMAScript specification. The programming language consists of high-powered\
    \ typing, the curly bracket syntax, top-quality functions, and prototype-based\
    \ object-orientation. Accompanied by HTML and CSS, JavaScript is one of the significant\
    \ technologies of the World Wide Web. JavaScript facilitates interchangeable web\
    \ pages and is a vital part of web applications. Almost every website utilizes\
    \ JavaScript, and all the significant web browsers consist of the JavaScript engine\
    \ to function correctly. Brendan Eich developed JavaScript in 1995 when he was\
    \ with Netscape Communications. JavaScript aids functional, event-driven, prototype-based\
    \ and object-oriented programming styles. JavaScript upgrades web user interface\
    \ by affirming activities taken on the client-side by the user. You can insert\
    \ JavaScript engines into different types of host software, which includes databases\
    \ and web servers, and non-web related programs like word processors.\n\nThe concepts\
    \ of JavaScript are explained further in this book with the goal to help you learn\
    \ and understand JavaScript language without pressure. The knowledge of HTML,\
    \ text editor, web browser, and CSS are all that's needed to learn JavaScript.\
    \ To get the learning process started, one of the essential tools is a text editor,\
    \ and it is required to write codes. You'll also need a browser to unveil your\
    \ developed web pages. There are different types of text editors such as the Sublime\
    \ Text, Notepad++ and browsers such as Firefox, Google Chrome, and so on.\n\n\
    # Chapter 1: What is JavaScript\n\nJavaScript, abbreviated JS, is a high-level\
    \ programming language introduced to add specific programs to web pages, and it\
    \ has been adopted by all major web browsers. JavaScript can be used to build\
    \ interactive web applications to function appropriately without reloading every\
    \ page per-action. JavaScript is used to create different forms of activities\
    \ within web pages and is one of the essential components of the World Wide Web\
    \ ([www](https://www.w3.org/standards/)), which are HTML (Hypertext Markup Language)\
    \ and CSS (Cascading Style Sheets). JavaScript and HTML are used to develop web\
    \ pages. JavaScript brings a page to life by adding special effects such as sliders,\
    \ pop-ups, form validations, etc. CSS determines the color intensity, image size,\
    \ background colors, typeface, font size, etc.\n\n## Client-Side JavaScript\n\n\
    Client-Side JavaScript is the usual form of JavaScript language. The script must\
    \ be inserted or referenced by an HTML document so that the browser can interpret\
    \ the code. It enables web pages to include interactive programs with the user,\
    \ develop HTML content dynamically, and command the browser. Users use JavaScript\
    \ code when they want to submit forms and also determine if all entries are valid\
    \ before it transfers them to the server.\n\n## Advantages of JavaScript\n\n-\
    \ With JavaScript, users can organize input before getting the page sent to the\
    \ server, which automatically reduces loads on the server.\n- JavaScript enables\
    \ swift response to page visitors. The page does not have to reload before visitors\
    \ can see if there was an error in typing.\n- JavaScript is used to build a reactive\
    \ interface that gives a reaction when the mouse hovers over them.\n\n## Limitations\
    \ of JavaScript\n\nJavaScript programming language lacks the following essential\
    \ features. They are:\n\n- For security reasons, client-side JavaScript does not\
    \ read or write files\n- JavaScript for networking applications\n- JavaScript\
    \ does not contain multiprocessor capabilities\n\n# JavaScript Development Tools\n\
    \nYou do not need an expensive development tool to write JavaScript codes. You\
    \ can write with a simple text editor such as Microsoft FrontPage, Macromedia\
    \ Dreamweaver MX, Macromedia HomeSite 5, etc.\n\n# JavaScript Placement\n\nJavaScript\
    \ code is inserted anywhere in an HTML document. However, you want to insert JavaScript\
    \ code in an HTML file like this:\n\nThe Script within <head></head> part.\n\n\
    The Script within <body></body> part.\n\nJavaScript code is inserted anywhere\
    \ in an HTML document. However, you want to insert JavaScript code in an HTML\
    \ file like this:\n\nThe Script within <head></head> part.\n\nThe Script within\
    \ <body></body> part.\n\nIn some cases, when you want the script to run on a special\
    \ event, such as an action when a button clicked, place the script in the head\
    \ like this:\n\n```html\n<html>\n<head>\n<script type=\"text/JavaScript\">\nfunction\
    \ sayHi() {\n  alert(\"Hello World\")\n}\n</script>\n</head>\n<body>\n<input type=\"\
    button\" onclick=\"sayHi()\" value=\"Say Hi\" />\n</body>\n</html>\n```\n\nSometimes\
    \ you want a script to run immediately and to create on the page, insert the script\
    \ within the body section. This is what the code should look like:\n\n```html\n\
    <html>\n<head>\n</head>\n```\n\n```html\n<body>\n<script type=\"text/JavaScript\"\
    >\ndocument.write(\"Hello World\")\n</script>\n<p>This is web page body</p>\n\
    </body>\n</html>\n```\n\n# JavaScript in <body> and <head> Sections\n\nInsert\
    \ your JavaScript code in <head> and <body> section like this:\n\n```html\n<html>\n\
    <head>\n<script type=\"text/JavaScript\">\nfunction sayHi() {\n  alert(\"Hello\
    \ World\")\n}\n</script>\n</head>\n<body>\n<script type=\"text/JavaScript\">\n\
    document.write(\"Hello World\")\n</script>\n<input type=\"button\" onclick=\"\
    sayHi()\" value=\"Say Hi\" />\n</body>\n</html>\n```\n\n# JavaScript in External\
    \ Files\n\nTo avoid the use of identical JavaScript code repetition, the language\
    \ enables you to create an external file and store JavaScript codes and then integrate\
    \ the external file into the HTML files. The sample below displays how to integrate\
    \ an external JavaScript file within the HTML code utilizing the script tag and\
    \ src attribute.\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
    \ src=\"filename.js\"></script>\n</head>\n<body>\n......\n</body>\n</html>\n```\n\
    \nThe external file source file should be saved with an extension .js.\n\nSummary\n\
    \nIn this first chapter, we explained the origination of JavaScript and its placement\
    \ into internal and external files. We discussed the use of JavaScript to build\
    \ interactive web applications to perform appropriately without having to reload\
    \ every page per action.\n\nExercise\n\nHow do you insert JavaScript code into\
    \ the head, body and include external file script in an HTML document?\n"
