    应用，使其在无需每次操作都重新加载页面的情况下正常运行。JavaScript 用于在网页内创建不同形式的活动，是世界维网 ([www](https://www.google.org))
    的核心组件之一。JavaScript 可以在网页中创建不同形式的活动。HTML（Hypertext Language 超文本标记语言）和 CSS（Cascading
