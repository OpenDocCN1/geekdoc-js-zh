  \ {\n  color: white;\n}\n.delete {\n  color: rgb(235, 81, 81);\n}\n```\n\n### `crud/page.js`\n\
  \n```javascript\n// 渲染 Todo 项目的组件\n\"use client\";\nimport styles from \"./page.module.css\"\
