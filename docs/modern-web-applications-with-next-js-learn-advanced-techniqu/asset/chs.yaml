  React 组件化架构背后有两个主要原则如下：\n\n- **单一职责原则**：每个组件应该有一个单一的职责或目的。这使得代码更易于理解、测试和维护。\n- **组合**：组件可以组合在一起以构建更复杂的\
  \ UI 结构。这允许开发者复用组件并创建更具维护性的代码。\n\n这是一个组件化 UI 的简单示例：\n\n```javascript\nimport React\
  \ from “react\";\nimport Header from \"./Header\";\nimport Content from \"./Content\"\
  ;\nimport Footer from \"./Footer\";\n\nfunction App() {\n  return (\n    <div>\n\
  \      <Header />\n      <Content />\n      <Footer />\n    </div>\n  );\n}\n\n\
  export default App;\n```\n\n在这个示例中，`App` 组件由三个其他组件组成：`Header`、`Content` 和 `Footer`。这些组件中的每个都有自己的职责，使得整个应用程序更容易维护和理解。\n\
  \n## 理解函数组件和类组件\n\nReact 组件可以写为函数组件或类组件。在 React 16.8 引入 Hooks 之前，函数组件是无状态的，仅用于展示数据，而类组件是有状态的，并用于更复杂的逻辑。然而，随着\
  \ Hooks 的引入，函数组件现在可以拥有状态并执行副作用，使它们更加强大和灵活。\n\n函数组件比类组件更简单、更简洁，是许多开发者的首选。它们仅仅是接收\
  \ `props` 作为输入并返回 JSX 来渲染 UI 的 JavaScript 函数。\n\n这里是一个函数组件的示例：\n\n```javascript\n\
  import React from “react\";\nfunction Welcome(props) {\n  return <h1>Hello, {props.name}!</h1>;\n\
  }\n\nexport default Welcome;\n```\n\n相比之下，类组件是继承自 `React.Component` 类的 JavaScript\
  \ 类。它们有一个返回 JSX 的 `render()` 方法，并拥有本地状态和生命周期方法。\n\n这是一个类组件的示例：\n\n```javascript\n\
  import React, { Component } from “react\";\nclass Welcome extends Component {\n\
  \  render() {\n    return <h1>Hello, {this.props.name}!</h1>;\n  }\n}\n\nexport\
  \ default Welcome;\n```\n\n虽然 React 仍然支持类组件，但 Hooks 的引入让函数组件变得更加强大和通用。Hooks 允许你在不写类的情况下使用状态和其他\
  \ React 特性，从而产生更整洁、更易读的代码。\n\n为了说明在函数组件中使用 Hooks，让我们之前的类组件示例转换为带有状态的函数组件：\n\n```javascript\n\
  import React, { useState } from “react\";\nfunction Welcome() {\n  const [name,\
  \ setName] = useState(“John\");\n  const handleChange = (event) => {\n    setName(event.target.value);\n\
  \  };\n  return (\n    <div>\n      <h1>Hello, {name}!</h1>\n      <input type=”text”\
  \ value={name} onChange={handleChange} />\n    </div>\n  );\n}\n\nexport default\
  \ Welcome;\n```\n\n在这个示例中，我们使用 `useState` Hook 来管理函数组件中的 `name` 状态。我们还定义了 `handleChange`\
  \ 函数来处理输入变化。\n\n## React 组件生命周期方法及其用法\n\n让我们解释一下 React 组件的生命周期方法及其益处。\n\n- **生命周期方法概述**：生命周期方法是类组件中的特殊方法，允许你在组件生命周期的特定点运行代码。它们对于管理副作用（如获取数据、更新\
  \ DOM 和处理事件）至关重要。生命周期方法分为三个主要阶段：挂载、更新和卸载。\n\n**注意**：随着 Hooks 的引入，函数组件现在可以使用 `useEffect`\
  \ 执行类似的任务。本节侧重于类组件的生命周期方法，但了解函数组件中的这种替代方法是有重要的。\n\n- **挂载阶段方法**：挂载阶段发生在组件被创建并插入到\
  \ DOM 时。与此阶段相关的生命周期方法有两个：\n\n    - `constructor`：构造函数用于初始化组件的状态并绑定事件处理程序。它在组件挂载之前调用。\n\
  \n      这里有一个示例：\n\n      ```javascript\n      class MyComponent extends React.Component\
  \ {\n        constructor(props) {\n          super(props);\n          this.state\
  \ = { message: “Hello, World!” };\n          this.handleClick = this.handleClick.bind(this);\n\
  \        }\n      }\n      ```\n\n    - `componentDidMount`：该方法在组件插入到 DOM 之后立即调用。它是获取数据、设置订阅或执行其他副作用的理想位置。\n\
  \n\n\n\n\n```javascript\nclass MyComponent extends React.Component {\n  componentDidMount()\
  \ {\n    console.log(\"Component has been mounted.\");\n  }\n}\n```\n\n### 更新阶段方法\
  \ (Updating phase methods)\n\n更新阶段发生在组件的状态（state）或 props 变化时，会导致重新渲染。与此阶段有两个生命周期方法：\n\
  \n*   `shouldComponentUpdate`: 该方法在重新渲染之前调用，允许你根据状态或 props 的变化判断组件是否应该更新。默认情况下，它返回\
  \ `true`。如果你返回 `false`，组件将不会更新，剩余的生命周期方法也不会被调用。\n\n这里是一个示例：\n\n```javascript\nclass\
  \ MyComponent extends React.Component {\n  shouldComponentUpdate(nextProps, nextState)\
  \ {\n    return this.props.someValue !== nextProps.someValue;\n  }\n}\n```\n\n*\
  \   `componentDidUpdate`: 该方法在组件更新后立即调用。它常用于响应 prop 或状态的变化来执行副作用，例如 DOM 操作或数据获取。\n\
  \n这里是一个示例：\n\n```javascript\nclass MyComponent extends React.Component {\n  componentDidUpdate(prevProps,\
  \ prevState) {\n    if (this.props.someValue !== prevProps.someValue) {\n      console.log(\"\
  someValue has changed.\");\n    }\n  }\n}\n```\n\n### 卸载阶段方法 (Unmounting phase methods)\n\
  \n卸载阶段发生在组件从 DOM 中移除时。与此阶段有一个生命周期方法：\n\n*   `componentWillUnmount`: 该方法在组件卸载和销毁之前立即调用。它是执行清理任务的最佳位置，例如取消网络请求、移除事件监听器或清除定时器。\n\
  \n这里是一个示例：\n\n```javascript\nclass MyComponent extends React.Component {\n  componentWillUnmount()\
  \ {\n    console.log(\"Component will unmount.\");\n  }\n}\n```\n\n### 生命周期方法中的错误处理\
  \ (Error handling in lifecycle methods)\n\nReact 提供了生命周期方法用于处理错误并在发生错误时显示备用 UI（fallback\
  \ UI）：\n\n*   `static getDerivedStateFromError`: 该方法在子组件抛出错误时调用。它允许你更新状态以显示备用 UI。\n\
  \n这里是一个示例：\n\n```javascript\nclass MyComponent extends React.Component {\n  static\
  \ getDerivedStateFromError(error) {\n    return { hasError: true };\n  }\n}\n```\n\
  \n*   `componentDidCatch`: 该方法在子组件捕获到错误时调用。它可以用于记录错误或执行其他副作用。\n\n这里是一个示例：\n\n```javascript\n\
  class MyComponent extends React.Component {\n  componentDidCatch(error, info) {\n\
  \    console.log(\"Error caught:\", error, info);\n  }\n}\n```\n\n这里这是一个在组件中同时使用两种错误处理方法的示例：\n\
  \n```javascript\nclass ErrorBoundary extends React.Component {\n  constructor(props)\
  \ {\n    super(props);\n    this.state = { hasError: false };\n  }\n  static getDerivedStateFromError(error)\
  \ {\n    return { hasError: true };\n  }\n  componentDidCatch(error, info) {\n \
  \   console.log(\"Error caught:\", error, info);\n  }\n  render() {\n    if (this.state.hasError)\
  \ {\n      return <h1>Something went wrong!</h1>;\n    }\n    return this.props.children;\n\
  \  }\n}\n\n// 使用方法:\n<ErrorBoundary>\n  <MyComponent />\n</ErrorBoundary>\n```\n\
  \n在这个示例中，`ErrorBoundary` 是一个封装了 `MyComponent` 的阶组件。如果 `MyComponent` 发生错误，错误边界将捕获它并显示备用\
  \ UI。\n\n以下点说明了何时使用特定的生命周期方法：\n\n*   使用 `constructor` 初始化状态并绑定事件处理程序。避免在构造函数中执行副作用。\n\
  *   使用 `componentDidMount` 用于获取数据、设置订阅或执行在组件首次挂载时应该发生的其他副作用。\n*   使用 `shouldComponentUpdate`\
  \ 通过根据特定的 prop 或状态变化防止不必要的重新渲染来优化性能。\n*   使用 `componentDidUpdate` 执行响应 prop 或状态变化而发生的副作用，例如更新\
  \ DOM 或获取新数据。\n*   使用 `componentWillUnmount` 执行清理任务，例如取消网络请求或移除事件监听器。\n*   使用 `getDerivedStateFromError`\
  \ 和 `componentDidCatch` 处理子组件中的错误并显示备用 UI。\n\n通过理解不同的生命周期方法及其适当的使用场景，你可以有效地管理副作用、优化性能并处理\
  \ React 组件中的错误。随着你对 React 经验的增加，你将越来越熟悉每个生命周期方法的细微差别如何在应用程序中最佳使用它们。\n\n## JSX 语法及其与传统\
  \ HTML 的区别 (JSX syntax and its differences from traditional HTML)\n\nJSX (JavaScript\
  \ XML) 是 JavaScript 的语法扩展，允许你在 JavaScript 中编写类 HTML 代码。\n\n### JSX 规则与最佳实践 (JSX\
  \ rules and best practices)\n\n以下是编写 JSX 的规则：\n\n*   JSX 必须封装在一个根元素中。如果你有多个元素，请将它们包裹在父元素中，如\
  \ `<div>` 或片段 `<>`：\n\n    ```javascript\n    // 正确\n    function MyComponent()\
  \ {\n      return (\n        <>\n          <h1>Title</h1>\n          <p>Content</p>\n\
  \        </>\n      );\n    }\n    ```\n\n    ```javascript\n    // 错误\n    function\
  \ MyComponent() {\n      return (\n        <h1>Title</h1>\n        <p>Content</p>\n\
  \      );\n    }\n    ```\n\n*   JSX 标签在没有内容时可以是自闭的。请确保在角括号前包含斜杠，例如 `<img />` 或\
  \ `<input />`：\n\n    ```javascript\n    function MyComponent() {\n      return\
  \ <img src=\"example.jpg\" alt=\"Example\" />;\n    }\n    ```\n\n*   JSX 中的属性名称使用驼峰命名法（camelCase）而不是横线命名法（kebab-case）。例如，使用\
  \ `onClick` 代替 `on-click`，使用 `className` 代替 `class`：\n\n    ```javascript\n    function\
  \ MyComponent() {\n      return (\n        <button onClick={() => console.log(\"\
  Clicked\")} className=\"btn\">\n          Click me\n        </button>\n      );\n\
  \    }\n    ```\n\n## 在 JSX 中嵌入 JavaScript 表达式 (Embedding JavaScript expressions\
  \ in JSX)\n\nJSX 允许使用大括号 `{}` 嵌入 JavaScript 表达式。你可以使用此功能在 JSX 中显示变量、进行计算甚至渲染组件。\n\
  \n这里是一个示例：\n\n```javascript\nfunction Greeting(props) {\n  const name = props.name;\n\
  \  return <h1>Hello, {name}!</h1>;\n}\n```\n\n## 在 JSX 中处理条件渲染和循环\n\n条件渲染和循环是 React\
  \ 组件中的常见任务。你可以通过以下 JavaScript 表达式处理这些任务：\n\n*   对于条件渲染，使用三元运算符或逻辑与 (`&&`) 表达式：\n\
  \n    ```javascript\n    function Greeting(props) {\n      return (\n        <div>\n\
  \          {props.isLoggedIn ? (\n            <h1>Welcome back, {props.name}!</h1>\n\
  \          ) : (\n            <h1>Please log in.</h1>\n          )}\n        </div>\n\
  \      );\n    }\n    ```\n\n*   对于循环，使用 `map` 方法遍历数组并渲染元素：\n\n    ```javascript\n\
  \    function ListItems(props) {\n      const items = props.items;\n      return\
  \ (\n        <ul>\n          {items.map((item) => (\n            <li key={item.id}>{item.name}</li>\n\
  \          ))}\n        </ul>\n      );\n    }\n    ```\n\n\n\n\n\n## JSX 与 HTML\
  \ 的区别\n\n虽然 JSX 看起来与 HTML 相似，但它们之间存在一些关键区别：\n\n- **属性名称**：如前所述，JSX 使用驼峰命名（camelCase）属性名而不是短横命名（kebab-case）。例如，使用\
  \ `className` 代替 `class`，使用 `htmlFor` 代替 `for`。\n- **Style 属性**：在 JSX 中，`style`\
  \ 属性期望一个 JavaScript 对象而不是 CSS 字符串。每个 CSS 属性应该使用驼峰命名法。\n\n```javascript\nfunction\
  \ MyComponent() {\n  const divStyle = {\n    color: “blue”,\n    backgroundColor:\
  \ “white”,\n  };\n  return <div style={divStyle}>Hello, World!</div>;\n}\n```\n\n\
  - **闭合标签**：在 JSX 中，所有标签必须关闭，即使它们没有子元素。这与 HTML 不同，HTML 中某些标签（如 `<img>` 和 `<input>`）不需要关闭标签。在\
  \ JSX 中，这些元素应该是自闭合的，在结束角括号前加一个斜杠（例如，`<img />` 和 `<input />`）。\n\n```javascript\n\
  // Correct\nfunction MyComponent() {\n  return (\n    <div>\n      <img src=”example.jpg”\
  \ alt=”Example” />\n      <input type=”text” name=”username” />\n    </div>\n  );\n\
  }\n\n// Incorrect\nfunction MyComponent() {\n  return (\n    <div>\n      <img src=”example.jpg”\
  \ alt=”Example”>\n      <input type=”text” name=”username”>\n    </div>\n  );\n\
  }\n``` （等待，下方是闭合括号）\n\n- **JavaScript 表达式**：JSX 允许你使用大括号 `{}` 嵌入 JavaScript 表达式。这一功能在\
  \ HTML 中是不可用的，在 HTML 中，你必须使用模板字面量或其他机制来实现类似的功能。\n- **自定义组件**：JSX 允许你创建自定义组件，并可以像\
  \ HTML 元素相同的方式使用它们。在 HTML 中，你需要使用 Web 组件或其他方法来实现这一点。\n\n总之，JSX 是 JavaScript 的一种强大且灵活的语法扩展，允许你在\
  \ JavaScript 代码中编写编写类 HTML 的代码。通过理解它的语法规则、最佳实践以及与传统 HTML 的区别，你可以有效地使用 JSX 创建整洁且易于维护的\
  \ React 组件。凭借嵌入 JavaScript 表达式、条件渲染内容和遍历数组的能力，JSX 简化了构建复杂动态用户界面的过程。\n\n# 在 React\
  \ 中处理事件以及组件间传递传递\n\n本节将解释如何在 React 中管理事件以及向组件传递数据。\n\n## React 事件处理基础\n\n在 React\
  \ 中处理事件与在原生 JavaScript 中处理事件相似。然而，在 React 中处理事件时，需要注意一些区别和最佳实践，包括：\n\n- **事件名称**：在\
  \ React 中，事件名称使用驼峰命名法，例如 `onClick`、`onSubmit` 和 `onMouseMove`。\n- **事件处理器**：你需要传递一个函数作为事件处理器，而不是字符串。该函数将在事件触发时被调用。\n\
  \n这里有一个示例：\n\n```javascript\nfunction handleClick() {\n  console.log(“Button clicked!”);\n\
  }\n\nfunction MyComponent() {\n  return <button onClick={handleClick}>Click me</button>;\n\
  }\n```\n\n## 合成事件与事件池\n\nReact 使用了一种名为“合成事件”（Synthetic Events）的概念，它是原生浏览器事件的封装。这为跨浏览器的事件处理提供了一致的接口，并通过事件池提升了性能。你可以通过合成事件对象上的\
  \ `nativeEvent` 属性访问原生事件。\n\n这里有一个示例：\n\n```javascript\nfunction handleClick(event)\
  \ {\n  console.log(“Button clicked:”, event.nativeEvent);\n}\n\nfunction MyComponent()\
  \ {\n  return <button onClick={handleClick}>Click me</button>;\n}\n```\n\n## 将事件处理器绑定到组件\n\
  \n在使用类组件时，将事件处理器绑定到组件实例上以正确访问 `this` 是至关重要的。有以下几种方法可以绑定事件处理器：\n\n- **构造函数绑定**\n\n\
  ```javascript\nclass MyComponent extends React.Component {\n  constructor(props)\
  \ {\n    super(props);\n    this.handleClick = this.handleClick.bind(this);\n  }\n\
  \  handleClick() {\n    console.log(“Button clicked:”, this);\n  }\n  render() {\n\
  \    return <button onClick={this.handleClick}>Click me</button>;\n  }\n}\n```\n\
  \n- **箭头函数**\n\n```javascript\nclass MyComponent extends React.Component {\n  handleClick\
  \ = () => {\n    console.log(“Button clicked:”, this);\n  };\n  render() {\n   \
  \ return <button onClick={this.handleClick}>Click me</button>;\n  }\n}\n```\n\n\
  - **内联箭头函数（谨慎使用，因为可能对性能产生影响）**\n\n```javascript\nclass MyComponent extends React.Component\
  \ {\n  handleClick() {\n    console.log(“Button clicked:”, this);\n  }\n  render()\
  \ {\n    return <button onClick={() => this.handleClick()}>Click me</button>;\n\
  \  }\n}\n```\n\n## 通过 props 传递数据\n\nProps 是 React 中组件间传递数据的主要机制。它们允许你将值从父组件传递给子组件，并使用提供的数据渲染子组件。\n\
  \n这里有一个示例：\n\n```javascript\nfunction Greeting(props) {\n  return <h1>Hello, {props.name}!</h1>;\n\
  }\n\nfunction App() {\n  return <Greeting name=”John” />;\n}\n```\n\n## 使用回调函数进行父子通信\n\
  \n若要实现从子组件通信回父组件，你可以传递一个回调函数作为 prop。子组件可以在事件发生（例如按钮点击）时调用此函数。\n\n这里有一个示例：\n\n```javascript\n\
  class ParentComponent extends React.Component {\n  handleChildClick(name) {\n  \
  \  console.log(“Button clicked in child:”, name);\n  }\n  render() {\n    return\
  \ <ChildComponent onClick={this.handleChildClick} />;\n  }\n}\n\nfunction ChildComponent(props)\
  \ {\n  return <button onClick={() => props.onClick(“Child”)}>Click me</button>;\n\
  }\n```\n\n## 状态上提与共享状态管理\n\n当多个组件需要共享并修改同一数据时，将状态提升到最近的共同祖先是一个良好的做法。这意味着将状态管理移动到更高层级的组件，然后该组件再可以通过\
  \ props 将数据传递给子组件。\n\n这里有一个示例：\n\n```javascript\nclass App extends React.Component\
  \ {\n  constructor(props) {\n    super(props);\n    this.state = { counter: 0 };\n\
  \    this.incrementCounter = this.incrementCounter.bind(this);\n  }\n  incrementCounter()\
  \ {\n    this.setState((prevState) => ({ counter: prevState.counter + 1 }));\n \
  \ }\n  render() {\n    return (\n      <>\n        <CounterDisplay counter={this.state.counter}\
  \ />\n        <CounterButton onClick={this.incrementCounter} />\n      </>\n   \
  \ );\n  }\n}\n\nfunction CounterDisplay(props) {\n  return <h1>Counter: {props.counter}</h1>;\n\
  }\n\nfunction CounterButton(props) {\n  return <button onClick={props.onClick}>Increment\
  \ Counter</button>;\n}\n```\n\n\n\n\n总而言之，在 React 中处理事件和在组件之间传递数据是构建动态用户界面的基础。通过理解\
  \ React 事件处理基础、合成事件和事件绑定，你可以有效地处理组件中的用户交互。此外，学习通过 `props` 传递数据以及使用回调函数进行父子组件通信，能够让你构建复杂且可维护的应用程序。最后，状态提升（lifting\
  \ state up）和管理共享状态可以帮助你高效地管理需要多个组件访问和修改的数据。\n\n# React state 和 props](#toc.xhtml_s46a)\n\
  \n让我们开始学习 React 的 state 和 props，包括组件之间的数据流：\n\n### 理解 React 组件中的 state\nReact 组件中的\
  \ state（状态）是存储和管理随时间变化的数据的方式。与 `props` 不同（`props` 是只读的并从父组件传递而来的），state 是组件内部本地且可变的。可以使用\
  \ `useState` Hook 创建带有状态的函数组件。\n\n### 初始化和更新状态\n若要在函数组件中初始化状态，可以使用 `useState` Hook。它接受一个初始值作为参数，并返回一个包含两个元素的数组：当前状态值和一个更新状态的函数。你可以使用数组解构将返回的元素赋值给变量：\n\
  \n```javascript\nimport React, { useState } from ‘react’;\n\nfunction Counter()\
  \ {\n  const [count, setCount] = useState(0);\n  function increment() {\n    setCount(count\
  \ + 1);\n  }\n  return (\n    <div>\n      <p>Count: {count}</p>\n      <button\
  \ onClick={increment}>Increment</button>\n    </div>\n  );\n}\n```\n\n### 处理状态的不可变性和最佳实践\n\
  React 中的状态应该被被视为不可变的。这意味着，你不应该直接修改当前状态，而应该创建一个带有更新数据的新状态对象。这种做法有助于防止错误并优化性能，因为 React\
  \ 可以高效地比较新旧状态对象，以确定是否需要重新渲染。\n\n当根据当前状态更新状态时，请通过向状态更新器传递函数来使用函数更新：\n\n```javascript\n\
  function increment() {\n  setCount((prevCount) => prevCount + 1);\n}\n```\n\n###\
  \ Props 及其在组件通信中的作用\n如前所述，`props` 是 React 中组件之间传递数据的主要方式。`props` 是只读的，允许父组件将值传递给子组件。子组件随后可以通过其\
  \ `props` 对象访问传递的数据：\n\n```javascript\nfunction Greeting({ name }) {\n  return <h1>Hello,\
  \ {name}!</h1>;\n}\n\nfunction App() {\n  return <Greeting name=”John” />;\n}\n\
  ```\n\n### 使用 PropTypes 验证 props\n`PropTypes` 是一个库，允许你为组件指定 `props` 的预期类型。它是捕获错误和文档化你的组件预期\
  \ prop 类型的有用工具。要使用 `PropTypes`，你需要导入该库并在你的组件上定义预期的 prop 类型：\n\n```javascript\nimport\
  \ React from ‘react’;\nimport PropTypes from ‘prop-types’;\n\nfunction Greeting({\
  \ name }) {\n  return <h1>Hello, {name}!</h1>;\n}\n\nGreeting.propTypes = {\n  name:\
  \ PropTypes.string.isRequired,\n};\n\nexport default Greeting;\n```\n\n### 使用 Context\
  \ API 管理状态和数据流\n在某些情况下，你可能需要在没有通过父子关系直接连接的组件之间共享状态。`Context API` 是 React 的内置功能，允许你跨越整个组件树共享状态，而无需手动通过多层级传递\
  \ `props`。\n\n要使用 `Context API`，你需要使用 `React.createContext()` 创建上下文，并将组件树封装在上下文提供者（context\
  \ provider）中。上下文提供者接受一个 `value` 属性，可以是任何你想跨越组件树共享的数据：\n\n```javascript\nimport React,\
  \ { useState, useContext } from ‘react’;\nconst ThemeContext = React.createContext();\n\
  \nfunction App() {\n  const [theme, setTheme] = useState('light’);\n  return (\n\
  \    <ThemeContext.Provider value={{ theme, setTheme }}>\n      <Toolbar />\n  \
  \  </ThemeContext.Provider>\n  );\n}\n\nfunction Toolbar() {\n  return <ThemeSwitch\
  \ />;\n}\n\nfunction ThemeSwitch() {\n  const { theme, setTheme } = useContext(ThemeContext);\n\
  \  function toggleTheme() {\n    setTheme((prevTheme) => (prevTheme === ‘light’\
  \ ? ‘dark’ : ‘light’));\n  }\n  return ( \n    <button onClick={toggleTheme}>\n\
  \      Switch to {theme === ‘light’ ? ‘dark’ : ‘light'} theme\n    </button> \n\
  \  );\n}\n```\n\n在这个示例中，`App` 组件初始化了主题状态并将其提供给 `ThemeContext`。嵌套在 `Toolbar` 组件内部的\
  \ `ThemeSwitch` 组件随后可以使用 `useContext` Hook 访问并更新主题状态，而无需通过 `props` 传递主题和更新函数。\n\n\
  总而言之，理解 React 函数组件中的 state 和 props 对于构建动态和交互式的应用程序至关重要。通过使用 `useState` Hook 初始化和更新状态，你可以有效地管理数据。遵循最佳实践有助于防止错误。\n\
  \n# 介绍 Hooks 及其用法](#toc.xhtml_s7a)\n\n什么是 Hooks 以及为什么要使用它们？Hooks 是 React 在 16.8\
  \ 版本引入的一组函数，允许你在函数组件中使用状态和其他 React 特性。Hooks 为在函数组件中管理状态和副作用提供了一种更直观的方式。\n\n### 使用\
  \ useState Hook\n`useState` Hook 允许你为函数组件添加状态。它接受一个初始状态作为参数，并返回一个包含两个元素的数组：当前状态和更新状态的函数。\n\
  \n```javascript\nimport React, { useState } from ‘react’;\n\nfunction Counter()\
  \ {\n  const [count, setCount] = useState(0);\n  function increment() {\n    setCount(count\
  \ + 1);\n  }\n  return (\n    <div>\n      <p>Count: {count}</p>\n      <button\
  \ onClick={increment}>Increment</button>\n    </div>\n  );\n}\n```\n\n### 使用 useEffect\
  \ 及其依赖项\n`useEffect` Hook 允许你在函数组件中执行副作用，例如获取数据或更新 DOM。它接受两个参数：一个包含副作用的函数和一个可选的依赖数组。默认情况下，副作用函数会在每次渲染后运行，但你可以通过提供依赖数组来控制它的运行时机。副作用仅当依赖项之一发生变化时运行：\n\
  \n```javascript\nimport React, { useState, useEffect } from ‘react’;\n\nfunction\
  \ UserProfile({ userId }) {\n  const [user, setUser] = useState(null);\n  useEffect(()\
  \ => {\n    async function fetchUser() {\n      const response = await fetch(`https://api.example.com/users/${userId}`);\n\
  \      const userData = await response.json();\n      setUser(userData);\n    }\n\
  \    fetchUser();\n  }, [userId]);\n\n  return (\n    <div>\n      {user ? (\n \
  \       <div>\n          <h1>{user.name}</h1>\n          <p>{user.email}</p>\n \
  \       </div>\n      ) : null}\n    </div>\n  );\n}\n```\n\n\n\n\n```\n) : (\n\n\
  <p>Loading…</p>\n\n)}\n\n</div>\n\n);\n\n}\n```\n\n### 实现可复用逻辑的自定义 Hooks\n\n自定义\
  \ Hooks 是一个强大的功能，允许你在组件之间创建可复用的逻辑。自定义 Hook 只是一个以 `use` 开头并包含其他 Hooks 的函数：\n\n```javascript\n\
  import { useState, useEffect } from ‘react’;\n\nfunction useFetch(url) {\n  const\
  \ [data, setData] = useState(null);\n  const [loading, setLoading] = useState(true);\n\
  \  useEffect(() => {\n    async function fetchData() {\n      const response = await\
  \ fetch(url);\n      const jsonData = await response.json();\n      setData(jsonData);\n\
  \      setLoading(false);\n    }\n    fetchData();\n  }, [url]);\n  return { data,\
  \ loading };\n}\n\nfunction App() {\n  const { data, loading } = useFetch('https://api.example.com/data’);\n\
  \  return (\n    <div>\n      {loading ? <p>Loading…</p> : <p>Data: {JSON.stringify(data)}</p>}\n\
  \    </div>\n  );\n}\n```\n\n### 使用 useContext 和 useReducer 进行高级状态管理\n\n`useContext`\
  \ 和 `useReducer` Hooks 可以结合使用，以创建类似于 Redux 的高级状态管理模式。`useContext` Hook 允许你访问组件树中向上最近的上下文值，而\
  \ `useReducer` Hook 则使用 reducer 函数来管理复杂的状态转换：\n\n```javascript\nimport React, {\
  \ createContext, useReducer, useContext } from ‘react’;\n\nconst initialState =\
  \ { count: 0 };\n\nfunction reducer(state, action) {\n  switch (action.type) {\n\
  \    case ‘increment’:\n      return { count: state.count + 1 };\n    case ‘decrement’:\n\
  \      return { count: state.count - 1 };\n    default:\n      throw new Error(`Unknown\
  \ action type: ${action.type}`);\n  }\n}\n\nconst CounterContext = createContext();\n\
  \nfunction CounterProvider({ children }) {\n  const [state, dispatch] = useReducer(reducer,\
  \ initialState);\n  return (\n    <CounterContext.Provider value={{ state, dispatch\
  \ }}>\n      {children}\n    </CounterContext.Provider>\n  );\n}\n\nfunction Counter()\
  \ {\n  const { state, dispatch } = useContext(CounterContext);\n  return (\n   \
  \ <div>\n      <p>Count: {state.count}</p>\n      <button onClick={() => dispatch({\
  \ type: ‘increment’ })})}>\n        Increment\n      </button>\n      <button onClick={()\
  \ => dispatch({ type: ‘decrement’ })})}>\n        Decrement\n      </button>\n \
  \   </div>\n  );\n}\n\nfunction App() {\n  return (\n    <CounterProvider>\n   \
  \   <Counter />\n    </CounterProvider>\n  );\n}\n```\n\n## 其他内置 Hooks 及其用例\n\n\
  React 提供了其他几个内置 Hooks，每个 Hook 都有特定的用例：\n\n*   `useMemo`: 通过对值进行记忆化来优化性能，该值仅在依赖项发生变化时才会重新计算。此\
  \ Hook 在处理计算密集型函数或对象时非常有用。\n*   `useCallback`: 与 `useMemo` 类似，但用于函数进行记忆化。它返回回调函数的记忆化版本，只有当依赖项之一发生变化时，该函数才会改变。\n\
  *   `useRef`: 创建可变的 ref 对象，可用于跨渲染存储值，而不会触发重新渲染。常见用例包括引用 DOM 元素和存储之前的状态。\n*   `useLayoutEffect`:\
  \ 与 `useEffect` 类似，但它会在所有 DOM 变更后同步运行，确保副作用及其清理函数都在同一帧内执行。当需要在浏览器绘制绘制之前读取布局或测量 DOM\
  \ 时，请使用此 Hook。\n\n总结来说，React Hooks 为函数组件中提供了一种强大且直接的方式来管理状态、副作用和其他 React 特性。内置 Hooks（如\
  \ `useState`、`useEffect`、`useContext` 和 `useReducer`）涵盖了广泛的用例，而自定义 Hooks 则允许在组件间创建可复用的逻辑。通过\
  \ `useContext` 和 `useReducer` 可以实现高级状态管理模式，其他内置 Hooks 如 `useMemo`、`useCallback`、`useRef`\
  \ 和 `useLayoutEffect` 为各种场景提供了额外的功能。\n\n## JavaScript 中的异步编程及其在 React 中的应用\n\n异步编程是一种编程范式，允许多个任务并发运行，而不阻塞主执行线程。JavaScript\
  \ 是单线程的，这意味着它一次只能执行一个操作。异步编程使 JavaScript 执行耗时任务（如从 API 获取数据或读取文件）而不会冻结界面。\n\n###\
  \ 回调函数及其局限性\n\n回调函数是作为参数传递给其他函数，并在稍后执行。回调是 JavaScript 处理异步代码最基本的形式。然而，在处理多个嵌套操作时，回调会导致**回调地狱**（callback\
  \ hell）。\n\n### Promises 和链\n\nPromises 是处理异步代码的一种更高级的方式。Promise 代表未来可能可用的值。Promise\
  \ 有三种状态：等待（pending）、已完成（fulfilled）或拒绝（rejected）。你可以使用 `then` 附加在 Promise 完成时调用的回调函数，或使用\
  \ `catch` 处理错误。\n\n### Async/await 语法让代码更简洁\n\nAsync/await 是一种现代语法，使得处理异步代码变得更加简单。`async`\
  \ 函数返回一个 Promise，而 `await` 关键字用于暂停函数的执行，直到 Promise 解析完成。\n\n### 将异步代码集成到 React 中\n\
  \n要在 React 组件中集成异步代码，你可以使用 `useEffect` Hook 来获取数据或执行其他副作用。\n\n### React React 代码中的错误处理和最佳实践\n\
  \n在 React 中处理异步代码时，妥善处理错误至关重要。你可以在异步函数中使用 `try/catch` 块来捕获错误并向用户显示适当的错误信息。\n\n\n\
  \n\n\n```javascript\nconst response = await fetch('https://api.example.com/data');\n\
  const jsonData = await response.json();\nsetData(jsonData);\n} catch (err) {\nsetError(err.message);\n\
  }\n}\n```\n\n异步编程对于在 JavaScript 和 React 中创建响应迅速且高效的应用程序至关重要。从回调（callbacks）到 `Promises`\
  \ 再到 `async/await` 语法，JavaScript 提供了多种管理异步代码的方式。在 React 中，`useEffect` Hook 允许在函数组件中无缝集成异步操作。适当的错误处理（例如使用\
  \ `try/catch` 块）可以确保在处理真实场景时提供更好的用户体验。通过理解和应用这些概念，你可以创建更健壮、性能更好的 React 应用，能够优雅地处理异步操作。\n\
  \n## 结论\n\nReact 为构建现代 Web 应用提供了一个强大且灵活的框架。在这七部分中，我们探索了 React 的核心概念，从基于组件的架构、`JSX`\
