  \        </ListItemIcon>\n        <ListItemText primary={item.name} />\n      </ListItemButton>\n\
  \      <ListItemIcon onClick={handleDelete}>\n        <DeleteIcon className={styles.delete}\
  \ />\n      </ListItemIcon>\n    </ListItem>\n  );\n};\nexport default ToDoItem;\n\
  \n\n## 部署应用程序\n\n太棒了！我们终于为应用程序添加了所有必要的功能。然而，我们的应用程序仅运行在本地电脑上，如果能通过托管在网站上将 Web 应用分享给其他人，那就太棒了。这正是我们在这一节中要做的！\n\
  \n首先，我们将代码库上传到远程 GitHub 账户：\n\n```bash\ngit remote add origin [your github repo’s\
  \ address]\ngit branch -M main\ngit push -u origin main\n```\n\n之后，访问 vercel.com\
  \ 并使用你的 GitHub 账户登录。从列表中导入 todo-app 仓库并点击“Deploy”。大完成！你成功地将你的 Next.js 应用部署到了网站上！\n\
  \n\n\n\n## 结论\n\n在本章中，我们使用 `Next.js 13` 和 `Supabase` 构建了一个全面的 CRUD（创建、读取、更新、删除）应用程序。我们设计的应用程序允许用户通过创建新任务、标记为已完成以及删除任务来管理待办列表。在整个过程中，我们演示了如何高效地利用\
  \ `Next.js` 的强大功能，例如其基于 React 的组件渲染框架。我们还说明了 `Supabase` 如何通过其强大且易于使用的客户端库，简化了后端数据操作的处理。`Next.js`\
  \ 和 `Supabase` 的结合使我们能够快速高效地构建具有可扩展性的无服务器应用程序，并增强用户体验。该项目展示了这些技术的潜力一角，鼓励进一步探索和精通这些技术，以满足多样化的\
  \ Web 开发需求。\n\n在下一章中，我们将讨论通过使用云提供商和托管服务来部署 `Next.js` 应用的不同方法。\n\n# 第 13 章：探索 Next.js\
