  \ React 的潜力，开发出高效、可维护且可扩展的 Web 应用。\n\n在接下来的章节 *Next.js 基础* 中，你将接触 Next.js 框架及其主要优势。我们将引导你完成安装和设置过程，创建一个新的\
  \ Next.js 项目并理解其文件夹结构。你将学习页面（pages）在 Next.js 中的核心作用，以及如何创建和渲染基础页面。最后，我们将探索使用 CSS\
