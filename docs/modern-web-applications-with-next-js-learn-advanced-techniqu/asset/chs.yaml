  \ 1.3:** 浏览器警框\n\n### 自动代码分割和优化\n\n* 社交网络网站\n\n使用 Next.js 的主要优势之一是对 SSR 的内置支持。SSR\
  \ 允许您的应用程序在发送到客户端之前在服务器上进行渲染，这可以提高初始加载时间并提供更好的 SEO。使用 Next.js，您无需设置单独的服务器，也无需担心管理服务端渲染过程，因为这一切都由框架自动处理。\n\
  Next.js 还提供了对 SSG 的内置支持，这对于构建静态网站、博客和其他内容驱动的应用程序非常有用。SSG 允许您在构建时生成 HTML 页面，这些页面可以直接提供给客户端，而不是在服务器上动态生成。这可以提高应用程序的性能并减轻服务器负载。\n\
