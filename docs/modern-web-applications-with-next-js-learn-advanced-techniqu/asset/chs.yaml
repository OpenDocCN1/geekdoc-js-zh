  5. B\n\n## 第 6 章\n\n## 理解 Next.js 中的路由\n\n## 引言\n\n路由就像 Web 应用程序的骨干，确保了无缝导航和愉悦的用户体验。在\
  \ Next.js 的世界里，由于有了内置的路由器，路由变得轻而易举，它在页面切换和处理动态路由时承担了所有繁重工作。所以，请系好安全带，开启进入 Next.js\
  \ 路由领域的奇妙之旅。\n\n## 结构\n\n本章涵盖的主题如下：\n\n* 理解 Next.js 路由器的作用\n* 理解 Next.js `Link`\
  \ 组件及其用法\n* 使用路由在 Next.js 页面间导航\n* 在 Next.js 中处理动态路由\n\n总而言之，本章旨在全面理解 Next.js 中路由是如何工作的。它涵盖了\
  \ Next.js 路由器的基础、页面间的导航、动态路由的处理以及利用 `Link` 组件进行高效的客户端导航。\n\n### 理解 Next.js 路由器的作用\n\
  \n本节概述了 Next.js 路由器及其在处理客户端导航中的重要性。Next.js 路由器负责管理应用程序的路由，并根据请求的 URL 渲染相应的组件。\n\n\
  Next.js 路由器在管理 Next.js 应用内的路由中起着至关重要的作用。它负责根据请求的 URL 处理不同页面之间的导航。它基于 `Router` 构建，并增加了\
  \ Next.js 特有的功能。\n\n为了更好地理解 Next.js 路由器的作用，让我们来看示例。假设我们有一个三个页面的应用：**Home**（首页）、**About**（关于）和**Contact**（联系我们）。这些页面的\
  \ URL 如下：\n\n* Home：/home\n* About：/about\n* Contact：/contact\n\n当用户在浏览器中输入 `/about`\
  \ 时，Next.js 路由器会将 URL 与定义的路由匹配并渲染相应的组件，无需刷新整个页面。\n\nNext.js 路由器还支持嵌套路由，允许我们创建更复杂的页面结构。例如，我们可以为博客文章创建一个嵌套路由：\n\
  \n* Blog Post：/blog/[slug]\n\n在这种情况下，`[slug]` 代表任意值的动态参数。Next.js 路由器可以从 URL 中提取\
  \ `slug` 的值并将其作为 prop 传递给相应的组件。\n\n总的来说，Next.js 路由器简化了根据当前 URL 管理路由和渲染组件的过程。它为 Next.js\
  \ 应用提供了无缝的导航体验。\n\n使用示例\n\n在 Next.js 中定义路由，我们在 `pages` 目录下创建单独的文件。例如，我们可以创建一个名为\
  \ `pages/about.js` 的文件来定义 About 路由。在 `about.js` 文件中，我们导出一个代表 About 页面的 React 组件：\n\
  \n```javascript\n// pages/about.js\nimport React from 'react';\n\nconst About =\
  \ () => {\n  return (\n    <div>\n      <h1>About Page</h1>\n      <p>This is the\
  \ About page content.</p>\n    </div>\n  );\n};\n\nexport default About;\n```\n\n\
  同样，我们可以与其他页面（如 Home 和 Contact）创建文件，每个文件导出相应的 React 组件。\n\n有了 Next.js 路由器，我们可以使用\
  \ `Link` 组件在这些页面之间导航。例如，从首页导航到 **About** 页面，可以使用以下代码：\n\n```javascript\n// pages/index.js\
  \ (Home page)\nimport React from 'react';\n```\n\n\n\n\n\n```javascript\nimport\
  \ Link from \"next/link\";\n\nconst Home = () => {\n  return (\n    <div>\n    \
  \  <h1>Home Page</h1>\n      <p>Welcome to the Home page.</p>\n      <Link href=\"\
  /about\">\n        <a>Go to About page</a>\n      </Link>\n    </div>\n  );\n};\n\
  \nexport default Home;\n```\n\n在段代码段中，使用了 `<Link>` 组件来创建指向 About（关于）页面（`/about`）的链接。当用户点击“Go\
  \ to About page”（转到 About 页面）链接时，Next.js 的 `router` 会处理导航并渲染 About 组件，而无需刷新整个页面。\n\
  \nNext.js 的 `router` 使得定义路由和在页面之间导航变得简单，从而在 `Next.js` 应用程序内部提供了无缝的用户体验。\n\n在最新的\
  \ Next.js 13+ 版本中，路由结构经过了细微调整。以下是更新后的文件夹结构及简要描述：\n\n- `app`\n- `about`\n- `page.js`\
  \ # 现在映射到 `/about`\n- `products`\n- `[productId]`\n- `page.js` # 现在映射到 `/products/:productId`\n\
  \n这种结构展示了 `app` 目录下的层次结构。值得注意的是，“about”页面和 `products` 路由现在被放在各自的文件夹中。重要的是，这些文件夹内的文件（如\
  \ `page.js`）已经过优化，可以直接对应特定的 URL 路由。这种改进增强了 `Next.js` 路由系统的整体组织性和用户友好性，促进了更高效、直观的\
  \ Web 应用开发方法。\n\n## 理解 Next.js Link 组件及其用法\n\nNext.js 的 `Link` 组件是用于 `Next.js` 应用程序中创建客户端导航链接的强大工具。它提供了一种优化的导航处理方式，确保快速的页面切换并保留应用程序状态。本节将解释\
  \ `Link` 组件的用法及其各种属性和选项。\n\nNext.js `Link` 组件是一个内置功能，允许在 Next.js 应用程序的页面之间进行客户端导航。它提供了一种简单且优化的链接创建方式，确保快速页面切换并保留应用程序状态。以下是\
  \ `Link` 组件属性的说明，以及一个演示用法的代码示例：\n\n- **`href (string or object):`**\n  `href` 属性指定了链接的目标\
  \ URL。它可以是一个表示静态路由的字符串，也可以是一个包含动态路由参数的对象。\n\n  ```javascript\n  import Link from\
  \ 'next/link';\n  // 静态路由\n  <Link href=\"/about\">\n    <a>About</a>\n  </Link>\n\
  \n  // 带有参数的动态路由\n  <Link href=\"/users/[id]\" as=\"/users/1\">\n    <a>User Profile</a>\n\
  \  </Link>\n  ```\n\n- **`as (string, optional):`**\n  “as” 属性与动态路由结合使用，用于指定在浏览器地址栏中显示的实际\
  \ URL。它仅在使用动态路由时才需要。\n\n- **`replace (boolean, optional):`**\n  `replace` 属性决定导航应该是替换浏览器历史记录中的当前页面还是添加新条目。默认情况下，设置为\
  \ `false`，意味着将添加新条目。\n\n  ```javascript\n  <Link href=\"/contact\" replace>\n  \
  \  <a>Contact</a>\n  </Link>\n  ```\n\n- **`scroll (boolean or string, optional):`**\n\
  \  `scroll` 属性控制点击链接时的滚动行为。可以设置为 `true` 以滚动到页面顶部，设置为 `false` 以保留当前滚动位置，或设置为字符串值，以滚动到目标页面上的特定元素\
  \ ID。\n\n  ```javascript\n  <Link href=\"/blog\" scroll={true}>\n    <a>Blog</a>\n\
  \  </Link>\n  ```\n\n- **`shallow (boolean, optional):`**\n  `shallow` 属性启用浅层路由（shallow\
  \ routing），这意味着如果查询参数发生变化，页面组件将不会重新渲染。当您想要更新 URL 而不获取新数据或重新运行页面初始 props 时非常有用。\n\
  \n  ```javascript\n  <Link href=\"/products\" shallow>\n    <a>Products</a>\n  </Link>\n\
  \  ```\n\n- **`prefetch (boolean, optional):`**\n  `prefetch` 属性允许在后台自动预取链接页的数据。这可以通过缩短访问链接页时的加载时间来提高用户体验。\n\
  \n  ```javascript\n  <Link href=\"/dashboard\" prefetch>\n    <a>Dashboard</a>\n\
  \  </Link>\n  ```\n\n`Link` 组件封装在 `<a>` 标签周围，为客户端导航提供了必要的功能。它处理点击事件并阻止浏览器的默认导航行为。\n\
  \n通过使用 `Link` 组件，Next.js 优化了导航过程并利用其内置功能来增强用户体验。它实现了页面之间的平滑过渡，提高了性能，并允许开发者利用动态路由和预取等高级功能。\n\
  \n- **`passHref (boolean, optional):`**\n  当 `passHref` 属性设置为 `true` 时，它会将 `href`\
  \ 属性传递给底层的 `<a>` 标签。当您需要对锚点标签应用额外属性或自定义样式时这非常有用。\n\n  ```javascript\n  <Link href=\"\
  /profile\" passHref>\n    <a className=\"custom-link\">Profile</a>\n  </Link>\n\
  \  ```\n\n- **`active (boolean, optional):`**\n  `active` 属性允许在链接匹配当前路由时对其应用特定的样式或类。这对于导航菜单中的高亮激活链接很有帮助。\n\
  \n  ```javascript\n  <Link href=\"/about\" active>\n    <a>About</a>\n  </Link>\n\
  \  ```\n\n- **`onClick (function, optional):`**\n  `onClick` 属性允许定义在点击链接时执行的自定义函数。这在导航发生前执行额外操作非常有用。\n\
  \n  ```javascript\n  const handleClick = () => {\n    console.log('Link clicked');\n\
  \  };\n\n  <Link href=\"/contact\" onClick={handleClick}>\n    <a>Contact</a>\n\
  \  </Link>\n  ```\n\n- **外部链接：**\n  除了内部导航，`Link` 组件还可以用于创建外部 URL 的链接。只需在 `href`\
  \ 属性中提供完整 URL，Next.js 就会处理重定向。\n\n  ```javascript\n  <Link href=\"https://www.example.com\"\
  >\n    <a>External Link</a>\n  </Link>\n  ```\n\nLink 组件简化了 Next.js 应用程序中创建导航链接的过程。它确保了高效的客户端导航，处理动态路由并提供了自定义和优化选项。通过利用\
  \ Link 组件，您可以在构建 Next.js Web 应用时创建无缝且直观的用户体验。\n\n# 使用 router 在 Next.js 中进行页面导航\n\
  \n此处介绍了如何使用 router 在 Next.js 应用程序的之间页面之间导航。Next.js 提供了一个简单且直观的 API 来处理导航，允许开发者编程地导航到不同的路由并在页面之间传递数据。在\
  \ Next.js 中进行页面导航是由 Next.js router 促进的，它允许无缝的客户端导航。`useRouter` hook 是一个内置的 Next.js\
  \ hook，提供了对路由对象的访问，使用户能够编程地进行跳转。以下是该过程的说明以及一个代码示例：\n\n- **导入 useRouter hook：**\n\
  \  在您的 Next.js 组件中，从 `next/router` 模块导入 `useRouter` hook。\n\n  ```javascript\n \
  \ import { useRouter } from 'next/router';\n  ```\n\n- **访问路由对象：**\n  在组件内部调用 `useRouter`\
  \ hook 以获取路由对象的访问。\n\n  ```javascript\n  const router = useRouter();\n  ```\n\n\
  - **执行导航：**\n  使用路由对象提供的方法在页面之间导航。最常用的方法是 `push`，它允许您导航到一个新页面。\n\n  ```javascript\n\
  \  const handleNavigation = () => {\n    router.push('/about');\n  };\n  ```\n\n\
  \n\n你也可以使用其他方法如 `replace`）来替换浏览器历史记录中的当前页面，或者返回到上一个页面。\n\n### 处理导航事件\n\nNext.js\
  \ 提供了多种事件，你可以在导航发生时对它们进行监听。例如，你可以监听 `routeChangeStart` 事件在路由切换之前执行操作，或者监听 `routeChangeComplete`\
  \ 事件在路由切换之后执行操作。\n\n```javascript\nuseEffect(() => {\n  const handleRouteChangeStart\
  \ = () => {\n    // 在路由切换前执行的操作\n  };\n  const handleRouteChangeComplete = () =>\
  \ {\n    // 在路由切换后执行的操作\n  };\n  router.events.on('routeChangeStart', handleRouteChangeStart);\n\
  \  router.events.on('routeChangeComplete', handleRouteChangeComplete);\n  return\
  \ () => {\n    router.events.off('routeChangeStart', handleRouteChangeStart);\n\
  \    router.events.off('routeChangeComplete', handleRouteChangeComplete);\n  };\n\
  }, []);\n```\n\n以下是关于 Next.js 中 `useRouter` 钩及其属性的更多细节：\n\n- **query (object):**\n\
  \  `router` 对象的 `query` 属性包含从 URL 解析出的查询字符串参数。它允许你访问并获取传递给当前页面的查询参数。\n  ```javascript\n\
  \  // URL: /products?id=123\n  console.log(router.query.id); // 输出: 123\n  ```\n\
  \n- **pathname (string):**\n  `pathname` 属性表示当前的 URL 路径，排除查询参数。它提供了应用程序中当前页面的路径。\n\
  \  ```javascript\n  console.log(router.pathname); // 输出: /products\n  ```\n\n- **route\
  \ (string):**\n  `route` 属性返回当前匹配的路由模式。它代表与当前页面相关的路由。\n  ```javascript\n  console.log(router.route);\
  \ // 输出: /products\n  ```\n\n- **basePath (string):**\n  `basePath` 属性返回应用程序的基础路径。它代表应用程序中所有页面共用的\
  \ URL 部分。\n  ```javascript\n  console.log(router.basePath); // 输出: /\n  ```\n\n\
  - **isFallback (boolean):**\n  `isFallback` 属性指示当前页面是否正在作为备备（fallback）静态生成。它在备用状态下渲染备用内容非常有用。\n\
  \  ```javascript\n  if (router.isFallback) {\n    return <div>Loading…</div>;\n\
  \  }\n  ```\n\n- **events (EventEmitter):**\n  `events` 属性提供了一个 `EventEmitter` 对象，用于触发与路由相关的事件。你可以使用它来监听各种事件，如路由切换开始、路由切换完成和路由错误。\n\
  \  ```javascript\n  router.events.on('routeChangeStart', () => {\n    console.log('Route\
  \ change started');\n  });\n  ```\n  记得使用 `router.events.on()` 订阅事件并使用 `router.events.off()`\
  \ 清理事件监听。\n\n- **push (method):**\n  `router` 对象的 `push` 方法允许你通过程序导航到新页面。你可以将目标\
  \ URL 作为字符串参数传递给 `push` 方法。\n  ```javascript\n  const handleNavigation = () => {\n\
  \    router.push('/about');\n  };\n  ```\n\n- **replace (method):**\n  `replace`\
  \ 方法与 `push` 类似，但它替换浏览器历史记录中的当前页面，而不是添加新条目。它在实现返回按钮或你不希望用户通过浏览器后退按钮访问当前页面时非常有用。\n\
  \  ```javascript\n  const handleNavigation = () => {\n    router.replace('/about');\n\
  \  };\n  ```\n\n- **back (method):**\n  `back` 方法允许你返回到浏览器历史记录中的上一个页面。它等同于浏览器的后退功能。\n\
  \  ```javascript\n  const handleNavigation = () => {\n    router.back();\n  };\n\
  \  ```\n\n- **prefetch (method):**\n  `prefetch` 方法允许你在后台预取并缓存特定页面的资源（HTML、JavaScript、CSS\
  \ 等）。预取可以在用户导航到页面之前预加载所需的资产，提高性能。\n  ```javascript\n  const prefetchPage = () =>\
  \ { router.prefetch('/about'); };\n  ```\n\n- **isReady (boolean):**\n  `isReady`\
  \ 属性指示路由对象是否已就绪以及所有初始值（如查询参数）是否已填充。它对于根据路由的就绪情况进行条件渲染非常有用。\n  ```javascript\n  if\
  \ (!router.isReady) {\n    return <div>Loading…</div>;\n  }\n  ```\n\nNext.js 中的\
  \ `useRouter` 钩及其属性提供了处理导航、访问查询参数、程序化操作 URL 以及预取资源的强大功能。通过利用这些能力，你可以创建具有高效客户端导航和优化页面加载的动态且具交互性的\
  \ Next.js 应用程序。\n\n# 在 Next.js 中使用动态路由\n\nNext.js 支持动态路由，即包含参数的路由。本节将探索如何在 Next.js\
  \ 中定义和处理参数。\n\n### 定义动态路由\n\n要在 Next.js 中定义动态路由，你需要创建一个文件名中包含方括号（`[]`）的文件。中括号内的部分代表动态参数。例如，如果你有一个根据\
  \ ID 显示产品的动态路由，你将在 `pages` 目录中创建一个名为 `[productId].js` 的文件。\n\n### 链接到动态路由\n\nNext.js\
  \ 中的 `Link` 组件允许你在页面之间进行跳转。要链接到动态路由，你需要将动态参数作为属性传递给 `href` 属性。\n\n```javascript\n\
  import Link from 'next/link';\n\nconst ProductList = () => {\n  return (\n    <div>\n\
  \      <Link href=\"/products/1\">\n        <a>Product 1</a>\n      </Link>\n  \
  \    <Link href=\"/products/2\">\n        <a>Product 2</a>\n      </Link>\n    \
  \  {/* ... */}\n    </div>\n  );\n};\n\nexport default ProductList;\n```\n\n###\
  \ 访问动态参数\n\n要在动态路由组件中访问动态参数，可以使用 Next.js 提供的 `useRouter` 钩子。\n\n```javascript\n\
  import { useRouter } from 'next/router';\n\nconst ProductDetail = () => {\n  const\
  \ router = useRouter();\n  const { productId } = router.query;\n  return (\n   \
  \ <div>\n      <h1>Product Detail: {productId}</h1>\n      {/* ... */}\n    </div>\n\
  \  );\n};\n\nexport default ProductDetail;\n```\n在前面的示例中，使用了 `useRouter` 钩子来获取 `router`\
  \ 对象。`router.query` 对象包含动态参数，可以通过对象解构（例如 `const { productId } = router.query`）来访问。然后你可以使用该动态参数（在此例中为\
  \ `productId`）来获取并显示相关的产品详情。\n\n\n\n\n\n在 Next.js 中处理动态路由允许你构建能够处理不同参数的页面，提供了一种灵活且可用的方式来根据动态值显示内容。`Link`\
  \ 组件简化了到动态路由的导航，而 `useRouter` 钩允许在组件内部访问动态参数。\n\n# 结论：揭示 Next.js 路由的优美\n\n*理解 Next.js\
  \ 中的路由* 章节是一份全面的指南，探索了核心路由概念和技术，为开发者在 Next.js 应用程序中导航和处理路由提供了坚实的基础。它涵盖了 Next.js\
  \ 路由器的基础知识、页面导航、动态路由处理、`Link` 组件、`useRouter` 钩以及基于文件的路由。通过理解路由器的作用，开发者可以深入了解页面导航是如何管理的，以及不同的路由是如何映射到相应组件的。`Link`\
  \ 组件的使用简化了用于页面切换的锚点标签的创建，在保留服务器渲染优势的同时，确保了优化的客户端导航。动态路由允许处理带有动态参数的路由，构建灵活且可复用的组件，根据提供的参数渲染不同的内容。`useRouter`\
  \ 钩提供了对路由对象的访问权限，为处理路由提供了各种属性和方法。基于文件的路由通过将文件结构映射到 URL 结构简化了路由的组织。本章为开发者提供了在页面之间进行导航、处理动态路由、利用\
  \ `Link` 组件进行优化客户端导航，以及利用 `useRouter` 钩增强路由控制和交互性的知识，从而在他们的 Next.js 应用程序中创建出动态、交互且无缝的路由体验。\n\
  \n请参考 GitHub 仓库 *Building-Scalable-Web-Applications-with-Next.js-and-React* 中的 *第\
  \ 5 章* 和 *第 6 章*。该仓库包含一个小型的 2 页应用程序，展示了书籍列表和书籍详情，结合了动态路由和优化技术。你可以将此仓库作为开发的宝贵参考。\n\
  \n## 单选题\n\n1. 什么是 Next.js 路由器？\n    1. 一个用于 Next.js 应用程序服务器端渲染的工具\n    2. 一个用于\
