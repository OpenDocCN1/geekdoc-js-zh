  \n## 使用 Supabase 设置数据库\n\n我们的应用程序现在从静态数组 `items` 渲染 UI，其内容为 `[\"Go to the gym\"\
  , \"Buy groceries\", \"Pickup mail\"]`。在实际应用中，此类数据会存储在数据库中。我们将通过 API 调用从服务器获取这些数据，然后在前端进行渲染。这正是我们现在要做的！\n\
  \n为此，访问 Supabase.com 并使用你的 GitHub 凭据登录。你会看到以下仪表板：\n\n![](img/image15.jpg)\n\n**图\
  \ 12.9：** Supabase 仪表板\n\n点击 `New project` 并填写 `Name` 和 `Type of organization`，如\
  \ 图 12.10 所示：\n\n![](img/image10.jpg)\n\n**图 12.10：** Supabase 仪表板\n\n然后，填写以下详情来创建一个新项目：\n\
  \n![](img/image11.jpg)\n\n**图 12.11：** 创建新项目界面\n\n进入 `Table Editor` 标签页，将表命名为 `items`，创建以下四列，并点击\
  \ `Save`：\n\n![](img/image1_2.jpg)\n\n**图 12.12：** 数据库架构\n\n现在，使用 `Insert` 按钮添加与我们在\
  \ Next.js 中使用的相同的待办事项。你可以暂时使用 [`www.uuidgenerator.net/version1`](https://www.uuidgenerator.net/version1)\
  \ 来创建 UUID 并将其添加到表格的行中。添加这些项目后，我们的表格将看起来像这样：\n\n![](img/image14.jpg)\n\n**图 12.13：**\
  \ 数据库条目\n\n我们正在取得进展！下部分是通过 Next.js 应用通过 API 调用获取这些数据并在我们的 UI 中渲染它们。幸运的是，Supabase\
  \ 提供了一种简单的方法来实现，如 图 12.14 所示：\n\n![](img/image12.jpg)\n\n**图 12.14：** Supabase 仪表板\n\
  \n打开我们的 Next.js 应用并安装 `@supabase/supabase-js` 包。\n\n在根目录上创建一个新的 `utils` 文件夹，并创建一个文件\
  \ `SupabaseClient.js`，用 Supabase 服务器初始化应用程序：\n\n```javascript\nimport { createClient\
  \ } from \"@supabase/supabase-js\";\nconst supabase = createClient(\n  supabaseUrl,\n\
  \  supabaseKey\n);\nexport default supabase;\n```\n\n将 `supabaseUrl` 和 `supabaseKey`\
  \ 替换为你 Supabase 账户中的 API 密钥。\n\n更新 `crud/page.js` 为：\n\n```javascript\n\"use client\"\
  ;\nimport styles from \"./page.module.css\";\nimport TodoItem from \"@/components/ToDoItem\"\
  ;\nimport List from \"@mui/material/List\";\nimport supabase from \"@/utils/SupabaseClient\"\
  ;\n```\n\n\n\n\n```javascript\nimport TodoItem from \"@/components/ToDoItem\";\n\
  import List from \"@mui/material/List\";\nimport supabase from \"@/utils/SupabaseClient\"\
  ;\n\nexport default function Crud() {\n  const [newItem, setNewItem] = useState(null);\n\
  \  const [items, setItems] = useState([]);\n  const fetchData = async () => {\n\
  \    const { data, error } = await supabase.from(\"items\").select(\"*\");\n   \
  \ setItems(data);\n  };\n  useEffect(() => {\n    fetchData();\n  }, []);\n  const\
  \ addItem = async () => {\n    const { data, error } = await supabase\n      .from(\"\
  items\")\n      .insert([{ is_completed: false, name: newItem, id: uuidv4() }])\n\
  \      .single();\n    if (!error) {\n      fetchData();\n    }\n  };\n  return\
  \ (\n    <div className={styles.main}>\n      <h2>To-Do items</h2>\n      <div className={styles.container}>\n\
  \        <input\n          className={styles.input}\n          onChange={(e) =>\
  \ setNewItem(e.target.value)}\n        />\n        <button className={styles.button}\
  \ onClick={addItem}>\n          Add to list!\n        </button>\n      </div>\n\
  \      <List>\n        {items.map((item, index) => (\n          <TodoItem item={item}\
  \ key={index} />\n        ))}\n      </List>\n    </div>\n  );\n}\n```\n\n注意，我们安装了一个名为\
  \ `uuidv4` 的库来生成 `UUID`。当你向输入框中输入“Play football”并点击“Add to list!”按钮时，它将向数据库发送 API\
  \ 调用以添加此新项目并刷新页面，这样我们就能在 UI 中看到新项目了！\n\n![](img/image3_2.jpg)\n\n**图 12.17:** 新待办事项\n\
  \n## 编辑待办事项（更新）\n\n在这一部分，我们将根据 UI 中任务是否被勾选来实现判断任务是否已完成。如果用户勾选或取消勾选一个待办事项，我们将更新 Supabase\
  \ 表中的对应内容。为了实现这一点，我们将按照如下方式重构两个文件：\n\n### crud/page.js\n\n```javascript\n\"use client\"\
  ;\nimport React, { useState, useEffect } from \"react\";\nimport { v4 as uuidv4\
  \ } from \"uuid\";\nimport styles from \"./page.module.css\";\nimport TodoItem from\
  \ \"@/components/ToDoItem\";\nimport List from \"@mui/material/List\";\nimport supabase\
  \ from \"@/utils/SupabaseClient\";\n\nexport default function Crud() {\n  const\
  \ [newItem, setNewItem] = useState(null);\n  const [items, setItems] = useState([]);\n\
  \  const fetchData = async () => {\n    const { data, error } = await supabase.from(\"\
  items\").select(\"*\");\n    setItems(data);\n  };\n  useEffect(() => {\n    fetchData();\n\
  \  }, []);\n  const handleToggle = async (item) => {\n    const { data, error }\
  \ = await supabase\n      .from(\"items\")\n      .update({ is_completed: !item.is_completed\
  \ })\n      .eq(\"id\", item.id);\n    if (!error) {\n      fetchData();\n    }\n\
  \  };\n  const addItem = async () => {\n    const { data, error } = await supabase\n\
  \      .from(\"items\")\n      .insert([{ is_completed: false, name: newItem, id:\
  \ uuidv4() }])\n      .single();\n    if (!error) {\n      fetchData();\n    }\n\
  \  };\n  return (\n    <div className={styles.main}>\n      <h2>To-Do items</h2>\n\
  \      <div className={styles.container}>\n        <input\n          className={styles.input}\n\
  \          onChange={(e) => setNewItem(e.target.value)}\n        />\n        <button\
  \ className={styles.button} onClick={addItem}>\n          Add to list!\n       \
  \ </button>\n      </div>\n      <List>\n        {items.map((item) => (\n      \
  \    <TodoItem item={item} key={item.id} onToggle={handleToggle} />\n        ))}\n\
  \      </List>\n    </div>\n  );\n}\n```\n\n### components/ToDoItem.jsx\n\n```javascript\n\
  \"use client\";\nimport React from \"react\";\nimport styles from \"./TodoItem.module.css\"\
  ;\nimport ListItem from \"@mui/material/ListItem\";\nimport ListItemButton from\
  \ \"@mui/material/ListItemButton\";\nimport ListItemIcon from \"@mui/material/ListItemIcon\"\
  ;\nimport Checkbox from \"@mui/material/Checkbox\";\nimport ListItemText from \"\
  @mui/material/ListItemText\";\nimport DeleteIcon from \"@mui/icons-material/Delete\"\
  ;\n\nconst ToDoItem = ({ item, onToggle }) => {\n  const handleToggle = () => {\n\
  \    onToggle(item);\n  };\n  return (\n    <ListItem className={styles.item}>\n\
  \      <ListItemButton onClick={handleToggle}>\n        <ListItemIcon>\n       \
  \   <Checkbox\n            checked={item.is_completed}\n            tabIndex={1}\n\
  \            className={styles.checkbox}\n          />\n        </ListItemIcon>\n\
  \        <ListItemText primary={item.name} />\n      </ListItemButton>\n      <ListItemIcon\
  \ onClick={handleDelete}>\n        <DeleteIcon className={styles.delete} />\n  \
  \    </ListItemIcon>\n    </ListItem>\n  );\n};\nexport default ToDoItem;\n```\n\
  \n## 删除待办事项（删除）\n\n我们最终实现了点击删除按钮时删除待办事项的功能。\n\n### crud/page.js\n\n```javascript\n\
  \"use client\";\nimport React, { useState, useEffect } from \"react\";\nimport {\
  \ v4 as uuidv4 } from \"uuid\";\nimport styles from \"./page.module.css\";\nimport\
  \ TodoItem from \"@/components/ToDoItem\";\nimport List from \"@mui/material/List\"\
  ;\nimport supabase from \"@/utils/SupabaseClient\";\n\nexport default function Crud()\
  \ {\n  const [newItem, setNewItem] = useState(null);\n  const [items, setItems]\
  \ = useState([]);\n  const fetchData = async () => {\n    const { data, error }\
  \ = await supabase.from(\"items\").select(\"*\");\n    setItems(data);\n  };\n \
  \ useEffect(() => {\n    fetchData();\n  }, []);\n  const handleToggle = async (item)\
  \ => {\n    const { data, error } = await supabase\n      .from(\"items\")\n   \
  \   .update({ is_completed: !item.is_completed })\n      .eq(\"id\", item.id);\n\
  \    if (!error) {\n      fetchData();\n    }\n  };\n  const addItem = async ()\
  \ => {\n    const { data, error } = await supabase\n      .from(\"items\")\n   \
  \   .insert([{ is_completed: false, name: newItem, id: uuidv4() }])\n      .single();\n\
  \    if (!error) {\n      fetchData();\n    }\n  };\n  return (\n    <div className={styles.main}>\n\
  \      <h2>To-Do items</h2>\n      <div className={styles.container}>\n        <input\n\
  \          className={styles.input}\n          onChange={(e) => setNewItem(e.target.value)}\n\
  \        />\n        <button className={styles.button} onClick={addItem}>\n    \
  \      Add to list!\n        </button>\n      </div>\n      <List>\n        {items.map((item)\
  \ => (\n          <TodoItem item={item} key={item.id} onToggle={handleToggle} />\n\
  \        ))}\n      </List>\n    </div>\n  );\n}\n```\n\n### components/ToDoItem.jsx\n\
  \n```javascript\n\"use client\";\nimport React from \"react\";\nimport styles from\
  \ \"./TodoItem.module.css\";\nimport ListItem from \"@mui/material/ListItem\";\n\
  import ListItemButton from \"@mui/material/ListItemButton\";\nimport ListItemIcon\
