  9. A\n10. D\n\n# 第 3 章\n\n# Next.js 基础\n\n## 介绍\n\n在本章中，我们将深入探讨 Next.js 框架的基础。我们首先介绍\
  \ Next.js，这是一个强大的基于 React 的框架，提供了如服务端渲染 (SSR)、静态站点生成 (SSG) 和增量静态再生成 (ISR) 等独特特性。我们将探索使用\
  \ Next.js 的优势，并将其与其他流行的框架进行比较，同时阐明其在真实项目中的实际应用。\n\n接下来，我们将引导你完成开发环境的设置、安装 Next.js\
  \ 以及创建你的第一个 Next.js 项目。我们将帮助你理解 Next.js 项目的核心结构，并解释每个文件夹和文件是如何对其贡献的。\n\n随着学习的深入，我们将解释页面在\
  \ Next.js 中的关键作用，以及如何创建和渲染一个基础页面。最后，我们将探索使用 CSS 模块实现 CSS 样式。在本章结束时，你将拥有构建健壮且可扩展的\
  \ Next.js 应用所需的的基础知识。\n\n## 结构\n\n在本章将涵盖以下主题：\n\n*   介绍 Next.js 框架及其优势\n*   安装、设置和创建新的\
  \ Next.js 项目\n*   理解 Next.js 项目的文件夹结构\n*   页面在 Next.js 中的作用\n*   在 Next.js 中创建和渲染基础页面\n\
  *   使用 CSS 模块在 Next.js 中实现 CSS 样式\n\n## 介绍 Next.js 框架及其优势\n\nNext.js 是一个强大的开源基于\
  \ React 的框架，用于构建服务端渲染和静态生成的应用程序。它由 Vercel 开发和维护，使用 JavaScript 构建，并利用了 React、Node.js\
  \ 和 JavaScript 生态系统。该框架旨在通过自动代码分割、预取和热代码更新等功能提供优化的用户体验。\n\n这是一个基础 Next.js 组件的示例：\n\
  \n```javascript\n// 一个基础的 Next.js 组件\nfunction HomePage() {\n  return <div>Welcome\
  \ to Next.js!</div>\n}\n\nexport default HomePage;\n```\n\n\n\n\n\n*   **API 路由**:\
  \ Next.js 允许你与页面一同构建 API 路由，简化了后端开发。\n\n  例如：\n\n```javascript\n// An example of\
  \ API route in Next.js\nexport default function handler(req, res) {\n  res.status(200).json({\
  \ text: ‘Hello from Next.js API route’ })\n}\n```\n\n*   **热模块重载**: Next.js 开箱提供热模块重载，在开发过程中提供即时反馈。\n\
  \n*   **内置 CSS 和 Sass 支持**: Next.js 内置了对 CSS 和 Sass 支持，同时也支持像 styled components\
  \ 或 emotion 等 CSS-in-JS 解决方案。\n\n*   **TypeScript 支持**: Next.js 开箱支持 TypeScript，允许在项目中使用强类型检查。\n\
  \n# 与与其他框架对比](#toc.xhtml_s57a)\n\nNext.js 在许多方面与 Create React App (CRA) 和 Gatsby\
  \ 等其他 JavaScript 框架脱颖而出。虽然 CRA 非常适合构建单页应用（SPA），但它缺乏 Next.js 的 SSR（服务端渲染）和 SSG（静态站点生成）功能，而这些功能对于\
  \ SEO 和性能至关重要。另一方面，Gatsby 强调 SSG，但并不原生支持 SSR 或 ISR（增量静态再生）。此外，Next.js 的自动路由和 API\
  \ 路由使其成为更全面的全栈开发解决方案。\n\n这里有一个示例：\n\n```javascript\n// A dynamic route in Next.js\n\
  // pages/posts/[id].js\nfunction Post({ post }) {\n  // Render post…\n}\nexport\
  \ async function getServerSideProps(context) {\n  const { id } = context.params\n\
  \  // Fetch data based on id…\n  return { props: { post } }\n}\nexport default Post;\n\
  ```\n\n# Next.js 的真实世界用例](#toc.xhtml_s58a\n\n由于其多功能性和强大的特性集，许多知名公司在技术栈中使用了 Next.js。Netflix、Twitch\
  \ 和 Uber 等公司已经利用 Next.js 的力量构建了快速、可扩展且有利于 SEO 的 Web 应用。这些真实世界的应用验证了 Next.js 框架的实用性和企业级就绪。\n\
  \n总之，Next.js 是一个全面的框架，它融合了性能、开发者体验和灵活性。无论你是在构建小型项目还是大型企业级应用，Next.js 都拥有让过程变得高效且有趣的工具和特性。\n\
  \nNext.js 广泛的特性减少了对其他框架中可能需要的额外配置或插件的需求。它的服务端渲染能力可以提高 SEO，而静态站点生成和增量静态再生为根据特定需求优化性能提供了多种选项。\n\
  \n以下是 Next.js 中静态站点生成的示例：\n\n```javascript\n// Static Site Generation in Next.js\n\
  // pages/posts/[id].js\nexport async function getStaticPaths() {\n  // Determine\
  \ the paths at build time…\n}\nexport async function getStaticProps({ params })\
  \ {\n  // Fetch data based on params…\n  return { props: { … } }\n}\nexport default\
  \ function Post({ … }) {\n  // Render the post…\n}\n```\n\n内置的路由系统简化了页面的创建，原生 API\
  \ 路由功能意味着你可以在同一个框架内处理后端功能，从而获得无缝的全栈开发体验。\n\n此外，Next.js 为 CSS、Sass、TypeScript 以及流行的\
  \ CSS-in-JS 解决方案提供了开箱支持，消除了手动设置这些功能的需求。这种内置功能结合自动的热代码重载，带来了极佳的开发者体验。\n\n将 Next.js\
  \ 与 CRA 和 Gatsby 等其他流行框架进行比较，很明显，Next.js 为构建现代 Web 应用提供了更全面的工具集。虽然 CRA 和 Gatsby\
  \ 各有优劣，但 Next.js 的多功能性使其成为许多用例的强有力竞争者。\n\nNetflix、Uber 和 Twitch 等知名公司对 Next.js 的采用进一步证明了它的能力和实用性。这些公司需要高性能、可扩展且可靠的\
  \ Web 应用，他们选择使用 Next.js 说明该框架能够满足这些需求。\n\n无论你只是刚开始 JavaScript 开发，还是寻求简化工作流的资深开发者，Next.js\
  \ 提供的系列优势使其成为你下一个项目的理想选择。\n\n# 安装并创建新的 Next.js 项目](#toc.xhtml_s59a\n\n在本节中，我们将介绍安装\
  \ Next.js 的前提条件，并分析 Next.js 的文件夹结构。\n\n# 安装 Next.js 的前提条件](#toc.xhtml_s60a\n\n在我们开始使用\
  \ Next.js 之前，我们需要确保机器上安装了必要的工具。Node.js 和 `npm`（节点包管理器）对于设置 Next.js 项目至关重要。Node.js\
  \ 是一个 JavaScript 运行时，允许我们在服务器上运行 JavaScript，而 `npm` 是 Node.js 的包管理器。于写作时，推荐使用 Node.js\
  \ 的最新 LTS 版本（v14.x.x 或更高）和 `npm`（v6.x.x 或更高）。\n\n你可以通过在终端中运行以下命令检查是否安装了 Node.js\
  \ 和 `npm` 并查看版本：\n\n```bash\nnode -v\nnpm -v\n```\n\n如果你没有安装 Node.js，可以从 Node.js\
  \ 官网 ([`nodejs.org`](https://nodejs.org)) 下载。\n\n# 安装](#toc.xhtml_s61a)\n\n一旦安装了\
  \ Node.js 和 `npm`，得益于 `create-app` 命令，设置一个新的 Next.js 项目将变得轻而易举，它会设置一个准备就绪的应用。在终端中，导航到你想放置项目的目录并运行以下命令：\n\
  \n```bash\nnpx create-next-app@latest my-app\n```\n\n# 创建你的第一个 Next.js 项目](#toc.xhtml_s62a)\n\
  \n`create-next-app` 命令会创建一个以项目命名的目录，设置必要的文件和文件夹并安装依赖。命令完成后，进入你的新项目：\n\n```bash\n\
  cd my-app\n```\n\n使用 `npm run dev` 命令启动开发服务器：\n\n```bash\nnpm run dev\n```\n\n打开浏览器并访问\
  \ `http://localhost:3000`。你应该看到你的 Next.js 应用已经在运行了！\n\n# 理解设置](#toc.xhtml_s63a)\n\
  \n`create-next-app` 设置了如下标准的 Next.js 文件结构：\n\n*   `pages`: 该目录包含你的应用程序页面。每个文件根据文件名对应一个路由。\n\
  *   `public`: 该目录存储静态文件（如图像），它们会在根（/）URL 路径提供。\n*   `styles`: 该目录包含全局 CSS 文件。默认包含了\
  \ `globals.css`，可用于全局样式。\n*   `package.json`: 该文件包含关于项目及其依赖的元数据。\n\n这里是 Next.js\
  \ 项目的目录结构：\n\n```\nmy-app\n├── pages\n│   ├── _app.js\n│   ├── api\n│   └── index.js\n\
  ├── public\n├── styles\n│   ├── globals.css\n│   └── Home.module.css\n└── package.json\n\
  ```\n\n“pages’ 目录包含 `index.js` 文件（对应 ‘/’路由）和 `_app.js`（用于初始化页面的自定义 App 组件）。你可以覆盖它来控制页面初始化或添加全局样式。\n\
  \n`pages` 下的 `api` 目录是特殊的——你可以在 Next.js 应用中直接创建后端函数。\n\n这种初始设置为你的 Next.js 项目奠定了坚实的基础，随着\
  \ Next.js 之旅的深入，你将进一步了解这些每一个组件。\n\n\n\n\n\n理解 Next.js 项目的文件和文件夹结构至关重要，因为这能让你更好地理解项目的组织，并使开发更加顺畅。\n\
  \n### 文件夹结构概述\n\n一个新创建的 Next.js 应用具有以下文件夹结构：\n\n```\nmy-next-app\n├── pages\n│ \
  \   ├── _app.js\n│    ├── api\n│    └── index.js\n├── public\n├── styles\n│    ├──\
  \ globals.css\n│    └── Home.module.css\n├── .gitignore\n├── package.json\n└── README.md\n\
  ```\n\n让我们逐一查看这些目录和文件，以便更好地它们的作用。\n\n### 探索 ‘pages’目录\n\n`pages` 目录是 Next.js 项目中最重要的目录之一。你在这里为应用程序添加所有的页面。该目录下的每个文件都根据其文件名对应一个路由。\n\
  \n例如，如果你在 `pages` 目录中创建一个 `about.js` 文件，它将可以通过 `http://localhost:3000/about` 访问。\n\
  \n```\n// pages/about.js\nexport default function About() {\n  return <h1>About\
  \ Us</h1>\n}\n```\n\n`pages` 目录还包含 `_app.js` 文件，这是一个自定义的 App 组件。该文件允许你覆盖用于初始化页面的默认\
  \ App 组件。你可以用它在页面之间保持状态、添加全局 CSS 或添加全局布局。\n\n`pages` 内部的 `api` 目录是你可以在其中创建 API 路由的地方。该目录下的每个文件都对应一个路由，该路由可以创建一个完整的\
  \ API。\n\n```\n// pages/api/hello.js\nexport default function handler(req, res)\
  \ {\n  res.status(200).json({ text: ‘Hello’ })\n}\n```\n\n### 探索 public 目录\n\n`public`\
  \ 目录用于存放静态资源，如图像、字体或 `robots.txt` 文件。这些文件将从根路径（`/`）URL 路径服务。例如，如果你在 `public` 目录中添加一个\
  \ `logo.png` 文件，你可以通过 `http://localhost:3000/logo.png` 访问它。\n\n该目录对于 `manifest.json`、`robots.txt`\
  \ 以及任何你想要添加到域名根目录的静态文件也有用。\n\n### 探索 styles 目录\n\nNext.js 原生支持 CSS 导入。`styles` 目录是你添加\
  \ CSS 文件的地方。默认情况下，Next.js 配置你的项目支持 CSS Modules，这允许你将 CSS 直接导入到 JavaScript 文件中。\n\
  \n例如，你可以创建一个 `Button.module.css` 文件：\n\n```css\n/* Button.module.css */\n.button\
  \ {\n  padding: 10px 20px;\n  background-color: #0070f3;\n  color: #fff;\n  border:\
  \ none;\n  border-radius: 5px;\n}\n```\n\n然后在组件中导入它：\n\n```javascript\n// pages/index.js\n\
  import styles from ‘../styles/Button.module.css’\nexport default function Home()\
  \ {\n  return <button className={styles.button}>Click Me</button>\n}\n```\n\n默认包含\
  \ `globals.css` 文件，用于全局样式。这些样式将应用于应用程序中的所有页面和组件。你也可以使用此文件将其他 CSS 文件作为全局导入。\n\n###\
  \ 其他文件\n\n`package.json` 文件包含关于项目的元数据并列出了它的依赖项。当你运行 `npm install <package>` 时，该包将作为依赖项添加。\n\
  \n## 理解 pages 在 Next.js 中的作用\n\n在 Next.js 中，页面是一个 React 组件，它根据 `pages` 目录中的文件名与路由相关联。这个概念是\
  \ Next.js 的基础方面之一，理解它对于使用该框架构建应用至关重要。\n\n## 引入 pages\n\n在 Next.js 中，`pages` 目录中的每个文件都会变成一个自动处理并渲染的路由。假设你有一个文件\
  \ `pages/about.js`，它将可以通过 `http://localhost:3000/about` 访问。\n\n```javascript\n//\
  \ pages/about.js\nexport default function About() {\n  return <h1>About Us</h1>\n\
  }\n```\n\n当你导航到 `/about` 时，`About` 函数将会被渲染。\n\n- **自动路由**\n  Next.js 遵循基于页面概念构建的基于系统的路由器。当向\
  \ `pages` 目录中添加文件时，它将自动作为路由可用。\n  `pages` 目录中的文件和文件夹镜像了路由的路径。例如，如果你创建一个 `pages/posts/first-post.js`\
  \ 文件，它将可以通过 `/posts/first-post` 访问。\n\n- **动态路由**\n  Next.js 支持动态路由。如果你创建一个文件 `pages/[id].js`，它将可以通过\
  \ `/some-id` 访问。\n\n  ```javascript\n  // pages/[id].js\n  import { useRouter }\
  \ from 'next/router'\n\n  export default function Post() {\n    const router = useRouter()\n\
  \    return <h1>Post: {router.query.id}</h1>\n  }\n  ```\n\n\n\n\n让我们从 `Home` 页面创建一个指向“关于”（About）页面的\
  \ `Link`。打开 `pages/index.js` 文件并按照如下更新内容：\n\n```javascript\n// pages/index.js\n\
  import Link from ‘next/link’\nexport default function Home() {\n  return (\n   \
  \ <div>\n      <h1>Home</h1>\n      <p>Welcome to our website!</p>\n      <Link\
  \ href=”about”>About Us</Link>\n    </div>\n  )\n}\n```\n\n在在这段代码中，我们从 `next/link`\
  \ 导入了 `Link` 组件，并使用它链接到 **About**（关于）页面。`href` 属性用于指定链接的目标路由。\n\n现在，当你导航到 `http://localhost:3000`\
  \ 时，你将看到一个通往 **About**（关于）页面的链接。得益于 Next.js 的自动客户端导航，点击此链接将带你进入 **About** 页面，而无需刷新整个页面。\n\
  \n### 了解渲染过程\n\n当你在 Next.js 应用中请求页面时，底层会发生以下过程：\n\n1. **服务器接收请求**：当你导航到 Next.js\
  \ 应用中的某个路由时，服务器会接收到该路由的请求。\n2. **服务器获取页面组件**：Next.js 随后从 `pages` 目录获取该路由的 React\
  \ 组件。\n3. **服务器渲染页面**：组件在服务器上渲染为 HTML。如果你的组件在 `getServerSideProps` 函数中获取数据（我们将在稍后的章节中讨论），这种数据获取将发生在此步骤。\n\
  4. **服务器发送 HTML 响应**：HTML 结果被发送到客户端，同时带有用于水合（hydration）的少量 JavaScript 代码。\n5. **页面变为交互性**：JavaScript\
  \ 代码在客户端运行，将 HTML 水合为完全交互式的 React 应用程序。\n\n这一过程让 Next.js 能够提供快速的初始加载时间以及如服务端渲染和静态站点生成等强大的功能。\n\
  \n### 总结\n\n在这一节中，你学习了如何在 Next.js 中创建新页面、如何查看它以及如何在不同页面之间建立链接。你还对 Next.js 的渲染过程有了理解。有了这些基础知识，你就可以开始使用\
  \ Next.js 构建多页 Web 应用了。\n\n### 创建布局组件\n\n通常，你可能希望跨多个页面共享组件，例如页眉或页脚。Next.js 没有提供内置的布局系统，但创建自己的布局是非常简单的。\n\
  \n让我们创建一个布局组件，它渲染一个带有指向 **Home**（首页）和 **About**（关于）页面的链接的导航栏：\n\n```javascript\n\
  // components/Layout.js\nimport Link from ‘next/link’\nexport default function Layout({\
  \ children }) {\n  return (\n    <div>\n      <nav>\n        <Link href=”/>Home</Link>\n\
  \        <Link href=”about”>About</Link>\n      </nav>\n      {children}\n    </div>\n\
  \  )\n}\n```\n\n在 `Layout` 组件中，我们渲染了一个导航栏以及传递给 `Layout` 的子组件。\n\n现在，你可以在页面中使用这个\
  \ `Layout` 组件：\n\n```javascript\n// pages/index.js\nimport Layout from ‘../components/Layout’\n\
  export default function Home() {\n  return (\n    <Layout>\n      <h1>Home</h1>\n\
  \      <p>Welcome to our website!</p>\n    </Layout>\n  )\n}\n\n// pages/about.js\n\
  import Layout from ‘../components/Layout’\nexport default function About() {\n \
  \ return (\n    <Layout>\n      <h1>About Us</h1>\n      <p>We are a team of dedicated\
  \ developers building web applications with Next.js.</p>\n    </Layout>\n  )\n}\n\
  ```\n\n通过这种设置，每个页面都由 `Layout` 组件包裹，从而在页面间提供了统一的布局。\n\n在 Next.js 中创建和渲染页面是一个直观的过程。通过利用框架的自动路由和强大的渲染功能，你可以快速创建动态且高性能的\
  \ Web 应用。\n\n在下一节中，我们将查看如何使用 CSS Modules 为你的 Next.js 应用设置样式。\n\n## 使用 CSS modules\
  \ 在 Next.js 中实现 CSS 样式\n\n样式是任何 Web 应用的重要部分。在 Next.js 中，得益于对 CSS 和 Sass 的内置支持，可以将\
  \ CSS 直接导入到 JavaScript 文件中。在本节中，我们将重点关注 CSS Modules，这是一种 CSS 文件，所有类名和动画名称默认都是局部作用域的。\n\
  \n### 介绍 CSS Modules\n\nCSS Modules 是 CSS 文件，其中所有类名和动画名称默认都是局部作用域的。CSS Modules 的核心思想是确保单个组件的所有样式：\n\
  \n* 存在于同一个地方（一个 `.module.css` 文件）\n* 仅应用于该组件，而不影响其他部分\n\n### 创建 CSS 模块\n\n要创建一个\
  \ CSS Module，你需要创建一个 `.module.css` 文件。在项目的 `styles` 目录中，创建一个名为 `About.module.css`\
  \ 的新文件：\n\n```css\n/* About.module.css */\n.container {\n  margin: 20px;\n  padding:\
  \ 20px;\n  border: 1px solid #ddd;\n}\n.title {\n  color: #0070f3;\n  font-size:\
  \ 2em;\n  margin-bottom: 10px;\n}\n.content {\n  font-size: 1.2em;\n  line-height:\
  \ 1.6em;\n}\n```\n\n在此文件中，我们定义了三个 CSS 类：`container`、`title` 和 `content`。\n\n###\
  \ 如何使用 CSS Module\n\n要使用 CSS Module，你需要在 JavaScript 文件导入它。导入的 CSS Module 可以作为一个对象被引用。让我们将这些样式应用到\
  \ **About**（关于）页面上：\n\n```javascript\n// pages/about.js\nimport styles from ‘../styles/About.module.css’\n\
  import Layout from ‘../components/Layout’\nexport default function About() {\n \
  \ return (\n    <Layout>\n      <div className={styles.container}>\n        <h1\
  \ className={styles.title}>About Us</h1>\n        <p className={styles.content}>We\
  \ are a team of dedicated developers building web applications with Next.js.</p>\n\
  \      </div>\n    </Layout>\n  )\n}\n```\n\n在此文件中，我们导入了创建的 CSS Module 并在组件中使用这些类。这些样式仅应用于此组件，即使其他组件使用了相同的类名。\n\
  \n### 组合与全局类\n\nCSS Modules 允许你组合样式，这意味着你可以在当前模块中使用来自其他 CSS Modules 的样式。它还支持全局样式，全局样式将应用于整个应用程序。\n\
  \n这是一个使用组合和全局样式的示例：\n\n```css\n/* Global.module.css */\n.title {\n  color: #0070f3;\n\
  }\n\n/* styles/About.module.css */\n@import './Global.module.css’\n.container {\n\
  \  composes: title from './Global.module.css’;\n  font-size: 2em;\n}\n```\n\n在这个示例中，`About.module.css`\
  \ 文件从 `Global.module.css` 导入样式，并在其 `container` 类使用了 `title` 类。\n\n\n\n\n\n在接下来的章节“第\
  \ 13 章 - 核心概念”中，我们将深入探讨 Next.js 13 版本中引入的令人兴奋的新功能和增强特性。我们将探索这些更新如何进一步优化你的开发体验并提升应用程序的性能。从新的路由系统、边缘函数（Edge\
  \ Functions）的改进到中间件（Middleware）以及 React 服务器组件（React Server Components）的改进，你将对框架的现状有一个全面的理解，从而能够充分利用其高级能力。\n\
  \n## 多选题\n\n1. 什么是 Next.js？\n    1. 一个用于构建用户界面的 JavaScript 库\n    2. 一个用于网页样式设置的\
  \ CSS 框架\n    3. 一个功能完整的后端框架\n    4. 用于构建 JavaScript 应用程序的 React 框架\n\n2. 使用哪个命令创建新的\
  \ Next.js 应用？\n    1. `npm create-next-app`\n    2. `npm start-next-app`\n    3.\
  \ `npx create-next-app`\n    4. `npx start-next-app`\n\n3. 什么类型的文件代表 Next.js 中的一个页面？\n\
  \    1. ‘pages’ 目录下的 ‘js’ 或 ‘jsx’ 文件\n    2. ‘styles’ 目录下的 ‘css’ 文件\n    3. ‘markdown’\
  \ 目录下的 ‘md’ 文件\n    4. ‘public’ 目录下的 ‘html’ 文件\n\n4. Next.js 如何处理路由？\n    1. 通过在\
  \ ‘routes.js’ 文件中手动定义路由\n    2. 根据 ‘pages’ 目录自动生成\n    3. 使用 Express.js 路由系统\n \
  \   4. Next.js 不处理路由\n\n5. 你如何在 Next.js 中不同页面之间导航？\n    1. 使用 ‘`<a>’ HTML 元素\n \
  \   2. 使用来自 `next/navigate` 包的 `navigate` 函数\n    3. 使用来自 `next/link` 包的 `Link`\
  \ 组件\n    4. 使用来自 `next/router` 包的 `push` 方法\n\n6. 在 Next.js 应用程序中请求页面时会发生什么？\n\
  \    1. 浏览器下载整个应用程序\n    2. 服务器发送请求页面的 HTML\n    3. 服务器发送请求页面的 JavaScript 代码\n \
  \   4. 浏览器从零开始渲染页面\n\n7. Next.js 中的 CSS Module 是什么？\n    1. 一个 CSS 文件，其中所有类名和动画名称默认在全局作用域\n\
  \    2. 一个 CSS 文件，其中所有类名和动画名称默认在局部作用域\n    3. 一个 JavaScript 文件，其中所有样式都定义为 JavaScript\
  \ 对象\n    4. 一个可以作为字符串导入到 JavaScript 文件的 CSS 文件\n\n8. 如何在 Next.js 组件中应用 CSS Module\
  \ 中的类？\n    1. 使用 `className` 属性和类名\n    2. 使用 `style` 属性和类名\n    3. 使用 `className`\
  \ 属性并引用导入的样式对象中的类\n    4. 使用 `style` 属性并引用导入的样式对象中的类\n\n9. Next.js 中 `Layout` 组件的作用是什么？\n\
  \    1. 定义页面的结构\n    2. 在多个页面之间共享通用组件\n    3. 为页面设置样式\n    4. 处理页面的数据获取\n\n10. 下哪项不是\
  \ Next.js 的功能？\n    1. 自动路由\n    2. CSS Modules 的局部作用域\n    3. 客户端渲染\n    4. 将 JavaScript\
  \ 代码自动翻译为 TypeScript\n\n## 答案\n\n1. D\n2. C\n3. A\n4. B\n5. C\n6. B\n7. B\n8. C\n\
  9. B\n10. D\n\n# 第 4 章\n\n# Next.js 13\n\n## 介绍\n\n在本章中，我们将深入研究 Next.js 的最新版本 v13，该版本在\
  \ Next.js Conf 2022 上发布。Next.js 13 代表了 React 框架领域的一次重大演进，带来了全新的概念和工具，重新定义了开发者构建\
  \ Web 的方式。它的设计旨在简化开发流程，提供了一系列丰富的功能，使其更容易创建可扩展、高性能且符合 SEO 的 Web 应用程序。随着服务器组件（Server\
  \ Components）和 TurboPack 等功能的引入，Next.js 13 站在现代 Web 开发的最前沿，推向 React 和 JavaScript\
  \ 可能性的边界。\n\n一个关键变化是引入了 `app` 路由，这是对传统 `page` 文件结构的根本性转变。这种新的路由方法对页面切换提供了细粒度的控制，并增强了应用程序的整体性能。此外，Next.js\
  \ 13 改进了处理图像的方式，利用了新一代图像优化技术，同时提升了速度和视觉质量。\n\n本质上，Next.js 13 不仅仅是一次更新——它是一次重塑了 Next.js\
  \ 核心的量子飞跃，开启了 Web 开发的新时代。\n\n## 结构\n\n在本章中，我们将涵盖以下内容：\n\n*   设置 Next.js 13\n*  \
  \ App Router (App Router)\n*   客户端组件和服务器组件\n*   路由\n*   渲染\n*   数据获取\n\n## 设置 Next.js\
  \ 13\n\n要下载最新版本的 Next.js（截至 2023 年 5 月为 13.4 版本），首先在你的系统中安装 Node.js，然后输入以下命令：\n\n\
  ```bash\nnpx create-next-app@latest\n```\n\n你将看到以下提示：\n\nWhat is your project name?\
  \ my-app\nWould you like to use TypeScript with this project? Y/N\nWould you like\
  \ to use ESLint with this project? Y/N\nWould you like to use Tailwind CSS with\
  \ this project? Y/N\nWould you like to use the `src/` directory with this project?\
  \ Y/N\nWhat import alias would you like configured? @/*\n\n提示完成后，`create-next-app`\
  \ 将创建一个文件夹并安装所需的依赖。如果你打开 `package.json` 文件，你将看到以下脚本：\n\n```json\n{\n  \"scripts\"\
  : {\n    \"dev\": \"next dev\",\n    \"build\": \"next build\",\n    \"start\":\
  \ \"next start\",\n    \"lint\": \"next lint\"\n  }\n}\n```\n\n这些脚本对应于 Next.js 的不同阶段：\n\
  \n*   dev：运行 `next dev` 在开发模式下启动 Next.js。\n*   build：运行 `next build` 编译应用程序。\n*\
  \   start：运行 `next start` 启动 Next.js 生产服务器。\n*   lint：运行 `next lint` 设置内置的 ESLint\
  \ 配置。\n\n打开 `app` 文件夹下的 `layout.tsx` 文件，你会看到以下内容：\n\n```tsx\nimport './globals.css'\n\
  import { Inter } from 'next/font/google'\n\nconst inter = Inter({ subsets: ['latin']\
  \ })\n\nexport default function RootLayout({\n  children,\n}: {\n  children: React.ReactNode\n\
  }) {\n  return (\n    <html lang=\"en\">\n      <body className={inter.className}>{children}</body>\n\
  \    </html>\n  )\n}\n```\n\n现在打开 `app` 文件夹下的 `page.tsx` 并将其内容替换为以下代码：\n\n```tsx\n\
  export default function Page() {\n  return <h1>Hello, Next.js 13!</h1>;\n}\n```\n\
  \n在控制台中输入 `npm run dev` 启动开发服务器并在浏览器中访问 http://localhost:3000。你会看到以下屏幕：\n\n![](img/image1_1.jpg)\n\
  \n图 4.1：localhost 屏幕\n\n我们已经在电脑上成功设置了 Next.js 13 应用程序。\n\n## App Router\n\nNext.js\
  \ 13 引入了基于 React 服务器组件的新 App Router 结构，它支持嵌套路由、共享布局、错误处理和加载状态。App Router 运行在一个名为\
  \ `app` 的新文件夹中，可以与 pages 目录并存。这有助于渐进采用新的 App Router，并允许开发者按照自己的节奏学习新概念。\n\n\n\n\n\
  \n## 文件夹与文件\n\n在 App Router 中，文件夹用于定义路由。路由是由嵌套文件夹组成的单一路径，这些文件夹遵循从顶层根目录到包含 `page.js`\
  \ 文件的最后一个叶子文件夹的层级结构。`page.js` 用于定义该特定路由显示的 UI。例如，如果我们在浏览器中访问 [`mathewdony.com/dashboard`](https://mathewdony.com/dashboard)\
  \ 一个 Next.js 13 应用，应用程序将渲染来自位于 `app` 文件夹下 `dashboard` 文件夹内的 `page.tsx` 文件的。\n\n\
  以下是 `my-app` 的文件夹结构：\n\n```\nmy-app\n├─ app\n│  ├─ dashboard\n│  │└─ page.tsx\n\
  ```\n\n### 文件约定\n\nNext.js 提供了一系列特殊文件，用于在嵌套路由中创建具有特定行为的 UI。让我们来看看我们需要的主要文件：\n\n\
  - `page.js`: 用于渲染路由的 UI 并使该路径对用户公开。\n- `layout.js`: 用于为分段及其子分段创建共享 UI。布局（layout）包裹页面或子分段，并用于渲染跨路由共享的\
  \ UI，例如导航菜单或页眉组件。\n- `loading.js`: 用于为分段及其子分段创建加载 UI。`loading.js` 在加载时显示加载 UI，通过将页面或子分段包裹在\
  \ React Suspense Boundary 中来工作。\n- `error.js`: 用于为分段及其子分段创建错误 UI。`error.js` 在捕获到错误时显示错误\
  \ UI，通过将页面或子分段包裹在 React Error Boundary 中来工作。\n\n## 客户端与服务端组件\n\n随着 Next.js 13 的发布，引入了一种同时使用服务器组件（Server\
  \ Components）和客户端组件（Client Components）创建应用的混合方法。一种称为“服务器组件”的 React 原则旨在设计具有零 JavaScript\
  \ 束和服务器驱动现代用户界面心模型的应用程序。\n\n客户端组件是从客户端（浏览器）获取并在客户端上渲染的，而服务器组件则是从服务器获取并在服务器上渲染的。\n\
  \n现在，让我们来看一个没有服务器组件的程序。在这种情况下，服务器通过向浏览器发送信息来响应用户对网页的请求。浏览器在创建网页时下载 JavaScript。这意味着浏览器类似于\
  \ npm 包，必须安装创建网页所需的每一个 JavaScript 段。由于所有的请求-响应瀑布（waterfalls），这可能需要很长时间加载并导致糟糕的用户体验。\n\
  \n服务器组件在这种情况下非常有用。浏览器只需要下载客户端组件的 JavaScript 文件，而组件被定义为服务器组件是因为服务器构建了组件并返回了服务器组件渲染后的\
  \ HTML。这可以加速浏览器渲染并增强用户体验。\n\nNext.js 13 为我们提供了一个系统，我们可以在组件级别指定一个组件应该是服务器组件还是客户端组件。\n\
  \n在 Next.js 13 新引入的 app 目录中，所有组件默认都是服务器组件。这意味着只要你指定该组件应该在客户端渲染，否则所有组件和页面都会在服务器上渲染。以下是\
  \ `Next.js 13` 中服务器组件的样式：\n\n```javascript\nexport default function Page() {\nreturn\
  \ <h1>Hello, Next.js 13!</h1>;\n}\n```\n\n从前面的代码中可以看到，它只是一个普通的 React 组件，但由于 `Next.js\
  \ 13` 中所有组件默认都是服务器组件，它会自动变成一个服务器组件。\n\nNext.js 建议在需要使用客户端组件之前一直使用服务器组件。例如，React\
  \ hooks（如 `useState()`、`useEffect()` 和 `useContext()`）仅在客户端可用。此外，如果你需要访问与浏览器相关的内容（如\
  \ `onClick` 事件、window 或浏览器 API），你需要使用客户端组件。\n\n如果我们需要在应用中添加一个计数器，可以如下所示在 React 组件中导入\
  \ `useState`：\n\n```javascript\nimport React, { useState } from \"react\";\nexport\
  \ default function Page() {\nconst [count, setCount] = useState(0);\nreturn <h1>Current\
  \ Count: {count}</h1>;\n}\n```\n\n但前面的代码会在浏览器中带给我们以下错误消息，如图 4.2\n\n**图 4.2:** 错误消息\n\
  \n要执行前面的代码，我们需要将服务器组件转换为客户端组件。可以通过可以在组件文件顶部添加 `use client` 指令来实现，如下：\n\n```javascript\n\
  \"use client\";\nimport React, { useState } from \"react\";\nexport default function\
  \ Page() {\nconst [count, setCount] = useState(0);\nreturn <h1>Current Count: {count}</h1>;\n\
  }\n```\n\n这解决了错误，应用如下所示运行正常：\n\n![](img/image2_1.jpg)\n\n**图 4.3:** 错误修复后应用运行正常\n\
  \n## 路由\n\nNext.js 使用基于文件系统的路由器，其中每个文件夹定义一个路由。每个文件夹代表一个映射到 URL 段的路由分段，并通过在其他文件夹内部嵌套文件夹来创建嵌套路由。\n\
  \n### 动态路由\n\n在开发 Web 应用时，存在开发者或用户可能无法提前知晓确切分段并希望从动态数据创建路由的情况。在这种情况下，我们可以使用在请求时解析或在构建时预渲染的动态段（Dynamic\
  \ Segments）。\n\nNext.js 13 中的动态段可以通过将文件夹名称放在方括号中来创建。例如，如果你想渲染从 URL 段获取的动态数据，如 `app/blog/[slug]/page.js`，其中\
  \ `[slug]` 是博客的动态段，那么你可以这样编写 `page.js`：\n\n```javascript\nexport default function\
  \ Page({ params }) {\nreturn <div>My Post with ID {params.slug}</div>;\n}\n```\n\
  \n如果我们访问 URL `app/blog/1234`，我们将在 `params` 属性中获得 `1234` 值，如前面的示例所示。\n\n### 错误处理\n\
  \n`error.js` 文件约定允许开发者处理嵌套路由中的运行时错误。它可以用于将路由及其嵌套子项自动包裹在 React Error Boundary 中。这允许为特定分段创建定制的错误\
  \ UI。`error.js` 文件约定的主要优势是它允许错误隔离而不影响应用的其他部分。可以通过在路由分段内创建 `error.js` 文件并导出 React\
  \ 组件来轻松添加错误 UI。\n\n### 中间件\n\n我们可以在请求完成之前使用中间件执行代码。可以根据传入请求通过重写、重定向、更改请求或响应头或直接响应来修改响应。\n\
  \n## 渲染\n\nNext.js 中的路由可以是静态渲染或动态渲染。在静态路由中，组件在构建时在服务器上渲染。这些工作会被缓存并在后续请求中重用，而在动态路由中，组件在请求时在服务器上渲染。\n\
  \n### 静态渲染\n\n静态渲染是 Next.js 应用的默认渲染模式，它提高了性能，因为所有的渲染工作都是提前完成的并且可以从地理位置更接近用户的内容分发网络（CDN）提供。\n\
  \n\n\n\n\n如果在静态渲染期间检测到动态函数或无缓存模式下的 `fetch()` 请求，Next.js 将切换为在请求时动态渲染整个路由。任何缓存的数据请求在动态渲染期间仍然可以被重用。动态数据获取是指其缓存选项设置为‘no-store’的或将\
  \ `revalidate` 设置为 `0` 的 `fetch` 请求。我们将在下一节中探索更多数据获取模式。\n\n## 数据获取\n\nReact 和 Next.js\
  \ 13 引入了在应用程序中获取和管理数据的新方法。新的数据获取系统工作在 `app` 目录中，并基于 `fetch()` Web API 构建。\n\n`fetch()`\
  \ 是一个用于获取远程资源的 Web API，它会返回一个 promise。React 扩展了 `fetch` 以提供自动的请求去重，而 Next.js 扩展了\
  \ `fetch` 选项对象，允许每个请求设置自己的缓存和重新验证。\n\n### Server Components 中的 async 和 await\n\n\
  以下代码展示了在 Server Components 中使用 `async` 和 `await` 获取数据的示例：\n\n```javascript\nasync\
  \ function getData() {\n  const res = await fetch(‘https://api.example.com/…’);\n\
  \  if (!res.ok) {\n    // 这将激活最近的 `error.js` 边界\n    throw new Error(‘Failed to\
  \ fetch data’);\n  }\n  return res.json();\n}\n\nexport default async function Page()\
  \ {\n  const data = await getData();\n  return <p>{data}</p>;\n}\n```\n\n### 静态数据获取\n\
  \n默认情况下，`fetch` 将自动 `fetch` 并无限期 `cache` 数据：\n\n```javascript\nfetch(‘https://…’);\
  \ // 默认 cache: ‘force-cache’\n```\n\n### 动态数据获取\n\n要在每次 fetch 请求时获取新鲜数据，请使用缓存选项：`no-store`：\n\
  \n```javascript\nfetch(‘https://…’, { cache: ‘no-store’ });\n```\n\n## 结论\n\n在本章中，我们学习了最新的\
  \ Web 框架 Next.js 13，并探索了它新的关键特性和优势。我们看到它如何采用 app 路由器，使得开发者无需担心渲染和缓存 Next.js 应用程序，因为这些情况由框架自动处理。有了所有这些新功能，Next.js\
  \ 13 已经成为 2023 年构建 Web 应用明显选择。\n\n在接下来的章节中，*Optimizing Next.js Applications* 中，我们将学习可以用于优化\
  \ Next.js 应用程序的不同策略，从而提高性能并提供更好的开发者体验。Next.js 提供了内置组件，如 `<Image />` 和 `<Link />`，为开发者提供了许多开箱即用的功能来优化他们的\
  \ Web 应用程序。\n\n## 单选题\n\n1. 在本地启动 Next.js 开发服务器的命令是哪个？\n    1. `next dev`\n    2.\
  \ `next build`\n    3. `next start`\n    4. `next lint`\n\n2. Next.js 13 中的主目录是哪个？\n\
  \    1. layout 文件夹\n    2. pages 目录\n    3. app 路由器\n    4. public 文件夹\n\n3. 嵌套文件夹的单一路径称为什么？\n\
  \    1. Route (路由)\n    2. Page (页面)\n    3. App\n    4. Folder (文件夹)\n\n4. 用于渲染路由\
  \ UI 的文件是哪个？\n    1. `error.js`\n    2. `loading.js`\n    3. `wait.js`\n    4. `page.js`\n\
  \n5. Next.js 13 中组件的默认类型是什么？\n    1. Home Component\n    2. Server Component (服务端组件)\n\
  \    3. App Component\n    4. Router Component\n\n6. 将 Server Component 转换为 Client\
  \ Component 的指令是哪个？\n    1. `use client`\n    2. `use server`\n    3. serve client\n\
  \    4. set client\n\n7. 哪个文件提供了 Next.js 13 中的 React Error Boundary (错误边界)？\n  \
  \  1. `boundary.js`\n    2. `fault.js`\n    3. `error.js`\n    4. `error-boundary.js`\n\
  \n8. Next.js 13 中 `fetch` API 的默认行为是什么？\n    1. 强制缓存\n    2. 不缓存\n    3. 增量缓存\n\
  \    4. 定期缓存\n\n9. 构建生产环境 Next.js 应用的命令是哪个？\n    1. build production\n    2. `next\
  \ dev`\n    3. `next build`\n    4. `next run`\n\n10. 为‘id’设置动态路由路径的约定是哪个？\n   \
  \ 1. `{id}`\n    2. `[id]`\n    3. `(id)`\n    4. `<id>`\n\n## 答案\n\n1. A\n2. C\n\
  3. A\n4. D\n5. B\n6. A\n7. C\n8. A\n9. C\n10. B\n\n# 第 5 章\n\n# 优化 Next.js 应用程序\n\
  \n## 引言\n\n作为一名精明的开发者，你知道你的 Next.js 应用程序需要优化以获得最佳性能。幸运的是，Next.js 是一个开源框架，使其能够轻松构建极快的服务端渲染\
  \ React 应用程序。通过自动代码分割和静态导出等开箱即用的功能，Next.js 承担了大部分体力工作，让你能够专注于创建用户喜爱的可扩展、高性能的应用程序。在本章中，我们将探索\
  \ Next.js 的精彩世界，重点介绍它的许多特性，并讨论为什么优化你的 Next.js 应用如此重要。所以，系好带，准备好为你的开发加速吧！\n\n## 结构\n\
  \n在本章中，我们将涵盖以下主题：\n\n* 优化 Next.js 应用程序重要性和优势\n* 使用 `head` 组件向页面添加元数据\n* 在 Next.js\
  \ 中实现静态文件服务\n* 理解用于图片优化的 image 组件\n* 理解 Next.js 架构及其工作原理\n* 配置 Next.js 以获得最佳性能\n\
  * 实现服务端渲染 (SSR) 和预渲染\n* 代码分割和动态导入\n* 缓存和改进数据获取\n* 分析并减少包体积\n* 部署策略和最佳实践\n* 监控和优化性能\n\
  \n## 优化 Next.js 应用程序重要性和优势\n\n优化 Next.js 应用程序对于几个原因是非常重要的。首先，它可以提高应用程序的整体性能，从而提高用户参与度和留存率。其次，它可以减少服务器负载，为开发者节省成本。最后，优化\
  \ Next.js 应用程序有助于应用程序面向未来，确保其具有可扩展性和可维护性。\n\n优化 Next.js 应用程序有许多优势，包括：\n\n* **提高性能**：优化\
  \ Next.js 应用程序可以提高应用程序性能，带来更快的加载速度和更好的用户体验。\n* **减少服务器负载**：优化 Next.js 应用程序可以减少服务器负载，为开发者节省成本。\n\
  * **面向未来**：优化 Next.js 应用程序有助于应用程序面向未来，确保其具有可扩展性和可维护性。\n* **提高开发者生产力**：优化 Next.js\
  \ 应用程序可以提高开发者生产力，因为它可以帮助更快识别并解决性能问题。\n\n## 使用 head 组件向页面添加元数据\n\n在本节中，我们将探索 Next.js\
  \ 中 `Head` 组件的语法和用法。我们将学习如何设置页面标题、定义元标记、添加外部样式表以及引入 JavaScript 库。此外，我们还将涵盖结构化组织元数据的最佳实践，以最大化其影响力。\n\
  \n通过有效利用 `Head` 组件，你可以确保你的网页在不同平台上都有良好的展示，并获得更好的可见性。要使用 `Head` 组件，你需要从 `next/head`\
  \ 模块导入它。\n\n```javascript\nimport Head from ‘next/head’;\n```\n\n\n\n\n\n```javascript\n\
  function HomePage() {\n  return (\n    <div\n      <Head>\n        <title> Feature\
  \ Books - NextCommercePro</title>\n        <meta name=\"description\" content=\"\
  Feature books in our collection\" />\n      </Head>\n      {/* Rest of the page\
  \ content */}\n    </div>\n  );\n}\n\nexport default HomePage;\n```\n\n*图 5.1* 显示了带有\
  \ meta 和 title 的默认首页：\n\n![](img/5.1.jpg)\n\n**图 5.1：** 默认首页\n\n在代码代码段中，我们从 `next/head`\
  \ 模块导入了 `Head` 组件。在 `HomePage` 组件内部，我们将所需的元数据元素封装在 `Head` 组件中。在这种情况下，我们将标题（title）设置为\
  \ `My Next.js App - Home`，并将描述（meta description）设置为 `Welcome to my Next.js application`！\n\
  \n`Head` 组件还允许你添加其他其他元数据标签。例如，你可以包含 Open Graph (OG) 标签以便更好地在社交媒体上分享：\n\n```javascript\n\
  import Head from 'next/head';\n\nfunction BookPage({ book }) {\n  return (\n   \
  \ <<div>\n      <Head>\n        <title>{book.title}</title>\n        <meta name=\"\
  description\" content={book.excerpt} />\n        <meta property=\"og:title\" content={book.title}\
  \ />\n        <meta property=\"og:description\" content={book.excerpt} />\n    \
  \    <meta property=\"og:image\" content={book.thumbnail} />\n      </Head>\n  \
  \    {/* Rest of the page content */}\n    </div>\n  );\n}\n\nexport default BookPage;\n\
  ```\n\n*图 5.2* 展示了产品详情页：\n\n![](img/5.2.jpg)\n\n在这个示例中，我们将 `post` 对象作为 prop 传递给\
  \ `BookPage` 组件。我们使用 `post` 的数据来动态设置标题、描述和 Open Graph (OG) 标签。`og:title`、`og:description`\
  \ 和 `og:image` 标签对于社交媒体平台在页面被共享时显示正确的标题、描述和缩略图至关重要。\n\n通过使用 `Head` 组件，你可以轻松为 Next.js\
  \ 应用程序中的每个页面设置元数据，从而优化 SEO 并增强页面在社交媒体平台上的视觉呈现。记得包含相关的元数据（如标题、描述和 OG 标签），以确保你的页面针对搜索引擎和社交共享进行了有效的优化。\n\
  \n## 在 Next.js 中实现静态文件服务\n\n在涉及 Next.js 中实现静态文件服务时，不同类型的静态文件在 Web 开发中起着至关重要的作用，包括图像、CSS\
  \ 样式表和 JavaScript 文件。在本节中，我们将探索如何在你的 Next.js 应用程序中高效地提供静态文件。我们将涵盖各种策略和最佳实践，以确保静态资源无缝集成到你的\
  \ Next.js 项目中并获得最佳性能。\n\n### 提供图像\n\n图像是现代 Web 开发的一部分。在 Next.js 中，你可以通过以下步骤提供图像：\n\
  \n*   在 Next.js 项目的根目录下创建一个名为 `public` 的文件夹。\n*   将你的图像文件（例如 `my-image.jpg`）放置 `public`\
  \ 文件夹内部。\n*   在你的 Next.js 组件中，使用 Next.js 的 `<Image>` 组件来显示图像。\n\n这是一个示例：\n\n```javascript\n\
  import Image from 'next/image';\n\nconst MyComponent = () => {\n  return (\n   \
  \ <div>\n      <Image src=\"/my-image.jpg\" alt=\"My Image\" width={500} height={300}\
  \ />\n    </div>\n  );\n};\n\nexport default MyComponent;\n```\n\n`<Image>` 组件会自动优化并提供图像，提供如懒加载和响应式图像渲染等优势。\n\
  \n### 提供 CSS 样式表\n\n在涉及 Next.js 中实现静态文件服务时，CSS 样式表是方程式中不可或缺的一部分。它们允许你对网页进行样式化并使其具有视觉吸引力。在本节中，我们将深入探讨如何在你的\
  \ Next.js 应用程序中高效地提供 CSS 样式表。\n\n首先，假设你有一个名为 `styles.css` 的 CSS 文件，其中包含了你 Next.js\
  \ 应用程序的所有样式。以下是如何使用 Next.js 提供此 CSS 文件的示例：\n\n*   在 Next.js 项目的根目录下创建一个名为 `public`\
  \ 的文件夹。该文件夹将存放你所有的静态文件，包括 CSS 样式表。\n*   将 `styles.css` 文件移动到 `public` 文件夹中。\n* \
  \  在你的 Next.js 组件或布局文件中，使用 `<head>` 部分内的 `<link>` 标签导入 CSS 文件。\n\n这是一个示例：\n\n```javascript\n\
  import Head from 'next/head';\n\nconst MyComponent = () => {\n  return (\n    <div>\n\
  \      <Head>\n        <link rel=\"stylesheet\" href=\"/styles.css\" />\n      </Head>\n\
  \      {/* Your component content */}\n    </div>\n  );\n};\n\nexport default MyComponent;\n\
  ```\n\n*   通过 `<link>` 标签，我们将 `rel` 属性指定为 `stylesheet`，以表示这是一个样式表。在这种情况下，`href`\
  \ 属性指向 `/styles.css`，因为它位于 `public` 文件夹中。\n\n### 提供 JavaScript 文件\n\n在涉及 Next.js\
  \ 中提供 JavaScript 文件时，你可以遵循这一流程以确保这些文件的高效交付和集成。\n\n1.  **创建 `public` 文件夹**：首先，在 Next.js\
  \ 项目的根目录下创建一个名为 `public` 的文件夹（如果不存在）。该文件夹将存放你所有的静态文件，包括 JavaScript 文件。\n2.  **将\
  \ JavaScript 文件放置在 `public` 文件夹中**：将你的 JavaScript 文件移动到 `public` 文件夹。例如，假设你有一个名为\
  \ `script.js` 的 JavaScript 文件。文件结构应如*图 5.3*所示：\n\n    ![](img/image1111.jpg)\n\n\
  \    图 5.3：Public 文件夹结构\n3.  **在 HTML 中引入 JavaScript 文件**：要在 HTML 中引入 JavaScript\
  \ 文件，可以使用 `<script>` 标签。Next.js 会将放置在 `public` 文件夹中的任何文件作为静态文件提供，你可以通过相对于 Next.js\
  \ 应用程序根的路径引用它们。在你的 HTML 文件或 Next.js 组件中，包含以下代码段以导入 JavaScript 文件：`<script src=\"\
  /script.js\"></script>`。\n4.  **利用 JavaScript 功能**：一旦 JavaScript 文件位于 HTML 或 Next.js\
  \ 组件中，你就可以访问并利用它提供的功能。`script.js` 中的 JavaScript 代码可以包含你想整合到应用程序中的各种函数、事件监听器或其他逻辑。\n\
  \n    例如，如果 `script.js` 包含一个名为 `myFunction` 的函数，你可以使用以下语法从 HTML 或 Next.js 组件中调用它：\n\
  \n    ```html\n    <script src=\"/script.js\"></script>\n    <script>\n      myFunction();\
  \ // 调用 script.js 中定义的函数\n    </script>\n    ```\n\n\n\n\n\n`</script>`\n\n通过遵循这些步骤，Next.js\
  \ 将将 JavaScript 文件作为静态资源提供，使其能够高效地交付到客户端浏览器。随后，你可以根据需要在使用应用程序中使用 JavaScript 功能。\n\
  \n需要注意的是，Next.js 会自动处理静态文件（包括 JavaScript 文件）的缓存和优化。如果你对 JavaScript 文件进行了更改，Next.js\
  \ 将为更新后的版本生成一个新的唯一文件名，确保客户端接收到最新代码，而无需依赖手动刷新缓存。\n\n通过这种方式提供 JavaScript 文件，你可以将动态功能和交互性无缝集成到你的\
  \ Next.js 应用程序中，同时确保最佳性能和静态资源的高效交付。\n\n## 理解如何使用 Next.js Image 组件进行图像优化\n\n图像是任何现代\
  \ Web 应用程序不可或缺的一部分，对它们进行性能优化至关重要。在本节中，我们将深入探讨 Next.js 的 Image 组件及其在 Next.js 应用程序中优化图像的特性。Next.js\
  \ Image 组件提供了内置的图像优化技术，例如自动调整大小、懒加载和响应式图像交付，以确保高效的渲染并缩短页面加载时间。\n\n你将全面了解如何利用该组件在\
  \ Next.js 项目中交付高效且视觉出色的图像。要使用 Next.js Image 组件，你需要从 `next/image` 模块导入它。\n\n让我们考虑一个使用\
  \ Next.js Image 组件显示优化后图像的示例：\n\n```javascript\nimport Image from 'next/image';\n\
  \nfunction HomePage() {\n  return (\n    <div>\n      <Image src=\"/images/my-image.jpg\"\
  \ alt=\"My Image\" width={800} height={600} />\n      {/* Rest of the page content\
  \ */}\n    </div>\n  );\n}\n\nexport default HomePage;\n```\n\n在前面的代码代码段中，我们从 `next/image`\
  \ 模块导入了 `Image` 组件。我们使用 `Image` 组件来显示位于 `/images/my-image.jpg` 的图像。我们还为了可访问性目的提供了\
  \ `alt` 文本。此外，我们使用 `width` 和 `height` 属性指定了图像所需的宽度和高度。\n\nNext.js Image 组件会根据提供的尺寸自动优化图像。它在构建时生成图像的多个优化版本，每个版本都针对不同的屏幕尺寸和设备进行了定制。系统将根据视口（viewport）和设备特征向客户端提供合适的图像，从而提高了性能并减少了带宽消耗（图\
  \ 5.4）。\n\n![](img/5.4.jpg)\n\n**图 5.4：** 产品列表页或书籍列表页\n\nNext.js Image 组件支持其他属性，你可以使用这些属性进一步优化图像交付：\n\
  \n- **layout**:\n  `layout` 属性决定图像在页面上的布局方式。它可以设置为 `responsive`（默认值）、`fixed` 或 `intrinsic`。`responsive`\
  \ 布局根据容器的尺寸自动调整图像大小，而 `fixed` 和 `intrinsic` 则强制执行特定尺寸。\n\n    ```javascript\n  \
  \  import Image from 'next/image';\n\n    function HomePage() {\n      return (\n\
  \        <div>\n          <Image\n            src=\"/images/my-image.jpg\"\n   \
  \         alt=\"My Image\"\n            layout=\"responsive\"\n            width={800}\n\
  \            height={600}\n          />\n          {/* Rest of the page content\
  \ */}\n        </div>\n      );\n    }\n\n    export default HomePage;\n    ```\n\
  \  在前面的示例中，我们将 `layout` 属性设置为 `responsive`。这允许图像根据容器的尺寸动态调整大小，确保实现响应式布局。\n\n- **objectFit**:\n\
  \  `objectFit` 属性决定图像在容器内的缩放和定位方式。它可以设置为 `fill`（默认值）、`contain`、`cover`、`none` 或\
  \ `scale-down`。\n  在接下来的示例中，我们将 `objectFit` 属性设置为 `cover`。这确保图像在保持宽高比例的同时覆盖整个容器。\n\
  \n    ```javascript\n    import Image from 'next/image';\n\n    function HomePage()\
  \ {\n      return (\n        <div>\n          <Image\n            src=\"/images/my-image.jpg\"\
  \n            alt=\"My Image\"\n            layout=\"fill\"\n            objectFit=\"\
  cover\"\n          />\n          {/* Rest of the page content */}\n        </div>\n\
  \      );\n    }\n\n    export default HomePage;\n    ```\n\n- **objectPosition**:\n\
  \  `objectPosition` 属性指定图像在容器内的水平和垂直位置。它接受值如 `top`、`bottom`、`left`、`right`、`center`\
  \ 或这些值的组合。\n\n    ```javascript\n    import Image from 'next/image';\n\n    function\
  \ HomePage() {\n      return (\n        <div>\n          <Image\n            src=\"\
  /images/my-image.jpg\"\n            alt=\"My Image\"\n            layout=\"fixed\"\
  \n            width={500}\n            height={300}\n            objectFit=\"contain\"\
  \n            objectPosition=\"top right\"\n          />\n          {/* Rest of\
  \ the page content */}\n        </div>\n      );\n    }\n\n    export default HomePage;\n\
  \    ```\n  在这个示例中，我们将 `objectPosition` 设置为 `top right`。这会将图像置于右上角。\n\n- **loading**:\n\
  \  `loading` 属性控制图像的懒加载行为。它可以设置为 `eager`（默认值）以立即加载图像，或设置为 `lazy` 以延迟加载直到图像进入视口。\n\
  \n    ```javascript\n    import Image from 'next/image';\n\n    function HomePage()\
  \ {\n      return (\n        <div>\n          <Image\n            src=\"/images/my-image.jpg\"\
  \n            alt=\"My Image\"\n            loading=\"lazy\"\n          />\n   \
  \       {/* Rest of the page content */}\n        </div>\n      );\n    }\n\n  \
  \  export default HomePage;\n    ```\n  在此示例中，我们将 `loading` 属性设置为 `lazy`，允许图像在进入视口时才加载，通过减少初始加载时间来提高性能。\n\
  \n- **priority 属性**:\n  Next.js Image 组件中的 `priority` 属性允许你优先加载图像，以确保关键内容具有更好的用户体验。通过为某些图像设置更高的优先级，你可以确保它们优先加载，减少重要视觉元素的感知加载时间。\n\
  \n  这里是使用 `priority` 属性的示例：\n\n    ```javascript\n    import Image from 'next/image';\n\
  \n    function HomePage() {\n      return (\n        <div>\n          <Image\n \
  \           src=\"/images/my-image.jpg\"\n            alt=\"My Image\"\n       \
  \     priority\n          />\n          {/* Rest of the page content */}\n     \
  \   </div>\n      );\n    }\n\n    export default HomePage;\n    ```\n  在前面的代码段中，我们为图像组件设置了\
  \ `priority` 属性为 true。这表示该图像在加载时应具有更高的优先级。\n\n  通过设置 `priority` 属性，Next.js 将优先加载图像，在页面加载过程中尽早获取。这确保了图像能够尽早可用，通过减少重要视觉元素的感知加载时间来提升用户体验。\n\
  \n\n\n\n\n通过关注上述提到的三个详细主题并对剩余主题进行概述，本章旨在让您掌握必要的知识，以有效利用 Next.js 并优化您的应用程序以获得卓越的性能。\n\
  \n## 理解 Next.js 架构及其工作原理\n\n我们将对 Next.js 架构、其核心组件以及它们如何交互以交付强大的服务端渲染应用程序提供高层概述。\n\
  \nNext.js 是一个 React 框架，为构建现代 Web 应用程序提供了全面的解决方案，专注于性能和开发者体验。它结合了服务端渲染 (SSR) 和客户端渲染\
  \ (CSR) 的优点，以提供快速且交互式的用户体验。\n\nNext.js 遵循混合渲染方法，允许您根据应用程序的需求在 SSR 和 CSR 之间进行选择。让我们详细探讨架构及其工作原理：\n\
  \n### 服务端渲染 (SSR)\n\n在服务端渲染中，服务器为每个页面生成 HTML 内容并将其发送到客户端。这意味着初始页面加载包含了完全渲染的 HTML，包括从\
  \ API 或数据库获取的内容。这种方法具有以下几个优势：\n\n- **提升 SEO 性能**：搜索引擎可以轻易地爬取并索引完全渲染的 HTML，从而实现更好的搜索引擎优化。\n\
  - **更快的初始页面加载**：由于服务器将预渲染的 HTML 发送到客户端，用户即使在较慢的连接上也能更快看到内容。\n- **静态内容的更好性能**：静态内容在服务器上生成一次，并可以缓存后续请求进行缓存，减少服务器负载。\n\
  \n为了在 Next.js 中启用 SSR，您需要在 `pages` 目录中创建一个类型为“页面 (page)”的特殊类型文件。每个页面文件都导出一个代表该页面内容的\
  \ React 组件。在构建过程中，Next.js 会预渲染这些页面并生成相应的 HTML 文件。**\n\n### 客户端渲染 (CSR)\n\n在客户端渲染中，服务器发送的初始\
  \ HTML 包含页面的最小骨架，然后由客户端 JavaScript 接管以获取数据并动态渲染内容。这种方法提供了以下益处：\n\n- **交互式用户体验**：通过\
  \ CSR，您可以构建高度交互的应用程序，这些应用程序可以在客户端获取并显示数据，而无需重新加载页面。\n- **实时更新**：通过异步获取数据，您可以在不刷新整个页面的情况下实时更新\
  \ UI。\n\nNext.js 通过其强大的客户端路由系统支持 CSR。当用户导航到 Next.js 应用程序中的不同页面时，仅会获取必要的 JavaScript\
  \ 和数据，UI 在无需完全重新加载的情况下进行更新。\n\n### Next.js 架构\n\nNext.js 使用无服务器架构，允许您将应用程序部署到 Vercel、AWS\
  \ Lambda 或 Netlify 等无服务器平台。该架构根据传入的流量自动扩展，确保最佳性能并降低基础设施成本。\n\nNext.js 还提供了多种开箱即用的性能优化功能，例如自动代码分割、静态站点生成\
  \ (SSG) 和增量静态再生 (ISR)。这些功能允许您交付优化且加载快速的 Web 应用程序。\n\n### 代码示例：\n\n这是一个使用 SSR 的基础\
  \ Next.js 页面组件示例：\n\n```javascript\n// pages/index.js\nimport React from 'react';\n\
  \nfunction HomePage({ data }) {\n  return (\n    <div>\n      <h1>Welcome to Next.js!</h1>\n\
  \      <p>{data}</p>\n    </div>\n  );\n}\n\nexport async function getServerSideProps()\
  \ {\n  // 从 API 或数据库获取数据\n  const res = await fetch('https://api.example.com/data');\n\
  \  const data = await res.json();\n  return {\n    props: {\n      data,\n    },\n\
  \  };\n}\n\nexport default HomePage;\n```\n\n在此段代码中，我们有一个简单的 Next.js 页面组件称为 `HomePage`。它接收数据作为\
  \ prop 并在页面上渲染。`getServerSideProps` 函数是一个特殊的 Next.js 函数，它运行在服务器上并从 API 或数据库获取数据。数据在被获取后，将作为\
  \ prop 传递给 `HomePage` 组件。\n\n当用户请求 `HomePage` 时，Next.js 将在服务器上执行 `getServerSideProps`\
  \ 函数并获取数据。获取的数据随后作为 props 传递给 `HomePage` 组件，由该组件在页面上渲染内容。\n\n这是 Next.js 中 SSR 的示例。服务器生成带有获取数据的完全渲染\
  \ HTML 并将其发送到客户端，导致更快的初始页面加载和改进的 SEO。\n\n除了 SSR 之外，Next.js 还支持用于动态内容的 CSR。您可以使用\
  \ `useEffect` 钩子或其他机制在客户端获取数据并在不完全重新加载页面的情况下更新 UI。\n\n理解 Next.js 中 SSR 和 CSR 的架构和能力，允许您根据应用程序的需求利用适当的渲染方法，平衡性能、交互性和\
  \ SEO 考量。\n\n## 配置 Next.js 以获得最佳性能\n\n我们将涉及 Next.js 中提供的各种配置选项，以微调您的应用程序的性能。此概述将为优化您的\
  \ Next.js 项目提供起点。\n\n为了在 Next.js 应用程序中实现最佳性能，有几个可以遵循的配置选项和最佳实践。这包括使用生产就绪构建、优化图像以及实现服务端缓存。让我们详细探讨这些每个方面：\n\
  \n### 使用生产就绪构建\n\n默认情况下，当您运行 Next.js 开发服务器时，它使用包含热模块替换和调试工具等功能的开发构建。然而，为了获得生产环境获得最佳性能，建议使用生产就绪构建。\n\
  \n要创建生产构建，可以使用以下命令：\n\n```bash\nnext build\n```\n\n该命令会为您的 Next.js 应用程序生成优化且压缩的构建。然后可以使用以下命令启动生产服务器：\n\
  \n```bash\nnext start\n```\n\n使用生产构建可以移除不必要的开发代码和优化，从而缩短加载时间并提高性能。\n\n## 实现服务端缓存\n\
  \n我们将简要讨论 Next.js 中服务端渲染和预渲染的概念，强调它们的益处以及如何在应用程序中实现它们。\n\n服务端缓存可以显著提高您的 Next.js\
  \ 应用程序的性能，减少服务器负载并提高响应时间。Next.js 通过各种机制内置支持服务端缓存：\n\n### 使用缓存的 getServerSideProps\n\
  \nNext.js 中的 `getServerSideProps` 函数可以配置为缓存服务端渲染的页面一段时间。通过设置 `revalidate` 属性，您可以控制刷新缓存的频率。这对于不经常更改的数据非常有用。\n\
  \n### 实现外部缓存\n\nNext.js 应用程序可以从利用外部缓存机制（如 CDN（内容分发网络）缓存或代理缓存）中受益。这些机制在靠近用户的边缘位置缓存生成的\
  \ HTML 或静态资源，从而获得更快的响应时间。\n\n### 使用缓存插件\n\nNext.js 拥有丰富的插件生态系统，为不同的用例提供定制的缓存解决方案。您可以探索可用的缓存插件，以进一步优化应用程序中的缓存策略。\n\
  \n\n\n\n通过实现服务端缓存，你可以减轻服务器负载，缩短响应时间，并提供更快的用户体验。\n\n**代码示例：**\n\n以下是在 Next.js 中使用\
  \ `getServerSideProps` 函数结合缓存的示例：\n\n```javascript\nimport React from ‘react’;\n\
  \nfunction HomePage({ data }) {\n  return (\n    <div>\n      <h1>Welcome to Next.js!</h1>\n\
  \      <p>{data}</p>\n    </div>\n  );\n}\n\nexport async function getServerSideProps()\
  \ {\n  const cacheSeconds = 60; // 缓存 60 秒\n  // 从 API 或数据库获取数据\n  const res = await\
  \ fetch('https://api.example.com/data');\n  const data = await res.json();\n  return\
  \ {\n    props: {\n      data,\n    },\n    revalidate: cacheSeconds,\n  };\n}\n\
  ```\n\n在上述上述代码示例中，我们有一个名为 `HomePage` 的基础 Next.js 组件。它接收 `data` 作为 prop 并在页面上渲染。`getServerSideProps`\
  \ 函数是一个运行在服务器上的特殊函数，从 API 或数据库获取数据。\n\n在 `getServerSideProps` 函数中，我们定义了一个变量 `cacheSeconds`\
  \ 来设置页面应该缓存的持续时间（在本例中为 60 秒）。通过设置 `revalidate` 属性，Next.js 将在指定的时间后刷新服务端渲染的页面。这通过在后续请求中提供缓存内容，有助于减少服务器的负载。\n\
  \n通过实施此类缓存策略，你可以减少频繁获取数据的需求，从而优化 Next.js 应用程序的性能。请根据你的具体用例和数据更新频率调整缓存时长（`cacheSeconds`）。\n\
  \n为了优化性能配置 Next.js，涉及到使用生产级构建、优化图像以及实现服务端缓存。这些实践有助于确保你的应用程序提供快速的用户体验，增强性能和可扩展性。\n\
  \n## 代码分割与动态导入\n\n本节将简要介绍代码分割（code splitting）和动态导入（dynamic imports），以及它们如何帮助减少初始包体积并提高\
  \ Next.js 的性能。\n\n代码分割和动态导入是用于将 JavaScript 包拆分为更小、更易维护的区块（chunks）的技术。通过按需加载代码，你可以减少初始包体积并提高性能，特别是对于大型应用程序。*第\
  \ 6 章，Next.js 中的路由*将深入探讨这些概念，并提供操作示例。\n\n代码分割涉及根据入口点或代码依赖将你的代码库拆分为更小的部分或区块。这允许你在需要时加载所需的代码，而不是在构建时全部加载。结果是初始包体积更小，可以显著缩短用户查看和与应用程序交互的时间。\n\
  \n以下是在 Next.js 应用程序中使用代码分割和动态导入的示例：\n\n```javascript\nimport React, { useState,\
  \ useEffect } from ‘react’;\n\nfunction HomePage() {\n  const [data, setData] =\
  \ useState(null);\n  useEffect(() => {\n    import('./api').then((module) => {\n\
  \      module.getData().then((response) => {\n        setData(response);\n     \
  \ });\n    });\n  }, []);\n\n  return (\n    <div>\n      <h1>Welcome to Next.js!</h1>\n\
  \      <p>{data}</p>\n    </div>\n  );\n}\n\nexport default HomePage;\n```\n\n在前面的代码段中，`HomePage`\
  \ 组件使用动态导入异步加载名为 `api` 的外部模块。`api` 模块包含一个获取某些数据的 `getData()` 函数。当组件挂载时，`useEffect`\
  \ 钩子会触发动态导入，一旦模块加载，它将使用 `getData()` 获取数据并更新状态。\n\n通过动态导入 `api` 模块，你可以确保它只在渲染 `HomePage`\
  \ 组件时被加载，从而减小初始包体积。如果 `api` 模块仅用于应用程序的特定部分而不是每个页面都需要，这将将特别有利。\n\n通过在整个应用程序中策略地应用代码分割和动态导入，你可以优化\
  \ Next.js 应用程序的加载和性能。这种技术有助于减少初始包体积，提高交互时间并提供更流畅的用户体验。\n\n## 缓存与优化数据获取\n\n缓存在提高\
  \ Next.js 应用程序的数据获取性能方面起着至关的作用。通过缓存数据，你可以减少对外部 API 或数据库的请求，从而获得更快的响应时间和更好的用户体验。\n\
  \nNext.js 提供了你可以利用的几种缓存机制：\n\n- **客户端缓存：** Next.js 通过使用 SWR (Stale-While-Revalidate)\
  \ 或 React Query 等库支持客户端缓存。这些库处理数据的缓存、重新验证和同步，允许你跨应用程序缓存数据。\n\n  使用 SWR 的示例：\n\n\
  \  ```javascript\n  import useSWR from 'swr';\n\n  function UserProfile() {\n  \
  \  const { data, error } = useSWR('/api/user', fetcher);\n    if (error) return\
  \ <div>Error loading user</div>;\n    if (!data) return <div>Loading…</div>;\n \
  \   return (\n      <div>\n        <h1>Welcome, {data.name}!</h1>\n        <p>Email:\
  \ {data.email}</p>\n      </div>\n    );\n  }\n  ```\n\n- **服务端缓存：** Next.js 通过\
  \ `getServerSideProps` 和 `getStaticProps` 函数提供内置的服务端缓存。通过在这些函数中指定缓存配置，你可以缓存特定时间的服务端渲染页面或静态数据。这减少了服务器的负载并缩短了响应时间。\n\
  \n  使用 `getServerSideProps` 的示例：\n\n  ```javascript\n  export async function getServerSideProps(context)\
  \ {\n    const data = await fetchUserFromAPI();\n    return {\n      props: {\n\
  \        data,\n      },\n      revalidate: 60, // 缓存 60 秒\n    };\n  }\n  ```\n\
  \n\n\n\n\n- **代码分割 (Code splitting)**：Next.js 支持自动代码分割，每个页面都会单独打包。这确保每个页面只加载必要的代码，从而减小包体积。你也可以像上一个主题提到的那样，通过使用动态导入手动配置代码分割。\n\
  - **树摇 (Tree shaking)**：树摇是在构建过程中从包中移除未用代码的过程。Next.js 利用了 `webpack` 等工具自动为你的应用程序执行树摇。请确保编写模块化代码并使用\
  \ ES 以优化树摇效果。\n- **混化 (Minification)**：混化是从代码中移除空格和注释等不必要字符的过程。Next.js 在生产构建中默认执行混化，从而获得更小的包体积。\n\
  - **优化依赖项**：分析并优化应用程序使用的依赖项。考虑使用更小的替代库或优化现有依赖项的配置以减小包体积。\n- **部署策略与最佳实践**：高效部署 Next.js\
  \ 应用对于确保其可用性、扩展性和性能至关重要。以下是一些部署策略和最佳实践：\n- **无服务器部署 (Serverless deployments)**：Next.js\
  \ 应用非常适合无服务器部署，你可以将应用部署到 `Vercel`、`AWS Lambda` 或 `Netlify` 等无服务器平台。无服务器部署提供了自动扩展、降低基础设施成本和简化的部署工作流。\n\
  - **持续集成与部署 (CI/CD)**：实现 CI/CD 流水线以自动化部署过程。可以使用 `GitHub Actions` 或 `Jenkins` 等工具在每次向仓库推送更改时构建并部署你的\
  \ Next.js 应用。\n- **性能监控**：使用 `Lighthouse`、`New Relic` 或 `Google Analytics` 等工具监控已部署应用的性能。这有助于识别性能瓶颈并优化应用程序以获得更好的用户体验。\n\
  - **安全性考虑**：实施安全最佳实践，如 `HTTPS`、安全的 API 集成和适当的访问控制，以保护你的 Next.js 应用及其数据。\n- **扩展性与负载均衡**：通过负载均衡器和自动扩展机制配置部署环境以实现水平扩展。这确保你的\
  \ Next.js 应用能够处理增加的流量而不会性能下降。\n\n通过遵循这些部署策略和最佳实践，你可以确保你的 Next.js 应用得到高效部署并保持最佳性能。\n\
