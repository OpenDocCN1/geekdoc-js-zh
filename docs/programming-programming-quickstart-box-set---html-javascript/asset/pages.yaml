  md: '# The xml:lang Attribute is used as a replacement for the original lang attribute
    used in earlier versions of HTML. As mentioned above, the xml:lang attribute value
    should be an ISO-639 country code.


    # Generic Attributes


    There are a few other attributes that can be readily used with most of the HTML
    tags. The list of those attributes is given in the table below.


    | Attribute | Options | Function |

    |---|---|---|n| align | right, left, center | Horizontally aligns tags |

    | valign | top, middle, bottom | Vertically aligns tags within an HTML element.
    |

    | bgcolor | numeric, hexadecimal, RGB values | Places a background color behind
    element |

    | background | URL | Places a background image behind element |

    | id | User Defined | Names an element for use with Cascading Style Sheets. |

    | class | User Defined | Classifies an element for use with Cascading Style Sheets.
    |

    | width | Numeric Value | Specifies the width of tables, images, or table cells.
    |

    | height | Numeric Value | Specifies the height of tables, images, or table cells.
    |

    | title | User Defined | "Pop-up" title of the elements. |'
