  md: 'You can specify the text flow direction to the browser using the dir attribute.
    This attribute can take two values, as shown in the table given below.


    | Value | Meaning |

    | ltr | Left to right (this will be the default value) |

    | rtl | Right to left (for languages such as Hebrew or Arabic that are read right
    to left) |


    Example


    ```

    <!DOCTYPE html>

    <html dir="rtl">

    <head>

    <title>Display Directions</title>

    </head>

    <body>

    This is IE 5 renders right-to-left directed text.

    </body>

    </html>

    ```


    The above code will produce the following output:


    This is IE 5 renders right-to-left directed text.


    If the dir attribute is placed inside the <html> tag, it will determine how the
    text of the entire document will be presented. If this attribute is used inside
    another tag, it will just to control the direction of the text contained in that
    specific tag.


    # The lang Attribute


    You can indicate the main language that is to be used in your document using the
    lang attribute. The only reason for keeping this attribute in HTML is for the
    backwards compatibility with previous versions of HTML. In the new XML documents,
    this attribute is replaced with the xml:lang attribute.


    The lang attributes have the values as ISO 639 2-character language codes. You
    can check the complete list of language codes with the [HTML Language Codes: ISO
    639].


    Example


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <title>English Language Page</title>

    </head>

    <body>

    This page is using English Language

    </body>

    </html>

    ```'
  merge: -1
  pgno: 19
