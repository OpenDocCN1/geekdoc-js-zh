  md: '| tty | be displayed on and is an optional attribute. |

    | tv | The default value is All |

    | projection | |

    | handheld | |

    | print | |

    | braille | |

    | aural | |

    | all | |


    As an example, consider a style sheet called mystyle.css with these rules:


    ```

    h1, h2, h3 {


    color: #36C;


    font-weight: normal;

    letter-spacing: .4em;


    margin-bottom: 1em;


    text-transform: lowercase;


    }

    ```


    Now, using the following code, you can add this file to any HTML document:


    ```

    <head>


    <link type="text/css" href="mystyle.css" media="all" />

    </head>

    ```


    # Imported CSS - @import Rule


    The @import rule is used to import external stylesheets in a similar way to the
    <link> element. The generic syntax is:


    ```

    <head>


    @import "URL";

    </head>

    ```


    In this syntax, URL is used as the URL of the specific styles that contains the
    style rules. Another way of writing it would be:


    ```

    <head>


    @import url("URL");

    </head>

    ```


    The following example shows you how to import the style sheet to the HTML document:


    ```

    <head>


    @import "mystyle.css";

    </head>

    ```


    # Overriding CSS Rules'
