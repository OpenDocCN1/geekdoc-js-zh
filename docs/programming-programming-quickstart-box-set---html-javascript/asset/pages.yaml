  md: '# Chapter 2: JavaScript - Specifications and Features


    As described above JavaScript is a lightweight, interpreted programming language,
    which is now being used in creating network specific applications. JavaScript
    is also complementary and integrated with Java which is very easy to implement
    when embedded along with HTML and CSS. It is an open and cross platform programming
    language.


    Now let us explore the various specifications of JavaScript before getting to
    the syntax. First and foremost you need to understand the basic functionality
    of JavaScript before you go on designing a web page and applications.


    # Client-side JavaScript


    One of the most popular forms of programming versions is the Client-side JavaScript,
    that is, the script that needs to be included in or referenced by a HTML document
    for the programming to be interpreted by the user.


    This means that the web page need not be a static webpage written with static
    HTML but can include various programs and functions to interact with the user
    and dynamically create HTML content by controlling the browser.


    This client-side mechanism exhibits many advantages over the usual CGI server-side
    scripts. For example, the programmer can use JavaScript to check if the user has
    entered the right user ID in the form field in a web page.


    The JavaScript code ensures that the entries listed by the user are valid or not
    and then proceed to execute commands to submit the form to the web browser. It
    can also be used to trap initiated events such as the link navigation, button
    clicks and other actions that are either implicitly or explicitly initiated by
    the user.


    # Advantages of JavaScript


    The following lists the merits of JavaScript while designing a webpage:


    +   - Less server interaction – That is the user input can be validated before
    sending the page off the server which helps lessen server traffic. This means
    that you are offering less load on the server prevents congestion.

    - Immediate response to the users – JavaScript does not wait for a page to reload
    to notify the user of anything they have forgotten or missed.

    - Increase in interactivity – There are more options for you to create interfaces
    using which the webpage can interact with the user, like when the user hovers
    over a marquee with the mouse or activates it by the keyboard.

    - Rich interfaces – JavaScript is used to include various items such as the drag
    and drop components and sliders to provide a better interface experience for your
    web users.


    # Limitations of using JavaScript


    JavaScript cannot be treated as a full-fledged programming language due to the
    demerits and the features it lacks listed below:


    +   - The most important version of JavaScript, the client-side JavaScript does
    not allow the reading and writing of the files due to security purposes.

    - There is no support available for JavaScript to be used in networking applications.

    - JavaScript also lacks any multiprocessor or multithreading capabilities.


    # JavaScript Development Tools


    One of the major advantages of using JavaScript is that it does not require any
    expensive tools and to run. JavaScript can be executed using simple text editors
    such as Notepad. It does not even require a compiler since it is an interpreted
    language used inside the context of the web browser.'
