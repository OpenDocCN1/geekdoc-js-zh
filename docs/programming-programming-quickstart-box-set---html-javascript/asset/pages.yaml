    ```


    The above code will produce the following output if you''re using IE:


    This is Internet Explorer.


    The above code will produce the following output if you''re using a different
    browser other than IE:


    This is not Internet Explorer.


    # Commenting Script Code


    In cases where you are using VScript or JavaScript with your HTML code, it is
    wise to place the script code inside proper comments. This will make sure that
