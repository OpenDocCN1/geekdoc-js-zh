  md: '# Chapter: JavaScript – Syntax


    Syntax of JavaScript is the written text that will allow you to give instructions
    to the web browsers that will follow the guideline in order to perform various
    operations. JavaScript statements are usually placed within the `<script&gt; ...
    &lt;/script&gt;` HTML tags in a web page. There is also an option to place your
    JavaScript code anywhere within your webpage in the `<script&gt;` tags but it
    is normally recommended that you keep it within the `<lt;head&gt;` tags.


    The `<lt;script&gt;` tags always alerts the browser program to read and interpret
    each and every line between as a script. A simple JavaScript syntax will look
    like this:


    ```

    &lt;script&gt;

    ```


    ```

    JavaScript code

    ```


    ```

    &lt;/script&gt;

    ```


    There are two important attributes of script tag –


    +   - Type – This attribute is usually what is recommended to indicate the scripting
    language that is used in the web site and its values used usually be set to "text/javascript"

    - Language – This attribute specifies the kind of scripting language used in the
    web design. Its value is usually "javascript", even though the recent versions
    of HTML (and its successor XHTML) have phased out the use of this attribute.


    And so your JavaScript code will look something like this:


    ```

    &lt;script language="javascript&gt; type="text/javascript&gt;

    ```


    ```

    JavaScript code

    ```


    ```

    &lt;/script&gt;

    ```


    # How to write your very own JavaScript Program?


    The most famous test for any programming language is the printing of “Hello World”
    in the output screen. Let us dig in further on how we can execute that. In this
    program we will be adding an optional HTML comment that is surrounded by our JavaScript
    code. Next, we have to conjure a function document.which we embed a string into
    the HTML document.


    This function is generally used to write HTML, text or both. The Following is
    the example program to print “Hello World”.


    ```

    &lt;html&gt;

    &lt;body&gt;

    &lt;script language="javascript&gt; type="text/javascript&gt;

    &lt;--

    document.write("Hello World!");

    //--&gt;

    &lt;/script&gt;

    &lt;/body&gt;

    &lt;/html&gt;

    ```'
