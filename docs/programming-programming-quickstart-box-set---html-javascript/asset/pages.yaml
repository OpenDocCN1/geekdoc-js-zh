  md: "So, we have looked at four different ways to include a style sheet in an HTML\
    \ document. Now we look at how to override any of the style sheet rules:\n\n+\
    \   - An inline style sheet will take the top priority, including any rule that\
    \ is defined in an external or <style> ... <style></style> tags\n- Any <style>\
    \ ... </style> tag will override an external style file\n- External style sheet\
    \ will have the lowest priority and will only be applied if the inline style or\
    \ <style> tags do not apply\n\n# How to Handle an Older Browser\n\nThere are quite\
    \ a few of the older browsers that don't provide support for CSS, so when you\
    \ are writing your Embedded CSS in HTML documents, please take care. The following\
    \ example show how to use comment tags as a way of hiding CSS from an older browser:\n\
    \n```\n<style type=\"text/css\">\n<!--\nbody, td {\n  color: blue;\n}\n-->\n</style>\n\
    ```\n\n# CSS Comments\n\nSometimes you will need to add extra comments in your\
    \ style sheet blocks but it is very easy to comment on any part of a style sheet.\
    \ All you do is put your comments within /**.... */ this is a comment in a style\
    \ sheet.... */.\n\nYou can also use /**.... */ to comment on multi-line blocks\
    \ in the same way that you would in C or C++ languages. \n\nFor example:\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n<style>\npp {\n  color: red;\n  /* a single-line\
    \ comment */\n  text-align: center;\n}\n/* a multi-line comment */\n</style>\n\
    ```"
