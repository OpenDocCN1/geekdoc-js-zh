- img_proc: true
  md: '# HTML Colors - RGB Values


    The color value can be specified with the rgb() property. This takes 3 values
    as the input for the colors red, green and blue, respectively. The range of each
    color varies from integer values 0 to 255 or as a percentage.


    The list of the RGB values for few colors is given below.


    | Color | Color RGB |

    | --- | --- |

    | | rgb(0,0,0) |

    | | rgb(255,0,0) |

    | | rgb(0,255,0) |

    | | rgb(0,0,255) |

    | | rgb(255,255,0) |

    | | rgb(0,255,255) |

    | | rgb(255,0,255) |

    | | rgb(192,192,192) |

    | | rgb(255,255,255) |",n|| | |


    Example


    Here are the examples to set background of an HTML tag by color code using rgb()
    values:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Colors by RGB code</title>

    </head>

    <body text="rgb(0,0,255)" bgcolor="rgb(0,255,255)">

    <p>Use different color code for body and table and see the result.</p>

    <table bgcolor="rgb(0,0,0)">

    <tr>

    <td>

    <font color="rgb(255,255,255)">This text will appear white on black background.</font>

    </td>

    </tr>

    </table>

    </body>

    ```'
