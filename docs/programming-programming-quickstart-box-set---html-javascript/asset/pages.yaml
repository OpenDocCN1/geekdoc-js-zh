    The final property is to set up the opacity of the image and is used with Mozilla
    Firefox. For Internet Explorer, we use **filter:alpha(opacity:x)**, to come up
    with transparent images.


    In Mozilla Firefox, in the property (**moz-opacity:x**), x may hold a value of
    anywhere between 0.0 and 1.0. The lower value, the more transparent the image.
