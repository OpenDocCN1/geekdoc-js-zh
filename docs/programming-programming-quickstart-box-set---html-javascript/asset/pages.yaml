  md: '# Conclusion


    Thank you for purchasing my book, I hope that you found it helpful. As you have
    seen, CSS is a amazing tool for anyone who wants to get into the world of web
    design. Although it is one of the easiest to understand and learn, I won''t promise
    that you can learn it overnight. Like any computer language, it takes time and
    it takes patience.


    You need to be dedicated to learning it and and, once you have, you must be prepared
    to keep up with all the latest developments. CSS isn''t a program you can learn,
    forget about and pick up again a few months later. While you will still have the
    basics in your mind, in those few months, much may have happened and many changes
    may have been made. It is vital that you keep up with the changes and that you
    use CSS on a daily basis to ensure that you do not lose any of your newfound skills.


    CSS is a program that you can learn, that you understand and that you live. Please
    may I ask a small favor of you - will you leave a review for me at Amazon.com?
    It isn''t only helpful to me; it is helpful to others who may decide to purchase
    my book.


    As stated earlier, this is to reiterate that some of the example code that I have
    used in this book is attributed to www.tutorialspoint.com'
