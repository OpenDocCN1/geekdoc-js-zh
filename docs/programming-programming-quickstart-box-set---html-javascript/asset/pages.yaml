  md: 'This example shows how to set up the font size of the element. This is used
    as a way of controlling the font size and has possible values of - small, x-small,
    xx-small, xx-large, x-large, large, smaller, larger, %, or size in pixels:


    ```

    <html><head></head><body><p style="font-size:20px">The font size is 20 pixels</p><p
    style="font-size:small">The font size is small</p><p style="font-size:large">The
    font size is large</p></body></html>

    ```


