  md: '# 5: Meta Tags


    In HTML, you are allowed to specifying metadata, which is the additional important
    information regarding the document, in different ways. You can use the META elements
    for naming/value pairs for describing the properties of the document, such as
    content, author, expiry date, the list of keywords, etc.


    Such additional information can be provided using the <meta> tag. There are no
    closing tags for the Meta tag and hence it is an empty element. Though it is an
    empty element, the information can be passed through its attributes.


    In general, you can add more than one meta tags to your document, basing on the
    information that you are adding to your document. The physical appearance of your
    document will not have any effect because of meta tags. From the application point
    of view, it doesn''t matter if meta tags are included or not.


    # Adding Meta Tags to Your Documents


    You can provide a Meta data to your pages by adding <meta> tags within The document’s
    header, represented by the tags <head> and </head>. In addition to their core
    attributes, they can have the following attributes:


    | Attribute | Description |

    | --- | --- |

    | Name | Name for the property. It can be anything. Examples include, keywords,
    description, author, revised, generator etc. |

    | content | Specifies the property''s value. |

    | scheme | Specifies a scheme to interpret the property’s value (as declared in
    the content attribute). |

    | http-equiv | Used for http response message headers. For example http-equiv
    can be used to refresh the page or to set a cookie. Values include content-type,
    expires, refresh and set-cookie. |


    # Specifying Keywords


    Important keywords that are related to the document can be specified using <meta>
    tag. These keywords will be later used by various search engines. They will also
    be used for indexing your page for search. Here is an example.


    Example


    In the below example, we will add the words Ducati, Aprilia and BMW as the important
    keywords related to the document.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Meta Tags Example</title>

    <meta name="keywords" content="Ducati, Aprilia, BMW" />

    </head>

    <body>

    ```'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'The above code will produce the following output:


    Hello World!


    # Document Description


    You can provide a short description of your document by using <meta> tags. Similar
    to keywords, the subscription will also be used by search engines while indexing
    the web page for searching purposes. Here is an example.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Meta Tags</title>

    <meta name="keywords" content="Ducati, Aprilia, BMW" />

    <meta name="description" content="Learning about Meta Tags." />

    </head>

    <body>

    <p>Hello World!</p>

    </body>

    </html>

    ```


    # Document Revision Date


    The <meta> tag can be used for providing information regarding the last updation
    of the document. Various web browsers use this information while refreshing your
    web page. Here is an example.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Meta Tags Example</title>

    <meta name="keywords" content="Ducati, Aprilia, BMW" />

    <meta name="description" content="Learning about Meta Tags." />

    <meta name="revised" content="Topgear, 7/7/15" />

    </head>

    <body>

    <p>Hello HTML5!</p>

    </body>

    </html>

    ```


    # Document Refreshing


    You can use the <meta> tag for specifying the duration on when to auto refresh
    your page. Here is an example.


    Example'
