  md: '# Chapter 4: Measurement Units


    CSS supports several different measurements including relative measures, like
    percentages, and absolute unit, like centimeters, inches, points, etc. These values
    are required when you specify measurements in the Style rules, for example, e.g.
    border ="1px solid red".


    The following table lists the CSS measurement units together with examples:


    | Unit | Description | Example |

    |---|---|---||

    | % | This defines the measurement as a percentage relative to other values. A
    typical one would be an enclosing element. | p {font-size:16pt;line-height:125%;}
    |

    | cm | This defines measurements in centimeters | div {margin-bottom:2cm;} |

    | em | This is a relative measurement for font height in em spaces. An em unit
    is the equivalent of the size of any given font, and because of, if you were to
    assign 12 pt to a font, each of the em units would be 12 pt. This means that 2em
    would equal 24 pt. | p (letter-spacing:7em;) |

    | ex | This defines the measurement that is relative to the x-height of the font.
    We determine the x-height by the height of the lowercase x in the specified font
    | p {font-size:24pt;line-height:3ex;} |

    | in | This defines the measurement in inches | p {word-spacing:.15in;} |

    | mm | This defines the measurement in millimeters | p {word-spacing:15mm;} |

    | pc | This defines the measurement in picas, which is equivalent to 12 points.
    This means that there are 6 picas to an inch. | p {font-size:20pc;} |

    | pt | This defines the measurement in points, which is defined as 1/72 of an
    inch | body {font-size:18pt;} |

    | px | Defines the measurement in screen pixels. | p {padding:25px;} |

    | vh | This is 1% of the viewport height. | h2 {font-size:3.0vh;} |'
