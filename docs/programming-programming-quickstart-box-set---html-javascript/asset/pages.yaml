  md: 'The power of an id selector become known when they are used as foundations
    for the descendant selector:


    # #black h2 {


    ```

    color: #000000;

    }

    ```


    Here, you can see that all of the level 2 headings will be turned to black only
    when they lie inside a tag that has the id attribute set as black


    # Child Selectors


    The child selector is similar to the descendant selector but with different functionality.
    Look at this example:


    ```

    body > p {

    color: #000000;

    }

    ```


    This will turn the paragraphs to black only if they are the direct child of the
    <body> element. Other paragraphs that are inside other elements, like <td> or
    <div> would not change.


    # Attribute Selectors


    Styles can also be applied to HTML element that have specific attributes. Look
    at the example below; you can see that the style rule is going to match all the
    input elements that have a type attribute with a text value:


    ```

    input [type = "text"]{

    color: #000000;

    }

    ```


    The advantage to using this method is that <input type = "submit" /> is not affected
    and the color change only applied to certain text fields.


    The following rules are for the attribute selector:


    +   * p[lang] - this selects all of the paragraph elements that have a lang attribute

    * p[lang="fr"] - this selects all the paragraph elements with lang attributes
    that have an exact value of "fr"

    * p[lang^="fr"] - this selects all the paragraph elements that have a lang attribute
    containing "fr"

    * p[lang~="en"] - this selects all the paragraph elements with a lang attribute
    containing exact values of "en" or that start with "en".


    # Multiple Style Rules


    Multiple style rules can be defined for one single element and should be defined
    to combine a number of properties and their corresponding value into one block,
    as in this example:


    # h1 {


    ```

    color: #36C;

    font-weight: normal;

    ```'
