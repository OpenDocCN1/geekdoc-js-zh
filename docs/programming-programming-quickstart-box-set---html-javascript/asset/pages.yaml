  md: '# Chapter 7: Fonts


    Now we are going to look at how to set up the fonts. The following are the font
    properties that you can set

    for an element:


    +   - font-family - is used to change the font face

    - font-style - is used to turn a font oblique or italic

    - font-weight - is used to increase or decrease the boldness or lightness of a
    font

    - font-variant - is used to give the font a small caps effect

    - font-size - is used to make a font bigger or smaller

    - font - shorthand for specifying various font properties


    # How to Set the Font Family


    The following example shows how to set the font family of a specific element.
    The value can be any font

    family name:


    ```

    <html>

    <head>

    </head>

    <body>

    <p style="font-family:georgia,garamond,serif;

    This text will be rendered in georgia, garamond, or the default serif font

    depending on which ones are in your system.

    </p>

    </body>

    </html>

    ```


    It will produce the following result –

    This text will be rendered in georgia, garamond , or the default serif font, depending
    on which ones are in

    your system


    # How to Set the Style Family


    The following example shows how to set the style of an element. Values can be
    italic, normal, oblique, etc.


    ```

    <html>

    <head>

    </head>

    <body>

    <p style="font-style:italic;"

    This text is rendered in italic style

    </p>

    </body>


    ```'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'You will get the following result:


    *This text is rendered in italic style*


    # How to Set the Font Variant


    This example shows how to set the font variant with possible values of small-caps,
    normal, etc.


    ```

    <html>

    <head>

    </head>

    <body>

    <p style="font-variant:small-caps;">

    The text is going to be rendered as small caps

    </p>

    </body>

    </html>

    ```


    You will get the following result:


    THE TEXT IS GOING TO BE RENDERED AS SMALL CAPS


    # How to Set the Font Weight


    The next example shows how we set the font weight of an element. This property
    will specify the bold level of the font and possible values include — normal,
    lighter, bold, 100, 200, 300, 400, 500, 600, 700, 800, 900, etc.


    ```

    <html>

    <head>

    </head>

    <body>

    <p style="font-weight:bold;">The font is bold.</p>

    <p style="font-weight:bolder;">The font is bolder.</p>

    <p style="font-weight:500;">The font is 500 weight.</p>

    </body>

    </html>

    ```


    You will get the following result:


    # The font is bold.


    The font is bolder.


    The font is 500 weight.'
