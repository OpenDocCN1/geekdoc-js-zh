    # JavaScript Variable Scope


    In any programming language you need to understand the scope of a variable. The
    scope is the area or the region of the program in which the variable is valid.
    JavaScript supports only two types of scope –


    +   - Global variable – A global variable is declared in the main body of the
    program or before the main program and its scope is valid from the line it is
    declared and valid throughout the program in your JavaScript code.

    - Local Variables – A local variable is valid only inside a section of the program,
    specifically inside a function or parenthesis. Any reference to that variable
    outside the scope will cause JavaScript to throw errors.


    It is important to note that, inside the body of the function, the global variable
    is given less precedence than a local variable of the same name. If you happen
    to declare a variable or a function name same as a global variable it is recommended
    to hide it out. Take a look at this example –


    ```

    <html>

    <body onload = checkscope();

    <script type="text/javascript">

    <!---

    var myVar = "global"; // Declare a global variable

    function checkscope() {

    var myVar = "local"; // Declare a local variable

    document.write(myVar);

    }

    //-->

    </script>

    ```'
