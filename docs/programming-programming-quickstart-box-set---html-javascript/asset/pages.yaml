  md: '# Chapter 5: Colors


    In CSS we use values to specify colors. Usually these are used when we set the
    color for the text of an element, which is the foreground, or the background of
    the element. We can also use them to change the color of decorative effects, such
    as a border.


    The color values can be specified in several different formats, as displayed in
    the following table:


    | Format | Syntax | Example |

    | --- | --- | --- |

    | Hex Code | #RRGGBB | p(color:#FF0000); |

    | Short Hex Code | #RGB | p(color:#6A7;); |

    | RGB % | rgb(rrr%,ggg%,bbb%) | p(color:rgb(50%,50%,50%)); |

    | RGB Absolute | rgb(rrr,ggg,bbb) | p(color:rgb(0,0,255)); |

    | keyword | aqua, black, etc. | p(color:teal);) |


    Let''s look at these formats in more detail:


    # Hex Codes


    Hexadecimals are 6-digit color representations. The first digit – RR – represent
    red values, GG represent green values and BB represents the blue values.


    The values can be taken from graphics software, such as JASC Paintshop Pro, Adobe
    Photoshop, Advanced Paintbrush, etc. Each of the hexadecimal codes are preceded
    by a # or a £ sign and the following are examples of hexadecimal notations:


    | Color | Color HEX |

    | --- | --- |

    | | #000000 |

    | | #FF0000 |

    | | #00FF00 |

    | | #0000FF |

    | | #FFFF00 |

    | | #00FFFF |

    | | #FF00FF |

    | | #COCCOC |

    | | #FFFFFF |


    # Short Hex Codes


    This is just a shorter version of the hex code, and each digit is replicated so
    that you get the equivalent 6-digit value. These values can also be taken from
    graphics software and are also preceded by the # or £ sign:'
  merge: -1
