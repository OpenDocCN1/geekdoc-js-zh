  md: '# Chapter 2: CSS Modules


    CSS modules take on the existing CSS specifications along with a number of extension
    features, including:


    +   - Selectors

    - Box Model

    - Image Values

    - Backgrounds and borders

    - Replaced content

    - Text effect

    - D and 3D transformations

    - Animations

    - Multiple column layout

    - Use Interface


    CSS is made up of a number of style rules that are interpreted by the browser
    before being applied to the right element of the document. Style rules are split
    into three:


    Selector - this is the HTML tag that the style is applied to. Examples of these
    tags are, <h1> and <table>.


    +   - Property – Properties are types of HTML ta attributes. In simple terms,
    all HTML attributes are changed to CSS properties, for example, color border,

    - Value – Each property is assigned a value or value. For example, the color property
    may have a value of red or perhaps #F2F2F2,


    The syntax for a CSS style rule is:


    ```

    selector { property: value }

    ```


    For example, you could define a border on a table as:


    ```

    table{ border :1px solid #C00; };

    ```


    In this example, the table is a selector and border is a property. It has been
    given a value of 1px solid #C00 Selectors can be defined in a number of ways so
    let''s look at each one:


    # Type Selectors


    You saw an example of the Type selector above but let''s look at another - a way
    of adding a color to all of the level 1 headings:


    # h1 {


    ```

    color: #36CFFFF;

    ```


    ```

    }

    ```


    # Universal Selector


    Instead of selecting the elements that relate to a specific type, this selector
    just matches the names of the element type. For example:


    ```

    {

    ```


    ```

    color: #000000;

    ```


    ```

    }

    ```


    In this example, the content of all the elements has been turned to black'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Descendant Selectors


    Specific lets you to give a particular element a style but only when it is inside
    a specific element. In the following example, we are applying the style rule to
    the <em> element but only when it is outside of the <ul> tag:


    ```

    em {

    color: #000000;

    }

    ```


    # Class Selectors


    Class selectors allow you to use the class attribute of the elements to define
    your style rules. All of the elements of that particular class are formatted as
    per the defined rule:


    ```

    .black {

    color: #000000;

    }

    ```


    In this example, the rule has turned the content of all the elements with the
    class attribute of black to the color black. You could go one step further if
    you like:


    ```

    h1.black {

    color: #000000;

    }

    ```


    Now you have specified that only the content inside the <h1> element with a class
    attribute of black will be turned to black.


    You are not limited to just one class selector for an element though. Look at
    this example:


    ```

    <p class="center bold">

    The style of this paragraph is defined by the classes Bold and Center

    </p>

    ```


    # ID Selectors


    Style rules can be defined on the id attribute of an element and, when a rule
    is defined, it will format all elements with the specified id attribute:


    ```

    #black {

    color: #000000;

    }

    ```


    This rule will turn the content of all elements that has the id attribute to black.
    You can be a bit more specific if you like, for example:


    ```

    h1#black {

    color: #000000;

    }

    ```


    This rule turns the content for <h1> elements to black ONLY if the id attribute
    is set to black.'
