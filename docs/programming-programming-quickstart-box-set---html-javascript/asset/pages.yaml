  md: '# Chapter 9: HTML Colors


    Colors play a very important role in beautifying your web page, making it good
    to look and feel it. On the page level, you can specify the colors using the `<body>`
    tag. You can also use the bgcolor attribute for setting the colors what different
    tags.


    The following attributes are available with the `<body>` tag, with different colors
    can be set.


    +   **vlink** - This will set the color for the links that are visited (links
    clicked once or more)


    +   **link** - The color of the linked text can be set using this.


    +   **alink** - The color for the selected links or active links can be set using
    this.


    +   **text** - The body text color can be set with this.


    +   **bgcolor** - The color of the background can be set with this.


    # *HTML Color Coding Methods*


    There are three different methods in HTML for setting setting colors for the web
    page. They are as follows:


    +   **Color names** - You can directly specify the names of the colors for the
    web like red, blue or green.


    +   **Hex codes** - You can specify the color using a six digit hex code. Every
    color can be represented by the red, blue and green colors present in. The hex
    code is nothing but a representation of this.


    +   **Decimal color or percentage values** - This value will be specified by using
    the rgb( ) property.


    Now we will have a look at these coloring schemes in detail.


    # *HTML Colors - Color Names*


    You can directly specify the name of the color for setting it as the background
    or text color. There are total of 163 basic colors listed by W3C, that validate
    with the HTML validator. Most of the major browsers support support more than
    200 different colors.


    # **W3C Standard 16 Colors**


    The list of 16 standard colors, recommended by W3C is given below.


    | Black | Gray | Silver | White |

    |---|---|---|--|

    | Yellow | Lime | Aqua | Fuchsia |

    | Red | Green | Blue | Purple |

    | Maroon | Olive | Navy | Teal |


    Example


    Here is an example where we said to set the background color using the color name.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Colors by Name</title>

    </head>

    <body text="blue" bgcolor="green">

    <p>Use different colors for body and table and see the result.</p>

    ```'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# HTML Colors - Hex Codes


    The hex code is nothing but the six digit presentation for a color. The first
    two digits of the hex code represent the value of red, the next two digits represent
    the value of green and the last two digits represented value of blue. The hex
    code will be RGGGBB.


    You can take the hexadecimal value from graphics software like MS paint, Paintbrush
    Pro or Adobe Photoshop.


    A hash sign # or pound will precede the hexadecimal code. Given below is a table
    with the colors using hex code.


    | Color | Color HEX |

    |---|---|

    | | #000000 |

    | | #FF0000 |

    | | #00FF00 |

    | | #0000FF |

    | | #FFFF00 |

    | | #00FFFF |

    | | #FF00FF |

    | | #COCOCO |

    | | #FFFFFF |


    Example


    Here are the examples to set background of an HTML tag by color code in hexadecimal:


    ```

    <DOCTYPE html>

    <html>

    <head>

    <title>HTML Colors by Hex</title>

    </head>

    <body text="#0000FF" bgcolor="#00FF00">

    <p>Use different color hex for body and table and see the result.</p>

    <table bgcolor="#000000">

    <tr>

    <td>

    ```'
  merge: -1
