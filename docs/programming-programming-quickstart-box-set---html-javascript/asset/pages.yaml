  md: '# Chapter 4: HTML Phrase Tags


    The phrase tags in HTML are designed for performing specific purposes. They look
    similar to other tags like <i>, <i>, <pre>, and <tt>, which we have already seen
    in our previous chapters. In this chapter we will go through the important phrase
    tags in HTML.


    # Emphasized Text


    Any content that is placed between the <em>em...</em> element will be shown as
    emphasized text. Here is an example.


    Example:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Emphasized Text</title>

    </head>

    <body>

    <p>The following word uses an <em>emphasized</em> typeface.</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    The following word uses an <em>emphasized</em> typeface.


    # Marked Text


    Any content that is placed between the <mark>...</mark> element will be shown
    as marked text, with a yellow link. Here is an example.


    Example:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Marked Text Example</title>

    </head>

    <body>

    <p>The following word has been <mark>marked</mark> with yellow</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    The following word has been <mark>marked</mark> with yellow.


    # Strong Text


    Any content that is placed between the <strong>strong...</strong></strong> element
    will be shown as important text. Here is an example.


    Example:


    ```

    <!DOCTYPE html>

    ```'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'The following word uses a <strong>strong</strong> typeface.


    The above code will produce the following output:


    The following word uses a **strong** typeface.


    # Text Abbreviation


    In HTML, you are allowed to abbreviate your text. You can do it by placing the
    text inside the opening `<abbr>` and closing `</abbr>` tags. The full description
    should be added in the title attribute and nothing else, if present here. Here
    is an example.


    Example


    ```

    ```DOCTYPE html>

    <html>

    <head>

    <title>Text Abbreviation</title>

    </head>

    <body>

    <p>My best friend''s name is <abbr title="Abigail">Abi</abbr>.</p>

    </body>

    </html>```

    ```


    The above code will produce the following output:


    My best friend''s name is Abi.


    # Acronym Element


    You can indicate your text as an acronym in HTML using the `<acronym>` element.
    You should place your text in the opening tag `<acronym>` and closing tag `</acronym>`
    for indicating it as an acronym. Here is an example.


    Example


    ```

    ```DOCTYPE html>

    <html>

    <head>

    <title>Acronym Example</title>

    </head>

    <body>

    <p>This chapter covers marking up text in <acronym>XHTML</acronym>.</p>

    </body>

    </html>```

    ```


    The above code will produce the following output:


    This chapter covers marking up text in XHTML.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Text Direction


    The element <bdo>...</bdo> stands for Bi-Directional Override. You can override
    the text direction using this element. Here is an example.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Text Direction</title>

    </head>

    <body>

    <p>This text goes from left to right.</p>

    <p><bdo dir="rtl">This text goes from right to left.</bdo></p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    This text goes from left to right.


    This text goes from right to left.


    # Special Terms


    You can introduce special terms on your web page for doing it; you can use the
    element <dfn>...</dfn>. This is very much similar to italicized text in the middle
    of a paragraph.


    You would typically use the element <dfn> when you introduce a key term for the
    first time. The recent browsers will render the text of the <dfn> element in and
    italicized format. Here is an example.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Special Terms Example</title>

    </head>

    <body>

    <p>The following word is a <dfn>special</dfn> term.</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    The following word is a special term.


    # Quoting Text


    In HTML, you can quote a passage from a different source. For doing it, you should
    place the content between the opening tag **<blockquote>** and closing tag **</blockquote>.


    Any text placed inside this element will usually be indented from left and right
    edges of the text surrounding it. Sometimes it uses italicized font. Here is an
    example.'
