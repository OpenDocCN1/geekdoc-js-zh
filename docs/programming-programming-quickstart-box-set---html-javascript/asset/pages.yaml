    # Monospaced Font


    Any content placed between the <tt>...</tt> element will be displayed as monospaced
    font. Most of the available fonts are variable width fonts. This is because different
    letters have different widths. For instance the letter w is wider than i. With
    a monospaced font, every letter will have the same width. Here is an example.


    Example


    ```

    <DOCTYPE html>

    <html>

    <head>

    <title>Example for Monospaced Font</title>

    </head>

    <body>

    <p>The following word uses a <tt>monospaced</tt> typeface.</p>

    </body>

    </html>

    ```


