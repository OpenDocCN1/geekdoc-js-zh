    | | #OFF |

    | | #FOF |

    | | #FFF |


    # RGB Values


    We specify this value with the rgb() property, which takes three values – red,
    green and blue. Values are percentages or integers between 0 and 255. Be aware
    that not all browsers offer support for rgb() so try not to use it.


    | Color | Color RGB |

    | --- | --- |

    | | rgb(0,0,0) |

    | | rgb(255,0,0) |

    | | rgb(0,255,0) |

    | | rgb(0,0,255) |

    | | rgb(255,255,0) |

    | | rgb(0,255,255) |

    | | rgb(255,0,255) |

    | | rgb(192,192,192) |

    | | rgb(255,255,255) |


    # Building the Color Codes


    If you use the CSS Color Code Builder, you can build, quite literally, millions
    of different color code but you you will need a browser that is Java-enabled to
    do this.'
