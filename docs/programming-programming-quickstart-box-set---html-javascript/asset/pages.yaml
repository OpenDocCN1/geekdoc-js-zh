    # Line Break Tag


    If you wish to add a line break in between your text, you can use the <br /> element
    and any text following it will start in a new line. Some tags do not need closing
    tags and such tags are empty elements. The <br /> element is such empty element.
    They are called so because no content goes in between them.


    There is a space between br and / characters and if it is not added, older browsers
    will fail to render the line. If the / is not added and just use <br>, it won''t
    work in XHTML, as it is invalid. Here is an example.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Line Break</title>

    </head>

    <body>

    <p>Hey<br />

    How are you doing today?.<br />

    Good Luck<br />

    Peter</p>

    </body>

    </html>

    ```


    This code will produce the following output:


    Hey


    How are you doing today?


    Good Luck


    Peter


