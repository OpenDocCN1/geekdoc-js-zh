  md: '# HTML Unordered Lists


    And Unordered Lists can be defined as a collection of items with no special order.
    You can create this list by using the <ul> tag. All the items in this list will
    be marked using bullets. Here is an example.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Unordered List</title>

    </head>

    <body>

    <ul>

    <li>Apple</li>

    <li>Mango</li>

    <li>Banana</li>

    <li>Pear</li>

    </ul>

    </body>

    </html>

    ```


    The above code will produce the following output:


    +   - Apple

    - Mango

    - Banana

    - Pear


    The type Attribute


    You can actually specify the type of bullet to be used by using the **type** attribute
    of the <ul> tag. The default bullet time is a disc. The other possible options
    are:


    ```

    <ul type="disc">

    <ul type="square">

    <ul type="circle">

    ```


    Example


    Following is an example where we used <ul type="square">


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Unordered List</title>

    </head>

    <body>

    <ul type="square">

    <li>Apple</li>

    <li>Mango</li>

    <li>Banana</li>

    ```'
