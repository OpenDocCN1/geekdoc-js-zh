  md: '# Chapter 4: Enabling and Disabling JavaScript in your Web Browser


    Almost all modern browsers that we use today come with a built support for JavaScript
    that can be enabled or disabled by the users manually. This chapter focuses on
    enabling and disabling the JavaScript settings and support system in your browsers
    such as the Internet Explorer, Google Chrome, Mozilla Firefox and Opera to name
    a few.


    # JavaScript in Internet Explorer:


    The following instructions will guide you to turn on and turn off the JavaScript
    support in your Internet Explorer


    +   - Go to Tools → Select Internet Options from the menu

    - Click on the Security Tab from the dialog box

    - Select the Custom Level button.

    - Scroll down the drop box until you find Scripting Options in the list.

    - After locating the Active Scripting, select the Enable radio button.

    - Finally click on the okay button and exit the window.


    In order to disable the JavaScript support in your Internet Explorer settings,
    all you need to do is follow the same set of instructions except selecting Disable
    radio button under Active Scripting.


    # JavaScript in Mozilla Firefox


    The following instructions will guide you to turn on and turn off the JavaScript
    support in your Mozilla Firefox


    +   - Open a Mozilla Firefox tab and type about:config in the address bar of the
    page.

    - After which a warning dialog will open and you need to select ‘I’ll be careful,
    I promise!’

    - You will find a list of all the configure options in the browser in a drop box.

    - Type javascript.enabled in the search bar of the web browser.

    - Here you will find an option to enable and disable JavaScript by right clicking
    on the option → then select toggle


    # JavaScript in Google Chrome


    The following instructions will guide you to turn on and turn off the JavaScript
    support in your Google Chrome


    +   - Select the Chrome menu which is located at the top right hand corner of
    your web browser.

    - Click on the settings option

    - Select Show Advanced Settings which is located at the end of the page.

    - Click on the content settings button which is located right below the Privacy
    Section.

    - You will need to select “Do not allow any site to run JavaScript” in order to
    disable JavaScript settings or select “Allow all sites to run JavaScript (recommended)”


    # JavaScript in Opera'
