    # For Loop


    The most compact form of looping is the For loop and it includes the 3 important
    parts which are listed below:


    +   - Loop Initialization where we initialize our counter to a starting value
    and the initialization statement in the loop begins.

    - Test statement is similar to the if condition statement. This is the condition
    that determines when the loop should terminate. This condition is checked after
    each and every iteration.

    - The iteration statement is usually a counter. This keeps the number of repetitions
    in check.


    You have combine all of these three parts in a statement which is separated by
    semi colons.


    # Syntax


    The syntax for the for loop is described below =

    For ( initialization ; test condition; iteration statement )

    { statements that need to be executed whenever the test condition is true }


