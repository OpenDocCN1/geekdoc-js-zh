  md: '# Chapter 7: HTML Images


    Images can be very helpful to beautify and explain the complex concepts of your
    web page in a simple way. In this chapter, we will add images to your webpages
    in simple steps.


    # Insert Image


    In HTML, you can add any image to your web page with the `<img>` tag. The syntax
    for the `<img>` tag is given below.


    Syntax:


    ```

    <img src="Image URL" ... attributes-list/>

    ```


    The `<img>` is an empty one, it means that there will be no closing tag for it.
    You can only give the list of attributes to this tag. Here is an example.


    # Example


    For trying the below example, you will need to keep the .htm file and the image
    within the same directory.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Using Image in Webpage</title>

    </head>

    <body>

    <p>Simple Image Insert</p>

    <img src="/images/test.png" alt="Test Image" />

    </body>

    </html>

    ```


    The above code will produce an output with the image used.


    Simple Image Insert


    HTML supports formats like JPEG, PNG or GIF. You can use any of these image formats
    basing on your comfort. You should always ensure that you specify the correct
    file name of the image in `src` attribute. Always remember that the image names
    are case sensitive.


    There is a mandatory attribute called the `alt` attribute, which will specify
    an alternate text for the image, in cases where the image fails to be displayed.


    # Set Image Location


    It is recommended that you keep your images in a specific directory separately.
    We will put our .htm file in the home directory and the images in a sub True called
    `images`, within the home directory. Here is an example.


    # Example


    Here, we will assume the image location to be "/html/image/test.png", for this
    example.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    ```'
