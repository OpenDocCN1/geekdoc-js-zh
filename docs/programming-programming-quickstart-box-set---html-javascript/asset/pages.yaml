  md: '# Supscript Text


    You can use the <sup>...</sup> element for adding a superscript on your web page.
    A superscript is nothing but the text with the same font with the same font size
    as the text surrounding it, but it will be displayed half a character''s height
    above the surrounding text. Here is an example.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Superscript Text</title>

    </head>

    <body>

    <p>The following word uses a <sup>superscript</sup> typeface.</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    The following word uses <sup>superscript</sup> typeface.


    # Subscript Text


    You can use the <sub>...</sub> element for adding a subscript on your web page.
    A subscript is nothing but the text with the same font with the same font size
    as the text surrounding it, but it will be displayed half a character''s height
    below the surrounding text. Here is an example.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Subscript Text</title>

    </head>

    <body>

    <p>The following word uses a <sub>subscript</sub> typeface.</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    The following word uses <sub>subscript</sub> typeface.


    # Inserted Text


    Any text that is placed in between the <ins>...</ins> element will be shown as
    inserted text. Here is an example.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    ```'
