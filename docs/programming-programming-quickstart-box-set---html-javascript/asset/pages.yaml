    Conditional comments can be helpful in situations where you will need to use different
    style sheets, depending on the version of IE.


    # Using Comment Tag


    A part of the HTML code can be made as a comment and there are a few browsers
    supporting the <comment> tag. Here is an example.


    Example


    ```

    <!DOCTYPE html><html>

    <head>

    <title>Using Comment Tag</title>

