  md: '# Chapter 2: HTML Elements


    An element in an family will be defined by starting tag. If other content can
    be contained within the element, it will have a closing tag. For the closing tag,
    the name of the element will be preceded with a / .. Some of each elements are
    given below.


    | Start Tag | Content | End Tag |

    | --- | --- | --- |

    | <i> | This is italic font content | </tr> |

    | <marquee> | This is marquee text content. | </marquee> |

    | <p> | This is paragraph content. | </p> |

    | <br /> | | |


    Here, <i> and </img> is an element, <marquee> and </marquee> is another element.
    There are a few HTML elements that doesn''t need closing tags, such as <br />,
    <hr>, <img>, etc. The HTML elements which doesn''t require closing tags are called
    as **void elements.**


    The HTML document has a tree for these elements and this tree specifies on how
    the documents of HTML should be built. It also specifies the type of content that
    is to be placed in what part of the document.


    # **HTML vs. Element**


    An element of HTML will be defined using a starting tag. If other content is placed
    inside it, it will have a closing tag.


    For instance, <i> is the starting tag for italic text and </img> is the closing
    tag for it. But, <i>This text is italic</i> is a italic text element.


    # **Nested Elements in HTML**


    HTML allows you to nest HTML elements within other HTML elements. Here is an example:


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Nested Elements</title>

    </head>

    <body>

    <h2>This is a <b>bold</b> heading</h2>

    <p>This is is <i>italic</i> text</p>

    </body>

    </html>

    ```


    The above code will produce the following output'
  merge: -1
