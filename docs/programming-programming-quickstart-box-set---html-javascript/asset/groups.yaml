    ## 第7章：分支语句与循环\n\n在 JavaScript 中执行各种算法时，有时你需要重复执行某条语句或操作，或者采用某些路径。在这种情况下，你需要分支语句来帮助检查特定条件。JavaScript\
    \ 支持在执行相关操作之前检查特定条件的条件语句。主要的分支语句之一是 If ... Else 语句。\n\n## If-Else 语句\n\nIf-Else\
