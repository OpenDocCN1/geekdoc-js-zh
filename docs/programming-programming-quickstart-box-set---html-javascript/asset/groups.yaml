    # Descendant Selectors


    Specific lets you to give a particular element a style but only when it is inside
    a specific element. In the following example, we are applying the style rule to
    the <em> element but only when it is outside of the <ul> tag:


    ```

    em {

    color: #000000;

    }

    ```


    # Class Selectors


    Class selectors allow you to use the class attribute of the elements to define
    your style rules. All of the elements of that particular class are formatted as
    per the defined rule:


    ```

    .black {

    color: #000000;

    }

    ```


    In this example, the rule has turned the content of all the elements with the
    class attribute of black to the color black. You could go one step further if
    you like:


    ```

    h1.black {

    color: #000000;

    }

    ```


    Now you have specified that only the content inside the <h1> element with a class
    attribute of black will be turned to black.


    You are not limited to just one class selector for an element though. Look at
    this example:


    ```

    <p class="center bold">

    The style of this paragraph is defined by the classes Bold and Center

    </p>

    ```


    # ID Selectors


    Style rules can be defined on the id attribute of an element and, when a rule
    is defined, it will format all elements with the specified id attribute:


    ```

    #black {

    color: #000000;

    }

    ```


    This rule will turn the content of all elements that has the id attribute to black.
    You can be a bit more specific if you like, for example:


    ```

    h1#black {

    color: #000000;

    }

    ```


    This rule turns the content for <h1> elements to black ONLY if the id attribute
    is set to black.'
