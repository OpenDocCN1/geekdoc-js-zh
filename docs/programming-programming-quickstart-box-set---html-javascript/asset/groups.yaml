    The above code will produce the following output:


    <-- This comment is not a valid one -->


    The content of the document goes here.....


    # Multiline Comments


    So far, we have only discussed single line comments. However, HTML also supports
    the multi-line comments.


    You can increase the code readability by adding comments in multiple lines by
    using a special beginning and ending tags <!-- --> that are placed in front of
    the first line and after the last line as given in the example shown below.


    Example


    ```

    <!DOCTYPE html>

    <head>

    <title>Multiline Comments</title>

    </head>

    <body>

    <!--

    This is an example of multiline comment and

    it can be extended to any number of

    lines you like.\n-->

    <p>The content of the document goes here.....</p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    The content of the document goes here.....


    # Conditional Comments


    The conditional comments do not work on any other browser than Internet Explorer.
    All other browsers ignore conditional comments. The support for conditional comments
    started from Internet Explorer 5. They can be used for giving conditional instructions
    for different Internet Explorer versions. Here is an example.


    Example'
  - '[PAGE 50]


    <!DOCTYPE html><html>

    <head>

    <title>Example for Conditional Comments</title>


    <!--if IE 6]

    Special instructions for IE 6

    <![endif]-->


    </head>

    <body>

    <p>The content of the document goes here.....</p>

    </body>

    </html>


    Conditional comments can be helpful in situations where you will need to use different
    style sheets, depending on the version of IE.


    # Using Comment Tag


    A part of the HTML code can be made as a comment and there are a few browsers
    supporting the <comment> tag. Here is an example.


    Example


    ```

    <!DOCTYPE html><html>

    <head>

    <title>Using Comment Tag</title>

    </head>

    <body>

    <p>This is a <comment>not</comment> Internet Explorer.</p>

    </body>

    </html>

    ```


    The above code will produce the following output if you''re using IE:


    This is Internet Explorer.


    The above code will produce the following output if you''re using a different
    browser other than IE:


    This is not Internet Explorer.


    # Commenting Script Code


    In cases where you are using VScript or JavaScript with your HTML code, it is
    wise to place the script code inside proper comments. This will make sure that
    they can be used with older browsers. Here is an example.


    Example


    ```

    <!DOCTYPE html><html>

    <head>

    <title>Commenting Script Code</title>

    <script>

    <!---

    document.write("Hakuna Matata!")

    ```'
