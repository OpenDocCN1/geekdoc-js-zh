    ## JavaScript：JavaScript编程简介


    JavaScript 是一种高级的、无类型的、动态的解释型 JavaScript 语言，它在 ECMAScript 规范中标准化。JavaScript 与
    HTML（超文本标记语言）和 CSS（层叠样式表）一起是支持世界维网内容生产的三种编程语言之一。绝大多数互联网构成都使用了 JavaScript，而且几乎所有现代网络浏览器都通过插件或其他外部软件支持它，以与系统或浏览器兼容。它是基于原型的编程语言之一，包含许多世界级的特性，可以与其他多范式语言并驾齐驱，并支持面向对象（输出实时对象）、函数式和命令式编程风格。


    JavaScript 还支持编程接口（或 API），支持诸如文本、数据、字符、矩阵、正则表达式等各种功能。其局限性在于它不支持任何输入/输出（I/O），包括网络、图形设施甚至存储，而是依赖宿主环境提供的这些功能，因为这些功能是嵌入在环境中的。


    尽管臭名昭的的误仍然存在，但 Java 和 JavaScript 除了标准库和语法库之外完全没有关系，它们的语义也非常不同。虽然 JavaScript 的语法基于
    C 语言是事实，但其语义和设计源于并受到 Self 和 Scheme 编程语言的影响。


    JavaScript 以在编译和合成运行程序所需的软件方面的通用性而闻名，它也可以在非 Web 的环境中执行，如记事本、PDF 文档、桌面小组件甚至网站应用程序。早些，JavaScript
    传统上仅在客户端作为解释语言实现，但在较新版本的浏览器中已演变为即时编译（just-in-time compilation）。最新且更快的 JavaScript
    版本包含了虚拟机（VM），许多平台构建在其之上。这涵盖了 JavaScript 开发、使用 Node.js 等运行时环境进行服务器端网络编程，甚至是桌面和移动应用的创建。


    ## JavaScript 在 Netscape 的起源


    Brendan Eich 是 JavaScript 的创造者，他当时任职于 Netscape Communications 公司，并于 1995 年完成了这一设计的开发。它最初被名为
    Mocha，后重命名为 LiveScript，最后在与 Sun Microsystems 达成营销协议后改为 JavaScript。虽然 JavaScript
    的语法基于 C 语言是事实，但其语义和设计源于并受到 Self 和 Scheme 编程语言的影响。


    JavaScript 以在编译和合成运行程序所需的软件方面的通用性而闻名，它也可以在非 Web 的环境中执行，如记事本、PDF 文档、桌面小组件甚至网站应用程序。早些，JavaScript
    传统上仅在客户端作为解释语言实现，但在较新版本的浏览器中已演变为即时编译。最新且更快的 JavaScript 版本包含了虚拟机（VM），许多平台构建在其之上。这涵盖了
    JavaScript 开发、使用 Node.js 等运行时环境进行服务器端网络编程，甚至是桌面和移动应用的创建。


    第一个版本的 JavaScript 包含 1995 年的 Netscape Navigator 2.0。当时，微软发布了适用于 Internet Explorer
    的 JavaScript 版本，称为 JScript，这导致了著名的“浏览器大战”。为了标准化这种语言，ECMA 国际组织（前身为欧洲）被指派创建一个规范。规范的第一版
    ECMAScript 1 出于 1997 年 6 月发布。第二版 ECMAScript 2 于 1998 年 12 月发布，第三版 ECMAScript 3
    于 1999 年 12 月发布。


    然而，ECMAScript 第四版的开发在半途中停止且从未完成。随后，他们继续制作了第五版，并于 2009 年 12 月发布。今天使用的 ECMAScript
    第六版（当前版）于 2015 年 6 月发布。


    ## 后期发展


    简而言之，JavaScript 因其跨平台特性和其他规范成为了 Web 上最流行的编程语言之一。然而，最初许多专业程序员和 Web 开发者因为其目标群体而拒绝了这种语言，认为它是给“业余爱好者”和网页作者准备的。Ajax
    的出现让 JavaScript 回回了焦点，并吸引了更多专业程序员的关注。为了改进 JavaScript 编程实践，他们开始大量涌现全面的框架和库，导致 JavaScript
    在浏览器之外的使用量也增加。


    2009 年，成立了 CommonJS 项目，目标是建立一个主要用于 Web 浏览器之外 JavaScript 程序开发的通用标准库。


    随着深度嵌入 JavaScript 的单页应用达到流行的高峰，它很快地被用作大多数静态语言和动态语言源到源编译器的编译目标。特别是 Emscripten 以及其他优化的
    JIT 编译器，配合兼容 OdinMonkey 等 AOT 公司的 asm.js，实现了将 C 和 C++ 汇编编译为 JavaScript 的路径，并使程序以原生速度执行。


    ## 商标


    如今，“JavaScript”是甲骨文公司（Oracle Corporation）的商标。它仍在使用 Netscape communications 发明并执行的技术许可下使用，目前该权利归
    Mozilla 基金会等机构所有。


