    \ a style sheet in an HTML document. Now we look at how to override any of the\
    \ style sheet rules:\n\n- An inline style sheet will take the top priority, including\
    \ any rule that is defined in an external or <style> ... </style> tags\n- Any\
    \ <style> ... </style> tag will override an external style file\n- External style\
    \ sheet will have the lowest priority and will only be applied if the inline style\
    \ or <style> tags do not apply\n\n# How to Handle an Older Browser\n\nThere are\
    \ quite a few of the older browsers that don't provide support for CSS, so when\
    \ you are writing your Embedded CSS in HTML documents, please take care. The following\
    \ example show how to use comment tags as a way of hiding CSS from an older browser:\n\
    \n```css\n<style type=\"text/css\">\n<!--\nbody, td {\n  color: blue;\n}\n-->\n\
    </style>\n```\n\n# CSS Comments\n\nSometimes you will need to add extra comments\
    \ in your style sheet blocks but it is very easy to comment on any part of a style\
    \ sheet. All you do is put your comments within /**.... */ this is a comment in\
    \ a style sheet.... */.\n\nYou can also use /**.... */ to comment on multi-line\
    \ blocks in the same way that you would in C or C++ languages. \n\nFor example:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\np {\n  color: red;\n  /*\
    \ a single-line comment */\n  text-align: center;\n}\n/* a multi-line comment\
    \ */\n</style>\n</head>\n<body>\n  <p>Hello World!</p>\n</body>\n</html>\n```\n\
    \nThis will result in “Hello, World!” being displayed on your screen.\n\n# Chapter\
    \ 4: Measurement Units\n\nCSS supports several different measurements including\
    \ relative measures, like percentages, and absolute unit, like centimeters, inches,\
    \ points, etc. These values are required when you specify measurements in the\
    \ Style rules, for example, e.g. border =\"1px solid red\".\n\nThe following table\
    \ lists the CSS measurement units together with examples:\n\n| Unit | Description\
    \ | Example |\n|---|---|---|\n| % | This defines the measurement as a percentage\
    \ relative to other values. A typical one would be an enclosing element. | p {font-size:16pt;line-height:125%;}\
    \ |\n| cm | This defines measurements in centimeters | div {margin-bottom:2cm;}\
    \ |\n| em | This is a relative measurement for font height in em spaces. An em\
    \ unit is the equivalent of the size of any given font, and because of, if you\
    \ were to assign 12 pt to a font, each of the em units would be 12 pt. This means\
    \ that 2em would equal 24 pt. | p (letter-spacing:7em;) |\n| ex | This defines\
    \ the measurement that is relative to the x-height of the font. We determine the\
    \ x-height by the height of the lowercase x in the specified font | p {font-size:24pt;line-height:3ex;}\
    \ |\n| in | This defines the measurement in inches | p {word-spacing:.15in;} |\n\
    | mm | This defines the measurement in millimeters | p {word-spacing:15mm;} |\n\
    | pc | This defines the measurement in picas, which is equivalent to 12 points.\
    \ This means that there are 6 picas to an inch. | p {font-size:20pc;} |\n| pt\
    \ | This defines the measurement in points, which is defined as 1/72 of an inch\
    \ | body {font-size:18pt;} |\n| px | Defines the measurement in screen pixels.\
    \ | p {padding:25px;} |\n| vh | This is 1% of the viewport height. | h2 {font-size:3.0vh;}\
    \ |\n| vw | This is 1% of the viewport width | h1 { font-size: 5.9vw; } |\n| vmin\
    \ | This is 1vw or 1vh, whichever is the smallest | p { font-size: 2vmin; } |\n\
    \n# Chapter 5: Colors\n\nIn CSS we use values to specify colors. Usually these\
    \ are used when we set the color for the text of an element, which is the foreground,\
    \ or the background of the element. We can also use them to change the color of\
    \ decorative effects, such as a border.\n\nThe color values can be specified in\
    \ several different formats, as displayed in the following table:\n\n| Format\
    \ | Syntax | Example |\n| --- | --- | --- |\n| Hex Code | #RRGGBB | p(color:#FF0000);\
    \ |\n| Short Hex Code | #RGB | p(color:#6A7;); |\n| RGB % | rgb(rrr%,ggg%,bbb%)\
    \ | p(color:rgb(50%,50%,50%)); |\n| RGB Absolute | rgb(rrr,ggg,bbb) | p(color:rgb(0,0,255));\
    \ |\n| keyword | aqua, black, etc. | p(color:teal); |\n\nLet's look at these formats\
    \ in more detail:\n\n# Hex Codes\n\nHexadecimals are 6-digit color representations.\
    \ The first digit – RR – represent red values, GG represent green values and BB\
    \ represents the blue values.\n\nThe values can be taken from graphics software,\
    \ such as JASC Paintshop Pro, Adobe Photoshop, Advanced Paintbrush, etc. Each\
    \ of the hexadecimal codes are preceded by a # or a £ sign and the following are\
    \ examples of hexadecimal notations:\n\n| Color | Color HEX |\n| --- | --- |\n\
    | | #000000 |\n| | #FF0000 |\n| | #00FF00 |\n| | #0000FF |\n| | #FFFF00 |\n| |\
    \ #00FFFF |\n| | #FF00FF |\n| | #CC0CC |\n| | #FFFFFF |\n\n# Short Hex Codes\n\
    \nThis is just a shorter version of the hex code, and each digit is replicated\
    \ so that you get the equivalent 6-digit value. These values can also be taken\
    \ from graphics software and are also preceded by the # or £ sign:\n\n| Color\
    \ | Color HEX |\n| --- | --- |\n| | #000 |\n| | #F00 |\n| | #00F |\n| | #0FF |\n\
    | | #FF0 |\n| | #0FF |\n| | #FOF |\n| | #FFF |\n\n# RGB Values\n\nWe specify this\
    \ value with the rgb() property, which takes three values – red, green and blue.\
    \ Values are percentages or integers between 0 and 255. Be aware that not all\
    \ browsers offer support for rgb() so try not to use it.\n\n| Color | Color RGB\
    \ |\n| --- | --- |\n| | rgb(0,0,0) |\n| | rgb(255,0,0) |\n| | rgb(0,255,0) |\n\
    | | rgb(0,0,255) |\n| | rgb(255,255,0) |\n| | rgb(0,255,255) |\n| | rgb(255,0,255)\
    \ |\n| | rgb(192,192,192) |\n| | rgb(255,255,255) |\n\n# Building the Color Codes\n\
    \nIf you use the CSS Color Code Builder, you can build, quite literally, millions\
    \ of different color code but you you will need a browser that is Java.\n\nThe\
    \ following table shows that each of the hexadecimal codes are preceded by a #\
