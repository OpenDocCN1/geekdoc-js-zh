    Left Shift – ‘<<''

    According to the number specified, this operator moves the bits to the left of
    the number of places in the second operand. The new bits are filled with zeros
    and shifting a left value by one position in binary system, is equivalent of multiplying
    by 2, and shifting it by 2 places is multiplying it by 4 and so on.

    Ex: (A << 1) is 4.


    Right Shift – ‘>>''

    This operator is known as the Binary Right Shift Operator and it moves the left
    operand''s value to the right by the number of bits specified by the right operand.

    Ex: (A >> 1) is 1.


    Right shift with Zero – ‘>>>''

    This operator is similar to the binary right shift operator, except that the bits
    shifted in the left are replaced with a zero.

    Ex: (A >>> 1) is 1.


