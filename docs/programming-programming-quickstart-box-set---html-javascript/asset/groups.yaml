    # Chapter 1: The Advantages of Using CSS


    CSS has a lot of advantages over and above any other similar program:


    Time-Savings – with CSS, you can write it once and then use the exact same sheet
    in a number of different HTML pages. Each HTML element can have its own separate
    style that can be applied to multiple pages.


    Faster Page Load Times – when you use CSS, there is no need to write the HTML
    tag attribute every single time. Instead, you can just write one rule for a tag
    and apply it to every occurrence of the tag. Less code equals much faster loading
    times


    Easy to Maintain – when you want to make a global change, all you need to do is
    change the style; each element relating to style in all the web pages it was used
    in will be changed


    Superior to HTML in Style – CSS provides access to a much bigger range of attributes
    than HTML does so your HTML page will look better than if you used HTML attributes.


    Compatibility with Multiple Devices – Your style sheets allow for content to be
    optimized for more multiple types of device. Using the same HTML document, you
    can produce different website versions for printing, for PDAs or for mobile devices,
    for example.


    Global Web Standards – More and more, CS being recommended over HTML so now is
    a good time to start learning it and using it in all your HTML pages. That way,
    they will be compatible with the browsers of the future.


    Offline Browsing – CSS is able to store applications locally using offline cache.
    This means that you will find it easier to view offline websites and, because
    of the cache, they will load faster and the website will perform better.


    As you can see, CSS offers a ton of advantages over using HTML, not least the
    fact that it is now the the recognized standard. With CSS becoming more and more
    popular, now is the best time to start your learning process.


    Without any further ahead, let us delve into the CSS elements that you use for
    web design.


    Before I go any further, I must state that some of the example code used in the
    book is attributed to www.tutorialspoint.com.'
