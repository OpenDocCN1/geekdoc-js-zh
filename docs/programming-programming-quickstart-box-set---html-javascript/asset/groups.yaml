    # Inline CSS


    You can also use the style attributes from any HTML elements to define the rules.
    These specific rules will only be applied to the particular element. The generic
    syntax is:


    ```

    <element style="...style rules...">

    ```


    # Attributes


    The value of a style attribute is a mixture of different style declarations, each
    separated by semicolons. The following example is based on the generic syntax:


    ```

    <html>

    <head>

    </head>

    <body>

    <h1 style="color:#36C;"> This is inline CSS /h1

    </body>

    </html>

    ```


    # External CSS - The <link> Element


    You can use the <link> element as a way of including an external stylesheet in
    the HTML document. External stylesheets are separate text files that have a .css
    extension. You will define all of your style rules in this file and can then be
    added to any HTML document using the <link> element. The generic syntax is:


    ```

    <head>

    <link type="text/css" href="..." media="..." />

    </head>

    ```


    # Attributes


    The attributes that are associated with the <style> elements are as follows:


    | Attribute | Value | Description |

    |---|---|---|

    | type | text/css | This specifies the language for the style sheet as a MIME
    content type and is a required attribute |

    | href | URL | This specifies that the stylesheet has style rules and is also
    a required attribute |

    | media | Screen | This specifies which devices the document can |'
