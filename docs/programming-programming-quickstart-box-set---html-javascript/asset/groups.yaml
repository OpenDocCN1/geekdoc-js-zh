    HTML

    This stands for Hyper Text Language

    HTTP

    This stands for Hyper Text Protocol


    ## Chapter 9: HTML Colors


    Colors play a very important role in beautifying your web page, making it look
    good and feel. On the page level, you can specify the colors using the `<body>`
    tag. You can also use the `bgcolor` attribute for setting the different colors.


    - **vlink** - This will set the color for the links that are visited (clicked
    once or more).

    - **link** - The color of the linked text can be set using this.

    - **alink** - The color for the selected or active links can be set using this.

    - **text** - The body text color can be set with this.

    - **bgcolor** - The color of the background can be set with this.


    ### HTML Color Methods


    There are three different methods in HTML for setting colors for the web page.
    They are as follows:


    - **Color names** - You can directly specify the names of the colors for the web
    like red, blue or green.

    - **Hex codes** - You can specify the color using a six-digit hex code. Every
    color can be represented by the red, blue and green colors present. The hex code
    is nothing but a representation of this.

    - **Decimal color or percentage values** - This value will be specified by using
    the `rgb()` property.


    Now we will have a look at these coloring schemes in detail.


    ### HTML Colors - Color Names


    You can directly specify the name of the color for setting it as the background
    or text color. There are total of 16 basic colors listed by W3C that validate
    with the HTML validator. Most of the major browsers support more than 200 different
    colors.


    ### W3C Standard 16 Colors


    The list of 16 standard colors, recommended by W3C is given below:


    | Black | Gray | Silver | White |

    | :--- | :--- | :--- | :--- |

    | Yellow | Lime | Aqua | Fuchsia |

    | Red | Green | Blue | Purple |

    | Maroon | Olive | Navy | Teal |


    Example


    Here is an example where we said to set the background color using the color name:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Colors by Name</title>

    </head>

    <body text="blue" bgcolor="green">

    <p>Use different colors for body and table and see the result.</p>

    </body>

    </html>

    ```


    ### HTML Colors - Hex Codes


    The hex code is nothing but the six-digit presentation for a color. The first
    two digits of the hex code represent the value of red, the next two digits represent
    the value of green and the last two digits represent the value of blue. The hex
    code will be RRGGBB.


    You can take the hexadecimal value from graphics software like MS Paint, Paintbrush
    or Adobe Photoshop. A hash sign # will precede the hexadecimal code. Given below
    is a table with the colors using hex code:


    | Color | HEX |

    | :--- | :--- |

    | #000000 |

    | #FF0000 |

    | #00FF00 |

    | #0000FF |

    | #FFFF00 |

    | #FF00FF |

    | #00FFFF |

    | #FFFFFF |


    Example


    Here are examples to set background of an HTML tag by color code:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Colors by Hex</title>

    </head>

    <body text="#0000FF" bgcolor="#00FF00">

    <p>Use different color for body and table and see the result.</p>

    </body>

    </html>

    ```


    ### HTML Colors - RGB Values


    The color can be specified with the `rgb()` property. This takes three inputs
    for red, green and blue, respectively. The range varies from 0 to 255. The list
    of RGB values is given below:


    | Color | RGB |

    | :--- | :--- |

    | (0, 0, 0) |

    | (255, 0, 0) |

    | (0, 255, 0) |

    | (0, 0, 255) |

    | (255, 255, 0) |

    | (255, 0, 255) |

    | (0, 255, 255) |

    | (255, 255, 255) |


    Example


    Here are examples to set background of an HTML tag by RGB color code:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>HTML Colors by RGB</title>

    </head>

    <body text="rgb(0, 0, 255)" bgcolor="rgb(0, 255, 0)">

    <p>Use different color for body and table and see the result.</p>

    </body>

    </html>

    ```


    ### Browser Safe Colors


    There are a total of 216 colors that are supposed to be browser safe. These colors
    range from #000000 to FFFFF in hex code. All computers support this palette.

