    # Chapter 11: Tables


    In this chapter, we are going to look at the properties we can set for HTML tables.
    The following properties can be:


    +   - Border-collapse – this specifies whether the cells of the table should maintain
    their own appearance or if the browser should control the borders that touch

    - Border-spacing – this specifies the width of the space between table cells

    - Caption-size captions – these are in the <caption> element and rendered, default,
    before the table.

    - Empty-cells – this specifies whether there should be a border shown on empty
    cells

    - Table-layout – this lets the browser speed up the table layout by using the
    first width property it finds for a column without loading the table and rendering
    it


    Next we look at these properties with examples.


    # **Border-Collapse**


    This property may have two values – collapse and separate. This example uses


    ```

    <html>

    <head>

    <style type="text/css">

    table.one {border-collapse:collapse;}

    table.two {border-collapse:separate;}

    td.a {

    border-style:dotted;

    border-width:3px;

    border-color:#000000;

    padding: 10px;

    }

    td.b {

    border-style:solid;

    border-width:3px;

    border-color:#333333;

    padding:10px;

    }

    </style>

    </head>

    ```


    </html>'
