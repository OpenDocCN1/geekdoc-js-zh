    # Chapter 2: JavaScript - Specifications and Features


    As described above JavaScript is a lightweight, interpreted programming language,
    which is now being used in creating network specific applications. JavaScript
    is also complementary and integrated with Java which is very easy to implement
    when embedded along with HTML and CSS. It is an open and cross-platform programming
    language.


    Now let us explore the various specifications of JavaScript before getting to
    the syntax. First and foremost you need to understand the basic functionality
    of JavaScript before you go on designing a web page and applications.


    ## Client-side JavaScript


    One of the most popular forms of programming versions is the Client-side JavaScript,
    that is, the script that needs to be included in or referenced by a HTML document
    for the programming to be interpreted by the user.


    This means that the web page need not be a static webpage written with static
    HTML but can include various programs and functions to interact with the user
    and dynamically create HTML content by controlling the browser.


    This client-side mechanism exhibits many advantages over the usual CGI server-side
    scripts. For example, the programmer can use JavaScript to check if the user has
    entered the right user ID in the form field in a web page.


    The JavaScript code ensures that the entries listed by the user are valid or not
    and then proceed to execute commands to submit the form to the web browser. It
    can also be used to trap initiated events such as the link navigation, button
    clicks and other actions that are either implicitly or explicitly initiated by
    the user.


    ## Advantages of JavaScript


    The following lists the merits of JavaScript while designing a webpage:


    - Less server interaction – That is the user input can be validated before sending
    the page off the server which helps lessen server traffic. This means that you
    are offering less load on the server prevents congestion.

    - Immediate response to the users – JavaScript does not wait for a page to reload
    to notify the user of anything they have forgotten or missed.

    - Increase in interactivity – There are more options for you to create interfaces
    using which the webpage can interact with the user, like when the user hovers
    over a marquee with the mouse or activates it by the keyboard.

    - Rich interfaces – JavaScript is used to include various items such as the drag
    and drop components and sliders to provide a better interface experience for your
    web users.


    ## Limitations of using JavaScript


    JavaScript cannot be treated as a full-fledged programming language due to the
    demerits and the features it lacks listed below:


    - The most important version of JavaScript, the client-side JavaScript does not
    allow the reading and writing of the files due to security purposes.

    - There is no support available for JavaScript to be used in networking applications.

    - JavaScript also lacks any multiprocessor or multithreading capabilities.


    ## JavaScript Development Tools


    One of the major advantages of using JavaScript is that it does not require any
    expensive tools and to run. JavaScript can be executed using simple text editors
    such as Notepad. It does not even require a compiler since it is an interpreted
    language used inside the context of the web browser.


    matters matters, various corporations have come forward with great editing tools
    designed specifically for JavaScript. Some of them are listed below –


    - Microsoft FrontPage – FrontPage is a software created by Microsoft that is used
    to edit HTML codes but also provides a good interface for JavaScript. It provides
    web developer number of tools required by them to execute JavaScript Tools and
    assist in the creation of interactive websites.

    - Macromedia HomeSite 5 – Similar to Microsoft FrontPage, HomeSite 5 is a popular
    HTML and JavaScript editor created by Macromedia and can be used to manage personal
    websites efficiently.


    ## Where is JavaScript today?


    As we have discussed before the ECMAScript 5 standard will be the first update
    released in over four years and JavaScript 2.0 conforms to Edition 5 of ECMAScript
    standard, where the differences between the two are extremely minor.


    The exact specifications of JavaScript can be found in the following URL : http://www.ecmascript.org/


    Today although both Netscape’s JavaScript and Microsoft’s Jscript still support
    the features of ECMAScript standards and conform to it, they are still not a part
    of it.


    ## Chapter: JavaScript – Syntax


    Syntax of JavaScript is the written text that will allow you to give instructions
    to the web browsers that will follow the guideline in order to perform various
    operations. JavaScript statements are usually placed within the `<script> ...
    </script>` HTML tags in a web page. There is also an option to place your JavaScript
    code anywhere within your webpage in the `<script>` tags but it is normally recommended
    that you keep it within the `<head>` tags.


    The `<script>` tags always alerts the browser program to read and interpret each
    and every line between as a script. A simple JavaScript syntax will look like
    this:


    ```html

    <script>

    JavaScript code

    </script>

    ```


    There are two important attributes of script tag –


    - Type – This attribute is usually what is recommended to indicate the scripting
    language that is used in the web site and its values used usually be set to "text/javascript"

    - Language – This attribute specifies the kind of scripting language used in the
    web design. Its value is usually "javascript", even though the recent versions
    of HTML (and its successor XHTML) have phased out the use of this attribute.


    And so your JavaScript code will look something like this:


    ```html

    <script language="javascript" type="text/javascript">

    JavaScript code

    </script>

    ```


    ## How to write your JavaScript?


    The most famous test for any language is the printing of "Hello World". Let us
    dig further on how we can execute that. In JavaScript, we generally use a function
    we embed the HTML. The Following is the example:


    ```html

    <html>

    <body>

    <script language="javascript" type="text/javascript">

    document.write("Hello World!");

    </script>

    </body>

    </html>

    ```


    ## Whitespace and Line Breaks


    One of the things to remember while typing a JavaScript program is that it ignores
    all spaces, newlines, tabs and so on. Using Tabs, spaces and newlines are completely
    your wish and you are allowed to format your program in whichever it is convenient
    and easy for you. If you indent your programs to look neat and consistent, then
    it will be easy for both you and a third party who reads the code and understands
    it. This also makes it easier for you to spot errors in the program.


    ## Semicolons are Optional


    In C, C++ and Java it is usually required that every complete command is truncated
    with a semicolon; and the same rule is implemented in JavaScript for simple statements.
    However, in JavaScript, it allows you to omit a semicolon only when you place
    your statements in different lines so that the browser can understand the command.


    NOTE: However, it is healthy to practice programming with the use of semicolons
    since they are an integral part of so many other languages.


    ## Case Sensitivity


    It is important to note that JavaScript is a case sensitive language, that means
    the language and the case of the keywords, function names, variables and all the
    other identifiers must be maintained at the same case throughout the program.


    For example, the identifier char and CHAR have different meanings and can be used
    as individual keywords in the same program.


    NOTE – It is important to pay close attention to the name of your variables and
    the functions since they cannot match a keyword. If they do then it will throw
    an error.


    JavaScript is known to support the styles of C language and C++ in its comments,
    that is –


    - Any text between the // symbol and all the other characters that follow are
    treated as a comment by JavaScript. That is, it will not read these lines and
    it is used for your purposes only.

    - Any text and characters in between the symbols /* and */ will be treated as
    a comment in JavaScript. These comments can span multiple lines at a time unlike.

    - JavaScript recognizes the HTML comment sequence that opens with a <!--. This
    is similar to the ones used in C, the //.

    - The HTML closing sequence --> is not recognized by JavaScript and so a comment
    should be closed with //->.

