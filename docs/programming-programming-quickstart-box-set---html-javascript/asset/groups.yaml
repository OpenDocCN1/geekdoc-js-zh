- md: "\n## Chapter 12: Borders\n\nBorder properties allow you to say what the border\
    \ of an element box should look like. The following are the three properties that\
    \ you can control\n\n- Border-color— allows you to specify the color of the border\n\
    - Border-style— allows you to specify the style from a choice of values, including\
    \ a solid line, dashed line, double line, etc.\n- Border-width— allows you to\
    \ specify the width of the border\n\n## Border-Color\n\nThis property lets you\
    \ change the color of a border surrounding an element. You can change each side\
    \ of the border individually using these properties:\n\n- Border-bottom-color\n\
    - Border-top-color\n- Border-left-color\n- Border-right-color\n\nThis example\
    \ shows all four properties in use:\n\n```html\n<html>\n<head>\n<style type=\"\
    text/css\">\np.example1{\n  border:1px solid;\n  border-bottom-color:#009900;\
    \ /* Green */\n  border-top-color:#FF0000; /* Red */\n  border-left-color:#330000;\
    \ /* Black */\n  border-right-color:#0000CC; /* Blue */\n}\np.example2{\n  border:1px\
    \ solid;\n  border-color:#009900;      /* Green */\n}\n</style>\n</head>\n<body>\n\
    \n<p class=\"example1\">\nThe example shows all borders in different colors.\n\
    </p>\n\n<p class=\"example2\">\nThe example shows all borders in green only.\n\
    </p>\n\n</body>\n</html>\n```\n\nThe result will\n\n![](img/87cd42833412f234f2adddd3a5cc272b_211_0.png)\n\
    \n## Border-style\n\nThis property let you select one of these styles:\n\n- None\
    \ – has no border at all\n- Solid – gives the border a solid line\n- Dotted –\
    \ the border is made of dots\n- Dashed – the border is made of short lines\n-\
    \ Double – this is two solid lines\n- Groove – make the border look like it has\
    \ been carved into the page\n- Ridge – does the opposite of groove\n- Inset –\
    \ the box looks embedded in the page\n- Outset – the box looks as though it is\
    \ coming out of the page\n- Hidden – exactly the same as for None but with the\
    \ exception of a border-conflict resolution for table elements\n\nAs with color,\
    \ you can change the style of each individual side of the border, using these\
    \ properties:\n\n- Border-bottom-style\n- Border-top-style\n- Border-left-style\n\
    - Border-right-style\n\nThis example uses all four of these styles:\n\n```html\n\
    <html>\n<head>\n</head>\n<body>\n<p style=\"border-width:4px; border-style:none;\"\
    >\nThis is a border with a width of none.\n</p>\n\n<p style=\"border-width:4px;\
    \ border-style:solid;\">\nThis is a solid border.\n</p>\n\n<p style=\"border-width:4px;\
    \ border-style:dashed;\">\nThis is a dashed border.\n</p>\n\n<p style=\"border-width:4px;\
    \ border-style:double;\">\nThis is a double border.\n</p>\n\n<p style=\"border-width:4px;\
    \ border-style:groove\">\nThis is a groove border.\n</p>\n\n<p style=\"border-width:4px;\
    \ border-style:ridge\">\nThis is a ridge border.\n</p>\n\n<p style=\"border-width:4px;\
    \ border-style:inset\">\nThis is an inset border.\n</p>\n\n<p style=\"border-width:4px;\
    \ border-style:outset\">\nThis is an outset border.\n</p>\n\n<p style=\"border-width:4px;\
    \ border-style:hidden\">\nThis is a hidden border.\n</p>\n\n<p style=\"border-width:4px;\
    \ border-top-style:solid; border-bottom-style:dashed; border-left-style:groove;\
    \ border-right-style:double;\">\nThis is a border with four different styles.\n\
    </p>\n</body>\n</html>\n```\n\nThe result will be -\n\n| This is a border with\
    \ none |\n| This is a solid border |\n| This is a dashed border |\n| This is a\
