    - Like mentioned before JavaScript is case sensitive and it is possible for the
    same word to be a variable with different characterization. For example, money
    and Money are two different words and can be used as two different variables.


    # JavaScript Keywords or Reserved Words


    Keywords are an essential fundamental indicators of a programming language and
