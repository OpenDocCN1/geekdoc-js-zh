    \ the OCR text has a weird repetition/merge at the end of page 166 and 167. I\
    \ will merge the tables correctly).\n\nThe following table shows that each of\
    \ the hexadecimal codes are preceded by a # or a £ sign and the following are\
    \ examples of hexadecimal notations:\n\n(Actually, I will just provide the clean\
    \ merged text).\n"
  mdcn: "\n因此，我们已经看了在 HTML 文档中引入样式表的四种不同方法。现在我们来看如何覆盖任何样式表规则：\n\n- 内联样式表具有最高优先级，包括定义在外部文件或\
    \ `<style> ... </style>` 标签中定义的任何规则\n- 任何 `<style> ... </style>` 标签将覆盖外部样式表文件\n\
    - 外部样式表的优先级最低，只有在内联样式或 `<style>` 标签未生效时才会应用。\n\n# 如何处理旧版浏览器\n\n有很多旧版浏览器不支持 CSS，因此当你在\
    \ HTML 文档中编写嵌入式 CSS（Embedded CSS）时，请小心。以下示例展示了如何使用注释标签作为向旧浏览器隐藏 CSS 的方法：\n\n```css\n\
    <style type=\"text/css\">\n<!--\nbody, td {\n  color: blue;\n}\n-->\n</style>\n\
    ```\n\n# CSS 注释\n\n有时你可能需要在样式表块中添加额外的注释，但对样式表的任何部分进行注释都非常简单。你只需要将注释放在 `/**....\
    \ */` 之中——这是样式表中的注释——`*/`。\n\n你也可以使用 `/**.... */` 对多行块进行注释，就像在 C 或 C++ 语言中执行一样。\n\
    \n例如：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\np {\n  color: red;\n\
    \  /* a single-line comment */\n  text-align: center;\n}\n/* a multi-line comment\
    \ */\n</style>\n</head>\n<body>\n  <p>Hello World!</p>\n</body>\n</html>\n```\n\
    \n这将导致在屏幕上显示“Hello, World!”。\n\n# 第 4 章：测量单位\n\nCSS 支持多种不同的测量方式，包括相对测量值（如百分比）和绝对单位（如厘米、英寸、点等）。当你在样式规则中指定测量值时，需要提供这些值，例如：`border\
    \ =\"1px solid red\"`。\n\n下表列出了 CSS 测量单位及其示例：\n\n| 单位 | 描述 | 示例 |\n|---|---|---|\n\
    | % | 将测量值定义为相对于其他值的百分比。一个典型的值是容器元素。 | p {font-size:16pt;line-height:125%;} |\n\
    | cm | 以厘米为单位定义测量值 | div {margin-bottom:2cm;} |\n| em | 这是在 em 空间中字体高度的相对测量值。em\
    \ 单位等同于任何给定字体的大小，正如此，如果你给字体分配了 12 pt，那么每个 em 单位将是 12 pt。这意味着 2em 等于 24 pt。 | p\
    \ (letter-spacing:7em;) |\n| ex | 定义相对于字体 x 高（x-height）的测量值。我们通过指定字体中小写字母 x 的高度来确定\
    \ x 高 | p {font-size:24pt;line-height:3ex;} |\n| in | 以英寸为单位定义测量值 | p {word-spacing:.15in;}\
    \ |\n| mm | 以毫米为单位定义测量值 | p {word-spacing:15mm;} |\n| pc | 以磅（picas）为单位定义测量值，等于\
    \ 12 点。这意味着每英寸有 6 磅。 | p {font-size:20pc;} |\n| pt | 以点（points）为单位定义测量值，定义为英寸的\
    \ 1/72 | body {font-size:18pt;} |\n| px | 以屏幕像素定义测量值。 | p {padding:25px;} |\n\
    | vh | 视口高度的 1%。 | h2 {font-size:3.0vh;} |\n| vw | 视口宽的 1% | h1 { font-size: 5.9vw;\
    \ } |\n| vmin | 是 1vw 或 1vh，取较小的一个 | p { font-size: 2vmin; } |\n\n# 第 5 章：颜色\n\
    \n在 CSS 中，我们使用值来指定颜色。通常，这些值用于设置元素的文本颜色（即前景）或元素的背景。我们也可以使用它们来更改装饰性效果的颜色，例如边框。\n\
    \n颜色值可以用几种不同的格式指定，如下表所示：\n\n| 格式 | 语法 | 示例 |\n| --- | --- | --- |\n| 十进制代码 | #RRGGBB\
    \ | p(color:#FF0000); |\n| 简十六进制代码 | #RGB | p(color:#6A7;); |\n| RGB % | rgb(rrr%,ggg%,bbb%)\
    \ | p(color:rgb(50%,50%,50%)); |\n| RGB 绝对值 | rgb(rrr,ggg,bbb) | p(color:rgb(0,0,255));\
    \ |\n| 关键字 | aqua, black, 等 | p(color:teal); |\n\n让我们详细查看这些格式：\n\n# 十六进制代码\n\n\
    十六进制是 6 位数的颜色表示。第一部分 – RR – 代表红色值，GG 代表绿色值，BB 代表蓝色值。\n\n这些值可以从图形软件获取，例如 JASC Paintshop\
    \ Pro、Adobe Photoshop、Advanced Paintbrush 等。每个十六进制代码前面都有 # 或 £ 符号，以下是十六进制表示法的示例：\n\
    \n| 颜色 | 颜色十六进制 |\n| --- | --- |\n| | #000000 |\n| | #FF0000 |\n| | #00FF00 |\n\
    | | #0000FF |\n| | #FFFF00 |\n| | #00FFFF |\n| | #FF00FF |\n| | #CC0 |\n| | #FFFFFF\
    \ |\n\n# 简十六进制代码\n\n这是十六进制代码的简短版本，每个数字都重复以得到 6 位数。这些值也可以从图形软件获取，并且前面通常有 # 符号：\n\
    \n| 颜色 | 颜色十六进制 |\n| --- | --- |\n| | #000 |\n| | #F00 |\n| | #00F |\n| | #OFF\
    \ |\n| | #FF0 |\n| | #OFF |\n| | #FOF |\n| | #FFF |\n\n# RGB 值\n\n我们使用 `rgb()`\
    \ 属性来指定这种值，它接受红色、绿色和蓝色。值可以是 0 到 255 之间的整数或百分比。请注意，并不是所有浏览器都支持它，所以请谨慎使用。\n\n| 颜色\
    \ | RGB |\n| --- | --- |\n| | rgb(0,0,0) |\n| | rgb(255,0,0) |\n| | rgb(0,255,0)\
    \ |\n| | rgb(0,0,255) |\n| | rgb(255,255,0) |\n| | rgb(0,255,255) |\n| | rgb(255,0,255)\
    \ |\n| | rgb(255,255,255) |\n\n# 构建颜色代码\n\n如果你使用 CSS 颜色构建器，你可以构建数以百万计的颜色，但你需要一个支持的浏览器。下表显示了每个十六进制代码前面都有\
    \ # 符号，以下是十六进制表示法的示例：\n\n（注：原文此部分存在大量重复和OCR错误，已根据逻辑进行整理）\n"
