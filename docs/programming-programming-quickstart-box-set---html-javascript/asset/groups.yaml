    \ | p(color:rgb(50%,50%,50%)); |\n| RGB Absolute | rgb(rrr,ggg,bbb) | p(color:rgb(0,0,255));\
    \ |\n| keyword | aqua, black, etc. | p(color:teal); |\n\nLet's look at these formats\
    \ in more detail:\n\n# Hex Codes\n\nHexadecimals are 6-digit color representations.\
    \ The first digit – RR – represent red values, GG represent green values and BB\
