    </html>\n```\n\n你将看到以下结果：\n\n文本将保留空格和换行。\n\n# 如何设置文本阴影\n\n这个最终的示例展示了如何为文本周围设置阴影：\n\
    \n```html\n<html\n<head>\n</head>\n<body>\n<p style=\"text-shadow:2px 2px blue;\"\
    >\n此文本将带有蓝色阴影。\n</p>\n</body>\n</html>\n```\n\n它将产生以下结果：\n\n此文本将带有蓝色阴影。\n\n# 第\
    \ 9 章：图片\n\n图片是网页中重要的部分，可以通过某些 CSS 属性控制它们的显示：\n\n- Border – 用于设置图片的边框\n- Height\
    \ – 用于设置图片的高度\n- Width – 用于设置图片的宽度\n- Moz-opacity – 用于设置图片的透明度\n\n# 图片边框\n\n此属性通过使用\
    \ `normal` 或 `%` 值来设置图片的边框，例如：\n\n```html\n<html\n<head>\n</head>\n<body>\n<img\
    \ style=\"border:0px;\" src=\"/images/logo.png\" />\n<br />\n<img style=\"border:3px\
    \ dashed red;\" src=\"/images/logo.png\" />\n</body>\n</html>\n```\n\n结果是：\n\n\
    一个没有边框的图片\n\n一个带有红色虚线边框的图片\n\n# 图片高度\n\n此属性用于设置图片的高度，可以使用长度或 `%`。当你使用百分比时，值应用于图片所在的容器：\n\
    \n```html\n<html\n<head>\n</head>\n<body>\n<img style=\"border:1px solid red;\
    \ height:100px;\" src=\"/images/logo.png\" />\n<br />\n<img style=\"border:1px\
    \ solid red; height:50%;\" src=\"/images/logo.png\" />\n</body>\n</html>\n```\n\
    \n结果是：\n\n两个完全相同的图片，但一个比另一个高\n\n# 图片宽度\n\n此属性使用 `%` 或长度值来设置图片的宽度。与高度一样，使用百分比应用于：\n\
    \n```html\n<html\n<head>\n</head>\n<body>\n<img style=\"border:1px solid red;\
    \ width:150px;\" src=\"/images/logo.png\" />\n<br />\n<img style=\"border:1px\
    \ solid red; width:100%;\" src=\"/images/logo.png\" />\n</body>\n</html>\n```\n\
    \n结果是：\n\n两个相同的图片，但尺寸不同\n\n# 透明度（-Opacity）\n\n最后一个属性是设置图片的透明度，并用于 Mozilla Firefox。对于\
    \ Internet Explorer，我们使用 `filter:alpha(opacity:x)` 来实现透明效果。\n\n在 Mozilla Firefox\
    \ 中，在属性 `moz-opacity:x` 中，x 可以取 0.0 到 1.0 之间的任何值。值越小，图片越透明。同样，在 Internet Explorer\
    \ 中 `(filter:alpha(opacity=x))`，x 的值可以是 0 到 100 之间的任何值。同样，值越小，图片越透明。\n\n```html\n\
    <html\n<head>\n</head>\n<body>\n<img style=\"border:1px solid red;-moz-opacity:0.4;filter:alpha(opacity=40);\"\
    \ src=\"/images/logo.png\" />\n</body>\n</html>\n```\n"
