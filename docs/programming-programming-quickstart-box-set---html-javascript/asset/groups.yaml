    # Chapter 9: Using Images


    Images are an important part of websites, and although you shouldn''t use too
    many, those you do should be of good quality and in the right place. CSS helps
    to control the display of these images by allowing you to set the following properties:


    +   - Border – this is used to set the width of the border on the image

    - Height – this is used to set the height of the image

    - Width – this is used to set the width of the image

    - -most-opacity - this is used to determine the opacity of the image


    # Image Border


    This property is used to set the width of the border on the image and can use
    values of length or %. For example:


    ```

    <html>

    <head>

    </head>

    <body>

    <img style="border:0px;" src="/css/images/logo.png" />

    <br />

    <img style="border:3px dashed red;" src="/css/images/logo.png" />

    </body>

    </html>

    ```


    The result will be a logo without a border and then a logo with a dotted red border


    # Image Height


    This property is used to set how high an image is and can use values of length
    or %. When you use %, the value is applied to the box which the image is in:


    ```

    <html>

    <head>

    </head>

    <body>

    <img style="border:1px solid red; height:100px;" src="/css/images/logo.png" />

    <br />

    <img style="border:1px solid red; height:50%;" src="/css/images/logo.png" />

    </body>

    </html>

    ```


    The result will be two logos, exactly the same, but one taller than the other


    # Image Width


    This is used to set the width of an image using value of % or length. As with
    height, using percentage applies'
