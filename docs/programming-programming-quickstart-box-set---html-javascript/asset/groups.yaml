    ## Chapter 4: Enabling and Disabling JavaScript in your Web Browser


    Almost all modern browsers that we use today come with a built support for JavaScript
    that can be enabled or disabled by the users manually. This chapter focuses on
    enabling and disabling the JavaScript settings and support system in your browsers
    such as the Internet Explorer, Google Chrome, Mozilla Firefox and Opera to name
    a few.


    ## JavaScript in Internet Explorer:


    The following instructions will guide you to turn on and turn off the JavaScript
    support in your Internet Explorer


    - Go to Tools → Select Internet Options from the menu

    - Click on the Security Tab from the dialog box

    - Select the Custom Level button.

    - Scroll down the drop-down box until you find Scripting Options in the list.

    - After locating the Active Scripting, select the Enable radio button.

    - Finally click on the okay button and exit the window.


    In order to disable the JavaScript support in your Internet Explorer settings,
    all you need to do is follow the same set of instructions except selecting Disable
    radio button under Active Scripting.


    ## JavaScript in Mozilla Firefox


    The following instructions will guide you to turn on and turn off the JavaScript
    support in your Mozilla Firefox


    - Open a Mozilla Firefox tab and type about:config in the address bar of the page.

    - After which a warning dialog will open and you need to select ‘I’ll be careful,
    I promise!’

    - You will find a list of all the configure options in the browser in a drop-box.

    - Type javascript.enabled in the search bar of the web browser.

    - Here you will find an option to enable and disable JavaScript by right clicking
    on the option → then select toggle


    ## JavaScript in Google Chrome


    The following instructions will guide you to turn on and turn off the JavaScript
    support in your Google Chrome


    - Select the Chrome menu which is located at the top right hand corner of your
    web browser.

    - Click on the settings option

    - Select Show Advanced Settings which is located at the end of the page.

    - Click on the content settings button which is located right below the Privacy
    Section.

    - You will need to select “Do not allow any site to run JavaScript” in order to
    disable JavaScript settings or select “Allow all sites to run JavaScript (recommended)”


    ## JavaScript in Opera


    The following instructions will guide you to turn on and turn off the JavaScript
    support in your Opera browser -


    - Open the *Tools* menu and select *Preferences*.

    - Click on the *Advanced* option from the dialog box.

    - Select *Content* from the drop down box.

    - Click on the *Enable JavaScript* checkbox

    - Finally click on the *okay* button and exit the menu.


    To disable the JavaScript support in your Opera web browser, you should leave
    the *Enable JavaScript* button unchecked.


    ## Warning for Browsers that do not support JavaScript


    If there is anything you need to use JavaScript for the browsers that don''t support
    JavaScript, then you are able to display a warning message using the `<noscript>`
    tags.


    The noscript tag is added immediately after the script block as written below:


    ```html

    <html>

    <body>

    <script language="javascript" type="text/javascript">

    document.write("Hello World!")

    </script>

    <noscript>

    Sorry JavaScript is required in order to proceed.

    </noscript>

    </body>

    </html>

    ```


    In case the user''s browser does not support JavaScript or is not enabled then
    the message will be displayed on the screen from `<noscript>`. JavaScript enjoys
    flexibility to include JavaScript in a HTML file as follows


    - Program code inside `<head> ... </head>` section.

    - Program code inside `<body> ... </body>` section.

    - Program code inside `<head> ... </head>` and `<body> ... </body>` section.

    - Program code in an external file and then include the `<head> ... </head>` section.


    ## Chapter 5: JavaScript Data Types


    ## JavaScript data types


    One of the most basic and fundamental building blocks of a programming language
    is the set of data types it supports. There are various types and collections
    of data types that are used and here are the types of values that are allowed
    to be used and manipulated in JavaScript.


    JavaScript consists of the following basic data types –


    - Strings and characters: It is a special character or a collection of characters.
    For example, ''This is a text string''

    - Numbers: They are numerical values which can be expressed normally, with decimals
    (floating points), binary and hexadecimals, for example, 145, 23.98 etc.

    - Boolean: They are logical expressions, example AND logic, OR logic, etc.


    In JavaScript the most rudimentary type of data is null and undefined, where each
    can define only one value. Apart from these primitive types, JavaScript also supports
    a composite data type, that is a collection of basic data types, wrapped into
    a single object.


    NOTE: It is important to note that JavaScript does not distinguish between integer
    values and floating point values. All numbers are taken and represented in the
    form of floating point numbers using the 64 bit floating point format which is
    defined in the IEEE 754 standard.


    ## JavaScript Variables


    One of the main attributes of any programming language are the variables. JavaScript,
    like many others similar to C, C++ and Java. Variables are usually a named container.
    Their use is similar to that of an algebraic variable, where the letter or a word
    contains different numerical and alphanumeric values at some point in the program.


    In JavaScript, the basic keyword to create a variable is var and you must declare
    it in the beginning of the program before you start it in your program.


    ```html

    <script type="text/javascript">

    <!--

    var amount;

    var rate;

    -->

    </script>

    ```


    There is also an option of declaring multiple variables with the same var keyword
    at the same time. This is known as dynamic initialization of a variable.


    ```html

    <script type="text/javascript">

    <!--

    var amount, rate;

    -->

    </script>

    ```


    This type of declaring the variable name and type is known as variable initialization.
    You can initialize a variable at any point of time and anywhere in the program
    and when you need a variable. All variables must be used at some point or else
    JavaScript throws an error for redundant variables.


    Here the type of initializations that can be done throughout the program. You
    can also change the values of the variables any time inside the programs. Here
    is an example of variable initialization –


    ```html

    <script type="text/javascript">

    <!--

    var name = "Rose";

    var age;

    age = 21;

    //-->

    </script>

    ```


    NOTE – Once a var keyword declares or initializes a variable in the program, the
    same variable cannot be initialized again.


    Like was mentioned before, JavaScript is an untyped language. This means that
    the variable declared in a JavaScript can be of any data type, a number, character,
    string or even a Boolean expression. This feature isn''t possible in so many of
    the other programming languages. Most of them need to specify the type of variable
    being declared in the program as and when they type it. JavaScript interprets
    the type of change that the variables goes through the run time of the program
    and adapts the data accordingly.


    ## JavaScript Variable Scope


    In any programming language you need to understand the scope of a variable. The
    scope is the area or the region of the program in which the variable is valid.
    JavaScript supports only two types of scope –


    - Global variable – A global variable is declared in the main body of the program
    or before the main program and its scope is valid from the line it is declared
    and valid throughout the program in your JavaScript code.

    - Local Variables – A local variable is valid only inside a section of the program,
    specifically inside a function or parenthesis. Any reference to that variable
    outside the scope will cause JavaScript to throw errors.


    It is important to note that, inside the body of the function, the global variable
    is given less precedence than a local variable of the same name. If you happen
    to declare a variable or a function name same as a global variable it is recommended
    to hide it out. Take a look at this example –


    ```html

    <<html>

    <body onload = checkscope();

    <script type="text/javascript">

    <!---

    var myVar = "global"; // Declare a global variable

    function checkscope() {

    var myVar = "local"; // Declare a local variable

    document.write(myVar);

    }

    //-->

    </script>

    ```

