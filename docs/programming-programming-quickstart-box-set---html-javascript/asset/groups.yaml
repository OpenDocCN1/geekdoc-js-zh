    # # Chapter 1: Basic Tags in HTML


    **Heading Tags**


    Heading is the first thing in a document and every document starts with one. In
    HTML, you can set your heading in different sizes. There are six sizes of headings
    and they can be set using the elements `<h2>2`, `<h3>3`, `<h4>4`, `<h5>5`, and
    `<h6>6`. The browser will add a line before and after the heading while displaying.
    Here is an example.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Heading</title>

    </head>

    <body>

    <h1>This will be heading 1</h1>

    <h2>This will be heading 2</h2>

    <h3>This will be heading 3</h3>

    <h4>This will be heading 4</h4>

    <h5>This will be heading 5</h5>

    <h6>This will be heading 6</h6>

    </body>

    </html>

    ```


    This code will produce the following output:


    # ## This will be heading 1


    # ## This will be heading 2


    # ## This will be heading 3


    # ## This will be heading 4


    # ## This will be heading 5


    This will be Heading 6


    **Paragraph Tag**


    You can structure your content into paragraphs using the `<p>` tag. For making
    your text into a paragraph, you should place it in between the opening tag `<p>`
    tag and closing tag `</p>`. Here is an example.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Paragraph</title>

    </head>

    <body>

    <p>This text will be the first paragraph.</p>

    ```'
  - '[PAGE 12]


