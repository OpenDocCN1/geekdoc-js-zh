    \n![](img/87cd42833412f234f2adddd3a5cc272b_5_0.png)\n\n## Introduction\n\nHTML\
    \ or Hyper Text Markup Language is the most commonly used language for developing\
    \ web pages. It was created in the year 1991 by Berners-Lee. The standard HTML\
    \ specification, HTML 2.0, was published in the year 1995. Another major version\
    \ of this language, HTML 4.01 was released in late 1999. This was the most widely\
    \ used version of HTML and it is now replaced by HTML 5, released in the year\
    \ 2012. This is basically an extension to its previous version HTML 4.01.\n\n\
    What is this for?\n\nThis tutorial on HTML is designed specifically for aspiring\
    \ developers and web designers. This tutorial is explained in enough detail with\
    \ practical examples and a simple overview so that it can be easily understood\
    \ by beginners and provides enough knowledge to design their own webpages. You\
    \ can get a higher level of expertise with some practice.\n\n## Prerequisites\n\
    \nThe prerequisites for starting this tutorial are that you should have some basic\
    \ knowledge of working with Linux operating system or Windows. In addition, you\
    \ should also be familiar with:\n\n- Using a text editor like editplus, notepad,\
    \ notepad++ or any other text editor.\n- Creating files and directories on your\
    \ computer.\n- Navigation within different directories.\n- Different image formats\
    \ like PNG, JPG, etc.\n- Typing content into a file and saving them.\n\n## Introduction\n\
    \n### Chapter 1: Basic Tags in HTML\n\n#### Heading Tags\n\nHeading tags are used\
    \ to define headings in a webpage. There are six sizes of heading tags, from <h1>\
    \ to <h6>. <h1> is the most important heading and <h6> is the least important.\n\
    \n<h1>Heading 1</h1>\n<h2>Heading 2</h2>\n<h3>Heading 3</h3>\n<h4>Heading 4</h4>\n\
    <h5>Heading 5</h5>\n<h6>Heading 6</h6>\n\n#### Paragraph Tags\n\nParagraph tags\
    \ are used to define a paragraph of text. A paragraph is defined with the <p>\
    \ tag. Browsers automatically add some space before and after the paragraph.\n\
    \n<p>This is a paragraph.</p>\n<p>This is another paragraph.</p>\n\n#### Line\
    \ Break Tag\n\nThe <br> tag is used to insert a line break in the text. It is\
    \ an empty tag, meaning it does not have a closing tag.\n\n<p>This is a paragraph<br>with\
    \ a line break.</p>\n\n#### Horizontal Rule Tag\n\nThe <hr> tag is used to create\
    \ a horizontal line to separate the content. It is also an empty tag.\n\n<p>Some\
    \ text above the line.</p>\n<hr>\n<p>Some text below the line.</p>\n\n#### List\
    \ Tags\n\nLists are used to group related items together. There are two types\
    \ of lists in HTML: ordered and unordered lists.\n\n#### Unordered List\n\nUnordered\
    \ lists are defined with the <ul> tag. Each list item is defined with the <li>\
    \ tag.\n\n<ul>\n  <li>First item</li>\n  <li>Second item</li>\n  <li>Third item</li>\n\
    </ul>\n\n#### Ordered List\n\nOrdered lists are defined with the <ol> tag. Each\
    \ list item is defined with the <li> tag.\n\n<ol>\n  <li>First item</li>\n  <li>Second\
    \ item</li>\n  <li>Third item</li>\n</ol>\n\n#### Image Tag\n\nThe <img> tag is\
    \ used to embed an image in a webpage. It is an empty tag and requires the src\
    \ attribute to specify the path to the image.\n\n<img src=\"image.jpg\" alt=\"\
    Description of image\" width=\"500\" height=\"600\">\n\n## Chapter 2: HTML Elements\n\
    \n#### HTML Attributes\n\nHTML attributes are used to provide additional information\
    \ about an element. They are always specified in the start tag and usually come\
    \ in pairs of name=\"value\".\n\n<a href=\"https://www.google.com\">This is a\
    \ link to Google</a>\n<img src=\"logo.png\" alt=\"Logo\">\n\n## Chapter 3: Formatting\
    \ in HTML\n\n#### Formatting Tags\n\nFormatting tags are used to change the appearance\
    \ of the text.\n\n#### Bold and Italic\n\nThe <b> tag is used to make text bold,\
    \ and the <i> tag is used to make text italic.\n\n<b>This text is bold.</b>\n\
    <i>This text is italic.</i>\n\n#### Highlight and Underline\n\nThe <mark> tag\
    \ is used to highlight text, and the <u> tag is used to underline text.\n\n<mark>This\
    \ text is highlighted.</mark>\n<u>This text is underlined.</u>\n\n#### Subscript\
    \ and Superscript\n\nThe <sub> tag is used for subscript, and the <sup> tag is\
    \ used for superscript.\n\nH<sub>2</sub>O is water.\nE = mc^2\n"
