    ## Definition Lists


    HTML supports a list called the **definition list**. It is ideal for representing
    a list of items, glossary, or other values. The given tags used by the definition
    list:


    - <dl> - Defines the start of the list

    - <dt> - Term

    - <dd> - Definition

    - </dl> - Defines the end of the list


    Here is an example:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Definition List</title>

    </head>

    <body>

    <dl>

    <dt>HTML</dt>

    <dd>This stands for Hyper Text Language</dd>

    <dt>HTTP</dt>

    <dd>This stands for Hyper Text Protocol</dd>

    </dl>

    </body>

    </html>

    ```

