- md: "\n## Chapter 10: Links\n\nIn this chapter, we take a look at how to use CSS\
    \ to set the properties of a hyper link. The following properties can be set:\n\
    \n- **link** is used to signify unvisited hyperlinks.\n- **visited** is used to\
    \ signify visited hyperlinks.\n- **hover** is used to signify elements that have\
    \ the mouse pointer hovering over the top.\n- **active** is used to signify elements\
    \ that are currently being clicked.\n\nNormally, these properties are stored in\
    \ the header of an HTML document. Remember the following rules for effective use:\n\
    \n- a:hover comes after a:link and a:visited in CSS definition\n- a:active comes\
    \ after a:hover, as shown in the next example:\n\n```css\n<style type=\"text/css\"\
    >\na:link { color: #000000 }\na:visited { color: #006600 }\na:hover { color: #FFC000\
    \ }\na:active { color: #FF00CC }\n</style>\n```\n\nNext we will look at how these\
    \ properties are used for different effects on hyperlinks.\n\n### Set the Color\n\
    \nThis example shows how we set the color of a link using values that are of any\
    \ color name in any format that is valid:\n\n```html\n<html>\n<head>\n<style type=\"\
    text/css\">\na:link { color: #000000 }\n</style>\n</head>\n<body>\n<a href=\"\"\
    >Link</a>\n</body>\n</html\n```\n\nThe result will be a black link. Please note\
    \ that none of these links are clickable; they are just for demonstration purposes.\n\
    \nLink\n\n### The Color of Visited Links\n\nThis example shows how to set the\
    \ color of a visited link, again with values of any color name in any format that\
    \ is valid:\n```html\n<html\n<head>\n<style type=\"text/css\">\na:visited {color:\
    \ #006600}\n</style>\n</head>\n<body>\n<a href=\"\">link</a>\n</body>\n</html\n\
    ```\n\nThe result will be the following link, black to start and green when clicked\
    \ on.\nLink\n\n### Color of Links with Mouse Hover\n\nThis example shows how to\
    \ change the color of a link when we hover the mouse pointer over it:\n```html\n\
    <html\n<head>\n<style type=\"text/css\">\na:hover {color: #FFCC00}\n</style>\n\
    </head>\n<body>\n<a href=\"\">Link</a>\n</body>\n</html\n```\n\nThe result will\
    \ be a black link that changes to yellow when the mouse is hovered over the top\n\
    Link\n\n### Color of Active Links\n\nThis example shows how we change the color\
    \ of an active link:\n```html\n<html\n<head>\n<style type=\"text/css\">\n a:active\
    \ { color: #FF00CC }\n</style>\n</head>\n<body>\n<a href=\"\">Link</a>\n</body>\n\
    </html\n```\n\nThe result will be a black link that changes to pink when it is\
    \ clicked on.\n\nLink\n\n## Chapter 11: Tables\n\nIn this chapter, we are going\
    \ to look at the properties we can set for HTML tables. The following properties\
    \ can be:\n\n- Border-collapse – this specifies whether the cells of the table\
    \ should maintain their own appearance or if the browser should control the borders\
    \ that touch\n- Border-spacing – this specifies the width of the space between\
    \ table cells\n- Caption-size captions – these are in the `<caption>` element\
    \ and rendered, default, before the table.\n- Empty-cells – this specifies whether\
    \ there should be a border shown on empty cells\n- Table-layout – this lets the\
    \ browser speed up the table layout by using the first width property it finds\
    \ for a column without loading the table and rendering it\n\nNext we look at these\
    \ properties with examples.\n\n### Border-Collapse\n\nThis property may have two\
    \ values – collapse and separate. This example uses\n\n```html\n<html\n<head>\n\
    <style type=\"text/css\">\ntable.one {border-collapse:collapse;}\ntable.two {border-collapse:separate;}\n\
    td.a {\nborder-style:dotted;\nborder-width:3px;\nborder-color:#000000;\npadding:\
    \ 10px;\n}\ntd.b {\nborder-style:solid;\nborder-width:3px;\nborder-color:#333333;\n\
    padding:10px;\n}\n</style>\n</head>\n\n<table class=\"one\">\n<caption>Collapse\
    \ Border Example</caption>\n<tr><td class=\"a1\"> Cell 1 Collapse Example</td></tr>\n\
    <tr><td class=\"2\"> Cell 2 Collapse Example</td></tr>\n</table>\n<br />\n\n<table\
    \ class=\"two\">\n<caption>Separate Border Example</caption>\n<tr><td class=\"\
    1\"> Cell 1 Separate Example</td></tr>\n<tr><td class=\"2\"> Cell 2 Separate Example</td></tr>\n\
    </table>\n\n</body>\n</html\n```\n\nThis will give you these results:\n\n| Collapse\
    \ Border: |\n| Cell 1 Collapse Example |\n| Cell 2 Collapse Example |\n\n| Separate\
    \ Border: |\n| Cell 1 Separate Example |\n| Cell 2 Separate Example |\n\n### Border-Spacing\n\
    \nThis property specifies how much distance is between the border of two adjacent\
    \ cells. It can take either of two values, each of which should be a length unit.\
    \ One value applies to horizontal and vertical borders while using two values\
    \ will refer to the vertical and horizontal spacing.\n\n```css\n<style type=\"\
    css\">\n/* If you provide a value * / */\ntable.example{border-spacing:10px};\n\
    /* This is how to provide two values */\ntable.example{border-spacing:10px; 15px;}\n\
    </style>\n```\n\nThe next example modifies the first example:\n\n```html\n<html\n\
    <head\n<style type=\"text/css\">\n\ntable.one {\n  border-collapse:separate;\n\
    \  width:400px;\n  border-spacing:10px;\n}\ntable.two {\n  border-collapse:separate;\n\
    \  width:400px;\n  border-spacing:10px;\n}\n</style>\n</head>\n<body>\n\n<table\
    \ class=\"one\">\n<caption>Collapse Border Example</caption>\n<tr><td class=\"\
    a1\"> Cell 1 Collapse Example</td></tr>\n<tr><td class=\"2\"> Cell 2 Collapse\
    \ Example</td></tr>\n</table>\n<br />\n\n<table class=\"two\">\n<caption>Separate\
    \ Border Example</caption>\n<tr><td class=\"1\"> Cell 1 Separate Example</td></tr>\n\
    <tr><td class=\"2\"> Cell 2 Separate Example</td></tr>\n</table>\n\n</body>\n\
    </html\n```\n\n### Caption-Side\n\nThis property allows you to specify the position\
    \ of the `<caption>` element in relation to the table. It can use these values:\
    \ top, bottom, right.\n\n```html\n<html\n<head>\n<style type=\"text/css\">\ncaption.top\
    \ {side:top}\ncaption.bottom {side:bottom}\ncaption.left {side:left}\ncaption.right\
    \ {side:right}\n</style>\n</head>\n<body>\n\n<table class=\"one\">\n<caption class=\"\
    top\">Top Caption</caption>\n<tr><td class=\"a1\"> Cell 1 Collapse</td></tr>\n\
    <tr><td class=\"2\"> Cell 2 Collapse</td></tr>\n</table>\n\n<table class=\"two\"\
    >\n<caption class=\"bottom\">Bottom Caption</caption>\n<tr><td class=\"1\"> Cell\
    \ 1 Separate</td></tr>\n<tr><td class=\"2\"> Cell 2 Separate</td></tr>\n</table>\n\
    \n</body>\n</html\n```\n\n```>\n\n### Empty-Cells\n\nThis property is used to\
    \ indicate if an empty cell should have a border or not. It can have one of three\
    \ value: hide, show, inherit. This example shows the\n\n```html\n<html\n<head>\n\
    <style type=\"text/css\">\ntable.empty{\nwidth:350px;\nempty-cells:hide;\n}\n\
    td.empty{\nborder-style:dotted;\nborder-width:1px;\nborder-color:#999999;\n}\n\
    </style>\n</head>\n<body>\n\n<table class=\"empty\">\n<caption>Empty Cells Example</caption>\n\
    <tr><td class=\"a1\"> Cell 1</td></tr>\n<tr><td class=\"empty\"></td></tr>\n<tr><td\
    \ class=\"2\"> Cell 2</td></tr>\n</table>\n\n```\n\n>\n\n<tr><td class=\"a1\"\
    > Cell 1</td></tr>\n<tr><td class=\"2\"> Cell 2</td></tr>\n</table>\n\n</body>\n\
    </html\n```\n\n### Table-Layout\n\nThis property is meant to help you control\
    \ how the browser lays out or renders a table. It can have one of three value:\
    \ inherit, auto or fixed. The next example shows the\n\n```html\n<html\n<head>\n\
    <style type=\"text/css\">\ntable.auto {\n  table-layout: auto\n}\n\ntable.fixed{\n\
    \  table-layout: fixed\n}\n</style>\n</head>\n<body>\n\n<table class=\"auto\"\
    \ border=\"1\" width=\"100%\">\n<caption>Auto Layout Example</caption>\n<tr><td\
    \ class=\"a1\"> Cell 1</td></tr>\n<tr><td class=\"2\"> Cell 2</td></tr>\n</table>\n\
    <br />\n\n<table class=\"fixed\" border=\"1\" width=\"100%\">\n<caption>Fixed\
    \ Layout Example</caption>\n<tr><td class=\"a1\"> Cell 1</td></tr>\n<tr><td class=\"\
    2\"> Cell 2</td></tr>\n</table>\n\n</body>\n</html\n```\n"
  mdcn: "\n\n## 第 10 章：链接\n\n在本章中，我们将介绍如何使用 CSS 来设置超链接的属性。可以设置以下属性：\n\n- **link**\
    \ 用于标记未访问过的超链接。\n- **visited** 用于标记已访问过的超链接。\n- **hover** 用于标记鼠标指针悬停在顶方的元素。\n\
    - **active** 用于标记当前正在被点击的元素。\n\n通常，这些属性存储在 HTML 文档的头部（header）部分中。请记住以下规则以进行有效使用：\n\
    \n- 在 CSS 定义中，a:hover 位于 a:link 和 a:visited 之后\n- a:active 位于 a:hover 之后，如下例所示：\n\
    \n```css\n<style type=\"text/css\">\na:link { color: #000000 }\na:visited { color:\
    \ #006600 }\na:hover { color: #FFC000 }\na:active { color: #FF00CC }\n</style>\n\
    ```\n\n接下来，我们将查看这些属性如何用于超链接实现不同的效果。\n\n### 设置颜色\n\n此示例展示了如何使用任何有效格式的任何颜色名称值来设置链接颜色：\n\
    \n```html\n<html\n<head>\n<style type=\"text/css\">\na:link { color: #000000 }\n\
    </style>\n</head>\n<body>\n<a href=\"\">链接</a>\n</body>\n</html\n```\n\n结果将是一个黑色链接。请注意，这些链接中没有一个是可以点击的；它们仅用于演示。\n\
    \n[链接](#)\n\n### 已访问链接的颜色\n\n此示例展示了如何设置已访问链接的颜色，同样可以使用任何有效格式的任何颜色名称值：\n```html\n\
    <html\n<head>\n<style type=\"text/css\">\na:visited {color: #006600}\n</style>\n\
    </head>\n<body>\n<a href=\"\">链接</a>\n</body>\n</html\n```\n\n结果将是如下链接：初始为黑色，被点击后变为绿色。\n\
    [链接](#)\n\n### 鼠标悬停时的链接颜色\n\n此示例展示了当我们将鼠标指针悬停在链接上时，如何更改链接颜色：\n```html\n<html\n\
    <head>\n<style type=\"text/css\">\na:hover {color: #FFCC00}\n</style>\n</head>\n\
    <body>\n<a href=\"\">链接</a>\n</body>\n</html\n```\n\n结果将是一个黑色链接，当鼠标悬停在上方时会变为黄色。\n\
    [链接](#)\n\n### 激活链接的颜色\n\n此示例展示了如何更改激活链接的颜色：\n```html\n<html\n<head>\n<style type=\"\
    text/css\">\n a:active { color: #FF00CC }\n</style>\n</head>\n<body>\n<a href=\"\
    \">链接</a>\n</body>\n</html\n```\n\n结果将是一个黑色链接，当被点击时会变为粉色。\n\n[链接](#)\n\n## 第 11\
    \ 章：表格\n\n在本章中，我们将介绍可以为 HTML 表格设置的属性。这些属性包括：\n\n- Border-collapse（边框合并）——这指定表格单元格是保持自身的外观，还是由浏览器控制相邻的边框\n\
    - Border-spacing（边框间距）——这指定表格单元格之间空间的宽度\n- Caption-size（标题大小）——这些位于 `<caption>`\
    \ 元素中并进行渲染，默认在表格之前\n- Empty-cells（空单元格）——这指定空单元格上是否应该显示边框\n- Table-layout（表格布局）——这允许浏览器通过使用列中找到的第一个宽度属性来加速表格布局，而无需加载加载并渲染表格\n\
    \n接下来我们通过示例来查看这些属性。\n\n### Border-Collapse（边框合并）\n\n该属性有两个值：collapse（合并）和 separate（分离）。此示例使用了\n\
    \n```html\n<html\n<head>\n<style type=\"text/css\">\ntable.one {border-collapse:collapse;}\n\
    table.two {border-collapse:separate;}\ntd.a {\nborder-style:dotted;\nborder-width:3px;\n\
    border-color:#000000;\npadding: 10px;\n}\ntd.b {\nborder-style:solid;\nborder-width:3px;\n\
    border-color:#333333;\npadding:10px;\n}\n</style>\n</head>\n\n<table class=\"\
    one\">\n<caption>边框合并示例</caption>\n<tr><td class=\"a1\"> 单元格 1 合并示例</td></tr>\n\
    <tr><td class=\"2\"> 单元格 2 合并示例</td></tr>\n</table>\n<br />\n\n<table class=\"\
    two\">\n<caption>边框分离示例</caption>\n<tr><td class=\"1\"> 单元格 1 分离示例</td></tr>\n\
    <tr><td class=\"2\"> 单元格 2 分离示例</td></tr>\n</table>\n\n</body>\n</html\n```\n\n\
    这将给你以下结果：\n\n| 边框合并： |\n| 单元格 1 合并示例 |\n| 单元格 2 合并示例 |\n\n| 边框分离： |\n| 单元格 1 分离示例\
    \ |\n| 单元格 2 分离示例 |\n\n### Border-Spacing（边框间距）\n\n该属性指定相邻单元格边框之间的距离。它可以取两个值之一，每个值都应该是长度单位。一个值适用于水平和垂直边框，而使用两个值将分别引用垂直和水平边框。\n\
