    \n## 简介\n\nHTML 或“超文本标记语言”是开发网页最常用的语言。它由 Berners-Lee 于1991年创建。标准 HTML 规范 HTML\
    \ 2.0 于 1995 年发布。该语言的另一个主要版本 HTML 4.01 于 1999 年后期发布。这是最广泛使用的 HTML 版本，现在已被 2012\
    \ 年发布的 HTML 5 所代。这基本上是其之前版本 HTML 4.01 的扩展。\n\n它是用来做什么的？\n\n这本 HTML 教程专为有抱的开发者和网页设计师设计。本教程通过实用的示例和简单的概述进行了详细的解释，以便初学者可以轻松理解，并提供设计他们自己的网页所需的知识。通过一些练习，你可以获得更高水平的专业知识。\n\
    \n## 前提条件\n\n开始本教程的前提是你应该具有一些操作 Linux 操作系统或 Windows的基础知识。此外，你还应该熟悉：\n\n- 使用如 editplus、notepad、notepad++\
    \ 或任何其他文本编辑器。\n- 在电脑上创建文件和目录。\n- 在不同目录之间导航。\n- 不同的图像格式，如 PNG、JPG 等。\n- 在文件中输入内容并保存。\n\
    \n## 简介\n\n### 第1章：HTML 基础标签\n\n#### 标题标签\n\n标题标签用于定义网页中的标题。标题标签有六种尺寸，从 `<h1>`\
    \ 到 `<h6>`。`<h1>` 是最重要的标题，而 `<h6>` 是不重要的标题。\n\n<h1>Heading 1</h1>\n<h2>Heading\
    \ 2</h2>\n<h3>Heading 3</h3>\n<h4>Heading 4</h4>\n<h5>Heading 5</h5>\n<h6>Heading\
    \ 6</h6>\n\n#### 段落标签\n\n段落标签用于定义文本段落。段落是用 `<p>` 标签定义的。浏览器会在段落前后自动添加空格。\n\n<p>这是一个段落。</p>\n\
    <p>这是另一个段落。</p>\n\n#### 换行标签\n\n`<br>` 标签用于在文本中插入换行。它是一个空标签，意味着它没有闭合标签。\n\n<p>这是一个带有<br>换行的段落。</p>\n\
    \n#### 分割线标签\n\n`<hr>` 标签用于创建一条水平线以分隔内容。它也是一个空标签。\n\n<p>线上的某些文本。</p>\n<hr>\n<p>线下的某些文本。</p>\n\
    \n#### 列表标签\n\n列表用于将相关项目组合在一起。HTML 中有两种列表：有序列表和无序列表。\n\n#### 无序列表\n\n无序列表用 `<ul>`\
    \ 标签定义。每个列表项目用 `<li>` 标签定义。\n\n<ul>\n  <li>第一项</li>\n  <li>第二项</li>\n  <li>第三项</li>\n\
    </ul>\n\n#### 有序列表\n\n有序列表用 `<ol>` 标签定义。每个列表项目用 `<li>` 标签定义。\n\n<ol>\n  <li>第一项</li>\n\
    \  <li>第二项</li>\n  <li>第三项</li>\n</ol>\n\n#### 图片标签\n\n`<img>` 标签用于在网页中嵌入图像。它是一个空标签，需要\
    \ `src` 属性来指定图像路径。\n\n<img src=\"image.jpg\" alt=\"图像描述\" width=\"500\" height=\"\
    600\">\n\n## 第2章：HTML 元素\n\n#### HTML 属性\n\nHTML 属性用于为元素提供额外信息。它们始终在起始标签中指定，通常以\
    \ name=\"value\" 的形式出现。\n\n<a href=\"https://www.google.com\">指向 Google 的链接</a>\n\
    <img src=\"logo.png\" alt=\"标志\">\n\n## 第3章：HTML 格式化\n\n#### 格式标签\n\n格式标签用于更改文本的外观。\n\
    \n#### 粗体和斜体\n\n`<b>` 标签用于加粗文本，`<i>` 标签用于使文本斜体。\n\n<b>这些文本是粗体。</b>\n<i>这些文本是斜体的。</i>\n\
    \n#### 高亮和下划线\n\n`<mark>` 标签用于高亮文本，`<u>` 标签用于添加下划线。\n\n<mark>这些文本被高亮了。</mark>\n\
    <u>这些文本有下划线。</u>\n\n#### 下标和上标\n\n`<sub>` 标签用于下标，`<sup>` 标签用于上标。\n\nH<sub>2</sub>O\
    \ 是水。\nE = mc<sup>2</sup>\n\n"
