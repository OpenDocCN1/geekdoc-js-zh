    # Chapter 2: CSS Modules


    CSS modules take on the existing CSS specifications along with a number of extension
    features, including:


    +   - Selectors

    - Box Model

    - Image Values

    - Backgrounds and borders

    - Replaced content

    - Text effect

    - D and 3D transformations

    - Animations

    - Multiple column layout

    - Use Interface


    CSS is made up of a number of style rules that are interpreted by the browser
    before being applied to the right element of the document. Style rules are split
    into three:


    Selector - this is the HTML tag that the style is applied to. Examples of these
    tags are, <h1> and <table>.


    +   - Property – Properties are types of HTML ta attributes. In simple terms,
    all HTML attributes are changed to CSS properties, for example, color border,

    - Value – Each property is assigned a value or value. For example, the color property
    may have a value of red or perhaps #F2F2F2,


    The syntax for a CSS style rule is:


    ```

    selector { property: value }

    ```


    For example, you could define a border on a table as:


    ```

    table{ border :1px solid #C00; };

    ```


    In this example, the table is a selector and border is a property. It has been
    given a value of 1px solid #C00 Selectors can be defined in a number of ways so
    let''s look at each one:


    # Type Selectors


    You saw an example of the Type selector above but let''s look at another - a way
    of adding a color to all of the level 1 headings:


    # h1 {


    ```

    color: #36CFFFF;

    ```


    ```

    }

    ```


    # Universal Selector


    Instead of selecting the elements that relate to a specific type, this selector
    just matches the names of the element type. For example:


    ```

    {

    ```


    ```

    color: #000000;

    ```


    ```

    }

    ```


    In this example, the content of all the elements has been turned to black'
- md: "\n## Descendant Selectors\n\nSpecific selectors allow you to give a particular\
    \ element a style but only when it is inside a specific element. In the following\
    \ example, we are applying the style rule to the <em> element but only when it\
    \ is outside of the `<ul>` tag:\n\n```css\nem {\ncolor: #000000;\n}\n```\n\n##\
    \ Class Selectors\n\nClass selectors allow you to use the class attribute of the\
    \ elements to define your style rules. All of the elements of that particular\
    \ class are formatted as per the defined rule:\n\n```css\n.black {\ncolor: #000000;\n\
    }\n```\n\nIn this example, the rule has turned the content of all the elements\
    \ with the class attribute of black to the color black. You could go one step\
    \ further if you like:\n\n```css\nh1.black {\ncolor: #000000;\n}\n```\n\nNow you\
    \ have specified that only the content inside the `<h1>` element with a class\
    \ attribute of black will be turned to black.\n\nYou are not limited to just one\
    \ class selector for an element though. Look at this example:\n\n```html\n<p class=\"\
    center bold\">\nThe style of this paragraph is defined by the classes Bold and\
    \ Center\n</p>\n```\n\n## ID Selectors\n\nStyle rules can be defined on the id\
    \ attribute of an element and, when a rule is defined, it will format all elements\
    \ with the specified id attribute:\n\n```css\n#black {\ncolor: #000000;\n}\n```\n\
    \nThis rule will turn the content of all elements that has the id attribute to\
    \ black. You can be a bit more specific if you like, for example:\n\n```css\n\
    h1#black {\ncolor: #000000;\n}\n```\n\nThis rule turns the content for `<h1>`\
    \ elements to black ONLY if the id attribute is set to black.\n\nThe power of\
    \ an id selector becomes known when they are used as foundations for the descendant\
    \ selector:\n\n```css\n#black h2 {\ncolor: #000000;\n}\n```\n\nHere, you can see\
    \ that all of the level 2 headings will be turned to black only when they lie\
    \ inside a tag that has the id attribute set as black\n\n## Child Selectors\n\n\
    The child selector is similar to the descendant selector but with different functionality.\
    \ Look at this example:\n\n```css\nbody > p {\ncolor: #000000;\n}\n```\n\nThis\
    \ will turn the paragraphs to black only if they are the direct child of the `<body>`\
    \ element. Other paragraphs that are inside other elements, like `<td>` or `<div>`\
    \ would not change.\n\n## Attribute Selectors\n\nStyles can also be applied to\
    \ HTML elements that have specific attributes. Look at the example below; you\
    \ can see that the style rule is going to match all the input elements that have\
    \ a type attribute with a text value:\n\n```css\ninput [type = \"text\"] {\ncolor:\
    \ #000000;\n}\n```\n\nThe advantage to using this method is that `<input type=\"\
    submit\" />` is not affected and the color change only applied to certain text\
    \ fields.\n\nThe following rules are for the attribute selector:\n\n- p[lang]\
    \ - this selects all of the paragraph elements that have a lang attribute\n- p[lang=\"\
    fr\"] - this selects all the paragraph elements with lang attributes that have\
    \ an exact value of \"fr\"\n- p[lang^=\"fr\"] - this selects all the paragraph\
    \ elements that have a lang attribute containing \"fr\"\n- p[lang~=\"en\"] - this\
    \ selects all the paragraph elements with a lang attribute containing exact values\
    \ of \"en\" or that start with \"en\".\n\n## Multiple Style Rules\n\nMultiple\
    \ style rules can be defined for one single element and should be defined to combine\
    \ a number of properties and their corresponding value into one block, as in this\
    \ example:\n\n```css\nh1 {\ncolor: #36C;\nfont-weight: normal;\nletter-spacing:\
    \ .4em;\nmargin-bottom: 1em;\ntext-transform: lowercase;\n}\n```\n\nIn this example,\
    \ you can see the pairs of properties and their value are each separated by a\
    \ semi-colon (;). They can stay in one single line or you can spread them over\
    \ multiple lines but, to read them better, we have kept them on single lines.\n\
    \n## Grouping Selectors\n\nStyles can be applied to multiple selectors. You just\
    \ have to remember to separate each with a comma, as shown in this example:\n\n\
    ```css\nh1, h2, h3 {\n  color: #36C;\n  font-weight: normal;\n  letter-spacing:\
    \ .4em;\n  margin-bottom: 1em;\n  text-transform: lowercase;\n}\n```\n\nThis style\
    \ rule will apply to all of the h1, h2 and h3 elements as well. The order in the\
    \ list is not relevant because all of the elements in the selector are going to\
    \ have the declarations applied to them. As you can see from the example below,\
    \ various class selectors can be combined:\n\n```css\n#content, #footer, #supplement\
    \ {\n  position: absolute;\n  left: 510px;\n  width: 200px;\n}\n```\n\n## Chapter\
    \ 3: Inclusion\n\nYou have four ways of associating styles with HTML documents,\
    \ the most common of which is the inline CSS and the External CSS methods.\n\n\
    ## Embedded CSS\n\nCSS rules can be put into an HTML document with the use of\
    \ the `<style>` element. The tag goes inside the `<head>...</head>` tag and the\
    \ rules that are defined with this syntax are applicable to all of the available\
    \ elements. The following example shows an embedded CSS style element:\n\n```html\n\
    <head>\n<style>\n  body {\n    color: maroon;\n    margin-left: 40px;\n  }\n \
    \ h1 {\n    color: #36C;\n  }\n  p {\n    font-size: 14px;\n  }\n</style>\n</head>\n\
    <body>\n<h1>This is a heading</h1>\n<p>This is a paragraph.</p>\n</body>\n</html>\n\
    ```\n\n## Inline CSS\n\nYou can also use style attributes on HTML elements to\
    \ define rules. The following example is based on:\n\n```html\n<h1 style=\"color:#36C;\"\
    >This is a heading</h1>\n```\n\n## External CSS - The <link> Element\n\nYou can\
    \ use the `<link>` element as a way of including an external stylesheet. External\
    \ stylesheets are separate files that have a .css extension. You can be added\
    \ to any HTML document using the `<link>` element. The generic syntax is:\n\n\
    ```html\n<head>\n<link type=\"text/css\" href=\"...\" media=\"...\" />\n</head>\n\
    ```\n\nThe attributes associated with the `<link>` elements are as follows:\n\n\
    | Attribute | Value | Description |\n|---|---|---|\n| type | text/css | This specifies\
    \ the language for the style sheet as a MIME content type |\n| href | URL | This\
    \ specifies the stylesheet has style rules and is also a required attribute |\n\
    | media | Screen | This specifies which devices the document can be displayed\
    \ on and is an optional attribute |\n| tty | | The default value is all |\n| projection\
    \ | | |\n| handheld | | |\n| print | | |\n| braille | | |\n| aural | | |\n| all\
    \ | | |\n\nAs an example, consider a style sheet called mystyle.css with these\
    \ rules:\n\n```css\nh1, h2, h3 {\n  color: #36C;\n  font-weight: normal;\n  letter-spacing:\
    \ .4em;\n  margin-bottom: 1em;\n  text-transform: lowercase;\n}\n```\n\nNow, using\
    \ the following code, you can add this file to any HTML document:\n\n```html\n\
    <head>\n<link type=\"text/css\" href=\"mystyle.css\" media=\"all\" />\n</head>\n\
    ```\n\n## Imported CSS - @import Rule\n\nThe @import rule is used to import external\
    \ stylesheets in a similar way to the `<link>` element. The generic syntax is:\n\
    \n```html\n<head>\n@import \"URL\";\n</head>\n```\n\nIn this syntax, URL is used\
    \ as the URL of the specific styles that contains the style rules. Another way\
    \ of writing it would be:\n\n```html\n<head>\n@import url(\"URL\");\n</head>\n\
    ```\n\nThe following example shows you how to import the style sheet to the HTML\
    \ document:\n\n```html\n<head>\n@import \"mystyle.css\";\n</head>\n```\n"
  mdcn: "\n\n## 后代选择器\n\n特定的选择器允许你为某个元素设置样式，但仅当它位于某个特定元素内部时生效。在下面的示例中，我们对 <em> 元素应用样式规则，但仅当它位于\
    \ `<ul>` 标签之外时：\n\n```css\nem {\ncolor: #000000;\n}\n```\n\n## 类选择器\n\n类选择器允许你使用元素的类（class）属性来定义样式规则。所有特定类的元素都将按照定义的规则进行格式化：\n\
    \n```css\n.black {\ncolor: #000000;\n}\n```\n\n在这个示例中，该规则将所有具有 `black` 类属性的元素的内容都变成了黑色。如果你愿意，可以更进一步：\n\
    \n```css\nh1.black {\ncolor: #000000;\n}\n```\n\n现在，你指定了只有具有 `black` 类属性的 `<h1>`\
    \ 元素内部的内容会被变为黑色。\n\n不过，一个元素并不局限于只能使用一个类选择器。看这个示例：\n\n```html\n<p class=\"center\
    \ bold\">\n  此段落的样式由 Bold 和 Center 类定义\n</p>\n```\n\n## ID 选择器\n\n样式规则可以定义在元素的\
    \ id 属性上，当定义了该规则时，它将格式化所有具有指定 id 属性的元素：\n\n```css\n#black {\ncolor: #000000;\n\
    }\n```\n\n此规则将所有具有 id 属性的元素的内容变为黑色。如果你愿意，可以做得更具体一点，例如：\n\n```css\nh1#black {\n\
    color: #000000;\n}\n```\n\n此规则**仅**在 id 属性设置为 black 时，才会将 `<h1>` 元素的内容变为黑色。\n\n\
    当 id 选择器被用作后代选择器的基础时，它的威力就显现出来了：\n\n```css\n#black h2 {\ncolor: #000000;\n}\n\
    ```\n\n在这里，你可以看到，只有当所有的二级标题都位于 id 属性设置为 black 的标签内部时，它们才会被变为黑色。\n\n## 子元素选择器\n\
    \n子选择器与后代选择器类似，但功能不同。看这个示例：\n\n```css\nbody > p {\ncolor: #000000;\n}\n```\n\n\
    这只有在段落是 `<body>` 元素的直接子元素时才会将其变为黑色。其他元素（如 `<td>` 或 `<div>`）内部的段落将不会改变。\n\n## 属性选择器\n\
    \n样式也可以应用于具有特定属性的 HTML 元素。看下面的示例；你可以看到样式规则将匹配所有具有 type 属性且其值为文本的 input 元素：\n\n\
    ```css\ninput [type = \"text\"] {\ncolor: #000000;\n}\n```\n\n使用这种方法的优点是 `<input\
    \ type=\"submit\" />` 不受影响，且颜色变化仅应用于某些文本字段。\n\n以下规则用于属性选择器：\n\n-   p[lang] - 这选择所有具有\
    \ lang 属性的段落元素\n-   p[lang=\"fr\"] - 这选择所有 lang 属性取值恰好为 \"fr\" 的段落元素\n-   p[lang^=\"\
    fr\"] - 这选择所有 lang 属性包含 \"fr\" 的段落元素\n-   p[lang~=\"en\"] - 这选择所有 lang 属性包含精确值\
    \ \"en\" 或以 \"en\" 开头的段落元素\n\n## 多条样式规则\n\n可以为单个元素定义多条样式规则，并且应该将多个属性及其对应的值合并到一个块中进行定义，如下示例所示：\n\
    \n```css\nh1 {\ncolor: #36C;\nfont-weight: normal;\nletter-spacing: .4em;\nmargin-bottom:\
    \ 1em;\ntext-transform: lowercase;\n}\n```\n\n在这个示例中，你可以看到属性对和它们的值之间都用分号（；）隔开。它们可以保持在单行内，也可以分布在多行中，但为了便于阅读，我们将它们保持在单行中。\n\
    \n## 分组选择器\n\n样式可以应用于多个选择器。你只需要记住用逗号将它们隔开，如下示例所示：\n\n```css\nh1, h2, h3 {\n  color:\
    \ #36C;\n  font-weight: normal;\n  letter-spacing: .4em;\n  margin-bottom: 1em;\n\
    \  text-transform: lowercase;\n}\n```\n\n此样式规则也将应用于所有的 h1、h2 和 h3 元素。列表中的顺序并不重要，因为选择器中的所有元素都将应用这些声明。如下面的示例所示，各种类选择器可以组合使用：\n\
    \n```css\n#content, #footer, #supplement {\n  position: absolute;\n  left: 510px;\n\
    \  width: 200px;\n}\n```\n\n## 第3 章：包含\n\n你有四种将样式与 HTML 文档关联的方法，最常见的是内联 CSS 和外部\
    \ CSS 方法。\n\n## 嵌入式 CSS\n\n `<style>` 元素将 CSS 规则放入 HTML 文档中。该标签放在 `<head>...</head>`\
    \ 标签内部，用这种语法定义的规则适用于所有可用元素。下面的示例显示了一个嵌入式 CSS 样式元素：\n\n```html\n<head>\n<style>\n\
    \  body {\n    color: maroon;\n  }\n  h1 {\n    color: #36C;\n  }\n  p {\n   \
    \ font-size: 14px;\n  }\n</style>\n</head>\n<body>\n<h1>这是一个标题</h1>\n<p>这是一个段落。</p>\n\
    </body>\n```\n\n## 内联 CSS\n\n你也可以在 HTML 元素上使用 style 属性来定义规则。如下：\n\n```html\n<h1\
    \ style=\"color:#36C;\">这是一个标题</h1>\n```\n\n## 外部 CSS - <link> 元素\n\n你可以使用 `<link>`\
    \ 元素作为引入外部样式表的方法。外部样式是具有 .css 扩展名的独立文件。可以使用 `<link>` 将添加到任何 HTML 文档中。通用语法为：\n\n\
    ```html\n<head>\n<link type=\"text/css\" href=\"...\" media=\"...\" />\n</head>\n\
    ```\n\n与 `<link>` 相关的属性如下：\n\n| 属性 | 值 | 说明 |\n|---|---|---|\n| type | text/css\
    \ | 指定样式表的 MIME 类型 |\n| href | URL | 指定样式，是必选属性 |\n| media | Screen | 指定文档可以在哪些设备上显示，是可选属性\
    \ |\n| tty | | 默认值为 all |\n| projection | | |\n| handheld | | |\n| print | | |\n\
    | braille | | |\n| aural | | |\n| all | | |\n\n例如，考虑名为 mystyle.css 的样式表，包含以下规则：\n\
    \n```css\nh1, h2, h3 {\n  color: #36C;\n  font-weight: normal;\n  letter-spacing:\
    \ .4em;\n  margin-bottom: 1em;\n  text-transform: lowercase;\n}\n```\n\n现在，使用下面的代码，可以将此文件添加到任何\
    \ HTML 文档中：\n\n```html\n<head>\n<link type=\"text/css\" href=\"mystyle.css\" media=\"\
    all\" />\n</head>\n```\n\n## 导入 CSS - @import 规则\n\n@import 规则用于类似于 `<link>` 元素导入外部样式表。通用语法为：\n\
    \n```html\n<head>\n@import \"URL\";\n</head>\n```\n\n在此语法中，URL 被用于包含样式规则的特定样式地址。另一种写法是：\n\
    \n```html\n<head>\n@import url(\"URL\");\n</head>\n```\n\n下面的示例显示了如何将样式表导入到 HTML\
    \ 文档中：\n\n```html\n<head>\n@import \"mystyle.css\";\n</head>\n```\n\n"
