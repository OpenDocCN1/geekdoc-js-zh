    Images are an important part of websites, and although you shouldn't use too many,\
    \ those do should be of good quality and in the right place. CSS helps to control\
    \ the display of these images by allowing you to set the following properties:\n\
    \n- Border – this is used to set the border the image\n- Height – this is used\
    \ to set the height of the image\n- Width – this is used to set the width of the\
    \ image\n- most-opacity – this is used to determine the opacity of the image\n\
    \n# Image Border\n\nThis property is used to set the width of the image and can\
    \ use values of length or %. For example:\n\n```html\n<html\n<head>\n</head>\n\
    <body>\n<img style=\"border:0px;\" src=\"/css/images/logo.png\" />\n<br />\n<img\
    \ style=\"border:3px dashed red;\" src=\"/css/images/logo.png\" />\n</body>\n\
    </html>\n```\n\nThe result will be a logo without a border and then a logo with\
    \ a dotted red border\n\n# Image Height\n\nThis property is used to set how high\
    \ an image is and can use values of length or %. When you use %, the value is\
    \ applied to the box which the image is in:\n\n```html\n<html\n<head>\n</head>\n\
    <body>\n<img style=\"border:1px solid red; height:100px;\" src=\"/css/images/logo.png\"\
    \ />\n<br />\n<img style=\"border:1px solid red; height:50%;\" src=\"/css/images/logo.png\"\
    \ />\n</body>\n</html>\n```\n\nThe result will be two logos, exactly the same,\
    \ but one taller than the other\n\n# Image Width\n\nThis is used to set the width\
    \ of an image using value of % or length. As with height, using percentage applies\n\
    \n```html\n<html\n<head>\n</head>\n<body>\n<img style=\"border:1px solid red;\
    \ width:150px;\" src=\"/css/images/logo.png\" />\n<br />\n<img style=\"border:1px\
    \ solid red; width:100%;\" src=\"/css/images/logo.png\" />\n</body>\n</html>\n\
    ```\n\nThe result will be two identical logos but of different sizes\n\n# -Moz-Opacity\n\
    \nThe final property is to set up the opacity of the image and is used with Mozilla\
    \ Firefox. For Internet Explorer, we use **filter:alpha(opacity:x)**, to come\
    \ up transparent images.\n\nIn Mozilla Firefox, in the property (**moz-opacity:x**),\
    \ x may hold a value of anywhere between 0.0 and 1.0. The lower value, the more\
    \ transparent the image. By the same token, in Internet Explorer **(filter:alpha(opacity=x))**,\
    \ the value of x can be anywhere between 0 and 100. Again, the lower value, the\
    \ more transparent the image is.\n\n```html\n<html\n<head>\n</head>\n<body>\n\
    <img style=\"border:1px solid red;-moz-opacity:0.4;filter:alpha(opacity=40);\"\
    \ src=\"/css/images/logo.png\" />\n</body>\n</html>\n```\n\nThe result will be\
    \ a logo with a border of solid red.\n"
