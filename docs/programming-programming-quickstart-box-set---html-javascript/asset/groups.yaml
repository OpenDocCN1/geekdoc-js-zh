    # Introduction


    CSS, the shortened version of Cascading Style Sheets, is one of the simplest of
    all the design languages, the one you need to use for the most effective web design.
    CSS will handle how your webpages look and how they feel; you can set the text
    color, the font style, how much space there is between each paragraph, how the
    web page columns are laid out and sized, the colors and images needed for the
    background and all the the other layout and design variations that you need to
    make your website work on all different screen sizes and devices.


    CSS is incredibly easy to understand and learn and it gives you powerful control
    over how your HTML document are presented. It commonly combines with two of the
    more popular markup languages, HTML or XHTML, to provide you with all the tools
    you need to produce a well-designed website.


    For the purpose of this book, I am going to take you through all of the main aspects
    of web design that you can control CSS, together with sample code. I hope that,
    by the end of it, you have some idea of how easy CSS is to use and the amazing
    results you can produce.'
