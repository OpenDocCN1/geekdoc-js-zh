    # Example for Centering the Content


    ```

    <title>

    </title>

    <body>

    <p>This text has the default alignment.</p>

    <center>

    <p>This text is centered.</p>

    </center>

    </body>

    </html>

    ```


    This code will produce the following output:


    This text has the default alignment.


    This text is centered.


    # Horizontal Lines


    You can visually break up the sections present in a document using the Horizontal
    Lines. The <hr> tag is used for creating a horizontal line from the left margin
    to the right margin. This will break the line accordingly. For instance, if you
    want to insert line break in between two paragraphs, you can use the code given
    below.


    Example


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Example for Horizontal Line</title>

    </head>

    <body>

    <p>This is the first paragraph. This is on the top of the line break.</p>

    <hr />

    <p>This is the second paragraph. This is at the bottom of the line break. </p>

    </body>

    </html>

    ```


    The above code will produce the following output:


    This is the first paragraph. This is on the top of the line break.


    This is the second paragraph. This is at the bottom of the line break.


    The <hr /> tag is also categorized as an **empty** element. This doesn''t need
    opening tags and closing tags as there is no content going in between. There is
    a space between the characters hr and / in the <hr /> element. If the space is
    omitted, older versions of browsers will have problem with the rendering the horizontal
    line and if the / is missed, it won''t be a valid element in XHTML.'
- md: "\n## Preserve Formatting\n\nIn some cases text should follow the same format\
    \ as it is entered in the HTML document. You can make use of the `<pre>` tag in\
    \ such cases. It means preformatted text.\n\nAny text you entered between the\
    \ tags `&lt;pre&gt;` and `&lt;/pre&gt;` will have the same text format as seen\
    \ in the source document. Here is an example.\n\nExample\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Example for Preserve Formatting</title>\n</head>\n<body>\n\
    <pre>\nint main(void) {\n  printf(\"Hello World!\\n\");\n  // return 0;\n}\n</pre>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following output.\n\n\
    ```\nint main(void) {\n  printf(\"Hello World!\\n\");\n  // return 0;\n}\n```\n\
    \n## Nonbreaking Spaces\n\nIn some cases you do not want your browser to split\
    \ the words across lines. In such cases you can use the nonbreaking space entity\
    \ `&nbsp;` instead of using the normal space. Have a look at the following example\
    \ for a better understanding.\n\nExample\n\nLet us use the words James Bond 007\
    \ for our example and we do not want the browser to split these words. We will\
    \ add to the nonbreaking space entity `&nbsp;` instead of space. \n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Example for Nonbreaking Spaces</title>\n</head>\n\
    <body>\n<p>\nThe agent in the movie is \"James&nbsp;nbsp;Bond&nbsp;007.\"</p>\n\
    </body>\n</html>\n```\n\n## Chapter 2: HTML Elements\n\nAn element in a family\
    \ will be defined by a starting tag. If other content can be contained within\
    \ the element, it will have a closing tag. For the closing tag, the name of the\
    \ element will be preceded with a / .. Some of each elements are given below.\n\
    \n| Start Tag | Content | End Tag |\n| --- | --- | --- |\n| `<i>` | This is italic\
    \ font content | `</i>` |\n| `<marquee>` | This is marquee text content. | `</marquee>`\
    \ |\n| `<p>` | This is paragraph content. | `</p>` |\n| `<br />` | | |\n\nHere,\
    \ `<i>` and `</img>` is an element, `<marquee>` and `</marquee>` is another element.\
    \ There are a few HTML elements that doesn't need closing tags, such as `<br />`,\
    \ `<hr>`, `<img>`, etc. The HTML elements which doesn't require closing tags are\
    \ called as **void elements.**\n\nThe HTML document has a tree for these elements\
    \ and this tree specifies on how the documents of HTML should be built. It also\
    \ specifies the type of content that is to be placed in what part of the document.\n\
    \n## HTML vs. Element\n\nAn element of HTML will be defined using a starting tag.\
    \ If other content is placed inside it, it will have a closing tag.\n\nFor instance,\
    \ `<i>` is the starting tag for italic text and `</img>` is the closing tag for\
    \ it. But, `<i>This text is italic</i>` is a italic text element.\n\n## Nested\
    \ Elements in HTML\n\nHTML allows you to nest HTML elements within other HTML\
    \ elements. Here is an example:\n\nExample\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>Example for Nested Elements</title>\n</head>\n<body>\n<h2>This is a <b>bold</b>\
    \ heading</h2>\n<p>This is is <i>italic</i> text</p>\n</body>\n</html>\n```\n\n\
    The above code will produce the following output:\n\n# bold heading\n\nThis is\
    \ **italic** text\n\n## Attributes\n\nTill now, we have seen some of the tags\
    \ like paragraph tag `<p>`, heading tags `<h1>`, `<h2>` and a few other tags in\
    \ the most simple form. These bags can be given some extra information known as\
    \ attributes.\n\nThe characteristics of an element in HTML can be defined using\
    \ an attribute. This will be placed inside the opening tag of the element and\
    \ it contains two parts, **name** and **value**.\n\n- The **name** of the attribute\
    \ is nothing but the property that you wish to set. For example, the font element\
    \ attributes like color, size, type, etc., which are used for indicating the font\
    \ color, font size and type that is to be displayed on the page.\n- The **value**\
    \ of the attribute is nothing but the value for the property that you wish to\
    \ set. The value of an attribute should always be placed inside quotations. The\
    \ examples below will show you the values that can be given to the above given\
    \ **name**: Red, 3 and Georgia, for font color, size and type.\n\nYou should be\
    \ careful when using names and values for attributes, as they are case sensitive.\
    \ However, the W3C (World Wide Web Consortium), recommends the use of lowercase\
    \ attributes and attribute values in HTML 4.\n\nHere is an example.\n\nExample\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Align Attribute Example</title>\n\
    </head>\n<body>\n<p align=\"right\">This content will be aligned to the right</p>\n\
    <p align=\"center\">This content will be aligned to the center</p>\n<p align=\"\
    left\">This content will be aligned to the left</p>\n</body>\n</html>\n```\n\n\
    The above code will give us the following output:\n\nThis content will be aligned\
    \ to the right.\n\nThis content will be aligned to the center.\n\nThis content\
    \ will be aligned to the left.\n\n## Internationalization Attributes\n\nIn HTML,\
    \ there are a total of three internationalization attributes. These are available\
    \ for most of the XHTML elements, but not for all.\n\n- dir\n- lang\n- xml:lang\n\
    \nYou can specify the text flow direction to the browser using the dir attribute.\
    \ This attribute can take two values, as shown in the table given below.\n\n|\
    \ Value | Meaning |\n| --- | --- |\n| ltr | Left to right (this will be the default\
    \ value) |\n| rtl | Right to left (for languages such as Hebrew or Arabic that\
    \ are read right to left) |\n\nExample\n\n```\n<!DOCTYPE html>\n<html dir=\"rtl\"\
    >\n<head>\n<title>Display Directions</title>\n</head>\n<body>\nThis is IE 5 renders\
    \ right-to-left directed text.\n</body>\n</html>\n```\n\nThe above code will produce\
    \ the following output:\n\nThis is IE 5 renders right-to-left directed text.\n\
    \nIf the dir attribute is placed inside the `<html>` tag, it will determine how\
    \ the text of the entire document will be presented. If this attribute is used\
    \ inside another tag, it will just to control the direction of the text contained\
    \ in that specific tag.\n\n## The lang Attribute\n\nYou can indicate the main\
    \ language that is to be used in your document using the lang attribute. The only\
    \ reason for keeping this attribute in HTML is for the backwards compatibility\
    \ with previous versions of HTML. In the new XML documents, this attribute is\
    \ replaced with the xml:lang attribute.\n\nThe lang attributes have the values\
    \ as ISO 639 2-character language codes. You can check the complete list of language\
    \ codes with the [HTML Language Codes: ISO 639].\n\nExample\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n<title>English Language Page</title>\n</head>\n\
    <body>\nThis page is using English Language\n</body>\n</html>\n```\n\n## The xml:lang\
    \ Attribute is used as a replacement for the original lang attribute used in earlier\
    \ versions of HTML. As mentioned above, the xml:lang attribute value should be\
    \ an ISO-639 country code.\n\n## Generic Attributes\n\nThere are a few other attributes\
    \ that can be readily used with most of the tags. The list of those attributes\
    \ is given in the table below.\n\n| Attribute | Options | Function |\n| --- |\
    \ --- | --- |\n| align | right, left, center | Horizontally aligns tags |\n| valign\
    \ | top, middle, bottom | Vertically aligns tags within an element. |\n| bgcolor\
    \ | numeric, hexadecimal, RGB values | Places a background color behind |\n| background\
    \ | URL | Places a background image behind |\n| id | User Defined | Names an element\
    \ for use with Cascading Style Sheets. |\n| class | User Defined | Classifies\
    \ an element for use with Cascading Style Sheets. |\n| width | Numeric Value |\
    \ Specifies the width of tables, images, or cells. |\n| height | Numeric Value\
    \ | Specifies the height of tables, images, or cells. |\n| title | User Defined\
    \ | \"Pop-up\" title of the elements. |\n\n## Chapter 3: Formatting in HTML\n\n\
    If you are familiar using the word processor, you probably must also be similar\
    \ with making text bold, italicized or underlined. There are a total of 10 options\
    \ available in HTML and XHTML, which will indicate your text will.\n\n## Bold\
    \ Text\n\nAny content that is placed in between <b>...</b> element will be displayed\
    \ as bold text. Here is an example.\n\nExample\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>Example for Bold Text</title>\n</head>\n<body>\n<p>The following\
    \ word will be in a <b>bold</b> typeface.</p>\n</body>\n</html>\n```\n\nThe above\
    \ code will produce the following output:\n\nThe following word will be in a **bold**\
    \ typeface.\n\n## Italic Text\n\nAny content that is placed in between <i>...</i>\
    \ element will be displayed as italicized text. Here is an example.\n\nExample\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Example for Italic Text</title>\n\
    </head>\n<body>\n<p>The following word will be in a <i>italicized</i> typeface.</p>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following output:\n\n\
    The following word will be in an *italicized* typeface.\n\n## Underlined Text\n\
    \nAny content that is placed in between <u>...</u> element will be displayed as\
    \ underlined text. Here is an example.\n\nExample\n\n```\n<!DOCTYPE html>\n```\n"
