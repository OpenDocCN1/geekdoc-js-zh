    for keeping track on the information that the web application needs.


    Using <meta> tag, the cookies can be stored on the client side and of this information
    can be later used the web server for tracking the visitor of its site.


    Example


    In the following example, the current page will be redirected to another page
    after 10 seconds. If you leave the content attribute unspecified, the current
    web page will be redirected immediately.'
