    # Chapter 6: Operators


    Operators are the expressions that is used to manipulate a set of variables. For
    instance, you need to perform a mathematical operation 3 + 6 is equal to 9. The
    variables that are used to manipulate, i.e. 3 and 6 are known as operands and
    the ''+'' sign is known as the operator. Like many other programming languages,
    JavaScript supports the following types of operators.


    Arithmetic Operators


    Comparison Operator


    Logical Operators


    Assignment Operators


    Conditional Operators


    Now let us discuss them in further detail.


    # Arithmetic Operators


    Arithmetic Operators are used to perform various mathematical operations inside
    the JavaScript program.


    Let us assume that the operands a and b hold the values 20 and 30.


    | Sr.No | Operator and Description |

    | --- | --- |

    | 1 | **Addition – ‘+’**<br>This operator gives the added values of two operands<br>**Ex:**
    A + B = 30 |

    | 2 | **Subtraction – ‘-’**<br>This operator gives the subtracted values of two
    operands<br>**Ex:** A - B = -10 |

    | 3 | **Multiplication – ‘*’**<br>This operator gives the multiplied value of
    two operands<br>**Ex:** A * B = 600 |

    | 4 | **Division – ‘/’**<br>This operator gives the quotient after dividing two
    operands<br>**Ex:** B / A = ½ |

    | 5 | **Modulus – ‘%’**<br>This operator gives the remainder after dividing two
    operands<br>**Ex:** B % A = 10 |

    | 6 | **Increment – ''++''** | This operator adds one to the operand.<br>**Ex:**
    A++ will give 21 |

    | 7 | **Decrement – ''--''** | This operator subtracts the value of the operand
    by one.<br>**Ex:** A-- will give 19 |


    NOTE: The addition operator is used to add both numerals and strings. For example,
    "a" + 20 will give "a20".


    Example program for Arithmetic Operators:


    The following program illustrates how to use and manipulate variables using arithmetic
    operators.


