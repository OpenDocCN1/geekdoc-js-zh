    # Comparison Operator


    Comparison Operators are used in comparing the values of two operands and then
    making a conclusion from Java. JavaScript supports the following comparison operators
    –


    Assume that the variables A and B hold the values 20 and 30 respectively -


    | Sr.No | Operator and Description |

    |---|---|

    | 1 | **Equal – ''==''**<br>This operator checks if the values of two operands
    are equal, and if they are equal then the output is true.<br>**Ex:** A == B is
    true. |

    | 2 | **Not Equal – ''!=''**<br>This operator checks if the values of two operands
    are not equal, and if they are not equal then the output is true.<br>**Ex:** A
    != B is true. |

    | 3 | **Greater than – ''>''**<br>This operator checks if the value of first operand
    is greater than the other, and if it is greater then the output is true.<br>**Ex:**
    A > B is true. |

    | 4 | **Less than – ''<''**<br>This operator checks if the value of first operand
    is less than the other, and if it is less then the output is true.<br>**Ex:**
    A < B is true. |

    | 5 | **Greater than or to – ''>=''**<br>This operator checks if the value of
    first operand is greater or equal to the other, and if it is greater or equal
    then the output is true.<br>**Ex:** A >= B is true. |

    | 6 | **Less than or Equal to – ''<=''** | This operator checks if the value of
    first operand is less or equal to the second operand, and if it is less or equal
    then the output is true.<br>**Ex:** A <= B is true. |


    EXAMPLE:

    The following JavaScript program will help you understand how logical operators
    are initialized and how it works.


    ```html

    <html>

    <body>

    <script type="text/javascript">

    <!--

    var a = 10;

