    ## JavaScript: Introduction to JavaScript Programming


    JavaScript is a high-level, untyped, dynamic and interpreted JavaScript language
    that has been standardized in the ECMAScript specification. JavaScript is one
    of the three programming languages that bolster the World Wide Web content production,
    along with HTML (Hyper Text Markup Language) and CSS (Cascading Style Sheets).
    A major majority of the internet employs JavaScript in their makeup and it is
    also supported by almost all the modern web browsers with plug-ins or any other
    external software to make compatible with the system or the browser. It is one
    of the programming languages that is prototype based and contains great world-class
    features that it is on par with the other multi-paradigm languages and also supports
    object-oriented (outputs real-time objects), functional and imperative programming
    styles.


    JavaScript also supports an Programming Interface or an API that supports various
    features such as text, data, characters, matrices, regular expressions and so
    on. On one side to it is that it does not support any Input/output or an I/O which
    include networking, graphic facilities, or even storage and relies on the host
    environment for these features as they are embedded on.


    Though the infamous misconceptions still place, Java and JavaScript are completely
    unrelated except for the standard and syntactic libraries and also have very different
    semantics. While it is true that the syntax of JavaScript is based on C language,
    the semantics and design is derived from and influenced by the type Self and Scheme
    Programming languages.


    JavaScript is known for its versatility in the compilation and synthesizing software
    required to run a program, it can also be executed in environments that are not
    Web-based such as Notepad, PDF documents, desktop widgets and even website applications.
    Earlier, JavaScript was traditionally implemented just as an interpreted language
    on the client side but later evolved into a just-in-time compilation in the more
    recent versions of the browsers. The latest and the faster versions of JavaScript
    include Virtual Machines (VMs) and platforms are built upon them. JavaScript development,
    server-side network programming with runtime environments such as Node.js and
    even in the creation of the desktop and mobile applications.


    ## JavaScript Beginnings in Netscape


    Brendan Eich is the creator of JavaScript, who was still employed in Netscape
    Communications Corporation and manage to finish developing the idea in 1995. It
    was originally named Mocha, then renamed to LiveScript, and finally JavaScript
    after a marketing agreement with Sun Microsystems. While it is true that the syntax
    of JavaScript is based on C language, the semantics and design is derived from
    and influenced by the type Self and Scheme Programming languages.


    JavaScript is known for its versatility in the compilation and synthesizing software
    required to run a program, it can also be executed in environments that are not
    Web-based such as Notepad, PDF documents, desktop widgets and even website applications.
    Earlier, JavaScript was traditionally implemented just as an interpreted language
    on the client side but later evolved into a just-in-time compilation in the more
    recent versions of the browsers. The latest and the faster versions of JavaScript
    include Virtual Machines (VMs) and platforms are built upon them. JavaScript development,
    server-side network programming with runtime environments such as Node.js and
    even in the creation of the desktop and mobile applications.


    The first version of JavaScript was included in Netscape Navigator 2.0 in 1995.
    At the time, Microsoft released its own version of JavaScript called JScript for
    Internet Explorer, which led to the famous "Browser Wars". To standardize the
    language, ECMA International (formerly Europeaners) was tasked with creating a
    specification. The first edition of the specification, ECMAScript 1, was published
    in June 1997. The second edition, ECMAScript 2, was released in December 1998,
    and the third edition, ECMAScript 3, was released in December 1999.


    However, the development of the fourth edition of ECMAScript was stopped halfway
    through and was never completed. Whereas they proceeded to make the 5th edition
    which was released in December 2009. The sixth and current edition of ECMAScript
    being used today was released in June 2015.


    ## Later Developments


    Suffix to say, JavaScript became one of the most popular programming languages
    on the Web because of its cross platform features and other specifications. However,
    initially many of the professional programmers and web developers rejected the
    language because of its target audience and said that its for ''amateurs'' and
    for web authors, and so on. The emergence of Ajax on the scene returned JavaScript
    to the spotlight and captured the attention of more professional programmers.
    In order to improve the JavaScript Programming practices, they started to proliferate
    the comprehensive frameworks and libraries which resulted in the increased usage
    of the JavaScript even outside the web browsers.


    In the year 2009, the CommonJS project was founded, aimed at the goal of establishing
    a common standard library mainly for JavaScript program development outside the
    Web browser.


    With reaching heights of popularity of the single page applications which were
    heavily embedded with JavaScript, it was soon increasingly used as a compile target
    for most of the source to source compilers from static languages and dynamic languages.
    Emscripten particular, and other optimized JIT compilers, in tandem with asm.js
    that was compatible with AOT companies like OdinMonkey, have a path for enabling
    C and C++ asm to be compiled into JavaScript and caused the programs to be executed
    in native speeds.


    ## Trademark


    Today, ''JavaScript'' is trademarked by the Oracle Corporation. It is still being
    used under the license for technology that was invented and executed by Netscape
    communications and currently holds the entitlement to establishments such as the
    Mozilla Foundation.

