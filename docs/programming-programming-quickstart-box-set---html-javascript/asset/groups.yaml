    \ 使用了所有必要的循环，以减少编写程序所需的行数。\n\n## While 循环（While Loop）\n\nwhile 循环是 JavaScript\
    \ 中最基础且易于执行的循环。while 循环的目的是你可以根据需要重复一组语句或代码块。这种重复只有在语句为真时才会持续。循环一旦达到假条件就会立即停止。\n\
