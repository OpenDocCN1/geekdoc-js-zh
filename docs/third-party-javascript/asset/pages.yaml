  md: "**122**\n\nCHAPTER 5\n\n***Cross-domain iframe messaging***\n\ntransport. You’re\
    \ not likely to use this transport as a third-party application (because\n\nyou’re\
    \ working with different origins), but you should specify this parameter to be\
    \ safe.\n\n Additionally, the easyXDM library must be present on both consumer\
    \ (parent) and\n\nprovider (iframe) pages. This means you’ll need to load the\
    \ library in both locations,\n\nbut you don’t need any additional configuration;\
    \ easyXDM will automatically detect\n\nwhich context it’s in.\n\n Another important\
    \ thing is that you don’t need to manually create any iframes with\n\neasyXDM—it’ll\
    \ handle that work for you. All you need is to do is to create a new\n\ninstance\
    \ of either easyXDM.Socket for simple messages or easyXDM.Rpc for configur-\n\n\
    ing a JSON-RPC interface between the consumer and provider. Both the Socket and\n\
    \nRpc constructor functions accept a variety of different options, described in\
    \ table 5.3.\n\nTable 5.3\n\neasyXDM options\n\nOption\n\nDescription\n\nConsumer\
    \ or \n\nprovider\n\nremote\n\nPath to the provider. easyXDM will create and load\
    \ an iframe \n\nwith the value of remote as a URL.\n\nConsumer\n\nonReady\n\n\
    A function that will be called after the communication has \n\nbeen established.\n\
    \nBoth\n\nlocal\n\nPath to the name.html on the consumer’s domain, used by \n\n\
    the NameTransport.\n\nBoth\n\nswf\n\nPath to the easyxdm.swf file, used by the\
    \ \n\nFlashTransport.\n\nBoth\n\nswfNoThrottle\n\nSet to true if you want your\
    \ iframe/swf object to be \n\nplaced visibly in order to avoid throttle in newer\
    \ versions of \n\nFlash.\n\nBoth\n\nswfContainer\n\nA DOM element where easyXDM\
    \ should place the swf\n\nobject.\n\nBoth\n\nlazy\n\nSet to true if you want to\
    \ delay the iframe creation until \n\nthe first use of easyXDM.Socket.\n\nConsumer\n\
    \ncontainer\n\nA DOM element where easyXDM should place the iframe \n\nelement.\
    \ By default, it’s body.\n\nConsumer\n\nprops\n\nA JavaScript object representing\
    \ the properties you want \n\nyour iframe to have.\n\nConsumer\n\nremoteHelper\n\
    \nPath to the name.html on the provider’s domain, used by \n\nthe NameTransport.\n\
    \nConsumer\n\nhash\n\nSet to true if you want to use hash instead of the query\
    \ \n\nstring to pass initial parameters to the iframe (helps with \n\ncaching).\n\
    \nConsumer\n\nacl\n\nA string or an array of domains. Set this if you want only\
    \ \n\nspecific domains to consume the provider.\n\nProvider\n\nwww.it-ebooks.info"
