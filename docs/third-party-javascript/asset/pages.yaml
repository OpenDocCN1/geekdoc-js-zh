  md: "**176**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\npublisher\
    \ before any other Stork functions. It takes a single parameter—a callback\n\n\
    function—that’s invoked when initialization is complete and the SDK is ready.\n\
    \n Right now, Stork.init has a light implementation. It loads a single file—sdk/\n\
    \nlib.js—which will house the SDK’s remaining public functions. You’ll implement\
    \ these\n\nfunctions as we progress through this chapter.\n\n You might be wondering,\
    \ why have a public initialization method? Why not load all\n\nof your code in\
    \ a single file? We think separating your initial script file and your main\n\n\
    application code is good practice for the following reasons:\n\n*Configuration*—The\
    \ initialization function can optionally take global configura-\n\ntion arguments,\
    \ like an SDK version string or a publisher’s API key.\n\n*Performance*—You can\
    \ defer loading JavaScript files and other assets until the\n\npublisher actually\
    \ invokes your SDK.\n\n*File size*—By keeping the initial script file small,\
    \ you minimize the impact of\n\nblocking script includes.\n\nThis last part is\
    \ important. Let’s say you were to distribute your SDK using a standard,\n\nblocking\
    \ script include. That means publishers might write the following example\n\n\
    code to use your SDK:\n\n<script src=\"http://camerastork.com/sdk.js\"></script>\n\
    \n<script>\n\nStork.init(function() {\n\nStork.productWidget({ id: '1337', dom:\
    \ 'widget-location-id'});\n\n});\n\n</script>\n\nBy wrapping the guts of your\
    \ application in a separate file (lib.js), you’re keeping the\n\ninitial script\
    \ file (sdk.js) extremely small. If this file remains small, it’ll load faster,\n\
    \nwhich minimizes the amount of time it’ll spend blocking the page.\n\n Now, you’re\
    \ probably thinking, aren’t blocking script includes *El Diablo*? Shouldn’t\n\n\
    we insist that publishers load sdk.js asynchronously? The answers are yes and\
    \ yes. But\n\nthere’s a good reason for allowing publishers to load your script\
    \ in the blocking fash-\n\nion: it’s the simplest, most recognizable way of loading\
    \ JavaScript, and it’s easier to\n\nunderstand by junior and novice JavaScript\
    \ programmers. And inevitably, *somebody* will\n\nload your application using\
    \ a blocking script include, in which case, you may as well\n\nminimize the impact\
    \ it’ll have on their site. \n\n*8.1.2*\n\n*Asynchronous loading*\n\nSo far, publishers\
    \ can load your SDK using a standard, blocking script include. But\n\nblocking\
    \ scripts, even minimal ones, are still bad. We’ll quickly look at a few tech-\n\
    \nniques you can use to allow publishers to load your SDK asynchronously.\n\n\
    \ What’s tricky about loading an SDK asynchronously is that the publisher can’t\
    \ exe-\n\ncute the library’s functions until it is fully downloaded and parsed.\
    \ If they do, they’ll\n\nget an error—the code isn’t ready yet. You didn’t have\
    \ this problem earlier with your\n\noriginal widget implementation because that\
    \ version executed automatically when it\n\nwww.it-ebooks.info"
