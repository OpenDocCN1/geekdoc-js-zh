  md: "**229**\n\n***Debugging***\n\nMODULES IN APACHE\n\nApache supports a lot of\
    \ different features, and many\n\nof them are implemented as compiled modules.\
    \ These modules extend the\n\ncore functionality of the server and can be enabled\
    \ or disabled with special\n\nprograms named a2enmod and a2dismod. Note that in\
    \ environments where\n\na2enmod and a2dismod aren't available, you can still enable\
    \ modules by edit-\n\ning Apache config files. Please consult the Apache documentation\
    \ online for\n\nmore information.\n\nAfter you’ve enabled these modules, you need\
    \ to configure your Apache settings file\n\nto intercept all URLs that have media.camerastork.com\
    \ as their hostname and swap\n\nthat hostname with media.camerastork.dev. The\
    \ settings file that you need to modify\n\ndepends on your setup and your operating\
    \ system. For example, since you probably\n\ndon’t want to dedicate a whole new\
    \ machine with a separate IP address to be your\n\nproxy server, you’ll need to\
    \ set up a name-based virtual host on your Apache installa-\n\ntion. *Name-based\
    \ virtual hosting* is a way for you to host multiple host names from the\n\nsame\
    \ IP address and—most often—from the same physical machine.\n\n Apache makes it\
    \ easy to configure multiple name-based virtual hosts. For example,\n\non OS X\
    \ all you need is to modify /etc/apache2/extra/httpd-vhosts.conf. To tell Apache\n\
    \nto rewrite all requests going to media.camerastork.com with media.camerastork.dev,\n\
    \nyou’ll need to open that file and add a new entry for your proxy server:\n\n\
    <VirtualHost \\*:8080>\n\nServerName proxy.dev\n\nRewriteEngine on\n\nRewriteCond\
    \ %{HTTP\\_HOST} ^media.camerastork\\\\.com\n\nRewriteRule ^proxy:http://.\\*?/(.\\\
    *)$ \\\\\n\nhttp://media.camerastork.dev/$1 \\[P,L\\]\n\n</VirtualHost>\n\nAfter\
    \ you’re finished modifying the settings file, just restart your Apache instance\
    \ and\n\nyou’re golden:\n\n$ apachectl restart\n\nNow that you have a rewriting\
    \ proxy server up and running, all you need to do is to\n\nconfigure your web\
    \ browser to use it. You can configure your entire operating system\n\nto connect\
    \ to the proxy, which is typically found in your operating system’s network\n\n\
    preferences. Better yet, some web browsers have built-in support for HTTP proxies,\n\
    \nlike Mozilla Firefox. To configure Firefox to use your proxy, go to Preferences\
    \ >\n\nAdvanced > Network and provide proxy.dev:8080 under HTTP Proxy, as shown\
    \ in\n\nfigure 10.3.\n\n When you’re done, you can revisit the offending publisher’s\
    \ page and try repro-\n\nducing the bug. This time, your browser will use the\
    \ Camera Stork’s development\n\nJavaScript files, so you can fire up your browser’s\
    \ debugger and start stepping through\n\ncode. And if you’ve never touched a JavaScript\
    \ debugger before, don’t worry—we’ll\n\nshow you how shortly. But for now let’s\
    \ look at an alternative way of configuring your\n\ndebugging environment to access\
    \ development code—feature switches. \n\n**Settings for your proxy server **\n\
    \n**to run on host proxy.dev:8080**\n\n**When Apache encounters **\n\n**a URL\
    \ with the **\n\n**media.camerastork.com **\n\n**hostname ...**\n\n**Rewrite**\n\
    \n**URL to**\n\n**point to**\n\n**your**\n\n**development**\n\n**server**\n\n\
    www.it-ebooks.info"
