  md: "**206**\n\nCHAPTER 9\n\n***Performance***\n\nThese techniques aren’t as simple\
    \ as concatenating source files, but they’re not rocket\n\nscience either.\n\n\
    IMAGE SPRITES\n\nThe most common way of combining multiple images is using *image\
    \ sprites*. With\n\nimage sprites, you combine multiple images into a single,\
    \ larger image file, and then\n\ndisplay only the part you need using the background-image\
    \ and background-posi-\n\ntion CSS properties.\n\n Figure 9.1 shows an image sprite\
    \ we used for the Disqus commenting widget,\n\nwhich contains a number of different\
    \ icons and the Disqus logo.\n\n To display a specific part of the sprite, we\
    \ specify a CSS class that sets the back-\n\nground-image property to point to\
    \ the\n\nsprite file, and the background-position\n\nto the pixel location of\
    \ the desired subim-\n\nage. For example, to display the grey\n\nthumbs-up button,\
    \ the background image\n\nneeds to be positioned 15 pixels from the\n\nsprite’s\
    \ top and left corners:\n\n.thumbs-up {\n\nbackground-image: url(http://cdn.disqus.com/img/sprite.png);\n\
    \nbackground-position: 15px 15px;\n\n}\n\nOriginally, these icons were all individual\
    \ image files, each requiring a separate HTTP\n\nrequest. By bundling them into\
    \ a sprite, only a single HTTP request is made. Even if a\n\nsprite file is referenced\
    \ multiple times in your CSS, it’s only downloaded once by the\n\nbrowser. For\
    \ applications with a significant number of image assets, this can signifi-\n\n\
    cantly reduce the number of HTTP requests issued. Sprites are a no-brainer—use\n\
    \nthem wherever you can.\n\nCONTENT DELIVERY NETWORKS\n\nIdeally, you should be\
    \ serving your static files\n\nfrom a content delivery network (CDN). CDNs provide\
    \ high-performance\n\nasset delivery, usually from multiple data centers around\
    \ the world, and are\n\nthe fastest way to deliver files to your users. Akamai,\
    \ Amazon CloudFront, and\n\nCloudFlare are just a handful of notable CDN providers.\
    \ \n\nINLINE IMAGES\n\nAnother neat way to reduce the number of HTTP requests\
    \ is using *inline* images. With\n\nthis technique, you actually embed an entire\
    \ image file as a binary string into your\n\napplication’s source code, forgoing\
    \ the need for a separate network request.\n\n To see how this works, let’s look\
    \ at a real-world example involving the Disqus com-\n\nmenting widget. This widget\
    \ begins with a loader script: a piece of JavaScript that\n\nalways loads first,\
    \ configures itself, and then loads the remaining application files. At\n\none\
    \ point, we decided that it’d be nice for the loader script to display our company’s\n\
    \nlogo while it’s chugging along, but we didn’t want to introduce an additional\
    \ network\n\nrequest just to display the tiny Disqus logo (< 1 KB).\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_230_0.png)\n\
    \nFigure 9.1\n\nSprited image for the Disqus \n\nComments toolbar\n\nwww.it-ebooks.info"
