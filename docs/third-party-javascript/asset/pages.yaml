  md: "**127**\n\n***Simple cross-domain messaging with easyXDM***\n\n}\n\n},\n\n\
    editReview: function (prodId, text,\n\nonSuccess, onFailure) {\n\n/\\* ... \\\
    */\n\n}\n\n},\n\nremote: {\n\nredrawReviews: {}\n\n}\n\n}\n\n);\n\nFigure 5.5\
    \ illustrates creating both provider and consumer easyXDM.Rpc instances.\n\neasyXDM\
    \ handles the \n\ncommunication details!\n\n1\\. Create an RPC instance implementing\
    \ local function A\n\nand declaring function B that provider will define.\n\n\
    2\\. easyXDM loads provider \n\nURL in iframe.\n\n3\\. Provider code creates another\
    \ RPC \n\nthat implements the remote function B\n\nthat the main window expects.\n\
    \n4\\. Now code in the main window can call B() in the\n\niframe, and code in\
    \ the iframe can call A() on \n\nthe main window. They can pass JSON objects\n\
    \nback and forth this way!\n\nRPC 1\n\nlocal: A(){...}\n\nremote: B\n\nRPC 2\n\
    \nlocal: B(){...}\n\nremote: A\n\ncamerastork.com\n\nRPC 1\n\n\\[ Transport \\\
    ]\n\niframe\n\nFigure 5.5\n\nUsing \n\n**easyXDM.Rpc** to invoke \n\nremote functions\
    \ in an external \n\ndocument\n\nwww.it-ebooks.info"
