  md: "**10**\n\nCHAPTER 1\n\n***Introduction to third-party JavaScript***\n\n There’s\
    \ something else interesting about Mixpanel’s use of third-party scripting. In\n\
    \nactuality, Mixpanel provides a set of client-side functions that communicate\
    \ with their\n\nweb service API—a set of server HTTP endpoints that both track\
    \ and report on events.\n\nThis is a practical use case that can be extended to\
    \ any number of different services.\n\nLet’s learn more. \n\n*1.2.3*\n\n*Web service\
    \ API wrappers*\n\nIn case you’re not familiar with them, web service APIs are\
    \ HTTP server endpoints that\n\nenable programmatic access to a web service. Unlike\
    \ server applications that return\n\nHTML to be consumed by a web browser, these\
    \ endpoints accept and respond with\n\nstructured data—usually in JSON or XML\
    \ formats—to be consumed by a computer\n\nprogram. This program could be a desktop\
    \ application or an application running on\n\na web server, or it could even be\
    \ client JavaScript code hosted on a web page but exe-\n\ncuting in a user’s browser.\n\
    \n This last use case—JavaScript code running in the browser—is what we’re most\n\
    \ninterested in. Web service API providers can give developers building on their\
    \ plat-\n\nform—often called *integrators*—third-party scripts that simplify client-side\
    \ access to\n\ntheir API. We like to call these scripts *web service **API** wrappers*,\
    \ since they’re effectively\n\nJavaScript libraries that “wrap” the functionality\
    \ of a web service API.\n\nEXAMPLE: THE FACEBOOK GRAPH API\n\nHow is this useful?\
    \ Let’s look at an example. Suppose there’s an independent web\n\ndeveloper named\
    \ Jill who’s tired of freelance work and looking to score a full-time\n\njob.\
    \ Jill’s decided that in order to better appeal to potential employers, she needs\
    \ a\n\nterrific-looking online resume hosted on her personal website. This resume\
    \ is for the\n\nmost part static—it lists her skills and her prior work experience,\
    \ and even mentions\n\nher fondness for moonlight kayaking.\n\n Jill’s decided\
    \ that, in order to demonstrate her web development prowess, there\n\nought to\
    \ be a dynamic element to her resume as well. And she’s got the perfect idea.\n\
    \nWhat if visitors to Jill’s online resume—potential employers—could see if they\
    \ had any\n\nfriends or acquaintances in common with Jill (see figure 1.5)? Not\
    \ only would this be\n\na clever demonstration of\n\nJill’s skills, but having\
    \ a\n\ncommon friend could be a\n\ngreat way of getting her\n\nfoot in the door.\n\
    \n To implement her\n\ndynamic resume, Jill uses\n\nFacebook’s Graph API. This\n\
    \nis a web service API from\n\nFacebook that enables soft-\n\nware applications\
    \ to access\n\nor modify live Facebook\n\nuser data (with permission,\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_34_0.png)\n\
    \nFigure 1.5\n\nAt the bottom of Jill’s resume, the visitor can see \n\nfriends\
    \ they share with Jill.\n\nwww.it-ebooks.info"
