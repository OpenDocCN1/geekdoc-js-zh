  md: "**14**\n\nCHAPTER 1\n\n***Introduction to third-party JavaScript***\n\nYou’ll\
    \ market this widget to publishers who are interested in providing their readers\n\
    \nwith local weather information, with the easy installation of a third-party\
    \ script.\n\n Luckily, you’ve already found a publisher who’s interested, and\
    \ they’ve signed on\n\nto test-drive your widget. To get them started, you’ll\
    \ need to provide them with an\n\nHTML snippet that will load the weather widget\
    \ on their web page. The publisher will\n\ncopy and paste this snippet into their\
    \ HTML source code at the location where they\n\nwant the widget to appear. The\
    \ snippet itself is simple: it’s a <script> tag pointed to a\n\nthird-party JavaScript\
    \ file hosted on your servers at weathernearby.com:\n\n<script src=\"http://weathernearby.com/widget.js?zip=94105\"\
    >\n\n</script>\n\nYou’ll notice the URL for this script element contains a single\
    \ parameter, zip. This is\n\nhow you’ll identify what location to render weather\
    \ information for.\n\n Now when the browser loads the publisher’s web page, it’ll\
    \ encounter this\n\n<script> tag and request widget.js from your servers at weathernearby.com.\
    \ When\n\nwidget.js is downloaded and executed, it’ll render the weather widget\
    \ directly into the\n\npublisher’s page. That’s the goal, at least.\n\n To do\
    \ this, widget.js will need to have access to the company’s weather data. This\n\
    \ndata could be published directly into the script file, but given that there\
    \ are approxi-\n\nmately 43,000 US ZIP codes, that’s too much data to serve in\
    \ a single request. Unless\n\nthe user is connecting from Sweden or South Korea,\
    \ where 100 Mbps connections are\n\nthe norm, it’s clear that the widget will\
    \ need to make separate requests for the weather\n\ndata. This is typically done\
    \ using AJAX, but for simplicity we’ll use a different\n\napproach: server-side\
    \ script generation.\n\n*1.3.1*\n\n*Server-side JavaScript generation*\n\nInstead\
    \ of serving a static JavaScript file that contains your widget code, you’ll write\
    \ a\n\nserver application that generates a JavaScript file for every request (see\
    \ figure 1.8).\n\nBecause your server has access to your weather database, it\
    \ can inject the requested\n\nweather data into the outputted JavaScript file.\
    \ This means that the JavaScript file will\n\ncontain all the code and data necessary\
    \ to render the weather widget on the pub-\n\nlisher’s page, without having to\
    \ make any additional requests.\n\n This server application could be written in\
    \ any programming language or platform\n\nthat can execute in a server environment,\
    \ like Ruby, PHP, Java, ASP.NET—even server-\n\nside JavaScript. These are all\
    \ fine choices, but we’ll walk you through an example writ-\n\nten in Python,\
    \ a popular scripting language. This example also uses Flask, a Python\n\nmicroframework\
    \ for building small web applications. If you’re not familiar with\n\nPython,\
    \ don’t sweat it—the code is easy to follow. If you’d like to try the example\
    \ in\n\nlisting 1.5 yourself, consult the companion source code, which also contains\
    \ instruc-\n\ntions for installing both Python (2.x) and Flask.\n\nwww.it-ebooks.info"
