  md: "**44**\n\nCHAPTER 2\n\n***Distributing and loading your application***\n\n\
    In your third-party script file (widget.js), you can just read the contents of\
    \ the\n\nproduct\\_id variable, and you’re on your way to loading that product’s\
    \ current vote\n\nrating and rendering it into the page.\n\n There’s a catch:\
    \ global variables like this are shared by all scripts executing on the\n\npage,\
    \ and can be read or altered by any of them. Similarly, by setting this value,\
    \ you\n\nmight be overwriting a variable that’s relied on by another script loaded\
    \ elsewhere on\n\nthe publisher’s page.\n\n A better idea is to put the global\
    \ variable inside your application namespace. That\n\nwill reduce variable conflicts\
    \ with other scripts, because the likelihood of another\n\nscript sharing your\
    \ branded namespace is small. You’ll have to initialize the\n\nnamespace first,\
    \ because the widget.js file where the namespace was previously\n\ndeclared won’t\
    \ have been loaded yet:\n\n<script>\n\nvar Stork = window.Stork || {};\n\n(function()\
    \ {\n\nStork.product\\_id = 1234;\n\n/\\* ... rest of include snippet ... \\*/\n\
    \n})();\n\n</script>\n\nNamespacing the script parameter like this will reduce\
    \ conflicts, but there’s still a sig-\n\nnificant downside: you can only define\
    \ one product\\_id parameter per page. If the\n\npublisher tries to include the\
    \ script include snippet a second time for a different prod-\n\nuct, the second\
    \ product\\_id assignment might overwrite the first value by the time the\n\n\
    first script file is loaded.\n\nASYNCHRONOUS SCRIPT INCLUDES DON’T PRESERVE EXECUTION\
    \ ORDER  Remem-\n\nber, we’re loading the third-party script asynchronously to\
    \ improve page per-\n\nformance. That means that there’s no predicting when the\
    \ script will finish\n\ndownloading and run. It also means that the browser doesn’t\
    \ maintain execu-\n\ntion order of asynchronous scripts, which can lead to race\
    \ conditions if you’re\n\nnot careful.\n\nGLOBAL VARIABLE ARRAYS\n\nTo avoid global\
    \ variable collisions, you can instead pass parameter variables in global\n\n\
    arrays. If a second script include detects earlier parameter declarations, it\
    \ merely\n\nappends to the array. When the script loads, it can iterate over the\
    \ array of parameters\n\nand execute the rendering method for each passed ID:\n\
    \n<script>\n\nvar Stork = window.Stork || {};\n\n(function() {\n\nStork.product\\\
    _ids = Stork.product\\_ids || \\[\\];\n\nStork.product\\_ids.push(1234);\n\n/\\\
    * ... rest of include snippet ... \\*/\n\n})();\n\n</script>\n\nwww.it-ebooks.info"
