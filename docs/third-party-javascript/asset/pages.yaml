  md: "**171**\n\n***Summary***\n\n The normal prevention-and-response measures for\
    \ such events revolve around net-\n\nwork hardware and, unfortunately, are outside\
    \ the scope of this book. But we do have\n\none recommendation: if you’re registering\
    \ publishers, consider creating a unique sub-\n\ndomain for each publisher from\
    \ which to serve files (say, publisher.camerastork.com).\n\nThat way, you’ll be\
    \ more capable of shutting off or limiting requests to specific pub-\n\nlisher\
    \ endpoints if they’re causing too many requests to your application. This will\
    \ help\n\nyour service better weather both DoS and random high-traffic events.\
    \ \n\n*7.5*\n\n*Summary*\n\nWe started this chapter with a refresher on cookies,\
    \ and then walked through differ-\n\nent types of web application vulnerabilities:\
    \ cross-site scripting, cross-site request forg-\n\nery, and a number of vulnerabilities\
    \ that either affect or are caused by publishers. The\n\nimportant lesson here\
    \ is that you should never underestimate or shelve the problem\n\nof keeping your\
    \ third-party application secure. As we said in the introduction to this\n\nchapter,\
    \ the stakes are high for everyone and especially for you—the third-party\n\n\
    JavaScript application provider. Not only do users trust you with their data,\
    \ but so do\n\npublishers with their online properties. That’s why you have to\
    \ think about security\n\nimplications at all stages of your application’s development.\n\
    \n There’s no silver bullet when it comes to defending yourself against different\
    \ types\n\nof attacks. You’ll probably have to use all the techniques we showed\
    \ in this chapter\n\nplus invest time in additional research. Web application\
    \ security is a fun and thriving\n\nsubject and, in case you’re interested in\
    \ further exploring it, we recommend you take\n\na look at the *Web Application\
    \ Hacker’s Handbook* (Wiley, 2008)—a great resource on web\n\napplication security.\n\
    \n As for us, it’s time to move on. In the next chapter, we’ll revisit some assumptions\n\
    \nwe’ve made about distributing and deploying a third-party application. Instead\
    \ of rely-\n\ning solely on self-executing applications deployed using script-include\
    \ snippets, we’ll\n\nlook at how you can package your apps as complete JavaScript\
    \ libraries, or third-party\n\nJavaScript SDKs.\n\nwww.it-ebooks.info"
