    \ = document.defaultView\n\n.getComputedStyle(node, null)\n\n.getPropertyValue(property);\n\
    \n} else if (node.currentStyle) {\n\nvalue = node.currentStyle\\[property\\] ?\n\
    \nnode.currentStyle\\[property\\] :\n\nnode.currentStyle\\[camel\\];\n\n}\n\n\
    if (value === '' ||\n\nvalue === 'transparent' ||\n\nvalue === 'rgba(0, 0, 0,\
    \ 0)')\n\n{\n\nreturn getStyle(node.parentNode, property, camel);\n\n} else {\n\
    \nreturn value || '';\n\n}\n\n}\n\nSome of this code should look familiar from\
    \ the isCssReady function in listing 3.4.\n\nWhat’s different is that if a style\
