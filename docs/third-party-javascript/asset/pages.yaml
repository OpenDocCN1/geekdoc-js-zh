  md: "**183**\n\n***Versioning***\n\nHere, the target render location (dom) is a\
    \ string that contains a DOM element ID. But\n\nlet’s say that you’d like to modify\
    \ Stork.productWidget to accept a CSS selector string\n\ninstead. This will give\
    \ SDK publishers more flexibility in designating where the prod-\n\nuct widget\
    \ should be rendered. Here’s an example of the “new” Stork.product-\n\nWidget\
    \ in action, using a class selector for the dom configuration parameter:\n\nStork.productWidget({\
    \ id: 1337, dom: '.stork-widget-location-class' });\n\nThis is a subtle change,\
    \ but the effects are far-reaching. The problem is that if you\n\nwere to introduce\
    \ this change, anybody who was using the Stork.productWidget\n\nfunction previously\
    \ would be in for a nasty surprise: the function will no longer inter-\n\npret\
    \ their DOM parameter as a DOM ID, and the widget will likely not render at the\n\
    \nlocation they intended. Imagine this happening across thousands of publisher\
    \ web\n\npages—a devastating scenario.\n\n The solution to this problem is *versioning*.\
    \ As an SDK provider, you enable publish-\n\ners to load a particular version\
    \ of your SDK. That way, you can introduce breaking\n\nchanges in future versions\
    \ of the SDK and feel safe knowing that they won’t break any\n\nof your publishers’\
    \ existing code, because the library your publishers are loading—the\n\nearlier\
    \ version—will remain unchanged.\n\n We’ll look at a couple of ways to version\
    \ your SDK. First, we’ll discuss giving pub-\n\nlishers a unique URL to your SDK’s\
    \ script file that has a version number embedded\n\ninside. Then, we’ll explore\
    \ an alternate technique in which publishers specify a ver-\n\nsion number during\
    \ your SDK’s initialization (via Stork.init).\n\n*8.2.1*\n\n*URL versioning*\n\
    \nCommonly, versioning is done via the SDK’s script URL. For this technique, you\
    \ embed\n\na unique version string in your script URL. For example, the Camera\
    \ Stork SDK could\n\nbe loaded using the following script URL:\n\n<script src=\"\
    http://camerastork.com/sdk\\_1.0.js\"></script>\n\nHere the version number, 1.0,\
    \ is embedded in the script filename. If you decide to\n\nintroduce breaking changes\
    \ to your SDK, you can create a new version of your SDK\n\nand introduce the breaking\
    \ changes there. For example, in order to safely introduce\n\nthe breaking changes\
    \ to Stork.productWidget we discussed earlier, you’d make a\n\ncopy of sdk\\_1.0.js,\
    \ name it sdk\\_1.1.js, and apply the changes there:\n\n<script src=\"http://camerastork.com/sdk\\\
    _1.1.js\"></script>\n\nThe older file, sdk\\_1.0.js, doesn’t contain the changes,\
    \ so anyone using that version\n\nwill be unaffected.\n\n This technique is simple\
    \ but effective. There’s just one major issue: what happens\n\nwhen there are\
    \ two script includes to your SDK on the same page, with each pointing\n\nto a\
    \ different version? This scenario is uncommon, but could occur if there are two\n\
    \ndevelopers writing separate integrations on the same publisher property, or\
    \ if *another*\n\nthird-party script used by the publisher was trying to communicate\
    \ with the Camera\n\nStork SDK.\n\nwww.it-ebooks.info"
