  md: "**190**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\nJSONP\
    \ is great because it works in all browsers. Its downsides, if you recall, are\
    \ that it\n\nonly works with GET requests, there’s a limit on the amount of data\
    \ that can be sub-\n\nmitted, it can’t detect 400 or 500 HTTP response errors,\
    \ and caching browser-side is\n\ndifficult. That’s a laundry-list of failings,\
    \ but luckily we’re beginning to see some web\n\nservice APIs supporting CORS,\
    \ which permits the use of XmlHttpRequest across\n\ndomains. This is preferable;\
    \ XmlHttpRequest doesn’t have the same failings as JSONP.\n\n GitHub, the popular\
    \ source-code hosting service, is a terrific example of an API that\n\nsupports\
    \ CORS. Provided you’ve registered your website’s domain with their API, you\n\
    \ncan use XmlHttpRequest (XDomainRequest for Internet Explorer 8) to issue a cross-\n\
    \ndomain request from that domain. For example, we’ve registered thirdpartyjs.com\n\
    \n(this book’s website) with GitHub’s API, which permits us to issue a CORS request\
    \ from\n\nour website to their API. The following code snippet uses jQuery’s ajax\
    \ helper to query\n\ninformation about the thirdpartyjs-code repository, where\
    \ this book’s companion\n\nsource code examples are hosted:\n\n$.ajax({\n\nurl:\
    \ 'https://api.github.com/repos/thirdpartyjs/thirdpartyjs-code',\n\nsuccess: function(response)\
    \ {\n\nconsole.log(response);\n\n}\n\n});\n\nIf this code sample looks surprisingly\
    \ simple—it is. jQuery makes using CORS a breeze.\n\nIf you’re curious, this is\
    \ the JSON response returned by the server, abbreviated slightly.\n\n{\n\nupdated\\\
    _at: \"2012-01-24T08:35:04Z\",\n\nhas\\_downloads: true,\n\nssh\\_url: \"git@github.com:thirdpartyjs/thirdpartyjs-code.git\"\
    ,\n\nlanguage: \"JavaScript\",\n\ncreated\\_at: \"2011-09-05T03:19:37Z\",\n\n\
