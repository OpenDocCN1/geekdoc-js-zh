  md: "**3**\n\n***Defining third-party JavaScript***\n\nWhen you try to apply this\
    \ definition to JavaScript, things become muddy. Many devel-\n\nopers have differing\
    \ opinions on what exactly constitutes third-party JavaScript. Some\n\nclassify\
    \ it as any JavaScript code that providers don’t author themselves. This would\n\
    \ninclude popular libraries like jQuery and Backbone.js. It would also include\
    \ any code\n\nyou copied and pasted from a programming solutions website like\
    \ Stack Overflow.\n\nAny and all code you didn’t write would come under this definition.\n\
    \n Others refer to third-party JavaScript as code that’s being served from third-party\n\
    \nservers, not under the control of the content provider. The argument is that\
    \ code\n\nhosted by content providers is under their control: content providers\
    \ choose when\n\nand where the code is served, they have the power to modify it,\
    \ and they’re ultimately\n\nresponsible for its behavior. This differs from code\
    \ served from separate third-party\n\nservers, the contents of which can’t be\
    \ modified by the provider, and can even change\n\nwithout notice. The following\
    \ listing shows an example content provider HTML page\n\nthat loads both local\
    \ and externally hosted JavaScript files.\n\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\
    \n<title>Example Content Provider Website</title>\n\n<script src=\"js/jquery.js\"\
    ></script>\n\n<script src=\"js/app.js\"></script>\n\n</head>\n\n<body>\n\nListing\
    \ 1.1\n\nSample content provider web page loads both local and external scripts\n\
    \n![](img/5163284bc2a93c8f882ffdc058bb516a_27_0.png)\n\nFigure 1.1\n\nWebsites\
    \ today make use of a large number of third-party services.\n\n**Local JavaScript\
    \ files **\n\n**hosted on content **\n\n**provider’s own servers**\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 27
