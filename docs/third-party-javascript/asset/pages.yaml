  md: "**163**\n\n***Cross-site request forgery***\n\nDespite looking like an innocent\
    \ web page, the script on this page automatically gen-\n\nerates and submits a\
    \ form pointed to the moderators/add endpoint. In other words,\n\nwhoever visits\
    \ this page ends up submitting a POST request to moderators/add—with\n\nthe attacker’s\
    \ username as a parameter. To the browser, this is treated as a genuine\n\nrequest\
    \ to the camerastork.com server, so it transmits any stored camerastork.com\n\n\
    cookies with the request, including the user’s session cookie. The server receives\
    \ the\n\nrequest—cookies included—checks the session, and validates the provided\
    \ username.\n\nEverything looks fine, so the server adds the attacker as a moderator\
    \ to your account.\n\nThe attack has been successful and you haven’t noticed a\
    \ thing (and you didn’t get a\n\nfree book for your trouble, either). \n\n*7.3.2*\n\
    \n*JSON hijacking*\n\nYou just learned a classical example of XSRF vulnerability\
    \ but, unfortunately, XSRF\n\nattacks come in different forms and shapes. One\
    \ of these forms is called *JSON** hijacking*,\n\nand is often used to steal protected\
    \ information from the user. If you recall the JSONP\n\ntechnique from chapter\
    \ 4, you’ll remember that <script> tags aren’t susceptible to\n\nthe restrictions\
    \ of the same-origin policy, and you used that fact to make cross-domain\n\nHTTP\
    \ requests from your widget. JSON hijacking uses this SOP exception to steal data\n\
    \nfrom JSON endpoints by loading such endpoints using standard <script> tags.\n\
    \n Let’s say that your Camera Stork widget allows users to review their past purchases.\n\
    \nThis information is considered private—your users wouldn’t be happy if you leaked\n\
    \ntheir purchase history to other web users. In order for your widget to access\
    \ this data,\n\nyou’ve implemented an HTTP endpoint on your servers that returns\
    \ the current ses-\n\nsion user’s purchase history as JSON. You’ll use XmlHttpRequest\
    \ to fetch the endpoint\n\nfrom inside an iframe that contains a web page hosted\
    \ on the Camera Stork domain.\n\nHere’s an example response from that endpoint:\n\
    \n\\[\n\n{ \"model\": \"Canon Rebel XT\", \"price\": 499, \"order\": 12030123\
    \ },\n\n{ \"model\": \"Olympus E-P2\",\n\n\"price\": 350, \"order\": 12330393\
    \ }\n\n\\]\n\nLet’s suppose an attacker wants to gain access to this data using\
    \ an XSRF exploit. As\n\nyou already know, if an attacker can initiate a request\
    \ to this endpoint under the iden-\n\ntity of a user (using a malicious web page),\
    \ the server will read the user’s session and\n\nrespond with their purchase history.\
    \ The attacker just needs to access the response’s\n\ncontents, and they’re off\
    \ to the races. But how? The same-origin policy prevents them\n\nfrom using XmlHttpRequest,\
    \ because the endpoint has a different origin than the\n\nattacker’s page. That\
    \ leaves using the <script> tag to load the endpoint, but the\n\nattacker has\
    \ hit another wall—they can’t capture the contents of the response data,\n\nbecause\
    \ the JSON output isn’t assigned to a variable or otherwise persisted. As such,\
