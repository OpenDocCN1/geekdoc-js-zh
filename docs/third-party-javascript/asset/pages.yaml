  md: "**118**\n\nCHAPTER 5\n\n***Cross-domain iframe messaging***\n\niframe’s fragment\
    \ identifier, and the iframed document polls for changes. If there is\n\nbidirectional\
    \ communication, the documents are both changing each other’s frag-\n\nment identifier\
    \ and polling for changes to their own identifier. Dizzying, we know.\n\nTHE HASHCHANGE\
    \ EVENT\n\nNormally, you can listen to changes to the fragment\n\nidentifier by\
    \ binding to the window’s hashchange event. This is an event intro-\n\nduced in\
    \ HTML5 that fires whenever the fragment identifier (or hash)\n\nchanges. But\
    \ because it’s only supported in browsers that also implement\n\nwindow.postMessage,\
    \ it isn’t practical for use with this fallback technique.\n\nURL SIZE LIMITATION\
    \ WHEN USING FRAGMENT TRANSPORT\n\nSince this transport mechanism depends on changing\
    \ the fragment identifier of the\n\nURL, it is constrained by limitations placed\
    \ on the URL itself. As you’ve already\n\nlearned, Internet Explorer has a maximum\
    \ URL length of 2,083 characters. This\n\nmeans that the maximum amount of data\
    \ you can send in a single message is 2,083\n\ncharacters minus the length of\
    \ the original URL. It’s possible to get around this by\n\nbreaking up messages\
    \ into smaller, consecutive chunks, and then sending them piece-\n\nby-piece over\
    \ the document fragment. Though not terribly complex, splitting mes-\n\nsages\
    \ into packets adds significant complexity to this transport protocol.\n\n The\
    \ fragment transport technique is a good one because it works reliably in older\n\
    \nbrowsers. Now, let’s look at one final workaround for emulating the window\n\
    \n.postMessage API: using Adobe’s Flash browser plugin. \n\n*5.2.3*\n\n*Sending\
    \ messages using Flash*\n\nIn chapter 4, we stated that the browser is a complicated\
    \ program with many different\n\ncomponents, and not all of them are subject to\
    \ the same-origin policy. Adobe’s Flash\n\nplugin is one such component; it doesn’t\
    \ adhere to the SOP like browsers do. Instead,\n\nit assumes that if you let a\
    \ user upload a Flash object on your website, you implicitly\n\ntrust everything\
    \ it does. Third-party JavaScript widgets can load anything on the web-\n\nsite,\
    \ including a special Flash object that acts as a tunnel between the host site\
    \ and an\n\niframe. It doesn’t matter what host you load this Flash object from;\
    \ you can load it\n\nfrom any of the two participating domains, or you can use\
    \ a common host—such as a\n\nCDN—to load the file faster.\n\n The actual Flash\
    \ object should be written in ActionScript—a dialect of ECMAScript\n\ndeveloped\
    \ in 1999 by Macromedia, Inc., specifically for Flash scripting. Because it’s\
    \ a\n\ndialect of ECMAScript, it has the same syntax and semantics as JavaScript,\
    \ so you\n\nshould have some basic understanding of the examples we’re about to\
    \ show you.\n\nAPACHE SHINDIG PROJECT\n\nIf you’re interested in third-party widgets\
    \ develop-\n\nment—and why else would you be reading this book?—check out the\
    \ Shindig\n\nproject from the Apache Foundation. Apache Shindig is an OpenSocial\
    \ con-\n\ntainer that provides utilities to render gadgets, proxy requests, and\
    \ handle\n\nREST/RPC requests. Even if you don’t plan to use it, the project page\
    \ contains\n\ntons of interesting information on cross-domain communication and\
    \ third-\n\nparty JavaScript development.\n\nwww.it-ebooks.info"
