  md: "**208**\n\nCHAPTER 9\n\n***Performance***\n\nit too long, and you have problems\
    \ with users getting older versions of your resources\n\nwhen you really want\
    \ them to have the latest.\n\n One way to solve this problem is to set a far-future\
    \ Expires header (tell the\n\nbrowser that this copy is good for, let’s say, one\
    \ year) and at the same time insert a\n\nunique version string into your resource’s\
    \ URL. When you want to force users to fetch\n\na new copy, you’ll modify the\
    \ version string. To see this in action, let’s borrow a code\n\nsnippet from chapter\
    \ 2 that loads required JavaScript files for the Camera Stork wid-\n\nget. We’ll\
    \ modify this snippet to use versioned URLs instead:\n\nloadScript('http://cdn.camerastork.com/'\
    \ + version + '/build/dom.js',\n\nfunction() {\n\n// use DOM library\n\n}\n\n\
    );\n\nYou’ll notice the version string comes immediately after the domain part\
    \ of the\n\nrequested file’s URL. In order to force browsers to ignore their cache\
    \ and download\n\nthe latest version of the file, all you need to do is change\
    \ this version string. This is\n\nbecause the new version resides at a different\
    \ URL, which means browsers will treat\n\nthe file as an entirely new, unknown\
    \ resource.\n\n In order for this approach to work, your scripts need to obtain\
    \ the current version\n\nfrom somewhere. And this version string can’t be obtained\
    \ through a similarly cached\n\nresource; otherwise users will be faced with the\
    \ same problem—they’ll never get an\n\nupdated version string and will never download\
    \ the latest set of files. The best solution\n\nis to include the version string\
    \ with your initial loader code and ensure it’s not cached\n\nby the browser (or\
    \ not cached for long). This is another reason for your initial loader\n\nscript\
    \ to be as small as possible: since it can’t be as aggressively cached, it’ll\
    \ be down-\n\nloaded far more often than your application’s other resources. \n\
    \n*9.1.4*\n\n*Deferring HTTP requests*\n\nAs you’re aware, third-party applications\
    \ often must download many different files in\n\norder to function (JavaScript,\
    \ CSS, images, and so on). But sometimes you’ll observe\n\nthat some of these\
    \ resources aren’t *immediately* essential to your application’s opera-\n\ntion.\
    \ And yet by downloading these additional resources up front, you’re increasing\n\
    \nthe crucial interval between the moment your application starts to load and\
    \ when it\n\ntakes effect on the publisher’s page.\n\n One technique you can employ\
    \ to decrease this interval is to *defer* non-essential\n\nHTTP requests. What\
    \ this means is that your application avoids loading such resources\n\nuntil they’re\
    \ absolutely necessary. This reduces the size of your initial payload, helping\n\
    \nyou to initialize your application faster. As an added bonus, you may find that\
    \ many\n\nbrowser users will never end up loading these deferred resources, which\
    \ can signifi-\n\ncantly reduce the amount of HTTP traffic sent to your servers.\n\
    \n There are a number of ways you can defer HTTP requests, but we’ll look at two\
    \ that\n\nare particularly beneficial to third-party widgets: deferring the entire\
    \ widget body, and\n\ndeferring image resources.\n\n**Final URL will look something\
    \ like http://**\n\n**cdn.camerastork.com/12345/build/dom.js**\n\nwww.it-ebooks.info"
