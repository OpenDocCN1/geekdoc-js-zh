    \ real avatar is being down-\n\nloaded. Ideally, the application should fetch\
    \ the real image a little sooner, to try to\n\navoid that swapping effect.\n\n\
    \ Listing 9.4 shows an optimized and improved version of the displayDeferred-\n\
