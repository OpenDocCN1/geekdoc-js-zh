  md: "**32**\n\nCHAPTER 2\n\n***Distributing and loading your application***\n\n\
    JAVASCRIPT MINIFIERS\n\nJavaScript minifiers are utilities that take JavaScript\n\
    \nsource code and rewrite it to be as short as possible, in order to reduce file\n\
    \nsize. This is usually accomplished by removing whitespace, renaming variables\n\
    \nto be as small as possible, or using alternate, terse forms of common opera-\n\
    \ntions. The output of code minifiers is usually difficult, if not impossible,\
    \ to\n\nread; they’re usually reserved for code that’s deployed in a production\
    \ envi-\n\nronment. You’ll learn more about minifiers in chapter 9 on performance.\n\
    \nThe second reason for redeclaring these variables centers mostly around the\n\
    \nundefined object. You’ll notice that undefined isn’t explicitly passed to the\
    \ function.\n\nBecause no value is passed, the undefined function argument is\
    \ given the default\n\nvalue of undefined by the browser. This would be true of\
    \ any function argument that\n\nisn’t passed an explicit value:\n\nfunction foo(a,\
    \ b) {\n\nconsole.log(a); // => 1\n\nconsole.log(b); // => undefined\n\n}\n\n\
    foo(1);\n\nThere’s a benefit to aliasing undefined like this. If the original\
    \ object has been modi-\n\nfied by code elsewhere in the current execution environment,\
    \ it won’t affect your\n\ncode, because you’re using a local alias that has the\
    \ original, untouched value. You’ll\n\nfind this is a common technique used by\
    \ JavaScript library authors. \n\n*2.3.2*\n\n*Basic application flow*\n\nMoving\
    \ on, let’s look at the function calls that are taking place in the main application\n\
    \nbody from listing 2.2. These are high-level functions that implement the basic\
    \ applica-\n\ntion flow described in figure 2.4. Not all third-party applications\
    \ will need to follow\n\nthese exact steps, but it’s a good starting place.\n\n\
    The first function, loadSupportingFiles, is intended to load any supporting files\n\
    \nneeded by the application before continuing. It’s not always necessary to load\
    \ addi-\n\ntional files, but many applications can benefit by splitting up their\
    \ JavaScript distribut-\n\nables into separate downloads, so we’ve included it\
    \ as a step. This function accepts a\n\nsingle parameter: a callback function\
    \ that’s intended to execute after loadSupport-\n\nFiles is finished:\n\nloadSupportingFiles(function()\
    \ {\n\nvar params = getWidgetParams();\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_56_0.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_1.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_0.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_1.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_0.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_5.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_6.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_7.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_8.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_9.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_10.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_5.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_6.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_7.png)![](img/5163284bc2a93c8f882ffdc058bb516a_56_8.png)\n\
    \nLoad supporting\n\nfiles\n\nFetch product \n\ndata\n\nIdentify product\n\nRender\
    \ product\n\nFigure 2.4\n\nHigh-level application flow for widget.js\n\nwww.it-ebooks.info"
