  md: "**119**\n\n***Fallback techniques***\n\nTo establish a connection between the\
    \ Flash object and its container, you can define\n\npublic interfaces using the\
    \ flash.external.ExternalInterface class. The class has a\n\npublic method, addCallback,\
    \ that can be used to register an ActionScript method as\n\ncallable from the\
    \ container. For example, to define a public postMessage method on\n\nthe Flash\
    \ object, you just need to call the ExternalInterface.addCallback and pro-\n\n\
    vide your method’s implementation:\n\nimport flash.external.ExternalInterface;\n\
    \nclass Main {\n\nprivate static function main(swfRoot:MovieClip):Void {\n\nExternalInterface.addCallback(\"\
    postMessage\", {},\n\nfunction(channel:String, message:String) {\n\n/\\* ... \\\
    */\n\n}\n\n);\n\n}\n\n}\n\nThe ExternalInterface class also exposes a public call\
    \ method that can be used to\n\naccess JavaScript properties and methods from\
    \ the host page. You can use that\n\nmethod to notify the host page about new\
    \ messages coming their way. The example in\n\nlisting 5.7 shows an implementation\
    \ of the onMessage function that notifies an exter-\n\nnal JavaScript method on\
    \ the host page. We took this example from the source code\n\nof a popular cross-domain\
    \ messaging library called easyXDM. We’ll cover easyXDM\n\nshortly in section\
    \ 5.3.\n\nlisteningConnection.onMessage =\n\nfunction(message, fromOrigin, remaining)\
    \ {\n\nif (fromOrigin !== remoteOrigin) {\n\nreturn;\n\n}\n\nincomingFragments.push(message);\n\
    \nif (remaining <= 0) {\n\n// escape \\\\\\\\ and pass on\n\nExternalInterface.call(prefix\
    \ +\n\n\"easyXDM.Fn.get(\\\\\"flash\\_\" + channel +\n\n\"\\_onMessage\\\\\")\"\
    ,\n\nincomingFragments.join(\"\").split(\"\\\\\\\\\").join(\"\\\\\\\\\\\\\\\\\"\
    ),\n\nremoteOrigin);\n\nincomingFragments = \\[\\];\n\n} else {\n\nlog(\"received\
    \ fragment, length is \" +\n\nmessage.length + \" remaining is \" + remaining);\n\
    \n}\n\n};\n\nThis ActionScript implementation of a cross-domain channel isn’t\
    \ the most fun pro-\n\ngram to write, so usually developers—including the authors\
    \ of this book—reuse an\n\nListing 5.7\n\n **onMessage** implementation from easyXDM\
    \ JavaScript library\n\n**Queue message parts**\n\n**Pass complete message **\n\
    \n**to provider**\n\nwww.it-ebooks.info"
