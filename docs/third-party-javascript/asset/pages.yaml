  md: "**181**\n\n***Implementing a bare-bones SDK***\n\nHere’s an example implementation\
    \ of broadcast as a private function inside sdk/\n\nlib.js. The reason it’s private?\
    \ You don’t want other parties—like publishers—trigger-\n\ning events in your\
    \ system:\n\nfunction broadcast(eventName) {\n\nif (!listeners\\[eventName\\])\
    \ {\n\nreturn;\n\n}\n\nfor (var i = 0; i < listeners\\[eventName\\].length; i++)\
    \ {\n\nlisteners\\[eventName\\]\\[i\\]();\n\n}\n\n}\n\nYou should invoke broadcast\
    \ wherever you want to publicize that an event has taken\n\nplace. We just looked\
    \ at one example event—productWidget.rendered—but there\n\nare plenty of use cases,\
    \ for example, to report when an affiliate link has been clicked\n\n(productWidget.referralClicked),\
    \ or if a user has signed in to your service\n\n(productWidget.authenticated).\
    \ Remember: these are your own internal events,\n\nand you’re free to name them\
    \ and initiate them as you see fit.\n\n At some point, publishers might want to\
    \ stop listening to an event. For example, if\n\na publisher is only interested\
    \ in a single occurrence of an event, they can unsubscribe\n\nafter it has occurred\
    \ once. This is where Stork.unlisten comes in—it unsubscribes a\n\npreviously\
    \ registered event handler from the system:\n\nStork.unlisten = function(eventName,\
    \ handler) {\n\nif (!listeners\\[eventName\\]) {\n\nreturn;\n\n}\n\nfor (var i\
    \ = 0; i < listeners\\[eventName\\].length; i++) {\n\nif (listeners\\[eventName\\\
    ]\\[i\\] === handler) {\n\nlisteners\\[eventName\\].splice(i, 1);\n\nbreak;\n\n\
    }\n\n}\n\n};\n\nBetween these three functions—Stork.listen, Stork.unlisten, and\
    \ the broadcast\n\nfunction—you now have all the pieces you need for publishers\
    \ to listen to events\n\noccurring in your application.\n\nUSING CUSTOM EVENT\
    \ LIBRARIES\n\nAs is the case with many things we’ve covered in this book, there\
    \ are open source alter-\n\nnatives to the example custom event code we just covered.\
    \ For example, jQuery has\n\nsupport for custom events using its regular DOM event\
    \ helper functions:¹\n\n\n\njQuery.bind—Attach an event handler to a DOM element.\n\
    \n1 You can find complete documentation for these functions on jQuery’s website:\
    \ http://api.jquery.com/\n\ncategory/events/.\n\nwww.it-ebooks.info"
