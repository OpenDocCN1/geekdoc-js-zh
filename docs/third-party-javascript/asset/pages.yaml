  md: "**145**\n\n***Setting third-party cookies***\n\nor—better yet—testing for the\
    \ presence of a unique Safari browser property. Since\n\nany browser can “spoof”\
    \ a user-agent string, property testing is often preferred.\n\n Here’s a function\
    \ that returns true if the current browser is Safari. It does this by\n\ncalling\
    \ toString on the window.HTMLElement property and checking whether the\n\nresult\
    \ is \\[object HTMLElementConstructor\\]. Only Safari is known to return this\
    \ spe-\n\ncific value:\n\nfunction isSafari() {\n\nreturn Object.prototype.toString.call(window.HTMLElement)\
    \ ===\n\n\"\\[object HTMLElementConstructor\\]\";\n\n}\n\nArmed with this function,\
    \ your code to decide whether to use an iframe-based solu-\n\ntion or whether\
    \ to use a new window solution (like we just covered in 6.2.1) might\n\nlook like\
    \ this.\n\nfunction initiateLogin() {\n\nif (isSafari()) {\n\nshowIframeForm();\n\
    \n} else {\n\nopenLoginWindow();\n\n}\n\n}\n\nvar login = document.getElementById('login');\n\
    \nif (login.addEventListener) {\n\nlogin.addEventListener('click', initiateLogin,\
    \ false);\n\n} else if (login.attachEvent) {\n\nlogin.attachEvent('onclick', initiateLogin);\n\
    \n}\n\nAll that’s left is to render a form inside your iframe and have it authenticate\
    \ the user\n\nafter it’s POSTed. The tricky thing is that you can’t render the\
    \ form inside the same\n\niframe that’s shared with your widget visuals. Otherwise,\
    \ when the form submits, the\n\nentire iframe will be reloaded. You could render\
    \ the same contents when the iframe\n\nreturns, but there will be a momentary\
    \ blip where the iframe will appear empty, and\n\nthat’s undesirable.\n\n The\
    \ solution? A second iframe for displaying the authentication form, embedded\n\
    \ninside the main top-level iframe (see figure 6.7).\n\n Now, when the user submits\
    \ the login form, only the login iframe will refresh. The\n\nparent iframe will\
    \ remain the same. And because this is a regular form POST initiated\n\nby the\
    \ user, any cookies set in the HTTP response of the form submission will be per-\n\
    \nsisted in Safari, even with third-party cookies disabled.\n\n Hopefully, at\
    \ this point in the book you know how to create an iframe element and\n\npoint\
    \ it to a URL on an external website—in this case, a dedicated login form page\n\
    \nhosted on camerastork.com. Also, because the iframe is a window object, you\
    \ can use\n\nListing 6.4\n\nDeciding which persistence technique to use when initiating\
    \ a login\n\nwww.it-ebooks.info"
