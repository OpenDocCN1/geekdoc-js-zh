  md: "**50**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\n So, if you were distributing\
    \ the Camera Stork widget using a standard script\n\ninclude, you’d do something\
    \ like this:\n\n<script src=\"http://camerastork.com/widget.js?product=1337\"\
    ></script>\n\nYour application code could use document.write to output your widget\
    \ HTML to the\n\npublisher’s page:\n\ndocument.write(\n\n'<div>' +\n\n'\n\n<h3>Mikon\
    \ E90 Digital SLR</h3>' +\n\n'\n\n<img src=\"http://camerastork.com/img/1337-small.jpg\"\
    />' +\n\n'\n\n<p>$599.99</p>' +\n\n'\n\n<p>4.3/5.0 &bull; 176 Reviews</p>' +\n\
    \n'</div>'\n\n);\n\nIf this looks familiar, it should. You used document.write\
    \ like this in the first widget\n\nexample from chapter 1.\n\n But using document.write\
    \ is actually *not* advisable as a technique for rendering on\n\nthe publisher’s\
    \ page. This is because it depends on a standard blocking script include,\n\n\
    which, as you learned in the previous chapter, isn’t recommended for third-party\n\
    \nscripts. Blocking scripts can prevent the publisher’s page from processing,\
    \ which can\n\ncause serious performance issues for publishers if your script\
    \ files load slowly or—\n\nworse yet—become unavailable. Instead, we advised that\
    \ you use asynchronous script\n\nloading techniques (like dynamically inserting\
    \ a script DOM element), which unfortu-\n\nnately can’t be used in conjunction\
    \ with document.write.\n\n This doesn’t mean document.write is without value.\
    \ As you’ll see later in this chap-\n\nter, it can be a powerful tool in a number\
    \ of different contexts. But for the immediate\n\nproblem of rendering on the\
    \ publisher’s DOM, we’ll need a different approach—one\n\nthat doesn’t necessitate\
    \ blocking the browser. \n\n*3.1.2*\n\n*Appending to a known location*\n\nWe feel\
    \ the best way to render markup on the publisher’s page is to convert your\n\n\
    HTML string to DOM elements, and then append them to an element that already\n\
    \nexists on the publisher’s page. This method works whether you’re using blocking\n\
    \nscript includes or asynchronous script includes. It’s win-win.\n\n To do this,\
    \ you need to first create a container element using document.create-\n\nElement.\
    \ This element will hold the HTML that composes the widget. To do that,\n\nyou’ll\
    \ assign the HTML string to the container element’s innerHTML property:\n\nvar\
    \ html =\n\n'<div>' +\n\n'\n\n<h3>Mikon E90 Digital SLR</h3>' +\n\n'\n\n<img src=\"\
    http://camerastork.com/img/1337-small.jpg\"/>' +\n\n'\n\n<p>$599.99</p>' +\n\n\
    '\n\n<p>4.3/5.0 &bull; 176 Reviews</p>' +\n\n'</div>';\n\nwww.it-ebooks.info"
