  md: "**234**\n\nCHAPTER 10\n\n***Debugging and testing***\n\nBecause you have absolutely\
    \ no idea what’s causing the failure, it’s a good strategy to\n\npause at the\
    \ beginning of the function and see what happens. There are two ways to\n\nplace\
    \ a breakpoint: using the debugger’s UI or placing the special debugger keyword\n\
    \ninside your JavaScript code. When using the latter, you need to insert it just\
    \ before the\n\nline on which you’d like to pause the execution:\n\nStork.prototype.submitReview\
    \ =\n\nfunction (data, onSuccess, onFailure) {\n\n**debugger;**\n\nif (!data.reviewText)\
    \ {\n\nreturn;\n\n}\n\nvar channel = this.getChannel();\n\nvar message = JSON.stringify(data);\n\
    \nchannel.submit(message, onSuccess, onFailure);\n\n};\n\nNow you have to inspect\
    \ whether your input data is correct—because if it isn’t, you’ll\n\nhave to go\
    \ back and put a breakpoint earlier in the code. In this case, the data hap-\n\
    \npens to be valid, so you’ll have to dig deeper into this function in order to\
    \ find the\n\nsource of the bug. You’ll use the debugger to step through the code\
    \ until the line\n\nwhere the message variable is created. \n\nHOW TO STEP THROUGH\
    \ THE CODE\n\nEvery browser’s debugger has a slightly different—but similar—user\
    \ interface for step-\n\nping through code. Figure 10.5 shows a screenshot of\
    \ Chrome’s JavaScript debugger.\n\nSafari’s JavaScript debugger looks and behaves\
    \ nearly the same.\n\n When you’re on the statement that stringifies the data\
    \ object, you can step for-\n\nward once more to execute JSON.stringify and then\
    \ use the console or debugger’s\n\nScope Variables pane to check the value of\
    \ the message variable:\n\n\\> console.log(message);\n\n\"\"{\\\\\"reviewText\\\
    \\\":\\\\\"This camera is great!\\\\\",\\\\\"user\\\\\":1,\\\\\"camera\\\\\":2}\"\
    \"\n\nThere’s something odd about the output. JSON.stringify is supposed to turn\
    \ a\n\nJavaScript object into a string, but the current value of the message contains\
    \ escaped\n\ndouble quotes. This means that JSON.stringify must have done its\
    \ job *twice*—it first\n\nturned your data object into a string, and then subsequently\
    \ turned that string into\n\nanother, escaped, string. Clearly not what you’d\
    \ expect from the browser’s built-in\n\nJSON.stringify function.\n\nTHE CRAFT\
    \ OF DEBUGGING\n\nWhen it comes to debugging JavaScript applica-\n\ntions, there\
    \ are no big theories or complicated concepts. All you can do is\n\nmake an educated\
    \ guess, place a breakpoint, pause execution, and start step-\n\nping through\
    \ the code—line by line. You continue this process until you\n\nnotice an oddity—such\
    \ as a variable that holds an unexpected value or a func-\n\ntion that doesn’t\
    \ return what it’s supposed to return. Such oddities are your\n\nclues. Use them\
    \ to make theories about your bug and then test these theories\n\n**Browser will\
    \ pause **\n\n**JavaScript execution **\n\n**here and give you **\n\n**control\
    \ over it.**\n\nwww.it-ebooks.info"
