  md: "**51**\n\n***Outputting HTML***\n\nvar div = document.createElement('div');\n\
    \ndiv.innerHTML = html;\n\nAt this point you have a <div> container element that\
    \ holds your widget’s markup. All\n\nthat remains is to append this element to\
    \ the publisher’s page. But where to append\n\nit? The most common use case is\
    \ to append to where the publisher has located the\n\nscript include snippet—the\
    \ one that loads your application. To do that, you need to\n\nfirst locate the\
    \ script include snippet on the page.\n\nJAVASCRIPT TEMPLATING LIBRARIES\n\nOnce\
    \ upon a time, JavaScript developers\n\nused to write HTML directly in their JavaScript\
    \ files—like in the examples\n\nwe’ve shown you so far. Alas, string concatenation\
    \ isn’t JavaScript’s strong\n\nsuit, and these HTML snippets can become tedious\
    \ to write and maintain.\n\nInstead, most developers use JavaScript templating\
    \ libraries, which allow you\n\nto write your HTML in a templating language explicitly\
    \ designed for generat-\n\ning markup. There are a variety of templating libraries\
    \ out there, but we rec-\n\nommend looking at Mustache.js and its spin-offs, Handlebars.js\
    \ and Hogan.js.\n\nLOCATING THE SCRIPT INCLUDE SNIPPET\n\nIn order to locate your\
    \ script’s include snippet, it needs to be uniquely identifiable on\n\nthe DOM\
    \ in some way. One way you can do this is by adding a predefined ID, class, or\n\
    \ndata-\\* attribute to the include snippet’s <script> tag. Then, you merely need\
    \ to query\n\nthe DOM for this identifying attribute in order to locate the script\
    \ element.\n\n Consider this asynchronous script include snippet for the Camera\
    \ Stork widget,\n\nwhich passes the product ID as part of the query string. This\
    \ snippet now carries a\n\nunique ID, stork-widget, as part of the containing\
    \ <script> tag.\n\n<script id=\"stork-widget\">\n\n(function() {\n\nvar script\
    \ = document.createElement('script');\n\nscript.async = true;\n\nscript.src =\
    \ 'http://camerastork.com/widget.js?product=1234';\n\nvar entry = document.getElementsByTagName('script')\\\
    [0\\];\n\nentry.parentNode.insertBefore(script, entry);\n\n})();\n\n</script>\n\
    \nAfter the widget code is loaded, it’s easy to identify the script include on\
    \ the DOM\n\nusing document.getElementById. Get a reference to the script element,\
    \ and then\n\ninsert your newly created container element before it:\n\nvar appendTo\
    \ = document.getElementById('stork-widget');\n\nappendTo.parentNode.insertBefore(div,\
    \ appendTo);\n\nOf course, by using an ID like this to identify the include widget,\
    \ you’ll only be able to\n\nhave one widget rendered per page. This is because\
    \ querying by ID will always return\n\nListing 3.1\n\nThe script include snippet,\
    \ now with a unique ID\n\nwww.it-ebooks.info"
