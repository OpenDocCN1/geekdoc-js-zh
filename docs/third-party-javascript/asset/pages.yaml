  md: "**236**\n\nCHAPTER 10\n\n***Debugging and testing***\n\nALWAYS CHECK FOR OVERWRITTEN\
    \ NATIVES\n\nWhen debugging third-party\n\nJavaScript applications, your first\
    \ assumption should always be that the pub-\n\nlisher overwrote a native JavaScript\
    \ object. This theory is correct more often\n\nthan not; nothing protects from\
    \ overwriting—or shadowing—native\n\nJavaScript objects, and publishers often\
    \ don’t realize what damage they can\n\ncause when modifying these objects. \n\
    \nWHEN FACED WITH NATIVE FUNCTIONS IMPERVIOUS TO DEBUGGERS\n\nIn this case, the\
    \ native JSON functions don’t appear to have been modified. Is it a\n\nbrowser\
    \ bug? Unfortunately, you’re now at the point where you can’t inspect these\n\n\
    functions any further because JavaScript debuggers can’t step into native code.\
    \ When\n\nfaced with misbehaving built-in functions, a good rule of thumb is to\
    \ find the func-\n\ntion’s specification and learn how it’s supposed to work.\
    \ Go over the specification step\n\nby step while trying to find the spot where\
    \ the implementation fails.\n\n In this case, we’ll spare you two good hours of\
    \ studying the JSON spec and reading\n\nthrough the browser’s source code. JSON.stringify,\
    \ before turning an object into a\n\nJSON string, checks whether that object defines\
    \ a special toJSON method. This\n\nmethod, per specification, should return a\
    \ simplified object that can be properly seri-\n\nalized if the original object\
    \ can’t be serialized. With this knowledge handy, let’s try to\n\ncheck whether\
    \ there’s a toJSON method on your data object;\n\n\\> data.toJSON()\n\n\"{\"reviewText\"\
    :\"This camera is great!\",\"user\":1,\"camera\":2}\"\n\nWhoa! Not only does the\
    \ data.toJSON method exist, it actually does what JSON.stringify\n\nwas supposed\
    \ to do—it turns the data object into a JSON string! This explains the quotes\n\
    \nduplication and why JSON.stringify was broken without being overwritten. And\
    \ since\n\nyour code is working on every other publisher’s site just fine, it’s\
    \ a reasonable assump-\n\ntion that the publisher has a rogue script that’s causing\
    \ this behavior.\n\nPROTOTYPE.JS AND TOJSON ISSUES\n\nDoes this example problem\
    \ seem unlikely?\n\nWell, it actually happened. At Disqus, we discovered that\
    \ an older version of a\n\npopular JavaScript library—Prototype.js—was overwriting\
    \ Object.prototype\n\n.toJSON with a custom JSON serializer. This serializer didn’t\
    \ match the toJSON\n\nspecification and had edge cases that produced different\
    \ results. This bug has\n\nbeen subsequently fixed in later versions of Prototype.js,\
    \ but there are still\n\nwebsites out there that are serving the old version.\
    \ Watch out!\n\nIs there a way to fix this problem without telling your publisher\
    \ to fix their code?\n\nOne solution is to write a JSON polyfill that omits the\
    \ toJSON part of the specifica-\n\ntion. Use this polyfill when it appears that\
    \ the publisher’s page has made the JSON\n\nobject unusable:\n\nvar corrupted\
    \ = false;\n\nvar arr = \\[1, 2, 3\\];\n\nStork.JSON = {};\n\nwww.it-ebooks.info"
