  md: "**33**\n\n***Loading additional files***\n\ngetRatingData(params, function()\
    \ {\n\ndrawWidget();\n\n});\n\n});\n\nIn the callback function, any parameters\
    \ passed to the script are extracted using\n\ngetWidgetParams. For now, the Camera\
    \ Stork example will make use of a single\n\nparameter: the ID of the product\
    \ the publisher is trying to display on their website.\n\nBut there are plenty\
    \ of other parameters you could pass. For example, you could\n\nembed identifying\
    \ information about the publisher in the script include snippet, and\n\npass that\
    \ information to your servers. This could be useful if you want to track which\n\
    \npublishers are sending you traffic—the Camera Stork business could even pay\
    \ publish-\n\ners affiliate revenue for each sale they help generate.\n\n After\
    \ the script has extracted those parameters, it’s time to get data about the\n\
    \nproduct from the server using the getRatingData function. This data will be\
    \ the\n\nname of the product, perhaps a URL where the product can be purchased,\
    \ and the\n\ncurrent rating or score. As a final step, after the data has been\
    \ received from the\n\nserver, the application uses this data to render the actual\
    \ widget on the page. This\n\ntakes place inside the drawWidget function.\n\n\
    \ It’s worth noting that none of these functions exist yet. We’ve strictly taken\
    \ a high-\n\nlevel overview of the widget.js code. You’ll be implementing these\
    \ functions over the\n\nnext few sections. Let’s start with the first: loadSupportingFiles.\
    \ \n\n*2.4*\n\n*Loading additional files*\n\nIt’s possible that your third-party\
    \ script might only rely on a single JavaScript file. But\n\nit’s more likely\
    \ that, like most web applications, your script will depend on a number\n\nof\
    \ supporting files. These could be files of your own (such as a script that contains\n\
    \nhelper functions), or files that contain helpful JavaScript libraries, like\
    \ jQuery or\n\nPrototype.js. Often you’ll need to have these files in place before\
    \ your script can per-\n\nform any further actions.\n\n You could always expand\
    \ the script include snippet to include any additional files\n\nyou intend to\
    \ load. For example, you could ask publishers to include the following\n\ncode\
    \ on their pages:\n\n<script src=\"http://camerastork.com/widget/jquery.js\"></script>\n\
    \n<script src=\"http://camerastork.com/widget/helpers.js\"></script>\n\n<script\
    \ src=\"http://camerastork.com/widget.js\"></script>\n\nThis will work; it loads\
    \ the supporting files (jquery.js, helpers.js) before the main wid-\n\nget file\
    \ (widget.js). But altering the script include snippet like this is a really bad\
    \ idea.\n\nColossally bad. It’s bad because it’s incredibly inflexible; you’re\
    \ committed to always\n\nloading these files. If you ever need to change what\
    \ files you’re depending on, you\n\nwon’t be able to, because this code is stuck\
    \ on the publishers’ pages. And getting pub-\n\nlishers to update their HTML source\
    \ with new code is notoriously difficult.\n\nwww.it-ebooks.info"
