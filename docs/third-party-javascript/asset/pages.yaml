  md: "**29**\n\n***Loading the initial script***\n\n Here’s the widget script include\
    \ one more time, using the async attribute:\n\n<script async\n\nsrc=\"http://camerastork.com/widget.js?product=1234\"\
    ></script>\n\nThough both async and defer are helpful attributes that prevent\
    \ your script from\n\nblocking the publisher’s page, we feel that async is the\
    \ better choice for third-party\n\nscripts. Because async scripts can execute\
    \ before the page is finished processing, they\n\nenable your script files to\
    \ initialize and run your application as soon as possible.\n\nDeferred scripts,\
    \ on the other hand, could spend a long time waiting for the browser\n\nto finish\
    \ processing the page.\n\n Alas, like many HTML5 features, the downside to the\
    \ async attribute is that it isn’t\n\nsupported by every browser. You’ll find\
    \ that only “modern” browsers like Firefox 3.6+,\n\nChrome, Safari, and Internet\
    \ Explorer 10 recognize it. That leaves plenty of old, but\n\nstill actively used,\
    \ browsers that don’t support the async attribute. But we’re not out of\n\nluck:\
    \ there’s another way to load scripts asynchronously that’s backward compatible\n\
    \nwith such older browsers.\n\nWHEN TO USE BLOCKING SCRIPTS\n\nSynchronous scripts\
    \ aren’t all bad. There\n\nare a few instances where you’ll want a blocking <script>\
    \ tag. For instance, if\n\nyou need to render HTML to the page before anything\
    \ else renders, you’ll\n\nwant to use a blocking script. Asynchronous scripts\
    \ that render new elements\n\nmight not do so until after the page has mostly\
    \ loaded, possibly causing ele-\n\nments to reflow and temporarily look poor.\
    \ \n\n*2.2.3*\n\n*Dynamic script insertion*\n\nIt turns out you can re-create\
    \ the behavior achieved by the async attribute by dynami-\n\ncally creating a\
    \ script DOM element in JavaScript and appending it to the publisher’s\n\npage.\
    \ Because you can append this script element to an arbitrary DOM location, even\n\
    \none that has already been processed by the browser, browsers don’t preserve\
    \ execu-\n\ntion order for JavaScript loaded in this fashion. And because execution\
    \ order isn’t\n\npreserved, the browser downloads these files in parallel. This\
    \ is your path to asynchro-\n\nnous script loading in browsers old and new.\n\n\
    \ Here’s how the script include snippet looks using dynamic <script> tag insertion.\n\
    \n<script>\n\n(function() {\n\nvar script = document.createElement('script');\n\
    \nscript.src\n\n\\= 'http://camerastork.com/widget.js?product=1234';\n\nscript.async\
    \ = true;\n\nvar entry = document.getElementsByTagName('script')\\[0\\];\n\nListing\
    \ 2.1\n\nAsynchronous script include\n\n**Immediately-invoked function **\n\n\
    **expression (IIFE) prevents **\n\n**declared variables from **\n\n**leaking into\
    \ global scope.**\n\n**Create new**\n\n**script DOM**\n\n**element.**\n\n**Set\
    \ async property to true **\n\n**to support asynchronous **\n\n**loading in Opera\
    \ and older **\n\n**versions of Firefox.**\n\nwww.it-ebooks.info"
