    \ + document.cookie;\n\n</script>\n\nWhat does this code do? Every time this review\
    \ is loaded, it generates a new Image\n\nDOM element, but stops before attaching\
    \ it to the document. Images that have never\n\nbeen attached to the DOM aren’t\
    \ visible to users; they’re stored only in memory and\n\nnowhere else. But despite\
    \ not being visible, browsers still issue HTTP requests to down-\n\nload the corresponding\
    \ image file,⁴ which is exactly what the attacker needs. The src\n\nURL here (attacker.example.com)\
    \ isn’t an image at all, but a server endpoint hosted\n\nby the attacker that\
    \ collects stolen cookies. You can see that the cookie data itself is\n\ntransferred\
    \ using the target URL’s query string. When this code has been inserted into\n\
    \nthe Camera Stork website, and is being requested by visitors, the attacker simply\
    \ needs\n\nto monitor their logs and store all the session identifiers they receive.\
    \ Diabolical.\n\n Usually, session identifiers aren’t attached to a particular\
    \ computer, so the only\n\nthing the attacker needs to do to complete their plan\
    \ is to present any obtained iden-\n\ntifiers as their own cookie data. After\
    \ that, the attacker becomes an authenticated user\n\nwith permissions to do whatever\
