  md: "**8**\n\nCHAPTER 1\n\n***Introduction to third-party JavaScript***\n\nfunction\
    \ initialize() {\n\nvar mapOptions = {\n\nzoom: 8,\n\ncenter: new google.maps.LatLng(43.6481,\
    \ -79.4042),\n\nmapTypeId: google.maps.MapTypeId.ROADMAP\n\n};\n\nmap = new google.maps.Map(document.getElementById('map\\\
    _canvas'),\n\nmapOptions);\n\n}\n\n</script>\n\n</head>\n\n<body onload=\"initialize()\"\
    >\n\n<div id=\"map\\_canvas\" style=\"width: 500px; height: 300px\"></div>\n\n\
    </body>\n\n</html>\n\nWe just looked at two examples of embedded widgets. But\
    \ really, any application idea\n\nis fair game for embedding on a publisher’s\
    \ page. In our own travels, we’ve come\n\nacross a wide variety of widgets: content\
    \ management widgets, widgets that play real-\n\ntime video, widgets that let\
    \ you chat in real time with a customer support person, and\n\nso on. If you can\
    \ dream it, you can embed it. \n\n*1.2.2*\n\n*Analytics and metrics*\n\nThird-party\
    \ JavaScript isn’t used exclusively in the creation of embedded widgets.\n\nThere\
    \ are other uses that don’t necessarily involve graphical, interactive web page\
    \ ele-\n\nments. Often they’re silent scripts that process information on the\
    \ publisher’s page\n\nwithout the user ever knowing they’re there. The most common\
    \ such use case is in\n\nanalytics and metrics gathering.\n\n One of JavaScript’s\
    \ most powerful features is that it enables developers to capture\n\nand respond\
    \ to user events as they occur on a web page. For example, you can write\n\nJavaScript\
    \ to respond to a website visitor’s mouse movements and/or mouse clicks.\n\nThird-party\
    \ scripts are no exception: they too can observe browser events and capture\n\n\
    data about how the visitor interacts with the publisher’s page. This might include\n\
    \ntracking how long a visitor stays on a page before moving on, what content they\
    \ saw\n\nwhile they were reading the page, and where they went afterward. There\
    \ are dozens of\n\nbrowser events your JavaScript code can hook into from which\
    \ you could derive hun-\n\ndreds of different insights.\n\nPASSIVE SCRIPTS\n\n\
    Crazy Egg, another web startup, is one example of an organization that uses third-\n\
    \nparty scripts in this way. Their analytics product generates visualizations\
    \ of user activity\n\non your web page (see figure 1.4). To obtain this data,\
    \ Crazy Egg distributes a script to\n\npublishers that captures the mouse and\
    \ scroll events of web page visitors. This data is\n\nsubmitted back to Crazy\
    \ Egg’s servers, all in the same script. The visualizations Crazy\n\nEgg generates\
    \ help publishers identify which parts of their website are being accessed\n\n\
    frequently, and which are being ignored. Publishers use this information to improve\n\
    \ntheir web design and optimize their content.\n\nwww.it-ebooks.info"
