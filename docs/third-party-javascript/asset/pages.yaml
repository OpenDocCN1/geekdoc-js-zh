  md: "**4**\n\nCHAPTER 1\n\n***Introduction to third-party JavaScript***\n\n...\n\
    \n<script src=\"http://thirdparty.com/app.js\"></script>\n\n</body>\n\n</html>\n\
    \nThere’s no right or wrong answer; you can make an argument for both interpreta-\n\
    \ntions. But for the purposes of this book, we’re particularly interested in the\
    \ latter defi-\n\nnition. When we refer to third-party JavaScript, we mean code\
    \ that is\n\nNot authored by the content provider\n\nServed from external servers\
    \ that aren’t controlled by the content provider\n\nWritten with the intention\
    \ that it’s to be executed as part of a content provider’s\n\nwebsite\n\nWHERE’S\
    \ TYPE=\"TEXT/JAVASCRIPT\"?\n\nYou might have noticed that the\n\n<script> tag\
    \ declarations in this example don’t specify the type attribute.\n\nFor an “untyped”\
    \ <script> tag, the default browser behavior is to treat the\n\ncontents as JavaScript,\
    \ even in older browsers. In order to keep the examples\n\nin this book as concise\
    \ as possible, we’ve dropped the type attribute from\n\nmost of them.\n\nSo far\
    \ we’ve been looking at third-party scripts from the context of a content provider.\n\
    \nLet’s change perspectives. As *developers* of third-party JavaScript, we author\
    \ scripts that\n\nwe intend to execute on a content provider’s website. In order\
    \ to get our code onto\n\nthe provider’s website, we give them HTML code snippets\
    \ to insert into their pages\n\nthat load JavaScript files from our servers (see\
    \ figure 1.2). We aren’t affiliated with the\n\nwebsite provider; we’re merely\
    \ loading scripts on their pages to provide them with\n\nhelpful libraries or\
    \ useful self-contained applications.\n\n If you’re scratching your head, don’t\
    \ worry. The easiest way to understand what\n\nthird-party scripts are is to see\
    \ how they’re used in practice. In the next section, we’ll\n\ngo over some real-world\
    \ examples of third-party scripts in the wild. If you don’t know\n\nwhat they\
    \ are by the time we’re finished, then our status as third-rate technical\n\n\
    authors will be cemented. Onward!\n\n*1.2*\n\n*The many uses of third-party JavaScript*\n\
    \nWe’ve established that third-party JavaScript is code that’s being executed\
    \ on someone\n\nelse’s website. This gives third-party code access to that website’s\
    \ HTML elements and\n\nJavaScript context. You can then manipulate that page in\
    \ a number of ways, which\n\nmight include creating new elements on the DOM (Document\
    \ Object Model), insert-\n\ning custom stylesheets, and registering browser events\
    \ for capturing user actions. For\n\nthe most part, third-party scripts can perform\
    \ any operation you might use JavaScript\n\nfor on your own website or application,\
    \ but instead, on someone else’s.\n\n**JavaScript file **\n\n**loaded from **\n\
    \n**external (third-**\n\n**party) server**\n\nwww.it-ebooks.info"
