    \ third-party JavaScript applications. In the next\n\nchapter, we’ll look at optimizing\
    \ the performance of these applications. After all, what\n\ngood is a third-party\
    \ application if it’s slow?\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_225_0.png)\n\
    \nFigure 8.3\n\nFacebook’s OAuth authorization page, where users can authorize\
    \ API \n\napplications to access their data or perform actions on their behalf\n\
    \nwww.it-ebooks.info"
