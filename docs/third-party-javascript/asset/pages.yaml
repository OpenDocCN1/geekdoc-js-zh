  md: "**86**\n\nCHAPTER 4\n\n***Communicating with the server***\n\nOne last thing:\
    \ the earlier example code from listing 4.1 always uses jsonpCallback as\n\nthe\
    \ callback function’s name:\n\nscript.src =\n\n'http://thirdpartyjs.com/info.js?callback=jsonpCallback';\n\
    \nIn real-world applications, you should generate a new, unique callback function\
    \ name\n\nfor each JSONP request, either using a random value, timestamp, or incrementing\
    \ ID.\n\nThis will prevent potential conflicts with other, concurrent JSONP requests.\
    \ Most pop-\n\nular AJAX libraries (including jQuery) already include functions\
    \ for making JSONP\n\nrequests, and they’ll generate unique callback functions\
    \ for you.\n\n*4.2.3*\n\n*Limitations and security concerns*\n\nJSONP is a fairly\
    \ simple technique and, armed with the examples from section 4.2,\n\nyou have\
    \ everything you need to use it. Although it can be powerful, it’s not a silver\n\
    \nbullet for all of your cross-domain needs. The trick that makes it so easy and\
    \ so pow-\n\nerful (<script> element injection) is also responsible for all its\
    \ limitations and secu-\n\nrity issues.\n\n First and foremost, JSONP only works\
    \ with GET HTTP requests. Just as you can’t\n\nload JavaScript files using POST,\
    \ PUT, or DELETE request methods, the same goes for\n\nJSONP. Being restricted\
    \ to GET requests means a number of limitations. For starters,\n\nthe amount of\
    \ data you can submit to the server is limited to the browser’s maximum\n\nURL\
    \ size (only 2,083 characters in Internet Explorer; see http://support.microsoft\n\
    \n.com/kb/208427). Additionally, you can’t use multipart forms for uploading files.\
    \ It\n\ncan also make it difficult to work with REST\\-based APIs that use different\
    \ HTTP request\n\nmethods to identify API calls. If you’re implementing such an\
    \ API, you’ll likely have to\n\nimplement special GET\\-only endpoints that work\
    \ with your JSONP requests.\n\nJSONP and other response formats\n\nIt’s technically\
    \ possible to support other response formats besides JSON with\n\nJSONP. For example,\
    \ your JSONP endpoint could alternatively return a response con-\n\ntaining an\
    \ XML string:\n\njsonpCallback(\n\n'<?xml version=\"1.0\" encoding=\"UTF-8\" ?>'\
    \ +\n\n'<response>' +\n\n'\n\n<title>Third-party JavaScript</title>' +\n\n'\n\n\
    <author>Anton</author>' +\n\n'\n\n<author>Ben</author>' +\n\n'\n\n<publisher>Manning</publisher>'\
    \ +\n\n'</response>'\n\n);\n\nYour application code would then need to take this\
    \ XML string and deserialize it in\n\norder for it to be useful. But this is kind\
    \ of silly—JSONP in its normal form already\n\nreturns a JavaScript object, so\
    \ by using an intermediate format you’re merely creating\n\nmore work for yourself.\
    \ \n\nwww.it-ebooks.info"
