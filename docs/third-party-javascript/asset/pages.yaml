  md: "**136**\n\nCHAPTER 6\n\n***Authentication and sessions***\n\nIE, Opera, and\
    \ Safari are more forgiving. In those browsers, if a cookie is already\n\nbeing\
    \ stored for a particular domain, any HTTP requests to that domain will also trans-\n\
    \nmit that cookie, even to third-party domains. In other words, if your application\
    \ can\n\nfind a way to set a cookie in these browsers, it can continue restoring\
    \ a user’s session\n\nwhenever it’s loaded. We’ll show you how to use this to\
    \ your advantage later in this\n\nchapter.\n\nNEW BROWSER VERSIONS MAY TREAT COOKIES\
    \ DIFFERENTLY\n\nPlease note that\n\nthe values in table 6.2 represent the state\
    \ of browser behavior today, and are\n\nlikely to change in the future. In fact,\
    \ we’ve had to change this table over the\n\ncourse of writing this book. At one\
    \ point, Chrome was less restrictive, and per-\n\nmitted transmitting third-party\
    \ cookies when the associated browser setting\n\nwas disabled. That changed in\
    \ early 2012 when Chrome version 18 was\n\nreleased, which introduced more restrictive\
    \ cookie behaviour. \n\n*6.1.3*\n\n*Internet Explorer and P3P headers*\n\nBefore\
    \ we move on, you might’ve noticed that in table 6.2’s *Disabled by default* column,\n\
    \nthere’s a comment beside Internet Explorer. By default, Internet Explorer employs\
    \ a\n\nMedium security policy, which disables third-party cookies on sites that\
    \ don’t provide\n\na *compact privacy policy* (see figure 6.3). Compact privacy\
    \ policies are part of the Plat-\n\nform for Privacy Preferences Specification\
    \ (see http://www.w3.org/TR/P3P/), a pro-\n\ntocol designed by the W3C (P3P; Platform\
    \ for Privacy Preferences Project) that allows\n\nwebsites to declare how they\
    \ intend to use data collected from users.\n\n What this means is that, in order\
    \ to set third-party cookies for Internet Explorer\n\nusers (with default security\
    \ settings), you need to return a special P3P HTTP header\n\nwith your resources\
    \ that declares how your service intends to employ user data. This\n\nheader needs\
    \ to be returned with *all* HTTP responses for your resources, not just those\n\
    \nthat set cookies. This means static resources, AJAX endpoints, iframes—everything.\n\
    \n Here’s an example of a P3P header returned from a resource that specifies a\
    \ com-\n\npact privacy policy:\n\nP3P: CP=\"ADM DEV PSA COM OUR STP IND\"\n\n\
    Each of those three-letter values are part of the P3P specification and represent\
    \ what,\n\nwith whom, and in what way the service will make use of the user’s\
    \ data. Table 6.3 elab-\n\norates on these values.\n\n Please note that this table\
    \ only describes those values from the example P3P\n\nresponse. There are actually\
    \ *dozens* of possible values in the P3P specification, so many\n\nthat we can’t\
    \ list them all here. When you create your own P3P header to return with\n\nyour\
    \ resources, please make sure that it accurately reflects the practices of your\
    \ busi-\n\nness, and isn’t just copied carte blanche (from this book or elsewhere).\
    \ If you need\n\nhelp generating a P3P policy, check out p3ptoolbox.com for resources.\n\
    \nwww.it-ebooks.info"
