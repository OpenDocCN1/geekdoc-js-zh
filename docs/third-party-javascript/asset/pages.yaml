  md: "**140**\n\nCHAPTER 6\n\n***Authentication and sessions***\n\nAt this point,\
    \ you should have all the tools you need to detect whether third-party\n\ncookies\
    \ are disabled. But what if they are? Next up, we’ll look at a handful of work-\n\
    \narounds for persisting sessions even when third-party cookies are unavailable.\
    \ \n\n*6.2*\n\n*Setting third-party cookies*\n\nAs you learned in the last section,\
    \ there are three browsers that send preexisting cook-\n\nies to third-party URLs\
    \ even if third-party cookies are disabled: Internet Explorer,\n\nSafari, and\
    \ Opera. The problem is getting those cookies there to begin with; you can’t\n\
    \ncreate new cookies from your application when third-party cookies are disabled.\
    \ If you\n\ncan somehow find a way to create a new cookie on your application’s\
    \ domain, then\n\nyou’re in the clear. But how?\n\nDownload main page from publisher.com.\n\
    \nWeb browser\n\npublisher.com\n\nJavaScript on page creates iframe \n\ncontaining\
    \ cookies.html via easyXDM.\n\nCode in iframe tries to set cookie, and then checks\
    \ \n\nto see whether cookie is actually there.\n\neasyXDM call returns result\
    \ to original script. \n\nNow we know if third-party cookies are allowed.\n\n\
    camerastork.com\n\ncookies.html\n\ncookies.html\n\ncookies.html\n\nCheck for cookie\n\
    \nRemember, easyXDM uses\n\npostMessage to communicate.\n\nFigure 6.4\n\nYou can\
    \ use an external document to detect \n\nwhether the current browser has disabled\
    \ third-party cookies.\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 164
- img_proc: true
  md: "**141**\n\n***Setting third-party cookies***\n\n We’ll look at two workarounds\
    \ for setting cookies in situations where third-party\n\ncookies are disabled.\
    \ The first relies on setting cookies in new windows opened by\n\nyour third-party\
    \ application, whereupon those cookies are considered to be first-party.\n\nThe\
    \ second workaround is a special-case scenario that uses iframes and forms to\
    \ set\n\ncookies, but only works in Safari browsers (desktop and mobile). Afterward,\
    \ we’ll dis-\n\ncuss an alternative to cookies for Chrome and Firefox, because\
    \ those browsers don’t\n\ntransmit cookies even if they already exist.\n\n*6.2.1*\n\
    \n*Using dedicated windows*\n\nAs you may recall from earlier, a third-party cookie\
    \ is only considered such when it’s\n\nbeing set from or read from a domain that\
    \ differs from the document requested by\n\nthe user. If the browser user happens\
    \ to be visiting your domain directly (camera-\n\nstork.com), then you can set\
    \ cookies freely—you’re no longer a third party. So all you\n\nneed to do is get\
    \ the user to visit your page directly, and you’re home free.\n\nOPENING A NEW\
    \ WINDOW\n\nThe best way to do this is to serve your authentication/login page\
    \ (in our example,\n\ncamerastork.com/login) from a new window, opened by your\
    \ application using\n\nJavaScript. Because this is a new window, the browser will\
    \ consider this a first-party\n\nrequest, and you’re free to persist any cookies.\
    \ When the user is finished, you can\n\ncommunicate the user’s details from the\
    \ new window back to the application using a\n\nwindow messaging API (like postMessage,\
    \ or for wider compatibility, easyXDM).\n\n For this example code, let’s assume\
    \ that the majority of the Camera Stork widget is\n\nbeing rendered inside of\
    \ an iframe. Inside the iframe is a Login link that appears next\n\nto the other\
    \ widget content. You’ll assign a click event handler to the Login link, and\n\
    \nwhen it’s clicked, open a new window to your dedicated login page (listing 6.2).\
    \ Yes—\n\nyou can open a new window from inside an iframe, just as you would from\
    \ the parent\n\ndocument. You’re also not restricted as to the URL in which that\
    \ new window opens; it\n\ncan be a different origin than the iframe.\n\nvar popup;\n\
    \nfunction openLoginWindow(e) {\n\ne.preventDefault();\n\npopup = window.open('http://camerastork.com/widget/login.html',\n\
    \n'\\_blank', 'width=460,height=225');\n\n}\n\nvar login = document.getElementById('login');\n\
    \nif (login.addEventListener) {\n\nlogin.addEventListener('click', openLoginWindow,\
    \ false);\n\n} else if (login.attachEvent) {\n\nlogin.attachEvent('onclick', openLoginWindow);\n\
    \n}\n\nListing 6.2\n\nOpening a new window from code executing inside an iframe\n\
    \nwww.it-ebooks.info"
