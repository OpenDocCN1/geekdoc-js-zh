  md: "**169**\n\n***Publisher vulnerabilities***\n\nThis equipment company would\
    \ greatly desire to have better reviews for their prod-\n\nucts on your website,\
    \ but instead of doing it the old fashioned way—by making better\n\nproducts—they’ve\
    \ decided to cheat.\n\n To do this, CheapCo has loaded an invisible iframe on\
    \ their homepage whose con-\n\ntents are the Camera Stork website. When anyone\
    \ visits their homepage, they use\n\nJavaScript to position the iframe beneath\
    \ the visitor’s mouse cursor. When the user\n\nclicks what they believe to be\
    \ a regular UI element on CheapCo’s website, they’re actu-\n\nally clicking the\
    \ web page that is being hosted inside the iframe. It’s possible that\n\nCheapCo\
    \ can position the iframe such that the user will always click a particular UI\
    \ ele-\n\nment—like a button that submits a 5-star rating in favor of one of their\
    \ products. Ouch!\n\nX-FRAME\\-OPTIONS AND FRAMEKILLER SCRIPTS\n\nThe most straightforward\
    \ way to prevent clickjacking is to make it so that your web\n\npages can’t be\
    \ loaded via iframes. There are a few techniques to achieve this. The first\n\n\
    is to return a special HTTP header, X-Frame-Options, in responses for requests\
    \ to your\n\ncontent. X-Frame-Options can specify one of two values: sameorigin,\
    \ which only\n\nallows iframes from the same origin to display this content, and\
    \ deny, which prevents\n\n*any* iframe from doing so.\n\n Here’s an example of\
    \ an HTTP response which makes use of X-Frame-Options:\n\nHTTP/1.1 200 OK\n\n\
    Date: Wed, 28 Sep 2011 14:33:37 GMT\n\nContent-type: text/html\n\nX-Frame-Options:\
    \ sameorigin\n\nIf you’re wondering why X-Frame-Options is prefixed with an *X*,\
    \ it’s because the\n\nheader isn’t a part of the HTTP specification. It was introduced\
    \ by Microsoft for IE8 in\n\n2009 as a response to public disclosures of redress\
    \ attacks (see http://mng.bz/7Xl0),\n\nand has since been adopted by the other\
    \ major browser vendors. Because this HTTP\n\nheader has only recently been adopted,\
    \ a slew of older browsers don’t support it.\n\n Luckily, there’s another technique\
    \ for preventing a web page from being loaded\n\ninside an iframe: using what’s\
    \ referred to as a *framekiller* JavaScript snippet. These snip-\n\npets use JavaScript\
    \ to detect whether the current document is being displayed in a\n\nframe and,\
    \ if so, prevent the page from loading. This can be done by executing an\n\ninfinite\
    \ loop, hiding content, or redirecting the document to a blank page—anything\n\
    \nthat prevents the targeted page from rendering.\n\nFRAMEKILLER KILLERS\n\nNot\
    \ all framekiller scripts are made equal. Some are\n\nsusceptible to framekiller\
    \ killers: scripts loaded on the parent page that pre-\n\nvent the effectiveness\
    \ of framekillers (the example we provide happens to be\n\nunaffected). To find\
    \ out how framekiller killers work, we recommend reading\n\nWikipedia’s article\
    \ on the subject: http://en.wikipedia.org/wiki/Framekiller.\n\nHere’s an example\
    \ framekiller script that hides the document body if the window isn’t\n\nthe topmost\
    \ window:\n\nwww.it-ebooks.info"
