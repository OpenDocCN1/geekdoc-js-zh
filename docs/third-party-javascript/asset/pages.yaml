  md: "**43**\n\n***Passing script arguments***\n\nid = scripts\\[i\\].getAttribute('data-stork-product-id');\n\
    \nif (id) {\n\nreturn id;\n\n}\n\n}\n\nreturn null;\n\n}\n\nFairly straightforward,\
    \ right? One of the benefits of using data-\\* attributes like this is\n\nthat\
    \ they can also help your script identify the DOM location of the script include\
    \ snip-\n\npet on the publisher’s page. This is especially valuable if the script\
    \ include snippet’s\n\nlocation denotes where your third-party application ought\
    \ to render itself. We’ll\n\nexplore this in greater detail in the next chapter.\n\
    \nTHE DATA-\\* JAVASCRIPT API\n\nAs part of HTML5, the W3C has defined useful\n\
    \ninterfaces for accessing data-\\* attributes in JavaScript. For example, you\
    \ could\n\ninstead use the dataset DOM property to access the data-stork-product-id\n\
    \nattribute from listing 2.9:\n\nid = scripts\\[i\\].dataset.dataStorkProductId;\n\
    \nUnfortunately, browser support for the dataset property is still limited—no\n\
    \nversion of Internet Explorer currently supports it. In the meantime, we rec-\n\
    \nommend doing things the old-fashioned way, using the getAttribute DOM\n\nmethod.\
    \ \n\n*2.5.4*\n\n*Using global variables*\n\nIn the past few sections, we’ve explored\
    \ using the DOM as a means of passing parame-\n\nters to your third-party application.\
    \ An alternate approach is to avoid the DOM\n\nentirely, and instead use global\
    \ variables. Any variables declared in the browser’s top-\n\nmost variable scope\
    \ are attached to the window object, and are accessible by any script\n\nrunning\
    \ on the page.\n\n The next listing changes the script include snippet from section\
    \ 2.1 to declare a\n\nglobal variable whose purpose is to pass the product ID\
    \ to your third-party script.\n\n<script>\n\nvar product\\_id = 1234;\n\n(function()\
    \ {\n\nvar script = document.createElement('script');\n\nscript.async = true;\n\
    \nscript.src\n\n\\= 'http://camerastork.com/widget.js';\n\nvar entry = document.getElementsByTagName('script')\\\
    [0\\];\n\nentry.parentNode.insertBefore(script, entry);\n\n})();\n\n</script>\n\
    \nListing 2.10\n\nPassing script arguments using global variables\n\nwww.it-ebooks.info"
