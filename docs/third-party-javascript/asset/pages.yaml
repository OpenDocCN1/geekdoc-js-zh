  md: "**179**\n\n***Implementing a bare-bones SDK***\n\n Not to worry—this is quickly\
    \ solved by having publishers treat Stork\\_ready, not as\n\na single global function,\
    \ but as a global array of functions. To register a new callback,\n\nthey append\
    \ to this array, which can maintain callback order in case there are subse-\n\n\
    quent declarations:\n\nStork\\_ready = Stork\\_ready || \\[\\];\n\nStork\\_ready.push(function()\
    \ {\n\nStork.init(function() {\n\nStork.productWidget({\n\nid: '1337',\n\ndom:\
    \ 'stork-widget-location'\n\n});\n\n});\n\n});\n\nIs this code starting to look\
    \ familiar? It’s similar to some sample code we showed you\n\nat the end of chapter\
    \ 2, which involved passing publisher configuration arguments to\n\nyour third-party\
    \ script. If you think about it, the callback function could be considered\n\n\
    a configuration argument for your SDK. That being the case, any number of tech-\n\
    \nniques from that section could work here.\n\n For example, you could have publishers\
    \ pass the name of the callback function to\n\nyour SDK as part of the query string—similar\
    \ to a JSONP request. As long as publishers\n\ndeclare uniquely named callback\
    \ functions, they won’t conflict. This happens to be\n\nthe approach that Google’s\
    \ Maps JavaScript API uses:\n\nscript.src = \"http://maps.googleapis.com/maps/api/js?callback=my\\\
    _func\";\n\nAs with many solutions we’ve covered during the course of this book,\
    \ there’s no single\n\ncorrect choice for how publishers define an asynchronous\
    \ callback function. Choose\n\nthe method that appeals most to you. For now, we’ll\
    \ move on from loading and initial-\n\nization, and jump into the heart of this\
    \ chapter: implementing public functions on\n\nyour SDK. \n\n*8.1.3*\n\n*Exposing\
    \ public functions*\n\nWhen initialization is complete, the remaining public functions\
    \ of your SDK should\n\nbecome available to publishers. If you recall from Stork.init,\
    \ these functions are\n\nloaded via a separate file, sdk/lib.js. We’ve stubbed\
    \ out the contents of this file here:\n\n(function(window, undefined) {\n\nvar\
    \ Stork = window.Stork;\n\nStork.productWidget = function(options) {};\n\nStork.listen\n\
    \n\\= function (eventName, callback) {};\n\nStork.unlisten = function (eventName,\
    \ callback) {};\n\n})(this);\n\nThe first function, Stork.productWidget, is strictly\
    \ a public version of the widget\n\nloading and rendering code we covered in chapters\
    \ 2 and 3. But instead of deriving\n\nthe product ID and target DOM location from\
    \ the script include snippet, they’re\n\npassed explicitly as function arguments.\
    \ Here’s an example implementation:\n\nwww.it-ebooks.info"
