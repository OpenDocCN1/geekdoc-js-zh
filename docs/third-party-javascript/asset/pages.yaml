  md: "**151**\n\n***Summary***\n\nBefore that, Facebook only offered HTTPS as an\
    \ optional setting that users had to\n\nenable themselves.⁶ Not every company\
    \ is Facebook, but in developing a third-party\n\napplication, you might find\
    \ yourself dealing with considerable levels of scale, and mul-\n\ntilevel authentication\
    \ can help your web application stay afloat by sanely partitioning\n\nlow-risk\
    \ requests to use unencrypted HTTP.\n\n Session hijacking isn’t some made-up bogeyman\
    \ meant to scare you—it’s real, and\n\nit poses a greater threat to third-party\
    \ web applications. Ultimately, there’s no better\n\nprecaution than using HTTPS\
    \ everywhere you transmit session information. But if you\n\ncan’t do that, using\
    \ some level of HTTPS with multilevel authentication will signifi-\n\ncantly mitigate\
    \ the risk of session hijacking on your service without surrendering too\n\nmuch\
    \ performance. \n\n*6.4*\n\n*Summary*\n\nAuthenticating and persisting sessions\
    \ with third-party applications is tough to imple-\n\nment, but not impossible.\
    \ The difficulty is that each browser treats disabling third-\n\nparty cookies\
    \ differently, and you’ll need to supply different workaround solutions to\n\n\
    support them all. For IE, Opera, and Safari, which transmit cookies to third-party\n\
    \ndomains if they’re already set, you can always open a new window to a login\
    \ page on\n\nyour domain and set the cookie there. Safari can even use iframes,\
    \ provided the ses-\n\nsion cookie is set in the response to a standard form POST\
    \ HTTP request. Chrome and\n\nFirefox, the most restrictive browsers with respect\
    \ to third-party cookies, must make\n\ndo with sessions that only last the duration\
    \ of the user’s stay on the page.\n\n Of course, just setting and sending a session\
    \ cookie isn’t enough. You also need to\n\ntransmit that cookie in such a way\
    \ that it isn’t easily snoopable by malicious parties.\n\nThe solution is to use\
    \ HTTPS everywhere you send session information. But if that’s\n\nnot realistic\
    \ for your organization, you can use a mixed approach where high-touch\n\nactions\
    \ are served behind HTTPS, and actions performed from your third-party appli-\n\
    \ncation use unencrypted HTTP.\n\n Session hijacking is, unfortunately, one of\
    \ many possible security vulnerabilities\n\naffecting third-party JavaScript applications.\
    \ We’ve mentioned a handful of others\n\nover the course of this book. But in\
    \ the next chapter, we’ll take an in-depth look at the\n\nlargest security issues\
    \ facing your application and introduce practices for either elimi-\n\nnating\
    \ them or mitigating their impact. Shall we?\n\n6 http://it.slashdot.org/story/12/11/19/2359205/facebook-switching-to-https-by-default\n\
    \nwww.it-ebooks.info"
