  md: "**70**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\n4\n\n*3.4.2*\n\n*External\
    \ iframes*\n\nExternal iframes are the last line of defense in\n\nthe protection\
    \ of widget markup from the\n\npublisher. Unlike src-less iframes, external\n\n\
    iframes display content served from an exter-\n\nnal URL. This is the standard\
    \ use case for\n\niframes: embedding content from a remote\n\nURL (see figure\
    \ 3.5). But because the content\n\nis served from a different URL, the browser\n\
    \nprevents script access to the iframe from code\n\nhosted on the parent page.⁵\
    \ This means the\n\npublisher can’t modify the contents of the\n\niframe in any\
    \ way.\n\n To create an external iframe, you’ll follow\n\nthe same steps as before,\
    \ but this time set the\n\nsrc attribute of the iframe to the URL of a web\n\n\
    page hosted on your servers (say, on cameras-\n\ntork.com). Because the contents\
    \ of this page\n\ncan’t be accessed from your main application\n\ncode, you’ll\
    \ need to pass any necessary parame-\n\nters or application state as part of the\
    \ URL. This can be either as query string parame-\n\nters or using the document\
    \ fragment. For example, in the case of the Stork Widget,\n\nthis will be the\
    \ product ID. The external page will extract the product ID from the\n\nURL, fetch\
    \ the corresponding data, and render a full HTML page containing the final\n\n\
    contents of the widget.\n\n For example, the iframe’s src attribute could be set\
    \ to the following URL:\n\niframe.src = 'http://camerastork.com/product.html?id=1337';\n\
    \n4 See “In IE, iFrames on Pages in Quirks Mode Also in Quirks Mode,” CSS-TRICKS,\
    \ May 26, 2011: http://\n\ncss-tricks.com/ie-iframe-quirksmode/.\n\n5 The browser\
    \ phenomenon that prevents external iframe access via JavaScript is known as *the\
    \ same-origin policy*.\n\nWe’ll cover this in detail in the next chapter.\n\n\
    *(continued)*\n\ndevelopers have had luck using the HTML5 Shiv library, which\
    \ restores some sanity\n\nto IE9 when under the effects of quirks mode.⁴\n\nOur\
    \ advice: just be mindful of quirks mode, and its possible impact on your applica-\n\
    \ntion. The good news is that very few websites render in quirks mode, and they’re\
    \ prob-\n\nably already styled poorly to begin with!\n\ncamerastork.com/product.html\n\
    \npublisher.com\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_94_0.png)\n\nMikon\
    \ E90 Digital SLR\n\n$599.99 – Buy now\n\n4.3/5.0 • 176 reviews\n\nFigure 3.5\n\
    \nThe Camera Stork widget \n\npresented through an external iframe. The \n\nparent\
    \ page can’t access or impact the \n\ncontents of the frame (nor vice versa).\n\
    \nwww.it-ebooks.info"
