  md: "**232**\n\nCHAPTER 10\n\n***Debugging and testing***\n\nfrom models import\
    \ Switches\n\ndef loader(self, request):\n\nsw = Switches.objects.get(name='debug')\n\
    \nif request.user in sw.users:\n\nreturn js('camerastork.debug.js')\n\nelse:\n\
    \nreturn js('camerastork.js')\n\nThe actual implementation of database-backed\
    \ switches is out of the scope of this\n\nbook. But you should be able to find\
