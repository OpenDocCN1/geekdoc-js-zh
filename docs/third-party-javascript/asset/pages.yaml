  md: "**197**\n\n***Wrapping web service APIs***\n\nreferring domain isn’t found\
    \ in that list, the server returns an error response with a\n\n403 HTTP status\
    \ code (Forbidden). \n\nTUNNEL FILES AND THE REFERER HEADER\n\nNot so fast. The\
    \ solution demonstrated in listing 8.11 suffers from a *critical* flaw—\n\nthe\
    \ web service API wrapper you implemented is actually issuing XmlHttpRequest\n\
    \nfrom Camera Stork’s domain (camerastork.com), and not the publisher’s. That\n\
    \nmeans that the Referer header sent to the API server will actually be the URL\
    \ of your\n\ntunnel.html file. This is one caveat of using a tunnel file: all\
    \ the requests now origi-\n\nnate from your domain.\n\n Additionally, the Referer\
    \ header itself can’t always be counted on. There are a\n\nnumber of situations\
    \ in which the browser doesn’t send Referer headers. For starters,\n\nit’s possible\
    \ for the user to simply disable sending the Referer header—which is\n\nsometimes\
    \ done for privacy reasons. The browser also drops the Referer header if a\n\n\
    request is made from an HTTPS resource (such as *https*://publisher.com) to a\
    \ regular\n\nHTTP resource (*http*://camerastork.com/api).\n\nREFERER OR REFERRER?\n\
    \nYou’ve probably noticed that the Referer header\n\nonly has one *R*, when the\
    \ word *referrer* has two. The misspelled word was incor-\n\nporated into the\
    \ HTTP specification accidentally, and remains the same today:\n\nhttp://en.wikipedia.org/wiki/HTTP\\\
    _referrer#Origin\\_of\\_the\\_term\\_referer.\n\nGiven these issues, we’ll look\
    \ at an alternative solution that avoids the Referer header\n\nentirely. First,\
    \ you need to know the URL/domain of the document that loaded your\n\nSDK. You\
    \ could just write JavaScript code—executing in the parent context—to query\n\n\
    the current URL via window.location.href and pass that into the tunnel. But that’s\n\
    \nnot safe, because a malicious publisher could pass an arbitrary value into the\
    \ tunnel\n\nthemselves.\n\n There’s an alternative (and safe) way of getting the\
    \ parent document URL—using\n\nwindow.postMessage’s Origin parameter. If you recall,\
    \ every message sent via post-\n\nMessage contains an Origin parameter, which\
    \ is the protocol, domain, and port of the\n\nsender document (protocol://domain:port).\
    \ This Origin value is generated by the\n\nbrowser, and is present even in situations\
    \ where the Referer header isn’t (say, if the\n\nbrowser has Referer headers disabled).\n\
    \n You’ll extract this Origin value from inside your iframe and pass it to your\
    \ server\n\nwith every XmlHttpRequest. To keep this value separate from normal\
    \ API parameters\n\n(and for other reasons we’ll get to in a moment), you’ll pass\
    \ it as a *custom* HTTP\n\nheader. You’ll name this header CameraStork-Publisher-Origin.\
    \ The CameraStork\n\nprefix here is to avoid colliding with other, legitimate\
    \ HTTP headers.\n\nCUSTOM HTTP HEADERS AND THE X-\\* PREFIX\n\nFor years, application\
    \ developers\n\nused the X-\\* prefix in custom headers to avoid collisions with\
    \ standard\n\nheader names. As of June 2012, the IETF (Internet Engineering Task\
    \ Force)\n\nofficially recommends against the use of the X- prefix (http://tools.ietf.org/\n\
    \nhtml/rfc6648). We still think there’s value in “namespacing” HTTP headers,\n\
    \nwww.it-ebooks.info"
