  md: "**66**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\nOVERSPECIFYING CSS DOESN’T\
    \ MIX WITH CODE QUALITY TOOLS\n\nIf you take to\n\noverspecifying your CSS like\
    \ this, you might find an unlikely enemy: tools that\n\nevaluate the quality of\
    \ your CSS code, such as CSS Lint, Google Page Speed,\n\nand Yahoo’s YSlow. These\
    \ tools will indicate that you’re making redundant\n\nCSS selectors, and they’ll\
    \ advise you to remove such selectors to reduce file\n\nsize and improve browsers’\
    \ CSS performance. Unfortunately, these tools\n\naren’t programmed with third-party\
    \ scripts in mind, and don’t fairly evaluate\n\nthe usefulness of overspecifying\
    \ CSS. The benefits of overspecification (for\n\nthird-party applications) will\
    \ outweigh the extra file size and minuscule per-\n\nformance hit.\n\nABUSING\
    \ !IMPORTANT\n\nIf you feel that overspecifying your CSS with extra ID (or class)\
    \ selectors doesn’t go far\n\nenough, you can break out the nuclear option: the\
    \ !important keyword. As we covered\n\nearlier, properties within a CSS rule that\
    \ sport the !important keyword are prioritized\n\nhighest of all, even above inline\
    \ styles. This is because the !important keyword was\n\ndesigned to give browser\
    \ users a surefire way to override “author” (publisher) styles, in\n\nthe case\
    \ of browser plugins or site-specific styles. You can abuse !important by using\
    \ it\n\non all of your CSS properties, effectively prioritizing them over all\
    \ other rules.\n\n Here’s how you might use the !important keyword on a single\
    \ CSS rule:\n\n.stork-price {\n\nfont-size:\n\n11px\n\n!important;\n\ncolor:\n\
    \n#888\n\n!important;\n\ntext-decoration: none\n\n!important;\n\ndisplay:\n\n\
    block !important;\n\n}\n\nSince it’s per property, the !important keyword needs\
    \ to be repeated like this, which\n\ncan become a drag over a long and complex\
    \ stylesheet. But, in exchange, you get a\n\nrock-solid set of stylesheets that\
    \ are *very* unlikely to be reset by the publisher’s page.\n\n It’s still conceivable\
    \ that the publisher could in turn use !important to target your\n\nelements and\
    \ set their own styles, at which point they’re likely purposely targeting\n\n\
    your elements for customization. On one hand, that can be frustrating if you’re\
    \ trying\n\nto maintain a consistent look and feel. But, if you’ve decided to\
    \ allow publishers to\n\ncustomize your widget, this is probably desired behavior.\n\
    \n One thing should be clear: sharing the DOM with the publisher can make it partic-\n\
    \nularly difficult to render a consistently styled widget. Although you can take\
    \ steps to\n\noverspecify your CSS rules to reduce the likelihood of conflicts,\
    \ it’s always possible for\n\nthe publisher to target your elements with their\
    \ rules, either accidentally or purposely.\n\nBut if sharing the DOM with the\
    \ publisher is what’s causing so much grief, is it possible\n\nto render your\
    \ widget *off* of the DOM? Why, yes—yes you can. \n\n*3.4*\n\n*Embedding content\
    \ in iframes*\n\nThere’s one way to render your widget such that it can’t be impacted\
    \ by the pub-\n\nlisher’s style rules, and that’s by rendering all of your HTML\
    \ and CSS inside an iframe.\n\nwww.it-ebooks.info"
