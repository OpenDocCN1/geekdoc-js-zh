  md: "**173**\n\nwidget. You’ve also developed the Camera Stork Web Service API,\
    \ a set of HTTP end-\n\npoints that provides programmatic access to the Camera\
    \ Stork’s product and reviews\n\ndatabase. Developers have been using this API\
    \ to build revenue-generating applica-\n\ntions that help refer you sales.\n\n\
    \ Publishers have become so enamored with the Camera Stork suite of publisher\n\
    \ntools that they’re looking for deeper integration with your platform. Some publishers\n\
    \nwant more control over how and when they load your various widgets. Others want\
    \ to\n\nknow when events are occurring within your software, like when a referral\
    \ link is\n\nclicked, so that they can collect their own statistics about how\
    \ their visitors are using\n\nyour widgets. And some publishers want a simple\
    \ set of client-side JavaScript functions\n\nfor accessing your valuable web service\
    \ API. And they don’t want a set of single-\n\npurpose, automatically executing\
    \ scripts to provide these features; they want a single,\n\npowerful JavaScript\
    \ library that does it all.\n\n The solution is a third-party JavaScript *SDK**\
    \ (software development kit)*. This is a\n\nJavaScript library that bundles an\
    \ entire suite of JavaScript functionalities and exposes\n\nthem via documented\
    \ public functions. So, rather than have single-purpose scripts\n\nthat fulfill\
    \ small pieces of functionality (like individual widgets), you have publishers\n\
    \nload a single JavaScript file that provides access to all of your tools: widgets,\
    \ internal\n\nevent bindings, your web service API, and more (see figure 8.1).\n\
    \n To give you an idea, let’s look at a public function that could be provided\
    \ through\n\nan SDK. Suppose that the Camera Stork JavaScript SDK already exists\
    \ and provides a\n\nfunction named Stork.productWidget, which renders a product\
    \ widget instance on\n\nthe publisher’s page. This function accepts two arguments:\
    \ the ID of the product to be\n\nrendered, and the ID of a DOM element on the\
    \ publisher’s page into which the widget\n\nwill be inserted. A publisher might\
    \ use the following code to invoke the function:\n\nStork.productWidget({ id:\
    \ '1337', dom: 'widget-location-id' });\n\nwidget.js\n\nwidget.js\n\nwidget.js\n\
    \nevents.js\n\nPublisher\n\nweb page\n\nsdk.js\n\nPublisher\n\nweb page\n\napi.js\n\
    \nFigure 8.1\n\nOne script to rule them all: a JavaScript SDK can combine the\
    \ functionality \n\nof several different script files, making integration easier\
    \ for publishers.\n\nwww.it-ebooks.info"
