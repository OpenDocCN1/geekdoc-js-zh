  md: "**85**\n\n***JSON with padding (JSONP)***\n\n<?php\n\nheader(\"Content-type:\
    \ application/javascript\");\n\n$callback = $\\_GET\\['callback'\\];\n\n$book\
    \ = json\\_encode(array(\n\n'title' => 'Third-party JavaScript',\n\n'authors'\
    \ => array('Anton', 'Ben'),\n\n'publisher' => 'Manning'\n\n), JSON\\_PRETTY\\\
    _PRINT);\n\necho \"$callback($book);\";\n\n?>\n\nIf you’re still unclear about\
    \ how JSONP works, look at figure 4.3, which takes you\n\nthrough the steps involved\
    \ in a typical JSONP request, from generating a callback and\n\nsending a request\
    \ to executing that callback and parsing the resulting response.\n\nListing 4.2\n\
    \nGenerating a JSONP response on the server\n\n**Get callback **\n\n**name from\
    \ **\n\n**query string**\n\n**Encode output **\n\n**array as JSON**\n\n**Output\
    \ **\n\n**JavaScript **\n\n**response**\n\nResponse: jsonHandler({...})\n\nWeb\
    \ browser\n\nGenerate the callback\n\nParse the JSON response\n\nExecute the callback\n\
    \nRequest\n\nSend the request\n\nhttp://example.com \n\nGenerate a \n\nJSON-encoded\n\
    \nstructure\n\nWrap the\n\nstructure with \n\na special padding\n\nWeb server\n\
    \nFigure 4.3\n\nTypical JSONP \n\nrequest-response exchange\n\nwww.it-ebooks.info"
