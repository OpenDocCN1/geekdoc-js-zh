  md: "**109**\n\n***HTML5 window.postMessage API***\n\nThe window.postMessage function\
    \ is simple to use, and this small section covers most\n\nof it. But recognize\
    \ that it only covers one half of the messaging problem: sending\n\nmessages.\
    \ Let’s now look at how a window *receives* messages. \n\n*5.1.2*\n\n*Receiving\
    \ messages sent to a window*\n\nAs you might’ve noticed, when the postMessage\
    \ function sends a message, it doesn’t\n\nrequest any confirmation from the recipient\
    \ window. It publishes the message to the\n\nwindow, and the code inside the window\
    \ must subscribe to a special event if it’s inter-\n\nested in the incoming correspondence.\n\
    \n Subscribing to new messages is straightforward: you attach a listener function\
    \ to\n\nthe window’s message event. Your listener will be called every time a\
    \ new message is\n\nposted to the window from anywhere using the postMessage function.\
    \ Because this is\n\nan ordinary browser event (like a mouse click event), your\
    \ listener function will have\n\naccess to an Event instance object. That object\
    \ exposes three properties:\n\n\n\ndata—The actual message (string or a JavaScript\
    \ object)\n\n\n\norigin—The host from which the message was sent\n\n\n\nsource—A\
    \ reference to a Window object from which the message was sent\n\nHere’s an example\
    \ of registering such a listener function, which we’ve named\n\nreceiver.\n\n\
    function receiver(ev) {\n\nconsole.log(\"We've got a message!\");\n\nconsole.log(\"\
    \\* Message:\", ev.data);\n\nconsole.log(\"\\* Origin:\", ev.origin);\n\nconsole.log(\"\
    \\* Source:\", ev.source);\n\n}\n\nif (window.addEventListener) {\n\nwindow.addEventListener(\"\
    message\", receiver, false);\n\n} else {\n\nwindow.attachEvent(\"onmessage\",\
    \ receiver);\n\n}\n\nIf you’re familiar with JavaScript events—and we hope you\
    \ are—this snippet should\n\nbe trivial. Note that the listener function will\
    \ receive *every* message that’s sent to the\n\nhost window; any JavaScript code\
    \ that can target this window can send it a message,\n\nincluding untrusted parties.\
    \ The browser doesn’t verify the source of the message, so\n\nit’s up to you to\
    \ check the origin property and decide whether the message is legiti-\n\nmate\
    \ or not. As a rule of thumb, you should always check the origin property by com-\n\
    \nparing it to a list of your trusted hosts to make sure that you trust the message’s\
    \ sender.\n\n It’s also a good idea to check the message itself, just to be certain\
    \ that it doesn’t\n\ncontain any values you don’t expect. If for some strange\
    \ reason you’re thinking about\n\nblindly evaluating the message using the eval\
    \ function, ask your neighbor to punch\n\nyou and think again. Blindly evaluating\
    \ the message using eval is like giving any script\n\nListing 5.1\n\nJavaScript\
    \ code listening to the **message** window event\n\nwww.it-ebooks.info"
