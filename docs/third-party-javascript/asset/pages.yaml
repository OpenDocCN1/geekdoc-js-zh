    \ Your first instinct\n\nmight be to access the script’s URL using window.location.href,\
    \ but you’ll be unsuc-\n\ncessful. This is because window.location.href is the\
    \ URL of the page that’s including\n\nthe JavaScript file, not the URL of the\
    \ JavaScript file itself.\n\n There’s a clever technique for obtaining the script\
    \ URL. It relies on the fact that\n\nthe script DOM element that loads your third-party\
    \ script can be queried on the DOM\n\nlike any regular HTML element. You can use\
    \ document.getElementsByTagName to\n\nreturn a list of all script elements on\
    \ the page, and iterate through them until you find\n\nthe script element whose\
    \ URL points to your script file. The following listing presents\n\na function\
    \ that does exactly that.\n\nfunction getScriptUrl() {\n\nvar scripts = document.getElementsByTagName('script');\n\
    \nvar element;\n\nvar src;\n\nfor (var i = 0; i < scripts.length; i++) {\n\nelement\
    \ = scripts\\[i\\];\n\n \n\nsrc = element.src;\n\n \n\nif (src && /camerastork\\\
    \\.com\\\\/widget\\\\.js/.test(src)) {\n\nreturn src;\n\n \n\n}\n\n}\n\nreturn\
    \ null;\n\n}\n\nNow that you have the full URL, it’s just a matter of pulling\
    \ out the query parameters.\n\nThe function in this next listing takes the query\
    \ string component of a URL and con-\n\nverts it to a hash of key/value pairs.\n\
    \nfunction getQueryParameters(query) {\n\nvar args\n\n\\= query.split('&');\n\n\
    var params = {};\n\nvar pair;\n\nvar key;\n\nvar value;\n\nfunction decode(string)\
    \ {\n\nreturn decodeURIComponent(string || \"\")\n\n.replace('+', ' ');\n\n}\n\
    \nfor (var i = 0; i < args.length; i++) {\n\npair = args\\[i\\].split('=');\n\n\
    \ \n\nkey = decode(pair\\[0\\]);\n\n \n\nvalue = decode(pair\\[1\\]);\n\nListing\
    \ 2.6\n\nGetting the script URL\n\nListing 2.7\n\nExtracting query parameters\n\
    \n**Query DOM for all **\n\n**script elements on **\n\n**publisher’s page**\n\n\
    **Iterate through**\n\n**script elements**\n\n**until**\n\n**encountering an**\n\
    \n**src attribute that**\n\n**points to your**\n\n**script file**\n\n**When found,\
    \ return matching**\n\n**script element’s full src attribute,**\n\n**including\
    \ query string component**\n\n**Split query string **\n\n**into key/value pairs**\n\
    \n**Helper function for **\n\n**decoding URI-encoded **\n\n**query string values**\n\
    \n**Convert key/value **\n\n**pairs into a JavaScript **\n\n**object (hash)**\n\
