  md: "**195**\n\n***Wrapping web service APIs***\n\n} else {\n\nresponse.data = JSON.parse(xhr.responseText);\n\
    \n}\n\ncallback(response);\n\n};\n\njQuery.ajax(options);\n\n}\n\nvar rpc = new\
    \ easyXDM.Rpc({}, {\n\nlocal: {\n\napiTunnel: apiTunnel\n\n}\n\n});\n\n</script>\n\
    \n</html>\n\nThe tunnel file loads a few dependencies—easyXDM, of course, and\
    \ jQuery, for its\n\nAJAX utility function—and implements the apiTunnel RPC function.\
    \ This function\n\ntakes a few parameters: an API endpoint string, a hash of API\
    \ parameters, and a call-\n\nback function that’s invoked when the AJAX call completes.\
    \ The function assembles\n\nthese values into a hash of options, which is passed\
    \ to jQuery’s ajax function. The\n\ncomplete function handles the server’s HTTP\
    \ response: it converts the result from\n\nJSON to a JavaScript object, and then\
    \ invokes the publisher’s callback function. Note\n\nthat the callback function\
    \ isn’t actually executed in this scope—it’s actually an RPC\n\nfunction generated\
    \ by easyXDM that triggers the callback back on the publisher’s page.\n\n Remember:\
    \ this code is being executed inside an iframe, so it’s safe if easyXDM and\n\n\
    jQuery exist as global variables. Also, it’s not critical to use jQuery here—you\
    \ can feel\n\nfree to substitute jQuery for any AJAX helper library.\n\n There’s\
    \ a reason why Stork.api is implemented inside the tunnel file, and not in\n\n\
    sdk.js: it’s safer. A poor approach would be to export jQuery’s ajax helper function\
    \ as\n\nan RPC object, and call that instead from your SDK. But remember: just\
    \ as you’ve\n\naccessed this iframe via easyXDM, so can anyone else. A malicious\
    \ publisher could\n\nwrap your ajax RPC method, and then have the power to issue\
    \ XmlHttpRequests that\n\nappear to originate from camerastork.com. That’s fine\
    \ if they’re accessing your API,\n\nbut bad news if they decide to request arbitrary\
    \ pages from camerastork.com, pages\n\nwhich might have side effects. It’s better\
    \ to be safe than sorry, and implement your API\n\naccessor inside the tunnel\
    \ file.\n\n At this point, you’ve implemented the core components of a web service\
    \ API wrap-\n\nper. Your publishers can now communicate with the Camera Stork\
    \ API with impunity,\n\nwhich is the topic of our next section: now that requests\
    \ to your API are coming\n\ndirectly from visitors’ browsers (instead of publisher\
    \ web servers), how do you identify\n\nthe originating application?\n\n*8.3.3*\n\
