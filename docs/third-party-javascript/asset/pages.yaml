  md: "**17**\n\n***Challenges of third-party development***\n\nprovided as part of\
    \ the iframe’s style attribute. Iframe elements don’t expand to fit\n\ntheir contents,\
    \ and need to be given explicit dimensions.\n\n Using an iframe like this should\
    \ produce the same output as the JavaScript exam-\n\nple. So why use JavaScript\
    \ over iframes, even for a simple example like this? There are\n\nmany reasons,\
    \ most of which revolve around a particular attribute of iframes: that\n\nexternal\
    \ content loaded inside an iframe *can’t be accessed* by the parent page (the\
    \ pub-\n\nlisher’s page), and vice versa.\n\n*Flexibility*—If you ever want to\
    \ change the dimensions of the widget, you’ll be\n\nout of luck. Since the iframe\
    \ dimensions are fixed on the iframe element on the\n\nparent page, and those\
    \ attributes can’t be modified from content loaded inside\n\nthe iframe, there’s\
    \ no way to dynamically resize the widget.\n\n*Aesthetics*—The look and feel\
    \ of the widget will need to be completely indepen-\n\ndent of the parent page’s\
    \ styles. The widget won’t be able to inherit basic styles,\n\nlike font family,\
    \ size, or color.\n\n*Interaction*—Will the widget need to read or modify the\
    \ publisher’s DOM? What\n\nif the publisher needs to interact with the contents\
    \ of the widget? Could multi-\n\nple instances of the widget communicate with\
    \ each other? None of these are\n\npossible with static iframes.\n\n*Reporting*—Did\
    \ the browser user actually view the widget? How much time did\n\nthey spend on\
    \ the page before viewing it? Retrieving this and other valuable sta-\n\ntistics\
    \ requires JavaScript running on the publisher’s page.\n\nThese are just a few\
    \ examples, but you’re probably beginning to see a trend. Iframes\n\nmay be the\
    \ simplest mechanism for distributing the weather widget example, but in\n\ndoing\
    \ so you’ll lose many compelling abilities offered by third-party JavaScript.\
    \ But\n\ndon’t let this sour your opinion of iframes. They’re an *invaluable*\
    \ asset in the third-\n\nparty JavaScript developer’s toolset, and we’ll use them\
    \ frequently for a number of dif-\n\nferent tasks over the course of this book.\
    \ \n\n*1.4*\n\n*Challenges of third-party development*\n\nYou’ve learned how third-party\
    \ JavaScript is a powerful way to write highly distribut-\n\nable applications.\
    \ But writing scripts that run on other people’s websites carries a\n\nunique\
    \ set of challenges distinct from regular JavaScript programming. Specifically,\n\
    \nyour code is being executed in a DOM environment that you don’t control, on\
    \ a differ-\n\nent domain. This means you have to contend with a number of unexpected\
    \ complexi-\n\nties, like an unknown web page context, a JavaScript environment\
    \ shared with other\n\nfirst- and third-party scripts, and even restrictions put\
    \ in place by the browser. We’ll\n\ntake a quick look at what each of these entails.\n\
    \n*1.4.1*\n\n*Unknown context*\n\nWhen a publisher includes your third-party script\
    \ on their web page, often you know\n\nlittle about the context in which it’s\
    \ being placed. Your script might get included on\n\nwww.it-ebooks.info"
