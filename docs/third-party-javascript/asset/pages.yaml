  md: "**184**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\n Let’s\
    \ see how this scenario is currently handled in the SDK. If you recall the SDK\n\
    \narchitecture from earlier, the top of sdk.js contained the following code:\n\
    \n(function(window, undefined) {\n\nvar Stork = {};\n\nif (window.Stork) {\n\n\
    return;\n\n}\n\n...\n\n})(this);\n\nYou’ll notice that if the Stork object is\
    \ already defined, the script exits early. This\n\nmeans that any subsequent declaration\
    \ of sdk.js won’t actually do anything. This\n\nwasn’t an issue when there was\
    \ only one version of the application, because the code\n\nwould only be replacing\
    \ itself with an identical version. But with multiple versions, this\n\ncode prevents\
    \ anyone from loading two distinct versions on the same page.\n\nVERSIONS DON’T\
    \ HAVE TO BE NUMERIC\n\nAs with all software, you have other\n\noptions for version\
    \ strings besides numbers. You can use symbolic names like\n\nlatest to always\
    \ serve the latest version of your SDK, or dev to serve the latest\n\nbleeding-edge\
    \ development version.\n\nHere’s an example depicting this scenario, where the\
    \ Camera Stork SDK is loaded\n\ntwice, each pointing to a different file/version:\n\
    \n<script src=\"http://camerastork.com/sdk\\_1.0.js\"></script>\n\n<script>\n\n\
    /\\* Version 1.0 loaded \\*/\n\n</script>\n\n<script src=\"http://camerastork.com/sdk\\\
    _1.1.js\"></script>\n\n<script>\n\n/\\* Version 1.0 is still loaded \\*/\n\n</script>\n\
    \nTo solve this, your first instinct might be to modify sdk.js such that any subsequent\n\
    \nloads of the SDK replace the earlier version (if it exists). But then you’ll\
    \ have the\n\n*opposite* problem: any long-running code on this page that expects\
    \ version 1.0 of the\n\nSDK will now be incompatible with the newly loaded version\
    \ (1.1).\n\nIMPLEMENTING NOCONFLICT\n\nLuckily, this situation is resolvable.\
    \ If you remember, all the way back in chapter 2 we\n\nshowed you how to load\
    \ the jQuery JavaScript library in a context where it might’ve\n\nalready been\
    \ loaded by the publisher. In order to avoid conflicting with the parent\n\npage,\
    \ you called jQuery’s $.noConflict function. This function assigns the last-loaded\n\
    \nglobal jQuery to a local variable, ensuring that you only use the version you\
    \ want:\n\nStork.jQuery = jQuery.noConflict(true);\n\nwww.it-ebooks.info"
