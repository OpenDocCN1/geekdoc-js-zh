    \nshort period, and then a 1-second pause occurs, the wrapped function will only\
    \ fire\n\nonce—after the pause.\n\nListing 9.5\n\nImplementation of function throttling\n\
    \n**Save last time the **\n\n**wrapper was called**\n\n**If sufficient (as specified\
    \ by **\n\n**delay) time has passed since **\n\n**the last call, execute handler**\n\
    \n**Attach wrapper to event**\n\n250 ms\n\nWrapper function\n\nOriginal function\n\
    \n250 ms\n\n...\n\nFigure 9.2\n\nThrottling a function at 250 \n\nmilliseconds.\
    \ Regardless of how often the outer \n\nfunction is called, it only executes the\
    \ original \n\n(wrapped) function every 250 milliseconds.\n\nwww.it-ebooks.info"
