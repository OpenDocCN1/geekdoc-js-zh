  md: "**177**\n\n***Implementing a bare-bones SDK***\n\nwas ready. To solve this,\
    \ you’ll need to give the publisher a code snippet that both\n\nloads the SDK\
    \ library (sdk.js) asynchronously, and provides a means for the publisher\n\n\
    to execute code when the file is ready.\n\n Let’s first look at a simple—but naive—approach.\
    \ You begin by providing publish-\n\ners with an asynchronous script include snippet\
    \ that loads sdk.js by creating a\n\n<script> DOM element and appending it to\
    \ the publisher’s page. This snippet also\n\nbinds an event handler to the <script>\
    \ element’s load and readystatechange\n\nevents; the handler fires when the script\
    \ becomes loaded. In your documentation (or\n\nthe snippet’s source code), you\
    \ instruct publishers to input their code inside this\n\nevent handler. When the\
    \ handler fires, it means sdk.js has been loaded, and the pub-\n\nlisher can safely\
    \ call Stork.init.\n\n<script>\n\n(function() {\n\nvar script = document.createElement('script');\n\
    \nscript.async = true;\n\nscript.src = 'http://camerastork.com/sdk.js';\n\nscript.load\
    \ = script.onreadystatechange = function() {\n\nvar rdyState = script.readyState;\n\
    \nif (!rdyState || /loaded|complete/.test(rdyState)) {\n\nStork.init(function()\
    \ {\n\nStork.productWidget({\n\nid: '1337',\n\ndom: 'stork-widget-location'\n\n\
    });\n\n});\n\nscript.onload = null;\n\nscript.onreadystatechange = null;\n\n}\n\
    \n};\n\nvar entry = document.getElementsByTagName('script')\\[0\\];\n\nentry.parentNode.insertBefore(script,\
    \ entry);\n\n})();\n\n</script>\n\nPerhaps now you see why a junior programmer\
    \ might stick to blocking script includes;\n\nthis example is significantly more\
    \ code than the blocking example from section 8.1.2.\n\nAnd although the publisher\
    \ would ideally copy and paste most of this snippet from\n\nyour SDK’s documentation\
    \ into their source code, they still have to insert their own\n\ncode in the middle\
    \ of it, which could result in them accidentally modifying the wrong\n\ncode.\
    \ Minimizing the possibility of errors is a big deal; having to debug code for\
    \ pub-\n\nlishers is a huge time sink, and should be avoided. For these reasons,\
    \ we don’t recom-\n\nmend using this solution.\n\nListing 8.2\n\nPublisher code\
    \ for asynchronous loading is complex and error-prone.\n\n**Bind event **\n\n\
    **handlers**\n\n**Publisher code **\n\n**starts here**\n\n**Detach event **\n\n\
    **handlers **\n\n**when done**\n\nwww.it-ebooks.info"
