  md: "**121**\n\n***Simple cross-domain messaging with easyXDM***\n\nthe most suitable\
    \ for the current browser. For modern browsers, easyXDM uses\n\nwindow.postMessage\
    \ and for IE6 and 7 it uses FlashTransport. In case it can’t reli-\n\nably detect\
    \ which transport to use, the library simply falls back to the HashTransport.\n\
    \n Another great thing about easyXDM is that—in addition to simple message pass-\n\
    \ning—it allows you to define special interfaces that can be used to call remote\
    \ methods\n\nin the iframe. We’ll show you how to do that later in this chapter,\
    \ but for now let’s see\n\nhow to send and receive simple string messages using\
    \ easyXDM.Socket. Throughout\n\nthis section, we’ll use the Camera Stork product\
    \ widget as an example.\n\n Please note that in this section we’ll use easyXDM’s\
    \ terms when describing the com-\n\nmunicating parties. The library describes\
    \ two parties: a consumer—the document that\n\nloads an iframe—and a provider—the\
    \ document inside that iframe. To communicate\n\nbetween the consumer and the\
    \ provider, easyXDM uses a stack of transports. All trans-\n\nports supported\
    \ by the library are shown in table 5.2.\n\n These transports should seem familiar:\
    \ they’re the window-messaging fallback\n\ntechniques we’ve covered so far in\
    \ this chapter, with a few additions we didn’t cover.\n\nGetting familiar with\
    \ these transports will help you in reading easyXDM’s documenta-\n\ntion in the\
    \ future.\n\n*5.3.1*\n\n*Loading and initializing easyXDM*\n\nIn chapter 2, you\
    \ learned how to ship external JavaScript libraries with your third-\n\nparty\
    \ application by placing them on your global namespace object, and easyXDM is\n\
    \nno different. Like jQuery, easyXDM provides a *no-conflict mode* through a special\n\
    \nmethod named noConflict. The following code snippet demonstrates using this\n\
    \nmethod to place a copy of the easyXDM library in the Stork namespace:\n\nStork.easyXDM\
    \ = easyXDM.noConflict('Stork');\n\nYou’ll notice that this method takes a single\
    \ formal parameter—a string representing\n\nthe name of your namespace object\
    \ on the global window object. This is so that\n\neasyXDM can locate itself via\
    \ the global window object when using the same-origin\n\nTable 5.2\n\nTransports\
    \ supported by easyXDM\n\nTransport\n\nHow it’s supported\n\nPostMessageTransport\n\
    \nUsing window.postMessage API\n\nSameOriginTransport\n\nUsing window.parent when\
    \ both parties are on the \n\nsame domain\n\nHashTransport\n\nUsing window.location.hash\n\
    \nNameTransport\n\nUsing window.name property (requires additional setup)\n\n\
    FlashTransport\n\nUsing Adobe Flash object (requires additional setup)\n\nFrameElementTransport\n\
    \nUsing window.frameElement property (only for older \n\nversions of Firefox)\n\
    \nwww.it-ebooks.info"
