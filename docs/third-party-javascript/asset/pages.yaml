  md: "**239**\n\n***Testing***\n\nINTEGRATION TESTS\n\nUnit tests are written from\
    \ a programmer’s perspective: that individual functions and\n\nobjects behave\
    \ correctly in isolation. But this is just one side of the picture. On the\n\n\
    other side, there are *integration tests*. These tests make sure that your program\
    \ works as\n\nexpected from the user’s perspective. For example, for the Camera\
    \ Stork application,\n\nthis would mean testing that users can sign in, log out,\
    \ submit reviews, and so on. In\n\nthis section, we’ll write a simple integration\
    \ test that tests the product review submis-\n\nsion process. In this test, we’ll\
    \ make sure that the program correctly retrieves input\n\nvalues from the widget’s\
    \ form elements and then sends those values through a cross-\n\ndomain channel\
    \ to the server.\n\n Because integration tests cover more territory than unit\
    \ tests, they can often be very\n\nslow. This is especially true when they require\
    \ a running server application that\n\nresponds to API requests and/or form submissions.\
    \ Unless you’re a patient person, you\n\ndon’t want to spend minutes of your time\
    \ running the test before finding out that\n\nyou’ve made a minor mistake in your\
    \ JavaScript code. To counter this, developers\n\noften replace slow components\
    \ of their application with empty *stub* functions and then\n\nvalidate that those\
    \ functions were called. Listing 10.1 demonstrates an integration test\n\nthat\
    \ ensures that Stork.submitReview correctly gets its data from the form text area,\n\
    \nand then sends that data to the server through Stork.getChannel().submit. This\n\
    \nintegration test stubs the getChannel function to return an object that updates\
    \ a spe-\n\ncial flag to indicate that the function was called:\n\nfunction testSubmitReview()\
    \ {\n\nStork.jQuery('textarea#stork-review').\n\nval(\"Love it. 5 stars!\");\n\
    \nvar submitCalled = false;\n\nStork.getChannel = function () {\n\nreturn {\n\n\
    submit: function (data) {\n\nsubmitCalled = true;\n\nvar msg = JSON.parse(data).message;\n\
    \nif (msg !== \"Love it. 5 stars!\") {\n\nthrow new Error(\"Message is incorrect.\"\
    );\n\n}\n\n}\n\n};\n\n};\n\nStork.submitReview();\n\nif (!submitCalled) {\n\n\
    throw new Error(\"Channel.submit was\\\\\n\nnever called\");\n\n}\n\n}\n\nListing\
    \ 10.1\n\nAn integration test that stubs out a server request\n\n**Place review\
    \ text in textarea where **\n\n**it’ll be taken by submitReview**\n\n**Create\
    \ flag to check if **\n\n**submitReview actually **\n\n**called Channel.submit**\n\
    \n**Replace**\n\n**getChannel**\n\n**function**\n\n**with**\n\n**function**\n\n\
    **that**\n\n**returns**\n\n**stub object**\n\n**Stub object defines function **\n\
    \n**submit, checks that it’s **\n\n**being called with correct **\n\n**parameters,\
    \ and toggles **\n\n**flag created earlier**\n\n**Call Stork.submitReview **\n\
    \n**as usual—without any **\n\n**additional modifications**\n\n**Check that submitCalled\
    \ was **\n\n**set to true by stub object**\n\nwww.it-ebooks.info"
