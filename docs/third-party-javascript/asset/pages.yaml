  md: "**120**\n\nCHAPTER 5\n\n***Cross-domain iframe messaging***\n\nexisting open\
    \ source implementation that was written and tested by somebody else. If\n\nyou’re\
    \ interested in the specifics of the ActionScript implementation, we encourage\n\
    \nyou to check out the source code of easyXDM. It’s available on GitHub: https://\n\
    \ngithub.com/oyvindkinsey/easyXDM/. But before we dive into easyXDM, let’s talk\n\
    \nabout a couple of gotchas that often bite developers who decide to rely on Flash\
    \ for\n\ntheir cross-domain communication needs.\n\nISSUES WITH HIDDEN FLASH OBJECTS\n\
    \nOften, the target iframe you’re communicating with is hidden from the page.\
    \ Typi-\n\ncally this is done by setting the element’s display CSS property to\
    \ none or by changing\n\nits visibility property to hidden. As it turns out, loading\
    \ a Flash object inside a hid-\n\nden iframe causes a handful of known issues.\n\
    \n One such issue affects only Internet Explorer 7. This browser doesn’t initialize\
    \ any\n\nFlash objects that are loaded inside a hidden iframe. That means that\
    \ the browser will\n\nrequest the Flash object and load it from the server, but\
    \ afterward nothing will hap-\n\npen. To solve this problem, you need to hide\
    \ your iframe in a different way, by setting\n\nits position property to absolute\
    \ and its top property to a value that places the\n\niframe well outside the viewport\
    \ (say, -10000px). That will trick Internet Explorer into\n\nthinking that your\
    \ iframe is still visible (despite being outside the viewport), and the\n\nbrowser\
    \ will initialize the contained Flash object as expected.\n\n Another problem\
    \ occurs with newer versions of Flash that throttle access to hidden\n\nFlash\
    \ objects. This can limit the rate at which you can send messages between iframes.\n\
    \nThe good news is that this is only likely to affect a small number of applications\
    \ that\n\nare sending a lot of messages. The bad news is that we don’t know any\
    \ good work-\n\narounds other than to not hide the container iframe. Usually,\
    \ giving the iframe a min-\n\nimally recognized width and height (20px has been\
    \ reported to be effective) will\n\ncause Flash to treat it normally.\n\n All\
    \ things considered, Flash is an excellent fallback technique when postMessage\n\
    \nisn’t available. Yes, it has issues with hidden iframe containers, requires\
    \ browser users\n\nto have Flash installed, and requires users to make a network\
    \ request to load the inter-\n\nmediate Flash object. But what makes Flash valuable\
    \ is that it doesn’t require publish-\n\ners to host any intermediate files on\
    \ their servers. For this reason, many third-party\n\nservices use Flash before\
    \ falling back to window.name or window.hash. \n\n*5.3*\n\n*Simple cross-domain\
    \ messaging with easyXDM*\n\nNow that you’ve read a lot about cross-domain communication\
    \ and learned all these\n\ntechniques, you might want to know that there’s a well-tested\
    \ JavaScript library that\n\ntakes care of all the pain points and provides a\
    \ relatively simple API to send messages\n\nback and forth between frames hosted\
    \ on different domains. This library was written\n\nby Øyvind Sean Kinsey and\
    \ is called *easy**XDM* (easy cross-domain messaging). At its\n\ncore, easyXDM\
    \ provides a transport stack capable of passing string messages between\n\nthe\
    \ main document and an iframe inside that document. The library implements the\n\
    \ndifferent cross-domain messaging techniques we discussed in this chapter and\
    \ picks\n\nwww.it-ebooks.info"
