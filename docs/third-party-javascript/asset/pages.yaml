  md: "**144**\n\nCHAPTER 6\n\n***Authentication and sessions***\n\nfunction onMessageReceived(e)\
    \ {\n\nvar response = JSON.parse(e.data);\n\nif (response.success && popup) {\n\
    \npopup.close();\n\nrenderUserName(response.name);\n\n}\n\n}\n\nif (window.addEventListener)\
    \ {\n\nwindow.addEventListener('message', onMessageReceived, false);\n\n} else\
    \ if (window.attachEvent) {\n\nwindow.attachEvent('onmessage', onMessageReceived);\n\
    \n}\n\nThat’s it—you’re done. You’ve successfully managed to set a cookie on the\
    \ camera-\n\nstork.com domain even with third-party cookies disabled. Please note\
    \ that, although\n\nthis example assumed your application code was running inside\
    \ an iframe hosted on\n\nyour domain, the same general solution will work for\
    \ code that’s executing on the\n\npublisher’s website. The only difference is\
    \ that the origin parameter to postMessage\n\nwill need to be the publisher’s\
    \ domain (or '\\*') instead of camerastork.com.\n\n It’s worth noting that setting\
    \ cookies in a new window like this will work in every\n\nbrowser. It’s just of\
    \ limited value for Firefox and Chrome because, even though the\n\ncookies are\
    \ set successfully, those browsers won’t send them for subsequent requests.\n\n\
    As we’ve suggested earlier, those browsers will need a separate workaround, which\n\
    \nwe’ll cover later in this chapter. \n\n*6.2.2*\n\n*Iframe workaround (Safari\
    \ only)*\n\nLet’s say that you’re not a fan of opening new windows. In fact, you’re\
    \ insistent on\n\ndelivering a user experience for authenticating users that doesn’t\
    \ involve redirecting\n\nthem to a dedicated login form. If that’s the case, there’s\
    \ a specific scenario in which\n\nyour application can perform authentication\
    \ directly from an iframe element. It’s so\n\nspecific that it only affects a\
    \ single browser!\n\n It turns out that in Safari (including mobile Safari on\
    \ iOS) you can set third-party\n\ncookies from inside an external iframe element\
    \ *only* using a standard form POST. Safari\n\nwill reject any attempt to set\
    \ cookies using document.cookie or using XmlHttpRequest,\n\nbut will allow cookies\
    \ on HTTP requests submitted using HTML forms. At one point this\n\ncould be done\
    \ automatically via JavaScript, but a recent update to Safari requires this\n\n\
    form submission to be initiated by the user—otherwise any malicious script could\
    \ set\n\nthird-party cookies without the user’s knowledge.\n\n In a perfect world,\
    \ you’d use feature detection to detect whether the user’s\n\nbrowser supports\
    \ this behavior. Unfortunately, that would require having the user\n\nmanually\
    \ submit a test form to see whether a cookie was successfully persisted.\n\nInstead,\
    \ we advocate detecting when Safari is present using either user-agent sniffing\n\
    \nListing 6.3\n\n**postMessage** listener waits for success message from the pop-up\
    \ window\n\nwww.it-ebooks.info"
