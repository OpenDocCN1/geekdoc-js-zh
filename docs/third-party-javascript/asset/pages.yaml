  md: "**49**\n\n***Outputting HTML***\n\n As a third-party script, rendering is trickier\
    \ than you might think. Just getting\n\nmarkup on the page can have significant\
    \ performance problems if not done correctly.\n\nAdditionally, you’ve got to share\
    \ the DOM with the publisher’s regular content, and\n\npossibly other third-party\
    \ scripts. You also have to think about how the publisher’s\n\nown CSS rules will\
    \ interact with yours; you might want your widget to inherit the\n\npage’s look\
    \ and feel, or you might want it to look consistent across every website.\n\n\
    \ But hey, we have you covered. In this chapter, we’ll guide you through the steps\
    \ of\n\nrendering the graphical elements of your third-party application on the\
    \ publisher’s\n\npage. We’ll start with getting raw HTML onto the DOM, and then\
    \ move into styling that\n\nHTML. Afterward, we’ll examine HTML and CSS authoring\
    \ best practices, and explore\n\nhow iframes can be used to protect your content\
    \ from conflicting styles and scripts.\n\n*3.1*\n\n*Outputting HTML*\n\nThe fundamental\
    \ first piece to actually having a visible, interactive, embedded widget\n\nis\
    \ outputting HTML on the publisher’s page. But if you recall from chapter 2, you’ve\n\
    \nalready learned how to create script elements and append them to the page for\
    \ the\n\npurpose of loading your application files. How is this any different?\n\
    \n Location, location, location. When you were appending script elements to the\n\
    \npage, you didn’t actually care where they were situated; script elements load\
    \ their tar-\n\nget file regardless of their DOM location. It’s a different story\
    \ now that you’re output-\n\nting your application’s visual elements. If you don’t\
    \ render your application’s HTML\n\nwhere the publisher expects you to, you won’t\
    \ have a very successful application.\n\n We’ll cover two methods for outputting\
    \ HTML on the publisher’s page. The first\n\nmethod, using document.write, outputs\
    \ text to the document stream as it’s being pro-\n\ncessed by the browser. The\
    \ second method involves converting HTML to DOM elements\n\nand inserting them\
    \ next to a known location, like the location of the script include snip-\n\n\
    pet. Additionally, we’ll look at how you can render multiple instances of your\
    \ widget on\n\nthe same page, and look at how the publisher can define their own\
    \ render targets. First\n\nup—outputting HTML the old-fashioned way with document.write.\n\
    \n*3.1.1*\n\n*Using document.write*\n\nThe simplest way to output HTML to the\
    \ publisher’s page is by using document.write.\n\nThis function takes a string\
    \ as input and outputs it as HTML to the document stream.\n\nThis means that the\
    \ HTML is output at the point at which the browser encounters\n\nthe call to document.write.\
    \ It *only* works in conjunction with a standard (blocking)\n\nscript include,\
    \ because the browser needs to block further page processing to wait\n\nfor your\
    \ document.write call to finish outputting. If it didn’t wait, document.write\n\
    \nwould output to wherever the browser was processing the page at that moment,\
    \ and\n\nthe result could be a mislocated widget, malformed HTML, or even a completely\n\
    \nempty document.¹\n\n1 Attempting to call document.write after the page has already\
    \ loaded will actually empty the DOM, present-\n\ning the user with a blank page.\
    \ Needless to say, it can be destructive if not wielded properly.\n\nwww.it-ebooks.info"
