  md: "**132**\n\nCHAPTER 6\n\n***Authentication and sessions***\n\nto Facebook. Sometimes\
    \ it’ll show you if your friends have already “Liked” the content\n\nyou’re viewing.\
    \ Or if you click the Like button yourself, it’ll automatically share that\n\n\
    content to your Facebook news feed, without prompting you to log in.\n\n You can\
    \ bring some of these features to the Camera Stork product widget. Nay—\n\nyou\
    \ *must*. If you can identify that viewers of the widget are already signed in\
    \ to your\n\nstore at camerastork.com, you can enhance their experience of viewing\
    \ your widget.\n\nFor example, you can tell them whether they already own the\
    \ product in question.\n\nYou can remember and display their rating for this product,\
    \ if they have previously\n\nreviewed it. Or maybe you can show them that this\
    \ product is currently on their wish\n\nlist, which might rekindle their interest\
    \ in purchasing.\n\n All of these are nice features. But in order to implement\
    \ them, your application\n\nneeds to know whether the user is currently authenticated\
    \ with your service. This is\n\nnormally a straightforward operation for standard\
    \ web applications, but for third-\n\nparty scripts it’s another story. This is\
    \ because browsers can prevent third-party appli-\n\ncations from reading or setting\
    \ cookies, which are the primary ingredient in persisting\n\nsessions between\
    \ browser requests. That’s a devastating blow, but it doesn’t mean\n\nyou’re out\
    \ of luck—there are a handful of browser-specific workarounds and fallbacks\n\n\
    that will help you persist sessions in the face of discriminatory browser settings.\n\
    \n In this chapter, you’ll learn what third-party cookies are, how they can be\
    \ disabled\n\nby different browsers, and what effect this has on your applications.\
    \ Afterward, we’ll\n\nlook at workarounds on specific browsers for setting third-party\
    \ cookies, and at fall-\n\nback techniques when no such workarounds are available.\
    \ Last, we’ll look at some\n\nsecurity issues concerning cookies, and steps you\
    \ can take to protect against them.\n\n First up: what are third-party cookies,\
    \ anyways?\n\n*6.1*\n\n*Third-party cookies*\n\nWhen normal web applications want\
    \ to persist some kind of session or state, they use\n\ncookies. Cookies are small\
    \ pieces of data the browser persists between HTTP\n\nrequests—which is otherwise\
    \ a stateless protocol. When a user logs in to a web applica-\n\ntion, the server\
    \ returns a cookie that identifies that user’s session. This cookie is saved\n\
    \non the browser and sent back to the server with each subsequent HTTP request\
    \ to the\n\nsame website. The server uses this cookie to identify the user and\
    \ render any user-\n\nspecific data in its responses.\n\n The browser considers\
    \ a cookie to be a *third-party cookie* when that cookie is being\n\ntransferred\
    \ to or from a third-party domain. So if you’re visiting a website at pub-\n\n\
    lisher.com, and somewhere on that page a resource is requested from camera-\n\n\
    stork.com, any cookies transmitted between the user’s browser and camerastork.com\n\
    \nare considered to be third-party. This includes resources loaded inside an external\n\
    \niframe—cookies that are written or sent inside an iframe whose domain differs\
    \ from\n\nthe parent document domain are also considered third-party.\n\n To review,\
    \ table 6.1 highlights under which situations cookies are considered to be\n\n\
    third-party.\n\nwww.it-ebooks.info"
