    ], data\\['temp'\\], data\\['desc'\\])\n\nListing 1.5\n\nServer implementation\
    \ of widget.js, written in Python and Flask—server.py\n\nWeb browser\n\npublisher.com\n\
    \nweathernearby.com\n\n(you)\n\n1\\. Browser requests\n\n \n\nwebsite from \n\n\
    \ \n\npublisher\n\n2\\. Publisher inserts\n\n \n\nweathernearby snippet \n\ninto\
    \ website HTML source\n\n3\\. Browser parses \n\nHTML – snippet \n\n \n\ninitiates\
    \ requests \n\nto third-party servers\n\n4\\. Server dynamically\n\n \n\ngenerates\
    \ widget.js\n\n \n\nHTTP response\n\nJavaScript\n\nsnippet\n\nPublisher \n\nwebsite\n\
    \nFigure 1.8\n\nA server application \n\ndynamically generating the Weather \n\
    \nNearby widget code (widget.js)\n\n**A full-fledged Flask application. It starts\
    \ **\n\n**by importing a few helper libraries, **\n\n**including Flask, and a\
    \ utility function for **\n\n**querying the weather database.**\n\n**Initialize**\n\
    \n**Flask**\n\n**application.**\n\n**Define a single route: '/widget.js'. When\
    \ **\n\n**server starts, Flask will listen to all **\n\n**requests for /widget.js\
    \ and respond by **\n\n**executing this function.**\n\n**Extract zip parameter\
    \ from request’s **\n\n**query string, and query weather database **\n\n**for\
    \ corresponding weather data.**\n\n**Assemble multiline**\n\n**string of JavaScript**\n\
    \n**code that will render**\n\n**the widget’s contents**\n\n**on the publisher’s**\n\
    \n**page. This uses**\n\n**JavaScript’s**\n\n**document.write**\n\n**function,\
    \ which writes**\n\n**a string of text (in this**\n\n**case HTML) directly**\n\
    \n**into page.**\n\nwww.it-ebooks.info"
