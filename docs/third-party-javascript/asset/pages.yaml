  md: "**26**\n\nCHAPTER 2\n\n***Distributing and loading your application***\n\n\
    *2.2*\n\n*Loading the initial script*\n\nNow that you’ve sorted out your development\
    \ environment, it’s time to tackle how\n\nyou’ll load your scripts on the publisher\
    \ page. You’ll do this by using what we call the\n\n*script include snippet*.\n\
    \n The script include snippet is one of the most important pieces of your application.\n\
    \nIt’s the code that’s distributed to publishers and will actually load your code\
    \ on their\n\nweb page. Not only does it have to work, but it has to load your\
    \ files in the most effi-\n\ncient way possible. And there’s a penalty to getting\
    \ it wrong, because getting publish-\n\ners to update their web pages with a new\
    \ version later is a painful undertaking.\n\n We’ll look at two include snippets\
    \ that you can use to load the initial script on your\n\npublisher’s page: a standard,\
    \ “blocking” <script> tag include, and an asynchronous\n\nscript include.\n\n\
    *2.2.1*\n\n*Blocking script includes*\n\nLet’s start with the basics. You should\
    \ already be familiar with how to load scripts using\n\nthe standard HTML <script>\
    \ tag. Using it to load your initial script file is straightfor-\n\nward: just\
    \ give publishers a standard <script> tag to paste into their HTML source\n\n\
    code whose src attribute points to your JavaScript file. This is the simplest,\
    \ smallest\n\namount of code you could give to your publishers. If you recall,\
    \ we used this in chap-\n\nter 1 in the weather widget example.\n\n Here’s what\
    \ a standard script include would look like to load a single instance of\n\nthe\
    \ product widget:\n\n<script src=\"http://camerastork.com/widget.js?product=1234\"\
    ></script>\n\nThe src attribute points to a JavaScript file, widget.js, that’s\
    \ hosted on your servers at\n\nhttp://camerastork.com. Embedded in the URL’s query\
    \ string is a product ID. This\n\nID is how you’ll identify which product to render\
    \ on the publisher’s page. Pretty\n\nstraightforward.\n\n There’s no question\
    \ this method will achieve the desired effect of loading your\n\nscript on the\
    \ publisher’s page, but it comes with a major drawback. A regular\n\n<script>\
    \ tag include like this is considered *blocking* or *synchronous*. This means\
    \ that\n\nthe browser will stop processing the page while it waits for the script\
    \ file to be down-\n\nloaded and executed. This is because the script might modify\
    \ the page contents using\n\ndocument.write. The browser can’t safely continue\
    \ processing until any and all out-\n\nput from document.write has been captured.\n\
    \n This is illustrated in the following example HTML. The browser waits for widget.js\n\
    \nto finish before rendering the header or executing application.js:\n\n<body>\n\
    \n<script\n\nsrc=\"http://camerastork.com/widget.js?product=1234\"></script>\n\
    \n<p>Hello, world</p>\n\n<script src=\"/application.js\"></script>\n\n</body>\n\
    \nwww.it-ebooks.info"
