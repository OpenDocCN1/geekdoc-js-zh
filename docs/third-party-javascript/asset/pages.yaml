  md: "**65**\n\n***Defensive HTML and CSS***\n\n Let’s look at this in practice.\
    \ Consider this revised example of the Stork widget\n\ncontainer, now sporting\
    \ two container <div> elements, each with a unique ID:\n\n<div id=\"stork-main\"\
    >\n\n<div id=\"stork-container\">\n\n<h3 class=\"stork-product\">Mikon E90 Digital\
    \ SLR</h3>\n\n<img src=\"http://camerastork.com/img/products/1337-small.png\"\
    />\n\n<p class=\"stork-price\">$599</p>\n\n<p class=\"stork-rating\">4.3/5.0 &bull;\
    \ 176 Reviews</p>\n\n</div>\n\n</div>\n\nThe accompanying CSS for this HTML could\
    \ then look like this:\n\n#stork-main #stork-container { ... }\n\n#stork-main\
    \ #stork-container .stork-product { ... }\n\n#stork-main #stork-container .stork-price\
    \ { ... }\n\nBy redundantly specifying both container IDs as parent selectors\
    \ of all your CSS rules,\n\nyou’re effectively giving each of your CSS rules a\
    \ minimum specificity score of (0,2,0,0).\n\nAfterward, the publisher’s generic\
    \ #page rule from earlier will no longer conflict with\n\nyour widget, because\
    \ it only uses a single ID. Neither will any purely class- or element-\n\nbased\
    \ rules conflict, because those are an entire CSS weight class below IDs. Even\n\
    \nthough, for selection purposes, it’s completely unnecessary to specify a second\
    \ ID for\n\nyour rules, here it works as an effective device for boosting specificity.\n\
    \nPRESERVE YOUR SANITY WITH CSS PREPROCESSORS\n\nWriting overspecified CSS\n\n\
    can be a real drag: you have to constantly rewrite the same IDs over and over\n\
    \nagain for each one of your CSS rules. You can remedy this by using a CSS pre-\n\
    \nprocessor, which extends the CSS language with additional features like the\n\
    \nability to declare nested hierarchies of rules. For example, using the LESS\
    \ CSS\n\npreprocessor, you could write the previous example like this:\n\n#stork-main\
    \ {\n\n#stork-container {\n\n.stork-product { ... }\n\n.stork-price { ... }\n\n\
    }\n\n}\n\nA number of popular CSS preprocessors are available today, all of which\
    \ have\n\nvarying feature sets. Among the most popular are LESS (http://lesscss.org),\
    \ Sass\n\n(http://sass-lang.com), and Stylus (http://learnboost.github.com/stylus/).\n\
    \nOn the flip side, this example requires that your widget use top-level containers\
    \ with\n\nIDs, which won’t be practical for widgets that can be rendered multiple\
    \ times on the\n\nsame page. Additionally, it’s still not bulletproof: a publisher\
    \ could follow your lead\n\nand overspecify their *own* CSS rules, resulting in\
    \ the same problem you had before.\n\nBut this is an unlikely scenario, especially\
    \ since you’ve redundantly specified two IDs\n\nin each of the rules (you could\
    \ alternatively use one, but this will of course be more\n\nvulnerable). The reality\
    \ is that most publishers use sane CSS rules, and overspecifying\n\nyour rules\
    \ like this will be compatible with most of them.\n\nwww.it-ebooks.info"
