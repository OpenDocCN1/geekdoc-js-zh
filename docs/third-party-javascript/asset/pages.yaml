  md: "**214**\n\nCHAPTER 9\n\n***Performance***\n\n You might be wondering, with\
    \ all the recent developments in JavaScript engines,\n\nshould you really care\
    \ about code performance, or do modern engines take care of\n\nperformance issues\
    \ for you? It’s true that modern engines have become much faster,\n\nbut even\
    \ with all the recent speed improvements, it’s still possible to write slow\n\n\
    JavaScript applications—and slowness caused by a naively written piece of JavaScript\n\
    \ncode can affect end-user experience more than an unoptimized payload. Poor\n\
    \nJavaScript performance can do more than just impact the user’s experience with\
    \ *your*\n\napplication—it can also impact the user’s experience with the *publisher’s*\
    \ page, which is\n\nsomething you absolutely can’t afford.\n\n Though this section\
    \ is by no means an exhaustive lesson in all things JavaScript\n\noptimization,\
    \ we’ll introduce you to a number of performance concepts that we feel\n\nare\
    \ critical to developing third-party applications. We’ll teach you about the browser’s\n\
    \nUI thread and two internal browser events, repaint and reflow, whose behaviors\
    \ are\n\ncrucial to know if you’re serious about high-performance JavaScript.\
    \ We’ll also show\n\nyou how to wrap expensive calls with throttle and debounce,\
    \ two helpful functions\n\nthat limit how often your code is executed. Last, we’ll\
    \ look at a technique for minimiz-\n\ning the impact of long computations using\
    \ the setTimeout function. Let’s start by dig-\n\nging into the browser and learning\
    \ how it works from the inside.\n\n*9.2.1*\n\n*Inside the browser: UI thread,\
    \ repaint, and reflow*\n\nEvery browser has what’s known as a *UI** thread* that’s\
    \ responsible for both JavaScript\n\nexecution *and* UI updates, like drawing\
    \ elements on the page. Because UI updates can\n\naffect the flow of JavaScript\
    \ code, and vice versa, only one thing can happen at a\n\ntime—if the thread is\
    \ busy, all other jobs for UI updates and JavaScript execution will\n\nbecome\
    \ queued. Only when the UI thread has finished performing its current task\n\n\
    will it pick a new job from the queue—either another UI update or JavaScript code\n\
    \nexecution.\n\n Because of this nonparallel nature of UI threads, JavaScript\
    \ executing on the page\n\ncan prevent UI updates, making the page unresponsive.\
    \ If your code is running slow,\n\nthe browser will simply queue up all UI updates\
    \ no matter where they came from—\n\nyour third-party application or the host\
    \ page. But what are these UI updates we’re talk-\n\ning about? UI updates can\
    \ be split into two main categories: *reflow* and *repaint* (also\n\nsometimes\
    \ referred to as *redraw*).\n\nMORE ABOUT HIGH-PERFORMANCE JAVASCRIPT\n\nIf you\
    \ want to learn more about\n\nUI threads and other JavaScript performance tips,\
    \ we recommend you pick\n\nup *High Performance JavaScript* by Nicholas Zakas\
    \ (O’Reilly, 2010). Nicholas\n\nhas also given a number of informative talks on\
    \ this subject that are available\n\non YouTube.\n\nReflow occurs when the DOM\
    \ is modified such that the geometry of an element is\n\nchanged. When this happens,\
    \ the browser must traverse through the DOM and recal-\n\nculate the dimensions\
    \ of any possibly affected elements. Many DOM operations or\n\nstyle changes can\
    \ cause reflows:\n\nwww.it-ebooks.info"
