  md: "**18**\n\nCHAPTER 1\n\n***Introduction to third-party JavaScript***\n\npages\
    \ that sport a variety of different doctypes, DOM layouts, and CSS rules, and\
    \ ought\n\nto work correctly in all of them.\n\n You have to consider that a publisher\
    \ might include your script at the top of their\n\npage, in the <head> tag, or\
    \ they might include it at the bottom of the <body>. Publish-\n\ners might load\
    \ your application inside an iframe, or on a page where the <head> tag is\n\n\
    entirely absent; in HTML5, head sections are optional, and not all browsers automati-\n\
    \ncally generate one internally. If your script makes assumptions about these\
    \ core ele-\n\nments when querying or appending to the DOM, it could wind up in\
    \ trouble.\n\n If you’re developing an embedded widget, displaying proper styles\
    \ also becomes a\n\nconcern. Is the widget being placed on a web page with a light\
    \ background or a dark\n\nbackground? Do you want your widget to inherit styles\
    \ and “blend” into the pub-\n\nlisher’s web design, or do you want your widget\
    \ to look identical in every context?\n\nWhat happens if the publisher’s HTML\
    \ is malformed, causing the page to render in\n\nquirks mode? Solving these problems\
    \ requires more than well-written CSS. We’ll cover\n\nsolutions to these issues\
    \ in later chapters. \n\n*1.4.2*\n\n*Shared environment*\n\nFor a given web environment,\
    \ there’s only one global variable namespace, shared by\n\nevery piece of code\
    \ executing on the page. Not only must you take care not to pollute\n\nthat namespace\
    \ with your own global variables, you have to recognize that other\n\nscripts,\
    \ possibly other third-party applications like yours, have the capability of modify-\n\
    \ning standard objects and prototypes that you might depend on.\n\n For example,\
    \ consider the global JSON object. In modern browsers, this is a native\n\nbrowser\
    \ object that can parse and stringify JSON (JavaScript Object Notation) blaz-\n\
    \ningly fast. Unfortunately, it can be trivially modified by anyone. If your application\n\
    \ndepends on this object functioning correctly, and it’s altered in an incompatible\
    \ way\n\nby another piece of code, your application might produce incorrect results\
    \ or just\n\nplain crash.\n\n The following sample code illustrates how easy it\
    \ is to modify the global JSON\n\nobject by using simple variable assignment:\n\
    \nJSON.stringify = function() {\n\n/\\* custom stringify implementation \\*/\n\
    \n};\n\nYou might think to yourself, “Why would anyone do such a thing?” Web developers\n\
    \noften load their own JSON methods to support older browsers that don’t provide\n\
    \nnative methods. The bad news is that some of these libraries are incompatible\
    \ in sub-\n\ntle ways. For example, older versions of the popular Prototype JavaScript\
    \ library pro-\n\nvide JSON methods that produce different output than native\
    \ methods when handling\n\nundefined values:\n\n// Prototype.js\n\nJSON.stringify(\\\
    [1, 2, undefined\\])\n\n\\=> \"\\[1, 2\\]\"\n\nwww.it-ebooks.info"
