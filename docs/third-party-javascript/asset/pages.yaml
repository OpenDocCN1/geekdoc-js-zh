  md: "**131**\n\n*Authentication*\n\n*and sessions*\n\nUp until this point, we’ve\
    \ been implementing user-agnostic applications. No matter\n\nwho’s loaded your\
    \ third-party script, they all experience the same version of the\n\napplication.\
    \ But what if, instead, your application could identify users who are cur-\n\n\
    rently (or previously) signed in to your service? Leveraging any data you might\n\
    \nhave about that user, you might be able to deliver them a customized and improved\n\
    \nexperience.\n\n You’ve probably seen this behavior in third-party applications\
    \ before. For exam-\n\nple, Facebook’s omnipresent Like button knows whether you’re\
    \ currently signed in\n\n*This chapter covers*\n\nIntroduction to third-party\
    \ cookies\n\nAuthenticating and persisting sessions from \n\nyour third-party\
    \ application\n\nWorkarounds when third-party cookies are \n\ndisabled\n\nTechniques\
    \ for defending against session \n\nhijacking\n\nwww.it-ebooks.info"
