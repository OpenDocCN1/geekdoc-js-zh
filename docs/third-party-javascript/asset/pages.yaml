  md: "**231**\n\n***Debugging***\n\nand debuggable JavaScript code, you merely need\
    \ to log in as the admin user and visit\n\nthe offending page.\n\n Let’s configure\
    \ a switch that implements this behavior. We’ll do this by declaring\n\nthe switch\
    \ definition in your application’s configuration file. For an application writ-\n\
    \nten in Python, you can create a file called settings.py that holds your switch\
    \ configura-\n\ntion, such that it can be imported by other application files.\
    \ Because this is a regular\n\nPython file, you can use regular Python objects\
    \ like arrays and dictionaries to declare\n\nthe current switch state:\n\n\\#\
    \ settings.py\n\nSWITCHES = {\n\n'debug': \\[ 'admin' \\],\n\n'new\\_user\\_interface':\
    \ \\[\\]\n\n}\n\n\\# views.py\n\nfrom settings import SWITCHES\n\ndef loader(self,\
    \ request):\n\nif request.user.username in SWITCHES\\['debug'\\]:\n\nreturn js('loader.debug.js')\n\
    \nelse:\n\nreturn js('loader.js')\n\nYou’ll notice that in this example we hardcoded\
    \ a list of usernames in the settings file.\n\nThis means that whenever you want\
    \ to add or remove a user from a switch, you’ll need\n\nto push your updated settings\
    \ file to your production servers—redeploy your code.\n\nBut having to redeploy\
    \ code every time you want to update a switch is exactly what we\n\nwere trying\
    \ to avoid!\n\n So the next obvious step is to move your switch data into the\
    \ database. By storing\n\nyour switches in the database, you can access their\
    \ data like any other data stored on\n\nyour servers—like the Camera Stork product\
    \ catalog, user reviews, and so on. With\n\nthis setup, you don’t have to redeploy\
    \ your code every time you make a change to your\n\nswitch configuration, which\
    \ makes toggling switches a simpler and faster process.\n\n With your switch configuration\
    \ in place, let’s see what happens the next time you\n\nload the Camera Stork\
    \ widget. It begins with the browser sending a request to your\n\nservers, which\
    \ request is then analyzed by your application. The application will then\n\n\
    query the database asking whether the debug switch should be turned on for that\n\
    \nrequest. If the answer is *yes*, the application loads the development version\
    \ of your\n\nJavaScript files suitable for debugging. And if the answer is *no*,\
    \ then it proceeds to load\n\nyour application normally. Figure 10.4 demonstrates\
    \ this behavior.\n\n The actual code that decides which version to load isn’t\
    \ particularly complicated.\n\nYou need to make a database query and check whether\
    \ the current user has the debug\n\nswitch enabled for them. For example, feature\
    \ switches in a typical web application\n\nwritten in Python might look like this:\n\
    \n**In settings.py, define **\n\n**switches as dictionary **\n\n**with keys for\
    \ names **\n\n**and values for lists of **\n\n**usernames**\n\n**In views.py,\
    \ import **\n\n**dictionary from settings.py**\n\n**When processing request, can\
    \ **\n\n**now check if switch debug was **\n\n**enabled for current user**\n\n\
    www.it-ebooks.info"
