  md: "**84**\n\nCHAPTER 4\n\n***Communicating with the server***\n\nJSON object is\
    \ available. Instead, the callback is executed the moment info.js is evalu-\n\n\
    ated. This requires that the callback function (jsonHandler) is already defined\
    \ by\n\nyour application in the global context before the <script> element is\
    \ loaded. \n\n*4.2.2*\n\n*Dynamic callback functions *\n\nThe biggest downside\
    \ of these approaches for loading JSON via <script> elements is\n\nthat the responses\
    \ assume that the application loading these files already knows the\n\nname of\
    \ the global variable store or callback function. This is where JSONP comes in.\n\
    \nJSONP is a pattern of loading JSON responses via <script> elements where the\
    \ server\n\nwraps its response in a callback function whose name is provided by\
    \ the requesting\n\nparty, via the script URL’s query string. This callback is\
    \ referred to as *padding*—the *P* in\n\n*JSONP*. Padding doesn’t necessarily\
    \ have to be a callback function; it can also be a vari-\n\nable assignment (as\
    \ exhibited earlier) or any valid JavaScript statement. That said,\n\nwe’ll stick\
    \ to callback functions here, because they’re used as the padding 99.99% of\n\n\
    the time.\n\n Let’s look at an example of initiating a simple JSONP request.\n\
    \nwindow.jsonpCallback = function(json) {\n\nalert(\"We've got a response! The\
    \ title is \" + json.title);\n\n};\n\nvar script = document.createElement('script');\n\
    \nscript.async = true;\n\nscript.src =\n\n'http://thirdpartyjs.com/info.js?callback=jsonpCallback';\n\
    \ndocument.body.appendChild(script);\n\nThe first thing you need is a callback\
    \ function that will be executed from the JSONP\n\nresponse after it’s loaded.\
    \ The browser will be evaluating the response in the same doc-\n\nument, so your\
    \ callback function must be defined within the execution context of the\n\nbrowser\
    \ (global). Initiating the request is done by appending an HTML <script> ele-\n\
    \nment to the DOM. The name of the callback function is passed as part of the\
    \ target URL.\n\n When the server receives this request, it’ll generate the following\
    \ response, using\n\nthe callback name taken from the URL’s query string:\n\n\
    jsonpCallback({\n\n'title': 'Third-party JavaScript',\n\n'authors': \\['Anton',\
    \ 'Ben'\\],\n\n'publisher': 'Manning'\n\n});\n\nThis will execute the previously\
    \ defined callback function (jsonpCallback), provid-\n\ning your code with the\
    \ JSON data to do as you please. There’s a snag, though. Because\n\nthe callback\
    \ function name has to be inserted into the response body, this document\n\nhas\
    \ to be generated dynamically using a server-side script. Following is an example\n\
    \nimplementation of info.js using PHP:\n\nListing 4.1\n\nInitiating a simple JSONP\
    \ request \n\n**Global **\n\n**callback **\n\n**function**\n\n**Callback name\
    \ **\n\n**passed as URL **\n\n**parameter**\n\nwww.it-ebooks.info"
