    },\n\nteardown: function () {\n\n/\\* ... \\*/\n\n}\n\n});\n\nQUnit is a terrific\
    \ general-purpose JavaScript testing framework, but it was never writ-\n\nten\
    \ with third-party applications in mind. This means that you have to manually\
