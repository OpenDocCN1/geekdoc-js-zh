  md: "**6**\n\nCHAPTER 1\n\n***Introduction to third-party JavaScript***\n\nArmed\
    \ with the power of remote web page manipulation, the question remains: what\n\
    \nis it good for? In this section, we’ll look at some real-world use cases of\
    \ third-party\n\nscripts:\n\n*Embedded widgets*—Small interactive applications\
    \ embedded on the publisher’s\n\nweb page\n\n*Analytics and metrics*—For gathering\
    \ intelligence about visitors and how they\n\ninteract with the publisher’s website\n\
    \n*Web service API wrappers*—For developing client-side applications that communi-\n\
    \ncate with external web services\n\nThis isn’t a complete list, but should give\
    \ you a solid idea of what third-party JavaScript\n\nis capable of. We’ll start\
    \ with an in-depth look at the first item: embedded widgets.\n\n*1.2.1*\n\n*Embedded\
    \ widgets*\n\nEmbedded widgets (often *third-party widgets*) are perhaps the most\
    \ common use case\n\nof third-party scripts. These are typically small, interactive\
    \ applications that are ren-\n\ndered and made accessible on a publisher’s website,\
    \ but load and submit resources to\n\nand from a separate set of servers. Widgets\
    \ can vary widely in complexity; they can be\n\nas simple as a graphic that displays\
    \ the weather in your geographic location, or as\n\ncomplex as a full-featured\
    \ instant messaging client.\n\n Widgets enable website publishers to embed applications\
    \ into their web pages with\n\nlittle effort. They’re typically easy to install;\
    \ more often than not publishers need only\n\ninsert a small HTML snippet into\
    \ their web page source code to get started. Since\n\nthey’re entirely JavaScript-based,\
    \ widgets don’t require the publisher to install and\n\nmaintain any software\
    \ that executes on their servers, which means less maintenance\n\nand upkeep.\n\
    \n Some businesses are built entirely on the development and distribution of embed-\n\
    \nded widgets. Earlier we mentioned Disqus, a web startup based in San Francisco.\
    \ Dis-\n\nqus develops a commenting widget (see figure 1.3) that serves as a drop-in\n\
    \ncommenting section for blogs, online publications, and other websites. Their\
    \ product\n\nis driven almost entirely by third-party JavaScript. It uses JavaScript\
    \ to fetch comment-\n\ning data from the server, render the comments as HTML on\
    \ the page, and capture\n\nform data from other commenters—in other words, everything.\
    \ It’s installed on web-\n\nsites using a simple HTML snippet that totals five\
    \ lines of code.\n\n Disqus is an example of a product that’s only usable in its\
    \ distributed form; you’ll\n\nneed to visit a publisher’s page to use it. But\
    \ widgets aren’t always standalone products\n\nlike this. Often they’re “portable”\
    \ extensions of larger, more traditional stay-at-home\n\nweb applications.\n\n\
    \ For example, consider Google Maps, arguably the web’s most popular mapping\n\
    \napplication. Users browse to https://maps.google.com to view interactive maps\
    \ of\n\nlocations all over the world. Google Maps also provides directions by\
    \ car and public\n\ntransit, satellite imagery, and even street views using on-location\
    \ photography.\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 30
- img_proc: true
  md: "**7**\n\n***The many uses of third-party JavaScript***\n\nIncredibly, all of\
    \ this magic also comes in a widget flavor. Publishers can embed the\n\nmaps application\
    \ on their own web pages using some simple JavaScript code snippets\n\nobtained\
    \ from the Google Maps website. On top of this, Google provides a set of pub-\n\
    \nlic functions for publishers to modify the map contents.\n\n Let’s see how simple\
    \ it is to embed an interactive map on your web page using\n\nGoogle Maps (listing\
    \ 1.2). This code example begins by first pointing to the Maps\n\nJavaScript library\
    \ using a simple script include. Then, when the body’s onload handler\n\nfires,\
    \ you check whether the current browser is compatible, and if so, initialize a\
    \ new\n\nmap and center it at the given coordinates.¹ We’re done, and all it took\
    \ was roughly 10\n\nlines of code—powerful stuff!\n\n<!DOCTYPE html>\n\n<html>\n\
    \n<head>\n\n<title>Google Maps Example</title>\n\n<script src=\"\n\nhttps://maps.googleapis.com/maps/api/js?v=3.exp&sensor=false\"\
    >\n\n</script>\n\n<script>\n\nvar map;\n\n1 Not everyone knows latitude and longitude\
    \ by heart. Luckily, Google has additional functions for converting\n\nstreet\
    \ addresses to geographical coordinates. Learn more at http://code.google.com/apis/maps.\n\
    \nListing 1.2\n\nInitializing the Google Maps widget\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_31_0.png)\n\
    \nFigure 1.3\n\nAn example commenting section on a publisher’s website, powered\
    \ by \n\nthe Disqus commenting widget\n\nwww.it-ebooks.info"
