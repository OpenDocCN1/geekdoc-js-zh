  md: "**187**\n\n***Versioning***\n\nThis means that if publishers decline to specify\
    \ a version string, they’ll always get the\n\nlatest version.\n\n Next up, init\
    \ checks whether the requested version has already been loaded, or is\n\nin the\
    \ process of being loaded. If it’s already been loaded, then the callback is imme-\n\
    \ndiately called and the library instance is passed as an argument. If it’s in\
    \ the process of\n\nbeing loaded, but not finished, then the callback function\
    \ is appended to a queue.\n\nVERSIONING ISN’T FREE\n\nVersioning is great for\
    \ publishers, because it provides\n\nassurance that their code will continue working\
    \ even if you introduce break-\n\ning API changes. But providing this feature\
    \ requires that you actively maintain\n\nand serve previous versions of your code,\
    \ which can be a maintenance bur-\n\nden. For this reason, some popular SDKs eschew\
    \ versioning altogether. For\n\nexample, the Facebook JS SDK—a large, constantly\
    \ changing library—inten-\n\ntionally doesn’t provide versioning. Be aware of\
    \ the trade-offs of versioning,\n\nand decide whether it’s a good choice for your\
    \ library.\n\nIf the requested version hasn’t been loaded and isn’t in the process\
    \ of being loaded,\n\nthen init loads the corresponding library file using the\
    \ standard loadScript helper\n\nfunction. Just as before, this library file is\
    \ considered the “meat” of your JavaScript\n\nSDK and contains all your public\
    \ functions. After the file has been downloaded, init\n\niterates through the\
    \ queued callback functions, invoking each of them with the library\n\ninstance\
    \ as the first (and only) argument.\n\n You’re probably wondering, how does the\
    \ versioned library get assigned to\n\nStork.instances? To explain that, let’s\
    \ look at lib.1\\_1.js, the library file associated\n\nwith version 1.1 of the\
    \ SDK:\n\n(function(window, undefined) {\n\nvar exports = {};\n\nexports.productWidget\
    \ = function (options) { ... };\n\nexports.listen = function (eventName, handler)\
    \ { ... };\n\nexports.unlisten = function (eventName, handler) { ... };\n\nwindow.Stork.instances\\\
    ['1.1'\\] = exports;\n\n})(this);\n\nThe first thing you’ll notice that the public\
    \ functions—productWidget, listen, and\n\nunlisten—are no longer directly assigned\
    \ to the Stork object. Instead, they’re\n\nassigned to a local variable, which\
    \ is then assigned to Stork.instances. When\n\nStork.init detects that the library\
    \ file is ready, it retrieves this instance and passes it\n\nto the publisher’s\
    \ callback function.\n\n Congratulations—you’ve successfully implemented versioning\
    \ at the initialization\n\nlevel. But why do this over standard URL versioning?\n\
    \n The main reason is because this technique is (arguably) less error-prone for\
    \ pub-\n\nlishers. Forcing publishers to use the Stork object through the callback\
    \ function\n\nmeans they’re less likely to use a Stork object that belongs to\
    \ a different version (or\n\nanother code snippet). This is different from URL\
    \ versioning, where the publisher has\n\nto intentionally use Stork.noConflict\
    \ to avoid such errors.\n\nwww.it-ebooks.info"
