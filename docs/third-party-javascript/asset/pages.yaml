  md: "**196**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\nAt\
    \ a bare minimum, such keys are used to track an application’s API usage and make\n\
    \nsure it isn’t abusing the system. For instance, if an application is initiating\
    \ far too many\n\nHTTP requests to the API, the service can respond by throttling\
    \ or even rejecting that\n\napplication’s requests while leaving other publishers\
    \ unaffected.\n\n In a traditional web service API model, where requests are made\
    \ privately from a\n\nweb server to the API, the contents of this key are never\
    \ made public. This changes\n\nwhen you’re making requests from the browser; if\
    \ you ask publishers to submit an API\n\nkey with each request, that key will\
    \ be publicly visible on the publisher’s website. In\n\nthat case, the key could\
    \ be appropriated by another party and used to make unauthor-\n\nized requests.\n\
    \n Here’s an example of a publisher calling the Stork.api function, and also passing\n\
    \nan apiKey with the request. Because this code is publicly visible on the publisher’s\
    \ web\n\npage, the token is easily stolen using simple inspection:\n\nStork.api('products/details',\n\
    \n{\n\nid: 1337,\n\napiKey: 'fca023afee2d6f0d0668661d4e29b314'\n\n},\n\nfunction(response)\
    \ { /\\* ... \\*/ }\n\n);\n\nAUTHORIZED DOMAINS\n\nTo combat unauthorized API\
    \ usage, client-side APIs often ask for a set of authorized\n\ndomains from which\
    \ their API key is permitted to make requests. That way, even\n\nthough the API\
    \ key is public, it can’t be used outside the publisher’s domain(s).\n\n You’ve\
    \ already learned one way to verify that a request originates from a given\n\n\
    domain—using the Referer HTTP header. When your web service API receives a\n\n\
    request with an accompanying API key, it checks the Referer header of the HTTP\n\
    \nrequest and validates it against the set of authorized domains already supplied\
    \ by the\n\npublisher. Here’s a partial server implementation of the Camera Stork\
    \ API endpoint,\n\nwritten in Python and Flask.\n\nfrom Flask import make\\_response\
    \ as response\n\nfrom urlparse import urlparse\n\n@app.route('/api/<endpoint>')\n\
    \ndef api(endpoint=None):\n\ndomain = urlparse(request.headers\\['Referer'\\]).hostname\n\
    \napi\\_key = request.args.get('apiKey')\n\nif domain not in trusted\\_domains(api\\\
    _key):\n\nreturn response('Unauthorized domain: %s' % domain, 403)\n\n\\# Domain\
    \ is trusted, continue processing API request\n\nThis implementation should be\
    \ straightforward. The helper function, trusted\n\n\\_domains, returns a list\
    \ of domains that corresponds with the provided API key. If the\n\nListing 8.11\n\
    \nUsing the **Referer** header to validate the request's originating domain\n\n\
    **Extract **\n\n**domain from **\n\n**referring URL**\n\n**Validate**\n\n**against**\n\
    \n**stored**\n\n**domains**\n\nwww.it-ebooks.info"
