  md: "**102**\n\nCHAPTER 4\n\n***Communicating with the server***\n\n*4.4.2*\n\n\
    *Transferring cookies with CORS*\n\nBy default, browsers don’t send any identifying\
    \ information—like cookies or HTTP\n\nauth headers—with CORS requests. In order\
    \ to indicate that a request should send\n\nidentifying information, you must\
    \ set the withCredentials property of the\n\nXmlHttpRequest object to true:\n\n\
    var xhr = new XmlHttpRequest();\n\nxhr.withCredentials = true;\n\nIf the server\
    \ expects and supports identifying information, it should respond with a\n\ncorresponding\
    \ special HTTP header called Access-Control-Allow-Credentials (in\n\naddition\
    \ to Access-Control-Allow-Origin). If this header isn’t returned when with-\n\n\
    Credentials is true, the browser will reject the response:\n\nAccess-Control-Allow-Credentials:\
    \ true\n\nAlas, the withCredentials property is only available as a property of\
    \ XmlHttp-\n\nRequest—not XDomainRequest. This means Internet Explorer 8 and 9\
    \ don’t support\n\ncredentialed requests and are incapable of transferring cookies\
    \ using CORS. This\n\nshould be addressed in Internet Explorer 10, which is expected\
    \ to implement\n\nXmlHttpRequest Level 2, the latest W3C standard. \n\n*4.4.3*\n\
    \n*Sending preflight requests*\n\nWith CORS, if your request method is something\
    \ other than GET, POST, or HEAD, or if\n\nyou’re sending a custom HTTP header,\
    \ the browser will make what’s called a *preflight*\n\n*request*. A preflight\
    \ request is a server verification mechanism that allows both parties\n\nto decide\
    \ whether the attempt is legitimate before performing the actual request.\n\n\
    When you try to make such a nonsimple request to the server, the browser makes\
    \ a\n\npreflight request with information about the original request method and\
    \ its headers.\n\nThe server then needs to decide whether the request should be\
    \ allowed and send the\n\nnecessary information back. Preflight requests are always\
    \ transmitted using a special\n\nHTTP method called OPTIONS.\n\n To notify the\
    \ server about the upcoming request and ask for permission, the client\n\nsends\
    \ the following headers:\n\n\n\nOrigin—The origin of the request\n\n\n\nAccess-Control-Request-Method—The\
    \ intended HTTP method of the request\n\n\n\nAccess-Control-Request-Headers—A\
    \ comma-separated list of custom head-\n\ners that the request wants to use\n\n\
    The server then communicates back to the client by sending the following headers\n\
    \nwith the response:\n\n\n\nAccess-Control-Allow-Origin—The allowed origin (must\
    \ match the Origin\n\nheader from the request)\n\n\n\nAccess-Control-Allow-Methods—A\
    \ comma-separated list of allowed methods\n\n\n\nAccess-Control-Allow-Headers—A\
    \ comma-separated list of allowed headers\n\nwww.it-ebooks.info"
