  md: "**199**\n\n***Wrapping web service APIs***\n\nFORGED HEADERS AND UNAUTHORIZED\
    \ ACCESS\n\nThe implementation in listing 8.13 relies on the CameraStork-Publisher-Origin\n\
    \nheader to accurately report the URL of the page using your SDK. But what if\
    \ a rogue\n\nwebsite manages to spoof that header? They could use another publisher’s\
    \ key and\n\nmake requests to your web service API under that publisher’s identity.\
    \ So what’s stop-\n\nping them?\n\n Spoofing a custom header is difficult. It\
    \ turns out that it’s only possible to specify\n\ncustom headers using XmlHttpRequest.\
    \ All other means of issuing requests—like\n\nHTML forms, script tags, and Image\
    \ objects—are incapable of setting headers. And\n\nsince the same-origin policy\
    \ ensures that it’s only possible to use XmlHttpRequest\n\nfrom a document on\
    \ the same domain, a publisher is incapable of using XmlHttp-\n\nRequest from\
    \ their page to make a request to your API. In other words, custom head-\n\ners\
    \ *should* be safe.\n\n At least, that’s what should happen. But as we hinted\
    \ at earlier, the browser is made\n\nup of many components, and not all of them\
    \ adhere to the strict rules of the same-\n\norigin policy. For example, there’s\
    \ a known exploit in the popular Adobe Flash plugin\n\nthat makes it possible\
    \ for a malicious web page to issue an XSRF request through Flash\n\nwhile also\
    \ setting arbitrary headers (http://mng.bz/Ka5x).\n\n This means that custom headers\
    \ alone aren’t enough to ensure that CameraStork-\n\nPublisher-Origin hasn’t been\
    \ tampered with by a publisher. You need to verify that\n\nthe request to your\
    \ API originates from your tunnel file, and not an untrusted party.\n\n The solution\
    \ to this problem, as you learned in chapter 7, is XSRF tokens. By\n\nembedding\
    \ an XSRF token in your tunnel file and submitting that token again with\n\nsubsequent\
    \ requests to your API, you can verify that the value of CameraStork-\n\nPublisher-Origin\
    \ hasn’t been tampered with. We’ll leave this as an exercise for you\n\nto implement.\
    \ \n\nYOUR WEB SERVICE API IS STILL VULNERABLE TO ROGUE CLIENTS\n\nIt’s important\
    \ to understand that these countermeasures only prevent a rogue website\n\nfrom\
    \ issuing HTTP requests under the identity of a *regular browser user*. It’s still\
    \ possible\n\nfor determined parties to make unauthorized requests to your API.\n\
    \n For example, nothing can prevent an attacker from taking a publisher’s key\
    \ and\n\nissuing an HTTP request to your API using a nonbrowser client (a script\
    \ written in any\n\nprogramming language). To get around your XSRF protection,\
    \ they can request the\n\ntunnel file first and extract the XSRF token to submit\
    \ with their malicious API request.\n\n Or to get even more creative, a malicious\
    \ user could build a custom version of\n\nChromium or Firefox that ignores same-origin\
    \ policy checks. Then there’s nothing\n\nstopping that user from opening up the\
    \ console and issuing an XMLHttpRequest to\n\nyour web service API with fraudulent\
    \ credentials.⁵\n\n5 As far-fetched as this seems, our technical reviewer, Alex\
    \ Sexton, has actually done this, and frankly, it \n\nterrifies us.\n\nwww.it-ebooks.info"
