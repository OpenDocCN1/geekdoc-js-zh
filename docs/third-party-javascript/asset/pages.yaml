  md: "**36**\n\nCHAPTER 2\n\n***Distributing and loading your application***\n\n\
    Organizing your code into modules like this isn’t required; it’s a convention\
    \ we’ve\n\nused in developing our own JavaScript apps. We find grouping functions\
    \ into logically\n\nseparated modules makes good sense. You could alternatively\
    \ place new utility meth-\n\nods directly on the top-level namespace object. As\
    \ long as you’re not declaring new\n\nglobal functions, we won’t object.\n\n To\
    \ load dom.js and gain access to its helper methods, loadScript is used as follows:\n\
    \nloadScript('http://camerastork.com/widget/dom.js', function() {\n\nStork.dom.get('#some-id');\n\
    \n});\n\nStork.dom.get('#some-id'); // Error\n\nDon’t forget that loadScript loads\
    \ files asynchronously. In this example, the DOM\n\nhelper functions aren’t ready\
    \ until loadScript’s callback parameter has executed.\n\nInvoking the helper functions\
    \ immediately after calling loadScript will throw an\n\nexception; the code hasn’t\
    \ been loaded yet. \n\n*2.4.2*\n\n*Libraries*\n\nUnless you’re a JavaScript guru,\
    \ it’s probably unlikely that you’ll be developing this\n\napplication using your\
    \ own DOM helper functions. And why should you? There are\n\ndozens of popular,\
    \ tested JavaScript libraries out there that have already solved cross-\n\nbrowser\
    \ DOM manipulation. As you’ve probably heard hundreds of times, “Why re-\n\ninvent\
    \ the wheel?”\n\n Let’s say that you’ve decided to use the jQuery library in your\
    \ application. If you’re\n\nnot familiar with it, jQuery is currently the most\
    \ popular JavaScript library on the web.\n\nIt provides a concise API for querying\
    \ and manipulating the DOM, and a number of\n\nhelper methods for handling events,\
    \ performing animations, and making AJAX calls.\n\njQuery can go a long way toward\
    \ reducing the amount of code you’ll need to write in\n\ndeveloping third-party\
    \ JavaScript applications—not to mention the Camera Stork\n\nproduct widget. Let’s\
    \ make it a dependency, and load jquery.js using the loadScript\n\nhelper function.\n\
    \n Unfortunately, loading a commonly used library like jQuery poses a hurdle for\n\
    \nthird-party applications. jQuery itself is nearly ubiquitous,⁴ and there’s a\
    \ high chance\n\nthat a given publisher may have already loaded it on their own\
    \ pages. If you try to load\n\njQuery when it already exists on the page, the\
    \ two will likely conflict.\n\nNAMESPACES AND NOCONFLICT\n\nThe trick to using\
    \ common libraries is *namespacing*. You want to load your copy of the\n\njQuery\
    \ object inside your application namespace, and only use that copy. Often this\n\
    \nwill mean having to modify the library source code itself.\n\n4 According to\
    \ Pingdom, a monitoring and analytics company, jQuery was used by over 28% of\
    \ all websites in\n\n2010\\. Among popular websites, that number is far higher\
    \ (http://royal.pingdom.com/2010/03/26/jquery-\n\ntriumphant-march-to-success/).\n\
    \n**DOM helper functions **\n\n**become accessible **\n\n**inside callback**\n\
    \n**Attempting to**\n\n**access helper**\n\n**functions before**\n\n**file has\
    \ loaded**\n\n**throws exception**\n\nwww.it-ebooks.info"
