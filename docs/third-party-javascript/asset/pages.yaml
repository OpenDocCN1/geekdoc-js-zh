  md: "**107**\n\n***HTML5 window.postMessage API***\n\n*5.1.1*\n\n*Sending messages\
    \ using window.postMessage*\n\nUsing window.postMessage is pretty straightforward.\
    \ In order to send a message, you\n\ncall the postMessage method on the target\
    \ window you want to receive a message.\n\nThe target window can be the global\
    \ window object (the window context where your\n\nscript is executing) or any\
    \ of the following possible recipients:\n\nIframes created within your document\
    \ window:\n\nvar iframe = document.getElementById('my-iframe');\n\nvar win = iframe.documentWindow;\n\
    \nPop-up windows that you’ve opened with JavaScript:\n\nvar win = window.open(...);\n\
    \nThe window that contains your document window:\n\nvar win = window.parent;\n\
    \nAnd the window that opened your document:\n\nvar win = window.opener;\n\nAfter\
    \ you have a reference to the target Window object, you can send messages to that\n\
    \nwindow by calling a special postMessage function on that object. This function\n\
    \naccepts two formal parameters: data to send (the message body) and the target’s\
    \ ori-\n\ngin value:\n\npostMessage: hello\n\nfoo.com is \n\nrecognized\n\nbar.com\
    \ is not \n\nrecognized\n\nTarget document\n\npostMessage: world\n\nbar.com\n\n\
    foo.com\n\npostMessage: hello\n\nFigure 5.1\n\nAn example of two messages from\
    \ \n\ndifferent sources being sent to the recipient. \n\nRecipient recognizes\
    \ and processes only one \n\nsource while ignoring the other.\n\nwww.it-ebooks.info"
