  md: "**19**\n\n***Challenges of third-party development***\n\n// Native\n\nJSON.stringify(\\\
    [1, 2, undefined\\])\n\n\\=> \"\\[1, 2, null\\]\"\n\nThe JSON object is just one\
    \ example of a native browser object that can be altered by\n\ncompeting client\
    \ code; there are hundreds of others. Over the course of this book\n\nwe’ll look\
    \ at solutions for restoring or simply avoiding these objects.\n\n Similarly,\
    \ the DOM is another global application namespace you have to worry\n\nabout.\
    \ There’s only one DOM tree for a given web page, and it’s shared by all applica-\n\
    \ntions running on the page. This means taking special care when you interact\
    \ with it.\n\nAny new elements you insert into the DOM have to coexist peacefully\
    \ with existing ele-\n\nments, and not interfere with other scripts that are querying\
    \ the DOM. Similarly, your\n\nDOM queries can inadvertently select elements that\
    \ don’t belong to you if they’re not\n\nscoped properly. The opposite is also\
    \ true; other applications might accidentally\n\nquery your elements if you haven’t\
    \ carefully chosen unique IDs and class names.\n\n Since your code exists in the\
    \ same execution environment as other scripts, security\n\nalso becomes a taller\
    \ order. Not only do you have to protect against improper use by\n\nusers of your\
    \ application, you also have to consider other scripts operating on the\n\npage,\
    \ or even the publisher, to be a potential threat. For example, if you’re writing\
    \ a\n\nwidget or script that ties to a larger, popular service, like a social\
    \ networking website,\n\npublishers might have a vested interest in attempting\
    \ to fake user interactions with\n\ntheir own pages. \n\n*1.4.3*\n\n*Browser restrictions*\n\
    \nIf an unknown document context, multiple global namespaces, and additional secu-\n\
    \nrity concerns aren’t bad enough, web browsers actively prohibit certain actions\
    \ that\n\noften directly affect third-party scripts. For example, AJAX has become\
    \ a staple tool of\n\nweb developers for fetching and submitting data without\
    \ refreshing the page. But the\n\nweb browser’s same-origin policy prevents XmlHttpRequest\
    \ from reaching domains\n\nother than the one you’re on (see figure 1.9). If you’re\
    \ writing a third-party script that\n\nneeds to get or send data back to an application\
    \ endpoint on your own domain, you’ll\n\nhave to find other ways to do it.\n\n\
    \ In the same vein, web browsers also commonly place restrictions on the ability\
    \ of\n\napplications to set or even read third-party cookies. Without them, your\
    \ users won’t be\n\nable to “log in” to your application or remember actions between\
    \ subsequent\n\nrequests. Depending on the complexity of your application, not\
    \ being able to set or\n\nread third-party cookies can be a real hindrance.\n\n\
    ![](img/5163284bc2a93c8f882ffdc058bb516a_43_0.png)\n\nFigure 1.9\n\nFailed cross-domain\
    \ AJAX request from localhost to google.com in Google Chrome\n\nwww.it-ebooks.info"
