  md: "**30**\n\nCHAPTER 2\n\n***Distributing and loading your application***\n\n\
    entry.parentNode.insertBefore(script, entry);\n\n})();\n\n</script>\n\nLet's discuss\
    \ some interesting points about this example. You’ll notice that the script\n\n\
    element’s async attribute is set to true. This isn’t just for posterity—Opera\
    \ and some\n\nolder versions of Firefox require this attribute to be set in order\
    \ for the script to be exe-\n\ncuted as soon as it is downloaded. Otherwise, Opera\
    \ and Firefox will attempt to pre-\n\nserve execution order (similar to the defer\
    \ attribute). Second, you’ll notice that this\n\nentire snippet is wrapped in\
    \ an immediately-invoked function expression, or IIFE. This\n\nprevents the script\
    \ and entry variables from leaking into the global scope. Remem-\n\nber: this\
    \ code snippet is executing on the publisher’s page, which could be home to\n\n\
    any number of additional, unknown scripts. It’s best to avoid declaring global\
    \ vari-\n\nables, which could interfere with—or be interfered with by—other JavaScript\
    \ code.\n\nERROR-FREE <SCRIPT> TAG INSERTION\n\nIn the previous example, the <script>\n\
    \ntag element is inserted before another found script element on the page.\n\n\
    Alternatively, you could append the <script> tag to the head or body, but\n\n\
    that isn’t always safe. In some browsers it’s possible to load a web page without\n\
    \na head element (admittedly, rare). And appending to the body element\n\nbefore\
    \ it’s finished parsing can sometimes cause browser exceptions. Insert-\n\ning\
    \ before a found script element is a surefire way to load a script file without\n\
    \nrunning into these gotchas. And you can always guarantee there’s at least one\n\
    \nscript element: the one that loaded your application.\n\nYou might be wondering\
    \ to yourself, “Why are we paying so much attention to this\n\ninclude snippet?”\
    \ When it comes to third-party development, first impressions count.\n\nAfter\
    \ you distribute this include snippet to publishers, it’ll be incredibly difficult\
    \ to get\n\nthem to change this code later. And unfortunately, since you likely\
    \ don’t have access\n\nto the servers hosting their website, you can’t change\
    \ it for them. It’s a good idea to\n\ncome out with your best solution first.\n\
    \nFASTER SCRIPT LOADING\n\nIf you’re interested in learning more techniques for\n\
    \nloading your scripts faster, you’ll want to read the *High Performance Web Sites*\n\
    \nseries of books by Steve Souders (O’Reilly). Steve covers every conceivable\n\
    \nway of loading scripts, some of which can translate to big performance savings\n\
    \nin your applications. We’ll cover some of these techniques as they pertain to\n\
    \nthird-party scripts in chapter 9 on performance.\n\nWe’re moving on for now,\
    \ but we’ll revisit the script include snippet later in this chap-\n\nter. In\
    \ the meantime, pretend you’ve already given the asynchronous include snippet\n\
    \nto one of your store’s loyal fans, which they’ve added to their web page’s HTML\
    \ source\n\nand published. This will cause your application’s initial script file,\
    \ widget.js, to load on\n\ntheir web page. Let’s take a look inside this script\
    \ file and see what it’s doing. \n\n**Inject script element into DOM **\n\n**by\
    \ inserting before an existing **\n\n**<script> tag. When inserted, **\n\n**browser\
    \ begins downloading **\n\n**target script file.**\n\nwww.it-ebooks.info"
