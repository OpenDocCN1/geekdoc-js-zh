    page. Then, when the browser is finished processing the page, it executes any\n\
    \ndeferred scripts in the order they were encountered (see figure 2.3).\n\n The\
    \ following is an example of the same <script> tag we saw earlier, this time\n\
    \nsporting the defer attribute:\n\n<script defer\n\nsrc=\"http://camerastork.com/widget.js?product=1234\"\
    ></script>\n\nThe defer attribute has been around for some time, and enjoys pretty\
    \ broad support\n\namong major browsers. The only notable exception is Opera,\
    \ for which the attribute\n\nis ignored, causing the <script> tag to be treated\
    \ as a regular blocking one.\n\nXHTML AND REQUIRED ATTRIBUTE VALUES\n\nIf this\
    \ value-less use of the defer\n\nattribute looks funny, it might be because you’re\
    \ used to working with\n\nXHTML. In an XHTML world, the defer example would be\
    \ written like this:\n\n<script defer=\"defer\"\n\nsrc=\"http://camerastork.com/widget.js?product=1234\"\
    ></script>\n\nThis is because XHTML requires attributes to have values, whereas\
    \ HTML\n\ndoesn’t. The code examples in this book are all written in HTML and\
    \ not\n\nXHTML. \n\nTHE ASYNC SCRIPT ATTRIBUTE\n\nThe second attribute, async,\
    \ is a more recent feature of HTML5, and behaves slightly\n\ndifferently than\
    \ defer. Again, it indicates that the downloaded file won’t call document\n\n\
    .write and can be downloaded as the page is being processed. But unlike defer,\n\
    \nwhich executes the file only after the page is completely parsed, scripts loaded\
    \ with\n\nthe async attribute are executed as soon as they’re downloaded—whether\
    \ the page is\n\nfinished processing or not. This means that async scripts can\
    \ potentially execute\n\nsooner than scripts loaded using defer (see figure 2.3).\n\
    \nScript A request\n\nWeb server\n\nWeb page\n\nWeb page\n\nScript B request\n\
    \nScript B response\n\nDocument ready\n\nScripts A and B\n\nexecuted\n\nScript\
    \ A response\n\nScript A request\n\nWeb server\n\nScript B request\n\nScript B\
    \ response\n\nScript B executed\n\nScript A executed\n\nScript A response\n\n\
    Figure 2.3\n\nTwo scripts (A and B) loaded using both the **defer** and **async**\
    \ attributes. \n\nFiles loaded with the **async** attribute execute as soon as\
    \ they’re downloaded, whereas \n\nfiles loaded with **defer** wait until the document\
    \ is fully parsed.\n\nwww.it-ebooks.info"
