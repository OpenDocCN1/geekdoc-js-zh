  md: "**165**\n\n***Cross-site request forgery***\n\nXSRF TOKENS AND THIRD-PARTY\
    \ APPLICATIONS\n\nBe aware that the effectiveness of\n\nXSRF tokens depends on\
    \ them only being exchanged between your servers and\n\nthe browser user. If you\
    \ ever make an XSRF token available to code executing\n\non the publisher’s page,\
    \ a malicious page could obtain the token and perform\n\nan attack just as it\
    \ could before. The solution is to only serve your XSRF token\n\nto users through\
    \ an external iframe (accessed via camerastork.com), such that\n\nthe parent document\
    \ can’t access it. This means that in order to use the token,\n\nany requests\
    \ to your servers will have to be initiated from inside the iframe\n\n(triggered\
    \ using window.postMessage and/or easyXDM).\n\nIn the case of JSON hijacking,\
    \ in addition to standard anti-XSRF protection, you can\n\nalso add some problematic\
    \ JavaScript code to the first line of your JSON response such\n\nthat it’s impossible\
    \ for the attacker to successfully access the response code using a\n\n<script>\
    \ tag. For example, you could add a simple infinite loop to the first line of\n\
    \nyour server’s JSON response:\n\nwhile (1);\n\n1\\. User requests a secure page\n\
    \n2\\. Server issues XSRF \n\ntoken, and embeds in \n\n \n\nHTTP response\n\n\
    3\\. User submits form, \n\ntransmitting XSRF token\n\n4\\. Server checks validity\
    \ \n\nof XSRF token before \n\n \n\naccepting request\n\nWeb page\n\nWeb page\n\
    \nUser\n\nServer\n\nUser\n\nServer\n\nFigure 7.2\n\nThe process of issuing and\
    \ validating XSRF tokens\n\nwww.it-ebooks.info"
