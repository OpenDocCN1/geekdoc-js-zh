  md: "**25**\n\n***Configuring your environment for third-party development***\n\n\
    Open up Apache’s configuration file, httpd.conf. On OS X you’ll find this in /etc/\n\
    \napache2. Add the following rules:\n\nNameVirtualHost \\*:80\n\n<VirtualHost\
    \ \\*:80>\n\nServerName publisher.dev\n\nDocumentRoot \"/Users/username/project/publisher\"\
    \n\n</VirtualHost>\n\n<VirtualHost \\*:80>\n\nServerName widget.dev\n\nDocumentRoot\
    \ \"/Users/username/project/widget\"\n\n</VirtualHost>\n\nWhen you’re done, restart\
    \ Apache:\n\n$ sudo apachectl restart\n\nNow your files in the /publisher directory\
    \ will be accessible at http://publisher.dev,\n\nand your files in /widget at\
    \ http://widget.dev (see figure 2.2). Organized!\n\n This is just one way to set\
    \ up your project. You’re free to choose your own host-\n\nnames, web server software,\
    \ or folder location for your code. We’ll refer mostly to pro-\n\nduction domain\
    \ names throughout these chapters (such as camerastork.com), but\n\nyou can always\
    \ substitute them for your local development domains for testing. \n\nFiles in\
    \ /Users/username/project/publisher\n\nare served by publisher.dev.\n\npublisher.dev\n\
    \nvirtual host\n\nPrimary web content \n\nloaded from \n\npublisher.dev\n\nThird-party\
    \ component\n\nloaded from widget.dev\n\nwidget.dev\n\nvirtual host\n\nApache\n\
    \nFiles in /Users/username/project/widget\n\nare served by widget.dev.\n\nYou\
    \ can simulate a third-party \n\ndevelopment environment with a \n\nsingle server\
    \ using two virtual hosts.\n\nWeb browser\n\nFigure 2.2\n\nEach virtual host points\
    \ to a separate folder in your filesystem.\n\nwww.it-ebooks.info"
