  md: "**79**\n\n***AJAX and the browser same-origin policy***\n\nuncontrolled manner.\
    \ Without the necessary security measures, any random website\n\nwill have the\
    \ power to perform potentially destructive actions on your behalf. For\n\nexample,\
    \ if run without restrictions, a malicious website could load your favorite web\n\
    \nmail application as a hidden document, grab your unique session identifier,\
    \ and then\n\nuse it to do horrible things with your data. What’s worse is that\
    \ the application—the\n\none under attack—will have no idea that those actions\
    \ weren’t explicitly triggered by\n\nyou. Your email account will never be the\
    \ same (see figure 4.1).\n\n Fortunately for us, browser vendors developed and\
    \ implemented perhaps the most\n\nimportant security concept in web clients: the\
    \ *same-origin policy (**SOP**)*. The SOP was first\n\nintroduced in Netscape\
    \ Navigator 2.0 (the same version that first introduced\n\nJavaScript), and at\
    \ its core it ensures that documents are isolated from each other if\n\nthey’re\
    \ served from different *origins*. In other words, the policy permits scripts\
    \ on dif-\n\nferent documents to access each other’s DOM methods and properties\
    \ with no specific\n\nrestrictions *only if they were served from the same domain,\
    \ port, and **HTTP** protocol*. Scripts\n\nthat are trying to access methods and\
    \ properties from a document on a different ori-\n\ngin must, according to the\
    \ policy, receive a slap on the wrist by way of a lovely Permis-\n\nsion Denied\
    \ exception.\n\n Today, all browsers implement the same-origin policy in regards\
    \ to XMLHttp-\n\nRequest, iframes, and other ways of exchanging messages between\
    \ documents. It’s\n\nthanks to the SOP that the following example will fail with\
    \ a security exception in\n\nevery major browser:\n\nfunction evil() {\n\n \n\n\
    mail.contentWindow.GMAIL-deleteAll();\n\n}\n\nGmail in embedded \n\niframe named\
    \ “mail”\n\nEvil code tries to \n\ndelete all your mail, \n\nbut call fails due\
    \ \n\nto same-origin policy\n\nhttp://evil.com\n\nGmail inbox\n\nWeb browser\n\
    \ndo\n\nn \n\n.c\n\n() \n\nnten\n\nFigure 4.1\n\nA malicious website is prevented\
    \ from accessing the contents of the \n\nGMail iframe thanks to the same-origin\
    \ policy.\n\nwww.it-ebooks.info"
