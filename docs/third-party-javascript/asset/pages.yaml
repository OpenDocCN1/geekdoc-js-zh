  md: "**93**\n\n***Subdomain proxies***\n\nDon’t worry, this is less work than it\
    \ sounds. First, the publisher will need any pages\n\nhosted on www.publisher.com\
    \ that are loading your widget to opt in to their own\n\nhigher-level domain (publisher.com).\
    \ You could do this from your widget code, but\n\nit’s better if changes to document.domain\
    \ are done at the top of the page’s HTML\n\nsource, in the <head> element:\n\n\
    <!DOCTYPE html>\n\n<html>\n\n<head>\n\n<script>document.domain = 'publisher.com';</script>\n\
    \n...\n\nYes, your third-party script could set document.domain itself, but, as\
    \ we mentioned ear-\n\nlier, it’s better to set the document.domain as early in\
    \ the page load as possible. Setting\n\nthe origin too late can result in a lot\
    \ of undefined and buggy behavior and is best\n\navoided.\n\n Next up, initiating\
    \ the request. The code in listing 4.5 amends the getProduct-\n\nData function\
    \ to load the proxy page into a hidden iframe and grabs a handle to the\n\njQuery.ajax\
    \ method from a reference to the proxy’s global window object. This\n\nobject\
    \ is accessible from the parent window via the special contentWindow property.\n\
    \nfunction getProductData(id) {\n\nvar iframe = document.createElement('iframe');\n\
    \niframe.src = 'http://stork.publisher.com/proxy.html';\n\niframe.onload = function()\
    \ {\n\niframe.contentWindow.jQuery.ajax({\n\nmethod: 'GET',\n\nurl: 'http://stork.publisher.com/products',\n\
    \ndata: { product: id },\n\nsuccess: function() {\n\n/\\* render widget \\*/\n\
    \n}\n\n});\n\n};\n\ndocument.getElementsByTagName('head')\\[0\\].appendChild(iframe);\n\
    \n}\n\nYou can now relax and enjoy the ability to communicate with your servers\
    \ from your\n\nthird-party script executing on a publisher’s page. This particular\
    \ implementation cre-\n\nates a new iframe for each call to getProductData, but\
    \ that’s easily remedied by pre-\n\nserving the iframe object between calls. \n\
    \nListing 4.5\n\nLoading the tunnel file and grabbing a handle to **jQuery.ajax**\n\
    \n**Load proxy document **\n\n**inside iframe**\n\n**Invoke callback**\n\n**function\
    \ when**\n\n**iframe becomes**\n\n**loaded**\n\n**Initiate **\n\n**XmlHttpRequest\
    \ **\n\n**using jQuery **\n\n**helper function**\n\n**Append**\n\n**iframe to**\n\
    \n**DOM**\n\nwww.it-ebooks.info"
