  md: "**34**\n\nCHAPTER 2\n\n***Distributing and loading your application***\n\n\
    \ What you want to do is stick with the original script include snippet, which\
    \ loads a\n\nsingle script file that serves as the entry point for the application.\
    \ After that initial\n\nscript is loaded, you’ll then load any additional supporting\
    \ files dynamically using\n\nJavaScript. In this section, you’ll learn how to\
    \ do that, beginning with plain JavaScript\n\nfiles that you’ve written, and then\
    \ moving on to popular JavaScript libraries.\n\n*2.4.1*\n\n*JavaScript files*\n\
    \nTo load additional JavaScript files from your application, you’ll use the same\
    \ tech-\n\nnique from the asynchronous script include snippet. If you recall,\
    \ that snippet created\n\na new <script> tag element using document.createElement,\
    \ and then appended it to\n\nthe DOM.\n\n This time around, there are a few catches.\
    \ For starters, you’ll need to know when\n\nthe file has been loaded by the browser\
    \ before you can execute any functions it\n\ndeclares. Second, seeing as you might\
    \ have to load several JavaScript files in this fash-\n\nion, you’ll want to encapsulate\
    \ this code in a reusable function.\n\n Figuring out when a file has been loaded\
    \ isn’t too tricky. The browser has events\n\nthat can be listened to that report\
    \ when a file has been loaded (see figure 2.5). The\n\nonly catch is that different\
    \ browsers support different onload events, and you’ll need\n\nto support all\
    \ of them. Also, since you don’t have any helpful JavaScript libraries avail-\n\
    \nable (yet), you’ll need to write the raw event-handling code yourself.\n\n The\
    \ following listing shows an implementation of such a script-loading function,\n\
    \nwhich we’ve dubbed loadScript. The behavior of this function is visualized in\
    \ figure 2.5.\n\nloadScript()\n\ncallback()\n\n<script>\n\n1\\. loadScript() creates\
    \ a\n\n<script> element and sets\n\nits onload handler and URL.\n\n2\\. Script\
    \ element downloads script \n\nfrom URL, and then calls onload \n\nhandler when\
    \ complete.\n\n3\\. onload handler invokes \n\nyour callback, which \n\ncan use\
    \ code from the \n\nnewly loaded script.\n\n4\\. Finally, onload handler is removed\
    \ from script element.\n\nFigure 2.5\n\nThe **loadScript** function loads a JavaScript\
    \ file from the provided \n\nURL and invokes a callback function when that file\
    \ is ready.\n\nwww.it-ebooks.info"
