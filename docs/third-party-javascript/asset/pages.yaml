  md: "**142**\n\nCHAPTER 6\n\n***Authentication and sessions***\n\nNow, when the\
    \ user clicks the Login link, the new window will open. And this proba-\n\nbly\
    \ shouldn’t be just any old login page. It’s best if this is a login page that’s\
    \ designed\n\nto be confined in a new window—ideally, a small one. That doesn’t\
    \ mean it has to look\n\nugly, either. Figure 6.5 shows what the Login page for\
    \ the Camera Stork widget will\n\nlook like.\n\n Not bad looking, right? You can\
    \ create a pretty decent user experience within the\n\nconstraints of a dedicated\
    \ new window.³\n\nAVOIDING POP-UP BLOCKERS\n\nToday, every web browser has a pop-up\
    \ blocker\n\nbuilt in, which means that if you’re not careful, the browser can\
    \ prevent you\n\nfrom opening new windows from JavaScript. To avoid this, always\
    \ make sure\n\nthat you open a new window as a *direct result of a user action*—like\
    \ a mouse click\n\nor form submission. If there’s a delay between when the user\
    \ invoked an\n\naction and you open the window, most browsers will see this behavior\
    \ as mali-\n\ncious and block the operation.\n\nNow, let’s say the user enters\
    \ their username and password, and hits the Sign-in but-\n\nton, which POSTs the\
    \ form to your servers. Your server-side code will verify the user-\n\nname and\
    \ password, generate a new session, and assign the newly generated session ID\n\
    \nto a cookie. It’ll also render a new HTML page as part of the response, whose\
    \ purpose\n\nis to communicate the successful authentication back to your application\
    \ code run-\n\nning inside the parent iframe (see figure 6.6).\n\nCOMMUNICATING\
    \ THE SUCCESSFUL AUTHENTICATION\n\nTo send messages between an iframe and a window\
    \ object, you’ll need some kind of\n\nwindow-messaging API. For simplicity, we’ll\
    \ show you how to do this using the\n\nwindow.postMessage API (in production,\
    \ you’d probably want to use easyXDM or a\n\ncomparable library for greater browser\
    \ compatibility).\n\n3 This example (found in the companion source code) uses\
    \ Bootstrap, a CSS and HTML toolkit from the\n\nfolks at Twitter. It provides\
    \ basic typography, layout, and form styles in an easy-to-use package: http://\n\
    \ntwitter.github.com/bootstrap.\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_166_0.png)\n\
    \nFigure 6.5\n\nThe Camera Stork \n\nlogin window, opened dynamically \n\nfrom\
    \ your third-party script\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 166
- img_proc: true
  md: "**143**\n\n***Setting third-party cookies***\n\nTo send a message back to the\
    \ iframe using postMessage, you can use the following\n\ncode:\n\nwindow.opener.postMessage(\n\
    \nJSON.stringify({success: true, name: 'John Doe'}),\n\n'http://camerastork.com'\n\
    \n);\n\nUnless the iframe is actually listening for this message, nothing will\
    \ happen. You’ll\n\nneed to define a postMessage listener function back in the\
    \ parent iframe before the\n\nwindow is opened. When the listener receives the\
    \ successful authentication message,\n\nit’ll close the pop-up window, because\
    \ it has fulfilled its role and is no longer neces-\n\nsary. These steps are implemented\
    \ next.\n\nLogin form downloaded \n\nfrom camerastork.com\n\nCamera Stork server\
    \ checks \n\nusername and password\n\nNote: Same-origin policy\n\nprevents publisher.com\
    \ \n\nfrom stealing password!\n\nStores cookie to indicate user is logged in;\
    \ \n\nnotifies main window to update display \n\nusing postmessage\n\nOK\n\ncamerastork.com\n\
    \ncamerastork.com\n\nUsername\n\nPassword\n\nJohnDoe\n\n**.....**\n\nSign in\n\
    \ncamerastork.com\n\nUsername\n\nPassword\n\nSign in\n\ncamerastork.com\n\nClicking\
    \ Login opens\n\nnew window\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_167_0.png)\n\
    \n**Welcome,**\n\n**John Doe!**\n\npublisher.com\n\nLogin\n\npublisher.com\n\n\
    ![](img/5163284bc2a93c8f882ffdc058bb516a_167_0.png)\n\nFigure 6.6\n\nUsing a dedicated\
    \ window to \n\nauthenticate a user on camerastork.com\n\nwww.it-ebooks.info"
  merge: -1
