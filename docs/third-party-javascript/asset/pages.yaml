  md: "**192**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\nHere’s\
    \ an example of a curl command that requests a list of reviews from the API\n\n\
    ordered by date:\n\ncurl http://camerastork.com/api/reviews/list?ordered\\_by=date\n\
    \nPlease note that these endpoints are read-only: they allow a publisher to query\
    \ the\n\nCamera Stork database, but not modify it. As such, they all respond to\
    \ GET requests,\n\nnot POSTs. We’ll return to this fact later.\n\nTHE JAVASCRIPT\
    \ INTERFACE\n\nNow that you know what the Camera Stork web service API looks like,\
    \ it’s time to\n\ndesign a function interface for accessing those endpoints from\
    \ your SDK. You’ll intro-\n\nduce a new public function, Stork.api, through which\
    \ publishers will access the API.\n\nThis function will accept three parameters:\
    \ the API endpoint the publisher is trying to\n\naccess (reviews/list), a set\
    \ of API parameters to send with the request\n\n(ordered\\_by), and finally a\
    \ callback function that’s executed when the API response is\n\nready:\n\nStork.api\
    \ = function(endpoint, params, callback) {\n\n// Function body\n\n};\n\nFor example,\
    \ for a publisher to request a list of user reviews ordered by date (like the\n\
    \nexample curl request from earlier), they’d use the following code:\n\nStork.api('reviews/list',\
    \ { ordered\\_by: 'date' }, function(response) {\n\nif (response.error) {\n\n\
    console.log(\"An error occurred: \" + response.error);\n\n} else {\n\nconsole.log(response.data);\n\
    \n}\n\n});\n\nWhen the response is ready, the SDK passes a response object to\
    \ the publisher’s call-\n\nback function. If the API request succeeded, the API’s\
    \ JSON payload is accessible via\n\nthe response object’s data attribute. If an\
    \ error occurred, then the error response\n\nstring is accessible via the response\
    \ object’s error attribute.\n\nTable 8.1\n\nThe Camera Stork Web Service API\n\
    \nURL endpoint\n\nReturns\n\nParameters\n\nproducts/list\n\nList of products\n\
    \nordered\\_by—Price, date, or score\n\nproducts/details\n\nDetailed information\
    \ about a \n\nspecific product\n\nid—The product’s unique ID\n\nreviews/list\n\
    \nList of user reviews\n\nordered\\_by—Date or score\n\nproduct\\_id—A product\
    \ ID\n\nreviews/details\n\nDetailed information about a \n\nspecific user review\n\
    \nid—A unique review ID\n\nwww.it-ebooks.info"
