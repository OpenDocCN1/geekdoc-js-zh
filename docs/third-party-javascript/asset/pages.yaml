  md: "**185**\n\n***Versioning***\n\nNow, the noConflict function isn’t solely a\
    \ jQuery thing—it’s a pattern that’s imple-\n\nmented in a number of notable JavaScript\
    \ libraries, including Backbone.js, Under-\n\nscore.js, and easyXDM, to name a\
    \ few. We’ll add the Camera Stork SDK to that list of\n\nlibraries.\n\n To do\
    \ that, let’s return to sdk.js (listing 8.5). First, you’ll remove the line that\
    \ exits\n\nearly if a global Stork object already exists. Instead, you’ll cache\
    \ the existing Stork\n\nobject before overwriting it with the new version. If\
    \ Stork.noConflict is called, it’ll\n\nrestore the cached object to its original\
    \ location.\n\n(function(window, undefined) {\n\nvar Stork = {};\n\n...\n\nvar\
    \ \\_Stork = window.Stork;\n\nwindow.Stork = Stork;\n\nStork.noConflict = function()\
    \ {\n\nwindow.Stork = \\_Stork;\n\nreturn Stork;\n\n};\n\n})(this);\n\nPretty\
    \ easy, eh? Now a publisher only has to write the following code to ensure that\n\
    \nthey only reference the correct version of the SDK:\n\n<script src=\"http://camerastork.com/sdk\\\
    _1.0.js\"></script>\n\n<script>\n\nwindow.MyStork = Stork.noConflict();\n\n</script>\n\
    \nNow, even if someone comes along and loads a different version, window.MyStork\
    \ will\n\nremain untouched. Success!\n\n*8.2.2*\n\n*Versioned initialization*\n\
    \nUsing separate files to serve different versions of your SDK is a tried-and-true\
    \ tech-\n\nnique, but we’ll explore an alternate approach: versioning via your\
    \ SDK’s initialization\n\nfunction. Versioning at the initialization level offers\
    \ some subtle advantages over URL\n\nversioning—but before we get there, let’s\
    \ first see how it works.\n\n Remember: before a publisher can use your SDK, they\
    \ have to call Stork.init,\n\nwhich loads most of the application code, and then\
    \ executes a provided callback when\n\nthat code is ready. This initialization\
    \ function is an excellent place for publishers to\n\ndeclare a version string:\n\
    \n<script src=\"http://camerastork.com/sdk.js\"></script>\n\n<script>\n\nStork.init('1.1',\
    \ function(S) {\n\nS.productWidget({\n\nListing 8.5\n\nImplementing **noConflict**\
    \ for the Camera Stork SDK\n\n**Cache existing **\n\n**Stork object**\n\n**Restore\
    \ cached **\n\n**Stork object**\n\nwww.it-ebooks.info"
