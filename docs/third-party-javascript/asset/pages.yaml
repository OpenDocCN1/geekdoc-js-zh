  md: "**31**\n\n***The initial script file***\n\n*2.3*\n\n*The initial script file*\n\
    \nAt this point, the publisher is using your script include snippet, which is\
    \ requesting a\n\nsingle script file from your servers and loading it onto their\
    \ page. This file, widget.js, is\n\nthe main entry point for your third-party\
    \ application. It’s responsible for the whole\n\nshow: loading any additional\
    \ code or resources, fetching data about the product, and\n\nultimately rendering\
    \ the widget on the page.\n\n Here’s a high-level tour of widget.js.\n\nvar Stork\
    \ = (function(window, undefined) {\n\nvar Stork = {};\n\nfunction loadSupportingFiles(callback)\
    \ {}\n\nfunction getWidgetParams() {}\n\nfunction getRatingData(params, callback)\
    \ {}\n\nfunction drawWidget() {}\n\n/\\* ... \\*/\n\nloadSupportingFiles(function()\
    \ {\n\nvar params = getWidgetParams();\n\ngetRatingData(params, function() {\n\
    \ndrawWidget();\n\n});\n\n});\n\nreturn Stork;\n\n})(window);\n\nNAMESPACES IN\
    \ JAVASCRIPT\n\nYou’ve probably seen namespace objects in\n\nJavaScript before.\
    \ For example, the jQuery library puts all of its public meth-\n\nods behind the\
    \ jQuery object (jQuery also aliases this object to $ for conve-\n\nnience). Namespaces\
    \ are common for nearly all JavaScript libraries, and are\n\njust good programming\
    \ practice.\n\nFor the most part, widget.js is empty; it’s just some boilerplate\
    \ code that we’ll fill in\n\nshortly. But before we look at implementations to\
    \ some of these stubbed-out func-\n\ntions, we want to highlight a few things.\n\
    \n*2.3.1*\n\n*Aliasing window and undefined*\n\nThe function expression from listing\
    \ 2.2 has two parameters: window and undefined.\n\nYou might recognize these as\
    \ global objects that should be accessible at every scope.\n\nSo why redeclare\
    \ them as function arguments?\n\n For starters, window and undefined are two objects\
    \ that you’ll likely use repeatedly\n\nin your code. When they’re declared as\
    \ local variables like this, a JavaScript minifier\n\ncan shorten their variable\
    \ names to help reduce the script’s file size. But if they’re ref-\n\nerenced\
    \ as global variables, those references can’t be renamed and shortened.\n\nListing\
    \ 2.2\n\nwidget.js: main script body\n\n**The Stork global variable is a **\n\n\
    **namespace object that **\n\n**encapsulates your application. The **\n\n**purpose\
    \ of the namespace object is **\n\n**to house any public functions your **\n\n\
    **application will expose. Instead of **\n\n**declaring those functions globally,\
    \ **\n\n**they’re assigned as properties of **\n\n**the Stork namespace, to prevent\
    \ **\n\n**them from leaking into the global **\n\n**variable scope and possibly\
    \ **\n\n**conflicting with other code.**\n\n**These empty**\n\n**function**\n\n\
    **stubs**\n\n**encapsulate**\n\n**parts of the**\n\n**application**\n\n**we’ll\
    \ cover**\n\n**later.**\n\n**Main application flow—initialize, **\n\n**load, and\
    \ render widget.**\n\n**IIFE prevents local variables and functions from **\n\n\
    **leaking into the global scope. If you couldn’t tell **\n\n**by now, we take\
    \ great precautions to avoid global **\n\n**variables!**\n\nwww.it-ebooks.info"
