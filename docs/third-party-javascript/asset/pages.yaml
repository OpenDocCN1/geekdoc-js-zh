  md: "**167**\n\n***Publisher vulnerabilities***\n\n<script>\n\n(function() {\n\n\
    var script = document.createElement('script');\n\nscript.async = true;\n\nscript.src\n\
    \n\\= 'http://camerastork.com/widget.js?' +\n\n'*publisher=somepublisher*&product\\\
    _id=1337';\n\nvar entry = document.getElementsByTagName('script')\\[0\\];\n\n\
    entry.parentNode.insertBefore(script, entry);\n\n})();\n\n</script>\n\nNow, what\
    \ will happen if a *different* publisher—by mistake or for malicious reasons—\n\
    \ninstalls this snippet on their website? A clueless publisher, instead of reading\
    \ your doc-\n\numentation and going through the installation process properly,\
    \ might decide to copy\n\nand paste the snippet code—with configuration parameters\
    \ not specific to them—\n\nfrom another website. In that case, the Camera Stork\
    \ service will mistakenly attribute\n\nany actions performed on the imposter’s\
    \ page to the original publisher.\n\n Now, for the Camera Stork widget, this isn’t\
    \ the end of the world. The worst that\n\nmight happen is that the imposter might\
    \ earn referrals for the original publisher. But\n\nfor other third-party applications,\
    \ the results can have far more impact. For example,\n\nif an imposter loaded\
    \ an analytics-gathering script (similar to Google Analytics) that\n\nwas attributed\
    \ to another publisher, they could ruin that publisher’s data, causing\n\nuntold\
    \ damages to their business. Another possible scenario: if you have a service\
    \ that\n\ncharges publishers differently according to the load they bring on your\
    \ servers, an\n\nimposter could bring unexpected charges against another publisher.\
    \ Based on our\n\npersonal experience, publishers seem to dislike that.\n\nVERIFYING\
    \ PUBLISHERS WITH THE REFERER HEADER\n\nThe strongest defense against publisher\
    \ impersonation is to verify the requesting\n\nparty using the Referer HTTP header.\
    \ In case you’re not familiar with it, the Referer\n\nheader is sent by the browser\
    \ with every HTTP request, and contains the URL of the\n\ndocument from which\
    \ the request originated. That means that you can verify that the\n\noriginating\
    \ document is a valid URL belonging to the publisher. If the Referer header\n\n\
    contains a URL with an unknown domain, you can reject the request and return an\n\
    \nerror response.\n\n To do this, you’ll need to have publishers submit to you\
    \ a set of trusted domains\n\nfrom which you can expect requests for your script\
    \ to originate. This can be done\n\nthrough a form hosted on your website (see\
    \ figure 7.3). You’ll need to save these val-\n\nues in a database, and attribute\
    \ them to the publisher’s account.\n\n Afterward, you can perform the trusted\
    \ domain verification in your web server\n\ncode. Let’s suppose that the initial\
    \ script file (widget.js) is actually served via a server-\n\nside application.\
    \ When this resource is requested, you’ll look up the publisher’s\n\ntrusted domains\
    \ and verify that the Referer URL falls under one of these values. The\n\nListing\
    \ 7.6\n\nA script include snippet that identifies the publisher\n\nwww.it-ebooks.info"
