  md: "**244**\n\nCHAPTER 10\n\n***Debugging and testing***\n\nfamiliar. Hiro was\
    \ developed by engineers at Disqus in order to write good regression\n\ntests\
    \ for our widgets.\n\n Like QUnit, Hiro is a JavaScript library that’s easy to\
    \ install. Just download the\n\nlibrary, create an HTML file, and you’re ready\
    \ to go. In this section, we’ll rewrite the\n\nJSON regression test from earlier\
    \ to use Hiro.\n\nWRITING A SIMPLE HIRO TEST CASE\n\nTest suites in Hiro are created\
    \ using the hiro.module method. The method accepts\n\ntwo parameters—a string\
    \ containing the name of the test suite, and a JavaScript object\n\ncontaining\
    \ its implementation:\n\nhiro.module(\"JSON Tests\", {\n\nsetUp:\n\nfunction ()\
    \ { ... },\n\nonTest: function () { ... },\n\ntestStringifyParse: function ()\
    \ {\n\n/\\* test implementation \\*/\n\n}\n\n});\n\nHiro recognizes test functions\
    \ by their name—they must be prefixed with *test*. All\n\nother methods are ignored\
    \ unless they’re special hooks such as setUp or waitFor. The\n\nsetUp method is\
    \ run once before every test suite, whereas the onTest method is run\n\nbefore\
    \ every test execution. These are just two example hooks; others are docu-\n\n\
    mented on the Hiro website.\n\n What makes Hiro special is that you don’t need\
    \ to manually manage iframes—\n\nHiro will make an iframe sandbox available for\
    \ every test suite. All you need to do is\n\ndefine the iframe’s contents using\
    \ a *test fixture*. Test fixtures refer to any kind of initial\n\nstate or data\
    \ that’s loaded before running a test. In Hiro, fixtures are HTML markup\n\nthat’s\
    \ injected into the iframe used by your test suite. The next listing shows an\
    \ exam-\n\nple of a test case that tests JSON functionality in an isolated environment\
    \ using Hiro.\n\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n<title>Camera Stork Tests</title>\n\
    \n<link rel=\"stylesheet\" href=\"bootstrap.css\">\n\n<link rel=\"stylesheet\"\
    \ href=\"webui.css\">\n\n<script src=\"underscore.js\"></script>\n\n<script src=\"\
    jquery.js\"></script>\n\n<script src=\"hiro.js\"></script>\n\n<script src=\"webui.js\"\
    ></script>\n\n</head>\n\n<body onload=\"main()\">\n\n<div class=\"container\"\
    >\n\n...\n\n</div>\n\nListing 10.4\n\nExample of a test case using Hiro testing\
    \ framework\n\n**Load Hiro and **\n\n**application files**\n\n**Boilerplate Hiro\
    \ code**\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 268
- img_proc: true
  md: "**245**\n\n***Testing***\n\n<script data-name=\"clean\" type=\"hiro/fixture\"\
    >\n\n<html>\n\n<head>\n\n<script src=\"stork/lib.js\"></script>\n\n</head>\n\n\
    </html>\n\n</script>\n\n<script>\n\nhiro.module(\"JSONTests\", {\n\nsetUp: function\
    \ () {\n\nthis.loadFixture({ name: 'clean' });\n\n},\n\ntestStringifyParse: function\
    \ (test) {\n\ntest.expect(2);\n\nvar obj = {'chapter':'Testing',pages: \\[ 1,\
    \ 2, 3 \\] };\n\ntest.assertEqual(\n\nthis.window.Stork.JSON.stringify(obj),\n\
    \n'{\"chapter\":\"Testing\",\"pages\":\\[1,2,3\\]}');\n\ntest.assertEqual(this.window.Stork.JSON.parse(\n\
    \nthis.window.JSON.stringify(obj)), obj);\n\n}\n\n});\n\n</script>\n\n</body>\n\
    \n</html>\n\nTESTING UNDER MULTIPLE IFRAME ENVIRONMENTS\n\nYou just used Hiro\
    \ to test JSON functionality in a perfectly functioning iframe sand-\n\nbox. But\
    \ remember, you want to cover two contexts: when the host page overwrites\n\n\
    toJSON and when it doesn’t.\n\n Hiro makes this easy using what are called *mixins*.\
    \ Instead of copying and pasting\n\nyour test function into a different test suite,\
    \ you can use mixins to run your original\n\ntest suite against a wholly different\
    \ iframe environment—one that defines a broken\n\nObject.prototype.toJSON implementation.\
    \ To do this, you’ll first need a second\n\nHTML fixture that defines this environment:\n\
    \n<script data-name=\"overwritten\" type=\"hiro/fixture\">\n\n<html>\n\n<head>\n\
    \n<script src=\"stork/lib.js\"></script>\n\n<script>\n\nObject.prototype.toJSON\
    \ = function () {\n\nreturn '';\n\n};\n\nvar isReady = true;\n\n</script>\n\n\
    </head>\n\n</html>\n\n</script>\n\n**HTML fixtures are **\n\n**stored inside script\
    \ **\n\n**elements with special **\n\n**hiro/fixture type**\n\n**Same as with\
    \ QUnit: **\n\n**run assertions **\n\n**against isolated files**\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 269
- img_proc: true
  md: "**246**\n\nCHAPTER 10\n\n***Debugging and testing***\n\nNow you can create\
    \ a new test suite that loads this fixture, but also indicates that the\n\noriginal\
    \ JSONTests module should be mixed in using the mixin property:\n\nhiro.module(\"\
    JSONTestsPrototype\", {\n\nmixin: \\[ \"JSONTests\" \\],\n\nsetUp: function ()\
    \ {\n\nthis.loadFixture({ name: 'overwritten' });\n\n}\n\n});\n\nBam! Now when\
    \ you run the resulting HTML in a browser, you should see something\n\nsimilar\
    \ to figure 10.7.\n\n Earlier, we mentioned that Hiro generates iframe environments\
    \ per *test suite*, not\n\nfor each individual test function. Although it might\
    \ be ideal to have a separate iframe\n\nper test, we found that continually creating\
    \ and destroying iframes can be expensive\n\non the browser. We chose this compromise\
    \ so that our tests finish in a reasonable\n\namount of time. Nothing’s worse\
    \ than a slow-running test suite!\n\n*10.3*\n\n*Summary*\n\nTesting and debugging\
    \ are things that most developers do reluctantly. It makes sense\n\nto debug—after\
    \ all, if you’re debugging, it means that there’s a bug, someone found\n\nit,\
    \ and this person is probably not happy about the whole situation. But now that\
    \ you\n\nknow how to approach bugs in third-party widgets, you’re able to put\
    \ all the pieces of\n\ninformation together and fix your next bug much quicker.\
    \ In addition to that, you\n\nknow how to set up your testing and debugging environment\
    \ in an unobtrusive but\n\nextremely helpful way.\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_270_0.png)\n\
    \nFigure 10.7\n\nExample Hiro output: green borders around each suite mean that\
    \ \n\nboth of them successfully passed. Once again, everything works as expected.\n\
    \nwww.it-ebooks.info"
  merge: -1
  pgno: 270
- img_proc: true
  md: "**247**\n\n***Summary***\n\n And though debugging isn’t pleasant, writing tests\
    \ is fun! In this chapter, we cov-\n\nered two testing frameworks: QUnit and Hiro.\
    \ Knowing how to use just one of them\n\nshould be sufficient for covering your\
    \ widget’s functionality with tests. So go write\n\nsome tests! The earlier you\
    \ start, the more confident you’ll be when implementing\n\nnew features and changing\
    \ code. And the more confident you are, the faster you can\n\niterate with your\
    \ third-party JavaScript application. What’s next? Profit!\n\nwww.it-ebooks.info"
