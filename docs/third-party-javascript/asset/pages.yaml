  md: "**9**\n\n***The many uses of third-party JavaScript***\n\nCrazy Egg’s third-party\
    \ script is considered a *passive* script; it records statistical data\n\nwithout\
    \ any interaction from the publisher. The publisher is solely responsible for\n\
    \nincluding the script on the page. The rest happens automatically. \n\nACTIVE\
    \ SCRIPTS\n\nNot all analytics scripts behave passively. Mixpanel is an analytics\
    \ company whose\n\nproduct tracks publisher-defined user actions to generate statistics\
    \ about website visi-\n\ntors or application users. Instead of generic web statistics,\
    \ like page views or visitors,\n\nMixpanel has publishers define key application\
    \ events they want to track. Some exam-\n\nple events might be “user clicked the\
    \ signup button,” or “user played a video.” Pub-\n\nlishers write simple JavaScript\
    \ code (see listing 1.3) to identify when the action takes\n\nplace and then call\
    \ a tracking method provided by Mixpanel’s third-party scripts to\n\nregister\
    \ the event with their service. Mixpanel then assembles this data into interest-\n\
    \ning funnel statistics to help answer questions like, “What series of steps do\
    \ users take\n\nbefore upgrading the product?”\n\n<button id=\"signup\">Sign up!</button>\n\
    \n<script src=\"http://api.mixpanel.com/site\\_media/js/api/mixpanel.js\">\n\n\
    </script>\n\n<script>\n\nvar mpmetrics = new MixpanelLib(PUBLISHER\\_API\\_TOKEN);\n\
    \njQuery(function() {\n\njQuery('#signup').click(function() {\n\nmpmetrics.track(\"\
    signup button clicked\");\n\n});\n\n});\n\n</script>\n\nUnlike Crazy Egg, Mixpanel’s\
    \ service requires some development work by the pub-\n\nlisher to define and trigger\
    \ events. The upside is that the publisher can collect custom\n\ndata surrounding\
    \ user actions and answer questions about user activity.\n\nListing 1.3\n\nTracking\
    \ user signups with the Mixpanel JS API\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_33_0.png)\n\
    \nFigure 1.4\n\nCrazy Egg’s \n\nheat map visualization \n\nhighlights trafficked\
    \ areas \n\nof publishers’ websites.\n\n**Initialize **\n\n**Mixpanel **\n\n**library**\n\
    \n**Attach click event **\n\n**handler to signup **\n\n**button using jQuery**\n\
    \n**Submit event occurrence using **\n\n**Mixpanel library function**\n\nwww.it-ebooks.info"
