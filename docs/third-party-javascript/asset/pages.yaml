  md: "**166**\n\nCHAPTER 7\n\n***Security***\n\nThe attacker won’t be able to get\
    \ past the first line if the data is loaded using a <script>\n\ntag, because the\
    \ browser will freeze while running the loop. Your widget, on the other\n\nhand,\
    \ can fetch this data as plain text via XMLHttpRequest, after which you can discard\n\
    \nthe first line before converting the response into a proper JavaScript object.\n\
    \nWEB FRAMEWORKS AND XSS, XSRF\n\nMost web development frameworks (such\n\nas\
    \ Ruby on Rails and Django for Python) have built-in countermeasures for\n\nXSS\
    \ and XSRF vulnerabilities. If you’re using a web framework, be sure to\n\ninvestigate\
    \ its documentation and familiarize yourself with these tools.\n\nThat wraps up\
    \ what you need to know about cross-site request forgery—another\n\nannoying type\
    \ of vulnerability that you, as a third-party JavaScript developer, have to\n\n\
    always think about. Although concise, the defense mechanisms we described should\n\
    \nbe enough for most cases where XSRF vulnerability is involved. XSS and XSRF\
    \ vulnera-\n\nbilities are responsible for the majority of successful attacks\
    \ on web applications, and\n\nparticularly on third-party JavaScript applications,\
    \ which is why we’ve spent so much\n\ntime discussing them. \n\n*7.4*\n\n*Publisher\
    \ vulnerabilities*\n\nAlthough most of the time you’ll be dealing with vulnerabilities\
    \ arising from cross-site\n\nscripting and cross-site request forgery, there are\
    \ other vulnerabilities—old and new—\n\nthat attackers can use to break into your\
    \ web application. We’d love to cover them all,\n\nbut they deserve a separate\
    \ manuscript devoted to the topic of web application security.\n\n So, for the\
    \ remainder of this chapter, we’ll focus on a particular subset of vulnera-\n\n\
    bilities involving *publishers*. Unlike traditional web applications, third-party\
    \ apps\n\ninvolve multiple parties, and one of these—the publisher—can’t necessarily\
    \ be\n\ntrusted. Because you’re executing (at least some of) your application\
    \ code on their\n\npage, they have a unique vector through which your application\
    \ might be attacked—\n\nintentionally and sometimes even unintentionally. In this\
    \ section, we’ll briefly go over\n\nthe most common of these vulnerabilities:\
    \ publisher impersonation, clickjacking, and\n\ndenial of service.\n\n*7.4.1*\n\
    \n*Publisher impersonation*\n\n*Publisher impersonation* is where a malicious\
    \ publisher presents themselves as another\n\npublisher that has registered with\
    \ your application. In doing so, the attacker both\n\ngains access to data that\
    \ should only be presented to the victimized publisher, and any\n\nactions made\
    \ by the attacker are incorrectly attributed to the victim.\n\n Let’s look at\
    \ an example. If you recall chapter 1, you’ll remember that you need to\n\nhave\
    \ publishers place a script include snippet in their web page source code that\
    \ loads\n\nyour application. Suppose that you’ve also had publishers register\
    \ with your applica-\n\ntion beforehand, and the script include snippet you’ve\
    \ given them (shown in the next\n\nlisting) specifies a configuration variable\
    \ with the publisher’s account username (or\n\nsome other identifying token).\n\
    \nwww.it-ebooks.info"
