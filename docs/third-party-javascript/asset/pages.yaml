  md: "**215**\n\n***Optimizing JavaScript***\n\nAdding, removing, or changing the\
    \ location of an element\n\nChanging the size of an element—either by changing\
    \ its contents (innerText)\n\nor through a style change (width, height, padding,\
    \ and so on)\n\nResizing the window\n\nRepaint occurs after the browser has completed\
    \ a reflow. It literally paints the ele-\n\nments on the screen after their dimensions\
    \ have been calculated. Sometimes a repaint\n\ncan occur without a reflow, whenever\
    \ a change occurs that doesn’t require recalculat-\n\ning geometry. An example\
    \ of this is changing an element’s foreground color—the\n\nbrowser doesn’t need\
    \ to reflow the DOM in order to change a paragraph’s text color.\n\n Both reflow\
    \ and repaint are expensive in terms of performance and are often the\n\nsource\
    \ of your JavaScript performance problems. Browsers try to improve perfor-\n\n\
    mance by bundling various reflow and repaint events together before executing\n\
    \nthem, but some operations cause the browser to stop everything and reflow the\
    \ cur-\n\nrent DOM tree.\n\n Remember earlier in this chapter, when talking about\
    \ deferring images, we said\n\nthat accessing an element’s offset coordinates\
    \ (offsetTop and offsetLeft) is an\n\nexpensive operation? That’s because your\
    \ browser has to make sure that it has up-to-\n\ndate information about the element’s\
    \ position before it can return the correct result.\n\nAnd the only way browsers\
    \ can do this is by forcing a DOM tree reflow. This means that\n\nthe browser’s\
    \ UI thread must execute all queued jobs, because they might modify the\n\nDOM\
    \ in a way that changes the value of the requested property. And only after that\n\
    \nforced reflow will the browser calculate the current coordinate offset and return\
    \ it to\n\nthe callee.\n\n With this knowledge handy, you might recognize why\
    \ the previous version of the\n\ndeferred avatar solution wasn’t sufficient. First,\
    \ it queries the window’s viewport\n\ndimensions, which can potentially force\
    \ a DOM reflow. Second, every time it loads a\n\nnew avatar, it causes a repaint\
    \ operation (or possibly even a reflow, if the image dimen-\n\nsions change).\
    \ And because of the synchronous nature of the UI thread, both of these\n\noperations\
    \ can tie up other scripts and UI updates. This wouldn’t be so bad were this\n\
    \nfunction called infrequently, but because it’s bound to the window’s scroll\
    \ event,\n\nwhich can fire multiple times per second, this function could conceivably\
    \ make the\n\nwhole page unresponsive while the user is scrolling. \n\n*9.2.2*\n\
    \n*Controlling expensive calls: throttle and debounce*\n\nThe solution to this\
    \ problem lies in two techniques designed to control how often\n\nyour functions\
    \ are called. These techniques—*throttle* and *debounce*—work by creating a\n\n\
    wrapper function that rate-limits calls to the original function. These functions\
    \ oper-\n\nate in slightly different ways, which we’ll get to in a moment. But\
    \ what’s important is\n\nthey’re both effective in rate-limiting calls to functions\
    \ bound to frequently firing\n\nbrowser events—like the window’s scroll event.\n\
    \n Throttle works by limiting function calls to no more than once every *N* millisec-\n\
    \nonds (see figure 9.2). An example implementation of a throttle function, shown\
    \ in\n\nwww.it-ebooks.info"
