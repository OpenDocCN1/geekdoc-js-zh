  md: "**74**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\nfunction applyStyles(document,\
    \ styles) {\n\nvar body = document.getElementsByTagName('body')\\[0\\];\n\nfor\
    \ (var property in styles) {\n\nif (!styles.hasOwnProperty(property))\n\nreturn;\n\
    \nbody.style\\[property\\] = styles\\[property\\];\n\n}\n\n}\n\napplyStyles(iframe.contentWindow.document,\
    \ getBasicStyles(container));\n\nThis function is straightforward. It iterates\
    \ through the hash of style objects, and\n\napplies them one by one to the given\
    \ document’s body element. By putting these styles\n\non your iframe’s body element,\
    \ they’ll effectively act as base styles inherited by your\n\nHTML and CSS. Dope!\n\
    \n Now, if you’re using an iframe that’s hosting external content, things get\
    \ trickier,\n\nbut it’s not too bad. One method is to pass the detected styles\
    \ as part of the URL that\n\nloads your external document. This can be done by\
    \ converting the styles hash to\n\nquery string or hash fragment parameters. Then,\
    \ from JavaScript code running on the\n\nexternal document, extract the parameters\
    \ from the URL (using some of the parame-\n\nter-passing techniques from section\
    \ 2.5), and use the applyStyles function to inject\n\nthem into the page. Figure\
    \ 3.7 illustrates this process. \n\nListing 3.9\n\nApplying style rules to a document’s\
