    \n**successful,**\n\n**request visitor’s**\n\n**mutual Facebook**\n\n**friends\
    \ using the**\n\n**Graph API’s /**\n\n**mutualfriends/**\n\n**endpoint. When**\n\
    \n**response is ready,**\n\n**execute show-**\n\n**MutualFriends**\n\n**callback\
    \ function.**\n\n**Iterate through list **\n\n**of friends and render **\n\n**them\
    \ to page.**\n\nwww.it-ebooks.info"
