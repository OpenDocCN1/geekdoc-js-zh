  md: "**45**\n\n***Fetching application data***\n\nNow you have your bases covered.\
    \ The downside is that the script include snippet has\n\ngrown by three lines\
    \ of code—not a big deal. The upside is that the script include\n\nsnippet can\
    \ be included many times on the page, and you’ll have an array of product\n\n\
    IDs to work with.\n\n Is there a benefit to using global variables to pass parameters\
    \ over embedding\n\nthem in the DOM, either via the query string or fragment identifier,\
    \ or using data-\\*\n\nattributes? Sure. For starters, you can embed any type\
    \ of JavaScript object as a parame-\n\nter, like a dictionary object. And embedding\
    \ parameters as global variables is, debat-\n\nably, more clear to publishers\
    \ than appending them to the end of a long URL. Last,\n\nunlike the other techniques\
    \ we covered, you don’t need to query the DOM in order to\n\nextract the parameters—they’re\
    \ already initialized as JavaScript variables for you.\n\nWhen performance matters\
    \ above all else, global variables may be the best choice.\n\nTable 2.1 summarizes\
    \ the pros and cons of the various techniques.\n\nEach of the four methods we\
    \ covered in this section—using the query string, the frag-\n\nment identifier,\
    \ data-\\* attributes, and global variables—have their own pros and cons\n\n(see\
    \ table 2.1). Which you use will depend largely on your type of application. Some\n\
    \nwidgets will probably make use of data-\\* attributes because they enable the\
    \ applica-\n\ntion to locate the position of the script include snippet in the\
    \ DOM. Analytics scripts\n\nmight use global variables for their configurability\
    \ and performance. Using the query\n\nstring might seem like the odd man out,\
    \ but there may be cases where passing param-\n\neters to the server when requesting\
    \ the script file is preferred. Just remember that\n\nwhatever you implement,\
    \ it’ll be difficult to switch later—so choose wisely. \n\n*2.6*\n\n*Fetching\
    \ application data*\n\nBy this point, you’ve distributed a script include snippet\
    \ to participating publishers,\n\nwho’ve included it in their pages’ HTML source\
    \ code. That snippet loads your applica-\n\ntion code, which then loads any supporting\
    \ files of its own. Your application then\n\nextracts any parameters that were\
    \ included as part of the script include snippet. For\n\nthe Camera Stork example,\
    \ this is a single parameter, product ID, which is used to\n\nidentify the product\
    \ to be rendered.\n\nTable 2.1\n\nPros and cons of parameter-passing techniques\n\
    \nTechnique\n\nPros\n\nCons\n\nQuery string\n\nUses URL, passed to server\n\n\
    Must query DOM, less cache-able\n\nFragment identifier\n\nUses URL, easy to cache\n\
    \nMust query DOM\n\nData-\\* attributes\n\nEasy to read, easy to cache, can \n\
    \nlocate script include snippet\n\nMust query DOM\n\nGlobal variables\n\nEasy\
    \ to read, easy to cache, flexible \n\nargument types, don’t need to query \n\n\
    DOM\n\nGlobal variables\n\nwww.it-ebooks.info"
