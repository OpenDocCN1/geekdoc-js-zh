  md: "**53**\n\n***Outputting HTML***\n\nloaded by that snippet won’t accidentally\
    \ output HTML at the first script include snip-\n\npet’s location.\n\nPREVENTING\
    \ RACE CONDITIONS\n\nThis opens up a potential race condition. Consider the case\
    \ where a publisher wants\n\nto include two Camera widgets on their web page,\
    \ one each for two different prod-\n\nucts. To do this, they’re including two\
    \ separate instances of your script include snip-\n\npet, each of which passes\
    \ a different product ID to the application code. If the second\n\nsnippet is\
    \ somehow loaded and exe-\n\ncuted by the browser before the first,\n\nwhich is\
    \ possible since they’re being\n\nloaded asynchronously, when the appli-\n\ncation\
    \ attempts to output HTML to the\n\npage, it’ll query for elements with the\n\n\
    data-stork-widget attribute and get\n\nthe *first* script include snippet instead\
    \ of\n\nthe second. When the dust settles, this\n\nwill result in each product\
    \ widget get-\n\nting rendered in the opposite order,\n\nand thus at the opposite\
    \ location (see\n\nfigure 3.1).\n\n To remedy this, the data-stork-\n\nwidget\
    \ attribute should additionally\n\nidentify the target product that is to be\n\
    \nrendered. That way you can ensure only\n\nthe matching product is rendered at\n\
    \nthat location. This would turn the exam-\n\nple script include into the following:\n\
    \n<script data-stork-product=\"1337\">\n\n...\n\n</script>\n\nAfterward, instead\
    \ of querying for an arbitrary element with the data-stork-\n\nproduct attribute,\
    \ you’ll look for the element that contains the product ID you’re\n\ntrying to\
    \ render:\n\nfunction appendWidgetMarkup(id, html) {\n\njQuery('script\\[data-stork-product=\"\
    ' + id + '\"\\]')\n\n.removeAttr('data-stork-product')\n\n.before(html);\n\n}\n\
    \nIt’s still a good idea to remove the data-stork-product attribute afterward,\
    \ because\n\nit’s still possible that a publisher could include two script include\
    \ snippets referencing\n\nthe same product ID. If the attribute isn’t removed,\
    \ both products will be rendered at\n\nthe same location. \n\nwidget.js A request\n\
    \nwidget.js B request\n\nwidget.js A response\n\nwidget.js B response\n\nCamera\
    \ Stork servers\n\nPublisher web page\n\nWidget B \n\nrendered\n\nWidget A \n\n\
    rendered\n\nSnippet B\n\nencountered\n\nSnippet A\n\nencountered\n\nFigure 3.1\n\
    \nRace condition: widget A is loaded and \n\nrendered after widget B, despite\
    \ being encountered \n\nfirst in the page.\n\nwww.it-ebooks.info"
