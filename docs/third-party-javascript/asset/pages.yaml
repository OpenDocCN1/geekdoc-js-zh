  md: "**103**\n\n***Cross-origin resource sharing***\n\n\n\nAccess-Control-Max-Age—The\
    \ amount of time (in seconds) that this preflight\n\nrequest should be cached\
    \ for\n\n\n\nAccess-Control-Allow-Credentials—Indicates \n\nwhether \n\nthe \n\
    \nrequested\n\nresource supports credentialed requests (optional)\n\nAfter the\
    \ client receives the response from the server, it sends the *real* request using\n\
    \nthe previously declared HTTP method and headers. Additionally, the preflight\n\
    \nresponse is cached by the browser. While it’s cached (for the duration of Access-\n\
    \nControl-Max-Age), any subsequent requests of the same type won’t invoke the\
    \ over-\n\nhead of an additional preflight request.\n\n Unfortunately, support\
    \ for CORS preflight requests is somewhat limited: they’re\n\nonly implemented\
    \ in Firefox, Safari, and Chrome. Again, we’re bitten by Internet\n\nExplorer,\
    \ which doesn’t currently support preflight requests. Internet Explorer 10\n\n\
    can’t come soon enough. \n\n*4.4.4*\n\n*Browser support*\n\nAll things considered,\
    \ there’s solid support for cross-origin resource sharing among\n\nmodern browsers,\
    \ but unfortunately it’s still a relatively unknown technology among\n\nweb developers.\
    \ We believe that CORS can provide much better tools for cross-domain\n\nAJAX\
    \ and hopefully browsers will continue to improve their support for it. But what\n\
    \nshould you be using today? We highly recommend that you try to use CORS whenever\n\
    \npossible and only fall back to other methods—such as JSONP—when it’s not available.\n\
    \nThat way you’ll always be sure that as browsers continue improving their support\
    \ for\n\nCORS, your application won’t break and that you’ll always be using the\
    \ most well-\n\ndefined technique available.\n\n Table 4.2 shows you which browsers\
    \ and which versions implement the CORS spec-\n\nification (also see http://caniuse.com/cors).\n\
    \nTable 4.2\n\nCORS browser compatibility table \n\nBrowser\n\nSupport CORS?\n\
    \nMozilla Firefox\n\nYes, 3.5 and above.\n\nGoogle Chrome\n\nYes, 3 and above.\n\
    \nApple Safari\n\nYes, 4 and above.\n\nMicrosoft Internet Explorer 8 and 9\n\n\
    Partial—using XDomainRequest, no support for preflight or \n\ncredentialed requests.\n\
    \nMicrosoft Internet Explorer 10\n\nYes.\n\nOpera Desktop\n\nYes, 12 and above.\n\
    \nOpera Mobile\n\nYes, 12 and above.\n\nApple iOS Safari\n\nYes.\n\nGoogle Android\
    \ Browser\n\nYes.\n\nwww.it-ebooks.info"
