  md: "**82**\n\nCHAPTER 4\n\n***Communicating with the server***\n\nJavaScript application\
    \ developers—had access to a well-defined and secure method of\n\ncross-domain\
    \ communication. Fortunately, not so long ago, browser vendors saw the\n\ndemand\
    \ and developed APIs that allow pages from different origins to communicate\n\n\
    with each other in a controlled manner. We’ll cover one of those methods—cross-\n\
    \norigin resource sharing (CORS)—in this chapter.¹\n\n But as is the case with\
    \ most new browser features, they aren’t fully supported in all\n\nbrowsers—and\
    \ CORS is no exception. Because of this, you’ll need to defer to hacks\n\nand\
    \ workarounds. In the next couple of sections, we’ll go over two such workarounds\n\
    \nthat allow you to bypass the same-origin policy: JSON with padding (JSONP) and\
    \ sub-\n\ndomain proxies. Then, at the end of this chapter, we’ll go over CORS\
    \ in depth,\n\nbecause despite limited browser support, it’s the standardized,\
    \ correct way to do cross-\n\ndomain communication. \n\n*4.2*\n\n*JSON with padding\
    \ (JSONP)*\n\n*JSON** with padding*, or *JSONP* for short, is a pattern of usage\
    \ that allows you to initiate\n\ncross-domain HTTP requests from JavaScript while\
    \ bypassing the same-origin policy\n\nrestriction. The term JSONP was coined back\
    \ in 2005 when Bob Ippolito wrote a blog\n\npost² proposing “a new technology\
    \ agnostic standard methodology for the script tag\n\nmethod for cross-domain\
    \ data fetching.” Since then, it has been widely adopted by\n\ndevelopers all\
    \ around the web. Popular JavaScript libraries, such as jQuery, have built-\n\n\
    in JSONP support, and many popular web service APIs (such as Twitter, Google,\
    \ and of\n\ncourse, Disqus) support JSONP responses.\n\n In this section, we’ll\
    \ show you how to use JSONP to circumvent the SOP and make\n\nAJAX\\-like requests\
    \ across domains. Then, at the end, we’ll clue you in to some JSONP\n\nlimitations\
    \ and drawbacks.\n\n*4.2.1*\n\n*Loading JSON via script elements*\n\nAs you’ve\
    \ learned, the same-origin policy has a significant exception: HTML script\n\n\
    elements are waived from SOP checks. That means that your third-party application\n\
    \ncode is free to make HTTP requests to other origins by loading external JavaScript\n\
    \nfiles. JSONP leverages this exception to load data from a different domain.\n\
    \n To understand how JSONP works, let’s first look at an example of retrieving\
    \ a regu-\n\nlar, ordinary JSON document using XmlHttpRequest. Suppose you’re\
    \ making an\n\nXmlHttpRequest to http://thirdpartyjs.com/info.json, which returns\
    \ a JSON docu-\n\nment containing critical information about the book you’re currently\
    \ reading:\n\n{\n\n\"title\": \"Third-party JavaScript\",\n\n\"authors\": \\[\"\
    Anton\", \"Ben\"\\],\n\n\"publisher\": \"Manning\"\n\n}\n\n1 The other, window.postMessage,\
    \ we’ll cover in chapter 5.\n\n2 For Bob’s December 5, 2005, discussion of remote\
    \ JSON (JSONP), see http://bob.pythonmac.org/archives/\n\n2005/12/05/remote-json-jsonp/.\n\
    \nwww.it-ebooks.info"
