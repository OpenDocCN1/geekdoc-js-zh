  md: "**54**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\n*3.1.4*\n\n*Decoupling\
    \ render targets*\n\nSo far, we’ve been talking about loading multiple instances\
    \ of a widget by including\n\nmultiple script include snippets on the same page.\
    \ This is a flexible solution that\n\nworks for widgets like Camera Stork—applications\
    \ that can have multiple instances on\n\nthe page. That said, this implementation\
    \ has a significant inefficiency: the publisher\n\nmust redundantly load your\
    \ application code for each instance of the Camera Stork\n\nwidget, even when\
    \ the code has already been loaded on the page.\n\n To avoid this situation you\
    \ can decouple the target render location from your\n\nscript include snippet\
    \ by having the publisher specify targets separately. This means\n\nyour application\
    \ can render multiple widget instances despite loading your applica-\n\ntion code\
    \ only once.\n\n To do this, again you’ll have publishers use custom data-\\*\
    \ attributes to denote the\n\ntarget render location. But this time these data\
    \ attributes can be placed completely\n\nseparately from the script include snippet.\
    \ The example code in the following listing\n\nspecifies two render locations,\
    \ but uses a single script include snippet.\n\n<div data-stork-product=\"1337\"\
    ></div>\n\n<div data-stork-product=\"2012\"></div>\n\n<script>\n\n(function()\
    \ {\n\nvar script\n\n\\= document.createElement('script');\n\nscript.async = true;\n\
    \nscript.src\n\n\\= 'http://camerastork.com/widget.js';\n\nvar entry = document.getElementsByTagName('script')\\\
    [0\\];\n\nentry.parentNode.insertBefore(script, entry);\n\n})();\n\n</script>\n\
    \nYou’ll notice that the script include snippet doesn’t declare any product identifying\n\
    \nparameters. It doesn’t have to: the product ID parameter is available via the\
    \ data-\n\nstork-product attribute. Your application code merely needs to query\
    \ the DOM for\n\nall instances of the data-stork-product attribute, extract the\
    \ product ID, and render\n\nthe matching product at that location:\n\njQuery('\\\
    [data-stork-product\\]').each(function() {\n\nvar location = jQuery(this);\n\n\
    location.removeAttr('data-stork-product');\n\nvar id = location.attr('data-stork-product');\n\
    \ngetWidgetData(id, function(data) {\n\nrenderWidget(data, location);\n\n});\n\
    \n});\n\nListing 3.3\n\nThe script include snippet with separately defined render\
    \ target locations\n\nwww.it-ebooks.info"
