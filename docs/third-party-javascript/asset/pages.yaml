  md: "**137**\n\n***Third-party cookies***\n\nTable 6.3\n\nP3P values and their descriptions\n\
    \nValue\n\nDescription\n\nADM\n\nInformation may be used for the technical support\
    \ of the website and its computer system.\n\nDEV\n\nInformation may be used to\
    \ enhance, evaluate, or otherwise review the site, service, prod-\n\nuct, or market.\n\
    \nPSA\n\nInformation may be used to create or build a record of a particular individual\
    \ or computer \n\nthat’s tied to a pseudonymous identifier, without tying identified\
    \ data to the record.\n\nCOM\n\nInformation about the computer system that the\
    \ individual is using to access the network—\n\nsuch as the IP address, domain\
    \ name, browser type, or operating system.\n\nOUR\n\nOurselves and/or entities\
    \ acting as our agents or entities for whom we’re acting as an \n\nagent.\n\n\
    STP\n\nInformation is retained to meet the stated purpose.\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_161_0.png)\n\
    \nFigure 6.3\n\nDefault privacy \n\nsettings in Internet Explorer 8. \n\nBy default,\
    \ third-party cookies \n\nwithout a compact privacy policy \n\nare blocked.\n\n\
    www.it-ebooks.info"
