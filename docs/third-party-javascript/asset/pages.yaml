  md: "**240**\n\nCHAPTER 10\n\n***Debugging and testing***\n\nMOCKING JAVASCRIPT\
    \ OBJECTS WITH SINON.JS\n\nIn these code examples, we\n\nmanually created our\
    \ own stub functions, but you don’t have to do the same\n\nin your projects. Sinon.JS\
    \ is a helpful JavaScript library that provides stubs,\n\nmocks, spies, and other\
    \ test objects that will greatly simplify your testing code.\n\nCheck it out at\
    \ http://sinonjs.org/.\n\nYou might’ve noticed that in listing 10.1 and in other\
    \ prior testing examples in this\n\nchapter, we’ve been doing a lot of work manually.\
    \ Our test functions don’t have asser-\n\ntions—predicates indicating that something\
    \ *must* be true—or even a test runner that\n\ncombines these tests together,\
    \ runs them, and presents the results in a nice UI. We did\n\nthis to show you\
    \ that automatic tests aren’t magic; they’re just programs that make\n\nsure that\
    \ other programs work as expected. We’ll look at some JavaScript testing\n\nframeworks\
    \ shortly, but first let’s talk about one last testing category: regression tests.\n\
    \nTAKING YOUR INTEGRATION TESTS TO A HIGHER LEVEL WITH SELENIUM\n\nSo far,\n\n\
    we’ve explored writing integration tests that use strictly JavaScript code. But\n\
    \nwhat if you could write tests that open a web browser window, load your appli-\n\
    \ncation, and interact with it just as a real user would? This is possible using\n\
    \nwhat are known as *browser automation frameworks*. We recommend you investi-\n\
    \ngate using Selenium—perhaps the most popular and feature-complete\n\nbrowser\
    \ automation tool. Selenium supports most major browsers and allows\n\nyou to\
    \ write tests in a number of popular programming languages including\n\nPython,\
    \ Ruby, PHP, Java, Perl, and Groovy. Learn more about Selenium at\n\nhttp://seleniumhq.org/.\
    \ \n\nREGRESSION TESTS\n\nIn the previous section, we were dealing with a nasty\
    \ bug when our application didn’t\n\nwork correctly on pages that overwrite Object.toJSON.\
    \ Sure, you’ve fixed the bug, but\n\nthere’s still a remaining task: to make sure\
    \ that this bug won’t get re-introduced in the\n\nfuture with a new feature or\
    \ other code modification. To prevent this from happen-\n\ning, you need to write\
    \ a *regression test*. Regression tests are unit or integration tests that\n\n\
    create an environment that led to the bug and make sure that the bug doesn’t appear\n\
    \nagain. A good regression test for our bug would be to load the Camera Stork\
    \ widget\n\non a “broken” page and verify that Stork.JSON still correctly serializes\
    \ and parses\n\nJSON data.\n\n Instead of writing an ad hoc regression test like\
    \ we’ve done in the previous sec-\n\ntions, we’ll use two helpful JavaScript testing\
    \ frameworks: QUnit and Hiro. We’ll start\n\nwith perhaps the most popular testing\
    \ framework today: QUnit. \n\n*10.2.2 Writing regression tests using QUnit*\n\n\
    QUnit is a JavaScript testing framework that was created for the jQuery project\
    \ and is\n\nused to test the jQuery codebase and associated plugins. But don’t\
    \ be mistaken:\n\nQUnit is simple, flexible, and capable of testing any generic\
    \ JavaScript code, including\n\nthird-party widgets like the Camera Stork application.\
    \ To use QUnit, you need to\n\nwww.it-ebooks.info"
