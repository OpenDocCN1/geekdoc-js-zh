  md: "**47**\n\n***Summary***\n\n Dynamically requesting data from the server (or\
    \ submitting data to the server) is\n\nan advanced subject, and one we’ll get\
    \ into shortly in chapter 4. For now, let’s stick\n\nwith the naive approach of\
    \ embedding the entire Camera Stork catalog inside the\n\napplication code. \n\
    \n*2.7*\n\n*Summary*\n\nThere’s a lot of up-front work to be done before you can\
    \ render a widget on a pub-\n\nlisher’s page. First, you’ve got to distribute\
    \ your script include snippet, the entry point\n\nfor loading the application.\
    \ You then need to load any dependencies, like additional\n\nJavaScript files,\
    \ or libraries. Last, you need to pass identifying information from the\n\nhost\
    \ page to the application, so that you can properly retrieve and submit data for\
    \ the\n\ncorrect object.\n\n You’ve seen how there are a variety of techniques\
    \ for implementing each of these\n\nfirst steps. They vary in complexity and scope.\
    \ It’s up to you to choose the techniques\n\nthat best suit your application.\n\
    \n At this point, product widget development is well under way. You’ve given your\n\
    \nloyal publishers a script include snippet that they’ve since added to their\
    \ HTML source\n\ncode. That snippet is loading your initial script file, widget.js,\
    \ onto their web page.\n\nThat initial script has loaded all its dependent JavaScript\
    \ files and libraries. The script\n\nhas also extracted the product ID from the\
    \ script include snippet, and used that ID to\n\nextract the corresponding product\
    \ information from the embedded catalog object.\n\n All this code is executing\
    \ on the publisher’s page, but there’s nothing to see yet.\n\nThe widget still\
    \ hasn’t been rendered. Luckily, this is the focus of the next chapter,\n\n“Rendering\
    \ HTML and CSS.”\n\nwww.it-ebooks.info"
