  md: "**63**\n\n***Defensive HTML and CSS***\n\n<div class=\"stork-container\">\n\
    \n... <!-- Stork content ->\n\n</div>\n\n</div>\n\nAdditionally, let’s say the\
    \ page has the following CSS, where the first rule is defined by\n\nthe publisher,\
    \ and the second rule (targeting stork-container) is added by your\n\nthird-party\
    \ script:\n\n/\\* Publisher \\*/\n\n#page div {\n\nbackground-color: green;\n\n\
    }\n\n/\\* Camera Stork \\*/\n\n.stork-container {\n\nbackground-color: blue;\n\
    \n}\n\nNow, what color will .stork-container have? The answer might shock and\
    \ appall\n\nyou: *green*. In this simple example, the publisher rule (#page div)\
    \ takes priority over\n\nyour third-party application’s class rule (.stork-container).\
    \ This happens because\n\nthe browser weighs rules containing IDs higher than\
    \ those that target classes or attri-\n\nbutes.\n\nCSS RULE PRIORITIES\n\nThe\
    \ W3C CSS specification outlines how browsers are meant to prioritize different\
    \ rule\n\ntypes. Here’s a list of these rule types, ordered from highest priority\
    \ to lowest:\n\n1\n\nInline styles (style=\"...\")\n\n2\n\nIDs\n\n3\n\nClasses,\
    \ attributes, and pseudo-classes (:focus, :hover)\n\n4\n\nElements (div, span,\
    \ and so on) and pseudo-elements (:before, :after)\n\nAccording to this chart,\
    \ inline styles are weighed above all subsequent rule types: IDs,\n\nclasses,\
    \ and elements. This continues logically down the list, with IDs prioritized\n\
    \nhigher than classes and elements, and so on. There’s one exception to this list:\
    \ prop-\n\nerties tagged with the !important keyword take highest priority. But\
    \ note that the\n\n!important keyword affects a single property within a rule,\
    \ not the entire rule.\n\n What happens when you have multiple CSS rules of the\
    \ same weight, each of which\n\ncould conceivably affect the same element? Let’s\
    \ take a look at an example:\n\n<div class=\"stork-container\">\n\n<span class=\"\
    stork-msg\">Eat your vegetables!</span>\n\n</div>\n\n<style>\n\n.stork-container\n\
    \n{ background-color: blue; }\n\n.stork-container span\n\n{ background-color:\
    \ red; }\n\n.stork-container .stork-msg { background-color: yellow; }\n\n</style>\n\
    \nwww.it-ebooks.info"
