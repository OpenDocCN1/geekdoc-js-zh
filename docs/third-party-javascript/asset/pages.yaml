  md: "**233**\n\n***Debugging***\n\nCOMING SOON: JAVASCRIPT SOURCE MAPS\n\nSource\
    \ Maps is a bleeding-edge\n\nbrowser feature that allows the debugger to map combined\
    \ and minified files\n\nto their original unminified counterparts. In browsers\
    \ that support it (cur-\n\nrently only Chrome), it makes debugging production\
    \ code possible without\n\nresorting to proxies or feature switches. To learn\
    \ more, we recommend this\n\narticle from HTML5 Rocks: http://mng.bz/JENs.\n\n\
    At this point you’re now able to access development files when browsing the offending\n\
    \npublisher’s page. Now it’s time to roll up your sleeves and actually debug the\
    \ issue. In\n\nthis next section, we’ll show you how to step through the code\
    \ while monitoring your\n\nprogram’s state to find and defeat nontrivial bugs.\
    \ \n\n*10.1.2 Stepping through the code*\n\nIn the dark days of JavaScript programming,\
    \ developers had only one way of debug-\n\nging JavaScript code—through good ol’\
    \ alert messages. Compared to debugging\n\ntools available for other major programming\
    \ languages, JavaScript used to have the\n\nmost terrible development platform—bar\
    \ none. Fortunately, browser vendors realized\n\nthat JavaScript developers needed\
    \ better tools, and today all modern browsers come\n\nwith amazingly powerful\
    \ built-in inspectors, profilers, and debuggers. In this section,\n\nwe’ll concentrate\
    \ on debuggers—programs that let you examine JavaScript code while\n\nit’s executing\
    \ and use them to step through the live code.\n\nSETTING BREAKPOINTS\n\nLet’s\
    \ go back to your Camera Stork bug: users can’t publish reviews on a particular\n\
    \npublisher’s website and you don’t have any clues as to what could be causing\
    \ this. Let’s\n\npresume that you’ve managed to replicate this behavior on the\
    \ publisher’s website.\n\nYou can now run unminified and unobfuscated code, so\
    \ you’ll probably want to set a\n\n*breakpoint*—a special statement telling the\
    \ debugger where to pause its execution—\n\nnear code that you suspect is causing\
    \ the bug. There’s no single rule that tells where\n\nto place your breakpoints;\
    \ you’ll have to make an educated guess. With the Camera\n\nStork bug we’re investigating,\
    \ it makes sense to place a breakpoint at some point\n\nbetween where the user\
    \ review is submitted and where it’s sent to the server.\n\n Let’s pretend that\
    \ the following code receives user review data from the widget’s\n\nHTML form\
    \ and sends it through an easyXDM cross-domain channel that has already\n\nbeen\
    \ initialized:\n\nStork.prototype.submitReview =\n\nfunction (data, onSuccess,\
    \ onFailure) {\n\nif (!data.reviewText) {\n\nreturn;\n\n}\n\nvar channel = this.getChannel();\n\
    \nvar message = JSON.stringify(data);\n\nchannel.submit(message, onSuccess, onFailure);\n\
    \n};\n\n**If review was empty, return **\n\n**without sending any data.**\n\n\
    **A wrapper**\n\n**around**\n\n**easyXDM-**\n\n**powered**\n\n**cross-domain**\n\
    \n**channel.**\n\n**Turn JavaScript **\n\n**object into string. **\n\n**Usually,\
    \ easyXDM **\n\n**handles these things **\n\n**but we made it **\n\n**explicit\
    \ for the **\n\n**example’s sake.**\n\nwww.it-ebooks.info"
