  md: "**13**\n\n***Developing a bare-bones widget***\n\nto the browser. In that case,\
    \ the browser downloads the HTML from Jill’s server and\n\ndisplays the result\
    \ to the user—no JavaScript is executed.\n\n But it’s arguably better to have\
    \ the website visitor perform this work in the browser,\n\nfor a few reasons:\n\
    \nCode executing in the browser is code that’s not executing on the integrator’s\n\
    \nservers, which can lead to bandwidth and CPU savings.\n\nIt’s faster—the server\
    \ implementation has to wait for the response from Face-\n\nbook’s API before\
    \ showing any content.\n\nSome websites are completely static, such that client-side\
    \ JavaScript is their only\n\nmeans of accessing a web service API.\n\nAN API\
    \ FOR EVERY SEASON\n\nThis example we just covered might be regarded\n\nas a niche\
    \ use case, but this is just one possible application. Facebook is just a\n\n\
    single web service API provider, but the reality is that there are thousands of\n\
    \npopular APIs, all of which provide access to varying data and/or functionality.\n\
    \nBesides social networking applications like Facebook, Twitter, and LinkedIn,\n\
    \nthere are publishing platforms like Blogger and WordPress, or search applica-\n\
    \ntions like Google and Bing, all of which provide varying degrees of access to\n\
    \ntheir data via APIs.\n\nMany web services—large and small—offer APIs. But not\
    \ all of them have gone the\n\nextra mile of providing a JavaScript library for\
    \ client-side access. This matters because\n\nJavaScript in the browser is the\
    \ single largest development platform: it’s supported on\n\nevery website, in\
    \ every browser. If you or your organization develops or maintains a\n\nweb service\
    \ API, and you want to reach the largest number of possible integrators pos-\n\
    \nsible, you owe it to yourself to provide developers with a client-side API wrapper—a\n\
    \ntopic we’ll discuss in detail later in this book. \n\n*1.3*\n\n*Developing a\
    \ bare-bones widget*\n\nWe’ve explored some popular uses for third-party JavaScript.\
    \ You’ve seen how it can\n\nbe used in the development of widgets, in analytics\
    \ gathering, and as a client-side\n\nwrapper for web service APIs. Hopefully this\
    \ has given you an idea of what’s possible\n\nwhen you’re designing your own third-party\
    \ application.\n\n Now that you’ve walked through some real-world exam-\n\nples,\
    \ it’s time to develop something yourself. Let’s start with\n\nsomething fairly\
    \ simple: a bare-bones embedded widget.\n\n Pretend for a moment that you run\
    \ a website that provides\n\nup-to-the-minute local weather information. Traditionally,\n\
    \nusers visit your website directly in order to get the latest\n\nweather news.\
    \ But in order to reach a wider audience, you’ve\n\ndecided to go a step further\
    \ and give users access to your data\n\noutside of your website. You’ll do this\
    \ by providing an embed-\n\ndable widget version of your service, depicted in\
    \ figure 1.7.\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_37_0.png)\n\nFigure\
    \ 1.7\n\nThe weather \n\nwidget as it will appear on \n\na publisher’s page\n\n\
    www.it-ebooks.info"
