  md: "**89**\n\n***Subdomain proxies***\n\n*4.3.1*\n\n*Changing a document’s origin\
    \ using document.domain*\n\nFirst, how do you change a document’s origin? Every\
    \ DOM core document object has a\n\nproperty called domain. By default, it contains\
    \ the hostname part of the current ori-\n\ngin. You can change the current document’s\
    \ origin by assigning a new value to this\n\nproperty. For example, to have a\
    \ page hosted on sub.example.com change its origin\n\nto example.com, you’d have\
    \ that page execute the following JavaScript:\n\ndocument.domain = 'example.com';\n\
    \nWeb browser\n\npublisher.com\n\npublisher.com\n\npublisher.com\n\npublisher.com\n\
    \nthirdparty.com\n\nVirtual server passes\n\nrequest on to the\n\nreal thirdparty.com\n\
    \nVirtual host located \n\nat publisher.com\n\nData is returned\n\nBrowser thinks\
    \ data came \n\nfrom publisher.com!\n\nScript on page requests data \n\nfrom thirdparty.publisher.com\n\
    \nBrowser requests a \n\npage from publisher.com\n\nthirdparty.com\n\nWeb browser\n\
    \nWeb browser\n\nWeb browser\n\nFigure 4.4\n\nUsing a virtual host to proxy requests\
    \ to thirdparty.publisher.com on \n\nto thirdparty.com, hiding the true origin\
    \ from the browser\n\nwww.it-ebooks.info"
