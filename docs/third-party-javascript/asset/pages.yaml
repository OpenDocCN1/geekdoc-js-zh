  md: "**186**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\nid:\
    \ '1337',\n\ndom: '.stork-widget-location-class'\n\n});\n\n});\n\n</script>\n\n\
    In this example, the first argument to Stork.init is the desired version string,\
    \ and\n\nthe callback function becomes the second argument. You’ll notice that\
    \ the callback\n\nfunction now accepts a single argument, S, which is actually\
    \ a reference to the Stork\n\nSDK oriented at the requested version. Inside the\
    \ callback function, the publisher calls\n\nthe newer version of Stork.productWidget,\
    \ which accepts a CSS selector for the DOM\n\ntarget location. You’ll also notice\
    \ that the script URL doesn’t have a version embed-\n\nded; the versioning is\
    \ handled only via Stork.init.\n\n Let’s implement this new versioning behavior\
    \ for Stork.init. Here’s a modified ver-\n\nsion of sdk.js, whose public init\
    \ function now accepts an optional version parameter.\n\nStork.instances = {};\n\
    \nStork.callbackQueue = {};\n\nStork.init = function(version, callback) {\n\n\
    if (typeof version === 'function') {\n\ncallback = version;\n\nversion = '1.1';\n\
    \n}\n\nif (Stork.instances\\[version\\] !== undefined) {\n\ncallback(Stork.instances\\\
    [version\\]);\n\nreturn;\n\n} else if (Stork.callbackQueue\\[version\\] !== undefined)\
    \ {\n\nStork.callbackQueue.push(callback);\n\nreturn;\n\n}\n\nvar file;\n\nswitch\
    \ (version) {\n\ncase '1.0': file = 'lib.1\\_0.js'; break;\n\ncase '1.1': file\
    \ = 'lib.1\\_1.js'; break;\n\ndefault:\n\nthrow \"Unknown SDK version: \" + version;\n\
    \n}\n\nStork.callbackQueue\\[version\\] = \\[callback\\];\n\nfile = 'http://camerastork.com/sdk/'\
    \ + file;\n\nloadScript(file, function() {\n\nfor (var i = 0; i < callbackQueue;\
    \ i++) {\n\nStork.callbackQueue\\[i\\](Stork.instances\\[version\\]);\n\n}\n\n\
    });\n\n};\n\nThe first thing this function does is check to see whether the first\
    \ argument is a\n\nfunction. If it’s a function, then the latest version of the\
    \ SDK is used by default (1.1).\n\nListing 8.6\n\nModifying **Stork.init** to\
    \ accept a version parameter\n\n**If version isn’t **\n\n**specified, use **\n\
    \n**latest**\n\n**If requested**\n\n**version is**\n\n**already loaded,**\n\n\
    **invoke callback**\n\n**and exit**\n\n**This version is **\n\n**currently loading,\
    \ but **\n\n**not ready—queue **\n\n**callback and exit**\n\n**Determine**\n\n\
    **which library**\n\n**to load**\n\n**Queue callback **\n\n**function until **\n\
    \n**library is ready**\n\n**When ready,**\n\n**invoke all**\n\n**queued**\n\n\
    **callbacks**\n\nwww.it-ebooks.info"
