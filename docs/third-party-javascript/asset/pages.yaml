  md: "**62**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\n<style>\n\n.container\
    \ { width: 200px; height: 200px; }\n\n</style>\n\nThis might be perfectly appropriate\
    \ for a regular stay-at-home application, but for a\n\nthird-party app, it’s a\
    \ complete no-no. The reason? Such a generic class name has a\n\ngood chance of\
    \ already being used by the parent page. If you introduce this style rule,\n\n\
    you might override an existing style rule put in place by the publisher and ruin\
    \ their\n\nsite layout. Or, on the flip side, their rule might override yours\
    \ and resize your widget\n\ninadvertently.\n\n The solution? Prefixing all of\
    \ your class names (and other attributes) with an iden-\n\ntifier unique to your\
    \ application—a *namespace*. In the case of the Stork widget, the pre-\n\nvious\
    \ markup should be amended to look like this:\n\n<div class=\"stork-container\"\
    >\n\n...\n\n</div>\n\n<style>\n\n.stork-container { width: 200px; height: 200px\
    \ }\n\n</style>\n\nIf this looks familiar, it should. In chapter 2 you namespaced\
    \ your JavaScript code so\n\nthat you don’t declare global objects that conflict\
    \ with code running on the parent\n\npage. This is the same idea, and it extends\
    \ to every piece of HTML you insert into the\n\npage: IDs, classes, data-\\* attributes,\
    \ form names, and so on.\n\n Namespacing HTML and CSS is a must for any third-party\
    \ application that renders\n\ndirectly to the publisher’s page. This isn’t just\
    \ necessary for preventing conflicting CSS\n\nrules; it’s also conceivable that\
    \ the parent page has JavaScript that’s querying the DOM\n\nfor elements whose\
    \ identifying properties might match your own. Be rigorous in\n\nnamespacing *everything*\
    \ you put on the DOM!\n\n*3.3.2*\n\n*CSS specificity*\n\nIt’s important to note\
    \ that, though helpful, namespacing your HTML and CSS only\n\nprevents cases where\
    \ the publisher is using styles or queries that reference attributes\n\nwith the\
    \ same name as yours. Unfortunately, your widget can still conflict with styles\n\
    \ndefined by the parent page, even if their CSS uses IDs, class names, and attributes\
    \ that\n\ndon’t directly reference your elements. This is because some CSS rules\
    \ are weighed\n\nmore heavily by the browser, and can take precedence over seemingly\
    \ unrelated rules\n\nyou might define. This phenomenon is referred to as *CSS**\
    \ specificity*, and you’ll need to\n\nunderstand it before you can safely render\
    \ elements on the publisher’s page.\n\n Let’s go back to the container example\
    \ from the previous section on namespaces.\n\nSuppose the publisher’s HTML has\
    \ a top-level DIV that wraps all their content, with an\n\nID of page:\n\n<div\
    \ id=\"page\">\n\n... <!-- Publisher content ->\n\nwww.it-ebooks.info"
