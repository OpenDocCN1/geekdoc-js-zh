  md: "**200**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\n But\
    \ that doesn’t mean that Origin checking is a bad idea. What these countermea-\n\
    \nsures do is prevent a web publisher (loading your SDK) from posing as another\
    \ pub-\n\nlisher, because they can’t forge this header used by regular visitors\
    \ to their website. In\n\nother words, although you can’t stop a malicious client,\
    \ you can stop a malicious\n\n*website*. Afterward, your API will have to rely\
    \ on reactionary server-side measures like IP\n\nblocking or rate limiting to\
    \ deal with individual abusers. \n\n*8.3.4*\n\n*User authorization and OAuth*\n\
    \nIf you recall, the Camera Stork web service API that we defined earlier consisted\n\
    \npurely of methods that return public data: products and user reviews. Because\
    \ this\n\ndata is available in HTML form on the public camerastork.com website,\
    \ there’s no\n\ngreat danger to exposing that data publicly in a form that’s easier\
    \ to consume progra-\n\nmatically (JSON).\n\n But what happens when you want to\
    \ expose an API method that either fetches or\n\nmodifies private or otherwise\
    \ sensitive data? Let’s suppose that you wanted to add an\n\nendpoint to your\
    \ API that allows publishers to submit reviews on behalf of users (see\n\ntable\
    \ 8.2).\n\nThe final parameter listed, user\\_id, needs some explanation. Obviously\
    \ it doesn’t\n\nmake sense for an arbitrary publisher to submit reviews on behalf\
    \ of a user. If that\n\nwere the case, our friends at Mikon (totally a real camera\
    \ company, we swear) would\n\ncreate millions of reviews that are uncharacteristically\
    \ positive regarding their camera\n\nproducts. Needless to say, that would spell\
    \ a quick end for camerastork.com’s credibil-\n\nity, and surely crater the business.\n\
    \n This also means that if a publisher uses the SDK to cause a visitor’s browser\
    \ to make\n\na request to this endpoint, the API shouldn’t assume that the visitor’s\
    \ existing session\n\n(cookies) with camerastork.com authorizes the publisher\
    \ to create a review on their\n\nbehalf. Otherwise, Mikon could merely host some\
    \ JavaScript code on their web page\n\nthat loads your SDK and creates a new Camera\
    \ Stork review whenever somebody\n\nrequests that page with their browser.\n\n\
    \ What you need is a way for the publisher to request authorization from the browser\n\
    \nuser to perform actions on their behalf. Today, this is solved by *OAuth*, which\
    \ is an\n\nopen standard for authorizing third parties to communicate with a web\
    \ service. In the\n\nbriefest sense, OAuth describes a facility for providing\
    \ publishers with endpoints that\n\nissue private access tokens which encapsulate\
    \ a user’s authorization to perform\n\nactions on their behalf. These access tokens\
    \ are then sent as parameters with a request\n\nTable 8.2\n\nA new addition to\
    \ the Camera Stork API\n\nURL endpoint\n\nReturns\n\nParameters\n\nreviews/submit\n\
    \nSubmit a new user review \n\nfor a product\n\nscore—The rating assigned to the\
    \ product\n\nmessage—The review text\n\nuser\\_id—The user submitting the review\n\
    \nwww.it-ebooks.info"
