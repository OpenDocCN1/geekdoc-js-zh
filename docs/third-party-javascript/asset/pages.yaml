  md: "**42**\n\nCHAPTER 2\n\n***Distributing and loading your application***\n\n\
    \ We’ve looked at two techniques for passing parameters to your script. One passes\n\
    \nthose parameters to the server; the other is strictly available on the client.\
    \ We could\n\nstop here, and continue with developing the rest of the widget.\
    \ But we’ll cover some\n\nadditional techniques that may better suit your tastes.\
    \ \n\n*2.5.3*\n\n*Using custom data attributes*\n\nAnother technique for passing\
    \ parameters is to store them as part of the script include\n\nsnippet as HTML5\
    \ custom data attributes (often known as *data-\\* attributes*). In the case\n\
    \nof the Stork widget, this means storing the product ID as a custom attribute\
    \ on the\n\n<script> tag itself.\n\n Let’s take a look at the amended Camera Stork\
    \ code.\n\n<script* data-stork-product-id=\"1234\"*\\>\n\n(function() {\n\nvar\
    \ script = document.createElement('script');\n\nscript.async = true;\n\nscript.src\n\
    \n\\= 'http://camerastork.com/widget.js';\n\nvar entry = document.getElementsByTagName('script')\\\
    [0\\];\n\nentry.parentNode.insertBefore(script, entry);\n\n})();\n\n</script>\n\
    \nYou can see that we’ve added an attribute to the script include snippet, named\
    \ data-\n\nstork-product-id. This attribute contains the product ID. The name\
    \ of the data-\\*\n\nattribute is prefixed with *stork* so that it’s less likely\
    \ to conflict with other JavaScript\n\ncode.\n\nWHAT ARE DATA-\\* ATTRIBUTES?\n\
    \nHTML5 introduces a new feature, data-\\* attri-\n\nbutes, which are custom attributes\
    \ for embedding data in HTML elements.\n\nThey’re simple to use; any attribute\
    \ prefixed with the data- token is consid-\n\nered a custom attribute and ignored\
    \ by the browser. Data attributes are sup-\n\nported by nearly every browser;\
    \ even older browsers that don’t explicitly\n\nrecognize data-\\* attributes work\
    \ correctly because they ignore unknown attri-\n\nbutes by default.\n\nNext up,\
    \ your third-party application code needs to query the DOM to locate the script\n\
    \nelement containing this attribute. This should feel similar to the examples\
    \ from the\n\nquery string and fragment identifier techniques.\n\nfunction getProductId()\
    \ {\n\nvar scripts = document.getElementsByTagName('script');\n\nvar id;\n\nfor\
    \ (var i = 0; i < scripts.length; i++) {\n\nListing 2.8\n\nEmbedding the product\
    \ ID in custom data attributes\n\nListing 2.9\n\nLocating and extracting the **data-stork-product-id**\
    \ attribute value\n\nwww.it-ebooks.info"
