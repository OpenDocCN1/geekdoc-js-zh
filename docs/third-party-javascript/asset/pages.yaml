  md: '**108**


    CHAPTER 5


    ***Cross-domain iframe messaging***


    Window {


    void postMessage(any message, string targetOrigin)


    }


    With this signature in mind,² you can now send your first message. Here’s a quick


    example where the message body is *Hello, World!*, the target origin is thirdpartyjs.com,


    and the Window object is referenced by a variable win:


    win.postMessage(''Hello, World!'', ''http://thirdpartyjs.com/'');


    The definition of origin here is exactly the same as in chapter 4—a combination
    of


    protocol, hostname, and port that uniquely identifies the host you’re trying to
    com-


    municate with. The target’s origin value defines a filter for the browser to use
    to select


    recipients for your message. Messages are delivered to the recipient window only
    if the


    recipient’s origin value matches exactly the value specified in the window.post-


    Message call. Otherwise, the browser will throw an exception and your message
    will go


    straight to /dev/null.


    WILDCARD ORIGINS


    If you don’t know the origin value of your postMessage


    recipient (or you don’t care), you can set the second parameter to an asterisk


    (\*) wildcard. This will cause postMessage to skip origin checks when sending


    cross-domain messages. Of course, you should use this wildcard approach only


    when you’re absolutely certain that it’s acceptable for any document to receive


    your message. Always keep in mind that browser windows and iframes can be


    redirected at any time; it’s possible that the document you trust can be


    changed to some other random document without you even knowing about it.


    Initially, window.postMessage API implementations only allowed you to send string


    messages. This meant that any complex data structures had to be serialized into


    strings (JSON) in order to transmit them as messages. But the latest versions
    of mod-


    ern browsers allow you to pass a broad variety of data objects natively. Browsers
    auto-


    matically serialize such objects using what’s called the *structured clone algorithm*—a
    new


    algorithm defined by the HTML5 specification that helps with serializing complex


    JavaScript objects.


    JSON VERSUS THE STRUCTURED CLONE ALGORITHM


    Though JSON is the de facto


    standard for serializing JavaScript objects into strings (and vice versa), it
    can’t


    convert complicated data types like RegExp, Blob, File, and ImageData. The


    structured clone algorithm was designed to handle these complex cases. The


    authors behind the implementation also state that, in some circumstances,


    the structured clone algorithm may be more efficient than JSON serialization.


    But what JSON loses in flexibility and performance, it gains in compatibil-


    ity. The structured clone algorithm isn’t implemented in all browsers—


    including IE8 and IE9—whereas any browser can serialize and parse JSON. For


    this reason we advocate using JSON in conjunction with window.postMessage.


    2 The window.postMessage signature above is written using Web IDL, a variant of
    IDL (interface decision


    language) used by the W3C to define scriptable interfaces in web browsers. See
    http://www.w3.org/TR/


    WebIDL/.


    www.it-ebooks.info'
