  md: "**138**\n\nCHAPTER 6\n\n***Authentication and sessions***\n\nTHE STATE OF THE\
    \ P3P PROTOCOL\n\nDespite becoming a W3C recommendation\n\nin 2002, only Internet\
    \ Explorer actually implements the P3P protocol, and\n\ndevelopment on the specification\
    \ has since ceased. For these reasons, many\n\nconsider P3P to be “dead,” and\
    \ many popular websites don’t provide valid\n\nP3P headers. Regardless of how\
    \ you feel about P3P headers, the fact is that if\n\nyou plan to use third-party\
    \ cookies with Internet Explorer, you’ll need to\n\ninvestigate using them.\n\n\
    When you’ve configured your servers to return a valid P3P header for your resources,\n\
    \nInternet Explorer will allow users to write and transmit third-party cookies\
    \ to your\n\ndomain under its default security setting. This is extremely valuable\
    \ because most\n\nusers don’t change their default browser settings. If using\
    \ P3P headers sounds intimi-\n\ndating, the good news is that you’ll likely only\
    \ have to perform this configuration once\n\n(or whenever your application’s privacy\
    \ policies change). \n\n*6.1.4*\n\n*Detecting when cookies are unavailable*\n\n\
    We’ve described a number of circumstances where third-party cookies are blocked\
    \ by\n\nthe browser. But this doomsday scenario doesn’t happen all of the time.\
    \ Many browser\n\nusers out there have third-party cookies enabled, usually by\
    \ default. You need to be\n\nable to accurately detect when a user can and can’t\
    \ set cookies so that you can take the\n\nappropriate measures. If they can set\
    \ cookies, use the tried-and-true session pattern\n\noutlined in section 6.1.1.\
    \ If they can’t set cookies, then you’ll have to use one of the\n\nfallback techniques\
    \ we’ll present shortly.\n\n In order to test whether the browser can properly\
    \ set cookies, you’ll need an\n\niframe element that’s pointed to a URL on your\
    \ domain. This can be an existing\n\niframe—like the one you used as a communications\
    \ channel in the last chapter—but\n\nfor example purposes, we’ll create a new\
    \ iframe whose sole purpose is to tell you\n\nwhether third-party cookies are\
    \ enabled.\n\n Let’s suppose you’re using the easyXDM library to communicate with\
    \ this iframe.\n\nIn your consumer JavaScript code (executing on the publisher’s\
    \ website), you’d\n\ncreate a new easyXDM RPC interface that expects a single\
    \ remote method, testCan-\n\nWriteCookies.²\n\n Here’s the code that makes it\
    \ happen:\n\nvar rpc = new easyXDM.Rpc(\n\n{\n\nremote: \"http://camerastork.com/cookies.html\"\
    \n\n},\n\n{\n\nremote: {\n\ntestCanWriteCookies: {}\n\n}\n\n}\n\n);\n\n2 Hopefully,\
    \ easyXDM is still fresh in your mind from the last chapter. If this example code\
    \ doesn’t make sense,\n\nhead back to section 5.3 for a refresher.\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 162
- img_proc: true
  md: "**139**\n\n***Third-party cookies***\n\nAnd inside cookies.html, which is the\
    \ URL loaded by the iframe, you’ll need to define\n\na corresponding RPC object\
    \ that exposes testCanWriteCookies, a global function\n\n(within the iframe) that\
    \ we’ll implement in a moment:\n\nvar rpc = new easyXDM.Rpc({},\n\n{\n\nlocal:\
    \ {\n\ntestCanWriteCookies: testCanWriteCookies\n\n}\n\n}\n\n);\n\nLast, you need\
    \ to implement the testCanWriteCookies function as shown in\n\nlisting 6.1. It\
    \ works by attempting to create a new cookie on your domain (cameras-\n\ntork.com)\
    \ using document.cookie. Then it tries to read back all the cookies that are\n\
    \non the domain and looks for the cookie that was just set. If the cookie is present—huz-\n\
    \nzah, the browser has third-party cookies enabled. If the cookie isn’t there,\
    \ the browser\n\ndoesn’t have third-party cookies enabled.\n\nfunction testCanWriteCookies()\
    \ {\n\ndocument.cookie = 'test=1';\n\nvar allCookies = document.cookie.replace('\
    \ ', '');\n\nallCookies = allCookies.split(';');\n\nfor (var i = 0; i < allCookies.length;\
    \ i++) {\n\nif (allCookies\\[i\\].indexOf('test=1') !== -1) {\n\nreturn true;\n\
    \n}\n\n}\n\nreturn false;\n\n}\n\nFigure 6.4 illustrates this implementation.\n\
    \n Alternatively, you could have the HTTP response that serves the iframe set\
    \ this\n\nsame test cookie (using the Cookie-set header). Afterward, you’d strictly\
    \ have to\n\ncheck for the presence of this test cookie in your JavaScript code.\
    \ But having to muck\n\nwith HTTP headers is added complexity to what’s already\
    \ a simple operation. We advo-\n\ncate sticking with the pure JavaScript solution.\n\
    \nHTML5 LOCALSTORAGE AND THIRD-PARTY COOKIES\n\nHTML5 introduces a set of\n\n\
    JavaScript APIs for persisting data on the user’s browser. The best-known of\n\
    \nthese, localStorage, stores data according to the current origin. It’s not\n\
    \nunreasonable to think, then, that you can use localStorage as an alternative\n\
    \nto cookies for storing the user’s session identifier when third-party cookies\
    \ are\n\ndisabled in the user’s browser.\n\nAt one point, this would’ve been successful.\
    \ But browser vendors have\n\nsince identified this workaround as a privacy vulnerability,\
    \ and now disable\n\nlocalStorage when third-party cookies are disabled. Nice\
    \ try, though!\n\nListing 6.1\n\nJavaScript to test whether cookies are enabled\n\
    \n**Attempt to write test **\n\n**cookie by assigning to **\n\n**document.cookie**\n\
    \n**Get list of**\n\n**all cookies**\n\n**available on**\n\n**current URL**\n\n\
    **If one of these **\n\n**cookies matches **\n\n**test cookie, it was **\n\n**successfully\
    \ written**\n\nwww.it-ebooks.info"
