  md: "**147**\n\n***Securing sessions***\n\nwants to perform an action that requires\
    \ authentication (say, rate a product), you pass\n\nthe session ID as a GET or\
    \ POST parameter of the HTTP request made to the server.\n\nJust as before, your\
    \ server validates the session ID and, if successful, performs the\n\nrequested\
    \ action.\n\n Because these sessions are only preserved for the duration that\
    \ the user is on the\n\npage, the experience isn’t as good. Users will have to\
    \ re-authenticate if they refresh\n\nthe page, or visit your application hosted\
    \ on a different publisher website. But it’s bet-\n\nter than just rejecting authentication\
    \ from these browser users entirely.\n\n It’s worth noting that if you’re using\
    \ single-page sessions, this session ID should be\n\npreserved securely behind\
    \ an external iframe hosted on your domain. If you store\n\nthe session ID on\
    \ code executing on the publisher’s page, it’s conceivable that a mali-\n\ncious\
    \ publisher could access the variable and steal a visitor’s session. Stealing\
    \ a user’s\n\nsession ID could allow the publisher to falsely identify themselves\
    \ as that user with\n\nyour application.\n\n The scenario we just described is\
    \ an example of *session hijacking*. Third-party ses-\n\nsions, whether persisted\
    \ using third-party cookies, or preserved temporarily on a sin-\n\ngle page, are\
    \ susceptible to being hijacked in a number of ways. Let’s dive deeper. \n\n*6.3*\n\
    \n*Securing sessions*\n\nSession hijacking is a situation where a malicious party\
    \ gains access to a user’s session\n\nwith a web service in order to make unauthorized\
    \ requests. We outlined one such vul-\n\nnerability of sessions in the last section:\
    \ a user’s session ID can be obtained by a mali-\n\ncious publisher if you store\
    \ that ID in a variable in the publisher’s page context. That’s\n\njust one situation,\
    \ and possibly a rare one.\n\n What’s far more likely is a malicious party obtaining\
    \ a user’s session through HTTP\n\nsniffing. So far, we’ve been describing an\
    \ application that uses HTTP to transfer ses-\n\nsions, using either cookies or\
    \ as a GET or POST parameter. HTTP is an unencrypted\n\ntransfer protocol, and\
    \ as such, there are situations in which full request bodies can be\n\nread in\
    \ plain text by unauthorized parties.\n\n This happens most frequently when people\
    \ use an unencrypted Wi-Fi network,\n\nmany of which are found at cafes, airports,\
    \ or even your local library. Over such net-\n\nworks, all network requests between\
    \ your computer and the network are transferred\n\nin plain text. This means that\
    \ other users on the network can record and inspect your\n\nHTTP traffic, and\
    \ extract any private session information for their own use. There are\n\neven\
    \ automated tools for identifying and hijacking cookies for popular web destina-\n\
    \ntions. The most popular of these, a Firefox plugin named Firesheep,⁴ will show\
    \ you a\n\nlist of users on an unencrypted network currently signed into Facebook,\
    \ Flickr, and\n\nother popular web services, and let you sign in as those users\
    \ with just the click of a\n\nbutton (see figure 6.8)!\n\n This vulnerability\
    \ is worse for third-party applications. In order for Firesheep to\n\nidentify\
    \ a session to hijack on the network, the user has to visit a popular web service\n\
    \n4 You can download Firesheep for yourself at http://codebutler.com/firesheep.\n\
    \nwww.it-ebooks.info"
