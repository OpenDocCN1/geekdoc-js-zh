  md: "**57**\n\n***Styling your HTML***\n\nDETERMINING WHEN A CSS FILE IS LOADED\n\
    \nNo problem, you’ll just add an event handler that will fire when the stylesheet\
    \ is\n\nloaded, just as you did in chapter 2 when loading additional JavaScript\
    \ files. Except\n\nyou can’t. This is because CSS files are loaded using the <link>\
    \ HTML element, and\n\nnot every browser has a load event that fires when a <link>\
    \ element becomes loaded.\n\nSo to keep things browser compatible, you’ll need\
    \ to rely on a trick, which is to contin-\n\nually poll the page until one of\
    \ the rules in the CSS file becomes active.\n\n To figure that out, you’ll first\
    \ add an ID rule to your CSS file whose sole purpose is\n\nto determine when the\
    \ file is loaded. The rule will apply a specific color to any ele-\n\nment that\
    \ declares that ID. After you’ve added the stylesheet to the page, you’ll create\n\
    \nan element with the ID and append it to the page. If at any point the element\
    \ has the\n\nspecific color from your CSS file, you’ll know the file was loaded.\n\
    \n Here’s what the test CSS rule will look like:\n\n#stork-css-ready {\n\ncolor:\
    \ #bada55 !important;\n\n}\n\nThe actual color used isn’t important, as long as\
    \ it’s relatively uncommon—#bada55\n\nshould fit the bill nicely. The accompanying\
    \ !important keyword is used to prioritize\n\nthis rule over possibly conflicting\
    \ CSS rules specified by other stylesheets on the page.\n\nIf you’re a CSS neophyte,\
    \ don’t worry—we’ll cover !important and CSS specificity\n\nlater in this chapter.\n\
    \n Next up is the code to poll the page to find out when the test rule has become\n\
    \nactive (listing 3.4). You won’t be using this snippet for the Camera Stork widget\n\
    \nbecause, in the next section, we’ll show you a slightly more efficient way of\
    \ including\n\nCSS on the page. But read through this listing nevertheless because,\
    \ more often than\n\nnot, you’ll want to use this function in your own projects.\n\
    \nfunction isCssReady(callback) {\n\nvar testElem = document.createElement('span');\n\
    \ntestElem.id = 'stork-css-ready';\n\ntestElem.style = 'color: #fff';\n\nvar entry\
    \ = document.getElementsByTagName('script')\\[0\\];\n\nentry.parentNode.insertBefore(testElem,\
    \ entry);\n\n(function poll() {\n\nvar node = document.getElementById('css-ready');\n\
    \nvar value;\n\nif (window.getComputedStyle) {\n\nvalue = document.defaultView\n\
    \n.getComputedStyle(testElem, null)\n\n.getPropertyValue('color');\n\n}\n\nelse\
    \ if (node.currentStyle) {\n\nvalue = node.currentStyle.color;\n\n}\n\nListing\
    \ 3.4\n\nTesting for the presence of a CSS rule\n\n**Create test <span> **\n\n\
    **element, reset color to **\n\n**white**\n\n**Safely append test **\n\n**element\
    \ to page by **\n\n**inserting before an **\n\n**existing script element**\n\n\
    **Use W3C style**\n\n**accessors to get**\n\n**color property**\n\n**For Internet\
    \ Explorer, **\n\n**use Microsoft’s **\n\n**currentStyle property**\n\nwww.it-ebooks.info"
