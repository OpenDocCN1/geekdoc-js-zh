  md: "**227**\n\n***Debugging***\n\n*10.1.1 Serving development code in production*\n\
    \nWhen faced with a bug in production, it’s clear that you’ll want your unminified\
    \ devel-\n\nopment code before debugging a publisher’s live website. Well look\
    \ at two solutions\n\nfor making that happen: *rewriting proxies* and *feature\
    \ switches*. Both techniques have\n\ntheir pros and cons, and which technique\
    \ you’ll use depends on the situation at hand.\n\nLet’s start with rewriting proxies.\n\
    \nREWRITING PROXIES\n\nProxies are server applications that stand in between the\
    \ client and the server, acting\n\nas intermediaries for requests. Such proxies\
    \ can be used for a variety of different tasks.\n\nA common proxy server is a\
    \ caching web proxy—an application that caches web pages\n\nand static files requested\
    \ from remote web servers to make their delivery faster for\n\nlocal network clients.\n\
    \n![](img/5163284bc2a93c8f882ffdc058bb516a_251_0.png)\n\nFigure 10.1\n\nMinified\
    \ production JavaScript code opened using Google Chrome’s Developer Tools. \n\n\
    Debugging and stepping through such code isn’t pleasant.\n\nwww.it-ebooks.info"
