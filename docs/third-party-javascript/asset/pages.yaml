  md: "**191**\n\n***Wrapping web service APIs***\n\nThat’s a lot of rich, valuable\
    \ data about the thirdpartyjs-code repository. Developers\n\nare accessing this\
    \ and other endpoints via CORS to build client-side applications that\n\ninterface\
    \ directly with GitHub. For example, Dabblet (http://dabblet.com) is a web-\n\n\
    based code editor that saves files as new repositories in your GitHub account.\
    \ It does\n\nthis all using strictly client-side JavaScript and GitHub’s API—check\
    \ it out. \n\nWHY A CLIENT LIBRARY?\n\nYou might be asking yourself, if CORS and\
    \ JSONP already make API access from the\n\nbrowser possible, what’s the benefit\
    \ of wrapping the API in a JavaScript SDK? There\n\nare a number of good reasons:\n\
    \n*Additional browser support*—CORS is a working draft spec and doesn’t have\n\
    \nfull browser support. With your JavaScript SDK, you can instead use cross-\n\
    \ndomain tunnels to initiate HTTP requests to your API. Paired with the browser-\n\
    \ncompatibility techniques covered in chapter 4 (or a library like easyXDM),\n\
    \nyou’ll be able to support a larger number of users than CORS alone.\n\n*Easier\
    \ abstractions*—By providing a set of clearly named and documented\n\nJavaScript\
    \ functions that access your API, you can eliminate a lot of boilerplate\n\ncode\
    \ for developers, which helps publishers develop for your platform faster.\n\n\
    This also lets you side-step complicated concepts like JSONP and CORS, thus\n\n\
    lowering the entry barrier for developers.\n\n*Decoupling*—Web service APIs change\
    \ all the time, sometimes with breaking\n\nchanges for publishers. If you wrap\
    \ calls to your API from your JavaScript SDK,\n\nit’s possible to anticipate and\
    \ fix breaking changes at the JavaScript level.\n\nThose may not be critical issues\
    \ for you—and that’s okay. Not everyone needs to go\n\nthe extra mile of building\
    \ an SDK interface that wraps calls to their web service API.\n\nBut you’d be\
    \ how surprised how easy it is to implement one. Over the remainder of\n\nthis\
    \ chapter, we’ll show you how. \n\n*8.3.2*\n\n*Wrapping the Camera Stork API*\n\
    \nIn this section, we’ll implement a public JavaScript function in the SDK that\
    \ lets the\n\nuser communicate with a web service API. To do that, we’ll design\
    \ a function through\n\nwhich API requests are made, and then implement a cross-domain\
    \ tunnel for issuing\n\nHTTP requests. But before we start, we need a web service\
    \ API to work with.\n\n So without further ado, let us introduce the Camera Stork\
    \ Web Service API. This\n\nAPI allows publishers access to public information\
    \ about Camera Stork’s product cata-\n\nlog and user reviews. It exposes the HTTP\
    \ endpoints shown in table 8.1, which accept\n\na number of parameters and return\
    \ responses as structured JSON.\n\n The root URL for accessing these endpoints\
    \ is http://camerastork.com/api/. That\n\nmeans that if a publisher wants to request\
    \ data from reviews/list, they’d issue an\n\nHTTP request to http://camerastork.com/api/reviews/list.\
    \ Parameters are submitted\n\nas query string arguments.\n\nwww.it-ebooks.info"
