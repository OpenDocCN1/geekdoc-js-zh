  md: "**116**\n\nCHAPTER 5\n\n***Cross-domain iframe messaging***\n\nconsole.log(window.location.href);\n\
    \n\\> http://thirdpartyjs.com/\n\nwindow.location = 'http://example.com/';\n\n\
    console.log(window.location.href);\n\n\\> http://example.com/\n\nWhen working\
    \ with iframes and other child windows, this property is accessible, but\n\nexclusively\
    \ in a write-only mode. This means that you can redirect a child window to\n\n\
    another URL, but you can’t read back the current URL of that window. This policy\
    \ was\n\nimplemented as a security measure so that a malicious website can’t open\
    \ your favor-\n\nite web mail client in a hidden iframe and gather information\
    \ by reading the URL’s\n\nquery string or logging redirects.\n\n Of course, not\
    \ all URL changes result in network requests. As you’ve already\n\nlearned, HTML\
    \ defines a special portion of a URL—called the *fragment identifier* or *URL*\n\
    \n*hash*—that’s designed to point to a location inside the current document. This\
    \ por-\n\ntion always comes last in a URL string and is preceded by the hash (#)\
    \ symbol:\n\nhttp://camerastork.com/#products\n\nThe fallback technique you’re\
    \ about to learn transfers small chunks of data across\n\nwindows by changing\
    \ each other’s fragment identifiers. Since changing fragment\n\nidentifiers doesn’t\
    \ reload the page, you can maintain state in each frame. But keep in\n\nmind that\
    \ you can’t read an iframe’s URL; you can only write to it. So when loading a\n\
    \ndocument into an iframe, you have to pass your current URL in to it so that\
    \ it doesn’t\n\naccidentally redirect your publisher’s page to some other address.\
    \ You can then start\n\nsending information by changing the iframe’s location\
    \ property to its original URL\n\n*plus* your data in the anchor portion. And\
    \ when the child window wants to send some\n\ndata back to you, it can change\
    \ its parent window’s location to the URL you sent with\n\nyour initial request,\
    \ plus the data (see figure 5.3).\n\niframe\n\n2\\. Put message in parent\n\n\
    window URL’s document\n\n \n\nfragment.\n\n1\\. Create iframe.\n\niframe\n\n3\\\
    . Read location hash\n\nto obtain message.\n\nWeb browser\n\nhttp://publisher.com/\n\
    \nhttp://yourapp.com/iframe.html\n\nWeb browser\n\nhttp://publisher.com/#helloworld\n\
    \nhttp://yourapp.com/iframe.html\n\nFigure 5.3\n\nUsing the URL fragment identifier\
    \ to pass messages between windows\n\nwww.it-ebooks.info"
