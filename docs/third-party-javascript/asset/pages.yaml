  md: "**67**\n\n***Embedding content in iframes***\n\nIframes were designed for this\
    \ specific task: they’re “inline” frames that let you embed\n\ncontent from another\
    \ web page. Because they use a separate window and DOM envi-\n\nronment, they\
    \ don’t inherit any parent styles, and are unlikely to be accidentally que-\n\n\
    ried by a rogue script (see figure 3.4). This comes at a cost: HTML and CSS served\n\
    \nbehind iframes are less flexible and less customizable than rendering directly\
    \ on the\n\npublisher’s DOM.\n\n Using iframes is at first straightforward. You\
    \ begin by creating a new iframe ele-\n\nment and appending it to a target location\
    \ in the page, just as you would any other\n\nHTML element. There’s one small\
    \ catch: iframes don’t adjust their size to fit their con-\n\ntents, so you’ll\
    \ need to manually specify the height and width. You’ll also want to reset\n\n\
    some default iframe styles, like border.²\n\n Here’s what the code looks like;\
    \ it creates a new 250 x 300 pixel borderless iframe\n\nthat also happens to be\
    \ completely empty:\n\nvar iframe = document.createElement('iframe');\n\niframe.style.width\n\
    \n\\= '250px';\n\niframe.style.height = '300px';\n\niframe.style.border = 'none';\n\
    \ntarget.parentNode.insertBefore(iframe, target);\n\n2 The actual default border\
    \ style for iframes is border: 2px inset, which looked great—in 1998.\n\n<iframe\
    \ width=”100” height=”100”\n\nsrc=”http://widget.com/weather.html”/>\n\nAn iframe\
    \ is a window \n\nembedded in your web page \n\nwith its own document.\n\nAn iframe’s\
    \ document can come \n\nfrom a different server than the \n\nmain window’s document.\n\
    \nThe document inside the \n\niframe doesn’t inherit CSS \n\nrules from the parent\
    \ page.\n\nhttp://publisher.com/page.html \n\nFigure 3.4\n\nIframes enable you\
    \ to embed separate HTML documents into a web page. \n\nThey don’t inherit CSS\
    \ rules from the parent page.\n\nwww.it-ebooks.info"
