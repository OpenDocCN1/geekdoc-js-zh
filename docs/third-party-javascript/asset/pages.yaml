  md: "**160**\n\nCHAPTER 7\n\n***Security***\n\nneeds to do in order to bypass such\
    \ a filter is to replace their initial <script> tag with\n\n<scr<script>ipt>.\
    \ Your filter will replace <script> with an empty string, acciden-\n\ntally generating\
    \ another <script> element as a result. And in the case of multistep\n\nvalidation—when\
    \ you validate user input using multiple filters—the attacker might\n\nbe able\
    \ to exploit the ordering of these steps to bypass them all.\n\n The approach\
    \ we just described is commonly referred to as *reject known bad*. You\n\nhave\
    \ some kind of a blacklist containing a set of patterns that are potentially danger-\n\
    \nous to your widget and for every input you check it against that blacklist.\
    \ Although this\n\napproach is sometimes necessary—for example, when the input\
    \ is a free-form text\n\nfield, like a product review or email body—it’s probably\
    \ the *least* safe technique to\n\nemploy when defending your application against\
    \ XSS attacks. The data transmitted\n\nthrough the web can be encoded in so many\
    \ ways that there’s a big chance that you’ll\n\nmiss a few patterns in your blacklist.\
    \ \n\nACCEPT KNOWN GOOD\n\nA better approach that you should use whenever possible\
    \ is known as *accept known*\n\n*good*. This is the exact opposite of the previous\
    \ approach. Instead of maintaining a\n\nblacklist of bad values, you keep a whitelist\
    \ of *good* (safe) values. For example, if you’re\n\npassing a product identifier\
    \ into your widget’s iframe from the publisher page, instead\n\nof sanitizing\
    \ the input, you can verify that the value is numeric:\n\nfunction isValidIdentifier(uid)\
    \ {\n\nreturn !isNaN(uid);\n\n}\n\nfunction setConfig(config) {\n\nvar args =\
    \ {};\n\nif (config.productId && isValidIdentifier(config.productId)) {\n\n/\\\
    * ... \\*/\n\n}\n\n}\n\nAnother good approach, when you’re trying to limit the\
    \ input data only to good val-\n\nues, is to narrow the scope around the input.\
    \ Consider the CSS cross-site scripting\n\nexample we showed back in listing 7.2.\
    \ The code expected a valid hexadecimal color\n\nrepresentation, but instead the\
    \ attacker provided a CSS expression and stole sessions\n\nfrom users (who happened\
    \ to be using early versions of Internet Explorer). The next\n\nlisting shows\
    \ how to prevent this attack by narrowing the scope of how you apply the\n\ndata\
    \ provided to you from the publisher’s page.\n\n<!doctype html>\n\n<html>\n\n\
    <head>\n\n<script src=\"/js/helpers.js\"></script>\n\n<script>\n\nvar args = parseQueryArguments(window.location.search);\n\
    \nvar body = document.getElementsByTagName('body')\\[0\\];\n\nListing 7.3\n\n\
    Preventing XSS attacks by narrowing the scope around the input data\n\nwww.it-ebooks.info"
