  md: "**46**\n\nCHAPTER 2\n\n***Distributing and loading your application***\n\n\
    \ That’s a lot of progress for one chapter, but we’ve hit a snag. Before you can\
    \ ren-\n\nder that product, you need to first retrieve information about it from\
    \ the server—\n\ninformation like the product’s name, price, appearance, and current\
    \ rating.\n\n There are two approaches to solving this. The first (and easiest)\
    \ approach is to\n\nembed the entire Camera Stork product catalog as a JavaScript\
    \ object inside your\n\napplication’s source code. This could be included in your\
    \ main widget file (widget.js),\n\nbut because the catalog is perhaps likely to\
    \ change (prices change daily), it might be\n\nbetter loaded as a separate JavaScript\
    \ file using the techniques we showed you in\n\nsection 2.4.\n\n Here’s how the\
    \ catalog object might be declared, in a separate source file\n\n(catalog.js):\n\
    \nStork.catalog = (function() {\n\nreturn {\n\n1337: { name: 'E90', company: 'Mikon',\
    \ price: '599.99' },\n\n1338: { name: 'FabPix 30', company: 'Mikon', price: '139.99'\
    \ },\n\n...\n\n8871: { name: 'SuperShot', company: 'Kanon', price: '178.99' },\n\
    \n8872: { name: 'SuperShot', company: 'Kanon', price: '219.99' }\n\n};\n\n})();\n\
    \nPresuming that this file is loaded earlier inside the loadSupportingFiles function,\n\
    \nthe getProductData function should look like the following:\n\nfunction getProductData(params,\
    \ callback) {\n\nvar id = params.id;\n\ncallback(Stork.catalog\\[id\\]);\n\n}\n\
    \nNot difficult, but not exactly best practice either. What happens if the Camera\
    \ Stork\n\nproduct catalog is particularly large? It’s not unreasonable to suggest\
    \ that a camera\n\nstore’s entire catalog might include tens of thousands of items.\
    \ If each product entry\n\ntakes roughly 100 bytes to describe, that would mean\
    \ having to serve a JavaScript file\n\nthat weighs nearly a megabyte (100 bytes\
    \ x 10,000 = just under 1 MB). That might fly in\n\nthe high-bandwidth tomorrow-cities\
    \ of Tokyo and Seoul, but for the rest of the world,\n\nthat’s an overwhelming\
    \ amount of data to download.\n\n The alternative (and second approach) is to\
    \ fetch the product information indi-\n\nvidually from the server. This is why\
    \ getProductData accepted a callback parameter\n\nto begin with—it presumes that\
    \ to fetch the data, you’ll need to initiate an HTTP\n\nrequest to the server\
    \ for the given product ID and wait for a response before firing\n\nthe callback.\n\
    \n For a normal web application, this is easily solved using XmlHttpRequest, or\
    \ as it’s\n\ncommonly referred to today, AJAX. But as we briefly mentioned in\
    \ chapter 1, and for\n\nreasons we’ll explain later in this book, the browser\
    \ restricts XmlHttpRequest to the\n\nsame domain, which means you can’t make an\
    \ AJAX call from the publisher’s website\n\nto your own servers.\n\nwww.it-ebooks.info"
