  md: "**68**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\nBefore the iframe can\
    \ be useful, it needs to be filled with content (HTML and CSS),\n\nwhich you can\
    \ do using one of two techniques. The most common use case is to load a\n\nremote\
    \ document inside the iframe. This is done by assigning an external URL to the\n\
    \niframe’s src property before appending the iframe to the DOM. But even without\n\
    \nloading a remote document, it’s still possible to embed content in iframes by\
    \ using\n\nwhat we call *src-less iframes*.\n\nSOME IFRAME HISTORY\n\nIframes\
    \ were first introduced in Internet Explorer 4\n\nby Microsoft in 1997, and later\
    \ became standardized in HTML 4.0. The HTML\n\n4.0 standard also described other\
    \ frame-related elements such as frame,\n\nframeset, and noframe, but all of these,\
    \ with the exception of iframe,\n\nbecame deprecated in HTML5. Iframes stayed\
    \ because they were recognized\n\nand embraced by the web community as a good\
    \ way to combine different\n\npages into one and to create things such as web\
    \ mashups—pages that com-\n\nbine data from two or more sources to create a new\
    \ service.\n\nOn that note, credit where credit is due: at times it may seem like\
    \ we\n\nunfairly pick on Microsoft in this book, but we can’t deny that some of\
    \ the\n\nweb’s best technologies—including XmlHttpRequest and iframes—came out\n\
    \nof Redmond. \n\nWe’ll look at both ways of using iframes: without setting a\
    \ src attribute, and by load-\n\ning content from an external URL. We’ll then\
    \ look at how we can inherit and pass\n\nbasic styles from the parent page to\
    \ an iframe element. When you’re convinced of the\n\ninfinite usefulness of iframes,\
    \ we’ll finish with a discussion of where iframes aren’t\n\nalways suitable. We’ll\
    \ begin with iframes where you don’t set a src attribute.\n\n*3.4.1*\n\n*Src-less\
    \ iframes*\n\nWhen you create an iframe without setting its src attribute, you’re\
    \ creating what we\n\nrefer to as a blank or *src-less* iframe. Src-less iframes\
    \ are powerful in that they contain a\n\nseparate window and DOM environment,\
    \ and scripts executing on the parent page\n\ncan directly access these objects.\
    \ That means you can populate the iframe’s contents\n\nwith HTML and CSS directly\
    \ from your third-party script, but still benefit from their\n\nimmunity to inheriting\
    \ styles from the parent page.\n\n To gain access to the iframe’s DOM, you’ll\
    \ use the iframe element’s contentWindow\n\nproperty. This example writes HTML\
    \ directly into the src-less iframe’s body, using our\n\nold friend document.write:\n\
    \nvar doc = iframe.contentWindow.document;\n\ndoc.write(\n\n'<style> /\\* ...\
    \ \\*/ </style>' +\n\n'<div>' +\n\n'\n\n<h3>Mikon E90 Digital SLR</h3>' +\n\n\
    '\n\n<img src=\"http://camerastork.com/img/1337-small.jpg\"/>' +\n\n'\n\n<p>$599.99</p>'\
    \ +\n\n'\n\n<p>4.3/5.0 &bull; 176 Reviews</p>' +\n\n'</div>'\n\n);\n\ndoc.close();\n\
    \nwww.it-ebooks.info"
