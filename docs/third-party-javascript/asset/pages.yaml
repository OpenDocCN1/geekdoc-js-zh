  md: "**80**\n\nCHAPTER 4\n\n***Communicating with the server***\n\nvar mail = document.createElement('iframe');\n\
    \nmail.src = 'http://gmail.com/';\n\nmail.style.display = 'none';\n\ndocument.body.appendChild(mail);\n\
    \nmail.contentWindow.GMAIL.deleteAllMyMailPlease();\n\nIn this section, we’ll\
    \ look at rules for determining same origin, as well as the SOP and\n\nscript\
    \ loading.\n\n*4.1.1*\n\n*Rules for determining same origin*\n\nNow, you know\
    \ that documents with different origins can’t “talk” to each other, but\n\nwhat\
    \ rules are used to determine whether two documents share the same origin? The\n\
    \nrules are simple: access is granted only if the protocol, host, and (for browsers\
    \ other\n\nthan Internet Explorer) port number for both interacting parties match\
    \ perfectly. In\n\nall other cases, access is forbidden. Table 4.1 illustrates\
    \ the result of same-origin policy\n\nchecks against http://example.com.\n\nDON’T\
    \ IGNORE THE PORT\n\nWe’ve seen quite a few developers (ourselves\n\nincluded)\
    \ forget that SOP also checks for matching ports. For example,\n\nrequests from\
    \ thirdpartyjs.com to thirdpartyjs.com:8080 will fail miserably.\n\nMost browsers\
    \ don’t give you any helpful information when requests are\n\nbeing rejected by\
    \ the SOP, which can make debugging tough. So please,\n\ndon’t forget!\n\nAs you\
    \ can see from the table, there’s not much a malicious party can do unless they\n\
    \nexecute their code on a page with the same domain, protocol, and port as their\
    \ target\n\ndocument. This is good news, but before that warm feeling of safety\
    \ takes over, don’t\n\nforget that modern browsers consist of many different components\
    \ and not all those\n\ncomponents implement the same-origin policy. For example,\
    \ Adobe’s Flash browser\n\nplugin doesn’t adhere to the SOP, and permits messaging\
    \ between Flash objects on\n\ndifferent documents, same origin or not. \n\n*4.1.2*\n\
    \n*Same-origin policy and script loading*\n\nNow, you’re probably thinking, “*Wait\
    \ a minute*, didn’t we spend all of chapter 2 learn-\n\ning how to load an external\
    \ JavaScript file (located at camerastork.com) on the\n\nTable 4.1\n\nSame-origin\
    \ policy rules checks against http://example.com\n\nOriginating URL\n\nOutcome\n\
    \nReason\n\nhttp://example.com\n\nSuccess\n\nSame protocol, domain, and port (default\
    \ port is 80)\n\nhttp://example.com:8080\n\nFailure\n\nDifferent port\n\nhttps://example.com\n\
    \nFailure\n\nDifferent protocol (https)\n\nhttp://sub.example.com\n\nFailure\n\
    \nDifferent domain\n\nhttp://google.com/\n\nFailure\n\nDifferent domain\n\nwww.it-ebooks.info"
