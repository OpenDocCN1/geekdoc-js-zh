  md: "**110**\n\nCHAPTER 5\n\n***Cross-domain iframe messaging***\n\non the page—including\
    \ potentially malicious ones—a JavaScript console running on\n\nyour domain with\
    \ permission to do whatever they want. Not a good idea.\n\n The code in listing\
    \ 5.2 implements the diagram we showed you in figure 5.1. The\n\nreceiver listens\
    \ to all messages but recognizes only those that originate from cameras-\n\ntork.com.\
    \ If the message from camerastork.com contains a string \"hello\", the\n\nreceiver\
    \ sends back a message with a string \"world\". Note that messages between\n\n\
    window objects are all done on the client—they don’t perform any network requests\n\
    \nand are blazingly fast.\n\nfunction receiver(ev) {\n\nif (ev.origin !== 'http://camerastork.com/')\
    \ {\n\nreturn;\n\n}\n\nif (ev.data === 'hello') {\n\nev.source.postMessage('world',\
    \ 'http://camerastork.com/');\n\n}\n\n}\n\nif (window.addEventListener) {\n\n\
    window.addEventListener('message', receiver, false);\n\n} else {\n\nwindow.attachEvent('onmessage',\
    \ receiver);\n\n}\n\nAs you can see from the examples, the window.postMessage\
    \ API is simple and it solves\n\njust one problem—the problem of exchanging messages\
    \ between windows. Every-\n\nthing else—from simple origin checks to the complex\
    \ relationships between mes-\n\nsages—is outside of the window.postMessage specification\
    \ and must be handled by\n\nyou. We’ll show you how to build a simple request/response\
    \ system later in this chap-\n\nter. But now let’s talk about something that most\
    \ often kills all the excitement about\n\nshiny, new HTML or JavaScript features.\
    \ Let’s talk about browser compatibility.\n\n(Spoiler: it’s not that bad.) \n\n\
    *5.1.3*\n\n*Browser support*\n\nSince its inception, the window.postMessage API\
    \ has been adopted by all major brows-\n\ners—including Internet Explorer 8 and\
    \ up. This includes today’s mobile browsers,\n\nsuch as iOS Safari, Android Browser,\
    \ and Opera Mobile. This relatively high level of\n\nbrowser support greatly simplifies\
    \ the task of cross-domain messaging for third-party\n\napplication developers\
    \ like yourself. Table 5.1 indicates what browsers/versions imple-\n\nment the\
    \ window.postMessage specification.\n\n As you can see, all browsers support the\
    \ window.postMessage API in their current\n\nstable versions. However, not all\
    \ postMessage implementations have support for trans-\n\nferring native JavaScript\
    \ types using the structured clone algorithm (section 5.1.1).\n\nThis means that\
    \ it’s often safest to transfer only string messages using JSON serialization\
    \ \n\nListing 5.2\n\nEvent handler rejects messages that don’t originate from\
    \ camerastork.com.\n\n**Origin not recognized—**\n\n**stop immediately**\n\n**Origin\
    \ recognized **\n\n**and data is valid—**\n\n**send response**\n\n**Register **\n\
    \n**onmessage event**\n\nwww.it-ebooks.info"
