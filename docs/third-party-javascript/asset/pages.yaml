  md: "**134**\n\nCHAPTER 6\n\n***Authentication and sessions***\n\nWhen the form\
    \ is submitted, it triggers an AJAX call to an authentication endpoint on\n\n\
    your servers. If the submitted username and password are valid, the application\
    \ gener-\n\nates a new session in its database.¹ The server returns a JSON response\
    \ with the user’s\n\ninformation, but, more importantly, sets a cookie that contains\
    \ the newly generated\n\nsession ID.\n\n Here’s the HTTP server response from\
    \ the AJAX endpoint:\n\nHTTP/1.1 200 OK\n\nDate: Wed, 28 Sep 2011 14:33:37 GMT\n\
    \nContent-type: application/json*Set-cookie*\n\n *Set cookie*: sessionid=66d2520a77a3c6dac4db658c6dd13061\n\
    \n{ \"username\":'johndoe', \"first\":'John', \"last\":'Doe' }\n\nNow that you\
    \ have the user’s information returned as JSON, you can update the wid-\n\nget\
    \ to reflect that the user is logged in. You could do this by replacing the Login\
    \ link\n\nwith the user’s full name, for example.\n\n What’s more important in\
    \ this example HTTP response is the Set-cookie header.\n\nThis will have the effect\
    \ of persisting the user’s session ID inside a cookie stored on the\n\nuser’s\
    \ browser. When the user subsequently visits any publisher’s page containing your\n\
    \nwidget, your application will initiate a browser request to fetch the product’s\
    \ data, just\n\nas it did before. This time, the browser will pass the stored\
    \ cookie as part of the HTTP\n\nrequest:\n\nGET /products/1337.json HTTP/1.1\n\
    \nHost: camerastork.com\n\nAccept: application/json\n\nCookie: sessionid=66d2520a77a3c6dac4db658c6dd13061\n\
    \nAgain, you’ll test the validity of the passed session ID on your servers, and\
    \ if every-\n\nthing’s kosher, return some metadata about the user in your response.\
    \ And like\n\nbefore, you’ll render the user’s identifying information into the\
    \ widget, to help indi-\n\ncate visually that they’re logged in.\n\n What we’ve\
    \ just described is the standard, conventional way of using cookies to\n\npersist\
    \ sessions. If you’ve done any kind of web application development before, this\n\
    \nshould look familiar to you. What’s different is that this cookie is being set\
    \ on a\n\ndomain (camerastork.com) that’s not the same as the domain of the top-level\
    \ docu-\n\nment (your publisher’s website). It’s thus considered a third-party\
    \ cookie and subject\n\nto all the browser restrictions that can be placed on\
    \ third-party cookies—including\n\nbeing outright disabled. \n\n*6.1.2*\n\n*Disabling\
    \ third-party cookies*\n\nAs we’ve alluded to several times so far in this chapter,\
    \ third-party cookies can be dis-\n\nabled by the browser. Typically, this is\
    \ a user-configurable browser setting where the\n\n1 Generating and storing sessions\
    \ is beyond the scope of this book. If you’re unsure how this works, we recom-\n\
    \nmend picking up a web application framework (such as Ruby on Rails or Python’s\
    \ Django framework) and\n\nreading the relevant documentation.\n\nwww.it-ebooks.info"
