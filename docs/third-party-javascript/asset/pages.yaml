    \ in other languages like Python (PyUnit) and Java (JUnit), so it should feel\n\
    \n**Run your assertions **\n\n**against isolated **\n\n**objects**\n\n**Don’t\
    \ run tests **\n\n**until code inside **\n\n**iframe is ready**\n\n**Cleanup**\n\
    \n**Before each test, create src-less **\n\n**iframe and inject HTML into it**\n\
