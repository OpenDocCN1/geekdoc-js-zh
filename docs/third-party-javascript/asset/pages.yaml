  md: "**55**\n\n***Styling your HTML***\n\nYou’ll notice that, just like our earlier\
    \ examples, the data-stork-product attribute is\n\nremoved from the DOM after\
    \ each render. Even though it’s no longer required that\n\nyour publisher include\
    \ multiple script includes in their HTML source to render multi-\n\nple widgets,\
    \ in this copy-paste world we live in, they might do so anyway. In that case,\n\
    \nyou don’t want to insert duplicate copies of your widget when any subsequent\
    \ scripts\n\nget executed. Alternatively, you can just have your code exit early\
    \ in the event that it is\n\nloaded a second time. \n\n*3.2*\n\n*Styling your\
    \ HTML*\n\nAt this point, if you were following our examples from sections 3.1.3\
    \ and 3.1.4, you\n\nhave your application’s HTML rendering on the publisher’s\
    \ page, but it’s looking a lit-\n\ntle grim (see figure 3.2). That’s because it’s\
    \ bare-bones HTML without any styles. In\n\ntoday’s world of overdesigned web\
    \ applications, that\n\nwon’t cut it. You’ll need to style your widget’s HTML\
    \ in\n\norder for it to be presentable.\n\n Styling your HTML is difficult for\
    \ third-party applica-\n\ntions in the same way that loading additional script\
    \ files\n\nis difficult: you don’t control the page’s HTML source\n\ncode, and\
    \ are required to load styles dynamically from\n\nyour third-party JavaScript.\
    \ There are three fundamental\n\nways to do this: inline style rules with your\
    \ HTML,\n\ndynamically loading accompanying CSS in separate files,\n\nand embedding\
    \ stylesheet rules in your JavaScript\n\nsource code. Let’s start with inlining\
    \ styles.\n\n*3.2.1*\n\n*Using inline styles*\n\nThe most straightforward way\
    \ of styling your HTML is to inline your style rules directly\n\non HTML elements.\
    \ This means declaring CSS inside an element’s style attribute. For\n\nexample,\
    \ for a simple version of the Camera Stork widget, you might insert the follow-\n\
    \ning HTML:\n\n<div style=\"width:200px\">\n\n<h3 style=\"font-size:18px\">Mikon\
    \ E90 Digital SLR</h3>\n\n<img src=\"http://camerastork.com/img/1337-small.png\"\
    \n\nstyle=\"border:1px solid #000\"/>\n\n<p style=\"font-weight:bold\">$299.99</p>\n\
    \n<p>4.3/5.0 &bull; 176 Reviews</p>\n\n</div>\n\nNot the most glamorous way to\
    \ style elements, but it works. There’s one major upside:\n\nHTML styled this\
    \ way is unlikely to conflict with styles from the publisher’s page. We’ll\n\n\
    talk more about this later in the chapter, but by foregoing a separate stylesheet\
    \ (where\n\nelements are targeted by tag names, class names, IDs, and so on),\
    \ you’re almost\n\nguaranteed not to accidentally style parts of the publisher’s\
    \ page that are outside the\n\narea occupied by your widget. Similarly, you’re\
    \ unlikely to have your widget’s styles\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_79_0.png)\n\
    \nFigure 3.2\n\nThe Camera Stork \n\nproduct widget rendered using \n\nunstyled\
    \ HTML\n\nwww.it-ebooks.info"
