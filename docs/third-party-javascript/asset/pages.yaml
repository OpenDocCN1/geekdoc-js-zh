  md: "**112**\n\nCHAPTER 5\n\n***Cross-domain iframe messaging***\n\nGOOGLE CHROME\
    \ FRAME\n\nGoogle has a great product called Google Chrome\n\nFrame that brings\
    \ Google Chrome’s open web technologies—including\n\nwindow.postMessage—and a\
    \ faster JavaScript engine to Internet Explorer.\n\nYou can learn more about Google\
    \ Chrome Frame at http://google.com/\n\nchromeframe/. \n\n*5.2*\n\n*Fallback techniques*\n\
    \nIn the last section, you learned how to use the newly available window.postMessage\n\
    \nAPI to exchange messages between iframes. You also learned that although today’s\n\
    \nmodern browsers support postMessage in their stable versions, older browsers—such\n\
    \nas Internet Explorer 6 and 7—don’t have that support. For these browsers, you’ll\
    \ have\n\nto employ a few hacks that allow you to use undocumented browser features\
    \ to pass\n\nsmall strings back and forth between an iframe and its parent window.\
    \ All of the tech-\n\nniques described in this section transmit messages much\
    \ more slowly than window\n\n.postMessage, and you should only use them as your\
    \ backup plan.\n\n In this section, we’ll go over three fallback techniques: using\
    \ the window.name\n\nproperty, using the URL fragment identifier (or hash), and\
    \ using an Adobe Flash\n\nobject. All of these techniques base themselves on the\
    \ fact that some browsers—inten-\n\ntionally or unintentionally—skip same-origin\
    \ policy checks when dealing with their\n\nrespective components.\n\n As an aside,\
    \ we’ll mostly be looking at simple proof-of-concept examples of these\n\ntransport\
    \ mechanisms. We want you to understand how they work, not necessarily how\n\n\
    to implement them as 100% postMessage replacements. That’s because they can\n\n\
    become really complicated, and also later in this chapter we’ll look at easyXDM,\
    \ a mes-\n\nsaging library that actually implements all of these protocols for\
    \ you.\n\n Let’s take a look at the first technique: using window.name to exchange\
    \ messages\n\nbetween windows.\n\n*5.2.1*\n\n*Sending messages using window.name*\n\
    \nFirst off, what’s the window.name property? This property stores the name of\
    \ the cur-\n\nrent window so that other windows—like the window’s parent window—can\
    \ get a ref-\n\nerence to it according to its name. This property has a valuable\
    \ peculiarity: after it’s\n\nassigned a value, that value doesn’t change when\
    \ the window is redirected to a new\n\nURL. This behavior makes it possible to\
    \ read the window.name value specified by a doc-\n\nument from a different origin,\
    \ thereby bypassing the same-origin policy and making\n\ncross-domain messaging\
    \ possible.\n\n This is a somewhat-complicated protocol, so to explain it best\
    \ we’ll use a simple\n\nHello World example. On the publisher’s side, you’ll create\
    \ a new iframe and assign\n\nits URL to a target page on your domain. When loaded,\
    \ the iframe will then initiate a\n\nnew message back to the parent window by\
    \ assigning a message string to the\n\nwindow.name property. But the parent page\
    \ can’t read this value as-is, because the\n\niframe is hosted on a different\
    \ domain (remember: SOP). To correct that, the iframe\n\nwill redirect itself\
    \ to a URL on the publisher’s domain. After the iframe is redirected,\n\nwww.it-ebooks.info"
