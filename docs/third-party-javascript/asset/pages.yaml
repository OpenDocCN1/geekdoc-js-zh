  md: "**64**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\nWhat do you suppose\
    \ the color of the span is? The answer again might be surprising:\n\n*yellow*.\
    \ Even though these rules are all primarily class-based, the second rule (.stork-\n\
    \ncontainer span) is considered more specific than the first rule, and the third\
    \ rule\n\n(.stork-container .stork-msg) more specific than the second. How does\
    \ this work?\n\nINLINE STYLES ARE KING\n\nIn terms of CSS specificity, that is.\
    \ If you recall from\n\nearlier in this chapter, we mentioned that inline styles\
    \ have the benefit of\n\nrarely conflicting with the parent page. Now it’s clear\
    \ why: they’re prioritized\n\nover every other type of regular CSS rule (excluding\
    \ those with the\n\n!important keyword). If you’re writing a particularly simple\
    \ widget, it might\n\nnot be a bad idea to use inline styles; you’ll avoid most\
    \ CSS specificity conflicts.\n\nThe browser uses a simple scoring system to determine\
    \ which rule takes priority. For a\n\ngiven rule, each selector composing that\
    \ rule is worth a certain value. Those values are\n\nsummed to create a specificity\
    \ score. When multiple rules affect the same element,\n\nthe browser compares\
    \ each rule’s specificity score, and the rule with the highest score\n\ntakes\
    \ priority. In the case of a tie, the rule that was defined last wins.\n\n Table\
    \ 3.1 revisits those CSS rule types, this time with their corresponding specific-\n\
    \nity scores.\n\n You’ll quickly notice these aren’t ordi-\n\nnary numbers. A\
    \ specificity score is actually\n\na tuple of the form (*a*, *b*, *c*, *d*), with\
    \ *a* being\n\nmore valuable than *b*, *b* being more valuable\n\nthan *c*, and\
    \ so on. That means that a style\n\ncaused by a single inline style attribute\
    \ (1, 0,\n\n0, 0) has higher specificity than a rule with\n\n*one hundred* ID\
    \ selectors (0, 100, 0, 0).\n\n So, looking back at our previous exam-\n\nple,\
    \ those CSS rules would have been assigned the following scores, with the highest-\n\
    \nscoring rule being prioritized by the browser:\n\n\n\n.stork-container (0,0,1,0—one\
    \ class selector)\n\n\n\n.stork-container span (0,0,1,1—one class selector, one\
    \ element selector)\n\n\n\n.stork-container .stork-msg (0,0,2,0—two class selectors)\n\
    \nAt this point, you should have a good handle on how CSS specificity works, and\
    \ why\n\nthe browser prioritizes some rules over others. You’ll next put this\
    \ knowledge to use,\n\nas we explore some approaches for writing CSS that stands\
    \ tall in the face of conflict-\n\ning publisher styles. \n\n*3.3.3*\n\n*Overspecifying\
    \ CSS*\n\nThe first and simplest approach to writing CSS that doesn’t conflict\
    \ with the pub-\n\nlisher’s page is to *overspecify* your rules. This means declaring\
    \ additional selectors to\n\nboost the specificity of your rules, such that when\
    \ the browser compares your rules\n\nagainst those from the parent page, they’re\
    \ likely to score higher and be prioritized.\n\nTable 3.1\n\nCSS specificity scores\n\
    \nSelector/Rule type\n\nScore\n\nInline style attributes\n\n1,0,0,0\n\nIDs\n\n\
    0,1,0,0\n\nClasses, pseudo-classes, and \n\nattributes\n\n0,0,1,0\n\nElements\
    \ and pseudo-elements\n\n0,0,0,1\n\nwww.it-ebooks.info"
