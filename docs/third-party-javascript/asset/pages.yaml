  md: "**133**\n\n***Third-party cookies***\n\nThe term *third-party cookie* is more\
    \ than just semantics. Because third parties aren’t nec-\n\nessarily acknowledged\
    \ by the browser user, those applications can set and read cookies\n\n(on their\
    \ own domain) without the user’s consent or knowledge. This can lead to pri-\n\
    \nvacy issues where distributed third-party applications have the power to track\
    \ a user’s\n\nbrowsing history by using unique identifying cookies. It’s for these\
    \ reasons that dis-\n\nabling third-party cookies happens by default in some browsers,\
    \ and is a recom-\n\nmended setting in others.\n\n This section is all about getting\
    \ acquainted with third-party cookies. We’ll look at\n\nhow you can use third-party\
    \ cookies to set and restore application state. Then you’ll\n\nsee how to disable\
    \ third-party cookies in the browser, and how this setting affects\n\nbrowsers\
    \ differently. Last, we’ll cover how to detect when third-party cookies are dis-\n\
    \nabled, and how to recover gracefully.\n\n*6.1.1*\n\n*Setting and reading sessions*\n\
    \nLet’s look at a scenario where the Camera Stork widget uses third-party cookies\
    \ to\n\nstore a user’s session. Suppose that you’ve added a link to the Camera\
    \ Stork widget,\n\nlabeled Login, that when clicked reveals a form containing\
    \ username and password\n\ninputs (see figure 6.1). For security purposes, this\
    \ form and the entire widget are con-\n\ntained within an external iframe hosted\
    \ on camerastork.com. This is to prevent code\n\non the publisher’s page from\
    \ accessing the username and password inputs.\n\nTable 6.1\n\nCookies set on domains\
    \ that differ from the parent document are considered third-party.\n\nOrigin\n\
    \nCookie domain\n\nThird-party?\n\npublisher.com\n\npublisher.com\n\nNo\n\npublisher.com\n\
    \ncamerastork.com\n\nYes\n\ncamerastork.com (from an iframe hosted on \n\npublisher.com)\n\
    \ncamerastork.com\n\nYes\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_157_0.png)\n\
    \nMikon E90 Digital SLR\n\n$599.99 – Buy now\n\nLogin and review\n\n4.3/5.0 •\
    \ 176 reviews\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_157_0.png)\n\nUsername\n\
    \nPassword\n\nSign in\n\nMikon E90 Digital SLR\n\nFigure 6.1\n\nClicking the Login\
    \ link \n\nreveals a form for authenticating \n\nwith the Camera Stork service.\n\
    \nwww.it-ebooks.info"
