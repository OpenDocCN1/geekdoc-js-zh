    \ <a> **\n\n**element inside **\n\n**widget container**\n\n**Helper**\n\n**function\
    \ for**\n\n**deriving**\n\n**container**\n\n**styles**\n\n**For anchor color,\
    \ use test **\n\n**<a> element; for other **\n\n**properties, use container**\n\
