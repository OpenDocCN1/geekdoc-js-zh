  md: "**87**\n\n***JSON with padding (JSONP)***\n\n Additionally, JSONP lacks error\
    \ handling. If the script is successfully injected, your\n\ncallback gets called,\
    \ but if not, nothing happens. This means you can’t detect cases\n\nwhere a JSONP\
    \ request has finished with a 404, 500, or any other server error. The best\n\n\
    you can do is assume the request failed after a given timeout has passed without\
    \ a\n\nresponse (say, 10 seconds) and initiate your own error callback.\n\nDON’T\
    \ USE JSONP WITH UNTRUSTED PARTIES\n\nYou have to be careful when add-\n\ning\
    \ support for JSONP because naive implementations can open serious secu-\n\nrity\
    \ vulnerabilities. Loading script tags from remote sites allows them to inject\n\
    \nany content into a website, so you’re implicitly trusting the other party. You\n\
    \nshouldn’t use JSONP to communicate with a third party unless you have com-\n\
    \nplete trust in that party.\n\nOn the security front, JSONP opens up the possibility\
    \ of *cross-site request forgery (**CSRF**)*\n\n*attacks*. A CSRF attack happens\
    \ when a malicious site causes a visitor’s browser to make\n\na request to your\
    \ server that causes a change on the server. The server thinks, because\n\nthe\
    \ request comes with the user’s cookies, that the user wanted to submit that form\
    \ or\n\nmake that request. With CSRF attacks, a malicious party can change the\
    \ victim’s prefer-\n\nences on your site, publish inappropriate or private data,\
    \ transfer funds to another\n\naccount (in the case of a bank’s web interface),\
    \ and so on. And the only thing an\n\nattacker needs to do, in the case of JSONP,\
    \ is change the response from a valid callback\n\nto any other JavaScript code!\
    \ We’ll cover CSRF attacks and other security issues in\n\nchapter 7.\n\nAN ATTEMPT\
    \ TO DEFINE A SAFER VERSION OF JSONP\n\nBecause of all the security\n\nissues\
    \ associated with JSONP, there are attempts to either replace this tech-\n\nnique\
    \ with a less hacky alternative or to fix the current approach. One such\n\nattempt\
    \ is published on json-p.org and is based on the idea of defining\n\na safer,\
    \ stricter version of JSONP. Its intention is that only a function reference\n\
    \ncan be used for the padding of the JSONP response (defined by the\n\napplication/json-p\
    \ MIME type) and nothing else. That approach could poten-\n\ntially solve the\
    \ “arbitrary JavaScript” problem, but it relies on the assumption\n\nthat all\
    \ browsers enforce that rule. Unfortunately, we’re not aware of a single\n\nbrowser\
    \ that does.\n\nLast, JSONP requests are always asynchronous. As soon as you attach\
    \ a script element\n\nto the DOM or submit a form, your browser will go on to\
    \ the next task without waiting\n\nfor the response. This is unlike XmlHttpRequest,\
    \ which traditionally operates asyn-\n\nchronously, but can be forced to block\
    \ the browser until the response is ready. Admit-\n\ntedly, the odds of you requiring\
    \ synchronous JSONP requests are low, but if you do,\n\nyou’re out of luck.\n\n\
    \ Despite these limitations, JSONP is still the third-party developer’s method\
    \ of choice\n\nfor doing cross-domain communication. It’s easy, and it works.\
    \ But there are times\n\nwhen JSONP won’t cut it: namely, when you need to make\
    \ POST or other HTTP requests.\n\nSubdomain proxies, another browser workaround\
    \ for making cross-domain requests,\n\nwww.it-ebooks.info"
