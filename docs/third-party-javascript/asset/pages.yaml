  md: "**205**\n\n***Optimizing payload***\n\nToday, we’re lucky to have some really\
    \ good minification tools—such as Google Closure\n\nCompiler, Yahoo YUI Compressor,\
    \ UglifyJS, and others—that allow for such a build pro-\n\ncess to be expressed\
    \ in a short build file. Here’s a simple build file using the granddaddy\n\nof\
    \ all build utilities, Make, that’s available for all modern operating systems:\n\
    \nCLOSUREFILE=bin/closure-compiler.js\n\nBUILDDIR=build\n\ncombine:\n\n@cat myfile1.js\
    \ myfile2.js > build.js\n\nminify: combine\n\n@java -jar $(CLOSUREFILE) --js\\\
    _output\\_file=$(BUILDDIR)/build.js\n\nNow, whenever your JavaScript application\
    \ decides which files to load, it should check\n\nwhether it’s running in a development\
    \ or production environment. If it’s a develop-\n\nment environment, your application\
    \ should load your original source code files. If it’s\n\na production environment,\
    \ your application should load the combined and minified\n\nfile produced by your\
    \ build script:\n\nif (Stork.debug) {\n\nloadScript('http://camerastork.dev/widget/myfile1.js');\n\
    \nloadScript('http://camerastork.dev/widget/myfile2.js');\n\n} else {\n\nloadScript('http://cdn.camerastork.com/12345/build/build.js');\n\
    \n}\n\nCOMBINING ASSETS IN IFRAMES\n\nDon’t forget that any iframed documents\
    \ loaded by your application represent addi-\n\ntional HTTP requests, and that\
    \ the browser must also load any resources referenced\n\ninside the iframe. So\
    \ when you combine and minify files, don’t forget about compo-\n\nnents that are\
    \ used inside of iframes.\n\n If you’re feeling bold, it’s possible to reduce\
    \ an entire HTML page to a single HTTP\n\nrequest. This is done by inlining JavaScript\
    \ and CSS directly into the page’s HTML\n\nsource code. This is a step you can\
    \ incorporate into your project’s build process:\n\n<!DOCTYPE html>\n\n<html>\n\
    \n{% if dev %}\n\n<script src=\"channel-requirements.js\"></script>\n\n{% else\
    \ %}\n\n<script>\n\n{% include channel-requirements.js %}\n\n</script>\n\n{% endif\
    \ %}\n\n</html>\n\n*9.1.2*\n\n*Reducing image requests*\n\nImages—like scripts,\
    \ stylesheets, and other web page components—require the\n\nbrowser to make a\
    \ separate HTTP request for every single file. Luckily, there are tech-\n\nniques\
    \ you can use to reduce the number of image requests made by your application.\n\
    \n**Combine separate **\n\n**files into one**\n\n**Minify the **\n\n**result with\
    \ **\n\n**Google **\n\n**Closure **\n\n**Compiler**\n\n**We use Camera **\n\n\
    **Stork’s CDN with **\n\n**versioned files **\n\n**(covered later in **\n\n**this\
    \ chapter) for **\n\n**production.**\n\n**For development, **\n\n**consider file\
    \ to **\n\n**be external**\n\n**For production, **\n\n**inject file into page**\n\
    \nwww.it-ebooks.info"
