  md: "**222**\n\nCHAPTER 9\n\n***Performance***\n\n Technically speaking, this version\
    \ of the program isn’t running any faster. But\n\nsince users will see an immediate\
    \ response from submitting their review, they’ll get the\n\nwarm fuzzy feeling\
    \ of your widget being amazingly fast. \n\n*9.3.2*\n\n*Rendering before document\
    \ ready*\n\nIn modern JavaScript development, it’s common to write code that waits\
    \ until the doc-\n\nument has finished processing before rendering anything to\
    \ the page. Otherwise, you\n\nrisk running code that queries an incomplete DOM,\
    \ and in some browsers, even risk\n\ncrashing the browser.² To hammer this point\
    \ home, nearly every popular JavaScript\n\nlibrary offers a DOM ready event handler.\
    \ For example, jQuery offers the following\n\nhelper method for executing code\
    \ only after the DOM has been fully parsed by the\n\nbrowser:\n\n$(document).ready(function()\
    \ {\n\n// Can safely modify DOM here\n\n});\n\nThis is a safe, encouraged practice\
    \ of web development. But for a third-party applica-\n\ntion developer, sometimes\
    \ the DOM ready event doesn’t happen fast enough. If you\n\nwait for it to occur\
    \ before rendering to the page, you’ll be executing at the same\n\ntime—or even\
    \ after—other JavaScript applications being run by the publisher. If some\n\n\
    of those applications are slow, or your code ends up last in the UI thread queue\
    \ and\n\nrenders after all others, your application may appear to users as having\
    \ loaded slowly,\n\neven if your JavaScript code and other resources were ready\
    \ to go.\n\n But how do you safely render to the page if the document isn’t ready?\
    \ There’s one\n\nway: by inserting either *before *or *into* a known, closed element\
    \ that has already been\n\nprocessed by the browser. Ideally this element is defined\
    \ by publishers before your\n\nscript include snippet—that way, it’s guaranteed\
    \ to exist in the DOM before your script\n\neven executes.\n\n You should never\
    \ boldly assume that this element is always available. There’s always\n\nthe possibility\
    \ that it’s added incorrectly by the publisher after the script include snip-\n\
    \npet, or even at the bottom of their HTML source. In that case, you’ll have to\
    \ fall back\n\nto waiting for the document ready event. A utility function for\
    \ determining when the\n\ndocument is safe to manipulate is shown next.\n\nfunction\
    \ onDOMReady(callback) {\n\nvar isReady = false;\n\nif (window.addEventListener)\
    \ {\n\nwindow.addEventListener('DOMContentLoaded', callback, false);\n\nreturn;\n\
    \n}\n\n2 Internet Explorer 7 can throw an Operation Aborted exception when attempting\
    \ to modify a DOM element\n\nthat isn’t closed. More here: http://support.microsoft.com/kb/927917.\n\
    \nListing 9.7\n\nCalling a function when the DOM is ready, but before the **onload**\
    \ event\n\n**Use**\n\n**DOMContent-**\n\n**Loaded event**\n\n**whenever**\n\n\
    **possible**\n\nwww.it-ebooks.info"
