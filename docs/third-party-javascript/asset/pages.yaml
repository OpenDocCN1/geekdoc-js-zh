    \ncamerastork.com\n\niframe\n\nWeb browser\n\nWeb browser\n\niframe\n\nTunnel\n\
    \nfile\n\niframe\n\nTunnel\n\nfile\n\nXmlHttpRequest\n\nFigure 4.5\n\nUsing an\
    \ intermediate tunnel file to proxy requests through a subdomain\n\nwww.it-ebooks.info"
