  md: "**175**\n\n***Implementing a bare-bones SDK***\n\n*8.1*\n\n*Implementing a\
    \ bare-bones SDK*\n\nIn this section, we’ll implement a bare-bones JavaScript\
    \ SDK for the Camera Stork web\n\nplatform. This will be a minimal library which\
    \ we’ll use to demonstrate core SDK con-\n\ncepts. It will provide three distinct\
    \ pieces of functionality:\n\n*Initialization*—Load required dependencies and\
    \ ready the SDK for use by \n\npublishers.\n\n*Widget rendering*—Public functions\
    \ that render widget instances on the \n\npublisher’s page.\n\n*Event listeners*—Functions\
    \ that enable publishers to listen and respond to \n\ninternal events occurring\
    \ in your various application components.\n\nNow, every SDK is different, and\
    \ what we cover here might not necessarily find a home\n\nin *your* real-world\
    \ SDK implementation. For example, if you’re developing a third-\n\nparty SDK\
    \ that provides tools for advanced web analytics, you probably don’t care\n\n\
    about rendering widgets. But this minimal implementation should give you a great\n\
    \nfoundation from which to start.\n\n Let’s roll up our sleeves and get started.\
    \ We’ll begin with loading the SDK’s initial\n\nscript file and introducing a\
    \ function for initializing the SDK: Stork.init. Next, we’ll\n\nimplement Stork.productWidget\
    \ for rendering widget instances on the publisher’s\n\npage. Last, we’ll provide\
    \ functions for enabling publishers to bind and respond to\n\nevents that take\
    \ place in your application: Stork.listen and Stork.unlisten.\n\n*8.1.1*\n\n*Initialization*\n\
    \nAs with all third-party scripts, in order to gain access to your SDK’s public\
    \ functions,\n\npublishers will have to load an initial script file. You’ll give\
    \ this a new filename, sdk.js,\n\nto differentiate it from the single-purpose\
    \ self-executing script (widget.js) you imple-\n\nmented in some of the early\
    \ chapters of this book. Let’s take a look at sdk.js.\n\n(function(window, undefined)\
    \ {\n\nvar Stork = {};\n\nif (window.Stork) {\n\nreturn;\n\n}\n\nfunction loadScript(callback)\
    \ {}\n\nStork.init = function(callback) {\n\nloadScript('http://camerastork.com/sdk/lib.js',\
    \ callback);\n\n};\n\nwindow.Stork = Stork;\n\n})(this);\n\nLike your initial\
    \ widget architecture from chapter 2, this creates a global Stork object\n\non\
    \ the publisher’s window. This time, there’s a single public function: Stork.init.\n\
    \nThis function is responsible for initializing the SDK and must be called by\
    \ the\n\nListing 8.1\n\nThe initial JavaScript file: sdk.js\n\n**See loadScript\
    \ function**\n\n**implementation from**\n\n**chapter 2.**\n\nwww.it-ebooks.info"
