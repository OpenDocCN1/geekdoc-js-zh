  md: "**242**\n\nCHAPTER 10\n\n***Debugging and testing***\n\nbecause it’ll affect\
    \ all other tests—not just the intended regression test. To solve this\n\nproblem,\
    \ we recommend having an isolated environment just for this regression test.\n\
    \nCREATING AN ISOLATED ENVIRONMENT FOR QUNIT TESTS\n\nThe best way to isolate\
    \ a test is to place objects that are being tested inside a newly cre-\n\nated\
    \ src-less iframe. This iframe will have a completely clean environment that’s\
    \ not\n\naffected by the outside window. Inside this iframe, you can load any\
    \ files and modify\n\nany built-in objects you want without introducing any conflicts\
    \ with existing tests. The\n\nnext listing shows how to run the test from listing\
    \ 10.2 inside an isolated iframe.\n\n...\n\n<script>\n\n$(document).ready(function\
    \ () {\n\nQUnit.module(\"JSON/broken toJSON\");\n\nQUnit.test(\"test JSON funcs\
    \ w/ modified toJSON\", function () {\n\nexpect(2);\n\nvar iframe = document.createElement('iframe');\n\
    \niframe.style.position = 'absolute';\n\niframe.style.top = '-2000px';\n\ndocument.body.appendChild(iframe);\n\
    \nvar isolatedWin = iframe.contentWindow;\n\nvar isolatedDoc = isolatedWin.document;\n\
    \nisolatedDoc.write(\n\n\"<html>\" +\n\n\"<body>\" +\n\n\"<script>Object.prototype.toJSON\
    \ = \" +\n\n\"function () { return ''; }\" +\n\n\"</script>\" +\n\n\"</body>\"\
    \ +\n\n\"</html>\"\n\n);\n\nisolatedDoc.close();\n\nListing 10.3\n\nExample of\
    \ an isolated test case using QUnit and iframes\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_266_0.png)\n\
    \nFigure 10.6\n\nExample \n\nQUnit output. The green \n\nbar means that all tests\
    \ \n\nwere successful—\n\nmeaning that everything \n\nworks as you expect it to\
    \ \n\nwork. Isn’t that nice?\n\n**Create iframe; move it **\n\n**offscreen (you\
    \ can’t use **\n\n**display=\"none\" because **\n\n**IE won’t initialize it)**\n\
    \n**Get references to window **\n\n**and document objects **\n\n**from within\
    \ iframe**\n\n**Write your**\n\n**fixture HTML**\n\n**into iframe**\n\n**Close\
    \ document immediately—**\n\n**this prevents versions of **\n\n**Internet Explorer\
    \ from hanging**\n\nwww.it-ebooks.info"
