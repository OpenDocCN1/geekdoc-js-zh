  md: "**12**\n\nCHAPTER 1\n\n***Introduction to third-party JavaScript***\n\nListing\
    \ 1.4 shows the code to implement this feature on her resume. To keep things\n\
    \nsimple, this example uses jQuery, a JavaScript library, to simplify DOM operations.\n\
    \nLearn more at http://jquery.com.\n\n<!DOCTYPE html>\n\n<html>\n\n<!-- rest of\
    \ resume HTML above -->\n\n<a href=\"#\" id=\"show-connections\">Show mutual friends</a>\n\
    \n<ul id=\"mutual-friends\">\n\n</ul>\n\n<div id=\"fb-root\"></div>\n\n<script\
    \ src=\"/js/jquery.js\"></script>\n\n<script src=\"http://connect.facebook.net/en\\\
    _US/all.js\"></script>\n\n<script>\n\n FB.init({ appId: 'FACEBOOK\\_APP\\_ID'\
    \ });\n\n $('#show-connections').click(function() {\n\n FB.login(function(response)\
    \ {\n\nvar userID;\n\n \n\nvar url;\n\n \n\nif (response.authResponse) {\n\n userID\
    \ = response.authResponse.userID;\n\n url = '/' + userID + '/mutualfriends/jill?fields=name,picture';\n\
    \n FB.api(url, showMutualFriends);\n\n \n\n}\n\n });\n\n });\n\n function showMutualFriends(response)\
    \ {\n\n var out = '';\n\n var friends = response.data;\n\n friends.forEach(function\
