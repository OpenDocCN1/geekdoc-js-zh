  md: "**188**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\n Versioning\
    \ during initialization isn’t without flaws. One such flaw is that it doesn’t\n\
    \nlet you version your initialization function (Stork.init)—you’ll have to be\
    \ careful if/\n\nwhen you modify this function, because you can accidentally introduce\
    \ breaking\n\nchanges. Additionally, this technique may be perceived as being\
    \ more complicated\n\nthan URL versioning, which most publishers are already familiar\
    \ with. As such, we\n\ndon’t necessarily endorse one technique over the other—it’s\
    \ a matter of preference. \n\n*8.3*\n\n*Wrapping web service APIs*\n\nSo far in\
    \ this chapter, we’ve looked at how a third-party JavaScript SDK can be used as\n\
    \nan alternate, more-programmable method of distributing your application. But\n\
    \nthere’s another valuable service an SDK can provide: acting as a client-side\
    \ JavaScript\n\nwrapper to your application’s web service API.\n\n By client-side\
    \ wrapper, we mean a set of handy functions that facilitate access to\n\nyour\
    \ application’s web service API. Instead of communicating with your API directly,\n\
    \nusing JSONP or even CORS, a publisher uses functions exposed by your SDK to\
    \ initiate\n\nrequests to your API.\n\n We’ll get down to implementing these functions\
    \ shortly. But first, we’ll quickly\n\nreview web service APIs and discuss how\
    \ a JavaScript wrapper offers advantages versus\n\ndirect client-side access using\
    \ JSONP or CORS. Then, we’ll implement the API wrapper\n\nfunction using easyXDM\
    \ and cross-domain messaging. Last, we’ll discuss how to\n\nensure that only registered,\
    \ identified publishers are capable of using your client-side\n\nAPI functions.\n\
    \n First up, a quick refresher on web service APIs: what they are, how they work,\
    \ and\n\nwhat they’re good for.\n\n*8.3.1*\n\n*Accessing web service APIs on the\
    \ client*\n\nIn case you’re not familiar with them, a web service API is a set\
    \ of HTTP endpoints that\n\nenable programmatic access to a web application. In\
    \ order to query the API for data, a\n\npublisher issues an HTTP request to one\
    \ of your endpoints, and the server responds\n\nwith formatted data in the HTTP\
    \ response body, usually in JSON or XML formats.\n\nHere’s a quick example of\
    \ how you can use curl, a Unix utility for issuing HTTP\n\nrequests,² to query\
    \ Twitter for a list of the 20 newest public status updates (tweets)\n\nmade by\
    \ ManningBooks, Manning Publication’s official Twitter account:\n\ncurl http://api.twitter.com/1/statuses/user\\\
    _timeline.json?\\\\\n\nscreen\\_name=ManningBooks\n\nTwitter³ responds to this\
    \ request with structured JSON data containing Manning-\n\nBooks’ user timeline.\
    \ To keep things legible, we’ve shortened this to a status update.\n\n2 curl is\
    \ installed by default on OS X and most Linux distributions. You can install it\
    \ on Windows as part of the\n\ncygwin suite of Unix-command line tools (http://cygwin.com).\n\
    \n3 Twitter has removed this endpoint; it's no longer publicly available. Such\
    \ is the dynamic nature of the web!\n\nwww.it-ebooks.info"
