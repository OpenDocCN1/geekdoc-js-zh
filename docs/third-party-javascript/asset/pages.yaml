  md: "**228**\n\nCHAPTER 10\n\n***Debugging and testing***\n\nFor our purposes, we’ll\
    \ use a similar concept: an intermediary server application that\n\nlistens for\
    \ requests to your application’s initial JavaScript file (the loader) and\n\n\
    reroutes the client to use a development version. And since you don’t want every\
    \ user\n\nto hit the proxy server—you don’t want regular users to have access\
    \ to your develop-\n\nment code—you’ll have to manually configure your browser\
    \ to use the proxy server.\n\n Figure 10.2 shows an example of two browsers accessing\
    \ the same page but getting\n\ntwo different results. A browser behind the proxy\
    \ receives a development version of\n\nCamera Stork, while everyone else gets\
    \ to use a version stored on your production\n\nservers.\n\n Proxy servers that\
    \ reroute certain types of requests from their original destination\n\nare also\
    \ known as *rewriting proxies*. Their job is to intercept, analyze, and rewrite\n\
    \nrequests passing through them.\n\n To debug the Camera Stork widget, your proxy\
    \ will intercept requests to\n\nmedia.camerastork.*com* and rewrite them as requests\
    \ to media.camerastork.*dev*. And\n\nalthough you could set up your proxy to rewrite\
    \ requests to the higher-level\n\ncamerastork.com domain, you probably don’t want\
    \ to do this. This is because your\n\nlocal computer may not have access to the\
    \ production database servers or web service\n\nAPIs provided by camerastork.com.\
    \ By rewriting only the subset of requests that load\n\nstatic resources, you’ll\
    \ make your browser use your development code while running\n\n“live” on a publisher’s\
    \ website. \n\nCONFIGURING APACHE AS A REWRITING PROXY\n\nLet’s configure Apache\
    \ as a rewriting proxy. We picked Apache because it’s the de\n\nfacto standard\
    \ web server on the web, and most UNIX\\-based operating systems\n\n(including\
    \ OS X and many Linux distributions) have a version of Apache installed by\n\n\
    default. To turn Apache into a rewriting proxy, you’ll need to enable two modules:\n\
    \nproxy and rewrite. To do so, you’ll use a special program called a2enmod. Just\
    \ run the\n\nfollowing command from your terminal:\n\n$ a2enmod proxy rewrite\n\
    \nBrowser A\n\nProxy\n\nBrowser B\n\nloader.js\n\nloader\n\nloader.js\n\nloader\n\
    \nDevelopment\n\nserver\n\nloader.min.js\n\nloader\n\nProduction\n\nserver\n\n\
    Figure 10.2\n\nTwo browsers requesting the same resource but receiving \n\ndifferent\
    \ results. Browser A goes through a proxy and receives the unminified \n\ncopy\
    \ of Camera Stork, whereas Browser B goes directly and receives a \n\nminified\
    \ version of the widget.\n\nwww.it-ebooks.info"
