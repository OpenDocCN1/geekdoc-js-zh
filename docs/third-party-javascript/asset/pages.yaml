  md: "**27**\n\n***Loading the initial script***\n\nBlocking script elements can\
    \ slow down publishers’ pages because they stop the\n\nbrowser from continuing\
    \ if the target file is slow to download—or worse, unavailable.\n\nThe higher\
    \ the publisher places the script include in their HTML source, the more\n\npronounced\
    \ the effect. For example, if the publisher decides to place the widget at\n\n\
    the top of their website, the remainder of the page won’t get rendered until the\
    \ wid-\n\nget script file loads. The worst possible result is if the publisher\
    \ adds your script\n\ninclude to their <head> section. This could block the browser\
    \ from reaching the\n\n<body> tag, such that visitors will be stuck with a blank\
    \ page until the script resolves.\n\nLIMITING THE IMPACT OF BLOCKING SCRIPTS\n\
    \nOne way to limit the effect of blocking scripts is to advise publishers to place\
    \ the script\n\ninclude at the end of their HTML source. That way, if your script\
    \ is slow, it won’t matter\n\n(as much) because the browser has already rendered\
    \ the page. The downside is that\n\nyou can’t rely on the script element’s position\
    \ in the DOM to determine where to ren-\n\nder your widget. But you can always\
    \ ask publishers to identify the target render loca-\n\ntion separately using\
    \ a uniquely identified element:\n\n<body>\n\n<div id=\"camerastork-widget\"/>\n\
    \n<p>Hello, world</p>\n\n<script\n\nsrc=\"http://camerastork.com/widget.js?product=1234\"\
    ></script>\n\n</body>\n\nIn this example, when widget.js loads, it’ll render the\
    \ product widget and append it to\n\nthe <div> element with id=\"camerastork-widget\"\
    . From a performance perspective,\n\nthis is better than the earlier script include,\
    \ because it doesn’t block the publisher’s\n\npage (although the total load time\
    \ will be about the same). But this is contingent on\n\nthe publisher correctly\
    \ placing the script include at the end of their HTML source.\n\nAnd experience\
    \ tells us this isn’t always a given.\n\n The bigger takeaway is that if widget.js\
    \ isn’t outputting HTML in-place, it’s not mak-\n\ning use of document.write.\
    \ And if widget.js isn’t using document.write, the browser\n\nshould theoretically\
    \ not have to pause rendering while it’s executing. But unfortu-\n\nnately the\
    \ browser doesn’t know this; only we do. What if there were a way to tell the\n\
    \nbrowser that our script can be loaded without blocking the page?\n\n*2.2.2*\n\
    \n*Nonblocking scripts with async and defer*\n\nBrowser vendors have long recognized\
    \ that synchronous script loading isn’t ideal. To\n\nremedy this, the W3C has\
    \ introduced two helpful attributes for the <script> tag—\n\ndefer and async —that\
    \ indicate that the file can be downloaded without blocking the\n\nbrowser.\n\n\
    THE DEFER SCRIPT ATTRIBUTE\n\nThe first of these, defer, was first introduced\
    \ as part of HTML4. When specified on a\n\n<script> tag, it tells the browser\
    \ that the script file won’t generate any document con-\n\ntent (using document.write),\
    \ and can safely be downloaded without blocking the\n\nwww.it-ebooks.info"
