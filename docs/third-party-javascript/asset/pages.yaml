  md: "**83**\n\n***JSON with padding (JSONP)***\n\nThe browser receives this response\
    \ as a string. In order to be useful, it has to be con-\n\nverted to a JavaScript\
    \ object. This can be done using the browser’s native JSON.parse\n\nfunction,\
    \ or some other JSON library method when the native JSON object is unavail-\n\n\
    able (older browsers).\n\n Of course, XMLHttpRequest only works across the same\
    \ domain because of the\n\nsame-origin policy. But as we mentioned earlier, you\
    \ can request this same URL using a\n\n<script> element, which is immune to the\
    \ SOP:\n\n<script src=\"http://thirdpartyjs.com/info.json\"></script>\n\nBy requesting\
    \ this resource via a <script> element, the browser will evaluate the JSON\n\n\
    response as JavaScript immediately after the file is loaded. Then you’re free\
    \ to use the\n\nresponse data as you please, right? Not quite.\n\n First, although\
    \ this response is valid JSON and looks an awful lot like a normal\n\nJavaScript\
    \ object, it’s actually *not* valid JavaScript. When the browser attempts to evalu-\n\
    \nate the response as JavaScript, it’ll fail with a syntax error. This is because\
    \ JavaScript\n\ninterpreters parse the opening curly brace as the beginning of\
    \ a block statement, and\n\nexpect it to be followed by one or more valid JavaScript\
    \ statements.\n\n But suppose that this response *is* a valid JavaScript object,\
    \ and the object is evalu-\n\nated by the browser without error. Because the object\
    \ isn’t stored, either by being\n\nassigned to a variable or passed as a parameter\
    \ to a function, the browser will discard\n\nit. There’s no way to capture the\
    \ actual response body during any step of the script\n\nelement’s loading process,\
    \ so there’s no alternate way of capturing the JSON payload.\n\nCAPTURING JSON\
    \ OUTPUT\n\nBut what if instead of returning a naked JSON object, the server returned\
    \ a JavaScript\n\nstatement that somehow stored this object? For example, what\
    \ if an alternate URL,\n\nhttp://thirdpartyjs.com/info.js (different file extension—.js\
    \ instead of .json),\n\nreturned the following:\n\nvar jsonResponse = {\n\n'title':\
    \ 'Third-party JavaScript',\n\n'authors': \\['Anton', 'Ben'\\],\n\n'publisher':\
    \ 'Manning'\n\n};\n\nNow the JSON object can be accessed after the file has been\
    \ loaded via the global vari-\n\nable jsonResponse. You can use the <script> element’s\
    \ load event to notify your\n\ncode when the variable contains the requested data.\n\
    \n An alternate approach is to pass the JSON object via a callback function instead\
    \ of\n\na global variable:\n\njsonHandler({\n\n'title': 'Third-party JavaScript',\n\
    \n'authors': \\['Anton', 'Ben'\\],\n\n'publisher': 'Manning'\n\n});\n\nThe nice\
    \ thing about using a callback function to capture the output is that you no\n\
    \nlonger have to rely on the <script> element’s load event in order to know when\
    \ the\n\nwww.it-ebooks.info"
