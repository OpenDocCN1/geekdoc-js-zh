  md: "**203**\n\n***Optimizing payload***\n\nmeant millions of dollars in lost revenue.\
    \ Amazon did a similar experiment as well,\n\nand found out that even very small\
    \ delays—increments of 100 milliseconds—resulted\n\nin a significant drop in revenue\
    \ (see http://mng.bz/73U0).\n\n These examples show that users want their websites\
    \ to load faster and be more\n\nresponsive, and they’re ready to vote with their\
    \ wallets. And although it’s true that\n\nhigh-traffic giants—such as Google,\
    \ Yahoo!, or Facebook—benefit from small tweaks\n\nto reduce their bandwidth,\
    \ the biggest reason why these experiments showed drops in\n\ntraffic was due\
    \ to a reduced user experience. This is a crucial argument, especially for\n\n\
    third-party JavaScript applications. People don’t visit your application directly;\
    \ they go\n\nto a website that happens to have your application installed. And\
    \ there they expect to\n\nsee all the parts of the website working neatly together.\
    \ Any significant delay between\n\nthe moment that website loads and the moment\
    \ your application takes effect on the\n\npage will likely result in a reduced\
    \ user experience.\n\n How upset can users get? At Disqus, when our widget fails\
    \ to load quickly enough\n\non publisher websites, visitors commonly voice their\
    \ concerns to publishers, with com-\n\nplaints like “Disqus seriously slows down\
    \ the \\[whole\\] page.” If your application is slow,\n\nusers will be quick to\
    \ blame all issues affecting the publisher’s website on you, whether\n\nyou’re\
    \ genuinely at fault or not. But, luckily, it cuts both ways: if your application\
    \ is\n\nfast, people will interact more with it, generate more content, and add\
    \ more value to\n\nyour service in publishers’ eyes.\n\n Optimizing your application\
    \ is more than just tuning your web and database serv-\n\ners to respond faster.\
    \ In this chapter, we’ll cover techniques you—as front-end engi-\n\nneers—can\
    \ use to significantly improve the delivery, execution, and responsiveness of\n\
    \nyour applications. We’ll start with optimizing your application’s payload, then\
    \ cover\n\nJavaScript runtime performance, and finally look at improving perceived\
    \ perfor-\n\nmance. By the time you’re done reading this chapter, you’ll know\
    \ how to make your\n\napplication lightning fast and, perhaps more important,\
    \ how *not* to make it slow. Full\n\nspeed ahead!\n\n*9.1*\n\n*Optimizing payload*\n\
    \nIn front-end speak, *payload* is everything that a normal, graphical browser\
    \ has to down-\n\nload in order to run your application. This includes not just\
    \ JavaScript and CSS files,\n\nbut also images, font files, HTML documents used\
    \ for cross-domain channels, and data\n\nreturned from a web service API. We’re\
    \ talking about every conceivable resource an\n\napplication needs to load in\
    \ order to operate.\n\n But which files an application needs to download often\
    \ depends on how a user\n\ninteracts with an application—which can vary. So, when\
    \ thinking about front-end per-\n\nformance, your goal should be to optimize your\
    \ application for the average user. This\n\nis why we prefer to focus on what\
    \ we call the *initial payload*: the minimum set of\n\nresources a browser has\
    \ to download in order to initialize and load your third-party\n\nJavaScript application\
    \ for an average visitor.\n\nwww.it-ebooks.info"
