  md: "**99**\n\n***Cross-origin resource sharing***\n\n*4.4*\n\n*Cross-origin resource\
    \ sharing*\n\nThe two techniques we covered so far—JSONP and subdomain proxies—can\
    \ be\n\nloosely described as “hacks.” We showed how you can bypass the same-origin\
    \ policy\n\nrestrictions by utilizing some elements in a way they weren’t designed\
    \ to be used.\n\nCross-origin resource sharing (CORS) is the first “official”\
    \ technique. It’s actually a\n\nW3C Working Draft that defines how the browser\
    \ and the server can communicate\n\nacross domains in a controlled manner. CORS\
    \ accomplishes this through a series of\n\nspecial HTTP headers that allow both\
    \ parties (the browser and the server) to deter-\n\nmine whether the request should\
    \ succeed or fail.\n\n Before we go over those headers, first, some history. Cross-origin\
    \ support was ini-\n\ntially proposed for inclusion in VoiceXML, the W3C standard\
    \ format for interactive\n\nvoice dialogues between a human and a computer. It\
    \ was decided that the cross-origin\n\nmechanism wasn’t specific to VoiceXML,\
    \ and was eventually separated into an Imple-\n\nmentation Note. Another working\
    \ group—W3C WebApps WG—with help from major\n\nbrowser vendors began an effort\
    \ to formalize the document into a Working Draft.\n\nCORS is now on track toward\
    \ formal W3C Recommendation status. But don’t let its\n\nunfinalized state scare\
    \ you—CORS already has significant browser support, and any\n\nchanges to the\
    \ specification going forward are likely to be relatively minor.\n\n In this section,\
    \ you’ll learn how to send simple HTTP requests between different\n\norigins with\
    \ CORS. You’ll also learn about CORS preflight requests, and how they can\n\n\
    be used to validate client access to a resource. Lastly, we’ll also go over browser\
    \ sup-\n\nport issues; not all browsers have implemented the full CORS specification.\n\
    \n*4.4.1*\n\n*Sending simple HTTP requests*\n\nWhen initiating cross-origin HTTP\
    \ requests, browsers that support CORS indicate the\n\norigin of the request by\
    \ including an extra header called Origin. The value of this\n\nheader is the\
    \ same triple as the one used by the same-origin policy—protocol, host\n\nand\
    \ port:\n\nOrigin: http://www.example.com/\n\nThe server’s job is to check that\
    \ header and decide whether the request should be\n\nallowed. If it decides in\
    \ favor of the request, it must send back a response with an\n\nAccess-Control-Allow-Origin\
    \ header echoing back the same origin that was sent:\n\nAccess-Control-Allow-Origin:\
    \ http://www.example.com/\n\nThe server can also send a wildcard (\"\\*\") if\
    \ the resource is public and pages from all\n\norigins are allowed to make requests\
    \ to that server:\n\nAccess-Control-Allow-Origin: \\*\n\nIf the request doesn’t\
    \ have an Origin header (perhaps it’s from a browser that doesn’t\n\nsupport CORS),\
    \ the server shouldn’t send any CORS headers back.\n\n Now, when the browser receives\
    \ the corresponding HTTP response from the server,\n\nit checks the value of Access-Control-Allow-Origin.\
    \ Its value must exactly match the\n\nwww.it-ebooks.info"
