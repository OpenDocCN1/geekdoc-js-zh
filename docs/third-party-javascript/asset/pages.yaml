    \ ) {\n\n...\n\n})(window);\n\nvar Stork = Stork || {};\n\nStork.$ = Stork.jQuery\
    \ = jQuery.noConflict(true);\n\nNot all libraries will have a helper function\
    \ like jQuery’s noConflict. Depending on\n\nthe library, you may have to go to\
    \ greater lengths to ensure that your file includes\n\ndon’t conflict with versions\
    \ that already exist on the global namespace.\n\nWHAT ABOUT LIBRARIES LOADED FROM\
    \ A CDN?\n\nGoogle, Microsoft, and other\n\ncompanies offer free hosting of popular\
    \ JavaScript libraries on high perfor-\n\nmance CDNs (content delivery networks).\
    \ These services are great because\n\nCDNs are distributed around the world, serve\
    \ files ridiculously fast, and free\n\nyou from having to serve files yourself.\
    \ The downside is that you can’t modify\n\nthe original library source code, which\
    \ makes it difficult for use in embedded\n\nscripts.\n\nIt’s worth noting that\
    \ loading external libraries isn’t a hard requirement for develop-\n\ning third-party\
    \ scripts. For the complex Camera Stork widget, helper libraries like\n\njQuery\
    \ are a terrific asset. But if you’re developing an application that’s small in\n\
    \nscope, or has few DOM interactions, libraries might introduce unnecessary overhead.\n\
    \njQuery, when minified and gzipped, has historically weighed over 30 kilobytes.⁵\
    \ That\n\nmight be too much for a small tracking application or script designed\
    \ for mobile web\n\npages. Use your best judgment.\n\n We should also point out\
