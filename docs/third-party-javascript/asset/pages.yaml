  md: "**124**\n\nCHAPTER 5\n\n***Cross-domain iframe messaging***\n\n At this point,\
    \ both your consumer and provider sockets are loaded and configured\n\nto receive\
    \ messages. It follows that the next course of action is actually *sending* mes-\n\
    \nsages. To send a message, you need to call the postMessage method on your socket\n\
    \ninstance:\n\nsocket.postMessage(\"Hello, World!\");\n\nDepending on where you\
    \ send your message from—consumer or provider—the other\n\ncommunicating party\
    \ will receive that message and invoke its onMessage handler with\n\n\"Hello,\
    \ World!\" as its first parameter.\n\n Figure 5.4 illustrates the complete easyXDM.Socket\
    \ initialization process.\n\n You just learned how to send and receive string\
    \ messages using easyXDM.Socket.\n\nThough sending messages is enough for simple\
    \ applications, in our experience, most\n\nof the time you’ll want to maintain\
    \ some kind of state between your consumer and pro-\n\nvider and define strict\
    \ interfaces that both parties can access to communicate with each\n\nother. Fortunately,\
    \ easyXDM supports these cases through the easyXDM.Rpc object. \n\neasyXDM handles\
    \ the \n\ndetails of sending messages\n\nusing whatever method the \n\nbrowser\
    \ supports.\n\n1\\. Create socket to provider at camerastork.com/xdm/provider;\n\
    \n supply callback.\n\n2\\. easyXDM loads provider URL \n\nin a hidden frame.\n\
    \n3\\. Code in iframe creates socket to \n\nmain window, with its own callback.\n\
    \n4\\. Code on either page can now call sendMessage() \n\nto invoke the other\
    \ page’s callback.\n\nSocket 1\n\nSocket 2\n\nSocket 1\n\n\\[ Transport \\]\n\n\
    iframe\n\nFigure 5.4\n\n**easyXDM.Socket** lets you \n\npass messages between\
    \ \n\niframe documents without \n\nworrying about the details.\n\nwww.it-ebooks.info"
