  md: "**xiii**\n\n*foreword*\n\nYou, as a third-party JavaScript developer, have\
    \ a multitude of concerns you need to\n\nmanage to ship code across a number of\
    \ sites and platform combinations. Never\n\nbefore have the details and best practices\
    \ of making solid distributable JavaScript\n\nbeen codified in such depth as they\
    \ are in this book. This can be a tricky business, so\n\nallow me to illustrate\
    \ the potential for unintended consequences by telling you a story\n\nabout Douglas\
    \ Crockford, who created one of the most widely distributed third-party\n\nscripts,\
    \ and a site called OnlineBootyCall.\n\nJSON (JavaScript Object Notation) is a\
    \ subset of JavaScript that was codified\n\nby Douglas. Back in 2005, he wrote\
    \ json.js, a small library that could parse JSON\n\ninto JavaScript objects and\
    \ stringify back in the other direction. It enjoyed significant\n\nadoption immediately,\
    \ but it added the Object.prototype.toJSONString and\n\nString.prototype.parseJSON\
    \ methods which threw many folks for a loop. \n\n In October 2007, Douglas put\
    \ out json2.js. It’s not uncommon for developers to\n\nhotlink existing JavaScript\
    \ versions, and Douglas’s own copy got its fair share. Soon,\n\nhis hosting company\
    \ emailed him asking about the unusually high traffic from a site\n\ncalled OnlineBootyCall.com.\
    \ Douglas had included in the json2.js code a message\n\nthat warned: “Use your\
    \ own copy. It is extremely unwise to load code from servers you\n\ndo not control.”\
    \ He added a browser-locking, synchronous, and JavaScript-freezing\n\nmodal alert().\
    \ The result? A pop-up on every page load of OnlineBootyCall. Ouch.\n\n In this\
    \ case, Doug was a third-party script developer protecting himself from his\n\n\
    users. But more often, it’s the other way around. For example, json2.js came about\n\
    \npartly because Doug’s Object.prototype augment wasn’t friendly. \n\nwww.it-ebooks.info"
  merge: -1
  pgno: 13
- img_proc: true
  md: "FOREWORD\n\n**xiv**\n\n This book, written by two of the most expert developers\
    \ on the subject, takes\n\ninventory of all the current techniques and unveils\
    \ them one by one to help you write\n\nbattle-hardened script for the first deployment.\
    \ I hope this book will serve you well,\n\nand that you’ll be as excited about\
    \ the next generation of the web as I am. \n\nPAUL IRISH\n\nDEVELOPER RELATIONS:\n\
    \nGOOGLE CHROME, JQUERY\n\nLEAD DEVELOPER:\n\nMODERNIZR AND HTML5 BOILERPLATE\n\
    \nwww.it-ebooks.info"
  merge: -1
  pgno: 14
- img_proc: true
  md: "**xv**\n\n*preface*\n\nIn February of 2010, I was on the phone with Jason Yan,\
    \ CTO and cofounder of a\n\nweb startup called Disqus. At the time, Disqus was\
    \ a tiny company behind a fast-\n\ngrowing commenting application, distributed\
    \ as a third-party script and popular with\n\nbloggers and a handful of large\
    \ media companies. Jason was interviewing me for a\n\nJavaScript engineering role—their\
    \ first hire dedicated to working on a fast-growing\n\nclient codebase.\n\n After\
    \ a handful of standard JavaScript interview questions involving classes, proto-\n\
    \ntypes, and scopes, Jason took a different tack. He asked me the following (roughly\n\
    \nparaphrased) question: “Let’s say I’ve taken a native function prototype—like\n\
    \nArray.prototype.indexOf and assigned it a new value. How would you get the origi-\n\
    \nnal value back?”\n\n I was dumbstruck. This was a problem I had never encountered\
    \ before, and I\n\ndidn’t know the answer. Jason explained to me that the Disqus\
    \ application executes in\n\nenvironments they don’t control. And in those environments,\
    \ native properties are\n\nsometimes overwritten or mangled, properties that they\
    \ depend on.\n\n I wasn’t about to give up on the question. So in the middle of\
    \ the interview, I\n\nopened up my browser’s JavaScript console, and started fiddling\
    \ around with function\n\nprototypes. In a few short minutes, I made the startling\
    \ discovery that you could use\n\nJavaScript’s delete operator on a modified native\
    \ property, and the browser would\n\nrestore the original value.\n\n Jason, as\
    \ it turns out, was unaware of this solution. He tried out the technique him-\n\
    \nself and, sure enough, it worked. We were equally excited at this new discovery.\
    \ We\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 15
- img_proc: true
  md: "PREFACE\n\n**xvi**\n\nbegan talking, discussing Disqus’ current solution to\
    \ this problem, and the interview\n\nchanged from a serious interrogation into\
    \ an excited conversation about iframes,\n\nbrowser hacks, and other scripting\
    \ gotchas.\n\n I didn’t know it at the time, but this was my first taste of *Third-party\
    \ JavaScript; *of\n\nsolving problems that only affect client applications running\
    \ in other people’s web\n\nenvironments; of discovering techniques and practices\
    \ that some web developers may\n\nnever be aware of. And I was hooked.\n\n Several\
    \ more interviews and two months later, I joined the Disqus team, which only\n\
    \nhad seven employees at the time, in San Francisco. That was where I met Anton\
    \ Koval-\n\nyov, my new coworker, fellow JavaScripter, and future coauthor. For\
    \ the next two-plus\n\nyears, Anton and I were responsible for maintaining and\
    \ developing Disqus’ client-\n\nside code. Disqus continued to grow—rapidly. By\
    \ 2012, it was installed on hundreds of\n\nthousands of web pages, and received\
    \ over 5 billion page views per month. Its custo-\n\nmers included CNN, MLB, IGN,\
    \ Time.com, Rolling Stone, and dozens of other major\n\nweb and media properties.\n\
    \n During that period of time, Anton and I learned dozens of helpful tricks, tips,\
    \ and\n\nhacks for third-party scripters, most of which we learned the hard way,\
    \ and some of\n\nwhich we kept under wraps intentionally, because they gave us\
    \ a technological edge.\n\n In this book, we’ve pooled our collective knowledge\
    \ about third-party JavaScript.\n\nNot only do we think our book will help third-party\
    \ scripters everywhere, we also think\n\nthat the practices we discuss may help\
    \ make the web a better place for everybody. We\n\nhope that by the end of reading\
    \ it, you’ll agree. \n\nBEN VINEGAR\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 16
- img_proc: true
