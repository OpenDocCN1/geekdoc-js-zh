  md: "**77**\n\n*Communicating*\n\n*with the server*\n\nIn previous chapters you\
    \ learned how to distribute, load, and render a third-party\n\nJavaScript application\
    \ on the publisher’s web page. You’re off to a great start, but so\n\nfar your\
    \ application only has access to the predefined data embedded in your\n\nJavaScript\
    \ files. Unless you’re dealing with small, unchanging datasets, at some\n\npoint\
    \ you’ll need to make dynamic requests for data from your servers. And if your\n\
    \napplication is collecting data, either passively or directly via user input,\
    \ you’ll likely\n\nwant to push that data to your servers too.\n\n Let’s go back\
    \ to the Camera Stork widget example from the previous two chap-\n\nters. As the\
    \ premier destination for cameras and camera accessories online, the\n\n*This\
