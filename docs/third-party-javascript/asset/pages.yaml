  md: "**101**\n\n***Cross-origin resource sharing***\n\nfunction makeCORSRequest(url,\
    \ method) {\n\nif (typeof XMLHttpRequest === \"undefined\") {\n\nreturn null;\n\
    \n}\n\nvar xhr = new XMLHttpRequest();\n\nif (\"withCredentials\" in xhr) {\n\n\
    xhr.open(method, url, true);\n\n} else if (typeof XDomainRequest !== \"undefined\"\
    ) {\n\nxhr = new XDomainRequest();\n\nxhr.open(method, url);\n\n} else {\n\nxhr\
    \ = null;\n\n}\n\nreturn xhr;\n\n}\n\nDETERMINING VALID ORIGINS\n\nCORS enables\
    \ your servers to accept or block\n\nHTTP requests that originate from a specific\
    \ origin. It’s up to you to deter-\n\nmine whether an origin header value is valid.\n\
    \nIf you want to make a server endpoint accessible to third-party code execut-\n\
    \ning on any arbitrary domain (like the Camera Stork widget), your endpoint\n\n\
    should return Access-Control-Allow-Origin: \\*. This is perhaps the most\n\ncommon\
    \ use case for CORS, but remember—it means a request to your end-\n\npoint can\
    \ be made from any origin.\n\nIf you’re developing an application that should\
    \ only be accessible for a\n\nsmall list of vetted publishers, your server endpoint\
    \ should verify the request’s\n\nOrigin value against a list of allowed publisher\
    \ domains. If your application\n\nrecognizes the domain, the server should return\
    \ Access-Control-Allow-\n\nOrigin: vettedpublisher.com.\n\nAfter you’ve figured\
    \ out which object is supported, you’ll use that object to issue an\n\nHTTP request.\
    \ Fortunately, both the XMLHttpRequest and XDomainRequest objects\n\nexpose pretty\
    \ much the same API, so you don’t need any additional browser checks to\n\ninitiate\
    \ the request:\n\nvar req = makeCORSRequest('http://example.com/', 'GET');\n\n\
    if (req) {\n\nreq.onload = function () { /\\* ... \\*/ };\n\nreq.send();\n\n}\n\
    \nGeared with this knowledge, you can now start sending requests from your third-party\n\
    \napplication to your servers using the makeCORSRequest function. This function\
    \ will\n\nwork for plain, ordinary HTTP requests that use standard HTTP methods\
    \ (GET and\n\nPOST). But there is a class of nonsimple requests for which CORS\
    \ requires some addi-\n\ntional work. \n\nListing 4.8\n\nA function to make cross-origin\
    \ requests using CORS\n\n**Standards-compliant **\n\n**browser with CORS **\n\n\
    **support**\n\n**Internet Explorer **\n\n**with CORS support**\n\n**Browser doesn’t\
    \ **\n\n**support CORS**\n\nwww.it-ebooks.info"
