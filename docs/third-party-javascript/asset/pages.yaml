  md: "**100**\n\nCHAPTER 4\n\n***Communicating with the server***\n\nvalue of the\
    \ Origin header that was sent to the server (or \"\\*\"). If the header is missing\n\
    \nor the origins don’t match, the browser disallows the request. If the value\
    \ is present\n\nand matches Origin, the browser can continue processing the request.\n\
    \n Figure 4.8 illustrates a simple cross-domain HTTP request with CORS.\n\nXMLHTTPREQUEST\
    \ AND XDOMAINREQUEST\n\nWhat’s great about CORS is that it’s implemented today\
    \ by nearly all modern browsers.\n\nGoogle Chrome, Mozilla Firefox, and Apple\
    \ Safari all support CORS through the\n\nXMLHttpRequest object. Microsoft added\
    \ support for CORS in Internet Explorer 8, but\n\nthrough the XDomainRequest object\
    \ instead of XMLHttpRequest. And you don’t need\n\nto explicitly enable CORS;\
    \ it’ll be automatically triggered as soon as you try to make a\n\ncross-origin\
    \ request. If the browser doesn’t support CORS, XMLHttpRequest will raise a\n\n\
    permission exception when trying to open a resource from a different origin.\n\
    \nCamera Stork\n\nOrigin: \n\nhttp://camerastork.com/\n\nOrigin: \n\nhttp://othersite.com/\n\
    \nNo headers\n\nhttp://camerastork.com \n\nOther website\n\nServer\n\nAccess-Control-Allow-Origin:\
    \ \n\nhttp://camerastork.com/\n\nhttp://othersite.com \n\nhttp://api.camerastork.com\n\
    \nFigure 4.8\n\nCross-domain HTTP request with CORS. A request from the camerastork.com\
    \ to \n\napi.camerastork.com is permitted, so the server sends an appropriate\
    \ response. A request from \n\nOther website isn’t allowed, so the server doesn’t\
    \ return any CORS headers.\n\nwww.it-ebooks.info"
