  md: "**207**\n\n***Optimizing payload***\n\n The solution to this problem came in\
    \ the shape of data URIs and Base64-encoded\n\nimages. The data URI scheme allows\
    \ you to include otherwise external data inline,\n\nwithout making an additional\
    \ network request. This is great, except you can’t just\n\ncopy and paste an image\
    \ into your source code—you have to first convert the binary\n\nimage file into\
    \ an ASCII\\-compatible format. And this is where Base64—an encoding\n\nscheme\
    \ that allows you to represent binary data as an ASCII string—comes in handy.\n\
    \nWhen used together, data URIs and Base64-encoded images provide a great tool\
    \ to\n\ninline images instead of making additional network requests. And conveniently\
    \ for all\n\nweb developers, there are plenty of web-based utilities that make\
    \ it easy to convert\n\nyour images into their Base64 counterparts.\n\n Listing\
    \ 9.1 shows a snippet of JavaScript code that displays a (small) Disqus logo.\n\
    \nTo do this, it creates an img DOM element, and then assigns a Base64-encoded\
    \ string\n\ncontaining the image data to the element’s src attribute using the\
    \ data URI scheme.\n\nvar logo = \"iVBORw0KGgoAAAANSUhEUgAAAEcAA...\";\n\nvar\
    \ container = document.getElementById('dsq-logo');\n\ncontainer.innerHTML = '<img\
    \ width=\"71\" height=\"17\" ' +\n\n'src=\"data:image/png;base64,' + logo + '\"\
    />';\n\nNote that, unfortunately, this technique doesn’t work in Internet Explorer\
    \ 7 and ear-\n\nlier. For these browsers, you’ll have to degrade to loading images\
    \ the old-fashioned\n\nway—by requesting them over the network. \n\n*9.1.3*\n\n\
    *Caching files*\n\nSo far, we’ve been assuming that the browser loads resources\
    \ as if it has just seen them\n\nfor the first time. But as you probably already\
    \ know, this is simply not true. Browsers\n\nuse a cache to reduce the number\
    \ of HTTP requests and decrease the size of HTTP\n\nresponses, making your application\
    \ load faster. You can help the browser out by speci-\n\nfying Expires and Cache-Control\
    \ headers in your HTTP responses, which tell the\n\nbrowser for how long it’s\
    \ safe to use the cached copy of a resource. For example, this is\n\na far-future\
    \ Expires header that tells the browser that the file won’t be updated until\n\
    \nNovember 10, 2018:¹\n\nExpires: Sun, 10 Nov 2018 18:00:00 GMT\n\nBut it’s really\
    \ hard to guess what’s an optimal expiration time for a static component\n\nof\
    \ your application. Make it too short, and you don’t use the cache to its fullest.\
    \ Make\n\nListing 9.1\n\nEmbedding an image into JavaScript source code\n\n1 This\
    \ value could be 30 minutes in the future, a day, a week, or a year. We chose\
    \ 2018 so that this book will still\n\nfeel new in 2017!\n\n**Disqus logo PNG\
    \ as **\n\n**Base64-encoded string **\n\n**(abbreviated for clarity)**\n\n**Append\
    \ as img tag **\n\n**using data URI scheme**\n\nwww.it-ebooks.info"
