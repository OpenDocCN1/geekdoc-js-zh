  md: "**216**\n\nCHAPTER 9\n\n***Performance***\n\nlisting 9.5, remembers the most\
    \ recent time when the original function was called and\n\nexecutes it again only\
    \ when the specified time has passed. The time value is passed as\n\nan argument\
    \ to throttle and can vary according to your preferences. Throttling a\n\nfunction\
    \ can be useful when you want to limit your function’s execution frequency,\n\n\
    regardless of how often it’s being called.\n\nfunction throttle(el, name, handler,\
    \ delay) {\n\nvar last = (new Date()).getTime();\n\nfunction wrapper(ev) {\n\n\
    var now = (new Date()).getTime();\n\nif (now - last >= delay) {\n\nlast = now;\n\
    \nhandler(ev);\n\n}\n\n}\n\nel.addEventListener(name, wrapper, false);\n\n}\n\n\
    If you look closely at the code from listing 9.5 you’ll notice that throttling\
    \ doesn’t\n\nguarantee that your code will be called every *N* milliseconds. If\
    \ the code that uses a\n\nthrottled function suddenly stops calling it, the original\
    \ function won’t be executed a\n\nfinal time unless it occurs exactly on the throttle\
    \ interval.\n\n Debounce makes sure that the wrapped function is called only once\
    \ after the *begin-*\n\n*ning* or *end* of a continuous sequence of calls. The\
    \ implementation shown in listing 9.6\n\nmonitors the frequency of calls, and\
    \ only executes the wrapped function after a pre-\n\ndefined interval of time\
    \ (the delay) has passed without a subsequent call. For exam-\n\nple, suppose\
    \ that a function has been wrapped with debounce using a delay of 1\n\nsecond\
