  md: "**95**\n\n***Subdomain proxies***\n\nThere’s one critical problem. If you try\
    \ running this code, you’ll notice that the page\n\nhas been reloaded, and now\
    \ points at the URL in the form action (see figure 4.6). This\n\nis normal behavior\
    \ when submitting HTML forms, but normal isn’t what we’re after;\n\nwe want to\
    \ submit the form without changing the browser’s URL.\n\nIFRAME\\-TARGETING FORMS\n\
    \nFortunately, forms in HTML have a special attribute named target that you can\
    \ use to\n\ncause your form to load its response in a specific window object—including\
    \ iframes.\n\nWhen the response is loaded in the iframe, the current page URL\
    \ is left as-is. So, as\n\nyou may have already guessed, you’ll need to modify\
    \ your code to first create a hidden\n\niframe and have the created form target\
    \ it.\n\nvar frame = document.createElement(\"iframe\");\n\nframe.name = \"post-review\"\
    ;\n\nframe.style.display = \"none\";\n\nvar form = document.createElement(\"form\"\
    );\n\nform.action = \"http://camerastork.com/products/1234/reviews/\";\n\nform.method\
    \ = \"POST\";\n\nform.target = \"post-review\";\n\nvar score = document.createElement(\"\
    input\");\n\nListing 4.7\n\nHTML form submitted into a hidden iframe\n\nJavaScript\
    \ creates and \n\nposts hidden form\n\nPage disappears and is replaced \n\nwith\
    \ form result — oops!\n\npublisher.com\n\ncamerastork.\n\npublisher.com\n\npublisher.com\n\
    \ncamerastork.\n\npublisher.com\n\nWeb browser\n\ncamerastork.\n\npublisher.com\n\
    \n<form response>\n\nWeb browser\n\npublisher.com\n\nFigure 4.6\n\nSubmitting\
    \ the form as-is causes the form response to load in the \n\nparent window. Because\
    \ this redirects away from the publisher’s page, this \n\nbehavior is undesirable.\n\
    \n**Create iframe element **\n\n**and assign it unique **\n\n**name attribute**\n\
    \n**Create form **\n\n**element and have it **\n\n**target iframe**\n\nwww.it-ebooks.info"
