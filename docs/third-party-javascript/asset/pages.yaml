  md: "**73**\n\n***Embedding content in iframes***\n\nform property names (such as\
    \ background-color) and camel-case versions of those\n\nnames (backgroundColor)\
    \ where they differ, because the now-deprecated Microsoft\n\naccessor (node.currentStyle)\
    \ uses the latter.\n\n Next up is to use this function to determine which styles\
    \ should be applied to your\n\niframe. To do this, you should use getStyle to\
    \ query some basic styles on the con-\n\ntainer element that’s the direct parent\
    \ of your widget (after it has been inserted into\n\nthe publisher’s DOM). These\
    \ are the styles that would’ve been inherited by your wid-\n\nget, if it wasn’t\
    \ being stowed away in an iframe.\n\n The function in the following listing uses\
    \ getStyle to find out the font color,\n\nbackground color, font direction, font\
    \ family, and anchor color of a given container\n\nelement.\n\nfunction getBasicStyles(container)\
    \ {\n\nvar anchor = document.createElement('a');\n\ncontainer.appendChild(anchor);\n\
    \nfunction get(prop, camel) {\n\nreturn getStyle(container, prop, camel);\n\n\
    }\n\nvar styles = {\n\nanchorColor\n\n: getStyle(anchor, 'color'),\n\nfontColor\n\
    \n: get('color'),\n\nbackgroundColor : get('background-color', 'backgroundColor'),\n\
    \ndirection\n\n: get('direction'),\n\nfontFamily\n\n: get('font-family', 'fontFamily')\n\
    \n.replace(/\\['\"\\]/g, '')\n\n};\n\nanchor.parentNode.removeChild(anchor);\n\
    \nreturn styles;\n\n}\n\nThese are just some suggested styles that you should\
    \ query for; feel free to test for\n\nother styles you think are important. Text\
    \ direction is a neat one: it’s used to style a\n\nwebsite with right-to-left\
    \ text (like Hebrew or Arabic). Just like font color or font fam-\n\nily, it won’t\
    \ be applied to your iframe unless you pass it along manually. \n\nAPPLYING STYLES\
    \ TO AN IFRAME\n\nNow it’s time to apply the basic styles you’ve collected from\
    \ the publisher’s page to\n\nyour iframe. As we mentioned earlier, for a src-less\
