  md: "**92**\n\nCHAPTER 4\n\n***Communicating with the server***\n\n</script>\n\n\
    <script src=\"jquery.min.js\"></script>\n\n</html>\n\nIf loading the jQuery library\
    \ hasn’t already tipped you off, this is the page from which\n\nyou’ll actually\
    \ make the AJAX request. It’s served from the same subdomain as the\n\n(proxied)\
