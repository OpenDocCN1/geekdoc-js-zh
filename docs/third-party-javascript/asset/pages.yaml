  md: "**146**\n\nCHAPTER 6\n\n***Authentication and sessions***\n\nthe same code\
    \ from the new window example (see section 6.2.1) to initiate and\n\nreceive messages\
    \ between the login iframe and the parent iframe using the post-\n\nMessage API.\
    \ If it isn’t clear how this embedded iframe example works, you can see a\n\n\
    working example in the companion source code.\n\nIFRAMED AUTHENTICATION PAGES\
    \ CONSIDERED HARMFUL\n\nLogging in through an external iframe might seem like\
    \ an ideal user experience, but\n\nit suffers from a major flaw: the user can’t\
    \ easily verify the form’s origin. A malicious\n\nparty could mimic your authentication\
    \ form, and trick unsuspecting users into divulg-\n\ning their password. Compare\
    \ this to presenting an authentication form in a new win-\n\ndow, where the user\
    \ can clearly see the originating URL and secure page notice (if\n\nyour authentication\
    \ page supports HTTPS, as it should—we’ll cover this shortly).\n\n So why show\
    \ this example? Because it’s a cool hack, and we wanted to share that\n\nit’s\
    \ possible—in one browser, at least. But our recommendation is to use dedicated\n\
    \nwindows for setting third-party cookies. It may not be the best user experience,\
    \ but it’s\n\nthe safest, most fool-proof technique. \n\n*6.2.3*\n\n*Single-page\
    \ sessions for Chrome and Firefox*\n\nSo far, we’ve talked about workarounds for\
    \ Internet Explorer, Opera, and Safari. Two\n\nmajor browsers are sorely missing\
    \ from that list: Chrome and Firefox, which don’t trans-\n\nmit cookies to third-party\
    \ domains if third-party cookies are disabled. Today, those two\n\nbrowsers account\
    \ for more than 50% of all web users (see http://en.wikipedia.org/\n\nwiki/Usage\\\
    _share\\_of\\_web\\_browsers). Those users will be completely unable to persist\n\
    \nsessions with your third-party application if they’ve disabled third-party cookies\
    \ in their\n\nbrowser settings.\n\n Without persistence, you’re left with one\
    \ choice: temporarily storing the session ID\n\nin your third-party application\
    \ for the duration that the user is on the page. This\n\nmeans that when you authenticate\
    \ a user, instead of storing the user’s session ID in a\n\ncookie, you persist\
    \ the session ID in a variable in your application. Then, if the user\n\nTop-level\
    \ frame\n\nAuthentication frame\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_170_0.png)\n\
    \nUsername\n\nPassword\n\nSign in\n\nMikon E90 Digital SLR\n\nFigure 6.7\n\nEmbedding\
    \ the authentication form in a second, \n\nseparate iframe allows users to POST\
    \ the form without reloading \n\nthe parent iframe\n\nwww.it-ebooks.info"
