  md: "**189**\n\n***Wrapping web service APIs***\n\n\\[\n\n{\n\ncoordinates: null,\n\
    \ncontributors: null,\n\nretweet\\_count: 0,\n\nin\\_reply\\_to\\_user\\_it: null,\n\
    \nfavorited: false,\n\ngeo: null,\n\npossibly\\_sensitive: false,\n\nin\\_reply\\\
    _to\\_screen\\_name: null,\n\nuser: { ... },\n\nid\\_str: \"163357792512643073\"\
    ,\n\nplace: null,\n\nretweeted: false,\n\nin\\_reply\\_to\\_status\\_id: null,\n\
    \ncreated\\_at: \"Sat Jan 28 20:28:27 +0000 2012\",\n\nin\\_reply\\_to\\_status\\\
    _id\\_str: null,\n\ntruncated: false,\n\nsource: \"<a href=\\\\\"http://www.socialoomph.com\\\
    \\\">SocialOomph</a>\",\n\nin\\_reply\\_to\\_user\\_id\\_str: null,\n\nid: 163357792512643070,\n\
    \ntext: \"Deal of the Day! Get half off the Sass and Compass in \\\\\n\nAction\
    \ (http://t.co/gdVIl8gd ) eBook! Use code dotd0128tw \\\\\n\nat checkout.\"\n\n\
    },\n\n...\n\n\\]\n\nLike this example using curl, most web service APIs are designed\
    \ to be accessed server-\n\nside, from a programming language running on your\
    \ private servers. Typically, this is\n\nso that the API can identify the requesting\
    \ party, either using the IP address from\n\nwhich the request originates, or\
    \ using a private and uniquely identifying API token\n\nthat’s submitted with\
    \ each request. This helps web service APIs rate-limit or even shut\n\ndown publishers\
    \ who are abusing the API by making too many requests.\n\nJSONP AND CORS\n\nIncreasingly,\
    \ web service APIs are seeing the value in making requests directly from\n\nthe\
    \ browser. Many APIs already have support for JSONP, which (as we learned in chap-\n\
    \nter 4) enables a web page to request JSON data from a different domain.\n\n\
    \ Twitter is an example of a web service API that supports JSONP requests. In\
    \ the last\n\nsection, we demonstrated a server-side request to the Twitter API\
    \ using curl, but the\n\nsame request can be made on the browser using JSONP.\
    \ The following code snippet\n\nissues the same request for ManningBooks’ user\
    \ timeline, using jQuery’s AJAX helper:\n\njQuery.ajax({\n\nurl: 'http://api.twitter.com/1/statuses/user\\\
    _timeline?\\\\\n\nscreen\\_name=ManningBooks',\n\ntype: 'jsonp',\n\ncallback:\
    \ function(response) {\n\n// success\n\n}\n\n});\n\nListing 8.7\n\nJSON containing\
    \ ManningBooks’ user status updates from Twitter\n\nwww.it-ebooks.info"
