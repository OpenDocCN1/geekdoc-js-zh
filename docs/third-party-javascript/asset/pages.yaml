  md: "**59**\n\n***Styling your HTML***\n\ninside, and then append the style element\
    \ to the DOM. Because you can embed this\n\nCSS string alongside your preexisting\
    \ JavaScript code, you can sidestep loading a sepa-\n\nrate CSS file, sparing\
    \ your application an additional HTTP request.\n\n To get a better sense of how\
    \ this works, consider this simple CSS ruleset:\n\n.stork-container {\n\nwidth:\
    \ 300px;\n\nheight: 300px;\n\n}\n\n.stork-container a {\n\ntext-decoration: none;\n\
    \n}\n\nThe goal is to take such a ruleset and convert it to a string that’s stored\
    \ in a variable\n\nsomewhere in your JavaScript code. For example, these rules\
    \ could be converted to\n\nthe following:\n\nStork.css = '.stork-container { width:300px;\
    \ height:300px; }' +\n\n'.stork-container { text-decoration: none; }';\n\nAfterward,\
    \ it’s just a matter of taking this string and injecting it as a style rule into\
    \ the\n\npage. We’ll get to that in a minute, but first, how do you actually convert\
    \ a CSS file to a\n\nJavaScript string like this?\n\nCONVERTING CSS TO JAVASCRIPT\
    \ STRINGS\n\nYou’ll need some kind of build tool that reads your CSS file, converts\
    \ it to a JavaScript\n\nstring, and then embeds that string as a variable into\
    \ your final, built JavaScript file.\n\nThis is probably not something you want\
    \ to do during development; otherwise you’ll\n\nhave to rebuild your JavaScript\
    \ every time you change a style rule. Embedding CSS is\n\nthus a technique that’s\
    \ best reserved for production use only.\n\n Listing 3.5 shows a sample Python\
    \ function that converts a CSS file to a JavaScript\n\nstring. It uses a clever\
    \ CSS\\-parsing library for Python called cssutils (see http://\n\npypi.python.org/pypi/cssutils/).\
    \ But like other server-side examples in this book, this\n\nsimple function could\
    \ be written in any language. \n\nimport cssutils\n\ndef convert\\_css(css, js\\\
    _var):\n\n\"\"\"\n\nUsage:\n\nconvert\\_css('.rule { display: block; }', 'MyApp.styles')\n\
    \n\\=> \"MyApp.styles = '.rule{display:block}';\"\n\n\"\"\"\n\ncssutils.ser.prefs.useMinified()\n\
    \nout = cssutils.parseString(css)\n\nout = out.cssText.replace(\"'\", \"\\\\\\\
    \\'\")\n\nreturn \"%s = '%s';\" % (js\\_var, out)\n\nListing 3.5\n\nPython script\
    \ for converting a CSS ruleset to a JavaScript string\n\n**Tell cssutils to minify\
    \ output CSS**\n\n**Assign output JavaScript string to **\n\n**namespaced JavaScript\
    \ variable; **\n\n**for example, Stork.styles**\n\nwww.it-ebooks.info"
