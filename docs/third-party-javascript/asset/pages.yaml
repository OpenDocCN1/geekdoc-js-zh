  md: "**117**\n\n***Fallback techniques***\n\nThe next listing shows an example of\
    \ the client creating a new iframe and listening to\n\nnew messages using the\
    \ fragment identifier technique.\n\nvar url = window.location.href;\n\nvar iframe\
    \ = document.createElement('iframe');\n\niframe.style.display = 'none';\n\niframe.src\
    \ =\n\n'http://camerastork.com/hashtransport/server.html?url=' +\n\nencodeURIComponent(url);\n\
    \nvar body = document.getElementsByTagName('body')\\[0\\];\n\nbody.appendChild(iframe);\n\
    \nvar listener = function () {\n\nvar hash = location.hash;\n\nif (hash && hash\
    \ !== '#') {\n\nconsole.log(\"Incoming: \" + hash.replace('#', ''));\n\nwindow.location.href\
    \ = url + '#';\n\n}\n\nsetTimeout(listener, 100);\n\n};\n\nlistener();\n\nNote\
    \ that, in order to receive data, you have to monitor the current URL in order\
    \ to\n\nknow when it’s been changed. You can do that by polling the URL every\
    \ *N *milliseconds.\n\n The next listing shows an example of a page hosted on\
    \ the server that sends a mes-\n\nsage to the parent page by modifying the parent’s\
    \ fragment identifier.\n\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n<script>\n\n\
    function init() {\n\nvar url = window.location.href;\n\nurl = url.split('?')\\\
    [1\\].replace('?', '');\n\nwindow.parent.location = decodeURIComponent(url) +\n\
    \n'#helloworld';\n\n}\n\n</script>\n\n</head>\n\n<body onload=\"init()\"></body>\n\
    \n</html>\n\nThese listings demonstrate how to send a single message from the\
    \ iframed document\n\nto the parent document. But the iframed document itself\
    \ can also receive messages\n\nfrom the parent—the roles are just reversed. In\
    \ this scenario, the parent modifies the\n\nListing 5.5\n\nClient listening to\
