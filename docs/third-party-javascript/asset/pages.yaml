  md: "**154**\n\nCHAPTER 7\n\n***Security***\n\nGET /products/1337.json HTTP/1.1\n\
    \nHost: camerastork.com\n\nAccept: application/json\n\nCookie: sessionid=66d2520a77a3c6dac4db658c6dd13061\n\
    \nWhen the server receives a request containing this cookie, it looks up the local\
    \ user\n\nrecord that matches the passed session token. If a user is found, the\
    \ server treats that\n\nuser as the requesting party and returns content as appropriate.\
    \ This continues until\n\nthe cookie becomes expired or is deleted—either by the\
    \ user or by the server in a sub-\n\nsequent Set-Cookie header.\n\n The main issue\
    \ with browser sessions is that they’re represented by a single value—\n\na session\
    \ token—stored in a cookie. If an attacker can ever gain access to that session\n\
    \ntoken, they can easily authenticate with the affected web service as that user.\
    \ After-\n\nward, the attacker can perform any number of actions with that user’s\
    \ identity, like\n\naccess or manipulate their private data. Obviously, this is\
    \ a disastrous scenario, but\n\nshort of physically stealing a user’s computer,\
    \ how does an attacker gain access to a\n\nuser’s cookies?\n\n In chapter 6, we\
    \ introduced a scenario in which cookies can be stolen or hijacked\n\nby a malicious\
    \ party: using a *man-in-the-middle attack (**MITM**)*. This attack takes advan-\n\
    \ntage of the fact that normal HTTP requests transfer data in plain text, such\
    \ that cook-\n\nies are vulnerable to packet sniffing. That means that on an unencrypted\
    \ network\n\n(like your neighborhood coffee joint’s free Wi-Fi network), a malicious\
    \ party can scan\n\nnetwork traffic for HTTP requests containing session cookies\
    \ and copy them.\n\n In that chapter, we also told you that the best defense against\
    \ MITM attacks is to use\n\nHTTP Secure (HTTPS) to encrypt all HTTP requests between\
    \ the server and the\n\nbrowser. Because the HTTP requests are encrypted, they’re\
    \ no longer vulnerable to\n\npacket sniffing, which all but eliminates the MITM\
    \ threat.¹\n\n Though HTTPS is greatly encouraged, and a strong defense against\
    \ MITM attacks,\n\nit’s not a panacea for all web application security threats.\
    \ MITM is just one vector\n\nthrough which an attacker can gain access to a user’s\
    \ cookies. Unfortunately, there are\n\nmany other vulnerabilities that your web\
    \ application needs to address before you can\n\ngive it the rubber stamp of security\
    \ approval. But don’t reach for the ejector seat but-\n\nton just yet—we’ll guide\
    \ you through these vulnerabilities in depth, and present solu-\n\ntions and defensive\
    \ techniques as we go.\n\n To kick things off, we’ll dive into perhaps the most\
    \ common vulnerability affecting\n\nJavaScript applications today: cross-site\
    \ scripting. \n\n*7.2*\n\n*Cross-site scripting*\n\nIf there’s one common source\
    \ of embarrassment for web application developers, it’s\n\n*cross-site scripting*—or\
    \ as it’s commonly known, XSS. This particular vulnerability is\n\nresponsible\
    \ for many different successful attacks—from funny pranks like causing\n\n1 Unless\
    \ they manage to decrypt the contents. But that’s another book.\n\nwww.it-ebooks.info"
