  md: "**52**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\nthe first instance of\
    \ the script include snippet with that ID, so any subsequent snippets\n\nwill\
    \ end up targeting the wrong render location.\n\n Now, many third-party applications\
    \ may never intend to support multiple instances\n\nper page, in which case you’re\
    \ fine to stick with what we’ve just covered. But for the\n\nCamera Stork widget,\
    \ this is a scenario you should support. Ideally, you want the pub-\n\nlisher\
    \ to include as many Camera Stork widget instances as they can fit on a page,\
    \ in\n\norder to help you promote as many of your products as possible. Let’s\
    \ look at ways to\n\nmake that happen. \n\n*3.1.3*\n\n*Appending multiple widgets*\n\
    \nIf you intend to support multiple instances of your widget on one page, you\
    \ should\n\navoid using IDs to identify your script include snippet, and instead\
    \ use data-\\* attri-\n\nbutes. You can alternatively use classes, but data-\\\
    * attributes have additional advan-\n\ntages we’ll cover later in this section.\n\
    \n Listing 3.2 shows the Camera Stork script include from earlier, this time identified\n\
    \nby the data-stork-widget custom attribute instead of an ID. You’ll note that\
    \ the\n\ndata-stork-widget doesn’t have a value—don’t worry, it’s still valid\
    \ HTML.\n\n<script data-stork-widget>\n\n(function() {\n\nvar script = document.createElement('script');\n\
    \nscript.async = true;\n\nscript.src = 'http://camerastork.com/widget.js?product=1234';\n\
    \nvar entry = document.getElementsByTagName('script')\\[0\\];\n\nentry.parentNode.insertBefore(script,\
    \ entry);\n\n})();\n\n</script>\n\nThis version makes it possible to query multiple\
    \ instances of your script include snip-\n\npet in the case where the publisher\
    \ has added it multiple times. The downside is that\n\nquerying the DOM for data-\\\
    * attributes is slower than fetching elements by ID.\n\n Here’s an example function\
    \ that uses jQuery to insert HTML before a script\n\ninclude snippet that identifies\
    \ itself using the data-\\* attribute shown previously.\n\njQuery, as always,\
    \ makes this remarkably easy:\n\nfunction appendWidgetMarkup(html) {\n\njQuery('script\\\
    [data-stork-widget\\]').first()\n\n.removeAttr('data-stork-widget')\n\n.before(html);\n\
    \n}\n\nThis helper function locates the first script element with the data-stork-widget\
    \ attri-\n\nbute and inserts the markup before it. It then removes the data-stork-widget\
    \ attri-\n\nbute so that it isn’t selected again by any subsequent executions\
    \ of your code. That\n\nway, if a publisher includes a second instance of your\
    \ script include snippet, the code\n\nListing 3.2\n\nThe script include snippet\
    \ again, now identified with a data-\\* attribute\n\nwww.it-ebooks.info"
