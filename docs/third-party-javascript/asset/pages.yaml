  md: "**104**\n\nCHAPTER 4\n\n***Communicating with the server***\n\n*4.5*\n\n*Summary*\n\
    \nThis chapter was dedicated to the same-origin policy and basic techniques you\
    \ can use\n\nto bypass it. You should now have a clear understanding of what SOP\
    \ is, how it works,\n\nwhat types of communication it affects, and what options\
    \ you have when trying to\n\nsend messages across different domains.\n\n The natural\
    \ question now is how to decide what technique to use for your applica-\n\ntion.\
    \ We recommend always starting with CORS simply because it’s the most stable,\n\
    \ndocumented, and future-proof way of making cross-domain requests. For browsers\n\
    \nthat don’t support CORS, the easiest alternative is to use JSONP, but it’ll\
    \ mean giving\n\nup making POST requests from your third-party application. You\
    \ won’t be able to\n\nupload files or send long user reviews, for instance. Subdomain\
    \ proxies aren’t\n\nrestricted in the types of HTTP requests they use, but they\
    \ only permit messaging\n\nbetween subdomains, and only make sense if you have\
    \ a small number of publishers.\n\n As far as the Camera Stork product widget\
    \ is concerned, none of these solutions\n\nare really up to the task. We want\
    \ to be able to make POST requests, support as many\n\nbrowsers as possible, and\
    \ have too many publishers for subdomain proxies. But what\n\noptions do we have\
    \ left?\n\n The answer is, plenty. As you may have noticed in this chapter, some\
    \ of the tech-\n\nniques we covered rely on the iframe HTML element. This element\
    \ can be powerful\n\nand can provide a solid communication channel between documents\
    \ with different\n\norigins. In the next chapter, we’ll go over additional techniques\
    \ that rely on the\n\niframe element to pass messages back and forth between domains.\
    \ Get ready to see\n\nthe iframe element as you’ve never seen it before.\n\nwww.it-ebooks.info"
