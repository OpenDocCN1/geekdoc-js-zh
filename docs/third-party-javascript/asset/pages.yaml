  md: "**115**\n\n***Fallback techniques***\n\nAVOIDING SOUND EFFECTS CAUSED BY MODIFYING\
    \ WINDOW.LOCATION\n\nThe window.name trick works pretty well in legacy browsers\
    \ with one exception: Inter-\n\nnet Explorer versions 7 and below accompany every\
    \ location change with an annoying\n\nclicking sound. As you might imagine, if\
    \ your application sends a lot of messages using\n\nthis technique, your computer\
    \ will end up sounding like a toy machine gun.\n\n To solve this problem in Internet\
    \ Explorer 6, you need to add a <bgsound> ele-\n\nment to the page. This will\
    \ cause the browser to think that there’s background music\n\nplaying and not\
    \ play the clicking sound while navigating. You don’t need to link to an\n\nactual\
    \ sound file—just an empty <bgsound> tag will do (see the Mozilla Developer\n\n\
    Network discussion at https://developer.mozilla.org/en/HTML/Element/bgsound).\n\
    \n Unfortunately the <bgsound> trick doesn’t work in Internet Explorer 7, for\
    \ which\n\nyou’ll use an alternate workaround shown next. This workaround relies\
    \ on ActiveX,\n\nan API that’s only available in Internet Explorer (all versions).\n\
    \nvar doc, iframe, html;\n\nif (\"ActiveXObject\" in window) {\n\nhtml =\n\n\"\
    <html><body>\" +\n\n\"\n\n<iframe id='iframe'></iframe>\" +\n\n\"</body></html>\"\
    ;\n\ndoc = new ActiveXObject(\"htmlfile\");\n\ndoc.open();\n\ndoc.write(html);\n\
    \ndoc.close();\n\niframe = doc.getElementById('iframe');\n\n} else {\n\niframe\
    \ = document.createElement('iframe');\n\ndocument.body.appendChild(iframe);\n\n\
    }\n\nAs you can see, we create a new ActiveX object, htmlfile, that acts as an\
    \ HTML docu-\n\nment, and append the iframe inside. This document happens to be\
    \ disconnected from\n\nthe browser’s UI, so when changes occur to the iframe element’s\
    \ window.location\n\nproperty, the browser decides to save resources—and our nerve\
    \ cells—by not playing\n\nthe accompanying clicking sound.\n\n Phew! We just looked\
    \ at one fallback technique for sending messages between doc-\n\numents. But there\
    \ are other techniques, all with their own advantages and disadvan-\n\ntages.\
    \ Let’s look at a different approach that relies on a similar browser quirk to\n\
    \ncircumvent the same-origin policy. \n\n*5.2.2*\n\n*Sending messages using the\
    \ URL fragment identifier*\n\nIn browser JavaScript environments, all window objects\
    \ have a property called\n\nlocation. This property can be used to get information\
    \ about the current document\n\nand its URL. It can also be used to redirect the\
    \ current document to another URL:\n\nListing 5.4\n\nUsing a detached document\
    \ to silence the clicking sound in IE7\n\n**Check whether ActiveX is **\n\n**present\
    \ (Microsoft browsers)**\n\n**Use ActiveX to create **\n\n**disconnected HTML\
    \ **\n\n**document**\n\n**Write iframe element into **\n\n**document; then close**\n\
    \n**Can now get reference to **\n\n**iframe inside ActiveX object**\n\n**Browsers\
    \ without **\n\n**ActiveX create iframes **\n\n**the old-fashioned way**\n\nwww.it-ebooks.info"
