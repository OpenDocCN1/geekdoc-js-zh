  md: "**56**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\nmodified by a conflicting\
    \ rule defined by the publisher, because your style rules are\n\nplaced directly\
    \ on the elements they affect.\n\n The reasons for not inlining CSS? They’re no\
    \ different than if you were writing a\n\nregular stay-at-home web application.\
    \ Depending on the complexity of your widget,\n\nyou might need to redundantly\
    \ repeat a lot of style attributes throughout your HTML.\n\nThis repetition gets\
    \ worse if you’re developing multiple widgets; without any reusable\n\nCSS, everything\
    \ will have to be repeated. Needless to say, inlining CSS can quickly\n\nbecome\
    \ unmaintainable, and possibly cause your designer to cry at night.\n\n But that\
    \ doesn’t mean inlining CSS is out of the question. If you have a particularly\n\
    \nsimple application, the bonus of having conflict-free styles may outweigh the\
    \ pain of\n\nmaintaining inline attributes. \n\n*3.2.2*\n\n*Loading CSS files*\n\
    \nFor a modestly complicated widget, it may be more appropriate to style your\
    \ elements\n\nusing a separate CSS file. Just like a regular web application,\
    \ you can define all your\n\nCSS rules in a single file (styles.css, for example).\
    \ Unlike a regular web application,\n\nyou’ll need to load these CSS files dynamically\
    \ via JavaScript, similar to how you\n\nloaded additional JavaScript files back\
    \ in chapter 2.\n\n Loading CSS files dynamically is fairly simple. You just need\
    \ to create a <link>\n\nDOM element, set that element’s href attribute to point\
    \ to your target CSS file, and\n\nappend the element to the page. CSS files always\
    \ load asynchronously when injected\n\ndynamically via JavaScript, so you won’t\
    \ run the risk of blocking other files:\n\nfunction loadStylesheet(url) {\n\n\
    var link = document.createElement('link');\n\nlink.rel\n\n\\= 'stylesheet';\n\n\
    link.type = 'text/css';\n\nlink.href = url;\n\nvar entry = document.getElementsByTagName('script')\\\
    [0\\];\n\nentry.parentNode.insertBefore(link, entry);\n\n}\n\nAgain, not very\
    \ difficult, but there’s a catch. This code doesn’t know when the\n\nstylesheet\
    \ file has finished loading. If you try to render elements on the page before\n\
    \ntheir corresponding CSS rules are loaded, there could be a short period of time\
    \ when\n\nthose elements are unstyled. In the web development world, this is referred\
    \ to as\n\n*FOUC*, or *flash of unstyled content*. It’s safe to say that FOUC\
    \ is undesirable.\n\nREQUIRED ATTRIBUTES FOR <LINK>\n\nEarlier in this book, we\
    \ mentioned that you\n\ncould omit type=\"text/javascript\" from <script> tags,\
    \ and they’ll still\n\nbehave as expected—even in old browsers. Alas, the same\
    \ isn’t true of <link>\n\ntags. Both the type and rel attributes *must* be present\
    \ in order for them to\n\nfunction correctly in all browsers.\n\nwww.it-ebooks.info"
