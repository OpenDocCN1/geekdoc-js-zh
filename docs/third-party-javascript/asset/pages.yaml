  md: "**182**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\n\n\
    \njQuery.unbind—Remove a previously-attached event handler from a DOM\n\nelement.\n\
    \n\n\njQuery.trigger—Trigger an event on a DOM element.\n\nThese functions look\
    \ suspiciously close to the Stork event functions you just imple-\n\nmented. Wouldn’t\
    \ it be nice if you could use them instead? That way, you could lever-\n\nage\
    \ jQuery’s well-tested custom event code, instead of maintaining your own.\n\n\
    \ There’s one small hurdle: the jQuery functions bind and trigger events on\n\n\
    JavaScript objects, whereas the Stork event functions don’t. This is quickly solved\
    \ by\n\nusing a stub object upon which you’ll bind and trigger events. Here are\
    \ modified ver-\n\nsions of Stork.listen, Stork.unlisten, and broadcast, which\
    \ wrap jQuery’s event\n\nfunctions.\n\nvar stub = {};\n\nStork.listen = function(eventName,\
    \ handler) {\n\njQuery(stub).bind(eventName, handler);\n\n};\n\nStork.unlisten\
    \ = function(eventName, handler) {\n\njQuery(stub).unbind(eventName, handler);\n\
    \n};\n\nfunction broadcast(eventName) {\n\njQuery(stub).trigger(eventName);\n\n\
    }\n\nOf course, if you’re not interested in the full jQuery feature set, there\
    \ are\n\nalso focused libraries that offer the same custom event functionality.\
    \ Bean is a DOM\n\nevent micro-library whose API closely resembles jQuery’s (http://github.com/fat/\n\
    \nbean). JS-Signals is a feature-rich custom event library that will also fit\
    \ the bill (http://\n\nmillermedeiros.github.com/js-signals/). Take a look and\
    \ consider whether any of\n\nthese are worthwhile additions to your application.\
    \ \n\n*8.2*\n\n*Versioning*\n\nUp until this point, you’ve implemented a number\
    \ of public functions for the Camera\n\nStork JavaScript SDK. Let’s imagine for\
    \ a moment that you’ve distributed your SDK to\n\npublishers, and they’re happily\
    \ using it to render widgets and bind to application\n\nevents.\n\n What happens\
    \ when you, the Camera Stork developer, want to introduce changes\n\nto those\
    \ public functions, now that they’re already in use by publishers? Revising and\n\
    \nimproving your software is normal practice, but by doing so, you risk breaking\
    \ pub-\n\nlishers’ code.\n\n Let’s look at an example. Up until this point, the\
    \ Stork.productWidget has\n\nlooked like this:\n\nStork.productWidget({ id: 1337,\
    \ dom: 'stork-widget-location' });\n\nListing 8.4\n\nWrapping jQuery’s DOM event\
    \ functions\n\nwww.it-ebooks.info"
