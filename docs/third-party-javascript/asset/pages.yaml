  md: "**105**\n\n*Cross-domain*\n\n*iframe messaging*\n\nIn chapter 4 you learned\
    \ about the same-origin policy—a browser security concept\n\nthat prohibits pages\
    \ from different origins from accessing each other’s methods\n\nand properties.\
    \ You also learned a few tricks—subdomain proxies, JSONP, and\n\nCORS—that allow\
    \ you to circumvent the SOP in order to send HTTP requests to\n\nyour servers.\n\
    \n One of those solutions, subdomain proxies, used iframe elements as a means\
    \ of\n\ncommunicating with your servers. It relied upon the fact that documents\
    \ hosted\n\ninside iframes can freely communicate with URLs on the same domain.\
    \ But in\n\norder for your third-party JavaScript code to access the iframe and\
    \ initiate network\n\nrequests, the target document needed to reside in the same\
    \ domain space as the\n\npublisher’s website—using a subdomain proxy. As you learned,\
    \ asking publishers to\n\n*This chapter covers*\n\nThe role of iframes in cross-domain\
    \ messaging\n\nHTML5 window.postMessage API\n\nwindow.postMessage alternatives\
    \ for legacy \n\nbrowsers\n\neasyXDM—the cross-domain messaging library\n\nwww.it-ebooks.info"
