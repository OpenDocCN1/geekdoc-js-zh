  md: "**170**\n\nCHAPTER 7\n\n***Security***\n\n<script>\n\nif (top != self) {\n\n\
    document.body.style.display = 'none';\n\n}\n\n</script>\n\nCLICKJACKING AND THIRD\\\
    -PARTY SCRIPTS\n\nThese solutions are great for stay-at-home web applications,\
    \ but what about iframes\n\nloaded from third-party applications? In this context,\
    \ using either the X-Frame-\n\nOptions header or a framekiller script is *not*\
    \ an option; you need that content to load\n\non the publisher’s page. In that\
    \ case, you can take a few alternate steps to mitigate\n\nclickjacking vulnerabilities:\n\
    \n*Have all data-modifying click actions require confirmation*. If you have an\
    \ action in\n\nyour iframe that will modify data, require the user to confirm\
    \ the action in a\n\nway that can’t be impersonated via clickjacking. The most\
    \ popular approach is a\n\nconfirmation dialog that opens in a new window. Alternatively,\
    \ it could require\n\ntyping a confirmation phrase into an input box.\n\n*Require\
    \ publishers to register with your service*. If you require publishers to register\n\
    \nwith your service in order to install your application, you at least have a\
    \ paper\n\ntrail if a publisher abuses it. Registration makes it possible to shut\
    \ down offend-\n\ning publishers.\n\nClickjacking is scary because it’s a vulnerability\
    \ of the web and HTML, and not a bug in\n\nyour application or software. The worst\
    \ part is that *all* websites are vulnerable to click-\n\njacking by default unless\
    \ they take action to prevent it. For regular content which isn’t\n\nserved inside\
    \ an iframe, that’s easily accomplished using the X-Frame-Options header\n\nor\
    \ framekiller scripts we covered earlier. For third-party applications, solutions\
    \ are less\n\nstraightforward, but clickjacking is still manageable. \n\n*7.4.3*\n\
    \n*Denial of service*\n\nA denial of service (DoS) attack is an attempt to make\
    \ a web application unavailable\n\nto its users. The most common method of such\
    \ an attack involves saturating the target\n\nserver with HTTP requests, such\
    \ that it can no longer respond to legitimate traffic, and\n\nthus causing the\
    \ web application to appear to be down. DoS attacks are among the\n\nmost frustrating\
    \ attacks because there’s no generic solution for preventing them or\n\nfor relieving\
    \ your servers when a DoS attack is under way.\n\n Denial of service attacks affect\
    \ all web applications, but third-party applications are\n\nparticularly at risk.\
    \ Because third-party apps are accessed from other web pages, a\n\nsurge of traffic\
    \ on any one property can cause problems for your service. It doesn’t\n\neven\
    \ need to be an intentional attack against one of your publishers. All it takes\
    \ is one\n\nJustin Bieber fansite contest to send a never-before-seen level of\
    \ traffic to your widget.⁸\n\n8 True story—this once happened in the early days\
    \ of the Disqus commenting widget. Bieber Fever was respon-\n\nsible for the single\
    \ highest traffic event we’d ever encountered.\n\nwww.it-ebooks.info"
