  md: "**81**\n\n***AJAX and the browser same-origin policy***\n\npublisher’s website\
    \ (publisher.com)? Wouldn’t that be considered an HTTP request\n\nbetween two\
    \ different origins, and should thus be rejected according to the same-\n\norigin\
    \ policy?”\n\n The same-origin policy happens to have a single, crucial exception:\
    \ *HTML**script*\n\n*elements are waived from **SOP** checks*. This waiver is\
    \ crucial to the modern web because it\n\nallows websites to load JavaScript files\
    \ from other origins. This has a number of uses,\n\nlike allowing websites to\
    \ load JavaScript resources from high-performance content\n\ndelivery networks\
    \ (CDNs). It also gives you, as a third-party JavaScript application\n\ndeveloper,\
    \ a way to distribute your application code. Without it, publishers wouldn’t\n\
    \nbe able to include your script files, and we wouldn’t have much of a book to\
    \ write.\n\n It’s also important to recognize that even though your code is loaded\
    \ from a differ-\n\nent origin, your code *executes* in the context of the publisher’s\
    \ website—and is subject\n\nto the SOP constraints placed on that document. That\
    \ means that your JavaScript\n\ncode (executing in the context of the publisher’s\
    \ page) can’t initiate an XmlHttp-\n\nRequest to camerastork.com (see figure 4.2).\
    \ But it could load more JavaScript files,\n\nsince we’ve established that script\
    \ elements are exempt from the SOP.\n\n The same-origin policy is a terrific security\
    \ feature, but it’s a real drag in cases\n\nwhen you need to legitimately send\
    \ data between domains, like accessing data from\n\nthe Camera Stork servers using\
    \ XmlHttpRequest. It’d be nice if we—third-party\n\npublisher.com\n\nDownload\
    \ HTML page.\n\nwidget.com\n\nwidget.com\n\nPublisher\n\npage\n\nWeb browser\n\
    \nDownload third-party script.\n\nThis is possible because\n\nscript elements\
    \ are exempted\n\nfrom the SOP.\n\nPublisher\n\npage\n\nCan’t make an XmlHttpRequest\
    \ \n\noriginating from the publisher’s page. \n\nThe browser will throw an exception.\n\
    \nThird-party \n\ncode executing\n\nin publisher\n\ncontext\n\nWeb browser\n\n\
    Figure 4.2\n\nScript element requests \n\nare immune from the same-origin policy,\
    \ \n\nwhereas **XmlHttpRequest**s aren’t.\n\nwww.it-ebooks.info"
