  md: "**58**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\nif (value && value ===\
    \ 'rgb(186, 218, 85)' ||\n\nvalue.toLowerCase() === '#bada55')\n\n{\n\ncallback();\n\
    \n} else {\n\nsetTimeout(poll, 500);\n\n}\n\n})();\n\n}\n\nThere are a few important\
    \ things to notice in this code. First, the two methods for\n\ndetermining the\
    \ color of the test element return different strings: the deprecated\n\nMicrosoft\
    \ accessor (for IE8 and previous) preserves the original hex value, whereas\n\n\
    the W3C accessor converts the hex value to an RGB expression. You’ll need to check\n\
    \nfor both. Second, the test element is given an inline color before it’s appended\
    \ to the\n\npage. This is to help prevent the rare case in which the publisher\
    \ is already using your\n\nmagic test color (#bada55), such that the test element\
    \ inherits that color upon enter-\n\ning the DOM. This would cause the isCssReady\
    \ function to fire the callback parame-\n\nter before your CSS file is actually\
    \ loaded. Even with these precautions, it’s still\n\nconceivable that isCssReady\
    \ could fire early, but that would require near-malicious\n\ntargeting of your\
    \ test element by the publisher. And, in practice, that doesn’t happen.\n\n Now\
    \ that you’re armed with these two functions (loadStylesheet and isCss-\n\nReady),\
    \ you have everything you need to load CSS files and defer HTML rendering\n\n\
    until they’re processed by the browser. There’s just one downside we haven’t consid-\n\
    \nered: loading CSS files separately like this will incur an additional HTTP request\
    \ by\n\nyour third-party script.\n\nALTERNATE TECHNIQUE: USING DOCUMENT.STYLESHEETS\n\
    \nWe’ve outlined one\n\ntechnique for detecting whether a stylesheet has loaded,\
    \ but as it happens,\n\nthere are others. Yepnope.js, a library for loading JavaScript\
    \ files and other\n\nassets, has an alternate technique that uses the document.styleSheets\
    \ prop-\n\nerty to scan for newly inserted stylesheets. If you’re curious, take\
    \ a look at the\n\nYepnope.js source code to find out more: https://github.com/SlexAxton/\n\
    \nyepnope.js.\n\nNow, we haven’t spoken much about performance yet in this book,\
    \ but a well-\n\naccepted rule of web application performance is to limit the\
    \ number of HTTP\n\nrequests your code makes. Even though we’ve advocated separating\
    \ your JavaScript\n\ninto logically separate files and loading them individually\
    \ to aid development, they\n\ncan always be concatenated into a single library\
    \ file when deployed into production.\n\nNot so with CSS. Because it’s a different\
    \ file type, it can’t be bundled with your\n\nJavaScript into a single file. Or\
    \ can it?\n\n*3.2.3*\n\n*Embedding CSS in JavaScript*\n\nA clever technique for\
    \ loading styles as a third-party script is to embed an entire CSS\n\nruleset\
    \ as a string inside your JavaScript code. When you’re ready to add the styles\
    \ to\n\nthe page, you create a new <style> element, append the CSS string as a\
    \ text node\n\n**Does test**\n\n**element have**\n\n**predefined color**\n\n**from\
    \ stylesheet?**\n\n**If not, continue polling**\n\nwww.it-ebooks.info"
