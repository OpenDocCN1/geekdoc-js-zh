    \ highlights some of the difficulties of\n\nthird-party web development.\n\n Chapter\
    \ 2 instructs readers on how to actually load and execute their code on a\n\n\
    content provider’s website. It starts by describing how to set up a local development\n\
    \nenvironment to simulate a third-party development. It then moves into script\
    \ loading\n\nbest practices, and how to extract configuration variables from a\
    \ content provider’s\n\nwebsite.\n\n Chapter 3 focuses on DOM rendering. It teaches\
    \ readers best practices for render-\n\ning on the content provider’s DOM, an\
    \ environment they don’t control. It also covers\n\nstrategies for avoiding conflicting\
    \ styles using CSS and iframe elements.\n\n Chapter 4 goes over communication\
    \ between your third-party script and your data\n\nservers. It begins with a discussion\
    \ of the Same Origin Policy, and how it makes cross-\n\ndomain communication difficult.\
    \ It then looks at two workarounds for making cross-\n\ndomain requests: JSONP\
    \ and subdomain proxies. It finishes with a discussion of CORS\n\n(Cross Origin\
    \ Resource Sharing), a new HTML5 browser feature that enables cross-\n\ndomain\
    \ requests in modern browsers.\n\n Chapter 5 continues with cross-window messaging—including\
    \ iframes. It intro-\n\nduces window.postMessage, an HTML5 browser feature that\
    \ provides a simple messag-\n\ning mechanism between windows. It then introduces\
    \ a series of fallback techniques\n\nfor older browsers where window.postMessage\
    \ is unavailable. It also features a tutorial\n\nof easyXDM, an open-source JavaScript\
    \ library that provides postMessage-like features\n\nfor both modern and old browsers.\n\
    \n Chapter 6 is about authentication and cookies. It informs readers on the behav-\n\
    \niour of cookies in third-party scripts, and provides techniques for working\
    \ with brows-\n\ners when third-party cookies are disabled. It also briefly covers\
    \ security issues when\n\nworking with cookies.\n\n Chapter 7 discusses security\
    \ of third-party applications. It covers both traditional\n\nvulnerabilities for\
    \ JavaScript-based applications—such as Cross-Site Scripting (XSS)\n\nand Cross-Site\
    \ Request Forgery (XSRF) attacks—and also vulnerabilities specific to\n\nthird-party\
    \ applications.\n\n Chapter 8 guides the reader through the development of JavaScript\
    \ SDK (Software\n\nDevelopment Kit). It takes some of the features developed in\
    \ the earlier chapters, and\n\nexposes them to publishers through publicly-defined\
    \ functions. It also demonstrates\n\nhow to provide a client-side JavaScript wrapper\
    \ for an HTTP\\-based web services API.\n\n Chapter 9 is about performance. It\
    \ covers techniques for reducing filesize and the\n\nnumber of HTTP requests made\
    \ by your application. It also teaches best practices for\n\nwriting JavaScript\
    \ code that doesn’t block the browser or other scripts.\n\n Chapter 10 finishes\
    \ with testing and debugging. It demonstrates how to use tools\n\nlike rewriting\
    \ proxies and feature switches to debug application code in production. It\n\n\
    also shows how to write unit tests for third-party code.\n\nwww.it-ebooks.info"
