  md: "**178**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\nPREDEFINED\
    \ CALLBACKS\n\nObviously, dealing with script event handlers is somewhat intimidating—ideally\
    \ you\n\nshould hide these details from publishers. A better approach is to let\
    \ publishers\n\ndefine a global callback function that’s invoked by your SDK after\
    \ the initial script file\n\nloads. This callback will need to be declared as\
    \ a specific, expected global variable, so\n\nthat the SDK knows where to locate\
    \ it. Ideally this variable is documented in your SDK\n\ndocumentation.\n\n Let’s\
    \ suppose that you’ve documented such a callback function, Stork\\_ready. The\n\
    \npublisher will have to declare this function globally on their window object,\
    \ with the\n\nexpectation it’ll be fired when sdk.js has finished loading. The\
    \ publisher script\n\ninclude snippet will thus look like the following listing.\n\
    \n<script>\n\n(function() {\n\nvar script = document.createElement('script');\n\
    \nscript.async = true;\n\nscript.src = 'http://camerastork.com/sdk.js';\n\nvar\
    \ entry = document.getElementsByTagName('script')\\[0\\];\n\nentry.parentNode.insertBefore(script,\
    \ entry);\n\n})();\n\nwindow.Stork\\_ready = function() {\n\nStork.init(function()\
    \ {\n\nStork.productWidget({\n\nid: '1337',\n\ndom: 'stork-widget-location'\n\n\
    });\n\n});\n\n};\n\n</script>\n\nThe publisher has played their part, but in order\
    \ for their code to work, you’ll need to\n\nmodify your SDK to check whether the\
    \ Stork\\_ready function exists, and if it does, exe-\n\ncute it. That’s handled\
    \ by the following code, which should go at the end of sdk.js:\n\nif (typeof window.Stork\\\
    _ready === 'function') {\n\nwindow.Stork\\_ready();\n\n}\n\nUsing a global variable\
    \ to store the publisher’s callback function is a huge step up\n\nfrom the first\
    \ solution we covered. This snippet is close to half as many lines of code.\n\n\
    But it does carry a small—but addressable—flaw: there can only be one Stork\\\
    _ready\n\nfunction at any given time. If a separate block of code overwrites a\
    \ previously defined\n\nStork\\_ready function, the older callback function will\
    \ never be executed. That might\n\nseem an unlikely occurrence, but if your SDK\
    \ becomes popular, you might find that\n\nit’s used by other third-party scripts\
    \ operating on the publisher’s page. Ideally, you\n\nshould support multiple publisher-defined\
    \ ready callbacks.\n\nListing 8.3\n\nDefining a global callback function that\
    \ executes when the SDK is ready\n\n**Normal async **\n\n**script loader**\n\n\
    **Publisher defines **\n\n**global callback **\n\n**that’s executed **\n\n**when\
    \ sdk.js **\n\n**finishes loading**\n\nwww.it-ebooks.info"
