  md: "**218**\n\nCHAPTER 9\n\n***Performance***\n\nreduced user experience; the user\
    \ won’t see any images appear while the viewport is\n\nin the process of scrolling.\
    \ If you’re curious, the Disqus commenting widget uses\n\nthrottling, because\
    \ we don’t mind loading the extra images, but you could make an\n\nargument for\
    \ either approach. \n\n*9.2.3*\n\n*Deferring computation with setTimeout*\n\n\
    You’ve just learned how debounce and throttle are great techniques for avoiding\n\
    \nbrowser lockup by reducing the number of times your code is executed when it’s\n\
    \nbound to an event that fires multiple times. But if the code that fires is particularly\n\
    \nexpensive, it can still tie up the browser’s UI thread, preventing both browser\
    \ updates\n\nand other JavaScript operations.\n\n Let’s look at an example. If\
    \ you recall from chapter 8, you implemented a function\n\nfor the Camera Stork\
    \ JavaScript SDK, Stork.productWidget, which lets publishers\n\ninsert widget\
    \ instances on their web pages. A later version of this function allowed\n\npublishers\
    \ to specify a target location using a CSS selector string. This snippet of code\n\
    \nuses that function to insert a product widget wherever the widget class is found:\n\
    \nStork.productWidget({ id: 1337, dom: '.widget' });\n\nNow, suspend disbelief\
    \ for a moment, and imagine that the publisher’s page has 100\n\nDOM elements\
    \ with the class widget. This snippet would then have the effect of insert-\n\n\
    ing a widget into all 100 locations where the class appears. That’s an expensive\
    \ opera-\n\ntion, involving many DOM operations, that’s likely to block the browser’s\
    \ UI thread.\n\nNot only might this show a loading spinner in the user’s browser—it\
    \ might even fire\n\nthe dreaded “script has become unresponsive” browser alert,\
    \ which occurs when a\n\nscript has been executing for too long.\n\n The solution\
    \ involves a function by the name of setTimeout. This function takes\n\ntwo arguments:\
    \ a callback function and an integer that represents time in millisec-\n\nonds.\
    \ When that time elapses, setTimeout executes the provided callback function:\n\
    \nsetTimeout(function() { /\\* ... \\*/ }, 1000);\n\nWhat’s not commonly known\
    \ is that you can pass setTimeout a time value of 0.\n\nAlthough you might expect\
    \ that this executes the callback function immediately, it\n\ndoesn’t. What the\
    \ browser does instead is place the callback function at the end of the\n\nrender\
    \ queue processed by the UI thread. It effectively lets you defer code until the\n\
    \nbrowser has finished its current queue of jobs and is free to run your code.\
    \ Using set-\n\nTimeout in this manor is sometimes referred to as *script yielding*.\n\
    \n This is powerful stuff, and helps solve your initial problem—long-running\n\
    \nJavaScript operations. What you can do is split up that code into smaller, bite-size\n\
    \noperations, and queue each one using setTimeout with a time parameter of zero.\n\
    \nThen, every time one of those operations finishes, it’ll release the UI thread\
    \ to run any\n\nother queued jobs before returning to your code.\n\nwww.it-ebooks.info"
