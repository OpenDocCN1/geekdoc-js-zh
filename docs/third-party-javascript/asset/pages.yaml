  md: "**164**\n\nCHAPTER 7\n\n***Security***\n\nmade it possible to capture output\
    \ from a JSON endpoint, like the example output\n\nreturned from the purchase\
    \ history endpoint.\n\n<script>\n\n var captured = \\[\\];\n\n Object.prototype.\\\
    _\\_defineSetter\\_\\_('model',\n\n function (str) {\n\n captured.push(str);\n\
    \n }\n\n );\n\n</script>\n\n<script src=\"http://camerastork.com/api/orders.json\"\
    ></script>\n\nWith this code on the page, the attacker only needs to lure an unsuspecting\
    \ visitor to\n\ntheir website and load the vulnerable JSON endpoint using a <script>\
    \ tag. After the\n\nendpoint has loaded, they can send the contents of the captured\
    \ variable to their\n\nservers. This isn’t just a hypothetical scenario; it was\
    \ once possible to use this tech-\n\nnique to extract a visitor's Twitter followers.⁷\n\
    \n The good news is that this particular vulnerability is no longer present in\
    \ today’s\n\nset of modern browsers. However, it hasn’t been the only JSON hijacking\
    \ vector intro-\n\nduced by browsers, and it probably won’t be the last. Next\
    \ up, we’ll take a look at a few\n\nways you can protect yourself from XSRF attacks,\
    \ including potential JSON attacks like\n\nthis one. \n\n*7.3.3*\n\n*Defending\
    \ your application against XSRF attacks*\n\nThe standard way to protect your application\
    \ is to use what are commonly known as\n\n*XSRF** tokens*. An XSRF token is an\
    \ unpredictable challenge token—usually a randomly\n\ngenerated string that can’t\
    \ be reused—associated with the current user’s session.\n\nThese tokens are included\
    \ with every web page that’s allowed to initiate a protected\n\naction. When the\
    \ user submits an action, the form or JavaScript code submits the\n\nXSRF token\
    \ as part of the request, and the server checks the validity of the token. If\n\
    \nthe token is missing or invalid, the entire request is rejected. XSRF tokens\
    \ should be\n\nassociated with a single session; otherwise an attacker could use\
    \ the token retrieved\n\nfrom their own session.\n\n Figure 7.2 shows the process\
    \ of issuing and validating XSRF tokens.\n\n Essentially, when issuing an XSRF\
    \ token, you’re giving the user a one-time unique\n\npermit to invoke actions\
    \ that are prohibited from standalone HTTP requests. And the\n\nonly way the user\
    \ can get this permit is to actually visit the page containing interfaces\n\n\
    to the said actions. Because the attacker doesn’t have access to this token, they\
    \ can’t\n\ntrigger the user to make requests to resources that require the token.\n\
    \nListing 7.5\n\nJSON hijacking a seemingly secure HTTP endpoint\n\n7 www.thespanner.co.uk/2009/01/07/i-know-what-your-friends-did-last-summer/\n\
    \n**Redefine the Object built-in **\n\n**to capture values stored **\n\n**using\
    \ the 'model' key.**\n\nwww.it-ebooks.info"
