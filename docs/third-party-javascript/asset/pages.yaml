  md: "**61**\n\n***Defensive HTML and CSS***\n\nyour own self-contained web application.\
    \ You’ve got to think carefully about how pre-\n\nexisting CSS and JavaScript\
    \ code might affect your application. Let’s find out more. \n\n*3.3*\n\n*Defensive\
    \ HTML and CSS*\n\nBefore you begin to write any HTML or CSS, you’ll have to make\
    \ an important decision\n\nregarding the look and feel of your application. Do\
    \ you want your application to look\n\nthe same everywhere? Or do you want the\
    \ application to inherit the native look and\n\nfeel of the page on which it’s\
    \ hosted? Your answer will have a profound effect on your\n\nstrategy for rendering\
    \ your app.\n\n One thing is constant: at some level, you’ll be practicing what\
    \ we call *defensive* ren-\n\ndering. By defensive, we mean taking steps to output\
    \ HTML and CSS that minimize the\n\nimpact of the parent page on your application.\
    \ The less you want your widget\n\nimpacted by the parent page, the more steps\
    \ you’ll have to take. These steps can be as\n\nsmall as namespacing your HTML\
    \ and CSS to reduce name conflicts, or overspecifying\n\nyour CSS rules so they\
    \ take priority over rules from the parent page. For widgets that\n\nwant complete\
    \ immunity from the parent page, it could also mean serving your widget\n\non\
    \ a completely separate DOM, embedded in an iframe.\n\n We’ll get to iframes later\
    \ in this chapter. For now, we’ll focus on rendering HTML\n\nand CSS that live\
    \ on the same DOM as the publisher’s page. For widgets that aim to\n\noffer some\
    \ level of customization, this can be the most flexible solution for publish-\n\
    \ners, since the publisher can easily target your elements and style them to their\
    \ prefer-\n\nences. Unfortunately, this is also the downside! The publisher could\
    \ unknowingly\n\nhave CSS rules and/or JavaScript code that inadvertently target\
    \ your widget and\n\nwreak havoc.\n\n We’ll look at a number of ways to shield\
    \ your application’s HTML and CSS from the\n\npublisher’s code. First, you’ll\
    \ learn about HTML and CSS namespaces. Then, you’ll\n\nlearn about CSS specificity,\
    \ and how the parent page’s styles can override your own.\n\nFinally, you’ll learn\
    \ techniques for overruling the page’s parent styles, by overspecify-\n\ning your\
    \ CSS and abusing the !important keyword. First up, namespaces.\n\n*3.3.1*\n\n\
    *Namespaces*\n\nIf you look back at the source code examples from this chapter,\
    \ you might have\n\nnoticed that all DOM IDs, classes, data-\\* attributes, and\
    \ matching CSS selectors have\n\nbeen prefixed with stork-. The purpose? To reduce\
    \ the likelihood of those attributes\n\nconflicting with the parent page.\n\n\
    \ Consider the following situation. Your widget has a top-level <div> element\
    \ that\n\nacts as a container. It does this by setting an explicit width and height,\
    \ effectively\n\nbounding the area taken up by your widget. You’ve given this\
    \ <div> a straightforward\n\nclass name, container, which matches a style rule\
    \ in your accompanying CSS:\n\n<div class=\"container\">\n\n...\n\n</div>\n\n\
    www.it-ebooks.info"
