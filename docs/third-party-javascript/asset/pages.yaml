  md: "**41**\n\n***Passing script arguments***\n\n \n\nparams\\[key\\] = value;\n\
    \n}\n\nreturn params;\n\n}\n\nThe final code for extracting the product ID from\
    \ the script include URL looks like\n\nthis next snippet. Note that you can separate\
    \ the query string from the full URL using\n\na simple regular expression:\n\n\
    var url = getScriptUrl();\n\nvar params = getQueryParameters(url.replace(/^.\\\
    *\\\\?/, ''));\n\nvar productId = params.product;\n\nAt this point, your script\
    \ has the ID of the product it needs to request information\n\nfrom the server.\
    \ All that remains is to make some kind of AJAX request for that data,\n\nand\
    \ render the corresponding HTML on the page.\n\n But using the query string in\
    \ this fashion has a significant drawback. You’ll need to\n\ndistribute a different\
    \ script include snippet for each product, because the product ID\n\ncomponent\
    \ of the URL will change for each one. This will make caching your\n\nJavaScript\
    \ file difficult, because the web browser will treat every new URL as a brand-\n\
    \nnew resource, even if the query string doesn’t alter the code that’s being returned.\
    \ \n\n*2.5.2*\n\n*Using the fragment identifier*\n\nThere’s a way to pass parameters\
    \ to your script as part of the URL without sending the\n\nproduct ID to the server.\
    \ Instead of including the product ID in the URL’s query string,\n\nyou can pass\
    \ it as part of the URL’s fragment identifier. The fragment identifier is the\n\
    \nlast part of the URL, and includes everything that comes after the hash (#)\
    \ character.\n\nIt’s traditionally used to identify a portion of a document, and\
    \ unlike the query string,\n\nisn’t sent to the server by the browser.\n\n Here’s\
    \ the script URL again, this time embedding the product ID in the fragment\n\n\
    identifier:\n\nhttp://camerastork.com/widget.js#product\\_id=1234\n\nAmending\
    \ the earlier code to work with the fragment identifier is simple. You’ll still\n\
    \nobtain the full URL of the script element using the same getScriptUrl function\
    \ from\n\nearlier. Then you just need a different regular expression to separate\
    \ the fragment\n\nidentifier from the full URL before calling getQueryParameters:\n\
    \nvar params = getQueryParameters(url.replace(/^.\\*\\\\#/, ''));\n\nRemember\
    \ that parameters stored on the fragment identifier of the URL aren’t passed\n\
    \nto the server. For the purposes of the product widget, this is great; the base\
    \ URL you\n\ndistribute with your script include snippet is the same for each\
    \ product, which makes\n\ncaching your script file on the client easier. But for\
