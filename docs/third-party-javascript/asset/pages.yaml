  md: "**76**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\n Don’t get us wrong:\
    \ iframes are great tools for rendering secure and bulletproof\n\ncontent, and\
    \ will probably be your best friend by the end of the book. But they’re not\n\n\
    the be-all and end-all to rendering. In all likelihood, you’ll end up using a\
    \ healthy mix\n\nof both iframe and publisher DOM rendering to achieve your application’s\
    \ goals. \n\n*3.5*\n\n*Summary*\n\nFor a third-party JavaScript application, injecting\
    \ HTML and CSS into the publisher’s\n\npage requires more care than if you were\
    \ adding markup to a “safe” environment. You\n\nmust make sure that when outputting\
    \ HTML to the page, you aren’t slowing down the\n\npage with a blocking operation.\
    \ You also have to consider that your script might get\n\nincluded multiple times\
    \ on the same page, and it should render multiple instances\n\ngracefully. Additionally,\
    \ you should choose an optimal method for injecting CSS into\n\nthe publisher’s\
    \ page—either by inlining all your styles, appending link elements, or\n\nembedding\
    \ CSS rules in your JavaScript.\n\n But just getting HTML and CSS on the page\
    \ isn’t enough. You have to recognize that\n\nelements you introduce to the DOM\
    \ can conflict with the parent page. You also must\n\nconsider how your styles\
    \ might conflict with existing styles defined by the publisher. You\n\ncan use\
    \ a number of techniques for reducing the impact of parent styles on your widget:\n\
    \nby overspecifying your CSS rules or presenting your content behind an iframe,\
    \ whether\n\nit’s a src-less iframe or one that contains an external HTML document.\n\
    \n To recap where we are with the Camera Stork widget: at this point, you should\
    \ have\n\na fully styled version of the widget loading on the publisher’s page\
    \ that looks some-\n\nthing like the example from figure 3.3. You want to maintain\
    \ a consistent look and\n\nfeel across every website, and customization is not\
    \ a concern, so you’re rendering the\n\nwidget’s contents inside of an iframe.\
    \ The widget itself is still pretty static; it outputs\n\nup-to-date product information\
    \ for a given product, but doesn’t capture or process\n\nany input from the user,\
    \ like ratings or written reviews. To do that, you’ll have to learn\n\nhow to\
    \ communicate with the server, which is the topic of our next chapter.\n\nwww.it-ebooks.info"
