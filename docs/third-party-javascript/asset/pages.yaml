  md: "**174**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\nThis\
    \ function effectively replaces the single-purpose script you wrote for initializing\
    \ and\n\nrendering a product widget (widget.js). On its own, it may not seem exciting.\
    \ But even\n\nthis small function provides powerful advantages that a self-executing\
    \ script doesn’t.\n\nFor instance, the publisher can choose *when* to initialize\
    \ the widget, instead of having\n\nit occur automatically—a must for AJAX\\-heavy\
    \ web pages where content might be\n\ndeferred. In addition, it’s now easy for\
    \ the publisher to instantiate multiple instances of\n\nthe product widget on\
    \ their page *without* having to include multiple copies of the script\n\ninclude\
    \ snippet. Forgoing those extra script includes can lead to significant perfor-\n\
    \nmance gains, and ultimately requires less effort on the part of the publisher.\n\
    \n We just looked at one public function provided via an SDK—let’s look at another.\n\
    \nSuppose that after calling Stork.productWidget, the publisher wants to be notified\n\
    \nwhen visitors interact with the rendered widget. Perhaps a publisher wants to\
    \ know\n\nwhen a referral link inside the widget has been clicked, or when a review\
    \ has been sub-\n\nmitted by the visitor.\n\n To solve this, your SDK will expose\
    \ a function, Stork.listen, that lets publishers\n\nlisten to key application\
    \ events and invoke a callback function when they occur. In the\n\nfollowing example,\
    \ the publisher is using Stork.listen to listen to the review-\n\nSubmitted event,\
    \ which occurs when a visitor submits a review through the widget:\n\nStork.listen('reviewSubmitted',\
    \ function() {\n\nalert(\"The user submitted a review!\");\n\n});\n\nAgain, this\
    \ is a deeper integration with your software than just rendering a widget. By\n\
    \nproviding a JavaScript SDK, you’re empowering publishers to programmatically\
    \ define\n\nhow your software interacts with their content. For these reasons,\
    \ in many circles it’s\n\nconsidered the *preferred* way of distributing third-party\
    \ applications—even though it\n\nmay require more programming know-how on the\
    \ part of your publishers.\n\nSOFTWARE DEVELOPMENT KITS\n\n*SDK* is a relatively\
    \ new term in the world of\n\nclient-side JavaScript, but it’s common in software\
    \ development. Nominally, it\n\nrefers to a set of tools that enable the development\
    \ of applications for a spe-\n\ncific hardware or software platform. For example,\
    \ the iOS SDK is a set of\n\nObjective C libraries for developing native applications\
    \ for Apple’s iOS\n\nmobile operating system (https://developer.apple.com/devcenter/ios/).\n\
    \nThese libraries expose public functions for interacting with the iOS device’s\n\
    \nhardware, like rendering to the screen or taking a picture with an onboard\n\
    \ncamera. JavaScript SDKs function under a similar premise, but instead of pro-\n\
    \nviding functions that interact with hardware, they expose JavaScript functions\n\
    \nfor developing or integrating with a particular web software platform.\n\nIn\
    \ this chapter, through the lens of the Camera Stork example, we’ll teach you\
    \ how to\n\nimplement a third-party JavaScript SDK, which will become the primary\
    \ means\n\nthrough which publishers use your client-side code. We’ll start by\
    \ implementing SDK\n\nbasics: initialization, exposing some simple public functions,\
    \ and providing bindable\n\nevent hooks. Afterward, we’ll move into advanced topics,\
    \ like versioning your SDK and\n\nusing your SDK to wrap web service APIs.\n\n\
    www.it-ebooks.info"
