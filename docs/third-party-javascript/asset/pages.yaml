  md: "**39**\n\n***Passing script arguments***\n\nvar entry = document.getElementsByTagName('script')\\\
    [0\\];\n\nentry.parentNode.insertBefore(script, entry);\n\n})();\n\n</script>\n\
    \nYou might remember that this is the same parameter-passing technique we covered\
    \ in\n\nchapter 1 with the weather widget example. In that example, a server-side\
    \ Python\n\napplication read the ZIP code from the HTTP request’s query string.\
    \ The application\n\nthen queried the database for the relevant weather data and\
    \ generated JavaScript to\n\noutput the result on the publisher’s page.⁶\n\n This\
    \ time around, we’ll try a different approach. Instead of relying on a server-side\n\
    \nscript to obtain the passed parameter, you’ll retrieve the parameter using strictly\n\
    \nclient-side JavaScript.\n\n6 See Paul Irish, “The protocol-relative URL,” at\
    \ http://paulirish.com/2010/the-protocol-relative-url/.\n\nWorking with HTTPS\
    \ URLs\n\nSo far, all of the script-loading examples we’ve covered use strictly\
    \ the http://\n\nprotocol for URLs. This will work fine for 99% of websites, but\
    \ some publishers may\n\nbe serving their content using https:// (HTTP Secure).\
    \ This is a secure protocol that\n\nencrypts content between the server and the\
    \ browser.\n\nIn order to load your application properly on these websites (and\
    \ avoid “insecure con-\n\ntent” warnings), your application will also need to\
    \ be served using HTTPS. This\n\nrequires two things: configuring your servers\
    \ to support HTTPS, and having your script\n\ninclude snippet (and all other URLs)\
    \ point to the correct protocol. One technique is to\n\ncheck the protocol of\
    \ the current page, and defer to the appropriate URL:\n\nvar secure = window.location.protocol\
    \ === 'https:';\n\nscript.src = (secure ? 'https' : 'http') +\n\n'://camerastork.com/widget.js';\n\
    \nAlternatively, you can use what are known as *protocol-relative URLs*. These\
    \ automat-\n\nically resolve to the parent page’s protocol:\n\nscript.src = '//camerastork.com/widget.js';\n\
    \nOn http:// websites, this URL will resolve to *http:*//camerastork.com/widget.js.\
    \ On\n\nhttps:// websites, it’ll instead resolve to *https:*//camerastork/widget.js.\n\
    \nProtocol-relative URLs are more elegant and work in all browsers, but be careful—\n\
    \nthey can sometimes behave unexpectedly. For example, if you’re viewing a web\
    \ page\n\non your local filesystem using the file:// protocol, this example would\
    \ resolve to\n\nfile://camerastork.com/widget.js, a URL that (probably) doesn’t\
    \ exist. There are\n\nalso issues where some resources (like <link> tags) will\
    \ load twice when using\n\nprotocol-relative URLs on HTTPS pages.⁶\n\nRemember\
    \ that before you can use either technique, you have to configure your serv-\n\
    \ners to handle both HTTP and HTTPS. We’ll talk more about HTTPS later in this\
    \ book.\n\nwww.it-ebooks.info"
