  md: "**123**\n\n***Simple cross-domain messaging with easyXDM***\n\nAs you can see\
    \ from table 5.3, both the Socket and Rpc constructors accept a special\n\ncallback\
    \ function named onReady. This function will be called after the provider\n\n\
    iframe is fully loaded and the easyXDM instance inside is initialized. After your\
    \ call-\n\nback fires, it’s safe to send messages back and forth. We’ll continue\
    \ by showing you\n\nhow to send simple messages using easyXDM.Socket, and then\
    \ more complicated RPC\n\nexamples using easyxdm.RPC. \n\n*5.3.2*\n\n*Sending\
    \ simple messages using easyXDM.Socket*\n\nThe easyXDM.Socket object is simple:\
    \ it’s just a wrapper around the messaging trans-\n\nport stack provided by easyXDM.\
    \ It allows you to send and receive messages between\n\nwindows using an interface\
    \ that’s similar to the window.postMessage API.\n\n To get started, you need to\
    \ initialize a new Socket using the options outlined in\n\nsection 5.3.1. The\
    \ following example demonstrates creating a new minimal instance\n\nof easyXDM.Socket\
    \ on the consumer (parent) page:\n\nvar socket = new Stork.easyXDM.Socket({\n\n\
    remote: \"http://camerastork.com/xdm/provider/\",\n\nonMessage: function (message,\
    \ origin) {\n\nconsole.log(\"Received message\", message,\n\n\"from origin\",\
    \ origin);\n\n}\n\n});\n\nThe first option, remote, points to the URL of the provider—the\
    \ target web page that\n\nwill be loaded inside an iframe. The second option,\
    \ onMessage, specifies a callback\n\nfunction that will be invoked every time\
    \ your Socket receives a new message. You can\n\nthink of the onMessage callback\
    \ as a wrapper around the browser’s normal onmessage\n\nevent that you learned\
    \ about in section 5.1.2. The onMessage handler receives two for-\n\nmal parameters:\
    \ message (containing the actual message body) and origin (contain-\n\ning the\
    \ origin value of the sender). As with the window.postMessage API, it’s always\
    \ a\n\ngood idea to check that the origin is one you trust, and not a malicious\
    \ host trying to\n\nsubvert your application.\n\n Right now, you have a socket\
    \ opened on the consumer side only. To make commu-\n\nnication bidirectional,\
    \ you’ll also need to create a Socket on the provider. This is han-\n\ndled by\
    \ the following code, served at the provider URL:\n\nvar socket = new Stork.easyXDM.Socket({\n\
    \nonMessage: function (message, origin) {\n\nconsole.log(\"Received message\"\
    , message,\n\n\"from origin\", origin);\n\n}\n\n});\n\nNotice anything missing?\
    \ The provider doesn’t need to specify a remote property,\n\nbecause it isn’t\
    \ loading any additional iframes—it’s just communicating with the par-\n\nent\
    \ window (consumer).\n\nwww.it-ebooks.info"
