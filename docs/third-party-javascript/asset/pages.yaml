  md: "**135**\n\n***Third-party cookies***\n\nuser has to go out of their way to\
    \ disable them (see figure 6.2). But in some browsers,\n\nthird-party cookies\
    \ are disabled by default.\n\n If third-party cookies are disabled, does this\
    \ mean that the session-restoring sce-\n\nnario we just covered in section 6.1.1\
    \ will work? The answer is *maybe*. Different brows-\n\ners have different interpretations\
    \ of what it means to have third-party cookies\n\ndisabled. Some browsers disable\
    \ all reading and writing of cookies, rendering them\n\ncompletely unusable. Other\
    \ browsers prevent setting new cookies, but if a cookie\n\nalready exists for\
    \ a third-party domain, the browser still sends that cookie with any\n\nHTTP request\
    \ sent to that domain.\n\n Table 6.2 describes how each major browser behaves\
    \ when third-party cookies are\n\ndisabled, ordered from most restrictive to least\
    \ restrictive. *Send* means the browser will\n\nsend existing cookies to third-party\
    \ domains, and *Write* means cookies can be set on a\n\nthird-party domain.\n\n\
    \ As you can see from table 6.2, Chrome and Firefox are the most restrictive brows-\n\
    \ners when it comes to third-party cookies being disabled. They’ll neither send\
    \ previ-\n\nously stored cookies to third-party servers, nor allow new cookies\
    \ to be stored for\n\nthose domains. Unfortunately, there are no known workarounds\
    \ for these browsers,\n\nwhich means the session scenario from section 6.1 is\
    \ completely hosed. That doesn’t\n\nmean sessions are completely dead for these\
    \ browsers—we’ll introduce a cookieless\n\napproach later in this chapter.\n\n\
    Table 6.2\n\nBrowser behavior when third-party cookies are disabled\n\nBrowser\n\
    \nSend\n\nWrite\n\nDisabled by default\n\nChrome\n\nNo\n\nNo\n\nNo\n\nFirefox\n\
    \nNo\n\nNo\n\nNo\n\nInternet Explorer (all versions)\n\nYes\n\nNo\n\nNo (but see\
    \ section 6.1.3)\n\nOpera\n\nYes\n\nNo\n\nNo\n\nSafari (includes mobile)\n\nYes\n\
    \nSometimes\n\nYes\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_159_0.png)\n\n\
    Figure 6.2\n\nDisabling third-party cookies in Google Chrome 14\n\nwww.it-ebooks.info"
