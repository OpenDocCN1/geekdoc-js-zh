  md: "**24**\n\nCHAPTER 2\n\n***Distributing and loading your application***\n\n\
    \ You can start Apache by running the following command in your terminal:\n\n\
    $ sudo apachectl start\n\nBy default, Apache on OS X (Mountain Lion) makes /Library/WebServer/\n\
    \nDocuments/ available at http://localhost/. If you add your publisher test page\
    \ named\n\ntest.html to this Documents folder, it should be available at http://localhost/test.html.\n\
    \nWe’ll tweak these locations later in this tutorial.\n\nANOTHER SOLUTION: BUILT-IN\
    \ SERVERS\n\nIf dedicated web server software like\n\nApache feels a little heavy\
    \ for you, most popular programming languages\n\nhave built-in web server support.\
    \ For example, you can easily start a web\n\nserver in Python using the SimpleHTTPServer\
    \ module, which comes installed\n\nwith every Python installation:\n\n$ python\
    \ -m SimpleHTTPServer\n\nServing HTTP on 0.0.0.0 port 8000 ...\n\nAd hoc web servers\
    \ like this one have fewer features than full server offerings\n\nlike Apache,\
    \ but they’re great at serving code quickly. \n\n*2.1.3*\n\n*Simulating multiple\
    \ domains*\n\nAt this point, you have a local web server running, and your files\
    \ available via the local-\n\nhost hostname. Next, we’ll tackle the problem of\
    \ needing different domains from\n\nwhich to serve your test page and third-party\
    \ script.\n\n The good news is that you don’t need to spend money registering\
    \ domain names.\n\nYou can just edit your operating system’s hosts file and create\
    \ two entries that alias\n\nyour localhost. On OS X and Unix-based operating systems,\
    \ you should find your host\n\nsettings in /etc/hosts. On Windows, try C:/windows/system32/drivers/etc/hosts.\n\
    \nPlease note that you’ll probably need administrator access to edit your hosts\
    \ file:\n\n$ sudo vi /etc/hosts\n\nAdd the following two entries to the hosts\
    \ file. The format is the same in both Win-\n\ndows and Unix-based operating systems:\n\
    \n127.0.0.1 publisher.dev\n\n127.0.0.1 widget.dev\n\nAfter this change, you should\
    \ be able to access your local files served through Apache\n\nusing http://publisher.dev\
    \ and http://widget.dev. You’re probably aware that .dev\n\nisn’t an actual top-level\
    \ domain (TLD). We recommend using it over .com or .net so\n\nthat you don’t conflict\
    \ with any actual live websites with the same address.³\n\n There’s just one last\
    \ step: configuring Apache to point the root of each domain to\n\na different\
    \ directory. That way you can host your third-party scripts in one folder and\n\
    \nyour test page files in another.\n\n3 We should note that while this book was\
    \ being written, ICANN (Internet Corporation for Assigned Names\n\nand Numbers)\
    \ had just approved custom top-level domains. So .dev may in fact be a genuine\
    \ TLD by the time\n\nyou read this book.\n\nwww.it-ebooks.info"
