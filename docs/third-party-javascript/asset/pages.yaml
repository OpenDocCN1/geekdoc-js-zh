  md: "**20**\n\nCHAPTER 1\n\n***Introduction to third-party JavaScript***\n\nUnfortunately,\
    \ this list of challenges is just the tip of the iceberg. Third-party\n\nJavaScript\
    \ development is fraught with pitfalls, because at the end of the day, the web\n\
    \nbrowser wasn’t built with embedded applications and third-party code in mind.\
    \ Brows-\n\ners are getting better, and new features are being introduced that\
    \ alleviate some of the\n\nburden of doing third-party development, but it’s still\
    \ an uphill battle, and supporting\n\nold browsers is typically a must for any\
    \ kind of distributed application.\n\n But don’t worry. You’ve already made the\
    \ fine decision of purchasing this book,\n\nwhich will cover the problems facing\
    \ your third-party JavaScript code. And as an\n\nadded bonus, we’ll even tell\
    \ you how to solve them. \n\n*1.5*\n\n*Summary*\n\nThird-party JavaScript is a\
    \ powerful way of building embedded and highly distribut-\n\nable web applications.\
    \ These applications can come in many shapes and sizes, but we\n\nlooked at three\
    \ specific use cases: as interactive widgets, as passive scripts that collect\n\
    \ndata, and as developer libraries that communicate with third-party web APIs.\
    \ But com-\n\npared to developing regular stay-at-home web applications, third-party\
    \ scripts face\n\nadditional challenges. They require you to execute your code\
    \ in an unknown, shared,\n\nand potentially hostile browser environment.\n\n We’ve\
    \ only scratched the surface of what it means to write third-party scripts. In\
    \ the\n\nnext chapter, we’ll hit the ground running by covering the front-to-back\
    \ creation of an\n\nembedded widget. This is one of the most common use cases\
    \ for third-party\n\nJavaScript, and serves as an excellent starting place for\
    \ covering third-party concepts\n\nand challenges.\n\nwww.it-ebooks.info"
