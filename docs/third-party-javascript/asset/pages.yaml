  md: "**198**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\nthough,\
    \ so we advocate prefixing with your organization’s name instead (for\n\nexample,\
    \ CameraStork-\\*).\n\nBecause the easyXDM RPC object wraps window.postMessage\
    \ (and other fallback pro-\n\ntocols), it makes the Origin value available as\
    \ a property on the RPC instance.⁴ The\n\nnext listing is an amended version of\
    \ the apiTunnel function inside tunnel.html,\n\nwhich sends the parent Origin\
    \ via the CameraStork-Publisher-Origin header.\n\nfunction apiTunnel(endpoint,\
    \ params, callback) {\n\nfunction complete(xhr) { /\\* ... \\*/ }\n\nvar options\
    \ = {\n\nurl:\n\n'http://camerastork.com/api/' + endpoint,\n\ndata:\n\nparams,\n\
    \nmethod:\n\n'GET',\n\ncomplete: complete,\n\nheaders:\n\n{\n\n*'CameraStork-Publisher-Origin':\
    \ rpc.origin*\n\n}\n\n};\n\njQuery.ajax(options);\n\n}\n\nNow, on the server end,\
    \ you’ll need to validate the CameraStork-Publisher-Origin\n\nheader. Let’s revisit\
    \ the server API endpoint code—now in its final incarnation.\n\n@app.route('/api/<endpoint>')\n\
    \ndef api(endpoint=None):\n\npublisher\\_origin = request.headers\\['CameraStork-Publisher-Origin'\\\
    ]\n\ndomain = urlparse(publisher\\_origin).hostname\n\napi\\_key = request.args.get('apiKey')\n\
    \nif domain in trusted\\_domains(api\\_key):\n\nreturn api\\_request()\n\nelse:\n\
    \nreturn make\\_response('Unauthorized domain: %s' % domain, 403)\n\n\\# Continue\
    \ processing request\n\nPat yourself on the back. Your SDK now properly validates\
    \ that API requests match the\n\nset of trusted domains specified by your publisher.\
    \ As long as you can trust the value of\n\nCameraStork-Publisher-Origin, that\
    \ is. \n\n4 easyXDM uses a secure client-side handshaking process to guarantee\
    \ the Origin value hasn’t been tampered\n\nwith in fallback transports (window.name\
    \ or document fragment).\n\nListing 8.12\n\nUsing a custom header to pass the\
    \ URL to the server\n\nListing 8.13\n\nValidating **CameraStork-Publisher-Origin**\
    \ on the server\n\nwww.it-ebooks.info"
