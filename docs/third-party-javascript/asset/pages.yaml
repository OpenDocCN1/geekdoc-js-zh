  md: "**155**\n\n***Cross-site scripting***\n\nFacebook to appear styled like MySpace,²\
    \ to potentially disastrous wrongdoings like\n\nfinancial fraud. Cross-site scripting\
    \ is a type of vulnerability that enables attackers to\n\ninject their own code\
    \ into web pages viewed by other users. This is by far the most\n\ncommon source\
    \ of attacks in modern web applications, including third-party\n\nJavaScript applications.\
    \ According to Symantec’s Internet Security Threat Report,³\n\nXSS was responsible\
    \ for an astounding *80%* of all security vulnerabilities documented\n\nby its\
    \ authors in 2007.\n\n In this section, we’ll show you what XSS attacks look like,\
    \ explain how they work,\n\nand show you how to defend your own application against\
    \ such attacks. Let’s get\n\nstarted.\n\n*7.2.1*\n\n*XSS attacks*\n\nHow do attackers\
    \ inject their code into your web application? Usually, this becomes\n\npossible\
    \ when your application doesn’t filter input values sufficiently. For example,\
    \ con-\n\nsider the hypothetical situation where the Camera Stork website (http://camerastork\n\
    \n.com) displays user-submitted reviews on the main page without filtering any\
    \ input\n\ndata. Because the output of the page is an HTML document, the attacker\
    \ simply needs\n\nto embed their own HTML in the submitted review body, whereupon\
    \ their HTML will be\n\noutput to the page as-is. For example, if the attacker’s\
    \ review contained the following\n\ncode, all visitors to Camera Stork’s homepage\
    \ would see a not-very-helpful alert mes-\n\nsage saying “Hello, World”:\n\nThis\
    \ camera is great! I use it all the time.\n\n<script>alert(\"Hello, World\");</script>\n\
    \nThis “Hello, World” alert message isn’t very scary—but it’s an example of a\
    \ vulnerabil-\n\nity that can be exploited in many different ways to attack your\
    \ users or your pub-\n\nlisher’s visitors. For example, using this hole, an attacker\
    \ can capture the session\n\ntoken of an authenticated user by injecting JavaScript\
    \ code that steals the contents of\n\nthat user’s cookies (see figure 7.1). And\
    \ as you’re already aware, hijacking the user’s\n\nsession allows the attacker\
    \ to access any data about the user stored with the affected\n\nservice, and perform\
    \ malicious actions.\n\n Accessing a user’s cookies via injected code is trivial;\
    \ an attacker merely needs to\n\nquery the document.cookie property that you learned\
    \ about in chapter 6. But just\n\naccessing a user’s cookies isn’t enough—the\
    \ attacker has to retrieve them. To do this,\n\nthe attacker needs to make the\
    \ visitor’s browser issue an HTTP request with the con-\n\ntents of the cookies\
    \ to the attacker’s servers. There is no shortage of ways to do this:\n\nthey\
    \ could append a new script element to the DOM, issue a CORS\\-compatible\n\n\
    XmlHttpRequest, and so on. But the easiest—and *shortest*—way is using the browser’s\n\
    \nImage JavaScript object.\n\n2 This is a real story. Back in 2005, Chris Putnam\
    \ and a couple of his friends wrote a worm for Facebook. The\n\nworm exploited\
    \ a cross-site scripting vulnerability they found in one of the Facebook profile\
    \ fields and made\n\nthe social network look like its rival—MySpace. Chris Putnam\
    \ was later hired by Facebook.\n\n3 You can find this report on Symantec’s website:\
    \ http://mng.bz/RXI2.\n\nwww.it-ebooks.info"
