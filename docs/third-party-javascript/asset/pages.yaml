  md: "**237**\n\n***Testing***\n\nif (typeof arr.toJSON === \"function\") {\n\narr\
    \ = arr.toJSON();\n\ncorrupted = !(arr && arr.length === 3 && arr\\[2\\] === 3);\n\
    \n}\n\nif (!JSON || corrupted) {\n\nStork.JSON.stringify = function (obj) { /\\\
    * ... \\*/ };\n\nStork.JSON.parse = function (str) { /\\* ... \\*/ };\n\n} else\
    \ {\n\nStork.JSON.stringify = JSON.stringify;\n\nStork.JSON.parse = JSON.parse;\n\
    \n}\n\nNow that you’ve found and fixed the bug, you should write a regression\
    \ test to make\n\nsure that you won’t get bitten by this bug again. Any experienced\
    \ software developer\n\nwill tell you that automatic testing is important in any\
    \ software project, but it can get\n\ntricky with third-party JavaScript applications.\
    \ This next section shows you how to\n\nwrite good unit tests for third-party\
    \ applications. \n\n*10.2*\n\n*Testing*\n\nDeveloping a web application without\
    \ tests is like playing Russian roulette with your\n\ndeploys: you might get lucky\
    \ a few times, but sooner or later you’ll push broken code\n\nthat will bring\
    \ down your application. This isn’t because you’re a bad developer;\n\n*everyone*\
    \ makes mistakes. Web application bugs aren’t always immediately obvious.\n\n\
    Bugs can be introduced by a completely unrelated change to the code you’re modify-\n\
    \ning, and it’s hard to spot them without extensive, system-wide testing. This\
    \ is why auto-\n\nmatic testing is extremely important for any software project—including\
    \ third-party\n\nJavaScript applications.\n\n But testing third-party widgets\
    \ isn’t easy. You have to run tests in all supported\n\nbrowsers and make sure\
    \ that your tests cover common functionality as well as browser\n\nquirks. In\
    \ addition to that, most web-testing frameworks don’t provide sufficient isola-\n\
    \ntion mechanisms for individual tests and test suites. This means that if your\
    \ app uses\n\nany kind of global state—and most nontrivial widgets do—you have\
    \ to manually reset\n\nthat state *after each and every test* or different tests\
    \ can conflict with each other in\n\nunpredictable ways. Same goes with regression\
    \ tests—tests that make sure you don’t\n\nintroduce new bugs while pushing features.\
    \ How do you write a test case that makes\n\nsure Camera Stork works fine on pages\
    \ that overwrite the special toJSON method\n\nwithout affecting all other tests?\
    \ In this section, we’ll answer that question and others\n\nin regard to testing\
    \ third-party JavaScript applications, using different web-testing\n\nframeworks\
    \ and platforms. But first we’ll go over different types of tests and explain\n\
    \ntheir purpose.\n\n**Call toJSON function on **\n\n**a simple array to check\
    \ **\n\n**that it still returns the **\n\n**same array. If it doesn’t, **\n\n\
    **you can’t use native **\n\n**JSON objects anymore.**\n\n**If the browser doesn’t\
    \ **\n\n**support native JSON **\n\n**implementation or the page **\n\n**corrupted\
    \ it, use your own.**\n\n**Otherwise use the native **\n\n**functions—they’re\
    \ always **\n\n**faster than your own code.**\n\nwww.it-ebooks.info"
