  md: "**97**\n\n***Subdomain proxies***\n\nmust be defined in the parent’s execution\
    \ context. This means that in order to call\n\nthe desired function, you’ll have\
    \ to go one level up the window tree. And since you’ll\n\nbe accessing objects\
    \ outside of the iframe’s scope, both parties (your iframe and its\n\nhost window)\
    \ must change their origins to the common domain suffix:\n\n<!DOCTYPE html>\n\n\
    <html>\n\n<script>\n\ndocument.domain = \"publisher.com\";\n\nwindow.parent.jsonpCallback('{\"\
    status\":\"success\"}');\n\n</script>\n\n</html>\n\nAs you can see, the difference\
    \ between JSONP and this method is just in the padding.\n\nNormal JSONP uses a\
    \ simple function call as its padding, whereas this technique uses\n\nan entire\
    \ HTML document. But note that the actual response data—the JSON object—\n\ndidn’t\
    \ change. A good API always provides different endpoints that present the same\n\
    \ndata in different formats. \n\n*4.3.4*\n\n*Internet Explorer and subdomain proxies*\n\
    \nOf course, when you’re dealing with Internet Explorer, nothing is as easy as\
    \ it should\n\nbe. IE8 has an odd bug that prevents a top-level domain from communicating\
    \ with its\n\nsubdomain even when they both opt in to a common domain namespace.\n\
    \n Let’s say you have two pages—hosted on example.com and sub.example.com—and\n\
    \nthe latter opens the former in an iframe. You also want the iframed page to\
    \ communi-\n\ncate with its parent by calling a callback function using window.parent.callback().\n\
    \nHere’s the HTML for the page hosted at sub.example.com:\n\n<!DOCTYPE html>\n\
    \n<html>\n\n<head>\n\n<script>\n\ndocument.domain = 'example.com';\n\nfunction\
    \ callback() { /\\* ... \\*/ }\n\n</script>\n\n</head>\n\n<body>\n\n<iframe src=\"\
    http://example.com/\"></iframe>\n\n</body>\n\n</html>\n\nAnd here’s the HTML for\
    \ the page hosted on example.com:\n\n<!DOCTYPE html>\n\n<html>\n\n<script>\n\n\
    document.domain = 'example.com';\n\nwindow.parent.callback();\n\n</script>\n\n\
    </html>\n\nwww.it-ebooks.info"
