  md: "**149**\n\n***Securing sessions***\n\njust like HTTP, but routes all data through\
    \ a secure encrypted tunnel,⁵ thereby pre-\n\nventing your data from being intercepted\
    \ and read by unauthorized parties. Com-\n\nbined with secure cookies, which are\
    \ only transmittable through HTTPS, you can\n\neffectively put a halt to session\
    \ hijacking.\n\n Setting a secure cookie, like regular cookies, is done using\
    \ the Cookie-set HTTP\n\nheader. The last parameter, secure, is what sets them\
    \ apart:\n\nSet-cookie: sessionid=66d2520a77a3c6dac4db658c6dd13061; secure\n\n\
    Afterward, this cookie will be sent by the browser with all requests to https://\n\
    \ncamerastork.com. By stating that it’s a secure cookie, the browser *will not*\
    \ transmit\n\nthis cookie to any non-HTTPS requests to the same domain (http://camerastork\n\
    \n.com). If it did, using HTTPS would offer little protection, because the same\
    \ cookie\n\nwould be sent in plain text for any non-HTTPS requests, undermining\
    \ our efforts.\n\nBasically, be aware of the secure flag when setting cookies,\
    \ and use it for cookies\n\nthat should only be transmitted over HTTPS.\n\n If\
    \ you ever need to set a secure cookie via JavaScript, document.cookie uses the\n\
    \nsame syntax as the Set-cookie header:\n\ndocument.cookie = 'sessionid=66d2520a77a3c6dac4db658c6dd13061;\
    \ secure';\n\nIdeally, you should use HTTPS everywhere you transmit sessions.\
    \ But HTTPS can be a\n\ncomplicated undertaking, particularly for high-traffic,\
    \ distributed applications like\n\nthird-party scripts. If you’re a small operation,\
    \ and learning to scale HTTPS isn’t in\n\nyour immediate future, there’s an alternative\
    \ approach that can minimize the impact\n\nof session hijacking without the overhead\
    \ of using HTTPS for every request: multilevel\n\nauthentication. \n\n*6.3.2*\n\
    \n*Multilevel authentication*\n\nSession hijacking is a reality faced by every\
    \ web application, but the impact is greater\n\nfor some applications than others.\
    \ For example, if an attacker were to gain access to a\n\nuser’s session for a\
    \ small online forum, they might be able to make disparaging com-\n\nments under\
    \ that user’s identity. Certainly an awful situation, but perhaps an accept-\n\
    \nable risk. Contrast this with a banking application—an attacker gaining a user’s\n\
    \nbanking session could conceivably empty their bank accounts, commit identity\
    \ fraud\n\nwith the information contained therein, or perform any number of financially\
    \ damag-\n\ning actions. This kind of security breach could sink a company.\n\n\
    \ Let’s go back to the Camera Stork example for a moment. If you recall, you were\n\
    \nbuilding a widget for camerastork.com, an existing e-commerce store that sells\
    \ photog-\n\nraphy equipment online. Let’s imagine that Camera Stork users store\
    \ their credit card\n\ninformation on camerastork.com, so they don’t have to punch\
    \ in their details every\n\ntime they buy a shiny new lens filter. The downside\
    \ is that if an attacker gained access\n\n5 Enabling HTTPS involves configuring\
    \ your web server software, and is outside the scope of this book. Look\n\nat\
    \ your server documentation to find out more.\n\nwww.it-ebooks.info"
