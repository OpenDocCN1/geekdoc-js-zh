  md: "**230**\n\nCHAPTER 10\n\n***Debugging and testing***\n\nFEATURE SWITCHES\n\n\
    If you’ve ever used Twitter or Facebook, you might’ve noticed that these companies\n\
    \ndon’t release new features to all their users at once. Most often, they start\
    \ by giving a\n\nsmall percentage of their users access to a new feature (say,\
    \ 10%), and then, after\n\nadditional testing, they gradually increase that percentage\
    \ until it reaches all users.\n\nYou can use this same technique with a system\
    \ of *feature switches* (sometimes also called\n\n*feature flippers*). Switches\
    \ are special conditions that allow you to restrict certain fea-\n\ntures of your\
    \ application to a subset of users, publishers, and environments. This\n\nmeans\
    \ that you can use switches to decide—at request time—which code path to\n\nchoose,\
    \ which interface to load, and so on.\n\n At this point, you might be wondering\
    \ how feature switches relate to debugging\n\nand testing your application. With\
    \ feature switches, you can have both versions of\n\nyour code—production and\
    \ development—on your servers and pick which one to\n\nload based on the current\
    \ request and your current switch configuration. For exam-\n\nple, you can make\
    \ a switch that loads debug code only when a user with the user-\n\nname admin\
    \ makes a request to your servers. Then, in order to be served unminified\n\n\
    ![](img/5163284bc2a93c8f882ffdc058bb516a_254_0.png)\n\nFigure 10.3\n\nA network\
    \ connections dialog in Mozilla Firefox where you can \n\nprovide your custom\
    \ HTTP proxy information\n\nwww.it-ebooks.info"
