  md: "**91**\n\n***Subdomain proxies***\n\n*4.3.2*\n\n*Cross-origin messaging using\
    \ subdomain proxies*\n\nLet’s go back to our temporarily forgotten Camera Stork\
    \ product widget. When we\n\nleft it, we were trying to request product data dynamically\
    \ from the server in order to\n\nrender the product on the publisher’s page. Suppose\
    \ the Camera Stork website has an\n\nAPI endpoint located at http://camerastork.com/api/products\
    \ that returns serialized\n\nJSON data for a given product ID. Let’s write a function\
    \ for your third-party applica-\n\ntion that requests data from this URL. The\
    \ function in listing 4.4 will use jQuery’s\n\nAJAX helper function, jQuery.ajax,\
    \ because you don’t want to write and maintain yet\n\nanother XmlHttpRequest library.\n\
    \nfunction getProductData(id) {\n\njQuery.ajax({\n\ntype: \"GET\",\n\nurl:\n\n\
    \"http://camerastork.com/api/products/\",\n\ndata: { product: id },\n\nsuccess:\
    \ function (data) {\n\nrenderWidget(data);\n\n}\n\n});\n\n}\n\nAs you’re probably\
    \ well aware of by now, attempting this AJAX request from the pub-\n\nlisher’s\
    \ page to your own servers will fail miserably due to the same-origin policy.\
    \ But\n\nthis can be circumvented using a subdomain proxy.\n\n Let’s say your\
    \ widget code is being executed on a publisher’s website located at\n\nwww.publisher.com.\
    \ You’ve had them create a new subdomain, stork.publisher.com,\n\nthat points\
    \ to your servers at camerastork.com. This means your product API end-\n\npoint\
    \ will additionally be accessible at http://stork.publisher.com/api/products.\n\
    \n Now, even though this endpoint is available in the same domain space as the\
    \ pub-\n\nlisher’s page, your third-party script still can’t make direct AJAX\
    \ requests to it. Because\n\nboth parties have to opt in to the same domain namespace,\
    \ browsers must be able to\n\ncheck for the origin value before making the request.\
    \ And with AJAX it’s impossible to\n\ncheck whether the receiving party wants\
    \ to opt in without first making the request.\n\nThis is why, when it comes to\
    \ XMLHttpRequest calls, browsers perform the SOP test\n\nbased on the request\
    \ URL without initiating the actual request (as you’ll see later,\n\nCORS specification\
    \ fixes that issue by defining special headers and preflight requests).\n\nSUBDOMAIN\
    \ TUNNEL FILE\n\nTo work around this, you’ll need to host a page available through\
    \ your newly created\n\nsubdomain proxy (stork.publisher.com) that will do two\
    \ things: opt in to the pub-\n\nlisher’s higher-level domain (publisher.com) and\
    \ load the jQuery library:\n\n<!DOCTYPE html>\n\n<html>\n\n<script>\n\ndocument.domain\
    \ = 'publisher.com';\n\nListing 4.4\n\nA function to retrieve product information\
    \ from the Camera Stork website\n\nwww.it-ebooks.info"
