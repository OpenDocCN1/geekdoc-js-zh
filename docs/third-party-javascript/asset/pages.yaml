  md: "**125**\n\n***Simple cross-domain messaging with easyXDM***\n\n*5.3.3*\n\n\
    *Defining JSON-RPC interfaces using easyXDM.Rpc*\n\n*RPC* (which stands for *Remote\
    \ Procedure Call*) is a way for a program to cause a proce-\n\ndure or a function\
    \ to execute in another address space without the programmer\n\nexplicitly coding\
    \ the communication details. Address space can be a memory cell, disk\n\nsector,\
    \ network host, or any other entity. Throughout history, programmers—usually\n\
    \nwhile working for big corporations—have tried to make it easier to call procedures\
    \ on\n\nremote entities by designing complicated RPC protocols. They came up with\
    \ things\n\nlike the Common Object Request Broker Architecture (CORBA) and Simple\
    \ Object\n\nAccess Protocol (SOAP), protocols that at least one of these authors\
    \ still sees in his\n\nnightmares. These ghosts of programming past aside, the\
    \ concept of RPC is useful,\n\nespecially when you’re developing a third-party\
    \ application that communicates with\n\nremote documents and servers.\n\n Let’s\
    \ go back to the Camera Stork widget. If you recall, the widget needs to accept\n\
    \nproduct reviews from users and transmit them to the Camera Stork servers. With\
    \ a sim-\n\nple message-passing system—using either window.postMessage or easyXDM.Socket—\n\
    \nyou’ll have to come up with a protocol that both consumer and provider can use\
    \ to sort\n\nmessages from each other. You don’t want a message containing a password\
    \ to be mis-\n\ntaken for a message that contains a user’s camera review. Since\
    \ we’re all JavaScript\n\ndevelopers here, you’ll most probably pick JSON as the\
    \ default format for your proto-\n\ncol. So a message to post a review will look\
    \ something like this:\n\n{\n\n\"commandId\": 235711,\n\n\"command\":\n\n\"postReview\"\
    ,\n\n\"productId\": 31415,\n\n\"userId\":\n\n31337,\n\n\"text\":\n\n\"This camera\
    \ is great!\"\n\n}\n\nThe provider will receive this message, process it, and\
    \ send it to the Camera Stork\n\nservers. Then, depending on the response from\
    \ the servers, the provider will send a\n\nmessage to the consumer describing\
    \ whether the operation was successful. Both con-\n\nsumer and provider need to\
    \ maintain a shared state of commands—hence, the\n\ncommandId parameter—or the\
    \ consumer won’t know, upon receiving the response,\n\nwhich operation it belongs\
    \ to. As you can see, this implementation might get hairy\n\nquickly. Luckily\
    \ for us, easyXDM.Rpc takes care of all of this for us.\n\n With easyXDM.Rpc you\
    \ specify local and remote functions. Local functions are just\n\nas they sound—local\
    \ functions implemented in the current window context. Remote\n\nfunctions, on\
    \ the other hand, are actually implemented inside the iframed document.\n\nThe\
    \ easyXDM.Rpc constructor takes two formal parameters: communication options\n\
    \n(the same as for easyXDM.Socket from section 5.3.2) and lists of local and remote\n\
    \nfunctions. Because you don’t actually implement remote functions in this context,\
    \ the\n\nremote option takes a list of stubs that represent the remote functions.\n\
    \nwww.it-ebooks.info"
