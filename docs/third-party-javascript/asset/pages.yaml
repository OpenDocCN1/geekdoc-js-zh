  md: "**209**\n\n***Optimizing payload***\n\nDEFERRING THE WIDGET BODY\n\nThis technique—referred\
    \ to by some as *lazy loading*—is an extreme way of reducing\n\nthe initial payload\
    \ by deferring most of your application code until the widget body is\n\nactually\
    \ viewed by the user. The implementation is simple: the initial loader script\
    \ ini-\n\ntializes itself on the page, and then does nothing except listen to\
    \ the window’s scroll\n\nevent. When the loader detects that the widget is about\
    \ to enter the user’s viewport, it\n\nbegins downloading the required components\
    \ and renders the widget as usual. If\n\nmany of your publishers’ visitors will\
    \ never actually view your widget content, your\n\napplication will issue less\
