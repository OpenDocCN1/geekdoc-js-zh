  md: "**78**\n\nCHAPTER 4\n\n***Communicating with the server***\n\nCamera Stork\
    \ inventory is huge and constantly changing. There’s no way it could be\n\nembedded\
    \ in a single JavaScript file. Instead, when you know which product the pub-\n\
    \nlisher is trying to render, you’ll need to make an individual request for the\
    \ latest data\n\nfor that product from your servers. Furthermore, when you begin\
    \ collecting ratings\n\nand reviews from users via the widget, you’ll want to\
    \ be able to submit those ratings to\n\nyour servers as well. To do all this,\
    \ your application has to have a communication\n\nchannel with your servers. Building\
    \ such channels is the topic of this and the follow-\n\ning chapter, our two-part\
    \ discussion on communicating with the server.\n\n If you’re an experienced web\
    \ developer, you might think that sending data from\n\nJavaScript running in the\
    \ browser to your web servers is a simple task. In an ordinary\n\nweb application,\
    \ you’d be right. But third-party applications almost always necessitate\n\nmaking\
    \ what are known as *cross-domain* requests: HTTP requests originating from a\n\
    \nweb page on one domain to a second, separate domain. An example would be an\n\
    \nHTTP request originating from a publisher’s web page located at publisher.com\
    \ to\n\nyour servers (camerastork.com) for product data.\n\n These cross-domain\
    \ requests cause all sorts of trouble for third-party scripters—for\n\ninstance,\
    \ you can’t use XmlHttpRequest, the go-to tool for making dynamic HTTP\n\nrequests\
    \ from JavaScript. Instead, you’ll have to use hacks and workarounds that differ\n\
    \nin speed, complexity, and browser support.\n\n In this chapter, we’ll go over\
    \ an initial set of techniques you can use to send data\n\nback to your servers:\
    \ subdomain proxies, JSONP, and the cross-origin resource sharing\n\nspecification\
    \ (CORS). They all differ in their abilities—some work only between sub-\n\ndomains;\
    \ others don’t support the full range of HTTP methods—but all of them can\n\n\
    prove themselves useful under certain circumstances. Real-world, third-party applica-\n\
    \ntions usually use a healthy mix of all these techniques.\n\n But before we get\
    \ started, let’s see why cross-domain requests are hard and why you\n\ncan’t use\
    \ good ol’ XMLHttpRequest.\n\n*4.1*\n\n*AJAX and the browser same-origin policy*\n\
    \nSuppose you’re making an ordinary web application that’s accessible at a single\n\
    \ndomain. This application is deployed in a controlled environment: you know exactly\n\
    \nwhere your code will be executed, and all resources are served from the same\
    \ domain.\n\nYou use the XMLHttpRequest object to asynchronously send requests\
    \ to your servers.\n\nThis object enables you to send data back and forth without\
    \ reloading the page, which\n\nyou use to update components of your web application\
    \ seamlessly and provide a\n\nsmooth user experience.\n\n This experience is exactly\
    \ what you want to have in a third-party widget. You could\n\neven argue that\
    \ this experience is more important in a third-party world because\n\nnobody wants\
    \ to install a widget that steals users by redirecting them away from the\n\n\
    original host. So why can’t you use XMLHttpRequest again?\n\nAJAX (Asynchronous\
    \ JavaScript and XML) is a powerful set of methods. And\n\nbecause it’s so powerful,\
    \ it can also be dangerous when used by a malicious party in an\n\nwww.it-ebooks.info"
