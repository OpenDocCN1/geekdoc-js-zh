  md: "**193**\n\n***Wrapping web service APIs***\n\nFACEBOOK’S JAVASCRIPT SDK AND\
    \ FB.API\n\nDoes Stork.api look familiar? If\n\nyou’ve done any work with Facebook’s\
    \ JavaScript SDK, it might. Stork.api\n\nis inspired by FB.api, a public function\
    \ exposed by Facebook’s JavaScript\n\nSDK that wraps the Facebook Graph API. Learn\
    \ more at https://developers\n\n.facebook.com/docs/reference/javascript/FB.api/.\n\
    \nAll right, this interface looks pretty good to us. It’ll give publishers a straightforward\n\
    \nmeans of communicating with the Camera Stork API from the browser, and they\
    \ don’t\n\nneed to concern themselves with the details of cross-domain communication.\
    \ Now,\n\nlet’s get down to implementing it. \n\nCOMMUNICATING WITH THE API\n\n\
    The next order of business is having your newly minted Stork.api function issue\
    \ a\n\nrequest to the web service API. But as you recall, the SDK is being loaded\
    \ onto the pub-\n\nlisher’s document, and the API is located on a different domain\
    \ (camerastork.com),\n\nso you can’t use XmlHttpRequest as-is. Although CORS and\
    \ JSONP are possible solu-\n\ntions here, you want to support the widest range\
    \ of browsers possible, so you’ll imple-\n\nment a cross-domain tunnel using easyXDM,\
    \ through which XmlHttpRequest can be\n\nsafely used.\n\n This is how it works:\
    \ your code will create a new iframe element on the publisher’s\n\npage that points\
    \ to a tunnel file hosted on camerastork.com. Because this tunnel file is\n\n\
    hosted on the same domain as your API, it can issue XmlHttpRequests without repri-\n\
    \nmand. To communicate with the code running on the tunnel file (inside the iframe),\n\
    \nyou’ll use the easyXDM messaging library (see figure 8.2). This means that easyXDM\n\
    \nwill need to be loaded alongside the SDK’s main library files during initialization.\n\
    \n Speaking of which, let’s return to the initialization method. As you did before,\
    \ you’ll\n\nload the main SDK library file. But when that file is ready, you’ll\
    \ create a new easyXDM\n\nRPC (remote procedure call) object that loads a tunnel\
    \ file hosted on camerastork.com\n\nPublisher\n\nStork.api\n\neasyXDM\n\nXHR\n\
    \npublisher.com\n\ncamerastork.com\n\nSDK\n\ntunnel.html\n\nAPI\n\nFigure 8.2\n\
    \nInitiating a cross-domain **XmlHttpRequest** through a tunnel file\n\nwww.it-ebooks.info"
