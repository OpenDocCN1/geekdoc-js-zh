  md: "**22**\n\nCHAPTER 2\n\n***Distributing and loading your application***\n\n\
    \ The solution: an embeddable widget (see figure 2.1) that\n\nshows up-to-date\
    \ information about a specific product, and a\n\nlink to purchase it at your store.\
    \ It’ll include all the standard\n\nproduct information: name, photo, price, and\
    \ average rating.\n\nBut it won’t be strictly read-only. Given that your store\
    \ has a\n\nstrong emphasis on user reviews, you also want users to be\n\nable\
    \ to submit new reviews from the widget. Since it’s impor-\n\ntant to know who’s\
    \ reviewing what, you also want users to be\n\nable to log in through the widget,\
    \ and even persist sessions\n\nbetween different widget instances.\n\n As you\
    \ might expect, you’ll implement this widget as a\n\nthird-party JavaScript application.\
    \ Just like the weather widget\n\nexample from chapter 1, loyal fans (or publishers)\
    \ will obtain\n\nan HTML snippet from your e-commerce store and insert it\n\n\
    into their own web pages’ HTML source code. This snippet will load your application\n\
    \ncode and render the widget on their web page. The location in their HTML source\n\
    \ncode where the snippet is placed denotes where the widget will be rendered.\n\
    \n We’ll develop this product widget over the course of the book. Later chapters\
    \ will\n\ndeal with more advanced topics: communicating with the server, rendering,\
    \ maintain-\n\ning sessions, and performance. But before we get there, we have\
    \ to address some\n\nimportant first steps: getting your application code loaded\
    \ and executed on the pub-\n\nlisher’s website.\n\n There’s a lot more to this\
    \ than you might expect. For starters, you’ll need to craft\n\nthe aforementioned\
    \ HTML snippet that will load your initial script file on publishers’\n\nweb pages.\
    \ Then you’ll need to load any supporting JavaScript files, libraries, and\n\n\
    stylesheets. You’ll also need to figure out how the publisher will pass parameters\
    \ to\n\nyour script files, in order to identify what product they’re trying to\
    \ embed on their\n\npage. And unlike the weather widget example from chapter 1,\
    \ you’ll do all of this\n\nwithout using any server-side script generation.\n\n\
    \ But since this is your first foray into the art of third-party development,\
    \ you’ll also\n\nwant to spend a few minutes to configure your local development\
    \ machine to represent\n\nthe cross-domain environment you’ll be writing your\
    \ code for. Let’s tackle that next.\n\n*2.1*\n\n*Configuring your environment\
    \ for *\n\n*third-party development*\n\nAs we discussed in chapter 1, the web\
    \ browser treats scripts that communicate with\n\nexternal servers differently\
