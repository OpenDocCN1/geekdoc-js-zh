  md: "**202**\n\n*Performance*\n\nAt this point, you’ve learned almost everything\
    \ you need to know about building a\n\nthird-party JavaScript application. You\
    \ know how to distribute your code, render\n\nsafely on the publisher’s page,\
    \ establish communication channels, and even pro-\n\nvide a suite of client-side\
    \ functionalities through a JavaScript SDK. You’re also famil-\n\niar with the\
    \ common security threats you might encounter when your application is\n\nexposed\
    \ to the public. Now that we’ve covered the fundamentals, we’ll discuss how\n\n\
    to make your third-party application *fast*.\n\n Performance is an extremely important\
    \ topic. Companies with high traffic\n\napplications save millions of dollars\
    \ by tweaking and optimizing their performance.\n\nGoogle, for example, found\
    \ out that a one-half-second delay in returning a search\n\nresults page damaged\
    \ user satisfaction, resulting in a 20% drop in traffic. And for a\n\ncompany\
    \ that generates 95% of its profits from advertising, a 20% drop in traffic\n\n\
    *This chapter covers*\n\nMinimizing initial payload\n\nReducing network requests\n\
    \nMinimizing impact on the publisher’s page\n\nControlling expensive JavaScript\
    \ calls\n\nImproving perceived performance\n\nwww.it-ebooks.info"
