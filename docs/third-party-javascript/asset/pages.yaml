  md: "**1**\n\n*Introduction to*\n\n*third-party JavaScript*\n\nThird-party JavaScript\
    \ is a pattern of JavaScript programming that enables the cre-\n\nation of highly\
    \ distributable web applications. Unlike regular web applications,\n\nwhich are\
    \ accessed at a single web address (http://yourapp.com), these applica-\n\ntions\
    \ can be arbitrarily loaded on any web page using simple JavaScript includes.\n\
    \n You’ve probably encountered third-party JavaScript before. For example, con-\n\
    \nsider ad scripts, which generate and display targeted ads on publisher websites.\
    \ Ad\n\nscripts might not be a hit with users, but they help web publishers earn\
    \ revenue and\n\nstay in business. They’re visible on millions of websites, and\
    \ yet nearly all of them\n\nare third-party scripts, served from separate ad servers.\
    \ \n\n*This chapter covers*\n\nExplaining third-party JavaScript\n\nReal-world\
    \ examples of third-party applications\n\nWalk-through implementation of a simple\
    \ \n\nembedded widget\n\nIdentifying third-party development challenges\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 25
- img_proc: true
  md: "**2**\n\nCHAPTER 1\n\n***Introduction to third-party JavaScript***\n\n Ad scripts\
    \ are just one use case; developers look to third-party scripts to solve a\n\n\
    number of problems. Some use them to create standalone products that serve the\n\
    \nneeds of publishers. For example, Disqus, a web startup from San Francisco—and\
    \ the\n\nemployer of the fine authors of this book—develops a third-party commenting\
    \ appli-\n\ncation that gives web publishers an instant commenting system. Others\
    \ develop third-\n\nparty scripts to extend their traditional web applications\
    \ to reach audiences on other\n\nwebsites. For example, Facebook and Twitter have\
    \ developed dozens of social widgets\n\nthat are loaded on publisher websites.\
    \ These widgets help social networks engage\n\ntheir users outside of their applications’\
    \ normal ecosystems.\n\n Small companies can benefit from third-party JavaScript\
    \ too. Let’s say you’re the\n\nowner of a B2B (business-to-business) web application\
    \ that hosts web forms to collect\n\ninformation from your customers’ clients.\
    \ You have potential customers out there\n\nwho’d love to use your application,\
    \ but are hesitant to redirect their users to an exter-\n\nnal website. With third-party\
    \ JavaScript, you can have customers load your form appli-\n\ncation directly\
    \ on their own web pages, solving their redirect concerns.\n\n Third-party JavaScript\
    \ isn’t all gravy. Writing these applications is far from trivial.\n\nThere are\
    \ plenty of pitfalls and hackery you’ll need to overcome before you can ship\n\
    \nthird-party JavaScript that will hold its own in the wild. Luckily, this book\
    \ will show you\n\nhow by guiding you through the complete development of a full-featured\
    \ third-party\n\napplication.\n\n But before we dive into the bowels of third-party\
    \ JavaScript, you need to learn the\n\nfundamentals. In this chapter, we’ll better\
    \ define third-party JavaScript, look at real-\n\nworld implementations from a\
    \ number of companies, go over a simple implementa-\n\ntion of a third-party application,\
    \ and discuss the numerous challenges facing third-\n\nparty development.\n\n\
    \ Let’s start with trying to get a better handle on what third-party JavaScript\
    \ is and\n\nwhat we can do with it.\n\n*1.1*\n\n*Defining third-party JavaScript*\n\
    \nIn a typical software exchange, there are two parties. There’s the consumer,\
    \ or first\n\nparty, who is operating the software. The second party is the provider\
    \ or author of that\n\nsoftware.\n\n On the web, you might think of the first\
    \ party as a user who’s operating a web\n\nbrowser. When they visit a web page,\
    \ the browser makes a request from a content pro-\n\nvider. That provider, the\
    \ second party, transmits the web page’s HTML, images,\n\nstylesheets, and scripts\
    \ from their servers back to the user’s web browser.\n\n For a particularly simple\
    \ web exchange like this one, there might only be two par-\n\nties. But most website\
    \ providers today also include content from other sources, or\n\nthird parties.\
    \ As illustrated in figure 1.1, third parties might provide anything from\n\n\
    article content (Associated Press), to avatar hosting (Gravatar), to embedded\
    \ videos\n\n(YouTube). In the strictest sense, anything served to the client that’s\
    \ provided by an\n\norganization that’s not the website provider is considered\
    \ to be third-party.\n\nwww.it-ebooks.info"
