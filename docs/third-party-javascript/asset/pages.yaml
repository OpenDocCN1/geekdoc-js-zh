  md: "**23**\n\n***Configuring your environment for third-party development***\n\n\
    \ Remember: your goal is to serve a script from your servers and have it loaded\
    \ on a\n\npublisher’s website. So to re-create that scenario, you’ll need to have\
    \ a test page to\n\nsimulate a publisher’s website and a web server to serve your\
    \ script from. You’ll also\n\nneed both the test page and script files served\
    \ from different domains.\n\n*2.1.1*\n\n*Publisher test page*\n\nLet’s start with\
    \ the publisher test page. This is the page where you’ll load your third-\n\n\
    party script and the environment in which that script will be executed. Any page\
    \ will\n\ndo, but we’ll start with a bare-bones HTML file:\n\n<!DOCTYPE html>\n\
    \n<html>\n\n<head>\n\n<title>Publisher Test Page</title>\n\n</head>\n\n<body>\n\
    \n<h1>Publisher Test Page</h1>\n\n<!-- script include snippet here -->\n\n</body>\n\
    \n</html>\n\nIronically, the part of this example you’ll want to focus on is the\
    \ part that’s missing:\n\nthe script include snippet. This is the HTML snippet\
    \ that you’ll give to publishers\n\nthat will load your third-party script on\
    \ their page. We don’t have one yet, so keep it\n\nblank for now; we’ll come back\
    \ to this later.\n\n Now, this example makes for a boring test page; it’s a blank\
    \ page with a header. But\n\nthis is just to get you started. In an ideal world,\
    \ your test page will be representative of\n\na typical page from your target\
    \ audience. For example, if your product widget is tar-\n\ngeted primarily at\
    \ bloggers, the test page should illustrate how the widget might\n\nappear on\
    \ a typical blog. You could even use a static copy of a known publisher’s web\n\
    \npage. The closer your test page reflects the environment in which your script\
    \ will be\n\ndeployed, the fewer surprises you’ll face later. \n\n*2.1.2*\n\n\
    *The web server*\n\nIn order to serve your test page and script files to the browser,\
    \ you’ll need to have web\n\nserver software running on your local development\
    \ machine. Even though you *could*\n\nuse your web browser to open these files\
    \ directly from your filesystem, they’ll be\n\nserved using the file:// protocol,\
    \ which doesn’t have a domain component. This will\n\nmake simulating a cross-domain\
    \ environment nigh impossible. Save yourself a world\n\nof pain and use a local\
    \ web server.\n\n If you’re not already using a local web server, don’t worry.\
    \ Mac users will be pleased\n\nto know that the Apache web server is installed\
    \ by default on OS X. If you’re doing\n\nyour development on Windows, you’ll need\
    \ to download and install Apache yourself.²\n\n2 See http://httpd.apache.org for\
    \ instructions on installing Apache. Alternatively, you can check out Wamp-\n\n\
    Server, an open source distribution of Apache, PHP, and MySQL for Windows.\n\n\
    www.it-ebooks.info"
