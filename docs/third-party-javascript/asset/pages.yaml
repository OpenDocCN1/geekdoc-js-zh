  md: "**69**\n\n***Embedding content in iframes***\n\nYou’re probably thinking to\
    \ yourself, “Wait a minute—isn’t document.write bad?”\n\nIframes are processed\
    \ by the browser asynchronously, so even if there are blocking\n\noperations (like\
    \ document.write) inside your iframe body, they won’t cause the\n\nbrowser to\
    \ stop processing the parent page. There’s one caveat. Iframes can still block\n\
    \nthe parent page’s onload event, because the parent page waits for the onload\
    \ event of\n\nall child windows before firing. This means that any long-loading\
    \ resources inside the\n\niframe could delay this event, possibly affecting the\
    \ parent page. But fear not—calling\n\ndocument.close() inside the iframe after\
    \ you’re done rendering forces the onload\n\nevent to fire, circumventing this\
    \ behavior.\n\n You’ll also notice that, in this example, the namespaced IDs and\
    \ classes we intro-\n\nduced in the last section are gone. This is because iframes\
    \ can’t inherit style rules or\n\nbe accidentally queried from the parent page,\
    \ so you’re free to use whatever attributes\n\nyou prefer.\n\n Src-less iframes\
    \ are a powerful way to present content in a way that can’t *accidentally*\n\n\
    conflict with the parent page. But if you can access the iframe’s contents from\
    \ your\n\nthird-party script, so can the publisher. This means that they can write\
    \ JavaScript code\n\nto access your iframe’s content and change it to their liking.\
    \ That could mean inject-\n\ning CSS directly into the iframe, or modifying the\
    \ DOM elements in some way.\n\nDepending on the objectives of your application,\
    \ you might be comfortable permit-\n\nting the publisher access to your application’s\
    \ contents. But if your application con-\n\ntains sensitive information, or is\
    \ connected with a well-known brand and shouldn’t be\n\nmodified, there’s an alternate\
    \ approach to using iframes that makes them practically\n\nimpenetrable.³\n\n\
    3 Wikipedia has a handy list of different situations in which quirks mode can\
    \ be triggered: http://\n\nen.wikipedia.org/wiki/Quirks\\_mode#Triggering\\_different\\\
    _rendering\\_modes.\n\nIframes and quirks mode in Internet Explorer\n\nIf you’ve\
    \ never encountered *quirks mode*, consider yourself blessed. It’s the name\n\n\
    given to Internet Explorer’s rendering mode in versions 5 and earlier, before\
    \ IE imple-\n\nmented the official W3C CSS box model specification. IE6 and later\
    \ by default use\n\n*standards mode*, which is the rendering mode you’re familiar\
    \ with. But for backward\n\ncompatibility, even the latest versions of IE are\
    \ capable of rendering in quirks mode,\n\nand web pages can force the browser\
    \ to use this rendering mode by omitting a valid\n\nDOCTYPE declaration. Most\
    \ often, web pages render quirks mode by accident, either\n\nby forgetting to\
    \ include a DOCTYPE, or by declaring the DOCTYPE incorrectly.³\n\nBecause you’re\
    \ in the business of rendering on publishers’ web pages, you may\n\nencounter\
    \ a website using quirks mode. In this case, your application will likely render\n\
    \nincorrectly, because you’ve almost certainly been implementing your CSS using\
    \ stan-\n\ndards mode.\n\nUnfortunately, iframes are not immune to the effects\
    \ of quirks mode. Despite docu-\n\nments inside iframes having their own DOCTYPE\
    \ declaration, IE9 will render iframed\n\ncontent differently if the parent document\
    \ is in quirks mode. To counter this, some\n\nwww.it-ebooks.info"
