  md: "**48**\n\n*Rendering HTML*\n\n*and CSS*\n\nIn the previous chapter, you learned\
    \ how to load your third-party JavaScript code\n\non the publisher’s page, load\
    \ supporting JavaScript files, and pass parameters from\n\nthe publisher’s page\
    \ to your script. At this point, there’s still nothing to see; your\n\ncode is\
    \ executing on the publisher’s page, but you haven’t added a single visual ele-\n\
    \nment to the DOM. It’s time to fix that. In this chapter, we’ll cover the steps\
    \ involved\n\nin actually rendering HTML and CSS on the publisher’s page.\n\n\
    \ Now, not all third-party scripts will make use of rendering. Analytics trackers,\n\
    \nweb service API wrappers, and other passive scripts won’t require any rendering\
    \ at\n\nall. In those cases, most of the content in this chapter might not apply.\
    \ But in the\n\ncase of the Camera Stork product widget, there won’t be much of\
    \ an application if\n\nusers can’t see it.\n\n*This chapter covers*\n\nOutputting\
    \ HTML to the publisher’s page\n\nMethods for loading styles\n\nWriting conflict-free\
    \ HTML and CSS\n\nTechniques for presenting content using iframes\n\nwww.it-ebooks.info"
