  md: "**126**\n\nCHAPTER 5\n\n***Cross-domain iframe messaging***\n\n The following\
    \ listing shows how to create an instance of easyXDM.Rpc on the con-\n\nsumer\
    \ side.\n\nvar rpc = new Stork.easyXDM.Rpc(\n\n{\n\nremote: \"http://camerastork.com/xdm/provider/\"\
    \n\n},\n\n{\n\nlocal: {\n\nredrawReviews:\n\nfunction (reviews, onSuccess, onFailure)\
    \ {\n\ntry {\n\nStork.redrawReviews(reviews);\n\nonSuccess();\n\n} catch (exc)\
    \ {\n\nonFailure(exc.message);\n\n}\n\n},\n\nremote: {\n\npostReview: {},\n\n\
    editReview: {}\n\n}\n\n}\n\n}\n\n);\n\nFunctions can take as many parameters as\
    \ they want, but the last two parameters\n\npassed to a function will always be\
    \ success and failure callback handlers. As you can\n\nsee from listing 5.8, every\
    \ RPC function is expected to call those callbacks to indicate\n\nits success\
    \ or failure. As with easyXDM.Socket, you have to initialize easyXDM.Rpc for\n\
    \nthe provider as well. Also note that you have to explicitly define all functions\
    \ you plan\n\nto call from the consumer. The next listing shows an example of\
    \ creating an instance\n\nof easyXDM.Rpc on the provider.\n\nvar rpc = new Stork.easyXDM.Rpc({},\n\
    \n{\n\nlocal: {\n\npostReview: function (prodId, userId, text,\n\nonSuccess, onFailure)\
    \ {\n\ntry {\n\nvar response = sendReview(prodId, userId, text);\n\nonSuccess(response);\n\
    \n} catch (exc) {\n\nonFailure(exc.message);\n\nListing 5.8\n\nCreating an instance\
    \ of **easyXDM.Rpc** on the consumer\n\nListing 5.9\n\nCreating an instance of\
    \ **easyXDM.Rpc** on the provider\n\n**Local RPC methods exposed **\n\n**by consumer\
    \ (host)**\n\n**Declare remote RPC methods **\n\n**that are implemented on **\n\
    \n**provider (iframe)**\n\n**Helper function **\n\n**(defined elsewhere) **\n\n\
    **that submits review **\n\n**to server using **\n\n**XmlHttpRequest**\n\n**Send\
    \ back**\n\n**successful**\n\n**response**\n\n**Send back **\n\n**failure report**\n\
    \nwww.it-ebooks.info"
