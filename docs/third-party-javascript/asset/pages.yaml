  md: "**238**\n\nCHAPTER 10\n\n***Debugging and testing***\n\n*10.2.1 Unit, integration,\
    \ and regression tests*\n\nIn software programming, tests can be categorized under\
    \ several different types. We’ll\n\nintroduce three such types: unit tests, which\
    \ test isolated software components; inte-\n\ngration tests, which test multiple\
    \ software components as they fit together in the final\n\nproduct; and regression\
    \ tests, which test that bugs or issues don’t reoccur.\n\nUNIT TESTS\n\nA *unit\
    \ test* tests an individual “unit” of source code, ignoring other software compo-\n\
    \nnents. A good unit test knows only about one function, its signature, and its\
    \ expected\n\nreturn values. It neither knows nor cares about the bigger picture\
    \ of your application:\n\nhow those functions work together, how they pass messages\
    \ between each other, and\n\nso on.\n\n As an example, let’s write a quick unit\
    \ test for JSON.stringify. We’ll write this test\n\nwithout the help of any unit\
    \ testing frameworks—which we’ll cover shortly. This func-\n\ntion checks that\
    \ both JSON and JSON.stringify are defined and that JSON.stringify\n\ncan handle\
    \ serialization of JavaScript objects, arrays, and string literals:\n\nfunction\
    \ testStringify() {\n\nvar expectedValue =\n\n'{\"title\":\"3rd-party JS\",\"\
    authors\":\\[\"Anton\",\"Ben\"\\]}';\n\nvar actualValue = JSON.stringify({\n\n\
    title:\n\n\"3rd-party JS\",\n\nauthors: \\[ \"Anton\", \"Ben\" \\]\n\n});\n\n\
    if (actualValue !== expectedValue) {\n\nthrow new Error(\"Test Failed: \" + expectedValue\
    \ +\n\n\" != \" + actualValue);\n\n}\n\n}\n\nNot bad for such a simple function,\
    \ aye? And if you want to go further, you can write\n\nanother test case for JSON.parse\
    \ and even another that checks whether JSON.parse\n\ncan parse what JSON.stringify\
    \ stringified! You should write unit tests whenever you\n\nwant to make sure that\
    \ your function always adheres to some specified behavior—like\n\nconverting an\
    \ object into a JSON string. Unit tests give you more confidence that your\n\n\
    code behaves as intended.\n\nSTATIC CODE ANALYSIS\n\nAnother way to test your\
    \ code is to run it through a\n\nstatic code analysis tool. These tools scan your\
    \ program’s source code and\n\nreport about commonly made mistakes and potential\
    \ bugs. The potential\n\nproblem could be a syntax error, a bug due to implicit\
    \ type conversion, a leak-\n\ning variable, or something else.\n\nStatic code\
    \ analysis tools are extremely useful for day-to-day development.\n\nWe particularly\
    \ recommend JSHint (http://jshint.com/), a community-\n\ndriven tool maintained\
    \ by one of the authors of this book. It’s flexible so you\n\ncan adjust it to\
    \ your particular coding style. This flexibility doesn’t prevent\n\nJSHint from\
    \ spotting many errors and potential problems in your JavaScript\n\ncode—before\
    \ you deploy them live. \n\nwww.it-ebooks.info"
