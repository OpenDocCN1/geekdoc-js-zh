  md: "**204**\n\nCHAPTER 9\n\n***Performance***\n\n The goal of this section is to\
    \ show you how to optimize the initial payload of your\n\napplication. We’ll do\
    \ this by reducing its overall file size, reducing the number of\n\nHTTP requests\
    \ necessary, and deferring non-essential resources until they’re abso-\n\nlutely\
    \ necessary. To achieve this, we’ll look at a number of techniques: combining\n\
    \nJavaScript and CSS files, spriting and inlining images, and file caching. Then\
    \ we’ll\n\nmove into the more complicated topic of deferring non-essential resources.\
    \ First up:\n\noptimizing your initial payload by combining and minifying your\
    \ application’s\n\nJavaScript and CSS files.\n\nHIGH PERFORMANCE WEB SITES AND\
    \ EVEN FASTER WEB SITES\n\nOnly a couple of\n\nyears ago it was hard to find good\
    \ material on front-end optimization tech-\n\nniques. But thanks to front-end\
    \ performance champions like Steve Souders,\n\ntoday we have a good number of\
    \ books and articles dedicated to the subject.\n\nUnfortunately, we can’t hope\
    \ to cover all the content from these materials in\n\na single chapter. But if\
    \ you’d like to read more, we strongly recommend pick-\n\ning up two books authored\
    \ by Steve Souders et al.: *High Performance Web Sites*\n\n(O’Reilly, 2007) and\
    \ its follow-up *Even Faster Web Sites* (O’Reilly, 2009).\n\n*9.1.1*\n\n*Combining\
    \ and minifying source code*\n\nIf your JavaScript application becomes reasonably\
    \ large, it’s probably safe to assume\n\nthat your source code is spread out across\
    \ several files (if it’s not, take a deep breath,\n\ngo for a walk, and think\
    \ about your development practices). Although this is a good\n\nidea from a development\
    \ standpoint, by requiring the browser to download multiple\n\nfiles, you’re potentially\
    \ slowing down the performance of your application. This is\n\nbecause for every\
    \ resource requested by your application, the browser has to open a\n\nnetwork\
    \ connection, send the request and all HTTP request headers, receive the file\n\
    \nand all response headers, and finally close the connection. This overhead quickly\
    \ adds\n\nup for multiple files.\n\n To avoid this overhead, it’s common practice\
    \ to define a build process that com-\n\nbines files of the same type into single,\
    \ larger files. Then, when your application is\n\ndeployed to a production environment,\
    \ it’ll load these combined files instead of your\n\ndevelopment files, reducing\
    \ the number of HTTP requests. While you’re at it, your\n\nbuild process should\
    \ also minify your newly combined files, using JavaScript and CSS\n\nminification\
    \ tools. This can significantly reduce the file size of your combined files.\n\
    \nCODE MINIFICATION\n\nCode minification is the process of rewriting your source\n\
    \ncode to be as small as possible, while also preserving its functionality. This\
    \ is\n\ndone by removing nonfunctional whitespace and comments, and also by\n\n\
    rewriting variable and function names. Both your JavaScript and CSS code\n\ncan\
    \ be minified.\n\nThe impact of code minification can be startling. For example,\
    \ recent ver-\n\nsions of the jQuery library weigh it at roughly 250 KB of code.\
    \ When minified,\n\nthat number drops to around 92 KB—*more than 63% smaller*.\n\
    \nwww.it-ebooks.info"
