  md: "**241**\n\n***Testing***\n\ndownload a copy of the library from https://github.com/jquery/qunit\
    \ and create an\n\nHTML file that loads QUnit as well as your tests files.\n\n\
    WRITING A SIMPLE QUNIT TEST CASE\n\nYour job is to write a regression test that\
    \ makes sure Stork.JSON works both on clean\n\npages as well as on rogue pages\
    \ with incompatible Object.toJSON implementations.\n\nYou can start by writing\
    \ a simple QUnit test case for Stork.JSON, as shown here.\n\n<!DOCTYPE html>\n\
    \n<html>\n\n<head>\n\n<link rel=\"stylesheet\" href=\"qunit.css\"/>\n\n<script\
    \ src=\"jquery.js\"></script>\n\n<script src=\"qunit.js\"></script>\n\n<script\
    \ src=\"stork/lib.js\"></script>\n\n<script>\n\n$(document).ready(function ()\
    \ {\n\nQUnit.module(\"JSON\");\n\nQUnit.test(\"test JSON.parse and JSON.stringify\"\
    ,\n\nfunction () {\n\nexpect(2);\n\nvar obj = {'chapter':'Testing',pages: \\[\
    \ 1, 2, 3 \\] };\n\nequal(Stork.JSON.stringify(obj),\n\n'{\"chapter\":\"Testing\"\
    ,\"pages\":\\[1,2,3\\]}');\n\nequal(Stork.JSON.parse(Stork.JSON.stringify(obj)),\
    \ obj);\n\n});\n\n});\n\n</script>\n\n</head>\n\n<body>\n\n<h1 id=\"qunit-header\"\
    >CameraStork Tests</h1>\n\n<h2 id=\"qunit-banner\"></h2>\n\n<div id=\"qunit-testrunner-toolbar\"\
    ></div>\n\n<h2 id=\"qunit-userAgent\"></h2>\n\n<ol id=\"qunit-tests\"></ol>\n\n\
    </body>\n\n</html>\n\nNow, if you open this HTML file in your browser, you should\
    \ see something similar to\n\nfigure 10.6. This means that QUnit ran the test\
    \ and it passed!\n\n This successful test means that you can be confident that\
    \ Stork.JSON will work on\n\nclean pages. But your goal is to run the test shown\
    \ in listing 10.1 on broken pages as\n\nwell as on clean ones. This means that\
    \ you need to load the same test, but in a differ-\n\nent environment—the one\
    \ that introduces the incompatible implementation of the\n\nObject.toJSON. But\
    \ QUnit runs all its tests in the same window, so simply including a\n\nscript\
    \ that implements the incompatible Object.toJSON method isn’t an option\n\nListing\
    \ 10.2\n\nExample of a test case using QUnit testing framework\n\n**Load QUnit\
    \ and **\n\n**application files **\n\n**you’re testing**\n\n**On document**\n\n\
    **ready, run**\n\n**all tests**\n\n**Define new test module **\n\n**named JSON—all\
    \ subsequent **\n\n**tests will be organized under **\n\n**this module**\n\n**Test\
    \ function verifies **\n\n**that Stork.JSON **\n\n**works as expected**\n\n**HTML\
    \ markup **\n\n**required by QUnit**\n\nwww.it-ebooks.info"
