  md: "**90**\n\nCHAPTER 4\n\n***Communicating with the server***\n\nYou can change\
    \ the value of document.domain only *once per page*. For this reason, it’s\n\n\
    better to change it early in the document (say, in the <head>) before any other\
    \ code\n\nruns. If you set this value later in the page, it can cause unexpected\
    \ behavior where\n\nsome code believes it has one document.domain value, and other\
    \ code believes it has\n\nanother.\n\n Presumably, after you’ve made this change,\
    \ the SOP will no longer prevent docu-\n\nments hosted on example.com from communicating\
    \ with this document located at\n\nsub.example.com. But it’ll still be blocked.\
    \ There’s one step remaining: the other\n\ncommunicating document on example.com\
    \ needs to also opt in to the same domain\n\nsuffix. The following listing shows\
    \ the two pages opting in to the same domain suffix.\n\n<!DOCTYPE html>\n\n<html>\n\
    \n<script>\n\ndocument.domain = 'example.com';\n\n</script>\n\n</html>\n\n<!DOCTYPE\
    \ html>\n\n<html>\n\n<script>\n\ndocument.domain = 'example.com';\n\n</script>\n\
    \n</html>\n\nYou might be wondering why the page on example.com needs to set its\
    \ document\n\n.domain property to the same value as it was before. This is due\
    \ to a browser restriction\n\nthat prevents a particular security exploit. Consider\
    \ the following situation: Google\n\nnow allows you to publish your profile at\
    \ profiles.google.com/<your name>. Suppose\n\none day they allow their users to\
    \ install custom third-party JavaScript widgets, and one\n\nmalicious widget decides\
    \ to change the origin of the page to google.com. Now, without\n\nthe restriction\
    \ requiring both parties to explicitly opt in to the same domain suffix, the\n\
    \nmalicious widget could access any Google site hosted on google.com and access\
    \ its\n\nproperties on the user’s behalf. Browser vendors (correctly) see this\
    \ as a security flaw\n\nand thus require both parties to explicitly state their\
    \ intentions.\n\nCHANGING DOCUMENT.DOMAIN WILL RESET THE ORIGIN’S PORT TO 80\n\
    \nIf you host\n\nyour website on any nonstandard port (say, 8080), you should\
    \ note that\n\nchanging the document.domain property on your pages will reset\
    \ the origin’s\n\nport value to 80. This can cause AJAX requests to fail because\
    \ browsers will\n\nthink that you’re trying to make a request from port 80 to\
    \ the original, non-\n\nstandard port, thus failing an SOP check.\n\nNow that\
    \ you know how to make two web pages opt in to the same origin, let’s look at\n\
    \nhow you can use this to send data to a different subdomain. \n\nListing 4.3\n\
    \nExample of two websites opting in to the same origin space\n\n**Page at example.com**\n\
    \n**Page at thirdparty.example.com**\n\nwww.it-ebooks.info"
