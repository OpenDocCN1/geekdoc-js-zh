  md: "**159**\n\n***Cross-site scripting***\n\nThis CSS expression example only works\
    \ in Internet Explorer, but it’s one of many XSS\n\nentry points available to\
    \ an experienced attacker. Alternatively, the attacker could\n\nclose the <style>\
    \ tag in listing 7.2 and start injecting arbitrary code into your iframe’s\n\n\
    <head> section. Other exploits include putting javascript:<expr> as a URL for\
    \ an\n\nimage, putting a JavaScript exception inside of a refresh meta tag in\
    \ Firefox, and so\n\non. For an excellent list of possible XSS entry points, you\
    \ can refer to the XSS Cheat\n\nSheet located at http://ha.ckers.org/xss.html.\n\
    \n Now that you’ve learned about different ways your web application can be—*will*\n\
    \n*be*—attacked, it’s probably useful if we show you a few ways to defend your\
    \ application\n\nagainst XSS attacks. \n\n*7.2.3*\n\n*Defending your application\
    \ against XSS attacks*\n\nAll web applications—and especially third-party widgets—have\
    \ many sources of\n\nuntrusted data, and these sources can become entry points\
    \ for XSS attacks. Unfortu-\n\nnately, the only viable solution for defending\
    \ yourself against such attacks is to care-\n\nfully filter all data coming from\
    \ the outside—no matter whether it comes from the\n\nend user or even from your\
    \ publisher.\n\n In general, before inserting any external data into the DOM (both\
    \ the publisher’s\n\nand your own), you should convert any characters contained\
    \ therein that could be used\n\nto transform an innocent string into an offending\
    \ piece of HTML/JavaScript code:\n\nConvert < into &lt;\n\nConvert \\> into\
    \ &gt;\n\nConvert & into &amp;\n\nConvert \" into &quot;\n\nConvert ' into\
    \ &#39;\n\nConverting these characters into the corresponding HTML entities will\
    \ make sure that\n\nan attacker won’t be able to insert a <script> tag into their\
    \ message and run arbitrary\n\ncode within your widget. This approach is called\
    \ *sanitization*, and it’s often used when\n\nthere’s a need to accept data that\
    \ can’t be guaranteed to be safe. In this case, you pro-\n\ncess the data and\
    \ delete or convert all potentially offensive parts—like HTML tags.\n\nEffective\
    \ sanitization is a difficult problem to solve, especially if you want to give\
    \ your\n\nusers the ability to use some HTML elements (the ones that don’t expose\
    \ vulnerabili-\n\nties). There are different approaches to data sanitization but\
    \ the most effective ones\n\nwork by filtering the data to maintain control over\
    \ the input.\n\nREJECT KNOWN BAD\n\nLet’s consider a simple WYSIWYG editor that\
    \ you’re building for your Reviews widget.\n\nYou want users to be able to use\
    \ simple tags like <strong> and <em>, but don’t want\n\nto be sad when somebody\
    \ decides to hijack other users’ sessions by inserting a\n\n<script> tag. The\
    \ first thing that comes to mind is to strip all instances of <script>.\n\nThis\
    \ is a simple solution, or—to paraphrase famous American journalist Henry Louis\n\
    \nMencken—this solution is neat, plausible, and *wrong*. The only thing the attacker\n\
    \nwww.it-ebooks.info"
