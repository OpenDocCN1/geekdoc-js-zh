  md: "**226**\n\nCHAPTER 10\n\n***Debugging and testing***\n\nsave a local copy of\
    \ the publisher’s page, including their assets and JavaScript files, to\n\nyour\
    \ local filesystem. This way, you can replicate the publisher’s environment but\n\
    \ninstead load the development version of your third-party application. Sometimes\
    \ this\n\ntechnique works great, but sometimes websites have so many different\
    \ scripts, add-\n\nons, and widgets that downloading and configuring them all\
    \ can be a waste of time.\n\n Let’s say that the publisher that reported this\
    \ bug happens to love third-party\n\napplications, such that their website is\
    \ littered with *dozens* of them: sharing buttons for\n\nevery major social network,\
    \ analytics scripts, third-party ads, and so on. Unfortunately,\n\ntrying to replicate\
    \ this Wild West environment on your computer could easily take\n\nhours of your\
    \ life. You’ve got a business to run! So for this case it’d be far more bene-\n\
    \nficial to debug in production. You’ll have to step through the code, look for\
    \ data struc-\n\ntures that have incorrect values, maintain a list of possible\
    \ scenarios that could’ve\n\ncaused the bug and—after eliminating all other factors—find\
    \ the source that actually\n\ncauses this bug to happen.\n\nJAVASCRIPT ERROR REPORTING\n\
    \nNot all your bugs and application errors will\n\nbe reported by users. Often\
    \ you won’t be so lucky! That’s why it’s worth invest-\n\ning in tools that detect\
    \ and report JavaScript errors occurring in your applica-\n\ntion while it’s in\
    \ production. Errorception (http://errorception.com) and\n\nExceptionHub (http://exceptionhub.com)\
    \ are some commercial offerings,\n\nor you can look at open source projects like\
    \ Sentry (https://github.com/\n\ngetsentry/sentry).\n\nBut before you get started,\
    \ you should recognize that there are a number of difficul-\n\nties with debugging\
    \ production code. For starters, if you followed our advice from\n\nchapter 9,\
    \ all your scripts and stylesheets are likely combined into a single minified\n\
    \nand obfuscated JavaScript file. Such minified files can be a nightmare to debug\
    \ (see\n\nfigure 10.1). Additionally, since you don’t control the publisher’s\
    \ servers, you can’t set\n\nany debugging breakpoints on their page to help get\
    \ you started. You can’t even\n\nupdate your own code without affecting all other\
    \ users of Camera Stork.\n\n This means that you need to somehow load the development\
    \ version of Camera\n\nStork directly on *a publisher’s website*. This development\
    \ version can be hosted any-\n\nwhere your browser has access to—even on your\
    \ own computer. This way, you’ll have\n\nfreedom to examine and modify your code\
    \ while running it in the exact same environ-\n\nment that triggered the bug.\n\
    \n This might seem like a complicated setup, but fear not—there are tools that\
    \ make\n\nit easier to inject your development code into a production environment.\
    \ You can use\n\nweb proxies to reroute your browser to the development computer\
    \ whenever it tries\n\nto contact your production servers. Or you can implement\
    \ a system of feature switches\n\nand let your production servers do the routing\
    \ work. We’ll show you how to imple-\n\nment both.\n\nwww.it-ebooks.info"
