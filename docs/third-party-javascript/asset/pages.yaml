  md: "**152**\n\n*Security*\n\nIn previous chapters, you learned how to create a\
    \ functional and configurable\n\nthird-party JavaScript application, how to enable\
    \ that application to communicate\n\nwith your servers, and how to authenticate\
    \ your users to unlock private and semi-\n\nprivate features. This chapter presents\
    \ another important topic involving third-\n\nparty JavaScript applications—the\
    \ security of your application.\n\n In the early days, the web was rather simple—it\
    \ was a system of interlinked web-\n\nsites. These websites represented ordinary\
    \ documents and were mostly static. The\n\nweb server’s job was to retrieve a\
    \ document from the filesystem and send it to the\n\nbrowser. The browser, working\
    \ on the client side of this process, received the docu-\n\nment and displayed\
    \ it to the user. Websites rarely, if ever, authenticated their users\n\nbecause\
    \ the web was essentially designed as an open system to share hypertext doc-\n\
    \numents. Any security threats during this time of innocence were related to vulnera-\n\
    \nbilities in web servers, which were the main targets for attackers.\n\n*This\
    \ chapter covers*\n\nCross-site scripting (XSS)\n\nCross-site request forgery\
    \ (XSRF)\n\nPublisher impersonation, clickjacking, and \n\ndenial of service\n\
    \nwww.it-ebooks.info"
  merge: -1
