  md: "**128**\n\nCHAPTER 5\n\n***Cross-domain iframe messaging***\n\nNow that you’ve\
    \ configured both consumer and provider RPC functions, it’s time to\n\ncall them.\
    \ To do so, you simply call the desired remote function on the rpc instance\n\n\
    itself. The following listing demonstrates how to call the postReview remote function\n\
    \ndeclared in listing 5.9.\n\nfunction onSuccess() {\n\nconsole.log(\"Review posted\
    \ successfully!\");\n\n}\n\nfunction onFailure(message) {\n\nconsole.log(\"Review\
    \ posting failed with message\",\n\nmessage);\n\n}\n\nrpc.postReview(31415, 31337,\
    \ \"This camera is awesome!\",\n\nonSuccess, onFailure);\n\nAnother neat thing\
    \ about easyXDM is that it intelligently intercepts exceptions origi-\n\nnated\
    \ in RPC functions and passes their exception objects to the onFailure callback\n\
    \nfunction. That means that in the code from listing 5.9, you can omit the try/catch\n\
    \nblock—easyXDM will handle the exception case automatically, as shown here.\n\
    \nvar rpc = new Stork.easyXDM.Rpc({},\n\n{\n\nlocal: {\n\npostReview: function\
    \ (prodId, userId, text,\n\nonSuccess, onFailure) {\n\nvar response = sendReview(prodId,\
    \ userId, text);\n\nonSuccess(response);\n\n},\n\neditReview: function (prodId,\
    \ text, onSuccess,\n\nonFailure) {\n\n/\\* ... \\*/\n\n}\n\n},\n\nremote: {\n\n\
    updateReviews: {}\n\n}\n\n}\n\n);\n\nBehind the scenes, easyXDM uses the native\
    \ JSON serializer that’s available in all\n\nmodern browsers. For older browsers,\
    \ it falls back to the popular JSON2 library. It’s\n\nalso possible to specify\
    \ your own serializer by setting a special serializer property when\n\ncreating\
    \ an easyXDM.Rpc instance:\n\nListing 5.10\n\nCalling a remote function created\
    \ with **easyXDM.Rpc**\n\nListing 5.11\n\nCreating an instance of **easyXDM.Rpc**\
    \ on the provider \n\nwww.it-ebooks.info"
