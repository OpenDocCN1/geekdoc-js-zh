  md: "**180**\n\nCHAPTER 8\n\n***Developing a third-party JavaScript SDK***\n\nStork.productWidget\
    \ = function(options) {\n\noptions = options || {};\n\nvar productId = options.id;\n\
    \nvar targetDOM = options.target;\n\nloadProductData(productId, function(productData)\
    \ {\n\nrenderWidget(targetDOM, productData);\n\n});\n\n};\n\nThis should be straightforward—you’re\
    \ merely putting a public face on the code\n\nyou’ve already written. The helper\
    \ functions referenced here—loadProductData and\n\nrenderWidget—should be declared\
    \ inside sdk/lib.js as private functions.\n\n The takeaway here is that writing\
    \ public functions for functionality you already\n\nhave (rendering widgets) is\
    \ easy. You just need to provide a sane interface for publish-\n\ners to invoke\
    \ your code. Next, let’s take a look at a completely new functionality: pro-\n\
    \nviding publishers with functions for listening to internal application events.\
    \ \n\n*8.1.4*\n\n*Event listeners*\n\nThe next set of public functions to implement\
    \ are Stork.listen and Stork.unlisten.\n\nWe described Stork.listen in the introduction:\
    \ it’s a way for publishers to listen to\n\npublic named events occurring in your\
    \ application and respond to them accordingly.\n\nIt should logically follow that\
    \ Stork.unlisten is the opposite: it’s for the publisher to\n\nstop listening\
    \ to a named event, given that they’re already listening to one.\n\n Let’s look\
    \ at a simple implementation of Stork.listen that takes two parame-\n\nters—a\
    \ string representing an event name, and a function handler to invoke if/when\n\
    \nthat event occurs:\n\nvar listeners = {};\n\nStork.listen = function(eventName,\
    \ handler) {\n\nif (typeof listeners\\[eventName\\] === 'undefined') {\n\nlisteners\\\
    [eventName\\] = \\[\\];\n\n}\n\nlisteners\\[eventName\\].push(handler);\n\n};\n\
    \nHere, the application maintains an internal list of event handlers in a private\
    \ variable\n\nnamed listeners. When Stork.listen is called, the publisher’s event\
    \ handler is\n\nappended to the list for the given event. But when does the event\
    \ fire?\n\n Your application now needs an internal function that triggers these\
    \ event handlers\n\nwhen an event occurs. Let’s call this function broadcast.\
    \ When an important event\n\noccurs inside your application, you’ll call broadcast\
    \ with the name of the occurring\n\nevent. For example, when a product widget\
    \ finishes rendering, you could use\n\nbroadcast to indicate that an event named\
    \ productWidget.rendered has occurred:\n\nbroadcast('productWidget.rendered');\n\
    \nwww.it-ebooks.info"
