    \n@app.route('/widget.js')\n\ndef script\\_loader():\n\npublisher = request.args.get('publisher')\n\
    \ntrusted\\_domains = get\\_trusted\\_domains(publisher)\n\ndomain = urlparse(request.headers\\\
    ['Referer'\\]).hostname\n\nif domain not in trusted\\_domains(api\\_key):\n\n\
    return response(\\\\\n\n'Unauthorized domain for publisher: %s' % publisher\n\n\
    , 403)\n\nreturn send\\_static\\_file('widget.js')\n\nThis example only checks\
    \ the *initial* script file, but ideally you should perform this\n\ncheck for\
    \ all dynamic HTTP resources requested from your third-party application—\n\n\
    like any subsequent AJAX calls. Also, note that this example doesn’t cover resources\n\
    \nrequested from inside an iframe hosted on your domain—since those requests origi-\n\
    \nnate from your domain, and not the publisher’s. We’ll address that scenario\
    \ when we\n\nrevisit referrer checking in chapter 9.\n\n Referrer checking isn’t\
    \ perfect. The Referer header is submitted by the browser,\n\nso it can be spoofed\
    \ with different tools like web browser extensions or internet prox-\n\nies. Nonetheless,\
    \ by checking the referrer you’ll eliminate the most blatant publisher\n\nspoofing,\
    \ not to mention honest mistakes. \n\n*7.4.2*\n\n*Clickjacking*\n\n*Clickjacking*,\
    \ also known as a *UI** redress attack*, is where a malicious web publisher tricks\n\
    \nunsuspecting visitors into clicking seemingly innocent parts of their website,\
    \ but\n\nwhich are in actuality hidden user-interface elements that belong to\
    \ another web\n\napplication. This can cause visitors to unknowingly invoke actions\
    \ on other websites,\n\nincluding those for which they have authenticated sessions.\n\
    \n Let’s look at an example. Suppose that there’s a photography equipment company,\n\
    \nCheapCo, that has products available for sale through the Camera Stork online\
    \ store.\n\nListing 7.7\n\nVerifying the requesting publisher’s domain using the\
