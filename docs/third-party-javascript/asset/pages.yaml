  md: "**xix**\n\n*about this book*\n\nThird-party JavaScript is independent client\
    \ code executing on a publisher’s website,\n\nbut served from a remote web address.\
    \ It’s used in the creation of highly distributed\n\nweb applications, from social\
    \ widgets to analytics trackers to full-featured embedded\n\napplications.\n\n\
    \ This book serves as an introduction to third-party JavaScript application develop-\n\
    \nment. It teaches readers not only how to write JavaScript code that executes\
    \ in third-\n\nparty contexts, but also third-party web development techniques\
    \ that involve HTML,\n\nCSS, and even HTTP. It is intended for developers who\
    \ already have experience with\n\nthese technologies in a first-party context\
    \ (such as your own website) and who want to\n\nexplore how these technologies\
    \ can be executed in a foreign web environment (some-\n\nbody else’s website).\n\
    \n This book does not include a primer on JavaScript programming language.\n\n\
    Nor does it teach readers the fundamentals of HTML and CSS. The book does, how-\n\
    \never, include introductory material on dynamic script loading, cookies, HTTPS,\
    \ and\n\nother intermediate and advanced web development topics as they are encountered\
    \ in\n\nthe text.\n\n*Roadmap*\n\nThe book consists of ten chapters, as follows:\n\
    \n Chapter 1 is an introduction to Third-party JavaScript. It teaches readers\
    \ what\n\nthird-party JavaScript is, and also describes common real-world use-cases.\
    \ It finishes\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 19
- img_proc: true
