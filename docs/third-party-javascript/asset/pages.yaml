  md: "**94**\n\nCHAPTER 4\n\n***Communicating with the server***\n\n*4.3.3*\n\n*Combining\
    \ subdomain proxies with JSONP*\n\nBesides the obvious downside of subdomain proxies\
    \ (requiring publishers to config-\n\nure a dedicated subdomain), there’s another\
    \ subtle downside to this implementation:\n\nit requires loading an intermediary\
    \ tunnel file before it can make cross-domain\n\nrequests. For most applications,\
    \ that’s not a big deal. But it’s worth pointing out that\n\nthere’s a variation\
    \ of the subdomain proxy technique that doesn’t require any inter-\n\nmediary\
    \ pages, one that uses some JSONP concepts you learned in section 4.2.\n\n This\
    \ technique works by using <form> HTML elements instead of XmlHttpRequest.\n\n\
    When forms are submitted to a target URL, they pass any child input parameters\
    \ to\n\nthe server, and the response is loaded in the current browser window.\
    \ You can use\n\nJavaScript to both dynamically generate these forms and submit\
    \ them. The following\n\nlisting shows an example of generating and submitting\
    \ a form using POST to submit a\n\nCamera Stork product review to the server.\n\
    \nvar form = document.createElement(\"form\");\n\nform.action = \"http://camerastork.com/products/1234/reviews\"\
    ;\n\nform.method = \"POST\";\n\nvar score = document.createElement(\"input\");\n\
    \nscore.name = \"score\";\n\nscore.value = \"5\";\n\nvar message = document.createElement(\"\
    input\");\n\nmessage.name = \"message\";\n\nmessage.value = \"Took great photos\
    \ of my dog. Would recommend.\";\n\nform.appendChild(score);\n\nform.appendChild(message);\n\
    \ndocument.body.appendChild(form);\n\nform.submit();\n\ndocument.body.removeChild(form);\n\
    \nGenerating and submitting a form with JavaScript is simple. You create a new\
    \ form ele-\n\nment, attach hidden input elements with necessary form parameters,\
    \ and then submit\n\nthe resulting form. After submitting, you just need to clean\
    \ up after yourself by delet-\n\ning the form element from the DOM tree.\n\nSETTING\
    \ THE NAME ATTRIBUTE IN INTERNET EXPLORER 7 AND EARLIER\n\nYou might\n\nhave noticed\
    \ that we set the name attribute to our input elements in listing\n\n4.6. Unfortunately,\
    \ legacy versions of the Internet Explorer browser prohibit\n\nsetting that attribute\
    \ on elements dynamically created with the create-\n\nElement method. To get around\
    \ this limitation, you’ll have to use a special,\n\nMicrosoft-only form of the\
    \ createElement call:\n\nvar input = document.createElement('<input name=\"score\"\
    />');\n\nListing 4.6\n\nCreating and submitting an HTML form via JavaScript\n\n\
    **Create form**\n\n**element to hold**\n\n**input elements**\n\n**Create input\
    \ **\n\n**element to hold **\n\n**score value**\n\n**Create input**\n\n**element\
    \ to**\n\n**hold review**\n\n**Append form and input elements **\n\n**to DOM,\
    \ and then submit**\n\n**Clean up when done—don’t pollute **\n\n**DOM with orphan\
    \ elements!**\n\nwww.it-ebooks.info"
