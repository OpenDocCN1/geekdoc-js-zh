    />' +\n\n'\n\n<p><strong>87 &deg;F</strong> &mdash; Partly Cloudy</p>' +\n\n'</div>'\n\
    \n);\n\nNow, when we said this would be a bare-bones example earlier, we weren’t\
    \ kidding.\n\nThis outputs a completely unstyled weather widget that offers absolutely\
    \ no interac-\n\ntion with the user. It looks awful, and has probably put your\
    \ fledgling weather com-\n\npany in jeopardy. But it works, and it illustrates\
    \ the interaction between publisher\n\nwebsites and third-party code.\n\n Some\
    \ of the techniques illustrated here, like using document.write and server-side\n\
    \nPython, aren’t the only ways to generate widgets. And for reasons we’ll explain\
    \ later,\n\nthey’re even frowned upon. In future chapters, we’ll explore alternate,\
    \ better solu-\n\ntions, and tackle more complicated features like stylesheets,\
    \ server communication via\n\nAJAX, and user sessions. \n\n*1.3.2*\n\n*Distributing\
    \ widgets as iframes*\n\nIf you’re fairly experienced with web development, you\
    \ might be thinking to yourself,\n\n“Isn’t it easier to distribute this widget\
    \ as an iframe?” At first blush it might seem so,\n\nbut there are not-so-obvious\
    \ differences that make third-party scripts the better imple-\n\nmentation choice.\
    \ In order to understand why, let’s first see how you can re-create the\n\npreceding\
    \ example widget using iframes.\n\n In case you’re not familiar with them, iframes\
    \ are block-level HTML elements\n\ndesigned to embed external content served from\
    \ a URL. You could easily re-create the\n\nweather widget example using strictly\
    \ an iframe element, like so:\n\n<iframe style=\"border:none;height:200;width:150\"\
    \n\nsrc=\"http://weathernearby.com/widget.html?zip=94105\"/>\n\nYou’ll notice\
    \ the target src attribute has changed: it’s no longer pointing to a\n\nJavaScript\
    \ file, but instead to an HTML document. This time your server endpoint will\n\
    \nreturn a fully formed HTML document containing the widget markup, completely\n\
    \navoiding the need for JavaScript. You’ll also notice the dimensions of the widget\
    \ are\n\n**Create HTTP response object to return **\n\n**string to browser. Set\
    \ response’s **\n\n**Content-Type header to application/**\n\n**javascript so\
    \ it’s interpreted by browser **\n\n**as JavaScript code.**\n\nwww.it-ebooks.info"
