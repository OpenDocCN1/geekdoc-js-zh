  md: "**106**\n\nCHAPTER 5\n\n***Cross-domain iframe messaging***\n\nconfigure dedicated\
    \ subdomains for your application is a significant burden. But what\n\nif there\
    \ were another way of accessing iframes?\n\n As you’ve already seen, HTML5 has\
    \ been a boon for JavaScripters, adding many\n\nuseful tools that make our lives\
    \ easier. Since it has become a living standard,¹ browser\n\nvendors have become\
    \ more involved, and don’t wait long before implementing new\n\nfeatures. One\
    \ such feature is the window.postMessage API—a messaging system that\n\nallows\
    \ documents to communicate with each other in a safe and controlled manner,\n\n\
    regardless of origin. This powerful API allows your third-party JavaScript code\
    \ to com-\n\nmunicate with external documents hosted inside iframes. These documents\
    \ could be\n\ncross-domain channels for initiating XmlHttpRequest objects to your\
    \ servers. Or they\n\ncould be UI elements of your application, contained in an\
    \ iframe in order to prevent\n\nit from being modified or accessed by the publisher’s\
    \ page.\n\n In this chapter, we’ll cover all things iframe messaging. We’ll start\
    \ with the HTML5\n\nwindow.postMessage API and then move on to fallback techniques\
    \ you can employ to\n\nimitate the postMessage behavior in legacy browsers. Finally,\
    \ we’ll conclude this chap-\n\nter by teaching you how to use easyXDM—a popular\
    \ JavaScript library that encapsu-\n\nlates postMessage and backward-compatible\
    \ messaging protocols via a single API.\n\n*5.1*\n\n*HTML5 window.postMessage\
    \ API*\n\nHTML5 window.postMessage is an effort to bring a safe, event-based cross-domain\n\
    \nmessaging API to the browser. As you learned in chapter 4, the same-origin policy\n\
    \ndoesn’t allow you to access properties from a page of different origin. This\
    \ is because\n\nthat page has no way of knowing who’s accessing its properties;\
    \ it could be a legitimate\n\nuser or a malicious website through a hidden iframe.\
    \ The window.postMessage speci-\n\nfication solves that problem by designing the\
    \ system around events. That means\n\ninstead of directly accessing properties\
    \ and methods of a document, you can send a\n\nmessage to that document and then\
    \ wait for a response. If the other party listens to\n\nthose messages and recognizes\
    \ your particular message, it’ll process your request and\n\nsend a message back.\
    \ This approach requires *both* parties to explicitly act in order to\n\nestablish\
    \ a bidirectional communication channel, which eliminates attacks where a\n\n\
    malicious party accesses your document without your knowledge.\n\n Figure 5.1\
    \ shows an example of two different postMessage requests. In one case,\n\nthe\
    \ target recognizes the source, processes the message, and sends back a response.\n\
    \nBut the second message is from an unrecognized source, so it gets ignored.\n\
    \n In this section, we’ll show you how to use the window.postMessage function\
    \ to send\n\nmessages. We’ll also talk about attaching your own event handlers\
    \ to the onmessage\n\nevent in order to process received messages. Afterward,\
    \ we’ll discuss browser support\n\nfor window.postMessage and go over some limitations\
    \ affecting Internet Explorer’s\n\nimplementation.\n\n1* Living standards* are\
    \ specifications that are continuously updated based on feedback from web developers,\n\
    \nbrowser vendors, and other interested parties. Most recently, WHATWG—Web Hypertext\
    \ Application Tech-\n\nnology Working Group—dropped the *5* from *HTML5* and made\
    \ HTML a living standard.\n\nwww.it-ebooks.info"
