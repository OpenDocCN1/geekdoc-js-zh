  md: "**71**\n\n***Embedding content in iframes***\n\nThis URL corresponds to a server\
    \ endpoint that’s responsible for outputting the wid-\n\nget contents as a fully\
    \ formed HTML page. This page could be generated server-side\n\n(since it’s being\
    \ served from your servers) or client-side using JavaScript.\n\n Here’s the HTML\
    \ output from http://camerastork.com/product.html?id=1337.\n\nThe widget markup\
    \ is the same as the earlier example, but this time it’s wrapped in a\n\nfully-formed\
    \ HTML document:\n\n<!DOCTYPE html>\n\n<html>\n\n<body>\n\n<style> /\\* ... \\\
    */ </style>\n\n<h3>Mikon E90 Digital SLR</h3>\n\n<img src=\"http://camerastork.com/img/products/1337-small.png\"\
    />\n\n<p>$599.99</p>\n\n<p>4.3/5.0 &bull; 176 Reviews</p>\n\n</body>\n\n</html>\n\
    \nIt’s probably becoming clear that if you use this approach, you’ll be transferring\
    \ a lot\n\nof the rendering logic out of your script and into the code that serves\
    \ your iframe con-\n\ntents. This makes sense: because it’s an external iframe,\
    \ you can’t modify the HTML\n\nelements from your application code. But if you\
    \ can’t touch the contents, neither can\n\nthe publisher, and that’s why you’d\
    \ take up such an inconvenience.⁶\n\n*3.4.3*\n\n*Inheriting styles*\n\nIframes\
    \ are a great way to defend your content from infringing parent styles and\n\n\
    JavaScript code. But their greatest benefit is also their major downside. As-is,\
    \ your\n\niframe will inherit nothing from the parent page, including font family,\
    \ font size, font\n\ncolor, and a suite of other styles. In your effort to make\
    \ your widget look consistent\n\neverywhere by embedding it in an iframe, it might\
    \ end up looking strangely out of\n\nplace because it doesn’t inherit some of\
    \ the page’s native styles (see figure 3.6).\n\n The solution? Use JavaScript\
    \ to detect the parent page’s basic style rules, and inject\n\nthem into your\
    \ iframe. In the case of a src-less iframe, you can inject the styles directly\n\
    \nfrom your third-party script. For an external iframe, you’ll need to pass the\
    \ styles as\n\npart of the URL or hash fragment, and use code running on the external\
    \ URL to inject\n\nthe styles.\n\nDETECTING A PAGE’S BASIC STYLES\n\nFirst up,\
    \ how do you detect a page’s basic styles? Take a look at the helper function\
    \ in\n\nthe following listing, which takes an element and a style property (such\
    \ as font-size),\n\nand returns the value of that property.\n\n6 This is only\
    \ partially true. There are methods for accessing external iframes in a controlled\
    \ manner, but in\n\norder to do so, you have to manually expose hooks from inside\
    \ the iframe itself. We’ll talk about this in detail\n\nin the following chapters,\
    \ but for now you can assume that the iframe is otherwise inaccessible.\n\nwww.it-ebooks.info"
