  md: "**150**\n\nCHAPTER 6\n\n***Authentication and sessions***\n\nto a user’s session,\
    \ they might be able to order products for themselves with the stored\n\ncredit\
    \ card information. You definitely don’t want attackers to gain hold of that session\n\
    \ninformation. Compare this action of purchasing products on the camerastork.com\n\
    \nwebsite to the types of authenticated actions that can be performed via the\
    \ Camera\n\nStork product *widget*—which, right now, is just submitting reviews\
    \ for products.\n\n There are clearly two classes of potential actions that can\
    \ be taken by the user—\n\nthose that are financially damaging (on the main camerastork.com\
    \ website), and\n\nthose that are somewhat frivolous (reviewing products on the\
    \ widget). Why should the\n\nsame session be used for performing both sets of\
    \ actions?\n\n This is the idea behind multilevel authentication. Instead of using\
    \ one session to\n\nauthorize all possible actions with your application, you\
    \ generate multiple session\n\ntokens that correspond to different levels of authentication.\
    \ For example, one token\n\ncould be used for performing relatively low-risk actions\
    \ like reviewing products via the\n\nCamera Stork product widget. The other token\
    \ could correspond to more sensitive\n\nactions, like purchasing products using\
    \ a stored credit card number.\n\n On their own, two session tokens aren’t any\
    \ more secure than using a single ses-\n\nsion token; a high-level token could\
    \ be stolen just as easily a low-level token. Multilevel\n\nauthentication becomes\
    \ valuable when you want to serve sensitive parts of your appli-\n\ncation (and\
    \ their cookies) using HTTPS, and low-risk parts of your application using\n\n\
    plain-text HTTP. But when would you want to do that?\n\n As is illustrated in\
    \ figure 6.9, ideally you should use HTTPS for all requests that\n\nhandle private\
    \ session data. The web development community would tar and feather\n\nus for\
    \ suggesting any less. But the hard reality is that HTTPS requires additional\
    \ server\n\noverhead, and, at massive levels of scale, serving HTTPS for all your\
    \ application\n\nrequests can be a difficult engineering challenge. For example,\
    \ Facebook, despite hav-\n\ning over 1 billion users, didn’t provide HTTPS to\
    \ all its users until November 2012.\n\nUser visits\n\ncamerastork.com\n\nonline\
    \ store\n\nSecure cookie\n\n(HTTPS)\n\nChange \n\nPassword\n\nMake \n\npurchases\n\
    \nUser loads third-party\n\nwidget via publisher page\n\nplain-text cookie\n\n\
    (HTTP)\n\nRate a \n\nproduct\n\nAdd to \n\nwishlist\n\nFigure 6.9\n\nMultilevel\
    \ authentication uses different cookies for different classes of user \n\nactions,\
    \ with the most sensitive actions using secure cookies.\n\nwww.it-ebooks.info"
