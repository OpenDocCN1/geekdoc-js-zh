- img_proc: true
  md: "**153**\n\n***Cookies, sessions, and session theft***\n\n Today, the web is\
    \ completely different. Not only do we have complicated web appli-\n\ncations\
    \ that cover everything from our favorite news sources to our personal health\n\
    \nrecords, we also have web applications that run inside of other web properties—or\n\
    \nthird-party JavaScript applications (the topic of this book). Because modern\
    \ web\n\napplications deal with sensitive data, the web isn’t the same open system\
    \ to share doc-\n\numents anymore, and that significantly changes the security\
    \ landscape. There are new\n\nsecurity threats that target the browser such that\
    \ a malicious party can compromise\n\nyour web application, steal users’ personal\
    \ information, carry out financial fraud, and\n\nperform unauthorized actions.\n\
    \n When it comes to third-party web application security, the stakes are high\
    \ for every-\n\none. Users trust you with their data, publishers give you the\
    \ keys to their web proper-\n\nties hoping that you’ll use them responsibly, and\
    \ your own reputation is at stake.\n\nReputation plays a critical role because\
    \ no website will want to install your third-party\n\napplication—no matter how\
    \ good it is—if there’s a possibility that it might compro-\n\nmise their own\
    \ property.\n\n In this chapter, we’ll walk you through security vulnerabilities\
    \ that are of particular\n\nconcern to third-party JavaScript applications, and\
    \ show you how to prevent them.\n\nWe’ll start with a quick review of sessions\
    \ and cookies because, as you’ll soon learn,\n\nthese are the primary targets\
    \ in many web attacks. Then we’ll look in depth at two\n\nmajor vulnerabilities:\
    \ cross-site scripting (XSS) and cross-site request forgery (XSRF).\n\nAfterward,\
    \ we’ll tackle vulnerabilities that both target—and are carried out by—pub-\n\n\
    lishers that are hosting your applications.\n\n*7.1*\n\n*Cookies, sessions, and\
    \ session theft*\n\nBefore we get into the thick of things, let’s quickly review\
    \ the role of cookies in web\n\napplications. If you recall, cookies are small\
    \ pieces of data that browsers persist\n\nbetween HTTP requests. This is a simple\
    \ way of preserving state within an otherwise\n\nstateless protocol (HTTP).\n\n\
    \ A web server sets a cookie by returning the Set-Cookie header in an HTTP\n\n\
    response. The contents of a cookie can be any string without spaces in it, but\
    \ normally\n\nit’s a set of key/value pairs. Consider the following example HTTP\
    \ response, which\n\ndemonstrates setting a cookie named sessionid:\n\nHTTP/1.1\
    \ 200 OK\n\nDate: Wed, 28 Sep 2011 14:33:37 GMT\n\nContent-type: application/json\n\
    \nSet-cookie: sessionid=66d2520a77a3c6dac4db658c6dd13061\n\nPersisting user sessions\
    \ is the primary use case of cookies in web applications. In this\n\nsituation,\
    \ when a user logs in, the server generates a unique token that identifies a\n\
    \nuser’s session with the web service, and stores it as a cookie on their browser.\
    \ Then,\n\nwhen the user makes any subsequent HTTP requests to that server, the\
    \ browser *auto-*\n\n*matically* sends the stored sessionid cookie to the server\
    \ as part of the request’s\n\nCookie HTTP header:\n\nwww.it-ebooks.info"
