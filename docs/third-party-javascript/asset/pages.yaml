    \nFigure 7.3\n\nThe Disqus \n\ncommenting widget asks \n\npublishers to submit\
    \ a set \n\nof trusted domains during \n\nconfiguration.\n\n**Get publisher **\n\
    \n**query argument**\n\n**Extract**\n\n**domain**\n\n**part from**\n\n**referring**\n\
    \n**URL**\n\n**Validate against **\n\n**publisher’s **\n\n**trusted **\n\n**domains**\n\
    \nwww.it-ebooks.info"
