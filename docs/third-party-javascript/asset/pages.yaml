  md: "**129**\n\n***Summary***\n\nvar rpc = new Stork.easyXDM.Rpc({},\n\n{\n\nlocal:\
    \ {\n\npostReview: function () { /\\* ... \\*/ }\n\n},\n\nremote: {},\n\nserializer:\
    \ Stork.JSON\n\n}\n\n);\n\nNote that your serializer object must have the same\
    \ methods as the standardized\n\nwindow.JSON object. Specifically, it has to provide\
    \ two methods: stringify to serialize\n\nJavaScript objects into portable strings,\
    \ and parse to turn those strings back into\n\nJavaScript objects. \n\n If you’re\
    \ wondering why you’d ever want to change the default serializer, there’s a\n\n\
    really good reason: sometimes you can’t trust the built-in JSON object on the\
    \ pub-\n\nlisher’s page. If the consumer serializes (or deserializes) strings\
    \ differently than the\n\nprovider (your iframed document), your application will\
    \ probably break.⁴ You can\n\nspare yourself the heartbreak by loading your own\
    \ JSON serializer on the consumer\n\nside (i.e., Stork.JSON), and specify it when\
    \ creating easyXDM.Rpc instances.\n\nDESTROYING EASYXDM INSTANCES\n\nMost of the\
    \ time, you’ll leave your iframe\n\nchannels running until the user navigates\
    \ off the page or closes their browser.\n\nBut sometimes you’ll need to destroy\
    \ your easyXDM instances manually. Both\n\neasyXDM.Socket and easyXDM.Rpc provide\
    \ a destroy method that cleans up\n\neverything for you, including removing your\
    \ iframes from the DOM. \n\n*5.4*\n\n*Summary*\n\nThis chapter covered one of\
    \ the most important topics when it comes to third-party\n\nJavaScript development:\
    \ communication between your application code executing in\n\nthe publisher’s\
    \ context and iframes hosted on your domain. You should now have a\n\nclear understanding\
    \ of how cross-domain communication works in modern browsers\n\nand what workarounds\
    \ are available for legacy browsers. You should also be familiar\n\nwith easyXDM—a\
    \ library that takes care of all the dirty work for you. If something is\n\nstill\
    \ not clear, don’t worry. A bit of practice usually helps to understand how the\n\
    \nbrowser security model works and why API designers came up with such things\
    \ as the\n\nwindow.postMessage API.\n\n You might be wondering, where do we go\
    \ from here? Cross-domain messaging is a\n\ncomplicated topic, so we suggest that\
    \ you take a break and try to implement a feature\n\nfor your Stork widget that\
    \ requires it to communicate with the server. You can add the\n\nability to post\
    \ reviews, rate products, or even challenge yourself in the analytics field.\n\
    \nFor example, try logging what browsers your users use or what JavaScript libraries\
    \ are\n\ninstalled on their pages. When in doubt, refer to examples from this\
    \ and previous\n\n4 In chapter 1, we mentioned how Prototype JavaScript library\
    \ versions 1.7 and below introduce subtle, break-\n\ning changes to the built-in\
    \ JSON object.\n\nwww.it-ebooks.info"
