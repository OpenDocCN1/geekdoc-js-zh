    \ choice. There are web framework plugins and\n\nlibraries out there that will\
    \ do this for you.\n\nDJANGO GARGOYLE\n\nIf you happen to be using Django as part\
    \ of your web\n\napplication stack, we recommend you take a look at Gargoyle.\
    \ Gargoyle is a\n\nswitches platform implementation built by engineers at Disqus\
    \ on top of\n\nDjango. It’s both powerful and easy to use:\n\nfrom gargoyle import\
    \ gargoyle\n\ndef loader(self, request):\n\nif gargoyle.is\\_active('debug', request):\n\
    \nreturn js('loader.debug.js')\n\nelse:\n\nreturn js('loader.js')\n\nAdditionally,\
    \ Gargoyle has a convenient web interface for toggling switches\n\nfrom the browser.\
    \ Gargoyle is an open source project and is available on\n\nGitHub: https://github.com/disqus/gargoyle.\n\
    \nNow that you know how both switches and proxy servers work, the questions remains,\n\
    \nwhich is better for serving debuggable development files? The answer is blurry.\n\
    \nSwitches are great because they’re easy to implement, can be enabled with the\
    \ press of\n\na button, and can be enabled under a variety of complex parameters\
    \ (username, IP\n\naddress, browser version—the sky’s the limit). Proxies can\
    \ offer you more fine-grained\n\ncontrol over what files you’re serving. For example,\
    \ with proxies, you can even test\n\nwebsites using an experimental version of\
    \ your local JavaScript code. At Disqus, we use\n\nboth solutions day to day.\n\
    \nBrowser\n\nWeb server\n\nRequired\n\nIs switch \n\nenabled?\n\nDevelopment\n\
    \nenvironment\n\nYes\n\nDB\n\nProduction\n\nFigure 10.4\n\nLoader checks status\
    \ of a switch by checking its value in the database \n\nand decides whether to\
    \ load development files or production files\n\n**Query database and **\n\n**return\
    \ object for **\n\n**debug switch**\n\n**Check if current user is in **\n\n**list\
    \ of users enabled for **\n\n**that switch**\n\nwww.it-ebooks.info"
