  md: "**75**\n\n***Embedding content in iframes***\n\n*3.4.4*\n\n*When to refrain\
    \ from using iframes?*\n\nAt this point, you’re probably thinking that iframes\
    \ are the silver bullet to rendering\n\ndefensive widget HTML and CSS. In some\
    \ ways, they are—iframes provide the best pro-\n\ntection against conflicting\
    \ styles and scripts. But that protection comes at a cost.\n\nSometimes rendering\
    \ on the publisher’s DOM, for all its difficulties in maintaining\n\nconsistent\
    \ styles, is more appropriate. Let’s quickly look at some of these situations.\n\
    \nYOU NEED TO RENDER OUTSIDE THE IFRAME\n\nOne of the biggest costs of doing all\
    \ your rendering inside an iframe is that you can’t\n\nrender *outside* the iframe.\
    \ There are a number of situations where rendering outside\n\nthe iframe is helpful.\
    \ For example, modal dialogs that overlay the entire page content\n\naren’t possible\
    \ if your rendering is restricted to the space occupied by your iframe. By\n\n\
    the same token, tooltips, which are often positioned “on top” of elements, will\
    \ be\n\nmore difficult to use because they\n\nmight clip the border of your iframe\n\
    \n(see figure 3.8). In both of these\n\ncases, it’s perfectly appropriate to\n\
    \nrender directly on the publisher’s\n\npage instead. Absolute positioned\n\n\
    elements like modals and tooltips\n\n(which are children of the body ele-\n\n\
    ment) are far less likely to be acciden-\n\ntally targeted by the publisher’s\
    \ styles,\n\nso this isn’t as bad as it seems.\n\nYOU NEED TO MAXIMIZE PERFORMANCE\n\
    \nIframes, particularly external iframes that load a remote web page, happen to\
    \ be some-\n\nwhat slow. This slowness is perfectly negligible for a widget that’s\
    \ rendered once or\n\ntwice on a publisher’s page. But if your third-party app\
    \ is rendering a large number of\n\niframe instances on a single page, it may\
    \ come at a large performance cost to publish-\n\ners. If there are smaller, repeated\
    \ elements of your application that can be rendered on\n\nthe publisher’s DOM\
    \ relatively conflict-free, that might be a better choice over iframes.\n\n Alternatively\
    \ (or supplementarily), you can help defer the performance cost of\n\nmultiple\
    \ iframes by not rendering the iframes until they’re visible in the browser win-\n\
    \ndow (only load widgets that are immediately visible by the user). We’ll cover\
    \ this tech-\n\nnique and other performance topics in chapter 9.\n\nYOU NEED MAXIMUM\
    \ CUSTOMIZABILITY\n\nWe’ve already covered that it takes some work just to have\
    \ your iframe inherit the page’s\n\nbase styles. What happens when you want to\
    \ enable your publisher to style discrete ele-\n\nments of your application? Because\
    \ they’re behind an iframe, they won’t be able to tar-\n\nget your elements with\
    \ CSS, even with the specificity-busting !important rule. Instead,\n\nyou’ll need\
    \ to have publishers upload their CSS customizations to your server and serve\n\
    \nthem from your iframe. Alternatively, you can accept a CSS customization parameter\
    \ in\n\nyour script include widget and pass the results to your iframe that way.\n\
    \n![](img/5163284bc2a93c8f882ffdc058bb516a_99_0.png)\n\nMikon E90 Digital SLR\n\
    \n$599.99 – Buy now\n\n4.3/5.0 • 176 reviews\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_99_1.png)![](img/5163284bc2a93c8f882ffdc058bb516a_99_2.png)\n\
    \ny now\n\no\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_99_3.png)\n\no\n\neview\n\
    \nviview\n\nview\n\nviview\n\nview\n\nviviview\n\nvieiview\n\nivivie\n\nvivivieiew\n\
    \ne\n\nvivi\n\ns\n\nBuy on Camera Stork.com\n\nInvisible iframe edge\n\nFigure\
    \ 3.8\n\nAn example of a \n\ntooltip being clipped by the \n\niframe’s bounding\
    \ box\n\nwww.it-ebooks.info"
