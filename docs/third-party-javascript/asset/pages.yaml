  md: "**111**\n\n***HTML5 window.postMessage API***\n\nINTERNET EXPLORER POSTMESSAGE\
    \ LIMITATIONS\n\nAlthough Internet Explorer 8 and 9 implement the postMessage\
    \ API, they do so with\n\nsome limitations. The most significant of which is that\
    \ they only permit sending mes-\n\nsages to iframe elements. Any attempt to send\
    \ a message to a dedicated window or tab\n\nwill result in a *No such interface\
    \ supported* error message. We consider this to be a\n\nbrowser bug and, unfortunately,\
    \ don’t know of any existing workarounds (besides not\n\nusing postMessage altogether,\
    \ which we’ll explain shortly). Not all third-party applica-\n\ntions use pop-up\
    \ windows, so this limitation may not impact you.\n\n Additionally, IE8 and IE9\
    \ don’t support the aforementioned structured clone algo-\n\nrithm. This means\
    \ that you need to serialize data into strings using JSON before pass-\n\ning\
    \ it as a parameter to the postMessage method. Since IE8 and IE9 support the built-\n\
    \nin JSON object, this is trivial (just don’t forget to parse the data on the\
    \ receiving end):\n\nvar data = JSON.serialize({ hello: \"world\" });\n\nsomeWindow.postMessage(data,\
    \ targetOrigin);\n\nLast, you should keep in mind that Internet Explorer 8 (and\
    \ earlier) has a slightly dif-\n\nferent API for registering event listeners:\
    \ instead of addEventListener you’ll need to\n\ncall attachEvent:\n\nfunction\
    \ receiver(ev) { ... }\n\nif (window.addEventListener) {\n\nwindow.addEventListener('message',\
    \ receiver, false);\n\n} else {\n\nwindow.attachEvent('onmessage', receiver);\n\
    \n}\n\nDespite these limitations, window.postMessage on Internet Explorer 8 and\
    \ 9 is very\n\nusable and powerful. But what about legacy browsers, like Internet\
    \ Explorer versions 6\n\nand 7, which still have a sizable user base, but have\
    \ absolutely no support for the\n\npostMessage API? In this next section, we’ll\
    \ look at a number of fallback techniques\n\nfor sending messages between iframes.\
    \ They’re not always pretty, but they get the job\n\ndone, even in older browsers.\
    \ Let’s take a look.\n\nTable 5.1\n\n**window.postMessage** browser compatibility\
    \ table\n\nBrowser\n\nCompatibility\n\nMozilla Firefox\n\n3.5 and above\n\nGoogle\
    \ Chrome\n\n3 and above\n\nApple Safari\n\n4 and above\n\nMicrosoft Internet Explorer\n\
    \n8 and above (with limitations)\n\nOpera Desktop\n\n9.5 and above\n\nOpera Mobile\n\
    \n10 and above\n\nApple iOS Safari\n\n3.2 and above\n\nGoogle Android Browser\n\
    \n2.1 and above\n\nwww.it-ebooks.info"
