  md: "**98**\n\nCHAPTER 4\n\n***Communicating with the server***\n\nThis code works\
    \ fine in Chrome, Firefox, Opera, and Internet Explorer 9. But IE8\n\nraises a\
    \ Permission Denied error when the child page tries to communicate with its\n\n\
    parent. Removing the document.domain part from the child doesn’t fix the issue\
    \ and\n\ndoesn’t make a lot of sense, since both parties must opt in to the same\
    \ origin in order\n\nto be able to communicate with each other. The problem is\
    \ that Internet Explorer 8\n\nhas a browser bug that prevents a top-level domain\
    \ from communicating with its sub-\n\ndomains. Unfortunately, until Microsoft\
    \ fixes it, there’s no known workaround.\n\n What does this mean? In order to\
    \ support IE8, subdomain proxies are only viable for\n\npublisher websites that\
    \ are *also* served from a subdomain. Often this isn’t a problem;\n\nmany websites\
    \ are served from the standard www subdomain (www.publisher.com). And\n\nif they\
    \ aren’t, they can easily begin using the www subdomain by updating their DNS\n\
    \nrecords. All the same, this is another situation wherein subdomain proxies require\
    \ the\n\ncooperation of publishers in order to work effectively. \n\n*4.3.5*\n\
    \n*Security implications*\n\nInternet Explorer bugs aside, subdomain proxies can\
    \ be useful. If they don’t find a\n\nhome in your third-party scripts, you’ll\
    \ probably use them in one form or another\n\nelsewhere. But when employing subdomain\
    \ proxies, you have to always remember the\n\nsecurity issues associated with\
    \ them.\n\n First, the document.domain property can be the source of security\
    \ vulnerabilities.\n\nWhen any two legitimate subdomains (say, status.example.com\
    \ and auth.example\n\n.com) opt in to the same domain namespace, any other resource\
    \ served from that\n\ndomain may set their document.domain property to example.com\
    \ and gain access to\n\nproperties and methods from legitimate subdomains. So\
    \ if you have user pages hosted\n\non pages.example.com where it’s possible to\
    \ run arbitrary JavaScript code, it’s not a\n\ngood idea to opt in any other subdomains\
    \ into the top-level namespace because that\n\nuser code could access it.\n\n\
    \ Also, document.domain behavior is not very well specified. For example, there’s\
    \ no\n\nsingle rule on how document.domain should deal with top-level domains\
    \ like .com or\n\n.org, or what should be the behavior for sites that are accessed\
    \ by their IP addresses. At\n\none point, browsers exposed a large security hole\
    \ where they allowed locally saved\n\nfiles (file://) to access all other files\
    \ on the disk or on the web. Fortunately, that\n\nbehavior has been fixed, but\
    \ it’s a good example of a security vulnerability that was\n\ncaused by a bad\
    \ specification.\n\nGOOGLE’S BROWSER SECURITY HANDBOOK\n\nIf you’re interested\
    \ in learning\n\nmore about the same-origin policy and security risks associated\
    \ with it, you’ll\n\nwant to read part 2 of Google’s *Browser Security Handbook*\
    \ (http://\n\ncode.google.com/p/browsersec/wiki/Part2). This document is a great\n\
    \nresource that, unfortunately, not a lot of people know about.\n\nWe just looked\
    \ at one way to enable cross-domain requests and, although it works only\n\nin\
    \ a narrow use case—when all participating parties share the same higher-level\n\
    \ndomain—from time to time you might find it useful. While using it, you should\
    \ always\n\nbe aware of its security risks and be careful with your actual implementation.\
    \ \n\nwww.it-ebooks.info"
