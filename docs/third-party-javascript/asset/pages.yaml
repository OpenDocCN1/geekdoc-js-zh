    \ + '\"/>';\n\n \n\nout += friend.name + '</li>';\n\n });\n\n $('#mutual-friends').html(out);\n\
    \n }\n\n </script>\n\n</html>\n\nJill managed to embed some powerful functionality\
    \ in her resume, all using a small\n\namount of client-side JavaScript. With this\
    \ impressive piece of work, she should have\n\nno problem landing a top-flight\
    \ software job. \n\nBENEFITS OF CLIENT\\-SIDE API ACCESS\n\nIt’s worth pointing\
    \ out that this entire example could’ve been done without client-side\n\nJavaScript.\
    \ Instead, Jill could’ve written a server application to query the Facebook\n\n\
    Graph API for the necessary data and then render the result as HTML in the response\n\
    \nListing 1.4\n\nUsing Facebook’s Graph API to fetch and display a list of mutual\
