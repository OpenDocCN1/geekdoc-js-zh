  md: "**148**\n\nCHAPTER 6\n\n***Authentication and sessions***\n\nfirst (Firesheep\
    \ sniffs the HTTP request). If the user doesn’t visit the site, there’s no\n\n\
    harm. But third-party applications are distributed, and can be installed on a\
    \ great\n\nnumber of web properties (for example, Facebook’s Like widget is seemingly\
    \ every-\n\nwhere). In those cases, just requesting a single instance of these\
    \ types of applications,\n\nno matter where they’re situated, could potentially\
    \ transfer cookies in plain text over\n\nthe network. The odds of having your\
    \ session hijacked just became much higher.\n\n We’re starting to paint a grim\
    \ picture, but don’t worry, all hope isn’t lost. There are\n\na couple of measures\
    \ you can take to eliminate session hijacking, or at the least mini-\n\nmize its\
    \ impact significantly. We’ll first look at encrypting traffic to your application\n\
    \nusing HTTPS. Then we’ll explore using multilevel authentication, where you generate\n\
    \nmultiple session tokens that correspond to different levels of actions. First\
    \ up: HTTPS.\n\n*6.3.1*\n\n*HTTPS and secure cookies*\n\nBy design, HTTP transmits\
    \ all data in plain text using the plain *Transmission Control Pro-*\n\n*tocol*—better\
    \ known as *TCP*. This leads to the vulnerabilities we just described, where\n\
    \nan attacker can sniff cookies on an unencrypted Wi-Fi network. It can also lead\
    \ to a\n\nman-in-the-middle (MITM) attack, where an attacker positions themselves\
    \ on the net-\n\nwork between their victims—the client and server—and then intercepts\
    \ and relays\n\nmessages between the victims such that they never realize that\
    \ their line of communi-\n\ncation has been breached. Just like packet sniffing,\
    \ in an MITM attack, the attacker\n\nmerely needs to watch the unencrypted HTTP\
    \ traffic in order to identify and hijack\n\ncookies containing session information.\n\
    \n The solution to these types of attacks is *HTTPS** (**HTTP** Secure)*, which\
    \ is a combina-\n\ntion of HTTP and the Transport Security Layer (TLS) cryptographic\
    \ protocol. It works\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_172_0.png)\n\n\
    Figure 6.8\n\nFiresheep, a Firefox browser plugin, makes it easy to hijack users’\
    \ sessions \n\non unencrypted networks.\n\nwww.it-ebooks.info"
