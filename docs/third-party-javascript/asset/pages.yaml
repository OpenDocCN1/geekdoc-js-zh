  md: "**88**\n\nCHAPTER 4\n\n***Communicating with the server***\n\nenable you to\
    \ make any HTTP request you desire. The caveat is that they may only be\n\nuseful\
    \ to a niche use case of third-party applications. Let’s find out more, shall\
    \ we?\n\n*4.3*\n\n*Subdomain proxies*\n\nAt the beginning of this chapter, we\
    \ showed you a table of possible outcomes of same-\n\norigin policy checks against\
    \ different origins. If you look back at table 4.1, you’ll\n\nnotice the SOP is\
    \ strict when it comes to the host part of the origin. Both example.com\n\nand\
    \ sub.example.com share the same higher-level domain, but the browser considers\n\
    \nthem to be completely unrelated to each other.\n\n Fortunately for us, browsers\
    \ allow websites to change the host part of their origins\n\nto the suffix of\
    \ their original values. This means that a page hosted on sub.example\n\n.com\
    \ can set its origin to example.com, but it can’t set it to alt.example.com or\n\
    \ngoogle.com. Note that this exception applies to the domain part only. Browsers\
    \ won’t\n\nlet you modify the origin’s port number or HTTP protocol.\n\n If you’re\
    \ an astute reader, you may have figured out how to turn this exception to\n\n\
    your advantage. If both communicating parties opt in to the same domain suffix,\n\
    \nthey’ll have the same origin values, and browsers will no longer prevent them\
    \ from\n\ncommunicating with each other. In other words, documents on sub.example.com\
    \ and\n\nalt.example.com are prohibited from accessing each other’s properties\
    \ and methods\n\n*unless they explicitly opt in to the same higher-level domain*\
    \ (example.com, in this example).\n\n Of course, these are all subdomains under\
    \ our control. How can you use this tech-\n\nnique if you’re distributing your\
    \ application to publishers on entirely different\n\ndomains?\n\n Let’s say you’re\
    \ developing a widget for a small number of large, corporate pub-\n\nlishers,\
    \ over which you have influence or control of their production environment.\n\n\
    You could ask these publishers to create a subdomain under their base-level domain\n\
    \nand have point it to your servers. For example, a publisher at publisher.com\
    \ would\n\ncreate the subdomain thirdparty.publisher.com. They can do this by\
    \ configuring their\n\nweb server to proxy all requests to that subdomain to your\
    \ servers (see figure 4.4), or\n\nhave it done at the DNS level by using a CNAME\
    \ record. Afterward, your third-party\n\nscript executing on publisher.com can\
    \ communicate through this subdomain to initi-\n\nate AJAX requests to your main\
    \ server. Subdomain proxies require some work on\n\nbehalf of your customers,\
    \ but it’s a real-world practice used by a number of successful\n\nthird-party\
    \ applications today.\n\n Now that you know the theory, it’s time to see some\
    \ code. In this section, we’ll\n\nimplement subdomain proxies as a means of enabling\
    \ cross-domain communication\n\nfor your third-party application. We’ll finish\
    \ with a discussion of subdomain proxy\n\nbrowser quirks and other limitations.\n\
    \nwww.it-ebooks.info"
