    \ script-loading library developed by Kyle Simpson with guidance\n\nfrom web performance\
    \ guru Steve Souders (see http://labjs.com/), is optimized to\n\nuse different\
    \ loading techniques depending on the browser or environment. LABjs is\n\nalso\
    \ capable of queueing multiple file loads at once and maintaining execution order\n\
    \nof scripts. LABjs isn’t alone in this endeavor—other libraries, like RequireJS\
    \ and\n\nyepnope.js, provide varying feature sets centered around loading both\
