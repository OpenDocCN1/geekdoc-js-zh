  md: "**60**\n\nCHAPTER 3\n\n***Rendering HTML and CSS***\n\nINJECTING CSS INTO THE\
    \ DOM\n\nAfter you have your CSS string in your code, next up is inserting it\
    \ into the page (list-\n\ning 3.6). As we mentioned earlier, you’ll create a new\
    \ <style> DOM element, append\n\nthe CSS string as a text node to it, and then\
    \ append the style element to the page. This\n\nstyle element can go anywhere\
    \ in the page, so as you’ve done earlier, you’ll insert it\n\nbefore a found script\
    \ element.\n\nfunction injectCss(css) {\n\nvar style = document.createElement('style');\n\
    \nstyle.type = 'text/css';\n\ncss = css.replace(/\\\\}/g, \"}\\\\n\");\n\nif (style.styleSheet)\
    \ {\n\nstyle.styleSheet.cssText = css;\n\n} else {\n\nstyle.appendChild(document.createTextNode(css));\n\
    \n}\n\nvar entry = document.getElementsByTagName('script')\\[0\\];\n\nentry.parentNode.insertBefore(style,\
    \ entry);\n\n}\n\nAnd you’re done! The nice thing about embedding CSS this way\
    \ is that you don’t need\n\na convoluted helper function to detect when the CSS\
    \ is ready (polling the DOM for\n\nstyle changes). You can execute your “ready”\
    \ callback immediately after the CSS has\n\nbeen injected; there’s no waiting.\n\
    \n The downside, in addition to having to incorporate a build step to convert\
    \ your CSS\n\nfile to a JavaScript string, is that debugging your CSS is tougher\
    \ than if you’d loaded CSS\n\nseparately. This is because most browser developer\
    \ tools (Firebug, Chrome Dev Tools,\n\nand so on) will consider your style rules\
    \ as part of the parent page, instead of grouping\n\nthem under a file attributed\
    \ to your domain. We don’t think this is a deal-breaker, but\n\nit can be annoying.\n\
    \n At this point, you should know how to render your widget’s HTML on the pub-\n\
    \nlisher’s DOM, and style that HTML using one of the three techniques we just\
    \ covered.\n\nThe Camera Stork widget should now be looking good;\n\nit’s not\
    \ bare-bones HTML, but a fully styled work of art\n\n(see figure 3.3).\n\n This\
    \ example looks good, but that’s because it’s being\n\nrendered on a blank test\
    \ page without any other HTML\n\nor CSS. If you were to deploy this on a fully-functioning\n\
    \npublisher’s website, there’s a good chance that a CSS rule\n\ndefined by the\
    \ publisher might somehow conflict, and\n\nmake the whole thing look out of whack.\n\
    \n When it comes to rendering on somebody else’s DOM,\n\nyou can’t naively write\
    \ HTML and CSS like you might for\n\nListing 3.6\n\nHelper function for injecting\
    \ CSS into a page\n\n**Split rules onto separate **\n\n**lines for readability**\n\
    \n**For Internet Explorer, **\n\n**use style element’s **\n\n**cssText property**\n\
    \n**Other browsers**\n\n**can append new**\n\n**DOM text node**\n\nMikon E90 Digital\
    \ SLR\n\n$599.99 – Buy now\n\n4.3/5.0 • 176 reviews\n\n![](img/5163284bc2a93c8f882ffdc058bb516a_84_0.png)![](img/5163284bc2a93c8f882ffdc058bb516a_84_0.png)\n\
    \nFigure 3.3\n\nThe Camera Stork \n\nwidget, in fully styled glory\n\nwww.it-ebooks.info"
