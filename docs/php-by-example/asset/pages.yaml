  md: '# Passing Values to and from Functions


    Here are a few examples of the results of this function:


    +   Function call:

    outputSentence(''Joe Smith'', 36, ''male'');


    +   Output:

    Joe Smith is a 36-year old male.


    +   Function call:

    outputSentence(''Ashley Edwards'', 8, ''female'');


    +   Output:

    Ashley Edwards is a 8-year old female.


    Notice that the grammar of the output string hasn''t changed "a" should have changed
    to "an". Some programmers and their clients don''t mind this sort of problem,
    but it''s possible to modify this function to always use correct grammar, producing
    a more professional result.


    +   Function call:

    outputSentence(8, ''male'', ''Nick Williams'');


    +   Output:

    8 is a male-year old Nick Williams.


    Notice that the function call has its parameters out of order. As you can see,
    PHP is perfectly happy outputting them in any order, Therefore, if you''re ever
    unsure of the order your arguments should be in, you should check the function''s
    definition to find out.


    Just as you can use literal values as parameters when you call a function, you
    can also use variables. The variable will be evaluated before the function is
    called, so only the variable''s value will be passed.


    The following two examples demonstrate using functions with variables in the function
    call:


    +   Code segment:

    $txtName = ''Joe Smith'';

    $intAge = 20;

    $StrGender = ''male'';


    ```

    outputSentence($txtName, $intAge, $strGender);

    ```


    +   Output:

    Joe Smith is a 26-year old male.'
