  md: '# String Functions


    To do this, you''ll use the strpos function. The syntax for the strpos function
    is as follows:


    ```

    int strpos(string str, string find [, int start])

    ```


    str is the string to be searched, and find is the string to find. The optional
    start parameter is used to limit where strpos starts searching for find within
    str; for example, if you know there are periods within a string, but want to find
    the second one, you can rule out the first one by specifying a start that is first.


    Here''s how strpos is used to find the caret in the preceding expression:


    ```

    $caretPos = strpos($numToPower, ''^'');

    ```


    Supposing $numToPower is 20^2, $caretPos would be 2 (the caret''s index within
    the string). See Figure 5.2 for a visual depiction of how strpos() arrives at
    this value.


    | NumToPower:| 2 ^ 2 |

    | INDEX:| 0 [1] [2] |

    | String Length:| 1 2 3 |


    **Figure 5.2: The index position of the caret is what is returned by strpos(''20^2'',
    ''^'').**


    Now, get the two numbers, it''s only necessary to use $caretPos with the preceding
    assertions describing where you will find the beginnings and ends of the numbers
    in relation to the caret.


    There is one complication, however. the substr function doesn''t take a start
    and an end position, but rather a start and a length. To overcome this, you have
