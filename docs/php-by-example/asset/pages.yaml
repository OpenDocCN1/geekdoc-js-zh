    ```

    $1+2+3-4+5

    3+3-4+5

    6-4+5

    2+5

    7$

    ```


    **Figure 4.1:** These operations are evaluated from left to right.


    ```

    $2*2+3*3

    4+3*3

    4+9

    13$

    ```


    **Figure 4.2:** These operations are evaluated first for multiplication and division
    operations, then addition and subtraction.


    Notice that the result of this expression, 13, is not the same as if it were evaluated
    strictly in left-to-right order, which would be 21, as demonstrated by Figure
    4.3.


    ```

    $2*2+3*3

    4+3*3

    7*3

    21$

    ```


    **Figure 4.3:** The expression in Figure 4.2 is being evaluated in an incorrect
    order here. Multiplication and division are always evaluated before addition and
    subtraction.


    The order in which expressions are evaluated is determined by each operator''s
    precedence. An operator''s precedence dictates how important its evaluation is
    compared to that of other operators.


    Precedence of operators in numeric expressions is shown here from highest to lowest.
    Operators on the same row carry the same precedence and are evaluated from left
    to right as they appear in the expression. The operator precedence of the binary
    math operators is shown in Table 4.2.'
