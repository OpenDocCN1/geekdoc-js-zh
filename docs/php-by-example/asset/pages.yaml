  md: '# Chapter 6: The if, elseif, and else Statements


    As you can see, the AND operator is used to verify that two Boolean values are
    both true.


    For example, to make sure a user gave first and last names, and assuming that
    ($form has been referenced to the appropriate input variable ($HTTP_POST_VARS,
    $HTTP_GET_VARS), you could use `if($form[''name''] != '''') && ($form[''name'']
    != '''')`


    Using this condition, each variable ($form[''name''] and $form[''name'']) must
    not be empty.


    Typically, you will find && used instead of and. However, as long as you realize
    that != has precedence over &&, it''s acceptable to use either one.


    For example, if I wanted to use != instead of &&, I would simply use the condition:
    `if($form[''name''] != '''') && ($form[''name''] != '''')`


    This condition is functionally equivalent to the condition given before that used
    &&.


    > TIP

    Either way, the operator is read as "and." So, both conditions are read as $form[''name'']
    isn''t empty and $form[''name''] isn''t empty.


    Table 6.4 The OR (or ||) Operator Requires That at Least One of the Values Be
    True


    | Left Value | Right Value | Return Value |

    |---|---|---|

    | True | True | True |

    | True | False | True |

    | False | True | False |


    The OR operator is used to find out if either value in a conditional is true.


    For example, a user could be required to choose between two different options;
    let''s say a subscription level for an online magazine. The choice would be between
    "standard" and "premium," but one of the two must be chosen (true); the option
    can''t be blank (false).


    Thus, you could use a condition like this:

    `$form[''standard''] == True || ($form[''premium''] == True)`


    This would ensure that at least one of the values was true.


    Table 6.5 shows the behavior of the XOR operator in detail.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Short Circuit Evaluation


    Table 6.5: The XOR Operator Requires That One of the Values Be True

    | Left Value | Right Value | Return Value |

    |---|---|---|n| True | True | False |

    | True | False | True |

    | False | True | False |


    The XOR (exclusive or) operator has no symbolic operator akin to this (like &&
    or ||). Its purpose is to ensure that only one of the values is true. Unlike OR,
    if both values are true, XOR will return false.


    Consider the example given above for OR. In that case, both values could conceivably
    be true, in which case there is the ambiguity of which one is intended or correct.
    However, by using the XOR operator in the condition, both values would not be
    allowed to slip through being true. Here''s how the conditional would look:


    ```

    $form[''standard''] == True) xor($form[''premium'']) == True

    ```


    Finally, the logical operator, the NOT operator, is shown in Table 6.6. This operator
    is used to reverse any Boolean value; if the value is 1, then 0 is returned, and
    vice versa.


    To use the NOT operator, you simply place it before a Boolean value. With all
    of the logical operators, if a value used with NOT isn''t a Boolean value, it
    will typecast to a Boolean first.


    Table 6.6: The NOT (or 1) Operator Reverses the Value of a Boolean Value

    | Right Value | Return Value |

    |---|---|n| True | False |

    | False | True |


    ```

    So, $boolVal is true,

    echo !$boolVal;

    displays 0. On the other hand, if $boolVal is false,

    echo !$boolVal;

    ```


    # Short Circuit Evaluation


    To make PHP more efficient, a shortcut is sometimes taken in evaluating a conditional.
    This never changes the outcome of the condition''s evaluation, but it might keep
    things from happening that you might expect to happen.'
  merge: -1
  pgno: 145
- img_proc: true
  md: "# Chapter 6: The if, elseif, and else Statements\n\nThe shortcut is called\
    \ short circuit evaluation. This occurs when PHP decides there's no need for it\
    \ to evaluate any of the condition because it already knows the outcome. This\
    \ happens when\n\n+   - The first part of a condition with and in it evaluates\
    \ to false, because both values in such a condition must evaluate to true. If\
    \ one evaluates to false, PHP knows the condition can't possibly evaluate to true.\n\
    - The first part of a condition with or in it evaluates to true, because only\
    \ one value in such a condition must evaluate to true. So, if the first evaluates\
    \ to true, it doesn't matter if the second is true or false; the condition as\
    \ a will will be true.\n\nThe problem this presents is if you use statements with\
    \ assignments or calls to functions. For example, an assignment returns the value\
    \ that was being assigned. This is often used to assign a value and check if it\
    \ evaluates to true or false as a Boolean at the same time. However, if the assignment\
    \ appears in the second part of the conditional and the first part causes the\
    \ rest to be skipped, the assignment will never place.\n\nTherefore, the following\
    \ example script produces no output:\n\n```\n<?php\n/* $ch0ex07 - shows no output\
    \ because short circuit evaluation */\n\nif (true || $intVal = 5) // short circuits\
    \ after true\n{\n    echo $intVal; // will be empty because the assignment never\
    \ took place\n}\n\n?\n```\n\nThis program outputs nothing because the assignment\
    \ of $intVal never takes place, although the echo statement is executed, $intVal\
    \ is empty and is outputted.\n\nShort circuit evaluation can also have an effect\
    \ on calls to functions that change the value of a variable. This is for the same\
    \ reason that causes assignments to be skipped. Therefore, it's always recommended\
    \ that assignments and calls to functions, which change variables, be placed outside\
    \ of conditionals; if the value function returns is needed in the conditional,\
    \ store it in a variable first and put the variable in the conditional.\n\n![](img/b437c18efec65ed938962e8683b6a70c_146_0.png)"
  merge: -1
  pgno: 146
