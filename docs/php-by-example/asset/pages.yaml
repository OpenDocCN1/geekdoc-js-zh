  md: "# Syntax 173\n\nits relationship to the while loop, the for loop makes this\
    \ relationship by adding the initialization statement to the for statement, next\
    \ to the condition. In addition, the incrementing of the sentinel (++) is also\
    \ added to the statement. Thus, anyone who reads your variable is used as the\
    \ sentinel, what the condition is (which is the only thing they would've known\
    \ if while were used), and how the variable is changed before each repetition.\n\
    \nThe initialization statement, conditional expression, and repetition statement\
    \ are placed together in the for statement, as shown by its syntax here:\n(initialization\
    \ statement; conditional expression; repetition statement)\n\n```\n{\n  code block\n\
    }\n```\n\nThis syntax may seem a bit confusing at first, but with some explanation\
    \ it will be clearer.\n\nThe initialization statement is executed only once, at\
    \ the very beginning of the loop. Before, the code block is executed, the conditional\
    \ expression is checked to make sure it is true. After the code block has been\
    \ executed, and before the conditional expression is evaluated again to begin\
    \ another repetition of the loop, the repetition statement is executed.\n\n# CAUTION\n\
    \nThe conditional expression is checked before the code block is executed. So,\
    \ if the condition isn't met to begin with, the looped never executes.\n\n![](img/b437c18efec65ed938962e8683b6a70c_185_0.png)\n\
    \nLet's assume you want to list the numbers 1 through 10, as done above with a\
    \ while loop, except this time we do it with a for loop. If you were to tell another\
    \ person what you want to do, you would say something like: \"For every number\
    \ from 1 to 10, show the current number.\"\n\nThe three parts of your loop are\
    \ as follows:\n\n+   * The initialization statement sets $i to the first number\
    \ you wish to display, 1.\n\n+   * The conditional expression evaluates to true\
    \ until $i is greater than 10.\n\n+   * The repetition statement should increment\
    \ $i by 1.\n\nThe following for loop results:\n\n```\nfor ($i = 1; $i <= 10; $i++)\n\
    {}\n```"
