  md: '# Chapter 13: Creating Dynamic Content with PHP and a MySQL Database


    # A Word about Databases


    Before we started with this chapter, you need to ensure that you have a MySQL
    database set up somewhere. You can use other databases, of course, but MySQL is
    a favorite of many for its power and reliability.


    If you don''t have access to a MySQL server, you will need to set one up before
    you use any of the concepts presented in this chapter.


    Luckily, MySQL can run on just any operating system. For learning purposes, you
    can set it up on your local machine. MySQL''s Web site, www.mysql.com, will provide
    you with plenty of information on downloading and setting up your own MySQL server.


    Because your probably can''t compete with a dedicated server you should probably
    get access to a MySQL host when begin publishing public database-driven Web sites.
    Finding a good host is very similar to finding a regular Web provider—simply add
    PHP and MySQL access to your list of desired features.


    Also, it''s important to realize that this is only an introduction to creating
    database-driven Web sites. It''s enough to give you a good start; in fact, after
    reading this chapter, you''ll be able to do all you want for now.


    This introduction is indeed brief, but resources specific to creating data-driven
