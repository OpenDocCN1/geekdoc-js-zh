  md: '# 364 Chapter 17: Putting It All Together


    # NOTE


    This file assumes you''ll be logging in your MySQL server with privileges to create
    a database (called PHPByExample). If you don''t have those privileges, you''ll
    need to modify the SQL to suit yours (by dropping the CREATE DATABASE statement
    and changing the USE PHPByExample.le line to use whatever database you have permissions
    for).


    The result of executing these SQL commands will be a table guestbook in your database.
    It will have a few dummy entries as well to help testing.


    # The Guestbook Program


    Now that you know some of the configuration and layout files in inc/, it''s time
    to get down to the programming that drives the main guestbook functionality.


    The order in which you write the files doesn''t really matter, but it makes sense
    to code your main objectives, then fill in the holes (such as allowing an administrator
    to delete posts as desired) as necessary. When you complete one task, you can
    always look at your outline and decide what the next step should be, which is
    typically most closely related to the step you just completed.


    The most obvious place to start would be the guestbook we script, index.php. This
    script will show you all of the postings in the MySQL database.


    Following is index.php:


    ```

    <php

    /* PHP BY EXAMPLE GUESTBOOK DEMONSTRATION

    index.php - shows guestbook entries */


    include ''inc/common.php''; // Common functions,

    include ''inc/configure.php''; // Configuration constants,


    include ''inc/header.php''; // Standard layout header


    echo ''<h2>Guestbook Entries</h2>'';


    print_navBar();


    // Get all guestbook entries

    mys_connect(MYSQL_USER, MYSQL_PASS, MYSQL_HOST)

    or trigger_error(mysql_error(), E_USER_ERROR);

    mys_select_db(MYSQL_DB)

    or trigger_error(mysql_error(), E_USER_ERROR);

    ```


