  md: '# Variable References


    In simple terms, a variable reference is an alias for a variable. That is, a variable
    reference points to the same value as the variable that references it. Variable
    references are commonly used to shorten variable names into names that are more
    practical. Figure 2.1 shows a diagram of how you imagine a variable reference.


    | CODE | VARIABLES |

    | --- | --- |

    | <?php | |

    | $a = 5; | $a \rightarrow $5 |

    | $b = &$a; | $a \rightarrow $5, $b \rightarrow $10 |

    | $b = 10; | |


    **Figure 2.1:** Variable references create aliases to the same value, not separate
    variables.


    To create a variable reference, do an assignment as usual, add an ampersand between
    the equals sign and the variable to be referenced, as shown here:


    ```

    $alias = &$variable;

    ```


    where alias is the name of the reference to the variable and variable is the name
    of the variable you are referencing.


    The following example demonstrates the creation and use of a reference:


    ![](img/b437c18efec65ed938962e8683b6a70c_57_0.png)


    ```

    <?php

    /* Create a variable with a long name

    $arrNamesThatAreFairlyCommon = Array(''Joe''

    ```


    Separate the two lines of output

    echo ''<br>'';


    It''s not convenient to type that long variable name out, so let''s make a shorter
    reference to it that shorter

    $arrNames = &$arrNamesThatAreFairlyCommon;'
