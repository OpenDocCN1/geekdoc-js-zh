  md: '# Handling the File Upload Request 323


    On Windows 2000, the output of this script might be something like this:

    The file you just uploaded is stored in C:\WINNT\TEMP\php98.tmp


    This value is used in conjunction with two uploading-related functions.

    first, is_uploaded_file(), has the following syntax:


    ```

    is_uploaded_file(file)

    ```


    This function checks to see if a visitor did upload file. The value used for

    file, is $_POST_FILES[field name][''tmp_name'']


    ```

    $_POST_FILES[field name][''tmp_name'']

    ```


    For the given form in ch15ex01.html, you would call is_uploaded_file()

    like this:


    ```

    is_uploaded_file($_POST_FILES[''upload_file''][''tmp_name''])

    ```


    # CAUTION


    Checking the value that this function is vital for every file you upload.

    Otherwise, you risk the chance of having your script tricked into handling a file
    already

    on your file system if it was uploaded file.


    Let me give you an idea of how dangerous this could be. If a visitor was to enter

    /etc/passwd into the file input instead of choosing a file, your script might
    be fooled

    into moving /etc/passwd into a Web-accessible directory. This would give the visitor

    (who can be considered an attacker) access to the file by going to an address
    such as

    http://www.example.com/uploaded_files/passwd.


    +   * A complete example that uses is_uploaded_file() can be found in "Storing

    an Uploaded File in the files Table," p. 328


    The other function, move_uploaded_file(), is called using the following

    move_uploaded_file(uploaded_file, destination_file)


    This function does two things: First, it checks whether is_uploaded_

    file() on the uploaded file (such as $_POST_FILES[''upload_file'']

    [''tmp_name'']) passes or fails. If it fails, the file isn''t an uploaded file
    and it

    sn''t be moved; therefore, the function stops and returns false.

    Otherwise, the file is judged to be a valid uploaded file and is moved to the

    such as C:\InetPub/wwwroot/up_images/.


    move_uploaded_file() is the function we''ll use to verify and move uploaded

    files into the Web-accessible file system.'
