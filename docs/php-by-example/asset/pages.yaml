    # Recursive Functions


    A recursive function is a function that calls itself, using the result of that
    function call to complete its task (and return a resultant value in most cases).


    For example, you divide factorials (multiplying an integer below it until 1 is
    reached) using a for loop and decrementing the counter variable. This could be
    done, too, with recursion, which you''ll see soon.'
