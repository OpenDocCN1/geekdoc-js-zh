  md: '# Using while and do-while


    while and do-while enable your programs to perform repetitive tasks. For example,
    perhaps you want to list the contents of a 30-element array. Until now, you needed
    30 lines of code to do this. However, using while or do-while, this task can be
    shortened to just a few lines—one line to output an element, and an enclosing
    while block, essentially to tell how many times to repeat the command.


    This chapter teaches you the following:


    +   * The looping concept

    * while and do-while syntax

    * How to use while to traverse an array

    * How to count with sentinel values

    * How to calculate totals for repetitive statements'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# The while Statement


    Repetitive tasks in a program are coded using loops, blocks of code that perform
    the same task multiple times. A loop is coded using a special type of statement
    called a control structure, which controls how many times (if any) a given code
    segment is allowed to execute.


    NOTE


    The if (and its relatives elseif and else) and the switch statement are also control
    structures because they control whether the code below them executes once or never.


    The two control structures discussed in this chapter are while and do-while. For
    this section, we''ll focus solely on while.


    A statement is used to repeat a block of code as long as a given condition is
    true. For example, you can execute a while statement to display the elements of
    an array one at a time, as long as more elements can be displayed.


    To do this, we need to use two commands you haven''t seen yet: list and each.


    Each command is used to get each individual value of an array. The first call
    will return the first element, the second call returns the second element, and
    so on.


    However, to allow for flexibility, each also returns an array. The array contains
    key/value pairs:


    +   * [0] => key


    +   * [1] => value


    +   * [''key''] => key


    +   * [''value''] => value


    NOTE


    The => symbol used here to indicate a key/value relationship in an associative
    array. The following uses an associative array:


    ```

    $someArray[''someElement''] = ''This is someElement'';",

    ```


    After executing this statement, the contents of $someArray can easily be represented
    using the => notation. Here''s an easy way to write the contents of $someArray:


    ```

    [''someElement''] => ''This is someElement''

    ```'
  merge: -1
  pgno: 166
- img_proc: true
  md: "# The while Statement 155\n\nThis is where the list command comes in. The list\
    \ function is used to assign the values within an array to individual variables\
    \ in one step. example, assume the array $arrSample has been defined as:\n\n```\n\
    $arrSample = Array('Joe', 'R', 'Smith');\n```\n\nTo extract those values from\
    \ the array and store them in separate variables, $strName, $strInitial, and $strName,\
    \ you would use list as follows:\n\n```\nlist($strName, $strInitial, $strName)\
    \ = $arrSample;\n```\n\n# NOTE\n\nBe aware that the use of a function in this\
    \ example with list() is rare (and impossible with typical functions). Attempting\
    \ to assign a value to a function other than list will most likely result in an\
    \ error, unless the function is another construct that is to be used in this way.\n\
    \nThe reason it is possible that list is a language construct, which means it\
    \ is processed بمعنى from other functions.\n\nThe right operand (the Array command)\
    \ creates an associative array containing two keys: fname and lname. In assigning\
    \ this array to the list of variables, the variables given to list are matched\
    \ up to the values within the array by comparing the keys within the array to\
    \ the variable names. Thus, after the assignment, $fname contains 'Joe' and $lname\
    \ contains 'Smith'.\n\nTherefore, to traverse an array (move through each element\
    \ by looping), we'll want to capture the associative array returned by each in\
    \ the variables $key and $value. So, for each time the code segment repeats, we\
    \ need to execute this assignment:\n\n```\nlist($key, $value) = each ($arrValues);\n\
    ```\n\nThis assumes $arrValues is the name of the array we want to traverse. Another\
    \ important factor of each is that it returns false when it reaches the end of\
    \ the array. This is how we know when no more elements can be shown.\n\n# Syntax\
    \ for while\n\nTo handle the looping part of the process, we need to take a look\
    \ at the details of using the while statement.\n\nwhile follows this syntax:\n\
    \n```\nwhile (condition)\n{\n    code to repeat\n}\n```"
  merge: -1
  pgno: 167
- img_proc: true
  md: "# Chapter 8: Using while and do-while\n\nThe `condition` specified can be any\
    \ value that evaluates to true or false. Just as with it, this can be a function\
    \ call, a logical comparison, or a variable-changes. The `code` to repeat should\
    \ do a certain task, which usually also slightly in relation to the condition.\n\
    \nFor example, if your condition is `$i <= 10`, you're probably using `$i` in\
    \ your output. This could either be sending its value to output, or it could be\
    \ using the value at the index `$i` in an array.\n\nCAUTION\nNo matter your condition\
    \ is, you should ensure that the condition will eventually evaluate to false.\
    \ If you don't, the block will be an *infinite loop*-a loop that never exits.\n\
    \nIn some programming languages, an infinite loop causes the entire system to\
    \ crash, which is a huge frustration for programmers. However, PHP imposes a time\
    \ limit on its programs by default so not run longer than 30 seconds.\n\nIf you\
    \ see a maximum execution time exceeded error, chances are you have created an\
    \ infinite loop. It is possible you have created a looped code block with a lot\
    \ of overhead, but this scenario is rare. (The latter can be fixed in the configuration\
    \ file or using `set_time_limit()` to increase the amount of time allowed for\
    \ execution.)\n\nFigure 8.1 illustrates what happens in a while loop.\n\nstatements\n\
    \n```\nwhile (condition) {\n    code to repeat\n}\nstatements\n```\n\n**Figure\
    \ 8.1: This loop requires that the condition be true every time the beginning\
    \ of the loop is reached.**\n\nFor example, to use to echo all the values in `$HTTP_POST_VARS`,\
    \ you can create a program like this:\n\n```\n<?php\n/* ch08ex1.php - prints contents\
    \ of $HTTP_POST_VARS */\n?>\n<html>\n<title>Chapter 8 :: Example 1 :: What's in\
    \ $HTTP_POST_VARS?</title>\n```\n\n![](img/b437c18efec65ed938962e8683b6a70c_168_0.png)"
  merge: -1
  pgno: 168
- img_proc: true
  md: "# The while Statement\n\n```\n<body>\n<?php\n// If count returns 0, there's\
    \ nothing in the array\nif ( count(\\$HTTP_POST_VARS) < 1) {\n    echo \"There\
    \ aren't any elements in \\$HTTP_POST_VARS.\";\n}\nelse {\n    echo \"The following\
    \ data is in \\$HTTP_POST_VARS:<br>\";\n    // Show the elements in the array\
    \ one by one\n    while ( list(\\$key, \\$value) = each(\\$HTTP_POST_VARS)) {\n\
    \        echo \"$key = \\$value<br>\";\n    }\n}\n?>\n</body>\n</html>\n```\n\n\
    NOTE\ncount() function in this code is used to determine the number of elements\
    \ in an array. If 0 is returned, we can deduce that nothing was posted to the\
    \ program, and it is unnecessary to try to show the elements in the array.\n\n\
    By posting data to this program from a form, the program will display the data\
    \ exactly as it is received.\n\nTIP\nThis information can also be displayed using\
    \ the phpinfo() function, which displays information about PHP and its environment,\
    \ the version of PHP that is running, the options that are enabled, and, most\
    \ importantly, the variables automatically created by its environment, such as\
    \ the elements of $_HTTP_POST_VARS and the environment variables as $_HTTP_REFERER.\n\
    \nTo try using phpinfo(), create and run the following one-line program:\n<?php\
    \ phpinfo(); ?>"
