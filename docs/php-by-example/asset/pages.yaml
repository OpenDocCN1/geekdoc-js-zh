    +   - The assignment must use =& instead of

    - The function must have an ampersand (&) in its declaration between the word
    function and the function''s name.


    # TIP


    Returning a value by reference has nothing to do with the way the function works;
    any function that returns a value by reference can also be made to return the
    value normally. Returning a value by reference simply makes functions that return
    values that take up lots of memory more by eliminating the excessive copying process.


    # CAUTION


    Returning a value by reference speeds up a function that returns a large value,
    doing so with a function that returns a single number or small string is pointless.
    Copying the value by reference on such a small value will not speed up the process,
    so you might well leave those functions (which will be most of the functions you
    create) as regular functions that do not return a value by reference.


    Don''t be shy about using references, but be able to support why you used them
    when you do.'
