  md: '# Using HTTP Header Authentication


    The other way to collect the visitor''s username and password is by sending an
    HTTP WWW-Authenticate header, which tells the browser to get the information from
    the visitor using its own means, and then to return it to the program.


    NOTE

    Header authentication doesn''t work on Microsoft''s Internet Server when PHP is
    installed as a CGI program. (As an ISAPI module, however, it should work fine.)
    You should check your system configuration to be sure that isn''t the case before
    implementing a login system that uses this feature.

    However, that doesn''t mean you can use the login system that relies on forms.
    Besides looking different, HTTP header authentication doesn''t really have significant
    advantages.


    This is a little more complicated than it sounds because the process has two separate
    requests: one to ask the browser to get the visitor''s username and password,
    and a separate one for the browser to send the information to the server and retrieve
    the protected page.


    TIP

    Remember that you can''t send a header after your program has sent output, so
    be sure that blank spaces don''t appear at the beginning of your program. Also,
    check for the possibility of other forms of output being accidentally sent before
    the headers. Any output sent before the headers will cause a warning to be generated
    when the header() is called.


    # Sending the HTTP WWW-Authenticate Header


    This program will start off, just as the one that was made for forms. The first
    thing you need to do is make it prompt the browser for a username and password.
    To do this, the program will have to send two headers, as follows:


    ```

    <php

    /* ch14ex0.php - demonstrates using http-auth headers */


    header(''HTTP-Authenticate: Basic realm="Protected Area: PHP by Example - Ch.
    14, Ex. 06*'');

    header(''HTTP/1.0 401 Unauthorized'');


    ?>

    ```'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Using HTTP Header Authentication


    # CAUTION


    The headers shown in this example must be sent in the order they are shown; sending
    them in this order solves problems in some versions of Internet Explorer that
    don''t react well to the reverse order.


    # TIP


    For best compatibility, make sure you capitalize Basic in the HTTP-Authenticate
    header.


    Also, be sure to include double quotes around the text for the realm. In this
    example, mean double quotes should surround Protected Area, as you can see in
    the example.


    Finally, ensure that only one space separates HTTP/1.0 and 401 in the second header.
    Omitting the space or increasing the spacing can cause browsers to ignore this
    line because the header doesn''t meet HTTP standards.


    That''s all it takes to cause the browser to display a window similar to that
    shown in Figure 14.2.


    ![](img/b437c18efec65ed938962e8683b6a70c_321_0.png)


    > Figure 14.2: The browser displays a prompt window when given the appropriate
    HTTP headers.


    # NOTE


    The exact wording and layout of this window varies slightly from one operating
    system and browser to the next because of basic differences in browser interfaces,
    but they all are generally the same.


    After the user receives the prompt window, he is expected to either fill in a
    username and password or cancel. If he cancels, an error page is typically displayed
    telling him that the page allows authorized individuals only. A typical page might
    look something like that shown in Figure 14.3.'
