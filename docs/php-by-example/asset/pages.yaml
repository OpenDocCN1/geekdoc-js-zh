  md: '# Basic Arithmetic


    Here''s a question you probably heard back in elementary school: You''ve got two
    apples you find three more, how many apples do you have now? Of course you know
    the answer, but how do you tell PHP? Of course, you could just hardcode 5—but
    hardcoded data requires the program to be revised when the data needs to be changed,
    whereas dynamic variables can be changed from outside of the code and therefore
    no changes to the code are necessary—in case, you won''t be able to handle a code-number.


    You would have to leave it to PHP to calculate and use the appropriate value—just
    you will know how to tell PHP what you want to do. You''ll see soon, doing so
    is as about as typing the expression—the calculation you want PHP to perform—into
    your code.


    Expressions are a combination of operands and operators. An operator is a character
    that stands for a mathematical operation—such as addition or subtraction. The
    operand is one of the numbers involved in the operation. For example, if you multiply
    5x2, 5 and 2 are operands.


    # TIP


    Think of the operator as the action in an expression and the thing that action
    is performed on.


    An expression may be constructed with anything from just two operands and one
    operator to an infinite number of operands and operators. The following example
    shows a simple expression:


    +   1 + 2


    This is about simple as an expression gets. It''s not too intimidating to look
    at 1 + 2 and know that the result is 3. However, longer expressions can be intimidating.
    Take a look at the following expression to see what we mean:


    ```

    1 + (4 * 6 - 5) / 2

    ```


    That expression isn''t as cryptic as it looks. By the end of this chapter, you
    will not only be able to read expressions such this one without being intimidated,
    but you will also be able to write them without much, if any, difficulty.


    In the following sections, you will learn about the operators used in this expression.
    You will also learn that an intimidating expression such as this can be broken
    down into a few smaller, simpler expressions like the expression 1 + 2 we looked
    at before.


    ![](img/b437c18efec65ed938962e8683b6a70c_84_0.png)'
