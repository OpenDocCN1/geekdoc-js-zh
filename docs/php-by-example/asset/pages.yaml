  md: '# Verifying the Username and Password


    # CAUTION


    If you prefer using a password field instead of a text field when your request
    requests a password, that''s great. Using a password field keeps sensitive information
    out of sight from anyone looking over your shoulder just as using POST instead
    of GET eliminates the possibility of someone seeing your information exposed in
    the URL.


    You should be aware of the dangers of using a password field blindly as you are
    of GET. Although passwords are hidden from sight by asterisks (*), it won''t be
    hidden from sight to network sniffers who after your sensitive information. Even
    if you''re using a password field, you have to send it over an SSL or TLS connection
    for the data to be secure in transit.


    As you can see, all we require in a form is that it obtains a username and-password
    from the user. The next section will discuss the actual authentication-program,
    ch14ex01-login.php, which is referenced in this function''s action attribute.


    # Verifying the Username and Password


    After the visitor submits his username and password data to a login script, several
    things typically happen. The most obvious is that the username and password are
    verified. The script then runs based on whether the username and password combination
    is valid. If it is, the script will set session data (which we''ll talk about
    later in the section "User Sessions"), and then send the user to a default first
    page after he is logged in. On the other hand, if his username and password are
    bad, the script sends a page back to the visitor telling him so and perhaps giving
    him a form to try again.


    # Making Sure the Username and Password Are Correct


    As mentioned earlier, to verify a username and password, all we have to do is
    check if the table has a row with a username and password combination that matches
    the one we have. If it finds a row, the username and password are valid; if it
    doesn''t, the username and password are invalid.


    But how do you tell whether MySQL found a row with a matching user-name and password?
    This is done with mysql_query() and MySQL''s COUNT() function.


    # NOTE


    COUNT() is a special function within MySQL that counts the number of rows meeting
    a particular set of criteria, which are specified in the WHERE part of your query'
  merge: -1
