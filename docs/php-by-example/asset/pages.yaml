  md: '# Debugging and Error Handling


    The process of writing PHP programs inherently involves knowing how to debug your
    programs. Debugging is the process of removing bugs (code that doesn''t work as
    intended) from your program.


    Debugging is a process that can be self-taught. You could completely ignore this
    Appendix and you would eventually figure out when your programs don''t work. However,
    it''s much easier to have a guide to follow when you''re getting started. Some
    of the techniques involved in debugging aren''t obvious unless you know how PHP
    works internally, which isn''t something that PHP programmers need to know.


    This Appendix teaches you the following:


    +   * What types of errors can occur that will cause PHP to stop executing your
    program

    * How to interpret and understand error messages

    * How to track variables as your program executes

    * How to use multiple debugging output levels


    # Understanding Error Messages


    To most people, PHP''s error messages seem unnecessarily cryptic at first. Despite
    the initial appearance as such, PHP''s error messages are not worded to keep you
    from understanding them. Instead, they''re wanted to be as clear and simple as
    possible, while still including all of the necessary information you need to fix
    the problem.


    To help you understand the error messages commonly seen in PHP programs, this
    section will introduce you to some of the errors you might see, and explain how
    to go about fixing them. You are encouraged to read these for specific problems
    and suggestions, but more importantly, read them in a general sense so you get
    a good feel for how PHP describes the errors it finds.'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# Appendix A


    # NOTE


    You will also find throughout this section of the terms PHP uses when displaying
    errors. For example, when PHP tells you that a parse error exists, it''s telling
    you that something is fundamentally wrong with the syntax you used or before the
    given line. This is discussed in more detail in the "Correcting Errors" section,
    which follows shortly.


    Error messages have several important pieces of information given with them:


    +   * The type of error (printed in bold at the beginning of the error message)

    * A description of the error that occurred

    * The file and line number where the error occurred


    You will use this information to fix the error.


    # NOTE


    The file and line of the error are significant, especially when your program is
    separated into multiple files. The error message will always display the filename
    and line number for the file where the error actually occurred.


    # Correcting Errors


    The first thing you should do when PHP reports a parse or fatal error is to find
    the place in the program where PHP says the problem is located.


    # NOTE


    In few cases, the line number is not going to be the number of the line you need
    to change. It''s the number on which PHP discovered that problem was keeping it
    from continuing execution.


    For example, if you forget to include a semicolon at the end of a line, PHP won''t
    notice the problem until you get to the next line. If you leave a semicolon of
    an echo statement on line 5, PHP will report an error on line 6.


    ![](img/b437c18efec65ed938962e8683b6a70c_388_0.png)


    After you have located the appropriate line, go back to the error message and
    see what it says. Following are a couple of examples of errors you might see:


    +   * parse error, expecting ''something'' means PHP was expecting something in
    a particular place on that line, but didn''t.


    For example, if you leave a semicolon somewhere, the error will be parse error,
    expecting '''', or '''';'
  merge: -1
  pgno: 388
- img_proc: true
  md: 'With this error message, PHP is trying to say, "Hey, you left this out!"

    Just go back and add the semicolon, and the error goes away.


    +   Call to undefined function and Cannot instantiate non-existent class essentially
    mean that you''ve tried to use a class or function that doesn''t exist.


    For example, the following program will generate a Call to undefined

    function error:


    ```

    <?php

    /* Demonstrates ''Call to undefined function'' error */


    foo(); // call a function that''s not defined


    ?>

    ```


    The error will look like this:


    Fatal error: Call to undefined function: foo() in C:\apache\htdocs\php by

    example\errorrex1.php on line 12


    To fix the error, you will obviously need to declare the function foo()

    so that it does something.


    You will easily encounter a wide variety of errors outside of this list;

    this list is intended as a way to give you an idea of what error mes-

    sages like and how to interpret them.


    For other errors, you can usually take a look at the error message and error

    type and figure out how to fix the problem.


    Following are the two general types of errors that can occur in a program:


    +   Parse errors occur when PHP doesn''t know how to interpret a certain

    line in your program. If you encounter an error parse, look for things

    that should be there but aren''t, or vice versa.


    One common problem causes parse errors is unmatched quotes,

    barenheses, (curly parentheses), and so on. A quote is

    unmatched if the beginning quote is included, but the ending quote

    has left out. (This essentially gives you a string that doesn''t-

    terminate where you want to.)


    Characters or operators that PHP doesn''t understand can also cause

    parse errors. These are errors in syntax as far as PHP is concerned, so they will
    keep your program from running until you fix them.


    +   Fatal errors occur when your syntax is valid (PHP understands what

    y''re saying) PHP simply doesn''t know how to execute your code.

    For example, if you call a function that is not defined, the syntax

    might be completely valid, but because the function isn''t defined, it


    ![](img/b437c18efec65ed938962e8683b6a70c_389_0.png)'
  merge: -1
  pgno: 389
- img_proc: true
  md: 'can''t be called. Because PHP can''t complete the task, the program exits with
    a fatal error.


    Besides undefined functions, fatal errors occur when you try to create an instance
    of a class that is not declared, or when something goes wrong in the execution
    of your program and it simply cant continue.


    # Variable Tracking


    To ensure that important data manipulation parts of your programs are working
    as expected, it''s a good idea to generate some extra output to tell you what
    values of your variables are at certain times. Making the contents of your variables
    visible throughout your program''s runtime is called variable tracking.


    NOTE


    Variable tracking is also integrated into PHP-specific editors, namely PHPED.


    If you don''t decide to use tracking by adding output to your program, you might
    decide to use PHPED''s variable-tracking features instead.


    Basic variable tracking is accomplished by outputting the contents of important
    variables whenever their values are used within the program.


    For example, perhaps you have a function computeWages() that is defined as:

    ```

    function computeWages($dbRate,$dbNormalHours,$dbOvertimeHours)

    /* $dbRate is the dollar amount the employee gets for a normal hour,

    $dbNormalHours is the number of normal hours the employee worked this week,

    $dbOvertimeHours is the number of overtime hours the employee worked this week

    PST: returns the dollar amount the employee has earned for this week as:

    amount = (normal hours * rate) + (overtime hours * rate * 1.5)

    ```


    You don''t need to see the function because it is assumed that you wrote the function
    yourself and you think it works.


    To test the function, you would use variable tracking. Before the function runs,
    you will want to see the values being passed into the function. After the function
    runs, you will want to see its return value to check its accuracy.


    The following program performs variable tracking by outputting the values of important
    variables before and after they are used in function calls:'
  merge: -1
  pgno: 390
