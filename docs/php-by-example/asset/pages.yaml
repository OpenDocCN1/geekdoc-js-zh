  md: '# Chapter 3: Program Input and Output


    Like constants and variables, end identifiers for here-doc strings follow a naming
    convention. Typically, they are uppercase strings with any multiple words separated
    by underscores. The convention itself dictates identifiers can be any combination
    of letters (upper- and lowercase), numbers, and underscores. However, an identifier
    should not contain spaces or begin with a number.


    Notice that here-doc strings are interpreted just as double-quoted strings are:
    replaced with their values and escape sequences (such as \n) still work.


    # NOTE


    Double quotes in here-doc strings can be escaped, but it''t necessary as it is
    in double-quoted string.


    You must place the ending identifier for a here-doc string at the very beginning
    of a new line. This makes here-doc strings more efficient for PHP to interpret
    because PHP only has to look for the end identifier at each new line as opposed
    to every position of line. However, if you forget to place the end identifier
    at the leftmost position on a line, you will find yourself trying to get an error
    message for a line that seems to have nothing wrong with it; fact, it doesn''t.
    Make sure any here-doc statements before it are terminated correctly. Remembering
    this can save you much frustration.


    Take a look at the following code, which directly compares the use of a double-quoted
    string to a here-doc string:


    ```

    <php

    // *ch0ex5.php - compares use of double-quoted string to here-doc *

    // Multi-line double-quoted string

    echo <body bgcolor=\#FFFF" text="000000">

    This is an example!<br>

    Here''s a variable: $variable<br>


    </body>


    // Multi-line here-doc string

    echo <<<END_OF_OUTPUT>

    <body bgcolor="#FFFFFF" text="#000000">

    This is an example!<br>

    Here''s a variable: $variable<br>

    ```


    ![](img/b437c18efec65ed938962e8683b6a70c_68_0.png)'
