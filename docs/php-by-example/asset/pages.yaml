    # Having More Control over Your Cookies


    Now that you''ve set your first cookie, it''s time to take a look at few details
    about how cookies work. Unlike sessions, cookies allow you to set specific attributes
    about when and where your cookie should be passed to a server.


    As you probably guessed from setcookie()''s parameter list, you specify when and
    where a certain cookie is available by assigning values to the optional attributes.
    To refresh your memory, these attributes are as follows:


    +   * Expiration time stamp

    * Path

    * Domain

    * Require a secure connection


    By setting these options, you restrict when your cookies are visible to your scripts.
    (It just so happens that some of these—such as the path and domain—will keep other
    sites from being able to access your cookie values, as well.)


    # The Lifetime of a Cookie


    One of the nice features of cookies is that you can set a cookie for more time
    than just one session. For example, if a user visits your site, he can check a'
