- img_proc: true
  md: '# Chapter 13: Creating Dynamic Content with PHP and a MySQL Database


    # TIP


    The command line we talked about is an expanded version intended to make things
    clear to a novice user. It can, in fact, be shortened to a quicker, simpler version
    that follows this syntax:


    ```

    mysql -username -p database

    ```


    Notice that the -u switch and the username are run together; this can be confusing
    if you''re used to --option=value style switches, but it''s the way MySQL works.


    Also note the use of dashes with each type of switch: The long form (like --username)
    uses two dashes, but the short form (like -u) uses one.


    As always, you can choose the expanded or the short version of the command-line
    switches; in the end, it makes no difference to mysql. It''s simply a matter of
    convenience.


    # CAUTION


    If you execute mysql -help from your command line, you''re liable to see that
    mysql accepts a password on the command line just as it accepts the username.
    This might seem convenient, but it is less secure in two ways.


    In first, any environment, someone looking over your shoulder could easily read
    your username and password and possibly have more access than he should.


    In addition, in Unix-based environments, the data entered on the command line
    can be viewed as long as the program is running. This could lead to exposure and
    unauthorized use of your password.


    For these reasons, use of the --password=password form of the password switch
    is highly discouraged. You should always specify -p, which will cause mysql to
    prompt you for this password in a more secure fashion.


    Typically, the mysql command-line utility is used for creating and administering
    your database. The mysql_query() function in PHP is used to perform more routine
    tasks, such as retrieving information to display on a Web site or inserting new
    information into the database as it becomes available (such as when a visitor
    enters it).


    Therefore, while we''re talking about the CREATE TABLE command, it''s advisable
    that you use the command-line utility.


    # TIP


    At some point, you will probably discover that you need to change something about
    a table you''ve already created. Even though you have to declare the data types
    for your table when you create it, the creators of MySQL have included a command
    to allow you some leverage if your plans didn''t quite work as expected. The ALTER
    TABLE command, which we''ll discuss later in this chapter, to redefine your table
    if you ever need to.'
