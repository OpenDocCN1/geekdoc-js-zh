  md: '# # Dedication


    *For Mom and Dad. Thanks.*


    # # Acknowledgments


    The people at Que are the ones who really made this book come together. Jenny
    Watson helped keep me on schedule and did a great job of prodding me when I wasn''t
    (which was most of the time). Sean Dixon helped by reading over my original chapters
    and helping me make things more understandable. He also did an excellent job of
    speaking out from a reader''s perspective to ensure things make sense to novices
    and experts alike. Bob Grieger also read over each and every chapter, checking
    for inaccuracies and mistakes in all of my code and text. He helped to correct
    a few problems; without him, this book would have several very confusing areas.
    I know there are other people at Que who are part of the process that I haven''t
    mentioned. Everyone at Que has been very responsive to my needs; they''ve been
    a great pleasure to work with. Thanks for making this process enjoyable and so
    helpful along the way.


    My gratitude also goes to my family, who has done a great job of supporting me
    through this process. They''ve endured all my long nights, and (sadly enough)
    won''t be seeing to of my zombie-like-just-finished-a-chapter state anymore. (I''m
    sure they''ll get over it!) My family has also offered lots of encouragement when
    the chapter I was working on didn''t seem to go anywhere forever; eventually I
    always finished it, but their gentle push was a lot of help.


    Thanks to Paul and Darby Luce, Jane Butzon, Cory Butzon, and all my other friends
    and family. The book is finally finished!'
