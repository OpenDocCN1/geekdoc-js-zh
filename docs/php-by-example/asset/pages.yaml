  md: "# Chapter 11: Classes and Objects\n\n# TIP\n\nHere, we define the dog class\
    \ first. This isn't completely necessary, as long as the definition appears somewhere\
    \ within the code being executed. The dog class appears at the top here, but the\
    \ definition can be moved to the bottom or even separate to include files, which\
    \ will be discussed in Chapter 12, \"Using Files.\"\n\n# CAUTION\n\nThe class\
    \ you are trying to instantiate must exist somewhere within the program. If the\
    \ class is not defined, PHP will die with the fatal error: Cannot instantiate\
    \ non-existent class.\n\n# Example: Creating a bank Account Class\n\nTo demonstrate\
    \ the use of a class, let's create one to model a bank account. A bank account\
    \ has certain information associated with it, such as its account number, the\
    \ PIN number needed to access it, and its balance. The information could be stored\
    \ in a class's member variables.\n\nHere's the class declaration with the member\
    \ variables declared:\n\n```\nclass bank_account {\n    var $Number, // (string)\
    \ Account Number (xxx-xxxx-xxxx)\n    $PIN, // (int) PIN Number (xxxx)\n    $Balance;\
    \ // (double) Balance (xxxx.xx)\n}\n```\n\n![](img/b437c18efec65ed938962e8683b6a70c_232_0.png)\n\
    \nNow we have a basic definition of the bank account has associated with it. We\
    \ need to define functions to work with this data. For starters, we'll need Withdraw()\
    \ and Deposit() functions to handle these basic tasks of banking.\n\nThese functions\
    \ will be changing the value of certain member variables within the class. So\
    \ we must use the $this object.\n\n# $this Object\n\n$this is used to access the\
    \ contents of an object from within its own member functions. To modify a variable\
    \ from within a member function definition, you use $this->variable_name, where\
    \ variable_name is one of the class's member variables."
