    # Using Forms


    Although creating HTML forms isn''t technically a part of PHP; it is definitely
    a part of learning PHP. Since forms are just the only way for your program to
    collect information from the user, you must use the form elements allowed by HTML
    to construct the most intuitive form possible.


    # TIP


    The intuitiveness of a form is the overall effectiveness it has for the user.
    For example, using a single-line text input where the user will probably be entering
    a large amount of text makes it difficult for the user to read and edit what he''s
    typing. In that case, it would be more effective to use a textarea.


    The various form-input types will be discussed to help you create the most intuitive
    forms, which in turn your visitors experience more pleasing.


    Form inputs allow the user to enter text and make selections. For example, if
    you wish to ask a user for his name, a simple text input is follows this syntax:


    ```

    <input type="text" name="field_name" value="default_value">

    ```


    The value attribute is optional; in most cases, it would be blank. However, if
    you wish to suggest a value for the user''s input, you can include the value="default_value"
    attribute and the value will appear in the field.


    ![](img/b437c18efec65ed938962e8683b6a70c_77_0.png)


    For example, to suggest a default value using a variable you already have (such
    as one that was entered from a previous form), you can specify the value attribute
    by outputting the variable''s value with short tags, like so:


    ```

    <?php

    // ch0ex16.php - default value example /


    // Assume $user_name can come from a previous form submission;

    // it''s specified here for clarity.

    $user_name = ''John Doe'';",

    ```


    EXAMPLE'
