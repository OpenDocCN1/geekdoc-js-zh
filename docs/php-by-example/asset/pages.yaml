- img_proc: true
  md: "# Introducing the switch Statement\n\nFor example, let's say you want to tell\
    \ a user whether the color he picks is a cool color or a warm color. Let's also\
    \ assume the color has been chosen from a list box or similar input, so you know\
    \ the color will be one of the following: red, orange, yellow, green, blue, or\
    \ violet. (The first three are warm colors, and the latter are cool colors.)\n\
    \nThis could be done using if statement, as shown:\n\n![](img/b437c18efec65ed938962e8683b6a70c_157_0.png)\n\
    \n```\nphp\n/* $ch0ex6.php - color choices using statement */\n// $StColor would\
    \ typically come from input; we'll assign it explicitly\n// here for demonstration\
    \ purposes.\n$StColor = 'Blue';\n\n// Decide if color is warm or cool\nif ($StColor\
    \ == 'Red' || $StColor == 'Orange' || $StColor == 'Yellow') {\n    echo \"$StColor\
    \ is a warm color\";\n} else {\n    echo \"$StColor is a cool color\";\n}\n?>\n\
    ```\n\nThe output of this program would be:\n\nBlue is a cool color\n\nThis is\
    \ correct; the code works fine. However, you're only comparing for equality to\
    \ a number of different possibilities. You know from previous discussion that\
    \ this comparison could be done with a switch statement; you also know that switch\
    \ would be better style and make the program slightly faster.\n\nTo express this\
    \ in switch, you specify several conditions for warm colors so that one task (outputting\
    \ \"color warm\") is completed for the set of warm colors. Then, after a break\
    \ to end the code for warm colors, the second set of colors (the cool colors)\
    \ can be assumed using the default statement.\n\n# TIP\n\nThe default statement,\
    \ in case, could be left out and replaced by the remaining three cases, since\
    \ you know what the possible values could be. Alternatively, you could specify\
    \ both sets of cases and keep the default case to detect bad input and return\
    \ an error message.\n\nFor now, you're not going to worry about bad input since\
    \ the value is hard-coded."
  merge: -1
  pgno: 157
- img_proc: true
  md: "# Chapter 7: The switch Statement\n\nThe following code performs the same task,\
    \ but is favored over an if-else clause:\n\n```\n<?php\n/* /ch7ex0.php - color\
    \ choices using if statement */\n// $StColor would typically come from input;\
    \ we'll assign it explicitly\n// here for demonstration purposes.\n$StColor =\
    \ 'Blue';\n\nDecide if color is warm or cool\nswitch ($StColor) {\n    // warm\
    \ colors\n    case 'Red':\n    case 'Orange':\n    case 'Yellow':\n        echo\
    \ \"$StColor is a warm color\";\n        break;\n\n    // cool colors\n    default:\n\
    \        echo \"$StColor is a cool color\";\n        break;\n}\n?\n```\n\nThe\
    \ output of this code is the same as that for the code above it. It is:\nBlue\
    \ is a cool color\n\nNotice how multiple cases are specified for the first echo\
    \ statement. Again, this works because the break doesn't appear until after the\
    \ echo statement. If any of the first three cases match, the echo statement will\
    \ be executed.\n\n> TIP\nThis shows that, although it can be an inconvenience\
    \ to have to type breaks every case code, being to leave out breaks is very useful.\
    \ If the code is very long, repetition of the same code for multiple conditions\
    \ could be confusing. Also, modifying multiple sections of code that are supposed\
    \ to be the same can be very tedious.\n\n# Multunction Pages\n\nUsing switch,\
    \ the input and processing tasks of a program, which would typically be stored\
    \ in separate files, can be combined into a single file. This"
