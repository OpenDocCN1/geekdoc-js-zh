  md: '# Chapter 13: Creating Dynamic Content with PHP and a MySQL Database


    At the time of this writing, MySQL has 25 data types. Most variations

    on the numeric and string types, but some have been added to store such

    things as dates and even files. We''ll cover four basic types: INT, DOUBLE,

    TEXT, and TIMESTAMP.


    # TIP


    The other data types should be easy to understand after you have mastered the
    basic\ones. Remember that you can find information about MySQL''s data types in
    the MySQL

    manual at www.mysql.com.


    # MySQL''s INT TYPE


    The INT data is comparable to PHP''s int type. It stores integers (hence

    the INT). (If you supply a decimal number for an INT field, the deci-

    portal of the value—that is, the part after the decimal point—will be

    discarded.


    An INT column can be declared as follows:


    ```

    column_name INT [UNSIGNED] [NOT NULL] [DEFAULT default] [AUTO_INCREMENT] [PRIMARY\KEY]

    ```


    # NOTE


    For practicality''s sake, not all the available options are given here. Specifically,
    the

    ZEROFILL option has been omitted.


    The other types have their options narrowed for the same reason. As always, if

    you''re learning to learn more about these types, you can visit www.mysql.com.


    The syntax for creating an INT column might look a little intimidating, but

    it is not as bad as it looks. In addition, all of these options give you flexibil-

    ty''ll appreciate after you understand everything.


    Here, column_name, of course, is the name of the column you want to declare

    the table. The INT is the basic type of the column, because that''s what we''re

    discussing right now.


    The UNSIGNED option essentially gives you room for bigger values, but at

    same time stops you from putting a negative value in the column. To keep things
    simple,

    t explanation of this is beyond the scope of this book. A signed INT value can
    be any number from –2,147,483,648 to

    +2,147,483,647. Of course, this is a wide enough range in many applic-

    t, but if you need to, you can add the UNSIGNED modifier, which

    increases the upper end of the range, while eliminating the entire negative\portion
    of the range. Thus, a value in an INT UNSIGNED column can range

    from 0 to +4,294,967,295.'
