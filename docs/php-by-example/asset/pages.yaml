  md: '# Writing A Full Program


    Following is the file and directory structure of all the files in the guestbook
    program:

    guestbook/

    admin/

    delete.php

    index.php

    inc/

    common.inc.php

    configure.inc.php

    footer.inc.php

    header.inc.php

    index.php

    post.php


    ![](img/b437c18efec65ed938962e8683b6a70c_369_0.png)


    As you can see, tasks are separated into different files to make the program clear
    and understandable. Each file within the program is concise and only performs
    a specific task (or a few related tasks).


    The two subdirectories—admin/ and inc/—are not at all uncommon. Both keep files
    that perform routinely needed tasks.


    > TIP

    / contains administration scripts, whereas inc/ include files.


    > NOTE

    Although it''s common to have admin/ and inc/ directories, the files within them
    and exactly what those files perform are obviously dependent on the program. The
    files within these directories are still specific to the program for which they
    are written.


    Each subdirectory separates files based on their purpose. The admin/ directory
    contains files that are for administrators only. The admin/index.php program allows
    admins to log in, whereas admin/delete.php performs deletes for admins who are
    logged in.


    COMMON include FILES

    The/ directory contains very important files. These files are used by all of the
    other files in the guestbook program; they form a common segment of code that
    is needed by every script in the guestbook system.


    The header and footer files, for example, are used to make every page in the program
    look and feel the same. They contain HTML code that appears at the top and bottom
    of every page within the guestbook system.'
