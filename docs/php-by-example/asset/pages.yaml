  md: 'As you see, get requests are handled precisely as those as made with forms.
    You can also change the question file so that the answer is collected using a
    form instead of a link. Try this for practice.


    Now that you know about forms, let''s take a look at the other method. Post forms
    are used for larger amounts of data (such as detailed user information, e-messages,
    or file uploads) and data that should not be visible in the browser''s address
    bar (such as passwords). An example of data being clearly visible in the browser''s
    Address bar is given in Figure 3.3.


    ![](img/b437c18efec65ed938962e8683b6a70c_75_0.png)


    > Figure 3.3: Sensitive information in a request may be revealed in a browser''s
    address bar.


    Let''s try a practice problem. Yahoo!, Hotmail, and excite all private services
    require a username and password. To verify that a user is really the user he claims
    to be, services such as these must check that the login name and password are
    valid. For now, we''ll just focus on collecting the data. The process of actually
    verifying the information is a separate concept, which will be discussed at various
    times in this book, particularly in Chapter 6, “The if, elseif, and else Statements,”
    and Chapter 13, “Creating Dynamic Content with PHP and a MySQL Database,” when
    we discuss it with statements and using databases.


    The program will have two files: one to request the user''s username and password
    and second to retrieve that data.


    The first file will contain a form that has its method set to post. If we don''t
    set the method attribute, the username and password will be left out in the open
    of the user''s address bar, which is considered to be a security risk. Anybody
    that happens to walk by the visitor''s computer can see the password in the browser''s
    Location or Address bar. Figure 3.3, shown previously, shows this vulnerability.'
