  md: "# Passing Values to and Functions\n\nSo if you intend to change the value of\
    \ an outside variable? You have two options: Either pass the variable in as a\
    \ referenced parameter (which you'll get to a little later in this chapter), or\
    \ use the $GLOBALS array.\n\nGlobal variables are variables that exist in the\
    \ global scope (outside functions). The $temp variable shown earlier that contains\
    \ 5 is a global variable. To modify it from within the function, you would use\
    \ the $GLOBALS array as follows:\n\n```\nfunction something() {\n  $GLOBALS{'temp'}\
    \ = 0;\n}\n```\n\nNow, if your program did something like this:\n\n```\n$temp\
    \ = 5;\ndoingSomething();\necho $temp;\n```\n\nThe output will be 0, as the global\
    \ variable $temp, which was local to the previous program a variable something()\
    \ function, was changed (leaving the global unchanged).\n\n> TIP\nIt's not recommended\
    \ that you change a global variable within a function. In a large program, such\
    \ behavior becomes very hard to follow because the programmer must read each and\
    \ every function called to follow a program's flow of execution and know exactly\
    \ what's going on with a particular variable. This leads to extremely buggy programs\
    \ and frustrating hours of debugging.\n\nInstead, the $GLOBALS array is provided\
    \ to let you (and not modify) the variables outside the function. If you need\
    \ to change one of those values, pass it into the function as a referenced argument\
    \ (which you'll see a little later in this chapter) or assign it a function's\
    \ return value.\n\n# Passing Values to and from Functions\n\nNow that you understand\
    \ how functions work and how to create a basic function, let's discuss that parameter\
    \ list you've been using until now.\n\nThe parameter list allows the function\
    \ to accept values into local variables that exist only within the function to\
    \ perform a task depending on the values of the variables. By supplying such values\
    \ (known as parameters, as you'll soon learn) in a function call, you're passing\
    \ these values to the function."
  merge: -1
  pgno: 205
- img_proc: true
  md: "# Parameters\n\nThe values specified in the function's definition are known\
    \ as the function's parameters. When the function is called, the values given\
    \ as parameters are often referred to as the function's arguments.\n\nThe following\
    \ program uses a function that takes three parameters: $strName, $intAge, and\
    \ $intGender. Calling the function outputs the three parameters in a human-readable\
    \ sentence.\n\nHere it is:\n\n```\n<?php\n/* chex02.php - demonstrates user-defined\
    \ outputSentence() function */\n\n/* MAIN PROGRAM *//\n\noutputSentence('Kathy\
    \ Williams', 43, 'female');\n\n/* FUNCTION DECLARATIONS *//\n\nfunction outputSentence($strName,\
    \ $intAge, $strGender)\n/* PRE: $strName is a string,\n$intAge is an integer greater\
    \ than 0,\n$strGender is a string containing 'male' or 'female'\nPST: Outputs\
    \ a sentence. */\n{\n    echo \"$strName is a $intAge-year old $strGender\";\n\
    }>\n```\n\nThe outputSentence() function's parameter list is illustrated in Figure\
    \ 10.2.\n\n![](img/b437c18efec65ed938962e8683b6a70c_206_0.png)\n\nFigure 10.2:\
    \ This function takes three parameters in its parameter list."
  merge: -1
