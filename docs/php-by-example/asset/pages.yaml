    # CHARACTER ESCAPING


    Some characters, such as the dollar sign, have special meaning within strings.
    In addition, sometimes you need to include quotes within your strings, which would
    typically signal the end of the string.


    To avoid this, we use character escaping, which tells PHP to interpret a character
    as a literal part of the string instead of a special character (one that signal
    a variable or the end of a string).


    To escape a character, precede it with a backslash, like this:

