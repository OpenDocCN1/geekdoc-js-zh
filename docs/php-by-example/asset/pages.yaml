    \ below it. It may but may not, either. If the code block below the loop grow\
    \ in complexity, it could take a few minutes of time wasted on such a trivial\
    \ discovery should be avoided, possible.\n\nAnother problem with the end of the\
    \ code block here is the addition of the $i++ unfamiliar programmer won't know\
    \ right away whether this will have an effect on the number of times the loop\
    \ executes; if the variable $i is simply used within the loop somewhere; it may\
    \ be either, or in this case both.\n\nSo, although while is for some occasions,\
    \ for can make your job of programming earlier and clearer. After you've finished\
    \ reading this chapter, using for while will become as much as an integral part\
    \ of your programming practices using while.\n\n# Syntax\n\nThe loop gives you\
    \ a way to clarify exactly what you're doing with a loop. Whereas, the initialization\
    \ of $i above was somewhat ambiguous in"
