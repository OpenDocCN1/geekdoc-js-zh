- img_proc: true
  md: "# Introducing the switch Statement\n\n```\n// Specify age group\n$ChrAgeGroup\
    \ = 'B';\n```\n\n// Output user-friendly representation of age group\nswitch ($ChrAgeGroup)\n\
    \n```\ncase 'A': // Group A: 20 and younger\n    echo \"Ages 20 and younger\"\
    ;\n    break;\ncase 'B': // Group B: 21 - 40\n    echo \"Ages 21 to 40\";\n  \
    \  break;\ncase 'C': // Group C: 41 - 60\n    echo \"Ages 41 to 60\";\n    break;\n\
    case 'D': // Group D: 61 and older\n    echo \"Ages 61 and older\";\n    break;\n\
    default: // Error checking\n    echo \"Error: unrecognized age group $ChrAgeGroup\"\
    ;\n    break;\n```\n\nUsing this code, if the age group isn't A, B, C, or D, an\
