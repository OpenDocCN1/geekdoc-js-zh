    ```\n\nMaking the assignment an assignment by reference, like this:\n\n```\n$objSomeObject\
    \ = &$thisReturnsALargeObject();\n```\n\nand making the function return a referenced\
    \ return value (you'll see soon) avoiding copying the return value to the variable.\
    \ The result is that only a single copy of the object is ever created; otherwise,\
