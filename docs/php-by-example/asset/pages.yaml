  md: "# Chapter 6: The if, elseif, and else Statements\n\n```\n// If the form has\
    \ been submitted\nif ($intAge) // will be true if it's been submitted (can't be\
    \ 0)\n{\n\n// Assign age group to $shrAgeGroup\nif ($intAge < 21) // Ages 20 and\
    \ younger\n{\n    $shrAgeGroup = 'A';\n} elseif ($intAge < 41) { // Ages 21 -\
    \ 40\n    $shrAgeGroup = 'B';\n} elseif ($intAge < 61) { // Ages 41 - 60\n   \
    \ $shrAgeGroup = 'C';\n} else {\n    $shrAgeGroup = 'D';\n}\n\n// Show age group\
    \ chosen\necho \"Age $intAge into age group $shrAgeGroup\";\n\n?>\n<!-- Here's\
    \ the HTML form we get input from -->\n<form action=\"ch0x65.php\" method=\"submit\"\
    >\nAge: <input type=\"text\" name=\"age\"><input type=\"submit\">\n</form>\n```\n\
    \nHere are some samples of the program's output:\n\n+   - Age 14 into age group\
    \ A\n- Age 37 into age group B\n- Age 99 into age group D\n\nNOTE\n\nNotice the\
    \ difference between an if-else clause and multiple statements. If multiple statements\
    \ were used and the age were, say, 20, not only would be true ('A' to $shrAgeGroup),\
    \ but the two conditions following it would be true because 20 is less than 41\
    \ and 20 is less than 61. Thus, only the last value, 'C', would be assigned to\
    \ $shrAgeGroup, and the age group assigned would be incorrect.\n\nYou can nest\
    \ statements: that is, you can include one or if statements within the statements\
    \ surrounded by another statement. Thus, you can check one condition, and if it\
    \ true, you can check another condition and perform different actions depending\
    \ on the inner condition. (The inner statement, in effect, is evaluated only if\
    \ the outer one is true)."
