  md: '# Running Your New Program


    +   - The PHP code appears directly in the browser.

    - A “404 File Not Found” or a “CGI Error—The specified CGI application misbehaved
    by not returning a complete set of HTTP headers” message appears.

    - A “Parse error” message appears.


    # A Save As Dialog Box Appears


    If this occurs, PHP is not installed correctly or the file is misnamed. It occurs
    because the Web server doesn’t recognize the file as a PHP file, but rather as
    an unknown file type (Zip files, for example) are to be downloaded and not processed,
    the server is sending the file just as it is to be downloaded by the browser.
    This surely isn''t the behavior.


    To fix this, first check to make sure you named your file a .php extension. If
    you didn''t, rename it with the rename command in your FTP client. If you chose
    to rename the copy to your local drive, make sure you transfer the file to the
    server. Try accessing the page again and see if the problem is solved; if not,
    repeat the process with .php3, .php4, and .html.


    It is very possible that none of those will work. In case, the problem is most
    likely that your Web server doesn’t have PHP installed or is configured incorrectly.
    Get in touch with the server administrator to find out if PHP is installed, and
    if so, what the correct extension is. If the extension is one you''ve already
    tried, explain to the administrators the extension isn''t working and see if they
    can help you find out.


    If you are your server administrator, you may need help with checking your configuration;
    first check the PHP manual (http://www.php.net/manual/). If you still have trouble,
    you may find help on the PHP installation mailing list. Send an email to php-installlists.php.net
    including information about your server such as operating system, Web server,
    and the version of PHP you’re trying to install. The list members will be happy
    to help.


    # The PHP Code Doesn’t Appear to Have Executed


    If this is the case, you will see only the parts of the page that were outside
    of the PHP tags. Specifically, you will see “Hello,” printed on the page, and
    “World!” will be missing. If you use your browser’s View source code, you will
    notice that the PHP code appears in your HTML source just like it did in your
    editor. This means that the file was returned just like a normal HTML file (without
    any server-side processing).'
