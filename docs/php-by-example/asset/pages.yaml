- img_proc: true
  md: '# What''s Next


    On Unix-based systems, the entry will end up looking like this:

    include_path = ".//www/lib/*",


    Similarly, on Windows, it will look like this:

    include_Path = ".C:\InetPub\lib*",


    +   4. Save and close the configuration file. You might want to check that your
    settings were made successfully by calling phpinfo() from a program on your server.
    You should see the path you entered for the include_path listed on that page.


    Then, no matter where your program is on the server in relationship to the library
    directory, you can simply include a file like this:

    include(''library.php'');


    The file will be located automatically, and if found in the include directory,
    it will be included as desired.


    # What''s Next


    Now that you''ve learned about includes, you''ve completed the section on program
    organization. You now know how to organize your programs into functions, classes,
    and include files successfully so that your program will be clear, easy to follow,
    and most importantly, easy to maintain. At this point, you''ve essentially learned
    to program in PHP.


    In the next section, we''ll look at some additional features PHP has to offer
    to make your Web programs more exciting. So many modules have been added to PHP
    to give it special features such as that they couldn''t possibly be covered in
    much detail in one book. However, of these features, the most-often desired will
    be give you some ideas of where your programs can go from here. Get ready to add
    features to your Web sites that many people want, but few know how to create.'
