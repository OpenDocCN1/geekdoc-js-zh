    echo '<br>';\n\n$db1TotalEarnings = computeWages($db1Rate, $db1NormalHours, $db1OvertimeHours);\n\
    \n// More variable tracking\necho 'Here are the important variables after calling\
    \ computeWages():<br>';\necho ' $db1Rate = $db1Rate<br>';\necho ' $db1NormalHours\
    \ = $db1NormalHours<br>';\necho ' $db1OvertimeHours = $db1OvertimeHours<br>';\n\
    echo ' $db1TotalEarnings = $db1TotalEarnings<br>';\necho '<br>';\n\n// computeWages\
    \ definition:\nfunction computeWages($db1Rate, $db1NormalHours, $db1OvertimeHours)\n\
    /* PRE: $db1Rate is the dollar amount the employee gets paid for a normal hour,\n\
