  md: "# What Are Classes and Objects?\n\nThis is where constructor function comes\
    \ in. PHP executes a constructor function whenever an object of a class is instantiated.\
    \ A class might or might not have a constructor function, but if it does, it must\
    \ have the same name as the class; PHP uses the name to determine whether it should\
    \ execute the function as a constructor.\n\nThe constructor function is the reason\
    \ behind the parameter list (noted previously) that might follow the class name\
    \ when an object is created. For example, the following are all valid:\n\n```\n\
    $objAccount = new bank_account;\n$objAccount = new bank_account();\n$objAccount\
    \ = new bank_account(45.00);\n```\n\nThe first two are both essentially the same:\
    \ No parameters are specified, so if a constructor were being executed, it must\
    \ not require parameters. The last one, passes 45 as its argument.\n\nAs the bank\
    \ account class is defined so far, this parameter would simply be ignored. However,\
    \ we could define a constructor function to add to the class to make the bank\
    \ account set its balance to value.\n\nHere's what the class definition looks\
    \ like after this addition:\n\n![](img/b437c18efec65ed938962e8683b6a70c_237_0.png)\n\
    \n```\nclass bank_account {\n    var $Number, // (string) Account Number (xxx-xxxx-xxxx)\n\
    \    $PIN, // (int) PIN Number (xxxx)\n    $Balance; // (double) Balance (xxxx.xx)\n\
    \n    function bank_account($dblBalance = 0) {\n        $this->Balance = $dblBalance;\n\
    \    }\n\n    function Deposit($dblAmount) {\n        $this->Balance += $dblAmount;\n\
    \    }\n\n    function Withdraw($dblAmount) {\n        $this->Balance -= $dblAmount;\n\
    \    }\n}\n```\n\nNotice how the constructor function has the same name as its\
    \ class. This class tells PHP that it is the constructor function."
