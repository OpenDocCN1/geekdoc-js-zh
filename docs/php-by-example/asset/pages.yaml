  md: '# Chapter 13: Creating Dynamic Content with PHP and a MySQL Database


    Now that template can be filled in with the data from Table 13.1. In this instance,
    let''s say we used data in the bottom row. The resulting page is shown in Figure
    13.2.


    ![](img/b437c18efec65ed938962e8683b6a70c_278_0.png)


    Figure 13.2: The template page is filled in with data from the table.


    The format of the template page and the information from the table combine quite
    easy to show the information in an organized fashion.


    So creating a template page suitable for any book, and by isolating the actual
    information we plan to display from it, we have freed ourselves from the tremendous
    task of creating a new page for each book we want to display. That''s the main
    idea behind database-driven content.


    A MySQL database is an excellent solution when creating a database-driven web
    site. It''s fast, stable, and, like PHP, free.


    Now we have several topics to discuss about creating a database-driven web site.
    First, we need to look at the process of designing and creating a database in
    MySQL. Then we''ll get into how to connect and use that database within a program,
    as well as learn the commands that MySQL recognizes for retrieving data.


    # Designing and Creating a Table in MySQL


    When we''re storing information in a database, you first need to create a table
    that has a column for each piece of information that needs to be stored. For example,
    in the previous scenario, we were storing information about books. Thus, each
    book had a title, an author, and an ISBN number, as well as an ID number, which
    is generally used in program-database interaction only.'
