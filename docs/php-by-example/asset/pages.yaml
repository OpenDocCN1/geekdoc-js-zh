    \ parts have important purposes within the loop.\n\nNOTE\n\nYou will read in this\
    \ chapter that for some definite similarities to while. It is touched upon here,\
    \ but will be discussed in more detail in the following section.\n\nLook at this\
    \ loop:\n\n```\n$i = 1;\nwhile ($i <= 10) {\n  echo $i . '<br>';\n  $i++;\n}\n\
    ```\n\n![](img/b437c18efec65ed938962e8683b6a70c_184_0.png)\n\nThis loop echoes\
    \ a list of numbers from 1 to 10. However, it's bulky—six lines of code to print\
    \ a list of numbers. In addition, the loop above isn't very easy to read.\n\n\
    If these lines of code were found among many others, a programmer might find himself\
