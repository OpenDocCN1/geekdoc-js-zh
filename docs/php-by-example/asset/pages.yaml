    # Function and Variable Scope Between Include Files


    When a file is included in a program, its contents are inserted into a temporary
    copy of the program in the computer''s memory while it is evaluated. This is basically
    an imaginary copy of the program—it exists only while the program is being evaluated
    and it disappears as soon as the program terminates. Figure 12.1 shows how all
    the files included in a main program become part of an imaginary, consolidated
    main program.


    One common misunderstanding of include files is that they have a separate variable
    or function scope; that is, variables and functions declared in one include file
    will not be available or will not interfere with variables of the same name within
    another file. However, this is not true.


    Figure 12.1 is intended to clarify this concept; you can imagine that the files
    are evaluated as one conglomerate file. Any functions or variables be available
    to other files just as if they were all one program.'
