  md: '# Chapter 2: Variables and Constants


    being arrays themselves. For example, if five people are involved in a task, their
    names could be stored in a five-element array, with one for each person. The people
    on the task, represented collectively by the array, would have their information
    stored in separate variables within the array.


    # ARRAY INDEXING


    The names could then be retrieved using array indexing—adding a subscript (or
    location within the array) to the end of an array''s name to retrieve the value
    of that element. (An element is a single variable contained within an array.)


    The following example demonstrates the construction of an array containing five
    names, printing each name on a separate line:


    ![](img/b437c18efec65ed938962e8683b6a70c_50_0.png)


    ```

    <?php

    /* checho03.php - demonstration of arrays */


    namesArray = Array(''Bob'', ''Sarah'', ''Bill'', ''Suzy'');


    echo "$namesArray[0]<br";

    echo "$namesArray[1]<br";

    echo "$namesArray[2]<br";

    echo "$namesArray[3]<br";

    echo "$namesArray[4]<br";


    ?>

    ```


    EXAMPLE


    # NOTE


    The <br> tags are given here to separate each element of the array on a separate
    line.


    It is important to notice that the first element of an array is given by the subscript
    0 and not 1. While this may seem awkward, it is fairly common in programming languages
    because of the way arrays are handled in memory.


    # TIP


    Why is the index of an array 0? In many languages, namely C (because most of the
    other languages that it are based off C), there''s a very good reason. An array
    would be an area of memory when it was created, and in that area of memory, the
    elements are stored in order. The array only contains the address of the first
    element of the array. Thus, the index given would be the offset from the address;
    that is, the index shows how many positions to move ahead in memory.


    So, the first element of the array would be indexed at its address plus , the
    second would be indexed at the address of the first plus 1, and so on. This behavior
    has its way into most of today''s languages.'
