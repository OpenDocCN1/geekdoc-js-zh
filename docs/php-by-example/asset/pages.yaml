    # Compound Operators


    The results of operations aren''t always outputted as the previous examples show—sometimes
    the result is to be stored in a variable. That''s not too difficult based on the
    examples you have seen. However, there are times when it''s necessary to change
    a variable somehow—for instance, you might want to double something or subtract
    from something, keeping the result in the variable itself.


    The operators designed to do this are called compound operators. Without compound
    operators, you would have to type the variable name twice—once for the left portion
    of the assignment and again in the operation itself.'
