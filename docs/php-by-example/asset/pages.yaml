    +   * Feedback forms

    * Shopping carts and other types of e-commerce sites

    * User registration, access control, and management for online subscription services

    * Discussion and message boards


    # If You''re New to Programming...


    If you''ve never written a computer program before, the whole idea may be quite
    intimidating. Most programmers will tell you (if they aren''t embarrassed to admit
    it) that they were intimidated when they began. However, the programming process
    isn''t all that difficult, and contrary to popular belief, you don''t have to
    have an extremely high IQ to be good at it.


    When you write a program, your main goal is to translate your idea into a language
    that the computer can understand. For example, if you were teaching a person how
    to cook burgers, you would first describe the process of forming the ground beef
    into patties. Then, you would tell the person how to put the burgers on the grill,
    how long to leave them there, and finally to remove them.


    Of course, just because you can describe the process of making hamburgers doesn''t
    mean PHP is going to be cooking anything for anyone soon. The point is, if you
    can describe a process like I just described hamburgers, you can write a program.


    Writing a PHP program is simply the process of describing PHP to do something.
    By the time you''ve finished reading this book, you will understand all the concepts
    behind writing a PHP program. Those concepts are like the words and sentences
    used to describe hamburgers. The more you read this book, the more “words” you
    will understand, and the better you will be able to “describe” your task to PHP.
    Thus, you will learn to'
