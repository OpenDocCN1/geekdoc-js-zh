    # The break and exit Statements


    You might have seen the break and exit statements, but until now you''ve only
    been momentarily introduced to them. They are similar, yet each has its own purpose.


    # Breaking Loop Execution


    The break statement is used to terminate a looping construct, as while or do-while.
    break also works with for and foreach, which you will be introduced to in the
    following chapters. Figure 8.4 illustrates use of the break statement.


    ![](img/b437c18efec65ed938962e8683b6a70c_178_0.png)


    **Figure 8.4:** The break statement causes a looping structure to be terminated.'
