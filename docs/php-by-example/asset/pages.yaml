  md: '# Basic Arithmetic


    The following Table 4.1 summarizes PHP arithmetic operators. For now, glance over
    them and continue reading. You don''t need to try to memorize them—you will have
    plenty of time to memorize them individually as they are explained. If you need
    to come back later to refresh your memory, this table may be a good place to start.


    # Table 4.1: PHP''s Arithmetic Operators Perform Mathematical Tasks


    | Operator | Operation Name | Example |

    | --- | --- | --- |

    | + (Unary) | Positive | +5 |

    | - (Unary) | Negative | -5 |

    | + | Plus | 5 + 5 |

    | - | Minus | 5 - 5 |

    | * | Multiply | 5 * 5 |

    | / | Divide | 5 / 5 |

    | % | Modulus/Remainder | 5 % 5 |


    The sections that follow will discuss the operators used within expressions one
    by one. Each section will leave you with a clear understanding of what exactly
    each operator does along with how to use it.


    # Positive and Negative Numbers


    While of your calculations will probably involve only positive numbers, you are
    sure to encounter negative numbers at some time or another. Negative numbers really
    don''t have anything special about them. They behave just as they should mathematically,
    and they have a negative sign preceding them when outputted.


    ![](img/b437c18efec65ed938962e8683b6a70c_85_0.png)


    To specify that a number is negative, you must place a negative sign before it.
    Here are several examples of negative numbers being assigned to:


    ```

    $sumVar = -2;

    $sumVar = -64;

    $sumVar = -1028;

    ```


    The positive sign is also allowed in PHP, but it serves no useful purpose other
    than demonstrating that a number is positive. Numbers without a sign are automatically
    positive, however, the sign is rarely used. Here are a few examples of it for
    your reference:


    ```

    $sumVar = +2;

    $sumVar = +64;

    $sumVar = +1028;

    ```'
  merge: -1
