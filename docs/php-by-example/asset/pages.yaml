    function expects a more standard Unix-style timestamp.


    To obtain a Unix timestamp, we have to tell MySQL we want a Unix-timestamp instead
    of a MySQL timestamp. MySQL''s UNIX_TIMESTAMP function will do this for us. It
    needs to be specified in the query like so:


    ```

    SELECT *, UNIX_TIMESTAMP(date_joined) AS date_joined FROM members

    Note that I''ve changed the column to include all columns, but I added another
    column. Even though date_joined was already included by the asterisk, it is wrapped
    by the UNIX_TIMESTAMP function, it will PHP''s date() function will understand.
    The AS date_joined clause that follows the UNIX_TIMESTAMP(date_joined) column
    tells MySQL to send the value of that function back as the value for the date_joined
    column. Otherwise, the date_joined column would be the value we had before.

