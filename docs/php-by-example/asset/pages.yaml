- img_proc: true
  md: '# String Functions 95


    To express substr, use a negative starting position. Doing so tells substr to
    count from the end of the string instead of the beginning. However, unlike counting
    from the beginning of the string, when counting from the end, the first character
    is -1 (not 0 or -0).


    The following statement retrieves the last four digits, regardless of the format
    of the string:


    ```

    $SSN_lastFour = substr($SSN, -4);

    ```


    Notice that the length parameter is omitted. Because you''re trying to retrieve
    everything up to the end of the string, it''s not necessary.


    Now, try using the length parameter. The length parameter determines how long
    the substring will be. For example, if length is specified as 2, the substring
    returned will be two characters. The following example demonstrates this principle.


    ```

    $str = ''abcde'';necho substr($str, 0, 2); // outputs ''ab''

    ```


    In this example, the substring begins at the first position in the string, 0,
    and it''s 2 characters long. Thus, the substring is the first two characters of
    the string, ab.


    The length parameter can also be negative. Like the start parameter, if the length
    parameter is negative, it means count from the end of the string. Thus, the ending
    position for the string will be length number of characters from the end of the
    string. The character at the ending position specified is included in the substring.
    Again, -1 is the first character when counting from the end of the string.


    Here''s an example:


    ```

    $str = ''abcde'';necho substr($str, 0, -2); // outputs ''abcde''

    ```


    Now, if the length of the string being 2, it''s how long it takes to get 2 from
    the end (-2). The string starts at the beginning (0), everything from the first
    character to the one before the last (-2) is returned as the substring.


    # CAUTION


    Because index positions can be confusing, it''s a good idea to check the result
    of substr with several different strings to make sure it is what you want to do.
    If it''s not, you can adjust the parameters you''re passing to it too much of
    a hassle; if you continue without testing, you may later find that you have a
    hard time figuring out where the problem is.'
  merge: -1
