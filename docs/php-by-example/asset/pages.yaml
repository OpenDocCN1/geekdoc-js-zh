    # NOTE


    Although all of the loops are while loops, a multilevel break will break any kind
    of loop, including different types of loops. For example, if a while loop is inside
    a for loop (which we will discuss in Chapter 9, "Using for and foreach"), and
    a break 2 occurs, both loops are broken.


    # TIP


    As with a simple break, a multilevel break (such as break 2) only breaks the loop.
    Had more code followed the loops, execution would have picked up right after the
    outer while loop, and the other code would have run as normal.


    Figure 8.5 shows the use of a multilevel break to break out of loops at the same
    time.


    # NOTE


    When doing multilevel breaks, count the number of loops to break from the inside
    out. For example, to break only the current loop, break 1. (This is implied by
    break without an argument.) If three nested loops are present and you want to
    break the inner two by continuing the outermost loop, do a break 2.


    # Exiting a Program


    Sometimes you''re not just trying to terminate the loop, but the whole program.
    Several of the examples I''ve used had conditional testing, called error checking,
    to ensure that certain conditions are met. If the conditions aren''t met, the
    program is terminated using exit and the rest of the program won''t run.'
