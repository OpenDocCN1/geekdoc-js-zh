    (checking for certain conditions which will be discussed in Chapter 6, "If it,
    elseif, and else Statements"). A denominator of zero yields an undefined result,
    and PHP will terminate with an error informing you that you have attempted to
    divide by zero.


    # Modulus Division


    This is one you probably have seen before—at least not with this name. This operator
    is less commonly called the remainder operator—and it does just. The modulus operator
    was created to allow you to easily get the remainder resulting from the division
    of two integers.


    A simple example of modulus division:


    ```

    <= 10 % 3 ?

    ```


    ![](img/b437c18efec65ed938962e8683b6a70c_89_1.png)


    The output of this is—three goes evenly into ten times with a remainder of one.
    The following example also demonstrates this concept:


