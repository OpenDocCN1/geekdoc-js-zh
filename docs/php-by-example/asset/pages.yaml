  md: "# Chapter 7: The switch Statement\n\n```\n// Specify age\n$intAge = 32;\n```\n\
    \n```\n// Assign age group letter to $chrAgeGroup\nswitch ($intAge)\n{\n    case\
    \ (< 21):\n        $chrAgeGroup = 'A';\n        break;\n    case (< 41):\n   \
    \     $chrAgeGroup = 'B';\n        break;\n    case (< 61):\n        $chrAgeGroup\
    \ = 'C';\n        break;\n    default:\n        $chrAgeGroup = 'D';\n        break;\n\
    }\n```\n\n```\n// Show age group chosen\necho $intAge fits into age group $chrAgeGroup';\n\
    ```\n\nThis code is invalid because the < operator requires a left operand. You've\
    \ only supplied the right operand, so the expression can't be evaluated. You should\
    \ try to execute this code, PHP will die with a parse error.\n\nSo, the fact that\
    \ switch statements can only evaluate for equality is the reason you must choose\
    \ to use an if-elseif-else clause in this case to assign the letter age groups.\
    \ As you can see, switch is useful for printing text describing the appropriate\
    \ one of four age groups (A, B, C, and D), but it is not useful when working in\
    \ the reverse direction and assigning a letter for an age (given as a number).\n\
    \n# Multiple Cases for the Same Code\n\nIn some cases you may find that you have\
    \ two cases in a switch statement that should prefix the same code. In fact, you\
    \ could have any number of cases that should be followed by one block of code.\n\
    \nAs mentioned before, when a condition is met, the execution of the statements\
    \ following the case doesn't stop until a break statement is encountered. This\
    \ can be used to your advantage when dealing with multiple cases that should all\
    \ perform the same task."
