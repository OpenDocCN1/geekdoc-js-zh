  md: '# Expressing Multiple Conditions


    So, the two expressions

    $form[''username''] == ALLOWED_USER

    and

    $form[''password''] == ALLOWED_PASS


    are combined into one using a logical operator; that is, an operator that evaluates
    Boolean values according to certain rules and returns a Boolean value.

    The logical operator in this case was && && (), as shown here:

    $form[''username''] == ALLOWED_USER && ($form[''password''] == ALLOWED_PASS


    # NOTE


    The parentheses aren''t necessary, per se, but they''re beneficial to the readability
    of the expression as a whole.


    The && operator returns true if only if both operands are true. So, if the username
    and password are both correct, the expression evaluates to true. Otherwise (if
    one or both are incorrect), it evaluates to false. Table 6.2 lists PHP''s logical
    operators.


    Table 6.2: This Table Shows the Logical Operators Listed in Order of Precedence


    | Operator | Name | Example |

    | AND | And | $var1 and $var2 |

    | OR | Or | $var1 or $var2 |

    | XOR | Exclusive or | $var1 xor $var2 |

    | && | And | $var1 && $var2 |

    | || | Or | $var1 || $var2 |

    | ! | Not | !$var1 |


    Let''s take a closer look at each of these operators to make sure you have a clear
    understanding of each one''s function.


    # NOTE


    The && and || operators are shown in the same tables as their relatives, and,,
    or, because their only difference is their precedence.


    Table 6.3: The behavior of the AND (&&) operator in detail.


    | Left Value | Right Value | Right Value |

    | True | True | True |

    | True | False | False |

    | False | True | False |

    | False | False | False |'
