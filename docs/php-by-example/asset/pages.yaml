  md: '# Chapter 5: String Manipulation


    So, to get the last four characters of the Social Security number, use $SSN_lastFour
    = substr($SSN, 5, 4);


    The 5 means the substring you will get start at the index position 5, which is
    the fourth character from the end of the string. The parameter, 4, tells substr()
    to give us four characters—in this case, the last four. Figure 5.1 illustrates
    the extraction of the last four digits from the rest of the string.


    ![](img/b437c18efec65ed938962e8683b6a70c_106_0.png)


    **Figure 5.1:** The substring here is the last four characters of the nine-character
    string, starting at the character index 5 and continuing to the end.


    > NOTE

    When a substring is extracted from a string, it is not removed, but rather retrieved.
    For example, in the demonstration involving a Social Security number, $SSN will
    still be a nine-character string, and it will still be the same as it was before.
    You are changing the string in any way; instead, you''re merely "taking a look"
    inside the string.


    The substring function is more flexible than that, Let''s assume for a moment
    that you''re not sure if the Social Security number has its number grouped by
    some character or not. Any of the following assignments could be true:


    ```

    $SSN = ''012345678'';

    ```


    or


    ```

    $SSN = ''012-34-5678'';

    ```


    or even


    ```

    $SSN = ''012.34.5678'';

    ```


    Independent of the rest of the string, if you know the last four characters of
    the string are the last four digits of the number, you can retrieve the last characters
    from the end.


    Counting from the end is especially important in this case because you can''t
    be sure the string''s length will be 9 (the nine digits plus two separating characters).
    If you counted from the beginning of the string, you would then have the problem
    of figuring what the starting position of the substring would be; it could be
    5 or 7. However, if you count from the end, the substring will always start 4
    characters from the end.'
