    # Division


    Now it''s time to take a look at the last of the four common operators—the division
    operator. You may already be used to seeing fractions expressed all on one line;
    if you''re not, it''s not too hard to learn. Instead of stacking the numerator
    over the denominator vertically, you must put them on one line separated with
    a slash. The slash, in this case, is the operator:


    To divide 35 by 7, the following expression could be used:


    ```

    <= 35 / 7 ?

    ```


    ![](img/b437c18efec65ed938962e8683b6a70c_89_0.png)


    This code would output 5.


