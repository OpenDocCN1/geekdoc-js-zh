  md: '# Chapter 1: Welcome to PHP


    Check to make sure that your file is named with an appropriate extension (such
    as .php); this is the most common reason the PHP code wouldn''t execute.


    If that fails, read through the section describing what to do if the Save As dialog
    box appeared; the problem must be that .php isn''t associated with PHP in the
    Web''s configuration. That section will help you straighten out your Web server''s
    configuration.


    # THE PHP CODE APPEARS DIRECTLY IN THE BROWSER


    This is because you entered the code into a WYSIWYG editor such as FrontPage or
    DreamWeaver. As you entered the code, the editor converted parts of it (such as
    the <php tag) into text using HTML special character codes (so, the result would
    be &lt;php&gt;). Although you see php in your browser, if you look at the source
    code (using your browser''s View Source command), you will notice that the version
    with the special character is used.


    To correct this, enter the code in a text-editor, such as Notepad or PHPED. (See
    Appendix A for more information about editors.)


    # A "404 FILE NOT FOUND" OR "CGI ERROR" MESSAGE APPEARS


    The first of these may seem quite obvious, but it isn''t always so obvious if
    you use Notepad to create your PHP file. One of the problems with using Notepad
    is it''s preference for .txt extensions; even if you give your file a .php extension,
    Notepad adds a .txt.


    When the Web server tries to find the .php file you requested, the file isn''t
    because it''s really named .php.txt. In most cases, the server would return a
    "404 File Not Found" error, but if PHP is installed as a CGI filter, you might
    get the letter about incomplete HTTP headers being returned.


    In this case, rename the file to .php and try again.


    # A "PARSE ERROR" MESSAGE APPEARS


    This message, mentioned briefly before, means PHP doesn''t know how to interpret
    something inside of the PHP tags. This isn''t at all uncommon.


    For the example shown previously, it means you mistyped something. Go back and
    check to make sure the files match exactly, for line for line. Check to ensure
    that the same quotes are used (double quotes are not the same as two single quotes).'
