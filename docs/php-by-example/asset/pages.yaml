  md: "# Passing Values to and from Functions\n\n# DEFAULT PARAMETER VALUES\n\nSometimes\
    \ you might have optional values; that is, parameters that default to a certain\
    \ value if no value is specified.\n\nFor example, let's say you have a function\
    \ table_row() that outputs a single-cell table row (assuming that a table has\
    \ already been started with a <table> tag). Now, the function could only have\
    \ one argument: the text to go in the cell. However, you realize you might also\
    \ want to choose whether the text is aligned to the left, center, or right of\
    \ the cell.\n\nHere's what the function would look like without a default parameter:\n\
    \n```\n```php\nfunction table_row($strText, $strAlignment) {\n    echo <<END_HTML>\n\
    \    <td align=\"$strAlignment\">$strText</td></tr>\nEND_HTML;\n}\n```\n```\n\n\
    EXAMPLE\n\nAs it is, you must always specify both arguments in the function call.\
    \ If the argument is left out, PHP will issue a Missing argument warning.\n\n\
    Thus, you have the perfect opportunity to implement a default parameter. Most\
    \ of the time, the text will be aligned to the left, but sometimes the alignment\
    \ will be different. So, \"left\" will be the default value for parameter. If\
    \ another value is desired, it can be specified in the argument list.\n\nThe new\
    \ function declaration, which allows us to leave the second argument unless you\
    \ decide to use something other than the default, like this:\n\n```\n```php\n\
    function table_row($strText, $strAlignment = 'left') {\n    echo <<END_HTML>\n\
    \    <td align=\"$strAlignment\">$strText</td></tr>\nEND_HTML;\n}\n```\n```\n\n\
    The default value for a parameter, as you can see, is specified in the function\
    \ declaration as if it is an assignment.\n\n# CAUTION\n\nThe default value must\
    \ be a literal value. It cannot be an assignment of a variable or function's return\
    \ value.\n\nIf you attempt this, PHP will die with a parse error of some sort,\
    \ depending on the type of value you tried to use as the default."
  merge: -1
  pgno: 209
- img_proc: true
  md: "# Chapter 10: Functions\n\nTo call this function, you might specify one or\
    \ both arguments. Here are a few examples:\n\n+   1. Function call:\ntable_row('This\
    \ is my text', 'left');\n\nResult:\nA table is printed with the specified text\
    \ left-aligned.\n\n+   2. Function call:\ntable_row('This is my text');\n\nResult:\n\
    A table is printed with the specified text left-aligned (same as #1).\n\n+   3.\
    \ Function call:\ntable_row('This is my text', 'right');\n\nResult:\nA table is\
    \ printed with the specified text right-aligned.\n\n> NOTE\nThe important thing\
    \ to see with these examples is that default parameters enable you to shorten\
    \ the argument list by assuming a default set of parameter values when those arguments\
    \ aren't specified.\n\nIt's worth mentioning that the default parameter(s) should\
    \ always be at the end of the parameter list; you can't leave a value you want\
    \ to specify after in the list because PHP won't know which value you're trying\
    \ to specify and which value you're trying to leave out.\n\nTake the following\
    \ function definition, for example:\n\n```\nfunction($arg1 = 10, $arg2)\n{\n \
    \   // function code would go here\n}\n```\n\nNow, if you want to let $arg1 default\
    \ to 10, then you might think that you need only specify one value as argument\
    \ two, as follows:\nexample('This is argument 2');\n\nHowever, this function call\
    \ is ambiguous: Do you mean to put that value in $arg1, leaving $arg2 unspecified,\
    \ or do you mean to let $arg1 default to 10 and $arg2 receive the value given?\n\
    \n![](img/b437c18efec65ed938962e8683b6a70c_210_0.png)\n\n![](img/b437c18efec65ed938962e8683b6a70c_210_1.png)"
  merge: -1
  pgno: 210
- img_proc: true
  md: "# Passing Values to and from Functions\n\nPHP uses the first scenario, and\
    \ warns you with the following error because argument 2 is unspecified in the\
    \ function call:\n\nWarning: Missing argument 2 for example()\n\nSo, the first\
    \ argument having a default value is useless as long as other values without defaults\
    \ follow it. Therefore, you should always put the default parameters at the end\
    \ of the parameter list.\n\nHere's a version of the function same with this problem\
    \ rectified:\n\n```\nfunction example($arg1, $arg2 = 10)\n{\n    // function code\
    \ would go here\n}\n```\n\n# Returning a Value\n\nSome functions are created to\
    \ give a value back to the calling expression. For instance, PHP has a built-in\
    \ function substr() that takes a string and two arguments and returns a substring\
    \ of the original string.\n\nHere's an example:\n\n$substr = substr('ABCDEF',\
    \ 3);\n\nAfter this statement executes, $substr contains ABC.\n\nWhen this statement\
    \ is evaluated, the function is executed before the assignment order. Thus, the\
    \ function's return value (ABC) gets stored in the variable ($substr).\n\nYour\
    \ functions can have this characteristic, as well. Until your, your functions\
    \ weren't returning a value, per se; they had a NULL return value.\n\nWhen your\
    \ function's task is complete, you can return any value using the return statement,\
    \ which has the following syntax:\n\nreturn value;\n\nValue, would be whatever\
    \ value you're returning.\n\nLet's say you want to return the value of the second\
    \ parameter passed into the function. The following example does just:\n\n```\n\
    <?php\n/* ch1ex03.php - demonstrates user-defined returnSecond() function */\n\
    \n/* MAIN PROGRAM *//\n\necho returnSecond('Three', 'One', 'Two');\necho returnSecond('One',\
    \ 'Two', 'Three');\necho returnSecond('Two', 'Three', 'One');\n```\n\n![](img/b437c18efec65ed938962e8683b6a70c_211_0.png)"
