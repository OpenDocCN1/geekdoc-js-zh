  md: "# Setting Up the Database\n\nentry (complete with the admin's delete option,\
    \ if the visitor is logged in as an admin).\n\n# Setting Up the Database\n\nBecause\
    \ most of the scripts within this program will rely on MySQL, you should create\
    \ that first so you can test your scripts as you write them.\n\nYou know want\
    \ to store the visitor's name, the date the entry was posted, a brief subject,\
    \ and the message, so you can define a table as follows:\n\n![](img/b437c18efec65ed938962e8683b6a70c_375_0.png)\n\
    \n+   - guestbook.sql creates guestbook structure and adds some sample data\n\n\
    ```\n# Make sure we have a PHPByExample database\nCREATE DATABASE IF NOT EXISTS\
    \ PHPByExample;\nUSE PHPByExample;\n```\n\n+   - Delete (if already exists) and\
    \ re-create the guestbook table\n\n```\nCREATE TABLE guestbook (\n  id UNSIGNED\
    \ NOT NULL AUTO_INCREMENT PRIMARY KEY,\n  timestamp TIMESTAMP,\n  name TEXT NULL,\n\
    \  subject TEXT NULL,\n  message TEXT NULL\n);\n```\n\n```\nINSERT INTO guestbook\
    \ SET name='Test User', subject='This is a test!', message='Test message body...';\n\
    INSERT INTO guestbook SET name='Another Tester', subject='This is another test...',\
    \ message='Hi, this is a test message!';\nINSERT INTO guestbook SET name='Last\
    \ Test', subject='Last Test:', message=This is the last auto-created test!\n```\n\
    \n# TIP\n\nMuch SQL data like this is often stored in a file. This data called\
    \ guestbook.sql. To enter it into the database, you can simply call mysql and\
    \ append < guestbook.sql before you press Enter. (Note that you must run this\
    \ command from the same directory in which you saved guestbook.sql).\n\nFor example:\n\
    \n```\nmysql -uadmin -p -hmysql.myhost.com mydatabase < guestbook.sql\n```"
