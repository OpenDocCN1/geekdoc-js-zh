  md: '# 380 Appendix A


    ```

    $db1OvertimeHours = 4

    ```


    Here are the important variables after calling computeWages():

    $db1Rate = 6.00

    $db1NormalHours = 40

    $db1OvertimeHours = 4

    $db1TotalEarnings = 276


    Using this method of variable tracking, you can verify two important things. First,
    you can see that the three parameter values ($db1Rate, $db1NormalHours, and $db1OvertimeHours)
    were not changed by calling the function, which might happen if the function were
    declared with referenced parameters. You can also calculate what you expected
    the output to be on your own to verify that the output was correct. In this case,
    everything seems to be working as expected.


    The last aspect of variable tracking that is important to turn off all of this
    extra output. When your program is finished, the 10 or so lines of debugging output
    shown previously will need to be hidden.


    The most obvious approach is to delete the variable tracking code, but that is
    a bad idea. You might run into problems later that slipped through your original
    function testing. If you do experience problems, you will have to go back through
    and add echo statements to help figure out where the problem is.


    A more convenient approach is to define a constant that controls whether the debugging
    output is shown. (This method also tends to be cleaner because you are not tempted
    to cut corners when rewriting debugging code.)


    The way you use constants to hide/show debugging output is up to you. The two
    most-often-used methods are using a Boolean constant and using debugging levels.


    # Using a Boolean Debugging Constant


    Using Boolean debugging constants is best if your program is and always be a small
    utility type of program. If your program becomes too big, you will end up with
    such a list of debugging output that it will be difficult to figure out exactly
    where the problem you are looking for.


    Following is a short example of a Boolean constant variable tracking/debugging
    system:


    ```

    <?php

    def(''SHOW_ERRORS'', true);

    ```


    ![](img/b437c18efec65ed938962e8683b6a70c_392_0.png)'
