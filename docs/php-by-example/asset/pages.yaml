  md: "# What Are Classes and Objects?\n\nTo access an object's members (both variables\
    \ and functions), use the -> operator.\n\nNOTE\nDon't confuse the -> operator\
    \ with the => operator. The ->, which is used with classes, cannot be interchanged\
    \ with =>, which is used with associative arrays.\n\nFor example, using the dog\
    \ class from the previous example, you could create a program as follows:\n\n\
    ```\n<?php\n/* ch11ex2.php - demonstrates the use of an object */\n\n// Define\
    \ what a dog is\nclass dog {\n    var $name; // dog's name\n\n    function Bark()\
    \ {\n        echo 'Woof!';\n    }\n}\n\n// Create a dog, give him a name, and\
    \ make him bark\n$objDog = new dog;\n$objDog->name = 'Cerberus';\n\necho $objDog->name\
    \ . ' says: ';\n\n$objDog->Bark();\n?>\n```\n\nThis program creates a new dog\
    \ object and assigns him the name Cerberus. Then, after printing Cerberus says:\
    \ as output, the dog's Bark() function is called, causing the dog object to output\
    \ Woof!\n\nThe following output results:\nCerberus says: Woof!\n\nSimilar to placing\
    \ an index after an array (such as array[index]), you can use the object->memberVariable\
    \ notation anywhere you can use a variable. It will be evaluated before the rest\
    \ of the expression.\n\nThus, the echo $objDog->name line in this example is perfectly\
    \ valid."
