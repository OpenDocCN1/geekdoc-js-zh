    # Using MySQL to Make Your Web Site Alive


    Now that you understand the basics of creating a database, we''re going to

    integrate its abilities with PHP programs.


    In a database-driven Web program, we have four basic operations: reading

    the database, adding and modifying the database, and deleting from the

    database. Each of these operations has its own practical use within a Web\site.


    Reading the database, for example, occurs when a user browses an online

    catalog. The information for each page or item within the catalog is read

    from the database and then displayed for the user to see. Nothing changes

    within the database unless something is added, modified, or deleted. Other

    examples of reading from a database might be browsing the information in

    discussion boards (but not posting to them)—that would be writing) and

    even looking at search results pulled from a database.


    # NOTE


    > The term pulled is commonly used to refer to the process of retrieving data
    from a data-base. Because MySQL doesn''t have an obvious name when it comes to
    reading

    the database, you''ll see soon. The other operations, however, are clear, so they

    are often referred to by name, as insert, update, and delete.


    Now, information might be added, or inserted, into a database whenever

    information for a new record is given to a program. For example, when you

    sign up to create a user account, the information is probably being inserted

    into a database. Likewise, if you place an order on an e-commerce Web site,

    a record containing information about that order (such as date placed,

    items ordered, where to ship, and so on) might be inserted into a database.'
