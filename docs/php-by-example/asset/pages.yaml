    \ chosen\necho \"$intAge fits into age group $chrAgeGroup\";\n\nelse // It wasn't\
    \ a number; print an error message\n{\n    echo \"You must enter a number!<br><br>\"\
    ;\n}\n```\n\n```\n<!-- Here's the HTML form we get input from -->\n<form action=\"\
    ch0ex6.php\" method=\"POST\">\nAge: <input type=\"text\" name=\"age\\input type=\"\
    submit\">\n</form>\n```\n\n# NOTE\n\nThe is_numeric function is very straightforward:\
    \ It takes one argument and returns true if the argument is a number; otherwise,\
    \ it returns false.\n\nThe if statements here are nested—there's one that has\
    \ most of the rest of the program in its code block. Then, the second if has yet\
    \ another if within its code block. This way, your program can perform different\
    \ tasks based on the conditions.\n\n# NOTE\n\nThe indentation shown here is an\
    \ important attribute of programming style.\n\nAs mentioned in Chapter 1, \"Welcome\
    \ to PHP,\" the indentation brings much clarity to the organization of your program.\
    \ If the statements above would surely be harder to evaluate if they were all\
    \ aligned with the left edge. By indenting each block to a new level, you demonstrate\
    \ that program execution would never make it to the inner (nested) levels without\
    \ passing through the outer levels (to the left of the current level).\n\nSo,\
    \ for program execution to reach the innermost level of three levels, all three\
    \ conditions must be met. Indenting each block of code makes this relationship\
    \ obvious on first sight—instead of forcing someone reading your code to match\
    \ curly braces to find blocks beginning and end.\n\nThe if statements you've explored\
    \ so far evaluate only a single value that is either true or false; many times,\
    \ though, you're not at all interested whether a value is simply true or false.\
    \ Rather, you're interested in how one value compares to another."
