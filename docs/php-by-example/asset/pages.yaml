  md: "# Chapter 12: Using Include Files\n\n# Understanding include\n\nFirst of all,\
    \ let's take a look at what include files do. Include files are files that are\
    \ interpreted as part of a program at runtime. Include files usually contain program\
    \ code or HTML code, but they can also contain other information (such as JavaScript\
    \ code).\n\nNOTE\nInclude files in PHP are similar to Server Side Include files\
    \ (.ssi or .shtml files).\nInclude files are used in many languages, including\
    \ C, C++, Perl, and Java. You will see why they are so widely used when you've\
    \ finished learning about them in this chapter.\n\n# include Syntax\n\nFiles are\
    \ included using the include statement, which tells PHP to include the file at\
    \ that point in the program.\n\nThe include statement follows this syntax:\n\n\
    ```\ninclude('/path/filename');\n```\n\nHere, path is the optional path to the\
    \ include file's location; the path doesn't have to be specified if the file is\
    \ the PHP's configured include directory. The filename, such as contents.php,\
    \ must be specified.\n\nThe following example includes the files top.php and bottom.php,\
    \ which simply contain HTML code, in their respective positions within the program:\n\
    \n![](img/b437c18efec65ed938962e8683b6a70c_254_0.png)\n\n```\n<?php\n/* example1.php\
    \ - demonstrates use of include() with\n   HTML code in include file */\n\ninclude('top.php');\n\
    \n<b>Hello!</b>\n\n<?php\n\ninclude('bottom.php');\n\n?>\n```\n\nAs you can see,\
    \ HTML in the middle of the program is surrounded by either side by include statements.\
    \ The two include files contain HTML code to go on either side of the page's content—the\
    \ boldfaced word hello."
