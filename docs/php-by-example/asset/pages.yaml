    # CAUTION


    To effectively re-create an object from a serialized form, you must include the
    class definition in the code that unserializes the object, as well as the code
    that serializes it to begin.


    # Subclasses and Inheritance


    The last feature of classes to learn is the ability to create *subclasses*—classes
    that extend a more general class, known as a *base class*.


    # TIP


    Subclasses are also sometimes referred to as *derived classes* because they are
    directly from the base class.


    For example, let''s say you have a class called tree that represents any tree.
    Any tree object, then, will have roots, leaves, and bark. However, you could represent
    a specific kind of tree by creating a subclass of the class tree called `pineTree`.


    The `pineTree` would not only have roots, leaves (needles), and bark, but also
    pinecones. Not only does the `pineTree` contain its own members (pinecones), but
    it also *inherits* of those base class (roots, leaves, and needles). The *base
    or parent* class is the class that is extended; in this case, the base class is
    the tree class.


    Inheritance gives subclasses the power and ease that makes subclasses useful;
    instead of having to define four members in the subclass, you only have to define
    one because the other three are inherited from its parent.


    # The extends Keyword


    When you want to create a subclass, you''ll need to use the extends keyword to
    tell PHP that the class you''re creating extends (and is therefore a subclass
    of) another class.'
