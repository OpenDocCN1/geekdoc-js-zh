  md: "# What is Recursion?\n\nRecursion relies on the basic principle that at some\
    \ point the function will stop calling itself. After all, if the function called\
    \ itself infinitely, it would have no use. So, any recursive function must have\
    \ an if statement (or another conditional statement) to test whether the function\
    \ should call again or if it simply return its result and stop.\n\nOne other trait\
    \ is common to all recursive functions: Some change must be made to the function's\
    \ parameter before it is used to call the function again. For example, to find\
    \ a factorial, subtract one from the parameter (just as you did with the counter\
    \ in a for loop) and call the function on the result-value.\n\nThus, every time\
    \ the function is called, the value is one less than it was before. Eventually,\
    \ the value would reach 1; because you want to stop at one, this will become your\
    \ conditional.\n\n# Understanding Recursion\n\nLet's take a look at how recursion\
    \ works. Recursion isn't quite as straightforward as looping because it requires\
    \ you to imagine that the same segment of code can have multiple instances of\
    \ itself running at the same time.\n\nThe factorial function discussed so far\
    \ would look something like this:\n\n```\n{\n  if ($number == 1) {\n    return\
    \ $number;\n  }\n  else {\n    return ($number) * factorial($number - 1);\n  }\n\
    }\n```\n\n> NOTE\nHow the function's name appears within its definition. Whenever\
    \ you see this, you're dealing with a recursive function.\n\nThis will be much\
    \ clearer if you have some diagrams to go by. Let's start off simple: the factorial\
    \ of 1. As you already know, this function call look like:\n\nfactorial(1);"
  merge: -1
