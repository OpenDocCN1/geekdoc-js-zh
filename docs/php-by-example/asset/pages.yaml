  md: '# Glossary


    **method** A class''s member function.


    **modulus** Remainder division. Example: 5 mod 2 is 1; 4 mod 2 is 0; 3 mod 2 is
    1; and so on.


    **nesting** The act of placing a group of expressions or statements within another.


    **null** The lack of a value. If compared as a Boolean, evaluates to false, but
    is truly a lack of falseness, too.


    **object** An instance of a class.


    **object-oriented programming** A programming language, such as C++, Java, or
    PHP, that makes use of abstract data types (classes).


    **Object-Oriented Programming (OOP)** Programming in an OO (object-oriented) language,
    which enables the programmer to model real-world concepts with classes and break
    problems down into smaller, independent or interdependent parts.


    **open source software** Software to which the source code is freely available.


    **operating system** Software that allows for basic user interaction with other
    software and the computer''s hardware.


    **operator** A special character that represents an operation (assignment, arithmetic,
    compound, or conditional). Examples of operators include +, -, =, *, /, &&, and
    so on.


    **operator precedence** The order in which operators should be evaluated within
    an expression.


    **order of operators** *See operator precedence.*


    **output** Anything a program produces that is still available after the program
    finishes execution. Examples include visual output to your browser and file output
    to the server''s file system.


    **parameter** A local variable in function to which the corresponding call-argument
    will be assigned.


    **parent class** The class from which a subclass was derived.


    **parser** A program that tokenizes (splits into separate statements and expressions)
    and interprets a script.


    **pattern matching** The act of matching a regular expression against a string.


    **perl** The Practical Extraction and Report Language; a programming language
    similar to PHP, but not initially intended for Web programming.


    391'
