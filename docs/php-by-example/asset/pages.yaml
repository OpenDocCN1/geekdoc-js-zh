    Now that you understand databases, we can look at using them for pass-authentication.
    Simply put, you will be able to register users, let them pick a username and password,
    and then give them access to restricted areas of your Web site if they supply
    that username and password.


    This ability is a big step in designing user-friendly, customizable Web sites;
    after users log in, you can greet them by name, personalize content to their needs,
    and more!'
