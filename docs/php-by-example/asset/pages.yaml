  md: '# Chapter 16: Cookies


    box for your site to remember his password, and even if he comes back a week later,
    the cookie you set can still remember his password for him.


    The default behavior—that is, what you get if you only specify the name and when
    you call setcookie()—is for the cookie to expire when the user closes browser
    or when the cookie is overwritten.


    To get a feel for this, try setting a cookie in your browser with the ch16ex01.php
    script. After you''ve set a value, go to ch16ex02.php to ensure the cookie is
    there. At this point, the cookie should still be available and the value you entered
    before should appear on the page. Now, close your browser and browser windows
    and then open the browser and go to ch16ex02.php. You will see that the cookie
    has no value.


    ![](img/b437c18efec65ed938962e8683b6a70c_354_0.png)


    The output of ch16ex02.php will be as follows when the cookie has been erased:


    ```

    myCookie = **

    ```


    # NOTE


    If ch16ex02.php shows that myCookie still has a value (and thus something other
    than empty quotes is displayed), the cookie hasn''t deleted.


    To ensure that the cookie will be deleted, close all instances of your browser
    (not just one window, but rather all of them), and then try again.


    The cookie has been erased, in its default state, it expires when you close your
    browser.


    If you want a cookie to last for more time than that, you''ll have to set a time
    stamp for the expires attribute.


    # TIP


    To keep things simple (and to keep you from having to flip back to the function
    syntax too many times), these options appear in the order that they are accepted
    parameters by the setcookie() function. Thus, as each new option is introduced,
    you''ll see one more parameter when setcookie() is called.


    A time stamp, as you might recall from Chapter 13, “Creating Dynamic Content with
    PHP and a MySQL Database,” is an integer representation of time. A time stamp
    is actually the number of seconds known as the Unix epoch, which is January 1,
    1970 at 00:00:00 (midnight). A typical time stamp might look something like this:


    ```

    1016445254

    ```'
