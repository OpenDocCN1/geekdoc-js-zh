  md: "# The while Statement\n\nWe want the user to choose the closest city of a list\
    \ (we'll select a box). To display the list of cities from the array, we need\
    \ to traverse the array and print an option tag for each city.\n\nThe following\
    \ code can be inserted into the program to accomplish this:\necho <select name=\"\
    city\">\n\nwhile ($dummy, $value) = each($arrCities)) // $dummy gets the key\n\
    \    // that's the first element in the array returned by each\n{\n    echo <option=\"\
    $value\"></option>\n}\necho </select>\";\n\nThis assumes that $arrCities contains\
    \ the appropriate cities.\n\nAnother application of traversing an array might\
    \ be e-mailing a list of users with a common e-mail message. For example, perhaps\
    \ you have an array called arrAddresses that contains the e mail addresses of\
    \ users who asked for an e-mail update.\n\n![](img/b437c18efec65ed938962e8683b6a70c_171_0.png)\n\
    \nTo send an update out to all of these addresses, you can create a program like\
    \ this:\n\n```\n<?php\nstrMessage = \"See our newly renovated website at HYPERLINK\n\
    \"http://www.example.com/\"www.example.com!HYPERLINK\n\"http://www.example.com/\"\
    HYPERLINK \"http://www.example.com!\"\";\nwhile (list($dummy, $value) = each($arrAddresses))\
    \ {\n\n// SYNTAX:\n// mail (string TO, string SUBJECT, string BODY )\nmail($value,\
    \ \"Announcement!\", $strMessage);\n}\n?>\n```\n\nOf course, this is only a basic\
    \ version of the program. You can expand this idea to send longer, HTML-formatted\
    \ e-mails without much trouble.\n\n# Using while with a Counter\n\nA counter is\
    \ used to associate a number with each execution of a loop. Most of the time,\
    \ this number simply increments from 0 or 1 to higher values until the loop finishes.\
    \ However, the number can also decrement, change by some multiple, or have a function\
    \ applied to it to generate a new value."
  merge: -1
  pgno: 171
- img_proc: true
  md: "# Chapter 8: Using while and do-while\n\n> TIP\nA counter is usually also a\
    \ type of sentinel value. That is, the counter is generally used in the condition\
    \ that determines when the looping stops.\n\nUsing a counter, it's possible to\
    \ create sequentially numbered lists as out- or perform calculations with a list\
    \ of values.\n\nA while with a counter takes a few extra lines of code to initialize\
    \ the counter before the loop and modify it for each successive execution of the\
    \ loop.\n\nA while with a counter generally looks like this:\n\n```\n```\n$counter\
    \ = 0;\nwhile ($counter < 10)\n{\n    code to execute;\n    // increment counter\n\
    \    $counter++;\n}\n```\n```\n\nThis would result in the code executing 10 times.\
    \ For each successive execution, the value of $counter would be one higher. So,\
    \ the values would be 0, 1, 2, ..., 8, 9.\n\n> NOTE\nIn loops like it's important\
    \ to understand exactly what you're trying to do. For example, this loop executes\
    \ 10 times with the values 0 through 9, but not 10. At first glance, however,\
    \ it appears that 10 would be the last value it appears in the condition. However,\
    \ the 10 is never reached because 10 < 10 isn't true, so the loop ends.\n\nAn\
    \ example of using while with a counter would be displaying the contents of a\
    \ numerically indexed array. The following program shows a numbered list of names,\
    \ which are stored in $arrNames:\n\n```\n```php\n/* @ch0xe2.php - displays a numbered\
    \ list from an array of names */\n\n// Initialize list of names\n$arrNames = Array('Joe',\
    \ 'Bob', 'Sarah', 'Bill', 'Suzy');\n\n// Display numbered list of names\n$counter\
    \ = 0;\nwhile ($counter < count($arrNames))\n{\n```\n```"
  merge: -1
  pgno: 172
- img_proc: true
  md: "# The while Statement\n\n```\necho $counter + 1 . $ArrNames[$counter] . '<br>';\n\
    $counter++;\n```\n\n?\n\n# TIP\n\nBecause arrays are numbered from 0 and people\
    \ number from 1, the number we display as output is actually one more than the\
    \ index used to retrieve the value from the array. In other words, if we were\
    \ to output $output instead of $output + 1, the output would look strange because\
    \ the items would be numbered starting at 0.\n\nThe count appears here so the\
    \ code can be modified. Use count if you're going to be traversing an array so\
    \ you know how many elements exist. If you hardcode a number and the array ends\
    \ up changing later, the while block won't work as it should.\n\n# Computing Totals\n\
    \nAnother use for a counter is to perform mathematical calculations using a sequence\
    \ of numbers. For the example, the most basic application of this would be to\
    \ find the sum of all the numbers between 1 and 10.\n\nTo do this, we'll need\
    \ to keep a running total for the calculations using a variable other than the\
    \ counter. The result will look something like this:\n\n```\n$total = 0;\n$counter\
    \ = 1;\nwhile ($counter <= 10) {\n  $total += $counter;\n  $counter++;\n}\n```\n\
    \nAt the end of this segment, $total would be the sum of all the numbers between\
    \ 1 and 10.\n\nHere are a few longer examples to help you get used to computing\
    \ totals:\n\n+   Let's modify the example we just did a little bit to work with\
    \ any numbers first and last. Assuming they're passed to the script via GET, you\
    \ could produce the following script:\n\n```\n<?php\n/* ch08ex03.php - computes\
    \ sum of all numbers from\nfirst to last (passed via GET) */\n?>\n\n<html>\n```"
  merge: -1
