    # Replacements with Regular Expressions


    Just as you can check to see if a string matches a pattern, you can perform replacements
    when strings match particular patterns. Replacements can be the same for all matches
    of a certain pattern, or they can be based upon what is matched.


    The function you''re going to use to perform these replacements is `preg_replace(string
    pattern, string replacement, string str`. This function uses the following syntax:


    `preg_replace(string pattern, string replacement, string str [, int limit])`


    Where *pattern* is the pattern to match, *replacement* is the string to replace
    the pattern with, *str* is the string to be replacing in, and the optional parameter
    *limit* is the number of times a replacement can be made.


    > **TIP**

    `preg_replace` is case sensitive (which means Jim and jim aren''t considered the
    same). A case insensitive version, `pregi_replace` (the "i" stands for "insensitive")
    takes the same parameters, but works in a case-insensitive fashion, so Jim, jim,
    and JIM are all the same.'
