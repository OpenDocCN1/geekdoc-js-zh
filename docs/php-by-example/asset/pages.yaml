    # Patterns and Arithmetic


    Few uses of arithmetic will just be to modify a number and output the result.
    Instead, you will be using arithmetic to create patterns—however simple or complex
    they might be—to make more visitor-friendly, appealing programs.


    The process of developing a pattern requires that you find an operation or set
    of operations that occur multiple times. For example, in making a table in which
    all of the rows are numbered in order, the pattern requires you to add one after
    each row. Repeating the process yields numbered rows—1, 2, 3, 4, and so on, as
    long as the pattern repetitions continue.


    # NOTE


    Repetitions are achieved by a looping structure—that is, a statement PHP to execute
    one or more commands, what those commands are, and when to stop them. Looping
    statements are covered, along with some more examples of patterns, in Chapters
    8 and 9.


    Other patterns, however, may seem obvious. For example, it is often easier to
    read a table if its alternating lines have alternating background colors. A result
    such as this is easy to imagine—but what kind of pattern could be used to create
    such an effect?


    If you observe numbers alternate between even and odd from one to infinity, you
    have the first half of the pattern—create a variable that'
