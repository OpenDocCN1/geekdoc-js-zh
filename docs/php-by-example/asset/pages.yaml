    as /foo/, the cookie will appear to be empty (which is the same as non-existent
    because in fact the cookie was never sent to the server because the directory
    on the server didn''t match the directory restriction for that cookie).


    # Keeping Cookies Within Your Domain


    In a way that''s similar to keeping domains within only the necessary path, it''s
    important to restrict cookies to your domain. If you don''t, users on other domains
    might be able to see and change your cookies. This can lead to security issues
    or just annoying interference, either way you will want to eliminate the problem.


    If you''re running a large-scale site with its own domain, this restriction is
    even more important than setting the cookie''s path because no other Web sites
    (on a shared server might be in other directories on the same domain) will have
    access to cookies on your domain.


    Therefore, when you''re going to limit a cookie to a particular domain, it''s
    usually okay to only limit its path to /. (The only exception to this rule is
    when other Web sites are on the same domain).


    To set a cookie that is restricted to www.mydomain.com, you would use the:


    ```

    setcookie(''myCookie'', ''some value'', time() + 60*15, ''/'', ''.www.mydomain.com'');

    ```


    Now any script on www.mydomain.com can access and change this cookie.


    Some Web sites have multiple subdomains. For example, if your Web site is big
    enough, it might be on a cluster of servers, such as www1.mydomain.com through
    www4.mydomain.com. To set a cookie that is visible to all of these domains, you
    can simply make it available to all the domains below mymydomain.com using the
    following:


    ```

    setcookie(''myCookie'', ''some value'', time() + 60*15, ''/'', ''.mydomain.com'');

    ```


    If you have multiple domains set up somewhere, you can see this at work using
    this script:


    ```

    <php

    /* ch16ex0.php - demonstrates domain-restricted cookie use */

    ```


    ```

    setcookie(''myCookie'', ''some value'', time() + 60*15, ''/'', ''.mydomain.com'');

    ?>

    ```


    The cookie has been set successfully.


    ![](img/b437c18efec65ed938962e8683b6a70c_358_0.png)'
