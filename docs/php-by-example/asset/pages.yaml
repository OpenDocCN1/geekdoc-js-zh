  md: "It doesn't take a diagram to see that the if statement finds $number equal\
    \ to 1, and 1 is returned. Thus, the factorial of 1 is correctly reported to be\
    \ 1.\n\nNow, what about the factorial of 2? You might want to follow Figure 10.4\
    \ along with this explanation so you can see exactly what the function is doing.\n\
    \n```\nfunction factorial($number) <- $number = 2\n  if ($number == 1) {\n   \
    \ return $number; // Evaluates to false; skipped\n  } else {\n    return ($number)\
    \ * factorial($number - 1);\n    factorial (1)\n  }\n```\n\n```\nfunction factorial($number)\
    \ <- $number = 1\n  if ($number == 1) {\n    return $number; // Evaluates to true;\
    \ returns 1\n  } else {\n    return ($number) * factorial($number - 1);\n  }\n\
    ```\n\n**Figure 10.4:** The factorial of 2 requires the factorial() function to\
    \ call itself once.\n\nFirst, factorial() is called with the argument 2. The if\
    \ check to see if the parameter is 1 evaluates to false, so the code below else\
    \ is executed. This code is a return statement like this:\n\n```\nreturn ($number)\
    \ * factorial($number - 1);\n```\n\nNow, $number evaluates directly to 2. However,\
    \ factorial($number - 1) requires the factorial function to be executed to find\
    \ the value of factorial(2 - 1) or factorial(1)."
