  md: '# The Idea Behind Database-Driven Content


    title, an author, an ISBN number, and so on. This information is shown on every
    page; the only change from page to page is the values of those fields.


    Knowing this, we can separate every page into two parts:


    +   - The Template—A format followed by every page

    - A record—A collection of information about the book


    Thus, we only have to create a single template to display any number of books.
    The template will then be given a single piece of information—an ID number—to
    retrieve and display the information for that book.


    The information is stored in a database. Databases are divided into *tables*,
    which contain records of items (in this case, books). Table 13.1 shows a table
    containing a few dummy entries.


    Table 13.1: A Sample Table for Books


    | id | title | author | isbn |

    | 1 | Some Book | D. Brainiac | 1-2345-6789-0 |

    | 2 | The Other Book | Ima d''Omar | 1-3578-2468-0 |


    # NOTE


    MySQL defines a table as composed of records called *rows* and records called
    *columns*. A column in a particular row may also be referred to as a *field*.


    After we have a template, we essentially have a page for every item in that table.
    All we have to do is fill in the blanks of the template page with the information
    from a row in the table.


    Let''s assume we have a table that contains the data shown in Table 13.1, and
    we''ve created a template like the one shown in Figure 13.1.


    ![](img/b437c18efec65ed938962e8683b6a70c_277_0.png)


    Figure 13.1: The empty template page.'
