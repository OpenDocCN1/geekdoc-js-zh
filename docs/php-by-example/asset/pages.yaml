  md: '# Chapter 15: Allowing Visitors to Upload Files


    uppercases the extension before checking to see if particular array element is
    set to 1. That way, the case that the extension actually appears is negligible,
    but making sure the elements in $UPLOAD_TYPES are in uppercase is essential.


    Also, notice that verify_uploaded_file() accounts for the fact that a file can
    be named with multiple dots, such as my.file.jpg. The function is designed to
    ensure that only the jpg part of the filename is considered part of the extension.
    (This avoids the problem of file.jpg not being a recognized extension.)


    These two considerations are vital to this program working consistently.


    # What to Do with the Uploaded File


    After a file has been verified as a file you want to accept, your script must
    do something with the file. If it doesn''t, PHP will automatically delete the
    file when the script finishes executing.


    As mentioned before, you have a couple of options for where to put the file. You
    can put it somewhere in the Web-accessible part of your server''s file system,
    which is the easiest to do, or you can store the entire file in a database, which
    gives you more control over who sees the file and when they see it.


    # MOVING THE FILE INTO THE WEB FILE SYSTEM


    The developers of PHP added two functions in PHP 4: is_uploaded_file() and move_uploaded_file().
    These functions play a vital role when you get ready to move the uploaded file
    to its final location.


    Before you use those functions, be aware that the three elements in the uploaded
    file array that listed earlier are not the only elements available. The ''tmp_name''
    element is also present.


    For instance, the following script (which should be used in conjunction with the
    form in $ex03.html) will show you where the uploaded file is stored temporarily:


    ```

    /* ex03.php - shows where the uploaded file is stored temporarily */


    echo The file you just uploaded is stored in: ''

    $_POST_FILES[''upload_file''][''tmp_name''];


    ?

    ```


    ![](img/b437c18efec65ed938962e8683b6a70c_334_0.png)'
