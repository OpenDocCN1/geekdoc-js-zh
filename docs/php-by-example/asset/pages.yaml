  md: "# The foreach Statement\n\nIt turns out, in some cases, what you might expect\
    \ to be an array\nis't an array at all. Instead, the supposed array is NULL or\
    \ of some other type, such as int or string.\n\nAssume that the following is an\
    \ excerpt from a longer program:\n\n```\nforeach($arrRecords as $intRecord)\n\
    {\n    (some code here)\n}\n```\n\nThere's nothing that necessarily guarantees\
    \ that $arrRecords is an array. As cautioned earlier, using some other type of\
    \ variables array just won't work with foreach because it's made to be used with\
    \ foreach only.\n\nSo, when you're not sure if a supposed array is actually going\
    \ to be an array, you may want to check using if statement such as\n\n```\nif\
    \ (is_array($arrRecords))\n{\n    (put foreach statement here)\n}\n```\n\nOf course,\
    \ if you're still developing the program, you might raise warnings when the variable\
    \ doesn't turn out to be an array. This would help you find places where you might\
    \ have a type or other error.\n\n# CAUTION\n\nIn accordance with the way the foreach\
    \ loops, the values given to you in a foreach iteration are actually copies of\
    \ the elements of the array. Therefore, changing one of these values doesn't change\
    \ the value within the array. Any changes made to the values are temporary.\n\n\
    # Syntax for Associative Arrays\n\nforeach can also be used to retrieve key/value\
    \ pairs as opposed to just the value, as shown before. Doing this allows you to\
    \ still associate a key with the value related to.\n\nThe syntax for doing so\
    \ looks like this:\n\n```\nforeach (array as key => value)\n{\n    code to repeat\n\
    }\n```\n\nLike the simple first use of the foreach statement, the array is the\
    \ array you want to step through. The key and value are expressed just as they\
    \ are when calling Array() to create an array. Two temporary variables result:"
  merge: -1
  pgno: 193
- img_proc: true
  md: "key, which contains the key associated with the current element, and value,\n\
    which contains the value of the current element.\n\n# Examples\n\nLet's take a\
    \ look at a few examples to get used to the foreach statement\being used this\
    \ way.\n\n+   1. The first example involves using foreach to print a list of array\
    \ ele-\nments along their numeric index. We get the numeric index by\ntreating\
    \ it as the element's key—after all, they are basically the same\nthis.\n\nThe\
    \ following program prints a list of names numbered from 0 to 3:\n\n```\n<php\n\
    /* ch09ex06.php lists contents of array */\n\n$arrNames = Array('Joe', 'Bill',\
    \ 'Arnie', 'Harold');\n\nforeach ($arrNames as $strKey => $strVal)\n{\n    echo\
    \ $strKey . ' ' . $strVal . '<br>';\n}\n?>\n```\n\nThe output of this program\
    \ is as follows:\n\n+   0. Joe\n1. Bill\n2. Arnie\n3. Harold\n\nNow let's say\
    \ we have an associative array that contains various peo-\n's addresses, with\
    \ their names as keys. We can print a list of names\\sand addresses from this\
    \ information, as follows:\n\n```\n<php\n/* ch09ex07.php prints list of names\
    \ and addr */\n\n$arrAddresses = Array(\n    'Joe Williams' => '525 Quiet Circle',\n\
    \    'Rob Thompson' => '1630 Fourth Avenue',\n    'Norm Smith' => '1 Smith Lane'\n\
    );\n\nforeach ($arrAddresses as $strName => $strAddress)\n{\n    echo $strName<br>$strAddress<br>';\n\
    }\n?>\n```\n\n![](img/b437c18efec65ed938962e8683b6a70c_194_0.png)"
