  md: '# Revisiting Output


    Output is the text or information that is sent from your program to the user (specifically,
    the visitor to your Web site). Think of output as anything the user receives from
    a program.


    For example, when you use a search engine, a program performs the and sends back
    HTML data that looks to your browser like other HTML page. The page isn''t like
    other HTML files—it isn''t saved anywhere on the server. The program simply sends
    its output—a customized HTML page—straight to your browser.


    Figure 3.1 illustrates the interaction that might occur between your browser and
    a server when performing such a search.


    ![](img/b437c18efec65ed938962e8683b6a70c_62_0.png)


    **Figure 3.1:** At its most basic level, the interaction between a visitor''s
    browser and your program works like this: A request is sent to the program and
    the program''s output is its response to the browser.


    We''ve already briefly visited one way of sending output—the echo command. Output
    can be sent in several different ways. The method that you use depends on the
    context within the program. The following considerations may influence your decision
    on which method to use:


    +   - The content may vary from one visitor to the next, or it may always be the
    same.

    - The length of the content you wish to send as output might be short (one line
    or a single word), or it could be long (a paragraph, a table, or even a whole
    file).


    The following sections will help you understand when and how to use each method
    of output.


    # The echo Command


    You should decide which method to use to send output based on what you''re sending.
    You must decide whether the content is static or dynamic.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# Revisiting Output


    On top of that, if the content is dynamic, you will have to consider how much
    of it there is to send.


    All output can be divided into two main categories: static and dynamic. **Static
    output** is output that will not change from visitor to visitor; it is hard-coded
    within the file and independent of any variables. **Dynamic output**, on the other
    hand, is an output that contains variables, may change from visitor to visitor,
    or depends upon variables in any way.


    To clarify the division, think of it this way: Static output will never change
    unless someone changes the program itself; dynamic output will change from user
    to user, from one to the next, or depending on outside data source such as a database.
    Figure 3.2 illustrates this.


    ![](img/b437c18efec65ed938962e8683b6a70c_63_0.png)


    **Figure 3.2:** The left side of this diagram shows the interaction between multiple
    visitors and a program that produces static output; the right side shows multiple
    visitors interacting with a program that produces dynamic output.


    The echo command is an excellent choice for dynamic content. It allows you to
    output numbers, text, and variables in one string. While it can be used for static
    content as well, your HTML code will become less readable if you have to "wrap"
    with PHP code (as enclosing in quotes).


    Therefore, echo should only be used to insert small amounts of dynamic content
    at a time.


    The following example demonstrates a PHP program with nothing but static output—it
    returned just as a regular HTML file would be


    ```

    <html>

    <head><title>Example Page</title></head>

    <body>This is an example!</body>

    </html>

    ```


    Since none of this is encoded in PHP tags, every line is sent as output. Also,
    the output doesn''t rely in any way on variables or data sources, so it is classified
    as static.'
  merge: -1
