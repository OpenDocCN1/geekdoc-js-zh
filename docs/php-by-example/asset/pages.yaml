  md: '# Handling the File Upload Request


    When the user clicks the Browse button, the dialog box shown in Figure 15.1 is
    displayed, giving him a chance to select a file and then submit form to a PHP
    script for processing.


    # Handling the File Upload Request


    The rest of the file upload process is handled by another file, the file upload
    handler. This file has a few main purposes:


    +   * To verify that the uploaded file meets the desired criteria, if any

    * To move the uploaded file to its desired final location

    * To respond with a message indicating the file upload


    # File Upload Criteria


    The first thing the upload handler script needs to do is verify that the file
    is the type of file for upload. For example, don''t allow members to upload a
    1MB .exe picture of themselves. Instead, delete the file and tell the user cannot
    upload files of that size and type.


    Three variables help us determine whether we want to accept the uploaded file:


    +   * $_HTTP_POST_FILES[''field name''][''name'']

    * $_HTTP_POST_FILES[''field name''][''type'']

    * $_HTTP_POST_FILES[''field name''][''size'']


    The first variable holds the original file''s name as it was on the client''s
    computer. For example, if I uploaded C:\picture.jpg, this variable would be the
    string "picture".


    The next variable, $_HTTP_POST_FILES[''field name''][''type''], has the MIME type
    associated with the file in the client''s browser. For example, if I send ajpg
    file, the MIME type would be image/jpeg.


    # CAUTION


    The client browser sends this MIME type, you must question its accuracy. If the
    user associates an .exe file with the mime image/jpeg, he could theoretically
    get it through your verification process if you don''t check the file''s actual
    extension and instead rely on the MIME type.


    For this reason, you''ll notice that instead of relying on the MIME type, we extract
    the file''s actual extension and use that.


    The final variable contains the file''s size in bytes. Using this value, you'
  merge: -1
