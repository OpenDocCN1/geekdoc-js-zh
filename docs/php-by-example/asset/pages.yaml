  md: '# Chapter 15: Allowing Visitors to Upload Files


    # STORING AN UPLOADED FILE IN THE FILES TABLE


    This process will be similar to that found in ch15ex04.php, except instead of
    moving the file from the temporary location to a final directory, you''re going
    to read its contents and insert it into the database.


    To read the file''s contents, you''ll use a few functions such as fopen(), fread(),
    filesize(), and fclose().


    The fopen() file open function is used to open a file. To open an uploaded file,
    use fopen() as follows:


    ```

    $file = fopen($_POST_FILES[''upload_file''][''tmp_name''], ''r'');

    ```


    After opening the file, you can read its contents into a variable. The fread()
    function is used to do this. It takes two arguments: the file you opened and the
    number of bytes you want to read from it. Because you want to read the entire
    file at once, the filesize() function is used to get the number of bytes the file
    contains.


    The following statement assigns the contents of $file to $file_contents:


    ```

    $file_contents = fread($file, filesize($_POST_FILES[''upload_file''][''tmp_name'']));

    ```


    > NOTE


    Note that the filesize() function takes an argument that contains the file''s
    name, not the variable of the actual opened file.


    After you have the file contents, close the file, as shown here:


    ```

    fclose($file);

    ```


    These commands are the key change to complete the file upload. Instead of moving
    the file to a different directory, you''re going to read it and put its contents
    into a database.


    Before a call fclose() is included in the upload handler, let''s try it using
    a simple test script. The following program reads a file that is already on the
    server and places it in the files table created earlier:


    ![](img/b437c18efec65ed938962e8683b6a70c_340_0.png)


    > NOTE


    For this program to work, you need to modify the $_MY_FILE variable to point to
    an image that is already on your server. Of course, you will also need to modify
    the MYSQL_* constants found at the top of the program.'
  merge: -1
  pgno: 340
