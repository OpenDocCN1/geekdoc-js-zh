  md: "Try this program with other values, if you wish. Add the contents of\n$strSecondTest\
    \ to $strContainer, for example, to see how the if\nstatement reacts when a match\
    \ is found.\n\n# Using elseif and else Statements\n\nMany times, you don't want\
    \ to do something only if a condition is true,\nalso do something if it isn't\
    \ true. For example, using preg_match as shown\npreviously, you might wish to\
    \ tell a visitor whether a match was found\nnot. Therefore, you must output something\
    \ depending on if the call to\npreg_match succeeds or fails, but the program never\
    \ output both\nstements.\n\nThis is accomplished using an else statement, which\
    \ follows this syntax:\n\n```\nif (condition)\n{\n    statements\n} else {\n \
    \   other-statements\n}\n```\n\n> NOTE\nWhen if and else statements are combined,\
    \ they can be referred to collectively as an\nif-else clause.\n\nSo, to tell a\
    \ visitor whether a match was found, you could use\n\n```\n<php\n/ ch06ex04.php\
    \ - tells visitor whether match was found or not */\n// initialize variables\n\
    $strContainer = 'abcdef';\n$strFirstTest = 'abc';\n\n// if $strFirstTest is in\
    \ $strContainer\nif (preg_match('/$strFirstTest/', $strContainer)) {\n    // notice\
    \ the double closing parenthesis; one for\n    {\n        // preg_match and one\
    \ for the if statement\n        echo \"$strFirstTest was found in '$strContainer'\"\
    ;\n} else {\n    echo \"$strFirstTest was not found in '$strContainer'\";\n}\n\
    \n// Separate first result from second result with an HTML line break\necho \"\
    <br>\";\n```\n\n![](img/b437c18efec65ed938962e8683b6a70c_132_0.png)"
  merge: -1
