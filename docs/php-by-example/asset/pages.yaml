  md: '# Glossary


    **platform** See operating system.


    **program** Any file containing instructions that can be interpreted and executed
    by the machine, whether through an interpreter (as in a PHP script) or directly
    (as in C that has been compiled to machine code).


    **programming language** A written language with which a computer can be instructed.


    **qualifier** A wildcard in regular expressions that determines what characters
    will be matched.


    **quantifier** A wildcard in regular expressions that determines how many characters
    will be matched by a given qualifier.


    **query** A request. In PHP with MySQL, a request to the MySQL server to execute
    a MySQL statement.


    **recursion** The calling of a function from itself. The result is similar to
    a loop, but less efficient and generally more confusing.


    **reference** An alias to a variable.


    **RegExp** See regular expression.


    **regular expression** A collection of special wildcard characters used to search
    strings for only partially known string patterns.


    **row** A single record or entry in a MySQL table.


    **scope** The ability of a variable to be “seen” by certain areas of the script.


    **script** A program that is not compiled, but rather is interpreted from human-readable
    source every time it run.


    **sentinel** A value that counts in a loop or determines when a loop is end.


    **server-side scripting** Scripting that is executed on the server before anything
    is sent to the client.


    **shopping cart** A commonly used online facility for tracking the types and quantities
    of items to be purchased upon checkout.


    **short-circuit evaluation** The concept that an if statement will stop evaluating
    further conditions if it is determined to be impossible for the condition to become
    true. For example, if expr1 (expr1 && expr2) is false, then if expr2 were true,
    the overall condition wouldn’t be true, so PHP stops without even evaluating expr2.


    **special character** A character that represents some other character (such as
    a non-printing character, which normally isn''t visible) or a special'
  merge: -1
