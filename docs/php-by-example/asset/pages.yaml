  md: '# Chapter 4: Arithmetic


    # NOTE


    Compound operators are also sometimes called assignment operators because they
    assign their resulting value to the left operand just like the regular assignment
    operator, =.


    The following code shows an operation performed on a variable without using compound
    operators:


    ```

    <php

    $variable = $variable * 2;

    ?>

    ```


    This example would double the value of $variable. There''s a simpler way to do
    this operation, however.


    A compound operator—that is, an operator that performs more than one task at a
    time—can perform the same operation with less code. There is a compound operator
    for every operator that has been introduced in this chapter, as Figure 4.7 shows.


    | Compound Operator | Operation | Example |

    | --- | --- | --- |

    | += | Add | $variable += 2; |

    | -= | Subtract | $variable -= 2; |

    | *= | Multiply | $variable *= 2; |

    | /= | Divide | $variable /= 2; |

    | %= | Modulus | $variable %= 2; |

    | .= | Concatenate | $variable .= "2"; |


    > Figure 4.7: Compound operators perform the corresponding operation and store
    the result in the left operand.


    # NOTE


    The string concatenation operator and its compound operator are discussed in Chapter
    5, "String Manipulation.".


    To use a compound operator, place the variable to be modified on the left and
    the operation''s other argument on the right side. Here''s an example:


    ```

    <php

    $variable *= 2;

    ?>

    ```


    This segment performs the same task that the segment preceding it did, except
    this time with a compound operator. After this statement, $variable has been doubled
    (multiplied by 2).


    ![](img/b437c18efec65ed938962e8683b6a70c_96_0.png)'
