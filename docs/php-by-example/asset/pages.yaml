  md: '# String Functions


    For example, let''s assume you have a person''s Social Security number stored
    in a string and you want to use the last four digits of the number as the default
    PIN code.


    ![](img/b437c18efec65ed938962e8683b6a70c_105_0.png)


    Let''s assume your program (or a person) has already formatted the string such
    that it is simply a sequence of nine numbers, without hyphens, spaces, or other
    characters separating the numbers. Let''s say the Social Security number is 012-34-5678.
    The sequence is stored in a variable as follows:


    ```

    $SSN = ''012345678'';

    ```


    # TIP


    Notice the string above must be within quotes or it will lose the initial zero.
    Although numeric values may be easily converted back and forth between numbers
    and strings, this one would lose the zero as it became a numeric type.


    It is a good practice to enclose all numbers intended to be used as strings in
    quotes to denote them as strings and not numbers. Not doing so can not yield strange
    results if the number begins with a zero, but it also makes your code obscure.
    Variables intended for use as strings should be coded only strings.


    Now, you want to retrieve the last four characters (in this case, digits) of a
    nine-character string. To do this, use the substr (substring) function. The syntax
    for substr follows:


    ```

    substr(str, int start [, int length])

    ```


    # INTERPRETING SYNTAX GUIDES


    The monospaced text you see just before this block is a syntax guide. It''s a
    brief way of showing how a function is intended to be tells two important things
    about the function: what value is returned and what parameters it takes.


    The function''s return value is given before the function name. In this case,
    it''s the first occurrence of string on that line.


    After the function name, the parameters are given in parentheses, similarly to
    calling the function. The parameter types are given in the typical parameter itself.
    Also, the parameters given here are italicized because they are symbolic names
    for what should be passed as that.


    Syntax guides also tell you which parameters are optional. Optional parameters
    are enclosed in brackets so you''re aware of which parameters are optional and
    aren''t.


    str is the string you want to extract a substring, from start is the index of
    the first character to be extracted, and the optional parameter length is the
    length of the substring you wish to extract. If you leave length out, the string
    returned will go all the way to the end of the string.'
