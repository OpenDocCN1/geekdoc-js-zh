  md: "# The break and exit Statements\n\nThis break is as you've already seen it.\
    \ For example, the following loop uses break to terminate if its counter variable\
    \ becomes a multiple of 10:\n\n```\n$counter = 1;\nwhile ($counter < 100) {\n\
    \    if ($counter % 10 == 0) {\n        break;\n    }\n    echo $counter . '<br>';\n\
    \    $counter++;\n}\n```\n\nThus, the numbers 0–9 are printed.\n\nbreak also accepts\
    \ an optional argument that tells it how many looping structures to break. The\
    \ syntax for this is as follows:\n\nThe level specified determines how many loops\
    \ to break.\n\nFor example, take a look at the following code, which contains\
    \ nested loops:\n\n```\n<?php\n$counterA = 0;\nwhile($counterA < 4) {\n    $counterB\
    \ = 0;\n    while ($counterB < 4) {\n        if ($counterA == 2 && $counterB ==\
    \ 2) {\n            break 2;\n        }\n    }\n    echo \"After if statement:\
    \ \\counterA = $counterA, \\counterB = $counterB<br>\\n\";\n    $counterA++;\n\
    }\n```"
