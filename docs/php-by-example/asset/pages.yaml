    # MySQL TIMESTAMP TYPE


    This type was created to give you a versatile way to store date and time information.
    A TIMESTAMP field contains a number in the format YYYYMMDDHHMISS (such as 20010522000101
    for 12:01:00AM on May 22, 2001). This representation for a date/time combination
    is common in Unix-based systems, which is understandable because it is a compact,
    easily manipulated representation.


    In fact, PHP provides a date() function that allows you to format a time stamp
    to meet your needs. Following are several formats that the date() function can
    create:


    +   - 12:01 AM, January 1, 2001

    - 00:01 01/01/01

    - 1 Jan 2001 - 12:01am


    The date() function is how you''ll usually interpret the information held in a
    TIMESTAMP field. The syntax of the date() function is as follows: date($Format,
    [$intTimestamp])


    The format($Format) of your date determines how your date will look. A few examples
    of formats have been given to show how versatile the date() function is: Table
    13.3 details the formatting symbols that are accepted. The following examples
    illustrate how the formatting symbols are used together in a string to produce
    a formatted date.


    # CAUTION


    The format MySQL uses to store a TIMESTAMP and the Unix-standard format expected
    as the $intTimestamp are not the same. When we get to SELECT, you''ll see how
    to use one of MySQL''s functions to convert the MySQL timestamp to something PHP
    can handle.'
