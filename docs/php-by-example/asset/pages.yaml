  md: '# Cookies


    Cookies, like sessions, are a means of remembering information about a particular
    visitor between page views. You''ve seen this done using sessions: A user can
    log in, the login script sets a session variable to mark this user as logged in,
    and the user can continue without logging again. Cookies are slightly different
    from sessions in that you have control over how the data is kept. You can also
    specify certain servers or even directions on servers that are to have access
    to the information in a cookie. In a way, cookies are more flexible—but they''re
    not for every application.


    This chapter will teach you the following:


    +   * How cookies work

    * How to set a cookie

    * How to control who sees your cookies

    * Cookie paranoia and the cookie virus myth

    * How to ensure your visitors'' privacy


    # Cookie Overview


    A cookie is a very small piece of data passed from a Web site to a visitor''s
    browser, where it is saved to be sent back to the server whenever subsequent requests
    are made. When a Web site sends data to a browser to be saved as a cookie, it''s
    said that the server is setting a cookie. Many sites today use cookies in some
    way or another. Because all the variables you create and use in a PHP script are
    destroyed after the script finishes executing, the next visitor goes won''t have
    access to the old values you had created in the previous script. Cookies are a
    means for getting around this problem because they enable you to store data between
    page'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Chapter 16: Cookies


    Cookies are like sessions. They both hold a piece of information about a particular
    visitor. However, cookies are stored on the visitor''s computer, whereas session
    data is kept on the server. This, in itself, has some advantages and disadvantages.
    A crafty user can modify the values of his cookies if he wants to editing the
    browser''s cookie file. (For instance, in Windows, Netscape can be found in C:\Program
    Files\Netscape\Users\Default\cookies.txt.) However, a user cannot modify session
    data because it is stored on the server—out of reach.


    # TIP


    For users: To see the cookies that other Web sites have already stored on your
    computer, go to Start, click Search, and click Files For Orders. To search for
    the cookies on your computer, simply enter the word "cookie" (without quotes)
    into the search box and press.


    The cookie files on your computer should turn up in the Search Results Dialog.
    To view the cookie data, single-click on the file; then, while holding Shift,
    right-click on the file and Open With... Select WordPad from the Open and click
    OK. Doing so will display the data stored in that cookie.


    Cookies do, however, have advantages over sessions. For example, a user''s session
    expires (he closes his browser, for instance), his session data disappears. Unlike
    sessions, you can set an expiration date for a cookie. Of course, it''s not 100%
    guaranteed that the cookie will be because you have no control over preserving
    data on your visitor''s computer, but it will be more of the time. When a cookie
    expires, it is not a matter of life and death. Cookies are often set only to make
    a visitor''s experience on a Web site more convenient.


    # How Cookies Work


    Cookies are sent and received within the headers of HTTP transactions. For example,
    when you first visit a Web site, the site probably has no cookies to set because
    it has little information about who you are. Also, because it''s your first time
    visiting the site, you won''t have any cookies already on your computer for that
    site. Thus, your browser won''t set information to the server, and the server
    won''t set new cookies in your browser.


    However, after you log in to the site, the site will remember you by an ID number
    or maybe your username. (In fact, in Chapter 14, "Using PHP for Password Protection,"
    when we used sessions to remember a logged in visitor''s username, PHP automatically
    set an ID number in a cookie so it could identify the visitor and retrieve his
    session information when he future requests. ) This cookie is sent back as part
    of the headers that precede the HTML page (which is called the body).'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Setting Cookies


    Upon subsequent requests, your browser will always send back any cookies the server
    has set. This way, if a program needs to remember some value, it can send that
    value to the visitor in the form of a cookie (which is usually transparent to
    the user), and then the value becomes available to other scripts as the browser
    sends back for each subsequent request.


    In short, whenever you visit a Web site, your browser checks to see if cookies
    are available in its cookie file that have been sent by that. If there are, the
    browser adds a note to the server in its request header saying, "cookie called
    ''user_id'' was set with the value ''someuser''—in a more technical way, of course.
    If more than one cookie exists, they will all be sent back like that.


    # Setting Cookies


    A cookie is set by adding a header to the HTTP response that goes back to the
    visitor. The setcookie() function is used to do this.


    > TIP

    A cookie can also be set using the header() function and adding a Set-Cookie header
    with all of the appropriate formatting and parameters, but the setcookie() function
    takes care of those details automatically to ensure the cookie is sent properly,
    so it''s best to use the setcookie() function.


    The setcookie() function has the following syntax:

    setcookie(name, value [, expires [, path [, domain [, secure ]]])


    Like variables, all cookies must have a name and a value. A basic cookie can be
    set using the setcookie() function:

    setcookie(''someCookie'', ''This is the value'');

    Executing this statement would cause a cookie called someCookie containing This
