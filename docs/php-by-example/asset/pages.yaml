  md: '# Basic Conditionals


    Here are a few examples:


    +   * Is$intA less than $strB?

    * Does $strA have the same value as $strB?

    * Is $form[''emailAddress''] empty, or does it contain something?


    These comparisons can all be made using conditional operators, which are operators
    that compare two values and return a Boolean value.


    # NOTE


    Because of their purpose, conditional operators are sometimes referred to as comparison
    operators.


    The syntax for conditional operators is the same as other binary operators; that
    is, one value should be placed on each side of the operator, as shown here:


    ```

    value operator value

    ```


    Table 6.1: The Comparison Operators

    | Operator | Name | Example |

    | --- | --- | --- |

    | == | Equal | $var1 |

    | === | Identical | $var1 === $var2 |

    | != | Not equal | $var1 != $var2 |

    | !== | Not identical | $var1 !== $var2 |

    | > | Greater | $var1 > $var2 |

    | >= | Greater or equal to | $var1 >= $var2 |

    | < | Less | $var1 < $var2 |

    | <= | Less or equal to | $var1 <= $var2 |


    The == and === operators (and their != and !== relatives) aren''t the same. The
    first, which checks values for equality, compares values of the same data type.
    If they aren''t the same type, == typecasts them before they are compared. Therefore,
    the string "1" and the integer 1 are the same.


    On the other hand, === checks each value''s type before comparing the actual value.
    If the types don''t match, the variables aren''t considered the same, and false
    is returned. Only if two variables are identical (that is, their type and value
    both match) will this operator return true.'
