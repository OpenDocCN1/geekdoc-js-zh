    ```\n\nThe output of this program is\nJohn Williams, 43\nArnie Stevens, 35\nBill\
    \ Baker, 39\n\nThe elements 0, 2, and 4 of the array are people' names. So, $a\
    \ starts at 0 and increases by 2 for every repetition of the loop. To get each\
