  md: '# Writing a Basic PHP Program


    The process of creating a PHP program isn''t much different from the process you
    follow to create a regular HTML page.


    # CAUTION


    FTP servers (primarily those on Unix-based systems) require you to use a certain
    FTP "mode": either binary (for images, sounds, and other non-ASCII files) or ASCII
    (plain-text files, such as HTML, PHP and TXT).


    Although the FTP transfer appears to be successful, a program transferred in binary
    may not run at all. If this happens, you will receive a "500 Internal Error" response
    from the server.


    ![](img/b437c18efec65ed938962e8683b6a70c_25_0.png)


    Now that you''ve seen the overall process, let''s take a look at our first PHP
    program. After reading the following example, you''ll learn what it separates
    it from a normal HTML file, how to upload it to your Web server, and what the
    page should look like viewed in your browser.


    ```

    <!-- File: ch01.php -->

    <html>

    <head><title>PHP By Example :: Chapter 1 :: Example 1</title></head>

    <body bgcolor="white" text="black">

    <h4>PHP By Example :: Chapter 1 :: Example 1</h4>


    <?php

    /* Display a text message */


    echo ''Hello, world! This is my first PHP program.'';


    ?>


    </body>

    </html>

    ```


    This file looks a lot like a regular HTML file. Notice that the file has HTML
    tags of those you would find in any HTML file. In fact, if you disregard everything
    between the <?php and ?, you might rename this file with an .php extension.


    However, this file contains PHP code, so it must be named with a .php extension.
    The PHP code lies between the PHP tags <?php and ?> as shown in Figure 1.1. The
    command between the PHP tags is echo (the PHP''s word for “adding the following
    text to the page”) followed by the text to display. The output, which will be
    shown, looks just as if the text after echo had been in an HTML file itself and
    no PHP code ever existed.'
  merge: -1
