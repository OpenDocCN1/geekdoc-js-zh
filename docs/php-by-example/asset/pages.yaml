  md: '# Writing a Full Program


    In the development process, the effectiveness of your planning will be directly
    evident in the quality of the program you produce. Planning wisely will also reduce
    the amount of time it takes you to code the program.


    The importance of planning can be demonstrated in areas other than alone. For
    example, imagine driving a 400-mile trip to somewhere-you have never been before
    without looking at a map. Chances were you would get lost. Even if you had a decent
    idea of where you were the whole time, you probably wouldn''t take the quickest,
    most direct route to your destination.


    This works the same way in programming. If you spend some time planning what you''re
    going to do (and even toss around some ideas of how you''re going to do), you''ll
    end up with a clearer picture of what you need to do, and as a result you will
    work faster.


    This process is basically a matter of brainstorming and effectively writing the
    ideas you get. After you have some ideas, you can consider more closely you''re
    going to do things. In the process of doing that, it''s likely that you''ll want
    to get rid of a few bad ideas, and maybe add a new ones. As you continue to rework
    your ideas on paper, your program''s potential quality steadily increases.


    It usually seems at first like you should be able to do this process while you''re
    coding, and many novice programmers make the mistake of writing a program without
    planning it first. Imagine the problems you would run into, if you were in the
    middle of coding a program and realized you didn''t like the way you had written
    one of the main features. As a result, you might have to rewrite 1/3 of the code
    before you continue. Setbacks that can generally be avoided with a little planning.


    # Planning Your Guestbook


    Because your program is going to act as a guestbook, you should already have some
    kind of idea of what it''s going to do. At the very least, the point of a guestbook
    is to take the names and the brief message from your visitors, your program should
    do that.


    First, start writing down ideas of the obvious things your program should do.
    Because you''re writing a fairly simple program, that''s the only thing we really
    want.'
