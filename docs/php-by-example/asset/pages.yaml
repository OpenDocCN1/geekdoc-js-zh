  md: '# # Introduction


    # ## About This Book

    If you already have a good understanding of HTML, and now you want to make your
    Web pages do more, then this book is for you!


    This book is written to teach Web designers who have never programmed before or
    who have little experience programming how to program in PHP. Along the way, you
    will will pick up important concepts such as object-oriented programming and the
    creation of database-driven Web sites. If you are a Web designer and you want
    to increase your skills and knowledge of Web programming, this book is an excellent
    place to start.


    This book will lead you through explanations of all the concepts involved in programming
    Web applications in PHP. You will learn to write your Web programs, and with a
    constant emphasis is placed on important coding practices, your code will be quality.
    High-quality code is an important skill that all programmers should have. Understanding
    coding style and other common practices will also make you more productive, meaning
    you will spend less time correcting errors and more time getting done.


    Finally, by reading this book, you will catch hints related to Web programming
    that will bring you much closer to being a knowledgeable PHP programmer, rather
    than just a beginner. Being self-taught, I''ve spent many, hours in discussion
    groups, chat rooms, and making lists—not to mention browsing PHPrelated sites,
    articles, and the PHP Manual—to learn PHP and the tricks of the PHP community.
    The hints and tricks I have learned have been interspersed as appropriate hints
    throughout this book. Needless to say, you will find in this book what would take
    months to learn about your own—especially because a lot of the time you don''t
    even know specifically what you''re looking for.


    # ## Chapter by Chapter

    Part of 1 of this book, “Getting Started with Programming in PHP,” introduces
    you to the beginning concepts of PHP programming. In Chapter 1, “Welcome to PHP,”you''ll
    create your first PHP program by following simple step-by-step instructions. If
    your program doesn''t work right away, don''t worry—a troubleshooting procedure
    is included to help you pinpoint and eradicate the problem.


    Chapters 2 through 5 continue teaching you the basics. You''ll learn about variables
    and constants, program input and output, performing arithmetic, and doing basic
    string manipulation (separating “Butzon, Toby” into “Toby” and “Butzon” for example).'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Introduction


    Part II, “Control Structures,” introduces you to the beginnings of programming
    logic. Chapter 6, “The if, elseif, and else Statements,” will teach you about
    conditions and conditional statements such as if, else, and elseif. When you get
    to Chapter 7, “The switch Statement,” you’ll learn about another type of control
    structure called the switch statement. Chapter 8, “Using while and do-while,”
    and 9, “Using for and foreach,” will introduce you to the while and for looping
    statements (respectively) and their relatives, do-while and foreach.


    Part III, “Organization and Optimization of Your Program,” will teach you the
    organizational techniques that will make coding and maintenance of your programs
    more understandable and efficient. Chapter 10, “Functions,” teaches you about
    writing programs as sets of functions, making your code cleaner and more maintainable.
    You’ll be introduced to object-oriented programming in Chapter 11, “Classes and
    Objects,” as classes and objects are introduced. Finally, Chapter 12, “Using Files,”
    will wrap up the organizationfocused part of the book by teaching you how to divide
    your programs into logical files. You’ll also learn how to create function and
    class libraries, which will be useful whenever you create code.


    The final part of this book, Part IV, “Advanced PHP Features,” will teach you
    about useful features of PHP that aren’t typically built-in features of other
    languages. In PHP, building database-driven Web sites is easy with integrated
    MySQL support (Chapter 13, “Creating Dynamic Content with PHP and a MySQL Database,”).
    A discussion of how to password-protect areas of your Web site with PHP is covered
    in Chapter 14, “Using PHP for Password Protection,” and Chapter 15, “Allowing
    Visitors to Upload Files,” teaches you how to create a program to let users upload
    files to your server (within the restrictions you set, of course). Finally, Chapter
    16, “Cookies,” will teach you about cookies, as well as dispel myths about them.


    The final chapter, “Putting It All Together,” is designed to help tie the concepts
    you have learned together into one final program. The program is a basic guidebook
    implementation that teaches you how to approach the creation of a Web program.
    Besides the programming concepts and style you have been taught in the rest of
    the chapters, this chapter also approaches concepts such as the file system organization
    of a PHP program and adopting a uniform program layout with header and footer
    include files.


    # You’ll Need


    Before you begin reading Chapter 1, you will need to have access to a PHP Web
    server. If you don’t, don’t fret—you can set up one on your workstation. Although
    it’s not a good idea to host a Web site on your computer because your personal
    workstation won’t be as reliable as a dedicated server, you can use a server on
    your own machine to run your programs and verify that they work.'
