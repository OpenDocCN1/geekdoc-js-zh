    # Expressing Multiple Conditions


    Using if-elseif-else clauses and nesting if statements are good if you have an
    action to perform for each condition. However, this isn''t always the case. For
    example, the login example given earlier in this chapter, it was necessary to
    check both the username and password at the same time. You don''t really care
    if only one of them is correct; you just want to know if they are.'
