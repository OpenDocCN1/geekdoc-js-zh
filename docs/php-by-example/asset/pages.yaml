  md: "```\n<?php\necho 'I'm about to say hello...<br>';\nfunction sayHello() {\n\
    \    echo 'Hello, World!';\n}\nsayHello();\necho '<br>';\necho 'I said hello,\
    \ see>';\n?>\n```\n\nFigure 10.1: When a function is called, its body is executed\
    \ before flow returns to the statement following the calling statement.\n\n# NOTE\n\
    \nAs you've already read, it doesn't matter where in the program the function\
    \ definition is, as long as the function is defined. In the previous diagram,\
    \ the function is shown beside the code for clarity. However, the function would\
    \ typically appear after the other program code.\n\n# Scope\n\nFunctions have\
    \ their scope, so variables that exist within one don't exist in the program,\
    \ as well. This is helpful because programmers don't have to spend their time\
    \ worrying about accidentally modifying a variable's not meant to be changed.\n\
    \nTake this function call, for instance:\n\n```\n$temp = 5;\ndoSomething();\n\
    echo $temp;\n```\n\nIf doSomething() is defined to be\n\n```\nfunction doSomething()\
    \ {\n    $temp = 0;\n}\n```\n\nand if the scope restriction didn't exist, the\
    \ result of the echo statement after execution returns to the main program would\
    \ be 0. With a variable named $temp, probably would not be the desired behavior.\n\
    \nTherefore, variables inside of functions are completely different than the variables\
    \ outside of them. This way, the call to echo $temp results in 5 being output.\n\
    \n![](img/b437c18efec65ed938962e8683b6a70c_204_0.png)"
