    The output changes each time you run the program, depending on what URL you specify.
    Although this program is very basic, it shows the definite usefulness of variables.


    # TIP


    The URLs aren''t as complex as they might seem; we''ll pick these apart and discuss
    them in Chapter 3. For now, notice that in each URL, a different value is specified
    for strText, and when you enter each URL, the program displays the corresponding
    value.


    It is important to note that although variables and constants serve the same purpose,
    they aren''t at all identical.


    Whereas, the value of a variable might change any number of times throughout the
    execution of a program, constants are values that will not change (and in fact
    can''t) during the execution of the program.'
