  md: "# Setting Up the Basics\n\n# Setting Up a User Table\n\nTo authenticate users,\
    \ you'll use a table in a MySQL database. Setting up a user table shouldn't be\
    \ much of a challenge. Our purposes require only two columns: for a username and\
    \ for a password.\n\n# NOTE\n\nBecause we covered database interaction in Chapter\
    \ 13, \"Creating Dynamic Content with PHP and a MySQL Database,\" we're not going\
    \ to focus on it too much here. However, to ensure you understand what's going\
    \ on every step of this process, the table creation statement is presented here.\n\
    \nThe statement used to create the table is as follows:\n\n```\nCREATE TABLE users\
    \ (\n  user TEXT NOT NULL,\n  pass TEXT NOT NULL\n);\n```\n\n![](img/b437c18efec65ed938962e8683b6a70c_307_0.png)\n\
    \nAs you have guessed, this simple table will hold all of the usernames in the\
    \ user column and the passwords in the pass column. Because each username/password\
    \ combination is stored in a new row, checking to find whether a username and\
    \ password are correct will involve finding a row where the username and password\
    \ are entered in the form. We'll discuss the details of this later in the section\
    \ \"Making Sure the Username and Password Are Correct.\"\n\nHowever, while we're\
    \ working with the users table, let's add a few dummy entries we can work with\
    \ later. They are as follows:\n\n```\nINSERT INTO users SET user='asmith', pass='smitty';\n\
    INSERT INTO users SET user='johnr', pass='spot';\n```\n\nThis outputs a table\
    \ that looks like this:\n\n+----------------++\n| user | pass |\n+----------------++\n\
    | asmith | smitty |\n| johnr | spot |\n+----------------+-\n\n# Getting the Username\
    \ and Password\n\nFor now, the first step (getting a username and password from\
    \ the user) will be accomplished with an HTML form because this method is the\
    \ easiest."
  merge: -1
