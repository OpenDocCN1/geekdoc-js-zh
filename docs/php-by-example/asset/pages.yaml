- img_proc: true
  md: "# Handling the File Upload Request\n\n327\n\n+   - Fewer people on your system\
    \ will have access to or get ideas to change the files.\n\n+   - You will have\
    \ more control over what visitors view files. For example, you can require a user\
    \ to be authorized to your PHP login system before they are allowed to view any\
    \ files.\n\n+   - Files can collide with one another. For example, if two users\
    \ have a picture cat.jpg, the second picture would either mysteriously not be\
    \ able to upload his file or his file would overwrite the first user's file, baffling\
    \ and probably frustrating the first user. However, with a database, the files\
    \ would be stored in separate rows regardless of the filename. Like-named files\
    \ will not collide.\n\n# CREATING A TABLE FOR FILES\n\nCreating a table where\
    \ files can be stored involves working with a MySQL column type you haven't seen\
    \ before: the BLOB type. A BLOB is a binary-safe version of the TEXT type, which\
    \ means data is not readable text will will not be interpreted as readable text;\
    \ instead, it will be read and stored strictly as data.\n\n# CAUTION\n\nBLOB columns\
    \ are sensitive if you store data in them and then try to search them with a MySQL\
    \ query. If you're not storing binary data (for example, if you're going to store\
    \ text files), go on store it in a TEXT column. BLOB columns are best used for\
    \ binary data.\n\nThe regular BLOB column, allows 65,535 bytes (about 65KB) to\
    \ be stored in it. To accommodate files that might sometimes be a bit larger than\
    \ that, the MEDIUMBLOB type (which accepts up to 16,777,215 bytes, or about 16MB)\
    \ will be used.\n\nDepending on your use for this type of system, the table could\
    \ be designed in a few different ways. You'll need a reliable way to recall files\
    \ using a SELECT ... WHERE query. You could assign the file an auto-incremented\
    \ file ID, or could allow users only to upload one file and then use the user's\
    \ login name for the file identifier. For now, an ID number should serve as a\
    \ good demonstration.\n\nThe following SQL statement defines a table you can store\
    \ file data:\n\n```\nCREATE TABLE files (\n  file_data MEDIUMBLOB NOT NULL,\n\
    \  id UNSIGNED AUTO_INCREMENT PRIMARY KEY\n```\n\n);"
  merge: -1
  pgno: 339
