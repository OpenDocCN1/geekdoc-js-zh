    function ShowAllEmails($host, $user, $pass) {

    /* PRE: $host, $user, and $pass are valid

    PST: returns a string containing all of the messages separated by newline

    */

    $sock = fsockopen($host, 110, $errno, $errstr);

    or die("FSOCKOPEN Error: " . $errno . ": " " . $errstr . "\n");

    strist(\$response = pop_get_response_line($sock), "+OK") == $response

    or die("Connection failed!");

    pop_nd($sock, "USER");

    strist(\$response = pop_get_response_line($sock), "+OK") == $response

    or die("Unable to verify USER");

    pop_nd($sock, "PASS");

    strist(\$response = pop_get_response_line($sock), "+OK") == $response

    or die("Unable to verify PASS");

    pop_nd($sock, "STAT");

    strist(\$response = pop_get_response_line($sock), "+OK") == $response

    or die("Unable to delete verify message!");

    $message_count = split(" ,", $response);

    for ($i = 1; $i <= $message_count[1]; $i++) {

