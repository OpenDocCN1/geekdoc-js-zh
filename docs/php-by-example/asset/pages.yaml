  md: '# What Are Classes and Objects?


    A class is used to define a collection of variables and functions that work together.
    A class is actually a new variable type, comparable to the numeric and string
    data types already found in PHP, but unlike the predefined types, a class can
    be customized to fit your needs. Thus, classes are also known as abstract data
    types (ADTs) because they allow you to define a type way you want.


    A class defines a new variable type to model a concept, such as a bank account
    or a shopping cart. After the class (a data type) is defined, an instance of that
    type must be created. An instance is simply a variable that follows the structure
    of a class. For example, an instance of an int is a variable that contains an
    integer; likewise, an instance of a given class is a variable that contains data
    of that class''s type. An instance of a class is usually called an object.


    A class tells what an object should look like. A car class might have, model,
    and color properties associated with it. Thus, an instance of the car (an object)
    should contain data matching the class''s description—model, and color.


    # TIP


    The relationship between a class and an object will become clearer after we''ve
    used them both.


    In modeling the behavior of a concept, both variables and functions must be contained
    within the class. For example, to model a dog, we might have variables that tell
    us the dog''s attributes, such as weight and color.


    However, we haven''t fully modeled a dog just having its properties; we need to
    model its behavior, as well. This will be done by functions. Such functions for
    a dog might include barking, eating, and sleeping.


    # TIP


    The important thing to remember is that we''re trying to model a concept or a
    physical object using an abstract data type in PHP Although you probably wouldn''t
    want to model the behavior of a dog, if you understand the relationship between
    a dog''s properties (color, weight) and its functions (barking, sleeping), you
    will understand how to separate other concepts into similar divisions of variables
    and functions.


    Commonly modeled concepts, such as bank accounts, shopping carts, or item inventories,
    will be discussed and defined in classes as we move through this topic.'
  merge: -1
