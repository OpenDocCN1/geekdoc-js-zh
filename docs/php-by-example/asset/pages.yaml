  md: '# Designing and Creating a Table in MySQL


    # TIP


    If you need to store numbers even bigger than these, look into BIGINT in the MySQL
    manual.


    The NOT NULL option specifies whether you want a NULL value to be placed in the
    column if no value is specified at insertion time (whenever a row is inserted).
    If you would rather have the value default to a non-NULL value, you must specify
    NULL. For INTs, NOT NULL is given and no other default value is specified (with
    DEFAULT), 0 is used.


    As you might expect, DEFAULT allows you to choose the default value if NOT NULL
    is specified (Therefore, if DEFAULT is used, NOT NULL accompanies it.). To specify
    a default value, simply use the DEFAULT keyword, followed by a space and the value
    you want to use. Use of the DEFAULT option will be clearer when you look at the
    following examples the explanations of the rest of the options for INT.


    AUTO_INCREMENT is a special option that is allowed only once per table. It tells
    MySQL to use the incremented value last used for this column. For example, if
    the last value used was 127, then 128 will be used this time, and in the future
    129, 130, and so on will be used. When using AUTO_INCREMENT, you cannot specify
    the value to be inserted into the column; you basically have a system for assigning
    a unique ID number to each row within a table.


    # CAUTION


    An AUTO_INCREMENT column must always have the NOT NULL option specified or it
    will not work properly.


    That brings us to the last option, PRIMARY KEY. This option tells MySQL that this
    value should be indexed and used as a reference for finding the row. This goes
    hand-in-hand with the unique ID number data expressed in the previous paragraph.
    If you use an AUTO_INCREMENT column, you will be required to make it a PRIMARY
    KEY to tell MySQL that it should be a unique value used to reference each row
    in the table.


    # NOTE


    Although the AUTO_INCREMENT option has an underscore separating its words, PRIMARY
    KEY and NOT NULL do not.


