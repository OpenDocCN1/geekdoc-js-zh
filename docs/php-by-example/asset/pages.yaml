  md: "# The while Statement\n\nHere are some examples of the output:\n\n| URI | RESULT\
    \ |\n| ch0ex03.php?first=1&last=5 | 15 |\n| ch0ex03.php?first=10&last=13 | 46\
    \ |\n| ch0ex03.php?first=1&last=100 | 5050 |\n\n+   2. Similar to finding sums\
    \ is finding factorials. In this case, instead of adding a series of numbers,\
    \ we'll multiply them.\n\nThe following program, like the previous one, requires\
    \ that a value be specified in the query string to tell it of which number to\
    \ find the factorial:\n\n```\n<?php\n/* ch0ex04.php - computes factorial for a\
    \ number\nnum passed via GET\n*/\n\n// Make reference to input variables\n$ArrIn\
    \ ==$_HTTP_GET_VARS;\n\n// Make sure num is specified\nif ($ArrIn['num'] == ''\
    \ || $ArrIn['num'] < 1) {\n    echo \"You must specify num (>= 1) in the URL!\"\
    ;\n    exit;\n}\n\n// Compute total\n$counter = $ArrIn['num'];\n$total = $counter;\n\
    while ($counter > 1) {\n    $counter--;\n    $total *= $counter;\n}\n\n// Display\
