    # The DELETE STATEMENT


    The DELETE statement is used to remove records from a table. DELETE is almost
    always in conjunction with WHERE, because if it isn''t, every record in the table
    will be deleted.


    # CAUTION


    Keep in mind that one wrong DELETE—that is, one without a WHERE clause—wipe wipe
    an entire table in your database. Be careful when adding DELETE statements to
    existing systems to make sure you use a WHERE clause to limit what is deleted.


    To delete a row, simply use the following syntax:


    ```

    DELETE FROM members WHERE condition

    ```


    ![](img/b437c18efec65ed938962e8683b6a70c_303_0.png)


    For example, to delete the record in members with an age less than 30, the following
    command could be executed:


    ```

    DELETE FROM members WHERE age < 30

    ```


