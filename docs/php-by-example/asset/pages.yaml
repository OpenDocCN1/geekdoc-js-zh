- img_proc: true
  md: '# Chapter 16: Cookies


    It’s not quite possible to make a cookie “never expire,” though you have to simply
    set it ahead enough to give that effect. Five years should be plenty, and 10 years
    would almost be overkill. However, as long as 10 years ahead is a valid time stamp
    (time stamps only go until sometime in the year 2038), you might as well run with
    it.


    The following statement calls setcookie() with an “infinite” expiration setting:


    ```

    setcookie(''Username'', $username, time() + 60*60*24*365);

    ```


    This example assumes that a username is stored in $username. The username would
    be posted from the login form, for example.


    # NOTE


    You might find it strange and alarming time stamps are only valid up to some in
    the year 2038. However, it’s not a grave concern.


    The reason time stamps can only go to 2038 is that the size of the number used
    to represent a time stamp is limited. When the number can’t grow any without adding
    digits, the Unix time of today will be obsolete.


    Of course, with the speed of the development of computers, the current time stamp
    system will be outdated long before the year 2038.


    As you can see, cookies allow you to yield much more flexibility over how long
    the data is kept than sessions. Information you could only store for a single
    visit with sessions can be stored for an almost infinite period of time.


    # Restricting Access to a Certain Path


    Being able to extend the lifetime of a variable saved in a cookie also requires
    the responsibility of protecting cookie data as much as you can. After all, if
    you don’t, other sites might be able to see and even change the data in your cookies
    (which they do inadvertently or on purpose).


    Restricting a cookie to a specific path causes it to only be sent when the browser
    notices is in (or below) a particular directory. For example, if you set a cookie
    with the path /, any directory on your Web server can see and modify cookie.


    The following script sets a cookie for the root web directory on your server:


    ![](img/b437c18efec65ed938962e8683b6a70c_356_0.png)


    ```

    <?php

    /* ch1603.php - sets a cookie for the root path */


    setcookie(''myRootCookie'', ''Cookie value'', time() + 60*15, ''/'');


    ?>

    ```


    EXAMPLE'
