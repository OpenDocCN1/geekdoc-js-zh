  md: "# The foreach Statement\n\nThe syntax for the foreach loop is as follows:\n\
    \n```\nforeach (array as value) {\n    code to repeat\n}\n```\n\nHere, the array\
    \ whichever array you're trying to step through. The array's current element is\
    \ the temporary variable where the value of the array will be stored. And, as\
    \ you probably guessed, the code to repeat is the code that is be repeated for\
    \ each value in the array.\n\n# CAUTION\n\nIf there is a chance that your array\
    \ will be an empty array or that the variable specified isn't an array at all,\
    \ you should add extra error checking to ensure the type and contents of the variable.\
    \ Otherwise, you run the risk of having PHP issue when it reaches the foreach\
    \ statement.\n\nIf this happens, the warning will be: Invalid argument supplied\
    \ for foreach(...).\n\n# TIP\n\nIf you would like to implement the error checking\
    \ mentioned in the previous note, you'll need to use the type checking function\
    \ is_array in connection with an if statement.\n\nFor information about the is_array\
    \ function, see: http://www.php.net/manual/function.is_array.php.\n\nThe error\
    \ checking code should look like:\n\n```\n// Make sure $someArray is an array\n\
    if (! is_array($someArray)) {\n    die('$someArray isn't an array!');\n}\n```\n\
    \nYou might not want the program to stop (if it reaches die); in that case, try\
    \ using instead of die.\n\n# Examples\n\nLet's look at some examples to get to\
    \ know the foreach statement better.\n\n+   1. For the first example, we'll use\
    \ foreach to print each element of an array. We'll step through the array foreach\
    \ as discussed previously, printing each element as we go, as follows:\n\n![](img/b437c18efec65ed938962e8683b6a70c_191_0.png)\n\
    \n```\n<?php\n/* ch09ex.php - prints contents of an array */\n\n$arrNames = Array('Joe',\
    \ 'Bill', 'Arnie', 'Harold');\n\nforeach ($arrNames as $strName)\n```"
