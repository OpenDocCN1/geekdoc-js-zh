  md: "# Chapter 9: Using for and foreach\n\nThe array might look something like this:\n\
    \n```\nArray(\n  [0] => \"John Williams\",\n  [1] => 43,\n  [2] => \"Arnie Stevens\"\
    ,\n  [3] => 35,\n  [4] => \"Bill Baker\",\n  [5] => 39 )\n```\n\nOf course, as\
    \ you've probably already noticed, this would be much more appropriately implemented\
