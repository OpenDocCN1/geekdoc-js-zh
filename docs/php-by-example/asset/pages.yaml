  md: 'From the previous example you should recall that PHP doesn''t interpret text
    placed outside of the PHP tags at all. So, the text "$Variable" was output just
    as it appeared in the code when it was outside of the PHP tags. However, when
    it was mentioned inside the tags in a double-quoted string it was interpreted
    as a variable and the value of that variable was output instead of the actual
    text "$Variable."


    This is a more appropriate use of echo; notice that only a single line (the one
    with the variable) was sent with echo. The rest of the output was sent as static
    output. It will never change and therefore doesn''t need echo.


    # CAUTION


    If the strings following echo in the previous example had single quoted, they
    would not have been interpreted, and the static output and dynamic output would
    output the same.


    # Using Here-doc


    So you''ve seen output by placing it outside of the PHP tags and output sent using
    one-line echo statements. Now lets a take at how ways to send large amounts of
    dynamic output without the tediousness and confusion of using multiple echo statements.
    This is important: In the future, you might find yourself writing programs in
    which more than 75% of your program is dynamic output.


    There are two ways to send large amounts of dynamic output: Use a single echo
    statement, reducing the clutter of outputting multiple lines of data with echo,
    or use static output and insert PHP tags to print variables wherever necessary.


    The first method is called here-doc (short for "here-document"). Here-doc helps
    you, the programmer, create clearer multiline strings; it behaves as a double-quoted
    string, but in a more readable fashion. It also allows you to use only one echo
    statement, as opposed to the clutter of repeated echo statements.


    PHP understands and executes the following code, but because the string might
    not end for many lines and any double quotes within the string must be escaped,
    the purpose and contents of the string can become unclear:


    ```

    <php

    /* $chex03.php - demonstrates multi-line double-quoted string */


    // Multi-line double-quoted string

    echo "<html>

    <head><title>Example</title></head>

    ```'
