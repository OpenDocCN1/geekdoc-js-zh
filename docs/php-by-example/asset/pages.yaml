- img_proc: true
  md: "# Basic Conditionals\n\nIn the simplest sense, all decisions are made based\
    \ on a condition: some-thing that may or not be true.\n\nTo see this out, look\
    \ at a few of the decisions you might make from day to day:\n\n+   * It's trash\
    \ day, take the trash to the curb.\n* If the car is low on gas, stop and fill\
    \ it up.\n* If it's raining, take an umbrella.\n\nNotice that all of these statements\
    \ follow a certain pattern: A condition is given, and then an action is given\
    \ that should be performed if only if the condition is true.\n\nThus, if it's\
    \ trash day and you consider the first example, the condition (whether it's trash\
    \ day) will be true. So, you take the trash to the curb (or tell else to do it).\n\
    \nThe statement specifies a command (or multiple commands) that should be executed\
    \ if a given condition is true. If an statement evaluates as a Boolean expression;\
    \ if a condition doesn't result in a Boolean value, it is typecast to a Boolean.\n\
    \nNOTE\n\nYou may wish to review Chapter 2, \"Variables and Constants,\" for information\
    \ Booleans and the rules followed by PHP in typecasting other types to Booleans.\n\
    \nThe if statement follows this syntax:\n\n```\nif (condition)\n{\n    statements\n\
    } else\n{\n    statements\n}\n```\n\nNOTE\n\nThe lines enclosed in braces are\
    \ collectively called a block.\n\nCondition is any statement or expression that\
    \ evaluates to true or false. Statements may be one or more statements formatted\
    \ just as any other PHP statements would be formatted, except indented one level\
    \ deeper (usually all four spaces or one tab) for good style. The optional else\
    \ keyword and"
  merge: -1
  pgno: 128
- img_proc: true
  md: "# Basic Conditionals\n\nblock allow you to execute a different set of statements\
    \ when the condition is false. else will be discussed later in this chapter, in\
    \ \"Using elseif and else Statements.\"\n\nThe following example helps demonstrate\
    \ the syntax to use with if statements:\n\n```\n<php\n/* ch06ex01.php - demonstrates\
    \ simple use of if statement */\n\n// Condition 1\nif (true)\n{\n    echo \"Condition\
    \ 1 outputs this.\";\n}\n\n// Condition 2\nif (false)\n{\n    echo \"Condition\
    \ 2 outputs this.\";\n}\n?\n```\n\nWhen run this program, only the following text\
    \ appears:\n\n+   - Condition 1 outputs this.\n\nThe second if statement does\
    \ not allow for multiple commands. The first if statement finds that the condition\
    \ specified in parentheses is true, so it executes the command given after it\
    \ in curly braces. (If you want the condition to execute multiple commands, you\
    \ can place the additional commands inside the curly braces.)\n\nThe second if\
    \ statement does not allow the code below to execute, though, because the condition\
    \ it's given is explicitly as false.\n\n> NOTE\n\nThe previous example always\
    \ prints the result as shown.\n\nCode as such, however, has no practical use;\
    \ if you're just going to specify true or false as the condition, you might leave\
    \ the if statement out altogether. Instead, if statements are more appropriately\
    \ used with variables and constants.\n\nThe following program shifts from using\
    \ true/false values, aren't very useful in a practical program, to using variables\
    \ that will evaluate to a true or false value (all variables evaluate to one or\
    \ the other, depending on their value):\n\n```\n<php\n/* ch06ex01.php - demonstrates\
    \ simple use of if statement */\n```"
  merge: -1
