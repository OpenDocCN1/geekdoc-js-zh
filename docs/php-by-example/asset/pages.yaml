  md: "# Chapter 10: Functions\n\n# Referenced Parameters\n\nReferences are often\
    \ useful for modifying more than one value with a single function call. Typical\
    \ functions can only change one value in the global scope (by returning it and\
    \ having the return value assigned to the variable in the main program). However,\
    \ using referenced parameters, any argument that is passed into the function will\
    \ be modified at the global scope if it is modified within the function.\n\n#\
    \ NOTE\n\nVariables are also sometimes passed using references to avoid the overhead\
    \ it to copy a large variable (such as an object or a large array). If you must\
    \ this, be very careful not to change the value of the variable you intend to\
    \ change the variable at the global scope. Without making a copy of the variable\
    \ (by passing it in normally), there's no guarantee that the variable will be\
    \ unchanged after the function executes.\n\nGenerally, you'll use referenced parameters\
    \ to return more than one in the global scope with one function call.\n\n# SYNTAX\n\
    \nWhether a variable is passed by reference or not is decided by the function\
    \ definition by placing an ampersand before each parameter that should be passed\
    \ by reference. The syntax is\n\n```\nfunction name(&parameter1, &parameter2,\
    \ ...)\n{\n    function body\n```\n\n# NOTE\n\nBecause the parameter list can\
    \ go on ad infinitum, the parameter list in this syntax guide is simply left open-ended\
    \ with an ellipsis.\n\n# TIP\n\nThis lists all of the parameters of this function\
    \ as referenced parameters. You'll see in some of the following examples, not\
    \ all of the function's parameters have to be referenced.\n\nOnly the parameters\
    \ that need to be referenced should be referenced.\n\n# EXAMPLE\n\nOne common\
    \ use for referenced parameters is in certain array sorting algorithms. Although\
    \ PHP has built-in functions for this (such as sort() and as()), it's handy to\
    \ know a little bit about array sorting works,\n\n![](img/b437c18efec65ed938962e8683b6a70c_216_0.png)\n\
    \nEXAMPLE"
  merge: -1
  pgno: 216
- img_proc: true
  md: "especially because a common array sorting algorithm is perfect for using\n\
    referenced parameters.\n\nArray sorting, speaking very generally, involves comparing\
    \ certain values\nwithin an array to other values within the array. (The difference\
    \ in algorithms-nis a matter of which elements are compared and in which\n the\
    \ comparisons are performed.) A selection sort begins with the first\nelement\
    \ of an array and compares it to all of the other values in the array.\nThe smallest\
    \ value found is swapped with the first value, thus performing\nt first iteration\
    \ of the sort. The process moves on to the second value, this\ntime disregarding\
    \ the first value as a possibility, and the next smallest\nvalue is found. It,\
    \ like the first, is swapped to the second position in the\narray and whatever\
    \ value was the second position is moved to the loca-\nwhere the smallest value\
    \ was. This process goes on until the greatest value, as the array\nsorted from\
    \ least to greatest value, Figure 10.3.\n\n![](img/b437c18efec65ed938962e8683b6a70c_217_0.png)\n\
    \nFigure 10.3: A selection sort selects the smallest value in an array and\nmoves\
    \ to its appropriate location closer to the front of the array.\n\nIn 10.3, the\
    \ numbers with a box around them represent the left\nboundary of the numbers being\
    \ considered in finding the minimum value.\n(Considering the numbers sorted to\
    \ the left would always yield the same value\n, thus failing to sort the array).\n\
    \nThe numbers circled are the ones found to be the minimum value for\nparticular\
    \ iteration, and thus their values are swapped with the current\nleftmost “boundary”\
    \ value (the one with a box around it). The arrows show\nthis swapping. After\
    \ the values are swapped, a new array is formed the\nfollowing the one you were\
    \ looking at), and the process repeats\nwith the left boundary moved to the right.\n\
    \nSo, what does all this have to do with referenced parameters? Well, the\nprocess\
    \ of swapping two values sounds like it could make a good function.\nAfter all,\
    \ if you make it for this sorting algorithm, another one down the\nroad might\
    \ be able to use it too."
  merge: -1
  pgno: 217
