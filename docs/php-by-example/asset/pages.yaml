    The output of this program, assuming it is run after ch14ex04.php is visited,
    is as follows:


    Username stored in session: jmith


    > TIP

    Just as you can get the value of a session variable by accessing its element in
    the $HTTP_SESSION_VARS array, you can also change its value.


    > CAUTION

    If you fail to initialize the session with session_start(), the $HTTP_SESSION_VARS
    array will not exist and changes to it will not be saved between pages.


    # Applying Sessions to a Login Script


    Now that you know how sessions work, you can apply that knowledge to the authentication
    script so that users who have logged in once will not have to log in again to
    access other pages.


    To incorporate sessions into the login script, you have to start a new session
    and store the user''s username in $HTTP_SESSION_VARS[''user''] when the user first
    logs in. Addition, you have to change the login script to check whether a value
    is already present in $PHP_SESSION_VARS[''user''], which would signal that the
    user is already logged in, before it checks for a POSTed username and password.


    The revised include file version of the script:


    ```

    <php

    /* ch14ex05.php - login include file

    Only lets visitors see the page if they log in

