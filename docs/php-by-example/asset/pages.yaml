  md: '# Classes and Objects


    As you learned in the previous chapter, functions provide a way for you to divide
    your program''s tasks into separate, smaller tasks. Classes and objects are somewhat
    similar in helping you to organize your program. They are used to create collections
    of related variables and functions, which can be used to more accurately represent
    real-life situations.


    This chapter teaches you the following:


    +   * How to define classes

    * How to instantiate objects

    * Member variables and functions

    * The this variable

    * How to serialize and unserialize objects

