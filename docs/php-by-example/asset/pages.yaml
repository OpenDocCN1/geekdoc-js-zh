  md: "# Basic Conditionals\n\n```\n// See if $strSecondTest is in $strContainer\n\
    if (preg_match(\"/$strSecondTest/\", $strContainer)) {\n    echo '$$strSecondTest'\
    \ was found in '$strContainer';\n} else {\n    echo '$$strSecondTest' was not\
    \ found in '$strContainer';\n}\n```\n\nRunning this program produces the following\
    \ output:\n'abc' was found in 'abcdef'\n'ghi' was not found in 'abcdef'\n\nAs\
    \ you can see, the program now has a reaction for both conditions: If the match\
    \ is found, it says one thing, but if a match is not found, it says others.\n\n\
    You may also have a certain series of conditions, for each of which wish to perform\
    \ a certain task. In English, this would equate to: \"If condition A is true,\
    \ do this; or if condition B is true, do this; otherwise, do this.\" There could\
    \ be more conditions checked, as well; they would be phrased like-condition.\n\
    \nFor example, let's assume you put someone into a four-category age-grouping\
    \ system. The ages are divided as follows:\n\n+   * Group A—Ages 20 and younger\n\
    * Group B—Ages 21 to 40\n* Group C—Ages 41 to 60\n* Group D—Ages 61 and older\n\
    \nThis involves using a combination of if, elseif, and else to find which age\
    \ group is appropriate and assign the corresponding letter to a variable.\n\n\
    # TIP\n\nThe less than operator (<) is used in this example; it is introduced\
    \ in more depth a bit later in this chapter.\n\nBasically, an expression using\
    \ the less than sign evaluates to true if the left operand is less than the right\
    \ operand.\n\nHere's the program:\n\n```\n<?php\n/* ch06ex0.php - assigns an age\
    \ group for the specified age */\n\n// Grab $intAge from POST array\n$intAge =\
    \ $_HTTP_POST['age'];\n```\n\n![](img/b437c18efec65ed938962e8683b6a70c_133_0.png)"
