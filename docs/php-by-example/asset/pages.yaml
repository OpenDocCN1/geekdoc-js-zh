  md: '# Using PHP for Password Protection


    One of PHP''s many useful abilities is user authentication—that is, the ability
    to password-protect certain programs. Password protection is quite common on the
    Web today. It''s on about every interactive Web site you visit, from Hotmail''s
    e-mail service to the forums on DevShed (an online Open Source Web development
    area). These sites have found that it''s better to ask a user to log in once,
    rather than prompt him for his name and password every time he wants to do something.
    (It makes sense to only do it once anyway, doesn''t it?)


    If you plan to allow more than a few users to access a password-protected area
    of your Web site, if you want users to be able to register and log in instantly
    at your Web site, or if you would like to create personalized services such as
    member profiles, then you will definitely find this aspect of PHP quite useful!


    This chapter teaches you the following:


    +   - How to set up a user database

    - How to create a simple authentication form

    - How to verify a username and password pair

    - How to remember who is logged in

    - How to use HTTP headers instead of an HTML form to collect the username and
    password'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Chapter 14: Using PHP for Password Protection


    # Goals of Authentication with PHP


    You might be familiar with the standard features of your Web server, which probably
    allow you to password-protect certain files and directories on your Web site.
    In the Apache Web server, for example, you can add directives to an .htaccess
    file that tells the server to require a certain user (or a user who is a member
    of a certain group) to log in before he is given access to particular resources.
    Similarly, in Microsoft''s Internet Information Server and other Windows servers,
    you can set file and directory permissions to require users to log in, as needed.


    The drawback to these methods is that you have limited flexibility for adding
    and removing user accounts. For example, if you created a way for new users to
    register, sending the contents of a form to you by email, you would still have
    to manually create each user. Not only would this take one or two of your time,
    but it would require the user to wait until his account has been created (It''s
    a little-known fact that people don''t like to wait—especially on the Web.).


    To make things quick and easy for your visitors and to keep you from having to
    do little repetitive tasks (which is one of the main goals of programming away),
    we''re going to look at using PHP to automate this process. More specifically,
    we''re going to look at how you can use a user database to authenticate users.


    Besides simply authenticating users, we''ll briefly cover how you can tell which
    user is logged in from within your PHP program. This will allow you to customize
    your Web site to the particular user who is viewing it. Thus, you can program
    a Web-based mail client, a personalized contact manager, or just whatever you
    want. Whenever a user is logged in, you can make your Web site customize itself
    to that visitor.


    # Setting Up The Basics


    Before we can begin with the technical details, it''s important to get a clear
    understanding of the process that we''re planning to follow. To authenticate a
    user, you have to perform the following steps:


    +   1. Request a username and password.


    +   2. Verify the username/password combination.


    +   3. Respond to the request based on whether the username and password are valid.'
  merge: -1
  pgno: 306
