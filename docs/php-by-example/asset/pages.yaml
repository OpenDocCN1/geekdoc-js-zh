  md: '# Variable Types 37


    # NOTE


    PHP has limitations within the integer type. On 32-bit platforms, integers are
    limited to 32-bit numbers (-2,147,483,648 to 2,147,483,648); on 64-bit platforms
    integers are limited to 64-bit numbers (-9,223,372,036,854,775,808 to 9,223,372,036,854,775,808).
    This generally doesn''t become a problem, but if you attempt to handle extremely
    large values (negative or positive), you might find that results aren''t as expected.
    This is a limitation of all programming languages and there is information on
    the PHP Web site for using larger numbers, you should have the need.


    # Floating-Point Numbers


    A floating-point number (commonly referred to simply as a float or double, which,
    in PHP, are exactly the same thing) is a numeric value with a decimal point.


    The following are all floating-point values:


    +   - 5.5

    - .055e2 (scientific notation for .055 times 10 to the second power, which is
    5.5)

    - 19.99


    The second example is a float represented in scientific notation. The e, as is
    often the case on graphing calculators, means "times 10 to the it". It is followed
    by whatever power 10 should be raised in order to put the decimal value you want
    it. Thus, .055e2 is the same as .055 times 10, which is 5.5.


    Floats also have limitations—floats are accurate enough for general-purpose use,
    but if you need to store a number with an extremely long decimal value, you will
    need to look into the arbitrary precision math functions (BCMath or GMP) on the
    PHP Web site.


    Also, because of these limitations, you must realize that a float isn''t exactly
    what you think it is. For example, 1/3 can be represented as .33333333... in the
    computer''s memory; the 3''s repeat forever, so it''s impossible to be completely
    accurate. It''s best to decide on how much precision you desire (for instance,
    dealing with money, you''d choose 2 decimal places) and keep in mind that your
    decimals are no more accurate than that. Thus, you will reduce your chances for
    strange results when calculating (which is discussed in Chapter 4, "Arithmetic")


    # Arrays


    Arrays are a little different than the numeric data types discussed far. Arrays
    can be thought of as lists of variables, all can contain within one variable.
    These variables can contain values of any data type, including'
