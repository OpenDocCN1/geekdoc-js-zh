  md: '# What''s Next


    The first step to referencing text that was matched is to understand how parentheses
    influence the referencing of text. Every set of parentheses in a regular expression
    means that it is a segment of the expression that is to be referenced. If you
    don''t intend to reference the value of a matched expression, it''s generally
    a good idea not to enclose it in parentheses unless you have to.


    Now you will be able to use the value of a certain set of parentheses. Each value
    is a variable named after an integer in numeric sequence, starting at one. As
    a rule, the whole string is always $0. So the first of parentheses encountered
    from the left would be $1, the second would be $2, and so on.


    To match an e-mail address, use the expression


    ```

    $matchEmail = ''[a-zA-Z0-9\._\+-]+@([a-zA-Z0-9\-]+\.[a-zA-Z0-9\-]+)+'';

    ```


    And to make it clickable, do a preg_replace like this:


    ```

    $matchEmail = ''[a-zA-Z0-9\._\+-]+@([a-zA-Z0-9\-]+\.[a-zA-Z0-9\-]+)+'';

    echo preg_replace($matchEmail, ''<a href="mailto:$0">$0</a>'', $str);

    ```


    The preg_replace goes through the string and finds anything that looks like an
    e-mail address (as we''ve specified in the regular expression) and replaces it
    with a link, using the value found with the regular expression both as the link
    value and the link text. Here''s the HTML output:


    This is my email address:


    ```

    <a href="mailto:example@example.com">example@example.com/</a>

    ```


    This covers the basic idea behind doing string replacements with references. Using
    references, you''re able to manipulate text to a virtually unlimited extent.


    # What''s Next


    Now you''ve learned about input and output, variables manipulation (including
    math and string functions), you''re ready to move to the next step.


    In the next few chapters, you''ll learn how to include conditional logic (decisions
    such as "if this is true, do this; otherwise, do that") and repetition (a group
    of commands a number of times). These new additions will give your programs a
    surprising amount of power.


    ![](img/b437c18efec65ed938962e8683b6a70c_123_0.png)'
