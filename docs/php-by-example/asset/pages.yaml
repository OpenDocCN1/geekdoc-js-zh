  md: "# Syntax 175\n\nThus, you have created the PHP-equivalent of\n\n```\n1 + 2\
    \ + 3 + ... + 9 + 10\n```\n\nOr, more generally, assuming A and B are functionally\
    \ equivalent to the variables $intStart $intEnd in the program, the sum is\n\n\
    ```\nA + (A + 1) + (A + 2) + ... + (B - 1) + B\n```\n\nThis whole process of summing\
    \ a range of numbers is most of interest to mathematicians. You will probably\
    \ use it (or some variation of it, the other examples show), but in the case of\
    \ most sums, a more efficient calculation can be done with an explicit formula.\
    \ Depending on how efficient your program must be, and how strong your mathematics\
    \ skills are, your choice to use a for loop or derive an explicit formula is completely\
    \ up to you. (The loop is favor for simplicity.)\n\n+   This example demonstrates\
    \ the third parameter to the for statement can be any sort of modification to\
    \ the sentinel variable. This time, instead of counting up (incrementing), we're\
    \ counting down (decrementing):\n\n```\n<php\n/* ch0ex2.php - demonstrates decrementing\
    \ with for */\nfor ($a = 10; $a >= 1; $a--) {\n    echo $a . '<br>';\n}\n?>\n\
    ```\n\nThe output of this program is a list of numbers from 10 to 1, in that order.\
    \ The same principle works with multiplication, division, and even modulus division,\
    \ you should find an application that requires those operations. Notice, however,\
    \ that these operations (multiplication, division, and modulo) do not have unary\
    \ operators like the increment and decrement operators. So, you must use the compound\
    \ operators, such as *= and %. The same holds true if you wish to add or subtract\
    \ some number other than 1. The += and -= operators are handy in such situations.\n\
    \n+   Let's suppose for a moment that you have an array with a given structure,\
