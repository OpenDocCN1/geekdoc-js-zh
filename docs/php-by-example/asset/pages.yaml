- img_proc: true
  md: '# The switch Statement


    As you learned in the previous chapter, an if-elif-else clause is ideal for making
    decisions based on any number of conditions. The switch statement performs a very
    similar function. However, unlike an if-elif-else clause, the switch statement
    compares one value to any number of possibilities specified by the programmer.
    This behavior will be explained in more depth as you move further into this chapter.


    This chapter teaches you the following:


    +   * The differences between switch and if-elif-else


    +   * The syntax for the switch statement


    +   * How to break switch statement execution


    +   * How to specify a default case


    +   * How to create multifunction pages'
  merge: -1
  pgno: 149
- img_proc: true
  md: "# Introducing the switch Statement\n\nA switch statement is used to compare\
    \ a single variable with multiple possible values. For example, in the previous\
    \ chapter you created a program to determine your user's age group (A, B, C, or\
    \ D) depending on his age. If you wanted the program to invert this process, say\
    \ to give the user a friendlier representation of his age group (such as 20 and\
    \ younger, 21 to 40, and so on), you would use a switch statement to compare the\
    \ age group to the letters A, B, C, and D to see which letter matched.\n\nGranted,\
    \ this could be done with an if statement, but switch has some advantages over,\
    \ namely speed and style.\n\nFirst of all, if is slower than switch. When you\
    \ use if and else statements, PHP evaluates each condition separately. For example,\
    \ let's say you chose to code the program I just described using an if-else-if-else\
    \ clause; it would probably look like this:\n\n![](img/b437c18efec65ed938962e8683b6a70c_150_0.png)\n\
    \n```\n<?php\n/* chex01.php - demonstrates age output using an if-elseif-else\
    \ clause */\n\n// Specify age group\n$ChrAgeGroup = 'B';\n\n// Output user-friendly\
    \ representation of age group\nif ($ChrAgeGroup == 'A') // Group A: 20 and younger\n\
    {\n    echo \"Ages 20 and younger\";\n}\nelif ($ChrAgeGroup == 'B') // Group B:\
    \ 21 - 40\n{\n    echo \"Ages 21 to 40\";\n}\nelif ($ChrAgeGroup == 'C') // Group\
    \ C: 41 - 60\n{\n    echo \"Ages 41 to 60\";\n}\\else // Group D: 61 and older\n\
    {\n    echo \"Ages 61 and older\";\n}?>\n```\n\nThis program works just fine.\
    \ For example, if you were to run it as, the output would be:\n\nAges 21 to 40"
  merge: -1
  pgno: 150
- img_proc: true
  md: "# Introducing the switch Statement\n\nHowever, each condition is evaluated\
    \ independently; that is, the first condition ($chrAgeGroup == 'A') is evaluated,\
    \ and if it is false, the next condition ($chrAgeGroup == 'B') is evaluated, and\
    \ so on, until a condition is found to be true. The value of $chrAgeGroup must\
    \ be recalled from memory for each condition evaluated. This causes a small delay\
    \ each time, which results in a slightly slower time for the page to be retrieved.\n\
    \nThe delay by an element of a program, whether it is a reference to a variable,\
    \ a function call, or the execution of a few collective statements, is called\
    \ processing overhead.\n\nIf one of your programs performs a more complicated\
    \ task than another and therefore runs a bit slower, it's said that the delay\
    \ in response is due to the program's overhead.\n\nIn-medium-traffic Web sites,\
    \ this isn't usually a problem. The delay caused by using if-else-else instead\
    \ of switch is probably, in most cases, only a few of your CPUs clock cycles (a\
    \ fraction of a second); in fact, you probably can't measure a difference without\
    \ a very quick, precise benchmarking program.\n\nHowever, in a large-scale Web\
    \ site, any amount of delay that could be eliminated is unacceptable. For such\
    \ a Web site, even a tenth of a second per program execution would add quickly,\
    \ eventually slowing down the whole site.\n\nBy using a switch statement, the\
    \ delay is reduced significantly. Instead of retrieving a variable's value for\
    \ every comparison, the value is retrieved only once at the beginning of the statement.\
    \ Thus, the delay of retrieving the value for every condition is eliminated.\n\
    \nAside from the speed differences, which may be negligible to you at this point,\
    \ switch makes your code clearer. Let's examine the syntax and an example of switch\
    \ to discuss the increased clarity of switch over if.\n\n# Using the switch Statement\n\
    \nHere's the syntax for a switch statement:\n\n```\nswitch (variable)\n{\n  case\
    \ value:\n    code;\n    break;\n  case value:\n    code;\n    break;\n  default:\n\
    ```"
  merge: -1
  pgno: 151
- img_proc: true
  md: "# Chapter 7: The switch Statement\n\n```\ncode;\nbreak;\n```\n\nThe variable\
    \ would be the variable that you're comparing to a list of values. The values\
    \ each represent a possibility, or case. As you can see, cases are given after\
    \ a case statement. Following the case statement is a colon and one or more statements\
    \ to be executed, if that case is true.\n\n# NOTE\n\nIf you provide more than\
    \ one case that could match, the first one match will be executed and the switch\
    \ will stop being evaluated at the first break encountered.\n\nFor example, if\
    \ the integer 1 is given as the value for switch, and there is a case for 1 and\
    \ another for true, whichever case comes first is the only one that has its code\
    \ executed.\n\nbreak statements are used to separate each case; if you do not,\
    \ the statements for all of the following cases will be executed, even when the\
    \ cases don't match the variable's value. Once a is matched, the code inside will\
    \ be executed until a break statement is reached. The default statement is optional;\
    \ it prevents a default case that should be used if no other case matches the\
    \ variable.\n\n# CAUTION\n\nDon't confuse the statement-terminating semicolon\
    \ with the colon used with case statements or vice versa. case statements are\
    \ followed by a colon, suggesting that the statement introduces a section of code\
    \ to follow. On the other hand, a semicolon is used to terminate all other statements.\n\
    \nLet's rewrite the previous example using a switch statement:\n\n![](img/b437c18efec65ed938962e8683b6a70c_152_0.png)\n\
    \n```\n<?php\n// /ch0ex2.php - demonstrates age output using a switch statement\
    \ *\n\n// Specify age group\n$chrAgeGroup = 'B';\n\n// Output user-friendly representation\
    \ of age group\nswitch ($chrAgeGroup) {\n    case 'A':\n        echo \"Ages 20\
    \ and younger\";\n        break;\n    case 'B':\n        echo \"Ages 21 to 40\"\
    ;\n```"
  merge: -1
  pgno: 152
- img_proc: true
  md: "# Introducing the switch Statement\n\n```\nbreak;\ncase 'C': // Group C: 41\
    \ - 60\n    echo \"Ages 41 to 60\";\n    break;\ncase 'D': // Group D: 61 and\
    \ older\n    echo \"Ages 61 and older\";\n    break;\n```\n\n```\n}\n```\n\n```\n\
    ?\n```\n\n# CAUTION\n\nLet reiterate that you should be careful not to leave out\
    \ the break statement. In this example, if the break statements were omitted,\
    \ the last three echo statements would all execute the second case matches. The\
    \ output would be:\n\nAges 21 to 40Ages 61 and older\n\nThis unexpected output\
    \ not looks bad—it doesn't say anything because the age can only be one of the\
    \ three.\n\n# TIP\n\nSince 'D' is the last case, the break following it is optional;\
    \ it wouldn't cause any other code to be executed because it's at the end of the\
    \ switch block. However, it's a good idea to include the break away; if you or\
    \ someone else back and adds more cases later, the missing break may be overlooked,\
    \ leading to a hard-to-find bug in your program.\n\nNotice how clearly this code\
    \ expresses that it is determining which value is in $chrAgeGroup. One reason\
    \ switch clarifies code because you know it only performs equality comparisons.\
    \ Also, the complex looking parentheses and curly braces of the if-elseif-else\
    \ clause are gone, making the code easier to read. These improvements increase\
    \ the overall quality of style of your code.\n\n# TIP\n\nAnother tip for switch\
    \ statements: Place the cases in the order of the most likely to be used. Putting\
    \ the most-used cases at the top of the switch block makes it easier to find them\
    \ if you have to come back and modify the code. It may also provide a marginal\
    \ speed increase in the execution of your script.\n\nThese style issues, as well\
    \ as the speed benefit discussed earlier, are why switch should always be used\
    \ when trying to find the specific value of a variable."
  merge: -1
  pgno: 153
- img_proc: true
  md: "It shouldn't go unsaid that some things are better off left to if. In some\
    \ cases, this is obvious. For example, take a look at the following code:\n\n\
    ```\n<?php\n* ch07ex03.php - ridiculous use of switch *\n\n// Assign a number\
    \ to be compared\n$intNumber = 7;\n\nswitch ($intNumber > 5)\n{\n    case true:\n\
    \        echo '$intNumber is greater than 5';\n        break;\n    case false:\n\
    \        echo '$intNumber is less than or equal to 5';\n        break;\n} // Assign\
    \ a number to be compared\n$intNumber = 7;\n\nswitch ($intNumber > 5)\n{\n   \
    \ case true:\n        echo '$intNumber is greater than 5';\n        break;\n \
    \   case false:\n        echo '$intNumber is less than or equal to 5';\n     \
    \   break;\n}\n```\n\nAlthough this code is acceptable to the interpreter, it's\
    \ confusing. This switch block is acceptable to PHP; however; it is evaluated\
    \ as follows:\n\n+   1. The expression provided as the variable ($intNumber >\
    \ 5) is evaluated, producing a result of true.\n2. True is compared to the first\
    \ case (true) and it's determined that they match.\n3. The code for the first\
    \ case is executed and the switch block breaks.\n\nNOTE\nBy saying that the switch\
    \ block breaks, I mean that the rest of the block is skipped and execution picks\
    \ back up after the closing brace of the switch block.\n\nFor this task, it's\
    \ obvious that an if-else clause would be more appropriate.\nThe default case\
    \ is useful when you know an unanticipated value might be used. Using a default\
    \ case, you can specify a task to perform if there isn't a match with one of the\
    \ other cases.\n\nUsing default, the age group program could be modified to check\
    \ for an age group that isn't understood, as follows:\n\n```\n<?php\n* ch07ex04.php\
    \ - demonstrates age group output with error checking */\n```"
