    The following shows the syntax for the WHERE clause:


    WHERE `condition`


    That''s nearly not too difficult. The condition here is typically a comparison
    of a field to a value or to another field. Using a WHERE clause is quite simple:
    You just append it to your SELECT statement.


    For example, the following command would retrieve all the rows where the date_joined
    value is later than January 1, 2001:


    ```

    SELECT FROM members WHERE date_joined > 2001010100000

    ```


    ![](img/b437c18efec65ed938962e8683b6a70c_302_0.png)


    > TIP

    Recall the timestamp is in YYYYMMDDHHMMSS, so the number here can easily be interpreted
    as Jan. 1, 2001, at 00:00:00.


    After you have the results from a SELECT statement with a WHERE clause, you can
    access them as you did with a basic SELECT statement, using mysql_fetch_array()
    until it returns false.


    > NOTE

    You''ll also use the WHERE clause with the DELETE command. DELETE''s use is identical
    to its use with WHERE; with either command, it limits which rows are acted upon.


    # THE UPDATE STATEMENT


    The UPDATE statement is used to change records that are already in a table. UPDATE
    is usually used with a WHERE clause to limit which records are modified; if you
    don''t specify a WHERE clause, every record in the table will have the same update
    executed on it.


    The syntax for UPDATE


    ```

    UPDATE SET `field1`=''value'', `field2`=''value2'' WHERE `field3`=5

    ```


