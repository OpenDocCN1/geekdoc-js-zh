    # Performing Basic String Replacements


    Another type of string manipulation is comparable to a word processor''s Find
    and Replace utility. A string replacement occurs when a particular string is replaced
    with another string within a larger string. This is commonly used for


    +   - Removing possible occurrences of obscene words from publicly submitted text

    - Changing plain-text characters into HTML characters (such as regular newlines
    into <br> tags)

    - Changing Windows return plus newline\r\n) to Unix-formatted newlines (\n)


    The function to perform simple string replacements with str_replace. Here''s the
    syntax:

    str_replace(string find, string replace, string str)


    Where is the string that should be found, replace is the string to replace all
    occurrences of find with, and str is the string to perform replacements.


    # NOTE


    Notice that str_replace is pretty straightforward. The only way to get the result
    of the replacement value is to store this return value (either to a new variable
    or back to the original variable passed as str). The str_replace function does
    not modify str on its own.


    The use of str_replace is pretty straightforward. Assume the string $text contains
    some text from a user submitted that''s going to be displayed on a Web site. If
