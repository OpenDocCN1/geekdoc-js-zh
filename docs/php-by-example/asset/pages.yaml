  md: "# Defining a Class\n\nA class is defined using the class keyword, as follows:\n\
    \n```\nclass class_name\n{\n  var variable1, variable2;\n  var variable3;\n\n\
    \  function function1(argument_list)\n  {\n    function1_body\n  }\n\n  function\
    \ function2(argument_list)\n  {\n    function2_body\n  }\n}\n```\n\nHere, class_name\
    \ is the name of the class you're creating (such as bank_account).\n\nInside the\
    \ class, the member variables and functions are declared. Any number of member\
    \ variables can be declared, and the data type (such as int, string, array, or\
    \ even object) does not need to be given. In fact, even though the variables are\
    \ declared, they are undefined because no values are given when they are declared.\n\
    \n> NOTE\nAlways declare the class's member variables at the top of the class\
    \ to let you and other programmers who might use the class know what the class's\
    \ member variables are.\n\n> TIP\nAlthough it is possible to define a class and\
    \ not list member variables, it isn't good programming to do so because it forces\
    \ a programmer to read through the entire program to figure out what member variables\
    \ are used with the class.\nMember variables that are to be used should always\
    \ be declared var at the top of the class. If you later decide to add another\
    \ member variable, go back and add it where the other members are declared.\n\n\
    After the member variables come the class's function declarations. A class's member\
    \ functions are declared just as they would be if they weren't in a class."
