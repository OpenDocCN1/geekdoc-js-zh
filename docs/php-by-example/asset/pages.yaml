    The first comment found is a very short file header that tells the file''s name.
    Following it there is a comment describing the action taken by the first echo
    command. Comments such as this can help clarify things, but use them discretion.
    The comment has no good use in this case because it doesn''t say anything we can''t
    pick up directly from the statement. Generally, use a comment if you (or someone
    else who might read your code) doesn''t immediately understand the code when you
    look at it.


    Following that we have a multiline comment that is commenting a block of code
    that we wanted to stop from being processed by PHP. PHP will therefore ignore
    the last echo statement. Notice that it''s perfectly legal to have a single-line
    comment within multiline comments.


    Take note of how comments are used and make use of them in your own code. It''s
    much easier to read a comment and know what something does rather than having
    to read the code and figure it out step-by-step. With that in mind, use comments
    to explain what your programs are doing.


    # How Embedded Programming Works


    Before, I''ve only mentioned that PHP code must be enclosed in the <?php PHP tags.
    Using tags to separate PHP code and HTML code within the same file allowing programming
    code to be mixed directly with information that is going to be sent to the browser
    just as it is. This makes PHP an embedded programming language because PHP is
    embedded directly in HTML code.


    This is relatively new: Before languages like PHP, programs had no real to display
    data using a structured formatting language as complex as HTML. Information displayed
    on the screen was usually just letters, numbers, and spaces, without many colors,
    sizes, or other formatting markups.


    Since PHP was made for Web programming, it is intended to be used with HTML, which
    significantly increases the amount of information that has to be sent back to
    the browser. Not only does PHP have to send back the information the user sees,
    but also the markup tags required to format the information correctly.


    To make the mixing of information and markup tags simpler, PHP code is embedded
    directly in the HTML page where the information is desired.'
