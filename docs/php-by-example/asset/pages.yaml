  md: '# Introduction to Variables and Constants


    A program contains two basic things: commands and values. The commands all have
    certain tasks they perform; the values are the information that the tasks are
    performed with. Until now, all your programs have used literal values; that is,
    any time a value has been specified, it has been hard coded into the program.


    For example, take a look at an echo statement in Chapter 1,

    Welcome to PHP":


    ```

    echo "World!";

    ```


    This statement performs the echo command (which we know inserts text) using the
    literal value given after it ("World").


    # NOTE


    Literal is a value that you explicitly specify within a program. For example,
    5, 5, 5, and "World" are all literals.


    The point of a program is not to say "World" all the time. That could be accomplished
    with a regular HTML page. The whole point of writing a program is to have a uniform
    task performed with whatever information is specified. For example, you might
    want it to be to say "Earth" instead of "World."


    Let''s consider what you''re planning to do. You know the program should output
    something, either way. Thus, you know you want the program to do something like
    this:


    ```

    echo something;

    ```


    You don''t know what something is. To specify what something is, use a variable.
    A variable is a name that represents a value. The value of a variable may change
    throughout a program, or it may stay the same once it.


    For example, you might use a variable $strText to insert whatever text is being
    used for a particular execution of the program.


    # NOTE


    The name $strText is preceded by a dollar sign because that''s PHP recognizes
    it as a variable.


    Also, if you''re curious, the $str prefix is an abbreviation for "string" (the
    type of data will be character string); its purpose is a matter of style, only.


    Don''t worry about it now; we''ll discuss data types and style conventions related
    to variables later in this chapter.'
  merge: -1
