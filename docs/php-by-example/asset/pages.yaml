  md: '# Compound Operators


    # NOTE


    There are special operators for adding and subtracting t. These operators are
    known as the increment and decrement operators, respectively, and can be found
    in Chapter 8.


    Compound operators are pretty straightforward. Here are a few examples to help
    demonstrate their use.


    ![](img/b437c18efec65ed938962e8683b6a70c_97_0.png)


    An organization is trying to break the world record for the longest distance of
    dollar bills strung together, but much of the money has been donated in order
    to exchange the coins for bills, the group must calculate how many dollars the
    money is.


    To do this, we''ll need to know the amount in cents. Because 100 cents are in
    a dollar, dividing the amount in cents by 100 will yield the amount in dollars.
    Therefore, to convert the amount to dollars, we do a compound operation using
    the amount and 100 as the operands.


    The following program converts an amount given in cents to a dollar:


    ```

    ```php

    $amount = 1995; // in cents


    echo "$amount cents is equal to ";


    $amount /= 100; // 100 cents in a dollar


    echo "$amount dollars!";

    ```

    ```


    The output of this program

    1995 cents is equal to 19.95 dollars!


    ![](img/b437c18efec65ed938962e8683b6a70c_97_1.png)


    Here''s another example: A small computer company wants to keep track of the number
    of computers it has in stock on how many it has at the start of the day minus
    the number it sells.


    To do this, we''ll need to know the number of computers in stock at the beginning
    of the day and the number of computers sold during the day. Then, to find the
    number of computers in stock at the end of the day, we''ll use a compound subtraction
    operator to subtract the number sold from the number in stock, storing the result
    back to the number in stock so the number in stock is accurate after the day''s
    sales.'
