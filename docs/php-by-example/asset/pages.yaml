    # Basic Pattern Matching


    Now that you know the basics of pattern matching, there''s a chance to try them
    out. The first thing you should do is get acquainted with the preg_match function,
    which is the basic function for matching strings with regular expressions in PHP.
    It has this syntax:


    ```

    bool preg_match($expr, $str, $result)

    ```


    $expr is the regular expression, which must have a delimiter added to it. The
    easiest thing to do is add a forward slash to each end of the string, like: "/hello/".
    The slashes are carryover from Perl that allow certain options to be added (but
    $str is the string being compared to the expression, and $result, if specified,
    becomes an array holding the results of the match. This will be discussed in detail
    later.


    Now, let''s stick with simply testing to see if an expression matches a string.
