  md: '# 108 Chapter 5: String Manipulation


    example2001@example.com

    example-email@example123.com

    example.email@this-example.com

    example_email@subdomain.example.com


    First, you know an e-mail address has two basic parts of interest: that before
    the @ sign and after it. (Of course, the @ sign itself must be present, too.).
    The part before the @ sign may consist of letters, numbers, hyphens, and underscores.
    The part after the @ sign will be a domain (letters, numbers, and periods) with
    any number of subdomains. For instance, a domain might be simply "example.com",
    or it could be "mail.example.com", or even "in.mail.com".


    Now let''s construct the expression you''ll use. The first part of the e-mail
    address can be expressed as this:


    ```

    [a-zA-Z0-9\._\-]+

    ```


    ![](img/b437c18efec65ed938962e8683b6a70c_120_0.png)


    Note that the slash escapes the special characters meaning anything other than
    their literal form. Actually, it''s necessary to escape the period (because it
    is taken literally within brackets) and the underscore (because it appears next
    to a bracket), but doing so can hurt anything.


    The other part of the address is the domain. The expression for that could


    ```

    [a-zA-Z0-9\._\-]+\.[a-zA-Z0-9\-]+

    ```


    The first part of this expression accounts for the domain and possible subdomains,
    while the latter accounts for the top-level domain (such as .com, .org, or .net).


    Now let''s put this together to verify an e-mail address. To do this, you''ll
    need the beginning and ending qualifiers; if you don''t, strings like "ex@example.com"
    will match all valid address because ample@example.com matches and you didn''t
    specify that nothing could be present in the variable; adding the beginning and
    ending qualifiers will prevent this. You''ll also need to add the slashes for
    delimiters on either end of the string. Here''s the result:


    ```

    $email = ''example-email@example-domain.com'';

    $validateEmail = ''/([a-zA-Z0-9\._\-]+@([a-zA-Z0-9\._\-]+\.[a-zA-Z0-9\-]+))$/

    ```


    ```

    echo (int) preg_match($validateEmail, $email); // echo 1 for match, 0 for no match

    ```


    You could insert this code into any program where you want to check an e-mail
    address for typos and it would work with very little modification.'
