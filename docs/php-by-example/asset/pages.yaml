  md: "# Chapter 6: The if, elseif, and else Statements\n\n```\n$condition1 = 1; //\
    \ Evaluates to true\n$condition2 = 0; // Evaluates to false\n```\n\n```\n// Test\
    \ condition 1\nif ($condition1)\n{\n    echo \"Condition 1 is true.\";\nelse\n\
    {\n    echo \"Condition 1 is false. <br /> \\n\";\n}\n\n// Test condition 2\n\
    if ($condition2)\n{\n    echo \"<p>Condition 2 is true.</p>\";\nelse\n{\n    echo\
    \ \"<p>Condition 2 is false.</p>\";\n}\n```\n\n? The output from this program\n\
    Condition 1 is false.\nCondition 2 is true.\n\nAlmost all statements, namely function\
    \ calls, have a value associated with them. For example, preg_match evaluates\
    \ to 1 if a match is found; other-wise, returns 0.\n\n> NOTE\nWhen functions,\
    \ such as preg_match, evaluate to a value, it's commonly said in the programming\
    \ vernacular that the function \"returns\" the value. When a value is said to\
    \ be returned, it is the same as if the function evaluated to that value.\n\n\
    +   - To learn about return values, \"Returning a Value,\" p. 199.\n\nThe following\
    \ example demonstrates the use of a function's return value:\n\n```\n<?php\n/*\
    \ @chex02.php - demonstrates function's return value */\n$intFirstResult = preg_match('/abc/',\
    \ 'abcdef'); // match found, evaluates to 1\n$intSecondResult = preg_match('/abc/',\
    \ 'defghi'); // match not found, evaluates to 0\n```\n\n![](img/b437c18efec65ed938962e8683b6a70c_130_0.png)"
