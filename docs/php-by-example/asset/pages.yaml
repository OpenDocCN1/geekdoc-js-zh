  md: '# Chapter 10: Functions


    When this occurs, think of it as if a second copy of the function has been created;
    the old copy is still waiting for the value that this call to factorial() returns,
    so you can discard it. Therefore, you end up with two copies of the factorial
    function running simultaneously—the first waiting on the second to finish.


    In the second copy of factorial, the parameter is 1. The if statement will evaluate
    to true now and 1 is returned. The second copy of the function is discarded now;
    its work is done.


    You''re back in the first (and now the only) copy of the factorial() function.
    The value returned by the call to factorial(1) was 1, and now the multiplication
    expression can be evaluated. 2 is multiplied by 1, and the resulting 2 is returned
    by the last copy of factorial(), ending the process.


    # Using Recursion


    Recursion can go deeper than one level, of course. If you took the factorial of
    35, for example, using factorial(35) as the function call, you would end up with
    35 imaginary copies of the factorial(), all waiting on the factorial(1) to return
    1. At that point, the copies would all begin evaluating their mathematical expressions.


    First, factorial(2) would evaluate 2 * 1 (its own parameter times the value of
    factorial(1)), and it would return the result 2. Then, factorial(3) would evaluate
    its expression, which would be 3 * factorial(2). Because factorial(2) returned
    2, that expression would evaluate to 6, and factorial(4) would have a value to
    evaluate its expression, and so on until factorial(35) finally returned the end
    result.


    This might seem a somewhat confusing way to think, and indeed it''s easier to
    use some sort of loop. Recursive functions are short and compact, and even if
    you don''t choose to use them, you''re sure to read the code of some other programmer
    who has decided to use them.


    As long as you break down the process like you did with the factorial() function
    here, you should have no problems with recursion. If you have to, think of it
    as a different way of looping: The initialization is the value of the original
    argument, the condition is found in the if statement, and the repetition statement
    is found wherever the function is called.


    For example, let''s look at the factorial() function one more time:


    ```

    factorial($number)

    ```'
