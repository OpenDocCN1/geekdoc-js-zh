  md: 'In fact, I could add them to create code libraries. Code libraries are collections
    of code designed to be usable in multiple programs without modification. For example,
    the POP3 functions in the previous example (in the pop3*.include files) could
    be used in more programs than just the one in the previous section. In fact, if
    more functions were added, I could have a POP3 mail-reading library, capable of
    browsing a POP3 mailbox with a few high-level, fairly simple functions.


    Code libraries usually come in one of two: function libraries or class libraries.
    A function library is comprised of a group of related functions. The POP3 libraries
    above are all function libraries.


    However, libraries can also contain classes. In fact, it''s a good idea to always
    create a new library when you create a new class. That way, if you want to use
    the same class in another program, all you have to do is include the class library
    in your program and start using.


    Why not just copy and paste the functions or classes into your programs you need
    them? First, this takes up more space on your system. Of course, space isn''t
    a big problem with the large capacity drives most websites run out of, but it
    is at least a minor consideration. More important, though, is the problem of bugs.


    Imagine finding a bug in a function and having five copies of that running in
    different programs. You would have to find the occurrence of the mistake in each
    program (if you can even remember the top of your head all of the programs using
    the class) and fix each one. It''s easier to simply have one copy of the function
    or class in a library file that all of the programs use. That way, if you change
    one function, your problem is solved, and you don''t have to wonder whether you
    forgot another program that is using the class.


    # USING include_once WITH LIBRARIES


    The creators of PHP have added an include-like function specifically designed
    for libraries. The function is include_once(), and it should be used whenever
    you are including a library file.


    Why is this important? Including the same library file into the program than once
    will probably result in errors. For example, a function library might contain
    a function called print_table(). The first time the library is included, the print_table()
    function is defined as normal in the program. However, the second time the file
    is included, the function is redeclared. You can''t declare the same function
    twice, so PHP dies with an error message.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Why Use includes?


    To help you prevent the same library from being included more than once, the include_once()
    function is used. The syntax for this function is as follows:


    ```

    include_once(''/path/filename'');```

    ```


    The path and filename work the same way they did with include(), only now the
    file will be included once. If the include_once() function is called again with
    the same file, the file will not be included and the error messages that would
    have occurred with include() will be avoided.


    # NOTE


    Don''t forget to use include_once() with libraries. If you use it for the first
    include but not a later, you will get an error anyway, because include_once()
    works only if it is used every time for each particular library file.


    As you would expect, other files, such as HTML code and content files, should
    still be included with the regular include() function. Using include_once() with
    these might keep the contents of the include file from being displayed if the
    file has already been included. This, of course, is not the desired effect when
    using HTML code in index files.


    # ORGANIZING A LIBRARY DIRECTORY


    If you''re going to keep code libraries, it''s a good idea to organize a library
    directory—a folder containing all of your code libraries—that can be easily accessed
    by all of your programs. A library directory should be named so that it is easy
    to distinguish it and its purpose from the others. For example, a library directory
    named lib (for library), inc (for includes), or common (for common code) would
    be effective. And you might find that you would rather use a name you devise.
    Whatever you choose, keep in mind that the directory should be clearly marked
    as a code library.


    One concern some people have with their library directory is that other people
    will download or steal the code in it. You can take two precautions to prevent
    this:


    +   - Don''t name your files with an extension other than that designated as a
    PHP-processed file (generally, .php).


    +   - Place your code library easy to follow. outside of your Web site''s root
    directory.


    The first is fairly easy to follow. You might have noticed as we discussed include
    file examples that all of the include files are named with a .php extension, just
    as the main program files are. On many servers, naming'
