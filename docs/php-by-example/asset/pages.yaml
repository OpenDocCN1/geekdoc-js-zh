  md: '# Glossary 393


    set of characters (such as ., which represents any character). Another example
    is the $ that''s used to prefix variable names.


    **statement** A single written command.


    **string** A collection of one or more letters; a string can be a word, a sentence,
    or just a single letter.


    **subclass** A class created by extending a parent class using the extends keyword.


    **subscript** *See* index.


    **syntax** The format that must be used when writing code.


    **true** The opposite of false. Can also be represented by any non-zero number,
    non-null value, or non-empty string.


    **type casting** The act of forcing a variable to become a given type.


    **unary operator** An operator that only takes one argument. Example: the negative
    sign in -21 is a unary operator.


    **variable** A value represented by a name. Unlike constants, a variable''s value
    may change any number of times during execution.


    **VBScript** Microsoft''s scripting version of Visual Basic.


    **whitespace** Any character that doesn''t print a visible character on the screen;
    whitespace characters include new lines (

    ), spaces, tabs, and so on.


    **WYSIWYG** What You See Is What You Get. A visual/graphical HTML editor designed
    for easy creation of HTML Web sites, but almost always detrimental when used with
    PHP.'
