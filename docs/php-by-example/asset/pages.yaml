    Now let''s take a look at using links to make get requests. When I refer to links,
    I''m not just referring to the HTML <a> tag. I am also referring to addresses
    typed directly into a browser''s location bar or the addresses specified in an
    <img> tag.


    To investigate this, let''s create a single-question survey. The question, which
    could be inserted anywhere in an HTML file, should be set up similar to this:


    ```

    <php

    /* ch03ex12.php - survey form */

    ?>

    <html>

    <head><title>Survey</title></head>

    <body>


    Which animal do you like better?

    <a href="#ch03ex12.php?answer=dogs">Dogs</a>

    <a href="#ch03ex12.php?answer=cats">Cats</a>


    </body>

    </html>

    ```


    Upon clicking one of the links, the visitor is taken to answerSurvey.php, which
    looks like this:


    ```

    <php

    /* ch03ex12.php - handles survey answers */

    ?>

    <html>

    <head><title>Your Answer</title></head>

    <body>


    You said you like <?= $HTTP_GET_VAR[''answer''] ?>? the best!


    </body>

    ```


    ![](img/b437c18efec65ed938962e8683b6a70c_74_0.png)'
