    # NOTE


    The base64_encode() and base64_decode() functions are probably unfamiliar to you
    at this point. These functions work similarly to serialize() and unserialize(),
    except these functions turn strings with special characters (such as the quotes,
    colons, and curly braces found in the serialized string) into combinations of
    normal characters.


    Base64 encoding a serialized object is important because without doing it, the
    quotes found in the serialized string would end the value in your input prematurely
    (after only the characters 0:3). The encoded string, however, is much more acceptable
    to be posted.


    For example, take a look at this string, the result of serializing an object:


    ```

    0:3:dog":{s:4:"name";s:5:"Spike";};

    ```


    A Web browser is looking for HTML code like:


    ```

    <input type="hidden" name="dogObject" value="some value">

    ```


    and the serialized string contains quotes, the first quote in the serialized string
    will make the browser think that the value has ended. Thus, the encoded string
    is considered to garbage and ignored by the browser.


    Because we''re encoding the string using base64_encode(), we also have to decode
    the string using base64_encode()''s counterpart, base64_decode(). This function
    returns the string to its original state. In this case, the decoded string is
    then passed to unserialize() and the object is reinstated from there.


    For more information on the base64_encode() and base64_decode() functions, refer
    to the PHP manual.


    The output of this program demonstrates that the serialize() and unserialize()
    functions work as expected:


    Creating a new object...


    Spike

    Woof!


    0:3:dog":{s:4:"name";s:5:"Spike";


    Serialized & Encoded: TzzoUjkbZDIjOE6eM3NdoNmtFtZSIzczIwOjJGjRlZSI7q==

    [Submit Token]


    As you can see, the object is first instantiated, it works as it should. Then,
    we serialize the object, resulting in the string on the second-to-last line. Finally,
    we can''t have double quotes interfering with the double quotes of our form''s
    HTML, we encode the object, yielding the unintelligible string on the last line.'
