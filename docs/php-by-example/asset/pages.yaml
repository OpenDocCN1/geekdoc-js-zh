  md: '# Setting Cookies


    To delete the cookie, you can call setcookie() with the same arguments as those
    that created the cookie, except with an empty string for its value:

    setcookie(''myCookie'', '''', time(), ''/path/'', ''.mydomain.com'');


    # NOTE


    Notice that the expiration time stamp can change without affecting cookie you''re
    changing. In fact, setting the expiration time to the current time or even the
    current time minus a few minutes will help to ensure that the cookie expires (and
    is therefore deleted).


    However, simply setting the cookie to an empty string should delete it.


    # Privacy and Security Concerns


    Despite the incredible power that cookies give you, many people are concerned
    about them—from executives trying to ensure that their Web sites adhere to their
    privacy statements to users worried about viruses planted on their computers through
    cookies.


    Cookies are not risky for anyone, but you should be aware of the concerns that
    have been voiced so you can be ready to defend their use. By knowing about the
    possible controversies, you can be ready and usually predict the problems people
    will have with your use of cookies.


    # NOTE


    Although some people will ask questions and be concerned, cookies are not a threat
    to anyone. You, as a developer, are responsible for making sure visitor privacy
    policies are followed. The rumors and threats that spread on the Internet are
    bogus.


    # The Cookie Virus Myth


    One worry that is sometimes expressed by Web site visitors is that a virus will
    be planted on their computer using a cookie. This is simply a misconception.


    The idea behind this worry is fairly straightforward: If a Web site sets information
    on a hard disk, can''t the Web site save a virus on it? However, the process of
    setting a cookie isn''t nearly that simple.


    Cookies are limited to a fairly small size. Although viruses could be written
    to meet this size, the virus still can''t be distributed through cookies.


    When a cookie is set, it''s sent as part of the HTTP response to the client browser.
    The browser then takes cookie information, interprets it, and saves it in a textual
    cookie file. Executing this file in any environment would be impossible.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Chapter 16: Cookies


    The misconception is here the user thinking that a Web site''s code can arbitrarily
    decide it wants to save its cookie data. It can''t just send a cookie and have
    saved it as C:\somevirus.exe—that''s not even remotely possible.


    # But Cookies Will Snoop Through My Personal Data...


    In fact, it''s impossible to do this. Because cookies are passed through the browser,
    a script cannot determine from which file the browser reads its cookie information.
    Access is limited solely to the browser''s cookie file.


    Even if a script tried to access C:\Quicken\Personal Finances.dat, the script
    couldn''t possibly get that file using cookies alone.


    This worry and the cookie virus myth are both exaggerations of how cookies work.
    Neither is remotely possible.


    # Using Cookies Ethically


    A concern that is more worrisome is that of user''s personal privacy. For example,
    most users don''t count on being tracked where they go on the Internet. In fact,
    they might not expect to be tracked even within your Web site, although a certain
    amount of information should be expected to be gathered, such as general in users
    enter the Web site, long they spend on it, and so on.


    The best thing to do about this concern is to have a privacy policy written, if
    it hasn''t been done already, and stick to it. If you tell your visitors their
    specific actions won''t be tracked, then don''t track their actions.


    Most importantly, don''t track anything about user you wouldn''t want tracked
    about you. Engineering methods to keep track of where users go after leaving your
    site is definitely taboo. Collecting statistical information about what sorts
    of things users do and buy—without attaching identifiable markers to any of it—is
    usually acceptable.


    In any event, tell users what your Web site collects about and what you''re doing
    with it. If you don''t, and a technically savvy visitor decides to look into what
    kinds of cookies you''re keeping on your computer, he might become suspicious
    and begin spreading warnings. Obviously such possibilities would be much better
    avoided by making users aware of what you''re doing through a privacy policy,
    and furthermore by sticking to the policy.'
