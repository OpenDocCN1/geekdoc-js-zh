  md: '# What''s Nesting?


    Programming, nesting refers to the placement of one set of commands within another
    set. In expressions, this is the placement of an expression contained within parentheses
    within another statement that was enclosed in parentheses.


    Nested expressions can be divided into a number of smaller expressions. By dividing
    nested expressions into smaller ones, your job at evaluating them becomes much
    easier. Figure 4.5 shows how an expression can be broken into smaller expressions.


    | Expression | 4 / (2 + 3) % (4 / 2) |

    | --- | --- |

    | Innermost | (2 + 3) (4 / 2) |

    | Middle: | 5 % 3 |

    | Outer: | 4 - 3 |

    | | RESULT |


    **Figure 4.5:** This nested expression is broken down into smaller expressions.
    The innermost expressions can be separated from the middle ones, and the middle
    ones can be separated from the outer expression.


    ![](img/b437c18efec65ed938962e8683b6a70c_93_0.png)


    The following expression demonstrates nesting of parentheses:


    ```

    <? 2 * (5 + (5 + 5) * 2)) % 3 ?>

    ```


    For practice, finding the result of the preceding example now. Once you have an
    answer, continue reading; the following figure shows a step-by-step breakdown
    of the expression and the final answer.


    # TIP


    You should evaluate numeric expressions as follows: start with the innermost set
    of parentheses, then evaluate all multiplication and division operations within
    expression, and finally evaluate the addition and subtraction operations of that
    expression. If the parentheses are nested, work your way through the outer expressions,
    always working from the inside out.


    Figure 4.6 shows the evaluation of the preceding expression.'
  merge: -1
