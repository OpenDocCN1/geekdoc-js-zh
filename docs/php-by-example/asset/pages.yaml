  md: "# Chapter 11: Classes and Objects\n\nits program wasn't running. Because an\
    \ object will be destroyed from one page access to the next, we need a way to\
    \ save a copy of the class represented as a string, allowing us to store it in\
    \ a hidden field or, a session variable (introduced in Chapter 14 in the section\
    \ titled \"Using Sessions\\ or a database (introduced in Chapter 13, \"Creating\
    \ Dynamic Content with PHP and a MySQL Database\"). Because you can serialize\
    \ unserialized objects, you can transfer the contents of a whole object between\
    \ one program and another.\n\nThe process of encoding an object into a string\
    \ form is known as serializing—that is, you're taking the elements of an object\
    \ and connecting them in order as a string. The inverse of this operation, which\
    \ converts a string representing an object back to an actual object, is called\
    \ unserializing. It involves taking the ordered version of the string and turning\
    \ it into an object in which the elements have no order associated with them.\n\
    \nThe actual functions that do this are appropriately named serialize() and unserialize().\n\
    \nHere's the syntax for serialize():\n$strSerialized = serialize($objObject);\n\
    \nserialize() takes the content of the $objObject and encodes it into a hidden\
    \ variable $strSerialized. This string can then be placed in a hidden field in\
    \ a form and the object can be reinstantiated from the string after the form is\
    \ posted using unserialize().\n\nHere's the syntax for unserialize():\n$objObject\
    \ = unserialize($strSerialized);\n\nAfter unserialize() on a given string (which\
    \ was constructed by calling serialize() on an object), the object is again available\
    \ for use—with the same members it had before.\n\nLet's use the dog class defined\
    \ earlier in this chapter to explore the serialize() and unserialize() functions\
    \ little further. The following program uses these functions to store a serialized\
