  md: '# Chapter 14: Using PHP for Password Protection


    The first thing the program does (after defining the LoginOK function) is pass
    the two variables that are supposed to hold the HTTP authentication data (the
    visitor''s username and password, if he entered them) to the LoginOK function
    to check whether the user should be given access to the protected page.


    The LoginOK function first checks to see if the username and password both contain
    something. If they don''t contain anything, LoginOK returns false so the user
    will be prompted to enter a username and password. If they do contain something,
    the username and password are checked against the users table in the database.
    The appropriate value for whether the username and password are valid is returned.


    Now, the main logic of the program. If the it statement checks to see if the login
    information is not acceptable. If it is acceptable, the headers are sent to the
    user to enter (or reenter) his login information. The program also exits at that
    point to ensure the protected part of the page isn''t revealed prematurely.


    If the login was successful, the program keeps executing and the protected page
    is displayed.


    # TIP


    Although you can incorporate sessions into this login system, too it''s not necessary
    because all of the major browsers automatically send login information for other
    pages on the same server after the correct information is entered once. Thus,
    instead of the user having to reenter his username and password for every page,
    the browser sends the same username and password automatically so the user isn''t
    troubled with it.


    # What''s Next


    Now you know how to use some authorization techniques with PHP, which will help
    you automate user registrations, profiles, and other user-friendly service.


    The next chapter will lead you into handling file uploads with PHP. This will
    allow your visitors to post pictures, documents, spreadsheets, and other files
    in any format to your server securely—and at your discretion and control so they
    can only upload what you want to. Thus, you can allow users to upload pictures
    to their profiles, upload Word files for others to download, or add attachments
    of any kind in an online e-mail system. Read on to find out the great qualities
    of PHP''s file uploading feature!'
