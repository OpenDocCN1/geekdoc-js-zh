  md: '# Glossary


    **abstract data type (ADT)** A Customizable variable type that models real-world
    concepts.


    **Active Server Pages (ASP)** Microsoft’s Active Server Pages scripting environment.
    ASP is often used in conjunction with Visual Basic (VB) script to create dynamic
    Web sites. See the comparison of PHP and ASP in Chapter 1, “Welcome to PHP.”


    **algorithm** A procedure that, when followed precisely, will yield a desired
    result.


    **argument** The value passed for a function parameter.


    **Arithmetic operator** Any of PHP’s operators that perform arithmetic operations,
    including +, *, %, and their associated compound operators.


    **array** A data structure that holds one or more elements.


    **assignment** The act of storing a value in a variable.


    **associative array** An array that uses text indexes; an associative array would
    be used as follows:


    ```

    $arrSomeArray[''elementName'']

    ```


    **binary operator** An operator that takes two arguments: one on either side.


    **bit** The smallest unit in computer logic; can either be a 1 or a 0.


    **black boxing** The technique of writing a class or functions that perform complex
    operations reliably with a single function call, freeing the programmer from concentrating
    on the complexities of the function’s code. For example, if you were to use a
    square_root() function in a program, you should be able to give it an input—such
    as square_root(64)—and get the correct output—8—without worrying about how the
    square root was calculated. You don’t care how a function works, as long as it
    does. (This isn''t encouragement to create buggy functions; functions and classes
    that use must be reliable.)


    **block** A segment of code enclosed in curly braces; typically part of an if,
    switch, while, or function statement.'
  merge: -1
  pgno: 399
- img_proc: true
  md: '# 388 Glossary


    **byte** A group of 8 bits.


    **C** A language used across many operating systems to create executable programs
    and operating systems.


    **C++** A newer, object-oriented version of C.


    **character escaping** The act of placing a backslash (\) before a special character
    (usually in double quotes) to prevent it from being interpreted as a special character.


    **child class** See subclass.


    **class** The definition for an abstract data type. A class defines the variables
    and functions available to an object instantiated from that class. Classes are
    often used in a hierarchy of subclasses (or child classes) and superclasses (or
    parent classes).


    **client-side scripting** Script code that runs on the client machine (as opposed
    to the server machine). A common example of this is JavaScript, which is executed
    by a user''s browser.


    **code** Anything written in a programming language; also, a collection of one
    or more instructions are read and performed by a computer.


    **coding** The process of writing code.


    **column** A set of all the same fields from every row in a table.


    **comments** Anything delimited from the rest of a program''s code (such as //
    or /* ... */). Comments are ignored by the parser and are therefore an important
    tool for making your code more understandable.


    **compiler** A special program used to make an executable binary out of a source
    file; not necessary with PHP.


    **compound operators** A combination of two operators, usually consisting of an
    assignment operator and a data manipulation operator, such as an arithmetic or
    concatenation operator.


    **concatenation** The joining of two strings.


    **condition** An expression that can either be true or false.


    **conditional** An expression that evaluates to a condition.


    **constant** A named value that cannot be changed during program execution.


    **constructor** A function that is called automatically upon a new instantiation
    of a class.'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# Glossary 389


    **cookie** A small piece of information that can be stored on a client machine
    by a program on the server if allows it.


    **database** A collection of data held in a specific place and usually accessed
    through a database server, such as MySQL.


    **declaration** The creation of a variable.


    **decrement** Decreasing a number by 1.


    **default** The option used if no other option is selected. Also, a special case
    used in switch statements.


    **derived class** See subclass.


    **editor** A program used to create and modify files. In particular, a text editor
    is used to edit files containing PHP code (and HTML code, too, unless you use
    WYSIWYG editor as FrontPage or Dreamweaver).


    **element** A value located at a center index within an array.


    **embedded programming language** A language whose code is embedded in some other
    type of code. For example, PHP is designed to be embedded in HTML code to make
    separation of program code and output clearer easier.


    **escaping** See character escaping.


    **execution** The running of a program.


    **false** A value that is not true; can also be expressed in PHP as 0.


    **field** See column.


    **float** See floating-point number.


    **floating-point number** A number that consists of an integer (whole number)
    component and a decimal (fractional) component, separated by a decimal point.


    **function** A collection of statements that can run collectively with a function
    call.


    **function call** The execution of a function by using the name of the function
    followed by an argument list as a statement.


    **global** The main scope in a PHP script; all variables not contained in functions
    and classes.


    **guestbook** A program that allows visitors to leave their name and comments
    at a Web site.


    **here-doc** A string-quoting style that allows for clearly readable multiline
    strings; most closely related to doubled quoting in PHP.'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# 390 Glossary


    **HTTP** The protocol used by Web servers and browsers to request and transfer
    files.


    **HTTP header** The portion of an HTTP message (request or response) that contains
    data not meant for visual display in the client browser.


    **Hypertext Markup Language (HTML)** HTML code is interpreted by a Web browser
    to format and arrange information on the screen.


    **increment** The act of increasing a value by 1.


    **index** The value used to retrieve a value from within an array.


    **inheritance** The automatic gaining of a parent class''s member variables and
    functions.


    **input** Data that is supplied at runtime to a program.


    **instance** An object variable of a particular class.


    **instantiation** The act or process of creating a new instance.


    **int** A keyword used in parentheses to typecast a variable of another type to
    an integer. *See* integer.


    **integer** A whole number.


    **interpreter** A program that reads code and performs certain actions based on
    the instructions in the code.


    **Java** A fully object-oriented, cross-platform programming language most closely
    related to C/C++.


    **JavaScript** A scripting language unrelated to Java (with the exception of a
    few syntactical and structural similarities); almost always executed client-side.


    **JavaScript** Microsoft''s version of JavaScript.


    **library** A file containing functions and classes that is meant to be included
    into other programs so those programs can use the functions or classes.


    **license** A legal document defining how software can be used. A license, if
    used, is usually stated or referenced at the top of each file containing licensed
    code.


    **literal** A value hard-coded into a program; sometimes also used to refer to
    constants.


    **looping** Repetition of a block of code until a given condition becomes true.


    **members** The variables and functions within a class.'
