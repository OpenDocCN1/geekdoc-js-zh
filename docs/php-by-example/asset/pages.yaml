  md: '# Chapter 14: Using PHP for Password Protection


    # NOTE


    The other method involves sending special HTTP headers that cause the browser
    application to present a pop-up authentication dialog box. That method will be
    discussed later in this chapter using the “HTTP Header Authentication.”


    ![](img/b437c18efec65ed938962e8683b6a70c_308_0.png)


    Setting a form to obtain a visitor''s username and password is quite easy as you
    might have expected. The following page presents the form to be used with this
    example:


    ```

    <php ch14ex01-form.php ?>

    <html>

    <title>PHP By Example :: Chapter 14 :: User Authentication Form</title>


    <body bgcolor="white">

    <h2>Please Log In</h2>


    <form action="ch14ex01-login.php" method="POST">

    Username: <input type="text" name="user"><br>

    Password: <input type="text" name="pass"><br>

    <input type="submit" value="Log In">

    </form>


    </body>

    </html>

    ```


    EXAMPLE


    # CAUTION


    Notice that the form action is POST and not GET. As discussed in Chapter 3, “Program
    Input and Output,” POST is favorable for sending passwords because it doesn’t
    cause the browser to display them in the address bar like GET does.


    However, do not let yourself get comfortable with using POST forms with high security
    passwords. (Most Web-based services have decided that this marginal risk is acceptable
    and informed their users of the risk,) It is possible for others to look at passwords
    in transit, even if they are POSTed, unless the information is submitted over
    a secure connection.


    Either SSL (Secure Sockets Layer) or the newer TLS (Transport Layer Security)
    can be used to make connections secure. You can find out more about using SSL
    or TLS by consulting your server’s documentation, or by asking the server’s administrator.


    This problem should always be at the front of your mind when planning a new login
    system; if it is necessary to have tight security, you will need to have a secure
    certificate installed for that Web site and every page that is secured should
    be retrieved over that connection. (If you’re not sure what you need to do to
    have a security certificate installed on your Web server and how to use it, contact
    your administrator.)'
