  md: '# Practical Techniques


    Obviously, a program like the one given in the previous section is good enough
    if all you want to send to the user is a line or two of output. Even a whole page
    could be sent back, really, wrapping a whole page in part of an if-else clause
    can get confusing—especially if other-elses exist in the program.


    In addition to, if you wanted to password-protect 15 different pages within your
    Web site, you would have to copy the code from one file to the next until all
    15 pages were protected.


    To get around these complications, the next two sections will show you how to
    use files along with some slightly adjusted logic to form a solution that is better
    suited for everyday use.


    # Adjusting the Login Logic


    The logic shown in the previous example demonstrates only one way to keep a user
    who doesn''t log in from viewing the protected page. However, the feat can be
    accomplished in more than one way. Suppose you had many pages you wanted to protect
    like this; as the program appears right now, you would have to copy and edit the
    code within the else block to make it work the way you wanted it.


    It would be much easier if you only had to add to the end of the file. That way,
    you could create the file and test it as usual, and after you were ready, you
    could simply paste the appropriate login script in front of your code. In plain
    terms, you would need to eliminate the else portion of the script.


    Therefore, instead of structuring our program in an if-else fashion, we''ll structure
    it so that the program starts if it makes it into the if block. If it doesn''t,
    execution will continue, making the part of the program after the if block act
    like an else block. Figure 14.1 demonstrates this more.


    The exit function will be used to stop the program if the visitor doesn''t provide
    a valid username and password. Using exit is quite straightforward: if execution
    ever reaches a line that calls exit, the program stops immediately.'
