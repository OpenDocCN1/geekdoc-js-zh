  md: '# Setting Cookies


    Now, you can use this script to view the cookie in the / directory or any subdirectory
    on that server:


    ```

    <?php

    /* ch16ex04.php - views a cookie set in the root path */

    ?>

    ```


    $myRootCookie = "<?php echo \$_HTTP_COOKIE[''myRootCookie'']; ?>";*


    You can place this script anywhere in your Web-accessible file system, and you
    will see the cookie''s value every time.


    The strictness of the path attribute is depends on the browser. Browsers such
    as Internet Explorer and Netscape Navigator aren''t finicky about how cookies
    are set. With those browsers, you can set a cookie for a parent directory or even
    a completely separate directory without the browser complying. (Internet Explorer
    6 has addressed this in its cookie security options). However, in more scrupulous
    (and secure) browsers, such as Opera, the browser will display a warning the user
    knows a cookie is being set that doesn''t really match the HTTP specifications.


    What''s wrong with a cookie being set for a directory other than the one the script
    is in? It''s a not-to-common practice for multiple Web sites hosted on the same
    domain. For example, completely separate users might have Web sites in the directories
    /-user1 and /-user2. If a script in /-user2 sets a cookie for /-user1, he might
    end up overwriting one of /-user1''s cookies. That''s not exactly considered to
    be desirable behavior.


    In the strictest sense, cookies should be limited to set only for the path the
    script is currently.


    The following example shows how you can set a cookie for /-user1 so that will
    not be accessible to scripts in the root directory, such as /-user2:


    ```

    <?php

    /* ch16ex05.php - demonstrates setting a cookie with a restricted path */

    ```


    ```

    setcookie(''myCookie'', ''This is the value'', time() + 60*15, /-user1/'');

    ```


    ```

    ?>

    ```


    You can verify that this cookie is only passed to scripts in the /-user1/ directory
    by placing ch16ex02.php in the /-user1/ directory (on Unix-systems you may need
    to change the directory names by removing the tilde, since the tilde has a special
    interpretation in Unix). When the script is in the /-user1/ directory, you should
