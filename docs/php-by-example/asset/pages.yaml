  md: '# Functions


    A function is used to give a complex task a shorter name by naming it; that is,
    a group of statements is merged into a function, so that, when the function is
    executed, all of its statements are executed. You''ve already seen some functions.
    For example, the string functions strlen(), substr(), and strpos() are all functions
    supplied to you by PHP. These tasks could be completed using a series of loops,
    but doing so would make a program more complex than necessary. Translating these
    loops into functions makes the code clearer and more organized.


    Although PHP provides many useful functions, they''re all fairly basic; to keep
    your programs organized, you''ll need to create some functions on your own, as
    well.


    This chapter teaches you the following:


    +   - How to control program flow through functions


    +   - How to use function parameters


    +   - How return values, referenced parameters, and referenced return values work


    +   - How to use recursion'
  merge: -1
  pgno: 199
- img_proc: true
  md: "# Understanding Functions\n\nBefore you get deep into functions, let's take\
    \ a look at the concept behind. The basic purpose of a function is to group a\
    \ set of commands (which perform basic tasks) in such a way that a new command\
    \ (which performs a more complex task) is created.\n\nTIP\nIt's said that any\
    \ portion of code you use more than once should be converted into a function.\
    \ Although that decision is ultimately up to you, it's not a bad idea because\
    \ it makes your code simpler, shorter, and more manageable.\n\nFor example, you\
    \ often consider opening a door to be a simple task, but it's actually a complex\
    \ task if you compare it to the even simpler tasks that compose.\n\nThe following\
    \ steps must be taken to perform this task:\n\n+   1. If the door is locked, it\
    \ must be unlocked.\n2. The donob must be turned.\n3. The door must be pushed\
    \ or pulled in the appropriate direction.\n\nThis sequence of tasks is best performed\
    \ as a group. Thus, you can group it into a single function. This new function\
    \ simplifies our three-step process into a single step: Open the door.\n\n# Function\
    \ Definition\n\nA function definition (or declaration) specifies what function's\n\
    \n+   - Name\n- Parameters, if any (will be discussed later)\n- Body (statements\
    \ that perform the function's)\n\nA function declaration follows this syntax:\n\
    \n```\n{ function name(parameters)\n  function body\n}\n```\n\nThe function name,\
    \ similar to a variable name, should describe what the function does. For example,\
    \ a function which opens doors might be called door_open() or openDoor(), depending\
    \ on what sort of naming convention you're using."
  merge: -1
  pgno: 200
- img_proc: true
  md: "# Understanding Functions\n\n# WHEN TO USE door_open() AND WHEN TO USE openDoor()\n\
    \nWhen you get to include libraries in Chapter 12, \"Include Files,\" you'll learn\
    \ how to create reusable function libraries—collections of code designed to be\
    \ easily used in any program. One problem when you want to do this, however, is\
    \ that functions conflict.\n\nFor example, openDoor() in the main program might\
    \ be designed to open a vehicle door and openDoor() in the function library might\
    \ be designed to opening doors. To avoid this conflict, a general door-opening\
    \ function would be named door_open(), and more specific versions for vehicles\
    \ and buildings would be named veh_door_open() and bld_door_open().\n\nThat leaves\
    \ openDoor() up for discussion. A function named like this should be used in the\
    \ main part of a program to separate the steps of the program's execution. By\
    \ using functions named like this in the main part of your program only, you'll\
    \ avoid conflicts when you start combining libraries.\n\nOf course, this makes\
    \ more sense when you get to Chapter 12, which presents include files.\n\nThe\
    \ function's parameters will be discussed in detail later. For now, let's stick\
    \ with an empty parameter list, like:\n\n```\nfunction demoFunction()\n/* PRE:\
    \ precondition\nPST: postcondition\n{\n    body statements\n}\n```\n\n# CAUTION\n\
    \nEven though you're not specifying any parameters, the parentheses following\
    \ the function name are mandatory. Leaving out the parentheses will cause PHP\
    \ to die with a parse error:\n\nparse error, expecting `(`\n\nThe body is a group\
    \ of statements that perform the function's task.\n\nThe precondition and postcondition\
    \ statements are comments describing what the function needs to work and what\
    \ it does. A precondition describes the status of parameters coming into the function,\
    \ stating, for instance, that the first parameter must be an integer. With an\
    \ empty parameter list, a precondition statement might be left out.\n\nThe postcondition\
    \ describes what happens during the function's execution, whether any of the parameters\
    \ have been changed (and how), and tells what the return value would be."
  merge: -1
  pgno: 201
- img_proc: true
  md: "# Chapter 10: Functions\n\nFor example, a program using a function that simply\
    \ echoes “Hello, World!” could be written as follows:\n\n```\n<?php\n/* ch0ex1.php\
    \ - demonstrates user-defined sayHello() function */\n\n/* MAIN PROGRAM */\n\n\
    sayHello();\n\n/* FUNCTION DECLARATIONS */\n\nfunction sayHello()\n/* PRE: none\n\
    PST: echoes \"Hello, World!\"\n*/\n{\n    echo \"Hello, World!\";\n}\n?>\n```\n\
    \n# NOTE\n\nA description of the PRE and PST lines in this function definition\
    \ can be found below in the bulleted organization guidelines.\n\nIt doesn’t matter\
    \ to PHP where in the file you put the function definition, as long as it’s defined\
    \ somewhere in the file that calls it.\nSome discretion be be used for organizing\
    \ your functions, so grouping and organization is a key skill in making functions\
    \ work for you (and not against you) cluttering your code.\nThe following guidelines\
    \ should help you keep your functions organized:\n\n+   - Place all of functions\
    \ at the bottom of your program. If all of your functions can be found grouped\
    \ at the bottom, all you have to do a function call is scroll down.\n\n# TIP\n\
    \nSome programmers place their function definitions at the top (some languages\
    \ require it), but it doesn’t provide a good, immediate understanding of what\
    \ the program is meant to do.\nTo illustrate: if someone was describing you how\
    \ to find his or her house, you would want instructions on how to start your car,\
    \ make a left turn, or knock on his or her front door? Rather, you would want\
    \ a general description of where to go, and then get any special instructions\
    \ at the end."
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Understanding Functions


    +   - Group functions according to their task, and include a comment at the top
    of each group describing the purpose of the functions. For example, functions
    to display certain information could be grouped as "display" functions; functions
    to calculate different shipping costs could be grouped as "shipping" functions;
    and on.


    +   - Include a comment with all functions describing their purpose. A very common
    method of doing this is the use of PRE and PST statements (included in the syntax
    guide and all examples of functions throughout this book).


    # Calling a Function


    Calling a function is another name for executing the function. A function is called
    simply by using the function name, along with an argument list, as a statement.
    For, of course, you''re still dealing with an empty set of parentheses for the
    argument list, so your function might look something like this:


    ```

    sayHello();

    ```


    Pretty simple, huh? By now you had to say "Hello, World!" in five different places
    in your program, creating a sayHello() function would definitely be beneficial;
    typing sayHello() is slightly easier than typing out the echo statement. Using
    a function here is especially useful if "Hello, World!" might be changed to "Hello,
    Universe!" in the future; five separate changes have been narrowed down to one
    because there''s only one copy of the echo statement now (as opposed to having
    five of them scattered throughout the program).


    # Flow of Execution


    Now let''s take a look at exactly what''s going on when you call a function. When
    PHP encounters a function call, it executes all of the statements before before
    executing any statements after the function call.


    In short, when a function is called, it is executed before any more of the program''s
    statements execute. The flow of execution (that is, the order in which statements
    in your program execute) transfers to the function''s body; then, at the end of
    the function''s body, flow returns back to the calling expression. In most cases,
    this results in the statement following the function call to be executed after
    the function returns.


    Figure 10.1 illustrates this visually.'
  merge: -1
