  md: '# Allowing Visitors to Upload Files


    Uploading files over the Internet has gotten to be a popular activity over the
    past couple of years. You can send attachments on most Web-based e-mail sites
    by selecting a file (or files) to upload. Other types of services besides Web-based
    e-mail can use this feature, as well. For example, Web sites in which users have
    their own profiles have started allowing them members to add a picture to their
    profile. These are only the most common uses; you could very easily think up another
    situation in which you would want to allow file uploading on your Web site.


    With the help of some of PHP''s specialized functions, allowing your visitors
    to upload files is easier than it ever has been before.


    This chapter teaches you the following:


    +   - How to use the file type of form field

    - Why PHP makes file uploads easier

    - How to process a file that is being uploaded

    - Where to store an uploaded file

    - How to store and retrieve a file from a database'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# File Upload Process Overview


    When a file is uploaded from a visitor''s computer to your Web server, several
    things take place.


    > NOTE Older browsers, as some of the less common ones, might not support file
    uploading; however, file uploading is generally supported in all mainstream browsers,
    so using it isn''t a problem as long as your visitors use a fairly recent browser.


    The three browsers are known to support file uploads:


    +   - Netscape Navigator 3.0 or later

    - Microsoft Internet Explorer 3.0 (requires patch)

    - Microsoft Internet Explorer 4.0 or later


    Any other browser that is RFC-1867-compliant will work, as well.


    First, the visitor selects the file from a Choose File dialog box, as shown in
    Figure 15.1.


    ![](img/b437c18efec65ed938962e8683b6a70c_328_0.png)


    Figure 15.1: The visitor uses this dialog box to select which file he wants to
    upload.


    After a file is selected, the visitor submits the form, and the file is transmitted
    to the server. When the file reaches the server, PHP does behind-the-scenes decoding
    and saves the file to a temporary directory.


    > NOTE The temporary directory PHP uses can be specified in your php.ini file
    using the upload_tmp_dir option.


    Your php.ini should look something like this:


    ```

    ###########################

    ; File Uploads ;

    ```'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# Creating a File Upload Form


    ```

    ;; file uploads = On ; Whether to allow HTTP

    file uploads

    uupload_tmp_dir = c:\apache\php\upload ; Temporary directory for

    ; uploaded files (will use

    system default = ; if not specified)

    uupload_max_filesize = 10M ; Maximum allowed size for

    uploaded files

    ```


    If you don''t specify a upload_tmp_dir, PHP will use your system''s default temporary
    directory automatically. In most cases, using the default option is fine.


    From the temporary directory, the file can either be copied to a location within
    the Public Web directory (so it can be accessed at a location such as http://www.example.com/files/somefile.jpg,
    or it can be inserted into a database for more control.


    The rest of this chapter describes this process in more detail, teaching you the
    options you have along the way.


    # Creating a File Upload Form


    The first step to uploading a file is creating a form to get the file that should
    be uploaded. The form should use the POST method, and can have many inputs, just
    like any other form. However, an additional field to file is added.


    The HTML syntax for input is as follows:

    <input type="file" name="field name">


    The field name can be whatever you like.


    The following example is a form that might be used to perform a simple file upload:

    <!-- ch15ex01.html -->

    <html>

    <head><title>PHP By Example :: Chapter 15 :: Example 1</title></head>

    <body bgcolor="white">

    <h2>File Uploader</h2>


    <form action="ch15exXX.php" method="POST" enctype="multipart/form-data">

    <input type="hidden" name="MAX_FILE_SIZE" value="1000000">

    File: <input type="file" name="upload_file"><br>

    <input type="submit" value="Upload">

    </form>


    ![](img/b437c18efec65ed938962e8683b6a70c_329_0.png)'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# 318 Chapter 15: Allowing Visitors to Upload Files


    ```

    </body>

    </html>

    ```


    The MAX_FILE_SIZE hidden field in this code sets the limit for the size of file
    that is uploaded. It is specified in bytes, so a 1000000 value equates to 1,000,000
    bytes, or 1MB. This limit can be increased or decreased as desired.


    # NOTE


    PHP configuration file also specifies a maximum file size, and that setting is
    the maximum limit. For example, if the MAX_FILE_SIZE is omitted from the form,
    the maximum size specified in php.ini will be used. Also, if the MAX_FILE_SIZE
    is specified in the form to be larger than the limit specified in php.ini, the
    limit in php.ini will be the maximum file size, not the higher size specified
    in the form.


    # CAUTION


    The MAX_FILE_SIZE must be specified before the file input field in the form or
    it will not be available when it is needed. Failing to specify MAX_FILE_SIZE before
    the file input field will result in the MAX_FILE_SIZE value being ignored.


    Also notice that an additional attribute, enctype, has been added to the form
    tag. That attribute must always be set as it is in the example when you''re uploading
    a file.


    # CAUTION


    If the enctype attribute is not set, the file will not be uploaded. Instead, the
    file''s name will appear in $_HTTP_POST_VARS[''field name ''], but that''s all
    that will happen.


    This sample page is shown in Figure 15.2.


    ![](img/b437c18efec65ed938962e8683b6a70c_330_0.png)


    Figure 15.2: A form like this is used to gather file upload information.'
