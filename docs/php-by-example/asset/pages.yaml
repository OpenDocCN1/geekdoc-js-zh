- img_proc: true
  md: '# Chapter 2: Variables and Constants


    Constants are often used to set program options. For instance, a constant named
    DEBUG might be used to determine how much information should be given to the visitor
    if something goes wrong—either a simple error message to tell the visitor there''s
    a problem or a detailed error message to help the programmer resolve problems
    within the script.


    # Declaration and Assignment


    Declaration is the term used to describe the creation of a variable or constant.
    Assignment, which is covered in the following sections, is the process of storing
    a value in a variable.


    Declaring Variables

    Declaring a variable is quite simple—all you have to do is assign something to
    it, for example, you wish to assign the number five to a variable named $intFive,
    you would use the following:


    ```

    $intFive = 5;

    ```


    The dollar sign in the variable name is not part of the variable name, per se.
    Instead, it is how PHP knows you''re referring to a variable named intFive. Whenever
    you use a variable, you must precede it with a dollar sign.


    Variable names in PHP must follow the following requirements:


    +   * Any combination of letters, numbers, and underscores can be used.

    * Names can be as short as one character and can be any of length.

    * Names can begin only with a letter or an underscore; variables cannot begin
    with a number.


    As you already know, because PHP understands a variable following the requirements
    seen previously doesn''t mean you and the people who read your code. To improve
    style, variables should be named according to these style guidelines:


    +   * Keep variable names meaningful. For example, don''t use $x to store a visitor''s
    age; instead, use $intVisitor_age.


    If you come back to make changes or fixes in your program from when you first
    wrote it, you will be confused with variable names like $x because $x doesn''t
    mean anything, whereas $intVisitor_age says exactly what it contains.


    +   * Variable names should be reasonably short. Typing a 25-character name just
    a few times will become a tedious and frustrating. Try abbreviating; just be sure
    your abbreviation makes sense.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Declaration and Assignment


    For example, instead of $strWebPageFieldForEmailAddress, it would obviously be
    as clear if it were named $strVisitor_Email.


    +   * Prefix a variable type abbreviation to the variable name. Although variable
    types are explained a later in the chapter, you should recognize now that the
    variables suggested so far in this list have been preceded by int or str.


    +   * All variables should be prefixed with: int for integers, float or dbl for
    floating-point numbers or doubles, and string for, and arrays.


    +   * Format your variable names in a hierarchical fashion, separating divisions
    with underscores. For example, if you have a visitor''s first name, last name,
    and e-mail address, it''s better to use $strVisitor_first, $strVisitor_last, and
    $strVisitor_email inside of $strFirstName, $strLastName, and $strEmail because
    you find later in the script that you want to refer to another email address or
    another person''s name. Although the underscore-divided names are a bit longer,
    it''s worth to keep conflicts and confusion from arising later in the script.
    You don''t want to find yourself asking, "Whose e-mail do I have in $strEmail?"


    Following these conventions makes your programs easier to understand to anyone
    that has to work with them, especially you.


    # Assigning Variables


    There are two ways a variable can be assigned: in the script itself, or by the
    PHP interpreter. For now, let''s focus on variables that are created (declared
    and assigned) by the script itself. Variables assigned automatically by the PHP
    interpreter (such as the $HTTP_GET_V variable found in the first example of this
    chapter), will be discussed in Chapter 3.


    Assignment, as you''ve already learned, occurs when a value is stored in the order.
    Whenever you assign a value to a variable, you must keep in mind the order in
    which the assignment will be processed. For example, the following two statements
    are not equivalent:


    ```

    $intFive = 5;

    $5 = $intFive;

    ```


    As a rule of thumb, read assignments from right to left—the first would read,"the
    number 5 should be assigned to the variable $intFive." Reading assignments in
    this fashion will become more and more important as your programs and statements
    grow in complexity.'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'Now, take a look at the second assignment—“the variable $intFive should be
    assigned to the number 5.” The latter doesn’t make sense; it will definitely not
    work. In fact, if you were to use this statement in a program, PHP would stop
    with a parse error.


    # Declaring a Constant


    Declaring a constant is done using the define function (more will be discussed
    in Chapter 11, “Classes and Objects”). The following example demonstrates the
    declaration of a constant, EXAMPLE, with a value of 5:


    ```

    ```php

    /* ch0ex@2.php - demonstrates constant declaration */

    define(''EXAMPLE'', 5);

    EXAMPLE;

    ```

    ```


    Notice that EXAMPLE is not preceded by a dollar sign in either statement. The
    dollar sign is reserved for use only with variables; constants should never be
    preceded by a dollar sign.


    Just as variables have naming requirements that must be followed, so do constants.
    The following guidelines will ensure that you always use a valid name for a constant:


    +   - A constant''s name should not be preceded by a dollar sign.

    - The name should begin with a letter or underscore, but never a number.


    Constants cannot be redefined; that is, the value of EXAMPLE cannot be changed
    after it has already been defined. After all, that’s why it’s defined as a constant
    instead of a variable.


    As with variables, constants should also be subject to naming conventions for
    clarity and good style. Adhered to consistently, the following guidelines improve
    the style of your code:


    +   - Keep names short enough to be convenient. This rule is followed less strictly
    than most; constants are generally only used for setting options, they aren’t
    usually mentioned as frequently as variables. Therefore, it’s generally acceptable
    to make a constant’s name longer.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Declaration and Assignment


    +   * Constants should always be named using all uppercase. This helps distinguish
    that you''re intentionally using the word without quotes. Thus, as soon as you
    see a word in your program written in all caps, you know you can probably look
    for a constant being defined with that name.


    +   * Separate words with underscores. Since constants don''t have the ability
    to switch case (capitalizing the first letter of every word and using lowercase
    for the rest), underscores are necessary to keep the separate words in a name
    easily distinguishable.


    +   * Name constants in a hierarchical fashion. With variables, you have several
    constants that are related in some way (they all describe the program, for instance),
    it would be good to prefix them with PROGRAM_VERSION, PROGRAM_AUTHOR, and PROGRAM_LAST_UPDATE,
    which are a lot ambiguous than VERSION, AUTHOR, and LAST_UPDATE, which could describe
    a number of different things.


    Also, by using a hierarchical form (as opposed to separating words, which would
    lead to names like PROGRAM_VERSION and LAST_UPDATE), the constants are grouped
    into a related set. Because they all begin with PROGRAM_ we know they''re related.
    If, however, we used a name such as LAST_PROGRAM_UPDATE, although it is clear,
    we don''t know just from looking at it that it is related to the other constants.


    # NOTE


    Although a variable prefix is very useful in variables, it''s not necessary in
    constants. The purpose and type of a constant never change (and it can''t), so
    it is safe to assume that a variable is whatever type it is defined to be when
    it''s first defined.


    # TIP


    It''s a good idea to define all constants at the beginning of your program. If
    you get halfway through and need to define another constant, scroll back up and
    put it at the top of the file instead of just putting wherever you are currently
    in the program. This will make it much easier to find out what the value of the
    constant is; looking through hundreds of lines of code in multiple files is quite
    a task if constants aren''t defined at the top of the program.


    # Deciding Whether to Use a Variable or Constant


    If you find wondering whether to use a variable or a constant, think how the information
    will be needed within the program.'
