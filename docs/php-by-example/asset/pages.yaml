  md: "# Logging In for a Session\n\nThe example given previously is fine, but it\
    \ isn't quite practical because it requires the visitor to log in for every protected\
    \ page he wants to. Because the login script expects each visitor to POST his\
    \ username and password, and because a POST occurs only when the visitor submits\
    \ the login form, the form would have to be submitted every time a protected page\
    \ was viewed. Visitors would get so frustrated with reentering their username\
    \ and password every time they wanted to see another page.\n\nThe cure for this\
    \ dilemma is to use sessions. Allows allow your programs to remember information\
    \ about a user between page views. Thus, if one page stores a user's username\
    \ in a session, marking him as logged in, it's possible to allow him to move from\
    \ one protected page to the next without having to resubmit his username and password\
    \ every time.\n\n> TIP\n you're familiar with how cookies work, you might be wondering\
    \ if sessions are different from cookies; in fact, they are quite different, despite\
    \ their similar purpose. Session data is stored on the server and not in the client's\
    \ browser file. This makes the data secure and more reliable because the user\
    \ cannot directly change his session data. In contrast, cookies can be changed\
    \ by anyone savvy enough to open and edit his browser cookie file.\n\nA cookie\
    \ is typically sent to the browser, even if you're using sessions, but that cookie\
    \ is only an encrypted identifier that tells the server for which visitor it should\
    \ call up the session data. Changing this cookie wouldn't allow the visitor to\
    \ give himself unauthorized access; it would simply erase his session and force\
    \ him to start over.\n\n> TIP\nIt's possible to customize the ways sessions work\
    \ within your program. For example, the session ID must be returned to the client\
    \ in some form the session data can be called up on the next request. However,\
    \ the session ID can be sent either as a cookie or by modifying any of the local\
    \ links on the page (something PHP will do automatically if you set it to).\n\n\
    For our purposes, the default settings for sessions will work just fine, but when\
    \ you find time to experiment with sessions, it's a worthwhile area of the language\
    \ to look into. For more information, check out the section on sessions in the\
    \ PHP Manual at http://www.php.net/manual/en/ref.session.php.\n\n# Using Sessions\n\
    \nBefore you can use a session, you have to initialize it using session_start().\
    \ This function checks to see if the current user already has a session assigned\
    \ to him (each visitor has a separate session), and if he does, the data from\
    \ that session is imported into the current script as"
  merge: -1
  pgno: 316
- img_proc: true
  md: '# Practical Techniques 305


    the HTTP_SESSION_VARS array. If the current visitor doesn''t already have a session,
    a new, empty one is created.


    session_start() takes no parameters and has no return value, so the syntax guide
    has been omitted.


    # NOTE


    Whenever you need access session data, you must call the session_start() function.


    Session data is stored in the $HTTP_SESSION_VARS array, if you want to view or
    change session data, you simply access the appropriate element in the array.


    However, to add a new variable to the session, you must use session_register()
    to do so. This only has to called once for each variable; you don''t have to call
    it in subsequent page views or when you want to access the session data.


    session_register() has the following syntax:


    variable name is the quoted name of the variable you want to store in the session.


    For example, the following program starts a session and sets the username element
    in the $HTTP_SESSION_VARS array to a dummy username:


    ![](img/b437c18efec65ed938962e8683b6a70c_317_0.png)


    ```

    <?php

    /* ch14ex.php - demos session functionality */

    // Initialize the session

    session_start();

    // Store the username in the session

    username = ''jsmith'';

    // Create a place for ''username'' in the session''s storage

    session_register(''username'');

    echo "jsmith" has been stored in the session.\n?>

    ```


    Because the username "jsmith" is now stored in the session, it will be available
    to any other script on the same server in the same visit, as the following program
    can demonstrate:'
