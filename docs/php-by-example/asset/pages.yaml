    # Object-Oriented Programming Concepts


    Until now, our discussion of classes has been on a purely functional level. The
    methods you''ve seen so far will work, but style improvements and concepts that
    exist go along with classes that will make using them even more beneficial to
    you.


    Now we''re going to look at two concepts—black boxing and data protection—that
    will help you understand some of the added advantages to using classes.


    # Black Boxing


    Classes are most useful for black boxing concepts. Black boxing involves hiding
    the inner workings of a concept and only letting the programmer to think about
    the higher-level results he is trying to produce.


    > NOTE


    Black boxing is also sometimes called encapsulation; the two terms are interchangeable.
    The important idea is that using black boxing will allow you to forget how you
    solved particular problems once you''ve coded and tested their solutions. You''ll
    be less likely to become confused with a large program this way.'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'For example, the bank account class alone barely provides an advantage over
    other approaches without classes. However, by adding error checking and other
    features to the class, the class becomes the method of choice over other methods
    for representing a bank account within the program.


    Although error checking isn''t complex, hiding it within the class allows the
    programmer to forget how the class works and merely rely on the fact that it does.
    This is often referred to as black boxing.


    Another useless of black boxing is that a complex task can overwhelm even the
    best of the programmers. To simplify matters, we divide things into smaller pieces,
    ensuring that each smaller piece works as desired, and then use the smaller pieces
    to make a larger piece.


    For example, after we know that a bank account class works, we can create another
    class to model a person''s financial assets as a whole. This requires multiple
    accounts, so having the functionality of a single account figured out and black-boxed
    allows the programmer to simply think of the accounts as working objects, leaving
    him without worry about how the accounts themselves.


    # Data Protection


    Another reason to use classes is that they provide data protection; that is, classes
    prevent a programmer from making logic errors in dealing with complex data structures.
    Using a class''s member functions to modify its member variables protects a class''s
    data. By doing this, you are guaranteed that all of the changes necessary to perform
    a desired task are executed every time you want to perform the task.


    For example, one desired function of a bank account class might be to keep a record
    for each transaction with the account. However, if a programmer modifies the account''s
    balance member, he will probably neglect to add entry to the account history.


    Good-oriented programming practices dictate that a programmer should use functions
    to access and modify the data within an object. Thus, the programmer will have
    a smaller chance of making a mistake.


    # Example: A Shopping Cart Class


    A shopping cart provides an excellent example for these two concepts. In this
    case, black boxing is useful for being able to use the class without learning
    how everything within it works. This way, the class''s member functions can be
    called with less concentration to the inner workings of the functions.'
  merge: -1
  pgno: 240
