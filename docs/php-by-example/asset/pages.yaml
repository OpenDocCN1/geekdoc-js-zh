    Now that you understand all of the concepts of programming in PHP, it''s time
    to use those skills to create Web sites that are truly useful and intuitive. We''re
    going to talk about how you can integrate a MySQL (pronounced My-Ess-Que-El) database
    to into your Web site. By doing so, you have an easy way to display an almost
    unlimited number of items without creating a separate page for each one. You can
    also store information about a visitor between multiple requests and even visits
    to the Web site. Common examples of database use are product catalogs, automated
    Web site subscriptions, and even Web site searches. The possibilities are virtually
    endless; databases can be used to create customized news, discussion boards, archiving
    systems, and much more!


    This chapter teaches you the following:


    +   * Using a database to make more content flexible

    * How to plan and create a MySQL database

    * How to connect to a database

    * How to query the database

    * How to make sense of query results'
