  md: '# Using Include Files


    The programs we''ve created so far have been short—fewer than 200 lines of code.
    However, these programs are intentionally shortened as much as possible to focus
    specifically on one or two concepts within the program. Programs for a professional
    Web site will usually be much more detailed. The look and feel of the Web site
    would be more refined on a high-quality site, whereas more features would be added,
    and more error checking would be necessary to make the program user friendly.
    However, these additions increase the amount of code within the program. Thus,
    what once a 200-line program can become a 500 or even 1,000-line program in a
    short time.


    Why is this important? Working with a 1,000-line program can be difficult. Imagine
    digging through 50 function definitions looking for one specific function. It
    would take you a minute or two to find the function, whereas picking the function
    out of a group of 5 at a time would be much quicker. Include files will help you
    divide large programs into smaller files that will all work together as one program
    when the program is executed. We''ll take a look at some other advantages to include
    files as well.


    This chapter teaches you the following:


    +   * The syntax for include

    * How include works

    * How to separate a program into logical file divisions

    * How to use include_once with libraries

    * How to create a library directory

    * Configuration modifications for include'
