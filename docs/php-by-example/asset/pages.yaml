  md: "Nested if statements can be nested to any number of levels, as shown here:\n\
    \n```\nif (condition) {\n    if (condition) {\n        if (condition) {\n    \
    \        // etc.\n        }\n    }\n}\n```\n\nEach condition represents a condition\
    \ you want to test. Each of these statements may also have accompanying nested\
    \ if elseif and else statements, necessary.\n\nFor example, the following program\
    \ improves Example 5 to determine whether input submitted is numeric before it\
    \ tries to determine the number's category; if for some reason other than a number\
    \ is submitted, an error message is displayed.\n\n```\n?php\n/* ch05ex06.php -\
    \ demonstrates nested if statements */\n\n// Grab $intAge from POST array\n$intAge\
    \ = $_HTTP_POST['age'];\n\n// If the form has been submitted\nif ($intAge) //\
    \ will be true if it's been submitted (can't be 0) {\n    if (is_numeric($intAge))\
    \ // A number given {\n        // Assign age group letter to $chrAgeGroup\n  \
    \      if ($intAge < 21) {\n            $chrAgeGroup = 'A'; // Ages 20 and younger\n\
    \        } elseif ($intAge < 41) {\n            $chrAgeGroup = 'B'; // Ages 21\
    \ - 40\n        } elseif ($intAge < 61) {\n            $chrAgeGroup = 'C'; //\
    \ Ages 41 - 60\n        } else {\n            $chrAgeGroup = 'D'; // Ages 61 and\
    \ older\n        }\n    }\n}\n```"
