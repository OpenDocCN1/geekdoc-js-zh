  md: '# Get and Post Form Methods


    You may recognize the other two categories, get and post, from your previous HTML
    experience; they are attributes used in the method tag of a form. Depending on
    which sort of form you use, you will need to use the corresponding category in
    PHP.


    Get forms are commonly used for search queries and small amounts of information
    that may be exposed in the address bar of the visitor''s browser. A request is
    also made whenever a user clicks link.


    # CAUTION


    You should not use a form when requesting a visitor''s password or other sensitive
    information. Items from a form will be in plain sight of anyone within sight of
    the visitor''s monitor.


    When information is sent to the server in a get request, PHP puts all of the form
    fields and their values in the appropriate input array, $_HTTP_GET_VARS. So, to
    get the value of a field, use the value of $_HTTP_GET_VAR with the field name
    as the key.


    Let''s take a look at an example. The following program generates a personalized
    greeting for a visitor:


    ![](img/b437c18efec65ed938962e8683b6a70c_73_0.png)


    ```

    <?php

    /* ch03ex11.php - shows personalized greeting */

    <html>

    <head><title>Welcome!</title></head>

    <body>

    <form action="ch03ex11.php" type="text">

    What''s your name? <input type="text" name="userName">

    <input type="submit" value="Continue">

    </form>

    </body>

    </html>

    ```


    Since the form''s method isn''t specified and get is the default method, get is
    assumed. The PHP file can find the value for the field in $_HTTP_GET_VARS[''name''],
    as shown in the following file:


    ```

    <?php

    /* ch03ex11.php - shows personalized greeting */

    ?>

    ```'
