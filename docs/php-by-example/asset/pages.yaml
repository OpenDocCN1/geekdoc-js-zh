  md: '# Chapter 5: String Manipulation


    You may find that sometimes you need the length of a string. This is helpful if
    you want to get the last character of a string or check to make sure a string
    is not too long to fit somewhere (such as a particularly limited place on a Web
    page or in a size-limited database field).


    To find the length of a string, use the strlen function, which has the following
    syntax:

    ```

    int strlen(string str)

    ```


    To find the length of a string $str, then, you would use echo strlen($str);


    The complete number of characters (including whitespace characters such as spaces
    and \n is returned. Here is an example:

    $str = ''This is a string.'';

    $str2 = ''Newlines!\nOne\Two'';

    echo strlen($str) . '', '' . strlen($str2);


    The output of this code would be 17, 17. Remember that even though the second
    string appears longer, the \n sequence inside of double quotes is interpreted
    as only one character. The two strings are of equal length.


    # Finding Substrings


    If you already know where to find a substring within a string, things aren''t
    too difficult. However, it''s not always easy; sometimes you only know where a
    substring is in relation to another string.


    Let''s take a string representation of a number raised to a power as an example.
    To interpret such a string, you would have to break the string into two parts:
    the number and the power it''s supposed to be raised.


    Here''s an example:

    $numTopPower = ''20^22'';


    Keep in mind that this example should be allowed to change; although the example
    is 2^2, it could be 3^5, or 5^10. Therefore, you have no idea where the caret
    is going to be and where either number will begin or end.


    So, in order to extract the numbers as substrings, you must first determine the
    positions at which they start and end. You know that the first number will start
    at 0, and you know that the last will will go to the end. You really have to figure
    out where the first number ends and the second begins.


    If you know the position of the caret, you could determine the positions needed:
    The first number would be 1 before the caret''s position, and the second number
    would begin 1 after the caret''s position. Now you need to find the caret''s position.'
