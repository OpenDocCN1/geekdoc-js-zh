    # Using Short Tags


    The other method of outputting large amounts of dynamic data is to use short tags.
    As discussed in Chapter 1, short tags are a shorthand way to make regular PHP
    tags shorter.


    The following example uses the short tag that you''ve already seen:

    <? echo "echo statement is in short tags"; ?>


    # NOTE


    Recall from Chapter 1 using short tags shortens the first tag because you remove
    the letters "php" from it; the closing tag remains the same. Also, the semicolon
    following the command can be omitted since it is the only command with the PHP
    tags.


    Using an echo statement for every dynamic element you wish to output works, but
    it''s still a bit tedious to type "echo" every time. During the development of
    PHP, some PHP programmers were migrating to PHP from ASP (Microsoft''s scripting
    environment known as Active Server Pages, which were somewhat like PHP). These
    programmers were used to ASP tags, which come in two varieties: the regular ASP
    tags, PHP tags, which like, separate ASP code from static output; and the ASP
    equal tag. The ASP tags added an equals sign to the opening ASP tag (hence the
    "equals tag") and eliminated the need for an explicit command to print output.


    PHP has a second short tag that was modeled after ASP''s equals tag. ASP''s equals
    tag, it shortens the amount of code it takes to output a value and eliminates
    the need for the echo statement by appending an equals sign to PHP''s short tag.


    # NOTE


    Remember that short tags must be enabled in PHP''s configuration file to work.
    The short tag and the equal tags are collectively classified as PHP''s "short
    tags." If you experience problems or short tags don''t work as expected, consult
    the configuration section of the PHP manual.'
