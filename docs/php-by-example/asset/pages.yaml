  md: '# Writing a Basic PHP Program


    example at the beginning of this chapter demonstrates this concept quite clearly;
    the program is mostly regular HTML code, but PHP is also used to insert some information.


    Embedded programming will make your job as a programmer much easier; you can add
    programming where you need and use regular HTML the rest of the time. However,
    be sure to enclose your PHP code in tags or your code will not be parsed, but
    rather displayed on the HTML page.


    The following program provides another example of embedded programming:


    ```

    <?php

    /* File: hello_world.php - displays "Hello, World!" */

    ?>


    <html>

    <head><title>Hello, World!</title></head>

    <body bgcolor="white" text="black">


    Hello,

    <?php


    // Send "World!" to the visitor''s browser

    echo "World!";

    ?>


    </body>

    </html>

    ```


    When this file is accessed through a Web server, the PHP interpreter will process
    the file line by line from the top to bottom. Thus, the information before the
    opening PHP tag is sent to the browser, along with the result of the echo statement.
    The Web browser receives an HTML file that looks like this:


    ```

    <html>

    <head><title>Hello, World!</title></head>

    <body bgcolor="white" text="black">

    ```


    Hello, World!


    ```

    </body>

    </html>

    ```


    The browser then displays the file just as it would any other HTML file.'
