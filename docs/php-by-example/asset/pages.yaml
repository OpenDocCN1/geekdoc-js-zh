    # Program Input


    On the Web,—any data your program needs to process or know in order to perform
    its task—is gathered from an HTTP request. An HTTP request occurs whenever a user
    types in an address, clicks a link, or clicks a button on a Web page. The request
    contains information about the request, such as the desired file, any cookies
    that have been sent to the browser for that site, and any form fields that are
    being submitted to the server.


    The request can be very complicated, however. Since PHP was created with Web programming
    in mind, it makes gathering this information less complex.


    You still have to know a few things about the HTTP request because PHP divides
    the input it into categories based on how they arrive in the HTTP request. Input
    is divided into three main categories: get, post, and cookie variables. You must
    know which category the variables are to be able to access them.


    # NOTE


    There is a more direct shortcut for accessing variables discussed later in this
    chapter, along with its advantages and disadvantages. However, make sure you understand
    this material before you try to use the shortcut.


    For now, don''t worry about the cookie variables category; it will be covered
    in Chapter 17, “Putting It All Together.”'
