    # 343


    # NOTE


    Even though a time stamp has its roots in Unix-based environments, projects such
    as MySQL and PHP have made it more common to see time stamps used on Windows machines,
    as well.


    PHP''s time() function, which returns a time stamp for the current date and time,
    is most often used to generate time stamps. A time stamp isn''t hard to manipulate,
    though. For example, if you want a cookie to expire in 30 days, you simply add
    however many seconds are in 30 days (and you don''t have to waste figuring that
    out).


    Following are a few examples:


    ![](img/b437c18efec65ed938962e8683b6a70c_355_0.png)


    +   - To have a cookie expire 30 days from the time it''s set, you take the current
    time stamp generated by time() and add 60 seconds in the minute * 60 minutes in
    an hour * 24 hours in a day * 30 days. You don''t have to figure out how many
    seconds are really; in fact, it makes your code more understandable to leave it
    in your time.


    The following cookie() might be used to set a cookie that should expire in 30
    days:


    ```

    setcookie(''MyCookie'', ''Some value'',

    time() + 60*60*24*30); // sec/min * hr/day * days

    ```


    +   - If you created an online administration interface for a particular Web site,
    you might want to add an extra level of security by timing out sessions that were
    inactive for more than 15 minutes. To do this, you would set a cookie that would
    expire in 15 minutes every time the user hit one of the secure Web pages. If the
    cookie were ever found to be missing, the session would have expired.


    ```

    setcookie(''SessionActive'', true,

    time() + 60*15); // secs*mins

    ```


    Note each time you set the cookie, the expiration value will be updated, effectively
    allowing the session to stay active for as long as the user keeps accessing pages
    that update the cookie with a new time stamp.


    +   - Having your site offer to remember a user''s username for him oftentimes
    makes using your site. A cookie like this should never expire because you don''t
    know how long the user will take to come back. It could be a few days or a few
    months before he revisits your site, and if you set the cookie correctly, his
    password will be remembered for him either way.'
  merge: -1
