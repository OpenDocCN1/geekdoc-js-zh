  md: '# Programming Syntax


    When you accessed the program you just uploaded with your browser, the PHP program
    went through a process before it was returned to the browser. The process performed
    the PHP commands within the file; in this case, that was a single cho each statement.
    Figure 1.3 shows what happens when a request is made for a PHP file.


    ![](img/b437c18efec65ed938962e8683b6a70c_27_0.png)


    Figure 1.3: Unlike HTML files, PHP files are routed through a special process
    that performs the PHP commands within the file before it is returned.


    The PHP interpreter (or parser) is the program that performs the mentioning mentioned
    previously. It reads the PHP program file and executes the commands it understands.
    (If PHP happens to find a command it doesn''t understand, it stops parsing the
    file and sends an error message back to the browser).


    > NOTE


    Just as "interpreter" and "parser" are interchangeable terms to refer to the PHP
    interpreter, "interprets" and "parses" may be used interchangeably to refer to
    the process PHP performs when it processes a PHP file.


    > TIP


    If you are an administrator for the Web server you''re using, you may be interested
    in knowing the executable file you installed (a Windows EXE or DLL, or an Apache
    module or CGI binary on Unix-based systems) is the PHP interpreter.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Chapter 1: Welcome to PHP


    Every time a request for a particular PHP file is made to a Web server, the PHP
    interpreter must process the file prior to returning anything to the browser.
    Because PHP must interpret a PHP program every time that program runs, it is known
    as a scripting language.


    This is quite different from a compiled language, such as C or C++, which is only
    interpreted from a human-readable form once; a C program is translated into machine
    code (code that is processed directly by the computer''s processor).


    # TIP


    In a very strict sense, parsing is the process of splitting commands into smaller
    segments, whereas interpreting is the process of actually performing those segments
    to known commands in order to actually perform the correct command.


    Since PHP has to interpret the commands included within a program, the commands
    must be given in such a way that PHP understands them. For example, if someone
    walked up to you and asked you in German for the time, you probably wouldn''t
    know what he was talking about (unless you knew German or the person pointed to
    his wrist). Likewise, if I walked up to you and said, "Is it what?" you probably
    wouldn''t know what I was talking about, for now, even though I used English words.


    PHP has similar limitations. A statement (the construction of commands and certain
    characters to make a sentence that PHP will understand) must be given using the
    correct commands. For example, the command show text has no meaning in PHP; you
    must instead use a command PHP recognizes, such as echo. Also just as you must
    put your words in the correct order to talk to another person in English, you
    must format the statements you give PHP so that they follow the format PHP expects.


    Syntax, then, is the process of putting together statements that PHP will be able
    to interpret and carry out. Examples of this are PHP''s opening and closing tags.
    PHP only parses code that is between PHP tags. Anything else in the file is returned
    as part of the HTML page, just as seen earlier in the first example.


    ![](img/b437c18efec65ed938962e8683b6a70c_28_0.png)


    Here''s an example. The following statement does not work, even though the command
    is part of PHP''s language: echo "This won''t work."


    The statement won''t work because it doesn''t follow a basic syntax rule that
    requires all statements to be terminated with a semicolon. Some special statements
    must have the semicolon left out, but not many. (The ones that will be pointed
    out as we come to them.) For now, just remember that'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Writing a Basic PHP Program


    statements should end with a semicolon. The following statement is a corrected
    version of the preceding line of code:

    echo ''This works!'';",


    You may notice that leaving the semicolon off a single statement doesn''t cause
    PHP to display an error message. This is a feature of PHP to make it easier to
    insert a single echo statement. To see the error when you try to run the first
    echo statement, copy the statement to two separate lines so it looks like this:

    echo ''This won''t work.''

    echo ''This won''t work.''


    The code will not run and PHP will return an error because there isn''t a semicolon
    separating the statements.


    # Good Style: Using Whitespace and Comments


    You may be curious why PHP requires a semicolon at the end of every statement.
    The answer is that semicolons allow PHP code to be more flexible. By signaling
    the end of a command instead of a new line, new lines can be added or taken out
    of the code without affecting the code itself. In fact, new lines are only a portion
    of what can be changed without changing what the interpreter sees or processes
    the file.


    Whitespace—all spaces, tabs, and line breaks—is left to be used at the discretion
    and preference of the programmer. This may seem trivial at, but think about the
    difference the indentation in an outline makes; the indentation divides topics
    into subtopics and even subtopics under the subtopics into separate sections.
    Take a look at the following example, which contains no whitespace.


    ![](img/b437c18efec65ed938962e8683b6a70c_29_0.png)


    ```

    <<?php

    /* echo1x02.php - an example of code with no whitespace */

    echo ''Hitere'';echo ''Thisprogramhasnowwhitespace'';echo ''It''salmostimpossibleuretore.'';

    ?>

    ```


    # NOTE


    Although the line with all of the echo statements contains no whitespace, the
    program file as a whole does. The line breaks are left to separate the PHP tags,
    comment, and all the echo statements so at least part of the program is easily
    decipherable.


    You can see how hard it would be to read line after line of code like that. This
    code should be split into separate lines, with one for each echo statement.'
  merge: -1
  pgno: 29
