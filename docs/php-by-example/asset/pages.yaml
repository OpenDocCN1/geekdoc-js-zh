  pgno: 366
- img_proc: true
  md: '# Writing A Full Program


    # TIP


    At this point, you''re probably wondering why you would bother to write down a
    single objective if it''s the only one. You''ll soon see that even though this
    is the thing you''re writing down, other things will follow, and having the main
    objective on paper will help you from getting disoriented while you''re working
    on this program.


    Now that you know the main point of your program—that is, now that the obvious
    tasks are on paper—you''ll need to fill in some gaps. For example, what information,
    exactly, do you want to get from the visitor? You''ll need the user''s name, maybe
    a brief summary, and a quick message. It would also be interesting to know when
    each entry was posted, so you''ll want to track the date of each entry.


    That spurs a new question: Where are you going to put this information when it''s
    collected? A MySQL database would serve nicely to handle that.


    As you can see, you already have several tasks before: You''re going to create
    a MySQL database, an HTML form so visitors can post their messages, and a form
    handler script to insert new data into the database.


    Then you realize it''s useless to make a guestbook if you cant see the entries
    in it, so you add a note that you''ll need to write a viewing program to list
    all of the guestbook entries out of the database.


    At this point, you pretty much have everything for this program thought out. Then
    you realize there will always be a few mischievous visitors who add messages to
    your guestbook that don''t belong there. It''s bound to happen sooner or later,
    so you''ll need a way to remove unwanted entries from the guestbook.


    You could remove unwanted entries using the mysql command line if you wanted to,
    but it would be much easier to have an administration interface built into your
    guestbook. So you add a note that you want an admin login screen, as well as delete
    privileges if you''re logged in as admin.


    # Creating a Program Specification Outline


    Several methods can be used to lay out the functions a program should perform.
    Although each system has different styles, program specifications are most commonly
    either drawn in the form of a diagram (a logical flow chart) or outline.


    Diagrams are a great tool for presentations and quick communication within development
    groups, but when you''re working on your own, an outline is the quickest, easiest
    way to go.'
  merge: -1
  pgno: 367
- img_proc: true
  md: "# Chapter 17: Putting It All Together\n\nIf you were to outline the program\
    \ specifications as you brainstormed them, you might get something like this:\n\
    \nFUNCTIONS OF A GUESTBOOK:\n\n+   1. View\n   - Shows all entries (pulled out\
    \ of MySQL table)\n   - If logged in an admin, shows additional link under each\
    \ post to allow for deletions\n\n+   2. Post\n   - Show a form to collect information\
    \ visitor wants post\n   - Handle submitted data by inserting it into the MySQL\
    \ table\n\n+   3. Administration\n   - Show a login form (username/password fields)\n\
    \   - Handle login data\n   - If login data matches specific user/pass pair:\n\
    \     - Set a variable to mark the user as an admin (so the view page shows to\
    \ delete option)\n   - If the login data fails, display an error message\n\n+\
    \   4. Data\n   - The db table will hold the following guestbook data: name, timestamp,\
    \ subject, and message\n\n# NOTE\n\nWith any approach to writing a program, this\
    \ outline shows only one of many possible approaches. It's likely that you would\
    \ come up with a slightly different design you sat down and outlined it on your\
    \ own.\n\n# Organizing Your Program's Files\n\nA full PHP program—such as a guestbook—isn't\
    \ going to be a single file. Web programs are always a set of smaller programs\
    \ designed to work together to accomplish the overall task.\n\nFor example, in\
    \ this case, the view functions (item 1 on the outline) could be placed in a file\
    \ called view.php. However, the first thing you usually see when you use a guestbook\
    \ is the other guestbook entries, you can go on and put the viewing code in index.php.\n\
    \n# TIP\n\nIf your server is set up, you can go to the guestbook directory's location—presumably\
    \ something like http://localhost/guestbook—and the URL will automatically be\
    \ interpreted as a request for index.php, just as a request for http://localhost\
    \ pulls up index.html (or default.htm or index.htm, depending on your server setup).\n\
    \nYou can go through your entire program outline and form an idea for the files\
    \ you'll be creating."
