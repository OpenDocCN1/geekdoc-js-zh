  md: '# Introduction


    This is what you will need to write PHP programs:


    +   * A Web server. It doesn''t really matter what type of Web server you use.
    If you already have access to a PHP-enabled, dedicated Web server, then you already
    have this requirement taken care of.

    * If you don''t have access to a dedicated Web server, you still have other options.
    Windows users are advised to get PHPTriad at www.phpgeek.com/phphtriad Users of
    Unix-based systems should install Apache if it is not already installed. Apache
    is available at www.apache.org.

    * PHP. The PHP interpreter is so necessary that you can run PHP programs. Users
    of PHPTriad for Windows can skip this step; PHPTriad installs a Web server, and
    even MySQL all in one step.

    * For those who don''t already have PHP installed, go to www.php.net/manual and
    read the appropriate instructions for your operating system.

    * A good editor. Many people prefer the basic text editors that come with their
    operating system, or vi or Notepad. GUI-based editors seem to be easier for most
    people to work with. Many editors for PHP programmer. Among these are Edit Plus
    (http://www.editplus.com),HomeSite (http://www.allaire.com/Products/HomeSite),
    and HTML-Kit (http://www.chami.com/html-kit). Other editors are available, but
    generally speaking, you should avoid WYSIWYG (what you see is what you get) editors.
    Chapter 1 will show you that many WYSIWYG editors tend to mangle your code.


    After you have a Web server with PHP installed and a good text editor on your
    workstation, you''re ready to go.


    # What''s Next?


    The first chapter will take you into the world of PHP. You''ll see how and where
    you begin to write your code, and before you have finished reading, you will have
    an opportunity to write a working PHP program. You will then use that program
    to test and make sure that your Web server and PHP are working properly. If they
    aren''t, don''t worry—a troubleshooter can help you fix the problem.


    Get ready to start programming!'
