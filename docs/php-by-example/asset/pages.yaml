    Here-doc allows the code to use more understandable multiline strings. First,
    by using here-doc, you''re saying, "Heads up! I''m using a multiline string here."
    If you take a look at the double-quoted string shown previously-ously, that is
    not suggested in any way; in fact, if you saw the following string alone, you
    would think that it was erroneous:


    ```

    echo ''html'';

    ```


    Using double quotes to create multiline strings is hard to understand just for
    this reason. There''s nothing to say that the string is multiline other than the
    fact that it isn''t ended with a double quote. Or someone reading code might find
    themselves, "Did you mean to do that?


    There''s another reason that here-doc is better than double quotes. The double
    quote at the end of a multiline string doesn''t mean much to anything except "this
    is the end of a string," here-doc allows you to specify an end identifier that
    can be descriptive of the string''s purpose or contents:


    Here''s an example of a here-doc statement:


    ```

    <?php

    /* ch0ex04.php - demonstrates use of here-doc */


    // Set $user and $pass variables

    $user = ''John Doe'';

    $pass = ''doe123'';


    // Outputting a multi-line here-doc string

    echo <<-END_USER_INFO;

    Username: $user<br>

    Password: $pass

    END_USER_INFO;

    ```


    ![](img/b437c18efec65ed938962e8683b6a70c_67_0.png)


    ?

    nThe <<< syntax is used exclusively for here-doc. The first line might be read:
    "echo everything until END_USER_INFO is reached."


    # NOTE


    END_USER_INFO just happens to be the end identifier I chose; while it is appropriate
    for its descriptiveness of the string, it could have been any string following
    the end identifier naming convention, which follows.'
