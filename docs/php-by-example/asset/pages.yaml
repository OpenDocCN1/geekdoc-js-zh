  md: '# Designing and Creating a Table in MySQL


    Creating a table to contain records for books, we would need to have the four
    fields just mentioned. Because all records within a table will have the same fields,
    these fields are defined when the table is created.


    To create a table, you''ll issue a command to a MySQL server (which is why you
    have to have access to a MySQL server to do the things described in this chapter).
    All of the MySQL commands can be executed using any MySQL client. I say any here
    because many different clients are available for MySQL. To keep things simple,
    we''ll stick with those supported by PHP (the mysql_* functions in PHP) and the
    MySQL developers (the mysql command-line utility).


    # TIP


    If you feel short by a command-line utility, you are welcome to find a Windows
    GUI (Graphical User Interface) client made by a third-party developer, such as
    MySQL GUI (http://mysql.com/downloads/mysql-gui.html). PHPMyAdmin also makes a
    very nice database viewing and manipulation client; it''s available at http://phpmyadmin.sourceforge.net.


    In general, these clients aren''t supported well and do not work as the command-line
    utility. You''re probably best off taking the time to become familiar with the
    command-line.


    The most common client for administering MySQL is the mysql command-line client
    that comes with MySQL. If you don''t have the MySQL utility, you can get it at
    www.mysql.com. After you have it, you can start the MySQL client by entering the
    following command on the command line:


    ```

    mysql --user=username --password database

    ```


    Here, username is your MySQL username and database is the MySQL datarbase with
    which you want to work. MySQL will prompt you for your password, which will be
    kept secret as you type it.


    # NOTE


    In case''re unfamiliar with the command line, it is a low-level user interface
    to your operating system.


    In Windows 95 or 98, go to Start, Run, and type command. In Windows NT or 2000,
    go to Start, Run and type cmd. This is the command line.


    In Unix-based operating systems (such as Linux, Solaris, BSD), just use your favorite
    shell.


    Finally, if you''re using a remote Web host (such as a paid Web hosting service),
    you can telnet or SSH to it. After you''ve logged in, you will be presented with
    a Unix-style command line (shell).


    After you''re at a command line, you can enter the command just as it was shown
    earlier.'
