    The output is


    Regular division: 1.8<br>Integer division: 1 r4


    # TIP


    Modulus division is sometimes referred to simply as mod. Expressions are commonly
    read this way; for instance, the remainder calculation in the previous example
    is read “nine mod five.” It is shorter and easier to read an expression this way
    than the whole phrase “remainder of nine divided by five.”


    # CAUTION


    Attempting to use modulus division on a floating-point value is strongly discouraged.
    Any offending values (values that are not integers) will be typecast to integers
    and any decimal values will be truncated. On top of that, PHP will not terminate
    because of this problem it is corrected by the type casting. Use modulus division
    on a value that is a floating-point value if you are fully aware that the value
    will be typecast to an integer before being evaluated with the operator.


    # Order of Operations


    The five operators described in the previous section are simple enough if you’re
    only doing one thing at a time—but if you wish to do more than one operation at
    a time you’ll need to know how PHP evaluates operations when they’re together.


    The order in which operators are evaluated is known as operator precedence. For
    example, an operator that is evaluated before another operator is said to have
    a higher precedence than the operator it was evaluated before, which has lower
    precedence.


    PHP will evaluate all addition and subtraction operations in the order which they
    appear from left to right. The expression 1 + 2 + 3 - 4 + 5, for example, would
    be evaluated from left to right until no operations remained. Figure 4.1 demonstrates
    the evaluation of this statement.


    The next class of operators—multiplication and division—takes precedence over
    addition and subtraction. That is, multiplication and division are evaluated before
    addition and subtraction. You must be careful of this; not doing so may yield
    unexpected results. Figure 4.2 represents the evaluation of the expression 2 *
    2 + 3 * 3.'
