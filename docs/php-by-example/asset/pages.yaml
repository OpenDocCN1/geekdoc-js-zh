  md: '# Chapter 4: Arithmetic


    Table 4.2: This Table Shows the Order of Precedence from Highest (Most Important;
    First to Be Evaluated) to Lowest (Least Important; Last to Be Evaluated)


    +   * *, /, % Multiply, divide, mod

    +, - subtract


    The order of operations isn''t set in, however. You can clarify the order of operations
    or change the order of operations with parentheses. For example, the preceding
    statement, `2 * 2 + 3 * 3`, would have much clearer if it were expressed as `(2
    * 2) + (3 * 3)`. It would then be quite obvious which operations to come first.


    Expressions inside parentheses are evaluated independently of anything outside
    of the parentheses. It can therefore also be said that the items within parentheses
    are evaluated first, before any other parts of the expression are evaluated. Then,
    once a single result for the expression inside of the parentheses is reached,
    the result is used in place of the inner expression (inside the parentheses) and
    the expression outside of the parentheses is evaluated.


    Since expressions inside parentheses are evaluated separately from the operations
    outside of the parentheses, it''s possible to modify the order in which the operations
    of expressions are evaluated.


    Take a look at this example:

    `<?= 2 * (2 + 3) * 3 ?>


    Since parentheses enclose the addition of 2 and 3, that operation must be completed
    before the multiplication outside of the parentheses can take place. Figure 4.4,
    demonstrates the step-by-step evaluation of this expression.


    ![](img/b437c18efec65ed938962e8683b6a70c_92_0.png)


    **Figure 4.4:** The parentheses in this expression changed the way it is evaluated.


    Parentheses can also be nested. That is, a set of parentheses can be placed inside
    of another set of parentheses. Nesting of parentheses is infinite—that is, you
    could have any number of parentheses within parentheses in an expression.'
