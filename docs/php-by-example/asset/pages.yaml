    # ## The foreach Statement


    The foreach statement is similar to for in that it is basically a specialized
    form of the while loop. foreach, however, unlike for, is to be used with arrays.


    Like for, foreach automatically performs a step for every repetition of the loop:
    it assigns the new value of an array to a temporary variable (similar to a counter).


    For example, foreach could be used to sum all of the numbers in an array.


    TIP


    PHP''s built-in array_sum() function will perform the same task, but for simplicity,
    stick with addition for now and concentrate on the looping statement.


    Although probably self-evident


    # ## Basic Syntax


    The syntax for foreach takes two forms: a basic usage to retrieve each value in
    an array, and a second usage to retrieve key/value pairs from an associative array.
    This makes it to not only retrieve each value from an array, but also have the
    value''s key. The key, in this instance, may either be the element''s numeric
    index or its text key, which appears in associative arrays.'
