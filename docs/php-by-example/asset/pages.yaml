  md: '# Chapter 12: Using Include Files


    your files otherwise (using .inc or .html, for example) allows them to be downloaded
    if they are accessible from your Web server. The solution to this is to always
    use the .php extension, forcing PHP to process these files before they are returned
    to the visitor. In the case of code libraries, which generally produce no output
    without a function call, nothing but a blank page would be visible to the visitor.


    The latter is somewhat of a challenge because it usually involves file permissions
    on your Web server.


    > TIP

    If you''re not sure to set up a folder outside of your Web root to be accessible
    only to the user (usually nobody on Unix systems or USER_username on Windows),
    get in touch with your Web server''s administrator for guidance.


    After you have the outside directory set up, the rest is fairly uncomplicated.
    A simple change to the PHP configuration file will allow you to access your library
    files just if they were in the current program''s directory (without using an
    absolute or full path). This way, even if your library directory moves, you can
    simply update your PHP configuration file (instead of many hard-coded absolute
    paths).


    # Configuring PHP''s Default Include DIRECTORY


    PHP allows you to specify where you want to look for the files you include if
    you don''t specify an absolute path (This is similar to the PATH environment variable
    in both Windows and Unix-based systems.).


    > NOTE

    You will need permissions to configure PHP on your Web server to do what is described
    in this section. If you don''t, you''ll need to get your system administrator
    to perform these for you.


    To modify PHP''s default include directories:


    +   1. Open PHP''s configuration file (usually php.ini).

    2. Locate the entry for include_path, which should be on near line 236.

    3. Specify the current directory (./), then the library directory (like /www/lib/
    or C:\InetPublib, along with any other directories you might want to specify.
    Separate each entry with a colon (on Unix) or a semicolon (on Windows), and use
    the appropriate slash (forward slash for Unix, backslash for Windows).


    ![](img/b437c18efec65ed938962e8683b6a70c_270_0.png)'
  merge: -1
