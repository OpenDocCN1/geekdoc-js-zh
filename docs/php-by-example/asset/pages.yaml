  md: 'If the value might be modified sometime during the program’s execution, always
    use a variable. Using a constant completely prevents the value being modified.


    Conversely, if you want to intentionally keep a value from being modified, use
    a constant. This is a built-in feature of the language so you can protect certain
    values from accidentally being changed, either by you or by another programmer
    who isn''t familiar with your program.


    If you''re not sure whether to use a variable or a constant, use a variable. If
    you use a variable where a constant might have been a better choice, it''s not
    really a big problem; however, if you use a constant a variable would have been
    better, changing it to a variable throughout the script would give you a headache.


    # Variable Types


    Variable types, which are handled automatically by PHP, tell what kind of value
    you''re working with. Put things in perspective, think about what you know about
    values. Cat, for example, is text. You can''t multiply by cat because they''re
    not numbers, they''re text. However, 5 and 5 can be multiplied to 25. They are
    numbers, so it works.


    PHP recognizes a value as belonging to a certain data type depending on the characteristics
    of the value. The following sections describe certain characteristics and behaviors
    for each data type.


    # Integers


    An integer is any numeric value that does not have a decimal point, such as the
    following:


    +   - 5 (five)

    - -5 (negative)

    - 0123 (preceded by a zero; octal representation of decimal number 83)

    - 0x12 (preceded by 0x; hexadecimal representation of decimal number 18)


    The last two values on the list are somewhat advanced topics and are rare. They
    are presented for your information so you know what you''re dealing with if you
    ever encounter this notation. It is important, for you to know that preceding
    a number with a zero (which may seem insignificant) is going to produce unexpected
    results. The previous example, for instance, proves this point: 123 is much different
    than 83 (which is 0123 octal).'
  merge: -1
