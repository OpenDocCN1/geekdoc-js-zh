    # 7.2.2 Repeated Actions with `setInterval`


    # Executing Code at Regular Intervals Using `setInterval`:


    The `setInterval` function in JavaScript is another timer function that allows
    you to

    repeatedly execute a function specified at intervals. This is particularly useful
    for

    creating continuous or periodic actions, such as animations, updating content,
    or polling

    for new data.


    +   1. Basic Syntax:


    ```

    setInterval(function() {

    // Code to be executed at each interval

    }, 1000); // 1000 milliseconds (1 second)

    ```


    The function inside `setInterval` will be executed repeatedly at the specified
    interval.


    +   2. Creating Animations with Intervals:


    +   - Rotating Images in a Slideshow


    ```

    let currentindex = 0;

    const images = [''image1.jpg'', ''image2.jpg'', ''image3.jpg''];

    setInterval(function() {

    // Update the image source to create a slideshow effect

    document.getElementById(''slideshow-image'').src =

    images[currentindex];

    currentindex = (currentindex + 1) % images.length;

    }, 3000); // Rotate images every 3 seconds

    ```


    In the above example, the `setInterval` function is used to create a simple

    slideshow by rotating images at regular intervals.


    +   - Real-time Data Updates:


    ```

    setInterval(function() {

    // Fetch and display real-time data from the server

    fetchDataAndDisplay();

    }, 60000); // Fetch new data every 60 seconds

    ```


    For scenarios where real-time is crucial, `setInterval` can be employed to

    periodically update content or fetch fresh data from a server.


    +   - Updating Clock Display:


    ```

    setInterval(function() {

    // Update the displayed time in a clock

    updateClockDisplay();

    }, 1000); // Update every second

    ```


    In user interfaces displaying real-time information like a clock, `setInterval`
    ensures

    that the displayed time is continuously updated.'
