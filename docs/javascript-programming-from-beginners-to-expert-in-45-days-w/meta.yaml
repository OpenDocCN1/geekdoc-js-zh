    # Chapter Four


    # Working with Arrays and Objects


    # 4.1 Arrays: Your Data Storage


    # 4.1.1 Introduction to Arrays


    In JavaScript, arrays are a fundamental way to store and organize multiple values
    within a single variable. They are like containers that can hold various data
    types, including numbers, strings, or even other arrays.


    Defining Arrays:


    ```

    let fruits = [''apple'', ''banana'', ''orange''];

    let numbers = [1, 2, 3, 4, 5];

    ```


    Here, `fruits` is an array of strings, and `numbers` is an array of numbers. Arrays
    use square brackets `[]` for declaration, and each element is separated by comma.


    # 4.1.2 Accessing and Modifying Arrays Elements


    Arrays in JavaScript use a zero-based system, meaning the first element is index
    0, the second at index 1, and so on.


    Accessing Array Elements:


    ```

    let firstFruit = fruits[0]; // ''apple''

    let secondNumber = numbers[1]; // 2

    ```


    To access elements, use the array name followed by the index in square brackets.
    Here, `firstFruit` will contain ''apple'', and `secondNumber` will be 2.


    Modifying Array Elements


    ```

    fruits[1] = ''grape'';

    numbers[3] = 10;

    ```


    You can modify arrays by assigning new values to their respective indices. This
    changes the array in place.


    # 4.1.3 Array Methods for Manipulation


    JavaScript provides built-in for manipulating arrays. Common methods include `push()`,
    `pop()`, `shift()`, and `unshift()`.


    Array Methods:


