    ```\n\nIn this example, each step is executed in order, and the program moves\
    \ to the next step only when the previous one is complete.\n\n+   - **Asynchronous\
    \ Code:**\nAsynchronous code allows tasks to be initiated without waiting for\
    \ their completion. Instead, the program continues to execute other tasks while\
    \ waiting for asynchronous operations to finish.\n\n```\nconsole.log('Step 1');\n\
    setTimeout(function() {\n  console.log('Step 2 (Async)');\n}, 1000);\n```\n\n\
    ```\nconsole.log('Step 3');\n```\n\nHere, 'setTimeout' is an asynchronous operation\
