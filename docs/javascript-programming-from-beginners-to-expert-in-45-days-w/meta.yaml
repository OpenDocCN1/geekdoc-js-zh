  md: "# 9.1.2 Using JSON in JavaScript\n\nParsing JSON Strings using `JSON.parse`:\n\
    \nIn JavaScript, working with JSON involves two main operations: parsing JSON\
    \ strings and converting JSON objects to JSON strings.\n\n# 1. Parsing JSON Strings:\n\
    \n+   - `JSON.parse()` method is used to convert a JSON-formatted string into\
    \ a JavaScript object.\n\n```\nconst jsonString = `'name\": \"Alice\", \"age\"\
    : 30, \"isStudent\": false`;\nconst jsonObject = JSON.parse(jsonString);\nnconsole.log(jsonObject.name);\
    \ // Output: Alice\nconsole.log(jsonObject.age); // Output: 30\nconsole.log(jsonObject.isStudent);\
    \ // Output: false\n```\n\n+   - `jsonString` is a JSON-formatted string representing\
    \ an object with keys \"name,\" \"age,\" and \"isStudent.\"\n- `JSON.parse(jsonString)`\
    \ transforms the string into a JavaScript object, allowing easy access to its\
    \ properties.\n\n# 2. Converting JavaScript Objects to JSON Strings with `JSON.stringify`:\n\
    \n+   - `JSON.stringify()` method is used to convert a JavaScript object into\
    \ a JSON-formatted string.\n\n```\nconst personObject = {\n  name: \"Bob\",\n\
    \  age: 25,\n  isStudent: true\n};\nconst jsonString = JSON.stringify(personObject);\n\
    console.log(jsonString); // Output: '{\"name\":\"Bob\",\"age\":25,\"isStudent\"\
    :true}'\n```\n\n+   - `personObject` is a JavaScript object with keys \"name,\"\
    \ \"age,\" and \"isStudent.\"\n- `JSON.stringify(personObject)` converts the object\
    \ into a JSON-formatted string.\n\n# Key Considerations:\n\n+   - When parsing\
    \ JSON strings, ensure that the input is a valid JSON format; otherwise, a SyntaxError\
    \ will occur.\n- Objects containing functions, undefined values, or circular references\
    \ cannot be directly converted to JSON.\n\n# Use Cases:\n\n# 1. Data Exchange\
    \ with APIs:\n\n+   - When interacting with web APIs, JSON is often used to send\
    \ and receive data between the server and the client. The client can parse the\
    \ received JSON response into a usable format."
