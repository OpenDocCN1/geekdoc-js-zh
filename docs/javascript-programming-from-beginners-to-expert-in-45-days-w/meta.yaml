    # 3.2.1 Introduction to for, while, and do-while Loops


    Loops are constructs that allow to repeat a block of code multiple times. The
    three main types are `for`, `while`, and `do-while` loops.


    Example: Using a Loop for Print Numbers


    ```

    for (let i = 1; i <= 5; i++) {

    console.log(i);

    }

    ```


    This `for` loop iterates from 1 to 5, printing the value of `i` in each iteration.


    # 3.2.2 Iterating Through Arrays and Performing Actions


    Loops are especially useful for iterating through arrays, performing actions on
    each element.


    Example: Iterating Through an Array of Colors


    ```

    let colors = ["red", "green", "blue"];

    for (let i = 0; i < colors.length; i++) {

    console.log(colors[i]);

    }

    ```


    This `for` loop goes through each color in the array and prints it to the console.


    # 3.2.3 Implementing Loops in Real-World Scenarios


    Loops find application in various real-world scenarios, such as processing data,
    creating dynamic interfaces, or handling repetitive tasks.


    Example: Calculating Factorial Using a while


    ```

    let number = prompt("Enter a number:");

    let factorial = 1;

    let i = 1;


    while (i <= number) {

    factorial = i;

    i++;

    }

    ```


    ```

    console.log(`Factorial of ${number}: ${factorial}\`);

    ```


    This `while` loop calculates the factorial of a number entered by the user.'
