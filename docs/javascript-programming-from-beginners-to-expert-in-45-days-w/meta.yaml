- md: "\nExercises for Chapter 8:\n1. Enhance your to-do list project by allowing\
    \ users to mark tasks as completed.\n2. Expand the interactive quiz project by\
    \ adding more questions and improving the user interface.\n\n## Chapter Nine\n\
    \n## Introduction to JSON and AJAX\n\n## 9.1 Understanding JSON\n\n### 9.1.1 Introduction\
    \ to JSON (JavaScript Object Notation)\n\nDefining JSON as a Lightweight Data\
    \ Interchange Format:\n\nJSON, or JavaScript Object Notation, serves as a lightweight\
    \ and human-readable data interchange format. It is widely used for data transmission\
    \ between a server and a web application, as well as for storing and organizing\
    \ data. JSON's simplicity and versatility make it a popular choice for representing\
    \ structured information.\n\nSyntax and Structure of JSON Objects:\n\n- 1. Basic\
    \ Structure:\n\nJSON data is organized in key-value pairs, similar to JavaScript\
    \ objects. These pairs are enclosed in curly braces {}.\n\n```\n{\n  \"key\":\
    \ \"value\",\n  \"name\": \"John Doe\",\n  \"age\": 25,\n  \"isStudent\": false\n\
    }\n```\n\n- 2. Key-Value Pairs:\n\nEach key is a string, followed by a colon `:\
    \ `, and its associated value. Key-value pairs are separated by commas,\n\n- \"\
    name\": \"John Doe\": A string key \"name\" with the associated string value John\
    \ Doe.\n- \"age\": 25: A string key \"age\" with the associated numeric value\
    \ 25.\n- \"isStudent\": false: A string key \"isStudent\" with the associated\
    \ boolean value store.\n\n# 3. Data Types:\n\nJSON supports several data types,\
    \ including strings, numbers, booleans, objects, arrays, and null.\n\n- Strings:\
    \ Represented as sequences of characters enclosed in double quotes.\n- Numbers:\
    \ Can be integers or floating-point numbers.\n- Booleans: Represented as 'true'\
    \ or 'false'.\n- Objects: Represented sets of key-value pairs within curly braces.\n\
    - Arrays: Ordered list of values enclosed in square brackets `[]`.\n- Null: Represents\
    \ the absence of a value.\n\n- 4. Example with Nested Objects and Arrays:\n\n\
    JSON allows nesting objects and arrays, providing a flexible structure for representing\
    \ complex data.\n\n```\n{\n  \"person\": {\n    \"name\": \"Alice\",\n    \"age\"\
    : 30,\n    \"address\": {\n      \"city\": \"Wanderland\",\n      \"country\"\
    : \"Fictional Land\"\n    },\n    \"languages\": [\"English\", \"French\", \"\
    Spanish\"]\n  }\n}\n```\n\n- The \"person\" key contains an object with nested\
    \ keys (\"name\", \"age\", \"address\")\n- The \"address\" key within \"person\"\
    \ has its own nested object.\n- The \"languages\" key contains an array with multiple\
    \ string values.\n\n## Key Takeaways:\n\n- JSON, or JavaScript Object Notation,\
    \ is a lightweight and human-readable interchange format.\n- JSON is organized\
    \ into key-value pairs, resembling JavaScript objects `{}` and separated by commas.\n\
    - JSON supports various data types, including strings, numbers, booleans, objects,\
    \ arrays, and null.\n- Objects can be nested, and arrays for ordered list of values.\n\
    \nUnderstanding JSON is essential for working with web APIs, exchanging data between\
    \ server and client applications, and persisting structured information. Its simplicity\
    \ and compatibility with various programming languages make it a versatile choice\
    \ for data representation.\n\n### 9.1.2 Using JSON in JavaScript\n\nParsing JSON\
    \ Strings using `JSON.parse`:\n\nIn JavaScript, working with JSON involves two\
    \ main operations: parsing JSON strings and converting JSON objects to JSON strings.\n\
    \n# 1. Parsing JSON Strings:\n\n- `JSON.parse()` method is used to convert a JSON-formatted\
    \ string into a JavaScript object.\n\n```javascript\nconst jsonString = '{\"name\"\
    : \"Alice\", \"age\": 30, \"isStudent\": false}';\nconst jsonObject = JSON.parse(jsonString);\n\
    console.log(jsonObject.name); // Output: Alice\nconsole.log(jsonObject.age); //\
    \ Output: 30\nconsole.log(jsonObject.isStudent); // Output: false\n```\n\n- `jsonString`\
    \ is a JSON-formatted string representing an object with keys \"name,\" \"age,\"\
    \ and \"isStudent.\"\n- `JSON.parse(jsonString)` transforms the string into a\
    \ JavaScript object, allowing easy access to its properties.\n\n# 2. Converting\
    \ JavaScript Objects to JSON Strings with `JSON.stringify`:\n\n- `JSON.stringify()`\
    \ method is used to convert a JavaScript object into a JSON-formatted string.\n\
    \n```javascript\nconst personObject = {\n  name: \"Bob\",\n  age: 25,\n  isStudent:\
    \ true\n};\nconst jsonString = JSON.stringify(personObject);\nconsole.log(jsonString);\
    \ // Output: '{\"name\":\"Bob\",\"age\":25,\"isStudent\":true}'\n```\n\n- `personObject`\
    \ is a JavaScript object with keys \"name,\" \"age,\" and \"isStudent.\"\n- `JSON.stringify(personObject)`\
    \ converts the object into a JSON-formatted string.\n\n## Key Considerations:\n\
    \n- When parsing JSON strings, ensure that the input is a valid JSON format; otherwise,\
    \ a SyntaxError will occur.\n- Objects containing functions, undefined values,\
    \ or circular references cannot be directly converted to JSON.\n\n## Use Cases:\n\
    \n# 1. Data Exchange with APIs:\n\n- When interacting with web APIs, JSON is often\
    \ used to send and receive data between the server and the client. The client\
    \ can parse the received JSON response into a usable format.\n\n# 2. Local Storage:\n\
    \n- Storing structured data.\n\n# 3. Dynamic Content:\n\n- JSON is used to update\
    \ parts of a web page without a full reload.\n"
  mdcn: "\n第 8 章练习：\n1. 增强你的待办事项项目，允许用户将任务标记为完成。\n2. 扩展交互测验项目，添加更多问题并改进用户界面。\n\n##\
    \ 第九章\n\n## JSON 和 AJAX 简介\n\n## 9.1 理解 JSON\n\n### 9.1.1 JSON（JavaScript 对象表示）简介\n\
    \n将 JSON 定义为轻量级数据交换格式：\n\nJSON 或 JavaScript Object Notation 是一种轻量且易于读的数据交换格式。它被广泛用于服务器与\
    \ Web 应用之间的数据传输，以及数据的存储和组织。JSON 的简单性和多功能使其成为表示结构化信息的流行选择。\n\nJSON 对象的语法和结构：\n\n\
    - 1. 基础结构：\n\nJSON 数据以键值对的形式组织，类似于 JavaScript 对象。这些键值对封装在大括号 {} 中。\n\n```\n{\n\
    \  \"key\": \"value\",\n  \"name\": \"John Doe\",\n  \"age\": 25,\n  \"isStudent\"\
    : false\n}\n```\n\n- 2. 键值对：\n\n每个键都是字符串，后面跟着一个冒号 `: ` 和其关联的值。键值对由逗号分隔，\n\n- \"\
    name\": \"John Doe\": 字符串键 \"name\"，其关联的字符串值为 John Doe。\n- \"age\": 25: 字符串键 \"\
    age\"，其关联的数值为 25。\n- \"isStudent\": false: 字符串键 \"isStudent\"，其关联的布尔值为 false。\n\
    \n# 3. 数据类型：\n\nJSON 支持多种数据类型，包括字符串、数字、布尔、对象、数组和 null。\n\n- 字符串：表示为封装在双引号中的字符序列。\n\
    - 数字：可以是整数或浮点数。\n- 布尔值：表示为 'true' 或 'false'。\n- 对象：表示为大括号内的键值对集合。\n- 数组：封装在方括号\
    \ `[]` 中的有序值列表。\n- Null：表示值的缺失。\n\n- 4. 嵌套对象和数组的示例：\n\nJSON 允许嵌套对象和数组，为表示复杂数据提供了灵活的结构。\n\
    \n```\n{\n  \"person\": {\n    \"name\": \"Alice\",\n    \"age\": 30,\n    \"\
    address\": {\n      \"city\": \"Wanderland\",\n      \"country\": \"Fictional\
    \ Land\"\n    },\n    \"languages\": [\"English\", \"French\", \"Spanish\"]\n\
    \  }\n}\n```\n\n- \"person\" 键包含一个带有嵌套键 (\"name\", \"age\", \"address\") 的对象。\n\
    - \"person\" 的 \"address\" 键有它自己的嵌套对象。\n- \"languages\" 键包含一个带有多个字符串值的数组。\n\n\
    ## 核心要点：\n\n- JSON 或 JavaScript Object Notation 是一种轻量且易于读的交换格式。\n- JSON 由键值对组成，类似于\
    \ JavaScript 对象 `{}` 并由逗号分隔。\n- JSON 支持各种数据类型，包括字符串、数字、布尔、对象、数组和 null。\n- 对象可以嵌套，数组用于有序值列表。\n\
    \n理解 JSON 对于处理 Web API、在服务器与客户端应用之间交换数据以及持久化结构化信息至关重要。它的简单性和与各种编程语言的兼容使其成为数据表示的多用途选择。\n\
    \n### 9.1.2 在 JavaScript 中使用 JSON\n\n使用 `JSON.parse` 解析 JSON 字符串：\n\n在 JavaScript\
    \ 中，处理 JSON 涉及两个主要操作：解析 JSON 字符串和将 JSON 对象转换为 JSON 字符串。\n\n# 1. 解析 JSON 字符串：\n\
    \n- `JSON.parse()` 方法用于将 JSON 格式的字符串转换为 JavaScript 对象。\n\n```javascript\nconst\
    \ jsonString = '{\"name\": \"Alice\", \"age\": 30, \"isStudent\": false}';\nconst\
    \ jsonObject = JSON.parse(jsonString);\nconsole.log(jsonObject.name); // 输出: Alice\n\
    console.log(jsonObject.age); // 输出: 30\nconsole.log(jsonObject.isStudent); //\
    \ 输出: false\n```\n\n- `jsonString` 是一个 JSON 格式的字符串，表示一个具有键 \"name\"、age\" 和 \"\
    isStudent\" 的对象。\n- `JSON.parse(jsonString)` 将字符串转换为 JavaScript 对象，方便地访问其属性。\n\
    \n# 2. 使用 `JSON.stringify` 将 JavaScript 对象转换为 JSON 字符串：\n\n- `JSON.stringify()`\
    \ 方法用于将 JavaScript 对象转换为 JSON 格式的字符串。\n\n```javascript\nconst personObject = {\n\
    \  name: \"Bob\",\n  age: 25,\n  isStudent: true\n};\nconst jsonString = JSON.stringify(personObject);\n\
    console.log(jsonString); // 输出: '{\"name\":\"Bob\",\"age\":25,\"isStudent\":true}'\n\
    ```\n\n- `personObject` 是一个具有键 \"name\"、\"age\" 和 \"isStudent\" 的 JavaScript 对象。\n\
