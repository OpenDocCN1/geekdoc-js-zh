    \ 0 -190px;\"></div>\n  <div id=\"sl6\" style=\"width: 97px; height: 15px; background-position:\
    \ 0 -175px;\"></div>\n  <div id=\"sl7\" style=\"width: 100px; height: 50px; background-position:\
    \ 0 -125px;\"></div>\n  <div id=\"sl8\" style=\"width: 97px; height: 15px; background-position:\
