    ## 环绕区块框


    你希望在一个容器内将整个元素水平居中（即使该容器有大大的虚线轮廓时）。CSS 中没有专门的元素居中属性，但你可以通过外边距（margins）来实现这种效果。


    如果你有一个非常紧凑的布局，那么就非常简单：计算出居中元素两侧各剩余多少空间，并设置相应的外边距（见图 4-4）：


    ```css

    main {width: 800px;}

    #main {width: 760px; margin: 0 auto 20px;}

    ```


    在这种情况下，这只是简单的数学计算。事实上，你甚至不需要 `div#main` 规则。你可以在容器上使用内边距（padding）：


    ```css

    main {width: 760px; padding: 0 20px;}

    ```


    结果，有不同的方法：


    当你有一个特定宽度的元素，但不知道容器有多大时，你仍然使用外边距。你只需要稍微“巧妙”一下。


    ### 4-4：一个盒子居于另一个盒子内部。


    考虑一种 `div` 是 `body` 元素元素的情况。你想要让它居中，但由于每个浏览器窗口的宽度可能不同，你不知道 `body` 会多宽。只要你给 `div`
    指定一个特定的宽度，就没问题：将左右外边距设置为 `auto`（见图 4-5）。


    ```css

    main {width: 55em; margin: 0 auto;}

    ```


    这种方法之所以有效，是因为 CSS 规范规定：当元素具有特定宽度，且左右外边距由自动确定时，浏览器会取元素与其容器宽度之间的差值，将该差值平分，将一部分应用于左外边距，另一部分应用于右外边距。这样盒子就居中了。


    当然，它不会让该盒子内的文本也居中。如果你也想这样做（另另见图 4-6）：


    ```css

    main {width: 55em; margin: 0 auto; text-align: center;}

    ```


    注意，在 `div` 宽度大于容器的情况下，浏览器在从左到右的语言中会将盒子（内容）左对齐，在从右到左的语言中会将盒子右对齐。


    使用自动外边距使盒子居中。


    使用自动外边距和 **text-align** 使盒子和文本居中。


    ## 浮动包含：溢出


    浮动元素是当前 CSS 布局中非常重要的部分，通常你需要一个元素来包含一些环绕其它的浮动元素。这在默认情况下不会发生（出于某些完全合理的理由；详情请见 http://complexspiral.com/publications/containing-floats/
    的第一部分），因此可能会遇到如下情况：


    ```css

    main {border: 2px dashed gray; background: #9AC;}

    column {float: left; width: 28%; margin: 0 1%; padding: 0 1%;}

    ```


    图 4-7 中列上方的那条虚线是什么？那是 `#main` 周围的完整边框。只是这个 `div` 的高度为 0 像素，而浮动的列 `div` 出了（再次强调，这并不是
    CSS 的错误或缺陷；请参前述 URL 以解释原因）。


    4-7：一个塌陷的盒子未能从视觉上包含其浮动后代。


    有多种方法可以让 `div#main` “环绕”浮动列。最简单的是利用 `overflow` 的行为（见图 4-8）：


    ```css

    main {border: 2px dashed gray; background: #9AC; overflow: auto;}

    ```


    使用 **overflow** 在视觉上包含浮动后代。是的，这有其原因。不，我们在这里不会深究它（但如果你赶时间，请看第 10.6.7 节）。如果你想避开
    IE 的某些故障，请为你的 `overflow` 元素添加一个显式宽度：


    ```css

    main {border: 2px dashed gray; background: #9AC; overflow: auto; width: 100%;}

    ```


    值不一定非恰好是 100%：它可以可以是任何非 `auto` 的值。而且它必须存在，以防止旧版本的 IE 也变成那样。如果你不支持旧版本的 IE，那么可以完全删除
    `width` 声明。这种方法的优点是它让包含元素（`div#main`）留在文档宽度内。这意味着它将保持其下方的后续内容，即使它比后续内容窄。它也会默认与容器一样宽。然而，由于我们的示例为
    `div#main` 设置了边框，声明 `width: auto` 将阻止这一点——整个元素（包括边框）实际上将超出其容器 4 像素——但你可能会遇到旧版
    IE 的问题。


    你想清除紧随其后的任何元素。如果是已知元素，你可以直接给它赋值，如下所示（假设 `footer` 位于 `div#main` 之后）：


    ```css

    {clear: left;}

    ```


    如果你确定同一个元素总是紧跟在 `div#main` 之后，你可以使用通配选择器的相邻兄弟选择器（见图 4-10）：


    ```css

    * {clear: left;}

    ```


    相邻兄弟元素和 **clear** 将页脚推到浮动列下方。


    ## 浮动包含：浮动


    包含浮动的另一种技术是让容器也浮动。


    ```css

    main {border: 2px dashed gray; background: #9AC; float: left;}

    column {float: left; width: 28%; margin: 0 1%; padding: 0 1%;}

    ```


    这种方法有效，是因为浮动被定义为包含任何后代元素。它们也被定义为根据内容所需的宽度，而不会更宽。在这种特定情况下，这是危险的：列被设置为 `div#main`
    宽度的三分之一，但因为它是浮动的，由浏览器决定 `div#main` 有多宽。通过给 `div#main` 设置显式宽度可以轻松解决这个问题（见图 4-9）：


    ```css

    main {border: 2px dashed gray; background: #9AC; float: left; width: 100%;}

    ```


    4-9：使用 **float** 在视觉上包含浮动后代。


