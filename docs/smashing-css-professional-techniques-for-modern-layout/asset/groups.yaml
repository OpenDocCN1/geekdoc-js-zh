    \ Here’s a list of some function-identical declarations:\n\n- `margin: 1em; margin:\
    \ 1em 1em 1em 1em;`\n- `padding: 10px 25px; padding: 10px 25px 10px 25px;`\n-\
    \ `border-color: red green blue; border-color: red green blue green;`\n\nof course\
    \ those values are in the order top-right-bottom-left, or TRBL (which keeps you\
    \ of TRouBLe).\n\n## SELECTIVELY OVERRIDING SHORTHANDS\n\nbecause shorthand properties\
    \ fill in undeclared defaults, that doesn’t mean we have to use them. In fact,\
    \ it can be useful to declare 80% of what you want with a shorthand, and override\
    \ it in one place to get the other 20%.\n\nSuppose you’re trying to get a border\
    \ that’s three pixels wide, dotted, and black on three sides and red on the fourth\
    \ side (see Figure 2-5). You could write it out one side at a time, but that would\
    \ get repetitive. Instead, you can declare:\n\n```css\nborder: 3px dotted black;\n\
    border-left-color: red;\n```\n\nIn this way, you tweak only the one little piece\
    \ that needs to be different than the rest. Even better, you can do it all within\
    \ the same rule.\n\n2-5: Reddening one side of a border.\n\nCommon example of\
    \ selectively overriding shorthands would be with headings, which have a great\
    \ deal in common except for the font sizes. If you’re satisfied with the default\
    \ font sizes, then you can just do this:\n\n```css\nh1, h2, h3, h4, h5, h6 {\n\
    \  font-weight: normal;\n  font-style: italic;\n  font-family: Helvetica, sans-serif;\n\
    \  font-size: 1.5em;\n}\n```\n\nOn the other hand, you’re going to be setting\
    \ your own heading sizes, as in Figure 2-6, then find:\n\n```css\nh1, h2, h3,\
    \ h4, h5, h6 {\n  font: italic 100%/1.5 Helvetica, sans-serif;\n}\nh1 { font-size:\
    \ 225%; }\nh2 { font-size: 185%; }\nh3 { font-size: 140%; }\n```\n\nWhen you do\
    \ this kind of selective overriding, it’s a good idea to make sure the overrides\
    \ match the shorthand. That way, if (as is often the case) the selectors have\
    \ equal specificity, overrides will win out over the shorthands.\n\nheader sizes\
    \ with selective overriding.\n\n***49***\n\n## UNIVERSAL SELECTION\n\nI am going\
    \ to show you the use of the asterisk symbol (*) in selectors. Don’t get overexcited:\
    \ it isn’t as wild a card as you might think. Here’s a basic example: the asterisk\
    \ is called the universal selector. What that does is directly select every element\
    \ in the document and apply those styles to them. Looks like a wildcard, and in\
    \ one way it is, because you can use it to select a whole lot of elements without\
    \ directly naming them. As an example, suppose I wanted to select all of the elements\
    \ inside this div:\n\n```html\n<div>\n  <h1>Hey ho!</h1>\n  <p>paragraph</p>\n\
    \  <ul>\n    <li>One</li>\n    <li>Two</li>\n    <li>Drei</li>\n  </ul>\n</div>\n\
    ```\n\nas simple as:\n\n```css\n* {\n  border: 1px solid red;\n}\n```\n\nThe result\
    \ is exactly the same as if I’d written:\n\n```css\ndiv h1, div p, div em, div\
    \ ol, div li {\n  border: 1px solid red;\n}\n```\n\nalmost exactly the same. The\
    \ visual result is the same, as evident in Figure 2-7, but there’s a very slight\
    \ difference, which is in the specificity. You see, the universal selector has\
    \ a specificity contribution of 0,0,0,0. That means div has specificity 0,0,0,1\
    \ and all the others in that grouped selector has specificity of 0,0,0,2. Other\
    \ than that, the results are the same. You might be hoping that this enables you\
    \ to select all of your headings with * instead of h1, h3, h4, h5, h6. Sorry,\
    \ but no. It doesn’t work that way. You can use it as a wildcard match for elements\
    \ as shown before. That’s as far as it goes.\n\n first faced by any aspiring Web\
    \ stylist is: Should I use class or id? Like things in life, this question has\
    \ a simple answer, and then there’s a much more complicated answer. The simple\
    \ answer is this: Use class for any “label” that might show up once in a page,\
    \ and id for anything that will appear only once. By “label,” I mean a word you\
    \ might want to attach to an element, which is what class and id get 44% of the\
    \ time. Typical examples of id values are header and footer, on the expectation\
    \ that any page will have only one header and footer. Class values are a little\
    \ more scattered, could be anything from links to more information to tabs for\
    \ any navigation tabs to odd for every other row in a table. The complicated answer\
    \ requires weighing not only the expected uniqueness of a label but the specificity\
    \ effects of id and class. Since selectors containing ids have higher specificity\
    \ than those with just classes, you run into situations where it’s impossible\
    \ to give a single rule. Simple example. Suppose you’ve written in your site styles:\n\
    \n```css\nbody { background: black; }\na { color: white; }\n```\n\nWhen you decide\
    \ that your contact page should be less forbidding, so you want the header a nice\
    \ light gray and all of your navigation links a nice medium gray, you write:\n\
    \n```css\n.contact { background: #BBB; }\n.contact links a { color: #257000; }\n\
    ```\n\nUnfortunately, the header’s navigation links will all stay white, thanks\
    \ to the higher specificity of header a, as shown in Figure 2-8.\n\n2-8: Unattractive\
    \ links in the header.\n\ncan work around the problem by saying this:\n\n```css\n\
    header a, .navlinks a { color: #257000; }\n```\n\neven:\n\n```css\nheader .navlinks\
