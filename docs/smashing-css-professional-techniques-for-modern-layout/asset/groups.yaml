- md: "\nbe to have the server figure it out. In this scenario, the data being graphed\
    \ is from a database and the page generated by a template of some type. In that\
    \ case, just build into the template the means of calculating the various needed\
    \ values, their own separate style sheet.\n\nOr is to write some JavaScript to\
    \ do the heavy lifting. In this approach, the various would not be included in\
    \ the stylesheet along with the rest of the graph styles. When the page was loaded,\
    \ the JS would loop through the table twice: once to collect all and determine\
    \ the maximum, and then a second time to dynamically assign the height values\
    \ to their respective td elements.\n\n## CHAPTER THE (NEAR) FUTURE\n\nThe focus\
    \ is on what’s coming—the techniques you’ll use in the immediate near-term future.\
    \ From styling elements to rearranging layout based on parameters to crazy selection\
    \ patterns to transforming element layout, these are all techniques that you may\
    \ use tomorrow, next month, or next year. With partial browser support, they’re\
    \ all on the cutting edge of Web design.\n\nWait, be careful not to get cut! A\
    \ number of sites can help you figure out the exact patterns you need to use these\
    \ techniques.\n\n- //css3please.com/\n- //css3generator.com/\n- //www.westciv.com/tools/gradients/\n\
    - //gradients.glrzad.com/\n\nAlso, a number of JavaScript libraries can extend\
    \ support for advanced CSS back into browsers, in some cases as far back as IE/Win\
    \ 5.5. Some are very narrowly focused on browser families, whereas others are\
    \ more broadly meant to allow support in all browsers. These can be useful in\
    \ cases where your visitors haven’t quite caught up with but you don’t want them\
    \ to miss out on all the fun.\n\n- //css3pie.com/\n- //www.useragentman.com/blog/csssandpaper-a-css3-javascript-library/\n\
    - //www.keithclark.co.uk/labs/ie-css3/\n- //code.google.com/p/ie7-js/ (actually\
    \ a good deal more powerful than it makes it sound)\n- //ecsstender.com/\n\nAlso\
    \ a good many CSS enhancements available as plug-ins for popular JavaScript libraries\
    \ such as jQuery. If you’re a user of such a library, definitely do some digging\
    \ to see what was created.\n\nCareful! While these techniques are powerful and\
    \ can deliver a lot of power to your site, you need to test them thoroughly in\
    \ the browsers of the day to make sure you didn’t accidentally make the page completely\
    \ unreadable in older browsers.\n\n## HTML 5\n\nHTML 5 is really no different\
    \ than styling HTML 4. There are a bunch of new elements—styling them is basically\
    \ the same as styling any other element. They generate the same as any other div,\
    \ span, h2, a, or what have you.\n\nHTML 5 specification is still being worked\
    \ on as of this writing, so this may change a bit but the following declarations\
    \ may be of use to older browsers that don’t know what to do with the new elements.\n\
    \n```css\naside, canvas, details, embed, figcaption, figure, footer, header, menu,\
    \ nav, section, summary {display:block;}\ndatalist, keygen, mark, meter, progress,\
    \ rp, rt, ruby, time, wbr {display:inline;}\n```\n\nYou may have noticed that\
    \ I left out fairly important new elements: audio and video. Because it’s hard\
    \ to know exactly how to treat them. Block? Inline? All depends on how you plan\
    \ to use them. What about really old browsers, like IE6? (Note I said “old,” not\
    \ “unused.” In an interesting version of popular culture, browser popularity has\
    \ very little to do with age.) For those, you need to use a bit of JavaScript\
    \ in order to get the browser to recognize them and therefore able to style them.\
    \ There’s a nice little script available at http://remy.com/html5.js that auto-forces\
    \ old versions of IE to play nicely with HTML 5. If you’re going to use and style\
    \ them, you should definitely grab that script and put it in. Once you’ve gotten\
    \ your ducks in a row you can get down to styling. Remember: there’s really nothing\
    \ new about styling with these new elements (see Figure 7-1). For example:\n\n\
    ```css\nfigure {\n  float: left;\n  border: 1px solid gray;\n  padding: 0.25em;\n\
    \  margin: 0 0 1.5em;\n}\nfigcaption {\n  text-align: center;\n  font: italic\
    \ 0.9em Georgia, \"Times New Roman\", serif;\n}\n```\n\n<figure>\n  <img src=\"\
    splash.jpg\" alt=\"A toddler’s face is obscured by a rippled and dimpled wall\
    \ of water thrown up by her hands slapping into the surface of the swimming pool\
    \ in she sits.\">\n  <figcaption>SPLASH SPLASH SPLASH!!!</figcaption>\n</figure>\n\
    \n7-1: A styled HTML 5 figure and caption.\n\n## LOOK LIKE HTML 5\n\nYou like\
    \ the new semantics of HTML 5 but you’re just not ready to take your sites to\
    \ HTML 5. Maybe your site’s user base is mostly older browsers and you’d rather\
    \ stick to entities like HTML 4 or XHTML. Not to worry: You can have the best\
    \ of both using the venerable class attribute. This was documented by Jon Tan\
    \ in his article at http://jontangerine.com/03/preparing-for-html5-with-semantic-class-names.\
    \ The basic idea is to use old-school elements like div and span, and add to them\
    \ classes that exactly match element names in HTML 5. Here’s a code example. Figure\
    \ 7-2 shows this example in a browser.\n\n```html\n<div class=\"figure\" style=\"\
    float: left; border: 1px solid gray; padding: 0.25em; margin: 0 0 1.5em;\">\n\
    \  <img src=\"spring.jpg\" alt=\"A small child with twin pigtail braids, back\
    \ to the camera, swings away from the camera on a playground swingset while the\
    \ late afternoon sun peeks over the crossbar of the swingset.\">\n  <div class=\"\
    figcaption\" style=\"text-align: center; font: italic 0.9em Georgia, 'Times New\
    \ Roman', serif;\">Swinging into spring.</div>\n</div>\n```\n\n7-2: A styled HTML\
    \ 4-classed figure and caption.\n\nCompare the styles there to those found in\
    \ the preceding section, you’ll see that the only difference is that the names\
    \ figure and figcaption are preceded by periods—thus using them as class names.\
    \ The markup is a little different, of course, though it’s the structure. The\
    \ advantage of this approach is that if you have these styles in place at the\
    \ point when you decide to HTML 5, then all you need to do is change your markup\
    \ to use HTML 5 elements instead of classed divs and then strip off the periods\
    \ to turn the class selectors into element selectors.\n\n## MEDIA QUERIES\n\n\
    Media queries could honestly be its own chapter, or possibly its own book. Thus,\
    \ what follows will necessarily be just a brief taste of the possibilities. You\
    \ should definitely follow up with more research, because in a lot of ways this\
    \ is the future of Web styling. The point of media queries is to set up conditional\
    \ blocks of styles that will apply in different media environments. For example,\
    \ you could write one set of styles for portrait displays and her for landscape\
    \ displays. You might change the colors based on the bit depth of the display.\
    \ You could change the font based on the pixel density of display. You might even\
    \ range the page’s layout (see Figure 7-3) depending on the width or number of\
    \ pixels available in the display.\n\n7-3: A basic three-column layout.\n"
  mdcn: "\n让服务器来处理。在这种情况下，被绘制图表的数据来自数据库，而页面是由某种类型的模板生成的。在这种情况下，只需在模板中构建计算各种所需值的机制，并为它们编写单独的样式表即可。\n\
    \n或者是编写一些 JavaScript 来完成繁重的工作。在这种方法中，各种样式将不会与图表的其他样式一起包含在样式表中。当页面加载时，JS 将遍历表格两次：第一次收集所有数据并确定最大值，第二次动态地将高度值分配给各自的\
    \ `td` 元素。\n\n## 第 X 章：（近）的未来\n\n重点在于即将到来的东西——即你在近期内将使用的技术。从为元素设置样式，到根据参数重新排列布局，再到疯狂的选择模式，以及元素布局的变换，这些都是你明天、下个月或明年可能用到的技术。由于浏览器的部分支持，它们现在都处于\
    \ Web 设计的最前沿。\n\n等等，小心别被切着了！许多网站可以帮助你找到使用这些技术时所需的确切模式。\n\n- //css3please.com/\n\
    - //css3generator.com/\n- //www.westciv.com/tools/gradients/\n- //gradients.glrzad.com/\n\
    \n此外，许多 JavaScript 库可以将高级 CSS 的支持扩展回浏览器中，在某些情况下甚至可以追溯到 IE/Win 5.5。某些库非常针对特定的浏览器家族，而另一些则更广泛地旨在支持所有浏览器。当你的访问者尚未完全跟上潮流，但你又不想让他们错过所有乐趣时，这些工具非常有用。\n\
    \n- //css3pie.com/\n- //www.useragentman.com/blog/csssandpaper-a-css3-javascript-library/\n\
    - //www.keithclark.co.uk/labs/ie-css3/\n- //code.google.com/p/ie7-js/ (实际上比它听起来要强大得多)\n\
    - //ecsstender.com/\n\n许多 CSS 增强功能也以插件的形式存在于 jQuery 等流行的 JavaScript 库中。如果你是此类库的用户，一定要挖掘一下看看创建了哪些内容。\n\
    \n小心！虽然这些技术非常强大并能为你的网站带来巨大功能，但你需要在当前的浏览器中对它们进行彻底测试，以确保你没有无意中让在旧版浏览器中的页面完全无法读取。\n\
    \n## HTML 5\n\nHTML 5 与为 HTML 4 设置样式并无区别。有一系列新元素——为它们设置样式基本上与设置任何其他元素的样式相同。它们生成的与与任何\
    \ `div`、`span`、`h2`、`a` 或其他元素一样。\n\n在本书期间，HTML 5 规范仍在制定中，因此可能会发生一些变化，但以下声明对于不知道如何处理新元素的旧版浏览器可能有用。\n\
    \n```css\naside, canvas, details, embed, figcaption, figure, footer, header, menu,\
    \ nav, section, summary {display:block;}\ndatalist, keygen, mark, meter, progress,\
    \ rp, rt, ruby, time, wbr {display:inline;}\n```\n\n你可能注意到我遗漏了一些相当重要的新元素：音频（audio）和视频（video）。因为很难确定具体该如何处理它们。块级？行内？这完全取决于你计划如何使用它们。像\
    \ IE6 这样非常老旧浏览器呢？（注意我说的是“旧”，而不是“未使用”。在一种有趣的流行文化中，浏览器的流行程度与年龄几乎没有关系。）对于那些浏览器，你需要使用一些\
    \ JavaScript 来让浏览器识别它们，从而能够对其设置样式。在 http://remy.com/html5.js 有一个很好的脚本，可以自动强制旧版本的\
    \ IE 与 HTML 5 良好兼容。如果你打算使用并为它们设置样式，绝对应该获取该脚本并放入。一旦你理顺了，就可以开始设置样式了。记住：使用这些新元素设置样式其实并没有新奇（见图\
    \ 7-1）。例如：\n\n```css\nfigure {\n  float: left;\n  border: 1px solid gray;\n  padding:\
    \ 0.25em;\n  margin: 0 0 1.5em;\n}\nfigcaption {\n  text-align: center;\n  font:\
    \ italic 0.9em Georgia, \"Times New Roman\", serif;\n}\n```\n\n<figure>\n  <img\
    \ src=\"splash.jpg\" alt=\"一个幼儿的面脸被她手拍击泳池水面溅起的波纹和凹凸的水墙遮挡住。\">\n  <figcaption>水花水花！水花！！！</figcaption>\n\
    </figure>\n\n7-1: 设置了样式的 HTML 5 figure 和标题。\n\n## 看起来像 HTML 5\n\n你喜欢 HTML 5 的新语义，但你还没有准备好将你的网站迁移到\
    \ HTML 5。也许你网站的用户群大部分使用旧浏览器，而你更倾向于坚持 HTML 4 或 XHTML 等实体。不用担心：你可以使用经典的 `class`\
    \ 属性兼顾两者优点。Jon Tan 在他在 http://jontangerine.com/03/preparing-for-html5-with-semantic-class-names\
    \ 的文章中记录了这一点。基本思想是使用像 `div` 和 `span` 这样的传统元素，并为它们添加与 HTML 5 中元素名称完全匹配的 `class`。这里有一个代码示例。图\
    \ 7-2 显示了这个示例。\n\n```html\n<div class=\"figure\" style=\"float: left; border:\
    \ 1px solid gray; padding: 0.25em; margin: 0 0 1.5em;\">\n  <img src=\"spring.jpg\"\
    \ alt=\"一个扎着双马尾的小孩背对着相机，在游乐场的秋千上荡荡，傍晚的阳光从秋千的横杆穿过来。\">\n  <div class=\"figcaption\"\
    \ style=\"text-align: center; font: italic 0.9em Georgia, 'Times New Roman', serif;\"\
    >荡入春天。</div>\n</div>\n```\n\n7-2: 设置了样式的 HTML 4 类名 figure 和标题。\n\n将那里的样式与上一节中的样式进行比较，你会发现唯一的区别是\
    \ `figure` 和 `figcaption` 名称前面有一个点——即将它们作为类名。当然，标记略有不同，尽管结构是一样的。这种方法的用处是，当你决定使用\
    \ HTML 5 时，你只需要更改标记以使用 HTML 5 元素代替类名 `div`，然后去掉点以将类选择器转换为元素选择器。\n\n## 媒体查询 (MEDIA\
    \ QUERIES)\n\n媒体查询老实说可以单独成章，甚至可以是一本书。因此，后续内容注只是对可能性的简要尝试。你绝对应该进行更多研究，因为在很多方面，这就是\
    \ Web 样式的未来。媒体查询的意义是为不同的媒体环境设置条件样式块。例如，你可以为竖屏显示编写一套样式，为横屏显示编写另一套。你可能会根据显示器的位深更改颜色。你可能会根据显示器的像素密度更改字体。你甚至可以根据可用的宽度或像素数量调整页面布局（见图\
    \ 7-3）。\n\n7-3: 基础三栏布局。\n"
