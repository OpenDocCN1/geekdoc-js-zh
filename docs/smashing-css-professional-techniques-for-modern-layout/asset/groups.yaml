    引言


    CSS 的成功是惊人的——其成功几乎不亚 HTML 本身——以至于有时让人难以捉摸。它现在无处不在，从 Web 浏览器到应用商店再到聊天客户端，没有任何褪色的迹象。随着这种语言的使用不断扩展，它的能力也在不断演进。


    本书包含了近 100 个技巧、技术、工具和窍门，用于使用 CSS 制作出色的网站。每一部分内容都是独立的：你可以翻到随机任意一页，阅读你发现的内容，而无必担心漏掉了本章之前的某些关键内容。这意味着文本假设你至少对
    CSS 及其用法有一定的程度的了解。假设的熟练程度最好被描述为“高级初学者到中级”。因此，如果你刚刚起步，或者你通常对 CSS 的了解比编写规范的人员还要多，那么你可能无法从书中获得太多益处。但对每个人来说，都有大量值得学习和享受的内容。


    在书的第一部分，我们对实用工具和基础技术进行了概述，包括一些较为冷门的 CSS 选择器。第二部分介绍了你使用 CSS 可以完成的各种功能，包括有趣的特效、实现同一目标的不同路径、布局等。第三部分是高级的尖端技术，这些技术可能在本月还无法在你的项目中使用，但随着时间的推移，它们将成为你的工作中越来越核心。


    请访问本书的配套网站 www.wiley.com/go/smashingcss 下载示例样本。


    十多年前，如果你认为 CSS 已经处于临终状态或许是可以被原的，但截至 2010 年，它比以往任何时候都更有活力和吸引力。我希望你像我喜欢编写这本书一样，喜欢书中发现的内容！


    ## 第一部分 基础知识


    第一章：工具


    第二章：选择器


    ## 第一章 工具


    构建 Web 页面（或应用程序）的本质与任何其他事情一样，通过使用工具得到了极大提升。涉及到 CSS 时，既有帮助我们编写 CSS 的工具，也有构建帮助我们工具的工具。甚至还有某些工具可以让浏览器支持比其原生代码库能够承受更多的
    CSS。你是一个构建者、工匠、制造者——本章详细介绍了一些将真正丰富你工具箱的内容。


    Firebug（见图 1-1）是任何 Web 创作者工具箱中两个必不可少的工具之一。（对于 Chrome 用户，请跳至“Web 开发者”部分。）它是针对 Firefox
    的完全免费工具。如果你使用其他浏览器，请继续阅读：访问 getfirebug.com。点击 Install 按钮（在本书期间它是免费的）并让它安装。重新启动
    Firefox，准备好惊喜。事实上，单条技巧不足以涵盖 Firebug 的所有功能。


    HTML 标签页（见图 1-2）在左侧显示文档结构。请注意，当你悬停在 HTML 标签页中的元素上时，该元素会在页面本身中高亮。这通过颜色编码包含了元素的内容区域、内边距（padding）和外边距（margins）。在本书期间，内容区域为浅蓝色，内边距为浅黄色，但颜色并不重要，重要的是你可以直接在页面上看到它们。


    在 HTML 标签页的右侧，你可以点击 Style 标签（见图 1-3）查看应用于当前检查元素的 CSS。这不仅包含你编写的内容，还包含浏览器本身从内置样式表中应用的内容。如果你看到来自
    `html.css` 或 `quirk.css` 的样式，例如那些是内置样式。这些被称为“UA 样式”，即用户代理样式（user agent styles）。你可以通过
    Style 标签页的弹出菜单更改它们是否被应用。


    需要注意的是，Firebug 有时会向你显示你未指定的属性，例如 `background-clip`。除非你确定显式声明了这些属性，否则你可以在很大程度上忽略它们。此外，如果你使用简写属性，它将展开为单独属性。也就是说，像这样的内容：`font:
    1em "Andale Mono", "Courier New", Courier, monospace;` —— 在 Firebug 中将表示为：


    - family: "Andale Mono","Courier New", Courier, monospace;

    - size: 1em;

    - size-adjust: none;

    - stretch: normal;

    - style: normal;

    - variant: normal;

    - weight: normal;

    - height: normal;


    当 Style 标签页完全生效时，Firebug 会拆分到单独窗口。这种表示方式并不一定是坏事——它确实提醒你，简写属性的内容往往比你实际描述的要多——起初可能会令人困惑。（关于简写属性的更多信息，请参见第
    2 章。）


    另一点需要注意的是，Style 标签页中显示的规则按**反向选择性**（reverse-specificity）列出——也就是说，第一个是应用于检查元素的特定具体的规则，下一个是次之具体的，依此类推。（关于选择性的更多信息，请通过通过右键点击任何元素并在弹出的上下文菜单中选择“检查元素”（Inspect
    Element）来查看“选择性”（Specificity）（见图 1-4）。你也可以点击 Firebug 图标旁边的小指针和箭头，以切换到检查模式。当你在页面上移动时，元素将显示轮廓，点击其中一个即可对其进行检查。点击任何声明左侧的复选框以通过
    Firebug 禁用该声明。在尝试通过逐一关闭属性来测试属性之间如何相互作用时，这非常有用。如图 1-5 所示，当你将鼠标指针悬停在值上时，还可以看到一个显示相应颜色的小色块。


    Computed 标签页（见图 1-6）显示元素的计算样式——这意味着它将向你显示浏览器为每个已知 CSS 属性应用的值，无论是否有人提到过它们。这种视图非常有用，例如当你想确切知道浏览器为标题提供了多少像素的行高（line-height）时。


    Layout 标签页（见图 1-7）让你查看元素盒模型组件的精确维度和大小：高度、宽度、内边距、外边距等。这些内容以一种更酷的方式显示：当你悬停在面板中显示的框上时，像素尺会出现在原位，放置在元素外框边缘的顶部和左侧。正如图
    1-8 所示，你可以通过在 Firebug 界面中的几乎任何地方点击或右键，编辑元素属性值（如元素内容本身、添加或编辑 CSS 属性和值以及更多内容）。


