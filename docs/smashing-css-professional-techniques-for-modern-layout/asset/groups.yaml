    At point you may be thinking, “Hey, awesome. I always wanted to know how I could
    dect classes with a longer and more complicated syntax.” Ah, but remember: Attribute
    selectors are not confined to the paltry two attributes we’re used to selecting
    upon—namely, class and id. You can select based on any attribute whose value can
    be a space-separated-list of words, where by “words,” I mean “strings of characters.”


    There are a few examples of other ways to use this kind of selector.


    - `img[alt~="figure"]` Any image whose alternate text contains the word “figure”

    - `table[summary~="data"]` Any table whose summary text contains the word “data”

    - `[title~="2009"]` Any element whose title text contains the word “2009”


    ## VS. ATTRIBUTE SELECTOR


    You can use attribute selectors not only as a long-winded way to replace class
    selectors, but as ID selectors. The following two rules will select the same element:


    ```css

    .lead-in {font-weight: bold;}

    [id="lead-in"] {font-weight: normal; font-style: italic;} own```


    Wait, fine, but take a moment to contemplate the visual result of those two rules:
    The lead-in graph will be both boldfaced and italicized, as in Figure 2-12.


    This is because the specificity contribution of an attribute selector is 0,0,1,0—the
    same as a class or pseudo-class. So the first rule’s specificity is 0,1,0,1 and
    the second’s is 0,0,1,1. In this case over font-weight, the first rule shown wins
    due to its higher specificity.


    This is one of those interesting little wrinkles in specificity that can open
    the door to new forms of authoring. For example, you may remember the earlier
    discussion in “ID vs. Class” about how IDs easily trump classes and so you might
    consider just labeling everything with IDs. If your user base is all on browsers
    that support attribute selectors, then you can go to a mixture of IDs and classes
    and then just use attribute selectors whenever you need to reference an ID. That
    way, you don’t have to worry about an #ID selector pattern trumping specificity
    of everything else you try to write.


    ## STRING ATTRIBUTE SELECTION


    Once was finished, work immediately started on the next version of CSS, which
    we may call CSS3 even though there’s no single specification anymore. (It’s a
    long story.) One thing that got the most attention was selectors, and attribute
    selectors were no exception. They picked up a set of substring-match patterns,
    all of which are incredibly useful.


    The basic one is the substring matcher. To see how it’s useful, consider an old
    example. To select any link to that exact URL, use `a[href="http://w3.org/"]`.
    Suppose, though, that you have a lot of links to the W3C’s website, not just the
    home page, and yet you want to style them all the same.


    A good way to do that would be to select on just the w3.org part of the URL (see
    Figure 2-13). Here’s how:


    ```css

    a[href*="w3.org"] {font-weight: bold;}

    ```


    This is shown in Figure 2-13: Selecting all links that contain **w3.org** in the
    URL. To do this: Just include an asterisk before the equal sign. No, this is not
    a universal selector. You can put asterisks in the value to create UNIX- or grep-style
    wildcards. Always, this can be used on any element and attribute. To return to
    the example of uniquely selecting the image of your company’s logo, you could
    write:


    ```css

    img[src*="mainlogo.png"]

    ```


    will select any img that points to a file named mainlogo.png, or indeed that has
    the characters mainlogo.png anywhere within the src value. Thus it would select
    both of the following:


    `<img src="/img/2010/mainlogo.png.gif" alt="Co Inc." />`

    `<img src="/img/2010/mainlogob.png" alt="Co Inc." />`


    Probably shouldn’t name your files and directories that way, though. I mean, I’m
    just saying. There are a lot of creative ways to use this particular power. You
    could select any image that comes from a particular directory just by selecting
    the part of their URLs that corresponds to that directory. For that matter, you
    could style all the links into a certain area by the directory that appears in
    their href values.


    ```css

    a[href*="/contact"] {color: maroon;}

    a[href*="/news"] {font-weight: bold;}

    ```


    Remember that attribute values should be treated as case-sensitive. (It’s just
    easier that). Therefore, you’ll get a match on the first two of the three examples
    to follow, but not the third:


    ```css

    img[alt="Figure"] {border: 1px solid gray;}

    ```


    `<img src="fig1.gif" alt="Figure 1. The arch." />`

    `<img src="fig2.gif" alt="Figure 2. Mayor Quimby, a political figure of some note."
    />`

    `<img src="dig.gif" alt="Several men trying to figure out how to dig a hole."
    />`


    isn’t matched because “figure” isn’t the same as “Figure.” In this case, of course,
    can be seen as a good thing, since (based on the alt text) the third image doesn’t
    represent a figure in the formal sense. It just happens to have the word “figure”
    in its alt text which is okay, but realize that the following would also be matched
    by the shown rule:


    `<img src="lost.gif" alt="Lost again. Figures, don’t it?" />`


    that “Figure.” It’s a match!


    Get around this limitation in cases where you know capitalization will vary by
    only so. Thus, if you wanted to make sure you selected all instances of “Figure”
    and “figure,” make the selector:


    ```css

    [alt*="figure"] {border: 1px solid gray;}

    ```


    that will match any instance of those characters, including “configure,” “disfigure,”
    “figures” (to name a few). This isn’t the end of substring selection—nor the beginning,
    as it were. See the next section for an explanation.


    ## SUBSTRING ATTRIBUTE SELECTION


    While arbitrary attribute value substring matching is nice (see preceding section),
    sometimes to restrict where you look to just the beginning or end of an attribute’s
    value. Fortunately, there are ways to do just that.


    To select based on a substring at the beginning of an attribute value, use this:


    `a[href^="http"]`


    By using the caret (^), that rule selects any a whose href attribute starts with
    http. This is a way to select all the links that point to external sites, assuming
    that all of your internal pages are- or site-relative and you never use the string
    http in your site’s file system. You can do something simple, like this:


    ```css

    a[href^="http"] {font-weight: bold;}

    ```


    To select based on a substring at the end of the attribute value, use this pattern:


    `a[href$=".pdf"]`


    By using the dollar sign ($), that rule selects any a whose href attribute ends
    with .pdf. This is a really simple way to call attention to your PDF-download
    links (as in Figure 2-14).


    ```css

    a[href$=".pdf"] {padding-right: 18px; background: url(/pdf.png);}

    ```

