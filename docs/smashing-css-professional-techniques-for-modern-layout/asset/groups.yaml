    ***19***


    1-17: The IE Developer Toolbar in action.


    Nice feature of the Toolbar is that you can easily toggle between showing computed
    styles and just the declared styles using the Show Default Style Values check
    box (Figure 1-18).


    Similarly, you can use Show Read-Only Properties to show you every last aspect
    of an affected element’s DOM (Document Object Model) properties. If you aren’t
    comfortable with JavaScript and DOM scripting, this probably isn’t for you. (It
    certainly isn’t for me.)


    The IE Developer Toolbar with Show Default Styles disabled.


    The IE Developer Toolbar includes a subset of the Web Developer Toolbar’s features,
    but most useful ones, like outlining elements and validating local HTML and CSS,
    appear in the Elements layer. View also has a nifty entry called CSS Selector
    matches (see Figure 1-19).


    It opens up a window that shows you all the rules in the CSS and how many times
    each selector matches elements in the document. Any rule that says “0 match(es)
    for:” isn’t matching the page, and you should consider removing that rule.


    ***21***


    1-19: The Selector Matches report.


    The IE Developer Toolbar includes built-in Developer Tools, so you don’t have
    to install anything extra. The documentation is online and, as of this writing,
    housed at a URL only slightly less indecipherable than that for the Toolbar. So,
    just type Discovering Internet Explorer Developer Tools** into your favorite search
    engine and you should get there via the top result.


    To open up the Tools, select Developer Tools in IE’s Tools menu (visible in Figure
    1-20), or press F12 on your keyboard. Yep, that’s it. What you get is something
    very similar to the IE Developer Toolbar, which is to say a hybrid of Firebug
    and the Web Developer Toolbar. The tabs are mostly the same as the IE7 Toolbar’s,
    but the tabs below that are more like Firebug than they are the IE7 Toolbar.


    The Developer Tools in IE8.


    One thing I personally find confusing about the Developer Tool’s Style tab is
    that the styles are in an order that doesn’t really make sense to me. It certainly
    isn’t in order of specificity. The listing does show which declarations are being
    overridden by others, but without a sensible ordering like that in Firebug, it’s
    harder to work with.


    Though the Toolbar and Tools don’t capture the full range of features found in
    the Web Developer Toolbar, they are quite useful and should be a part of any Internet
    Explorer install for tracking down other oddities.


    AGONFLY (FOR OPERA)


    If your development browser is Opera, then you’ll want to make use of Dragonfly,
    a development environment that comes built into Opera 9.5 and later. Go to opera/dragonfly
    to get more information.


    ***23***


    To open up Dragonfly, the default path is to pull down the Tools menu, and then
    under Advanced, select Developer Tools. However, you can install a Debug menu
    by going to opera/dragonfly and finding the install link. Once you’ve installed
    it, it’s easy to open up Dragonfly and several features in that menu. Either way,
    you can also press Option+Command+I (for Mac users) or Option+Control+I (for Windows)
    to bring it up. An anomaly is that this keyboard shortcut isn’t a toggle: If Dragonfly
    is already open, you can’t use the keyboard to close it. For that, you’ll need
    the mouse, or else Command+W (Control+W) closes it. This works great if Dragonfly
    is open in a separate window. If Dragonfly is docked in the browser window, though,
    Command+W only closes Dragonfly if it’s been focused by clicking on something
    in it. Otherwise, it closes the whole window.


    Another feature of the Debug menu is that it has links straight to HTML, CSS,
    and other configurations. Another fun area is the Layout submenu, which lets you
    set Opera into layout modes like Emulate Text Browser and Show Structural Elements.
    There’s even a Nostalgia mode (shown in Figure 1-22) that will warm the heart
    of any veteran of 1980s-era computing.


    21: The Dragonfly page in Nostalgia view.


    Though Dragonfly’s layout bears a strong resemblance to Firebug’s, there are some
    notable differences. In the first place, the Styles tab on the right can show
    you the computed styles along with declared styles (see Figure 1-23), and each
    grouping can be expanded or contracted. As, what you see here is not exactly what
    was declared, with shorthand properties broken out to individual properties. One
    nice touch is that Dragonfly will show you the properties if you want to see them—at
    least in the computed styles. A welcome difference from Firebug is that any declaration
    that is overridden is grayed out with [overwritten] in orange-yellow text next
    to it (shown in Figure 24). This clutters things up and makes it harder to see
    the values in the overridden styles.


    ***25***


    23: Dragonfly with the Computed grouping.


    24: Overwritten styles shown in the Styles tab.


    25: The Layout tab.


    In addition to showing you the dimensions of the layout box for the element being
    inspected, it also tells you the various properties like offsetTop and scrollLeft.

