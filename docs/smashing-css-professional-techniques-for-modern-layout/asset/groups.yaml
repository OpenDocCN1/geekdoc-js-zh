    ## PARALLAX


    parallax is a subtle technique that’s fun to employ as an Easter Egg on your site,
    and also sheds a little light on how simple, straightforward percentage-based
    background image repositioning can yield unexpected results. (It’s also something
    that’s very, very difficult to illustrate in print, so you’ll definitely want
    to try this one out for yourself.)


    Start, consider how percentage-based positioning is done. Say you assign a background
    a position of 50% 50%. That will cause its center to be aligned with the center
    of the background area. Similarly, if you assign 100% 100%, then its bottom-right
    corner will be aligned with the bottom-right corner of the background area. See
