    Chapter 4: Layouts\nChapter 5: Effects\n\n## CHAPTER TIPS\n### A few simple words\
    \ to the wise\n\nCAN use a few good tips to get things right in no time flat.\n\
    \nTwo of my favorites are “always house on a nice street over a busy street” and\
