    普通样式和布局分组。


    如果你正在寻找一个轻量级的跨浏览器元素检查器，那么图 1-29 所示的 XRAY 正合你的胃。它的功能范围非常有限，但只要你需要的正是有限范围，这种专注性实际上是它的优势所在。


    **1-29：XRAY 页面。**


    访问 westciv.com/xray，将巨大的 XRAY 框拖动到你的书签栏（或者如果你想隐藏它，可以拖到菜单栏中）。然后，每当你进入一个页面并想要检查某个元素时，调用
    XRAY 并选择你感兴趣的元素即可。


    如果你选择了一个元素，它会被高亮显示，并向所有方向显示尺寸信息，而图 1-30 所示的 XRAY 框将提供关于该元素在文档树中位置的额外信息、任何 ID 或类值以及一组核心
    CSS 属性值。如果你选择继承层级下的任何元素，XRAY 将切换到检测该元素。若想在下次需要它之前移除 XRAY，只需点击框右上角的关闭按钮即可。


    **运行中的 XRAY。**


    另一个用途不同的工具是 MRI (westciv.com/mri)，它让你输入一个 CSS 选择器，然后显示页面上该选择器会选中哪些元素。


    ## SELECTORACLE


    Selectoracle（见图 1-31）听起来像是一个数据库产品的广告。实际上，它是一个在线工具，可将有效的选择器翻译成类似于英语的内容。（该名称来自“Selector”和“Oracle”的组合。）


    访问 selector.theopalgroup.com/selectoracle，输入一个或多个有效的 CSS 选择器，无论它们有多复杂。保持英语或切换语言到西班牙语，点击
    Explain This! 按钮。你将获得输入的每个选择器的解释，例如：


    li:child(2n+3):not(:last-child)


    检查解释：


    li 元素，它是一个从第三个元素开始的奇数子元素，并且是 ul 元素后代的子元素。


    **1-31：Selectoracle 页面。**


    ## 诊断样式表


    如果你希望浏览器在加载带有过时、损坏标记的页面时向你“尖叫”，你可以使用诊断样式表。通过诊断样式表，你可以快速获得视觉提示，明确页面页面标记在何处出了问题。诊断样式表的一个示例可以在
    css.com/tools/css/diagnostic 找到（兼容 CSS3 和 IE7），类似的资源位于 accessibility.org/site/2006/07/angry-text。例如，诊断样式表中的一行代码是：


    `* {outline: 5px solid red;}`


    这会在任何带有 style 属性的元素周围加上一圈粗实线红框。你可以使用类似 background-color: lime 的内容进一步加强效果，真正突出重点。其核心思想是捕捉标记出现的地方（无论是通过
