    `p` 元素时，该规则不会出现。伪类（pseudo-classes）会显示，但伪元素不会。如果你正在使用涉及生成内容的清除浮（clearfix）解决方案，这可能会令人困恼（更多信息请参见第
    4 页的“清除浮”）。


    如果你正在使用 Firefox 进行开发，但想获得 Firebug 的核心功能，请访问 firebug.com/lite.html（如图 1-9所示），并根据你的情况遵循
    Internet Explorer、Opera 或 Safari 的说明。你可以将其链接到你正在测试的任何浏览器中，或将其作为书签脚本（bookmarklet）添加到书签栏（我推荐这样做）。


    在 Internet Explorer 中运行的 Firebug Lite 并不像 Firefox 扩展那样功能全——这也是它被称为“Lite”版的原因——但它仍然非常强大且实用。


    ## 网页开发者工具栏


    除了 Firebug，网页开发者工具栏（Web Developer Toolbar, WDT）是任何创作者工具箱中的另一个核心工具。它是完全免费的 Firefox
    的完全免费扩展。要获取你的副本，请访问 chrispederick.com/work/web-developer 并安装。或者，你可以访问 addons.mozilla.org，搜索
    Web Developer Toolbar，并从那里的 WDT 页面进行安装（见图 1-10）。


    1-10: **addons.mozilla.org** 上的网页开发者工具栏页面。


    通过 Firebug，我无法涵盖 WDT 能够完成的所有操作；事实上，用一整个章节都不够。这里是一些精选菜单的亮点，但当然，在安装 WDT 之后，你应该花时间探索所有可用的菜单和选项。


    CSS 菜单可以禁用页面缓存，如果你正在进行大量微小更新且浏览器缓存变得“顽固”，这会很有用。你还可以关闭 JavaScript（见图 1-11），这对于发现当所有脚本功能失效或你的脚本框架未加载时页面会发生什么情况非常有帮助。


    CSS 菜单中的样式由 Firebug 涵盖，但非常棒的一点是能够仅关闭嵌入样式、或仅关闭链接样式（如图 1-12 所示），或内联样式（不是说你不应该使用样式！）。如果你想看到一些奇异的效果，甚至可以杀死浏览器的内置样式。


    信息（Information）菜单（图 1-13）包含许多有趣的冷知识，包括显示文档中的 ID 信息；页面 div 顺序的统计；页面中使用的颜色等。你还可以调用一个元素工具，让你点击任何元素来查看其属性和字体信息的摘要、其祖先和后代元素，它在提供的信息方面与
    XRAY 非常相似；关于 XRAY 的更多信息请见后续。


    1-12: 通过 CSS 菜单禁用链接样式表。

    1-13: 通过信息菜单显示类名和 ID 值。


    图 1-14 所示的轮廓（Outline）菜单允许你划分元素的类——所有的行、所有的链接、所有定位元素、所有表格单元等等——并设置自定义的元素集合和颜色。你还可以选择在勾勒时是否在页面上显示名称。这个菜单比初看起来要复杂得多。我将其视为“布局诊断菜单”，因为我勾勒一组元素是为了快速查看它们彼此之间的布局情况，以及可能出现问题的地方在哪里。


    通过轮廓菜单对块级元素进行勾勒和识别可以让你快速访问许多验证器、错误检查器和调试器。不过，它最好的功能之一是存在验证本地 HTML（Validate Local
    HTML）和验证本地 CSS（Validate Local CSS）项目（见图 1-15）。在这两种情况下，你当前正在查看的页面会被封装成序列化字符串并发送给相应的验证器。因此，如果你验证本地
    HTML，页面的标记将发送到 HTML 验证器并返回报告。这对于验证来自防火墙后、本地硬盘的页面非常有用——即那些不在公共网上、因此验证器服务无法访问的页面。有了本地验证，这不再是一个问题。


    1-15: 工具（Tools）菜单。


    一旦进入 IE 开发者工具栏，你会在浏览器窗口处打开一个类似 Firebug 的面板，如图 1-17 所示。面板顶部还有一些网页开发者菜单。你可以点击面板右上角关闭按钮旁的小“双窗口”图标，将整个面板生成到独立的窗口中。以这种方式扩展面板，在笔记本电脑显示器和投影仪等演示设置中可能特别有价值。


