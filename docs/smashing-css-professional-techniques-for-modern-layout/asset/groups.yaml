    \ the column contents, that’s no big deal. Well, actually, we could have just\
    \ adjusted the middle column and left the column rule alone, like this:\n\n```css\n\
    .column {width: 20%; margin: 0 5%; float: left;}\n.column {width: 30%; border:\
    \ 1px solid gray; border-width: 0 1px; margin: 0; padding: 0 4%;}\n```\n\nresult\
    \ would be essentially the same, with maybe a pixel or two of difference in the\
    \ alignment of the separators.\n\nYou may be looking askance at some of the numbers\
    \ there, and with good reason. Where did the padding come from, and what about\
    \ the result that 5% divided by two equals 2%?\n\nThis brings me to point #3,\
