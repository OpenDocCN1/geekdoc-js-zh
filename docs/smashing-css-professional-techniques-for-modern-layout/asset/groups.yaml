- md: "\nlets in the background.\n\nYou can place the image wherever you want in the\
    \ background, you have a lot more than plain old list-style-image permits. You\
    \ do need to remember to add in some padding, adding, of course—otherwise, the\
    \ element content will sit on top of the background!\n\nIf you want to line the\
    \ image up with the first line of text, there is a little bit of an art to it,\
    \ and absolutely guarantee to-the-pixel alignment with, say, the baseline of the\
    \ first line of text. You can get very close, and in many cases will be in the\
    \ right place, but it’s never a sure. It is one of those cases where you have\
    \ to accept the potential flaws, or else try a different approach.\n\nWhat if\
    \ this particular approach is that you aren’t constrained to the first line of\
    \ text? Then you can have the markers be vertically centered compared to the whole\
    \ list item, even if it goes to multiple lines. Combined with intervening borders,\
    \ as depicted in Figure 3-19, this can be a look.\n\n3-19: Vertically centered\
    \ background markers.\n\nIf you want to drop in variant markers for certain types\
    \ of list items (see Figure 3-20), that’s as simple as classing the list items\
    \ and bringing in new images.\n\n```css\n.stars {list-style: none;}\n.stars li\
    \ {\n  background: 0 0 0.1em no-repeat;\n  padding-left: 16px;\n}\n.stars li.m\
    \ { background-image: url(star-m.gif); }\n.stars li.k { background-image: url(star-k.gif);\
    \ }\n```\n\n```html\n<ul class=\"stars\">\n  <li class=\"g\">The Sun</li>\n  <li\
    \ class=\"m\">V645 Centauri (Proxima Centauri)</li>\n  <li class=\"g\">Alpha Centauri\
    \ A</li>\n  <li class=\"k\">Alpha Centauri B</li>\n</ul>\n```\n\nThe downside\
    \ to this approach is that the images, being in the background, won’t print for\
    \ the majority of users. Accordingly, you’ll want to declare regular list markers\
    \ in a print stylesheet or something similar.\n\n## RATING BULLETS\n\nThere is\
    \ an even more advanced way to do your own customized list markers, though it\
    \ is compatible with older browsers. In this approach, you mix out-denting with\
    \ generated content (see Figure 3-21).\n\n```css\ni:before { content: url(star.gif);\
    \ margin-right: 8px; }\ni { text-indent: -20px; list-style: none; }\n```\n\nYou\
    \ don’t need to add any extra elements, because the generated content effectively\
    \ becomes its own marker at the beginning of each list item’s content. This does\
    \ mean that the image is treated as inline content, so you can vertically align\
    \ it with respect to the text’s baseline, and you can also address specific classes\
    \ to get specific icons (see Figure 3-22).\n\n```css\ni.m:before { content: url(star-m.gif);\
    \ }\ni.k:before { content: url(star-k.gif); }\n```\n\n3-21: Generating markers.\n\
    3-22: Generating variant markers.\n\nThe advantage is that instead of having to\
    \ load images, you can just insert characters that work independently of the content,\
    \ no extra elements required. Here’s how you could use Unicode markers, with the\
    \ result shown in Figure 3-23:\n\n```css\ni { text-indent: -1.25em; list-style:\
    \ none; }\ni:before { content: \"\\2605\"; margin: 0.75em; }\ni.m:before { color:\
    \ red; }\ni.k:before { color: orange; }\n```\n\nNot as much precision here as\
    \ you get with images and pixels, so it’s possible that the first line won’t be\
    \ precisely lined up with the text in following lines. You can get really close,\
    \ though, and furthermore, it’s only an issue if your list items will have multiple\
    \ lines of text.\n\n## HAVE MORE CONTAINERS THAN YOU THINK\n\nCommon practice\
    \ is wrap the entirety of a page’s content in a “wrapper” div, like this:\n\n\
    ```html\n<div class=\"wrapper\">\n  ...\n</div>\n```\n\nThe rationale here is\
    \ usually that you want to center the content, or otherwise have a couple of containers\
    \ sitting outside the content. In this case, it’s the body and the div. So with\
    \ that setup, you’ll often see this kind of CSS:\n\n```css\nbody { background:\
    \ #ABACAB; text-align: center; }\n.wrapper { width: 800px; margin: 0 auto; text-align:\
    \ left; }\n```\n\nIt’s the classic “center the design even in old versions of\
    \ IE, which didn’t understand auto centering but thought text-align should be\
    \ used to center element blocks” technique.\n\nThere were already two elements\
    \ containing the page’s content, even without the extra wrapper: the body and\
    \ html elements. Yes, you can style html. Why not? To CSS, it’s just another element.\
    \ There’s nothing magic or even particularly special about it, save that it’s\
    \ the most element in the document tree and therefore the “root” element.\n\n\
    We can just take the preceding rules and alter them ever so slightly:\n\n```css\n\
    html { background: #ABACAB; text-align: center; }\nbody { width: 800px; margin:\
    \ 0 auto; text-align: left; }\n```\n\nThen we can remove the “wrapper” div entirely,\
    \ with no change in layout, as shown in Figure 3-24. If you realize that both\
    \ body and html are available for your styling, you can do a number of interesting\
    \ things. For example, suppose you have a design that calls for a two-tone stripe\
    \ across the top of the page, with a logo inside the stripe. You can probably\
    \ think of a way to do that with a div. Here’s an alternate approach that doesn’t\
    \ require one (see Figure 3-25):\n\n```css\nhtml { border-top: 5px solid navy;\
    \ }\nbody { border-top: 5px solid silver; margin: 0; padding: 0; }\n```\n\nYou\
    \ can of course do something very similar with repeating background images (see\
    \ Figure 3-26).\n\n```css\nbackground: url(stars-m.png) 14px 41px repeat-y, url(stars-k.png)\
    \ 54px -20px repeat-x;\n```\n\n3-26: Many stars.\n\n## DOCUMENT BACKGROUNDS\n\n\
    We all used to setting a background on the body and having it fill the whole window.\
    \ But guess what happens if you also set a background for the html element?\n\n\
    ```css\n{ background: #ABACAB; }\n{ background: #DED; }\n```\n\nAs evident in\
    \ Figure 3-27, the browser window is filled out by the html element’s background,\
    \ and the body’s background just fills in the content area and padding of that\
    \ specific element. This is true whether or not the body element is tall enough\
    \ for its bottom to reach the bottom of the browser window. If it doesn’t, then\
    \ the html background is visible underneath. This would also be the case if the\
    \ body element has a bottom margin, the html element has bottom padding, or both.\n"
  mdcn: "\n让我们来看看背景。\n\n你可以将图像放置在背景的任何位置，这比那种老旧的列表样式图片要灵活得多。你确实需要记得添加一些内边距（padding），当然，还要加上它——否则元素内容将显示在背景之上！\n\
    \n如果你想让图像与文本的第一行对齐，这需要一点技巧，而且绝对无法保证与（例如）第一行文本的基线（baseline）实现像素级的对齐。你可以做到非常接近，在很多情况下也会处于正确的位置，但这永远不是百分之百定的。在这种情况下，你必须接受潜在的缺陷，或者尝试不同的方法。\n\
    \n如果这种特殊的方法是你不受限于文本的第一行呢？那么你就可以可以让标记相对于整个列表项目进行垂直居中，即使它跨越了多行。结合图 3-19 所示的中间边框，这可以形成一种视觉效果。\n\
    \n3-19: 垂直居中的背景标记。\n\n如果你想为特定类型的列表项目置入不同的变体标记（参见图 3-20），这只需要为列表项目添加类并引入新图像即可简单。\n\
    \n```css\n.stars {list-style: none;}\n.stars li {\n  background: 0 0 0.1em no-repeat;\n\
    \  padding-left: 16px;\n}\n.stars li.m { background-image: url(star-m.gif); }\n\
    .stars li.k { background-image: url(star-k.gif); }\n```\n\n```html\n<ul class=\"\
    stars\">\n  <li class=\"g\">太阳</li>\n  <li class=\"m\">半马座 V645（比邻星）</li>\n  <li\
    \ class=\"g\">半人马阿尔法星 A</li>\n  <li class=\"k\">半人马阿尔法星 B</li>\n</ul>\n```\n\n\
    这种方法的缺点是，由于图像位于背景，大多数用户打印时不会显示它们。因此，你可能需要在打印样式表或类似的地方中声明普通的列表标记。\n\n## 符号标记\n\n\
    有一种更高级的方法来创建自定义的列表标记，尽管它兼容旧版本的浏览器。在这种方法中，你将悬挂缩进（out-denting）与生成的内容结合起来（参见图 3-21）。\n\
    \n```css\ni:before { content: url(star.gif); margin-right: 8px; }\ni { text-indent:\
    \ -20px; list-style: none; }\n```\n\n你不需要添加任何额外的元素，因为生成的内容实际上变成了每个列表项目内容开头的它自己的标记。这意味着图像被视为内联内容，因此你可以相对于文本的基线对其进行垂直对齐，你也可以针对特定的类获取特定的图标（参见图\
    \ 3-22）。\n\n```css\ni.m:before { content: url(star-m.gif); }\ni.k:before { content:\
    \ url(star-k.gif); }\n```\n\n3-21: 生成标记。\n3-22: 生成变体标记。\n\n这种方法的优点是，你不需要加载图像，只需要插入独立于内容的字符，不需要额外的元素。以下是你可以使用\
    \ Unicode 标记的方法，结果如图 3-23 所示：\n\n```css\ni { text-indent: -1.25em; list-style:\
    \ none; }\ni:before { content: \"\\2605\"; margin: 0.75em; }\ni.m:before { color:\
    \ red; }\ni.k:before { color: orange; }\n```\n\n这里的精度没有使用图像和像素那么高，因此第一行可能无法与后续行的文本精确对齐。不过，你可以做到非常接近，而且，只有当你的列表项目有多行文本时，这才是一个问题。\n\
    \n## 有比你想象的更多的容器\n\n通常的做法是将整个页的内容封装在一个“包装器”（wrapper）div 中，如下所示：\n\n```html\n<div\
    \ class=\"wrapper\">\n  ...\n</div>\n```\n\n这里的通常是因为你想让内容居中，或者其他让几个容器位于内容之外。在这种情况下，是\
    \ `body` 和 `div`。因此，在这种设置下，你经常看到这样的 CSS：\n\n```css\nbody { background: #ABACAB;\
    \ text-align: center; }\n.wrapper { width: 800px; margin: 0 auto; text-align:\
    \ left; }\n```\n\n这是经典的“即使在旧版本的 IE 中也让设计居中”技术（IE 不理解自动居中，但认为应该使用 `text-align`\
    \ 来居中元素块）。\n\n即使没有额外的包装器，已经有两个包含页面内容的元素了：`body` 和 `html` 元素。是的，你可以为 `html` 设置样式。为什么不呢？对于\
    \ CSS 来说，它只是另一个元素。没有任何神奇或特别的地方，除了它是文档树中根元素，因此是“根”元素。\n\n我们可以只需对前面的规则进行稍微修改：\n\n\
    ```css\nhtml { background: #ABACAB; text-align: center; }\nbody { width: 800px;\
    \ margin: 0 auto; text-align: left; }\n```\n\n然后我们可以完全移除“包装器”div，而不会改变布局，如图 3-24\
    \ 所示。如果你意识到 `body` 和 `html` 都可以用于样式，你可以进行许多有趣的操作。例如，假设你有一个设计要求在页面顶部有一条双色条纹，并在其中有一个标志。你可能能想到用\
    \ `div` 来实现这一点的方法。这里有一种不需要 `div` 的替代方案（参见图 3-25）：\n\n```css\nhtml { border-top:\
    \ 5px solid navy; }\nbody { border-top: 5px solid silver; margin: 0; padding:\
    \ 0; }\n```\n\n你当然可以使用重复背景图像实现非常相似的操作（参见图 3-26）。\n\n```css\nbackground: url(stars-m.png)\
    \ 14px 41px repeat-y, url(stars-k.png) 54px -20px repeat-x;\n```\n\n3-26: 许多星星。\n\
    \n## 文档背景\n\n我们以前都在 `body` 上设置背景并使其填充整个窗口。但猜猜如果你也为 `html` 元素设置背景会发生什么？\n\n```css\n\
    { background: #ABACAB; }\n{ background: #DED; }\n```\n\n如图 3-27 所示，浏览器窗口由 `html`\
    \ 元素的背景填充，而 `body` 的背景只填充该元素的内容区域和内边距。无论 `body` 元素的高度是否足以使其底部到达窗口底部，情况都是如此。如果它没有达到，那么\
    \ `html` 的背景在下方可见。如果 `body` 元素有底部外边距、`html` 元素有底部内边距，或者两者都有，情况也是如此。\n\n"
