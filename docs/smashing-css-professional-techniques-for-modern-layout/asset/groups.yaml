    \ 0 -90px;\"></div>\n  <div id=\"sl10\" style=\"width: 75px; height: 15px; background-position:\
    \ 0 -75px;\"></div>\n</div>\n```\n\n5-51: 在 Photoshop 中可视化的流框。\n\n***197***\n\n\
    ## 获取图像 (GET YOUR IMAGES)\n\n大多数人没有关于图片的这一点：它们具有与任何元素相同的盒模型。这意味着你可以对带有透明部分的图像应用背景和内边距等属性。\n\
    \n你会这样做吗？嗯，一个例子是为带有透明部分的背景图标填充颜色。它如下所示（见图 5-53）：\n\n```css\nimg {background-color:\
    \ #826;}\nimg:hover {background-color: #C40;}\n```\n\n使用各种 `div` 将波浪到位。你可以将图像放入图像的背景中，如图\
    \ 5-54 所示，这可以在悬停和非悬停状态下产生意料之外的组合效果。\n\n"
