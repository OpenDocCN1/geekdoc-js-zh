- md: "\nOnce you’ve determined the baseline, you divide all the pixel measures by\
    \ that number. The resulting numbers will be in ems. Thus, assuming a 13-pixel\
    \ baseline:\n\n```css\nmain {width: 77.692em;}\n#extra {float: left;}\n.entry\
    \ {width: 55em; padding: 1.538em 2.692em 1.538em 1.923em;}\n.meta {width: 14.615em;\
    \ padding: 1.538em 0.769em 1.538em 2.692em;}\n```\n\nwith the stuff inside the\
    \ #main section.\n\n```css\nh2 {width: 575px; padding-left: 140px;}\n.info {float:\
    \ left; width: 95px;}\n.text {float: right; width: 575px;}\n```\n\nin, we divide\
    \ it all by 13 (see Figure 4-38).\n\n```css\n.info {float: left; width: 7.308em;}\n\
    .text {float: right; width: 44.231em;}\n```\n\nFigure 4-38: Properly placing most\
    \ of the pieces with ems.\n\nNotably noted that I left out the h2 containing the\
    \ entry title. That’s because the size of the h2 is bigger than the default, so\
    \ we can’t just divide by 13. Let’s see what size it’s elsewhere in the CSS.\n\
    \n```css\nh2 {font-size: 1.6em;}\n```\n\nits font size is 13 times 1.6, or 25.6.\
    \ We therefore need to divide its two measures by (see Figure 4-39).\n\n```css\n\
    h2 {width: 27.644em; padding-left: 6.731em;}\n```\n\ncorrecting the heading’s\
    \ placement.\n\ncan get a little tricky, there’s no question. The beautiful part\
    \ here is that if you bump the entry’s baseline font size up or down, the whole\
    \ layout will scale to match. For example, suppose you changed the CSS to say:\n\
    \n```css\nhtml {font-size: 90%;}\n```\n\nthe whole layout to be larger along with\
    \ the text, which means line lengths are consistent, the layout hangs together,\
    \ and it’s all nicely scalable for anyone who has browser default settings or\
    \ likes to bump the text size up or down for readability.\n\nasident in Figure\
    \ 4-40, though, it does mean that the layout may get wider than the browser window.\
    \ That’s a potential downside of Em-Based Layout, and not one you can really get\
    \ around. In fact, the whole point of Em-Based Layout is that it preserves line\
    \ lengths and element placement regardless of how big or small the browser window\
    \ might get. If that’s not important to you, then Em-Based Layout isn’t for you\
    \ either.\n\nFigure 4-40: The horizontal scrollbar appears when the browser window\
    \ gets too narrow.\n\napproach can even be extended to images along with your\
    \ text. Suppose you have an image that’s 88 pixels wide. Divide that by the size\
    \ of the text around (we’ll stick with 16) and give it the resulting width, like\
    \ so:\n\n```html\n<img src=\"btn07.png\" alt=\"Friendly\" style=\"width: 5.5em;\"\
    >\n```\n\nin this place, the image will scale up or down in response to changes\
    \ in text size. Obviously this won’t be something you necessarily do to every\
    \ image, but it can come in handy for section headers or other integrated images.\n\
    \n## NEGATIVE MARGINS IN FLOW\n\nMargins are great for letting elements keep their\
    \ distance from each other, but did you know negative margins can close up the\
    \ distance, and even completely overwhelm it? For simple example, suppose you\
    \ have a page where you always want the element right below the bottom of the\
    \ h2. The most common case is to have a first-sibling heading with no “blank line”\
    \ between it and the preceding heading (see “Sibling Selection” in Chapter 2).\
    \ Another way, Figure 4-41, is to put a negative bottom margin on the h2.\n\n\
    ```css\nh2 {margin: 1px; font-size: 150%; margin-bottom: -0.67em;}\n```\n\nbringing\
    \ a heading and its following element close together. You might think the paragraph\
    \ lacks its top margin, but that’s not so. It’s still there. It’s just because\
    \ the bottom edge of the h2 is actually near the top of the h2 text. The paragraph\
    \ and its margin sit below that, not the bottom edge of the order. To use this\
    \ general technique to put bits of content “on the same line,” that’s because\
    \ they’re only visually aligned. Consider:\n\n```html\n<ul class=\"jump\">\n \
    \ <li class=\"prev\"><a href=\"ch03.html\">Salaries</a></li>\n  <li class=\"next\"\
    ><a href=\"ch05.html\">Punching the Clock</a></li>\n</ul>\n```\n\nIf we want these\
    \ to sit next to each other in a line, as shown in Figure 4-42, we float both,\
    \ but there is another way.\n\n```css\nli {list-style: none; line-height: 1; width:\
    \ 25em; margin: auto; padding: 0.25em 1em; border: 1px solid;}\nli.next {text-align:\
    \ right; margin-top: -1em;}\n```\n\nWait, the negative one-em top margin of li.next\
    \ pulls it upward by just the right amount (since we already defined line heights\
    \ in this element to be 1).\n\nAnother useful trick is to pull elements partway\
    \ out of their containers. Suppose you wanted a section’s heading to be in a box\
    \ that’s centered on a dividing line (as in Figure 4-43). Here’s the markup and\
    \ CSS:\n\n```css\nsection {border-top: 1px solid gray;}\nsection h2 {width: 80%;\
    \ background: #FFF; border: 1px solid gray; margin: -0.67em auto 0; text-align:\
    \ center;}\n```\n\n```html\n<div class=\"entry\">\n  <h2>The Web Stack</h2>\n\
    </div>\n```\n\nFigure 4-43: Centering a heading on a dividing line.\n\nOn the\
    \ other hand, maybe you want the box to be “shrink-wrapped” to the text, not a\
    \ defined width. In that case, you need a little more markup, just a little:\n\
    \n```html\n<div class=\"entry\">\n  <h2>The Web Stack</h2>\n</div>\n```\n\nIf\
    \ you just shift the CSS around (see also Figure 4-44):\n\n```css\nsection h2\
    \ {margin: -0.67em auto 0; text-align: center;}\n```\n\nIf the text doesn’t get\
    \ longer than one line, of course. If it does then the box will hang down from\
    \ the divider, not recenter itself; and the box will be between the lines. There\
    \ really isn’t a good solution for this using negative margins. Just drop the\
    \ border and keep the white background. That wouldn’t be perfect, but good enough.\n"
  mdcn: "\n一旦你确定了基准，就可以将所有像素值除以该数字。得到的数字将是 em 单位。因此，假设基准为 13 像素：\n\n```css\nmain {width:\
    \ 77.692em;}\n#extra {float: left;}\n.entry {width: 55em; padding: 1.538em 2.692em\
    \ 1.538em 1.923em;}\n.meta {width: 14.615em; padding: 1.538em 0.769em 1.538em\
    \ 2.692em;}\n```\n\n配合 `#main` 部分内部的内容。\n\n```css\nh2 {width: 575px; padding-left:\
    \ 140px;}\n.info {float: left; width: 95px;}\n.text {float: right; width: 575px;}\n\
    ```\n\n在这里，我们将它们全部除以 13（见图 4-38）。\n\n```css\n.info {float: left; width: 7.308em;}\n\
    .text {float: right; width: 44.231em;}\n```\n\n图 4-38：使用 em 正确放置大部分组件。\n\n值得注意的是，我省略了包含条目标题的\
    \ h2。这是因为 h2 的尺寸比默认大，所以我们不能简单地除以 13。让我们看看它在 CSS 中其他地方的尺寸。\n\n```css\nh2 {font-size:\
    \ 1.6em;}\n```\n\n它的字体大小是 13 乘以 1.6，即 25.6。因此，我们需要将它的两个测量除以这个数（见图 4-39）。\n\n```css\n\
    h2 {width: 27.644em; padding-left: 6.731em;}\n```\n\n修正了标题的位置。\n\n毫无疑问，这可能会变得有点棘手。这里美之处在于，如果你上下调整了条目的基准字体大小，整个布局都会随之缩放。例如，假设你将\
    \ CSS 改为：\n\n```css\nhtml {font-size: 90%;}\n```\n\n整个布局会随文字变大，这意味着行宽保持一致，布局保持一个整体，并且对于任何使用浏览器默认设置或喜欢为了可读性调大文本尺寸的人来说，它都是完美扩展的。\n\
    \n然而，如图 4-40 所示，这意味着布局可能会比浏览器窗口宽。这是基于 em 的布局的一个潜在缺点，而且是你无法真正规避的。事实上，基于 em 的布局的重点在于无论浏览器窗口有多大多小，它都能保持行宽和元素位置。如果这对你不重要，那么基于\
    \ em 的布局也不适合你。\n\n图 4-40：当浏览器窗口太窄时，会出现水平滚动条。\n\n这种方法甚至可以扩展到文字图片。假设你有一个宽度为 88 像素的图片。将其除以周围文字的大小（我们采用\
    \ 16），并赋予它所得宽度，如下：\n\n```html\n<img src=\"btn07.png\" alt=\"Friendly\" style=\"\
    width: 5.5em;\">\n```\n\n在此处，图片将根据文字大小的变化而等比例放大或缩小。显然，不会对每张图片都这样做，但它对于章节标题或其他集成图片可能非常有用。\n\
    \n## 流中的负外边距 (NEGATIVE MARGINS IN FLOW)\n\n外边距对于保持元素之间的距离非常好，但你知道负外边距可以缩小距离，甚至完全覆盖它吗？举个简单的例子，假设你在页面上总是希望元素紧贴\
    \ h2 底部下方。最常见的情况是第一个兄弟标题，它与前一个标题之间没有“空行”（见第 2 章中的“兄弟元素选择器”）。另一种方法（图 4-41）是在 h2\
    \ 上设置一个负的下边距。\n\n```css\nh2 {margin: 1px; font-size: 150%; margin-bottom: -0.67em;}\n\
    ```\n\n将一个标题与其随后的元素拉近。你可能认为段落缺少了顶部外边距，事实并非如此。它仍然在那里。只是因为 h2 的底部实际上靠近 h2 文本的顶部。段落及其外边距位于该位置下方，而不是该元素的底部。使用这种通用技术将部分内容放置在“同一行”，是因为它们在视觉上是对齐的。考虑一下：\n\
    \n```html\n<ul class=\"jump\">\n  <li class=\"prev\"><a href=\"ch03.html\">Salaries</a></li>\n\
    \  <li class=\"next\"><a href=\"ch05.html\">Punching the Clock</a></li>\n</ul\n\
    ```\n\n如果我们想让这些内容在同一行内并排（如图 4-42 所示），我们可以将它们都浮动，但还有另一种方法。\n\n```css\nli {list-style:\
    \ none; line-height: 1; width: 25em; margin: auto; padding: 0.25em 1em; border:\
    \ 1px solid;}\nli.next {text-align: right; margin-top: -1em;}\n```\n\n等等，`li.next`\
    \ 的负 1em 上外边距恰好将它向上拉了所需的距离（因为我们已经定义了该元素的行高为 1）。\n\n另一个实用的技巧是将元素部分移出容器。假设你希望一个章节的标题位于一个在分割线上居中的框中（如图\
    \ 4-43 所示）。这是标记和 CSS：\n\n```css\nsection {border-top: 1px solid gray;}\nsection\
    \ h2 {width: 80%; background: #FFF; border: 1px solid gray; margin: -0.67em auto\
    \ 0; text-align: center;}\n```\n\n```html\n<div class=\"entry\">\n  <h2>The Web\
    \ Stack</h2>\n</div\n```\n\n图 4-43：在分割线上居中对齐。\n\n另一方面，你可能希望框是根据文字内容“收缩包裹”的，而不是固定的宽度。在这种情况下，你需要稍微多标记，只需要一点：\n\
    \n```html\n<div class=\"entry\">\n  <h2>The Web Stack</h2>\n</div\n```\n\n如果你只是调整一下\
    \ CSS（也见图 4-44）：\n\n```css\nsection h2 {margin: -0.67em auto 0; text-align: center;}\n\
    ```\n\n当然，前提是文字不会超过一行。如果文字超过了一行，框将从分割线悬挂下来，而不是重新居中；而且框将位于行与行之间。使用负外边距解决这个问题真的没有好的解决方案。直接删掉边框并保留白色背景即可。这并不完美，但足够了。\n"
