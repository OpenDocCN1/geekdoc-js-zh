    \ waste precious ink on so an obvious topic. And yet, how often do you actually\
    \ validate? Once at the end of a project, or all the way through?\n\nI’m not telling\
    \ you to validate every time you hit “Save” on the document you’re building, but\
    \ it’s a good idea to get into the habit of validating at regular intervals as\
    \ you go. That way, you catch problems before they infect the whole page.\n\n\
