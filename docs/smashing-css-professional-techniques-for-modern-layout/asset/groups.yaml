- md: "\n***209***\n\nConsider the following markup:\n\n```html\n<table>\n  <thead>\n\
    \    <tr>\n      <th>Pageviews</th>\n      <th>Visitors</th>\n    </tr>\n  </thead>\n\
    \  <tbody>\n    <tr>\n      <th>January 2010</th>\n      <td>1,367,234</td>\n\
    \      <td>326,578</td>\n    </tr>\n    <tr>\n      <th>February 2010</th>\n \
    \     <td>1,491,262</td>\n      <td>349,091</td>\n    </tr>\n  </tbody>\n</table>\n\
    ```\n\nEach row in the `tbody` starts with a `th` element. Those are row headers.\
    \ As a human, you can infer that they relate to the data that follows them in\
    \ the row. Even a browser is able to draw that inference. Still, it’s better to\
    \ be explicit, like this:\n\n```html\n<table>\n  <thead>\n    <tr>\n      <th\
    \ scope=\"col\">Pageviews</th>\n      <th scope=\"col\">Visitors</th>\n    </tr>\n\
    \  </thead>\n  <tbody>\n    <tr>\n      <th scope=\"row\">January 2010</th>\n\
    \      <td>1,367,234</td>\n      <td>326,578</td>\n    </tr>\n    <tr>\n     \
    \ <th scope=\"row\">February 2010</th>\n      <td>1,491,262</td>\n      <td>349,091</td>\n\
    \    </tr>\n  </tbody>\n</table>\n```\n\nBy adding the appropriately valued `scope`\
    \ attribute to your `th` elements, you’ve told the browsers exactly how the `th`\
    \ elements relate to the cells around them (see Figure 6-4). For browsers, this\
    \ isn’t such a big deal, though you can use attribute selectors to style them\
    \ uniquely:\n\n```css\n[scope=\"col\"] {border-bottom: 1px solid gray;}\n[scope=\"\
    row\"] {border-right: 1px solid gray;}\n```\n\nThis gives you a handy hook on\
    \ which to hang your styles. In this particular case, the same result is achieved\
    \ just using `thead th` and `tbody th`, but there may sometimes be cases where\
    \ there are row headers in the `thead` or column headers in the `tbody`. So it’s\
    \ good to have these techniques handy.\n\nFor browsers, the scope value can theoretically\
    \ be used to make tables easier to navigate by associating column and row header\
    \ content with the content of each cell. If a speaking browser moved through the\
    \ table shown previously, it could say “January two thousand ten one million three\
    \ hundred sixty-seven thousand two hundred thirty-four visitors January two thousand\
    \ ten three hundred twenty-six thousand two hundred seventy-eight” for the first\
    \ row. (Where I put in a dash it would probably say “data cell” or something similar,\
    \ but you get the idea.)\n\nHowever, in this case, at least some speaking browsers\
    \ support the scope to make these sorts of determinations, but that capability\
    \ is generally not default.\n\n## COLUMN-ORIENTED STYLING\n\nCSS is used to style\
    \ table rows, but there are times you want to set up and style table columns.\
    \ This turns out to be hard to do simply and (relatively) easy to do with some\
    \ ugly CSS hacks (did you follow that?). The markup route is to use `col` elements.\
    \ Take this simple table as an example:\n\n```html\n<table>\n  <col span=\"2\"\
    \ />\n  <col span=\"3\" />\n  <tr>\n    <td>Row 1 cell 1</td>\n    <td>Row 1 cell\
    \ 2</td>\n    <td>Row 1 cell 3</td>\n    <td>Row 1 cell 4</td>\n    <td>Row 1\
    \ cell 5</td>\n  </tr>\n  <tr>\n    <td>Row 2 cell 1</td>\n    <td>Row 2 cell\
    \ 2</td>\n    <td>Row 2 cell 3</td>\n    <td>Row 2 cell 4</td>\n    <td>Row 2\
    \ cell 5</td>\n  </tr>\n</table>\n```\n\nThis sets up three columns, one of which\
    \ “spans” two cells per row and two of which encircle cell per row. That adds\
    \ up to four cells per row, and you can see that each row has five. (Wait, let\
    \ me re-count...).\n\nActually:\n\n```html\n<table>\n  <thead>\n    <tr>\n   \
    \   <th>Pageviews</th>\n      <th>Visitors</th>\n    </tr>\n  </thead>\n  <tbody>\n\
    \    <tr>\n      <th>January 2010</th>\n      <td>1,367,234</td>\n      <td>326,578</td>\n\
    \    </tr>\n    <tr>\n      <th>February 2010</th>\n      <td>1,491,262</td>\n\
    \      <td>349,091</td>\n    </tr>\n  </tbody>\n</table>\n```\n\nWait, let's look\
    \ at Figure 6-5:\n\n```html\n<table>\n  <tr>\n    <td class=\"c1\">Row 1 cell\
    \ 1</td>\n    <td class=\"c2\">Row 1 cell 2</td>\n    <td class=\"c3\">Row 1 cell\
    \ 3</td>\n    <td class=\"c4\">Row 1 cell 4</td>\n    <td class=\"c5\">Row 1 cell\
    \ 5</td>\n  </tr>\n  <tr>\n    <td class=\"c1\">Row 2 cell 1</td>\n    <td class=\"\
    c2\">Row 2 cell 2</td>\n    <td class=\"c3\">Row 2 cell 3</td>\n    <td class=\"\
    c4\">Row 2 cell 4</td>\n    <td class=\"c5\">Row 2 cell 5</td>\n  </tr>\n</table>\n\
    ```\n\nThis sets up three columns, one of which “spans” two cells per row and\
    \ two of which encircle cell per row. That adds up to four cells per row, and\
    \ you can see that each row has five. That means that the last cell in each row\
    \ is not part of a structural column.\n\nFine, but what about styling the columns\
    \ you do have (see Figure 6-5)? That would seem straightforward: Just apply CSS\
    \ to the `col` elements.\n\n```css\ncol {background: red; width: 10em;}\n```\n\
    \nThat very limited example works fine in just any browser available today. If\
    \ your styling with columns is simply background colors and setting the column\
    \ widths, then you’re basically out because the CSS specification allows only\
    \ two more properties on table columns: border and visibility, and neither is\
    \ well supported. The former case, if you declare a border, browsers will not\
    \ draw it the same way. Some browsers will draw your border around the whole column,\
    \ whereas others will cause it to be drawn around each of the cells.\n\nYou may\
    \ be sure that you’ve heard about applying other CSS properties to columns, since\
    \ Internet Explorer allows you to apply just about any property to `col` elements.\
    \ The reasons other browsers (and the CSS specification itself) forbid this are\
    \ tortuous, and frankly kind of annoying in the real world. If you want to do\
    \ column styling, you have to get more creative. The easiest way to accomplish\
    \ this is with classes on all the cells throughout the whole table.\n\n```html\n\
    <table>\n  <tr>\n    <td class=\"c1\">Row 1 cell 1</td>\n    <td class=\"c2\"\
    >Row 1 cell 2</td>\n    <td class=\"c3\">Row 1 cell 3</td>\n    <td class=\"c4\"\
    >Row 1 cell 4</td>\n    <td class=\"c5\">Row 1 cell 5</td>\n  </tr>\n  <tr>\n\
    \    <td class=\"c1\">Row 2 cell 1</td>\n    <td class=\"c2\">Row 2 cell 2</td>\n\
    \    <td class=\"c3\">Row 2 cell 3</td>\n    <td class=\"c4\">Row 2 cell 4</td>\n\
    \    <td class=\"c5\">Row 2 cell 5</td>\n  </tr>\n</table>\n```\n\nIf you want\
    \ to make a specific column red-backed, say, you simply write CSS for the cell\
    \ classes. This will recreate the effect seen in Figure 6-5:\n\n```css\n.c3, .c4\
    \ {background: red; width: 10em;}\n```\n\nIn both markup and style, yes. The advantage\
    \ here is that you can continue on to any property that can be applied to a table\
    \ cell (just about anything except margins). So to center-align and italicize\
    \ all those cells (as in Figure 6-6), it’s simple enough:\n\n```css\n.c3, .c4\
    \ {background: red; width: 10em; text-align: center; font-style: italic;}\n```\n\
    \nThe latter case, all you can do is set visibility: collapse in order to hide\
    \ whole columns.’s great, except it doesn’t work in all browsers, most notably\
    \ Safari and Chrome mobile cousins. It also requires that you declare `table {border-collapse:\
    \ collapse;}` which would be more worth knowing if the results were more consistent.\n"
  mdcn: "\n\n***209***\n\n考虑以下标记代码：\n\n```html\n<table>\n  <thead>\n    <tr>\n   \
    \   <th>Pageviews（页面浏览量）</th>\n      <th>Visitors（访问人数）</th>\n    </tr>\n  </thead>\n\
    \  <tbody>\n    <tr>\n      <th>2010年1月</th>\n      <td>1,367,234</td>\n     \
    \ <td>326,578</td>\n    </tr>\n    <tr>\n      <th>2010年2月</th>\n      <td>1,491,262</td>\n\
    \      <td>349,091</td>\n    </tr>\n  </tbody>\n</table>\n```\n\n`tbody` 中的每一行都以一个\
    \ `th` 元素开头。这些是行表头。作为人类，你可以推断出它们与该行中后续出现的数据相关。即使是浏览器也能做出这种推断。尽管如此，显式地写会更好，像这样：\n\
    \n```html\n<table>\n  <thead>\n    <tr>\n      <th scope=\"col\">Pageviews（页面浏览量）</th>\n\
    \      <th scope=\"col\">Visitors（访问人数）</th>\n    </tr>\n  </thead>\n  <tbody>\n\
    \    <tr>\n      <th scope=\"row\">2010年1月</th>\n      <td>1,367,234</td>\n  \
    \    <td>326,578</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">2010年2月</th>\n\
    \      <td>1,491,262</td>\n      <td>349,091</td>\n    </tr>\n  </tbody>\n</table>\n\
    ```\n\n通过为你的 `th` 元素添加适当值的 `scope` 属性，你已经准确地告诉了浏览器 `th` 元素是如何与其周围的单元格相关的（见图 6-4）。对于浏览器来说，这并不是什么大事，尽管你可以属性选择器来为它们设置唯一的样式：\n\
    \n```css\n[scope=\"col\"] {border-bottom: 1px solid gray;}\n[scope=\"row\"] {border-right:\
    \ 1px solid gray;}\n```\n\n这为你的样式设置提供了一个方便的挂载钩子。在这种情况下，仅使用 `thead th` 和 `tbody\
    \ th` 就能实现相同的结果，但有时会出现 `thead` 中存在行表头或 `tbody` 中存在列表头的情况。因此，随手掌握这些技术是好的。\n\n对于浏览器来说，`scope`\
    \ 值理论上可以用于将列和行表头的内容与每个单元格的内容关联，从而使表格更容易导航。如果一个语音读器遍历之前显示的表格，对于第一行，它可以说：“二零一十年一月一百三十六万七千二百两百三十四访问者，二零一十年一月三十十二万六千两百七十八访问者”（在我输入破折号的地方，它可能会说“数据单元格”类似的内容，但你明白我的意思。）\n\
    \n然而，在这种情况下，至少某些语音读器支持通过 `scope` 来进行此类判断，但这种能力通常不是默认的。\n\n## 列向样式设置\n\nCSS 用于设置表格行的样式，但有时你想要设置并样式表格列。事实证明，简单地做到这一点很难，而通过一些丑陋的\
    \ CSS 技巧可以（相对）容易地做到（你听懂那句话了吗？）。标记路径的方法是使用 `col` 元素。以这个简单的表格为例：\n\n```html\n<table>\n\
    \  <col span=\"2\" />\n  <col span=\"3\" />\n  <tr>\n    <td>行 1 单元格 1</td>\n\
    \    <td>行 1 单元格 2</td>\n    <td>行 1 单元格 3</td>\n    <td>行 1 单元格 4</td>\n    <td>行\
    \ 1 单元格 5</td>\n  </tr>\n  <tr>\n    <td>行 2 单元格 1</td>\n    <td>行 2 单元格 2</td>\n\
    \    <td>行 2 单元格 3</td>\n    <td>行 2 单元格 4</td>\n    <td>行 2 单元格 5</td>\n  </tr>\n\
    </table>\n```\n\n这设置了三列，其中一列每行“跨”两个单元格，另外两列每行包含一个单元格。这总共每行四个单元格，但你可以看到每行都有五个。（等一下，让我重新数数……）。\n\
    \n实际上：\n\n```html\n<table>\n  <thead>\n    <tr>\n      <th>Pageviews（页面浏览量）</th>\n\
