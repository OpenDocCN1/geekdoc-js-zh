- md: "\n“unstyled” (but actually greatly styled) document.\n\ndocument with basic\
    \ reset CSS applied.\n\n10/5/10 7:39 PM\n\n10/5/10 7:39 PM\n\n35\n\nof people\
    \ use this, mostly because it’s simple. The problem for others is that this applies\
    \ to all elements in the document, including form elements like text inputs and\
    \ select boxes. Since browsers currently handle CSS on form elements in very different\
    \ ways (and some won’t support it at all), the “all elements” approach means that\
    \ forms get very inconsistent as a result trying to make the browsers more consistent\
    \ with the reset.\n\nMore complicated resets were developed. One fairly popular\
    \ reset is available at memeyer.com/eric/tools/css/reset. It starts out like this:\n\
    \n```css\n*, body, div, span, applet, object, iframe,\nh2, h3, h4, h5, h6, p,\
    \ blockquote, pre,\nbbr, acronym, address, big, cite, code,\ndfn, em, font, img,\
    \ ins, kbd, q, s, samp,\nli, strike, strong, sub, sup, tt, var,\na, i, center,\n\
    dt, dd, ol, ul, li,\ndset, form, label, legend,\nem, caption, tbody, tfoot, thead,\
    \ tr, th, td {\n    margin: 0;\n    padding: 0;\n    border: 0;\n    outline:\
    \ 0;\n    font-size: 100%;\n    vertical-align: baseline;\n}\n\nbody {\n    line-height:\
    \ 1;\n}\n```\n\nThat’s a lot of elements. The reason to do it that way is to select\
    \ all of the elements that aren’t form inputs (input, select, textarea) and make\
    \ them act in similar ways. The rule explicitly sets margin, padding, border,\
    \ and outline to zero, and forces all elements to the same font size and text\
    \ vertical alignment. The second rule sets the body element to a reduced line\
    \ height, and that value is inherited by all of the elements that descend from\
    \ the body element.\n\nThere are more rules in the meyerweb reset, including some\
    \ that remove list bullets and CSS-generated quote marks around the blockquote\
    \ and q elements, among others. Again, the underlying point is to get all browsers\
    \ as much on the same page as possible before writing the CSS that will make the\
    \ page look pretty.\n\nThis point you might be thinking, “Wait a minute, that\
    \ means I have to undo all the stuff I did! I never want the page to have a line-height\
    \ of one—that’s too cramped! And I don’t want to mess with the vertical alignment\
    \ of superscripts and subscripts!” These are all valid concerns. What you do is\
    \ modify a stylesheet to meet your preferences. Say you always start with a line-height\
    \ of 1.4, to get that nice airy feel to your text, modify that line of the reset:\n\
    \n```css\nbody {\n    line-height: 1.4;\n}\n```\n\nThere, you might also feel\
    \ like adding your standard page background and text with your favorite body font:\n\
    \n```css\nbody {\n    font: Helvetica, sans-serif;\n    background: #ABAC;\n \
    \   color: #444;\n}\n```\n\nThe rule that strips off list bullets because you\
    \ know you’ll never want to change how far lists are indented, the separation\
    \ between paragraphs and how you prefer to style strong, and so on—well, what\
    \ you have is not a reset stylesheet, it’s a booster stylesheet. You’re boosting\
    \ into your preferred baseline for styling a document, establishing a customized\
    \ foundation on which you can build any project. With that booster in hand, you\
    \ can get a result on each new project, making it the kernel around which each\
    \ final stylesheet revolves.\n\nSeriously, IE9.js, can make IE5 through IE8 act\
    \ much more like (the still, as of this writing) IE9 when it comes to handling\
    \ CSS and HTML. You can find it at google.com/p/ie7-js—yes, the ie7 part is correct\
    \ (see Figure 1-35). The project started as IE7.js, and when IE8 and IE9 came\
    \ out, new versions of JavaScript routines check if the browser is a version of\
    \ Internet Explorer through the CSS and HTML of a page and figure out which parts\
    \ aren’t supported. It then does a bunch of fancy backarounds to make that support\
    \ happen transparently. For example, IE5 and IE6 did not support attribute selectors.\
    \ Thus, if you have a rule like `text-decoration: none; color: red;`, IE5 and\
    \ IE6 will ignore it completely, and your links will be left untouched. (While\
    \ this would make Jakob Nielsen happy, the project’s designer will be considerably\
    \ less impressed.) With IE9.js, though, the fancy script juggling will set things\
    \ up so that IE5 and IE6 can apply styles to links, and so it Just Works. All\
    \ you need is a link to IE9.js from any page that needs it, and you’re set.\n\n\
    Of course, none of this will have any effect if JavaScript is disabled, which\
    \ means you have to weigh the benefits of this script against what you expect\
    \ of your site’s audience. Do a lot of them use IE6? Are they likely to have disabled\
    \ JavaScript? And so on. Of course, those are the same things we have to weigh\
    \ with any site design, so at least it’s a familiar process. The usual usage recommendation\
    \ is to enclose the script element linking to the JavaScript in a conditional\
    \ comment, like so:\n\n```html\n<!--[if IE 9]>\n<script src=\"/code/IE9.js\" type=\"\
    text/javascript\"></script>\n<![endif]-->\n```\n\n1-35: The IE7.js page.\n\n##\
    \ SELECTORS\n\nIn some sense, selectors are the heart of CSS. Without them, we’d\
    \ have no way of assigning styles to elements. By granting us the power to target\
    \ families of elements, we can accomplish a great deal. In this chapter, we delve\
    \ into the details of using selectors smartly as well as a broad sweep of widely\
    \ supported and used selector types.\n"
  mdcn: "\n\n“无样式”（但实际上经过了大量样式处理）文档。\n\n应用了基础重置 CSS 的文档。\n\n10/5/10 7:39 PM\n\n10/5/10\
    \ 7:39 PM\n\n35\n\n……的人使用这种方法，主要是因为它简单。但对其他人来说，问题在于这种方法会应用于文档中的所有元素，包括文本输入和选择框等表单元素。由于浏览器目前处理表单元素\
    \ CSS 的方式各不相同（有些完全不支持），这种“全元素”的方法意味着，在尝试让浏览器与重置样式保持一致时，表单的结果变得非常不一致。\n\n人们开发了更复杂的重置方案。一个相当流行的重置可以在\
    \ memeyer.com/eric/tools/css/reset 找到。它的开头如下所示：\n\n```css\n*, body, div, span,\
    \ applet, object, iframe,\nh2, h3, h4, h5, h6, p, blockquote, pre,\nbbr, acronym,\
    \ address, big, cite, code,\ndfn, em, font, img, ins, kbd, q, s, samp,\nli, strike,\
    \ strong, sub, sup, tt, var,\na, i, center,\ndt, dd, ol, ul, li,\ndset, form,\
    \ label, legend,\nem, caption, tbody, tfoot, thead, tr, th, td {\n    margin:\
    \ 0;\n    padding: 0;\n    border: 0;\n    outline: 0;\n    font-size: 100%;\n\
    \    vertical-align: baseline;\n}\n\nbody {\n    line-height: 1;\n}\n```\n\n这包含了大量的元素。之所以这样做是为了选中所有不是表单输入（input,\
    \ select, textarea）的元素，并让它们以相似的方式运行。该规则显式地将 margin、padding、border 和 outline 设置为零，并强制所有元素使用相同的字体大小和文本垂直对齐。第二个规则将\
    \ `body` 元素设置为较小的行高，该值会被所有自自 `body` 元素的后代元素继承。\n\nmeyerweb 重置中还有更多规则，包括移除列表项目符号以及\
    \ `blockquote` 和 `q` 元素周围由 CSS 生成的引号等。再次，其核心点是在编写让页面变好看的 CSS 之前，尽可能让所有浏览器处于同一基线上。\n\
    \n关于这一点，你可能会想：“等一下，这意味着我必须撤销我所做的一切了！我绝不希望页面行高为 1——那太拥挤了！而且我不想弄乱上标和下标的垂直对齐！”这些都是合理的顾虑。你需要做的是修改样式表以满足你的偏好。假设你总是从\
    \ 1.4 的行高开始，以获得你的文本具有那种良好的透气感，只需修改重置样式中的那行：\n\n```css\nbody {\n    line-height:\
    \ 1.4;\n}\n```\n\n在这里，你可能还想添加标准的页面背景和使用你喜欢的 `body` 字体的文本：\n\n```css\nbody {\n\
    \    font: Helvetica, sans-serif;\n    background: #ABAC;\n    color: #444;\n\
    }\n```\n\n那个移除列表项目符号的规则——因为你知道你永远不想改变列表的缩进距离、段落之间的间距以及你对 `strong` 的样式化偏等等等等，你拥有的不再是一个重置样式表，而是一个**增强样式表**（booster\
    \ stylesheet）。你正在进入你偏好的基线来对文档样式化，建立一个自定义的基础，你可以在此基础上构建任何项目。有了这个增强器，你可以在每个新项目中获得一个结果，使其成为每个最终样式表围绕的核心。\n\
    \n说认真的，IE9.js 可以让 IE5 到 IE8 在处理 CSS 和 HTML 方面表现得更像（截至本文写作时仍是如此）IE9。你可以在 google.com/p/ie7-js\
    \ 找到它——是的，ie7 部分是正确的（参见图 1-35）。该项目最初是 IE7.js，当 IE8 和 IE9 出世时，新版本的 JavaScript 程序会通过页面的\
    \ CSS 和 HTML 检查浏览器是否为 Internet Explorer 的版本，并确定哪些部分不受支持。然后它会执行一系列复杂的变通方案让这种支持透明地发生。例如，IE5\
    \ 和 IE6 不支持属性选择器。因此，如果你有一个像 `text-decoration: none; color: red;` 的规则，IE5 和 IE6\
    \ 将完全忽略它，你的链接将保持原样。（虽然这会让 Jakob Nielsen 感到高兴，但该项目的设计者的印象会小得多。）不过，有了 IE9.js，这种复杂的脚本调度会设置好，让\
    \ IE5 和 IE6 能够对链接应用样式，从而*直接生效*（Just Works）。你只需要在任何需要的页面中链接到 IE9.js，就大功告成了。\n\n\
    当然，如果禁用了 JavaScript，这一切将不会产生任何影响，这意味着你必须权衡此脚本的益处与你对网站受众的预期。他们很多人使用 IE6 吗？他们可能禁用了\
    \ JavaScript 吗？等等。当然，这些都是我们在设计任何网站时必须权衡的问题，所以至少这是一个熟悉的流程。通常的使用建议是用条件注释包裹链接 IE9.js\
    \ 的脚本元素，如下所示：\n\n```html\n<!--[if IE 9]>\n<script src=\"/code/IE9.js\" type=\"\
    text/javascript\"></script>\n<![endif]-->\n```\n\n1-35: IE7.js 页面。\n\n## 选择器\n\
    \n在某种意义上，选择器是 CSS 的核心。没有它们，我们无法无法为元素分配样式。通过赋予我们定位一组元素的能力，我们可以完成很多工作。在本章中，我们将深入探讨明智使用选择器的细节，并广泛介绍广泛支持和使用的选择器类型。\n\
    \n"
