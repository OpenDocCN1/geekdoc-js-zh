    ## PRINT STYLES


    If you aren’t creating styles for print, now might be a good time to consider
    it. Even if you want your site to look basically the same on page as on-screen,
    you can still take the opportunity to optimize the color contrast for what will
    likely be grayscale output with no background colors or images whatsoever. It
    is easy to do. You can associate them with the page in three ways:


    - `<style type="text/css" media="print">...</style>`

    - `<link type="text/css" rel="stylesheet" media="print" href="print.css">`

    - `@import url(print.css) print;`


    Most everyone uses the link approach. This is because embedding a print style
    sheet in every page is pretty, and importing a print style sheet in every page.
    Also, there were browser bugs around print-specific imported style sheets for
    a very long time. The print style sheet itself is where you can do things like
    unset image-replacement effects (see preceding section). It’s also a very good
    idea to make sure all your text is dark in shade, because white text on a dark
    background will almost inevitably become white text on a white piece of paper,
    and that’s just really hard to read. This happens because background images and
    colors are almost never printed. The option to print exists in every modern browser,
    but the default setting is not to print backgrounds, which, when you think about
    it, is a really good default. (Imagine the effect on your printer’s cartridge
    if you printed out ten pages of white text on a navy blue background.) Almost
    nobody ever changes the setting, so you have to assume that no backgrounds will
    show up in print. Therefore, it’s a good idea to just remove them in your print
    styles. You can do that in a broad, sweeping way:


    ```css

    background: transparent; color: black;

    ```


    Or you could list out all the elements that need to be adjusted, something like
    this:


    ```css

    #navbar, #aside, .warning, .blockquote {

    background: transparent; color: black;

    }

    ```


