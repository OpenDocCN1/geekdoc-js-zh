    About the Author


    Eric Meyer is an internationally recognized expert on the subjects of HTML, CSS,
    and has been working on the web since late 1993. He is the founder of CSS Consulting,
    which counts among its clients On-Line, Apple, Adobe, Progressive Insurance, Sherwin-Williams,
    and more; co-founder of the microflow; co-founder (with Jeff Zeldman) of Event
    Apart, the conference people who make web sites. He is the author of five top-selling
    books on CSS and HTML.


    Acknowledgements


    Thanks to Chris Webb for bringing me aboard and then patiently shepherding me
    through all the setbacks, and stumbles. There were times when it looked like the
    project might halt, and every time Chris was there to prod it forward with good
    humor and infinite patience. Thanks to Debbye Butler and Brian Herrmann for me
    through the editorial process and spotting the places I went off into the weeds,
    fumbled my explanations, and for everyone who keeps reading what I write, whether
    on paper or on the web: thank you, a hundred thousand more than I could begin
    to enumerate, let alone express.


    A. Meyer

    Cleveland Heights, Ohio

    August 2010


