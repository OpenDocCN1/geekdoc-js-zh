    一个很好的示例是将超链接 URL 插入到页面的打印副本中（见 3-2）。要实现这一点，请在你的打印媒体样式表中添加以下规则：


    ```css

    a[href]:after {content: " [" attr(href) "]"; font-size: smaller;}

    ```


    2-25: 在打印样式中插入 URL。


    这被视为一种渐进增强，因为在不支持该功能的浏览器中，打印页面只会显示链接而没有生成的 URL，就像它们一直一常做的那样。而在能够支持的情况下，打印页面得到了显著的增强。（关于此技术的更多信息，请参阅
    http://alistapart.com/articles/goingtoprint 中的“Going To Print”。）


    对生成内容的支持相当广泛，但直到 IE8 发布才触及 Internet Explorer。你可以随时使用 IE9.js（见第 1 章）为旧版本的 Explorer
    植入支持。


    ## 核心内容

    第 3 章：技巧

    第 4 章：布局

    第 5 章：效果


    ## 章节技巧

    ### 献智者的几句老话


    **可以**使用一些好的技巧在极短时间内搞定一切。


    我最喜欢的两个技巧是“总是住在风景好的街道上，而不是繁忙的街道上”以及“不要吃铅”。而且


    在本章中，我们讨论了值的顺序的重要性、无单位值的正确用法、让元素消失的方法、控制边框外观的方法、列表技巧、打印样式开发以及更多内容。


    这些！


    对你来说可能已经**老掉牙**了。你可能会奇怪，为什么我要在如此显而易见的话题上浪费墨水。然而，你实际上多久验证一次呢？是在项目结束时，还是贯穿始终？


    我并不是让你每次在正在构建的文档上点击“保存”时都进行验证，但养成在开发过程中定期进行验证的习惯是一个好主意。这样，你就能在问题感染整个页面之前捕获它们。


    目前针对 HTML 和 CSS 都有一些非常好的验证器。在 HTML 领域，最广泛使用的验证器是由 W3C 提供的，位于 validator.w3.org（见图
    3-1）。它以 CSS 为核心的兄弟版本位于 jigsaw.w3.org/validator/，同样受欢迎。


    W3C 的 HTML 验证器。


    如果你被困在防火墙后开发，或者在笔记本电脑上进行所有开发而没有运行 Web 服务器？那么使用 Firebug 以及其他工具中的“验证本地（Validate
    local）”功能。只要你能浏览网页，就可以验证你正在查看任何页面，无论该页面是否可以被公开浏览。（即使页面在公共网站上，我几乎一直都使用“验证本地”，只是为了养成本地验证的习惯。）


    ## 字体值的排序


    这是 CSS 的小怪癖之一，许多人都会在这里绊壳，有时会纳闷是什么难倒了他们。大多数接受多个关键字的属性允许你以基本上任何顺序列出它们，并不要求你包含其中的每一个。（例如，`background`
    允许你指定从一到五个关键字，并且不在乎你如何排列它们。）


    少数例外之一是 `font`，它不仅有一组最少的必需关键字，而且要求特定的顺序。你可以拥有的最基础的字体声明是：


    ```css

    font: 100% 16px sans-serif;

    ```


    当然，你会用实际值替换这些括号内的术语，例如：


    ```css

    font: bold 100% sans-serif;

    ```


    关键点在于，你必须包含这两个值，并且它们必须按照该顺序——大小，后是字体。如果你反转了它们，或者漏掉其中一个，任何现代浏览器都会直接忽略整个声明。此外，如果你在声明中包含其他关键字，它们所有（除了一个，它是下一节的主题）都必须排在必需值之前。


    ```css

    font: bold italic 100% sans-serif;

    : italic small-caps 125% Georgia, serif;

    : bold small-caps 200% Arial, sans-serif;

    ```


    大小之前的那些值可以随意乱排，这并不重要。重点是它们必须都在大小之前。如果把它们放在后面，浏览器将再次忽略该声明。


    我以为上一节的字体值模式有点奇怪，但从这里开始我们就变得非常诡异了。我说过为了获得最少的字体值，“你必须包含这两个值，它们必须按照该顺序——大小，后是字体。”这是真的，但恰好你可以放置一个可选的行高（`line-height`）值作为大小的一种附属值（见图
    3-4）。它看起来像这样：


    ```css

    font: 100%/2.5 Helvetica, sans-serif;

    ```


    ## 值


    `line-height` 可以接受无单位数字值。你也可以给 `line-height` 继承值，尽管通常你不应该这样做。区别在于？当你定义一个带单位的值时（如
    `1em` 或 `100%`），你是在设置将计算结果传递给任何后代元素。例如，假设 CSS 应用于包含以下标记的文档：


    ```html

    li {font-size: 15px; line-height: 1em;}

    li {font-size: 80%;}<li><small>small text</small></li>

    ```


    `li` 元素的 `line-height` 被计算为 15px，因为对于 `line-height`，基于单位的值是使用元素本身的计算 `font-size`
    作为百分比值来计算的。由于我直接声明了 `font-size`，我们知道它以像素为单位的计算值。


    这里可能是令人惊讶的部分：15px 的计算值是传递给后代元素的。换句话说，`li` 和 `small` 元素将继承 15px 的 `line-height`
    值。就此结束。它们不会根据自己的 `font-size` 改变它；它们完全不改变。它们只是获取那 15px 并使用它，就像我写了下面一样：


    ```css

    li {font-size: 15px; line-height: 1em;}

    li {font-size: 10px; line-height: 15px;}

    li {font-size: 80%; line-height: 15px;}

    ```


    现在，假设我去掉了该 `line-height` 值中的 `em`，使得样式变为：


    ```css

    li {font-size: 15px; line-height: 1;}

    li {font-size: 10px;}

    li {font-size: 80%;}

    ```


    ```html

    <li>I’m a list item with <small>small text</small></li>

    ```


    现在传递给后代元素（`li` 和 `small` 元素）的是那个原始数字，这些后代元素使用该数字作为缩放因子——如果说是乘数——以及计算结果。


    所有继承该 `1` 值的元素都会获取该值并与其计算出的 `font-size` 相乘。声明为 `font-size: 10px` 的列表项，其计算出的 `line-height`
    将为 10px。然后它将该 `1` 传递给 `small` 元素，该元素将其与其计算出的 `font-size` 相乘。那是 8 像素；因此，它的计算 `line-height`
    也是 8 像素。


    这是一个相当差异（见图 3-3）。这就是为什么如果你要设置 `line-height`，我们总是强烈建议使用无单位数字，无论设置在像 `li` 或 `body`
    这样的元素上，还是在任何将拥有后代元素的元素上。

