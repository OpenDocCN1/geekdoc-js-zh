- md: "\n5-9: Pop-up text below links.\n\ntechnique can be ramped all the way up to\
    \ multiple levels of nested menus—which you will see in the next section.\n\n\
    ## MENUS\n\nYou can use the principles of CSS pop-ups to make multiple nested\
    \ pop-up menus, if you like.\n\nNot that I do. I generally can’t stand pop-up\
    \ menus. But then I also can’t stand chocolate, coffee, carbonation, or almost\
    \ any form of alcohol, so what do I know?) One of the great things of this particular\
    \ technique is that it shows how hover effects aren’t restricted to links.\n\n\
    Here’s the basic setup (with very simplified URLs for clarity’s sake; see also\
    \ Figure 5-10):\n\n```html\n<ul class=\"menu\">\n  <li class=\"sub\">\n    <a\
    \ href=\"/s1/\">Section 1</a>\n    <ul>\n      <li><a href=\"/s1/ss1/\">Subsection\
    \ 1</a></li>\n      <li><a href=\"/s1/ss2/\">Subsection 2</a></li>\n      <li><a\
    \ href=\"/s1/ss3/\">Subsection 3</a></li>\n    </ul>\n  </li>\n  <li class=\"\
    sub\">\n    <a href=\"/s2/\">Section 2</a>\n    <ul>\n      <li><a href=\"/s2/ss1/\"\
    >Subsection 1</a></li>\n      <li><a href=\"/s2/ss2/\">Subsection 2</a></li>\n\
    \    </ul>\n  </li>\n</ul>\n```\n\nNow hide the submenus.\n\n```css\n.sub ul {\n\
    \  display: none;\n}\n```\n\nOf course, you need to bring the submenus back. The\
    \ simplest (and least visually impressive) way to do that is to say:\n\n```css\n\
    :hover > ul { display: block; }\n```\n\nBut that causes the submenus to pop back\
    \ into place, pushing everything that comes after them inward. Add in some positioning,\
    \ though, and you get them popping up right next to them (as in Figure 5-11) and\
    \ not altering the rest of the document’s layout.\n\n```css\n:hover > ul {\n \
    \ display: block;\n  position: absolute;\n  top: 0;\n  left: 100%;\n  background:\
    \ white;\n}\n```\n\nThe technique can go to any level of nested menu, in fact.\
    \ You can have seventeen-level-deep nested menus if you so desire. You should\
    \ quite probably be ashamed of that desire, but you can do it regardless.\n\n\
    In terms of placement of menus, you’re limited only by the two-dimensional plane\
    \ of the page and your own imagination. You can put the top-level menu entries\
    \ across the top of the page, the first-level submenus below them, as in Figure\
    \ 5-12, with second-and-later menus popping out to the side. It’s just a matter\
    \ of writing the necessary CSS. It would go something like this:\n\n```css\nmenu\
    \ > li { display: inline; position: relative; }\nmenu ul { display: none; }\n\
    menu li.sub:hover > ul { display: block; position: absolute; white-space: wrap;\
    \ }\nmenu li.sub:hover > ul { top: 100%; left: 0; }\nmenu ul li.sub:hover > ul\
    \ { top: 0; left: 100%; }\n```\n\nThis way, only the top-level menus drop down.\
    \ The rest would go to the right of their parents.\n\n## DROPDOWN MENUS: PUNCHING\n\
    \nSometimes, you want things to be a little irregular. The punching technique\
    \ is a way of visually removing parts of a box. It works only on solid color backgrounds,\
    \ but that leaves a lot of room.\n\nThe simplest form of box punching is to put\
    \ one box in the corner of another (see Figure 5-14). Make sure its background\
    \ matches the surrounding content instead of its parent’s.\n\n```html\n<div class=\"\
    main\">\n  <h1>Wow, a punched greeting.</h1>\n```\n\nTo make things a little more\
    \ complex, you can set a background for the punch and a thick border to separate\
    \ it from the rest of the box, as in Figure 5-14.\n\n```css\n.punch {\n  background:\
    \ #C0FFEE;\n  font-size: 500%;\n  margin: 0 0.1em 0 0.1em;\n  padding: 0.1em;\n\
    \  border: 2em solid #C0FFEE;\n  border-width: 0 0.2em 0.2em 0;\n}\n```\n\nOne\
    \ problem is that as long as your main box doesn’t have any borders, the minute\
    \ you add one, it goes around the punching element, which no longer looks so right.\n\
    \n```css\n.main {\n  background: #C0FFEE;\n  font-size: 500%;\n  margin: 0 0.1em\
    \ 0 0.1;\n  padding: 0.1em;\n  border: 3px solid black;\n}\n```\n\nIt’s okay,\
    \ you can work around this. All it takes is a couple of borders on the punch,\
    \ and a negative margin (see also Figure 5-16):\n\n```css\n.punch {\n  background:\
    \ #C0FFEE;\n  font-size: 500%;\n  float: left;\n  margin: -3px 0.1em 0.1em -3px;\n\
    \  padding: 0.1em;\n  border: 3px solid black;\n  border-width: 0 3px 3px 0;\n\
    }\n```\n\nThis is bringing the boxpunch out of and integrating it with the border.\n\
    \n```html\n<div class=\"main\">\n  <h1>Wow, a punched greeting.</h1>\n  <b class=\"\
    rounded c tl\"></a>\n  <b class=\"rounded c tr\"></a>\n  <b class=\"rounded c\
    \ bl\"></a>\n  <b class=\"rounded c br\"></a>\n</div>\n```\n\nThe simplest form\
    \ of punching is to put one box in the corner of another (see Figure 5-14). Make\
    \ sure its background matches the surrounding content instead of its parent’s.\
    \ This creates the illusion of a rounded box.\n\nThis works as long as your main\
    \ box doesn’t have any borders. The minute you add one, it goes around the punching\
    \ element, which no longer looks so right.\n\nThe punching technique is a way\
    \ of visually removing parts of a box. It works only on solid color backgrounds,\
    \ but that leaves a lot of room.\n\nThe simplest form of punching is to put one\
    \ box in the corner of another (see Figure 5-14). Make sure its background matches\
    \ the surrounding content instead of its parent’s. This creates the illusion of\
    \ a rounded box.\n"
  mdcn: "\n\n5-9: 链接下方的弹出文本。\n\n这种技术可以一直扩展到多层嵌套菜单——你将在下一节中看到。\n\n## 菜单 (MENUS)\n\n\
    如果你喜欢，可以使用 CSS 弹出原理来制作多个嵌套的弹出菜单。\n\n并不是说我喜欢。我通常受不了弹出菜单。不过，我也受不了巧克力、咖啡、碳酸饮料或几乎任何形式的酒精，所以我又能懂什么呢？）这种特定技术的奇妙之处之一在于，它展示了悬停效果不仅限于链接。\n\
    \n这里是基础设置（为了清晰起见，使用了非常简单的 URL；另见图 5-10）：\n\n```html\n<ul class=\"menu\">\n  <li\
    \ class=\"sub\">\n    <a href=\"/s1/\">Section 1</a>\n    <ul>\n      <li><a href=\"\
    /s1/ss1/\">Subsection 1</a></li>\n      <li><a href=\"/s1/ss2/\">Subsection 2</a></li>\n\
    \      <li><a href=\"/s1/ss3/\">Subsection 3</a></li>\n    </ul>\n  </li>\n  <li\
    \ class=\"sub\">\n    <a href=\"/s2/\">Section 2</a>\n    <ul>\n      <li><a href=\"\
    /s2/ss1/\">Subsection 1</a></li>\n      <li><a href=\"/s2/ss2/\">Subsection 2</a></li>\n\
    \    </ul>\n  </li>\n</ul>\n```\n\n现在，隐藏子菜单。\n\n```css\n.sub ul {\n  display:\
    \ none;\n}\n```\n\n当然，你需要把子菜单显示回来。最简单（且视觉效果最不惊艳）的方法是写：\n\n```css\n:hover > ul\
    \ { display: block; }\n```\n\n但这会导致子菜单弹回原位，将随其后的所有内容向内推。不过，只要添加一些定位，你就可以让它们直接在旁边弹出（如图\
    \ 5-11 所示），而不会改变文档其他部分的布局。\n\n```css\n:hover > ul {\n  display: block;\n  position:\
    \ absolute;\n  top: 0;\n  left: 100%;\n  background: white;\n}\n```\n\n事实上，这种技术可以达到任何层级的嵌套菜单。如果你愿意，甚至可以拥有深达十七层的层的嵌套菜单。你可能应该对这种欲望感到羞愧，但无论如何你都可以做到。\n\
    \n在菜单的放置方面，你的限制仅是页面的二维平面和你自己的想象力。你可以将顶层菜单项放在页面顶部，将第一级子菜单放在它们下方（如图 5-12 所示），第二级及之后的菜单向侧边弹出。这只是编写必要的\
    \ CSS 的问题。代码如下：\n\n```css\nmenu > li { display: inline; position: relative; }\n\
    menu ul { display: none; }\nmenu li.sub:hover > ul { display: block; position:\
    \ absolute; white-space: wrap; }\nmenu li.sub:hover > ul { top: 100%; left: 0;\
    \ }\nmenu ul li.sub:hover > ul { top: 0; left: 100%; }\n```\n\n通过这种方式，只有顶层菜单会下拉。其他部分将出现在父元素的右侧。\n\
    \n## 下拉菜单：挖孔 (DROPDOWN MENUS: PUNCHING)\n\n有时，你希望事情看起来有点不规则。挖孔技术（punching technique）是在视觉上移除框框部分的方法。它只对纯色背景有效，但它留下了很大的操作空间。\n\
    \n最简单的挖孔形式是将一个框放在另一个框的角上（见图 5-14）。确保它的背景与周围内容匹配，而不是与其父元素匹配。\n\n```html\n<div class=\"\
    main\">\n  <h1>Wow, a punched greeting.</h1>\n```\n\n为了让情况变得复杂一点，你可以为挖孔处设置背景色，并设置一个粗边框以将其与框的其他部分隔离开，如图\
    \ 5-14 所示。\n\n```css\n.punch {\n  background: #C0FFEE;\n  font-size: 500%;\n \
    \ margin: 0 0.1em 0 0.1em;\n  padding: 0.1em;\n  border: 2em solid #C0FFEE;\n\
    \  border-width: 0 0.2em 0.2em 0;\n}\n```\n\n一个问题是，只要你的主框没有边框，一旦你添加了边框，它就会绕过挖孔元素运行，这看起来就不那么对了。\n\
    \n```css\n.main {\n  background: #C0FFEE;\n  font-size: 500%;\n  margin: 0 0.1em\
    \ 0 0.1;\n  padding: 0.1em;\n  border: 3px solid black;\n}\n```\n\n没关系，你可以解决这个问题。这只需要在挖孔处添加几个边框，并使用负边距（另见图\
    \ 5-16）：\n\n```css\n.punch {\n  background: #C0FFEE;\n  font-size: 500%;\n  float:\
    \ left;\n  margin: -3px 0.1em 0.1em -3px;\n  padding: 0.1em;\n  border: 3px solid\
    \ black;\n  border-width: 0 3px 3px 0;\n}\n```\n\n这是将挖框的框提取出来并与边框整合。\n\n```html\n\
    <div class=\"main\">\n  <h1>Wow, a punched greeting.</h1>\n  <b class=\"rounded\
    \ c tl\"></a>\n  <b class=\"rounded c tr\"></a>\n  <b class=\"rounded c bl\"></a>\n\
    \  <b class=\"rounded c br\"></a>\n</div>\n```\n\n最简单的挖孔形式是将一个框放在另一个框的角上（见图 5-14）。确保它的背景与周围内容匹配，而不是与其父元素匹配。这创造了一个圆角框的错。\n\
    \n只要你的主框没有边框，这种方法就有效。一旦你添加了边框，它就会绕过挖孔元素运行，这看起来就不那么对了。\n\n挖孔技术是在视觉上移除框框部分的方法。它只对纯色背景有效，但它留下了很大的操作空间。\n\
    \n"
