    terms\" id=\"terms\">\n    <input type=\"submit\" value=\"Search\">\n  </form>\n\
    </legend>\n```\n\ncould position three things: the logo, the navigation links,\
    \ and the search box. But you probably wouldn’t want to position them all. Consider\
    \ for a moment what would happen if you did: The header div wouldn’t have any\
    \ normal-flow content, and thus wouldn’t have any height. It would be zero pixels\
    \ tall. Or maybe one line of text tall, depending on what exactly you positioned\
    \ and how browsers treated the leftover whitespace. At any-rate, it wouldn’t be\
    \ tall enough.\n\nAssume the logo is what you leave unpositioned. That leaves\
    \ you free to put the navlinks and search box wherever you like. First, establish\
    \ a containing block (the technical term for a position-context) for this to happen.\n\
    \n```css\nheader {\n  position: relative;\n}\n```\n\nThat establishes a positioning\
    \ context for any descendant elements. So if you want to put the links into the\
    \ upper-right corner, you start with this:\n\n```css\n.navlinks {\n  position:\
    \ absolute;\n  top: 0;\n  right: 0;\n}\n```\n\nPerhaps you want to put the search\
    \ form in the lower-right corner. The result is shown in Figure 4-45.\n\n```css\n\
    header form {\n  position: absolute;\n  bottom: 0;\n  right: 0;\n}\n```\n\nOf\
    \ course, there’s some other CSS at work here (otherwise the navlinks would be\
    \ a bulleted list), but you get the idea. Thanks to positioning, you can put these\
    \ things wherever you like in the header. Want to put the search up top and the\
    \ links below? Swap top for bottom in the navlinks’ rule, and vice versa in the\
    \ form’s rule, with the result shown in Figure 4-46.\n\n```css\n.navlinks {\n\
    \  position: absolute;\n  bottom: 0;\n  right: 0;\n}\nheader form {\n  position:\
    \ absolute;\n  top: 0;\n  right: 0;\n}\n```\n\n4-45: Positioning elements within\
    \ another element.\n\nWhile positioning gives you control over the placement of\
    \ the positioned elements, you do have to be concerned about overlap. As an example,\
    \ suppose the navigation links grow to two or three lines of text. They might\
    \ start overlapping the search box. This is why most layouts you see online use\
    \ floats instead of positioning; floats don’t naturally overlap. Still, used carefully,\
    \ positioning can make it a lot easier to rearrange content within an area like\
    \ a footer.\n\n## OUT OF THE CONTAINING BLOCK\n\nOne amazing feature of absolute\
    \ positioning is that you can position elements outside the element that serves\
    \ as the containing block (positioning context). This can come in a lot more ways\
    \ than you might think. For, you can take navigation links that are structurally\
    \ within a header div and place them just below that div. Consider the following\
    \ markup structure (see the next section for the full details):\n\n```html\n<header\
    \ class=\"header\">\n  <a href=\"/\"><img src=\"logo.png\" alt=\"HugeCo Inc.\"\
    ></a>\n  <nav class=\"nav\"><ul>...</ul></nav>\n  <form id=\"search-form\" action=\"\
    /search\">...</form>\n</header>\n```\n\nNow, apply (on top of some other color,\
    \ font, and related styles which are omitted here) the following styles to place\
    \ the navigation and search form (see Figure 4-47):\n\n```css\n.header {\n  position:\
    \ relative;\n  margin-bottom: 1.5em;\n}\n.navlinks {\n  position: absolute;\n\
    \  top: 100%;\n  right: 0;\n}\nheader form {\n  position: absolute;\n  top: 0;\n\
    \  right: 0;\n}\n```\n\nThe links are now sitting just below the bottom edge of\
    \ the header div. In order for the links to have enough space to avoid overlap\
    \ with content after the header, a margin is applied to the header. This makes\
    \ it a lot less likely that the search box (still inside the header) and the navigation\
    \ links will overlap.\n\nYou might think the links are a little too close to the\
    \ header. That’s easy to fix: Increase the top value. But maybe you want to place\
    \ the links exactly seven pixels below the bottom of the header. In that case,\
    \ you could define the exact height of the header, then do the math to figure\
    \ out what percentage value would add seven pixels to the offset. Or you could\
    \ just define a margin-top of seven pixels for the navigation (see Figure 4-48).\n\
    \n```css\n.navlinks {\n  position: absolute;\n  top: 100%;\n  right: 0;\n  margin-top:\
    \ 7px;\n}\n```\n\n4-47: Placing the links outside the header.\n4-48: Pushing the\
    \ links down a bit with a top margin.\n\nThanks to the fact that top and margin-top\
    \ have separate effects, you can do this in a way that simulates simple equations.\
    \ That is, the top edge of the navigation area is 100% + 7px below the top edge\
    \ of the header (where “100%” means “the height of the header” in this case).\
    \ Another interesting example of placing information outside its containing block\
    \ is to take the date-and-time information for a blog post and put it to the side.\
    \ Consider this markup:\n\n```html\n<article class=\"entry\">\n  <h2>Positioning\
    \ in Context</h2>\n  <ul class=\"datetime\">\n    <li>Tuesday, 18 May 2010 15:26:37\
    \ -0400</li>\n  </ul>\n  <div class=\"content\">\n    the content of the entry,\
    \ and then the publication date and time information. We have more there, like\
    \ categories or tags, but let’s stick with the date and time to keep it simple.\n\
    \  </div>\n</article>\n```\n\nThanks to absolute positioning, we can place it\
    \ anywhere along the outer edge. Visually, create a containing block, and at the\
    \ same time open up some space for the information to live: the ul and position\
    \ it outside the left edge of the entry div (see Figure 4-49).\n\n```css\n.entry\
    \ {\n  position: relative;\n  margin-left: 10em;\n}\n.datetime {\n  position:\
    \ absolute;\n  width: 9em;\n  left: -10em;\n  top: 0;\n  padding: 0;\n}\nli {\n\
    \  list-style: none;\n  font-style: italic;\n}\n```\n\nPositioning an entry’s\
    \ metadata to one side is used to keep the content’s right edge from getting too\
    \ close to the left edge of entry content. And just like that, we’ve put the date\
    \ and time out to the left. Of moving this over to the right is just as simple\
    \ (see also Figure 4-50):\n\n```css\n.entry {\n  position: relative;\n  margin-right:\
    \ 10em;\n}\n.datetime {\n  position: absolute;\n  width: 9em;\n  right: -10em;\n\
    \  top: 0;\n  padding: 0;\n}\n```\n\n4-50: Moving the metadata to right.\n\n***155***\n\
    \nThanks to positioning, we can put things anywhere. This is great power. Use\
    \ it responsibly.\n"
  mdcn: "\n\n***151***\n\n```html\n<legend>\n  <form>\n    <input type=\"text\" name=\"\
    terms\" id=\"terms\">\n    <input type=\"submit\" value=\"Search\">\n  </form>\n\
    </legend>\n```\n\n你可以定位三个元素：logo、导航链接和搜索框。但你可能并不想把它们全部定位。试想一下如果你这样做会发生什么：`header`\
    \ `div` 将不包含任何标准流（normal-flow）内容，因此不会有任何高度。它的高度将为零 像素。或者可能是一行文本的高度，这取决于你具体定位了什么，以及浏览器如何处理剩余的空白。无论如何，它的高度都不会足够。\n\
    \n假设 logo 是你未进行定位的元素。这样你就可以随心所欲地将导航链接和搜索框放在任何地方。首先，为实现这一点建立一个包含块（containing block，定位上下文的专业术语）。\n\
    \n```css\nheader {\n  position: relative;\n}\n```\n\n这为任何后代元素建立了一个定位上下文。所以，如果你想把链接放在右上角，可以从这里开始：\n\
    \n```css\n.navlinks {\n  position: absolute;\n  top: 0;\n  right: 0;\n}\n```\n\
    \n也许你想将搜索表单放在右下角。结果如图 4-45 所示。\n\n```css\nheader form {\n  position: absolute;\n\
    \  bottom: 0;\n  right: 0;\n}\n```\n\n当然，这里还有其他的 CSS 在起作用（否则导航链接将变成项目列表），但你明白意思了。多亏了定位，你可以将这些元素放在\
    \ header 内部的任何地方。想把搜索框放在顶部而链接放在下方吗？在 `navlinks` 规则中将 `top` 交换为 `bottom`，在 `form`\
    \ 规则中反之亦然，结果如图 4-46 所示。\n\n```css\n.navlinks {\n  position: absolute;\n  bottom:\
    \ 0;\n  right: 0;\n}\nheader form {\n  position: absolute;\n  top: 0;\n  right:\
    \ 0;\n}\n```\n\n4-45：在另一个元素内部定位元素。\n\n虽然定位让你能够控制被定位元素的位置，但你必须担心重叠问题。例如，假设导航链接增长到两或三行文本。它们可能会开始重叠搜索框。这就是为什么你在网上看到大多数布局使用浮动（floats）而不是定位；浮动自然不会产生重叠。尽管如此，只要使用得当，定位可以让重新排列像页脚这样的区域的内容变得容易得多。\n\
    \n## 在包含块之外\n\n绝对定位的一个惊人特性是，你可以将元素定位到作为包含块（定位上下文）的元素之外。这种实现方式比你想象的要得多。例如，你可以将结构上位于\
    \ `header` `div` 内部的导航链接放置在紧邻该 `div` 的正下方。考虑以下标记结构（完整细节请见下一节）：\n\n```html\n<header\
    \ class=\"header\">\n  <a href=\"/\"><img src=\"logo.png\" alt=\"HugeCo Inc.\"\
    ></a>\n  <nav class=\"nav\"><ul>...</ul></nav>\n  <form id=\"search-form\" action=\"\
    /search\">...</form>\n</header>\n```\n\n现在，在（此处省略了一些其他颜色、字体和相关样式）的基础上应用以下样式来放置导航和搜索表单（见图\
    \ 4-47）：\n\n```css\n.header {\n  position: relative;\n  margin-bottom: 1.5em;\n\
    }\n.navlinks {\n  position: absolute;\n  top: 100%;\n  right: 0;\n}\nheader form\
    \ {\n  position: absolute;\n  top: 0;\n  right: 0;\n}\n```\n\n链接现在正位于 `header`\
    \ `div` 底部的正下方。为了让链接有足够的空间避免与 header 之后的内容重叠，对 `header` 应用了外边距（margin）。这使得搜索框（仍在\
    \ header 内部）和导航链接发生重叠的概率大大降低。\n\n你可能认为链接离 header 离得太近了。这很容易修复：增加 `top` 值。但也许你想将链接精确地放置在\
    \ header 底部 7 像素处。在这种情况下，你可以定义 header 的精确高度，然后通过计算得出什么种百分比值可以增加 7 像素的偏移。或者你也可以为导航定义一个\
    \ 7 像素的 `margin-top`（见图 4-48）。\n\n```css\n.navlinks {\n  position: absolute;\n\
    \  top: 100%;\n  right: 0;\n  margin-top: 7px;\n}\n```\n\n4-47：将链接放在 header 之外。\n\
    4-48：使用顶部外边距将链接向下推一点。\n\n由于 `top` 和 `margin-top` 具有独立的影响，你可以以模拟简单方程的方式来实现。也就是说，导航区域的顶部位于\
    \ header 顶部下方 `100% + 7px` 处（在这种情况下，“100%” 意味着“header 的高度”）。将信息放置在其包含块之外的另一个有趣示例是将博客文章的日期时间信息提取并放在侧边。考虑此标记：\n\
    \n```html\n<article class=\"entry\">\n  <h2>Positioning in Context</h2>\n  <ul\
    \ class=\"datetime\">\n    <li>Tuesday, 18 May 2010 15:26:37 -0400</li>\n  </ul>\n\
    \  <div class=\"content\">\n    条目的内容，然后是发布日期和时间信息。我们还有更多内容，比如分类或标签，但为了保持简单，我们只保留日期时间。\n\
    \  </div>\n</article>\n```\n\n多亏了绝对定位，我们可以将其放置在外部边缘的任何位置。在视觉上，创建一个包含块，同时为信息的生存留出空间：创建\
    \ `ul` 并将其放置在 `entry` `div` 的左边缘之外（见图 4-49）。\n\n```css\n.entry {\n  position:\
    \ relative;\n  margin-left: 10em;\n}\n.datetime {\n  position: absolute;\n  width:\
    \ 9em;\n  left: -10em;\n  top: 0;\n  padding: 0;\n}\nli {\n  list-style: none;\n\
    \  font-style: italic;\n}\n```\n\n将条目的元数据定位在某一侧，是为了防止内容的右边缘过于靠近条目内容的左边缘。就这样，我们把日期和时间放在了左侧。而将此移动到右侧同样简单（另见图\
    \ 4-50）：\n\n```css\n.entry {\n  position: relative;\n  margin-right: 10em;\n}\n\
    .datetime {\n  position: absolute;\n  width: 9em;\n  right: -10em;\n  top: 0;\n\
    \  padding: 0;\n}\n```\n\n4-50：将元数据移动到右侧。\n\n***155***\n\n多亏了定位，我们可以将元素放在任何地方。这是一股力量。请负责任地使用它。\n\
    \n"
