- md: "\nConsider some basic layout styles for a three-column layout.\n\n```css\n\
    .column {\n  background: #FFF;\n  color: #000;\n  font-family: Arial, sans-serif;\n\
    }\n\n.container {\n  position: relative;\n  margin: 3em 1%;\n  padding: 0.5em\
    \ 1.5%;\n}\n\n.border {\n  border: 1px solid #AAA;\n  border-width: 1px 1px 0\
    \ 1px;\n}\n\n.clear {\n  clear: both;\n}\n\n.float-right {\n  float: right;\n\
    \  width: 20%;\n  height: 40%;\n}\n```\n\nThis might be (in a minimalist sort\
    \ of way), it is likely to run into trouble on which is to say, narrower—displays.\
    \ What if you could magically change to a different layout on such displays?\n\
    \nFirst, restrict the three-column layout to environments that are more than 800\
    \ pixels wide. This is done by splitting the layout bits into their own declarations:\n\
    \n```css\n.column {\n  background: #FFF;\n  color: #000;\n  font-family: Arial,\
    \ sans-serif;\n}\n\n.container {\n  position: relative;\n  margin: 3em 1%;\n \
    \ padding: 0.5em 1.5%;\n}\n\n.border {\n  border: 1px solid #AAA;\n  border-width:\
    \ 1px 1px 0 1px;\n}\n\n.clear {\n  clear: both;\n}\n\n.float-right {\n  float:\
    \ right;\n  width: 20%;\n  height: 40%;\n}\n```\n\nand those last two declarations\
    \ in a media query:\n\n```css\n@media (min-width: 800px) {\n  .float-right {\n\
    \    float: right;\n    width: 20%;\n    height: 40%;\n  }\n}\n```\n\nThe `@media`\
    \ rule says “the rules inside this curly-brace block apply in all media that have\
    \ a display width of 800 pixels.” Anything below that, no matter the medium, and\
    \ the block will be ignored. Note the parentheses around the min-width term and\
    \ these are necessary any time you have a term and value (which are referred to\
    \ as an expression).\n\nAt this point, nothing will really change unless you shrink\
    \ the browser window until it offers less than 800 pixels across to the document\
    \ (see Figure 7-4). At that point, the columns stop altogether.\n\nFigure 7-4:\
    \ What happens below 800 pixels.\n\nWhat you can do at this point is write another\
    \ media-query block of layout rules that apply in narrower conditions. Say you\
    \ want a two-column layout between 500 and 800 pixels, as in Figure 7-5.\n\n```css\n\
    @media (min-width: 500px) and (max-width: 799px) {\n  .col { float: left; width:\
    \ 20%; }\n  #two { float: right; width: 69%; }\n  #three { clear: left; margin-top:\
    \ 0; }\n}\n```\n\nFinally, you can apply some single-column styles for any medium\
    \ with fewer pixels of display width (see Figure 7-6).\n\n```css\n@media (max-width:\
    \ 499px) {\n  body { text-align: center; }\n  li {\n    display: inline;\n   \
    \ list-style: none;\n    padding: 0 0.5em;\n    border-right: 1px solid gray;\n\
    \    line-height: 1.66;\n  }\n  li:last-child { border-right: none; }\n}\n```\n\
    \nIn all these queries, layout styles are rendered in relation to the display\
    \ area of the window. More generically, they are rendered in relation to the display\
    \ area of the document in any medium. That means that if a media, for example,\
    \ is used to print the document, and it has an available display area wide, then\
    \ the two-column layout will be used.\n\nFigure 7-6: Single-column layout, which\
    \ shows below 500 pixels.\n\nTo restrict the column shifting to screen media only,\
    \ alter the queries, like so:\n\n```css\n@media screen and (min-width: 800px)\
    \ { {...}\n@media screen and (min-width: 500px) and (max-width: 799px) { {...}\n\
    @media screen and (max-width: 499px) { {...}\n```\n\nWhat if you want the three-column\
    \ layout used in some non-screen media, like print and displays? Then add in those\
    \ media using commas, like so:\n\n```css\n@media print, tv, screen and (min-width:\
    \ 800px) { {...}\n@media screen and (min-width: 500px) and (max-width: 799px)\
    \ { {...}\n@media screen and (max-width: 499px) { {...}\n```\n\nCommas here act\
    \ as logical ORs, so the first query reads “use these styles on print media OR\
    \ a display area on a screen medium where the display area is 800 pixels more.”\
    \ If you want the three-column layout used in all non-screen media? Add a statement\
    \ to the first query using `not screen` saying “anything that isn’t screen.” You\
    \ can use pixels, em, cm, or any other valid length unit. 7-1 shows all the query\
    \ terms that can be used in constructing media queries. Note that most of these\
    \ terms accept min- and max-prefixes (for example, min-device-height and max-device-height).\
    \ The exceptions are orientation, scan, and grid.\n\n| Term | Description |\n\
    | :--- | :--- |\n| width | The width of the device’s display area (e.g., a browser\
    \ window). |\n| height | The height of the display area (e.g., a browser window).\
    \ |\n| orientation | The way the display is oriented; the two values are portrait\
    \ and landscape. |\n| aspect-ratio | The ratio of the display area’s width to\
    \ its height. Values are two integers separated by a forward slash. |\n| bit-depth\
    \ | The number of colors maintained in the device’s lookup table. If no value\
    \ is given, any color display will match. |\n| color | Applies to monochrome (or\
    \ grayscale) devices. |\n| resolution | The resolution of the display. Values\
    \ are expressed using dpi or cm. |\n| scan | The scanning type of a “TV” media\
    \ device (e.g., TTY display). Values are progressive and interlace. |\n\n### OCCASIONAL\
    \ CHILDREN\n\nTimes when you may want to select every second, third, fifth, eighth,\
    \ or thirteenth series. The most obvious cases are list items in a long list (or\
    \ columns) in a grid. There are as many cases as there are combinations of elements.\
    \ One of the less obvious cases: Suppose you have a lot of divs that you want\
    \ to float. The problem in these cases is that divs of varying length can really\
    \ float the grid, as evident in Figure 7-7. The solution here is to add a class\
    \ to every fourth div (because that is what encloses) and then clear it. Rather\
    \ than clutter up the markup with classes, though, why every fourth div (see Figure\
    \ 7-8)?\n\n```css\nnth-child(4n+1) { clear: left; }\n```\n\n7-7: The problem with\
    \ floating variable-height elements.\n7-8: Clearing every fourth child.\n\nExplanation\
    \ of the 4n+1 part: every element that can be described by the formula 4 times\
    \ n, where n is the series 0, 1, 2, 3, 4… That yields elements number 0, 4, 8,\
    \ 12, 16, and so on. Clearly, 3n would yield the series 0, 3, 6, 9, 12… There\
    \ is no zeroth element; elements start with the first (that is, element number\
    \ 1). You have to add + 1 in order to select the first, fifth, ninth, and so forth\
    \ elements. Read that right: the :nth-child() pattern starts counting from 0,\
    \ but the elements are counting from 1. That’s why + 1 will be a feature of most\
    \ :nth-child() selectors. Something with this kind of selector is that if you\
    \ want to change from selecting every element to every third element (see Figure\
    \ 7-9), you need only change a single number.\n\n```css\nnth-child(3n+1) { clear:\
    \ left; }\n```\n"
