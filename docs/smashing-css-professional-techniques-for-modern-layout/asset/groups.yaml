- md: "\n## CLEARING\n\n\"clearfix\" is an older technique that has been largely supplanted\
    \ by the preceding two techniques, but it’s easier to use clearing under certain\
    \ circumstances. These arise most often with older versions of Internet Explorer,\
    \ which in some circumstances don’t properly contain floats using the previously\
    \ discussed tips.\n\nThe simplest method of clearing is inserting an element into\
    \ the document and setting it to clear. For example:\n\n```css\nmain * {clear:\
    \ left;}\n```\n\n```html\n<div class=\"column one\">...</div>\n<div class=\"column\
    \ two\">...</div>\n<div class=\"column three\">...</div>\n<p class=\"clearfix\"\
    ><br></p>\n```\n\nThe br element is the key here. It will push itself, and therefore\
    \ anything that comes after it, below the floated columns that come before. In\
    \ order to make that happen, you will need the following CSS:\n\n```css\n.clearfix\
    \ {display: block; clear: both;}\n```\n\n4-11: Using the “clearfix” method to\
    \ push the footer below floated columns.\n\nThis will make sure the br element\
    \ sits below the two floated columns. It may also add a blank line in older browsers,\
    \ so if you’re going to use this method, test it out first. If it adds a blank\
    \ line, try altering your CSS like so:\n\n```css\n.clearfix {display: block; clear:\
    \ both; margin: 0; height: 0;}\n```\n\nSome have also used an hr instead of a\
    \ br on the theory that the clearing is a separate element and they’d like to\
    \ have it visible in non-CSS browsers. However, that will create a gap in CSS-aware\
    \ browsers, since the hr takes up layout space. You might prevent that with display:\
    \ none, but if you do that, the hr won’t affect the floats! So it won’t clear\
    \ below the floats! So instead the space is most often closed up with some trickery:\n\
    \n```css\n.clearfix {display: block; clear: left; margin: 0; height: 0; overflow:\
    \ hidden; .66em 0;}\n```\n\nThis is basically the same as before, though you should\
    \ certainly test it just to be sure. If you want exact-to-the-pixel placement\
    \ of elements, this particular variant isn’t your best; you’d be better off with\
    \ the br.\n\nAnother method that relies on generated content, but recent browsers\
    \ have made its obsolete thanks to changes in the handling of generated content,\
    \ and it’s also been largely replaced by previously discussed tips on float containment.\
    \ If your sense of historical curiosity has been piqued, see http://positioniseverything.net/easy.html\
    \ (but note the note at the top).\n\n### ADJACENT CLEARING\n\nThe preceding tip,\
    \ this is a way to clear an element that immediately follows another, where the\
    \ element to be cleared has the same parent as the floated element(s). This markup:\n\
    \n```html\n<div class=\"column one\">...</div>\n<div class=\"column two\">...</div>\n\
    <div class=\"column three\">...</div>\n<p>...</p>\n```\n\nthere’s no element between\
    \ the last column div and the paragraph. So how is the paragraph below the two\
    \ columns (see Figure 4-12)? Simple:\n\n```css\n.column + p {clear: both;}\n```\n\
    \n4-12: Using adjacent siblings and **clear** to push the footer below floated\
    \ columns.\n\nSince both the columns and the paragraph share the same parent element,\
    \ they’re siblings. Therefore, we can use the adjacent-sibling combinator (+)\
    \ to select the paragraph and have it cleared. \n\nA more generic solution is\
    \ to replace the p with a universal selector:\n\n```css\n.column three + * {clear:\
    \ both;}\n```\n\nThis way, any element, be it paragraph, list, table, preformatted\
    \ code, or anything else, will be cleared. The catch is that there is an easy\
    \ way to break this approach, and that’s to enclose the columns in their own div.\n\
    \n```html\n<div class=\"columns\">\n  <div class=\"column one\">...</div>\n  <div\
    \ class=\"column two\">...</div>\n  <div class=\"column three\">...</div>\n</div>\n\
    <p>...</p>\n```\n\nWith this markup, the paragraph will not clear. That’s because\
    \ it no longer shares a parent with the columns, and so it isn’t a sibling element.\
    \ That prevents the sibling selector from working at all. With this pattern, you’ll\
    \ want to use one of the previous float tips, like overflow: auto.\n\n## SIMPLE\
    \ COLUMNS\n\nSetting columns of text side by side is very simple: if you need\
    \ to clear them, see previous tips, or just clear any following element. This\
    \ markup:\n\n```html\n<div class=\"column one\">...</div>\n<div class=\"column\
    \ two\">...</div>\n<div class=\"footer\">...</div>\n```\n\nTo make it interesting,\
    \ your only real decision is which one goes on the left or the right. If you want\
    \ it on the right, no problem: float: right. To put the two columns side by side,\
    \ they’ll be jammed up against each other, but with a little CSS work, we can\
    \ make them look passable (see also Figure 4-13):\n\n```css\n.column {float: right;\
    \ width: 50%}\n.footer {clear: both;}\n```\n\nThe footer is not exactly what we\
    \ want—its top border is now across the top of the columns. Simple: a simple two-column\
    \ layout contains two bits of beauty. First is that you can put columns wherever\
    \ you want regardless of their source order. Second is that if you change your\
    \ mind, swapping them is as easy as changing float: right to float: left. Easy-asy!\
    \ You can do this with any kind of width measure—pixels, percentages—all depends\
    \ on whether you want the columns’ widths to be “liquid”—that is, flexible in\
    \ the browser’s width—or “fixed,” which sets an immovable value in pixels. Discussing\
    \ which is better or worse could be an entire chapter by itself, so pick the one\
    \ that fits the design and move on.\n\n### THREE SIMPLE COLUMNS\n\nJump from two\
    \ columns to three columns (see Figure 4-14) is pretty straightforward. Add another\
    \ div, class it appropriately, and float the columns.\n\n```html\n<div class=\"\
    column one\">...</div>\n<div class=\"column two\">...</div>\n<div class=\"column\
    \ three\">...</div>\n<div class=\"footer\">...</div>\n```\n\n4-13: Two simple\
    \ columns.\n\nBasic drill. By itself, it’s nothing more than a simple two-column\
    \ setup plus one column. The reason I bring it up is to explore a few things about\
    \ floated-column styling. First, as you may have noticed here or in the preceding\
    \ section, the left and right floated elements don’t “collapse.” Instead, the\
    \ outer margin edges touch and sit against each other. Thus, in the preceding\
    \ bit of CSS, the columns will be 10% apart—5% on each side. If we were to convert\
    \ the 5% to 20px, the columns would then be 40 pixels apart. That it’s hard to\
    \ put “full-height” separators between columns. This is one of those things that\
    \ has been bugging people for over a decade now, but it still exists and we deal\
    \ with it. However, with a three-column setup, if you know the middle column (and\
    \ I mean always) be the tallest, you can give it side borders to create lovely\
    \ separators, but not much (see Figure 4-15).\n\n```css\n.column {width: 20%;\
    \ margin: 0 2%; padding: 0 2%; float: left;}\n.footer {width: 30%; border: 1px\
    \ solid gray; border-width: 0 1px;}\n```\n"
  mdcn: "\n\n## 清除 (CLEARING)\n\n“clearfix”是一种较老的技巧，在很大程度上已被前述两种技术所取代，但在某些情况下，使用清除方法更为简单。这些情况通常出现在旧版本的\
    \ Internet Explorer 中，在某些情况下，它们无法通过之前讨论的技巧正确包含浮动元素（floats）。\n\n最简单的清除方法是在文档中插入一个元素并将其设置为清除。例如：\n\
    \n```css\nmain * {clear: left;}\n```\n\n```html\n<div class=\"column one\">...</div>\n\
    <div class=\"column two\">...</div>\n<div class=\"column three\">...</div>\n<p\
    \ class=\"clearfix\"><br></p>\n```\n\n这里的 `br` 元素是关键。它会将自己（因此以及随其后的任何内容）推到之前浮动列的下方。为了实现这一点，你需要使用以下\
    \ CSS：\n\n```css\n.clearfix {display: block; clear: both;}\n```\n\n4-11：使用“clearfix”方法将页脚推到浮动列下方。\n\
    \n这将确保 `br` 元素位于两个浮动列的下方。它也可能在旧版浏览器中添加一个空行，因此如果你打算使用这种方法，请先进行测试。如果它添加了空行，尝试这样修改你的\
    \ CSS：\n\n```css\n.clearfix {display: block; clear: both; margin: 0; height: 0;}\n\
    ```\n\n有些人还使用 `hr` 代替 `br`，其理论是清除元素是一个独立的元素，他们希望它在不支持 CSS 的浏览器中也是可见的。然而，这会在支持\
    \ CSS 的浏览器中创建一个间隙，因为 `hr` 占据了布局空间。你可能通过 `display: none` 来防止这一点，但如果你那样做，`hr` 就不会影响浮动元素了！因此它就无法在浮动元素下方进行清除！因此，该空间通常通过一些技巧来闭合：\n\
    \n```css\n.clearfix {display: block; clear: left; margin: 0; height: 0; overflow:\
    \ hidden; .66em 0;}\n```\n\n这在基本上与之前相同，尽管你确实应该进行测试以万万无一。如果你需要元素精确到像素的定位，这种特定的变体并不是你的最佳选择；使用\
    \ `br` 会更好。\n\n另一种方法依赖于生成内容（generated content），但由于现代浏览器对生成内容处理方式的改变，这种方法已经过时了，而且在很大程度上被之前讨论的浮动包含技巧所取代。如果你对历史好奇心被激发，请访问\
    \ http://positioniseverything.net/easy.html（但注意顶部的注释）。\n\n### 相邻清除 (ADJACENT CLEARING)\n\
    \n前述技巧是一种清除紧跟另一个另一个之后的元素的方法，其中要清除的元素与浮动元素具有相同的父元素。这种标记：\n\n```html\n<div class=\"\
    column one\">...</div>\n<div class=\"column two\">...</div>\n<div class=\"column\
    \ three\">...</div>\n<p>...</p>\n```\n\n在最后一个列 `div` 和段落之间没有元素。那么段落是如何位于两个列的下方的呢（见图\
    \ 4-12）？很简单：\n\n```css\n.column + p {clear: both;}\n```\n\n4-12：使用相邻兄弟元素和**清除\
    \ (clear)** 将页脚推到浮动列下方。\n\n由于列和段落共享同一个父元素，它们是兄弟元素。因此，我们可以使用相邻兄弟选择器（+)来选择段落并对其进行清除。\n\
    \n更通用的解决方案是将 `p` 替换为通用选择器：\n\n```css\n.column three + * {clear: both;}\n```\n\n\
    这样来，任何元素，无论是段落、列表、表格、预格式代码还是其他任何内容，都会清除。陷阱在于，有一种简单的方法可以破坏这种方法，并将列封装在它们自己的 `div`\
    \ 中。\n\n```html\n<div class=\"columns\">\n  <div class=\"column one\">...</div>\n\
    \  <div class=\"column two\">...</div>\n  <div class=\"column three\">...</div>\n\
    </div>\n<p>...</p>\n```\n\n使用这种标记，段落将不会被清除。这是因为再不再与列共享父元素，因此它不是兄弟元素。这阻止了兄弟选择器的起作用。对于这种模式，你将希望使用之前的浮动技巧之一，例如\
    \ `overflow: auto`。\n\n## 简单列 (SIMPLE COLUMNS)\n\n将文本列并排设置非常简单：如果你需要清除它们，请看之前的技巧，或者只需清除任何随其后的元素。这种标记：\n\
    \n```html\n<div class=\"column one\">...</div>\n<div class=\"column two\">...</div>\n\
    <div class=\"footer\">...</div>\n```\n\n为了使其有趣，你唯一的真正决定是哪一个在左侧或右侧。如果你想让它在右侧，没问题：`float:\
    \ right`。要让两列并排显示，它们会挤在一起，但通过一点 CSS 工作，我们可以让它们看起来尚可（另见图 4-13）：\n\n```css\n.column\
    \ {float: right; width: 50%}\n.footer {clear: both;}\n```\n\n页脚并不完全是我们想要的——它的顶部边框现在横跨了列的顶部。很简单：一个简单的双列布局包含了两个美之处。首先，无论它们的源顺序如何，你都可以将列放置在任何想要的地方。其次，如果你改变了主意，交换它们就像将\
    \ `float: right` 改为 `float: left` 一样简单。轻而易举！你可以对任何种宽度执行此操作——这取决于你希望列的宽度是“流动的”（即在浏览器中灵活）还是“固定的”（设置一个不可移动的像素值）。讨论哪种更好或更差可以单独成一章，所以选择适合设计的那个并继续吧。\n\
    \n### 三列简单 (THREE COLUMNS)\n\n从两列跳转到三列（见图 4-14）非常直观。添加另一个 `div`，对其进行适当分类，并浮动这些列。\n\
    \n```html\n<div class=\"column one\">...</div>\n<div class=\"column two\">...</div>\n\
    <div class=\"column three\">...</div>\n<div class=\"footer\">...</div>\n```\n\n\
    4-13：三列简单。\n\n基础练习。它本身只是一个简单的双列布局加上一列。我提到这一点是为了探索浮动列样式的几点。首先，正如你在此处或之前的章节中注意到的，左侧和右侧的浮动元素不会“合并”。相反，它们的外边距边缘会并在一起。因此，在之前的代码中，列之间将有10%的间距——各5%。如果我们把\
    \ 5% 转换为 20px，那么列之间的距离将是 40 像素。很难在列之间放置“全高”的分割符。这是困扰了人们十多年的问题之一，但它仍然存在，我们正在处理它。然而，在三列布局中，如果你知道中间列（我指的是总是）是最高的，你可以给它添加侧边框来创建好看的分割符，但效果并不理想（见图\
    \ 4-15）。\n\n```css\n.column {width: 20%; margin: 0 2%; padding: 0 2%; float: left;}\n\
    .footer {width: 30%; border: 1px solid gray; border-width: 0 1px;}\n```\n\n"
