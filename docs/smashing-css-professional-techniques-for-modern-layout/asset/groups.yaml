    Introduction


    CSS has become so phenomenally successful—almost as successful as HTML itself—that
    it is sometimes hard to grasp. It’s everywhere now, from Web browsers to app stores
    to chat clients, it doesn’t show any signs of fading away. As the language’s use
    continues to spread, its abilities continue to advance.


    This book contains close to 100 tips, techniques, tools, and tricks for making
    great Web sites with CSS. Each of them is meant to stand on its own: you can flip
    to any random page and read what you find there and not worry you’ve missed something
    crucial earlier in the chapter. What that means is that the text assumes you are
    at least somewhat familiar with CSS and how it’s used. The assumed level of proficiency
    is best described as “advanced beginner to intermediate.” So if you’re just starting
    out, or if you typically know more about CSS than the people writing the specifications,
    you’re not likely to get much out of this book. For everyone, there’s a fair amount
    to learn and enjoy.


    In part 1 of the book, there’s an overview of handy tools and fundamental techniques,
    including some of the more obscure CSS selectors. Part 2 presents a variety of
    things you can do with CSS including interesting effects, different routes to
    the same goal, layouts, and more. In part 3 are the advanced, cutting-edge techniques
    that might not be ready to use on your project this month but will become more
    and more central to your work as time progresses.


    Please visit the book''s companion web site at www.wiley.com/go/smashingcss to
    download example samples.


    More than a decade ago, you might have been forgiven for thinking CSS was on its
    deathbed, but as of 2010 it’s more vibrantly alive and compelling than ever. I
    hope you’ll enjoy what’s found between the covers of this book as much as I enjoyed
    assembling it!


    ## PART FUNDAMENTALS


    Chapter 1: Tools


    Chapter 2: Selectors


    ## CHAPTER TOOLS


    The essence of building Web pages (or applications), like anything else, is greatly
    improved by the use of tools. When it comes to CSS, there are tools to help us
    write the CSS and tools to construct tools that help us out. There are even tools
    out there that make browsers support more CSS than their native code base can
    bear. You’re a builder, a crafter, a maker—this chapter details some things that
    will really flesh out your toolbox.


    Firebug (see Figure 1-1) is one of two utterly essential tools in any Web creator’s
    toolbox. (For Chrome users, jump ahead to the “Web Developer” section.) It’s a
    completely free tool for Firefox. If you’re using another browser, keep reading:
    go to getfirebug.com. Click the Install button (it’s free as of this writing)
    and let it install. Relaunch Firefox and prepare to be amazed. In fact a single
    tip would not be enough to cover everything Firebug is capable of doing.


    The HTML tab (see Figure 1-2) shows you the document structure on the left. Note
    that when you hover over an element in the HTML tab, that element is highlighted
    in the page itself. This includes the content area and padding and margins of
    the element via color-coding. As of this writing, the content area is light blue,
    padding light yellow, but the colors aren’t as important as the fact that you
    can just see there on the page.


    The right side of the HTML tab, you can see the CSS that applies to the currently
    inspected element by clicking the Style tab (see Figure 1-3). This is not only
    the stuff you have written, but also the things that the browser itself is applying
    from its built-in stylesheets. If you see styles from html.css or quirk.css, for
    example, those are the built-in styles. These are called “UA styles,” for user
    agent styles. You can change whether or not they’re applied via a pop-up menu
    from the Style tab.


    Something to note is that sometimes Firebug will show you properties you didn’t
    specify, like background-clip. Unless you’re sure you declared those explicitly,
    you can more or less ignore them. Also, if you use a shorthand property, it will
    be expanded out into the individual properties. That is to say, something like
    this: font: 1em "Andale Mono", "Courier New", Courier, monospace; — will be represented
    in Firebug like this:


    - family: "Andale Mono","Courier New", Courier, monospace;

    - size: 1em;

    - size-adjust: none;

    - stretch: normal;

    - style: normal;

    - variant: normal;

    - weight: normal;

    - height: normal;


    Firebug split to a separate window with the Style tab in full effect. This representation
    isn’t necessarily bad—it does remind you that there’s often more to a shorthand
    property than what you actually say—it can be confusing at first. (For more on
    shorthand properties, see Chapter 2.)


    Another thing to note is that the rules shown in the Style tab are listed in reverse-specificity—that
    is, the first one is the most specific rule that applies to the inspected element,
    the next-most specific, and so on. (For more on specificity, see “Specificity”
    in inspecting any element just by right-clicking on it and selecting Inspect Element
    from the contextual menu that comes up (see Figure 1-4). You can also click the
    little pointer-and-arrow to the Firebug icon in order to switch into inspection
    mode. As you move around the page, elements will outline, and clicking on one
    will inspect it. Click the checkbox just to the left of any declaration to disable
    it via Firebug. This can be very useful when trying to see how properties interact
    by testing the effects of turning them off one by one. As shown in Figure 1-5,
    you can also see a little box of whatever color is given by hovering the mouse
    pointer over the value.


    The Computed tab (see Figure 1-6) shows you the computed styles for the element—which
    means it will show you the values that the browser has applied for every CSS property
    it knows, whether anyone said anything about them or not. This view can be useful
    when you know, for example, exactly how many pixels of line-height the browser
    is giving a heading.


    The Layout tab (see Figure 1-7) gives you a look at the exact dimensions and sizes
    of an element’s box model components: height, width, padding, margins, and so
    on. These are shown in a cooler: When you hover over the box shown in this panel,
    pixel rulers appear in place, placed along the top and left edges of the element’s
    outer border edge. As evident in Figure 1-8, you can edit element attribute values
    (like the element content itself, add or edit CSS properties and values, and much
    more) in the interface by clicking or right-clicking just about anything in the
    Firebug interface you can do.

