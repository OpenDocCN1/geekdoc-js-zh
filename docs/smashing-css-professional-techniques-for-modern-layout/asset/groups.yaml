- md: "\ndifference between united and unitless line-height values.\n\n## STYLE-LESS\
    \ BORDER VALUES\n\nBorders add a nice touch to any design, but without a style,\
    \ the border you meant to create will be missing in action.\n\nBy “without a style,”\
    \ I don’t mean CSS styles; I mean a border-style value. For suppose you write:\n\
    \n```css\np {border: 2px gray;}\n```\n\nthen no border will be placed around your\
    \ forms. The reason is simple: a border-style value means that the default value\
    \ for border-style was what is that default value? none. So the preceding rule\
    \ is exactly equivalent to:\n\n```css\np {border: 2px gray none;}\n```\n\nwith\
    \ a border-style of none will never be drawn, no matter how wide you set the border-width\
    \ value—because a border that doesn’t exist can’t have any width.\n\n## ROLLING\
    \ BORDER APPEARANCE WITH COLOR\n\nFrom time to time, you may find yourself with\
    \ the need (or just plain desire) to create an inset border. I’m not here to judge,\
    \ but I am here to point out a possible pitfall. Consider:\n\n```css\ndiv {border:\
    \ 5px red outset;}\n```\n\nUgh, right? But look at how that gets handled in various\
    \ browsers (see Figure 3-4).\n\n3-4: Differences in inset and outset across browsers.\n\
    \nIt’s not an error, and none of the browsers are wrong. The CSS specification\
    \ doesn’t say how the border’s color should be modified in order to create the\
    \ illusion of insetness or outsetness. It says, and I quote:\n\n*The color of\
    \ borders drawn for values of ‘groove’, ‘ridge’, ‘inset’, and ‘outset’ depends\
    \ on the element’s border color properties, but UAs may choose their own algorithm\
    \ to calculate the actual colors used (www.w3.org/TR/CSS21/box.html#border-style-properties).*\n\
    \nThat last part: “UAs [user agents] may choose their own algorithm.…” It is a\
    \ long-established truth of Web development that given the chance to choose differently,\
    \ browsers always will And so they have.\n\nIf you’re okay with the differences\
    \ in those borders, and if so, that’s cool; again, not here to judge you. If you\
    \ want those border shades to be consistent across browsers, though (as in Figure\
    \ 3-5), then what you really want is to declare a solid border and set the colors\
    \ yourself:\n\n```css\ndiv {border-color: #800 #F88 #F88 #800;}\ndiv {border-color:\
    \ #F88 #800 #800 #F88;}\n```\n\nGetting consistent inset and outset borders with\
    \ colored solid borders is tricky. This only works with inset and outset borders.\
    \ To create consistently colored groove and ridge borders (see Figure 3-6), you’ll\
    \ need to put a wrapper around (or just duplicate) element and style each one’s\
    \ solid border with specific colors that create the effect you want. Something\
    \ like this:\n\n```html\n<div class=\"wrap\">\n  <div style=\"border: 3px solid;\
    \ border-color: #800 #F88 #F88 #800;\">...</div>\n  <div style=\"border: 3px solid;\
    \ border-color: #F88 #800 #800 #F88;\">...</div>\n</div>\n```\n\n(See consistent\
    \ “ridged” borders in Figure 3-6).\n\n## HIDING ELEMENT DISPLAY\n\nHow to take\
    \ an element and make it go away on the page without actually removing it from\
    \ the document source? There are a few ways to make that happen, each with its\
    \ own strengths and weaknesses. The next sections discuss the various approaches.\n\
    \nThe most obvious way to make an element disappear is to switch off its display.\n\
    \n```css\ndiv {display: none;}\n```\n\nThat means any element will generate no\
    \ box at all. It will therefore have no effect on the layout of any other element.\
    \ It’s like it never even existed. There are a couple of pitfalls with display:\
    \ none, though—one potential, one persistent problem is if you directly set the\
    \ value of none via JavaScript, then how do you unset it? This is trickier than\
    \ it might seem. Suppose you wrote:\n\n```javascript\nobj = document.getElementById('linker');\n\
    obj.style.display = 'none';\n```\n\nlater in the JS, you want to show the element\
    \ again. What value do you give? It depends on the element: if it’s a span, you\
    \ probably want it to be inline. If it’s a div, you probably want block. (Then\
    \ again, maybe not: you can make spans and divs generate boxes easily enough.)\
    \ There’s one fairly commonplace solution: assign no value at all:\n\n```javascript\n\
    obj.style.display = '';\n```\n\nThis will cause the element to default back to\
    \ whatever display value is called for in the rest of the CSS, or by the browser’s\
    \ built-in styles. Another commonplace solution is to not set the display value\
    \ directly, but instead add a class, say, hide to the element. When you want to\
    \ reveal it again, you just off the class. This is a little more complicated because\
    \ it requires you to write (or find) JavaScript that will add or remove class\
    \ values, but it’s a very workable solution.\n\nPersistent problem is that (as\
    \ of this writing) elements with a display of none are not seen by the vast majority\
    \ of assistive technologies like screen readers. Since the element isn’t rendered\
    \ to the screen, the reader can’t find it and so doesn’t read it. This is often\
    \ exactly what is wanted, but at other times, it’s exactly what isn’t. For example,\
    \ suppose you have assistive links (generally called “skiplinks”) in your page.\
    \ You want them there for people who are using screen readers so they can jump\
    \ forward in the document, but you don’t want them on-screen getting in the way\
    \ of people who are sighted. If you set their container to display: none, then\
    \ they disappear for everyone, sighted or not. The people who need them don’t\
    \ hear them. Similarly, if you have dropdown menus that are hidden (absent mouse\
    \ action) for sighted users, screen readers won’t be able to find them if they’re\
    \ hidden with display: none.\n\n## HIDING ELEMENT VISIBILITY\n\nVery similar to\
    \ suppressing the display of an element, you can reduce its visibility to zero\
    \ by declaring it to be hidden.\n\n```css\nvisibility: hidden;\n```\n\nThis makes\
    \ the element invisible, which probably sounds a lot like it having no display.\
    \ Crucial difference, though: an element that’s set to visibility: hidden still\
    \ stays in the layout of the page, as evident in Figure 3-7. Taking up space,\
    \ what good is an invisible element? A mouse user can’t interact with it, it may\
    \ not be accessible by keyboard, and you certainly can’t see it. So why bother?\
    \ For absolutely positioned elements, which are already not participating in the\
    \ layout, you can toggle their visibility between hidden and visible without affecting\
    \ the page’s layout. As a bonus, you avoid the potential problems mentioned in\
    \ the display section.\n\n## THROWING ELEMENTS OFF-SCREEN\n\nYou want to hide\
    \ an element from people who can see but still make it available to screen readers.\
    \ How? Here’s one way.\n\n```css\nposition: absolute; top: -10000em; left: -10000em;\n\
    ```\n\nHaving done this, the third paragraph (the one that created a big blank\
    \ space in Figure 3-7) is essentially removed from the page, as shown in Figure\
    \ 3-8. Doing this will remove an element from sight, and yet it will still be\
    \ read by some screen readers. This is the reason why this technique is generally\
    \ held to be the inferior option for hiding elements.\n"
  mdcn: "\n\n带单位行高与无单位行高值的区别。\n\n## 无样式的边框值\n\n边框为任何设计增添了亮点，但如果没有样式，你想要创建的边框将不会生效。\n\
    \n我所说的“无样式”不是指 CSS 样式，而是指 `border-style` 值。假设你写了：\n\n```css\np {border: 2px gray;}\n\
    ```\n\n那么你的表单周围就不会有任何边框。原因很简单：`border-style` 值意味着 `border-style` 的默认值——那个默认值是什么呢？`none`。因此，前面的规则完全等同于：\n\
    \n```css\np {border: 2px gray none;}\n```\n\n只要 `border-style` 为 `none`，无论你将 `border-width`\
    \ 设置得多大，都不会绘制——因为不存在的边框无法拥有宽度。\n\n## 带有颜色的滚轮边框外观\n\n你可能会发现自己需要（或仅仅是想要）创建一个内凹边框（inset）。我不是来评价的，但我在这里指出一个可能的陷阱。考虑一下：\n\
    \n```css\ndiv {border: 5px red outset;}\n```\n\n呃，对吧？但看看它在不同浏览器中是如何处理的（见图 3-4）。\n\
    \n3-4：不同浏览器之间内凹（inset）和外凸（outset）的差异。\n\n这不是错误，没有任何浏览器是错误的。CSS 规范并没有说明应该如何修改边框颜色来创建内凹或外凸的错觉。它是这样说的，我直接引述：\n\
    \n*为‘groove’、‘ridge’、‘inset’和‘outset’值绘制的边框颜色取决于元素的边框颜色属性，但 UA（用户代理）可以选择它们自己的算法来计算实际使用的颜色（[www.w3.org/TR/CSS21/box.html#border-style-properties）。*\n\
    \n最后一部分：“UAs [用户代理]可以选择它们自己的算法……” 这是 Web 开发中一个经久公认的真理：如果有机会选择不同的方案，浏览器总是会这样做。而它们也确实如此。\n\
    \n如果你对这些边框的差异觉得无所谓，那也很好；再次强调，我不是来评价你的。但如果你希望这些边框阴影在不同浏览器中保持一致（如图 3-5 所示），那么你真正想要的是声明一个实边框并自己设置颜色：\n\
    \n```css\ndiv {border-color: #800 #F88 #F88 #800;}\ndiv {border-color: #F88 #800\
    \ #800 #F88;}\n```\n\n使用带颜色的实边框获得一致的内凹和外凸边框是困难的。这仅适用于内凹和外凸边框。要创建颜色一致的 groove 和\
    \ ridge 边框（见图 3-6），你需要为元素包裹一个容器（或直接复制元素），用特定的颜色对每个元素的实边框进行样式设置，以创建你想要的效果。如下：\n\
    \n```html\n<div class=\"wrap\">\n  <div style=\"border: 3px solid; border-color:\
    \ #800 #F88 #F88 #800;\">...</div>\n  <div style=\"border: 3px solid; border-color:\
    \ #F88 #800 #800 #F88;\">...</div>\n</div>\n```\n\n（见图 3-6 中一致的“ridged”边框）。\n\n\
    ## 隐藏元素显示\n\n如何让一个元素从页面上消失，而不实际上将其从文档源中移除？有几种方法可以实现，每种都有其优缺点。接下来的章节将讨论各种方法。\n\n\
    让元素消失最明显的方法是关闭它的显示。\n\n```css\ndiv {display: none;}\n```\n\n这意味着任何元素都不会生成任何盒子。因此，它对任何其他元素的布局都不会产生影响。它就像从未存在过一样。不过，`display:\
    \ none` 有两个陷阱——一个是潜在的，另一个是持续性的问题：如果你通过 JavaScript 直接设置了 `none` 值，那么你该如何取消设置呢？这比看起来的要复杂得多。假设你写了：\n\
    \n```javascript\nobj = document.getElementById('linker');\nobj.style.display =\
    \ 'none';\n```\n\n稍后在 JS 中，你想再次显示该元素。你给它赋什么值？这取决于元素：如果它是 `span`，你可能希望它是 `inline`\
    \ 的；如果是 `div`，你可能希望它是 `block` 的。（尽管如此，也许并不一定：你可以很容易地让 `span` 和 `div` 生成盒子。）有一个相当常见的解决方案：什么值都不赋：\n\
    \n```javascript\nobj.style.display = '';\n```\n\n这将导致元素回退到 CSS 其他部分调用的任何 `display`\
    \ 值，或者取决于浏览器的内置样式。另一种常见的解决方案是不直接设置 `display` 值，而是给元素添加一个类，例如 `hide`。当你想要再次显示它时，只需移除该类即可。这稍微复杂一点，因为需要你编写（或找到）能够添加或移除类值的\
    \ JavaScript，但这是一个非常可行的解决方案。\n\n持续性的问题是（截至本文写作时），`display` 为 `none` 的元素不会被绝大多数辅助技术（如屏幕阅读器）看到。由于元素没有渲染到屏幕上，阅读器就找不到它，因此就不会读取它。这通常正是人们想要的，但在其他时候，这恰恰不是想要的。例如，假设你的页面中有辅助性链接（通常称为“跳过链接”）。你希望使用屏幕阅读器的人能看到这些链接以便跳转，但你不希望它们出现在屏幕上干扰视力用户。如果你将它们的容器设置为\
    \ `display: none`，那么它们对所有人都消失了。需要它们的人也听不到它们。\n\n## 隐藏元素可见性\n\n与抑制元素的显示类似，你可以通过声明其为隐藏来将其可见性降为零。\n\
    \n```css\nvisibility: hidden;\n```\n\n这使得元素变得不可见，听起来和没有显示非常相似。但关键区别在于：设置为 `visibility:\
    \ hidden` 的元素仍然留在页面布局中，如图 3-7 所示。占据了空间，不可见的元素有什么用？鼠标用户无法与之交互，无法通过键盘访问，你也根本看不到它。那么为什么要这么费劲呢？对于已经不参与布局的绝对定位元素，你可以在隐藏和可见之间切换它们，而不影响页面布局。作为额外奖励，你避免了显示部分中提到的潜在问题。\n\
    \n## 将元素抛到屏幕外\n\n你想向视觉用户隐藏一个元素，但让它对屏幕阅读器可用。如何做到？这里有一种方法：\n\n```css\nposition:\
    \ absolute; top: -10000em; left: -10000em;\n```\n\n这样做之后，第三段（在图 3-7 中创建了大空白区域的段落）基本上从页面上移除了，如图\
    \ 3-8 所示。这样做会将元素从视觉上移除，然而它仍然会被某些屏幕阅读器读取。这就是为什么这种技术通常被认为是隐藏元素的较差方案。\n\n"
