- md: "\n***41***\n\n2-1: Enlarging the first letter of an h1.\n\n...by changing the\
    \ dot to a colon, thus yielding li:first-child, you have the same result without\
    \ the need to go sprinkling classes all over the markup.\n\nYou may also have\
    \ picked up on the double-colon syntax used with pseudo-elements. This was introduced\
    \ after CSS2.1. As of this writing, no browser requires that you use the double-colon\
    \ before pseudo-elements: a single colon works just fine.\n\nside note, CSS3 adds\
    \ the following pseudo-classes, most of which are not widely supported as of this\
    \ writing:\n\n- :target\n- :root\n- :nth-child()\n- :nth-of-type()\n- :nth-last-of-type()\n\
    - :first-of-type\n- :last-of-type\n- :only-of-type\n- :only-child\n- :last-child\n\
    - :empty\n- :not()\n- :enabled\n- :disabled\n- :checked\n\n## TARGETS WITH STYLE\n\
    \nThe :target pseudo-class can be very useful to point to a fragment identifier\
    \ within a document. What’s that, you say? It’s simple as this:\n\n`<a href=\"\
    http://example.com/law.html#sec2-7\">Section 2.7</a>`\n\nFollowing that link will\
    \ (if the browser gets it right) land not only on the targeted element but also\
    \ at the point in the page where that fragment identifier (the #sec2-7 part) is.\n\
    \nThis is sometimes done with an anchor, but it’s better to just use an ID. Here\
    \ is the catch: while the browser will jump to that point in the document, there’s\
    \ no visual cue that you’ve gone there. With the :target pseudo-class, you can\
    \ provide a cue. For example if you wanted to give a particular cue to any h3\
    \ that is the target of a fragment (see Figure 2-2), you could say:\n\n```css\n\
    h3:target {\n  color: maroon;\n  background: #FFA;\n}\n```\n\n### Highlighting\
    \ a targeted element\n\nYou might just want to apply that style to any element\
    \ that’s a target, no matter what it is, so just drop the h3 part and add a universal\
    \ selector at the front, like so:\n\n```css\n* {\n  color: maroon;\n  background:\
    \ #FFA;\n}\n```\n\n***43***\n\nTechnically the universal selector is optional\
    \ in that case; you can write simply `:target`.\n\nIf you’re looking to go a little\
    \ more Web 2.0 with the targeting style, you could set up an animation that makes\
    \ a piece of the page’s background go from yellow to white to let you know you’ve\
    \ done something. That “you’ve done it” thing can be done fairly easily with :target\
    \ and an animated GIF.\n\n```css\ntarget {\n  background: yellow;\n}\n```\n\n\
    Just create an animation that’s a smooth fade from yellow to white (if that’s\
    \ your site’s background color) and use it as a background image:\n\n```css\n\
    target {\n  background: url(/pix/yellow-fade.gif);\n}\n```\n\n## SPECIFICITY\n\
    \nSpecificity is hard to say three quickly and can be even harder to thoroughly\
    \ grasp, but it’s the key to understanding how CSS rules interact with each other.\
    \ Specificity is a numeric representation of the “specificity-ness” of a selector.\
    \ There are three parts that are used to determine a selector’s specificity:\n\
    \n- Every element descriptor contributes 0,0,0,1.\n- Every class, pseudo-class,\
    \ or attribute descriptor contributes 0,0,1,0.\n- Every ID descriptor contributes\
    \ 0,1,0,0.\n\nDon’t freak out (yet)! Take a look at a few examples:\n\n| Selector\
    \ | Specificity |\n| :--- | :--- |\n| `ul li` | 0,0,0,2 |\n| `.aside ul li` |\
    \ 0,0,1,3 |\n| `:hover` | 0,0,1,1 |\n| `.navlinks:hover` | 0,0,2,2 |\n| `title\
    \ em` | 0,0,0,1 |\n| `#title em` | 0,1,0,2 | (Wait, ID is 0,1,0,0) -> 0,1,0,1\n\
    | `table tbody tr td` | 0,0,0,4 |\n| `div ul li ol li` | 0,0,0,5 |\n\nWait, let\
    \ me re-calculate based on the text logic:\n- `ul li`: 2 elements = 0,0,0,2\n\
    - `.aside ul li`: 1 class, 3 elements = 0,0,1,3\n- `:hover`: 1 pseudo-class =\
    \ 0,0,1,1\n- `.navlinks:hover`: 1 class, 1 pseudo-class = 0,0,2,2\n- `title em`:\
    \ 2 elements = 0,0,0,2\n- `#title em`: 1 ID, 1 element = 0,1,0,1\n- `table tbody\
    \ tr td`: 4 elements = 0,0,0,4\n- `div ul li ol li`: 5 elements = 0,0,0,5\n\n\
    This begins to give you an idea of how specificity values are built up. Now, why\
    \ the commas? The comma separators help keep this clear the selectors might be\
    \ written “10” and “13,” leading to the erroneous impression that higher is more\
    \ specific.\n\nThere’s another common misconception, which is that structural\
    \ proximity matters to specificity. For example, suppose you write the following:\n\
    \n```css\nhtml {\n  font-style: normal;\n}\n\nul {\n  font-style: italic;\n}\n\
    ```\n\nWhich wins? They both have two element descriptors, which means they both\
    \ have specificity of 0,0,0,2. Therefore, the last one written wins. The fact\
    \ that the ul element is closer in the document structure than the html element\
    \ does not matter in the specificity is a straight numeric value. It does not\
    \ evaluate the page structure in any way. The list items all get to be italic\
    \ because the last rule wins when specificities are equal.\n\nYou are probably\
    \ wondering what the first zero in the specificity notation is for, given that\
    \ I said elements contribute to specificity. That first zero is used for inline\
    \ styles, and only inline styles use it. Therefore, given the following style\
    \ and markup, the div’s background will be blue:\n\n```css\ndiv {\n  background:\
    \ purple; /* 0,1,0,0 */\n}\n```\n\n`<div id=\"header\" style=\"background: blue;\"\
    > <!-- 1,0,0,0 --></div>`\n\n## IMPORTANT\n\nThere is something that overrides\
    \ specificity, and that’s !important. If you’re a programmer, abuse yourself of\
    \ a misunderstanding right now: that does not mean “not important.” How it works\
    \ is that you can mark any individual declaration as important. Here’s an example:\n\
    \n```css\na {\n  color: red !important;\n  text-decoration: none;\n}\n```\n\n\
    In this example, color: red has been marked important, but text-decoration is\
    \ not. Every declaration you want to mark as being important needs its own separate\
    \ declaration. Any important declaration will override any non-important declaration,\
    \ period. Given the following, the result will be a green link:\n\n```css\na#home\
    \ {\n  color: red;\n}\n\na {\n  color: green !important;\n}\n```\n\n***45***\n\
    \n## WHAT HAPPENS WHEN YOU OMIT SHORTHAND VALUE\n\nYou are all familiar with shorthand\
    \ properties: background, border, font, margin, and padding are among the most\
    \ commonly used. They’re a nice, compact way to express a bunch of things all\
    \ at once. But what happens if you leave out some of those things? Consider:\n\
    \n```css\nstrong {\n  font: bold italic small-caps medium/1.2 Verdana, sans-serif;\n\
    }\n```\n\nwill, as illustrated in Figure 2-3, yield bold italicized small-caps\
    \ medium-size Verdana other sans-serif text with a line height of 1.2 for strong\
    \ elements.\n\nSuppose we pare that value back, though:\n\n```css\nstrong {\n\
    \  font: medium Verdana, sans-serif;\n}\n```\n"
  mdcn: "\n\n***41***\n\n2-1: 放大 h1 的第一个字母。\n\n...通过将句点改为冒号，从而产生 `li:first-child`，你无需在标记标记中到处撒满类名（classes）即可得到相同的结果。\n\
    \n你可能已经注意到了用于伪元素（pseudo-elements）的双冒号语法。这是在 CSS 2.1 之后引入的。截至本文写作，没有浏览器要求你在伪元素之前使用双冒号：单冒号也完全可以。\n\
    \n顺带一提，CSS3 添加了以下伪类（pseudo-classes），截至目前其中大多数尚未被广泛支持：\n\n- :target\n- :root\n\
    - :nth-child()\n- :nth-of-type()\n- :nth-last-of-type()\n- :first-of-type\n- :last-of-type\n\
    - :only-of-type\n- :only-child\n- :last-child\n- :empty\n- :not()\n- :enabled\n\
    - :disabled\n- :checked\n\n## 带有样式的目标\n\n`:target` 伪类对于指向文档内的片段标识符（fragment identifier）非常有用。你问那是什么？简单如下：\n\
    \n`<a href=\"http://example.com/law.html#sec2-7\">第 2.7 节</a>`\n\n点击该链接（如果浏览器处理正确）不仅会跳转到目标元素，还会落在页面上该片段标识符（即\
    \ `#sec2-7` 部分）所在的位置。\n\n这有时通过锚点（anchor）来实现，但直接使用 ID 更好。这里的问题在于：虽然浏览器会跳转到文档中的该点，但并没有视觉提示告诉你你已经到达了那里。通过\
    \ `:target` 伪类，你可以提供一个提示。例如，如果你想为任何作为片段目标的 `h3` 提供特定的提示（见图 2-2），你可以这样写：\n\n```css\n\
    h3:target {\n  color: maroon;\n  background: #FFA;\n}\n```\n\n### 高亮显示目标元素\n\n\
    你可能只想将该样式应用到任何目标元素，无论它是什么，所以只需删掉 `h3` 部分并在前面添加一个通用选择器，如下：\n\n```css\n* {\n  color:\
    \ maroon;\n  background: #FFA;\n}\n```\n\n***43***\n\n从技术上讲，在这种情况下通用选择器是可选的；你可以直接写\
    \ `:target`。\n\n如果你想让目标样式更具 Web 2.0 感，可以设置一个动画，让页面背景的一部分从黄色变为白色，以告知你已经执行了某些操作。这种“你做到了”的效果可以通过\
    \ `:target` 和动态 GIF 轻松地实现。\n\n```css\ntarget {\n  background: yellow;\n}\n```\n\
    \n只需创建一个从黄色到白色的平滑淡入动画（如果那是你网站的颜色），并将其作为背景图像使用：\n\n```css\ntarget {\n  background:\
    \ url(/pix/yellow-fade.gif);\n}\n```\n\n## 优先级 (SPECIFICITY)\n\n优先级（Specificity）很难快速口述，甚至更难彻底掌握，但它是理解\
    \ CSS 规则如何相互作用的关键。优先级是选择器“权重程度”的数值表示。用于确定选择器优先级的有三个部分：\n\n- 每个元素描述符（element descriptor）贡献\
    \ 0,0,0,1。\n- 每个类名（class）、伪类（pseudo-class）或属性描述符（attribute descriptor）贡献 0,0,1,0。\n\
    - 每个 ID 描述符（ID descriptor）贡献 0,1,0,0。\n\n不要惊慌（暂时不要）！来看几个例子：\n\n| 选择器 | 优先级 |\n\
    | :--- | :--- |\n| `ul li` | 0,0,0,2 |\n| `.aside ul li` | 0,0,1,3 |\n| `:hover`\
    \ | 0,0,1,1 |\n| `.navlinks:hover` | 0,0,2,2 |\n| `title em` | 0,0,0,1 |\n| `#title\
    \ em` | 0,1,0,2 | (等等，ID 是 0,1,0,0) -> 0,1,0,1 |\n| `table tbody tr td` | 0,0,0,4\
    \ |\n| `div ul li ol li` | 0,0,0,5 |\n\n等等，让我根据文本逻辑重新计算一下：\n- `ul li`: 2 个元素 =\
    \ 0,0,0,2\n- `.aside ul li`: 1 个类, 3 个元素 = 0,0,1,3\n- `:hover`: 1 个伪类 = 0,0,1,1\n\
    - `.navlinks:hover`: 1 个类, 1 个伪类 = 0,0,2,2\n- `title em`: 2 个元素 = 0,0,0,2\n- `#title\
    \ em`: 1 个 ID, 1 个元素 = 0,1,0,1\n- `table tbody tr td`: 4 个元素 = 0,0,0,4\n- `div\
    \ ul li ol li`: 5 个元素 = 0,0,0,5\n\n这让你开始对优先级值是如何构建的有了概念。现在，为什么要用逗号？逗号分隔符有助于保持清晰，否则选择器可能会被写成“10”和“13”，导致产生数字越高优先级越高的错误印象。\n\
    \n另一个常见的误解是，结构上的接近程度会影响优先级。例如，假设你写了：\n\n```css\nhtml {\n  font-style: normal;\n\
    }\n\nul {\n  font-style: italic;\n}\n```\n\n哪一个胜？它们都有两个元素描述符，意味着优先级都是 0,0,0,2。因此，后写的胜出。\n\
    \n你可能在疑惑优先级表示中的第一个零是干什么的，考虑到我提到过元素会贡献优先级。那个第一个零用于内联样式（inline styles），且只有内联样式使用它。因此，给定下面的样式和标记，div\
    \ 的背景将是蓝色：\n\n```css\ndiv {\n  background: purple; /* 0,1,0,0 */\n}\n```\n\n`<div\
    \ id=\"header\" style=\"background: blue;\"> <!-- 1,0,0,0 --></div>\n\n## IMPORTANT\n\
    \n有一种可以覆盖优先级，那就是 `!important`。如果你是程序员，现在纠正一个误解：它并不意味着“不”。它的工作原理是你可以将任何单独声明标记为重要。这里有一个例子：\n\
    \n```css\na {\n  color: red !important;\n  text-decoration: none;\n}\n```\n\n\
    在这个例子中，`color: red` 被标记为重要，但 `text-decoration` 没有。你每一个想要标记为重要的声明都需要单独的声明。任何重要的声明都会覆盖任何非重要的声明，如此。给定如下，结果将是一个绿色的链接：\n\
    \n```css\na#home {\n  color: red;\n}\n\na {\n  color: green !important;\n}\n```\n\
    \n***45***\n\n## 当你省略简写值时会发生什么\n\n你都熟悉简写属性：`background`、`border`、`font`、`margin`\
    \ 和 `padding` 是最常用的。它们是一次性表达许多内容的简洁紧凑的方式。但如果你漏掉了其中某些内容会发生什么？考虑：\n\n```css\nstrong\
    \ {\n  font: bold italic small-caps medium/1.2 Verdana, sans-serif;\n}\n```\n\n\
    将如图 2-3 所示，为 `strong` 元素产生加粗、斜体、小型大写、中号 Verdana 其他无衬线字体，行高为 1.2。\n\n然而，假设我们将该值删减：\n\
    \n```css\nstrong {\n  font: medium Verdana, sans-serif;\n}\n```\n\n"
