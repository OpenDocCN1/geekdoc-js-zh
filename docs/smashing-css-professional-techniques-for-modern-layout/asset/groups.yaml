- md: '

    It’s how skewing works: Imagine there are two bars running through the element,
    one along each of the x and y axes. When you skew in the x direction, the y axis
    is rotated by the w angle. Yes, the y (vertical) axis is the one that rotates
    in a skewX() operation. Positive angles are counterclockwise, and negative angles
    are clockwise. That’s why the first box in the first example appears to tilt rightward:
    The y axis was tilted 33.3 degrees clockwise.


    The same basic thing happens with skewY(): The x axis is tilted by the specified
    number of degrees, with positive angles tilting it counterclockwise and negative
    angles tilting clockwise.


    The interesting part here is how the origin plays into it. If the origin is in
    the center and you provide a negative skewX(), then the top of the element will
    slide to the right of the origin while the bottom will slide to the left. Change
    the origin to the bottom of the element, though, and the whole thing will tilt
    right from the bottom of the element (see Figure 7-41).


    ```css

    {transform: skewX(-23deg);}

    {transform: skewY(-23deg); transform-origin: bottom center;}

    ```


    Figure 7-41: Two skewed elements, each with a different skewing origin.


    Similar effects happen with vertical skews.


    These are the types of transforms you can carry out. But what if you want to do
    more than one (see Figure 7-42)? No problem! Just list them in the order you want
    them to transform.


    By default, the transforms are executed one at a time, starting with the first.
    This can make a difference. Consider the differing outcomes of the same transforms
    in different orders (see Figure 7-43).


    ```css

    {transform: translateX(50px) rotate(23deg);}

    {transform: scale(0.75) translate(25px,-2em);}

    {transform: rotate(45deg) skew(-45deg);}

    {transform: skew(-45deg) rotate(45deg);}

    ```


    Figure 7-43: Multiple transforms in action.


    One more transformation value type to cover: matrix(). This value type allows
    you to define a transformation matrix in six parts, the last two of which define
    the translation, for example, which is then illustrated in Figure 7-44.


    ```css

    {transform: matrix(0.67,0.23,0,1,25px,10px);}

    {transform: matrix(1,0.13,0.42,1,0,-25px);}

    ```


    Figure 7-44: Matrix transforms.

    '
  mdcn: '

    这就是倾斜（skew）的工作原理：想象有两条穿过该元素的条线，分别沿着 x 轴和 y 轴运行。当你沿 x 方向进行倾斜处理时，y 轴会旋转 `w` 角度。是的，在
    `skewX()` 操作中，旋转的是 y（垂直）轴。正角度为逆时针方向，负角度为顺时针方向。这就是为什么第一个示例中的第一个框看起来是向右倾斜的：因为 y
    轴向顺时针方向倾斜了 33.3 度。


    `skewY()` 也发生了相同的基础情况：x 轴会按指定的度数倾斜，正角度使其逆时针倾斜，负角度使其顺时针倾斜。


    这里有趣的地方在于原点（origin）起起的作用。如果原点位于中心且你提供了一个负的 `skewX()`，那么元素的顶部将向原点的右侧滑动，而底部将向左侧滑动。但如果将原点改为元素的底部，整个元素就会从元素的底部向右倾斜（见图
    7-41）。


    ```css

    {transform: skewX(-23deg);}

    {transform: skewY(-23deg); transform-origin: bottom center;}

    ```


    图 7-41：两个倾斜的元素，每个都有不同的倾斜原点。


    垂直倾斜也会产生类似的效果。


    这些就是你可以执行的变换类型。但如果你想执行多个变换该呢（见图 7-42）？没问题！只需按照你想要变换的顺序列出它们即可。


    默认情况下，变换是按顺序一个一个执行的，从第一个开始。这可能会产生差异。考虑一下相同变换在不同顺序下的不同结果（见图 7-43）。


    ```css

    {transform: translateX(50px) rotate(23deg);}

    {transform: scale(0.75) translate(25px,-2em);}

    {transform: rotate(45deg) skew(-45deg);}

    {transform: skew(-45deg) rotate(45deg);}

    ```


    图 7-43：多个变换的实际效果。


    另一个需要介绍的变换值类型：`matrix()`。这种值类型允许你通过六部分来定义变换矩阵，其中最后两部分定义平移（例如），这将在图 7-44 中所示。


    ```css

    {transform: matrix(0.67,0.23,0,1,25px,10px);}

    {transform: matrix(1,0.13,0.42,1,0,-25px);}

    ```


    图 7-44：矩阵变换。

    '
