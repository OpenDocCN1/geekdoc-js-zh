    \n## ONE TRUE LAYOUT\n\nThe name of this layout technique is more than a bit tongue-in-cheek,\
    \ but its usefulness is beyond question. Popularized by Alex Robinson in late\
    \ 2005 (see http://positionindependent.net/articles/onetruelayout/), the core\
    \ message is this: You can have columns laid out in an order independent from\
    \ the document source order. This is a significant improvement on simple floated\
    \ columns (see previous sections), whose layout is tied to source order.\n\nTo\
    \ make this work, you need only your columns in divs and some CSS. No extra container\
    \ elements are necessary, as was the case with previous attempts to permit source-independent\
    \ layout.\n\nStart, as usual, with a set of three columns. In this case, the page’s\
    \ “main content” is in the first column, and the “secondary” content and navigation\
    \ links go into the next two columns.\n\n```html\n<div class=\"column one\">...</div>\n\
    <div class=\"column two\">...</div>\n<div class=\"column three\">...</div>\n```\n\
    \nStart things out, we’ll float them all left and set some widths (see Figure\
    \ 4-25). To keep things simple, we’ll use pixel widths, but please note that this\
    \ works just as well with ems or percentages. (The only restriction is that all\
    \ the columns use the same units for their width, even that is bendable.)\n\n\
    ```css\n.column {float: left; padding: 0 20px; margin: 0 20px;}\n.one, .three\
    \ {width: 200px;}\n.two {width: 300px;}\n```\n\nating the three columns.\n\nNow\
    \ let’s assume that we want the first column in the middle, the second on the\
    \ right and the third on the left side, as depicted in Figure 4-26. That requires\
    \ two more rules:\n\n```css\n.one {height: 300px; margin-left: 300px;}\n.three\
    \ {margin-left: -920px;}\n```\n\nThat’s the whole thing.\n\nDoes it work? Well,\
    \ the left margin on the first column pushes it over and opens up a big space\
    \ that’s the same width as the entirety of the third column—content, padding,\
    \ plus the original left margin of the first column (which was 20px). With that\
    \ ready, the margin of the third column pulls it left past the preceding two columns\
    \ and drops the top left margin of the first column. And that’s all it takes.\n\
    \nIf we want the second column on the left side and the third column on the right,\
    \ shifting the columns around (see Figure 4-27). Easy. Keep the .one rule from\
    \ the .three rule, and add this rule:\n\n```css\n.two {margin-left: -640px;}\n\
    ```\n\nThe idea is exactly the same. It’s just a matter of making sure there’s\
    \ enough room for the column that’s meant to go there, and then pulling that column\
    \ the appropriate amount.\n\nYou can flip all this around to go rightward as well:\n\
    \n```css\n. {float: right; padding: 0 20px; margin: 0 20px;}\n.one {width: 200px;}\n\
    .two {width: 300px; margin-right: 320px;}\n.three {margin-right: -640px;}\n```\n\
    \nNot limited to three columns, either. If you have four, five, or even more columns,\
    \ you can arrange them into pretty much any order you like. It gets more complicated\
    \ as the columns increases, of course, but if it were easy anyone could do it,\
    \ right?\n\nIf you want to center your columns in the browser window, you will\
    \ need a container around the columns. Something like this:\n\n```html\n<div style=\"\
    width: 1000px; margin: 0 auto;\">\n  <div class=\"column one\">...</div>\n  <div\
