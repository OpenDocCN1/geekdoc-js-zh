- md: "\n***223***\n\n#### Web traffic\n\n| Day | Hits | Views |\n| :--- | :--- |\
    \ :--- |\n| 1/10/10 | 151,308 | 70,342 |\n| 1/10/11 | 138,887 | 70,410 |\n| 1/10/12\
    \ | 106,563 | 58,383 |\n| 1/10/13 | 117,551 | 64,181 |\n| 1/10/14 | 251,969 |\
    \ 171,790 |\n| 1/10/15 | 213,228 | 134,238 |\n| 1/10/16 | 186,099 | 113,014 |\n\
    | 1/10/17 | 246,637 | 161,287 |\n| 1/10/18 | 210,124 | 135,479 |\n| 1/10/19 |\
    \ 168,413 | 115,541 |\n\nIn a browser, the raw data looks like Figure 6-16.\n\n\
    Turning a table into a chart is really straightforward. All you need to do is\
    \ place each day in place and then scale up the table cells to the necessary height.\
    \ Simple!\n\nMaybe it’s not quite that easy. But as you’ll see, it’s not that\
    \ complex either. First, set which table you’re going to work with.\n\n```css\n\
    td {\n  outline: 1px dotted red;\n  display: block;\n  position: relative;\n \
    \ height: 300px;\n  width: 600px;\n  font-family: sans-serif;\n}\n```\n\nHeight\
    \ and width could really be any set of measures, but the pixels make it easier\
    \ to maintain mathy bits as you go along. Rest assured, however, that nothing\
    \ you do will be waste of pixels. When done, you’ll be able to change those values\
    \ to whatever you need till the data be graphed. The outline rule is temporary,\
    \ existing only so you’re positioning everything in the table.\n\n```css\ntd {\n\
    \  display: block;\n  position: absolute;\n  left: 0;\n  bottom: 0;\n  width:\
    \ 10%;\n  height: 100%;\n}\n```\n\n***225***\n\nThe `tbody` rows are set to a\
    \ width of 10% because you want to place them side by side (see Figure 6-17).\
    \ There are 10 of them, so 100% (the full width of the table) divided by 10 is\
    \ 10%.\n\n```css\ntr:nth-child(1) { left: 10%; }\ntr:nth-child(2) { left: 20%;\
    \ }\ntr:nth-child(3) { left: 30%; }\ntr:nth-child(4) { left: 40%; }\ntr:nth-child(5)\
    \ { left: 50%; }\ntr:nth-child(6) { left: 60%; }\ntr:nth-child(7) { left: 70%;\
    \ }\ntr:nth-child(8) { left: 80%; }\ntr:nth-child(9) { left: 90%; }\n```\n\nSetting\
    \ up the containment for each bar of the graph is kind of the tedious part: writing\
    \ out the left offset for every row. Just imagine doing it for a whole month!\
    \ (That is why you get a script to write this sort of thing out for you instead\
    \ of doing it by hand, of course. More on that later.)\n\nMaking the bars stand\
    \ up as appropriate is where it gets really tedious because height has to be computed\
    \ for every single one and then assigned. To get started, the highest value needs\
    \ to be determined; in this case, it’s 251,969. Then pick a value above that which\
    \ represents the very top of the graph. It could be 260,000; 275,000; or 300,000.\
    \ For this example, go with 260,000.\n\nHaving done that, next divide every single\
    \ value by that maximum to get a percentage. So for the first row, which contains\
    \ the numbers 151,308 and 70,342, the percentages are 58.2% and 27.05%, respectively.\
    \ Those are the height values to assign to the td elements in the row.\n\n```css\n\
    td.hits { height: 58.2%; }\ntd.views { height: 27.05%; }\n```\n\nSimilarly, the\
    \ values for the second row are 53.42% and 27.08%. (Doing all this by hand is\
    \ pain, yes. An automated script would be better. It’s discussed a little later\
    \ in the chapter.)\n\n```css\ntd.hits { height: 53.42%; }\ntd.views { height:\
    \ 27.08%; }\n```\n\nThe same process for all ten rows nets the layout result shown\
    \ in Figure 6-18.\n\nThe bars look a little more step-like, but it’s still hard\
    \ to see the bars. Filling in some colors (see page 9) helps.\n\n```css\ntd.hits\
    \ { background: #4444ED; color: #FFF; }\ntd.views { background: #44ED44; }\n```\n\
    \nThe change makes the bars really easy to see. In fact, even taking out the dotted\
    \ red would result in having almost a good-enough graph as things stand. One big\
    \ problem is the thead and caption elements: their contents are still hanging\
    \ out in the corner. Plus there are a few minor problems, like the bars on the\
    \ left of the graph not spanning the full width, and the tallest bar for 1/14/10\
    \ overlapping the th content.\n\n***227***\n\nAdding in colors makes the bars\
    \ more obvious. First, pull the red outlines and toss in a subtle border along\
    \ the bottom of the whole graph.\n\n```css\ntd {\n  outline: none;\n  display:\
    \ block;\n  position: relative;\n  height: 300px;\n  width: 600px;\n  border:\
    \ 1px solid #999;\n  border-width: 0 0 1px 0;\n  font-family: sans-serif;\n}\n\
    ```\n\n#### 6-20: Cleaning up the header cells\n\nThe dates are out of alignment\
    \ with the bars. That’s because you gave the td elements a left offset, but not\
    \ the th elements. So rewrite that stretch of rules a bit, by assigning width\
    \ and left rules to both th and td elements that descend from the tbody. Do this\
    \ by moving the width: 90%; left: 5%; from the tbody td rule into one of its own.\n\
    \nThis makes the bar widths a little out of place, actually, but centering it\
    \ should make things look nicer (Figure 6-21). If you want to center most of the\
    \ content, you do that at a higher point in the table.\n\n```css\ntr {\n  display:\
    \ block;\n  position: relative;\n  height: 300px;\n  width: 600px;\n  border:\
    \ 1px solid #999;\n  border-width: 0 0 1px 0;\n  font-family: sans-serif;\n  text-align:\
    \ center;\n}\ntbody td {\n  width: 90%;\n  left: 5%;\n  bottom: 0;\n  top: -1.33em;\n\
    }\n```\n\nThe thead and caption which are still cluttering up the top-left corner:\
    \ move the caption below the table, center, and boldface, like so:\n\n```css\n\
    caption {\n  position: absolute;\n  bottom: -1.75em;\n  width: 100%;\n  text-align:\
    \ center;\n  font-weight: bold;\n}\n```\n\n***229***\n\nWe turn the thead into\
    \ the legend for the chart. After all, the information you need is there already.\n\
    \nThe first step is to “un-position” the tr and th elements in the thead. At the\
    \ moment, according to the tr, th, td rule, they’re absolutely positioned. So\
    \ override that by explicitly assigning the default value of static, which basically\
    \ means “not positioned.”\n\n```css\nthead {\n  position: static;\n  padding:\
    \ 0.25em;\n}\n```\n\nAlternatively, you could adjust the tr, th, td rule’s selector\
    \ to read tbody tr, tbody th, tbody td. That would remove the need to “un-position”\
    \ the thead’s descendant, though you’d then have to write thead * {display: block;}\
    \ in order to get the cells stacked on top of each other.\n"
  mdcn: "\n\n***223***\n\n#### Web 流量\n\n| 天 | 访问量 | 浏览次数 |\n| :--- | :--- | :---\
    \ |\n| 1/10/10 | 151,308 | 70,342 |\n| 1/10/11 | 138,887 | 70,410 |\n| 1/10/12\
    \ | 106,563 | 58,383 |\n| 1/10/13 | 117,551 | 64,181 |\n| 1/10/14 | 251,969 |\
    \ 171,790 |\n| 1/10/15 | 213,228 | 134,238 |\n| 1/10/16 | 186,099 | 113,014 |\n\
    | 1/10/17 | 246,637 | 161,287 |\n| 1/10/18 | 210,124 | 135,479 |\n| 1/10/19 |\
    \ 168,413 | 115,541 |\n\n在浏览器中，原始数据看起来如图 6-16 所示。\n\n将表格转换为图表其实非常简单。你只需要将每一天放在合适的位置，然后将表格单元格扩展到所需的高度即可。简单！\n\
    \n也许没那么容易。但正如你所看到的，它并不复杂。首先，设置你将处理的表格。\n\n```css\ntd {\n  outline: 1px dotted\
    \ red;\n  display: block;\n  position: relative;\n  height: 300px;\n  width: 600px;\n\
    \  font-family: sans-serif;\n}\n```\n\n高度和宽度可以是任何一组测量，但像素会让你在后续过程中更容易维护数学部分。不过，请放心，你所做的任何都不会浪费像素。完成后，你可以将这些值更改为任何需要的，直到数据被图表化。outline\
    \ 规则是临时的，仅存在于你在表格中进行定位。\n\n```css\ntd {\n  display: block;\n  position: absolute;\n\
    \  left: 0;\n  bottom: 0;\n  width: 10%;\n  height: 100%;\n}\n```\n\n***225***\n\
    \n`tbody` 行的宽度被设置为 10%，是因为你想让它们并排显示（参见图 6-17）。它们共有 10 行，所以 100%（表格的完整宽度）除以 10\
    \ 等于 10%。\n\n```css\ntr:nth-child(1) { left: 10%; }\ntr:nth-child(2) { left: 20%;\
    \ }\ntr:nth-child(3) { left: 30%; }\ntr:nth-child(4) { left: 40%; }\ntr:nth-child(5)\
    \ { left: 50%; }\ntr:nth-child(6) { left: 60%; }\ntr:nth-child(7) { left: 70%;\
    \ }\ntr:nth-child(8) { left: 80%; }\ntr:nth-child(9) { left: 90%; }\n```\n\n为图表的每个条状图设置容器是相当繁琐的部分：写出每一行的左偏移量。想象一下为整个一个月写这些代码吧！（当然，这就是为什么你会得到一个脚本来为你编写这类内容，而不是手动完成。稍后会进行详细介绍。）\n\
    \n让条状图按要求立起来是真正繁琐的地方，因为每个条的高度都必须计算并分配。要开始之前，需要确定最高值；在这种情况下，它是 251,969。然后选择一个高于该值的值作为图表的最顶端。它可以是\
    \ 260,000；275,000 或 300,000。对于这个例子，采用 260,000。\n\n完成后，接下来将每个值除以该最大值以得到百分比。因此，对于包含\
    \ 151,308 和 70,342 数字的第一行，百分比分别为 58.2% 和 27.05%。这些就是分配给该行中 td 元素的高度值。\n\n```css\n\
    td.hits { height: 58.2%; }\ntd.views { height: 27.05%; }\n```\n\n同样，第二行的值是 53.42%\
    \ 和 27.08%。（手动完成所有这一切是很痛苦的，是的。自动化脚本会更好。在本章稍后的部分会讨论。）\n\n```css\ntd.hits { height:\
    \ 53.42%; }\ntd.views { height: 27.08%; }\n```\n\n对所有十行执行相同的过程将得到如图 6-18 所示的布局结果。\n\
    \n条状图看起来稍微有点阶梯状，但仍然很难看清条状图。添加一些颜色会让条状图变得可见。\n\n```css\ntd.hits { background: #444;\
    \ }\ntd.views { background: #ED; }\n```\n\n***227***\n\n添加颜色让条状图更明显。首先，去掉图表底部的虚线轮廓框。\n\
    \n```css\ntd {\n  outline: none;\n}\n```\n\n#### 6-20: 清理头部单元格\n\n日期与条状图不对齐。这是因为你给\
    \ td 元素设置了偏移量，但没有给 th 元素设置。所以通过将 width: 90%; left: 5% 移动到 tbody td 来解决这个问题。\n\n\
    这让条状图看起来有点偏移，但居中会让情况看起来更好（图 6-21）。如果你想居中大部分内容，可以在表格的更高处这样做。\n\n```css\ntr {\n\
    \  display: block;\n  position: relative;\n  height: 300px;\n  width: 600px;\n\
    \  border: 1px solid #999;\n  border-width: 0 0 1px 0;\n  font-family: sans-serif;\n\
    \  text-align: center;\n}\ntbody td {\n  width: 90%;\n  left: 5%;\n  bottom: 0;\n\
    \  top: -1.33em;\n}\n```\n\nthead 和 caption 仍然堆在右上角：将 caption 移动到表格下方、居中并加粗，如下所示：\n\
    \n```css\ncaption {\n  position: absolute;\n  bottom: -1.75em;\n  width: 100%;\n\
    \  text-align: center;\n  font-weight: bold;\n}\n```\n\n***229***\n\n我们将 thead\
    \ 转换为图表的图例。反正，你需要的信息已经在那里了。\n\n第一步是“取消定位” thead 中的 tr 和 th 元素。目前根据 tr, th, td\
    \ 规则，它们是绝对定位的。所以通过显式分配默认值 static 来覆盖它，这基本上意味着“未定位”。\n\n```css\nthead {\n  position:\
    \ static;\n  padding: 0.25em;\n}\n```\n\n或者，你可以将 tr, th, td 规则的选择器调整为 tbody tr,\
    \ tbody th, tbody td。这样你就不需要取消定位 thead 的后代了，但你将需要编写 thead * {display: block;}\
    \ 来让单元格堆叠在一起。\n\n"
