    ## IMAGE REPLACEMENT


    One of the longest-running design techniques in CSS is that of image replacement.
    This is a technique that allows you to use an image in place of text in such a
    way that the text is available for print, accessibility, and so forth. Image replacement
    (IR) is generally used for small, limited applications, such as company logos,
    page headlines (see Figure 3-9) and on. It is not suitable for replacing entire
    paragraphs of text.


    10/5/10 7:46 PM

    10/5/10 7:46 PM


    The most popular IR technique is known variously as the Phar or Rundle Method.
    (How popular? People made T-shirts about it.) Basically, what you do is sling
    the text way off to the left with negative text indentation:


    ```css

    height: 140px; text-indent: -9999px;

    background: url(page-header.gif);

    ```


    3-9: A heading using image replacement.


    This is in many ways similar to the trick of using absolute positioning to hide
    an entire element well off-screen. Here, instead, we hide the element’s text content
    well off-screen without actually moving the element box anywhere.


    Fortunately, background images are almost never printed. The option to do so exists,
    but the default is to not print backgrounds, and almost nobody ever changes it.
    Thus, in a print style (see the next section for more details), you can simply
    say:


    ```css

    text-indent: 0; background: none;

    ```


    `background: none` is really only a precaution—almost nobody ever has background
    printing enabled. Still, just in case they do, this will prevent the h1 text from
    printing over the background image.


    10/5/10 7:46 PM

    10/5/10 7:46 PM


    The edge case where this sort of replacement fails is when a user has a browser
    with CSS image display disabled, or more commonly, if the image fails to load
    for some reason, the heading will simply disappear, as in Figure 3-10, and not
    be replaced by the background image. There are about a dozen different image-replacement
    techniques, each with its own approach to the problem. Some involve wrapping the
    element’s content in a span and setting its display to off-screen; others have
    you adding an extra image as a background. One technique is worth mentioning here:
    using an image in the content. For example:


    ```html

    <h1><img src="page-header.gif" alt="Dive Into Fishing"></h1>

    ```


    The image will show up both on-screen and in print, since browsers do print. It
    will also be very friendly to screen readers, which know to use the alt text.
    It does, again, fall down if the user has suppressed the loading of images, though
    in cases where images are enabled but the image fails to load, the text should
    be shown in the image’s place.


