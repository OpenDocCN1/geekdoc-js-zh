    1-17: IE 开发者工具栏演示。


    工具栏的一个优秀特性是，你可以通过“显示默认样式值”（Show Default Style Values）复选框（图 1-18）轻松地在显示计算样式和仅显示样式之间切换。


    同样，你可以使用“显示只读属性”（Show Read-Only Properties）来显示受影响元素 DOM（文档对象模型）属性的每一个细节。如果你不熟悉
    JavaScript 和 DOM 脚本，那么这可能不适合你。（对我来说肯定也不适合。）


    禁用了“显示默认样式”的 IE 开发者工具栏。


    IE 开发者工具栏包含了 Web 开发者工具栏的部分功能，但最实用的功能（如勾轮元素、验证本地 HTML 和 CSS）出现在“元素”（Elements）层中。视图还有一个非常实用的入口叫做“CSS
    选择器匹配”（CSS Selector matches）（见图 1-19）。


    它会打开一个窗口，显示 CSS 中的所有规则，以及每个选择器匹配文档中元素的次数。任何显示“0 次匹配：”（0 match(es) for:）的规则都没有匹配页面，你应该考虑删除该规则。


    ***21***


    1-19: 选择器匹配报告。


    IE 开发者工具栏内置了开发者工具，因此你不需要安装任何额外内容。文档是线上的，而且在编写本文时，它所在的 URL 比工具栏的 URL 稍微没那么难懂。所以，只需在你喜爱的搜索引擎中输入“Discovering
    Internet Explorer Developer Tools”，就能通过顶部搜索结果找到它。


    要打开工具，请在 IE 的“工具”菜单中选择“开发者工具”（图 1-20 所示），或者按下键盘上的 F12。是的，就是这样。你得到的是与 IE 开发者工具栏非常的东西，换句话说，它是
    Firebug 和 Web 开发者工具栏的混合体。标签大部分与 IE7 工具栏相同，但下方的标签更像 Firebug 而不是 IE7 工具栏。


    IE8 中的开发者工具。


    我个人觉得开发者工具的“样式”（Style）标签中令人困惑的一点是，样式的顺序对我来说并不符合逻辑。它显然不是按优先级排序的。列表确实显示了哪些声明被其他声明覆盖，但由于缺乏
    Firebug 那种合理的排序，处理起来会更困难。


    虽然工具栏和工具并没有涵盖 Web 开发者工具栏的所有功能，但它们非常有用，并且理应该是任何 Internet Explorer 安装程序的一部分，用于追踪其他奇异问题。


    AGONFLY（针对 OPERA）


    如果你使用的开发浏览器是 Opera，那么你将想要使用 Dragonfly，这是一个内置在 Opera 9.5 及更高版本中的开发环境。访问 opera/dragonfly
    获取更多信息。


    ***23***


    要打开 Dragonfly，默认路径是下拉“工具”菜单，然后在“高级”（Advanced）下选择“开发者工具”。然而，你可以通过访问 opera/dragonfly
    并找到安装链接来安装“调试”（Debug）菜单。安装完成后，就可以轻松打开 Dragonfly 以及该菜单中的若干功能了。无论哪种方式，你都可以按 Option+Command+I（Mac
    用户）或 Option+Control+I（Windows 用户）来调它。一个异常情况是这个键盘快捷键不是切换键：如果 Dragonfly 已经打开，你无法用键盘关闭它。这时，你需要使用鼠标，或者使用
    Command+W (Control+W) 关闭它。如果 Dragonfly 在单独窗口中打开，这种方法效果很好。但如果 Dragonfly 停靠在浏览器窗口中，只有当你通过点击其内部内容使其获得焦点时，Command+W
    才会关闭 Dragonfly。否则，它会关闭整个窗口。


    调试菜单的另一个功能是它有直接指向 HTML、CSS 和其他配置的链接。另一个有趣的区域是“布局”（Layout）子菜单，它可以让你设置 Opera 的布局模式，如“模拟文本浏览器”和“显示结构元素”。甚至还有一个“怀旧”模式（图
    1-22 所示），它会让任何 1980 年代计算领域的老兵感到暖心。


    21: 怀旧视图下的 Dragonfly 页面。


    尽管 Dragonfly 的布局与 Firebug 非常相似，但仍有一些显著差异。首先，右侧的“样式”标签可以显示计算样式以及声明的样式（见图 1-23），并且每个分组都可以展开或收起。因为，你在这里看到的并不完全是声明的内容，简写属性被拆分成了单独的属性。一个很棒的细节是，如果你想查看属性，Dragonfly
    会为你显示它们——至少在计算样式中。与 Firebug 的一个欢迎区别是，任何被覆盖的声明都会变灰，并在旁边带有橙黄色的 [overwritten] 文字（见图
    24）。这会让界面变得杂乱，并且更难看到覆盖样式中的值。


    ***25***


    23: 使用“计算”分组的 Dragonfly。


    24: “样式”标签中显示的被覆盖样式。


    25: “布局”标签。


    除了显示正在检查的元素的布局框尺寸外，它还会告诉你各种属性，如 offsetTop 和 scrollLeft。


