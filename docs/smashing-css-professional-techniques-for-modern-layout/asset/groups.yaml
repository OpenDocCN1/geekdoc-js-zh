    ***63***


    css

    li {list-style-type: upper-alpha;}```


    2-16: Selecting only the list items that are children of an ordered-list element.


    The greater-than symbol > limits the selection to children of ol elements. Take
    it away, and the will apply to any list item that descends from an ol, even if
    those are list items in nested ordered lists (see Figure 2-17).


    2-17: Ordering the unordered.


    That can happen, and no, I didn’t cheat. Figure 2-17 is an unordered list with
    ordered list markers, and that happened simply because I removed the child combinator.


    ## SIMULATED PARTIAL CHILD SELECTION


    If you have to support old browsers like IE6 that don’t support the child combinator
    and you aren’t willing to rely on JavaScript to add support to those browsers
    (see “IE9.js” in Chapter 1), you can simulate child selection via the universal
    selector.


    Suppose we want to put a border around any div that’s a child of a div with an
    id of main (see Figure 2-18). The child-combinator way is to say:


    ```css

    div > div {border: 1px solid gray;}

    ```


    How do we simulate that effect without child selection? Like this:


    ```css

    div ~ div {border: 1px solid gray;}

    div ~ div {border: 0;}

    ```


    The ~ rule selects any div that descends from any element that descends from a
    div of main. In effect, it undoes the effect of the first rule. Both apply to
    divs that are direct children of div#main, and both are setting the borders, so
    they’re in conflict. To the same specificity, so the last one declared wins. The
    divs of div#main are only selected by the first of the two rules, so the borders
    stay in place.


    One thing to keep very much in mind: This “faked” child-selection technique works
    really well with non-inherited properties. With inherited properties you can create
    some unintended effects. As an example, suppose you wrote:


    ```css

    ul {font-weight: bold;}

    li {font-weight: normal;}

    ```


    Suppose that you have a situation where you want the unordered lists of a certain
    class to be boldfaced (see Figure 2-19):


    ```css

    ul {font-weight: bold;}

    ```


    With an additional rule, the list items in those unordered lists will be … not
    boldfaced. The ol * li rule shown previously directly applies to those list items.
    Its assigned font-weight value of normal overrides the bold value that would ordinarily
    inherit from the ol rule.


    ***65***


    2-19: Inherited styles being overridden by directly assigned styles.


    The problem doesn’t come up if you use non-inherited properties like background,
    color, display, margin, padding, and so on. If you aren’t clear about whether
    a given property is inherited, see w3.org/TR/CSS2/properties.html or the property’s
    description in the CSS specification.


    ## SIBLING SELECTION


    In addition to being able to select along parent-child and ancestor-descendant
    lines, it’s also possible to select elements based on their being siblings—that
    is, that they share a common parent. We can see this in Figure 2-20, where the
    elements that are siblings are highlighted.


    2-20: Highlighted siblings.


    Elements like list items are obvious siblings, but any collection of elements
    that share a common parent element are siblings.


    The + symbol defines a combinator that allows you to select an element based on
    its previous sibling. For example, if you wanted to remove the top margin from
    any paragraph that immediately follows an h1 (see Figure 2-21), then it’s a simple
    matter of saying:


    ```css

    h1 + p {margin-top: 0;}

    ```


    The ~ combinator is a great way to set up styles for certain element combinations,
    such as the space between a list that immediately follows a table or a heading.
    The ~ combinator allows the selection of elements that are following but not immediately
    following siblings. For example:


    ```css

    h2 ~ ul {list-style-type: lower-alpha;}

    ```


    If those elements share the same parent (the body), they’re all siblings. The
    first list does not follow an h1, so it is not selected by h1 ~ ul. The rest,
    even other elements between them, are selected.


    ## GENERATING CONTENT


    That blurs the usual line between content and presentation, CSS offers a way to
    generate content and insert it into the document. This is done using the pseudo-elements
    :before and :after and the property content. Here’s a basic example (also illustrated
    in Figure 2-22) of generating content, putting a little content in front of the
    text of any list item:


    ```css

    li:before {content: "Item: "; border-bottom: 1px solid gray;}

    ```


    Note that the space inside the content value is inserted as part of the value
    string. If it were there, the element text would be closer to the generated content
    unless a right padding applied to the generated content (which is completely possible;
    we just didn’t do it here).


    Clear, you can insert only text, not structure. If you try to put markup into
    your content value, it will be passed into the page as raw text (see Figure 2-23).


    ```css

    li:before {content: "<em>Item:</em> "; border-bottom: 1px solid gray;}

    ```


    On the other hand, you can insert any character glyph the browser is capable of
    supporting. All you need is to know its hexadecimal character number. Precede
    it with a backslash, otherwise known as anescape,” and you’re set.


    ```css

    li:before {content: "\2012 "; border-bottom: 1px solid gray;}

    ```


    You could also insert any Unicode character into your document by typing the directly
    into your CSS and then serving up the style sheet with full Unicode support. However,
    this may run into problems with servers that aren’t configured to send anything
    but ASCII. If you can overcome those kinds of problems, then you can use the escaped-hex
    approach and just use the characters directly. Test thoroughly, though, in older
    browsers that may not handle Unicode gracefully.


    The reason :before and :after are pseudo-elements is that they insert the element
    as if it were enclosed in an element. This pseudo-element is placed either at
    the very or end of the element’s content, depending on which pseudo-element you
    used. You can style it much as you would a span in the same place.


    There are a lot of interesting things with generated content, but you have to
    be careful about generating. What happens to your page if CSS doesn’t load or
    isn’t supported, as on mobile devices? If you’re using generated content to insert
    things that are crucial to the reading of the page, then you could have real trouble
    if the content isn’t generated. It is strongly recommended that you use only generated
    content in the service of what’s aggressive enhancement, where you use advanced
    features to add enhancements that you can live without.

