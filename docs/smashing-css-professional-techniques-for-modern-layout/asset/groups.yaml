    \ 来选择所有标题，而不是 `h1, h3, h4, h5, h6`。抱歉，不是的。它不是这样运作的。你可以像之前那样将它作为元素的通配符匹配。仅此而已。\n\
    \n任何有抱负的 Web 样式师面临的首个问题都是：我应该使用 class 还是 id？就像生活中的事情一样，这个问题有一个简单的答案，然后有一个更复杂的答案。简单的答案是：使用\
    \ class 用于任何可能在页面中出现一次的“标签”，使用 id 用于任何只会出现一次的内容。我所说的“标签”是指你可能附加到元素上的单词，这是 class\
    \ 和 id 占占 44% 的情况。典型的 id 值示例是 `header` 和 `footer`，前提是任何页面只有一个 header 和 footer。class\
    \ 值则分散得多，可以是从链接到更多信息，到任何导航选项卡，到表格中的每一行。复杂的答案不仅需要权衡标签的唯一性，还需要考虑 id 和 class 的优先级影响。由于包含\
    \ id 的选择器优先级高于仅包含 class 的选择器，你会遇到无法通过单一规则解决的情况。一个简单的示例。假设你在站点样式中写了：\n\n```css\n\
    body { background: black; }\na { color: white; }\n```\n\n当你决定你的联系页面应该不那么令人生畏，所以你想让\
    \ header a 变成漂亮的浅灰色，让所有的导航链接 a 变成中灰色，你写道：\n\n```css\n.contact { background: #BBB;\
    \ }\n.contact a { color: #257000; }\n```\n\n不幸的是，头部的导航链接将保持白色，这归于 `header a` 更高的优先级，如图\
    \ 2-8 所示。\n\n2-8：头部不好看的链接。\n\n可以通过这种方式来解决问题：\n\n```css\nheader a, .navlinks a\
    \ { color: #257000; }\n```\n\n甚至：\n\n```css\nheader .navlinks a, .navlinks a {\
    \ color: #257000; }\n```\n\n任何方法都有效，但它们看起来有点笨拙，不是吗？（虽然不像在 `.navlinks a` 规则上强加\
    \ `!important` 标签那么笨拙，但仍然如此。）处理这种情况的另一种方法是在标记中将包含 `header` 的 `id` 转换为 `class`。所以你有：\n\
    \nclass=\"header\">\n\n那么你就不必那么担心 ID 创建难以解决的优先级冲突了。\n\n如图 2-9 所示。\n\n"
