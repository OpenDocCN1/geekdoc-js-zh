- md: "\n***191***\n\n5-44: The intended result of flowing text along a curve.\n\n\
    Seems impossible at first glance, right? It’s actually really simple. All you\
    \ have to do is slice the curve up into a stack, and then float all the images.\
    \ Create 20-pixel-tall slices of the curve make sure they have transparent areas\
    \ beyond the curve (see Figure 5-45).\n\n5-45: The curve with slicing guides.\n\
    \neach slice is just wide enough to contain the visible portion of the curve,\
    \ and not toss those slices into the markup right before the point where you want\
    \ the curve to end:\n\n```html\n<div class=\"curves\">\n  <img src=\"curve_1.gif\"\
    \ alt=\"\">\n  <img src=\"curve_2.gif\" alt=\"\">\n  <img src=\"curve_3.gif\"\
    \ alt=\"\">\n  <img src=\"curve_4.gif\" alt=\"\">\n  <img src=\"curve_5.gif\"\
    \ alt=\"\">\n</div>\n```\n\nMore slices means more img elements, but you get the\
    \ idea. The CSS is then really:\n\n```css\nimg {float: left; clear: left; margin-right:\
    \ 1em;}\n```\n\nThis keeps the text from getting too close to the slices, and\
    \ can be adjusted as needed. To add a temporary border to the images, as shown\
    \ at the top left of Figure 5-46, you can:\n\n```css\nimg {border: 1px solid red;}\
    \ /* temporary */\n```\n\n5-46: the curve slices with borders turned on for visualization.\n\
    \n***193***\n\nThis technique isn’t limited to simple curves, either. Any irregular\
    \ shape (such as the curve illustrated in Figure 5-47) can have text flowing over\
    \ its peaks and into its valleys (see Figure 5-47) by taking the same approach.\n\
    \n5-47: The more complex curve with slicing guides.\n\nCSS used for this version\
    \ of the technique is exactly the same as with the curve. Only the shapes have\
    \ changed.\n\nNote of caution: The more radical the changes in slice width from\
    \ one slice to the next, more likely it is that you’ll have overlap between text\
    \ and image. This can happen because browsers don’t test every pixel along the\
    \ edge of a line box to see if it’s overlapping a floated element. For example,\
    \ they might only test the top-left corner of the box. If that’s just a couple\
    \ pixels above a much wider floated image, then the text in that line will overlap\
    \ that wider image.\n\n5-48: the ragged float in a browser.\n\nCreating all those\
    \ slices is kind of annoying, and geez, what about the server-side version of\
    \ this, which the next section explains?\n\n## RAGGED FLOATS\n\nIn the “ragged\
    \ float” technique explained in the preceding section, Nilesh Chaudhari came up\
    \ with what he called “Super Ragged Floats” in the Evolt article of the same name\
    \ (www.evolt.org/article/Super_Ragged_Floats/22/50410/). Nilesh suggested that\
    \ rather than slice up the image, you could put it in the background and lay div\
    \ boxes overtop of it. The drawback of his approach was that it required you to\
    \ have an enclosing div around both the floated slices and the content that accompanied\
    \ the markup from the preceding section.\n\nBuilding on Nilesh’s building on the\
    \ original, here’s a variant that lets you have little bits of markup to create\
    \ the curves and ragged outlines. Suppose you convert all those images into the\
    \ original, unsliced version of the curve image (see Figure 5-49).\n\n```html\n\
    <div class=\"curves\">\n  <div id=\"sl1\"></div>\n  <div id=\"sl2\"></div>\n \
    \ <div id=\"sl3\"></div>\n  <div id=\"sl4\"></div>\n  <div id=\"sl5\"></div>\n\
    </div>\n```\n\n5-49: The original, unsliced version of the curve image shown in\
    \ Photoshop.\n\n***195***\n\nAt this point, you have everything you need to curve\
    \ the flow of text. It just takes some sizing and background positioning in the\
    \ CSS (see also Figure 5-50):\n\n```css\ndiv {float: left; clear: left; margin-right:\
    \ 20px; height: 20px; width: 0; background: url(curve.png) no-repeat;}\n#sl1 {width:\
    \ 42px; background-position: 0 -20px;}\n#sl2 {width: 21px; background-position:\
    \ 0 -40px;}\n#sl3 {width: 10px; background-position: 0 -60px;}\n#sl4 {width: 5px;\
    \ background-position: 0 -80px;}\n```\n\n5-50: The curve placed into the browser\
    \ using background positioning.\n\nYou could also do those things with inline\
    \ CSS, if you were so inclined. That would need for all the ID rules and indeed\
    \ the IDs themselves, leaving you with only yours to retain. On the other hand,\
    \ you’d have a bunch of CSS cluttering your HTML. Choose wisely.\n\nYou aren’t\
    \ limited to having all your divs be the same height. If the curve’s well curvy,\
    \ you can stretch the div to the proper height. You can plan for this by drawing\
    \ out the curve in your image-editing program beforehand. Figure 51 depicts the\
    \ boxes that can then be copied directly to your document.\n\n```html\n<div class=\"\
    curves\">\n  <div id=\"sl1\" style=\"width: 8px; height: 40px; background-position:\
    \ 0 -260px;\"></div>\n  <div id=\"sl2\" style=\"width: 25px; height: 20px; background-position:\
    \ 0 -240px;\"></div>\n  <div id=\"sl3\" style=\"width: 50px; height: 15px; background-position:\
    \ 0 -225px;\"></div>\n  <div id=\"sl4\" style=\"width: 75px; height: 15px; background-position:\
    \ 0 -210px;\"></div>\n  <div id=\"sl5\" style=\"width: 92px; height: 20px; background-position:\
    \ 0 -190px;\"></div>\n  <div id=\"sl6\" style=\"width: 97px; height: 15px; background-position:\
    \ 0 -175px;\"></div>\n  <div id=\"sl7\" style=\"width: 100px; height: 50px; background-position:\
    \ 0 -125px;\"></div>\n  <div id=\"sl8\" style=\"width: 97px; height: 15px; background-position:\
    \ 0 -110px;\"></div>\n  <div id=\"sl9\" style=\"width: 92px; height: 20px; background-position:\
    \ 0 -90px;\"></div>\n  <div id=\"sl10\" style=\"width: 75px; height: 15px; background-position:\
    \ 0 -75px;\"></div>\n</div>\n```\n\n5-51: The flow boxes as visualized in Photoshop.\n\
    \n***197***\n\n## GET YOUR IMAGES\n\nSomething that most people don’t realize\
    \ about images: they have the same box model as any element. That means you can\
    \ apply things like backgrounds and padding to an image with transparent parts.\n\
    \nWould you bother? Well, one example is a method of filling colors into the background\
    \ icon with transparent parts. It goes something like this (see also Figure 5-53):\n\
    \n```css\nimg {background-color: #826;}\nimg:hover {background-color: #C40;}\n\
    ```\n\nThe wave dropped into place using the various divs. You can drop images\
    \ into the backgrounds of images, as in Figure 5-54, which can make unexpected\
    \ combinatorial effects in both the hovered and unhovered states.\n"
  mdcn: "\n\n***191***\n\n5-44: 文字沿曲线流动的预期效果。\n\n初看之下似乎不可能，对吧？实际上非常简单。你所做的就是将曲线切割成一叠，然后让所有图片浮动。创建高度为\
    \ 20 像素的曲线切片，确保它们在曲线之外有透明区域（见图 5-45）。\n\n5-45: 带有切分引导线的曲线。\n\n每个切片的宽度仅恰好能包含曲线的可见部分，并在你想要曲线结束的地方之前，将这些切片放入标记语言中：\n\
    \n```html\n<div class=\"curves\">\n  <img src=\"curve_1.gif\" alt=\"\">\n  <img\
    \ src=\"curve_2.gif\" alt=\"\">\n  <img src=\"curve_3.gif\" alt=\"\">\n  <img\
    \ src=\"curve_4.gif\" alt=\"\">\n  <img src=\"curve_5.gif\" alt=\"\">\n</div>\n\
    ```\n\n切片越多，`img` 元素就越多，但你明白意思了。CSS 部分实际上是：\n\n```css\nimg {float: left; clear:\
    \ left; margin-right: 1em;}\n```\n\n这可以防止文字离切片太近，并根据需要进行调整。要为图片添加临时边框（如图 5-46\
    \ 左上角所示），你可以：\n\n```css\nimg {border: 1px solid red;} /* temporary */\n```\n\n\
    5-46: 开启边框以便可视化的曲线切片。\n\n***193***\n\n这种技术也不限于简单的曲线。通过相同的方法，任何不规则的形状（例如图 5-47\
    \ 所示的曲线）都可以让文字流过它的峰值并进入它的谷底（见图 5-47）。\n\n5-47: 带有切分引导线的更复杂的曲线。\n\n用于此版本技术的 CSS\
    \ 与处理曲线时使用的完全相同。只是形状发生了变化。\n\n注意：相邻两个切片之间的宽度变化越剧烈，文本与图像之间发生重叠的概率就越大。这是因为浏览器不会测试沿行框边缘的每一个像素来检查它是否与浮动元素重叠。例如，它们可能只测试框的左上角。如果该点仅比一张宽得多的浮动图片上方几个像素，那么该行中的文本就会重叠那张较宽图片。\n\
    \n5-48: 浏览器中的锯齿浮动。\n\n创建所有这些切片有点麻烦，而且，下一节将解释的服务器端版本又是怎样的呢？\n\n## 锯齿浮动 (RAGGED\
    \ FLOATS)\n\n在上一节解释的“锯齿浮动”技术中，Nilesh Chaudhari 在同名的 Evolt 文章中提出了他所说的“超级锯齿浮动”（www.evolt.org/article/Super_Ragged_Floats/22/50410/）。Nilesh\
    \ 建议，与其切割图像，不如将其放在背景中，并在上方覆盖 `div` 框。他的这种方法的缺点是，它需要你将浮动切片和随前一节标记语言出现的内容包裹在一个共同的\
    \ `div` 中。\n\n在 Nilesh 对原始方案改进的基础上，这里有一个变体可以让你使用少量的标记来创建曲线和锯齿轮廓。假设你将所有这些图像转换为原始的、未切割的曲线图像（见图\
    \ 5-49）。\n\n```html\n<div class=\"curves\">\n  <div id=\"sl1\"></div>\n  <div\
    \ id=\"sl2\"></div>\n  <div id=\"sl3\"></div>\n  <div id=\"sl4\"></div>\n  <div\
    \ id=\"sl5\"></div>\n</div>\n```\n\n5-49: 在 Photoshop 中显示的原始、未切割的曲线图像。\n\n***195***\n\
    \n此时，你已经拥有了使文本流曲线所需的一切。只需要在 CSS 中进行一些尺寸设置和背景定位（见图 5-50）：\n\n```css\ndiv {float:\
    \ left; clear: left; margin-right: 20px; height: 20px; width: 0; background: url(curve.png)\
    \ no-repeat;}\n#sl1 {width: 42px; background-position: 0 -20px;}\n#sl2 {width:\
    \ 21px; background-position: 0 -40px;}\n#sl3 {width: 10px; background-position:\
    \ 0 -60px;}\n#sl4 {width: 5px; background-position: 0 -80px;}\n```\n\n5-50: 使用背景定位将曲线置于浏览器中。\n\
    \n如果你有兴趣，也可以通过内联 CSS 完成这些工作。但这需要为所有的 ID 规则以及 ID 本身编写代码，让你只剩下保留自己的部分。另一方面，你的 HTML\
    \ 中会出现大量的 CSS 杂乱。请明智选择。\n\n你并不限于让所有的 `div` 高度相同。如果曲线足够弯，你可以将 `div` 拉伸到合适的高度。你可以通过先在图像编辑程序中画出曲线来规划此。图\
    \ 51 描述了可以直接复制到你的文档中的框。\n\n```html\n<div class=\"curves\">\n  <div id=\"sl1\"\
    \ style=\"width: 8px; height: 40px; background-position: 0 -260px;\"></div>\n\
    \  <div id=\"sl2\" style=\"width: 25px; height: 20px; background-position: 0 -240px;\"\
