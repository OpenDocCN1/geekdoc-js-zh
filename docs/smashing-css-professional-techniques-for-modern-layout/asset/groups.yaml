    - 1-7: The Layout tab.

    - 1-8: Editing CSS on the fly in the Style tab.


    of warning: When you’re inspecting an element’s CSS in the Style tab, you will
    not see pseudo-element–driven rules that affect that element. As an example, if
    you have the selector p:first-letter, that rule won’t appear when you’re inspecting
    a p element. Pseudo-classes will show up, but pseudo-elements won’t. This can
    be especially annoying if you’re using a clearfix solution that involves generated
    content (see “Clearfixing,” page 4, for more).


    If you’re using Firefox for development but want to get Firebug’s essential goodness,
    go to firebug.com/lite.html (shown in Figure 1-9) and follow the instructions
    for Internet Explorer, Opera, or Safari, as fits your situation. You can link
    it into a browser of whichever you’re testing, or add it to your bookmark bar
    as a bookmarklet (which I recommend).


    Firebug Lite running in Internet Explorer isn’t as full-featured as the Firefox
    extension—thus the “Lite” version—but it’s still quite powerful and useful.


    ## WEB DEVELOPER TOOLBAR


    In addition to Firebug, the Web Developer Toolbar (WDT) is the other essential
    tool in any creator’s toolbox. It’s a completely free extension to the completely
    free Firefox. To get your copy, go to chrispederick.com/work/web-developer and
    install it. Alternatively, you can go to addons.mozilla.org, search for Web Developer
    Toolbar, and install it all from the WDT page there (see Figure 1-10).


    1-10: The Web Developer toolbar page at **addons.mozilla.org**.


    With Firebug, there’s no way I can cover everything the WDT is capable of doing;
    in fact, a whole chapter would not be enough. Here are some highlights from selected
    menus, but of course you should take the time to explore all the menus and options
    available to you after you installed WDT.


    The CSS menu can disable caching of the page, which is useful if you’re doing
    a lot of tiny updates and browser cache is getting sticky. You can also turn off
    JavaScript (see Figure 1-11), which is useful for finding out what happens to
    a page when all the scripted goodness breaks, or your Script framework doesn’t
    load.


    The CSS menu styles are covered by Firebug, but one thing that’s pretty nice is
    the ability to switch off just the embedded styles, or just the linked styles
    (as shown in Figure 1-12), or inline styles (Not that you should be using styles!).
    You can even kill the browser’s built-in styles if you want to see things get
    freaky.


    The Information menu (Figure 1-13) contains tons of interesting tidbits, including
    showing ID information in the document; an accounting of the page’s div order;
    colors used in the page; and more. You can also invoke an element that lets you
    click on any element to view a summary of its attributes and font information,
    its ancestor and descendant elements, and it is fairly similar to XRAY in what
    it tells you; more on XRAY.


    1-12: Disabling linked stylesheets via the CSS menu.

    1-13: Displaying class and ID values via the Information menu.


    The Outline menu, depicted in Figure 1-14, you can outline classes of elements—all
    lines, all links, all positioned elements, all table cells, and so forth—as well
    as set customized collection of elements and colors. You can also choose whether
    the names will be displayed on the page while they’re outlined. This is a much
    more menu than it might first seem. I think of it as the Layout Diagnostic menu,
    because I outline sets of elements in order to quickly see how they’re laying
    out in relation to each other and where things might have gone wrong.


    Outlining and identifying block elements via the Outline menu gives you quick
    access to a number of validators, error checkers, and debug-gers. One of its best
    features, though, is the presence of the Validate Local HTML and Validate Local
    CSS items (see Figure 1-15). In both cases, the page you’re currently viewing
    is packed into a serialized string and shipped off to the relevant validator.
    So, if you date Local HTML, the markup of the page will be sent to the HTML validator,
    and back a report. This is great for validating pages being served from behind
    a firewall, machine’s hard drive—that is, pages that are not on the public Web,
    and therefore not accessible by the validator service. With local validation,
    that’s no longer an issue.


    1-15: The Tools menu.


    Once you have reached the IE Developer Toolbar, you get a Firebug-ish panel opening
    at the browser window, as shown in Figure 1-17. There are also some Web Developer
    menus across the top of the panel. You can spawn the whole thing into its own
    window clicking the little “two windows” icon in the upper-right corner of the
    panel, next to the close button. Expanding the panel in this manner can be particularly
    valuable in presentation settings like netbook displays and overhead projectors.

