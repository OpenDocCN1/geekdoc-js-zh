- md: "\nstyles, none of the background images would be repeated, because the single\n\
    \nis applied to all the backgrounds that are assigned to the element. The only\n\
    \nhad to write out all the repeat values before was that the first four have one\
    \ value it\n\nhad another.\n\nwere to write two values for background-repeat?\n\
    \n```css\n{\n  background-repeat: no-repeat, repeat-y;\n  background-image: url(bg01.png),\
    \ url(bg02.png), url(bg03.png), url(bg04.png);\n  background-position: top left,\
    \ top right, bottom right, bottom left;\n  background-color: #FFF;\n}\n```\n\n\
    so, the first and third images would not be repeated, whereas the second and fourth\n\
    \nwould be repeated along the y axis. With three repeat values, they would be\
    \ applied to\n\nsecond, and third images, respectively, whereas the fourth image\
    \ would take the first\n\none.\n\n## TRANSFORMS\n\never wanted to rotate or skew\
    \ an element, border, and text and all, then this section\n\nis for you.\n\nHowever,\
    \ a word of warning: In order to keep things legible, this section uses the unprefixed-version\
    \ of the transform property. As of this writing, doing transforms in a browser\n\
    \nwould require multiple prefixed declarations, like so:\n\n```css\n-webkit-transform:\
    \ ...;\n-moz-transform: ...;\n-o-transform: ...;\ntransform: ...;\n```\n\nwill\
    \ cease to be necessary in a year or two (I hope!) but in the meantime, keep in\n\
    \nmind that as you read through this section that it’s been boiled down to the\
    \ unprefixed version for\n\ntransforming! Possibly the simplest transform to understand\
    \ is rotation (see\n\nFigure 7-31). (In the next and subsequent figures, the dashed\
    \ red lines indicate where the\n\noriginal elements were placed before their transformations.)\n\
    \n```css\n{\n  transform: rotate(33.3deg);\n}\n{\n  transform: rotate(-90deg);\n\
    }\n```\n\n7-31: Rotated element boxes. The red dashes show the original placement\
    \ of the elements before their rotation.\n\nsense, transforming is a lot like\
    \ relative positioning: The element is placed normally and\n\ntransformed. You\
    \ can transform any element at all, and in the case of rotation can use\n\nreal-number\
    \ amount of degrees, radians, or grads to specify the angle of rotation. If\n\n\
    you have ever wanted to rotate your blog by e radians or 225 grads, well, now’s\
    \ your chance.\n\nyou no doubt noticed, the boxes in the preceding example were\
    \ rotated around their\n\ncenters. That’s because the default transformation origin\
    \ is 50% 50%, or the center of the\n\nelement. You can change the origin point\
    \ using transform-origin (see Figure 7-32).\n\n```css\n1 {transform: rotate(33.3deg);\
    \ transform-origin: bottom left;}\n2 {transform: rotate(-90deg); transform-origin:\
    \ 75% 0;}\n```\n\nelements rotated around points other than their centers.\n\n\
    First, negative angles can be equivalent to positive angles. Thus, 270deg is\n\
    \nequivalent to –90deg in the final positioning of the element, just as 0deg and\
    \ 360deg are\n\nequivalent.\n\nSecond, you can specify angles greater than the\
    \ apparent maximum value. If you\n\ndeclare 450deg, the element’s final rotation\
    \ will look exactly the same as if you’d declared\n\n90deg as well as –180deg,\
    \ 900deg, and so on). The interim result may be different if you\n\nuse transitions\
    \ (see next section), but the final “resting” state will be equivalent.\n\nas\
    \ simple as rotation is scaling, an example of which is depicted in Figure 7-33.\
    \ As you\n\nexpect, this scales an element up or down in size, making it larger\
    \ or smaller. You can\n\nscale consistently along both axes, or to a different\
    \ degree along each axis.\n\n```css\n{\n  transform: scale(0.5);\n}\n{\n  transform:\
    \ scale(0.75, 1.5);\n}\n```\n\n7-33: Scaled elements.\n\nscale() value means the\
    \ element will be scaled by that amount along both the x and y. If there are two\
    \ values, the first specifies the horizontal (X) scaling, and the second, the\
    \ vertical (Y) scaling. Thus, if you want to leave the horizontal axis the same\
    \ and only scale on y axis, do this:\n\n```css\n1 {transform: scale(0.5);}\n2\
    \ {transform: scale(1, 1.5);}\n```\n\nAlternatively, you can use the scaleY()\
    \ value.\n\n```css\n1 {transform: scale(0.5);}\n2 {transform: scaleY(1.5);}\n\
    ```\n\nRegardless of which particular path you choose, Figure 7-34 is the end\
    \ result. To leave the horizontal the same is the scaleX() value, which causes\
    \ horizontal scaling without affecting the vertical scaling (see Figure 7-35).\n\
    \n```css\n1 {transform: scaleX(0.5);}\n2 {transform: scaleX(1.5);}\n```\n\ntwo\
    \ scaled elements, one scaled only on the Y axis. Two scaled elements, one scaled\
    \ only on the X axis.\n\nwriting CSS yourself, it seems most convenient to just\
    \ stick with scale() and fill in the horizontal any time you want a purely vertical\
    \ scaling. If you’re programmatically scaling the scaling via DOM scripting, it\
    \ might be easier to manipulate scaleX() and scaleY() directly. With rotation,\
    \ you can affect the origin point for scaling. This allows you, for example, to\
    \ scale an element toward its top-left corners instead of shrink down toward its\
    \ center (Figure 7-36).\n\n```css\n1 {transform: scale(0.5); transform-origin:\
    \ top left;}\n2 {transform: scale(1.5); transform-origin: 100% 100%;}\n```\n\n\
    7-36: Two scaled elements, each with a different scaling origin.\n\nSimilarly\
    \ simple translation. In this case, it isn’t changing the language from one to\
    \ another, “translating” a shape from one point to another, as in Figure 7-37.\
    \ It’s an offset by either or two length values.\n\n```css\n1 {transform: translate(50px);}\n\
    2 {transform: translate(5em,10em);}\n```\n\ntranslated elements. Translation is\
    \ very much like relative positioning. The elements are placed normally and then\
    \ moved as directed. If there’s one length value in a translate() value, it specifies\
    \ a horizontal and the vertical movement is assumed to be zero. If you just want\
    \ to translate an element down, you have two choices. First is to simply give\
    \ a length of 0 for the horizontal value.\n\n```css\n1 {transform: translate(0,50px);}\n\
    2 {transform: translate(5em,10em);}\n```\n\nSecond is to use the value pattern\
    \ translateY():\n\n```css\n1 {transform: translateY(50px);}\n2 {transform: translate(5em,10em);}\n\
    ```\n\nyou get Figure 7-38 as a result using a translateX(), which does about\
    \ what you’d expect: moves the element horizontally. While you can declare a transform-origin\
    \ in cases where you’re just translating, it doesn’t matter all that much whether\
    \ you do so. After all, whether an element’s center or top-left corner is pushed\
    \ 50 pixels to the right doesn’t really matter. The element will end up in the\
    \ same place either way. But that’s only true if all you’re doing is translating.\
    \ If you do anything at the same time, like rotate or scale, then the origin will\
    \ matter. (More on combining transforms in a bit.)\n\ntype of transformation,\
    \ skewing is slightly more complex, although the method of shearing it is no more\
    \ difficult than you’ve seen so far. Skewing an element distorts its shape along\
    \ one or both axes (see Figure 7-39).\n\n```css\n1 {transform: skew(23deg);}\n\
    2 {transform: skew(13deg,-45deg);}\n```\n\nu provide only a single value for skew(),\
    \ then there is only horizontal (X) skew, and no vertical (Y) skew. As with translations\
    \ and scaling, there are skewX() and skewY() values whose times you want to explicitly\
    \ skew along only one axis (see Figure 7-40).\n\n```css\n1 {transform: skewX(-23deg);}\n\
    2 {transform: skewY(45deg);}\n```\n"
  mdcn: "\n在样式中，没有任何背景图像会被重复，因为单个\n\n被应用于分配给该元素的所有背景上。之前必须写出所有重复（repeat）值的原因是，前四个值都有一个值，它\n\
    \n有另一个值。\n\n是否可以在 `background-repeat` 中为背景写两个值？\n\n```css\n{\n  background-repeat:\
    \ no-repeat, repeat-y;\n  background-image: url(bg01.png), url(bg02.png), url(bg03.png),\
    \ url(bg04.png);\n  background-position: top left, top right, bottom right, bottom\
    \ left;\n  background-color: #FFF;\n}\n```\n\n所以，第一张和第三张图像将不会重复，而第二张和第四张将沿 y 轴重复。如果有三个重复值，它们将分别应用于\n\
    \n第二、和第三张图像，而第四张图像将采用第一个。\n\n## 变换 (TRANSFORMS)\n\n如果你曾经想旋转或倾斜一个元素、边框以及文字，那么这一节就是为你准备的。\n\
    \n然而，有一个警告：为了保持内容的可读性，本节使用了不带前缀的 `transform` 属性版本。在编写本文时，在浏览器中执行变换\n\n需要多个带前缀的声明，如下所示：\n\
    \n```css\n-webkit-transform: ...;\n-moz-transform: ...;\n-o-transform: ...;\n\
    transform: ...;\n```\n\n这在一两年内将不再是必要的（我希望如此！）但在此期间，在阅读本节时请记住，变换已经简化为不带前缀的版本！可能最容易理解的变换是旋转（参见图\
    \ 7-31）。（在接下来的及后续图中，红色虚线表示原始元素在进行变换之前放置的位置。）\n\n```css\n{\n  transform: rotate(33.3deg);\n\
    }\n{\n  transform: rotate(-90deg);\n}\n```\n\n7-31：旋转的元素框。红色虚线显示了元素在旋转之前的原始位置。\n\
    \n从某种意义上说，变换非常相对定位：元素被正常放置并进行变换。你可以变换任何元素，在旋转的情况下，可以使用实数的角度（degrees）、弧度（radians）或梯度（grads）来指定旋转角度。如果你曾经想让你的博客旋转\
    \ $e$ 弧度或 225 梯度，现在机会来了。\n\n你无疑注意到，上一个示例中的框是绕着它们的中心旋转的。这是因为默认的变换中心是 50% 50%，即元素的中心。你可以使用\
    \ `transform-origin` 改变点（参见图 7-32）。\n\n```css\n1 {transform: rotate(33.3deg);\
    \ transform-origin: bottom left;}\n2 {transform: rotate(-90deg); transform-origin:\
    \ 75% 0;}\n```\n\n绕中心以外其他点旋转的元素。\n\n首先，负角度可以等同于正角度。因此，在元素的最终定位中，270deg 等于 –90deg，就像\
    \ 0deg 和 360deg 等效一样。\n\n其次，你可以指定大于表面最大值的角度。如果你声明了 450deg，元素的最终旋转看起来与你声明了 90deg\
    \ 以及 –180deg, 900deg 等完全相同。如果你使用了过渡效果（transitions，参见下一节），中间结果可能会不同，但最终的“静止”状态将是等效的。\n\
    \n旋转如此简单，缩放（scaling）也是如此，图 7-33 所示。正如你预期的，这会缩放元素的大小，使其变大或变小。你可以沿着两个轴一致地缩放，或者沿每个轴以不同的程度进行缩放。\n\
    \n```css\n{\n  transform: scale(0.5);\n}\n{\n  transform: scale(2, 1.5);\n}\n\
    ```\n\n7-33：缩放的元素。正如你预期的，这会缩放元素的大小，使其变大或变小。`scale()` 值意味着元素绕其中心进行缩放。如果有两个值，第一个指定水平（x）缩放，第二个指定垂直（y）缩放。\n\
    \n```css\n1 {transform: scale(0.5);}\n2 {transform: scale(1, 1.5);}\n```\n\n```css\n\
    1 {transform: translate(0,50px);}\n2 {transform: translate(5em,10em);}\n```\n\n\
    ```css\n1 {transform: translateY(50px);}\n2 {transform: translateY(5em);}\n```\n\
    \n7-34：缩放的元素。\n\n```css\n1 {transform: translateX(50px);}\n2 {transform: translateX(5em);}\n\
    ```\n\n7-35：平移的元素。\n\n```css\n1 {transform: rotate(0.5);}\n2 {transform: rotate(1.5);}\n\
    ```\n\n7-36：绕不同点旋转的元素。\n\n"
