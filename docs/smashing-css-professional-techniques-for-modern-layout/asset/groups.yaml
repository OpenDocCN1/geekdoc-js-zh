- md: "\n***89***\n\n### 3-11: Previewing print styles in the browser.\n\nPlaying\
    \ around with display property is one of the cornerstones of doing interesting\
    \ layout on HTML markup. And one of the best tricks in this card deck is to have\
    \ hyperlinks, which normally create an inline box, can generate a block-level\
    \ box instead.\n\nTo understand why, consider a list of links in a page’s sidebar.\
    \ These are probably all an ordered list, one link per list item, or else in some\
    \ very similar structure. In fact, consider identical lists of links. The only\
    \ difference is that one list will have block-level links, and the other won’t\
    \ (see Figure 3-12). We’ll give the links backgrounds to make the difference clear.\n\
    \n3-12: Two lists of links—one blocked, the other not.\n\nlinks are lot less user-friendly—there’s\
    \ less area to click. Accordingly, if we want to find hover effects on the links,\
    \ the inline links will only “light up” behind the text, not the whole box.\n\n\
    Making block-level links is really easy:\n\n```css\na {display: block;}\n```\n\
    \nI needed to get the block-box links into Figure 3-12. When an element generates\
    \ a block box, it acts exactly like the boxes usually generated by paragraphs,\
    \ divs, and so on—because it’s exactly the same kind of box. You can give it margins,\
    \ and all the rest.\n\n## MARGIN OR PADDING?\n\nEver thought—I mean, really thought—about\
    \ the indentation of lists? Or the “gutter” that surrounds a page by default?\
    \ If so, have you thought about how they’re created? It turns out there’s no universally\
    \ correct answer.\n\nThe space around a page’s content for a starter. As most\
    \ people know, there is about space that separate the page’s content from the\
    \ edges of the browser window. As shown in Figure 3-13, you can remove that space\
    \ with reset styles, or by styling the body itself. But how should you style it?\
    \ Are you removing a margin, or removing padding? To be cross-browser friendly,\
    \ the answer is both. That’s because most browsers create the gutter with an 8-pixel\
    \ margin, except Opera, which does it with 8 pixels of padding.\n\nIf you start\
    \ looking up ancient Norwegian curses, realize that nobody is in the position\
    \ to eliminate the gutter in all known browsers. There’s no specification that\
    \ says exactly how to create the gutter (or even that there should be one). There’s\
    \ a strong argument to be made that padding is a better choice here. That really\
    \ doesn’t matter, though, since there’s disagreement between browsers on this:\n\
    \n```css\nbody {padding: 0; margin: 0;}\n```\n\n3-13: A close-up of the “gutter”\
    \ around the document’s content.\n\nIn like fashion, the indentation of lists—either\
    \ ordered or unordered—is accomplished by left margin or padding, depending on\
    \ the browser. Thus, if you declare the following:\n\n```css\nol {margin-left:\
    \ 0;}\n```\n\nyou’ll remove list indentation in some, but not all, browsers. You\
    \ need to strip off the padding as well if you want to be consistent across browsers.\
    \ Of course, you aren’t limited to just removing the indentation. Once you’ve\
    \ gotten used to both left margin and padding on lists to change list indentation,\
    \ you can decide which works best for you. Maybe you think all browsers should\
    \ use padding to indent lists, so:\n\n```css\nol {margin-left: 0; padding-left:\
    \ 2.5em;}\n```\n\nmaybe you’d like to split the difference:\n\n```css\nol {margin-left:\
    \ 1.25em; padding-left: 1.25em;}\n```\n\nIf you use all margins, no padding is\
    \ your cup of tea:\n\n```css\nol {margin-left: 2.5em; padding-left: 0;}\n```\n\
    \nIf you assign a background to your lists, it won’t really matter how you do\
    \ this. Then it suddenly does matter (see Figure 3-14). This is largely because\
    \ the list bullets, squares, letters, whatever—are placed to one side of each\
    \ list item, absolutely positioned there. (They aren’t actually using absolute\
    \ positioning, but the effect is very, very similar.) So they’ll hang over the\
    \ list’s left padding or margin. If you want them “inside” the visible background,\
    \ then you want your indentation to be done with padding. If you want them hanging\
    \ out beyond the background, use margin.\n\n3-14: Comparison of list indentation\
    \ techniques.\n\n## OUTDENTING LISTS\n\nWe were talking about list indentation,\
    \ and now we’re talking about outdentation? Is that a word? Maybe not, but it’s\
    \ better than “hanging indent,” which is the other sort of thing and makes no\
    \ sense at all. What I’m talking about here is the technique of having the first\
    \ line of a list item hanging left where the rest sit (see Figure 3-15). It is\
    \ effective because it lets you distinguish between list items without having\
    \ to clutter up with bullets or what-have-you. It’s really easy to do, too:\n\n\
    ```css\nli {indent: -2em; list-style: none;}\n```\n\n3-15: Outdenting.\n\nThat’s\
    \ it. Note that I made sure to include list-style: none there. If I hadn’t, then\
    \ the line of each list item would’ve been outdented, and the text would have\
    \ overlapped the bullets. So don’t mix outdenting with list markers. You can outdent\
    \ anything, of course, from paragraphs to headings to divs to pre to tables. It’s\
    \ just most common to see it in lists.\n\n## BULLETING LISTS\n\nThere are a lot\
    \ of ways to get bullets onto lists. The simplest, though the least precise, is\
    \ to use list styling properties built into CSS. Say we have a list of the stars\
    \ closest to the Earth, and we want each one to have a little bullet instead of\
    \ a circle, disc, or square (see Figure 3-16).\n\n```css\nstars{list-style-image:\
    \ url(star.gif);}\n```\n\n3-16: Changing marker colors.\n\nThe potential drawback\
    \ here is that you don’t have any control over the color of the markers. To have\
    \ them a different color, you have to wrap the content of each list item—either\
    \ a div or a span. (Wait, the OCR is slightly broken here, let me reconstruct\
    \ the logic based on context).\n\nTo style the markers:\n\n```html\n<ol>\n  <li><div>the\
    \ Sun</div></li>\n  <li><div>65 Centauri (Proxima Centauri)</div></li>\n  <li><div>Alpha\
    \ Centauri A</div></li>\n</ol>\n```\n\n```css\nli {color: red;}\ndiv {color: black;}\n\
    ```\n\n## BACKGROUND BULLETS\n\nYou want to set customized image list markers,\
    \ but you aren’t content with just letting the browser put it wherever it feels\
    \ like. That’s okay: Just turn off the list’s markers and drop your image into\
    \ the list items’ backgrounds (see Figure 3-18).\n\n```css\nol {list-style: none;}\n\
    li {background: url(star.gif) 0 0.1em no-repeat; padding-left: 16px;}\n```\n"
  mdcn: "\n\n***89***\n\n### 3-11: 在浏览器中预览打印样式。\n\n玩转 `display` 属性是在 HTML 标记上进行有趣布局的基石之一。在本牌组中，最好的技巧之一是让超链接（通常创建内联框，inline\
    \ box）可以生成一个块级框（block-level box）。\n\n为了理解为什么，请考虑页面侧边栏中的链接列表。这些可能都是有序列表，每个列表项目一个链接，或者具有非常相似的结构。事实上，考虑两组相同的链接列表。唯一的区别是，其中一个列表具有块级链接，而另一个不是（见图\
    \ 3-12）。我们将为链接设置背景以使区别一目易见。\n\n3-12: 两个链接列表——一个是块级的，另一个不是。\n\n内联链接对用户友好性低得多——可点击区域较小。因此，如果我们想寻找链接上的悬停效果，内联链接只会在文本背后“亮起”，而不是整个框。\n\
    \n制作块级链接其实非常简单：\n\n```css\na {display: block;}\n```\n\n我之前需要将块级框链接放入图 3-12。当一个元素生成块框时，它的行为与通常由段落、`div`\
    \ 等生成的框完全相同——因为它是完全同类型的框。你可以给它设置外边距（margins）以及所有其他属性。\n\n## 外边距还是内边距？\n\n你是否考虑过——我是说，真的考虑过——列表的缩进？或者默认环绕页的“间隙”（gutter）？如果是，你是否考虑过它们是如何创建的？事实证明，并没有通用的正确答案。\n\
    \n对于初学者来说，页面内容周围的空间。大多数人所知，有一些空间将页面内容与浏览器窗口边缘隔离开。如图 3-13 所示，你可以通过重置样式移除该空间，或者通过对\
    \ `body` 本身进行样式。但你应该如何设置样式？是移除外边距还是移除内边距？为了兼容各种浏览器，答案是两者都有。这是因为大多数浏览器会使用 8 像素的外边距来创建间隙，Opera\
    \ 除外，它使用的是 8 像素的内边距。\n\n如果你开始查询古老的挪威诅咒，就会发现没有人能够消除所有已知浏览器中的间隙。没有规范规定具体的如何创建间隙（甚至没有规定必须有一个）。有一个强有力的理由认为内边距是更好的选择。不过这并不重要，因为浏览器之间对此存在分歧：\n\
    \n```css\nbody {padding: 0; margin: 0;}\n```\n\n3-13: 文档内容周围“间隙”的特写。\n\n同样，列表缩进（无论是有序还是无序）是通过左外边距或内边距实现的，取决于浏览器。因此，如果你声明以下内容：\n\
    \n```css\nol {margin-left: 0;}\n```\n\n你将在移除某些而非所有浏览器中的列表缩进。如果你想在浏览器间保持一致，你还需要移除内边距。当然，你不局限于移除缩进。一旦你习惯了使用左外边距和内边距来更改列表缩进，你就可以决定哪种最有效。也许你认为所有浏览器都应该使用内边距来缩进列表，那么：\n\
    \n```css\nol {margin-left: 0; padding-left: 2.5em;}\n```\n\n也许你想要折中求其次：\n\n```css\n\
    ol {margin-left: 1.25em; padding-left: 1.25em;}\n```\n\n如果你习惯于使用外边距而不使用内边距，那么这就是你的菜：\n\
    \n```css\nol {margin-left: 2.5em; padding-left: 0;}\n```\n\n如果你为列表分配了背景，那么怎么做其实并不重要。这时它突然变得重要了（见图\
    \ 3-14）。这在很大程度上是因为列表符号、正方形、字母等——被放置在每个列表项目的一侧，并在那里进行绝对定位。（它们实际上并没有使用绝对定位，但效果非常非常相似。）所以它们会悬在列表的左侧内边距或外边距上。如果你让它们出现在可见背景的“内部”，你就希望通过内边距完成缩进。如果你想让它们悬在背景之外，请使用外边距。\n\
    \n3-14: 列表缩进技术的比较。\n\n## 列表悬悬\n\n我们刚才在讨论列表缩进，现在又在讨论悬悬（outdentation）？这是一个词吗？也许不是，但它比“悬挂缩进”好。我在这里说的是让列表项目的第一行悬挂在其他部分左侧的技术（见图\
    \ 3-15）。它是有效的，因为它让你能够区分不同的列表项目，而不需要用符号或各种杂乱的东西弄乱。这样做也很容易：\n\n```css\nli {indent:\
    \ -2em; list-style: none;}\n```\n\n3-15: 悬悬。\n\n就是这样。注意，我确保在那里包含了 `list-style:\
    \ none;`。如果我没加，每个列表项目的行都会悬悬，文本将与符号重叠。所以不要将悬悬与列表标记混合使用。当然，你可以悬悬任何内容，从段落到标题、从`div`、`pre`\
    \ 再到表格。只是在列表中最为常见。\n\n## 为列表添加符号\n\n有很多方法可以给列表添加符号。最简单但不精确的方法是使用 CSS 内置的列表样式属性。假设我们有一个距离地球最近的恒星列表，我们希望每个项目都有一个小符号，而不是圆圈、圆或正方形（见图\
    \ 3-16）。\n\n```css\nstars{list-style-image: url(star.gif);}\n```\n\n3-16: 更改标记颜色。\n\
    \n这里的潜在缺点是你无法控制标记的颜色。为了让标记颜色不同，你必须封装每个列表项目的内容——使用一个 `div` 或 `span`。（注：此处原文逻辑有缺失，已根据上下文重构）。\n\
    \n要设置标记样式：\n\n```html\n<ol>\n  <li><div>the Sun</div></li>\n  <li><div>65 Centauri\
    \ (Proxima Centauri)</div></li>\n  <li><div>Alpha Centauri A</div></li>\n</ol>\n\
    ```\n\n```css\nli {color: red;}\ndiv {color: black;}\n```\n\n## 背景符号\n\n你想想要设置自定义的图像列表标记，但你不满足于让浏览器随心所欲地放置它。没关系：只需关闭列表标记，并将你的图像放入列表项目的背景中（见图\
    \ 3-18）。\n\n```css\nol {list-style: none;}\nli {background: url(star.gif) 0 0.1em\
    \ no-repeat; padding-left: 16px;}\n```\n\n"
