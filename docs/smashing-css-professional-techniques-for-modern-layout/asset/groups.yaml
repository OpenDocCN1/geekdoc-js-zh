    使用 GIF89a 还是带透明通道的 PNG 取决你和你的网站受众。


    Gs，它们能创建更平滑的透明边缘。


    你只需使用前述相同的标记和 CSS 将它们直接放置在相应位置即可


    你最终将得到图 5-38 所示的屏幕。


    将图像放置在前述技巧标记上的结果。


    你已经完成了一半。每个标签的右侧一切正常，但在左侧，`li` 元素的 `d` 图像会通过 `a` 背景的透明部分可见，包括左上角！


    要解决这个问题需要一点技巧。首先，将 `a` 元素向左移出 `li`，


    可以采用几种方法。也许最简单的方法是将它们相对定位到。


    （见图 5-39），并确保有足够的空间让它们落下。


    ```css

    .nav li {float: left; margin: 0; padding: 0; list-style: none;}

    td {width: 100%;}

    {background: url(tab-clip-right.gif) no-repeat 100% 0;

    height: 25px;}

    a {background: url(tab-clip-left.gif) no-repeat;

    display: block; padding: 10px 0 5px 25px;

    position: relative; left: -25px;}

    ```


    使裁剪后的标签对齐。


    这样做了吗？每个 `a` 元素向左移动了 15 像素。仅凭这一点是不够的，这意味着从第二个到最后一个链接将重叠包含它们的列表项。给这些列表项留出 15px
    的右边距恰恰留出了足够的空间让它们落下而不产生重叠或间隙。


    10/5/10 7:58 PM


    10/5/10 7:58 PM


    然而，有一个小问题；每个标签的右侧将变得不可点击，因为链接已移动左侧（仔细观察图 5-39，可以看到最后一个上方的空白箭头）。


    所以，更好的方法是使用一点外边距技巧。在这种情况下，将最后一条规则修改为：


    ```css

    .nav li a {background: url(tab-clip-left.gif) no-repeat;

    display: block; padding: 10px 25px 5px; margin-left: -25px;}

    ```


    通过这种设置，每个超链接的左边缘被向左拉了项目左边缘 15 像素。这导致链接覆盖了从上一个列表项延伸出来的右边距，就像相对定位的方法一样。不过，这样做是链接的右边缘与列表项的右边缘对齐，而不是移开它。因此，效果符合预期，正如图
    5-40 中的魔术手指手势所示，而且裁剪后的标签让页面背景透了过来！


    5-40：功能完全的裁剪标签。


    ## 视差 (PARALLAX)


    视差是一种微妙的技巧，作为网站的“彩蛋”使用时非常有趣，而且也揭示了简单直接的基于百分比的背景图像重新定位如何产生意想不到的结果。（这非常非常很难在印刷物中说明，所以你绝对想亲自尝试一下。）


    首先，考虑基于百分比的定位是如何实现的。假设你为背景设置了 50% 50% 的位置。这将导致它的中心与背景区域的中心对齐。同样，如果你分配了 100% 100%，那么它的右下角将与背景区域的右下角对齐。参见图
    5-41 的两种不同图像放置的示例。这意味着背景图像定位的百分比值实际上分两步：第一次是在背景区域中找到定义的点；第二次是在图像本身中找到定义的点。然后将这两个点对齐。当背景区域的大小动态变化时会发生什么？考虑这条规则：


    ```css

    {background: url(ice-1.png) 75% 0 no-repeat; width: 100%;

    height: 0; margin: 0;}

    ```


    10/5/10 7:58 PM


    10/5/10 7:58 PM


    假设 `ice-1.png` 宽 400 像素。在正好为 800 像素的浏览器窗口中，`ice-1.png` 左边缘的第 300 个像素将与 `body`
    左边缘的第 600 个像素对齐，如图 5-42 所示。冰凌就位。


    10/5/10 7:58 PM


    10/5/10 7:58 PM


    想象一下当浏览器窗口（因此是 `body`）变窄时，冰凌会发生什么。当然，冰凌相对于页面布局向左移动，因为 `body` 中的 75% 点向左移动了。如果将窗口和
    `body` 变宽，冰凌将向右移动。考虑如果将图像水平位置改为 50% 会发生什么。它将在 `body` 中居中，它的移动速度将比在 75% 时低。一直降到
    0%，将其放在 `body` 的左边缘，那么当 `body` 调整大小时，它将完全不会移动（相对于整个页面布局）。


    假设你有两个背景，一个左对齐，另一个在 75%，且两者都水平重复（见图 5-43）。例如：


    ```css

    {background: url(ice-1.png) 0 0 repeat-x; width: 100%;

    height: 0; margin: 0;}

    main {background: url(ice-2.png) 75% 0 repeat-x; width: 100%;}

    ```


    5-43：两组冰凌。


    一种层次感。更重要的是，当窗口变窄或变宽时，`div#main` 冰凌会滑过 `body` 上的冰凌。这本身就很有趣，但更进一步，偏移 `body` 的背景使其不是左对齐。


    ```css

    {background: url(ice-1.png) 25% 0 repeat-x; width: 100%;

    height: 0; margin: 0;}

    main {background: url(ice-2.png) 75% 0 repeat-x; width: 100%;}

    ```


    10/5/10 7:58 PM


    10/5/10 7:58 PM


    浏览器窗口大小变化时，两组冰凌都会移动，但速度不同。事实上，`body` 冰凌移动速度是尺寸变化的四分之一，而冰凌移动速度是其的三之四。因此，如果你以每秒
    4 像素的速度调整窗口，`body` 背景将以每秒 3 像素的速度移动，而背景将以每秒 9 像素的速度移动。


    ## 浮动 (FLOATS)


    许多设计师愿望清单上的事情是让文字沿着每天处理的无聊框框不规则边缘流动。嗯，这不仅可行，而且简单可靠，尽管需要付出标记成本。


    要让你的文字沿着缓慢倾斜的曲线流动，如图 5-44 所示。

