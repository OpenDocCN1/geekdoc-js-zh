  mdcn: "\n***157***\n\n4-52: 将主内容向下推，以避免被固定头部重叠。\n\n4-53: 对头部和主内容都使用固定定位。\n\n结果是头部永远不会与内容重叠，且“向上页”和“向下页”功能正常。\n\
    \nd. 这也意味着内容的滚动条可能位于你熟悉的浏览器内部，就像以前的框架（frames）一样。和许多布局技术一样，也有需要考虑的缺点。请谨慎选择。\n\n\
    ## 章节：特效\n\n能够改变颜色和字体之后，每个人都渴望更多——那种老式的华丽闪烁。要把所有这些东西归类可能很难，但这里的范围如此广泛，以至于很难做其他事情。在本章中，你将看到如何实现圆角、溢出容器、伪造扭变滤镜、将图片滑入标签页、创建视差效果等等。\n\
    \n### LEXSPIRAL\n\n老旧但经典，如果我可以这么说的话（我确实是这么说的）。这就是所谓的“视差演示”，因为这是我在 2001 年创建它时给它的称呼。即使它的主要用场景已被透明\
    \ PNG 和 RGBa 颜色所掩盖，这把老兵依然很有生命力。\n\n对于这项工作，你至少需要两张背景图片（见图 5-1）。我们将一张分配给 `body`\
    \ 背景，另一个分配给包含页面大部分内容的 `div` 背景（见图 5-2）。这里是 CSS 和 HTML 骨架代码。\n\n```css\nbody {\n\
    \  background: white url(shell.jpg) top left no-repeat fixed;\n}\n\ndiv {\n  background:\
    \ white url(shell-rippled.jpg) top left no-repeat fixed;\n}\n```\n\n```html\n\
    <div id=\"main\">\n  content...\n</div>\n```\n\n5-2: 最终结果。\n\n这里的关键是 `fixed` 关键字。在两种情况下，它都使背景图像的左上角位于视口的左上角（在本例中为浏览器窗口），并将其固定在原处。即使文档滚动，它们也不会移动。因此，它们“堆叠”在彼此之上。\n\
    \n为了理解这意味着什么，请考虑一个更简单的示例，它在视口的左上角固定两个不同尺寸的背景图像（另见图 5-3）。\n\n```css\nbody {\n \
    \ background: transparent top left no-repeat fixed;\n}\n\n.red-box {\n  background-image:\
    \ url(red-box.gif);\n}\n\n.green-box {\n  background-image: url(green-box.gif);\n\
    }\n```\n\n当两张图像固定在视口时，即使页面已经滚动到了底部，图像仍在窗口的左上角。同样，它们相对于视口固固定。因此，它们永远不会移动。\n\n视差演示。它需要两张尺寸相同的图像，其内容对齐，以便你可以在\
    \ `div` 与 `body` 背景重叠的地方看到一个重叠在另一个上面。`div` 的波纹外壳并没有与自身的左上角对齐，而是与视口的左上角对齐。如果你想为内容中的标题创建第三种扭变效果，如图\
    \ 5-4 所示。\n\n5-4: 显示波纹外壳。\n\n5-5: 要添加的第三张图片。\n"
