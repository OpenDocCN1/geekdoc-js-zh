    If you’re looking for a lightweight cross-browser element inspector, then XRAY,
    shown in Figure 1-29, is right up your alley. It has a very limited scope, but
    its focus is actually its strength as long as limited scope is what you want.


    **1-29: The XRAY page.


    Go to westciv.com/xray and drag the big XRAY box to your bookmarks toolbar (or
    menu, if you want to hide it away). Then, whenever you’re on a page and want to
    inspect an element, call up XRAY and select the element that interests you.


    If you’ve selected an element, it will be highlighted and show dimensional information
    to all sides, and the XRAY box, visible in Figure 1-30, will provide some extra
    information regarding its place in the document tree, any ID or class values,
    and a core set of CSS property values. If you select any of the elements under
    the inheritance hierarchy, XRAY will switch to detecting that element. To get
    rid of XRAY until the next time you need it, just click the close button at the
    top-right corner of the box.


    **XRAY in action.**


    Tool with a different purpose is MRI (westciv.com/mri), which lets you enter a
    CSS selector and then be shown which elements on the page that selector will select.


    ## SELECTORACLE


    Selectoracle (see Figure 1-31) sounds like an advertisement for a database product.
    Instead, it’s an online tool that translates valid selectors into something resembling
    English. (The name comes from mashing “Selector” and “Oracle” together.)


    Go to selector.theopalgroup.com/selectoracle and enter one or many valid CSS selectors
    no matter how complex. Stick with English or switch the language to Spanish, and
    click the Explain This! button. You’ll get back an explanation of each selector
    you entered, for example:


    li:child(2n+3):not(:last-child)


    Check the explanation:


    li element that is an odd numbered child starting with the third child and that
    is a child that is a descendant of a ul element.


    **1-31: The SelectORacle page.**


    ## DIAGNOSTIC STYLE SHEET


    If you wanted your browser to scream at you when it loads a page with outdated,
    broken markup, you could use a diagnostic style sheet. With a diagnostic style
    sheet, you can have a quick visual cue as when things have gone wrong with the
    page’s markup. One example of a diagnostic style sheet can be found at css.com/tools/css/diagnostic
    (in both CSS3 and IE7-friendly), and a similar resource is at accessibility.org/site/2006/07/angry-text.
    As an example, one line of the diagnostic style sheet says:


    `* {outline: 5px solid red;}`


    This puts a thick, solid red line around any element with a style attribute. You
    could spice it up further with something like background-color: lime to really
    drive home the point. The idea is to catch places where markup has appeared, whether
    through entry via a CMS or some other means, that validation wouldn’t catch. Consider
    the common example of a JavaScript link: `<a href="javascript:nextPage()">Next</a>`.
    The problem is that for JavaScript, the link will do nothing. There should be
    some kind of non-JS fallback value for its href attribute. (It works with attribute
    selector; for more, see “Simple Attribute Selection” in Chapter 2.)


    How do you use diagnostic CSS? Either by importing it into your development site’s
    CSS and removing it before going live, or by setting it up as a user style sheet
    in your browser to apply it to any page you visit. A diagnostic style sheet which
    does things like find elements that have no content, pages without alt or title
    attributes as well as those that are empty, find tables with headers that have
    invalid scope values, and links with empty title and href attributes. Note that
    this version will not work in IE7 the attribute selectors. This version won’t
    work in IE8, either, because of the :not() pseudo-classes. Figure 1-32 shows a
    test page for this diagnostic CSS.


    ```css

    span:empty, p:empty, th:empty {padding: 0.5em; background: yellow;}

    h1, h2, h3, h4 {outline: 5px solid red;}

    *[id=""] {outline: 5px dotted red;}

    [class=""] {border: 3px dotted red;}

    input[type="text"] {border: 5px solid red;}

    a[href=""] {outline: 3px dotted fuchsia;}

    img[alt=""] {outline: 5px solid fuchsia;}

    [summary=""] {outline: 5px solid red;}

    [name=""] {outline: 3px dotted red;}

    col, th[scope="row"] {border: none;}

    t([title]) {border: 5px solid red;}

    [style=""] {outline: 3px dotted red;}

    [target=""] {background: lime;}

    {background: fuchsia;}

    ```

