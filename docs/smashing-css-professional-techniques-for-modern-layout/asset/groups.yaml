    \n如果你感兴趣选择每隔一个元素——例如，每隔一个表格行——除了 `2n+1`，还有更符合人类习惯的选择。你可以使用 `:nth-child(even)`\
    \ 和 `:nth-child(odd)` 来选择偶数或奇数元素，例如所示：\n\n```css\n:nth-child(odd) {background:\
    \ #EEF;}\n```\n\n## 样式化偶尔列\n\n为交替表格行设置样式很容易，但表格列呢？通常，得益于 `:nth-child` 和 `:nth-of-type`\
    \ 选择器，这同样简单。对于仅由数据单元（即 `td` 元素）组成的表格，你可以像这样选择每隔一列（参见图 7-11）：\n\n```css\n:nth-child(odd)\
    \ {background: #FED;}\n```\n\n如果你想为奇数列和交替列设置样式，如图 7-12 所示？轻而易举！\n\n```css\n:nth-child(odd)\
    \ {background: #FED;}\n:nth-child(even) {background: #DEF;}\n```\n\n如果你想为每第三列（图\
    \ 7-13）、第四列、第五列或类似的间隔设置样式，则可以使用 `+1` 模式：\n\n```css\n:nth-child(3n+1) {background:\
    \ #EDF;}\n```\n\n如果你想同时为奇数和偶数列设置样式呢？这些都相对直接。\n\n***245***\n\n7-13: 为每第三列数据列设置样式。\n\
    \n这些都相对直接。现在，当你在行的开头放置 `th` 时会发生什么？从某种意义上说，什么都没有发生。选中的列没有变化；你仍然在选择 `tr` 元素的第一个、第四个、第七个等子元素。从另一个意义上说，选中的列发生了偏移，因为你不再是在选择第一个、第四个、第七个等数据列了。你现在选择的是第三个、第六个等数据列。由\
    \ `th` 元素组成的第一行完全没有被选中，因为选择器只匹配 `td` 元素（参见图 7-14）。\n\n7-14: 使用行头破坏模式。\n\n你只需要更改\
    \ `:nth-child` 选择器的参数（参见图 7-15）：\n\n```css\n:nth-child(3n+2) {background: #EDF;}\n\
    ```\n\n或者，如图 7-16 所示，你可以保留原始模式并将 `:nth-child` 切换到 `:nth-of-type`：\n\n```css\n\
    :nth-of-type(3n+1) {background: #FDE;}\n```\n\n为了通过调整选择公式来保持模式，你可以使用 **nth-of-type**，因为它会选择给定类型（在本例中为\
    \ `td` 元素）的每第 n 个元素，并跳过选择器中未命名的任何其他元素。\n\n## 颜色\n\n颜色可能是所有 CSS 中熟悉的内容之一；有些人能够根据十六进制表示法估计颜色的外观。使用\
    \ `rgb()` 表示法定义颜色并不十分常见，但 `rgba()` 表示法非常流行。值中的一部分是 alpha 通道，例如透明度。因此，你可以提供一种部分透明的颜色（参见图\
    \ 7-17）：\n\n```css\nbackground: rgb(255,255,255);\nbackground: rgba(255,255,255,0.5);\n\
    ```\n\n你也可以在 RGBA 中使用 RGB 值的百分比形式。alpha 值始终表示为 0 到 1 之间的数字，0 表示“完全不透明”，1 表示“完全不透明”。因此，半不透明（即半透明）无法在其中使用百分比，这是由于某些历史原因，原因复杂不在此详述。如果你提供了一个\
    \ 0 到 1 范围之外的数字，它将（用规范的话）被“限制（clamped）”在允许范围内。所以，如果你给出的 alpha 值为 4.2，浏览器将将其视为你写了\
    \ 1。\n\n此外，目前还不清楚当使用 0 的 alpha 时会发生什么。由于颜色是完全透明的，例如不可见的文本会发生什么？你可以选中它吗？如果它在链接上，链接可以点击吗？这两个都是没有确定答案的有趣问题，所以请小心。\n\
    \nRGBA 可以用于任何接受颜色值的属性，例如 `color` 和 `background-color`。为了防止旧版浏览器出现问题，建议在 alpha\
    \ 颜色之前使用非 alpha 颜色。其格式将如下所示：\n\n```css\ncolor: rgb(0,0,0);\ncolor: rgba(0,0,0,0.75);\n\
    ```\n\n旧版浏览器看到第一个值并知道如何处理。然后它们看到第二个值并不知道如何处理，因此会忽略它。这样一来，至少旧版浏览器显示是正确的。另一方面，现代浏览器理解这两个值，并得益于级联用第二个值覆盖第一个。\n\
    \nRGBA 颜色没有十六进制形式。因此，你无法编写带有 alpha 的 #000000。\n\n***247***\n\n7-17: 不透明和透明的 RGB\
    \ 背景。\n\n7-18: 一个 HSL 颜色选择器。\n\n7-19: 各种 HSL 颜色表。\n\n7-20: 不透明和透明的 HSL 背景。\n\n"
