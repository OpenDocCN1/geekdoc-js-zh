    \ the most widely used validator is the one provided by the W3C itself and located\
    \ at validator.w3.org (see Figure 3-1). Its CSS-centric cousin, sited at jigsaw.w3.org/validator/,\
    \ is equally popular.\n\nW3C’s HTML validator.\n\nIf you’re stuck developing behind\
    \ a firewall, or do all your development on your laptop without a run Web server?\
    \ Then use the “Validate local” features in Firebug and other tools. As long as\
    \ you can browse the Web, then you can validate any page you’re viewing, whether\
    \ or not the page you’re viewing can be publicly browsed. (I pretty much use “validate\
    \ local,” even when the page is on a public site, just to keep in the habit of\
    \ validating locally.)\n\n## ORDERING YOUR FONT VALUES\n\nis one of the little\
    \ quirks of CSS that lots of people stumble over, sometimes wondering what tripped\
    \ them up. Most properties that accept multiple keywords let you list them in\
    \ basically any order, and don’t insist that you include every single one of them.\
    \ (For example of background lets you specify anywhere from one to five keywords\
    \ and doesn’t care how you arrange them.)\n\nOne of the few exceptions is font,\
    \ which not only has a minimum set of required keywords but also requires a certain\
    \ order. The most basic font declaration you can have is:\n\n```css\nfont: 100%\
    \ 16px sans-serif;\n\n\nOf course, you’d replace those bracketed terms with actual\
    \ values, like:\n\n```css\nfont: bold 100% sans-serif;\n``` \n\nThe point is that\
    \ you must include both values, and they must be in that order—size, then family.\
    \ If you reverse them, or leave one out, any modern browser will just ignore the\
    \ whole declaration. Furthermore, if you include the other keywords in your declaration,\
    \ they all (except for one, which is the subject of the next section) have to\
    \ come before the required values.\n\n```css\nfont: bold italic 100% sans-serif;\n\
    : italic small-caps 125% Georgia, serif;\n: bold small-caps 200% Arial, sans-serif;\n\
    ```\n\nHow those values before the size can be scrambled around, and it doesn’t\
    \ matter. The thing is that they all come before the size. Put them after, and\
    \ again, browser will ignore the declaration.\n\nI thought the font value patterns\
    \ in the preceding section were a little odd, but this is where we get downright\
    \ funky. I said that in order to have the minimum font value, “you must include\
    \ both values, they must be in that order—size, then family.” That’s true, but\
    \ it so happens that you can put an optional line-height value in place as a sort\
    \ of hanger-on to the size (see Figure 3-4). It looks like this:\n\n```css\nfont:\
    \ 100%/2.5 Helvetica, sans-serif;\n```\n\n## VALUES\n\nline-height can accept\
    \ unitless number values. You can also give line-height inherited values, though\
    \ generally you shouldn’t. The difference? When you define a united value, like\
    \ 1em or 100%, you’re setting to pass along the computed result to any descendants.\
    \ For example, suppose the CSS is applied to a document containing the following\
    \ markup:\n\n```html\nli {font-size: 15px; line-height: 1em;}\nli {font-size:\
    \ 80%;}<li><small>small text</small></li>\n```\n\nThe li element has its line-height\
    \ computed to be 15px because for line-height, based values are calculated using\
    \ the computed font-size of the element itself, as percentage values. Since I\
    \ declared the font-size directly, we know its computed value in pixels.\n\nHere’s\
    \ the potentially surprising part: The computed value of 15px is what’s passed\
    \ on to the descendant elements. In other words, the li and small elements will\
    \ inherit a line-height value of 15px. End of story. They don’t change it based\
    \ on their own font sizes; they don’t change it at all. They just take that 15px\
    \ and use it, exactly the same as if I’d written:\n\n```css\nli {font-size: 15px;\
    \ line-height: 1em;}\nli {font-size: 10px; line-height: 15px;}\nli {font-size:\
    \ 80%; line-height: 15px;}\n```\n\nNow, suppose I take the em off that line-height\
    \ value, so that the styles now read:\n\n```css\nli {font-size: 15px; line-height:\
    \ 1;}\nli {font-size: 10px;}\nli {font-size: 80%;}\n```\n\n```html\n<li>I’m a\
    \ list item with <small>small text</small></li>\n```\n\nNow what’s passed on to\
    \ the descendants (the li and small elements) is that raw number, which is used\
    \ by said descendant elements as a scaling factor—a multiplier, if you will—and\
    \ the computed result.\n\nAll elements that inherit that value of 1 will take\
    \ that value and multiply it with their computed font-sizes. The list item, with\
    \ its declared font-size: 10px, will have a computed line-height of 10px. Then\
    \ it will pass that 1 on to the small element, which will multiply it with its\
    \ computed font-size. That’s 8 pixels; therefore, its computed line-height will\
    \ also be 8 pixels.\n\nIt’s a pretty major difference (see Figure 3-3). This is\
    \ why it’s always strongly recommended you use unitless numbers if you’re going\
    \ to set a line-height on something like the li or body elements, or indeed on\
    \ any element that is going to have descendant elements.\n"
