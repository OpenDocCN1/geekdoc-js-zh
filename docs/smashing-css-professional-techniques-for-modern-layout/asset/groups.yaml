    ## 表格


    现在——多年来你一直听到“表格是邪恶的”，而且没有人会在页面布局中使用它们。这是因为表格不应该用于布局。另一方面，布局表格是一项极佳且值得的追求。毕竟，有时你确实需要展示数据表格。


