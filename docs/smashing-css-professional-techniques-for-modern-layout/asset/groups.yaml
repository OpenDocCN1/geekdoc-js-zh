    \ paddings, and borders total more than 100%—to 100% plus two pixels, in fact.\
    \ Even one pixel above 100% is too many.\n\nI have no solutions save “double-check\
    \ your math.” For the full-height separator, the next two sections may well provide\
    \ an answer.\n\n## COLUMNS\n\nThe CSS technique first popularized by Dan Cederholm\
    \ (http://simplebits.com/a 2004 article for A List Apart), faux columns are a\
    \ venerable solution to the vexing problem of creating equal-height columns in\
    \ CSS.\n\nTo create faux columns, you first need the columns.\n\n```html\n<div\
    \ class=\"column one\">...</div>\n<div class=\"column two\">...</div>\n<div class=\"\
    column three\">...</div>\n```\n\n***125***\n\nThey’ll most likely be floated,\
    \ since positioning is generally a really bad solution for column layouts. The\
    \ key making this technique work (see Figure 4-17) is to make sure the columns\
    \ have fixed pixel widths, and really pixel everything (except, we hope, font\
    \ size).\n\n```css\n.column {width: 300px; margin: 0 5px; padding: 0 5px; float:\
    \ right;}\n```\n\n4-17: Placing the three columns.\n\nWith all we need is a way\
    \ to “paint in” a set of separators. We’ll need an element that’s at least as\
    \ tall as the columns themselves, and ideally exactly as tall. Something like\
    \ a container div.\n\n```html\n<div class=\"contain\">\n  <div class=\"column\
    \ one\">...</div>\n  <div class=\"column two\">...</div>\n  <div class=\"column\
    \ three\">...</div>\n</div>\n```\n\nNow we need two things. First is to contain\
    \ the floated columns.\n\n```css\n.contain {width: 960px; overflow: auto;}\n```\n\
    \nSecond is an image that, when filled into the background of that container,\
    \ will define the column separators, as in Figure 4-18.\n\nThe background image\
    \ containing the column separators must be many pixels tall because it will be\
    \ repeated vertically (see also Figure 4-19).\n\n```css\n.contain {width: 960px;\
    \ margin: 0 auto; overflow: auto; background: url(separators.png) 0 0 repeat-y;}\n\
    ```\n\nyou go! Any repeating pattern will work for filled-color column backgrounds\
    \ (see Figure 4-20). Just a quick change of image:\n\n```css\n.contain {width:\
    \ 960px; margin: 0 auto; overflow: auto; background: url(filled-columns.png) 0\
    \ 0 repeat-y;}\n```\n\n***127***\n\nThis-column technique can support as many\
    \ columns as you like; just set up the background and you’re good to go. This\
    \ is all great if you’re using pixel-width layouts, and many people do. There\
    \ are potential problems with doing so, but many of them are obviated by “page\
    \ zoom” in modern browsers. Not all, though: If a user has a browser window narrower\
    \ than your layout, they’ll get a horizontal scrollbar. Conversely, if they come\
    \ in with a browser window wider than your layout, there will be a ton of empty\
    \ space on the side(s) of the design. These possibilities may not matter to you\
    \ but they’re worth considering. If you want a faux-column–like technique for\
    \ liquid layouts, then the next section is for you. In that case, Liquid Bleach\
    \ is for you.\n\n## BLEACH\n\nThis multicol layout technique was developed by\
    \ Doug Bowman (of Sliding Doors fame) and Eric Meyer in late 2004, and gets its\
    \ name from its support for liquid layouts and the name of Doug Bowman’s theme\
    \ (“Bleach”) at the time it was developed.\n\nLiquid Bleach starts out much like\
    \ faux columns, but with an addition.\n\n```html\n<div class=\"contain\">\n  <div\
    \ class=\"inner\">\n    <div class=\"column one\">...</div>\n    <div class=\"\
    column two\">...</div>\n    <div class=\"column three\">...</div>\n  </div>\n\
    </div>\n```\n\nIn this work, you need one container for every gap between columns;\
    \ or, if you prefer, one less container than you have columns. Since we have three\
    \ columns here, we need two containers. Additionally, we’ll need one separator\
    \ and/or background pattern for each container. Finally, we’ll add some liquid-width\
    \ styles.\n\n```css\n.column {width: 20%; margin: 0 5%; float: left;}\n.column\
    \ {width: 30%;}\n```\n\ntake just one background image. Note that Figure 4-21\
    \ shows just a portion of the image, which is actually 3,000 pixels wide (really!).\
    \ The first separator image has a filled color to the left of the separator, and\
    \ complete transparency to the right. \n\nThe important part: The separator has\
    \ to line up with the gap between two columns. In this case, we’ll place it between\
    \ the leftmost and center columns (see Figure 4-22). We want the separator to\
    \ land 25% of the way across the container, as that’s the point between the two\
    \ columns. So two things have to be done. First, as implied in the preceding figure,\
    \ the separator image is 25% of the way across the 3,000-pixel-wide image. Therefore,\
    \ its midpoint is 750 pixels from the left edge of the image. This CSS:\n\n```css\n\
    .contain {background: url(lb01.png) 25% 0 repeat-y; overflow: auto;}\n```\n\n\
    ***129***\n\n4-22: Placing the first background image.\n\nthere, you see? The\
    \ point in the background image 750 pixels (25%) from the left edge lined up with\
    \ the point 25% of the way across the container. As long as 25% of the width of\
    \ container is less than 750 pixels, no problem!\n\nll in the right separator,\
    \ we just need another image with a similar setup to the first. In case, the width\
    \ of the rightmost column is 30%—20% for width and 5% for each of the side margins.\
    \ That means we need the separator to fall 70% of the way across a great big image,\
    \ or 2,100 pixels for a 3,000 pixel image. To the left of the separator is transparency;\
    \ to right, a filled color. A little CSS and it’s in place:\n\n```css\n.contain\
    \ {background: url(lb02.png) 0 70% repeat-y; overflow: auto;}\n```\n\nno matter\
    \ what browser window width, the separators will be in the right place; and as\
    \ the window is less than 3,000 pixels wide, the trick won’t break down. last\
    \ trick here: If you want to fill the center column with a color (see Figure 4-24),\
    \ you don’t need to add any markup. You just assign a background color to the\
    \ outer container.\n\n```css\n.contain {background: #DECADE url(lb02.png) 70%\
    \ 0 repeat-y; overflow: auto;}\n```\n"
  mdcn: "\n\n***123***\n\n4-15: 使用最高列的边界作为列分隔符。\n\n如果中间列最高，则它的边界充当分隔符。我们必须调整列的外边距（margin）和内边距（padding），以保持分隔符远离列内容，这并不是什么问题。事实上，我们完全只需要调整中间列而保持列规则（column\
    \ rule）不变，如下：\n\n```css\n.column {width: 20%; margin: 0 5%; float: left;}\n.column\
    \ {width: 30%; border: 1px solid gray; border-width: 0 1px; margin: 0; padding:\
    \ 0 4%;}\n```\n\n结果相同，可能在分隔符的对齐上有一两个像素的差异。\n\n你可能对这里的某些数字表示怀疑，而且这很有道理。内边距是从哪里来的？5%\
    \ 除以 2 等于 2% 的结果怎么回事？\n\n这引出了我的第 3 点，即处理流式列（fluid columns）和边界时必须小心。假设你只是将 5% 的外边距平分。在有边界的情况下，这样做是有风险的（见图\
    \ 4-16）。\n\n```css\n.column {width: 20%; margin: 0 2.5%; padding: 0 2.5%; float:\
    \ left;}\n.column {width: 30%; border: 1px solid gray; border-width: 0 1px;}\n\
    ```\n\n无意中丢失了第三列。\n\n第三列掉到了另外两列下方，是因为没有足够的空间并排放置。这是因为宽度、外边距、内边距和边界的总和超过了 100%——实际上是\
    \ 100% 加上两个像素。即使超过 100% 一个像素也多了。\n\n除了“检查你的数学计算”，我没有解决方案。对于全高分隔符，接两个章节可能会提供答案。\n\
    \n## 列 (COLUMNS)\n\n这种 CSS 技术最早由 Dan Cederholm（[一篇文章](http://simplebits.com/a\
    \ 2004) 发表于 A List Apart）推广，“伪列”（faux columns）是解决 CSS 中创建等高列这一棘手问题的经典方案。\n\n要创建伪列，你首先需要这些列。\n\
    \n```html\n<div class=\"column one\">...</div>\n<div class=\"column two\">...</div>\n\
    <div class=\"column three\">...</div>\n```\n\n***125***\n\n它们很可能是浮动的（floated），因为定位（positioning）对于列布局来说通常是非常糟糕的解决方案。这种技术生效的关键（见图\
    \ 4-17）是确保列具有固定的像素宽度，并且对一切进行像素化（除了我们希望的字体大小）。\n\n```css\n.column {width: 300px;\
    \ margin: 0 5px; padding: 0 5px; float: right;}\n```\n\n4-17: 放置三列。\n\n我们只需要一种方法来“绘制”一组分隔符。我们需要至少与列一样高的元素，理想情况下是完全一样。类似于一个容器\
    \ `div`。\n\n```html\n<div class=\"contain\">\n  <div class=\"column one\">...</div>\n\
    \  <div class=\"column two\">...</div>\n  <div class=\"column three\">...</div>\n\
    </div>\n```\n\n现在我们需要两件事。首先是包含浮动的列。\n\n```css\n.contain {width: 960px; overflow:\
    \ auto;}\n```\n\n其次是一个图像，当它填充到该容器的背景时，将定义列分隔符，如图 4-18 所示。\n\n包含列分隔符的背景图像必须有很多像素高，因为它将垂直重复（见图\
    \ 4-19）。\n\n```css\n.contain {width: 960px; margin: 0 auto; overflow: auto; background:\
    \ url(separators.png) 0 0 repeat-y;}\n```\n\n完成！任何重复图案都可以用于填充色的列背景（见图 4-20）。只需快速更改图像：\n\
    \n```css\n.contain {width: 960px; margin: 0 auto; overflow: auto; background:\
    \ url(filled-columns.png) 0 0 repeat-y;}\n```\n\n***127***\n\n这种列技术可以支持任意数量的列；只需设置好背景即可。如果你使用像素宽度布局，这都太棒了，而且许多人确实这样做。这样做存在潜在问题，但许多问题已通过现代浏览器中的“页面缩放”被消除了。不过并非所有如此：如果用户的浏览器窗口比你的布局窄，他们将看到水平滚动条。反之，如果他们的浏览器窗口比你的布局宽，则设计的侧面会有大量空隙。这些可能性可能对你并不重要，但值得考虑。如果你想获得一种适用于流式布局的类伪列技术，那么下一节适合你。在这种情况下，Liquid\
    \ Bleach 适合你。\n\n## BLEACH\n\n这种多列布局技术由 Doug Bowman（因 Sliding Doors 出名）和 Eric\
    \ Meyer 于 2004 年底开发，其名称源于它对流式布局的支持，以及 Doug Bowman 在开发时使用的主题名称（“Bleach”）。\n\nLiquid\
    \ Bleach 的起点与伪列相似，但增加了一个层次。\n\n```html\n<div class=\"contain\">\n  <div class=\"\
    inner\">\n    <div class=\"column one\">...</div>\n    <div class=\"column two\"\
    >...</div>\n    <div class=\"column three\">...</div>\n  </div>\n</div>\n```\n\
    \n在这项工作中，你每一对列之间的间隙都需要一个容器；或者，如果你喜欢，比列的数量少一个容器。由于这里有三列，我们需要两个容器。此外，每个容器还需要一个分隔符和/或背景图案。最后，我们将添加一些流式宽度的样式。\n\
    \n```css\n.column {width: 20%; margin: 0 5%; float: left;}\n.column {width: 30%;}\n\
    ```\n\n只需要一张背景图像。注意图 4-21 显示的只是图像的一部分，它实际上有 3,000 像素宽（真的！）。第一个分隔符图像在分隔符左侧有填充颜色，右侧完全透明。\n\
    \n重要部分是：分隔符必须与两列之间的间隙对齐。在这种情况下，我们将它放置在最左侧列和中间列之间（见图 4-22）。我们希望它落在容器宽 25% 处。因此需要完成两件事。首先，如前图所示，分隔符图像位于\
    \ 3,000 像素宽的 25% 处。因此，其中点距离左边缘 750 像素。CSS 如下：\n\n```css\n.contain {background:\
    \ url(lb01.png) 25% 0 repeat-y; overflow: auto;}\n```\n\n***129***\n\n4-22: 放置第一个背景图像。\n\
    \n看，看到了吗？背景图像中距离左边缘 750 像素（25%）的点与容器 25% 处的点对齐。只要容器宽的 25% 小于 750 像素，就没有问题！\n\n\
    在右侧分隔符处，我们只需要另一个设置类似于第一个的图像。情况下，最右侧列的宽度为 30%——宽度占 20%，两侧外边距各占 5%。这意味着我们需要分隔符落在巨大图像的\
    \ 70% 处，对于 3,000 像素的图像来说就是 2,100 像素。分隔符左侧是透明的；右侧是填充颜色。稍加 CSS 即可就位：\n\n```css\n\
    .contain {background: url(lb02.png) 0 70% repeat-y; overflow: auto;}\n```\n\n\
    无论浏览器窗口宽度如何，分隔符都会处于正确的位置；只要窗口宽度小于 3,000 像素，该技巧就不会失效。这里的小技巧：如果你想为中间列填充颜色（见图 4-24），你不需要添加任何标记。你只需要给外部容器分配一个背景颜色。\n\
    \n```css\n.contain {background: #DECADE url(lb02.png) 70% 0 repeat-y; overflow:\
    \ auto;}\n```\n\n"
