- md: "\nthe body does not always fill the viewport.\n\ngive the rule `html {background:\
    \ yellow;}` from the style sheet, though, the body will fill with white.\n\nbecause\
    \ the HTML specification says that the canvas, which is the area in which graphics\
    \ are drawn, gets its background from the html element. If there is no background\
    \ color, then it gets its background from the body element. If the body doesn’t\
    \ have a background color either, then the browser just fills in some default\
    \ color.\n\na special case described in detail in the specification; there is\
    \ no other case where a background (or any other CSS property) applies upwards\
    \ in the document tree. Just keep it in mind you’re setting an html background.\n\
    \n## R-SPECIFIC CSS\n\nHow many times have you played out the following scenario?\n\
    \n- local changes to your stylesheet(s).\n- push the changes to the staging server.\n\
    - to your browser and select Reload.\n- Nothing happens.\n- reload. Nothing happens.\n\
    \n10/5/10 7:46 PM\n10/5/10 7:46 PM\n\n***105***\n\nGo back to make sure the upload\
    \ is finished and successful.\n\nReload again. Still nothing.\n\nTry sprinkling\
    \ in !important. Upload, reload, nothing.\n\nStart swearing at your computer.\n\
    \nCheck Firebug to see what’s overriding your new styles. Discover they aren’t\
    \ being applied at all.\n\nContinue in that vein for several minutes before realizing\
    \ you were selecting Reload while looking at the live production server, not the\
    \ staging server.\n\nGo to the staging server and see all your changes.\n\nStart\
    \ swearing at your own idiocy.\n\nIt happened to me more times than I’d like to\
    \ admit. The last time it did, I realized that if I just served up a special extra\
    \ stylesheet from my staging server, one that made it obvious on the staging server\
    \ without blowing away the whole design, I’d save myself a lot of frustration.\n\
    \n`{background: url(staging-bg.png) 100% 50% repeat-y;}`\n\nIt turns out, you\
    \ can do this in a variety of ways. The most elegant is to use HTTP headers to\
    \ send out an extra stylesheet. If your Web site runs on Apache, you can do this\
    \ by adding the following line to your server’s root .htaccess file:\n\n```apache\n\
    Header add Link \"</staging.css>;rel=stylesheet;type=text/css\"\n```\n\nAll you\
    \ need is staging.css to sit at the root level of your development server, and\
    \ you’re golden. You aren’t limited to that placement, either: You can put staging.css\
    \ anywhere on the server and just modify the bracketed URL to match its new home.\
    \ You can use a fully qualified URL, like http://example.com/staging.css, if you\
    \ prefer. make sure you keep the angle brackets, because they’re required.\n\n\
    Of course, there’s always the risk that you might migrate both staging.css and\
    \ the access file to the production server. You can avoid that by not using .htaccess\
    \ to set up staging.css, but instead send it via an addition to httpd.conf. It\
    \ would look like this:\n\n```apache\n<Directory /path/to/website/rootlevel>\n\
    \    Header add Link \"</staging.css>;rel=stylesheet;type=text/css\"\n</Directory>\n\
    ```\n\nIn this, you’d alter /path/to/website/rootlevel to match your local install.\
    \ It’s just the absolute file system path to the directory where your Web site\
    \ lives. The advantage here is that you’re a lot less likely to have httpd.conf\
    \ copied from one server to another. It isn’t impossible that it would happen,\
    \ but it’s mighty close.\n\n10/5/10 7:46 PM\n10/5/10 7:46 PM\n\nThe drawback to\
    \ using HTTP headers to serve stylesheets is that it won’t work in either Explorer\
    \ or Safari. That’s why this technique is very rarely used to serve up CSS on\
    \ public sites. It’s fine in a development environment, of course, as long as\
    \ you’re using Opera as your development browser.\n\nFor those who either don’t\
    \ run Apache or can’t mess with its configuration, but still want an IIS server,\
    \ you can send CSS via HTTP headers using the directions available at https://techn.microsoft.com/en-us/library/cc753133.aspx—it\
    \ either through the IIS Manager interface or from the command line. Using PHP\
    \ for all your pages, on the other hand, then you don’t have to mess with the\
    \ configuration at all, though you do have to add a PHP directive to every page\
    \ that serves the staging-server styles. As a bonus, this approach also works\
    \ in all browsers. The simplest way is to add the following in each page’s head\
    \ element:\n\n```php\n<?php if ($_SERVER['HTTP_HOST'] == \"staging.example.com\"\
    ) { ?>\n<link rel=\"stylesheet\" href=\"staging.css\" type=\"text/css\">\n<?php\
    \ } ?>\n```\n\nSimply write out a link to a stylesheet, and if there’s a browser\
    \ that won’t support it go show any CSS anyway. A more robust solution for any\
    \ server with a certain string in its domain name or even from a local server\
    \ running on your personal machine, looks like this:\n\n```php\n<?php if (preg_match(\"\
    /staging|dev|localhost|127\\.0\\.0\\.1/\", $_SERVER['HTTP_HOST'])) { ?>\n<link\
    \ rel=\"stylesheet\" href=\"staging.css\" type=\"text/css\">\n<?php } ?>\n```\n\
    \nAlso use PHP to conditionally emit HTTP headers to bring in a stylesheet; if\
    \ you’re already doing the server detection on each page, then you may as well\
    \ just use the link element. code above should provide a good start toward working\
    \ out the details. Approaches no doubt exist for the wide variety of Web development\
    \ languages: Zachary Johnson (http://www.zachstr.com/), Alan Hogan (http://alogan.com/),\
    \ and Peter Wilson (http://lson.cc/) for pointing me to IIS directions and scholars.\n\
    \n10/5/10 7:46 PM\n10/5/10 7:46 PM\n\n**CHAPTER 4 LAYOUTS**\n\nOne of the most\
    \ designers want to do with CSS is layout is sometimes a bit more of a challenge\
    \ (that isn’t a totally straightforward way to do layout on the Web. People only\
    \ thought of table layout as simple because we got used to it.) This chapter takes\
    \ a look at some ideas for making layout simpler as well as covers a number of\
    \ common and useful layout techniques.\n\n##AD OF BORDERS\n\nI’d like to talk\
    \ about the use of outlines, which at first glance look a lot like borders but\
    \ differ in ways that are very significant to layout. Outlines can be used in\
    \ layouts, and are very handy diagnostic tools when creating and debugging layouts.\
    \ You can visualize the placement of your layout pieces using something like this\
    \ (see Figure 4-1):\n\n```css\noutline: 1px dashed red;\n```\n\nI think that the\
    \ same thing can be accomplished with border, but that’s actually false. The reason\
    \ is that borders participate in layout. Outlines do not. What I mean: Suppose\
    \ you have three column divs that are meant to fit into a container 960 pixels\
    \ wide. (If you dislike pixels, the same thing can happen with em, or any other\
    \ width measure.) You set each one to float: left; width: 320px; and are trying\
    \ to visualize exactly where the column edges sit. If you add borders, the three\
    \ divs will drop below the first two (see Figure 4-2). That’s because each has\
    \ a width of 320 pixels and then right and left borders added to that, which will\
    \ make the div’s layout box a minimum of 322 pixels wide. Multiply that by three\
    \ columns to a total of 966 pixels, which will not fit into a 960 pixel container.\
    \ Float drop!\n\n10/5/10 7:49 PM\n10/5/10 7:49 PM\n\n***109***\n"
  mdcn: "\n\n`body` 元素并不总是填满视口。\n\n不过，如果在样式表中给出了 `html {background: yellow;}` 规则，`body`\
    \ 将被填充为白色。\n\n因为 HTML 规范规定，画布（即绘制图形的区域）的背景从 `html` 元素获取。如果没有背景颜色，它将从 `body` 元素获取背景。如果\
    \ `body` 也没有背景颜色，浏览器就会填充某种默认颜色。\n\n这是规范中详细描述的一个特殊情况；在在任何其他情况下，背景（或任何其他 CSS 属性）都不会在文档树中向上应用。只需记住你正在设置一个\
    \ `html` 背景即可。\n\n## 针对服务器的 CSS\n\n你经历过以下场景多少次？\n\n- 对你的样式表进行了本地更改。\n- 将更改推送到暂存服务器。\n\
    - 回到浏览器并选择刷新。\n- 什么都没有发生。\n- 再次刷新。什么都没有发生。\n\n10/5/10 7:46 PM\n10/5/10 7:46 PM\n\
    \n***105***\n\n回去确保上传已完成并成功。\n\n再次刷新。还是什么反应没有。\n\n尝试加入 `!important`。上传，刷新，无反应。\n\
    \n开始对着你的电脑大大特骂。\n\n检查 Firebug 查看是什么覆盖了你的新样式。发现它们根本没有被应用。\n\n以此这种情绪持续了几个分钟后，你才意识到你刚才是在看实时生产服务器时点击了刷新的，而不是暂存服务器。\n\
    \n前往暂存服务器，看到你所有的更改。\n\n开始为自己的愚蠢咒骂。\n\n这种情况在我身上发生的比我愿意承认的要多。上一次发生时，我意识到如果我只是从暂存服务器提供一个特殊的额外样式表（一个让在暂存服务器上显而易见但不会破坏整个设计的文件），就能省去很多沮恼。\n\
    \n`{background: url(staging-bg.png) 100% 50% repeat-y;}`\n\n事实证明，你可以通过多种方式实现此。最优雅的方法是使用\
    \ HTTP 头部发送一个额外的样式表。如果你的网站运行在 Apache 上，你可以通过向服务器根目录下的 `.htaccess` 文件添加以下行来实现：\n\
    \n```apache\nHeader add Link \"</staging.css>;rel=stylesheet;type=text/css\"\n\
    ```\n\n你只需要让 `staging.css` 位于开发服务器的根目录下，就大功告成了。你也不局限于这个位置：你可以将 `staging.css` 放在服务器的任何地方，只需修改括号中的\
    \ URL 以匹配其新位置即可。如果你愿意，可以使用完全限定的 URL，例如 `http://example.com/staging.css`。确保保留角括号，因为它们是必须的。\n\
    \n当然，始终存在可能将 `staging.css` 和访问文件都迁移到生产服务器的风险。你可以通过不使用 `.htaccess` 设置 `staging.css`\
    \ 来避免这种情况，而是通过在 `httpd.conf` 中添加来发送它。它看起来如下：\n\n```apache\n<Directory /path/to/website/rootlevel>\n\
    \    Header add Link \"</staging.css>;rel=stylesheet;type=text/css\"\n</Directory>\n\
    ```\n\n在此处，你需要修改 `/path/to/website/rootlevel` 以匹配你的本地安装。它只是 Web 网站所在目录的绝对文件系统路径。这里的优势是，你极不太可能把\
    \ `httpd.conf` 从一台服务器复制到另一台服务器。虽然并非不可能，但可能性非常大。\n\n10/5/10 7:46 PM\n10/5/10 7:46\
    \ PM\n\n使用 HTTP 头部提供样式表的缺点是，它在 Explorer 或 Safari 中均不起作用。这就是为什么这种技术很少用于在公共网站上提供\
    \ CSS。当然，在开发环境中它是没问题的，只要你使用 Opera 作为你的开发浏览器。\n\n对于那些既不运行 Apache 又无法摆弄其配置，但仍然想要\
    \ IIS 服务器的人，你可以按照 https://techn.microsoft.com/en-us/library/cc753133.aspx 提供的说明通过\
    \ HTTP 头部发送 CSS——要么通过 IIS 器界面，要么通过命令行。另一方面，如果对所有页面都使用 PHP，那么你完全不需要处理配置了，尽管你必须向每个提供暂存服务器样式的页面添加一个\
    \ PHP 指令。作为额外，这种方法在所有浏览器中都有效。简单的方法是在每个页面的 `head` 元素中添加以下：\n\n```php\n<?php if\
    \ ($_SERVER['HTTP_HOST'] == \"staging.example.com\") { ?>\n<link rel=\"stylesheet\"\
    \ href=\"staging.css\" type=\"text/css\">\n<?php } ?>\n```\n\n只需编写指向样式表的链接，如果某个浏览器不支持它，尽管显示任何\
    \ CSS 即可。对于任何域名中包含特定字符串的服务器，甚至对于运行在你个人机器上的本地服务器，一个更健壮的解决方案如下：\n\n```php\n<?php\
    \ if (preg_match(\"/staging|dev|localhost|127\\.0\\.0\\.1/\", $_SERVER['HTTP_HOST']))\
    \ { ?>\n<link rel=\"stylesheet\" href=\"staging.css\" type=\"text/css\">\n<?php\
    \ } ?>\n```\n\n也使用 PHP 有条件地输出 HTTP 头部以引入样式表；如果你已经在每个页面上进行了服务器检测，那么你不妨直接使用 `link`\
    \ 元素。上面的代码应该为解决细节提供一个良好的开始。对于各种 Web 开发语言，无疑存在不同的方法：Zachary Johnson (http://www.zachstr.com/)、Alan\
    \ Hogan (http://alogan.com/) 和 Peter Wilson (http://lson.cc/) 为我指引了 IIS 方向和学者。\n\
    \n10/5/10 7:46 PM\n10/5/10 7:46 PM\n\n**第四章 布局**\n\n设计师想要用 CSS 做的事情之一——布局，有时更具挑战性（CSS\
    \ 布局并不是一种完全直观的布局方式，人们只是习惯了表格布局。）本章将介绍简化布局的一些想法，并涵盖许多常用且实用的布局技术。\n\n## 边框的影响\n\n\
    我想谈谈 `outline`（轮廓）的使用，它从乍上看和 `border`（边框）非常相似，但在布局方面有显著差异。`outline` 可以用于布局，并且在创建和调试布局时是非常的诊断工具。\n"
