- md: "\nShadows. Remember drop shadows? In the mid-90’s, everything had a drop shadow.\
    \ Back then the shadows were baked into images and constructed with tables even\
    \ more convoluted ways than usual. Now you can relive the glory days with some\
    \ fairly simple CSS, actually two properties available: text-shadow and box-shadow.\
    \ Take the it first. The following CSS will result in the image shown in Figure\
    \ 7-21.\n\n```css\ntext-shadow: gray 0.33em 0.25em 0.1em;\n```\n\nThe first (0.33em)\
    \ indicates a horizontal offset; the second (0.25em), a vertical offset. The third\
    \ is a blur radius, which is the degree by which the shadow is blurred. These\
    \ values take any length unit, so if you want to do all your shadow offsets and\
    \ blurs in pixels, go to pixels. Blur radius can’t be negative, but offsets can:\
    \ A negative horizontal offset will push the shadow to the left, and a negative\
    \ vertical offset will go upward.\n\nDropping shadows from a heading.\n\nIn Figure\
    \ 7-22, you even have multiple shadows! Of course, whether you should is a matter\
    \ opinion.\n\n```css\ntext-shadow: gray 0.33em 0.25em 0.1em, -10px 4px 7px blue;\n\
    ```\n\nThe color of a shadow can come before all the lengths or after them, whichever\
    \ you prefer. You also note that the CSS 3 specification says that the first shadow\
    \ is “on top,” which is intuitive. Shadows after that are placed successively\
    \ further away from you as you look at them. Thus, the gray shadow is placed over\
    \ the top of the blue shadow.\n\nShadowing element boxes (see Figure 7-23). It’s\
    \ pretty much the same drill, only with a different name.\n\n```css\nbox-shadow:\
    \ gray 0.33em 0.25em 0.25em;\n```\n\nheading with multiple shadows.\n\n7-23: Shadowing\
    \ the element box of a heading.\n\nEven though there’s no obvious element box\
    \ for the h1, a shadow is generated anyway. It’s also drawn only outside the element,\
    \ which means that you can’t see it behind/beneath the element, even when the\
    \ element has a transparent (or, with RGBA colors, semi-transparent) background.\
    \ The shadows are drawn just beyond the border edge, so you’re probably better\
    \ off putting a border or a visible background (or both) on any shadowed box.\
    \ You can have more than one box shadow, as depicted in Figure 7-24, just like\
    \ you can with shadows.\n\n```css\nbox-shadow: gray 0.33em 0.25em 0.25em, -10px\
    \ 2px 6px blue;\n```\n\n7-24: Multiple shadows on the element box of a heading.\n\
    \nIt’s where I have to admit a small fib: The previous examples are the ideal\
    \ cases. As of this writing, they wouldn’t actually work in browsers. In fact,\
    \ the figures were produced using a different syntax than what’s shown in the\
    \ text. As of mid-2010, to make the single-shadow work, you’d actually need to\
    \ say:\n\n```css\n-moz-box-shadow: gray 0.33em 0.25em 0.25em;\n-webkit-box-shadow:\
    \ gray 0.33em 0.25em 0.25em;\nbox-shadow: gray 0.33em 0.25em 0.25em;\n```\n\n\
    This will cover all modern browsers as of mid-2010. Over time, the need for the\
    \ prefixed properties (-moz- and –webkit-) will fade and you’ll be able to just\
    \ write the single-shadow declaration. When exactly will that happen? It all depends\
    \ on your design, your visitors, and your own sense of comfort.\n\nIf you also\
    \ want to get drop shadows on boxes in older versions of Internet Explorer, then\
    \ you’ll need to add in the IE-only Shadow Filter. See http://robertnyman.com/2003/16/drop-shadow-with-css-for-all-web-browsers/\
    \ for details.\n\n## MULTIPLE BACKGROUNDS\n\nOne of the really nifty things in\
    \ CSS 3 is its support for multiple background images on an element. If you’ve\
    \ ever nested multiple div elements just to get a bunch of background images to\
    \ show up, this section is for you.\n\nExample, this simple set of styles and\
    \ markup to present a quotation, the result of which is shown in Figure 7-25:\n\
    \n```css\n.blockquote {\n  background-color: #F0FFEE;\n  font-family: Georgia,\
    \ serif;\n  font-size: 195%;\n  padding: 80px 40px;\n  width: 16em;\n  margin:\
    \ 2em auto;\n  font-style: italic;\n  display: block;\n  text-align: right;\n\
    \  position: relative;\n}\n\n<blockquote class=\"quote\">\n  Christopher Benson\
    \ has a way of making itself up in the background, and it suddenly becomes what\
    \ one means to do.\n</blockquote>\n\n```css\n {\n  background: url(bg01.png) top\
    \ left no-repeat;\n  background-color: #FFF;\n}\n```\n\n7-25: Adding a single\
    \ background.\n\nWhat if you want a little quarter-wheel in every corner (see\
    \ Figure 7-26)? Previously, you would have nested a bunch of divs just inside\
    \ the blockquote div. With CSS 3, just keep them to the background declaration\
    \ and separate each background value to get multiple backgrounds (see Figure 7-27).\n\
    \n```css\nblockquote {\n  background: url(bg01.png) top left no-repeat,\n  url(bg02.png)\
    \ top right no-repeat;\n  background-color: #FFF;\n}\n```\n\n7-27: Applying two\
    \ backgrounds to the same element.\n\nThe effect here is extremely similar to\
    \ nesting a bunch of divs. It’s just that with CSS 3, you don’t have to bother\
    \ any more.\n\n```css\nblockquote {\n  background: url(bg01.png) top left no-repeat,\n\
    \  url(bg02.png) top right no-repeat,\n  url(bg03.png) bottom right no-repeat,\n\
    \  url(bg04.png) bottom left no-repeat;\n  background-color: #FFF;\n}\n```\n\n\
    7-28: Applying four backgrounds to a single element.\n\nThe transparency extends\
    \ into the way background are composited together. You may have to split out the\
    \ background-color declaration in order to have a nice fall at white. But what\
    \ if you wanted to fold it into the background declaration? After all, each of\
    \ these comma-separated values sets up its own layer. If you put the color in\
    \ the wrong place, one or more images will be overwritten by it. The answer is\
    \ the last of the values.\n\nUse the multiple background go from “highest”—that\
    \ is, closest to you as you look—to “lowest”—furthest away from you. If you put\
    \ the color on the first background, it would sit “above” all the others. This\
    \ means that if you want some kind of patterned background behind all the others\
    \ (as Figure 7-29), it needs to come last and you need to make sure to shift any\
    \ background color.\n\n```css\nblockquote {\n  background: url(bg01.png) top left\
    \ no-repeat,\n  url(bg02.png) top right no-repeat,\n  url(bg03.png) bottom right\
    \ no-repeat,\n  url(bg04.png) bottom left no-repeat,\n  url(bgparch.png) center\
    \ repeat;\n  background-color: #FFF;\n}\n```\n\n7-29: element, five backgrounds.\n\
    \nBecause of the possible complexities involved, I prefer to split out any default\
    \ background color its own declaration, as shown earlier. Thus I’d write the preceding\
    \ as:\n\n```css\nblockquote {\n  background: url(bg01.png) top left no-repeat,\n\
    \  url(bg02.png) top right no-repeat,\n  url(bg03.png) bottom right no-repeat,\n\
    \  url(bg04.png) bottom left no-repeat;\n  background-color: #FFF;\n}\n```\n\n\
    When you use the separate property, the color is placed behind all the images\
    \ and you don’t to worry about shifting it around if you reorder the images or\
    \ add new images to the pile.\n\nAn alternate way of writing the preceding styles\
    \ would be:\n\n```css\nblockquote {\n  background-repeat: no-repeat, no-repeat,\
    \ no-repeat, no-repeat, repeat;\n  background-image: url(bg01.png), url(bg02.png),\
    \ url(bg03.png), url(bg04.png), bgparch.png;\n  background-position: top left,\
    \ top right, bottom right, bottom left, center;\n  background-color: #FFF;\n}\n\
    ```\n\nDifferent format, same result. This probably looks more verbose, and in\
    \ this case it really is. If you drop the parchment background, which would result\
    \ in the screenshot, then you could simplify the first declaration quite a bit:\n\
    \n```css\nblockquote {\n  background-repeat: no-repeat;\n  background-image: url(bg01.png),\
    \ url(bg02.png), url(bg03.png), url(bg04.png);\n  background-position: top left,\
    \ top right, bottom right, bottom left;\n  background-color: #FFF;\n}\n```\n\n\
    7-30: Similar background, alternate syntax.\n"
  mdcn: "\n阴影。记得投影阴吗？在 20 世纪 90 年代，万物都有投影阴。那时候，阴影是嵌入在图像中的，并用比通常更复杂的表格方式构建的。现在，你可以通过非常简单的\
    \ CSS 来重温那些黄金时代，实际上有两个可用的属性：`text-shadow` 和 `box-shadow`。先看后一个。下面的 CSS 将产生图 7-21\
    \ 所示的图像。\n\n```css\ntext-shadow: gray 0.33em 0.25em 0.1em;\n```\n\n第一个（0.33em）表示水平偏移；第二个（0.25em）表示垂直偏移。第三个是模糊半径，即阴影模糊的程度。这些值可以接受任何长度单位，所以如果你想对所有的阴影偏移和模糊都使用像素，就用像素即可。模糊半径不能为负数，但偏移可以是：负的水平偏移会将阴影向左推，而负的垂直偏移则会让阴影向上移动。\n\
    \n为标题添加投影阴。\n\n在图 7-22 中，你甚至有了多个阴影！当然，是否应该这样做取决于主观意见。\n\n```css\ntext-shadow:\
    \ gray 0.33em 0.25em 0.1em, -10px 4px 7px blue;\n```\n\n阴影的颜色可以放在所有长度之前，也可以在之后，取决于你的喜。你还会注意到\
    \ CSS 3 规范说第一个阴影在“最上方”，这是很直观的。随后的阴影在你观察它们时，会被依次放置在离你越来越远的地方。因此，灰色阴影放置在蓝色阴影之上。\n\
    \n为元素框添加阴影（见图 7-23）。这几乎是一样的操作，只是名称不同。\n\n```css\nbox-shadow: gray 0.33em 0.25em\
    \ 0.25em;\n```\n\n带有多个阴影的标题。\n\n7-23：为标题的元素框添加阴影。\n\n尽管 h1 没有明显的元素框，阴影仍然会被生成。它也只绘制在元素之外，这意味着即使元素具有透明（或使用\
    \ RGBA 颜色时为半透明）背景，你也无法在元素后面或下方看到它。阴影刚好绘制在边界边缘之外，所以你可能给任何带阴影的框添加边界或可见的背景（或两者都有）会更好。你可以有多个框投影，如图\
    \ 7-24 所示，就像你可以有阴影一样。\n\n```css\nbox-shadow: gray 0.33em 0.25em 0.25em, -10px\
    \ 2px 6px blue;\n```\n\n7-24：标题元素框上的多个阴影。\n\n在这里我必须承认一个小谎言：之前的示例是理想情况。在写此本文时，它们在浏览器中实际上并不能工作。事实上，这些图表是使用与文中不同的语法生成的。截至\
    \ 2010 年中期，为了让单阴影生效，你实际上需要写：\n\n```css\n-moz-box-shadow: gray 0.33em 0.25em 0.25em;\n\
    -webkit-box-shadow: gray 0.33em 0.25em 0.25em;\nbox-shadow: gray 0.33em 0.25em\
    \ 0.25em;\n```\n\n这将涵盖截至 2010 年中旬的所有现代浏览器。随着时间的推移，对前缀属性（-moz- 和 -webkit-）的需求将会消失，你将能够只写单阴影声明。具体何时会发生呢？这完全取决于你的设计、你的访问者以及你自己的舒适感。\n\
    \n如果你还想在旧版本的 Internet Explorer 中为框添加投影阴，那么你就需要添加 IE 专用的阴影滤（Shadow Filter）。详情请参见\
    \ http://robertnyman.com/2003/16/drop-shadow-with-css-for-all-web-browsers/。\n\
    \n## 多重背景\n\nCSS 3 中真正巧妙的特性之一是它支持在元素上使用多个背景图像。如果你曾经为了嵌套多个 div 元素只为了显示出一堆背景图像，那么这一节就是为你准备的。\n\
    \n例如，这组简单的样式和标记用于展示一段引用，其结果如图 7-25 所示：\n\n```css\n.blockquote {\n  background-color:\
    \ #F0FFEE;\n  font-family: Georgia, serif;\n  font-size: 195%;\n  padding: 80px\
    \ 40px;\n  width: 16em;\n  margin: 2em auto;\n  font-style: italic;\n  display-align:\
    \ right;\n  position: relative;\n}\n\n<blockquote class=\"quote\">\n  Christopher\
    \ Benson 有一种方式可以在背景中让自己编造，并突然变成了人们想要做的事。\n</blockquote>\n\n```css\nblockquote\
    \ {\n  background: url(bg01.png) top left no-repeat;\n  background-color: #FFF;\n\
    }\n```\n\n7-25：添加单个背景。\n\n如果你想在每个角都放一个小四分之一轮（见图 7-26）会怎样？以前，你会在 blockquote div\
    \ 内部嵌套一堆 divs。使用 CSS 3，只需将它们保持在背景中即可（见图 7-27）。\n\n```css\nblockquote {\n  background:\
    \ url(bg01.png) top left no-repeat;\n  background-color: #FFF;\n}\n```\n\n7-27：应用两个背景。\n\
    \n在元素上，这种效果与嵌套一堆 divs 非常相似。使用 CSS 3，你只需将它们保持在背景声明中而不需要。\n\n```css\nblockquote\
    \ {\n  background: url(bg01.png) top left no-repeat;\n  url(bg02.png) top right\
    \ no-repeat;\n  background-color: #FFF;\n}\n```\n\n7-28：在单个元素上应用四个背景。\n\n如果你把背景颜色放在错误的位置，会怎样？毕竟，这些背景值是叠加的。\n\
    \n```css\nblockquote {\n  background: url(bg01.png) top left no-repeat;\n  url(bg02.png)\
    \ top right no-repeat;\n  url(bg03.png) bottom right no-repeat;\n  url(bg04.png)\
    \ bottom left no-repeat;\n  background-color: #FFF;\n}\n```\n\n7-29：元素，应用五个背景。\n\
    \n由于涉及的可能的复杂性，我更倾向于将任何背景颜色分开写，如前文所示。因此，我会写前面的：\n\n```css\nblockquote {\n  background:\
    \ url(bg01.png) top left no-repeat;\n  url(bg02.png) top right no-repeat;\n  url(bg03.png)\
    \ bottom right no-repeat;\n  url(bg04.png) bottom left no-repeat;\n  url(bgparch.png)\
    \ center repeat;\n  background-color: #FFF;\n}\n```\n\n当你使用分开的属性时，颜色放置在所有图像之后，当你重新排序图像或向堆中添加新图像时，你不需要移动它。\n\
    \n编写前面的样式的另一种方式是：\n\n```css\nblockquote {\n  background-repeat: no-repeat, no-repeat,\
    \ no-repeat, no-repeat, repeat;\n  background-image: url(bg01.png), url(bg02.png),\
    \ url(bg03.png), url(bg04.png), bgparch.png;\n  background-position: top left,\
    \ top right, bottom right, bottom left, center;\n  background-color: #FFF;\n}\n\
    ```\n\n不同的格式，相同的结果。这看起来看起来冗长，而且在这种情况下确实如此。如果你丢掉羊皮背景（这将导致截图），那么你可以大幅简化第一个声明了：\n\
    \n```css\nblockquote {\n  background-repeat: no-repeat;\n  background-image: url(bg01.png),\
    \ url(bg02.png), url(bg03.png), url(bg04.png);\n  background-position: top left,\
    \ top right, bottom right, bottom left;\n  background-color: #FFF;\n}\n```\n\n\
    7-30：相似的背景，另一种语法。\n\n"
