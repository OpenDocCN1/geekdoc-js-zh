  mdcn: "\n正在绘制第二张背景图像。\n\n为第三列填充背景颜色。\n\n颜色“透出”背景图像的透明部分，一切正常。\n\n在你不希望填充列背景，但只需要适用于流式布局的分割符的情况下，你可以使用相同的\
    \ CSS 并替换图像。你只需要垂直重复的、没有额外宽度的分隔符图像；因此，它们的宽度可以是 2 像素、5 像素或任意多个像素，以仅包含分隔符。然后你使用与之前相同的\
    \ CSS 将它们垂直重复。\n\n```css\n. {background: url(sep01.png) 25% 0 repeat-y; overflow:\
    \ auto;}\n.tain {background: url(sep02.png) 75% 0 repeat-y; overflow: auto;}\n\
    ```\n\n这就足够了。如果你发现分割符在水平方向偏移了一个或两个像素，只需为分隔符图像添加一或两个像素的透明度即可。\n\n## 单真布局 (ONE TRUE\
    \ LAYOUT)\n\n这种布局技术的名字带有一丝幽默感，但它的用处不容置疑。它由 Alex Robinson 在 2005 年底流行（参见 http://positionindependent.net/articles/onetruelayout/），其核心信息是：你可以让列以独立于文档源码的顺序进行排列。这是对简单浮动列（见前面的章节）的重大改进，后者的布局是与源码顺序绑定的。\n\
    \n要实现这一目标，你只需要将列放在 `div` 中，并使用一些 CSS。不需要额外的容器元素，这与之前允许独立于源码的布局的尝试不同了。\n\n按照惯例，先从三列开始。在这种情况下，页面的“主内容”在第一列，而“次要”内容和导航链接进入后两列。\n\
    \n```html\n<div class=\"column one\">...</div>\n<div class=\"column two\">...</div>\n\
    <div class=\"column three\">...</div>\n```\n\n开始操作，我们将它们全部向左浮动并设置一些宽度（参见图 4-25）。为了简单起见，我们将使用像素宽度，但请注意，这种方法使用\
    \ em 或百分比同样有效。（唯一的限制是所有列在宽度上必须使用相同的单位，即使这一点也是灵活的。）\n\n```css\n.column {float:\
    \ left; padding: 0 20px; margin: 0 20px;}\n.one, .three {width: 200px;}\n.two\
    \ {width: 300px;}\n```\n\n绘制这三列。\n\n现在假设我们想让第一列在中间，第二列在右侧，第三列在左侧，如图 4-26 所示。这需要另外两条规则：\n\
    \n```css\n.one {height: 300px; margin-left: 300px;}\n.three {margin-left: -920px;}\n\
    ```\n\n全部就是这样。\n\n它有效吗？嗯，第一列的左外边距将其推开，打开出一个巨大的空间，其宽度与第三列的整体相同——包括内容、内边距加上第一列原始的左边距（20\
    \ 像素）。在准备好之后，第三列的外边距将它向左拉，超过前面的两列，并消除了第一列顶部的左边距。这就足够了。\n\n如果我们想要第二列在左侧，第三列在右侧，只需移动列的位置（参见图\
    \ 4-27）。这很简单。保留 `.one` 规则并去掉 `.three` 规则，添加这条规则：\n\n```css\n.two {margin-left:\
    \ -640px;}\n```\n\n主意完全相同。只需要确保为应该放在那里的列留出空间，然后将该列拉相应的距离。\n\n你也可以将这一切反过来，向右移动：\n\
    \n```css\n. {float: right; padding: 0 20px; margin: 0 20px;}\n.one {width: 200px;}\n\
    .two {width: 300px; margin-right: 320px;}\n.three {margin-right: -640px;}\n```\n\
    \n不仅限于三列。如果你有四列、五列甚至更多列，你可以按照任何喜欢的顺序排列它们。当然，随着列数量的增加，情况会变得复杂，但如果这很容易，任何人都能做到，对吧？\n\
    \n如果你想在浏览器窗口中居中列，你需要在列周围放置一个容器。类似这样的：\n\n```html\n<div style=\"width: 1000px;\
    \ margin: 0 auto;\">\n  <div class=\"column one\">...</div>\n  <div class=\"column\
    \ two\">...</div>\n  <div class=\"column three\">...</div>\n</div>\n```\n\n早些，在此提示中使用像素是因为它们让数学计算更容易理解。然而，该技术并不依赖像素。你可以使用基于百分比的列（参见图\
    \ 4-28）来实现同样的效果，获得那种流动感：\n\n```css\n. {float: right; padding: 0 2.5%; margin:\
    \ 0 2.5%;}\n.one {width: 20%;}\n.two {width: 30%; margin-right: 32.5%;}\n.three\
    \ {margin-right: -70%;}\n```\n\n## 圣杯 (HOLY GRAIL)\n\n作为“单真布局”，圣圣圣杯技术是另一个带有幽默名字的严肃工具。它在“单真布局”出现几个月后由\
    \ Matthew Levine 推广，在 Alex 的基础上加入了一些贡献，创建了独立于源码顺序的混合布局。（参见 http://positionindependent.com/articles/holygrail\
    \ 获取原始内容。）\n"
