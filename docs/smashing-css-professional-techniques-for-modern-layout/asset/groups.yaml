- md: "\n***215***\n\none thing to watch out for with this approach is that it will\
    \ be spoiled by any colored table cells. But then, if you’re making your cells\
    \ span columns, you probably aren’t using full-column styling anyway. (Well, okay,\
    \ you are. But most people aren’t.) If you’re using column-spanning cells, then\
    \ classes are probably your best bet.\n\n## MAPPING\n\nThere are times when you\
    \ have a bunch of data that has geographic relevance: sales figures by state,\
    \ polling results by region, that sort of thing. The data is usually best structured\
    \ as a table, that doesn’t mean that you have to lay it out that way. In fact,\
    \ why not put it onto a map? To do this, you really need two things besides the\
    \ CSS. First you need the appropriate classes IDs in the markup. Here’s part of\
    \ the markup for a U.S.-states example.\n\n```html\n<table>\n  <thead>\n    <tr>\n\
    \      <th scope=\"col\">State</th>\n      <th scope=\"col\">Representatives</th>\n\
    \    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <th scope=\"row\">AL</th>\n\
    \      <td>7</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">AK</th>\n    \
    \  <td>1</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">WY</th>\n      <td>1</td>\n\
    \    </tr>\n  </tbody>\n</table>\n```\n\nThat plus 47 other rows of data now need\
    \ to be placed onto a map. And that’s the second thing you need: an image of the\
    \ map (Figure 6-9).\n\nWith the map, you can start figuring out where you want\
    \ to place your data. In this case, what is the approximate midpoint of each state.\
    \ My approach is to open the image up in an editor like Photoshop and use it to\
    \ figure out the X,Y coordinates of each point, write them down in a list. Thus:\n\
    \n| X | Y |\n| :--- | :--- |\n| 692 | 448 |\n| 210 | 560 |\n| 330 | 300 |\n\n\
    The points where you’ll place each bit of data. But don’t stop with just plain\
    \ pixel values; these need to be converted to percentages of the image’s dimensions.\
    \ This map is an image of 1000x700 pixels. Thus, divide each horizontal measure\
    \ by 1,000 and each vertical measure by 700 to get:\n\n| Pixel | Percentage |\n\
    | :--- | :--- |\n| 692 | 69.2% |\n| 448 | 64% |\n| 210 | 21% |\n| 560 | 80% |\n\
    | 330 | 33% |\n| 300 | 42.9% |\n\n***Setting the list aside for a moment, because\
    \ now you start writing the CSS to get things rolling. First, make sure the map\
    \ will show up:\n\n```css\ntable * {margin: 0; padding: 0; font: 1em/sans-serif;}\n\
    table {display: block; width: 1000px; height: 700px; background: url(us-state-map.gif)\
    \ no-repeat;}\n```\n\nNow, the map’s in place, but the data is all on the left\
    \ side, not stretched out (see Figure 6-10). Looks, right, no? It’s because the\
    \ table cells are all hanging together in the manner of a table, the table element\
    \ itself is no longer acting as a table usually does. It’s now generating a block\
    \ box, just like any div would do. Thus, the layout association between the table\
    \ element and the rows and cells and everything else has been broken. Yes, really.\
    \ We need to get all bits of data into place. The first step is to get them all\
    \ to generate blocks and then position them all (In theory, positioning them forces\
    \ them to generate blocks, but I like to explicitly declare a temporary border\
    \ so you can see where things go (see Figure 6-11)).\n\n```css\ntd {display: block;\
    \ position: absolute; top: 0; left: 0; color: #527435; border: 1px dotted red;}\n\
    ```\n\nThe map and the data.\n\nPositioning the data, step one: they’re all in\
    \ the top-left corner of the map instead of their proper spots. This list of percentages\
    \ comes in handy. Each horizontal percentage becomes the left offset, and each\
    \ vertical percentage is a top value (see Figure 6-12).\n\n```css\n69.2%; top:\
    \ 64%;\n21%; top: 80%;\n33%; top: 42.5%;\n```\n\nThey’re mostly in place. The\
    \ reason they aren’t lined up is that the midpoint (or at least the center) of\
    \ each state was selected when you wrote down the list. Supplying these percentages\
    \ as the offsets for top and left places the top-left corner of those chosen points.\
    \ Thus the positioned tr elements sit below and to the right of the points.\n\n\
    Placing the data into each state is also the problem of all those tiny Northeastern\
    \ states having their data overlap each other, but that’s something to tackle\
    \ later.) The easiest way to overcome this is to assign each tr a width and height,\
    \ and then pull it up to the left by half the assigned dimensions. A little experimentation\
    \ arrives at the following (see also Figure 6-13):\n\n```css\nposition: absolute;\
    \ top: 0; left: 0; width: 2em; height: 2em; margin-left: -1em; margin-top: -1em;\
    \ color: #527435; border: 1px dotted red;}\n```\n\nAdjusting the placement of\
    \ each data box.\n\nAfter that! The data’s all more or less where you wanted it.\
    \ There’s certainly room for improvement—for example, Florida’s box seems a little\
    \ bit off—but things are coming relatively nicely. Outside of the Northeast, anyway.\
    \ The text is a little out of alignment—lean up that and a few other things.\n\
    \n```css\nposition: absolute; top: 0; left: 0; width: 2em; height: 2.2em; margin-left:\
    \ -1em; margin-top: -1.1em; color: #527435;\ntbody td {text-align: center; font-weight:\
    \ bold; border-bottom: 1px solid gray;}\n```\n\n***221***\n\nThe map and the data.\n\
    \nActually going to let this stand as is. It serves as a perfect illustration\
    \ of why you have to be careful when mapping data onto a table. Yes, there are\
    \ ways to hide pieces of data in those tiny states and then revealing them on\
    \ hover. A better way is to pick a map that has enough space for each state’s\
    \ data could then be placed at the end of each callout line. I’ll leave it to\
    \ your imagination.\n\nThe table is:\n\n```html\n<table summary=\"Server hits\
    \ and pageviews for meyerweb.com over the period\">\n  ...\n</table>\n```\n"
  mdcn: "\n\n***215***\n\n使用这种方法需要注意的一点是，任何颜色的表格单元格都会破坏效果。不过，如果你正在让单元格跨列显示，你可能根本没有使用全列宽样式。（嗯，好吧，你确实用了。但大多数人并没有这样做。）如果你正在使用跨列单元格，那么类（classes）可能是你的最佳选择。\n\
    \n## 映射（MAPPING）\n\n有时你可能拥有一组具有地理相关的数据：例如按州划分的销售额、按地区划分的民意调查结果等。数据最好的结构通常是表格，并不意味着你必须以那种方式布局。事实上，为什么不把它们放在地图上呢？要做到这一点，除了\
    \ CSS 之外，你还需要另外两个东西。首先，你需要在标记中准备好相应的类 ID。以下是一个美国州示例的部分标记代码。\n\n```html\n<table>\n\
    \  <thead>\n    <tr>\n      <th scope=\"col\">State</th>\n      <th scope=\"col\"\
    >Representatives</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <th scope=\"\
    row\">AL</th>\n      <td>7</td>\n    </tr>\n    <tr>\n      <th scope=\"row\"\
    >AK</th>\n      <td>1</td>\n    </tr>\n    <tr>\n      <th scope=\"row\">WY</th>\n\
    \      <td>1</td>\n    </tr>\n  </tbody>\n</table>\n```\n\n加上其他 47 行数据，现在需要被放置在地图上。这就是你需要的第二个东西：一张地图图片（图\
    \ 6-9）。\n\n有了地图，你就可以开始考虑想把数据放在哪里。在这种情况下，每个州的近似中点在哪里。我的方法是用 Photoshop 等编辑器打开图片，利用它来确定每个点的\
    \ X、Y 坐标，并将它们写在列表中。如下：\n\n| X | Y |\n| :--- | :--- |\n| 692 | 448 |\n| 210 | 560\
    \ |\n| 330 | 300 |\n\n这些是你放置每个数据点。但不要只停留在简单的像素值；这些值需要转换为图像尺寸的百分比。这张地图是 1000x700\
    \ 像素的图像。因此，将每个水平测量值除以 1,000，将每个垂直测量值除以 700，得到：\n\n| 像素 | 百比 |\n| :--- | :--- |\n\
    | 692 | 69.2% |\n| 448 | 64% |\n| 210 | 21% |\n| 560 | 80% |\n| 330 | 33% |\n\
    | 300 | 42.9% |\n\n***先搁一下列表，因为现在你要开始编写 CSS 让一切运转起来了。首先，确保地图能够显示：\n\n```css\n\
    table * {margin: 0; padding: 0; font: 1em/sans-serif;}\ntable {display: block;\
    \ width: 1000px; height: 700px; background: url(us-state-map.gif) no-repeat;}\n\
    ```\n\n现在，地图已经就位，但所有数据都在左侧，没有拉伸（见图 6-10）。看起来不太对，对吧？这是因为表格单元格仍然以表格的方式聚在一起，而 `table`\
    \ 元素本身不再像通常那样起作用。它现在正在生成一个块级盒子（block box），就像任何 `div` 这样做一样。因此，`table` 元素与行、单元格以及其他一切之间的布局关联已经打破了。是的，真的。我们需要把所有数据位都放到位置。第一步是让它们全部生成块，然后对它们进行定位（在理论上，定位会强制它们生成块，但我喜欢显式地声明一个临时边界，这样你就能看到东西所在的位置（见图\
    \ 6-11)).\n\n```css\ntd {display: block; position: absolute; top: 0; left: 0;\
    \ color: #527435; border: 1px dotted red;}\n```\n\n地图和数据。\n\n定位数据的第一步：它们都在地图的左上角，而不是它们应该的位置。这个百分比列表派上用场了。每个水平百分比变成左偏移量，每个垂直百分比是顶部偏移值（见图\
    \ 6-12）。\n\n```css\n69.2%; top: 64%;\n21%; top: 80%;\n33%; top: 42.5%;\n```\n\n\
    它们大部分已经到位了。它们之所以没有对齐，是因为在你写列表时选择的是每个州的中点（或至少是中心）。提供这些百分比作为顶部和左侧的偏移，放置的是所选点的左上角。因此，定位后的\
    \ `tr` 元素位于所选点的下方和右侧。\n\n将数据放入每个州中，仍然是那些微小的东北部州数据相互重叠的问题（但那是以后要处理的事情）。克服这一点最简单的方法是给每个\
    \ `tr` 分配宽度和高度，然后按照分配尺寸的一半将其向左上方移动。经过一些实验，得到了以下结果（另见图 6-13）：\n\n```css\nposition:\
    \ absolute; top: 0; left: 0; width: 2em; height: 2em; margin-left: -1em; margin-top:\
    \ -1em; color: #527435; border: 1px dotted red;}\n```\n\n调整每个数据框的位置。\n\n完成！数据大体上都处于你想要的地方。显然还有改进空间——例如，佛罗里达州的框似乎有点偏——但整体看起来还不错。至少在东北部之外是如此。文本有点没对齐——调整一下以及其他一些问题。\n\
    \n```css\nposition: absolute; top: 0; left: 0; width: 2em; height: 2.2em; margin-left:\
    \ -1em; margin-top: -1.1em; color: #527435;\ntbody td {text-align: center; font-weight:\
    \ bold; border-bottom: 1px solid gray;}\n```\n\n***221***\n\n地图和数据。\n\n实际上打算让它保持现状。它完美地说明了为什么在将数据映射到表格上时必须小心。是的，确实有方法可以隐藏那些微小州中的数据片段，并在悬停时显示它们。更好的方法是选择一张有足够空间放置每个州数据的地图，然后数据可以放置在每行标注文字的末尾。我把这留给你的想象吧。\n\
    \n表格是：\n\n```html\n<table summary=\"Server hits and pageviews for meyerweb.com\
    \ over the period\">\n  ...\n</table>\n```\n\n"
