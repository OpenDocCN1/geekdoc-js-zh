    ## RING BLOCK BOXES


    you want to center a whole element within its container (even when that container
    is at big dotted outlines). There isn’t a specific element-centering property
    in CSS, but you can get the effect with margins.


    If you have a tightly locked layout, then it’s pretty simple: Figure out how much
    space you have left on each side of the centered element, and set up the appropriate
    margins (see Figure 4-4):


    ```css

    main {width: 800px;}

    #main {width: 760px; margin: 0 auto 20px;}

    ```


    In this case, it’s just simple math. In fact, you wouldn’t even need the div#main
    rule. You can use padding on the container:


    ```css

    main {width: 760px; padding: 0 20px;}

    ```


    As a result, different approach:


    on where you have an element with a specific width but you don’t know how large
    the container will be, you still use margins. You just get a little sneaky about
    it.


    ### 4-4: One box centered inside another.


    Consider a situation where a div is the child of the body element. You want to
    center that, but, because every browser window can be a different width, you don’t
    know how wide the body will be. As long as you’re giving the div a specific width,
    no problem: auto the right and left margins (see Figure 4-5).


    ```css

    main {width: 55em; margin: 0 auto;}

    ```


    This works because the CSS specification says that when an element has a specific
    width, and the right and left margins are automatically determined, then the browser
    takes the difference between the widths of the element and its container, splits
    that difference in half, applies one half to the left margin and the other to
    the right. Thus the box is centered.


    It will not center the text within that box, of course. If you want to do that
    too (see also Figure 4-6):


    ```css

    main {width: 55em; margin: 0 auto; text-align: center;}

    ```


    Note that in a case where the div is wider than its container, browsers will left-justify
    the box (the content) in left-to-right languages, and right-justify the box in
    right-to-left languages.


    centering a box with auto-margins.


    centering a box with auto-margins and text with **text-align**.


    ## FLOAT CONTAINMENT: OVERFLOW


    The floats are such an important part of current CSS layout, it’s often the case
    that you need an element that contains some floats that stretch around them. This
    doesn’t happen by default (for some perfectly good reasons; see the first part
    of http://complexspiral.com/publications/containing-floats/ for details) so you
    can get situations like the following:


    ```css

    main {border: 2px dashed gray; background: #9AC;}

    column {float: left; width: 28%; margin: 0 1%; padding: 0 1%;}

    ```


    What is that dashed line above the top of the columns in Figure 4-7? That’s the
    full border around #main. It’s just that the div is zero pixels tall with the
    floated column divs sticking out (Again, this is not a bug or a flaw in CSS; see
    the previously cited URL for an explanation why.).


    4-7: A collapsed box failing to visually contain its floated descendants.


    Number of options will get div#main to “stretch around” the floated columns. The
    simplest is to exploit the behavior of overflow (see Figure 4-8):


    ```css

    main {border: 2px dashed gray; background: #9AC; overflow: auto;}

    ```


    Using **overflow** to visually contain floated descendants. Yes, there’s a reason.
    No, we’re not going to dig through it here (But if you’re in a hurry, see section
    10.6.7). If you want to be sure sidestep some glitches in IE, add an explicit
    width to your overflow element:


    ```css

    main {border: 2px dashed gray; background: #9AC; overflow: auto; width: 100%;}

    ```


    value doesn’t have to be exactly 100%: It can be anything that isn’t auto. And
    it has to be there to keep older versions of IE from so themselves. If you don’t
    support older versions of IE, then you can drop the width declaration entirely.
    Advantage with this approach is that it leaves the containing element (div#main)
    in the width of the document. That means that it will keep any following content
    below it, even if it’s narrower than the following content. It will also default
    to be as wide as its container. However, since our example gives div#main borders,
    declaring width: auto will prevent that—the whole element, including borders,
    will actually stick out of its containing element by four pixels—but then you
    might get old-IE problems.


    you want to clear whatever element comes next. If it’s a known element, you can
    just assign it, something like this (assuming the footer comes after div#main):


    ```css

    {clear: left;}

    ```


    If you know for sure that the same element will always follow div#main, then you
    can use the adjacent-sibling combinator with the universal selector (see Figure
    4-10):


    ```css

    * {clear: left;}

    ```


    adjacent siblings and **clear** to push the footer below floated columns.


    ## FLOAT CONTAINMENT: FLOATING


    Another technique for containing floats is to float the container.


    ```css

    main {border: 2px dashed gray; background: #9AC; float: left;}

    column {float: left; width: 28%; margin: 0 1%; padding: 0 1%;}

    ```


    works because floats are defined to contain any descendant elements. They’re also
    defined to be as wide as necessary for their contents, and no wider. In this particular
    case, that be dangerous: the columns are set to be one-third the width of div#main,
    but because it is floated, the browser gets to decide how wide or narrow div#main
    gets to be. The result is easily fixed by giving div#main an explicit width (see
    Figure 4-9):


    ```css

    main {border: 2px dashed gray; background: #9AC; float: left; width: 100%;}

    ```


    4-9: Using **float** to visually contain floated descendants.


    looks the same as Figure 4-8, doesn’t it? And yet the two were generated using
    CSS. This is one of those places where you have more than one way to get to the
    result, and choosing which is a matter of preference and the project in question.


    In, div#main will stick out a little bit farther to the right (by four pixels)
    due to the width and border. Because floats aren’t in the normal flow, though,
    we can’t just float: auto and be done with it. Doing that with a floated element
    just means it stays wide or narrow as the browser decides is necessary. If you
    float a box like this, you run the risk of following normal-flow content next
    to it. To prevent that, you probably want to clear whatever element comes next.


    There’s one more thing to be wary about: the value of auto for overflow means
    that a browser, if it decided it was necessary, place scrollbars on div#main.
    This doesn’t seem to come up in practice, but there have been sporadic reports
    of accidental scrollbar invocation—it’s something to keep an eye out for, just
    in case.

