    \n使用选择性覆盖设置标题大小。\n\n***49***\n\n## 通用选择\n\n我将向你展示在选择器中使用星号符号 (*) 的用法。不要过度兴奋：它并不像你想象中那样是一个通配符。这里有一个基础示例：星号被称为通用选择器。它的作用是直接选择文档中的每个元素并将这些样式应用到它们。它看起来像通配符，在某种方面它确实是，因为你可以用它来选择大量元素而无需直接命名它们。例如，假设我想选择这个\
