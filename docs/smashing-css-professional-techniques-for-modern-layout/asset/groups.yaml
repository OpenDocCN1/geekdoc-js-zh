    .float-right {\n  float: right;\n  width: 20%;\n  height: 40%;\n}\n```\n\n这种方法（以极简主义的方式）可能是可行的，但在较窄的显示器上可能会遇到问题。如果你能神奇迹地在这些显示器上切换到不同的布局呢？\n\
    \n首先，将三列布局限制在宽度大于 800 像素的环境中。这是通过将布局部分拆分为独立的声明来实现：\n\n```css\n.column {\n  background:\
    \ #FFF;\n  color: #000;\n  font-family: Arial, sans-serif;\n}\n\n.container {\n\
    \  position: relative;\n  margin: 3em 1%;\n  padding: 0.5em 1.5%;\n}\n\n.border\
    \ {\n  border: 1px solid #AAA;\n  border-width: 1px 1px 0 1px;\n}\n\n.clear {\n\
    \  clear: both;\n}\n\n.float-right {\n  float: right;\n  width: 20%;\n  height:\
    \ 40%;\n}\n```\n\n并将最后两个声明放在一个媒体查询中：\n\n```css\n@media (min-width: 800px) {\n\
    \  .float-right {\n    float: right;\n    width: 20%;\n    height: 40%;\n  }\n\
    }\n```\n\n`@media` 规则表示：“此大括号块内的规则适用于所有显示宽度为 800 像素的媒体。”低于该值的任何内容，无论什么媒体，该块都会被忽略。注意\
    \ `min-width` 属性周围的括号，每当你有一个术语和值（称为表达式）时，这些括号都是必要的。\n\n到此时，什么都不会发生真正变化，除非你缩小浏览器窗口直到它向文档提供的宽度小于\
    \ 800 像素（见图 7-4）。在那时，列将完全停止排列。\n\n图 7-4：在 800 像素以下发生的情况。\n\n此时你可以做的是编写另一个媒体查询块，其内部的布局规则适用于更窄的条件。例如，你想在\
    \ 500 像素到 800 像素之间使用两列布局，如图 7-5 所示。\n\n```css\n@media (min-width: 500px) and (max-width:\
    \ 799px) {\n  .col { float: left; width: 20%; }\n  #two { float: right; width:\
    \ 69%; }\n  #three { clear: left; margin-top: 0; }\n}\n```\n\n最后，你可以为任何显示宽度像素较少的媒体应用单列样式（见图\
    \ 7-6）。\n\n```css\n@media (max-width: 499px) {\n  body { text-align: center; }\n\
    \  li {\n    display: inline;\n    list-style: none;\n    padding: 0 0.5em;\n\
    \    border-right: 1px solid gray;\n    line-height: 1.66;\n  }\n  li:last-child\
    \ { border-right: none; }\n}\n```\n\n在所有这些查询中，布局样式都是相对于显示宽度渲染的。7-6：在 800 像素以下应用单列布局样式。\n"
