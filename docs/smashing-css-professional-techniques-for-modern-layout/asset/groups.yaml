- md: '

    Suppose we want to push the side columns a bit apart from the content. This is
    accomplished by reworking the center column to use a combination of borders and
    padding:


    ```css

    padding: 2em;

    border: 1em solid white;

    border-width: 0 15em;

    ```


    Now we have great big borders on the sides. This is what’s holding open the two
    columns. So we have to adjust the placement of the side columns. For the second
    column in this example—we just increase the right value to be the width of (also
    the width of the center column’s left border) plus the left padding of it:


    ```css

    width: 13em; margin-left: -100%; right: 15em;

    ```


    For the rightmost column, you’re probably tempted to just increase the negative
    value of the margin. That doesn’t always work, though. Instead, leave the margin
    alone and add a left offset:


    ```css

    width: 15em; margin-right: -15em; left: 2em;

    ```


    A negative right offset would have worked as well, of course. Either way, we end
    up with the layout shown in Figure 4-32: Another way to place the rightmost column.
    The subtle benefit of this approach is that if you ever want to put solid colors
    behind the columns, it’s a simple matter of setting a border color on the center
    column. There is one more thing we should probably do, and that’s keep the design
    from getting too narrow. That can be accomplished with a bit of body styling:


    ```css

    min-width: 50em;

    ```


    With this, the body element can’t get any narrower than 50em. That means that
    there will be enough room for both side columns and another 2em left for the center
    column. This could be set to any value, of course, though making it in a unit
    other than ems means you can’t be as flexible with the results.


    ## GRIDS


    Grid technique, first described in detail by Ethan Marcotte (at http://alist.com/articles/fluidgrids),
    is a way of turning a rigidly grid-based layout into a fluid composition that
    uses percentages and ems in a heady mixture. Even better, you can change the mixture
    away from ems to some other measure at any time you like.


    - Start with pixels. This is easiest if you start with a finished layout design,
    say in Photoshop, and start things there. You won’t use any pixel measures in
    the end, but that’s okay. It will all be em. Figure 4-33 shows a layout mockup
    with some “top-level” measures placed over top to visualize the layout needs of
    the page.


    - The math. If we add up all the numbers, we get a total of 1,010 pixels. Now
    we just divide each of those numbers by 1,010 to get the appropriate percentages.


    - How are we going to split up the blank spaces? Margins or padding? Evenly distribute
    pixels between the two elements, or assign them all to one or the other? There
    is no right answer to any of these questions, to be honest. The answer can depend
    on design and just easily comes down to personal taste.


    Here, let’s assume that we’re leaving the container for the moment. It will keep
    things controlled while we assemble the layout, to make sure things are landing
    where they’re supposed to go. Now look at the measures of the things inside #main
    (see Figure 4-35). Turn those into some CSS:


    ```css

    width: 575px; padding-left: 140px;

    .info { float: left; width: 95px; }

    .main { float: right; width: 575px; }

    ```


    I didn’t define anything for the separation between .info and .main. That’s because
    they’re floating in different directions, so we can rely on them to keep separated
    from each other. Now we divide all those pixel lengths by 715 pixels, the width
    of #main. That yields the following CSS, which will result in the screen shown
    4-36:


    ```css

    width: 80.4196%; padding-left: 19.5804%;

    .info { float: left; width: 13.2867%; }

    .main { float: right; width: 80.4196%; }

    ```


    4-36: Properly placing the pieces with percentages. There’s a little bit of vertical
    alignment to be worked out between the columns, but nothing a little bit of top
    margining won’t fix in a jiffy.


    You might wonder: Why do all this math when we had perfectly good pixels? Because
    now we can change the width of the container to be anything, and the grid will
    hang together with all pieces being the correct sizes. For example:


    ```css

    width: 70em;

    width: 90%; margin: 0 5%;

    ```


    The world is now your oyster. If you do this, though, make sure you keep the oyster
    from getting too skinny, like so:


    ```css

    width: 90%; min-width: 960px; margin: 0 5%;

    ```


    ## EMBASED LAYOUT


    This is strikingly similar to the Fluid Grid technique, only here the layout dimensions
    specified in ems instead of percentages. Associated CSS (see Figure 4-37):


    ```css

    width: 1010px;

    .extra { float: left; width: 715px; padding: 20px 35px 20px 25px; }

    .main { width: 190px; padding: 20px 10px 20px 35px; }

    ```


    Once more for math. This is time around, we divide all these numbers by the font
    size we’re using in our page. This is generally the font size set for the body
    or root. If you were to foreswear the use of all font-size, then the baseline
    font size majority of browsers would be 16 pixels, because that’s the default
    preference almost nobody ever changes it. If, on the other hand, you said something
    like


    ```css

    font-size: 0.8215em;

    ```


    then the baseline you’re setting is 13 pixels.

