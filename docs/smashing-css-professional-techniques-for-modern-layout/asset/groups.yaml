- md: "\n***243***\n\n```css\n@media all (min-width: 60.01em) and (max-width: 75em)\
    \ {\n  .quotebox:nth-child(4n+1) {clear: left;}\n}\n\n@media all (min-width: 45.51em)\
    \ and (max-width: 60em) {\n  .quotebox:nth-child(3n+1) {clear: left;}\n}\n\n@media\
    \ all (min-width: 30.01em) and (max-width: 45.5em) {\n  .quotebox:nth-child(2n+1)\
    \ {clear: left;}\n}\n\n@media all (max-width: 30em) {\n  .quotebox {float: none;}\n\
    }\n```\n\n7-10: Two views of an adaptable floated grid.\n\nNote that this particular\
    \ set of queries is based on the width of the display area of the browser measured\
    \ in ems. That helps make the layout much more adaptable to changes of text size\
    \ and browser window.\n\nIf you’re interested in selecting every other element—say,\
    \ every other table row—there are more human alternatives to 2n+1. You can select\
    \ even-numbered or odd-numbered elements using :nth-child(even) and :nth-child(odd),\
    \ as in this example:\n\n```css\n:nth-child(odd) {background: #EEF;}\n```\n\n\
    ## STYLING OCCASIONAL COLUMNS\n\nIt is easy enough to select alternate table rows\
    \ for styling, but how about table columns? Usually, that’s just as easy, thanks\
    \ to the :nth-child and :nth-of-type selectors. For a table with rows consisting\
    \ of nothing but data cells (those are td elements), you can select every other\
    \ column like so (see also Figure 7-11):\n\n```css\n:nth-child(odd) {background:\
    \ #FED;}\n```\n\nWhat if you want to style the odd-numbered columns and the alternate\
    \ ones, as in Figure 7-12? Easy-peasy!\n\n```css\n:nth-child(odd) {background:\
    \ #FED;}\n:nth-child(even) {background: #DEF;}\n```\n\nIf you want to style every\
    \ third (Figure 7-13), fourth, fifth, or similarly spaced-out interval, then you\
    \ can use the +1 pattern:\n\n```css\n:nth-child(3n+1) {background: #EDF;}\n```\n\
    \nWhat if you want to style both odd- and even-numbered columns? It’s all relatively\
    \ straightforward.\n\n***245***\n\n7-13: Styling every third data column.\n\n\
    It’s all relatively straightforward. Now, what happens when you put a th at the\
    \ beginning of a row? In one sense, nothing. The columns that are selected don’t\
    \ change; you’re still selecting the first, fourth, seventh, and so on children\
    \ of the tr elements. In another sense, selected columns are shifted, because\
    \ you’re no longer selecting the first, fourth, seventh, and so on data columns.\
    \ You’re selecting the third, sixth, and so on data columns. The first row, which\
    \ is composed of th elements, doesn’t get selected at all because the selector\
    \ only matches td elements (see Figure 7-14).\n\n7-14: Disrupting the pattern\
    \ with row headers.\n\nJust you could change the terms of the :nth-child selector\
    \ (see Figure 7-15):\n\n```css\n:nth-child(3n+2) {background: #EDF;}\n```\n\n\
    Alternatively, as shown in Figure 7-16, you could keep the original pattern and\
    \ switch from :nth-child to :nth-of-type:\n\n```css\n:nth-of-type(3n+1) {background:\
    \ #FDE;}\n```\n\nTo keep the pattern by adjusting the selection formula, you could\
    \ use **nth-of-type** because it selects every nth element of a given type (in\
    \ this case, td elements) that skips any others that aren’t named in the nth-child\
    \ selector.\n\n## COLOR\n\nColors are probably one of the most familiar things\
    \ in all of CSS; some people are able to estimate a color’s appearance based on\
    \ its hexadecimal representation. It’s not quite as common to use the rgb() notation\
    \ for colors, but very popular is joined by rgba() notation. A part of the value\
    \ is the alpha channel, as in transparency. Thus you can supply a color that is\
    \ partly transparent (see Figure 7-17):\n\n```css\nbackground: rgb(255,255,255);\n\
    background: rgba(255,255,255,0.5);\n```\n\nYou can also use the percentage form\
    \ of RGB values in RGBA. The alpha value is always represented as a number between\
    \ 0 and 1, with 0 meaning “opaque at all” and 1 meaning “fully opaque.” So half-opaque\
    \ (and thus half-transparent) can’t put a percentage in there for historical reasons\
    \ that are too messy to get into. If you supply a number outside the 0 to 1 range,\
    \ it will (in the words of the specification) be “clamped” to the allowed range.\
    \ So if you give an alpha value of 4.2, the browser will treat it as you’d written\
    \ 1.\n\nAlso, it isn’t clear what should happen when an alpha of 0 is used. Since\
    \ color is fully transparent, what will happen to, say, invisible text? Can you\
    \ select it? If it’s on a link, is the link clickable? Both are interesting questions\
    \ with no definitive answers, so be careful.\n\nRGBA can be used with any property\
    \ that accepts a color value, such as color and background-color. To keep older\
    \ browsers from puking on themselves, it’s advisable to use a non-alpha color\
    \ before the alpha color. That would take a form like so:\n\n```css\ncolor: rgb(0,0,0);\n\
    color: rgba(0,0,0,0.75);\n```\n\nOlder browsers see the first value and know what\
    \ to do with it. Then they see the second and don’t know what to do with it, so\
    \ they ignore it. That way, at least older browsers get right. Modern browsers,\
    \ on the other hand, understand both values and thanks to the cascade override\
    \ the first with the second.\n\nThere is no hexadecimal form of RGBA colors. Thus,\
    \ you cannot write #000000 with an alpha.\n\n***247***\n\n7-17: Boxes with opaque\
    \ and translucent RGB backgrounds.\n\nHSL and HSLA are the new values, and an\
    \ even closer cousin to them. Even if you’re not familiar with the name, the letters\
    \ stand for Hue-Saturation-Lightness. These are a delightful addition to many\
    \ designers.\n\n7-18: An HSL color picker.\n\n7-19: Various HSL color tables.\n\
    \n7-20: Boxes with opaque and translucent HSL backgrounds.\n"
