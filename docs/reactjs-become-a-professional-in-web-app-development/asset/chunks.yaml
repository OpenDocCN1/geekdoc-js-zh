    \nYou will then be done. Loading of the web pages will be done faster.\n\n# Chapter\
    \ 4- Creating a Chrome Extension\n\nReact is one of the best ways that one can\
    \ implement the front end part for their apps. With it, each component of the\
    \ UI can be implemented separately. This means that there will be a reduced complexity\
    \ and understanding how the app works will be much easier.\n\nWe need to use the\
    \ project structure given below for our project:\n\n```\nnotes/\n  app/\n    coffee/\n\
    \      Johnlist_listing.coffee\n    scss/\n      Johnlist_listing.scss\n  res/\n\
    \    manifest.json\n  package.json\n  Brocfile.js\n```\n\n### Package.json\n\n\
    This will be used for creating the project and for managing our external dependencies.\
    \ Let us begin with a bare file and then add our dependencies:\n\n```json\n{\n\
    \  \"name\": \"notes\",\n  \"description\": \"chrome extension\",\n  \"version\"\
    : \"0.0.1\",\n  \"author\": \"Nicholas\",\n  \"license\": \"ISC\",\n  \"main\"\
    : \"\",\n  \"private\": true,\n  \"scripts\": {},\n  \"dependencies\": {}\n}\n\
    ```\n\nWe should begin by addition of the libraries which are to be used. React\
    \ can first be installed as follows:\n\n```bash\nnpm install --save-dev react-dom\n\
    ```\n\nIn the case of our React files, we will using JSX and coffeeScript. There\
    \ is then a need for us to come up with a mechanism on how these files will be\
    \ converted into JavaScript so that the browser will be able to understand and\
    \ run them. Broccoli can be used for that purpose. For this to be installed, navigate\
    \ to your project directory and then execute the following commands:\n\n```bash\n\
    npm install -g broccoli-cli\nnpm install --save-dev broccoli\n```\n\nAfter the\
    \ installation of broccoli, all of the needed libraries will have to be installed.\
    \ This is the only way we can be able to process the SASS and coffee files. The\
    \ following command can be used:\n\n```bash\nnpm install --save-dev broccoli-sass\
    \ broccoli-fast-browserify broccoli-merge-trees broccoli-funnel coffee-reactify\n\
    ```\n\n### Manifest File\n\nThis will be the heart of our extension. It will be\
    \ as follows:\n\n```json\n{\n  \"manifest_version\": 2,\n  \"name\": \"Johnlist\
    \ Notes\",\n  \"description\": \"This is the Extension to allow you to write notes\
    \ about the Johnlist listings and then view those notes on our page\",\n  \"version\"\
    : \"1.0\",\n  \"permissions\": [\n    \"activeTab\"\n  ],\n  \"content_scripts\"\
    : [\n    {\n      \"matches\": [\"**.Johnlist.org/*.html\"],\n      \"css\": [\"\
    Johnlist_listing.css\"],\n      \"js\": [\"Johnlist_listing.js\"]\n    }\n  ]\n\
    }\n```\n\nThe property `permissions` is responsible for telling Chrome that our\
    \ extension is responsible for running scripts on the Chrome tab which is currently\
    \ active.\n\n### Using Broccoli to build the project\n\nWe need to make use of\
    \ `Brocfile` for telling the broccoli how to build our project. Our SASS files\
    \ will be compiled by the broccoli into CSS files. This is shown below:\n\n```javascript\n\
    // Importing some plugins\nvar compSass = require('broccoli-sass');\nvar mergeTrees\
    \ = require('broccoli-merge-trees');\nvar Funnel = require('broccoli-funnel');\n\
    var browser = require('broccoli-fast-browserify')\n\n// Specifying our Sass and\
    \ Coffeescript directories\nvar sassDirectory = 'app/scss';\nvar coffeeDirectory\
    \ = 'app/coffee';\nvar manifest = 'manifest.json';\nvar resources = 'res'\n\n\
    // Telling the Broccoli how we need the assets to be compiled\nvar clListingStyle\
