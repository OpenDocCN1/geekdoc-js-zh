  trans: "\n});\n\nexport default P;\n\n如上所示，面（facets）的属性也可以通过 mixin 使用。它的行为将类似于光标（cursor）。每当光标更新时，它将获取我们的\
    \ `facet` 已经获取的值。\n\n假设组件触发了如下定义的定义的 action：\n\n```javascript\nimport Baobab from\
    \ './t.js';\n\nlet actions = {\n  selectProject(projectId) {\n    t.set('selectedProjectId',\
    \ projectId);\n  }\n};\n\nexport default actions;\n```\n\n我们的 `facet` 会首先做出反应，然后项目组件会被通知，并从\
    \ `facet` 中获取新状态。\n\n## 解决方案\n\n我们需要在表格中显示项目列表。\n\n实现这种方法如下所示：\n\n```javascript\n\
    import Baobab from 't';\n\nlet projectsList = {\n  cursors: {\n    ids: ['projectsListIds'],\n\
    \    projects: ['projects']\n  },\n  get: function (state) {\n    return state.ids.map(function\
    \ (id) {\n      return state.projects[id];\n    });\n  }\n};\n\nlet t = new Baobab({\n\
    \  projects: {\n    '0': {\n      title: 'projectname'\n    },\n    '1': {\n \
    \     title: 'bar'\n    }\n  },\n  projectsListIds: []\n}, {\n  facets: {\n  \
    \  proList: proList\n  }\n});\n\nexport default t;\n```\n\n组件可以使用类似于下面提供的 `facet`：\n\
    \n```javascript\nimport React from 'react';\nimport {branch} from 'Baobab-react/mixins';\n\
    \nlet ProList = React.createClass({\n  mixins: ,\n  facets: {\n    projects: 'proList'\n\
    \  },\n  renderRow(p) {\n    return (\n      <tr key={p.id}>\n        <td>{p.title}</td>\n\
    \      </tr>\n    );\n  },\n  render() {\n    return (\n      <table>\n      \
    \  <tbody>\n          {this.state.p.map(this.renderRow)}\n        </tbody>\n \
    \     </table>\n    );\n  } \n});\n\nexport default ProList;\n```\n\naction 的实现如下：\n\
    \n```javascript\nimport Baobab from './t.js';\n\nlet actions = {\n  displayProjects(proIds)\
    \ {\n    t.set('proListIds', proIds);\n  }\n};\n\nexport default actions;\n```\n\
    \n现在我们有一套复杂的机制来处理状态，在发生任何变化时，更新将自动完成。\n\n## 引用中的引用\n\n假设我们的用户负责创建项目。项目将只负责在 `authorID`\
    \ 属性上存储用户 ID。如下所示：\n\n```javascript\nimport Baobab from 'Baobab';\n\nlet proList\
    \ = {\n  cursors: {\n    ids: ['proListIds'],\n    pro: ['projects'],\n    users:\
    \ ['users']\n  },\n  get(state) {\n    return state.ids.map(function (id) {\n\
    \      /* 项目将添加一个新属性。\"author\"\n         属性将拥有我们 users 映射中的用户。我们不需要\n       \
    \  在 Baobab 内部修改项目对象，因此必须创建一个新\n         对象并将项目对象像原型一样挂钩上去。任何添加的属性\n         将成为我们新对象的一部分，但不是\
    \ Baobab 内部实际的项目，\n         但仍然可以从原始项目对象引用任何属性 */\n      let pro = Object.create(state.projects[id]);\n\
    \      pro.author = state.users[project.authorId];\n      return pro;\n    });\n\
    \  }\n};\n\nlet t = new Baobab({\n  pro: {},\n  users: {},\n  projectsListIds:\
    \ []\n}, {\n  facets: {\n    projectsList: projectsList\n  }\nexport defaultobab;\n\
    ```\n\n假设在我们的项目中，客户端没有数据，并且我们有一些需要加载的 `ids`。我们可以通过以下方式解决一些挑战：\n\n```javascript\n\
    import Baobab from 'Baobab';\nimport ProjectsFacet from './facets/ProjectsList';\n\
    \nlet t = new Baobab({\n  projects: {},\n  users: {}\n  projectsListIds: ['127',\
    \ '306', '890']\n}, {\n  facets: {\n    projectsList: ProjectsFacet\n  }\n});\n\
    export default t;\n```\n\n`facet` 的定义如下：\n\n```javascript\nimport projectLoader\
    \ from '../loaders/project.js';\nimport userLoader from '../loaders/user.js';\n\
    \nlet ProjectsList = {\n  cursors: {\n    ids: ['ListIds'],\n    pro: ['projects'],\n\
    \    users: ['users']\n  },\n  get(state) {\n    return state.ids.map(function\
    \ (id) {\n      let pro = state.projects[id];\n      if (pro) {\n        proj\
    \ = Object.create(project);\n      } else {\n        return projectLoader(id,\
    \ this);\n      }\n      let author = state.users[project.authorId];\n      if\
    \ (author) {\n        pro.author = author;\n      } else {\n        pro.author\
    \ = userLoader(pro.author, this);\n      }\n      return pro;\n    });\n  }\n\
    };\n```\n"
