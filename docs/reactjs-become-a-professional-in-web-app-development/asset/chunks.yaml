        hex: "#1B66F2"


    }, {


        name: "Red",


        hex: "#F21B1B"


       }, {


        name: "Green",


        hex: "#07BA16"


    }];


    React.render(<Dropdown list={colours} selected={colours[0]} />, document.getElementById("container"));


