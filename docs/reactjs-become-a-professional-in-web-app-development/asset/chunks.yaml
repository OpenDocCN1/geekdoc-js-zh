    The function “getInitialState” is used for setting the state of our dropdown once
    it has been created, and it has taken two props,namely list and selected. The
    “list” specifies the items which are to be displayed once the user clicks on the
    drop down. The “selected” property specifies the item which is currently selected.


    The React “render” method is then  used for rendering the dropdown. Note that
    this will have the colors which we have specified.


