    \     </ul>\n    );\n  }\n}\n\nexport default Proj;\n```\n\nSo far, I hope that\
    \ you are aware of how to use the `Baobab-react` so as to keep the state of an\
    \ application. It offers a low-level solution compared to the rest of solutions.\
    \ It has no assumptions on how to structure the state of our application. One\
    \ is expected to create an abstraction on his own, since this is very different\
    \ than the user interface itself.\n\nIn React, `facets` are very new components,\
    \ and it is expected strategies will emerge which will take advantage of it.\n\
    \n# Chapter 2- Creating a Scrollable Table In React\n\nLet us begin by creating\
    \ our container. This can be done using the code given below:\n\n```html\n<div\
    \ className=\"fixed-scroll-element-container\">\n  <div\n    ref=\"HeaderContainer\"\
    \n    className=\"fixed-scroll-element-header\"/>\n  <div\n    ref=\"Container\"\
    \n    className=\"fixed-scroll-element\"\n    style={containerStyle}/>\n</div>\n\
    ```\n\nOur actual nodes can now give us the width, and the columns can be calculated.\
    \ This is shown below:\n\n```javascript\n// rowWidth: number -- width of the row\n\
    // columnWidths: Array -- array having the widths of the columns we are about\
    \ to create, in which a real number will be in there if the width is available.\n\
    function getColumnWidths(rWidth, colWidths) {\n  var comp = colWidths.reduce(function\
    \ (agg, width) {\n    if (typeof width === 'number') {\n      agg.remainingWidth\
    \ -= width;\n      agg.customWidthColumns -= 1;\n    }\n    return agg;\n  },\
    \ {\n    autoSizeColumns: colWidths.length,\n    remainingWidth: rWidth\n  });\n\
    \  var standardWidth = comp.remainingWidth / comp.autoSizeColumns;\n  return colWidths.map(function\
    \ (width) {\n    if (width) {\n      return width;\n    } else {\n      return\
    \ standardWidth;\n    }\n  });\n}\nvar contWidth = this.containerNode.offsetWidth;\n\
    var computedColumnWidths = getColumnWidths(contWidth, this.props.colWidths);\n\
    ```\n\nNow that we have configured our column widths, we can render what we are\
    \ having on the screen. This is shown below:\n\n```javascript\ndRender: function\
    \ (colWidths, contWidth) {\n  // this is the render for when the container has\
    \ been rendered\n  // and we know explicitly the container width\n  var rows =\
    \ this.state.visibleIndices.map((itIndex, kIndex) => {\n    var top = itIndex\
    \ * this.props.rowHeight;\n    return this.props.rowGetter(itIndex, kIndex, top,\
    \ colWidths, contWidth);\n  });\n  return (\n    <table\n      style={{height:\
    \ this.props.rowCount * this.props.rowHeight}}>\n      <tbody>\n        {rows}\n\
    \      </tbody>\n    </table>\n  );\n},\nvar output = this.defRender(computedColumnWidths,\
    \ contWidth);\nReact.render(output, this.containerNode);\n```\n\nAt this point,\
    \ we need to put all the above together. The scroll position has to be added inside\
    \ the container. `RxJS` can be used for doing this as shown below:\n\n```javascript\n\
    setUpTable: function () {\n  var contHeight = this.props.containerHeight;\n  var\
    \ rowHeight = this.props.rowHeight;\n  var rowCount = this.props.rowCount;\n \
    \ var visRows = Math.ceil(contHeight/ rowHeight);\n  var gScrollTop = () => {\n\
    \    return this.containerNode.scrollTop;\n  };\n  var initScrollSubject = new\
    \ Rx.ReplaySubject(1);\n  initScrollSubject.onNext(getScrollTop());\n  var scrollTopStream\
    \ = initScrollSubject.merge(\n    Rx.Observable.fromEvent(this.containerNode,\
    \ 'scroll').map(getScrollTop)\n  );\n  var fVisibleRow = scrollTopStream.map(function\
    \ (scrollTop) {\n    return Math.floor(scrollTop / rowHeight);\n  }).distinctChanged();\n\
    \  var visIndicesStream = fVisibleRow.map(function (firstRow) {\n    var visIndices\
    \ = [];\n    var lRow = firstRow + visRows;\n    if (lRow > rowCount) {\n    \
    \  firstRow -= rowCount;\n    }\n    for (var j = 0; j <= visRows; j++) {\n  \
    \    visIndices.push(j + firstRow);\n    }\n    return visIndices;\n  });\n  this.visibleIndices\
    \ = visibleIndicesStream.subscribe((indices) => {\n    this.setState({\n     \
    \ visIndices: indices\n    });\n  });\n```\n\nThe visible indices have been calculated\
    \ based on height of your container and the number of rows which can fit in the\
    \ container, and then the state of component set on the number of indices to be\
    \ displayed. The dynamic width has to be taken of. An update of the component\
    \ has to be done on every resize. This is shown below:\n\n```javascript\nvar windResizeStream\
    \ = Rx.Observable.fromEvent(window, 'resize').debounce(50);\nthis.windowResizeSubscription\
    \ = windResizeStream.subscribe(() => {\n  this.forceUpdate();\n});\n```\n\nAt\
    \ this point, the table should be ready to be used.\n\n# Chapter 3- Rendering\
    \ on the Server-Side\n\nSuppose we have a dynamic web page, and we want to render\
