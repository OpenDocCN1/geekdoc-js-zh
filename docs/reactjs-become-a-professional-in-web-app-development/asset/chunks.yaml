                    color:#F0F0F0;


                }


            }


        }


    }


    We are in need of abstracting any vendor prefixes which are annoying. This is
    why we have used different LESS CSS mixins.


    # Chapter 9- Creating a Dropdown


    We can use Font Awesome, LESS CSS, and React JS to create a dropdown. It uses
    the LESS CSS so as to provide a good and amazing animation.


    React


    This can be implemented as shown below:


    var Dropdown = React.createClass({


        getInitialState: function() {


            return {


                listVisible: false


            };


        },


        select: function(item) {


            this.props.selected = item;


        },


        show: function() {


            this.setState({ listVisible: true });


            document.addEventListener("click", this.hide);


        },


        hide: function() {


            this.setState({ listVisible: false });


            document.removeEventListener("click", this.hide);


        },


        render: function() {


            return <div className={"dropdown-container" + (this.state.listVisible
    ? " show" : "")}>


                <div className={"dropdown-display" + (this.state.listVisible ? " clicked":
    "")} onClick={this.show}>


                    <span style={{ color: this.props.selected.hex }}>{this.props.selected.name}</span>


                    <i className="fa fa-angle-down"></i>


                </div>


                <div className="dropdown-list">


                    <div>


                        {this.renderListItems()}


                    </div>


                </div>


            </div>;


        },


        renderListItems: function() {


            var items = [];


            for (var j = 0; j < this.props.list.length; j++) {


                var it = this.props.list[j];


                it.push(<div onClick={this.select.bind(null, it)}>


                    <span style={{ color: it.hex }}>{it.name}</span>


                </div>);


            }


            return its;


        }


    });


