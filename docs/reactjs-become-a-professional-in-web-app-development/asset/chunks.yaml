    \    .end((error, resp)=> {\n      if ( !error ) {\n        next({\n         \
    \ type: successType,\n          response: resp.body\n        });\n        if (_.isFunction(request.afterSuccess))\
    \ {\n          request.afterSuccess({ getState });\n        }\n      }\n     \
