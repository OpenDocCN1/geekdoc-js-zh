    var scripts = browser (coffeeDirectory, {\n  bundles: {\n    \"load_craigslist_listing.js\"\
    : {\n      transform: [\n        require('coffee-reactify')\n      ],\n      entryPoints:\
    \ ['load_craigslist_listing.coffee']\n    },\n    \"load_craigslist.js\": {\n\
    \      transform: [\n        require('coffee-reactify')\n      ],\n      entryPoints:\
    \ ['load_craigslist.coffee']\n    }\n  }\n});\nvar resourceFiles = new Funnel(resources,\
    \ {\n  //destDir: resources\n});\n\n// Merging the compiled styles and scripts\
    \ into a single output directory.\nmodule.exports = mergeTrees([clListingStyle,\
    \ scripts, resourceFiles]);\n```\n\n### Content Scripts\n\nOur aim at this point\
    \ is to create the SASS and coffeeScript files which will provide us with the\
    \ actual functionality of the Chrome extension. This is shown below:\n\n```javascript\n\
    ReactDOM = require 'react-dom'\nReact = require 'react'\nCLNotes = React.createClass({\n\
