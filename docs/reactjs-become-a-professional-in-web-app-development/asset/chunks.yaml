            </div>;


        }


    });


    The class “Menu” is responsible for rendering our actual menu and toggling of
    the visibility of our actual menu depending on how the methods “hide” and “show”
    are called. The method “getInitialState”  is an indication that our menu is hidden
    by default. The method “show” can be used for setting the visibility of the menu
    to true.


    MenuItem


    This can be used as shown below:


    var MnItem = React.createClass({


