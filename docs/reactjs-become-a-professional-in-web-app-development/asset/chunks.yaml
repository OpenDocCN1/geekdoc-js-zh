    \ 目录\n- 引言\n- 第 1 章- 处理复杂状态\n- 第 2 章- 在 React 中创建可滚动表格\n- 第 3 章- 服务器端渲染\n- 第 4\
    \ 章- 创建 Chrome 扩展\n- 第 5 章- React.js 中的数据可视化\n- 第 6 章- 显示异常\n- 第 7 章- 测试 React\
    \ 组件\n- 第 8 章- 构建侧边菜单\n- 第 9 章- 创建下拉列表\n- 第 10 章- React JS 和 Flux 架构\n- 结论\n\n\
    ### 引言\nReact 是创建 Web 应用时一个非常有用的组件。无论你是初学者还是专家，本书都是你学习这个 JavaScript 库的极佳指南。\n\n\
    # 第 1 章- 处理复杂状态\n考虑一种情况：你在表格上显示了一些项目。在点击显示的任何项目后，你应该得到一个模态，它让你能够更改模态的数据。\n\n```javascript\n\
    let t = new Baobab({\n  projects: [{\n    id: 0,\n    title: 'projectname'\n \
    \ }, {\n    id: 1,\n    title: 'bar'\n  }],\n  selectedProject: null\n});\n```\n\
    \n考虑用户点击项目并然后触发该项目数据的情况：\n\n```javascript\nimport Baobab from './t.js';\n\nlet\
    \ actions = {\n  selectProject(index) {\n    t.set('selectedProject', t.get('projects')[index]);\n\
    \  }\n};\n\nexport default actions;\n```\n\n注意，该项目被引用为 `projects` 数组中的第一个项目。这是一个可能会让我们遇到麻烦的问题。这是因为对对象或数组所做的任何更改都会改变\
    \ `Baobab` 上的引用。通过 `Baobab`，可以很容易判断对象是否发生了变化。可以创建一个克隆（clone）来解决这个问题。如下所示：\n\n\
    ```javascript\nlet Baobab = new Baobab ({\n  projects: [{\n    id: 0,\n    title:\
    \ 'projectname'\n  }, {\n    id: 1,\n    title: 'bar'\n  }],\n  selectedProject:\
    \ {\n    id: 0,\n    title: 'projectname'\n  }\n});\n```\n\n在此时，我们有了同一个项目的两个实例。一个在“selectedProjects”中，另一个在“projects”中。这意味着更改选中的项目不会反映在项目列表中，反之亦然。必须创建一个精妙且复杂的逻辑以确保所有运行运行良好。\n\
    \n## 列表中的引用\n在上面的项目中，我们只选择了一个项目。你可能有多个项目，并且需要它们显示在表格中。这意味着多个项目将被克隆，如下所示：\n\n```javascript\n\
    let t = new Baobab ({\n  projects: [{\n    id: 0,\n    title: 'projectname'\n\
    \  }, {\n    id: 1,\n    title: 'bar'\n  }],\n  selectedProject: {\n    id: 0,\n\
    \    title: 'projectname'\n  }\n});\n```\n（注：此处原文逻辑似乎存在断层或重复，已按原文语意译翻译）\n\n```javascript\n\
    let t = new Baobab ({\n  projects: [{\n    id: 0,\n    title: 'projectname'\n\
    \  }, {\n    id: 1,\n    title: 'bar'\n  }],\n  selectedProject: {\n    id: 0,\n\
    \    title: 'projectname'\n  }\n});\n```\n\n在此时，我们有了同一个项目的两个实例。一个在“selectedProjects”中，另一个在“projects”中。这意味着更改选中的项目不会反映在项目列表中，反之亦然。必须创建一个精妙且复杂的逻辑以确保所有运行运行良好。\n\
    \n## 列表中的引用\n在上面的项目中，我们只选择了一个项目。你可能有多个项目，并且需要它们显示在表格中。这意味着多个项目将被克隆，如下所示：\n\n```javascript\n\
    let t = new Baobab ({\n  projects: [{\n    id: 0,\n    title: 'projectname'\n\
    \  }, {\n    id: 1,\n    title: 'bar'\n  }],\n  selectedProject: {\n    id: 0,\n\
    \    title: 'projectname'\n  }\n});\n```\n（注：原文此处存在大量重复，已按原文语意译翻译）\n\n```javascript\n\
