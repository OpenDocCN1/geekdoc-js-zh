    \n# Chapter 6- Showing Exceptions\n\nIt is possible for us to show the exceptions\
    \ from a `flux` dispatcher. `Flux` is simply a front end architecture created\
    \ by Facebook. The method `register` is used for accepting callbacks. The callbacks\
    \ will then be invoked whenever an action has been to it. The dispatcher usually\
    \ eats exceptions which occur in a callback. This is good because a callback which\
    \ fails cannot crash the whole application. However, it makes the process of debugging\
    \ tough.\n\nWe are in need of showing our exceptions on the console. We should\
    \ first define a function for logging errors of the function which is passed.\
    \ This should be done as follows:\n\n```javascript\nvar vm = function(f) {\n \
    \ return function() {\n    try {\n      f.apply(this, arguments);\n    } catch(ex)\
    \ {\n      console.error(ex.stack);\n    }\n  }\n};\n```\n\nNote that we have\
    \ used the `console` object, and this will fail in case you use older versions\
    \ of Internet Explorer (IE). You should always have your developer console opened.\
    \ Let us now override the `dispatch` method so as use the above class:\n\n```javascript\n\
    var Dispatcher = require('flux').Dispatcher;\nvar as = require('object-assign');\n\
    var ApplicationDispatcher = as(new Dispatcher(), {\n  handleViewAction: function(action)\
    \ {\n    console.log(action);\n    this.dispatch({\n      source: 'VIEW_ACTION',\n\
    \      action: action\n    });\n  },\n  handleServerAction: function(action) {\n\
    \    console.log(action);\n    this.dispatch({\n      source: 'SERVER_ACTION',\n\
    \      action: action\n    });\n  },\n  register: function(fn) {\n    return Dispatcher.prototype.register.call(this,\
    \ vm(fn));\n  }\n});\nmodule.exports = ApplicationDispatcher;\n```\n\n# Chapter\
