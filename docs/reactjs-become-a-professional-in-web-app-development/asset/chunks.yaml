    # Chapter 10- React JS and Flux Architecture


    The two can be combined together for the purpose of making a simple application.
    Flux provides you with a mechanism on how you can draw data from the server API.
    During this time, a strict decoupling of the components is kept on the client
    side. Separation of concerns is implemented, since a one-way communication protocol
    is made use of. React JS and Flux can be used together very well.


    React JS


    React usually functions off of classes. For some HTML to be rendered, you have
    to begin by creating a React class, and this will give a description of what to
    render. Consider a sample of React class which is given below:


    var Hello = React.createClass({


        render: function() {


            return <div>Hello, there!</div>;


        }


    });


    React.render(new Hello (), document.body);


    Note that we have defined a React class and given it the name “Hello.” We have
    then specified the “render” function in this class. In case we are in need of
    rendering our HTML inside, we will call this function, The JSX will help us in
    writing HTML inside JavaScript files without having to write them in separate
    templates. The last line in the above code shows that we are in need of rendering
    our class in the body of the document.


    Props


    Suppose we are in need of passing some data into our React classes. This one has
    not been provided in our previous class. The following class demonstrates how
    this can be done:


    var Hello = React.createClass({


        render: function() {


            return <div>Hello, {this.props.name}</div>;


        }


    });


    React.render(new Hello ({ name: "John Joel" }), document.body);


    The argument “props” has been introduced in our above class. This will allow us
    to pass data to the view of our class. Changes made to a prop variable will cause
    the appropriate portion of the view to be rendered. The changes can be from the
    parent view, the view itself or from any of the child views. With this, data can
    be passed within the views themselves and also kept in sync.


    State


    This can be used as shown below:


    var Hello = React.createClass({


        getInitialState: function() {


            return {


                counter: 0


            };


        },


        increment: function() {


            this.setState({ counter: this.state.counter+1 });


        },


        render: function() {


            return <div>


                <div>{this.state.counter}</div>


                <button onClick={this.increment}>Increment</button>


            </div>;


        }


    });


    React.render(new Hello (), document.body);


    A React class has a state, and this is what we have introduced above. This makes
    it possible for you to keep track of the changes made to your internal view. Whenever
    we are using an internal state, the function “getInitialState” will be required.  It
    is an indication to the internal view of how our initial state should be. Even
    if you have an empty state, make sure that you make use of this function.


    We make use of props when we want to pass data between our parent and child React
    classes, and in case a change is made to any prop, the view will be rendered again
    automatically. This includes both the child and the parent. If your data is only
    relevant to the view, make use of a state. In this case, any changes made will
    also be rendered in the view. If your data is pertinent to your class other than
    the view, feel free to make use of a private variable, but personally, I will
    use a state.


    Nested Views


    The concept of nesting views makes it possible and easy for us to make use of
    React. With this, we are able to render React classes from within the other React
    classes. An example of this is given below:


    var FnButton = React.createClass({


        render: function() {


            return <button onClick={this.props.onClick}>


                <i className={"fa " + this.props.icon}></i>


                <span>{this.props.text}</span>


            </button>


        }


    });


    var Hello = React.createClass({


        getInitialState: function() {


            return {


                counter: 0


            };


        },


        increment: function() {


            this.setState({ counter: this.state.counter++ });


        },


        render: function() {


            return <div>


                <div>{this.state.counter}</div>


                <FancyButton text="Increment" icon="fa-arrow-circle-o-up" onClick={this.increment}
    />


            </div>;


        }


    });


    In the above class, the button has been abstracted so as to increase the counter
    into a React class which is separate. That is how we can assign props via nested
    classes.


    In Flux, we have to use a store for the purpose of retrieving, updating, and creating
    in case an action for doing so is received.


    Consider the example given below which shows how flux works:


    var Count = React.createClass({


        getInitialState: function() {


            return {


                items: []


            };


        },


        componentWillMount: function() {


            emitter.on("store-changed", function(its) {


                this.setState({ items: its });


            }.bind(this));


        },


        componentDidMount: function() {


            dispatcher.dispatch({ type: "get-all-items" });


        },


        render: function() {


            var its = this.state.its;


            return <div>{its.length}</div>;


        }


    });


    var Store = function() {


        dispatcher.register(function(pd) {


            switch (pd.type) {


                case: "get-all-items":


                    this._all();


                    break;


            }


        }.bind(this));


        this._all = function() {


            $.get("/some/url", function(its) {


                this._notify(its);


            }.bind(this));


        }


        this._notify = function(its) {


            emitter.emit("store-changed", its);


        });


    };


    var ItemStore = new Store();


