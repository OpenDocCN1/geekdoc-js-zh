    \ 9- Creating a Dropdown](#part0000_split_030.html__Toc446343747)\n- [Chapter\
    \ 10- React JS and Flux Architecture](#part0000_split_032.html__Toc446343748)\n\
    - [Conclusion](#part0000_split_038.html__Toc446343749)\n\n### Disclaimer\nWhile\
    \ all attempts have been made to verify the information provided in this book,\
    \ the author does assume any responsibility for errors, omissions, or contrary\
    \ interpretations of the subject matter contained within. The information provided\
    \ in this book is for educational and entertainment purposes only. The reader\
    \ is responsible for his or her own actions and the author does not accept any\
    \ responsibilities for any liabilities or damages, real or perceived, resulting\
    \ from the use of this information.\n\nThe trademarks that are used are without\
    \ any consent, and the publication of the trademark is without permission or backing\
    \ by the trademark owner. All trademarks and brands within this book are for clarifying\
    \ purposes only and are the owned by the owners themselves, not affiliated with\
    \ this document.\n\n# Introduction\nReact is a very useful component when creating\
    \ web applications. This book is an excellent guide for you to learn this JavaScript\
    \ library, whether you are a beginner or an expert.\n\n# Chapter 1- Handling of\
    \ Complex States\nConsider a situation in which you have some projects displayed\
    \ on a table. After clicking on any of the displayed projects, you should get\
    \ a model which will make it possible for you to change the data of the model.\n\
    \n```javascript\nlet t = new Baobab({\n  projects: [{\n    id: 0,\n    title:\
    \ 'projectname'\n  }, {\n    id: 1,\n    title: 'bar'\n  }],\n  selectedProject:\
    \ null\n});\n```\n\nConsider the situation in which the user clicks on a project\
    \ and then the data for the project is triggered:\n\n```javascript\nimport Baobab\
    \ from './t.js';\n\nlet actions = {\n  selectProject(index) {\n    t.set('selectedProject',\
    \ t.get('projects')[index]);\n  }\n};\n\nexport default actions;\n```\n\nNote\
    \ that the project has been referenced as the first project in the `projects`\
    \ array. This is a problem which might get us into trouble. This is because any\
    \ change made to an object or an array will change the reference on the `Baobab`.\
    \ With the `Baobab`, one can easily determine whether an object has changed or\
    \ not. A clone can be created so as to solve this problem. This is shown below:\n\
    \n```javascript\nlet Baobab = new Baobab ({\n  projects: [{\n    id: 0,\n    title:\
    \ 'projectname'\n  }, {\n    id: 1,\n    title: 'bar'\n  }],\n  selectedProject:\
    \ {\n    id: 0,\n    title: 'projectname'\n  }\n});\n```\n\nAt this point, we\
    \ are having two instances of the same project. One is in the “selectedProjects,”\
    \ and the other one in the “projects.” This means that changing the selected project\
    \ will not be reflected in the list of projects, and the vice versa is true. A\
    \ pretty and complex logic has to be created so that everything runs well.\n\n\
    ## Referencing in a List\nIn our above project, we have selected only one project.\
    \ It is possible that you have multiple projects and there is a need for them\
    \ to be shown in a table. This will mean that multiple projects will be cloned\
    \ as shown below:\n\n```javascript\nlet t = new Baobab ({\n  projects: [{\n  \
    \  id: 0,\n    title: 'projectname'\n  }, {\n    id: 1,\n    title: 'bar'\n  }]...1000,\n\
    \  projectRows: [{\n    id: 0,\n    title: 'projectrows'\n  }, {\n    id: 1,\n\
    \    title: 'bar'\n  }]...10]\n});\n```\nWe have a problem above previously. Keeping\
    \ in sync becomes a problem.\n\n## Reference within reference\nIn relational databases,\
    \ referencing of any object is done by use of an `ID`. Suppose our projects have\
    \ comments. These have to be referenced by use of an `ID`. This is shown below:\n\
    \n```javascript\nlet t = new Baobab ({\n  comments: [{\n    id: 0,\n    comment:\
    \ 'commentname'\n  }, {\n    id: 1,\n    comment: 'commentname'\n  }],\n  projects:\
    \ [{\n    id: 0,\n    title: 'projectname',\n  }, {\n    id: 1,\n    title: 'bar'\n\
    \  }]...1000,\n  projectRows: [{\n    id: 0,\n    title: 'projectrows',\n    comments:\
    \ [{\n      id: 0,\n      comment: 'commentname'\n    }]\n  }, {\n    id: 1,\n\
    \    title: 'bar',\n    comments: [{\n      id: 1,\n      comment: 'commentname'\n\
    \    }]\n  }]...10]\n});\n```\nA more complex logic is needed at this point. This\
    \ is because we do not need the `ID` of our comments, but we are in need of the\
    \ comments themselves. This has to be handled during the time of cloning.\n\n\
    ## Baobab-react\nA context is now used for the purpose of passing a state to the\
    \ components. This is a much friendlier way this can be done. The syntax itself\
    \ is as follows:\n\n```javascript\nimport Baobab from './Baobab.js';\nimport {root,\
    \ branch} from 'Baobab-react/mixins';\n\n/* Let us set up the top component first.\
    \ The component will need our \"root\" mixin. The root mixin will expose the state\
    \ Baobab on our context */\nlet Application = React.createClass({\n  mixins: [root],\n\
    \  render() {\n    return (\n      <div>\n        <Header/>\n      </div>\n  \
    \  );\n  }\n});\n\n/* Any of the child components in our application can attach\
    \ the branch mixin. This mixin will allow you to attach cursors which will extract\
    \ the state from our Baobab and attach it to our state object of our component\
    \ */\nlet Hd = React.createClass({\n  mixins: ,\n  cursors: {\n    foo: ['bar']\n\
    \  },\n  render() {\n    return (\n      <div>{this.state.name}</div>\n    );\n\
    \  }\n});\n\nReact.render(<App Baobab={Baobab}/>, document.getElementById('application'))\n\
    ```\n\n## Facets\nComponents should have the ability to use cursors for composing\
    \ a description of the User Interface (UI). In this case, the facets should be\
    \ used for composing the state. An example will best explain this as shown below:\n\
    \n```javascript\nimport Baobab from 'Baobab';\n\n/* A Facet is simply an object\
    \ having two special properties, that is, \"cursors\" and \"get\" */\nlet selectedProject\
    \ = {\n  cursors: {\n    id: ['selectedProjectId'],\n    projects: ['projects']\n\
    \  },\n  get: function (state) {\n    return state.projects[state.id];\n  }\n\
    };\n\n/* We define our Baobab with some initial data and attach the facet */\n\
    let t = new Baobab({\n  projects: {\n    '0': {\n      title: 'projectname'\n\
    \    },\n    '1': {\n      title: 'bar'\n    }\n  },\n  selectedProjectId: '0'\n\
    }, {\n  facets: {\n    selectedProject: selectedProject\n  }\n});\n\nexport default\
    \ Baobab;\n```\n\nWe have just begun by defining our facet which is an object\
    \ having two properties. The example given below shows how a facet can be used:\n\
    \n```javascript\nimport React from 'react';\nimport {branch} from 'Baobab-react/mixins';\n\
    \nlet P = React.createClass({\n  mixins: ,\n  facets: {\n    p: 'selectedProject'\n\
    \  },\n  render() {\n    if (this.state.p) {\n      return (\n        <div>{this.state.p.title}</div>\n\
    \      );\n    } else {\n      return null;\n    }\n  } \n});\n```\n"
