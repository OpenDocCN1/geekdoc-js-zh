    We should begin by addition of the libraries which are to be used. React can first
    be installed as follows:


    npm install --save-dev react react-dom


    In the case of our React files, we will be using JSX and coffeeScript. There is
    then a need for us to come up with a mechanism on how these files will be converted
    into JavaScript so that the browser will be able to understand and then run them.
    Broccoli can be used for that purpose.


    For this to be installed, navigate to your project directory and then execute
    the following two commands:


    npm install -g broccoli-cli


    npm install --save-dev broccoli


    After the installation of broccoli, all of the needed libraries will have to be
    installed. This is the only way we can be able to process the SASS and coffeeScript
    files. The following command can be used:


    npm install --save-dev broccoli-sass broccoli-fast-browserify broccoli-merge-trees
    broccoli-funnel coffee-reactify broccoli-timepiece


