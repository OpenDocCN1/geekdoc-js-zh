    \   .vertical-centre(@height);\n            }\n            >span {\n         \
    \       float:left;\n                width:100%;\n            }\n        }\n \
    \   }\n}\n```\n\n## Chapter 10- React JS and Architecture\n\nThe two can be combined\
    \ for the purpose of making a simple application. Flux provides you with a mechanism\
    \ on how you can draw data from the server. During this time, a strict decoupling\
    \ of components is kept on the client side. Separation of concerns is implemented,\
    \ since one-way communication protocol is made use of React JS and Flux can be\
    \ used together very well.\n\n### React\n\nReact usually uses classes. For some\
    \ HTML to be rendered, you have to begin by creating a React class, and this will\
    \ give a description of what to render. Consider a sample of React which is given\
    \ below:\n\n```javascript\nvar Hello = React.createClass({\n    render: function()\
    \ {\n        return <div>Hello, there!</div>\n    }\n});\nReact.render(new Hello\
    \ (), document.body);\n```\n\nNote that we have defined a React class and given\
    \ it the name `Hello`. We then specified the `render` function in this class.\
    \ In case we are in need of rendering HTML inside, we will call this function,\
    \ JSX will help us in writing HTML inside without having to write in separate\
    \ templates. The last line in above shows that we are in need of rendering our\
    \ class in the body.\n\n### Props\n\nSuppose we are in need of passing some data\
    \ into React classes. This has not been provided in our previous class. The following\
    \ class demonstrates how this can be done:\n\n```javascript\nvar Hello = React.createClass({\n\
    \    render: function() {\n        return <div>Hello, {this.props.name}</div>\n\
    \    }\n});\nReact.render(new Hello ({ name: \"Joel\" }), document.body);\n```\n\
    \nThe `props` has been introduced in our above class. This will allow us to pass\
    \ data to the view of our class. Changes to to `prop` will cause the appropriate\
    \ portion of the view to be rendered. The changes can be from the parent view,\
    \ the view itself or from any child views. With this, data can be passed within\
    \ the views and kept in sync.\n\n### State\n\nThis can be used as shown below:\n\
    \n```javascript\nvar Hello = React.createClass({\n    getInitialState: function()\
    \ {\n        return {\n            counter: 0\n        };\n    },\n    increment:\
    \ function() {\n        this.setState({ counter: this.state.counter+1 });\n  \
    \  },\n    render: function() {\n        return <div>\n            <div>{this.state.counter}</div>\n\
    \            <button onClick={this.increment}>Increment</button>\n        </div>;\n\
    \    }\n});\nReact.render(new Hello (), document.body);\n```\n\nA React class\
    \ has a state, and this is what we have introduced above. This makes it possible\
    \ for you to keep track of the changes made to your internal view. Whenever we\
    \ are using an internal state, the function `getInitialState` will be required.\
    \ It is an indication to the internal view of how our initial state should be.\
    \ Even if you have an empty state, make sure you make use of this function.\n\n\
    We make use of `props` when we want to pass data between our parent and child\
    \ React classes, and in case a change is made to any prop, the view will be rendered\
    \ again. This includes both the child and the parent. If your data is only relevant\
    \ to the view, make use of a state. In this case, any changes made will also be\
    \ rendered in the view. If your data is pertinent to your class other than the\
    \ view, feel free to make use of a private variable, but personally, I will use\
    \ a state.\n\n### Nested Views\n\nThe concept of nesting views makes possible\
    \ and easy for us to make use of React. With this, we are able to render React\
    \ classes from within the other React classes. An example of this is given below:\n\
    \n```javascript\nvar FnButton = React.createClass({\n    render: function() {\n\
    \        return <button onClick={this.props.onClick}>\n            <i className={\"\
    fa \" + this.props.icon}>i\n            <span>{this.props.text}</span>\n     \
    \   </button>\n    }\n});\n\nvar Hello = React.createClass({\n    getInitialState:\
    \ function() {\n        return {\n            counter: 0\n        };\n    },\n\
    \    increment: function() {\n        this.setState({ counter: this.state.counter++\
    \ });\n    },\n    render: function() {\n        return <div>\n            <div>{this.state.counter}</div>\n\
    \            <FancyButton icon=\"arrow-circle\" onClick={this.increment} />\n\
    \        </div>;\n    }\n});\n```\n\nIn the above class, the button has been abstracted\
    \ to increase the counter. Consider the example below which flux works:\n\n```javascript\n\
