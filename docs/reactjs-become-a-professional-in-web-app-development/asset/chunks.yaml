    This can be used as shown below:


    var Application  = React.createClass({


        showLeft: function() {


            this.refs.left.show();


        },


        showRight: function() {


            this.refs.right.show();


        },


        render: function() {


            return <div>


                <button onClick={this.showLeft}>View Left Menu!</button>


                <button onClick={this.showRight}>View Right Menu!</button>


                <Menu ref="left" alignment="left">


                    <MenuItem hash="first-page"> Page 1 </MenuItem>


                    <MenuItem hash="second-page"> Page 2 </MenuItem>


                    <MenuItem hash="third-page"> Page 3 </MenuItem>


                </Menu>


                <Menu ref="right" alignment="right">


                    <MenuItem hash="first-page"> Page 1 </MenuItem>


                    <MenuItem hash="second-page"> Page 2 </MenuItem>


                    <MenuItem hash="third-page"> Page 3 </MenuItem>


                </Menu>


            </div>;


        }


    });


    In the above example, we have added only menus to our app. One of these will slide
    it from the right and the other one from the left. The specification of these
    parameters has been done using the prop “alignment.”


    We have created instances of the “MenuItem” class inside the “Menus.” The user
    will be able to click on these menu entries so as to perform a certain action.
    In our case, the action is most probably to navigate to a certain hash, and the
    specification of this is done using the “hash” prop on the declaration of the
    class.


    Menu


    This can be used as shown below:


    var Menu = React.createClass({


        getInitialState: function() {


            return {


                visible: false 


            };


        },


        show: function() {


            this.setState({ visible: true });


            document.addEventListener("click", this.hide.bind(this));


        },


        hide: function() {


            document.removeEventListener("click", this.hide.bind(this));


            this.setState({ visible: false });


        },


        render: function() {


