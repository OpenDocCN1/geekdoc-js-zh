  \ React JS 和单向通信协议，实现了关注点分离，React JS 和 Flux 可以很好地配合使用。\n\n## React\n\nReact 通常使用类（classes）。为了渲染某些\
  \ HTML，你必须创建一个 React 类，这将提供关于要渲染内容的描述。考虑下面这个 React 示例：\n\n```javascript\nvar Hello\
  \ = React.createClass({\n    render: function() {\n        return <div>Hello, there!</div>\n\
  \    }\n});\nReact.render(new Hello (), document.body);\n```\n\n注意，我们定义了一个 React\
  \ 类并将其命名为 `Hello`。然后我们在该类中指定了 `render` 函数。如果我们需要在内部渲染 HTML，将调用此函数，JSX 将帮助我们在不需要编写单独模板的情况下在内部编写\
  \ HTML。上面代码的最后一行显示，我们需要在正文（body）中渲染我们的类。\n\n## Props（属性）\n\n假设我们需要向 React 类传递一些数据。这在我们之前的类中并没有提供。接下来的这个类演示了如何做到这一点：\n\
  \n```javascript\nvar Hello = React.createClass({\n    render: function() {\n   \
  \     return <div>Hello, {this.props.name}</div>\n    }\n});\nReact.render(new Hello\
  \ ({ name: \"Joel\" }), document.body);\n```\n\n在上面的类中我们引入了 `props`。这允许我们把数据传递到类的视图中。`prop`\
  \ 的变化将导致视图的相应部分被渲染。这些变化可以来自父视图、视图本身或任何子视图。通过这种方式，数据可以在视图之间传递并保持同步。\n\n## State（状态）\n\
  \n它可以像下面所示那样被使用：\n\n```javascript\nvar Hello = React.createClass({\n    getInitialState:\
  \ function() {\n        return {\n            counter: 0\n        };\n    },\n \
  \   increment: function() {\n        this.setState({ counter: this.state.counter+1\
  \ });\n    },\n    render: function() {\n        return <div>\n            <div>{this.state.counter}</div>\n\
  \            <button onClick={this.increment}>Increment</button>\n        </div>;\n\
  \    }\n});\nReact.render(new Hello (), document.body);\n```\n\nReact 类有一个状态（state），这就是我们在上面介绍的内容。这使得你能够跟踪对内部视图所作的更改。每当我们使用内部状态时，都需要\
  \ `getInitialState` 函数。它是对内部视图的一个指示，说明了我们的初始状态应该是怎样的。即使你有一个空状态，也请确保使用此函数。\n\n当我们想要在父类和子类之间传递数据时，我们使用\
  \ `props`，并且当任何 prop 发生变化时，视图将再次渲染。这包括子类和父类。如果你的数据仅与视图有关，请使用 state。在这种情况下，所做的任何更改也将在视图中渲染。如果你的数据与视图之外的类有关，请随时使用私有变量，但个人而言，我会使用\
  \ state。\n\n## 嵌套视图（Nested Views）\n\n嵌套视图的概念让我们能够并且轻松地使用 React。通过这种方式，我们能够从其他 React\
