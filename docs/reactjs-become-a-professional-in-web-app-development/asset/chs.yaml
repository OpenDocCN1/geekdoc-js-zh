  \ ref=\"left\" alignment=\"left\">\n                <MenuItem hash=\"first-page\"\
  > 第 1 页 </MenuItem>\n                <MenuItem hash=\"second-page\"> 第 2 页 </MenuItem>\n\
  \                <MenuItem hash=\"third-page\"> 第 3 页 </MenuItem>\n            </Menu>\n\
