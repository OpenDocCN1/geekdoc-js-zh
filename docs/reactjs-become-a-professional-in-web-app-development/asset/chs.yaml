  \  }\n  //...\n}\n```\n\n至此你就完成了。网页的加载速度将变得更快。\n\n# 第 4 章- 创建 Chrome 扩展\n\nReact\
  \ 是人们实现应用前端部分的最佳方式之一。通过它，UI 的每个组件都可以独立实现。这意味着复杂性将会降低，并且理解应用程序的工作原理将变得容易得多。\n\n我们需要为项目使用下面给出的项目结构：\n\
  \n```\nnotes/\n  app/\n    coffee/\n      Johnlist_listing.coffee\n    scss/\n \
  \     Johnlist_listing.scss\n  res/\n    manifest.json\n  package.json\n  Brocfile.js\n\
  ```\n\n## Package.json\n\n这将用于创建项目并管理我们的外部依赖。让我们从一个空文件开始，然后添加我们的依赖：\n\n```json\n\
  {\n  \"name\": \"notes\",\n  \"description\": \"chrome extension\",\n  \"version\"\
  : \"0.0.1\",\n  \"author\": \"Nicholas\",\n  \"license\": \"ISC\",\n  \"main\":\
  \ \"\",\n  \"private\": true,\n  \"scripts\": {},\n  \"dependencies\": {}\n}\n```\n\
  \n我们应该开始添加要使用的库。首先可以如下方式安装 React：\n\n```bash\nnpm install --save-dev react-dom\n\
  ```\n\n在我们的 React 文件中，我们将使用 JSX 和 coffeeScript。我们需要想出一种机制，将这些文件如何转换为 JavaScript，以便浏览器能够理解并运行它们。Broccoli\
  \ 可以用于此目的。要安装它，导航到你的项目目录然后执行以下命令：\n\n```bash\nnpm install -g broccoli-cli\nnpm install\
  \ --save-dev broccoli\n```\n\n安装 broccoli 之后，必须安装所有需要的库。这是我们能够处理 SASS 和 coffee 文件的唯一方法。可以使用以下命令：\n\
  \n```bash\nnpm install --save-dev broccoli-sass broccoli-fast-browserify broccoli-merge-trees\
  \ broccoli-funnel coffee-reactify\n```\n\n## Manifest 文件\n\n这将是我们的扩展的核心。它如下：\n\n\
  ```json\n{\n  \"manifest_version\": 2,\n  \"name\": \"Johnlist Notes\",\n  \"description\"\
  : \"这是一个扩展程序，允许你编写关于 Johnlist 列表的笔记，然后在我们的页面上查看这些笔记\",\n  \"version\": \"1.0\",\n\
  \  \"permissions\": [\n    \"activeTab\"\n  ],\n  \"content_scripts\": [\n    {\n\
  \      \"matches\": [\"**/*\"],\n      \"js\": [\"Johnlist_listing.js\"],\n    \
  \  \"css\": [\"Johnlist_listing.css\"]\n    }\n  ]\n}\n```\n\n`content_scripts`\
  \ 属性负责告诉 Chrome 扩展运行的。\n\n## 使用 Broccoli 构建\n\n我们需要告诉 Broccoli 如何构建我们的项目。如下所示：\n\
  \n```javascript\n// 导入一些插件\nvar sass = require('sass');\nvar mergeTrees = require('merge-trees');\n\
  var Funnel = require('funnel');\nvar browserify = require('fast-browserify');\n\
  var reactify = require('reactify');\n\n// 编译 Sass 和 coffee 文件\nvar clListingStyle\
  \ = sass('app/scss', {\n  destDir: 'dist'\n});\n\nvar scripts = browserify('app/coffee',\
  \ {\n  entry: 'Johnlist_listing',\n  transform: [\n    reactify\n  ],\n  destDir:\
  \ 'dist'\n});\n\nvar resourceFiles = new Funnel('res', {\n  destDir: 'dist'\n});\n\
  \n// 将编译后的样式和脚本合并到一个输出目录\nmodule.exports = mergeTrees([clListingStyle, scripts,\
  \ resourceFiles]);\n```\n\n## Content Scripts\n\n我们的目标是创建 SASS 和 coffee 文件，它们将为我们提供扩展的实际功能。如下：\n\
  \n```javascript\nReactDOM = require 'react-dom'\nReact = require 'react'\nCLNotes\
