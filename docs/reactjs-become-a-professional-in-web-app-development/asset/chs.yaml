  \            </Menu>\n        </div>;\n    }\n});\n```\n\n在上面的示例中，我们只向应用添加了菜单。其中一个将从右侧滑动，另一个从左侧滑动。这些参数的规范是通过属性\
  \ `alignment` 完成的。\n\n我们在 `Menus` 内部创建了 `MenuItem` 类实例。用户可以点击这些菜单项来执行某些操作。在我们的案例中，操作很可能是导航到某个\
  \ hash，这通过在类声明中使用 `hash` 属性来完成。\n\n## Menu\n\n可以像下面所示那样使用：\n\n```javascript\nvar\
