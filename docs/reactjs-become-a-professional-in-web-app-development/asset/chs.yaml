  \ return next(action);\n  }\n  let request = action[CALL_API];\n  let { getState\
  \ } = store;\n  let deferred = Promise.defer();\n  // 在这里处理 401 和认证\n  let { method,\
  \ url, successType } = request;\n  superAgentmethod\n    .end((error, resp)=> {\n\
  \      if ( !error ) {\n        next({\n          type: successType,\n         \
  \ response: resp.body\n        });\n        if (_.isFunction(request.afterSuccess))\
  \ {\n          request.afterSuccess({ getState });\n        }\n      }\n      deferred.resolve();\n\
  \    });\n  return deferred.promise;\n};\n```\n\n既然我们已经有了上面的内容，我们可以对第一个页面中的原始 action\
  \ 进行更改，如下所示：\n\n```javascript\nexport const LOADED_ANSWERS = 'LOADED_ANSWERS';\n\
