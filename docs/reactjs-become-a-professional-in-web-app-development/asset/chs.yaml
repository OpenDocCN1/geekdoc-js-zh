  \ value={@state.note} onChange={@noteChanged} />\n      <button onClick={@saveNote}>Save</button>\n\
  \    </div>\n  noteChanged: (event) ->\n    mynote = event.target.value\n    @setState\n\
  \      note: mynote\n  saveNote: ->\n    @props.saveNote(@state.note)\n    @setState\n\
  \      note: ''\n})\n\nNotesDisplay = React.createClass({\n  displayName: 'NotesDisplay'\n\
