    ![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_6_0.png)[](img/d58e8e46bd867e5a296f2ee0f2d4ca26_6_1.png)


    Have you ever played a game or looked at a slideshow of pictures online in your
    web browser? If so, then you''ve likely visited a web page that uses JavaScript.
    JavaScript is a popular programming language that brings web pages to life. From
    games to entire business applications such as word processors and spreadsheets,
    it''s hard to imagine the World Wide Web without it.


    In the mid-1990s, coder Brendan Eich wrote Mocha, which was an early version of
    JavaScript. In the early days of the Internet, web pages were mostly basic text
    files, which were static, or unchanging. Early web pioneers wanted a way to make
    web pages more dynamic and interactive. That required a new programming language
    made specifically with web pages in mind. The result was JavaScript. Today, JavaScript
    is used to create all sorts of online programs that run through browsers.


