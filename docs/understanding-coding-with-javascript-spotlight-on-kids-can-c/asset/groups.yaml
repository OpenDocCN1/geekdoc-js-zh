    ![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_6_0.png)[](img/d58e8e46bd867e5a296f2ee0f2d4ca26_6_1.png)


    你是否曾在网络浏览器中玩过游戏或查看过在线幻灯片？如果是这样，你很可能访问过使用 JavaScript 的网页。JavaScript 是一种流行的编程语言，它能让网页活起来。从游戏到文字处理器、电子表格等整个业务应用程序，很难想象没有它的万维网。


    在 20 世纪 90 年代中期，程序员 Brendan Eich 写了 Mocha，这是 JavaScript 的早期版本。在互联网早期，网页大多是基础文本文件，是静态的或不变的。早期的网页先驱希望找到一种让网页更具动态性和交互的方法。这需要一种专门为网页设计的新编程语言。结果就是
    JavaScript。今天，JavaScript 被用于创建各种通过浏览器运行的在线程序。


    ![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_7_0.png)


