  - '[PAGE 13]


    # Plays Well with HTML


    JavaScript was designed to work closely with HTML. HTML is the standard language
    needed to create a web page. Web browsers convert HTML into what we see as web
    pages on computer screens. JavaScript is able to manipulate, shape, all the HTML
    elements on a web page. This makes it a powerful tool for creating web applications.

    Programmers can place JavaScript code right inside HTML code. When a web browser
    loads HTML to display a web page, it also executes, or runs, all of the JavaScript
    code it finds inside the HTML. Web browsers execute the JavaScript code in the
    order in which it appears. This means JavaScript code in the beginning of the
    HTML is executed before code near the end. A common use for JavaScript is to let
    users know if they made an error while filling out a form online.'
- md: "\n## Terms to Know\n\nCoding isn't just for computer specialists. Anyone can\
    \ do it! Before we run through a few examples, here's a helpful list of terms\
    \ you'll need to understand. You'll be coding with JavaScript in no time!\n\n\
    > You don't have to be an expert—or even an adult to learn how to code. Check\
    \ to see if your school or local library offers a coding program and get started\
    \ today!\n\n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_15_0.png)\n\n- **alert**:\
    \ A built-in JavaScript function that shows a message to the user in a pop-up\
    \ window.\n- **code library**: Prewritten code that performs commonly used tasks\
    \ to save time when creating a program.\n- **function**: Reusable code that performs\
    \ a task and can be used repeatedly in a program.\n- **HTML event**: Something\
    \ the user or browser does that causes code to execute.\n- **HTML tag**: A single\
    \ building block of a web page.\n- **pop-up window**: A smaller window inside\
    \ the larger web browser window that is often used to display messages to the\
    \ user.\n- **write**: A built-in JavaScript function that writes text on the screen\
    \ in the web browser.\n\n```javascript\nfunction getValues(array) {\n  var matValue\
    \ = 0;\n  for (var index = 0; index < array.length; index++) {\n    var element\
    \ = array[index];\n  }\n}\n```\n\n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_16_0.png)[](img/d58e8e46bd867e5a296f2ee0f2d4ca26_16_1.png)\n\
    \nIt's easy to start coding a JavaScript. All you need is a simple text editor\
    \ and a web browser. Most computers already have these programs installed, or\
    \ set up for use. The text editor is where you write and save your code as an\
    \ html extension. The .html extension tells the browser it's opened in a web browser.\n\
    \n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_17_0.png)[](img/d58e8e46bd867e5a296f2ee0f2d4ca26_17_1.png)\n\
    \nThe HTML tags `<script>` and `</script>` instruct the web browser to treat the\
    \ text that appears between them as JavaScript code. In this example, `document.write(\"\
    Hello, World!\");` is the JavaScript code that gets executed.\n\n```html\n<!doctype\
    \ html>\n<html>\n<head>\n  <title>My Webpage</title>\n  <script>\n    document.write(\"\
    Hello, World!\");\n  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n<body>\
    \ containing your code in a browser. Once the file is loaded, you can hit the\
    \ browser’s refresh button to execute the code again.\n\n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_18_0.png)[](img/d58e8e46bd867e5a296f2ee0f2d4ca26_18_1.png)\n\
    \nThe previous example used a JavaScript function called \"write.\" Functions\
    \ are common to many programming languages and are important building blocks in\
    \ most applications. They do something and can be named anything else on its page.\n\
    \n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_19_0.png)\n\nSpelling and capitalization\
    \ matter when writing code. If you aren't consistent, your code won't work properly.\n\
    \n```html\n<!doctype html>\n<html>\n<head>\n  <title>My Webpage</title>\n  <script>\n\
    \    alert(\"Hello, World!\");\n  </script>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n- Functions can accept parameters. A parameter is a bit of information\
    \ that the code inside the function can use. In this example, we're passing the\
    \ text \"Hello, World!\" to the alert function as a parameter. The alert function's\
    \ task is to display its parameter in a pop-up window.\n\n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_20_0.png)[](img/d58e8e46bd867e5a296f2ee0f2d4ca26_20_1.png)\n\
    \nHere, we're using the HTML button tag to create a button. Within this tag, there's\
    \ a special attribute called \"onclick.\" This instructs the browser to call our\
    \ custom function.\n\n```javascript\nfunction say() {\n  alert(\"Hello, World!\"\
    );\n}\n```\n\n```html\n<!doctype html>\n<html>\n<head>\n  <title>My Webpage</title>\n\
    \  <script>\n    function say() {\n      alert(\"Hello, World!\");\n    }\n  </script>\n\
    </head>\n<body>\n  <button onclick=\"say()\">Say</button>\n</body>\n</html>\n\
    ```\n\nThe \"onclick\" attribute is one of several events. An event is something\
    \ the user or browser does. The \"onclick\" command tells the function to execute.\
    \ To put it simply, clicking the button will trigger the call to our \"say\" function,\
    \ which then executes the alert inside it.\n\nIt's good practice to use descriptive\
    \ names for the functions you create. This makes your code easier to understand.\n\
    \n```html\n<!doctype html>\n<html>\n<head>\n  <title>My Webpage</title>\n  <script>\n\
    \    function say() {\n      alert(\"Cheese!\");\n    }\n  </script>\n</head>\n\
    <body>\n  <button onclick=\"say()\">Say</button>\n</body>\n</html>\n```\n\n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_22_0.png)[](img/d58e8e46bd867e5a296f2ee0f2d4ca26_22_1.png)\n\
    \n## Game Plan\n\nWhen you're ready to create your own JavaScript program, here\
    \ are the steps to follow:\n\n1. Write out a simple plan for your program.\n2.\
    \ Open your text editor and create a file with a .html extension.\n3. Type the\
    \ following HTML code in the file:\n```html\n<!doctype html>\n<html>\n<head>\n\
    \  <title>My Webpage</title>\n  <script>\n  </script>\n</head>\n<body>\n</body>\n\
    </html>\n```\n4. Type your JavaScript code between the `<script>` and `</script>`\
    \ HTML tags.\n5. Save the file.\n6. Open the file in a web browser to run your\
    \ code!\n\nIf you make any changes to the code, be sure to save the file again\
    \ before you run it in the browser. Any changes you make won't show in the browser\
    \ unless you save the file first. Once you have your HTML file open in a web browser,\
    \ you can hit the refresh button each time you'd like to rerun the code. This\
    \ is if you're making lots of changes to your code.\n"
  mdcn: "\n\n## 需要了解的术语\n\n编程不仅仅是计算机专家的专利。任何人都可以做到！在我们运行几个示例之前，这里有一份你将需要的有用术语列表。你很快就能用\
    \ JavaScript 编写代码了！\n\n> 你不需要成为专家——甚至不需要成年人就可以学习编程。查看一下你的学校或当地图书馆是否提供编程课程，从今天就开始吧！\n\
    \n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_15_0.png)\n\n- **alert**: 一个内置的 JavaScript\
    \ 函数，会在弹出窗口中向用户显示消息。\n- **code library（代码库）**: 预写的代码，用于执行常用任务以便在创建程序时节省时间。\n-\
    \ **function（函数）**: 可重用的代码，执行特定任务并在程序中重复使用。\n- **HTML event（HTML 事件）**: 用户或浏览器的操作，会导致代码执行。\n\
    - **HTML tag（HTML 标签）**: 网页的单个构建模块。\n- **pop-up window（弹出窗口）**: 较大的浏览器窗口内部的较小窗口，通常用于向用户显示消息。\n\
    - **write（写入）**: 一个内置的 JavaScript 函数，在网页浏览器屏幕上写入文本。\n\n```javascript\nfunction\
    \ getValues(array) {\n  var matValue = 0;\n  for (var index = 0; index < array.length;\
    \ index++) {\n    var element = array[index];\n  }\n}\n```\n\n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_16_0.png)[](img/d58e8e46bd867e5a296f2ee0f2d4ca26_16_1.png)\n\
    \n开始编写 JavaScript 并不困难。你只需要一个简单的文本编辑器和一个网页浏览器。大多数计算机已经安装了这些程序，或者已经设置好可以使用。文本编辑器是你编写代码并将其保存为\
    \ .html 扩展名的地方。.html 扩展名告诉浏览器它是在网页浏览器中打开的。\n\n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_17_0.png)[](img/d58e8e46bd867e5a296f2ee0f2d4ca26_17_1.png)\n\
    \nHTML 标签 `<script>` 和 `</script>` 指令网页浏览器将它们之间的文本视为 JavaScript 代码。在这个示例中，`document.write(\"\
    Hello, World!\");` 就是被执行的 JavaScript 代码。\n\n```html\n<!doctype html>\n<html>\n\
    <head>\n  <title>My Webpage</title>\n  <script>\n    document.write(\"Hello, World!\"\
    );\n  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n`<body>` 标签包含你在浏览器中显示的代码。一旦文件加载完成，你就可以点击浏览器的刷新按钮再次执行代码。\n\
    \n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_18_0.png)[](img/d58e8e46bd867e5a296f2ee0f2d4ca26_18_1.png)\n\
    \n上一个示例使用了名为 \"write\" 的 JavaScript 函数。函数是许多编程语言共同的，也是大多数应用程序中重要的构建模块。它们执行某些操作，并可以在页面上命名为任何名称。\n\
    \n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_19_0.png)\n\n在编写代码时，拼写和大小写非常重要。如果不一致，你的代码将无法正常工作。\n\
    \n```html\n<!doctype html>\n<html>\n<head>\n  <title>My Webpage</title>\n  <script>\n\
    \    alert(\"Hello, World!\");\n  </script>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n- 函数可以接受参数。参数是函数内部代码可以使用的一些信息。在这个示例中，我们将文本 \"Hello, World!\" 作为参数传递给 alert\
    \ 函数。alert 函数的任务的任务是在弹出窗口中显示其参数。\n\n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_20_0.png)[](img/d58e8e46bd867e5a296f2ee0f2d4ca26_20_1.png)\n\
    \n在这里，我们使用 HTML button 标签来创建一个按钮。在这个标签内，有一个特殊的属性叫做 \"onclick\"。它指令浏览器调用我们的自定义函数。\n\
    \n```javascript\nfunction say() {\n  alert(\"Hello, World!\");\n}\n```\n\n```html\n\
    <!doctype html>\n<html>\n<head>\n  <title>My Webpage</title>\n  <script>\n   \
    \ function say() {\n      alert(\"Hello, World!\");\n    }\n  </script>\n</head>\n\
    <body>\n  <button onclick=\"say()\">Say</button>\n</body>\n</html>\n```\n\n\"\
    onclick\" 属性是多个事件中的一个。事件是用户或浏览器的操作。\"onclick\" 命令告诉函数执行。简单来说，点击按钮将触发对我们 \"say\"\
    \ 函数的调用，然后执行其内部的 alert。\n\n为你为你创建的函数使用描述性名称是一个良好的习惯。这会让你的代码更容易于理解。\n\n```html\n\
    <!doctype html>\n<html>\n<head>\n  <title>My Webpage</title>\n  <script>\n   \
    \ function say() {\n      alert(\"Cheese!\");\n    }\n  </script>\n</head>\n<body>\n\
    \  <button onclick=\"say()\">Say</button>\n</body>\n</html>\n```\n\n![](img/d58e8e46bd867e5a296f2ee0f2d4ca26_22_0.png)[](img/d58e8e46bd867e5a296f2ee0f2d4ca26_22_1.png)\n\
    \n## 计划\n\n当你准备好创建自己的 JavaScript 程序时，请遵循以下步骤：\n\n1. 为你的程序编写一个简单的计划。\n2. 打开你的文本编辑器并创建一个带有\
    \ .html 扩展的文件。\n3. 在文件中输入以下 HTML 代码：\n```html\n<!doctype html>\n<html>\n<head>\n\
    \  <title>My Webpage</title>\n  <script>\n  </script>\n</head>\n<body>\n</body>\n\
    </html>\n```\n4. 在 `<script>` 和 `</script>` HTML 标签之间输入你的 JavaScript 代码。\n5. 保存文件。\n\
    6. 在网页浏览器中打开文件以运行你的代码！\n\n如果你对代码进行了任何更改，请确保在在浏览器中运行之前再次保存文件。如果不先保存文件，你的任何更改都不会显示在浏览器中。\n\
    \n"
