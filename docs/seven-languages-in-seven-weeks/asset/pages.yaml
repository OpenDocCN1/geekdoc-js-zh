  md: '**3.2**


    **Day 1: Skipping School, Hanging Out**


    Meeting Io is like meeting any language. You’ll have to put in a little keyboard


    time to get properly acquainted. It will be much easier if we can interact


    outside of stifled conversations in the hallway before history class. Let’s cut


    school and skip straight to the good stuff.


    Names are sometimes deceiving, but you can tell a lot from Io. It’s simulta-


    neously reckless (ever try Googling for *Io*?)


    2 and brilliant. You get only two


    letters, both vowels. The language’s syntax is simple and low-level, like the


    name. Io syntax simply chains messages together, with each message


    returning an object and each message taking optional parameters in


    parentheses. In Io, everything is a message that returns another receiver.


    There are no keywords and only a handful of characters that behave like


    keywords.


    With Io, you won’t worry about both classes and objects. You’ll deal exclu-


    sively in objects, cloning them as needed. These clones are called *prototypes*,


    and Io is the first and only prototype-based language we’ll look at. In a *pro-*


    *totype* language, every object is a clone of an existing object rather than a


    class. Io gets you about as close to object-oriented Lisp as you’re likely to


    get. It’s too early to tell whether Io will have lasting impact, but the simplic-


    ity of the syntax means it has a fighting chance. The concurrency libraries


    that you’ll see in day 3 are well conceived, and the message semantics are


    elegant and powerful. Reflection is everywhere.


    **Breaking the Ice**


    Let’s crack open the interpreter and start the party. You can find it at


    http://iolanguage.com. Download it and install it. Open the interpreter by


    typing io, and enter the traditional “Hello, World” program:


    `**Io>**` `**"Hi ho, Io" print**`


    `Hi ho, Io==> Hi ho, Io`


    You can tell exactly what’s going on here. You’re sending the print message


    to the string "Hi ho, Io". Receivers go on the left, and messages go on the right.


    You won’t find much syntactic sugar at all. You’ll just send messages to


    objects.


    In Ruby, you created a new object by calling new on some class. You created


    a new kind of object by defining a class. Io makes no distinction between


    2.


    Try Googling for *Io language* instead.


