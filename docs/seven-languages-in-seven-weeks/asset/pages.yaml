    `**>>**` `**4.class.superclass.superclass.superclass**`


    `=> Object`


    `**>>**` `**4.class.superclass.superclass.superclass.superclass**`


    `=> nil`


    So far, so good. Objects are derived from a class. The 4’s class is Fixnum,


    which inherits from Integer, Numeric, and ultimately Object.


    Check out Figure 1, *Ruby metamodel*, on page 44 to see how things fit


    together. Everything eventually inherits from Object. A Class is also a Module.


    Instances of Class serve as templates for objects. In our case, Fixnum is an


    instance of a class, and 4 is an instance of Fixnum. Each of these classes is


    also an object:


    `**>>**` `**4.class.class**`


    `=> Class`


    `**>>**` `**4.class.class.superclass**`


    `=> Module`


    `**>>**` `**4.class.class.superclass.superclass**`


    `=> Object`


    So, Fixnum is an instance of the class Class. From there, it really gets confusing.


    Class inherits from Module, and Module inherits from Object. When all is said


    and done, everything in Ruby has a common ancestor, Object.


