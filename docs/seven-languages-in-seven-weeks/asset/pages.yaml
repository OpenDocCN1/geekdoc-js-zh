    **Concurrency**


    Io has outstanding concurrency libraries. The main components are corou-


    tines, actors, and futures.


    **Coroutines**


    The foundation for concurrency is the coroutine. A coroutine provides a way


    to voluntarily suspend and resume execution of a process. Think of a


    coroutine as a function with multiple entry and exit points. Each yield will


    voluntarily suspend the process and transfer to another process. You can


    fire a message asynchronously by using @ or @@ before a message. The


    former returns a future (more later), and the second returns nil and starts


    the message in its own thread. For example, consider this program:


    **Download io/coroutine.io**


    `vizzini :=` `**Object clone**`


    `vizzini talk :=` `**method**``(`


    `*"Fezzik, are there rocks ahead?"*` `println`


    `yield`


    `*"No more rhymes now, I mean it."*` `println`


    `yield)`


