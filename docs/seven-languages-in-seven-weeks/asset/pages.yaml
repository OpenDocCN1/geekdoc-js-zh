    **What We Learned in Day 2**


    In this section, we moved into the basic building blocks that Prolog uses to


    organize data: lists and tuples. We also nested rules, allowing us to express


    problems that you might handle with iteration in other languages. We took


    a deeper look at Prolog unification and how Prolog works to match up both


    sides of a :- or =. We saw that when we’re writing rules, we described logical


    rules instead of algorithms and let Prolog work its way through the solution.


    We also used math. We learned to use basic arithmetic and nested subgoals


    to compute sums and averages.


