    That’s


    a monad.


    In short, a monad lets us compose functions in ways that have specific


    properties. In Haskell, we’ll use monads for several purposes. First, dealing


    with things such as I/O is difficult because in a pure functional language,


    a function should deliver the same results when given the same inputs, but


    for I/O, you would want your functions to change based on the state of the


    contents of a file, for example.


    Also, code like the drunken pirate earlier works because it preserves state.


    Monads let you simulate program state. Haskell provides a special syntax,


    called *do syntax*, to allow programs in the imperative style. Do syntax


    depends on monads to work.


    Finally, something as simple as an error condition is difficult because the


    type of thing returned is different based on whether the function was suc-


    cessful. Haskell provides the Maybe monad for this purpose. Let’s dig a little


    deeper.


    **Components of a Monad**


    At its basic level, a monad has three basic things:


    • A type constructor that’s based on some type of container. The container


    could be a simple variable, a list, or anything that can hold a value. We


    will use the container to hold a function. The container you choose will


    vary based on what you want your monad to do.


    • A function called return that wraps up a function and puts it in the con-


    tainer. The name will make sense later, when we move into do notation.


    Just remember that return wraps up a function into a monad.


    • A bind function called >>= that unwraps a function. We’ll use *bind* to


    chain functions together.


    All monads will need to satisfy three rules. I’ll mention them briefly here.


    For some monad m, some function f, and some value x:


    • You should be able to use a type constructor to create a monad that will


    work with some type that can hold a value.


    • You should be able to unwrap and wrap values without loss of informa-


    tion. (monad >>= return = monad)


    • Nesting bind functions should be the same as calling them sequentially.


    ((m >>= f) >>= g = m >>= (\x -> f x >>= g))


