  md: 'initial value (for the first invocation) or the result from the code block
    (for


    subsequent invocations). There are two versions of the method. The first


    version, /:, is an operator with initialValue /: codeBlock. Here’s the method
    in


    action:


    `**scala>**` `**val list = List(1, 2, 3)**`


    `list: List[Int] = List(1, 2, 3)`


    `**scala>**` `**val sum = (0 /: list) {(sum, i) => sum + i}**`


    `sum: Int = 6`


    We walked through this sequence for Ruby, but it may help you to see it


    again. Here’s how it works:


    • We invoke the operator with a value and a code block. The code block


    takes two arguments, sum and i.


    • Initially, /: takes the initial value, 0, and the first element of list, 1,
    and


    passes them into the code block. sum is 0, i is 1, and the result of 0 + 1 is


    1.


    • Next, /: takes 1, the result returned from the code block, and folds it


    back into the calculation as sum. So, sum is 1; i is the next element of list,


    or 2; and the result of the code block is 3.


    • Finally, /: takes 3, the result returned from the code block, and folds it


    back into the calculation as sum. So, sum is 3; i is the next element of list,


    or 3; and sum + i is 6.


    The syntax of the other version of foldLeft will seem strange to you. It uses
    a


    concept called *currying*. Functional languages use currying to transform a


    function with multiple parameters to several functions with their own


    parameter lists. We’ll see more currying in Chapter 8, *Haskell*, on page 261.


    Just understand that what’s going on under the covers is a composition of


    functions rather than a single function. Though the mechanics and syntax


    are different, the result is exactly the same:


    `**scala>**` `**val list = List(1, 2, 3)**`


    `list: List[Int] = List(1, 2, 3)`


    `**scala>**` `**list.foldLeft(0)((sum, value) => sum + value)**`


    `res54: Int = 6`


    Notice that the function call list.foldLeft(0)((sum, value) => sum + value) has
    two


    parameter lists. That’s the currying concept that I mentioned earlier. You’ll


    see versions of this method with all the rest of the languages in this book.


