    **defrecord and protocols**


    So far, we’ve talked about Java integration at a high level, but you haven’t


    seen much of the JVM bleed through to the Clojure language. When all is


    said and done, the JVM is about types and interfaces. (For you non-Java


    programmers, think of types as Java classes. Think of interfaces as Java


    classes without implementations.) To make Clojure integrate well with the


    JVM, the original implementation has a significant amount of Java in it.


    As Clojure picked up more speed and began to prove itself as an effective


    JVM language, there was a strong thrust to implement more of Clojure in


    Clojure itself. To do so, Clojure developers needed a way to build platform-


    fast open extensions by programming to abstractions rather than to


    implementations. The results are defrecord for types and defprotocol, which


    groups functions together around a type. From a Clojure perspective, the


    best parts of OO are types and protocols (such as interfaces), and the worst


    parts are implementation inheritance. Clojure’s defrecord and defprotocol pre-


    serve the good parts of OO and leave the rest.


