    The buzz around Scala is growing, because Twitter has switched its core


    message processing from Ruby to Scala. The object-oriented features allow


    a pretty smooth transition from the Java language, but the ideas that are


    drawing attention to Scala are the functional programming features. Pure


    functional languages allow a style of programming that has strong mathe-


    matical foundations. A functional language has these characteristics:


    • Functional programs are made up of functions.


    • A function always returns a value.


    • A function, given the same inputs, will return the same values.


    • Functional programs avoid changing state or mutating data. Once you’ve


    set a value, you have to leave it alone.


    Strictly speaking, Scala is not a pure functional programming language,


    just like C++ is not a pure object-oriented language. It allows mutable values,


    which can lead to functions with the same inputs but different outputs.


    (With most object-oriented languages, using getters and setters would break


    that rule.) But it offers tools that allow developers to use functional abstrac-


    tions where they make sense.


    **Functional Programming and Concurrency**


    The biggest problem facing concurrency-minded programmers in object-


    oriented languages today is *mutable state*, meaning data that can change.


    Any variable that can hold more than one value, after initialization, is


    mutable. Concurrency is the Dr. Evil to mutable state’s Austin Powers. If


    two different threads can change the same data at the same time, it’s difficult


    to guarantee that the execution will leave the data in a valid state, and


    testing is nearly impossible. Databases deal with this problem with transac-


    tions and locking. Object-oriented programming languages deal with this


    problem by giving programmers the tools to control access to shared data.


    And programmers generally don’t use those tools very well, even when they


    know how.


    Functional programming languages can solve these problems by eliminating


    mutable state from the equation. Scala does not force you to completely


    eliminate mutable state, but it does give you the tools to code things in a


    purely functional style.


