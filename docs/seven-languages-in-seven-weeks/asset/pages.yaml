    **Help for Dangerous Times**


    Many of the readers of this book won’t be old enough to remember the last


    time our industry switched programming paradigms. Our shift to object-


    oriented programming had a couple of false starts, but the old structural


    programming paradigm was simply unable to handle the complexity required


    for modern web applications. The successful Java programming language


    gave us a hard shove in that direction, and the new paradigm stuck. Many


    developers got caught with old skills and had to completely retool the way


    they thought, the tools they used, and the way they designed applications.


    We may be in the midst of another transformation. This time, new computer


    designs will be the driver. Five of the seven languages in this book have


    compelling concurrency models. (Ruby and Prolog are the exceptions.)


    Whether or not your programming language changes right away, I’m going


