  md: '**var versus val**


    Scala is based on the Java virtual machine and has a tight relationship with


    Java. In some ways, these design goals limit the language. In other ways,


    Scala can take advantage of the last fifteen or twenty years of programming


    language development. You’ll see an increased emphasis on making Scala


    friendly for concurrent programming. But all the concurrency features in


    the world won’t help you if you don’t follow basic design principles. Mutable


    state is bad. When you declare variables, you should make them immutable


    whenever you can to avoid conflicting state. In Java, that means using the


    final keyword. In Scala, immutable means using val instead of var:


    `**scala>**` `**var mutable = "I am mutable"**`


    `mutable: java.lang.String = I am mutable`


    `**scala>**` `**mutable = "Touch me, change me..."**`


    `mutable: java.lang.String = Touch me, change me...`


    `**scala>**` `**val immutable = "I am not mutable"**`


    `immutable: java.lang.String = I am not mutable`


    `**scala>**` `**immutable = "Can''t touch this"**`


    `<console>:5: error: reassignment to val`


    `immutable = "Can''t touch this"`


    `^`


    So, var values are mutable; val values are not. In the console, as a conve-


    nience, you can redefine a variable several times even if you use val. Once


    you step outside of the console, redefining a val will generate an error.


    In some ways, Scala had to introduce the var-style variables to support the


    traditional imperative programming style, but while you’re learning Scala,


    it’s best to avoid var when you can for better concurrency. This basic design


    philosophy is the key element that differentiates functional programming


    from object-oriented programming: *mutable state limits concurrency*.


    Let’s move on to some of my favorite areas within functional languages,


    dealing with collections.


    **Collections**


    Functional languages have a long history of spectacularly useful features


    for collections. One of the earliest functional languages, Lisp, was built


    around the idea of dealing with lists. The very name stands for LISt Process-


    ing. Functional languages make it easy to build complex structures that


    contain data and code. Scala’s primary collections are lists, sets, and maps.


