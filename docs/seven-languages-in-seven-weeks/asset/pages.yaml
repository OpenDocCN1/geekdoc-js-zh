  md: '**What We Learned in Day 1**


    Erlang is a functional language. It is strongly, dynamically typed. There is


    not a lot of syntax, but what is there is not at all like the typical object-


    oriented languages.


    Like Prolog, Erlang has no notion of an object. However, Erlang does have


    a strong connection to Prolog. The pattern matching constructs and multiple


    function entry points should look familiar to you, and you handle some


    problems in the same way, through recursion. The functional language has


    no notion of mutable state or even side effects. Maintaining program state


    is awkward, but you will learn a new bag of tricks. You’ll soon see the other


    side of the coin. Eliminating state and side effects will have a dramatic impact


    on how you will manage concurrency.


    In the first day, you worked both in the console and with the compiler. Pri-


    marily, you focused on the basics. You created basic expressions. You also


    created simple functions. Like Prolog, Erlang lets a function have multiple


    entry points. You used basic pattern matching.


    You also used basic tuples and lists. Tuples took the place of Ruby hashes


    and formed the foundation of data structures. You learned to pattern match


    across lists and tuples. These ideas will allow you to quickly attach behavior


    to tuples or interprocess messages in later chapters.


    In day 2, I’m going to expand the basic functional concepts. We’ll learn how


    to build code that will work in a concurrent world, but we won’t actually go


    there yet. Take a little time to do some self-study to practice what you’ve


    learned so far.


    **Day 1 Self-Study**


    The online community for Erlang is growing rapidly. A conference in San


    Francisco is picking up momentum. And unlike Io and C, you should be


    able to use Google to find what you need.


    Find:


    • The Erlang language’s official site


    • Official documentation for Erlang’s function library


    • The documentation for Erlang’s OTP library


