    **Defining Classes**


    Like Java, C#, and C++, Ruby has classes and objects. Think cookie cutter


    and cookie—classes are templates for objects. Of course, Ruby supports


    inheritance. Unlike C++, a Ruby class can inherit from only one parent,


    called a *superclass*. To see it all in action, from the console, type the


    following:


    `**>>**` `**4.class**`


    `=> Fixnum`


    `**>>**` `**4.class.superclass**`


    `=> Integer`


    `**>>**` `**4.class.superclass.superclass**`


