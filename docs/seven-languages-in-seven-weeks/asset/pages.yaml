    Scala


    So far, I have introduced three languages and three different programming


    paradigms. Scala will be the fourth, sort of. It’s a hybrid language, meaning


    that it intentionally tries to bridge the gaps between programming paradigms.


    In this case, the bridge is between object-oriented languages like Java and


    functional languages like Haskell. In this sense, Scala is a Frankenstein


    monster of sorts but not a monster. Think *Edward Scissorhands*.


    1


    In this surreal Tim Burton movie, Edward was part boy, part machine, with


    scissors for hands, and was one of my favorite characters of all time. Edward


    was a fascinating character in a beautiful movie. He was often awkward,


    was sometimes amazing, but always had a unique expression. Sometimes,


    his scissors let him do incredible things. Other times, he was awkward and


    humiliated. As with anything new or different, he was often misunderstood,


    accused of “straying too far from the path of righteousness.” But in one of


    his stronger moments, the shy kid offers, “We are not sheep.” Indeed.


    **5.1**


    **About Scala**


    As requirements for computer programs get more complex, languages, too,


    must evolve. Every twenty years or so, the old paradigms become inadequate


    to handle the new demands for organizing and expressing ideas. New


    paradigms must emerge, but the process is not a simple one.


    Each new programming paradigm ushers in a wave of programming lan-


    guages, not just one. The initial language is often strikingly productive and


    wildly impractical. Think Smalltalk for objects or Lisp for functional lan-


    guages. Then, languages from other paradigms build in features that allow


    people to absorb the new concepts while users can live safely within the old


