  md: 'CHAPTER 1


    Introduction


    People learn spoken languages for different reasons. You learned your first


    language to live. It gave you the tools to get through your everyday life. If


    you learned a second language, the reasons could be very different. Some-


    times, you might have to learn a second language to further your career or


    adapt to a changing environment. But sometimes you decide to conquer a


    new language not because you have to but because you want to learn. A


    second language can help you encounter new worlds. You may even seek


    enlightenment, knowing every new language can shape the way you think.


    So it is with programming languages. In this book, I will introduce you to


    seven different languages. My goal is not to make a motherly demand like


    your morning spoonful of cod liver oil. I want to guide you through a journey


    that will enlighten you and change the way you look at programming. I won’t


    make you an expert, but I’ll teach you more than “Hello, World.”


    **1.1**


    **Method to the Madness**


    Most of the time, when I’m learning a new programming language or


    framework, I’ll look for a quick interactive tutorial. My goal is to experience


    the language in a controlled environment. If I want, I can go off script and


    explore, but I’m basically looking for a quick jolt of caffeine, a snapshot of


    syntactic sugar, and core concepts.


    But usually, the experience is not fulfilling. If I want to get the true flavor


    of a language that is more than a subtle extension of one I already know, a


    short tutorial is *never* going to work. I need a deep, fast dive. This book will


    give you such an experience not once but seven times. You’ll find answers


    to the following questions:


    • *What is the typing model?* Typing is strong (Java) or weak (C), static


    (Java) or dynamic (Ruby). The languages in this book lean on the strong


