  md: 'Clojure has a basic data type called a *ratio*. It’s a nice feature that will
    allow


    delaying computation to avoid the loss of precision. You can still easily work


    in floats if you so choose. You can easily calculate remainders:


    `user=> (mod 5 4)`


    `1`


    That’s short for modulus operator. This notation is called *prefix notation*.


    Languages to this point have supported infix notation, with the operator


    between the operands, like 4 + 1 - 2. Many people prefer infix notation because


    we’re used to it. We’re used to seeing math expressed in this way. After


    warming up, you should be getting into the flow of prefix notation. It’s a


    little awkward doing math in this way, but it works. Prefix notation with


    parentheses does have advantages, though. Consider this expression:


    `user=> (/ (/ 12 2) (/ 6 2))`


    `2`


    There’s no ambiguity. Clojure will evaluate this statement in parenthetical


    order. And check out this expression:


    `user=> (+ 2 2 2 2)`


    `8`


    You can easily add elements to the calculation, if you so choose. You can


    even use this style when working with subtraction or division:


    `user=> (- 8 1 2)`


    `5`


    `user=> (/ 8 2 2)`


    `2`


    We’ve evaluated (8 - 1) - 2 and (8 / 2) / 2 in conventional (infix) notation.


    Or, if you’d like to see the Clojure equivalent using only two operands at a


    time, it is (- (- 8 1) 2) and (/ (/ 8 2) 2). You can also get some surprisingly
    powerful


    results out of simple operator evaluation:


    `user=> (< 1 2 3)`


    `true`


    `user=> (< 1 3 2 4)`


    `false`


    Nice. We can see whether a list is in order with a single operator and an


    arbitrary number of arguments.


    Aside from the prefix notation and the extra wrinkle of multiple parameter


    lists, Clojure’s syntax is very simple. Let’s try to push the typing system a


    little, probing for strong typing and coerced types:


