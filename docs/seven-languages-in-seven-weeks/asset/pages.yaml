  md: 'Like Io, Armstrong’s creation uses actors for concurrency, so message


    passing is a critical concept. You’ll recognize Scala’s message passing syntax,


    which is similar to Erlang’s message passing. In Scala, an actor represents


    an object, backed by a thread pool. In Erlang, an actor represents a


    lightweight process. The actor reads inbound messages from a queue and


    uses pattern matching to decide how to process it.


    **Reliability**


    Erlang does have traditional error checking, but in a traditional application,


    you’ll see far less error handling than you would in a traditional fault-tolerant


    application. The Erlang mantra is “Let it crash.” Since Erlang makes it easy


    to monitor the death of a process, killing related processes and starting new


    ones are trivial exercises.


    You can also hot-swap code, meaning you can replace pieces of your


    application without stopping your code. This capability allows far simpler


    maintenance strategies than similar distributed applications. Erlang com-


    bines the robust “Let it crash” error strategies with hot-swapping and


    lightweight processes that you can start with minimal overhead. It’s easy


    to see how some applications run for years at a time without downtime.


    So, the Erlang concurrency story is compelling. The important primi-


    tives—message passing, spawning a process, monitoring a process—are all


    there. The processes that you spawn are lightweight, so you don’t have to


    worry about constrained resources in this area. The language is heavily


    slanted to remove side effects and mutability, and monitoring the death of


    a process is simple, even trivial. The combined package is compelling.


