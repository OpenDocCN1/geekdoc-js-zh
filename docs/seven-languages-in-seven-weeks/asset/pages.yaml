    **Where****’****s the Program?**


    We have no algorithm! Try solving this problem in the procedural language


    of your choice. Is your solution easy to understand? Think through what


    you’d have to do to solve complex logic problems like this in Ruby or Io. One


    possible solution would be as follows:


    1.


    Collect and organize your logic.


    2.


    Express your logic in a program.


    3.


    Find all possible solutions.


    4.


    Put the possible solutions through your program.


    And you would have to write this program over and over. Prolog lets you


    express the logic in facts and inferences and then lets you ask questions.


    You’re not responsible for building any step-by-step recipe with this lan-


    guage. Prolog is not about writing algorithms to solve logical problems.


    Prolog is about describing your world as it is and presenting logical problems


    that your computer can try to solve.


    Let the computer do the work!


