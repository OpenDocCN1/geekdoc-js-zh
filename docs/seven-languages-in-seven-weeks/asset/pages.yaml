    • A board has eight queens.


    • Each queen has a row from 1–8 and a column from 1–8.


    • No two queens can share the same row.


    • No two queens can share the same column.


    • No two queens can share the same diagonal (southwest to northeast).


    • No two queens can share the same diagonal (northwest to southeast).


    Rows and columns must be unique, but we must be more careful with diag-


    onals. Each queen is on two diagonals, one running from the lower left


    (northwest) to the upper right (southeast) and the other running from the


    upper left to the lower right as in Figure 5, *Eight Queens rules*, on page 125.


    But these rules should be relatively easy to encode.


    Once again, we’ll start at the top of the list. A board has eight queens. That


    means our list must have a size of eight. That’s easy enough to do. We can


    use the count predicate you saw earlier in the book, or we can simply use a


    built-in Prolog predicate called length. length(List, N) succeeds if List has
    N ele-


    ments. This time, rather than show you each goal in action, I’m going to


    walk you through the goals we’ll need to solve the whole problem. Here’s


    the first goal, then:


    `eight_queens(List)` `**:-**` `length(List, 8).`


    Next, we need to make sure each queen from our list is valid. We build a


    rule to test whether a queen is valid:


    `valid_queen((Row, Col))` `**:-**`


    `Range = [1,2,3,4,5,6,7,8],`


    `member(Row, Range), member(Col, Range).`


    The predicate member does just what you think; it tests for membership. A


    queen is valid if both the row and column are integers from 1–8\. Next, we’ll


    build a rule to check whether the whole board is made up of valid queens:


    `valid_board([]).`


    `valid_board([Head|Tail]) :- valid_queen(Head), valid_board(Tail).`


