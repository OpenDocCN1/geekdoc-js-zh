  md: '**Web Development**


    Rails is already one of the most successful web development frameworks of


    all time. The design is based on well-understood model-view-controller


    paradigms. The many naming conventions for database and application


    elements allow a typical application to be built with few lines of configuration


    at all. And the framework has plug-ins that handle some difficult production


    issues:


    • The structure of Rails applications is always consistent and well


    understood.


    • Migrations handle changes in the database schema.


    • Several well-documented conventions reduce the total amount of config-


    uration code.


    • Many different plug-ins are available.


    **Time to Market**


    I would consider the productivity of Ruby and Rails to be an important


    component in its success. In the mid-2000s, you could not throw a rock in


    San Francisco without hitting someone who worked at a start-up powered


    by Rails. Even today, Ruby is prolific in these kinds of companies, including


    mine. The combination of the beautiful syntax and the community of pro-


    grammers, tools, and plug-ins is extremely powerful. You can find Ruby


    gems to find the ZIP code of a surfer and another to calculate all address


    codes in a fifty-mile radius. You can process images and credit cards, work


    with web services, and communicate across many programming languages.


    Many large, commercial websites use Ruby and Ruby on Rails. The original


    Twitter implementation was in Ruby, and the extraordinary productivity of


    the language allowed the website to grow to huge proportions. Eventually,


    the core of Twitter was rewritten in Scala. There are two lessons here. First,


    Ruby is a great language for getting a viable product to market quickly.


    Second, the scalability of Ruby is limited in some ways.


    In formal big enterprises with distributed transactions, fail-safe messaging,


    and internationalization, the role of Ruby is often seen as a little more lim-


    ited, but Ruby can do all of these things. Sometimes, concerns about the


    right application frameworks and scalability are well-founded, but too many


    people focus on enough scalability to build the next eBay when they can’t


    deliver any software on time. Often, Ruby would be more than adequate


    considering the time-to-market pressures many enterprises face.


