  md: 'If there are not enough elements in the list, the pattern won’t match:


    `**36>**` `**[X|Rest] = [].**`


    `** exception error: no match of right hand side value []`


    Now, some of the other error messages make a little more sense. Let’s say


    you forget to start your variables with an uppercase letter. You’ll get this


    error message:


    `**31>**` `**one = 1.**`


    `** exception error: no match of right hand side value 1`


    As you’ve seen before, the = statement is not a simple assignment. It is


    actually a pattern match. You’re asking Erlang to match the integer 1 with


    the atom one, and it can’t.


    **Bit Matching**


    Sometimes, you need to access data at the bit level. If you’re cramming more


    data into less space or dealing with predefined formats such as JPEGs or


    MPEGs, the location of each bit matters. Erlang lets you pack several pieces


    of data into one byte quite easily. To do these two things, you need two


    operations: pack and unpack. In Erlang, a bitmap works just like other


    types of collections. To pack a data structure, you’ll just tell Erlang how


    many bits to take for each item, like this:


    `**1>**` `**W = 1.**`


    `1`


    `**2>**` `**X = 2.**`


    `2`


    `**3>**`


    `**3>**` `**Y = 3.**`


    `3`


    `**4>**` `**Z = 4.**`


    `4`


    `**5>**` `**All = <<W:3, X:3, Y:5, Z:5>>.**`


    `<<"(d">>`


    The << and >> bracket binary patterns in this constructor. In this case, it


    means take 3 bits for the variable W, 3 bits for X, 5 bits for Y, and 5 bits for


    Z. Next, we need to be able to unpack. You can probably guess the syntax:


    `**6>**` `**<<A:3, B:3, C:5, D:5>> = All.**`


    `<<"(d">>`


    `**7>**` `**A**`


    `**7>**` `**.**`


    `1`


    `**8>**` `**D.**`


    `4`


