  md: 'In the chapter, I mentioned the problems with if and case constructs. The


    syntactic rules are logical—use a separator between statements—but not


    practical because you can’t change the order of case, if, or receive blocks


    without having to change your punctuation. These restrictions are unneces-


    sary. And there are other oddities, such as the conditional presentation of


    an array of numbers as strings. Cleaning these up would help Erlang


    tremendously.


    **Integration**


    As with the Prolog heritage, not being on the JVM has been a double-edged


    sword. Recently, a JVM-based VM called Erjang has made progress but is


    not yet to the level of the best JVM alternatives. The JVM does come with


    baggage, such as a process and threading model that’s inadequate for


    Erlang’s needs. But being on the JVM has a set of advantages as well, too,


    including the wealth of Java libraries and the hundreds of thousands of


    potential deployment servers.


    **Final Thoughts**


    The success of a programming language is a fickle thing. Erlang faces some


    serious obstacles on the marketing side, and having to lure Java program-


    mers over to a Lisp-style programming paradigm and a Prolog-style syntax


    won’t be easy. Erlang does seem to be gathering momentum because it


    solves the right problems in the right way at the right time. In this battle


    between Anderson and Agent Smith, I give Agent Smith an even-money


    chance at success.


