    macros, called *reader macros*. A semicolon (;) is a comment, a single quote


    mark ('') is a quote, and a number sign (#) is an anonymous function. To


    prevent premature execution, we’ll put a quote in front of the expression we


    want to expand:


    `user=> (macroexpand ''''something-we-do-not-want-interpreted)`


    `(quote something-we-do-not-want-interpreted)`


    `user=> (macroexpand ''#(count %))`


    `(fn* [p1__97] (count p1__97))`


    These are macros. In general, macro expansion will let you treat code like


    lists. If you don’t want a function to execute right away, quote it. Clojure


    will replace the arguments intact. Our unless will look like this:


    `user=> (defmacro unless [test body]`


    `(list ''if (list ''not test) body))`


    `#''user/unless`


    Note that Clojure substitutes test and body without evaluating them, but we


    have to quote if and not. We also have to package them in lists. We’re building


    a list of code in the exact form that Clojure will execute. We can macroexpand


    it:


    `user=> (macroexpand ''(unless condition body))`


    `(if (not condition) body)`


    And we can execute it:


    `user=> (unless true (println "No more danger, Will."))`


    `nil`


    `user=> (unless false (println "Now, THIS is The FORCE."))`


    `Now, THIS is The FORCE.`


    `nil`


    What we’ve done is change the base definition of the language. We are adding


    our own control structure, without requiring the language designers to add


    their own keywords. Macro expansion is perhaps the most powerful feature


    of Lisp, and few languages can do it. The secret sauce is the expression of


    data as code, not just a string. The code is already in a higher-order data


    structure.


