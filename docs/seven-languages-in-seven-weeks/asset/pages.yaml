    **Wrapping Up Erlang**


    At the beginning of this chapter, I said that Erlang made hard things easy


    and easy things hard. The Prolog-style syntax is alien to those familiar with


    the broad family of C-style languages, and the functional programming


    paradigm has its own set of challenges.


    But Erlang has some core capabilities that will be tremendously important


    as new hardware designs make programming for concurrency more impor-


    tant. Some of the capabilities are philosophical. The lightweight processes


    run counter to Java’s thread and process models. The “Let it crash” philos-


    ophy simplifies code tremendously but also requires base support at the


    virtual machine level that just doesn’t exist in other systems. Let’s break


    down the core advantages and disadvantages.


    **Core Strengths**


    Erlang is all about concurrency and fault tolerance, from the inside out. As


    processor designers look to distributed cores, the state of the art in program-


    ming must evolve. Erlang’s strengths are in the most important areas that


    this generation of programmers will face.


    **Dynamic and Reliable**


    First and foremost, Erlang is built for reliability. The core libraries have


    been tested, and Erlang applications are among the most reliable and


    available in the world. Most impressively, the language designers achieved


    this reliability without sacrificing the dynamic typing strategies that make


    Erlang so productive. Rather than depend on the compiler for an artificial


    safety net, Erlang depends on the ability to link concurrent processes, reli-


    ably and simply. I was astounded about how easy it was to build dependable


    monitors without relying on operating system kludges.


    I think the set of compromises that you find in Erlang is compelling and


    unique. The Java language and virtual machine does not provide the right


    set of primitives to duplicate Erlang performance or reliability. The libraries


    built on the BEAM also reflect this philosophy, so it’s relatively easy to build


    reliable, distributed systems.


    **Lightweight, Share-Nothing Processes**


    Another place Erlang shines is the underlying process model. Erlang


    processes are light, so Erlang programmers use them often. Erlang builds


    on a philosophy of enforcing immutability, so programmers build systems


    that are inherently less likely to fail by conflicting with one another. The


