    **Working with Atoms**


    If you want thread safety for a single reference, uncoordinated with any


    other activity, then you can use atoms. These data elements allow change


    outside the context of a transaction. Like a reference, a Clojure atom is an


    encapsulated bit of state. Let’s try it. Create an atom:


    `user=> (atom "Split at your own risk.")`


