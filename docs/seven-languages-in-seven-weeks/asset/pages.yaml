    **Wrapping Up Scala**


    We’ve covered Scala more exhaustively than the other languages so far


    because Scala strongly supports two programming paradigms. The object-


    oriented features firmly position Scala as a Java alternative. Unlike Ruby


    and Io, Scala has a static typing strategy. Syntactically, Scala borrows many


    elements from Java, including curly braces and constructor usage.


    Scala also offers strong support for functional concepts and immutable


    variables. The language has a strong focus on concurrency and XML, fitting


    a wide variety of enterprise applications currently implemented in the Java


    language.


    Scala’s functional capabilities go beyond what I’ve covered in this chapter.


    I haven’t covered constructs such as currying, full closures, multiple param-


    eter lists, or exception processing, but they are all worthy concepts that add


    to the power and flexibility of Scala.


    Let’s look at some of Scala’s core strengths and weaknesses.


    **Core Strengths**


    Most of Scala’s strengths are centered around an advanced programming


    paradigm that integrates well with the Java environment and some core


    well-designed features. In particular, actors, pattern matching, and the XML


    integration are important and well-designed. Let’s get right to the list.


    **Concurrency**


    Scala’s treatment of concurrency represents a significant advance in concur-


    rent programming. The actor model and the thread pool are welcome im-


    provements, and the ability to design applications without mutable state is


    absolutely huge.


    The actor paradigm that you’ve seen in Io and now Scala is easy to under-


    stand for developers and well studied by the academic community. Both


    Java and Ruby could use some improvement in this area.


