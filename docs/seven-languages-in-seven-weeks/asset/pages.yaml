    **What We Learned in Day 1**


    Clojure is a functional language on the JVM. Like Scala and Erlang, this


    Lisp dialect is a functional language but not a pure functional language. It


    allows limited side effects. Unlike other Lisp dialects, Clojure adds a little


    syntax, preferring braces for maps and brackets for vectors. You can use


    commas for whitespace and omit parentheses in some places.


    We learned to use the basic Clojure forms. The simpler forms included


    booleans, characters, numbers, keywords, and strings. We also broke into


    the various collections. Lists and vectors were ordered containers with vectors


    optimized for random access and lists optimized for ordered traversal. We


    used sets, or unordered collections, and maps, which were key-value pairs.


    We defined some named functions, providing a name, parameter list, and


    function body with an optional documentation string. Next, we used decon-


    struction with bindings, allowing us to bind any parameter to any part of


    an inbound argument. The feature was reminiscent of Prolog or Erlang.


    Finally, we defined some anonymous functions and used them to iterate


    over a list with the map function.


    On day 2, we’ll look at recursion in Clojure, a basic building block in most


    functional languages. We’ll also look at sequences and lazy evaluations,


    some cornerstones of the Clojure models that help layer a common, powerful


    abstraction on top of collections.


