    **Wrapping Up Haskell**


    Of all the languages in this book, Haskell was the only one created by


    committee. After the proliferation of purely functional languages with lazy


    semantics, a committee was formed to build an open standard that would


    consolidate existing capabilities and future research. Haskell was born, with


    version 1.0 defined in 1990\. The language and community have grown since


    then.


    Haskell supports a wide variety of functional capabilities including list


    comprehensions, lazy computing strategies, partially applied functions, and


    currying. In fact, by default, Haskell functions process one parameter at a


    time, using currying to support multiple arguments.


    The Haskell type system provides an excellent balance of type safety and


    flexibility. The fully polymorphic template system allows sophisticated


    support for user-defined types and even type classes that fully support


    inheritance of interface. Usually, the Haskell programmer is not burdened


    with type details except in the function declarations, but the type system


    protects users from all kinds of type errors.


    As with any pure functional language, Haskell developers must be creative


    to deal with imperative-style programs and accumulated state. I/O can also


    be a challenge. Fortunately, Haskell developers can rely on monads for that


    purpose. A monad is a type constructor and a container that supports basic


    functions to wrap and unwrap functions as values. Different container types


    provide different computational strategies. These functions allow program-


    mers to chain together monads in interesting ways, providing *do syntax*.


    This syntactic sugar allows imperative-style programs with certain


    limitations.


