  md: '**Syntax**


    I do find Scala’s syntax to be a little academic and hard on the eyes. I hesitate


    to put this in print because syntax can be so subjective, but some elements


    are a little baffling. Sometimes, Scala keeps Java conventions, such as


    constructors. You’d use new Person rather than Person.new. At other times, Scala


    introduces a new convention, as with argument types. In Java, you’d use


    setName(String name) versus Scala’s setName(name: String). Return types shift
    to


    the end of the method declaration versus the beginning, as they are with


    Java. These little differences keep me thinking about syntax rather than


    code. The problem is that moving back and forth between Scala and Java


    will take more effort than it should.


    **Mutability**


    When you build a bridge language, you must factor in compromises. One


    significant compromise in Scala is the introduction of mutability. With var,


    Scala opens Pandora’s box in some ways, because the mutable state allows


    a wide variety of concurrency bugs. But such compromises are unavoidable


    if you want to bring home the special kid who lived in the house on the hill.


    **Final Thoughts**


    All in all, my experience with Scala was mixed. The static typing threw me.


    At the same time, the Java developer in me greatly appreciates the improved


    concurrency models, inferred typing, and XML. Scala represents a significant


    jump in the state of the art.


    I would use Scala to improve my productivity if I had a significant investment


    in Java programs or programmers. I’d also consider Scala for an application


    that has significant scalability requirements that would require concurrency.


    Commercially, this Frankenstein has a good shot because it represents a


    bridge and fully embraces a significant programming community.


