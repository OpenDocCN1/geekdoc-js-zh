    `**Prelude>**` `**[1..4]**`


    `[1,2,3,4]`


    You specify the endpoints, and Haskell computes the range. The default


    increment is 1\. What if Haskell can’t reach the endpoint with the default


    increment?


    `**Prelude>**` `**[10..4]**`


