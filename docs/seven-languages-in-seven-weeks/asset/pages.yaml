    Haskell


    Haskell represents purity and freedom for many functional programming


    purists. It’s rich and powerful, but the power comes at a price. You can’t


    eat just a couple of bites. Haskell will force you to eat the whole functional


    programming burrito. Think Spock from *Star Trek*. The quote above


    1 is


    typical, embracing logic and truth. His character has a single-minded purity


    that has endeared him to generations. Where Scala, Erlang, and Clojure let


    you use imperative concepts in small doses, Haskell leaves no such wiggle


    room. This pure functional language will challenge you when it’s time to do


    I/O or accumulate state.


    **8.1**


    **Introducing Haskell**


    As always, to understand why a language embraces a certain set of compro-


    mises, you should start with the history. In the early and mid-1980s, pure


    functional programming splintered across several languages. The key


    concepts driving new research were lazy processing, as we encountered in


    Clojure, and pure functional programming. A group from the Functional


    Programming Languages and Computer Architecture conference in 1987


    formed and decided to build an open standard for a pure functional language.


    Out of that group, Haskell was born in 1990 and revised again in 1998\. The


    current standard, called Haskell 98, has been revised several times, including


    a revision of Haskell 98 and the definition of a new version of Haskell called


    Haskell Prime. So, Haskell was built from the ground up to be a pure func-


    tional language, combining ideas from the best functional languages, with


    special emphasis on lazy processing.


