  md: 'message-passing paradigm and primitives make it easy to code applications


    with a level of separation that you rarely find in object-oriented applications.


    **OTP, the Enterprise Libraries**


    Since Erlang grew up in a telecom company with high requirements for


    availability and reliability, it has twenty years worth of libraries that support


    this style of development. The primary library is Open Telecom Platform


    (OTP). You can find libraries that help you build monitored, keep-alive


    processes; link to databases; or build distributed applications. OTP has a


    full web server and many tools for binding to telecom applications.


    The nice thing about the set of libraries is that fault tolerance, scalability,


    transactional integrity, and hot-swapping are all built in. You don’t have to


    worry about them. You can build your own server processes that take


    advantage of these features.


    **Let It Crash**


    When you’re dealing with parallel processes and no side effects, “Let it crash”


    works—you’re not as worried about why individual processes crash because


    you can restart them. The functional programming model amplifies the


    benefits of Erlang’s distribution strategy.


    Like all the other languages in this book, Erlang is tainted. Only the nature


    of the problems changes. These are the places that Agent Smith may not


    always play so nice.


    **Core Weaknesses**


    Erlang’s fundamental problems with adoption come from roots firmly


    planted in a niche language. The syntax is alien to the vast majority of pro-


    grammers. Also, the functional programming paradigm is different enough


    that it will cause problems with widespread adoption. Finally, by far the


    best implementation is on the BEAM and not the Java virtual machine. Let’s


    dig in a little deeper.


    **Syntax**


    Like a movie, syntax is subjective. Beyond this problem, though, Erlang has


    some problems that even the impartial will notice. Let’s look at two of them.


    Interestingly, some of Erlang’s core strengths come from the Prolog founda-


    tions, as well as its weaknesses. To most of the programming population,


    Prolog is obscure, and the syntax comes off as awkward and alien. A little


    syntactic sugar to ease the transition could go a long way.


