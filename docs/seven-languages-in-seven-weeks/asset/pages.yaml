  md: '**Data as Code**


    Programs are lists. As with any Lisp, you can represent data as code.


    Working with Ruby has helped me see the value of writing programs in


    programs. I think this is the most important capability of any programming


    language. Functional programs allow metaprogramming through higher-


    order functions. Lisp extends this idea through evaluating data as code.


    **Core Weaknesses**


    Clojure is a language that’s firmly targeted as a general-purpose program-


    ming language. Whether it can actually be broadly successful on the JVM


    is yet to be determined. Clojure has wonderful abstractions but many of


    them. To truly embrace and use those features effectively and safely, a


    programmer will need to be highly educated and extremely talented. Here


    are some of my concerns.


    **Prefix Notation**


    Representing code in list form is one of the most powerful features in any


    Lisp, but there is a cost—prefix notation.


    8 Typical object-oriented languages


    have a wildly different syntax. The adjustment to prefix notation is not easy.


    It requires a better memory and requires a developer to comprehend code


    from the inside out, rather than outside in. Sometimes, I find that reading


    Clojure pushes me toward understanding too much detail too soon. At best,


    Lisp syntax pushes my short-term memory. With experience, I’m told this


    improves. I’ve not yet turned that corner.


    **Readability**


    Another cost to data as code is the oppressive number of parentheses.


    Optimizing for people and computers is not at all the same thing. The location


    and number of parentheses is still a problem. Lisp developers lean heavily


    on their editors to provide the feedback for matching parentheses, but tools


    can never fully mask readability problems. Kudos to Rich for improving this


    problem, but it will still be a problem.


    **Learning Curve**


    Clojure is rich, and the learning curve is oppressive. You need to have an


