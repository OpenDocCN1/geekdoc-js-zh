  md: '**Futures**


    I will finish up the concurrency discussion with the concept of futures. A


    future is a result object that is immediately returned from an asynchronous


    message call. Since the message may take a while to process, the future


    becomes the result once the result is available. If you ask for the value of a


    future before the result is available, the process blocks until the value is


    available. Say we have a method that takes a long time to execute:


    `futureResult := URL with("http://google.com/") @fetch`


    I can execute the method and do something else immediately until the result


    is available:


    `writeln("Do something immediately while fetch goes on in background...")`


    `// …`


    Then, I can use the future value:


    `writeln("This will block until the result is available.")`


    `// this line will execute immediately`


    `writeln("fetched ", futureResult size, " bytes")`


    `// this will block until the computation is complete`


    `// and Io prints the value`


    `==> 1955`


    The futureResult code fragment will return a future object, immediately. In Io,


    a future is not a proxy implementation! The future will block until the result


    object is available. The value is a Future object until the result arrives, and


    then all instances of the value point to the result object. The console is going


    to print the string value of the last statement returned.


    Futures in Io also provide automatic deadlock detection. It’s a nice touch,


    and they are easy to understand and use.


