    is clear. Reader macros, when abused, can lead to the splintering of the


    language. The cost, too, is clear. You lose one more metaprogramming tool.


    **Accessibility**


    One of the most beautiful aspects of Ruby or an early Java is its accessibil-


    ity as a programming language. Both of those languages were relatively easy


    to pick up. Clojure places tremendous demands on a developer. It has so


    many abstraction tools and concepts that the result can be overwhelming.


    **Final Thoughts**


    Most of Clojure’s strengths and weaknesses are related to the power and


    flexibility. True, you might work hard to learn Clojure. In fact, if you’re a


    Java developer, you’re already working hard. You’re just spending your time


    on Java application-level abstractions. You are looking for looser coupling


    through Spring or aspect-oriented programming, for example. You’re just


    not getting the full benefits of additional flexibility at the language level.
    For


    many, that trade-off has worked. I will humbly suggest that the new demands


    of concurrency and complexity will continue to make the Java platform less


    and less viable.


    If you need an extreme programming model and are willing to pay the price


    of learning the language, Clojure is a great fit. I think this is a great language


    for disciplined, educated teams looking for leverage. You can build better


    software faster with Clojure.


