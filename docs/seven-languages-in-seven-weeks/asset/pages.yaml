    Java and C-based languages use a concurrency philosophy called *preemptive*


    *multitasking*. When you combine this concurrency strategy with objects that


    have changeable state, you wind up with programs that are hard to predict


    and nearly impossible to debug with the current testing strategies that most


    teams use. Coroutines are different. With coroutines, applications can


    voluntarily give up control at reasonable times. A distributed client could


    relinquish control when waiting for the server. Worker processes could pause


    after processing queue items.


    Coroutines are the basic building blocks for higher levels of abstractions


    like actors. Think of actors as universal concurrent primitives that can send


    messages, process messages, and create other actors. The messages an actor


    receives are concurrent. In Io, an actor places an incoming message on a


    queue and processes the contents of the queue with coroutines.


    Next, we’ll look into actors. You won’t believe how easy they are to code.


