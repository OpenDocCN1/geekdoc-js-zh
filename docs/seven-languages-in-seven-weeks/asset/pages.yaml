  md: '**XML**


    Scala has integrated XML support. The pattern matching makes parsing


    blocks of disparate XML structures easy to use. The integration of the XPath


    syntax for diving deep into complex XML leads to simple and readable code.


    This advance is welcome and important, especially to the XML-heavy Java


    community.


    **Bridging**


    The emergence of each new programming paradigm needs a bridge. Scala


    is well-positioned to be that bridge. The functional programming model is


    important because it handles concurrency well, and evolving processor


    designs are much more concurrent. Scala offers an iterative way to take


    developers there.


    **Weaknesses**


    Although I like many of the Scala ideas in concept, I find the syntax demand-


    ing and academic. Although syntax is a matter of taste, Scala does have a


    higher burden than most other languages, at least to these old eyes. I also


    recognize that some of the compromises that make Scala such an effective


    bridge also will undercut its value. I only see three weaknesses, but they


    are big ones.


    **Static Typing**


    Static typing is a natural fit for functional programming languages, but Java-


    style static typing for object-oriented systems is a deal with the devil.


    Sometimes, you must satisfy a compiler’s requirements by putting more of


    a burden on your developers. With static typing, the burden is much more


    than you ever expect. The impact on code, syntax, and program design are


    profound. As I learned Scala, I found myself in a fairly constant battle with


    the language syntax and in program design. Traits eased this burden


    somewhat, but I found the trade-off between programmer flexibility and


    compile-time checking wanting.


    Later in this book, you’ll see what a purely functional strong, static type


    system looks like with Haskell. Without the burden of two programming


    paradigms, the type system becomes much more fluid and productive,


    providing better support for polymorphism and requiring less rigor from


    programmers for similar benefit.


