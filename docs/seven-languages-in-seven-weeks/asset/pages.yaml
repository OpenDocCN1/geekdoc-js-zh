  md: '`user=> @tribbles`


    `2`


    `user=> ; do this five seconds later`


    `user=> @tribbles`


    `4`


    Don’t get hung up in the syntax. (Thread/sleep 5000) simply invokes Java’s sleep


    method on Thread. For now, focus on the value of the agent. We defined a


    slower version of twice that took five seconds. That was enough time to see


    the differences in @tribbles over time in the repl.


    So, you will get *a* value of tribbles. You might not get the latest changes from


    your own thread. If you want to be sure to get the latest value *with respect*


    *to your own thread*, you can call (await tribbles) or (await-for timeout tribbles),
    where


    timeout is a timeout in milliseconds. Keep in mind that await and await-for block


    only until actions from your thread are dispatched. This says nothing about


    what other threads may have asked the thread to do. If you think you want


    the latest value of something, you have already failed. Clojure’s tools involve


    working with a snapshot whose value is instantaneous and potentially out-


    of-date immediately. That’s exactly how versioning databases work for fast


    concurrency control.


    **Futures**


    In Java, you would start threads directly to solve a specific task. Certainly,


    you can use Java integration to start a thread in this way, but there’s often


    a better way. Say you wanted to create a thread to handle a complex com-


    putation around a bit of encapsulated state. You could use an agent. Or


    say you wanted to start the computation of a value, but you did not want


    to await the result. As with Io, you could use a future. Let’s take a look.


    First, let’s create a future. The future returns a reference immediately:


    `user=> (def finer-things (future (Thread/sleep 5000) "take time"))`


    `#''user/finer-things`


    `user=> @finer-things`


    `"take time"`


    Depending on how fast you type, you *may* have had to wait for the result.


    A future takes a body of one or more expressions, returning the value of the


    last expression. The future starts in another thread. If you dereference it,


    the future will block until the value becomes available.


    So, a future is a concurrency construct that allows an asynchronous return


    before computation is complete. We can use futures to allow several long-


    running functions to run in parallel.


