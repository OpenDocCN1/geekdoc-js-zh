    **Any and Nothing**


    Before we move on to anonymous functions, let’s talk a little bit more about


    the class hierarchy in Scala. When you’re using Scala with Java, you will


    often be more concerned about the Java class hierarchy. Still, you should


    know a little bit about the Scala types. Any is the root class in the Scala class


    hierarchy. It’s often confusing, but know that any Scala type will inherit


    from Any.


    Similarly, Nothing is a subtype of every type. That way, a function, say for a


    collection, can return Nothing and conform to the return value for the given


    function. It is all laid out in Figure 6, *Any and Nothing*, on page 158. Every-


    thing inherits from Any, and Nothing inherits from everything.


    There are a few different nuances when you’re dealing with nil concepts.


    Null is a Trait, and null is an instance of it that works like Java’s null, meaning


    an empty value. An empty collection is Nil. By contrast, Nothing is a trait that


    is a subtype of everything. Nothing has no instance, so you can’t dereference


    it like Null. For example, a method that throws an Exception has the return


    type Nothing, meaning no value at all.


