    **What We Learned in Day 1**


    Haskell is a functional programming language. Its first distinguishing


    characteristic is that it is a pure functional language. A function with the


    same arguments will always produce the same result. There are no side


    effects. We spent most of day 1 covering features you have seen in other


    languages in this book.


    We first covered basic expressions and simple data types. Since there are


    no mutable variable assignments, we used recursion to define some simple


    math functions and to deal with lists. We worked with basic Haskell expres-


    sions and rolled those up into functions. We saw pattern matching and


    guards as we found in Erlang and Scala. We used lists and tuples as the


    basic collections as you found in Erlang.


    Finally, we took a look at building lists that took us into list comprehensions,


    ranges, and even lazy sequences. Let’s put some of those ideas into practice.


    **Day 1 Self-Study**


    By this time, writing functional programs should be getting easier if you’ve


    been working through all of the other functional languages. In this section,


    I’m going to push you a little harder.


