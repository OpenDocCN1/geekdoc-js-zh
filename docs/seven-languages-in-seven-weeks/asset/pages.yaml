    `==> list("one", 2, : three)`


    `**Io>**` `**postOffice messageName**`


    `==> messageName`


    So, Io has a number of methods available to let you do message reflection.


    The next question is, “When does Io compute a message?”


    Most languages pass arguments as values on stacks. For example, Java


    computes each value of a parameter first and then places those values on


    the stack. Io doesn’t. It passes the message itself and the context. Then, the


    receivers evaluate the message. You can actually implement control struc-


    tures with messages. Recall the Io if. The form is if(booleanExpression, trueBlock,


    falseBlock). Let’s say you wanted to implement an unless. Here’s how you’d do
    it:


    **Download io/unless.io**


    `unless :=` `**method**``(`


    `(call sender doMessage(call message argAt(0))) ifFalse(`


    `call sender doMessage(call message argAt(1))) ifTrue(`


    `call sender doMessage(call message argAt(2)))`


    `)`


    `unless(1 == 2, write(``*"One is not two\n"*``), write(``*"one is two\n"*``))`


    This little example is beautiful, so read it carefully. Think of doMessage as


    somewhat like Ruby’s eval but at a lower level. Where Ruby’s eval evaluates


    a string as code, doMessage executes an arbitrary message. Io is interpreting


    the message parameters but delaying binding and execution. In a typical


    object-oriented language, the interpreter or compiler would compute all the


    arguments, including both code blocks, and place their return values on


    the stack. In Io, that’s not what happens at all.


    Say the object westley sends the message princessButtercup unless(trueLove, ("It
    is


    false" println), ("It is true" println)). The result is this flow:


    1.


    The object westley sends the previous message.


    2.


    Io takes the interpreted message and the context (the call sender, target,


    and message) and puts it on the stack.


    3.


    Now, princessButtercup evaluates the message. There is no unless slot, so Io


    walks up the prototype chain until it finds unless.


    4.


    Io begins executing the unless message. First, Io executes call sender


    doMessage(call message argAt(0)). That code simplifies to westley trueLove. If


    you’ve ever seen the movie *The Princess Bride*, you know that westley has


    a slot called trueLove, and the value is true.


