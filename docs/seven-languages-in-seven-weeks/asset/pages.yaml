  md: 'What you see here is an extremely powerful concept. You don’t have to


    describe the solution to a problem. You have only to describe the problem.


    And the language for the description of the problem is logic, only pure logic.


    Start from facts and inferences, and let Prolog do the rest. Prolog programs


    are at a higher level of abstraction. Schedules and behavior patterns are


    great examples of problems right in Prolog’s wheelhouse.


    **What We Learned in Day 1**


    Today, we learned the basic building blocks of the Prolog language. Rather


    than encoding steps to guide Prolog to a solution, we encoded knowledge


    using pure logic. Prolog did the hard work of weaving that knowledge together


    to find solutions. We put our logic into knowledge bases and issued queries


    against them.


    After we built a few knowledge bases, we then compiled and queried them.


    The queries had two forms. First, the query could specify a fact, and Prolog


    would tell us whether the facts were true or false. Second, we built a query


    with one or more variables. Prolog then computed all possibilities that made


    those facts true.


    We learned that Prolog worked through rules by going through the clauses


    for a rule in order. For any clause, Prolog tried to satisfy each of the goals


    by going through the possible combinations of variables. All Prolog programs


    work this way.


    In the sections to come, we’re going to make more complex inferences. We’re


    also going to learn to use math and more complex data structures such as


    lists, as well as strategies to iterate over lists.


    **Day 1 Self-Study**


    Find:


    • Some free Prolog tutorials


    • A support forum (there are several)


    • One online reference for the Prolog version you’re using


    Do:


    • Make a simple knowledge base. Represent some of your favorite books


    and authors.


    • Find all books in your knowledge base written by one author.


