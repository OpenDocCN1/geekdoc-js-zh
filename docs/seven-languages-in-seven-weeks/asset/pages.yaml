  md: '**Via method_missing**


    Ruby calls a special debugging method each time a method is missing in


    order to print some diagnostic information. This behavior makes the language


    easier to debug. But sometimes, you can take advantage of this language


    feature to build some unexpectedly rich behavior. All you need to do is


    override method_missing. Consider an API to represent Roman numerals. You


    could do it easily enough with a method call, with an API something like


    Roman.number_for "ii". In truth, that’s not too bad. There are no mandatory


    parentheses or semicolons to get in the way. With Ruby, we can do better:


    **Download ruby/roman.rb**


    `**class**` `Roman`


    `**def**` `self.method_missing name, *args`


    `roman = name.to_s`


    `roman.gsub!(``*"IV"*``,` `*"IIII"*``)`


    `roman.gsub!(``*"IX"*``,` `*"VIIII"*``)`


    `roman.gsub!(``*"XL"*``,` `*"XXXX"*``)`


    `roman.gsub!(``*"XC"*``,` `*"LXXXX"*``)`


    `(roman.count(``*"I"*``) +`


    `roman.count(``*"V"*``) * 5 +`


    `roman.count(``*"X"*``) * 10 +`


    `roman.count(``*"L"*``) * 50 +`


    `roman.count(``*"C"*``) * 100)`


    `**end**`


    `**end**`


    `puts Roman.X`


    `puts Roman.XC`


    `puts Roman.XII`


    `puts Roman.X`


    This code is a beautiful example of method_missing in action. The code is clear


    and simple. We first override method_missing. We’ll get the name of the method


    and its parameters as input parameters. We’re interested only in the name.


    First, we convert that to String. Then, we replace the special cases, like iv
    and


    ix, with strings that are easier to count. Then, we just count Roman digits


    and multiply by the value of that number. The API is so much easier: Roman.i


    versus Roman.number_for "i".


    Consider the cost, though. We do have a class that will be much more diffi-


    cult to debug, because Ruby can no longer tell you when a method is


    missing! We would definitely want strong error checking to make sure it


    was accepting valid Roman numerals. If you don’t know what you’re looking


    for, you could have a tough time finding that implementation of that ii method


    on Roman. Still, it’s another scalpel for the tool bag. Use it wisely.


