    You see the exit implementation, forward, Protos, and the stuff we defined.


    The prototype programming paradigm seems clear enough. These are the


    basic ground rules:


    • Every *thing* is an object.


    • Every *interaction* with an object is a message.


    • You don’t instantiate classes; you clone other objects called *prototypes*.


    • Objects remember their prototypes.


    • Objects have slots.


    • Slots contain objects, including method objects.


    • A message returns the value in a slot or invokes the method in a slot.


    • If an object can’t respond to a message, it sends that message to its


    prototype.


    And that’s most of it. Since you can see or change any slot or any object,


    you can do some pretty sophisticated metaprogramming. But first, you need


    to see the next layer of building blocks: collections.


    **Lists and Maps**


    Io has a few types of collections. A list is an ordered collection of objects
    of


    any type. List is the prototype for all lists, and Map is the prototype for key-


    value pairs, like the Ruby hash. Create a list like this:


