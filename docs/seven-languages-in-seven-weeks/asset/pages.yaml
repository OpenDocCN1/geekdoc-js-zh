  md: '**Scheduling**


    Prolog excels in working with constrained resources. Many have used Prolog


    to build operating system schedulers and other advanced schedulers.


    **Weaknesses**


    Prolog is a language that has held up over time. Still, the language is dated


    in many ways, and it does have significant limitations.


    **Utility**


    While Prolog excels in its core domain, it’s a fairly focused niche, logic pro-


    gramming. It is not a general-purpose language. It also has some limitations


    related to language design.


    **Very Large Data Sets**


    Prolog uses a depth-first search of a decision tree, using all possible combi-


    nations matched against the set of rules. Various languages and compilers


    do a pretty good job of optimizing this process. Still, the strategy is inherently


    computationally expensive, especially as data sets get very large. It also


    forces Prolog users to understand how the language works to keep the size


    of data sets manageable.


    **Mixing the Imperative and Declarative Models**


    Like many languages in the functional family, particularly those that rely


    heavily on recursion, you must understand how Prolog will resolve recursive


    rules. You must often have tail-recursive rules to complete even moderately


    large problems. It’s relatively easy to build Prolog applications that cannot


    scale beyond a trivial set of data. You must often have a deep understanding


    of how Prolog works to effectively design rules that will scale at acceptable


    levels.


    **Final Thoughts**


    As I worked through the languages in this book, I often kicked myself,


    knowing that over the years, I’ve driven many screws with a sledgehammer.


    Prolog was a particularly poignant example of my evolving understanding.


    If you find a problem that’s especially well suited for Prolog, take advantage.


    In such a setting, you can best use this rules-based language in combination


    with other general-purpose languages, just as you would use SQL within


    Ruby or Java. If you’re careful with the way you tie them together, you’re


    likely to come out ahead in the long run.


