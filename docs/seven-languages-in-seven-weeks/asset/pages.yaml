  md: '**9.4**


    **Finding Your Voice**


    We’ve talked about movies and characters throughout this book. The joy of


    movie making means combining your experiences with the actors, sets, and


    locations that tell the story you want to tell. Everything you do goes into


    pleasing your audience. The more you know, the better your movies can be.


    We need to think about programming in the same way. We, too, have an


    audience. I’m not talking about the users of our applications, though. I’m


    talking about the people who read our code. To be a great programmer, you


    need to write to your audience and find the voice that pleases them. You’ll


    have more room to find that voice and let it evolve if you learn what other


    languages have to offer. Your voice is your unique way of expressing yourself


    in code. It will never be any better than the sum of your experience. I hope


    this book has helped you find your voice. Most of all, I hope you had fun.


