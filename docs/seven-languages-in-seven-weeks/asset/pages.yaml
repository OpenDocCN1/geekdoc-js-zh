  md: '**Anonymous Functions**


    As you might expect, anonymous functions in Haskell have a ridiculously


    simple syntax. The form is (\param1 .. paramn -> function_body). Try it, like
    this:


    `**Prelude>**` `**(\x -> x) "Logical."**`


    `"Logical."`


    `**Prelude>**` `**(\x -> x ++ " captain.") "Logical,"**`


    `"Logical, captain."`


    Taken alone, they don’t add much. Combined with other functions, they


    become extremely powerful.


    **map and where**


    First, we built an anonymous function that just returns the first parameter.


    Next, we append a string. As you’ve seen in other languages, anonymous


    functions are an important feature for list libraries. Haskell has a map:


    `map (\x -> x * x) [1, 2, 3]`


    We’re applying the map function to an anonymous function and a list. map


    applies the anonymous function to each item in the list and collects the


    results. There’s no surprise here, but that form might be a bit much to digest


    all at once. We can package it all up as a function and break out the


    anonymous function as a locally scoped function, like this:


    **Download haskell/map.hs**


    `**module Main where**`


    `squareAll list = map square list`


    `**where**` `square x = x * x`


    We’ve declared a function called squareAll that takes a parameter called list.


    Next, we use map to apply a function called square to all the items in list. Then,


    we use a new feature, called where, to declare a local version of square. You


    don’t have to bind functions with where; you can also bind any variable. We’ll


    see some examples of where throughout the rest of the chapter. Here’s the


    result:


    `*Main> :load map.hs`


    `[1 of 1] Compiling Main`


    `( map.hs, interpreted )`


    `Ok, modules loaded: Main.`


    `*Main> squareAll [1, 2, 3]`


    `[1,4,9]`


    You can also use map with part of a function, called a *section*, like this:


    `**Prelude>**` `**map (+ 1) [1, 2, 3]**`


    `[2,3,4]`


