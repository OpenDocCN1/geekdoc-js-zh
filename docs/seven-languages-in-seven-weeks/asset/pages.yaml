    `[1,2,"three"]`


    `**15>**` `**List = [1, 2, 3].**`


    `[1,2,3]`


    So, the list syntax is familiar. Lists are heterogeneous and can be any length.


    You can assign them to variables, just as you would a primitive. Tuples are


