    **Day 1: Appearing Human**


    Agent Smith is as a program that kills other programs, or simulated people,


    that disrupt the simulated reality known as the Matrix. The most basic trait


    that makes him dangerous is his ability to appear human. In this section,


    we’re going to look at Erlang’s ability to build general-purpose applications.


    I’m going to try my best to give you “normal.” It’s not going to be easy.


    If you started this book as a pure object-oriented programmer, you may


    struggle a little bit, but don’t fight it. You’ve already seen code blocks in


    Ruby, actors in Io, pattern matching in Prolog, and distributed message


    passing in Scala. These are foundational principles in Erlang. This chapter


    will start with another important concept. Erlang is the first of our functional


    languages. (Scala is a hybrid functional/object-oriented language.) To you,


    that means the following:


    • Your programs are going to be built entirely out of functions, with no


    objects anywhere.


    • Those functions will usually return the same values, given the same


    inputs.


    • Those functions will not usually have side effects, meaning they will not


    modify program state.


    • You will only be able to assign any variable once.


    Living by the first rule is mildly challenging. Living by the next three can


    knock you down, at least for a little while. Know that you can learn to code


    this way, and the result will be programs that are built from the inside out


    for concurrency. When you remove mutable state from the equation, concur-


    rency gets dramatically simpler.


    If you paid close attention, you caught the word *usually* in the second and


    third rules. Erlang is not a pure functional language; it does allow a few


    exceptions. Haskell is the only pure functional language in this book. But


    you will get a strong flavor of functional-style programming, and you will


    code to these rules more often than not.


