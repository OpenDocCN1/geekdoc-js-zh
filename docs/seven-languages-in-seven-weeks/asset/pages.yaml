  md: '**What We Learned in Day 2**


    Day 1 was encumbered with working through the object-oriented features


    that you already know. Day 2 introduced Scala’s primary reason for being:


    functional programming.


    We started with a basic function. Scala has flexible syntax with function


    definitions. The compiler can often infer the return type, the function body


    has one-line and code-block forms, and the parameter list can vary.


    Next, we looked at various collections. Scala supports three: lists, maps,


    and sets. A set is a collection of objects. A list is an ordered collection.


    Finally, maps are key-value pairs. As with Ruby, you saw the powerful


    combinations of code blocks and collections of various kinds. We looked at


    some collection APIs that are indicative of functional programming


    paradigms.


    For lists, we could also use Lisp-style first and rest methods, just like Prolog,


    to return the first element of the list or the rest. We also used count, isEmpty,


    and first methods for obvious purposes. But the most powerful methods took


    function blocks.


    We iterated with foreach and used filter to selectively return various elements


    of the lists. We also learned to use foldLeft to accumulate results as we iterated


    through a collection to do things such as keeping a running total.


    Much of functional programming is learning to manipulate collections with


    higher-level constructs instead of Java-style iteration. We will put these


    skills through their paces in day 3, when we will learn to use concurrency,


    do some XML, and work a simple practical example. Stay tuned.


    **Day 2 Self-Study**


    Now that we’ve gotten deeper into Scala, you’re starting to see some of its


    functional aspects. Whenever you deal with functions, the collections are a


    great place to start. These exercises will let you use some of the collections,


    as well as some functions.


    Find:


    • A discussion on how to use Scala files


    • What makes a closure different from a code block


    Do:


    • Use foldLeft to compute the total size of a list of strings.


