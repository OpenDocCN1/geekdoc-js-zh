    **Day 3: The Red Pill**


    Most of you have heard it before. In the matrix, take the blue pill, and you


    can continue to live in blissful ignorance. Take the red pill, and your eyes


    are open to reality. Sometimes, reality hurts.


    We have a whole industry slamming blue pills like a preacher’s kid in Ams-


    terdam. Concurrency is hard, so we punt. We add mutable state, so our


    programs collide when we run them concurrently. Our functions and


    methods have side effects, so we can’t prove correctness or predict their


    outcomes. We use threads with shared state rather than shared-nothing


    processes for performance, so we have to do extra work to protect each piece


    of code.


    The result is chaos. Concurrency hurts, not because it is inherently difficult


    but because we’ve been using the wrong programming model!


    Earlier in the chapter, I said Erlang made some easy things hard. Without


    side effects and mutable state, you’ll have to change the way you approach


    coding altogether. You’ll have to put up with a Prolog-based syntax that


    seems alien to many. But now, you’ll get the payoff. That red pill, concurren-


    cy and reliability, will seem like candy to you. Let’s find out how.


