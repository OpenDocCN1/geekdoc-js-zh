    **Wrapping Up Ruby**


    We have covered a lot of ground in this chapter. I hope you can see the


    comparison to Mary Poppins. After speaking at dozens of Ruby conferences,


    I have heard scores of people profess their love for Ruby because it is fun.


    To an industry that grew up embracing the C family of languages including


    C++, C#, Java, and others, Ruby is a breath of fresh air.


    **Core Strengths**


    Ruby’s pure object orientation allows you to treat objects in a uniform and


    consistent way. The duck typing allows truer polymorphic designs based


    on what an object can support rather than that object’s inheritance hierar-


    chy. And Ruby’s modules and open classes let a programmer attach behavior


    to syntax that goes beyond the typical method or instance variable definitions


    in a class.


    Ruby is ideal as a scripting language, or as a web development language if


    the scaling requirements are reasonable. The language is intensely produc-


    tive. Some of the features that enable that productivity make Ruby hard to


    compile and make the performance suffer.


    **Scripting**


