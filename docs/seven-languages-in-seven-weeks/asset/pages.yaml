  md: '**Changing Paradigms**


    If you do decide that you want to do more functional programming, there


    are several different ways to get there. You can make a clean break from


    OOP, or you can pick an approach that is slightly more evolutionary.


    As we waded through each of the seven languages, you saw languages


    spanning four decades and at least as many programming paradigms. I hope


    you can appreciate the evolution of programming languages as well. You


    saw three distinctly different approaches to evolving paradigms. With Scala,


    the approach is coexistence. The Scala programmer can construct an object-


    oriented program using strong functional tendencies. The very nature of the


    language is that both programming paradigms are first-class. Clojure takes


    the approach of compatibility. The language is built on the JVM, allowing


    Clojure applications to use Java objects directly, but the Clojure philosophy


    is that certain elements of OOP are fundamentally flawed. Unlike Scala,


    Clojure-Java Interop is provided to leverage frameworks existing on the Java


    virtual machine, not to broaden the programming language. Haskell and


    Erlang are basically stand-alone languages. Philosophically, they do not


    embrace object-oriented programming in any form. So, you can embrace


    both paradigms, make a clean break, or embrace object-oriented libraries


    but decide to leave the OOP paradigm behind. Take your pick.


    Whether or not you choose to adopt one of the languages in this book, you’ll


    be better for knowing what’s out there. As a Java developer, I had to wait a


    decade for closures, mainly because people like me were uneducated and


    did not scream loud enough for them. In the meantime, mainstream


    frameworks like Spring were stuck with anonymous inner classes to solve


