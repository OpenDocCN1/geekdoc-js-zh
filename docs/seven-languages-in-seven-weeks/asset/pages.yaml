  md: '**Weaknesses**


    No language is perfect for all applications. Ruby has its share of limitations


    too. Let’s walk through some of the major ones.


    **Performance**


    Ruby’s primary weakness is performance. Sure, Ruby is getting faster.


    Version 1.9 is up to ten times faster for some use cases. A new Ruby virtual


    machine written by Evan Phoenix called Rubinius has the potential to


    compile Ruby using a just-in-time compiler. This approach looks at an


    interpreter’s usage patterns for a block of code to anticipate which code is


    likely to be needed again. This approach works well for Ruby, a language


    where syntax clues are usually not enough to allow compilation. Remember,


    the definition of a class can change at any time.


    Still, Matz is very clear. He works to optimize the programmer’s experience,


    not the performance of the language. Many of the language’s features such


    as open classes, duck typing, and method_missing defeat the very tools that


    enable compilation and the associated performance gains.


    **Concurrency and OOP**


    Object-oriented programming has a critical limitation. The whole premise


    of the model depends on wrapping behavior around state, and usually the


    state can be changed. This programming strategy leads to serious problems


    with concurrency. At best, significant resource contentions are built into


    the language. At worst, object-oriented systems are next to impossible to


    debug and cannot be reliably tested for concurrent environments. As of this


    writing, the Rails team is only now starting to address the problem of man-


    aging concurrency effectively.


    **Type Safety**


    I’m a firm believer in duck typing. With this typing strategy, you can gener-


    ally have cleaner abstractions with concise, readable code. But duck typing


    comes at a price, too. Static typing allows a whole range of tools that make


    it easier to do syntax trees and thus provide integrated development envi-


    ronments. IDEs for Ruby are more difficult to build, and so far, most Ruby


    developers do not use them. Many times, I’ve lamented the loss of an IDE-


    style debugger. I know I’m not alone.


    **Final Thoughts**


    So, Ruby’s core strengths are its syntax and flexibility. The core weaknesses


    are around performance, though the performance is reasonable for many


