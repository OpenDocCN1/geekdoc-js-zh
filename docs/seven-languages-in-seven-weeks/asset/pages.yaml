  md: 'typing end of the spectrum, but you’ll encounter a broad mix of static


    and dynamic. You will find how the trade-offs impact a developer. The


    typing model will shape the way you attack a problem and control the


    way the language works. Every language in this book has its own typing


    idiosyncrasies.


    • *What is the programming model?* Is it object-oriented (OO), functional,


    procedural, or some type of hybrid? This book has languages spanning


    four different programming models and, sometimes, combinations of


    more than one. You will find a logic-based programming language


    (Prolog), two languages with full support for object-oriented concepts


    (Ruby, Scala), four languages that are functional in nature (Scala, Erlang,


    Clojure, Haskell), and one prototype language (Io). Several of the lan-


    guages are multiparadigm languages, like Scala. Clojure’s multimethods


    will even let you implement your own paradigm. Learning new program-


    ming paradigms is one of the most important concepts in this book.


    • *How will you interact with it?* Languages are compiled or interpreted,


    and some have virtual machines while others don’t. In this book, I’ll


    begin to explore with an interactive shell, if there is one. I will move on


    to files when it’s time to attack bigger projects. We won’t attack large


    enough projects to fully dive into packaging models.


    • *What are the decision constructs and core data structures?* You’d be


    surprised how many languages can make decisions with things other


    than variations of ifs and whiles. You’ll see pattern matching in Erlang


    and unification in Prolog. Collections play a vital role in just about any


    language. In languages such as Smalltalk and Lisp, the collections are


    defining characteristics of the language. In others, like C++ and Java,


    collections are all over the place, defining the user’s experience by their


    absence and lack of cohesion. Either way, you’ll need a sound under-


    standing of the collections.


    • *What are the core features that make the language unique?* Some of the


    languages will support advanced features for concurrent programming.


    Others provide unique high-level constructs such as Clojure’s macros


    or Io’s message interpretation. Others will give you a supercharged vir-


    tual machine, like Erlang’s BEAM. Because of it, Erlang will let you build


    fault-tolerant distributed systems much more quickly than you can in


    other languages. Some languages support programming models that


    are laser-focused on a particular problem, such as using logic to solve


    constraints.


