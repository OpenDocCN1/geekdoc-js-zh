    **What We Learned in Day 3**


    Today, you put together some of the ideas we’ve used in Prolog to solve some


    classic puzzles. The constraint-based problems have many of the same


    characteristics as classic industrial applications. List constraints, and


    crunch out a solution. We would never think of doing a SQL nine-table join


    imperatively, yet we don’t even blink at solving logical problems in this way.


    We started with a Sudoku puzzle. Prolog’s solution was remarkably simple.


    We mapped sixteen variables onto rows, columns, and squares. Then, we


    described the rules of the game, forcing each row, column, and square to


    be unique. Prolog then methodically worked through the possibilities,


    quickly arriving at a solution. We used wildcards and variables to build an


    intuitive API, but we didn’t provide any help at all for solution techniques.


    Next, we used Prolog to solve the Eight Queens puzzle. Once again, we


    encoded the rules of the game and let Prolog work into a solution. This classic


    problem was computationally intensive, having 92 possible solutions, but


    even our simple approach could solve it within a handful of minutes.


