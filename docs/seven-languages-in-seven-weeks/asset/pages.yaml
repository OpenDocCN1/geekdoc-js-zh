  md: '**What We****’****ve Missed**


    Clojure is a Lisp, which is an extremely rich language in its own right. It’s


    based on the JVM, which has more than a decade of development. The


    language also mixes in some new and powerful concepts. It would be impos-


    sible to cover Clojure in one chapter of a book. There are some pieces that


    you should know about.


    **Metadata**


    Sometimes, it’s nice to associate metadata to a type. Clojure allows you to


    attach and access metadata on both symbols and collections. (with-meta value


    metadata) gives you a new value associated with the metadata, usually imple-


    mented as a map.


    **Java Integration**


    Clojure has excellent Java integration. We touched on Java integration very


    loosely, and we also built a type on the JVM. We did not use the existing


    Java libraries at all. We also did not extensively cover the Java compatibility


    forms. For example, (.toUpperCase "Fred") calls the .toUpperCase member function


    on the string "Fred".


    **Multimethods**


    Object-oriented languages allow one style of organization for behavior and


    data. Clojure allows you to build your own code organization with multimeth-


    ods. You can associate a library of functions with a type. You can also


    implement polymorphism by using multimethods to do method dispatch


    based on type, metadata, arguments, and even attributes. The concept is


    powerful and extremely flexible. You could implement, for example, Java-


    style inheritance, prototype inheritance, or something entirely different.


    **Thread State**


    Clojure offers atoms, refs, and agents for various concurrency models.


    Sometimes, you need to store data per thread instance. Clojure allows you


    to do so quite simply with vars. For example, (binding [name "value"] ...) would


    bind name to "value" *only for the current thread*.


