  md: '**Actors**


    Actors have a huge theoretical advantage over threads. An actor changes


    its own state and accesses other actors only through closely controlled


    queues. Threads can change each other’s state without restriction. Threads


    are subject to a concurrency problem called *race conditions*, where two


    threads access resources at the same time, leading to unpredictable results.


    Here’s the beauty of Io. Sending an asynchronous message to any object


    makes it an actor. End of story. Let’s take a simple example. First, we’ll


    create two objects called faster and slower:


    `**Io>**` `**slower := Object clone**`


    `==>`


    `Object_0x1004ebb18:`


    `**Io>**` `**faster := Object clone**`


    `==>`


    `Object_0x100340b10:`


    Now, we’ll add a method called start to each:


    `**Io>**` `**slower start := method(wait(2); writeln("slowly"))**`


    `==> method(`


    `wait(2); writeln("slowly")`


    `)`


    `**Io>**` `**faster start := method(wait(1); writeln("quickly"))**`


    `==> method(`


    `wait(1); writeln("quickly")`


    `)`


    We can call both methods sequentially on one line of code with simple


    messages, like this:


    `**Io>**` `**slower start; faster start**`


    `slowly`


    `quickly`


    `==> nil`


    They start in order, because the first message must finish before the second


    can begin. But we can easily make each object run in its own thread by


    preceding each message with @@, which will return immediately and return


    nil:


    `**Io>**` `**slower @@start; faster @@start; wait(3)**`


    `quickly`


    `slowly`


    We add an extra wait to the end so that all threads finish before the program


    terminates, but that’s a great result. We are running in two threads. We


    made both of these objects actors, *just by sending an asynchronous message*


    *to them!*


