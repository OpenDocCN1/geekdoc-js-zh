  md: 'Notice that the old compass is unchanged. Since we’re defining a JVM type,


    you can access all fields as Java fields. But you can also access the fields


    in the type as Clojure map keywords:


    `user=> (:bearing c)`


    `0`


    Because these types work like maps, you can easily prototype new types as


    maps and iteratively convert them to types as your design stabilizes. You


    can also replace types as maps in your tests as stubs or mocks. There are


    other benefits as well:


    • Types play nice with other Clojure concurrency constructs. In day 3,


    we’ll learn how to create mutable references of Clojure objects in ways


    that maintain transactional integrity, much like relational databases do.


    • We implemented a protocol, but you’re not limited to the new way of doing


    things. Since we’re building JVM types, the types can interoperate with


    Java classes and interfaces.


    With defrecord and protocol, Clojure offers the ability to build native code for


    the JVM, without Java. This code can fully interact with other types on the


    JVM, including Java classes or interfaces. You can use them to subclass


    Java types or implement interfaces. Java classes can also build on your


    Clojure types. Of course, this is not the entire Java interop story, but it’s


    an important part. Now that you’ve learned to extend Java, let’s learn how


    to extend the Clojure language itself with macros.


    **Macros**


    For this section, we’re going to refer to the Io chapter. We implemented the


    Ruby unless in *Messages*, on page 78. The form is (unless test form1). The function


    will execute form1 if the test is false. We can’t simply design a function, because


    each parameter will execute:


    `user=> ; Broken unless`


    `user=> (defn unless [test body] (if (not test) body))`


    `#''user/unless`


    `user=> (unless true (println "Danger, danger Will Robinson"))`


    `Danger, danger Will Robinson`


    `nil`


    We discussed this problem in Io. Most languages execute parameters first


    and then put the results on the call stack. In this case, we don’t want to


    evaluate the block unless the condition is false. In Io, the language


    circumvented this problem by delaying the execution of the unless message.


