    **Wrapping Up Io**


    Io is an excellent language for learning how to use prototype-based lan-


    guages. Like Lisp, the syntax is stunningly simple, but the semantics of the


    language lend plenty of power. The prototype languages encapsulate data


    and behavior like object-oriented programming languages. Inheritance is


    simpler. There are no classes or modules in Io. One object inherits behavior


    directly from its prototype.


    **Strengths**


    Prototype languages are generally quite malleable. You can change any slot


    on any object. Io takes this flexibility to the max, allowing you to quickly


    create the syntax you want. Like Ruby, some of the trade-offs that make Io


    so dynamic tend to cap the performance, at least in a single thread. The


    strong, modern concurrency libraries often make Io a good language for


    parallel processing. Let’s look at where Io is excelling today.


    **Footprint**


    Io’s footprint is small. Most of the production Io applications are embedded


    systems. This application makes sense, since the language is small, powerful,


