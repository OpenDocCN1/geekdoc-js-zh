    **Infinite Sequences and take**


    Let’s start with the most basic of infinite sequences, an infinite sequence of


    one repeated element. We can specify (repeat 1). If you try it in the repl, you’ll


    get 1s until you kill the process. Clearly, we need some way to grab only a


    finite subset. That function is take:


    `user=> (take 3 (repeat "Use the Force, Luke"))`


    `("Use the Force, Luke" "Use the Force, Luke" "Use the Force, Luke")`


    So, we created an infinite sequence of the repeated string "Use the Force, Luke",


    and then we took the first three. You can also repeat the elements in a list


    with cycle:


    `user=> (take 5 (cycle [:lather :rinse :repeat]))`


