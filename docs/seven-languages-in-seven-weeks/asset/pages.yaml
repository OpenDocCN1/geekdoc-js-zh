    `| ?- count(What, [1]).`


    `What = 1 ? ;`


    `no`


    The rules are trivially simple. The count of an empty list is 0. The count of


    a list is the count of the tail plus one. Let’s talk about how this works, step


    by step:


    • We issue the query count(What, [1]), which can’t unify with the first rule,


    because the list is not empty. We move on to satisfying the goals for the


    second rule, count(Count, [Head|Tail]). We unify, binding What to Count, Head


    to 1, and Tail to [].


    • After unification, the first goal is count(TailCount, []). We try to prove that


    subgoal. This time, we unify with the first rule. That binds TailCount to 0.


    The first rule is now satisfied, so we can move on to the second goal.


    • Now, we evaluate Count is TailCount + 1. We can unify variables. TailCount is


    bound to 0, so we bind Count to 0 + 1, or 1.


    And that’s it. We did not define a recursive process. We defined logical rules.


    The next example is adding up the elements of a list. Here’s the code for


    those rules again:


    `sum(0, []).`


    `sum(Total, [Head|Tail])` `**:-**` `sum(Sum, Tail), Total is Head + Sum.`


    This code works precisely like the count rule. It also has two clauses, a base


    case and the recursive case. The usage is similar:


