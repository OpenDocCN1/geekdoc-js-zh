  md: 'Books on comparative programming languages were popular when I grew


    up as a programmer, but most of these were academic tomes that gave little


    practical guidance to how to actually go about using a language. This reflect-


    ed the technology of the age. You could read about the ideas in a language,


    but actually trying it out was virtually impossible.


    Today, not only can we read about the ideas, but we can try them in practice.


    This makes the difference between standing on the poolside wondering


    whether it would be nice to swim and diving in and enjoying the water.


    I warmly recommend this book and hope that you enjoy reading it as much


    as I have.


    Joe Armstrong, creator of Erlang


    Stockholm, 2 March 2010


