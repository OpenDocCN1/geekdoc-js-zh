  md: '`user=> (+ 3.0 5)`


    `8.0`


    `user=> (+ 3 5.0)`


    `8.0`


    Clojure works to coerce types for us. In general, you’ll find that Clojure


    supports strong, dynamic typing. Let’s get a little more focused and look at


    some of Clojure’s basic building blocks, called *forms*.


    Think of a form as a piece of syntax. When Clojure parses code, it first breaks


    the program down into pieces called *forms*. Then, Clojure can compile the


    code. I’m not going to distinguish between code and data, because in Lisp,


    they are one and the same. Booleans, characters, strings, sets, maps, and


    vectors are all examples of forms that you’ll see throughout this chapter.


    **Strings and Chars**


    You’ve already been introduced to strings, but we can take it a little deeper.


    You’ll enclose strings in double quotes, and use C-style escaping characters,


    as in Ruby:


    `user=> (println "master yoda\nluke skywalker\ndarth vader")`


    `master yoda`


