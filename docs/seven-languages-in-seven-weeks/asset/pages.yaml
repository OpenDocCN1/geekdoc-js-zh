    Let’s say we want to assign the name to Name, and the profession to Profession.


    This match would do the trick:


    `**25>**` `**{person, {name, Name}, {profession, Profession}} = Person.**`


    `{person,{name,"Agent Smith"},`


    `{profession,"Killing programs"}}`


    `**26>**` `**Name.**`


    `"Agent Smith"`


    `**27>**` `**Profession.**`


    `"Killing programs"`


    Erlang will match up the data structures, assigning variables to the values


    in the tuples. An atom will match itself, so the only work to be done is to


    match the variable Name to "Agent Smith" and the variable Profession to "Killing


    programs". This feature works much like it does in Prolog and will be the


    fundamental decision-making construct that you use.


    If you are used to Ruby or Java-style hashes, it may seem strange to have


    the initial atom of person. In Erlang, you’ll often have multiple matching


    statements and multiple kinds of tuples. By designing your data structures


    this way, you can quickly match all person tuples, leaving the others behind.


    List pattern matching is similar to Prolog’s:


    `**28>**` `**[Head | Tail] = [1, 2, 3].**`


    `[1,2,3]`


    `**29>**` `**Head.**`


    `1`


    `**30>**` `**Tail.**`


    `[2,3]`


    Easy as one, two, three. You can bind to more than one variable at the head


    of a list, too:


    `**32>**` `**[One, Two|Rest] = [1, 2, 3].**`


