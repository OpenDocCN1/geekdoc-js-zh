  md: 'The concurrency model is only part of the story. When objects share state,


    you must strive for immutable values. Io and Scala get this at least partially


    right, allowing mutable state but also offering libraries and keywords that


    support immutability. Immutability is the single most important thing you


    can do to improve code design for concurrency.


    Finally, the message-passing syntax you see in Scala is much like you will


    see in the next chapter on Erlang. It is a significant improvement over the


    standard Java threading libraries.


    **Evolution of Legacy Java**


    Scala starts with a strong, built-in user base: the Java community. Scala


    applications can use Java libraries directly, and through the use of code


    generation of proxy objects when necessary, the interoperability is excellent.


    Inferred typing is a much-needed advance over the archaic Java typing


    system. The best way to establish a new programming community is to fully


    embrace an existing one. Scala does a good job offering a more concise Java,


    and that idea has value.


    Scala also offers new features to the Java community. Code blocks are a


    first-class language construct, and they work well with the core collection


    libraries. Scala also offers first-class mixins in the form of traits. Pattern


    matching is also a significant improvement. With these and other features,


    Java developers can have an advanced programming language without even


    touching the more advanced functional paradigms.


    Throw in the functional constructs, and you can have significantly improved


    applications. Scala applications will usually have a fraction of the total lines


    of code than an equivalent Java app would have, and that’s extremely


    important. A better programming language should allow you to express


    more complex ideas with fewer lines of code, with minimal overhead. Scala


    delivers on this promise.


    **Domain-Specific Languages**


    Scala’s flexible syntax and operator overloading make it an ideal language


    for developing Ruby-style domain-specific languages. Remember, as in Ruby,


    operators are simply method declarations, and you can override them in


    most cases. Additionally, optional spaces, periods, and semicolons let the


    syntax take many different forms. Together with robust mixins, these are


    the tools that a DSL developer seeks.


