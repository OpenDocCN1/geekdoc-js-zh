  md: 'Haskell has strong, static typing, like Scala. The type model is mostly inferred


    and is widely considered to be one of the most effective type systems of any


    functional language. You’ll see that the type system allows for polymorphism


    and very clean designs.


    Haskell also supports other concepts you’ve seen in this book. Haskell allows


    Erlang-style pattern matching and guards. You’ll also find Clojure-style lazy


    evaluation and list comprehensions from both Clojure and Erlang.


    As a pure functional language, Haskell does not do side effects. Instead, a


    function can return a side effect, which is later executed. You’ll see an


    example of this in day 3, as well as an example of preserving state using a


    concept called *monads*.


    The first couple of days will get you through typical functional programming


    concepts, such as expressions, defining functions, higher-order functions,


    and the like. We’ll also get into Haskell’s typing model, which will give you


    some new concepts. Day 3 will stretch you. We’ll look at the parameterized


    type system and monads, which are sometimes difficult concepts to grasp.


