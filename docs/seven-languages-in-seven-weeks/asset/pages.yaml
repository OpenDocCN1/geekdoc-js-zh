    **Lazy Evaluation**


    In mathematics, infinite sequences of numbers are often easier to describe.


    In functional languages, you’d often like to have the same benefits, but you


    can’t actually compute an infinite sequence. The answer is lazy evaluation.


    Using this strategy, Clojure’s sequence library computes values only when


    they are actually consumed. In fact, most sequences are lazy. Let’s walk


    through creating some finite sequences and move into lazy sequences.


    **Finite Sequences with range**


    Unlike Ruby, Clojure supports ranges as functions. A range creates a


    sequence:


    `user=> (range 1 10)`


    `(1 2 3 4 5 6 7 8 9)`


