    Clojure


    Clojure is Lisp on the JVM. Perplexing and powerful, Lisp is one of the first


    programming languages and one of the latest too. Dozens of dialects tried


    to launch Lisp into the mainstream and failed. The syntax and programming


    model so far have been too much for a typical developer to absorb. Yet,


    there’s something special about Lisp that’s worth revisiting, so the new


    dialects continue to emerge. Some of the best programming universities lead


    with the Lisp language to form young minds while they are still open.


    In many ways, Clojure is the wise kung fu master, the oracle on the hill, or


    the enigmatic Jedi trainer. Think Yoda. In *Star Wars Episode V: The Empire*


    *Strikes Back*,


