  md: '**Download erlang/translate_service.erl**


    `-module(translate_service).`


    `-export([loop/0, translate/2]).`


    `loop() ->`


    `receive`


    `{From,` `*"casa"*``} ->`


    `From !` `*"house"*``,`


    `loop();`


    `{From,` `*"blanca"*``} ->`


    `From !` `*"white"*``,`


    `loop();`


    `{From, _} ->`


    `From !` `*"I don''t understand."*``,`


    `loop()`


    `end.`


    `translate(To, Word) ->`


    `To ! {self(), Word},`


    `receive`


    `Translation -> Translation`


    `end.`


    The loop function matched a process ID (From) followed by a word (casa or


    blanca) or a wildcard. The pattern match allows the programmer to quickly


    pick out the important pieces of the message without requiring any parsing


    from the programmer.


    **Unification**


    Prolog uses unification, a close cousin of pattern matching. You learned


    that Prolog would substitute possible values into a rule to force the left and


    right sides to match. Prolog would keep trying values until possibilities were


    exhausted. We looked at a simple Prolog program called concatenate as an


    example of unification:


    **Download prolog/concat.pl**


    `concatenate([], List, List).`


    `concatenate([Head|Tail1], List, [Head|Tail2])` `**:-**`


    `concatenate(Tail1, List, Tail2).`


    We learned that unification makes this program so powerful because it could


    work in three ways: testing truth, matching the left side, or matching the


    right side.


