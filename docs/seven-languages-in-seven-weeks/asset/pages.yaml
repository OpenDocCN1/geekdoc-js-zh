    `[{pencil,4,0.25,0.08},{pen,1,1.2,0.096},{paper,2,0.2,0.032}]`


    Several different language creators mention list comprehensions as one of


    their favorite features. I agree with this sentiment.


    **Monads**


    Perhaps the biggest intellectual growth for me was in the area of monads.


    With pure functional languages, we could not build programs with mutable


    state. Instead, we built monads that let us compose functions in a way that


    helped us structure problems as if they allowed mutable state. Haskell has


    do notation, supported by monads, to solve this problem.


    We also found that monads allow us to simplify complex computation. Each


    of our monads supported a computational strategy. We used the Maybe


    monad to handle failure conditions, such as a List search that could poten-


    tially return Nothing. We used the List monad to compute a Cartesian product


    and unlock a combination.


    **Matching**


    One of the more common programming features we saw was pattern


    matching. We first encountered this programming construct in Prolog, but


    we also saw it in Scala, Erlang, Clojure, and Haskell. Each of these languages


    leaned on pattern matching to significantly simplify code. The problem


    domains included parsing, distributed message passing, destructuring,


    unification, XML processing, and more.


    For a typical Erlang pattern match, recall the translate service:


    1.


    Scala also supports list comprehensions, but we did not use them.


