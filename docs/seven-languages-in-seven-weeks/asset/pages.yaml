  md: '**Anonymous Functions**


    In Lisp, functions are just data. Higher-order functions are built into the


    language from the ground up because code is just like any other kind of


    data. Anonymous functions let you create unnamed functions. It’s a funda-


    mental capability for every language in this book. In Clojure, you’ll define


    a higher-order function with the fn function. Typically, you’ll omit the name,


    so the form looks like (fn [parameters*] body). Let’s take an example.


    Let’s use an argument to a higher-order function to build a list of word


    counts, given a list of words. Let’s say we have a list of people’s names:


    `user=> (def people ["Lea", "Han Solo"])`


    `#''user/people`


    We can compute the length of one word like this:


    `user=> (count "Lea")`


    `3`


    We can build a list of the lengths of the names, like this:


    `user=> (map count people)`


    `(3 8)`


    You’ve seen these concepts before. map in this context is a higher-order


    function. In Clojure, that concept is easy because a function is a list, just


    like any other list element. You can use the same building blocks to compute


    a list having twice the lengths of person names, like this:


    `user=> (defn twice-count [w] (* 2 (count w)))`


    `#''user/twice-count`


    `user=> (twice-count "Lando")`


    `10`


    `user=> (map twice-count people)`


    `(6 16)`


    Since that function is so simple, we can write it as an anonymous function,


    like this:


    `user=> (map (fn [w] (* 2 (count w))) people)`


    `(6 16)`


    We can also use a shorter form:


    `user=> (map #(* 2 (count %)) people)`


    `(6 16)`


    With the short form, # defines an anonymous function, with % bound to


    each item of the sequence. # is called a *reader macro*.


