    **What We Learned in Day 3**


    In day 3, you started to get a pretty good feel for what you can do with


    Erlang. We started with the concurrency primitives: send, receive, and


    spawn. We built the natural asynchronous version of a translator to illustrate


    how basic message-passing works. Then, we built a simple helper function


    that encapsulated a send and a receive together to simulate a remote proce-


    dure call with a send and receive.


    Next, we linked processes together to show how one process notifies another


    when it dies. We also learned to monitor one process with another for better


    reliability. Our system was not fault tolerant, though the ideas that we used


    could be used to build fault-tolerant systems. Erlang distributed communi-


    cation works exactly like interprocess communication. We could link two


    processes, on separate computers, so that a standby monitored the master


    and took over in the event of a problem.


    Let’s put some of what you’ve learned to work.


    **Day 3 Self-Study**


    These exercises are relatively easy, but I did add some bonus questions to


    stretch you a little bit.


    Open Telecom Platform (OTP) is a powerful package with much of what you’ll


    need to build a distributed, concurrent service.


    Find:


    • An OTP service that will restart a process if it dies


    • Documentation for building a simple OTP server


    Do:


    • Monitor the translate_service and restart it should it die.


    • Make the Doctor process restart itself if it should die.


    • Make a monitor for the Doctor monitor. If either monitor dies, restart it.


    The following bonus questions will take a little bit of research to complete:


    • Create a basic OTP server that logs messages to a file.


    • Make the translate_service work across a network.


