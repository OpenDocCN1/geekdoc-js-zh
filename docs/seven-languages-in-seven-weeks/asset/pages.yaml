  md: 'object. You may have picked up this book to explore functional programming


    languages. Some of those languages such as Scala mix programming models


    by throwing in object-oriented concepts. There are dozens of other program-


    ming models as well. Stack-based languages such as PostScript or Forth


    use one or more stacks as a central feature of the language. Logic-based


    languages such as Prolog build around rules. Prototype languages like Io,


    Lua, and Self use the object, not the class, as the basis for object definition


    and even inheritance.


    Ruby is a pure object-oriented language. In this chapter, you’ll see just how


    far Ruby takes this concept. Let’s look at some basic objects:


    `**>>**` `**4**`


    `=> 4`


    `**>>**` `**4.class**`


    `=> Fixnum`


    `**>>**` `**4 + 4**`


    `=> 8`


    `**>>**` `**4.methods**`


    `=> ["inspect", "%", "<<", "singleton_method_added", "numerator", ...`


    `"*", "+", "to_i", "methods", ...`


    `]`


    I’ve omitted some of the methods from this list, but you get the picture. Just


    about everything in Ruby is an object, down to each individual number. A


    number is an object that has a class called Fixnum, and the method called


    methods returns an array of methods (Ruby represents arrays in square


    brackets). In fact, you can call any method on an object with the dot operator.


    **Decisions**


    Programs exist to make decisions, so it stands to reason that the way a


    language makes decisions is a central concept that shapes the way you


    code, and think, in a given language. Ruby is like most object-oriented and


    procedural languages in many ways. Check out these expressions:


    `**>>**` `**x = 4**`


