  md: '**All Lisp**


    After Fortran, Lisp is the oldest commercially active language. It’s a function-


    al language but not a pure functional language. The acronym stands for


    LISt Processing, and early on, you’ll see why. Lisp has some interesting


    characteristics:


    • Lisp is a language of lists. A function call uses the first list element as


    the function and the rest as the arguments.


    • Lisp uses its own data structures to express code. Lisp followers call


    this strategy *data as code*.


    When you combine these two ideas, you get a language that’s ideal for


    metaprogramming. You can arrange your code as named methods in a class.


    You could arrange those objects into a tree, and you have a basic object


    model. You could also build a prototype-based code organization with slots


    for data and behavior. You can build a pure-functional implementation. It’s


    this flexibility that allows Lisp to morph the language into just about any


    programming paradigm you want.


    In *Hackers and Painters* [Gra04], Paul Graham chronicles the story of how


    a small development team used Lisp and its powerful programming model


    to defeat much larger companies. They believed Lisp provided a significant


    programming advantage. In fact, they paid more attention to start-ups


    posting jobs requiring Lisp and other higher-level languages.


    The primary Lisp dialects are Common Lisp and Scheme. Scheme and Clojure


    are from the same family of dialects called lisp-1, and Common Lisp is a


    lisp-2 dialect. The primary difference between the dialect families has to do


    with the way namespaces work. Common Lisp uses a separate namespace


    for functions and variables, while Scheme uses the same namespace for


    both. With the Lisp side of the equation behind us, let’s move on to the Java


    side.


    **On the JVM**


    Every Lisp dialect caters to its audience. For Clojure, one of the most


    important characteristics is the JVM. With Scala, you saw that having a


    commercially successful deployment platform can make all the difference


    in the world. You don’t have to sell a Clojure server to your deployment


    people to use it. Though the language is relatively new, you can access the


    tens of thousands of Java libraries to do just about anything you need.


