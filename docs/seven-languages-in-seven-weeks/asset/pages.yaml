  md: '**2.1**


    **Quick History**


    Yukihiro Matsumoto created Ruby in about 1993\. Most people just call him


    Matz. As a language, Ruby is an interpreted, object-oriented, dynamically


    typed language from a family of so-called scripting languages. Interpreted


    means that Ruby code is executed by an interpreter rather than a compiler.


    Dynamically typed means that types are bound at execution time rather


    than compile time. In general, the trade-off for such a strategy is flexibility


    versus execution safety, but we’ll get into that a little more later. Object-


    oriented means the language supports encapsulation (data and behavior


    are packaged together), inheritance through classes (object types are orga-


    nized in a class tree), and polymorphism (objects can take many forms).


    Ruby patiently waited for the right moment and then burst onto the scene


    around 2006 with the emergence of the Rails framework. After wandering


    for ten years in the enterprise jungles, programming was fun again. Ruby


    is not hugely efficient in terms of execution speed, but it makes programmers


    very productive.


    **Interview with Yukihiro (Matz) Matsumoto**


    I had the pleasure to travel to Matsumotosan’s hometown of Matsue, Japan.


    We had the chance to have some conversations about the foundations of


    Ruby, and he agreed to answer some questions for this book.


    *Bruce:*


    *Why did you write Ruby?*


    *Matz:*


    *Right after I started playing with computers, I got interested in program-*


    *ming languages. They are the means of programming but also enhancers for your*


    *mind that shape the way you think about programming. So for a long time, for
    a*


    *hobby, I studied a lot of programming languages. I even implemented several toy*


    *languages but no real ones.*


    *In 1993, when I saw Perl, I was somehow inspired that an object-oriented language*


    *that combines characteristics from Lisp, Smalltalk, and Perl would be a great*


    *language to enhance our productivity. So, I started developing such a language*


    *and named it Ruby. The primary motivation was to amuse myself. It was mere*


    *hobby at the beginning, trying to create a language that fit my taste. Somehow,*


    *other programmers all over the world have felt sympathy for that language and*


    *the policy behind it. And it became very popular, far beyond my expectation.*


    *Bruce:*


    *What is the thing you like about it the most?*


    *Matz:*


    *I like the way it makes my programming enjoyable. As a particular tech-*


    *nical issue, I like blocks most. They are tamed higher-order functions but open
    up*


    *great possibilities in DSL and other features as well.*


    *Bruce:*


    *What is a feature that you would change, if you could go back in time?*


