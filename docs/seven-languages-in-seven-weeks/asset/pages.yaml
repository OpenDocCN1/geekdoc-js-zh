  md: '**References**


    In Clojure, a *ref* (short for reference) is a wrapped piece of data. All access


    must conform to specified rules. In this case, the rules are to support STM.


    You cannot change a reference outside of a transaction. To see how it works,


    let’s create a reference:


    `user=> (ref "Attack of the Clones")`


    `#<Ref@ffdadcd: "Attack of the Clones">`


    That’s not too interesting. We should assign the reference to a value, like


    this:


    `user=> (def movie (ref "Star Wars"))`


    `#''user/movie`


    You can get the reference back, like this:


    `user=> movie`


    `#<Ref@579d75ee: "Star Wars">`


    But we’re really worried about the value in the reference. Use deref:


    `user=> (deref movie)`


    `"Star Wars"`


    Or, you can use the short form of deref:


    `user=> @movie`


    `"Star Wars"`


    That’s better. Now, we can easily access the value within our reference. We


    haven’t tried to change the state of the reference yet. Let’s try. With Clojure,


    we’ll send a function that will mutate the value. The dereferenced ref will


    be passed as the first argument of the function:


    `user=> (alter movie str ": The Empire Strikes Back")`


    `java.lang.IllegalStateException: No transaction running (NO_SOURCE_FILE:0)`


    As you can see, you can mutate state only within a transaction. Do so with


    the dosync function. The preferred way to modify a reference is to alter it with


    some transforming function, like this:


    `user=> (dosync (alter movie str ": The Empire Strikes Back"))`


    `"Star Wars: The Empire Strikes Back"`


    We could also set some initial value with ref-set:


    `user=> (dosync (ref-set movie "Star Wars: The Revenge of the Sith"))`


    `"Star Wars: The Revenge of the Sith"`


    You can see that the reference changed:


