    **Guards**


    Pattern matching has some embellishments too. In Prolog, the pattern


    matching often had associated conditions. To implement a factorial in Scala,


    we specify a condition in a guard for each match statement:


    **Download scala/factorial.scala**


    `**def**` `factorial(n:` `**Int**``):` `**Int**` `= n` `**match**` `{`


    `**case**` `0 => 1`


    `**case**` `x` `**if**` `x > 0 => factorial(n - 1) * n`


    `}`


    `println(factorial(3))`


    `println(factorial(0))`


    The first pattern match is a 0, but the second guard has the form case x if x


    > 0. It matches any x for x > 0. You can specify a wide variety of conditions


    in this way. Pattern matching can also match regular expressions and types.


    You’ll see an example later that defines empty classes and uses them as


    messages in our concurrency examples later.


    **Regular Expressions**


    Scala has first-class regular expressions. The .r method on a string can


    translate any string to a regular expression. Here is an example of a regular


    expression that can match uppercase or lowercase F at the beginning of a


    string:


    `**scala>**` `**val reg = """^(F|f)\w*""".r**`


    `reg: scala.util.matching.Regex = ^(F|f)\w*`


    `**scala>**` `**println(reg.findFirstIn("Fantastic"))**`


    `Some(Fantastic)`


    `**scala>**` `**println(reg.findFirstIn("not Fantastic"))**`


    `None`


    We start with a simple string. We use the """ delimited form of a string,


    allowing multiline string and eliminating evaluation. The .r method converts


    the string to a regular expression. We then use the method findFirstIn to find


    the first occurrence.


    `**scala>**` `**val reg = "the".r**`


    `reg: scala.util.matching.Regex = the`


    `**scala>**` `**reg.findAllIn("the way the scissors trim the hair and the shrubs")**`


