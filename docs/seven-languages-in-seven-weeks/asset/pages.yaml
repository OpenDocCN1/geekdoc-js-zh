    **Simplicity**


    Io’s syntax is remarkably compact. You can learn Io very quickly. Once you


    understand the core syntax, everything else is learning the library structures.


    I found that I could work my way into metaprogramming quite quickly,


    within my first month of using the language. In Ruby, getting to the same


    point took a little longer. In Java, it took many months to get to the point


    where I could make any sense of metaprogramming at all.


    **Flexibility**


    Io’s duck typing and freedom allow you to change any slot in any object at


    any time. This free-wheeling nature means you can change the basic rules


    of the language to suit your application. It’s quite easy to add proxies at any


    place through changing the forward slot. You can also override key language


    constructs by changing their slots directly. You can even create your own


    syntax quickly.


    **Concurrency**


    Unlike Java and Ruby, the concurrency constructs are up-to-date and fresh.


    Actors, futures, and coroutines make it much easier to build multithreaded


    applications that are easier to test and have better performance. Io also


    gives considerable thought to mutable data and how to avoid it. Having


    these features baked into the core libraries made it easy to learn a robust


    concurrency model. Later, in other languages, we will build on these con-


    cepts. You’ll see actors in Scala, Erlang, and Haskell.


    **Weaknesses**


    There’s much to like about Io and some suboptimal aspects as well. Freedom


    and flexibility come at a price. Also, since Io has the smallest community


    of any of the languages in this book, it’s a riskier choice for some projects.


    Let’s take a look at the problems associated with Io.


    **Syntax**


    Io has very little syntax sugar. Simple syntax is a double-edged sword. On


    one side, the clean syntax makes Io, the language, easy to understand. But


    there’s a cost. Simple syntax often makes it hard to communicate difficult


    concepts concisely. Said another way, you may find it easy to understand


    how a given program uses the Io language and, at the same time, have a


    difficult time understanding what your program is doing.


