    So far, we’ve been through the type system and how it works in a couple of


    areas. We’ve built user-defined type constructors and got templates that


    would allow us to define data types and declare functions that would work


    with them. Haskell has one more important concept related to types, and


    it’s a big one. The concept is called the *class*, but be careful. It’s not an


    object-oriented class, because there’s no data involved. In Haskell, classes


    let us carefully control polymorphism and overloading.


    For example, you can’t add two booleans together, but you can add two


    numbers together. Haskell allows classes for this purpose. Specifically, *a*


