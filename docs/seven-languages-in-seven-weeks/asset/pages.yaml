  md: '**Built for Concurrency**


    Erlang is a product of years of research from Ericsson to develop near-real-


    time fault-tolerant distributed applications for telecom applications. The


    systems often could not be taken down for maintenance, and software


    development was prohibitively expensive. Ericsson studied programming


    languages through the 1980s and found that, for one reason or another,


    existing languages were inadequate for their needs. These requirements


    eventually led to the development of an entirely new language.


    Erlang is a functional language—one with many reliability features cooked


    in. Erlang can support insanely reliable systems. You can’t take a phone


    switch down for maintenance, and you don’t have to take Erlang down to


    replace entire modules. Some of its applications have run for years without


    ever coming down for maintenance. But the key Erlang capability is


    concurrency.


    Concurrency experts do not always agree on the best approaches. One


    common debate is whether threads or processes lead to better concurrency.


    Many threads make up a process. Processes have their own resources;


    threads have their own execution path but share resources with other


    threads in the same process. Usually, a thread is lighter weight than a


    process, though implementations vary.


    **No Threading**


    Many languages, like Java and C, take a threading approach to concurrency.


    Threads take fewer resources, so theoretically, you should be able to get


    better performance from them. The downside to threads is that shared


    resources can lead to complex, buggy implementations and the need for


    locks that form bottlenecks. To coordinate control between two applications


    sharing resources, threading systems require semaphores, or operating


    system level locks. Erlang takes a different approach. It tries to make pro-


    cesses as lightweight as possible.


    **Lightweight Processes**


    Rather than wade through the quagmire of shared resources and resource


    bottlenecks, Erlang embraces the philosophy of lightweight processes.


    Erlang’s creators spent effort to simplify the creation, management, and


    communication within applications with many processes. Distributed mes-


    sage passing is a basic language-level construct, eliminating the need for


    locking and improving concurrency.


