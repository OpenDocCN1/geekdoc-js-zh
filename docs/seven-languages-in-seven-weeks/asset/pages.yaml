  md: '**Strengths**


    Prolog is applicable for a wide variety of problems, from airline scheduling


    to financial derivatives. Prolog has a serious learning curve, but the demand-


    ing problems that Prolog solves tend to make the language, or others like


    it, worthwhile.


    Think back to Brian Tarbox’s work with the dolphins. He was able to make


    simple inferences about the world and make a breakthrough with a complex


    inference about dolphin behavior. He was also able to take highly constrained


    resources and use Prolog to find schedules that fit among them. These are


    some areas where Prolog is in active use today:


    **Natural-Language Processing**


    Prolog was perhaps first used to work with language recognition. In partic-


    ular, Prolog language models can take natural language, apply a knowledge


    base of facts and inferences, and express that complex, inexact language


    in concrete rules appropriate for computers.


    **Games**


    Games are getting more complex, especially modeling the behavior of com-


    petitors or enemies. Prolog models can easily express the behavior of other


    characters in the system. Prolog can also build different behaviors into dif-


    ferent types of enemies, making a more lifelike and enjoyable experience.


    **Semantic Web**


    The semantic Web is an attempt to attach meaning to the services and


    information on the Web, making it easier to satisfy requests. The resource


    description language (RDF) provides a basic description of resources. A


    server can compile these resources into a knowledge base. That knowledge,


    together with Prolog’s natural-language processing, can provide a rich end


    user experience. Many Prolog packages exist for providing this sort of


    functionality in the context of a web server.


    **Artificial Intelligence**


    Artificial intelligence (AI) centers around building intelligence into machines.


    This intelligence can take different forms, but in every case, some “agent”


    modifies behavior based on complex rules. Prolog excels in this arena, espe-


    cially when the rules are concrete, based on formal logic. For this reason,


    Prolog is sometimes called a *logic programming language*.


