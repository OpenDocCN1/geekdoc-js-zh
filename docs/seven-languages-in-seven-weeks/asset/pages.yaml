  md: 'You’ve also learned that stacks can grow, so recursive algorithms will con-


    tinue to consume memory until all memory is exhausted. Functional


    languages work around this limitation with tail recursion optimization.


    Clojure does not support implicit tail recursion optimization because of


    limitations of the JVM. You must explicitly recur through the use of loop and


    recur. Think of a loop as a let statement.


    `(loop [x x-initial-value, y y-initial-value] (do-something-with x y))`


    Initially, given a vector, loop binds the variables in the even positions to the


    values in the odd positions. In fact, if you don’t specify a recur, loop works


    exactly like a let:


    `user=> (loop [x 1] x)`


    `1`


    The function recur will invoke the loop again but this time pass new values.


    Let’s refactor the size function to use recur:


    `(defn size [v]`


    `(loop [l v, c 0]`


    `(if (empty? l)`


    `c`


    `(recur (rest l) (inc c)))))`


    In the second version of size, we’ll use the tail-recursion-optimized loop and


    recur. Since we won’t actually return a value, we’ll maintain the result in a


    variable called an *accumulator*. In this case, c will maintain a count.


    This version works like a tail-optimized call, but we’re stuck with more


    kludgy lines of code. Sometimes, the JVM is a double-edged sword. If you


    want the community, you need to deal with the problems. But since this


    function is built into some basic collection APIs, you won’t often need to use


    recur. Also, Clojure gives you some excellent alternatives to recursion, includ-


    ing lazy sequences that we’ll get to later in this chapter.


    With day 2’s bad news out of the way, we’re free to shift to more pleasant


