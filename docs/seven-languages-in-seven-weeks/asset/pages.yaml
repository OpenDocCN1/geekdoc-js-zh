    **Using Tuples and Composition**


    Sometimes, you need to combine functions by chaining them together by


    passing the results of one function to another. Here’s an example that


    computes the second item of a list by matching the head of the tail of a list:


    `*Main> let second = head . tail`


    `*Main> second [1, 2]`


    `2`


    `*Main> second [3, 4, 5]`


    `4`


    We’re just defining a function in the console. second = head . tail is equivalent


    to second lst = head (tail lst). We’re feeding the result of one function into
    another.


    Let’s use this feature with yet another Fibonacci sequence. We’ll compute


    a single pair, as before, but without a counter:


    `fibNextPair :: (``**Integer**``,` `**Integer**``) -> (``**Integer**``,` `**Integer**``)`


    `fibNextPair (x, y) = (y, x + y)`


    Given two numbers in the sequence, we can always compute the next one.


    The next job is to recursively compute the next item in the sequence:


    `fibNthPair :: Integer -> (Integer, Integer)`


    `fibNthPair 1 = (1, 1)`


    `fibNthPair n = fibNextPair (fibNthPair (n - 1))`


