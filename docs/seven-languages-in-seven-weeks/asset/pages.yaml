  md: '• *Reduced parentheses.* Clojure improves readability by opening up the


    syntax a little, including brackets for vectors, braces for maps, and a


    combination of characters for sets.


    • *The ecosystem.* Lisp’s many dialects water down the support and library


    set that you can have for any single dialect. Ironically, having one more


    dialect can help solve that problem. By being on the JVM, Clojure can


    take advantage of Java programmers who are looking for more and the


    fabulous set of libraries.


    • *Restraint.* By exercising restraint and limiting Clojure’s syntax to avoid


    reader macros, Hickey effectively limited Clojure’s power but also


    decreased the likelihood that harmful splinter dialects might emerge.


    You might appreciate Lisp as a programming language in its own right. By


    that measure, you can look at Clojure purely as a new Lisp. On that level,


    it succeeds.


    **Concurrency**


    Clojure’s approach to concurrency has the potential to change the way we


    design concurrent systems completely. STM does place some additional


    burden on developers because of its novelty, but for the first time, it protects


    developers by detecting whether state mutations happen within appropriately


    protected functions. If you’re not within a transaction, you can’t mutate


    state.


    **Java Integration**


    Clojure has great integration with Java. It uses some native types such as


    strings and numbers transparently and offers type hints for performance.


    But Clojure shines by allowing tight JVM integration, so Clojure types can


    fully participate in Java applications. You’ll soon see much more of Clojure


    itself implemented within the JVM.


    **Lazy Evaluation**


    Clojure adds powerful lazy evaluation features. Lazy evaluation can simplify


    problems. You have seen only a taste of how lazy sequences can shape the


    way you attack a problem. Lazy sequences can reduce computation overhead


    significantly by delaying execution until it is actually needed or by preventing


    execution altogether. Finally, lazy problem solving offers just one more tool


    to solve difficult problems. You can often use lazy sequences to replace


    recursion, iteration, or realized collections.


