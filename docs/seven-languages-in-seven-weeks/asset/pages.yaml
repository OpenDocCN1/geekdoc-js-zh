    Atoms and refs are simple and safe ways to handle mutable state, syn-


    chronously. In the next few sections, we’ll look at a couple of asynchronous


    examples.


    **Working with Agents**


    Like an atom, an agent is a wrapped piece of data. Like an Io future, the state


    of a dereferenced agent will block until a value is available. Users can mutate


    the data asynchronously using functions, and the updates will occur in


    another thread. Only one function can mutate the state of an agent at a


    time.


    Give it a try. Let’s define a function called twice that doubles the value of


    whatever you pass in:


    `user=> (defn twice [x] (* 2 x))`


    `#''user/twice`


    Next, we’ll define an agent called tribbles that has an initial value of one:


    `user=> (def tribbles (agent 1))`


    `#''user/tribbles`


    Now, we can mutate tribbles by sending the agent a value:


    `user=> (send tribbles twice)`


    `#<Agent@554d7745: 1>`


    This function will run in another thread. Let’s get the value of the agent:


    `user=> @tribbles`


    `2`


    Reading a value from a ref, agent, or atom will never lock and never block.


    Reads should be fast, and with the right abstractions around them, they


    can be. With this function, you can see the difference in the values that you


    read from each agent:


    `user=> (defn slow-twice [x]`


    `(do`


    `(Thread/sleep 5000)`


    `(* 2 x)))`


    `#''user/slow-twice`


    `user=> @tribbles`


    `2`


    `user=> (send tribbles slow-twice)`


    `#<Agent@554d7745: 16>`


