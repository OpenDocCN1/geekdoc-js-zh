  md: 'Beautiful! We’re essentially nesting the same concept. Let’s break it down.


    The bindings are [[_ [_ c _] _]]. We’ll bind one parameter to the inbound argu-


    ment, [_ [_ c _] _]. That parameter says we’re going to ignore the first and third


    elements, which are the top and bottom rows in our tic-tac-toe board. We’ll


    focus on the middle row, which is [_ c _]. We’re expecting another list and


    grabbing the center one:


    `user=> (center board)`


    `:x`


    We can simplify that function in a couple of different ways. First, we don’t


    have to list any of the wildcard arguments that come after the target


    arguments:


    `(``**defn**` `center [[_ [_ c]]] c)`


    Next, destructuring can happen in the argument list or also in a let state-


    ment. In any Lisp, you’ll use let to bind a variable to a value. We could use


    let to hide the destructuring from the clients of the center function:


    `(``**defn**` `center [board]`


    `(``**let**` `[[_ [_ c]] board] c))`


    let takes two arguments. First is a vector with the symbol you want to bind


    ([[_ [_c]]]) followed by the value (board) that you want bound. Next is some


    expression that presumably uses that value (we just returned c). Both forms


    produce equivalent results. It all depends on where you want the destruc-


    turing to happen. I’ll show you a couple of brief examples using let, but


    understand that you could also use them within an argument list.


    You can destructure a map:


    `user=> (def person {:name "Jabba" :profession "Gangster"})`


    `#''user/person`


    `user=> (let [{name :name} person] (str "The person''s name is " name))`


    `"The person''s name is Jabba"`


    You can also combine maps and vectors:


    `user=> (def villains [{:name "Godzilla" :size "big"} {:name "Ebola" :size "small"}])`


    `#''user/villains`


    `user=> (let [[_ {name :name}] villains] (str "Name of the second villain: " name))`


