  md: 'Anyone with an eye for programming language history has seen this fable


    played out before. When the object-oriented paradigm was new, the masses


    could not accept Smalltalk because the paradigm was too new. We needed


    a language that would let them continue to do procedural programming and


    experiment with object-oriented ideas. With C++, the new object-oriented


    tricks could live safely beside the existing C procedural features. The result


    was that people could start using the new tricks in an old context.


    Now, it’s time to put Scala through its paces as a functional language. Some


    of this will seem awkward at first, but the ideas are powerful and important.


    They will form the foundation for the concurrency constructs you’ll see later


    in day 3\. Let’s start from the beginning, with a simple function:


    `**scala>**` `**def double(x:Int):Int = x * 2**`


    `double: (Int)Int`


    `**scala>**` `**double(4)**`


    `res0: Int = 8`


    Defining a function looks a whole lot like it does with Ruby. The def keyword


    defines both a function and a method. The parameters and their types come


    next. After that, you can specify an optional return type. Scala can often


    infer the return type.


    To invoke the function, just use the name and the argument list. Notice that


    unlike Ruby, the parentheses are not optional in this context.


    This is a one-line method definition. You can also specify a method definition


    in block form:


    `**scala>**` `**def double(x:Int):Int = {**`


    `|`


    `x * 2`


    `| }`


    `double: (Int)Int`


    `**scala>**` `**double(6)**`


    `res3: Int = 12`


    That = after the Int return type is mandatory. Forgetting it will cause you


    trouble. These are the major forms of function declarations. You’ll see minor


    variations, such as omitting parameters, but these are the forms you’ll see


    most often.


    Let’s move on to the variables that you’ll use within a function. You’ll want


    to pay careful attention to the life cycle of the variable if you want to learn


    the pure functional programming model.


