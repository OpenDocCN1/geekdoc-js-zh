    as encapsulation to exist within a procedural language. At some point, some


    hybrid language offers just the right practical bridge between the old


    paradigm and the new, such as a C++. Next, we see a commercially adoptable


    language, such as Java or C#. Finally, we see some mature, pure implemen-


    tations of the new paradigm.


    **Affinity with Java...**


    Scala is at least a bridge and maybe more. It offers tight integration into


    Java, offering a chance for people to protect their investment in many ways:


    • Scala runs on the Java virtual machine, so Scala can run side-by-side


    with existing deployments.


    • Scala can use Java libraries directly, so developers can leverage existing


    frameworks and legacy code.


    • Like Java, Scala is statically typed, so the languages share a philosoph-


    ical bond.


    • Scala’s syntax is relatively close to Java’s, so developers can learn the


    basics quickly.


    • Scala supports both object-oriented and functional programming


    paradigms, so programmers can gradually learn to apply functional


    programming ideas to their code.


    **Without Slavish Devotion**


    Some languages that embrace their ancestors go too far, extending the very


    limiting concepts that make the base inadequate. Although the similarities


    to Java are striking, Scala’s design has some significant departures that


    will serve its community well. These important improvements represent


    important departures from the Java language:


    • *Type inference.* In Java, you must declare the type of every variable,


    argument, or parameter. Scala infers variable types where possible.


    • *Functional concepts.* Scala introduces important functional concepts to


    Java. Specifically, the new language allows you to use existing functions


    in many different ways to form new ones. Concepts you’ll see in this


    chapter are code blocks, higher-order functions, and a sophisticated


    collection library. Scala goes far beyond some basic syntactical sugar.


