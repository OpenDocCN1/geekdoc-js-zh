  md: 'Every function in Haskell has one parameter. You might ask yourself, “If


    that’s true, how could you write a function like + that adds two numbers


    together?”


    In fact, it is true. Every function does have one parameter. To simplify the


    type syntax, let’s create a function called prod:


    `**Prelude>**` `**let prod x y = x * y**`


    `**Prelude>**` `**prod 3 4**`


    `12`


    We created a function, and you can see that it works. Let’s get the type of


    the function:


    `**Prelude>**` `**:t prod**`


    `prod :: (Num a) => a -> a -> a`


    The portion Num a => means “In the following type definition, a is a type of


    Num.” You’ve seen the rest before, and I lied to you about the meaning to


    simplify things. Now, it’s time to set the record straight. Haskell uses a


    concept to split one function on multiple arguments into multiple functions,


    each with one argument. Haskell does this job with partial application.


    Don’t let the term confuse you. Partial application binds *some* of the argu-


    ments, but not all. For example, we can partially apply prod to create some


    other functions:


    `**Prelude>**` `**let double = prod 2**`


    `**Prelude>**` `**let triple = prod 3**`


    Look at the left side of these functions first. We defined prod with two param-


    eters, but we applied only the first one. So, computing prod 2 is easy, Just


    take the original function of prod x y = x * y, substitute 2 for x, and you have


    prod y = 2 * y. The functions work just as you’d expect:


    `**Prelude>**` `**double 3**`


    `6`


    `**Prelude>**` `**triple 4**`


    `12`


    So, the mystery is solved. When Haskell computes prod 2 4, it is really com-


    puting (prod 2) 4, like this:


    • First, apply prod 2. That returns the function (\y -> 2 * y).


    • Next, apply (\y -> 2 * y) 4, or 2 * 4, giving you 8.


    That process is called *currying*, and just about every multiple-argument


    function in Haskell gets curried. That leads to greater flexibility and simpler


