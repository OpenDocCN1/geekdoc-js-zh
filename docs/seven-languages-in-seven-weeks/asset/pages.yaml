  md: '**Bindings**


    As in most of the other languages we’ve looked at so far, the process of


    assigning parameters based on the inbound arguments is called *binding*.


    One of the nice things about Clojure is its ability to access any portion of


    any argument as a parameter. For example, say you had a line, represented


    as a vector of points, like this:


    `user=> (def line [[0 0] [10 20]])`


    `#''user/line`


    `user=> line`


    `[[0 0] [10 20]]`


    You could build a function to access the end of the line, like this:


    `user=> (defn line-end [ln] (last`


    `ln))`


    `#''user/line-end`


    `user=> (line-end line)`


    `[10 20]`


    But we don’t really need the whole line. It would be nicer to bind our param-


    eter to the second element of the line. With Clojure, it’s easy:


    `(defn line-end [[_ second]] second)`


    `#''user/line-end`


    `user=> (line-end line)`


    `[10 20]`


    The concept is called *destructuring*. We’re taking a data structure apart and


    grabbing only the pieces that are important to us. Let’s take a closer look


    at the bindings. We have [[_ second]]. The outer brackets define the parameter


    vector. The inner brackets say we’re going to bind to individual elements of


    a list or vector. _ and second are individual parameters, but it’s idiomatic to


    use _ for parameters you want to ignore. In English, we’re saying “The


    parameters for this function are _ for the first element of the first argument,


    and second for the second element of the first argument.”


    We can also nest these bindings. Let’s say we have a tic-tac-toe board, and


    we want to return the value of the middle square. We’ll represent the board


    as three rows of three, like this:


    `user=> (def board [[:x :o :x] [:o :x :o] [:o :x :o]])`


    `#''user/board`


    Now, we want to pick up the second element of the second row of three, like


    this:


    `user=> (defn center [[_ [_ c _] _]] c)`


    `#''user/center`


