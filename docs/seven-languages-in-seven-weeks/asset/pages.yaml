    **Modules, Enumerable, and Sets**


    A couple of the most critical mixins in Ruby are the enumerable and comparable


    mixins. A class wanting to be enumerable must implement each, and a class


    wanting to be comparable must implement <=>. Called the *spaceship* operator,


    a <=> b is a simple comparison that returns -1 if b is greater, 1 if a is greater,


    and 0 otherwise. In exchange for implementing these methods, enumerable


    and comparable provide many convenience methods for collections. Crack


