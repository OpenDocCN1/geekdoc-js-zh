  md: '**My Inner Battle with Static Typing**


    Some novice programming language enthusiasts confuse the ideas of strong typing


    and static typing. Loosely speaking, strong typing means the language detects
    when


    two types are compatible, throwing an error or coercing the types if they are
    not.


    On the surface, Java and Ruby are both strongly typed. (I realize this idea is
    an


    oversimplification.) Assembly language and C compilers, on the other hand, are


    weakly typed. The compiler doesn’t necessarily care whether the data in a memory


    location is an integer, a string, or just data.


    Static and dynamic typing is another issue. Statically typed languages enforce


    polymorphism based on the structure of the types. Is it a duck by the genetic


    blueprint (static), or is it a duck because it quacks or walks like one? Statically


    typed languages benefit because compilers and tools know more about your code


    to trap errors, highlight code, and refactor. The cost is having to do more work
    and


    living with some restrictions. Your history as a developer will often determine
    how


    you feel about the trade-offs of static typing.


    My first OO development was in Java. I saw one framework after another try to


    break free from the chains of Java’s static typing. The industry invested hundreds


    of millions of dollars in three versions of Enterprise Java Beans, Spring, Hibernate,


    JBoss, and aspect-oriented programming to make certain usage models more mal-


    leable. We were making Java’s typing model more dynamic, and the battles at every


    step of the way were intense, feeling more like rival cults than programming envi-


    ronments. My books took the same journey, from increasingly dynamic frameworks


    to dynamic languages.


    So, my bias against static typing was shaped by the Java wars. Haskell and its


    great static type system are helping me recover but slowly. My conscience is clear.


    You’ve invited a closet politician to this casual dinner, but I’ll try my hardest
    to


    keep the conversation light and unbiased.


