  md: 'You can get complicated by using various combinations:


    `| ?- [a, b, c] = [a|Tail].`


    `Tail = [b,c]`


    `(1 ms) yes`


    Prolog matched the a and unified the rest with Tail. Or we can split this tail


    into the head and tail:


    `| ?- [a, b, c] = [a|[Head|Tail]].`


    `Head = b`


    `Tail = [c]`


    `yes`


    Or grab the third element:


    `| ?- [a, b, c, d, e] = [_, _|[Head|_]].`


    `Head = c`


    `yes`


    _ is a wildcard and unifies with anything. It basically means “I don’t care


    what’s in this position.” We told Prolog to skip the first two elements and


    split the rest into head and tail. The Head will grab the third element, and


    the trailing _ will grab the tail, ignoring the rest of the list.


    That should be enough to get you started. Unification is a powerful tool,


    and using it in conjunction with lists and tuples is even more powerful.


    Now, you should have a basic understanding of the core data structures in


    Prolog and how unification works. We’re now ready to combine these ele-


    ments with rules and assertions to do some basic math with logic.


    **Lists and Math**


    In our next example, I thought I’d show you an example of using recursion


    and math to operate on lists. These are examples to do counting, sums, and


    averages. Five rules do all the hard work.


    **Download prolog/list_math.pl**


    `count(0, []).`


    `count(Count, [Head|Tail])` `**:-**` `count(TailCount, Tail), Count is TailCount
    + 1.`


    `sum(0, []).`


    `sum(Total, [Head|Tail])` `**:-**` `sum(Sum, Tail), Total is Head + Sum.`


    `average(Average, List)` `**:-**` `sum(Sum, List), count(Count, List), Average
    is Sum/Count.`


