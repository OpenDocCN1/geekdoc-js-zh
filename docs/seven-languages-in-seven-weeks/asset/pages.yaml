  md: 'Throughout this chapter, you’ll see evidence of the JVM, in the way you


    invoke it, in the libraries we use, and in artifacts we create. But you’ll also


    see liberation, too. Clojure is functional, so you’ll be able to apply advanced


    concepts to your code. Clojure is dynamically typed, so your code will be


    more concise, easier to read, and more fun to write. And Clojure has the


    expressiveness of Lisp.


    Clojure and Java desperately need each other. Lisp needs the market place


    that the Java virtual machine can offer, and the Java community needs a


    serious update and an injection of fun.


    **Updated for a Concurrent World**


    The last piece of the equation for this language is the set of libraries. Clojure


    is a functional language, with emphasis on functions without side effects.


    But when you do use mutable state, the language supports a number of


    concepts to help. Transactional memory works like transactional databases


    to provide safe, concurrent access to memory. Agents allow encapsulated


    access to mutable resources. We’ll cover some of these concepts in day 3.


    Impatient are you? Start with Clojure, we will.


