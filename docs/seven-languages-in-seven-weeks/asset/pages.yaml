    **7.4**


    **Day 3: An Eye for Evil**


    In *Star Wars*, Yoda was the first to detect the evil in Darth Vader. With


    Clojure, Rich Hickey has identified the core problems that plague the devel-


    opment of concurrent object-oriented systems. We’ve said frequently that


    mutable state is the evil that lurks in the hearts of object-oriented programs.


    We’ve shown several different approaches to handling mutable state. Io and


    Scala used the actor-based model and provided immutable constructs that


    gave the programmer the power to solve those problems without mutable


    state. Erlang provided actors with lightweight processes, and a virtual


    machine that allowed effective monitoring and communication, allowing


    unprecedented reliability. The Clojure approach to concurrency is different.


    It uses *software transactional memory* (STM). In this section, we’ll look at


    STM and also several tools to share state across threaded applications.


    **References and Transactional Memory**


    Databases use transactions to ensure data integrity. Modern databases use


    at least two types of concurrency control. Locks prevent two competing


    transactions from accessing the same row at the same time. Versioning


    uses multiple versions to allow each transaction to have a private copy of


    its data. If any transaction interferes with another, the database engine


    simply reruns that transaction.


    Languages like Java use locking to protect the resources of one thread from


    competing threads that might corrupt them. Locking basically puts the


    burden of concurrency control on the programmer. We are rapidly learning


    that this burden is too much to bear.


    Languages like Clojure use *software transactional memory* (STM). This


    strategy uses multiple versions to maintain consistency and integrity. Unlike


    Scala, Ruby, or Io, when you want to change the state of a reference in


    Clojure, you must do so within the scope of a transaction. Let’s see how it


    works.


