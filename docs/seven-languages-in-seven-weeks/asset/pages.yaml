    Coding the Sudoku was almost magical for me. A Sudoku is a grid that has


    rows, columns, and boxes. A typical puzzle is a nine-by-nine grid, with some


    spaces filled in and some blank. Each cell in the grid has a number, from


    1–9 for a nine-by-nine square. Your job is to fill out the solution so that


    each row, column, and square has one each of all of the digits.


    We’re going to start with a four-by-four Sudoku. The concepts are exactly


    the same, though the solutions will be shorter. Let’s start by describing the


    world, as we know it. Abstractly, we’ll have a board with four rows, four


