    **Messages**


    As I was working through this chapter, one of the Io committers was helping


    me through a moment of frustration. He said, “Bruce, there’s something


    you have to understand about Io. Almost everything is a message.” If you


    look at Io code, everything but comment markers and the comma (,) between


    arguments are messages. Everything. Learning Io well means learning to


    manipulate them beyond just basic invocation. One of the most crucial


    capabilities of the language is message reflection. You can query any char-


    acteristic of any message and act appropriately.


    A message has three components: the sender, the target, and the arguments. In


    Io, the sender sends a message to a target. The target executes the message.


