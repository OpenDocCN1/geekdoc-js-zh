  md: '**Type System**


    If you like strong typing (and maybe even if you don’t), you’ll love Haskell’s


    typing system. It is there when you need it but not when you don’t. The type


    system can add a helpful level of protection from common errors, and they


    can be caught at compile time rather than run time. But the extra safety is


    only part of the story.


    Perhaps the most interesting part of a Haskell type is how easy it is to asso-


    ciate new types with new behaviors. You can build up sophisticated types


    from the ground up. With type constructors and classes, you can even


    customize extremely complex types and classes such as Monads effortlessly.


    With classes, your new custom types can take advantage of existing Haskell


    libraries.


    **Expressiveness**


    The Haskell language has fantastic power. From an abstract sense, it has


    everything you need to express powerful ideas concisely. Those ideas encom-


    pass behavior through a rich functional library and a powerful syntax. The


    ideas extend to data types where you can create types, even recursive types


    that bind the right functions to the right data without excessive syntax. In


    an academic setting, you can find no stronger language for teaching func-


    tional programming than Haskell. Everything you will need is in there.


    **Purity of Programming Model**


    Pure programming models can radically change the way you approach


    problems. They force you to leave old programming paradigms behind and


    embrace different ways of doing things. Pure functional languages give you


    something you can depend on. Given the same inputs, a function will always


    return the same values. This property makes it much easier to reason about


    programs. You can sometimes prove that a program is correct, or not. You


    can also be free of many of the problems that come from depending on side


    effects, such as accidental complexity and unstable or slow behavior in


    concurrent situations.


    **Lazy Semantics**


    Once upon a time, dealing with functional languages meant dealing with


    recursion. Lazy computing strategies offer a whole new set of strategies to


    deal with data. You can often build programs that perform better and take


    a fraction of the total lines of code that another strategy might take.


