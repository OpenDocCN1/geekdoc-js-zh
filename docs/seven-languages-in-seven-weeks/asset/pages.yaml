    **Wrapping Up Clojure**


    Clojure combines the power of a Lisp dialect with the convenience of the


    JVM. From the JVM, Clojure benefits from the existing community, deploy-


    ment platform, and code libraries. As a Lisp dialect, Clojure comes with the


    corresponding strengths and limitations.


    **The Lisp Paradox**


    Clojure is perhaps the most powerful and flexible language in this book.


    Multimethods allow multiparadigm code, and macros let you redefine the


    language on the fly. No other language in this book provides this powerful


    combination. That flexibility has proven to be an incredible strength. In


    *Hackers and Painters*, Graham chronicles a start-up that leveraged produc-


    tivity with Lisp to achieve productivity that no other vendors could match.


    Some emerging consultancies are taking the same approach, betting that


    Clojure will provide a productivity and quality advantage that other languages


    simply cannot match.


    Lisp’s flexibility can also be a weakness. Macro expansion is a powerful


    feature in the hands of an expert but will lead to unmitigated disaster


    without the proper thought and care. The same ability to effortlessly apply


    many powerful abstractions in a few lines of code makes Lisp especially


    demanding for all but the most skilled programmers.


    To successfully evaluate Clojure, you need to look at Lisp but also the other


    unique aspects of the Java ecosystem and the new unique features. Let’s


    take a deeper look at the fundamental strengths of Clojure.


    **Core Strengths**


    Clojure is one of a handful of languages vying for the position as the next


    great popular language on the Java virtual machine. There are many reasons


    that it is a powerful candidate.


    **A Good Lisp**


    Tim Bray, programming language expert and superblogger, called Clojure


    a good Lisp in a post called “Eleven Theses on Clojure.”


    7 In fact, he calls


    Clojure “the best Lisp ever.” I would agree that Clojure is a very good Lisp.


    In this chapter, you saw Rich Hickey’s discussion on what makes Clojure


    such a good Lisp:


    7.


