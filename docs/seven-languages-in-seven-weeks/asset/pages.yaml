  md: 'For a point of contrast, consider Ruby. At first, you may find the Ruby code


    array[-1] baffling because you don’t understand the syntactic sugar: -1 is


    shorthand for the last element in the array. You would also need to learn


    that [] is a method to get the value at a specified index of an array. Once


    you understood those concepts, you’d be able to process more code at a


    glance. With Io, the trade-off is the opposite. You don’t have to learn very


    much to get started, but you do have to work a little harder to absorb con-


    cepts that might be otherwise communicated with sugar.


    The balance of syntactic sugar is a difficult one. Add too much sugar, and


    it’s too difficult to learn a language and remember how to use it. Add too


    little, and you need to spend more time to express code and potentially more


    energy to debug it. In the end, syntax is a matter of preference. Matz prefers


    plenty of sugar. Steve doesn’t.


    **Community**


    Right now, the Io community is very small. You cannot always find libraries


    in Io like you can with other languages. It’s also harder to find programmers.


    These issues are somewhat mitigated by having a good C interface (which


    talks to a variety of languages) and a syntax that is so easy to remember.


    Good JavaScript programmers could pick up Io quickly. But having a


    smaller community is a definite weakness and is the main thing that holds


    powerful, new languages back. Either Io will get a killer application that


    drives acceptance or it will remain a niche player.


    **Performance**


    Discussing performance in a vacuum of other issues such as concurrency


    and application design is not usually wise, but I should point out that Io


    has a number of features that will slow raw, single-threaded execution speed.


    This problem is somewhat mitigated by Io’s concurrency constructs, but


    you should still keep this limitation in mind.


    **Final Thoughts**


    In general, I liked learning Io. The simple syntax and small footprint intrigued


    me. I also think that, like Lisp, Io has a strong overriding philosophy of


    simplicity and flexibility. By staying with this philosophy uniformly in the


    language creation, Steve Dekorte has created something like the Lisp of the


    prototype languages. I think the language has a shot to grow. Like Ferris


    Bueller, it has a bright, but perilous, future.


