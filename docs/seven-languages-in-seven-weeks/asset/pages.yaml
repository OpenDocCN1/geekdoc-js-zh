  md: '**Changing a Sequence**


    The sequence library has a number of functions that transform sequences


    in various ways. You’ve already seen filter. To grab only the words with a


    length greater than four, use this:


    `user=> (def words ["luke" "chewie" "han" "lando"])`


    `#''user/words`


    `user=> (filter`


    `(fn [word] (> (count word) 4)) words)`


    `("chewie" "lando")`


    And you’ve also seen map, which calls a function on all the items in a collec-


    tion and returns the results. You can build a sequence of squares of all


    items in a vector:


    `user=> (map (fn [x] (* x x)) [1 1 2 3 5])`


    `(1 1 4 9 25)`


    The list comprehension combines maps and filters, as you saw in Erlang


    and Scala. Recall that a list comprehension combines multiple lists and fil-


    ters, taking the possible combinations of the lists and applying the filters.


    First, let’s take a simple case. We have a couple of lists, colors and toys:


    `user=> (def colors ["red" "blue"])`


    `#''user/colors`


    `user=> (def toys ["block" "car"])`


    `#''user/toys`


    We can apply a function to all the colors with a list comprehension, similar


    to the way a map works:


    `user=> (for [x colors] (str "I like " x))`


    `("I like red" "I like blue")`


    [x colors] binds x to an element from the colors list. (str "I like " x) is an
    arbitrary


    function that’s applied to every x from colors. It gets more interesting when


    you bind to more than one list:


    `user=> (for [x colors, y toys] (str "I like " x " " y "s"))`


    `("I like red blocks" "I like red cars"`


    `"I like blue blocks" "I like blue cars")`


    The comprehension created every possible combination from the two lists.


    We can also apply a filter with the :when keyword in the bindings:


    `user=> (defn small-word? [w] (< (count w) 4))`


    `#''user/small-word?`


    `user=> (for [x colors, y toys, :when (small-word? y)]`


    `(str "I like " x " " y "s"))`


    `("I like red cars" "I like blue cars")`


