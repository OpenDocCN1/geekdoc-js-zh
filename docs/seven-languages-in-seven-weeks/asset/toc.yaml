  - 在在本节中，我们接触了三个概念：类型、类和单态。我们从类型、数字、布尔值开始。然后我们转向定义类型。与任何函数式语言一样，Haskell 开发者必须发挥创意来处理风格程序和累积状态。I/O
    也可以是一个挑战。幸运的是，Haskell 开发者可以依靠单态来实现这一目的。单态是一种类型构造器和容器，支持基本函数来封装和解封函数。不同的容器提供了不同的计算策略。这些函数允许程序员以有趣的方式将单态串联，提供了
    *do 语法*。这种语法糖允许具有局限性的风格程序。
