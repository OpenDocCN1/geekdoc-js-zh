  md: 'The type attribute indicates what type of form element to display — a simple,
    one-line text entry box in this case. (Each element type is discussed individually
    in the following sections.)


    The size attribute indicates approximately how many characters the input box should
    be. If you are using a proportionally spaced font, the width of the input will
    vary depending on the user enters. If the input is too long to fit in the box,
    most web browsers will automatically scroll the text to.


    The maxlength attribute determines the number of characters the user is allowed
    to type in the text box. If a user tries to go beyond the length, extra characters
    won''t appear. You can specify a length that is longer, shorter, or as small as
    the physical size of the text box. size maxlength used only for type="text" because
    other input types (check boxes, radio buttons, and so on)


    If you want the user to enter text without the text being displayed on the screen,
    you can use <input type="password" /> type="text"> (*) are then displayed in place
    of the text users. The size, name attributes work well for type="password" as
    they do for type="text". Keep in mind that technique of hiding a password only
    provides visual protection; there is no encryption or other protection associated
    with the password being transmitted.


    # Naming Each Piece of Form Data


    No matter what input element you is, you must give a name to the data it gathers.
    You can use any name for each input, as long as one on the form is different (except
    in the case of radio buttons and checkboxes, which are discussed later in this
    hour). When the form is processed by a back-end script, each data is identified
    by name. This name becomes a variable, which is filled with a value. The value
    is either what the user enters in the form or the value associated with the user
    selected.


    For example, if a user enters Jane Doe in the text box defined previously, a variable
    is set to the value of the variable is Jane Doe. Form-processing scripts work
    with these types of variables and values.


    Additional examples of name/value pairs are covered in the following sections.


    Form-processing scripts are oversimplified for the sake of explanation within
    this book. The exact appearance (or name) of the variables available to your programming
    script depends on the programming language of that. Conceptually, it''s valid
    to say that the name of the input element becomes the name of the variable and
    the value of the input becomes becomes variable''s value on the back-end.


    # Including Hidden Data in Forms


    Want to send data items to the server script that processes a form but don''t
    want the user to see those data items? Use an <input /> tag with a type="hidden"
    attribute. This has no effect on the display; it just adds name and value you
    specify to the form results when they are submitted.'
  merge: -1
