    sample code includes a DOTYPE. Continue this practice so that you validate codes,
    because there is a very but issue with Internet Explorer and if a DOCTYPE is not
    defined, Internet Explorer manages the height and width of your elements in a
    way you did not intend. This causes browser incompatibility issues with your layout,
    so just remember to include a DOCTYPE.


