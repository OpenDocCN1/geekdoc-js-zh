  md: '# HOUR 15: Understanding the CSS Box Model and Positioning


    FIGURE 15.3


    This is supposed to be simple `<div>` but the box model affects the size of the
    second `<div>`.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_244_0.png)


    The total width of an element is the sum of:

    width + padding-left + padding-right + border-left + border-right

    margin-left + margin-right


    The total height of an element is the sum of:

    height + padding-top + padding-bottom + border-top + border-bottom

    margin-top + margin-bottom


