  md: '# # The Whole Scoop on Positioning


    Relative positioning is the default type of positioning used by HTML. You can
    think of relative positioning as being akin to laying out checkers on a checkerboard:
    The checkers are arranged from left to right, and when you get to the edge of
    the board, you move to the next row. Elements that are styled with the `block`
    value for the `display` style property are automatically placed on a new row,
    whereas `inline` elements are placed on the row immediately next to the element
    preceding them. For example, `<p>` and `<div>` are considered block elements,
    whereas the `<span>` tag is considered an inline element.


    The other type of positioning supported by CSS is known as **absolute positioning**
    it allows you to set the exact position of HTML content on a page. Although absolute
    positioning gives you the freedom to spell out exactly where an element is to
    appear, the position is still relative to any parent element that appears on the
    page. In other words, absolute positioning allows you to specify the exact location
    of an element''s rectangular area with respect to its parent''s area, which is
    very different from relative positioning.


    With the freedom of placing elements anywhere you want on a page, you can run
    into the problem of overlap, which is when an element takes up space used by another
    element. There is nothing stopping you from specifying the absolute locations
    of elements that they overlap. In this case, CSS relies on the z-index of each
    element to determine which element is on the top and which is on the bottom. For
    now, let''s take a look at exactly how you control the z-index of elements later
    when a rule uses relative or absolute positioning.


    The type of positioning (relative or absolute) used by a particular style rule
    is determined by the `position` property, which is capable of having one of the
    following two values: `relative` `absolute`. After specifying the type of positioning,
    you then provide the specific positioning using the following properties:


    +   - **left**—The left position offset.


    +   - **right**—The right position offset.


    +   - **top**—The top position offset.


    +   - **bottom**—The bottom position offset.'
  merge: -1
  pgno: 245
