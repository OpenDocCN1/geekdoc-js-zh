  md: '# Placing Lists Within Lists


    As shown in Figure 5.3, a web browser will normally use a solid disc for the first-level
    bullet, a hollow circle for the second-level bullet, and a solid square for all
    deeper levels. However, you can explicitly choose which type of bullet for any
    level using <ul style=''list-type:disc''>, <ul style=''list-type:circle''>, or
    <ul style=''list-type:square''> instead of <ul>.


    You can even change the bullet for any single point within an unordered list by
    using the list-style-type rule in the <li> tag. For example, the following displays
    a hollow circle in the front of words extra and a solid square in the front of
    the word special:


    ```

    <ul style=''list-type:circle''>

    <li>extra</li>

    <li>super</li>

    <li style=''list-type:square''>special</li>

    </ul>

    ```


    The list-style-type rule allows works with ordered lists, but instead of choosing
    a type of bullet, you choose the type of numbers or letters to place in each item.
    Listing 5.4 shows how to use Roman numerals (list-style-type:upper-roman), capital
    letters (list-style-type:upper-alpha), lowercase letters (list-style-type:lower-alpha),
    and ordinary numbers in a multilevel list. Figure 5.4 shows the resulting outline,
    which is nicely-formatted.


    Although Listing 5.4 uses the list-style-type rule only with the <ol> tag, you
    can also use it for specific <li> tags within a list (though it''s hard to imagine
    a situation in you would want to do that). You can explicitly specify ordinary
    numbering with list-style-type:decimal and you can make lowercase Roman numerals
    with list-style-type:lower-roman.


    Listing 5.4 Using the list-style-type Rule with the style Attribute in Multicolored
    Lists


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.1//EN"

    n"http://www.w3.org/TR/html11/DTD/html11.dtd">


    <html xmlns="http://www.w3.org/1999/xhtml" xml-lang="en">

    <head>

    <title>Advice from the Golf Guru</title>

    </head>


    <body>

    <h1>How to Win at Golf</h1>

    ```'
