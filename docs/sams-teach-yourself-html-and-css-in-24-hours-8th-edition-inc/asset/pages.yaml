  md: '# Understanding Web Colors


    There are entire books and courses devoted to understanding color theory, continuing
    the discussion in this book would be a tangent. However, if you intend to work
    in web design and development, you will be served well by a solid understanding
    of the basics of color theory. Spend some time reading about it—an online search
    will provide a wealth of information.


    Additionally, spend some hands-time on the color wheel. The Color Scheme Generator
    at http://colorsmesigned.com/ allows you to start with a base color and produce
    monochromatic, complementary, triadic, tetradic, analogic, and accented analog
    schemes.


    # Understanding Web Colors


    Specifying a background color other than white for a web page is easier than you
    probably realize. For example, to specify the background color for a page, use
    style=`background-color:blue` inside the `<body>` tag or in the style sheet for
    the body element. Of course, you can use colors other than blue. In fact, there
    are 16 colors in the W3C standards: aqua, black, blue, fuchsia, gray, green, lime,
    maroon, navy, olive, purple, red, silver, teal, and white.


    Obviously there are many more colors displayed on the Web than those 16. In fact,
    there are 140 color names that you can use with assurance that browsers will display
    these colors. Here''s a partial list of the 140 descriptive color names: azure,
    bisque, cornflowerblue, salmon, firebrick, honeydew, lemonchiffon, papawpeach,
    peachpuff, strawberry, tomato, and whites.


    But names are subjective—for instance, if you look at the color of 140 cross-browser
    colors, you will not be able to distinguish fuchsia and magenta. You will realize
    that the hexadecimal color values for two terms, fuchsia and magenta, are the
    same: #FF00. You''ll learn about hexadecimal color values in the next section,
    but for now, know that if you want to be standards-compliant and use more than
    the 16 color names the W3C standards dictate, you should use the hexadecimal color
    codes whenever possible.


    There are, in fact, 16 million colors possible with hexadecimal color codes. However,
    most modern computer displays can display “only” 16,384. But 16,384 is still a
    little more than 140, or 16.


    > NOTE

    A complete list of the 140 descriptive color names, as well as their hexadecimal
    codes and an example of the color displayed by your browser, visit http://www.w3schools.com/HTML/html_colenames.asp.


    > TIP

    It''s worth pointing out that color names are not case-sensitive. So'
