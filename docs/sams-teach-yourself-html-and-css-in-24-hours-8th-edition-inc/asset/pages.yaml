  md: '# 28


    # HOUR 3: Understanding HTML and XHTML Connections


    # NOTE


    3. Get web browser software. This is the software your computer needs to retrieve
    and display web content. As you learned in the first hour, the most popular browser
    software (in alphabetical order) is Apple Safari, Google Chrome, Mozilla Firefox,
    Microsoft Internet Explorer, and Opera. It is a good idea to install several of
    these browsers so that you can experiment and make sure that your content looks
    consistent across them all; you can make assumptions about what other people are
    using.


    Although web browsers process and handle information in the same general way,
    there are some differences among them that result in things not looking the same
    in different browsers. Be sure to check your multiple browsers to make sure they
    look reasonably consistent.


    4. Explore! Use a web browser to look around the Internet for web sites that are
    similar in content or appearance to those you''d like to create. What frustrates
    you about some pages, what attracts you and keeps you reading others, and what
    makes you come back to some pages over and again. If there is a particular part
    that interests you, consider searching for it using a popular search engine such
    as Google (http://www.google.com/) or Bing (http://www.bing.com/).


    # NOTE


    As discussed in Hour 1, if you plan to put your web content on the Internet (as
    opposed to publishing on a CD-ROM or a local intranet), you''ll need to transfer
    it to a computer that is connected to the Internet 24 hours a day. The same company
    or school that provides you with Internet access might also provide web space;
    if not, you might need to pay a hosting provider for the service.


    # Getting Started with a Simple Page


    In the first hour, you learned that a "web page" is just a text file that is "marked-up"
    by (or surrounded by) HTML codes how to display. To create these files, you can
    use a text editor such as Notepad (Windows) or TextEdit (on a Mac)—do not use
    WordPad, Microsoft Word, or any other full-featured word-processing software,
    as these of create different sorts of files than the plain-text files you will
    use for web content.


    # WARNING


    Do not create your first HTML file with Word or any other HTML-compatible word
    processor; most of these programs attempt to rewrite HTML in strange ways, potentially
    leading you to confusion. Additionally, I recommend that you do not use a graphical,
    what-you-see-is-you-get (WYSIWYG) editor, such as Microsoft FrontPage or Adobe
    Weaver. You''ll find it easier to start with a simple text editor while you are
    learning HTML than visual tools (such as FrontPage and Dreamweaver) after you
    have a better understanding of what''s going "under the hood."


    Before you begin, you should start with some text that you want to put on a web
    page:


    +   1. Find (or write) a few paragraphs of about yourself, your company, your
    softball team, or any other subject in which you are interested.


    +   2. Save this file as plain, ASCII text. Notepad and most simple text editors
    always save as plain text, but if you''re using another program, you might need
    to choose this file type as an (after selecting File, Save As).


    As you go through this, you will add HTML markup (called tags) to your text, making
    it into web content.'
