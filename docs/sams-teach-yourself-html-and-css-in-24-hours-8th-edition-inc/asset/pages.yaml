  md: '# Q&A


    You''ve said “web content” instead of “web page,” but I hear people refer to “web
    pages. So what do they mean? And how are these terms different from a “home page”
    or a “web site”?


    The metaphor of the World Web as a library has always been easy for people to
    understand; in that library, individual web sites are books, and the individual
    content on web sites as “pages.” A “web site” is comprised of one or more pages
    that are created together and related content. A “home page” usually means the
    first page people visit when they look at a web site. Problems arise, however,
    when people say “visit my page” when they really mean “come to my web site”—are
    full of pages. Referring to a collection of web content as a page instead of a
    site can tip someone off that you really don’t understand how the web works—either
    because you don’t understand the web content together to create a site, or because
    you’ve planned, designed, and implemented a site in which your content really
    is all on one page!


    I''ve looked at the HTML “source” of some web pages on the Internet and it looks
    frighteningly difficult to learn. Do I have to think like a computer programmer
    to learn this?


    Although complex HTML pages can be indeed daunting, learning HTML is much easier
    than learning actual software programming languages (such as C++ or Java), HTML
    is a markup language rather than a programming language; you mark-up text so that
    the text can be rendered a certain way by the browser. That''s a completely different
    set of thought processes than developing a computer program. You really don’t
    need any experience or skill as a computer programmer to be a successful web content
    author.


    One of the reasons behind many commercial web sites looks complicated because
    it was likely created by a visual web design tool—“what you see is what you get”
    or “WYSIWYG” editor that you use markup its software developer it to use in certain
    circumstances—as opposed to being hand-coded, in which you are completely in control
    of the resulting markup. In this book, you are taught fundamental coding from
    the ground up, which typically results in clean, easy-to-read source code. Visual
    web design tools have a knack for making code difficult to read, and also for
    producing code that is convoluted and non-standards compliant.'
  merge: -1
