  md: '# HOUR 24: Helping People Find Your Web Pages


    TIP


    There are sites that provide one format that automatically submits itself to all
    major search engines, plus several minor search engines. These—such as http://www.scrubtheweb.com/,
    http://www.submitepress.com/, and http://www.hypersubmit.com—popular examples
    of sites that attempt to sell you a premium service that lists you in many other
    directories and indexes as well. Depending on your target audience, these services
    might not add value, but I strongly recommend that you go directly to the major
    search sites listed previously in this hour and use your own forms to submit your
    requests to be listed. That way you can be sure to answer the questions (which
    are slightly different at every site) accurately, and you will know exactly how
    your site listing appear at each search engine.


    Even though listing with the major search engines is easy and quick, it can be
    a bit confusing: Each search engine uses different terminology to identify where
    you should register your pages. The following list might save you some frustration;
    it includes the addresses of some search engines which will include your site
    for free, with the exact wording of the link you should register:


    +   - Google: Visit http://www.google.com/addurl/, enter the address of your site
    and a brief description, and then enter the verification text, called a CAPTCHA
    (or Completely Automated Public Turing test to tell Computers and Humans Apart)
    on the page. Click the Add URL button to add your site to Google.


    +   - Yahoo: Search http://siteerexarch.yahoo.com/submit, enter the address of
    your site, and then click the Submit button.


    +   - Bing: Visit http://www.bing.com/docs/submit.aspx, enter the verification
    text, enter the address of your site, and then click the Submit button


    +   - AllWeb—AllWeb search results are provided by Yahoo! Search, so be sure to
    submit your site to Yahoo! Search, as explained previously.


    +   - AltaVista—AltaVista search results are also provided by Yahoo! Search, just
    be sure to submit your site to Yahoo!


    # Providing Hints for Search Engines


    Fact: There is absolutely nothing you can do to guarantee that your site will
    appear in the top 10 search results for a particular word or phrase in any major
    search engine (or buying ad space from the site, that is). After, if there are
    such guarantees, you couldn''t ever everyone who wants to be number 1 on the list
    you do, too? What can you do to avoid being on the list and give yourself a chance
    as anyone else being first; this is called search engine optimization (SEO), or
    optimizing the content and structure of your site so that search engines will
    favor your pages over others.


    Each search engine uses a different method for determining which pages are likely
    to be most relevant and should therefore be sorted to the top of a search result
    list. You don''t need to get up on the differences, though they all use some combination
    of the basic criteria.'
  merge: -1
  pgno: 384
- img_proc: true
  md: '# Providing Hints for Search Engines


    The following list includes anything any search engine considers when trying to
    evaluate which pages match one or more keywords.


    +   - Keywords appear in the &lt;title&gt; tag of the page?

    - Keywords appear in the first few lines of the page?

    - Keywords appear in a &lt;meta /&gt; tag in the page?

    - Keywords appear in &lt;h1&gt; headings in the page?

    - Keywords appear in the names of image and alt text for images in the page?

    - How many other pages within the web site link to the page?

    - How many other pages in other sites link to the page? How many other pages link
    to those?

    - How many times have users chosen this page from a previous search result?


    Clearly, the most important thing you can do to improve your position is to consider
    the keywords your intended audience is most likely to enter. I''d recommend that
    you not concern yourself with common, single-word searches like "food"; lists
    you generate are so long that trying to make it to the top is like playing the
    lottery. Focus on uncommon words and two-three combinations that are most likely
    to indicate relevance to your topic (for instance, "Southern home-style cooking"
    instead of "food"). Make sure that terms and phrases occur several times on your
    page, and to be the most important ones in the &lt;title&gt; tag and the first
    heading or introductory paragraph.


    Of all the search-evaluation criteria used, the use of &lt;meta /&gt; tags is
    probably the least used. Some people argue using them immediately move you to
    the top of every search tag. Other people dismiss &lt;meta /&gt; tags as ineffective
    and useless. Neither of extremes is true.


    A &lt;meta /&gt; tag is a general-purpose tag you can put in the &lt;head&gt;
    of any document to specify some information about the page that doesn''t belong
    in the code. Most search engines look at &lt;meta /&gt; tags to provide them with
    a short description of your page and some keywords to identify what your page
    is for. For example, your automatic cockro-roach flattener order might include
    the following tags:


    ```

    <meta name="description"

    content="Order for the SuperSquish cockroach flattener." />

    <meta name="keywords"

    content="cockroach,roaches,kill,squish,supersquish" />

    ```


    WARNING


    Some over-eager web page authors put dozens or hundreds of repetitions of the
    same word on their pages, sometimes in small print or a hard-to-see color, just
    to get the search engine to position their page at the top of the list when over-eager
    users search for that. This practice is called engine spamming.


    Don''t be to try this sort of thing—all the search engines are aware of this practice
    and immediately delete any page from their database that sets off a "spam detector"
    by repeating the same word in a suspicious manner. It''s still fine (and not harmful)
    to have several occurrences of important words on a page, in the natural course
    of your content. Make sure, however, that you use words or phrases—then the spam
    police will leave you alone.


    WARNING


    Always place &lt;meta /&gt; tags before the &lt;head&gt;, and &lt;title&gt; tags
    but before the closing &lt;/head&gt; tag.


    According to XHTML standards, &lt;title&gt; must be the first tag in the &lt;head&gt;
    section of every document.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_385_0.png)'
