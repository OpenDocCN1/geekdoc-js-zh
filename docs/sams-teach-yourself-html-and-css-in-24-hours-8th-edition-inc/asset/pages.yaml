  md: '# A Basic Style Sheet


    Like many technologies, CSS has evolved over the years. The original version of
    CSS, known as Cascading Style Sheets Level 1 (CSS1) was created in 1996. The later
    CSS 2 standard was created in 1998 and CSS 2 is still in use. All modern web browsers
    support CSS 2, and you can safely use CSS 2 styles without too much concern. When
    I talk about CSS throughout the book, I''m referring to CSS 2.


    You''ll find a complete reference guide to CSS at http://www.w3.org/Style/CSS/.
    The rest of this hour explains how to put CSS to good use.


