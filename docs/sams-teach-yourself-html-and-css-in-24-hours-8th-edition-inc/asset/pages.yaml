    Everything between that tag and the closing </div> tag in Listing 4.2 appears
    in 9-point, centered, italic with 12-point vertical line spacing and 30 points
    of padding at top of the element.


    What makes style classes valuable is that they isolate style code from web pages,
    allowing you to focus your HTML code from the actual content in a page, not how
    it is going to appear on the screen. Then you can focus on how the content is
    rendered to the screen by fine-tuning the style sheet. You might be surprised
    by how a relatively small amount of code in a style sheet can have significant
    effects across an entire site. This makes your pages much easier to maintain and
    manipulate.


    TIP


    You might have noticed a change in the coding style when multiple properties are
    included in a style. For rules with a single style, you''ll commonly see the property
    placed on the same line as the rule, like this:


