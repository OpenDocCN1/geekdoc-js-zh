  md: '# HOUR 4

    Understanding Cascading Style Sheets


    In the previous hour, you learned the basics of HTML and XHTML, including how
    to set up a skeletal HTML template for all your web content. In this hour, you
    will learn how to fine-tune the display of your web content using cascading style
    sheets(CSS). The concept behind style sheets is simple: You create a style document
    that specifies the fonts, colors, spacing, and other characteristics that establish
    a unique look for a web site. Then you link every page that should look like the
    style sheet, instead of specifying all those styles repeatedly in each separate
    document. Therefore, when you decide to change your overall corporate typeface
    or color scheme, you can modify all your web pages at once by changing one or
    two entries in your style sheet rather than changing them in all of your static
    web pages. A style sheet is a grouping of formatting instructions that control
    the appearance of several HTML pages at once.


    Style sheets enable you to set a great number of formatting characteristics, including
    exacting typeface controls, letter and line spacing, and margins and page borders,
    just to name a few. Style sheets also enable sizes and other measurements to be
    specified in familiar units, such as millimeters, points, and picas. You can also
    use style sheets to precisely graphics and text anywhere on a web page, either
    at specific coordinates or relative to other items on the page.


    In short, style sheets bring a sophisticated level of display to the web. And
    they do so—you''ll pardon the expression—with style.


    +   WHAT YOU''LL LEARN IN THIS HOUR:

    - How to create a basic style sheet

    - How to use style classes

    - How to use style IDs

    - How to construct internal style sheets and inline styles


    If you have three or more web pages that share (or should share) similar formatting
    and fonts, you might want to create a style sheet for them as you read this. If
    you choose not to create a complete style sheet, you''ll find helpful to apply
    styles to individual HTML elements directly within a web page.'
  merge: -1
  pgno: 57
- img_proc: true
  md: "# How CSS Works\n\nThe technology behind style sheets is called CSS, which\
    \ stands for Cascading Style Sheets. CSS is a language that defines style constructs\
    \ such as fonts, colors, and positioning, which are used to describe how information\
    \ on a web page is formatted and displayed. CSS styles can be stored directly\
    \ in an HTML web page or in a separate style sheet. Either way, style sheets contain\
    \ rules that apply to elements of a given type. When used externally, style rules\
    \ are placed in an external style document with the file extension .css.\n\nA\
    \ style rule is a formatting instruction that can be applied to an element on\
    \ a web page, such as a paragraph of text or a link. Style rules consist of one\
    \ or more style properties and their associated values. An internal style sheet\
    \ is placed directly within a web page, whereas an external style sheet exists\
    \ in a separate document and is simply linked to a web page via a special tag—or\
    \ this in a moment.\n\nThe “cascading” part of the name CSS refers to the manner\
    \ in which style rules are applied to elements in an HTML document. Specifically,\
    \ in a CSS style sheet form a hierarchy in which more specific override general\
    \ ones. It is the responsibility of CSS to determine the precedence of style rules\
    \ according to this hierarchy, which establishes a cascading effect. If that sounds\
    \ a bit confusing, just think of the cascading mechanism as being similar to genetic\
    \ inheritance, in general traits are passed from parents to a child, but more\
    \ specific traits are unique to the child. Base style rules are applied throughout\
    \ a style sheet and can be overridden by more specific style rules.\n\nNOTE notice\
    \ that I use the element a fair amount in this hour (and I will for the rest of\
    \ the book, for that matter). An element is simply a piece of information (content)\
    \ in a web page, such as an image, a paragraph, or a link. Tags are used to code\
    \ elements, and you can think of an element as complete with descriptive information\
    \ (attributes, text, images, and so on) within the tag.\n\nA quick example should\
    \ clear things up. Take a look at the following code to see whether you can tell\
    \ on the color of the text:\n\n```\n<div style=\"color:green\">\n  This is green.\n\
    \  <p style=\"color:blue\">This is blue.</p>\n  <p>This is still green.</p>\n\
    </div>\n```\n\nIn the previous example, the green color is applied to the <div>\
    \ tag via the color property. Therefore, in the <div> tag is green. Because <p>\
    \ tags are children of the <div>, the green text style comes down to them. However,\
    \ the <p> tag overrides the color style and changes it to blue. The result is\
    \ that the first line (not surrounded by a paragraph tag) is green, the first\
    \ official paragraph is blue and the second official paragraph retains the cascaded\
    \ green color."
  merge: -1
