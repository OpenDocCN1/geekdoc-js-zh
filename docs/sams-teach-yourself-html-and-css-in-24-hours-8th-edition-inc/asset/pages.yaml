  md: '# HOUR 2: Publishing Web Content


    If you put the sample.html file in the directory you originally saw upon connecting
    to your server—that is, you did not change directories and place the file in the
    document root—then the sample.html file would not be accessible from your web
    server at any URL. The file will still be on the machine you know as your web
    server, but since the file is not in the document root—where the server software
    starts looking for files—it will never be accessible to anyone via a web browser.


    The bottom line? Always navigate to the document root of your web server before
    you start transferring files.


    This is especially true with graphics and other multimedia files. A common directory
    on web servers is called "images," where you can imagine, the image assets are
    placed for retrieval. Other popular directories include "css" for stylesheets
    files (if you are using more than one) and "js" for external JavaScript files.
    Or, if you know you have an area on your web site where visitors can download
    many types of files, you might call that directory "downloads."


    Whether it''s a ZIP file containing your portfolio or an Excel spreadsheet with
    sales numbers, it''s often useful to publish files on the Internet that aren''t
    simply web pages. To make a file available on the Web that isn''t an HTML file,
    just upload the file to your web site as if it were, following the instructions
    earlier in this hour for uploading. After the file is uploaded to the web server,
    you can create a link to it (as you''ll learn in later hours). In other words,
    your web server can "serve" much more than HTML.


    Here''s a sample of the HTML code that you will learn in that hour. The following
    code would be used for a file named artfolio.zip, located in the downloads directory
    of your web site, and link text that reads "Download my portfolio!"


    ```

    <a href="downloads/artfolio.zip">Download my portfolio!</a>

    ```


    # Using an Index Page


