  md: "# Organizing a Page with Paragraphs and Line Breaks\n\nWhen a web browser displays\
    \ HTML pages, it pays no attention to line endings or the number of spaces between\
    \ words. For example, the top version of the poem shown in Figure 3.2 appears\
    \ with a single space between all words, even though that's not how it's entered\
    \ in Listing 3.2. This is because extra whitespace in HTML code is automatically\
    \ reduced to a single space. Additionally, when the text reaches the edge of the\
    \ browser window, it automatically wraps to the next line, no matter what the\
    \ line breaks were in the original HTML file.\n\n+   Listing 3.2 HTML Containing\
    \ Paragraph and Line Breaks\n\n```\n<xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
    <!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.1//EN\"\n\"http://www.w3.org/TR/html11/DTD/html11.dtd\"\
    >\n\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml-lang=\"en\">\n<head>\n \
