    Unlike the <frame /> you learned earlier in this hour, the <iframe> is here to
    stay and is still a part of HTML 5.


    # Summary


    In this hour you learned how to display more than one page simultaneously by splitting
    the web window into frames. You learned how to use a frameset document to define
    the size and arrangement of the frames and learned which web content will be loaded
    into each frame. You learned how to create links that change the contents of any
    frame you choose while leaving the other frames unchanged. You also learned about
    few optional settings that control the appearance of resizable borders and scrollbars
    in frames. Finally, you learned how to use the inline frame to display content
    from your site or other web sites.


    Table 13.1 summarizes the tags and attributes covered in this hour.


    | Table 13.1 HTML Tags and Attributes Covered in Hour 13 |

    | Tag/Attribute | Function |

    | <frame /> | Defines a single frame within a <frameset> |

    | src="url" | The URL of the document to be displayed in this frame. |

    | id="name" | A name to be used for targeting this frame with the target attribute
    in a <a href> links; compliant with XHTML. |

    | name="name" | A name to be used for targeting this frame. The target attribute
    in a <a href> links. Events will be replaced by id for the time being still useful
    because it works in current browsers. |

    | scrolling="yes/no/auto" | Determines whether a frame has scrollbars. Possible
    values are yes, no, and auto. |'
