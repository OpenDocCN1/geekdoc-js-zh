  md: '# HOUR 9: Working with Colors


    ues—0 through 9 and A through F, paired up. For example, F0 is a possible hex
    value (decimal value 240), 62 is a possible hex value (decimal value 98), and
    so on.


    As previously discussed, the rr, gg, and bb in the #rrgg hexadecimal code format
    stands for red, green, and blue components of the color. Each of those components
    has a decimal value ranging from 0 (no color) to 255 (full color).


    So, white (or #FFFFFF) translates to a red value of 255, a green value of 255,
    and a blue value of 255. Similarly, #000000 translates to a red value of 0, a
    green value of 0, and a blue value of 0. True red is #FF0000 (all red, no green,
    and no blue), true green is #00FF00 (no red, and blue). All other hexadecimal
    notations translate to some variation of the 255 possible values for each of the
    three colors. The cross-browser compatible name CornflowerBlue is associated with
    the hexadecimal notation #6495ED—a red value of 40, a green value of 149, and
    a blue value of 237 (all of the available values).


    When picking colors, either through a graphics program or by finding something
    that you like, you will see the color in hexadecimal or decimal. If you type hexadecimal
    color converter in your search engine, you will find numerous options to help
    you convert color values into something you can use in your style sheets.


    # Using CSS to Set Background, Text, and Border Colors


    When using CSS, there are three instances in which color values can be used: when
    specifying the background color, the text color, or the border color of elements.
    Previous hours contained examples of specifying colors without going in great
    detail about color notion or color theory. For example, in Hour 8, you learned
    about using colors for various link states. In Hour 7, one of the quiz questions
    asked how to fill table cells with colors.


