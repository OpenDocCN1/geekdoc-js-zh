  md: '# HOUR 23: Organizing and Managing a Web Site


    356


    # When One Page Is Enough


    Building and organizing an attractive and effective web site doesn’t always need
    to be a complex task. If you are creating a web site for a single entity (such
    as a local event) that requires only a brief amount of very specific information,
    you can effectively present that information on a single page without a lot of
    flashy graphics. In fact, there are several positive features to a single-page
    presence:


    +   * All the information on the site downloads quicker than on extensive sites.


    +   * The whole site can be printed on paper with a single print command, even
    if it is several pages long.


    +   * Visitors can easily save the site on their hard drives for future reference,
    especially if it uses a minimum of graphics.


    +   * Links between different parts of the page usually respond more quickly than
    links to other pages.


    Figure 23.1 shows the first part of a web page that serves its intended audience
    better as a single lengthy page than it would be a multipage site. The page begins,
    as introductory pages, with a succinct explanation of what the page is and who
    would want to read it. A detailed table of contents allows visitors to skip directly
    to the reference material in which they are most interested. It contains about
    eight pages worth of text explaining how to begin buying a house—something a visitor
    might think about out and reading later, while taking notes.


    FIGURE 23.1

    A good table of contents can make a lengthy page easy to navigate.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_366_0.png)'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# Organizing a Simple Site


    Figure 23.2 shows each section of the page is followed by a link back up to the
    table of contents, navigating around the page feels much like navigating around
    a multisite page. Because the contents of the page are indented as a handy reference,
    visitors will definitely prefer the convenience of bookmarking or saving a single
    page instead of eight or 10 separate pages.


    Having seen all the graphics and layouts in this book, you might be tempted to
    forget that a good, old-fashioned outline is often the clearest and most efficient
    way to organize long web pages within a site.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_367_0.png)


    Figure 23.2

    Always provide a link back to the table of contents after each section of a long
    web page.


    +   ### Finding a property

    Once you have decided what property you are looking for and in the area where
    you want to live, consider contacting as small estate agents as possible so that
    they can send your list of suitable properties to them on a basis.

    Once you find the property you like, if you are interested in it, it is worth
    calling the estate agent once to see it or to get info about other properties
    which have only come out. You can also ask the agent who the buyer is and who
    they might want to come viewing with you.

    Once you get started, you might probably make offers on several different properties
    in a short period of time. Keep a record of each offer you make, with a few notes
    on of its good and bad points. You can then look back on this list to check that
    you are still tilling your requirements in the deadline you are meeting.


    +   ### Return to list


    +   ### Choosing a mortgage

    It is important to organise your mortgage as soon as you have found a suitable
    property. It may take a few weeks to get processed, and the person you are buying
    from (and the estate agent will want to know) your mortgage offer is in place.

    If you want to get a mortgage before you have found a property you can get an
    Approval in Principle from your chosen lender. This Approval is enough to convince
    the seller that you are a serious buyer. You can get your mortgage application
    submitted online.


    # Organizing a Simple Site


    Although single-page sites have their place, most companies and serve their readers
    better by dividing their site into short, quick-read pages surrounded by graphical
    navigation that allows them to reach almost all the information they need within
    a few clicks.

    Furthermore, using multiple pages instead of a series of very long pages minimizes
    scrolling around the page, which can be especially better for some visitors who
    are using mobile devices to view the site or who have relatively low-resolution
    monitors (less than 800x600).


    The goal of the “home” page is to make the organization “visible” on the Internet,
    but also—and more importantly—act as a portal to the'
  merge: -1
