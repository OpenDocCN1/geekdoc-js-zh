    # Creating Image Maps with List Items and CSS


    In Hour 11, you learned how to create client-side image maps using the `<img>`
    tag in HTML. Image maps allow you to define an area of the image and assign a
    link to that area (rather than having to slice an image into pieces, like to individual
    pieces, and stitch the image back together in HTML). However, you can also create
    an image map purely of valid XHTML and CSS.


