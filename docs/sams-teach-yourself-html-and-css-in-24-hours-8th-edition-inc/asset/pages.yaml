  md: '# Creating Fixed or Liquid Layouts


    The bulk of this book has taught you all about styling web content, from font
    sizes and colors to images, block elements, lists, and more. But what has yet
    to be discussed is there are two types of layouts—fixed and liquid—but also a
    layout that is a combination of the two, where some elements are fixed while others
    are liquid.


    In this hour, you''ll first learn about the characteristics of these two types
    of layouts and see a few examples of web sites that use them. At the end of the
    hour, you will see a basic template that combines elements of both layouts. Ultimately,
    the type of layout you decide is up to you—it''s hard to go wrong as long as your
    sites follow HTML and CSS standards.


    +   WHAT YOU''LL LEARN IN THIS HOUR:

    * How fixed layouts work

    * How liquid layouts work

    * How to create a fixed/liquid hybrid layout


    A good place for examples of liquid layouts is the WordPress Theme Gallery at
    http://wordpress.org/extend/themes/. WordPress is a blogging platform that is
    increasing use as a non-blog site platform. The gallery shows hundreds of examples
    of both fixed-width and liquid layouts which give you an idea, if not all of the
    code, for what you could create. Even though you are not working with a WordPress
    as part of the exercises in this book, the template gallery is a place where you
    can see and interact with many variations on designs.


    Spend some time looking at the WordPress examples and perhaps the CSS Zen Garden
    as well as http://www.csszengarden.com/. This will help you get a feel for the
    types of layouts you like without being swayed away one way or the other by the
    content within the layout.


    # TRY IT YOUR

    Find Examples of Layouts You Like'
  merge: -1
