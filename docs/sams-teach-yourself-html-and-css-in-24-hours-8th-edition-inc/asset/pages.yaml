  md: 'In the previous hour, you learned the basics of creating blocks of text and
    putting that text into list format. In this hour, you''ll take a closer look at
    the bits of text themselves, and learn how to change the visual display of the
    font—it''s font family, size, and weight, for example. You''ll learn to incorporate
    boldfaces, italics, superscripts, and strikethrough text into your pages. You
    will also learn how to change typefaces and font sizes.


    # WHAT YOU''LL LEARN IN THIS HOUR:


    +   - How to use boldface, italics, and special text for formatting

    - How to tweak the font

    - How to use special characters


    NOTE


    When viewing other designers'' web content, you might notice methods of marking
    up text that are different than those taught in this book. The "old way" of formatting
    text includes the use of the `<b></b>` tag to indicate when a word should be bolded,
    the `<i>` tag to indicate when a word should be in italics, and the use of `<font></font>`
    tag to specify font family, size, and other attributes. However, there is no reason
    to learn it because it is being phased out of HTML, and CSS is considerably more
    powerful.


    # TRY IT YOURSELF ▼


    # More Work with Sample Text


    Just like you created a sample file to work with in the previous hour, create
    one for this hour you can follow along and make the most of learning how to style
    text throughout this hour.


    Since the information in this hour has to do with font-level styles, it doesn''t
    really matter what type of text you use. There are so many different stylistic
    possibilities to try that they would never appear all on the same web page anyway
    (unless you want to drive your visitors bat). Take this opportunity to get a feel
    for how text-level changes can affect the appearance of your content.'
