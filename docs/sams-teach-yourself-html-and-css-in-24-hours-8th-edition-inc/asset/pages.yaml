    the following code will e-mail the results to me@mysite.com.


    ```

    <input type=''hidden'' name=''mail_to'' value=''me@mysite.com'' />

    ```


    Scripts often use at least one or two hidden input elements to carry data along
    for the ride that might be useful when you receive the results of the form submission;
    some examples include an e-mail address and a subject for the e-mail. If you are
    using a script provided by your web hosting provider, consult the documentation
    provided with that script for additional details about potential required fields.


