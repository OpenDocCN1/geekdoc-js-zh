  md: '# Aligning Text on a Page


    In the previous example and in examples shown in previous hours, you might have
    noticed the use of lowercase for tags, attributes, and styles. The exacting XHTML
    standard requires tags and attributes to be lowercase; the XHTML standard also
    requires quotation marks around attribute values.


    For example, the following code will be rendered by most popular browsers:


    ```

    <P STYLE=TEXT-ALIGN:CENTER>

    ```


    However, this code does not conform to XHTML standards because the tag is uppercased,
    the style attribute and its value (text-align:center) is uppercased, and the value
    is not in quotation marks. If you want to stay compatible with the latest standards
    and software, you should always use the following:


    ```

    <p style="text-align:center">

    ```


    # Aligning Block-Level Elements


    To align a block-level element such as <p> to the right margin without creating
    a separate class or ID in a style, simply place style="text-align:right" inside
    the <p> tag at the beginning of the paragraph. Similarly, to center the element,
    use <p style="text-align:center">. To align a paragraph to the left, use <p style="text-align:left">.


    The text-align style attribute is referred to as a style rule, which means that
    it is setting a particular style aspect of an HTML element. There are many rules
    you can use to carefully control the flow of web content.


    The text-align style is not reserved for the <p> tag. In fact, you can use the
    text-align rule with any block-level element, which includes <h1>, <h2>, the other
    heading tags, and the <div>, among others. The <div> tag is specially handy because
    it can encompass other block-level elements and allow you to control the alignment
    of your web content inside all of once. In the <div> tag is for division.


    Listing 5 demonstrates the style attribute and text-align rule with both the <p>
    and the <div> tags. The results are shown in Figure 5.1. You will learn more advanced
    uses of the <div> tag in Part III.


    > NOTE

    Every attribute and style rule in HTML has a default value that is assumed when
    you don''t set the attribute. In the case of the text-align style rule of the
    <p> tag, the default value is left, so using the <p> tag has the same effect as
    using style="text-align:left". Learning the default values for common style rules
    is becoming a good web page developer.'
