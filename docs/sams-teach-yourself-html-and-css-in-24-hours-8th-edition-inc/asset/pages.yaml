  md: '# Introduction


    In 2009, it is estimated that more than 1.5 billion people have access to the
    Internet, including 220 million in the U.S. alone. Throw in 338 million Chinese
    users, 55 million German users, 48 million British users, 38 million Russian users,
    and 67 million Brazilians, and you can see the meaning of the word "world" in
    the term World Wide. Many of these Internet users are also creating content for
    the Web—you can be one of them! Although accurate measures of the total number
    of web pages are difficult to come, Google''s most recent data indicates they
    hit the 1 trillion mark of indexed pages in the middle of 2008.


    In the next 24 hours, hundreds of millions of new pages will appear in accessible
    areas of the Internet. At least as many pages will be placed on private intranets,
    where they will be viewed by businesspeople connected via their local networks.
    Every one of these pages—like the more than 1 trillion pages already online—will
    use Hypertext Markup Language (HTML).


    As you complete the 24 one-hour lessons in this book, your web pages will be those
    that appear on the Internet. These lessons will help you develop one of the most
    valuable skills in the world today: mastery of HTML.


    Can you learn to create top-quality web pages yourself, without any specialized
    software, in less time than it takes to schedule and wait for an appointment with
    a highly paid HTML wizard? Can this short, easy-to-read book enable you to teach
    yourself-of-the-art web page publishing?


    Yes. In fact, within the first two lessons in this book, someone with no previous
    experience at all can have a web page to place on the web.


    How can you learn the language of the Web so fast? By example. This book organizes
    HTML into simple steps and shows you how to tackle each step. Every HTML code
    example is listed directly before a picture of the web page it produces. When
    you see it, you read a clear, concise explanation of how it works, and then you
    immediately do the same thing with your own page. Ten minutes later, you''re on
    to the next step.


    After 24 hours of work, you''re marveling at your own impressive pages on the
    Internet.


    # Beyond HTML


    This book covers more than just HTML because HTML isn''t the only thing you need
    to know to create web content today. The goal of this book is to give you all
    the skills you need to create a modern, standards-compliant web site in just 24
    short, easy lessons. This book covers the following key skills and technologies:


    +   - XHTML (eXtensible Markup Language) is the current standard for web page
    creation. Every example in this book is fully XHTML-compatible. Where applicable,
    HTML 5 is also covered.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '+   All the examples in the book have been tested for compatibility with the
    latest version of every major web browser. That includes Apple Safari, Google
    Chrome, Microsoft Internet Explorer, Mozilla Firefox, and Opera. You''ll learn
    from the start to be compatible with the past, yet ready for the future.


    +   There is extensive coverage of Cascading Style Sheets (CSS), which allows
    you to carefully control the layout, fonts, colors, and formatting of every aspect
    of your web pages, including both text and images. When it comes to creating eye-popping
    web pages, CSS goes far beyond what HTML pages could do by themselves. For example,
    you will know that CSS allows you to specifically tailor the information on a
    page for printing, in addition to normal web view:


    +   Hours 10 through 12 introduce you to multiple applications and their use,
    including where to find industry-standard software you can download and get free.


    +   The technical stuff is not enough, so this book also includes the advice you
    need when setting up a web site to achieve your goals.designing an effective page
    layout, posting your page to the Internet with FTP server, organizing and managing
    multiple pages, and getting your pages to appear high on the query lists at all
    the major Internet sites—are all covered in enough depth to get you beyond the
    snags that frustrate beginners.


    Attention to many of these essentials are what made the first seven editions of
    this book bestsellers, and this updated edition—the first for this title since
    2005—is no different. All of the examples have been updated and a significant
    portion of the content has been revised to match new examples and new technologies.


    # Visual Examples


    Every example in this book is illustrated in these parts:


    +   The text you type to make an HTML page is shown, with all HTML and CSS code
    highlighted.


    +   The resulting web page is shown as it will appear to users who view it with
    the world''s most popular web browsers.


    You''ll be able to adapt the example to your own pages without reading any of
    the accompanying text at all.


    All the examples in this book are standards-compliant and work with Apple Safari,
    Google Chrome, Microsoft Internet Explorer, Mozilla Firefox, and Opera. While
    all of the screenshots are taken in Firefox, rest assured that all of the code
    has been tested in all other browsers.'
