  md: '# Page Layout with Tables


    At the beginning of this Hour, I indicated that designers have used tables for
    page layout as well as to display tabular information. You will still find many
    examples of table-based layouts if you peek at another designer''s source code.
    This method of design grew out of the old (mid-1990s to early 2000s) inconsistencies
    in browser support for CSS. All browsers supported tables and in generally the
    same way, so web designers latched onto the table-based method of content creation
    to achieve the same visual display across all browsers. However, now that support
    for CSS is relatively similar across all major browsers, designers can follow
    the long-standing standards-based recommendation not to use tables for page layout.


    The World Wide Web Consortium (W3C), the standards body that oversees the future
    of the Web, promotes style sheets as the proper way to lay out pages (instead
    of using tables). Style sheets are ultimately much more powerful tables, which
    is why the bulk of this book teaches you to use styles for page layout.


    The main reasons for using tables for layout include:


    +   - Mixing Presentation with Content—One of the goals of CSS and standards-compliant
    web design is to separate the presentation from the content layer.


    +   - Creating Unnecessarily Rigid Redesigns—To change a table-based layout on
    every single page of your site (unless it is part of a complicated, dynamically-driven
    site, in case you would have to undo all the dynamic pieces and remake them).


    +   - Accessibility Issues—Screen reading software looks to tables for content,
    and will often try to read your layout table as a content piece.


    +   - Rendering on Mobile Devices—Table layouts are not flexible enough to scale
    down to small screens (see Hour 19, “Creating Fixed or Liquid Layouts”).


    These are but a few of the issues in table-based web design. For a closer look
    at some of these issues, the popular presentation “Why Tables for Layout is Stupid”
    at


    http://www.hotdesign.com/seybold/everything.html'
  merge: -1
