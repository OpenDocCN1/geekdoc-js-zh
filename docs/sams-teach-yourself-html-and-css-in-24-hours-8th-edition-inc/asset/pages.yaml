  md: '# Using Style Classes


    Before showing you a style class, I need to take a quick step back and clarify
    CSS terminology. First off, a CSS property is a specific type that can be assigned
    a value, such as color or font-size. You associate a style property and its relative
    value on a web page by using a selector. A selector is used to identify tags on
    a page to which you apply styles. Following is an example of a selector, a property,
    and a value all in a basic style rule:


    ```

    h1 { font: 36pt Courier; }

    ```


    In this code, h1 is the selector, font is the style, and 36pt Courier is the value.
    The selector is important because it means that the font setting will be applied
    to all h1 elements in the web. But you may want to differentiate between some
    of the h1 elements—what then? The answer is in style classes.


    Suppose you want two kinds of <h1> headings for your documents. You would create
    a style class for each one by putting the following CSS code in a style:


    ```

    h1.silly { font: 36pt Comic Sans; }

    h1.serious { font: 36pt Arial; }

    ```


    Notice that these selectors include a period (.), followed by a h1, followed by
    a descriptive name. To choose between two style classes, use the class attribute
    like:


    ```

    <h1 class="silly">Marvin''s Munchies Inc.</h1>

    <p>Text about Marvin''s Munchies goes here.</p>

    ```


    Or you could use this:


    ```

    <h1 class="serious">MMI Investor Information</h1>

    <p>Text for business investors goes here.</p>

    ```


    When referencing a style in HTML code, simplify the class name in the class आयु
    of element. In the previous example, the words Marvin''s Munchies Inc. would appear
    in a 36-point Comic Sans font, assuming that you included a <link /> to the style
    at the top of the web page and assuming that the user has the Comics Sans font
    installed. The MMI Investor Information would appear in the 36-point Arial font
    stand. You can also see another example of classes in action in Listing 4.2: look
    for the subheader <p> class and the footer <div> class.


    What if you want to create a style class that could be applied to any element,
    rather than just headings or some particular tag? You can asso'
