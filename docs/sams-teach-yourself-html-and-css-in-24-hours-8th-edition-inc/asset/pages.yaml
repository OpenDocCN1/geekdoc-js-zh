  md: '# The Three Types of HTML Lists


    The use of <div style="text-align:center"> ensures that the content area, including
    the two headings, are centered. However, the text alignment of the individual
    paragraphs within the <div> override the setting and ensure that the text of the
    first paragraph is left-aligned, the second paragraph is centered, and the third
    paragraph is right-aligned.


    # The Three Types of HTML Lists


    For clarity, it''s often useful to present information on a web page as a list
    of items. There are three basic types of HTML lists. All three are shown in Figure
    5.2, and Listing 5.2 reveals the HTML used to construct them:


    +   **Ordered list**—An indented list that has numbers or letters before each
    item. The ordered list begins with the <ol> tag and ends with a closing </ol>.
    List items are enclosed in the <li></li> tag pair and breaks appear automatically
    at each opening <li> tag. The entire list is indented.


    +   **Unordered list**—An indented list that has a bullet or other symbol before
    each item. The unordered list begins with the <ul> tag and closes with </ul>.
    The ordered list, its list items are enclosed in the <li></li> tag pair. A line
    break and symbol appear at each opening <li> tag and the entire list is indented.


    +   **Definition list**—A list of items and their meanings. This type of list,
    which has no number, letter, or symbol before each item, begins with <dl> and
    ends with <dt></dt> tag encloses each term and the <dd></dd> tag encloses each
    definition. Line breaks and indentations appear automatically.


    Listing 5.2 Unordered Lists, Ordered Lists, and Definition Lists


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.1//EN"

    "http://www.w3.org/TR/html1/loose.dtd">


    <html xmlns="http://www.w3.org/1999/xhtml" xml-lang="en">

    <head>

    <title>How to Be Proper</title>

    </head>


    <body>

    <h1>How to Be Proper!</h1>

    <h2>Basic Etiquette for a Gentleman Greeting a Lady Acquaintance</h2>

    <ul>

    <li>Wait for her acknowledging bow tipping your hat.</li>

    <li>Use the hand farthest from her to raise the hat.</li>

    </ul>

    </body>

    ```'
