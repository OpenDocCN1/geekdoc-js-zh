    FIGURE 20.1


    This page isn''t very print-friendly due to the form inputs and large image with
    its own display controls.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_323_0.png)


    The page shown in Figure 20.1 contains input fields, a large image that can itself
    be controlled (moved, zoomed), and other ancillary items that you come to expect
    in web content. Above the map appears a set of Actions that you can perform, one
    of which is a link to print the page. At this point, you might wonder why you
    can''t just click the Print button on your web browser. You can certainly do this,
    but command prints the page as it is shown on your screen—complete with the form
    input fields and graphical elements, when you really want to know the turns you
    need to make when driving this route.


    If you click the Print link in the body of the page, your web browser will display
    a page (see Figure 20.2) that Google has formatted specifically to be printed.'
