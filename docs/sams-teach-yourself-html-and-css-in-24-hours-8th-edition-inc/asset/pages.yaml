  md: '# Summary


    In this hour you learned how to make text appear as boldface or italic and how
    to code superscripts, subscripts, special symbols, and accented letters. You saw
    how to make the text line up properly in preformatted passages of monospaced text
    and how to control the size, color, and typeface of section of text on a web page.


    Table 6.2 summarizes the tags and attributes discussed in this hour. Remember
    that all the HTML tags are listed in Appendix B, "XHTML 1.1 and CSS 2 Quick Reference."


    Table 6.2 HTML Tags and Attributes Covered in Hour 6


    | Tag/Attribute | Function |

    | --- | --- |

