    Perhaps the most interesting of these media is the a type, which allows for web
    pages that can be read aloud or otherwise listened to. Clearly, the architects
    of CSS envision a Web with a much broader reach than we cur-rently think of as
    design pages primarily for computer screens. While you probably don''t need to
    worry too much about awful web page just yet, it serves as a good heads-up to
    what might be on the horizon.


    The good news about style sheets as other media is that they don''t require you
    to learn anything new. Okay, maybe in the case of awful web pages you''ll need
    to learn a few new tricks, but for now you can use the same properties you''ve
    already learned to create print-friendly style sheets. The trick is knowing how
    to apply a style sheet for a particular- medium.


    If you recall, the `<link />` tag is used to link an external style sheet to a
    web page. This tag supports an attribute named media that you haven''t seen. This
    attribute is used to specify the name of the media to which the style sheet applies.
    By default, this attribute is set to all, which means that an external style sheet
    will be used for all media if you don''t specify otherwise. The other acceptable
    attribute values correspond to the list of media provided in the previous list.


    Establishing a print-specific style sheet for a web page involves two `<link />`
    tags, one for printer and for each remaining media. Following is code that handles
    this:


    ```

    <link rel="stylesheet" type="text/css" href="standard.css" media="all" />

    <link rel="stylesheet" type="text/css" href="for_print.css" media="print" />

    ```


    # NOTE


    You can also use the @import command to link media-specific style sheets. For
    example, the following code works using the previous `<link />` code:

    @import url(player.css);

    @import url(player_print.css);

    print;


    In this example, style sheets are linked into a web page. The first sheet targets
    all media by setting the media attribute to all. If you need nothing else, the
    standard.css style sheet would apply to all media. However, the presence of the
    for_print.css style sheet results in the to print the page.


    You can specify media types in a single `<link />` tag by separar'
