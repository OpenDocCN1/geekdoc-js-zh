  md: '# Working with Web-Based Forms


    To this point, pretty much everything in this book has focused on getting information
    out to others. But you can also use your web pages to gather information from
    the people who read them.


    Web forms allow you to receive feedback, orders, or other information from the
    users who visit your web pages. If you''ve ever used a search engine as Google,
    Yahoo!, or Bing, you are familiar with HTML forms—those single entry forms with
    one button that, pressed, give you all the information you are looking for and
    then some. Product order forms are also an extremely popular use of forms; if
    you''ve ordered anything from Amazon.com or purchased something from an eBay seller,
    you''ve used forms. In this hour, you learn how to create your own forms, but
    learn only how to create the front-end of those forms. Working with the back-end
    of forms requires the knowledge of a programming language and is beyond the scope
    of this book.


    An HTML form is part of a web page that includes areas where users can enter information
    to be sent back to you, sent to another e-mail address that you specify, to a
    database that you manage, or sent to another system altogether as a third-party
    management system for your forms such as Salesforce.com.


    # How HTML Forms Work


    Before you learn the HTML tags that are used to make your own forms, you should
    at least conceptually understand how the information from those forms makes its
    way back to you. Actual behind-the-scenes (the server-side or back-end) process
    requires knowledge of at least one programming language or at least the ability
    to follow specific instructions when


    WHAT YOU''LL LEARN IN THIS HOUR:


    +   - How HTML forms work

    - How to create the front end of an HTML form

    - How to name pieces of data data

    - How to include hidden data in forms

    - How to choose the correct form controls for the situation

    - How to submit form data'
  merge: -1
