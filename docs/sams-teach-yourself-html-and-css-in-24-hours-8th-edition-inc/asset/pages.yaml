  md: '# HOUR 3: Understanding HTML and XHTML Connections


    provides a basic structure and set of rules to which any markup language must
    adhere. Using XML, you can create a unique markup language to describe just any
    kind of information, including web pages. Knowing that XML is a language for creating
    other markup languages, you could create your own version of HTML using XML. You
    could even create a markup language called BCC (Bottle Cap Markup Language), for
    example, which you could use to create and manage your extensive collection of
    rare bottle caps. The point is that XML lays the ground rules for organizing information
    in a consistent manner, and that information can be anything from web pages to
    bottle caps.


    You might be thinking that bottle caps don''t have anything to do with the Web,
    so why mention them? The reason is that XML is not entirely about web pages. XML
    is actually broader than the Web that it can be used to represent any kind of
    information on any kind of computer. If you visualize all the information whizzing
    around the globe among computers, mobile phones, handheld computers, televisions,
    and radios, you can start to understand why XML has much broader applications
    than just cleaning web pages. However, one of the first applications of XML is
    to restore some order to the Web, which is why XML is relevant to learning HTML.


    If XML describes data better than HTML, does it mean that XML is to upgrade HTML
    as the markup language of choice for the Web? No. XML is not a replacement for
    HTML; it''s not even a competitor of HTML. XML''s impact on HTML has nothing to
    do with cleaning HTML. HTML is a relatively unstructured language that benefits
    from the rules of XML. The natural merger of the two technologies resulted in
    HTML''s adherence to the rules and structure of XML. To accomplish this merger,
    a new version of HTML was formulated that follows the stricter rules of XML. The
    new XML-compliant version of HTML is known as XHTML. For fortunately you, you''ll
    be learning XHTML throughout this book since it is really a cleaner version of
    HTML.


    You might have heard about HTML 5, which is touted as the next web standard. It
    will be, but not for several years. standard, it will will not render HTML 5 useless—HTML
    5 is not a replacement for XHTML, it is a major revision of HTML 4. In other words,
    XHTML and HTML 5 can coexist on the web, and web browsers that support XHTML will
    also (one day) support HTML 5 as well.


    The goal of this book is to guide you through the basics of web publishing, using
    XHTML and CSS as the core languages of those pages. However, whenever possible
    I will note elements of the languages that are not present in HTML 5, should you
    want to design your content for even further'
