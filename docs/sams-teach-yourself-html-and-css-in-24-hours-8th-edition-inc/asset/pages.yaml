  md: '# Listing Your Pages with the Major Search Sites


    When the search engine processes a user query, it looks for content that contains
    the key words and phrases that the user is looking for. But it is not a simple
    match, as in “if this page contains this phrase, return it as a result,” because
    content is ranked according frequency and context of the keywords and phrases,
    as well as the number of links from other sites that lend credibility to it. This
    hour will teach you a few ways to ensure your content appears appropriately in
    the search engine, based on the content and context you provide.


    # Listing Your Pages with the Major Search Sites


    If you want users to find your pages, you absolutely must submit a request to
    each of the major search sites to index your pages. Even though search engines
    index web content automatically, this the best way to ensure your site has a presence
    on them. Each of these sites has a form for you to fill out with the URL, a brief
    description of the site, and, in some cases, a category or list of keywords with
    which your listing should be associated. These forms are easy to fill out; you
    can easily complete all of them in an hour with time left to list yourself or
    two specialized directories you might have found as well. (How do you find the
    specialized directories? Through the major search sites, of course!


    # Before You List Your Pages


    But wait! Before you rush off this to submit your listing requests, the rest of
    this hour. Otherwise, you''ll have a serious problem, and you have already lost
    your best opportunity to solve it.

    To see what I mean, imagine this scenario: You publish a page selling automatic
    cockroach flatters. I am an internet user who has a cockroach problem and I''m
    allergic to bug spray. I open my laptop, brush the roaches off the keyboard, log
    on to my favorite search site, and enter cockroach as a search term. The search
    engine presents me with a list of the first 10 out of 10654 Internet pages containing
    the word cockroach. You have submitted your listing request, so you know that
    your page is somewhere on that list.

    Did I mention that I''m rich? And did I mention that two roaches are mating on
    my foot? You even offer day-delivery in my area. Do you want your page to be number
    3 on the list, or number 8,542? Okay, now you understand the problem. Just getting
    listed in a search engine isn''t—you need to work your way up the rankings.'
  merge: -1
