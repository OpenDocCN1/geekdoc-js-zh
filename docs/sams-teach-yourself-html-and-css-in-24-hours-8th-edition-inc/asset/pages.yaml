  md: '# HOUR 22: Working with Web-Forms


    # NOTE


    PHP is the most popular server-side programming language: it''s supported by any
    web-hosting provider your choice. You can learn more about PHP at http://www.php.net/
    or you can just dive into learning this programming language (plus interactivity,
    as discussed in Hour 21) from the group in Sachs Your PHP Apache, and MySQL All-One.
    Although other books on PHP and related technologies are available, I am partial
    to this because I wrote it. I am geared towards the absolute beginners with PHP
    or any other programming language.


    using someone''s server-side script to handle the form input. At that point in
    the process, you should either work with someone who has the technical knowledge
    or learn the basics on your own. Simple form-processing is not difficult at all
    and it is likely that your web-hosting provider has several back-end scripts that
    you can use with minimal customization.


    Forms include a button for the user to submit; that button can be an image you
    create or a standard HTML button that is created when an `<input>` tag is created
    and a `type` value of `submit`. When someone clicks a form submission, all the
    information typed in the form is sent to a URL that you specify in the `action`
    attribute of the form, sending your script to process the form contents via email
    or performing another sense in an interactive process (such as in an online shopping
    cart).


    Once you start thinking about more form content than simply e-mailing results,
    additional technical knowledge is required. For example, if you want to create
    a form that accepts credit card and processes transactions, there are some well-established
    practices for doing so, all geared ensuring security of your customers'' data.
    That is not an operation that you''ll want to enter lightly; you''ll need more
    knowledge than what is provided in this book.


    # NOTE


    Technically, there is a way to send data without a server-side script, but that
    method—which usually mails a link in the `<href>` attribute—produces results.
    Individual web browsers, as well as personal security settings, will cause that
    to respond differently than you intended and certainly not as the user expects.
    When users submit a form, you expect it to use a script, perform a process that
    is invisible to them, and then return a message stating that the process has completed.
    That is not the case with a form that invokes mailto.


    Before you put a form online, you should look in the user guide for your web-hosting
    provider and see what they offer in terms of form-processing scripts. A keyword
    you might search for is `CGI` (Common Gateway Interface). CGI is a standard for
    many programs (such as form-handling scripts) to interact with web servers.


    # Creating a Form


    Every form uses a `<form>` tag, which can be located anywhere in the body of the
    HTML document. The `<form>` tag normally has two attributes, method and action:


    ```

    <form method=''post'' action=''mailto:mysite.com''>

    ```


    The most common `method` is `post`, which sends the form results as a document.
    In some situations, you might need to use `method=''get''`, which submits the
    results as part of the URL header instead. For example, `get`'
