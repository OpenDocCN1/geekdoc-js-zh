  md: '# XHTML Structure


    <body>...</body>


    | | | |

    | :--- | :--- |

    | Usage | Contains the document''s content. |

    | Start/End Tag | Optional/Optional. |

    | Attributes | core, i18n, events. |

    | Empty | No. |

    | Notes | There can be only one <body> and the <head>. If you are using frames
    (please try not to), the <body> element can be replaced by a <frameset>. |


    <div>...</div>


    | | | |

    | :--- | :--- |

    | Usage | The div element is used to add structure to a block of text. |

    | Start/End Tag | Required/Required. |

    | Attributes | core, i18n, events. |

    | Empty | No. |

    | Notes | Cannot be used within a <p> element. |


    <h1>...</h1><h6>...</h6>


    | | | |

    | :--- | :--- |

    | Usage | The six headings (h1 is uppermost, or most important) are used in the
    body to structure information in a hierarchical fashion. |

    | Start/End Tag | Required/Required. |

    | Attributes | core, i18n, events. |

    | Empty | No. |

    | Notes | Visual browsers will display the size of the headings in relation to
    their importance; <h1> is the largest and <h6> is the smallest. |


    > NOTE

    You might run across HTML pages that use the <div> element with an attribute named
    align. This attribute was removed in XHTML and HTML 5, with the new approach to
    alignment involving the text-align CSS property. This style property is covered
    later in this appendix.'
