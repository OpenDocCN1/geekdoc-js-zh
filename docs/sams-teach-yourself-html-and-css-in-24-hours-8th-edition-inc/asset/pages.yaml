  md: '# HOUR 20: Creating Print-Friendly Web Pages


    FIGURE 20.2


    The print-friendly version of the page isolates the driving instructions so that
    it can be printed by itself.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_324_0.png)


    # NOTE


    If the font of printer-specific pages is Sans-Serif, some designers recommend
    changing the font to Serif, which is considered easier to read in print. If you
    use a Sans-Serif font on your pages, it is up to you to decide whether you want
    to maintain the core look of a page when it’s printed—which means you don’t change
    the font to Serif.


    As shown in the figure, the print-friendly version of this page represents a significant
    improvement over the original, at least from the perspective of a printer. All
    the forms and images were removed.


    In the spirit of giving you a better grasp on what, specifically, as you are moving
    towards creating print-friendly pages, following is a list of changes you should
    consider at least:


    +   - Remove the background of the page, which effectively gives the printed page
    a white background.


    +   - Change text colors to black; it’s okay to have some color in the text but
    black is preferred.


    +   - Make sure that the font size is large enough that the page can be easily
    read when printed. You might have to test some different sizes.


    +   - Remove link formatting or simply revert to a basic underlined link. Some
    designers like to retain an underline so a visitor knows that a link exists in
    the original page.


    +   - Remove any and all non images. This typically includes any images that aren’t
    critical to conveying the content in the page, such as navigation buttons, most
    ads, and animated images.'
