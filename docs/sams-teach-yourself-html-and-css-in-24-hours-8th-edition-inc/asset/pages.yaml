  md: '# # HOUR 9

    # Working with Colors


    All the sample pages shown in this book far have used a standard white background
    and black text. That’s not a requirement, although some variation of dark text
    on a light background is the most common color combination you’ll find online.
    After a brief overview of some best practices in color selection, you’ll learn
    when you can use colors, how to pick colors, and how to specify colors when creating
    various elements of your web site.


    +   WHAT YOU''LL LEARN IN THIS HOUR:

    * How to choose colors for your website

    * How colors work on the Web

    * How to use hexadecimal values for color

    * How to use CSS to set background, text, and border colors


    # ## Best Practices for Choosing Colors


    I can’t tell you exactly which colors to use in your web site, but I can help
    you understand the considerations you should make when selecting colors on your
    own. The colors you use can greatly influence your visitors; if you are running
    an e-commerce site, you will want to use colors that entice your users to view
    your catalog and eventually purchase something. To that end, you will want to
    make sure colors are used judiciously and with respect. You might wonder how “respect”
    enters into the mix when talking about colors, but remember the World Wide Web
    is an international community and interpretations differ; for instance, pink is
    a very popular color in Japan, but very unpopular in Eastern European countries.
    Similarly, green is “the color of money” in the United States, but the vast majority
    of other countries have multi-colored paper bills such that “the color of money”
    isn’t a single color at all and thus the metaphor would be of no value to them.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# HOUR 9: Working with Colors


    Besides using colors that are culturally sensitive, other best practices include:


    +   - Use a natural palette of colors. This doesn’t mean you should use earth
    tones, but instead refers to using colors that one naturally see on a casual stroll
    around town—avoid ultrabright colors that can cause eye strain.


    +   - Use a small color palette. You don’t need to use 15 different colors to
    achieve your goals. In fact, if your page includes text and images in 15 different
    colors, you might reevaluate the message you’re attempting to send. Focus on three
    or four main colors with a few complementary colors, at the most.


    +   - Consider your demographics. You are likely not to control your demographics
    and have to find a middle ground that accommodates everyone. The colors enjoyed
    by younger people are not necessarily those appreciated by older people, just
    as there are color biases between men and women and people from different geographic
    regions and cultures.


    With these few tips in mind, it might seem as if your color options are limited.
    Not so—it simply means you should think about the decisions you’re making before
    you make them. A search for “color theory” in the search engine of your choice
    should give you more food for thought, as will be the use of the color wheel.


    The color wheel is a chart that shows the organization of colors in a circular
    manner. The method of display is an attempt to help you visualize the relationships
    between primary, secondary, and complementary colors. Color schemes are developed
    from working with the color wheel; understanding color schemes can help you determine
    the color palette to use consistently throughout your site. For example, knowing
    something about color relationships will hopefully allow you to avoid using orange
    text on a light background, or bright blue text on a brown background.


    Some common color schemes in web design:


    +   - Analogous—Colors that are adjacent to each other on the color wheel, such
    as yellow and green. One is the dominant color and its analog friend is used to
    enrich the display.


    +   - Complementary—Colors that are opposite from each other on the color wheel,
    such as a warm color (red) and a cool color (green).


    +   - Triadic—Three colors that are equally spaced around the color wheel. The
    triadic scheme provides balance while still allowing rich use.'
