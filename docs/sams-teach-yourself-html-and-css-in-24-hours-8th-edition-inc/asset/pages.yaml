- img_proc: true
  md: '# HOUR 16: Using CSS to Do More with Lists


    +   A definition list is often used to display terms and their meanings, thereby
    providing information hierarchy in the context of the list itself—much like the
    ordered list but without the numbering. The definition list is surrounded by &lt;dl&gt;
    and &lt;dt&gt; tags with &lt;dt&gt; and &lt;/dt&gt; tags enclosing the term and
    &lt;dd&gt; and &lt;/dd&gt; tags enclosing the definitions.


    When the content warrants it, you can nest ordered and unordered—or places within
    other lists. Nested lists produce a content hierarchy, to reserve their use for
    when content actually has a hierarchy you wish to display (such as content outlines
    or tables of content). Or, as you will learn in Hour 17, use nested lists when
    your site navigation contains sub navigational elements.


    # How the CSS Box Model Affects Lists


    Specific list-related styles include list-style-image (for placement of an image
    as a list-item marker), list-style-position (indicating where to place the list-item
    marker), and list-style-type (the type of list-item itself). While these styles
    control the structure of the list and list items, you can use margin, padding,
    color, and background-color styles to achieve more perfect displays with your
    lists.


    In Hour 14, you learned that every element has padding between the content and
    the border of the element; and there is a margin between the border of the element
    and any other content. This is true for lists, and when you are styling lists,
    you must remember that a "list" is actually made up of two elements: the list
    element type (&lt&gt; or <ol&gt;) and the individual list items. Each of these
    elements has margins and padding that can be affected by a style sheet.


    The examples in this hour show how different CSS styles affect the visual display
    of HTML lists and list items. With these basic differences in mind, you will be
    able to fully control lists and, as you will practice in Hour 17, you will be
    able to use lists to achieve advanced visual effects within site navigation.


    Listing 16.1 creates a list containing three items. In this listing, the unordered
    list itself (&lt;ul&gt;) is a blue background, a black border, and a specific
    width of 100 pixels, as shown in Figure 16.1. The list items (the individual &lt;li&gt;)
    have a grey background and a yellow border. The list item text and indicators
    (the bullet) are black.


    NOTE

    Some browsers handle margins and padding differently, especially around lists
    and items. However, at the time of writing, the HTML and CSS in this book and
    this chapter are identically in current versions of the major web browsers (Apple
    Safari, Google Chrome, Mozilla Internet Explorer, Firefox, and Opera). Of course,
    you should still review your web content before the need for "hacking" style sheets
    to accommodate the rendering idiosyncrasies of browsers is fading away.'
