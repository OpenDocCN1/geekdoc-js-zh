  md: "# Submitting Form Data\n\n349\n\n# TIP\n\nIncluding the `multiple` attribute\
    \ allows users to select more than one option at a time; the `selected` attribute\
    \ makes an option initially selected by default. When the form is submitted, the\
    \ text specified in the `value` attribute for each option accompanies the selected\
    \ option.\n\nIf you leave out the `size` attribute or specify `size=''`, the text\
    \ creates a drop-down pick list. Pick lists do not allow multiple choices; they\
    \ are logically equivalent to a radio of buttons. The following example shows\
    \ how to choose yes or no for a question:\n\n# Text Areas\n\nThe `<input type=\"\
    text\">` attribute mentioned earlier here allows the user to enter only one line\
    \ of text. When you want to allow multiple lines of text in a single input item,\
    \ use the `<textarea>` tag. Any text between these tags is displayed as the default\
    \ example:\n\n```\n<textarea name=\"comments\" rows=\"4\" cols=\"20\">Please send\
    \ more information\n</textarea>\n```\n\n```\n<select name=\"vote\">\n  <option\
    \ value=\"yes\">Yes</option>\n  <option value=\"no\">No</option>\n</select>\n\
    ```\n\nAs you guessed, `rows` and `cols` control the number of rows and columns\
    \ of text that fit in the input box. The `cols` attribute is little less than\
    \ and approximates the number of characters that fit in a row of text. Text boxes\
    \ have a scrollbar, so the user can enter more text that fits in the display.\n\
    \n# Submitting Form Data\n\nEvery form must include a button that submits the\
    \ form data to a script or the server. You can label this button with the `value`\
    \ attribute:\n\n```\n<input type=\"submit\" value=\"Place My Order Now!\" />\n\
    ```\n\nA gray border will be sized to fit the label you provide. When the user\
    \ clicks it, all data items are sent to the email address or program script specified\
    \ in the form's `action` attribute.\n\nYou can also include a Reset button that\
    \ clears all entries on the form so users can start over if they change their\
    \ minds or make mistakes.\n\n```\n<input type=\"reset\" value=\"Clear This Form\
    \ and Start Over\" />\n```\n\nThe standard Submit and Reset buttons look a little\
    \ bland to you, remember you can style them using CSS. If that's not good, you'll\
    \ be glad to know that there is an easy way to substitute your own graphics for"
