    # Steptoe Butte


    Steptoe Butte is a quartzite island rising out of the silt hills of the Pining
    Hills in Wyoming County. The rock formed 14.5 million years ago.

    Learn about how it was deposited during the era of the Plateau.

    Names for mountains or rock hills have been called but, a but being defined as
    a small hill with a flat top, which has steep sides except in the middle.

    A cattle herd built by Casper Davis stood atop Steptoe Butte from 1888 to 1908,
    burning down several years after it closed. In 1946, Virgil Cooley claimed 120
    acres (0.49 km) of land to form Steptoe Butte State Park, which was later increased
    to 150 acres (0.61 km), recognized as a Natural Landmark because of its unique
    geological value. It is named in honor of Colonel Edward Steptoe.

    Elevation: 3,612 feet (1,101 m), approximately 1,000 feet (300 m) above the surrounding
    countryside.

    Text from Wikipedia, photos by the author.


    # Displaying Additional Rollover Text with CSS


    A tooltip serves a specific purpose: to show a textual "tip" attached to a link.
    But you can use the same concept to show hidden text somewhere else in your layout,
    based on a mouse action. Take, for example, the ACME Widgets LLC main page from
    Hour 17—the version with horizontal navigation. By using the same concepts as
    used in Listing 17.1, you can show additional text above the menu when users hover
    over one of the section lines. Figure 18.3 shows one of these in action; I recaptured
    of that white space above the navigation and to the right of the logo.'
  merge: -1
