  md: '# Q&A


    I''ve heard that it''s dangerous to send credit card numbers over the Internet.
    Can''t intercept form data on its way to me?


    It is possible to intercept form data (and any web pages or messages) as it travels
    through the Internet. If you ask for credit card numbers or other sensitive information
    on your forms, you should implement secure web browsing on a secure server using
    SSL (Secure Sockets Layer) certificate. These SSL certificates are available from
    companies such as VeriSign (http://www.verisign.com/), but you should check with
    your web-hosting provider for the types of SSL certificates to install and resell.


    To the level of risk in perspective, remember that it is much difficult to intercept
    information traveling through the Internet than it is to look over someone''s
    shoulder in a restaurant or retail store. You, always utilize secure pages anytime
    you are handling sensitive financial information as credit card numbers, especially
    when someone else is trusting you to handle their sensitive information.


    Can I put forms on a CD/DVD-ROM or do you have to be on the Internet?


    You can put a form anywhere you can put a web page. If it''s on a disk or CD-ROM
    instead of a web server, it can be filled by users whether or not they are connected
    to the Internet. Of course, they must be connected to the Internet (or your local
    intranet) when they click the Submit button or the information won''t reach the
    processing script.


