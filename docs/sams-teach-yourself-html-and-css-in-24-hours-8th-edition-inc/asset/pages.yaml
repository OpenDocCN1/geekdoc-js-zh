  md: '# Summary


    In this hour, you learned the basics of preparing graphics for use on web pages.
    If nothing else, you learned that this is a very complex topic, and you learned
    enough in this hour to whe your appetite. The examples in this hour used the popular
    (and free!) GIMP software package, but feel free to use the graphics that best
    suits your needs.


    You learned how to crop, resize, and tweak image colors, and learned about the
    different file formats. There are many considerations you must keep in mind when
    including graphics in your site, including graphic size and resolution and how
    to use transparency, animated GIFs, and tiled backgrounds.


    # Q&A


    +   Instead of learning all this myself, shouldn''t I hire a graphics artist to
    design my pages?


    This is a difficult question to answer, and it''s not because I have a conflict
    of interest here—I work for a web development and design agency, so it''s in my
    best interest to recommend agencies. But an agency isn''t always the best solution.
    Hiring a graphic designer takes time and money. Additionally, there are many graphics
    artists who do not work suitable for the web—they are specifically print-based
    artists, and the print world is quite different than the online world. Also, hiring
    an individual himself graphics designer to create a web site might not play to
    the strengths of that particular graphics designer. In other words, he might be
    good at designing the graphical elements of a web site, but he might not be good
    as a content architect or working with HTML and CSS. If your site is a personal
    site, a professional design might not be where you want to spend your money. But
    if your site is intended to promote a business, a product, a school, or anything
    else whose image is integral to your success, it''s worth your (and money) to
    consult with web design professional.


    +   I''ve produced graphics for printing on paper. Are web page graphics any different?


    Yes. In fact, many of the rules for print graphics are reversed on the Web. Web
    page graphics have to be low-resolution, while print graphics should be as high-resolution
    as possible. White washes out black on computer screens, while black bleeds into
    white on paper. Also, one might stop a web page from loading when only half the
    graphics have been downloaded. Try to avoid falling into old habits if you''ve
    done a lot of print graphics design.'
  merge: -1
