  md: '# Organizing a Page with Paragraphs and Line Breaks


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_45_0.png)


    Figure 3.2


    When the HTML in Listing 3.2 is viewed as a web page, line and paragraph breaks
    only appear where there are <br> / and <p> tags.


    You must use HTML tags if you want to control line and paragraph breaks appear
    again. When text is enclosed within the <p></p> container tags, a line break will
