  md: '# HOUR 3: Understanding HTML and XHTML Connections


    # HTML Tags Every XHTML Web Page Must Have


    NOTE


    It isn''t terribly important that you understand concepts as character encoding
    at this point. It is important that you include the appropriate boilerplate-code
    in your pages so that they adhere to the web standards. As of this writing, XHTML
    1.1 is a web standard. HTML 5 is not yet a web standard, but if you were creating
    an HTML 5 document, these lines at the beginning of your HTML file would not be
    necessary.


    The time comes for the secret language of HTML tags to be revealed to you. When
    you understand this language, you will have creative powers far beyond those of
    other humans. Don''t tell the other humans, but it''s really pretty easy.


    Before you get into the HTML tags, let''s first address the messy-looking code
    at the top of Listing 3.1. The first line indicates that the HTML document is,
    in fact, an XML document:


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    ```


    The version of the XML is 1.0, which is fairly standard, as is the type of character
    encoding (UTF-8).


    The second and third lines of code in Listing 3.1 are even more complicated-looking:


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD XHTML 1.1//EN"

    "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">

    ```


    NOTE


    The XML/XHTML boilerplate code isn''t strictly required in order to create web
    pages. You can delete the opening lines of code in the example that the page starts
    with the `<html>` tag and it will still open in a web browser. The extra code
    is included to ensure your pages are up to date with the web standards. Additionally,
    the extra code allows you to validate your web pages for accuracy, which you''ll
    learn to do a bit later in this lesson.


    The specifics of this code aren''t terribly important as long as you remember
    to include the code at the start of your pages. This identifies the document as
    XHTML 1.1, which then allows browsers to make sure the code meets all the requirements
    of XHTML 1.1.


    Most HTML tags have two parts: an opening tag, which indicates where a piece of
    text begins, and a closing tag, which indicates where the piece of text ends.
    The closing tag starts with a / (forward slash) just before the symbol. Another
    type of tag is the empty tag, which is unique because it doesn''t include a pair
    of matching opening and closing tags. Instead, an empty tag consists of a single
    tag that starts with a < and ends with a / just before the symbol. Following is
    a quick summary of these three tags to make sure you understand the role each
    one plays:


    +   An opening tag is an HTML tag that indicates the start of an HTML command;
    the text affected by the command appears after the opening tag. Tags always begin
    with `<` and end with `>`, as in `<html>`.


    +   A closing tag is an HTML tag that indicates the end of an HTML command; the
    text affected by the command appears before the closing tag. Tags always begin
    with `<` and end with `>`, as in `</html>`.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# HTML Tags Every XHTML Web Page Have


    An empty tag is an HTML tag that issues an HTML command without enclosing any
    text in the page. HTML tags always begin with `<` and end with `/>`, as in `<br
    />` and `<img />`.


    # NOTE


    You do not noticed in Listing 3.1 that there is some extra code associated with
    the `<html>` tag. This code consists of two attributes (xmlns and xml:lang), which
    are used to provide specific additional information related to the page. These
    two attributes are standard requirements of all XHTML web pages; the former defines
    the HTML namespace, while the later defines the language of the content. This
    book about a standard namespace is defined, and the English used. If you are using
    a different language, replace the "en" (for English) with the language identifier
    relevant to you.


    For example, the `<body>` tag in Listing 3.1 tells the web browser where the actual
    text of the page begins, and `</body>` indicates where it ends. Everything between
    the `<body>` and `</body>` tags will appear in the main display area of the web
    browser, as shown in Figure 3.1.


    The very top of the browser that is located between `<title>` and `</title>` shows
    title text, which is any that it is used to identify the page on the browser''sBookmarks
    or Favorites menu, depending on which browser you use. It''s important to provide
    titles so that visitors to the page can properly bookmark them for future reference.


    You will use `<body>` and `<title>` pairs in every HTML page you create because
    every web page needs a title and body text. You will also use `<html>` and `<head>`,
    which are two other tags shown in Listing 3.1. Putting `<html>` at the very beginning
    of a document identifies that the document is a web page. The `</html>` at the
    ends indicates that the web page is over.


    # TIP


    You might find it convenient to create and save a bare-bones page (also known
    as a skeleton page) with just the opening and closing `<html>`, `<head>`, and
    `<body>` tags, similar to the document used in Listing 3.1. You can open that
    document as a starting point whenever you want to make a new web page and save
    yourself the trouble of typing all those obligatory tags every time.


    Within a page, there is a head section and a body section. Each section is identified
    by `<head>` and `<body>` tags. The idea is that information in the head of the
    page describes the page but isn''t actually displayed by a web browser. Information
    placed in the body, is displayed by a web browser. The `<head>` tag always appears
    near the beginning of the HTML code for a page, just after the `<html>` tag.


    The `<title>` tag used to identify the title of a page appears within the head
    of the page, which is placed after the closing `<head>` tag. (Upcoming hours reveal
    some advanced header information that can go between `<head>` and `</head>`, such
    as style sheet that are used to format the page.)


    The `<p>` tag used in Listing 3.1 encloses a paragraph of text. You should enclose
    your chunks of text in the appropriate container tags whenever possible.'
