  md: '# HOUR 8: Using External and Internal Links


    # Linking Within a Page Using Anchors


    The `<a>` tag—the tag responsible for hyperlinks on the web—got its name from
    the word "anchor," which means a link serves as a designation for a spot in a
    page. In examples shown throughout this book far, you learned how to use the `<a>`
    tag to link to somewhere else, but that''s only half of its usefulness. Let''s
    get started with anchor links that link to content within the same page.


    # Identifying Locations in a Page with Anchors


    The `<a>` tag can be used to mark a spot on a page as an anchor, allowing you
    to create a link that points to that exact spot. Listing 8.1, which is presented
    later in the month, demonstrates a link to an anchor within a page. To see such
    links are made, let''s take a quick peek ahead at the first `<a>` tag in the listing:


    ```

    <a id="top"></a>

    ```


    The `<a>` tag normally uses the `href` attribute to specify a hyperlinked target.
    The `href` is what you click and the `id` is where you go when you click there.
    In this example, the `<a>` tag specifies a target but no actual link is created.
    The `<a>` tag gives a name to a specific point on the page where the tag occurs.
    The `<a>` tag must be included and a unique name must be assigned to the `id`
    attribute, but no text between `<a>` and `</a>` is necessary.


    # Linking to Anchor Locations


    Listing 8.1 shows a site with various anchor points placed throughout a single
    page. Take a look at the last `<a>` tag in Listing 8.1 to see an example: `<a
    href="#top">Return to Index.</a>`


    The # symbol means that the word refers to a named anchor within the current document,
    rather than a separate page. When a user clicks Return to Index, the web browser
    displays the part of the page starting with the `<a id="top">` tag.'
  merge: -1
