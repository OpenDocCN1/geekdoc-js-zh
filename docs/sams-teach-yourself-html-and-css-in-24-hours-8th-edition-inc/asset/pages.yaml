  md: '# HOUR 4: Understanding Cascading Style Sheets


    # # Summary


    In this hour, you learned that a style sheet can control the appearance of many
    HTML pages at once. It can also give you extremely control over the typography,
    spacing, and positioning of HTML elements. You also learned that by adding a style
    attribute to almost any tag, you can control the style of any part of an HTML
    page without referring to a separate style document.


    You learned about three main approaches to including style sheets in your web
    site: a separate style sheet file with the extension .css that is linked in the
    <head> of your documents, a collection of style rules placed in the head of the
    document via <style>, and rules placed directly in an HTML tag via the style attribute.


    Table 4.1 summarizes the tags discussed in this hour. Refer to the CSS 2 style
    sheet standards at http://www.w3.org for details on what options can be included
    via <style> or style attributes.


    Table 4.1 HTML Tags and Attributes Covered in Hour 4

    | Tag/Attributes | Function |

    | --- | --- |

    | <style>...</style> | Allows an internal style sheet to be included within a
    document. Used between <head> and </head>. |

    | Attribute type="content" | The Internet content. (Always "text/css" for a CSS
    style sheet.) |

    | <link /> | Links to an external style sheet (or other document). Used in the
    <head> section of the document. |

    | href="url" | The address of the style sheet. |

    | type="content" | The Internet content. (Always "text/css" for a CSS style sheet.)
    |

    | rel="stylesheet" <span>.../</span> | The link type. (Always "stylesheet" for
    style sheets.) Does nothing but provides a place to put style or other attributes.
    (Using <div> does not cause a line break.) |

    | Attribute style="style" | Includes inline style specifications. (Can be used
    in <span>, <div>, <body>, and most other HTML tags.)'
