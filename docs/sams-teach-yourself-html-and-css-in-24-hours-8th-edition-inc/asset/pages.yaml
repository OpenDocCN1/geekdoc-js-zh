    By now you can begin to see how the box model will affect your design. Let''s
    say you have only 250 pixels of horizontal space but you like 10 pixels of margins,
    10 pixels of padding, and 5 pixels of border on all sides. To accommodate what
    you have to display, you must specify the width of your <div> as only 200 pixels,
    so that 200 + 10 + 5 + 5 + 10 + 10 would add up to 250 pixels of available horizontal
    space.


    Now you''ve been schooled in the use of the box model, keep it in mind throughout
    the rest of the work you do in this book and in your web design. Among other things,
    it will affect element positioning and content flow, which are the two topics
    we will tackle.'
