  md: '# HOUR 17

    Using CSS to Design Navigation


    In the previous hour, you learned how to manipulate the appearance of lists and
    how to use a list for more than just presenting a bulleted or numbered set of
    items. In this lesson, you will learn a few of the ways to use lists as vertical
    or horizontal navigation, including how to use lists to create drop-down menus.


    +   WHAT YOU''LL LEARN IN THIS HOUR

    - Navigation lists differ from regular lists

    - To create vertical navigation with CSS

    - To create horizontal navigation with CSS


    The methods explained in this hour represent a very small subset of the numerous
    and varied navigation methods you can create lists. However, the concepts are
    all similar; different results come from your creativity and application of these
    basic concepts. To help you get your creative juices flowing, I will provide pointers
    to other examples of CSS-based navigation at the end of this hour.


    # How Navigation Lists Differ from Regular Lists


    When we talk about lists to create navigation elements, we really mean using CSS
    to display content in the web site visitors expect to look—in short, different
    from bulleted or numbered lists. While it is true that a set of navigation elements
    is essentially a list of links, those links are typically displayed in a way that
    makes it clear that users should interact with the content:


    +   - The user''s mouse cursor will change to indicate that the element is clickable.

    - The area around the element changes appearance when the mouse hovers over it.

    - The content area is visually set apart from regular text.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# HOUR 17: Using CSS to Design Navigation


    Older methods of creating navigation tended to rely on images—such as graphics
    with beveled edges and the use of contrasting colors for backgrounds and text—plus
    client-side programming with JavaScript to handle image-swapping on mouse actions.
    But using pure CSS to create navigation from list elements produces a more usable,
    flexible, and search-engine friendly display that is accessible to users using
    all manner and sorts of devices.


    Regardless of the layout of your navigational elements—horizontal or vertical—this
    hour discusses two levels of navigation: primary and secondary. Primary navigation
    takes the introductory pages of sections of your site; secondary navigation reflects
    those pages within a section.


    # TRY IT YOURSELF


    In the exercise of the previous hour, you were asked to think about a navigational
    structure you might use within your own web site. If you have the information
    architecture in mind—the sections of information and, when necessary, the sub-sections—that''s
    a good start. You can use that outline throughout this hour to create vertical
    and horizontal navigation using that structure as a base.


    Create Site-Wide Navigation


    # Creating Vertical Navigation with CSS


    Depending on your site architecture—both the display template you have created
    and the manner in which you have categorized the information in the site—you might
    find yourself vertical navigation for either primary navigation or secondary navigation.


    For example, suppose you have created a web site for your company and the primary
    sections are About Us, Products, Support, and Press. Within the primary About
    Us section, you might have several other pages, such as Mission, History, Executive
    Team, and Contact Us—these other pages are the secondary navigation within the
    primary About Us section.


    Listing 17.1 sets up a secondary page with vertical navigation in the side of
    the page and content in the middle of the page. The links in the side and the
    links in the content area of the page are basic HTML list elements.


    This listing and the example shown in Figure 17.1 provides a starting point for
    showing how CSS enables you to transform two similar HTML structures into two
    different visual displays (and thus two different contexts).'
