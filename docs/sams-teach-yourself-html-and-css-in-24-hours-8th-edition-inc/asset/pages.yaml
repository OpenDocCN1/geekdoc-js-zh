    # The Scoop on HTML, XML, XHTML, and HTML 5


    In early days, HTML was great because it allowed scientists to share information
    over the Internet in an efficient and relatively structured manner. It wasn''t
    until later that graphical web browsers were created and HTML started being used
    to code more than scientific papers. HTML quickly went from a little tidy markup
    language for researchers to an online publishing language. After it was established
    that HTML could be jazzed up for graphical browsers, the creators of web browsers
    went crazy adding lots of nifty features to the language. Although these new features
    were neat at first, compromised the original design of HTML and introduced inconsistencies
    in how browsers displayed web pages; new features worked on one browser or another,
    and you were out of luck if you happened to be running the wrong browser. HTML
    started to resemble a bad remodeling job on—a job done by too many contractors
    and without proper planning. As it turns out, some of the browser features created
    during this time have now been adopted as standards while others have been dropped
    completely.


    As resolutions, the birth of the Web was very chaotic, and the modifications to
    HTML reflected that chaos. Over the years, a significant effort has been made
    to resolve the inconsistencies of HTML and restore order to the language. The
    problem with HTML is that it results in web browsers having to guess at how a
    page is to be displayed, which is not a good thing. Ideally, a web page designer
    should be able to define exactly how a page looks and have it look the same regardless
    of what kind of browser or operating system it uses. Better still, a designer
    should be able to define exactly across different browsers and platforms. This
    utopia is still off in the future somewhere, where a markup language called XML
    (Extensible Markup Language) will play a significant role in leading us toward
    it.


    XML is a general language used to create specific languages, such as HTML. It
    might sound a little strange, but it really just means that XML'
