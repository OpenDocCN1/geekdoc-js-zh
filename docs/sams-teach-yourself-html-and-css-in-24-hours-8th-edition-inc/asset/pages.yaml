    # Summary


    This chapter introduced you to some of the most fundamental properties in CSS-based
    design: margin, padding, float. You learned how the margin property controls space
    around the outside of elements and you learned how the padding property works
    with space within the elements.


    After a refresher on the text-align, vertical-align properties you learned about
    in a previous lesson, you learned about the float property. float property allows
    for specific placement of elements and addition content around those elements.


    # Q&A


    +   The examples of margins and padding all had to do with boxes and text. Can
    I apply margins and padding to images as well?


    +   Yes, you can apply margins and padding to any block-level element, such as
    a <p>, a <div>, an <img>/>, and lists such as <ul> and <ol> as well as list items
    <li>—just to name a few.'
