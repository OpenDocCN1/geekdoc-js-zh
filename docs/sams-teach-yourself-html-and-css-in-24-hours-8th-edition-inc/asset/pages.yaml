  md: '# Q&A


    How do I find out the exact name for a font I have on my computer?


    On a Windows or Macintosh computer, open the Control Panel and click the Fonts
    folder—the fonts on your system are listed (Vista users might have to switch to
    "Classic View" in your Control Panel). When specifying fonts in the font-family
    style rule, use the exact spelling of font names. Font names are not case-sensitive,
    however.


    How do I put Kanji, Arabic, Chinese, and other non-European characters on my pages?


    First of all, users who need to read these characters on your pages must have
    the appropriate language fonts installed. They must also have selected language
    character set and its associated font for their web browsers. You can use the
    Character Map program in Windows (or a similar program in other operating systems)
    to get the numerical codes for each character in any language font. To find Character
    Map, click Start, All Programs, Accessories, and then System Tools. If the character
    you want has a code of 214, use &#214; to place it on a web page. If you cannot
    find the Character Map program, use your operating system''s built-in Help function
    to find the specific location.


    The best way to include a short message in an Asian language (such as We Speak
    Tamil—Call Us!) is to include it as a graphics image. That every user will see
    it, even if they use English as their primary language for web browsing. But even
    to use a language font in a graphic, you will likely have to download a specific
    language pack for your operating system. Again, check your system''s Help function
    for specific instructions.'
