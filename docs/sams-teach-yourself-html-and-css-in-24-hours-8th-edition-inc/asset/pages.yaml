  md: "# # Placing Lists Within Lists\n\nAlthough definition lists are officially\
    \ supposed to be used for defining terms, may page authors use indent anywhere\
    \ they'd like to see some indentation. In practice, you can indent any text by\
    \ putting `<dl><dd>` at the beginning of and ending over the `</dl>` tag pair.\
    \ However a better approach to indenting text is to use the `<blockquote>` tag\
    \ pair, which indent content without the presumption of a definition and for much\
    \ clearer clearing. One set of attributes, you can set the width, height, background\
    \ color, border-type and color of your list element, and other visual effects.\n\
    \nBecause of the level of control over the display of your items that you have\
    \ when using CSS, there is no need to use nested lists to achieve the visual appearance\
    \ of indentation. Reserve your nested lists for when the content warrants. In\
    \ others, use nested lists to show a hierarchy of information, such as in Listing\
    \ 5.3.\n\nOrdered and unordered lists can be nested inside one another, down to\
    \ as many as you want. In Listing 5.3, a complex outline is constructed from several\
    \ unordered lists. You'll notice in Figure 5.3 that Firefox automatically uses\
    \ a different type of bullet for each of the three levels of indentation, making\
    \ the list very easy to read. This is common in modern browsers.\n\n# Listing\
    \ 5.3 Using Lists to Build Outlines\n\n```\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.1//EN\"\n\"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
    >\n\n<html xmlns:=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n\
    \  <title>Vertebrates</title>\n</head>\n\n<body>\n  <h1>Vertebrates</h1>\n  <ul>\n\
    \    <li><span style=\"font-weight:bold\">Fish</span>\n    <ul>\n      <li>Barramundi</li>\n\
    \      <li>Kissing Gourami</li>\n      <li>Mummichog</li>\n    </ul>\n    </li>\n\
    \    <li><span style=\"font-weight:bold\">Amphibians</span></li>\n  </ul>\n</body>\n\
    ```\n\nNesting refers to a tag that appears entirely within another tag. Tags\
    \ are also referred to as child of the (parent) tag that contains them. It is\
    \ common (but not required) coding practice to indent nested tags so that you\
    \ can easily see their relationship to the parent tag."
