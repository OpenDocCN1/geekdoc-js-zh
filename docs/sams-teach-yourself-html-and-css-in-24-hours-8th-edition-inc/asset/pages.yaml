    16.6. (The code in Listing 16.2 does not produce the red borders shown in the
    figure. The borders were added to the figure to highlight the defined areas).
    When the code is rendered in a web browser, it simply looks like a web page with
    an image placed in it. The actions happen when your mouse hovers over a “hot”
    area.


