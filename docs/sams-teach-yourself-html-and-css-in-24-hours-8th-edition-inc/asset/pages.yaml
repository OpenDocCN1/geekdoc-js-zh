  md: '# Working with Frames


    # Using Inline Frames


    Inline frames do not have the same usability issues that regular frames do, but
    inline frames are used for different reasons. Instead of being a pure layout-out
    trick, the `<iframe>` is used much like an `<object>` tag—to place a chunk of
    something within an existing document. In the case of the `<object>` tag, "something"
    is usually multimedia. You can use an `<iframe>` to embed an entirely separate
    HTML document, image, or other source. Listing 13.5 and Listing 13.6 show the
    code to produce the inline frame in source 13.4.


    # Listing 13.5 XHTML code to call an `<iframe>`


    ```

    <?xml version="1.0" encoding="UTF-8"?

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 Frameset//EN"

    "http://www.w3.org/TR/html1/xhtml1-frameset.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">

    <head>

    <title>Using an iframe</title>

    </head>

    <body style="background-color:#CCCCCC">

    <h1 style="text-align:center">Inline Frame Example</h1>

    <div style="text-align:center">

    <iframe src="src.html" style="width:50px;height:100px;border:1px solid black;background-color:#FFFFFF">

    <p>uh oh...your browser does not support iframes.</p>

    </iframe>

    </div>

    </body>

    </html>

    ```


    The only code you haven''t yet encountered in Listing 13.5 is the `<iframe>` attribute—the
    source—and you can see that it requires a value for the `src`—and that you can
    use styles to define a width, height, border type, and background color (among
    other things). Listing 13.6 shows the source of the `<iframe>`, which is a regular
    json file with some style in


