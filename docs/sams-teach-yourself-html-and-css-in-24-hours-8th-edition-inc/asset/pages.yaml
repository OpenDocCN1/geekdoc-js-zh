  md: '# HOUR 8: Using External and Internal Links


    # Linking to External Web Content


    The only difference between linking to pages within your own site and linking
    to external web content is when linking content outside your site, you need to
    include the full address to that bit of content. The full address includes the
    http:// before the domain name and then the pathname to the file (for example,
    an HTML file, file image, multimedia file, and so on).


    As you might know, you can include a link to Google within your own pages, you
    would use this type of absolute addressing in your <a> link:


    ```

    <a href="http://www.google.com/">Go to Google</a>

    ```


    You can also link in previous sections to creating links to anchors on other pages.
    Linked anchors are not limited to the same page. You can link a name to another
    anchor by paging the address or file followed by # and the anchor name. For example,
    the african.html photo inside the elephants on the domain of www.takemetethezoo.com


    ```

    <a href="http://www.takemetethezoo.com/elephants/african.html#photos">Check out
    the Elephant Photos!</a>

    ```


    If you are linking from another anchor page on the www.takemetethezoo.com domain
    (because you are in the main site), then your might link simply:


    ```

    <a href="elephants/african.html#photos">Check out the African Elephant Photos!</a>

    ```


    The http:// and the domain name would not be necessary in that instance, as you
    have already learned.


    # Linking to an Email Address


    In addition to linking between pages and parts of a single page, the <a> allows
    you to link to email addresses. This is the simplest way to enable your web page
    visitors to "talk back" to you. Of course, you could just provide visitors with
    your email address and trust them to type it whatever email programs they use,
    but that increases the likelihood for errors. By providing a clickable link to
    your email address, you can make it almost completely effortless for them to send
    you messages and eliminate the chance for typos.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Linking to an Email Address


    An HTML e mail address looks like the following:


    ```

    <a href="mailto:yourusername@yourdomain.com">Send me an email message.</a>

    ```


    The words Send me an email message will appear just like any other <a> link.


    If you want people to see your actual email address (so that they can make note
    of it or send a message using a different email program), include both in the
    nref attribute and as part of the message between the <a> and </a> tags, like
    this:


    ```

    <a href="mailto:yourusername@yourdomain.com">yourusername@yourdomain.com</a>

    ```


    In most browsers, when someone clicks the link, she gets a window into which she
    can type a message that is immediately sent to you—what-ever program the person
    uses to send and receive email automatically. You can provide some additional
    information in the link so the subject and body of the message also have default
    values. You do this by adding subject and body variables to the mailto link. You
    separate the variables from the email address with a question mark (?), then separate
    each variable and value pairs with an ampersand (&). You don''t have to understand
    the variable/value terminology at this point. Here is an example of specifying
    a subject and body for the preceding example:


    ```

    <a href="mailto:author@somedomain.com?subject=Book Question&body=When is the next
    edition coming out">author@somedomain.com</a>

    ```


    When a user clicks this link, an email message is created with author@somedomain.com
    as the recipient, Book Question as the subject of the message, and When is the
    next edition coming out? as the body.


    Before you run off and start plastering your email address all over your web pages,
    I give you a little warning and let you in with a handy trick. You''re no doubt
    familiar with spammers who build databases of email addresses and bombard them
    with junk. One way spammers "harvest" email addresses is by using programs that
    automatically search web pages for mailto links.


    Fortunately, there is a little trick that will thwart the vast majority of spam-


    > TIP


    If you want to specify only an email message subject and not the body, you can
    just leave the ampersand and the body variable, equal sign, and value text string
    as follows:


    ```

    <a href="mailto:author@somedomain.com?subject=Book Question=author@somedomain.com</a>

    ```'
