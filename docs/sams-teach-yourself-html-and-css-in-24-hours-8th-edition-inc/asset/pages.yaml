  md: '# Boldface, Italics, and Special Text Formatting


    Although using CSS allows you to apply rich formatting, there are a few other
    HTML tags that are good for adding special formatting to when you necessarily
    need to be as specific as CSS unless you wish to be. Following are some of these
    tags. Listing 6.1 and Figure 6.1 demonstrate each tag in action.


    # WARNING


    +   ▶ <small></small>—Small text


    +   ▶ <big></big>—Big text; not present in HTML 5 because text size is better
    controlled by CSS.


    +   ▶ <sup>sup</sup>—Superscript text


    +   ▶ <sub>sub</sub>—Subscript text


    +   ▶ <em>em</em>—Emphasized (italic) text


    +   ▶ <strong></strong> or <b></b>—Strong (boldface) text


    +   ▶ <tt></tt>—Monospaced text (typewriter font); not present in HTML 5 because
    font appearance is better controlled by CSS.


    +   ▶ <pre></pre>—Monospaced text, preserving spaces and lines


    There used to be a <u>u tag for creating underlined text, but there are a couple
    of reasons not to use it. First off, users expected underlined text to be a link,
    so they might get confused if you use underline text that isn''t a link. Secondly,
    the <u> tag is <em>deprecated</em>, which has been phased out of the HTML/XML
    language, as has the strike tag. Both tags are still supported in browsers and
    will be for quite a, while using CSS is the preferred approach to create strikethrough
    text. In HTML 5, deleted text can be surrounded by the <s> tag pair, which will
    render with a strikethrough.


    # 6.1 Special Formatting Tags


    ```

    <xml version="1.0" encoding="UTF-8"?>\<!DOCTYPE html PUBLIC "-////W3C//DTD XHTML
    1.1//EN"

