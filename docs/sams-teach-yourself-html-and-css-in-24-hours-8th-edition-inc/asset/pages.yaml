  md: '# Creating a Fixed/Liquid Hybrid Layout


    Since you cannot count on a user''s browser being a specific height, or that the
    content will always be the same length, you might think this poses a problem with
    the fixed/liquid hybrid layout. Not so. If you think a little outside the box,
    you can apply a few more styles that will bring all the pieces together.


    First, add the following declarations in the style sheet for the left_side, right_side,
    and content_area IDs:

    ```css

    margin-bottom: -200px;

    padding-bottom: 200px;

    ```


    These declarations add a ridiculous amount of padding and assign a ridiculously
    large margin to the bottom of all elements. You must also add position:relative
    to the footer ID in the style sheet so that it is visible despite this.


