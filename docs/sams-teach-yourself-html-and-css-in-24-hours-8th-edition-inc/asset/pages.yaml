    +   - text-align—Aligns the text to the **left**, **right**, or **center**, along
    with justifying the text with a value of *justify*.


    +   - padding—Adds padding to the left, right, and bottom of an element; this
    padding can be measured in units or a percentage of the page width. Use **padding-left**
    and **padding-right** if you want to add padding to the left and right of the
    element independently. Use **padding-top** or **padding-bottom** to add padding
    to the top or bottom of the element, as appropriate. You’ll learn more about these
    style properties in Hours 14 and 15.


    # Using Style Classes


    This is a “teach yourself” book, so you don’t have to go to a single class to
    learn how to give your pages great style, although you need to learn what a style
    class is. Whenever you want to see the text on your pages to look different from
    the other text, you can create amounts to a custom-built HTML tag. Each type of
    specially formatted text you define is called a *style class*. A *style class*
    is a custom set of formatting specifications that can be applied to any element
    in a web page.'
