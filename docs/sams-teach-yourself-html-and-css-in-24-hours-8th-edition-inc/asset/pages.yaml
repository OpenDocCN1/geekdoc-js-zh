    # Writing Maintainable HTML Code


    If you''ve ever done programming, you already know how important it is to write
    code that can be maintained—that is, you or someone else be able to read your
    code later and not be confused by it. The challenge is to make your code immediately
    understandable as possible. There will come a time when you look back on a page
    that you wrote and won''t have a clue of what you were thinking or why you wrote
    the code you did. Fortunately, there is a way to combat this problem of apparent
    memory loss!


    # NOTE


    Include comments in a JavaScript script, put // at the beginning of each comment
    line. (No closing tag is needed for JavaScript comments.) In style sheets, start
    comments with /* and end them with */.


    The HTML <— and --> tags will not work properly in scripts or style sheets


    You can say, however, include one <script> or <style> tag, with a -- tag just
    before matching</script> or </style>. This hides the script or style commands
    from older browsers that would otherwise treat them as regular text and display
    them on the page.


    # Documenting Code with Comments


    Whenever you develop an HTML page, keep in mind that you or someone will almost
    certainly need to make changes to it. Simple pages with graphics, tables, and
    other layout tricks can be difficult to decipher.


    To see what I''m talking about, visit just any page in a web browser and its source
    code. Using Internet Explorer, click the view menu and then click Source. Using
    Firefox, click the view menu and then click Source. You might see a bunch of code
    that is tough to decipher as pure HTML. This might be due to the fact that the
    markup has been generated dynamically by content management systems. Or it might
    be due to the fact that its human maintainer has not paid attention to structure,
    ease of reading, code commenting, and other methods for making the code readable
    by humans. For the sake of maintaining your own pages, I encourage you to impose
    a little more order on your HTML markup.'
