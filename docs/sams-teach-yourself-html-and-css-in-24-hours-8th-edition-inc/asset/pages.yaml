  md: '# Working with Margins, Padding,

    Alignment, and Floating


    Now that you''ve learned some of the basics of creating web content, you''ll spend
    this hour learning the nitty-gritty of CSS to enhance content. Throughout the
    previous hours, you have learned how to use basic CSS for display purposes (such
    as font sizes and colors). In the hours that follow, you''ll dive in to using
    CSS to control aspects of your entire web “page” and not just individuals of text
    or graphics.


    WHAT YOU''LL LEARN IN THIS HOUR:


    +   - How to add margins around elements

    - How to add padding within elements

    - How keep keep aligned

    - How to use the float property


    Before tackling page layout, however, it is important to understand what CSS properties
    individually before putting them all together:


    +   - The margin and padding properties—for adding space around elements.


    +   - The align and float properties—to place elements in relation to others.


    The examples provided during this hour are not the most stylish examples of web
    content ever created, but they are not intended to be. Instead, the examples clearly
    show how XHTML and CSS are working together. Once you master CSS through this
    and other hours, you''ll be able to create web-based masterpieces like the one
    shown in Figure 14.1, an example at CSS Zen Garden.


    The sites at CSS Garden probably do not look like the typical ecommerce or social
    networking sites that you visit on a regular basis. Instead, these sites showcase
    the artistic possibilities that can unfold using CSS. Make no mistake, these sites
    take careful thought and planning, but the potential designs are limitless.'
