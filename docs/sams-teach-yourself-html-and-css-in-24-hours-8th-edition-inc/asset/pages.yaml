  md: '# Workshop


    The workshop contains questions and activities to help you solidify your understanding
    of the material covered. Try to answer all questions before looking at the “Answers”
    section that follows.


    # Quiz


    +   1. Which is the best layout to use, in general: fixed, liquid, or a hybrid?

    2. Can you position a fixed layout anywhere on the page?

    3. What does min-width do?


    # Answers


    +   1. This was a trick question; there is no “best” layout. It depends on your
    content and the needs of your audience.

    2. Sure. Although most fixed layouts are flush-left or centered, you could assign
    a fixed position on any axis where you could place a <div> that contains all the
    other layout <div>s.

    3. The min-width property sets the minimum width of an element, not including
    padding, borders, or margins.


    # Exercises


    +   Figure 19.13 shows the “finished” fixed/liquid hybrid layout, but notice there
    are a few areas for improvement: there isn’t any space around the text in the
    right-side column, there aren’t any margins between the body text and either column,
    the footer is a little sparse, and so on. Take some time to fix up these elements.

    After you’ve added margin or padding as appropriate in the first exercise, spruce
    up this page with a horizontal navigation strip and fancier vertical navigation
    based on what you learned in Hour 17.'
