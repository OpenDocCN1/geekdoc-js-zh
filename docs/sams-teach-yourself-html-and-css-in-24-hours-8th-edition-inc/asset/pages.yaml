    - Pixels

    - Points


    You can mix and match units however you choose within a style sheet, it''s generally
    a good idea to be consistent with a set of similar style properties. For example,
    you might want to stick with points for font properties or pixels for dimensions.
    Following is an example of setting the width of an element

    width: 200px;


    # Formatting Properties


    CSS formatting properties are used to control the appearance of content on a web
    page, as opposed to controlling the physical positioning of the content. One of
    the most popular formatting properties is the border property, which is used to
    establish a visible boundary around an element with a box or partial border. The
    following border properties provide a means of describing the borders of an element:


    +   - border-width

    - border-color

    - border-style

    - border-left

    - border-right

    - border-top

    - border-bottom

    - border'
