  md: "# Creating the HTML for an Imageemap\n\nIf you use an imagemap generator, you\
    \ will already have the HTML necessary for creating the imagemap. However, it\
    \ is a good idea to understand the parts of the code so that you can check it\
    \ for accuracy. The following HTML code is required to start any imagemap:\n\n\
    ```\n<map name=\"mapname\">\n```\n\nKeep in mind that you can use whatever you\
    \ want for the name of the tag, also it helps if you make it as descriptive as\
    \ possible. Next, you'll need an <area /> tag for each region of the imagemap.\
    \ Following is an example of a single <area /> tag that is used in the mapping-a-map\n\
    \n```\n<area shape=\"rect\" coords=\"100,136,116,152\"\n  href=\"http://www.whitmancounty.org/\"\
    \n  alt=\"Whitman County, WA />\n```\n\nThis <area /> tag has five attributes,\
    \ which you can use with every area you describe in an imagemap:\n\n+   shape\
    \ indicates whether the region is a rectangle (shape=\"rect\"), a circle (shape=\"\
    circle\"), or an irregular polygon (shape=\"poly\")ncoords gives the exact pixel\
    \ coordinates for the region. For rectangles, the x,y coordinates of the upper-left\
    \ corner follow the x,y coordinates of the lower-right corner. For circles, give\
    \ the x,y center point followed by the radius in pixels. For polygons, list all\
    \ the corners\nh specifies the page to which the region links. You can use any\
    \ address or filename that you would use in an ordinary < href> tag.\nalalt allows\
    \ you to provide a piece of text that is associated with the shape. Most browsers\
    \ (Firefox excluded) display this text in a small box when a user hovers his mouse\
    \ over the shape. This text adds but important visual cue to users who might not\
    \ realize that they are looking at an imagemap. Firefox correctly uses the title\
    \ attribute in addition to the alt attribute to provide a visual cue, with why,\
    \ as noted previously in this hour, you should use both attributes.\n\nEach distinct\
    \ clickable region in an imagemap must be a small area, which a typical imagemap\
    \ consists of a list of areas. After coding the <area /> tags, you are done the\
    \ imagemap, so wrap things with a closing </map> tag."
  merge: -1
  pgno: 186
- img_proc: true
  md: "# Using Imagemaps\n\nThe last step in creating an imagemap is wiring it to\
    \ the actual image.\nThe map image is placed on the page using an ordinary <img\
    \ /> tag.\nHowever, there is an extra usemap attribute that is coded like this:\n\
    \n```\n<img src=\"map.png\" usemap=\"#countmap\"\nstyle=\"border:none; width:650px;\
    \ height:509px\"\nalt=\"Native Peoples Census Map\" />\n```\n\nWhen specifying\
    \ the value of the usemap attribute, use the name you put in\nid of the <map>\
    \ tag (and don't forget the # symbol). Also include the\nstyle attribute to specify\
    \ the width and height of the image and turn off\nt border around the imagemap,\
    \ which you might or might not need to\nkeep in imagemaps of your own.\n\nListing\
    \ 15 shows the complete code for a sample page containing the\nmap graphic, its\
    \ imagemap and a few mapped areas.\n\n# Listing 11. Defining the Regions of an\
    \ Imagemap with <map> and\n<area /> Tags\n\n```\n<xml version=\"1.0\" encoding=\"\
    UTF-8?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 1.0 Transitional//EN\"\n href=\"\
    http://www.w3.org/TR/html1/DTD/html-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ xml:lang=\"en\">\n<head>\n<title>Testing an Imagemap</title>\n</head>\n<body>\n\
    <h1>Testing an Imagemap</h1>\n<p style=\"text-align:center\">Click on a logo to\
    \ go to the\ncounty's web site.<br/>\n<img src=\"map.png\" usemap=\"#countmap\"\
    \nstyle=\"border:none; width:650px; height:509px\"\nalt=\"Native Peoples Census\
    \ Map\" />\n<map id=\"countmap\">\n<area shape=\"rect\" coords=\"100,136,166,152\"\
    \nhref=\"http://www.whitmancounty.com/\"\nalt=\"Whitman County, WA />\n<area shape=\"\
    rect\" coords=\"29,271,42,283\"\nhref=\"http://www.sccgov.gov/\" alt=\"Santa Clara\
    \ County, CA />\n<area shape=\"rect\" coords=\"535,216,548,228\"\nhref=\"http://visitingwhitmancounty.com/\"\
    \nalt=\"Whitman County, PA \" title=\"Whitman County, PA />\n</map>\n</body>\n\
    </html>\n```\n\n> If you're a sticker for details,\nyou might have noticed—check\n\
    out first few lines of code—nthat this web page is coded as\nan HTML 1.0 object,\
    \ as\noposed to the XHTML 1.1\nused with other examples in the book.\nThis is\
    \ done because some browsers\n(Internet Explorer, or for\nlagging in their support\
    \ of a si-\ngeHTML 1.1 change in how\nimagemaps are used. This\nchange is specific\
    \ to the\nusemap attribute, which in\nXHTML 1.1 doesn't require the\n# symbol\
    \ in front of the map.\nThe fact, the # is not allowed in XHTML 1.1. The # however,\n\
    allowed in XHTML 1.0, so to\nsatisf current web browsers\nstill provide you with\
    \ a valid\nweb page, this particular example\nuses XHTML 1.0."
