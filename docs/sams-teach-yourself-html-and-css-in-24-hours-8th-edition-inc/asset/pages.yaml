    The border-style property can be set to any of the following values:


    +   - A single-line border.

    - doubleA double-line border.

    - dashed A dashed border.

    - dotted A dotted border.

    - grooveA border with a groove appearance.

    - ridgeA border with a ridge appearance.

    - insetA border with an inset appearance.

    - outsetA border with an outset border.


    —No border.


    # NOTE


    The exception to the default border-style is none when an image is placed within
    an <a> tag so that it serves as a linked image. In that case, solid border is
    automatically set by default. That''s why you often see images with the style
    border-style:none, which turns off the automatic border.


    The default value of the border-style property is none, which is why elements
    don''t have a border unless you set the border to a different style. The most
    common border styles are the solid and double styles.


    The border-left, border-right, border-top, and border-bottom properties allow
    you to set the border for each side of an element individually. If you want a
    border to appear the same on all four sides, you can use the single border property
    itself, which expects the following styles separated by a space: border-width,
    border-style, and border-color. Following is an example using the border property
    to set a border that consists of two (double) red lines that are a total of 10
    pixels in width:

    border:5px double red;


    Whereas the color of an element''s border is set with the border-color property,
    the color of the inner region of an element is set using the color background-color
    properties. The color property sets the color of text in'
