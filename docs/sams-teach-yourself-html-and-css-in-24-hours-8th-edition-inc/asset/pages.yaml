  md: 'You will also find the use of colors within code examples and when elements
    of code appear in the explanatory text. These colors highlight the different bits
    and pieces of code to enhance your familiarity with them and to call attention
    to your use.


    +   * HTML tags are displayed in dark blue.

    * HTML comments are displayed in brown.

    * CSS elements are displayed in green.

    * HTML attribute names are displayed in light blue.

    * HTML attribute values are displayed in magenta.


    Be aware that the colors of certain terms change depending on their context. For
    instance, when CSS elements are used within the attribute of an HTML tag, they
    will be color-coded as HTML attribute values (magenta) rather than CSS elements
    (green).


    # # Special Elements


    As you complete each hour, margin notes help you immediately apply what you learned
    to your own web pages.


    | TIP | NOTE | WARNING |

