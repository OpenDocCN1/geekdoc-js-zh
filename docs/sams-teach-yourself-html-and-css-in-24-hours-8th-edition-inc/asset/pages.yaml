  md: '# HOUR 2: Publishing Web Content


    # Testing Web Content


    Whenever you transfer files to your web server or place them on removable media
    for local browsing, you should immediately test every page thoroughly. The following
    checklist will help ensure that your web content behaves the way you expected.
    Note that some of the terms might be unfamiliar to you at this point, but come
    back to this checklist as you progress through this book and create larger projects:


    +   Before you transfer your files, test them locally on your machine to ensure
    the links work and the content reflects the visual design you intended. After
    you transfer the pages to a web server or removable device, test them all again.


    +   Perform these tests as many browsers as you can—Chrome, Firefox, Internet
    Explorer, Opera, and Safari is a good list—and both Mac and Windows platforms.
    If possible, check at low resolution (800x600) and high resolution (1600x1200).


    +   Turn off image loading in your web browser before you start testing so that
    you can see what each page looks without the graphics. Check your alt tag messages
    and then turn image loading back on to load the graphics and review the page carefully
    again.


    +   Use your browser''s font size settings to look at each page in various font
    sizes to ensure that your layout doesn''t fall to pieces if users override your
    font specifications with their own.


    +   Wait for each page to completely finish loading and then scroll the way down
    to make sure that all images appear where they should.


    +   Time how long it takes each page to load. Does it take more than a few seconds
    to load? If so, is the information on that page valuable enough to keep users
    from going elsewhere before the page finishes loading? Granted, broadband connections
    are common, but that doesn''t mean you should load up your pages with 1 MB images.


    If your pages pass all tests, you can rest easy; your site is ready for public
    viewing.'
  merge: -1
