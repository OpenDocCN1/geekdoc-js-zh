  md: '# Using External and Internal Links


    So far, you have learned how to use HTML tags to create some basic web pages.
    However, at this point, these pieces of content are islands unto themselves, with
    no connection to anything else (although it is true in Hour 1 sneaked a few pages
    into the examples). To turn your work into “real” web content, you need to connect
    it to the rest of the Web–or least to your other pages within your own personal
    or corporate sites.


    This hour shows you how to create hyperlinks to contain content within your own
    document and how to link to external documents. Additionally, you will learn how
    to style hyperlinks so that they display in the color and decoration that you
    desire–not necessarily the default blue-lined display.


    # WHAT YOU''LL LEARN IN THIS HOUR:


    +   - How to use anchor links

    - How to link between pages on your site

    - How to link to external content

    - How to link to an e-mail address

    - How to use window targeting with your links

    - How to style links with CSS


    # Using Web Addresses


    The simplest way to store web content for an individual web site is to place the
    files all in the same folder together. When files are stored together like this,
    you can link to them by simply providing the name of the file in the href attribute
    of the tag.


    An attribute is an extra piece of information associated with a tag that provides
    further details about that. For example, the href attribute of the <a> identifies
    the address of the page to which you are linking.


    Once you have more than a few, or once you want to start an organization structure
    to the content within your site, you should put your files into directories (or
    “folders”), whose names reflect the content with them. For example, all your images
    could be in an “images” directory, corporate information could be in an “about”
    directory, and so on.


    NOTE


    We begin, you might need a refresher on the basics of where to put files on your
    server and how to manage files within a set of directories. This information is
    important to creating links in web content. Refer back to Hour 2, specifically
    the section entitled “Understanding Where to Place Files on the Web Server."'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# HOUR 8: Using External and Internal Links


    Regardless of how you organize your documents within your own web server, you
    can use relative addresses, which include only enough information to find one
    page from another:


    A relative address describes the path from one web page to another, instead of
    a full (absolute) Internet address.


    If you recall from Hour 2, the document root of your server is the directory designated
    as the top-level directory for your web content. In web addresses, document root
    is represented by the forward slash (/). All subsequent levels of directories
    are separated by the same type of forward slash: /directory/subdirectory/subdirectory/


    # WARNING


    / forward slash is always used to separate directories in HTML. Don''t use the
    backslash (which is normally used in Windows) to separate your directories. Remember,
    everything in web moves forward, so use forward slashes.


    Suppose you are creating a named page zoo.html in your document root and you want
    to link it to pages named african.html and asian.html in the subdirectories. The
    links would look like the following:


    ```

    <a href="elephants/african.html">Learn about African elephants.</a>

    <a href="elephants/asian.html">Learn about Asian elephants.</a>

    ```


    These specific addresses are actually relative-root in that they are addresses
    that lack the entire domain name, but they are specifically relative to the document
    root specified by the forward slash.


    Using a relative address, you can skip the initial forward slash. This type of
    address allows the links to become relative to whatever directory they are in—it
    could be the document root or it could be one directory or more levels from the
    document root:


    ```

    <a href="elephants/african.html">Learn about African elephants.</a>

    <a href="elephants/asian.html">Learn about Asian elephants.</a>

    ```


    Your african.html and asian.html documents in the subdirectories could link back
    to the main zoo.html page in either of these ways:


    ```

    <a href="http://www.yourdomain.com/zoo.html">Return to the zoo.</a>

    <a href="/zoo.html">Return to the zoo.</a>

    <a href="../zoo.html">Return to the zoo.</a>

    ```


    The first link is an absolute link. With an absolute link there is no doubt where
    the link should go, the full URL is provided domain name included.


    The second link is a relative-root link. It is relative to the domain you are'
  merge: -1
