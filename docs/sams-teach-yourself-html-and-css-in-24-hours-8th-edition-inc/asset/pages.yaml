  md: '# HOUR 2: Publishing Web Content


    Had there been no index.html page in the solutions directory, the results would
    depend on the configuration of the web server. If the server is configured to
    disallow directory browsing, the user would have seen a "Directory Listing Denied"
    message when attempting to access the URL without a specified page name. However,
    if the server is configured to allow directory browsing, the user would have seen
    a list of files in that directory.


    These server configuration options will have already been determined by you your
    hosting provider. If your hosting provider allows you to modify server settings
    via a control panel, then you can change these settings so that your server responds
    to requests based on your requirements.


    Not only is the index file used in subdirectories, it''s used in the top-level
    directory (or document root) of your web site as home page. The first page of
    your web site—home page or main page, however you may wish to refer to the web
    content users want to see when they first visit your domain—should be named index.html
    and placed in the directory root of your server. This will ensure that when users
    type http://www.yourdomain.com/ into their browsers, the server will respond with
    the content you intended to see (rather than "Directory Listingied" or some other
    unintended consequence).


    # Distributing Content without a Web Server


    Publishing HTML and multimedia files online is obviously the primary reason to
    learn HTML and create web content. However, there are situations in which other
    forms of publishing are not viable. For example you might want to distribute CD-ROMs,
    DVD-ROMs, or USB drives in a trade show with marketing materials as web content—that
    is, hyperlinked text viewable through a web browser, but without a web server
    involved. You might also want to include HTML-based instructional manuals on removable
    media for students at a training seminar. These are just two examples of how HTML
    pages can be used in publishing scenarios that don''t involve the Internet.


    This process is also called creating local sites; even though there''s no web
    server involved, these bundles of hypertext are still called sites. The local
    term comes into play since your files are accessed locally and not remotely (via
    a web server).'
