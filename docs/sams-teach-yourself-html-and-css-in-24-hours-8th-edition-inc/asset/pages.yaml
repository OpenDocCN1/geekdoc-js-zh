  md: '# HOUR 1: Understanding How the Web Works


    # Selecting a Web Hosting Provider


    Despite just telling you that you can work through all the lessons in this book
    without having a web server, we actually recommend that you work with a web server.
    Don''t worry—obtaining a hosting provider is usually a quick, painless, and relatively
    inexpensive process. In fact, you can get your own domain name and a year of web
    hosting for just more than the cost of the book you are reading now.


    If you type web hosting provider in your search engine of choice, you will get
    millions of hits and an endless list of sponsored search results (also as ads).
    There are not this many web hosting providers in the world, although it might
    seem like there are. Even if you are looking at a managed list of hosting providers,
    it can be overwhelming—especially if all you are looking for is a place to host
    a simple site for your company or organization.


    You''ll need to narrow your search when looking for a provider and choose one
    best meets your needs. Some selection criteria for a web hosting provider are


    +   - Reliability/server “uptime”—if you have an online presence, you want to
    make sure people can actually get there consistently.


    +   - Customer service—look for multiple methods for contacting customer service
    (phone, email, chat) as well as online documentation for common issues.


    +   - Server space—does the hosting package include enough server space to hold
    all the multimedia files (images, audio, video) you plan to include in your web
    site (if any)?


    +   - Bandwidth—does the hosting package include enough bandwidth so that all
    the people visiting your site and downloading files can do so without you having
    to pay extra?


    +   - Domain name purchase and management—does the package include a custom domain
    name, or must you purchase and maintain your domain name separately from your
    hosting account?


    +   - Price—do not overpay for hosting. You will see a wide range of prices offered
    and should immediately wonder “what''s the difference?” Often the difference has
    little to do with the quality of the service and everything to do with company
    overhead and what the company thinks they can get away with charging people. A
    good rule of thumb is if you are paying more than $75 per year for a basic hosting
    package and domain name, you are probably paying too much.'
  merge: -1
