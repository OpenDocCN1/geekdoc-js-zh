  md: '# # HOUR 7

    Using Tables to Display Information


    In this hour, you learn how to build HTML tables you can use to control the spacing,
    layout, and appearance of tabular data in your web content. Although you can achieve
    similar results using CSS, there are definitely times when a table is the best
    way to present information and you''ll find that tables are useful for arranging
    information into rows and columns. I will also explain how designers have used
    tables for page layout in the past, and how that isn''t always the best idea.
    Before we begin, just remember a table is simply an orderly arrangement of content
    into vertical columns and horizontal rows.


    +   WHAT YOU''LL LEARN IN THIS HOUR:

    - How to create simple tables

    - How to control the size of tables

    - How to align content and span rows within tables


    As you read this hour, think about arranging text into tables could benefit your
    web content. The following are some specific ideas to keep in mind:


    +   - The most obvious application of tables is to organize tabular information,
    such as a multicolumn list of names and numbers.

    - Whenever you need multiple columns of text or images, tables are the answer.


    On your own, try adding a table modeled after the examples in this hour. The “Exercises”
    section at the end of this hour offers a couple of detailed suggestions along
    these lines as well.


    # TRY IT YOURSELF ▼

    Putting Content into Tables'
