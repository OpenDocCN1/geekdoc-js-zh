  md: '# Summary


    In this hour, you learned how mouse actions can affect the display of text. In
    the first two sections, these actions were based on styles associated with the
    hover pseudoclass of <a> tag, while later in the hour you introduced to actions
    associated with specific user interaction events. The specific event in the example
    was the `onclick` event, but you also saw a list of other possible events, such
    as `onload` and `onmouseover` to name a few.


    The only new code introduced in the code itself was the use of the cursor property.
    Assigning a `cursor` property of `pointer` allowed you to indicate to users that
    particular text tags as an link even though it was not enclosed in `<a></a>.


    # Q&A


    +   Some of the events covered in this hour sound a like the pseudo-classes for
    <a> tag. What''s the difference?


    +   It is true that the onmousedown event is like the active state and onmouseup
    and onmouseover are much like the hover state. There isn''t a specific rule about
    when to use events instead of using the pseudclasses, but it stands to reason
    that if you have no other reason to use an <a> tag, you shouldn''t just use the
    pseudoclasses.


    +   Can you capture mouse or keyboard events on elements other than text, such
    as images?


    +   Yes, these types of events can be applied to actions related to clicking on
    rolling over images as well as text. However, other multimedia objects, such as
    embedded YouTube videos or Flash files, are not interacted with the same way,
    as those objects are played via additional software for which other mouse or keyboard
    actions are applicable. Instance, if you click on a YouTube video that is embedded
    in your web page, you are interacting with the YouTube player and no longer your
    actual web page—that action cannot be captured in the same way.'
  merge: -1
