  md: '# # APPENDIX B

    # XHTML 1.1 and CSS 2

    # Quick Reference


    XHTML 1.1 represents a modern reformulation of HTML as an XML application, allowing
    extensions to the language to be more easily defined and implemented. This appendix
    provides a quick reference to the elements and attributes of XHTML 1.1 that are
    most likely to see and use, as well as the style properties that CSS 2 comprises.
    For the complete specifications, visit http://www.w3.org/.


    To make the information readily accessible, this appendix organizes HTML elements
    by their function in the following order:


    +   - Structure

    - Text formatting elements

    - Lists

    - Links

    - Tables

    - Embedded content

    - Style

    - Forms

    - Scripts


    The elements are listed alphabetically within each section, and the following
    information is presented:


    +   - Usage–Gives a general description of the element.

    - Start/End Tag-Indicates whether these tags are required, optional, or illegal.'
  merge: -1
  pgno: 401
- img_proc: true
  md: "Attributes-Lists the attributes of the element with a short description\nof\
    \ their effect. Any attributes that are used for mouse control or\ninvoke client-side\
    \ scripting are not indicated here; please see the full\nspecification at the\
    \ W3C web site for those action-oriented attributes.\n\nEmpty-Indicates whether\
    \ the element can be empty.\n\nNotes-Relates any special considerations for using\
    \ the element.\n\nNOTE\n\nXHTML 1.1 includes several\nfundamental attributes that\n\
    apply to a significant number of\nelements. These are referred to\nwithin each\
    \ element listing as\ncore, i18n, and events. These\nattribute groups are covered\
    \ in\ndetail after all the XHTML ele-\\ments are presented. There\nYou'll find\
