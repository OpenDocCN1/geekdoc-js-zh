  md: '# HOUR 9: Working with Colors


    or high-color computer displays are all standard these days, and they show all
    colors with equal clarity. If your graphics program can provide color values to
    you in hexadecimal format, feel free to plug that value straight into your style
    sheet to display custom color schemes.


    # Workshop


    The workshop contains quiz questions and activities to help you solidify your
    understanding of the material covered. Try to answer all questions before looking
    at "Answers" section that follows.


    # Quiz


    +   1. How would you give a web page a black background and make all text bright?
    Would you want to


    +   2. When selecting a color scheme for your web site, which of the following
    types of color relationships would give you more color options: analogous, complementary,
    or triadic?


    +   3. If you specify background-color #FFFFFF for the body element in your style
    sheet, then use background-color #FF0000 for the first <div> that you use on your
    page, will the background of that <div> be red or white?


    # Answers


    +   1. Put the following at the beginning of the web page or use a style for the
    body element:


    ```

    <body style="background-color:#000000; color:#00FF00">

    ```


    +   2. Triadic. It refers to three colors evenly spaced around the color wheel.


    +   3. The background of your <div> will be red, because the background-color
    specification of a container element will override the specification in the <body>
    tag body entry in the style sheet.'
