  md: '# # HOUR 13

    Working with Frames


    You might have visited web sites in which the browser window seemingly allowed
    you to move between several different pages. The truth is that the browser was
    allowing you to view several pages at once by separating the browser window into
    regions that contain separate pages; each region is known as a frame. Of course,
    from the user''s perspective, everything comes together to form a single window
    of web content, but there are separate pages at work.


    WHAT YOU''LL LEARN IN THIS HOUR:


    +   * How to build a frameset

    * How to link between frames and windows

    * How to use inline frames


    # ## What Are Frames?


    A frame is a rectangular region within the browser window that displays a web
    page alongside other pages in other frames. At first glance, Figure 13.1 might
    look like an ordinary web page, but it is actually two separate HTML pages, displayed
    in the same browser window. Each page is displayed in its own frame, arranged
    horizontally and separated by the horizontal bar.


    FIGURE 13.1

    Frames allow more than one web page to be displayed at once.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_207_0.png)'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'If frames are used, typically they are used to create a framed site that takes
    advantage of a static set of navigational links; you can see these links in the
    top frame of Figure 13.1. When one of the links in this example is clicked, the
    frame will not change; a new page will be loaded and displayed in the bottom frame
    (see Figure 13.2).


    FIGURE 13.2

    Clicking Products brings up a new bottom page but leaves the top frame the same.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_208_0.png)


    You should be aware that frames have long been a vexed issue in web design. The
    advantages have never really outweighed the disadvantages, yet due to differences
    in browser support for HTML and CSS standards, frames were seen as a way to achieve
    goals despite their shortcomings. As a web developer, I do not recommend the use
    of frames for the following reasons:


    +   - Frames go against the fundamental concept of the Web, which is the hypertext
    connection between individual instances of web content that can be accessed via
    a single web address (URL).


    +   - Printing parts of a framed site are very difficult; unless you have clicked
