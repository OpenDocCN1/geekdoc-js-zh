  md: '# HOUR 11: Using Images in Your Website


    # Placing Images on a Web Page


    It doesn''t matter to the web server, web browser, or end user just you put your
    images, as long as you are there and as long as you use the correct paths in your
    HTML code.


    Insert the following HTML tag at the point in the text where you want the image
    to appear. Use the name of your image instead of myimage.gif:


    ```

    <img src="myimage.gif" alt="My Image" />

    ```


    If your image file were in the directory below the document root, you would use:


    ```

    <img src="images/image.gif" alt="My Image" />

    ```


    The src and the alt attributes of the <img /> are required in XHTML web pages.
    The src identifies the image file and the alt attribute allows you to provide
    descriptive text about the image, the latter of which is intended to serve as
    an alternative to the image that a user is unable to view the image. You''ll read
    more about the alt attribute, in "Describing Images with Text."


    As an example of how the <img /> tag, Listing 11 inserts an image at the top of
    the page, before a paragraph of text. When a browser displays the file in HTML
    11, it automatically retrieves and displays the image file as shown in Figure
    11.


    # Listing 11 Using the <img /> Tag to Place Images on a Web Page


    ```

    <xml version="1.0" encoding="UTF-8"?>

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.1//EN"

    "http://www.w3.org/TR/html1/DTD/xhtml.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">

    <head>

    <title>A Spectacular Yosemite View</title>

    </head>

    <body>

    <h1>A Spectacular Yosemite View</h1>

    <p><img src="hd.jpg" alt="Half Dome" /></p>

    <p><strong>Half Dome</strong> is a granite dome in Yosemite National Park, located
    in northeastern Mariposa County, California, at the end of Yosemite Valley. The
    granite crest rises more than 4,737 meters above the valley floor.</p>

    <p>This particular view of Half Dome is seen from Washburn Point.</p>

    </body>

    </html>

    ```'
  merge: -1
