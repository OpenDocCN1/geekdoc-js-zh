    # Linking Between Your Own Web Content


    As you learned earlier in this hour, you do not need to include http:// before
    each address specified in the href attribute when linking to content within your
    domain (or the same computer, if you are viewing your site locally). When you
    create a link from one file to another within the same domain or on the same computer,
    you don''t need to specify a complete Internet address. In, if the two files are
    stored in the same folder, you can simply use the name of the HTML file by itself:


    ```

    <a href="pagetwo.html">Go to Page 2.</a>

    ```


    As an example, Listing 8.2 and Figure 8.3 show a quiz page with a link to the
    answers page shown in Listing 8.3 and Figure 8.4. The answers page contains a
    link back to the quiz page. Because the page in Listing 8.2 links to another page
    in the same directory, the filename can be used in place of a complete address.'
