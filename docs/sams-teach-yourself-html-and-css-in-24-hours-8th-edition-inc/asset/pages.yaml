  md: '# HOUR 2

    Publishing Web Content


    In the previous hour, you learned about the process of requesting web content
    via a web browser and how the web server responds to those requests.

    In this hour you''ll learn where you, as the content creator, fit into making
    web content available online—you have to publish that content on a web server
    in order for other people to find it.


    # WHAT YOU''LL LEARN INnTHIS HOUR:


    +   - How to create a basic HTML file using a text editor

    - How to transfer files to your server using FTP

    - Where files should be placed on a web server

    - How to distribute web content without a web server

    - How to use other methods such as blogs


    # Creating the Sample File for this Hour


    Before we begin, take a look at Listing 2.1. This listing represents a simple
    piece of web content—a few lines of HTML that print “Hello World!"

    Welcome to My Web Server.” in large, bold letters on two lines centered within
    the browser window.


    Listing 2.1 Our Sample HTML File


    ```

    <html>

    <head>

    <title>Hello World!</title>

    </head>

    <body>

    <h1 align="center">Hello World!</h1><br>Welcome to My Web Server.</h1>

    </body>

    </html>

    ```


    # NOTE


    To make use of this content, open a text editor of your choice, such as Notepad
    (on Windows) or TextEdit (on a Mac). Do not use WordPad, Microsoft Word, or other
    full-featured word-processing software, as those create different sorts of files
    from the plain-text files we use for web content.


    You will learn more about text editors in Hour 3. Right now, we just want you
    to have a sample file that you can put on a web server!'
  merge: -1
