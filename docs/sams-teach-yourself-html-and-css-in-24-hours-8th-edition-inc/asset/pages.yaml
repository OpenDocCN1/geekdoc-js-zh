  md: '# Summary


    You began this hour by creating a very simple HTML file to use as a test file
    for the process of transferring files to your web server. You learned how file
    transfer process works and what type of software you need to perform those transfers
    (an FTP client). You learned a little about web server directory structures and
    file management, as well as the very important purpose of the index.html file
    in a web server directory. You also learned that you can distribute web content
    on removable media, and you learned how to go about structuring the files and
    directories to achieve the goal of viewing content without a remote web server.
    Finally, you learned how to test your files before releasing your site for public
    consumption.


    # Q&A


    +   All the tests you recommend would take longer than creating my pages! Can''t
    I get away with less testing?


    +   If your pages aren''t intended to make money or provide an important service,
    it''s probably not a big deal if they look funny to some users or produce errors
    once in a while. In that case, just test each page with a couple of different
    browsers and call it a day. However, if you need to project a professional image,
    there is no substitute for rigorous testing.


    +   Seriously, who cares I organize my web content?


    +   Believe it or not, the organization of your web content does matter to search
    engines and potential visitors to your site—you''ll learn more about this in Hour
    24, "Helping People Find Your Web Pages." But overall, having an organized web
    server directory structure will help you keep track of content that you are likely
    to update frequently. Instance, if you have a dedicated directory for images or
    multimedia, you will know exactly to look for a file you wish to update—no need
    to hunt through directories containing other content.'
