  md: '# Summary


    In this hour, you learned a few best practices for thinking about color use, and
    how to use the color wheel to help you find colors that will complement your text.
    Additionally, you learned about hexadecimal notion for colors—that all colors
    are expressed in notations related to the amount of red, green, and blue in them—and
    how hexadecimal notation allows you to apply nuanced colors to your elements.
    More importantly, you learned about the color-related style properties that can
    be used to apply color to container backgrounds, borders, and text using CSS.


    Table 9.1 summarizes these properties.


    | Attribute/Style | Function |

    | --- | --- |

    | style="background-color:color" | Sets the background color of an element (such
    as `<body>`, `<p>`, `<div>`, `<blockquote>`, and other containers). |

    | style="color:color" | Sets the color of text within an element. |

    | style="border:size type color " | Sets the color of the four borders around
    an element. Border colors cannot be used without also specifying the width and
    type of the border. |",


    # Q&A


    +   Don''t web browsers let people choose their own background and text colors?


    +   Yes, web browsers allow users to override the colors that you, as a web page
    author, specify. Some might see your white-on-blue page as greenish-on-white or
    their own colors instead, but very few people actually use this option. The colors
    specified in the `<body>` tag will usually be seen.


    +   I''ve heard that there are 231 "browser-safe colors" that I can use on web
    pages and that I shouldn''t use any other colors. Is that true?


    +   Here''s the real story: There are 231 colors that will appear less "fuzzy"
    to users who operate their computers in a 256-color (8-bit) video mode. Some web
    page authors try to stick to those colors. However, true-color'
  merge: -1
