  md: '# Turning Images into Links


    Try adding images to your web pages now and experiment with different values of
    text-align, vertical-align, and float. To get you started, here''s a quick review
    of how to add a hypothetical fish image (fish.jpg) to any page.


    # TRY IT YOURSELF

    Experiment with Image Alignment


    +   1. Copy the fish.jpg image to the same directory as the HTML file (or leave
    it in its current location and make sure you remember where it is located).


    +   2. With a text editor, choose where you want the image to appear in the text
    and add <img src="fish.jpg" alt="Bright Goldfish with Bulging Edges />to location.


    +   3. If you want the image to be centered, put <div style="text-align:center">
    and </div> around it. To wrap text around the image, add style="float:right" or
    style="float:left" to the <img /> tag. Finally, use the vertical-align style property
    directly within the <img /> tag to control the vertical alignment of the image
    with respect to the images and text next to it.


    +   4. If you have time for a little more experimentation, try combining multiple
    images of various sizes using vertical alignment settings.


    # Turning Images into Links


    You probably noticed in Figure 11.1 that the image is quite large, which is fine
    in this particular example but isn''t ideal when you''re trying to present multiple
    images. It makes more sense in this case to create smaller image thumbnails that
    link to larger versions of each image. Then you can arrange the thumbnails on
    the page so that visitors can easily see all the content, even if they see only
    a smaller version of the actual (larger) image. Thumbnails are one of the many
    ways you can use image links to spice up your pages.


    To turn any image into a clickable link to another page or image, you can use
    the <a href> tag that you previously used for text links . Listing 11.4 contains
    the code for a modification of Listing 11.2—which already used thumbnails—to provide
    larger versions of the images. To ensure the user knows to click the thumbnails,
    the image and some helper text is enclosed in a <div>, as shown in Figure 11.5.'
  merge: -1
