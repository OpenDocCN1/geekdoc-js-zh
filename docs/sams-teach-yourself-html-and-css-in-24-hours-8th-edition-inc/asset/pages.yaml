  md: '# # HOUR 12

    Using Multimedia in Your Web Site


    The term multimedia encompasses everything we see and hear on a web page: audio,
    video, and animation, as well as static images and text. In previous hours, you
    learned how to use images and text, so in this hour, you''ll learn about the other
    types of multimedia in your web sites. You won''t learn how to create any particular
    audio, video, or animation, but you will learn how to include such files in your
    site, through either linking or embedding the content.


    Before even thinking about including multimedia in your site, remember that not
    every user has devices that play your media type, nor do all users have broadband
    Internet connections which allow these large files to transfer quickly. Always
    warn your visitors that the links they click can take them to multimedia files,
    and offer them the choice to view or listen to the content—don''t force the files
    upon them.


    # WHAT YOU''LL LEARN IN THIS HOUR:


    +   - How to link to multimedia files

    - How to embed multimedia files

    - Additional tips for using multimedia


    Before you learn how to place multimedia on your web pages, you need to have some
    multimedia content to start with.


    Creating multimedia of any kind can be a challenging and complicated task. If
    you''re planning to create your own content from scratch, you''ll need far more
    than this book to become the crackacker multimedia developer. After you have some
    content, however, this hour will show you how to place your new creations into
