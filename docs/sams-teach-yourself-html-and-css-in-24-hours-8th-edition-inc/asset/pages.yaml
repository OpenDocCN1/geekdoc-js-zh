  md: '# Summary


    The <a> tag is what makes hypertext “hyper.” With it, you can create links between
    pages as well as links to specific anchor points on any page. This hour focused
    on creating and styling simple links to other pages using either relative or absolute
    addressing to identify the pages.


    You learned when you''re creating links to other people''s pages, it''s important
    to include the full Internet address of each page in an <a href tag. For links
    between your own pages, include just the filenames and enough directory information
    to get from one page to another.


    You also learned how to create anchor points within a page and how to link to
    your email address so that users can easily send your messages. You learned how
    to protect your email address from spammers. Finally, you learned for controlling
    the display of your links using CSS.


    Table 8.1 summarizes the <a> tag discussed in this hour.


    Table 8.1 HTML Tags and Attributes Covered in Hour 8

    | Tag/Attribute | Function |

    | <a>...</a> | With the href attribute, creates a link to another document or
    anchor; with the id attribute, creates an anchor that can be linked. |

    | Attributes | The address of the document or anchor point to link to.

    id="name" | The name for this anchor point in the document. |


    # Q&A


    +   - What happens if I link to a page on the Internet and the person who owns
    that page deletes or moves it?


    +   - That depends on how the maintainer of external page has set up his web server.
    Usually, you will see a page not found message or something to that effect when
    you click a link that has been moved or deleted. You can still click the Back
    button to return to your page. As a site maintainer, you can periodically run
    link-checking programs to ensure your internal and external links are valid. An
    example of this is the Link Checker service at http://validator.w3.org/checklink.'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'One of the internal links on my web site works fine on my computer, but when
    I put the pages on the Internet, the link doesn''t work any-more. What''s up?


    These are the most likely culprits:


    +   - Capitalization problems. On windows, linking to a file named MyFile.html
    with `<a href="myfile.html">` will work. On most web servers, the link must be
    a `<a href="MyFile.html">` (or you must change the name of the file to MyFile.html).
    To make matters, some text editors and file transfer actually change the capitalization
    without telling you! The best solution is to stick with lowercase filenames for
    web pages.


    +   - Spaces in filenames. Most web servers don''t allow filenames with spaces.
    For example, you should never name a web page page.html. Instead, name it mypage.html
    or even my_page.html (using an underscore instead of a space).


    +   - Absolute addresses. If, for some reason, you link to a file using a local
    absolute address, such as C:\website\news.html, the link won''t work when you
    place the file on the Internet. You should never use absolute addresses; when
    this occurs, it is an accident caused by a temporary link that was created to
    test part of a page. So, be careful to remove any links before publishing a page
    on the Web.


    Can I put `href` and `id` in the same `<a>` tag? I would want to any reason?


    You can, and it might save some typing if you have a anchor point and a link right
    next to each other. It''s better however, to use `<a href="...">` and `<a id>`
    separately to avoid confusion because they may play different roles in an HTML
    document.


    What happens if I accidentally misspell the name of an anchor or for-get to put
    the # in front of it?


    If you link to an anchor name that doesn''t exist within a page or mis-spell the
    anchor name, the link goes to the top of that page.


    # # Workshop


    The workshop contains questions and exercises to help solidify your understanding
    of the material covered. Try to answer all questions before looking at the “Answers”
    section that follows.'
