  md: '# HOUR 23: Organizing and Managing a Web Site


    In both examples, you see navigation elements at the top of the page (including
    some sub-navigation elements), a large area in the middle of the page for the
    featured item graphic, a rectangle on the right side containing links to top stories
    at the moment, and a second rectangle under the top stories for the display of
    an advertisement. The only difference between the MLB section and the NFL section
    is the color scheme: the MLB section is part of a predominantly blue color scheme;
    however, in both sections, you know that if you want to read the popular news
    stories, you look to the right of the page. If you want to navigate to another
    section in the site or the site''s main page, you look to a navigational element
    in the top left of the page.


    These consistent elements ensure you will be able to navigate throughout your
    content with confidence. From a maintenance perspective, the consistent structural
    template enables you to reuse pieces of the code. This code reuse typically happens
    through dynamic programming outside the scope of this book, but in general it
    means instead of copying and pasting the same HTML over and over, the HTML only
    exists in one place and is applied mechanically to the content. Therefore, instead
    of making changes to thousands of files, you would only need to make a change
    once.


    # Organizing a Larger Site


    For complex sites, sophisticated layout and graphics can help organize and improve
    the looks of your site when used consistently all out of your pages. To see how
    you can make aesthetics and organization work hand-in-hand, let''s look at examples
    of navigation (and thus underlying organization) for a few sites that present
    a large volume of information to several different audiences.


    Figure 23.6 shows the main page of Amazon.com, specifically with the side navigation
    selected. Amazon is in the business of selling products, plain and simple. Therefore,
    it makes sense for Amazon to show product categories as the main navigational
    elements, as shown in this figure.'
