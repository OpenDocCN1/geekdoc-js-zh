    The large number of lines between the first set of `&lt;script&gt;/&lt;/script&gt;`
    tags is creating a function called `quote()`. Once a function is defined, it can
    be called in other places in the same page. Note that if the function exists in
    an external file, the function could be called from all of your pages.


    If you look closely at the code you will see some lines like this:


    ```

    // Create the arrays

    ```


    and


    ```

    // Initialize the arrays with quotes

    ```


    These are comments. The developer uses these comments to leave notes in the code
    so that anyone reading it has an idea of what the code is doing in that particular
    place. After the first comment about creating the arrays, you can see that two
    arrays are created—one called quotes and one sources—each containing four elements:


    ```

    quotes = new Array(4);

    sources = new Array(4);

    ```


    After the second comment (about initializing the arrays with quotes), four items
    are added to the arrays. We''ll look closely at one of them, the first quote by
    Mark Twain:


    ```

    quotes[0] = "When I was a boy of 14, my father was so " + "ignorant...but when
    I got to be 21, I was astonished at " + "how much he had learned in 7 years."

    sources[0] = "Mark Twain";

    ```


    You already know that the arrays are named quotes and sources. But the variable
    to which values are assigned (in this instance) are called quotes[0] and sources[0].
    Because quotes and sources are arrays, the items in the array will each have their
    own position. When using arrays, the first item in the array is not in slot #1,
    it is in slot #0. In other words, you begin counting at 0 instead of 1. Therefore,
    the text of the first quote (a value) is assigned to quotes[0] (a variable). Similarly,
    the text of the first source is assigned to source[0].'
