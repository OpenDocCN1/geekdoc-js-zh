  md: '# HOUR 18: Using Mouse Actions to Modify Text Display


    The next four entries are for specific IDs, and those IDs are all set to be invisible
    (display: none) when the page initially loads. The two IDs that follow are set
    to display as block elements when the page initially loads. Again, strictly speaking,
    these two would not have to be defined because it is the default display. The
    style sheet includes these entries for the purpose of illustrating the differences.
    If you count the number of div elements in Listing 18.1, you will find in the
    code: four invisible and two that are visible upon page load.


    The goal in this example is to change the value of two IDs when another ID is
    clicked. But first you have to make sure users realize a piece of text is clickable,
    and that typically when users use their mouse pointers to reflect a link is present.
    Note in Figure 18.4 the mouse pointer changes to a hand with a finger pointing
    at a particular link.


    This functionality is achieved by defining a class for this particular text; the
    class called fakelink, as you can see in this snippet of:


    ```

    <div class="fakelink"

    onclick="this.style.display=''none'';ndocument.getElementById(''hide_e'').style.display=''block'';ndocument.getElementById(''elevation'').style.display=''inline'';

    >; Show Elevation;</div>

    ```


    The fakelink class ensures that the text is rendered as non-underlined, bold,
    and red; cursor: pointer causes the mouse pointer to change in such a way that
    users think the text is a link of the type that would normally be enclosed in
    an <a> tag. But the really interesting happens when we associate an onclick attribute
    with a <div>. In the example snippet, the value of onclick is a series of commands
    that change the current value of CSS elements.


    Let''s look them separately:


    ```

    this.style.display=''none'';ndocument.getElementById(''hide_e'').style.display=''block'';ndocument.getElementById(''elevation'').style.display=''inline'';

    ```


    What you are looking at are different JavaScript methods to change particular
    elements. You will learn a little more about JavaScript in Hour 21. In general,
    JavaScript is well beyond the scope of this book, but I think you can follow along
    with what is happening here.'
