  md: '# HOUR 9: Working with Colors


    You should be aware that all computer monitors display colors in the same hues.
    What might appear as a beautiful light blue background color on your monitor might
    be more of a purple hue on another user''s monitor. Neutral, earth-tone colors
    (such as medium gray, tan, and ivory) can produce even unpredictable results on
    many computer monitors. These colors might even seem to change color on one monitor
    depending on lighting conditions in the room or the time of day.


    In addition to changing the background of your pages to a color other than white,
    you can change the color of text links, including various properties of links
    (such as the color for when a user hovers over a link versus the user clicks a
    link—as you learned in the previous hours). You can also set the background of
    container elements (such as paragraphs, divs, blockquotes, and table cells) and
    you can use colors to specify the borders around them. You''ll see some examples
    of colors and container elements later in this hour.


    There are plenty of very bad websites, some created by earnest people with no
