    Each <input /> tag corresponds to a specific user input component, such as a check
    box or radio button. The input, select, and text area contain borders in the style
    sheet, so it is easy to see the outline of the elements in the form. Keep in mind
    that you can apply any sorts of CSS to those elements.


    The next few sections dig into the <input /> and other form-related tags in detail.


    # Accepting Text Input


    To ask the user for a specific piece of information within a form, use the <input
    /> tag. This tag must fall between the <form> and </form> tags, but it can be
    anywhere on the page in relation to text, images, and other HTML tags. For example,
    for someone''s name, you could type the following:


    ```

    What''s your name? <input type=''text'' size=''50'' maxLength=''100'' name=''name''
    />

    ```'
