    \ the position of an element is specified as an off-relative to the original position\
    \ of the element. If you set the left property of an element to 25px, the left\
    \ side of the element will shifted over 25 pixels from its original (relative)\
    \ position. An absolute position, on the other hand, is relative to the element\
