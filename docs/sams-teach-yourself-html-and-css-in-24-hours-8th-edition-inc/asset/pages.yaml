    As shown in these examples, margin specifications are incredibly useful for element
    placement but you must use caution when setting these specifications.


    # Padding Elements


    Padding is similar to margins in that it adds extra space to elements, but the
    big difference is where that space is located. If you recall, margins are'
  merge: -1
