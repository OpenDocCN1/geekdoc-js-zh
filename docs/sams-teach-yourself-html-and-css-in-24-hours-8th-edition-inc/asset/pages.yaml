  md: "# Embedding Multimedia Files\n\nA MIME type is an identifier for uniquely identifying\
    \ different types of media objects on the Internet. MIME stands for Multipurpose\
    \ Internet Mail Extensions, and this name comes from the fact that MIME types\
    \ were originally used to identify email attachments. These MIME types should\
    \ be used in the type `<object>` tag to identify what kind of multi-media object\
    \ is being referenced in the data attribute.\n\nFollowing are the MIME for several\
    \ popular sound and video formats you might want to use in your pages:\n\n+  \
    \ - WAV Audio—audio/x-wav\n- AU Audio—audio/basic\n- MP3 Audio—audio/mpeg\n- MIDI\
    \ Audio—audio/midi\n- WMA Audio—audio/x-ms-wm\n- RealAudio—audio/x-pn-realaudio.plugin\n\
    - AVI—video/x-msvideo\n- WMV—video/x-ms-wmv\n- MPEG Video—video/mpeg\n- QuickTime—video/quicktime\n\
    \nListing 12.2 shows the relevant code for the pond web page, where you can see\
    \ the `<object>` tag as it appears in context.\n\n# Listing 12.2 Using an <object>\
    \ Tag to Directly Embed a WMV Video Clip\n\n```\n<xml version=\"1.0\" encoding=\"\
    UTF-8?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 1.1//EN\" \n\"http://www.w3.org/TR/html11/DTD/html11.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n  <title>Fun\
    \ in the Pond</title>\n</head>\n<body>\n  <h1>Fun in the Pond</h1>\n  <div style=\"\
    float:left; padding:3px\">\n    <object class=\"6B8F52A5-394A-11d3-B153-C0C479FAA66\"\
    \ width=\"320\" height=\"305\">\n      <param name=\"type\" value=\"video/x-ms-wmv\"\
    \ />\n      <param name=\"URL\" value=\"pond.wmv\" />\n    </object>\n  </div>\n\
    </body>\n</html>\n```"
  merge: -1
