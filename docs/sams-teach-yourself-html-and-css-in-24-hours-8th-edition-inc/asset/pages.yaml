    they are within the current navigational scheme.


    There are many different types of navigation styles and ways of indicating to
    users where they are and where they want to go. In mind the following fact: studies
    have repeatedly shown that people become confused and annoyed when presented with
    more than five choices at a time, and people feel most comfortable with five or
    fewer choices. Therefore, you should avoid presenting more than five links (either
