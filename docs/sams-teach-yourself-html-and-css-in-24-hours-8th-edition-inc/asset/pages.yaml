  md: "# HOUR 17: Using CSS to Design Navigation\n\n# Creating Horizontal Navigation\
    \ with CSS\n\nThis hour began with vertical navigation because the concept of\
    \ converting a list into navigation is easier to grasp when the navigation still\
    \ looks like a list of items that you might write vertically on a piece of paper,\
    \ a grocery list. When creating horizontal navigation, you will use HTML list\
    \ elements but instead of a vertical display achieved by using the inline display\
    \ property for both the <ul> and the <li>, use the block value of the display\
    \ property instead. It is really as simple as that.\n\nListing 17.3 shows a starting\
    \ point for a page featuring horizontal navigation. The page contains two <div>\
    \ elements: one for the header and one for the content. The header <div> contains\
    \ a logo <div> and a navigation-<div> floated next to each other. The list that\
    \ in the navigation <div> has a display property value inline for both the list\
    \ and the list items. You can see these elements and their placement in Figure\
    \ 17.7.\n\n# Listing 17.3 Basic Horizontal Navigation from a List\n\n```\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML\
    \ 1.1//EN\"\nn\"http://www.w3.org/TR/html11/DTD/html11.dtd\">\n\n<html xmlns=\"\
    http://www.w3.org/1999/xhtml\" xml-lang=\"en\">\n<head>\n  <title>ACME Widgets\
    \ LLC</title>\n  <style type=\"text/css\">\n  body {\n    font: 12pt Verdana,\
    \ Arial, Georgia, sans-serif;\n  }\n  #header {\n    width: auto;\n  }\n  #logo\
    \ {\n    float:left;\n  }\n  #nav {\n    float:left;\n  }\n  #nav ul {\n    list-style:\
    \ none;\n    display: inline;\n  }\n  #nav li {\n    display: inline;\n  }\n \
    \ #content {\n```"
