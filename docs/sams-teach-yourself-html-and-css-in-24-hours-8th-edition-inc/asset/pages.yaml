  md: '# Summary


    This hour covered some extremely important territory by exploring how to provide
    hints to search engines (such as Google, Bing, and Yahoo!) so users can find your
    pages more easily. You also saw an example of the HTML behind a reasonably web
    page redo to make it search engine friendly. Finally, you learned a few more tips
    to optimize the index of your site overall.


    Table 24.1 lists the tags and attributes covered in this hour.


    | Table 24.1 HTML Tags and Attributes Covered in Hour 24 |

    | Tag/Attribute | Function |

    | <meta /> | Indicates meta-information about this document (information about
    the document itself). Most commonly used to add a page description and to designate
    keywords. Used in the document <head>. |

    | Attributes name="name" | Can be used to specify what type of information about
    the document is in the content attribute. For example, name="keywords" means that
    keywords for the page are in content. The actual message or value for the information
    specified in http-equiv or name. For example, if the httpequiv attribute is set
    to refresh, the content attribute should be set to the number of seconds to wait,
    followed by a semicolon and the address of the page to load.


    # Q&A


    +   Q I have lots of pages in my site. Do I need to fill out a separate form for
    each page at each search site?


    +   A No. If you submit your home page (which is presumably linked to all the
    other pages), the search spiders will crawl all the links on the page (and all
    the links on the linked pages, and so on) until they have indexed all the pages
    on your site.


    +   Q I submitted a request to be listed with a search engine, but when I search
    for my page, my page never comes up—not even when I enter my company’s unique
    name. What can I do?'
  merge: -1
  pgno: 391
- img_proc: true
  md: '# HOUR 24: Helping People Find Your Web Pages


    Most of the big search engines offer a page you can fill out to instantly check
    whether a specific address is included in their database. If you find that it
    isn''t included, you can submit another request form. Sometimes it takes days
    or even weeks for the spiders to get out to indexing your pages after you submit
    a request.


    When I put keywords in a <meta /> tag, do I need to include every variation of
    spelling and capitalization?


    Don''t worry about capitalization; almost all searches are entered in lowercase
    letters. Do include any obvious variations or common spelling errors as search
    keywords. Although more advanced strategies available when it comes to manipulating
    the <meta /> tag that I''ve been able to cover in this hour. Visit http://en.wikipedia.org/wiki/Meta_element
    for good information on the various attributes of this tag and how to use it.


    I''ve heard that I can use the <meta /> tag to make a page automatically reload
    every few seconds or months. Is this true?


    Yes, but there''s no point in doing unless you have some sort of program or script
    set up on your web server to provide new information on the page. And if that
    is the case, the chances are that you can go about refresh in a different way
    using AJAX (see Hour 21 for basic information on AJAX). For usability reasons,
    the use of <meta /> to refresh is frowned upon by the W3C and users in general.


    # Workshop


    The workshop contains quiz questions and activities to help you solidify your
    understanding of the material covered. Try to answer all questions looking at
    the “Answers” section that follows.


    # Quiz


    +   1. If you publish a page about puppy adoption, how could you make sure that
    the page can be found by users who enter puppy, dog, and/or adoption at all the
    major Internet search sites?


    +   2. Suppose you decide to paste your keywords hundreds of times in your HTML
    code, using a white font on a white background, so that your readers cannot see
    them. How would search engine spiders deal with this?


    +   3. Is it better to throw all your content in one directory, or to organize
    into several directories?'
  merge: -1
  pgno: 392
- img_proc: true
  md: '# Answers


    +   1. Make sure that *puppy, dog,* and *adoption* occur frequently on your main
    page (as they probably already do) and title your page namesake along the lines
    of Puppy Dog Adoption. While you''re at it, put the following `meta` tags in the
    `<head>` portion of the page:

    \```html

    <meta name=''description'' content=''dog adoption information and services'' />

    <meta name=''keywords'' content=''puppy, dog, adoption'' />

    ```


    Publish your page online and then visit the site subpage for each major search
    engine (listed earlier in the hour) to fill out the submission forms.


    +   2. Search engine spiders would ignore the duplications and possibly blacklist
    you from their index and label you as a spammer.


    +   3. Definitely organize your content into directories. This will provide easier
    maintenance of your content, but will also give you the opportunity to create
    human-readable URLs with directory structures that make sense, and also to create
    a navigational breadcrumb trail.


    # Exercises


    +   You''ve reached the end of the hours. If you have a site that is ready for
    the world to see, review the content and structure for the best possible optimizations
    and submit the address to all the major search engines.'
