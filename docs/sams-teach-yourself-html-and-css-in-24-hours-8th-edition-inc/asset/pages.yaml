  md: '# HOUR 10: Creating Images for Use on the Web


    TIP


    If you really want to use a background tile but you just cannot seem to get the
    pattern you want, you can check out some of the hundreds of sites on the Internet
    offering public-domain background images that are free or yet professionally designed.


    In Hour 11, you''ll learn how to place background images within your container
    elements. Despite my warnings in this section, there are actually times when background
    images can be powerful weapons in your arsenal—just not when used as entire page
    backgrounds.


    # Creating Animated Web Graphics


    The GIF format allows you to create animated images that can be used to add some
    motion that will spice up any web page. Animated GIFs also transfer much faster
    than that of the video or multimedia files that are often used for similar effect.
    With GIMP, you can create animated GIFs by creating multiple layers within an
    image and then modifying the Animated GIF options when saving the file. Additionally,
    if you have a series of images you want to animate, you can use the free, web-based
    GIF animation service at Gickr (http://www.gickr.com/).


    The first step in creating a GIF animation is to create a series of images to
    be displayed one after the other—or a series of layers, depending on your particular
    software program. Each of these images is called a frame. By the way, of the word
    frame has nothing to do with the frames you''ll learn about in Hour 13, "Working
    with Frames." Instead, think of the frames like how movies or cartoons are put
    together—the images you see on the screen are made up of many individual frames
    with slight differences in their appearance. Once you have your frames in mind,
    the process of tying them together is relatively simple—it''s the planning stage
    that''s the most difficult. Take some time to sketch out the frames in storyboard
    fashion, especially if you plan to have more than just a few frames. After you
    know how your frames are going to fit together, use the Gickr service mentioned
    earlier in this section, or read the documentation for your graphics software
    to learn its particular process for pulling all together.'
