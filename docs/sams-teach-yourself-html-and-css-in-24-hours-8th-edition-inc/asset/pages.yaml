  md: '# HOUR 10: Creating Images for Use on the Web


    # Working with Transparent Images


    You might have web sites that use background colors or images in their container
    elements, but also have images present in the foreground that allow the background
    to show through parts of the foreground graphics. In these cases, the images in
    the foreground have portions which are transparent, so that the images themselves—which
    are always on a rectangular canvas—do not show the areas of the canvas in which
    the design does not occur. You''ll often want to use these types of partially
    transparent images to make graphics look good over any background color or background
    image you might have in place.


    To make part of an image transparent, the image must be saved in the GIF or PNG
    file format. As mentioned previously in this lesson, most graphics programs support
    the GIF format allow you to specify one color to be transparent, whereas PNG images
    allow for a range of transparency. Largely because of this transparency range,
    the PNG format is superior to GIF. All the latest web browsers already support
    PNG images. For information on the PNG image format, visit http://www.libpng.org/pub/pngintro.html


    The process of creating a transparent image depends on the type of image you are
    creating (GIF or PNG) and the graphics software you are using to create it. For
    instructions, look in your graphics program''s help files or type **transparent
    images with [your program here]** into your search engine.


    # Creating Tiled Backgrounds


    Any GIF or JPEG image can be used as a background element. However, before you
    go off and create a tiled background, especially a highly patterned tiled background,
    ask yourself what tiled background adds to the overall look and feel of your web
    site, and—more importantly—ask yourself if the text of the site can be read easily
    when placed over that pattern?


    Think about the web sites you frequent every day and consider the fact that few
    use tiled, patterned backgrounds on their entire pages. If you restrict your browsing
    to web sites for companies, products, sports teams, or other sites in which information
    (primarily text) is privileged, the number of sites with tiled, patterned backgrounds
    will decrease even further. While the web affords everyone the right of individuality
    in design, if you'
