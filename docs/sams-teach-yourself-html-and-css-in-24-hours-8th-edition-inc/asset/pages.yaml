  md: '# HOUR 10: Creating Images for Use on the Web


    Because of the numerous tools available to you, the preview function available
    with each tool, a little playful experimentation is the best way to find out what
    each tool does.


    # Controlling JPEG Compression


    Photographic images on the web work best when saved in the JPEG format rather
    than GIF; JPEG allows you to retain the number of colors in the file while still
    keeping the overall file size to a manageable level. When you''re finished adjusting
    the size and appearance of your photo, select, Save As and choose JPEG as the
    file type. Your graphics program will likely provide you with another dialog box
    through which you can control various JPEG options, such as compression.


    Figure 10.5 the Save as JPEG dialog box you''ll see when saving JPEG in GIMP.
    You can see here that you can control the compression ratio for saving JPEG files
    by adjusting the Quality slider between 1 (low quality, small size) and 100 (high
    quality, large file size).


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_160_0.png)


    You might want to experiment a bit to see how various JPEG compression levels
    affect the quality of your images, but 85% quality (or 15% compression) is generally
    a good compromise between file size (and therefore download speed) and quality
    for most photographic images.'
