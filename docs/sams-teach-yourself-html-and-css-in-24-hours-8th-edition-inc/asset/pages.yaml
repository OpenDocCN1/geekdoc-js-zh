  md: '# HOUR 13: Working with Frames


    view your web page, it is convenient to use percentages rather than exact pixel
    values to dictate the size of the rows and columns. For example, to make a left
    20% of the width of the browser window with a right frame taking up the remaining
    80%, you would type the following :


    ```

    <frameset cols="20%,80%">

    ```


    Whenever you specify any size in pixels, it''s a good idea to include at least
    one frame in the same frameset with a variable (*) so that the document can grow
    to a fill of any size.


    # Adding Individual Frames


    Within the <frameset> and </frameset> tags, you should have a <frame /> indicating
    which HTML document to display in each. Note that if you have fewer <frame />
    tags than the number of frames defined in the <frameset> tag, any remaining frames
    will be left blank.


    Include an src attribute in <frame> with the address of the web page to load in
    that frame. You can put an image, instead of a web page, if you just want a frame
    with a single image in it.


    # Linking Between Frames and Windows


    The real power of frames begins when you give a frame a unique name with the name
    attribute in the <frame /> tag. You can then make any link on the page changes
    of that frame by using the target attribute in an <a> tag. For example, Listing
    1.13 includes the following:


    ```

    <frame src="home.html" name="main" />

    ```


    This code displays the home.html frame in that frame when the page loads and names
    the frame "main".


    In the code for the frame, which is shown in Listing 13.2, you will see the following
    link:


    ```

    <a style="color:#FFFFFF;" href="services.html" target="main">SERVICES</a>

    ```


    When the user clicks this link, services.html is displayed in the frame named
    main (the lower frame). If the target="main" attribute has been left out, the
    services.html page would be displayed in the current (frame) instead.'
