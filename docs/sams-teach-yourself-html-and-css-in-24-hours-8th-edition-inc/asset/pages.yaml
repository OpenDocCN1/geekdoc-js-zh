  md: '# # HOUR 20

    Creating Print-Friendly Web Pages


    If you''ve ever used an online mapping tool such as MapQuest or Google Maps, you''ve
    no doubt experienced the need for a web page. Similarly, the proliferation of
    coupons offered only online, purchase receipts from online resellers, and web-based
    flight check-in and the ability to print boarding passes from your home computer
    increased the need for print-friendly pages. It''s true, not all web pages are
    designed for viewing on screen. You might not realize this, but it''s possible
    to specially design and offer print-friendly versions of your pages for users
    who want to print a copy for offline reading—something Google Maps offers after
    showing you the on-screen version of content. CSS makes it easy to create web
    pages that will change appearance based on how they are viewed. In this hour,
    you learn how to create such pages.


    +   WHAT YOU''LL LEARN IN THIS HOUR:

    * What makes a page print-friendly

    * How to apply a media-specific style sheet

    * How to create a style sheet for print pages

    * How to view your web page in print preview mode


    As you work your way through this hour, consider any of your own web pages that
    might look good in print. Then think about what you would want to change about
    them to make them look even on the printed page. Here are some ideas to consider:


    +   Even against warnings in previous lessons, do you pages use a patterned background
    image or an unusual background color with contrasting text? This kind of page
    can be difficult to print because of the background, so you might consider offering
    a print version of the page that doesn''t use a custom background image or color
    and simply uses black text. When preparing a page for print-ing, stick to black
    text on a white background if possible.


    # TRY IT YOURSELF ▼

    Review Your Content for Print-Friendliness'
  merge: -1
  pgno: 321
- img_proc: true
  md: '312 HOUR 20: Creating Print-Friendly Web Pages


    # TRY YOURSELF

    Review Your Content for Print-Friendliness


    +   - Do your pages include lots of links? If so, you might consider changing
    the appearance of links for printing so that they don''t stand out—remove any
    underlining, for example. Remember, you can''t click a piece of paper!


    +   - Finally, is every image on your pages absolutely essential? Colorful images
    cost ink to print on most printers, so you might consider leaving some, if not
    all, images out of your print-friendly pages.


    # What Makes a Page Print-Friendly?


    I already touched on this topic a bit in the preceding Try It Yourself, but it''s
    worth a more thorough exploration of what constitutes a print-friendly web page.
    First off, it''s important to point out that some pages are print-friendly already.
    If pages use white backgrounds with contrasting text and few images, you might
    not even need to concern yourself with a special print-friendly version. On the
    other hand, pages with dark backgrounds, dynamic links, and several images might
    prove to be unwieldy for the average printer.


    The main things to keep in mind as you consider what it takes to make your pages
    more print-friendly are the limitations imposed by the medium. In other words,
    what is it about a printed page that makes it uniquely different from a computer
    screen? The obvious difference is size—a printed page is at a fixed size, typically
    8½ by inches, whereas the size of screens can vary greatly. In addition to size,
    printed pages also have color limitations (even on color printers). Very few users
    want to waste the ink required to print a full-color background when they really
    want to print the text on the page.


    Most users also aren''t interested in printing more than the text that serves
    as the focus on the page. For example, Figure 20.1 shows a travel route mapped
    from San Jose, California to Pullman, Washington.'
  merge: -1
  pgno: 322
