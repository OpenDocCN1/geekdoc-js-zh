    After you have an element aligned and indented, you might be interested in setting
    its fonts. The following font properties are used to set the various parameters
    associated with fonts:


    +   * font-family—The family of the font.


    +   * font-size—The size of the font.


    +   * font-style—The style of the font (normal or italic).


    +   * font-weight—The weight of the font (light, medium, bold, and so on).


    The font-family property specifies a prioritized list of font names. A prioritized
    list is used instead of a single value to provide alternatives in case a font
    isn''t available on a given system. The font-size property specifies the size
    of the font using a unit of measurement, usually points. Finally, the font-style
    property sets the style of the font and the font-weight property sets the weight
    of the font. Following is an example of setting these properties:


    ```

    font-family: Arial, sans-serif;

    font-size: 36pt;

    font-style: italic;

    font-weight: medium;

    ```'
