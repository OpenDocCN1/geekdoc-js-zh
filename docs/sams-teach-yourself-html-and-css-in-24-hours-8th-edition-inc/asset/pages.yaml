  md: '# Displaying Random Content


    Text strings are enclosed in quotation marks. However, in JavaScript, a line break
    indicates an end of a command, such that the following would cause problems in
    the code:


    ```

    quotes[0] = ''When I was a boy of 14, my father was so ignorant...but I grew to
    be 21, I was astonished how much he had learned in 7 years.'';

    ```


    Therefore, you see that the string is built as a series of strings enclosed in
    quotation marks, with a plus sign (+ ) connecting the strings.


    The next chunk of code definitely looks the most like programming: this line gets
    a random number:


    ```

    i = Math.floor(Math.random() * quotes.length);

    ```


    But you cannot just pick any random number, because the purpose of the random
    number is to determine which of the quotes and sources should be printed—and there
    are only four quotes. So, this line of JavaScript:


    +   * Math.random() to get a random number between 0 and 1. For example, 0.5482749
    might be a result of Math.random().


    +   * Multiples the random number by the length of the quotes array, which is
    currently 4; the length of the array is the number of elements in the array. If
    the random number is 0.5482749 (as shown previously), multiplying by 4 results
    in 2.1930996.


    +   * Math.floor() to round the result down to the nearest whole number. In other
    words, 2.1930996 turns into 2.


    +   * Assigns the variable i value of 2.


    The rest of the function should look familiar, with a few exceptions. First, as
    you learned this hour, document.write() is used to write HTML which is then rendered
    by the browser. The strings are separated in such a way as to make it when something
    needs to be handled differently, escaping the quotation marks with a backslash
    (\) or when the value of a variable is substituted. The actual code and source
    that is the one that matches quotes[i] and sources[i], where i is the number determined
    by the mathematical functions above.


