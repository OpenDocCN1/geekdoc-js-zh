  md: '# HOUR 10

    Creating Images for Use on the Web


    Although paying attention to color schemes and producing a visually appealing
    web site is important, you don''t have to be an artist to put high-impact graphics
    on your web pages. More importantly, you don''t need to spend hundreds or thousands
    of dollars on software, either. This hour will help you get started with creating
    some of the images you can use in your web. Although the sample figures in this
    chapter use a popular and free graphics program for Windows, Mac, and Linux users
    (GNU Image Manipulation Program, or GIMP), you can apply the knowledge learned
    in this hour to any major Windows or Macintosh graphics—although the menus and
    options may be slightly different.


    In this hour, you only learn how to create the graphics themselves, including
    different types of graphic uses. In Hour 11, “Using Images in Your Web Site,”
    you’ll learn how to integrate your graphics using HTML and CSS.


    # Creating Graphics Software


    You can use any graphics program to create images for your web site, from the
    simple paint program that typically comes with your computer''s operating system
    to an expensive professional program such as Adobe Photoshop. Similarly, if you
    have a digital camera or scanner attached to your computer, it probably comes
    with some graphics software capable of creating web pages. There are also several
    free image editors available for download—or even online as a web application—that
    deal just with the manipulation of photographic elements.


    # WHAT YOU''LL LEARN IN THIS HOUR:


    +   * How to choose graphics software

    * How to prepare photo-graphs for use online

    * How to create tiled banners and buttons

    * How to reduce the number of colors in an image

    * How to create transparent images

    * How to create animated web graphics


    # NOTE


    Adobe Photoshop is without a doubt of the cream when it comes to image-editing
    programs. However, it is expensive and quite complex if you don''t have experience
    working with computer graphics. For more information on Adobe products, visit
    the Adobe web site at http://www.adobe.com/. If you are in the market for one
    of their products, you can download a free evaluation version from their site.'
  merge: -1
