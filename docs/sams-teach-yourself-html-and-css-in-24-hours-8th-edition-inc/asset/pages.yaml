  md: '# # HOUR 5

    Working with Text Blocks and Lists


    In the early days of the Web, text was displayed in only one font and in one size.
    However, a combination of HTML and CSS now makes it possible to control the appearance
    of text and how it is aligned and displayed on a web page. This hour will show
    you the basics of text alignment and guide you through some advanced text tips
    and tricks, such as the use of lists. Lists are so common, HTML provides tags
    that automatically indent text and add numbers, bullets, or other symbols in front
    of each listed item. You''ll learn how to format different types of lists, which
    are part of the many ways to display content in your web site.


    +   WHAT YOU''LL LEARN IN THIS HOUR:

    * How to align text on a page

    * How to use the three types of HTML lists

    * How to place lists within lists


    You can make the most of learning how to style text this hour if you have some
    sample text that could be indented, centered, or other-wise manipulated:


    +   * Any type of outline, bullet points from a presentation, numbered steps,
    glossary, or list of textual information from a database will serve as good material
    to work with.

    * Any text will do, but try to find (or type) some text you want to put onto a
    web page. The text from a company brochure or from your resume might be a good
    choice.

    * If the text you''re using is from a word processing or database program, be
    sure to save it to a new file in plain-text or ASCII format. You can then add
    the appropriate HTML tags and style attributes to format it as you go through
    this lesson.

    * Before you use the code introduced in this chapter to format the body text,
    add the set of skeleton HTML tags you''ve used in previous hours (the `<html>`,
    `<head>`, `<title>`, and `<body>` tags).


    # TRY IT YOURSELF ▼

    Preparing Sample Text'
