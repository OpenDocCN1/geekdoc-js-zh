    # # Q&A


    **Q I made a big table and when I load the page, nothing appears on the page for
    a long time. Why the wait?


    **A Complex tables can take a while to appear on the screen. The web browser has
    to figure out the size of everything in the table before it can display any of
    it. You can speed things up by always including `width` and `height` attributes
    for every graphic within a table. Using `<table>` and `<td>` also helps.


    **Q Can I put a table within a table?**


    **A Yes, you can nest tables within other cells. However, nested tables—especially
    large ones—time to load and render properly. Before you create a nested table,
    think about the content you are placing on the page and ask yourself if it could
    be displayed using CSS. You might not know all the answers until you finish this
    book, but here''s a hint: In most cases, the answer will be "yes."


    # # Workshop


    The workshop contains quiz questions and activities to help you solidify your
    understanding of the material covered. Try to answer all questions before looking
    at the "Answers" section that follows.


    # # Quiz


    +   1. How would you create a simple two-row, two-column table with a standard
    border?


    +   2. Expanding on Question 1, how would you add 30 pixels of space between the
    table border and the cells?'
