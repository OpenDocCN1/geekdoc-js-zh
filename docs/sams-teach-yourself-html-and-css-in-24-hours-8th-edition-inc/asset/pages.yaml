  md: '# # Summary


    This hour has shown you how to use the <img /> tag to place images on

    our web pages. You learned how to include a short text message that

    appears in place of the image as it loads and also appears whenever users

    move the pointer over the image. You also learned how to control

    h horizontal and vertical alignment of each image and how to wrap text

    around the left or right of an image.


    You also learned how to use images as links—either by using the <a> tag

    around the images or by creating imagemaps. You also learned a little

    about how to use images in the background of container elements.


    Table 11.1 summarizes the attributes of the <img /> tag covered in this hour,

    along with relevant style properties.


    | Table 11.1 HTML Tags and Attributes Covered in Hour 11 |

    | Tag/Attribute | Function |

    | <img /> | Places an image file within the page. |

    | <map>...</map> | A client-side image referenced by <img usage="..." />. Includes
    one

    or or more <area /> tags. |

    | <area /> | Defines a clickable link within a client-side image. |

    | Attributes | The address or filename of the image. |

    | src="altdescription" | An alternative description of the image that is displayed
    in place of the image, primarily for users who can''t view the image itself. |

    | title="title" | A text message that is displayed as an image title, typically
    in a small pop up box (tooltip) over the image. |

    | width="width" | The width of the image (in pixels). |

    | height="height" | The height of the image (in pixels). |

    | style="border:attributes" | Gets rid of the border around the image if it is
    serving as a link. |

    | style="vertical-align:alignment" | Aligns the image vertically to text-top,
    top, text-bottom, bottom, middle, or baseline. |'
  merge: -1
  pgno: 189
