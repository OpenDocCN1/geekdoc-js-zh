  md: '# HOUR 23

    Organizing and Managing a Web Site


    The bulk of this book has led you through the design and creation of your own
    web content, from text to graphics and multimedia. Along the way I''ve noted some
    of the ways you can think about the lifecycle of content, but in this hour you''ll
    learn how to look at your work as a whole.


    This hour shows you to think about organizing and presenting multiple web pages
    so that visitors will be able to navigate them without confusion. You''ll also
    learn ways to make your web site memorable enough to visit again and again. Web
    developers use the term “sticky” to describe pages that people don''t want to
    leave. Hopefully this chapter will help you to make your web sites doorways!


    Because web sites can be (and usually should) updated frequently, it''s essential
    to create pages that can be easily maintained. This hour shows how to add comments
    and other documentation to your pages so that you—or anyone else on your staff—can
    understand and modify your pages.


    +   WHAT YOU''LL LEARN IN THIS HOUR:

    - How to determine when one page is enough to handle all your content

    - How to organize a simple site

    - How to organize a larger site

    - How to write maintainable HTML code


    | TRY IT YOURSELF |

    Evaluate Your Organization


    By this point in the book, you should have enough HTML and CSS knowledge to produce
    most of your web site. You probably have created a number of pages already, and
    perhaps even have ever published them online.


    As you read this hour, think about how your pages are organized now and how you
    can improve that organization. You have used comments in your HTML, or a document
    for future web site maintainers regarding your organization? If not, this would
    be a good time to start. Along the way, don''t be surprised if you decide to a
    redesign that involves changes almost all of your pages—the results are likely
    to be worth the effort!'
  merge: -1
  pgno: 365
