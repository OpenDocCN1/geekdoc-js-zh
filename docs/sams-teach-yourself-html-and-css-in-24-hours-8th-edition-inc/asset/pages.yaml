  md: '# Internal Styles and Inline Styles


    Internal styles are handy if you want to create a style rule that is used multiple
    times within a single page. However, in some instances you might need to apply
    a unique style to one particular element. This calls for an inline style, which
    allows you to specify a style for only a small part of a page, such as an individual
    element. For example, you can create and apply a style rule within a <p>, <div>,
    or <span> style attribute. This type of style is known as an inline style because
    it is specified right in the middle of the HTML code.


    Here''s how a style attribute might look:


    ```

    <p style="color:green">

    This text is green, <span style="color:red">this text is red.</span>

    Back to again, but...

    </p>

    ```


    ...now the green is over, and we''re back to the default color for this page.


    This code makes use of the <span> tag to show how to apply the color style property
    in an inline style. In fact, both the <p> tag and the <span> tag in this example
    use the color as an inline style. What''s important to understand is that the
    color:green style property overrides only for the text appearing between the <span>
    and </span> tags. Then in the second paragraph, method of style color applies
    because it is a completely new paragraph that adheres to the default color of
    the entire page.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_73_0.png)


    <span> and </span> are dummy tags that do nothing in and of themselves specify
    a range of content to apply any you add. The difference between <div> and <span>
    is that <div> is a block element and forces a line break, whereas <span> doesn''t.
    Therefore, you should use <span> to modify the style of any option that is to
    appear in the middle of a sentence or paragraph without any line.


    # Validate Your Style Sheets


    Just as is important to validate your HTML or XML markup, it is important to validate
    your style sheet. A specific validation tool for CSS can be found at http://jigsaw.w3.org/css-validator/.
    Just like the validation discussed in Hour 3, you can point the tool to a web
    address, a file, or paste content into the field provided. The ultimate goal is
    a result as shown in Figure 4.3; valid:


    # 4.3


    The W3C CSS Validator shows there are no errors in the style sheets of Listing
    4.1.'
