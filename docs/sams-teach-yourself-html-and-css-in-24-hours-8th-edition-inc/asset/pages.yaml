- img_proc: true
  md: '# HOUR 23: Organizing and Managing a Web Site


    information contained within the site itself. The main page of a site should provide
    the user with enough information to provide a clear picture of the organization,
    as well as traditional address and telephone contact information and an e-mail
    address to contact with questions or feedback. It should also provide pathways
    into the highly structured information that should be contained on other pages
    of the site. The main page shown in Figure 23.3 provides examples of all these
    good features: basic information, contact information, and patterns for multiple
    audiences.


    FIGURE 23.3

    This university main page uses a basic design, minimal but useful graphics, and
    clear structure to entice users to explore for more information.


    # TIP


    Regardless of how large your site is, its a good idea to organize your resources.
    For example, place the images for your web pages in a separate folder named images.
    Similarly, if you have files for download, place them in a folder called downloads.
    This makes it much easier to keep track of web pages based on their particular
    types (HTML pages, GIFs, and so on). Additionally, if you organize your site into
    sections, such as "Company," "Products," "Press," and so on, put the individual
    pages into similarly-named directories (company, products, press, and so on) for
    the same organizational reasons.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_368_0.png)


    One of the most common mistakes making web sites is creating pages that look different
    than other pages on the site. Another seriously mistake is using the same, publicly
    available clip art that thousands of other users are also using. Remember that
    on the Internet, one click can take you around the world. The only way to make
    your pages memorable and as a cohesive site is to make all your pages adhere to
    a unique, unmistakable theme. In other words, strive for uniqueness compared to
    other web sites, yet uniformity within the site itself.'
