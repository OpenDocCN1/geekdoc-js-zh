    http://www.companyname.com/

    to

    http://www.companyname.com/products/

    or

    http://www.companyname.com/services/


    In the previous section, I used the term document root without really explaining
    what that is all. The document root of a web server is essentially the trailing
    "slash/ in the full URL. For instance, if your domain is yourdomain.com and your
    URL is http://www.yourdomain.com/, then the document root is the directory represented
    by the trailing slash (/). The document root is the starting point of the directory
    structure you create on your web server; it is the place where the server begins
    looking for files requested by the web browser.


    If you put the sample.html file in your document root as previously described,
    then you will be able to access it via a web browser at the URL:


    http://www.yourdomain.com/sample.html


    If you were to enter this URL into your web browser, you would see the rendered
    sample.html file as shown in Figure 2.4.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_29_0.png)


    Figure 2.4

    The sample.html file accessed via a web browser.


    However, if you created a new directory within the document root and put the sample.html
    file in that directory, then the file would be accessed at this URL:


    http://www.yourdomain.com/newdirectory/sample.html'
