  md: '# Creating Banners and Buttons


    Graphics that you create from scratch, such as banners and buttons, require you
    to make considerations uniquely different from photographs.


    The first decision you need to make when you produce a banner or button is how
    big it should be. Most people accessing the web now have a computer with a screen
    that is at least 1024x768 pixels in resolution, if not considerably. For example,
    my screen is currently set at 1024x900 pixels. You generally plan your graphics
    so that they will always fit within smaller screens (1024x768), with room to scrollbars
    and margins. The crucial size constraint is the horizontal width of your pages
    because scrolling a page horizontally is a huge hassle and a source of confusion
    for web users. Vertically scrolling a page is much more acceptable, but it''s
    okay if your pages are taller than the minimum screen sizes.


    Assuming that you target a minimum resolution of 800x600 pixels, full-sized banners
    and title graphics should be no more than 770 pixels wide by 430 pixels tall,
    which is the maximum viewable area of the page after you''ve accounted for scrollbars,
    toolbars, and other parts of the browser window. Within a page, normal photos
    and artwork should be from 100 to 300 pixels tall and wide. Obviously, if you
    design for the 1024x768 resolution, you have more "real estate" to work with,
    but the size guidelines for banners, buttons, and other supplementary graphics
    are still in effect.


    To create a new image in GIMP, go to File and choose New. The Create a New dialog
    box displays. If you''re not sure how big the image needs to be, just accept the
    default size of 640x480. Or you can choose one of the other pre-defined sizes
    in the Template dropdown, such as Web banner common 468x60 or Web banner huge
    728x90. Those settings are indeed considered "common" and "huge" for web site
    banners. Otherwise, enter the width and height of the new image.


    > TIP

    For many years, designing for 800x600 screen resolution has been the norm. Still
    keep low number in mind, as many people do not open applications in full-screen
    mode. However, designing for a baseline 1,024x768 screen resolution is not a bad
    idea.'
