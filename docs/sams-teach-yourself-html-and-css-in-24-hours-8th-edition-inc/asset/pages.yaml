  md: '# Applying a Media-Specific Style Sheet


    In addition to these suggestions, you might find it useful to add a byline with
    information about the author of the page, along with a URL for the page and copyright
    information. This information could potentially get lost after the user leaves
    your web site and has only the printed version of the page in hand.


    You probably don''t need to make these changes to your pages just yet. The idea
    is to plant the seed of what constitutes a printer-friendly page so that you can
    do a better job of creating a printer-specific style sheet. That''s right, it''s
    possible to create a style sheet that is applied to pages only when they are printed.
    You learn this in the next section.


    # Applying a Media-Specific Style Sheet


    Figure 20.1 showed how a small printer icon with a link allows you to view a special
    printer-friendly version of a page. This type of icon is popular on many news
    sites, it''s an important feature because you otherwise might not want to hassle
    with printing a page and wasting paper and ink on the graphics and ads that accompany
    articles. Although the printer icon and link approach is intuitive and works great,
    there is an option that does not require these specific links to print-friendly
    content.


    This option involves using a print-specific style sheet that is automatically
    applied to a page when the user elects to print the page. CSS supports the concept
    of media-specific style sheets, which are sheets that target a particular medium,
    as the screen or printer. CSS doesn''t stop with two forms of media, however.
    Check the following list of specific types that CSS 2 allows you to support with
    a unique style sheet:


    +   - all: for devices


    +   - aural: for speech synthesizers (called speech in CSS 1 media types)


    +   - braille: for Braille tactile feedback devices


