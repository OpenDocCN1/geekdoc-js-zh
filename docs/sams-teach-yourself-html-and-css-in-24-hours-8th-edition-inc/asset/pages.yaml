  md: '294


    HOUR 19: Creating Fixed or Liquid Layouts


    # # Understanding Fixed Layouts


    A fixed layout, or fixed-width layout, is just that—a layout in which the body
    of the page is set to a specific width. That width is typically controlled by
    a master `<div>` in which all content is contained. The width of that `<div>`
    may be set in the style attribute or in a style sheet if the `<div>` is given
    an ID value such as “main” or “wrap-per” (although the name is up to you).


    When creating a fixed-layout, the most important decision is determining the minimum
    screen resolution you want to accommodate. For many years, 800x600 has been the
    "lowest common denominator" for web designers, resulting in a typical fixed width
    of 760 pixels. However, since 2007, the number of people using 800x600 screen
    resolution has less than eight percent (and is currently approximately four percent).
    Given that many web designers consider 1024x768 the current minimum screen resolution,
    leading to fixed-width designs anywhere between 800 and 1000 pixels.


    WARNING


    Remember, the web browser contains non-viewable areas, including the scroll bar.
    So if you are targeting a 1024 pixel width screen resolution, you really can''t
    use all 1024 of those pixels.


    A main reason for creating a fixed-width layout is that you can have control over
    the appearance of the content area. However, if users visit your fixed-width size
    with smaller or much larger screen resolutions than the resolution you had in
    mind while you designed it, they might encounter scroll bars (if their resolution
    is smaller) or a large amount of empty space (if their resolution is greater).


    The current ESPN.com home page provides a visual example of this issue: it has
    a content area of 964 pixels wide. In Figure 19.1, the browser window is 800 pixels
    wide. On the right side of the image, important content is cut off (and at the
    bottom of the figure, a horizontal scroll bar displays in the browser).


    However, Figure 19.2 shows how this looks when the browser window is more than
    1300 pixels wide: there is a lot of empty space (or “real estate”) on both sides
    of the main body content.


    There is another consideration when creating a fixed-width layout: whether to
    place the content flush-left or whether to center it. Placing the content flush-left
    produces extra space on the right side only; centering the content area creates
    extra space on both sides.'
