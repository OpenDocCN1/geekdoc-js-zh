  md: '# HOUR 18: Using Mouse Actions to Modify Text Display


    +   - onmouseover—User moves the mouse pointer into the boundaries of the element.


    +   - onmousemove—User moves the mouse pointer while the pointer is over the element.


    +   - onmouseout—User moves the mouse pointer out of the boundaries of the element.


    As you can see, event attributes are used to responding to common user input events
    such as mouse clicks and presses. You can associate JavaScript with an event by
    assigning the code to the event attribute, like this:


    ```

    h1 onclick="this.style.color = ''red;''>I turned red when clicked.</h1>

    ```


    In the example above, a JavaScript snippet uses the onclick event attribute of
    <h1> tag, which means the code responds to users clicking the left mouse button
    on the text. This interactivity, is added to normally bland text by changing the
    color of the text in response to a mouse click. This is the basis for how client-side
    scripts work in conjunction with your web browser.


    In the next section, you''ll see an example of how to use event handling to change
    the appearance of a <div>. Specifically, the contents of a <div> appear or disappear
    based on a mouse click.


    # Using onclick to Change the Appearance


    The onclick event can be used to invoke all sorts of action; you might think of
    a mouse click as a way to submit a form by clicking on a button, but you can capture
    this event and provide interactivity with your pages as well. In this example,
    you will see how you can use the onclick event to show or hide information contained
    in a <div>. Using the same text and image from Listing 18.1 will see how to add
    interactivity to your page by allowing the user to show previously hidden information
    when users click on a piece of text. This is referred to as “piece of text” because,
    strictly speaking, the text is not a link. That is to say, it will look like a
    link and act like a link, but it will not be marked up an <a> tag.


    Listing 18.2 provides the complete code for this example, shown initially in Figure
    18.4.'
