  md: '# Writing Maintainable HTML Code


    As you have seen in several different hours, you can enclose comments to yourself
    or your co-authors between <!-- and --> tags. These comments will not appear on
    the web page when viewed with a browser but can be read by anyone who knows the
    HTML code in a text editor or via browser''s View Source (or View Page Source)
    function. The following example provides a little refresh to show you how a comment
    is coded:


    ```

    <!-- This needs to be updated daily. -->

    <img src="headline.jpg" alt="Today''s Headline" />

    ```


    As this code reveals, the comment just before the <img /> tag provides a clue
    as to how the image is used. When someone reads this code, they know immediately
    that this is an image that must be updated every day. The text in the comment
    is completely ignored by browsers.


    TIP

    One handy usage of comments is to hide parts of a web page that are currently
    under construction. Rather than making the text and graphics visible and explaining
    that they are under construction, you can hide them from view with carefully placed
    opening and closing comments around the HTML you do not want to appear. This is
    a great way to work on projects of a page gradually and show only the result to
    the world when you''re finished.


    It will be worth your time now to go through all the web pages, scripts, and styles
    you''ve created so far and add any comments that you or others might find helpful
    when revising them in the future. Here''s what to do:


    +   Put a comment explaining any fancy formatting or layout techniques before
    the tags that make it happen.


    +   Use a comment just before an <img /> to briefly describe any important graphic
    whose function isn''t obvious from the alt message.


    +   Consider using a comment (or several comments) to summarize the cells of a
    <table> are supposed to put fit together.


    +   If you use hexadecimal color codes (such as <div style="color:#880088">),
    insert a comment indicating what the color actually actually is (bluish-purple).


    +   Indent your comments to help them stand out and make both the comments and
    the HTML easier to read. Don''t forget to use indentation in the HTML itself to
    make it more readable, too, as we''ll discuss in the next section.


    # TRY IT YOURSELF

    Comment Your Code'
