  md: "# HOUR 19: Creating Fixed or Liquid Layouts\n\nThe liquid layout approach might\
    \ seem like the best approach at first glance—after all, who wouldn’t want to\
    \ take advantage of all the screen real estate available to them? There is a fine\
    \ line between advantage of space and not allowing the content to “breathe,” as\
    \ it were. Too much content is overwhelming; not enough content in an open space\
    \ is underwhelming.\n\nThe pure liquid layout can be quite impressive, but it\
    \ requires a significant amount of testing to ensure that it is usable in a wide\
    \ range of browsers at varying screen resolutions. You might not have the time\
    \ and effort to produce such a design; in that case, a reasonable compromise is\
    \ the fixed/liquid hybrid layout.\n\n# Creating a Fixed/Liquid Hybrid Layout\n\
    \nA fixed/liquid hybrid layout is one that contains elements of both types of\
    \ layouts. For example, you could have a fluid layout that includes fixedwidth\
    \ elements either within the body area or anchor elements (such as a left-side\
    \ column or a top navigation strip). You can even create a fixed content area\
    \ that acts like a frame, as to in Hour 13 “Working with Frames,” in which the\
    \ fixed content area remains fixed even as users scroll through the content.\n\
    \n# Starting with a Basic Layout Structure\n\nIn this example, you’ll learn to\
    \ create a template that is liquid with two fixedwidth columns on either side\
    \ of the main body area (which is a third column, if you think about it, only\
    \ much wider than the others). The template will also have a delimited header\
    \ and footer area. Listing 19.1 shows the basic HTML structure for this layout.\n\
