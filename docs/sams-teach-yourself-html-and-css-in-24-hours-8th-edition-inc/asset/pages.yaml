  md: "# Embedding Multimedia Files\n\n# 187\n\nAs you might have guessed, this approach\
    \ of using a simple link to play multimedia files offers the best backward compatibility\
    \ because browsers bears all the responsibility of figuring out how to play a\
    \ multimedia clip. The downside to this is that you don't have control over how\
    \ a clip is played, and you definitely can't play a clip directly in the context\
    \ of a page.\n\nIf your browser has no support for QuickTime, you can download\
    \ the QuickTime player free from Apple at http://www.apple.com/quicktime/. If\
    \ you even have browsers might still play QuickTime movies differently based on\
    \ whether a plugin is installed. For on Windows, Internet Explorer and Firefox\
    \ both play QuickTime movies directly in the browser window via plugin, whereas\
    \ Opera launches QuickTime as a helper application.\n\n# Embedding Multimedia\
    \ Files\n\nHTML contains a <object> tag that is the preferred way to embed multimedia\
    \ of any kind in a page. This tag is used instead of the old <embed /> tag that\
    \ you might still see in some HTML source code.\n\nEmbedding a multimedia file\
    \ into a page provides a set of controls that allow the file to be played directly—no\
    \ secondary window is necessary, and there's no need to navigate away from the\
    \ page you are on. Following is code to embed the video, which you saw earlier,\
    \ using the object:\n\n```\n<object class=\"CLSID:6BF852A52-39A4-11D3-B153-00C0A47F9AAA6\"\
    \ width=\"320\" height=\"305\">\n  <param name=\"type\" value=\"video/x-ms-wmv\"\
    \ />\n  <param name=\"URL\" value=\"pond.wmv\" />\n  <param name=\"idloop\" value=\"\
    full\" />\n  <param name=\"autoStart\" value=\"false\" />\n</object>\n```\n\n\
    This code isn't too complicated when you consider that it literally embeds a video\
    \ directly into your web page (see Figure 11.3). The messiest part of the code\
    \ is the class attribute of the <object> tag, which is set to a long alphanumeric\
    \ code. This code is the \"global ID\" for Windows Media Player, which means you're\
    \ telling the <object> to embed Windows Media Player on the page to play the video\
    \ clip. You can just copy and paste this code into your own pages.\n\nIt's important\
    \ to note that Windows Media Player is a sophisticated enough player that it automatically\
    \ streams multimedia files, which means it begins loading only after the first\
    \ few seconds of content. The idea is that the rest of the content is locked in\
    \ the background while you're watching or listening to earlier portions. The result\
    \ is that visitors don't have to wait through long download times when viewing\
    \ or listening to your multimedia clips."
  merge: -1
  pgno: 197
- img_proc: true
  md: '# HOUR 12: Using Multimedia in Your Web Site


    FIGURE 12.3


    The `<object>` tag allows you to embed a video clip on a web page while specifying
    which media player is to play it.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_198_0.png)


    The `width` and `height` attributes of the `<object>` tag determine the size of
    the embedded Windows Media Player window. Some browsers will automatically scale
    the embedded player to fit the content if you leave these attributes off, whereas
    others won''t show anything at all. I play safe by setting them to a size that
    suits the multimedia content being played.


    There are four `<param>` tags within the `<object>` tag that are responsible for
    additional details about how the clip is played. Each tag has two attributes,
    `name` and `value`, which are responsible for assigning data to a particular setting.
    For example, the `URL` for the media clip is set to `pond.wmv`. The third parameter,
    `uiMode`, determines which buttons and user interface options are available by
    Windows Media Player—full buttons and volume slider. Finally, the `autoStart`
    parameter is set to `true` so that the video clip starts automatically or `false`
    so that the video clip does not automatically start playing when the page is opened
    in a browser.


    The `type` parameter is perhaps the trickiest. It identifies the type of media
    being displayed, which in this case is a Windows Media Video (WMV) file. This
    media type must be specified as one of the standard Internet MIME types.'
  merge: -1
