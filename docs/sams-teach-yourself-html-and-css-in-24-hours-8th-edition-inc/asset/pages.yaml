    \ client's hopping mad,\nput his picture in the ad.\n\nIf he still should prove\
    \ refractory,\nadd a picture of his factory.\n</p>\n\n<br />\n\n<p>\nWhen your\
    \ client's hopping mad,<br />\nput his picture in the ad.\n</p>\n\n<p>\nIf he\
    \ still should prove refractory,<br />\nadd a picture of his factory.\n</p>\n\
    </body>\n</html>\n```"
