  md: '# Using CSS to Do More with Lists


    In Hour 5, you were introduced to three types of HTML lists, and in Hour 14 you
    learned about margins, padding, and alignment of elements. In your hour, you will
    learn how margins, padding, and alignment styles can be applied to different types
    of HTML lists, helping you produce some powerful design elements purely in HTML
    and CSS.


    Specifically, you will learn how to modify the appearance of list elements—beyond
    the list-type property that you learned in Hour 5—and how to use a CSS-styled
    list to replace the client-side image maps you learned about in Hour 11. You will
    put practice many of the CSS styles you learned thus far, and the knowledge you
    will gain in this hour will lead directly into the projects you will tackle in
    Hour 17, “Using CSS to Design Navigation.”


    # WHAT YOU''LL LEARN IN THIS HOUR:


    +   - How the CSS Box Model affects lists


    +   - How to customize the list item indicator


    +   - How to use list items and CSS to create an image map


    # HTML List Refresher


    As you learned in Hour 5, there are three basic types of HTML lists. Each presents
    content in a slightly different way based on its type and the content:


    +   The **ordered list** is an indented list that displays numbers or letters
    before each list item. The ordered list is surrounded by `<ol>` tags and list
    items are enclosed in the `<li>` tag pair. This list type is often used to display
    numbered steps or levels of content.


    +   The **unordered list** is an indented list that displays a bullet or other
    symbol before each list item. The unordered list is surrounded by `<ul>` and `</ul>`
    tags and list items are enclosed in the `<li>` tag pair. This list type is often
    used to provide a visual cue for brief, specific, bits of information will follow.'
  merge: -1
