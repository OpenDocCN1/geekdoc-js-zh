  md: '# Describing Images with Text


    163


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_173_0.png)


    FIGURE 11.1

    When a web browser displays the HTML code shown in Listing 11.1, it renders the
    hd.jpg image.


    NOTE

    Theoretically, you can include an image from any web site within your pages. In
    cases, the image is retrieved from the other page''s web server whenever your
    page is displayed. You can do this, but you shouldn''t do it in a bad manners,
    because you are using the other person''s work for your own gain, it can also
    make your pages display more slowly. You have no control over when the image might
    be changed or deleted.


    If you guessed **img** stands for *image*, you''re right. **src** stands for *source*,
    which is a reference to the location of the image file. As discussed earlier in
    the book, an image is always stored in a file separate from the text, even though
    it appears to be part of the page when viewed in a browser.


    Just as with `<a href="...">` for hyperlinks, you can specify any Internet address
    in the **src** attribute of the `<img />` . Alternatively, if an image is located
    in the same folder as the HTML file, you can specify the filename. You can also
    use relative addresses, such as `/images/birdy.jpg` or `../smiley.gif`.


    # Describing Images with Text


    Each `<img>` in Listing 11.1 includes a short text, such as `alt=''Half Dome''`.
    The **alt** stands for *alternate text*, which is the message that appears in
    place of the image itself if it does not load. An image might not load if its
    address is incorrect, if the user has turned off automatic downloading in her
    web browser, or if the Internet connection is very slow and the data has yet to
    transfer. Figure 11.2 shows an example of *alt* text used in place of an image.


    If you are granted permission to repubish an image from another author, you may
    transfer a copy of the image to your project and use a local file reference, such
    as `<img src=''my-image.jpg''>` instead of `<http://otherserver.com/my/image.jpg>`.
    This advice is not applicable, however, if you use images—such as special photographs—as
    an image repository, like Flickr (`http://www.flickr.com/`). Services like Flickr
    also provide you with a URL for each image, and each URL includes Flickr''s domain
    in the address.'
