    \  <div id=\"wrapper\">\n    <div id=\"content_area\">CONTENT</div>\n    <div\
    \ id=\"left_side\">LEFT SIDE</div>\n    <div id=\"right_side\">RIGHT SIDE</div>\n\
    \  </div>\n  <div id=\"footer\">FOOTER</div>\n</body>\n</html>\n```\n\nFirst,\
    \ note that the style sheet for this layout is linked to with the <link> tag rather\
    \ than included in the template. As a template is used for more than one page,\
    \ you will be able to control the display elements of template in the most organized\
    \ way possible. This means you only need to change the definitions of these elements\
    \ in one place—the style sheet.\n\nNext, you'll notice that the basic HTML structure\
    \ is just that: extremely basic. And, truth to be, this basic HTML structure can\
    \ be used for a fixed layout, a liquid layout, or the fix/liquid hybrid you will\
    \ see here, because all of the actual styling that makes a layout fixed, liquid,\
    \ or hybrid happens in the style sheet.\n\nWhat you actually have with the HTML\
    \ structure in Listing 19.1 is an identification of the content areas you want\
    \ to include in your site. This planning is crucial to any development; you have\
    \ to know what you want to include before you think about the type of layout you\
    \ are going to use, let alone the specific styles that will be applied to that\
    \ layout.\n\nAt this stage, the layout.css file includes only this entry:\n\n\
    ```\nbody {\n  margin:0;\n  padding:0;\n}\n```\n\nIf you look at the HTML in Listing\
    \ 19.1 and to yourself “but those <div> elements will stack on top of each other\
    \ without any styles,” you are correct. As shown in Figure 19.6, there is no layout\
    \ to speak of."
