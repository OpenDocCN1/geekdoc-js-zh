    \ <h1> and <p> tags to get the feel for things.\n\n# TRY IT YOURSELF\n\nAdd Classes\
    \ to Your Style Sheet\n\n# Using Style IDs\n\nWhen you create custom style classes,\
    \ you can use those classes as many times you would like—they are not unique.\
    \ However, there will be some instances when you want to have precise control\
    \ over unique elements for layout or formatting purposes (or both). In such instances,\
    \ look to IDs instead of classes.\n\nA style ID is a custom set of formatting\
    \ specifications that can be applied only to one element in a web page. You can\
    \ use IDs across a set of pages but only once per time within each page.\n\nFor\
    \ example, suppose you have a title within the body of all your pages. Each page\
    \ has only one title, but all of the pages include one instance of that title.\
    \ Following is an example of a selector with an ID indicate, plus a property and\
    \ a value:\n\n```\np#title (font: 24pt Verdana, Geneva, Arial, sans-serif)\n```\n\
    \nNotice that this selector includes a hash, or pound sign (#), after p, followed\
    \ by a descriptive name. When referencing an ID in HTML code, simply identify\
    \ the name in the id attribute of an element, like so: \n\n```\n<p id=\"title\"\
    >Some Title Goes Here</p>\n```\n\nEverything between the opening and closing <p>\
    \ tags will appear in 24-point Verdana text—but only once on given page. You will\
    \ often see style IDs used to define specific parts of a page for layout purposes,\
    \ such as a header area, footer area, main body area, and so on. These types of\
    \ areas in a page will appear only once per page, using an ID reader rather than\
    \ a class is the appropriate choice."
