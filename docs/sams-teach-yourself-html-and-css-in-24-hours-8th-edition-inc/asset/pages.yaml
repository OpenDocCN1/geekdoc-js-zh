  md: '# Tweaking the Font


    are kept—no /> tags are needed. The <pre> tag gives you a quick and easy way to
    preserve the alignment of any monospaced text files you might want to transfer
    to a web page with minimum effort.


    CSS provides you with more robust methods for lining up text (and doing anything
    with text, actually), and you''ll learn more about them throughout Part III.


    # Tweaking the Font


    The <big>, <small>, and <tt> tags give you some rudimentary control over the size
    and appearance of the text on your pages. However, there might be times when you''d
    just like a bit more control over the size and appearance of your text. Before
    I get into the appropriate way to tinker with the font in XHTML code, let''s take
    a look at how things were done prior to CSS because you might still find examples
    of this method when you look at the source code for other sites. Remember, just
    because these older methods are in use don''t mean you should follow suit.


    After style sheets entered the picture, the now-passed <font> tag was used to
    control the fonts in web page. For example, the following HTML will change the
    size and color of some text on a page: <font size="5" color="purple">this text
    will be big and purple.\</font>


    As you can see, size and color attributes of the <font> tag made it possible to
    alter the font of the text without too much effort. Although this approach worked,
    it was replaced with a far superior approach to font formatting, which is CSS
    style rules. Following are a few of the main style rules used to control fonts:


    +   - font-family—Sets the family of the font.

    - font-size—Sets the size of the font.

    - color—Sets the color of the font.


    The font-family style allows you to set the typeface size to display text. You
    can and specify more than one value for this style (separated by commas) so that
    if the first font isn''t available on a user''s system, the browser can try an
    alternative. You''ve already seen this in previous lessons. Providing alternative
    fonts is important because each user potentially has a different set of fonts
    installed, at least beyond a core


    NOTE

    You''ll learn more about controlling the color of the text on your pages in Hour
    9, "Working with Colors." That shows you how to create your own custom colors
    and how to control the color of links.'
