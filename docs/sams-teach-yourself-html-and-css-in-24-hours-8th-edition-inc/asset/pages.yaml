  md: '# HOUR 23: Organizing and Managing a Web Site


    # Indenting Code for Clarity


    I have a confession. Throughout the book I''ve been carefully indoctinating you
    into an HTML code development style without really letting on. It''s time to spill
    the beans. You no doubt noticed a consistent pattern with respect to the indentation
    of all the HTML code in the book. More specifically, each child tag is indented
    to the right two spaces from its parent tag. Furthermore, content within a tag
    that spans more than one line is indented within the tag.


    The best way to learn the value of indentation is to see some HTML code without
    it. You know how the song goes—"you don''t know what you''ve got [''j] it''s gone."
    Anyway, here''s a simple table code without your indentation:


    ```

    <table>

    <tr><td>Cell One</td><td>Cell Two</td></tr>

    <tr><td>Cell Three</td><td>Cell Four</td></tr>

    </table>

    ```


    Not only is there no indentation, there also is no delineation between columns
    within the table. Now compare this code with the following code, which describes
    the table:


    ```

    <table>

    <tr>

    <td>Cell One</td>

    <td>Cell Two</td>

    </tr>

    <tr>

    <td>Cell Three</td>

    <td>Cell Four</td>

    </tr>

    </table>

    ```


    This heavily indented code makes plainly obvious how the rows and columns are
    divided up via `<tr>` and `<td>` tags.


    Consistent indentation might even be more important than comments when it comes
    to making your HTML code understandable and maintainable. And you don''t have
    to buy into this specific indentation strategy. If you''d rather use three or
    four spaces instead of two, that''s fine. And if you want to tighten things up
    a bit and not indent content within a tag, that also works. The main thing to
    take from this is that it''s important to develop a coding style of your own and
    then ruthlessly stick to it.


    If you work with other people or plan on working with other people web pages,
    you should consider getting together as a group to formulate a consistent coding
    style. That way everyone is on the same page, intended.'
