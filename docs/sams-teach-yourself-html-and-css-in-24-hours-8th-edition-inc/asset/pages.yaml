  md: '# Building a Frameset


    Frames have been used historically in lieu of standard, professional, accessible
    methods of web development and design. There is no reason to choose the lesser
    option when the better option of CSS layout is available.


    For these (and other) reasons, frames have been removed from the HTML 5 standard.
    The antiquated `<frame />`, `<frameset>`, and `<noframes>` tags will not be a
    problem in the future.


    Despite these shortcomings, you will learn in this hour how to create a very simple
    framed site. It is quite likely that you will still encounter framed sites, and
    you might need to know how to re-create the "look and feel" of the site without
    using frames. In that case, it is important to understand how frames are constructed
    so you can successfully deconstruct them.


    Additionally, you will learn about a type of frame—the `<iframe>`—that serve an
    important purpose and will still be present in HTML 5.


    Later in this book, you will learn how to use XHTML and CSS to produce the same
    functionality without using the frames. For now, follow along the construction
    of this simple framed site so that you can learn the process you should to undo
    and re-create it a different way.


    # Building a Frameset


    This section shows you how to create the simple framed site in Figures 13.1 and
    13.2. The contents of each frame were created as ordinary HTML pages. The pages
    are top.html (for the navigation), home.html, products.html, services.html, and
    contact.html. These pages don''t contain any tags you haven''t already seen in
    other hours. A special page known as a frameset document was used to put the pages
    together; in this case, that document is index.html.


    # Creating a Frameset Document


    A frameset document is an HTML page that instructs the web browser to split its
    window into multiple frames and specifies which web page should be displayed in
    each frame.


    A frameset document actually has no content. It only tells the browser which other
    pages to load and how to arrange them in the browser'
