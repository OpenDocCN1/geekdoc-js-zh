  md: '# Controlling Table Sizes


    In this example, both words are in bold and the word hello is italicized as well.
    Of course, you don''t have to just apply styles at the table level. The font-weight:bold
    style could just as easily be applied to each cell individually you could repeat
    style="font-weight:bold" in each cell or create a class in your style sheet and
    use class="classname" in each cell—it’s your choice.


    # Controlling Table Sizes


    When a table is not specified, the size of a table and its individuals automatically
    expand to fit the data you place into it. However, you can choose to control the
    exact size of the entire table by using width and/or height in the <table> tag.
    You can also control the size of each cell by putting width and height styles
    in the individual <td> tags. The width and height styles can be specified as either
    pixels or percentages. For example, the following code creates a table 500 pixels
    and 400 pixels height:


    ```

    <table style="width:500px; height:400px">

    ```


    To make the first cell of 20% of the total table width and the sec-cell of the
    table width, type the following:


    ```

    <table style="width:100%">

    <tr>

    <td style="width:20%">skinny cell</td>

    <td style="width:80%">fat cell</td>

    </tr>

    </table>

    ```


    Notice that the table is sized to 100%, which ensures the table fills the entire
    width of the browser. When you use percentages instead of fixed pixel sizes, the
    table will resize automatically to fit any browser window while maintaining the
    aesthetic balance you’re after. In this case, the two cells within the table are
    automatically resized to 20% and 80% of the total table width, respectively.


    In Listing 7.2, the table size from Listing 7.1 is expanded to show specif-ic
    over table cell widths.


    NOTE

    There are actually width and height attributes that were deprecated in the move
    to XHTML, but you might still see them when you look at another designer’s code.
    These attributes still work in web browsers but you should use the width and height
    properties instead, because they represent the appropriate use of XHTML.'
