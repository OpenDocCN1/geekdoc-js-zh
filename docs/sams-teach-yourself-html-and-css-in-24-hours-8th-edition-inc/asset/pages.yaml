  md: '# HOUR 18: Using Mouse Actions to Modify Text Display


    Note that the first link in the text has a class associated with it. That class
    is called tip—that name differentiates it from other links that do not contain
    tooltip. However, this is a class and not id, it could be used for all of the
    other links in the page.


    Note that the tip class itself has a position and z-index. The position values
    (relative) ensures that it remains as naturally it occurs in the text, the z-index,
    compared to the z-index used by other related styles, ensures that the text of
    links below other tip class has with higher z-index value, for example.


    The next two styles relate to the <span> tag. Within the text <span> tag within
    it will not be displayed the tooltip is invoked by hovering over the visible link.
    For the example, the link looks like:


    ```

    <a class="tip" href="http://en.wikipedia.org/wiki/Palouse">Palouse <span>Learn
    more about the Palouse!</span></a>

    ```


    When you look at this bit of HTML, it looks like the words "Palouse Learn about
    the Palouse!" should all be a link. However, since "Learn about the Palouse!"
    is enclosed in the <span> tag, and a specific style is applied to that <span>
    in the style sheet, the words do not appear until the user''s mouse hovers over
    the actual link (the word "Palouse"). Figure 18.2 displays this result.


    The text "Learn about the Palouse! is placed in a <span> tag in the HTML but is
    styled within the style sheet. Namely, the a.tip:hover span selector creates a
    box that is 150 pixels wide with a grey background and black border. This box
    appears 20 pixels from the top of the element and 25 pixels from the left of the
    parent element. This creates the tooltip.'
