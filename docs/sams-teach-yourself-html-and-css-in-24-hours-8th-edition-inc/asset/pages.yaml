  md: '# Aligning Images


    # # Specifying Image Height and Width


    Because text moves over the Internet much faster than graphics, most web browsers
    display the text on a page before they display images. This gives users something
    to read right while they''re waiting to see the pictures, which makes the whole
    page seem to load faster.


    You can make that everything on your page appears as quickly as possible and in
    the right places by explicitly stating each image''s height and width. That, a
    web browser can immediately and accurately make room for each image as it lays
    out the page and it waits for the images to finish transferring.


    For each image you want to include in your site, you can use your graphics to
    determine its exact height and width in pixels. You might also be able to find
    these image properties using system tools. For example, in Windows, you can see
    an image''s height and width by clicking on the image, selecting Properties, and
    then selecting Details. You know the height and width of an image, you can include
    dimensions in the  /> tag, like this:


    ```

    <img src="myfile.gif" alt="Fine Picture" width="200" height="100" />

    ```


    # # Aligning Images


    Just as you can align text on a page, you can align images on the page using special
    attributes. Not only can you align images horizontally, but you can align them
    vertically with respect to text and other images that surround them.


    # # Horizontal Image Alignment


    As discussed in Hour 5, "Working with Text Blocks and Lists," you can use <div
    style="text-align:center";,<div style="text-align:right";,<div style="text-align:left">
    to align an element to the center, to the right margin, or to the left margin.
    These style settings affect both text and images and can be used within the <p>
    tag as well.


    Like text, images are normally lined up with the left margin unless style="text-align:center"
    or style="text-align:right" setting indicates that they should be centered or
    right-justified. In other words, left is the default value of the text-align style
    property.


    > The height and width specified for an image don''t have to match the image''s
    actual height and width. A web browser will try to squash or stretch the image
    to display whatever you specify. However, this is generally a bad idea because
    browsers aren''t perfectly good at resizing images. If you want to display a small
    image, you''re definitely better off resizing in an image editor.'
