- img_proc: true
  md: '# HOUR 14: Working with Margins, Padding, Alignment, and Floating


    You saw examples of these style properties in action—aligning images—in Hour 11,
    but it doesn''t hurt to mention these properties again because alignment plays
    a role in overall page design as well.


    As a refresher, using text-align aligns elements horizontally within its bounding
    area and it can be set to left, right, center, or justify.


    The vertical-align property is similar to text-align except that it is used to
    align elements vertically. The vertical-align property specifies how an element
    is aligned with its parent, or in some cases, the current line of elements on
    the page. Current line refers to the vertical placement of elements that appear
    within the same parent element—in other words, inline elements. If several inline
    elements appear on the same line, you can set their vertical alignments to align
    them all vertically. A good example would be a row of images that appear one after
    the next—the vertical-align property allows you to align them vertically.


    Following are common values for use with the vertical-align property:


    +   - top—Aligns the top of an element with the current line.


    +   - middle—Aligns the middle of an element with the middle of its parent.


    +   - bottom—Aligns the bottom of an element with the current line.


    +   - top—Aligns the top of an element with the top of its parent.


    +   - baseline—Aligns the baseline of an element with the baseline of its parent.


    +   - text-bottom—Aligns the bottom of an element with the bottom of its parent.


    Alignment works in conjunction with margins, padding, and—as you will learn in
    the next section—the float property allows to you to maintain control over your
    design.


    # Understanding the Float Property


    Understanding the float property is fundamental to understanding CSS-based layout
    and design; it is one of the last pieces in the puzzle of how these elements fit
    together. Briefly stated, the float property allows elements to be moved around
    in the design such that other elements wrap around them. You will often find float
    used in conjunction with images (as you saw in Hour 11), but you can—and many
    designers do—float all sorts of elements in their layout.'
