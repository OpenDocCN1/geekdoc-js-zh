  md: '# Using Hexadecimal Values for Colors


    If you search for bad web site examples in your search engine, you will find many
    sites that collect examples of bad design and explain why such a site should be
    in a Hall of Shame rather than a Hall of Fame. Many sites are considered “bad”
    because of their visual displays, and that display begins with color selection.
    Therefore, understanding colors, as well as the nuances of their specification
    and use, is a crucial step to creating a good web site.


    # Using Hexadecimal Values for Colors


    To remain standards-compliant, as well as to retain precise control over the colors
    in your web site, you can reference colors by their hexadecimal value. The hexadecimal
    value of a color is an indication of how much red, green, and blue should be mixed
    into each color. It works a little like Play-Doh—mix in the amounts of red, green,
    and blue you want to get the appropriate color.


    The hexadecimal color format is #rrggbb, in which rr, gg, and bb are two-digit
    hexadecimal values for the red (rr), green (gg), and blue (bb) components of the
    color. If you''re not familiar with hexadecimal numbers, don’t sweat it. Just
    remember that FF is the maximum and 00 is the minimum. Use one of the following
    codes for each component:


    +   * FF means full brightness.

    * CC means 80 percent brightness.

    * 99 means 60 percent brightness.

    * 66 means 40 percent brightness.

    * 33 means 20 percent brightness.

    * 00 means none of this color component.


    For example, bright is #FF0000, dark green is #003300, bluish-purple is #660099,
    and medium-gray is #999999. To make a page with a back-ground and dark green text,
    the HTML code would look like the following:


    ```

    <body style="background-color:#FF0000; color:#003300">

    ```


    Although only six examples of two-digit hexadecimal values are shown here, there
    are actually 225 combinations of two-digit hexadecimal val-'
