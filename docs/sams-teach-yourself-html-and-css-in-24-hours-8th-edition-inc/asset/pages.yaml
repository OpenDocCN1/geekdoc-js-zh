  md: '# Distributing Content without a Web Server


    # Publishing Content Locally


    Let''s assume you need to create a local site that you want to distribute on a
    USB drive. Even the cheapest USB drives hold so much data these—and basic hypertext
    files are quite small—that you can distribute an entire site and a fully-functioning
    web browser on all one little device.


    Simply think of the directory structure of your USB drive just as would the directory
    structure of your web server. The top-level of the USB drive structure can be
    your document root. Or if you are distributing a web browser along with the content,
    you have two directories—for example, one named browser and one named content.
    In that case, the content would be your document root. Within the document root,
    you could add subfolders in which you place content and other multimedia assets.


    It''s important to maintain a good organization with a local site as it is with
    a remote web site, so that you avoid broken links in your HTML files. You will
    learn more about the specifics of linking files in a later hour.


    # Publishing Content on a Blog


    You might have a blog hosted by a third-party, such as Blogger or WordPress (among
    others), and thus have already published content without having a dedicated web
    server or even knowing any HTML. The services offer visual editors in addition
    to source editors, meaning that you can type your words and add visual formatting
    such as bold, italics, or colors without knowing the HTML for these actions. But
    still, the content becomes actual HTML when you click the Publish button in these
    editors.


    However, with the knowledge you acquire throughout this book, your blogging will
    be enhanced because you will be able to use the source editor for your blog post
    content and blog templates, thus affording you more control over the look and
    feel of that content. These actions occur differently than the process you learned
    for creating an HTML file and uploading it via FTP to your own dedicated web server,
    but I would be remiss if I did not note that blogging is, in fact, a form of web
    publishing.


    > NOTE Distributing a web browser isn''t required when creating and distributing
    a local site, although it''s a nice touch. You can reasonably assume that users
    have own web browsers and open the index.html file in a directory to start the
    hyperlinked content. However, if you would like to distribute a web browser on
    the USB drive, go to http://www.portable.com/ and look for Portable Firefox.'
  merge: -1
