    \n# Using Background Images\n\nAs you learned in the previous hour, you can use\
    \ background images to act as a sort of “wallpaper” in a container element, so\
    \ that the text or other images appear on top of this underlying design.\n\nThe\
    \ basic style properties that work to create a background are:\n\n+   - background-color:\
    \ specifies the background color of the element. While not image-related, it is\
    \ part of the set of background-related properties.\n- background-image: specifies\
    \ the image to use as the background of the element using the following syntax:\
    \ url('imagename.gif').\n- repeat: specifies how the image should repeat, horizontally\
    \ and vertically. By default (without specifying anything), background images\
    \ will repeat both horizontally and vertically. Other options are: repeat (same\
    \ as default), repeat-x (horizontal), repeat-y (vertical), and no-repeat (only\
    \ one appearance of the graphic).\n- background-position: specifies where the\
    \ image should be initially placed relative to its container. Options include:\
    \ top-left, top-center, top-right, center-left, center-center, center-right, bottom-left,\
    \ bottom-center, bottom-right, and specific pixel and percentages.\n\nWhen specifying\
    \ a background image, you can put all of these specifications together into one\
    \ property, like so:\n\n```\n{\n  background: #ffffff url('imagename.gif') no-repeat\
    \ top right;\n}\n```"
