    # Managing the Flow of Text


    Now you''ve seen some examples of placing elements relative to other elements
    or placing them absolutely, it''s time to revisit the flow of text around elements.
    The conceptual current line is an invisible line used to place elements on a page.
    This line has to do with the flow of elements on a page; it comes into play as
    elements are arranged next to each other and down the page. Part of the flow of
    elements is the flow of text on a page. When you mix text with other elements
    (such as images), it''s important to control how the text flows around those elements.


    You''ve already seen two of these style properties in Hour 14. Following are some
    style properties that provide you with control over text flow:


    +   - float—Determines how text flows around an element.

    - clear—Stops the flow of text around an element.

    - overflow—Controls the overflow of text when an element is too small to contain
    all the text.


    The float property is used to control how text flows around an element. It can
    be set to left or right. These values determine where to position an element with
    respect to flowing text. So setting an image''s float property to left positions
    the image to the left of the text.


    As learned in the previous hour, you can prevent text from flowing next to an
    element by using the clear property, which can be set to none, left, right, or
    both. The default value for the clear property is none, indicating that text is
    to flow with no special considerations for the element. The left value causes
    text to stop flowing around an element until the left side of the page is free
    of the element. Likewise, the right value means that text is not to flow around
    the right side of the element. The both value indicates that text isn''t to flow
    around either side of the element.


    The overflow property handles overflow text, which doesn''t fit within its rectangular
    area; this can happen if you set the width or height of an element too small.
    The overflow property can be set to visible, hidden, or scroll. The visible setting
    automatically enlarges the element so that the overflow text fit within it; this
    is the default setting for the property.'
  merge: -1
