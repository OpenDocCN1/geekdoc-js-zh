    # Vertical Image Alignment


    Sometimes, you might want to insert a small image in the middle of a line

    of text; or you might like to put a single line of text next to an image as a

    caption. In either case, it would be handy to have control over

    the text and images line up vertically. Should the bottom of the image

    with the bottom of the letters, or should the text and images all be

    arranged so that their lines align up? You can choose between these and

    several other options:


    +   - To line up the top of an image with the top of the tallest image or let-

    er on the same line, use `<img style="vertical-align:text-top">`.


    +   - To line up the bottom of an image with the bottom of the text, use

    `<img style="vertical-align:text-bottom">`.


    +   - To line up the middle of an image with the overall vertical center of

    everything on the line, use `<img style="vertical-align:middle">`.


    +   - To line up the bottom of an image with the baseline of the text, use

    `<img style="vertical-align:baseline">`.


    The `vertical-align` style property-

    also supports values of `top

    and `bottom`, which can be used

    align images with the overall

    top or bottom of a line ele-

    regardless of any text on

    the line.


    All of these options are used in Listing 11.3 and displayed in Figure

    11.4. Four thumbnail images are now listed vertically down the page,

