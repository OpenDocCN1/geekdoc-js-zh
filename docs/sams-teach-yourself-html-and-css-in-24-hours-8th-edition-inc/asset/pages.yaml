    # Keeping Everything Aligned


    Knowing that content on a web page doesn''t always fill the width of the rectangular
    area in which it is displayed, it is often helpful to control the alignment of
    the content. Even if text within a rectangular area extends to multiple lines,
    alignment still enters the picture because you might want the text left-justified,
    right-justified, or centered. There are two style properties that allow you to
    control the alignment of elements: `text-align` and `vertical-align`.'
