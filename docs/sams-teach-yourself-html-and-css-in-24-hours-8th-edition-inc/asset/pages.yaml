  md: '# HOUR 5: Working with Text Blocks and Lists


    # Summary


    In this hour, you learned that attributes are used to specify options and special
    behavior of many HTML tags and you also learned to use the style attribute with
    CSS rules to align text. You also learned how to combine three basic types of
    HTML lists: ordered lists, unordered lists, and definition lists. Lists can be
    placed within other lists to create outlines and other complex arrangements of
    text.


    Table 5.1 summarizes the tags and attributes discussed in this hour. Don''t feel
    like you have to memorize all these tags, by the way! That''s why you have this
    book: You can look up the tags when you need. Remember that all the HTML tags
    are listed in Appendix B, “Complete XHTML 1.1 and CSS 2 Quick Reference.”


    Table 5.1 HTML Tags and Attributes Covered in Hour 5


    | Tag/Attribute | Function |

    |---|---|

    | `<div>...</div>` | A region of text to be formatted. |

    | `<dl>...</dl>` | A definition list. |

    | `<dt>...</dt>` | A definition term, as part of a definition list. |

    | `<dd>...</dd>` | The corresponding definition to a definition term, as part
    of a definition list. |

    | `<ol>...</ol>` | An ordered (numbered) list. |

    | `<ul>...</ul>` | An unordered (bulleted) list. |

    | `<li>...//</li>` | A list item for use with <ol> or <ul>.|


    # Attributes


    style="text-align:alignment" Align text to center, left, or right. (Can also be
    used with <p>, <h1>, <h2>, <h3>, and so on.)


    style="list-style-type:numtype" The types of numbers used to label the list. Possible
    values are decimal, lower-roman, upper-roman, lower-alpha, upper-alpha, and none.


    style="list-style-type:bullettype" The bullet design to mark list items. Possible
    values are disc, circle, square, and none.


    style="list-style-type:type" The type of bullet or number used to label list item.
    Possible values are disc, circle, square, decimal, lower-roman, upper-roman, lower-alpha,
    upper-alpha, and none.'
