  md: '# HOUR 7: Using Tables to Display Information


    # Creating a Simple Table


    TIP


    There are some style properties that allow you to take much more control over
    table borders. For example, you can set the border `border-width`, style `border-style`,
    and color `border-color` properties to work but you have to apply them to each
    table element, which can be cumbersome even if you use classes for your row or
    cell elements.


    A table consists of rows of information with individual cells inside. To make
    tables, you have to start with a `<table>` tag. Of course, you must end your tables
    with the `</table>` tag. If you want the table to have a border, use the `border`
    attribute to specify the width of the border. A pixel size of `none` (or leaving
    the `border` attribute out entirely) will make the border invisible, which is
    often handy when you are using a table as a layout tool.


    With the `<table>` tag, the next thing you need is the `<tr>` tag. The `<tr>`
    tag creates a row, which contains one or more of cells before the closing `</tr>`
    tag. To create these individual cells, use the `<td>` tag for table data. A `<td>`
    cell is a rectangular region that can contain any text, images, and HTML tags.
    Multiple cells within a row form columns.


    There is one more basic task involved in tables. The `<th>` tag works exactly
    like `<td>` except `<th>` indicates that the cell is part of the heading. Most
    web browsers render the text in `<th>` as centered and boldface.


    You can create as many cells as you want, but each row in a table should have
    the same number of columns as the other rows. The HTML code shown in Listing 7.1
    creates a simple table using only the four tags I''ve mentioned thus far. Figure
    7.1 shows the resulting page as viewed in a web browser.


    # Listing 7.1 Creating Tables with the `<table>`, `<tr>`, `<td>`, and `<th>`


    ```

    <xml version="1.0" encoding="UTF-8?>

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.1//EN"

    "http://www.w3.org/TR/xhtml1/DTD.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">

    <head>

    <title>Baseball Standings</title>

    </head>

    <body>

    <h1>Baseball Standings</h1>

    <table>

    <tr>

    <th>Team</th>

    <th>W</th>

    ```'
