  md: '# HOUR 24

    Hel People Find

    Your Web Pages


    Your web pages are ultimately only as useful as they are accessible—if no one
    can find your pages, your hard work in creating a useful architecture, providing
    interesting exclusively, and coding correctly will be for naught. The additional
    HTML tags you discover in this hour won''t make any visible difference in your
    web pages, but they are extremely important in that they help your audience easily
    find your web pages. For most web site creators, this is the easiest—but most
    important—hour in the book. You''ll learn how to add elements to your pages and
    how to construct your site architecture in such a way as to increase the possibility
    that search engines return links to your site when someone searches for engine
    optimization (SEO). For words related to your topic or company; this is called
    search engine optimization. Who try to sell these services to you, there are no
    magic secrets that guarantee you''ll be at the top of every search list. However,
    there are a series of best practices that you can do on your own to make sure
    your site is as easy to find as possible.


    +   WHAT YOU''LL LEARN IN THIS HOUR:

    * How to hyperlink your site

    * How to list your pages with the major search sites

    * How to optimize your site for search engines


    # Publicizing Your Web Site


    Presumably, you want your web site to attract someone''s attention, or you wouldn''t
    bother to create it in the first place. However, if you are placing your pages
    only exclusively on a local network or corporate intranet, or you are distributing
    your site exclusively on removable media, helping users find your pages might
    not be much of a problem. But if you are adding the content of your web site to
    the billions of other pages of content indexed by search engines, bringing your
    intended audience to your site is a very challenge indeed.'
