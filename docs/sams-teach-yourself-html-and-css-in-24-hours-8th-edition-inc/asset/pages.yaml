  md: '# Workshop


    The workshop contains questions and activities to help you solidify your understanding
    of the material covered. Try to answer all questions before looking at the “Answers”
    section that follows.


    # Quiz


    +   1. What code would you use to create a style sheet to specify 30-point blue
    Arial headings and all other text in double-spaced, 10-point blue Roman (or the
    default browser font)?


    +   2. If you saved the style you made for Question 1 as corporate.css, how would
    you apply it to a web page named intro.html?


    +   3. How many different ways are there to ensure style rules are applied to
    your content?


    # Answers


    +   1. Your style sheet would include:


    ```

    h1 { font: 30pt blue Arial; }

    body { font: 10pt blue; }

    ```


    +   2. Put the following tag between the <head> and </head> tags of the intro.html
    document:

    link rel="stylesheet" type="text/css" href="corporate.css" />


    +   3. Externally, internally, and inline.


    # Exercises


    +   Develop a standard style sheet for your web site and link it to all your pages.(Use
    internal style sheets and/or inline styles for pages that need to deviate from
    it.) If you work for a corporation, chances are it has already developed font
    and style specifications for printed materials. Get a copy of these specifications
    and follow them for company web pages, too.


    +   Be sure to explore the official style sheet specs at http://www.w3.org/Style/CSS/
    and try to some of the more esoteric style properties not covered in this hour.'
