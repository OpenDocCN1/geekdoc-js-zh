  md: '# Summary


    This hour has given you examples and explanations to help you organize your web
    pages into a coherent site that is informative, attractive, and easy to navigate.
    Web users have grown to become quite savvy in terms of expecting well-designed
    web sites, and they will quickly abandon your site if they experience a poor design
    that is difficult to navigate.


    This hour also discussed the importance of making your HTML code easy to maintain
    by adding comments and indentation Comments are important not only as a reminder
    for you when you revisit code later but also as instruction if someone else should
    inherit your code. Indentation might seem like an aesthetic issue, but it can
    truly help you to quickly analyze and understand the structure of a web page at
    a glance.


    # Q&A


    +   - I''ve seen pages that ask viewers to change the width of their browser window
    or adjust other settings before proceeding beyond the home page. Why do you do
    this?


    +   - The snark response is that the site creators do not care about their users.
    Never force your users to do differently than they are doing with their browsers,
    and especially never, ever resize the browser automatically. Those are some of
    the biggest usability-nos. When sites tell you to change your settings, it is
    because the site creators think they can offer a better presentation if they''re
    given specific control over the size of users'' windows or fonts. Of course, few
    people better to change their settings when told to do so (as they shouldn''t),
    these sites often look weird or unreadable. You''ll be much better off using the
    tips you learn in this book to make your site readable and attractive using any
    window size and using a wide variety of browser settings. The better organized
    your site is, the more usable it will be for visitors.


    +   - Won''t lots of comments and spaces make my pages load slower when someone
    views them?


    +   - A size of a little extra text in your pages is negligible when compared
    to other, chunkier web page resources (such as images and multimedia). Besides,
    slower dial-up modem connections typically do a decent job of compressing text
    when transmitting it, so adding spaces to format your HTML doesn''t usually change
    the transfer time at all. You''d have to type hundreds of comment words to cause'
  merge: -1
  pgno: 377
- img_proc: true
  md: 'even one extra second of delay in loading a page. And keep in mind that with
    the broadband connections (cable, DSL, and so on) that many people know now, text
    travels extremely fast. It’s the graphics that slows down, squeeze your images
    as tightly as you can (refer to Hour 10), but use text comments freely.


    # # Workshop


    The workshop contains quiz questions and activities to help you solidify your
    understanding of the material covered. Try to answer all questions before looking
    at the “Answers” section that follows.


    # # Quiz


    +   1. What are three ways to ensure all your pages form a single cohesive web
    site?

    2. What two types of information should always be included in your home page?

    3. You want to say, “Don’t change this image of me. It’s my only chance at immortality,”
    to future editors of a web page, but you don’t want users who view the page to
    see that message. How would you do?


    # # Answers


    +   1. Use consistent background, colors, fonts and styles. Repeat the same link
    words or graphics on the top of the page that the link leads to. Repeat the same
    small header, buttons, or other element on every page of the site.

    2. Use identifying information so that users can immediately see the name of the
    site and what it is about. Also, whatever the most important message you want
    to convey to your intended audience, state it directly and concisely. Whether
    it’s your mission statement or trademarked marketing slogan, make sure that it
    is in plain view here.

    3. Put the following comment immediately before the `<img />` tag:

    ```html

    <!-- Don''t change this image of me.

    It''s my only chance at immortality. -->

    ```'
