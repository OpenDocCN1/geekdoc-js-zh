  md: '# Q&A


    Table 13.1 HTML Tags and Attributes Covered in Hour 13


    | Attributes | |

    | --- | --- |

    | noresize="no" | Prevents the user from resizing this frame (and possibly adjacent
    frames) with the mouse. |

    | <frameset>...</frameset> | Divides the main window into a set of frames that
    can display a separate document. |

    | rows="numrows" | Splits the window or frame vertically into a number of rows
    specified by a number (such as 7), a percentage of the total window width (such
    as 25%), or an asterisk (*) indicating that a frame should take up all the remaining
    space or divide the space between frames (if multiple frames are specified). |

    | cols="numcols" | Works similar to rows, except that the window or frame is split
    horizontally into columns. |

    | frameborder="yes/no" | Specifies whether to display a border for a frame. Options
    are 1 (yes) and 0 (no). |

    | <noframes>...</noframes> | Provides an alternative document body in documents
    for browsers that do not support frames (usually includes <body>...</body>). |

    | <iframe>...</iframe> | Creates an inline frame; accepts all the same attributes
    as does <frame /> and can be styled with CSS.|


    # Q&A


    +   * Can I display other users'' web pages in one frame and my own pages in another
    frame at the same time? What if other sites use frames, too?


    You can load any document from anywhere on the Internet (or an intranet) if the
    document is a frameset, frames are sized to fit within the existing frame which
    you load it.


    For example, you could post a list of your favorite pages in one frame and use
    a separate frame to display the pages that those links refer to. This makes it
    easy to provide links to other sites without risking that someone will get lost
    and never come back to your own site.


    You should also avoid framing somebody''s pages so that they appear to be part
    of your own site might get you in legal trouble,'
