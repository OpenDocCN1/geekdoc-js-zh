  md: '# Summary


    In this hour you learned how to use CSS to turn simple HTML unordered lists into
    horizontal and vertical navigation. By using CSS instead of JavaScript or other
    technologies, you will have more flexibility in both the display and maintenance
    of your site. Throughout this hour you learned that a few entries in your style
    sheet, you can turn underlined text links into areas with borders and background
    colors and other text styles. Additionally, you learned how to present nested
    lists within menus.


    # Q&A


    +   - Yes. You can use graphics within the HTML text of the list item or background
    images within the <li> element. You can style your navigation elements using any
    other style list element. The only differences between an HTML unordered list
    and a CSS-based horizontal or vertical navigation list is that you are calling
    it that and you are using the unordered list for a specific purpose outside the
    body of the text. Along with that, then you style the list to show the user that
    it is indeed something different—and you can do that with small graphics to accent
    your lists.


    Where can I find more examples of what I can do with lists?


    +   - The last time I checked, typing CSS navigation in a search engine returned
    approximately 44 million results. Here are a few starting places:

    - List Apart’s CSS articles at http://www.alistapart.com/topics/code/

    - Maxdesign’s CSS Listomatic at http://css.maxdesign.com/listomatic/

    - Vitaly Friedman’s CSS Showcase at http://www.alvit.de/css-showcase/'
  merge: -1
  pgno: 284
