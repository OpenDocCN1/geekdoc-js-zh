  md: '# HOUR 1

    Understanding How the Web Works


    Before learning the intricacies of HTML and CSS, it is important that you gain
    a solid understanding of the technologies that help transform these plain-text
    files to the rich multimedia displays you see on your computer or handheld device
    when browsing the World Wide Web.


    A file containing HTML and CSS is useless without a web browser, and no one will
    besides yourself see your content unless a web server is involved. Web servers
    make your content available to others who, in turn, use their web browsers to
    navigate to an address and wait for the server to send information to them. You
    will be intimately involved in this process, as you must create files and then
    put them on a server to make them available in the first place, and you must ensure
    that your content will appear to the end-user as intended.


    # WHAT YOU''LL LEARN IN THIS HOUR:


    +   - A very brief history of the World Wide Web


    +   - What is meant by the term "web page," and why that term doesn''t always
    reflect all the content involved


    +   - How content gets from your personal computer to someone else''s web browser


    +   - How to select a web hosting provider


    +   - How different browsers and device types can affect your content


    # A Brief History of HTML and the World Wide Web


    Once upon a time, back when there weren''t any footprints on the moon, some foresighted
    folks decided to see whether they could connect several major computer networks
    together. I''ll spare you the names and stories (there are plenty of both), but
    the eventual result was the "mother of all networks," we call the Internet.


    Until 1990, accessing information through the Internet was a rather technical
    affair. It was so hard, in fact, even Ph.D.-holding physicists were often frustrated
    when trying to swap data. One such physicist, the famous (and knighted) Sir Tim
    Berners-Lee, cooked up a way to easily cross-reference text on the Internet through
    "hypertext" links.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# HOUR 1: Understanding How the Web Works


    This wasn''t a new idea, but his simple Hypertext Markup Language (HTML) managed
    to thrive while more ambitious hypertext projects flourished. Hypertext originally
    meant text stored in electronic form with cross-reference links between pages.
    It is now a broader term that refers to just any object (text, images, files,
    and so on) that can be linked to other objects. Hypertext Markup Language is a
    language for describing how text, graphics, and files containing information are
    organized and linked together.


    For more information about the history of the World Web, see the Wikipedia article
    on this topic: http://en.wikipedia.org/wiki/History_of_the_Web.


    By 1993, only 100 or so computers throughout the world were equipped to serve
    HTML pages. These interlinked pages were dubbed the World Wide Web (WWW), and
    several web browser programs had been written to allow people to view them. Because
    of the growing popularity of the Web, a few programmers soon wrote web browsers
    that could view images along with text. From that point, the continued development
    of browser software and the standardization of the HTML—and XHTML—languages led
    us to the world we live today, in which more than 110 million web server answer
    requests for more than 25 billion text and multimedia files.


    These few paragraphs are a brief history of what has been a remarkable period
    of time. Today''s college freshmen have never known a time in which the World
    Wide Web didn''t exist, and the idea of "always-on" information and ubiquitous
    computing will shape all aspects of our lives forward. Instead of seeing web content
    creation and management as a set of skills possessed only by a few technically-oriented
    folks (ok, call them "geeks" if you will), the end of this book you will see that
    these skills are that anyone can master, regardless of inherent genius.


    # Creating Web Content


    You have noticed the use of the term "web content" rather than "web pages"—that
    was intentional. Although we talk of "visiting a web page," what we really mean
    is something like "looking at all the text and images at one address on our computer."
    The text we read, and the images that we see, are rendered by our web browsers,
    which are given certain instructions in individual files.


    Those files contain text that is marked up, or surrounded by, HTML codes that
    tell the browser how to display the text—as a heading, as a paragraph, in a red
    font, and so on. Some HTML markup tells the browser to display'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Understanding Web Content Delivery


    an image or video file rather than plain text, which brings me back to the point—different
    types of content are sent to your web browser, so simply saying “web page” doesn’t
    begin to cover it. Here we use the term “web content” instead, to cover the full
    range of text, image, audio, video, and other media found online.


    In later lessons, you will learn the basics of linking to or creating the various
    types of multimedia web content found in web sites. All you need to remember this
    point is that you are in control of the user sees when visiting your web site.
    Beginning with the file that contains text to display or codes that the server
    serve to send a graphic along the user’s web browser, you have to plan, design,
    and implement all the pieces that will eventually make your presence present.
    As you will learn throughout this book, it is not a difficult process as long
    as you understand all the little steps along the way.


    In its most fundamental form, web content begins with a simple text file containing
    HTML or XHTML markup. XHTML is another flavor of HTML; the “X” stands for extensible,
    and you will learn more about it as you continue through the lessons. The most
    important thing to know from the set is all the examples in this book are HTML
    and XHTML compatible, meaning they will be rendered similarly both now and in
    the future by any newer generations of web browsers. That is one of the benefits
    of writing standards-compliant code: you do not have to worry about having to
    go back to your code in the future and change it because it “doesn’t work.” Your
    code will likely always “work” for as long as web browsers adhere to standards
    (hopefully a long time).


    # Understanding Web Content Delivery


    Several processes occur, in many different locations, to produce web content that
    you can see. These processes occur very quickly—on the order of milliseconds—and
    behind the scenes. In other words, while we might think all we are doing is opening
    a web browser, typing in a web address, and instantaneously seeing the content
    we requested, technology in the background is working hard on our behalf. Figure
    1.1 shows the basic interaction between a browser and a server.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# HOUR 1: Understanding How the Web Works


    FIGURE 1.1

    A browser request and a server response.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_14_0.png)


    However, there are several steps in the process—and potentially several trips
    between the browser and server—before you see the entire content of the site you
    requested.


    Suppose you want to do a Google search, so you dutifully type http://www.google.com
    in the address bar or select the Google bookmark from your bookmarks list. Almost
    immediately, your browser will show you something like what''s shown in Figure
    1.2.


    FIGURE 1.2

    Visiting www.google.com.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_14_1.png)


    Figure 1.2 shows a web site that contains text plus one image (the Google logo).
    A simple version of the processes that occurred to retrieve that text and image
    from a web server and display it on your screen is as follows:


    +   1. Your web browser sends a request for the index.html file located at the
    http://www.google.com/ address. The index.html file does not have to be part of
    the address that you type in the address bar; you’ll learn more about the index.html
    file in Hour 2, “Publishing Web Content."'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Understanding Web Content Delivery


    +   2. After receiving the request for a specific file, the web server process
    looks in its directory contents for the specific file, opens it, and sends the
    content of that file back to your web browser.


    +   3. The web browser receives the content of the index.html file, which is marked
    up with HTML codes, and renders the content, the browser happens upon the HTML
    code for the Google logo, which you can see in Figure 1.2. The HTML code looks
    like this:


    ```

    <img src="/logos/logo.gif" width="384" height="121" border="0" alt="Google"/>

    ```


    The tag attributes tell the filer source location (src) width (width) height (height),
    border (border) necessary to display the logo. You will learn more about attributes
    throughout later lessons.


    +   4. The browser looks at the src in the <img> tag to find the source location.
    In this case image logo.gif can be found in the "logos" directory at the same
    web address (www.google.com) from which the browser retrieved the HTML file.


    +   5. The browser requests the file at http://www.google.com/logos/logo.gif web
    address.


    +   6. The web server interprets that request, finds the file, and sends the contents
    of that file to the web browser requested it.


    +   7. The web browser displays the image on your monitor.


    As you can see in the description of the web content delivery process, browsers
    do more than simply act as picture frames through which you can view content.
    Browsers assemble the web content components and arrange those parts according
    to the HTML commands in the file.


    You can also view content "locally," or on your own hard drive, without the need
    for a web server. The process of content retrieval and display is the same as
    the process listed in the previous steps in a browser looks for and interprets
    the codes and content of an HTML file, but the trip is shorter: the browser looks
    for files on your own computer’s hard drive rather than on a remote machine. A
    web server would be needed to interpret any server-side programming language embedded
    in the files, but that is outside the scope of this book. In fact, you could work
    through all the lessons in this book without having a web server to call your
    one, but then nobody but could view your masterpieces.'
