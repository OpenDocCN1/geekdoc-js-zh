  md: "# HOUR 19: Creating Fixed or Liquid Layouts\n\nFIGURE 19.6\n\nA basic HTML\
    \ template with styles applied to the `<div>` elements.\n\n![](img/586b123dc17cd71d47a0bac9f72d3db9_310_0.png)\n\
    \n# Defining Two Columns in a Fixed/Liquid Hybrid Layout\n\nWe can start with\
    \ the easy things first. Since this layout is supposed to be liquid, we know that\
    \ whatever we put in the header and footer areas will extend the width of the\
    \ browser window regardless of how narrow or wide the window might be.\n\nAdding\
    \ the following code to the style sheet gives the header and footer area a width\
    \ of 100 percent as well as the same background color:\n\n```\nheader {\n  float:\
    \ left;\n  width: 100%;\n  background-color: #7152F4;\n}\n```\n\n```\nfooter {\n\
    \  float: left;\n  width: 100%;\n  background-color: #7152F4;\n}\n```\n\nNow things\
    \ get a little trickier. We have to define the two fixed columns on either side\
    \ of the page, plus the column in the middle. In the HTML, note that there is\
    \ a `<div>` that surrounds all three and it is called “wrapper.” This element\
    \ is defined as follows:\n\n```\nwrapper {\n  float: left;\n  padding-left: 200px;\n\
    \  padding-right: 125px;\n}\n```"
  merge: -1
