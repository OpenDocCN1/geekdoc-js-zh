  md: "# HOUR 22: Working with Web-Based Forms\n\n# Radio Buttons\n\nIf you look at\
    \ other web-forms, you might see checkboxes use the same names with different\
    \ values, as in the following code:\n\n```\n<input type=\"checkbox\" name=\"pet\"\
    \ value=\"dog\" /><br>\n<input type=\"checkbox\" name=\"pet\" value=\"cat\" /><br>\n\
    <input type=\"checkbox\" name=\"pet\" value=\"iguana\" />\n```\n\nIf you use more\
    \ than one checkbox, it is likely only the last value will be processed by the\
    \ script. This is one reason why you might choose to use checkbox groups, the\
    \ name of the group, and the individual values you sent to the script before you\
    \ submit it.\n\nRadio buttons, for which only one can be selected at a time, are\
    \ almost as simple to implement as check boxes. The simplest use of a radio button\
    \ is for yes/no questions or for voting when only one candidate can be selected.\n\
    \nTo create a radio button, just use type=\"radio\" and give each option its <input\
    \ /> The same name for all the radio buttons in a group, but don't use the []\
    \ that you use with\n\n```\n<input type=\"radio\" name=\"vote\" value=\"yes\"\
    \ checked=\"checked\" /> Yes<br>\n<input type=\"radio\" name=\"vote\" value=\"\
    no\" />\n```\n\nThe value can be any name or code you choose. If you include the\
    \ checked attribute, button is selected by default. No more than one radio button\
    \ with the same name can be checked.\n\nWhen designing your form and choosing\
    \ between checkboxes and radio buttons, ask yourself: is the question being asked\
    \ or implied that one could be answered only once? If so, use a radio button.\n\
    \n# Selection Lists\n\nBoth scrolling lists and pull-down lists are created with\
    \ the <select> tag. You use this tag with the <option> tag, as in the following\
    \ examples:\n\n```\n<select name=\"extras\" size=\"3\" multiple=\"multiple\">\n\
    \  <option value=\"Electric windows\" selected=\"selected\">Electric windows</option>\n\
    \  <option value=\"Sunroof\">Sunroof</option>\n  <option value=\"AM/FM Radio\"\
    >AM/FM Radio</option>\n  <option value=\"CD Player\">CD Player</option>\n  <option\
    \ value=\"GPS\">GPS</option>\n</select>\n```\n\nNo HTML tags other than <option>\
    \ and </option> should appear between the <select> and </select> tags.\n\nUnlike\
    \ the text input, the size attribute determines how many items show at once on\
    \ the selection list. If size=\"2\" were used in the pre-code, the first two options\
    \ would be visible and a scrollbar appear next to the list so the user could scroll\
    \ down to see the third option."
