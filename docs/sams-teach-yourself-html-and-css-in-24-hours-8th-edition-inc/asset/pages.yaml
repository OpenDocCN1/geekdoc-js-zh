  md: "# Alignment and Spanning Within Tables\n\nBy default, anything you place inside\
    \ a table cell is aligned to the left and vertically centered. Figures 7.1 and\
    \ 7.2 show this default alignment. However, you can align the contents of table\
    \ cells horizontally and vertically with the text-align and vertical-align style\
    \ properties.\n\nYou can apply these alignment attributes to any `<tr>`, `<td>`,\
    \ or `<th>` tag. Alignment attributes assigned to a `<tr>` apply to all cells\
    \ in that row. Depending on the size of your table, you can save yourself a considerable\
    \ amount of time and effort by applying these attributes at the `<tr>` level and\
    \ not in each `<td>` or `<th>` tag.\n\nThe HTML code in Listing 7.3 uses a combination\
    \ of text alignment styles to apply a default alignment to a row, overridden in\
    \ a few individual cells. Figure 7.3 shows the result of the code in Listing 7.3.\n\
    \nFollowing are some of the more commonly used vertical-align property values:\
    \ top, middle, bottom, text-top, and baseline (for text). These property values\
    \ give you plenty of flexibility in aligning table data vertically.\n\n# Listing\
    \ 7.3 Alignment, Cell Spacing, Borders, and Background Colors in Tables\n\n```\n\
    <?xml version=\"1.0\" encoding=\"UTF-8?>\n<!DOCTYPE html PUBLIC \"//W3C//DTD XHTML\
    \ 1.1//EN\"\n\"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\nn<html xmlns=\"\
    http://www.w3.org/1999/xhtml\" xml-lang=\"en\">\n<head>\n  <title>Things to Fear</title>\n\
    </head>\n<body>\n  <h1>Things to Fear</h1>\n  <table border=\"2\" cellpadding=\"\
    4\" cellspacing=\"2\" width=\"100%\">\n    <tr style=\"background-color:red;color:white\"\
    >\n      <th colspan=\"2\">Description</th>\n    </tr>\n    <tr>\n      <th>Size</th>\n\
    \      <th>Speed</th>\n    </tr>\n    <tr style=\"vertical-align:top\">\n    \
    \  <td><img src=\"handgun.gif\" alt=\".38 Special\"/></td>\n    </tr>\n  </table>\n\
    </body>\n</html>\n```"
