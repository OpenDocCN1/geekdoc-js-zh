  md: '# Workshop


    # What happens if I overlap areas on an imagemap?


    You are allowed to overlap areas. Just keep in mind when determining which link
    to follow, one area will have precedence over the other area. Precedence is assigned
    according to which areas are listed first in the imagemap. For example, the first
    area in the map has precedence over the second area, which means that a click
    in the overlapping portion of the areas will link to the first area. If you have
    an area within an imagemap that doesn''t link to anything (known as a "dead" area),
    you can use this overlap trick to deliberately prevent this area from linking
    to anything. To do this, just place the dead area before other areas so that the
    dead overlaps them, and set its href attribute to ""


    # Workshop


    The workshop contains quiz questions and activities to help solidify your understanding
    of the material covered. Try to answer all questions before looking at the "Answers"
    section that follows.


    # Quiz


    +   1. How would you insert an elephant.jpg image file at the very top of a web
    page?


    +   2. How would you make the word Elephant display whenever the actual elephant.jpg
    image couldn''t be displayed by a web browser?


    +   3. You are want to create an imagemap of a 200x200-pixel image named quarters.gif.
    When viewers click the upper-left quarter of the image, you want them to get a
    page named topleft.html. When they click the upper-right quarter, you want them
    to get topright.html. Clicking the lower-left quarter should bring up bottomright.html,
    and the lower-right panel should lead to bottom-right.html. What HTML would you
    use to implement this as an imagemap?


    # Answers


    +   1. Copy the image file into the same directory folder as the HTML text file.
    Immediately after the `<body>` tag in the HTML text file, type `<p><img src="elephant.jpg"
    alt=""></p>`.


    +   2. Use the following HTML:


    ```

    <img src="elephant.jpg" alt="elephant" />

    ```'
