  md: '# HOUR 15

    Understanding the CSS Box Model and Positioning


    In the previous hour, I mentioned the CSS Box Model a few times—this hour begins
    with a discussion of the box model and explains how the information you learned
    in the previous hour helps you understand this model. By learning the box model,
    you won''t tear your hair out when you create a design and then realize the elements
    don''t line up or that they feel a little “off.” You’ll know that in all cases,
    something—the margin, the padding, the border—just needs a little tweaking for
    it to work out.


    You’ll also learn more about CSS positioning, including stacking elements on top
    of each in a three-dimensional way (rather than a vertical). Finally, you’ll learn
    about controlling the flow of text around elements using `float` property.


    +   WHAT YOU''LL LEARN IN THIS HOUR:

    * How to conceptualize the CSS box model

    * How to position your elements

    * How to control the way elements stack up

    * How to manage the flow of text


    # The CSS Box Model


    Every element in HTML is considered “box,” whether it is a paragraph, `<div>`,
    an image, or so on. Boxes have consistent properties, whether them or not, and
    whether they are specified in all the style sheet or not. They’re always present,
    and as designers, we have to keep their presence in mind when creating a layout.


    15.1 is a diagram of the box model. The box model describes the way in which every
    HTML block-level element has the potential for a border, padding, and margin,
    and how the border, padding, and margin are applied. In other words, all elements
    have some padding between the content and the border of the element. Additionally,
    the border might or might not be visible, but space for it is here, just as there
    is a margin between the border of the element and any other content outside the
    element.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# HOUR 15: Understanding the CSS Box Model and Positioning


    FIGURE 15.1


    Every element in HTML is represented by the CSS Box Model.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_242_0.png)


    Here''s yet another explanation of the box model, going from the outside inward:


    +   - The *margin* is the area outside of the element. It never has color; it
    is always transparent.


    +   - The *border* extends around the element, to the outer edge of padding. The
    border can be of several types, widths, and colors.


    +   - The *padding* exists around the content and inherits the background color
    of the content area.


    +   - The *content* is surrounded by padding.


    Here''s the tricky part comes in: to know the true height and width of an element,
    you have to take all the elements of the box model into account. If you remember
