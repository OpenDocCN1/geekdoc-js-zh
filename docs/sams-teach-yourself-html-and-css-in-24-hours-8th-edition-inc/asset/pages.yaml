  md: '# Preparing Photographic Images


    145


    played immediately. Intricate, colorful graphics mean big file sizes, which increase
    the transfer time even over a fast connection. How do you maximize the quality
    of your presentation while minimizing file size? To make these choices, you need
    to understand how color and resolution work together to create a subjective sense
    of quality.


    The resolution of an image is the number of individual dots, or pixels, that make
    up an image. Large, high-resolution images generally take longer to transfer and
    display than small, low-resolution images. Resolution is usually specified by
    the width times height of the image, expressed in pixels; a 300x200 image, for
    example, is 300 pixels wide and 200 pixels high.


    You might be surprised that resolution isn''t the most significant factor determining
    an image file storage size (and transfer time). This is because images used on
    web pages are always stored and transferred in compressed form. Image compression
    is the mathematical manipulation that images are put through to squeeze out repetitive
    patterns. The mathematics image compression is complex, but the basic idea is
    that repeating patterns or layers of the same color can be squeezed out when image
    is stored on a disk. This makes the image file much smaller and allows it to be
    transferred faster over the Internet. The web browser restores the original appearance
    of the image when the image is displayed.


    # NOTE


    There are several types of image resolution, including pixel, spatial, spectral,
    and radiometric. You spend hours learning about each type; and if you are taking
    a graphics design class, you might do just that. For now, however, all you need
    to remember is that larger images take longer to download and use a lot of space
    in your display. Display size and storage or transfer size are factors you should
    take into consideration when designing your web site.


    In the rest of this hour, you will learn exactly how to create graphics with visual
    impact and small file sizes. The techniques you use to accomplish this depends
    on the contents and purpose of each image. There are many uses for web pages,
    as there are four types of graphics by far the most common:


    +   - Photos of people, products, or places

    - Graphical banners and logos

    - Buttons or icons to indicate actions and provide links

    - Background textures for content elements


