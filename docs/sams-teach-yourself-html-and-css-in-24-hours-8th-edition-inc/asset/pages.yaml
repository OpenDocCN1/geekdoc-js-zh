    # Understanding Where to Place Files on the Web Server


    An important aspect of maintaining web content is determining how you will organize
    content—not only for the user to find, but also for you to maintain on your server.
    Putting files in directories will help you manage those files.


    Naming and organizing directories on your web server, and developing rules for
    file maintenance, is completely up to you. However, maintaining a well-organized
    server simply makes your management of its content more efficient in the long
    run.


    # Basic File Management


    As you browse the web, you might have noticed that URLs change as you navigate
    through web sites. For instance, if you’re looking at a company’s web site and
    you click on graphical navigation leading to the company’s products or services,
    the URL will probably change from'
