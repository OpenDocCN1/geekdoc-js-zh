    \ is figuring out the sections of content you think might need to account for\
    \ the design.\n\n# Q&A\n\n+   I've heard about something called an elastic layout.\
    \ How is that different than the liquid layout?\n\n+   An elastic layout is a\
    \ layout whose content areas resize when the user resizes the text. Elastic layouts\
    \ use ems, which are inherently proportional to text and font size. An em is a\
    \ typographical unit of measurement equal to the point size of the current font.\
    \ When ems are used in an elastic layout, if a user forces the text size to increase\
    \ or decrease the decrease proportionally. Elastic layouts are very difficult\
    \ to achieve and more commonly found in portfolios rather than practice due to\
