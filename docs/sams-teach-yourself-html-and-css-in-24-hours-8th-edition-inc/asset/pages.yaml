    Figure 15.5


    The color blocks are displayed using absolute positioning.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_249_0.png)


    We''re talking layout! Figure 15.5 shows how absolute positioning allows you to
    place elements exactly where you want. It also reveals how easy it is to arrange
    elements so they overlap each other. You might be curious as to how a web browser
    knows which elements to draw on top when they overlap. The next section covers
    how you can control stacking order.


    # Controlling the Ways Stack Up


    There are situations in which you''d like to carefully control the manner in which
    elements overlap each other on a web page. The z-index style property allows you
    to set the order of elements with respect to how they stack on top of each other.
    the name z-index might sound a little strange, it refers to the notion of a third
    dimension (Z) that points into the computer screen, in addition to the two that
    go across (X) and down (Y) the screen. Another way to think of the z-index is
    the relative position of a single magazine within a stack of magazines. A magazine
    nearer the top of the stack has a higher z-index than a magazine lower in the
    stack. Similarly, an overlapped element with a higher z-index is displayed on
    top of an element with a lower z-index.'
