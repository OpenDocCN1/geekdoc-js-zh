  md: '# Quiz


    +   1. Your best friend from elementary school finds you on the Internet and says
    he wants to trade home page links. How do you put a link to his site at www.supercheapsuits.com/-billyob/
    on one of your pages?


    +   2. What HTML would you use to make it possible for someone the words “About
    the Authors” at the top of a page to skip down to a list of credits somewhere
    on the page?


    +   3. If your email address is bon@soir.com, how would you make the text “goodnight
    greeting” into a link that people can click to compose and send you an email message?


    # Answers


    +   1. Put the following on your page:


    ```

    <a href="http://www.supercheapsuits.com/-billyob/">Billy Bob''s site=</a>

    ```


    +   2. Type this at the top of the page:


    ```

    <a href="#credits">About the Authors</a>

    ```


    Type this at the beginning of the sections:


    ```

    <a id="credits">/</a>

    ```


    +   3. Type the following on your web page:


    Send me a <a href="mailto:bon@soir.com">goodnight greeting</a>/


    # Exercises


    +   Create an HTML file consisting of a formatted list of your favorite web sites.
    You might already have these sites bookmarked in your web browser, in which case
    you can visit them to find the exact URL in the browser’s address bar.


    +   If you have created any pages for a web site, look through them and consider
    whether there are places in the text where you''d like to make it easy for people
    to contact you. Include a link in that place to your email address. You can provide
    too many opportunities for people to contact you and tell them what they need
    or what they think about your products—especially if you''re running a business.'
