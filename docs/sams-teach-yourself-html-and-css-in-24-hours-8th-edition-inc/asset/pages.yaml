  md: '# # HOUR 21

    # Understanding Dynamic Web Sites


    The term *dynamic* means something active or something that motivates another
    to become active.


    When talking about web sites, a dynamic web site is one that incorporates interactivity
    into its functionality and design, but also motivates a user to take an action—read
    more, purchase a product, and so on. In this hour, you''ll learn a little bit
    about the different types of interactivity that can make a site dynamic, including
    information about both server-side and client-side scripting (as well as some
    practical examples of the latter).


    I''ve mentioned client-side scripting elsewhere in this book and you used a little
    of it in Hour 18 when you used event attributes and JavaScript to change the styles
    of particular elements—that is called manipulating the Document Object Model (DOM).
    You will do a bit more of that manipulation. Specifically, after learning about
    the different technologies, you''ll use JavaScript to display a random quote upon
    page-load and swap images based on user interaction.


    +   WHAT YOU''LL LEARN IN THIS HOUR:

    * How to conceptualize different types of dynamic content

    * How to include JavaScript in your HTML

    * How to display randomized text with JavaScript

    * How to change images using JavaScript and user events


    # ## Understanding the Different Types of Scripting


    In web development, there are two different types of scripting: server-side and
    client-side. Both types of scripting—which is, in fact, computer programming—are
    beyond the scope of this book. However, they are not far beyond this. Two very
    useful and popular books in the Sams Teach Yourself PHP, MySQL and Apache All-in-One
    (for server-side scripting) and Sams Teach Yourself JavaScript in 24 Hours (for
    client-side scripting).'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# HOUR 21: Understanding Dynamic Web Sites


    Server-side scripting refers to scripts that run on the web server, which sends
    results to your web browser. If you have ever submitted a form at a web site,
    which includes using a search engine, you have experienced the results of a server-side
    script. Popular server-side scripting languages include the following; to learn
    more, visit the web sites here:


    +   - PHP (PHP: Hypertext Preprocessor)—http://www.php.net/

    - JSP (Java Server Pages)—http://java.sun.com/products/jsp/

    - ASP (Active Server Pages)—http://www.asp.net/

    - Perl—http://www.perl.org/

    -Python—http://www.python.org/

    - Ruby—http://www.ruby-lang.org/


    Despite its name, JavaScript is not a derivation or any other close relative to
    the object-oriented programming language called Java. Released by Sun Microsystems
    in 1995, Java is very closely related to the server-side scripting language JavaScript
    was created by Netscape Communications, also in 1995, and given the name to indicate
    a similarity to Java but not a direct connection with it.


    On the other hand, client-side scripting refers to scripts that run within your
    web browser—there is no interaction with a web server in order for the scripts
    to run. The most popular client-side scripting language, by JavaScript. For several
    years, research has shown that more than 93 percent of all web browsers have JavaScript.


    Another client-side scripting language is Microsoft’s VBScript (Visual Basic Scripting
    Edition). This language is only available with Microsoft Internet Explorer web
    browser, and therefore should not be used unless you are sure that users will
    access your site with browser (such as a closed corporate environment). Given
    a desire to reach the largest possible audience, this assumes the use of JavaScript
    for client-side scripting; the coding examples in this lesson are JavaScript.


    # Including JavaScript in HTML


    JavaScript code can live in one of two places within your files:


    +   - In its own file with .js extension.

    - Directly in your HTML files.


    External files are often used for script libraries (code you can reuse throughout
    many pages), while code appearing in the HTML files tends to achieve functionality
    specific to individual pages. Regardless of where your JavaScript lives, your
    browser leaves of its existence through the use of the `<script></script>` tag
    pair.'
