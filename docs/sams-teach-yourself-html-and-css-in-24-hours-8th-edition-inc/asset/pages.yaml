  md: '# HOUR 10: Creating Images for Use on the Web


    Q I have a Windows AVI video clip. Can I turn it into a GIF animation?


    A Yes. Simply open the AVI file with software such as Animation Shop to convert
    it to a GIF animation. The software will give you the option to reduce the number
    of frames; it''s usually a good id to sample every third frame or so to keep the
    file size down to reasonable proportions. You can also embed AVI files directly
    into web pages, as discussed in Hour 12, "Multimedia in Your Web Site."


    # Workshop


    The workshop contains quiz questions and activities to help you solidify your
    understanding of the material covered. Try to answer all questions before looking
    at the "Answers" section that follows.


    # Quiz


    +   1. You have a scanned picture of a horse that you need to put on a web page.
    How big should you make it? In what file format should you save it?


    +   2. Your company logo is a black letter Z with a red circle behind it. What
    size should you draw or scan it? What file format should you save it for your
    web page?


    +   3. Your business partner comes to with a richly detailed graphic of dark forest
    foliage and wants you to use it as the background on your corporate site—with
    bold white text. What do you do?


    # Answers


    +   1. Depending on how important the image is to your page, you should make it
    as small as 100x40 pixels or as large as 300x120 pixels. The JPEG format, with
    about 85% compression, will be best. Of course, you could also provide a thumbnail
    link to a larger image that is viewed by itself. You''ll learn how to use images
    as in the next hour.


    +   2. About 100x100 pixels is generally good for a square logo, a simple graphic
    that will compress very well. You could make it up to 300x300 pixels or (and have
    the space in your template to position it appropriately—but that''s a big square).
    Save it as an indexed GIF file since it contains very few colors.'
