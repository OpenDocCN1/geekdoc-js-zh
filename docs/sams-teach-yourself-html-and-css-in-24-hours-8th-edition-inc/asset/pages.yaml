  md: "# HOUR 18\nUsing Mouse Actions\to Modify Text Display\n\nThroughout this book,\
    \ you have seen examples of how mouse actions can affect the display of text.\
    \ The simplest example is when the hover pseudclass of the <a> link is defined\
    \ in the style sheet to display text in a different color when a user’s mouse\
    \ hovers over it. In the previous hour, you learned how the hover pseudoclass\
    \ changed both the text color and the background color of an <li> element.\n\n\
    In this hour, you'll learn how to achieve two specific actions that combine CSS\
    \ and mouse actions—displaying additional text when an item is rolled over the\
    \ mouse, and using a mouse click to change the color of a container element. These\
    \ two actions are useful in some circumstances to be sure; but more importantly,\
    \ they provide an entry point into more advanced work you might want to tackle\
    \ later in your web development.\n\n+   WHAT YOU'LL LEARN IN THIS HOUR:\n* How\
    \ to create tool tips with CSS\n* How to display additional rollover text with\
    \ CSS\n* How to access access events\n* How to use `onclick` to change the appearance\
    \ of `<div>`\n\n# Creating a Tool Tip with CSS\n\nA *tooltip* is an element within\
    \ a graphical user interface—could be a software program, could a web site—that\
    \ provides additional information when a cursor hovers over a specific item. Figure\
    \ 18.1 shows a tooltip when the mouse rolls over the linked text “HTML” and the\
    \ tooltip displays “HTML” in a small box. In this case, the text displayed in\
    \ the tooltip comes from the `title` attribute of the `<a>` tag."
  merge: -1
  pgno: 287
- img_proc: true
  md: "# HOUR 18: Using Mouse Modes to Modify Text\n\nFIGURE 18.1\nA standard tooltip\
    \ in action.\n\n![](img/586b123dc17cd71d47a0bac9f72d3db9_288_0.png)\n\nThe display\
    \ of the tooltip in Figure 18.1 is controlled by the soft- itself. That is, its\
    \ display and appearance is not something (you as developer) can control. However,\
    \ you can create your own tooltips with a little CSS by applying concepts you've\
    \ already practiced in previous hours.\n\nListing 18.1 contains the style sheets\
    \ and HTML for a page that contains images and links, but with one link that displays\
    \ a custom tooltip.\n\n# Listing 18.1 Creating a Simple Tool Tip with CSS\n\n\
    ```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"//W3C//DTD\
    \ HTML 1.1//EN\"\n\"http://www.w3.org/TR/html1/html1.dtd\">\n\n<html xmlns=\"\
    http://www.w3.org/1999/xhtml\" lang=\"en\">\n<head>\n  <title>Steopte Butte</title>\n\
    \  <style type=\"text/css\">\na {\n  text-decoration: none;\n  font-weight: bold;\n\
    }\n.tip {\n  position:relative;\n  z-index:24;\n}\n\n```"
