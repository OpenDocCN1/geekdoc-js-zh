  md: '# # HOUR 3

    # Understanding HTML and XHTML Connections


    The first two hours gave you a basic idea of the process behind creating web content
    and viewing it online or locally, if you do not have a web hosting provider. In
    this hour, we''ll get down to the business of explaining the various elements
    that must appear in an HTML file.


    At the end of the hour, you''ll learn how HTML differs from XHTML and why there
    are two different languages designed to do the same thing—create web content.
    In general, this hour provides a quick summary of HTML and XHTML basics and some
    practical tips to make the most of your time as a web author and publisher. It''s
    not all theory; however, you do get to see a real web page and the HTML code behind
    it.


    Here''s a review of what you need to do before you''re ready to use the rest of
    this book:


    +   1. Get a computer. I used a computer with Windows Vista to test the sample
    content and capture the figures in this books, but you can use any Windows, Macintosh,
    or Linux/UNIX machine to create and view your web content.


    +   2. Get a connection to the Internet. Whether you have a dial-up, wireless,
    or broadband connection doesn''t matter for the creation and viewing of your web
    content, but the better, the connection for the overall experience. The Internet
    Service Provider (ISP), school, or business that provides your Internet connection
    can help you with the details of setting it up properly. Additionally, many public
    spaces such as coffee shops, bookstores, and libraries offer free Internet service
    that you can use if you have a laptop computer with Wi-Fi network support.


    # WHAT YOU''LL LEARN IN THIS HOUR:


    +   * How to create a simple web page in HTML

    * How to include all the HTML Tags that every web page must have

    * How to organize a page with paragraphs and line breaks

    * How to organize your content with headings

    * How to differentiate between HTML, XML, XHTML, and HTML


    # NOTE


    Not sure how to find an ISP? The best way is to comparison-shop (using a friend''s
    computer or a public computer that''s already connected to the Internet). You''ll
    find a comprehensive list of national and regional ISPs at http://www.the-list.com/.'
