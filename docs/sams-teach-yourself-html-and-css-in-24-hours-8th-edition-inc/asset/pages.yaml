    # Quiz


    +   1. What is the difference between the “inside” and “outside” list-style-position
    values? What is the default value?


    +   2. Does a list-style with a value of “none” produce a structured list item,
    either ordered or unordered?


    +   3. What HTML code creates a list item that is 350 pixels wide, 100 pixels
    high, with a green background, a two-pixel dashed black border, and the list indicator
    placed inside the container?


    # Answers


    +   1. The list-style-position value of “inside” places the list item indicator
    inside the block created by the list item. A value of “outside” places the list
    item indicator outside the block. When “inside,” content wraps beneath the list
    item indicator. The default value is “out-side.”


    +   2. Yes. The only difference is that no list item indicator is present the
    content within the list item.'
