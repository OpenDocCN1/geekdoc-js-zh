    \ chance of your pages gracefully falling back on a known font when your ideal\
    \ font isn't found. Following is an example of the font-family style used to set\
    \ the typeface for a paragraph of text:\n\n```\n<p style=\"font-family:arial,\
    \ sans-serif, 'times roman\">\n```\n\nThere are several interesting things about\
    \ this example. First, arial is the primary font. Capitalization does not affect\
    \ the font family. arial is different from roman or Arial. Another interesting\
    \ thing about this code is how single quotes are used around the times roman name\
    \ because it has a space in it. However, since 'times roman' appears after the\
    \ generic specification of sans-serif, it is unlikely that 'times roman' would\
    \ be used. sans-serif is in the second position, so it tells the browser \"If\
    \ Arial is not in the mesh, use the default sans-serif.\"\n\nYou'll learn about\
    \ hexadecimal colors in Hour 9. For now, understand that the color rule allows\
