  md: '# HOUR 24: Helping People Find Your Web Pages


    architect consultants who perform SEO tasks get lumped in with the spam-mers who
    send unsolicited e-mail, such as this:


    > "Dear google.com,

    I visited your website and noticed that you are not listed in most of the major
    search engines and directories..."


    This sample e-mail is used as an example in Google’s own guidelines for webmasters,
    along with the note to “reserve the same skepticism for unsolicited email about
    search engines as you do for for burn fat at night pills or requests to help transfer
    funds from deposed dictators.” Yes, someone actually sent Google a e-mail about
    how to increase their search ranking...in Google. For more good advice from Google,
    visit http://www.google.com/webmasters/


    Here are some additional actions you can take, for free, to optimize your content
    for search engines:


    +   - Use accurate titles. Your titles should be brief, but descriptive and unique.
    Do not try to stuff your titles with keywords.

    - Create human-friendly URLs, such as those with words in them that users can
    easily remember. It is a lot easier to remember—and it’s easier for search engines
    to index in a relevant way—a URL such as http://www.mycompany.com/products/super_widget.html
    compared to something like http://www.mycompany.com?c=p&id=4&id=49fsd7345fea

    - Create URLs that reflect your directory structure. This assumes you have a directory
    structure in the first place, which you should.

    - When possible, use text—not graphical elements—for navigation.

    - If you have content several levels deep, a breadcrumb trail so users can find
    their way back home. A breadcrumb trail provides search engines with more words
    to index. For example, if you are looking at a recipe for biscuits in the Southern
    Cooking category of a food-related web site, the breadcrumb trail for this particular
    page might look like this:

    - Home > Southern Cooking > Recipes > Biscuits

    - Within the content of your page, use headings (h1, h2, h3) appropriately.


    In addition to providing rich and useful content for your users, you should follow
    these tips to increase your site’s prominence in page rankings.'
