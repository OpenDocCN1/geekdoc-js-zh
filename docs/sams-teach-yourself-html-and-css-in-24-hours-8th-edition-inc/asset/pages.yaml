  md: "# HOUR 12: Multimedia in Your Web Site\n\n# NOTE\n\nBecause the <embed /> tag\
    \ is not supported in XHTML, it will prevent your pages from validation. Unfortunately,\
    \ there really is no workaround for this problem—we'll have to wait for browsers\
    \ to follow the <object> tag by itself or move to the <embed /> element of HTML\
    \ 5.\n\n# Listing 12.2 Using an <object> Tag to Directly Embed a WMV Clip\n\n\
    ```\n<object>\n  <param name=\"uiMode\" value=\"full\" />\n  <param name=\"autoStart\"\
    \ value=\"false\" />\n  <embed width=\"320\" height=\"305\" type=\"video/x-ms-wmv\"\
    \n    src=\"pond.wmv\" controls=\" loop=\"false\" autostart=\"false\"\n    pluginpage=\"\
    http://www.microsoft.com/windows/windowsmedia/\" />\n</object>\n<div>\n  <p>Michael's\
    \ backyard pond is not only a hobby but also an ongoing home improvement project\
    \ that is both creative and relaxing.</p>\n  <p>He has numerous fish in the pond,\
    \ all Koi from various places as as Japan, Israel, and Australia. Although they\
    \ don't bark, purr, or fetch anything other food, these fish are pets, good ones\
    \ at all.</p>\n</div>\n</body>\n</html>\n```\n\n# NOTE\n\nYou might notice that\
    \ there's some extra code here that didn't appear in the earlier <object> tag\
    \ example. Unfortunately, not all browsers are entirely consistent in their support\
    \ of the <object> tag. For this reason, it is necessary to include an <embed />\
    \ tag within the <object> tag to account for browser inconsistencies. This isn't\
    \ an ideal solution, but it's all we have while browsers continue lag before providing\
    \ standards. If you pay close attention, you'll notice that the <embed /> tag\
    \ contains all the information that the <object> tag does.\n\nVideo files aren't\
    \ the only media files you can include within your web site using the <object>\
    \ and <embed /> tags. Adding any media file will follow the same process. To determine\
    \ exactly which class and attributes to use, such as parameters (the <param />\
    \ tags), use your search engine to look up something like object embed mediatype\
    \ where mediatype is Real Audio, QuickTime, Flash, or whatever you want.\n\nThe\
    \ <object> tag is a bit more complex than what was revealed here. However, you\
    \ don't need to know how to use the more advanced facets of the <object> tag to\
    \ play multimedia content. In other words, it's important for you to make a multimedia\
    \ guy in order to share some multimedia clips on your web pages.\n\n# Additional\
    \ Tips for Multimedia\n\nBefore you add video, audio, or animations to your web\
    \ site, first ask yourself you really should. When you use these types of multimedia,\
    \ be sure to do so for a reason. Gratuitous sound and video, like gratuitous images,\
    \ can detract from your overall message. Again, if your message is “Look at the\
    \ videos I have made” or “Listen to my music and download some songs,” then multimedia\
    \ absolutely must play a role in your web site."
