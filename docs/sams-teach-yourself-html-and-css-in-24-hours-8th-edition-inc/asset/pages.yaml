- img_proc: true
  md: "# Creating a Fixed/Liquid Hybrid Layout\n\nThe use of the two padding definitions\
    \ is essentially reserve space for the two fixed-width columns on the left and\
    \ right of the page. The column on the left will be 200 pixels wide, the column\
    \ on the right will be 125 pixels, and each will have a different background color.\
    \ But we also have to position the items relative to where they would be placed\
    \ if the HTML remained unused (see Figure 19.6). This means adding `position:relative`\
    \ to the style sheet each of these columns. Additionally, we indicate that the\
    \ `div` elements float to the left.\n\nBut in the case of the `left_side <div,`\
    \ we also indicate that we want the right-most margin to be 200 pixels from the\
    \ edge (this is addition to the column being defined as 200 pixels wide). We also\
    \ want the margin on the left to be a full negative margin; this will pull it\
    \ into place (as you will soon see). The `right_side <div>` does not include a\
    \ value for right but it include a negative margin on the right:\n\n```\n#left_side\
    \ {\n  position: relative;\n  float: left;\n  width: 200px;\n  background-color:\
    \ #52f471;\n  right: 200px;\n  margin-left: -100%;\n}\n#right_side {\n  position:\
    \ relative;\n  float: left;\n  width: 125px;\n  background-color: #f452d5;\n \
    \ margin-right: -125px;\n}\n```\n\nAt this point let's also define the content\
    \ area so that it has a white background, takes up 100% of the available area,\
    \ and floats to the left relative to its position:\n\n```\n#content_area {\n \
    \ position: relative;\n  float: left;\n  background-color: #ffffff;\n  width:\
    \ 100%;\n}\n```\n\nAt this point, the basic layout will look something like that\
    \ which is shown in Figure 19.7, with the areas clearly delineated."
