  md: '# HOUR 7: Using Tables to Display Information


    At the top of Figure 7.3, a single cell (Description) spans two columns. This
    is accomplished with the colspan attribute in the <th> tag for that cell. If you
    must, you can also use the rowspan attribute to create a cell that spans more
    than one row.


    Spanning is the process of forcing a cell to stretch across more than one row
    or column of a table. colspan causes a cell to span multiple columns; rowspan
    has the same effect on.


    Additionally, text is centered in the second cell within the Description column
    to create text that is vertically aligned to the middle and horizontally aligned
    to the center of the cell.


    There are few tricks in Listing 7.3 that I haven''t explained. You can give an
    entire table—and each individual row or cell in a table—own background, by using
    properties on the web page you might. You can do this by using the <table>, <tr>,
    <td>, and <th> tag exactly as you want to give a yellow background, for example,
    you could use <table style="background-color:yellow;"> or <table style="background-color:#FFFF00;">
    In Listing 7.3, only the row you have has background; it uses <tr style="background-color:red;color:white;">
    to apply a red background to the cells in that row. Additionally, the color style
    ensures the text in that row is white.


    Similar to the background-color style the background-image property (not shown
    in this example), which is used to set a background for a table. If you wanted
    to set the leaves.gif as a background for a table, you could use <table style="background-image:url(leaves.gif)">
    Notice that the image is placed within parentheses and the url, which is what
    you are describing where the image file is located.


    Tweaking beading just by using style properties. In Listing 7.3, you can control
    the space around the borders of a table with the padding and cellspacing attributes.
    The padding attribute sets the amount of space (in pixels) between table borders
    and table cells themselves. The padding attribute sets the amount of space around
    the edges of the information, also in pixels. The padding value to a causes all
    the information in the table to align as closely as possible to the borders, even
    touching the borders. Cellpadding and cellspacing attribute you good overall control
    of the table''s appearance.


    # TIP


    Keeping the structure of rows and columns organized in your mind can be the most
    difficult part of creating tables that span multiple columns or rows. The tiniest
    error can throw the whole thing astray. You''ll save yourself and frustration
    by sketching your tables on paper before you start your HTML to implement them.


    # NOTE


    You will see alternating row colors in a table. For instance, one row might have
    a grey background and the next might have a white background. Alternating colors
    helps to read the content of your table more clearly, especially if the table
    is large.


    # NOTE


    Although the padding and cellspacing attributes are still used in XHTML, a CSS
    equivalent is used for them instead of the padding and border-style properties.
    Review the information in Appendix B, “XHTML 1.1 and CSS 2 Quick Reference,” for
    information and examples.'
