  md: '# Reducing the Number of Colors in an Image


    One of the most effectative ways to reduce the size of, and therefore the download
    time for, an image is to reduce the number of colors used in the image. This can
    drastically reduce the visual quality of some photographic images, but it works
    for most banners, buttons, and other icons.


    You''ll be glad to know that there is a special file format for images with a
    limited number of colors; it''s called the Graphics Interchange Format (GIF).
    When you save an image as a GIF, you might be prompted to flatten layers or reduce
    the number of colors by converting to an indexed image, as those are requirements
    for GIFs, as shown in Figure 10.7. The dialog box will simply ask you to confirm
    these changes that the process will do for you—do not concern yourself with these
    options at time, but read your software''s help file regarding layers and indexed
    colors for a full understanding.


    Remember, the GIF format is designed for images that contain areas of solid colors,
    such as web page titles and other illustrated graphics; the GIF format is not
    ideal for photographs.


    > Dithering is a technique used in image-editing programs to simulate a color
    that isn''t in the color palette with alternating pixels of two similar colors.
    For example, a dithered color would consist of alternating pixels of red and white
    pixels, which would give the general impression of pink. Dithering can make images
    look better in some cases, but it would usually be available for graphics. Why?
    It substantially increases the information complexity of an image, and that usually
    results in much larger file sizes and slower-downs.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_163_0.png)


    FIGURE 10.7

    When saving an image as a GIF, you might be prompted to convert to an indexed
    color palette.


    PNG (pronounced “ping”) is another useful file format that is supported in all
    major web browsers. While the GIF format allows you to specify a single transparent
    color, which means that the background of the web page will show through areas
    of an image, the PNG format takes a step further by allowing you to specify degrees
    of transparency.'
