  md: '# HOUR 2: Publishing Web Content


    # Workshop


    The workshop contains questions and exercises to help you solidify your understanding
    of the material covered. To answer all questions before looking at the “Quiz Answers”
    section that follows.


    # Quiz


    +   1. What three pieces of information do you need to connect to your web server
    via FTP?

    2. What is the purpose of the index.html file?

    3. Does your web site have to include a directory structure?


    # Quiz Answers


    +   1. The hostname, your account username, and your account password.

    2. The index.html file is typically the default file for a directory within the
    web server. It allows users to access http://www.yourdomain.com/somirectory/ without
    using a trail-file name and still end up in the appropriate place.

    3. No. Using a directory structure for file organization is completely up to you,
    although it is highly recommended to use one because it simplifies maintenance.


