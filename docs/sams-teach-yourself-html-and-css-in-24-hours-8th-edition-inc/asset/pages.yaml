  md: '# Q&A


    I hear a lot about streaming video and audio. What does that mean?


    In the past, video and audio files took minutes and sometimes hours to retrieve
    through most modems, which severely limited the inclusion of video and audio on
    web pages. The goal that everyone is moving towards streaming video or audio,
    which plays while the data is being received. In other words, you do not have
    to completely download the clip before you can start to watch it or listen to
    it.


    Streaming playback is now widely supported through most media players, in both
    standalone versions and plug-ins. When you embed a media object using the <object>
    tag, the underlying media player automatically the clip if streaming is supported
    by the player.


    How do I choose an audiovisual file format among QuickTime, Windows AVI/WAV, RealVideo/RealAudio,
    and MPEG? Is there any significant difference among them?


    QuickTime is the most popular video format among Macintosh users, though QuickTime
    players are available for Windows as well. Similarly, AVI/WMV/WAV/WMA are the
    video and audio formats for Windows users, but you can get players for the Macintosh
    that support these formats. MPEG is another popular audio and video standard.
    MPEG-3 (MP3) is already extremely popular as the high-fidelity audio standard
    of choice. One other audio format that is based on MPEG is Apple''s AAC format,
    which might be more familiar to you as the native iTunes format.


    If of your audience uses Windows, use AVI/WMV for video and WAV/WMA or MP3 for
    audio. If your audience includes a significant number of Macintosh users, use
    QuickTime or RealVideo/RealAudio, or at least offer some alternative. MP3 is also
    a viable option for Mac audio. If cross-platform compatibility is essential, consider
    going with with MP3 for audio or RealVideo/RealAudio—although only those who download
    special software from http://www.real.com/player/ will be able to see RealVideo/RealAudio
    clips.'
  merge: -1
  pgno: 204
