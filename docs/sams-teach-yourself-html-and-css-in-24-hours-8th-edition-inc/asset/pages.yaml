  md: '# HOUR 11: Using Images in Your Web Site


    | Table 11.1 HTML Tags and Attributes Covered in Hour 11 |

    | Tag/Attribute | Function |

    | style="float:float" | Floats the image to one side so text can wrap around it.
    Possible values are left, right, and none (default). |

    | usemap="name" | The name of an image specification for client-side image mapping.
    Used with <map and area />. |

    | shape="value" | Within the <area />, tags the shape of the clickable area. Valid
    options for this attribute are rect, poly, and circle. |

    | coords="values" | Within the <area />, specifies the coordinates of the clickable
    region within an image. Its meaning and varying according to the type of area.
    |

    | href="linkurl" | Within the <area />, specifies the URL that should be loaded
    when the area is clicked. |


    # # Q&A


    How long can I make a message that I put after alt= in an <img /> tag?


    Theoretically, as long as you want. For practicality, you should keep the message
    short enough that it fits in a smaller space than the image itself. For big images,
    10 words might be fine; in some cases, I''ve seen web page authors include a small
    paragraph of text. For small images, a single word is best.


    I used the <img /> tag just as you advised, when I view the page, all I see is
    a little box with an x or some shapes in it. What''s wrong?


    A broken icon you see can mean one of things: Either the web browser couldn''t
    find the image file or the image isn''t saved in a format the browser recognizes.
    To solve these problems, first check to make sure that the image is where it is
    supposed to be. If it is, then open the image in your graphics editor and save
    it again as a GIF, JPG, or PNG format.'
  merge: -1
