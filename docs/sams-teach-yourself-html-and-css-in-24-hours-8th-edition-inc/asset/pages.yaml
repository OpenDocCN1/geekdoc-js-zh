    | Tips and tricks to save you precious time are set aside in "Tip" boxes so that
    you can spot them quickly. | "Note" boxes provide additional-information about
    the topics being discussed. | When there''s something you need to watch out for,
    you''ll be warned about it in "Warning" boxes.


    # # Q&A, Quiz, and Exercises


    Every hour ends with a short question-and-answer session that addresses the kind
    of "dumb questions" everyone wished they dared to ask. A brief but complete quiz
    lets you test yourself to be sure you understand everything presented in the hour.
    Finally, one or two optional exercises give you a chance to practice your new
    skills before move on.'
