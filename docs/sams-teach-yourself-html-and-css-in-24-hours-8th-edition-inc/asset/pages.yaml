  md: '# HOUR 2: Publishing Web Content


    Type the content that you see in Listing 2.1 and then save the file using sample.html
    as the name. The .html extension tells the web server that your file is, indeed,
    full of HTML. When the file contents are sent to the web browser that requests
    it, the browser will also know that it is HTML and will render it appropriately.


    Now that you have a sample HTML file to use—and hopefully somewhere to put it,
    such as a web hosting account—let''s get to publishing your web content.


    # Using FTP to Transfer Files


    As you''ve learned so far, you have to put your web content on a web server in
    order to make it accessible to others. This process occurs by using File Transfer
    Protocol (FTP). To use FTP, you need an FTP client—a program used to transfer
    files from your computer to a web server.


    FTP clients require three pieces of information in order to connect to your web
    server; this information will have been sent to you by your hosting provider after
    you set your account:


    +   - The hostname, address, to which you will connect

    - Your account username

    - Your account password


    Once you have this information, you are ready to use an FTP client to transfer
    content to your web server.


    # Selecting an FTP Client


    Regardless of the FTP client you use, FTP clients generally use the same type
    of interface. Figure 2.1 shows an example of FireFTP, which is an FTP client used
    with the Firefox web browser. The directory listing of the local machine (your
    computer) appears on the left of your screen and the directory listing of the
    remote machine (the web server) appears on the right. Typically you will see right-arrow
    and left-arrow buttons—as shown in Figure 2.1. The right arrow sends selected
    files from your computer to your web server; the left arrow sends files from the
    web server to your computer. Many FTP clients also allow you to simply select
    files and then drag and drop those files to the target machines.'
