    The CSS style properties follow a similar arrangement except that they are\n with\
    \ acceptable values, as opposed to attributes.\n\n# XHTML Structure\n\nXHTML relies\
    \ on several elements to provide structure to a document (as\noposed to structuring\
    \ the text within) as well to provide information\nat is used by the browser or\
    \ search engines.\n\n| Comments <!- ... - --> |\n| Usage | Used to insert notes\
    \ or scripts that are not displayed by the browser. |\n| Start/End Tag | Required/Required.\
    \ |\n| Attributes | None. |\n| Empty | Yes. |\n| Notes | Comments are not restricted\
    \ to one line and can be any length. The end tag is not required to be on the\
    \ same line as the start tag. |\n\n| <!doctype...> |\n| Usage | Version information\
    \ appears on the first line of an HTML\ndocument and is an SGML declaration rather\
    \ than an ele-ment. |"
