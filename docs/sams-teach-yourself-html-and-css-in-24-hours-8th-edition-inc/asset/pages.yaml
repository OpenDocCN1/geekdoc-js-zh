    digital images for use in your web site. This hour shows how easy it is to place
    those images in your web site. In this hour you''ll learn the HTML for placing
    and describing images in your site, to align images, and how to use images as
    links or "maps" to other content.


    +   WHAT YOU''LL LEARN IN THIS HOUR:

