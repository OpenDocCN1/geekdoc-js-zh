  md: '# Workshop


    The workshop contains quiz questions and activities to help you solidify your
    understanding of the material covered. Try to answer all questions before looking
    at the “Answers” section that follows.


    # Quiz


    +   1. When creating list-based navigation, how many levels of nested lists can
    you use?

    2. True or False: using an inline display property produces a horizontal list.

    3. When creating a navigation list of any type, can the four pseudo-classes for
    the a selector have the same values?


    # Answers


    +   1. Technically, you can nest lists as deep as you want. From a usability standpoint,
    there is a limit to the number of levels that you would want to use your lists.
    Three levels is typically the limit—more than that and you run the risk of creating
    a poorly organized site or simply giving the user more options than they need
    to see at all.

    2. True, if the display property is provided for the ul and li selectors in the
    style sheet.

    3. Sure, but you run the risk of users not realizing that your beautiful menus
    are indeed nested (since no visual display would occur for a mouse action).


    # Exercises


    +   Using the techniques shown for a multi-level vertical list, add subnavigation
    items to the vertical list at the end of the chapter.

    Look at the numerous examples of CSS-based navigation used in web sites and find
    some tricky-looking actions. Using the “view source” function of your web browser,
    look at the CSS used by these sites and try to implement something similar for
    yourself.'
  merge: -1
