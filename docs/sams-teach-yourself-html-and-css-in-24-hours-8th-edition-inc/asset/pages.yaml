    \ to bind the user's mouse actions when hovering over an <a> link. In the next\
    \ section, you'll learn how to use events plus a little JavaScript to do more\
    \ with mouse actions and CSS.\n\n# Accessing Events\n\nA user interaction as a\
    \ mouse click or key press is known as an *event*. The process of a script taking\
    \ action based on an event is known as *event handling*. You use special attributes\
    \ to associate event-handling script code with elements on a web page.\n\nFollowing\
    \ are some of the commonly used event attributes that come handy in JavaScript,\
    \ along with a description of when they occur with respect to a web page element:\n\
    \n+   - onload—Browser loads the elements.\n- onkeydown—User presses a key.\n\
    - onkeyup—User releases a key.\n- onclick—User clicks the element with the mouse\
    \ button.\n- ondblclick—User double-clicks the element with the left mouse button.\n\
    - onmousedown—User presses either mouse button while the mouse pointer is over\
    \ the element.\n- mouseup—User releases mouse button while the mouse pointer is\
    \ over the element."
