    # Placing List Item Indicators


    All this of margins and padding raises another issue: the control of list item
    indicators (when used) and how they wrap around the item. The default value of
    the list-style-position property is “outside”—this placement makes the bullets,
    numbers, or other indicators are kept to the left of the text, outside of the
    box created by the <li></li> tag. When text wraps within the list item, it wraps
    within that box and remains flush with the left of border.


    But when the value of list-style-position “inside,” the indicators are inside
    the box created by the <li></li> tag. Not only is the list item then indented
    further (they essentially become part of the text), the text wraps each list item.


