  md: '# HOUR 11: Using Images in Your Web Site


    FIGURE 11.2

    Users will see alt messages when images do not appear.


    ![](img/586b123dc17cd71d47a0bac9f72d3db9_174_0.png)


    Even when graphics have fully loaded and are visible in the web browser, the alt
    message typically appears in a little box (known as a tool tip) when the mouse
    pointer points over an image. The alt message also helps any user who is visually
    impaired (or is using a voice-based interface) to read the web page.


    You must include a alt attribute in every `<img>` tag on your pages, keeping in
    mind the variety of situations in which people might see that message. A very
    brief description of the image is usually best, but web page authors sometimes
    put advertising messages or subtle humor in their alt messages; too much humor
    or unimportant information is frowned upon, however. For small or unimportant
    images, it''s tempting to omit the alt message altogether, but it is a required
    attribute... does not mean your page will display properly, but it does mean you''ll
    be in violation of the latest XHTML standards. I recommend assigning an empty
    text message to alt if you absolutely don''t need it (`alt="`), which is sometimes
    the case with small or decorative images.


    The title attribute is not required by the `<img>` tag, but it functions similarly
    to the alt attribute; in fact, the title supersedes the alt attribute for tool
    tips if both are present. Knowing this, the best approach for describing images
    via text is to use both the alt attribute and the title attribute to provide relevant
    notation or helpful hints about the image that you think might be useful when
    viewed as a tool tip or via screen reader software.'
