  md: '# HOUR 1: Understanding How the Web Works


    You might never need to use your control panel, but having it available to simplifies
    the installation of databases and other software, the viewing of web statistics,
    and the addition of e-mail addresses (among many other features). If you can follow
    instructions, you can manage your own web server—no special training required.


    # Testing with Multiple Web Browsers


    Having just discussed the process of web content delivery and the acquisition
    of a web server, it might seem a little strange to step back and talk about testing
    your web sites with multiple browsers. However, before you go off and learn all
    about creating web sites with HTML and CSS, so with this very important statement
    in mind: every visitor to your site will potentially use hardware and software
    configurations that are different than your own. Their device types (desktop,
    laptop, notebook, smartphone, iPhone), their screen resolutions, their browser
    window sizes, their speed of connections—remember that you cannot control any
    of what your visitors use when they view your site.


    Although all web browsers process and handle information in the same general way,
    there are some specific differences between them that result in things not always
    looking the same in different browsers. Even users of the same version of the
    web browser can alter how a page appears by choosing different display options
    and/or changing the size of their viewing windows. All the major web browsers
    allow you to override the background and fonts specified by the web page author
    with their own choosing. Screen resolution, window size, also how much of a page
    sees when it first appears on their screens. You can ensure only that you write
    standards-compliant HTML and CSS.


    Do not, under any circumstances, spend hours on designing things that look “perfect”
    on your own computer—unless you are willing to be disappointed when you look at
    it on your friend’s computer, the computer in the coffee shop down the street,
    or over your iPhone.


    You should always test your web sites with many of these web browsers as possible:


    +   * Apple Safari (http://www.apple.com/safari/) for Mac and Windows


    +   * Google Chrome (http://www.google.com/chrome) for Windows'
  merge: -1
