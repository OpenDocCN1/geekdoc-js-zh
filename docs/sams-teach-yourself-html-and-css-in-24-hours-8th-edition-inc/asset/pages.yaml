  md: '# HOUR 13: Working with Frames


    In Figure 13.5, everything in the white area is actually content in an <iframe>,
    with the source being a script on Google''s web site that runs and displays content
    within the template at the Digital Inspiration web. If you look closely at Figure
    13.5—and I do not believe you can see it in the figure—you can see a faint grey
