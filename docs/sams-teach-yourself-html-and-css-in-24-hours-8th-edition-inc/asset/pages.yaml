  md: "# Additional Tips for Using Multimedia\n\nHere are a few tips to keep in mind:\n\
    \n+   Don't include multimedia in a page and set it to automatically play when\
    \ the page loads. Always give users the option to start (and stop) your sound\
    \ or video.\n\n+   When possible, give users a choice of multimedia players. Don't\
    \ limit yourself to multimedia content playable by only one type of player on\
    \ only one operating system.\n\n+   Multimedia files are larger than the typical\
    \ graphics and text files, which means you need to have the space on your web\
    \ server to store them, as well as the bandwidth to transfer them to whoever requests\
    \ them via your web site.\n\n+   If your site is entirely audio or video and offers\
    \ very little by way of text or graphics, understand that a segment of your audience\
    \ won't see or hear what you want to present because of the limitations of their\
    \ system or bandwidth. Provide these users with options to get your information.\n\
    \n+   Leverage free video hosting services, such as YouTube (http://www.youtube.com/).\
    \ Not only does YouTube provide storage for your video clips, but it will provide\
    \ you with the code necessary to embed the video in your own page. For example,\
    \ Figure 12.4 shows the YouTube page for the cutest puppy in the world. If you\
    \ copy and paste the text from the “Embed” area shown in the figure,\n\nyou would\
    \ get the following:\n\n```\n<object width=\"425\" height=\"344\">\n  <param name=\"\
    movie\">\n  value=\"http://www.youtube.com/v/pYxiHd2BBopo&rel=0&0xb1b1b1\ncolor=2#0xcfcfcf&feature=player_autoplay&fs=1\"\
    >\n  <param name=\"fullscreen\" value=\"true\">\n  <param name=\"allowScriptAccess\"\
    \ value=\"always\">\n  <embed\n    src=\"http://www.youtube.com/v/pYxiHd2BBopo&rel=0&0xb1b1b1&c\n\
    \    type=\"application/x-shockwave-flash\" fullscreen=\"true\"\n    allowScriptAccess=\"\
    always\" width=\"425\" height=\"344\"></embed>\n</object>\n```\n\nYou could then\
    \ insert the code into your web page."
