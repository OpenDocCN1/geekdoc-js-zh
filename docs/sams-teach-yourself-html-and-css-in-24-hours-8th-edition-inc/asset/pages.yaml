  md: '# Getting Started with a Simple Web Page


    When you save files containing HTML tags, always give them a name in .html. This
    is important: if you forget to type the .html at the end of the filename when
    you save the file, most editors give it some other extension (such as .txt). If
    that happens, you might not be able to find the file when you look at it in a
    web browser; if you find it, it certainly won''t display properly. In other words,
    browsers expect a web page to have a file extension of .html.


    You might also encounter a web page with a file extension of .htm, which is also
    acceptable. You might find other HTML files used on the Web, such as .jsp (Java
    Server Pages), .asp (Microsoft Active Server Pages), or .php (PHP: Hypertext Preprocessor),
    but these file types use server-side technologies that are beyond the scope of
    HTML.


    Listing 3.1 shows an example of text you can save to create a simple HTML page.
    If you opened this with Firefox, you would see the page shown in Figure 3.1. Every
    web page you create must include the `<html></html>`<head></head><title></title></body>`
    tag pairs.


    # Listing 3.1 The <html>, <head>, <title>, and <body> Tags


    ```

    <?xml version="1.0" encoding="UTF-8">

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 1.1//EN"

    "http://www.w3.org/TR/html11/DTD/xhtml11.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">

    <head>

    <title>The First Web Page</title>

    </head>

    <body>

    <p>

    In the beginning, Tim created the HyperText Markup Language. The Internet was
    without form and void, and the text was upon the face of the monitor and the Hands
    of Tim moving over the face of the keyboard. And Tim said, Let there be links;
    and there were links. And Tim saw that the links were good; and Tim separated
    the links from the text. Tim called the links Anchors, and the text He called
    Other Stuff. And the whole thing was the first Web Page.

    </p>

    </body>

    </html>

    ```


    > NOTE

    If you''re using TextEdit on a Macintosh computer, the steps for creating an HTML
    file are a little different than using Notepad on a Windows computer—either are
    popular text editors, but with the latter you must first click on the Main menu
    and select Plain Text and then change the preferences by unchecking the box for
    Save Text Files. Also, the defaults are .html documents as they will appear in
    a browser, which won''t allow you to edit them. To fix this, ignore Rich Text
    Commands in HTML Files using the Rich Text Processing header.'
