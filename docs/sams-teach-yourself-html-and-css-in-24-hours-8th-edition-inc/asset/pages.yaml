  md: '# Q&A


    243


    The hidden value leaves the element the same size, allowing the overflow text
    to remain hidden from view. Perhaps the most interesting value is scroll, which
    adds scrollbars to the element so that you can move around and see the text.


    # Summary


    This hour began with the very important discussion about the CSS Box Model and
    how to calculate the width and height of elements when margins, padding, and borders
    into consideration. The hour continued by tackling absolute positioning of elements,
    and then you learned about using z-index. You learned about a few nifty little
    properties that allow you to control the flow of text on a page.


    # Q&A


    +   * How would I determine when to use relative positioning and when to use absolute
    positioning?


    +   * Although there are no set guidelines regarding the usage of relative absolute
    positioning, the general idea is that absolute positioning is required only when
    you want to exert a finer degree of control over how content is positioned. This
    has to do with the fact that absolute positioning allows you to position content
    down to the exact pixel, whereas relative positioning is less predictable in terms
    of how contents position. This is not to say that relative positioning can''t
    do a good job of positioning elements on a page; it means that absolute positioning
    is more exact. Of course, this also absolute positioning potentially more susceptible
    to changes in screen size, which you can''t control.


    +   * If you decide the z-index of two elements that overlap each other, how do
    I know which element will appear on top?


    +   * If the z-index property isn'' set for overlapping elements, the element
    appearing later in the web page will appear on top. The easy way to remember this
    is to think of a web browser drawing each element as a page as it reads from the
    HTML document; elements read later in the document are drawn on top of those which
    were earlier.'
