  md: '# HOUR 4: Understanding Cascading Style Sheets


    # A CSS Style Primer


    You have a basic knowledge of CSS style sheets and how they are based on style
    rules that describe the appearance of information in web pages. The next few sections
    of this hour provide a quick overview of some of the most important style properties
    and allow you to get started CSS in your own style sheets.


    CSS includes various style properties that are used to control fonts, alignment,
    and margins, to name just a few. The style properties in CSS can be generally
    grouped into two major categories:


    +   - Layout properties, which consist of properties that affect the positioning
    of elements on a web page, such as margins, padding, alignment, and so on.


    +   - Formatting properties, which consist of properties that affect the visual
    display of elements within a web site, such as the font type, color, and so on.


    # Layout Properties


    Layout properties are used to determine how content is placed on a web page. One
    of the most important layout properties is the display property, which describes
    how an element is displayed with respect to other elements. There are four values
    for the display property:


    +   - `block`—The element is displayed on a new line, as in a new paragraph.

    - `list-item`—The element is displayed on a new line with a list-item marker (bullet)
    next to it.

    - `inline`—The element is displayed inline with the current paragraph.

    - `none`—The element is not displayed; it is hidden.


    It''s easier to understand the display property if you visualize each element
    on a web page occupying a rectangular area when—the display property controls
    the manner in this rectangular area is displayed. For example, the `block` value
    results in the element being placed on a new line by itself, while the `inline`
    value places the element next to the content just before it. The `display` property
    is one of the few style properties that can be applied in most style rules. Following
    is an example of how to set the `display` property:


    ```

    display:block;

    ```'
