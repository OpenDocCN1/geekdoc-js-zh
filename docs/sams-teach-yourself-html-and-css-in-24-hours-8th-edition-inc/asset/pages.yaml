  md: '# HOUR 24: Helping People Find Your Web Pages


    To tackle this problem, you need a basic understanding of how most people decide
    which pages they will look at. There are basically three ways people become aware
    of your web site:


    +   - Somebody tells them about it and gives them the address; they enter directly
    into their web browser.


    +   - They follow a link to your site from someone else''s.


    +   - They find your site index in the databases that power the Google, Bing,
    or Yahoo! search engines (among others).


    You can increase your web traffic with a little time and effort. To increase the
    number of people who hear about you through word-of-mouth, use your mouth—and
    every other channel of communication available to you. If you have an existing
    database or mailing list, announce your web site to those people. Add the address
    to your business cards or company literature. If you have the money, go buy TV
    and radio broadcasting your Internet address. In short, do the marketing thing.
    Good old-fashioned marketing is still the best thing, even on the Internet.


    Increasing the number of links to your site from others is also straightforward—though
    that isn''t a lot of work. If there are specialized directories on your topic,
    either online or in print, be you are listed. Participate in social networking,
    including the implementation of Facebook “fan” pages (if applicable) for your
    service or business. Create a Twitter account to broadcast news and connect with
    others—again, if is applicable to your online presence. Go into the spaces where
    your customers might be, such as blogs that comment on your particular topic of
    interest, and participate in those communities. That is not to say that you will
    find a forum on your topic or service and spam it with links to your site. As
    an expert in your field, offering advice and recommendations along with your site
    URL. There is not much I can say in this book to help you with that, except to
    go out and do it.


    The main thing I can help you with is making sure your content has been gathered
    and indexed correctly by search engines. It is a fair assumption that if your
    isn''t in Google''s databases, you''re in trouble.


    Search engines are basically huge databases that index as much content as the
    Internet possible—including videos and other media. They use automated processing
    to search sites, using called robots or spiders to search pages for content and
    build the databases. After the content is indexed, the search applications themselves
    use highly sophisticated techniques of ranking pages to determine which content
    to display first, second, third, and so on when a user enters a search term.


    A very popular, high traffic, and well-respected site (due to their accuracy and
    added value) for tips for interacting in social working spaces, especially for
    the business user, is Mashable: http://www.mashable.com/.'
