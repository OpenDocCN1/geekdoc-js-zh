  md: '# Workshop


    The workshop contains questions and activities to help you solidify your understanding
    of the material covered. Try to answer all questions before looking at the “Answers”
    section that follows.


    # Quiz


    +   1. What happens when you use a negative value for the top property?

    2. Which event is used to change something about the page when the user moves
    the mouse out of the boundaries of a particular element?

    3. If you saw the cursor: crosshair style in a stylesheet, what would you assume
    it did?


    # Answers


    +   1. Using a negative value for top places content above the top-left corner
    of the parent element (rather than below it).

    2. The mouse event is used.

    3. Turn the user’s mouse pointer into a large plus sign (or crosshair). It is
    unclear why you would do that, though, because this is an atypical presentation
    of the cursor. In other words, users will wonder why you did that to their interfaces;
    they won’t appreciate it as a design decision on your part.


    # Exercises


    +   - Create your own page with rollover tooltip texts, using colors and other
    styles that work with your own design template.

    - Add commands to the onclick attributes in Listing 18.2 such that only one of
    the <div> elements (the elevation or photos) is visible at a time.'
