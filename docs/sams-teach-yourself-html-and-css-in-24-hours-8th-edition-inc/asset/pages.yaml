- img_proc: true
  md: '# Using Web Addresses


    currently browsing and therefore does not require the protocol type (for example,
    http://) and the domain name (for example, www.yourdomain.com), but the initial
    forward slash is to show that the address begins at the root


    In the third line, the double dot (..) is a special command that indicates the
    folder that contains the folder—in other words, the parent folder. Anytime you
    see the double dot, just to think yourself “go up a level” in the directory structure.


    If you use relative addressing consistently throughout your web pages, you can
    move the pages to another folder, disk drive, or web server without changing the
    links.


    Relative addresses can span quite complex directory structures if necessary. Hour
    23,“Organizing and Managing a Web Site,” offers more detailed advice for organizing
    and linking numbers of web pages.


    # TIP


    The general rule surrounding relative addressing (elephants/african.html) versus
    absolute addressing (http://www.takeme2zoo.com/elephants/african.html) is that
    you should use relative addressing when linking to files that are stored together,
    as files that are all part of the same web site. Absolute addressing should be
    used when you’re linking to files somewhere else—another computer, another disk
    drive, or more commonly, another web site.


    # TRY IT YOURSELF


    Hopefully by now you’ve created a page or two of your working through the lessons.
    Follow these steps to add a few more pages and link them:


    +   1. Use a “home” page as a main entrance and a central hub to which all of
    your pages are connected. If you created a page about yourself or your business,
    use that page as your home page. You also like to create a new page for your purpose.


    +   2. On the home page, put a list of links to the other HTML files you’ve created
    (or placeholders for the HTML files to create soon). Be sure that the exact spelling
    of the filename, including any capitalization, is correct in every link.


    +   3. On every other page beside the home page, include a link at the bottom
    (or top) leading back to your home page. That makes it simple and easy to navigate
    around your site.


    +   4. You might also want to include a list of links to related or interesting
    sites, either on your home page or on a separate page. People often include a
    list of their friends’ personal pages on their own home page. Businesses, however,
    should be careful not to lead customers to other sites quickly—there’s no guarantee
    they’ll remember to use relative addressing for links between your own pages and
    absolute addressing for links to other sites.'
  merge: -1
