    \ mybullet.gif (or whatever you name your graphic) is on the web server and accessible;\
    \ in that case, all unordered list items will show your custom image rather than\
    \ the standard disc bullet.\n\nWe will return to the specific use of background\
    \ properties in later lessons when using CSS for overall page layouts.\n\n# Using\
    \ Imagemaps\n\nSometimes you might want to use an image as navigation, but beyond\
    \ the simple-button or link-based navigation that you see often in web sites.\
    \ For example, perhaps you have a web site with medical information and you want\
    \ to show an image of the human body that links to pages that provide information\
    \ about various body parts. Or you have a web site that provides a world map users\
    \ can click to access information about countries. You can divide an image into\
    \ regions that link to different documents, depending on users click within that\
    \ image. This is called an imagenemap, and any image can be made into an imagenemap.\n\
    \n# Why Imagemaps Aren't Always Necessary\n\nThe first thing you should know about\
    \ imagenaps is that you probably won't need to use them in very special cases.\
    \ It's almost always easier and more efficient to use several ordinary images\
    \ that are placed directly next to one another and provide a separate link for\
    \ each image.\n\nFor example, see Figure 11.7. This is a web page that shows 12\
    \ different corporate logos; this example is a common type of web page in the\
    \ business world, one in which you give a little free advertisement to your part"
