  md: "# HOUR 16: Using CSS to Do More with Lists\n\nAs shown in Listing 16.2, the\
    \ style sheet has a few entries but the actual HTML is quite short. List items\
    \ are used to create five distinct clickable areas; those \"areas\" are list items\
    \ given a specific height and width and placed over an image that sits in the\
    \ background. If the image is removed from the background of the <div> that surrounds\
    \ the list, the list items exist and are still clickable.\n\nLet's walk through\
    \ the style sheet so that you understand the pieces that make up this XHTML and\
    \ CSS map, which is—at its most basic level—just a list of links.\n\nThe list\
    \ is enclosed in a <div> element named \"<img>\". In the style sheet, <div> is\
    \ defined as block element that is 500 pixels wide, 375 pixels high, and with\
    \ a 1 pixel solid black border. The background of this element is an image tea_shipment.jpg\
    \ that is placed in one position and does not repeat. The next bit of HTML that\
    \ you see is the beginning of the unordered list <ul>. In the style sheet, this\
    \ unordered list is given margin and padding values of zero pixels all and a list-style\
    \ of none—list items will not be preceded by any icon.\n\nThe list item itself\
    \ never appears to the user because of this trick in the style sheet entry for\
    \ all <a> tags within the <div>:\ntext-indent: -1000em;\n\nBy indenting the negative\
    \ 1000 em, you can be assured that the text will never appear. It does exist,\
    \ but it exists in a non-viewable area 1000 em to the left of the browser window.\
    \ In other words, if you raise your left hand and place it to the side of your\
    \ computer monitor, text-indent:-1000em places the text somewhere to the left\
    \ of your pink finger. But that's what we want because we don't need to see the\
    \ text. We need an area to be defined as a link so that the user's cursor will\
    \ change when it rolls over any link in the site.\n\nWhen the user's cursor hovers\
    \ over a list item containing a link, that list item shows a one-pixel border\
    \ is solid white, thanks to this entry in the style sheet:\n\n```\n#img:hover\
    \ {\n  border: 1px solid #ffffff;\n}\n```\n\nThe list items themselves are then\
    \ defined and placed in specific positions based on the areas of the image that\
    \ are supposed to be the clickable areas."
