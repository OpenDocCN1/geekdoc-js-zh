  md: '# Aligning Text on a Page


    It''s easy to take for granted the fact that most paragraphs are automatically
    aligned to the left when you''re reading information on the Web. However, there
    are certainly situations in which you might choose to align content to the right
    or the center of a page. HTML gives you the option to align a single HTML block-level
    element, as text contained within a `<p></p>` or `<div></div>` tag. Before we
    get into the details of aligning block elements, let''s briefly note how attributes
    work.


    # Using Attributes


    Attributes are used to provide additional information related to an HTML tag.
    Attributes are special code words used inside an HTML tag to control exactly what
    the tag does. They are very important in the simplest bit of web content, so it''s
    important you are comfortable using them.


    Attributes invoke the use of styles, classes, or IDs that are applied to particular
    tags. If you define a particular class or ID in a style sheet—as you will learn
    in Hour 4—you can invoke that class or ID using `class="someclass"` or `id="someid`
    within the tag itself. When the browser renders the content for display, it will
    look to the style sheet to determine exactly how the content will appear according
    to the associated style definitions. Similarly, you can use the `style` attribute
    to include style information for a particular element without connecting it to
    an actual style sheet. For example, when you begin a paragraph with the `<p>`
    tag, you can specify whether that paragraph should be aligned to the left margin,
    the right margin, or the center of the page by setting the `style` attribute.
    If you want to associate a particular paragraph with an existing class or ID,
    use the `class` or `id` attribute.


    In the following example, each paragraph could be left-aligned:


    ```

    <p style="align:left">Text goes here.</p>

    <p class="leftStyle">Text goes here.</p>

    <p id="firstAlign">Text goes here.</p>

    ```


    In the first paragraph, the style appears directly in the style attribute. In
    the second paragraph, the paragraph will be left-aligned if the style sheet entry
    for the `leftStyle` class includes the text-align statement. Similarly, the third
    paragraph will be left-aligned if the style sheet entry for the `firstAlign` class
    includes the text-align statement.'
