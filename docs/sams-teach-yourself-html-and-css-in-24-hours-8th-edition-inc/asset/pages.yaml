  md: '# Summary


    Table 12.1 HTML Tags and Attributes Covered in Hour 12


    | Tag/Attribute | Function |

    |---|---|

    | `<object>...</object>` | Inserts images, videos, Java applets, ActiveX controls,
    or other objects into a document. |

    | `<param>...</param>` | Runtime settings for an object, with the width and height
    of the area it occupies on a page. |


    # Attributes


    | | |

    |---|---|

    | `name="name" value="value"` | A named parameter property.n The value associated
    with a named parameter property. |

    | `<embed />` | Embeds a multimedia file to be read or played by a plug-in application;
    this tag is technically deprecated but still useful to browsers not fully supporting
    the `<object>` tag.


    # Attributes


    | | |

    |---|---|

    | `width="width" height="height" type="mimetype"` | The width of the embedded
    object in pixels. The height of the embedded object in pixels. The MIME type of
    the multimedia content. |

    | `src="mediaurl" controls="controls"` | The configuration of the user input controls
    for the media player; use `all` to enable all controls. |

    | `loop="loop"` | Play the media clip once or loop it repeatedly; set to `true`
    or `false`. |

    | `autostart="autostart"` | Play the media clip upon opening the page; set to
    `true` or `false`. |

    | `pluginpage="pluginurl"` | The URL of the plug-in required to play the media
    clip.'
