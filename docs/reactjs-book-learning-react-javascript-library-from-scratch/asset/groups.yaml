    将组件设计想象为你整个应用程序的蓝图。在为你的响应式应用编写第一行代码之前，在纸上规划出一切是一个极好的主意。这是一种直观的方法，将你的页面设计视为一个具有独特元素的
    Web 应用程序来思考。


    就像你当年第一次学习普通的 DOM 并意识到每个 HTML 元素（如 P、DIV、TABLE 等）实际上是对象模型长树链中的一个对象一样，把 React 组件看作与某种软件函数关联的视觉区域吧。这一次，这种功能将由你和你的应用程序需求来自定义决定。


    从这些 React 的最基本原理中，你现在可以看到为什么 Facebook 和 Instagram 喜欢使用它。它速度极快，可以帮助将类似流的元素拆分为由组件组成的软件块，而这些组件只是
    CSS、HTML 和 JavaScript 代码的组合。这种设计模型更接近 App 的行为，而不仅仅是使用表格类布局的信息性网站。


    组件是层级化的。它们可以是其他组件的子元素。在大多数情况下，组件是为你的应用程序中的重用而定制的。它们包含了可以适应各种情况的代码模式。React 代码通常遵循创建这些组件链的模式，它们在内部工作，同时保持了快速的渲染速度和灵活性。


    ## 秘籍 2 - 渲染方法 (Render Method)


    很有可能在构建普通的 HTML-JavaScript 应用时，你已经在某种程度上将应用拆分成不同的隔间。然后，你使用 Ajax 根据每个 HTML 元素单元格中更改的数据类型单独填充每个视图。


    但 React 将这种方法又进一步了一步，要求 `render()`。`render` 方法必须附加在你创建的每个 React 组件上。没有办法绕过它。它是
    React 组件所要求的使用的模式的一部分。


    尽管 React 不仅仅是视图层——使得在使用 React 编程时 `render` 方法变得显式——但这正是 React 被认为主要是一个基于视图的库的原因。我们将在整书中看到为什么这是真的，以及为什么这并不完全正确。


    说 React 编程仅仅是视图编程是不公平的。事实上，渲染目标的选择告诉我们相反的结论：React 是一种遵循基本哲学的编程模式，这种哲学实际上不需要视图。


    你可以将 React 组件的结果渲染到浏览器或渲染到文本字符串（使用专门为此创建的方法，称为 `React.toString()`）、JSON 对象或你希望任何地方。在这种情况下，渲染根本不是渲染。因为“渲染（render）”这个词意味着数据可视化。React
    更像一套原则，而不是许多初学者在熟悉该库之前倾向于认为的“创建用户界面的方法”。


    虽然你可以在 React 之外使用任何第三方库（例如数据库 IO 库），但 React 在视图元素背后的自定义编程方面仍然提供了。事实上，它要求你理解这些编程原理是如何工作的。


    `render()` 方法通常附加到 React 自己的“虚拟”DOM 上，当你的应用程序首次加载到浏览器时执行该方法。但这里是有趣的地方。我们将在秘籍 6
    中更详细地介绍挂载。


    虚拟 DOM 无疑是选择 React 库编写应用程序的最大优势之一。事实上，当你将 react 库添加到你的 Web 项目时，你有必要添加 `react-dom`
    库。这两者是不可分割的。而且所有响应式 JavaScript 应用默认都包含 React 库。


    （重复内容略）


