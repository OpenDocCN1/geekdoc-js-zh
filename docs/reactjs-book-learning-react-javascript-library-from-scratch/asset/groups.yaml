    \ {\n    className: 'result',\n    Scores:scoreBoard }, null)\n)\n// close React.createElement(ScoreBoardUnit...)\n\
    ```\n\n这些 JSX 和 React 代码示例可以等同使用。只要你在后台对代码进行 JSX 编译，它就能工作，且你可以在两者之间切换。JSX 强烈建议与\
    \ React 结合使用，它对于使用或编译 React 程序并不是必须的。如果你必须这样做，直接使用没有 JSX 的 `createElement` 语法即可。\n\
    \n然而，如果你想正确处理，并开始编译过程，我建议观看 Gem 7 中的教程，以熟悉通过 Babel 进行编译过程的复杂性。\n\n设置 Babel 和 JSX\
    \ 需要一点耐心，但非常值得。只需观看视频教程，并按照说明在你的自己的机器上进行设置。\n\n一旦你的文件被积极编译为 ES5，你就可以在自己的程序中使用\
    \ JSX 了。\n\n如从上面的示例所示，这就像是在编写 HTML 标签的同时将它们视为 JavaScript 语句。当然，这段代码发生在某个 .js 文件内部。这不是\
