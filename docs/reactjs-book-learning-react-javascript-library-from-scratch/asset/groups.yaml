    \ camel-case (like `className` and `fontFamily`) methods and properties matching\
    \ the names that we're already familiar with.\n\n## Gem 4 - Two Distinct Ways\
    \ of Initializing a React Class\n\nAs of the time this book is being written,\
    \ the web is still somewhat transitioning from ECMAScript5 to ECMAScript6. When\
    \ ECMAScript 2015 (ES6) came out about two years ago, it caused a lot of turbulence\
    \ in the JavaScript world. And divided programmers into \"the old way\" and \"\
    the new way\" categories. And some prefer to use one style over the other based\
    \ on the circumstance without any problem. Neither one is better or worse.\n\n\
    However, in the end both ES5 and ES6 are executing exactly the same code. Most\
    \ of the difference is syntactic. Surely working in two different languages at\
    \ the same time might create unnecessary headaches, especially when learning React\
    \ for the first time.\n\nThere simply isn't \"one standard way\" of doing anything\
    \ in a loosely typed language as JavaScript. This has always been the case.\n\n\
    It is extremely important to make this distinction, when it comes to creating\
    \ React components. There isn't one way of doing it.\n\nIn this gem, I will demonstrate\
    \ creation of two exactly the same React components in two different ways. The\
    \ difference here, is the difference between ECMAScript5 and ECMAScript6 itself.\n\
    \nFor the most part, one significant difference is in the usage of constructor\
    \ (ES6) and a specialized init state function method (ES5). Let's take a look.\n\
    \nECMAScript5 example looks as follows:\n\n```javascript\nvar NewComponent = React.createClass({\n\
    \  getInitialState() {\n    return { /* initial state */ };\n  }\n});\n```\n\n\
    Notice in ECMAScript5 the constructor keyword does not exist. And this is why\
    \ in this case React provides getInitialState function. If you are writing your\
    \ app in ES5, you should use this method to initialize default state of your component.\n\
    \nWe'll get to states in just a moment. Because it's such an important subject.\
    \ States are tied to react components. You should draw a mental association between\
    \ the component and its state while planning your application. Each component\
    \ is responsible for having a state.\n\nAbove we demonstrated ES5 syntax. I won't\
    \ tell you which one of the two you should use.\n\nEventually ES6 is going to\
    \ become the newly adopted standard within a few years, but many programmers still\
    \ prefer ES5 formatting. Both still work as JavaScript supports ES5 as a subset\
    \ of ES6 for compatibility with future applications.\n\nIf this works for you,\
    \ use ECMAScript6 as demonstrated below, now using the new keywords not available\
    \ available in ES5: class, extends, super and constructor:\n\n```javascript\n\
    class NewComponent extends React.Component {\n  constructor(props) {\n    super(props);\n\
    \    this.state = { /* initial state */ };\n  }\n}\n```\n\nIt's same thing, except\
    \ using ES6 syntax. If you're coming from Java, C# or C++ languages, you might\
    \ be more familiar with this class creation syntax and might prefer it over the\
    \ outdated ES5 format.\n\nNote another difference here is that we're using .Component\
    \ method to create our component, instead of .createClass. But essentially, the\
    \ same exact thing takes places under the hood.\n\nI know that having two different\
    \ ways of doing the same thing can sound perplexing. But here you have a choice\
    \ of using ES5 and have your code execute in all browsers out of the box, or use\
    \ ES6 syntax, and transpile back to ES5. However, the advantage of learning the\
    \ relatively new ES6 syntax is that your application will look cleaner and more\
    \ intuitive.\n\nIt's just the period of time we're faced with right now, as JavaScript\
    \ specification matures. Until browsers fully adopt ECMAScript 6, studying this\
    \ syntax format gives you an advantage of learning something that isn't in wide\
    \ use, but that will definitely become the next standard over the next few years.\n\
    \nMy personal preference is to start using ECMAScript 6 syntax. This road might\
    \ be a little rocky but in order stay on top of things when it comes to becoming\
    \ a better JavaScript programmer, it is a wise thing to do. And these types of\
    \ things always take hard work and effort. The good news is that once you're past\
    \ the learning curve, this will become second nature.\n\n## Gem 5 - States & Life\
    \ Cycles\n\nIn React, each component has a state. A state is an object with values.\
    \ A state is exactly what it sounds like. It's the state of that component in\
    \ terms of one or more flags, parameters and settings usually specified by numerics,\
    \ booleans, arrays or maps.\n\nThe Life Cycle of a React component has a lot to\
    \ do with states. And React provides several default methods that help us write\
    \ efficient applications. These methods are briefly outlined below.\n\nEach component\
    \ will usually control its own states via following methods. They are designed\
    \ to modify or update component's state at a unique time during the application\
    \ flow or component's state.\n\n```javascript\nvar MyComponent = React.createClass({\n\
    \  displayName: 'MyComponent',\n  getInitialState: function() {\n    // ...\n\
    \  },\n  componentWillMount: function() {\n    // ...\n  },\n  componentDidMount:\
    \ function() {\n    // ...\n  },\n  componentWillUnmount: function() {\n    //\
    \ ...\n  },\n  componentWillReceiveProps: function() {\n    // ...\n  },\n  componentWillUpdate:\
    \ function() {\n    // ...\n  },\n  componentDidUpdate: function() {\n    // ...\n\
    \  },\n  shouldComponentUpdate: function() {\n    // ...\n  },\n  render: function()\
    \ {\n    // Render the component to the DOM\n    return null;\n  }\n});\n```\n\
    \n| Method | Description |\n| :--- | :--- |\n| `getInitialState` | Called before\
    \ the component is rendered. Sometimes used synonymously as constructor. |\n|\
    \ `componentWillMount` | Called before render() just once. It is never called\
    \ again. |\n| `componentDidMount` | Called just after the component has been rendered\
    \ for the first time. |\n| `componentWillUnmount` | Called when the component\
    \ is about to be destroyed. This is a place to clean up memory and delete state.\
    \ |\n| `componentWillReceiveProps` | Called when props are passed to the component.\
    \ |\n| `componentWillUpdate` | Called right before the render method is executed.\
    \ |\n| `componentDidUpdate` | Called soon after render() method has finished updating\
    \ the DOM. |\n| `shouldComponentUpdate` | A default method that always returns\
    \ true. Gives us control over whether the component's element should update. |\n"
