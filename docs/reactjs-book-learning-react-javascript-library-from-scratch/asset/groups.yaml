    ## 秘籍 1 - React 组件 (React Components)


    组件是 React 应用的构建块。


    由于 React 主要是为了考虑应用视图（交互式用户界面动态），因此 React 组件可以被视为构成 Web 应用程序的视觉区块。React 将每个组件视为一个可重用的模板。


    在 React 中，每个组件都是 HTML、CSS 和 JavaScript 代码的组合，标识了你应用程序中的一个特定区块。


