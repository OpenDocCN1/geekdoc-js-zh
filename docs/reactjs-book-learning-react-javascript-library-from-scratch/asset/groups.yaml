    \n有一点。你会发现 JSX 使用 `className` 而不是传统 DOM 对象中的 `\"class\"`。JSX 文档对此解释为：“由于 JSX 是\
    \ JavaScript，因此不建议将 `class` 和 `for` 这样的标识符作为属性名。”这就是为什么 JS 中有 `className`，而 `for`\
    \ 对应 `htmlFor`。\n\n要学习 JSX，你应该查看官方文档。再次强调，可以专门为这个主题再写一本书，而我们正试图让你掌握基础知识，以便我们可以在这本书的其余部分重点关注\
    \ React。\n\n# 编写 React.js 应用\n\n欢迎来到 Gems 的第二部分。在本节中，我们将抛弃 Gem 的格式，因为书的第一部分旨在让你简单熟悉\
    \ React 编程和现代软件开发的最常见原则。\n\n这些理论将帮助我们研究使用 React 进行编程的实践方面。所以，让我们开始吧，从编写你的第一个 React\
    \ 组件开始。\n\n# 课程 1 - 编写你的第一个 React 组件\n\n下面你看到的是你可能编写的最第一个 React 组件样样的紧凑示例。它只是将通用的\
    \ Hello World 消息渲染到 DIV 元素中。它只需要一行代码。\n\n```\nReact.createClass({render: function()\
