    \ HTML 属性的 `name=value` 对，而不是 props。但事实就是如此。React 开发者选择了这种命名规范！不要怪送信者：\n\n如果你一直在关注我们上一章节的讨论，你现在应该知道**组件**（components）是什么。它们是\
    \ HTML、CSS 和 JavaScript 代码块的组合，决定了应用程序某个视觉区域的功能。它们负责更新消息流、警报和各种状态更新。\n\n我们也知道组件通常有一个\
    \ `render` 方法来在应用中显示它。在学习 React.js 时，你将遇到的下一件事就是 props。Props 就像函数参数。只不过你将它们传递给组件，而不是函数。不过原理是相同的。\n\
    \n让我们创建一个组件并向它传递一个 prop。\n\n```javascript\n// 创建一个 Hello 组件\nvar Hello = React.createClass({\n\
    \  render: function() {\n    return (\n      <div>Hello, {this.props.name}</div>\n\
    \    )\n  }\n});\n\n// 现在调用 \"render\" 方法在你的 #app 中显示此组件\nReactDOM.render(<Hello\
    \ name=\"Jason\"/>, document.getElementById(\"app\"));\n```\n\n在这里我添加了一个名为 `name`\
    \ 的 prop，并将其赋值为 \"Jason\"。注意它包含在一个自闭标签 `<Hello />` 中。\n\n在组件内部，我们可以通过 `this.props.name`\
    \ 引用它来打印值，而不是使用上一个教程中通用的 \"Hello World\" 示例。\n\n## 函数组件\n\n上面我们演示了一个标准的 React\
    \ 组件。它具有所有的复杂性：它是使用 `createClass` 函数创建的，并包含一个 `render` 方法。但下面的代码实际上也被认为是有效的 React\
    \ 组件，尽管它仅仅是一个标准的 JavaScript 函数：\n\n```javascript\nfunction Hello(props) {\n  return\
    \ <h1>Hello, {props.name}</h1>;\n}\n```\n\n它之所以是一个有效的 React 组件，是因为它返回了一个 React\
    \ 元素。React 元素可以被 React 渲染。（注：此处原文中存在大量重复和 OCR 错误，已按逻辑提取核心含义）。\n\n"
