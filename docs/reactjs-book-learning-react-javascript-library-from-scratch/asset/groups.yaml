    # # REACT.JS Book


    # ## Solid understanding of a hard to learn JavaScript library


    React.js Tutorial Book


    React is definitely one of the hardest things I had to learn from the pool of
    JavaScript libraries. In part, it is because it assumes knowledge of so many other
    things associated with professional web development. Namely, Node.js, mastery
    of babel command line tools, EcmaScript (5 and 6) JSX and possibly WebPack.


    This book also makes an assumption. That you''re completely new to React programming.
    It creates a challenge for me as the author, because it''s my responsibility to
    speak about React in a way that is still meaningful, without overwhelming you
    with large blocks of code that looked complicated and hard to follow.


    Having said this, my strategy for the presentation format of this book follows
    a simple pattern of mixing explanations with simple code examples. Primarily,
    this book is a narrative designed to gradually delve into understanding the React
    Library.


    I''ll put out there right now that this book alone will not be enough to become
    an expert React programmer. No publication about React can claim this, due to
    sheer scope of principles you need to understand in order to get going and start
    writing real applications with React. Then there is also syntactical differences
    between EcmaScript 5, 6 and soon 7. For this reason React may turn out to be one
    of the most unusual learning experiences you have ever had when it comes to JavaScript.


    But breaking through the hard parts is worth the battle. I hope this book will
    prove to be practical in accomplishing this task.


    Written and edited by Greg Sidelnikov

    greg.sidelnikov@gmail.com'
