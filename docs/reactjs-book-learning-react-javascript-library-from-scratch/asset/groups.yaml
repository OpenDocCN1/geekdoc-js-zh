    # A Note From the Author


    Welcome to the introduction chapter of my book.

    This is React Gems a book by Greg Sidelnikov.


    That''s me, the author!


    First, thank you for showing interest in React Gems. This tutorial book was self
    published by myself through my JavaScript development newsletter. It will walk
    you step by step through the process of setting up a development environment and
    learning Reactive programming from start to finish.


    As of 2017, what I call "reactive" programming has become an alternative way of
    thinking about web applications. It provides software patterns that make your
    web app extremely responsive to user input and generally feel faster to the enduser
    (people who are using your application.)


    When I was studying React it took me about 3 weeks for something to occur to me.
    React is unlike any other JavaScript library I have ever programmed with. It assumes
    a lot of previous knowledge. Because of this I had to write this book a certain
    way, that gradually delves into the process of understanding it.


    Studying React is not just about memorizing a few methods here and there and using
    them as you wish. React itself is built on software principles that usually become
    known only to professional software engineers who have worked in the industry
    for a long time. This creates a challenge for authors like me who are trying to
    explain to JavaScript newcomers.


    I chose to solve this problem by adopting a more fluid style of explanations that
    border between discussions and source code and make an attempt to create balance
    between both. I didn''t want to show long React programs and write few comments
    explaining what each line does. That would only complicate the learning process.
    Instead, I broke the narrative of the book into components (no pun intended!)
    that deal with real problems you will be faced when studying React for the first
    time.


    Programming with React library is a lot more than just learning about using React
    objects, components, states, props and methods. The entire book is dedicated to
    explanations of what those are. Have you ever heard of props or states in other
    libraries? States... probably, you did. But not so much props'
