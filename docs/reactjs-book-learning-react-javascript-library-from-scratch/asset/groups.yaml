    # Immediately Invoked Arrow Functions (IIAF)


    If you are familiar with jQuery or JavaScript plugin development, you''ve probably
    indirectly come across IIAF''s and have already seen the often obscure syntax
    of Immediately Invoked Function Expressions (IIFEs) that looks like this:


    ```

    ( function () { ... });

    ```


    Here we execute the function at the moment of its definition.


    You will find this syntax used often at the bottom of the HTML page just above
    the closing body tag. This technique is used to wait until the HTML elements have
    finished loading until starting to execute JavaScript.


    In the same way, arrow functions can be used to achieve equivalent result.


    ```

    () => { ... });

    ```


    This syntax is referred to as Invoked Arrow Functions. The parentheses surrounding
    it make the function execute at that place in your program''s execution flow.'
