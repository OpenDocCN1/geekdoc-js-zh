    \n最终，ES6 将在未来几年内成为新被采纳的标准，但许多程序员仍然偏好 ES5 的格式化。由于 JavaScript 支持 ES5 作为 ES6 的子集以兼容未来的应用，这两种仍然可以工作。\n\
