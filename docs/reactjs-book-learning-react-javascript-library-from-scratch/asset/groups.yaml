- md: "\n## EcmaScript 6 - Things You Need to Know\n\nWhen React was created, it started\
    \ out when ES5 specification was in the spotlight. It was still new and fresh\
    \ in 2015 and even throughout 2016.\n\nHowever, by 2017 it started to progressively\
    \ adapt to ES6 syntax. And this is why it's important to talk about the significant\
    \ changes that were applied to this new standard while studying React.\n\nWhen\
