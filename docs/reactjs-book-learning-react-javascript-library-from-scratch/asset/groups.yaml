    \ code the browsers sees will not even look this way. This is just for us, while\
    \ we're programming our app. But... we can write the code in this format without\
    \ a hitch.\n\nHow it is used is discussed throughout the book. But basically,\
    \ this format is interchangeable with React component structure. What essentially\
    \ you have just created is actually a valid React component pattern.\n\nFor this\
    \ reason, JSX is often used with React as a supplementary library. You can create\
    \ the same statement we've seen in the example above, by writing it using React\
    \ methods. Using JSX is not a requirement, and you can get away without it.\n\n\
    However, without React programming becomes sort like eating a pizza without cheese.\
    \ The two work together to provide a tasty experience, even if it takes trial\
    \ and error to learn how to bake the pie.\n\n- Babel & Transpile from EcmaScript\
    \ 6 to an earlier version (ES5) is a bit of overhead and seems like an unnecessary\
    \ thing to do as well. Because eventually browsers like Chrome and Safari will\
    \ have full support for ES6 and this process will become automatic anyway.\n\n\
    Babel allows us to write this code:\n\n```javascript\nimport someClass from \"\
    someClass.js\";\n```\n\nAnd this will grab the someClass class definition from\
    \ the file someClass.js, where it is defined. As of this writing, Chrome, Firefox\
    \ and none of the other browsers support ES6 import keyword.\n\nHowever, babel\
    \ allows us to start learning and writing ES6 code even now, before official support\
    \ is rolled out in the modern browser. Then until then it will just \"transpile\"\
    \ it back to ES5, behind the scenes, so that the code can actually run in any\
    \ browser today.\n\nThe good news is that installing babel plugins forces you\
    \ to learn how to use command line tools. Traditional JavaScript developers are\
    \ usually unfamiliar with. Which, I think the skill you should be learning anyway.\n\
    \nUsing command line is a \"must-have\" skill in professional software development\
    \ environment (outside of personal projects in some arbitrary folder in your Desktop).\
    \ And... it's one of those extra steps that might potentially prevent delving\
    \ directly into Reactive programming, if not taken. As much of a hassle as it\
    \ may be.\n\n## Good Reasons for learning React\n\n- 1. **It's fast.** This is\
    \ probably the top reason JavaScript programmers are looking to start writing\
    \ applications using React library. Utilizing a virtual copy of the DOM, it is\
    \ designed to perform operations virtually before they are rendered to the standard\
    \ JavaScript DOM tree. This isn't just a numbers game. It's surprising that moving\
