    sole purposes of which is to optimize your app for speed.'
- md: "\n# NPM\n\nCommand line babel application comes together with Node.js installation.\
    \ So if you install Node, you will automatically have babel packages. You just\
    \ need to install them separately from command line using NPM tool, which also\
    \ comes with Node by default.\n\nWhile learning React.js, it's perfectly normal\
    \ to simply add babel via SCRIPT tag. It's just not fast enough for production\
    \ environment when your app goes live. In any case, all babel does is \"transpile\"\
    \ your EcmaScript6 and JSX code back into EcmaScript5, so you can run it in any\
    \ browser that doesn't have full support for ES6 yet. (None of them do, as of\
    \ this writing.)\n\n# Transpiling Source Code\n\nYou've probably heard programmers\
    \ on forums, Twitter and reddit use the word transpiling but may not have fully\
    \ grasped the idea behind it.\n\nUsually, transpiling is the process of compiling\
    \ code in one language into source code in another language. It's just compiling\
    \ between languages. However, when it comes to JavaScript, we will be transpiling\
    \ between two different specifications of EcmaScript, 5 and 6.\n\nThis gives us\
    \ the ability to write code in EcmaScript 6, have it transpile to EcmaScript 5,\
    \ so that modern browsers can actually run your code. Most browsers at the time\
    \ of this writing do not have support for ES6, not even Chrome.\n\nEventually,\
    \ when ES6 support is rolled out for all browsers it will be safe to simply discontinue\
    \ using babel for the purpose of transpiling between EcmaScript specs. The code\
    \ will work out of the box by simply writing it within your standard JavaScript\
    \ files.\n\nBut until then, we might as well use this opportunity to learn about\
    \ a fun source code tool. There are always new standards coming out, and the art\
    \ of transpiling is probably not going away anytime soon.\n\nIn this chapter I\
    \ wanted to introduce you to basic principles of React programming that go beyond\
    \ creation of components alone. Here, I mentioned them briefly in the context\
    \ of our discussion on components and props. As we move forward, we'll keep going\
    \ deeper into the principles of reactive programming. This time around, already\
    \ having brief familiarity with these principles, it will help us advance forward\
    \ to writing practical React applications.\n\n# Lesson 2 - Nested Components\n\
    \nNested components in React.js help you create more complex view element structures.\
    \ I have previously talked about creation of React components. And just as a reminder,\
    \ here is how you would go about creating one.\n\n```\nvar Component = React.createClass({\
    \ render: function(){\n\nreturn (\n\n<Something></Something>\n)\n});\n```\n\n\
    This is just a basic component that returns a set of <Something> HTML tags. I\
    \ know, you're probably still getting used to returning something that looks like\
    \ an HTML tag without quotes around it, but by this time it should start looking\
    \ more familiar :\n\nAs you may have imagined, this is the type of code structure\
    \ you will be working a lot with React. Most other things stem from it. If you've\
    \ ever worked with jQuery, this component structure can be comparable to jQuery's\
    \ object-selector syntax:\n\n```\n$(\".class\").on(\"click\", function() { /*do\
    \ something*/});\n```\n\nWhere we have a callback function return upon the event\
    \ has finished executing. In react, we're returning an HTML element that will\
    \ usually be placed inside our application's structure on the front end.\n\nIn\
    \ case of React components, it's a JavaScript object that contains render function,\
    \ and has a return statement that returns transpiled JSX code. That's what converts\
    \ <Something> tag into Ecma5 that browsers can understand.\n\nWhat gets to be\
    \ in render function and in return statement depends on the purpose of your application.\
    \ In this example, for the sake of clarity, let's call these objects **Parent**\
    \ and **Child** respectively. An actual pair of names if you were writing an application\
    \ could be something like Friend and FriendList. Or Customer and CustomerProperty.\n\
    \n# Parent with a Single Child\n\nUsing this pattern, you can implement a basic\
    \ view functionality.\n\nFirst, let's create the least building block of the pattern\
    \ - the child.\n\n```\nvar Child = React.createClass(\n  render: function() {\n\
    \    return\n    <BUTTON onClick = {this.props.onClick} >{this.props.text}</BUTTON>\n\
    \  }\n);\n```\n\nIn this case the child is a basic component that returns a button\
    \ element. The button provides an onClick event that will be executed by the method\
    \ this.props.onClick.\n\nLet's now create its counterpart Parent class, and use\
    \ Child as the object it will return. I highlighted Child to make sure it's easy\
    \ to see how the Child component is tied to Parent.\n\n```\nvar Parent = React.createClass(\n\
    \  render: function() {\n    return (\n      <Child onClick = {this.handleChildClick}\
    \ text = {this.state.childText} />\n    );\n  },\n  handleChildClick: function(event)\
    \ {\n    // In this method, you can access props\n    // that were passed to the\
    \ Child, using this.state property\n    var child_text = this.state.childText;\n\
    \n    // To access target element of the click\n    var target = event.target;\n\
    \  }\n);\n```\n\nNotice that you can access child's text from handleChildClick\
    \ method within Parent container. The Parent and Child containers are tied by\
    \ the props passed into the text attribute on the Child container.\n\nWhatever\
    \ you pass into the Child (which is located within Parent) will be automatically\
    \ accessible via the parent container. So props are really what establishes the\
    \ relationship between the two.\n\nReact is a relatively new library. However,\
    \ it does use one important JavaScript function that you simply know how to use,\
    \ if you ever plan on using Parent and Child dynamic in your application.\n\n\
    And this standard function is the map method, that natively exists on all objects\
    \ of Array. If you've ever worked with arrays before, you may have least heard\
    \ of this function. All it does creates a new array, calls the callback function\
    \ on each item, and fills the new array with the result of modifications that\
    \ the callback function has applied to each item. In short, Array.map takes all\
    \ items and applies a custom operation on them. Then, it simply returns the new,\
    \ modified data set as a new array.\n\n# Parents with Multiple Children\n\nI'll\
    \ keep the Child component exactly the same for this example, so we can keep things\
    \ simple. Notice the new usage of array's map function within the newly updated\
    \ Parent component:\n\n```\nvar Parent = React.createClass({\n  /* Set defaults\
    \ for children array */\n  getChildrenState: function() {\n    return childData:\
    \ [\n      { childText: \"Click me 1!\", childNumber: 1 },\n      { childText:\
    \ \"Click me 2!\", childNumber: 2 }\n    ];\n  },\n  render: function() {\n  \
    \  var children = this.state.childData.map(function(data, index) {\n      return\
    \ <Child onClick={this.handleChildClick.bind(null,data)} \n      text={data.childText}\
    \ />;\n    }).bind(this));\n    return <div>{children}</div>;\n  },\n  handleChildClick:\
    \ function (event) {\n    // In this method, you were passed to the Child, using\
    \ this.state property\n    var child_text = this.state.childText;\n\n    // To\
    \ access target element of the click:\n    var target = event.target;\n  }\n});\n\
    ```\n\nNow, I purposely created these generic examples to show you the association\
    \ between child and parent, because it's not as trivial as simply nesting HTML\
    \ elements in one another. In react, this link is established programmatically,\
    \ as shown in the examples above.\n\nThese examples that were shown here are the\
    \ basic blocks of reactive programming. In a real world scenario, you will be\
    \ building components that represent actual elements in your application, like\
    \ alerts, friends lists, messages, comments and buttons. But these examples are\
    \ generic. I know it might seem like a hassle to learn all of this, but really,\
    \ once you\n"
  mdcn: "\n\n# NPM\n\n命令行 babel 应用是随着 Node.js 一起安装的。因此如果你安装了 Node，就会自动拥有 babel 软件包。你只需要在命令行中使用\
    \ NPM 工具单独安装它们即可，该工具默认也随 Node 一起提供。\n\n在学习 React.js 时，直接通过 `script` 标签添加 babel\
    \ 是完全正常的。只是当你的应用上线时，这种方法对于生产环境来说速度不够快。无论如何，babel 所做的仅仅是将你的 EcmaScript6 和 JSX 代码“转译”回\
    \ EcmaScript5，这样你就可以在任何尚未完全支持 ES6 的浏览器中运行它。（截至本文写作时，还没有哪个浏览器支持。）\n\n# 源代码转译\n\n\
    你可能听过论坛、Twitter 和 Reddit 上的程序员使用“转译”（transpiling）这个词，但可能还没有完全理解其背后的概念。\n\n通常，转译是将一种语言的代码编译成另一种语言的源代码的过程。它仅仅是语言之间的编译。然而，当涉及到\
    \ JavaScript 时，我们是在两个不同的 EcmaScript 规范（5 和 6）之间进行转译。\n\n这使我们能够使用 EcmaScript 6\
    \ 编写代码并将其转译为 EcmaScript 5，以便现代浏览器实际上可以运行你的代码。在本文写作时，大多数浏览器不支持 ES6，甚至 Chrome 也不支持。\n\
    \n最终，当 ES6 支持覆盖所有浏览器后，就可以安全地停止使用 babel 来进行 EcmaScript 规范之间的转译。你只需在标准的 JavaScript\
    \ 文件中编写代码，它即可开箱即用。\n\n但在那时，我们不妨利用这个机会学习一种有趣的源代码工具。新标准会不断涌现，转译的艺术可能在短期内不会消失。\n\n\
    在本章中，我想向你介绍 React 编程的基本原理，这些原理不仅限于组件的创建。在这里，我在关于组件和属性（props）的讨论中简要提到了它们。随着学习的深入，我们将继续探索响应式编程的原理。这一次，由于已经对这些原理有了初步了解，将帮助我们进阶到编写实用的\
    \ React 应用。\n\n# 课程 2 - 嵌套组件\n\nReact.js 中的嵌套组件帮助你创建更复杂的视图元素结构。我之前提到过 React 组件的创建。为了提醒一下，这里是创建组件的方法：\n\
    \n```\nvar Component = React.createClass({ render: function(){\n\nreturn (\n\n\
    <Something></Something>\n)\n});\n```\n\n这只是一个返回一组 `<Something>` HTML 标签的基础组件。我知道，你可能还在习惯于返回一个没有引号的看起来像\
    \ HTML 标签的内容，但到这时它应该开始看起来更熟悉了：\n\n正如你可能想象的那样，这是你在使用 React 时会经常用到的代码结构类型。大多数其他内容都源于此。如果你用过\
    \ jQuery，这种组件结构可以与 jQuery 的对象选择器语法相比：\n\n```\n$(\".class\").on(\"click\", function()\
    \ { /*执行某些操作*/});\n```\n\n其中，我们在事件执行完毕后返回一个回调函数。在 react 中，我们返回的是一个 HTML 元素，该元素通常会被放置在应用前端的结构中。\n\
    \n对于 React 组件，它是一个包含 `render` 函数的 JavaScript 对象，并有一个返回转译后的 JSX 代码的 `return` 语句。这就是将\
    \ `<Something>` 标签转换为浏览器可以理解的 Ecma5 的东西。\n\n什么放在 `render` 函数和 `return` 语句中取决于你的应用的目的。在这个示例中，为了清晰起见，让我们分别这些对象命名为\
    \ **Parent**（父组件）和 **Child**（子组件）。如果你在编写一个应用，实际名称对可能是 Friend 和 FriendList，或者 Customer\
    \ 和 CustomerProperty。\n\n# 单子组件父组件\n\n使用这种模式，你可以实现基础的视图功能。\n\n首先，让我们创建该模式最小的构建模块——子组件。\n\
    \n```\nvar Child = React.createClass(\n  render: function() {\n    return\n  \
    \  <BUTTON onClick = {this.props.onClick} >{this.props.text}</BUTTON>\n  }\n);\n\
    ```\n\n在这种情况下，子组件是一个返回按钮元素的基础组件。按钮提供了一个 `onClick` 事件，该事件将通过 `this.props.onClick`\
    \ 方法执行。\n\n现在让我们创建对应的 `Parent` 类，并使用 `Child` 作为它返回的对象。我高亮了 `Child` 以确保容易看到 `Child`\
    \ 组件是如何与 `Parent` 关联的。\n\n```\nvar Parent = React.createClass(\n  render: function()\
    \ {\n    return (\n      <Child onClick = {this.handleChildClick} text = {this.state.childText}\
    \ />\n    );\n  },\n  handleChildClick: function(event) {\n    // 在此方法中，你可以访问\n\
    \    // 传递给 Child 的 props，使用 this.state 属性\n    var child_text = this.state.childText;\n\
    \n    // 访问点击的目标元素\n    var target = event.target;\n  }\n);\n```\n\n注意，你可以从 `Parent`\
    \ 容器内的 `handleChildClick` 方法访问子组件的文本。`Parent` 和 `Child` 容器通过传递到 `Child` 容器 `text`\
    \ 属性的 props 绑定在一起。\n\n无论你传递给 `Child`（位于 `Parent` 内部）什么，都可以通过父容器自动访问。因此，props 确实是建立两者之间关系的。\n\
    \nReact 是一个相对新的库。然而，如果你计划在应用中使用动态的 `Parent` 和 `Child`，它确实使用了一个你只需要学会使用的 JavaScript\
    \ 函数。\n\n这个标准函数就是 `map` 方法，它原生存在于所有数组对象上。如果你以前处理过数组，可能至少听说过这个函数。它所做的是创建一个新数组，对每个项调用回调函数，并将回调函数应用的结果填充到新数组中。\n\
    \n# 多个子组件的父组件\n\n为了保持简单，在这个示例中我将保持 `Child` 组件不变。注意更新后的 `Parent` 组件中对数组 `map` 函数的新用法：\n\
    \n```\nvar Parent = React.createClass({\n  /* 为数组设置默认值 */\n  getChildrenState:\
    \ function() {\n    return childData: [\n      { childText: \"点击我1!\", childNumber:\
    \ 1 },\n      { childText: \"点击我2!\", childNumber: 2 }\n    ];\n  },\n  render:\
    \ function() {\n    var children = this.state.childData.map(function(data, index)\
    \ {\n      return <Child onClick={this.handleChildClick.bind(null,data)} \n  \
    \    text={data.childText} />;\n    }).bind(this));\n    return <div>{children}</div>;\n\
    \  },\n  handleChildClick: function (event) {\n    // 在此方法中，你被传递给 Child，使用 this.state\
    \ 属性\n    var child_text = this.state.childText;\n\n    // 访问点击的目标元素：\n    var\
    \ target = event.target;\n  }\n});\n```\n\n现在，我特意创建这些通用示例来向你展示父子之间的关联，因为这并不像简单的嵌套\
    \ HTML 元素那么容易。在 react 中，这种链接是如上面所示通过编程方式建立的。\n\n这里展示的示例是响应式编程的基础块。在现实场景中，你将构建代表应用程序实际元素的组件，如警报、朋友列表、消息、评论和按钮。但这些示例是通用的。我知道学习这一切可能看起来很麻烦，但实际上，一旦你\n\
    \n"
