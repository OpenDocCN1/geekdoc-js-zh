  mdcn: "\n\n```javascript\n$.ajax({ url: \"/login.php\",\n  data: { \"username\"\
    : \"user1\",\n    password\": \"abfgh123\" },\n\n  // login.php 返回了一些数据\n  success:\
    \ function(msg) {\n\n    // 调整 DOM 数据\n    $(\".Name\").html(msg);\n  }\n});\n\
    ```\n\n这是一个刻意简化的示例。但你可以看到，即使如此，代码也位于两个独立的块中。第一个是 HTML 布局定义。它几乎是一个带有某些动态功能的 LoginForm\
    \ 可用模板。\n\n第二个代码块是执行 Ajax 语句的实际程序。这行代码将根据传递给它的数据（用户名和密码）从 PHP 脚本加载数据，并在 `msg`\
    \ 变量中返回某种消息。\n\n最后，使用 jQuery 通过替换类名为 `Name` 的 div 内容为从脚本接收的消息来修改 DOM。\n\n在一段时间内，这种方法工作得很好。在过去的几年里，这就是我们处理网页上动态元素的方式。但\
    \ React 的卓越之处在于，它获取了这一切，并赋予了我们对 HTML 和动态数据的程序化控制，且封装在一个整洁的 `render` 函数中：\n\n```javascript\n\
    render: function() {\n  return\n  <div>\n    {\n      this.state.name ? this.state.name\
    \ :\n      <span>在此处输入用户名</span>\n    }\n  </div>\n}\n```\n\n注意看 HTML 和 JavaScript\
    \ 代码是如何交织在一起的，而无需打开单独的标签。它们都存在于同一个 JavaScript 语句中，并且几乎可以互换使用而没有任何任何问题。我们稍后会介绍这是如何实现的。\n\
    \n当然，这个孤立的示例在实际世界应用之外几乎没有任何意义。但它展示了几个重要的原则。\n\n这段 React 代码从 JSX 语言中借用了 JavaScript\
    \ 跨 HTML 的语法，让我们能够通过简短查看代码就看出动态元素的输出样式。React 在这里试图满足所有人的需求。在某些情况下，你会注意到一些模式，感觉就像是将后端逻辑带入了前端。\n\
    \n这个示例使用了三元运算符 `? :`。基本上，它的意思是如果属性名存在（不为 null 或 undefined），我们就应该输出它。如果不存在，我们应该输出通用的“在此处输入用户名”作为默认消息。\n\
    \n这把 HTML 方法论带到了另一个维度。在这里，我们同时在设计和编写组件。\n\n# 宝石与矿井中工作\n\n这只是第一章，我已经在深入研究 React\
    \ 编程的复杂性了。然而，让我们回到基础，将一些重要的原则拆解成更小的教程片段。这将对我们以后的学习有所帮助。\n\n就像我的《jQuery Gems（宝石）》这本书一样，我们将从一组“宝石”开始，这些是先备知识，将提供前进所需的快速、富有见解的碎片信息。由于软件行业目前正处于\
    \ EcmaScript 5 和 6 的过渡时期，这可以帮助我们解决掉常见的怪异问题，并在当我们学习书中其余课程时，保持关注在重要的事情上。\n\n如果跳过了这些“宝石”，书的后面某些部分可能变得难以理解。特别是如果你将学习\
    \ React 作为你接触 JavaScript 编程的第一个尝试。\n\n但“宝石”只是书的一部分。它们旨在减少许多动荡，并帮助你在响应式原则的提示下进入现代\
    \ JavaScript 编程的世界。\n\n在深入矿井之前，你必须理解这些原则。宝石将磨利你的镐。书的第二部分将向你展示洞穴的其余部分。\n\n# 掌中的\
    \ React\n\n为了让你的旅程更加轻松，我在这里包含了这一部分，代表 React 程序的每个独立方面。系好安全带，准备好吸收许多新原则！我们现在真正要进入\
    \ React 编程的世界了 :)\n\n这是一个俯瞰式的解释，涵盖了构建 React 程序所涉及的最重要概念。我已经提到过学习 React 是碎片化的。而且它假设你具备高级编程模式的知识。\n\
    \n在这一节中，我将尝试将它们拆分成可以单独分析的合理区块。随着我们的进行，这将帮助你把拼图碎片组合在一起。把这里描述的原则视为驱动 React 核心引擎的想法。\n\
    \n仅仅因为它们在这里被整齐地列出，并不意味着学习 React 会很容易。但通过花时间熟悉它们，确实会让阅读书的其余部分变得更容易。\n\n# 核心要素\n\
    \n现在需要理解什么是 `createElement` 接收参数：type, props, children。\n\n在这里，`type` 是元素的名称。例如\
    \ A、H1、DIV 等。\n\n然后我们有 `props`，即你传递给此组件的属性。`Props` 不是状态（state），但它们可以修改状态。我们稍后会更详细地区分这一点。\n\
    \n最后，`children` 只是位于父元素内的层级元素。创建它们的链，并将它们直接输入 `createElement` 函数末尾的 N 个参数。\n\n\
    ```javascript\nlet link = React.createElement('a', {href: '#'}, \"Save\");\nlet\
    \ nav = React.createElement(MyNav, {flat: true}, link);\n```\n\n（注：由于原始文本存在大量\
    \ OCR 错误和重复，以上内容已基于核心逻辑进行了去重整合。）\n\n"
