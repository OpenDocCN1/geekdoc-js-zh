  mdcn: "\n通过编写其中的这几个组件，你将看到 React 的多功能性，因为它就像是将自定义编程嵌入到你日常的 HTML 元素中，对数据流拥有完全控制权，并利用\
    \ Virtual DOM 极速更新应用程序中需要更新的区域。\n\n我希望你喜欢这个教程，并且它被证明是有启发性的。我将在即将出版的新书《React Gems》中更多地讨论这些内容。\n\
    \n## 第 3  - 处理组件事件\n\n到为止，我们只查看了 React 程序的的基础组合。我们创建了组件并查看了它们的内部结构。\n\n在本节中，我们将深入探讨\
    \ React 组件的结构和功能。除了 `render` 之外，我们还将探索三个新方法，每个方法都在组件的生命周期内的不同时间执行。这让我们对应用程序拥有更大的创作控制力。\n\
    \n始终记住，React 组件具有状态（state）。组件的整个目的是绑定到由该组件对象表示的自定义状态。状态是一个包含数据的对象。但组件还拥有辅助函数，这些函数可以更方便地控制这些状态在特定上下文中如何工作。\n\
    \n在本节中，我们将查看其中一些方法。\n\n## 方法 1 - getInitialState\n\n每个组件负责渲染它自己的状态，但 `getInitialState`\
    \ 方法总会在我们的 `render` 函数之前被调用。这与对象的构造函数具有类似的功能。在这里我们设置默认值。\n\n```javascript\nvar\
    \ Example = React.createClass({\n  getInitialState: function() {\n    return {\n\
    \      state: 0;\n    };\n  }\n});\n```\n\n你经常会在 React 组件中看到 `getInitialState`。它会重置绑定到组件的默认值。在这里，你可以从数据库读取值，或者在屏幕上渲染此组件之前将状态重置为默认值。\n\
    \n你可以将此方法与 ECMScript 6 提供的默认构造方法互换使用：\n\n```javascript\nclass Example extends\
    \ React.Component({\n  constructor: function() {\n    this.state = 0;\n  }\n});\n\
    ```\n\n这里唯一的显著区别是我们正在使用 `this` 关键字附加到主对象上。\n\n要在组件渲染在屏幕上时访问状态，我们必须使用 `componentDidMount`\
    \ 方法：\n\n## 方法 2 - componentDidMount\n\n当组件渲染时，React 会自动调用 `componentDidMount`。通过将其添加到自定义的\
    \ React 组件中，你对其进行了重载（overloading）。重载意味着在你扩展自定义组件的所自的默认 React 组件对象中，向已存在的方法中添加你自己的功能。这就是使用\
    \ **extend** 关键字的全部意图。我们正在扩展库已经提供的 React 组件对象的默认功能。\n\n当我第一次在 React 组件中听到“挂载（mounting）”函数时，我不理解它的意思。我们难道不是简单地为我们的主要\
    \ React 组件附加一堆辅助方法吗？\n\n我们在书中前面已经讨论过挂载。如果你仍然需要复习这个过程，我建议确保你已经学过之前讨论过的 **Gem 6\
    \ - 组件挂载 (Component Mounting)**。\n\n`componentDidMount` 是负责设置组件已挂载状态的方法。\n\n```javascript\n\
    var Example = React.createClass({\n  componentDidMount: function() {\n    this.state\
    \ = 1;\n  }\n});\n```\n\n它仅意味着虚拟 DOM 已经与一个将在屏幕上实际更新的 DOM 节点关联。该方法在执行组件的 render\
    \ 命令后总是被调用。它们是同义词，可能可以互换使用。它确保并告诉我们元素已经存在于虚拟 DOM 中。`render` 方法已经在其上调用过了！\n\n##\
    \ 方法 3 - componentWillUnmount\n\n最后，`componentWillUnmount` 在组件从页面移除并即将被销毁之前被调用。\n\
    \n```javascript\nvar Example = React.createClass({\n  componentWillUnmount: function()\
    \ {\n    this.state = null;\n  }\n});\n```\n\n注意，我们在这里将状态重置为 `null`。组件被销毁，我们不再需要它的数据。这是你清理组件所用内存（如果有）的地方，例如初始化定时器。\n\
    \n## 用 React 编写的完整应用程序示例\n\n我们已经涵盖了足够编写完整 React 应用程序的原则。我刻意尝试让书中的所有示例保持简单。复杂性通常来自编程中的创意，如果我把一个大型程序放进这本书，你可能会让你产生挫败感而不是动力。\n\
    \n在这里，我将构建一个简单的搜索应用，从数组中查找结果。如果输入的字符与列表中的任何内容匹配，它们将被过滤掉，所有其他条目将被忽略。\n\n这个应用程序非常像\
