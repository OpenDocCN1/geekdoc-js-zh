  - '[PAGE 53]


    learning a new language, but because it''s likely you already know HTML syntax,
    it''s not difficult to figure it out.


    The only difference is that curly brackets { } can now also be used right JSX
    statements under tag attribute names. The whole tag Scoreboard is treated as an
    object. And its attributes score is its property which contains the value specified
    earlier in code by a JavaScript object score Board, which is JSON-literal object
    notation for creating objects.


    This might seem a bit awkward at first, but gives you tremendous control over
    your application. It unifies document.getElementById(or jQuery''s equivalent of
    $("#id").attr("scores")) which is the method you would otherwise have to use to
    access a property, to a new format.


    This format allows not writing attributes directly into your HTML elements (JSX)
    and assign them to already-existing variables/objects, but also treat HTML as
    a JavaScript statement itself. This is great, because imagine that you can return
    HTML code as a JavaScript statement from a function, and then pass it on to some
    other abstract method in your application. It''s like tossing HTML between functions
    and preparing it for output in one of the containers in your application.


    One thing. You will notice that JSX uses className instead of "class" in traditional
    DOM object. The JSX docs explain it as "Since JSX is JavaScript, identifiers such
    as class and for are discouraged as attribute names." This is why JS has class
    className, and for has htmlFor.


    To learn about JX you should check out the official JSX documentation. Again,
    another book could be written just about the subject, and we''re trying to get
    the basic out of you so we can focus on React throughout the rest of this book.


