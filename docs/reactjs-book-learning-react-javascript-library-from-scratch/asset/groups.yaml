    \n1. 新设计模式。新的，在许多情况下是不熟悉的。如果你是从传统的 2015 年之前的 JavaScript 编程世界来到 React，可能需要时间来适应\
    \ React 库采用的模块化和声明式设计。当然，如果你处理过大型 JavaScript 应用程序，可能已经处理过长长的 .js 文件列表并将其视为独立的模块。但对于大多数程序员来说事实并非如此。React\
    \ 要求我们使用模块化设计来实现最大的应用程序管理效率。\n\n2. JSX 语言让很多人感到困惑。它看起来像是在 JavaScript 中编写 HTML，对于初学者来说，看起来简直不可思议，如果你第一次遇到它：\n\
    \n```javascript\nvar divblocks = <div>\n<div>另一个嵌套标签</div>\n</div>;\n```\n\n就像，等等，你看到我看到的了吗？我们刚刚在\
    \ JavaScript 语句中不断输入了 HTML，没有给 HTML 加上引号，甚至使用了换行符将它们分开……而且还逃过罚。\n\nJSX 处理器（像处理\
    \ HTML 一样处理 XML 并将其转换为我们可以使用的有效 JavaScript 语句）在幕后为我们完成了所有的脏活。实际上，这种代码是从 XML（看起来像\n\
    \n“编译”而来的。\n\n"
