    \ about EcmaScript 6 at all. I know this is a dangerous assumption to make, but\
    \ I think it can be justified by things you will learn in this chapter.\n\nWe\
    \ really isn't anything wrong with ES5. But it isn't going away anytime soon.\
    \ And I think when writing educational books at a time when the industry is still\
    \ transitioning from one specification into another it's important to occasionally\
    \ juggle between the two.\n\nBut we've come to a place of the book where we will\
    \ now investigate the primary differences and additions to JavaScript in EcmaScript\
    \ 6 specification. At the end of the book I will also provide cheat sheets for\
    \ many of the subjects discussed here.\n\n## The var and let keywords\n\nIn ES6\
    \ it's commonly agreed that instead of using var keyword we now use let keyword.\
    \ There are reasons for this, which are described below:\n\n- There is no hoisting\
    \ when using let keyword. If you're familiar with JavaScript's hoisting mechanism,\
    \ you will spot a difference when using the new let keyword.\n\nHoisting is when\
    \ JavaScript moves all variable definitions up the scope in which they are defined.\
    \ This little-known process is done behind the veil. But it is in fact true:\n\
    \n```javascript\nconsole.log( a ); // undefined; but only because it is hoisted\n\
    var a = 1;\n}\n```\n\nAnd the let example:\n\n```javascript\n{\nconsole.log( a\
    \ ); // ReferenceError: \"a\" is not defined at all\nlet a = 1;\n}\n```\n\nIn\
    \ the example above result coming out of console when making an attempt to print\
    \ out value of a variable is undefined. In first case, it's because while the\
    \ variable is hosted. In the second example, because it is not.\n\n- In global\
    \ scope. The let keyword and the old var keyword are still scoped to the global\
    \ scope. But the let keyword is not attached to the global window object:\n\n\
    ```javascript\nvara = 1; // will be attached to global window object\nletb = 1;\
    \ // will not be attached to global window object\nconsole.log(window.a); // 1\n\
    console.log(window.b); // undefined\n```\n\n- In function scope. The let and var\
    \ keyword are still identical in function scope:\n\n```javascript\nfunction helloThere()\
    \ {\n  let x = 1;// identical scoping\n  var y = 1;    // identical scoping\n\
    }\n```\n\n**In statements.** The let keyword is only visible inside for-loop while\
    \ var is visible to ensure visibility of function's scope. So, the let keyword\
    \ limits visibility of variables defined within closest enclosing block specified\
    \ by { and } brackets. Below, let's first take a look at how var traditionally\
    \ handles scoping:\n\n```javascript\n// inside a function and for-loop example\n\
    function helloThereIterator() {\n  // i is theoretically visible here too\n  for\
    \ (var i = 0; i < 10; i++) {\n    // i is visible here.\n  }\n}\n```\n\nPerhaps\
    \ this is not the best example of var keyword (because the loop is where it's\
    \ initially defined) because while it is available everywhere in the function.\
    \ But it still demonstrates the principle.\n\nTraditionally, var is known to exist\
    \ for access within the brackets { } of a function and hidden from function's\
    \ scope but only unless it is the window object. This is the basic rule. But JavaScript\
    \ is complicated like that... and if the variable is not found within the function\
    \ itself, only then the window object is checked, which is outside of the function\
    \ itself.\n\nIt is your responsibility as a programmer to determine whether variable\
    \ should or not be available within the global scope. This is an example of where\
    \ JavaScript tries to be \"everything for everyone.\"\n\nWhile this looseness\
    \ is helpful in many cases and makes the learning curve almost non existent, in\
    \ the long run you will bump into these weird cases, especially when your program\
    \ reaches certain length in large projects.\n\nNow, let's take a look at the same\
    \ example. The only thing we did was swap var over with let keyword. This produces\
    \ different scoping expectations.\n\n```javascript\n// let example\nfunction helloThereIterator()\
    \ {\n  // i is not visible here\n  for (let i = 0; i < 10; i++) {\n    // i is\
    \ visible here, and in callbacks within this scope itself\n  }\n}\n```\n\n- Redclaration\
    \ is not allowed with let keyword\n\nThe var keyword (in strict mode) will let\
    \ you redeclare its own value in the same scope. But this is not true with let\
    \ keyword:\n\n```javascript\n'use strict';\nvar a = 1; // Ok.\nvar a = 2; // Ok.\
    \ a is now 2.\n```\n\n```javascript\n'use strict';\nlet a = 1; // Ok.\nlet a =\
    \ 2; // Syntax error: identifier a is already declared\n```\n\n- The let keyword\
    \ can also be used to avoid problems with closures. It will bind a new value instead\
    \ keeping a reference to the old one.\n\n```javascript\n\"use strict\";\nfor (let\
    \ i = 1; i < 10; i++) {\n  $.ajax(\"url\":\"script.php\", function(msg) {\n  \
    \  console.log(i); // the variable i has lost its original scope here, it's no\
    \ longer associated with the i defined in the loop\n  });\n}\n```\n\nThis code\
    \ demonstrates a common JavaScript problem that happens quite a lot when using\
    \ the var keyword for loop in combination with an ajax call. Here, because i is\
    \ seemingly redefined within ajax's callback function, it is no longer associated\
    \ with the same i that was defined within the for loop.\n\nThis classic problem\
    \ is usually avoided by passing variable into the function as a parameter, needlessly\
    \ creating a new instance of the variable.\n\nHowever, this is not true when let\
    \ is used to define the same scope. It effectively resolves this common problem.\
    \ Here is the same example, only this time using let.\n\n```javascript\n\"use\
    \ strict\";\nfor (var i = 1; i < 10; i++) {\n  $.ajax(\"url\": \"script.php\"\
    , function(msg) {\n    console.log(i); // here i is the one that was originally\
    \ defined in loop\n  });\n}\n```\n\nThis definitely saves many headaches associated\
    \ with loops and callback functions.\n\n- Moreover, the let keyword allows us\
    \ to keep the value of the variable to the scope it was defined in, as shown in\
    \ this isolated example:\n\n```javascript\nlet a = 1;\nconsole.log( a ); // Reference\
    \ error: a is undefined\n```\n\n- In other words, it can be said that a variable\
    \ defined using var is known throughout the function in which it is defined, since\
    \ the moment it is defined. Whereas the let keyword is only known by the scope\
    \ block in which it is defined and all other scopes within it even if it's a callback\
    \ function.\n\n## The new const keyword\n\nConst is exactly like let. The only\
    \ difference is that once you define a value using const it cannot be redefined\
    \ later on in your program. Doing this will produce error:\n\n```javascript\n\
    let a = 1;\na = 2; // this is ok, we simply reassigned the value of a variable\n\
    ```\n\n```javascript\nconst a = 1;\na = 2; // error, this is a constant and cannot\
    \ be reassigned!\n```\n\nHow is this useful? Constant variables are traditionally\
    \ used in computer programs to define values that will not change at runtime throughout\
    \ your application. They are great for flag values and app configuration settings\
    \ that should not change.\n\nOh, and one more thing... When it comes to objects\
    \ only... const keyword, while prevents re-assignment does not actually make the\
    \ assigned object immutable. In contrast to many other languages, making an object\
    \ const would make its properties immutable as well.\n\nNot so in JavaScript.\n"
  mdcn: "\n\n## EcmaScript 6 - 你需要了解的\n\n当 React 创建时，ES5 规范正处于焦点位置。在 2015 年甚至整个 2016\
    \ 年，它仍然是新颖的。\n\n然而，到 2017 年，它开始逐渐适应 ES6 语法。这就是为什么在学习 React 的时候，讨论应用于这一新标准的重大变化是如此重要的。\n\
    \n当你学习 React 时，你学习的不仅仅是 React。它在 ES5 中运行良好良好，但那种语法正在变得过时。这正是许多程序员可能会感到困惑的地方，因为本质上同一个库在你在互联网和书籍中看到的各种不同示例中，看起来可能完全不同。\n\
    \n如果你不知道 React，那么你可能对 EcmaScript 6 一点都不了解。我知道这样假设是危险的，但我想认为你在这一章中学到的内容可以证明它是合理的。\n\
    \nES5 本身并没有问题。但它在短期内不会消失。我认为，在行业仍从一个规范过渡到另一个规范的时期编写教育类书籍时，偶尔在两者之间进行切换是很重要的。\n\n\
    但我们已经到了书的这里，现在我们将研究 EcmaScript 6 规范中 JavaScript 的主要区别和新增。在书结束时，我还将这里讨论的许多主题提供备忘页（cheat\
    \ sheets）。\n\n## var 和 let 关键字\n\n在 ES6 中，共识是不再使用 `var` 关键字，而是使用 `let` 关键字。对此是有原因的，如下所示：\n\
    \n- 使用 `let` 关键字时没有变量提升（hoisting）。如果你熟悉 JavaScript 的变量提升机制，当你使用新的 `let` 关键字时会发现不同。\n\
    \n变量提升是指 JavaScript 将所有变量定义移动到它们定义所在的作用域的顶部。这个不为人知的过程是在幕后完成的。但它确实是如此：\n\n```javascript\n\
    console.log( a ); // undefined; 但仅是因为它被提升了\nvar a = 1;\n}\n```\n\n而 let 的示例：\n\
    \n```javascript\n{\nconsole.log( a ); // ReferenceError: \"a\" is not defined\
    \ at all\nlet a = 1;\n}\n```\n\n在上面的示例中，当尝试打印变量的值时，控制台输出的结果是 `undefined`。在第一情况下，是因为变量被提升了。在第二个示例中，是因为它没有被提升。\n\
    \n- 在全局作用域中。`let` 关键字和旧的 `var` 关键字仍然作用于全局作用域。但 `let` 关键字没有绑定到全局 `window` 对象：\n\
    \n```javascript\nvara = 1; // 将绑定到全局 window 对象\nletb = 1; // 将不会绑定到全局 window 对象\n\
    console.log(window.a); // 1\nconsole.log(window.b); // undefined\n```\n\n- 在函数作用域中。`let`\
    \ 和 `var` 关键字在函数作用域内仍然是相同的：\n\n```javascript\nfunction helloThere() {\n  let x\
    \ = 1;// 相同的作用域\n  var y = 1;    // 相同的作用域\n}\n```\n\n**语句中。** `let` 关键字仅在 `for`\
    \ 循环内部可见，而 `var` 可见以确保函数作用域的可见性。因此，`let` 关键字限制了在 `{ }` 括号指定的最近嵌套块内定义的变量可见性。下面，让我们先来看看\
    \ `var` 传统上是如何处理作用域的：\n\n```javascript\n// 函数内部和 for 循环示例\nfunction helloThereIterator()\
    \ {\n  // i 在理论上在这里也是可见的\n  for (var i = 0; i < 10; i++) {\n    // i 在这里是可见的\n\
    \  }\n}\n```\n\n这可能不是 `var` 关键字的最佳示例（因为循环是它最初定义的地方），因为它在函数内部的处处可用。但它仍然证明了这一原理。\n\
    \n传统上，已知 `var` 可以在函数的括号 `{ }` 内部进行访问，并对函数作用域隐藏，除非它是 `window` 对象。这是基本规则。但 JavaScript\
    \ 就是这么复杂……而且只有在函数内部没有找到变量时，才会检查 `window` 对象，而它是在函数外部的。\n\n确定变量是否应该在全局作用域内可用是程序员的责任。这是\
    \ JavaScript 试图做到“为所有人提供一切”的一个例子。\n\n虽然这种松散性在很多情况下是有帮助的，并让学习曲线几乎不存在，但从长远来看，你会遇到这些奇怪的情况，特别是当你的程序在大型项目中达到一定长度时。\n\
    \n现在，让我们来看同样的示例。我们所做的只是将 `var` 交换为 `let` 关键字。这产生了不同的作用域预期。\n\n```javascript\n\
    // let 示例\nfunction helloThereIterator() {\n  // i 在这里不可见\n  for (let i = 0; i\
    \ < 10; i++) {\n    // i 在这里可见，并且在该作用域内部的回调中可见\n  }\n}\n```\n\n- `let` 关键字不允许重复声明\n\
    \n`var` 关键字（在严格模式下）允许你在同一个作用域内重复声明它的值。但对于 `let` 关键字并非如此：\n\n```javascript\n'use\
    \ strict';\nvar a = 1; // OK.\nvar a = 2; // OK. a 现在是 2.\n```\n\n```javascript\n\
    'use strict';\nlet a = 1; // OK.\nlet a = 2; // Syntax error: 符 a 已经声明\n```\n\n\
    - `let` 关键字也可以用于避免闭包问题。它将绑定一个新值，而不是保留对旧值的引用。\n\n```javascript\n\"use strict\"\
    ;\nfor (let i = 1; i < 10; i++) {\n  $.ajax(\"url\":\"script.php\", function(msg)\
    \ {\n    console.log(i); // 变量 i 在这里失去了它的原始作用域，它不再与循环中定义的 i 关联\n  });\n}\n```\n\
    \n这段代码演示了当在循环中使用 `var` 关键字并结合 `ajax` 调用时，经常发生的常见 JavaScript 问题。在这里，由于 `i` 似乎在\
    \ `ajax` 的回调函数内部被重新定义，它不再与 `for` 循环内定义的同一个 `i` 关联。\n\n这个经典问题通常通过将变量作为参数传递给函数来避免，但这不必要创建该变量的新实例。\n\
    \n然而，当使用 `let` 定义相同的作用域时，情况并非如此。它有效地解决了这个常见问题。这里是同样的示例，只是这次使用了 `let`。\n\n```javascript\n\
    \"use strict\";\nfor (var i = 1; i < 10; i++) {\n  $.ajax(\"url\": \"script.php\"\
    , function(msg) {\n    console.log(i); // 这里 i 是最初在循环中定义的那个\n  });\n}\n```\n\n\
    这确实节省了许多与循环和回调函数相关的烦恼。\n\n- 此外，`let` 关键字允许我们将变量的值保持在它定义的作用域中，如这个独立示例所示：\n\n```javascript\n\
    let a = 1;\nconsole.log( a ); // Reference error: a 是未定义的\n```\n\n- 换句话说，可以说使用\
    \ `var` 定义的变量从它定义的那刻起，在定义的整个函数中都是已知的。而 `let` 关键字仅对定义所在的作用域块以及其内部的所有其他作用域（即使是回调函数）是知的。\n\
    \n## 新的 `const` 关键字\n\n`const` 与 `let` 完全一样。唯一的区别是，一旦你使用 `const` 定义了一个值，在程序的后续部分就无法再重新定义它。这样做将产生错误：\n\
    \n```javascript\nlet a = 1;\na = 2; // 这是可以的，我们只是重新赋值了变量的值\n```\n\n```javascript\n\
    const a = 1;\na = 2; // error，这是一个常量，不能重新赋值！\n```\n\n这有什么用？常量变量传统上用于计算机程序定义在整个应用程序运行期间不会改变的值。它们对于标志位值和不应更改的应用配置设置非常有用。\n\
    \n哦，还有一件事……当涉及到对象时……`const` 关键字虽然防止了重新赋值，但它实际上并没有让被赋值的对象变得不可变。与许多其他语言不同，将对象设为\
    \ `const` 会让它的属性变为不可变。\n\nJavaScript 不是这样。\n\n"
