    # The new const keyword


    Const is exactly like let. The only difference is that once you define a value
    using const it cannot be redefined again later on in your program. Doing this
    will produce error:


    ```

    let a = 1;

    a = 2; // this is ok, we simply reassigned the value of a variable

    ```


    ```

    const a = 1;

    a = 2; // error, this is a constant and cannot be reassigned!

    ```


    How is this useful? Constant variables are traditionally used in computer programs
    to define values that will not change at runtime throughout your application.
    They are great for flag values and app configuration settings that should not
    change.


    Oh, and one more thing... When it comes to objects only... const keyword, while
    prevents re-assignment does not actually make the assigned object immutable. In
    contrast to many other languages, making an object const would make its properties
    immutable as well.


    Not so in JavaScript.'
- md: "\n## Destructuring assignment\n\nEcmaScript 6 introduces us to **destructuring\
    \ assignments**. This is new JavaScript functionality. The previous explanations\
    \ of let keyword laid the groundwork for discussing this next subject. So let's\
    \ take a look at how they work:\n\n```\nlet {a, b} = obj;\n```\n\nIn this example\
    \ two variables *a* and *b* are created. Then, properties **obj.a** and **obj.b**\
    \ are taken from the object named **obj**, and assigned to those variables respectively.\
    \ So this is the equivalent of doing something like:\n\n```\nlet a = obj.a;\n\
    let b = obj.b;\n```\n\nThis format takes a lot more space. *Destructuring assignments*\
    \ save space and provide better readability for our code. Get used to them! :)\n\
    \n## For-of loop\n\nThis is a completely new type of a loop in EcmaScript 6. Let's\
    \ take a look at how it works:\n\n```\nfor (let [key, value] of map) { ... }\n\
    ```\n\nThis mighty for loop will iterate through values stored in map. Unfortunately\
    \ (like many things in JavaScript) the for-of loops do not work on objects (and\
    \ their properties). This is almost a bewildering design decision. So, what for\
    \ for-of loops can work?\n\nThe for-of loops are designed exclusively to work\
    \ with Array, Map and Set objects only.\n\n## The Map object\n\nJust like an Array\
    \ object, ES6 adds a new one, called Map. Maps are nothing more than a simple\
    \ key/value map. They are lot like associative arrays in PHP.\n\nMaps should not\
    \ be used everywhere. Only where you previously used objects as collections. That's\
    \ what they're made for. And using objects should still be primary to your JavaScript\
    \ program design.\n\nMaps have a .size property which determines its size. Unlike\
    \ objects, where you would have to calculate the size of an object manually. Use\
    \ them together with for-of loops when you have collections of data paired by\
    \ key/value association!\n\n## Arrow Functions\n\nOne of the most favored features\
    \ in EcmaScript6 is the arrow functions. I think you should start using them at\
    \ earliest opportunity. Arrow functions are just JavaScript functions written\
    \ in a more compact syntax and are slightly different than regular functions created\
    \ using the function keyword. Here is the basic arrow function syntax format,\
    \ which at first may seem a little odd: \n\n```\nname = (params) => returned expression\n\
    ```\n\nFor example, you can write like this using an arrow function:\n\n```\n\
    x = (a, b) => { console.log(\"This is arrow function x with params = \" + a +\
    \ \" and \" + b); };\n```\n\nBut this is only a function definition. It can be\
    \ executed just like a regular function as follows:\n\n```\nx(5, 7);\n```\n\n\
    One radical difference compared to regular JavaScript functions is in how arrow\
    \ functions treat the **this** keyword. It solves fundamentally the same (or similar)\
    \ problem that **let** keyword solves for regular scopes. We need to get into\
    \ a slightly more involved discussion here.\n\n**JavaScript arrow function** is\
    \ a feature relevant only to EcmaScript 6. It did not exist prior to this specification.\
    \ It adds convenience to making anonymous functions within objects easier to use\
    \ while retaining the value of the **this** object in anonymous event handlers.\n\
    \nArrow functions also modifies the functionality of the **this** object used\
    \ within nameless callback functions within object scope definition by automatically\
    \ binding it to topmost local scope of the object. It reminds me a little of hoisting\
    \ (I briefly talk about hoisting in my other tutorial).\n\nArrow functions help\
    \ us escape **this/that** gymnastics (If you're not familiar with what I'm referring\
    \ to keep on reading, this tutorial explains it) inherent to original scope model\
    \ we've used to.\n\nArrow functions are also known as \"fat arrow\" functions\
    \ due to their syntax.\n\n```\n(params) => { statement };\n```\n\nJust think of\
    \ it as a different syntax of defining a JavaScript function.\n\nThe rest of this\
    \ tutorial will explain the difference between an older JavaScript example and\
    \ how arrow functions can be used to improve code readability and internally tweak\
    \ object functionality.\n\nThe aim of arrow functions is to solve a fundamental\
    \ problem that stems from original JavaScript language design dealing with object\
    \ scoping and the automatic this keyword binding.\n\nAs someone who has developed\
    \ a canvas-based game engine library in JavaScript that required creation and\
    \ instantiation of Line, Rectangle, Sprite and many other useful objects (a library\
    \ to aid the development of a browser-based computer game) like many other web\
    \ developers, I have faced the following.\n\nLet's consider we have this simplified\
    \ version of an object called Sprite for making game character and enemy object\
    \ sprites!\n\nAlso let's create a new \"ship\" object of type Sprite and instantiate\
    \ it.\n\n```javascript\n/* A significantly simplified Sprite object in JavaScript\
    \ */\nvar Sprite = function() {\n  this.angle = 5;\n  this.draw = function() {\n\
    \    alert(this.angle); // display sprite's angle\n  }\n}\nvar ship = new Sprite();\
    \ // instantiate ship\nship.draw(); // draw the ship with this.angle rotation\
    \ angle\n```\n\nNotice the draw function. In this example we output the current\
    \ angle of rotation for our sprite. In real world circumstance the code would\
    \ actually be more complicated. But this is just an example to demonstrate arrow\
    \ functions in JavaScript.\n\nI know that the inner mechanics of JavaScript functions\
    \ have always eluded programmers. The desire to \"experiment\" with how things\
    \ work and go by feelings and hacky results is tempting. In the example the \"\
    this\" keyword is the same within Sprite's own scope and scope of its draw function.\n\
    \nWe specified 5 in Sprite's scope. By referring to it from Sprite's draw function\
    \ we simply pull its value. (Wait, checking logic flow...)\n\nThe \"this\" keyword\
    \ inside an event handler is automatically assigned to the object on which that\
    \ event happened. Let's run this program and see what happens, in comparison to\
    \ our previous example.\n\nThe alert message will now return:\n\n# Undefined\n\
    \nThat's because this.angle within anonymous function() { ... } no longer refers\
    \ to the \"this\" object from Sprite object. And there is no such property \"\
    angle\" attached to the anonymous function (that was passed as an argument to\
    \ setTimeout function.)\n\n```javascript\n/* A simplified Sprite object in JavaScript\
    \ */\nvar Sprite = function() {\n  this.angle = 5;\n  this.draw = function() {\n\
    \    alert(this.angle); // display sprite's angle\n  };\n\n  // New! One solution\
    \ is to create a \"that\" variable still in this scope\n  var that = this;\n\n\
    \  // The following code will execute as part of the\n  // object construction\
    \ process;\n  var timer = setTimeout(function() {\n    alert(that.angle); // display\
    \ sprite's angle from here\n  }, 1000);\n};\n\nvar ship = new Sprite(); // instantiate\
    \ ship\n\nship.draw(); // draw the ship with this.angle rotation angle\n```\n\n\
    All I in this example was assign object to the newly created that variable within\
    \ main Sprite object's scope. Before timer was defined. So in reality we now have\
    \ something like this, that within Sprite.\n\nI also changed this to that within\
    \ setTimeout(function() { ... });\n\nLet's run our code time and see what happens\
    \ now:\n"
  mdcn: "\n\n## 解构赋值\n\nEcmaScript 6 引入了**解构赋值**。这是 JavaScript 的一项新功能。之前对 `let` 关键字的解释为讨论接下来的主题奠定了基础。所以，让我们来看看它是如何工作的：\n\
    \n```\nlet {a, b} = obj;\n```\n\n在这个例子中，创建了两个变量 *a* 和 *b*。然后，从名为 **obj** 的对象提取属性\
    \ **obj.a** 和 **obj.b**，并分别赋值给这些变量。因此，这等于执行以下操作：\n\n```\nlet a = obj.a;\nlet b\
    \ = obj.b;\n```\n\n这种格式占用的空间大得多*解构赋值*可以节省空间并为我们的代码提供更好的可读性。习惯它们吧！:)\n\n## For-of\
    \ 循环\n\n这是 EcmaScript 6 中一种全新的循环类型。让我们来看看它是如何工作的：\n\n```\nfor (let [key, value]\
    \ of map) { ... }\n```\n\n这个强大的 for 循环将遍历 map 中存储的值。遗憾的是（和 JavaScript 中的很多事情一样），for-of\
    \ 循环不能作用于对象（及其属性）。这几乎是一个令人困惑的设计决策。那么，哪些 for-of 循环可以工作呢？\n\nfor-of 循环专门设计用于仅处理\
    \ Array、Map 和 Set 对象。\n\n## Map 对象\n\n与 Array 对象一样，ES6 增加了一个新对象，称为 Map。Map 无非只是一个简单的键/值映射。它们非常像\
    \ PHP 中的关联数组。\n\n不应该在处处使用 Maps。只有在你之前使用对象作为集合的地方才使用它们。这是它们的初衷。在你的 JavaScript 程序设计中，使用对象仍然应该是首主要的。\n\
    \nMaps 有一个 `.size` 属性来确定其大小。与对象不同，在对象中你必须手动计算对象的大小。当你有通过键/值关联的数据集合时，请结合 for-of\
    \ 循环使用它们！\n\n## 箭头函数\n\nEcmaScript6 最受欢迎的特性之一是箭头函数。我认为你应该尽早开始使用它们。箭头函数只是用更紧凑语法编写的\
    \ JavaScript 函数，与使用 `function` 关键字创建的普通函数略有不同。这是箭头函数的基本格式，起初看起来可能有点奇怪：\n\n```\n\
    name = (params) => returned expression\n```\n\n例如，你可以使用箭头函数这样写：\n\n```\nx = (a,\
    \ b) => { console.log(\"This is arrow function x with params = \" + a + \" and\
    \ \" + b); };\n```\n\n但这只是函数定义。它可以像普通函数一样如下所示执行：\n\n```\nx(5, 7);\n```\n\n与普通\
    \ JavaScript 函数相比，一个根本的区别在于箭头函数处理 **this** 关键字的方式。它从根本上解决了与 **let** 关键字为普通作用域解决的相同（或相似）的问题。我们在这里需要进行稍微深入的讨论。\n\
    \n**JavaScript 箭头函数**是一个仅适用于 EcmaScript 6 的特性。它在这一规范之前并不存在。它增加了在对象内部创建匿名函数使用的便利性，同时在匿名事件处理程序中保留了\
    \ **this** 对象的值。\n\n箭头函数还修改了对象作用域定义内无名回调函数中使用的 **this** 对象的功能，通过自动将其绑定到对象的最层局部作用域。这让我想起了一点提升（hoisting）（我在我的其他教程中简要提过提升）。\n\
    \n箭头函数帮助我们逃避原始作用域模型中固有的 **this/that** 操（如果你不熟悉我指的是什么，请继续阅读，本教程将解释它）。\n\n箭头函数也由于其语法而被称为“胖箭头”函数。\n\
    \n```\n(params) => { statement };\n```\n\n只需将其看作定义 JavaScript 函数的另一种语法即可。\n\n\
    本教程的其余部分将解释旧 JavaScript 示例与区别，以及如何使用箭头函数来提高代码可读性并在内部调整对象功能。\n\n箭头函数的目的是解决源于原始\
    \ JavaScript 语言设计的根本问题，该问题涉及对象作用域和自动 this 关键字绑定。\n\n与其他许多 Web 开发者一样，我曾用 JavaScript\
    \ 开发过基于画布的游戏引擎库，这需要创建和实例化 Line、Rectangle、Sprite 以及许多其他有用对象（一个辅助开发浏览器电脑游戏的库），我面临了以下问题。\n\
    \n让我们假设我们有一个名为 Sprite 的简化对象版本，用于创建游戏角色和敌人对象精灵！\n\n此外，让我们创建一个类型为 Sprite 的新“ship”对象并实例化它。\n\
    \n```javascript\n/* JavaScript 中一个显著简化的 Sprite 对象 */\nvar Sprite = function()\
    \ {\n  this.angle = 5;\n  this.draw = function() {\n    alert(this.angle); //\
    \ 显示精灵的角度\n  }\n}\nvar ship = new Sprite(); // 实例化 ship\nship.draw(); // 使用 this.angle\
    \ 旋转角度绘制 ship\n```\n\n注意 draw 函数。在这个例子中，我们输出了精灵的当前旋转角度。在现实世界中，代码实际上会更复杂。但这只是一个演示\
    \ JavaScript 中箭头函数的示例。\n\n我知道 JavaScript 函数的内部机制一直让程序员难以捉摸。这种“实验”事物如何运作并根据感觉和黑客结果来行的想法是诱人的。在示例中，“this”\
    \ 关键字在 Sprite 自身的作用域和其 draw 函数的作用域内是相同的。\n\n我们在 Sprite 的作用域中指定了 5。通过从 Sprite 的\
    \ draw 函数中引用它，我们只是获取了它的值。（等等，检查逻辑流...)\n\n事件处理程序内部的 \"this\" 关键字会自动赋值给事件发生的对象。让我们运行这个程序看看发生了什么，与我们之前的示例相比。\n\
    \nalert 消息现在将返回：\n\n# Undefined\n\n这是因为匿名函数 `function() { ... }` 的 `this.angle`\
    \ 不再指向 Sprite 对象的 \"this\" 对象。而且匿名函数上没有附加名为 \"angle\" 的属性（该属性作为参数传递给 setTimeout\
    \ 函数的）。\n\n```javascript\n/* JavaScript 中一个简化的 Sprite 对象 */\nvar Sprite = function()\
    \ {\n  this.angle = 5;\n  this.draw = function() {\n    alert(this.angle); //\
    \ 显示精灵的角度\n  };\n\n  // 新！一种解决方案是在此作用域内仍然创建一个 \"that\" 变量\n  var that = this;\n\
    \n  // 以下代码将作为对象\n  // 构建过程的一部分执行\n  var timer = setTimeout(function() {\n   \
    \ alert(that.angle); // 从这里显示精灵的角度\n  }, 1000);\n};\n\nvar ship = new Sprite();\
    \ // 实例化 ship\n\nship.draw(); // 使用 this.angle 旋转角度绘制 ship\n```\n\n我在这个例子中所做的只是将对象赋值给主\
    \ Sprite 对象作用域内新创建的 `that` 变量。在 timer 定义之前。所以实际上，我们现在有了类似这样的内容，在 Sprite 内部。\n\n\
    我还将将 `this` 改为 `that` 在 `setTimeout(function() { ... });` 中。\n\n让我们再次运行代码看看现在会发生什么：\n\
    \n"
