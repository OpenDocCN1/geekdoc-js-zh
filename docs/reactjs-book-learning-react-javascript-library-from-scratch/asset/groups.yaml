    \ this.state.searchString.trim().toLowerCase();\n\n    if (searchString.length\
    \ > 0) {\n      // 我们正在搜索。过滤结果。\n      libraries = libraries.filter(function(l)\
    \ {\n        return l.name.toLowerCase().match(searchString);\n      });\n   \
    \ }\n\n    // 将此组件作为 JSX 语句返回\n    return (\n      <div>\n        <input type=\"\
    text\" value={this.state.searchString} onChange={this.handleChange} placeholder=\"\
    在此输入\" />\n        <ul>\n          {libraries.map(function(l) {\n            return\
    \ <li>{l.name} <a href={l.url}>{l.name}</a></li>;\n          })}\n        </ul>\n\
    \      </div>\n    );\n  }\n});\n\n// 在页面上渲染 SearchComponent\nReactDOM.render(\n\
    \  <SearchComponent items={ libraries } />,\n  document.getElementById('container')\n\
    );\n```\n\n将此代码放入你应用程序的主 .js 文件中并运行。它将产生基本的下拉功能。输入部分动物名称将它们从主列表中过滤掉。理想情况下，你将从数据库或其他数据存储机制加载此列表。\n\
