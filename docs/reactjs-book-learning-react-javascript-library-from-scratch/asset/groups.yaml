    \ JSX（通常通过 `babel-js` 库或其对应的命令行插件，后者是我建议在生产服务器上使用的），这段代码就能正常编译。\n\n现在我们知道，只有在你的项目中包含了\
    \ babel 译译器（`babel.min.js`）时，它才能工作。（换句话说，不要尝试在“桌面”上某个文件夹的记事本里编写这些代码；你的开发环境必须在\
    \ `<script>` 标签中正确设置才能进行编译，或者至少要在你的页面 `<script>` 标签中包含 `babel-js`。）它使用内部 JSX 处理器将这些内联\
    \ HTML 转换为 JavaScript。\n\n## 函数的纯性\n\n在讨论 React props 之前，我想提提一点。在 React 中，props\
    \ 是只读的。这与一种被称为“纯函数”（pure function）的特殊函数有关。在传统的软件开发中，纯函数是指其内部不会改变传递给它的参数的。\n\n\
    例如：\n\n```javascript\n// 纯函数；不修改参数值\nfunction sum(a, b) { return a + b; }\n```\n\
    \n这被认为纯函数，因为它的主体没有修改任何作为参数传递的参数。另一方面，下面是一个不纯函数的示例：\n\n```javascript\n// 不纯函数；修改了传递的参数\
    \ \"total\" 的值\nfunction sub(total, less) { return total -= less; }\n```\n\n在\
    \ React 中，**props** 遵循了“纯”的理念。这意味着你可以传递它们，前提是你的 React 组件不会从内部改变它们的值。这正是 React\
    \ props 成为**只读**的本质。遵循这一规则是好的。\n\nProps 派自 HTML 元素的属性。将它们称为 props 有点奇怪，因为在 HTML\
