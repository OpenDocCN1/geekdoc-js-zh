    \ the state here back to null. The component is destroyed and we no longer need\
    \ its data. This is the place where you would clean up memory used by your component,\
    \ if any. For example initialize timers.\n\n## Example of a Complete Application\
    \ written in React\n\nWe've covered enough principles to write a complete React\
    \ application. I intentionally tried to make all examples in this book simple.\
