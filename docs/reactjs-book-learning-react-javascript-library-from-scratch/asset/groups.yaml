    We haven''t gone deep into the trenches of React programming to talk about parent
    and child relationships between components. But because in this example we''re
    using the third parameter child, I wanted to say a few words about what it means.


    In the following chapters you''ll see how parent and child associations work between
    components. But basically, for now just know that whatever element or elements
    you pass as children as 3rd argument in createElement method, will become available
    as "props" within that element through this.props.children property.


    This way you can work with child components from within your parent class. Which
    is usually the core of your entire app that contains all of the other secondary
    components. Parents can have multiple children.


    We''ll talk about props are a lot more later. For now, just know that props (or
    properties) are to react components what arguments are to a function. You simply
    pass them into the object as custom values required for functionality of that
    reactive element.


    Also remember that you can''t paste just about any HTML to use it as your JSX
    statements. JSX version of HTML is very similar but not 100% accurate HTML specification.
    It closely resembles it, but there are a few differences.


    For reasons like this, JSX might throw you at first. I struggled with it while
    myself, but when I realized the main purpose was to help write code faster, I
    thought it made things easier in the long run once I adapted to and started using
    it habitually.


    It''s almost like relearning years of working with HTML standard. The hard part
    is knowing limitations of JSX. Because you can get frustrated with knowing why
    they don''t work when they do, even though you use in JSX looks properly formatted.


    It definitely challenges you to think in a new way about designing some parts
    of your application. Bear with this example, and eventually it will sink in and
    start to make a lot more sense.'
- md: "\n## Props\n\nIn my previous chapter I spoke of React components. But there\
    \ is a lot more to it. Previously, we created a simple component, similar to one\
    \ that looks just like this:\n\n```javascript\nReactDOM.render(\n  <h1>Hello</h1>,\n\
    \  document.getElementById('root')\n);\n```\n\nNotice that we are typing HTML\
    \ tags `<h1>` right into `render`'s method as an argument without surrounding\
    \ quotes. This is a syntactic style offered by JSX. It normally will not compile\
    \ in JavaScript, but intelligent IDEs like PHPStorm are aware of JSX syntax and\
    \ will not treat it as an error.\n\nAs long as you have JSX included in your project\
    \ (usually via babel-js library or its counterpart command-line plugin, the latter\
    \ being the one I recommend using on your production server) this will compile\
    \ fine.\n\nNow that we know that this will work only as long as you have babel\
    \ transpiler (babel.min.js) included in your project. (In other words, don't attempt\
    \ writing this in Notepad in some folder on your \"Desktop\"; your development\
    \ environment must be properly set up in `<script>` tag for this to compile, or\
    \ at the very least babel-js should be included in `<script>` tag on your page.)\
    \ It uses internal JSX processor to convert this inline HTML into JavaScript.\n\
    \n## Function Purity\n\nBefore we go into React props, I just wanted to mention\
    \ one thing. In React, props are read-only. And this has a lot to do with a particular\
    \ type of function called pure function. In traditional software development,\
    \ a pure function is one which does not internally change its arguments which\
    \ are passed to it.\n\nFor example:\n\n```javascript\n// pure function; does not\
    \ modify argument values\nfunction sum(a, b) { return a + b; }\n```\n\nThis is\
    \ considered to be a pure function, because its body does not modify any of the\
    \ parameters that were passed as arguments. On the other hand, an example of an\
    \ impure function is shown below:\n\n```javascript\n// impure function; modifies\
    \ value of the passed argument \"total\"\nfunction sub(total, less) { return total\
    \ -= less; }\n```\n\nIn React, **props** take on the \"pure\" ideology. This means\
    \ you can pass them, under the condition that your react component will not be\
    \ changing their values from within itself. This is exactly what makes react props\
    \ **read-only**. It's good to stick to that rule.\n\nProps are derived from HTML\
    \ element properties. It's a bit odd that they are called props. Because in HTML\
    \ elements, properties are single-keyword flags like DISABLED or CHECKED.\n\n\
    The better name for props would be *attributes*. Because they resemble the `name=value`\
    \ pair of HTML attributes not props. But, that's just the way it is. React developers\
    \ have chosen this naming convention! Don't shoot the messenger:\n\nIf you've\
    \ been following our discussion from the previous chapter, you should now know\
    \ what **components** are. They are combinations of HTML, CSS and JavaScript code\
    \ blocks that determine functionality of one visual area of your application.\
    \ They are responsible for updating things like feed messages, alerts and various\
    \ state updates.\n\nWe also know that a component usually has a render method\
    \ to display it in your app. Working with React.js, the next thing you will run\
    \ into are props. Props are like function arguments. Except you pass them to your\
    \ component, not functions. The principle is the same, however.\n\nLet's create\
    \ a component and pass a prop to it.\n\n```javascript\n// Create a Hello component\n\
    var Hello = React.createClass({\n  render: function() {\n    return (\n      <div>Hello,\
    \ {this.props.name}</div>\n    )\n  }\n});\n\n// Now call \"render\" method to\
    \ display this component in your #app\nReactDOM.render(<Hello name=\"Jason\"/>,\
    \ document.getElementById(\"app\"));\n```\n\nHere I added a prop called `name`\
    \ and assigned the value of \"Jason\". Notice that it's contained within a self-closing\
    \ tag `<Hello />`.\n\nWithin the component itself, we can refer to it as `this.props.name`\
    \ to print out its value, instead of the generic \"Hello World\" example from\
    \ the previous tutorial.\n\n## Functional Components\n\nAbove we have demonstrated\
    \ a standard React component. It has all of the complexities of one: it's created\
    \ using `createClass` function, and contains a render method. But the following\
    \ code is actually also considered a valid React component, even though it's nothing\
    \ more than a standard JavaScript function:\n\n```javascript\nfunction Hello(props)\
    \ {\n  return <h1>Hello, {props.name}</h1>;\n}\n```\n\nWhat makes it a valid React\
    \ component is the fact that it returns a React element. React elements can be\
    \ rendered by React. What makes it a valid React component is the fact that it\
    \ returns a React element. React elements can be rendered by React. (Wait, correcting\
    \ logic):\n\nAbove we have demonstrated a standard React component. It has all\
