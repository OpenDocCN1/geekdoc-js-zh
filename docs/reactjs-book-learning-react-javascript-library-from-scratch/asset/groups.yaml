    \ JSX 语言处理机制处理。这有点像学习一种新语言，但因为你可能已经知道 HTML 语法，所以理解起来并不困难。\n\n唯一的区别是花括号 `{ }` 现在也可以用于\
    \ JSX 语句中的标签属性名下。整个 `Scoreboard` 标签被视为一个对象。它的属性 `score` 是它的属性，包含了早早在代码中通过 JavaScript\
    \ 对象 `score Board` 指定的值，而 `score Board` 是创建对象的 JSON 字面量对象表示法。\n\n起初看起来可能有点奇怪，但它让你对应用程序拥有巨大的控制力。它将\
    \ `document.getElementById`（或 jQuery 中等效的 `$(\"#id\").attr(\"scores\")`——即你否则必须使用来访问属性的方法——统一到了一种新格式。\n\
    \n这种格式允许不直接将属性写入你的 HTML 元素（JSX）中并将其赋值给已存在的变量/对象，而且将 HTML 本身视为 JavaScript 语句。这太棒了，因为想象你可以从函数作为\
