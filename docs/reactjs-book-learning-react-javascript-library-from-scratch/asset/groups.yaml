  mdcn: "\n\n# React.js 书籍\n\n学习 React\nJavaScript 库\n从零开始\n\n![](img/7872743894e432d99205d370e86ceeae_0_0.png)\n\
    \n学习曲线 GREG SIDELNIKOV\n\n# REACT.JS 书籍\n\n## 深入理解一个难以学习的 JavaScript 库\n\nReact\
    \ 教程书籍\n\nReact 绝对是我在 JavaScript 库中遇到过的最难的内容之一。在某种程度上，因为它假设你已经掌握了许多与专业 Web 开发相关的知识。即：Node.js、精通\
    \ babel 命令行工具、EcmaScript (5 和 6)、JSX，以及可能还有 WebPack。\n\n这本书还做了一个假设：即你对 React 编程是完全的新手。这对我这个作者来说是一个挑战，因为我的责任是用一种仍然有意义的方式来讲解\
    \ React，而不会用大块看起来复杂且难以理解的代码让你感到目不应接。\n\n尽管如此，我在这本书呈现格式上的策略遵循一个简单的模式：将解释与简单的代码示例结合起来。主要来说，这是一本叙述性的著作，旨在逐步深入理解\
    \ React 库。\n\n我现在就要直言：单凭这本书是不够成为 React 程序员专家的。任何关于 React 的出版物无法声称做到，因为为了入门并开始使用\
