  - '[PAGE 24]


    # Special Props


    Here we will briefly talk about special prop names, of which there are a few.

    These should be treated almost like reserved keywords in JavaScript, except for
    React. They all have a special meaning.


    # Children


    The prop name **children** is automatically added to this.props by **React.createClassName**


    # className


    This prop corresponds to the HTML''s class attribute. You must use **className**
    in your components/elements instead of **name** to avoid clashing with HTML''s
    reserved keyword.


    # htmlFor


    Same as **className** only for the "for" attribute. **htmlFor** should be used
    in your React element anywhere where you need to use "for" attribute.


    # key


    The **key** prop uniquely identifies a ReactElement. It''s used with elements
    in **arrays**.


    # ref


    The **ref** prop accepts a callback function which will be called:


    +   1. With the component instance of DOM node on mount.

    2. With **null** on unmount and when the passed in function changes.


    # style


    The **style** prop accepts an **object** of styles, instead of a string. In React,
    there is no mechanism for specifying CSS styles as a text string. This is one
    of the limitations of using JSX.'
