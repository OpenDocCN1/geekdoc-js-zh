    # Gem 7 - Node.js & NPM


    When I said that studying React involves learning much than just React library,
    it was certainly true. At the very least, working with React requires that you
    install the Node library.


    A whole another book can be written just about Node alone, but with regard to
    React library, we need to install it for several reasons:


    +   1. To provide a localhost environment for our React application. Installing
    Node gives you the ability to run your applications from http://localhost on your
    local machine.

    2. Node automatically comes with Babel and JSX support (JSX is installed as a
    Babel plugin.)


    Installing Node and NPM is surprisingly easy on both Mac (via the terminal) and
    the PC. On the PC it''s as easy as downloading the Node installation file from
    their official website. Run the installation program and you''re all set. Just
    don''t forget to check the checkbox during installation, so it''s also included.


    On a Mac, you can download Node via command line. Pop open your Terminal application
    and type:


    ```

    $ wget http://nodejs.org/dist/node-v0.4.4.tar.gz


    $ tar -xzf node-v0.4.4.tar.gz


    $ cd node-v0.4.4


    $ ./configure


    $ sudo make install

    ```


    That''s it! The configuration log will run and then you''re done.


    On Ubuntu, you might want to run this additional command to install essential
    components:


    ```

    $ apt-get -y install build-essential

    ```'
- md: "\nIt looks like at this point node is installed and ready to be utilized for\
    \ giving us localhost http address where we can test our React code.\n\nHowever,\
    \ the good news is that if you already have Apache server installed on your localhost\
    \ machine, and it's mapped to your development folder, using node for providing\
    \ localhost environment is not necessary. You already have it up.\n\nIn this case,\
    \ you can just writing React programs right inside your existing Apache httpdoc\
    \ folder, or whatever folder it is mapped to your machine. Just create a new folder\
    \ in that directory for example \"my-react-app\", and as usual your project will\
    \ be available for access browser through something like:\n\n```\nhttp://localhost/my-react-app\n\
    ```\n\nHowever, it is highly recommended that you install Node. For any reason,\
    \ it's because it comes with command line version of Babel, JSX plugins, which\
    \ will be required for proper development set up.\n\nThe installation is really\
    \ straightforward on a Mac in terminal. But on PC it is just a bit more challenging,\
    \ especially if you've never done this before.\n\nIf you are still unsure how\
    \ to do this on a PC I recorded a 58-minute supplementary tutorial on YouTube,\
    \ available for free at the following location:\n\n# React JS Tutorial 1 - For\
    \ Beginners | ReactJS JavaScript ES6 Node.js, NPM, Babel Transpiler, Webpack\n\
    \n```\nhttps://www.youtube.com/watch?v=tXaNvGcjEi0\n```\n\nIt's worth going through\
    \ regardless of where you are in the development process. But it's a must-watch\
    \ if you're just starting out.\n\nWatching this tutorial should get you started\
    \ by writing React applications on a PC via the localhost address. So in video\
    \ tutorial I walk through the entire process, step by step. I don't want to rewrite\
    \ the details in this book to you. You can watch it at 2x speed and get through\
    \ it in just about 25 minutes.\n\n# Gem 8 - JSX Walkthrough\n\nIf you've started\
    \ studying React already, you should have heard a lot about JSX. You've also probably\
    \ heard that it is not necessary to use it with React. And that is true. But,\
    \ it is recommended that you do. It just makes things so much easier, even though\
    \ its syntax can appear a little scary at first to traditional JavaScript developers.\n\
    \nJSX is known for being a language that lets you \"write HTML inside JavaScript.\"\
    \ This is true to some degree. The desired effect is that we can treat HTML tags\
    \ as a JavaScript statement. However, JSX actually uses a form of XML which only\
    \ resembles HTML, because it uses tag names that match those of standard HTML\
    \ tags, such as DIV, UL, TABLE and so on. Remember that HTML is just a distant\
    \ brother of XML.\n\nAlthough HTML as might look a bit dinosaur at first, once\
    \ you grasp the idea and get used to it, it really becomes second nature. It's\
    \ definitely something completely new and not usually done (and not even compile\
    \ in most browsers today) but let's take a look at what it actually looks like:\n\
    \n```\nvar highScore = { Player1: 10, Player2: 25 };\n\n<div className=\"class\"\
    \ />\n\n<SomeCounter count = { 3 + 5 } />\n\n<ScoreBoardUnit data-index=\"2\"\
    >\n  <h1>Score Leaderboard</h1>\n  <ScoreBoard className=\"results\" scores={scoreBoard}\
    \ />\n</ScoreBoardUnit>\n```\n\nThis code naturally will not compile in your standard\
    \ browser unless Babel's JSX plugin is helping us transpile it back into ES5,\
    \ the specification we can be sure all modern browsers do understand. In which\
    \ case, it will compile into following React elements.\n\n```\nvar scoreBoard\
    \ = { Player1: 10, Player2: 25 };\n\nReact.createElement('div', { className:'class1'\
    \ }, null)\n\nReact.createElement(SomeCounter, { count: 3 + 5 }, null)\n\nReact.createElement(ScoreBoardUnit,\
    \ { 'data-index': 2 },\n  React.createElement('h1', {}, 'Scoreboard'),\n  React.createElement(Scoreboard,\
    \ {\n    className: 'result',\n    Scores:scoreBoard }, null)\n)\n// close React.createElement(ScoreBoardUnit...)\n\
    ```\n\nThese JSX and React code examples can be used synonymously. As long as\
    \ you JSX transpiling your code in the background, it will work and you can interchange\
    \ between the two. And JSX is highly recommended for combining with React it is\
    \ not necessary for using or with compiling React programs. Just use createElement\
    \ syntax without JSX, if you must.\n\nHowever if you wish to get it right, to\
    \ get started with the transpiling process, I recommend watching the tutorial\
    \ from Gem 7 to get familiar with the complexity of transpiling process via Babel.\n\
    \nIt takes a bit of patience to set up Babel and JSX, but it's so worth it. Just\
    \ go through the video tutorial and follow instructions on how to set it up on\
    \ your own machine.\n\nOnce your files are actively transpiled into ES5, you can\
    \ begin using JSX in your own programs.\n\nAs you can see from the example above,\
    \ this is like writing HTML tags while treating them as JavaScript statements.\
    \ Of course, this code takes place within some .js file itself. This isn't HTML.\n\
    \nNote how DashboardUnity is really just an XML tag. It contains children, just\
    \ as you would expect from any other standard XML code. The reason it works because\
    \ it's processed by JSX language processing mechanism. It's a bit like learning\
    \ a new language, but because it's likely you already know HTML syntax, it's not\
    \ difficult to figure it out.\n\nThe only difference is that curly brackets {\
    \ } can now also be used right JSX statements under tag attribute names. The whole\
    \ tag Scoreboard is treated as an object. And its attributes score is its property\
    \ which contains the value specified earlier in code by a JavaScript object score\
    \ Board, which is JSON-literal object notation for creating objects.\n\nThis might\
    \ seem a bit awkward at first, but gives you tremendous control over your application.\
    \ It unifies document.getElementById(or jQuery's equivalent of $(\"#id\").attr(\"\
    scores\")) which is the method you would otherwise have to use to access a property,\
    \ to a new format.\n\nThis format allows not writing attributes directly into\
    \ your HTML elements (JSX) and assign them to already-existing variables/objects,\
    \ but also treat HTML as a JavaScript statement itself. This is great, because\
    \ imagine that you can return HTML code as a JavaScript statement from a function,\
    \ and then pass it on to some other abstract method in your application. It's\
    \ like tossing HTML between functions and preparing it for output in one of the\
    \ containers in your application.\n\nOne thing. You will notice that JSX uses\
    \ className instead of \"class\" in traditional DOM object. The JSX docs explain\
    \ it as \"Since JSX is JavaScript, identifiers such as class and for are discouraged\
    \ as attribute names.\" This is why JS has class className, and for has htmlFor.\n\
    \nTo learn about JSX you should check out the official documentation. Again, another\
    \ book could be written just about the subject, and we're trying to get the basic\
    \ out of you so we can focus on React throughout the rest of this book.\n\n# Writing\
    \ React.js Applications\n\nWelcome to the second part of Gems. In this section\
    \ we are leaving the gem format behind because the first part of the book was\
    \ designed to simply get familiar with the most common principles of React programming\
    \ and modern software development.\n\nThis theory will help us investigate the\
    \ practical aspects of programming with React. So let's get going and start by\
    \ writing your first React component.\n\n# Lesson 1 - Writing your first React\
    \ Component\n\nBelow you are seeing a compact example of what the very first React\
    \ component you might write would look like. It simply renders the generic Hello\
    \ World message into a DIV element. And it fits on just one line of code.\n\n\
    ```\nReact.createClass({render: function() {\n  return (\n    <div>Hello World.</div>\n\
    \  )\n});\n```\n\nHere, we are using main React library object's method createClass.\
    \ This is how components are created. But what's this code in blue? It looks like\
    \ HTML, without double quotes surrounding it!\n\nComponents are usually stored\
    \ in variables.\n\nFor example:\n\n```\nvar HelloWorld = React.createClass({ ..\
    \ });\n```\n\nStoring components in variable names can help us later on when we\
    \ create parent-child associations between our elements. Which is just a way to\
    \ programmatically create relationships between nested components.\n"
  mdcn: "\n目前到此，node 已经安装并准备好使用了，为我们提供了一个 localhost http 地址，我们可以在那里测试 React 代码。\n\n\
