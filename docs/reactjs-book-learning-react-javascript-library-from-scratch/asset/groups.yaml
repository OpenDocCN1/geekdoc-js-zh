- md: "\n5\n\nThe value of this.that is 5. This happened when we bound *this* object\
    \ to variable called *that*.\n\nI am sure you have used the trick I just described\
    \ in the examples before. If not, well I'm glad you know about it now. Most programmers\
    \ discover it by instinct. Because it takes time to learn the difference in JavaScript\
    \ scoping rules between function objects and anonymous events within those functions.\n\
    \nAnd after all these explanations with a big smile on our face this finally brings\
    \ us to our big final question!\n\n## What are Arrow Functions in JavaScript?\n\
    \nAnd what is the difference between an arrow function and anonymous functions\
    \ in JavaScript?\n\nAn arrow function in JavaScript is an anonymous function with\
    \ shortened syntax. The only two differences versus standard anonymous function\
    \ is in syntax and how `this` object is treated within its scope. A small detail,\
    \ which slightly changes in how the two actually operate when it comes to binding\
    \ of this object.\n\nLet's compare a regular JavaScript anonymous function with\
    \ an arrow function equivalent. We already know what anonymous functions like\
    \ `function(){...}` in JavaScript look like. But arrow functions actually have\
    \ a distinct syntax.\n\nNotice that both do exactly the same thing, execute some\
    \ code. Except arrow functions automatically take care of the cumbersome `this`/that`\
    \ juggling we have just experienced in the previous examples. That doesn't change.\
