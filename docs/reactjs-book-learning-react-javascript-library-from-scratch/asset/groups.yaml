  mdcn: "\n墙上的一块石头。\n\n在 React 中，我们可以在 JavaScript 内部编写 HTML。这与我们多年年来习惯的“在 HTML 中编写\
    \ JavaScript”的传统观念相反，在传统模式中，我们会在 HTML 的属性标签中编写 JavaScript（例如 `onclick=\"this.style.color='red'\"\
    `）。\n\n但 React 给了我们反向操作的能力。我们将发现如何继续前进。现在，让我们扩展一下组件的内容，我将简要解释一下 JSX 如何帮助我们处理 HTML\
    \ 块并将其视为返回值。\n\n话如此……让我们来看创建第一个 React 组件的完整示例，并在一个特定的 HTML 元素中渲染其内容：\n\n```javascript\n\
    // 添加必需的库代码\nvar React = require(\"react\");\n\nvar ReactDOM = require(\"react-dom\"\
    );\n\n// 创建我们的第一个 react 组件 \"HelloWorld\"\nvar HelloWorld = React.createClass({\n\
    \  render: function() {\n    return (\n      <div>\n        Hello World.\n   \
    \   </div>\n    )\n  }\n});\n```\n\n```javascript\n// 在 id 为 \"app\" 的 HTML 元素中绘制\
    \ \"HelloWorld\" 组件\n\nReactDOM.render(<HelloWorld/>, document.getElementById(\"\
    app\"));\n```\n\n注意，我们新创建的组件 HelloWorld 有它自己的 `render` 方法。但作为主渲染引擎的 ReactDOM 对象也有它自己的\
    \ `render` 方法。两者之间的联系是，`ReactDOM.render` 会调用它作为第一个参数传递的组件的 `render` 方法。在这种情况下，它就是我们的\
    \ HelloWorld 组件。\n\n在这里，我们首先包含了上述 React 和 ReactDOM 库。当你从零开始创建一个新的响应式应用时，你需要这样做。这就是初始化\
    \ React 的过程。\n\n接下来，我们在项目中包含了 React，并将使用 `React.create` 方法创建一个 React 类的新实例。虽然这并不是初始化\
    \ React 应用的唯一方法，但在本章中我们将坚持使用这个示例。\n\n最后，我们调用 ReactDOM 的 `.render` 方法。这里的 `<HelloWorld/>`\
    \ 是我们分配 React 代码的变量名 `HelloWorld`。基本上，React 的 `render` 方法接受两个参数。\n\n你只需要将你想渲染的内容作为第一个参数，将你想渲染的位置作为第二个参数（在本例中是\
    \ ID 为 \"app\" 的 HTML 元素）。从现在起，分配给 HelloWorld 变量的任何内容都将渲染在类似 `[div id = \"app\"\
    ]` 的元素中。\n\n这正是 React 编程背后的基本思想。你构建组件并让它们在特定的 HTML 元素中执行操作。虚拟 DOM 会自动处理应用前端视图的快速渲染。\n\
    \n但有一件事……\n\n蓝色高亮的 HTML 代码是将被写入组件渲染区域的部分。是的，我们直接在 JavaScript 语句中输入了 HTML。再次强调，此功能是通过通过\
    \ babel 从你的 node.js 安装 JSX 插件来实现的。\n\n设置这个环境的过程有点复杂。但在我的 YouTube 教程以及本书的后后部分，会有更详细的展示。\n\
    \n恭喜你创建了你的第一个 React 组件！我希望保持简单，不让设置 React 仍需完成的过量内容让你所淹没。但在未来的章节中，我们将继续逐步解读使用\
    \ React 库进行编程，以及它具体包含哪些内容。\n\n# JSX\n\n在 React 中，在 JavaScript 内部编写 HTML 是通过开源\
    \ JSX 引擎实现的。你可以通过访问官方 GitHub 仓库查看 JSX 源码：\n\nhttps://github.com/jsx/JSX\n\n根据官方网站，JSX\
    \ 是一种静态类型的、面向对象的编程语言，设计用于运行在现代网络浏览器上。涉及到 React 时，我们将使用它以 JavaScript 格式编写 HTML\
    \ 标签。这有点奇特且不寻常。但主要是，它赋予了我们像返回 JavaScript 语句一样返回 HTML 代码块的能力。你会发现这是非常有用且直观的。\n\n\
    JSX 简单地将 HTML 语法翻译为 JavaScript。初初看起来可能非常奇怪，但它就像 JavaScript 现在有了它内部的 HTML 处理器。这种思考方式是熟悉\
    \ JSX 的良好起点。随着书籍的推进，我们将在更深入地探讨它。\n"
