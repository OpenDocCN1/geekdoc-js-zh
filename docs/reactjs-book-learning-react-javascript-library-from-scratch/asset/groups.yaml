- md: "\nis the part that actually is exciting, once you truly start understanding\
    \ how it works.\n\nSo, while in ES5, you would use createElement function, in\
    \ JSX (arguably its common use is with the rest of ES6 syntax) you could create\
    \ exactly the same functionality by simply writing it out as follows:\n\n```\n\
    let link1 = <a href=\"#\">Save</a>;\n```\n\nNow you see where I am going with\
    \ this? JSX turns HTML into JavaScript statements. Here link1 is object-like representation\
    \ of the element which is exact equivalent to React code we created earlier with\
    \ createElement method.\n\nAnd yes, link1.href will contain \"#\" by simply declaring\
    \ it as JSX. Once I realized that this is how works JSX started to make a lot\
    \ more sense and I actually started to feel comfortable using it.\n\nIt’s a two-way\
    \ road between HTML and JavaScript where attributes automatically become properties.\
    \ \nAnd here is the more complex example, this time in JSX once again:\n\n```\n\
    let nav = <MyNav>\n<a href=\"#\">Save</a>\n<a href=\"#\">Load</a>\n<a href=\"\
    #\">Delete</a>\n<a href=\"#\">\n  <span alerts=\"0\">No Alerts</span>\n</a>\n\
    </MyNav>;\n```\n\nWe have just recreated virtual DOM using JSX language using\
    \ a JavaScript statement! You can pass the value of nav around as a statement\
    \ into functions. It's almost like another way of creating a mini DOM structure.\n\
    \nNow you (hopefully) see that this is the very structure of virtual DOM in React.\
    \ It's like a secondary DOM we're going to be working with, changing, modifying,\
    \ editing, deleting and adding children from, etc.\n\nWe will update the actual\
    \ primary JavaScript DOM object which is responsible for visible elements in our\
    \ application... but only when it actually needs updating. None of the virtual\
    \ DOM operations we're performing will be associated with spending time updating\
    \ the original DOM. And this is what improves performance of React applications.\n\
    \nThe best thing, React does this for us automatically. As a React programmer,\
    \ you are not required to understand how React does this internally. You just\
    \ focus on design of your application.\n\nNote, of course you type JSX directly\
    \ into your JavaScript application, it will not even compile. You must be running\
    \ JSX processor. To do this you would usually initialize it from command line,\
    \ so it constantly runs in the background.\n\nBabel is a JSX pug. I also recommend\
    \ learning how to make babel your files. What this means is, you can set babel\
    \ up so that it auto-transpiles your js files (and places them into \"build\"\
    \ or \"production\" directory) automatically, as soon as the file changes. Babel\
    \ functionality is called \"watch\". It must first be enabled. I explain how to\
    \ do this on Windows PC in my video tutorial:\n\nReact Tutorial on YouTube that\
    \ helps you set up your development environment, install Node.js, NPM, babel,\
    \ JSX and help you start watching your files:\n\nhttps://www.youtube.com/watch?v=tXanVgcjEiE0\n\
    \nYou can get away with simply adding babel.js to your SCRIPT tag at the top or\
    \ bottom of your web page. JSX will translate just. But this will significantly\
    \ slow down processing of your application. It should be used for testing.\n\n\
    The video, on the other hand is only 58 minutes long, and if you're serious about\
    \ setting up a professional web development environment I recommend breezy through\
    \ it on 2x speed option in YouTube player which should only take 25 minutes. It's\
    \ like a mini introduction course.\n\nFinally, we're drawing this discussion to\
    \ an end by showing that you can also clone elements using **cloneElement.**\n\
    \n```\nReact.cloneElement(element,props,children);\n```\n\nIt works in the exactly\
    \ same way as createElement. Just pass an existing element as argument. Then,\
    \ whatever props and children you pass to corresponding parameters, will be merged\
    \ into ones already available on the original element. This is reminiscent of\
    \ extending object functionality in traditional Object-Oriented programming. Here,\
    \ we're somewhat imitating OOP functionality.\n\nCreated elements can now be actually\
    \ rendered to the DOM. You cannot render virtual DOM. The render function is the\
    \ magick that takes care of this process within React library internals. This\
    \ is when our element \"copy and pasted\" from our virtual DOM into the actual\
    \ DOM that will be visible on the screen.\n\nReact provides render method on the\
    \ main ReactDOM object as shown below. In reactive programming ReactDOM is the\
    \ second most important object after React.\n\n```\nReactDOM.render(reactElement,\
    \ domContainerNode);\n```\n\nHere domContainerNode is the parent element on which\
    \ reactElement will be rendered, re-rendered or attached for the first time (mount).\n\
    \nYou can use render multiple times, if you need to update properties of the component.\n\
    \nHere's what a real-life scenario might look like. In this example we're taking\
    \ a ReactElement and rendering it on a DOM node:\n\n```\nReactDOM.render(\n  React.createElement(\"\
    div\", document.getElementById(\"container\"))\n);\n```\n\nIf you have an element\
    \ already associated with a variable name, you can look it up using ReactDOM.findDOMNode:\n\
    \n```\nReactDOM.findDOMNode(element);\n```\n\nThis statement returns the DOM node\
    \ associated with the given element. Note, that this will only work only after\
    \ element has been rendered to the DOM with the render method. Until then, it\
    \ is not findable in the DOM, even if it was already created.\n\n# Special Props\n\
    \nHere we will briefly talk about special prop names, of which there are a few.\n\
    These should be treated almost like reserved keywords in JavaScript, except for\
    \ React. They all have a special meaning.\n\n# Children\n\nThe prop name **children**\
    \ is automatically added to this.props by **React.createElement**\n\n# className\n\
    \nThis prop corresponds to HTML's class.\n\n# htmlFor\n\nSame as **className**\
