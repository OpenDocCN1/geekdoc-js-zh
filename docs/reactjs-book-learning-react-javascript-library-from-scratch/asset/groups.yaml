  - '[PAGE 51]


    # Gem 8 - JSX Walkthrough


    If you''ve started studying React already, you should have heard a lot about JSX.
    You''ve also probably heard that it is not necessary to use it with React. And
    that is true. But, it is recommended that you do. It just makes things so much
    easier, even though its syntax can appear a little scary at first to traditional
    JavaScript developers.


    JSX is known for being a language that lets you "write HTML inside JavaScript."
    This is true to some degree. The desired effect is that we can treat HTML tags
    as a JavaScript statement. However, JSX actually uses a form of XML which only
    remsembles HTML, because it uses tag names that match those of standard HTML tags,
    such as DIV, UL, TABLE and so on. Remember that HTML is just a distant brother
    of XML.


    Although HTML as might look a bit dinosaur at first, once you grasp the idea and
    get used to it, it really becomes second nature. It''s definitely something completely
    new and not usually done (and not even compile in most browsers today) but let''s
    take a look at what it actually looks like:


    ```

    var highScore = { Player1: 10, Player2: 25 };


    <div className="class" />


    <SomeCounter count = { 3 + 5 } />


    <ScoreBoardUnit data-index="2">


    <h1>Score Leaderboard</h1>


    <ScoreBoard className="results" scores={scoreBoard} />


    </ScoreBoardUnit>

    ```


    This code naturally will not compile in your standard browser unless Babel''s
    JSX plugin is helping us transpile it back into ES5, the specification we can
    be sure all modern browsers do understand. In which case, it will compile into
    following React elements.'
