  md: "# Method 1 - getInitialState\n\nEach component is in charge of rendering its\
    \ own state but the method getInitialState is always called before our render\
    \ function. This has similar functionality to an object constructor function.\
    \ Here we set the default values.\n\n```\nvar Example = React.createClass({\n\
    \  getInitialState: function() {\n    return {\n      state: 0;\n    };\n  }\n\
    });\n```\n\nYou'll often see getInitialState used throughout React components.\
    \ It resets the default value tied to the component. Here you could read values\
    \ from a database or reset state to its default value rendering this component\
    \ on the screen.\n\nYou can use this method interchangeably with the default constructor\
    \ method provided in EcmaScript 6:\n\n```\nclass Example extends React.Component({\n\
    \  constructor: function() {\n    this.state: 0;\n  }\n});\n```\n\nThe only other\
    \ notable difference here is that we're using the this keyword to attach to the\
    \ main object.\n\nTo access the state when the component is rendered on the screen\
