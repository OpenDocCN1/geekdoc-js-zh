  md: '# Good Reasons for learning React


    +   1. It''s fast. This is probably the top reason JavaScript programmers are
    looking to start writing applications using React library. Utilizing a virtual
    copy of the DOM, it is designed to perform operations virtually before they are
    rendered to the standard JavaScript DOM tree. This isn''t just a numbers game.
    It''s surprising that moving UI operations to virtual DOM actually changes how
    your application feels for the end-user. You''ve probably already started noticing
    this phenomenon across the web on websites like Netflix.


    +   2. Modular design. React supports modular design that is often associated
    with building large, scalable applications. The reason for the advent of EcmaScript
    6 specification that came out in 2015 which provides new syntax that favors modular
    methodology, for example the require (ES5) and include (ES6) keywords tie together
    not only files alone but assume class-based relationship between objects. And
    even though of this writing include keyword is not supported in modern browsers
    (even Chrome) we can begin writing modular programs by either using require, or
    transpiling our ES6 code to ES5 by sending it to the browser for rendering. When
    browsers catch up, we will no longer have to transpile. When this takes place,
    React will become an even more common library you''ll see everywhere. Eventually,
    modular JavaScript program will become the norm with or without React.


    +   3. Scalability. In React each HTML element is treated like a programmable
    component that can be nested within other components. Child components have parent
    components associated with them. The relationship between parent and children
    components is established through something known as props. Scalability of React
    programs is achieved by making each component a conglomerate of HTML, CSS and
    JavaScript code.


    +   4. Flexibility. React is more than just a UI view library as opposed to what
    you will probably hear at first when you start figuring it out. And that isn''t
    entirely'
