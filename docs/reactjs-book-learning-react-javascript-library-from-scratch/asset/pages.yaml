  md: '# New Array methods


    The following are the most important additions to the Array objects in ES6.

    Let''s define our common Array object as follows:


    ```

    let arr = new Array();

    ```


    In ES6, we have these new array operation methods:


    find


    ```

    arr.find(callback[, thisArg]);

    ```


    Returns the value of the first item, when passed to callback, produces a "truthy"
    value.


    findIndex


    ```

    arr.findIndex(callback[, thisArg]);

    ```


    The findIndex method is exactly the same as find. The difference is that it will
    return the index of the first item which produces a "truthy" value, not the value.


    fill


    The fill method initializes or "fills" all of the elements at every index of an
    array. It can initialize or set only sector of your array by taking optional parameters
    start and end:


    ```

    arr.fill(value[, start = 0, end = this.length]);

    ```


    By default start is 0 and end is the length of the array.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# copyWith


    This new array method copies a sequence of items within itself as an array, starting
    at the position indicated by start and starting from index indicated by target:


    ```

    arr.copyWith(target, start[, end = this.length]);

    ```


    Here is a practical example:


    ```

    var arr1 = [1,1,1, 2,2,2, 3,3,3];

    // copy first 3 indices to last

    arr1.copyWith(6, 3);

    alert(arr1); // 1,1,1, 2,2,2, 1,1,1

    ```


    This code, apparently copies the "1,1,1" sequence, starting at 0 index in the
    array and copies it over the last 3 indices, that start at target index of 6.
    This is a lot like memory operations in C++, except with arrays.


    # New Built-in Classes


    Built in classes are the pre-existing objects that come packaged with JavaScript.
    For example the familiar ones Object, Array, Function, Date, Math and a few others...
    EcmaScript 6 adds new built-in classes which are listed below:


    +   1. Map a set of key/value pairs. Almost like an array.

    2. Set is like map, except each stored value is unique.

    3. Symbol is used to make private object/class properties.

    4. Promise manages an event that will take place at a future time.


    Promises are interesting because all events usually take place at a future time
    anyway. What''s so different about a promise? The proper explanation would be
    to say that they will take place regardless of whether the structure of your HTML
    document changes. These special events, called "promises" guarantee that the event
    will take place at some time in the future.'
  merge: -1
