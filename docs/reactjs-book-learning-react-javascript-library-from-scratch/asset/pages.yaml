  md: '# The Essentials


    If you''re familiar with jQuery, you''ve used the dollar sign ($) object for HTML
    elements and applying various operations on them.


    But what is a similar building block of React when it comes to HTML elements (not
    components)? It must be the createElement method.


    ```

    React.createElement(type, props, children);

    ```


    And here are a few examples of how you would use createElement in practice:


    ```

    let link = React.createElement(''a'', {href: ''#''}, "Save");

    let nav = React.createElement(MyNav, {flat: true}, link);

    ```


    Here, we programmatically created HTML elements using React method createElement.
    Then we have taken the created link element and placed it within nav element to
    be one of its children.


    Of course in this link is the only child, but multiple links can be used as well,
    as additional arguments separated by comma:


    ```

    let link1 = React.createElement(''a'', {href: ''#''}, "Save");

    let link2 = React.createElement(''a'', {href: ''#''}, "Delete");

    let nav = React.createElement(MyNav, {flat: true}, link1, link2);

    ```


    You can go like this forever, adding as many children as required by your application.


    Notice variable uses MyNav without double quotes. This is perfectly fine. When
    we use custom elements (the standard ones like a, div, table, etc...) that we
    make up ourselves we must use using upper case letters. Therefore, the navigation
    element is called MyNav. As long as we use the leading capital letter React knows
    we''re referring to a custom element. No need to use surrounding quotes here.


    In JSX it will translate to something like <MyNav />


    Eventually with time as you develop your application, you''ll arrive at that'
