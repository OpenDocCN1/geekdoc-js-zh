  md: '# JSX


    In React, writing HTML within JavaScript is achieved by open source JSX engine.
    You can browse JSX source code by looking it up at the official GitHub repository
    at:


    https://github.com/jsx/JSX


    According to the official website JSX is a statically-typed, object-oriented programming
    language designed to run on modern web browsers. When it comes to React, we will
    be using it in order to write HTML tags in JavaScript format. Which is kind of
    quirky and unusual. But primarily, this gives us the ability to return blocks
    of HTML code as though it was a JavaScript statement. Which you will find to be
    useful and intuitive.


    JSX simply translates HTML syntax to JavaScript. This might seem really strange
    at first, but it''s like JavaScript now has its own internal HTML processor. This
    way of thinking is a good starting point of getting familiar with JSX. As we move
    forward in the book we will explore it in more intricate detail as part of the
    source code examples.


    While tempting, it is completely unnecessary to fully understand how JSX does
    this. It takes care of this internally, and helps us focus on writing the code.
    That''s exactly what it''s for!


    JSX has limitations and it''s not entirely pure HTML you''d expect. It''s a derivative
    of XML, not HTML because XML is more strict. Which means it is better for designing
    libraries. But primarily, because it makes it easier to parse and understand.


    JSX does not have an inline CSS parser. So you can use HTML elements with attributes,
    style attribute will not be one of them. You can still use other attributes like
    name.


    In fact, we probably don''t really want a blown HTML processor for our JavaScript
    code. Because it would make things too complicated. HTML has too many edge cases.
    This would mean rewriting a complete HTML interpreter like a lot more work and
    making working with JSX disjointing. Let''s face it, the idea of writing HTML
    within JavaScript is already a little far fetched as. But it really gives us the
    leverage we need for writing code faster, by utilizing primarily'
