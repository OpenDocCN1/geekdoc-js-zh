  md: '# EcmaScript 6 - Things You Need to Know


    When React was created, it started out when ES5 specification was in the spotlight.
    It was still new and fresh in 2015 and even throughout 2016.


    However, by 2017 it started to progressively adapt to ES6 syntax. And this is
    why it''s important to talk about the significant changes that were applied to
    this new standard while studying React.


    When you are learning React, you are learning a lot more than just React. It works
    in ES5 just fine, but that syntax is becoming outdated. And this is where many
    programmers can get puzzled, because essentially the same library might not look
    the same in all the different examples you''re seeing on the Internet and in books.


    If you don''t know React, chances are you probably don''t know much about EcmaScript
    6 at all. I know this is a dangerous assumption to make, but I think it can be
    justified by things you will learn in this chapter.


    We really isn''t anything wrong with ES5. But it isn''t going away anytime soon.
    And I think when writing educational books at a time when the industry is still
    transitioning from one specification into another it''s important to occasionally
    juggle between the two.


    But we''ve come to a place of the book where we will now investigate the primary
    differences and additions to JavaScript in EcmaScript 6 specification. At the
    end of the book I will also provide cheat sheets for many of the subjects discussed
    here.'
