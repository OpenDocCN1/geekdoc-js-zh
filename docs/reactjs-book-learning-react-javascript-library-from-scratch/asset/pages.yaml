  md: '# The var and let keywords


    In ES6 it''s commonly agreed that instead of using var keyword we now use let
    keyword. There are reasons for this, which are described below:


    +   * There is no hoisting when using let keyword. If you''re familiar with JavaScript''s
    hoisting mechanism, you will spot a difference when using the new let keyword.


    Hoisting is when JavaScript moves all variable definitions up the scope in which
    they are defined. This little-known process is done behind the veil. But it is
    in fact true:


    ```

    console.log( a ); // undefined; but only because it is hoisted

    var a = 1;

    }

    ```


    And the let example:


    ```

    {

    console.log( a ); // ReferenceError: "a" is not defined at all

    let a = 1;

    }

    ```


    In the example above result coming out of console when making an attempt to print
    out value of a variable is undefined. In first case, it''s because while the variable
    is hosted. In the second example, because it is not.


    +   * In global scope. The let keyword and the old var keyword are still scoped
    to the global scope. But the let keyword is not attached to the global window
    object:


    ```

    vara = 1; // will be attached to global window object

    letb = 1; // will not be attached to global window object

    console.log(window.a); // 1

    console.log(window.b); // undefined

    ```


    +   * In function scope. The let and var keyword are still identical in function
    scope:'
  merge: -1
  pgno: 85
- img_proc: true
  md: "```\nfunction helloThere() {\nlet x = 1;// identical scoping\nvar y = 1;  \
    \  // identical scoping\n}\n```\n\n**In statements.** The let keyword is only\
    \ visible inside for-loop while var is visible to ensure visibility of function's\
    \ scope. So, the let keyword limits visibility of variables defined within closest\
    \ enclosing block specified by { and } brackets. Below, let's first take a look\
    \ at how var traditionally handles scoping:\n\n```\n// inside a function and for-loop\
    \ example\nfunction helloThereIterator() {\n  // i is theoretically visible here\
    \ too\n  for (var i = 0; i < 10; i++) {\n    // i is visible here.\n  }\n}\n```\n\
    \nPerhaps this is not the best example of var keyword (because the loop is where\
    \ it's initially defined) because while it is available everywhere in the function.\
    \ But it still demonstrates the principle.\n\nTraditionally, var is known to exist\
    \ for access within the brackets { } of a function and hidden from function's\
    \ scope but only unless it is the window object. This is the basic rule. But JavaScript\
    \ is complicated like that... and if the variable is not found within the function\
    \ itself, only then the window object is checked, which is outside of the function\
    \ itself.\n\nIt is your responsibility as a programmer to determine whether variable\
    \ should or not be available within the global scope. This is an example of where\
    \ JavaScript tries to be \"everything for everyone.\"\n\nWhile this looseness\
    \ is helpful in many cases and makes the learning curve almost non existent, in\
    \ the long run you will bump into these weird cases, especially when your program\
    \ reaches certain length in large projects.\n\nNow, let's take a look at the same\
    \ example. The only thing we did was swap var over with let keyword. This produces\
    \ different scoping expectations.\n\n```\n// let example\n```"
  merge: -1
  pgno: 86
- img_proc: true
  md: "```\nfunction helloThereIterator() {\n  // i is not visible here\n  for (let\
    \ i = 0; i < 10; i++) {\n    // i is visible here, and in callbacks within this\
    \ scope itself\n  }\n}\n```\n\n+   - Redclaration is not allowed with let keyword\n\
    \nThe var keyword (in strict mode) will let you redeclare its own value in the\
    \ same scope. But this is not true with let keyword:\n\n```\n'use strict';\nvar\
    \ a = 1; // Ok.\nvar a = 2; // Ok. a is now 2.\n```\n\n```\n'use strict';\nlet\
    \ a = 1; // Ok.\nlet a = 2; // Syntax error: identifier a is already declared\n\
    ```\n\n+   - The let keyword can also be used to avoid problems with closures.\
    \ It will bind a new value instead keeping a reference to the old one.\n\n```\n\
    \"use strict\";\nfor (let i = 1; i < 10; i++) {\n  $.ajax(\"url\":\"script.php\"\
    , function(msg) {\n    console.log(i); // the variable i has lost its original\
    \ scope here, it's no longer associated with the i defined in the loop\n  });\n\
    }\n```\n\nThis code demonstrates a common JavaScript problem that happens quite\
    \ a lot when using the var keyword for loop in combination with an ajax call.\
    \ Here, because i is seemingly redefined within ajax's callback function, it is\
    \ no longer associated with the same i that was defined within the for loop.\n\
    \nThis classic problem is usually avoided by passing variable into the function\
    \ as a parameter, needlessly creating a new instance of the variable.\n\nHowever,\
