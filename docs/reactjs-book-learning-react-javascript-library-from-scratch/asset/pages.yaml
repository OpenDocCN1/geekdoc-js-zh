  md: '# Gem 3 - Virtual DOM and Bandwidth Salvation


    React makes us think thoroughly about what element will represent, because each
    component is tied to some sort of software function that will, in real time, update
    the data in each component without updating the layout. In React this process
    is made more efficient in comparison to traditional applications. You don''t have
    to reload the entire page like regular HTML websites.


    This makes your application feel different, and it saves bandwidth. if you think
    about it, the non-reactive websites we''ve been building until 2017 is really
    just a lazy man''s design. Reloading everything just to see if there is a new
    alert isn''t exactly the best application design. Yet, this is how websites like
    Facebook have been working all of this time. And bit by bit, it''s starting to
    change. This is why they are moving towards reactive implementations.


    But Reactive programming isnt just a bunch of ajax calls that pull the data and
    replace an HTML element. It''s much more sophisticated.


    And because access to only relevant components is usually the key to good application
    design this is Virtual DOM comes in. Virtual DOM is really a quirky way to provide
    a fast way of modifying the DOM, while abandoning slower old-fashioned alternatives.


    The Virtual DOM is hands down one of the greatest advantages of choosing to write
    your application with the React library. In fact, when you add react library to
    your web project, it behooves you to add react dom library. The two are inseparable.
    And all reactive JavaScript applications by default also include React library.


    This is where React''s Virtual DOM makes a big difference in the usability of
    your application. It''s what allows websites have native application feel, where
    each element responds instantly to a touch event.


    You''ve probably already seen this to happen throughout the internet on sites
    like Netflix,, Facebook and Instagram. You can actually feel the difference. Where
    actions happen instantly, seemingly without having to wait for HTTP requests to
    load every time you press a button.


    The application responds instantly. React doesn''t eliminate HTTP bandwidth, it
    just minimizes and focuses only on whether the data really should be'
