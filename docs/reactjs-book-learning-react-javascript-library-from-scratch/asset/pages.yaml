  md: '# Destructuring assignment


    EcmaScript 6 introduces us to **destructuring assignments**. This is new JavaScript
    functionality. The previous explanations of let keyword laid the groundwork for
    discussing this next subject. So let''s take a look at how they work:


    ```

    let {a, b} = obj;

    In this example two variables *a* and *b* are created. Then, properties **obj.a**
    and **obj.b** are taken from the object named **obj**, and assigned to those variables
    respectively. So this is the equivalent of doing something like:

    ```


    ```

    let a = obj.a;

    let b = obj.b;

    ```


    This format takes a lot more space. *Destructuring assignments* save space and
    provide better readability for our code. Get used to them! :)'
  merge: -1
