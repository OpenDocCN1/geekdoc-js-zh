  md: '# For-of loop


    This is a completely new type of a loop in EcmaScript 6. Let''s take a look at
    how it works:


    ```

    for (let [key, value] of map) { ... }

    ```


    This mighty for loop will iterate through values stored in map. Unfortunately
    (like many things in JavaScript) the for-of loops do not work on objects (and
    their properties). This is almost a bewildering design decision. So, what do for-of
    loops can work?


    The for-of loops are designed exclusively to work with Array, Map and Set objects
    only.'
