  trans: '


    Python 使用的语法和命令与其他任何其他解释型语言都不同。例如，Perl 正在被 PHP 取代成为快速直接的 Web 开发程序的通用语言。但是，与 Perl
    甚至 PHP 不同，Python 更容易遵循，也更易阅读。


    Perl 和 PHP 共同拥有的异代码是这两个程序的要缺陷之一。`PHP` 和 `Perl` 的语法使得编写超过 50 到 100 行的代码变得困难。然而，`Python`
    由于其极高的可读性，使得扩展和维护代码行变得更加容易。这是内置 Python 语言底层结构中的硬化模块之一。


    对于一种更通用的面向 Web 的编程语言，PHP 是现有的较好语言之一。PHP 实际上代表“超文本处理器”（Hypertext Processor），这意味着它应该输出
    Web 可读的信息，而不是系统级任务。但你可以使用 Python 开发一个实际上能够理解 PHP 语言的 Web 服务器。遗憾的是，这无法反过来让 PHP
    学习 Python。


    Python 是一个面向对象的程序，而 PHP 不是。正因如此，可维护性、扩展性甚至可读性都会影响程序的编写方式。


    当你观察现有的编程语言时，你会发现它们可以并被用于不同的职业领域，如下：


    ### 人工智能开发

    这致力于创建 AI 或认知系统，使其能够与人类行为交互并学习它们被设定学习的内容。在这里产生的程序包括电脑游戏中的角色交互、做出决策的程序部分以及可以回复发送者的聊天框。


    ### 应用与程序开发

    这些涉及你每天与之交互的程序。你用来查看喜爱的网页的浏览器浏览器程序，以及允许你在 Kindle 上浏览此类电子书的应用程序，都是这种方式制作的程序示例。


    ### 数据库开发

    这言而易懂。你创建并维护小型数据库，存储大量的数字信息供人们查找和使用。这些数据库对于网站来说非常重要，以便它们可以编译信息。


    ### 游戏开发

    这同样言而易懂。电脑游戏和其他娱乐软件可以用 Java 等语言程序来编写。你在网上看到的 Flash 游戏使用的是完全相同的脚本。


    ### 计算机驱动程序或任何硬件开发

    这些是侧重于思维支持设备功能的应用程序。


    ### 互联网和网页创建

    这是互联网的命脉。没有开发者，就没有网页；没有网页，就没有互联网。


    ### 脚本开发

    如何制作脚本的知识将造福任何公司的生产力。


    正如你看到的，Python 在我们日常生活的不同方面非常有帮助。我们每天都在使用由 Python 编写的东西，甚至没有意识到这一点。Python 字面上帮助维持着我们生活的运行，因为如果没有它，我们就没有那些构成我们用于在线银行、娱乐甚至使用电脑等任务的各种程序的易读代码。


    你将关于 Python 学到的最令人惊讶的一点是，它是一种解释型且交互式的编程语言。解释型仅意味着它在执行之前不需要编译，但仍然需要一个解释器来修改脚本。Python
    还是一个面向对象的编码语言，使得同时交互甚至执行多个程序成为可能。


    Python 的另一个优点是，它是目前创建的最简单且最终最易于用户的编程语言。它不像某些其他计算机程序那样设计得非常丑陋，而是被设定为看起来很漂亮。程序是明确的而不是模糊的，即使你没有任何
    Python 技能，也容易阅读。然而，不要低估你可以随时轻松地与 Python 一工作。它仍然是一种设计用于创建复杂程序和网站的编程语言。但是，如果你投入时间、耐心和练习，并对你正在构建的代码保持勤奋，那么在你掌握门道后，使用它对你来说将变得简单。


    当你初开始学习如何编码时，你可能想考虑找一个免费且直观的程序供你在学习时练习。该程序将在尽可能简单的情况下蓬发展，你甚至可以制作几个快捷命令。


    例如，如果你想输入 `Enumerate` 的命令，它将向列表返回一个枚举对象，代码看起来像这样：


    ```python

    i = 0

    for item in iterable:

    print i, item

    i += 1

    ```


    另一种编码选项如下：


    ```python

    for i, item in enumerate(iterable):

    print i, item

    ```


    此外，`Emulate` 甚至可以接受第二个参数，如下：


    ```python

    >>> list(enumerate(‘abc’))

    [(0, ‘a’), (1, ‘b’), (2, ‘c’)]

    >>> list(enumerate(‘abc’, 1))

    [(1, ‘a’), (2, ‘b’), (3, ‘c’)]

    ```


    因为 Python 易于使用，学习如何使用它也很容易。Python 的整体结构对于编程新手来说是可以掌握的，而且其运行方式非常清晰。由于 Python 运行在高级语言上，字符串以清晰直观的语法组合在一起，只有少数命令。


    当你学习如何掌握 Python 时，你会开始发现你将拥有编写更复杂脚本的知识，这些脚本通常需要别人花费几分钟到几小时来编写。Python 使用的脚本语言让编程变体变得快速容易。这样，你就能编写简化日常工作的脚本。因此，Python
    是首选的程序。


    易读性并不重要，但当你寻找脚本语言时，它是一项巨大的资产。例如，如果你使用 Perl 编码，代码最后看起来可能非常像象形文字。但 Python 会解密代码，让你更有可能记住你写的源代码的作用。


    Python 拥有一套广泛的模块，在你设计自己的源代码时，它可以帮助你可能需要的任何事情。缺点是，你需要确保并做到详尽，才能完全理解更复杂模块的细节。


    Python 用户最喜欢的这个程序的第一点是，它是为了跨平台使用而设计的。这使其非常有用，因为在处理源代码时有时会使用多个操作系统。Python 也可以运行任何你需要它运行的机器上。因此，你几乎可以在所在的任何地方运行你创建的任何脚本。


    Python 还可以跨平台，如 GUIs 或 Qt。这导致你创建的任何 GUI 都不需要每次被迫切换到新机器时就对源代码进行重新调整。


    ## 第 2 章


    ![logo](img/00003.jpeg)


    ## 安装 Python


    要使用 Python，你需要将其下载到你的电脑上。下载 Python 非常简单，你可以去 Python 网站直接在那里下载最新版本！


    一旦你找到了下载页面，你就需要找到想要下载的软件。它很可能是目前存在的最新版本的 Python，但你也有下载旧版本 Python 的选项。


