    use. Python tracks any data types that are used internally by their users.


    Lists will have plenty of uses; it is going to depend on what code has been placed
    in Python mainly. Here are just a few of the distinct list functions that you
    can use with Python.


    - `List.append(x)`: This is used when adding an item to the end of your list.
    You can also use the function `len(a) :]=[x]`.

    - `List.extend(L)`: This is used when you are trying to extend your list by appending
    all of your objects in your list. It’s equivalent is `a[len(a) :] = L`.

    - `List.instert(I, x)`: This is used to insert an item into a particular position
    on the list. The first argument will be within the index of your list before you
    are able to insert it. You are going to be required to use `a.insert(0,x)` to
    place it at the front of your list. You can also use `a.inster(len(a), x)` which
    is the same as using `a.append(x)`.

    - `List.remove(x)`: This is used to remove any item from the list that has a value
    of `x`. If you run into an error message, then that item is not on the list.

    - `List.pop([i])`: This is used to remove an item from its given position on the
    list before returning it. If you do not choose a particular index using `a.pop()`,
    then the item is going to be returned to the last place on the list. The square
    brackets state that the parameter is optional for you to enter or not.

    - `List.index(x)`: This is used to return your index to the first item, which
    has a value of `x`. If you see an error code, that thing does not exist.

    - `List.count(x)`: This gives you how many times `x` appears in your list.

    - `List.sort(cmp= None, key= None, reverse= False)`: You will be able to sort
    the arguments on your list to be customized.

    - `List.reverse()`: This reverses the way items are listed.


