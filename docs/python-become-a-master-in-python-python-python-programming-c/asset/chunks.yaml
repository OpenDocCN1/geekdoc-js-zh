    \ `render_template` 方法返回 HTML 页面。\n\n你会发现不再有纯文本，而且你拥有的文本可以有各种格式。这是通过从 Python 返回\
    \ HTML 模板而不是纯文本来实现的。\n\n为了这一点，你需要创建一个命名类似于 `home.html` 的空文件，并将以下代码放入其中。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<h1>My Personal Website</h1>\n<p>Hi, this is\
    \ my personal website.</p>\n</body>\n</html>\n```\n\nHTML 是网页使用的语言。在创建 HTML 页面时，你务必确保记住这三点重要事项：\n\
    \n- HTML 的任何可见部分都将位于 `<body>` 和 `</body>` 之间。该区域之外的区域用于引用 Javascript 文件、CSS 或任何类似的功能。\n\
    - HTML 文档需要以指定文档类型的声明作为开头：`<!DOCTYPE html>`\n- HTML 文档将始终以 `<html>` 开始并以 `</html>`\
    \ 结束。\n\n在 `flask` 框架中，它应该被写在一个可以专门查找 HTML 模板文件的文件夹中。该文件夹应该被称为 `templates`。任何\
    \ Python 脚本将留在 `templates` 文件夹之外，因为它们不是 HTML。\n\n读取 HTML 模板的代码看起来类似于所示。注意：这是我们之前\
    \ flask 代码的更新后的版本。\n\n```python\nfrom flask import Flask, render_template\n\n\
    app = Flask(__name__)\n\n@app.route('/')\ndef home():\n    return render_template('home.html')\n\
    \nif __name__ == '__main__':\n    app.run(debug=True)\n```\n\n你会注意到，代码通过使用 `flask`\
    \ 框架中导入的 `render_template` 方法来维护。正是通过这里，`flask` 框架加载了 HTML 文件。每当用户访问你的 URL 时，它将生成一个\
    \ `jinja 2` 模板，并将模型返回给浏览器。\n\n如果你想创建一个“关于”（about）页面，你需要在模板文件夹中创建另一个 HTML 文件。这部分代码看起来大致如下：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>About me</h1>\n<p>This is a portfolio\
    \ site about anything that can be put in a portfolio.</p>\n</body>\n</html>\n\
    ```\n\n从这里，你将能够通过向模板连接次要函数来使用 Python 渲染你创建的 HTML。新的代码看起来如下：\n\n```python\nfrom\
    \ flask import Flask, render_template\n\napp = Flask(__name__)\n\n@app.route('/')\n\
    def home():\n    return render_template('home.html')\n\n@app.route('/about/')\n\
    def about():\n    return render_template('about.html')\n\nif __name__ == '__main__':\n\
    \    app.run(debug=True)\n```\n\n一旦你输入了最后一段代码，你就可以运行脚本 `localhost:5000/about`，这将打开一个新页面。在稍后的日期，可以为该模板应用\
    \ CSS 样式，以使其看起来像你想要的样子。\n\n`about.html` 的更新代码看起来类似于所示：\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<div class=\"about\">\n<h1>About me</h1>\n<p>This is a portfolio\
    \ site about anything that can be put in a collection.</p>\n</div>\n</body>\n\
    </html>\n```\n\n你对对你的 `home.html` 这样做。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <div class=\"home\">\n<h1>About me</h1>\n<p>This website was built with Python\
    \ via the Flask framework.</p>\n</div>\n</body>\n</html>\n```\n\n现在当你运行 Python\
    \ 脚本时，你将有两个打开的 URL。现在，你应该有两个 HTML 页面，以及一个导致你的 HTML 页面产生不同 URL 的 Python 脚本。这两个\
    \ URL 分别是你的首页和关于页。\n\n如果你需要在每个页面中设计一个区域，你将需要添加 HTML 代码为每个文件生成页眉（header）。然而，在你这样做之前，智能的做法是创建一个父\
    \ HTML 模板，你的后续模板将从中继承代码。这是通过简单将父模型链接到每个 HTML 页面来实现的，以便它们继承代码。\n\n第一个动作是创建一个名为\
    \ `layout.html` 的新页面，代码看起来如下：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<header>\n\
    <div class=\"container\">\n<h1 class=\"logo\">Ardit’s web app</h1>\n<strong><nav>\n\
    <ul class=\"menu\">\n<li><a href=\"{{ url_for('home') }}\">Home</a></li>\n<li><a\
    \ href=\"{{ url_for('about') }}\">About</a></li>\n</ul>\n</nav></strong>\n</div>\n\
    </header>\n</body>\n</html>\n```\n\nPython 将会修改 `home.html` 和 `about.html` 页面以及你的\
    \ `layout.html` 文件。此时，你将需要将 `about.html` 和 `home.html` 都链接到 `layout.html`。这将需要几行代码，你将从\
    \ `layout.html` 开始。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<header>\n<div\
    \ class=\"container\">\n<h1 class=\"logo\">Ardit’s web app</h1>\n<strong><nav>\n\
    <ul class=\"menu\">\n<li><a href=\"{{ url_for('home') }}\">Home</a></li>\n<li><a\
    \ href=\"{{ url_for('about') }}\">About</a></li>\n</ul>\n</nav></strong>\n</div>\n\
    </header>\n<div class=\"container\">\n{% block content %}\n{% endblock %}\n</div>\n\
    </body>\n</html>\n```\n\n你会注意到你的 `layout.html` 中添加了一个新的 div 部分。大括号内的两行将根据用户此时使用的哪个\
    \ URL，在 `home.html` 或 `about.html` 代码中按需替换。但是，为了让这些生效，你需要编辑你的关于页和首页，以便它们能够连接到你的布局页面。\n\
    \n你的 `home.html` 代码看起来如下：\n\n```html\n{% extends \"layout.html\" %}\n{% block\
    \ content %}\n<div class=\"home\">\n<h1>A Python product</h1>\n<p>This website\
    \ was built with Python via the Flask framework.</p>\n</div>\n{% endblock %}\n\
    ```\n\n这是你的 `about.html` 看起来的样子：\n\n```html\n{% extends \"layout.html\" %}\n{%\
    \ block content %}\n<div class=\"about\">\n<h1>About me</h1>\n<p>This is a portfolio\
    \ site about anything that can be put in a portfolio.</p>\n</div>\n{% endblock\
    \ %}\n```\n\n恭喜！\n\n你现在有了一个功能完备的网站！但是，你仍然缺少网站的一些内容。这些只是使用 Python 代码制作网站的基础基础知识。你仍然可以为你的网站添加更多内容，如\
    \ CSS 样式，最后，关于使你的网站公开所需的步骤，你可以在 [www.Pythonhow.com](http://www.Pythonhow.com)\
    \ 的课程中找到。\n\n# 第 11 章\n\n![logo](img/00003.jpeg)\n\n## Python 的其他用途\n\n当你看到使用\
    \ Python 可以做的所有不同事情时，你会发现你实际上可以使用 Python 源代码创建视频游戏，以及使用 Python 破解计算机系统。\n\n注意：在没有系统管理员明确书面许可的情况下，不要入侵任何系统是非常重要的。\n\
    \n### 游戏创建\n\n当你使用 Python 创建游戏时，你将使用 `PyGame`。该软件在 SDL 库之上增加了功能。它允许你使用 Python\
    \ 语言设计功能齐全的游戏和多媒体应用程序。\n\n`Pygame` 让游戏具有高度的可移植性，并运行在几乎每个平台和操作系统上。\n\n有很多使用 `PyGame`\
    \ 创建并成功的游戏示例和文档。你还会发现使用 `PyGame` 编写游戏以及图形密集型程序是非常容易的。\n\n如果你想创建一个 3D 的高级游戏，你将使用\
    \ `PySoy`。它与 Python 3 使用的引擎配合。`Python 3` 紧密结合了渲染、物理、网络甚至动画。\n\n`Python-Ogre` 是\
    \ `OGRE 3D` 引擎的完整 Python 封装，包含了 15 个其他图形以及与游戏相关的库，用于 GUI、特殊效果、声音、物理等更多内容。\n\n"
