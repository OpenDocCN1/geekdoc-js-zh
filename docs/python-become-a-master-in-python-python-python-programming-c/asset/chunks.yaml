    After clicking on the version you want, you are going to be redirected to the
    page that shows a description for that version, which will include the characteristics
    and updates that come with it. If you are someone who reads the descriptions,
    then you have the opportunity to read it while you are downloading it.


    Move all the way to the bottom of the page and select the link that says download.
    From here you are going to be taken to another page where you are going to be
    able to choose the operating system that you are currently working with. Make
    sure that you are choosing the correct operating system so that the program is
    downloaded correctly. Some libraries are in one version of the program that are
    not going to work with other operating systems.


    Having chosen your operating system, you are now going to be asked if you want
    to run the program. You are going to select run on the dialog box that appears
    on your screen.


    In the installation set up for `Python`, you are going to have the option to download
    the program for all users on the computer or just a single user. You are probably
    going to install it for all users because you are most likely installing it on
    your personal computer or your work computer, but if you are putting it on a computer
    that you are sharing with your spouse or kids, you are probably going to put it
    on a single account so that it is not installing across all accounts.


    `Python` is going to make its own directory, but if you want it installed in another
    directory, you will need to set your desired installation directory. Move down
