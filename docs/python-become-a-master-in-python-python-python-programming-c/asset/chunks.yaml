    ## Formatting Strings in Python


    Strings are a module that contains different constants and classes that are useful;
    they can even hold deprecated legacy functions that are only available as a method
    for using strings. Python has string types that are built into its programming
    in order to support the sequencing type methods.


    In order to format the output on strings, you are going to use a template or the
    percent sign (%) operator. There is an another built-in function that is meant
    to help you in the formatting the strings in Python. The `str` and `Unicode` classes
    in Python were placed there to help with multiple variable substitutions as well
    as the formatting of the values in your string by using the `str.format()` technique.


    The `formatter` class that you can find within the string module is going to help
    you to customize your own formatting on strings and their behaviors by using the
    same techniques that are placed in the `format()` method.


    - Class string formatter: To follow public methods, this is the formatter to use.

    - `Format(format_string, *args, **kwargs)`: This is the primary method. This takes
    your string that you have just formatted as well as a random set of keyword arguments
    and positions. This is just a wrapper for your formatted string that uses `vformat()`.

    - The formatter is also going to help define a variety of methods that you can
    use to replace the subclasses.

    - `Parse(format_string)`: You are going to cross the formatted string and then
    return the iterable tuple (literal_text, field_name, format_spec, and conversion).
    Using this with `vformat()` is going to bring the string into replacement fields
    or literal text.

