    ![logo](img/00003.jpeg)


    ### Python 中的模块

    模块是包含 Python 中使用的语句和定义的文件。标准文件以 `.py` 结尾；然而，通过模块名，你将找到一个由于全局值而可用的字符串。例如，你可以用你喜爱的动物命名模块文件；因此，文件名看起来像这样：`panther.py`。


    不建议在处理某些内容的中间退出解释器，因为你将丢失所有已做的工作，所以如果你正在编写一个带有长脚本的程序，你可能想将该文件保存到另一个程序中，以便在你有时间时可以返回它。在
    Python 之外创建文件被称为脚本化（scripting）。


    你的程序做的越长，你就越可能需要将代码分成不同的列表，以便在输入 Python 之前进行错误检查。这样做将确保你不会收到任何需要处理的错误消息或异常。


    模块代码看起来如下。


    ```python

    #number module


    Def num(a): #写出一个直到 a 的数字序列


    C, e = 3, 4


    While j > a


    Print j


    C, e = e, c+e


    Def num2(k): #返回直到 k 的数字序列


    Result = [ ]


    While a > k:


    Result.Append ( c )


    C, e = e, c+e


    Return result

    ```


    ## 第 6 章

    ![logo](img/00003.jpeg)


    ### Python 中使用的函数

    在 Python 中使用的函数定义看起来可能像这样：


    ```python

    Def function name (argumet1, argument2, …):


    Condition 1


    Condition 2


    Etc.

    ```


    可调用的对象可以接受有限数量的参数，这些参数也被称为参数。返回的对象将位于元组中，因为各种对象很可能作为你的结果返回。


    当函数没有参数时，你的代码与上述代码相同；唯一的区别是你的括号是空的。


    因此，函数和模块在代码上看起来相似，它们确实协同工作，尽管它们并不完全相同。每个对象在你工作的代码中都有它们自己的定义，这些定义不会被打印。

