    \n在 Python 中，你会发现一些常见的数学运算符如下：\n\n- `A+b` 用于加法。\n- `a−b` 用于减法。\n- `a*b` 用于乘法。\n\
    - `a/b` 用于除法。\n- `a//b` 用于 Python 2.2 及更高版本的整除。\n- `a%b` 是模 b 运算，将为你提供模。\n- `−a`\
    \ 用于取反。\n- `Abs(a)` 或 `|a|` 用于绝对值。\n- `A**b` 或 `a^b` 用于幂。\n- `Math.sqrt(a)` 是你在\
    \ Python 中输入平方根的方法。\n\n请尽量记住，如果你需要使用函数 `math.sqrt()`，那么你需要让 Python 知道你需要加载 `math`\
    \ 模块。为了做到这一点，你应该有输入代码以便其被打开。\n\n在 Python 中进行数学运算的缺点是，它在浮点算术的舍入误差方面存在局限性，这最终会给你意想不到的结果。例如，如果你通过放置\
    \ `print(0.8/0.2)` 来普通除法，如果操作正确，你应该得到 4.0 的正确结果。然而，当你对相同的数字进行整除时，你得到的返回结果是 4.0。\n\
    \nPython 2.x 系列中的整除仅对长整数（longs）和整数有效。但是，“真除”是对复数和浮点数进行的。使用 Python 3.x 时，真除法方法适用于所有类型的数字。你可以通过在普通除法符号周围加上\
    \ [math]=0.5 来解决这个问题。这个答案将导致它向下舍入 0.5，因为你在函数中是这样要求的。\n\n在小学期间，我们学习了运算顺序，Python\
    \ 也不例外。在数学中，你将使用 PEMDAS 来评估所有的表达式。你将在边读边计算；你会从左到右执行表达式中的每种运算顺序。\n\n- **P** 代表括号。括号中的所有内容将首先执行。\n\
    - **E** 代表指数。指数无非快捷的乘法或除法。\n- **M and D** 代表乘法和除法。如果你在同一个方程中同时拥有两者，你将在除法之前执行乘法。\n\
    - **A and S** 是加法和减法。就像乘法和除法一样，你将在减法之前执行加法。\n\n如果你数学计算得正确，那么你的答案就是正确的。例如 `8 +\
    \ (25 − 10) * 6/5 = 26`。\n\n1. 第一步是执行 `25 − 10`，你会得到答案 `15`。\n2. 因为没有指数，我们跳过那一步，进入乘法和除法。\n\
    3. 你的数学方程现在看起来像 `8 + (15) * 6/5 = 26`。\n4. `15 * 6` 等于 `90`，剩下 `8 + 90/5 = 26`。\n\
    5. `90/5` 将给你 `18`。\n6. `8 + 18 = 26`。\n\n你的答案是 `26`。对于一个如此简单的答案来说，这似乎有很多操作，但这就是创建我们数学方式的人所决定的。正如我们所知，数学并不总是像整数那样整整齐齐。有时你会收到小数点甚至是分数，我们并不总是能够对其向上舍入或向下舍入。\n\
    \n如果你重 75 磅，那么你就是 34.019427 公斤。Python 会自动在任何数字中打印 10 位小数。但如果你只想得到一位或两位，你将使用 `round()`\
    \ 函数，以便你可以将数字舍入到你寻找的小位数。在使用此功能时，你不仅要指定想要舍入的数字，还要指定想要舍入的小位数。\n\n例如，如果你想舍入我们刚刚将磅转换为公斤时得到的数字，你将输入\
    \ `print round(34.019427, 2)`，这样它将舍入到两个不同的小数。在我们已知的小数舍入数学规则中，你会得到数字 34.02。\n\n\
    你被授权在一个函数内部指定另一个函数以获得你想要的答案。将两个函数放在一起时，被称为嵌套函数，它的工作方式与你单独执行函数完全相同。\n\n例如下：\n\n\
    ```\ntwoSigFigs = round(pounds_kilograms,2)\nnumToString = str(twoSigFigs)\nprint\
    \ (“you weigh” + numToString + “kilograms”)\n```\n\n Python 将执行此函数并给你与你转换和舍入时得到的完全相同的结果。34.02。只需要使用\
    \ Python，你就可以完成从基础数学到复杂的三角函数的所有问题。它优秀的一点是，你不需要知道如何解决问题本身，你只需要知道如何将其放在 Python 中，以便\
    \ Python 可以为你计算出来。\n\n# 第 9 章\n\n![logo](img/00003.jpeg)\n\n## Python 中的字符串格式化\n\
    \n字符串是一个包含有用常量和类的模块；它们甚至可以包含仅作为字符串方法使用的弃用旧函数。Python 具有内置的字符串类型，以支持序列类型方法。\n\n\
    为了格式化字符串输出，你将使用模板或百分比符号 (%) 运算符。还有另一个内置函数用于帮助你在 Python 中格式化字符串。Python 中的 `str`\
    \ 和 `Unicode` 类被放置在那里是为了帮助多个变量替换，以及通过 `str.format()` 技术对字符串中的值进行格式化。\n\n你可以在字符串模块中找到\
    \ `formatter` 类，它可以帮助使用放在 `format()` 方法中的相同技术来自自定义字符串的格式及其行为。\n\n- 字符串格式化类（Class\
    \ string formatter）：为了遵循公共方法，应使用此格式器。\n- `Format(format_string, *args, **kwargs)`：这是主要方法。它接受你刚刚格式化的字符串以及一组随机的关键字参数和位置。这只是一个使用\
    \ `vformat()` 对你格式化字符串的包装器。\n- 格式器还将帮助定义各种你可以使用来替换子类的方法。\n- `Parse(format_string)`：你将遍历格式化字符串并返回一个可迭代元组（字面量文本、字段名、格式规范和转换）。将此项与\
    \ `vformat()` 使用将把字符串引入替换字段或字面量文本。\n"
