    \ `str(s)`、`repr(r)` 和 `sciiASCII(a)` 是 Python 使用的转换类型。\n\n# 第 10 章\n\n![logo](img/00003.jpeg)\n\
    \n## 使用 Python 构建网站\n\nPython 可以被用于许多事情。你可以用它进行黑客攻击甚至视频游戏创作。在本章中，我们将讨论如何使用 Python\
    \ 来构建网站。\n\n如果你编写的代码第一次第一次运行的结果不是你预期的那样，不要担心。记住，你可以使用 Python 编写临时程序，这些程序不会影响你最终完成的项目。\n\
    \n当你查看 Google 和 YouTube 等网站时，你可能不知道，但正如我们之前提到的，它们是使用 Python 构建的。然而，你将使用 `Flask`\
    \ 框架从零开始创建自己的网站。`Flask` 易于学习，入门也很简单。\n\n首先，你需要在空文本插入类似于下面代码的内容。\n\n注意：确保你始终使用标题保存你的工作，并以\
    \ `.py` 结尾。\n\n```python\nfrom flask import Flask\n\napp = Flask(__name__)\n\n\
    @app.route('/')\n\ndef home():\n    return \"Hey there!\"\n\nif __name__ == '__main__':\n\
    \    app.run(debug=True)\n```\n\n请注意，从代码的第一行开始就从库导入了 `flask`。如果你没有安装该库，将收到一个不允许你继续的错误代码。\n\
    \n如果你需要安装 `flask`，只需在 Python 命令行中输入 `pip install flask` 即可。一旦你确保 `flask` 已正确安装，运行你的测试脚本。\n\
    \n一旦你的脚本正常运行，网站就会在你的本地机器上运行，并且可以通过在你使用的浏览器中输入 `localhost:5000` 来进行查看。\n\n此时，你的网站只是纯文本。在添加各种让它看起来像网站的设计等内容之前，确保它是可以正常工作的。。\n\
    \n你需要考虑的第一件事是，谁将使用你的网站？这将影响你在代码中放入的数据，以及你如何设计网站的外观。\n\n作为一名开发者，你将需要编写 Python 代码来处理访问你网站的用户请求以及\
    \ CGI。这是 Python 和许多其他 Web 开发编程语言用于创建网页的标准环境。\n\n由于这是一项如此具有重复性的任务，你可以将所有代码整合在一起并创建许多\
    \ Python 文件。这些文件被称为 `flask`。`Flask` 是在 Python 内部加载并自动执行例行代码的框架。这将允许你专注于网站中需要在日后进入并修复的特定部分。\n\
    \n所以，如果你在命令行中输入 `pip install flask`，你正在从存储库中安装 `flask` 框架。然而，当你导入 `flask` 时，你是在为你的当前脚本使该框架可用。\n\
    \n因此，你的代码看起来应该像这样：\n\n1. `from flask import Flask`\n2. \n3. `app = Flask(__name__)`\n\
    4. \n5. `@app.route('/')`\n6. `def home():`\n7. `return \"Hey there!\"`\n8. \n\
    9. `if __name__ == '__main__':`\n10. `app.run(debug=True)`\n\n在第 1 行中，使用 `flask`\
    \ 构建 Web 应用所需的所有代码都位于这里。只需放入 `flask`，它是用于创建 Web 应用程序实例的原型。\n\n一旦导入了 `flask`，你现在就可以创建一个可以帮助你\
    \ Web 应用的 `flask` 类了。第 3 行使用 `__name__` 名称执行了相同的操作。这是一个特殊变量，当你实际执行脚本时，它的值被为字符串\
    \ `__main__`。\n\n第 5-7 行将是你返回字符串的定义函数。这些函数映射到主页 `/` URL。因此，用户将导航到 `localhost:5000`，然后\
    \ `home` 函数将将其原始输出返回到网页。如果输入路由方法是不同的，例如 `/about/`，那么用户将被引导到 `localhost:5000/about/`。\n\
    \n第 9 和第 10 行包含 `__main__` 脚本。如果脚本被导入到另一个脚本中，脚本将保留其原始名称，但在我们的案例中，我们使用 `__name__`，它将等于\
    \ `__main__`。如果条件语句满足，则将执行 `app.run()`。这允许程序员控制脚本的行为。\n\n你还会注意到 `debug` 参数被设置为\
    \ `true`。这会将可能的 Python 错误显示在网页上，从而帮助追踪脚本中的任何错误。当你在生产环境中，你可能希望将其设置为 `false`。\n\n"
- fmt: "\nIf you want to make something more visually appealing, you will want to\
    \ incorporate some HTML files. This will return the HTML pages instead of just\
    \ plain strings of text.\n\nThis is where you will learn how to return HTML pages\
    \ with the `render_template` method.\n\nYou should see that there is not any plain\
    \ text and that the text you have can have various formats. This is made by returning\
    \ the HTML template rather than the plain text from Python.\n\nTo do this, you\
    \ will want to create an empty file with the name of something similar to `home.html`\
    \ and put the following code into it.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <h1>My Personal Website</h1>\n<p>Hi, this is my personal website.</p>\n</body>\n\
    </html>\n```\n\nHTML is the language that web pages use. You will need to make\
    \ sure that you remember these three important things when it comes to creating\
    \ HTML pages:\n\n- Any visible part of the HTML will be between `<body>` and `</body>`.\
    \ The areas outside of this are used in reference to Javascript files, CSS, or\
    \ any similar features.\n- The HTML document needs to start with a declaration\
    \ that will specify the document type: `<!DOCTYPE html>`\n- HTML documents will\
    \ always begin with `<html>` and end with `</html>`\n\nIn the `flask` framework,\
    \ it should be written in a folder where it can specifically look for the HTML\
    \ template files. This folder should be called `templates`. Any Python scripting\
    \ will stay outside of the `templates` folder as it is not HTML.\n\nThe code to\
    \ be able to read the HTML templates will look similar to this. Note: this is\
    \ the updated code from our flask code earlier.\n\n```python\nfrom flask import\
    \ Flask, render_template\n\napp = Flask(__name__)\n\n@app.route('/')\ndef home():\n\
    \    return render_template('home.html')\n\nif __name__ == '__main__':\n    app.run(debug=True)\n\
    ```\n\nYou will notice that the code was maintained by using the imported `render_template`\
    \ method within the `flask` framework. It is from here that the HTML files are\
    \ on the `flask` framework. This will generate a `jinja 2` template then return\
    \ the model to the browser whenever the users visit your URL.\n\nIf you want to\
    \ create an “about” page, you will need to create another HTML file in the template\
    \ folder. The coding for this is going to look a little something like this:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>About me</h1>\n<p>This is a portfolio\
    \ site about anything that can be put in a portfolio.</p>\n</body>\n</html>\n\
    ```\n\nIt is from here that you will be able to render the HTML you created with\
    \ Python by joining a secondary function to the template. The new code for this\
    \ looks like this:\n\n```python\nfrom flask import Flask, render_template\n\n\
    app = Flask(__name__)\n\n@app.route('/')\ndef home():\n    return render_template('home.html')\n\
    \n@app.route('/about/')\ndef about():\n    return render_template('about.html')\n\
    \nif __name__ == '__main__':\n    app.run(debug=True)\n```\n\nOnce you have put\
    \ the last string of codes in, you will then need to run the script `localhost:5000/about`,\
    \ and this will open a new page. At a later date, this template can have CSS styling\
    \ applied to it in order to make it resemble what you want it to look.\n\nThe\
    \ updated coding for `about.html` is going to look something similar to this:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div class=\"about\">\n<h1>About me</h1>\n\
    <p>This is a portfolio site about anything that can be put in a collection.</p>\n\
    </div>\n</body>\n</html>\n```\n\nYou’ll have to do this for your `home.html` as\
    \ well.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div class=\"home\">\n<h1>About\
    \ me</h1>\n<p>This website was built with Python via the Flask framework.</p>\n\
    </div>\n</body>\n</html>\n```\n\nWhen you run your Python script now, you will\
    \ have two URLs open. Now, you should have two HTML pages as well as the Python\
    \ script that has resulted in your HTML pages being two different URLs. These\
    \ two URLs are your home page as well as your about page.\n\nIf you need to design\
    \ an area in each page, you will then need to add in the HTML code that will cause\
    \ a header to generate for each file. However, before you do this, the smart thing\
    \ would be to create a parent HTML template that your following templates will\
    \ then inherit the code from. This is done by simply linking the parent model\
    \ to each HTML page so that they can inherit the code.\n\nThe first action is\
    \ to create a new page that you will call `layout.html`, and the coding will look\
    \ like this:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<header>\n<div class=\"\
    container\">\n<h1 class=\"logo\">Ardit’s web app</h1>\n<strong><nav>\n<ul class=\"\
    menu\">\n<li><a href=\"{{ url_for('home') }}\">Home</a></li>\n<li><a href=\"{{\
    \ url_for('about') }}\">About</a></li>\n</ul>\n</nav></strong>\n</div>\n</header>\n\
    </body>\n</html>\n```\n\nPython will then modify the `home.html` and `about.html`\
    \ pages as well as your `layout.html` files. At this point, you will then need\
    \ to link both `about.html` and `home.html` to `layout.html`. This is going to\
    \ take a few lines of coding, and you are going to start with the `layout.html`.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<header>\n<div class=\"container\"\
    >\n<h1 class=\"logo\">Ardit’s web app</h1>\n<strong><nav>\n<ul class=\"menu\"\
    >\n<li><a href=\"{{ url_for('home') }}\">Home</a></li>\n<li><a href=\"{{ url_for('about')\
    \ }}\">About</a></li>\n</ul>\n</nav></strong>\n</div>\n</header>\n<div class=\"\
    container\">\n{% block content %}\n{% endblock %}\n</div>\n</body>\n</html>\n\
    ```\n\nYou will notice that a new div section was added to your `layout.html`.\
    \ The two lines within the curly brackets will then be replaced on demand in either\
    \ the `home.html` or the `about.html` code, depending on which URL the user is\
    \ using at the time. But, in order for these to work, you will then need to edit\
    \ both your about and home pages so that they will connect to your layout page.\n\
    \nYour `home.html` code will look like this:\n\n```html\n{% extends \"layout.html\"\
    \ %}\n{% block content %}\n<div class=\"home\">\n<h1>A Python product</h1>\n<p>This\
    \ website was built with Python via the Flask framework.</p>\n</div>\n{% endblock\
    \ %}\n```\n\nAnd this is what your `about.html` will look like:\n\n```html\n{%\
    \ extends \"layout.html\" %}\n{% block content %}\n<div class=\"about\">\n<h1>About\
    \ me</h1>\n<p>This is a portfolio site about anything that can be put in a portfolio.</p>\n\
    </div>\n{% endblock %}\n```\n\nCongratulations!\n\nYou now have a functional website!\
    \ However, you are still missing some of your website. These were just the basics\
    \ of how to make a website by using Python coding. You can still add more to your\
    \ site like CSS styling and, finally, the steps that you will need to make your\
    \ site public in the lessons that can be found on [www.Pythonhow.com](http://www.Pythonhow.com)\n\
    \n# Chapter 11\n\n![logo](images/00003.jpeg)\n\n## Additional Uses for Python\n\
    \nWhen you look at all the different things that you can do with Python, you will\
    \ learn that you can actually create video games with the Python source coding\
    \ as well as use Python for hacking into computer systems.\n\nNote: It is important\
    \ to not hack into any system without the expressed written permission from the\
    \ system administrator.\n\n### Game Creation\n\nWhen you are creating a game using\
    \ Python, you are going to use `PyGame`. This software adds the functionality\
    \ on top of the SDL library. It permits you to design fully featured games and\
    \ multimedia applications by using the Python language.\n\n`Pygame` allows the\
    \ game to be highly portable and run off of nearly every platform and operating\
    \ system.\n\nThere are numerous examples and documentation of games that were\
    \ created by using `PyGame` that have been successful. You will also notice that\
    \ it is easy to write games as well as graphic-intensive programs by using `PyGame`.\n\
    \nIf you want to make a high-level game that is in 3D, you will use `PySoy`. This\
    \ works with the engine that is used in Python 3. `Python 3` tightly binds the\
    \ rendering physics, networking, and even the animation.\n\n`Python-Ogre` is the\
    \ complete Python wrapper for the `OGRE 3D` engine that includes 15 other graphics\
    \ as well as gaming-related libraries that are used for GUI, special effects,\
    \ sound, physics, and much more.\n"
  raw: 'If you want to make something more visually appealing, you will want to incorporate
    some HTML files. This will return the HTML pages instead of just plain strings
    of text.


    This is where you will learn how to return HTML pages with the render_template
    method.


    You should see that there is not any plain text and that the text you have can
    have various formats. This is made by returning the HTML template rather than
    the plain text from Python.


    To do this, you will want to create an empty file with the name of something similar
    to home.html and put the following code into it.


    <!DOCTYPE html>


    <html>


    <body>


    <h1>My Personal Website</h1>


    <p>Hi, this is my personal website.</p>


    </body>


    </html>


    HTML is the language that web pages use. You will need to make sure that you remember
    these three important things when it comes to creating HTML pages.


    -Any visible part of the HTML will be between <body> and </body>. The areas outside
    of this are used in reference to Javascript files, CSS, or any similar features.


    -The HTML document needs to start with a declaration that will specify the document
    type: <!DOCTYPEhtml>


    -HTML documents will always begin with <html> and end with </html/>


    In the flask framework, it should be written in a folder where it can specifically
    look for the HTML template files. This folder should be called templates.


    Any Python scripting will stay outside of the templates folder as it is not HTML.


    The code to be able to read the HTML templates will look similar to this. Note:
    this is the updated code from our flask code earlier.


    from flask import Flask, render_template


    app = Flask(__name__)


    @app.route(‘/’)


    def home():


    return render_template(‘home.html’)


    if __name__ == ‘__main__’:


    app.run(debug=True)


    You will notice that the code was maintained by using the imported render_template
    method within the flak framework. It is from here that the HTML files are on the
    flask framework. This will generate a jinja 2 template then return the model to
    the browser whenever the users visit your URL.


    If you want to create an “about” page, you will need to create another HTML file
    in the template folder. The coding for this is going to look a little something
    like this:


    <!DOCTYPE html>


    <html>


    <body>


    <h1>About me</h1>


    <p>This is a portfolio site about anything that can be put in a portfolio.</p>


    </body>


    </html>


    It is from here that you will be able to render the HTML you created with Python
    by joining a secondary function to the template. The new code for this looks like
    this:


    from flask import Flask, render_template


    app = Flask(__name__)


    @app.route(‘/’)


    def home():


    return render_template(‘home.html’)


    @app.route(‘/about/’)


    def about():


    return render_template(‘about.html’)


    if __name__ == ‘__main__’:


    app.run(debug=True)


    Once you have put the last string of codes in, you will then need to run the script
    localhost:5000/about, and this will open a new page. At a later date, this template
    can have CSS styling applied to it in order to make it resemble what you want
    it to look.


    The updated coding for about.html is going to look something similar to this:


    <!DOCTYPE html>


    <html>


    <body>


    <div class=“about”>


    <h1>About me</h1>


    <p>This is a portfolio site about anything that can be put in a collection.</p>


    </div>


    </body>


    </html>


    You’ll have to do this for your home.html as well.


    <!DOCTYPE html>


    <html>


    <body>


    <div class=“home”>


    <h1>About me</h1>


    <p>This website was built with Python via the Flask framework.</p>


    </div>


    </body>


    </html>


    When you run your Python script now, you will have two URLs open. Now, you should
    have two HTML pages as well as the Python script that has resulted in your HTML
    pages being two different URLs. These two URLs are your home page as well as your
    about page.


    If you need to design an area in each page, you will then need to add in the HTML
    code that will cause a header to generate for each file. However, before you do
    this, the smart thing would be to create a parent HTML template that your following
    templates will then inherit the code from. This is done by simply linking the
    parent model to each HTML page so that they can inherit the code.


    The first action is to create a new page that you will call layout.html, and the
    coding will look like this:


    <!DOCTYPE html>


    <html>


    <body>


    <header>


    <div class=“container”>


    <h1 class=“logo”>Ardit’s web app</h1>


    <strong><nav>


    <ul class=“menu”>


    <li><a href=“{{ url_for(‘home’) }}”>Home</a></li>


    <li><a href=“{{ url_for(‘about’) }}”>About</a></li>


    </ul>


    </nav></strong>


    </div>


    </header>


    </body>


    </html>


    Python will then modify the home.html and about.html pages as well as your layout.html
    files. At this point, you will then need to link both about.html and home.html
    to layout.html. This is going to take a few lines of coding, and you are going
    to start with the layout.html.


    <!DOCTYPE html>


    <html>


    <body>


    <header>


    <div class=“container”>


    <h1 class=“logo”>Ardit’s web app</h1>


    <strong><nav>


    <ul class=“menu”>


    <li><a href=“{{ url_for(‘home’) }}”>Home</a></li>


    <li><a href=“{{ url_for(‘about’) }}”>About</a></li>


    </ul>


    </nav></strong>


    </div>


    </header>


    <div class=“container”>


    {% block content %}


    {% end block %}


    </div>


    </body>


    </html>


    You will notice that a new div section was added to your layout.html. The two
    lines within the curly brackets will then be replaced on demand in either the
    home.html or the about.html code, depending on which URL the user is using at
    the time. But, in order for these to work, you will then need to edit both your
    about and home pages so that they will connect to your layout page.


    Your home.html code will look like this:


    {% extends “layout.html” %}


    {% block content %}


    <div class=“home”>


    <h1>A Python product</h1>


    <p>This website was built with Python via the Flask framework.</p>


    </div>


    {% end block %}


    And this is what your about.html will look like:


    {% extends “layout.html” %}


    {% block content %}


    <div class=“about”>


    <h1>About me</h1>


    <p>This is a portfolio site about anything that can be put in a portfolio.</p>


    </div>


    {% end block %}


    Congratulations!


    You now have a functional website! However, you are still missing some of your
    website. These were just the basics of how to make a website by using Python coding.
    You can still add more to your site like CSS styling and, finally, the steps that
    you will need to make your site public in the lessons that can be found on [www.Pythonhow.com](http://www.Pythonhow.com)


    **Chapter 11**


    ![logo](images/00003.jpeg)


    Additional Uses for Python


    When you look at all the different things that you can do with Python, you will
    learn that you can actually create video games with the Python source coding as
    well as use Python for hacking into computer systems.


    Note: It is important to not hack into any system without the expressed written
    permission from the system administrator.


    **Game Creation**


    When you are creating a game using Python, you are going to use PyGame. This software
    adds the functionality on top of the SDL library. It permits you to design fully
    featured games and multimedia applications by using the Python language.


    Pygame allows the game to be highly portable and run off of nearly every platform
    and operating system.


    There are numerous examples and documentation of games that were created by using
    PyGame that have been successful. You will also notice that it is easy to write
    games as well as graphic-intensive programs by using PyGame.


    If you want to make a high-level game that is in 3D, you will use PySoy. This
    works with the engine that is used in Python 3\. Python 3 tightly binds the rendering
    physics, networking, and even the animation.


    Python-Ogre is the complete Python wrapper for the OGRE 3D engine that includes
    15 other graphics as well as gaming-related libraries that are used for GUI, special
    effects, sound, physics, and much more.'
