    列表（Lists）类似于元组（tuples），不同之处它们使用方括号而不是圆括号。放置在列表中的项不需要是相同类型。在创建列表时，你将使用与向 Python
    存入值时相同的函数；然而，区别在于元素必须是一组括号。`print(my_list)` 函数将从零开始创建列表。


    与我们讨论过的其他数据类型一样，列表的索引从零开始，并且能够被切片（sliced）。列表索引最大的区别在于，它们被赋予了与颜色（如黑、绿、红、蓝）相关的名称。如果你在索引工作范围之外的索引处放置了一个值，你将收到一条错误消息。


    如所述，列表索引可以被切片，语法如下：


    ```

    sliced_list =List_Name[startIndex:endIndex]

    ```


    列表的伟大之处在于它是可可变的（mutable），所以如果你想更改其中的值，你可以选择这样做。加号 `+` 会创建新列表，但该列表将至少与另外两个列表连接。星号
    `*` 会再次重复你的列表，这样你就不需要复制和粘贴了。


    ### 集合 (Sets)

    在创建集合时，你正在创建一个无序但唯一的元素集合。你主要在集合集合理论时集合。集合理论是一种支持的数学运算，如差集、并集、对称差甚至是交集。当你消除代码中出现的任何重复项时，你也会使用集合。


    ### 字典 (Dictionaries)

    Python 中的字典是一个容器，它包含一个无序的项集合，类似于列表。然而，字典中的对象被大括号（`{}`）围绕。字典用逗号分隔不同的基本项和键值对。值（values）和键（keys）将是
    Python 数据类型。


    你通过键访问的每个值或对象在字典中都是唯一的。用于索引的键是不可变的（immutable）。然而，你可以通过空大括号创建一个空字典。


    ### None

    在使用 Python 时你需要知道的最后一个数据值是 `none` 的数据值。这个值是一个单值类型，因为该值内有一个对象。对象将通过 Python 的内置名称进行访问。该名称显而易见是
    `None`。


    在某些情况下，任何值的缺失将从你使用的函数中返回，这样你就不会显式地得到任何返回内容。该值的真值（truth）始终为假（false）。


    ## 第 4 章

    ![logo](img/00003.jpeg)


    ### Python 列表

    列表是一种在 Perl 中可以找到的数组（以万一你以前用过 Perl 的话）。在使用 Perl 时，变量总是以某种符号开头。然而，在 Python 中，你的变量将由你来命名，以便在以后需要查找它们时能够识别它们。Python
    会跟踪用户在内部使用的任何数据类型。


    列表有许多用途；这主要取决于在 Python 中放置了什么代码。这里是你可以在 Python 中使用的几个独特的列表函数。


    - `List.append(x)`：用于在列表的末尾添加一个项时。你也可以使用函数 `len(a) :]=[x]`。

    - `List.extend(L)`：用于你尝试通过附加列表中的所有对象来扩展列表时。它等效于 `a[len(a) :] = L`。

    - `List.instert(I, x)`：用于将项插入到列表的特定位置。第一个参数必须在你插入之前位于列表索引范围内。你被要求使用 `a.insert(0,x)`
    将其置于列表开头。你也可以使用 `a.inster(len(a), x)`，这与使用 `a.append(x)` 相同。

    - `List.remove(x)`：用于从列表中删除任何值为 `x` 的项。如果你遇到错误消息，那么该项不在列表中。

    - `List.pop([i])`：用于从列表的给定位置删除一个项并返回它。如果你不使用 `a.pop()` 选择特定的索引，那么该项将返回到列表的最后一个位置。方括号表示参数是可选的，你可以输入也可以不。

    - `List.index(x)`：用于返回第一个值为 `x` 的项的索引。如果你看到错误代码，说明那个东西不存在。

    - `List.count(x)`：这告诉你 `x` 在你的列表中出现了多少次。

    - `List.sort(cmp= None, key= None, reverse= False)`：你将对列表上的参数进行自定义排序。

    - `List.reverse()`：反转项列出的方式。


    使用其中几个方法的示例如下：


    ```

    A – [66.85, 300, 300, 9, 1764.5]

    Print a.count(300), a.count(66.85), a.count(‘x’)

    896

    A.insert(8, 9)

    a.append(300)

    a

    [66.85, 300, 5, 300, 5, 1764.5, 300]

    a.index(300)

    5

    a.remove(300)

    a

    [66.85, 300, 5, 300, 5, 1764.5, 300]

    a.reverse()

    a

    [300, 1764.5, 5, 300, 5, 66.85]

    a.sort()

    a

    [5, 5, 66.85, 300, 300, 1764.5]

    a.pop()

    1764.5

    A

    [5, 5, 66.85, 300, 300]

    ```


