    还有其他库你可以查看，或者在制作游戏时会需要。如果你想研究这些库，可以访问 [www.wiki.Python.org/moin/PythonGames](http://www.wiki.Python.org/moin/PythonGames)。


    你还会看到一种被称为 PyWeek 的活动，这是一个每半年一次的挑战，会产生许多很棒的游戏。这是一个让你展示编程技能并创建一个与其他游戏竞争的挑战，以此证明你是最强的。


    ## 黑客技术 (Hacking)


    我们都在电影和电视节目中见过黑客攻击，它们看起来是多么兴奋，屏幕上到处着无意义的 0 和 1。看着它们会让黑客攻击看起来像魔法一样。


    然而，它并不是魔法。它是基于计算机的，当涉及到计算机时，所做的一切都有其科学原理，因此是可以被学习和理解的即使你不理解计算机为什么要那样做，它也一定有一个那样做的原因。


    学习计算机为什么要那样做并不困难。这只需要一些学习时间和耐心。


    当你进行黑客攻击时，你正在尝试进入某人的操作系统。这是通过破解围绕计算机的加密代码来实现的。一旦你完成了这一步，就可以查看被你破解的系统中的文件了。


    通过 Python，你能够修改代码以便进入操作系统。这件事遗憾的一点是，如果你更改了操作系统内部的内容，系统管理员将注意到你更改了内容，然后知道他们被黑客攻击了。


    如果你打算对某人进行黑客攻击，正如在本节开头提到的，在尝试攻击他们的系统之前，你需要获得系统管理员的明确许可。


    最好获得他们的书面批准，这样你就能有确凿的证据证明你有许可进入他们的系统。


    ## 第 12 章


    ![logo](img/00003.jpeg)


    ### 使用 Python 的技巧


    在 Python 上编程的第一步是让它回显你发送给它的词。你看到的 `>>>` 是程序引导你输入代码和命令的地方。当你输入 `>>> print Hello
    World, SLUAST` 时，它会返回 `Hello World, SLUAST`。


    了解基础知识总是有帮助的，比如知道打印的任何内容都可以返回给你。


    酷的地方在于，Python 还可以当作你的计算器。当你输入 `print 5` 时，你只会得到这个数字。但如果你输入 `print 5 + 22`，你可以预期看到响应为
    `27`。


    现在让我们更进一步，输入一个带有字符串和数字的词短语。当你输入 `print “I am elite,”+1337` 时，你实际上会得到这样的错误：


    ```

    Traceback (most recent call last):

    File "<pyshell#6>", line 1, in <module>

    print “I am elite”+1337

    TypeError: cannot concatenate ‘str’ and ‘int’ objects

    ```


    以“File”开头的部分显示错误位于哪个文件以及文件的哪个位置。然后，它会显示代码和错误的简短描述。这是一个你无法将字符串加到整数（只能加数字）的错误。


    幸运的是，使用语言编程是灵活的；你只需要像其他程序员那样解决它。要解决这个特定的错误，你可以将想要的用户变成一个变量。就像普通数学一样，`X` 是一个占位符，让我们让
    `X = 1337`。然后打印 `“I am elite” + X` 并回车。


    但现在还不。否则你会得到同样的错误。


    那是因为我们还没有通过像这样将双引号（”）和单引号（‘）连接起来，将变量 `X` 的数字（`1337`）转换为字符串：


    ```

    X = ‘1337’ (注意单引号)

    print “I am elite “+X (注意双引号)

    ```


    结果最终将读取为：I am elite 1337（注意这里没有错误！）


    ## 字典/集合推导式 (Dict/Set Comprehensions)


    列表推导式（List comprehensions）你可能很熟悉，但对于字典/集合推导式，这是你可能还没有意识到的。它们使用既简单又有效。看下面的示例：


    ```

    my_dict = {i: i * i for i in xrange (100)}

    my_set = {i * 15 for i in xrange (100)}

    ```


    两者唯一的区别是‘:`。


    ## 强制浮点除法 (Forcing Float Division)


    回到数学，你可以使用斜杠键 (`/`) 来除法。通常情况下，除法总是给出整数答案。对于 Python 2，通常你必须这样做：


    ```

    result = 1.0/2

    ```


    但你可以采取一个方便的小技巧来省掉这里的 .0：


    ```

    from __future__ import division

    result = 1/2

    # print(result)

    # 0.5*

    ```


    当然，如果你使用 Python 3，就不必担心这个，因为它是默认处理的。


    ## 结


    ![logo](img/00003.jpeg)


    感谢你读到 Python 的最后。希望它对你很有启发性，并能够为你提供实现目标所需的所有工具，无论你的目标是什么。


    下一步是利用你在书中中学到的所有信息，并开始你的 Python 之旅。这不会容易的，但只要你有耐心，你会发现你会让你的生活变得更好！


    感谢你并祝你好运！


    最后，如果你觉得这本书在任何方面对你有帮助，我们将非常感谢你在 Amazon 上的评价！


    '
