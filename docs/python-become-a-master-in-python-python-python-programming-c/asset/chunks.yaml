    \n# 第 7 章\n\n![logo](img/00003.jpeg)\n\n## 如何在 Python 中处理错误和异常\n\n由于某些内容没有输入正确，会出现某些错误代码弹出在你面前。也有可能发生了其他事情导致向你抛出该错误代码。\n\
    \n此外，Python 的规则总会有异常，并且为什么输入方式与你可能习惯的有所。\n\n为了知道如何处理错误和异常，你需要了解这些错误和异常是什么，以及是什么导致它们出现。有时错误是可以避免的，但有时无法避免。如果你遇到错误代码，不要气馁；如果你可以，只需返回并修复错误的地方。\n\
    \n### 错误\n\n语法错误（syntax error）将是你遇到的最常见的错误。当 Python 无法理解你输入的行代码时，就会发生这种情况。除了常见之外，这些也是致命错误，因为如果代码中有语法错误，你就无法成功执行该代码。\n\
    \n有些错误你可以在捕获后处理，例如像 `eval(““)` 这样的错误。遗憾的是，这些错误是罕见的。\n\n在 IDLE 中工作时，所有的语法错误都可以被找到，因为它们被高亮显示了。在很多情况下，语法错误由于拼写错误、错误的参数或缩进不当引起。如果你得到这个错误，你应该首先开始检查这些地方。\n\
    \n逻辑错误（Logic errors）将是最难找到的错误之一，因为它们会导致不可预测的结果，甚至可能导致你正在使用的程序崩溃。逻辑错误发生有多个原因。\n\
    \n幸运的是，逻辑错误对你来说比语法错误更容易修复，因为你可以在代码上运行调试器并发现任何问题，以便修复它并获得你想要的结果。\n\n### 异常\n\n\
    当 Python 程序知道它对你输入的代码需要做什么时，你会发现一个异常。然而，由于作用于代码的外部源，它无法执行你要求它执行的操作。这些问题之一是你试图通过\
    \ Python 访问互联网，但你没有互联网访问权限。Python 知道你在告诉它做什么，但它无法执行该任务，因为你没有完成它所需的一切。\n\n在处理异常时，你会发现它们不像语法错误，因为它们并不是每次都是致命的。异常可以通过\
    \ `try` 语句进行处理。\n\n查看以下用于显示网站 HTML 的代码。当你执行程序时，它将到达 `try` 语句，因此它将尝试按照编写的方式执行代码。但是，如果由于任何原因由于设备未连接到网络、互联网或类似物品而遇到错误，那么解释器将跳过最后行的缩进代码。\n\
    \n```python\nImport urllib2\n\nURL = ‘HTTP://www.hello.com‘\n\nTry:\n\nreq = urllib2\
    \ . Request(url)\n\nresponse = urllib2\\. urlopen(req)\n\nthe_page = response.\
    \ red()\n\nprint the_page\n\nExcept:\n\nprint “We have a problem.”\n```\n\n通过这个异常，你会注意到你为网站输入的\
    \ URL 因为程序发现的任何原因而没有打开。\n\n你也可以通过对特定错误的预判来处理错误。\n\n```python\nTry:\n\nAge = int(raw_input(“Enter\
    \ your number: ”))\n\nPrint “You must have a number of {0} to enter.” . format(number)\n\
    \nExcept ValueError:\n\nPrint: “Your number value must be numeric.”\n```\n\n你可以预测这个异常，因为你知道为了让程序正确工作，你必须为年龄输入数字。\n\
    \n你可能会遇到各种其他异常，但这两个是你遇到最多的。\n\n"
