    ### Modules in Python

    Modules are files that have statements and definitions that are used in Python.
    A standard file is going to have the ending of `.py`; however, with the module
    name, you are going to find a string that is made available due to the global
    value. For example, you can have a module file named after your favorite animal;
    therefore, the file name is going to look like this: `panther.py`.


    It is not advised that you quit the interpreter when you are in the middle of
    working on something because you are going to end up losing all of the work that
    you have done, so in the event that you are working on a program with long scripts,
    you may want to save that file into a different program so that when you have
    time, you can go back to it. The creation of a file outside of Python is called
    scripting.


    The longer that you make your program, the more likely it is that you will need
    to divide the code up into various lists so that you can check it for errors before
    it is entered into Python. Doing this is going to ensure that you do not receive
    any error messages or exceptions that you are going to have to work with.


