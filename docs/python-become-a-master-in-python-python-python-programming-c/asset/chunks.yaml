    ## 第 1 章


    ![logo](img/00003.jpeg)


    ### Python – 它是什么以及你为什么应该使用它


    Python 是一种计算机编程代码，可以在所有平台以及代码编写者使用的机器上运行。Python 具有不同的功能，实际上有助于让编码变得更容易，同时让代码看起来更好且更易于读。如果以后其他人需要回来重写代码，这将非常有用。


    当我们思考 Python（蟒蛇）时，通常会想到一种巨大的、体型沉重的收缩蛇，但这并不是我们在书中讨论的内容。然而，计算机编程语言 Python 并不是以我们经常想到的那种蛇命名的。相反，在
    1990 年，当 Guido von Rossum 创建该程序时，它是以英国喜剧剧 *Monty Python’s Flying Circus*（蒙提派的飞行马戏）命名的。


    这是一种易于获取的程序，有助于在遇到计算机问题时简化寻找解决方案。这个程序的运行方式就像你花时间坐在纸上写下问题的解决方案一样，只不过它是在计算机上完成的。


    Python 最大的优势是它可以在任何计算机上运行，一旦编写完成，你就不需要更改程序。


    当该程序在 20 90 年代最初开发时，一个志愿者团队一直在运行该程序。可以通过 Python 软件基金会的网站获取该程序甚至获得支持。该网站为 `https://www.Python.org`。2006
    年 9 月，发布了 Python 2.5。这是可用的最新 Python 版本。


    当你查看 Python 的不同版本时，你会发现有一个 Java 版本的 Python 称为 Jython。当编码员使用 Java 编程程序时可以使用 Jython。


    Iron Python 使用 C# 版本，适用于 `.Net` 和 Mono 平台。任何使用 C# 的人都拥有 Python 同样的灵活性和力量。这就像他们在使用
    Python，但实际上并没有使用它。


    但是，正如任何程序员所知，每个程序的行为都会不同。虽然 Python 是用一种语言编写的，但在工作和与其他语言交互时，它会将该语言作为主要语言运行。这只是在开发过程中内置的许多模块中的一分之一。


    PyPy 项目成立于 2003 年，旨在帮助 Python 程序员能够改变 Python 与解释器的交互方式，解释器帮助与其各种编程语言进行通信。该项目恰好是一个开源项目，因此允许由开发者社区进行免费分发和修改，以在需要调整时进行更改。该项目还得到了
    Python 基金会以及欧盟的资助。这是 STReP（特定目标研究计划）下 FP6 计划的一部分资助。


    Python 可以在任何现代操作系统上访问，并用于处理此类内容：


    * 科学数据

    * 图像

    * 文本

    * 数字

    * 或任何你选择保存在计算机上的其他东西。


    许多人并没有意识到，我们每天使用的网站实际上是使用 Python 编写的。像 YouTube 甚至 Google 这样的网站都是用 Python 代码内部创建的。NASA
    和纽约证券交易所也使用 Python 进行了加密。然而，这些只是 Python 为我们访问提供的众多网站中的一角。还有企业、政府和非营利组织的网站运行在 Python
    之上。


    由于 Python 是一种翻译记录，它不需要为了让程序运行而进行转换。这与过去的语言不同，过去的语言因为是脚本语言而必须进行转换。脚本语言的设计是为了模仿执行需要完成的平庸和琐碎任务的操作方式。然而，Python
    和其他几个类似的程序的设计初衷与众不同，它们在命名法上被迫发生了改变。


