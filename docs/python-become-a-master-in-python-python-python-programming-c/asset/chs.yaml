  \ 300, 1764.5]\na.pop()\n1764.5\nA\n[5, 5, 66.85, 300, 300]\n```\n\n## 第 5 章\n![logo](img/00003.jpeg)\n\
  \n### Python 中的模块\n模块是包含 Python 中使用的语句和定义的文件。标准文件以 `.py` 结尾；然而，通过模块名，你将找到一个由于全局值而可用的字符串。例如，你可以用你喜爱的动物命名模块文件；因此，文件名看起来像这样：`panther.py`。\n\
  \n不建议在处理某些内容的中间退出解释器，因为你将丢失所有已做的工作，所以如果你正在编写一个带有长脚本的程序，你可能想将该文件保存到另一个程序中，以便在你有时间时可以返回它。在\
  \ Python 之外创建文件被称为脚本化（scripting）。\n\n你的程序做的越长，你就越可能需要将代码分成不同的列表，以便在输入 Python 之前进行错误检查。这样做将确保你不会收到任何需要处理的错误消息或异常。\n\
