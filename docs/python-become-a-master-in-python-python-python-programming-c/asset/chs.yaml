  \    Print “number ,” number\n    Return\n\n#现在你将调用你的函数\n\nPrintdata ( number =\
  \ 5, address 405”)\nPrintdata (address = “405”)\n```\n\n当你不必须处理一个函数以检查参数是否多于定义的参数时，就会变长参数。\n\
  \n### 语法\n\n```python\nDef fuctionname ([ formal _ args, ] * var_args_tuple ):\n\
  \    “function_docstring”\n    Function_suite\n    Return [expression]\n```\n\n\
  星号将放在包含所有值且没有关键字变量的变量名之前。因此，由于你没有在这个函数中定义任何参数，你的元组将是空的。\n\n# 第 7 章\n\n![logo](img/00003.jpeg)\n\
  \n## 如何在 Python 中处理错误和异常\n\n由于某些内容没有输入正确，会出现某些错误代码弹出在你面前。也有可能发生了其他事情导致向你抛出该错误代码。\n\
  \n此外，Python 的规则总会有异常，并且为什么输入方式与你可能习惯的有所。\n\n为了知道如何处理错误和异常，你需要了解这些错误和异常是什么，以及是什么导致它们出现。有时错误是可以避免的，但有时无法避免。如果你遇到错误代码，不要气馁；如果你可以，只需返回并修复错误的地方。\n\
  \n### 错误\n\n语法错误（syntax error）将是你遇到的最常见的错误。当 Python 无法理解你输入的行代码时，就会发生这种情况。除了常见之外，这些也是致命错误，因为如果代码中有语法错误，你就无法成功执行该代码。\n\
  \n有些错误你可以在捕获后处理，例如像 `eval(““)` 这样的错误。遗憾的是，这些错误是罕见的。\n\n在 IDLE 中工作时，所有的语法错误都可以被找到，因为它们被高亮显示了。在很多情况下，语法错误由于拼写错误、错误的参数或缩进不当引起。如果你得到这个错误，你应该首先开始检查这些地方。\n\
  \n逻辑错误（Logic errors）将是最难找到的错误之一，因为它们会导致不可预测的结果，甚至可能导致你正在使用的程序崩溃。逻辑错误发生有多个原因。\n\n\
  幸运的是，逻辑错误对你来说比语法错误更容易修复，因为你可以在代码上运行调试器并发现任何问题，以便修复它并获得你想要的结果。\n\n### 异常\n\n当 Python\
  \ 程序知道它对你输入的代码需要做什么时，你会发现一个异常。然而，由于作用于代码的外部源，它无法执行你要求它执行的操作。这些问题之一是你试图通过 Python\
  \ 访问互联网，但你没有互联网访问权限。Python 知道你在告诉它做什么，但它无法执行该任务，因为你没有完成它所需的一切。\n\n在处理异常时，你会发现它们不像语法错误，因为它们并不是每次都是致命的。异常可以通过\
  \ `try` 语句进行处理。\n\n查看以下用于显示网站 HTML 的代码。当你执行程序时，它将到达 `try` 语句，因此它将尝试按照编写的方式执行代码。但是，如果由于任何原因由于设备未连接到网络、互联网或类似物品而遇到错误，那么解释器将跳过最后行的缩进代码。\n\
  \n```python\nImport urllib2\n\nURL = ‘HTTP://www.hello.com‘\n\nTry:\n\nreq = urllib2\
  \ . Request(url)\n\nresponse = urllib2\\. urlopen(req)\n\nthe_page = response. red()\n\
  \nprint the_page\n\nExcept:\n\nprint “We have a problem.”\n```\n\n通过这个异常，你会注意到你为网站输入的\
  \ URL 因为程序发现的任何原因而没有打开。\n\n你也可以通过对特定错误的预判来处理错误。\n\n```python\nTry:\n\nAge = int(raw_input(“Enter\
  \ your number: ”))\n\nPrint “You must have a number of {0} to enter.” . format(number)\n\
  \nExcept ValueError:\n\nPrint: “Your number value must be numeric.”\n```\n\n你可以预测这个异常，因为你知道为了让程序正确工作，你必须为年龄输入数字。\n\
  \n你可能会遇到各种其他异常，但这两个是你遇到最多的。\n\n\n\n\n请记住，除非出现特殊情况，否则程序将知道你想让它做什么，但它将无法执行，因为存在一个你无法控制的问题，而你必须修复它。但是，如果出现错误（error），它可能最终超出你的控制范围。如果你无法通过所告知的几个基本步骤找到错误，那么你的错误将是一个语法错误，你可能无法修复它。如果是如此，你最终可能需要重新开始编写代码，并尝试避免再次犯同样的错误。\n\
  \n# 第 8 章\n\n![logo](img/00003.jpeg)\n\n## Python 运算符\n\nPython 的另一个有用之处是你可以用它进行数学运算！没有人喜欢算术——好吧，那是句谎言，有些人是喜欢的。但是，当数学变得复杂时，如果有一些帮助是很好的。Python\
  \ 将为你提供帮助！你可以将方程输入 Python 并每次都得到正确答案。只要你输入的运算正确即可。你可以从简单方程到需要各种步骤的复杂方程都进行计算。\n\n\
  在 Python 中，你会发现一些常见的数学运算符如下：\n\n- `A+b` 用于加法。\n- `a−b` 用于减法。\n- `a*b` 用于乘法。\n- `a/b`\
  \ 用于除法。\n- `a//b` 用于 Python 2.2 及更高版本的整除。\n- `a%b` 是模 b 运算，将为你提供模。\n- `−a` 用于取反。\n\
  - `Abs(a)` 或 `|a|` 用于绝对值。\n- `A**b` 或 `a^b` 用于幂。\n- `Math.sqrt(a)` 是你在 Python 中输入平方根的方法。\n\
  \n请尽量记住，如果你需要使用函数 `math.sqrt()`，那么你需要让 Python 知道你需要加载 `math` 模块。为了做到这一点，你应该有输入代码以便其被打开。\n\
  \n在 Python 中进行数学运算的缺点是，它在浮点算术的舍入误差方面存在局限性，这最终会给你意想不到的结果。例如，如果你通过放置 `print(0.8/0.2)`\
  \ 来普通除法，如果操作正确，你应该得到 4.0 的正确结果。然而，当你对相同的数字进行整除时，你得到的返回结果是 4.0。\n\nPython 2.x 系列中的整除仅对长整数（longs）和整数有效。但是，“真除”是对复数和浮点数进行的。使用\
  \ Python 3.x 时，真除法方法适用于所有类型的数字。你可以通过在普通除法符号周围加上 [math]=0.5 来解决这个问题。这个答案将导致它向下舍入\
  \ 0.5，因为你在函数中是这样要求的。\n\n在小学期间，我们学习了运算顺序，Python 也不例外。在数学中，你将使用 PEMDAS 来评估所有的表达式。你将在边读边计算；你会从左到右执行表达式中的每种运算顺序。\n\
  \n- **P** 代表括号。括号中的所有内容将首先执行。\n- **E** 代表指数。指数无非快捷的乘法或除法。\n- **M and D** 代表乘法和除法。如果你在同一个方程中同时拥有两者，你将在除法之前执行乘法。\n\
  - **A and S** 是加法和减法。就像乘法和除法一样，你将在减法之前执行加法。\n\n如果你数学计算得正确，那么你的答案就是正确的。例如 `8 + (25\
  \ − 10) * 6/5 = 26`。\n\n1. 第一步是执行 `25 − 10`，你会得到答案 `15`。\n2. 因为没有指数，我们跳过那一步，进入乘法和除法。\n\
  3. 你的数学方程现在看起来像 `8 + (15) * 6/5 = 26`。\n4. `15 * 6` 等于 `90`，剩下 `8 + 90/5 = 26`。\n\
  5. `90/5` 将给你 `18`。\n6. `8 + 18 = 26`。\n\n你的答案是 `26`。对于一个如此简单的答案来说，这似乎有很多操作，但这就是创建我们数学方式的人所决定的。正如我们所知，数学并不总是像整数那样整整齐齐。有时你会收到小数点甚至是分数，我们并不总是能够对其向上舍入或向下舍入。\n\
  \n如果你重 75 磅，那么你就是 34.019427 公斤。Python 会自动在任何数字中打印 10 位小数。但如果你只想得到一位或两位，你将使用 `round()`\
  \ 函数，以便你可以将数字舍入到你寻找的小位数。在使用此功能时，你不仅要指定想要舍入的数字，还要指定想要舍入的小位数。\n\n例如，如果你想舍入我们刚刚将磅转换为公斤时得到的数字，你将输入\
  \ `print round(34.019427, 2)`，这样它将舍入到两个不同的小数。在我们已知的小数舍入数学规则中，你会得到数字 34.02。\n\n你被授权在一个函数内部指定另一个函数以获得你想要的答案。将两个函数放在一起时，被称为嵌套函数，它的工作方式与你单独执行函数完全相同。\n\
  \n例如下：\n\n```\ntwoSigFigs = round(pounds_kilograms,2)\nnumToString = str(twoSigFigs)\n\
  print (“you weigh” + numToString + “kilograms”)\n```\n\n Python 将执行此函数并给你与你转换和舍入时得到的完全相同的结果。34.02。只需要使用\
  \ Python，你就可以完成从基础数学到复杂的三角函数的所有问题。它优秀的一点是，你不需要知道如何解决问题本身，你只需要知道如何将其放在 Python 中，以便\
  \ Python 可以为你计算出来。\n\n# 第 9 章\n\n![logo](img/00003.jpeg)\n\n## Python 中的字符串格式化\n\
  \n字符串是一个包含有用常量和类的模块；它们甚至可以包含仅作为字符串方法使用的弃用旧函数。Python 具有内置的字符串类型，以支持序列类型方法。\n\n为了格式化字符串输出，你将使用模板或百分比符号\
  \ (%) 运算符。还有另一个内置函数用于帮助你在 Python 中格式化字符串。Python 中的 `str` 和 `Unicode` 类被放置在那里是为了帮助多个变量替换，以及通过\
  \ `str.format()` 技术对字符串中的值进行格式化。\n\n你可以在字符串模块中找到 `formatter` 类，它可以帮助使用放在 `format()`\
  \ 方法中的相同技术来自自定义字符串的格式及其行为。\n\n- 字符串格式化类（Class string formatter）：为了遵循公共方法，应使用此格式器。\n\
  - `Format(format_string, *args, **kwargs)`：这是主要方法。它接受你刚刚格式化的字符串以及一组随机的关键字参数和位置。这只是一个使用\
  \ `vformat()` 对你格式化字符串的包装器。\n- 格式器还将帮助定义各种你可以使用来替换子类的方法。\n- `Parse(format_string)`：你将遍历格式化字符串并返回一个可迭代元组（字面量文本、字段名、格式规范和转换）。将此项与\
  \ `vformat()` 使用将把字符串引入替换字段或字面量文本。\n\n\n\n\n放入元组的任何值都将代表其随后的字面文本，但仅包含单个替换区域。如果你没有放置任何字面文本（这在连续出现两个替换字段时可能会发生），你的\
  \ `literal_text` 字符串长度将为零。如果没有替换字段，则值 `format_spec` 和 `field_name` 以及转换类型都将为 `None`。\n\
  \n`Get_field(field_name, args, kwargs)`：当 `parse()` 返回 `field_name` 时，你将转换对象以便对其进行格式化。元组将返回\
  \ `(obj, used_key)`。你的默认版本将采用由 `PEP3101` 定义的字符串，可以在 [`www.Python.org/dev/peps/pep=3101`](https://www.Python.org/dev/peps/pep=3101)\
  \ 找到。\n\n这些形式或是 `label.title` 甚至是“0[name]”。`Args` 和 `Kwargs` 将通过 `vformat()` 传递，使得返回的值与你的关键参数具有相同的含义。\n\
  \n`Get_value(key, args, kwargs)`：你将能够检索列表中提供的任何字段值。`key` 参数将给你一个字符串或一个整数。在得到整数的情况下，你会看到\
  \ `args` 中位置参数的索引；但如果你得到字符串，它将代表 `kwargs` 中的命名参数。\n\n如果列表中的用于 `vformat()` 的任何位置参数在你的列表中设置了\
  \ `args` 参数，那么 `kwargs` 参数将被设置为字典中列出的关键字参数。\n\n但是，对于任何复合字段名，函数将只调用字段名中的第一个项。后续元素将处理用于索引的标准方法和操作。\n\
  \n如果你的字段表达式是“0.name”，那么你的 `get_value()` 需要一个等于 `0\\.` 的 `key` 参数。在 Python 内置的 `getter()`\
  \ 函数返回 `get_value()` 之后，将找到名称。\n\n当关键字和索引引用一个不存在的对象时，将抛出 `key error` 或 `index error`\
  \ 以提醒你这些项不存在。\n\n`Check_unsued_args(used_args, args, kwargs)`：你将使用此方法检查任何未使用的参数。你通过所有参数键设置的参数将引用已格式化的字符串。这包括用于任何命名参数的位置参数、整数和字符串。\n\
  \n它们还将引用任何通过 `vformat` 的 `kwargs` 或 `args`。任何未使用的 `args` 将使用参数计算。如果检查失败，`Check_unused_args()`\
  \ 将抛出异常。\n\n`Format_field(value, format_spec)`：全局的 `format()` 与 `format_field()`\
  \ 相同。创建此方法是为了子类能够重写它。\n\n`Convert_field(value, conversion)`：从 `get_field()` 返回的值将进行转换。任何默认版本都能理解\
  \ `str(s)`、`repr(r)` 和 `sciiASCII(a)` 是 Python 使用的转换类型。\n\n# 第 10 章\n\n![logo](img/00003.jpeg)\n\
  \n## 使用 Python 构建网站\n\nPython 可以被用于许多事情。你可以用它进行黑客攻击甚至视频游戏创作。在本章中，我们将讨论如何使用 Python\
  \ 来构建网站。\n\n如果你编写的代码第一次第一次运行的结果不是你预期的那样，不要担心。记住，你可以使用 Python 编写临时程序，这些程序不会影响你最终完成的项目。\n\
  \n当你查看 Google 和 YouTube 等网站时，你可能不知道，但正如我们之前提到的，它们是使用 Python 构建的。然而，你将使用 `Flask`\
  \ 框架从零开始创建自己的网站。`Flask` 易于学习，入门也很简单。\n\n首先，你需要在空文本插入类似于下面代码的内容。\n\n注意：确保你始终使用标题保存你的工作，并以\
  \ `.py` 结尾。\n\n```python\nfrom flask import Flask\n\napp = Flask(__name__)\n\n@app.route('/')\n\
  \ndef home():\n    return \"Hey there!\"\n\nif __name__ == '__main__':\n    app.run(debug=True)\n\
  ```\n\n请注意，从代码的第一行开始就从库导入了 `flask`。如果你没有安装该库，将收到一个不允许你继续的错误代码。\n\n如果你需要安装 `flask`，只需在\
  \ Python 命令行中输入 `pip install flask` 即可。一旦你确保 `flask` 已正确安装，运行你的测试脚本。\n\n一旦你的脚本正常运行，网站就会在你的本地机器上运行，并且可以通过在你使用的浏览器中输入\
  \ `localhost:5000` 来进行查看。\n\n此时，你的网站只是纯文本。在添加各种让它看起来像网站的设计等内容之前，确保它是可以正常工作的。。\n\n\
  你需要考虑的第一件事是，谁将使用你的网站？这将影响你在代码中放入的数据，以及你如何设计网站的外观。\n\n作为一名开发者，你将需要编写 Python 代码来处理访问你网站的用户请求以及\
  \ CGI。这是 Python 和许多其他 Web 开发编程语言用于创建网页的标准环境。\n\n由于这是一项如此具有重复性的任务，你可以将所有代码整合在一起并创建许多\
  \ Python 文件。这些文件被称为 `flask`。`Flask` 是在 Python 内部加载并自动执行例行代码的框架。这将允许你专注于网站中需要在日后进入并修复的特定部分。\n\
  \n所以，如果你在命令行中输入 `pip install flask`，你正在从存储库中安装 `flask` 框架。然而，当你导入 `flask` 时，你是在为你的当前脚本使该框架可用。\n\
  \n因此，你的代码看起来应该像这样：\n\n1. `from flask import Flask`\n2. \n3. `app = Flask(__name__)`\n\
  4. \n5. `@app.route('/')`\n6. `def home():`\n7. `return \"Hey there!\"`\n8. \n9.\
  \ `if __name__ == '__main__':`\n10. `app.run(debug=True)`\n\n在第 1 行中，使用 `flask`\
  \ 构建 Web 应用所需的所有代码都位于这里。只需放入 `flask`，它是用于创建 Web 应用程序实例的原型。\n\n一旦导入了 `flask`，你现在就可以创建一个可以帮助你\
  \ Web 应用的 `flask` 类了。第 3 行使用 `__name__` 名称执行了相同的操作。这是一个特殊变量，当你实际执行脚本时，它的值被为字符串 `__main__`。\n\
  \n第 5-7 行将是你返回字符串的定义函数。这些函数映射到主页 `/` URL。因此，用户将导航到 `localhost:5000`，然后 `home` 函数将将其原始输出返回到网页。如果输入路由方法是不同的，例如\
  \ `/about/`，那么用户将被引导到 `localhost:5000/about/`。\n\n第 9 和第 10 行包含 `__main__` 脚本。如果脚本被导入到另一个脚本中，脚本将保留其原始名称，但在我们的案例中，我们使用\
  \ `__name__`，它将等于 `__main__`。如果条件语句满足，则将执行 `app.run()`。这允许程序员控制脚本的行为。\n\n你还会注意到\
  \ `debug` 参数被设置为 `true`。这会将可能的 Python 错误显示在网页上，从而帮助追踪脚本中的任何错误。当你在生产环境中，你可能希望将其设置为\
  \ `false`。\n\n\n\n\n\n如果你想让内容在视觉上更有吸引力，你需要整合一些 HTML 文件。这将返回 HTML 页面，而不仅仅是纯文本字符串。\n\
  \n在这里，你将学习如何使用 `render_template` 方法返回 HTML 页面。\n\n你会发现不再有纯文本，而且你拥有的文本可以有各种格式。这是通过从\
  \ Python 返回 HTML 模板而不是纯文本来实现的。\n\n为了这一点，你需要创建一个命名类似于 `home.html` 的空文件，并将以下代码放入其中。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>My Personal Website</h1>\n<p>Hi,\
  \ this is my personal website.</p>\n</body>\n</html>\n```\n\nHTML 是网页使用的语言。在创建 HTML\
  \ 页面时，你务必确保记住这三点重要事项：\n\n- HTML 的任何可见部分都将位于 `<body>` 和 `</body>` 之间。该区域之外的区域用于引用\
  \ Javascript 文件、CSS 或任何类似的功能。\n- HTML 文档需要以指定文档类型的声明作为开头：`<!DOCTYPE html>`\n- HTML\
  \ 文档将始终以 `<html>` 开始并以 `</html>` 结束。\n\n在 `flask` 框架中，它应该被写在一个可以专门查找 HTML 模板文件的文件夹中。该文件夹应该被称为\
  \ `templates`。任何 Python 脚本将留在 `templates` 文件夹之外，因为它们不是 HTML。\n\n读取 HTML 模板的代码看起来类似于所示。注意：这是我们之前\
  \ flask 代码的更新后的版本。\n\n```python\nfrom flask import Flask, render_template\n\napp\
  \ = Flask(__name__)\n\n@app.route('/')\ndef home():\n    return render_template('home.html')\n\
  \nif __name__ == '__main__':\n    app.run(debug=True)\n```\n\n你会注意到，代码通过使用 `flask`\
  \ 框架中导入的 `render_template` 方法来维护。正是通过这里，`flask` 框架加载了 HTML 文件。每当用户访问你的 URL 时，它将生成一个\
  \ `jinja 2` 模板，并将模型返回给浏览器。\n\n如果你想创建一个“关于”（about）页面，你需要在模板文件夹中创建另一个 HTML 文件。这部分代码看起来大致如下：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>About me</h1>\n<p>This is a portfolio\
  \ site about anything that can be put in a portfolio.</p>\n</body>\n</html>\n```\n\
  \n从这里，你将能够通过向模板连接次要函数来使用 Python 渲染你创建的 HTML。新的代码看起来如下：\n\n```python\nfrom flask\
  \ import Flask, render_template\n\napp = Flask(__name__)\n\n@app.route('/')\ndef\
  \ home():\n    return render_template('home.html')\n\n@app.route('/about/')\ndef\
  \ about():\n    return render_template('about.html')\n\nif __name__ == '__main__':\n\
  \    app.run(debug=True)\n```\n\n一旦你输入了最后一段代码，你就可以运行脚本 `localhost:5000/about`，这将打开一个新页面。在稍后的日期，可以为该模板应用\
  \ CSS 样式，以使其看起来像你想要的样子。\n\n`about.html` 的更新代码看起来类似于所示：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<div class=\"about\">\n<h1>About me</h1>\n<p>This is a portfolio\
  \ site about anything that can be put in a collection.</p>\n</div>\n</body>\n</html>\n\
  ```\n\n你对对你的 `home.html` 这样做。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div\
  \ class=\"home\">\n<h1>About me</h1>\n<p>This website was built with Python via\
  \ the Flask framework.</p>\n</div>\n</body>\n</html>\n```\n\n现在当你运行 Python 脚本时，你将有两个打开的\
  \ URL。现在，你应该有两个 HTML 页面，以及一个导致你的 HTML 页面产生不同 URL 的 Python 脚本。这两个 URL 分别是你的首页和关于页。\n\
  \n如果你需要在每个页面中设计一个区域，你将需要添加 HTML 代码为每个文件生成页眉（header）。然而，在你这样做之前，智能的做法是创建一个父 HTML\
  \ 模板，你的后续模板将从中继承代码。这是通过简单将父模型链接到每个 HTML 页面来实现的，以便它们继承代码。\n\n第一个动作是创建一个名为 `layout.html`\
  \ 的新页面，代码看起来如下：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<header>\n<div class=\"\
  container\">\n<h1 class=\"logo\">Ardit’s web app</h1>\n<strong><nav>\n<ul class=\"\
  menu\">\n<li><a href=\"{{ url_for('home') }}\">Home</a></li>\n<li><a href=\"{{ url_for('about')\
  \ }}\">About</a></li>\n</ul>\n</nav></strong>\n</div>\n</header>\n</body>\n</html>\n\
  ```\n\nPython 将会修改 `home.html` 和 `about.html` 页面以及你的 `layout.html` 文件。此时，你将需要将 `about.html`\
  \ 和 `home.html` 都链接到 `layout.html`。这将需要几行代码，你将从 `layout.html` 开始。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<header>\n<div class=\"container\">\n<h1 class=\"logo\"\
  >Ardit’s web app</h1>\n<strong><nav>\n<ul class=\"menu\">\n<li><a href=\"{{ url_for('home')\
  \ }}\">Home</a></li>\n<li><a href=\"{{ url_for('about') }}\">About</a></li>\n</ul>\n\
  </nav></strong>\n</div>\n</header>\n<div class=\"container\">\n{% block content\
  \ %}\n{% endblock %}\n</div>\n</body>\n</html>\n```\n\n你会注意到你的 `layout.html` 中添加了一个新的\
  \ div 部分。大括号内的两行将根据用户此时使用的哪个 URL，在 `home.html` 或 `about.html` 代码中按需替换。但是，为了让这些生效，你需要编辑你的关于页和首页，以便它们能够连接到你的布局页面。\n\
  \n你的 `home.html` 代码看起来如下：\n\n```html\n{% extends \"layout.html\" %}\n{% block content\
  \ %}\n<div class=\"home\">\n<h1>A Python product</h1>\n<p>This website was built\
  \ with Python via the Flask framework.</p>\n</div>\n{% endblock %}\n```\n\n这是你的\
  \ `about.html` 看起来的样子：\n\n```html\n{% extends \"layout.html\" %}\n{% block content\
  \ %}\n<div class=\"about\">\n<h1>About me</h1>\n<p>This is a portfolio site about\
  \ anything that can be put in a portfolio.</p>\n</div>\n{% endblock %}\n```\n\n\
  恭喜！\n\n你现在有了一个功能完备的网站！但是，你仍然缺少网站的一些内容。这些只是使用 Python 代码制作网站的基础基础知识。你仍然可以为你的网站添加更多内容，如\
  \ CSS 样式，最后，关于使你的网站公开所需的步骤，你可以在 [www.Pythonhow.com](http://www.Pythonhow.com) 的课程中找到。\n\
  \n# 第 11 章\n\n![logo](img/00003.jpeg)\n\n## Python 的其他用途\n\n当你看到使用 Python 可以做的所有不同事情时，你会发现你实际上可以使用\
  \ Python 源代码创建视频游戏，以及使用 Python 破解计算机系统。\n\n注意：在没有系统管理员明确书面许可的情况下，不要入侵任何系统是非常重要的。\n\
  \n### 游戏创建\n\n当你使用 Python 创建游戏时，你将使用 `PyGame`。该软件在 SDL 库之上增加了功能。它允许你使用 Python 语言设计功能齐全的游戏和多媒体应用程序。\n\
  \n`Pygame` 让游戏具有高度的可移植性，并运行在几乎每个平台和操作系统上。\n\n有很多使用 `PyGame` 创建并成功的游戏示例和文档。你还会发现使用\
  \ `PyGame` 编写游戏以及图形密集型程序是非常容易的。\n\n如果你想创建一个 3D 的高级游戏，你将使用 `PySoy`。它与 Python 3 使用的引擎配合。`Python\
  \ 3` 紧密结合了渲染、物理、网络甚至动画。\n\n`Python-Ogre` 是 `OGRE 3D` 引擎的完整 Python 封装，包含了 15 个其他图形以及与游戏相关的库，用于\
  \ GUI、特殊效果、声音、物理等更多内容。\n\n\n\n\n\n还有其他库你可以查看，或者在制作游戏时会需要。如果你想研究这些库，可以访问 [www.wiki.Python.org/moin/PythonGames](http://www.wiki.Python.org/moin/PythonGames)。\n\
  \n你还会看到一种被称为 PyWeek 的活动，这是一个每半年一次的挑战，会产生许多很棒的游戏。这是一个让你展示编程技能并创建一个与其他游戏竞争的挑战，以此证明你是最强的。\n\
  \n# 黑客技术 (Hacking)\n\n我们都在电影和电视节目中见过黑客攻击，它们看起来是多么兴奋，屏幕上到处着无意义的 0 和 1。看着它们会让黑客攻击看起来像魔法一样。\n\
  \n然而，它并不是魔法。它是基于计算机的，当涉及到计算机时，所做的一切都有其科学原理，因此是可以被学习和理解的即使你不理解计算机为什么要那样做，它也一定有一个那样做的原因。\n\
  \n学习计算机为什么要那样做并不困难。这只需要一些学习时间和耐心。\n\n当你进行黑客攻击时，你正在尝试进入某人的操作系统。这是通过破解围绕计算机的加密代码来实现的。一旦你完成了这一步，就可以查看被你破解的系统中的文件了。\n\
  \n通过 Python，你能够修改代码以便进入操作系统。这件事遗憾的一点是，如果你更改了操作系统内部的内容，系统管理员将注意到你更改了内容，然后知道他们被黑客攻击了。\n\
  \n如果你打算对某人进行黑客攻击，正如在本节开头提到的，在尝试攻击他们的系统之前，你需要获得系统管理员的明确许可。\n\n最好获得他们的书面批准，这样你就能有确凿的证据证明你有许可进入他们的系统。\n\
  \n# 第 12 章\n\n![logo](img/00003.jpeg)\n\n### 使用 Python 的技巧\n\n在 Python 上编程的第一步是让它回显你发送给它的词。你看到的\
  \ `>>>` 是程序引导你输入代码和命令的地方。当你输入 `>>> print Hello World, SLUAST` 时，它会返回 `Hello World,\
  \ SLUAST`。\n\n了解基础知识总是有帮助的，比如知道打印的任何内容都可以返回给你。\n\n酷的地方在于，Python 还可以当作你的计算器。当你输入\
  \ `print 5` 时，你只会得到这个数字。但如果你输入 `print 5 + 22`，你可以预期看到响应为 `27`。\n\n现在让我们更进一步，输入一个带有字符串和数字的词短语。当你输入\
  \ `print “I am elite,”+1337` 时，你实际上会得到这样的错误：\n\n```\nTraceback (most recent call\
  \ last):\nFile \"<pyshell#6>\", line 1, in <module>\nprint “I am elite”+1337\nTypeError:\
  \ cannot concatenate ‘str’ and ‘int’ objects\n```\n\n以“File”开头的部分显示错误位于哪个文件以及文件的哪个位置。然后，它会显示代码和错误的简短描述。这是一个你无法将字符串加到整数（只能加数字）的错误。\n\
  \n幸运的是，使用语言编程是灵活的；你只需要像其他程序员那样解决它。要解决这个特定的错误，你可以将想要的用户变成一个变量。就像普通数学一样，`X` 是一个占位符，让我们让\
  \ `X = 1337`。然后打印 `“I am elite” + X` 并回车。\n\n但现在还不。否则你会得到同样的错误。\n\n那是因为我们还没有通过像这样将双引号（”）和单引号（‘）连接起来，将变量\
  \ `X` 的数字（`1337`）转换为字符串：\n\n```\nX = ‘1337’ (注意单引号)\nprint “I am elite “+X (注意双引号)\n\
  ```\n\n结果最终将读取为：I am elite 1337（注意这里没有错误！）\n\n# 字典/集合推导式 (Dict/Set Comprehensions)\n\
  \n列表推导式（List comprehensions）你可能很熟悉，但对于字典/集合推导式，这是你可能还没有意识到的。它们使用既简单又有效。看下面的示例：\n\
  \n```\nmy_dict = {i: i * i for i in xrange (100)}\nmy_set = {i * 15 for i in xrange\
  \ (100)}\n```\n\n两者唯一的区别是‘:`。\n\n# 强制浮点除法 (Forcing Float Division)\n\n回到数学，你可以使用斜杠键\
  \ (`/`) 来除法。通常情况下，除法总是给出整数答案。对于 Python 2，通常你必须这样做：\n\n```\nresult = 1.0/2\n```\n\
  \n但你可以采取一个方便的小技巧来省掉这里的 .0：\n\n```\nfrom __future__ import division\nresult = 1/2\n\
  # print(result)\n# 0.5*\n```\n\n当然，如果你使用 Python 3，就不必担心这个，因为它是默认处理的。\n\n# 结\n\n\
