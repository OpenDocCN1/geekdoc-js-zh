  \n当函数没有参数时，你的代码与上述代码相同；唯一的区别是你的括号是空的。\n\n因此，函数和模块在代码上看起来相似，它们确实协同工作，尽管它们并不完全相同。每个对象在你工作的代码中都有它们自己的定义，这些定义不会被打印。\n\
  \n\n\n语句用于函数内部，而模块将向你展示你为该函数设置的参数的结果。\n\n查看函数的另一种方法是将其看作一个经过组织并可以重复使用的代码块，以便你可以执行与你正在进行的操作相关的单一操作。函数使你的应用程序具有更高程度的可复用代码。\n\
  \n你自己定义的函数将被称为用户定义函数。在定义函数时，你必须遵循一些简单的规则，以确保 Python 知道你正在处理一个函数。\n\n1. 你的 `return`\
  \ 语句将通过表达式返回给原始调用者来退出函数。`return` 语句中不会有参数。它要么返回原值，要么返回 `none`。\n2. 函数的代码块将使用关键字\
  \ `def` 来定义，后面紧跟函数名和一组括号。\n3. 所有的函数代码块都以冒号开头，并进行缩进。\n4. 你放在括号中的任何参数都可以被定义。\n5. 你的函数中的第一条语句是可选可选的。\n\
  \n### 定义函数的语法：\n\n```python\nDef functionname ( parameters )\n    “function_ docstring.”\n\
  \    Function_suite\n    Return [ expression ]\n```\n\n参数默认具有位置行为；因此，你需要按照定义它们的相同顺序告知参数。\n\
