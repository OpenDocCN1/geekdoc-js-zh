- "# Python：Python 精通指南\n\n\n\n![](img/cover.jpeg)\n\n\n![logo](img/00003.jpeg)\n\n\
  \n![logo](img/00004.jpeg)\n\n\n\n\n\n\n\n![logo](img/00003.jpeg)\n\n\n## 介绍\n\n\
  ![logo](img/00003.jpeg)\n\n恭喜你下载 `Python`，感谢你的支持。\n\n后续章节将讨论你如何将 Python 应用于日常生活和工作生活中。你将看到该系统如何运行的代码和示例。不仅如此，你还将学习为什么你想要使用\
  \ Python 而不是其他编程语言。$\n\n市场上有很多关于这个主题的书。再次感谢你选择这一本！我们付出了努力确保它包含了尽可能有用的信息。请尽情阅读！\n\
  \n## 第 1 章\n\n![logo](img/00003.jpeg)\n\n### Python – 它是什么以及你为什么应该使用它\n\nPython\
  \ 是一种计算机编程代码，可以在所有平台以及代码编写者使用的机器上运行。Python 具有不同的功能，实际上有助于让编码变得更容易，同时让代码看起来更好且更易于读。如果以后其他人需要回来重写代码，这将非常有用。\n\
  \n当我们思考 Python（蟒蛇）时，通常会想到一种巨大的、体型沉重的收缩蛇，但这并不是我们在书中讨论的内容。然而，计算机编程语言 Python 并不是以我们经常想到的那种蛇命名的。相反，在\
  \ 1990 年，当 Guido von Rossum 创建该程序时，它是以英国喜剧剧 *Monty Python’s Flying Circus*（蒙提派的飞行马戏）命名的。\n\
  \n这是一种易于获取的程序，有助于在遇到计算机问题时简化寻找解决方案。这个程序的运行方式就像你花时间坐在纸上写下问题的解决方案一样，只不过它是在计算机上完成的。\n\
  \nPython 最大的优势是它可以在任何计算机上运行，一旦编写完成，你就不需要更改程序。\n\n当该程序在 20 90 年代最初开发时，一个志愿者团队一直在运行该程序。可以通过\
  \ Python 软件基金会的网站获取该程序甚至获得支持。该网站为 `https://www.Python.org`。2006 年 9 月，发布了 Python\
  \ 2.5。这是可用的最新 Python 版本。\n\n当你查看 Python 的不同版本时，你会发现有一个 Java 版本的 Python 称为 Jython。当编码员使用\
  \ Java 编程程序时可以使用 Jython。\n\nIron Python 使用 C# 版本，适用于 `.Net` 和 Mono 平台。任何使用 C# 的人都拥有\
  \ Python 同样的灵活性和力量。这就像他们在使用 Python，但实际上并没有使用它。\n\n但是，正如任何程序员所知，每个程序的行为都会不同。虽然 Python\
  \ 是用一种语言编写的，但在工作和与其他语言交互时，它会将该语言作为主要语言运行。这只是在开发过程中内置的许多模块中的一分之一。\n\nPyPy 项目成立于 2003\
  \ 年，旨在帮助 Python 程序员能够改变 Python 与解释器的交互方式，解释器帮助与其各种编程语言进行通信。该项目恰好是一个开源项目，因此允许由开发者社区进行免费分发和修改，以在需要调整时进行更改。该项目还得到了\
  \ Python 基金会以及欧盟的资助。这是 STReP（特定目标研究计划）下 FP6 计划的一部分资助。\n\nPython 可以在任何现代操作系统上访问，并用于处理此类内容：\n\
  \n* 科学数据\n* 图像\n* 文本\n* 数字\n* 或任何你选择保存在计算机上的其他东西。\n\n许多人并没有意识到，我们每天使用的网站实际上是使用 Python\
  \ 编写的。像 YouTube 甚至 Google 这样的网站都是用 Python 代码内部创建的。NASA 和纽约证券交易所也使用 Python 进行了加密。然而，这些只是\
  \ Python 为我们访问提供的众多网站中的一角。还有企业、政府和非营利组织的网站运行在 Python 之上。\n\n由于 Python 是一种翻译记录，它不需要为了让程序运行而进行转换。这与过去的语言不同，过去的语言因为是脚本语言而必须进行转换。脚本语言的设计是为了模仿执行需要完成的平庸和琐碎任务的操作方式。然而，Python\
  \ 和其他几个类似的程序的设计初衷与众不同，它们在命名法上被迫发生了改变。\n\n\n\n\n\nPython 使用的语法和命令与其他任何其他解释型语言都不同。例如，Perl\
  \ 正在被 PHP 取代成为快速直接的 Web 开发程序的通用语言。但是，与 Perl 甚至 PHP 不同，Python 更容易遵循，也更易阅读。\n\nPerl\
  \ 和 PHP 共同拥有的异代码是这两个程序的要缺陷之一。`PHP` 和 `Perl` 的语法使得编写超过 50 到 100 行的代码变得困难。然而，`Python`\
  \ 由于其极高的可读性，使得扩展和维护代码行变得更加容易。这是内置 Python 语言底层结构中的硬化模块之一。\n\n对于一种更通用的面向 Web 的编程语言，PHP\
  \ 是现有的较好语言之一。PHP 实际上代表“超文本处理器”（Hypertext Processor），这意味着它应该输出 Web 可读的信息，而不是系统级任务。但你可以使用\
  \ Python 开发一个实际上能够理解 PHP 语言的 Web 服务器。遗憾的是，这无法反过来让 PHP 学习 Python。\n\nPython 是一个面向对象的程序，而\
  \ PHP 不是。正因如此，可维护性、扩展性甚至可读性都会影响程序的编写方式。\n\n当你观察现有的编程语言时，你会发现它们可以并被用于不同的职业领域，如下：\n\
  \n### 人工智能开发\n这致力于创建 AI 或认知系统，使其能够与人类行为交互并学习它们被设定学习的内容。在这里产生的程序包括电脑游戏中的角色交互、做出决策的程序部分以及可以回复发送者的聊天框。\n\
  \n### 应用与程序开发\n这些涉及你每天与之交互的程序。你用来查看喜爱的网页的浏览器浏览器程序，以及允许你在 Kindle 上浏览此类电子书的应用程序，都是这种方式制作的程序示例。\n\
  \n### 数据库开发\n这言而易懂。你创建并维护小型数据库，存储大量的数字信息供人们查找和使用。这些数据库对于网站来说非常重要，以便它们可以编译信息。\n\n\
  ### 游戏开发\n这同样言而易懂。电脑游戏和其他娱乐软件可以用 Java 等语言程序来编写。你在网上看到的 Flash 游戏使用的是完全相同的脚本。\n\n\
  ### 计算机驱动程序或任何硬件开发\n这些是侧重于思维支持设备功能的应用程序。\n\n### 互联网和网页创建\n这是互联网的命脉。没有开发者，就没有网页；没有网页，就没有互联网。\n\
  \n### 脚本开发\n如何制作脚本的知识将造福任何公司的生产力。\n\n正如你看到的，Python 在我们日常生活的不同方面非常有帮助。我们每天都在使用由 Python\
  \ 编写的东西，甚至没有意识到这一点。Python 字面上帮助维持着我们生活的运行，因为如果没有它，我们就没有那些构成我们用于在线银行、娱乐甚至使用电脑等任务的各种程序的易读代码。\n\
  \n你将关于 Python 学到的最令人惊讶的一点是，它是一种解释型且交互式的编程语言。解释型仅意味着它在执行之前不需要编译，但仍然需要一个解释器来修改脚本。Python\
  \ 还是一个面向对象的编码语言，使得同时交互甚至执行多个程序成为可能。\n\nPython 的另一个优点是，它是目前创建的最简单且最终最易于用户的编程语言。它不像某些其他计算机程序那样设计得非常丑陋，而是被设定为看起来很漂亮。程序是明确的而不是模糊的，即使你没有任何\
  \ Python 技能，也容易阅读。然而，不要低估你可以随时轻松地与 Python 一工作。它仍然是一种设计用于创建复杂程序和网站的编程语言。但是，如果你投入时间、耐心和练习，并对你正在构建的代码保持勤奋，那么在你掌握门道后，使用它对你来说将变得简单。\n\
  \n当你初开始学习如何编码时，你可能想考虑找一个免费且直观的程序供你在学习时练习。该程序将在尽可能简单的情况下蓬发展，你甚至可以制作几个快捷命令。\n\n例如，如果你想输入\
  \ `Enumerate` 的命令，它将向列表返回一个枚举对象，代码看起来像这样：\n\n```python\ni = 0\nfor item in iterable:\n\
  print i, item\ni += 1\n```\n\n另一种编码选项如下：\n\n```python\nfor i, item in enumerate(iterable):\n\
  print i, item\n```\n\n此外，`Emulate` 甚至可以接受第二个参数，如下：\n\n```python\n>>> list(enumerate(‘abc’))\n\
  [(0, ‘a’), (1, ‘b’), (2, ‘c’)]\n>>> list(enumerate(‘abc’, 1))\n[(1, ‘a’), (2, ‘b’),\
  \ (3, ‘c’)]\n```\n\n因为 Python 易于使用，学习如何使用它也很容易。Python 的整体结构对于编程新手来说是可以掌握的，而且其运行方式非常清晰。由于\
  \ Python 运行在高级语言上，字符串以清晰直观的语法组合在一起，只有少数命令。\n\n当你学习如何掌握 Python 时，你会开始发现你将拥有编写更复杂脚本的知识，这些脚本通常需要别人花费几分钟到几小时来编写。Python\
  \ 使用的脚本语言让编程变体变得快速容易。这样，你就能编写简化日常工作的脚本。因此，Python 是首选的程序。\n\n易读性并不重要，但当你寻找脚本语言时，它是一项巨大的资产。例如，如果你使用\
  \ Perl 编码，代码最后看起来可能非常像象形文字。但 Python 会解密代码，让你更有可能记住你写的源代码的作用。\n\nPython 拥有一套广泛的模块，在你设计自己的源代码时，它可以帮助你可能需要的任何事情。缺点是，你需要确保并做到详尽，才能完全理解更复杂模块的细节。\n\
  \nPython 用户最喜欢的这个程序的第一点是，它是为了跨平台使用而设计的。这使其非常有用，因为在处理源代码时有时会使用多个操作系统。Python 也可以运行任何你需要它运行的机器上。因此，你几乎可以在所在的任何地方运行你创建的任何脚本。\n\
  \nPython 还可以跨平台，如 GUIs 或 Qt。这导致你创建的任何 GUI 都不需要每次被迫切换到新机器时就对源代码进行重新调整。\n\n## 第 2\
  \ 章\n\n![logo](img/00003.jpeg)\n\n## 安装 Python\n\n要使用 Python，你需要将其下载到你的电脑上。下载 Python\
  \ 非常简单，你可以去 Python 网站直接在那里下载最新版本！\n\n一旦你找到了下载页面，你就需要找到想要下载的软件。它很可能是目前存在的最新版本的 Python，但你也有下载旧版本\
  \ Python 的选项。\n\n\n\n\n点击你想要版本后，你将被重定向到显示该版本描述的页面，其中将包含该版本的特性和更新。如果你是一个会阅读描述的人，那么你可以在下载的同时阅读它们。\n\
  \n一直移动到页面底部，选择标有“下载”的链接。从这里，你将进入另一个页面，可以在那里选择你当前正在使用的操作系统。请确保你选择了正确的操作系统，以便程序能够正确下载。某些库在程序的某个版本中，无法在其他操作系统上运行。\n\
  \n选择好操作系统后，现在将询问你是否想要运行该程序。你需要在屏幕上显示的对话框中选择“运行”。\n\n在 `Python` 的安装设置中，你将可以选择为计算机上的所有用户下载程序，或仅为单个用户下载。你可能会选择为所有用户安装，因为你很可能是在个人电脑或工作电脑上安装它，但如果你把它放在与配偶或孩子共享的电脑上，你可能会将其放在单个账户下，以免跨所有账户安装。\n\
  \n`Python` 会创建自己的目录，但如果你想将其安装在另一个目录中，将需要设置所需的安装目录。向下移动并将 `Python.exe` 添加到 `path`\
  \ 中。你想要点击 `x` 并将其安装在硬盘上。现在点击“下一步”。\n\n安装时会打开另一个窗口，`pip` 包也会被并安装。`Pip` 允许你安装其他可以在\
  \ `Python` 中使用的包。\n\n一旦安装过程完成，你将选择“完成”。现在你的电脑上终于有了 `Python`！\n\n# 第 3 章\n\n![logo](img/00003.jpeg)\n\
  \n## Python 中的数据类型\n\n数据类型被称为你放在 `Python` 中的值，而值的数据类型将决定程序如何使用该值。将数据类型看作对象是最好的方法，而对象反过来会被识别为属于该值的类型，以便你作为用户知道应该将其放在哪里。\n\
  \n`Python` 与许多编程语言一样，提供了多种数据类型，你可以用它们对程序代码实现你的操作。如果你对其他语言更熟悉并需要它们来实现你的目标，`Python`\
  \ 甚至提供了用其他语言编写的扩展模块。你的数据类型所属的语言最终将定义该数据类型。\n\n当你处理数据类型时，你将使用 `type()` 函数来确定变量的类型。有几种数据类型具有改变值的能力，这些被称为可变数据类型。其他无法更改的被称为不可变类型。\n\
  \n### 数字\n\n通常，数字会通过数字字面量创建。遗憾的是，一旦你将数字放入 `Python`，就无法更改它了。对于数字，你有三种不同的类型可以使用。数字类型是：整数、复数和浮点数。\n\
  \n整数是既是负又是正且缺少小数部分的数字。浮点数也可以是正或负的，但它们具有整数不具备的小数部分。你还有如 `Booleans` 这样的内容，它们是可以与整数一起使用的子类型。\n\
  \n复数更多用于工程领域。复数的形式为 `a + bi`。`b` 旁的 `I` 代表虚数，因为复数不仅包含实数，还包含虚数。`Python` 允许你使用复数，只要你记住存在两种数字。你可以使用如\
  \ `real + imagJ` 或 `real + imagj` 等函数。`Python` 还内置了一个方法，允许你使用 `x,y` 表示复数。\n\n###\
  \ 字符串\n\n字符串是对象的组合，就像其他所有内容一样从左到右读取。在编写序列时，你要么用一组单引号开头和结束，要么用一组双引号。就像数字一样，字符串是不可变的。\n\
  \n字符串引号（无论是单引号还是双引号）可以互换，因为它们是相同的。引号也可以用在外部是双引号的字符串内部，反之亦然。\n\n这看起来可能有点复杂，但本质上意味着你可以输入类似这样的内容：\n\
  \n“this is your ‘name’ and birthday” 或 ‘this is your “name” and birthday.’\n\n无论引号在哪里或是什么引号，`Python`\
  \ 都会以完全相同的方式为这两个字符串打印相同的内容。但你需要确保不要在字符串的开头放置单引号而在字符串末尾放置双引号，否则你将收到来自 `Python` 的错误代码。\n\
  \n字符串使用特殊字符，如反斜杠。反斜杠意味着你正在向字符串中引入一个特殊的字符。\n\n单个字符串如下：\n\n- `\\n` 换行\n- `\\t` 水平制符\n\
  - `\\\\` 反斜杠\n- `\\’` 单引号\n- `\\”` 双引号\n\n你可以通过索引访问字符串的字符和元素。索引从左侧的 `0` 开始，右侧为 `–1`。\n\
  \n输入 `Python Tutorial`，你就可以在字符串中放置项目。从左侧，你会有所有的偶数，但从右侧，你会有所有的负数。与数字从左到右移动不同，你从右侧从一个较大的负数开始。\n\
  \n创建字符串后，你应该双重检查它是否完全符合你的要求，因为一旦字符串被创建，你就无法更改字符串内表示的任何字符。\n\n运算符 `in` 将检查某个字符或子字符串是否位于字符串内。在这种情况下，你将获得一个返回的\
  \ `Boolean` 值。\n\n为了从字符串中截取一个子字符串，你将用冒号分隔两个索引。切片 `2:6` 意味着第二、第三、第四和第五位置的所有字符都将被切片。`6`\
  \ 不包含在切取范围内。如果你需要，也可以使用负索引进行切片。\n\n### 元组\n\n用逗号分隔并包含在括号中的值将是元组。元组在你创建后无法更改，但它们具有内部包含不同数据类型的选项。\n\
  \n通过在你的 `Python` 代码中放入 `(empty_tupl)` 可以创建空元组。你放在元组中的任何元素都必须像你在 `Python` 中使用的任何序列一样进行索引。然而，与字符串一样，元组的索引从零开始。元组的索引也可以被切片。被切片的元组会创建新的元组，而保持原始元组不变。\n\
  \n如果你想创建一个新元组，将使用加号，为了重复元组，将使用星号 `*`。\n\n### 列表\n\n\n\n列表（Lists）类似于元组（tuples），不同之处它们使用方括号而不是圆括号。放置在列表中的项不需要是相同类型。在创建列表时，你将使用与向\
  \ Python 存入值时相同的函数；然而，区别在于元素必须是一组括号。`print(my_list)` 函数将从零开始创建列表。\n\n与我们讨论过的其他数据类型一样，列表的索引从零开始，并且能够被切片（sliced）。列表索引最大的区别在于，它们被赋予了与颜色（如黑、绿、红、蓝）相关的名称。如果你在索引工作范围之外的索引处放置了一个值，你将收到一条错误消息。\n\
  \n如所述，列表索引可以被切片，语法如下：\n\n```\nsliced_list =List_Name[startIndex:endIndex]\n```\n\
  \n列表的伟大之处在于它是可可变的（mutable），所以如果你想更改其中的值，你可以选择这样做。加号 `+` 会创建新列表，但该列表将至少与另外两个列表连接。星号\
  \ `*` 会再次重复你的列表，这样你就不需要复制和粘贴了。\n\n### 集合 (Sets)\n在创建集合时，你正在创建一个无序但唯一的元素集合。你主要在集合集合理论时集合。集合理论是一种支持的数学运算，如差集、并集、对称差甚至是交集。当你消除代码中出现的任何重复项时，你也会使用集合。\n\
  \n### 字典 (Dictionaries)\nPython 中的字典是一个容器，它包含一个无序的项集合，类似于列表。然而，字典中的对象被大括号（`{}`）围绕。字典用逗号分隔不同的基本项和键值对。值（values）和键（keys）将是\
  \ Python 数据类型。\n\n你通过键访问的每个值或对象在字典中都是唯一的。用于索引的键是不可变的（immutable）。然而，你可以通过空大括号创建一个空字典。\n\
  \n### None\n在使用 Python 时你需要知道的最后一个数据值是 `none` 的数据值。这个值是一个单值类型，因为该值内有一个对象。对象将通过 Python\
