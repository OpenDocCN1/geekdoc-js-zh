  \ into the function.”\n    Print list\n    Return\n```\n\n函数可以根据它们使用的参数进行调用。\n\n\
  1. 变长参数\n2. 必需参数\n3. 默认参数\n4. 关键字参数\n\n必需参数将按照它们编写的顺序通过函数。\n\n### 示例\n\n```python\n\
  #!/usr / bin / Python\n\n#define your function here\n\nDef printus ( list ) :\n\
  \    “the list will be printed in this function.”\n    Print list\n    Return ;\n\
  \n#此时此时你将能够调用 printus 函数。\n\nPrintus()\n```\n\n关键字参数与你调用函数的方式有关。关键字参数位于函数调用中，由调用者和参数名进行标识。\n\
  \n关键字参数允许跳过某些参数，或以不同于显示顺序顺序放置参数，这是因为解释器将使用你设置的关键字来将值匹配到正确的参数。\n\n### 示例\n\n```python\n\
