  ```\n\n默认参数是在当调用函数的特定参数时，如果没有提供其他值，则取默认值的参数。\n\n### 示例\n\n```python\n#!/usr / bin\
  \ / Python\n\n#your definition here\n\nDef printdata (address , number = 5 ):\n\
