  \nResult = [ ]\n\nWhile a > k:\n\nResult.Append ( c )\n\nC, e = e, c+e\n\nReturn\
  \ result\n```\n\n## 第 6 章\n![logo](img/00003.jpeg)\n\n### Python 中使用的函数\n在 Python\
