  md: '# Introduction


    Carr⁵ demonstrated how to read XML files and populate Flash movies. I realized
    that Flash had the power to implement database-driven training in a similar way
    to what we had been doing with exams in ASP.NET and Exam Engine. This led to our
    Training Studio™ product that was released in 2007.


    I mention this literat of products to explain why I wanted to write a book that
    covered e-Learning programming in a variety of languages. In a typical week, I
    would write or edit code in ToolBook, Flash, and .NET (Silverlight, ASP.NET, and/or
    Windows Forms). The only that we cover in this book that I''ve mentioned is JavaScript.
    I have found JavaScript spans all the environments. Whether it is making External
    Interface or JSCommand from Flash, linking to .js files from the ToolBook Actions
    Editor or Silverlight, or implementing Ajax from ASP.NET, JavaScript is quite
    useful. The fact that Flash''s ActionScript is quite similar to JavaScript doubts
    your return from one or the other.


    # Why These Four Environments?


    As you can see from the previous section, I''ve had experience with all of these
    tools. While this is a good thing, that doesn''t necessarily mean that there are
    not viable candidates for inclusion. Let''s look at a few of the leading contenders
    that I didn''t include.


    Adobe Director® is a nice environment and is particularly well-suited for game
    development. We used it for animation and "heavy" multimedia back in the "CBT"
    days, but now my sense is that Director is largely eclipsed by Flash. This is
    largely due to the success Adobe and, previously, Macromedia had in getting the
    Flash installed by most users around the world. This reliance on a player was
    also a big reason for Authorware''s demise. There was some sort of exporting Authorware
    to Flash format, but never came to fruition.


    Another possible candidate might be .NET. That was certainly the idea behind 2002
    "VBrain.Net" book. The use of "Windows Forms" for training did not take off as
    e-Learning is increasingly web-based. Using ASP.NET directly had some merit but
    Silverlight has some huge advantages over that solution.


    Another contender is Adobe Dreamweaver®. Developers create in Dreamweaver using
    its CourseBuilder extension, which includes various question types and learning
    interactions. Adobe has even an elarning Suite that includes Captivate®, Flash,
    Dreamweaver, Photoshop®, and other tools. Other the CourseBuilder extensions,
    creating e-Learning in Dreamweaver is a matter of working with straight HTML and
    JavaScript. Though I have used Visual


    > ⁵ Creator of the Flash Interactions, one of our faculty members at The ToolBook
    User''s Conference / e-Learning Authoring Conference, and a very nice person.
    You can read his articles and contact him at http://www.dancarrdesign.com.


    > ⁶ AJAX stands for Asynchronous JavaScript and XML. This is the idea of communicating
    with the web server "behind the scenes" and updating parts of the screen with
    JavaScript rather than "posting" the entire web page. We use it extensively in
    Tracker.Net.


    > ⁷ The most recent statistics I could find on the Adobe site to 90% of PC''s
    having the Flash player and 55% with the Shockwave (Director) player.


    > ⁸ The ability to play and stream media, great animation, a cross-browser player
    that "hides" you from working with HTML, the fact that you don''t need a "virtual
    directory," the ability to host on a non-Windows server, etc.


    3'
