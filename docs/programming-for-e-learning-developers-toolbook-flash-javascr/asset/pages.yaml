  md: '# Programming for e-Learning Developers


    # Audience Level


    While some programming expertise will be helpful for some of the more advanced
    examples, we do not assume that you are a programmer. Anyone who is willing to
    learn and feels at home in front of a keyboard is welcome.


    # Sample Applications


    There are a number of sample applications included with this book. You can download
    them from the Platte Canyon web site at http://www.plattecanyon.com/programmingbook.aspx.
    I encourage you to download the programs and explore the concepts yourself. You
    will need a copy of this book in hand to download the sample applications.


    # A Bit of Background


    What makes me qualified to write a book like this? From a degree standpoint, not
    a lot. I did a bit of programming at the Air Force Academy, but my major was Electrical
    Engineering. From there, I studied economics for two years at the London School
    of Economics. The e-Learning and programming started when I left the Air Force
    in 1992 and started developing CBT in ToolBox a year later. I quickly gravitated
    toward creating reusable code for, "tools" to automate repetitive tasks, and minor-level
    management systems to keep track of student status. As most of our contracts were
    fixed price in those days, there was a big emphasis (and bonuses to be made) for
    doing things quickly and efficiently. After finding Platte Canyon in 1996 with
    my friend Chris Bell, I set to working our first commercial software product,
    the Plug-In Pro for ToolBox. We got a booth at the Toolbox Developer''s Conference
    that year had copies on floppy disk!


    From there, we made a gradual transition from a consulting company to an off-the-shelf
    product company. I had written the occasional Lingo for Director and an "autourn"
    program in Delphi*, but our first major foray outside Toolkit was in 1998, when
    I wrote Administrator and Reporter programs in Visual Basic 6 for our TB Tracker™
    Learning Management System (LMS). I started to get into .NET Net: Creating Computer
    and Web Training with Visual Basic*. NET in 2002. The premise of this book was
    that developers could use VB and Visual Studio to create training, provided there
    were some specific "training" controls available. However, despite the various
    "VBTrain" controls that we released (as Question, LMS, Web, and Shape), the market
    didn''t take to Visual Studio for training development! The good news was that
    product development process helped me gain the expertise to write a web-based
    LMS that customers had been asking for. Tracker.Net™ is now our flagship product.
    We released the first version in late 2002 and are now in version 4. We also noticed
    that the bigger market was in creating tools for non-programmers. We packaged
    the Question and other controls into a web-based application, wrote some .NET
    editors for editing the database and setting properties, and Exam Engine™ was
    born in late 2003. With the advent of Silverlight, I rewrote Exam Engine in 2009
    using that exciting technology. Silverlight is a bit similar to Flash in that
    both products have their own "player" inside the browser. I had been impressed
    with Flash''s capabilities for some time but had not done much with it. Then I
    went to a conference session in late 2005 Dan'
