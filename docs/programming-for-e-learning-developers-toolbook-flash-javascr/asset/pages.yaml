  md: '# Building a Glossary


    A common e-Learning requirement is to be able to click on a hyperlink and display
    a popup display of the corresponding definition. We’ll implement a simple version
    of this capability in chapter¹. We’ll build on techniques we learned in the Hyperlinking
    to a URL chapter in order to create the hyperlinks. To make things interesting
    and to help you create a custom "data store" of the glossary names and definitions
    for each environment, we’ll add a GetGlossaryDefinition method to our ASP.NET
    service and call that to retrieve the actual definition.


    # ASP.NET Web Service


    We first created this service in the Sending email chapter. To add a glossary
    lookup capability, we first need to decide how to store the glossary entries.
    A good choice is a database. We’ll use an Access database adapted from our Training
    Studio product and locate it in the "App_Data" directory of our web site. A good
    choice since ASP.NET will prevent anything in this directory from being downloaded².
    We’ll use a simple structure as shown in Figure 115 where we look up the value
    based on the GlossaryName and store it in the GlossaryDefinition column.


    ![](img/489f8caeddae410535f57c4dfc328dfc_266_0.png)


    Figure 115. Access Database for Storing our Glossary Information.


    We’ll include a stored query ReadGlossaryEntries that we’ll use to load the entire
