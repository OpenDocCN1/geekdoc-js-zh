    The first part of the script is the redirection code. In each case, the methods
    use the animalName parameter and use to build a page object object. It then calls
    method of the page. For example, the DrawAnimal function calls the DrawSelf method
    of the page. As we will see shortly, the "Cat" and "Dog" pages will handle this
    case. The "Animal" page will not notice and hence it will be forwarded back to
    this script where there is a "base class" implementation. Similarly, the GetSound
    handler references the appropriate page and then uses ASYM_MessageBox to display
    the value of the CommunicationSound property of that page. If there is no property
    defined (via a "to" handler as described below), then the call forwards once again
    to this base class implementation.


    The second part of the script contains both base class implementations. DrawSelf
    returns an "animal" bitmap resource while DrawHome returns an "earth" bitmap resource.
    The properties are implemented via a to syntax for "reading" the property and
    a to set syntax for "writing" the property. The private "variables" holding the
    data are user properties of the book. Notice how we initialize them as needed
    to our default value if they are not already set.


