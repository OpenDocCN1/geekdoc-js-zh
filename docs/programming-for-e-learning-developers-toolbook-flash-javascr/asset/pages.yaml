  md: '# Introduction to Object-Oriented Programming


    It is not important to understand Object-Oriented Programming fully to effectively
    program-learning applications. However, getting least a handle on its key aspects
    will make it easier to understand the Flash and Silverlight documentation and
    help you create elegant¹ applications.


    # Overview


    Having a bit of engineering or "hobbyist" background can be helpful to understanding
    OOP. I find it helpful to relate it to my days back in electrical engineering
    labs where we had built various circuits and electrical devices. As you probably
    know, most electrical devices (including your computer) are built from one or
    more integrated circuits (chips). Each of these chips has requirements for each
    of its "pins." If we are building a radio, we might use a chip that has input
    voltage on one pin for power, another an output to a speaker. We know how to configure
    this chip because it comes with a specification that defines the voltage and resistance
    values, pin numbers, and we don''t know and don''t care how the chip works internally
    as long as it performs to its specification. We could replace the chip with a
    new model (maybe taking up less space) with confidence, even if the new version
    implements a whole new radio design. This is the idea of OOP -- we would want
    to build our software out of discrete objects that operate like the chip in this
    example. An object''s interface consists of its methods, properties, and events.
    Its internal implementation is not your concern.


    To drive this point home, let''s look at an example. Let''s suppose that we want
    to build a Home Theater Audio circuit². We might go to the Texas Instruments web
    site and type "Home Theater Audio" in the search field. We''d get a list of hits,
    including the block diagram shown in Figure 159. All the dark blocks represent
    chips that we could buy from Texas Instruments. If we search for TPS7633, we''ll
    find that it is a "voltage regulator" (Figure 158). A fairly simple chip, it has
    five pins: input voltage (IN), ground (GND), enable input (EN) when it is on and
    off, no connection (NC) or feedback voltage (FC), and regulated output voltage
    (OUT). The specification gives further details as to acceptable limits and so
    forth. We could then purchase this and the other chips, put them on a circuit
    board, make the proper connections between them, buy speakers and some other components,
    and end up with a home theater system. Without having the slightest clue as to
    how any of the chips work internally.


    | IN | 1 | OUT |

    |---|---|---|

    | GND | 2 | |

    | EN | 3 | 4 | NC/FB |


    Figure 158. TPS76333 Pin Assignments


    > ¹ There''s that description again! Note that some of this comes from my VBrain.Net
    book as I liked some of the analogies and examples that I used in that book.


    > ² If you think of the concepts in this book are wild, you might try reading
    out how chips, integrated circuits, and diodes work. You start getting into terms
    like p-n junctions, holes, free electrons, and covalent bonds!


    > ³ Of course, most of us would go to our favorite electronics store, but then
    we wouldn''t be able to see such a good example of objects! This is likely an
    obsolete design I first got for my VBrain.Net book, but the point is still there.


    307'
