    # # Classes and Instances


    You can think of a class as the blueprint for building an object. In our chip
    example, the class is the design of the various circuits, diodes, etc. that make
    up the chip as well as its specifications. When the fabrication plant starts rolling
    out individual chips, these are called instances. Just as you use the designs
    to listen to the radio, you typically cannot access the methods, properties, and
    events of a class. Instead, you must first create an instance of a class.^4


    Virtually every object that you create in an OOP environment like Silverlight
    is a class. This includes labels, buttons, forms, database connections, and more.^5
    When you drag a Button from the Blend library or a Button component from the Flats
    window, you are creating an instance of that class. Very importantly, Button instance
    has independent properties from another Button on the same page, just as two voltage
    regulator chips on the same circuit board have different connections and settings.
    Let''s say that we have simplified a class that can ProFootballTeams. This class
    might have properties like NumberOfWins, NumberOfLosses, HostCity, and Nickname.
    It might have methods such as CalculateWinningPercentage, and GetWeatherForecast.
    The class might generate an event called WeWonAGame each time the NumberOfWins
    is incremented. Let''s look at what the Denver Broncos" instance of this class
    might look like (Table 1):


    > ^4 There are a few exceptions to this in class and flashy. .NET since some classes
    (String, Math, Color, etc.) are defined as shared classes. This means that you
    can use them without creating an instance if you''d like.


    > ^5 Notice that not all classes have a user interface. Many of them are abstract
    entities like employees, students, etc.'
