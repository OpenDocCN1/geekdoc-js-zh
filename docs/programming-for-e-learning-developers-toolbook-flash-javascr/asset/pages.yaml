    \ we can pass the reference\n(infoField) and the character denoting the hyperlinks\
    \ (). You can refer to the discussion below Listing 40 for\na complete discussion\
    \ of the logic. The only difference here is rather than a NavigateUrl of thenURL\
    \ for the hyperlink, we use this syntax to associate its Click event with our\
    \ glossaryHandler method:\nAddHandler Click, AddressOf glossaryHandler. This is\
    \ identical functionality to addEventListener\nFlash ActionScript.\n\nWe handle\
    \ the MouseEvent for each of our HyperlinkButtons to get our hands on the\ncurrent\
    \ mode coordinates. Notice how we do this with the GetPosition method of our MouseEventArgs\n\
    object. We get the coordinates relative to Me.LayoutRoot so that the position\
