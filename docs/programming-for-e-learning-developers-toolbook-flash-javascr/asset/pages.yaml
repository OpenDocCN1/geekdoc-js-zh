  md: "# Constructors\n\nA constructor is a special method that is called when an\
    \ object is created. We saw an example of a constructor in Figure 31. In Visual\
    \ Basic.NET, an object's constructor is a subroutine named New. In ActionScript,\
    \ it is a function with the same name as the class. This subroutine or function\
    \ is implemented by the object's class level. The constructor subroutine does\
    \ any required initialization needed by the class. For example, we might want\
    \ to allow developers to create a ProTeam instance with or without host city.\
    \ We therefore provide overloaded constructor functions (within the class code),\
    \ which allow instances of the object to be created with or without a host city.\
    \ See Listing 98 for an example..\n\nPublic Class ProSportsTeams\n\n```\nPrivate\
    \ c_hostCity As String\n\nPublic Sub New()\n    c_hostCity = \"<Needs Value>\"\
    \nEnd Sub\n\nPublic Sub New(ByVal hostCityParam As String)\n    c_hostCity = hostCityParam\n\
    End Sub\n```\n\nProperties and Methods Implemented Here\n\nEnd Class\n\n' Following\
    \ are both valid to create the object\nPrivate teamID As New ProSportsTeams()\n\
    Private teamID As New ProSportsTeams(\"Denver\")\n\nListing 98. Sample Constructor\
    \ Methods\n\nThe c_hostCity variable is private because it holds the value of\
    \ the host city internally but we'd only allow access to the value via a property.\
    \ The first constructor method just initializes this value to \"<Needs Value>.\"\
    \ The second one initializes the variable to parameter passed in at the time the\
    \ object is created. Notice how the developer can create the teamID object either\
    \ or without the host city value. This is an example of overloading at work. .NET\
    \ calls the first constructor function when there is no host city and the second\
    \ when there is a host city.\n\n# Variables, Access Modifiers, and Scope\n\nKeeping\
