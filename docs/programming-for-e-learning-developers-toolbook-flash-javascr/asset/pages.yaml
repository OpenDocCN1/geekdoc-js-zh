    avoid duplicating the files unnecessarily, we put the files into one file. After
    calling the ASYM_Parse function to get the directory of the current .tb file,
    we use the offset function to find where the current directory (ToolBook) stands.
    We then grab the rest of the path from that directory.


    Returning to the enterPage handler, we need to fill up the two list boxes. We
    create a common listBox handler and pass it to the list box, the path where the
    appropriate files are located, and optionally, the list of extensions to include.
    We need this list parameter to exclude .flv files, which cannot be played in ToolBook
    without a .swf file. Optional parameters to declare some local variables and then
    initialize the includedExtensions when * is blank. Those of you familiar with
    DOS might recognize that symbol as a wildcard and that the getFileOnlyList function
    uses that and the ? wildcard. We clear the text of the list box so that we not
    add the file names again if the user previously visited the page. We then use
    a loop to go through each extension in turn. We now take advantage of the fact
    that we made the includedExtensions parameter a comma-delimited list. This allows
    us to pop each extension off the "stack." This gets the one we need and removes
    it from the list (so that the loop will fail to evaluate once all extensions are
    gone). We then build the filePath variable that we get something like *.mp or
    *. We pass this variable to the getFileOnlyList function with a parameter that
    says we do not limit the attributes of the file we are looking for and an "N"
    to tell that we want to sort by file name. This function returns each file name
    on its own line. If the list box already has we add a blank line (CRLF) so that
    this new scene gets right after the last one.


