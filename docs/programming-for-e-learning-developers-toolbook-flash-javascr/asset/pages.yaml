    Listing 88. Calculator Implementation Code - ToolBook Oops


    We start by initializing our calculators on the enterPage. We''ll have a lastOperator
    variable that we will keep track of what type of operation we are performing.
    Similarly, we''ll have a lastOperatorValue that will keep track of the last number
    the user typed in. We initialize it to -9999 to indicate it has not been defined.
    Notice how we need to declare it ref so that it can handle decimals and negative
    numbers. We need lastOperatorValue to store what the user typed in before they
    press +, etc. For example, she might type 78 and then click the “+". We need to
    store 78 and then clear the field for her to type in the number. We also have
    a Boolean (logical) startOver to indicate that we are beginning from scratch.
    Fatially, we clear our “total”.


    In the button handler, we define these same global variables as two local variables.
    We do our custom check of object target to make sure that we are dealing with
    an actual We set our actualVal variable to be 2 name of target. From this, we
    can see our strategy for naming the buttons. By numeric values (0 – 9) are named
    as “button 0”, “button 1”, etc. The rest of the buttons are named by function:
    “Button Add,” “Button Equals,” “Button Point,” etc. We do not for conditions statement.
    As we have seen, conditions is similar to a switch (ActionScript or JavaScript)
    or Select Case (Visual Basic). It is more flexible than those, since you have
    to use the same condition in each “branch”. We do that in the first set of code.
    When isnumber(actionVal) = true or when actionVal = Point, we send the UpdateTotal
    message, passing in actionVal as a parameter.


    Within UpdateTotal, we convert the word “Point” to the decimal point symbol?.
    We check our startOver variable (which will go to true when the user clicks on
    an operator “+”). We do some logic to ensure there is not already a decimal point
    in the field and otherwise concatenate the entry⁰ our updatedValue variable. We
    do a final check to make sure the updatedValue is a number and then update the
    “total”


    Returning to the buttonHandler, our next set of conditions is when actionVal is
    Add, Divide, Multiply, or Subtract. In this case, we need to store the current
    value of our “total” field (assuming it is a number and the user hasn''t gotten
