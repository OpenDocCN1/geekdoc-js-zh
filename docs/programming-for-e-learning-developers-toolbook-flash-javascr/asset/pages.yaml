  md: '# Setting a Property


    Now that we made it through the gauntlet of handling a click event in each of
    our environments, we''ll tackle setting a property. We already had a preview of
    properties in the previous section when we set the Text property in our Flash
    and Silverlight examples. But we''ll now go into more detail. Much of eLearning
    development involves the setting of properties, or attributes. We set the desired
    page or size, the color of our buttons and text, the desired font, and much more.
    In programming, we can even create our own properties as a mechanism for storing
    desired settings. In each task of our environments will be to set a button when
    it is clicked and ensure it is reset to its original color when the user returns
    to the page or frame.


    # ToolBook – OpenScript


    Although our primary focus is in setting properties via code, it is instructive
    to look at the built-in interface for setting properties. In ToolBook, you can
    select the object and choose Properties from the


    ![](img/489f8caeddae410535f57c4dfc328dfc_44_0.png)


    Figure 21. ToolBook Properties Sheet.


    21'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Programming for e-Learning Developers


    Object menu, the right-click menu, the toolbar. The resulting Properties Sheet
    for "button4" is shown in Figure 21.


    Our task will be to change the color of this button to green in response to the
    activeButton and then set it back to the original color if the user returns to
    the page. The code will be similar to what we did back in Listing 1, but instead
    of showing a message box, we will change the fillColor property³. When we check
    that property in the help, we''ll see that we can use a "named" color like green
    or a numeric representation of the color². takes care of the first part of the
    task. For the second, we need to know that native ToolBook also has an enter event
    that fires when the user gets to the page. OpenScript has a unique concept of
    a "notify" handler where an object like a button can ask to be notified of an
    event (and hence so its own response to the event)⁴. We could choose either notifyBefore
    notifyAfter in this case. The resulting code is shown in Listing 8.


    ```

    to handle buttonClick

    forward

    fillColor of self = green

    end buttonClick

    ```


    ```

    notifyBefore enterPage

    fillColor of self = white

    end enterPage

    ```


    Listing 8. OpenScript Code for Setting the Color Property and Resetting it on
    EnterPage.


    # ToolBook – Actions Editor


    Since we are still inside ToolBook, the interface for changing properties is also
    shown in Figure 21. But the method of setting the color of a button and resetting
    it is different. We select a Set Property action from the Action Palette and then
    select rgbFill from the list of available properties as shown in Figure 22.


    ¹ We''ll need to find this name in the online help since the OpenScript editor
    does not offer any kind of IntelliSense. You can place your cursor on a word and
