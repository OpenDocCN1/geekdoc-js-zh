    # Attend The ToolBook® User''s Conference / e-Learning Authoring Conference


    This conference is filled with technical sessions by expert developers from Platte
    Canyon, SumTotal Systems (makers of ToolBook), and other leading e-Learning development
    communities around the world.


    TBCON focuses on the "how to" aspects of developing state-of-the-art training
    applications with ToolBook, Flash, JavaScript, and Silverlight.


    The unique conference structure allows you to work with presenters in small groups
    and attend all sessions you wish to see.


