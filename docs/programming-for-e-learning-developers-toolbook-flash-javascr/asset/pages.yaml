  md: '# Introduction


    This book takes common e-Learning programming tasks and shows how to accomplish
    them in various tools and languages. It comes from sessions and workshops I have
    given over the years that show sometimes a little bit of programming can go a
    long way. This is true both in making your Learning² more interesting through
    the use of interactions and in reducing the time to create the training in the
    first place. We will start with the basics of programming with an eye on what
    the instructional designers or subject-matter experts might need to create interactive
    training in their tool of choice. Beyond, we''ll dig into more advanced topics
    connecting to a database, reading an XML file, sending email, incorporating drag
    & drop, making SCORM³ calls. While we cannot cover all the tasks that you will
    encounter as you build your own e-Learning, hopefully the examples in this book
    will give you some skills and methodologies to help you tackle them on.


    One of the realities of creating e-Learning is that most of us don''t stick to
    a single tooling. Way back in the CBT days, the big decision was to choose Authorware,
    Toolbook, IconAuthor, or Quest. Now the only one of those tools is still around
    is ToolBook. But taking the place of those is Adobe® Flash (including the many
    authoring tools to export to Flash format) and various HTML editors. Making the
    HTML interactive requires JavaScript. You can also call JavaScript from the ToolBook
    Actions and the Flash External Interface class. Even newer to the game is Microsoft®
    Silverlight¹. I anticipate this as widespread in e-Learning as Flash. Though not
    in the list of environments, we will also look at ASP.NET as our environment for
    the “server” side of things, including save user comments, sending emails, retrieving
    XML over the web, and more. The fact that Silverlight and ASP.NET both use Visual
    Basic as their programming language means that the syntax is quite similar between


    This book is not about which tool is better. We take common e-Learning programming
    tasks and show how to accomplish them in each of the tools and languages. In some
    cases, one tool might have special capabilities in that area. If so, we''ll point
    this out. But I think you''ll find that many of the differences are just in syntax.
    Once you get the terminology and syntax between the different tools, you''ll be
    able to increase your capability while simultaneously reducing your development
    time.


    If that''s not the price of this book, I don''t know what is.


    > ¹ There used to be a name of terms for interactive training, such as online
    learning, Computer-Based Training (CBT), and Web-Based Training (WBT). But e-Learning
    concepts capture the concept of what is now deployed via the web while excluding
    the idea of what I usually call “native” training deployed via CD or local network.
    I''ll try to stick with the term e-Learning in this book.


    > ² The Sharable Courseware Object Reference Model (SCORM) is the U.S. Department
    of Defense’s (DOD’s) Advanced Distributed Learning (ADL) specification. It becomes
    the main standard for communication between a Learning Management System (LMS)
    and e-Learning content. Another part of the specification deals with the packaging
    of your content and the sequencing between individual learners. We''ll talk more
    about SCORM later in this book.


    > ³ I am talking about the mid-1990s. I started using ToolBook 1.5 in early 1993.


    > ⁴ C is main .NET language, but I have found that Visual Basic is easier for
    those of us who are not professional programmers.'
