  md: '# Dynamically Loading Graphics and Media


    Graphics and media are obviously key parts of most e-Learning applications. In
    all the environments we are looking at in the book, it is a pretty simple operation
    to configure graphics, audio, video, or Flash movies when you are in the authoring
    environment. What is more challenging is to do it programmatically, particularly
    if the items are not already embedded within the application. We''ll tackle this
    task in each environment.


    # ToolBook – OpenScript


    As the only pure Windows programming environment we are examining, ToolBook OpenScript
    gives us a few "bells and whistles" that we can throw in. The resulting application
    is shown in Figure 82.


    ![](img/489f8caeddae410535f57c4dfc328dfc_172_0.png)


    Figure 82. Dynamic Graphics and Media Example - ToolBook OpenScript.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Programming for e-Learning Developers


    Our requirements for this example are:


    +   1. Read the list of external graphics from one directory and external media
    (.flv, .mp3, .swf, .wmv) from another. Formats that cannot be played directly
    (.flv for ToolBook and JavaScript, .wmv for Flash, .flv and .swf for Silverlight)
    will be excluded. For environments that cannot read the files directly, we''ll
    skip this step.

    2. Click on the "Load Graphic" to load the graphic dynamically (where possible).

    3. Click the "Load Media" button to load the media in the correct player (Flash
    or Windows Media Player) when both are supported (ToolBook and JavaScript).


    To meet these requirements in OpenScript, we create a "list box" for the graphics
    and another one for the media. We also create a corresponding "Load" button for
    each. As we have seen previously (Figure 38), we''ll use a display to load the
    graphic. But rather than setting the "normal graphic" to a bitmap resource, we''ll
    load the resource first. For the media, we''ll use either the Windows Media Player
    or Flash ActiveX controls. As we have seen, ActiveX is a Windows control that
    allows "container" like Internet Explorer, ToolBook, and PowerPoint to use "servers"
    like to get functionality that might not be built into the container application.
    Using ActiveX means that the control must be installed on the client computer
    when we distribute your e-Learning application¹.


    We''ll look at the programming logic in two steps. Listing 56 shows the code for
    populating the list boxes and initializing the scene.


    to handlePage

    system string basePath


    ```

    forward

    basePath = buildBasePath()

    send populateListBox field "GraphicList", basePath & \

    "externalGraphics"

    send populateListBox field "MediaList", basePath & \

    "externalMedia", "mp3, swf, wmv"

    send moveOff Windows MediaPlayer "WMP1"

    send moveOff ShockwaveFlash "Flash1"

    send moveOff button "imagem"

    endPage

    ```


    to get buildBasePath

    local string basePath

    local dwarf baseLoc


    > ¹This is typically not big of a concern with web-based e-Learning as the user
    is prompted to download the control if is not present. But it can be a problem
    if the user is in a locked-down environment. This need to install the ActiveX
    control is one reason we play "Show Me" videos using the "clip" system in our
    Learning & Mastering ToolBook Instructor product. Our installation makes sure
    that a suitable version of the Flash ActiveX control is present, though, as Flash
    movies cannot be played as clips. We don''t use the clip system here as we want
    to parallel with the other environments.'
