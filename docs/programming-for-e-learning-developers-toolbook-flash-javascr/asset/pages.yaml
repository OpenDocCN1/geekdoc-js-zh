    # Events


    At their simplest, events are things that the user does. When the user clicks
    an object, she generates the Click event. When she goes to the training page,
    she generates the enterPage event (ToolBook), enterFrame event (Flash), onload
    event (JavaScript), or Load event (Silverlight). You can also create your own
    custom events. Returning to our "Question" object, we might want to generate a
    QuestionScored event each time that the question is scored. This would allow the
    developer to create his own response to the event. For example, he might want
    to pop up supplementary information in a window if the score is less than 75%.
    We would need to build this functionality into the general question object, so
    we generate an event that the developer can handle it¹⁰ if he desires. In ToolBook,
    we might do this by sending a custom message (OpenScript) or a user event (Actions
    Editor). ActionScript and Visual Basic can create events. This is probably not
    something you will do often, however.


    # Properties


    As we have earlier in the book, properties are fairly easy to understand. They
    are the characteristics or attributes of the instance of the class. Width, height,
    location, color, etc. are all common properties of objects. Note that all of our
    target environments take care of making our properties persistent, which means
    that they are initialized to a value at runtime that we set them to design time.
    We have also seen how to create properties in ToolBook, Flash, and Silverlight.s


    > ⁹ For example, all .NET objects have a ToString method.


    > ¹⁰ Notice that there is no requirement for the developer to handle the event
    if he doesn''t want to.'
