    **Listing 77. Drag & Drop Implementation Code - Flash.**


    We start with global variables. currentSource will point to the source object
    that is currently being dragged. With our ToolBox implementation, initialPosition
    is the starting location of the source object. We''ll use to return the object
    to its starting point if it is not dropped on the right target. In our initialization
    code, we loop through our source objects and use addEventListener to associate
    its MOUSE_DOWN event with the beginDrag method. We add a MOUSE_UP listener to
    the stage, calling endDrag when the user releases the mouse. We need this to see
    where dragged object is currently located. If it on the right target, we''ll snap
    it into position. If not, we''ll return it to initialPosition.


    The beginDrag method is called when the user clicks on a source object. In, we
    use currentSource and initialPosition global variables. Notice how we use eventId.target
    to get the object that was clicked. Since we want to store the x and y coordinates
    of the current location, we make initialPosition a Point type. We then set its
    x and y based on the same values for currentSource. Finally, we add a stage listener
    for the MOUSE_MOVE event, associating it with moveObject. This will fire rapidly
    as the user moves her mouse.


    Within moveObject, we change the x and y of currentSource to reflect the current
    mouse position. We then call updateAfterEvent to flash redraw the screen.


    When the user releases the mouse button, the endDrag method fires. Since he may
    not clicked on a source first, we need to check if currentSource is null. If not,
    grab its name, a split to get our hands on its number (the naming is "source_1","target_1"
    etc.). We built a based targetName and use this to find the associated target
    MovieClip. We then use a very handy function called hitTestObject. It returns
    true if the object we set as a parameter (currentSource) overlaps or intersects
    with the object (target). If so, the user dropped the source on the right target.
    We then snap it into place by aligning its coordinates and vertically centering
    the source on the target. If not, we return currentSource to its original position.
    Either way, we call removeEventListener so that the MOUSE_MOVE event no longer
    calls moveObject. We then set currentSource to null so that the endDrag logic
    won''t be called until the user starts another operation.


