  md: '# Programming for e-Learning Developers


    The top of the script should be quite familiar by now. We have added a s_PostUrl
    global variable in the other examples. Within the sendEmail function, we use that
    to build our urlString local variable. We next create a URLRequest object, passing
    in urlString. We run into this object previously when we were navigating to particular
    URLs. In this case, this holds the URL of our web service. We then build a new
    object type: ULLoader. As the names implies, it is used to download data (text,
    graphics, etc.) from a URL. We use this to send our information to the web service
    and retrieve the return value. To send our information, we still need another
    object type: URLVariables. We create that type and put it in the email variablesId
    local variable. What is pretty cool about this object is that we can create any
    variables (what we call parameters in other environments) simply with the . symbol.
    So this next line means to create a variable named accessKey with the value of
    the text of the “accessKey” field:

    variablesId.accessKey = accessKey.text;


    We use similar for the rest of our parameters. Notice how we don''t have a formatBody
    function in this case. This is because we can grab the htmlText of our TextArea
    component. This means that we can get the complete HTML (not just <br /> tags
    for hard returns), but that is OK as long as we don''t mind a bit different formatting
    in the email itself. The best way to see this is to look at the variablesId.body
    value in the Flash Debugger as discussed in the “Debugging Your Applications”
    chapter and shown in Figure 142.


    As you can see in Figure 70, the size of the text is quite large by the time it
    is displayed in Outlook. You could write a function to edit the HTML or even get
    the text property of TextArea and use a similar formatBody function as we used
    in ToolBook if you didn''t like the formatting of the resulting email.


    > ² You can inject an entire style sheet into the email. We do this with Exam
    Engine product. It has the ability to send an email with a complete table of the
    question results, including score, what the student answered, the right answer,
    time, etc. To make this look good, the web service creates an HTML table and sets
    assigns classes to the titles, each row (so that the colors alternate), etc. it
    then puts that style within the email itself.'
