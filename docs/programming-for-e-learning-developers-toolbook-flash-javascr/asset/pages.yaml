    ![](img/489f8caeddae410535f57c4dfc328dfc_31_1.png)


    Figure 6. Flash Timeline Showing an Actions Layer.


    Because scripts can only be in the layer and not in the object (on click) as ActionScript2
    doesn''t make sense, as there is no way to tell which of the various objects on
    the Flash stage you are concerned with. Instead, ActionScript 3 uses terms, a
    listener associates an event as a button click with a method or event that generates
    the events. For example, a "key press" event will send parameters (also called
    arguments in this context) to tell the method what was in fact pressed and whether
    the Ctrl, Alt, etc. keys were held down at the same time. The nice thing that
    listeners lets you can set up multiple functions that a single event or function
    lists multiple events. This can be quite handy, as we will see in some of the
    examples later in the book. The hard part is to get your hands around it need
    to set up the listener relationship explicitly as shown in Listing 3.


    > 5 One of my reviewers, Adam Brown of Online Interactive, LLC, explained the
    change from AS2 to AS3 this way: "the problem with AS2 that it had an informal
    approach to handling events (movieClip, button, etc.) had a unique way to register
    for receive events. Checkboxed to "click" or "change," MovieClips did not. You
    had a way to accomplish the same task, which was often confusing. AS3 introduced
    an Event Model that can be used across all object types. This provides a consistent
    programming syntax and also allows different object to share event methods.


    > 6 Of those you familiar with Visual Basic might recognize that an ActionScript
    listener is quite similar to the Add Handler keyword in VB. The idea of dynamically
    associating events with methods is generally called Delegates in the .NET world.
    Those of you used a C++ background (probably not reading this book) might notice
    that listeners are similar to callback functions.


