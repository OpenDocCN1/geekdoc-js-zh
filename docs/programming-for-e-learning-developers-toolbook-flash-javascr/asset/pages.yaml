    \ ToolBook – OpenScript\n\nNative ToolBook makes it quite easy to write a single\
    \ script for multiple objects due to its unique message hierarchy as shown in\
    \ Figure 33. When a button is clicked, the buttonClick travels up any groups through\
    \ the page, background, and even \"system books.\" This means we can handle the\
    \ message at any level we desire. For e-Learning content, this is often at the\
    \ Page level. The script used in Figure 32 is shown below in Listing 12. Of key\
    \ importance in this script is the ToolBook concept of target, which is the object\
    \ that originated the message. in the case of user interaction, it is the object\
    \ that receives the original \"click.\" In our case, we are interested in clicks\
    \ on buttons, but it is important to note that other objects can be clicked as\
    \ well. That's why the first time we do in the script we see the object of the\
    \ target \"button.\" If not (e.g., it was a field, rectangle, the page itself,\
    \ etc.), then we ignore the click. If so, we set the text of a field² to show\
    \ the name and caption³ of the button. This proves that we are able to tell which\
    \ button the user actually clicked.\n\n![](img/489f8caeddae410535f57c4dfc328dfc_57_0.png)\n\
    \nFigure 33. Native ToolBook Message Hierarchy.\n\n```\n-- Page Script\nhandle\
    \ buttonClick\nif object of target = \"button\"\n of field \"Display Field\" =\
    \ \"You clicked button \" & \\nname of target & \" with caption \" & caption of\
    \ target & \"\nend if\nforward\nend buttonClick\n```\n\nListing 12. Page Script\
    \ Showing the Target and the Message Hierarchy in ToolBook OpenScript.\n\n> ¹This\
    \ also required \"dynamic object referencing\" since we work off a naming scheme:\
    \ rectangle 1 corresponds to field 1, toolbarGraphic1, and so forth. We grab the\
    \ \"1\" from the original object name and then build the next name (\"field1\"\
    ) as a string and find that this is what is known as dynamic object referencing.\
    \ We'll cover this later in the book.\n\n> ²Notice again that ToolBook sets properties\
    \ and calls methods in the reverse order of our environments. We use text of field\
    \ \"Display Field\" rather than DisplayField.Text. One implication of the fact\
    \ that the name of ToolBook objects is in quotes is that we have names without\
