  md: '# Organizing Navigation


    A key and sometimes non-trivial requirement in e-Learning applications is navigation¹.
    In fact, this is an important area where e-Learning diverges from web sites and
    other software applications. In web sites, the user typically browses wherever
    she wants without a defined path. In normal “software,” the application typically
    has a main screen. When the user closes that, the application itself closes. In
    e-Learning, on the other hand, we normally have “next” and “previous” buttons
    as well as some sort of menu structure. In this chapter, we will look at how to
    set up this type of navigation in each of our


