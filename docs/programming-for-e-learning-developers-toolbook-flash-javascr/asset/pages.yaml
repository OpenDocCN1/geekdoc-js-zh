    # Methods


    Methods are the behaviors of an object. In other words, you (or the application
    in the case of events) can call a method (and send it data known as *parameters*)
    in order to have the object perform some action. As we have seen, methods are
    implemented in ToolBook – OpenScript with either to handle or get. The ToolBook
    Actions Editor basically has *event handlers* and *functions*. ActionScript and
    JavaScript have only functions. In ActionScript, we can set the return type of
    a function to *void* to note that we recognize the function will not be returning
    a value. Visual Basic (Silverlight, ASP.NET, etc.) has its functions (return a
    value) or *subroutines* (don''t return a value). Only in ActionScript or VB can
    we truly create a method of an *object⁸*. We do that by defining a *Public* function
    or sub. It has to be Public since since otherwise only the object itself could
    call the function or sub. For example, if we create a "Question" object in VB,
    we might have a *Score* method that looks like Listing 94.


    ⁶ Since we can calculate this from the *NumberOfWins* and *NumberOfLosses*, it
    is a rightly method rather than a property.


    ⁷ This could be implemented via "Web Service" in ASP.NET that retrieved a weather
    forecast based on the *HostCity.*


    ⁸ The Actions Editor has *Action Methods* of objects, but it is not a language
    per se.'
