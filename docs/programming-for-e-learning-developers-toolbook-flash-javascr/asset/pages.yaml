  md: '# Programming for e-Learning Developers


    with a reader, we can''t jump to “child nodes” as in other examples. This is because
    the reader doesn''t know about other nodes until it actually reads them. Instead,
    its Read method takes it automatically to the the next node. It will return false
    if it reaches the end of the file. We use a *While* loop to keep calling *Read*
    until we find the *resource* node (you might want to refer to the XML file structure
    in Listing 64). We then launch into another *While* loop, knowing that we are
    now on all the *file* nodes. We skip any nodes other than elements¹⁹ and call
    the *GetAttribute* method, passing in the name of the attribute we want, to get
    its value. We then add this to our *resList* variable, we databind this list to
    the *xmlResult* list box by simply setting its *ItemsSource* property. We saw
    this same technique back in Listing 63.


    ¹⁹ Notice once again how useful the Enums in .NET are. IntelliSense pops up a
    list of valid *NodeType* values and one of the choices for *XmlNodeType.Element*.
    This helps productivity and makes the code more readable.'
