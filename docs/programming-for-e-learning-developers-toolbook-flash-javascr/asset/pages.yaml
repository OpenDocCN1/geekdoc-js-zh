    # Listing 69. Reading XML in Visual Basic.


    We grab the fileName by reading the text of our entry field. We create an XmlReader
    object using fileName. This is an object optimized to read an XML document from
    start to finish, without the ability to back up¹¹. There are numerous methods
    of reading XML in Silverlight and .NET using Linq (Language Integrated Query).
    However to use Linq, you need to reference the System.Xml.Linq assembly. This
    is no big deal but using the normal XmlReader works fine for our case.


    We create a number of local variables that we''ll use while looping through the
    document, including resList, which we make a List(Of String) so that we can databind
    it to our list box we are working


    > ¹¹ This is a read-only or "firehose" cursor for reading a database.'
