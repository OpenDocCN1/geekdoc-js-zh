    # Encapsulation


    Now we get into some of the ten dollar words that make OOP seem even harder than
    it is. Encapsulation is the name that we give to the concept of hiding the internal
    implementation of an object and only exposing its methods, properties, and events.
    We “encapsulate” the functionality into an object. In our chip example, we have
    great encapsulation since there is no way that we can get into the inner workings
    of the chip except through the various pin connections. There are three reasons
    for encapsulation¹³.


    +   1. It allows the protection of your object''s variables, internal properties,
    and methods from outside tampering. You expose only those pieces of code needed
    to support the public properties, methods, and events.

    2. It allows you to include validation code to catch any errors. Let''s say that
    we wanted to store the name of the current month. If you had a global variable
    with this data, how would you ensure that it contained a valid value? Not only
    that someone didn’t try to set it to “George” but also to get consistency between
    December, Dec, Decem, etc.? If you use


    > ¹³ These are adapted from Steven Roman’s Object-Oriented Programming with Visual
    Basic; Springer, 1997; ISBN 0-387-94889-0.


    312'
