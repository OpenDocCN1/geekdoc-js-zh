  md: '# Programming for e-Learning Developers


    Studio for the HTML and JavaScript examples in this book, they are directly applicable
    to Dreamweaver and in fact, you may decide to use Dreamweaver to edit and run
    them.


    Many of the remaining major authoring tools are based on Flash (Articulate®, Captivate)
    or HTML (Lectors, ReadyGo). For developers using those tools, the Flash and JavaScript
    examples should be useful. While I used both Captivate and Camtasia for screen
    demos, I haven''t personally found a reason to expand my toolset in the authoring
    tool space beyond the options covered.


    Now that we have looked at some of the tools we are not covering, let''s quickly
    look at each of our four "chosen" environments. In each chapter, we''ll take a
    programming task and solve it in each of our environments. Feel free to concentrate
    on your preferred environment(s) or look at how each of the environments tackles
    the challenge.


    ToolBook is my original e-Learning tool of choice. I find its OpenScript language
    powerful and easy-to-use. I purposely start each chapter with a ToolBook OpenScript
    example as I think it in most cases the easiest to understand and follow. As OpenScript
    does not work after you publish ToolBook to an HML format, we typically follow
    the OpenScript example with one done in the ToolBook Actions Editors. The Actions
    Editor is a visual environment. It creates OpenScript for native (non-web) deployment
    and JavaScript for web deployment. Note that ToolBook exports to straight HTML
    and JavaScript and does not use a player⁵.


    Flash has transitioned from an animation tool to a more general-purpose "Rich
    Internet Application" environment. From my standpoint, its big advantage is the
    Flash Player itself. The fact that you can stay within the player, use its supported
    language (ActionScript), and not worry about browser and platform differences
    is a key selling point. Combine with excellent multimedia capabilities and programming
    power and it is easy to see why a e-Learning content is in some sort of Flash
    format.


    The ability to create JavaScript is an important skill, regardless of environment.
    While it is not terribly common to create all your content in HTML and JavaScript,
    the fact that you can call JavaScript from ToolBook, Flash, Silverlight, and other
    tools means a great way to get beyond any limitations of your preferred tool.


    Silverlight is an exciting technology from Microsoft that I believe has a great
    future. Very little e-Learning is currently produced in this format yet, however.
    Like Flash, it benefits from having its own cross-platform platform. It also has
    great multimedia and programming capabilities. The fact that you can use the most
    widespread language around, Visual Basic, is a nice selling point well.


    Once you have pored through the book, I encourage you to check out the Conclusions
    chapter for some final thoughts on each of our tools.


    > ⁵Any media contained in a web-based ToolBook application uses its associated
    player, however. So a .wmv file would play in a .swf file would play in a Flash
    Player.'
