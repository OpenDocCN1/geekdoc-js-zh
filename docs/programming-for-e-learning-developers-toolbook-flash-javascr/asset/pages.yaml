    The width and height are self-explanatory. But the overflow setting is worth looking
    at. This controls the scroll bars on control. Valid values include auto, hidden,
    scroll, and visible. auto means that horizontal and/or vertical bars are added
    only if needed. hidden means that there are no scroll bars and any extra text
    is cut off. scroll means that both horizontal and vertical scroll bars are present
    even if they are not needed16. visible means that the object automatically sizes
    so that all the content is shown without need for scroll bars. We chose auto in
