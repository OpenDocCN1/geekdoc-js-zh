  md: "# Handling a Click Event\n\n```\nrunInitialLoad();\nstop();\n```\n\n```\nfunction\
    \ runInitialLoad():void {\n    // set up listener\n    Button.addEventListener(MouseEvent.CLICK,\
    \ alertMessage);\n}\n```\n\n```\nfunction alertMessage(event:MouseEvent):void\
    \ {\n    DisplayText.text = \"This is a test.\";\n}\n```\n\n# Listing 3. Setting\
    \ Up an Event Listener and Associated Function for the Click Event\n\nWe start\
    \ by calling the runInitialLoad function. A call like this that is not inside\
    \ a function will be called as soon as the movie enters the frame. We use this\
    \ function to set up the listener before anything else happens (in particular,\
    \ before the user clicks the button). Note that lines like this in a semicolon\
    \ (;). I tend to use Flash like page or form-based environment like ToolBook or\
    \ Silverlight, or code like the stop(); remind you that it is timeline-based.\
    \ The stop line keeps us from moving to the next frame.\n\nThe first thing to\
    \ note is that Flash uses function for all methods. Any parameters to the function\
    \ between parentheses. If there are no parameters, in this case, you still need\
    \ to include the parentheses. After you specify the return type (though it is\
    \ not required). A return type of void means that function does not return anything.\
    \ The reason I recommend specifying the return type is that the programming language\
    \ will let you know if you try to do something invalid. We'll see more examples\
    \ of this technique later in the book. At the end of the line is the left bracket\
    \ that shows the beginning of the function. This function can go on the next line\
    \ if desired but the most common syntax is to put it at the end of the line. Basically,\
    \ any line without a bracket needs a semicolon indent.\n\nThe next line is a comment\
    \ (denoted by // in ActionScript) so that someone reading the code will understand\
    \ what you are doing. Finally, set up the actual listener. This is the typical\
    \ way to do\n\n> One thing I really like about ActionScript 3 is that this is\
    \ only made once. In AS2 and older, you define a function to call in response\
    \ to the enterFrame event and then delete the function programmatically to ensure\
    \ it didn't get over and over. Ideally you would have all code in a single frame\
    \ I sometimes like to separate various key frames and code for each. In those\
    \ cases, I have runInitialLoad for key 1, runInitialLoad2 for key 2.\n\n> I confess\
    \ that I was programming for many years before I realized what void was. I would\
    \ look at C# and C++ code and think, \"Man, this is complicated\" to all the void's\
    \ and brackets. When I finally looked it up on the Internet and realized that\
    \ a void function is the same as a Sub in VB or a handler in ObjectScript these\
    \ languages don't look quite so.\n\n> By default, the ActionScript editor displays\
    \ keywords in blue, comments in gray, and strings in green. The keywords are fine\
    \ out environments, particularly displays in green. To keep from going crazy,\
    \ I change comments to green and strings to use a red using the Edit menu - Preferences\
    \ - ActionScript."
