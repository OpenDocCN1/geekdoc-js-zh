  md: '# Exam Engine™


    ![](img/489f8caeddae410535f57c4dfc328dfc_384_0.png)


    Easily Create

    Database-Driven,

    SCORM-Compliant

    Exams


    # Pull Random Questions from a Pool By Objective


    Associate questions with one or more objectives. Then grab a designated number
    of questions from each objective, giving each student a different exam. The questions
    and objectives are stored in SQL Server, Access, or XML.


    # Communicate with a SCORM Learning Management System


    Simply check a box in the configuration editor or change your URL query string
    and your exam will send all interaction information to your SCORM LMS. The exam
    can be packaged as a complete SCO (including manifest).


    # Store or Email Individual or Composite Results


    In addition to (or instead of) sending results to your LMS, you can have composite
    results (including question responses and time per) stored on the web site. Individual
    results can be emailed in various formats. Use the optional Reporter program to
    view question analysis and other reports.


    # Allow Your Subject Matter Experts to Write Questions Rather

    Than Try to Learn an Authoring Tool


    Exam Engine has a special "Question Editor" (with built-in spell checker and reporting)
    that your Subject Matter Experts can add, edit, or delete questions and objectives.
    They choose the question template (Hot Objects, Hot Spot, Matching, Multiple Choice,
    Numeric, Sequencing, etc.) to use on each question. They then spend their valuable
    writing dynamite questions and associating them with objectives rather than trying
    to learn an authoring tool. They can even create reports of questions by objectives,
    media required, objectives associated with each question, and much more!


    Go to www.examengine.net to learn more, download an evaluation version, or try
    out a sample exam.


    # More Information


    www.examengine.net

    888-866-5251 or 719-548-1110'
