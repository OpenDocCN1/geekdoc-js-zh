    # ToolBook – Actions Editor


    Things are not too much different in the Actions Editor as it has the concept
    of target as well. One thing to watch for, though, is that there is no ability
    to check the type of object (object of target is the OpenScript syntax we use
    for this in Listing 12 above). So we need to be sure that there are no incompatible
    objects that can reach the script. For example, if we put the action at the page
    level (you might want to refer to the hierarchy in Figure 33), and refer to the
    caption of target, we''ll get an error message (when native) or a reference to
    “undefined” when published to HTML clicking anything other than a button (including
    the page itself), because only buttons have a caption property. To avoid this
    issue, the simplest place to put the action is on a group⁵ The result is shown
    in Figure 34.


    ![](img/489f8caeddae410535f57c4dfc328dfc_58_0.png)


    Figure 34. Group-Level Action Using Target in the ToolBook Actions Editors.


    The Actions Editor does not have dynamic object referencing, so some of the usefulness
    of this approach is lost⁶. But it can still be pretty handy.


    > ⁴This extra processing can be quite helpful. (e.g., One do thing in our Learning
    & Mastering ToolBook is handling the mouseEnter event as the “system book” (e.g.,
    other books about the current book) level. We check if the target is a button
    and if it is enabled. If so, we set the sysCursor property to 44 which turns the
    cursor into a hand. This also allows us to change the behavior of hundreds of
    buttons with a single script.


    > ⁵A group is unique to the ToolBook in the sense that you can create a new object
    simply by “grouping” one or more objects. The resulting group can have its own
    script and be shown or hidden as an entity. It is like a Panel in NET but then
    we have to drag objects into the Panel.


    > ⁶Going back to our previous example, you could get that we were on rectangle
    1. But instead of using a reference to field 1, we need to do logic along these
    lines: if num = 1, set text of “field 1” to “xyz”, else if num = 2, set text of
    “field 1” to “xyz”. This is what we mean by dynamic object referencing (of the
    lack thereof).


    35'
