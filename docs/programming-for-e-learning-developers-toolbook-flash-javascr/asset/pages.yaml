  md: '# Programming for e-Learning Developers


    As usual, we have our global variables at the top. Silverlight has a concept of
    "capturing the mouse" that occurs at the beginning of the drag. It basically ensures
    that the sender for the rest of our messages is the original source object, if
    we don''t move the object. Keep track of that, we start with an isMouseCaptured
    global variable. We then have the same initialPosition and initialPositionY variables
    we have in JavaScript. In BeginDrag, we use cType() to tell the compiler that
    we know it is a TextBox. We set our initialPosition and initialPositionY variables
    by reading the Canvas.Left and Canvas.Top "attached" properties. This is similar
    to how we read the objects in HTML by using style.left and style.top. We set our
    isMouseCaptured global variable to true and then call the CaptureMouse method
    of our source object. As mentioned above, this Silverlight gives that the following
    mouse messages are for this object.


    Jumping to the moveObject method (which is called in response to the Mouse Move),
    we get our reference to source. Check if isMouseCaptured is true and, if so, get
    the current mouse position. We use the second parameter to our method, which is
    of type EventArgs. It has a GetPosition method that we can use to get either the
    coordinates or the ones relative to a specified object, we use Canvas1. Since
    Canvas.Top are also relative to the left corner of the canvas, we simply do a
    SetValue on these properties.


    Our last method, endDrag, is called when the user releases the mouse. We use similar
    logic to the Flash and JavaScript examples to get the Name of the source, Split
    it into parts, and build the name of the corresponding target object. In this
    case, we use FindName to build a reference to it. We could do a Cast() to return
    it as an Image, but it is more greatly a UI, so we reference it that instead.
    We need to do this because our "hit test" method returns a list of UIElement objects
    we''ll see below. We return ToStart variable to help keep track of where we need
    to bounce the source back to the starting position.


    We are now ready to figure out if we are over the right target. Silverlight has
    a FindInChildren method that returns a list of all the UIElements that have themselves
    in the designated coordinates. We pass the current mouse coordinates (relative
    to the Silverlight screen so we pass Nothing as the parameter) the first parameter
    and the object we are searching within (Canvas1) as the second parameter. We want
    a List(Of UIElement), so we call the ToList method of the resulting collection.
    Determining whether or not our hit contains the targetid, we snap to the target
    as in past examples. Otherwise, we set the source object back to initialPosition
    and initialPositionY. We reset isMouseCaptured and very importantly, call the
    ReleaseMouseCapture method so that another object can be dragged.


    > 9 You might notice that these are defined as Type Object rather than Integer
    or Double. This is because we return the position as an "attached" property of
    the object. For example, the left position of our source object is relative to
    the Canvas that contains it. This is in the XAML (Listing 81) as Canvas.Left="24".
    We read these attached properties by this type of syntax: source.GetValue(Canvas.LeftProperty).
    This is returned as type Object. We could convert it to a numeric type, but it
    turns out that our use of initialPosition and initialPositionY is to set the values
    back (source.SetValue(Canvas.LeftProperty, initialPosition)) if the user drags
    the source in the wrong spot. This works fine leaving the type as Object.


