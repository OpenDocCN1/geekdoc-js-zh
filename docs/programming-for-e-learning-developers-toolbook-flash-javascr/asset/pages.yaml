  md: '# Conclusions


    I didn''t originally have a “conclusions” chapter but had to agree with my reviewer
    and longtime customer, Graham Cownie de bristol.gs Training Solutions, when he
    emailed me this comment:


    I really don''t think you can finish a book that is as powerful and as important
    as this is without a concluding chapter. How about a properly titled "Conclusion"
    chapter which talks about the four environments, their strengths and weaknesses,
    which are best suited for what, and where to learn more about coding, which of
    the environments allow for the most rapid coding, which of them have large libraries
    of commercial plugins, etc. also how a bit of future-gazing stating where you
    think each of these packages might be heading in the future?


    That''s a tall order, but I will give it. The news is that you have hopefully
    seen that there are numerous similarities in both capabilities and programming
    syntax between all of these environments. If you can be productive in at least
    one of these, and even more importantly, confident you should need to move to
    another one, I will have done my job.


    Before turning to each of the environments for one last time, let me express my
    thanks to you for sharing the journey with me. I''ve learned a bit by myself in
    creating and sharing the various examples. I hope you have done the same!


    # ToolBook – OpenScript


    As mentioned in the Introduction chapter, ToolBook was my first e-Learning as
    well as application environment. I OpenScript is an easy-to-understand yet powerful
    language. That''s the main reason I led off with this environment in this book.
    I''m pleased thatTotal Systems kept around when I updated ToolBook to 32-bit status
    a few years ago and have continued to add new features to it. One of the best
    things OpenScript is that much of ToolBook itself is written in that language.
    So virtually anything that you can do from its menus or toolbars, you can do programmatically.
    That''s great for automating tasks and makes it fairly easy for third-party developers
    to add new functionality. We released our first commercial product, Plug-In Pro,
    to do this (on floppy disk!) in 1996 and it is still going.


    From a market perspective, however, using OpenScript to create interactions or
    “runtime” functionality only makes sense for “native” applications that are delivered
    via CD or on a local area network. The Neuron plugin has relatively few takers
    due to its big size, low “acceptance” by IT departments, and the fact that it
    cannot support SCORM. This type of native training is a low percentage of e-learning
    and is getting smaller. For those using ToolBook, I recommend learning OpenScript
    and using it to help automate tasks. But other than that, the future of ToolBook
    is the Actions Editor and its built-in Catalog objects. SumTotal understandably
    focuses on this part of the product, but with the result that the OpenScript editor
    lags behind with no color-coding, IntelliSense, etc.


    Despite the relative ease of making plugins and other add-ons, there are not a
    large number companies doing so. My company, Platte Canyon, and Peter Jackson''s
    ToolBookDeveloper.com are the main ones.'
