  md: '# Programming for e-Learning Developers


    Let''s now look at loadExternalMedia. The first part is the same as playing a
    sound: we use the fileName variable to create a new URLRequest. But then we need
    to take account of the fact that loading external graphics or Flash is an asynchronous
    process. This is due to the fact that the files could be fairly large and we don''t
    want to lock things up waiting for them to download. So we useaddEventListener
    to call the onLoadMovieComplete in response to the COMPLETE event⁷ We then call
    the movieLoader''s load method, passing in the URLRequest¹


    When the graphic or Flash movie is complete call the onLoadMovieComplete method.
    At this point, the graphic or movie is a DisplayObject. We create a moviefield
    of this type and set it to the content property of our movieLoader. In other words,
    this is what this loader downloaded. In order to make the graphic or movie show
    up, though, we need to add it to the stage. We do this with the addChild method.
    Notice we pass our movieLoader as a parameter. From there, we use the x and y
    coordinates of our movieList to match that of Player1.


    Our last task is to get rid of any existing media before we draw new graphics
    or movies. We do this with the clearMedia method. Our biggest challenge is figuring
    out if we have already added a child to the stage. We do looking for a child with
    the name of our movieLoader, which is why we create the loaderName variable in
    the first place. The getChildByName method will return a DisplayObject if there
    is a child by that name¹¹. If it is, we find the child''s index (basically its
    layer) and then use getIndex method. We pass that to the removeAt method to actually
    remove it from the stage. Our next step is to stop the flPlayer (notice how we
    check its playing property) and hide it. Finally, we check our soundChannel global
    variable. If it not null, we stop it. Wheel!


