  md: '# Introduction to Object-Oriented Programming


    exposed property, you can reject incorrect values and automatically change incomplete
    forms to the desired syntax¹¹⁴.


    3. It frees the developer from having to know the details of how the object is
    implemented.


    You might think that developers won''t try to use your internal code even if they
    *can*, but the problem is that you can''t be sure. Suppose you make one of your
    "behind the scenes" variables global (public) and a developer finds out that it
    is easier referencing this variable than going through the defined properties
    and methods. Once this application is out in the base class, any updates to your
    object that eliminate or change this internal variable will break her application.
    Even though it is her fault, poor object design lets happen.¹⁵ Encapsulation prevents
    this situation.


    # Polymorphism


    The term polymorphism refers ability to know which method or property they should
    use. Suppose the ProSoccerTeams class has its own CalculateWinningPercentage method
    (account for the possibility of ties) while the other classes don''t override
    this method but rather use the one in the base class. The developer doesn''t need
    to know that. He just calls the method on any of the objects (soccer, basketball,
    football, etc.). The object itself whether it is an instance of the ProSoccerTeams
    class (and hence uses its method) or one of the other classes (using the base
    class method). This is polymorphism. Notice how this helps the classes to be self-contained.
    You can choose to override or all methods or properties of the class above without
    the developer using the object needing to know!


    # Overriding


    This is used for the situation where we need an inherited property or method to
    behave differently than in the base class. As the original property or method
    has been designated as overrid, you can override it by putting your own implementation
    in the inherited class. In other words, use the child''s version rather than the
    parent''s version. This is an extremely powerful concept and a key part of OOP.
    We will look at additional examples later in the book.


    # Overloading


    Overloading refers to a method (most typically) or a property having more than
    one. We saw this back in Figure 17 and Figure 31, where there were different ways
    to call the MessageBox object or create a SolidBrush. Overloading allows your
    code to be more flexible without the need to resort to multiple variations of
    the same method (slightly different names) or optional


    > ¹⁴ An Enum is even better for this situation. As we have seen, you can define
    the valid values as one of the twelve months and present the developer with a
    drop-down list in the Properties and IntelliSense when entering a value in code.


    > ¹⁵ I must admit that one of our add-ons in our Plug-In Product for Toolbox uses
    an array editor that is internal to the Toolbox system books and loads it with
    question data. In this case, we know well that this tool is susceptible to elimination
    or failure to work in a new version, but the power it is is worth. If the method
    that this editor were private, however, we never could have gotten to it! Not
    a big deal in this case since it is an "authoring level" tool, but hopefully it
    illustrates the concept.


