    Listing 82. Glossary Web Implementation Code.

    We start by introducing additional namespaces that we need: System.Data.OleDb
    (having to do with general database objects) and System.Data.OleDb (having to
    do communicating with Access databases). We then make GetDefinition with the <WebMethod()>
    attribute to denote that it can be called externally and make it Public. As with
    our previous examples, we validate our ServiceAuthorizationKey, which is stored
    in the Web.config file on the web site. From there we read our GlossaryData property
    to get our view object, which is of type DataView. A DataView is a representation
    of a table that can be sorted, and what we are looking for, filtered. To do this,
    we set the RowFilter property. We use the column with "key" named "GlossaryName".
    If we are looking for the definition of "bass," the RowFilter will be GlossaryName
    = ''bass''. We put the value in single quotes to account for the situation where
    it is multiple (like “lead guitar”). We remove any single quotes in the key to
    avoid formatting problems. We now check the Count of our view. If it is greater
    than 0 (it should be 1 but we don''t want to stop it when we get a duplicate for
    some reason), we get the first row (view(0)) and then the "GlossaryDefinition"
    column. Since we call ToString to get the text version. This is what we return
    from our method call.


    Let''s look now at the GlossaryData property. This is ReadOnly, meaning that we
    can only read and never set it. It is Private, meaning that it can be used by
    methods within the web service (e.g., we couldn''t read it from our ToolBook,
    Flash, or other applications). We define our viewid and then check the Cache to
    see if it is holding an object with the "GlossaryDataView" key. If not, we read
    the database. To do this, we start with a "connection string," which is the const
    Variable. As we did in Listing file 61, when we use Request.ApplicationPathTo
    get on our actual local file path of our web site. Our provider is "Microsoft.OleDb.OLEDB.4.0"
    and our data source is the complete path to the database. We could add a password
    if needed as well. Once we have a connection string, we use this to build an OleDbConnection
    object, telling it the name of the query, more generally called a "stored procedure,"
    ("ReadGlossaryEntries") and passing it the connection. Still not, do we use this
    to create an OleDbDataAdapter object. This is what actually executes the query
    into a


