  pgno: 365
- img_proc: true
  md: 'Conclusions


    # JavaScript


    I included JavaScript in this book largely because it can be extremely helpful
    to it extend ToolBook, Flash, and Silverlight. I thought that using it to implement
    our various tasks would serve as a good introduction to the language. Hopefully,
    I have accomplished goal. But what struck as I created the various examples is
    in many cases it was as easy to accomplish our tasks directly in HTML and JavaScript
    as it was to use one of theing tools. Before I started considering all my e-Learning
    in Visual Studio or Dreamweaver, I would consider how I was handling questions
    and examples. We didn''t have time in this book to say that it is not trivial.
    Dreamweaver CourseBuilder extensions would help there considerably. But I think
    that JavaScript is largely an ’extender’ for most learners’ You’ll use it for
    SCORM calls and perhaps for tasks like showing external URL’s and so forth like
    which we did in this book.


    There is a large number of JavaScript libraries out there, many of them. But of
    course, a free library means that you are on your own as far as support is concerned.


    # Silverlight


    For a new project, Silverlight has a tremendous amount of momentum. Not since
    .NET itself came out in early 2002 have I such a flurry of activity in the “Microsoft”
    world as there has been for Silverlight. Blog writers who used to write about
    abstract programming concepts like databinding and queries are now posting about
    how to play videos, create gradient effects, display graphics, incorporate animations,
    and more. This is exciting to me a long-time .NET developer as some of the tasks
    that have been difficult to do in the past are not quite easy. The fact that Silverlight
    has its own player also has big advantages in that we don''t have to worry about
    which browser we are in, the “state” starting over when we change pages, etc.
    Microsoft is pushing a separation of tools and tasks between the designer and
    the developer. As mentioned, Adobe is doing a similar path with Flash. This could
    be e-Learning development teams and they can leave the programming parts for just
    one or two members of the team.


    Despite its nice capabilities, Silverlight has no e-Learning components and no
    out-of-the-box SCORM support. The lack of hyperlink capabilities within fields
    its initial version is a serious deterrent to having Silverlight as your primary
    e-learning environment. I expect to see Silverlight applications displayed within
    other e-Learning projects in the short term, as many ToolBook applications will
    display Flash movies. With the rapid pace of improvements in Silverlight capabilities
    and the wholesale


    > One of my reviewers, Tomas Lund of eLearningSpecial.com, sees the future of
    JavaScript and e-Learning a bit differently: "I actually see a trend towards rich
    internet applications in HTML/JavaScript. JavaScript libraries are getting more
    and mature, browsers are becoming more and standardized (IEB to an extent breaking-compatibility
    in favor of standardized HTML). And there seems to be an emphasis on the performance
    of JavaScript in current browsers."


    > I recognize that there are newsgroups, forums, and other communities. We host
    the popular ToolBook List outlines. This community-based support program means
    there is a chance that no one either will have the time or knowledge to help you
    in a short timeframe.


    343'
