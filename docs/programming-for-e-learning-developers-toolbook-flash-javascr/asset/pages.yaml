    \ Web Service Methods for Retrieving Graphic and Media File Names - Visual Basic.\n\
    \nThe first task when coming up with the GetExternalGraphics and GetExternalMedia\
    \ methods is determining what kind of data type to return. We want something that\
    \ can be easily “databound” in Silverlight, making that we can connect our list\
    \ boxes to the object and it will take care of showing all the items. We will\
    \ use a Collection object²². As we have seen previously (Listing 26), this is\
    \ a Generic object that we need to specify the type of object that we are holding,\
    \ a String, by using the (Of) syntax. The Collection object is part of the System.Collections.ObjectModel\
    \ namespace, which is why we import it. We also use the System.IO namespace to\
    \ read the files, so we import that as well.\n\nIn both functions, we declare\
    \ the collectionId variable and set it to Nothing. If our accessKey is correct,\
    \ both functions call BuildFileList to create the collection. We do this because\
    \ both functions need a similar task: read files from a specified directory. For\
    \ graphics, we take all the files in the directory. For media, we only want mp3\
    \ and wmv, since those are the only ones that Silverlight can play. We make BuildFileList\
    \ flexible by having one required parameter, directoryName, and two parameters,\
    \ limit1 and limit2. Now we declare the parameters with the keyword Optional and\
    \ set a default value \"*\" for limit1 and Nothing for limit2.\n\nTo actually\
    \ read the files, we need to come up with the local path on the web server. We\
    \ do this by using a property of the request called PhysicalApplicationPath⁸ and\
    \ concatenating the directoryName parameter. On my machine, this ends up as C:\\\
    inetpub\\wwwroot\\Programming101\\ExternalGraphics. We then create a DirectoryInfo\
    \ object from this path. We declare fileInfo, which we use in our loop. Now, we\
    \ create a new Collection(String) that we add to. From there, we call a GetFiles\
    \ method of the directoryInfo. We pass in our limit1 and it returns an array of\
    \ FileInfo objects. For Each Loop we add the name of each file to our collection.\
    \ We then check if there is a limit2. If so, we do the same thing with it.\n\n\
    Once we return to the original function, we return the collectionId variable to\
    \ our calling program (e.g., our Silverlight application).\n\n> ²This is called\
    \ an ObservableCollection in Silverlight but we use a Collection in ASP.NET.\n\
    \n> ⁸You can use this same technique to Access an database on your web site that\
    \ also requires a local path. Using PhysicalApplicationPath is quite helpful because\
    \ you can move your site or service around (even to a remote hosting site where\
    \ you have no idea where they put it) and all your code will still work. You can\
    \ see this later in the book in Listing 82."
