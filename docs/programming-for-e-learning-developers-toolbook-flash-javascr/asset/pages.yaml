  md: '# Sending Email


    Staying on the web theme for a bit longer, let''s look at how we send email from
    an e-Learning application. The simplest but, unfortunately, least reliable method
    is to use the same hyperlink approach in the last chapter but with "mailto:" hyperlink
    like this:


    mailTo:info@plattecanyon.com?subject=This is a Test&Body=This is line 1%0AThis
    is line 2


    This is an example of a "query string," where we pass information as part of the
    URL. You see this frequently on the web when you search Google and perform other
    actions. It is an example of a GET as opposed to a POST where the information
    is sent as parameters. We will cover posting below. Notice how the first piece
    of information comes after a ? and the other pieces are separated by &. Some email
    programs will accept other attributes such as cc for copy and bcc for blind copy.
    One that has been pretty much for security reasons is attach for file attachments.
    Note how you can use %0A to move to a new line.


    This hyperlink approach is for optional emails but not for sending test scores
    or other important data for these reasons:


    +   1. The link just launches the user''s default mail program. There is no guarantee
    that they''ll decide to send the email.

    2. Since the data within the email is shown to the user, they may very well change
    it or at least look at it before sending.


    The corollary of the above is that any approach that sends email the client is
    unreliable. This is mainly due to security settings that prevent viruses from
    sending email without the user''s knowledge. These settings will prevent your
    e-Learning program from sending email from your user''s machine.


    So what is the answer? What I recommend and do extensively is send the email from
    a web server. This can be an ASP, a PHP page, etc. My personal favorite is to
    use an ASP.NET Web Service. That''s what we will focus on in this chapter.


    # ASP.NET Web Service


    I like to think of a web service as a set of functions that you can call over
    the internet. For example, you might send a "weather" web service your zip code
    and get back the current temperature, wind speed, and forecast. The information
    between your application and the web service is sent via XML.


    Some of you may have used an ASP or PHP page to send email or accomplish another
    task. In that case, the entire page is normally dedicated to that task. In other
    words, the page represents a single


    > ¹ via SOAP, which originally stood for "Simple Object Access Protocol." When
    you make a web service from JavaScript, it typically uses JSON, which stands for
    "JavaScript Object Notation." Calling sites or web services from JavaScript to
    update pages is commonly called AJAX (Asynchronous JavaScript and XML). Lots of
    acronyms!'
