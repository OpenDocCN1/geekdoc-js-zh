    the location of the web service. We then reuse the design from Listing 34 (dynamic
    hyperlinks) and call initializeGlossaryHyperlinks, passing in the reference to
    our field and as the symbol("") we are using to define hyperlinks. We then think
    ahead to how we are going to hide the glossary movie after the user is finished
    with. We''ll use a listener for any mouse click, so we MOUSE_DOWN event on the
    stage and associate it with the hideGlossary function.


