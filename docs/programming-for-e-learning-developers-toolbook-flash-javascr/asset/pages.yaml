    We put the Enum to quick use in the UserControl_Loaded method. We datab each of
    our list boxes to "property". Both the GetValueList and SetValue properties have
    a parameter, scormVersion. They are "read only" properties, meaning that they
    have "Get" code and not "Set" code. The properties return a List(Of String) like
    we have seen in previous examples¹¹. Within "Get" code, we check scormVersion
    and add the appropriate items to the list.


    Next is ConfigureSCORM. The first thing to notice is the long list of objects
    and events that are "handled". Though you can add listeners via the Add handler
    syntax, it is typically easier to just give a comma-delimited list (IntelliSense
    helps you out) <object>. The rest of this is similar in logic to past examples.
    We get our Name and Split to get an array. The first part is scormCall and the
    second scormVersion. We then pass these to MakeSCORM.


    Within MakeSCORM, we build the name of the JavaScript function, jScroll, using
    String.Format again. We have variable declarations as there are not any object
    types¹². We then do a Select statement on the scormCall parameter. Notice how
    we see items that are handled together by commas ("FindAPI","InitSCORM","Close")
    rather than putting them on separate "case" lines like we do in ActionScript and
    JavaScript. We then call the actual JavaScript function with this that may have
    a value of Nothing. Trying to call the ToString method on Nothing generates an
    error. So we call a formatReturnValue function that returns "" if the object is
    not and the actual still is not.


    With Get, we build the object and call the FindName method to get the object of
    name¹³. We then do a Type to cast that as a ListBox, TextBlock, or TextBox. For
    the list box, we check that its SelectedItem is not Nothing as calling its ToString
    method would generate an error. We call Invoke, passing in both jScroll and the
    SCORM element we are looking for. The JavaScript function has one parameter, we
    can pass it as string like this. If it has multiple parameters, we pass an array
    instead. We need this for SetValue.


    For SetValue we get n1Text and n2 in the other environments. We also get our IntPtr
    and find the list box. We use the SelectedItem.ToString, n1Text, and n2 to formatSetValue
    to replace ".with their appropriate values. As we have seen, we Split on "." and
    then we pass the returnVal back together as needed. Notice how this makes the
    easier to read and less prone to mess with quotes and so for. Once we have ours
    on elementString, we build our paramid array to hold the elementString (the SCORM
    element we are setting) and the inputString (the value we are setting to).


    GetLastError and GetLastError have similar logic.


