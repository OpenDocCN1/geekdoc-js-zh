    text of field "xmlResult" = ""

    endPage


    -- button script

    to handle buttonClick

    local string fileName

    local string resList


    fileName = text of field "xmlPath"

    resList = tbfunction_readManifestResources(fileName)


    text of field "xmlResult" = resList

    endButtonClick


