  md: '# Creating an Interactive “Rollover” Screen


    Let’s make an interactive screen where the names of Beatles albums are listed
    down the left side. When the user rolls her mouse over the names, they change
    color and a graphic of the album cover is displayed on the right side of the screen.
    We’ll also include a track list from www.beatles.com . Album names that have been
    “rolled over” will be shown in a third color so that the user can tell which ones
    she has already completed. Finally, we will display a message when all of the
    rollovers have been completed. This is a pretty realistic interactive training
    screen and will introduce us to a number of important concepts.


    # ToolBook – OpenScript


    You might take a look at Figure 38 so that we can picture our task.png files and
    created fields along with the titles of the albums. The names of these fields
    are “album 1” through “album 5,” I imported the graphics as resources and gave
    them matching names. Finally, I went to beatles.com and grabbed the track listing
    for each album and put them in fields named “field 1” through “field 5.” I hid
    these fields as we are going to read their text (technically their richText so
    that we preserve our formatting) and show them in a common “display field.” I
    used this technique because it avoids the need to reposition all the fields if
    we show and hide them in turn. Our design is that we’ll show the album cover in
    a button and set this display field to be the track listing in response to the
    mouseEnter event, which is what ToolBook calls a rollover.


    > You might be wondering why I put a space between the base (album) and the number.
    Unlike some of the other environments, ToolBook allows this. The advantage comes
    when it is time to “parse” the number from the name. With OpenScript, we can use
    syntax like this: word 2 name of target. The space between the base and the number
    is what separates word 1 from word 2. This keeps us running into problems when
    we get to album 11. In environments that don’t allow spaces in object names, I’ll
    put an_ instead and use split method for the same reason. You will see that in
    later examples.


    > Similar to putting them into the Library in Flash. Silverlight has both content
    (inside the .xap file) and resources (inside the DLL itself).'
