  md: '# # Creating Drag & Drop Interactions


    A common desire in an e-Learning application is to be able to include drag & drop.
    I say "desire" because most applications limit this type of interaction to some
    pre-built question objects as coding them is beyond the skills of many e-Learning
    developers. Hopefully, this chapter will change that''. The ToolBook Actions Editor
    does not have direct drag & drop capabilities, but we will create a simple screen
    with three "sources" and three matching "targets" in our other environments.


    # ## ToolBook – OpenScript


    Our native ToolBook example is shown in Figure 111.


    ![](img/489f8caeddae410535f57c4dfc328dfc_252_0.png)


    Figure 111. Drag & Drop Example - ToolBook OpenScript.


    > ¹ Thanks to one of my reviewers, Graham Cowieie of bristol.gs Training Solutions,
    for suggesting this chapter.'
