    Otherwise, we jump into the emailComplete function once the web service returns
    a result. That result is the target property of our eventid parameter. Since we
    know³⁰ that it is a URLLoader, we declare the loaderid variable of that type and
    use the asLoader syntax to tell the Flash compiler the type of object it is³¹.
    We check to make sure that we actually got a result. If so, we again take advantage
    of the fact that we know that the web service will be returning XML. We create
