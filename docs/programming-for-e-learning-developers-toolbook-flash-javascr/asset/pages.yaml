  md: "# Creating a Simple Calculator\n\nWe start defining *OperatorEnum*. It is a\
    \ simple method of typing in each valid value. We define our global variables\
    \ outside a function or sub block. Notice how we can use *Double.MinValue* as\
    \ the default *lastOperatorValue* rather than the arbitrary -9999 that we used\
    \ in other examples. It avoids any problems if the user wanted to start with -9999.\
    \ We define *lastOperator* as *OperatorEnum* and initialize it to *Operator.NotSet*\
    \ (IntelliSense pops up a list of value today).\n\nWithin *UpdateTotal*, we call\
    \ *getAction* to figure out the number (or word “Point”) associated with whatever\
    \ the user clicked. This function uses identical logic as for and JavaScript samples.\
    \ We use a *CType* to tell the object that we call the “sender” is a Button. We\
    \ then grab its *Name* and do a Split on it (1 since the first element is 0) to\
    \ get our hands on what we want. We back in *UpdateTotal*, we look for “Point”\
    \ and swap out \n\nIn *SetOperator*, we again call *getAction* to get the “text”\
    \ of value. We convert these to *OperatorEnum* by calling System.Enum.Parse and\
    \ passing the value we are trying to parse to (OperatorEnum), the text we are\
    \ converting (actual), and a True to tell the method that we don't want to be\
    \ case-sensitive¹⁸ We check that the “total” is numeric, so we set the *lastOperator*,\
    \ *lastOperatorValue*¹⁹, and startOver variables.\n\nIn *SetClear*, we re-initialize\
    \ these same *lastOperator*, *lastOperatorValue*, and startOver variables. We\
    \ also clear our “total” text.\n\nFinally, *SetEquals* ensures we are not in our\
    \ initial state. It reads the current “total” text then declares a *newValue*\
    \ that will be used to hold resulting total. We then do a *Select Case* on *lastOperator*.\
    \ Notice how we use the *OperatorEnum* to figure out which operation to perform.\
    \ We then either add, divide (checking to make sure we are not dividing by 0),\
    \ multiply, or subtract. We then reset our global variables.\n\n¹⁵ The Basic Basic\
    \ namespace in .NET has *IsNumeric* function, but this is not part of Silverlight\
    \ by default.\n\n¹⁶ Double is a double-precision point number. It is the *real*\
    \ data type that we defined in OpenScript.\n\n¹⁷ Why make *isNumeric* in a separate\
    \ function when *Double.TryParse* only takes one line? It could go either way\
    \ and in code like our Example Engine, I typically use TryParse on its own because\
    \ I already have an index used for the converted value (numericValue in text).\
    \ But in our case, we want to know if it is numeric but don't want the converted\
    \ value. So having a separate function the line that declares *numericValue* and\
    \ is easier to understand than the *TryParse* syntax.\n\n¹⁸ For this approach\
    \ to work, the text needs to match names that the *OperatorEnum* executes.\n\n\
    ¹⁹ Notice we use the *CDbl* method to check the String to a Double. Unless you\
    \ go out of way to turn off the “checking” (and I recommend you don't turn off),\
    \ Visual Basic will not let you go with the casual assignment of strings to number\
    \ variables (and vice-versa). The casual assignment saves a little typing but\
    \ can be a source of bugs.\n\n289"
