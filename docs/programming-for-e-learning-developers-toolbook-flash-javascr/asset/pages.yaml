  md: '# Programming for e-learning Developers


    We create nodeList, which is the list of all nodes (metadata, organizations, resources)
    under the root document element. We then loop through these nodes until the nodeName
    is "Resources." We get its childrenNodes and call nextNode to get the first (and
    only in this case) node (resource). We again get childrenNodes, which gives us
    a list of all the file nodes that we want. We loop through these using nextNode
    to jump to each one. We grab its attributes and then use getItemId to find the
    href attribute. Finally, we grab its value and add it to our resList variable,
    putting in a lineBreak as needed.


    If we are in Firefox or other browsers, we can short-circuit the logic by using
    getElementsByTagName to jump to the resources node. We use childNodes in the IE
    example. Rather than using nextNode, we take advantage of the fact that childNodes
    returns an array and grab the desired item in the array. But we must be careful
    here. In non-IE browsers, each is listed twice: once as Text and once as Element*.
    The Element is the one we want. That is why the resource node is subList[1] rather
    than subNode[0]. We get the childNodes and then loop. grab each node and its nodeType.
    If an Element, we grab its first attribute (href), and then its value. We add
    it to our resList variable, adding in a lineBreak for any line after the first
    one. We show how to debug this logic in the "Debugging Your Applications" chapter
    and in Figure 151.


