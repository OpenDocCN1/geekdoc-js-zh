  md: '# Programming for e-Learning Developers


    # ToolBook – Actions Editor


    Tim Bam and company at SumTotal Systems basically saved ToolBook by inventing
    the Actions Editor. As we have seen throughout this book, it is a nice visual
    environment that still allows for fairly elaborate logic. The fact that it translates
    to both OpenScript for native applications and JavaScript for web applications
    is quite an impressive technological feat. But the fact is that it needs to do
    points out some of the continuing challenges the project faces. Rather than staying
    within their player like Flash and Silverlight can, ToolBook content needs to
    be converted to HTML and JavaScript. Letting ToolBook do this conversion for you
    is easier than trying to write the content in HTML and JavaScript yourself. But
    the published content is vulnerable to issues related to new browser versions,
    changes to Windows Media Player and Flash version, security changes, etc. You
    still have the .tb file available in that case, though, so your old content can
    be republished without any of these issues when they come up. ToolBook has a large
    catalog of pre-built learning and media objects. It is the only one of our environments
    that focuses on e-Learning. ToolBook has a good niche in that it is accessible
    for newcomers without hitting many limits of the tool itself. The Actions Editor
    and, beyond, the ability to call JavaScript functions as we have covered in this
    book, make it possible to add some very advanced features. For the very serious
    developer, you can use OpenScript to automate the creation of actions, configure
    your books, and more. I think ToolBook will continue to do well in the market.


    # Flash


    Flash quite a bit of momentum in the e-Learning space, particularly as a format.
    In this book, we have concentrated on Flash Professional, which is a good general-purpose
    editor for both the user interface and the programming side of things. Flash seems
    to be moving towards a separation of tools between “designers” who concentrate
    on the interface and “programmers” who code in ActionScript. This is a similar
    model to what Microsoft is pushing for Silverlight. Flash is excellent for animation
    and for playing video, so it likely has a place in the arsenal of most e-Learning
    developers for that reason alone. It has pre-built learning objects and near Learning
    Interactions components that come with the product will only work in order ActionScript
    movies. But for those willing to do a bit of programming to complement its animation,
    graphics, and media capabilities, Flash is an outstanding, general-purposeing
    tool. I expect Silverlight to be a major competitor to Flash and grab some market
    share. But I think the result of the competition will be 1 make both products
    stronger and 2 push more e-Learning in particular and web applications in general
    away from HTML and JavaScript and towards the Flash or Silverlight players.


    Flash has a bigger set of commercial plugins than ToolBook and a particularly
    vibrant source community that creates plugins, editors, and more. There are no
    commercial add-ons in the e-Learning space to my knowledge, however. From my perspective,
    it doesn’t have the plugin or 3rd-party control momentum that Silverlight has
    already, but it seems to be stronger in open source support.'
