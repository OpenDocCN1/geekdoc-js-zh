  md: '# Reading XML


    XML is becoming increasingly prevalent in both business and e-Learning applications.
    It is a preferred way to store data because it is plain text and thus can safely
    pass through firewalls¹. More advanced learning applications store their content
    in XML and then load that content "the fly" at runtime. We won''t go far here
    since we''ve already covered how to dynamically load graphics and media. Instead,
    we''ll read the "resources" of a SCORM manifest and show them in a field. Listing
    64 shows the main section of the manifest. Our task will be to read the href attribute
    of each file listed.


    ```

    <?xml version="1.0"?>

