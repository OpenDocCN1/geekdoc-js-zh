  md: '# Programming for e-Learning Developers


    find the list in the online help. To designate that you are handling an event
    (as opposed to writing a function, which we will learn to do later), use the handle
    syntax. Next, we forward the message. A powerful feature of ToolBook is the concept
    of the message hierarchy, allowing messages to "bubble" to higher levels. Later,
    we''ll look at how we make good use of this hierarchy.


    After forwarding the message, we call a function or generically, a method, of
    the language. In this case, the function is ASYM_MessageBox. It has four parameters
    that we are using:


    +   - The text of the message.

    - The caption of the message box.

    - The name of the icon to use.

    - What button(s) to display.


    ![](img/489f8caeddae410535f57c4dfc328dfc_29_0.png)


    Figure 1. "buttonClick" Message Box from ToolBook OpenScript


    A parameter is an input to a method that specifies initial data, the action to
    be performed, or anything else the author of the method desires. Parameters can
    be optional, meaning that a default value is used if one is not provided.


    Finally, we have an end line. Languages like OpenScript, the Actions Editor, and
    Visual Basic have some sort of end line in every method. ActionScript, JavaScript,
    and languages like C and C# use a bracket - to show when the ended.


    # ToolBook – Actions Editor


    The Actions Editor is a visual programming environment that is a front end for
    OpenScript in author mode or when deploying native .tkb and a front end for JavaScript
    when your ToolBook is exported to HTML. Once you open the Actions Editor for a
    particular object, it will pick a default event (on click in the click of a button).
    You can click on the event and see a list of all available events as shown in
    Figure 2. Any events which have actions associated with them (such as On click...
    in the Figure) are shown. Once you have the desired event, you drag actions (methods
    using our用語 from the previous section) from the Actions Palette shown to the left
    of Figure 4. There is only a single parameter for the Display alert method: the
    text to be shown in the message box. The result is shown in Figure 3. Notice that
    the caption of the message box is simply "Alert" and the icon is a standard "warning"
    icon.


    ![](img/489f8caeddae410535f57c4dfc328dfc_29_1.png)


    Figure 2. List of Available Events in the ToolBook Actions Editor.


    > The ASYM_prefix comes from the original name (Asymmetry) of the company that
    makes ToolBook. After Asymmetry, it became Click2 and is now Total Systems. The
    ASYM_ methods are typically written in OpenScript rather than built into the ToolBook
    engine itself.'
