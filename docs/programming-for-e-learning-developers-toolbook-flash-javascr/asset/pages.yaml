    case, we send a message back as the return value of the function. If there were
    no problems, then we send back a message that shows the email address(es) and
    subject.


    That''s the most involved code we''ve written so far. The nice thing is that you
    can reuse it over and for all of our applications that need to send email. We
    use a similar service to send 3000+ emails for our quarterly Enterprise newsletter.
    In our case, service takes the subject, the reply address, and the record numbers
    of the emails to send (e.g., records 1 to 500). It then reads the list of recipients
    from a query on the database, puts their first name in the right spot and grabs
    the email, and then loops through the records to send the emails. We''ve found
    sending about 500 at a time avoids timeout issues. This is MUCH easier and faster
    than doing a mail merge from Outlook!


    Now that we have our code, how do we see it? We could go ahead and start connecting
    to our applications, but it would be nice if we could verify that it is OK first.
    Luckily, Visual Studio will create a test page for you automatically. The first
    step is to make the web service "Start Page" of your project as shown in Figure
    62. You can run the project from Visual Studio. You will see the web page at the
    top of Figure 63. It will show a link for each WebMethod that will bring the second
    page. Clicking on the link will bring the second web service. Notice how there
    is an entry field for each parameter. Enter the value you want to test and click
    the "Invoke". The return value will then be shown in a popup window. If you have
    Visual Studio up to debug the function (discussed later in the book), you can
    step through each line to make sure the logic and the variable values are exactly
    how you planned. Notice that you can also navigate to the web service after you
    put it on your web site to make sure you have the right URL and that all is set
    correctly. It will not generate the test page for you in that situation for security
    reasons. That only works when you run locally via localhost.


