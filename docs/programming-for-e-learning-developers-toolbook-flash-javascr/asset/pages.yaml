  md: '# Making SCORM Calls


    One of the biggest challenges with creating e-Learning is making sure it is properly
    tracked when you run it in a Management System (LMS). While tools like ToolBook
    and Flash give you a bit of tracking support out of the box, knowing how to interact
    with the LMS yourself can help control your bookmarking’, determine completion
    status, ask for the “mastery score,” and more. With HTML/JavaScript and Silverlight,
    you are all on your own for tracking. The original standard for communicating
    content and the LMS was the Aviation Industry CBT Committee (AICC) standard. It
    uses HTTP Post to do the communication. This has the advantage of easily supporting
    the content on one web server and the LMS on another server. Its main disadvantage
    is that HTTP Post is seen as more difficult for content to implement. I’m not
    sure about that, but it is clearly that the Sharable Content Object Reference
    Model (SCORM) is now the dominant standard, largely due to it being initially
    funded and adopted by the U.S. government. We looked at a SCORM manifest, which
    is part of its packaging specification, in the last chapter. Other main part of
    SCORM is its “Runtime Environment.” For that, SCORM uses an API model where messages
    between the content and LMS are passed via JavaScript. To introduce you how to
    make these calls we give you a “SCORM Tester” in each environment that you can
    use to test your LMS, we’ll create an interface to send and receive SCORM messages.


    # SCORM Runtime Environment Overview


    Before we jump into our examples, let’s take a quick look at how the SCORM Runtime
    Environment works. The gist is that the LMS launches the content in either a separate
    window or a frame. The content then “finds” the API JavaScript object in the LMS
    and does some handshaking” to establish communication. The content then asks (LMSGetValue
    for SCORM 1.2 and GetValue for SCORM 1.3/2004) for data (student name, pass score,
    suspend data?, etc.) from the LMS as


    +   1 Bookmarking is for returning to the user where she left off. This “bookmark”
    is stored in the LMS.


    +   2 Technically, this is called HACP for HTTP-based AICC CMI Protocol, where
    CMI in turn stands for Computer Managed Instruction. AICC also has an “API” protocol
    that was the base of the SCORM implementation.


    +   3 Common reason to have the content on a separate server is with commercial
    content where you are charging the user. Maintaining it on your own server allows
    you to manage the usage and so far. Having the content on a different server is
    difficult for SCORM because it is a JavaScript standard and “cross site” scripting
    is blocked in browsers in order to avoid “phishing” and other hacker attacks.


    +   4 This sounds weird but that it really means that the LMS must have a JavaScript
    object (variable) named “API” in SCORM 1.2 and “1484.11” in SCORM 1.3/2004. This
    object must have the methods discussed in the next section. We wrote our SCORM
    Watch tool to focus this API and give a mechanism to see the various messages,
    to be able to enter values as bookmarks, etc. I used SCORM Watch to test each
    of the samples in this chapter.


    +   5 Except ToolBookOpen, which is unable to support SCORM.


    +   6 Technically, the content calls the LMSInitialize method in SCORM 1.2 and
    the Initialize method in SCORM 1.3/2004.


    +   7 Suspend data is totally at the discretion of the content. It typically has
    a representation of the pages that have been completed but may have question status
    (e.g., resetting questions to their previous state), variable values, and more.'
