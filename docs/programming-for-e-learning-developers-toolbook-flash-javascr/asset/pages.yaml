  md: "# Handling a Click Event\n\n# Introduction\n\nMy first \"programs\" early in\
    \ high school consisted of figuring out how to send messages to the other teletype\
    \ machines and have them display messages like this:\n\nStop typing for 30 seconds.\
    \ The computer needs to cool down.\n\nChildish, I know. This type of program does\
    \ not respond to events but rather starts from the beginning and runs until it\
    \ ends. Similarly, when I wrote a FORTRAN program to calculate orbits in an Aeronautics\
    \ class at the Air Force Academy, I initialized some data in variables and the\
    \ program spat out¹. While these types of programs still have some use, the vast\
    \ majority of programs today (and certainly e-Learning programs) are driven. This\
    \ means they start up and then wait for the user or system to do something. This\
    \ might be clicking the next page button, selecting a menu item, waiting for an\
    \ audio or video to finish. So one of our first tasks is learning how to handle\
    \ events. We will do that in each of our target environments. This task will also\
    \ give us a brief introduction to each environment.\n\n# ToolBook – OpenScript\n\
    \nOpenScript² is the name of ToolBook's internal programming or scripting language.\
    \ It can be used for native CBT as well as for automation tools. OpenScript has\
    \ one of the easiest syntaxes for handling events. Listing 1 shows the syntax\
    \ for a simple \"buttonClick\" handler.\n\n```\nto handle buttonClick\nforward\n\
    get ASYM MessageBox(\"This is a test\",\"Programming 101\",\"information\",\"\
    OK\")\n buttonClick\n```\n\nListing 1. Handling the \"buttonClick\" Event in ToolBook\
    \ OpenScript\n\nThe result of clicking the button is shown in Figure 1. With OpenScript,\
    \ unlike some of the environments we will examine, the script editor does not\
    \ provide a list of available events, though you can\n\n> One reason this particular\
    \ program is memorable is that, at least in FORTRAN, variables (which we will\
    \ discuss shortly) did not need to be declared. Unlike most languages that allow\
    \ this, the type of variable is determined by the first letter of the variable.\
    \ So variables that begin with I are integers (which means they are numbers).\
    \ As luck I would have, the orbital equation had a variable that the degrees were\
    \ in radians. This means that 360° corresponded to 3.14 radians. It took many\
    \ hours before I realized that the error in the program was that an input of 1.64\
    \ radians was being truncated to 1 and hence causing the wrong answer!\n\n> Books\
    \ with OpenScript can also be deployed via the Neuron browser, but that is not\
    \ very common due to its large size and the fact that it does not support SCORM.\
    \ Any OpenScript in a book gets lost when it is published to HTML, but that is\
    \ sometimes OK as we will see in later examples."
