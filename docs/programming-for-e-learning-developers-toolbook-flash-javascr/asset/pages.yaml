  md: '# Programming for e-Learning Developers


    # ToolBook – OpenScript


    Let''s look at the implementation of the top part of Figure 51 first. There are
    a number of ways to link to a URL in OpenScript. My personal favorite is shown
    in Listing 27.


    ```

    -- button script

    to handle buttonOnClick

    local string urlString


    urlString = text of field "WindowUrl"

    get tbfunction_ShowWindow(urlString)

    end buttonOnClick


    -- book script

    to get tbfunction_ShowWindow string url

    get ASYM_AddHyperlink(target,"showUrl", url, NULL,"popup", NULL, TRUE)

    get ASYM_DoHyperlink(target,"showUrl")

    get ASYM_ClearHyperlink(target,"showUrl")


    return TRUE

    endfunction_ShowWindow

    ```


    Listing 27. ASYM_AddHyperlink Implementation.


    In the button script, we get the URL that the person typed in¹ and put this in
    the urlString variable. We then call the tbfunction_ShowWindow function that is
    located in the book script. We put "tbfunction." at the beginning of the function
    name so that it will be recognized by the Actions Editor. We will cover this in
    the next section. Within this function, we call a built-in method ASYM_AddHyperlink.
    The most important parameters are the link name "showUrl" and the destination
    (the url that we passed as a parameter). This method does not actually launch
    the window since it can be used to create a hyperlink that will be initiated later
    by the user². To get the hyperlink launched this moment, we call the ASYM_DoHyperlink
    method. We tell it which object we are concerned with (this needs to match the
    first parameter in ASYM_AddHyperlink) and the link name. Note that we don''t have
    any ability to configure the characteristics of the browser (remove the toolbar,
    set the window size, etc.). We''ll get fidelity when we use JavaScript. Finally,
    we clear the hyperlink that we created³


    > ¹It would probably be a good idea to do error checking here to if the URL was
    well-formatted. It is easier to do in other languages with regular expressions,
    but we could check for http or "malTo" at the beginning of a start.


    > ²For example, if you use button for the link name, we will set up a hyperlink
    to be linked the user clicks on the button in question.


    > ³There is bit of a funny story about this line to clear the hyperlink. I had
    been using this example for a couple of years at The ToolBook User of Conference
    and noticed that I could get popup windows – only when running via HTML. In updating
    the sample for this book, I realized that the hyperlink was being maintained in
    the button and the HTML runtime was looking at the one (showUrl) and just executing
    it on the buttonClick. So I would have both the hyperlink and the JavaScript that
    we''ll cover in the next section!'
