    \ = null\nget ShellExecuteA(windowHandle32 of mainWindow, \"open\", url, \\\n\
    ullString, nullString, sw_showNormal)\n\nreturn TRUE\nend tbfunction_ShowWindow\n\
    ```\n\nListing 28. ShellExecute Hyperlinking Implementation.\n\nThis is our first\
    \ example of linking to a DLL. Native ToolBook and JavaScript (Internet Explorer\
    \ only) are the only ones of our target environments that can do this. Once we\
    \ correctly link the function(s) that we want to call, we use them just like the\
    \ built-in OpenScript methods. The most important parameters are the operation\
    \ \"open\" or \"print\", the file to use, and whether to show the application.\
    \ One challenge with this last parameter, though, is that we need to figure out\
    \ the numeric value that equates to the enumeration shown in the documentation.\
    \ In other environments, we might be provided with a list of valid values. But\
    \ here we have to search deeper to show that when launched (sw_showNormal) equates\
    \ to the number 1. By creating a variable with the name of what we are trying\
    \ to do, we make our code much more readable (e.g., as compared with putting in\
    \ \"1\" for the last parameter).\n\n> ⁴ Though there are Flash wrappers like Zinc\
    \ that can access to Windows DLLs. We actually use .NET Forms to embed the Active\
    \ XControl as our tracker program to manage Flash eendering outside the browser.\
    \ The .NET application then links to DLL's to do things like .ini files.\n\n>\
    \ ⁵ Figuring out how to link them is often tricky, particularly if the functions\
    \ contain pointers. The best bet is to find an example of linking the function\
    \ from Visual Basic and translate it. Here is the equivalent linking in VB:\n\
    Declare ShellExecute Lib \"shell32.dll\" Alias \"ShellExecuteA\" (ByVal hwnd As\
    \ Long, ByVal lpszFile As String, \nByVal lpszParameters As String, ByVal lpsDirectory\
    \ As String, ByVal lShowCmd As Long)\n\n> ⁶ Common use case of ShellExecute is\
    \ to print a document via Notepad, Word, or in case that you likely don't want\
    \ to show the application."
