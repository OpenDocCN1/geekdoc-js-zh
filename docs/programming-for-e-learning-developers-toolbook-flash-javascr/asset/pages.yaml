    Listing 104. Dog Class Inherited from the Animal Class in Flash.


    The most important line is public class Dog extends Animal. This is the way Flash
    implements inheritance. So we only need to "override" the items that we want to
    change. Everything else will inherit its functionality from Animal.


    We again start with our member variables. As we are only going to override the
    CommunicationSound and FavoriteFood properties, these are the only member variables
    we need. As with Animal, we then have a constructor that matches the name of the
    class.


    The only public method we want to override is DrawSelf. Notice how we use the
    override keyword to explicitly tell Flash that we are overriding the method in
    the base class. We then return the relative path for the dog image^8.


    We use a similar technique for overriding the CommunicationSound and FavoriteFood
    properties. Their code is exactly the same as for the Animal class except for
    the override keyword.


