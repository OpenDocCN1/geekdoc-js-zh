  md: '# Hyperlinking to a URL


    Clicking on "hyperlinks" is not only a critical part of the web itself but also
    important to many e-Learning applications. ToolBook and HTML itself make it easiest
    to hyperlink. But all of our environments do do this task with little work. To
    concentrate on the programming part of things, we will read the URL that we want
    to hyperlink dynamically. In our first example, the user can type a URL in a field
    and then click a "Show Window" button. In some environments, we''ll also be able
    to implement a "Close Window" button. In our second example, we''ll have one or
    more hyperlinks in a field. Clicking on the hyperlinks will bring up those sites
    in a browser. Figure 51 shows our first implementation.


    ![](img/489f8caeddae410535f57c4dfc328dfc_96_0.png)


    Figure 51. Hyperlinking Example - ToolBook OpenScript.'
