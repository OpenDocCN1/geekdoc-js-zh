    \ Menu Hotwords and Hyperlinks in ToolBookScript.\n do this as a notifyBeforePerPage\
    \ handler so it gets created automatically on each page. However, if we send this\
    \ as a native application, we don't want to keep creating the menu over and over.\
    \ We check the build-in system runtime and only run the code if we are in author-level\
    \ ToolBook. In that case, we first get the numPages from the pageCount property\
    \ of our book. We create our text and then step through each page (with step 2\
    \ as we are already on page 1). Within the step, we find the page (pageID), get\
    \ its name, and set the corresponding textline to value\". We then do another\
    \ step loop to create our hotwords. We select the appropriate textline² and then\
    \ send the createHotword message. This turns the current selection into a hotword.\
    \ The new hot object is contained in the system property, selectedHotwords. We\
    \ make a reference to where we want to go (pageID) and then use ASYM_AddHyperlink\
    \ to actually make the hyperlink. The first parameter is our new hotword (selectedHotwords),\
    \ the second is the event that will trigger the hotword (\"buttonClick\"), and\
    \ the third is the destination page (pageID).\nYou could do this manually (or\
    \ using an object from the ToolBook Catalog) as well. The advantage of doing itmatically,\
    \ however, is that it automatically updates itself as you add more pages.\n\n\
    Once we are done, we put a blank line (CRLF) at the end. We need this so we can\
    \ select this blank line at the end of the script. Otherwise, the script ends\
    \ up with the last textline being selected, which then makes the page look strange.\n\
    \ need two step loops because we get strange behavior when setting the inline\
    \ and selecting the text all at one time. ToolBook extends the selection and we\
    \ end up with one big hotword rather than individual hotwords for each page. There\
    \ are other solutions but doing two different step loops is the one I prefer."
