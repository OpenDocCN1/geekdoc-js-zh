  md: '# Sending Email


    As with our other examples, we call a formatBody function. The implementation,
    however, is somewhat convoluted. Rather than with the text directly, we need to
    call the JavaScript escape command, which puts the text in the format, converts
    spaces to %20 and a line feed to %0A. We importantly for our purpose, converts
    a carriage return to %D and We need to take account of the fact that Windows uses
    CRLF, Linux uses LF, and Macintosh uses CR$^{35}$. We need to use the JavaScript
    replace command to first look for CRLF, then just CR, and finally just in LF.
    Rather than have a loop and replace each occurrence in turn, we can take advantage
    of fact that the replace command can also take a string ("%0D%0A") or a Regular
    Expression ("%0D%0A/) for the first parameter. Regular expressions are outside
    the scope of this book, but the gist is that you specify a pattern that we are
    looking$^{34}$. The nice part in our context is that there is a global flag (/g)
    that says to replace all instances of the match. That''s why we use the replace(/%0D%0A/,<br
    />). When we are finished, we use the unset function to get back to the unescaped
    text.


    Once we have all the parameters, we are ready to create the XMLHttpRequest object
    that we talked about at the beginning of the section. We use the BuildXMLHttpRequestReference
    function, we use the JavaScript typeof to see if the browser has an XMLHttpRequest
    object. This was just to be for Firefox, Safari, etc., but Internet Explorer 7
    and later also has it. If not IE 6 and older), then we create the ActiveX$^{35}$
    version of XML. We now have our object, set its onstatechangeproperty to be the
    name of the method we want to call$^{36}$ when the state of the object changes.
    This is only relevant if we use asynchronously. Then we can open it, with the
    first parameter being the type of communication ("POST") as opposed to "GET",
    the second being the complete URL, and the third being whether it is asynchronous
    (the fact that this is true means our emailComplete function will be called each
    time the state of requests changes, including when it is complete). We set the
    RequestHeader to list of parameters in a query string format, where there is an
    & each name-value pair. From there, we call the method of our XMLHttpRequest object,
    passing in our parameters.


    Our emailComplete function will be called immediately and the sendEmail method
    in the web service sends a return value. We see now why we declared XMLHttpRequest
    outside the function


    $33$ Why did we need to worry about this in our previous examples? Native Book
    runs only on Windows, so the other environments don''t use. ToolBox Editors presentably
    checks this when it exports itself to JavaScript. We didn''t actually need this
    function. But if we do, we get the advantage that Flash controls our environment
    and this is largely independent of operating system.


    $34$ We use regular expressions in our Tracker.Next Learning Management System
    so that administrators can specify the format for usernames, and so forth. For
    example, this regular expression will make sure that all is in the form a@b.c:^[\w]+@[\w]+\.\w+\*$.
    There are few special validator controls in ASP.NET where you can give the regular
    expression and it will display a message to the user if the format is incorrect.


