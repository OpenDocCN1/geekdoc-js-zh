  md: '# Reading XML


    In our script, we read this file name from the field (in case the user wanted
    to enter a different path to try it). We then pass this file name to the tbfunction_readManifestResources
    function, getting back the list of resources. Those of paying attention earlier
    may notice we are ourselves to also call this function from the ToolBook Actions
    Editor by starting the name with tbfunction_. We then set the text of "xmlResult"
    to the resource list.


    The heavy lifting comes in the tbfunction_readManifestResources function. We put
    this in this book script that multiple pages can share it. We pass this function
    in fileName and declare a number of local variables. Note we don''t put a data
    type on variables like xmlDoc and node correspond to XML objects but don''t have
    ToolBook equivalents. We use the MpReadyState variable to make our code easier
    to read. As we did back in Listing 29, we use createAutoSync to start the server
    that we need, in this case the OpenScript doesn''t have a mechanism for receiving
    a "callback" like we get from other environments. We then call the extLoad method,
    passing in the fileName. If we get a "true" return value, we loop until the readyState
    of the document is completed. The mmYield and yieldApp are special ToolBook commands
    to free up the computer to other processes, in particular the loading of the XML
    file in this case.


    It might be helpful to refer to Listing 64 as you review this next section of
    code. The extDocumentElement, or the "root," is the manifest tag itself. It has
    three "child" nodes: metadata, organizations, and resources. We get our hands
    on this collection via the extChildren property. We then do a loop to look for
    the node we want using the extNext method to move from one to another. In each
    case, we check the extNodeName and see if it is "resources". If so, we findResources
    to true, which will cause us to exit out of the loop. Once we find the resources
    node, we get its extChildren and call extNext to get the resource node. We are
    now getting close to what we want. We use extChildNodes to get a collection of
    the file nodes. We do a step loop to find the attribute. Since there can be more
    than one attribute, we need to get the extAttributes collection of the node. This
    has a method called getExtNamedItem that we use to find the href attribute. From
    there, we get its extValue and add it to our resList that we return from our function.


    This is more of a "brute force" approach to reading XML that it uses a bit of
    knowledge of the structure of the XML document to get our hands on the data we
    want. You can use approaches like


