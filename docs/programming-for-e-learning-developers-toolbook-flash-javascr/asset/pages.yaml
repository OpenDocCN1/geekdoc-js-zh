  md: '# Programming for e-Learning Developers


    Still another way to use tbfunction_ShowWindow is with "automation." Automation
    is a general term for using software application to control another one. For example,
    we have forms in Access database that we use to hold our customers that call the
    Word envelope dialog box and populate it with the customer''s address. We can
    then just up an envelope in the printer and click the Print button. This is much
    faster than launching Word every time we want to print an envelope. It turns out
    that ToolBook has its "Shell Execute" functionality that can be reached via Automation.
    I wouldn''t recommend this for e-Learning applications as ASYM_AddHyperlink is
    easier and less reliant on things being installed. But Listing 29 shows a more
    advanced concept that could be helpful in another context. We also use automation
    in native ToolBook to read databases and read/write XML files, among other tasks.


    ```

    get tbfunction_ShowWindow string url

    local long sw_showNormal

    local string bs

    local shell

    ```


    ```

    bs = ASYM_BlockSuspend(

    shell = createAutoObject("TCOM.ShellAPI",null)

    get extShellExecute(0, "open", "", "", sw_showNormal) of shell

    get ASYM_RestoreSuspend()

    ```


    ```

    return TRUE

    end tbfunction_ShowWindow Implementation.

    ```


    **Listing 29.** Automation Hyperlinking Implementation.


    We anticipate the possibility that we won''t be able to perform the automation
    and call the ASYM_BlockSuspend method before the line(s) that may cause errors.⁸
    We launch the automation with the createAutoObject call. Notice that we didn''t
    declare a type for our shell variable. That is because an automation object is
    not a built-in OpenScript variable.⁹ We can call a method of the automation object.
    In OpenScript, properties, methods, and events of automation or ActiveX objects
    all start with ext. Notice that the parameters of extShellExecute are basically
    the same as for ShellExecute in Listing 28. We then call ASYM_RestoreSuspend to
    turn back on error messages.¹⁰


    > ⁷ Automation looks in the registry to find the "server" to launch. This server
    may not be there for a runtime ToolBook installation. Notice how we "block" error
    messages in Listing 29 to keep from a crash if the server is not there.


    > ⁸ This is similar to a Try - Catch switch of other environments. We''ll cover
    error handling in the book.


    > ⁹ If you look at it in the OpenScript debugger, all the time? it will be a number
    33455463. Basically any value other than blank it is working.


    > ¹⁰ Why not leave error messages off all? The reason is that we want normal error
    messages to display if there are unknown or unexpected errors. Otherwise, things
    could seriously go wrong due to low memory or other conditions and the user might
    not have the opportunity to stop the program before files are deleted or other
    problems occurred.'
