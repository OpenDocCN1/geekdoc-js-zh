    call. We use urlString to build a new URLRequest. We then create a URoader and
    URLVariables. We set up our accessKey and glossaryKey parameters of variablesid,
    which becomes the data of our requestid. We then Flash to use POST as the method
    and associate receivedGlossaryDefinition with the Event.COMPLETE event. Finally,
