    # ToolBook – Actions Editor


    ToolBook offers nice SCORM Runtime capabilities via the “Execute SCORM” action.
    They will only work once exported to HTML as native ToolBook cannot support SCORM.
    The Actions Editor uses the SCORM 1.2 terminology (Listing 70) but switches automatically
    to the 1.3/2004 version when it is running under version of SCORM. ToolBook does
    not provide an interface for LMSInitialize and LMSFinish since these are called
    automatically when you publish your content for SCORM as shown in Figure 100.
    We could make these calls ourselves by linking in a .js file and calling functions
    via the Actions Editor, but ToolBook does a good job of making the calls at the
    right time for us.


    > You need to make your parameters match the version, though, as ToolBook not
    swap them for you. For example, you use cmi.student_name to get the student name
    in SCORM 1.2 and cmi.learner_name in SCORM 1.3/2004.'
