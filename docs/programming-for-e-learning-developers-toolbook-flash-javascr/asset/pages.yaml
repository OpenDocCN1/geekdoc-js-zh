    and can error the values before allowing them to be set. But ToolBook OpenScript
    has only global and local variables. Global variables would work but they take
    up memory through the logic of the application and thus defeat the purpose of
    having a property in the first place as the calling application could read or
    set them directly. In OOP terms, this means ToolBook does not have encapsulation.
    Properties don''t hold memory and are more difficult for a calling application
    to work with directly.


