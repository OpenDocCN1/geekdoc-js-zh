  md: '# Debugging Your Applications


    Although all of us would like to write perfect programs from the start, rarely
    happens in the real world. We therefore need a way to figure out what is wrong
    with them. This is known as debugging. While entire books have been written on
    the subject, we can at least take a look at the core debugging techniques you
    can use in each of our environments.


    # ToolBook – OpenScript


    To debug OpenScript, you open the Script Editor for the script you are interested
    in (see Listing 46 for the original code we are debugging) and click the “Debugger”
    button on the toolbar as shown in Figure 135.


    ![](img/489f8caeddae410535f57c4dfc328dfc_314_0.png)


    Figure 135. Launching the ToolBook OpenScript Debugger from the Script Editor.


    The next step is to put in a “breakpoint.” This is where the script execution
    will stop and allow you to “step through” and watch the code. In OpenScript, you
    click on the line(s) where you want to stop. This is shown in Figure 136.


    > ¹ You can launch the debugger from the File menu in the Script Editor or from
    the right-click menu for the object containing the script (assuming you have ToolBook
    set to advanced items).


    > ² Sometimes you want multiple breakpoints. For example, you might have one inside
    a loop to look at the first few items. But you don''t necessarily want to go through
    each iteration of the loop. So you put another breakpoint before the loop and
    then jump to that one, see what the result is after the loop is completed. You
    can add this additional breakpoint initially or after you are in “debug” mode.'
