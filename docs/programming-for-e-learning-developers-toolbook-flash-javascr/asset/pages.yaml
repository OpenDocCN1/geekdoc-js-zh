  md: '# Programming for e-Learning Developers


    OpenScript has a complete set of drag & drop events and messages. It actually
    has a number of ways we could implement our screen. I wanted the dragged object
    to move with the mouse², which drove the design. The implementation is shown in
    Listing 76.


    ```

    -- source group script

    notifyBefore enterPage

    local dword num

    local field fieldId


    step num from 1 to 3

    fieldId = field("source " & num)

    position of fieldId = resetPos of fieldId

    end step

    end enterPage


    to get allowDrag

    return true

    end allowDrag


    to handle beginDrag

    system point initialPosition


    initialPosition = position of target

    end beginDrag


    -- page script

    to get allowDrop

    return true -- so stillOverDrop message

    end allowDrop


    to handle stillOverDrop object sourceId, point currentLocation

    position of sourceId = currentLocation

    end stillOverDrop


    to handle objectDropped object sourceId, point currentLocation

    system point initialPosition


    position of sourceId = initialPosition -- return to original spot

    end objectDropped


    -- target group script

    to handle objectDropped object sourceId, point currentLocation

    system point initialPosition

