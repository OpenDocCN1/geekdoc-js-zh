    # Inheritance


    Inheritance is a key concept in OOP. It is the process of allowing code reuse
    by allowing one class to inherit the methods, properties, and events of another
    one. Let’s expand our earlier example and assume that we needed to deal with soccer,
    baseball, and basketball teams as well as football teams. Rather than duplicate
    all the ProFootballTeams functionality in the other classes, it would be great
    more efficient and powerful if we could use a “base class” (Figure 160) that would
    include the common functionality. Each of the inherited classes could then “override”
    any methods or properties of the base class if its functionality needed to diverge
    from the base class.


