  md: '# Programming for e-Learning Developers


    | Visual Basic Access Modifier (in order of decreasing restrictiveness) | ActionScript
    Modifier (valid only in ActionScript Classes) | Description |

    |---|---|--|

    | Private | private | Can only be accessed by the class. The variable, method,
    or property cannot be accessed by an inheriting class or another object. |

    | Protected | protected | Can be accessed from within the class or from any inheriting
    class, but not from any other objects. |

    | Friend^17 | internal | Any object within the current assembly or package^18
    can access the object. So a form could access a Friend variable from another form
    in the same project. However, a form could not access a Friend variable of a custom
    control used on the form if control is from a different assembly (the normal case).
    This is the default for ActionScript. |

    | Protected Friend | N/A | This is a combination of Protected and Friend. It is
    less restrictive since a Protected Friend object can be accessed either from an
    inherited object (even if in another assembly) or from any object within the current
    assembly. |

    | Public | public | Can be accessed from any other object. |

    | Shared | static | The variable or property is accessible from the class level
    rather than needing an instance of the class. |


    Table 2. Access Modifiers


    As a general rule, you should make your variables and objects as restrictive as
    possible. You can then loosen access later if needed.


    > ^17 Although these are in order of restrictiveness, and it is interesting to
    note when you set the Modifiers property of a control on a form to Protected,
    you can write code for events of that control on an inheriting form. You cannot
    do this if the Modifiers property is set to the default of Friend.


    > ^18 .NET or Silverlight assembly corresponds to your .dll or .exe, which in
    turn corresponds to your project. A Flash package is a way to bundle classes together
    to allow code sharing and help avoid naming conflicts.


