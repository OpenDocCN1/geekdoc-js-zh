- img_proc: true
  md: '# Programming for e-Learning Developers


    support of the .NET component community³, however, I see Silverlight gaining momentum.
    As I mentioned above, I expect to see more web applications, including e-Learning,
    going to either the Flash or Silverlight players.


    All the major .NET component vendors such as Infragistics, ComponentOne, ComponentArt,
    etc. have released Silverlight control suites. These controls are mainly for business
    applications at this point, though some would be helpful in e-Learning applications
    as well.


    344'
