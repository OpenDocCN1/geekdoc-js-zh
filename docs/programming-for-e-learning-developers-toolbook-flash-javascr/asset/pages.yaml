- img_proc: true
  md: '# # Programming for e-Learning Developers

    ToolBook®, Flash®, JavaScript™, and Silverlight™


    As an e-Learning developer since 1993, I have found that a little programming
    can go a long way in terms of increasing our ability to create meaningful interactions
    for our users. To do that, however, understanding basic programming concepts like
    events, properties, and methods. Add to the requirement to perform more advanced
    tasks like adding hyperlinking, communicating via SCORM™ with your Learning Management
    System, loading media or graphics, and using a web service to send from your application,
    and you have the need for "real" programming. Rather than hiring a pricey consultant,
    however, you can use this book to learn the concepts to get the job done.

    Download the accompanying sample projects at www.plattecanyon.com/programming/book.aspx.


    Many e-Learning developers use multiple tools. If you stick to a single tool like
    Flash or ToolBook, you will likely have the need to master every JavaScript calls
    in order to get extra functionality. So rather than focus on a single tool, this
    book takes each of your programming challenges and solves it in ToolBook OpenScript,
    ToolBook Actions, Flash, JavaScript, and Silverlight. You may not use all of these
    environments currently, seeing the similarly of programming concepts across all
    the environments will enhance your skills in your tool(s) of choice.


    # About the Author


    Jeff Rhodes is the Chief Technical Officer and owner of Platte Canyon Software
    Corporation, a leader in developing commercial software that Improves the Lives
    of Training Developers He graduated at the top of his class at the Air Force Academy,
    where he received a Bachelor of Science in Electrical Engineering. Jeff received
    a Master''s degree in Economics from the London School of Economics, which he
    attended under a British Marshall Scholarship. Jeff is the author of VBrain.Net™
    Creating Computer and Based Training with Visual Basic® .NET and co-author The
    ToolBook® Companion. Jeff lives in Colorado Springs with his wife Sue and Derek
    and Michael.


    > This is an absolute MUST HAVE! This book will help you understand the coding
    techniques and syntax between different tools and programming languages. Jeff
    takes us through many examples of easily understanding programming tasks detailing
    how to achieve these tasks using more than one tool. I highly recommend this book
    to you.


    - Peter Jackson, ToolBookDeveloper


