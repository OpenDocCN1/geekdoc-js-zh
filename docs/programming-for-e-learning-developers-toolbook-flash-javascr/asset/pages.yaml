  md: 'box. We put this in a try-catch block to avoid errors to the user if there
    is a problem such as them trying to access a directory that they don''t have rights.
    Since we have previously associated the SELECT event with the graphicsHandler
    method, that will be called once the user clicks the "OK" button in this dialog.


    Within graphicsHandler, we get our hands on the files that the user selected in
    the dialog by getting the event.target and "casting" as a ReferenceList. This
    tells Flash what kind of object to expect and allows us to iterate through the
    "collection" of files. To do that, we use a for loop to get our hands on each
    FileReference inside the list of our FileResource. We first run into this type
    of loop when we are sending email from ASP.Net in Listing 43. The nice thing about
    each loop is that we don''t need to know how many items are within the collection.
    The loop just grabs one at a time. At a minimum, we need to specify a label, since
    that is what is displayed in the list. We specify that the method is unique to
    Flash the List component. We can also specify data, which is not shown but can
    be read programmatically from the selection¹⁵. In our case, we don''t need data
    so we set the label to be the name of our FileResource. We have looped through
    all the selected files, we set the loadedGraphics variable to true so that we
    know we don''t need to load the list again.


    We get similar logic in the loadMedia method. We get the fileName in the same
    way and clearMedia. But since there are different types of media that need different
    operations, we use the indexOf to see which type we are working with. If the file
    is a video (.flv file) we just set the source property of our flPlayer component
    to fileName. Then we need to show the player.


    If we are playing a .mp3 file, we make a new Sound object. Then we make a URLRequest
    object that points to the sound. This basically the reverse process of our use
    of URLRequest to do an HTTP Post (Listing 47). There were sending a request to
    another page. Here we are loading from an external file. If we use our URLRequest,
