  md: 'Appraisal    ◾    **243**


    UI components such as Buttons and Labels may also be found in tns-core-


    modules. Core Modules additionally provide networking, timing, appli­


    cation settings, and data features such as working with observables and


    observable arrays.


    Learning Partners


    We could learn NativeScript independently, but it’s typically best to work


    with a Learning Partner. A Learning Partner can hold us accountable and


    keep us disciplined as we go through the learning process. Having some­


    one to explain what we’ve just learned may help absorb things faster, and


    they can correct us when we’re incorrect while also sharing their expertise.


    We may also collaborate on projects, sharing the amount of effort neces­


    sary to create a comprehensive app.'
