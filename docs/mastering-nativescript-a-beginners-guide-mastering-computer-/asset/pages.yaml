    Using a Template


    A new application may be built by using the create subcommand of the tns


    command:


    tns create <app-name> --template <tns-template-name>


    Here,


    The template’s name is tns-template-name in this case.


    If we wish to use JavaScript to generate a template with only one page


    and no custom styles, use the following command:


    tns create <app-name> --template tns-template-blank


    TypeScript may be used to construct the same template as seen above:


    tns create <app-name> --template tns-template-blank-ts


    Template for Navigation


    The navigation template is used to construct applications ranging from


    modest to complicate. It includes a pre-configured SideDrawer component


    with several pages. The SideDrawer component provides a hidden view for


    navigation UI or common settings. To develop a navigation-based applica­


    tion, use the command below:


    tns create <app-name> --template tns-template-drawer-


    navigation


    Template for Tab Navigation


    To construct a tab-based application, a tab navigation template is utilized.


    It includes a pre-configured TabView component with several pages. To


    construct a tab-based application, use the following command:


    tns create <app-name> --template tns-template-tab-


    navigation'
