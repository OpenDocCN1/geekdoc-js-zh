    Now that we’ve scaffolded an app on our local computer, we’re ready to


    execute it on a device.


    Use tns Preview Command


    We’re working locally to the NativeScript Playground app for our iOS or


    Android device to link the app, so use the CLI’s tns preview command.


    Let’s have a look at how it works.


    In our terminal or command prompt, type the following command:


    tns preview


    • In your terminal, we’ll notice a QR code.


    • Then, on your iOS or Android smartphone, launch the NativeScript


    Playground app.


    • Scan the QR code that displays in our terminal or commands prompt


    using the Scan QR code option in the Playground app.


    • After scanning, our app should appear on our smartphone.


    • Now that we’ve installed the program, we could discover that the


    tns preview command in your terminal or command prompt never


    completed. That is, we are unable to type on our terminal.


    This is because the tns preview command is now monitoring our project for


    updates. When the tns preview command detects a code change, it automat­


    ically refreshes or livesyncs our app so we can see the changes right away.


