  md: 'Structuring Your App    ◾    **105**


    FlexboxLayout


    The FlexboxLayout is a non-conforming CSS Flexible Box Layout imple­


    mentation based on an existing Apache-2 licensed flexbox implementation


    provided at github.com/google/flexbox-layout.


    FlexboxLayout Properties


    **Property**


    **Description**


    **Values**


    flexDirection


    Gets or sets a value


    specifying the orientation


    of flex items in the flex


    container.


    • row (the same as text direction) is the


    default.


    • row reversal (opposite to text direction).


    • a column (same as row but top to


    bottom).


    • column reversal (same as the row-


    reverse top to bottom).


    flexWrap


    Gets or sets a value


    indicating whether the


    flex elements must be on


    a single line or flowing


    into multiple lines. If it is


    set to many lines, it also


    sets the cross-axis, which


    dictates the direction in


    which new lines are piled.


    • default nowrap (single-line, which may


    cause the container to overflow).


    • wrap (multilines, direction is defined by


    flexDirection).


    • reverse-wrap (multilines, opposite to


    direction defined by flexDirection).


    justifyContent


    This method returns or


    sets a value showing the


    alignment along the main


    axis. It aids in distributing


    extra free space when all


    of the flex items on a line


    are either inflexible or


    have reached their


    maximum size. It also has


    some influence over the


    alignment of items that


    overflow the line.


    • flex-start (items are packed closer to the


    start line) is the default.


    • flexible-end (items are packed toward


    end line).


    • the center (items are centered along line).


    • space-between (The items in the line are


    uniformly distributed; the first item is


    on the start line, and the last item is on


    the finish line.).


    • space-around (The objects on the line


    are uniformly spaced, with equal space


    surrounding them.).


    alignItems


    Gets or sets a value


    specifying how flex items


    on the current line are


    laid out along the cross


    axis. Consider it the


    justifyContent variant for


    the cross-axis


    (perpendicular to the


    main-axis).


    • flex start (The items’ cross-start margin


    edge is put on the cross-start line.).


    • flex-end (The items’ cross-end margin


    edge is positioned on the cross-end line.).


    • the center (The cross-axis is centered on


    the items.).


    • baseline (Items are aligned in the


    notion that their baselines are aligned.).


    • stretch (extend to fill the container


    while keeping the min/max widths in


    mind) default.


    *(Continued)*'
