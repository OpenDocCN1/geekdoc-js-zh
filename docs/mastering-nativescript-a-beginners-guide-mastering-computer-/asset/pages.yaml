    LAYOUT CONTAINERS IN NativeScript


    NativeScript provides a container component collection for the primary


    purpose of setting up UI widget components. Layout containers perform


    as the parent component and can have one or more child components.


    A layout container’s child components can all be organized using the


    approach offered by its parent layout container.


    NativeScript has six layout containers, which are as follows:


    • Container for absolute layout


    • Container for dock arrangement


    • Container for grid layout


    • Container for stack arrangement


    • Wrap layout container


    • FlexibleBox is a layout container


    In this session, we’ll go over all of the layout container principles in depth.


    AbsoluteLayout


    The AbsoluteLayout container is NativeScript’s most basic layout con­


    tainer. AbsoluteLayout imposes no constraints on its children and will'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'The Basics    ◾    **35**


    position them inside it using a two-dimensional coordinate system with


    the top-left corner as the origin.


    AbsoluteLayout positions its children using four attributes, which are


    as follows:


    • **top:** Defines the child’s position in the y direction, starting at the


    origin and progressing downward.


    • **left:** The child is placed to the left of the origin, traveling sideways
    in


    the x direction.


    • **width:** Defines the child’s width.


    • **height:** Defines the child’s height.


    Let us add the AbsoluteLayout container to our application’s main page as


    shown below:


