    The removal of a NativeScript plugin is similar to the removal of an npm


    package.


    The NativeScript CLI deletes any plugin files from our app’s node mod­


    ules folder in the project’s root. The CLI also removes any plugin depen­


    dencies and the plugin from the root package.json file of our project.


    The removal of a NativeScript plugin is similar to the removal of an


