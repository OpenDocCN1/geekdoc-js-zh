    *Class Selector*


    Class selectors choose all views that belong to a specific class. The class is


    specified using the view’s className attribute.


    **Note:** To add a class to an element in JS/TS, the class rule must be


    in a CSS file higher up the component tree than the element, such as


    app.css.


    .title { font-size: 30 }


    *ID Selector*


    Id selectors pick all views that have the same id. The view’s id is set using


    the id attribute.


    #login-button { background-color: grey }


    *Hierarchical Selector*


    A CSS selector may contain more than one basic selector, and a combina­


    tory symbol may be added between selectors.


    • Descendant selection (space). For example, the following code will


    pick all buttons within StackLayouts.


    StackLayout Button { background-color: blue; }


    • (>) – A selection for direct children. Using the preceding example, if


    the CSS is modified to:


    StackLayout > Button { background-color: blue; }


    The background-color regulation is not going to be enforced. To use


    the selector, the WrapLayout element must be deleted so that the


    Button becomes a direct child of the StackLayout.


    • (+) – An adjacent sibling selector allows us to choose all elements that


    are siblings to a given element.'
