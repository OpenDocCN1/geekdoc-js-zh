    via the JavaScript API.


    NativeScript places a high value on the JavaScript programming lan­


    guage to create an efficient environment for developers. Because JavaScript


    is the de-facto standard for client-side programming (Web develop­


    ment) and every developer is familiar with the JavaScript language, it


    makes it easier for developers to get started with the NativeScript frame­


    work. NativeScript provides the native API at the lowest level via a set of


    JavaScript plugins known as Native plugins.


    NativeScript expands based on Native plugins by providing a plethora


    of high-level and simple-to-use JavaScript modules. Each module per­


    forms a specific job, such as accessing a camera or constructing a screen.


    All of these modules may be integrated with a variety of ways to create a


    complicated mobile application.


    Overview of the NativeScript Framework at a High Level


    • **NativeScript application:** NativeScript framework enables develop­


    ers to use either an Angular or a Vue style application.


    • **JavaScript modules:** The NativeScript framework has many


    JavaScript modules explicitly labeled as UI modules, Application


    modules, Core modules, and so on. All modules may be accessible


    at any moment by the program, allowing it to create any degree of


    complicated application.


    • **JavaScript plugins:** NativeScript framework has a vast array of


    JavaScript plugins for accessing platform-related functions. Modules


    use JavaScript plugins to offer platform-specific functionality.


    • **Native plugins:** Native plugins are built in a platform-specific lan­


    guage to cover the system functionality utilized by the JavaScript


    plugin.


    • **Platform API:** APIs given by platform manufacturers are referred to


    as platform APIs.


    In a nutshell, modules are used to construct and organize NativeScript


    applications. Modules are written in pure JavaScript, and modules access


    platform-related functionality via plugins, which, in turn, bridge the plat­


    form API and JavaScript API.'
