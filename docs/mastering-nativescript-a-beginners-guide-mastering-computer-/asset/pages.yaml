    DATA BINDING


    Data Binding is a fundamental element in both the NativeScript and the


    Angular frameworks. Data Binding, by definition, refers to a link (bind­


    ing) between a Data Model (Model) and a UI. Because this link or interac­


    tion mainly concerns data, we refer to it as Data Binding.


    One-Way vs. Two-Way Data Binding


    Data flows can occur in a variety of ways (data bindings):


    • **One-way data binding:** It is the most often used method of binding


    from Model to UI. A text saved in Model and shown on the UI in a


    text area control is an excellent example of such coupling.


    • **One-way to the source (to model):** Binding that changes Model in


    response to UI action. The best illustration of this is a button click


    event (tap).


    • **Two-way data binding:** Binding that combines the two preced­


    ing methods of binding. A common example is a text box field that


    receives its value from the Model and alters the Model based on user


    input.


    The NativeScript-angular plugin makes it easier to determine which data


    binding will be utilized. The binding infrastructure’s NativeScript com­


    ponent ties Model data to real native components (Android and iOS). The


    Angular component is used to provide proper binding context, change


    detection, and notifications. Using data binding in a NativeScript-Angular


    application is similar to using data binding in a conventional Angular web


    application.


    Let’s look at several instances of data binding with the NativeScript-


    angular plugin.


    • One-way data binding entails enclosing the target (UI) property in


    square brackets.


    <Label [text]=''model.mytext'' ></Label>


    • One-way source data binding entails enclosing the source event in


    brackets.


    <Button (tap)=''onButtonTap($event)''></Button>'
