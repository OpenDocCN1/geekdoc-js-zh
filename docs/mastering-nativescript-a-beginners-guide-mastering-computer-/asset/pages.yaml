    NAVIGATION IN NativeScript


    Users may utilize the navigation to swiftly swipe in to their preferred


    screen, move across an app, or complete a specific activity. The naviga­


    tion component assists us in implementing navigation from simple button


    clicks to more complicated patterns.


    The navigation differs significantly between the core and angular ver­


    sions of NativeScript. While the core framework navigation is the founda­


    tion for the navigation process, NativeScript’s Angular model incorporates


    and extends the core navigation notion to make it compatible with the


    Angular framework.


    In this section, we’ll look at both basic navigation concepts and angular


    navigation adoption.'
