    AbsoluteLayout


    The AbsoluteLayout is NativeScript’s most basic layout. It positions


    its children using absolute left-top coordinates. When the size of the


    AbsoluteLayout changes, it will not impose any layout restrictions on its


    children and will not resize them at runtime.


    AbsoluteLayout Child Properties


    **Property**


    **Description**


    Left


    The pixel distance between the child’s left edge and the left edge of its


    parent AbsoluteLayout client area is get or set.


    Top


    Gets or sets the pixel distance between the child’s top edge and the top edge


    of its parent AbsoluteLayout client area.


