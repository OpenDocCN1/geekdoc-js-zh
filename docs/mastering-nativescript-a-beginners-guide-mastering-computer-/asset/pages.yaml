    USING JavaScript TO ACCESS NATIVE APIs


    In this part, we’ll go through the fundamentals of using JavaScript to access


    native APIs. This section focuses on how basic types are mapped between


    JavaScript and the relevant native platform. After that, we’ll go through


    how complicated things are represented and accessed. Finally, we discuss


    TypeScript and the @nativescript/types add-on, which provide TypeScript


    definitions for both the Android and iOS development platforms.


    NativeScript provides access to all native APIs provided by the under­


    lying platform. Many things happen behind the scenes to produce this


    behavior. One of these is marshaling, which is transferring JavaScript and


    Objective-C data types for iOS to Java data types for Android.


    This section will teach us how to use JavaScript to access native APIs


    with various data type arguments.


    Numeric Types


    All native numeric types (e.g., char, short, int, double, float on iOS and


    byte, short, int, long, double, float on Android) are implicitly transformed


    to JavaScript numbers and vice versa. For example, on iOS, run the follow­


    ing code:


    • **iOS**


    console.log(''pow(3.5, 4) = ${pow(3.5, 4)}'');'
