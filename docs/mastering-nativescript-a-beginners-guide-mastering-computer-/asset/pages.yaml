    WrapLayout


    The WrapLayout is similar to the StackLayout in that it stacks all child


    components to one column/row, but it also wraps them to additional col­


    umns/rows if there is no space left. The WrapLayout is frequently used


    with elements of the same size, but this is not required.


    WrapLayout Properties


    **Property**


    **Description**


    Orientation


    This function returns or sets a value representing the flow direction.


    Items are grouped in rows when the orientation is horizontal. Items


    are placed in columns when the orientation is vertical. The horizontal


    setting is the default.


    itemWidth


    The width used to layout and measure each child is returned or set. The


    default value is Number.NaN, which does not limit the number of


    children.


    itemHeight


    This method returns or sets the height used to measure and layout each


    child. The default value is Number.NaN, which does not limit the


    number of children.


    **WrapLayout Child Properties**


    Example of “horizontal” orientation:


    <Page xmlns="http://schemas.nativescript.org/tns.xsd">


    <WrapLayout orientation="horizontal" width="200"


    height="200" backgroundColor="lightgray">'
