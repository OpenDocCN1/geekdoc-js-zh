    "blacklist": [


    "java.util:Locale*"


    ]


    }


    Rule Syntax


    Each list is made up of pattern items that share the following characteristics:


    The <pattern1>[:pattern2] format is used for entries.


    Pattern1 is matched against Java package names on Android, whereas


    matched pattern2--against classes, interfaces, and enums.


    On iOS, pattern1 matches Clang module/submodule names, whereas


    matched pattern2--structs, global functions, enums, Objective-C inter­


    faces, protocols, categories, constants, and so on.


    Wildcards (“*”: - any number of characters and “?”: - any single character)


    are supported in patterns.


    An unnamed or empty pattern is equal to being set to "*." (matching


    everything).


    Rule Semantics


    After assessing a platform’s filtering criteria, N CLI generates final whitelist


    and blacklist files in the native project for use by the corresponding meta­


    data generator. The blacklist is always the same as the one set by the app.


    While the flag whitelist-plugins-usages determine the whitelist:


    • If this is correct, the final whitelist is a concatenation of the use lists


    of all plugins and the app’s whitelist.


    • Otherwise, it is equivalent to the whitelist of the app.


    These two lists unambiguously dictate how filtering is carried out:


    • If the whitelist is empty, everything is assumed to be whitelisted by


    default.


    • Only entities that match a rule are deemed whitelisted if it contains


    at least one rule.


    • All entities that are not whitelisted or that meet a rule on the blacklist


    are removed from metadata.


    • The metadata includes all other entities.'
