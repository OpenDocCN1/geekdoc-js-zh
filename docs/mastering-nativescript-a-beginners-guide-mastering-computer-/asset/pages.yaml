    *Splices Die Hard*


    Working with large, short-lived objects can easily result in out-of-memory


    crashes. Because of the Android splice’s life cycle, disposing of large native


    instances necessitates a V8 GC followed by an Android VM GC (such as


    bitmaps).


    *Java Friendly*


    In general, the implementation is rather Java-friendly. It seldom necessi­


    tates the extra understanding of the runtime’s inner workings.


    Common Tips


    Large native objects may survive longer than necessary due to the intrinsic


    memory management of objects in runtimes. This might occur if the JS


    garbage collector does not execute for an extended period after the object


    has become GC-eligible. As a consequence, this object will retain a strong


    reference on the native side.


    One solution is to do several trash collections – both in JS/TS and on the


    native side (in case of running on Android). This is not, however, a low-cost


    business. Hand-triggering garbage pickups are not only time-consuming,


    but it may also interrupt routine garbage management.


    Another solution is to use the releaseNativeCounterpart method, which


    takes an instance of a native class as an argument and removes its strong


    reference in the runtimes. By doing so, the Android native garbage col­


    lector can destroy the potentially hefty native object on its next run if it


    considers it dead. Because there is no trash collector on iOS, invoking this


    function reduces the reference count of the native object by one, and if


    there are no other uses for this object, it is removed.


    If we try to utilize the native object in JS/TS after using the releaseNa­


    tiveCounterpart function, the behavior is unclear, thus only use this func­


    tion if we are certain the object will not be used again.


    In JS/TS, here’s an example of how to use the releaseNativeCounterpart


    function:


    const heavyNativeObject = new com.native.HeavyObject();


    releaseNativeCounterpart(heavyNativeObject); // All


    heavyNativeObject usages following this line would


    have unknown behavior'
