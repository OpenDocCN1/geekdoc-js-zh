    to our project’s root package.json file and resolves the plugin’s dependen­


    cies throughout this process.


    Installing Plugins as Developer Dependencies


    The command tns plugin add, as described above, is performing npm i


    --save behind the scenes. If we need to install a developer dependent (e.g.,


    @nativescript/types or @nativescript/webpack), we must explicitly save it


    as a devDependency. Use the npm install command with the --save-dev


    parameter to do this. As an example:


    npm i @nativescript/types --save-dev


    The distinction between dependencies and developer dependencies is that


    dependencies are necessary for running, whereas devDependencies are


    only required during development. As an example of dependence, con­


    sider the @nativescript/camera plugin, which is needed at runtime to


    access the hardware camera. The @nativescript/types, on the other hand,


    is a developer dependency that is only necessary for intelliSense during


    the development process. The devDependencies should not be installed as


    dependents (large application size) to prevent massive output build files.


    We can find an example package.json file that uses both dependencies and


    devDependencies here.


    Importing and Using Plugins


    After installing the required plugin, you may begin utilizing it in our proj­


    ect. It should be noted that each plugin may have its setup requirements;


    therefore, always read the plugin’s instructions and the README file


    thoroughly. The code sample below demonstrates the fundamentals of the


    @nativescript/camera plugin.


    import { requestPermissions } from "@nativescript/


    camera";


    requestPermissions();'
