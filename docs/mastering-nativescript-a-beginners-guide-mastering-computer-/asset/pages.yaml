    iOS APP EXTENSIONS


    iOS App extensions allow users to access the app’s functionality and con­


    tent from anywhere on iOS. App extensions allow users to engage with


    other programs while also accessing the app’s functionality without


    launching it. There are over 25 distinct App extensions templates in the


    most recent version of XCode. They encompass sharing, photo editing,


    file system access, widgets, custom alerts, actions, custom keyboards, and


    many other features. Each extension is a component of the app, but they


    also function independently.


    NativeScript App Extensions


    NativeScript CLI 5.3.0 included Beta support for iOS App extensions.


    While the extension should be created and developed in Xcode (using


    Objective-C), the resulting files can be integrated into an existing


    NativeScript app via a plugin (that contains the extension) or directly by


    introducing the extension files in a separate folder named the extension


    inside/App_Resources/iOS/extensions/.


    For example, if we have a TestExtension extension, the extension files


    should be stored under/App_Resources/iOS/extensions/TestExtension.


    Including an App Extension in an Existing Application


    **Prerequisites:**


    • The App extension that was generated.


    • Pre-existing NativeScript applications, we may use the create com­


    mand to construct a basic application for testing purposes.


    tns create today-extension --tsc


    To incorporate the App extension, follow these steps:


    1. Create a folder called extensions in /app/App_Resources/iOS/.


    2. Create a primary folder in the extensions folder that includes the


    extension files. Create a folder called TestExtension that contains all


    of the extension files, for example.'
