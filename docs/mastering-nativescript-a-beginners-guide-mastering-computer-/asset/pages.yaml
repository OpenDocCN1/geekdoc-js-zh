    multiple rows and columns, and even overlap. By default, the GridLayout


    has one column and one row. To add more columns and rows, provide


    column definition items (separated by commas) in the GridLayout’s col­


    umns property and row definition items (separated by commas) in the


    GridLayout’s rows property. The width and height of a column and row


    can be provided as an absolute number of pixels, as a percentage of avail­


    able space, or automatically:


    • **Absolute:** Pixels have a fixed size.


    • **Star (*):** Uses all available space (after filling all auto and fixed sized


    columns), proportionately split among all star-sized columns. So 3/7


    is equivalent to 30/70.


    • **Auto:** Uses as much space as the enclosed child element(s) requires.


    GridLayout Properties


    **Property**


    **Description**


    Columns


    A comma-separated text value indicates column widths. Column widths can


    be specified as an exact number, an auto value, or a *. A number represents


    the absolute column width, auto makes the column the width of its widest


    child, and * makes the column take up all available horizontal space.


    Rows


    A string value bounded by commas represents row heights. Row heights


    can be specified as an absolute number, an auto value, or a *. A number


    denotes the absolute row height, auto makes the row as tall as its highest


    kid, and * makes the row take up all available vertical space.


    GridLayout Child Properties


    **Property**


    **Description**


    Row


    Gets or sets a value indicating which row child content inside a GridLayout


    should be shown.


    Column


    Gets or sets a value indicating which column child content inside a


    GridLayout should be shown.


    rowSpan


    Gets or sets a value indicating the total number of rows spanned by child


    content within a GridLayout.


    colSpan


    Gets or sets a value indicating the total number of columns spanned by child


    content inside a GridLayout.'
