  md: '**46**    ◾    Mastering NativeScript: A Beginner’s Guide


    Fundamental Ideas


    In this section, we’ll look at how navigation works in core NativeScript.


    NativeScript divides navigation into four categories depending on the


    direction it applies:


    • Forward navigation


    • Backward navigation


    • Lateral navigation


    • Bottom navigation


    *Forward Navigation*


    Forward navigation refers to directing users to the next level of hierarchy.


    It’s built using two NativeScript components: Frame and Page.


    Frame 


    The root level component for navigation is the frame. It is not a


    visible container, but it serves as a container for page transitions.


    As an example, consider the following:


    <Frame id="featured" defaultPage="featured-page" />


    Here,


    Frame navigates to and renders the featured-page page component.


    Page 


    The Page component is located next to the Frame component and


    serves as a container for the user interface (UI) component. A simple


    example is shown below:


    <Page loaded="onPageLoaded">


    <ActionBar title="Item" class="action-bar"></


    ActionBar>


    <AbsoluteLayout>


    <Label text="label"/<


    <Button text="navigate(''another-page'')"


    tap="onTap"/>


    </AbsoluteLayout>


    </Page>'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'Structuring Your App    ◾    **47**


    Here, initially, Page loads and produces all of the UI components of the


    screen.


    When the user hits the button, they will be sent to another page.


    *Backward Navigation*


    The reverse navigation mechanism allows for backward travel via screens


    within the same app or across apps. It is the total opposite of forward navi­


    gation. To return to the previous page, use the simple goBack() function.


    It is defined as follows:


    <Page class="page" loaded="onPageLoaded">


    <ActionBar title="Item" class="action-bar">


    </ActionBar>


    <StackLayout class="home-panel">


    <Button class="btn btn-primary" text="Hack"


    tap="doHack"/>


    </StackLayout>


    </Page>


    Here,


    When the user touches the button, the goBack() function is called. If a


    previous page is accessible, goBack() returns the user to it.


    *Lateral Navigation*


    Lateral navigation is the movement of displays at the same level of hier­


    archy. It is built on the hub pattern. BottomNavigation, Tabs, TabView,


    SideDrawer, and Modal View are the navigation components that


    enable it.


    A basic example is as follows:


    <Page class="pages" xmlns="http://www.nativescript.


    org/tns.xsd">


    <ActionBar title="Hub" class="action-bar">


    </ActionBar>


    <StackLayout class="home-panel">


    <Button class="btn btn-primary"


    text="navigate(''featuredpage'')"


    tap="navigateToFeatured" />


    <Button class="btn btn-primary"


    text="navigate(''searchpage'')" tap="navigateToSearch" />


    </StackLayout>


    </Page>'
