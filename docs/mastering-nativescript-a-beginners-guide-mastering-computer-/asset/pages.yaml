    Interpolation


    A NativeScript-Angular application may also use the Angular mustache


    ({{}}) syntax for binding, often known as interpolation. It is simply another


    type of one-way binding used in the middle of a text.


    <Label text=''{{model.deliveryHour}}:{{model


