    them from being garbage collected). The word “splice” refers to the


    process of connecting an Objective-C instance of a class to a JavaScript


    instance.


    *Splice LifeCycle*


    A splice increases the ref-count of the Objective-C instance by one, and if


    the ref-count is more significant than one, the splice makes the JavaScript


    instance strong. From that moment forward:


    • When the Objective-C instance ref-count increases from 1 to


    2, the splice strengthens its weak reference to the JavaScript


    instance.


    • If the Objective-C instance ref-count is reduced from 2 to 1, the


    splice converts its strong reference to the JavaScript instance to a


    weak reference.


    • Only when the ref-count of the Objective-C instance is one will


    the splice have a weak reference to the JavaScript instance, making


    the JavaScript instance suitable for trash collection. If the GC can­


    not contact this JavaScript instance from an alive JavaScript object,


    it will mark it for collection. After that, when JSC finalizes the


    JavaScript instance, the splice will schedule a decrementation of the


    Objective-C instance’s ref-count, finally deallocating it and dispos­


    ing of the splice.'
