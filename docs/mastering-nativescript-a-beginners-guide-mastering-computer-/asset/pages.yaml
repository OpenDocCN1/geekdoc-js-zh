    Software Design Patterns


    Another point to remember relates to Software Design Patterns.


    Before we begin coding, we should have a plan for structuring the code,


    the many components that will comprise our app, and how each compo­


    nent will interact with others.


    Different Software Design Patterns are often used to structure code. For


    example, in NativeScript Core, the Model View ViewModel (MVVM) par­


    adigm is extensively employed. MVVM allows us to divide our code into


    distinct concerns. The Model represents the app’s data and business logic.


    The ViewModel is located between the Model and the View and serves as


    a conduit for information between the two. When there is a change in the


    Model, the ViewModel notifies the View so that the View may update itself


    appropriately.


    It can also communicate events from the View to the Model. The View


    is in charge of the app’s UI. It subscribes to the ViewModel to receive data


    and change UI components accordingly.


    The Model View Controller (MVC) paradigm is used by default in


    NativeScript Angular and NativeScript Vue. The Controller is in terms of


    maintaining the Model and View up to date. It receives input and updates


    the associated variables. It communicates data between the Model and the


    View.


    Core Modules


    When studying NativeScript, we should also be well familiar with the


    framework’s Core Modules.


    NativeScript has several modules that are automatically packaged into


    your application when we create a new project. The Core Modules offer


    the necessary abstraction for accessing the underlying native platforms.


    The Gesture module, for example, exposes a standard JS API for translat­


    ing application TypeScript/JavaScript code into native gestures API calls.


    The Core Modules also include a simple XML-based method for designing


    UIs, data binding, and navigation.


    Core Modules have available modules that aid in the creation of our


    app’s UI. For example, the layouts module under tns-core-modules offers


    layouts such as the StackLayout that assist us in arranging our UI elements.'
