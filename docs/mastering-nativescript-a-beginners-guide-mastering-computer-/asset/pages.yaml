    there may be situations when we need to make changes to files under the


    platforms/android directory. One example is when a plugin we’re attempt­


    ing to utilize does not immediately link the dependencies and files required.


    Then, in the app directory, remove all files except the App Resources


    folder. After that, make the following files:


    • app.js


    • app.css


    • notes-page.js


    • notes-page.xml'
