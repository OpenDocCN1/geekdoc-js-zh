    CFLocale (disabled by ‘CoreFoundation*:*’) – when no whitelist rules


    exist, a blacklisted symbol will display only the rule that disabled it.


    • **verbose:** Blacklisted NSString from Foundation.NSString – Some black­


    listed symbols will not define a rule when at least one whitelist rule. This


    signifies that the symbol did not meet any of the whitelist criteria.


    • **verbose:** Blacklisted PHImageContentModeDefault from Photos.


