    Step 1: Design Our App Icons


    The icon of our app is the first thing customers notice about it. When we


    create a new NativeScript app, we are given a placeholder icon, which is OK


    for development, but we must change the placeholder icon with the image


    we want to use in the stores for production.


    To receive our production-ready app icon files, first, generate a 1024 ×


    1024 pixel.png image asset that symbolizes our app. As an example, here’s


    the graphic we used for Pokémon Types.


    If we deal with designers, this is the point at which we should ask them


    to generate the final picture file for us. There are a few websites that can


    assist us if we do not deal with expert designers. For example, we pur­


    chased the Pokémon Types icon from VectorStock, which sells high-quality


    graphic assets for a few bucks.


    VectorStock is one of several websites that provide high-quality picture


    files that may be used as icons for a reasonable fee.


    To make matters harder, both iOS and Android demand that we sup­


    ply a wide range of icon pictures in several sizes. But don’t panic; once


    we have a 1024 × 1024 image, a few websites will produce photos in the


    different sizes that Android and iOS demand. We propose the Brosteins’


    superb NativeScript Image Builder, accessible at nsimage.brosteins.com,


    for NativeScript development.


    Visit the website, locate the “Upload an Icon” box, choose a freshly created.


    png file, and select the “Upload App Icon” button.


    How to utilize the NativeScript Image Builder to generate the icon files


    required for our iOS and Android apps.


    When the Image Builder is finished, we’ll be prompted to download an


    icons.zip file. This download includes Android and iOS files containing


    the image assets we require.


    To place those images, begin by accessing our app’s app/App Resources/


    iOS/Assets.xcassets/AppIcon.appiconset folder. The NativeScript place­


    holder graphics for iOS may be found in this folder. Delete the whole'
