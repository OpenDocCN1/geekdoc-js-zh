    IN NativeScript, WORK WITH DATA


    As a developer, we’ll be learning the ins and outs of a new framework


    regularly. Although they differ, most frameworks appear to provide three


    key user interface (UI)-related functionalities: defining the UI, collect­


    ing data, and marrying the two together. NativeScript is no exception: we


    build our UI with XML, we retrieve data by writing JavaScript code, and


    NativeScript’s data binding framework and observable objects make them


    work together.


    Why Do We Require Dynamic User Interfaces?


    We’ve known the value of dynamic UIs since the inception of the Internet: with­


    out them, we’d have to rely on vast volumes of text-based data on web pages.


    We’d manually update the data whenever it needed to be changed. We were


    lucky if we just had one copy of the data, but we had many copies in most situ­


    ations. One option was to store the data centrally and program the UI to pull


    data from the central location, dynamically modifying what the UI presented.'
