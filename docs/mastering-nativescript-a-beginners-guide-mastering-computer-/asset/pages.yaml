    </Page>


    *Bottom and Tab Navigation*


    Tab-based navigation is the most frequent type of navigation in mobile


    apps. The Tab navigation is either at the bottom of the screen or the top of


    the screen, below the header. It is accomplished by combining the TabView


    and BottomNavigation components.


    Angular-Based Navigation


    NativeScript’s navigation paradigm is extended to suit the Angular rout­


    ing idea. NativeScriptRouterModule is a new module created by extending


    Angular RouterModule.


    The NativeScript angular navigation notion may be divided into the


    sections listed below:


    • Page-router-outlet tag


    • nsRouterLink attractive


    • RouterExtension class


    • Custom RouterReuseStrategy


    In this part, we’ll go through all of the angular navigation topics men­


    tioned above.'
