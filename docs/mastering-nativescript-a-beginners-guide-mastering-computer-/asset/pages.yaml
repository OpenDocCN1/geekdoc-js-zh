    The navigateToFeatured function here uses the navigate() method to


    direct the visitor to the featured page.


    Similarly, the navigateToSearch function takes the user to the search page.


    The hub page may also be visited using the navigate method on the page


    screen, and the goBack() function can be used to exit the hub page.


    As an example, consider the following:


    <Page class="page">


    <ActionBar title="Item" class="action-bar">


