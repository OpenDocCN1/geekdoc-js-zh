    *Half-Dead Splice*


    Because garbage collectors drive collection, it is feasible to keep a weak


    reference to the JavaScript instance of a splice. The splice can reference the


    Java instance weak after a V8 GC, allowing the Android VM GC to col­


    lect it. Then, if the JavaScript instance is acquired through the weak refer­


    ence and its methods are accessed before the next V8 GC, it will access a


    half-dead splice (since the Java counterpart is dead already). The runtime


    error indicates that we were unable to locate an object with the supplied id.


    These issues are seen as random and are difficult to replicate.


    *Splices Die Fast*


    Several splices and JavaScript instances can be produced; however, proper­


    ties may be lost.


    JavaScript instances may be easily retrieved from splices that lack an


    implementation object. Consider the following execution sequence:


    • In JavaScript, a splice is constructed by obtaining an existing Java


    instance.


    • It is used for some work, and new JavaScript properties are assigned


    to it.


    • The JavaScript instance reference is removed.


    • During GC, V8 gathers the JavaScript instance, and the splice is


    deallocated.


    • The same Java instance is acquired a second time, and a new splice


    with a new JavaScript object is constructed and returned.'
