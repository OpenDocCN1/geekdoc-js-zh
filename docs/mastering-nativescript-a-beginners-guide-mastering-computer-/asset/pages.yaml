  md: '**14**    ◾    Mastering NativeScript: A Beginner’s Guide


    A NativeScript APPLICATION’S WORKFLOW


    NativeScript applications are made up of modules. Each module allows


    a different functionality. The following are the two most critical types of


    modules for bootstrapping a NativeScript application:


    • Page modules


    • Root modules


    Application modules include the Root and Page modules. The application


    module serves as the NativeScript application’s entry point. It bootstraps a


    page, allowing the developer to design the page’s UI, and lastly, allows the


    page’s business logic to be executed. An application module is made up of


    the three things listed below:


    • XML-based UI design (e.g., page.xml/page.component.html)


    • CSS-coded styles (e.g., page.css/page.component.css)


    • Actual module business logic in JavaScript (e.g., page.js/page.com­


    ponent.ts)


    NativeScript has a plethora of UI components for designing the application


    page. In an Angular-based application, UI components can be expressed


    in XML or HTML format. The application module uses the UI component


    to create the page, saved in a separate XML file, page.xml/page.compo­


    nent.html. CSS may be used to style the design.


    The design style is stored in a different CSS file, page.css/page.compo­


    nent.css, in application modules. The page’s functionality may be imple­


    mented using JavaScript/TypeScript, which has full access to the design


    and platform functionalities. The actual functionality of the page is coded


    in a different file, page.js/page.component.ts, by the application module.


    Root Modules


    NativeScript uses UI containers to control the UI and user interaction.


    Every UI container should have a root module via which it maintains its


    UI. There are two types of UI containers in NativeScript applications:


    • **Application container:** Each NativeScript application should have


    one application container, which is configured using the application.


    run() function. It sets up the application’s UI.'
