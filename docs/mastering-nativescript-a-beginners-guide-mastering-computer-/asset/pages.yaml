    Applying CSS Styles


    CSS styles may be applied at three distinct levels:


    • CSS that applies to all application pages is known as application-wide


    CSS.


    • **Component-specific CSS:** This only applies to components.


    • **Inline CSS:** CSS that is applied straight to a UI view.


    If CSS is defined at many levels, all of them will be applied. The inline CSS


    will be prioritized, whereas the application CSS will be prioritized last.


    Platform-specific CSS can also be used.


    Application-Wide CSS


    NativeScript checks if the file app.css exists when the program starts. If it


    does, any CSS styles contained in it are loaded and applied to all applica­


    tion pages. This file is a handy place to keep styles that will be used on


    several pages.


