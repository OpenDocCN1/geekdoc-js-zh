    Each View is measured during the measure pass to determine its target


    size. The measure pass evaluates the following qualities:


    • height


    • width


    • visibility


    • minWidth


    • minHeight


    • marginTop


    • marginLeft


    • marginBottom


    • marginRight


    Layout Pass


    Each View is assigned to a single layout slot during the layout stage. The


    intended size of the view (as defined by the measure pass) and the follow­


    ing characteristics determine this slot:


    • marginTop


    • marginRight'
