    Data Converters


    Data inside a Data Model is frequently stored in a manner optimized for


    the most outstanding performance of actions such as search, replace, and


    so on. Unfortunately, the way computers store data differs significantly


    from that in a human-readable format. The Date object is perhaps the fin­


    est example. Date in JavaScript is an extremely large number represent­


    ing milliseconds from January 1, 1970, which means nothing to a person.


    Here comes the usage of data converters, which are essentially functions


    that format the data (from the Model) in a human-readable manner (dis­


    play in UI).


    Angular employs the same notion and refers to it as a pipe (as in UNIX


    pipe) – a value is supplied to the pipe function, which alters it, and the final


    result is shown to the user. Using pipe is straightforward and follows the


    same syntax as UNIX pipe.


    <Label [text]=''model.deliveryDate | date:"fullDate"''


    ></Label>'
