    USER INTERFACE LAYOUT PROCESS


    NativeScript has a recursive layout framework that allows you to scale and


    arrange views on the screen. The process of measuring and placing layout


    containers and their child views is known as layout. The layout is a time-


    consuming technique, with the number of children and the complexity


    of the layout container determining its speed and performance. A basic


    layout container, such as AbsoluteLayout, may outperform a more compli­


    cated layout container, such as GridLayout.


    The layout is done in two passes: a measure pass and a layout pass. To


    that aim, each View has measurement and layout tools. Furthermore, each


    layout container has its onMeasure and onLayout methods for achieving


    its unique layout.


