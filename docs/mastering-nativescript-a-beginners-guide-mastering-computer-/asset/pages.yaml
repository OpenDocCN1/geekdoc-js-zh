    NativeScript is a free and open-source framework for creating native iOS


    and Android mobile apps. It is a framework that has been just-in-time


    (JIT)-compiled. NativeScript code is executed on the JavaScript virtual


    machine. It makes use of the V8 engine runtime on both the Android and


    iOS platforms. NativeScript is built with XML, JavaScript, and CSS. It fea­


    tures a WebIDE called PlayGround. This PlayGround includes an easy-to-


    use interface, project management, hot reloading, and device debugging.


