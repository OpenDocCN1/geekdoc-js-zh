  md: 'The Basics    ◾    **15**


    • **Mobile view container:** NativeScript manages Modal dialogues with


    the help of a model view container. Any number of model view con­


    tainers can be used in a NativeScript application.


    Like its content, each root module should only have one UI component.


    The UI component, in turn, might have children that are other UI com­


    ponents. NativeScript has many UI components with child functional­


    ity, such as TabView, ScrollView, and others. These can be used as the


    primary UI component. The frame is an exception since it does not have


    a child option but may be used as the root component. The frame has


    options for loading Page modules as well as navigating to other Page


    modules.


    Page Modules


    Every page in NativeScript is essentially a Page module. The Page mod­


    ule is built with NativeScript’s extensive range of UI components. Page


    modules are loaded into the application via the Frame component (by its


    defaultPage attribute or the navigate() function), which is then loaded via


    Root modules, which is then loaded via the application. While the pro­


    gram is running, use run().


