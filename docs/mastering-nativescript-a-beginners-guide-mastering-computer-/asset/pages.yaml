  md: 'Structuring Your App    ◾    **49**


    *Page-Router-Outlet*


    As previously stated, the page-router-outlet is Angular’s replacement for


    the router-outlet. The page-router-outlet covers the NativeScript core navi­


    gation framework’s Frame and Page strategy. Each page-router-outlet gen­


    erates a new Frame component, and the outlet’s defined components are


    wrapped in a Page component. The native navigate function is then used


    to travel to a different page or route.


    *Router Link (nsRouterLink)*


    nsRouterLink is Angular’s RouterLink substitute. It allows a UI compo­


    nent to use a route to link to another page. nsRouterLink additionally


    offers the following two options:


    • **page Transition:** This property is used to control the animation of


    page transitions. True enables the default transition. False disables


    the transition. The transition is determined by specific variables such


    as slide, fadein, and so on.


    • **clearHistory:** Boolean true clears nsRouterLink’s navigation history.


    Here’s a basic example of code:


    <Button text="Go Home" [nsRouterLink]="[''/home'']"


    pageTransition="slide" clearHistory="true">


    </Button>


    *Router Extension*


    NativeScript provides the RouterExtensions class, which exposes the basic


    NativeScript navigation mechanism.


    RouterExtensions exposes the following methods:


    • back


    • canGoBack


    • navigateByUrl


    • backToPreviousPage


    • navigate


    • canGoBackToPreviousPage'
