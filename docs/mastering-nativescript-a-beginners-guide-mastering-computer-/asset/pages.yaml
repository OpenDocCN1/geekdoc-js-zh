    Once our NativeScript mobile project has been established, we have two


    options for starting the application:


    • Using the preview command to run a preview build. This option


    allows us to test NativeScript quickly.


    • Using the run command to perform a local build. This option pro­


    vides us with the complete development experience (building and


    deploying on local emulators and devices).


