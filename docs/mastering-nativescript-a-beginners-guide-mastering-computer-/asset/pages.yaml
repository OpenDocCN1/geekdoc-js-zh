    However, if we want to deploy to iOS, we can still follow along because the


    code will be identical. The only differences are in the process of installing


    NativeScript and the instructions that are executed when the program is


    launched.


    Setting Up NativeScript


    To get NativeScript up and running, we must first install Node.js. After


    installing Node.js, run npm install -g nativescript in your terminal to


    install the NativeScript command-line utility.


    The last step is to install the development tool for each platform to


    which we intend to deploy. The Android SDK is what we’re looking for


    if we’re looking for a way to get started with Android. It’s XCode for iOS.


    After configuring our environment, run tns doctor to ensure that it’s ready


    for NativeScript development.


    **Note:**


    • Only Mac OS X computers may be used to build for iOS.


    • To work with iOS devices and projects, we must have Mac OS X


    Mavericks or later.


    • Our components are updated.


    • There were no problems discovered.


    There’s a statement stating that we can only create for iOS on Mac OS X


    PCs. This implies that if we’re using a PC, we can only deploy to Android'
