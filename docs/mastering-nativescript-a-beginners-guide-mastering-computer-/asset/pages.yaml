    BASICS OF THE NativeScript COMMAND-LINE INTERFACE


    In this section, we’ll learn the fundamentals of the NativeScript com­


    mand-line interface, such as creating new applications, getting those apps


    running on devices, and setting up a development pipeline that allows us


    to iterate quickly.


    Developing Applications


    The NativeScript CLI is used to develop and run programs in NativeScript.


    After installation, the NativeScript CLI is available as a tns command


    (Telerik NativeScript) on our terminal or command prompt.


    In this part, we will become acquainted with the NativeScript CLI and


    use the CLI’s create command to launch our first NativeScript app.


    Try with the tns create command.


    To build a new NativeScript application, open our terminal or com­


    mand prompt and type the following command:


    tns create HelloEveryone --template


    tns-template-blank-ng


    We’re telling the NativeScript CLI to build an app using a predetermined


    template named “tns-template-blank-ng” by supplying two arguments to


    the create command: HelloEveryone, which specifies the app’s name we’re


    constructing, and the template option.


    Because the NativeScript CLI needs to download a few dependencies


    while setting up our new project, the create command will take a minute


    to finish.


    When the program completes, use the cd command (change directory)


    to go to our new app folder.


    cd HelloEveryone'
