    DATA BINDING IN NativeScript


    One of the advanced ideas provided by NativeScript is data binding.


    NativeScript adheres as closely as possible to the Angular data binding


    idea. Data binding allows the UI component to display/update the current


    value of the application data model without the need for scripting.


    NativeScript allows for two types of data binding. They are listed below:


    • **One-way data binding:** When the model changes, the UI is updated.


    • **Two-way data binding:** Sync the UI and the model. When the model


    is changed, the UI is immediately updated, and when the UI receives


    data from the user (the UI is updated), the model is likewise updated.


    In this part, we’ll go through both notions.


