    Now that we’ve finished our iOS icons let’s move on to Android. To


    make matters worse, Android has an entirely distinct set of protocols for


    dealing with icons. (By the way, different processes for iOS and Android


    are a frequent topic in this section, so we’re prepared.)


    There is one more significant distinction we should be aware of before


    creating our Android images. Almost all app icons on iOS have solid color


    backgrounds. To blend in with other iOS icons, my Pokémon Types icon


    graphic has a solid white background.


    The backgrounds of iOS icons are often solid colors.


    On Android, though, icons often have a translucent backdrop. As a


    result, my Pokémon Types icon has a translucent background to blend in


    with other Android icons.


