    METADATA


    Both NativeScript runtimes require metadata to allow JavaScript code to


    invoke native iOS or Android code. It contains all of the necessary infor­


    mation about each of the supported native classes, interfaces, protocols,


    structures, enumerations, functions, variables, and so on. It is created at


    build time by inspecting the native libraries from the SDKs for the Android


    and iOS operating systems, and any third-party libraries and frameworks


    that the N application employs.


    Metadata Filtering


    NativeScript contains all supported entities in the metadata by default.


    This enables app and plugin developers to use JavaScript to call any native


    API. While it is useful during development, having information for all


    APIs is not always ideal. There may be security problems; runtime perfor­


    mance may suffer (due to a bigger metabase that must be queried when an


    unfamiliar item is encountered or at startup); or app size may rise owing


    to needless metadata that is never utilized.


    There is support for blacklisting and whitelisting symbols by their


    native name, giving developers control over what is or is not included in


    the output data.


    **Metadata Filtering rules in plugins:**


    Plugins can specify their list of APIs that are called from JavaScript in a


    file called native-api-usage.json, which can be found in each platform direc­


    tory (platforms/android or platforms/ios). It follows the same format as:


    {


    "uses": [


    "java.util:List"


    ]


    }


    **Metadata Filtering rules in apps:**


    Applications have the last say on what metadata filtering will be used.


    They supply native-api-usage.json files with the following format, which


    may be found in App_Resources/Android and App_Resources/iOS:


    {


    "whitelist-plugins-usages": true,


    "whitelist": [


    "java.util:Base64*"


    ],'
