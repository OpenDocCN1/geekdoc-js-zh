    EIGHT STEPS FOR LAUNCHING OUR NativeScript


    APP INTO APP STORES


    This section contains a step-by-step guide for submitting a NativeScript-


    built app to the iOS App Store and Google Play.


    • **Step 1:** Design our app’s icons.


    • **Step 2:** Create our splash screens.


    • **Step 3:** Set up our metadata.


    • **Step 4 (optional):** Install Webpack.'
