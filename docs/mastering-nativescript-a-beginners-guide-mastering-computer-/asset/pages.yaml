    SideKick is a graphical UI client that works with all operating systems. It


    streamlines the NativeScript CLI process and aids in the development of


    mobile applications.


    *Publish Our Sidekick App to Google Play Console*


    The download and installation of sidekick are dependent on our operating


    system. To run our app in Sidekick, follow the steps below:


