    CUSTOM webpack CONFIGURATION


    What Exactly Is webpack Configuration?


    The webpack configuration file webpack.config.js provides all of the con­


    figuration, plugins, loaders, and required to generate the JavaScript portion


    of the NativeScript application. The file resides in the NativeScript applica­


    tion’s root directory. The content of the file vary for each flavor (Angular,


    Vue.js, React, TypeScript, JavaScript) because the way the files are pro­


    cessed in the application differs. The default configuration file comes from


    the @nativescript/webpack plugin during its postinstall stage (or when we


    run the update-ns-webpack --configs script found in your project dir>/


    node modules/.bin/directory).


    We are continuously working to enhance the content of the default


    webpack.config.js files; therefore, we implemented a check to see if our


    application’s webpack.config.js file varies from the new default one and


    show a warning if it does. However, we’ll need to add some specific logic


    to our webpack.config.js file in many circumstances, such as if we have


    particular files to transfer or custom Android activity. In this situation,


    the above warning will appear every time we update @nativescript/web­


    pack. Also, if we want to ensure that we have all of the essential modifica­


    tions from the default webpack.config.js that comes with the new version


    of @nativescript/webpack, we must manually combine the two webpack


    settings.


    How to Use Custom webpack Configuration


    We may use a custom path to webpack settings starting with NativeScript


    v6.4.0 and @nativescript/webpack v1.5.0\. To achieve this we need to set


    webpackConfigPath property in our nsconfig.json file:


    Set in nsconfig.json


    {


    "webpackConfigPath": "./my-custom.webpack.config.js"


    }'
