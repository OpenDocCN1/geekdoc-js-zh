  md: '# 106 ■ Mastering NativeScript: A Beginner''s Guide


    | Property | Description | Values |

    | --- | --- | --- |

    | alignContent | Gets or sets a value that aids in aligning the lines within a
    flex container when there is additional space in the cross-axis, in the same way
    that justifyContent aligns individual items inside the main-axis. | - flex start
    (lines packed to the container''s beginning).

    - flex-end (lines packed to the container''s end).

    - center (lines packed to the container''s center).

    - space-between (lines are distributed uniformly; the first line aligns at the
    beginning of the container and the final one ends at the end).

    - space-around (lines that are distributed uniformly and have equal space between
    them).

    - stretch (lines stretch to fill the remaining space). When the flexbox has simply
    a single line, this attribute has no impact.


    | Property | Description |

    | --- | --- |

    | Order | This property returns or sets a value that alters the default ordering
    of flex components.

    flexGrow | Gets or sets a unitless number that acts as a percentage to indicate
    if the flex item can increase if necessary. It specifies how much space the item
    should take inside the flex container.

    flexShrink | Gets or sets a value showing the "flex shrink factor", which defines
    how much flex items shrink in comparison to the rest of the flex items in the
    flex container when there is insufficient space on the row. When it is missing,
    it is set to 1, and when distributing negative space, the flex shrink factor is
    increased by the flex basis.

    alignSelf | Gets or sets a value that allows the alignment for certain flex items
    to be overridden. This property accepts the same five values as alignitems: flex-start
    (cross-margin edge of the item is placed on the cross-start line), flex-end (cross-margin
    edge of the item is placed on the cross-end line), center (item is centered in
    the cross-axis), baseline (items are aligned such that their baseline is aligned),
    and stretch (stretch to fill the container but respect min-width). The default
    setting is stretch.

    flexWrapBefore | Gets or sets the boolean value that controls item wrapping. When
    set to true on a flexbox, it will compel it to wrap on a new line. The false value
    is the default. This attribute is not included in the flexbox definition.'
