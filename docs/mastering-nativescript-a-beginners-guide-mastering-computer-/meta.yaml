  md: '# 118 Mastering NativeScript: A Beginner''s Guide


    but we need to accomplish two things to build a release version of our Android
    app.


    +   - Make a file with the extension .keystore or .jks (Java keystore).

    - During a build, use .keystore or .jks file to sign our program.


    The Android manual provides several alternatives for creating our keystore file.
    Our favourite method is to use the keytool command-line software, which is included
    in the Java JDK on which NativeScript is based and should be available on our
    development machine''s command line.


    To use keytool to build a keystore for code signing, run the following command,
    replacing tj-vantoll with our name or the name of our firm and NameOfYourApp with
    the name of our app.


    +   - keytool -genkey -v -keystore tj-vantoll.jks -keyalg RSA

    - -keysize 2048 -validity 10000 -alias NameOfYourApp


    The keytool software will prompt various questions, some of which are optional
    (such as the name of our company and the names of our city/state/country). Still,
    the most critical are the passwords for both the keystore and the alias (more
    on that momentarily). Here''s how the keytool process looks when we build the
    keystore for Pokémon Types.


    Before we get into how to use this .jks file, there is one thing you need to know.
    Put this .jks file somewhere, and don''t forget the keystore or alias passwords.
    (To make my life easier, we like to use the same password for my keystore and
    aliases.) Android mandates us to use the same .jks file to sign any app updates.
    This means that if we lose the .jks file or its password, we will not update your
    Android app. We''ll have to establish a new entry in Google Play, and existing
    users will be unable to update.


    We''ll want to use a single keystore to sign all of our personal or company''s
    Android apps in most circumstances. Remember how we gave the keytool utility a
    -alias flag


    Now that we have this .jks file and have it safely stored somewhere, the remainder
    of the process is fairly simple. Run the tns build command, passing it information
    we needed to make the .jks file for.'
