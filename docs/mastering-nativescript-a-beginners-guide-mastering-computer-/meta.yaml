    that they are designated for collection at some time, and the reference to the
    Java equivalent will be rendered. The following Android VM GC will collect the
    Java instances, followed by the V8 GC, which will collect the JavaScript instances
    (because the Java counterpart will be deleted).


    # Half-Dead Splice


    Because garbage collectors drive instance of a splice. it is feasible to keep
    a weak reference to the JavaScript instance. The splice can reference the JavaScript
    instance after a V8 GC, allowing the Android VM GC to collect it. Then, if the
    JavaScript instance is acquired through the weak reference and its methods are
    accessed before the next V8 GC, it will access a half-dead splice (since the Java
    counterpart is already dead). The runtime error indicates that we were unable
    to locate an object with the supplied id. These issues are seen as random and
    are difficult to replicate.


    # Splices Die Fast


    Several splices and JavaScript instances can be produced; however, properties
    may be lost.


    JavaScript instances may be easily retrieved from splices that lack an implementation
    object. Consider the following execution sequence:


    +   - In JavaScript, a splice is constructed by obtaining an existing Java instance.


    +   - It is used for some work, and new JavaScript properties are assigned to
    it.


    +   - The JavaScript instance reference is removed.


    +   - During GC, V8 gathers the JavaScript instance, and the splice is deallocated.


    +   - The same Java instance is acquired a second time, and a new splice with
    a new JavaScript object is constructed and returned.'
