  md: '# Angular and NativeScript ■ 161


    Here is a list of the available ways:


    +   - **navigate():** Similar to Angular Router''s navigate() function, enables
    navigations in a page-router-outlet.

    - **navigateUrl():** Similar to the preceding method, this is an alternative to
    the Router navigateUrl() method, which works with page-router-outlet.

    - **back():** is the equivalent of the Angular Location back() function. It will
    return to the last outlet visited.

    - **canGoBack():** is a NativeScript-introduced method. It produces a boolean
    result indicating the user can return to the previous route.

    - **backToPreviousPage():** This function is identical to back(), except it skips
    navigations performed in an Angular router-outlet.

    - **canGoBackToPreviousPage():** This function provides a boolean value indicating
    if the user can travel back to a route that was loaded in a page-router-outlet.


    Custom Router Reuse Strategy

    NativeScript also imports a custom RouteReuseStrategy, which alters the lifespan
    of components through a page-router-outlet.


    A Component in the Angular router-outlet is destroyed when we navigate away from
    it and recreate when we go back to it. The component lifespan differs in no way
    between forward and backward navigation.




    Outlet of Router.


    The system will keep the navigation views alive in a native mobile application
    so that when you return to them, their view state will be preserved. Views are
    only damaged when we move away from them. Because the page-router-outlet contains
    native navigations, the lifespan of its components must mirror the lifecycle of
    the native views. The special NSRouteReuseStrategy does this.'
