  md: '# Appraisal


    NativeScript is a well-known framework for front-end, cross-platform programming
    that creates genuinely native apps with JavaScript.


    Progress created it in 2014, and it was rated “visionary” in Gartner’s Magic Quadrant
    for Mobile App Dev Platforms (MADP).


    It provides direct access to all native platform APIs using JavaScript, TypeScript,
    or Angular, resulting in enhanced native-like experiences on the web, iOS, and
    Android.


    NativeScript is a free and open-source mobile app development framework for iOS
    and Android. It is a framework that was JIT-compiled. JS virtual machine runs
    NativeScript code. On Android and iOS platforms, it makes use of the V8 engine
    runtime.


    NativeScript helps developers create native, cross-platform programs quickly and
    efficiently saving money on the development, testing, and training. As a result,
    native apps will remain rich and powerful for many years to come, making them
    better and easier to use.


    NativeScript apps, as seen, are written in a combination of JavaScript, XML, and
    CSS.


    # Advantages of NativeScript:


    +   * Simple learning curve

    * Supported by a solid community

    * Completely native performance

    * One code, many platforms

    * Direct, unrestricted access to iOS and Android APIs

    * JavaScript, TypeScript, Angular, Vue, and CSS are all well supported

    * A large number of plugins and templates are available to help with development
    speed'
