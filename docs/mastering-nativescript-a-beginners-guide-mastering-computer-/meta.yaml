    folder.

    If we want to directly add the plugin to our package.json and avoid any dependency
    concerns, use the following command instead of the previous one:


    ```

    npm i nativescript-barcodescanner

    ```


    If we wish to install developer requirements while developing, use the code below:


    ```

    npm tns-platform-declarations --save-dev

    ```


