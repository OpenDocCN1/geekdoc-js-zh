  md: "# 66 Mastering NativeScript: A Beginner’s Guide\n\nMarshaling\nFor both Android\
    \ and iOS platforms, the NativeScript Runtime supports implicit type conversion.\
    \ This is referred to as marshaling. NativeScript-iOS platform, for example, may\
    \ implicitly translate JavaScript and Objective-C data types, and Java/Kotlin\
    \ can be readily mapped to JavaScript project types and values. Let’s take a quick\
    \ look at how to marshal in each category.\n\nNumeric Values\nWe can convert numeric\
    \ data types from iOS and Android to JavaScript numbers. The following defines\
