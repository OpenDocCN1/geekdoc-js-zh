  md: '# 2 Mastering NativeScript: A Beginner''s Guide


    Instead, we want to learn how to create great cross-platform mobile apps utilizing
    our current abilities. We can develop a mobile app using NativeScript whether
    we''re a newbie who knows the fundamentals of writing web apps with HTML, JavaScript,
    and CSS or a seasoned professional.


    We''ll teach how to create cross-platform programs from a single code base NativeScript''s
    structured approach. When we''re completed, we''ll be able to construct our own
    Android and iOS mobile apps using our choice of technologies: HTML, JavaScript,
    and CSS or Angular, TypeScript, and CSS.


    In general, creating a mobile application is a time-consuming and challenging
    operation. There are several frameworks available for creating a mobile application.
    Android provides a native framework based on the Java programming language, whereas
    iOS provides a native framework based on the Objective-C/Swift programming language.
    However, to create an application that works with both operating systems, we must
    write in two distinct languages and use two different frameworks.


    Mobile frameworks support this functionality to solve this complication. The primary
    motivation for using a cross-platform or hybrid framework is to maintain a single
    code base more accessible. NativeScript, Apache Cordova, Xamarin, and many well-known
    frameworks are included.


    # JavaScript FRAMEWORK OVERVIEW


    JavaScript is a multi-paradigm programming language. It allows for functional,
    object-oriented, and prototype-based programming. Initially, JavaScript was employed
    on the client-side. JavaScript is now also employed as a server-side programming
    language. JavaScript frameworks are tools that make working with JavaScript easier
    and more fluid.


    Using this framework, programmers may quickly create a device-responsive application.
    One of several factors why this framework is becoming popular is its responsiveness.


    Let''s have a look at a few of the most popular JavaScript frameworks.


    # Angular


    Angular is a robust, efficient, and open-source JavaScript framework. We can create
    both mobile and desktop applications. Google uses this framework. It is used to
    create a Single Page Application (SPA).'
  merge: -1
  pgno: 24
- img_proc: false
  md: '# The Basics ■ 3


    # Vue.js


    Vue.js is a progressive JavaScript framework for creating dynamic web interfaces.
    It is a well-known framework for making web development easier. It can be readily
    integrated into large projects for front-end development. One of the most appealing
    characteristics for developing high-end SPAs is its dual integration option.


    # ReactJS


    ReactJS is a JavaScript toolkit for creating reusable user interface (UI) components.
    Facebook created it. It is presently one of the most popular JavaScript libraries
    with a solid base and a vast community.


    # Node.js


    Node.js is a cross-platform open-source runtime environment for creating server-side
    and networking applications. It is based on the JavaScript Engine of Google Chrome
    (V8 Engine). Applications built with Node.js are written in JavaScript and may
    be executed on OS X, Microsoft Windows, and Linux. It includes an extensive collection
    of JavaScript modules that simplify the construction of web applications.


    # NativeScript Overview


    NativeScript is a free and open-source framework for creating native iOS and Android
    mobile apps. It is a framework that has been just-in-time (JIT)-compiled. NativeScript
    code is executed on the JavaScript virtual machine. It makes use of the V8 engine
    on both the Android and iOS platforms. NativeScript is built with XML, JavaScript,
    and CSS. It features a WebIDE called PlayGround. This PlayGround includes an easy-to-interface,
    project management, hot reloading, and device debugging.

    NativeScript enables developers to rapidly and effectively construct native, cross-platform
    programs while saving money on the development, testing, and training. As a result,
    native applications will continue to be rich and powerful for years to come to
    make them better and simpler to use.

    Furthermore, NativeScript provides a plethora of features that make it simple
    to get started and use existing skills:


    +   - Uses your existing understanding of HTML, JavaScript, and CSS (no knowledge
    of Objective C, Swift, or Java is required).

    - Your code is only written once.'
  merge: -1
