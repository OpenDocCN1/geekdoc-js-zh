    * Styling NativeScript apps


    In the last chapter, we learned NativeScript''s architecture, installation, and
    use. This chapter will teach us about pages, navigation, layout, and how to style
    apps in NativeScript.


    NAVIGATION IN NativeScript


    Users may utilize the navigation to swiftly swipe in their preferred screen, move
    across an app, or complete a specific activity. The navigation component assists
    us in implementing navigation from simple button clicks to more complicated patterns.


    The navigation differs significantly between the core and angular versions of
    NativeScript. While the framework navigation is the foundation for the navigation
    process, NativeScript''s Angular model incorporates and extends the core navigation
    notion to make it compatible with the Angular framework.


    In this section, we''ll look at both basic navigation concepts and angular navigation
    adoption.


    DOI: 10.1201/9781003299394-2'
