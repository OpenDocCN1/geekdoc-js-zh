    \ = ${max(6,9)}');\n```\n\nHere,\nThe JavaScript number is converted from the\
    \ native max() method.\n\nAndroid Environment\nJava offers a variety of numeric\
    \ types, including byte, short, int, float, double, and long. JavaScript only\
