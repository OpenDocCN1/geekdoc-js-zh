    # Creating the APP


    The app that we create is a note-taking app. It will allow the user to make notes,
    each with the option of attaching a picture obtained with the device''s camera.
    The notes are saved using NativeScript application settings and can be erased
    separately.


    To begin, use the following command to generate a new NativeScript project:


    ```

