  md: '# Mastering NativeScript: A Beginner''s Guide


    +   - Set the following four values: For each padding, provide four values.

    The first value is applied to the top, the second value to the right, and the
    third value to the bottom, as well the fourth value to the left side (in that
    order).


    Alignments

    The layout uses horizontal and vertical alignment only when an element is given
    more space than it requires.

    The following table lists the permissible horizontalAlignment values.


    | Member | Description |

    | --- | --- |

    | Left | The view is aligned to the left of parent element''s layout slot. |

    | Center | The view is aligned to the center of parent element''s layout slot.
    |

    | Right | The view is positioned to the right of the parent element''s layout
    slot. |

    | Stretch | The view is extended to fill the parent element''s layout slot; if
    the width is specified, it takes priority.


    The following table lists the permissible verticalAlignment values.


    | Member | Description |

    | --- | --- |

    | Top | The view is positioned at the top of the parent element''s layout slot.
    |

    | Centre | The view is aligned to the center of the parent element''s layout slot.
    |

    | Bottom | The view is positioned at the bottom of the parent element''s layout
    slot. |

    | Stretch | The view is extended to fill the parent element''s layout slot; if
    height is specified, it takes priority.


    Percentage Support

    NativeScript allows us to provide % values for width, height, and margin.

    When a layout passes, the percent values are initially calculated based on the
    parent available size. This implies that if we position two buttons with height=''50%''
    on a vertical StackLayout, they will take up the entire available height (e.g.,
    they will fill the StackLayout vertically). The same holds true for margin characteristics.
    For example, if we specify margin-Left=''5%'', the element will have a margin
    equal to 5% of the parent''s available width.'
