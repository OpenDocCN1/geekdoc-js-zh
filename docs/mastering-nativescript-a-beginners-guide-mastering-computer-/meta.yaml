    # USING PLUGINS


    NativeScript plugins are npm packages that have some native functionality added
    to them. As a result, locating, installing, and deleting NativeScript plugins
    is similar to dealing with npm packages in Node.js or front-end web development.


    # Finding Plugins


    The NativeScript team runs an official marketplace, which offers a filtered list
    of npm plugins connected to NativeScript. All plugins featured in the marketplace
    will come with information that describes their quality. A search for “accelerometer”
    on the marketplace will lead us to the required plugin.


    Alternatively, because NativeScript plugins are npm packages, we may locate NativeScript
    plugins by searching for “nativescript-plugin-name” on npm’s homepage. For example,
    a search for “nativescript accelerometer” will direct us to the NativeScript accelerometer.


    If we cant find a plugin, you can always ask for help on Stack Overflow. The NativeScript
    team and community may be able to assist us in locating what we are searching
    for.


    Also, check over the NativeScript core modules, shipped as a dependency with every
    NativeScript project. There is a chance the functionality we want is already built-in.
    If we still can''t find what we are looking for, we may post a request for the
    plugin as an idea in the NativeScript community forum or try our hand at building
    it.


    # Installing Plugins


    Once we’ve identified the plugin we’re looking for, use the tns plugin add command
    to include it into our project:


    ```

    tns plugin add <pluginname>

    ```


    The following command, for example, installs the NativeScript camera plugin:


    ```

    tns plugin add @nativescript/camera

    ```'
