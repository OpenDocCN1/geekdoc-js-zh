  md: '# 184 ■ Mastering NativeScript: A Beginner''s Guide


    Creating an Android Virtual Device in Android Studio


    Follow the official guidelines on Creating and Managing Virtual Devices, which
    cover the process of downloading, installing, and utilizing Android Emulators
    in Android Studio.


    **Note:** If your top-level "Tools" menu lacks the "Android" option (a common
    problem in versions >3.0.0), follow the instructions in this Stack Overflow answer
    to add it to the toolbar and activate the AVD Manager.


    Using a Command-Line Tool to Create an Android Virtual Device


    The avmanager is a command-line program for creating and managing Android Virtual
    Devices (AVDs). The avmanager utility is included in the Android SDK Tools package
    (25.3.0 and above) and may be found at ANDROID HOME PATH>/tools/bin/. See the
    official avmanager documentation for further information on the avmanager and
    how to use it to build AVDs.


    To build a new AVD, use the following command syntax:


    ```

    $ cd $ANDROID_HOME/tools/bin

    $ avmanager create avd -name -k "sdk_id" [-c{path|size}] [-f] [-p path]

    ```


    We give the AVD a name and indicate the ID of the SDK package to use for the AVD
    using sdk_id enclosed in quotes. The following command, builds an AVD called using
    the x86 system image for API level 25:


    ```

    avmanager create avd -n test -k "system-images:android-25:google_apis;x86"

    ```


    It should be noted that the command indicates the system image has already been
    downloaded. Use sdkmanager "system-images:android-25:google_apis;x86" is an example.


    The following illustrates how to use the other options: -c path|size: the path
    to this AVD''s SD card image or the size of a new SD card image to generate for
    this AVD, in KB or MB, represented by K or M. -c path/to/sdcard/, or -c 1000M:
    force the AVD to be created. Use this same name.if we need to replace an existing
    AVD with a new one with -p path: the path to the directory where the files for
    this AVD will be produced. If no path is specified, the AVD will be produced ~/.android/avd.'
