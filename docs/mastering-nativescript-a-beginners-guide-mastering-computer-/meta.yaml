  md: '# 136 ■ Mastering NativeScript: A Beginner''s Guide


    Jscrambler (Protection+++)


    We have been in contact with the guys at Jscrambler for many years now, dating
    back to our days of hybrid app development. Jscrambler is a service that offers
    extensive JavaScript obfuscation and protection, to the point that the code is
    unintelligible even after beautifying.


    Jscrambler protects our code against tampering by converting our JavaScript into
    a resistant form to reverse-engineering using automated static analysis techniques.
    Jscrambler also supports “code locks,” limiting when, and by whom the Jscrambler
    may run.


    For example, in a NativeScript app, we can execute some JavaScript using Jscrambler.


