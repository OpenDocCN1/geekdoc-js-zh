  md: "```\n\"blacklist\": [\n  \"java.util.Locale*\"\n}\n```\n\n# Rule Syntax\n\n\
    List is made up of pattern items that share the following characteristics:\nThe\
    \ <pattern1>[:<pattern2>] format is used for entries.\nPattern1 is matched against\
    \ Java package names on Android, whereas matched pattern2--against classes, interfaces,\
    \ and enums.\nOn iOS, pattern1 matches Chang module/submodule names, whereas matched\
    \ pattern2--structs, global functions, enums, Objective-C interfaces, protocols,\
    \ categories, constants, and so on.\nWildcards (\"*\") - any number of characters\
    \ and \"?\" - any single character are supported in patterns.\n unnamed or empty\
    \ pattern is equal to being set to \"*\" (matching everything).\n\n# Rule Semantics\n\
    \nAfter assessing a platform's filtering criteria, N CLI generates final whitelist\
    \ and blacklist files in the native project for use by the corresponding metadata\
    \ generator. The blacklist is always the same as the one set by the app. While\
    \ the flag whitelist-plugins-usages determine the whitelist:\n\n+   * If this\
    \ is correct, the final whitelist is a concatenation of the use lists of all plugins\
    \ and the app's whitelist.\n* Otherwise, it is equivalent to the whitelist of\
    \ the app.\n\nThese two lists unambiguously dictate how filtering is carried out:\n\
    \n+   * If the whitelist is empty, everything is assumed to be whitelisted by\
    \ default.\n* Only entities that match a rule are deemed whitelisted if it contains\
    \ at least one rule.\n* All entities that are not whitelisted or meet a rule on\
    \ the blacklist are removed from metadata.\n* The metadata includes all other\
    \ entities."
