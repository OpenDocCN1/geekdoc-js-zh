  md: 'where,


    +   - the number represents the absolute column width.

    - specifies a column''s width concerning other columns. A number can follow it
    to specify how many times the column width should be relative to the other column.
    For example, 2* indicates that the column''s width should be twice the width of
    the smallest column.

    - auto specifies that the width of the column is the same as the width of its
    widest child.


    For example, *, 2 denotes two columns, the second of which will be double the
    size of the first.


    2. rows: Used to denote the default height of each row, separated by a comma.
    GridLayouts layouts its children using the attributes listed below:


    +   - row: The row number.

    - col: The number of the column.

    - rowSpan: rowSpan is the total number of rows that a layout''s child spans.

    - colSpan: colSpan is the total number of columns that a layout''s child content
    spans.


    We add the GridLayout container to our application''s main page as seen below:


