  md: '# Digging Deeper ■ 213


    iOS Safe Safe Area is a concept introduced by Apple in iOS 11. It is the screen
    region that is free to utilize and will not be impeded by system hardware or software.
    The safe zone does not always exist. It is influenced by the notch, the rounded
    edges of the screen, the status bar, the home indication, and elements of our
    program, as the action bar and the tab bar. Refer to the Apple documentation for
    a better understanding.


    NativeScript has included a default handling method for the iOS Safe Area since
    version 5.0. Certain container View components (those that can have children)
    overflow the safe area and are spread out to the screen’s boundaries by default.
    These container components are as follows:


    +   * Layouts

    * ListView

    * Repeater

    * WebView

    * ScrollView


    The internal workflow is as follows:


    +   * Measure pass: All components are measured in the screen’s safe region.

    * Layout pass: All components are displayed in full screen but are off-set to
    the safe area borders.

    * Layout pass: If the component is close to the safe region, it is altered and
    enlarged to the screen’s edges.


    # iosOverflowSafeArea Property


    The default behavior described above should give decent UX right out of the box.
    Additionally, NativeScript 5.0 introduces the iosOverflowSafeArea property, which
    may be used to modify how components handle the iOS Safe Area. If we want the
    component to extend to the screen’s boundaries when it borders the safe region,
    set this property to true. To expressly avoid this behavior, set it to false.
    True is the default value for container components. All other components are considered
    content that should be limited to the safe region and is set to false by default.'
