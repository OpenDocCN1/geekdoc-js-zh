    # Layout Properties


    Margins

    The distance between view and its parent is described by the four margin attributes
    (marginRight, marginTop, marginLeft, and marginBottom).

    When you set margins using XML, you have the option of using one of the following
    methods:


    +   - Set a single value: Please provide a single value that will be applied to
    all sides of the view.

    - Set the following two values: Provide two values. The first value is applied
    to the top-side, and the second to the right-side. The first value is then put
    to the bottom, while the second value is placed to the left-side (in that order).

    - Set the following four values: Give each margin four values. The first value
    is applied to the top, the second to the right, the third to the bottom, and the
    fourth to the left.


    Padding


    The padding attributes (paddingRight, paddingTop, paddingLeft, and paddingBottom)
    define the space between the layout container and its children.

    When you set paddings using XML, we can choose one of three techniques:


    +   - Set a single value: Provide a single value applied to all sides of the view.

    - Set the following two values: Provide two values. The first value is applied
    to the top side and the second to the right side. The first value is then put
    to the bottom, while the second value is placed on the left side (in that order).'
