  md: '# 230 Mastering NativeScript: A Beginner’s Guide


    There are four basic methods for targeting styles on iOS or Android:


    +   - Platform specific style sheets (styles.component.ios.css, styles.component.android.css)

    - Platform specific markup blocks (<ios> ... </ios>, <android> ... </android>)

    - Platform specific attributes (<Label ios:style=""" android:style="""))

    - Platform specific CSS rules (:host-content(ns-ios) .mystyle { }, :host-context(ns-android)
    .mystyle { })


    Multiple style sheets and CSS imports are the most frequent and stable techniques
    for handling platform-agnostic and platform-specific styles in NativeScript. To
    see this pattern in action, try out this Playground example.


    Using this pattern, a page (or component) contains three different style sheets:
    common, iOS, and Android. For example, for the page home.component.html, there
    would be three style sheets:


    +   - home-common.css

    - home.component.ios.css

    - home.component.android.css


    # Supported Selectors


    NativeScript recognizes a subset of CSS selector syntax. Here’s how to utilize
    the selectors that are supported:


    +   - Class selector

    - Type selector

    - Hierarchical selector

    - ID selector

    - Pseudo selector

    - Attribute selector'
