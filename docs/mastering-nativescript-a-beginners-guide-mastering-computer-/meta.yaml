    global CSS rules, and building and navigating the main page. Angular is concerned
    any of this; all it needs a location in the DOM to attach. Naturally, Angular
    apps must handle their initialization: modules, components, directives, routes,
    and DI providers. To make both paradigms operate together in a NativeScript Angular
    project, we create a wrapper object, platformNativeScriptDynamic, which sets up
    a NativeScript application and may bootstrap the Angular framework in a default
    place on the main UI page.


