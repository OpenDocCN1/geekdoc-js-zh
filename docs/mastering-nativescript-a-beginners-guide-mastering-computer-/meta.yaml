  md: "# Mastering NativeScript: A Beginner's Guide\n\nFundamental Ideas\n\nIn this\
    \ section, we'll look at how navigation works in core NativeScript. NativeScript\
    \ divides navigation into four categories depending on the direction it applies:\n\
    \n+   * Forward navigation\n* Backward navigation\n* Lateral navigation\n* Bottom\
    \ navigation\n\nForward Navigation\n\nForward navigation refers to directing users\
    \ to the next level of hierarchy. It's built using two NativeScript components:\
    \ Frame and Page.\n\nFrame The root component for navigation is the Frame. It\
    \ is not a visible container, but it serves as a container for page transitions.\
    \ As an example, consider the following:\n\n```\n<Frame id=\"featured\" defaultPage=\"\
    featured-page\" />\n```\n\nHere,\nFrame navigates to and renders the featured-page\
    \ page component.\n\nPage The component is located next to the Frame component\
    \ and serves as a container for the user interface (UI) component. A simple example\
    \ is shown below:\n\n```\n<Page loaded=\"onPageLoaded\">\n  <ActionBar title=\"\
    Item\" class=\"action-bar\">\\n  <AbsoluteLayout>\n    <Label text=\"label\"/>\n\
    \    <Button text=\"navigate('another-page')\" tap=\"onTap\"/>\n  </AbsoluteLayout>\n\
    </ActionBar>\n</Page>\n```"
  merge: -1
  pgno: 68
- img_proc: false
  md: '# Structuring Your App ■ 47


    Here, initially, Page loads and produces all of the UI components of the screen.


    When the user hits the button, they will be sent to another page.


    Backward Navigation

    The reverse navigation mechanism allows for backward travel via screens within
    the same app or across apps. It is the total opposite of forward navigation. To
    return to the previous page, use the simple goBack() function. It is defined as
    follows:


    ```

    <Page class="page" loaded="onPageLoaded">

    <ActionBar title="Item" class="action-bar">

    </ActionBar>

    <StackLayout class="home-panel">

    <Button class="btn btn-primary" text="Hack" tap="doHack"/>

    </StackLayout>

    </Page>

    ```


    Here,

    When the user touches the button, the goBack() function is called. If a previous
    page is accessible, goBack() returns the user to it.


    Lateral Navigation

    Lateral navigation is the movement of displays at the same level of hierarchy.
    It is built on the hub pattern. BottomNavigation, Tabs, TabView, SideDrawer, and
    Modal View are the components that enable it.

    A basic example is as follows:


    ```

    <Page class="pages" xmlns="http://www.nativescript.org/tns.xsd">

    <ActionBarBar title="Hub" class="action-bar">

    </ActionBar>

    <StackLayout class="home-panel">

    <Button class="btn btn-primary" text="navigate(''featuredpage'')" tap="navigateToFeatured"/>

    <Button class="btn btn-primary" text="navigate(''searchpage'')" tap="navigateToSearch"
    />

    </StackLayout>

    </Page>

    ```'
