    # iOS


    The Objective-C runtime lacks a garbage collector and instead depends on reference
    counting. The iOS runtime intercepts the retain and release calls of each Objective-C
    object. The Objective-C association API allows native objects to be dynamically
    given-value pairs. JavaScriptCore provides an API for protecting JavaScript instances,
    which may be used to make them strong or weak (i.e., allow or deny them from being
    garbage collected). The word “splice” refers to the process of connecting an Objective-C
    instance of a class to a JavaScript instance.


    # Splice LifeCycle


    A splice increases the ref-count of the Objective-C instance by one, and if the
    ref-count is more significant than one, the splice makes the JavaScript instance
    strong. From that moment forward:


    +   - When the Objective-C instance ref-count increases from 1 to 2, the splice
    strengthens its weak reference to the JavaScript instance.


    +   - If the Objective-C instance ref-count is reduced from 2 to 1, the splice
    reconverts its strong reference to the JavaScript instance to a weak reference.


    +   - Only when the ref-count of the Objective-C instance is one will the splice
    have a weak reference to the JavaScript instance, making the JavaScript instance
    suitable for trash collection. The GC will not contact this JavaScript instance
    from an alive JavaScript object, it will mark it for collection. After that, when
    JSC finalizes the JavaScript instance, the splice will schedule a decrementation
    of the Objective-C instance’s ref-count, finally deallocating and disposing of
    the splice.'
