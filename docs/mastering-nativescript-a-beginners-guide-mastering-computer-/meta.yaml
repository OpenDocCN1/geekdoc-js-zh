    # LAYOUT CONTAINERS IN NativeScript


    NativeScript provides a container component collection for the primary purpose
    of setting up UI widgets. Layout containers perform as the parent component and
    can have one or more children. A layout container''s children can all be organized
    using the approach offered by its parent layout container.

    NativeScript has six layout containers, which are as follows:


    +   * Container for absolute layout

    * Container for dock arrangement

    * Container for grid layout

    * Container for stack arrangement

    * Wrap layout container

    * FlexibleBox is a layout container


    In this session, we''ll go over all of the layout container principles in depth.


    # AbsoluteLayout


    The AbsoluteLayout container is NativeScript''s most basic layout container. AbsoluteLayout
    imposes no constraints on its children and will'
