    ```


    <ListView.itemTemplate> may be used to specify the items in the ListView. We''re
    going to use a GridLayout to make two rows and two columns. The columns property
    is used to indicate the number of columns in each row.


    In this situation, * indicates two columns, each taking up an amount of space
    in the current row. So, if the entire row is 300 pixels big, each column will
    be 150 pixels wide, so each * symbolizes one column, and a comma separates each
    one.


    The rows property is similar, it regulates how much space a single row takes up.
    It will only take up the space required by the children of each row if it is set
    to auto.


    After establishing the GridLayout''s rows and columns, we must specify if its
    children belong to which row and column. The first row includes the item''s title
    (1st column) and the delete button (2nd column). The picture that was connected
    to the item is shown in the second row (1st column). The row and column attributes
    for each element are used to specify the row and columns.


    Take note of the use of horizontalAlignment and VerticalAlignment as well. Consider
    this NativeScript counterpart of the HTML text-align property. We''re aligning
    UI components instead of text. VerticalAlignment may be set to top, bottom, center,
    or stretch, whereas horizontalAlignment can be set to right, left, center, or
    stretch. Most of them are self-explanatory, except for stretch, which expands
    to take up the available horizontal or vertical space.'
