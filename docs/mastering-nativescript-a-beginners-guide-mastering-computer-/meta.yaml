  md: '# Implementation Characteristics


    +   1. Native Instances Can Easily Leak: Because the JavaScript GC does not traverse
    native objects and fails to detect cycles, we may create a reference cycle in
    Objective-C that leaks native and JavaScript instances. Native tools (such as
    Xcode and Instruments) may be used to detect and locate leaking instances.


    +   2. Native Instances Might Be Deallocated Prematurely: We can allow instances
    to be prematurely collected when utilizing weak properties or APIs that include
    methods like setTarget:selector:... They add the Objective-C instance as a native
    target, but only via a weak Objective-C reference that does not increase the ref-count
    of the Objective-C instance. When the target ref-count stays 1, and the JavaScript
    instance of the splice, the Objective-C instance is likewise deallocated. The
    frustrating aspect is that the code works most of the time correctly. Still, owing
    to the non-deterministic completion of the GC, it will occasionally cause the
    aforementioned deallocation and cause the application to raise an exception or
    crash.


    +   3. Half-Dead Splice: The native Objective-C object is scheduled for deallocation
    when the JavaScript equivalent of a splice is collected. The native instance has
    a relatively short time window in which a message may be submitted (e.g., method
    call on a delegate normally held in a weak property). This will result in a call
    to a JavaScript instance that has already been collected.


    +   4. Extremely Objective-C Friendly: The implementation is very Objective-C
    friendly and predictable overall. Working with native APIs necessitates more attention
    to memory management, but nothing more than normal iOS understanding. It is incredibly
    user-friendly and does not cause interruptions in the main UI.


    +   5. Deep Hierarchies Die Hard: Based on number of nodes in the list, the amount
    of GC cycles required to collect a linked list from Objective-C to JavaScript
    is linear.


    Consider the following scenario (which is based on a genuine problem handled in
    @nativescript/core):


    ```

    Page -> StackPanel -> Button

    |.ios -> .ios | .ios

    UIViewController UIView UIButton

    ```'
