    accessible at any moment by the program, allowing it to create any degree of complicated
    application.


    +   **JavaScript plugins**: NativeScript framework has a vast array of JavaScript
    plugins for accessing platform-related functions. Modules use JavaScript plugins
    to offer platform-specific functionality.


    +   **Native plugins**: Native plugins are built in a platform-specific language
    to cover the system functionality utilized by the JavaScript plugin.


    +   **Platform API**: APIs given by platform manufacturers are referred to as
    platform APIs.


