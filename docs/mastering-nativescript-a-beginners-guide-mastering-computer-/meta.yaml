  md: '# Structuring Your App ■ 105


    # FlexboxLayout


    The FlexLayout is a non-conforming CSS Flexible Box Layout implementation based
    on an existing Apache-2 licensed flexbox implementation provided at github.com/google/flexbox-layout.


    FlexboxLayout Properties


    | Property | Description | Values |

    | --- | --- | --- |

    | flexDirection | Gets or sets a value specifying the orientation of flex items
    in the flex container. | - row (as as text direction) is the default.<br>- row
    reversal (opposite to text direction).<br>- a column (same as row top to bottom).<br>-
    column reversal (same as the row-reverse to top). |

    | flexWrap | Gets or sets a value indicating whether the flex elements must be
    a single line or flowing into multiple lines. If it is set to new lines, it also
    the cross-axis, which dictates the direction in which lines are piled. | - default
    nowrap (single-line, which may cause the container to overflow).<br>- wrap (multilines,
    direction is defined by flexDirection).<br>- reverse-wrap (multilines, opposite
    to direction defined by flexDirection). |

    | justifyContent | This method returns or sets a value showing the alignment along
    the main axis. It adds distributing extra free space when all of the flex items
    on a line are either inflexible or have reached their maximum size. If it has
    some influence over the alignment of items that overflow the line. | - flex-start
    (items are packed closer to the start line) is the default.<br>- flex-end (items
    are packed towards end line).<br>- the center (items are centered along line).<br>-
    space-between (The items in the line are uniformly distributed; the first item
    is on the start line, and the last is on the finish line).<br>- space-around (The
    objects on the line are uniformly spaced, with equal spacing surrounding them).
    |

    | alignItems | Gets or sets a value specifying how flex items on the current line
    are laid out along the cross axis. Consider the justifyContent variant for the
    cross-axis | - flex-start (the items'' cross-start edge is put on the cross-start
    line).<br>- flex-end (the items'' cross-end edge is positioned on the cross-end
    line).<br>- the center (The cross-axis is centered on the items).<br>- baseline
    (Items are aligned in the notion that their baselines are aligned).<br>- stretch
    (extend to fill the container while keeping the min/max widths in mind) default.
    |


    (Continued)'
