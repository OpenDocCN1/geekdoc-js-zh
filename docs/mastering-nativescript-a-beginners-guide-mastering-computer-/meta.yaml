  md: '# 180 Mastering NativeScript: A Beginner''s Guide


    We may also use the NPM command npm install instead of the NativeScript CLI command
    add if we like:


    ```

    npm i @nativescript/camera --save-save

    ```


    The installation of a NativeScript plugin is similar to that of a npm package.
    The NativeScript CLI gets the plugin from npm and places it in our project''s
    root node folders. The NativeScript CLI adds the plugin to your project''s root
    package.json file and resolves the plugin''s dependencies throughout this process.


    Installing Plugins as Developer Dependencies

    The command then plugin add, as described above, performing npm i --save behind
    the scenes. If we need to install a developer dependent (e.g., @nativescript/types
    or @nativescript/webpack), we must explicitly save it as a devDependency. Use
    the npm install with the --save-dev parameter to do this. as an example:


    ```

    npm i @nativescript/types --save-dev

    ```


    The distinction between dependencies and developer dependencies is that dependencies
    are necessary for running, whereas devDependencies are only required during development.
    As an example of dependence, consider the @nativescript/camera plugin, which is
    needed at runtime to access the hardware camera. The @nativescript/types, on the
    other hand, is a developer dependency that is only necessary for intelliSense
    during the development process. The devDependencies should not be installed as
    dependents (large application size) to prevent massive output build files. We
    can find an example package.json file that uses both dependencies and devDependencies
    here.


    Importing and Using Plugins

    After installing the required plugin, you may begin utilizing it in our project.
    It should be noted that each plugin may have its setup requirements; therefore,
    always read the plugin''s instructions and the README file thoroughly. The code
    sample below demonstrates the fundamentals of the @nativescript/camera plugin.


    ```

    import { requestPermissions } from "nativescript/camera";

    requestPermissions();

    ```'
