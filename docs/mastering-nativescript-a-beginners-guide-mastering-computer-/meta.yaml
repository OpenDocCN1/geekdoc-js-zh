    # OUR FIRST APPLICATION


    Make our First NativeScript Application:


    From setting up our development environment to launching the app on our device,
    We''ll guide through the whole process of creating an app with NativeScript. Here''s
    a synopsis of what I''ll be talking about:


    +   1. Installing NativeScript

    2. Creating the app

    3. Launching the app

    4. Application debugging


    We''ll be operating the app, particularly on the Android platform. However, if
    we want to deploy to iOS, we can still follow along because the code will be identical.
    The only differences are in the process of installing NativeScript and the instructions
    that are executed when the program is launched.


    Setting Up NativeScript


    To get NativeScript up and running, we must first install Node.js. After installing
    Node.js, run npm install -g nativescript in your terminal to install the NativeScript
    command-line utility.


    The last step is to install the development tool for each platform to which we
    intend to deploy. The Android SDK is what we''re looking for if we''re looking
    for a way to get started with Android. It''s XCode for iOS. After configuring
    our environment, run tns doctor to ensure that it''s ready for NativeScript development.


    Note:


    +   - Only Mac OS X computers may be used to build for iOS.

    - To work with iOS devices and projects, we must have Mac OS X Mavericks or later.

    - Our components are updated.

    - There were no problems discovered.


