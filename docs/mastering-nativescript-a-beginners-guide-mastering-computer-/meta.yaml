  md: '+   button[testAttr=''flower''] {...}: All buttons having a testAttr attribute
    containing a space-separated list of words, one of which is “flower,” are selected.


    +   button[testAttr|=flower''] {...}: Selects all buttons with a testAttr property
    that starts with “flower.” The value has to be a whole value, either like btn[testAttr]
    = ''flower'', or followed by hyphen (-), like btn[testAttr] = ''flower-house.


    +   button[testAttr^=''flower''] {...}: All buttons having a testAttr value that
    starts with “flower” are selected. It is not necessary for the value to be a whole
    word.


    +   button[testAttr$=''flower''] {...}: All buttons having a testAttr value that
    ends in “flower” are selected. It is not necessary for the value to be a whole
    word.


    +   button[testAttr*=''flo''] {...}: All buttons having a testAttr value of “flo”
    are selected. It is not necessary for the value to be a whole world.


    Attribute selectors could be used alone or could be combined with all type of
    CSS selectors.


    ```

    #login-button [testAttr=''flower''] { background-color: white; }

    [testAttr] {color: yellow};

    ```


    # Pseudo Selector


    A pseudo selector, also known as a pseudo class, is used to specify an element''s
    specific state. NativeScript currently only supports the highlighted pseudo selector.


    Root Views CSS Classes NativeScript adds a CSS class to the application''s root
    views for particular states to enable flexible style and theme.


    The following are the default CSS classes:


    +   - ns-root: class that is associated with the application''s root view.


    +   - ns-modal: class that is associated with the modal root view.'
