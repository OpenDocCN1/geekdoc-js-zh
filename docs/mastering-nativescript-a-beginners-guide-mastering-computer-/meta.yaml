  md: '# The Basics


    IN THIS CHAPTER


    +   * Intro to NativeScript


    In the early days of mobile applications (pre-iPhone), there was little emphasis
    on building code once and releasing it to numerous platforms. Developers were
    only concerned with getting an app into the Apple or Google Play stores as soon
    as possible. And if it meant their software wouldn''t work on all platforms, it
    was an acceptable trade-off.


    Today, the mobile world is constantly evolving, making it increasingly challenging
    to stay up with the latest technologies. As developers create apps, they must
    reach the broadest potential audience: concentrating on a single platform is no
    longer an option. Apps must be available on several platforms and devices.


    To stay up with the ever-changing environment, developers value any technology
    to streamline the mobile app development process.

    Developers now have several options for creating mobile apps targeting platforms
    from a single code base. NativeScript is one of these options, but it is far from
    the only one. Others, such as PhoneGap, Xamarin, and React Native, may be familiar
    to us. Each of these frameworks can create code once and deliver it to both Android
    and iOS, but we''re not here to dispute that framework is superior.


    DOI: 10.1201/9781003299394-1'
  merge: -1
  pgno: 23
