    # WrapLayout\n\nThe WrapLayout is similar to the StackLayout in that it stacks\
    \ all child components to one column/row, but it also wraps them to additional\
    \ columns/rows if there is no space left. The WrapLayout is frequently used with\
    \ elements of the same size, but this is not required.\n\n# WrapLayout Properties\n\
    \n| Property | Description |\n|---|--|\n| Orientation | This function returns\
    \ or sets a value representing the flow direction. Items are grouped in rows where\
    \ the orientation is horizontal. Items are placed in columns when the orientation\
    \ is vertical. The horizontal setting is the default. |\n| itemWidth | The width\
    \ used to layout and measure each child is returned or set. The default value\
    \ is Number.NaN, which does not limit the number of children. |\n| itemHeight\
    \ | This method returns or sets the height used to measure and layout child. The\
    \ default value is Number.NaN, which does not limit the number of children. |\n\
    \n# WrapLayout Child Properties\n\nExample of \"horizontal\" orientation:\n\n\
    ```\n<Page xmlns=\"http://schemas.nativescript.org/tns.xsd\">\n  <WrapLayout orientation=\"\
    horizontal\" width=\"200\"\n    height=\"200\" backgroundColor=\"lightgray\">\n\
    ```"
