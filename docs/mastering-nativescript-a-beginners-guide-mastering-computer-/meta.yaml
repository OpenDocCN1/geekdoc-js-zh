  md: '# Removing Plugins


    Run the following command from the command line to delete a NativeScript plugin
    from our project:


    ```

    tns plugin remove <pluginname>

    ```


    The following command, for example, removes the NativeScript camera plugin:


    ```

    tns plugin remove @nativescript/camera

    ```


    The removal of a NativeScript plugin is similar to the removal of an npm package.


    +   - The NativeScript CLI deletes any plugin files from our app''s modules folder
    in the project''s root. The CLI also removes any plugin dependencies and the plugin
    from the root package.json file of our project.

    - The removal of a NativeScript plugin is similar to the removal of an npm package.

    - The NativeScript CLI deletes any plugin files from our app''s modules folder
    in the project''s root. The CLI also removes any plugin dependencies and the plugin
    from the root package.json file of our project.


