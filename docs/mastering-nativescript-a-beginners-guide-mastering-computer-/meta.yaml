  md: "# Mastering NativeScript: A Beginner’s Guide\n\nThe dock property can have\
    \ the following values:\n\n+   - **top**: Dock the child component at the top\
    \ corner of the layout container.\n- **bottom**: Dock the child component at the\
    \ bottom corner of the Layout container.\n- **left**: Dock the child component\
    \ in the left corner of the Layout container.\n- **right**: Dock the child component\
    \ in the right corner of the Layout container.\n\nDockLayout containers dock their\
    \ final child component by default. It can override this behavior by setting the\
    \ stretchLastChild parameter to zero. Let us use the DockLayout container to our\
    \ application’s main page as seen below:\n\n```\n<ActionBar>\n  <Label text=\"\
    Home\"/><</Label>\n</ActionBar>\n<DockLayout width=\"240\" height=\"310\" backgroundColor=\"\
    blue\" stretchLastChild=\"false\">\n  <Label text=\"left\" dock=\"left\" width=\"\
    60\" backgroundColor=\"green\"/><</Label>\n  <Label text=\"top\" dock=\"top\"\
    \ height=\"60\" backgroundColor=\"orange\"/><</Label>\n  <Label text=\"right\"\
    \ dock=\"right\" width=\"60\" backgroundColor=\"red\"/><</Label>\n  <Label text=\"\
    bottom\" dock=\"bottom\" height=\"60\" backgroundColor=\"orange\"/><</Label>\n\
    </DockLayout>\n```\n\n# GridLayout\n\nGridLayout is a complicated layout that\
    \ arranges child items in a tabular form with rows and columns. It has one row\
    \ and one column by default. It has the following characteristics:\n\n+   **columns**:\
    \ Used to denote the default width of each column, separated by a comma. There\
    \ are three potential values: number, *, and auto keyword."
