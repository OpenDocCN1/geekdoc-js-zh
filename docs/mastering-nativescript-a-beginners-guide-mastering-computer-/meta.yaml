  md: "# 198 ■ Mastering NativeScript: A Beginner's Guide\n\n# METADATA\n\nBoth NativeScript\
    \ runtimes require metadata to allow JavaScript code to invoke native iOS or Android\
    \ code. It contains all of the necessary information about each of the supported\
    \ native classes, interfaces, protocols, structures, enumerations, functions,\
    \ variables, and so on. It is created at build time by inspecting the native libraries\
    \ from the SDKs for the Android and iOS operating systems, and any third-party\
    \ libraries and frameworks that the N application employs.\n\nMetadata Filtering\n\
    NativeScript contains all supported entities in the metadata by default. This\
    \ enables app and plugin developers to use JavaScript to call any native API.\
    \ While it is useful during development, having information for all APIs is not\
    \ always ideal. There may be security problems; runtime performance may suffer\
    \ (due to a bigger database that must be queried when an unfamiliar name is encountered\
    \ or at startup); or app size may rise owing to needless metadata that is never\
    \ utilized.\n\nThere is support for blacklisting and whitelisting symbols by their\
    \ native name, giving developers control over what is or not included in the output\
    \ data.\n\nMetadata Filtering rules in plugins:\nPlugins can specify their list\
    \ of APIs that are called from JavaScript in a file named native-api-usage.json,\
    \ which can be found in each platform directory (platforms/android or platforms/ios).\
    \ It follows the same format as:\n\n```\n{\n  \"uses\": [\n    \"java.util:List\"\
    \n  ]\n}\n```\n\nMetadata Filtering rules in apps:\nApplications have the last\
    \ say on what metadata filtering will be used. They supply native-api-usage.json\
    \ files with the following format, which may be found in App_Resources/Android\
    \ and App_Resources/iOS:\n\n```\n{\n  \"whitelist-plugins-usages\": true,\n  \"\
    whitelist\": [\n    \"java.util:Base64*\"\n  ]\n}\n```"
