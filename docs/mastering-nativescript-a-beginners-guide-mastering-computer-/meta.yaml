  md: '# 114 Mastering NativeScript: A Beginner''s Guide


    Step 2: Create Splash Screens


    Splash screens are what users view when we launch our app before it is ready to
    use. For example, when a user opens Pokémon Types on iOS, this is what they see.


    Although a splash screen may be used for various purposes, most apps display the
    app''s logo and possibly the app''s logo. NativeScript has a set of standards
    to make creating this type of splash screen for iOS and Android reasonably simple.


    Let''s begin with iOS. Open the app/App_Resources/Assets.xcassets folder in our
    app and look for two folders entitled LaunchScreen.Fill.imageset and LaunchScreen.Center.imageset.


    These are the default splash screens we''ve used in our app up to this point.
    The AspectFill images serve as the backdrop for our splash screen, and the Center
    images are centered on top of the background. Assuming we desire a straightforward
    splash screen, our objective is to alter the background color of the AspectFill
    photos and insert our logo into the Center images.


    At this stage, launch our iOS app to ensure that our updated splash files are
    operating properly.


    Once we''ve completed our iOS setup, we''re ready to go on Android, where our
    instructions are practically identical this time. A sequence of background.png
    and logo.png files may be found in our app''s app/App_Resources/Android folder.
    NativeScript, like iOS, utilizes the background.png file as the splash screen''s
    backdrop and centers the logo.png file on top of it. We can use the relevant files
    under Pokémon Types as a guide, but this step is simply additional image altering.


    When we''re finished, launch our app on Android to ensure everything is in order
    and proceed to configure our app''s metadata.


