    The actual page content comes afterwards. We may organize the various elements
    using one or more of the layout containers. We''ve utilized two of the possible
    layouts in the examples below StackLayout and GridLayout.


    StackLayout allows us to stack all of the components included inside it. This
    layout''s orientation is vertical by default; thus, each UI component is stacked
    below the last. Consider lego blocks in a downhill flow.


    GridLayout, on the other hand, allows you to arrange components in a table structure.
    If we''ve used Bootstrap or other CSS grid frameworks before, this should seem
    intuitive. The GridLayout enables us to specify the rows and columns in which
    UI component will be positioned.


    We''ll look into how this is done eventually. For the time being, let''s get to
    the coding.


    Let''s start by defining the form for adding a new note. You may specify elements
    like id and cssClass (similar to HTML''s class property) just as in HTML. If we
    want to alter an element from the id attribute is associated with it. In our scenario,
    we want to animate the shape later. cssClass specifies the CSS class that will
    be used to style the element.


    A text area for inputting the note title, a button for adding an image, the selected
    picture, and a button for saving the note are all included within the form.


    The image element is only displayed if the attachment img property is set to true.
    If an image was previously connected, this will be the case.


