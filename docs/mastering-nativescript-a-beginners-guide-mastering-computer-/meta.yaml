    # Terms


    +   * Disclaimer: These terminologies are not necessarily well established in
    the literature, but we present them in the following sections for your convenience.

    * Native instance: Objective-C class instance (iOS) or Java class instance (Android).

    * Reference counting: The Objective-C runtime in iOS employs reference counting
    for lifetime management. Instances retain a counter that can be increased and
    decremented internally. The instance''s reference count is increased each time
    a strong reference is set to point to it. When a strong reference is updated,
    the reference count of the previous instance it referenced is decremented. When
    the count hits zero, the instance is deallocated.

    * GC: It stands for garbage collection in general. When the GC runs, it first
    blocks all threads to discover all strong instances on the stack. The execution
    then proceeds until the GC tags all accessible objects in a separate thread. Finally,
    it finalizes and deallocates unreachable instances. While the real GC mechanism
    may be far more advanced, all implementations in virtual machines used for UI
    attempt to keep the main thread stopped as little as possible. NativeScript uses
    three state-of-the-art virtual machines with garbage collectors: the Android Java
    VM, Android''s V8, and iOS''s JavaScriptCore.

    * Weak/strong reference: Instances can make weak or strong references to one another.
