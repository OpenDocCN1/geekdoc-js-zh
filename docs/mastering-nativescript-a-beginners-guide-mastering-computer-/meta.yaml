  md: "can't avoid learning TypeScript because NativeScript Angular doesn\nallow us\
    \ to create in plain JavaScript.\n\nWe may use either ordinary JavaScript or TypeScript\
    \ with NativeScript\nCore and NativeScript Vue.\n\n# UI Layouts\n\nThe second\
    \ we'll need to be familiar with UI layouts. We're not\ntalking about NativeScript-specific\
    \ layouts here. What we mean is that we\nwill need to be conversant with the layout\
    \ of a UI. For example, suppose\nwe're from the web. In that case, we're probably\
    \ aware of the box model,\nwhich states that a UI may be divided into rectangles\
    \ that include other\nrectangles and other items such as text and images. We'd\
    \ also be familiar\n layering – not only can we have rectangles next to each other\
    \ in a 3D\nworld, but we can also have rectangles on top of each other, so we\
    \ won't\nonly dealing with x and y coordinates, but occasionally we'll also be\n\
    dealing with the Z index.\n\nWe should apply this understanding to NativeScript\
    \ since there are par-\nallels between setting up DOM components and NativeScript\
    \ Views. We\nmay also render our rectangles in NativeScript to contain additional\
    \ rect-\nangles and items (NativeScript, we call these Views because they inherit\n\
    from the root View class). In a 3D environment, we may also stack\nViews on top\
    \ of one another.\n\nWe must be familiar with UI layouts. When we are given a\
    \ design docu-\nment for an app, we can dismantle it and know which individual\
    \ widgets\n utilize when constructing the NativeScript app.\n\n# User Experience\n\
    \nThe third concept we should be acquainted with User Experience (UX).\nNativeScript\
    \ enables us to create a single code base for both iOS and\nAndroid apps. As a\
    \ result, we may wind up launching an app for both plat-\nforms that appears and\
    \ functions identically on both. This may be OK for\ncertain apps, but may not\
    \ be perfect for others.\n\nWhile certain things are the same on iOS and Android,\
    \ other UI design\npatterns are unique to that platform, and users of that platform\
    \ will be\n accustomed to how the UI is set out and performs on that platform.\n\
    \nWe should be familiar with the many UI design patterns that are sug-\ngested\
    \ for both platforms. Both platforms include design rules that we\nshould know\
    \ while developing our app: the Human Interface Guidelines\nfor iOS and the Material\
    \ Design Guidelines for Android."
