  md: 'Step 4 (Optional): Install Webpack NativeScript''s source code contains JavaScript,
    and just like JavaScript code on the web, we may want to optimize it before pushing
    it to production. Webpack, which NativeScript has built-in support for, is the
    optimization tool of choice for NativeScript projects.


    Before we begin, it''s important to note that webpack is optional for NativeScript
    projects. Because webpack minimizes the amount of JavaScript code in our app,
    it will load faster and have a reduced app size when published to app stores.


    The amount of value you get using webpack is determined by the app we''re creating,
    most notably its present size.


    The drawback of utilizing webpack with NativeScript is now that we have another
    item to configure and manage. Although NativeScript''s webpack plugin is simple
    to install and use, it is not easy to customize for advanced use, particularly
    if we''ve never used webpack previously. If the deployment processes in this post
    have already overwhelmed us, we may try publishing our applications to the stores
    as a first step and then optimizing those apps with webpack in a later release.


    It''s entirely up to us, but if we want to give webpack a chance, browse over
    the NativeScript docs. If we run into problems, consider posting a question in
    the NativeScript community forum.


    Let''s get started on constructing our app now we''re all set.


    # Step 5: Create an Android Release Build


    Now that we''ve completed all of our settings, we''re ready to build our app and
    submit it to the app stores. Let''s begin with Android because getting our app
    into Google Play is much easier than working with the iOS App Store.


    Before proceeding to Google Play to register and publish our app (the next step),
    we must first create an Android executable file for your application. This file
    has an .apk extension on Android and may be generated with the NativeScript CLI.


    The runs command we''ve been using during NativeScript development creates an
    .apk file for us and downloads it on an Android emulator or device. However, the
    build required for a genuine Google Play release must also be code signed. If
    we want to get into the cryptographic intricacies, we may refer to Android''s
    code signing instructions,'
