    FlexboxLayout

    The sophisticated layout container components allows it to produce simple layouts
    to highly complicated and refined layouts. It is built with CSS Flexbox.

    The FlexboxLayout has several attributes, which are as follows:


    +   1. flexDirection: It denotes the order in which the child components are placed.
    The following are the potential values for flexDirection:

    * row: child components are stacked one on top of the other.

    * row-reverse: row-reverse arranges child components side by side in the other
    direction.

    * column: child components are stacked one on top of the other.

    * column-reverse: child components are organized in a column-reverse fashion,
    below the other but in the opposite direction.


    Let us add the FlexLayout container to our application''s homepage as seen below:


    ```

    <ActionBar>

    <Label text="Home"></Label>

    </ActionBar>

    <FlexLayout flexDirection="row">

    <Label text="First Item" backgroundColor="yellow"></Label>

    <Label text="Second Item" backgroundColor="red"></Label>

    ```'
