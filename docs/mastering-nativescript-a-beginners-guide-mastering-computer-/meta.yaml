    ></Button>\n</StackLayout>\n```\n\n# Classified Direct Sibling ID:\n\n```\n<StackLayout\
    \ class=\"layout-class\">\n  <Label text=\"Direct sibling test by id\"></Label>\n\
    \  <Button id=\"test-child\" text=\"FirstButton\"></Button>\n  <Button id=\"test-child-2\"\
    \ text=\"SecondButton\"></Button>\n</StackLayout>\n```\n\n# Classified Direct\
    \ Sibling Type:\n\n```\n<StackLayout class=\"direct-sibling--type\">\n  <Label\
    \ text=\"Direct sibling by type\"></Label>\n  <Button text=\"TestButton\"></Button>\n\
    \  <Label text=\"TestLabel\"></Label>\n  <Button text=\"TestButton\"></Button>\n\
    \  <Label text=\"TestLabel\"></Label>\n  <Button text=\"TestButton\"></Button>\n\
    \  <Label text=\"TestLabel\"></Label>\n</StackLayout>\n```\n\nAttribute Selector\n\
    \n```\nbutton[testAttr] { background-color: green; }\n```\n\nThis selector will\
    \ pick all buttons that have the testAttr attribute set to some value.\n\nSome\
    \ more sophisticated situations are also supported:\n\n+   * button[testAttr='flower']\
    \ {...}: CSS will be applied to all buttons with the testAttr attribute set to\
    \ the value flower."
