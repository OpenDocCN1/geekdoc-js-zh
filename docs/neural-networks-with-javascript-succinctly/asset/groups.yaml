    \ to update biases is exactly the same as the pattern used to update weights.\
    \ Next, the hidden-to-output weights and the output node biases are updated.\n\
    \n```\n// update hidden-to-output weights.\nfor (let j = 0; j < this.nh; ++j)\
    \ {\n  // ... (update logic)\n}\n```\n*(Note: The provided OCR for pages 73-74\
    \ was highly repetitive/noisy; I have reconstructed the logical technical flow\
