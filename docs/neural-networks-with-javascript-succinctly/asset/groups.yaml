  - '[PAGE 103]


    Notice by setting the value of dropProb to 0.0, you get normal back-propagation
    training without dropout. Also note that the exact number of hidden nodes that
    will be dropped on each training iteration will likely vary. For example, with
    50 hidden nodes, on average 0.10 * 50 = 5 nodes will be dropped. Also the exact
    number of hidden nodes can be between 0 and 50.


    The dropout technique was created mostly to deal with overfitting in deep neural
    networks with many layers and hundreds or thousands of nodes in each layer. When
    used carefully, dropout can improve the prediction accuracy of neural networks
    with a single hidden layer.


    It is possible to apply dropout to input nodes. This technique is most often effective
    when training data has many predictor variables. A closely related technique is
    to add random noise to input values. This technique is called jittering.


    # Train-validate-test


    The train-validate-test (TVT) technique can be used to reduce the likelihood of
    model overfitting. Model overfitting occurs if a neural network is trained too
    long. Briefly, instead of splitting your data into a training set and set, split
    your data into three sets: a training set (typically about 70% of the data), a
    validation set (often about 15% of the data), and a test set (about 15% of the
    data).


    You use the training data as usual, but every few epochs, you compute and display
    the error of the current model on the validation data. By observing how the model
    deals with the validation data, you can see when model overfitting is starting
    to occur, and then stop training before reaching the max epochs.


    After training, you compute the error and accuracy of the model on the test data
    as usual, to get a rough estimate of how the model will perform on new, previously
    unseen data. The main principle of train-validate-test is shown in the graph in
    Figure 4-7.


    ![](img/56e6154402fb791dde6d62e1689ad4a0_103_0.png)


    Figure 4-7: Train-Validate-Test in Theory'
  - '[PAGE 104]


    The blue line represents error on the training data. That error will tend to decrease
    steadily the longer the network is trained. The red line represents error on the
    validation data. Initially error will decrease, but at some point, overfitting
    will start to occur and error on the validation data will start to increase. This
    can indicate when to stop training.


    Unfortunately, there are two reasons why train-validate-test does not work well.
    First, you must use valuable labeled data for validation rather than training.
    Second, the actual graph of training and validation error is as smooth as shown
    in Figure 4-7. Instead, the values for training and validation error jump around
    wildly, making it very difficult to determine when overfitting is starting to
    occur.


    The screenshot in Figure 4-8 shows an example of train-validate-test. The goal
    is to predict a person''s legal standing (conservative, moderate, or liberal)
    from their sex, age, geo-region (eastern, western, or central), and annual income.


    The demo program has total of 240 labeled data items and uses three files: People_train.txt
    has 160 items, People_validate has 40 items, and People_test.txt has 40 items.
    The data is synthetic and was programmatically.


    During training, the demo program computes and displays error and classification
    accuracy on both training and validation data. In several runs of the program
    up to 50,000 epochs, the error and accuracy metrics were being suggested that
    overfitting was starting to occur at somewhere between 1,000 and 2,000 epochs.
    After a bit of experimentation, 1,600 epochs were used to generate the results
    shown in Figure 4-8.


    ![](img/56e6154402fb791dde6d62e1689ad4a0_104_0.png)


    Figure 4-8: Train-Validate-Test Demo'
  - "[PAGE 105]\n\nWithout train-validate-test, the final training and classification\
    \ accuracies (shown in Figure 4-1) were 96.25% and 52.50%, but by using train-validate-test\
    \ to limit the number of training epochs, the final accuracies are 76.25% and\
    \ 77.50%. The model's accuracy on the training data is somewhat worse, but the\
    \ accuracy on the test data, which is the key metric, is significantly better.\n\
    \nImplementing train-validate-test is straightforward. In the main() function\
    \ you load the three into six matrices.\n\n```\nlet trainX = U.loadTxt(\"\\\\\
    Data\\\\people_train.txt\", \"\\t\", [0,1,2,3,4]);\\nlet trainY = U.loadTxt(\"\
    \\\\Data\\\\people_train.txt\", \"\\t\", [5,6,7]);\nn\nlet validX = U.loadTxt(\"\
    \\\\Data\\\\people_validate.txt\", \"\\t\", [0,1,2,3,4]);\\nlet validY = U.loadTxt(\"\
    \\\\Data\\\\people_validate.txt\", \"\\t\", [5,6,7]);\nn\nlet testX = U.loadTxt(\"\
    \\\\Data\\\\people_test.txt\", \"\\t\", [0,1,2,3,4]);\\nlet testY = U.loadTxt(\"\
    \\\\Data\\\\people_test.txt\", \"\\t\", [5,6,7]);\n```\n\nIn the train() method,\
    \ you compute and display error and accuracy on the training and validation data\
    \ every epoch.\n\n```\nif (epoch % freq == 0) {\n  let trainMSE = this.meanSqErr(trainX,\
    \ trainY).toFixed(4);\n  let trainAcc = this.accuracy(trainX, trainY).toFixed(4);\n\
    \  let validMSE = this.meanSqErr(validX, validY).toFixed(4);\n  let validAcc =\
    \ this.accuracy(validX, validY).toFixed(4);\n\n  let s1 = \"epoch: \" + epoch.toString();\n\
    \  let s2 = \"train MSE = \" + trainMSE.toString();\n  let s3 = \"train Acc =\
    \ \" + trainAcc.toString();\n  let s4 = \"valid MSE = \" + validMSE.toString();\n\
    \  let s5 = \"valid Acc = \" + validAcc.toString();\n\n  console.log(s1 + s2 +\
    \ s3 + s4 + s5);\n}\n```\n\nWhen determining overfitting is starting to occur\
    \ is art part science, as the saying goes. There have been attempts to design\
    \ algorithms and codematically determine overfitting is starting to occur, but\
    \ these efforts have not succeeded very often.\n\nUsing train-validate-test is\
    \ called early stopping. However, early stopping is a general term that can be\
    \ used to describe any technique to train before reaching the max-epochs value."
- md: "\n# Questions\n\n1. Suppose you want to predict political party using this\
    \ tiny set of training data:\n\n| Age | Sex | IQ | Party |\n|---|---|---|---|\n\
    | 46 | male | 120 | independent |\n| 24 | female | 100 | democrat |\n| 38 | male\
    \ | 116 | republican |\n\n- A. Normalize the Age values using min-max normalization.\n\
    - B. Encode the Sex values using -1 +1 encoding.\n- C. Normalize the IQ values\
    \ using z-score normalization (note: mean = 112.0, sd = 8.64).\n- D. Encode the\
    \ Party values using one-hot / 1-of-N encoding.\n\n# Chapter 5 Regression\n\n\
    A regression problem is one where the goal is to predict a single numeric value.\
    \ For example, you might want to predict the GPA of a freshman based on their\
    \ high school GPA, parent's annual income, and so on.\n\nDesigning and training\
    \ a neural network for a regression problem is quite similar to designing and\
    \ creating a neural network for a classification problem. The key differences\
    \ are that a neural network for regression has a single output node and uses identity\
    \ activation rather than softmax activation, regression accuracy requires a different\
    \ approach than classification accuracy.\n\nFigure 5-1: Neural Network Regression\
    \ on the Boston Regression. The goal is to predict the median house price of a\
    \ town near Boston. The data comes from a 1978 research paper, so the median house\
    \ prices are very small (between $5,000 and $50,000).\n\nThe Boston Dataset is\
    \ a well-known collection containing 506 data items. Each item represents one\
    \ of 506 towns near Boston. There are 13 predictor variables, including things\
    \ such as the crime rate in the town and whether the town is next to a river (0\
    \ = no, 1 = yes).\n\nThe demo program sets up a 13-100-1 neural network. The network\
    \ has one output node because the goal is to predict a single numeric value. The\
    \ network has 100 hidden nodes. The number of hidden nodes is a hyperparameter\
    \ that must be determined by trial and error.\n\nBefore training, the 506-item\
    \ data set was randomly split into a 406-item set for training and a 100-item\
    \ set for testing. The training data set was normalized and encoded. The demo\
    \ program uses the online back-propagation training technique for 5,000 epochs.\n\
    \nAfter training, the model accuracy on the training data was 86.45% (351 out\
    \ of 406) and 78.00% (78 out of 100) on the test data. Here, a correct median\
    \ house price prediction is one that is within 15% of the true price. For example,\
    \ if a town's median house price is $10,000, any prediction from $8,500 to $11,500\
    \ would be considered correct.\n\nThe demo concludes by making a prediction for\
    \ a new, previously unseen town. A set of 13 values was set up and then normalized\
    \ using the normalization parameters from the training data. The predicted median\
    \ house price of the new town is $21,279.11.\n\n# Understanding the Boston Dataset\n\
    \nThe Boston Dataset has a total of 14 variables:\n\n- Crime rate in the town.\n\
    - Percentage of land area zoned for large lots.\n- Percentage of area zoned for\
    \ industrial use.\n- Whether the town is adjacent to a river (0 = no, 1 = yes).\n\
    - Air pollution.\n- Average number of rooms per house.\n- Percentage of old homes.\n\
    - Distance to Boston metric.\n- Accessibility to highway metric.\n- Property tax\
    \ rate.\n- Pupil-teacher ratio.\n- Percentage of black residents metric.\n- Percentage\
    \ of low social status residents.\n- Median value of home in town.\n\n# Figure\
    \ 5-2: Partial Boston House Data\n\nBecause there are 14 variables, it's not possible\
    \ to visualize the data set, but you can get a rough idea of the data from the\
    \ Boston Median Price in Figure 5-2. The graph shows median house price in a town\
