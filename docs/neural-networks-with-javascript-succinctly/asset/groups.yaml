  - '[PAGE 67]


    A gradient value has information about how the associated weight or bias value
    must change in order for computed output values to get closer to the target output
    values. This idea is illustrated in Figure 3-4. The graph represents one weight
    in a neural network. The possible values of the weight are shown on the horizontal
    axis at the bottom of the graph.


    Each possible value of the weight will give a different error value. Therefore,
    the goal is to find the value of the weight that gives the smallest error. In
    the graph, you can see that the value of the weight that minimizes error is w
    = 5.0. Unfortunately, the error function is never completely known, so you can
    only take snapshots by sampling different values of w.


    The gradient is calculus derivative. A calculus derivative is the slope of the
    tangent line at some point. For example, if w = -5.0, you can see the error is
    about 7.0. The gradient at this point is -0.80 where the sign (negative in this
    case) indicates that the gradient runs from upper left to right. The magnitude
    of the gradient (0.80 in this case) indicates the steepness of the gradient.


    If you examine the gradient again, you can see that when w = -5.0 the gradient
    is negative, which means that to reduce error you must increase the value of w
    (towards 0).


    The idea is also shown when w = 7.0 at that point is +2.15, and because the gradient
    is positive, to reduce the error you decrease the value of w.


    ![](img/56e6154402fb791dde6d62e1689ad4a0_67_0.png)


    Figure 3-4: The Gradient of a Neural Network Weight'
  - '[PAGE 68]


    To summarize, if you can compute the values of the gradients of each weight and
    bias, you can adjust the values of each weight and bias to reduce the error between
    computed output values and known correct values. If the gradient is negative,
    increase the weight. If the gradient is positive, decrease the weight. Okay, but
    how can you compute gradients?


    It turns out that calculating the gradients for the output node biases and the
    hidden-to-output weight is relatively simple, but calculating the gradients for
    the hidden node biases and the input-to-hidden weights is quite tricky.


    Expressed as a math equation, the technique for updating the hidden-to-output
    weights and the output node biases is shown in Figure 3-5.


    ```

    $$\Delta w_{jk} = -1 * [x_j * (o_k - t_k) * o_k * (1 - o_k)]$


    learning rate      error"outer"  derivative of activation

    ```


    Figure 3-5: The Hidden-to-Output Weights Update Equation


    The delta-w represents an increment of the weight from hidden node to output node
    k that will decrease the error. The -1 factor is an algebra consequence so that
    the value is added to the hidden-output weight rather subtracted.


    Greek letter eta resembles a lower-case script "n" is the learning rate, which
    is a small value, typically something like 0.01 or 0.05. The x-j term is the value
    in the hidden node associated with the weight connecting hidden node j to output
    node k.


    The (o - t) term ("output "target") minus ("target") is part of a calculus derivative
    of the error function, in this case mean squared error. Notice that the back-propagation
    algorithm does not explicitly compute the error. Instead, the calculus derivative
    of the error function is used. If you use an error function other than mean squared
    error, the weight update equation changes.


    The o * (1 - o) term is the calculus derivative of the output activation function,
    in this case the softmax function. If you use a different output activation function,
    the weight update equation changes. A change to the update calculation requires
    a that a neural network that uses logistic sigmoid output node activation has
    the same weight update equation as the equation assuming softmax. This happens
    because, mathematically, the softmax function and the logistic sigmoid function
    are very closely related.


