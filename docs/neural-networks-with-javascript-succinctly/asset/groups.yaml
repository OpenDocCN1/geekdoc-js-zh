  - '[PAGE 107]


    # Chapter 5 Regression


    A regression problem is one where the goal is to predict a single numeric value.
    For example, you might want to predict the GPA of an freshman based on their high
    school GPA, parent''s annual income, and so on.


    Designing and training a neural network for a regression problem is quite similar
    to designing and creating a neural network for a classification problem. The key
    differences are that a neural network for regression has a single output node
    and uses identity activation rather than softmax activation, regression accuracy
    requires a different approach than classification accuracy.


    ![](img/56e6154402fb791dde6d62e1689ad4a0_107_0.png)


    Figure 5-1: Neural Network Regression on the Boston Regression. The goal is to
    predict the median house price of a town near Boston. The data comes from a 1978
    research paper, so the median house prices are very small (between $5,000 and
    $50,000).'
  - '[PAGE 108]


    The Boston Dataset is a well-known collection containing 506 data items. Each
    item represents one of 506 towns near Boston. There are 13 predictor variables,
    including things such as the crime rate in the town and whether the town is next
    to a river (0 = no, 1 = yes).


    The demo program sets up a 13-100-1 neural network. The network has one output
    node because the goal is to predict a single numeric value. The network has 100
    hidden nodes. The number of hidden nodes is a hyperparameter that must be determined
    by trial and error.


    Before training, the 506-item data set was randomly split into a 406-item set
    for training and a 100-item set for testing. The training data set was normalized
    and encoded. The demo program uses the online back-propagation training technique
    for 5,000 epochs.


    After training, the model accuracy on the training data was 86.45% (351 out of
    406) and 78.00% (78 out of 100) on the test data. Here, a correct median house
    price prediction is one that is within 15% of the true price. For example, if
    a town''s median house price is $10,000, any prediction from $8,500 to $11,500
    would be considered correct.


    The demo concludes by making a prediction for a new, previously unseen town. A
    set of 13 values was set up and then normalized using the normalization parameters
    from the training data. The predicted median house price of the new town is $21,279.11.


    # Understanding the Boston Dataset


    The Boston Dataset has a total of 14 variables:


    +   - Crime rate in the town.

    - Percentage of land area zoned for large lots.

    - Percentage of area zoned for industrial use.

    - Whether the town is adjacent to a river (0 = no, 1 = yes).

    - Air pollution.

    - Average number of rooms per house.

    - Percentage of old homes.

    - Distance to Boston metric.

    - Accessibility to highway metric.

    - Property tax rate.

    - Pupil-teacher ratio.

    - Percentage of black residents metric.

    - Percentage of low social status residents.

    - Median value of home in town.'
