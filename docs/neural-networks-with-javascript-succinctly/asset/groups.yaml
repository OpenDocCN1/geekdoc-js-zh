  - '[PAGE 34]


    ![](img/56e6154402fb791dde6d62e1689ad4a0_34_0.png)


    The **tanh(x)** function accepts any value x, from negative infinity to positive
    infinity, and returns a value between -1.0 and +1.0. Notice that for values less
    than -5.0 and greater than +5.0, the **tanh(x)** result is nearly at its extreme
    value.


    Because pre-activation hidden nodes of less than about -5.0 or greater than +5.0
    result in -1.0 or +1.0, respectively, an effective neural network often has pre-activation
    hidden node values close to 0.0. This means that you should avoid very large or
    very small input values. This is accomplished by normalizing input data, as described
    in Chapter 4.


    The limits of -20.0 and +20.0 in the demo program implementation of the **hyperTan(x)**
    function are somewhat arbitrary. Other common limits for a program-defined tanh
    wrapper function are (-10.0, +10.0) and (-40.0, 40.0). In practice, different
    tanh limits have little effect in the neural network where they''re used.


    Another common layer activation function is the logistic sigmoid function. The
    name of the function is often shortened to log-sig or sigmoid in a neural network
    context (there are many different kinds of sigmoid functions in addition to logistic
    sigmoid). The math definition of the sigmoid function is:


    ```

    y = 1 / (1 + e^-*) = 1 / (1 + exp(-x))

    ```


    The graph of the sigmoid function is in Figure 2-5. Notice that the sigmoid function
    has a shape similar to the tanh function. The sigmoid function accepts any value
    from negative infinity to positive infinity and returns a value between 0.0 and
    1.0.'
  - "[PAGE 35]\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_35_0.png)\n\nFigure 2-5:\
    \ Graph of sigmoid(x) on [-5.0, +5.0]\n\nOne possible implementation of the logistic\
    \ sigmoid function follows.\n\n```\nfunction logSig(x)\n{\n  if (x < -20.0) {\n\
    \    return 0.0;\n  }\n  else if (x > 20.0) {\n    return 1.0;\n  }\n  else {\n\
    \    return 1.0 / (1.0 + Math.exp(-x));\n  }\n}\n```\n\nDuring neural network\
    \ training, most training algorithms use the calculus derivative of the hidden\
    \ layer activation function. One of the tanh function is often used for hidden\
    \ layer activation is that the function has a very convenient derivative. If y\
    \ = tanh(x), the derivative is y' = (1 - y) * (1 + y)\n\nThe derivatives of most\
    \ math functions are expressed in terms of the input value x. For example, if\
    \ y = x2 + sin(x) then y' = 2x + cos(x) + 3. By an algebra coincidence, the derivative\
    \ of y = tanh(x) can be expressed in terms of the calculated value y instead of\
    \ x. This characteristic is useful, as explained in Chapter 3. The derivative\
    \ of the sigmoid function is y' = y * (1 - y), which is also computationally convenient."
  - '[PAGE 36]


    In the early days of neural networks, the sigmoid function was used most often
    for hidden layer activation. However, experience has shown that for many, but
    not all, problem scenarios, the tanh function tends to give a slightly better
    predictive model.


    A generic deep neural network has two or more hidden layers. For deep neural networks,
    the rectified linear unit (ReLU) function is often used for hidden layer activation.
    ReLU activation is a topic that is outside the scope of this book.


    # Questions


    +   1. How many weights and biases does a 4-10-3 neural network have?


    +   2. Suppose you have a 2-2-2 neural network with X = (1.0, 2.0), input-hidden
    weights = (0.2, 0.4, 0.6, 0.8), hidden biases = (0.10, 0.12), hidden-output weights
    = (0.14, 0.16, 0.18, 0.20), output biases = (0.22, 0.24), hidden layer activation
    = tanh, output layer activation = none. What are the output node values?


    +   3. Suppose you have a 5-8-3 neural network that uses softmax activation on
    the output nodes. If the pre-activation output nodes values are (1.5, 0.0, 2.5),
    what are the final output values?


    +   4. Suppose a neural network uses sigmoid activation on the hidden layer. If
    a hidden node has pre-activation value of 2.0, what is the approximate value of
    the node after activation?'
- md: "\n## Chapter 3 Training\n\nTraining a neural network is the process of finding\
    \ values for the network's weights and biases so that the network can make predictions.\
    \ Training a neural network is complex and difficult, both conceptually and in\
    \ practice.\n\nThe screenshot in Figure 3-1 shows a demo of neural network training.\
    \ The goal of the program is to create a prediction model (a trained neural network\
    \ often called a model) for the well-known Iris data set.\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_37_0.png)\n\
    \nFigure 3-1: Neural Network Training on the Iris Data Set\n\nThe Iris data has\
    \ 150 items. Each item represents an iris flower. predictor values (often called\
    \ features in NN machine learning terminology) and three possible species to predict:\
    \ setosa, versicolor, and virginica. The demo program creates a 4-7-3 neural network.\
    \ There are four input nodes, one for each predictor value, and three output nodes,\
    \ because there are three classes (discrete values to predict).\n\nThe neural\
    \ network uses tanh activation on the hidden nodes and softmax output on the output\
    \ nodes. Behind the scenes, the 150-item iris dataset had been split into two\
    \ files: a 120-item (80% of the items) training data set used for determining\
    \ the model weights and biases, and a 30-item (the remaining 20%) test data set\
    \ be used to evaluate the quality of the trained network.\n\nThe demo program\
    \ uses the back-propagation technique (also called stochastic descent, SGD, even\
    \ though the terms have somewhat different meanings) to train the network. Training\
    \ is an iterative process. The demo program runs the network using 50 epochs.\
    \ One epoch consists of processing every item in the training data set once.\n\
    \nDuring training, after each set of five epochs, the demo program displays the\
    \ mean squared error associated with the set of weights and biases, and the prediction\
    \ accuracy. As you can see in Figure 3-1, the error slowly decreases and the accuracy\
    \ slowly increases, suggesting that training is working.\n\nAfter training, the\
    \ demo completes and displays the prediction accuracy of the model on the 120-item\
    \ training data (0.9083 = 109 out of 120 correct) and the 30-item test data (0.9667\
    \ = 29 out of 30). The accuracy of the model on the test set is a very rough estimate\
    \ of the expected accuracy of the new model, previously unseen data.\n\nThe demo\
    \ concludes by using the trained model to make a prediction. The demo sets up\
    \ an iris flower with predictor values of (5.1, 3.1, 4.1, 2.1) and sends those\
    \ values to the model. The model's output values are (0.0570, 0.4511, 0.4918).\
    \ Because the third output value is the largest, the model predicts that the unknown\
    \ flower is the species (virginica).\n\n## Understanding the Iris data set\n\n\
    Fischer's Iris data set is one of the most well-known benchmark data sets in statistics\
    \ and machine learning. The data set has 150 items. The raw data looks like this:\n\
    \n```\n5.1, 3.5, 1.4, 0.2, setosa\n7.0, 3.2, 4.7, 1.4, versicolor\n6.3, 3.3, 6.0,\
    \ 2.5, virginica\n...\n```\n\nThe raw data was prepared by one-hot encoding the\
    \ class labels, but the feature values are not normalized as is usually done.\n\
    \n```\n5.1, 3.5, 1.4, 0.2, 1, 0, 0\n7.0, 3.2, 4.7, 1.4, 0, 1, 0\n6.3, 3.3, 6.0,\
    \ 2.5, 0, 0, 1\n```\n\nOne-hot encoding is also known as 1-of-N encoding. The\
