  - "[PAGE 74]\n\nChecking for progress messages is placed at the end of the main\
    \ processing loop. You could check at the top of the main loop.\n\n```\nfor (let\
    \ epoch = 0; epoch < maxEpochs; ++epoch) { // each epoch.\n  this.shuffle(indices);\
    \ // scramble order of items\n  for (let ii = 0; ii < n; ++ii) { // each training\
    \ item.\n    if (epoch % freq == 0) { // it's time to show\nprogress.\n      let\
    \ mse = this.meanSqErr(trainX,Y).toFixed(4);\n```\n\nUsing this approach would\
    \ display the mean error and classification accuracy immediately (at epoch = 0),\
    \ which is useful to get baseline values. The disadvantage is that during all\
    \ epochs, you see error and accuracy of the model before weights and biases are\
    \ updated, not after the updates.\n\n# Back-propagation using cross-entropy error\n\
    \nIn spite of decades of research on neural networks, many fundamental questions\
    \ remain unanswered. One question is, \"For neural multiclass classification,\
    \ should you use squared error or cross-entropy error?\" In my opinion, there\
    \ are no definitive results that answer this question. For some problems, mean\
    \ squared error seems to work better, but for other problems, mean cross-entropy\
    \ error appears to work better.\n\nFor a multiclass classification problem, to\
    \ use mean cross-entropy error instead of squared error, you only need to make\
    \ one small (but surprising) change to the demo code. When using squared error,\
    \ the statements that compute the output node signals are the following.\n\n```\n\
    // compute output node signals (assuming mean squared error).\nfor (let k = 0;\
    \ k < this.no; ++k) {\n  let derivative = (1 - this.oNodes[k]) * this.oNodes[k];\
    \ // assumes\nsoftmax.\n oSignals[k] = derivative * (this.oNodes[k] - Y[k]); //\
    \ E=(t-o)^2\n E=(o-t)\n }\n```\n\nBecause of some algebra cancellations, when\
    \ using mean cross-entropy error, the computation of the output node signals follows\
    \ this:\n\n```\n// compute output node signals (assuming mean cross-entropy error).\n\
    for (let k = 0; k < this.no; ++k) {\n  // assumes softmax.\n oSignals[k] = this.oNodes[k]\
    \ - Y[k]; // E=-Sum(ln(o)*t)\n }\n```"
- md: "\nThe derivative essentially goes away, leaving the (output - target) term.\
    \ This is one of the most surprising results in all of neural machine learning.\n\
    \nThe demo program displays error and accuracy progress messages during training.\
    \ If you use cross-entropy error instead of mean squared error, it makes sense\
    \ to display mean cross-entropy error rather than mean squared error. Because\
    \ mean squared error is slightly easier to interpret cross-entropy error, you\
    \ might want to display both error metrics.\n\n```javascript\nif (epoch % freq\
    \ == 0) { // time to display progress.\n    let mse = this.meanSqr(trainX, trainY).toFixed(4);\n\
    \    let mce = this.meanCrossEnter(trainX, trainY).toFixed(4);\n    let acc =\
    \ this.accuracy(trainX, trainY).toFixed(4);\n\nlet s1 = \" epoch: \" + epoch.toString();\n\
    let s2 = \" MSE: \" + mse.toString();\nlet s3 = \" MCE: \" + mce.toString();\n\
    let s4 = \" acc: \" + acc.toString();\n\nconsole.log(s1 + s2 + s3 + s4);\n}\n\
    ```\n\nUntil the 2012 or so, the use of mean squared error was more common than\
    \ the use of mean cross-entropy error. However, cross-entropy error is now more\
    \ common. The graph in Figure 3-6 shows an example of squared error and cross-entropy\
    \ error applied to the same problem.\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_75_0.png)\n\
    \nFigure 3-6: Comparison of Squared Error and Cross-Entropy Error on Same neural\
    \ network\n\nThe graph shows that, for this problem, cross-entropy error gives\
    \ a good neural network model more quickly than squared error, but that cross\
    \ entropy is more volatile than squared error.\n\nIn practice, if you use enough\
    \ training iterations, for multiclass classification problems mean squared error\
    \ and mean cross-entropy error produce similar neural network models in terms\
    \ of prediction accuracy. However, because cross-entropy error is used more often\
    \ than squared error, you should use cross-entropy error if you are collaborating\
    \ with others. And note that for regression problems, the goal is to predict a\
    \ single numeric value, cross-entropy error is not an option.\n\nAlthough the\
    \ terms back-propagation and stochastic gradient descent are often used interchangeably,\
    \ they're different. Technically, the back-propagation algorithm computes gradients,\
    \ and stochastic gradient descent uses the gradients to reduce error.\n\nStochastic\
    \ gradient descent often quite well for neural networks with a single hidden layer,\
    \ but often fails for deep neural networks. Between 2014 and 2017, remarkable\
    \ progress was made in devising new learning algorithms for deep neural networks.\
    \ Most of these algorithms use a different learning rate for each weight and bias,\
    \ and adaptively change the learning rates during training.\n\nAdvanced algorithms\
    \ are supported by most neural network code libraries such as TensorFlow and PyTorch\
    \ include Adagrad (adaptive gradient), Adelta (improved variation of Adagrad),\
    \ RMSProp (adaptive gradient plus back-prop), Adam (\"adaptive estimation\", similar\
    \ to RMSProp with momentum), and AdamMax (a variation of Adam).\n\nAll of these\
    \ learning are based on calculus gradients. For example, evolutionary optimization\
    \ is similar to genetic algorithms that loosely mimic the behavior of biological\
    \ chromosomes. And particle swarm optimization loosely mimics the behavior of\
    \ swarming organisms. These bio-inspired techniques have great promise, but are\
    \ currently not practical because they require enormous computational power.\n\
    \n# Questions\n\n- 1. Suppose that at some point during training, a neural network's\
    \ current input and output values are the following.\n\n| input | target | computed\
    \ |\n|---|---|---|\n| 4.8 3.9 1.1 0.8 | 1 0 | 0.80 0.10 0.10 |\n| 6.7 2.6 4.6\
    \ 1.3 | 0 1 | 0.15 0.60 0.25 |\n| 5.6 3.1 2.2 1.7 | 0 1 | 0.20 0.50 0.30 |\n\n\
    - A. What is the classification accuracy of the network?\n\n- B. What is the mean\
    \ squared error of the network?\n\n- C. What is the mean cross-entropy error of\
    \ the network?\n\n# Chapter 4: Overfitting\n\nOne of the challenges when working\
    \ with neural networks is a phenomenon called overfitting. A trained model is\
    \ overfitted if it predicts well on the training data but predicts poorly on test\
    \ data and new, previously unseen data. There are many techniques to reduce the\
    \ likelihood of model overfitting, including dropout, train-validate-test, and\
    \ regularization.\n\nThe screenshot in Figure 4-1 shows a demo of neural network\
    \ overfitting. The goal of the program is to predict the political leaning of\
    \ a person (conservative, moderate, or liberal) based on sex (male or female),\
    \ age, geographical region (eastern, western, or central), and annual income.\n\
    \n![](img/56e6154402fb791dde6d62e1689ad4a0_77_0.png)\n\nFigure 4-1: An Example\
    \ of Neural Network Model Overfitting\n\nThe data is completely artificial and\
    \ was generated programmatically. The raw data has 240 items that look like the\
    \ following.\n\n| M 32 eastern 59200.00 | moderate |\n| F 33 central 38400.00\
    \ | moderate |\n| M 35 central 30800.00 | liberal |\n| M 26 western 53800.00 |\
    \ conservative |\n\nThe first column is the person's sex, represented by M or\
    \ F. The second column is the person's age. The third column is the geo-region\
    \ (eastern, western, or central) where the person lives. The fifth column is an\
    \ arbitrary pipe character for readability. The sixth column is the political\
    \ leaning to predict (conservative, moderate, or liberal).\n\nThe 240-item raw\
    \ data was split into a 160-item data set for training and a 40-item data set\
    \ for testing. After splitting, the two data sets were normalized and encoded\
    \ for a neural network (the remaining 40 items are used later).\n\nThe demo created\
    \ a 5-25-3 neural network. The raw data has four predictor variables, but when\
    \ normalized and encoded, there are five value predictors. There are three output\
    \ nodes because there are three classes to predict. The number of hidden nodes\
    \ (25) is a hyperparameter and must be determined by trial and error.\n\nThe demo\
    \ program trains the network for 50,000 epochs using back-propagation with the\
    \ online training technique. After training, the model's accuracy is an impressive\
    \ 96.25% correct (154 out of 160), but a rather underwhelming 52.50% accuracy\
    \ (21 out of 40) on the test data. The difference in prediction accuracy on the\
    \ training and test datasets suggests that the model has been overfitted.\n\n\
    After the model evaluation metrics have been displayed, the demo saves the model's\
    \ weights and biases to a text file so that for all the quickest training, you\
    \ want to save your model weights and biases so you don't have to retrain a good\
    \ model.\n\nThe demo concludes by making a prediction for a new, previously unseen\
    \ person with sex = male, age = 35, region = \"western\", and income = $36,400.00.\
    \ These values are normalized and encoded to sex = -1, age = 0.3400, region =\
    \ (0, 1), and income = 0.2298. The prediction probabilities are (0.0000, 0.9999,\
    \ 0.0001), and the second value is largest, the prediction is that the person\
    \ is a political moderate. The extreme values of the predicted probabilities also\
    \ suggest the model may be overfitted.\n\nThe graph in Figure 4-2 illustrates\
    \ the basic concepts of overfitting.\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_79_0.png)\n\
    \n# Figure 4-2: Model Overfitting\n\nThe dashed green line represents the true\
    \ (but unknown) decision boundary between the two classes. Notice that data items\
    \ are above the green line are mostly blue (seven of them), and data items below\
    \ the green line are mostly red (five of them). The five misclassifications in\
    \ the training data are due to the randomness inherent in real-life data.\n\n\
    A good neural network model would find the true decision boundary represented\
    \ by the green line. However, if you train a neural network model long enough,\
    \ it will get too good and generate a model indicated by the spiky, solid gray\
    \ line.\n\nThe gray line makes perfect predictions on the test data. All the blue\
    \ dots are the gray line and all the red dots are the gray line.\n\nBut when the\
    \ overfitted model is presented with new, previously unseen data, there's a good\
    \ chance the model will make an incorrect prediction. For example, a new data\
    \ item at (X1 = 4, X2 = 7) is above the true boundary, and so should be classified\
    \ as blue. But because the data item is below the gray line, it will be incorrectly\
    \ classified as red.\n\n# Data normalization\n\nPreparing data for use by a neural\
    \ network is tedious and time-consuming. In some scenarios there are distinct\
    \ data preparation tasks: cleaning, normalizing numeric data, and encoding non-numeric\
    \ data.\n\nCleaning data usually means dealing with missing values and extreme\
    \ or anomalous values. For data items that have one or more predictor values,\
    \ in all but rare cases the best approach (in my opinion) is to delete those data\
