- md: '

    In words, everything cancels out, leaving the computed output value and the target
    value. Quite remarkable.


    When training, it''s good practice to print the current error and accuracy every
    few epochs so that you can see when training is not working. For binary classification
    problems, regardless of whether you assume mean squared error or binary cross-entropy
    error, you can compute and display either error term because both indicate when
    training is not working. Mean squared error is slightly easier to interpret because
    the value will always be between 0.0 and 1.0.


    ## The two-node technique for binary classification


    By far the most common approach to neural network binary classification is to
    use a single output node scaled with sigmoid activation and target values of 0
    or 1. An alternative is to encode target values as (1, 0) or (0, 1) and use two
    output nodes scaled with softmax activation. The problem becomes a standard multiclass
    classification problem. Research results comparing the one-node and two-node techniques
    are inconclusive, in my opinion.


