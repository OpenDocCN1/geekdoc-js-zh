  - "[PAGE 59]\n\n```\n// 4. evaluate model\nlet trainAcc = nn.accuracy(trainX, trainY);\n\
    let testAcc = nn.accuracy(testX, testY);\nconsole.log(\"nAccuracy on training\
    \ data \" = + \ntrainAcc.toFixed(4).toString());\nconsole.log(\"nAccuracy on test\
    \ data \" = + +\ntestAcc.toFixed(4).toString());\n...\n```\n\nThe accuracy() method\
    \ returns the classification accuracy of the model in decimal format, for example\
    \ 0.9500, not in percentage format, like 95.00. The demo program design accuracy()\
    \ as a class method, so it is called let acc = nn.accuracy(trainX, trainY). An\
    \ alternative design is to implement accuracy() as a standalone function, in which\
    \ case it would be called let acc = accuracy(nn, trainX, trainY).\n\nBecause the\
    \ Iris data set is simple, training is very quick. But realistic problems require\
    \ hours of training. The demo program does not save the model file, but if training\
    \ takes a long time, you'll usually want to save the values of the weights and\
    \ biases to file.\n\nThe demo concludes by making a prediction on a new, previously\
    \ unseen iris flower.\n\n```\n// 5. used model\nlet unknown = [5.1, 3.1, 4.1,\
    \ 2.1]; // set., set., ver., vir.\nlet predicted = nn.eval(unknown);\nconsole.log(\"\
    nSetting features of iris to predict: \");\nU.vecshow(unknown, 1, 12);\nconsole.log(\"\
    nPredicted quasi-probabilities: \");\nU.vecShow(predicted, 4, 12);\n...\n```\n\
    \nThe input values of (5.1, 3.1, 4.1, 2.1) are designed to be a challenge for\
    \ the model. The first two values (petal length and width, 5.1, 3.1) are typical\
    \ of the setosa species. The third predictor (petal length, 4.1) is typical of\
    \ versicolor, and the fourth predictor value (petal width, 2.1) is typical of\
    \ virginica.\n\nThe eval() method returns a set of values (0.0570, 0.4511, 0.4918),\
    \ and it's up to you to interpret the results. Because the third value is the\
    \ largest, the model predicts the species of the unknown flower is the third species\
    \ (virginica). If you wish, you can canonically display the results.\n\n```\n\
    let species = [\"setosa\", \"versicolor\", \"virginica\"];\nlet predIdx = U.argmax(predicted);\n\
    let predSpecies = species[predIdx];\nconsole.log(\"Predicted species = \" + predSpecies);\n\
    ```\n\nEven though the output values sum to 1.0 and so, the values really aren't\
    \ probabilities in the mathematical sense. However, the relative values give you\
    \ insights into how you can be of of the prediction. In this case, the pseudo-probabilities\
    \ for versicolor and virginica are so close, you shouldn't have strong confidence\
    \ in the prediction, compared to a result of something like (0.1000, 0.2000, 0.7000)."
- md: "\n# Weight and bias initialization\n\nA neural network is very sensitive to\
    \ the initial values of the weights and biases. The demo program uses the most\
    \ basic form of initialization, which is to initialize all weights to small random\
    \ values from -0.01 and +0.01, and to initialize all biases to 0.0 values. The\
    \ class method `initweights()` is defined.\n\n```javascript\ninitweights() {\n\
    \  let lo = -0.01;\n  let hi = 0.01;\n  for (let i = 0; i < this.ni; ++i) {\n\
    \    for (let j = 0; j < this.nh; ++j) {\n      this.ihweights[i][j] = (hi - lo)\
    \ * this.rnd.next() + lo;\n    }\n  }\n  for (let j = 0; j < this.no; ++j) {\n\
    \    for (let k = 0; k < this.nh; ++k) {\n      this.howeight[j][k] = (hi - lo)\
    \ * this.rnd.next() + lo;\n    }\n  }\n}\n```\n\nBecause the neural network architecture\
    \ is 4-7-3, there are 4 * 7 = 28 input-to-hidden weights and 7 * 3 = 21 hidden-to-output\
    \ weights. Each of these 49 weights is initialized to a random value between **lo\
    \ = -0.01** and **hi = +0.01**. All of the 7 + 3 = 10 biases in the network are\
    \ left initialized to their original 0.0 values assigned in the `constructor()`\
    \ method.\n\nThe limit values of (-0.01, +0.01) used for the weights are hyperparameters.\
    \ Fixed weight initialization limit values usually work well with simple, single-hidden-layer\
    \ networks, but often don't work well with deep neural networks. Researchers have\
    \ devised several advanced neural weight initialization algorithms, including\
    \ Glorot uniform, Glorot normal, He uniform, He normal, and LeCun normal.\n\n\
    Even though these advanced initialization algorithms were designed for use with\
    \ deep neural networks, they often work very well with simple neural networks.\
    \ The Glorot uniform algorithm can be implemented as in the following.\n\n```javascript\n\
    initGlorotUniform() {\n    let fanIn = this.ni;\n    let fanOut = this.nh;\n\n\
    \    let variance = 6.0 / (fanIn + fanOut);\n    let lo = -variance; hi = variance;\n\
    \n    for (let i = 0; i < this.ni; ++i) {\n        for (let j = 0; j < this.nh;\
    \ ++j) {\n            this.ihWeights[i][j] = (hi - lo) * this.rnd.next() + lo;\n\
    \        }\n    }\n\n    fanIn = this.ni;\n    fanOut = this.nh;\n\n    variance\
    \ = 6.0 / (fanIn + fanOut);\n    lo = -variance; hi = variance;\n\n    for (let\
    \ j = 0; j < this.ni; ++j) {\n        for (let k = 0; k < this.no; ++k) {\n  \
    \          this.howWeights[j][k] = (hi - lo) * this.rnd.next() + lo;\n       \
    \ }\n    }\n} // initGlorotUniform()\n```\n\nIf you examine the code, you'll see\
    \ that instead of initializing weights to scale to small values between arbitrary\
    \ limits, the Glorot uniform algorithm determines the limit values based on the\
    \ architecture of the network. In addition to working well, the Glorot uniform\
    \ algorithm for initialization eliminates two hyperparameters that you have to\
    \ deal with.\n\n# Error and accuracy\n\nClassification accuracy and model prediction\
    \ error are closely related. The key high-level takeaway is that you use error\
    \ during training, and you use accuracy after training.\n\nSuppose you have only\
    \ three data items for training, and at some point during training, the current\
    \ input and output values are the following.\n\n| input | target (correct) | computed\
    \ |\n|---|---|---|\n| 5.0 3.5 1.5 0.5 | 1 0 0 | 0.70 0.20 0.10 |\n| 6.5 2.9 4.2\
    \ 1.2 | 0 1 0 | 0.40 0.35 0.25 |\n| 5.9 3.2 2.3 1.8 | 0 0 1 | 0.30 0.15 0.55 |\n\
    \nAccuracy is just the percentage of correct predictions. The input values and\
    \ the known correct output values (often called the target values) are contained\
    \ in the training data. The computed outputs are determined by the input values\
    \ and the current values of the network weights and biases. By this data, the\
    \ first and third items are correctly predicted, but the second item is incorrectly\
    \ predicted. Therefore, the classification accuracy is 2 / 3 = 0.6667.\n\nFrom\
    \ a computational point of view, note that determine if a set of computed output\
    \ values gives a correct prediction, you can compare argmax(computed) and argmax(target)\
    \ and check if the index returns the same.\n\nAccuracy is a relatively crude metric.\
    \ You can imagine situations where the computed outputs are nearly perfect, for\
    \ example, (0.9990, 0.0004, 0.0006) for the first item. And you can imagine situations\
    \ where the computed outputs are just barely correct, for example, (0.3335, 0.3332,\
    \ 0.3333) for the first item. But accuracy counts correct-incorrect predictions.\n\
    \nIn pseudo-code, the NeuralNet accuracy method is the following.\n\n```text\n\
    Loop through training data item\ncomputed = result of feeding item X to network\n\
    target = item Y values\nif computed gives correct prediction\n    increment correct\
    \ counter\nelse\n    increment wrong counter\nend\nreturn number correct / (number\
    \ correct + wrong number)\n```\n\nThe demo implementation.\n\n```javascript\n\
    accuracy(dataX, dataY) {\n    let nc = 0; let nw = 0;\n\n    for (let i = 0; i\
    \ < dataX.length; i++) { // each data item\n        let X = dataX[i];\n      \
    \  let Y = dataY[i]; // target output like (0, 1, 0)\n\n        let outpt = this.equal(X);\
    \ // computed output like (0.23, 0.66, 0.11)\n        let computedIdx = U.argmax(outpt);\n\
    \        let targetIdx = U.argmax(Y);\n\n        if (computedIdx == targetIdx)\
    \ {\n            ++nc;\n        } else {\n            ++nw;\n        }\n    }\n\
    \n    return nc / (nc + nw);\n} // accuracy()\n```\n\nCompared to a heavyweight\
    \ neural network library, such as TensorFlow or PyTorch, writing a lightweight\
    \ implementation from scratch allows you to customize your code. For example,\
    \ you might want to count a prediction as correct if the computed output values\
    \ are close to some threshold value. You might want to insert `console.log()`\
    \ messages to see exactly which input items are correctly predicted, and which\
    \ are incorrectly predicted.\n\nMean squared (MSE) is the average of the sum of\
    \ the squared differences between the computed outputs and the target outputs.\
    \ The squared error for the three hypothetical data items are the following:\n\
    \n```text\nerror(item 0) = (1 - 0.70)^2 + (0 - 0.20)^2 + (0 - 0.10)^2 = 0.09\n\
    error(item 1) = (0 - 0.40)^2 + (1 - 0.35)^2 + (0 - 0.25)^2 = 0.64\nerror(item\
    \ 2) = (0 - 0.30)^2 + (0 - 0.15)^2 + (1 - 0.55)^2 = 0.31\n```\n\nTherefore, MSE\
    \ = (0.09 + 0.64 + 0.31) / 3 = 0.36.\n\nNote that instead of computing the error\
    \ for each term and then summing those, you can sum the differences between computed\
    \ and target, as the demo code does.\n"
  mdcn: "\n\n# 权重与偏置初始化\n\n神经网络对权重和偏置的初始值非常敏感。演示程序使用了最基础的初始化形式，即将所有权重初始化为 -0.01 到\
    \ +0.01 之间的小随机值，并将所有偏置初始化为 0.0。定义了类方法 `initweights()`。\n\n```javascript\ninitweights()\
    \ {\n  let lo = -0.01;\n  let hi = 0.01;\n  for (let i = 0; i < this.ni; ++i)\
    \ {\n    for (let j = 0; j < this.nh; ++j) {\n      this.ihweights[i][j] = (hi\
    \ - lo) * this.rnd.next() + lo;\n    }\n  }\n  for (let j = 0; j < this.no; ++j)\
    \ {\n    for (let k = 0; k < this.nh; ++k) {\n      this.howeight[j][k] = (hi\
    \ - lo) * this.rnd.next() + lo;\n    }\n  }\n}\n```\n\n因为神经网络架构是 4-7-3，因此有 4 *\
    \ 7 = 28 个输入到隐藏层的权重，以及 7 * 3 = 21 个隐藏层到输出层的权重。这 49 个权重中的每一个都被初始化为于 **lo = -0.01**\
    \ 和 **hi = +0.01** 之间的随机值。网络中所有的 7 + 3 = 10 个偏置都保留为 `constructor()` 方法中分配的原始 0.0\
    \ 值。\n\n用于权重的 (-0.01, +0.01) 限制值是超参数。固定的权重初始化限制值通常对于简单的单隐藏层网络效果良好，但对于深度神经网络通常不起作用。研究人员设计了若干先进的神经权重初始化算法，包括\
    \ Glorot 均匀、Glorot 正态、He 均匀、He 正态和 LeCun 正态。\n\n尽管这些先进的初始化算法是为深度神经网络设计的，但它们在简单神经网络上通常也运行良好。Glorot\
    \ 均匀算法可以如下所示实现。\n\n```javascript\ninitGlorotUniform() {\n    let fanIn = this.ni;\n\
    \    let fanOut = this.nh;\n\n    let variance = 6.0 / (fanIn + fanOut);\n   \
    \ let lo = -variance; hi = variance;\n\n    for (let i = 0; i < this.ni; ++i)\
    \ {\n        for (let j = 0; j < this.nh; ++j) {\n            this.ihWeights[i][j]\
    \ = (hi - lo) * this.rnd.next() + lo;\n        }\n    }\n\n    fanIn = this.ni;\n\
    \    fanOut = this.nh;\n\n    variance = 6.0 / (fanIn + fanOut);\n    lo = -variance;\
    \ hi = variance;\n\n    for (let j = 0; j < this.ni; ++j++) {\n        for (let\
    \ k = 0; k < this.no; ++k++) {\n            this.howWeights[j][k] = (hi - lo)\
    \ * this.rnd.next() + lo;\n        }\n    }\n} // initGlorotUniform()\n```\n\n\
    如果你检查代码，你会发现 Glorot 均匀算法并不是将权重初始化为任意限制范围内的小值，而是根据网络的架构来确定限制值。除了效果良好外，Glorot 均匀初始化还消除了你必须处理的两个超参数。\n\
    \n# 误差与准确率\n\n分类准确率和模型预测误差密切相关。关键的层级结论是：你会在训练期间使用误差，而在训练后使用准确率。\n\n假设你只有三个数据项用于训练，并且在训练过程的某一点，当前的输入和输出值如下。\n\
    \n| 输入 | （正确） | 计算 |\n|---|---|---|\n| 5.0 3.5 1.5 0.5 | 1 0 0 | 0.70 0.20 0.10\
    \ |\n| 6.5 2.9 4.2 1.2 | 0 1 0 | 0.40 0.35 0.25 |\n| 5.9 3.2 2.3 1.8 | 0 0 1 |\
    \ 0.30 0.15 0.55 |\n\n准确率仅仅是正确预测的百分比。输入值和已知的正确输出值（通常称为目标值）包含在训练数据中。计算输出是由输入值以及网络权重和偏置的当前值决定的。根据这些数据，第一项和第三项预测正确，但第二项预测错误。因此，分类准确率是\
    \ 2 / 3 = 0.6667。\n\n从计算的角度来看，请注意要判断一组计算输出值是否提供了正确预测，你可以比较 `argmax(computed)`\
    \ 和 `argmax(target)` 并检查返回的索引是否相同。\n\n准确率是一个相对粗略的指标。你可以想象计算输出几乎完美的情况，例如第一项的 (0.9990,\
    \ 0.0004, 0.0006)。你也可以想象计算输出仅勉强正确的情况，例如第一项的 (0.3335, 0.3332, 0.3333)。但计算输出恰恰是正确的。\n\
    \n在伪代码中，NeuralNet 的准确率方法如下：\n\n```text\n遍历训练数据项\ncomputed = 输入 X 的结果\ntarget =\
    \ 值 Y\n如果 computed 给正确预测\n    增加正确计数器\nelse\n    增加错误计数器\nend\n返回正确计数 / (正确计数\
    \ + 错误计数)\n```\n\n演示实现：\n\n```javascript\naccuracy(dataX, dataY) {\n    let nc\
    \ = 0; let nw = 0;\n\n    for (let i = 0; i < dataX.length; i++) { // 每个数据项\n\
    \        let X = dataX[i];\n        let Y = dataY[i]; // 目标输出 (0, 1, 0)\n\n  \
    \      let outpt = this.equal(X); // 计算输出 (0.23, 0.66, 0.11)\n        let computedIdx\
    \ = U.argmax(outpt);\n        let targetIdx = U.argmax(Y);\n\n        if (computedIdx\
    \ == targetIdx) {\n            ++nc;\n        } else {\n            ++nw;\n  \
    \      }\n    }\n\n    return nc / (nc + nw);\n} // accuracy()\n```\n\n与 TensorFlow\
    \ 或 PyTorch 等重量级神经网络库相比，从零编写轻级实现允许你自定义代码。例如，如果计算输出值接近某个阈值，你可能希望将该预测视为正确。你可能想插入\
    \ `console.log()` 信息来查看具体哪些输入项是预测正确的，哪些是错误的。\n\n均方误差（MSE）是计算输出与目标输出之间平方差和的平均值。这三个假设数据项的平方误差如下：\n\
    \n```text\nerror(item 0) = (1 - 0.70)^2 + (0 - 0.20)^2 + (0 - 0.10)^2 = 0.09\n\
    error(item 1) = (0 - 0.40)^2 + (1 - 0.35)^2 + (0 - 0.25)^2 = 0.64\nerror(item\
    \ 2) = (0 - 0.30)^2 + (0 - 0.15)^2 + (1 - 0.55)^2 = 0.31\n```\n\n因此，MSE = (0.09\
    \ + 0.64 + 0.31) / 3 = 0.36。\n\n注意不是计算每一项的误差然后求和，而是像演示代码所的那样，对计算值与目标值之间的差求和。\n\
    \n"
