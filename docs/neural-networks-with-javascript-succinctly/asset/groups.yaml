  mdcn: "\n每个轮次（epoch）代表对训练数据的完整遍历一次。演示代码通过 `this.shuffle(indices)` 语句打乱了训练项的顺序。类方法\
    \ `shuffle()` 使用 Fisher-Yates 算法随机重排列向量 `indices` 中索引值的顺序。该方法的定义如下：\n\n```\nshuffle(v)\n\
    {\n  let n = v.length;\n\n  for (let i = 0; i < n; i++) {\n    let r = this.rnd.nextInt(i,\
    \ n); // 选取一个随机索引。\n\n    let tmp = v[r]; // 交换值。\n    v[r] = v[i];\n    v[i]\
    \ = tmp;\n  }\n}\n```\n\n`shuffle()` 方法遍历其向量参数 `v` 并改变随机索引处的值。该算法非常出奇地微妙。例如，将语句\
    \ `this.rnd.nextInt(i, n)` 错误地编码为 `this.rnd.nextInt(0, n)` 将产生强偏差的结果。此外，注意循环条件\
    \ `i < n` 可以更改为 `i < n-1`，因为最后一次迭代会交换向量 `v` 本身最后一个单元格的值。\n\n隐藏到输出的权重梯度通过以下语句计算：\n\
    \n```\n// 计算输出节点信号。\nfor (let k = 0; k < this.no; k++) {\n  let derivative = (1\
    \ - this.oNodes[k]) * this.oNodes[k]; // 假设为 softmax。\n  oSignals[k] = derivative\
    \ * (this.oNodes[k] - Y[k]); // E=(t-o)^2\n}\nE=(o-t)\n\n// 使用输出信号计算隐藏到输出的权重梯度。\n\
    for (let j = 0; j < this.no; j++) {\n  for (let k = 0; k < this.no; k++) {\n \
    \   hoGrads[j][k] = oSignals[k] * this.hNodes[j];\n  }\n}\n```\n\n输出信号的导数项取决于输出层的激活函数。对于\
    \ softmax 激活，其导数为 $0 * (1 - o)$，其中 $o$ 是输出节点的值。`oSignals` 向量值的计算假设平方方误差定义为 $(target-output)^2$，由于误差项中的负号，这得出了\
    \ $(output-target)$。\n\n在计算出原始输出信号后，梯度通过相关的隐藏节点值乘以输出信号来计算。这些思想中没有什么是是简单或显而易见的。从开发者的角度来看，需要记住的观点是：隐藏到输出的梯度取决于误差函数的选择以及输出层激活函数的选择。\n\
    \n输出节点偏置的梯度计算方式如下：\n\n```\n// 使用输出信号计算输出节点偏置梯度。\nfor (let k = 0; k < this.no;\
    \ ++k) {\n  obGrads[k] = oSigmoid[k] * 1.0; // 1.0 虚拟输入可以省略。\n}\n```\n\n乘以 1.0\
    \ 的操作可以省略，因为它不影响结果。这里的想法是：权重连接两个节点，通过使用虚拟的 1.0 输入值，你可以将偏置作为值连接到一个，这展示了隐藏到输出权重梯度计算与输出节点偏置计算之间的对称性。\n\
    \n接下来，使用输出节点信号和隐藏层激活函数的微数（在本例中为双曲正切函数）计算隐藏节点。\n\n```\n// 计算隐藏节点信号。\nfor (let j\
    \ = 0; j < this.nh; ++j) {\n  let sum = 0.0;\n  for (let k = 0; k < this.no; ++k)\
    \ {\n    sum += oSigmoid[k] * this.weights[j][k]\n  }\n  let derivative = (1 -\
    \ this.hNodes[j]) * (1 + this.hNodes[j]); // tanh\n  hSigmoid[j] = derivative\
    \ * sum;\n  ...\n}\n```\n\n这段代码背后的思想是机器学习中最深奥的思想之一。然而，从实际角度来看，你唯一需要更改的语句是导数项的计算（如果你决定使用不同的隐藏层激活函数）。例如，如果你使用\
    \ logistic sigmoid 激活，$y = logig(x)$ 的微数导数为 $y * (1 - y)$。\n\n```javascript\n\
    let derivative = this.hNodes[j] * (1 - this.hNodes[j]); // logistic\nsigmoid\n\
    ```\n\n接下来，计算输入到隐藏的权重梯度以及隐藏节点偏置的梯度。\n\n```javascript\n// 使用隐藏信号计算输入到隐藏的权重梯度。\n\
    for (let i = 0; i < this.ni; ++i) {\n  for (let j = 0; j < this.nh; ++j) {\n \
    \   ihGrads[i][j] = hSignals[j] * this.Nodes[i];\n  }\n}\n```\n\n```javascript\n\
    // 使用隐藏信号计算节点偏置。\nfor (let j = 0; j < this.nh; ++j) {\n  hbGrads[j] = hSignals[j]\
    \ * 1.0; // 1.0 虚拟输入可以省略\n}\n```\n\n总结来说，目标是给每个权重和偏置加上一个小值，使得计算出的输出更接近目标值（或等同于减少误差）。为了计算\
    \ delta，你需要为每个权重和偏置计算一个梯度值。梯度值由一个信号和一个输入值组成（对于偏置，输入是虚拟的 1.0）。\n\n在计算梯度后，下一步是计算\
    \ delta 值并使用它们来修改权重和偏置。在计算梯度时，必须从输出反向计算（这就是为什么被称为反向传播的原因）。但在更新权重和偏置时，你可以按任何顺序进行。演示代码从输入到输出，以强调权重和偏置的顺序可以与梯度计算的顺序不同。\n\
    \n```\n// 更新输入到隐藏的权重\nfor (let i = 0; i < this.ni; ++i) {\n  for (let j = 0; j\
    \ < this.nh; ++j) {\n    let delta = -1.0 * lrnRate * ihGrads[i][j];\n    this.Weights[i][j]\
    \ += delta;\n  }\n}\n```\n\n如果你将此代码与图 3-5 中的权重更新方程对比，你就能看到代码与数学之间的一一对应关系。记住 -1\
    \ 项的目的是为了通过 `+=` 运算符更新权重。相反，你可以编写如下示例：\n\n```\nlet delta = lrnRate * ihGrads[i][j];\n\
