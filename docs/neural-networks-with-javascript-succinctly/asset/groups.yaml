  - "[PAGE 94]\n\n# Saving and loading model weights\n\nThe NeuralNet class method\
    \ saveWeights() is defined as the following.\n\n```\nsaveWeights(fn)\n  let wts\
    \ = this.getWeights();\n  let n = wts.length;\n  let s = \"\"\n\n  for (let i\
    \ = 0; i < n-1; i++) { // all except last value.\n    s += wts[i].toString() +\
    \ \",\";\n  }\n  s += wts[n-1]; // last value, no trailing comma.\n\n  FS.writeFile(fn,\
    \ s);\n```\n\nThe statement wts = this.getWeights() returns a vector named wts\
    \ with the weights and biases serialized as the input-to-hidden weights, followed\
    \ by the hidden node biases, followed by the hidden-to-output weights, followed\
    \ by the output node biases. Because the demo network has a 5-25-3 architecture,\
    \ there are a total of (5 * 25) + 25 + (25 * 3) + 3 = 228 weights and biases.\
    \ The weights and biases are serialized to a single, comma-separated string (without\
    \ a trailing comma), which is written to a text file.\n\nThere are many alternative\
    \ designs you can use. For example, you might want to write an architecture such\
    \ as 5,25,3 and then follow with the weights and biases, or you might want to\
    \ write the weights using JSON or XML format, and so on.\n\nAlmost all widely\
    \ used deep neural network libraries, such as TensorFlow, Keras, and PyTorch,\
    \ save models in a proprietary binary format. However, many of these libraries\
    \ have added support for the ONNX (open neural network exchange) standard.\n\n\
    The counterpart to saveWeights() is a method loadweights() that loads saved weights\
    \ from file into a neural network. A loadweights() method can be defined as the\
    \ following."
  - "[PAGE 95]\n\n```\nloadWeights(fn)\n{\n  let n = (this.ni * this.nh) + this.nh\
    \ + (this.nh * this.no) + this.no);\n  let wts = U.vecSync(n, 0.0);\n\n  let all\
    \ = FS.readFileSync(fn, \"utf8\");\n  let strVals = all.split(\",\");\n  let nn\
    \ = strVals.length;\n\n  if (n != nn) {\n    throw(\"Size error in NeuralNet.loadWeights()\"\
    );\n  }\n\n  for (let i = 0; i < n; i++) {\n    wts[i] = parseFloat(strVals[i]);\n\
    \  }\n  this.setWeights(wts);\n}\n```\n\nThe method sets up a numeric vector to\
    \ the serialized weights and biases, then reads all those values from file into\
    \ a single string. The split is on the comma characters, and then the individual\
    \ values are converted to numeric form and placed into the vector. The vector\
    \ is passed to the setWeights() method, which places the values into the neural\
    \ network.\n\nMethod loadWeights() can be called along any of the lines of following.\n\
    \n```\n// assume a 5-25-3 new neural network has been trained and saved earlier.\n\
    // nn = newNeuralNet(5, 25, 3, 0);\n// nn.loadWeights(\"\\\\models\\\\people_wts.txt\"\
    );\n// use nn to make predictions.\n```\n\nAn extension to the save-load approach\
    \ is to implement a saveModel() function that saves the network weights and biases\
    \ values also the architecture (number of input, hidden, and output nodes; the\
    \ hidden layer activation function; the output layer function; the error and so\
    \ on). You could implement a loadModel() function that creates a neural network\
    \ and loads the trained weights and biases values.\n\n# Regularization and weight\
    \ decay\n\nRegularization is one of many techniques that are intended to reduce\
    \ model overfitting. There are several forms of neural network regularization.\
    \ The most common form is L2 regularization. Briefly, the graph of a model where\
    \ overfitting has occurred has a spiky appearance, as the graph in Figure 4-2.\
    \ Graphs resemble the graph of a polynomial function that has large-magnitude\
    \ coefficients. These coefficients correspond to neural network weights. Therefore,\
    \ the idea behind L2 regularization is to keep the magnitudes of the weights small,\
    \ which will reduce the likelihood of overfitting. Regularization can be used\
    \ for classification or regression problems."
- md: "\nThe screenshot in Figure 4-3 shows an example of using L2 regularization.\
    \ The goal is to predict a person's political leaning (conservative, moderate,\
    \ or liberal) from sex, age, geo-region, and annual income.\n\nThe L2 regularization\
    \ requires an additional hyperparameter lambda, which is set to 0.0005 in the\
    \ demo. Without regularization, the final training and test classification accuracies\
    \ (shown in Figure 4-1) were 96.25% and 52.50% but with regularization, the final\
    \ accuracies are 76.88% and 77.50%.\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_96_0.png)\n\
    \n# Figure 4-3: L2 Regularization Can Reduce Overfitting and Improve Accuracy\n\
    \nWhen regularization works properly, model accuracy on the training data is lower\
    \ than accuracy on the training data without regularization, but model accuracy\
    \ on the test data, is the key metric, higher.\n\nThe underlying math principle\
    \ is that L2 regularization works by adding a term that penalizes weight values\
    \ to the error function. The ideas are illustrated by the equations in Figure\
    \ 4-4.\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_97_0.png)\n\n# Figure 4-4:\
    \ Adding a Penalty to Error Changes Weight Deltas\n\nYou add a fraction (often\
    \ called the \"L2 regularization constant\" and given the lowercase lambda Greek\
    \ letter) of the sum of the squared values to the error. The top-most equation\
    \ is squared augmented with the L2 weight penalty: one-half of the squared differences\
    \ between the target values and the computed output values, plus one-half a constant\
    \ lambda times the sum of the squared values.\n\nDuring training, the back-propagation\
    \ algorithm iteratively adds a weight-delta (which can be positive or negative)\
    \ to each weight. The weight-delta is a fraction (called the learning rate, usually\
    \ given lowercase eta Greek symbol, which resembles a script 'n') of the weight\
    \ gradient. The weight gradient is the calculus derivative of the error function.\n\
    \nTo use L2 regularization, you have to add the derivative of the weight penalty.\
    \ Luckily, this is quite easy. You can see this as the last term in the weight-delta\
    \ equation. Let me emphasize that I've abused the formal notation somewhat, and\
    \ this explanation is not one hundred percent accurate. But a thorough, rigorous\
    \ explanation of the relationship between back-propagation and L2 regularization\
    \ would take many pages of math.\n\nAlthough L2 regularization concepts are complex,\
    \ modifying back-propagation to use it is simple. regularization.js makes only\
    \ a few changes. The definition of the class method `train()` requires a new parameter\
    \ for the L2 regularization weight term.\n\n```javascript\ntrain(trainX, trainY,\
    \ lrRate, maxEpochs, lamda) {\n```\n\nI use the misspelled `lamda` rather than\
    \ \"lambda\" because lambda is a reserved word in many languages. In `train()`,\
    \ the computations for the hidden-to-output gradients and input-to-hidden gradients\
    \ have to be changed slightly to add weight penalty.\n\n```javascript\n// compute\
    \ hidden-to-output gradients using output signals.\nfor (let j = 0; j < this.nh;\
    \ j++) {\n  for (let k = 0; k < this.no; k++) {\n    hoGrads[j][k] = oSignals[k]\
    \ * this.nodes[j];\n    hoGrads[j][k] += lambda * this.hWeights[j];\n  }\n}\n\
    ```\n\n```javascript\n// compute input-to-hidden gradients using hidden signals.\n\
    for (let i = 0; i < this.ni; i++) {\n  for (let j = 0; j < this.nh; j++) {\n \
    \   ihGrads[i][j] = hSignals[j] * this.nodes[i];\n    ihGrads[i][j] += lambda\
    \ * this.ihWeights[i][j];\n  }\n}\n```\n\nIn short, to add L2 regularization to\
    \ standard back-propagation, you only need to add two lines of code. To call the\
    \ `train()` method, you just need to add the lambda weighting term.\n\n```javascript\n\
    // 3. train network\nlet lrRate = 0.01;\nlet maxEpochs = 50000;\nlet lambda =\
    \ 0.0005;\nconsole.log(\"starting training with learning rate = 0.01, lambda =\
    \ 0.0005\");\nnn.train(trainX, trainY, maxEpochs, lambda);\nconsole.log(\"Training\
    \ complete\");\n```\n\nAs it turns out, L2 regularization is extremely sensitive\
    \ to the value used for the lambda weighting term and finding a good value for\
    \ lambda can be difficult. When regularization works, it can be highly effective\
    \ in reducing model overfitting. Researchers worked out the details of L2 regularization\
    \ for neural networks in the 1990s. But at the same time, engineers discovered\
    \ the same idea independently and called the technique \"weight decay.\" Formal\
    \ L2 regularization decreases the value of a network's gradients, and then the\
    \ gradients are used to decrease the magnitude of the network's weights and biases.\n\
    \n# Dropout\n\nDropout is an advanced technique used to reduce the likelihood\
    \ of neural network overfitting. The technique sounds strange: on each training\
    \ iteration, a portion (typically something like 0.50 or 0.20) of the network's\
    \ hidden nodes are randomly dropped, meaning the training algorithm acts as if\
    \ the nodes that have been selected to drop do not exist.\n\nDropout can be used\
    \ for classification problems or regression problems. It can be used in conjunction\
    \ with other techniques such as regularization, or by itself itself.\n\nThe screenshot\
    \ in Figure 4-5 shows an example of using dropout. The goal is to predict a person's\
    \ leaning (conservative, moderate, or liberal) from their sex, age, geo-region\
    \ (eastern, western, or central), and annual income.\n\nWeight decay skips the\
    \ modification of the gradients and directly reduces the magnitude of the weights\
    \ and biases on each iteration. The weight decay mechanism is much simpler than\
    \ L2 regularization. The computation of gradients is exactly as it is without\
    \ regularization. Then during weight and bias updates, after each update, the\
    \ magnitude is decreased. For example the following:\n\n```javascript\n// update-to-hidden\
    \ weights and apply weight decay.\nfor (let i = 0; i < this.ni; i++) {\n  for\
    \ (let j = 0; j < this.nj; j++) {\n    let delta = -1.0 * lr * ihGrads[i][j];\n\
    \    this.weights[i][j] += delta;\n    this.weights[i][j] *= lambda; // decrease\
    \ weight (from L2 lambda)\n  }\n}\n```\n\nSomewhat unfortunately, both L2 regularization\
    \ and weight decay regularization usually use a parameter named lambda as the\
    \ scaling constant. However, by looking at the code, you can see that the lambda\
    \ values are used very differently. The point is, if you're using a neural network\
    \ library, the meaning of a regularization lambda can vary (larger values of lambda\
    \ reduce more than smaller values).\n\nA technique that is close to L2 regularization\
    \ is called max norm constraint. The idea is to put a fixed limit on the magnitude\
    \ of all weights. For example, immediately after updating each weight and bias\
    \ in the `train()` method, you check to see if the new weight value is greater\
    \ than a fixed threshold value (perhaps 10.0) or less than the corresponding threshold\
    \ value (-10.0), and if so, you adjust the weight to the threshold value.\n"
  mdcn: "\n\n图 4-3 中的截图展示了使用 L2 正则化的示例。目标是根据性别、年龄、地理区域和年收入预测一个人的政治倾向（保守、中立或自由派）。\n\
    \nL2 正则化需要一个额外的超参数 `lambda`，在演示中被设置为 0.0005。如果不使用正则化，最终的训练和测试分类准确率（如图 4-1 所示）分别为\
    \ 96.25% 和 52.50%，但使用正则化后，最终准确率变为 76.88% 和 77.50%。\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_96_0.png)\n\
    \n# 图 4-3：L2 正则化可以减少过拟合并提高准确率\n\n当正则化生效时，模型在训练数据上的准确率低于未正则化时的准确率，但在测试数据上的准确率（这是关键指标）会更高。\n\
    \n其数学原理是 L2 正则化通过向误差函数添加一个惩罚权重值的项来起作用。这些思想如图 4-4 中的方程所示。\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_97_0.png)\n\
    \n# 图 4-4：为误差添加惩罚以改变权重增量\n\n你将平方和的一部分加上误差（通常称为“L2 正则化常数”，用小写希腊字母 `lambda` 表示）。最顶部的方程是带有\
    \ L2 权重惩罚的平方：目标值与计算输出值之间平方差的分之一，加上常数 `lambda` 乘以平方和的分之一。\n\n在训练过程中，反向传播算法迭代地向每个权重添加一个权重增量（可以是正也可以是负）。权重增量是权重梯度的部分（称为学习率，通常用小写希腊符号\
    \ `eta` 表示，它看起来像手写的 'n'）。权重梯度是误差函数的微分导数。\n\n要使用 L2 正则化，你必须添加权重惩罚的导数。幸运的是，这非常简单。你可以将其视为权重增量方程中的最后一项。我要强调的是，我某种程度上滥用了正式符号，这个解释并不是百分之百准确。但对反向传播与\
    \ L2 正则化之间关系的彻底、严格的解释需要大量的数学。\n\n尽管 L2 正则化的概念很复杂，但修改反向传播以使用它是简单的。`regularization.js`\
    \ 只需要几处修改。类方法 `train()` 的定义需要一个新参数用于 L2 正则化权重项。\n\n```javascript\ntrain(trainX,\
    \ trainY, lrRate, maxEpochs, lamda) {\n```\n\n我使用了拼错误的 `lamda` 而不是 \"lambda\"\
    ，因为 `lambda` 是许多语言中的保留字。在 `train()` 中，隐藏层到输出的梯度以及输入到隐藏层的梯度计算需要稍微修改以添加权重惩罚。\n\n\
    ```javascript\n// 使用输出信号计算隐藏层到输出的梯度\nfor (let j = 0; j < this.nh; j++) {\n  for\
    \ (let k = 0; k < this.no; k++) {\n    hoGrads[j][k] = oSignals[k] * this.nodes[j];\n\
    \    hoGrads[j][k] += lambda * this.hWeights[j];\n  }\n}\n```\n\n```javascript\n\
    // 使用隐藏信号计算输入到隐藏层的梯度\nfor (let i = 0; i < this.ni; i++) {\n  for (let j = 0; j\
    \ < this.nh; j++) {\n    ihGrads[i][j] = hSignals[j] * this.nodes[i];\n    ihGrads[i][j]\
    \ += lambda * this.ihWeights[i][j];\n  }\n}\n```\n\n简而言之，要向标准反向传播添加 L2 正则化，只需要只需要两行代码。调用\
    \ `train()` 方法时，只需要添加 `lambda` 权重项。\n\n```javascript\n// 3. 训练网络\nlet lrRate =\
    \ 0.01;\nlet maxEpochs = 50000;\nlet lambda = 0.0005;\nconsole.log(\"starting\
    \ training with learning rate = 0.01, lambda = 0.0005\");\nnn.train(trainX, trainY,\
    \ maxEpochs, lambda);\nconsole.log(\"Training complete\");\n```\n\n事实证明，L2 正则化对用于\
    \ `lambda` 权重项的值极为敏感，找到一个良好的 `lambda` 值可能是困难的。当正则化有效时，它可以非常有效地减少模型过拟合。研究人员在 20\
    \ 世纪 90 年代解决了神经网络 L2 正则化的细节。与此同时，工程师们独立发现了同样的思想，并将该技术称为“权重衰减”。L2 正则化减少了网络梯度的值，然后使用这些梯度来降低网络权重和偏置的幅度。\n\
    \n# Dropout\n\nDropout 是一种用于减少神经网络过拟合概率的先进技术。该技术听起来很奇怪：在每次训练迭代中，网络部分（通常是 0.50\
    \ 或 0.20）的隐藏节点会被随机丢弃，这意味着训练算法就像被选中丢弃的节点不存在一样。\n\nDropout 可以用于分类问题或回归问题。它可以与其他正则化等技术结合使用，也可以单独使用。\n\
    \n图 4-5 中的截图是使用 Dropout 的示例。目标是根据性别、年龄、地理区域（东部、西部或中部）和年收入预测一个人的政治倾向（保守、中立或自由派）。\n\
    \n权重衰减跳过了梯度的修改，直接在每次迭代中减少权重和偏置的幅度。权重衰减机制比 L2 正则化简单得多。梯度计算与没有正则化时完全相同。但在权重和偏置更新期间，每次更新后都会缩小幅度。例如如下：\n\
    \n```javascript\n// 更新隐藏层权重并应用权重衰减\nfor (let i = 0; i < this.ni; i++) {\n  for\
    \ (let j = 0; j < this.nj; j++) {\n    let delta = -1.0 * lr * ihGrads[i][j];\n\
    \    this.weights[i][j] += delta;\n    this.weights[i][j] *= lambda; // 减少权重（来自\
    \ lambda）\n  }\n}\n```\n\n不幸的是，L2 正则化和权重衰减正则化通常使用命名为 `lambda` 的参数作为比例常数。然而，通过代码可以发现\
    \ `lambda` 值的用法完全不同。重点是，如果你使用神经网络库，正则化 `lambda` 的含义可能会不同（`lambda` 值越大，减少得越多）。\n\
    \n一种与 L2 正则化接近的技术被称为“最大范数约束”（max norm constraint）。其思想是为所有权重的幅度设定一个固定限制。例如，在 `train()`\
    \ 方法更新每个权重和偏置后，立即检查新权重值是否大于固定阈值（可能是 10.0）或小于相应的负阈值（-10.0），如果是，则将权重调整为该阈值。\n\n"
