    Utilities and Cleveland. The Utilities directory contains the Utilities_lib.js
    library file. The Cleveland directory contains the demo Cleveland_bnn.js file
    and subdirectories Data and Models. The Data directory contains the files Cleveland_train.txt
    and Cleveland_test.txt. The Models directory is used to store trained model weights
    and biases values.


