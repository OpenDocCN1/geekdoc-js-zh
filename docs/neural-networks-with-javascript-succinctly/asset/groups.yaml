- md: "\n```javascript\nconsole.log(\"Predicted median house price of town: \");\n\
    U.vecShow(predicted, 6, 1);\n```\n\n```javascript\nlet predPrice = predicted[0]\
    \ * 10000;\nconsole.log(\"$\" + predPrice.toFixed(2).toString() + \")\");\n```\n\
    \nThe demo program normalizes and encodes the new town item. An alternative that\
    \ is useful when making predictions is to use a problem-specific function to normalize\
    \ and encode. For example, using such a function might look like the following.\n\
    \n```javascript\nlet unknownRaw = [0.04819, 0, 36.4, 0.392, (etc.)];\nlet unknownNorm\
    \ = normEncode(unknownRaw);\nlet predicted = nn.eval(unknownNorm);\n```\n\nNote\
    \ that a program-defined function to normalize and encode data needs to know the\
    \ normalization parameters, such as min and max, if min-max normalization is used.\n\
    \nBecause the predicted output value is a house price divided by 10,000, the demo\
    \ program wraps up by displaying the predicted price in a slightly more friendly\
    \ format.\n\n## Identity activation for regression\n\nA neural network classifier\
    \ has multiple output nodes and uses softmax activation on the output nodes so\
    \ that their values sum to 1.0 and can be loosely interpreted as probabilities.\
    \ In backpropagation, the derivative of the function used for output-layer activation\
    \ is used to compute the gradients, which in turn are used to update the network's\
    \ activations and biases.\n\nA neural network for regression uses just a single\
    \ output node and uses the identity function for output layer activation. The\
    \ identity function is just f(x) = x, or in other words, the identity function\
    \ doesn't do anything. It's also somewhat correct to say that a neural network\
    \ for regression has no activation function.\n\nIf y = softmax(x), then the calculus\
    \ derivative is y' = y * (1 - y). If y = x (the identity function), the calculus\
    \ derivative is a constant 1.\n\nIn train(), the output nodes are computed using\
    \ the following statements.\n\n```javascript\n// compute output node signals.\n\
    for (let k = 0; k < this.node; ++k) {\n  // let derivative = (1 - this.Nodes[k])\
    \ * this.Nodes[k]; // softmax\n  let derivative = 1; // identity activation\n\
    \  oSignals[k] = derivative * (this.Nodes[k] - Y[k]); // E=(t-o)^2\n}\n```\n\n\
    I left the statement used for a neural network classifier in a comment so you\
    \ can see the difference between softmax activation and identity activation.\n\
    \nIn the eval() method, the code for regression is the following.\n\n```javascript\n\
    // compute output node before activation.\nfor (let k = 0; k < this.no; ++k) {\n\
    \  for (let j = 0; j < this.nh; ++j) {\n    oSums[k] += this.hNodes[j] * this.howWeights[j][k];\n\
    \  }\n  oSums[k] += this.oBiases[k];\n}\n\n// this.oNodes = U.softmax(oSums);\
    \ // for classifier\nfor (let k = 0; k < this.no; ++k) { // aka \"Identity\"\n\
    \  this.oNodes[k] = oSums[k]; // copy as-is\n}\n```\n\nNo activation function\
    \ is applied when performing regression. There are very rare situations in which\
    \ you might want to apply an activation function on the output node for a regression\
    \ problem. For example, if you apply y = x² as an output activation, then the\
    \ calculus derivative is y' = 2x, and you'd apply that derivative in the training\
    \ method. Additionally, note that, except for rare situations, neural networks\
    \ for regression cannot use cross-entropy error because the output is not a probability\
    \ distribution.\n\n## Momentum\n\nMomentum is a technique used to speed up training.\
    \ Momentum can be applied to a neural network classification problem or a regression\
    \ problem. The screenshot in Figure 5-3 shows an example of training with momentum\
    \ applied to the Boston Dataset problem.\n\nIf you compare the progress accuracy\
    \ without momentum (from Figure 5-1) and with momentum, this is the result.\n\n\
    | epoch | no momentum | momentum |\n| :--- | :--- | :--- |\n| 0 | 0.4360 | 0.5099\
    \ |\n| 500 | 0.7759 | 0.7931 |\n| 1000 | 0.7833 | 0.8079 |\n| 1500 | 0.7822 |\
    \ 0.8128 |\n\nYou'll notice that the prediction accuracy for training with momentum\
    \ improves slightly faster than without momentum.\n\nRecall during training, each\
    \ weight in the network is iteratively updated a little so that the computed output\
    \ values get closer and closer to the correct output values contained in the training\
    \ data. The idea of momentum is that if an update to a weight is good in the sense\
    \ that the training improves, on the next update a bonus is added.\n\nOn each\
    \ training iteration, the weight delta that is added will get larger and larger\
    \ until at some point the delta becomes too big, and the bonus is reset to zero.\
    \ The demo program implements momentum by adding a momentum rate parameter to\
    \ the train() method.\n\n```javascript\ntrain(trainX, trainY, lrnRate, maxEpochs,\
    \ momentRate)\n{\n    let hoGrads = U.matMake(this.nh, this.no, 0.0);\n}\n```\n\
    \nThe train() method maintains the weight deltas from the previous iteration.\n\
    \n```javascript\n// for momentum\nlet ihPrevWtsDeltas = U.matMake(this.nh, this.nh,\
    \ 0.0);\nlet hBiasDeltas = U.vecMake(this.nh, 0.0);\nlet oPrevWtsDeltas = U.matMake(this.nh,\
    \ this.no, 0.0);\nlet oBiasDeltas = U.vecMake(this.no, 0.0);\n```\n\nFigure 5-3:\
    \ Momentum Training Demo\n\nThen, on each update, the input-to-hidden weights\
    \ are updated like this. For example:\n\n```javascript\n// update input-to-hidden\
    \ weights.\nfor (let i = 0; i < this.ni; i++) {\n  for (let j = 0; j < this.nh;\
    \ j++) {\n    let delta = -1.0 * lrnRate * ihGrads[i][j];\n    this.weights[i][j]\
    \ += delta;\n    this.weights[i][j] += momentRate * ihPrevWtsDeltas[i][j]; //\
    \ add bonus\n    ihPrevWtsDeltas[i][j] = delta; // save the delta for next iteration.\n\
    \  }\n}\n```\n\nThe call to `train()` method looks like this:\n\n```javascript\n\
    // 3. train network\nlet lrnRate = 0.015;\nlet maxEpochs = 5000;\nlet momentRate\
    \ = 0.9; // momentum\nconsole.log(\"starting training with learn rate = \" + lrnRate);\n\
    train(trainX, trainY, lrnRate, maxEpochs, momentRate);\nconsole.log(\"Training\
    \ complete\");\n```\n\nWhen momentum works, it can speed up training and improve\
    \ accuracy. A disadvantage is that it introduces a new hyperparameter to tune:\
    \ the momentum rate. The demo uses a momentum rate of 0.2, but a value like 0.9\
    \ is typical. Many deep neural libraries use an advanced form of momentum called\
    \ Nesterov momentum.\n\n## Batch and mini-batch training\n\nBatch training is\
    \ a technique used to be the common approach for neural network training, but\
    \ is now used less often. The screenshot in Figure 5-4 shows an example of batch\
    \ training applied to the Boston dataset.\n\nThe most common technique for neural\
    \ network training is called online training. Online training updates weights\
    \ after processing each item. Batch training processes all items, and then updates\
    \ weights. Batch training can be used for classification or regression problems.\n\
    \nIn pseudo-code, the two approaches are the following:\n\n```\n// online training\n\
    for each training item\n  compute the gradients\n  use gradients from item to\
    \ update weights\nend\n```\n\n```\n// batch training\nfor each training item\n\
    \  compute the gradients\n  accumulate the gradients\nend\nuse average of accumulated\
    \ gradients from all items to update weights\n```\n\nIn the early days of neural\
    \ networks, batch training was very common because it is more principled. The\
    \ online training approach uses a single training item to estimate the true gradient.\
    \ The batch approach uses all training items to estimate the true gradient.\n\n\
    Figure 5-4: Batch Training on the Boston Dataset\n\nBut in practice, online training\
    \ is not always better than batch training for simple, single-hidden-layer neural\
    \ networks. However, a variation of batch training, called mini-batch training,\
    \ is now the most common technique used for deep neural networks.\n\nThe demo\
    \ program implements batch training using the same method signature as online\
    \ training.\n\n```javascript\nbatchTrain(trainX, trainY, lrnRate, maxEpochs)\n\
    {\n  let oSignals = U.vecMake(this.no, 0.0);\n  let hSignals = U.vecMake(this.nh,\
    \ 0.0);\n\n  let n = trainX.length; // 406\n  let indices = U.arange(n); // [0,1,...405]\n\
    \  let freq = Math.trunc(maxEpochs / 10);\n}\n```\n\nIn training, you decode a\
    \ method-set of matrices and vectors to hold the gradients for the weights and\
    \ biases. In batch training, you instantiate matrices and vectors for accumulated\
    \ gradients in the loop that iterates through each training item.\n\n```javascript\n\
    for (let epoch = 0; epoch < maxEpochs; epoch++) {\n  // this.shuffle(indices);\
    \ // no shuffle needed for batch training.\n\n  let ihWtsAccGrads = U.vecMake(this.ni,\
    \ this.nh, 0.0); // accumulated\n  let hBiasAccGrads = U.vecMake(this.nh, 0.0);\n\
    \  let howWtsAccGrads = U.vecMake(this.nh, this.no, 0.0);\n  let oBiasAccGrads\
    \ = U.vecMake(this.no, 0.0);\n}\n```\n\nYou could declare the storage for accumulated\
    \ gradients outside the training loop, but then you'd have to zero-out all values\
    \ immediately inside the loop. Because batch training processes all training items\
    \ before updating weights, it's not necessary to visit the training items in random\
    \ order, because doing so leads to the identical accumulated gradients.\n\nBatch\
