    \ (0.8434) is largest, the prediction is that the person is a political moderate.\n\
    \nThe math equation for softmax is shown in Figure 2-3. There are alternatives\
    \ for output layer activation for neural classifiers, such as Taylor softmax and\
    \ sparsemax, but softmax is by far the most common.\n\n```\nsoftmax(x_i) = \\\
    frac{e^{x_i}}{\\sum_k e^{x_k}}\n```\n\nFigure 2-3: The Softmax Function\n\nIn\
    \ words, the softmax of one of the values in a vector is the exp() value divided\
    \ by the sum of the exp() applied to each of the values in the vector. For (3.0,\
    \ 5.0, 2.0), the **exp** applied to each value and their sum is the following.\n\
