    ## Free? What is the catch?


    There is no catch here. Syncfusion has a vested interest in this effort.


    As a component vendor, our unique claim has always been that we offer deeper and
    broader frameworks than anyone else on the market. Developer education greatly
    helps us market and sell against competing vendors who promise to “enable AJAX
    support with one click,” or “turn the moon to cheese!”


    ## Let us know what you think


    If you have any topics of interest, thoughts, or feedback, please feel free to
    send them to us at succinctly-series@syncfusion.com.


    We sincerely hope you enjoy reading this book and that it helps you better understand
    the topic of study. Thank you for reading.


    Please follow us on Twitter and “Like” us on Facebook to help us spread the word
    about the “Succinctly series!


    ![](img/56e6154402fb791dde6d62e1689ad4a0_7_0.png)


    ## About the Author


    James McCaffrey works for Microsoft Research in Redmond, Wash. He holds a B.A.
    in psychology from the University of California at Irvine, a B.A. in applied mathematics
    from California State University at Fullerton, an M.S. in information systems
    from Hawaii Pacific University, and a doctorate in cognitive psychology and computational
    statistics from the University of Southern California. James enjoys exploring
    all forms of activity that involve human interaction and combinatorial mathematics,
    such as the analysis of betting behavior associated with professional sports,
    machine learning algorithms, and data mining.


    ## Chapter 1 Getting Started


    The best way to see this e-book is to take a look at the screenshot in Figure
    1-1. The image shows an example of using a neural network written using the JavaScript
    language without any significant external libraries. The network predicts the
    size of the company (small, medium, or large) a college student will work at after
    graduation, based on sex (male or female), GPA (much such as finance), and parents''
    annual income.


    ![](img/56e6154402fb791dde6d62e1689ad4a0_9_0.png)


    Figure 1-1: Neural Networks with JavaScript


    The system shown in Figure 1-1 is running on a Windows machine, but the code and
    information in this e-book also applies to Linux and macOS systems. The system
    uses Notepad as the text editor, but you can use any editor to edit the programs.


    If you look at the code carefully, you''ll see that the program is hosted by the
    Node.js JavaScript environment. The code in this e-book was run on Node.js, version
    10.14.1, but a relatively recent version will work. The key programming dependency
    is JavaScript ES6, also known as ECMAScript 6, ECMAScript 2015, and JavaScript
    6. You can run the code examples in a web browser if the browser supports ES6,
    and use `console.log()` statements and the HTML5 File API or the XMLHttpRequest
    for file reading and writing.


    This e-book assumes you have intermediate or better programming skills, but does
    not assume you know anything about neural networks.


    This e-book presents complete example programs for the three types of neural network
    problems. A multiclass classification problem predicts a discrete value where
    there are three or more possible values, for example, predicting the size of (small,
    medium, large). A regression problem predicts a single numeric value, for example,
    predicting a student''s GPA. A binary classification problem predicts a discrete
    value where there are only two possible values, for example, predicting the sex
    of a student.


    Everyone I learn a new technology in the same way: you get an example program
    up and running and then experiment with it. All the code presented in this e-book
    you can copy and paste it, and run the demos. The data files used by the programs
    are in present Node.js and use the code and data presented on GitHub. To prepare,
    all you have to do is install Node.js and use the code and data presented here.
    No other software is needed.


    If you look at the screenshot in Figure 1-1 carefully, you''ll see that there
    is a lot going on. Some of the fundamental concepts include neural network architecture,
    neural network input-output, tanh activation, back-propagation, error and accuracy,
    normalization and encoding, and model interpretation. This illustrates the major
    challenge for learning about neural networks: although most concepts are relatively
    simple, there are many concepts, and they interact with each other in various
    ways. But you can learn all important neural concepts by running and examining
    the code in this e-book.


    All the neural networks in this e-book use a single layer of nodes. Neural networks
    that have two or more hidden layers are called deep neural networks. In theory
    (the Universal Approximation Theorem, sometimes called the Cybenko Theorem), a
    neural network with a single hidden layer can compute anything that a neural network
    with multiple hidden layers can. In practice, deep neural networks can solve some
    problems that simple neural networks cannot.


    Forms of deep neural networks use complex architectures. Examples include convolutional
    neural networks (often used to classify images) and recurrent neural networks
    (often used for natural language processing). Implementing a neural network from
    scratch gives you complete control over your system and enables you to have a
    complete understanding of your system.


    The techniques used in this e-book can be extended to neural networks with two
    hidden layers. But for three or more hidden layers, or for deep neural networks
    with complex architectures, implementing from scratch is not practical in most
    situations. For these scenarios, you should use a deep network code library, such
    as TensorFlow, Keras, or PyTorch.


    However, at my company, where we have hundreds of engineers working on deep neural
    systems, it''s considered essential to have a solid foundation that can be best
    gained by understanding single, hidden-layer neural networks and implementing
    them from scratch. Much of the content presented in this e-book was developed
    for engineers who are new to the field of machine learning and neural networks.


    Enough chit-chat already—let''s start looking at some examples.


    ## Chapter 2 Input and Output


    One of several ways to think about a neural network (NN) is that it''s a complex
    math function that accepts two or more numeric input values and emits one or more
    numeric output values. A solid understanding of the neural network input-output
    mechanism is essential in order to understand how a NN prediction system works.


    ```

    C:\WINDOWS\system32\cmd.exe

    C:\JavaScript\InputOutput>nn_io.js

    Begin IO demo

    Creating 3-4-2 neural net

    Setting weights and biases

    Setting input =

    1.0 2.0 3.0

    Internal hidden node values =

    0.4699 0.5227 0.5717 0.6169

    Internal pre-softmax output nodes =

    0.6911 0.7229

    Internal softmax output nodes =

    0.4920 0.5080

    Returned output values =

    0.4920 0.5080

    End demo

    :\JavaScript\InputOutput>

    ```


    Figure 2-1: Neural Network Input-Output Demo


    The screenshot in Figure 2-1 shows a demonstration of the NN input-output process.
    The demo program creates a 3-4-2 network, which means there are three input values,
    four so-called hidden nodes where most of the computations are performed, and
    two output values.


    Behind the scenes, the demo configures the NN by setting the weights of 12 input-to-hidden
    weights, four biases, eight hidden-to-output weights, and two output biases (a
    total of 26 weights and biases). Initializing the values of a network''s weights
    and biases will be explained shortly.


    After setting the weights and biases, the demo program sets three input values
    (1.0, 2.0, 3.0). These values are fed to the network, and the final output values
    are (0.4920, 0.5080). Note that the output values sum to 1.0, which is not a coincidence


    The demo program displays the computed values of the four hidden nodes and the
    preliminary values of the output nodes (0.6911, 0.7229) before the application
    of an important function called softmax.


    ## Understanding the input-output mechanism


    Before looking at the demo code, it is important to understand the neural network
    input-output mechanism. The diagram in Figure 2-2 corresponds to the demo program.


    ![](img/56e6154402fb791dde6d62e1689ad4a0_12_0.png)


    Figure 2-2: Neural Network Input-Output Calculations


    The input nodes are (1.0, 2.0, 3.0). Each blue line connecting input-to-hidden
    and hidden-to-output nodes represent a numeric constant. If nodes are zero-indexed
    with node [0] at the top of the diagram, the weight from input[0] to hidden[0]
    is 0.01, and the weight from hidden[3] to output[1] is 0.24. Weight values can
    be positive or negative.


    Each hidden node and output node (but not the input nodes) have an additional
    special called a bias. The bias value for hidden[3] is 0.16, and the bias for
    output[0] is 0.25.


    Notice that there are ni input nodes, nh hidden nodes, and no output nodes, then
    there are a total of (ni * nh) + (nh * no) + nh weights and biases. For the demo
    3-4-2 neural net, there are (3 * 4) + (4 * 2) + 4 + 2 = 26 weights and bias values.

    '
