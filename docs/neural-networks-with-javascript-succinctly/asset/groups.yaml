  - "[PAGE 70]\n\nEach epoch represents one complete pass through the training data.\
    \ The demo code scrambles the order of the training items with the statement this.shuffle(indices).\
    \ The class method shuffle() uses the Fisher-Yates algorithm to randomly rearrange\
    \ the order of the index values in vector indices. The method is defined as follows:\n\
    \n```\nshuffle(v)\n{\n  let n = v.length;\n\n  for (let i = 0; i < n; i++) {\n\
    \    let r = this.rnd.nextInt(i, n); // pick a random index.\n\n    let tmp =\
    \ v[r]; // exchange values.\n    v[r] = v[i];\n    v[i] = tmp;\n  }\n}\n```\n\n\
    The shuffle() method walks through its vector argument v and changes the values\
    \ at randomly indices. The algorithm is surprisingly subtle. For example, incorrectly\
    \ coding the statement this.rnd.nextInt(i, n) as this.rnd.nextInt(0, n) will generate\
    \ strongly biased results. Also, notice the loop condition i < n can be changed\
    \ to i < n-1 because the last iteration exchanges the value in the last cell of\
    \ vector v itself.\n\nThe hidden-to-output weight gradients are computed by the\
    \ following statements:\n\n```\n// compute output node signals.\nfor (let k =\
    \ 0; k < this.no; k++) {\n  let derivative = (1 - this.oNodes[k]) * this.oNodes[k];\
    \ // assumes softmax.\n oSignals[k] = derivative * (this.oNodes[k] - Y[k]); //\
    \ E=(t-o)^2\n}\nE=(o-t)\n\n// compute hidden-to-output weight gradients using\
    \ output signals.\nfor (let j = 0; j < this.no; j++) {\n  for (let k = 0; k <\
    \ this.no; k++) {\n    hoGrads[j][k] = oSignals[k] * this.hNodes[j];\n  }\n}\n\
    ```\n\nThe derivative term of the output signal depends on the output layer activation\
    \ function. For softmax activation, the derivative is 0 * (1 - o), where o is\
    \ the output node value. The computation for the oSignals vector values assumes\
    \ squared error is defined as (target-output)², which gives (output-target) because\
    \ of the minus sign in the error term."
