  mdcn: '

    换句话说，一切都抵消了，只下了计算出的输出值和目标值。非常不起。


    在训练过程中，每隔几个 epoch 打印当前的误差和准确率是一个良好的习惯，这样你就可以看到训练何时没有效果。对于二分类问题，无论你假设使用均方误差还是二元交叉熵，都可以计算并显示其中一种误差项，因为两者都能指示训练是否没有正常工作。均方误差稍微更容易解释，因为该值始终在
    0.0 到 1.0 之间。


    ## 用于二分类的双节点技术


    到目前为止，神经网络二分类最常用的方法是使用单个经过 sigmoid 激活缩放的输出节点，目标值为 0 或 1。另一种方法是将目标值编码为 (1, 0) 或
    (0, 1)，并使用两个经过 softmax 激活缩放的输出节点。问题变成了一个标准的多分类问题。在我看来，比较单节点和双节点技术的结果还没有定论。


    ## 问题


    - 1. 假设你只有三个训练样本，其目标值和计算输出值如下。


    | 目标值 | 计算输出值 |

    | :--- | :--- |

    | 1 | 0.70 |

    | 0 | 0.20 |

    | 1 | 0.60 |


    - A. 计算均方误差。

    - B. 计算均二元交叉熵误差。


