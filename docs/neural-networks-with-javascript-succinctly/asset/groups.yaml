    \ person (male or female) based on predictor variables such as age, occupation,\
    \ annual income, and so on. Somewhat surprisingly, the techniques used for neural\
    \ binary classification are a bit different than those used for neural multiclass\
    \ classification, where the variable to predict can be one of more possible values.\n\
    \nThe screenshot in Figure 6-1 shows a demo of neural network binary classification.\
    \ The goal of the program is to predict if a patient has heart disease (0 = no,\
