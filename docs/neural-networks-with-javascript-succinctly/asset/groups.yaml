    喜欢探索各种涉及人类交互和组合数学的活动，例如与职业体育相关的博弈行为分析、机器学习算法和数据挖掘。


    ## 第 1 章入门


    查看此电子书的最佳方法是查看图 1-1 中的截图。该图像展示了一个使用 JavaScript 语言编写且没有使用任何重大外部库的神经网络示例。该网络根据性别（男或女）、GPA（如金融专业）以及父母的年收入，预测大学生毕业后将工作的公司规模（小型、中或大型）。


    ![](img/56e6154402fb791dde6d62e1689ad4a0_9_0.png)


    图 1-1：使用 JavaScript 的神经网络


    图 1-1 所示的系统运行在 Windows 机器上，但本电子书中的代码和信息也适用于 Linux 和 macOS 系统。该系统使用记事本作为文本编辑器，但您可以使用任何编辑器来编辑程序。


    如果您仔细观察代码，会发现该程序是由 Node.js JavaScript 环境托管的。本电子书中的代码运行在 Node.js 10.14.1 版本上，但较新的版本也可以。关键的编程依赖是
    JavaScript ES6，也称为 ECMAScript 6、ECMAScript 2015 和 JavaScript 6。如果浏览器支持 ES6，您可以在网络浏览器中运行代码示例，并使用
    `console.log()` 语句以及 HTML5 File API 或 XMLHttpRequest 进行文件的读写。


    本电子书假设您具有中级或以上的编程技能，但并不假设您对神经网络有任何了解。


    本电子书展示了三类神经网络问题的完整示例程序。多分类问题预测一个具有三个或更多可能值的离散值，例如预测规模（小型、中型、大型）。回归问题预测单个数值，例如预测学生的
    GPA。二分类问题预测只有两个可能值的离散值，例如预测学生的性别。


    我学习任何新技术的方法都是一样的：让一个示例程序运行起来，然后对其进行实验。本电子书中展示的所有代码您都可以复制、粘贴并运行演示。程序使用的数据文件存在于您本地的
    Node.js 中，并使用了 GitHub 上展示的代码和数据。为了准备工作，您只需要安装 Node.js 并使用这里提供的代码和数据。不需要其他软件。


    如果您仔细查看图 1-1 中的截图，会发现有很多内容。一些基本概念包括神经网络架构、神经网络输入输出、tanh 激活、反向传播、误差和精度、归一化和编码以及模型解释。这说明了学习神经网络的主要挑战：尽管大多数概念相对简单，但概念非常多，而且它们以各种方式相互作用。但您可以通过运行和检查本电子书中的代码来学习所有重要的神经网络概念。


    本电子书中所有的神经网络都使用单层节点。具有两个或多个隐藏层的神经网络被称为深度神经网络。在理论上（通用近似定理，有时被称为 Cybenko 定理），单隐藏层神经网络可以计算多隐藏层神经网络可以计算的任何内容。在实践中，深度神经网络可以解决简单神经网络无法解决的问题。


    深度神经网络的形式使用了复杂的架构。例如卷积神经网络（通常用于图像分类）和循环神经网络（通常用于自然语言处理）。从零实现神经网络可以让您对系统拥有完全控制权，并让您对系统有完全理解。


    书中使用的技术可以扩展到具有两个隐藏层的神经网络。但对于三个或更多隐藏层，或具有复杂架构的深度神经网络，在大多数情况下，从零实现是不现实的。对于这些场景，你应该使用深度网络代码库，如
    TensorFlow、Keras 或 PyTorch。


    然而，在我的公司（有数百名工程师致力于深度神经系统），认为拥有坚实的基础至关重要，而这种基础通过理解单隐藏层神经网络并从零实现可以最好获得。书中展示的大部分内容是为初学者准备的。


    ## 第 2 章 输入与输出


    理解神经网络的一种方法是将其考虑为接收多个输入值并输出多个值的复杂函数。


    ```

    C:\WINDOWS\cmd.exe

    C:\JavaScript\InputOutput>nn_io.js

    Begin demo

    Creating 3-4-2 network

    Setting weights and biases

    Setting input = 1.0 2.0 3.0

    Internal node values = 0.4699 0.5227 0.5717 0.6169

    Internal output nodes = 0.6911 0.7229

    Returned output values = 0.4920 0.5080

    End demo

    ```


    图 2-1：神经网络输入输出演示


    图 2-1 中的截图展示了输入输出过程。演示程序创建了一个 3-4-2 网络，这意味着有三个输入值、四个所谓的隐藏节点（大部分计算在此处进行）以及两个输出值。在幕后，演示程序通过设置权重来配置网络：12
    个输入到隐藏的权重、4 个偏置、8 个隐藏到输出的权重以及 2 个输出偏置（共 26 个权重和偏置）。稍后将解释权重的初始化。


    演示程序设置了三个输入值（1.0, 2.0, 3.0）。这些值被输入网络，最终的输出值为（0.4920, 0.5080）。注意输出值之和为 1.0。演示程序显示了四个隐藏节点的计算值以及输出节点的初步值（0.6911,
    0.7229），应用应用名为 softmax 的重要函数。


    ## 输入输出机制


    在查看演示代码之前，理解神经网络的输入输出机制至关重要。图 2-2 中的图表与演示程序对应。


    ![](img/56e6154402fb791dde6d62e1689ad4a0_12_0.png)


    图 2-2：神经网络输入输出计算


    输入节点为 (1.0, 2.0, 3.0)。连接输入到隐藏以及隐藏到输出的每个蓝线代表一个数值常数。如果节点从零索引（节点 [0] 位于图顶部），则从 input[0]
    到 hidden[0] 的权重为 0.01，从 hidden[3] 到 output[1] 的权重为 0.24。权重值可以是正的也可以是负的。


    每个隐藏节点和输出节点（输入输入节点）都有一个额外的特殊的称为偏置。hidden[3] 的偏值为 0.16，output[0] 的偏置值为 0.25。


    注意，如果有 ni 个输入节点、nh 个隐藏节点和 no 输出节点，那么总共有 (ni * nh) + (nh * no) + nh + no 个权重和偏置。对于演示
    3-4-2 神经网络，总共有 (3 * 4) + (4 * 2) + 4 + 2 = 26 个权重和偏置值。


