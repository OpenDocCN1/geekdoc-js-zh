- md: "\nDrop nodes aren't physically removed; instead, they are virtually removed\
    \ by having any code that references them ignores nodes. In this case, in addition\
    \ to hidden nodes [1] and [2], the input-to-hidden weights that terminate in the\
    \ drop nodes are ignored. The four hidden-to-output node weights that originate\
    \ from the drop nodes are ignored.\n\nIt's not immediately obvious why dropout\
    \ reduces overfitting. In fact, the effectiveness of dropout is not fully understood.\
    \ One notion is that dropout essentially selects random subsets of neural networks,\
    \ and then averages them together, giving a more robust final result. Another\
    \ notion is that dropout prevents hidden nodes from relying on other nodes (called\
    \ coadaptation).\n\nThe dropout technique became well known in 2015 following\
    \ the publication of a research paper. The paper presented a complex mechanism\
    \ for implementing dropout, which involved many logic branches and code modification\
    \ to both the training method and the forward-pass evaluation method.\n\nThe complex\
    \ implementation of dropout was used for several years, until engineers noticed\
    \ that the key ideas of dropout could be implemented in a much simpler way. This\
    \ simpler technique for dropout implementation is completely inverted.\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_101_0.png)\n\
    \nFigure 4-6: The Dropout Mechanism in Theory, but Not in Practice\n\nThere are\
    \ several minor implementation variations that can be used for inverted dropout.\
    \ The demo modifies the basic train() method by adding a parameter dropProb (drop\
    \ probability) that controls how many hidden nodes drop.\n\n```\ntrain(trainX,\
    \ trainY, lrRate, maxEpochs, dropProb)\n{\n  let keepProb = 1.0 - dropProb\n \
    \ let keepNodes = U.vecMake(this.nh, this.no, 0.0);\n\n  let hoGrads = U.matMake(this.nh,\
    \ this.no, 0.0);\n...\n```\n\nThe numeric vector keepNodes tracks if a hidden\
    \ node is marked for dropping (value = 0) or not (value = 1). An alternative is\
    \ to use a vector dropNodes with reversed values, but keepNodes is more convenient\
    \ programmatically. Another alternative is to use a JavaScript boolean array instead\
    \ of a numeric vector.\n\nIn the train() method, inside the for-loop that iterates\
    \ through each training item, a new set of nodes to drop (or equivalently, keep)\
    \ is determined for each training item.\n\n```\nfor (let ii = 0; ii < n; ++ii)\
    \ {  // each item\n// select hidden nodes to drop.\nfor (let j = 0; j < this.nh;\
    \ ++j) {\n  let p = this.rnd.next();\n}\n\nif (p < dropProb) {\n  keepNodes[j]\
    \ = 0; // this is a node to drop.\n} else {\n  keepNodes[j] = 1; // keep the node.\n\
    }\n}\n```\n\nImmediately after calling the forward-pass eval() method, dropout\
    \ is applied.\n\n```\nlet X = trainX[idx];\nlet Y = trainY[idx];\n\nthis.eval(X);\
    \ // output stored in this.onNodes.\n// apply inverted dropout.\nfor (let j =\
    \ 0; j < this.nh; ++j) {\n  if (keepNodes[j] == 0) {\n    this.hNodes[j] = 0.0;\n\
    \  } else {\n    this.hNodes[j] /= keepProb;\n  }\n}\n```\n\nHidden nodes that\
    \ have been selected to drop have their values overwritten with 0.0, and nodes\
    \ that aren't dropped have their values scaled by keepProb, the complement of\
    \ the drop probability. Because keepProb is always less than 1.0, dropout always\
    \ increases a value. For example, suppose a node's value is 0.90 and dropProb\
    \ is 0.20; then keepProb is 0.80 and 0.90 / 0.80 = 1.125. The scaling of nondrop\
    \ nodes larger compensates for the drop nodes not contributing to the final output\
    \ node values, because the drop node values are 0.0.\n\nA call to the train()\
    \ method with a 10% probability of dropping each hidden node looks like the following.\n\
    \n```\ndropProb = 0.10;\nn.train(trainX, trainY, lrRate, maxEpochs, dropProb);\
    \ // use dropout\n```\n\nNotice by setting the value of dropProb to 0.0, you get\
    \ normal back-propagation training without dropout. Also note that the exact number\
    \ of hidden nodes that will be dropped on each training iteration will likely\
    \ vary. For example, with 50 hidden nodes, on average 0.10 * 50 = 5 nodes will\
    \ be dropped. Also the exact number of hidden nodes can be between 0 and 50.\n\
    \nThe dropout technique was created mostly to deal with overfitting in deep neural\
    \ networks with many layers and hundreds or thousands of nodes in each layer.\
    \ When used carefully, dropout can improve the prediction accuracy of neural networks\
    \ with a single hidden layer.\n\nIt is possible to apply dropout to input nodes.\
    \ This technique is most often effective when training data has many predictor\
    \ variables. A closely related technique is to add random noise to input values.\
    \ This technique is called jittering.\n\n# Train-validate-test\n\nThe train-validate-test\
    \ (TVT) technique can be used to reduce the likelihood of model overfitting. Model\
    \ overfitting occurs if a neural network is trained too long. Briefly, instead\
    \ of splitting your data into a training set and set, split your data into three\
    \ sets: a training set (typically about 70% of the data), a validation set (often\
    \ about 15% of the data), and a test set (about 15% of the data).\n\nYou use the\
    \ training data as usual, but every few epochs, you compute and display the error\
    \ of the current model on the validation data. By observing how the model deals\
    \ with the validation data, you can see when model overfitting is starting to\
    \ occur, and then stop training before reaching the max epochs.\n\nAfter training,\
    \ you compute the error and accuracy of the model on the test data as usual, to\
    \ get a rough estimate of how the model will perform on new, previously unseen\
    \ data. The main principle of train-validate-test is shown in the graph in Figure\
    \ 4-7.\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_103_0.png)\n\nFigure 4-7: Train-Validate-Test\
    \ in Theory\n\nThe blue line represents error on the training data. That error\
    \ will tend to decrease steadily the longer the network is trained. The red line\
    \ represents error on the validation data. Initially error will decrease, but\
    \ at some point, overfitting will start to occur and the error on the validation\
    \ data will increase.\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_104_0.png)\n\
    \nFigure 4-8: Train-Validate-Test Demo\n\nWithout train-validate-test, the final\
    \ accuracies were 96.25% and 52.50%, but by using train-validate-test the final\
    \ accuracies are 76.25% and 77.50%.\n"
  mdcn: "\n丢弃节点（Drop nodes）并没有在物理上移除；而是通过让引用它们的任何代码忽略这些节点来实现虚拟上的移除。在这种情况下，除了隐藏节点 [1]\
    \ 和 [2] 之外，终止于丢弃节点的输入到隐藏层的权重会被忽略。从丢弃节点起始四个隐藏到输出节点权重也会被忽略。\n\n目前尚不清楚为什么 dropout\
    \ 能减少过拟合。事实上，dropout 的有效性尚未被完全理解。一种观点是，dropout 本质上是选择了神经网络的随机子集，然后对它们进行平均处理，从而给出更健壮的最终结果。另一种观点是，dropout\
    \ 防止了隐藏节点依赖其他节点（称为协同适应 coadaptation）。\n\nDropout 技术在 2015 年一篇研究论文发表后广为人知。该论文提出了一种实现\
    \ dropout 的复杂机制，涉及许多逻辑分支，并对训练方法和前向传播评估方法进行了代码修改。\n\ndropout 复杂的实现方式使用了多年，直到工程师们注意到\
    \ dropout 的核心思想可以用简单得多的方法来实现。这种更简单的 dropout 实现技术是完全反转的（inverted）。\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_101_0.png)\n\
    \n图 4-6：理论上的 Dropout 机制，但实践并非如此\n\n有几种细小的实现变体用于反转 dropout（inverted dropout）。演示通过添加参数\
    \ `dropProb`（丢弃概率）来修改基础 `train()` 方法，该参数控制有多少个隐藏节点被丢弃。\n\n```\ntrain(trainX, trainY,\
    \ lrRate, maxEpochs, dropProb)\n{\n  let keepProb = 1.0 - dropProb\n  let keepNodes\
    \ = U.vecMake(this.nh, this.no, 0.0);\n\n  let hoGrads = U.matMake(this.nh, this.no,\
    \ 0.0);\n...\n```\n\n数值向量 `keepNodes` 用于跟踪隐藏节点是否被标记为丢弃（值=0）或保留（值=1）。另一种方法是使用值反的向量\
    \ `dropNodes`，但在编程上 `keepNodes` 更方便。另一种替代方案是使用 JavaScript 布尔数组代替数值向量。\n\n在 `train()`\
    \ 方法中，在遍历每个训练项的 for 循环内部，为每个训练项确定一组新的要丢弃（或等效保留）的节点。\n\n```\nfor (let ii = 0; ii\
    \ < n; ++ii) {  // 每个项\n// 选择要丢弃的隐藏节点。\nfor (let j = 0; j < this.nh; ++j) {\n\
    \  let p = this.rnd.next();\n}\n\nif (p < dropProb) {\n  keepNodes[j] = 0; //\
    \ 这是一个要丢弃的节点。\n} else {\n  keepNodes[j] = 1; // 保留节点。\n}\n}\n```\n\n在调用前向传播 `eval()`\
    \ 方法后立即应用 dropout。\n\n```\nlet X = trainX[idx];\nlet Y = trainY[idx];\n\nthis.eval(X);\
    \ // 输出存储在 this.onNodes。\n// 应用反转 dropout。\nfor (let j = 0; j < this.nh; ++j)\
    \ {\n  if (keepNodes[j] == 0) {\n    this.hNodes[j] = 0.0;\n  } else {\n    this.hNodes[j]\
    \ /= keepProb;\n  }\n}\n```\n\n被选择丢弃的隐藏节点其值将被覆盖为 0.0，而未被丢弃的节点值将通过 `keepProb`（丢弃概率的补数）进行缩。由于\
    \ `keepProb` 始终小于 1.0，dropout 总是会增加一个值。例如，假设节点的值为 0.90，`dropProb` 为 0.20；那么 `keepProb`\
    \ 为 0.80，且 0.90 / 0.80 = 1.125。\n\n在 `train()` 方法中应用 10% 的丢弃概率，其结果所示：\n\n```\n\
    dropProb = 0.10;\nn.train(trainX, trainY, lrRate, maxEpochs, dropProb); // 使用\
    \ dropout\n```\n\nDropout 技术的创建主要是为了解决深度神经网络中的过拟合问题，特别是当具有许多层和每层大量节点时。在使用时，dropout\
    \ 可以提高单隐藏层的预测准确率。\n\n可以将 dropout 应用于输入节点。这种技术在训练数据具有许多预测变量时通常有效。另一种密切相关的技术是给输入添加随机噪声，这种技术被称为抖动（jittering）。\n\
    \n# 训练-验证测试\n\n训练验证测试（TVT）技术可以减少模型过拟合的概率。如果神经网络训练过久，就会发生过拟合。简单来说，与其将数据分为训练集和测试集，不如将数据分为三部分：训练集（通常占数据的\
    \ 70%）、验证集（约 15%）和测试集（约 15%）。\n\n你像常一样使用训练数据，但每隔几个 epoch 计算并显示当前模型在验证集上的误差。通过观察模型如何处理验证数据，你可以看到模型何时开始过拟合，并在达到最大\
    \ epoch 前停止训练。\n\n训练完成后，像常一样在测试集上计算模型的误差和准确率，以对模型在新的、未见过的数据上的进行粗略估计。训练验证测试的主要原理如图\
    \ 4-7 所示。\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_103_0.png)\n\n图 4-7：理论上的训练验证测试\n\
    \n蓝线代表训练数据上的误差。随着训练时间变长，该误差往往会稳定下降。红线代表验证数据上的误差。最初误差会下降，但在某一点之后，过拟合会开始发生，验证数据上的误差将会增加。\n\
    \n![](img/56e6154402fb791dde6d62e1689ad4a0_104_0.png)\n\n图 4-8：训练验证测试演示\n\n如果不使用训练验证测试，最终准确率为\
    \ 96.25% 和 52.50%，但通过使用训练验证测试，最终准确率分别为 76.25% 和 77.50%。\n\n"
