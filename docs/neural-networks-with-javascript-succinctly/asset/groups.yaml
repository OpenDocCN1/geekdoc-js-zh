    \ / n); // average grad\n    this.weights[i][j] += delta;\n  }\n}\n```\n\nIn the\
    \ code, the variable n is an alias for the number of training items and is used\
    \ to compute the average gradient over all training items. Some neural network\
    \ library implementations use the raw accumulated gradients (not averaged), but\
    \ using the average is better because it doesn't introduce a dependency on the\
    \ size of the training data.\n\nIn addition to online and batch training, there\
    \ is a third technique called mini-batch training. The mini-batch training technique\
    \ is a variation of (full) batch training. A mini-batch is a subset of the training\
    \ data, typically something like 10 or 16 items. In pseudo-code, mini-batch training\
    \ looks the following.\n\n```\nfor-each epoch\n  for-each mini-batch\n    fetch\
    \ next mini-batch\n    use batch training technique on the mini-batch subset\n\
    \  end each mini-batch\n  end-epoch\n```\n\nAlthough mini-batch training is conceptually\
    \ simple, the implementation details are a bit messy. The source code repository\
    \ has an implementation of mini-batch training on the Boston Dataset problem that\
