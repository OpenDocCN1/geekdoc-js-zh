    \ **Math.exp(200.0) = 7.23 x 10^86**, which is much larger than the JavaScript\
    \ Number type can handle.\n\nOne technique for greatly reducing the likelihood\
    \ of arithmetic overflow is to use the max trick.\nThe trick relies on the algebra\
    \ facts that exp(x + y) = exp(x) * exp(y) and exp(x - y) = exp(x) / exp(y).\n\n\
    The trick is to find the maximum value in the input vector, subtract the max from\
    \ each value in the input vector, and compute softmax as usual with the differences.\n\
    \nFor example, for an input of X = (3.0, 5.0, 2.0) the largest value is 5.0. Subtracting\
    \ the max from each input value gives (-2.0, 0.0, -3.0). Then the following:\n\
    \n```\nexp(-2.0) = 0.1353\nexp(0.0) = 1.0000\nexp(-3.0) = 0.0498\n```\n\n```\n\
    sum = 1.1851\n```\n\nThen the computed softmax values are with the differences.\n\
    \n```\nsoftmax(3.0) = exp(-2.0) / sum = 0.1353 / 1.1851 = 0.1142\nsoftmax(5.0)\
    \ = exp(0.0) / sum = 1.0000 / 1.1851 = 0.8438\nsoftmax(2.0) = exp(-3.0) / sum\
    \ = 0.0498 / 1.1851 = 0.0420\n```\n\nThis is the same result as the direct calculation.\
    \ Notice that by subtracting the max value, each modified value will be 0.0, and\
    \ all other values will be negative. This prevents trying to compute Math.exp(x)\
    \ for any value larger than x = 0.0.\n\nThe demo program implements the softmax\
    \ function using the max trick.\n\n```\nfunction softmax(vec)\n{\n  let mx = vecMax(vec);\
    \ // or Math.max(...vec)\n  let result = [];\n  let sum = 0.0;\n  for (let i =\
    \ 0; i < vec.length; i++) {\n    result[i] = Math.exp(vec[i] - mx); // use max\
    \ trick.\n    sum += result[i];\n  }\n  for (let i = 0; i < result.length; i++)\
    \ {\n    result[i] = result[i] / sum;\n  }\n  return result;\n}\n```\n\n```\n\
    function vecMax(vec)\n{\n  let mx = vec[0]; // assume first cell holds largest.\n\
    \  for (let i = 0; i < vec.length; ++i) { // check each cell.\n    if (vec[i]\
    \ > mx) { // found a larger value.\n      mx = vec[i];\n    }\n  }\n  return mx;\n\
    }\n```\n\nInstead of defining a vecMax() function to return the largest value\
    \ in a vector, you can use the quirky ES6 ... spread operator (three consecutive\
    \ period characters) with the built-in Math.max() function.\n\n## Hidden layer\
    \ activation functions\n\nThe demo program uses the hyperbolic tangent function\
    \ for activation on the hidden layer nodes. The function is implemented.\n\n```\n\
    function hyperTan(x)\n{\n  if (x < -20.0) {\n    return -1.0;\n  } else if (x\
    \ > 20.0) {\n    return 1.0;\n  } else {\n    return Math.tanh(x);\n  }\n}\n```\n\
    \nNotice that the program-defined hyperTan(x) function is just a wrapper around\
    \ the built-in Math.tanh(x) function. To understand why the wrapper approach is\
    \ used, take a look at the graph of the tanh function in Figure 2-4.\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_34_0.png)\n\
    \nThe **tanh(x)** function accepts any value x, from negative infinity to positive\
    \ infinity, and returns a value between -1.0 and +1.0. Notice that for values\
    \ less than -5.0 and greater than +5.0, the **tanh(x)** result is nearly at its\
    \ extreme value.\n\nBecause pre-activation hidden nodes of less than about -5.0\
    \ or greater than +5.0 result in -1.0 or +1.0, respectively, an effective neural\
    \ network often has pre-activation hidden node values close to 0.0. This means\
    \ that you should avoid very large or very small input values. This is accomplished\
    \ by normalizing input data, as described in Chapter 4.\n\nThe limits of -20.0\
    \ and +20.0 in the demo program implementation of the **hyperTan(x)** function\
    \ are somewhat arbitrary. Other common limits for a program-defined tanh wrapper\
    \ function are (-10.0, +10.0) and (-40.0, +40.0).\n\nThe sigmoid function. One\
    \ possible implementation of the sigmoid function follows.\n\n```\nfunction logSig(x)\n\
    {\n  if (x < -20.0) {\n    return 0.0;\n  } else if (x > 20.0) {\n    return 1.0;\n\
    \  } else {\n    return 1.0 / (1.0 + exp(-x));\n  }\n}\n```\n"
  mdcn: "\n对 (3.0, 5.0, 2.0) 应用 softmax 的结果为 (0.1142, 0.8438, 0.0420)。得到的值之和为 1.0，并大致代表了该人是保守、中立或自由派的概率。由于第二个值（0.8434）最大，因此预测该人是一个政治中立者。\n\
    \nsoftmax 的数学方程如图 2-3 所示。神经网络分类器的输出层激活函数有其他方案，例如泰勒 softmax 和 sparsemax，但 softmax\
    \ 到目前为止是最常用的。\n\n```\nsoftmax(x_i) = \\frac{e^{x_i}}{\\sum_k e^{x_k}}\n```\n\n\
    图 2-3：Softmax 函数\n\n用语言描述，向量中某一个值的 softmax 是该值的 exp() 值除以向量中每个值应用 exp() 之后得到的\
    \ exp 值之和。对于 (3.0, 5.0, 2.0)，作用于每个值的 **exp** 及其和如下：\n\nexp(3.0) = 20.0855\nexp(5.0)\
    \ = 148.4132\nexp(2.0) = 7.3891\n\nsum = 175.8878\n\n然后是出的 softmax 值：\n\nsoftmax(3.0)\
    \ = 20.0855 / 175.8878 = 0.1142\nsoftmax(5.0) = 148.4132 / 175.8878 = 0.8438\n\
    softmax(2.0) = 7.3891 / 175.8878 = 0.0420\n\n向量 softmax 的一个朴素实现如下：\n\n```\nfunction\
    \ softmax(vec)\n{\n  let result = [];\n  let sum = 0.0;\n  for (let i = 0; i <\
    \ vec.length; i++) {\n    result[i] = Math.exp(vec[i]); // 找到每个值的 exp()\n    sum\
    \ += result[i]; // 对 exp() 值求和\n  }\n  for (let i = 0; i < result.length; i++)\
    \ {\n    result[i] = result[i] / sum;\n  }\n  return result;\n}\n```\n\n遗憾的是，朴素的实现很容易导致算术问题，因为即使\
    \ **x** 的值只是中等水平，**Math.exp(x)** 也会是一个天文数字数字。例如，**Math.exp(200.0) = 7.23 x 10^86**，这远超\
    \ JavaScript Number 类型的处理范围。\n\n极大减少算术溢出概率的一种技术是使用最大值技巧（max trick）。\n该技巧依赖于代数事实：exp(x\
    \ + y) = exp(x) * exp(y) 和 exp(x - y) = exp(x) / exp(y)。\n\n该技巧是找到输入向量中的最大值，从输入向量的每个值中减去该最大值，然后照常使用这些差值计算\
    \ softmax。\n\n例如，对于输入 X = (3.0, 5.0, 2.0)，最大值是 5.0。从每个输入值中减去最大值得到 (-2.0, 0.0,\
    \ -3.0)。然后如下：\n\n```\nexp(-2.0) = 0.1353\nexp(0.0) = 1.0000\nexp(-3.0) = 0.0498\n\
    ```\n\n```\nsum = 1.1851\n```\n\n然后是使用差值计算 softmax 值：\n\n```\nsoftmax(3.0) = exp(-2.0)\
    \ / sum = 0.1353 / 1.1851 = 0.1142\nsoftmax(5.0) = exp(0.0) / sum = 1.0000 / 1.1851\
    \ = 0.8438\nsoftmax(2.0) = exp(-3.0) / sum = 0.0498 / 1.1851 = 0.0420\n```\n\n\
    这与直接计算的结果相同。注意，通过减去最大值，每个修改后的值都将变为 0.0，而所有其他值将变为负数。这防止了对任何大于 x = 0.0 的值尝试计算 Math.exp(x)。\n\
    \n演示程序使用最大值技巧实现了 softmax 函数。\n\n```\nfunction softmax(vec)\n{\n  let mx = vecMax(vec);\
    \ // 或 Math.max(...vec)\n  let result = [];\n  let sum = 0.0;\n  for (let i =\
    \ 0; i < vec.length; i++) {\n    result[i] = Math.exp(vec[i] - mx); // 使用最大值技巧\n\
    \    sum += result[i];\n  }\n  for (let i = 0; i < result.length; i++) {\n   \
    \ result[i] = result[i] / sum;\n  }\n  return result;\n}\n```\n\n```\nfunction\
    \ vecMax(vec)\n{\n  let mx = vec[0]; // 假设第一个单元格持有最大值\n  for (let i = 0; i < vec.length;\
    \ ++i) { // 检查每个单元格\n    if (vec[i] > mx) {\n      mx = vec[i];\n    }\n  }\n\
    \  return mx;\n}\n```\n\n与其定义一个返回向量中最大值的 vecMax() 函数，不如使用奇特的 ES6 ... 展开运算符（三个连续的点）配合内置的\
    \ Math.max() 函数。\n\n## 隐藏层激活函数\n\n演示程序使用双曲正切函数作为隐藏层节点的激活函数。该函数的实现如下：\n\n```\n\
    function hyperTan(x)\n{\n  if (x < -20.0) {\n    return -1.0;\n  } else if (x\
    \ > 20.0) {\n    return 1.0;\n  } else {\n    return Math.tanh(x);\n  }\n}\n```\n\
    \n注意，程序定义的 hyperTan(x) 函数只是内置 Math.tanh(x) 函数的封装。要理解为什么使用封装方法，请查看图 2-4 中的 tanh\
    \ 函数图。\n\n![](img/56e154402fb791dde62e1689ad4a_34_0.png)\n\n**tanh(x)** 函数接受负无穷到正无穷的任何值，并返回一个\
    \ -1.0 到 +1.0 之间的值。注意，对于小于 -5.0 和大于 5.0 的值，**tanh(x)** 的结果接近其极值。\n\n由于激活前隐藏节点小于\
    \ -5.0 或大于 5.0 分别导致 -1.0 或 +1.0，有效的神经网络通常具有接近 0.0 的激活前节点值。这意味着你应该避免非常大或非常小的输入值。这是通过第\
    \ 4 节所述的数据归一化实现的。\n\n演示程序中 hyperTan(x) 函数的 -20.0 和 +20.0 限制是任意的。程序定义的 tanh 封装常用限制是\
    \ (-10.0, +10.0) 和 (-40.0, +40.0)。\n\nsigmoid 函数。sigmoid 函数的一种可能实现如下：\n\n```\n\
    function logSig(x)\n{\n  if (x < -20.0) {\n    return 0.0;\n  } else if (x > 20.0)\
    \ {\n    return 1.0;\n  } else {\n    return 1.0 / (1.0 + exp(-x));\n  }\n}\n\
    ```\n"
