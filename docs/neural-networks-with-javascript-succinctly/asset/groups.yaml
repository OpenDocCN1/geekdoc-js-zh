    ## 第三章 训练


    训练神经网络是一个寻找网络权重和偏置值的过程，以便网络能够进行预测。无论从概念还是实践上，训练神经网络都是复杂且困难的。


    图 3-1 中的截图展示了神经网络训练的演示。程序的目标是为著名的鸢尾花（Iris）数据集创建一个预测模型（训练后的神经网络通常称为模型）。


    ![](img/56e6154402fb791dde6d62e1689ad4a0_37_0.png)


    图 3-1：在鸢尾花数据集上进行神经网络训练


    鸢尾花数据包含 150 个项目。每个项目代表一朵鸢尾花，包含预测值（在神经网络机器学习术语中通常称为特征）和三个可能的预测品种：山翅鸢（setosa）、变色鸢（versicolor）和处毛鸢（virginica）。演示程序创建了一个
    4-7-3 的神经网络。它有四个输入节点（每个对应一个预测值）和三个输出节点，因为有三个类别（需要预测的离散值）。


    神经网络在隐藏节点上使用 `tanh` 激活函数，在输出节点上使用 `softmax` 输出。在后台，150 个项目的鸢尾花数据集被分为两个文件：一个包含
    120 个项目（占比80%）的训练数据集，用于确定模型权重和偏置；另一个包含 30 个项目（剩余20%）的测试数据集，用于评估训练后网络的质量。


    演示程序使用反向传播技术（也称为随机梯度下降 SGD，尽管这些术语含义略有不同）来训练网络。训练是一个迭代过程。演示程序运行 50 个轮次（epochs）的神经网络。一个轮次包括处理训练数据集中的每个项目一次。


    在训练期间，每隔五个轮次，演示程序会显示与该权重和偏置相关的均方误差以及预测准确率。如图 3-1 所示，误差逐渐降低，准确率逐渐提高，这表明训练正在生效。


    训练完成后，演示结束，并显示模型在 120 个训练数据上的预测准确率（0.9083 = 120 个中正确 109 个）以及在 30 个测试数据上的准确率（0.9667
    = 30 个中正确 29 个）。模型在测试集上的准确率是对新模型（之前未见过的数据）预期准确率的一个粗略估计。


    演示通过使用训练好的模型进行预测告终。演示设置了一朵预测值为 (5.1, 3.1, 4.1, 2.1) 的鸢尾花，并将这些值发送给模型。模型的输出值为 (0.0570,
    0.4511, 0.4918)。由于第三个输出值最大，模型预测该未知花朵是处毛鸢（virginica）。


    ## 理解鸢尾花数据集


    费舍的鸢尾花数据集是统计学和机器学习领域最著名的基准数据集之一。该数据集包含 150 个项目。原始数据如下：


    ```

    5.1, 3.5, 1.4, 0.2, setosa

    7.0, 3.2, 4.7, 1.4, versicolor

    6.3, 3.3, 6.0, 2.5, virginica

    ...

    ```


    原始数据通过对类别标签进行独热编码（one-hot encoding）准备就，但特征值并没有像通常那样进行归一化。


    ```

    5.1, 3.5, 1.4, 0.2, 1, 0, 0

    7.0, 3.2, 4.7, 1.4, 0, 1, 0

    6.3, 3.3, 6.0, 2.5, 0, 0, 1

    ```


    独热编码也被称为 1-of-N 编码。第一个类别在第一个位置得到 1，第二个项目在第二个位置得到 1，以此此类推。例如，如果你正在尝试预测某种东西的颜色，有四种可能的值（红、蓝、绿、黄），那么红
    = (1, 0, 0, 0），蓝 = (0, 1, 0, 0），绿 = (0, 0, 1, 0），黄 = (0, 0, 0, 1)。


    四个预测值分别是：花萼长度、花萼宽度、花瓣长度和花瓣宽度。花萼是一种叶状的结构。


    编码后，完整数据集被分为一个 120 个项目的训练集和一个 30 个项目的集合（用于训练后的模型评估）。完整的鸢尾花训练和测试数据集包含在本电子书的附录中。


    由于数据有四个维度，因此无法在二维图中轻松地可视化。但你可以从图 3-2 的部分图中大致了解数据。


    如图所示，鸢尾花数据非常简单。**setosa** 类很容易与 **versicolor** 和 **virginica** 区分开。此外，**versicolor**
    和 **virginica** 类别几乎是线性可分的。尽管非常简单，鸢尾花数据集仍然是一个很好的分类示例。


    ![](img/56e6154402fb791dde6d62e1689ad4a0_39_0.png)


    图 3-2：鸢尾花数据集


