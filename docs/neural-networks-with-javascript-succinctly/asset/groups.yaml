    \ entropy\n\nWhen creating a neural network for binary classification, you can\
    \ use mean squared error as in the demo program, or you can use binary cross-entropy\
    \ error. Regular cross-entropy error compares a set of predicted probabilities\
    \ with a set of correct probabilities. With only one output node, there are no\
    \ sets of probabilities to compare, so a special form of cross entropy is used.\n\
    \nSuppose t is a target value and y is predicted output (a value between 0.0 and\
    \ 1.0). For just two values, the cross-entropy error equation is CEE = -log(y)\
    \ * t + log(1-y)*(1-t). But in binary classification, the target is always 1 or\
    \ a 0.\n\nIf t = 1, log(1-y) * (1-t) term drops out, leaving -log(y). If t = 0,\
    \ log(y) * t term drops out, leaving just log(1-y). To compute binary cross-entropy\
    \ error for a neural network, if the target is 1, use -log(y), and if the target\
    \ is 0, use -log(1-y).\n\nSuppose you have just three training items with the\
    \ following target and computed output values."
