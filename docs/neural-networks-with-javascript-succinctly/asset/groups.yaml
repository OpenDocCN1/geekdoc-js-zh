    \n```\n// compute hidden node signals.\nfor (let j = 0; j < this.nh; ++j) {\n\
    \  let sum = 0.0;\n  for (let k = 0; k < this.no; ++k) {\n    sum += oSigmoid[k]\
    \ * this.weights[j][k]\n  }\n  let derivative = (1 - this.hNodes[j]) * (1 + this.hNodes[j]);\
    \ // tanh\n  hSigmoid[j] = derivative * sum;\n  ...\n}\n```\n\nThe ideas underlying\
    \ this code are some of the deepest in all machine learning. However, from a practical\
    \ point of view, the only statement you'll ever need to change is the computation\
    \ of the derivative term (if you decide to use a different hidden layer activation\
    \ function). For example, if you use logistic sigmoid activation, the calculus\
    \ derivative of y = logig(x) is y * (1 - y).\n\n```\nlet derivative = this.hNodes[j]\
    \ * (1 - this.hNodes[j]); // logistic\nsigmoid\n```\n\nNext, the gradients for\
    \ the input-to-hidden weights and the gradients for the hidden node biases are\
    \ computed.\n\n```\n// compute input-to-hidden weight gradients using hidden signals.\n\
    for (let i = 0; i < this.ni; ++i) {\n  for (let j = 0; j < this.nh; ++j) {\n \
    \   ihGrads[i][j] = hSignals[j] * this.Nodes[i];\n  }\n}\n```\n\n```\n// compute\
    \ node biases using hidden signals.\nfor (let j = 0; j < this.nh; ++j) {\n  hbGrads[j]\
    \ = hSignals[j] * 1.0; // 1.0 dummy input can be dropped\n}\n```\n\nTo summarize,\
    \ the goal is to add a small value to each weight and bias so that computed outputs\
    \ get closer to target values (or equivalently, the error is reduced). To compute\
    \ the delta, you need to compute a gradient value for each weight and bias. The\
    \ gradient values are composed of a signal and an input value (where the input\
    \ is a dummy 1.0 for biases).\n\nAfter the gradients have been computed, the next\
    \ step is to compute the delta values and then use them to modify the weights\
    \ and biases. When computing the gradients, you must work backward from output\
    \ to hidden (which is why back-propagation is named as it). But when updating\
    \ the weights and biases, you can work in any order. The demo code works from\
    \ input to output to emphasize that the order of weights and biases can be different\
    \ from the order of gradient computations.\n\n```\n// update input-to-hidden weights\n\
    for (let i = 0; i < this.ni; ++i) {\n  for (let j = 0; j < this.nh; ++j) {\n \
    \   let delta = -1.0 * lrnRate * ihGrads[i][j];\n    this.Weights[i][j] += delta;\n\
    \  }\n}\n```\n\nIf you compare this code with the weight update equation in Figure\
    \ 3-5, you will see a one-to-one correspondence between the code and the math.\
