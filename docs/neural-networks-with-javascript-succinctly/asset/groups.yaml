  - '[PAGE 13]


    To compute the value of a hidden node, you multiply each input value by its associated
    input-to-hidden value, add the products up, then add the bias value, and apply
    the hyperbolic tangent function (abbreviated tanh) for the sum. For hidden node
    [0] this is the following.


    ```

    sum[0] = (1.0)(0.01) + (2.0)(0.05) + (3.0)(0.09) + 0.13

    = 0.5100

    ```


    ```

    hidden[0] = tanh(0.5100)

    = 0.4699

    ```


    The hyperbolic tangent function used in this way is called the hidden layer activation
    function. Two common alternatives are the logistic sigmoid function (often called
    just sigmoid) and rectified linear unit (ReLU). Using the tanh activation function
    forces all hidden node values to be between -1.0 and +1.0. Logistic functions
    vary values between 0.0 and 1.0.


    The output nodes are calculated similarly, but instead of using tanh, logistic
    sigmoid, or ReLU activation, a special function called softmax is used. The function
    is explained by example. The preliminary sum of products plus values of output[0]
    and output[1] are the following.


    ```

    sum[0] = (0.4699)(0.17) + (0.5227)(0.19) + (0.5717)(0.21) + (0.6169)(0.23)

    = 0.5691

    ```


    ```

    sum[1] = (0.4699)(0.18) + (0.5227)(0.20) + (0.5717)(0.22) + (0.6169)(0.24)

    = 0.7229

    ```


    A term called the divisor is computed by applying the exp() function to each sum
    term, and then summing those values.


    ```

    divisor = exp(0.5691) + exp(0.7229)

    = 1.9960 + 2.0604

    = 4.0563

    ```


    The exp(x) function is raised to Euler''s number, approximately 2.71828. The result
    of softmax is the exp(x) of each term divided by the divisor.


    ```

    output[0] = 1.9960 / 4.0563

    = 0.4920

    ```


    ```

    output[1] = 2.0604 / 4.0563

    = 0.5080

    ```


    The purpose of softmax activation is to scale output values so that they sum to
    1.0 and can be loosely interpreted as probabilities. Suppose the demo corresponds
    to a problem where the goal is to predict if a person is male or female on three
    predictor variables, such as annual income, years of education, and height. If
    male is encoded as (1, 0) and female is encoded as (0, 1) then the prediction
    is female because the second output value (0.5080) is larger than the first (0.4920).'
