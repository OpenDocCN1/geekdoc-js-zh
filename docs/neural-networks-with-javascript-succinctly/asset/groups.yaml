    \ -1 的操作），但它很少被使用。接下来，使用它们的梯度来更新隐藏节点偏置。\n\n```\n// 更新节点偏置。\nfor (let j = 0; j\
    \ < this.nh; ++j) {\n  let delta = -1.0 * lrnRate * hbGrads[j];\n  this.hBiases[j]\
    \ += delta;\n}\n..\n```\n\n更新偏置的模式与更新权重的模式完全相同。接下来，隐藏到输出的权重和输出节点偏置被更新了。\n\n```\n\
    // 更新隐藏到输出的权重。\nfor (let j = 0; j < this.nh; ++j) {\n  // ... (更新逻辑)\n}\n```\n"
