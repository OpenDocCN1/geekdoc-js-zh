    \ so.\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_128_0.png)\n\nFigure 6-1: Neural\
    \ Binary Classification\n\nThe demo creates an 18-100-1 neural network. The raw\
    \ training data has 13 predictor variables, but after normalization and encoding,\
    \ there are 18 values.\n\nThe most common technique for neural binary classification\
    \ is to encode the two possible values to predict 0 or 1 using a single node output\
    \ and coerce the value to be in the range [0.0, 1.0]. If the output value is less\
    \ than 0.5, then the prediction is class 0; otherwise (if the output value is\
    \ greater than 0.5), the prediction is class 1.\n\nThe number of hidden nodes,\
    \ 100 in the demo, is a hyperparameter that must be determined by trial and error.\
    \ The demo uses a learning rate of 0.005 and 600 training epochs (both values\
