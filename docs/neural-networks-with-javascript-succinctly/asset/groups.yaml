    # Chapter 3 Training


    Training a neural network is the process of finding values for the network''s
    weights and biases so that the network can make predictions. Training a neural
    network is complex and difficult, both conceptually and in practice.


    The screenshot in Figure 3-1 shows a demo of neural network training. The goal
    of the program is to create a prediction model (a trained neural network often
    called a model) for the well-known Iris data set.


    ![](img/56e6154402fb791dde6d62e1689ad4a0_37_0.png)


    Figure 3-1: Neural Network Training on the Iris Data Set


    The Iris data has 150 items. Each item represents an iris flower. predictor values
    (often called features in NN machine learning terminology) and three possible
    species to predict: setosa, versicolor, and virginica. The demo program creates
    a 4-7-3 neural network. There are four input nodes, one for each predictor value,
    and three output nodes, because there are three classes (discrete values to predict).'
  - '[PAGE 38]


    The neural network uses tanh activation on the hidden nodes and softmax output
    on the output nodes. Behind the scenes, the 150-item iris dataset had been split
    into two files: a 120-item (80% of the items) training data set used for determining
    the model weights and biases, and a 30-item (the remaining 20%) test data set
    be used to evaluate the quality of the trained network.


    The demo program uses the back-propagation technique (also called stochastic descent,
    SGD, even though the terms have somewhat different meanings) to train the network.
    Training is an iterative process. The demo program runs the network using 50 epochs.
    One epoch consists of processing every item in the training data set once.


    During training, after each set of five epochs, the demo program displays the
    mean squared error associated with the set of weights and biases, and the prediction
    accuracy. As you can see in Figure 3-1, the error slowly decreases and the accuracy
    slowly increases, suggesting that training is working.


    After training, the demo completes and displays the prediction accuracy of the
    model on the 120-item training data (0.9083 = 109 out of 120 correct) and the
    30-item test data (0.9667 = 29 out of 30). The accuracy of the model on the test
    set is a very rough estimate of the expected accuracy of the new model, previously
    unseen data.


    The demo concludes by using the trained model to make a prediction. The demo sets
    up an iris flower with predictor values of (5.1, 3.1, 4.1, 2.1) and sends those
    values to the model. The model''s output values are (0.0570, 0.4511, 0.4918).
    Because the third output value is the largest, the model predicts that the unknown
    flower is the species (virginica).


    # Understanding the Iris data set


    Fischer''s Iris data set is one of the most well-known benchmark data sets in
    statistics and machine learning. The data set has 150 items. The raw data looks
    like this:


    ```

    5.1, 3.5, 1.4, 0.2, setosa

    7.0, 3.2, 4.7, 1.4, versicolor

    6.3, 3.3, 6.0, 2.5, virginica

    ...

    ```


    The raw data was prepared by one-hot encoding the class labels, but the feature
    values are not normalized as is usually done.


    ```

    5.1, 3.5, 1.4, 0.2, 1, 0, 0

    7.0, 3.2, 4.7, 1.4, 0, 1, 0

    6.3, 3.3, 6.0, 2.5, 0, 0, 1

    ```


    One-hot encoding is also known as 1-of-N encoding. The first class gets a 1 in
    the first position, the second item gets a 1 in the second position, and so on.
    For example, if you are trying to predict the color of something, and there are
    four possible values (red, blue, green, yellow) then red = (1, 0, 0, 0), blue
    = (0, 1, 0, 0), green = (0, 0, 1, 0), and yellow = (0, 0, 0, 1).'
