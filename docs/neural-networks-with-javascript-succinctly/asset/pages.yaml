- img_proc: true
  md: 'In almost neural network scenarios, you should normalize numeric predictor
    values so that the values are scaled to roughly the same magnitude. Note that
    the Iris data set in Chapter 3 is an exception because the data is simple and
    is already scaled to values between 0.1 and 7.9 (this is a major reason why the
    Iris data set is used so often for neural network examples).


    The three most common forms of data normalization are min-max normalization, z-score
    normalization, and constant factor normalization. All three techniques are best
    explained by example.


    Suppose you have a tiny set of training data with three items.


    ```

    25      68000.00  male   moderate

    41      73000.00  male   conservative

    36      54000.00  female liberal

    ```


    The goal is to predict political leaning by age, annual income, and sex. Without
    normalization, the large annual income values would overwhelm the small age values.


    To apply min-max normalization to a numeric predictor, you must find the minimum
    and maximum value in your column, then compute (x - min) / (max - min).


    For the age variable, min = 25 and max = 41, so the normalized values are the
    following:


    ```

    (25 - min) / (max - min) = (25 - 25) / (41 - 25) = 0.0000

    (41 - min) / (max - min) = (41 - 25) / (41 - 25) = 1.0000

    (36 - min) / (max - min) = (36 - 25) / (41 - 25) = 0.6875

    ```


    The annual income values are normalized in the same way:


    ```

    (68000 - min) / (max - min) = (68000 - 54000) / (73000 - 54000) = 0.7368

    (73000 - min) / (max - min) = (73000 - 54000) / (73000 - 54000) = 1.0000

    (54000 - min) / (max - min) = (54000 - 54000) / (73000 - 54000) = 0.0000

    ```


    After-min normalizing a numeric predictor variable, all values will be scaled
    between 0.0 and 1.0.


    To z-score normalization, you must find the mean and standard deviation for each
    numeric column, then compute (x - mean) / sd.


    For the age variable, mean = 34.00 and sd = 6.68, and the normalized values are
    the following:


    ```

    (25 - mean) / sd = (25 - 34.00) / 6.68 = -1.3473

    (41 - mean) / sd = (41 - 34.00) / 6.68 = 1.0479

    (36 - mean) / sd = (36 - 34.00) / 6.68 = 0.2994

    ```


    After z-score normalizing a predictor variable, the values will usually be between
    -5.0 and +5.0. Normalized values less -5.0 or greater than 5.0 are extreme in
    the sense that they''re different from the average value.'
