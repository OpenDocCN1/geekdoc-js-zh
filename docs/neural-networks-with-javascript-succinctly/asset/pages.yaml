    \ is predicted to have low chance of heart disease\");\n} else {\n  console.log(\"\
    patient is predicted to have high chance of heart disease\");\n}\n```\n\nNotice\
    \ that the output value is stored in a 1×1 matrix rather than a scalar variable.\n\
    \n# Logistic sigmoid activation\n\nA neural network classifier has multiple output\
    \ nodes and uses softmax activation on the output nodes so that their values sum\
    \ to 1.0 and can be loosely interpreted as probabilities. In backpropagation training,\
    \ the derivative of the function used for output layer activation is used to compute\
    \ the gradients, which in turn are used to update the network's weights and biases.\n\
    \nA neural network for binary classification uses just a single output node and\
    \ the logistic sigmoid function for output layer activation. The logistic sigmoid\
    \ function is defined as y = 1.0 / (1.0 + exp(-x)). Although it's not at all obvious,\
    \ the calculus derivative is y' = y * (1 - y). Surprisingly, this is the same\
    \ as the derivative of the softmax activation function."
