  md: "# Saving and loading model weights\n\nThe NeuralNet class method saveWeights()\
    \ is defined as the following.\n\n```\nsaveWeights(fn)\n  let wts = this.getWeights();\n\
    \  let n = wts.length;\n  let s = \"\"\n\n  for (let i = 0; i < n-1; i++) { //\
    \ all except last value.\n    s += wts[i].toString() + \",\";\n  }\n  s += wts[n-1];\
    \ // last value, no trailing comma.\n\n  FS.writeFile(fn, s);\n```\n\nThe statement\
    \ wts = this.getWeights() returns a vector named wts with the weights and biases\
    \ serialized as the input-to-hidden weights, followed by the hidden node biases,\
    \ followed by the hidden-to-output weights, followed by the output node biases.\
    \ Because the demo network has a 5-25-3 architecture, there are a total of (5\
    \ * 25) + 25 + (25 * 3) + 3 = 228 weights and biases. The weights and biases are\
    \ serialized to a single, comma-separated string (without a trailing comma), which\
    \ is written to a text file.\n\nThere are many alternative designs you can use.\
    \ For example, you might want to write an architecture such as 5,25,3 and then\
    \ follow with the weights and biases, or you might want to write the weights using\
    \ JSON or XML format, and so on.\n\nAlmost all widely used deep neural network\
    \ libraries, such as TensorFlow, Keras, and PyTorch, save models in a proprietary\
    \ binary format. However, many of these libraries have added support for the ONNX\
    \ (open neural network exchange) standard.\n\nThe counterpart to saveWeights()\
    \ is a method loadweights() that loads saved weights from file into a neural network.\
    \ A loadweights() method can be defined as the following."
