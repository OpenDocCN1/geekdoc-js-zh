  md: "The eval() method sets up vectors hSums and oSums to hold the pre-activation\
    \ sum of products for the hidden nodes and the output nodes, respectively. An\
    \ alternative design is to compute the sums of products directly into class members\
    \ this.hNodes and this.oNodes, but then you'd have to write code to reset their\
    \ values to 0.0 at the beginning of the eval() method because the sums of products\
    \ are accumulated using the += operator.\n\nThe input values in parameter X are\
    \ assigned to class this.iNodes by reference. An alternative design, which can\
    \ be useful if the input values need to be processed in some way, is to assign\
    \ by value, for example, the following.\n\n```\nfor (let i = 0; i < this.ni; ++i)\
    \ {\n  this.iNodes[i] = X[i];\n}\n```\n\nA third design choice for dealing with\
    \ the input values into a neural network is to eliminate the explicit input nodes\
    \ altogether and just use the X values directly, without copying those values\
    \ into the network. Several deep neural network libraries use this implicit-input\
    \ nodes.\n\nThe hidden nodes are computed using the following statements:\n\n\
    ```\nfor (let j = 0; j < this.ni; ++j) { // each hidden node.\n  for (let i =\
    \ 0; i < this.ni; ++i) { // process each input node.\n    hSums[j] += this.iNodes[i]\
    \ * this.ihweights[j]; // accumulate.\n  }\n  hSums[j] += this.ihBiases[j]; //\
    \ add the bias.\n  this.hNodes[j] = hyperTan(hSums[j]); // apply activation.\n\
    }\n```\n\nAs explained earlier, the product of each input node and its associated\
    \ input-hidden weight is accumulated, the hidden node bias value is added, and\
    \ an activation function (tanh) is applied to the sum.\n\nA significantly different\
    \ approach to the one used in the demo program is to use matrix operations. Accumulating\
    \ the sum of products is essentially matrix multiplication. Therefore, if you\
    \ had a helper function matProduct(A, B) that returned the result of matrix multiplication,\
    \ then computing the values of the hidden nodes would reveal the following.\n\n\
    ```\nhSums = matProduct(this.ihweights, X);\nthis.hNodes = vecHyperTan(this.hSums);\n\
    ```\n\nThe matrix operations approach is used by all deep neural network code\
    \ libraries so that they can take advantage of GPU processing. However, the matrix\
    \ operations introduce quite a bit of additional complexity. For example, the\
    \ input values X must be stored as an nx1 matrix rather than a more natural vector\
    \ with n cells."
