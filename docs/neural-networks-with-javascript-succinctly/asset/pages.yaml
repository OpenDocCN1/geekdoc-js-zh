    A good neural network model would find the true decision boundary represented
    by the green line. However, if you train a neural network model long enough, it
    will get too good and generate a model indicated by the spiky, solid gray line.


    The gray line makes perfect predictions on the test data. All the blue dots are
    the gray line and all the red dots are the gray line.


    But when the overfitted model is presented with new, previously unseen data, there''s
    a good chance the model will make an incorrect prediction. For example, a new
    data item at (X1 = 4, X2 = 7) is above the true boundary, and so should be classified
    as blue. But because the data item is below the gray line overfitted boundary,
    it will be incorrectly classified as red.


    # Data normalization


    Preparing data for use by a neural network is tedious and time-consuming. In some
    scenarios there are distinct data preparation tasks: cleaning, normalizing numeric
    data, and encoding non-numeric data.


    Cleaning data usually means dealing with missing values and extreme or anomalous
    values. For data items that have one or more predictor values, in all but rare
    cases the best approach (in my opinion) is to delete those data items. Alternatives
    such as supplying an average value of some sort are sometimes used in classical
    statistics scenarios, but such techniques rarely work well with neural networks.'
