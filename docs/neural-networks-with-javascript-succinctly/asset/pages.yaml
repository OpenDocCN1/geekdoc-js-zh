- img_proc: true
  md: '![](img/56e6154402fb791dde6d62e1689ad4a0_34_0.png)


    The **tanh(x)** function accepts any value x, from negative infinity to positive
    infinity, and returns a value between -1.0 and +1.0. Notice that for values less
    than -5.0 and greater than +5.0, the **tanh(x)** result is nearly at its extreme
    value.


    Because pre-activation hidden nodes of less than about -5.0 or greater than +5.0
    result in -1.0 or +1.0, respectively, an effective neural network often has pre-activation
    hidden node values close to 0.0. This means that you should avoid very large or
    very small input values. This is accomplished by normalizing input data, as described
    in Chapter 4.


    The limits of -20.0 and +20.0 in the demo program implementation of the **hyperTan(x)**
    function are somewhat arbitrary. Other common limits for a program-defined tanh
    wrapper function are (-10.0, +10.0) and (-40.0, 40.0). In practice, different
    tanh limits have little effect in the neural network where they''re used.


    Another common layer activation function is the logistic sigmoid function. The
    name of the function is often shortened to log-sig or sigmoid in a neural network
    context (there are many different kinds of sigmoid functions in addition to logistic
    sigmoid). The math definition of the sigmoid function is:


    ```

    y = 1 / (1 + e^-*) = 1 / (1 + exp(-x))

    ```


    The graph of the sigmoid function is in Figure 2-5. Notice that the sigmoid function
    has a shape similar to the tanh function. The sigmoid function accepts any value
    from negative infinity to positive infinity and returns a value between 0.0 and
    1.0.'
