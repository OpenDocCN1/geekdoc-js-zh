  md: "In the method train() for binary classification, the output node signals are\
    \ computed using these statements.\n\n```\n// compute output node signals.\nfor\
    \ (let k = 0; k < this.no; ++k) {\n  let derivative = (1 - this.oNodes[k]) * this.oNodes[k];\
    \ // log-sig\n  oSSignals[k] = derivative * (this.oNodes[k] - Y[k]); // E=(t-o)^2\n\
    }\n```\n\nThe eval() method for binary classification is the.\",\n\n```\n.. //\
    \ compute output node before activation.\nfor (let k = 0; k < this.no; ++k) {\n\
    \  for (let j = 0; j < this.no; ++j) {\n    oSums[k] += this.hNodes[j] * this.hoWeights[j][k];\n\
    \  }\n  oSums[k] += this.oBiases[k];\n}\n\nfor (let k = 0; k < this.no; ++k) {\n\
    \  this.oNodes[k] = U.logSig(oSums[k]); // logistic sigmoid activation\n}\n```\n\
    \nTo summarize, to perform binary classification, you encode the variable to predict\
    \ 0 or 1. Your neural network has a single output node, use logistic sigmoid activation\
    \ for the output layer, and y * (1 - y) as the derivative term for the output\
    \ node signals.\n\n# Binary cross- entropy\n\nWhen creating a neural network for\
    \ binary classification, you can use mean squared error as in the demo program,\
    \ or you can use binary cross-entropy error. Regular cross-entropy error compares\
    \ a set of predicted probabilities with a set of correct probabilities. With only\
    \ one output node, there are no sets of probabilities to compare, so a special\
    \ form of cross entropy is used.\n\nSuppose t is a target value and y is predicted\
    \ output (a value between 0.0 and 1.0). For just two values, the cross-entropy\
    \ error equation is CEE = -log(y) * t + log(1-y)*(1-t). But in binary classification,\
    \ the target is always 1 or a 0.\n\nIf t = 1, log(1-y) * (1-t) term drops out,\
    \ leaving -log(y). If t = 0, log(y) * t term drops out, leaving just log(1-y).\
    \ To compute binary cross-entropy error for a neural network, if the target is\
    \ 1, use -log(y), and if the target is 0, use -log(1-y).\n\nSuppose you have just\
    \ three training items with the following target and computed output values."
