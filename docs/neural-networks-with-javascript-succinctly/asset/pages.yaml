    # Identity activation for regression


    A neural network classifier has multiple output nodes and uses softmax activation
    on the output nodes so that their values sum to 1.0 and can be loosely interpreted
    as probabilities. In backpropagation, the derivative of the function used for
    output-layer activation is used to compute the gradients, which in turn are used
    to update the network''s activations and biases.


    A neural network for regression uses just a single output node and uses the identity
    function for output layer activation. The identity function is just f(x) = x,
    or in other words, the identity function doesn''t do anything. It''s also somewhat
    correct to say that a neural network for regression has no activation function.


    If y = softmax(x), then the calculus derivative is y'' = y * (1 - y). If y = x
    (the identity function), the calculus derivative is a constant 1.


    In train(), the output nodes are computed using the following statements.


    ```

    // compute output node signals.

    for (let k = 0; k < this.node; ++k) {

    // let derivative = (1 - this.Nodes[k]) * this.Nodes[k]; // softmax

    let derivative = 1; // identity activation

    OSignals[k] = derivative * (this.Nodes[k] - Y[k]); // E=(t-o)^2

    }

    ```


    I left the statement used for a neural network classifier in a comment so you
    can see the difference between softmax activation and identity activation.


    In the eval() method, the code for regression is the following.'
