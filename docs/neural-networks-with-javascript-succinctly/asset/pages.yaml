- img_proc: true
  md: "error(item) = - [ ln(0.70) * 1 + ln(0.20) * 0 + ln(0.10) * 0 ] =\nln(0.70)\
    \ = 0.36\nerror(item) = - [ ln(0.40) * 0 + ln(0.35) * 1 + ln(0.25) * 0 ] =\nln(0.35)\
    \ = 1.05\nerror(item) = - [ ln(0.30) * 0 + ln(0.15) * 0 + ln(0.55) * 1 ] =\nln(0.55)\
    \ = 0.60\n\nTherefore, the mean cross-entropy error = (0.36 + 1.05 + 0.60) / 3\
    \ = 2.01 / 3 = 0.67.\n\nCross-entropy error is quite subtle and easy to understand\
    \ as squared error. Notice that when cross error is used for neural network classification,\
    \ there is only one component in the target vector, only one term contributes\
    \ to the result.\n\nIn practical terms, the key is that cross-entropy error is\
    \ a value where smaller values mean less error between computed outputs and target\
    \ outputs. Unlike squared error, which will always be a value between 0.0 and\
    \ 1.0, cross-entropy error will always be greater than or equal to 0.0, but doesn't\
    \ have an upper limit.\n\nOne possible implementation of mean cross-entropy error\
    \ is this.\n\n```\nmeanCrossEntErr(dataX, dataY)\n{\n  let sumCEE = 0.0; // sum\
    \ of the cross-entropy errors.\n  for (let i = 0; i < dataX.length; ++i) { //\
    \ each data item.\n    let X = dataX[i];\n    let Y = dataY[i]; // target output\
    \ like (0, 1, 0)\n\\    let outpt = this.eval(X); // computed (0.23, 0.66, 0.11)\n\
    \n    let idx = U.maxarg(Y); // find location of the 1 in target.\n    sumCEE\
    \ += Math.log(outpt[idx]);\n  }\n\n  return -1 * sumCEE / dataX.length;\n}\n```\n\
    \nBecause the log(0) is negative infinity, this implementation could fail, for\
