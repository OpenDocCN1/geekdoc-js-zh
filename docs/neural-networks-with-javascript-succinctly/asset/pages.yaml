    Mean squared (MSE) is the average of the sum of the squared differences between
    the computed outputs and the target outputs. The squared error for the three hypothetical
    data items are the following:


    ```

    error(item 0) = (1 - 0.70)^2 + (0 - 0.20)^2 + (0 - 0.10)^2 = 0.09 + 0.04 + 0.01

    0.14

    error(item 1) = (0 - 0.40)^2 + (1 - 0.35)^2 + (0 - 0.25)^2 = 0.16 + 0.42 + 0.06

    0.64

    error(item 2) = (0 - 0.30)^2 + (0 - 0.15)^2 + (1 - 0.55)^2 = 0.09 + 0.02 + 0.20

    0.31

    ```


    Therefore, MSE = (0.14 + 0.64 + 0.31) / 3 = 1.09 / 3 = 0.36.


    Notice that mathematically, it doesn''t matter if you compute (target - output)^2
    or (output - target)^2. For example, (1 - 0.30)^2 = 0.49 and (0.30 - 1)^2 = -0.70^2
    = 0.49. However, the order matters when using the back-propagation technique,
    which relies on error. By far the common of the two approaches is to use (target
    - output)^2, as the demo code does.


    Additionally, instead of computing the error for each term and then summing those
    errors, you can sum the differences between each computed.


