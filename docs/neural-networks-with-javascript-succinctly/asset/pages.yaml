    consists of visiting and processing each training item one time.


    Neural training is extremely sensitive to the values used for the learning rate
    and the maximum number of training epochs. For example, a learning rate of 0.02
    might work well, but a learning rate of 0.03 might cause the network not to learn
    all.


    The learning rate and maximum number of training epochs are called hyperparameters,
