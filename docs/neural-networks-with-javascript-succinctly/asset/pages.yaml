  md: '# # Chapter 1 Getting Started


    The best way to see this e-book is to take a look at the screenshot in Figure
    1-1. The image shows an example of using a neural network written using the JavaScript
    language without any significant external libraries. The network predicts the
    size of the company (small, medium, or large) a college student will work at after
    graduation, based on sex (male or female), GPA (much such as finance), and parents''
    annual income.


    ![](img/56e6154402fb791dde6d62e1689ad4a0_9_0.png)


    Figure 1-1: Neural Networks with JavaScript


    The system shown in Figure 1-1 is running on a Windows machine, but the code and
    information in this e-book also applies to Linux and macOS systems. The system
    uses Notepad as the text editor, but you can use any editor to edit the programs.


    If you look at the code carefully, you''ll see that the program is hosted by the
    Node.js JavaScript environment. The code in this e-book was run on Node.js, version
    10.14.1, but a relatively recent version will work. The key programming dependency
    is JavaScript ES6, also known as ECMAScript 6, ECMAScript 2015, and JavaScript
    6. You can run the code examples in a web browser if the browser supports ES6,
    and use `console.log()` statements and the HTML5 File API or the XMLHttpRequest
    for file reading and writing.


    This e-book assumes you have intermediate or better programming skills, but does
    not assume you know anything about neural networks.'
