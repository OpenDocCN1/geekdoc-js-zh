  md: "The result of applying softmax to (3.0, 5.0, 2.0) is (0.1142, 0.8438, 0.0420).\
    \ The resulting values sum to 1.0 and loosely represent the probabilities that\
    \ the person is conservative, moderate, or liberal. Because the second value (0.8434)\
    \ is largest, the prediction is that the person is a political moderate.\n\nThe\
    \ math equation for softmax is shown in Figure 2-3. There are alternatives for\
    \ output layer activation for neural classifiers, such as Taylor softmax and sparsemax,\
    \ but softmax is by far the most common.\n\n```\nsoftmax(x_i) = \\frac{e^{x_i}}{\\\
    sum_k e^{x_k}}\n```\n\nFigure 2-3: The Softmax Function\n\nIn words, the softmax\
    \ of one of the values in a vector is the exp() value divided by the sum of the\
    \ exp() applied to each of the values in the vector. For (3.0, 5.0, 2.0), the\
    \ **exp** applied to each value and their sum is the following.\n\nexp(3.0) =\
    \ 20.0855\nexp(5.0) = 148.4132\nexp(2.0) = 7.3891\n\nsum = 175.8878\n\nThen the\
    \ computed softmax values.\n\nsoftmax(3.0) = 20.0855 / 175.8878 = 0.1142\nsoftmax(5.0)\
    \ = 148.4132 / 175.8878 = 0.8438\nsoftmax(2.0) = 7.3891 / 175.8878 = 0.0420\n\n\
    A naive implementation of the softmax of a vector could be the following.\n\n\
    ```\nfunction softmax(vec)\n{\n  let result = [];\n  let sum = 0.0;\n  for (let\
    \ i = 0; i < vec.length; i++) {\n    result[i] = Math.exp(vec[i]); // find exp()\
    \ of each value.\n    sum += result[i]; // sum the exp()s\n  }\n  for (let i =\
    \ 0; i < result.length; i++) {\n    result[i] = result[i] / sum;\n  }\n  return\
    \ result;\n}\n```\n\nUnfortunately, a naive implementation could easily cause\
    \ arithmetic problems because **Math.exp(x)** would be astronomically large for\
