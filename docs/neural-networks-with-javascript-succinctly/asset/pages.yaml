  md: "![](img/56e6154402fb791dde6d62e1689ad4a0_97_0.png)\n\n# Figure 4-4: Adding\
    \ a Penalty to Error Changes Weight Deltas\n\nYou add a fraction (often called\
    \ the \"L2 regularization constant\" and given the lowercase lambda Greek letter)\
    \ of the sum of the squared values to the error. The top-most equation is squared\
    \ augmented with the L2 weight penalty: one-half of the squared differences between\
    \ the target values and the computed output values, plus one-half a constant lambda\
    \ times the sum of the squared values.\n\nDuring training, the back-propagation\
    \ algorithm iteratively adds a weight-delta (which can be positive or negative)\
    \ to each weight. The weight-delta is a fraction (called the learning rate, usually\
    \ given lowercase eta Greek symbol, which resembles a script 'n') of the weight\
    \ gradient. The weight gradient is the calculus derivative of the error function.\n\
    \nTo use L2 regularization, you have to add the derivative of the weight penalty.\
    \ Luckily, this is quite easy. You can see this as the last term in the gradient\
    \ part of the weight-delta equation.\n\nLet me emphasize that I've abused the\
    \ formal math notation somewhat, and this explanation is not mathematically one\
    \ hundred percent accurate. But a thorough, rigorous explanation of the relationship\
    \ between back-propagation and L2 regularization with all the details would take\
    \ many pages of messy math.\n\nAlthough the L2 regularization math concepts are\
    \ complex, modifying basic back-propagation training to use it is simple. The\
    \ People_regularization.js makes only a few changes to the People_regularization.js\
    \ program.\n\nThe definition of class method `train()` requires a new parameter\
    \ for the L2 regularization weight term.\n\n```\ntrain(trainX, trainY, lrRate,\
    \ maxEpochs, lamda)\n{\n  ..\n```"
