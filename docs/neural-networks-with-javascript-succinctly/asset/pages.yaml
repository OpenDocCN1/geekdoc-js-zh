    \ neural libraries use an advanced form of momentum called Nesterov momentum.\n\
    \n# Batch and mini-batch training\n\nBatch training is a technique used to be\
    \ the most common approach for neural network training, but is now used less often.\
    \ The screenshot in Figure 5-4 shows an example of batch training applied to the\
    \ Boston dataset problem.\n\nThe most common technique for neural network training\
    \ is called online training. Online training updates weights after processing\
    \ each training item. Batch training processes all trainings, and then updates\
    \ weights. Batch training can be used for classification or regression problems.\n\
    \nIn pseudo-code, the two approaches are the following:\n\n```\n// online training\n\
    for-each training item\n  compute the gradients\n  use gradients from item to\
