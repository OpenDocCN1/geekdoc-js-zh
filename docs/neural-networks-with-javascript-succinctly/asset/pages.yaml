  md: '# Chapter 3 Training


    Training a neural network is the process of finding values for the network''s
    weights and biases so that the network can make predictions. Training a neural
    network is complex and difficult, both conceptually and in practice.


    The screenshot in Figure 3-1 shows a demo of neural network training. The goal
    of the program is to create a prediction model (a trained neural network often
    called a model) for the well-known Iris data set.


    ![](img/56e6154402fb791dde6d62e1689ad4a0_37_0.png)


    Figure 3-1: Neural Network Training on the Iris Data Set


    The Iris data has 150 items. Each item represents an iris flower. predictor values
    (often called features in NN machine learning terminology) and three possible
    species to predict: setosa, versicolor, and virginica. The demo program creates
    a 4-7-3 neural network. There are four input nodes, one for each predictor value,
    and three output nodes, because there are three classes (discrete values to predict).'
