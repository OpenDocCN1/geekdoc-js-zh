    # Cross-entropy error


    Cross-entropy error is a very important alternative to squared error. Cross-entropy
    error is also called log loss. The mathematical equation for cross-entropy error
    in the context of a neural network classifier is shown in Figure 3-3.


    > E = -Σ ln(oⱼ) ** tⱼ


    Figure 3-3: Cross-Entropy Error


    In words, the cross-entropy error (CEE) for a single data item is the negative
    sum of the log of each computed output component times the target component. The
    idea is best explained by example.


    Suppose you have only three iris items for training a 4-7-3 neural network, and
    at some point during training, the current input and output values are (as in
    the previous section).


    | input (correct) | computed |

    | 5.0 3.5 1.5 0.5 1 0 | 0.70 0.20 0.10 |

    | 6.5 2.9 4.2 1.2 0 1 0 | 0.40 0.35 0.25 |

    | 5.9 3.2 2.3 1.8 0 0 1 | 0.30 0.15 0.55 |


    The three cross-entropy error terms are the following.'
