  md: 'Suppose you have a binary predictor variable, sex, that can be either male
    or female. If you use one-hot encoding, then male = (1, 0) and female = (0, 1).
    If you use -1 +1 encoding, then male = -1 and female = +1. If you use 0-1 encoding,
    then male = 0 and female = 1.


    If you have a classification problem, you must encode the values of the variable
    to predict (the dependent variable), too. For dependent variables that can be
    one of three or more values (such as political leaning of conservative, moderate,
    or liberal), then you should always use one-hot/1-of-N encoding: conservative
    = (1, 0, 0), moderate = (0, 1, 0), liberal = (0, 0, 1).


    For classification problems (such as predicting a person sex of male or female),
    by far the most common approach is to use 0-1 encoding: male = 0, female = 1.
    However, you can also use one-hot / 1-of-N encoding: male = (1, 0), female = (0,
    1). Encoding a binary dependent variable for a neural network is supervised, and
    is explained in Chapter 6, Binary Classification.


