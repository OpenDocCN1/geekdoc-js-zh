  md: 'To apply constant normalization, you divide or multiply all values by a constant.
    For example, for the age values, you could divide each value by 100.


    25 / 100 = 0.25

    41 / 100 = 0.41

    36 / 100 = 0.36


    In general, there is no best normalization technique. In practice, the type of
    normalization technique used usually doesn''t have a huge effect on the prediction
    accuracy of the trained network. It is possible to use different normalization
    techniques on different predictors in your training data. For example, you could
    normalize age values using min-max normalization and normalize annual income values
    using z-score normalization.


    After normalizing your training data, you must use the same normalizing parameters
    on the test data. For example, suppose you have a set of training data where one
    of the predictors is a person''s height in inches. If you use min-max normalization
    on the training data where min = 58.0 and max = 77.0, then when you normalize
    the test data, you do not calculate a new min and max value. You use the min =
    58.0 and max = 77.0 on the test data, regardless of the actual and max values
    in the test data.


    In short, split all data into a training and a test set.


    +   - Split all data into a training and a test set.

    - Normalize the training data.

    - Normalize the test data using the normalization parameters from the training
    data.


    # Data encoding


    A neural network works directly with numeric values, so variables that are non-numeric
    (sometimes categorical) must be converted to numbers. For categorical predictor
    variables that can take one of three more values, the most common encoding techniques
    are 1-of-(N-1) and one-hot encoding (sometimes 1-of-N encoding). For categorical
    predictor variables that can take one of just two possible values (binary predictors),
    the most common encoding techniques are one-hot encoding, -1 encoding, and 0-1
    encoding.


    Before explaining these techniques, let me say that my recommendations are to
    use 1-of-(N-1) encoding for predictors that can be from three to many possible
    values, use one-hot encoding for predictors that can be 10 or more possible values,
    and use -1 encoding for binary predictors that can be one of two possible values.


    Suppose you have a categorical predictor variable, color, that can be one of four
    possible values: red, blue, green, yellow. If you use one-hot / 1-of-N encoding,
    then red = (1, 0, 0, 0, 0), blue = (0, 1, 0, 0, 0), green = (0, 0, 1, 0, 0), and
    yellow = (0, 0, 0, 0, 1).


    If you use 1-of-(N-1) encoding, then red = (1, 0, 0, 0), blue = (0, 1, 0, 0),
    green = (0, 0, 1, 1). The 1-of-(N-1) encoding technique is sometimes called effect
    coding or contrast coding, but there is quite a bit of inconsistency with the
    terminology.'
