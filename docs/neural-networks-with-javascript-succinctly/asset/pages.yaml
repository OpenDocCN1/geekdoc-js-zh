    \ node signals and the calculus derivative of the hidden layer activation function,\
    \ the hyperbolic tangent in this case.\n\n```\n// compute hidden node signals.\n\
    for (let j = 0; j < this.nh; ++j) {\nlet sum = 0.0;\nfor (let k = 0; k < this.no;\
    \ ++k) {\n  sum += oSigmoid[k] * this.weights[j][k]\n}\n```\n\n```\nlet derivative\
    \ = (1 - this.hNodes[j]) * (1 + this.hNodes[j]); // tanh\nhSigmoid[j] = derivative\
    \ * sum;\n...\n```\n\nThe ideas underlying this code are some of the deepest in\
    \ all machine learning. However, from a practical point of view, the only statement\
    \ you'll ever need to change is the computation of the derivative term (if you\
    \ decide to use a different hidden layer activation function). For example, if\
    \ you use logistic sigmoid activation, the calculus derivative of y = logsig(x)\
    \ is y * (1 - y).\n\n```\nlet derivative = this.hNodes[j] * (1 - this.hNodes[j]);\
    \ // logistic\nsmoid\n```\n\nNext, the gradients for the input-to-hidden weights\
    \ and the gradients for the hidden node biases are computed."
