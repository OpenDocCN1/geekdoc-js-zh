  md: '# Chapter 4 Overfitting


    One of the challenges when working with neural networks is a phenomenon called
    overfitting. A trained model is overfitted if it predicts well on the training
    data but predicts poorly on test data and new, previously unseen data. There are
    many techniques to reduce the likelihood of model overfitting, including dropout,
    train-validate-test, and regularization.


    The screenshot in Figure 4-1 shows a demo of neural network overfitting. The goal
    of the program is to predict the political leaning of a person (conservative,
    moderate, or liberal) based on sex (male or female), age, geographical region
    (eastern, western, or central), and annual income.


    ![](img/56e6154402fb791dde6d62e1689ad4a0_77_0.png)


    Figure 4-1: An Example of Neural Network Model Overfitting'
  merge: -1
