    unseen data.


    The demo concludes by using the trained model to make a prediction. The demo sets
    up an iris flower with predictor values of (5.1, 3.1, 4.1, 2.1) and sends those
    values to the model. The model''s output values are (0.0570, 0.4511, 0.4918).
    Because the third output value is the largest, the model predicts that the unknown
    flower is the species (virginica).


    # Understanding the Iris data set


    Fischer''s Iris data set is one of the most well-known benchmark data sets in
    statistics and machine learning. The data set has 150 items. The raw data looks
    like this:


    ```

    5.1, 3.5, 1.4, 0.2, setosa

    7.0, 3.2, 4.7, 1.4, versicolor

    6.3, 3.3, 6.0, 2.5, virginica

    ...

    ```


    The raw data was prepared by one-hot encoding the class labels, but the feature
    values are not normalized as is usually done.


    ```

    5.1, 3.5, 1.4, 0.2, 1, 0, 0

    7.0, 3.2, 4.7, 1.4, 0, 1, 0

    6.3, 3.3, 6.0, 2.5, 0, 0, 1

    ```


    One-hot encoding is also known as 1-of-N encoding. The first class gets a 1 in
    the first position, the second item gets a 1 in the second position, and so on.
    For example, if you are trying to predict the color of something, and there are
    four possible values (red, blue, green, yellow) then red = (1, 0, 0, 0), blue
    = (0, 1, 0, 0), green = (0, 0, 1, 0), and yellow = (0, 0, 0, 1).'
