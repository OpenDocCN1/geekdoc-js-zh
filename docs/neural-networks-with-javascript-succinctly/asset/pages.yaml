  md: "Drop nodes aren't physically removed; instead, they are virtually removed by\
    \ having any code that references them ignores nodes. In this case, in addition\
    \ to hidden nodes [1] and [2], the input-to-hidden weights that terminate in the\
    \ drop nodes are ignored. The four hidden-to-output node weights that originate\
    \ from the drop nodes are ignored.\n\nIt's not immediately obvious why dropout\
    \ reduces overfitting. In fact, the effectiveness of dropout is not fully understood.\
    \ One notion is that dropout essentially selects random subsets of neural networks,\
    \ and then averages them together, giving a more robust final result. Another\
    \ notion is that dropout prevents hidden nodes from relying on other nodes (called\
    \ coadaptation).\n\nThe dropout technique became well known in 2015 following\
    \ the publication of a research paper. The paper presented a complex mechanism\
    \ for implementing dropout, which involved many logic branches and code modification\
    \ to both the training method and the forward-pass evaluation method.\n\nThe complex\
    \ implementation of dropout was used for several years, until engineers noticed\
    \ that the key ideas of dropout could be implemented in a much simpler way. This\
    \ simpler technique for dropout implementation is completely inverted.\n\n![](img/56e6154402fb791dde6d62e1689ad4a0_101_0.png)\n\
    \nFigure 4-6: The Dropout Mechanism in Theory, but Not in Practice\n\nThere are\
    \ several minor implementation variations that can be used for inverted dropout.\
    \ The demo modifies the basic train() method by adding a parameter dropProb (drop\
    \ probability) that controls how many hidden nodes drop.\n\n```\ntrain(trainX,\
    \ trainY, lrRate, maxEpochs, dropProb)\n{\n  let keepProb = 1.0 - dropProb\n \
    \ let keepNodes = U.vecMake(this.nh, this.no, 0.0);\n\n  let hoGrads = U.matMake(this.nh,\
    \ this.no, 0.0);\n...\n```"
  merge: -1
  pgno: 101
- img_proc: true
  md: "The numeric vector keepNodes tracks if a hidden node is marked for dropping\
    \ (value = 0) or not (value = 1). An alternative is to use a vector dropNodes\
    \ with reversed values, but keepNodes is more convenient programmatically. Another\
    \ alternative is to use a JavaScript boolean array instead of a numeric vector.\n\
    \nIn the train() method, inside the for-loop that iterates through each training\
    \ item, a new set of nodes to drop (or equivalently, keep) is determined for each\
    \ training item.\n\n```\nfor (let ii = 0; ii < n; ++ii) {  // each item\n// select\
    \ hidden nodes to drop.\nfor (let j = 0; j < this.nh; ++j) {\n  let p = this.rnd.next();\n\
    }\n\nif (p < dropProb) {\n  keepNodes[j] = 0; // this is a node to drop.\n} else\
    \ {\n  keepNodes[j] = 1; // keep the node.\n}\n}\n```\n\nImmediately after calling\
    \ the forward-pass eval() method, dropout is applied.\n\n```\nlet X = trainX[idx];\n\
    let Y = trainY[idx];\n\nthis.eval(X); // output stored in this.onNodes.\n// apply\
    \ inverted dropout.\nfor (let j = 0; j < this.nh; ++j) {\n  if (keepNodes[j] ==\
    \ 0) {\n    this.hNodes[j] = 0.0;\n  } else {\n    this.hNodes[j] /= keepProb;\n\
    \  }\n}\n```\n\nHidden nodes that have been selected to drop have their values\
    \ overwritten with 0.0, and nodes that aren't dropped have their values scaled\
    \ by keepProb, the complement of the drop probability. Because keepProb is always\
    \ less than 1.0, dropout always increases a value. For example, suppose a node's\
    \ value is 0.90 and dropProb is 0.20; then keepProb is 0.80 and 0.90 / 0.80 =\
    \ 1.125. The scaling of nondrop nodes larger compensates for the drop nodes not\
    \ contributing to the final output node values, because the drop node values are\
    \ 0.0.\n\nA call to the train() method with a 10% probability of dropping each\
    \ hidden node looks like the following.\n\n```\ndropProb = 0.10;\nn.train(trainX,\
    \ trainY, 1rnRate, maxEpochs, dropProb); // use dropout\n```"
