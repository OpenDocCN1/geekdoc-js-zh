    # The two-node technique for binary classification


    By far the most common approach to neural network binary classification is to
    use a single output node scaled with sigmoid activation and target values of 0
    or 1. An alternative is to encode target values as (1, 0) or (0, 1) and use two
    output nodes scaled with softmax activation. The problem becomes a standard multiclass
    classification problem. Research results comparing the one-node and two-node techniques
    are inconclusive, in my opinion.


    # Questions


    +   1. Suppose you have just three training items with the following target and
    computed output values.


    ```

    target      computed output

    1           0.70

    0           0.20

    1           0.60

    ```


    +   A. Compute the mean squared error.

    B. Compute the mean binary cross-entropy error.'
