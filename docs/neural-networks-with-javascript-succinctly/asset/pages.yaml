    // batch training

    for-each training item

    compute the gradients

    accumulate the gradients

    end-loop

    use average of accumulated gradients from all items to update weights

    ```


    In the early days of neural networks, batch training was very common because it
    is more principled. The online training approach uses a single training item to
    estimate the true gradient. The batch approach uses all training items to estimate
    the true gradient.


    ![](img/56e6154402fb791dde6d62e1689ad4a0_124_0.png)


    Figure 5: Batch Training on the Boston Dataset


    But in practice, online training is, not always, to work better than batch training
    for simple, single-hidden-layer neural networks. However, a variation of batch
    training, called mini-batch training, is now the most common technique used for
    deep neural networks.


    The demo program implements batch training using the same method signature as
    online training.'
