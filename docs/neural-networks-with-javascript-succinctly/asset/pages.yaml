    }\n```\n\nAs usual, adding error-checking code adds complexity. When writing your\
    \ own lightweight neural network code, you can decide when and what type of error\
    \ checking is needed.\n\n# Back-propagation training\n\nNeural network training\
    \ is the process of finding values for the network's weights and biases that computed\
    \ output values closely match the known, correct target values in the training\
    \ data.\n\nThe back-propagation algorithm for neural network training is arguably\
    \ one of the most important algorithms in the history of computer science. Back-propagation\
    \ (often spelled as one word, backpropagation, due to a type in a research paper\
    \ that has been repeated ever since) is based on the mathematical idea decades\
    \ ago of stochastic gradient descent (SGD), and so the terms back-propagation\
    \ and SGD are often used interchangeably.\n\nBack-propagation is extraordinarily\
    \ complex, but unfortunately, a complete understanding of the theory is not necessary\
    \ to implement the algorithm in practice. At a very high level, back-propagation\
    \ training is as follows:\n\n```\nLoop maxEpochs times\n  for each training item\n\
    \    get training item inputs X and correct target values Y\n    compute output\
    \ values using X (\"forward pass\")\n\n    (this is the \"forward pass\")\n  \
    \  compute the gradient of each hidden-output weight\n    compute the gradient\
    \ of each output node bias\n    compute the gradient of each input-hidden weight\n\
    \    compute the gradient of each hidden node bias\n```\n\n```\nuse the gradients\
    \ to adjust each weight and bias\nend-For\nend-Loop\n```\n\nEach neural network\
    \ weight and bias has an associated value called a gradient. Technically, each\
    \ value is a partial derivative of the weight with respect to the error function,\
    \ but gradient is almost always used because it's much easier to say and write."
