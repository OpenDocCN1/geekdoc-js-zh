- img_proc: true
  md: "![](img/56e6154402fb791dde6d62e1689ad4a0_35_0.png)\n\nFigure 2-5: Graph of\
    \ sigmoid(x) on [-5.0, +5.0]\n\nOne possible implementation of the logistic sigmoid\
    \ function follows.\n\n```\nfunction logSig(x)\n{\n  if (x < -20.0) {\n    return\
    \ 0.0;\n  }\n  else if (x > 20.0) {\n    return 1.0;\n  }\n  else {\n    return\
    \ 1.0 / (1.0 + Math.exp(-x));\n  }\n}\n```\n\nDuring neural network training,\
    \ most training algorithms use the calculus derivative of the hidden layer activation\
    \ function. One of the tanh function is often used for hidden layer activation\
    \ is that the function has a very convenient derivative. If y = tanh(x), the derivative\
    \ is y' = (1 - y) * (1 + y)\n\nThe derivatives of most math functions are expressed\
    \ in terms of the input value x. For example, if y = x2 + sin(x) then y' = 2x\
    \ + cos(x) + 3. By an algebra coincidence, the derivative of y = tanh(x) can be\
    \ expressed in terms of the calculated value y instead of x. This characteristic\
    \ is useful, as explained in Chapter 3. The derivative of the sigmoid function\
    \ is y' = y * (1 - y), which is also computationally convenient."
