    **versicolor** and **virginica** are nearly linearly separable. In spite of its
    simplicity, the Iris data set serves as well as a classification example.


    ![](img/56e6154402fb791dde6d62e1689ad4a0_39_0.png)


    Figure 3-2: The Iris data set


    By the way, there are actually at least two versions of Fisher''s Iris data set
    that are in common use. The original data was collected in 1935 and published
    by Fisher in 1936. However, at some point in time, a couple of the original values
    for setosa items were incorrectly transcribed, and years later made their way
    onto the internet. This isn''t serious because the data set is now used just for
    a teaching example rather than for serious research.'
