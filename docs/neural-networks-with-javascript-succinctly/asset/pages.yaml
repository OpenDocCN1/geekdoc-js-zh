    );\n```\n\nThe point is that creating a neural network from scratch, you have\
    \ many design options. These design options usually involve a tradeoff between\
    \ implementation simplicity and calling flexibility.\n\n# Softmax activation\n\
    \nThe three most common forms of neural network systems are NN regression, NN\
    \ multiclass classification, and NN binary classification. In NN regression, the\
    \ goal is to predict a single numeric value, for example, predicting the annual\
    \ income of a person based on age, sex, years of education.\n\nIn NN multiclass\
    \ classification, the goal is to predict a discrete value where there are three\
    \ or more possible values. For example, you might want to predict the political\
    \ leaning of a person (conservative, moderate, or liberal) based on such age and\
    \ annual income.\n\nIn binary classification, the goal is to predict a discrete\
    \ value where there are exactly two possible values. For example, you might want\
    \ to predict the sex of a person (male or female) based on such political leaning,\
    \ age, and height. It turns out, the programming techniques used for binary classification\
    \ are quite a bit different from the programming techniques used for multiclass\
    \ classification.\n\nSoftmax activation is used for neural multiclass classification.\
    \ The idea is best explained by example. Suppose you want to predict the political\
    \ leanings of a conservative, moderate, or liberal based on age, height, annual\
    \ income, and years of education. You could implement a 4-10-3 neural network,\
    \ meaning there are four input nodes (one for each predictor value), 10 processing\
    \ nodes, and three output nodes. The number of hidden nodes is a free parameter,\
    \ also called a hyperparameter, which means you must determine the value using\
    \ trial and experience, and intuition.\n\nSuppose the input values into the neural\
    \ network are X = (3.2, 7.0, 6.5, 5.0, 2.0), which could correspond to a 32-year\
    \ old person who is 70 inches tall, makes $65,000 per year, and has two years\
    \ of education high school school. Suppose the raw output values before softmax\
