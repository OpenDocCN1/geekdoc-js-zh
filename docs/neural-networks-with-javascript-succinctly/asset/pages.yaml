  md: 'In practice, if you use enough training iterations, for multiclass classification
    problems mean squared error and mean cross-entropy error produce similar neural
    network models in terms of prediction accuracy. However, because cross-entropy
    error is used more often than squared error, you should use cross-entropy error
    if you are collaborating with others. And note that for regression problems, the
    goal is to predict a single numeric value, cross-entropy error is not an option.


    Although the terms back-propagation and stochastic gradient descent are often
    used interchangeably,they''re different. Technically, the back-propagation algorithm
    computes gradients, and stochastic gradient descent uses the gradients to reduce
    error.


    Stochastic gradient descent often quite well for neural networks with a single
    hidden layer, but often fails for deep neural networks. Between 2014 and 2017,
    remarkable progress was made in devising new learning algorithms for deep neural
    networks. Most of these algorithms use a different learning rate for each weight
    and bias, and adaptively change the learning rates during training.


    Advanced algorithms are supported by most neural network code libraries such as
    TensorFlow and PyTorch include Adagrad (adaptive gradient), Adelta (improved variation
    of Adagrad), RMSProp (adaptive gradient plus back-prop), Adam ("adaptive estimation",
    similar to RMSProp with momentum), and AdamMax (a variation of Adam).


    All of these learning are based on calculus gradients. For example, evolutionary
    optimization is similar to genetic algorithms that loosely mimic the behavior
    of biological chromosomes. And particle swarm optimization loosely mimics the
    behavior of swarming organisms. These bio-inspired techniques have great promise,
    but are currently not practical because they require enormous computational power.


