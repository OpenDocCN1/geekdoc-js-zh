  md: "# target computed output\n\n```\n1    0.80\n0    0.30\n1    0.90\n```\n\nThe\
    \ three binary cross entropy terms are -log(0.80) = 0.223, -log(0.70) = 0.357.\
    \ and -log(0.9) = 0.105, and therefore, the binary cross-entropy error is (0.223\
    \ + 0.357 + 0.105) / 3 = 0.228.\n\nA possible implementation of EntErr is the\
    \ following.\n\n```\nmeanBinCrossEnt(dataX, dataY) // for binary classification\
    \ problems.\n{\n    let sum = 0.0;\n\n    for (let i = 0; i < dataX.length; ++i)\
    \ { // each data item\n        let out = this.dataX[i];\n\n        if (dataY[i]\
    \ == 1) { // target is 1\n            sum += Math.log(out);\n        } else {\
    \ // target is 0\n            sum += Math.log(1.0 - out);\n        }\n    }\n\n\
    \    return -1 * sum / dataX.length;\n}\n```\n\nRecall that back-propagation training\
    \ does not explicitly compute compute error; instead, back-propagation uses the\
    \ calculus derivative of the error/loss function. For mean squared error, the\
    \ relevant code is the following.\n\n```\n// compute output node signals.\nfor\
    \ (let k = 0; k < this.node; ++k) {\n    let derivative = (1 - this.nodes[k])\
    \ * this.nodes[k]; // logsig\nsoSignals[k] = derivative * (this.nodes[k] - Y[k]);\
    \ // E=(t-y)^2\n}\n```\n\n// now compute hidden-to-output gradients using output\
    \ signals.\n\nBut if you assume binary cross-entropy error instead of mean squared\
    \ error, many of the terms cancel each other out, and in one of the most surprising\
    \ results in all of machine learning (well, surprising to me, anyway), the computation\
    \ of the output node signals reduces to the following.\n\n```\n// compute output\
    \ node signals.\nfor (let k = 0; k < this.node; ++k) {\n    oSignals[k] = this.nodes[k]\
