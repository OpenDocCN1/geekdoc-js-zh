  md: "I use the misspelled lamda rather than \"lambda\" because lambda is a reserved\
    \ word in many programming languages. In the train() implementation, the computations\
    \ for the hidden-to-output gradients and the input-to-hidden gradients have to\
    \ be changed slightly to add a weight penalty.\n\n```\n// compute hidden-to-output\
    \ weight gradients using output signals.\nfor (let j = 0; j < this.nh; ++j) {\n\
    \  for (let k = 0; k < this.no; ++k) {\n    hoGrads[j][k] = oSignals[k] * this.hNodes[j];\n\
    \    hoGrads[j][k] += lambda * this.hWeights[j][k]; // L2 penalty\n  }\n}\n```\n\
    \n```\n// compute input-to-hidden weight gradients using hidden signals.\nfor\
    \ (let i = 0; i < this.ni; ++i) {\n  for (let j = 0; j < this.nh; ++j) {\n   \
    \ ihGrads[i][j] = hSignals[j] * this.iNodes[i];\n    ihGrads[i][j] += lambda *\
    \ this.ihWeights[i][j]; // L2 penalty\n  }\n}\n```\n\nIn short, to add L2 regularization\
    \ to standard back-propagation, you only need to add two lines of code.\n\nTo\
    \ call the train() method, you just need to add the lambda L2 weighting term.\n\
    \n```\n// 3. train network\nlet lrRate = 0.01;\nlet maxEpochs = 50000;\nlet lambda\
    \ = 0.0005;\nconsole.log(\"nstarting training with learning rate = 0.01 lambda\
    \ = 0.0005\");\nnn.train(trainX, trainY, lrRate, maxEpochs, lambda);\nconsole.log(\"\
    Training complete\");\n```\n\nAs it turns out, L2 regularization is extremely\
    \ sensitive to the value used for the lambda weighting term and finding a good\
    \ value for lambda can be difficult. When regularization works, it can be highly\
    \ effective in reducing model overfitting.\n\nResearchers worked out the details\
    \ of L2 regularization for neural networks in the 1990s. But at the same time,\
    \ engineers discovered the same basic idea independently and called the technique\
    \ \"weight decay.\\ Formal L2 regularization decreases the value of a network's\
    \ gradients, and then the gradients are used to decrease the magnitude of the\
    \ network's weights and biases."
  merge: -1
  pgno: 98
- img_proc: true
  md: "Weight decay skips the modification of the gradients and directly reduces the\
    \ magnitude of the value weights and biases on each iteration. The weight decay\
    \ mechanism is much simpler than formal L2 regularization. The computation of\
    \ gradients is gone exactly as it is without regularization. Then during weight\
    \ and biases updates, after each update, the magnitude is decreased. For example\
    \ the following:\n\n```\n// update-to-hidden weights and apply weight decay.\n\
    for (let i = 0; i < this.ni; ++i) {\n  for (let j = 0; j < this.nj; ++j) {\n \
    \   let delta = -1.0 * lr * hgrads[i][j];\n    this.weights[i][j] += delta;\n\
    \    this.weights[i][j] *= lambda; // decrease weight (from L2 lambda).\n  }\n\
    }\n```\n\nSomewhat unfortunately, both L2 regularization and weight decay regularization\
    \ usually use a parameter named lambda as the scaling constant. However, by looking\
    \ at the code, you can see that the lambda values are used very differently. The\
    \ point is, if you're using a neural network library, the meaning of a regularization\
    \ lambda can vary (larger values of lambda reduces more than smaller values).\n\
    \nA technique that is closely to L2 regularization is called max norm constraint.\
    \ The idea is to put a fixed limit on the magnitude of all weights. For example,\
    \ immediately after updating each weight and bias in the train() method, you check\
    \ to see if the new weight value is greater than a fixed threshold value (perhaps\
    \ 10.0) or less than the corresponding threshold value (-10.0), and if so, you\
    \ adjust the weight to the threshold value.\n\n# Dropout\n\nDropout is an advanced\
    \ technique used to reduce the likelihood of neural network overfitting. The technique\
    \ sounds strange: on each training iteration, a portion (typically something like\
    \ 0.50 or 0.20) of the network's hidden nodes are randomly dropped, meaning the\
    \ training algorithm acts as if the nodes that have been selected to drop do not\
    \ exist.\n\nDropout can be used for classification problems or regression problems.\
    \ It can be used in conjunction with other techniques such as regularization,\
    \ or by it itself.\n\nThe screenshot in Figure 4-5 shows an example of using dropout.\
    \ The goal is to predict a person's liking (conservative, moderate, or liberal)\
    \ from their sex, age, geo-region (eastern, western, or central), and annual income.\n\
    \nBecause dropout effectively trains with some of the hidden nodes, in general\
    \ you want to use more hidden nodes than you'd without dropout. The dropout demo\
    \ uses twice as many hidden nodes (50 versus 25) as the nondrop demo. Additionally,\
    \ in many situations, you may have to adjust the values of the learning rate and\
    \ maximum-epochs to get good results."
