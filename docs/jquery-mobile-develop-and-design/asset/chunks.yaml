    ### Delaying Page Initialization


    Page initialization happens automatically and by default with jQuery Mobile. The
    framework includes a property named `autoInitializePage` that determines whether
    the webpage should be initialized. By default, the value of this property is set
    to `true`, so the page is always initialized when the document is ready. However,
    by extending the `$.mobile` object it’s possible to set this property to `false`
    and handle page initialization later.


    You can temporarily delay page initialization while other scripts run, which is
    a perfect scenario for setting the `autoInitializePage` property to `false`:


    [Click here to view code image](#images.html_p180pro01)


    $(document).bind("mobileinit", function() {


        $.extend( $.mobile , {


            autoInitializePage: false


        });


    });


    Imagine a large amount of client-side JavaScript having to be loaded, such as
    a long list of names. In cases like this it might be a good idea to delay initialization
    until the document object model (DOM) has completed loading. This way the client-side
    JavaScript has a chance to run and you can fade the data in gracefully rather
    than having it load line by line before the visitor’s eyes:


    [Click here to view code image](#images.html_p180pro02)


    <!DOCTYPE html>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>Page Initialization - jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="assets/js/custom-jqm.js"></script>


        <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


    </head>


    <body>


        <div data-jquerymobiletv-role="page" id="mypage">


            <div data-jquerymobiletv-role="header"><h1>Page Name</h1></div>


            <div data-jquerymobiletv-role="content">


                <ul data-jquerymobiletv-role="listview" id="my-list"></ul>


            </div>


            <div data-jquerymobiletv-role="footer">Copyright</div>


        </div>


        <script type="text/javascript">


            $("#mypage").css(''display'', ''none'');


            var namesArray = new Array("Tom", "Lucy", "Lee", "Chris", "Albert", "Frank");


            for(var i=0; i<namesArray.length; i++) {


                $(''#my-list'').append(''<li><a href="#">''+namesArray[i]+ ''</a></li>'');


            }


            $.mobile.autoInitializePage = true;


            $("#mypage").fadeIn(1000);


        </script>


    </body>


    </html>


    Running this code delays initialization; the user won’t see the list of names
    until the loop has completed and the `autoInitializePage` property is set to `true`,
    then the jQuery `fadeIn` method is used to fade in the page.


    **[Figure 12.1](#ch12.html_ch12fig01)** shows how the page renders once the `autoInitializePage`
    property is set to `true` and the page is faded in.


    ![Image](graphics/jquery-12-1.jpg)


    Figure 12.1\. A page rendered after delaying page initialization.


    ### Customizing the subPageUrlKey


    The `subPageUrlKey` is a URL query string parameter that’s used as a reference
    for subpages generated by jQuery Mobile widgets, which were covered earlier in
    the book. This URL parameter has a key of `ui-page` by default. However, this
    key can be changed through the `subPageUrlKey` property, which is a property of
    the `$.mobile` object. A string value can be used to update the value of this
    property, which will reflect in widget-generated subpage URLs.


    Creating a custom `subPageUrlKey` not only creates more attractive URLs, but also
    may shorten URLs or set their values to something more specific to the website
    that’s using them.


    For example, if a custom `subPageUrlKey` of `jqmtv-page` used a default URL of:


    web-page.html&ui-page=value


    it would become:


    web-page.html&jqmtv-page=value


    ### Using Active Page and Button Classes


    Webpages that include the jQuery Mobile framework have a default CSS class that’s
    automatically applied to the page element named `ui-page-active`. But you can
    change this default behavior by changing or appending to the default value of
    the active page class. The `$.mobile` object has a property named `activePageClass`
    that can be modified. If this class is replaced with a new value, the default
    CSS included with the framework no longer applies its styling to the `ui-page-active`
    class since it no longer exists. Therefore it’s important to create your own custom
    CSS class that corresponds to the value you provide for this property or append
    an additional class to the `ui-page-active` class:


    [Click here to view code image](#images.html_p184pro01)


    $(document).bind("mobileinit", function() {


        $.extend( $.mobile, {


            activePageClass: "ui-page-active ui-jqmtv-page-active"


        });


    });


    By appending an additional custom class, the existing CSS is left intact and the
    focus shifts to the CSS that’s used for customizations, rather than every minute
    design detail of the framework. A simple CSS file needs to be created and included
    to apply some styles to the new custom CSS class:


    .ui-jqmtv-page-active {


        background: #09C;


        color: #fff;


        text-shadow: none;


    }


    This CSS applies a new background color or text color and removes the text shadowing
    from the webpage when included in the HTML markup. Here’s an example of a simple
    HTML file that includes the CSS and the custom `activePageClass` setting from
    the previous examples:


    [Click here to view code image](#images.html_p185pro01)


    <!DOCTYPE html>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>Active Page Class - jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <link rel="stylesheet" href="assets/css/jqmtv.css" />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="assets/js/custom-jqm-apc.js"></script>


        <link rel="stylesheet" hr<script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


    </head>


    <body>


        <div data-role="page">


            <div data-role="header"><h1>Page Name</h1></div>


            <div data-role="content">


                <p>Body copy</p>


            </div>


            <div data-role="footer">Copyright</div>


        </div>


