  trans: "\n\n![Image](img/jquery-8-8.jpg)\n\n图 8.8。带有列表分隔符的长列表。\n\n### 计数气泡、缩略图和图标\n\
    \n你可以通过计数气泡、缩略图和图标在列表中创建不同的视觉样式。要在列表项中添加计数气泡，只需使用 `ul-li-count` 类。要将计数气泡与列表项文本分开，请使用\
    \ `span` 元素来包含计数气泡的值：\n\n点击此处查看代码图片\n\n```html\n<ul data-role=\"listview\">\n\
    \    <li>\n        <a href=\"#inbox\">收件箱\n            <span class=\"ui-li-count\"\
    >12</span>\n        </a>\n    </li>\n    <li>\n        <a href=\"#outbox\">发送箱\n\
    \            <span class=\"ui-li-count\">0</span>\n        </a>\n    </li>\n \
    \   <li>\n        <a href=\"#sent\">已发送\n            <span class=\"ui-li-count\"\
    >57</span>\n        </a>\n    </li>\n    <li>\n        <a href=\"#trash\">垃圾箱\n\
    \            <span class=\"ui-li-count\">1090</span>\n        </a>\n    </li>\n\
    </ul>\n```\n\n此示例代码的最终结果如 图 8.9 所示。\n\n![Image](img/jquery-8-9.jpg)\n\n图 8.9。带有计数气泡的简单列表。\n\
    \n邮件文件夹是可以使用计数气泡的列表项 Excellent 示例——在这种情况下，用于显示每个区域有多少封邮件——但计数气泡也可用于许多情况。例如，带有条带及其专辑的列表分隔符示例可以转换为嵌套列表，父元素可以显示每个父列表项中有多少专辑/子列表项：\n\
    \n点击此处查看代码图片\n\n```html\n<ul data-role=\"listview\">\n    <li>\n        <h2>The\
    \ Beatles</h2>\n        <span class=\"ui-li-count\">5</span>\n        <ul data-role=\"\
    listview\">\n            <li>Meet The Beatles!</li>\n            <li>A Hard Day's\
    \ Night</li>\n            <li>Help!</li>\n            <li>Rubber Soul</li>\n \
    \           <li>Revolver</li>\n        </ul>\n    </li>\n    <li>\n        <h2>The\
    \ Doors</h2>\n        <span class=\"ui-li-count\">5</span>\n        <ul data-role=\"\
    listview\">\n            <li>The Doors</li>\n            <li>Strange Days</li>\n\
    \            <li>Waiting for the Sun</li>\n            <li>The Soft Parade</li>\n\
    \            <li>Morrison Hotel</li>\n        </ul>\n    </li>\n    <li>\n   \
    \     <h2>The Jimi Experience</h2>\n        <span class=\"ui-li-count\">3</span>\n\
    \        <ul data-role=\"listview\">\n            <li>Are You</li>\n         \
    \   <li>Bold as Love</li>\n            <li>Electricyland</li>\n        </ul>\n\
    \    </li>\n</ul>\n```\n\n此示例的结果如 图 8.10 所示，在同一个列表项中包含计数气泡和嵌套列表。\n\n![Image](img/jquery-8-10.jpg)\n\
    \n图 8.10。带有计数气泡的简单列表。\n\n你可以像向 HTML 页面添加图像一样添加缩略图。只需向列表项添加锚点元素，添加一张作为缩略图的图像，并添加你想显示在图标旁边的标题和文本：\n\
    \n点击此处查看代码图片\n\n```html\n<ul data-role=\"listview\">\n    <li>\n        <a href=\"\
    #led-zeppelin/led-zeppelin-iv\">\n            <img src=\"assets/img/led-zeppelin-IV.png\"\
    >\n            <h3>Led Zeppelin</h3>\n            <p>Led Zeppelin IV</p>\n   \
    \     </a>\n    </li>\n    <li>\n        <a href=\"#led-zeppelin/houses-of-the-holy\"\
    >\n            <img src=\"assets/img/houses-of-the-holy.png\">\n            <h3>Led\
    \ Zeppelin</h3>\n            <p>Houses of the Holy</p>\n        </a>\n    </li>\n\
    </ul>\n```\n\njQuery Mobile 确切知道如何处理此类设置的列表，因为它会将图像转换为 `listview` 中列表项的缩略图。此代码的结果如\
    \ 图 8.11 所示。\n\n![Image](img/jquery-8-11.jpg)\n\n图 8.11。带有列表项缩略图的列表。\n\n图标的添加方式与缩略图相同；不同之处在于图像元素上使用了\
    \ `ui-li-icon` 类：\n\n点击此处查看代码图片\n\n```html\n<ul data-role=\"listview\">\n    <li>\n\
    \        <a href=\"#led-zeppelin/led-zeppelin-iv\">\n            <img src=\"assets/img/led-zeppelin-IV.png\"\
    \ class=\"ui-li-icon\" width=\"16\" height=\"16\">\n            Led Zeppelin IV\n\
    \        </a>\n    </li>\n    <li>\n        <a href=\"#led-zeppelin/houses-of-the-holy\"\
    >\n            <img src=\"assets/img/houses-of-the-holy.png\" class=\"ui-li-icon\"\
    \ width=\"16\" height=\"16\">\n            Houses of the Holy\n        </a>\n\
    \    </li>\n</ul>\n```\n\n![Image](img/note.jpg)\n\n已添加 `width` 和 `height`。\n\n\
    ### 总结\n\n列表对移动设备至关重要。正如你在本章看到的，jQuery 依赖列表。\n\n## 搜索过滤\n\n基础搜索功能是网站的常见功能，但开发非常耗时。幸运的是，jQuery\
    \ Mobile 在用户输入时提供建议。\n\n### 创建过滤栏\n\n正如提到的，该框架为列表添加搜索过滤非常简单：只需为列表添加 `data-filter`\
    \ 属性并将值设置为 `true`。以下示例是一个歌曲列表：\n\n```html\n<ul data-role=\"listview\" data-filter=\"\
    true\">\n    <li>Across The Universe</li>\n    <li>Act Naturally</li>\n    <li>Ain't\
    \ She Sweet</li>\n    <li>All I've Got To Do</li>\n    <li>All My Loving</li>\n\
    \    <li>All Together Now</li>\n    <li>All You Need Is Love</li>\n    <li>And\
    \ I Love Her</li>\n    <li>And Your Bird Can Sing</li>\n    <li>Anna (Go To Him)</li>\n\
    \    <li>Another Girl</li>\n    <li>Any Time At All</li>\n    <li>Ask Me Why</li>\n\
    \    <li>Baby It's You</li>\n    <li>Baby, You're A Rich Man</li>\n    <li>Baby's\
    \ In Black</li>\n    <li>Back In The U.S.R.</li>\n    <li>Bad Boy</li>\n    <li>The\
    \ Ballad Of John And Yoko</li>\n    <li>Because</li>\n    <li>Being For The Benefit\
    \ Of Mr. Kite!</li>\n    <li>Besame Mucho</li>\n    <li>Birthday</li>\n    <li>Blackbird</li>\n\
    </ul>\n```\n\n正如你可以想象的，这个列表非常长；但是 `data-filter` 属性会在列表顶部添加一个搜索过滤栏，帮助用户找到他想要的内容。**图\
    \ 9.1** 显示了用户在过滤字段中输入时视觉上发生的事件示例。随着字母的输入，结果会缩小，只显示与搜索文本匹配的项。\n\n"
- fmt: "\nAs you can see, the framework adds a default value of “Filter items...”\
    \ to the search filter input field. You can change this default text with an additional\
    \ attribute named `data-filter-placeholder`, which can be used on the opening\
    \ unordered or ordered list element. The following example shows code that includes\
    \ this attribute on the previous list of Beatles songs:\n\n[Click here to view\
    \ code image](#images.html_p123pro01)\n\n```html\n<ul data-role=\"listview\" data-filter=\"\
    true\" data-filter-placeholder=\"Search the song list...\">\n    <li>Across The\
    \ Universe</li>\n    <li>Act Naturally</li>\n    <li>Ain't She Sweet</li>\n  \
    \  <li>All I've Got To Do</li>\n    <li>All My Loving</li>\n    <li>All Together\
    \ Now</li>\n    <li>All You Need Is Love</li>\n    <li>And I Love Her</li>\n \
    \   <li>And Your Bird Can Sing</li>\n    <li>Anna (Go To Him)</li>\n    <li>Another\
    \ Girl</li>\n    <li>Any Time At All</li>\n    <li>Ask Me Why</li>\n    <li>Baby\
    \ It's You</li>\n    <li>Baby, You're A Rich Man</li>\n    <li>Baby's In Black</li>\n\
    \    <li>Back In The U.S.S.R.</li>\n    <li>Bad Boy</li>\n    <li>The Ballad Of\
    \ John And Yoko</li>\n    <li>Because</li>\n    <li>Being For The Benefit Of Mr.\
    \ Kite!</li>\n    <li>Besame Mucho</li>\n    <li>Birthday</li>\n    <li>Blackbird</li>\n\
    \    <!-- etc. -->\n</ul>\n```\n\nThe framework lets you change the search filter\
    \ text through the API. To do this, the `listview` component must be accessed\
    \ after `mobileinit` event is triggered. You’ll learn more about the jQuery Mobile\
    \ API later in the book, but for now it’s important to understand that the framework\
    \ must be initialized before the API can be accessed successfully. Once the `listview`\
    \ is accessed, its options can be altered. One such option is the `filterPlaceholder`\
    \ property, which can be used to update the search filter text. The following\
    \ code shows a complete example of how to write the code, including binding to\
    \ the `mobileinit` event:\n\n[Click here to view code image](#images.html_p125pro01)\n\
    \n```javascript\n$(document).bind(\"mobileinit\", function() {\n    $.mobile.listview.prototype.options.filterPlaceholder\
    \ = \"Search the song list...\";\n});\n```\n\nBoth of these options have the same\
    \ visual result, allowing you to define any text you want to appear in the search\
    \ field. [Figure 9.2](#ch09.html_ch09fig02) shows an example of how the search\
    \ filter looks with custom placeholder text.\n\n![Image](graphics/jquery-9-2.jpg)\n\
    \nFigure 9.2. (Left) A basic search filter with custom placeholder text.\n\nAnother\
    \ nice feature of the search filter bar is that you can filter not only a basic\
    \ `listview`, but also a `listview` that includes custom formatting. A search\
    \ filter on a custom formatted list actually searches all the text within each\
    \ list item, whether it’s titles, paragraphs, or something else—you name it, the\
    \ framework will filter it. [Figure 9.3](#ch09.html_ch09fig03) shows an example\
    \ sequence of a custom formatted `listview` with a search filter. The results\
    \ include list items with a combination of matching text from the paragraph copy\
    \ and titles.\n\n![Image](graphics/jquery-9-3.jpg)\n\nFigure 9.3. (Right) A basic\
    \ search filter on a custom-formatted listview.\n\n### Creating Custom Search\
    \ Filters\n\nThe jQuery Mobile framework gives you two options for creating custom\
    \ search filters. The `listview` includes a `filterCallback` option that can be\
    \ extended with a custom callback function. By extending this callback function,\
    \ two arguments—`text` and `searchValue`—become available and can be used to write\
    \ custom search criteria. The `text` argument is the value of the current list\
    \ item, while the `searchValue` is the value of the text that’s typed into the\
    \ search filter. As a user types into the search filter, the `listview` loops\
    \ through the list comparing the list item text and the search value, and filtering\
    \ the results as necessary. [Figure 9.4](#ch09.html_ch09fig04) shows an example\
    \ of a `console.log` as jQuery Mobile compares the search value and each list\
    \ item’s text.\n\n![Image](graphics/jquery-9-4.jpg)\n\nFigure 9.4. The search\
    \ filter as it loops through list items for matching text.\n\nTo customize criteria,\
    \ you can simply set a callback function using the `filterCallback` property:\n\
    \n```javascript\n$.mobile.listview.prototype.options.filterCallback = myCallback;\n\
    ```\n\nOr, you can access a specific `listview` by `id` and set the `filterCallback`\
    \ property for that `listview` only:\n\n```javascript\n$('#my-listview').listview('option',\
    \ myCallback);\n```\n\nLet’s try adding a custom search filter to the Beatles\
    \ list using the `listview` function. First, we’ll add a `pageinit` event to ensure\
    \ that the page has loaded and it’s been enhanced by the framework. To do so we’ll\
    \ need to add an `id` to the page so we can target it. The following example shows\
    \ a page with an `id` that can be targeted. A JavaScript file called `filter.js`\
    \ is the file we’ll use to create the callback:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n    <title>List view - jQuery Mobile: Design and Develop</title>\n    <link\
    \ rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"assets/js/filter.js\"></script>\n    <script src=\"\
    http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.min.js\"></script>\n</head>\n\
    <body>\n    <div data-role=\"page\" id=\"beatles-page\">\n        <div data-role=\"\
    header\">\n            <h1>The Beatles</h1>\n        </div>\n        <div data-role=\"\
    content\">\n            <ul data-role=\"listview\" data-filter=\"true\">\n   \
    \             <li>Across The Universe</li>\n                <li>Act Naturally</li>\n\
    \                <li>Ain't She Sweet</li>\n                <li>All I've Got To\
    \ Do</li>\n                <li>All My Loving</li>\n                <li>All Together\
    \ Now</li>\n                <li>All You Need Is Love</li>\n                <li>And\
    \ I Love Her</li>\n                <li>And Your Bird Can Sing</li>\n         \
    \       <li>Anna (Go To Him)</li>\n                <li>Another Girl</li>\n   \
    \             <li>Any Time At All</li>\n                <li>Ask Me Why</li>\n\
    \                <li>Baby It's You</li>\n                <li>Baby, You're A Rich\
    \ Man</li>\n                <li>Baby's In Black</li>\n                <li>Back\
    \ In The U.S.S.R.</li>\n                <li>Bad Boy</li>\n                <li>The\
    \ Ballad Of John And Yoko</li>\n                <li>Because</li>\n           \
    \     <li>Being For The Benefit Of Mr. Kite!</li>\n                <li>Besame\
    \ Mucho</li>\n                <li>Birthday</li>\n                <li>Blackbird</li>\n\
    \                <!-- etc. -->\n            </ul>\n        </div>\n    </div>\n\
    </body>\n</html>\n```\n\nOnce we have an `id` for the `listview` and have included\
    \ a custom JavaScript file, we can target the `listview` from the JavaScript file.\
    \ First, the document must be ready. Once the document is ready, an event handler\
    \ is created for the `pageinit` method for the `beatles-page` element. When the\
    \ page is initialized, the `listview` code is executed, and the `defaultSearch`\
    \ function is used as the custom callback function:\n\n```javascript\n$(document).ready(function()\
    \ {\n    $('div#beatles-page').on({\n        pageinit: function(event) {\n   \
    \         $('#beatles-listview').listview('option', 'filterCallback', defaultSearch);\n\
    \        }\n    });\n});\n\nfunction defaultSearch( text, searchValue ) {\n  \
    \  console.log(\"Text: \"+ text, \", SearchValue: \"+ searchValue);\n    return\
    \ text.toLowerCase().indexOf( searchValue ) === -1;\n}\n```\n"
