    and the endless possibilities. The options available for structuring a CSS class
    are the same ones you can use to access an HTML element with the jQuery selector.
    This is how jQuery enhances JavaScript and CSS, taking the two and merging their
    syntax into a new language that enhances the overall user experience, when properly
    used, of course.


    #### Managing events and functions


    Events are used by jQuery to react to user interactions on your webpage, such
    as mouse clicks. Events are very easy to manage in jQuery, and they’re reliable
    across all the major browsers, which is a big deal, because this isn’t always
    the case with traditional JavaScript. jQuery gives you the ability to intercept
    many different events from any existing HTML element. Typically, events are used
    to perform some sort of function. In the following example, a `click` event is
    bound to a `div` element with `foo` as the class name:


    [Click here to view code image](#images.html_p008pro01)


    $(''div.foo'').click(function(e) {


        // Your custom code here


    });


    By binding the `click` event to the `div`, a function is associated with clicking
    the mouse on that particular `div`. Therefore, anytime `div.foo` is clicked, your
    custom code in the handler function will be executed.


    If you’re familiar with traditional JavaScript, this syntax probably looks strange.
    Don’t worry—it did to me as well when I first started using it, but once I caught
    on, I liked it. Once you’re familiar with it, you’ll see that this code syntax
    is well contained, easy to understand, and easy to write. Let’s break down the
    previous example:


    **1.** The jQuery selector is used to select `div.foo`, which then becomes a jQuery
    object.


    **2.** The `div.foo` jQuery object then uses the `click` method to fire a handler
    function when `div.foo` is clicked.


    **3.** The handler function is used to execute the custom code. The handler also
    has access to the `eventObject`, which is passed as an argument. In this example,
    it is the `e` argument in the handler function.


    If you use the jQuery selector to select a class name that’s being used by multiple
    HTML elements and assign a mouse event, that mouse event will be bound to all
    of those elements automatically. Therefore, in the example above, if you had multiple
    `div` elements with `foo` as the class name, the `click` event would be bound
    to all of them. When working with events that are bound to multiple elements,
    it’s important to consider scope to ensure that any custom code you’re executing
    is applied to the desired element.


    [Click here to view code image](#images.html_p009pro01)


    $(''div.foo'').click(function(e) {


        alert($(this).html());


    });


    In this example, `$(this)` is used to access the current element in scope.


    * * *


    ![Image](graphics/note.jpg) Note


    Scope is the enclosing context that values are associated with. In this case,
    the function is the enclosing context and `$(this)` is the value.


    * * *'
