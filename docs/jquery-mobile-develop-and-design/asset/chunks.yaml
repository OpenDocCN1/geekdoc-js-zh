    footer\">Copyright</div>\n    </div>\n</body>\n</html>\n```\n\n这种方法并不被推荐，因为这种结构的文件通常会变得难以管理，且文件体积大得多，最终导致加载时间更长。对于演示或原型设计，这可能是一个选项，但强烈建议你将移动网站或应用程序构建为独立的\
    \ HTML 文件。\n\n当使用独立的 HTML 文件构建网页时，`page` `data-role` 被用作容器，框架会将其他网页加载到容器中。例如，假设你有两个独立的\
    \ HTML 文件，`page-1.html` 和 `page-2.html`。然后你向两个文件中都添加 `page` `data-role` 属性，并将\
    \ `page-1.html` 超链接链到 `page-2.html`：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE HTML>\n\
    <html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n    <title>Page 1 - jQuery Mobile: Design and Develop</title>\n    <link rel=\"\
    stylesheet\" href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/ jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
    ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\">\n            <h1>Page 1</h1>\n        </div>\n        <div data-role=\"\
    content\">\n            <a href=\"page-2.html\">Link to page 2</a>\n        </div>\n\
    \        <div data-role=\"footer\">\n            Copyright\n        </div>\n \
    \   </div>\n</body>\n</html>\n```\n\n在包含 jQuery Mobile 框架后，`page-1.html` 的 `page`\
    \ `data-role` 将自动成为容器，通过 `XMLHttpRequest` 加载 `page-2.html` 中 `page` `data-role`\
    \ 内的标记。`XMLHttpRequest` 是 Ajax 用于与服务器交换数据而无需刷新网页的方法；它就像是通往后端的门户。图 3.2 显示了当 `page-1.html`\
    \ 链接 `page-2.html` 时产生的 `XMLHttpRequest` 示例。该请求使用 Chrome 开发者工具记录。在此例中，使用 Chrome\
    \ 开发者工具是为了查看点击指向 `page-2.html` 的链接是由 jQuery Mobile 发起的 `XMLHttpRequest`。Chrome\
    \ 开发者工具是测试和调试代码的极佳方法。\n\n![Image](img/jquery-3-2.jpg)\n图 3.2. jQuery Mobile 使用\
    \ `XMLHttpRequest` 加载后续页面。\n\n![Image](img/note.jpg)\n注意 Chrome 开发者工具是 Chrome\
    \ 浏览器内置的集成 Web 开发环境。HTML 页面本身被请求，jQuery Mobile 使用其内容来显示新页面。关于这个简单的请求有很多值得学习的地方，我们将在后续章节中进行详细介绍。\n\
    \n### 总结\n\n（由于输入文本截断且重复，此处翻译至有效逻辑结束）\n"
- fmt: "\n```html\n<a href=\"#page-one\">Link to page 1</a>\n</div>\n<div data-role=\"\
    footer\">\n    Copyright\n</div>\n</div>\n</body>\n</html>\n```\n\nWithin this\
    \ multipage template are two pages defined by `div` elements with custom `id`s.\
    \ The jQuery Mobile framework shows only one of these pages at a time, and it\
    \ uses the `data-title` attribute to change the page title dynamically. The page\
    \ that is shown by default is determined by the order of the source code. In this\
    \ example, the first page has an `id` of `page-one`, but if the pages in this\
    \ file were switched, so that the element with an `id` of `page-two` came first,\
    \ then that would be the default page to load. In other words, the value of the\
    \ `id` attribute doesn’t determine what page is shown by default; the default\
    \ page is determined only by the source code order. However, the `id` is used\
    \ for other important purposes, such as linking pages to one another.\n\nThis\
    \ is where jQuery Mobile pages begin to act like separate webpages. Note that\
    \ hyperlinks have been added to the original template to link from one page to\
    \ another. This is somewhat like the toggle functionality that’s common in JavaScript\
    \ development, where `id` values are used to hide and reveal certain HTML elements.\
    \ The difference here is that jQuery Mobile handles the functionality for you.\
    \ To link from one page to another you simply need to:\n\n1. Create a hyperlink.\n\
    2. Type the pound sign (`#`).\n3. Specify the `id` value of the page you want\
    \ to link to.\n\nThe end result looks like this:\n\n[Click here to view code image](#images.html_p044pro01)\n\
    \n<a href=\"#page-two\">Link to page 2</a>\n\nIt’s similar to creating a page\
    \ anchor; the difference is that you’re referencing the `id` value of another\
    \ page. Remember that each page needs a unique `id` value. In this case, I’ve\
    \ used `page-one` and `page-two`, but you can use something more descriptive and\
    \ relative to the content of your jQuery Mobile page. The cool thing about the\
    \ jQuery Mobile framework is that it transitions dynamically from one page to\
    \ another without requiring you to write an ounce of code. **[Figure 4.1](#ch04.html_ch04fig01)**\
    \ shows an example of this code in both page views and the transition from one\
    \ to another.\n\n![Image](graphics/jquery-4-1.jpg)\n\nFigure 4.1. A multipage\
    \ template with two pages and the transition in between.\n\n### Single-Page Template\n\
    \nSingle-page templates are separate HTML files that act as independent webpages,\
    \ just like any standard webpage. The main difference is in how jQuery Mobile\
    \ connects webpages using Ajax. As with multipage templates, the Ajax-based navigation\
    \ in single-page templates uses hashtags to create a page history. The Ajax-based\
    \ navigation used by jQuery Mobile is the default, but it can be turned off by\
    \ setting the `ajaxEnabled` setting to `false` in the configuration. You’ll learn\
    \ more about the configuration settings later in this book.\n\nAjah is an abbreviation\
    \ that is sometimes used for Asynchronous JavaScript and HTML. Ajah is essentially\
    \ Ajax without the XML; the `XMLHttpRequest` is still used, but HTML is exchanged\
    \ with the server rather than XML. This is what jQuery Mobile uses as the user\
    \ browses independent webpages. We briefly covered how the jQuery Mobile framework\
    \ uses the `XMLHttpRequest` to load subsequent pages in the previous chapter,\
    \ but there’s a lot to learn and understand about this simple request.\n\nOne\
    \ great thing about the jQuery Mobile framework is how it tracks history: it supports\
    \ the back and forward buttons! Also, while subsequent pages load, the framework\
    \ provides a default loading message and transitions between pages. The default\
    \ page transition is to slide between two pages, and the default loading message\
    \ is a spinning icon with a “loading...” message. Both options are configurable,\
    \ as you’ll learn in the next chapter. For now, let’s see how hashtags and history\
    \ work in jQuery Mobile.\n\n### Hashtags and history\n\njQuery Mobile uses hashtags\
    \ to manage history in single- and multipage templates. The `window` object’s\
    \ `location.hash` is used to make changes and updates to the history, so the back\
    \ and forward buttons function as usual, which is uncommon in other Ajax-based\
    \ systems. Essentially, jQuery Mobile prevents the default functionality of all\
    \ hyperlinks and uses the hashtag functionality to handle history. Not only is\
    \ the history updated, the hashtag system also creates a valid URL that can be\
    \ bookmarked for later reference.\n\nThe only issue with jQuery Mobile’s hashtag-based\
    \ navigation is that it doesn’t support deep linking. However, there are some\
    \ workarounds you can use to support this functionality. With a little help from\
    \ jQuery, you can add a script, like the following, to your webpage and your deep\
    \ links will function as usual:\n\n[Click here to view code image](#images.html_p046pro01)\n\
    \n```javascript\n$(document).ready(function() {\n    $('a[href^=\"#\"]').bind('click\
    \ vclick', function () {\n        location.hash = $(this).attr('href');\n    });\n\
    });\n```\n\nIn HTML, all hyperlinks that include a pound sign (`#`) as their first\
    \ character are identified as anchors. This script uses a regular expression to\
    \ identify them. The callback function sets the `window` object’s `location.hash`\
    \ to the value of the anchor and returns `false`.\n\n![Image](graphics/note.jpg)\
    \ Notes\n\nThe caret (`^`) symbol is often used in regular expressions to designate\
    \ the beginning of a string.\n\nThe `vclick` event is an option used in jQuery\
    \ Mobile by devices that support touch events. It supports faster page changes\
    \ and during page transitions it keeps the address bar hidden.\n\nHyperlinking\
    \ from single-page to multipage templates with Ajax enabled will load only the\
    \ first page in the source code. To link to a multipage template from a single-page\
    \ template, you must use `rel=\"external\"` or `data-ajax=\"false\"`.\n\n### Link\
    \ Types\n\njQuery Mobile supports standard HTML link types as well as a number\
    \ of custom link types related to the mobile experience. The following tables\
    \ offer a list of the link types available through the jQuery Mobile framework.\
    \ Each table shows options categorized on their end result and/or support of Ajax.\
    \ **[Table 4.1](#ch04.html_ch04tab01)** describes links that support Ajax.\n\n\
    Table 4.1. Link types that support Ajax\n\n![Image](graphics/04tab01.jpg)\n\n\
    ### Graded Support\n\nAs mentioned in the book’s introduction, jQuery Mobile uses\
    \ a three-tier graded list of platforms that are supported by the framework: A,\
    \ B, and C. A includes a full experience with the option of Ajax-based page transitions;\
    \ B includes the same experience minus the Ajax-based page transitions; and C\
    \ is a basic yet functional HTML experience.\n\nA-grade support includes all the\
    \ major mobile operating systems mentioned previously and others, including Apple\
    \ iOS, Android, Windows Phone, BlackBerry, Palm WebOS, Kindle 3, and Kindle Fire.\
    \ B-grade support includes BlackBerry 5, Opera Mini, and Nokia Symbian. C-grade\
    \ support includes BlackBerry 4, Windows Mobile, and all older smart-phones and\
    \ feature phones. Visit [jquerymobile.com](http://jquerymobile.com) to see an\
    \ up-to-date list of supported platforms.\n\n**[Table 4.2](#ch04.html_ch04tab02)**\
    \ describes a list of hyperlinks that disable the Ajax page-transition functionality.\
    \ These hyperlinks are great for pages on an external domain, pages that open\
    \ in a new window, linking from single to multipage templates, or linking to pages\
    \ where you don’t want to use Ajax.\n"
  raw: '            <a href="#page-one">Link to page 1</a>


            </div>


            <div data-role="footer">


                Copyright


            </div>


        </div>


    </body>


    </html>


    Within this multipage template are two pages defined by `div` elements with custom
    `id`s. The jQuery Mobile framework shows only one of these pages at a time, and
    it uses the `data-title` attribute to change the page title dynamically. The page
    that is shown by default is determined by the order of the source code. In this
    example, the first page has an `id` of `page-one`, but if the pages in this file
    were switched, so that the element with an `id` of `page-two` came first, then
    that would be the default page to load. In other words, the value of the `id`
    attribute doesn’t determine what page is shown by default; the default page is
    determined only by the source code order. However, the `id` is used for other
    important purposes, such as linking pages to one another.


    This is where jQuery Mobile pages begin to act like separate webpages. Note that
    hyperlinks have been added to the original template to link from one page to another.
    This is somewhat like the toggle functionality that’s common in JavaScript development,
    where `id` values are used to hide and reveal certain HTML elements. The difference
    here is that jQuery Mobile handles the functionality for you. To link from one
    page to another you simply need to:


    **1.** Create a hyperlink.


    **2.** Type the pound sign (#).


    **3.** Specify the id value of the page you want to link to.


    The end result looks like this:


    [Click here to view code image](#images.html_p044pro01)


    <a href="#page-two">Link to page 2</a>


    It’s similar to creating a page anchor; the difference is that you’re referencing
    the `id` value of another page. Remember that each page needs a unique `id` value.
    In this case, I’ve used `page-one` and `page-two`, but you can use something more
    descriptive and relative to the content of your jQuery Mobile page. The cool thing
    about the jQuery Mobile framework is that it transitions dynamically from one
    page to another without requiring you to write an ounce of code. **[Figure 4.1](#ch04.html_ch04fig01)**
    shows an example of this code in both page views and the transition from one to
    another.


    ![Image](graphics/jquery-4-1.jpg)


    Figure 4.1\. A multipage template with two pages and the transition in between.


    ### Single-Page Template


    Single-page templates are separate HTML files that act as independent webpages,
    just like any standard webpage. The main difference is in how jQuery Mobile connects
    webpages using Ajax. As with multipage templates, the Ajax-based navigation in
    single-page templates uses hashtags to create a page history. The Ajax-based navigation
    used by jQuery Mobile is the default, but it can be turned off by setting the
    `ajaxEnabled` setting to `false` in the configuration. You’ll learn more about
    the configuration settings later in this book.


    Ajah is an abbreviation that is sometimes used for Asynchronous JavaScript and
    HTML. Ajah is essentially Ajax without the XML; the XMLHttpRequest is still used,
    but HTML is exchanged with the server rather than XML. This is what jQuery Mobile
    uses as the user browses independent webpages. We briefly covered how the jQuery
    Mobile framework uses the XMLHttpRequest to load subsequent pages in the previous
    chapter, but there’s a lot to learn and understand about this simple request.


    One great thing about the jQuery Mobile framework is how it tracks history: it
    supports the back and forward buttons! Also, while subsequent pages load, the
    framework provides a default loading message and transitions between pages. The
    default page transition is to slide between two pages, and the default loading
    message is a spinning icon with a “loading...” message. Both options are configurable,
    as you’ll learn in the next chapter. For now, let’s see how hashtags and history
    work in jQuery Mobile.


    #### Hashtags and history


    jQuery Mobile uses hashtags to manage history in single- and multipage templates.
    The window object’s `location.hash` is used to make changes and updates to the
    history, so the back and forward buttons function as usual, which is uncommon
    in other Ajax-based systems. Essentially, jQuery Mobile prevents the default functionality
    of all hyperlinks and uses the hashtag functionality to handle history. Not only
    is the history updated, the hashtag system also creates a valid URL that can be
    bookmarked for later reference.


    The only issue with jQuery Mobile’s hashtag-based navigation is that it doesn’t
    support deep linking. However, there are some workarounds you can use to support
    this functionality. With a little help from jQuery, you can add a script, like
    the following, to your webpage and your deep links will function as usual:


    [Click here to view code image](#images.html_p046pro01)


    $(document).ready(function() {


        $(''a[href^="#"]'').bind(''click vclick'', function () {


            location.hash = $(this).attr(''href'');


            return false;


        });


    });


    In HTML, all hyperlinks that include a pound sign (`#`) as their first character
    are identified as anchors. This script uses a regular expression that includes
    the caret symbol to identify all anchor elements that have an `href` attribute
    with a value that begins with the pound sign. Once these elements have been selected,
    you can use the `bind` method to bind a `click` and `vclick` event to the anchor
    tags and assign an anonymous function handler as the callback.


    The callback function sets the window object’s `location.hash` to the value of
    the anchor and returns `false` to prevent the browser from performing the default
    action associated with clicking the hyperlink.


    * * *


    ![Image](graphics/note.jpg) Notes


    The caret (`^`) symbol is often used in regular expressions to designate the beginning
    of a string.


    The `vclick` event is an option used in jQuery Mobile by devices that support
    touch events. The event supports faster page changes and during page transitions
    it keeps the address bar hidden.


    Hyperlinking from single-page to multipage templates with Ajax enabled will load
    only the first page in the source code of the multipage template. To link to a
    multipage template from a single-page template, you must use an external hyperlink
    by using `rel="external"` or `data-ajax="false"`.


    * * *


    ### Link Types


    jQuery Mobile supports standard HTML link types as well as a number of custom
    link types related to the mobile experience. The following tables offer a list
    of the supported link types available through the jQuery Mobile framework. Each
    table shows options categorized based on their end result and/or support of Ajax.
    **[Table 4.1](#ch04.html_ch04tab01)** describes links that support Ajax.


    Table 4.1\. Link types that support Ajax


    ![Image](graphics/04tab01.jpg)


    * * *


    Graded Support


    As mentioned in the book’s introduction, jQuery Mobile uses a three-tier graded
    list of platforms that are supported by the framework: A, B, and C. A includes
    a full experience with the option of Ajax-based page transitions; B includes the
    same experience minus the Ajax-based page transitions; and C is a basic yet functional
    HTML experience.


    A-grade support includes all the major mobile operating systems mentioned previously
    and others, including Apple iOS, Android, Windows Phone, BlackBerry, Palm WebOS,
    Kindle 3, and Kindle Fire. B-grade support includes BlackBerry 5, Opera Mini,
    and Nokia Symbian. C-grade support includes BlackBerry 4, Windows Mobile, and
    all older smart-phones and feature phones. Visit [jquerymobile.com](http://jquerymobile.com)
    to see an up-to-date list of supported platforms.


    * * *


    **[Table 4.2](#ch04.html_ch04tab02)** describes a list of hyperlinks that disable
    the Ajax page-transition functionality. These hyperlinks are great for pages on
    an external domain, pages that open in a new window, linking from single to multipage
    templates, or linking to pages where you don’t want to use Ajax.'
