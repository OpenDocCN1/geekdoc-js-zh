  trans: "\n对话框（Dialog windows）可以像多页模板一样包含在单个 HTML 文件的一个或多个页面中，也可以像单页模板一样是外部网页。要创建一个包含对话框窗口的多页模板，你只需要添加另一个\
    \ jQuery Mobile 页面——区别在于你链接到它的方式。换句话说，任何页面都可以是对话框；它之所以成为对话框，取决于它的打开方式。以下示例显示了一个带有\
    \ `data-rel` 属性的超链接，它可以在对话框窗口中打开页面：\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n    <title>Dialog - jQuery Mobile: Design and Develop</title>\n    <link rel=\"\
    stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\"><h1>Dialog Test</h1></div>\n        <div data-role=\"content\">\n   \
    \         <p><a href=\"#multipage-dialog\" data-rel=\"dialog\">Open Multi-page\
    \ Dialog</a></p>\n        </div>\n        <div data-role=\"footer\">Copyright</div>\n\
    \    </div>\n    <div data-role=\"page\" id=\"multipage-dialog\">\n        <div\
    \ data-role=\"header\"><h1>Multi-page dialog window</h1></div>\n        <div data-role=\"\
    content\">\n            <p><a href=\"dialog.html\" data-rel=\"back\">OK</a></p>\n\
    \        </div>\n    </div>\n</body>\n</html>\n```\n\n在例示例中，页有两个页面：第一个页面是默认显示的。在这个默认页面内，有一个带有\
    \ `data-rel=\"dialog\"` 属性并指向锚点的超链接。链接到的锚点是第二个页面的 ID。第二个页面的设置方式与任何 jQuery Mobile\
    \ 页面一样：由于其链接方式，它是作为对话框打开的。图 5.1 显示了这段代码的结果。\n\n![图像](img/05fig01.jpg)\n\n图 5.1。多页对话框窗口。\n\
    \n如所述，对话框窗口也可以通过带有 `data-rel=\"dialog\"` 属性和值的超链接链接到外部网页。接下来的示例与上一个非常相似，主要区别是超链接现在指向了一个名为\
    \ `dialog-window.html` 的外部 HTML 文件：\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n    <title>Dialog - jQuery Mobile: Design and Develop</title>\n    <link rel=\"\
    stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\"><h1>Dialog Test</h1></div>\n        <div data-role=\"content\">\n   \
    \         <p><a href=\"dialog-window.html\" data-rel=\"dialog\">Open Dialog</a></p>\n\
    \        </div>\n        <div data-role=\"footer\">Copyright</div>\n    </div>\n\
    </body>\n</html>\n```\n\n被链接的 HTML 文件可以像任何 jQuery Mobile 一样设置：\n\n点击此处查看代码图像\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <title>Dialog - jQuery Mobile: Design\
    \ and Develop</title>\n</head>\n<body>\n    <div data-role=\"page\">\n       \
    \ <div data-role=\"header\"><h1>Single-page window</h1></div>\n        <div data-role=\"\
    content\">\n            <p><a href=\"#\" data-rel=\"back\">OK</a></p>\n      \
    \  </div>\n    </div>\n</body>\n</html>\n```\n\n这段代码的结果如图 5.2 所示。\n\n![图像](img/05fig02.jpg)\n\
    \n图 5.2。单页窗口。\n\n对话框窗口也可以通过带有 `data-rel=\"dialog\"` 属性和值的超链接链接到外部网页。对话框可以通过带有\
    \ `data-rel=\"dialog\"` 属性的链接，在下面的示例中，它在对话框窗口中打开了：\n\n点击此处查看代码图像\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n    <title>Dialog - jQuery Mobile: Design and Develop</title>\n\
    \    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n    <style type=\"text/css\">\n        .ui-dialog .ui-header,\n  \
    \      .ui-dialog .ui-content,\n        .ui-dialog .ui-footer {\n            max-width:\
    \ 640px;\n        }\n    </style>\n</head>\n<body>\n    <div data-role=\"page\"\
    >\n        <div data-role=\"header\"><h1>Dialog Test</h1></div>\n        <div\
    \ data-role=\"content\">\n            <p>President Obama's Inaugural Address</p>\n\
    \            <p><a href=\"dialog.html\" data-rel=\"dialog\">Play now &gt;</a></p>\n\
    \        </div>\n        <div data-role=\"footer\">Copyright</div>\n    </div>\n\
    </body>\n</html>\n```\n\n对话框具有预定义的宽度，但可以通过 `.ui-dialog` 类进行覆盖。被加载的 HTML 文件包含了奥马总统就职演视频。由于移动设备的宽度可能比\
    \ 640 像素小得多，弹出窗口中的 iframe 宽度被设置为 100%。\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n    <title>Pop-up - jQuery Mobile: Design and Develop</title>\n</head>\n<body>\n\
    \    <div data-role=\"page\">\n        <div data-role=\"header\"><h1>President\
    \ Obama's Inaugural Address</h1></div>\n        <div data-role=\"content\">\n\
    \            <iframe width=\"100%\" height=\"360\" src=\"http://www.youtube.com/embed/3PuHGKnNY\"\
    \ frameborder=\"0\" allowfullscreen></iframe>\n        </div>\n    </div>\n</body>\n\
    </html>\n```\n\n默认情况下，对话框（或弹出窗口）包含一个关闭按钮，因此你不需要为对话框窗口添加任何其他超链接或功能。图 5.3 显示了奥马总统就职视频弹出窗口的示例。\n\
    \n对话框包含过渡效果。默认过渡是 `pop`，但此过渡可以更改为 `flip` 或 `slidedown`。要更改过渡，请在包含 `data-rel=\"\
    dialog\"` 设置的超链接上添加 `data-transition` 属性。如果在上一个示例中添加 `slidedown` `data-transition`，代码如下：\n\
    \n```html\n<a href=\"popup-window.html\" data-rel=\"dialog\" data-transition=\"\
    slidedown\">Play now &gt;</a>\n```\n"
- fmt: "\njQuery Mobile provides a way to create buttons with HTML anchor and input\
    \ elements. Buttons offer a more usable alternative to standard hyperlinks and\
    \ inputs by creating a larger clickable area. To convert a hyperlink into a button,\
    \ set the `data-role` attribute to `button` ([Figure 5.4](#ch05.html_ch05fig04)):\n\
    \n[Click here to view code image](#images.html_p069pro01)\n\n```html\n<a href=\"\
    #\" data-role=\"button\">Hyperlink button</a>\n```\n\n![Image](graphics/05fig04.jpg)\n\
    \nFigure 5.4. A hyperlink element that has a data-role of button.\n\nBy default,\
    \ buttons are the full width of the containing element, but you can set them to\
    \ inline by using the `data-inline` attribute. This attribute, when set to `true`,\
    \ creates a button whose width is determined by the text in the hyperlink ([Figure\
    \ 5.5](#ch05.html_ch05fig05)):\n\n[Click here to view code image](#images.html_p069pro02)\n\
    \n```html\n<a href=\"#\" data-role=\"button\" data-inline=\"true\">Hyperlink button</a>\n\
    ```\n\n![Image](graphics/05fig05.jpg)\n\nFigure 5.5. A hyperlink element that\
    \ has a data-inline set to true.\n\nButtons can be enhanced by a number of additional\
    \ `data-` attributes. [Table 5.1](#ch05.html_ch05tab01) lists all the possible\
    \ button `data-` attributes and their values.\n\nTable 5.1. Button data- attributes\n\
    \n![Image](graphics/05tab01.jpg)\n\nInput buttons differ from hyperlinks in that\
    \ they all default to a button. The following Submit button defaults to a jQuery\
    \ Mobile button:\n\n[Click here to view code image](#images.html_p070pro01)\n\n\
    ```html\n<input type=\"submit\" value=\"Submit button\">\n```\n\nThere’s nothing\
    \ special about this input element. [Figure 5.6](#ch05.html_ch05fig06) shows an\
    \ example of what this input button looks like when enhanced with jQuery Mobile.\n\
    \n![Image](graphics/05fig06.jpg)\n\nFigure 5.6. A Submit button that has a data-role\
    \ equal to button.\n\nMany types of input elements are auto-enhanced by jQuery\
    \ Mobile as buttons. These include input elements with a type attribute set to\
    \ either `button`, `submit`, `reset`, or `image`, all of which look the same by\
    \ default. The only way to change this default enhancement is to set the `data-role`\
    \ to a value of `none`.\n\nButtons can include an icon using the `data-icon` attribute.\
    \ The number of default icons is pretty impressive, and the icons are extremely\
    \ easy to use. [Table 5.2](#ch05.html_ch05tab02) shows an example of each of the\
    \ icons that you can add to jQuery Mobile buttons by using the `data-icon` attribute.\n\
    \nTable 5.2. Button icons\n\n![Image](graphics/05tab02.jpg)\n\nButton icons can\
    \ be positioned in a number of different locations. To do this, use the `data-iconpos`\
    \ attribute and set it to one of the following values:\n\n- `left` (`left` is\
    \ the default)\n- `right`\n- `top`\n- `bottom`\n- `notext` (As seen in [Figure\
    \ 5.7](#ch05.html_ch05fig07), this value uses only the icon, hiding the text within\
    \ the hyperlink or input value.)\n\n![Image](graphics/05fig07.jpg)\n\nFigure 5.7.\
    \ An example of a button using the notext data-iconpos with a home data-icon.\n\
    \nCustom icons can also be used via CSS. To create a custom icon, you first need\
    \ to choose a name value. For the purposes of this demo we’ll use `checkmark`.\
    \ Using this value in the `data-icon` attribute for a hyperlink or input that\
    \ uses the button plug-in generates a CSS class. The CSS class includes `ui-icon-`\
    \ before the custom value, so the CSS class for the custom value we defined is\
    \ `ui-icon-checkmark`. With this class in place, you can easily target the class\
    \ and add a background image as the icon:\n\n[Click here to view code image](#images.html_p072pro01)\n\
    \n```css\n.ui-icon-checkmark {\n    background-image: url(\"5-custom-icon.png\"\
    );\n}\n```\n\nWhen designing the icon, you’ll want to create an 18 × 18 pixel\
    \ PNG-8 with alpha transparency to match the built-in jQuery Mobile icons. [Figure\
    \ 5.8](#ch05.html_ch05fig08) shows an example of the custom icon.\n\n![Image](graphics/05fig08.jpg)\n\
    \nFigure 5.8. A custom checkmark icon.\n\nNow that we have created this icon and\
    \ a CSS class associated with it, we can assign the icon to a button. To assign\
    \ our new icon to a button, we simply use the `data-icon` attribute and set it\
    \ to `checkmark`:\n\n[Click here to view code image](#images.html_p073pro01)\n\
    \n```html\n<a href=\"#checkmark\" data-role=\"button\" data-icon=\"checkmark\"\
    >Checkmark example</a>\n```\n\nThe final result of this code looks similar to\
    \ [Figure 5.9](#ch05.html_ch05fig09).\n\n![Image](graphics/05fig09.jpg)\n\nFigure\
    \ 5.9. A custom checkmark icon.\n\n### Wrapping Up\n\nThe items in this chapter\
    \ are the foundation of any mobile website.\n"
  raw: 'jQuery Mobile provides a way to create buttons with HTML anchor and input
    elements. Buttons offer a more usable alternative to standard hyperlinks and inputs
    by creating a larger clickable area. To convert a hyperlink into a button, set
    the `data-role` attribute to `button` (**[Figure 5.4](#ch05.html_ch05fig04)**):


    [Click here to view code image](#images.html_p069pro01)


    <a href="#" data-role="button">Hyperlink button</a>


    ![Image](graphics/05fig04.jpg)


    Figure 5.4\. A hyperlink element that has a data-role of button.


    By default, buttons are the full width of the containing element, but you can
    set them to inline by using the `data-inline` attribute. This attribute, when
    set to `true`, creates a button whose width is determined by the text in the hyperlink
    (**[Figure 5.5](#ch05.html_ch05fig05)**):


    [Click here to view code image](#images.html_p069pro02)


    <a href="#" data-role="button" data-inline="true">Hyperlink button</a>


    ![Image](graphics/05fig05.jpg)


    Figure 5.5\. A hyperlink element that has a data-inline set to true.


    Buttons can be enhanced by a number of additional `data-` attributes. **[Table
    5.1](#ch05.html_ch05tab01)** lists all the possible button `data-` attributes
    and their values.


    Table 5.1\. Button data- attributes


    ![Image](graphics/05tab01.jpg)


    Input buttons differ from hyperlinks in that they all default to a button. The
    following Submit button defaults to a jQuery Mobile button:


    [Click here to view code image](#images.html_p070pro01)


    <input type="submit" value="Submit button">


    There’s nothing special about this input element. **[Figure 5.6](#ch05.html_ch05fig06)**
    shows an example of what this input button looks like when enhanced with jQuery
    Mobile.


    ![Image](graphics/05fig06.jpg)


    Figure 5.6\. A Submit button that has a data-role equal to button.


    Many types of input elements are auto-enhanced by jQuery Mobile as buttons. These
    include input elements with a type attribute set to either `button`, `submit`,
    `reset,` or `image`, all of which look the same by default. The only way to change
    this default enhancement is to set the `data-role` to a value of `none`.


    Buttons can include an icon using the `data-icon` attribute. The number of default
    icons is pretty impressive, and the icons are extremely easy to use. **[Table
    5.2](#ch05.html_ch05tab02)** shows an example of each of the icons that you can
    add to jQuery Mobile buttons by using the `data-icon` attribute.


    Table 5.2\. Button icons


    ![Image](graphics/05tab02.jpg)


    Button icons can be positioned in a number of different locations. To do this,
    use the `data-iconpos` attribute and set it to one of the following values:


    • `left` (`left` is the default)


    • `right`


    • `top`


    • `bottom`


    • `notext` (As seen in **[Figure 5.7](#ch05.html_ch05fig07)**, this value uses
    only the icon, hiding the text within the hyperlink or input value.)


    ![Image](graphics/05fig07.jpg)


    Figure 5.7\. An example of a button using the notext data-iconpos with a home
    data-icon.


    Custom icons can also be used via CSS. To create a custom icon, you first need
    to choose a name value. For the purposes of this demo we’ll use `checkmark`. Using
    this value in the `data-icon` attribute for a hyperlink or input that uses the
    button plug-in generates a CSS class. The CSS class includes ui-`icon-` before
    the custom value, so the CSS class for the custom value we defined is `ui-icon-checkmark`.
    With this class in place, you can easily target the class and add a background
    image as the icon:


    [Click here to view code image](#images.html_p072pro01)


    .ui-icon-checkmark {


        background-image: url("5-custom-icon.png");


    }


    When designing the icon, you’ll want to create an 18 × 18 pixel PNG-8 with alpha
    transparency to match the built-in jQuery Mobile icons. **[Figure 5.8](#ch05.html_ch05fig08)**
    shows an example of the custom icon.


    ![Image](graphics/05fig08.jpg)


    Figure 5.8\. A custom checkmark icon.


    Now that we have created this icon and a CSS class associated with it, we can
    assign the icon to a button. To assign our new icon to a button, we simply use
    the `data-icon` attribute and set it to `checkmark`:


    [Click here to view code image](#images.html_p073pro01)


    <a href="#checkmark" data-role="button" data-icon="checkmark">Checkmark example</a>


    The final result of this code looks similar to **[Figure 5.9](#ch05.html_ch05fig09)**.


    ![Image](graphics/05fig09.jpg)


    Figure 5.9\. A custom checkmark icon when used as a button icon.


    ### Wrapping Up


    The items in this chapter are the foundation of any mobile website or application.
    Having the ability to provide feedback or ask for feedback from a user through
    a dialog window is essential. Launching content in modal windows is the norm these
    days, eliminating annoying pop-up windows. And buttons provide a way to enhance
    any hyperlink or input button into a clickable, user-friendly solution.


    ## 6\. Working with Toolbars


    The jQuery Mobile framework offers toolbar widgets that let you easily define
    headers and footers. As with other widgets, toolbars are defined by `data-` attributes
    with normal HTML markup and enhanced by the framework when the webpage renders.
    Toolbars can contain navigation buttons and be set in fixed positions at the top
    or bottom of your mobile webpages. This chapter covers all the toolbar possibilities
    and offers examples of each.


    ### Toolbars


    jQuery Mobile offers two types of toolbars: headers and footers. This section
    covers both.


    #### Header toolbars


    Header toolbars are the perfect way to provide a page title, navigation, or other
    common calls to action, such as Save or Cancel buttons, in a web application.
    Header toolbars are typically the first element in a mobile webpage. If a page
    title is used in a header toolbar, any of the HTML heading-level elements can
    be used to contain the title. Without a heading element, page titles contain no
    margin and are not center-aligned as they are with heading elements; rather, they
    look like the toolbar in **[Figure 6.1](#ch06.html_ch06fig01)**.


    ![Image](graphics/jquery-6-1.jpg)


    Figure 6.1\. A header toolbar without a page title.


    A heading element yields a result that looks much nicer than [Figure 6.1](#ch06.html_ch06fig01).
    Heading elements also allow for semantic webpages and flexibility in how elements
    are used. The header element code we’ve been using thus far looks like the following
    example:


    <div data-role="header">


        <h1>My Page Title</h1>


    </div>


    As you can see, the header is defined by a simple `data-role` attribute that has
    a value of header. In this example, an `h1` element has been added to define the
    page title. Using this `h1` element produces the results shown in **[Figure 6.2](#ch06.html_ch06fig02)**.


    ![Image](graphics/jquery-6-2.jpg)


    Figure 6.2\. A header toolbar with a page title.


    When jQuery Mobile enhances the HTML, the header toolbar code looks dramatically
    different. As shown in **[Figure 6.3](#ch06.html_ch06fig03)**, viewing the HTML
    markup with Chrome’s Developer Tools reveals the many extra attributes added after
    the framework has made its enhancements.


    ![Image](graphics/jquery-6-3.jpg)


    Figure 6.3\. Header markup after jQuery Mobile enhancements.


    The Cascading Style Sheet (CSS) classes are added to the `div` element, which
    sets the positioning to relative, adds a border, sets the font color, and more.
    Here’s a closer look at the enhancements that the framework makes to the actual
    HTML markup:


    [Click here to view code image](#images.html_p077pro01)


    <div data-role="header" class="ui-header ui-bar-a" role="banner">


        <h1 class="ui-title" tabindex="0" role="heading" aria-level="1">My Page Title</h1>


    </div>'
