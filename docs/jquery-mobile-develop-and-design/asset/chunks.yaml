    \ image](#images.html_p179pro01)\n\n```css\n.ui-mobile [data-jquerymobiletv-role=\"\
    page\"] {\n    /* Custom CSS here */\n}\n```\n\nWith the introduction of `data-`\
    \ attributes, developers have much more control over the data that is added to\
    \ a webpage. Custom attributes provide a means for supporting semantic HTML, while\
    \ enhancing the webpage with front-end scripting languages, such as JavaScript.\n\
    \n### Delaying Page Initialization\n\nPage initialization happens automatically\
    \ and by default with jQuery Mobile. The framework includes a property named `autoInitializePage`\
    \ that determines whether the webpage should be initialized. By default, the value\
    \ of this property is set to `true`, so the page is always initialized when the\
    \ document is ready. However, by extending the `$.mobile` object it’s possible\
    \ to set this property to `false` and handle page initialization later.\n\nYou\
    \ can temporarily delay page initialization while other scripts run, which is\
    \ a perfect scenario for setting the `autoInitializePage` property to `false`:\n\
    \n[Click here to view code image](#images.html_p180pro01)\n\n```javascript\n$(document).bind(\"\
    mobileinit\", function() {\n    $.extend( $.mobile, {\n        autoInitializePage:\
    \ false\n    });\n});\n```\n\nImagine a large amount of client-side JavaScript\
    \ having to be loaded, such as a long list of names. In cases like this it might\
    \ be a good idea to delay initialization until the document object model (DOM)\
    \ has completed loading. This way the client-side JavaScript has a chance to run\
    \ and you can fade the data in gracefully rather than having it load line by line\
    \ before the visitor’s eyes:\n\n[Click here to view code image](#images.html_p180pro02)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>Page Initialization - jQuery\
    \ Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"assets/js/custom-jqm.js\"></script>\n    <script\
    \ src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"></script>\n\
    </head>\n<body>\n    <div data-jquerymobiletv-role=\"page\" id=\"mypage\">\n \
    \       <div data-jquerymobiletv-role=\"header\"><h1>Page Name</h1></div>\n  \
    \      <div data-jquerymobiletv-role=\"content\">\n            <ul data-jquerymobiletv-role=\"\
    listview\" id=\"my-list\"></ul>\n        </div>\n        <div data-jquerymobiletv-role=\"\
    footer\">Copyright</div>\n    </div>\n    <script type=\"text/javascript\">\n\
    \        $(\"#mypage\").css('display', 'none');\n        var namesArray = new\
    \ Array(\"Tom\", \"Lucy\", \"Lee\", \"Chris\", \"Albert\", \"Frank\");\n     \
    \   for(var i=0; i<namesArray.length; i++) {\n            $('#my-list').append('<li><a\
    \ href=\"#\">'+namesArray[i]+ '</a></li>');\n        }\n        $.mobile.autoInitializePage\
    \ = true;\n        $(\"#mypage\").fadeIn(1000);\n    </script>\n</body>\n</html>\n\
    ```\n\nRunning this code delays initialization; the user won’t see the list of\
    \ names until the loop has completed and the `autoInitializePage` property is\
    \ set to `true`, then the `fadeIn` method is used to fade in the page.\n\n[Figure\
    \ 12.1](#ch12.html_ch12fig01) shows how the page renders once the `autoInitializePage`\
    \ property is set to `true` and the page is faded in.\n\n![Image](graphics/jquery-12-1)\
    \ Figure 12.1 A page rendered after delaying initialization.\n\n### Customizing\
    \ the subPageKey\n\nThe `subPageKey` is a URL query parameter that’s used as a\
    \ reference for subpages generated by jQuery widgets, which were covered earlier\
    \ in the book. This parameter has a key of `ui-page` by default. However, this\
    \ key can be changed through the `subPageKey` property, which is a property of\
    \ the `$.mobile` object. A string value can be used to update the value of this\
    \ property, which will reflect in widget-generated subpages. Creating a custom\
    \ `subPageKey` not only creates more attractive URLs, but also may shorten URLs\
    \ or set their values to something more specific to the website that’s using them.\n\
    \nFor example, if a custom `subPageKey` of `jqmtv-page` used a default URL of:\n\
    `web-page.html&ui-page=value`\nit would become:\n`web-page.html&jqmtv-page=value`\n\
    \n### Using Active Page and Classes\n\nWebpages that include the jQuery Mobile\
    \ framework have a default CSS class’s automatically applied to the page element\
    \ named `ui-page-active`. But you can change this default behavior by changing\
    \ or appending to the default value of the active class. The `$.mobile` object\
    \ has a property named `activePageClass` that can be modified. If this class is\
    \ replaced with a new value, the default CSS included with the framework no longer\
    \ applies its styling to the `ui-page-active` class since it no longer exists.\
    \ Therefore it’s important to create your own CSS class that corresponds to the\
    \ value you provide for this property or append an additional class to the `ui-page-active`\
    \ class:\n\n[Click here to view code image](#images.html_p184pro01)\n\n```javascript\n\
    $(document).bind(\"mobileinit\", function() {\n    $.extend( $.mobile, {\n   \
    \     activePageClass: \"ui-page-active ui-jqmtv-page-active\"\n    });\n});\n\
    ```\n\nBy appending an additional custom class, the existing CSS is left intact\
    \ and the focus shifts to the CSS’s used for customizations, rather than every\
    \ minute detail of the framework. A simple CSS file needs to be created and included\
    \ to apply some styles to the new CSS class:\n\n```css\n.ui-jqmtv-page-active\
    \ {\n    background: #09C;\n    color: #fff;\n    text-shadow: none;\n}\n```\n\
    \nThis CSS applies a new background color or text color and removes the text shadowing\
    \ from the webpage when included in the HTML markup. Here’s an example of a simple\
    \ HTML file that includes the CSS and the custom `activePageClass` setting from\
    \ the previous examples:\n\n[Click here to view code image](#images.html_p185pro01)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>Active Page Class - jQuery\
    \ Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <link rel=\"stylesheet\" href=\"assets/css/jqmtv.css\" />\n    <script\
    \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"></script>\n\
    \    <script src=\"assets/js/custom-jqm-apc.js\"></script>\n    <script src=\"\
    http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"></script>\n</head>\n\
    <body>\n    <div data-role=\"page\">\n        <div data-role=\"header\"><h1>Page\
    \ Name</h1></div>\n        <div data-role=\"content\">\n            <p>Body copy</p>\n\
    \        </div>\n        <div data-role=\"footer\">Copyright</div>\n    </div>\n\
    </body>\n</html>\n```\n\nWith the jQuery Mobile framework added, this code is\
    \ transformed to include many additional classes and attributes. The custom `ui-jqmtv-page-active`\
    \ class can be seen in the markup when using any type of browser development tools.\n"
