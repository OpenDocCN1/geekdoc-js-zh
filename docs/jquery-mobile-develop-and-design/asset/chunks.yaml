    Each element with the `ui-block-a` class automatically clears the row before it,
    resulting in a new row. When looking at the actual CSS included in the jQuery
    Mobile framework for the `ui-block-a` class, you can see that it clears left floats,
    therefore the result looks similar to **[Figure 7.6](#ch07.html_ch07fig06)**.


    ![Image](graphics/jquery-7-6.jpg)


    Figure 7.6\. A grid with multiple rows and columns.


    ### Collapsible Content


    jQuery Mobile provides a widget that allows developers to create content that
    can expand and contract. This widget, referred to as collapsible content, includes
    a header and content area; the header acts as a button that can be touched to
    expand and contract the content area. To create a collapsible content area, apply
    the `data-role` attribute with a value of `collapsible` to a `div` that will be
    used to contain a heading and content area. In the following example, the container
    element with a `data-role` set to `collapsible` includes a heading and a paragraph
    element:


    [Click here to view code image](#images.html_p099pro01)


    <div data-role="collapsible">


        <h3>Collapsible content header</h3>'
