- fmt: '

    One thing that will become readily apparent is that you can’t interact with desktop
    simulators in the same way that you would with an actual device. If you’re testing
    with what would normally be a touch-enabled device, you can’t perform the same
    actions like scrolling or zooming with your fingers on the screen of the device.
    You must use the mouse and keyboard attached to your desktop environment to scroll,
    click, and otherwise interact with the simulator.


    If you designed your mobile site to rely on the user agent string or feature detection,
    you’ll also be missing some key functionality on the desktop device. There are
    some solutions you can use (see the “Spoofing user agent strings” sidebar) to
    assist with your testing. You can also determine if the desktop version of the
    browser matches the mobile browser’s feature set. It’s important that you load
    the online simulators into as many different browsers as possible so you can see
    whether the browser’s features will support the programming you’ve built into
    your mobile website or application.


    Make sure that navigation works as you expect it to. Carefully examine the layout
    to make sure it fits on the device’s screen area. Using online simulators will
    make it easy to find out whether the site will look good and navigate properly
    on a mobile device.


    ***


    ## Spoofing User Agent Strings


    There’s a solution you can use during the testing process that will let you modify
    the request header so that the proper user agent strings are sent to the server.
    You must be using a `Mozilla Firefox` browser with the `Modify Headers` add-on.
    You can get the add-on at:


    [https://addons.mozilla.org/en-US/firefox/addon/modify-headers/](https://addons.mozilla.org/en-US/firefox/addon/modify-headers/)


    If you choose to use this tool, you’ll want to educate yourself on user agent
    strings and how to form them. That information is available from the World Wide
    Web Consortium at:


    [www.w3.org/Protocols/HTTP/HTRQ_Headers.html](http://www.w3.org/Protocols/HTTP/HTRQ_Headers.html)


    This tool provides a handy user interface that can be easily started from Firefox’s
    add-on toolbar. I encourage you to make it a part of your mobile development toolbox.


    ***


    ## Using remote labs


    If you’re unable to acquire a group of physical devices to test your mobile websites
    and applications, you have the option to use a remote lab to test on. The cost
    of testing and the test experience vary widely from lab to lab, so make sure you
    do your research before deciding on which lab to use.


    Once you’ve chosen a lab, make sure you have a clearly defined test plan before
    beginning because many labs charge by the minute or the hour. Make sure you choose
    your target devices carefully and, once chosen, execute your test plan without
    getting sidetracked, as every moment counts.


    Here are some labs you may want to consider:


    - Keynote DeviceAnywhere ([www.keynotedeviceanywhere.com](http://www.keynotedeviceanywhere.com))
    supports over 2,000 devices.

    - Paca Mobile Center ([www.pacamobilecenter.com](http://www.pacamobilecenter.com))
    is located in France and is well-stocked with mobile devices.

    - Perfecto Mobile ([www.perfectomobile.com](http://www.perfectomobile.com)) currently
    supports about 500 devices but has aggressive pricing plans.


    You generally have two options: Some labs wire the device to a server that’s controlled
    from the tester’s computer; others allow you to monitor the test via a remotely
    accessible camera. This latter approach requires an on-site tester, and the tester
    will interact with the device. Some labs even offer automated scripted tests.


    ## Testing with desktop simulators


    Some device manufacturers offer SDKs that let you download and install simulators
    for testing on your desktop. Some of the most ones popular are `Android SDK` (developer.android.com/sdk/),
    `BlackBerry` (bdsc.webapps.blackberry.com/devzone/), and `iPhone` simulators that
    come with `XCode` (developer.apple.com/xcode/) for use on a `Mac`.


    Another more recently released simulator, available for both Mac and Windows platforms,
    is called `Mobilizer` ([www.springbox.com/mobilizer/](http://www.springbox.com/mobilizer/)).
    It is shown in [Figure 18.5](#ch18.html_ch18fig05).


    ![Image](graphics/jquery-18-5.jpg)


    Figure 18.5. Mobilizer offers only four devices, but they are some of the most
    popular devices available.


    Each of these SDKs supports some very specific feature sets and typically does
    not cover every device available from a particular manufacturer, but using them
    can give you a quick check of things like layout and navigation.


    The test plan for these is similar to that for testing with online emulators.
    You load your site onto either a local server or a web-accessible server, open
    the simulator, and type in the URL. Your site should load and you can interact
    with it using your computer’s keyboard and mouse.


    The upside is that the SDKs will report user agent strings properly and let you
    test your site’s ability to add or remove features and perform redirections based
    on what the device’s standard browser will support. Testing with a number of them
    will give you more confidence in the way your site looks and operates before you
    release it to the public.


    ## Crowd testing


    My friends like pizza, and they are all passionate about their choices in mobile
    devices. Put the two together and you have a great resource for a testing party!


    Never release your mobile website or application to the public without testing
    on actual devices. One way to do this is to make friends with people who own and
    use various phones and pads and get them together for a little crowd testing.


    The rules of crowd testing are the same as other forms of testing: You must have
    a plan. (And never serve the pizza until the test is complete.) You may want to
    define the plan on a short questionnaire that you give to the crowd or that you
    can fill out when you’re performing one-off hallway testing. Ask the tester to
    follow the plan, answer the questions about interacting with your site, and make
    sure the layout meets expectations. You’ll also get feedback on the look and feel
    of your site that can be valuable as you push toward launch.


    ***


    ![Image](graphics/note.jpg) Note


    There are crowd-sourced testing services available like `Mob4Hire` ([www.mob4hire.com](http://www.mob4hire.com)).
    They offer a wide range of services and can help guide you through the testing
    process.


    ***


    ## Wrapping Up


    There are a lot of options for testing your mobile websites and applications,
    and you’ll have to be diligent in setting up and using simulators with well-defined
    test plans to ensure success.


    As a developer, you’ll likely include a combination of online and desktop simulators
    in your workflow to the functions and features of the mobile websites you develop.
    Once you’ve reached a certain stage of development, you may want to extend your
    testing to mobile labs (if they are in your budget).


    The one simulation you’ll always want to include is interacting with your mobile
    sites on as many physical devices as possible. This can be limited to the devices
    that are immediately available to you or can involve getting your friends and
    acquaintances together for a round or two of hands-examination. Don’t forget the
    pizza!


