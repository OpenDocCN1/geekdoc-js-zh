    The images are not rendered initially, but as the webpage is scrolled, the images
    load when the area of the page they are in is revealed. This functionality produces
    a quicker page load time because all the images load the same loader image by
    default, rather than loading each unique image until scrolling reveals them on
    the screen.


    This example expects image tags that are loaded lazily to include a `data-image`
    attribute and a class with a value of `lazy-img`:


    [Click here to view code image](#images.html_p199pro01)


