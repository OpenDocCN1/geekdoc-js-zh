    property:


    [Click here to view code image](#images.html_p126pro01)


    $.mobile.listview.prototype.options.filterCallback = myCustomCallback;


    Or, you can access a specific `listview` by `id` and set the `filterCallback`
    property for that `listview` only:


    [Click here to view code image](#images.html_p126pro02)


    $(''#my-listview'').listview(''option'', ''filterCallback'', myCustomCallback);


    Let’s try adding a custom search filter to the Beatles song list using the `listview`
    function. First, we’ll add a `pageinit` event to ensure that the page has loaded
    and that it’s been enhanced by the framework. To do so we’ll need to add an `id`
    to the page so we can target it with jQuery. The following example shows a page
    with an `id` that can be targeted. A custom JavaScript file called filter.js is
    the file we’ll use to create the callback function:


    [Click here to view code image](#images.html_p127pro02)


    <!DOCTYPE html>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>List view - jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="assets/js/filter.js"></script>


        <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


    </head>


    <body>


        <div data-role="page" id="beatles-page">


            <div data-role="header">


                <h1>The Beatles</h1>


            </div>


            <div data-role="content">


                <ul data-role="listview" data-filter="true">


                    <li>Across The Universe</li>


                    <li>Act Naturally</li>


                    <li>Ain''t She Sweet</li>


                    <li>All I''ve Got To Do</li>


                    <li>All My Loving</li>


                    <li>All Together Now</li>


                    <li>All You Need Is Love</li>


                    <li>And I Love Her</li>


                    <li>And Your Bird Can Sing</li>


                    <li>Anna (Go To Him)</li>


                    <li>Another Girl</li>


                    <li>Any Time At All</li>


                    <li>Ask Me Why</li>


                    <li>Baby It''s You</li>


                    <li>Baby, You''re A Rich Man</li>


                    <li>Baby''s In Black</li>


                    <li>Back In The U.S.S.R.</li>


                    <li>Bad Boy</li>


                    <li>The Ballad Of John And Yoko</li>


                    <li>Because</li>


                    <li>Being For The Benefit Of Mr. Kite!</li>


                    <li>Besame Mucho</li>


                    <li>Birthday</li>


                    <li>Blackbird</li>


            <!-- etc. -->


        </ul>


    </body>


    </html>


    Once we have an `id` for the `listview` and have included a custom JavaScript
    file, we can target the `listview` from within the JavaScript file. First, the
    document must be ready. Once the document is ready, an event handler is created
    for the `pageinit` method for the `beatles-page` element. When the page is initialized,
    the `listview` code is executed, and the `defaultSearch` function is used as the
    custom callback function:


    [Click here to view code image](#images.html_p128pro01)


    $(document).ready(function() {


        $(''div#beatles-page'').on({


            pageinit: function(event) {


                $(''#beatles-listview'').listview(''option'', ''filterCallback'',
    defaultSearch);


            }


        });


    });


    function defaultSearch( text, searchValue ) {


        console.log("Text: "+ text, ", SearchValue: "+ searchValue);


        return text.toLowerCase().indexOf( searchValue ) === -1;


    };'
