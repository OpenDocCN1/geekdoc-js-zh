    \n*献给我的妻子 Lisa，在我写这本书时，她怀着我们的第一个孩子。只有真爱才能抵受在拥有新生宝宝的同时撰写一本书所花费的漫长时间。献给我的儿子 Lucas，语言无法表达我内你的爱。*\n\
    \n## 谢谢\n\n有许多人，由于他们在在这本书写作之前、期间和之后为我提供的机会和帮助，我想向他们表示感谢：Neil Salkind，他帮助我进入出版世界并在我写作期间提供支持。Robyn\
    \ Thomas 她的耐心。Jay Blanchard 在需要时介入并提供出色的技术审核。Rebecca Gulick 帮助推进进度。Michael Nolan\
    \ 处理了细节。我所有的客户，感谢他们理解我有多忙。当然，还有 Peachpit 给了我为你们写作的机会。\n\n## 关于作者\n\n**Kris Hadlock**\
    \ 自 1996 年以来一直是 Web 开发人员和设计师，曾为 SPIN Magazine、IKEA、美国航空、摩根大通银行、尼康和凤凰儿童医院等公司提供服务。Kris\
    \ 是许多网站和设计杂志的特约专栏作家作家，包括 Peachpit.com、InformIT.com、IBM developerWorks (*[www.ibm.com/developerworks](http://www.ibm.com/developerworks)*)\
    \ 以及 *Practical Web Design* 杂志。他的其他书籍《Ajax for Web Application Developers》和《The\
    \ ActionScript 3.0 Migration Guide》。他是 Studio Sedition ([www.studiosedition.com](http://www.studiosedition.com))\
    \ 的创始人兼首席开发设计师，专注于形式与功能的融合。\n\n## 目录\n\n- 介绍开发的未来\n- 支持的 jQuery Mobile \n\n###\
    \ 第一部分 jQuery Mobile 的基础\n\n#### 第 1 章 了解 jQuery\n- 入门\n- jQuery 基础知识\n    - 选择\
    \ HTML 元素\n    - 管理事件和函数\n    - 等待文档就绪\n    - 应用特殊效果\n    - 使用 Ajax\n- 本结\n####\
    \ 第 2 章 HTML5 的角色\n- 语义化 HTML5\n- 创建 HTML5 模板\n- viewport 标签\n- data- 属性\n- 本结\n\
    #### 第 3 章 移动入门\n- jQuery Mobile 如何工作\n- 在你的网站中添加 jQuery Mobile 框架\n- 页面和工具栏组件\n\
    - 网页结构化\n- 本结\n\n### 第二部分 UI 组件](#part02.html_part02)\n\n#### 第 4 章 创建多页面网站\n\
