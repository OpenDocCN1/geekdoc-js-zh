    collapsible\">\n        <h3>Collapsible child #2</h3>\n        <p>Lorem ipsum\
    \ dolor sit amet.</p>\n    </div>\n</div>\n```\n\nThe two highlighted collapsible\
    \ content areas in this example are nested in the main collapsible area. The result\
