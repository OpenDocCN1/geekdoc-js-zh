  trans: "\n如你所见，框架为搜索过滤器输入框添加了“过滤项目...”的默认值。你可以通过一个名为 `data-filter-placeholder` 的额外属性更改此默认文本，该属性可以使用在无序列表（`<ul>`）或有序列表（`<ol>`）元素。下面的示例显示了在之前的披头士歌曲列表中包含此属性的代码：\n\
    \n点击此处查看代码图像\n\n```html\n<ul data-role=\"listview\" data-filter=\"true\" data-filter-placeholder=\"\
    Search the song list...\">\n    <li>Across The Universe</li>\n    <li>Act Naturally</li>\n\
    \    <li>Ain't She Sweet</li>\n    <li>All I've Got To Do</li>\n    <li>All My\
    \ Loving</li>\n    <li>All Together Now</li>\n    <li>All You Need Is Love</li>\n\
    \    <li>And I Love Her</li>\n    <li>And Your Bird Can Sing</li>\n    <li>Anna\
    \ (Go To Him)</li>\n    <li>Another Girl</li>\n    <li>Any Time At All</li>\n\
    \    <li>Ask Me Why</li>\n    <li>Baby It's You</li>\n    <li>Baby, You're A Rich\
    \ Man</li>\n    <li>Baby's In Black</li>\n    <li>Back In The U.S.S.R.</li>\n\
    \    <li>Bad Boy</li>\n    <li>The Ballad Of John And Yoko</li>\n    <li>Because</li>\n\
    \    <li>Being For The Benefit Of Mr. Kite!</li>\n    <li>Besame Mucho</li>\n\
    \    <li>Birthday</li>\n    <li>Blackbird</li>\n    <!-- etc. -->\n</ul\n```\n\
    \n框架允许你通过 API 更改搜索过滤器文本。要做到这一点，必须在 `mobileinit` 事件触发后访问 `listview` 组件。你将在书的后部分学习更多关于\
    \ jQuery Mobile API 的知识，但现在重要的是要理解在成功访问 API 之前必须初始化框架。一旦访问了 `listview`，就可以更改它的选项。其中一个选项是\
    \ `filterPlaceholder` 属性，可以用于更新搜索过滤器文本。下面的代码显示了如何编写代码的完整示例，包括绑定到 `mobileinit`\
    \ 事件：\n\n点击此处查看代码图像\n\n```javascript\n$(document).bind(\"mobileinit\", function()\
    \ {\n    $.mobile.listview.prototype.options.filterPlaceholder = \"Search the\
    \ song list...\";\n});\n```\n\n这两个选项的视觉效果相同，允许你定义任何想要出现在搜索字段中的文本。图 9.2 显示了带有自定义占位符文本的搜索过滤器的示例。\n\
    \n![Image](img/jquery-9-2.jpg)\n\n图 9.2.（左）一个带有自定义占位符文本的基础搜索过滤器。\n\n搜索过滤器栏的另一个棒功能是，你不仅可以过滤基本的\
    \ `listview`，还可以过滤包含自定义格式的 `listview`。在自定义格式列表上的搜索过滤器实际上会搜索每个列表项中的所有文本，无论是标题、段落还是其他内容——只要你想到的，框架就会进行过滤。图\
    \ 9.3 显示了一个带有搜索过滤器的自定义格式 `listview` 的示例序列。结果包含来自段落复制和标题的匹配文本的列表项。\n\n![Image](img/jquery-9-3.jpg)\n\
    \n图 9.3.（右）在自定义格式 `listview` 上的基础搜索过滤器。\n\n### 创建自定义搜索过滤器\n\njQuery Mobile 框架为你提供了两种创建自定义搜索过滤器的选项。`listview`\
    \ 包含一个 `filterCallback` 选项，可以使用自定义回调函数对其进行扩展。通过扩展此回调函数，两个参数——`text` 和 `searchValue`\
    \ 变得可用，并可用于编写自定义搜索准则。`text` 参数是当前列表项的值，而 `searchValue` 是输入到搜索过滤器中的文本值。当用户在搜索过滤器中输入内容时，`listview`\
    \ 会遍历列表，比较列表项文本和搜索值，并根据需要过滤结果。图 9.4 显示了当 jQuery Mobile 比较搜索值和每个列表项文本时的 `console.log`\
    \ 示例。\n\n![Image](img/jquery-9-4.jpg)\n\n图 9.4. 搜索过滤器遍历列表项以匹配文本的过程。\n\n要自定义准则，你可以简单地使用\
    \ `filterCallback` 属性设置回调函数：\n\n```javascript\n$.mobile.listview.prototype.options.filterCallback\
    \ = myCallback;\n```\n\n或者，你可以通过 `id` 访问特定的 `listview` 并仅为该 `listview` 设置 `filterCallback`\
    \ 属性：\n\n```javascript\n$('#my-listview').listview('option', myCallback);\n```\n\
    \n让我们尝试使用 `listview` 函数为披头士列表添加自定义搜索过滤器。首先，我们将添加一个 `pageinit` 事件，以确保页面已加载并被框架增强。为此，我们需要为页面添加一个\
    \ `id`，这样我们就可以目标它。下面的示例显示了一个带有 `id` 的页面，通过一个名为 `filter.js` 的 JavaScript 文件来创建回调：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>List - jQuery Mobile: Design\
    \ and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.4.3/jquery.mobile-1.4.3.min.css\"\
    >\n    <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"assets/js/filter.js\"></script>\n</head>\n<body>\n\
    \    <div data-role=\"page\" id=\"beatles-page\">\n        <div data-role=\"header\"\
    >\n            <h1>The Beatles</h1>\n        </div>\n        <div data-role=\"\
    content\">\n            <ul data-role=\"listview\" data-filter=\"true\">\n   \
    \             <li>Across The Universe</li>\n                <li>Act Naturally</li>\n\
    \                <li>Ain't She Sweet</li>\n                <li>All I've Got To\
    \ Do</li>\n                <li>All My Loving</li>\n                <li>All Together\
    \ Now</li>\n                <li>All You Need Is Love</li>\n                <li>And\
    \ I Love Her</li>\n                <li>And Your Bird Can Sing</li>\n         \
    \       <li>Anna (Go To Him)</li>\n                <li>Another Girl</li>\n   \
    \             <li>Any Time At All</li>\n                <li>Ask Me Why</li>\n\
    \                <li>Baby It's You</li>\n                <li>Baby, You're A Rich\
    \ Man</li>\n                <li>Baby's In Black</li>\n                <li>Back\
    \ In The U.S.S.R.</li>\n                <li>Bad Boy</li>\n                <li>The\
    \ Ballad Of John And Yoko</li>\n                <li>Because</li>\n           \
    \     <li>Being For The Benefit Of Mr. Kite!</li>\n                <li>Besame\
    \ Mucho</li>\n                <li>Birthday</li>\n                <li>Blackbird</li>\n\
    \                <!-- etc. -->\n            </ul>\n        </div>\n    </div>\n\
    \    <script src=\"http://code.jquery.com/mobile/1.4.3/jquery.mobile-1.4.3.min.js\"\
    ></script>\n</body>\n</html>\n```\n\n现在，让我们尝试使用 `listview` 函数为披头士列表添加自定义搜索过滤器。**\n"
- fmt: "\nThis example uses the default search criteria to log the text and `searchValue`\
    \ for testing purposes. Minus the `console.log`, this is the exact code that jQuery\
    \ Mobile uses to filter results as they’re entered into the search filter bar.\
    \ First, the text is converted to lowercase to make it a case-insensitive search,\
    \ then JavaScript’s native `indexOf` function looks for a string matching the\
    \ `searchValue` in the text.\n\nNow let’s take a look at how a custom callback\
    \ function can be coded. This time we’ll use the custom formatted `listview` from\
    \ the earlier example and apply a filter to it that searches only the body copy,\
    \ excluding the list item titles from the search criteria:\n\n[Click here to view\
    \ code image](#images.html_p129pro01)\n\n```javascript\n$(document).bind(\"mobileinit\"\
    , function() {\n    $.mobile.listview.prototype.options.filterCallback = onlyBody;\n\
    });\n\nfunction onlyBody( text, searchValue ) {\n    var splitText = text.trim().split(\"\
    \\n\");\n    console.log(\"text: \"+ splitText[1]);\n    return splitText[1].toLowerCase().indexOf(\
    \ searchValue ) === -1;\n};\n\nString.prototype.trim = function() {\n    return\
    \ this.replace(/^\\s+|\\s+$/g,\"\");\n}\n```\n\nIn this example, we need only\
    \ wait for the `mobileinit` event, because the `filterCallback` property for all\
    \ `listviews` is accessible before the jQuery Mobile framework enhances the markup\
    \ for the page. (In the previous example, the specific `listview` we were targeting\
    \ had to be enhanced by the framework before it could be accessed.) Once the `mobileinit`\
    \ event is triggered, we’ll set the `filterCallback` to `onlyBody`, a custom callback\
    \ function that can be structured like any other, but it will receive two arguments,\
    \ `text` and `searchValue`. With these arguments we can write any rules we desire.\
    \ In this case, we’ll split the `text` argument and match results only for the\
    \ body copy that was included in the `p` element from the earlier custom formatted\
    \ list example.\n\nIn addition to creating custom filter callback functions, jQuery\
    \ Mobile also offers an attribute named `data-filtertext` for filtering list items.\
    \ The interesting thing about this attribute is that it will actually be the text\
    \ value that’s sent to the `filterCallback` function. In other words, the value\
    \ in the `data-filtertext` attribute becomes the value that the `filterCallback`\
    \ function uses during comparison:\n\n[Click here to view code image](#images.html_p130pro01)\n\
    \n```html\n<ul data-role=\"listview\" data-filter=\"true\">\n    <li data-filtertext=\"\
    AL\">Alabama</li>\n    <li data-filtertext=\"AK\">Alaska</li>\n    <li data-filtertext=\"\
    AZ\">Arizona</li>\n    <li data-filtertext=\"AR\">Arkansas</li>\n    <li data-filtertext=\"\
    CA\">California</li>\n    <li data-filtertext=\"CO\">Colorado</li>\n    <li data-filtertext=\"\
    CT\">Connecticut</li>\n    <li data-filtertext=\"DE\">Delaware</li>\n</ul>\n```\n\
    \nThe markup in this example uses the `data-filtertext` attribute to filter a\
    \ list by state abbreviation rather than the full state name value of the list\
    \ items. [Figure 9.5](#ch09.html_ch09fig05) shows how this filter works; typing\
    \ “ar” would usually result in “Arizona” and “Arkansas,” but since this list is\
    \ being filtered by state abbreviation, “Arkansas” is the only match.\n\n![Image](graphics/jquery-9-5.jpg)\n\
    \nFigure 9.5\\. With a `data-filtertext` attribute applied, the search criteria\
    \ can be different from the actual list item values.\n\n### Wrapping Up\n\nSearch\
    \ filter bars offer capabilities that would otherwise be rather complex and time-consuming\
    \ to program. jQuery Mobile makes it incredibly easy to add and even customize\
    \ this functionality. In addition to saving time, this widget provides added value\
    \ to any large amount of data and offers great usability enhancements, helping\
    \ users find what they’re looking for quickly and efficiently. Sometimes it’s\
    \ just not possible to pare down all the content that needs to go on a mobile\
    \ website. When this is the case and you have a very long list that seems nearly\
    \ unusable, the search filter bar is a great way to handle the problem.\n\n##\
    \ 10. Form Elements\n\nThe jQuery Mobile framework has exposed a number of internal\
    \ methods and events for each form element, which means that you can access them\
    \ from your custom code. These methods and events let you alter and extend core\
    \ jQuery Mobile form element functionality to create customizations that set your\
    \ mobile application apart from the rest. This chapter covers each of the exposed\
    \ form element methods and events that are available to you.\n\n### Text Inputs\n\
    \njQuery Mobile supports many different text input types, including HTML5 inputs,\
    \ such as number, e-mail, URL, phone, and a few time- and date-related inputs.\
    \ The framework enhances all form elements to make them more usable on mobile\
    \ devices. One major advantage to identifying form elements with a specific element\
    \ type is that the keyboard changes. Following are some examples of the different\
    \ text inputs and the associated iOS keyboards after they’ve been enhanced by\
    \ jQuery Mobile.\n\nSetting an element type is done by adding an attribute named\
    \ `type`. Following are some examples of the different text inputs and the associated\
    \ iOS keyboards after they’ve been enhanced by jQuery Mobile.\n\nSetting an element\
    \ type is done by adding an attribute named `type`. Here:\n\n[Click here to view\
    \ code image](#images.html_p134pro01)\n\n```html\n<input type=\"number\">\n```\n\
    \nWhen the `type` is set to `number`, iOS displays a numeric keyboard. [Figure\
    \ 10.1](#ch10.html_ch10fig01).\n\n![Image](graphics/jquery-10-1.jpg)\n\nFigure\
    \ 10.1\\. A numeric keyboard when `type` is set to `number`.\n\nSetting an element\
    \ type is done by adding an attribute named `type`. Here:\n\n[Click here to view\
    \ code image](#images.html_p135pro01)\n\n```html\n<input type=\"number\" pattern=\"\
    0-9]*\">\n```\n\nWhen the `type` is set to `number`, iOS displays a numeric keyboard.\
    \ [Figure 10.2](#ch10.html_ch10fig02).\n\n![Image](graphics/jquery-10-2.jpg)\n\
    \nFigure 10.2\\. A numeric keyboard when a `pattern` attribute is applied.\n\n\
    Setting an element type is done by adding an attribute named `type`. Here:\n\n\
    [Click here to view code image](#images.html_p135pro02)\n\n```html\n<input type=\"\
    email\">\n```\n\nWhen the `type` is set to `email`, iOS includes an alphabetical\
    \ keyboard with an `@` symbol and a period. [Figure 10.3](#ch10.html_ch10fig03).\n\
    \n![Image](graphics/jquery-10-3.jpg)\n\nFigure 10.3\\. An alphabetical keyboard\
    \ with `@` and `.` for e-mail.\n\n### jQuery Mobile 1.1.0\n\nJust prior to publication\
    \ of this book, a new version of the jQuery Mobile framework, version 1.1.0 final,\
    \ was released. To benefit from some of the new form element options, you must\
    \ use the following code when including the framework, CSS, and jQuery in your\
    \ pages:\n\n[Click here to view code image](#images.html_p135pro03)\n\n```html\n\
    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.css\"\
    \ />\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n<script src=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js\"\
    ></script>\n```\n\nThe jQuery Mobile framework is constantly being upgraded. Check\
    \ the download page on jquerymobile.com before starting a project to ensure you\
    \ have the latest and greatest code.\n\n*   A `url` element type reveals an alphabetical\
    \ keyboard with a forward slash and a .com key. [Figure 10.4](#ch10.html_ch10fig04).\n\
    *   A `tel` element type reveals a telephone keypad for phone numbers. [Figure\
    \ 10.5](#ch10.html_ch10fig05).\n"
  raw: 'This example uses the default search criteria to log the text and `searchValue`
    for testing purposes. Minus the console.log, this is the exact code that jQuery
    Mobile uses to filter results as they’re entered into the search filter bar. First,
    the text is converted to lowercase to make it a case-insensitive search, then
    JavaScript’s native `indexOf` function looks for a string matching the `searchValue`
    in the text.


    Now let’s take a look at how a custom callback function can be coded. This time
    we’ll use the custom formatted `listview` from the earlier example and apply a
    filter to it that searches only the body copy, excluding the list item titles
    from the search criteria:


    [Click here to view code image](#images.html_p129pro01)


    $(document).bind("mobileinit", function() {


        $.mobile.listview.prototype.options.filterCallback = onlyBody;


    });


    function onlyBody( text, searchValue ) {


        var splitText = text.trim().split("\n");


        console.log("text: "+ splitText[1]);


        return splitText[1].toLowerCase().indexOf( searchValue ) === -1;


    };


    String.prototype.trim = function() {


        return this.replace(/^\s+|\s+$/g,"");


    }


    In this example, we need only wait for the `mobileinit` event, because the `filterCallback`
    property for all `listviews` is accessible before the jQuery Mobile framework
    enhances the markup for the page. (In the previous example, the specific `listview`
    we were targeting had to be enhanced by the framework before it could be accessed.)
    Once the `mobileinit` event is triggered, we’ll set the `filterCallback` to `onlyBody`,
    a custom callback function that can be structured like any other, but it will
    receive two arguments, `text` and `searchValue`. With these arguments we can write
    any rules we desire. In this case, we’ll split the `text` argument and match results
    only for the body copy that was included in the `p` element from the earlier custom
    formatted list example.


    In addition to creating custom filter callback functions, jQuery Mobile also offers
    an attribute named `data-filtertext` for filtering list items. The interesting
    thing about this attribute is that it will actually be the text value that’s sent
    to the `filterCallback` function. In other words, the value in the `data-filtertext`
    attribute becomes the value that the `filterCallback` function uses during comparison:


    [Click here to view code image](#images.html_p130pro01)


    <ul data-role="listview" data-filter="true">


        <li data-filtertext="AL">Alabama</li>


        <li data-filtertext="AK">Alaska</li>


        <li data-filtertext="AZ">Arizona</li>


        <li data-filtertext="AR">Arkansas</li>


        <li data-filtertext="CA">California</li>


        <li data-filtertext="CO">Colorado</li>


        <li data-filtertext="CT">Connecticut</li>


        <li data-filtertext="DE">Delaware</li>


    </ul>


    The markup in this example uses the `data-filtertext` attribute to filter a list
    by state abbreviation rather than the full state name value of the list items.
    **[Figure 9.5](#ch09.html_ch09fig05)** shows how this filter works; typing “ar”
    would usually result in “Arizona” and “Arkansas,” but since this list is being
    filtered by state abbreviation, “Arkansas” is the only match.


    ![Image](graphics/jquery-9-5.jpg)


    Figure 9.5\. With a data-filtertext attribute applied, the search criteria can
    be different from the actual list item values.


    ### Wrapping Up


    Search filter bars offer capabilities that would otherwise be rather complex and
    time-consuming to program. jQuery Mobile makes it incredibly easy to add and even
    customize this functionality. In addition to saving time, this widget provides
    added value to any large amount of data and offers great usability enhancements,
    helping users find what they’re looking for quickly and efficiently. Sometimes
    it’s just not possible to pare down all the content that needs to go on a mobile
    website. When this is the case and you have a very long list that seems nearly
    unusable, the search filter bar is a great way to handle the problem.


    ## 10\. Form Elements


    The jQuery Mobile framework has exposed a number of internal methods and events
    for each form element, which means that you can access them from your custom code.
    These methods and events let you alter and extend core jQuery Mobile form element
    functionality to create customizations that set your mobile application apart
    from the rest. This chapter covers each of the exposed form element methods and
    events that are available to you.


    ### Text Inputs


    jQuery Mobile supports many different text input types, including HTML5 inputs,
    such as number, e-mail, URL, phone, and a few time- and date-related inputs. The
    framework enhances all form elements to make them more usable on mobile devices.
    One major advantage to identifying form elements with a specific element type
    is that the keyboard changes. Following are some examples of the different text
    inputs and the associated iOS keyboards after they’ve been enhanced by jQuery
    Mobile.


    Setting an element type is done by adding an attribute named `type` and setting
    its value to any of the values listed in this section. Here’s an example of a
    text input with the `type` set to `number`:


    [Click here to view code image](#images.html_p134pro01)


    <input type="number" name="number">


    When the element type is set to `number`, the input forces iOS to display a numeric
    keyboard (**[Figure 10.1](#ch10.html_ch10fig01)**).


    ![Image](graphics/jquery-10-1.jpg)


    Figure 10.1\. A numeric keyboard is revealed when using the number element type.


    When the element type is set to `number`, but includes a `pattern` attribute of
    0–9, the telephone pad appears (**[Figure 10.2](#ch10.html_ch10fig02)**).


    ![Image](graphics/jquery-10-2.jpg)


    Figure 10.2\. A telephone keypad for number patterns.


    To use a number pattern, simply append a `pattern` attribute and define the pattern.
    The pattern used in this example allows any number between 0 and 9 to be entered
    into this number field. This pattern is based on a regular expression. You can
    find more information about regular expressions at regexpal.com; you can also
    use the site to test the regular expressions you write:


    [Click here to view code image](#images.html_p135pro01)


    <input type="number" name="number" pattern="[0-9]*" id="number-pattern">


    When the element type is set to `email`, iOS includes an alphabetical keyboard
    with an `@` symbol and a period to help speed up input. If you have other mobile
    devices, you can easily set up a form with these input types to see how each keyboard
    responds (**[Figure 10.3](#ch10.html_ch10fig01)**).


    ![Image](graphics/jquery-10-3.jpg)


    Figure 10.3\. An alphabetical keyboard with an @ symbol and a period for e-mail
    addresses.


    * * *


    jQuery Mobile 1.1.0


    Just prior to publication of this book, a new version of the jQuery Mobile framework,
    version 1.1.0 final, was released. To benefit from some of the new form element
    options, you must use the following code when including the framework, CSS, and
    jQuery in your pages:


    [Click here to view code image](#images.html_p135pro02)


    <link rel="stylesheet" href="http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.css"
    />


    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


    <script src="http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js"></script>


    The jQuery Mobile framework is constantly being upgraded. Check the download page
    on jquerymobile.com before starting a project to ensure you have the latest and
    greatest code.


    * * *


    A `url` element type reveals an alphabetical keyboard with a forward slash and
    a .com key (**[Figure 10.4](#ch10.html_ch10fig04)**).


    ![Image](graphics/jquery-10-4.jpg)


    Figure 10.4\. An alphabetical keyboard with a forward slash and .com key for URLs.


    A `tel` element type reveals a telephone keypad for phone numbers (**[Figure 10.5](#ch10.html_ch10fig05)**).'
