    ## Introducing the Future of Web Development


    Most web developers and designers agree that browser and cross-platform testing
    is something they would rather not spend their time on. Imagine all of the devices
    that could be accessing your website. Then imagine having to test all of platforms
    each and time you build a website—this would be painstaking and incredibly time-consuming.
    jQuery Mobile gives you this support from the start, as the team prides the framework
    on its wide variety of mobile platforms. The framework is built on clean, semantic
    HTML, which ensures compatibility with a majority of web-enabled devices.


    The framework also includes accessibility features, such as `WAI-ARIA` (Web Accessibility
    Initiative-Accessible Rich Internet Applications), a technical specification published
    by the World Wide Web Consortium regarding the increase of accessibility of webpages,
    which are integrated into the framework to support screen readers, such as VoiceOver
    on Apple iOS and other assistive technologies. Simply including the jQuery Mobile
    framework in your website unobtrusively transforms your code from semantic HTML
    into a rich, interactive, and accessible mobile experience using jQuery and CSS.


    ### Why jQuery Mobile?


    jQuery Mobile isn’t exclusively for web developers; web designers have access
    to the UI, which provides complete design control over mobile applications. Built-in
    widgets, such as list views, dialogs, toolbars, search mechanisms, and a full
    set of form elements, are all customizable via the theme framework. Later in the
    book, you’ll also learn about ThemeRoller, which lets you create up to 26 theme
    swatches using a simple, web-based interface. User experience (UX) designers also
    get some love, with access to stencils for OmniGraffle and Visio. And, of course,
    if you want to get geeky with it, the application programming interface (API)
    is available to web developers. As a web developer, you can configure defaults,
    handle many different events, and work with several exposed methods and properties.

