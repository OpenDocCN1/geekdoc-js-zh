- fmt: '

    An emerging community is helping to support the framework with a number of third-party
    apps and frameworks that you can use to build jQuery Mobile apps. In addition,
    jQuery Mobile compatible plug-ins and extensions are popping up to help web developers
    integrate custom widgets and add capabilities to the existing core functionality.


    One very important third-party framework is blurring the line between native and
    mobile web-based development. As an HTML5 app platform, `PhoneGap` allows you
    to author native applications using web technologies. With `PhoneGap`, your web
    applications can easily be ported into native apps that can do things like retrieve
    contact information, access cameras, use geolocation, store data, and much more.
    To learn more about `PhoneGap`, visit `phonegap.com`. There’s even a section in
    the jQuery Mobile online documentation about it. With these sorts of possibilities,
    you no longer need to program multiple versions of a native application. This
    makes native application development less desirable, because the same application
    you develop for an iPhone would need to be completely redeveloped for Android,
    BlackBerry, Windows Mobile, and others. Oh, and don’t forget that every new release
    will need to be updated for every one of these different platforms. The jQuery
    Mobile framework provides mobile web experiences that rival native application
    development by giving you instant access to web applications and websites via
    the web browser, eliminating the need to download and install mobile applications.


    ## Who this Book is For

    This book is for people who have basic HTML experience and are interested in creating
    mobile websites using the jQuery Mobile framework.


    ## Who this Book is not For

    This book is not for people who have never created a webpage.


    ## How you will Learn

    In this book, you’ll learn by doing. Each chapter includes sample code and descriptions
    to give you a deep understanding of how things work. You can also find the code
    samples on the book’s website (`[www.peachpit.com/jquerymobile](http://www.peachpit.com/jquerymobile)`).


    ## What you will learn

    This book will teach you everything from the basics of how to create pages to
    custom-theming them and developing your own jQuery Mobile content-management system
    with `WordPress` and `Drupal`. By the time you finish this book, you’ll a jQuery
    Mobile expert.


    ## Wrapping Up

    The jQuery Mobile framework is a powerful framework that is supported by mobile
    industry leaders. It can easily be added to an existing website to create a mobile
    web experience that is not only touch-friendly, but also supported on a majority
    of the leading mobile platforms as well as handicap accessible. Design control,
    page transitions, widget integration, scripting, API access, and much more are
    all at your fingertips through this framework’s easy-to-use features and built-in
    progressive enhancement techniques.


    ## Supported jQuery Mobile Platforms

    The jQuery Mobile framework supports the majority of modern desktop, smartphone,
    tablet, and e-reader platforms. Rather than spending your time testing multiple
    devices, you can rest assured that you’re offering support for many platforms
    from the start. This is because the jQuery Mobile platform takes a progressive
    enhancement approach, which not only brings rich interactive experiences to devices,
    but also provides support for older browsers and phones. When a browser fails
    to recognize certain HTML5-specific code, the webpage renders as a simple, yet
    functional webpage. Users on older phones or browsers are familiar with a limited
    web experience, therefore this approach still renders an acceptable basic HTML
    webpage in these cases.


    Currently, `Android` and `Apple iOS` are the leading mobile operating systems.
    `Android` has the largest operating system market share (44.2 percent), while
    `Apple` has the largest smartphone market share in the United States (28.6 percent).
    The `Windows`, `BlackBerry`, `SymbianOS`, and `Palm/HP webOS` operating systems
    comprise the remaining majority of smartphone market share (`[Figure 1](#pref04.html_pref04fig01)`).
    All of these platforms/operating systems are supported by the jQuery Mobile framework.


    ![Image](graphics/jquery-opener-1.jpg)


    Figure 1. Operating system market share as of 2011.


    ### Major Platforms

    The following list provides a bit more information on the major platforms that
    are fully supported by the jQuery Mobile framework.


    ![Image](graphics/jquery-opener-2.jpg)


    ### IOS

    `iOS` is Apple’s mobile operating system. Originally developed for the `iPhone`,
    it has been extended to support other Apple devices such as the `iPod Touch`,
    `iPad`, and `Apple TV`. `iOS` uses `Safari` as its web browser.


    ![Image](graphics/jquery-opener-3.jpg)


    ### ANDROID

    `Android` is an open-source software project and operating system led by `Google`.
    It has been used in a plethora of phones, tablets, and other devices since its
    release under the `Apache` license. `Android` uses `Google Chrome` as its web
    browser.


    ![Image](graphics/jquery-opener-4.jpg)


    ### WINDOWS PHONE

    `Windows Phone` is Microsoft’s mobile operating system. The system is integrated
    with third-party and other Microsoft services. `Windows Phone` uses `Internet
    Explorer Mobile` as its web browser.


    ![Image](graphics/jquery-opener-5.jpg)


    ### BLACKBERRY

    `BlackBerry` is powered by a proprietary mobile operating system, offered on its
    own set of smart-phones and tablets.


    ![Image](graphics/jquery-opener-6.jpg)


    ### WEBOS

    `webOS` is the open-source operating system used by Palm devices. `webOS` uses
    the `WebKit` layout engine in its web browser, simply named `Web`.


    ### Graded Support

    jQuery Mobile uses a three-tier, graded list of the platforms that are supported
    by the framework. The tiers are `A`, `B`, and `C`. `A` includes a full experience
    with the option of `Ajax`-based page transitions, `B` includes the same experience
    minus the `Ajax`-based page transitions, and `C` is a basic, yet functional, HTML
    experience.


    `A`-grade support includes all the major mobile operating systems that were mentioned
    previously and more, including `Apple iOS`, `Android`, `Windows Phone`, `BlackBerry`,
    `Palm/HP webOS`, `Kindle 3`, `Kindle Fire`, and more. `B`-grade support includes
    `BlackBerry 5`, `Opera Mini`, and `Nokia SymbianOS`. `C`-grade support includes
    `BlackBerry 4`, `Windows Mobile`, and all older smart-phones and feature phones.
    This list is always evolving; to see an up-to-date list, visit `[jquerymobile.com](http://jquerymobile.com)`.


    # Part I: The Foundation of jQuery Mobile


    ## 1. Understanding jQuery

    The jQuery framework is the backbone of the jQuery Mobile framework, so it’s helpful
    to know some of the fundamentals of the jQuery framework before developing jQuery
    Mobile websites. Although it’s not required, understanding jQuery will make using
    jQuery Mobile even even easier than it already is, especially if you’re interested
    in writing any sort of custom functionality.


    `jQuery` is a robust yet lightweight JavaScript library that simplifies JavaScript
    coding and extends the capabilities of Cascading Style Sheets (CSS). In addition,
    it eliminates cross-browser compatibility issues and is CSS3 compliant. This means
    quicker scripting, less testing, and less coding for the different ways that browsers
    handle certain functionality. The `jQuery` framework is truly an example of how
    web development should be: You get what you expect the first time, every time.


    ### Getting Started

