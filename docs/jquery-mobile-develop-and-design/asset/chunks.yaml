  trans: "\njQuery Mobile 提供了一种通过 HTML 锚点元素和输入元素创建按钮的方法。通过创建更大的可点击区域，按钮为标准链接和输入框提供了更易用的替代方案。要将超链接转换为按钮，请将\
    \ `data-role` 属性设置为 `button` (图 5.4)：\n\n点击此处查看代码图像\n\n```html\n<a href=\"#\"\
    \ data-role=\"button\">Hyperlink button</a>\n```\n\n![Image](img/05fig04.jpg)\n\
    \n图 5.4。一个 `data-role` 为 `button` 的链接元素。\n\n默认情况下，按钮占据容器元素的全宽度，但你可以使用 `data-inline`\
    \ 属性将其设置为行内显示。当该属性设置为 `true` 时，创建的按钮宽度将由链接中的文本决定 (图 5.5)：\n\n点击此处查看代码图像\n\n```html\n\
    <a href=\"#\" data-role=\"button\" data-inline=\"true\">Hyperlink button</a>\n\
    ```\n\n![Image](img/05fig05.jpg)\n\n图 5.5。一个 `data-inline` 设置为 `true` 的链接元素。\n\
    \n按钮可以通过许多额外的 `data-` 属性进行增强。表 5.1 列出了所有可能的按钮 `data-` 属性及其值。\n\n表 5.1 按钮 `data-`\
    \ 属性\n\n![Image](img/05tab01.jpg)\n\n输入按钮与超链接的区别在于，它们默认都是按钮。接例的提交（Submit）按钮默认为\
    \ jQuery Mobile 按钮：\n\n点击此处查看代码图像\n\n```html\n<input type=\"submit\" value=\"\
    Submit button\">\n```\n\n这个输入元素并没有特殊之处。图 5.6 显示了该输入按钮在经过 jQuery Mobile 增强后的外观。\n\
    \n![Image](img/05fig06.jpg)\n\n图 5.6。一个 `data-role` 等于 `button` 的提交按钮。\n\n许多类型的输入元素都会被\
    \ jQuery Mobile 自动增强为按钮。这包括 `type` 属性设置为 `button`、`submit`、`reset` 或 `image` 的输入元素，它们在默认情况下外观相同。更改这种默认增强的办法是将\
    \ `data-role` 设置为 `none`。\n\n按钮可以使用 `data-icon` 属性包含图标。默认图标的数量非常惊人，而且图标极易使用。表\
    \ 5.2 显示了通过 `data-icon` 属性添加到 jQuery Mobile 按钮的每个图标示例。\n\n表 5.2 按钮图标\n\n![Image](img/05tab02.jpg)\n\
    \n按钮图标可以放置在不同的位置。要实现这一点，请使用 `data-iconpos` 属性并将其设置为以下值之一：\n\n- `left`（`left` 是默认值）\n\
    - `right`\n- `top`\n- `bottom`\n- `notext`（如图 5.7 所示，此值仅使用图标，隐藏链接或输入值中的文本。）\n\n\
    ![Image](img/05fig07.jpg)\n\n图 5.7。一个使用 `notext` data-iconpos 配合首页 data-icon 图标的按钮示例。\n\
    \n也可以通过 CSS 使用自定义图标。要创建自定义图标，你首先需要选择一个名称值。为了本次演示，我们将使用 `checkmark`。在使用了按钮插件的链接或输入框中，在\
    \ `data-icon` 属性中使用该值会生成一个 CSS 类。该 CSS 类在自定义值之前包含 `ui-icon-`，因此我们定义的自定义值的 CSS\
    \ 类为 `ui-icon-checkmark`。有了这个类，你可以轻松地定位到该类并添加背景图像作为图标：\n\n点击此处查看代码图像\n\n```css\n\
    .ui-icon-checkmark {\n    background-image: url(\"5-custom-icon.png\");\n}\n```\n\
    \n在设计图标时，你可能想要创建一个 18 × 18 像素带 alpha 透明度的 PNG-8 图片，以匹配内置的 jQuery Mobile 图标。图 5.8\
    \ 显示了自定义图标的示例。\n\n![Image](img/05fig08.jpg)\n\n图 5.8。一个自定义的点选图标。\n\n现在我们已经创建了这个图标以及与其关联的\
    \ CSS 类，可以将图标分配给按钮了。要将新图标分配给按钮，我们只需使用 `data-icon` 属性并设置为 `checkmark`：\n\n点击此处查看代码图像\n\
    \n```html\n<a href=\"#checkmark\" data-role=\"button\" data-icon=\"checkmark\"\
    >Checkmark example</a>\n```\n\n这段代码的最终结果与图 5.9 相似。\n\n![Image](img/05fig09.jpg)\n\
    \n图 5.9。一个自定义的点选图标。\n\n### 总结\n\n本章的内容是任何移动网站的基础。\n"
- fmt: "\nAnother noticeable difference is that the heading element includes a `ui-title`\
    \ class. This class sets a combination of properties that center the text, add\
    \ a margin, create ellipses for overflowing text, and more. The framework also\
    \ adds a `tabindex` that automatically makes the webpages more accessible by creating\
    \ a logical tabbing sequence, which is used by mobile devices like iOS with their\
    \ built-in Next button. Headers can also include elements other than headings;\
    \ buttons, for example, can be important additions to your toolbars.\n\n### Adding\
    \ buttons\n\nWith the button options discussed in [Chapter 5](#ch05.html_ch05),\
    \ “[[Dialog Windows and Buttons](#ch05.html_ch05),”,” and an unlimited number\
    \ of custom icons, you can address any functional requirements you can imagine.\
    \ Headers are a great location to prominently display important buttons in a mobile\
    \ web application, and it’s easy to do so using jQuery Mobile. The following example\
    \ shows how to add a Save button to a header element in a dialog window to edit\
    \ a user profile:\n\n[Click here to view code image](#images.html_p078pro01)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>Header Toolbar - jQuery Mobile:\
    \ Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\">\n            <h1>John Doe</h1>\n            <a href=\"#options-dialog\"\
    \ data-icon=\"gear\" class=\"ui-btn-right\" data-rel=\"dialog\">Edit Profile</a>\n\
    \        </div>\n        <div data-role=\"content\">\n            <p>123 E Street</p>\n\
    \            <p>Chicago, Il 60622</p>\n        </div>\n    </div>\n    <div data-role=\"\
    page\" id=\"options-dialog\">\n        <div data-role=\"header\">\n          \
    \  <h1>Edit John Doe</h1>\n            <a href=\"#\" data-icon=\"check\">Save</a>\n\
    \        </div>\n        <div data-role=\"content\">\n            <label for=\"\
    profile-image\">Profile Image</label>\n            <p><img src=\"assets/img/profile.png\"\
    ></p>\n            <input type=\"file\" id=\"profile-image\" name=\"profile-image\"\
    >\n            <label for=\"street-address\">Street Address</label>\n        \
    \    <input type=\"text\" id=\"street-address\" name=\"street-address\" value=\"\
    123 E Street\">\n            <label for=\"city\">City</label>\n            <input\
    \ type=\"text\" id=\"city\" name=\"city\" value=\"Chicago\">\n            <label\
    \ for=\"state\">State</label>\n            <input type=\"text\" id=\"state\" name=\"\
    state\" value=\"Il\">\n            <label for=\"zip-code\">Zip Code</label>\n\
    \            <input type=\"text\" id=\"zip-code\" name=\"zip-code\" value=\"6022\"\
    >\n        </div>\n    </div>\n</body>\n</html>\n```\n\nUsing the single-page\
    \ template, a second page is added and a hyperlink is set to open it as a dialog\
    \ from the default page. In the dialog window, the Save button is visually represented\
    \ by the `data-icon` attribute. The Option button in the default page uses a gear,\
    \ and the Save button uses a checkmark. [Figure 6.4](#ch06.html_ch06fig4) illustrates\
    \ a way to display an editable form in a dialog window to modify a user profile.\
    \ After updating the input, the user can click the Save button. You could put\
    \ code in place to process the user’s updates and store them in a database.\n\n\
    ![Image](graphics/jquery-6-4.jpg)\n\nFigure 6.4. A header toolbar with a Save\
    \ button.\n\nButtons can also be grouped, rather than displayed individually.\
    \ To group buttons, simply add a `div` as container around them and apply a `data-role`\
    \ with a value of `controlgroup` with a `data-type` set to `horizontal`:\n\n[Click\
    \ here to view code image](#images.html_p08pro01)\n\n```html\n<div data-role=\"\
    header\">\n    <div data-role=\"controlgroup\" data-type=\"horizontal\">\n   \
    \     <a href=\"#\" data-role=\"button\" data-icon=\"delete\">Delete</a>\n   \
    \     <a href=\"#\" data-role=\"button\" data-icon=\"check\">Save</a>\n    </div>\n\
    </div>\n```\n\nYou’ll also notice that there are `data-role` attributes set as\
    \ `button`. This attribute and value must be added to buttons within a `controlgroup`,\
    \ otherwise the hyperlinks won’t render as buttons. [Figure 6.5](#ch06.html_ch06fig05)\
    \ shows that this example renders a toolbar with a combined Delete and Save button,\
    \ so the two no longer appear separate.\n\n![Image](graphics/jquery-6-5.jpg)\n\
    \nFigure 6.5. Grouped buttons.\n\nMultiple groups can also be added to a toolbar\
    \ to visually separate the groups from one another:\n\n[Click here to view code\
    \ image](#images.html_p08pro01)\n\n```html\n<div data-role=\"header\">\n    <div\
    \ data-role=\"controlgroup\" data-type=\"horizontal\" class=\"align-left\">\n\
    \        <a href=\"#\" data-role=\"button\" data-icon=\"home\">Home</a>\n    \
    \    <a href=\"#\" data-role=\"button\" data-icon=\"arrow-l\">Back</a>\n    </div>\n\
    \    <div data-role=\"controlgroup\" data-type=\"horizontal\" class=\"align-right\"\
    >\n        <a href=\"#\" data-role=\"button\" data-icon=\"delete\">Delete</a>\n\
    \        <a href=\"#\" data-role=\"button\" data-icon=\"check\">Save</a>\n   \
    \ </div>\n</div>\n```\n\nThese groups of buttons are also using custom classes\
    \ that align one set left and the other right. The CSS for these classes is a\
    \ simple float left and a float right:\n\n```css\n<style type=\"text/css\">\n\
    .align-left {\n    float: left;\n}\n.align-right {\n    float: right;\n}\n</style>\n\
    ```\n\n[Figure 6.6](#ch06.html_ch06fig06) shows these two groups of buttons and\
    \ how they are separated in a header toolbar.\n\n![Image](graphics/jquery-6-6.jpg)\n\
    \nFigure 6.6. Multiple sets of grouped buttons.\n\n### Footer toolbars\n\nFooter\
    \ toolbars are like header toolbars except that they typically reside at the bottom,\
    \ rather than the top, of a webpage. They are often used to display copyright\
    \ notices and other similar information.\n\n```html\n<div data-role=\"footer\"\
    >\n    <h4>Copyright</h4>\n</div>\n```\n\nAs with page titles in header toolbars,\
    \ any text that’s added to the footer toolbar needs a heading element to include\
    \ spacing, alignment, and so on. The following code example shows the markup for\
    \ footer toolbars after it’s enhanced by the framework:\n\n[Click here to view\
    \ code image](#images.html_p08pro01)\n\n```html\n<div data-role=\"footer\" class=\"\
    ui-footer ui-a\" role=\"contentinfo\">\n    <h4 class=\"ui-title\" tabindex=\"\
    0\" role=\"heading\" aria-level=\"1\">Copyright</h4>\n</div>\n```\n\nAlthough\
    \ footer toolbars are a good place for copyrights and the like, it’s also possible\
    \ to include all the same markup as a header toolbar, including buttons, navbars,\
    \ and so on.\n\n### Positioning toolbars\n\nYou can position toolbars as fixed\
    \ or fullscreen. Fixed toolbars are always visible on the webpage. When a header\
    \ toolbar is fixed, it always appears at the top, even when the page is scrolled.\
    \ When a footer toolbar is fixed, it is always visible at the very bottom of the\
    \ web browser. To add fixed positioning to toolbars, all that’s needed is a `data-position`\
    \ attribute with a value of `fixed`:\n\n[Click here to view code image](#images.html_p08pro1)\n\
    \n```html\n<div data-role=\"page\">\n    <div data-role=\"header\" data-position=\"\
    fixed\">\n        <h1>Page Title</h1>\n    </div>\n    <div data-role=\"content\"\
    >\n        <p>Body Copy</p>\n    </div>\n    <div data-role=\"footer\" data-position=\"\
    fixed\">\n        <h4>Copyright</h4>\n    </div>\n</div>\n```\n\n[Figure 6.7](#ch06.html_ch06fig07)\
    \ shows how these toolbars render in a web browser.\n\n![Image](graphics/jquery-6-7.jpg)\n\
    \nFigure 6.7. Fixed toolbars.\n\nThe result of this code functions like fixed\
    \ positioning works with CSS, but jQuery Mobile doesn’t use CSS for this functionality.\
    \ Since fixed positioning is not supported by many mobile browsers, jQuery Mobile\
    \ uses dynamic repositioning instead.\n"
