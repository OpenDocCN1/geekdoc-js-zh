  trans: "\n\n此示例使用了默认搜索标准来记录文本和 `searchValue` 以供测试。除去 `console.log` 之后，这正是 jQuery\
    \ Mobile 在用户输入搜索过滤栏时用于过滤结果的完全精确代码。首先，将文本转换为小写以实现不区分大小写的搜索，然后使用 JavaScript 原生的\
    \ `indexOf` 函数在文本中查找与 `searchValue` 匹配的字符串。\n\n现在让我们来看看如何编写自定义回调函数。这次，我们将使用上一个示例中的自定义格式化\
    \ `listview`，并对其应用过滤器，该过滤器仅搜索正文内容，而将列表项标题排除在搜索条件之外：\n\n点击此处查看代码图像\n\n```javascript\n\
    $(document).bind(\"mobileinit\", function() {\n    $.mobile.listview.prototype.options.filterCallback\
    \ = onlyBody;\n});\n\nfunction onlyBody( text, searchValue ) {\n    var splitText\
    \ = text.trim().split(\"\\n\");\n    console.log(\"text: \"+ splitText[1]);\n\
    \    return splitText[1].toLowerCase().indexOf( searchValue ) === -1;\n};\n\n\
    String.prototype.trim = function() {\n    return this.replace(/^\\s+|\\s+$/g,\"\
    \");\n}\n```\n\n在例示例中，我们只需要等待 `mobileinit` 事件，因为所有 `listviews` 的 `filterCallback`\
    \ 属性在 jQuery Mobile 框架增强页面标记之前就可以访问了。（在上一个示例中，我们针对的特定 `listview` 必须在框架对其进行增强后才能访问。）一旦触发了\
    \ `mobileinit` 事件，我们将 `filterCallback` 设置为 `onlyBody`，这是一个自定义回调函数，它的结构可以像任何其他函数一样，但它将接收两个参数：`text`\
    \ 和 `searchValue`。通过这些参数，我们可以编写任何所需的规则。在这种情况下，我们将拆分 `text` 参数，并仅对包含之前的自定义格式列表示例中\
    \ `p` 元素中的正文内容匹配结果。\n\n除了创建自定义过滤回调函数外，jQuery Mobile 还提供了一个名为 `data-filtertext`\
    \ 的属性用于过滤列表项。该属性的之处在于，它实际上是发送给 `filterCallback` 函数的文本值。换句话说，`data-filtertext`\
    \ 属性中的值变成了 `filterCallback` 函数在比较期间使用的值：\n\n点击此处查看代码图像\n\n```html\n<ul data-role=\"\
    listview\" data-filter=\"true\">\n    <li data-filtertext=\"AL\">Alabama</li>\n\
    \    <li data-filtertext=\"AK\">Alaska</li>\n    <li data-filtertext=\"AZ\">Arizona</li>\n\
    \    <li data-filtertext=\"AR\">Arkansas</li>\n    <li data-filtertext=\"CA\"\
    >California</li>\n    <li data-filtertext=\"CO\">Colorado</li>\n    <li data-filtertext=\"\
    CT\">Connecticut</li>\n    <li data-filtertext=\"DE\">Delaware</li>\n</ul>\n```\n\
    \n此示例中的标记使用 `data-filtertext` 属性通过州缩写而不是列表项的完整州名值来过滤列表。图 9.5 显示了此过滤器是如何工作的；输入“ar”通常会产生“Arizona”和“Arkansas”，但由于此列表是通过州缩写过滤的，因此“Arkansas”是唯一的匹配项。\n\
    \n![Image](img/jquery-9-5.jpg)\n\n图 9.5。在应用 `data-filtertext` 属性后，搜索标准可以与实际列表项值不同。\n\
    \n### 总结\n\n搜索过滤栏提供了如果通过编程来实现将相当复杂且耗时的功能。jQuery Mobile 让添加甚至自定义此项功能变得极其简单。除了节省时间外，此小部件还为任何大量数据提供了额外价值，并提供了极佳的可用性增强，帮助用户快速高效地找到他们需要的内容。有时，无法精简所有需要放在移动网站上的内容。当出现这种情况且你有一个非常长、似乎几乎无法使用的列表时，搜索过滤栏将是处理该问题的绝佳方法。\n\
    \n## 10. 表单元素\n\njQuery Mobile 框架为每个表单元素暴露了许多内部方法和事件，这意味着你可以从自定义代码中访问它们。这些方法和事件允许你更改和扩展\
    \ jQuery Mobile 表单元素的核心功能，创建让你的移动应用程序与众脱颖出的定制功能。本章涵盖了你可以使用的每个暴露表单元素方法和事件。\n\n\
    ### 文本输入\n\njQuery Mobile 支持许多不同的文本输入类型，包括 HTML5 输入，如数字、电子邮件、URL、电话以及一些与时间和日期相关的输入。框架增强了所有表单元素，使其在移动设备上更易用。识别具有特定元素类型的表单元素的一个主要优势是键盘会变化。以下是不同的文本输入以及经过\
    \ jQuery Mobile 增强后关联 iOS 键盘的一些示例。\n\n设置元素类型是通过添加名为 `type` 的属性完成的。以下是不同的文本输入以及经过\
    \ jQuery Mobile 增强后关联 iOS 键盘的一些示例。\n\n设置元素类型是通过添加名为 `type` 的属性完成的。这里：\n\n点击此处查看代码图像\n\
    \n```html\n<input type=\"number\">\n```\n\n当 `type` 设置为 `number` 时，iOS 会显示数字键盘。图\
    \ 10.1\n\n![Image](img/jquery-10-1)\n\n图 10.1 当 `type` 设置为 `number` 时的数字键盘。\n\n\
    设置元素类型是通过添加名为 `type` 的属性完成的。这里：\n\n点击此处查看代码图像\n\n```html\n<input type=\"number\"\
    \ pattern=\"0-9]*\">\n```\n\n当 `type` 设置为 `number` 时，iOS 显示数字键盘。图 10.2\n\n![Image](img/jquery-10-2)\n\
    \n图 10.2 应用了 `pattern` 属性时的数字键盘。\n\n设置元素类型是通过添加名为 `type` 的属性完成的。这里：\n\n点击此处查看代码图像\n\
    \n```html\n<input type=\"email\">\n```\n\n当 `type` 设置为 `email` 时，iOS 包含带有 `@`\
    \ 符号和句点的字母键盘。图 10.3\n\n![Image](img/jquery-10-3)\n\n图 10.3 用于电子邮件的 `@` 和 `.` 字母键盘。\n\
    \n### jQuery Mobile 1.1.0\n\n在本书出版之前，jQuery Mobile 框架发布了一个新版本 1.1.0 正式版。为了从一些新的表单元素选项中受益，当需要在页面中包含框架、CSS\
    \ 和 jQuery 时必须使用以下代码：\n\n点击此处查看代码图像\n\n```html\n<link rel=\"stylesheet\" href=\"\
    http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.css\" />\n<script\
    \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"></script>\n\
    <script src=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js\"\
    ></script>\n```\n\njQuery Mobile 框架不断升级。在启动项目之前，检查 jquerymobile.com 上的下载页面以确保拥有最新的代码。\n\
    \n*   `url` 元素类型显示带有正斜杠和 .com 键的字母键盘。图 10.4。\n*   `tel` 元素类型显示用于电话号码的电话键盘。图 10.5。\n\
    \n"
- fmt: "\nThe `time`, `month`, `date`, and `datetime` element types all reveal a menu\
    \ that corresponds with the appropriate value ([Figure 10.6](#ch10.html_ch10fig06)).\n\
    \n![Image](graphics/jquery-10-5.jpg)\n\nFigure 10.5\\. A telephone keypad for\
    \ phone numbers.\n\n![Image](graphics/jquery-10-6.jpg)\n\nFigure 10.6\\. The time-\
    \ and date-related menus in iOS.\n\n### Options\n\nText inputs include two options:\
    \ `initSelector` and `theme`. Both are available when accessing `textinput` through\
    \ the `$.mobile` object. The following code shows how to access the options through\
    \ the `textinput`:\n\n[Click here to view code image](#images.html_p137pro01)\n\
    \n```\n$.mobile.textinput.prototype.options\n```\n\nOnce you have access to the\
    \ options, you can access each of them individually. For example, if you want\
    \ the `initSelector` option, you can append the option to the end of the previous\
    \ line of code:\n\n[Click here to view code image](#images.html_p137pro02)\n\n\
    ```\n$.mobile.textinput.prototype.options.initSelector\n```\n\nThe `initSelector`\
    \ option defines the selectors that are initialized when the framework is initialized.\
    \ The fact that this option is exposed is what lets you define what selectors\
    \ you want initialized as text inputs. This gives you great control over core\
    \ functionality, allowing you to define what is initialized based on your specific\
    \ situation, which ultimately minimizes initialization time. Not only can you\
    \ define what element types are initialized, you can do the same for data roles.\
    \ The following code leaves out all `number` element types as `textinputs`:\n\n\
    [Click here to view code image](#images.html_p137pro03)\n\n```javascript\n$( document\
    \ ).bind(\"mobileinit\", function() {\n    $.mobile.textinput.prototype.options.initSelector\
    \ = \"input[type='text'], input[type='search'], :jqmData(type='search'), input[type='password'],\
    \ input[type='email'], input[type='url'], input[type='tel'], textarea, input:not([type])\"\
    ;\n});\n```\n\n***\n\n![Image](graphics/note.jpg) Note\n\nA number of different\
    \ element types can be created with the `textinput` element in jQuery Mobile,\
    \ including `text`, `search`, `number`, `password`, `email`, `url`, and `tel`.\
    \ In addition to these, the `textarea` is grouped into the `textinput` form element\
    \ category in jQuery Mobile. This means that each element type includes the options,\
    \ methods, and events in the text input section of this chapter.\n\n***\n\n[Figure\
    \ 10.7](#ch10.html_ch10fig07) shows an example of the `number` element type without\
    \ the enhancements.\n\n![Image](graphics/jquery-10-7.jpg)\n\nFigure 10.7\\. A\
    \ number element without enhancements from the jQuery Mobile framework.\n\nWith\
    \ the enhancements, the `number` element looks much nicer and is easier for users\
    \ to interact with in a mobile environment ([Figure 10.8](#ch10.html_ch10fig08)).\n\
    \n![Image](graphics/jquery-10-8.jpg)\n\nFigure 10.8\\. A number element with enhancements\
    \ from the jQuery Mobile framework.\n\nThe `textinput` also includes a `theme`\
    \ option, which you can access when selecting a text input element. The value\
    \ of the `theme` can be set based on any prebuilt or custom swatch that includes\
    \ a–z:\n\n[Click here to view code image](#images.html_p138pro01)\n\n```javascript\n\
    $('.my-textinput').textinput({theme: 'a'});\n```\n\nThis example accesses a text\
    \ input element with a class name of `.my-textinput` and sets the theme to `a`.\
    \ You’ll learn more about themes in the next chapter.\n\nAs of version 1.1.0,\
    \ jQuery Mobile also includes two new options: `mini` and `preventFocusZoom`.\
    \ These can also be set on an individual form element by using the `data-` attribute\
    \ named `mini`. Setting a form element to `mini` creates a more compact version\
    \ of it. To set a form element to `mini` with code, simply select the text input(s),\
    \ then use the `textinput` method to set the value of `mini`:\n\n[Click here to\
    \ view code image](#images.html_p138pro02)\n\n```javascript\n$('.my-textinput').textinput({mini:\
    \ true});\n```\n\nThe result of this code on a text input looks similar to the\
    \ right input in [Figure 10.9](#ch10.html_ch10fig09), which shows a comparison\
    \ of the regular and `mini` text inputs.\n\n![Image](graphics/jquery-10-9.jpg)\n\
    \nFigure 10.9\\. Regular and mini text inputs.\n\nThe final option in the text\
    \ input is the `preventFocusZoom` Boolean. When set to `true` in iOS only, this\
    \ option prevents the webpage from becoming zoomed in when a user selects a text\
    \ input. This is not the default: Usually iOS zooms the webpage into the input,\
    \ providing complete focus on the form element. This behavior is often unnecessary,\
    \ so luckily the jQuery Mobile team has provided an option for disabling it. You\
    \ can also set this option on an individual form element by using the `data-`\
    \ attribute named `prevent-focus-zoom`:\n\n[Click here to view code image](#images.html_p139pro01)\n\
    \n```javascript\n$('.my-textinput').textinput({preventFocusZoom: true});\n```\n\
    \nIn addition to these options, the text input has a specific `clearSearchText`\
    \ that can be used to clear the search. Simply set it as we’ve done:\n\n[Click\
    \ here to view code image](#images.html_p139pro02)\n\n```javascript\n$('.my-textinput').textinput({clearSearchText:\
    \ 'this can be any text'});\n```\n\n### Methods\n\njQuery Mobile exposes two methods\
    \ for `textinput`: `enable` and `disable`. The `enable` method activates the input\
    \ and lets the user enter it:\n\n```javascript\n$('.my-textinput').textinput('enable');\n\
    ```\n\nWhen a text input is disabled, the user can’t interact with it:\n\n```javascript\n\
    $('.my-textinput').textinput('disable');\n```\n\nWe’ve already seen an enabled\
    \ text input in [Figure 10.8](#ch10.html_ch10fig08); a disabled element looks\
    \ like [Figure 10.10](#ch10.html_ch10fig10). (Wait, figure below)\n\n### Events\n\
    \nText inputs can also be bound with virtual events or standard JavaScript events.\
    \ JavaScript events that can be bound to a text input include `focus`, `blur`,\
    \ and `change`. Virtual events are covered later in the book and include `vmouseover`,\
    \ `vmousedown`, `vmousemove`, `vmouseup`, `vclick`, and `vmcancel`. To bind an\
    \ event to a text input, simply use the `bind` method, include the event you’re\
    \ binding, and tie it to a function handler:\n\n```javascript\n$(\".my-textinput\"\
    ).bind(\"change\", function(event, ui) {\n    console.log('my-textinput has changed');\n\
    });\n```\n\njQuery Mobile also adds custom events to some form elements. The text\
    \ input includes a `create` event as its custom event. The `create` event can\
    \ be used to execute custom code when a text input is created:\n\n```javascript\n\
    $('.my-textinput').textinput({\n    create: function(event, ui) {\n        console.log('my-textinput\
    \ has been created');\n    }\n});\n```\n"
  raw: 'The `time`, `month`, `date`, and `datetime` element types all reveal a menu
    that corresponds with the appropriate value (**[Figure 10.6](#ch10.html_ch10fig06)**).


    ![Image](graphics/jquery-10-5.jpg)


    Figure 10.5\. A telephone keypad for phone numbers.


    ![Image](graphics/jquery-10-6.jpg)


    Figure 10.6\. The time- and date-related menus in iOS.


    #### Options


    Text inputs include two options: `initSelector` and `theme`. Both are available
    when accessing `textinput` through the `$.mobile` object. The following code shows
    how to access the options through the `textinput`:


    [Click here to view code image](#images.html_p137pro01)


    $.mobile.textinput.prototype.options


    Once you have access to the options, you can access each of them individually.
    For example, if you want the `initSelector` option, you can append the option
    to the end of the previous line of code:


    [Click here to view code image](#images.html_p137pro02)


    $.mobile.textinput.prototype.options.initSelector


    The `initSelector` option defines the selectors that are initialized when the
    framework is initialized. The fact that this option is exposed is what lets you
    define what selectors you want initialized as text inputs. This gives you great
    control over core functionality, allowing you to define what is initialized based
    on your specific situation, which ultimately minimizes initialization time. Not
    only can you define what element types are initialized, you can do the same for
    data roles. The following code leaves out all `number` element types as `textinputs`:


    [Click here to view code image](#images.html_p137pro03)


    $( document ).bind("mobileinit", function() {


        $.mobile.textinput.prototype.options.initSelector = "input[type=''text''],
    input[type=''search''], :jqmData(type=''search''), input[type=''password''], input[type=''email''],
    input[type=''url''], input[type=''tel''], textarea, input:not([type])";


    });


    * * *


    ![Image](graphics/note.jpg) Note


    A number of different element types can be created with the `textinput` element
    in jQuery Mobile, including `text`, `search`, `number`, `password`, `email`, `u`rl,
    and `tel`. In addition to these, the `textarea` is grouped into the `textinput`
    form element category in jQuery Mobile. This means that each element type includes
    the options, methods, and events in the text input section of this chapter.


    * * *


    **[Figure 10.7](#ch10.html_ch10fig07)** shows an example of the `number` element
    type without the enhancements.


    ![Image](graphics/jquery-10-7.jpg)


    Figure 10.7\. A number element without enhancements from the jQuery Mobile framework.


    With the enhancements, the `number` element looks much nicer and is easier for
    users to interact with in a mobile environment (**[Figure 10.8](#ch10.html_ch10fig08)**).


    ![Image](graphics/jquery-10-8.jpg)


    Figure 10.8\. A number element with enhancements from the jQuery Mobile framework.


    The `textinput` also includes a theme option, which you can access when selecting
    a text input element. The value of the theme can be set based on any prebuilt
    or custom swatch that includes a–z:


    [Click here to view code image](#images.html_p138pro01)


    $(''.my-textinput'').textinput({theme: ''a''});


    This example accesses a text input element with a class name of `.my-textinput`
    and sets the theme to `a`. You’ll learn more about themes in the next chapter.


    As of version 1.1.0, jQuery Mobile also includes two new options: `mini` and `preventFocusZoom`.
    These can also be set on an individual form element by using the `data-` attribute
    named `mini`. Setting a form element to `mini` creates a more compact version
    of it. To set a form element to `mini` with code, simply select the text input(s),
    then use the `textinput` method to set the value of `mini`:


    [Click here to view code image](#images.html_p138pro02)


    $(''.my-textinput'').textinput({mini: true});


    The result of this code on a text input looks similar to the right input in **[Figure
    10.9](#ch10.html_ch10fig09)**, which shows a comparison of the regular and `mini`
    text inputs.


    ![Image](graphics/jquery-10-9.jpg)


    Figure 10.9\. Regular and mini text inputs.


    The final option in the text input is the `preventFocusZoom` Boolean. When set
    to `true` in iOS only, this option prevents the webpage from becoming zoomed in
    when a user selects a text input. This is not the default: Usually iOS zooms the
    webpage into the input, providing complete focus on the form element. This behavior
    is often unnecessary, so luckily the jQuery Mobile team has provided an option
    for disabling it. You can also set this option on an individual form element by
    using the `data-` attribute named `prevent-focus-zoom`:


    [Click here to view code image](#images.html_p139pro01)


    $(''.my-textinput'').textinput({preventFocusZoom: true});


    In addition to these options, the search input in particular has a specific option
    called `clearSearchButtonText` that can be used to clear the search input text.
    Simply set it as we’ve done with previous options:


    [Click here to view code image](#images.html_p139pro02)


    $(''.my-textinput'').textinput({clearSearchButtonText: ''this can be any custom
    text''});


    #### Methods


    jQuery Mobile exposes two simple methods for the `textinput` element: `enable`
    and `disable`. The `enable` method activates the input and lets the user enter
    the text input and type in it:


    [Click here to view code image](#images.html_p139pro03)


    $(''.my-textinput'').textinput(''enable'');


    When a text input is disabled, the user can’t interact with it:


    [Click here to view code image](#images.html_p139pro04)


    $(''.my-textinput'').textinput(''disable'');


    We’ve already seen an enabled text input in [Figure 10.8](#ch10.html_ch10fig08);
    a disabled element looks like **[Figure 10.10](#ch10.html_ch10fig10)**.


    ![Image](graphics/jquery-10-10.jpg)


    Figure 10.10\. A disabled text input element.


    #### Events


    Text inputs can also be bound with virtual events or standard JavaScript events.
    JavaScript events that can be bound to a text input include `focus`, `blur`, and
    `change`. Virtual events are covered later in the book and include `vmouseover`,
    `vmousedown`, `vmousemove`, `vmouseup`, `vclick`, and `vmousecancel`. These events
    are more relevant to mobile devices that don’t include a mouse. To bind an event
    to a text input, simply use the `bind` method, include the event that you’re binding,
    and tie it to a function handler:


    [Click here to view code image](#images.html_p140pro01)


    $(".my-textinput").bind("change", function(event, ui) {


        console.log(''my-textinput has changed'');


    });


    jQuery Mobile also adds custom events to some form elements. The text input includes
    a `create` event as its custom event. The `create` event can be used to execute
    custom code when a text input is created.


    [Click here to view code image](#images.html_p140pro02)


    $(".my-textinput").textinput({


        create: function(event, ui) {


            console.log(''my-textinput has been created'');


        }


    });


    ### Checkboxes and Radio Buttons


    Checkboxes and radio buttons are similar in their options and markup. The main
    difference is that you can select only a single radio button from a group. However,
    you can select one, many, or all checkboxes in a group. Each element type has
    the same layout options. For example, when you add a label and a checkbox or a
    label and a radio button, you’ll receive the label and the element embedded in
    a button:


    [Click here to view code image](#images.html_p141pro01)


    <label for="my-radio">Radio button example</label>


    <input type="radio" name="name" id="my-radio" class="my-radio" />


    <label for="my-checkbox">Checkbox example</label>


    <input type="checkbox" name="name" id="my-checkbox" class="my-checkbox" />


    The result of this code can be seen in **[Figure 10.11](#ch10.html_ch10fig11)**.


    ![Image](graphics/jquery-10-11.jpg)


    Figure 10.11\. The layout and sequence from selecting a radio button and checkbox.'
