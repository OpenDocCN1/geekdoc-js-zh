    **[Figure 7.3](#ch07.html_ch07fig03)** shows the result of this code, which looks
    much nicer than the previous examples, adding styling updates that enhance the
    grid.


    ![Image](graphics/jquery-7-3.jpg)


    Figure 7.3\. A two-column grid with the ui-bar class.


    Adding custom CSS to a grid column is simple. Since the grid is standard HTML
    markup, you can append a custom CSS class to any of the elements. In the following
    example, a custom class `block-title` has been added to the first column and another
    class has been added to all `div` elements in the grid:


    [Click here to view code image](#images.html_p093pro01)


    <!DOCTYPE html>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>Grids - jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


        <style type="text/css">


        .ui-grid-a div {


            background-color: #ccc;


        }


        .ui-grid-a div.block-title {


            background-color: #fff;


        }


        </style>


    </head>


    <body>


        <div data-role="page">


            <div data-role="header" data-position="fixed">


                <h1>My Page Title</h1>


            </div>


            <div data-role="content">


                <div class="ui-grid-a">


                    <div class="ui-block-a block-title">2-Column</div>


                    <div class="ui-block-b">Column</div>


                </div>


            </div>


            <div data-role="footer" data-position="fixed">


                <h4>Copyright</h4>


            </div>


        </div>


    </body>


    </html>


    The result of this code will look similar to **[Figure 7.4](#ch07.html_ch07fig04)**.


    ![Image](graphics/jquery-7-4.jpg)


    Figure 7.4\. A two-column grid with custom CSS applied.


    Using a two-column grid would have been a better way to handle the functionality
    for the button groups discussed in [Chapter 5](#ch05.html_ch05), “[Dialog Windows
    and Buttons](#ch05.html_ch05).” Rather than using floats to align the control
    groups, you could use the grid to separate them. The following code shows how
    a grid could be used to create layouts within a toolbar:


    [Click here to view code image](#images.html_p095pro01)


    <!DOCTYPE html>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>Grid with controlgroup - jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


        <style type="text/css">


            .ui-grid-a .ui-block-b {


                text-align: right;


            }


        </style>


    </head>


    <body>


        <div data-role="page">


            <div data-role="header">


                <div class="ui-grid-a">


                    <div class="ui-block-a">


                        <div data-role="controlgroup" data-type="horizontal">


                            <a href="#" data-role="button" data-icon="home">Home</a>


                            <a href="#" data-role="button" data-icon="arrow-l">Back</a>


                        </div>


                    </div>


                    <div class="ui-block-b">


                        <div data-role="controlgroup" data-type="horizontal">


                            <a href="#" data-role="button" data-icon="delete">Delete</a>


                            <a href="#" data-role="button" data-icon="check">Save</a>


                        </div>


                    </div>


                </div>


            </div>


            <div data-role="content">


                <p>Body Copy</p>


            </div>


            <div data-role="footer" data-position="fixed">


                <h4>Copyright</h4>


            </div>


        </div>


    </body>


    </html>


    **[Figure 7.5](#ch07.html_ch07fig05)** shows the visual result of this code.


    ![Image](graphics/jquery-7-5.jpg)


    Figure 7.5\. A grid being used to separate button control groups.


    #### Grid rows


    jQuery Mobile also lets you create grids with multiple rows. The same rules apply
    as with the classes used for columns; however, rows are defined by each new set
    of blocks that you add to a grid. For example, to create a four-column grid, the
    `ui-grid-c` class must be used as usual. Inside the grid is where things get different:
    simply repeat sets of block columns. In this case, it’ll be multiple block sets
    in a four-column layout. The following example shows a four-column grid with two
    rows:


    [Click here to view code image](#images.html_p097pro01)


    <div class="ui-grid-c">


        <div class="ui-block-a">


            <div class="ui-bar ui-bar-b">A</div>


        </div>


        <div class="ui-block-b">


