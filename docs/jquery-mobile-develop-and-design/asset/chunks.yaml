  trans: "\n\njQuery Mobile 有一个包含五个色块（swatches）的主题系统，这些色块由字母“a”到“e”定义。单个网页中混合使用这些色块以实现完全自定义。默认色块都包含颜色和纹理、内边距以及预定义的尺寸，以便将它们区分开来。表\
    \ 11.1\n\n使用色块就像使用 `data-theme` 属性一样简单，它可以用于任何带有 jQuery Mobile 框架的 HTML 元素。以下代码显示了一组五个按钮，每个按钮都有不同的默认主题：\n\
    \n点击查看代码图像\n\n```html\n<a href=\"#\" data-role=\"button\" data-theme=\"a\">Swatch\
    \ A</a>\n<a href=\"#\" data-role=\"button\" data-theme=\"b\">Swatch B</a>\n<a\
    \ href=\"#\" data-role=\"button\" data-theme=\"c\">Swatch C</a>\n<a href=\"#\"\
    \ data-role=\"button\" data-theme=\"d\">Swatch D</a>\n<a href=\"#\" data-role=\"\
    button\" data-theme=\"e\">Swatch E</a>\n```\n\n无论这是一组按钮、列表项还是栏，jQuery Mobile 框架都赋予了你为这些项目定义不同主题的能力。图\
    \ 11.1 显示了示例中的按钮组。你可以看到，每个按钮根据其分配的主题具有不同的颜色。\n\n![Image](img/jquery-11-1.jpg)\n\
    \n图 11.1 分配了不同主题色块的按钮组。\n\n你可以更新现有的色块或创建自定义色块。要创建自定义色块，只需从 jQuery Mobile 样式表中复制一个现有主题色块并将其更新为尚未作为默认色块使用的字母（即“f”到“z”或任何自定义名称）。首先，你需要在表中找到想要复制的色块；在本例中我们使用“a”色块。我们要获取色块的样式表是全书中一直附加到所有示例中的那一个。唯一的区别是，我们将查看未压缩的版本，以便更容易找到色块的开始和结束位置。你可以在\
    \ [`code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.css`](http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.css)\
    \ 找到该样式表的未压缩版本，这与一直以来包含的地址相同，只是缺少了文件名中的 `.min` 部分。要创建色块的副本，只需将许多 CSS 色块类复制粘贴到新的\
    \ CSS 文件中，对后缀 `-a` 进行搜索并替换，替换为“f”到“z”之间的字母。例如，要创建一个“f”色块，你会将 `-a` 搜索并替换为 `-f`，所有的\
    \ CSS 色块类将得到更新，从而得到一个新的“f”色块。以下是 `ui-bar` 类在为“f”色块修改后的示例：\n\n点击查看代码图像\n\n```css\n\
    .ui-bar-f {\n    border: 1px solid #cccccc;\n    background: #cccccc;\n    color:\
    \ #cccccc;\n    font-weight: bold;\n    text-shadow: 0 -1px 1px #000000;\n   \
    \ background-image: -webkit-gradient(linear, left top, left bottom, from(#cccccc),\
    \ to(#999));\n    background-image: -webkit-linear-gradient(#cccccc, #999);\n\
    \    background-image:      -moz-linear-gradient(#cccccc, #999);\n    background-image:\
    \      -ms-linear-gradient(#cccccc, #999);\n    background-image:      -o-linear-gradient(#cccccc,\
    \ #999);\n    background-image:          linear-gradient(#cccccc, #999);\n}\n\
    ```\n\n现在由你来自定义这些类的属性。一旦你有了新色块，就可以像下方的按钮示例一样在任何 jQuery Mobile 元素上轻松使用：\n\n点击查看代码图像\n\
    \n```html\n<a href=\"#\" data-role=\"button\" data-theme=\"f\">Custom Swatch F</a>\n\
    ```\n\n### ThemeRoller\n\n创建自定义色块的另一种方法是使用 ThemeRoller 工具，它让你能够在简单的界面中创建一个包含多个自定义色块的整个主题。\n\
    \n![Image](img/tip.jpg)\n\nThemeRoller 工具是创建自定义主题的一种简单方法，但可能很难理解底层的 CSS。ThemeRoller\
    \ 提供了一个视觉化界面，无需编写任何代码即可修改颜色、字体、圆角等。\n\n"
- fmt: "\n[Figure 11.4](#ch11.html_ch11fig04) shows the result of this modified markup\
    \ with the `data-theme`.\n\n![Image](graphics/jquery-11-4.jpg)\n\nFigure 11.4\\\
    . The “b” swatch applied to the page component and header and footer toolbars.\n\
    \nLike pages, any components included in the toolbar inherit the toolbar’s theme.\
    \ The following example shows a header with a button that has a different theme\
    \ and the home icon:\n\n[Click here to view code image](#images.html_p162pro02)\n\
    \n```html\n<div data-role=\"header\" data-theme=\"b\">\n       <h1>jQueryMobile.tv</h1>\n\
    \       <a href=\"#\" data-theme=\"e\" data-icon=\"home\">Home</a>\n</div>\n```\n\
    \nThis markup creates a button that stands out against the toolbar theme [Figure\
    \ 11.5](#ch11.html_ch11fig05).\n\n![Image](graphics/jquery-11-5.jpg)\n\nFigure\
    \ 11.5\\. A toolbar component with a button that has a different data-theme swatch.\n\
    \n### Content theming\n\nThe main content area or any element that includes a\
    \ `data-role` of `content` can be themed by adding a `data-theme` attribute. This\
    \ allows the content area to override the inherited page component’s theme for\
    \ itself and its components. The following example shows how the content theme,\
    \ as well as any component it contains, can override the page theme:\n\n[Click\
    \ here to view code image](#images.html_p163pro01)\n\n```html\n<div data-role=\"\
    page\" data-theme=\"b\">\n       <div data-role=\"header\" data-theme=\"b\">\n\
    \              <h1>jQueryMobile.tv</h1>\n              <a href=\"#\" data-theme=\"\
    e\" data-icon=\"home\">Home</a>\n       </div></div>\n       <div data-role=\"\
    content\" data-theme=\"d\">\n              <h3>Header</h3>\n              <p>This\
    \ is a sample with the \"b\" swatch applied to the page and toolbars and the \"\
    d\" swatch applied to the content area.</p>\n              <a href=\"#\" data-role=\"\
    button\" data-inline=\"true\">Button</a>\n       </div>\n       <div data-role=\"\
    footer\" data-theme=\"b\"><h2>Copyright</h2></div>\n</div>\n```\n\nNotice how\
    \ the page uses the “b” swatch, while the content area uses the “d” swatch. [Figure\
    \ 11.6](#ch11.html_ch11fig06) shows how the content component and its components\
    \ override the inherited page component theme.\n\n![Image](graphics/jquery-11-6.jpg)\n\
    \nFigure 11.6\\. A page with a content area that has a different theme than itself.\n\
    \nIn addition to a standard content area, the collapsible content area can include\
    \ a custom theme to differentiate it from its parent:\n\n[Click here to view code\
    \ image](#images.html_p164pro01)\n\n```html\n<div data-role=\"page\" data-theme=\"\
    b\">\n       <div data-role=\"header\" data-theme=\"b\">\n              <h1>jQueryMobile.tv</h1>\n\
    \              <a href=\"#\" data-theme=\"e\" data-icon=\"home\">Home</a>\n  \
    \     </div></div>\n       <div data-role=\"content\" data-theme=\"d\">\n    \
    \          <h3>Header</h3>\n              <p>This is a sample with the \"b\" swatch\
    \ applied to the page and toolbars and the \"d\" swatch applied to the content\
    \ area.</p>\n              <div data-role=\"collapsible\" data-collapsed=\"true\"\
    \ data-theme=\"c\" data-content-theme=\"c\">\n                     <h3>Collapsible\
    \ header</h3>\n                     <p>I use the data-content-theme to match my\
    \ header</p>\n                </div></div>\n       </div>\n       <div data-role=\"\
    footer\" data-theme=\"b\"><h2>Copyright</h2></div>\n</div>\n```\n\nBy default,\
    \ the header of the collapsible content area includes the custom `data-theme`;\
    \ but without `data-content-theme`, the body of the collapsible content area remains\
    \ the same as containing area. [Figure 11.7](#ch11.html_ch11fig07) shows an example\
    \ of the collapsible content area with a custom `data-theme` and `data-content-theme`,\
    \ so that both match.\n\n![Image](graphics/jquery-11-7.jpg)\n\nFigure 11.7\\.\
    \ A page with a collapsible content area.\n\n### Form and form element theming\n\
    \njQuery Mobile lets you create individual forms and elements. Like everything\
    \ else, forms and form elements inherit the swatch theme of the page component\
    \ they’re contained within. However, `data-theme` can be used to customize the\
    \ look and feel of an individual form, all forms, or certain form elements. Let’s\
    \ start by theming an entire form. The following code shows an example of a form\
    \ that includes the “e” theme, while the page component includes the “b” theme.\
    \ Notice that the form element includes its own `data-role`, otherwise the form\
    \ would inherit the `data-theme` of containing content area:\n\n```html\n<div\
    \ data-role=\"page\" data-theme=\"b\">\n       <div data-role=\"header\" data-theme=\"\
    b\">\n              <h1>jQueryMobile.tv</h1>\n              <a href=\"#\" data-theme=\"\
    e\" data-icon=\"home\">Home</a>\n       </div></div>\n       <div data-role=\"\
    content\" data-theme=\"d\">\n              <p>This content area includes the \"\
    d\" swatch.</p>\n              <form data-role=\"content\" data-theme=\"e\">\n\
    \                    <label for=\"my-text-input\">Text input</label>\n       \
    \             <input type=\"text\" name=\"name\" id=\"my-text-input\" value=\"\
    \" />\n                    <a href=\"#\" type=\"submit\" data-role=\"button\"\
    \ data-inline=\"true\">Button</a>\n              </form>\n       </div>\n       <div\
    \ data-role=\"footer\" data-theme=\"b\"><h2>Copyright</h2></div>\n</div>\n```\n\
    \nIt’s useful to be able to assign different `data-theme` values to nested content\
    \ areas. The form shows how these might be used to differentiate certain content\
    \ [Figure 11.8](#ch11.html_ch11fig08).\n\n![Image](graphics/jquery-11-8.jpg)\n\
    \nFigure 11.8\\. A form that contains its own data-theme, separate from its content\
    \ area.\n\nTo change the swatch on an individual form element, simply apply the\
    \ `data-theme` to the actual element.\n\n[Click here to view code image](#images.html_p166pro01)\n\
    \n```html\n<a href=\"#\" type=\"submit\" data-role=\"button\" data-inline=\"true\"\
    \ data-theme=\"b\">Button\n\n```\n\nThis sets the button to a different theme\
    \ from the rest of the form. In this case, it helps identify the button within\
    \ the form, drawing attention to it visually [Figure 11.9](#ch11.html_ch11fig09).\n\
    \n![Image](graphics/jquery-11-9.jpg)\n\nFigure 11.9\\. Setting an individual form\
    \ element’s swatch value using the data-theme attribute.\n\n### List\n\nLists\
    \ are probably the most complex component in jQuery Mobile, because they’re the\
    \ only element that includes additional attributes for theme options. For example,\
    \ the `listview` can contain not only list items, but also dividers, count bubbles,\
    \ and split buttons, all of which have their own theme options, as we’ll see in\
    \ this section. First, like the previous components discussed in this chapter,\
    \ the `listview` itself can contain a `data-theme`, which will be inherited by\
    \ any of its contained items:\n\n[Click here to view code image](#images.html_p166pro02)\n\
    \n```html\n<div data-role=\"page\" data-theme=\"b\">\n       <div data-role=\"\
    header\" data-theme=\"b\">\n              <h1>jQueryMobile.tv</h1>\n              <a\
    \ href=\"#\" data-theme=\"e\" data-icon=\"home\">Home</a>\n       </div></div>\n\
    \       <div data-role=\"content\" data-theme=\"d\">\n              <p>This content\
    \ area includes the \"d\" swatch.</p>\n              <ul data-role=\"listview\"\
    \ data-inset=\"true\" data-theme=\"e\">\n                     <li><a href=\"#\"\
    >List item</a></li>\n                     <li><a href=\"#\">List item</a></li>\n\
    \                     <li><a href=\"#\">List item</a></li>\n                     <li><a\
    \ href=\"#\">List item</a></li>\n              </ul>\n       </div>\n       <div\
    \ data-role=\"footer\" data-theme=\"b\"><h2>Copyright</h2></div>\n</div>\n```\n\
    \n[Figure 11.10](#ch11.html_ch11fig10) shows an example of how this markup renders\
    \ on a mobile device. As you can see, the list can have its own theme, separate\
    \ from the rest of the page. However, if no `data-theme` is defined, the `listview`\
    \ simply inherits the theme from the page or its content container.\n\n![Image](graphics/jquery-11-10.jpg)\n\
    \nFigure 11.10\\. A listview with a custom theme.\n\nIt’s also possible for individual\
    \ list items to override the `listview` theme. If it makes sense for a specific\
    \ list item to stand apart from the others, simply add a `data-theme` attribute\
    \ to it:\n\n```html\n<ul data-role=\"listview\" data-inset=\"true\" data-theme=\"\
    e\">\n    <li>5</li>\n    <li>20</li>\n    <li>75</li>\n    <li data-theme=\"\
    a\">Total = 100</li>\n</ul>\n```\n"
  raw: '**[Figure 11.4](#ch11.html_ch11fig04)** shows the result of this modified
    markup with the data-theme.


    ![Image](graphics/jquery-11-4.jpg)


    Figure 11.4\. The “b” swatch applied to the page component and header and footer
    toolbars.


    Like pages, any components included in the toolbar inherit the toolbar’s theme.
    The following example shows a header with a button that has a different theme
    and the home icon:


    [Click here to view code image](#images.html_p162pro02)


    <div data-role="header" data-theme="b">


        <h1>jQueryMobile.tv</h1>


        <a href="#" data-theme="e" data-icon="home">Home</a>


    </div>


    This markup creates a button that stands out against the toolbar theme (**[Figure
    11.5](#ch11.html_ch11fig05)**).


    ![Image](graphics/jquery-11-5.jpg)


    Figure 11.5\. A toolbar component with a button that has a different data-theme
    swatch.


    #### Content theming


    The main content area or any element that includes a `data-role` of `content`
    can be themed by adding a `data-theme` attribute. This allows the content area
    to override the inherited page component’s theme for itself and its components.
    The following example shows how the content theme, as well as any component it
    contains, can override the page theme:


    [Click here to view code image](#images.html_p163pro01)


    <div data-role="page" data-theme="b">


        <div data-role="header" data-theme="b">


            <h1>jQueryMobile.tv</h1>


            <a href="#" data-theme="e" data-icon="home">Home</a>


        </div>


        <div data-role="content" data-theme="d">


            <h3>Header</h3>


            <p>This is a sample with the "b" swatch applied to the page and toolbars
    and the "d" swatch applied to the content area.</p>


            <a href="#" data-role="button" data-inline="true">Button</a>


        </div>


        <div data-role="footer" data-theme="b"><h2>Copyright</h2></div>


    </div>


    Notice how the page uses the “b” swatch, while the content area uses the “d” swatch.
    **[Figure 11.6](#ch11.html_ch11fig06)** shows how the content component and its
    components override the inherited page component theme.


    ![Image](graphics/jquery-11-6.jpg)


    Figure 11.6\. A page with a content area that has a different theme than itself.


    In addition to a standard content area, the collapsible content area can include
    a custom theme to differentiate it from its parent:


    [Click here to view code image](#images.html_p164pro01)


    <div data-role="page" data-theme="b">


        <div data-role="header" data-theme="b">


            <h1>jQueryMobile.tv</h1>


            <a href="#" data-theme="e" data-icon="home">Home</a>


        </div>


        <div data-role="content" data-theme="d">


            <h3>Header</h3>


            <p>This is a sample with the "b" swatch applied to the page and toolbars
    and the "d" swatch applied to the content area.</p>


            <div data-role="collapsible" data-collapsed="true" data-theme="c" data-content-theme="c">


                <h3>Collapsible header</h3>


                <p>I use the data-content-theme to match my header</p>


            </div>


        </div>


        <div data-role="footer" data-theme="b"><h2>Copyright</h2></div>


    </div>


    By default, the header of the collapsible content area includes the custom data-theme;
    but without the `data-content-theme`, the body of the collapsible content area
    remains the same theme as the containing content area. **[Figure 11.7](#ch11.html_ch11fig07)**
    shows an example of the collapsible content area with a custom `data-theme` and
    `data-content-theme`, so that both match.


    ![Image](graphics/jquery-11-7.jpg)


    Figure 11.7\. A page with a collapsible content area.


    #### Form and form element theming


    jQuery Mobile lets you create individual theme forms and form elements. Like everything
    else, forms and form elements inherit the swatch theme of the page component they’re
    contained within. However, the `data-theme` can be used to customize the look
    and feel of an individual form, all forms, or certain form elements. Let’s start
    by theming an entire form. The following code shows an example of a form that
    includes the “e” theme, while the page component includes the “b” theme. Notice
    that the form element also includes its own `content data-role`, otherwise the
    form would inherit the `data-theme` of the containing content area:


    [Click here to view code image](#images.html_p165pro01)


    <div data-role="page" data-theme="b">


        <div data-role="header" data-theme="b">


            <h1>jQueryMobile.tv</h1>


            <a href="#" data-theme="e" data-icon="home">Home</a>


        </div>


        <div data-role="content" data-theme="d">


            <p>This content area includes the "d" swatch.</p>


            <form data-role="content" data-theme="e">


                <label for="my-text-input">My text input</label>


                <input type="text" name="name" id="my-text-input" value="" />


                <a href="#" type="submit" data-role="button" data-inline="true">Button</a>


            </form>


        </div>


        <div data-role="footer" data-theme="b"><h2>Copyright</h2></div>


    </div>


    It’s useful to be able to assign different `data-theme` values to nested content
    areas. The form shows how these might be used to differentiate certain content
    (**[Figure 11.8](#ch11.html_ch11fig08)**).


    ![Image](graphics/jquery-11-8.jpg)


    Figure 11.8\. A form that contains its own data-theme, separate from its containing
    content area.


    To change the swatch on an individual form element, simply apply the `data-theme`
    to the actual element.


    [Click here to view code image](#images.html_p166pro01)


    <a href="#" type="submit" data-role="button" data-inline="true" data-theme="b">Button</a>


    This sets the button to a different theme from the rest of the form. In this case,
    it helps identify the button within the form, drawing attention to it visually
    (**[Figure 11.9](#ch11.html_ch11fig09)**).


    ![Image](graphics/jquery-11-9.jpg)


    Figure 11.9\. Setting an individual form element’s swatch value using the data-theme
    attribute.


    #### List


    Lists are probably the most complex component in jQuery Mobile, because they’re
    the only element that includes additional attributes for theme options. For example,
    the `listview` can contain not only list items, but also dividers, count bubbles,
    and split buttons, all of which have their own theme options, as we’ll see in
    this section. First, like the previous components discussed in this chapter, the
    `listview` itself can contain a `data-theme`, which will be inherited by any of
    its contained items:


    [Click here to view code image](#images.html_p166pro02)


    <div data-role="page" data-theme="b">


        <div data-role="header" data-theme="b">


            <h1>jQueryMobile.tv</h1>


            <a href="#" data-theme="e" data-icon="home">Home</a>


        </div>


        <div data-role="content" data-theme="d">


            <p>This content area includes the "d" swatch.</p>


            <ul data-role="listview" data-inset="true" data-theme="e">


                <li><a href="#">List item</a></li>


                <li><a href="#">List item</a></li>


                <li><a href="#">List item</a></li>


                <li><a href="#">List item</a></li>


            </ul>


        </div>


        <div data-role="footer" data-theme="b"><h2>Copyright</h2></div>


    </div>


    **[Figure 11.10](#ch11.html_ch11fig10)** shows an example of how this markup renders
    on a mobile device. As you can see, the list can have its own theme, separate
    from the rest of the page. However, if no `data-theme` is defined, the `listview`
    simply inherits the theme from the page or its content container.


    ![Image](graphics/jquery-11-10.jpg)


    Figure 11.10\. A listview with a custom theme.


    It’s also possible for individual list items to override the `listview` theme.
    If it makes sense for a specific list item to stand apart from the others, simply
    add a `data-theme` attribute to it:


    [Click here to view code image](#images.html_p167pro01)


    <ul data-role="listview" data-inset="true" data-theme="e">


        <li>5</li>


        <li>20</li>


        <li>75</li>


        <li data-theme="a">Total = 100</li>


    </ul>'
