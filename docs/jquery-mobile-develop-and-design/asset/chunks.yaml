    dolor quis elit suscipit commodo a eu velit. Nulla sodales velit arcu, at accumsan
    nisi. Donec porta tempus lorem, eget luctus diam luctus ac. Nunc et aliquam massa.
    Duis enim felis, varius quis pharetra quis, iaculis ac nulla. Morbi congue suscipit
    elit vel porta. Proin lacinia scelerisque risus, at elementum diam elementum et.</p>


    </div>


    By adding the `collapsible` `data-role` to the container, the heading element
    is automatically converted into a button that can be used to expand and contract
    the paragraph. Visually, the example will produce the sequence seen in **[Figure
    7.7](#ch07.html_ch07fig07)**.


    ![Image](graphics/jquery-7-7.jpg)


    Figure 7.7\. A collapsible content button used to save space.


    Collapsible content is a great way to organize large amounts of information. Showing
    lots of data all at one time can be overwhelming and deter people from accessing
    your valuable content. By hiding the content when the user first loads a webpage,
    content can remain organized and users can reveal only the content areas that
    they’re interested in.


    Collapsible content areas can also include a `data-` attribute called `data-collapsed`.
    By default, collapsible content areas are collapsed when the webpage is first
    loaded. The `data-collapsed` attribute provides a way to expand collapsible content
    areas when the page first loads. The following example shows the markup to accomplish
    this:


    [Click here to view code image](#images.html_p100pro01)


    <div data-role="collapsible" data-collapsed="false">


        <h3>Collapsible content header</h3>


        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Praesent non dolor
    quis elit suscipit commodo a eu velit. Nulla sodales velit arcu, at accumsan nisi.
    Donec porta tempus lorem, eget luctus diam luctus ac. Nunc et aliquam massa. Duis
    enim felis, varius quis pharetra quis, iaculis ac nulla. Morbi congue suscipit
    elit vel porta. Proin lacinia scelerisque risus, at elementum diam elementum et.</p>


    </div>


    It’s also possible to nest collapsible content by adding a collapsible content
    area inside another collapsible content area. The following example shows how
    to write the markup to create a nested collapsible content area:


    [Click here to view code image](#images.html_p100pro02)


    <div data-role="collapsible" data-collapsed="false">


        <h3>Collapsible content header</h3>


        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>


        <div data-role="collapsible">


            <h3>Collapsible child #1</h3>


            <p>Lorem ipsum dolor sit amet.</p>


        </div>


        <div data-role="collapsible">


            <h3>Collapsible child #2</h3>


            <p>Lorem ipsum dolor sit amet.</p>


        </div>


    </div>


    The two highlighted collapsible content areas in this example are nested in the
    main collapsible area. The result of this nested collapsible content will look
    similar to **[Figure 7.8](#ch07.html_ch07fig08)**.


    ![Image](graphics/jquery-7-8.jpg)


    Figure 7.8\. The sequence of events that occurs when opening a nested collapsible
    content area.


    It’s also possible to nest deeper; in fact, you can nest as deep as you’d like.


    #### Creating accordions


    Collapsible content areas can also be grouped to create an accordion. An accordion
    is essentially a group of collapsible content areas that are aware of one another.
    For example, when one collapsible content area is expanded, any expanded ones
    will close, so only one content area is expanded at a time.


    To define an accordion, a container element must be created to contain a group
    of collapsible content areas. On this container element, a `data-role` must be
    set to the value `collapsible-set`. That’s it. The following code shows the markup
    for an accordion with two collapsible content areas:


    [Click here to view code image](#images.html_p102pro01)


    <div data-role="collapsible-set">


        <div data-role="collapsible">


            <h3>Header #1</h3>


            <p>Lorem ipsum dolor sit amet.</p>


        </div>


        <div data-role="collapsible">


            <h3>Header #2</h3>


            <p>Lorem ipsum dolor sit amet.</p>


        </div>


    </div>


    The code in this example creates an accordion that functions like the sequence
    shown in **[Figure 7.9](#ch07.html_ch07fig09)**.


    ![Image](graphics/jquery-7-9.jpg)


    Figure 7.9\. An example of an accordion and how it functions.


    ### Wrapping Up


    jQuery Mobile makes widgets incredibly easy to use, offering functionality that
    would otherwise require custom JavaScript or jQuery. Using a simple `data-` attribute
    or CSS class, the framework enhances these layout widgets and creates the required
    functionality. Handling layout differences between devices is another benefit
    of this framework: typically, CSS or JavaScript would need to be written to accommodate
    the varying dimensions of different devices. With jQuery Mobile you can use any
    custom HTML to create layouts, but it’s always beneficial to determine whether
    the framework already includes a widget that can save you time.


    ## 8\. Working with Lists


    Lists are frequently used to display data in jQuery Mobile. The framework offers
    a plethora of formatting options to achieve just about any design pattern you
    can imagine, such as basic linked lists, numbered lists, nested lists, inset lists,
    split button lists, and lists with dividers, as well as lists with count bubbles,
    thumbnails, and icons. This chapter covers all these design patterns, providing
    example code and figures to show you how the end results should render.


    ### Basic Linked Lists


    One of the most common design patterns you’ll see with jQuery Mobile lists is
    a basic linked list. Often used to display navigation, basic linked lists are
    simply unordered lists that contain items with hyperlinks. jQuery Mobile enhances
    these lists when a `data-role` with a value of `listview` is attached to the opening
    tag of the unordered list element. The following markup shows how to create a
    basic linked list using the `listview` `data-role`:


    [Click here to view code image](#images.html_p106pro01)


    <ul data-role="listview">


        <li><a href="#">Home</a></li>


        <li><a href="#">Articles</a></li>


        <li><a href="#">Videos</a></li>


        <li><a href="#">Books</a></li>


        <li><a href="#">More</a></li>


    </ul>


    This `listview` markup is enhanced by the framework to produce a list of links
    that includes arrow icons, background shadows, and more. **[Figure 8.1](#ch08.html_ch08fig01)**
    shows an example of the visual result of this markup.


    ![Image](graphics/jquery-8-1.jpg)


    Figure 8.1\. A basic linked list.


    Enhancements alter the markup, producing much different HTML. The next example
    shows a snippet of the markup after it’s been enhanced by the framework. The opening
    unordered list tag and the first list item are shown to provide a sample of the
    enhancements, while the new portions are highlighted to show how much of the code
    has been enhanced. Note that the missing list items (`<!-- etc. -->`) are all
    altered in the same way as the first list item:


    [Click here to view code image](#images.html_p107pro01)


    <ul data-role="listview" class="ui-listview">


        <li data-theme="c" class="ui-btn ui-btn-icon-right ui-li-has-arrow ui-li ui-btn-up-c">


            <div class="ui-btn-inner ui-li" aria-hidden="true">


                <div class="ui-btn-text">


                    <a href="#" class="ui-link-inherit">Home</a>


                </div>


                <span class="ui-icon ui-icon-arrow-r ui-icon-shadow"></span>


            </div>


        </li>


    <!-- etc. -->'
