    is the value of the text that’s typed into the search filter. As a user types
    into the search filter, the `listview` loops through the list comparing the list
    item text and the search value, and filtering the results as necessary. **[Figure
    9.4](#ch09.html_ch09fig04)** shows an example of a console.log as jQuery Mobile
