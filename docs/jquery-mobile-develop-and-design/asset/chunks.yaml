  trans: "\n\n另一个明显的区别是标题元素包含一个 `ui-title` 类。该类设置了一系列组合属性，可以使文本居中、添加外边距、为溢出的文本创建省略号等。框架还添加了\
    \ `tabindex`，它通过创建逻辑性的选项卡切换顺序，自动使网页更具可访问性，该顺序会被像 iOS 带有内置“下一步”按钮的移动设备使用。页眉还可以包含标题元素以外的元素；例如，按钮可以是你工具栏中重要的补充。\n\
    \n### 添加按钮\n\n通过第 5 章中讨论的按钮选项、“**对话框和按钮]”以及无限数量的自定义图标，你可以满足想象到的任何功能需求。页眉是移动 Web\
    \ 应用中突出显示重要按钮的绝佳位置，使用 jQuery Mobile 可以轻松实现。以下示例显示了如何在编辑用户个人资料的对话框页眉元素中添加保存（Save）按钮：\n\
    \n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1\">\n    <title>Header Toolbar\
    \ - jQuery Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"\
    http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\" />\n    <script\
    \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"></script>\n\
    \    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\">\n            <h1>John Doe</h1>\n            <a href=\"#options-dialog\"\
    \ data-icon=\"gear\" class=\"ui-btn-right\" data-rel=\"dialog\">Edit Profile</a>\n\
    \        </div>\n        <div data-role=\"content\">\n            <p>123 E Street</p>\n\
    \            <p>Chicago, Il 60622</p>\n        </div>\n    </div>\n    <div data-role=\"\
    page\" id=\"options-dialog\">\n        <div data-role=\"header\">\n          \
    \  <h1>Edit John Doe</h1>\n            <a href=\"#\" data-icon=\"check\">Save</a>\n\
    \        </div>\n        <div data-role=\"content\">\n            <label for=\"\
    profile-image\">Profile Image</label>\n            <p><img src=\"assets/img/profile.png\"\
    ></p>\n            <input type=\"file\" id=\"profile-image\" name=\"profile-image\"\
    >\n            <label for=\"street-address\">Street Address</label>\n        \
    \    <input type=\"text\" id=\"street-address\" name=\"street-address\" value=\"\
    123 E Street\">\n            <label for=\"city\">City</label>\n            <input\
    \ type=\"text\" id=\"city\" name=\"city\" value=\"Chicago\">\n            <label\
    \ for=\"state\">State</label>\n            <input type=\"text\" id=\"state\" name=\"\
    state\" value=\"Il\">\n            <label for=\"zip-code\">Zip Code</label>\n\
    \            <input type=\"text\" id=\"zip-code\" name=\"zip-code\" value=\"6022\"\
    >\n        </div>\n    </div>\n</body>\n</html>\n```\n\n使用单页模板，添加了第二个页面并设置了一个超链接从默认页面以对话框形式打开它。在对话框窗口中，保存按钮通过\
    \ `data-icon` 属性进行视觉表示。默认页面选项按钮使用齿轮图标，而保存按钮使用勾选图标。插图 6.4 展示了在对话框窗口中显示可编辑表单以修改用户个人资料的方法。在更新输入后，用户可以点击保存按钮。你可以编写代码来处理用户的更新并将其存储在数据库中。\n\
    \n![图像](img/jquery-6-4.jpg)\n\n图 6.4。带有保存按钮的页眉工具栏。\n\n按钮也可以进行分组，而不是单独显示。要对按钮进行分组，只需在它们周围添加一个\
    \ `div` 作为容器，并应用一个值为 `controlgroup` 的 `data-role`，同时将 `data-type` 设置为 `horizontal`：\n\
    \n点击此处查看代码图像\n\n```html\n<div data-role=\"header\">\n    <div data-role=\"controlgroup\"\
    \ data-type=\"horizontal\">\n        <a href=\"#\" data-role=\"button\" data-icon=\"\
    delete\">Delete</a>\n        <a href=\"#\" data-role=\"button\" data-icon=\"check\"\
    >Save</a>\n    </div>\n</div>\n```\n\n你还会注意到 `data-role` 属性被设置为 `button`。此属性和值必须添加到\
    \ `controlgroup` 内部的按钮上，否则超链接将不会渲染为按钮。插图 6.5 显示此示例渲染了一个包含组合删除”和“保存”按钮的工具栏，因此这两个按钮不再显示为独立。\n\
    \n![图像](img/jquery-6-5.jpg)\n\n图 6.5。分组的按钮。\n\n也可以向工具栏中添加多个组组，以便在视觉上将这些组相互隔离开：\n\
    \n点击此处查看代码图像\n\n```html\n<div data-role=\"header\">\n    <div data-role=\"controlgroup\"\
    \ data-type=\"horizontal\" class=\"align-left\">\n        <a href=\"#\" data-role=\"\
    button\" data-icon=\"home\">Home</a>\n        <a href=\"#\" data-role=\"button\"\
    \ data-icon=\"arrow-l\">Back</a>\n    </div>\n    <div data-role=\"controlgroup\"\
    \ data-type=\"horizontal\" class=\"align-right\">\n        <a href=\"#\" data-role=\"\
    button\" data-icon=\"delete\">Delete</a>\n        <a href=\"#\" data-role=\"button\"\
    \ data-icon=\"check\">Save</a>\n    </div>\n</div>\n```\n\n这些按钮组也使用了自定义类，将一组左对齐，另一组右对齐。这些类的\
    \ CSS 是简单的左浮动和右浮动：\n\n```css\n<style type=\"text/css\">\n.align-left {\n    float:\
    \ left;\n}\n.align-right {\n    float: right;\n}\n</style>\n```\n\n插图 6.6 显示了这些按钮组在工具栏中的效果。\n\
    \n![图像](img/jquery-6-6.jpg)\n\n图 6.6。分组。\n\n### 页脚工具栏\n\n页脚工具栏与页眉工具栏相似，但通常位于页面底部而不是顶部。它们经常用于显示版权声明或其他信息。\n\
    \n```html\n<div data-role=\"footer\">\n    <h4>Copyright</h4>\n</div>\n```\n\n\
    正如页眉工具栏中的标题，添加到页脚工具栏的任何文本都需要标题元素来包含间距、对齐等。以下代码示例显示了框架增强后的页脚工具栏：\n\n点击此处查看代码图像\n\
    \n```html\n<div data-role=\"footer\" class=\"ui-footer-a\" role=\"contentinfo\"\
    >\n    <h4 class=\"ui-title\" tabindex=\"0\" role=\"heading\" aria-level=\"1\"\
    >Copyright</h4>\n</div>\n```\n\n### 工具定位\n\n你可以将工具栏设置为固定（fixed）或全屏（fullscreen）。固定工具栏在网页上始终可见。当页眉工具栏是固定的，即使页面滚动，它也始终出现在顶部。当页脚工具栏是固定的，它始终显示在网络浏览器的底部。要为工具栏添加固定定位，只需要一个值为\
    \ `fixed` 的 `data-position` 属性：\n\n点击此处查看代码图像\n\n```html\n<div data-role=\"page\"\
    >\n    <div data-role=\"header\" data-position=\"fixed\">\n        <h1>Page Title</h1>\n\
    \    </div>\n    <div data-role=\"content\">\n        <p>Body Copy</p>\n    </div>\n\
    \    <div data-role=\"footer\" data-position=\"fixed\">\n        <h4>Copyright</h4>\n\
    \    </div>\n</div>\n```\n\n插图 6.7 显示了这些工具栏在网络浏览器中的渲染情况。\n\n![图像](img/jquery-6-7.jpg)\n\
    \n图 6.7。固定工具栏。\n\n此代码的结果以类似于 CSS 中的固定定位的方式工作，但 jQuery Mobile 并没有使用 CSS 实现此功能。由于许多移动浏览器不支持固定定位，jQuery\
    \ Mobile 使用动态重新定位来代替。\n\n"
- fmt: "\nYou can also update the position of toolbars via the jQuery Mobile API.\
    \ Using this method is sometimes necessary, for example, when a widget, such as\
    \ an accordion, is expanded and the page changes height. You can call the following\
    \ code to update the toolbar position:\n\n[Click here to view code image](#images.html_p084pro01)\n\
    \n```javascript\n$.mobile.fixedToolbars.show(true);\n```\n\nThis code is great\
    \ to use when you’re building dynamic content.\n\nIn addition to fixed toolbars,\
    \ you can create fullscreen fixed headers. Fullscreen fixed headers are the same\
    \ as fixed ones, the only difference being that the content sits behind the toolbars,\
    \ so the content is still fullscreen and the toolbars are transparent. The toolbars\
    \ also disappear when the page is clicked. To create fullscreen fixed toolbars,\
    \ just add the `data-fullscreen` attribute and set it to `true`:\n\n[Click here\
    \ to view code image](#images.html_p084pro02)\n\n```html\n<div data-role=\"header\"\
    \ data-fullscreen=\"true\" data-position=\"fixed\">\n    <h1>Page Title</h1>\n\
    </div>\n```\n\nWith regular fixed toolbars, the content sits between the header\
    \ and the footer. Fullscreen toolbars are common for video players or photo slideshows.\n\
    \n### Creating Navigation Bars\n\nNavigation is most prominently displayed in\
    \ the header of a webpage. jQuery Mobile offers a widget to create navigation\
    \ called `navbar`. Navbars are not required to be in a header toolbar, but they’re\
    \ typically seen in either a header or footer. Let’s look at how one can be used\
    \ effectively as page navigation in the header of a mobile website. A navbar is\
    \ essentially a simple unordered list contained within an element that includes\
    \ a `data-role` value of `navbar`:\n\n[Click here to view code image](#images.html_p085pro01)\n\
    \n```html\n<div data-role=\"header\">\n    <div data-role=\"navbar\">\n      \
    \  <ul>\n            <li><a href=\"/\">Home</a></li>\n            <li><a href=\"\
    #\">About</a></li>\n            <li><a href=\"#\">Contact</a></li>\n        </ul>\n\
    \    </div>\n</div>\n```\n\nOnce again jQuery Mobile makes it incredibly easy\
    \ to transform simple HTML markup into a visually appealing and functional widget\
    \ by adding a single attribute. [Figure 6.8](#ch06.html_ch06fig08) shows how this\
    \ code renders visually.\n\n![Image](graphics/jquery-6-8.jpg)\n\nFigure 6.8. A\
    \ navbar used in a header toolbar.\n\nThe cool thing about the framework is that\
    \ it evenly divides the space of the navbar based on the number of buttons. This\
    \ is why each of the buttons in [Figure 6.8](#ch06.html_ch06fig08) is proportionate.\
    \ The only caveat about navbars is that if they contain more than five hyperlinks\
    \ they’ll begin wrapping to multiple lines, as seen in [Figure 6.9](#ch06.html_ch06fig09).\n\
    \n![Image](graphics/jquery-6-9.jpg)\n\nFigure 6.9. A navbar with more than five\
    \ buttons.\n\nAlthough this is a limitation in one sense, it’s also a saving grace\
    \ because mobile devices simply don’t have the room to accommodate this many buttons\
    \ in a horizontal space.\n\nAnother nice thing about navbars in headers is that\
    \ they don’t require you to eliminate the page title. You can still use a heading\
    \ element with a page title and then add a navbar underneath. Or, better yet,\
    \ you can add a logo and then a navbar, like you typically see across the web:\n\
    \n[Click here to view code image](#images.html_p086pro01)\n\n```html\n<div data-role=\"\
    header\">\n    <img src=\"assets/img/trademark-jquerymobiletv.png\">\n    <div\
    \ data-role=\"navbar\">\n        <ul>\n            <li><a href=\"/\">Home</a></li>\n\
    \            <li><a href=\"#\">About</a></li>\n            <li><a href=\"#\">Contact</a></li>\n\
    \        </ul>\n    </div>\n</div>\n```\n\nAs shown in [Figure 6.10](#ch06.html_ch06fig10),\
    \ the logo is added above the navigation. Header toolbars can include a number\
    \ of elements; they’re not limited to buttons or page titles.\n\n![Image](graphics/jquery-6-10.jpg)\n\
    \nFigure 6.10. A navbar and a logo in a header.\n\n[Figure 6.11](#ch06.html_ch06fig11)\
    \ shows a navbar.\n\n![Image](graphics/jquery-6-11.jpg)\n\nFigure 6.11. A navbar\
    \ and a logo.\n\n### Wrapping Up\n\nToolbars can help you create consistency on\
    \ page. In addition to fixed toolbars, you can create fullscreen fixed headers.\
    \ Fullscreen fixed headers are the same as fixed ones, the only difference being\
    \ that the content sits behind the toolbars, so the content is still fullscreen\
    \ and the toolbars are transparent. The toolbars also disappear when the page\
    \ is clicked.\n\n### Layout Options\n\njQuery Mobile is flexible in the sense\
    \ that it supports standard HTML, but also offers custom layouts. Grids are useful\
    \ when you need to organize content into a grid. You can create a grid by defining\
    \ how many columns you want. The following example shows how to create a grid\
    \ layout.\n"
  raw: 'You can also update the position of toolbars via the jQuery Mobile API. Using
    this method is sometimes necessary, for example, when a widget, such as an accordion,
    is expanded and the page changes height. You can call the following code to update
    the toolbar position:


    [Click here to view code image](#images.html_p084pro01)


    $.mobile.fixedToolbars.show(true);


    This code is great to use when you’re building dynamic content.


    In addition to fixed toolbars, you can create fullscreen fixed headers. Fullscreen
    fixed headers are the same as fixed ones, the only difference being that the content
    sits behind the toolbars, so the content is still fullscreen and the toolbars
    are transparent. The toolbars also disappear when the page is clicked. To create
    fullscreen fixed toolbars, just add the `data-fullscreen` attribute and set it
    to `true`:


    [Click here to view code image](#images.html_p084pro02)


    <div data-role="header" data-fullscreen="true" data-position="fixed">


        <h1>Page Title</h1>


    </div>


    With regular fixed toolbars, the content sits between the header and the footer.
    Fullscreen toolbars are common for video players or photo slideshows.


    ### Creating Navigation Bars


    Navigation is most prominently displayed in the header of a webpage. jQuery Mobile
    offers a widget to create navigation called navbar. Navbars are not required to
    be in a header toolbar, but they’re typically seen in either a header or footer.
    Let’s look at how one can be used effectively as page navigation in the header
    of a mobile website. A navbar is essentially a simple unordered list contained
    within an element that includes a `data-role` value of `navbar`:


    [Click here to view code image](#images.html_p085pro01)


    <div data-role="header">


        <div data-role="navbar">


            <ul>


                <li><a href="/">Home</a></li>


                <li><a href="#">About</a></li>


                <li><a href="#">Contact</a></li>


            </ul>


        </div>


    </div>


    Once again jQuery Mobile makes it incredibly easy to transform simple HTML markup
    into a visually appealing and functional widget by adding a single attribute.
    **[Figure 6.8](#ch06.html_ch06fig08)** shows how this code renders visually.


    ![Image](graphics/jquery-6-8.jpg)


    Figure 6.8\. A navbar used in a header toolbar.


    The cool thing about the framework is that it evenly divides the space of the
    navbar based on the number of buttons. This is why each of the buttons in [Figure
    6.8](#ch06.html_ch06fig08) is proportionate. The only caveat about navbars is
    that if they contain more than five hyperlinks they’ll begin wrapping to multiple
    lines, as seen in **[Figure 6.9](#ch06.html_ch06fig09)**.


    ![Image](graphics/jquery-6-9.jpg)


    Figure 6.9\. A navbar with more than five buttons.


    Although this is a limitation in one sense, it’s also a saving grace because mobile
    devices simply don’t have the room to accommodate this many buttons in a horizontal
    space.


    Another nice thing about navbars in headers is that they don’t require you to
    eliminate the page title. You can still use a heading element with a page title
    and then add a navbar underneath. Or, better yet, you can add a logo and then
    a navbar, like you typically see across the web:


    [Click here to view code image](#images.html_p086pro01)


    <div data-role="header">


        <img src="assets/img/trademark-jquerymobiletv.png">


        <div data-role="navbar">


            <ul>


                <li><a href="/">Home</a></li>


                <li><a href="#">About</a></li>


                <li><a href="#">Contact</a></li>


            </ul>


       </div>


    </div>


    As shown in **[Figure 6.10](#ch06.html_ch06fig10)**, the logo is added above the
    navigation. Header toolbars can include a number of elements; they’re not limited
    to buttons or page titles.


    ![Image](graphics/jquery-6-10.jpg)


    Figure 6.10\. A navbar and a logo in a header.


    **[Figure 6.11](#ch06.html_ch06fig11)** shows an example of a navbar that includes
    button icons.


    ![Image](graphics/jquery-6-11.jpg)


    Figure 6.11\. A navbar with button icons and a logo in a header.


    This example shows what’s possible with the framework when you combine widgets
    to create functionality.


    ### Wrapping Up


    Toolbars can help you create consistency in a mobile website by adding page titles
    that have the same look and feel, navigation bars, or a combination of branding
    and functional elements. In addition to look and feel, understanding how to leverage
    headers and footers to create a more usable website is important and toolbars
    offer the functionality needed to achieve this.


    ## 7\. Layout Options


    jQuery Mobile is flexible in the sense that it’s based on standard HTML and CSS,
    so the layout options are essentially endless. However, the framework does offer
    a few enhancements in the form of widgets you can use to organize content and
    create custom layouts without writing additional code. Using `data-` attributes
    and standard CSS classes, the framework transforms the markup used to structure
    these widgets. In this chapter, you’ll learn how to create grids, collapsible
    content, and accordions.


    ### Grids


    Although jQuery Mobile still supports standard HTML tables, the framework also
    offers a simple alternative in the form of a widget called grids. Grids let you
    position elements next to one another. They’re useful for smaller elements such
    as buttons and icons, but not recommended for large items or chunks of copy, since
    mobile device resolution is much lower than the desktop environment and usability
    is extremely diminished.


    #### Grid columns


    With jQuery Mobile, you can create up to a five-column grid using the four predefined
    grid-column layout options shown in **[Table 7.1](#ch07.html_ch07tab01)**. Each
    column is based on an individual CSS class with a naming convention that starts
    with the prefix `ui-grid`.


    Table 7.1\. Columns and CSS classes


    ![Image](graphics/07tab01.jpg)


    Creating a grid is easy once you determine how many columns you want: just add
    the corresponding CSS class. The class for a two-column grid is `ui-grid-a`. This
    will be added to a container element, in this case two `div` elements that act
    as the two columns. Grid columns are defined HTML elements that include the `ui-block`
    class prefix; the prefix is appended with a letter in alphabetical order based
    on its position. For example, the first column’s CSS class is `ui-block-a`, the
    second column’s class is `ui-block-b`, and so on:


    [Click here to view code image](#images.html_p090pro01)


    <div class="ui-grid-a">


        <div class="ui-block-a"><strong>2-Column</strong></div>


        <div class="ui-block-b">Column</div>


    </div>


    The layout that is rendered based on this code will look similar to **[Figure
    7.1](#ch07.html_ch07fig01)**. Within the columns, it’s possible to add HTML, but
    as mentioned earlier, it’s important to keep grid data to a minimum to accommodate
    the minimal width of mobile devices. Creating additional columns is as easy as
    using the corresponding `ui-grid` class and adding column blocks. The following
    example includes all the column types in a single HTML file with `hr` elements:


    [Click here to view code image](#images.html_p091pro01)


    <div class="ui-grid-a">


        <div class="ui-block-a"><strong>2-Column</strong></div>


        <div class="ui-block-b">Column</div>


    </div>


    <hr>


    <div class="ui-grid-b">


        <div class="ui-block-a"><strong>3-Column</strong></div>


        <div class="ui-block-b">Column</div>


        <div class="ui-block-c">Column</div>


    </div>


    <hr>


    <div class="ui-grid-c">


        <div class="ui-block-a"><strong>4-Column</strong></div>


        <div class="ui-block-b">Column</div>


        <div class="ui-block-c">Column</div>


        <div class="ui-block-d">Column</div>


    </div>


    <hr>


    <div class="ui-grid-d">


        <div class="ui-block-a"><strong>5-Column</strong></div>


        <div class="ui-block-b">Column</div>


        <div class="ui-block-c">Column</div>


        <div class="ui-block-d">Column</div>


        <div class="ui-block-e">Column</div>


    </div>


    ![Image](graphics/jquery-7-1.jpg)'
