                <p><img src="assets/img/profile.png"></p>


                <input type="file" id="profile-image" name="profile-image">


                <label for="street-address">Street Address</label>


                <input type="text" id="street-address" name="street-address" value="123
    E Street">


                <label for="city">City</label>


                <input type="text" id="city" name="city" value="Chicago">


                <label for="state">State</label>


                <input type="text" id="state" name="state" value="Il">


                <label for="zip-code">Zip Code</label>


                <input type="text" id="zip-code" name="zip-code" value="60622">


            </div>


        </div>


    </body>


    </html>


    Using the single-page template, a second page is added and a hyperlink is set
    to open it as a dialog window from the default page. In the dialog window, the
    Save button is visually represented by the appropriate `data-icon` attribute value.
    The Option button in the default page uses a gear, and the Save button uses a
    checkmark. **[Figure 6.4](#ch06.html_ch06fig04)** illustrates a way to display
    an editable form in a dialog window to modify a user profile. After updating the
    input values, the user can click the Save button. You could put code in place
    to process the user’s updates and store them in a database.


    ![Image](graphics/jquery-6-4.jpg)


    Figure 6.4\. A header toolbar with a Save button.


    Buttons can also be grouped, rather than displayed individually. To group buttons,
    simply add a `div` as a container around them and apply a `data-role` with a value
    of `controlgroup` with a `data-type` set to `horizontal`:


    [Click here to view code image](#images.html_p080pro01)


    <div data-role="header">


        <div data-role="controlgroup" data-type="horizontal">


            <a href="#" data-role="button" data-icon="delete">Delete</a>


            <a href="#" data-role="button" data-icon="check">Save</a>


        </div>


    </div>


    You’ll also notice that there are `data-role` attributes set as `button`. This
    attribute and value must be added to buttons within a `controlgroup`, otherwise
    the hyperlinks won’t render as buttons. **[Figure 6.5](#ch06.html_ch06fig05)**
    shows that this example renders a toolbar with a combined Delete and Save button,
    so the two no longer appear separate.


    ![Image](graphics/jquery-6-5.jpg)


    Figure 6.5\. Grouped buttons.


    Multiple groups can also be added to a toolbar to visually separate the groups
    from one another:


    [Click here to view code image](#images.html_p081pro01)


    <div data-role="header">


        <div data-role="controlgroup" data-type="horizontal" class="align-left">


            <a href="#" data-role="button" data-icon="home">Home</a>


                <a href="#" data-role="button" data-icon="arrow-l">Back</a>


        </div>


            <div data-role="controlgroup" data-type="horizontal" class="align-right">


                <a href="#" data-role="button" data-icon="delete">Delete</a>


                <a href="#" data-role="button" data-icon="check">Save</a>


            </div>


    </div>


    These groups of buttons are also using custom classes that align one set left
    and the other right. The CSS for these classes is a simple float left and a float
    right:


    <style type="text/css">


    .align-left {


        float: left;


    }


    .align-right {


        float: right;


    }


    </style>


    **[Figure 6.6](#ch06.html_ch06fig06)** shows these two groups of buttons and how
    they are separated in a header toolbar.


    ![Image](graphics/jquery-6-6.jpg)


    Figure 6.6\. Multiple sets of grouped buttons.


    #### Footer toolbars


    Footer toolbars are like header toolbars except that they typically reside at
    the bottom, rather than the top, of a webpage. They are often used to display
    copyright notices and other similar information.


    <div data-role="footer">


        <h4>Copyright</h4>


    </div>


    As with page titles in header toolbars, any text that’s added to the footer toolbar
    needs a heading element to include spacing, alignment, and so on. The following
    code example shows the markup for footer toolbars after it’s enhanced by the framework:


    [Click here to view code image](#images.html_p082pro01)


    <div data-role="footer" class="ui-footer ui-bar-a" role="contentinfo">


        <h4 class="ui-title" tabindex="0" role="heading" aria-level="1">Copyright</h4>


    </div>


    Although footer toolbars are a good place for copyrights and the like, it’s also
    possible to include all the same markup as a header toolbar, including buttons,
    navbars, and so on.


    #### Positioning toolbars


    You can position toolbars as fixed or fullscreen. Fixed toolbars are always visible
    on the webpage. When a header toolbar is fixed, it always appears at the top,
    even when the page is scrolled. When a footer toolbar is fixed, it is always visible
    at the very bottom of the web browser. To add fixed positioning to toolbars, all
    that’s needed is a `data-position` attribute with a value of `fixed`:


    [Click here to view code image](#images.html_p083pro01)


    <div data-role="page">


        <div data-role="header" data-position="fixed">


            <h1>Page Title</h1>


        </div>


        <div data-role="content">


            <p>Body Copy</p>


        </div>


        <div data-role="footer" data-position="fixed">


            <h4>Copyright</h4>


        </div>


    </div>


    **[Figure 6.7](#ch06.html_ch06fig07)** shows how these toolbars render in a web
    browser.


    ![Image](graphics/jquery-6-7.jpg)


    Figure 6.7\. Fixed toolbars.


    The result of this code functions like fixed positioning works with CSS, but jQuery
    Mobile doesn’t use CSS for this functionality. Since fixed positioning is not
    supported by many mobile browsers, jQuery Mobile uses dynamic repositioning instead.'
