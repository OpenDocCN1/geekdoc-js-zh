    \        <h3>Header #2</h3>\n        <p>Lorem ipsum dolor sit amet.</p>\n    </div>\n\
    </div>\n```\n\nThe code in this example creates an accordion that functions like\
    \ the sequence shown in [Figure 7.9](#ch07.html_ch07fig09).\n\n![Image](graphics/jquery-7-9)\n\
    \nFigure 7.9\\. An example of an accordion\n\n### Wrapping Up\n\njQuery Mobile\
    \ makes it incredibly easy to use, JavaScript. Using a `data-` attribute, the\
    \ content can wrap.\n\n## 8. Working with Lists\n\nLists are frequently used.\
    \ jQuery Mobile offers a plethora of options to achieve any design, such as linked\
    \ lists, numbered lists, inset lists, split lists, lists with dividers, as well\
    \ as lists with thumbnails, and. Lists are frequently used. jQuery Mobile offers\
    \ a plethora of options to achieve any design, such as linked lists, numbered\
    \ lists, inset lists, split lists, lists with dividers, as well as lists with\
    \ thumbnails, and icons. One of the most common patterns you’ll see with jQuery\
    \ Mobile is a linked list.\n\n### Basic Lists\n\nOne of the most common patterns\
    \ you’ll see with jQuery Mobile is a linked list. The following markup shows a\
    \ linked list using `data-role`:\n\n[Click here to view code image](#images.html_p106pro01)\n\
    \n```\n<ul data-role=\"listview\">\n    <li><a href=\"#\">Home</a></li>\n    <li><a\
    \ href=\"#\">Articles</a></li>\n    <li><a href=\"#\">Videos</a></li>\n    <li><a\
    \ href=\"#\">Books</a></li>\n    <li><a href=\"#\">More</a></li>\n</ul>\n```\n\
    \nThis `listview` markup is enhanced by the framework to produce a list of links.\
    \ [Figure 8.1](#ch08.html_ch08fig01) shows an example of the visual result of\
    \ this markup.\n\n![Image](graphics/8-1.jpg)\n\nFigure 8.1\\. A basic linked list.\n\
    \nEnhancements alter the markup, producing much different HTML. The next example\
    \ shows a snippet of the markup after it’s been enhanced by the framework. The\
    \ opening list tag and the first list item are shown to provide a sample of the\
    \ enhancements, while the new portions are highlighted to show how much of the\
    \ code has been enhanced. Note that the missing list items (`<!-- etc. -->`) are\
    \ all altered in the same way as the first list:\n\n[Click here to view code image](#images.html_p107pro01)\n\
    \n```\n<ul data-role=\"listview\" class=\"ui-listview\">\n    <li data-theme=\"\
    c\" class=\"ui-btn ui-icon-right ui-li-has-arrow ui-li ui-btn-up-c\">\n      \
