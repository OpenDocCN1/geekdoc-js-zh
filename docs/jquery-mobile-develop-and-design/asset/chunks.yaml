    <ul data-role="listview">


        <li><a href="#">Home</a></li>


        <li><a href="#">Articles</a></li>


        <li><a href="#">Videos</a></li>


        <li><a href="#">Books</a></li>


        <li>


            <h2>More</h2>


            <p>Find more resources on jQuery Mobile</p>


            <ul data-role="listview">


                <li><a href="http://www.jquerymobile.com">jQuery Mobile</a></li>


                <li><a href="http://www.jquery.com">jQuery</a></li>


            </ul>


        </li>


    </ul>


    When the framework enhances the `listview`, the `More` list item becomes a hyperlink
    to the nested list, as seen in **[Figure 8.4](#ch08.html_ch08fig04)**.


    ![Image](graphics/jquery-8-4.jpg)


    Figure 8.4\. A nested list appears after the More list item is selected.


    The page generated from this nested list includes a header with the value of the
    list item title and then the nested list itself. Lists can be nested as deeply
    as you like; the framework will simply generate more and more pages.


    #### Inset lists


    By default, lists are set to the width of the device they are being viewed on;
    in other words, their width is always set to 100 percent. You can add an attribute
    to create what’s known as an inset list, which looks like it’s inset within the
    page (rather than extending to the edges of the device) and has rounded corners.
    The following example shows a basic linked list with the `data-inset` attribute
    set to `true`:


    [Click here to view code image](#images.html_p111pro01)


    <ul data-role="listview" data-inset="true">


        <li><a href="#">Home</a></li>


        <li><a href="#">Articles</a></li>


        <li><a href="#">Videos</a></li>


        <li><a href="#">Books</a></li>


        <li><a href="#">More</a></li>


    </ul>


    Setting this attribute to `true` creates the visual results shown in **[Figure
    8.5](#ch08.html_ch08fig05)**.


    ![Image](graphics/jquery-8-5.jpg)


    Figure 8.5\. A basic linked list with the data-inset attribute set to true.


    ### Customizing Lists


    Once you understand how to create basic lists, you may find yourself wanting more
    options. Lists can be customized with dividers, thumbnails, icons, and more using
    `data-` attributes. This section shows you what attributes can be used and how
    to write the code for each of them.


    #### Split button lists


    One option for providing additional list functionality is what’s called a split
    button list. A split button list lets you provide two clickable options within
    the same list item. This is useful for items that require a link for details about
    a particular item as well as another action, such as a button to purchase the
    item or share it on a social network. Creating a split button list is easy: just
    add two anchor tags within a list item that uses the `listview` `data-role`:


    [Click here to view code image](#images.html_p112pro01)


    <ul data-role="listview" data-split-icon="gear">


        <li>


            <a href="#item-detail">


                <h3>Using UI components in jQuery Mobile</h3>


                <p>Many UI components are available in the jQuery Mobile framework.</p>


            </a>


            <a href="#item-purchase" data-rel="dialog">Buy now</a>


        </li>


        <li>


            <a href="#item-detail">


                <h3>Using the jQuery Mobile API</h3>


                <p>The jQuery Mobile API provides an extra level of control over the
    customization of your mobile website.</p>


            </a>


            <a href="#item-purchase" data-rel="dialog">Buy now</a>


        </li>


    </ul>


    The split button list in this example contains articles as list items that include
    a title and an overview. When selected, additional details can be viewed for a
    particular article. Each list item also includes a gear icon hyperlink that the
    user can click to pay for access to the article within a dialog window. The visual
    representation of this list is shown in **[Figure 8.6](#ch08.html_ch08fig06)**.


    ![Image](graphics/jquery-8-6.jpg)


    Figure 8.6\. A split button list with gear icons.


    You can change the default icon for the split button that appears on the right
    side of the list item by using the `data-split-icon` attribute. The icons available
    with the `data-split-icon` attribute are the same as those available for buttons,
    as seen in **[Figure 8.7](#ch08.html_ch08fig07)**, but you can also use custom
    icons.


    ![Image](graphics/jquery-8-7.jpg)


    Figure 8.7\. Icons available to the split-button-icon attribute.


    #### List dividers


    List dividers let you categorize your list items and are another useful addition
    to basic linked lists. For example, you could alphabetize your list items and
    use dividers to group them by letter of the alphabet, or use dividers to group
    a list of music-related items by genre. The following example shows a list of
    bands as dividers and some of each band’s album titles:


    [Click here to view code image](#images.html_p114pro01)


    <ul data-role="listview">


        <li data-role="list-divider">The Beatles</li>


        <li>Meet The Beatles!</li>


        <li>A Hard Day''s Night</li>


        <li>Help!</li>


        <li>Rubber Soul</li>


        <li>Revolver</li>


        <li data-role="list-divider">The Doors</li>


        <li>The Doors</li>


        <li>Strange Days</li>


        <li>Waiting for the Sun</li>


        <li>The Soft Parade</li>


        <li>Morrison Hotel</li>


        <li data-role="list-divider">The Jimi Hendrix Experience</li>


        <li>Are You Experienced</li>


        <li>Bold as Love</li>


        <li>Electric Ladyland</li>


    </ul>


    The highlighted sections in this code example include a `data-role` with a value
    of `list-divider`. Using the `data-role` attribute value of `list-divider` visually
    differentiates these from other list items. **[Figure 8.8](#ch08.html_ch08fig08)**
    shows how the `list-divider` `data-role` creates this separation.'
