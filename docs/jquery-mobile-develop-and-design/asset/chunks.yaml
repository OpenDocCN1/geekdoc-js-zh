    for items that are only a few characters long, such as a date of birth (**[Figure
    10.17](#ch10.html_ch10fig17)**).


    ![Image](graphics/jquery-10-17.jpg)


    Figure 10.17\. (Right) Horizontally grouped select menus.


    #### Options


    You can also do quite a bit of customization on the select menu using options
    via the API or as `data-` attribute counterparts. The options that can be set
    for a select menu are shown in **[Table 10.1](#ch10.html_ch10tab01)**. All of
    these options can be set via the `selectmenu` method, except the `initSelector`
    option, which is set the same way as a text input.


    Table 10.1\. Select menu options


    ![Image](graphics/10tab01.jpg)


    #### Methods


    A select menu has more functionality than a text input, checkbox, or radio button
    and therefore has more methods associated with it. The standard `enable` and `disable`
    methods are included, but this element also includes `close`, `open`, and `refresh`.
    `refresh` can be used when a select menu has been rebuilt, for example, if Ajax
    were used to update the select menu based on prior selections in a web form. Or,
    this method can be used to refresh the menu if a visual update has been made.
    The o`p`en and `close` methods are self-explanatory, but here’s an example of
    how to use the `open` method:


    $(''select'').selectmenu(''open'');


    This code would set all select menus to open by default.


    We’ve already covered all the select menu events. This form element includes the
    option to be bound to standard JavaScript events and includes a `create` event.


    ### Sliders


    Sliders are a great addition to the group of form elements that are available
    for enhancement via jQuery Mobile. A slider can be used to choose a number within
    a certain range as it sets that number in a corresponding number input. To create
    a slider, you must set the element type to `range` and include a `min` and `max`
    value:


    [Click here to view code image](#images.html_p152pro01)


    <label for="my-slider">My slider</label>


    <input type="range" name="slider" id="my-slider" value="50" min="0" max="100"
    />


    A default value can also be added, which sets the position of the handle on the
    track. The slider in this example displays like **[Figure 10.18](#ch10.html_ch10fig18)**.


    ![Image](graphics/jquery-10-18.jpg)


    Figure 10.18\. An example of a basic slider.


    You can also add steps to the values that are returned. For example, if you didn’t
    want to return every single number between 0 and 100, you could set the `step`
    attribute to 10, which would return every tenth number:


    [Click here to view code image](#images.html_p152pro02)


    <label for="my-slider">My slider</label>


    <input type="range" name="slider" id="my-slider" value="50" min="0" max="100"
    step="10" />


    In addition to these attributes, you can add a fill highlight, which highlights
    the area of the track to the left of the handle (**[Figure 10.19](#ch10.html_ch10fig19)**):


    [Click here to view code image](#images.html_p153pro01)


    <label for="my-slider">My slider</label>


    <input type="range" name="slider" id="my-slider" value="50" min="0" max="100"
    step="10" data-highlight="true" />


    ![Image](graphics/jquery-10-19.jpg)


    Figure 10.19\. A slider with a fill highlight.


    #### Options


    The slider element has a decent selection of options you can set via the API or
    as `data-role` attributes, including `disabled`, `highlight`, `initSelector`,
    `mini`, `theme`, and `trackTheme`. By default, the `disabled` option is set to
    `false`. The `highlight` option defaults to `false`; however, it can be used to
    highlight the track to the left of the handle on all sliders if set to `true`,
    as in the following example:


    [Click here to view code image](#images.html_p153pro02)


    $(''.selector'').slider({ highlight: "true" });


    We’ve already covered the `initSelector`, `mini`, and `theme` options. The `trackTheme`
    option is unique to the slider; you can use it to set the theme of the track to
    a different theme than the rest of the slider.


    #### Methods and events


    The slider plug-in includes three methods you can use to modify a `slider` element:
    `enable`, `disable`, and `refresh`. The `enable` method enables a disabled slider:


    [Click here to view code image](#images.html_p154pro01)


    $(''.selector'').slider(''enable'');


    The `disable` method disables a slider so the user can’t interact with it:


    [Click here to view code image](#images.html_p154pro02)


    $(''.selector'').slider(''disable'');


    The `refresh` method can be used to refresh a slider after it’s been updated visually
    or functionally via JavaScript:


    [Click here to view code image](#images.html_p154pro03)


    $(''.selector'').slider(''refresh'');


    The events available to the slider plug-in are similar to those for other form
    elements. They include the ability to be bound to any standard JavaScript event,
    such as `change`, `focus`, `blur`, and so on. The slider plug-in also includes
    a `create` event you can use to execute custom code when the slider is created.


    ### Flip Toggle Switches


    Flip toggle switches are another handy addition to the mobile form element lineup.
    They provide a great solution for binary data, such as yes/no, on/off, or true/false
    functionality. The switch can be dragged from one position to another or the user
    can press the option and the switch will flip to the selected location. It’s easy
    to make a flip toggle switch: simply create a slider with only two options. The
    options can be anything you like, of any length, because the control resizes proportionally
    to accommodate the text:


    [Click here to view code image](#images.html_p154pro04)


    <label for="flip-switch">Do you like pizza?</label>


    <select name="slider" id="flip-switch" data-role="slider">


        <option value="yes">Yes</option>


        <option value="no">No</option>


    </select>


    The code that produces this toggle switch is a select menu with a `data-role`
    set to a value of `slider` and, of course, the key is to include only two options.
    The visual result of this slider is shown in **[Figure 10.20](#ch10.html_ch10fig20)**.


    ![Image](graphics/jquery-10-20.jpg)


    Figure 10.20\. A toggle switch interaction sequence.


    The flip toggle switch includes the exact same options, methods, and events as
    the slider, and each is accessed with the same syntax since the flip toggle switch
    is essentially just an extension of the slider. To learn more about the options,
    methods, and events accessible to the flip toggle switch, check out the “[Sliders](#ch10.html_ch10lev1sec4)”
    section earlier in this chapter.


    ### Wrapping Up


    jQuery Mobile offers great element options for handling form input. Usability
    increases dramatically with devices that respond with the appropriate keyboard
    based on the input type. Another bonus is that all of these form elements degrade
    when viewed in a browser that can’t handle them, so you never need to worry about
    your webpage breaking because someone isn’t using the latest and greatest mobile
    phone, for example. This is just another way that jQuery Mobile helps eliminate
    some of the common frustrations that come along with web development in general.


    ## 11\. Theming jQuery Mobile


    jQuery Mobile includes a complete theme framework that lets you customize color
    swatches and icon sets to create custom themed pages, toolbars, content, form
    elements, lists, buttons, and more. The framework uses CSS3 for many of its enhancements,
    such as shadows, gradients, and rounded corners, so no images are used to make
    these visual aspects, which makes the theme more lightweight and quick loading.


    This chapter provides an overview of the existing color swatches as well as details
    on how to create a custom theme. Custom theming allows you to create mobile versions
    of websites that follow the same branding as desktop versions, creating a unified
    design between your websites.


    ### Core Color Swatches'
