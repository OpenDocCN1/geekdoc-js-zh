    ![Image](graphics/jquery-11-14.jpg)\n\nFigure 11.14. A listview with a data-split-theme.\n\
    \n### Wrapping Up\n\njQuery Mobile themes are easy to use and powerful at the\
    \ same time. Every component can be themed, and when prebuilt swatches are not\
    \ enough, you can always go custom. Between ThemeRoller and the ability to manually\
    \ edit classes, you should be well on your way to creating your own themes.\n\n\
    # Part III: The Mobile API\n\n## 1. Global Options\n\nOn the surface, the jQuery\
    \ Mobile framework offers a quick and easy way to create mobile websites. However,\
    \ the framework also has an application interface (API) that can be used to extend\
    \ the basic functionality. The jQuery Mobile API provides an extra level of control\
    \ over the customization of your mobile website. From the setup of global options\
    \ to hooking into events and working with exposed methods is possible with the\
    \ API. By the end of this chapter, you’ll know how to define custom options for\
    \ your mobile website and how to write custom code that interacts with the jQuery\
    \ framework.\n\n### Extending the mobileinit Event\n\nAs introduced earlier, jQuery\
    \ Mobile includes an initialization event named `mobileinit`, that loads before\
    \ jQuery’s `document.ready` event. This lets you override and extend jQuery Mobile’s\
    \ default options, which is where customization begins. To extend the `mobileinit`\
    \ event, you need to order your JavaScript files correctly. Your custom JavaScript\
    \ event handler must be included before jQuery Mobile is loaded and after the\
    \ framework has loaded:\n\n[Click here to view code image](#images.html_p176pro01)\n\
    \n```html\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n<script src=\"assets/js/custom-qm.js\"></script>\n<script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n```\n\nTo extend the `mobileinit` event, you must first bind an anonymous\
    \ function to it, so you execute your custom code when the event fires:\n\n[Click\
    \ here to view code image](#images.html_p176pro02)\n\n```javascript\n$(document).bind(\"\
    mobileinit\", function() {\n    // Override global options here\n});\n```\n\n\
    Once you’ve successfully bound a callback function to the `mobileinit` event,\
    \ you can easily override the global options. The `$.mobile` object is the starting\
    \ point for setting all properties. This is where you’ll override global options\
    \ that affect the way your website functions. To override the global options,\
    \ you can use jQuery’s `extend` method to extend the `$.mobile` object:\n\n[Click\
    \ here to view code image](#images.html_p177pro01)\n\n```javascript\n$(document).bind(\"\
    mobileinit\", function() {\n    $.extend( $.mobile, {\n        property: value\n\
    \    });\n});\n```\n\nOr, you can simply override individual properties by setting\
    \ them directly using the `$.mobile` object:\n\n[Click here to view code image](#images.html_p177pro02)\n\
    \n```javascript\n$(document).bind(\"mobileinit\", function() {\n    $.mobile.property\
    \ = value;\n    // Set other properties\n});\n```\n\nIf you want to update multiple\
    \ properties, the `extend` method is a cleaner option because you don’t need to\
    \ write the `$.mobile` object multiple times. However, if you have only one property\
    \ to update, setting the property individually requires less code.\n\n### Creating\
    \ Custom Namespaces\n\nThe HTML5 `data-` attributes, such as `data-role`, can\
    \ be customized through namespaces. A namespace lets you add a custom name that\
    \ appears between the `data-` and `-role` portion of the `data-role` attribute,\
    \ for example. This property can be useful for customizing your code. It can also\
    \ prevent name collisions in the future as more third-party plugins are developed\
    \ and possibly included in your project. The `$.mobile` property for customizing\
    \ the namespace is `ns`:\n\n[Click here to view code image](#images.html_p178pro01)\n\
    \n```javascript\n$(document).bind(\"mobileinit\", function() {\n    $.mobile.ns\
    \ = \"jquerymobiletv-\";\n});\n```\n\nYou can set the `ns` option to any custom\
    \ value, such as `jquerymobiletv-`. Using the custom namespace produces:\n\n`data-jquerymobiletv-foo`\n\
    \nNotice that a dash has been included at the end of the namespace; without it\
    \ the result won’t include a dash in your namespace, so your `data-` attributes\
    \ will be hard to read and jQuery Mobile will look for an attribute that looks\
    \ like this: `data-jquerymobiletvfoo`\n\nBe aware that choosing a custom namespace\
    \ requires you to commit to that namespace while coding. During coding you’ll\
    \ include this custom namespace in your markup for any `data-` attributes that\
    \ you use. Again, this not only customizes your markup, it can also prevent name\
    \ collisions in the future if third-party plugins are used. Here’s an example\
    \ showing a custom `jquerymobiletv-` namespace:\n\n[Click here to view code image](#images.html_p178pro02)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>Custom Namespace - jQuery Mobile:\
    \ Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body>\n```\n"
