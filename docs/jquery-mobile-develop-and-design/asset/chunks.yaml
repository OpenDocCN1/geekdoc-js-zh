  trans: "\n\n钩入 jQuery Mobile 事件会开启一个机会世界。当你理解了如何钩入 jQuery Mobile 事件时，你可以创建你想象的任何任何自定义功能。从触摸事件到设备方向再到页面更改和过渡，所有事件都源自用户。了解何时以及如何对这些事件做出反应是无价的。\n\
    \n# 14. 使用暴露的方法\n\njQuery Mobile 框架包含了许多在 `$.mobile` 对象上暴露的方法和属性。暴露一个方法意味着允许第三方对其进行访问。换句话说，jQuery\
    \ Mobile 为第三方开发者提供了对在其整个框架中使用的某些内部方法的的访问权限。这些方法和属性让你能够利用一些 jQuery Mobile 的核心功能来创建让你的移动应用程序脱颖而出的定制功能。本章涵盖了切换页面、预加载页面以及许多实用方法和属性。\n\
    \n### 程序化切换页面\n\n程序化切换页面意味着你可以使用代码在有或无用户交互的情况下引导浏览器跳转到另一个页面。jQuery Mobile 框架中暴露的方法之一是\
    \ `changePage`，它通过提供程序化切换页的方式，为标准链接和表单提交添加了功能。在基础 JavaScript 中，该方法的等效实现是 `document.location`，它有时用于实现程序化的页面切换。除了基本的页面切换外，通过框架的\
    \ API 程序化切换页面时，典型的 jQuery Mobile 视觉效果（如页面加载和页面过渡）也可用。`changePage` 方法在内容动态添加到页面时非常有用。让我们为第\
    \ 13 章创建的“钩入事件”`logo` 组件添加一个 `click` 事件，这样你就可以使用 `changePage` 程序化切换页面了：\n\n点击此处代码图片\n\
    \n```javascript\n(function($){\n    $.widget(\"mobile.logo\", $.mobile.widget,\
    \ {\n        options: {\n            image: '',\n            width: 0,\n     \
    \       height: 0,\n            hyperlink: '#'\n        },\n        _create: function()\
    \ {\n            $(document).trigger(\"logocreate\");\n            var logoEl\
    \ = this.element;\n            logoEl.css('background', 'url('+this.options.image+')');\n\
    \            logoEl.width(this.options.width);\n            logoEl.height(this.options.height);\n\
    \            // 此方法将通过 jQuery Mobile API 触发页面切换\n            logoEl.click(function()\
    \ {\n                console.log(\"Widget has been clicked: \"+ $(this).attr('data-hyperlink'));\n\
    \                $.mobile.changePage($(this).attr('data-hyperlink'));\n      \
    \      });\n        }\n    });\n    $(document).bind(\"pagecreate\", function(e)\
    \ {\n        $(document).trigger(\"logobeforecreate\");\n        return $(\":jqmData(role='logo')\"\
    , e.target).logo();\n    });\n})(jQuery);\n```\n\n有了 `changePage` 方法，组件可以在用户选择它时切换页面。在例示例中，预期的链接是一个\
    \ HTML 属性，因为组件有一个支持此选项的额外属性。通过此选项，组件的每个实例都可以在 `data-hyperlink` 属性中包含自己的自定义链接：\n\
    \n点击此处代码图片\n\n```html\n<div data-role=\"logo\" data-image=\"assets/img/trademark-jquerymobiletv.png\"\
    \ data-width=\"200\" data-height=\"30\" data-hyperlink=\"http://www.jquery.tv\"\
    ></div>\n```\n\n虽然这可能不是最实用的示例，但它向你展示了创建一个自定义组件来处理任何功能。`changePage` 方法至少一个名为 `to`\
    \ 的参数，用于指定请求期间要切换的页面。`to` 参数的值可以是一个字符串（如本例所示），也可以是一个 jQuery 对象。`changePage` 还有其他用于自定义请求的可选参数。表\
    \ 14.1. `changePage` 属性。\n\n在 `options` 参数中添加属性非常简单，只需使用 JavaScript 对象 (JSON)\
    \ 创建一个逗号分隔的属性列表并设置特定值即可。JSON 是一种轻量级数据格式，可用于系统或数据库之间交换数据。jQuery 在整个库中使用 JSON 来传递数据和设置值。这些可选参数可以提供复杂的功能。例如，你可以设置请求类型来提交值：\n\
    \n点击此处代码图片\n\n```javascript\n$(document).ready(function() {\n    $('#next-btn').click(function()\
    \ {\n        $.mobile.changePage(\"step2.php\", {\n            type: \"post\"\
    ,\n            data: $(\"form#my-form\").serialize()\n        });\n    });\n});\n\
    ```\n\n这在多步骤过程中可能很有帮助，其中表单值从一个页面传递到另一个页面。以下示例包含一个带有电子邮件地址输入字段的表单。该表单没有提交按钮，而是包含一个\
    \ `id` 为 `next-btn` 的锚点元素，点击它时，会触发上一个示例中的 `changePage` 方法：\n\n点击此处代码图片\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n    <title>changePage</title>\n    <!-- 省略部分内容以保持结构 -->\n\
    </head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"header\"\
    ><h1>Page Header</h1></div>\n        <div data-role=\"content\">\n           \
    \ <form action=\"\" id=\"my-form\">\n                <label for=\"emailAddress\"\
    >Email Address</label>\n                <input type=\"text\" name=\"emailAddress\"\
    \ id=\"emailAddress\">\n            </form>\n            <a href=\"#\" id=\"next-btn\"\
    >Next</a>\n        </div>\n        <div data-role=\"footer\">Copyright</div>\n\
    \    </div>\n</body>\n</html>\n```\n\n`changePage` 方法设置为切换到名为 `step2.php` 的页面，其中\
    \ `type` 属性设置为 post 请求，`data` 属性设置为表单序列数据。表单包含一个名为 `emailAddress` 的输入框；当页面切换时，`emailAddress`\
    \ 输入的值会被发送到 `step2.php`：\n\n点击此处代码图片\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
    \    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n\
    \    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
    \    <title>changePage Form: Step2 - jQuery Mobile: Design and Develop</title>\n\
    </head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"header\"\
    ><h1>Page Header</h1></div>\n        <div data-role=\"content\">\n           \
    \ <form action=\"\">\n                <label for=\"firstName\">First Name</label>\n\
    \                <input type=\"text\" name=\"firstName\" id=\"firstName\">\n \
    \               <label for=\"lastName\">Last Name</label>\n                <input\
    \ type=\"text\" name=\"lastName\" id=\"lastName\">\n                <label for=\"\
    emailAddress\">Email Address</label>\n                <input type=\"text\" name=\"\
    emailAddress\" id=\"emailAddress\" value=\"<?php echo $_POST['emailAddress'];\
    \ ?>\">\n                <input type=\"submit\" value=\"Sign me up\">\n      \
    \      </form>\n        </div>\n        <div data-role=\"footer\">Copyright</div>\n\
    \    </div>\n</body>\n</html>\n```\n\n"
- fmt: "\nThe `step2.php` page includes additional form input fields to get more information\
    \ from the user before he officially submits the form. This example could be used\
    \ as a sign-up form for a newsletter, for example, gathering an email address\
    \ and then asking for a first and last name before actually submitting the form.\
    \ The `emailAddress` is carried over from the previous page through PHP’s `$_POST`\
    \ array and written to the corresponding field.\n\nThe `changePage` method is\
    \ a powerful means to handle not only page changes, but also form submissions.\
    \ It allows you to customize page changes in many interesting and unique ways.\n\
    \n### Loading Pages Silently\n\nAnother great `$.mobile` object method is `loadPage`.\
    \ You can use the `loadPage` method to load external pages without displaying\
    \ them. This is a useful way to preload pages so they display quicker when the\
    \ user clicks a link. To use this method, you need to write code much like we\
    \ did for the `changePage` method. First, of course, you have to wait for the\
    \ document to be ready or the page to be created. Then, when either of those events\
    \ triggers, you can call the `loadPage` event to preload one or multiple pages:\n\
    \n[Click here to view code image](#images.html_p217pro01)\n\n```javascript\n$(document).ready(function()\
    \ {\n    $.mobile.loadPage(\"page2.html\");\n});\n```\n\nThis method is so incredibly\
    \ easy to use and offers huge benefits. The following example embeds a JavaScript\
    \ file that includes the `loadPage` code:\n\n[Click here to view code image](#images.html_p217pro02)\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>loadPage- jQuery Mobile: Design\
    \ and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n    <script src=\"assets/js/custom-jqm-loadpage.js\"></script>\n</head>\n\
    <body>\n    <div data-role=\"page\">\n        <div data-role=\"header\"><h1>Page\
    \ Header</h1></div>\n        <div data-role=\"content\">\n            <a href=\"\
    page2.html\">Link to another page</a>\n        </div>\n        <div data-role=\"\
    footer\">Copyright</div>\n    </div>\n</body>\n</html>\n```\n\nAs soon as the\
    \ page is loaded and the document is ready, the `page2.html` file loads silently\
    \ in the background before any link is clicked. When the user clicks the anchor\
    \ element that links to the `page2.html` page, the file displays immediately.\
    \ **[Figure 14.1](#ch14.html_ch14fig01)** shows an example of the markup after\
    \ the page has been loaded via the `loadPage` method. As you can see, the page\
    \ has been loaded and inserted into the bottom of the current page.\n\n![Image](graphics/jquery-14-1.jpg)\n\
    \nFigure 14.1\\. An example of the markup after the loadPage method has loaded\
    \ the page2.html example. As you can see, the page is loaded, but not currently\
    \ displayed.\n\nThe `loadPage` method includes a required `url` argument that\
    \ can be a string representing a relative or absolute URL or it can be an object.\
    \ **[Table 14.2](#ch14.html_ch14tab02)** lists the properties available in a `loadPage`\
    \ request.\n\nTable 14.2\\. The loadPage properties \n\n![Image](graphics/14tab02.jpg)\n\
    \n### Working with Utility Methods\n\njQuery Mobile has several built-in utility\
    \ methods that provide useful functionality when developing a website. **[Table\
    \ 14.3](#ch14.html_ch14tab03)** lists the current utility methods supported by\
    \ the framework and a description of what each of them does.\n\nTable 14.3\\.\
    \ Utility methods\n\n![Image](graphics/14tab03.jpg)\n\nIn addition to the mentioned\
    \ utility methods, there is the `$.mobile.activePage` property, which is used\
    \ as a reference to the current page in view.\n\n**[Table 14.4](#ch14.html_ch14tab04)**\
    \ lists the properties associated with the object that’s returned from the `$.mobile.path.parseUrl`\
    \ method call.\n\nTable 14.4\\. The loadPage properties\n\n![Image](graphics/14tab02.jpg)\n\
    \n### Wrapping Up\n\nThe `loadPage` method includes a required `url` argument\
    \ that can be a string representing a relative or absolute URL or it can be an\
    \ object. **[Table 14.2](#ch14.html_ch14tab02)** lists the properties available\
    \ in a `loadPage` request. (Wait, the provided text seems to have repetitions/overlaps,\
    \ I will maintain the formatting based on the provided content structure).\n"
  raw: 'The `step2.php` page includes additional form input fields to get more information
    from the user before he officially submits the form. This example could be used
    as a sign-up form for a newsletter, for example, gathering an email address and
    then asking for a first and last name before actually submitting the form. The
    `emailAddress` is carried over from the previous page through PHP’s `$_POST` array
    and written to the corresponding field.


    The `changePage` method is a powerful means to handle not only page changes, but
    also form submissions. It allows you to customize page changes in many interesting
    and unique ways.


    ### Loading Pages Silently


    Another great `$.mobile` object method is `loadPage`. You can use the `loadPage`
    method to load external pages without displaying them. This is a useful way to
    preload pages so they display quicker when the user clicks a link. To use this
    method, you need to write code much like we did for the `changePage` method. First,
    of course, you have to wait for the document to be ready or the page to be created.
    Then, when either of those events triggers, you can call the `loadPage` event
    to preload one or multiple pages:


    [Click here to view code image](#images.html_p217pro01)


    $(document).ready(function() {


        $.mobile.loadPage("page2.html");


    });


    This method is so incredibly easy to use and offers huge benefits. The following
    example embeds a JavaScript file that includes the `loadPage` code:


    [Click here to view code image](#images.html_p217pro02)


    <!DOCTYPE HTML>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>loadPage- jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


        <script src="assets/js/custom-jqm-loadpage.js"></script>


    </head>


    <body>


        <div data-role="page">


            <div data-role="header"><h1>Page Header</h1></div>


            <div data-role="content">


                <a href="page2.html">Link to another page</a>


            </div>


            <div data-role="footer">Copyright</div>


        </div>


    </body>


    </html>


    As soon as the page is loaded and the document is ready, the `page2.html` file
    loads silently in the background before any link is clicked. When the user clicks
    the anchor element that links to the `page2.html` page, the file displays immediately.
    **[Figure 14.1](#ch14.html_ch14fig01)** shows an example of the markup after the
    page has been loaded via the `loadPage` method. As you can see, the page has been
    loaded and inserted into the bottom of the current page.


    ![Image](graphics/jquery-14-1.jpg)


    Figure 14.1\. An example of the markup after the loadPage method has loaded the
    page2.html example. As you can see, the page is loaded, but not currently displayed.


    The `loadPage` method includes a required `url` argument that can be a string
    representing a relative or absolute URL or it can be an object. **[Table 14.2](#ch14.html_ch14tab02)**
    lists the properties available in a `loadPage` request.


    Table 14.2\. The loadPage properties


    ![Image](graphics/14tab02.jpg)


    ### Working with Utility Methods


    jQuery Mobile has several built-in utility methods that provide useful functionality
    when developing a website. **[Table 14.3](#ch14.html_ch14tab03)** lists the current
    utility methods supported by the framework and a description of what each of them
    does.


    Table 14.3\. Utility methods


    ![Image](graphics/14tab03.jpg)


    In addition to the mentioned utility methods, there is the `$.mobile.activePage`
    property, which is used as a reference to the current page in view.


    **[Table 14.4](#ch14.html_ch14tab04)** lists the properties associated with the
    object that’s returned from the `$.mobile.path.parseUrl` method call. Each of
    these properties represents a component of the URL and is expressed as a string.


    Table 14.4\. $.mobile.path.parseUrl properties


    ![Image](graphics/14tab04.jpg)


    To use any of these utilities, simply wait for the page to load and access them
    through `the` `$.mobile` object. These utility methods and properties offer quick
    ways to access or alter data needed when developing with jQuery Mobile. You may
    even find that you need functionality in addition to these methods and properties
    and need to create your own set of utilities/custom JavaScript methods to be reused
    in your application.


    ### Wrapping Up


    Accessing exposed methods and properties offers a way to tap directly into the
    jQuery Mobile framework and interact with code functionality to create customized
    mobile applications. There’s a lot happening behind the scenes with this simple
    framework, and there are many ways to add custom functionality to provide powerful
    mobile websites and applications. By tapping into the API you can create any functionality
    you need.


    # Part IV: jQuery Mobile CMS


    ## 15\. Installing a Mobile WordPress Theme


    WordPress is a powerful content management system (CMS) that began as a way to
    create simple blogs and websites. It’s currently used by over 60 million people
    and growing. WordPress development is in demand and having the ability to create
    mobile WordPress websites just adds to the appeal. This chapter starts from the
    beginning, showing you where and how to install WordPress on a web server, then
    explains where to get the jQuery Mobile WordPress theme and how to install it,
    and finally shows you how to create new pages and blog posts.


    ### Getting Started


    You have two options when creating a WordPress website. The first is to visit
    [wordpress.com](http://wordpress.com) and create a blog on their huge network.
    The second, and the one we’ll be using in this chapter, is to visit [wordpress.org](http://wordpress.org)
    and download WordPress to install on your own server using what they call their
    “famous 5-minute installation.” As you’ll see in this chapter, it’s actually true,
    but first you need to have a web server and a database installed. If you don’t
    have a web server of your own, WordPress recommends the web hosts listed on [http://wordpress.org/hosting/](http://wordpress.org/hosting/),
    or you can find a web host of your choice. The only caveat is that your web server
    needs to have PHP and MySQL to run WordPress.


    #### Installing WordPress


    Once you have a web server set up, you’ll need to upload the WordPress files and
    then download a MySQL database to configure WordPress. You can find the WordPress
    configuration in the wp-config.php file. For the database, there are a number
    of free MySQL apps you can download and use. For the example in this chapter,
    we’ll use Sequel Pro for Mac OS, which you can download at [www.sequelpro.com](http://www.sequelpro.com),
    and we’ll create a database named jqm-wp using Sequel Pro (**[Figure 15.1](#ch15.html_ch15fig01)**).


    ![Image](graphics/jquery-15-1.jpg)


    Figure 15.1\. Adding a database named jqm-wp to store WordPress data.


    With the database in place, the last step is to add the database login data to
    the WordPress configuration file or, as mentioned previously, wp-config.php (**[Figure
    15.2](#ch15.html_ch15fig02)**). Again, this file is what contains the server configuration
    data for WordPress. You’ll need to at least complete the `DB_NAME`, `DB_USER`,
    `DB_PASSWORD`, and `DB_HOST` variables to get WordPress to point to your database.


    ![Image](graphics/jquery-15-2.jpg)


    Figure 15.2\. Adding the database connection information to the wp-config.php
    file.


    The names are pretty self-explanatory, but it’s important to know what they are.
    **[Table 15.1](#ch15.html_ch15tab01)** lists the variable names along with brief
    descriptions of each.


    Table 15.1\. WordPress database configuration variables


    ![Image](graphics/15tab01.jpg)'
