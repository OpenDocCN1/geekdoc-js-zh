  trans: "\n\n要开始使用 jQuery，你首先需要从 [jquery.com](http://jquery.com) 下载框架并将其包含在网页中，或者你也可以通过\
    \ Google、Microsoft 或 jQuery 内容分发网络（CDN）引用它。我推荐并经常通过 CDN 引用该库，因为它更快。CDN 会将你的内容分发到多个地理分散的服务器上，因此用户将接收到最近的文件。此外，Google\
    \ 和 Microsoft 都提供了通过 HTTPS 支持安全套接层 (SSL) 的版本，如果你在 SSL 下进行任何类型的开发，这是必不可少的。要通过 CDN\
    \ 引入库（我们以 Google 为例），使用 `script` 元素将其包含在 `<head>` 元素内或网页末尾。\n\n点击此处查看代码图片\n\n\
    ```html\n<script type=\"text/javascript\" src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    >\n</script>\n```\n\n在 `<head>` 元素中包含 JavaScript 文件是传统方法。但根据 Yahoo! 的说法，“终端用户响应时间的\
    \ 80% 都在前端。”大部分时间花在了下载资源上，如样式表、图像、脚本等。减少资源数量显然是重要的，但在 HTML 文件末尾包含 JavaScript 变得变得越来越常见。这是因为脚本会阻塞并行下载，这意味着在每个脚本被单独下载之前，其他资源将不会下载。为了确保你将脚本放置在正确的位置，只需在闭合的\
    \ `</html>` 标签之前包含它们。\n\n在生产环境中使用压缩后的版本（minified version）是最好的，因为它比源版本更小。此外，虽然包版本（packed\
    \ version）比压缩后的版本更小，但它需要客户端处理时间来解压缩文件，而且在最新版本中已不可用。根据 Yahoo! 的说法，“在对十个美国顶级网站的调查中，代码压缩实现了\
    \ 21% 的体积缩减。”\n\n## jQuery 基础\n\n如果你熟悉编写 JavaScript 和 CSS，那么编写第一个 jQuery 脚本会感到非常熟悉，但可能稍微有一点奇异。jQuery\
    \ 框架是一个 JavaScript 库，这意味着它是用 JavaScript 构建的。基础知识是相同的，因为你本质上仍然在编写 JavaScript，只是恰好你编写的方式使用了\
    \ jQuery 框架。换句话说，虽然对某些基础知识可能增加了增强，但 JavaScript 的核心——变量、函数、条件语句等——并没有改变。所以，你仍然将使用\
    \ `var` 关键字、`if` 和 `switch` 语句以及函数，但你一定会注意到许多额外的增强和不同的编写方式，即访问 HTML 元素。\n\njQuery\
    \ 为 JavaScript 语言提供了许多增强，正如前面提到的，最棒的部分是它是跨浏览器兼容的，因此你再也不需要为处理不同的浏览器编写同一个脚本的多个版本了，这确实让人松了一气。这在处理事件、Ajax（本章稍后会讨论）以及其他传统上需要一些条件语句来确定浏览器如何解释代码的功能时\
    \ 特别有用。\n\n### 选择 HTML 元素\n\n与其不断使用 `document.getElementById()` 来访问网页中的 HTML 元素，你只需简单地使用\
    \ jQuery 选择器 `jquery()` 或 `$()` 函数，后者是简写版本，也是我将在本书中一直使用的版本。使用 jQuery 选择器不仅让你编写的字符更少，还让你能做比通过\
    \ `id` 访问元素多多的事情。通过 jQuery 选择器，你还可以访问 HTML 元素数组，或者通过名称访问元素或对象。jQuery 选择器将一个元素或一组元素封装成一个\
    \ jQuery 对象，允许你对对象本身应用 jQuery 方法。而且不仅如此：你甚至可以通过类名访问元素，或使用 CSS 选择器，如 `:first-child`、`:nth-child`\
    \ 等。以下是几个示例：\n\n-   要使用 jQuery 选择器通过 ID 访问元素，使用 `#id` 选择器，就像你在 CSS 中通过 ID 为元素附加类名一样：\n\
    \n```javascript\n$('#foo');\n```\n\n-   要通过类名访问元素，使用 `.class` 选择器，就像你在创建 CSS 类时一样。如果你有多个具有相同类名的元素，它们都将被选中。\n\
    \n```javascript\n$('.foo');\n```\n\n-   要选取带有特定类名的特定元素，在类名之前添加元素名称：\n\n```javascript\n\
    $('div.foo');\n```\n\n-   你甚至可以使用元素选择器选取特定的元素或一组元素：\n\n```javascript\n$('div');\n\
    ```\n\n如果你熟悉 CSS，你可能开始看到这种模式的展开和无尽的可能性。构建 CSS 类时的可用选项与你使用 jQuery 选择器访问 HTML 元素时使用的选项是相同的。这就是\
    \ jQuery 如何增强 JavaScript 和 CSS 的——它将两者并将它们的语法合并成一种新语言，当然，在合理使用的情况下，这增强了整体用户体验。\n\
    \n### 管理事件和函数\n\njQuery 使用事件来响应网页上的用户交互，例如鼠标点击。在 jQuery 中，事件非常容易管理，而且它们在所有主流浏览器中都是可靠的，这是一件大事，因为在传统的\
    \ JavaScript 中并不总是如此。jQuery 赋予你从任何现有的 HTML 元素拦截许多不同事件的能力。通常，事件被用于执行某种函数。在下面的示例中，一个\
    \ `click` 事件被绑定到类名为 `foo` 的 `div` 元素上：\n\n点击此处查看代码图片\n\n```javascript\n$('div.foo').click(function(e)\
    \ {\n    // 你的代码\n});\n```\n\n通过将 `click` 事件绑定到 `div`，为点击该 `div` 关联了一个函数。因此，每当点击\
    \ `div.foo` 时，你的自定义代码就会执行。\n\n如果你熟悉传统的 JavaScript，这种语法看起来很奇怪。别担心——我刚开始时也是这样，但一旦学会了，我就喜欢它了。一旦你熟悉了它，你会发现这种语法封装良好、易于理解且易于编写。让我们分解一下之前的示例：\n\
    \n1. jQuery 选择器用于选取 `div.foo`，然后变成一个 jQuery 对象。\n2. `div.foo` jQuery 对象在 `div.foo`\
    \ 被点击时使用 `click` 方法触发处理函数。\n3. 处理函数用于执行自定义代码。处理函数还可以访问 `eventObject`，它是作为参数传递的。在示例中，它是处理函数中的参数\
    \ `e`。\n\n如果你使用 jQuery 选择器选择一个多个 HTML 元素使用的类名并分配鼠标事件，该鼠标事件将自动绑定到所有这些元素。因此，在上面的示例中，如果你有多个类名为\
    \ `foo` 的 `div` 元素，`click` 事件将绑定到所有它们。在处理绑定到多个元素的事件时，考虑作用域是重要的，以确保你执行的任何自定义代码都应用于目标元素。\n\
    \n点击此处查看代码图片\n\n```javascript\n$('div.foo').click(function(e) {\n    alert($(this).html());\n\
    });\n```\n\n在此示例中，`$(this)` 用于访问作用范围内的当前元素。\n\n* *\n\n![Image](img/note.jpg) 注意\n\
    \n作用域是值所关联的上下文。在这种情况下，函数是上下文，而 `$(this)` 是值。\n\n"
- fmt: "\n`$(this)` is the same as using the `this` keyword in JavaScript; in this\
    \ case, it applies to the element that is currently firing the `click` event.\
    \ When considering scope, `this` always refers to the object associated with the\
    \ enclosing context. In the example, `div.foo` is the object and the handler function\
    \ for the `click` event is the enclosing context. jQuery will automatically assign\
    \ the element that is clicked as `$(this)` inside your anonymous handler function.\
    \ This lets you access the element that executed the event, even when the same\
    \ code is applied to multiple elements. Functions are used to execute a script\
    \ or a set of scripts as the result of an event or a simple and direct call to\
    \ the function.\n\n### The `bind` Method and Custom Events\n\nAs you’ll learn\
    \ later in this book, the `bind` method is often used by the `jQuery Mobile` framework\
    \ to handle custom events.\n\n#### jQuery Mobile Custom Events\n\nThe custom events\
    \ provided by `jQuery Mobile` create useful hooks for development beyond the native\
    \ functionality of the framework, meaning that you can intercept certain existing\
    \ events and add your own custom code. Such events include `touch`, `mouse`, and\
    \ `window` events, all of which you’ll learn how to extend later in this book.\
    \ The syntax for the `bind` method in jQuery is very similar to the previous code\
    \ example.\n\n[Click here to view code image](#images.html_p010pro01)\n\n```javascript\n\
    $('div.foo').bind('click', function(e) {\n    // Your custom code here\n});\n\
    ```\n\nThe difference is that you can react to multiple events with the same handler:\n\
    \n[Click here to view code image](#images.html_p010pro02)\n\n```javascript\n$('div.foo').bind('mouseenter\
    \ mouseleave', function(e) {\n    // Your custom code here\n});\n```\n\n***\n\n\
    ![Image](graphics/note.jpg) Note\n\nThe difference between a function and a method\
    \ is that a function is stand-alone and a method is associated with an object.\
    \ In this case, the `bind` method is associated with the `jQuery` object.\n\n\
    ***\n\n#### Handling Custom Events\n\nOr you can handle custom events, such as\
    \ those implemented by the `jQuery Mobile` framework:\n\n[Click here to view code\
    \ image](#images.html_p011pro01)\n\n```javascript\n$('div.foo').bind('displayMyName',\
    \ function(e, myName) {\n    alert('My name is: '+ myName);\n});\n\n$('button').click(function\
    \ () {\n    $('div.foo').trigger('displayMyName', ['John Smith']);\n});\n```\n\
    \nBinding events will be covered in greater depth when we discuss how to bind\
    \ `jQuery Mobile` events with custom handler functions.\n\n### Waiting for documents\
    \ to be ready\n\nA common practice among developers is to wait for a webpage to\
    \ load before executing any JavaScript. The reason for doing this is to ensure\
    \ that the webpage elements are available before trying to access or manipulate\
    \ them. Attempting to access unavailable document elements can lead to unexpected\
    \ behavior and potentially break all your subsequent JavaScript. With traditional\
    \ JavaScript, the most common way to wait for the page to load is to use the `window.onload`\
    \ event. However, this approach happens after the document loads, because it actually\
    \ waits for all images and banners to load within a webpage, which can delay your\
    \ scripts tremendously. Luckily, jQuery provides a `ready` event that lets your\
    \ code respond immediately when the document becomes available.\n\n[Click here\
    \ to view code image](#images.html_p011pro02)\n\n```javascript\n$(document).ready(function()\
    \ {\n    // Your custom code here\n});\n```\n\nFirst, you need to select the document\
    \ object itself and then apply the `ready` event. When the `ready` event fires,\
    \ it will execute a function that will contain your custom code. Continuing with\
    \ the previous examples, you need to add the custom code to the `ready` event\
    \ to ensure that the document is ready before trying to apply the `click` event:\n\
    \n[Click here to view code image](#images.html_p012pro01)\n\n```javascript\n$(document).ready(function()\
    \ {\n    $('div.foo').click(function() {\n        alert($(this).html());\n   \
    \ });\n});\n```\n\nOr you can use a shortcut version, which eliminates the need\
    \ to access the `document` and set the `ready` event.\n\n[Click here to view code\
    \ image](#images.html_p012pro02)\n\n```javascript\n$(function() {\n    $('div.foo').click(function()\
    \ {\n        alert($(this).html());\n    });\n});\n```\n\nUsing the `ready` event\
    \ is the de facto standard with any jQuery development. Not only does this approach\
    \ ensure that your code will fire at the appropriate time, it also lends itself\
    \ to creating completely unobtrusive code, meaning that you can write all your\
    \ jQuery in a separate, external file that is simply referenced from your HTML\
    \ webpage.\n\n### Applying special effects\n\n`jQuery` is well-known for the special\
    \ effects it lets you create without using third-party plug-ins, such as `Flash`.\
    \ The library provides many techniques for incorporating animation into a webpage.\
    \ Animations can create a more visually appealing webpage, or they can serve other,\
    \ more practical purposes, such as providing visual feedback to user interactions.\
    \ Many prebuilt animation methods are included in the `jQuery` framework, such\
    \ as `fadeIn`, `fadeOut`, `fadeTo`, `show`, `toggle`, `slideUp`, and `slideDown`,\
    \ among others.\n\n```javascript\n$(document).ready(function() {\n    $('div.foo').fadeIn();\n\
    });\n```\n\nAlthough these prebuilt methods appear to be independent, many of\
    \ them are powered internally by the `animate` method. The `animate` method can\
    \ be used to animate any numerical CSS property, such as `height`, `opacity`,\
    \ `left`, and `right`.\n\n[Click here to view code image](#images.html_p013pro01)\n\
    \n```javascript\n$(document).ready(function() {\n    $('div.foo').click(function()\
    \ {\n        $(this).animate({\n            height: '+=50'\n        }, 1000, function()\
    \ {\n            // Your custom code, when animation is complete\n        });\n\
    \    });\n});\n```\n\nIn this example, when `div.foo` is clicked, its `height`\
    \ property is increased by 50 pixels over a time period of 1 second (1000 milliseconds),\
    \ and when the animation is complete, a callback function will execute your custom\
    \ code. A callback function is used to delay the execution of code until something\
    \ happens. This is pretty powerful stuff; not only can you animate when an event\
    \ is fired, you can fire a function or even another event when the animation is\
    \ complete, and so on.\n\n#### Queue Methods\n\nThe `queue` method provides a\
    \ way to queue a string of sequential effects, meaning that you can run multiple\
    \ effects in a queue or you can stop the queue by using the `clearQueue` method.\
    \ The `queue` method is used primarily by the `FX` `queue`, which is the default\
    \ `queue`, but is also made available via the `jQuery` API.\n\nThe `queue` and\
    \ `dequeue` methods are meant to be associated with a particular element or object.\
    \ To use the `queue` method, you need to assign a `queueName` as the argument,\
    \ such as an anonymous function:\n\n```javascript\n$(document).ready(function()\
    \ {\n    $('div.foo').fadeOut().queue(function(){\n        $('div.foo').fadeIn();\n\
    \        next();\n    });\n});\n```\n\nThis sort of functionality lets you produce\
    \ timeline-based animations without using JavaScript functions such as `setTimeout`\
    \ or `setInterval`. \n\nThese examples covered only the animation methods. `jQuery`\
    \ includes methods for creating queues to provide additional functionality. **[Table\
    \ 1.1](#ch01.html_ch01tab01)** lists the queue methods available in jQuery.\n\n\
    Table 1.1 Queue methods\n\n![Image](graphics/01tab01.jpg)\n\nAs mentioned, although\
    \ queues are often used for effects and are listed under effects in the jQuery\
    \ documentation, they can also be used to queue other sorts of functionality,\
    \ such as a series of asynchronous method calls, which leads us to Ajax using\
    \ jQuery.\n\n#### Using Ajax\n"
