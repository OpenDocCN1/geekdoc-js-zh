    \n图 10.17。（右侧）水平分组的下拉菜单。\n\n#### 选项\n\n你还可以通过 API 提供的选项或 `data-` 属性的等效项对下拉菜单进行相当的自定义。为下拉菜单可以设置的选项可以在`表\
    \ 10.1`所示。所有这些选项都可以通过 `selectmenu` 方法设置，但 `initSelector` 选项除外，该选项设置方法与文本输入相同。\n\
    \n表 10.1 下拉菜单选项\n\n![Image](img/10tab01.jpg)\n\n#### 方法\n\n下拉菜单的功能比文本输入、复选框或单选按钮更丰富，因此与之关联的方法更多。它包含了标准的\
    \ `enable` 和 `disable` 方法，但该元素还包含了 `close`、`open` 和 `refresh`。当下拉菜单被重新构建时，可以使用\
    \ `refresh`，例如，如果使用 Ajax 根据 Web 表单中之前的选择来更新下拉菜单。或者，如果进行了视觉更新，可以使用此方法来刷新菜单。`open`\
    \ 和 `close` 方法是自言自明的，但这里有一个如何使用 `open` 方法的示例：\n\n```\n$('select').selectmenu('open');\n\
    ```\n\n此代码将把所有下拉菜单设置为默认打开。\n\n我们已经涵盖了所有的下拉菜单事件。此表单元素包含了绑定到标准 JavaScript 事件的选项，并包含一个\
    \ `create` 事件。\n\n### 滑块\n\n滑块是可以通过 jQuery Mobile 增强的表单元素组的一项极佳补充。可以使用滑块在特定范围范围内选择一个数字，因为它会将该数字设置在相应的数字输入框中。要创建一个滑块，你必须将元素类型设置为\
    \ `range` 并包含 `min` 和 `max` 值：\n\n点击此处查看代码图像\n\n```html\n<label for=\"my-slider\"\
    >My slider</label>\n<input type=\"range\" name=\"slider\" id=\"my-slider\" value=\"\
    50\" min=\"0\" max=\"100\" />\n```\n\n也可以添加默认值，它会设置滑块在轨道上的位置。此示例中的滑块显示类似于`图 10.18`。\n\
    \n![Image](img/jquery-10-18.jpg)\n\n图 10.18 一个基础滑块的示例。\n\n你还可以为返回的数值添加步长。例如，如果你不想返回\
    \ 0 到 100 之间的每一个数字，你可以将 `step` 属性设置为 10，这将返回每隔十个数的数字：\n\n点击此处查看代码图像\n\n```html\n\
    <label for=\"my-slider\">My slider</label>\n<input type=\"range\" name=\"slider\"\
    \ id=\"my-slider\" value=\"50\" min=\"0\" max=\"100\" step=\"10\" />\n```\n\n\
    除了这些属性外，你还可以添加填充高亮，它会高亮滑块左侧的轨道区域（`图 10.19`）：\n\n点击此处查看代码图像\n\n```html\n<label\
    \ for=\"my-slider\">My slider</label>\n<input type=\"range\" name=\"slider\" id=\"\
    my-slider\" value=\"50\" min=\"0\" max=\"100\" step=\"10\" data-highlight=\"true\"\
    \ />\n```\n\n![Image](img/jquery-10-19.jpg)\n\n图 10.19 带有填充高亮的滑块。\n\n#### 选项\n\
    \n滑块元素有一系列相当的选项，你可以通过 API 或 `data-role` 属性进行设置，包括 `disabled`、`highlight`、`initSelector`、`mini`、`theme`\
    \ 和 `trackTheme`。默认情况下，`disabled` 选项设置为 `false`。`highlight` 选项默认为 `false`；但是，如果设置为\
    \ `true`，则可以用于高亮所有滑块中滑块左侧的轨道，如下例例所示：\n\n点击此处查看代码图像\n\n```\n$('.selector').slider({\
    \ highlight: \"true\" });\n```\n\n我们已经涵盖了 `initSelector`、`mini` 和 `theme` 选项。`trackTheme`\
    \ 选项是滑块特有的；你可以用它将轨道的主设置为与滑块其他部分不同的主题。\n\n#### 方法和事件\n\n滑块插件包含了三个你可以用来修改 `slider`\
    \ 元素的方法：`enable`、`disable` 和 `refresh`。`enable` 方法可以启用被禁用的滑块：\n\n点击此处查看代码图像\n\n\
    ```\n$('.selector').slider('enable');\n```\n\n`disable` 方法可以禁用滑块，使用户无法与其交互：\n\n\
    点击此处查看代码图像\n\n```\n$('.selector').slider('disable');\n```\n\n`refresh` 方法可以在滑块被更新后用于刷新它：\n\
    \n点击此处查看代码图像\n\n```\n$('.selector').slider('refresh');\n```\n\n滑块可用的事件与其他元素类似，滑块插件还包含一个\
    \ `create` 事件，当滑块创建时可以使用。\n\n### 翻转开关\n\n翻转开关是表单元素的另一项实用的补充。它们为二值数据提供了极佳的解决方案，例如是/否、开启/关闭或/假。开关可以从一个位置移动到另一个位置，或者用户可以点击它使其切换到选定位置。制作翻转开关很简单：只需创建一个包含两个选项的滑块，因为它会根据文本调整大小：\n\
    \n点击此处查看代码图像\n\n```html\n<label for=\"flip-switch\">Do you like pizza?</label>\n\
    <select name=\"slider\" id=\"flip-switch\" data-role=\"slider\">\n  <option value=\"\
    yes\">Yes</option>\n  <option value=\"no\">No</option>\n</select>\n```\n\n产生翻转开关的代码是一个\
    \ `data-role` 设置为 `slider` 值的下拉菜单，当然，关键在于包含两个选项。此滑块的视觉结果如`图 10.20`所示。\n\n![Image](img/jquery-10-20.jpg)\n\
    \n图 10.20 翻转开关交互序列。\n\n翻转开关包含了与滑块完全相同的选项、方法和事件，可以使用相同的语法访问，因为翻转开关本质上是滑块的扩展。要了解更多关于翻转开关的选项、方法和事件，请查看本章前面的“滑块”。\n\
    \n### 总结\n\njQuery Mobile 为表单输入提供了极佳的元素选项。设备根据输入类型响应相应的键盘时，可用性大大提高。另一个益处是，所有这些表单元素在无法处理它们的浏览器中查看时都会降级，因此你永远不需要担心由于某人没有使用最新、最强大的手机而导致你的网页崩溃，例如。这仅仅是\
    \ jQuery Mobile 帮助消除通用的 Web 开发中伴随的一些常见困扰的又一种方式。\n\n## 11\\. 为 jQuery Mobile 设置主题\n\
    \njQuery Mobile 包含一个完整的主题框架，允许你自定义色板和图标集，以创建自定义主题的页面、工具栏、内容、表单元素、列表、按钮等。该框架使用\
    \ CSS3 许多许多增强功能，例如阴影、渐变和圆角，因此不使用图像来实现这些视觉效果，这使得主题更加轻量且加载速度更快。\n\n本章提供了现有色板的概述，并详细说明了如何创建自定义主题。自定义主题允许你创建与桌面版本具有相同品牌设计的移动版本网站，从而在你的网站之间创建统一的设计。\n\
    \n### 核心色板"
- fmt: "\njQuery Mobile has a theme system containing five swatches that are defined\
    \ by the letters “a” through “e.” Swatches can be mixed and matched throughout\
    \ a single webpage to allow for complete customization. The default swatches all\
    \ contain color and texture, padding, and predefined dimensions to separate them\
    \ from one another. [Table 11.1](#ch11.html_ch11tab01) includes the default swatches\
    \ and descriptions of each.\n\n#### Table 11.1 jQuery Mobile default swatches\n\
    \n![Image](graphics/11tab01.jpg)\n\nUsing a swatch is as simple as using the `data-theme`\
    \ attribute, which can be used on any HTML element with the jQuery Mobile framework.\
    \ The following code shows a group of five buttons, each with a different default\
    \ theme:\n\n[Click here to view code image](#images.html_p158pro01)\n\n```html\n\
    <a href=\"#\" data-role=\"button\" data-theme=\"a\">Swatch A</a>\n<a href=\"#\"\
    \ data-role=\"button\" data-theme=\"b\">Swatch B</a>\n<a href=\"#\" data-role=\"\
    button\" data-theme=\"c\">Swatch C</a>\n<a href=\"#\" data-role=\"button\" data-theme=\"\
    d\">Swatch D</a>\n<a href=\"#\" data-role=\"button\" data-theme=\"e\">Swatch E</a>\n\
    ```\n\nWhether this is a set of buttons, list items, or bars, the jQuery Mobile\
    \ framework gives you the ability to define different themes for these items.\
    \ [Figure 11.1](#ch11.html_ch11fig01) shows the group of buttons in the example.\
    \ As you can see, each has a different color based on the theme assigned to it.\n\
    \n![Image](graphics/jquery-11-1.jpg)\n\nFigure 11.1. Group of buttons with different\
    \ theme swatches assigned.\n\nYou can update an existing swatch or create a custom\
    \ color swatch. To create a custom swatch, simply copy an existing theme swatch\
    \ from the jQuery Mobile style sheet and update it to a letter that’s not already\
    \ in use as a default swatch (that is, letters “f” through “z” or any custom name).\
    \ First, you’ll need to find a swatch in the style sheet that you want to copy;\
    \ let’s use the “a” swatch for this example. The style sheet that we want to get\
    \ the swatch from is the one that we’ve been attaching to all the samples throughout\
    \ this book. The only difference here is that we’ll look at the non-minified version\
    \ to make it easier to find where the swatch begins and ends. You’ll find the\
    \ non-minified version of this style sheet at [http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.css](http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.css),\
    \ which is the same address we’ve been including all along, minus the `.min` portion\
    \ in the CSS’s file-name. To create a copy of the swatch simply copy and paste\
    \ the many CSS swatch classes into a new CSS file and do a search and replace\
    \ on the suffix `-a`, with a letter between “f” and “z.” For example, to create\
    \ an “f” swatch, you would search and replace `-a` with `-f` and all the CSS swatch\
    \ classes would be updated, leaving you with a new “f” swatch. Here’s an example\
    \ of the `ui-bar` class after it’s been modified for the “f” swatch:\n\n[Click\
    \ here to view code image](#images.html_p159pro01)\n\n```css\n.ui-bar-f {\n  \
    \  border: 1px solid #cccccc;\n    background: #cccccc;\n    color: #cccccc;\n\
    \    font-weight: bold;\n    text-shadow: 0 -1px 1px #000000;\n    background-image:\
    \ -webkit-gradient(linear, left top, left bottom, from(#cccccc), to(#999));\n\
    \    background-image: -webkit-linear-gradient(#cccccc, #999);\n    background-image:\
    \      -moz-linear-gradient(#cccccc, #999);\n    background-image:      -ms-linear-gradient(#cccccc,\
    \ #999);\n    background-image:      -o-linear-gradient(#cccccc, #999);\n    background-image:\
    \          linear-gradient(#cccccc, #999);\n}\n```\n\nNow it’s up to you to customize\
    \ the properties of those classes. Once you have your new swatch, you can easily\
    \ use it on any jQuery Mobile element, as in the following button example:\n\n\
    [Click here to view code image](#images.html_p159pro02)\n\n```html\n<a href=\"\
    #\" data-role=\"button\" data-theme=\"f\">Custom Swatch F</a>\n```\n\n### The\
    \ ThemeRoller\n\nAnother way to create a custom swatch is to use the ThemeRoller\
    \ tool, which lets you create an entire theme with multiple custom swatches in\
    \ a simple interface.\n\n![Image](graphics/tip.jpg)\n\nThe ThemeRoller tool is\
    \ an easy way to create a custom theme, but it can be tough to figure out the\
    \ underlying CSS. ThemeRoller provides a visual interface to modify colors, fonts,\
    \ border radii, and more without writing any code.\n"
  raw: 'jQuery Mobile has a theme system containing five swatches that are defined
    by the letters “a” through “e.” Swatches can be mixed and matched throughout a
    single webpage to allow for complete customization. The default swatches all contain
    color and texture, padding, and predefined dimensions to separate them from one
    another. **[Table 11.1](#ch11.html_ch11tab01)** includes the default swatches
    and descriptions of each.


    Table 11.1\. jQuery Mobile default swatches


    ![Image](graphics/11tab01.jpg)


    Using a swatch is as simple as using the `data-theme` attribute, which can be
    used on any HTML element with the jQuery Mobile framework. The following code
    shows a group of five buttons, each with a different default theme:


    [Click here to view code image](#images.html_p158pro01)


    <a href="#" data-role="button" data-theme="a">Swatch A</a>


    <a href="#" data-role="button" data-theme="b">Swatch B</a>


    <a href="#" data-role="button" data-theme="c">Swatch C</a>


    <a href="#" data-role="button" data-theme="d">Swatch D</a>


    <a href="#" data-role="button" data-theme="e">Swatch E</a>


    Whether this is a set of buttons, list items, or bars, the jQuery Mobile framework
    gives you the ability to define different themes for these items. **[Figure 11.1](#ch11.html_ch11fig01)**
    shows the group of buttons in the example. As you can see, each has a different
    color based on the theme assigned to it.


    ![Image](graphics/jquery-11-1.jpg)


    Figure 11.1\. Group of buttons with different theme swatches assigned.


    You can update an existing swatch or create a custom color swatch. To create a
    custom swatch, simply copy an existing theme swatch from the jQuery Mobile style
    sheet and update it to a letter that’s not already in use as a default swatch
    (that is, letters “f” through “z” or any custom name). First, you’ll need to find
    a swatch in the style sheet that you want to copy; let’s use the “a” swatch for
    this example. The style sheet that we want to get the swatch from is the one that
    we’ve been attaching to all the samples throughout this book. The only difference
    here is that we’ll look at the non-minified version to make it easier to find
    where the swatch begins and ends. You’ll find the non-minified version of this
    style sheet at [http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.css](http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.css),
    which is the same address we’ve been including all along, minus the *.min* portion
    in the CSS’s file-name. To create a copy of the swatch simply copy and paste the
    many CSS swatch classes into a new CSS file and do a search and replace on the
    suffix “-a”, with a letter between “f” and “z.” For example, to create an “f”
    swatch, you would search and replace “-a” with “-f” and all the CSS swatch classes
    would be updated, leaving you with a new “f” swatch. Here’s an example of the
    `ui-bar` class after it’s been modified for the “f” swatch:


    [Click here to view code image](#images.html_p159pro01)


    .ui-bar-f {


        border: 1px solid #cccccc;


        background: #cccccc;


        color: #cccccc;


        font-weight: bold;


        text-shadow: 0 -1px 1px #000000;


        background-image: -webkit-gradient(linear, left top, left bottom, from(#cccccc),
    to(#999));


        background-image: -webkit-linear-gradient(#cccccc, #999);


        background-image:    -moz-linear-gradient(#cccccc, #999);


        background-image:     -ms-linear-gradient(#cccccc, #999);


        background-image:      -o-linear-gradient(#cccccc, #999);


        background-image:         linear-gradient(#cccccc, #999);


    }


    Now it’s up to you to customize the properties of those classes. Once you have
    your new swatch, you can easily use it on any jQuery Mobile element, as in the
    following button example:


    [Click here to view code image](#images.html_p159pro02)


    <a href="#" data-role="button" data-theme="f">Custom Swatch F</a>


    ### The ThemeRoller


    Another way to create a custom swatch is to use the ThemeRoller tool, which lets
    you create an entire theme with multiple custom swatches in a simple interface.


    * * *


    ![Image](graphics/tip.jpg) Tip


    The ThemeRoller tool is an easy way to create a custom theme, but the tougher
    route can give you a better understanding of the inner workings of the CSS classes
    that are applied when the jQuery mobile framework enhances your markup. Even if
    you ultimately use the ThemeRoller tool, it’s a good idea to check out the existing
    classes to see what’s happening behind the scenes.


    * * *


    The ThemeRoller is a drag-and-drop interface that allows you to drag color blocks
    to customize swatches. The tool starts you out with three swatches that are represented
    with a few components. At the top, there are color blocks that you can drag and
    drop to headers, buttons, text, backgrounds, links, and more. Then, you can get
    more detailed with your customizations in the left sidebar, where you can set
    fonts, shadows, rounded corners, icons, and so on. **[Figure 11.2](#ch11.html_ch11fig02)**
    shows an example of three swatches that were customized with the drag-and-drop
    interface.


    ![Image](graphics/jquery-11-2.jpg)


    Figure 11.2\. Custom swatches in a custom theme made with the ThemeRoller tool.


    These are a few simple and somewhat unattractive examples, but you can get much
    more detailed by spending more time with the tool. To get started using the ThemeRoller,
    visit [www.jquerymobile.com/themeroller](http://www.jquerymobile.com/themeroller).


    ### Theming Components


    Each component handles theme swatches in its own way. This section provides an
    overview of how each component handles swatches and gives you a visual reference.


    #### Page, toolbar, and button theming


    Theming pages is a great way to style an entire page, because the page theme is
    inherited by all internal components. For example, if the page theme is set to
    the “a” swatch, then any component placed within the page inherits the “a” swatch.
    Of course, this can be overridden, but it provides a great baseline for the entire
    page, allowing customizations to occur only when necessary. Any `div` or element
    that includes a `data-role` of `page` receives a default theme. The following
    markup is an example of a page with the `data-theme` set to the “b” swatch:


    [Click here to view code image](#images.html_p161pro01)


    <div data-role="page" data-theme="b">


        <div data-role="header"><h1>jQueryMobile.tv</h1></div>


        <div data-role="content">


            <h3>Header</h3>


            <p>This is a sample with the "b" swatch applied to the page. As you can
    see, the header and footer are defaulting to the "a" theme, while the rest of
    the page is set to the "b" theme. To change this you must apply the "b" swatch
    directly to the header and footer components.</p>


            <a href="#" data-role="button" data-inline="true">Button</a>


        </div>


        <div data-role="footer"><h2>Copyright</h2></div>


    </div>


    **[Figure 11.3](#ch11.html_ch11fig03)** shows an example of this markup in action.


    ![Image](graphics/jquery-11-3.jpg)


    Figure 11.3\. The “b” swatch applied to the page component.


    As you can see, the header and footer default to the “a” theme, while the rest
    of the page is set to the “b” theme. To change this, you must apply the “b” swatch
    directly to the header and footer components:


    [Click here to view code image](#images.html_p162pro01)


    <div data-role="page" data-theme="b">


        <div data-role="header" data-theme="b"><h1>jQueryMobile.tv</h1></div>


        <div data-role="content">


            <h3>Header</h3>


            <p>This is a sample with the "b" swatch applied to the page. As you can
    see, the header and footer are defaulting to the "a" theme, while the rest of
    the page is set to the "b" theme. To change this you must apply the "b" swatch
    directly to the header and footer components.</p>


            <a href="#" data-role="button" data-inline="true">Button</a>


        </div>


        <div data-role="footer" data-theme="b"><h2>Copyright</h2></div>


    </div>'
