- fmt: "\nWith the jQuery Mobile module and theme in place, you can customize various\
    \ settings. The theme lets you configure quite a few swatches for different form\
    \ elements. If you visit the Appearance page of the Drupal administration area\
    \ and select the Settings link next to the jQuery Mobile theme, you’ll see a list\
    \ of options under the JQM Settings section shown [Figure 16.15](#ch16.html_ch16fig15).\n\
    \n![Image](graphics/jquery-16-15.jpg)\n\nFigure 16.15. (Left) jQuery Mobile theme\
    \ settings in a Drupal installation.\n\nYou can also configure settings in the\
    \ jQuery Mobile module. To edit these settings, visit the Modules page, scroll\
    \ until you find the jQuery Mobile module, and select the Configuration link next\
    \ to the module. On this page you’ll see an area titled `File Settings`, shown\
    \ in [Figure 16.16](#ch16.html_ch16fig16). If you select this title, it will expand\
    \ and reveal text inputs you can use to set the version of the jQuery library\
    \ and jQuery Mobile framework as well as the file path location for the files\
    \ that were uploaded to the Drupal installation in [Figure 16.10](#ch16.html_ch16fig10).\n\
    \n![Image](graphics/jquery-16-16.jpg)\n\nFigure 16.16. (Right) jQuery Mobile module\
    \ settings in a Drupal installation.\n\n### Adding Content\n\nTo create more pages\
    \ and blog posts, you need to log in to the Drupal administration area. Here you\
    \ can manage all your content from the Content page: Select Add content to choose\
    \ a content type. On this page, there are two default content types: Article and\
    \ Basic page. To create a blog post, select Article, enter a title, and write\
    \ your post in the Body field in the web form seen in [Figure 16.17](#ch16.html_ch16fig17).\n\
    \n![Image](graphics/jquery-16-17.jpg)\n\nFigure 16.17. (Left) Create a blog post\
    \ in Drupal.\n\nBy default, this blog post appears on the home page of your Drupal\
    \ website ([Figure 16.18](#ch16.html_ch16fig18)).\n\n![Image](graphics/jquery-16-18.jpg)\n\
    \nFigure 16.18. (Right) Drupal site with a blog post.\n\nTo create a page, go\
    \ back to Content, select Add Content, and select Basic page. Use the web form\
    \ on this page to create your page. In this example, we’re creating a page named\
    \ Home, which will ultimately become the front page for the website ([Figure 16.19](#ch16.html_ch16fig19)).\n\
    \n![Image](graphics/jquery-16-19.jpg)\n\nFigure 16.19. Create a Basic page in\
    \ Drupal.\n\nYou can use this new page as the front page for the Drupal installation.\
    \ To define a page as the front page, visit the Configuration page, select Site\
    \ information, and scroll down until you see Default front page. Here you’ll see\
    \ the URL of your Drupal website with a text input to enter the node ID of the\
    \ page you want to use. You can find this node ID in the browser address bar when\
    \ viewing any basic page; in this example, our node ID is 1, so we’ve entered\
    \ `node/1` into the text input ([Figure 16.20](#ch16.html_ch16fig20)).\n\n![Image](graphics/jquery-16-20.jpg)\n\
    \nFigure 16.20. Set a custom front page in Drupal.\n\nThat’s it! [Figure 16.21](#ch16.html_ch16fig21)\
    \ shows the final Drupal website with a custom front page.\n\n![Image](graphics/16fig21.jpg)\n\
    \nFigure 16.21. The final jQuery Mobile Drupal website with a custom front page.\n\
    \n### Wrapping Up\n\nUsing Drupal and the jQuery Mobile theme and module from\
    \ this chapter lets you create a powerful mobile CMS and have it up and running\
    \ in no time. With the techniques you’ve learned in this book, you can create\
    \ unique and custom webpages with widgets, formatting, and other functionality\
    \ provided by the jQuery Mobile framework. Now there’s nothing holding you back\
    \ from creating a powerful CMS with complete mobile capabilities.\n\n# Part V:\
    \ Beyond jQuery Mobile\n\n## 17. Detecting Mobile Devices\n\nMobile websites are\
    \ often developed separately from primary websites (those intended to be viewed\
    \ on a desktop or laptop), although they may use much of the same content. To\
    \ make sure your website is tailored for mobile devices, you’ll want to detect\
    \ when a mobile device visits the site and then redirect the device to markup\
    \ made especially for mobile. You may also want to deliver a website layout and\
    \ content based on a specific mobile device. In this chapter, you’ll learn how\
    \ to do both. Let’s begin by learning how to detect when a mobile device accesses\
    \ your website.\n\n### Using PHP\n\nSince PHP is one of the most popular scripting\
    \ languages on the web, let’s look at a PHP function that performs mobile detection\
    \ across a wide array of mobile devices. The function is simple and can be extended\
    \ and modified easily:\n\n[Click here to view code image](#images.html_p254pro01)\n\
    \n```\nfunction mobile_detect(){\n    $mobile_devices = '/(alcatel|amoi|android|avantgo|blackberry|benq|cell|cricket|docomo|elaine|htc|iemobile|iphone|ipad|ipaq|ipod|j2me|java|midp|mini|mmp|mobi|motorola|nec|nokia|palm|panasonic|philips|phone|sagem|sharp|smartphone|symbian|telus|vodafone|wap|webos|wireless|xda|xoom|zte)/i';\n\
    \    if (preg_match($mobile_devices, $_SERVER['HTTP_USER_AGENT'])) {\n       \
    \ return true;\n    } else {\n        return false;\n    }\n}\n```\n\n### How\
    \ Many Types of Mobile Devices Are There?\n\nThe regular expression string in\
    \ the example doesn’t begin to cover all mobile devices today. There are literally\
    \ hundreds of different types capable of surfing. The pipe symbol (`|`) represents\
    \ an OR statement between devices.\n\nHow do you decide which ones to include\
    \ in your test? Honestly, only you can answer that because it depends on the audience\
    \ for your mobile website. You’ll find many online sources for user agent information.\
    \ One such source is [www.useragentstring.com](http://www.useragentstring.com)\
    \ on which the list of mobile devices is regularly updated and very accurate.\
    \ You can find the mobile device list at [www.useragentstring.com/pages/Browserlist/](http://www.useragentstring.com/pages/Browserlist/).\n\
    \n### Identifying the browser\n\nIf you need to add a phone’s user agent string,\
    \ the string that indicates which browser is used is quite simple. Insert a pipe\
    \ within the string followed by the phone’s user agent string. The list need not\
    \ be in alphabetical order.\n\nOnce you’ve created your search string, you can\
    \ test it with PHP’s `preg_match()` function. The first argument in the function\
    \ is your mobile device variable. The second argument is part of PHP’s global\
    \ `$_SERVER` array, specifically `HTTP_USER_AGENT`. When a web browser makes a\
    \ request for information from a server, it sends a lot of information about itself\
    \ to the server to generate the request, including the kind of browser making\
    \ the request. If the server-side language is PHP (this same information is available\
    \ in other server-side languages as well), much of the information is stored in\
    \ the `$_SERVER` array. This is the key to determining whether a mobile device\
    \ is accessing your website.\n\nThe `preg_match()` function searches through the\
    \ regular expression string and looks for a match to the `$_SERVER['HTTP_USER_AGENT']`.\
    \ If there’s a match, you know a mobile device is accessing your site, and you\
    \ can handle it appropriately, such as by redirecting the mobile device to the\
    \ URL where your jQuery Mobile website lives.\n\n### Learning More About Regular\
    \ Expressions\n\nWhile learning regular expressions may be dreadful and scary,\
    \ it can be a valuable part of your programming toolkit. Fortunately, there are\
    \ many resources available online. Here are some recommended websites:\n"
  raw: 'With the jQuery Mobile module and theme in place, you can customize various
    settings. The theme lets you configure quite a few swatches for different form
    elements. If you visit the Appearance page of the Drupal administration area and
    select the Settings link next to the jQuery Mobile theme, you’ll see a list of
    options under the JQM Settings section shown **[Figure 16.15](#ch16.html_ch16fig15)**.


    ![Image](graphics/jquery-16-15.jpg)


    Figure 16.15\. (Left) jQuery Mobile theme settings in a Drupal installation.


    You can also configure settings in the jQuery Mobile module. To edit these settings,
    visit the Modules page, scroll until you find the jQuery Mobile module, and select
    the Configuration link next to the module. On this page you’ll see an area titled
    File Settings, shown in **[Figure 16.16](#ch16.html_ch16fig16)**. If you select
    this title, it will expand and reveal text inputs you can use to set the version
    of the jQuery library and jQuery Mobile framework as well as the file path location
    for the files that were uploaded to the Drupal installation in [Figure 16.10](#ch16.html_ch16fig10).


    ![Image](graphics/jquery-16-16.jpg)


    Figure 16.16\. (Right) jQuery Mobile module settings in a Drupal installation.


    ### Adding Content


    To create more pages and blog posts, you need to log in to the Drupal administration
    area. Here you can manage all your content from the Content page: Select Add content
    to choose a content type. On this page, there are two default content types: Article
    and Basic page. To create a blog post, select Article, enter a title, and write
    your post in the Body field in the web form seen in **[Figure 16.17](#ch16.html_ch16fig17)**.


    ![Image](graphics/jquery-16-17.jpg)


    Figure 16.17\. (Left) Create a blog post in Drupal.


    By default, this blog post appears on the home page of your Drupal website (**[Figure
    16.18](#ch16.html_ch16fig18)**).


    ![Image](graphics/jquery-16-18.jpg)


    Figure 16.18\. (Right) Drupal site with a blog post.


    To create a page, go back to Content, select Add Content, and select Basic page.
    Use the web form on this page to create your page. In this example, we’re creating
    a page named Home, which will ultimately become the front page for the website
    (**[Figure 16.19](#ch16.html_ch16fig19)**).


    ![Image](graphics/jquery-16-19.jpg)


    Figure 16.19\. Create a Basic page in Drupal.


    You can use this new page as the front page for the Drupal installation. To define
    a page as the front page, visit the Configuration page, select Site information,
    and scroll down until you see Default front page. Here you’ll see the URL of your
    Drupal website with a text input to enter the node ID of the page you want to
    use. You can find this node ID in the browser address bar when viewing any basic
    page; in this example, our node ID is 1, so we’ve entered node/1 into the text
    input (**[Figure 16.20](#ch16.html_ch16fig20)**).


    ![Image](graphics/jquery-16-20.jpg)


    Figure 16.20\. Set a custom front page in Drupal.


    That’s it! **[Figure 16.21](#ch16.html_ch16fig21)** shows the final Drupal website
    with a custom front page.


    ![Image](graphics/16fig21.jpg)


    Figure 16.21\. The final jQuery Mobile Drupal website with a custom front page.


    ### Wrapping Up


    Using Drupal and the jQuery Mobile theme and module from this chapter lets you
    create a powerful mobile CMS and have it up and running in no time. With the techniques
    you’ve learned in this book, you can create unique and custom webpages with widgets,
    formatting, and other functionality provided by the jQuery Mobile framework. Now
    there’s nothing holding you back from creating a powerful CMS with complete mobile
    capabilities.


    # Part V: Beyond jQuery Mobile


    ## 17\. Detecting Mobile Devices


    Mobile websites are often developed separately from primary websites (those intended
    to be viewed on a desktop or laptop), although they may use much of the same content.
    To make sure your website is tailored for mobile devices, you’ll want to detect
    when a mobile device visits the site and then redirect the device to markup made
    especially for mobile. You may also want to deliver a website layout and content
    based on a specific mobile device. In this chapter, you’ll learn how to do both.
    Let’s begin by learning how to detect when a mobile device accesses your website.


    ### Using PHP


    Since PHP is one of the most popular scripting languages on the web, let’s look
    at a PHP function that performs mobile detection across a wide array of mobile
    devices. The function is simple and can be extended and modified easily:


    [Click here to view code image](#images.html_p254pro01)


    function mobile_detect(){


        $mobile_devices = ''/(alcatel|amoi|android|avantgo|blackberry


    |benq|cell|cricket|docomo|elaine|htc|iemobile|iphone|ipad|ipaq|ipod


    |j2me|java|midp|mini|mmp|mobi|motorola|nec-|nokia|palm|panasonic


    |philips|phone|sagem|sharp|sie-|smartphone|sony|symbian|t-mobile


    |telus|vodafone|wap|webos|wireless|xda|xoom|zte)/i'';


    if(preg_match($mobile_devices, $_SERVER[''HTTP_USER_AGENT''])) {


        return true;


    } else {


        return false;


        }


    }


    The first variable in the function, `$mobile_devices`, holds a regular expression
    string that identifies many of the mobile devices in use today. The regular expression
    is an `OR` statement with the pipe symbol (`|`) representing the `OR` statement
    and separating each device type string. If you were reading it aloud, you might
    say, “Android or AvantGo or BlackBerry....” The `/i` at the end of the expression
    indicates that the search through the string is case-insensitive.


    * * *


    How Many Types of Mobile Devices Are There?


    The regular expression string in the example doesn’t begin to cover all the mobile
    devices with unique user agent strings available today. There are literally hundreds
    of different types of mobile devices capable of surfing websites.


    How do you decide which ones to include in your test? Honestly, only you can answer
    that because it depends on the audience for your mobile website or application.


    You’ll find many online sources for user agent information. One such source is
    [www.useragentstring.com](http://www.useragentstring.com) on which the list of
    mobile devices is regularly updated and very accurate. You can find the mobile
    device list at [www.useragentstring.com/pages/MobileBrowserlist/](http://www.useragentstring.com/pages/MobileBrowserlist/).


    * * *


    #### Identifying the browser


    If you need to add a phone’s user agent string, the string that indicates which
    browser is being used is quite simple. Insert a pipe within the string followed
    by the phone’s user agent string. The list need not be in alphabetical order.


    Once you’ve created your search string, you can test it with PHP’s `preg_match()`
    function. The first argument in the function is your mobile device string variable
    holding the regular expression. The second argument is part of PHP’s global `$_SERVER`
    array, specifically the `HTTP_USER_AGENT`.


    When a web browser makes a request for information from a server, it sends a lot
    of information about itself to the server to generate the request, including the
    kind of browser making the request. If the server-side language is PHP (this same
    information is available in other server-side languages as well), much of the
    information is stored in the `$_SERVER` array. This is the key to determining
    whether a mobile device is accessing your website.


    The `preg_match()` function searches through the regular expression string and
    looks for a match to the `$_SERVER[''HTTP_USER_AGENT'']`. If there’s a match,
    you know a mobile device is accessing your site, and you can handle it appropriately,
    such as by redirecting the mobile device to the URL where your jQuery Mobile website
    lives.


    * * *


    Learning More About Regular Expressions


    While learning regular expressions may be dreadful and scary, it can be a valuable
    part of your programming toolkit. Fortunately, there are many resources available
    online. Here are some recommended websites:'
