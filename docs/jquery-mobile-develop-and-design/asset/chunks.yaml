        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>Page Transitions - jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="assets/js/custom-jqm-transitions.js"></script>


        <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


    </head>


    <body>


        <div data-role="page">


            <div data-role="header"><h1>Page Name</h1></div>


            <div data-role="content">


                <p><a href="sample-page.html">Open Another Page</a></p>


                <p><a href="dialog.html" data-rel="dialog">Open Dialog </a></p>


            </div>


            <div data-role="footer">Copyright</div>


        </div>


    </body>


    </html>


    The framework includes six CSS-based transition effects: `slide`, `slideup`, `slidedown`,
    `pop`, `fade`, `flip`, which were all covered in detail in [Chapter 4](#ch04.html_ch04),
    “Creating Multipage Websites with jQuery Mobile.” These effects can also be applied
    directly on hyperlinks by including the `data-transition` attribute:


    [Click here to view code image](#images.html_p189pro01)


    <a href="sample-page.html" data-transition="flip">Data transition</a>


    Using this code overrides any previous settings for transitions.


    ### Wrapping Up


    The jQuery Mobile framework is simple to use, but don’t let its simplicity fool
    you—there’s a lot happening behind the curtain. There are many ways to add custom
    functionality to create powerful mobile websites and applications. Accessing the
    API allows fine-grained control that lets you tell the framework how to behave
    by default and even tie into every interaction that occurs on the client side
    through events. In the next chapter, you’ll see how events can provide even more
    control over your custom jQuery Mobile project.


    ## 13\. Hooking into Events


    jQuery Mobile offers custom events you can use to extend the functionality of
    the framework, including touch, scroll, device orientation, page transition, and
    page initialization, among others. Hooking into jQuery Mobile events opens up
    an entire world of opportunity that can’t be achieved with the basic framework
    setup. Knowing the state of a webpage at any given time provides a level of control
    you can use to extend existing functionality. This chapter shows you how to hook
    into each of these events to create custom functionality in a mobile website.


    ### Touch Events


    There are many touch events you can hook into with jQuery Mobile. Keep in mind
    that these are available only to touch-enabled devices, so desktop users may not
    experience them or any customizations added via an event hook. With that said,
    touch events won’t cause errors on desktop devices: they simply won’t function,
    because mouse events rule the desktop experience. These events can trigger a callback
    function that includes any custom JavaScript. **[Table 13.1](#ch13.html_ch13tab01)**
    describes the five different touch events accessible through the jQuery Mobile
    API.


    Table 13.1\. Touch events


    ![Image](graphics/13tab01.jpg)


    **[Table 13.2](#ch13.html_ch13tab02)** describes the `swipe` event properties
    mentioned in [Table 13.1](#ch13.html_ch13tab01).


    Table 13.2\. swipe event properties


    ![Image](graphics/13tab02.jpg)


    To bind to any of these touch events, you must use the `document.ready` event.
    Once the document is ready, you can access an HTML element and bind your selected
    touch event:


    [Click here to view code image](#images.html_p193pro01)


    $(document).ready(function(){


        $(".test-tap-hold").bind("taphold", function(event) {


            $(this).html("Tapped and held");


        });


    });


    Once the document is ready, the `taphold` event is bound to an element with the
    class name `.test-tap-hold`. When a finger touches this element and remains on
    it, the `taphold` event is fired. The following example incorporates the JavaScript
    file that binds this event to the HTML element:


    [Click here to view code image](#images.html_p193pro02)


    <!DOCTYPE HTML>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>taphold- jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


    </head>


    <body>


        <div data-role="page">


            <div data-role="header">


                <h1>Page title</h1>


            </div>


            <div data-role="content">


                <ul data-role="listview">


                    <li class="test-tap-hold">Tap and hold test</li>


                </ul>


            </div>


            <div data-role="footer">


                Copyright


            </div>


        </div>


    </body>


    </html>


    As you can see, a `listview` is included in the page with a list item that contains
    a class name of `test-tap-hold`. When this element is touched and the user’s finger
    remains in this position on the screen, the event is fired and the HTML value
    gets updated. **[Figure 13.1](#ch13.html_ch13fig01)** illustrates examples of
    different touch events.


    ![Image](graphics/jquery-13-1.jpg)


    Figure 13.1\. Examples or different touch-event interactions, including tap, tap
    and hold and swipe.'
