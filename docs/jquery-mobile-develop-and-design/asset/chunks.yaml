    Another property named `activeBtnClass` works exactly the same as the `activePageClass`.
    You can set it in the `mobileinit` callback. It can contain any string value,
    and the string value can ultimately relate to a custom CSS class that you can
    include in a CSS file. The only difference in the `activePageClass` and the `activeBtnClass`
    properties is that the `activeBtnClass` lets you style the active state of any
    buttons that are used.


    ### Enabling and Disabling Ajax Navigation


    By default, Ajax-based navigation is set to `true` using the `$.mobile` object’s
    `ajaxEnabled` property. However, this property can be set to `false` in a configuration
    file:


    [Click here to view code image](#images.html_p187pro01)


    $(document).bind("mobileinit", function() {


        $.extend( $.mobile, {


            ajaxEnabled: false


        });


    });


    This is such a simple property to modify, but it has major results. Setting this
    property to `false` disables URL hash listening and loads all URLs as standard
    HTTP requests. Doing so causes page refreshes, disables page preloading and caching,
    and eliminates page and dialog transitions. If you’d like your mobile website
    to function as a standard website, setting this option to `false` will create
    standard HTTP requests.


    ### Altering the Default Page and Dialog Transitions


    By default, pages and dialogs include a transition effect in jQuery Mobile when
    page changes are handled via Ajax. The default page transition is `slide`, while
    the default dialog transition is `pop`. To change these values, target the `defaultPageTransition`
    and/or the `defaultDialogTransition` properties:


