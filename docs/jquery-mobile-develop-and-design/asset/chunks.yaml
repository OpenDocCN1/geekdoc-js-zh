  trans: "\n\n认为你需要理解 HTML5 和 jQuery 才能使用 jQuery Mobile 框架可能令人望而生畏。幸运的是，该框架的设计方式支持不同技能水平的开发者。你不一定得知道\
    \ HTML5 和 jQuery，因为框架提供了一个可以直接从 [jquerymobile.com](http://jquerymobile.com) 下载的\
    \ HTML5 模板，而 jQuery 对于想要使用它的开发者来说是可用的。唯一绝对必要的条件是理解如何使用 `data-` 属性，因为这是在不使用 jQuery\
    \ 的情况下向网页添加小组件的方法。\n\n## 3. 快速上手 jQuery Mobile\n\n在之前的章节中，我们涵盖了基础 jQuery、如何创建\
    \ HTML5 模板、如何为移动端浏览添加 `viewport` 元标记，以及如何使用 `data-` 属性。现在，你已经准备好深入研究 jQuery Mobile，看看这些语言、元素和属性是如何通过框架被利用和增强的。jQuery\
    \ Mobile 框架的优点之一是，它的核心是基础的 HTML5 标记和 JavaScript，所有主流浏览器都支持它们。对于基础的 jQuery Mobile\
    \ 开发，老实说并没有多少东西要学。本章涵盖了几个步骤，并对幕后的运作提供了一些背景介绍。在后面的章节中，你将看到如何扩展这些基础概念，以创建更高级的 jQuery\
    \ Mobile 网站甚至是移动 Web 应用。\n\n### jQuery Mobile 如何工作\n\n构建 jQuery Mobile 网站有许多方法。然而，在最简单的形式中，框架运行在\
    \ HTML5 和 jQuery 库之上，将带有 `data-` 属性的元素转换为组件，使其非常容易整合到你现有的 Web 开发实践中。框架中最基本的组件是页面（pages）和工具栏（toolbars），它们将在本章稍后详细介绍。首先，让我们看看如何将\
    \ jQuery Mobile 框架整合到 HTML5 网页中。\n\n### 为你的网站添加 jQuery Mobile 框架\n\n首先，jQuery\
    \ Mobile 框架可以在 [jquerymobile.com](http://jquerymobile.com) 获取。有两种方法可以将 jQuery\
    \ Mobile 框架添加到你的网页中。\n\n第一种方法是下载单独包，包含了 JavaScript 库和 CSS 文件的完整版本和压缩版本。你还需要从 [jquery.com](http://jquery.com)\
    \ 下载 jQuery 库。\n\n第二种（推荐）选项是包含指向 CDN 托管文件的直接引用，如下所示：\n\n点击此处查看代码图像\n\n```html\n\
    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\"\
    \ />\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n<script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
    ></script>\n```\n\n![Image](img/note.jpg) 注意\n\n请记住，在本书编写时，jQuery Mobile 框架的最新版本是最终版\
    \ 1。要获取包含这些文件的最新代码，请访问 [jquerymobile.com](http://jquerymobile.com)，你可以直接将其复制并粘贴到你的网页中。\n\
    \n要将框架添加到你在第二章 中创建的 HTML5 模板“HTML5 的角色”中，请将其添加到 `head` 元素内：\n\n点击此处查看代码图像\n\n\
    ```html\n<!DOCTYPE html>\n<html\n    <head>\n        <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n        <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n        <title>Page Title</title>\n  \
    \      <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\"\
    \ />\n        <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n        <script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
    ></script>\n    </head>\n<body>\n\n</body>\n</html>\n```\n\n推荐使用内容分发网络（CDN）托管文件的主要原因是加载速度更快。CDN\
    \ 会将你的内容分布在多个地理分散的服务器上，因此访问你网页的用户将接收到最近的 Web 文件。\n\n如果你正在开发 Microsoft .net 应用程序，可以使用\
    \ Microsoft CDN 托管的 jQuery Mobile 文件，目前可以在 [`www.asp.net/ajaxLibrary/CDNjQueryMobile10.ashx`](http://www.asp.net/ajaxLibrary/CDNjQueryMobile10.ashx)\
    \ 获取。\n\n有了 jQuery Mobile 框架后，你就可以开始将 HTML5 标记转换为丰富的移动组件。让我们来看看最常见的组件：页面和工具栏。\n\
    \n### 页面和工具栏\n\n在 jQuery Mobile 中，页面字面意思是由一个 `data-role` 属性为 `page` 的元素定义。我不确定是否还能比这更简单了。jQuery\
    \ Mobile 将将这个 `<div>` 转换为页面。下面的示例了使用这些 `data-roles` 的典型 HTML 结构：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n    <head>\n        <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n        <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n        <title>Page Title - jQuery Mobile</title>\n\
    \        <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\"\
    \ />\n        <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n        <script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
    ></script>\n    </head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\">\n            <h1>Page title</h1>\n        </div>\n        <div data-role=\"\
    content\">\n            Body copy\n        </div>\n        <div data-role=\"footer\"\
    >\n            Copyright\n        </div>\n    </div>\n</body>\n</html>\n```\n\n\
    代码与我们之前的示例非常相似，增加了 `page`、`header`、`content` 和 `footer` 元素。jQuery Mobile 对这些标记的视觉转换可以在\
    \ **图 3.1** 中看到。\n\n![Image](img/jquery-3-1.jpg)\n\n图 3.1。jQuery Mobile 在视觉上转换带有特定\
    \ data- 属性的标记。\n\n`header`、`content` 和 `footer` 都被转换为一种基础布局，在视觉上分隔了每个部分。这是默认的\
    \ jQuery Mobile 主题；在本书后后部分，你将学习如何创建自定义主题。\n\n"
- fmt: "\nThere are two ways to structure webpages for jQuery Mobile. The first is\
    \ to incorporate all the pages within the same file; the second is to create separate\
    \ files, like a typical website. To create multiple pages within a single HTML\
    \ file, you can delineate multiple `page` `data-roles`, which allows each `page`\
    \ `data-role` to contain its own header, content, footer, and so on. The following\
    \ example gives you a basic idea of how to create a multipage jQuery Mobile website\
    \ in a single HTML file:\n\n[Click here to view code image](#images.html_p034pro01)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>Page Title</title>\n    <link\
    \ rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
    ></script>\n</head>\n<body>\n    <div data-role=\"page\" id=\"page-one\">\n  \
    \      <div data-role=\"header\">\n            <h1>Page 1</h1>\n        </div>\n\
    \        <div data-role=\"content\">Body copy for page 1</div>\n        <div data-role=\"\
    footer\">Copyright</div>\n    </div>\n    <div data-role=\"page\" id=\"page-two\"\
    >\n        <div data-role=\"header\">\n            <h1>Page 2</h1>\n        </div>\n\
    \        <div data-role=\"content\">Body copy for page 2</div>\n        <div data-role=\"\
    footer\">Copyright</div>\n    </div>\n</body>\n</html>\n```\n\nThis approach is\
    \ not recommended, because files structured this way usually become harder to\
    \ manage and are much larger in file size, so they ultimately will take longer\
    \ to load. For demos or prototypes, this may be an option, but it is strongly\
    \ recommended that you build your mobile websites or applications as separate\
    \ HTML files.\n\nWhen using separate HTML files for your webpages, the `page`\
    \ `data-role` is used as a container that the framework loads other webpages into.\
    \ For example, let’s say you have two separate HTML files, `page-1.html` and `page-2.html`.\
    \ Then you add the `page` `data-role` attribute to both files and hyperlink `page-1.html`\
    \ to `page-2.html`:\n\n[Click here to view code image](#images.html_p035pro01)\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>Page 1 - jQuery Mobile: Design\
    \ and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/ jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
    ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\">\n            <h1>Page 1</h1>\n        </div>\n        <div data-role=\"\
    content\">\n            <a href=\"page-2.html\">Link to page 2</a>\n        </div>\n\
    \        <div data-role=\"footer\">\n            Copyright\n        </div>\n \
    \   </div>\n</body>\n</html>\n```\n\nWith the jQuery Mobile framework included,\
    \ the `page` `data-role` of `page-1.html` will automatically become the container\
    \ to load the markup within the `page` `data-role` of `page-2.html` using an `XMLHttpRequest`.\
    \ The `XMLHttpRequest` is what Ajax uses to exchange data with the server without\
    \ refreshing the webpage; it’s sort of a portal to the backend. [Figure 3.2](#ch03.html_ch03fig2)\
    \ shows an example of the `XMLHttpRequest` that is made when `page-1.html` links\
    \ to `page-2.html`. The request was logged using Chrome Developer Tools. Chrome\
    \ Developer Tools were used in this case to see that the `XMLHttpRequest` was\
    \ made by jQuery Mobile when the link to `page-2.html` was clicked. Chrome Developer\
