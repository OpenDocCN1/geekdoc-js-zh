  trans: "\n\n```html\n<a href=\"#page-one\">Link to page 1</a>\n</div>\n<div data-role=\"\
    footer\">\n    Copyright\n</div>\n</div>\n</body>\n</html>\n```\n\n在这个多页模板中，包含了两个由自定义\
    \ `id` 的 `div` 元素定义的页面。jQuery Mobile 框架一次只显示这些页面中的一个，并使用 `data-title` 属性来动态更改页面标题。默认显示的页面由源代码的顺序决定。在示例中，第一个页面的\
    \ `id` 为 `page-one`，但如果交换此文件中页面的顺序，使得 `id` 为 `page-two` 的元素排在最前面，那么它将成为默认加载的页面。换句话说，`id`\
    \ 属性的值并不决定默认显示的页面；默认页面仅取决于源代码的顺序。然而，`id` 还用于其他重要用途，例如页面之间的链接。\n\n这就是 jQuery Mobile\
    \ 页面开始像独立的网页一样工作的地方。请注意，原始模板已添加了超链接，以便从一个页面链接到另一个页面。这类似于 JavaScript 开发中常见的切换功能，在那种功能中，`id`\
    \ 值被用于隐藏和显示某些 HTML 元素。这里的区别是 jQuery Mobile 为你处理了这些功能。要从一个页面链接到另一个页面，你只需要：\n\n\
    1. 创建超链接。\n2. 输入井号（`#`）。\n3. 指定你想要链接的页面的 `id` 值。\n\n最终结果如下：\n\n点击此处查看代码图片\n\n\
    <a href=\"#page-two\">Link to page 2</a>\n\n这与创建页面锚点类似；区别在于你引用的是另一个页面的 `id` 值。请记住，每个页面都需要一个唯一的\
    \ `id` 值。在这种情况下，我使用了 `page-one` 和 `page-two`，但你可以使用更具描述性且与 jQuery Mobile 页面内容相关的名称。jQuery\
    \ Mobile 框架的酷之处在于，它可以动态地从一个页面切换到另一个页面，而不需要你编写任何代码。**图 4.1** 展示了这种代码在页面视图以及页面间切换中的示例。\n\
    \n![Image](img/jquery-4-1.jpg)\n\n图 4.1. 一个带有两个页面的多页模板以及之间的过渡。\n\n### 单页模板\n\n\
    单页模板是独立的 HTML 文件，作为独立的网页运行，就像任何标准网页一样。主要的区别在于 jQuery Mobile 如何使用 Ajax 连接网页。与多页模板一样，单页模板中基于\
    \ Ajax 的导航使用井号（hashtag）来创建页面历史。jQuery Mobile 使用的 Ajax 导航是默认开启，但可以通过将配置中的 `ajaxEnabled`\
    \ 设置为 `false` 来关闭它。你将在书的后续部分学习更多关于配置设置的内容。\n\nAjah 有时 Asynchronous JavaScript\
    \ and HTML 的缩写。Ajah 本质上是去掉了 XML 的 Ajax；它仍然使用 `XMLHttpRequest`，但与服务器交换的是 HTML 而不是\
    \ XML。这就是 jQuery Mobile 在用户浏览独立网页时所使用的技术。我们在上一章中简要介绍了 jQuery Mobile 框架如何使用 `XMLHttpRequest`\
    \ 加载后续页面，但关于这个简单的请求，有很多需要学习和理解的内容。\n\njQuery Mobile 框架的一个大优势是它是如何跟踪历史的：它支持后退和按钮！此外，在加载后续页面时，框架提供了默认的加载消息和页面间的过渡。默认的页面过渡是在两个页面之间滑动，而默认的加载消息是一个带有“loading...”消息的旋转图标。这两个选项都是可配置的，你将在下一章中学习到。现在，让我们看看井号和历史在\
    \ jQuery Mobile 中是如何工作的。\n\n### 井号与历史\n\njQuery Mobile 使用井号（hashtags）来管理单页和多页模板中的历史。`window`\
    \ 对象的 `location.hash` 用于更改和更新历史，因此后退和前进按钮可以像常一样工作，这在其他基于 Ajax 的系统中是不常见的。本质上，jQuery\
    \ Mobile 防止了所有超链接的默认功能，并使用井号功能来处理历史。这不仅更新了历史，井号系统还会创建一个可以书签以便以后参考的有效 URL。\n\n\
    jQuery Mobile 基于井号的导航唯一问题是它不支持深度链接（deep linking）。然而，你可以使用一些通方法来支持此功能。在 jQuery\
    \ 的帮助下，你可以为网页添加类似下面的脚本，这样你的深度链接就能正常工作了：\n\n点击此处查看代码图片\n\n```javascript\n$(document).ready(function()\
    \ {\n    $('a[href^=\"#\"]').bind('click vclick', function () {\n        location.hash\
    \ = $(this).attr('href');\n    });\n});\n```\n\n在 HTML 中，所有第一个字符为井号（`#`）的超链接都被识别为锚点。此脚本使用正则表达式来识别它们。回调函数将\
    \ `window` 对象的 `location.hash` 设置为锚点的值并返回 `false`。\n\n![Image](img/note.jpg) 注意事项\n\
    \n脱字符（`^`）在正则表达式中经常用于指定字符串的开头。\n\n`vclick` 事件是支持触摸事件的设备在 jQuery Mobile 中使用的选项。它支持更快的页面更改，并在页面过渡期间保持地址栏隐藏。\n\
    \n从单页模板到启用 Ajax 的多页模板的超链接只会加载源代码中的第一个页面。要从单页模板链接到多页模板，必须使用 `rel=\"external\"`\
    \ 或 `data-ajax=\"false\"`。\n\n### 链接类型\n\njQuery Mobile 支持标准的 HTML 链接类型，以及许多与移动体验相关的自定义链接类型。下表提供了\
    \ jQuery Mobile 框架提供的链接类型列表。每个表格根据其结果或对 Ajax 的支持进行分类。**表 4.1** 描述了支持 Ajax 的链接。\n\
    \n表 4.1. 支持 Ajax 的链接类型\n\n![Image](img/04tab01.jpg)\n\n### 分级支持\n\n正如本书引言提到的，jQuery\
    \ Mobile 对支持的平台使用了三级分类列表：A、B 和 C。A 包含完整的体验，并可以选择基于 Ajax 的页面过渡；B 包含相同的体验，但没有基于\
    \ Ajax 的页面过渡；C 是基础但有效的 HTML 体验。\n\nA 级支持之前提到的所有移动操作系统以及其他，包括 Apple iOS、Android、Windows\
    \ Phone、BlackBerry、Palm WebOS、Kindle 3 和 Kindle Fire。B 级支持 BlackBerry 5、Opera\
    \ Mini 和 Nokia Symbian。C 级支持 BlackBerry 4、Windows Mobile 以及所有旧智能手机和功能手机。访问 [jquerymobile.com](http://jquerymobile.com)\
    \ 查看最新的支持平台列表。\n\n**表 4.2** 描述了禁用 Ajax 页面功能的超链接列表。这些链接对于外部域名的页面、在新窗口中打开的页面、从单页到多页模板的链接，或者链接到不想使用\
    \ Ajax 的页面非常有用。\n\n"
- fmt: "\n## Table 4.2. Link types that disable Ajax\n\n![Image](graphics/04tab02.jpg)\n\
    \n[Table 4.3](#ch04.html_ch04tab03) includes link types that stem from a basic\
    \ HTML hyperlink with the addition of specific attributes.\n\n### Table 4.3. Miscellaneous\
    \ link types\n\n![Image](graphics/04tab03.jpg)\n\nThe jQuery Mobile framework\
    \ uses many hyperlink attributes to create enhancements to otherwise normal HTML\
    \ webpages. This is just another reason why jQuery Mobile is more appealing than\
    \ creating a mobile website from scratch. It lets you focus on what matters, eliminating\
    \ the need to write core functionality every time you create a new mobile website.\n\
    \nThe following examples show a few of the link types covered in the tables.\n\
    \nThis webpage offers three examples of the link types that can be used in jQuery\
    \ Mobile: an internal link, an external link, and a link that disables Ajax:\n\
    \n[Click here to view code image](#images.html_p049pro01)\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html;\
    \ charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n    <title>Single-page template - Page 1 - jQuery Mobile:\
    \ Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body class=\"container\">\n    <div data-role=\"page\">\n\
    \        <div data-role=\"header\">\n            <h1>Page 1</h1>\n        </div>\n\
    \        <div data-role=\"content\">\n            <p><a href=\"single-page-2.html\"\
    >Link to page 2</a>a></p>\n            <p><a href=\"single-page-2.html\" rel=\"\
    external\">External Link to page 2</a>a></p>\n            <p><a href=\"single-page-2.html\"\
    \ data-ajax=\"false\">Ajax-disabled link to page 2</a>a></p>\n        </div>\n\
    \        <div data-role=\"footer\">\n            Copyright\n        </div>\n \
    \   </div>\n</body>\n</html>\n```\n\nAn internal link requires no special markup\
    \ and is where the framework will interject and create a page transition between\
    \ the current page and the page that’s being linked to. An external link is one\
    \ that requires the `rel` attribute, which must be set to a value of `external`.\
    \ Setting a hyperlink as external disables Ajax, removes it from the page hashtag\
    \ history, and refreshes the webpage when the link is clicked. The link that disables\
    \ Ajax requires a `data-ajax` attribute with a value of `false`. This disables\
    \ Ajax, removes it from the page hashtag history, and refreshes the webpage, just\
    \ like the previous example, with the main difference being that the `rel=\"external\"\
    ` attribute can be used as a standards-compliant way to create hyperlinks that\
    \ target new windows with a little help from jQuery.\n\nIn this next example,\
    \ there’s an internal link and a hyperlink that acts as a back button:\n\n[Click\
    \ here to view code image](#images.html_p050pro01)\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n    <title>Single-page template - Page 2 - jQuery Mobile: Design and Develop</title>\n\
    \    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body class=\"container\">\n    <div data-role=\"page\">\n\
    \        <div data-role=\"header\">\n            <h1>Page 2</h1>\n        </div>\n\
    \        <div data-role=\"content\">\n            <p><a href=\"single-page.html\"\
    >Ajax link to page 1</a></p>\n            <p><a href=\"#\" data-rel=\"back\">Back\
    \ button</a></p>\n        </div>\n        <div data-role=\"footer\">\n       \
    \     Copyright\n        </div>\n    </div>\n</body>\n</html>\n```\n\nSetting\
    \ the `data-rel` attribute to back creates a hyperlink that acts like a back button.\
    \ When this link is clicked, the jQuery Mobile framework automatically links to\
    \ the previous page in history.\n\n### Preloading and Caching Pages\n\nPage caching\
    \ is very important when working with anything-based. Cache refers to hidden storage\
    \ where files are collected. By default, browsers handle webpage caching by putting\
    \ the associated files in a local directory on the user’s computer so the webpage\
    \ and its associated assets will load more quickly during visits. jQuery Mobile\
    \ takes this concept a further: the framework allows pages to be cached even before\
    \ they’re linked to or displayed in the browser. Taking advantage of this functionality\
    \ is as easy as using an HTML attribute named `data-prefetch`. Simply add it to\
    \ any hyperlink in your webpage, and once the webpage has loaded, the URLs that\
    \ these hyperlinks point to will be preloaded and cached. The following line of\
    \ code shows how to add this attribute to a hyperlink to preload and cache the\
    \ page it’s pointing to:\n\n[Click here to view code image](#images.html_p052pro01)\n\
    \n```html\n<a href=\"page2.html\" data-prefetch>Link to page 2</a>\n```\n\nWhen\
    \ running this example in a web browser, the request is made immediately upon\
    \ page load. [Figure 4.2](#ch04.html_ch04fig02) shows an example of the `XMLHttpRequest`\
    \ being made from Chrome when the page loads.\n\n![Image](graphics/jquery-4-2.jpg)\n\
    \nFigure 4.2. A page being preloaded by jQuery Mobile using the prefetch attribute.\n\
    \nThe framework also provides a way to handle page preloading via the application\
    \ programming interface (API). We’ll talk more specifically about the API later\
    \ in the book, but it’s important to know how to access it.\n\n![Image](graphics/note.jpg)\
    \ Note: The application programming interface (API) allows for communication among\
    \ multiple pieces of software.\n\nTo preload pages programmatically, you first\
    \ need to access the jQuery Mobile object:\n\n`.mobile`\n\nOnce the document object\
    \ is ready, use the `loadPage` method to pass the URL you want to preload and\
    \ define a number of properties for the request:\n\n[Click here to view code image](#images.html_p053pro01)\n\
    \n```javascript\n$(document).ready(function() {\n    $.mobile.loadPage( \"page2.html\"\
    , {\n        type: false,\n        reloadPage: false,\n        type: 'get'\n \
    \   });\n});\n```\n\nThere are quite a few arguments you can pass as options in\
    \ the `loadPage` method. [Table 4.4](#ch04.html_ch04tab04) lists those optional\
    \ arguments.\n\nTable 4.4. loadPage optional arguments\n\n![Image](graphics/04tab04.jpg)\n\
    \nIn addition to providing control for preloading files, the jQuery Mobile framework\
    \ provides control for caching pages in the document object model (DOM). Just\
    \ like the preload option, you can define whether a page should be cached in the\
    \ DOM via an HTML attribute or the jQuery Mobile API. The following example shows\
    \ how the attribute can be used in a `page` tag to cache a webpage:\n\n[Click\
    \ here to view code image](#images.html_p054pro01)\n\n```html\n<div data-role=\"\
    page\" data-dom-cache=\"true\">\n```\n\nTo cache a webpage using the API, you\
    \ can set all pages to cache by default:\n\n```javascript\n$.mobile.page.prototype.options.domCache\
    \ = true;\n```\n\nOr, you can cache a page independently. You would cache a page\
    \ with an `id` of `my-page` like so:\n\n```javascript\n$('#my-page').page(true);\n\
    ```\n\nWhen working with the single-page template, jQuery Mobile also manages\
    \ the pages it preloads so the DOM doesn’t get too large. If many pages are kept\
    \ in the DOM, the browser’s memory usage can get out of control and the browser\
    \ will likely slow down or crash. To manage the memory size, the framework removes\
    \ pages that are loaded via Ajax from the DOM automatically via the `pagehide`\
    \ event when the visitor navigates away from them. You’ll learn more about this\
    \ and other events later in the book.\n"
  raw: 'Table 4.2\. Link types that disable Ajax


    ![Image](graphics/04tab02.jpg)


    **[Table 4.3](#ch04.html_ch04tab03)** includes link types that stem from a basic
    HTML hyperlink with the addition of specific attributes.


    Table 4.3\. Miscellaneous link types


    ![Image](graphics/04tab03.jpg)


    The jQuery Mobile framework uses many hyperlink attributes to create enhancements
    to otherwise normal HTML webpages. This is just another reason why jQuery Mobile
    is more appealing than creating a mobile website from scratch. It lets you focus
    on what matters, eliminating the need to write core functionality every time you
    create a new mobile website.


    The following examples show a few of the link types covered in the tables.


    This webpage offers three examples of the link types that can be used in jQuery
    Mobile: an internal link, an external link, and a link that disables Ajax:


    [Click here to view code image](#images.html_p049pro01)


    <!DOCTYPE html>


    <html>


        <head>


            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


            <meta name="viewport" content="width=device-width, initial-scale=1">


            <title>Single-page template - Page 1 - jQuery Mobile: Design and Develop</title>


            <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


            <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


            <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


            </script>


        </head>


    <body class="container">


        <div data-role="page">


            <div data-role="header">


                <h1>Page 1</h1>


            </div>


            <div data-role="content">


                <p><a href="single-page-2.html">Link to page 2</a></p>


                <p><a href="single-page-2.html" rel="external">External Link to page
    2</a></p>


                <p><a href="single-page-2.html" data-ajax="false">Ajax-disabled link
    to page 2</a></p>


            </div>


            <div data-role="footer">


                Copyright


            </div>


        </div>


    </body>


    </html>


    An internal link requires no special markup and is where the framework will interject
    and create a page transition between the current page and the page that’s being
    linked to. An external link is one that requires the `rel` attribute, which must
    be set to a value of `external`. Setting a hyperlink as external disables Ajax,
    removes it from the page hashtag history, and refreshes the webpage when the link
    is clicked. The link that disables Ajax requires a `data-ajax` attribute with
    a value of `false`. This disables Ajax, removes it from the page hashtag history,
    and refreshes the webpage, just like the previous example, with the main difference
    being that the `rel="external"` attribute can be used as a standards-compliant
    way to create hyperlinks that target new windows with a little help from jQuery.


    In this next example, there’s an internal link and a hyperlink that acts as a
    back button:


    [Click here to view code image](#images.html_p050pro01)


    <!DOCTYPE html>


    <html>


        <head>


            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


            <meta name="viewport" content="width=device-width, initial-scale=1">


            <title>Single-page template - Page 2 - jQuery Mobile: Design and Develop</title>


            <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


            <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


            <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


        </head>


    <body class="container">


        <div data-role="page">


            <div data-role="header">


                <h1>Page 2</h1>


            </div>


            <div data-role="content">


                <p><a href="single-page.html">Ajax link to page 1</a></p>


                <p><a href="#" data-rel="back">Back button</a></p>


            </div>


            <div data-role="footer">


                Copyright


            </div>


        </div>


    </body>


    </html>


    Setting the `data-rel` attribute to back creates a hyperlink that acts like a
    back button. When this link is clicked, the jQuery Mobile framework automatically
    links to the previous page in history.


    ### Preloading and Caching Pages


    Page caching is very important when working with anything web-based. Cache refers
    to hidden storage where files are collected. By default, browsers handle webpage
    caching by putting the associated files in a local directory on the user’s computer
    so the webpage and its associated assets will load more quickly during subsequent
    visits. jQuery Mobile takes this concept a step further: the framework allows
    pages to be cached even before they’re linked to or displayed in the browser.
    Taking advantage of this functionality is as easy as using an HTML attribute named
    `data-prefetch`. Simply add it to any hyperlink in your webpage, and once the
    webpage has loaded, the URLs that these hyperlinks point to will be preloaded
    and cached. The following line of code shows how to add this attribute to a hyperlink
    to preload and cache the page it’s pointing to:


    [Click here to view code image](#images.html_p052pro01)


    <a href="page2.html" data-prefetch>Link to page 2</a>


    When running this example in a web browser, the request is made immediately upon
    page load. **[Figure 4.2](#ch04.html_ch04fig02)** shows an example of the XMLHttpRequest
    being made from Chrome when the page loads.


    ![Image](graphics/jquery-4-2.jpg)


    Figure 4.2\. A page being preloaded by jQuery Mobile using the prefetch attribute.


    The framework also provides a way to handle page preloading via the application
    programming interface (API). We’ll talk more specifically about the API later
    in the book, but it’s important to know how to access it.


    * * *


    ![Image](graphics/note.jpg) Note


    The application programming interface (API) allows for communication among multiple
    pieces of software.


    * * *


    To preload pages programmatically, you first need to access the jQuery Mobile
    object:


    $.mobile


    Once the document object is ready, use the `loadPage` method to pass the URL you
    want to preload and define a number of properties for the request:


    [Click here to view code image](#images.html_p053pro01)


    $(document).ready(function() {


        $.mobile.loadPage( "page2.html", {


            type: false,


            reloadPage: false,


            type: ''get''


        });


    });


    There are quite a few arguments you can pass as options in the `loadPage` method.
    **[Table 4.4](#ch04.html_ch04tab04)** lists those optional arguments.


    Table 4.4\. loadPage optional arguments


    ![Image](graphics/04tab04.jpg)


    In addition to providing control for preloading files, the jQuery Mobile framework
    provides control for caching pages in the document object model (DOM). Just like
    the preload option, you can define whether a page should be cached in the DOM
    via an HTML attribute or the jQuery Mobile API. The following example shows how
    the attribute can be used in a `page` tag to cache a webpage:


    [Click here to view code image](#images.html_p054pro01)


    <div data-role="page" data-dom-cache="true">


    To cache a webpage using the API, you can set all pages to cache by default:


    [Click here to view code image](#images.html_p054pro02)


    $.mobile.page.prototype.options.domCache = true;


    Or, you can cache a page independently. You would cache a page with an `id` of
    `my-page` like so:


    $(''#my-page'').page(true);


    When working with the single-page template, jQuery Mobile also manages the pages
    it preloads so the DOM doesn’t get too large. If many pages are kept in the DOM,
    the browser’s memory usage can get out of control and the browser will likely
    slow down or crash. To manage the memory size, the framework removes pages that
    are loaded via Ajax from the DOM automatically via the `pagehide` event when the
    visitor navigates away from them. You’ll learn more about this and other events
    later in the book.'
