    ```\n\n使用自定义命名空间的好处是不需要进行任何其他修改；代码的结果与使用默认命名空间运行 jQuery Mobile 网页的结果相同。\n\n你甚至可以使用级联样式表（CSS）选择器来选择包含自定义\
    \ `data-` 属性的特定 HTML 元素。例如，你可以选择一个 jQuery Mobile 页面元素并对其应用 CSS：\n\n点击此处查看代码图片\n\
    \n```css\n.ui-mobile [data-jquerymobiletv-role=\"page\"] {\n    /*在此处编写自定义 CSS\
    \ */\n}\n```\n\n随着 `data-` 属性的引入，开发者对添加到网页中的数据拥有了更多的控制权。自定义属性提供了支持语义化 HTML 的手段，同时通过\
    \ JavaScript 等前端脚本语言增强了网页功能。\n\n### 延迟页面初始化\n\n在 jQuery Mobile 中，页面初始化是默认自动发生的。该框架包含一个名为\
    \ `autoInitializePage` 的属性，它决定了是否应该初始化网页。默认情况下，该属性的值设置为 `true`，因此当文档准备就绪时页面始终会被初始化。然而，通过扩展\
    \ `$.mobile` 对象，可以将此属性设置为 `false` 并在之后处理页面初始化。\n\n你可以在其他脚本运行期间临时延迟页面初始化，这正是将 `autoInitializePage`\
    \ 属性设置为 `false` 的完美场景：\n\n点击此处查看代码图片\n\n```javascript\n$(document).bind(\"mobileinit\"\
    , function() {\n    $.extend( $.mobile, {\n        autoInitializePage: false\n\
    \    });\n});\n```\n\n想象一下需要加载大量的客户端 JavaScript，例如一个长姓名列表。在这种情况下，延迟初始化直到文档对象模型（DOM）完成加载可能是一个好主意。这样一来，客户端\
    \ JavaScript 就有机会运行，并且你可以优雅地让数据淡入，而不是让它在访问者眼前一行一行地加载：\n\n点击此处查看代码图片\n\n```html\n\
