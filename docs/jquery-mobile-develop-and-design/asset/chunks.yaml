- fmt: "\n[Figure 12.2](#ch12.html_ch12fig02) shows how the markup is transformed\
    \ by the framework to include the new class we created and applied the CSS to.\n\
    \n![Image](graphics/jquery-12-2.jpg)\n\nFigure 12.2\\. A custom active page class\
    \ inserted by the framework based on the global configuration settings.\n\nAnother\
    \ property named `activeBtnClass` works exactly the same as the `activePageClass`.\
    \ You can set it in the `mobileinit` callback. It can contain any string value,\
    \ and the string value can ultimately relate to a custom CSS class that you can\
    \ include in a CSS file. The only difference in the `activePageClass` and the\
    \ `activeBtnClass` properties is that the `activeBtnClass` lets you style the\
    \ active state of any buttons that are used.\n\n## Enabling and Disabling Ajax\
    \ Navigation\n\nBy default, Ajax-based navigation is set to `true` using the `$.mobile`\
    \ object’s `ajaxEnabled` property. However, this property can be set to `false`\
    \ in a configuration file:\n\n[Click here to view code image](#images.html_p187pro01)\n\
    \n```javascript\n$(document).bind(\"mobileinit\", function() {\n    $.extend(\
    \ $.mobile, {\n        ajaxEnabled: false\n    });\n});\n```\n\nThis is such a\
    \ simple property to modify, but it has major results. Setting this property to\
    \ `false` disables URL hash listening and loads all URLs as standard HTTP requests.\
    \ Doing so causes page refreshes, disables page preloading and caching, and eliminates\
    \ page and dialog transitions. If you’d like your mobile website to function as\
    \ a standard website, setting this option to `false` will create standard HTTP\
    \ requests.\n\n## Altering the Default Page and Dialog Transitions\n\nBy default,\
    \ pages and dialogs include a transition effect in jQuery Mobile when page changes\
    \ are handled via Ajax. The default page transition is `slide`, while the default\
    \ dialog transition is `pop`. To change these values, target the `defaultPageTransition`\
    \ and/or the `defaultDialogTransition` properties:\n\n[Click here to view code\
    \ image](#images.html_p188pro01)\n\n```javascript\n$(document).bind(\"mobileinit\"\
    , function() {\n    $.extend( $.mobile , {\n        defaultPageTransition: \"\
    fade\",\n        defaultDialogTransition: \"fade\"\n    });\n});\n```\n\nIf you\
    \ run this code, you’ll see that the transitions for pages and dialogs will both\
    \ be a fade:\n\n[Click here to view code image](#images.html_p188pro02)\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n    <title>Page Transitions - jQuery Mobile: Design and\
    \ Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"assets/js/custom-jqm-transitions.js\"></script>\n\
    \    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\"><h1>Page Name</h1></div>\n        <div data-role=\"content\">\n     \
    \       <p><a href=\"sample-page.html\">Open Another Page</a></p>\n          \
    \  <p><a href=\"dialog.html\" data-rel=\"dialog\">Open Dialog </a></p>\n     \
    \   </div>\n        <div data-role=\"footer\">Copyright</div>\n    </div>\n</body>\n\
    </html>\n```\n\nThe framework includes six CSS-based transition effects: `slide`,\
    \ `slideup`, `slidedown`, `pop`, `fade`, `flip`, which were all covered in detail\
    \ in [Chapter 4](#ch04.html_ch04), “Creating Multipage Websites with jQuery Mobile.”\
    \ These effects can also be applied directly on hyperlinks by including the `data-transition`\
    \ attribute:\n\n[Click here to view code image](#images.html_p189pro01)\n\n```html\n\
    <a href=\"sample-page.html\" data-transition=\"flip\">Data transition</a>\n```\n\
    \nUsing this code overrides any previous settings for transitions.\n\n## Wrapping\
    \ Up\n\nThe jQuery Mobile framework is simple to use, but don’t let its simplicity\
    \ fool you—there’s a lot happening behind the curtain. There are many ways to\
    \ add custom functionality to create powerful mobile websites. Accessing the API\
    \ allows fine-grained control that lets you tell the framework how to behave by\
    \ default and even tie into every interaction that occurs on the client side.\
    \ In the next chapter, you’ll see how events can provide even more control over\
    \ your custom project.\n\n## 13. Hooking into Events\n\njQuery Mobile offers custom\
    \ events you can use to extend the functionality of the framework, including touch,\
    \ scroll, device orientation, page transition, and page initialization, among\
    \ others. Hooking into jQuery events opens up an entire world of opportunity that\
    \ can’t be achieved with the basic setup. Knowing the state of a webpage at any\
    \ given time provides a level of control you can use to extend existing functionality.\
    \ This chapter shows you how to hook into each of these events. There are many\
    \ touch events you can hook into jQuery Mobile. Keep in mind that these are available\
    \ only to touch-enabled devices, so desktop users may not experience them or any\
    \ customizations added via an event hook. With that said, touch events won’t cause\
    \ errors on desktop devices: they simply won’t function because mouse events rule\
    \ the desktop experience. These events can trigger a callback function that includes\
    \ any JavaScript. [Table 13.1](#ch13.html_ch1301) describes the five touch events\
    \ accessible through the jQuery Mobile API.\n\nTable 13.1. Touch events\n![Image](graphics/13tab01.jpg)\n\
    \n[Table 13.2](#ch13.html_ch1302) describes the `swipe` event properties mentioned\
    \ in [Table 13.1](#ch13.html_ch1301).\n\nTable 13.2. swipe properties\n![Image](graphics/13tab02.jpg)\n\
    \nTo bind to any of these touch events, you must use the `document.ready` event.\
    \ Once the document is ready, you can access an HTML element and bind your selected\
    \ touch event:\n\n[Click here to view code image](#images.html_p193pro01)\n\n\
    ```javascript\n$(document).ready(function(){\n    $(\".test-tap-hold\").bind(\"\
    taphold\", function(event) {\n        $(this).html(\"Tapped and held\");\n   \
    \ });\n});\n```\n\nOnce the document is ready, the `taphold` event is bound to\
    \ an element with the class name `.test-tap-hold`. When a finger touches this\
    \ element and remains on it, the `taphold` event is fired. The following example\
    \ incorporates the JavaScript file that binds this event to the HTML element:\n\
    \n[Click here to view code image](#images.html_p193pro02)\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html;\
    \ charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n    <title>taphold- jQuery Mobile: Design and Develop</title>\n\
    \    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\"><h1>Page title</h1></div>\n        <div data-role=\"content\">\n    \
    \        <ul data-role=\"listview\">\n                <li class=\"test-tap-hold\"\
    >Tap and hold test</li>\n            </ul>\n        </div>\n        <div data-role=\"\
    footer\">Copyright</div>\n    </div>\n</body>\n</html>\n```\n\nAs you can see,\
    \ a `listview` is included in the page with a list item that contains a class\
    \ name of `test-tap-hold`.\n"
