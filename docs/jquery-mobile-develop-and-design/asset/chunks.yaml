    一个新兴的社区正在通过许多第三方应用和框架来支持该框架，你可以使用这些工具构建 jQuery Mobile 应用。此外，兼容 jQuery Mobile 的插件和扩展也层出不穷，帮助
    Web 开发人员集成自定义组件并为现有的核心功能添加能力。


