  trans: "\n你可以在一个独立的移动网站中包含 `viewport` 元标记标签，以适应较小的浏览器显示，但这通常超出了许多公司的能力范围，因为这增加了的时间和成本。此外，管理两个独立的网站通常是难以应付的负担。目前，正确渲染你网站的标准选项是使用\
    \ `viewport` 元标记标签。该标签告诉浏览器根据在该浏览器中查看时的最佳宽度来优化你的网站。要使用 `viewport` 元标记标签设置显示，请将元标记的\
    \ `name` 属性设置为 `viewport`，然后使用 `content` 属性来设置符合你需求的属性和值。在 `content` 属性中，你可以定义想要为布局设置的属性和值。如需向\
    \ `viewport` 元标记标签添加多个属性，你需要创建一个用逗号分隔的属性和值对列表。以下是移动开发中 `viewport` 元标记标签最常见的设置：\n\
    \n点击此处查看代码图片\n\n```html\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n```\n\n要将此标签包含在 HTML5 模板中，请将其添加到 `head` 元素中：\n\n点击此处查看代码图片\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <head>\n        <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n        <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n        <title>Page Title</title>\n  \
    \  </head>\n<body>\n\n</body>\n</html>\n```\n\n要设置的最重要属性是 `width`，对于移动网站，它应该被设置为\
    \ `device-width`。第二个属性是 `initial-scale`，它定义了网站首次加载时的状态，之后用户可以放大或缩小比例。例如，如果你将 `initial-scale`\
    \ 设置为 2 而不是 1，那么默认情况下网站将缩放 2 倍（即 2 将用作缩放的倍数）。表 2.1 详细描述了这些和其他元 `viewport` 属性。\n\
    \n表 2.1. 元 viewport 属性\n\n![Image](img/02tab01.jpg)\n\n在为移动网站设计或开发时，了解你的内容如何在不同设备上显示非常重要。记住，手持设备有很多形状和大小，而且有竖屏和横屏模式需要处理。我总是考虑使用\
    \ CSS 和/或 `viewport` 属性来创建可缩布局。然而，通过使用代码示例中的 `viewport` 元标记代码结合 jQuery Mobile\
    \ 框架，你可以确保你的网站可以在广泛设备上尽可能准确渲染。\n\n### 理解数据属性 (data-Attributes)\n\nHTML5 `data-`\
    \ 属性允许你存储用户不可见的自定义数据。换句话说，这些数据不会被浏览器渲染，甚至不会被使用。在之前的 HTML 版本中，自定义数据通常存储在 `title`、`rel`、`class`\
    \ 或 `id` 属性中，或者隐藏的 HTML 元素中。存储在这些属性中的数据可以被 JavaScript 访问。通过 JavaScript 访问自定义数据有许多用处；它可以在后台创建自定义功能，或者在发生特定交互时向用户显示。在网页中使用自定义数据的一个很好的例子是图片画廊：可以为图片添加标题和描述，然后使用\
    \ JavaScript 显示用户正在查看的图片信息。归根结底是，这是对这些 HTML 属性的误用，但到目前为止，它是处理某些不受支持功能的唯一方法。幸运的是，在\
    \ `data-` 属性的支持下，开发者可以开始恰当地使用 HTML 属性。\n\n你现在不必使用具有其他预定义用途的属性，而是可以创建与你的数据更相关的自定义\
    \ `data-` 属性，并且仍然渲染出有效的 HTML。HTML5 规范支持任何以 `data-` 开头的属性作为数据存储区域。你想要附加到 `data-`\
    \ 前缀的任何名称都将被支持。例如，如果你为属于图片画廊的图片标签添加自定义的 `data-` 属性，你可以添加自定义的 `data-title` 和 `data-description`\
    \ 属性，并给它们赋予任何自定义值。\n\n点击此处查看代码图片\n\n```html\n<img src=\"image-path/img.jpg\" data-title=\"\
    My image title\" data-description=\"My image description\">\n```\n\n![Image](img/note.jpg)\
    \ 注意\n\n创建自定义 `data-` 属性的唯一限制是属性的自定义部分必须至少有一个字符，且不能包含大写字母。\n\n属性值可以是任何字符串，并且如既往一样，你需要对字符串中的任何双引号进行转义。\n\
    \n记住潜在的命名冲突。随着 `data-` 属性变得越来越流行，JavaScript 库可能会寻找具有相似名称的属性，特别是当使用通用属性名称时，例如 `data-description`。解决此问题的良好方法是在\
    \ `data-` 属性的名称中使用自定义命名空间。例如，如果你正在为 `jquerymobile` 开发网站，你可以使用 `data-jquerytv-`：\n\
    \n```text\ndata-jquerytv-\n```\n\n随着 `data-` 属性变得越来越流行，JavaScript 库可能会寻找具有相似名称的属性，特别是当使用通用属性名称时，例如\
    \ `data-description`。解决此问题的良好方法是在 `data-` 属性的名称中使用自定义命名空间。例如，如果你正在为 `jquerymobile`\
    \ 开发网站，你可以使用 `data-jquerytv-`：\n\n```text\ndata-jquerytv-\n```\n\n如果你不使用命名空间，结果将不会在命名空间和值之间包含连字符，因此你的\
    \ `data-` 属性将难以阅读，jQuery Mobile 会寻找这样的属性：\n\n```text\ndata-jquerytvfoo\n```\n\n\
    jQuery Mobile 框架对组件使用了许多 `data-` 属性。框架本身允许你使用名为 `ns` 的全局配置选项定义自定义命名空间。`ns` 选项可以设置为任何自定义值，例如\
    \ `jquerymobile-`。如果你使用自定义命名空间，最好在结尾使用连字符：\n\n```text\njquerymobile-\n```\n\n\
    请注意，选择自定义命名空间意味着你在编码时必须承诺。例如，在定义 jQuery Mobile 头部时，你通常使用：\n\n```html\ndata-role=\"\
    header\"\n```\n\n要将此属性添加到你的 HTML5 模板中，只需添加一个包含该属性的 `div`：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n    <head>\n        <title>Page Title</title>\n        <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    </head>\n\
    <body>\n    <div data-role=\"header\">\n        <h1>Header</h1>\n    </div>\n\
    </body>\n</html>\n```\n\n然而，如果你在配置中定义了自定义命名空间，你将需要定义头部为：\n\n```html\ndata-jquerymobiletv-role=\"\
    header\"\n```\n\n我们将在书的后续部分详细讨论配置选项，包括 `ns` 选项。\n\n由于 `data-` 属性的引入，开发者对添加到网页中的数据有了更多的控制权。自定义属性提供了一种方法，可以在支持语义化\
    \ HTML 的同时，通过前端脚本语言（如 JavaScript）增强网页。\n\n### 总结\n\n"
- fmt: "\nIt may be daunting to think that you need to understand HTML5 and jQuery\
    \ to use the jQuery Mobile framework. Thankfully, the framework is built in a\
    \ way that supports developers with different skill levels. You don’t necessarily\
    \ have to know HTML5 and jQuery, because the framework provides a template for\
    \ HTML5 that you can download directly from [jquerymobile.com](http://jquerymobile.com),\
    \ and jQuery is available to those developers who want to use it. The only thing\
    \ that’s absolutely necessary is to understand how to use `data-` attributes,\
    \ because this is the way to add widgets to a webpage without using jQuery.\n\n\
    ## 3. Getting Started with jQuery Mobile\n\nIn the previous chapters, we covered\
    \ basic jQuery, how to create an HTML5 template, how to add a `viewport` meta\
    \ tag for mobile browsing, and how to use `data-` attributes. Now you’re ready\
    \ to dive into jQuery Mobile and see how these languages, elements, and attributes\
    \ are leveraged and enhanced using the framework. One of the great things about\
    \ the jQuery Mobile framework is that at its core it’s basic HTML5 markup and\
    \ JavaScript, which is supported by all major browsers. For basic jQuery Mobile\
    \ development, there honestly isn’t that much to learn. This chapter covers the\
    \ few steps and provides a little background as to what’s happening behind the\
    \ scenes. In later chapters, you’ll see how you can expand on these basic concepts\
    \ to create more advanced jQuery Mobile websites and even mobile web applications.\n\
    \n### How jQuery Mobile Works\n\nThere are many ways to build a jQuery Mobile\
    \ website. However, in its simplest form, the framework functions on top of HTML5\
    \ and the jQuery library to transform elements with `data-` attributes into components,\
    \ making it very easy to incorporate into your existing web development practices.\
    \ The most basic components of the framework are pages and toolbars, which will\
    \ be explained in more detail later in this chapter. But first, let’s look at\
    \ how to incorporate the jQuery Mobile framework into an HTML5 webpage.\n\n###\
    \ Adding the jQuery Mobile framework to your website\n\nFor starters, the jQuery\
    \ Mobile framework is available at [jquerymobile.com](http://jquerymobile.com).\
    \ There are two ways to add the jQuery Mobile framework to your webpages.\n\n\
    The first way is to download individual packages, which include both full and\
    \ minified versions of the JavaScript library and CSS file. You will also need\
    \ to download the jQuery library from [jquery.com](http://jquery.com).\n\nThe\
    \ second (and recommended) option is to include a direct reference to the CDN-hosted\
    \ files as seen here:\n\n[Click here to view code image](#images.html_p030pro01)\n\
    \n```html\n<link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\"\
    \ />\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n<script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
    ></script>\n```\n\n![Image](graphics/note.jpg) Note\n\nKeep in mind that at the\
    \ time this book was written the latest version of the jQuery Mobile framework\
    \ was final version 1. To get the latest code for including these files, visit\
    \ [jquerymobile.com](http://jquerymobile.com), where you can simply copy and paste\
    \ it into your webpages.\n\nTo add the framework to the HTML5 template you created\
    \ in [Chapter 2](#ch02.html_ch02), “[The Role of HTML5](#ch02.html_ch02),” add\
    \ it within the `head` element:\n\n[Click here to view code image](#images.html_p031pro01)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n    <head>\n        <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n        <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n        <title>Page Title</title>\n  \
    \      <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\"\
    \ />\n        <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n        <script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
    ></script>\n    </head>\n<body>\n\n</body>\n</html>\n```\n\nThe primary reason\
    \ that content delivery network (CDN)-hosted files are recommended is because\
    \ the load time is faster. A CDN will distribute your content across multiple,\
    \ geographically dispersed servers, so the user who is accessing your webpage\
    \ receives the closest available web files.\n\nIf you’re developing Microsoft\
    \ .net applications, you can use the Microsoft CDN-hosted jQuery Mobile files,\
    \ which are currently available at [http://www.asp.net/ajaxLibrary/CDNjQueryMobile10.ashx](http://www.asp.net/ajaxLibrary/CDNjQueryMobile10.ashx).\n\
    \nWith the jQuery Mobile framework in place, you can begin to transform your HTML5\
    \ markup into rich mobile components. Let’s take a look at the most common components:\
    \ pages and toolbars.\n\n### Pages and toolbars\n\nIn jQuery Mobile, a page is\
    \ literally defined by an element with a `data-role` attribute of `page`. I’m\
    \ not sure if it can get any easier than this. jQuery Mobile will convert this\
    \ `<div>` into a page. The following example shows a typical HTML structure using\
    \ these `data-roles`:\n\n```html\n<!DOCTYPE html>\n<html>\n    <head>\n      \
    \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n \
    \       <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n        <title>Page Title - jQuery Mobile</title>\n        <link rel=\"stylesheet\"\
    \ href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\" />\n  \
    \      <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n        <script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
    ></script>\n    </head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\">\n            <h1>Page title</h1>\n        </div>\n        <div data-role=\"\
    content\">\n            Body copy\n        </div>\n        <div data-role=\"footer\"\
    >\n            Copyright\n        </div>\n    </div>\n</body>\n</html>\n```\n\n\
    The code looks very similar to our previous examples, with the addition of the\
    \ `page`, `header`, `content`, and `footer` elements. The visual transformation\
    \ of this markup by jQuery Mobile can be seen in **[Figure 3.1](#ch03.html_ch03fig01)**.\n\
    \n![Image](graphics/jquery-3-1.jpg)\n\nFigure 3.1. jQuery Mobile visually transforms\
    \ markup with specific data- attributes.\n\nThe `header`, `content`, and `footer`\
    \ are all transformed into a basic layout that visually separates each of the\
    \ sections. This is the default jQuery Mobile theme; later in this book you’ll\
    \ learn how to create custom themes.\n"
  raw: 'It may be daunting to think that you need to understand HTML5 and jQuery to
    use the jQuery Mobile framework. Thankfully, the framework is built in a way that
    supports developers with different skill levels. You don’t necessarily have to
    know HTML5 and jQuery, because the framework provides a template for HTML5 that
    you can download directly from [jquerymobile.com](http://jquerymobile.com), and
    jQuery is available to those developers who want to use it. The only thing that’s
    absolutely necessary is to understand how to use `data-` attributes, because this
    is the way to add widgets to a webpage without using jQuery.


    ## 3\. Getting Started with jQuery Mobile


    In the previous chapters, we covered basic jQuery, how to create an HTML5 template,
    how to add a `viewport` meta tag for mobile browsing, and how to use `data-` attributes.
    Now you’re ready to dive into jQuery Mobile and see how these languages, elements,
    and attributes are leveraged and enhanced using the framework. One of the great
    things about the jQuery Mobile framework is that at its core it’s basic HTML5
    markup and JavaScript, which is supported by all major browsers. For basic jQuery
    Mobile development, there honestly isn’t that much to learn. This chapter covers
    the few steps and provides a little background as to what’s happening behind the
    scenes. In later chapters, you’ll see how you can expand on these basic concepts
    to create more advanced jQuery Mobile websites and even mobile web applications.


    ### How jQuery Mobile Works


    There are many ways to build a jQuery Mobile website. However, in its simplest
    form, the framework functions on top of HTML5 and the jQuery library to transform
    elements with `data-` attributes into components, making it very easy to incorporate
    into your existing web development practices. The most basic components of the
    framework are pages and toolbars, which will be explained in more detail later
    in this chapter. But first, let’s look at how to incorporate the jQuery Mobile
    framework into an HTML5 webpage.


    #### Adding the jQuery Mobile framework to your website


    For starters, the jQuery Mobile framework is available at [jquerymobile.com](http://jquerymobile.com).
    There are two ways to add the jQuery Mobile framework to your webpages.


    The first way is to download individual packages, which include both full and
    minified versions of the JavaScript library and CSS file. You will also need to
    download the jQuery library from [jquery.com](http://jquery.com).


    The second (and recommended) option is to include a direct reference to the CDN-hosted
    files as seen here:


    [Click here to view code image](#images.html_p030pro01)


    <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css"
    />


    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/ jquery.min.js"></script>


    <script src="http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js"></script>


    * * *


    ![Image](graphics/note.jpg) Note


    Keep in mind that at the time this book was written the latest version of the
    jQuery Mobile framework was final version 1\. To get the latest code for including
    these files, visit [jquerymobile.com](http://jquerymobile.com), where you can
    simply copy and paste it into your webpages.


    * * *


    To add the framework to the HTML5 template you created in [Chapter 2](#ch02.html_ch02),
    “[The Role of HTML5](#ch02.html_ch02),” add it within the `head` element:


    [Click here to view code image](#images.html_p031pro01)


    <!DOCTYPE html>


    <html>


        <head>


            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


            <meta name="viewport" content="width=device-width, initial-scale=1">


            <title>Page Title</title>


            <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css"
    />


            <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


            <script src="http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js"></script>


        </head>


    <body>


    </body>


    </html>


    The primary reason that content delivery network (CDN)-hosted files are recommended
    is because the load time is faster. A CDN will distribute your content across
    multiple, geographically dispersed servers, so the user who is accessing your
    webpage receives the closest available web files.


    If you’re developing Microsoft .net applications, you can use the Microsoft CDN-hosted
    jQuery Mobile files, which are currently available at [http://www.asp.net/ajaxLibrary/CDNjQueryMobile10.ashx](http://www.asp.net/ajaxLibrary/CDNjQueryMobile10.ashx).


    With the jQuery Mobile framework in place, you can begin to transform your HTML5
    markup into rich mobile components. Let’s take a look at the most common components:
    pages and toolbars.


    #### Page and toolbar components


    In jQuery Mobile, a page is literally defined by an HTML element with a `data-role`
    attribute set to a value of `page`:


    <div data-role="page"></div>


    Voilà. I’m not sure if it can get any easier than this. jQuery Mobile will convert
    this `<div>` element (most commonly used) into a page component. All you need
    to do is use this markup and embed the framework in the `<head>` of your webpage.


    Within the `data-role="page"` element, you can use whatever HTML markup you prefer.
    The most common elements to see within a `data-role="page"` element are `<div>`
    elements with `data-role` attribute values of `header`, `content,` and `footer`.
    The `header` and `footer` `data-role` attributes are both considered toolbar components
    in jQuery Mobile, while the `content` `data-role` is simply used to define the
    content area of your website in which you can add any HTML markup. The following
    example shows a typical HTML structure for a basic jQuery Mobile webpage using
    these `data-roles`:


    [Click here to view code image](#images.html_p032pro01)


    <!DOCTYPE HTML>


    <html>


        <head>


            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


            <meta name="viewport" content="width=device-width, initial-scale=1">


            <title>Basic template - jQuery Mobile: Design and Develop </title>


            <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css"
    />


            <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


            <script src="http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js"></script>


        </head>


    <body>


        <div data-role="page">


            <div data-role="header">


                <h1>Page title</h1>


            </div>


            <div data-role="content">


                Body copy


            </div>


            <div data-role="footer">


                Copyright


            </div>


        </div>


    </body>


    </html>


    The code looks very similar to our previous examples, with the addition of the
    `page`, `header`, `content`, and `footer` elements. The visual transformation
    of this markup by jQuery Mobile can be seen in **[Figure 3.1](#ch03.html_ch03fig01)**.


    ![Image](graphics/jquery-3-1.jpg)


    Figure 3.1\. jQuery Mobile visually transforms markup with specific data- attributes.


    The `header`, `content`, and `footer` are all transformed into a basic layout
    that visually separates each of the sections. This is the default jQuery Mobile
    theme; later in this book you’ll learn how to create custom themes. In this example,
    the page title is displayed prominently at the top within the header, while the
    body copy is formatted using the `content` `data-` attribute and the copyright
    is displayed in a defined footer area.


    #### Structuring mobile webpages'
