    The code here is fairly self-explanatory. You store the result of the function
    in a variable named `$mobile_device` and test that variable to see whether it’s
    true or false. If it’s true, you redirect the mobile device’s browser to the content
    you want that device to consume. You can use the function on any page and set
    custom redirections if you like. The result of the current function redirects
    the browser to [http://m.mywebsite.com](http://m.mywebsite.com), as seen in **[Figure
    17.1](#ch17.html_ch17fig01)**.


    ![Image](graphics/jquery-17-1.jpg)


    Figure 17.1\. The web URL in a normal browser and the URL the mobile device is
    redirected to use.


    You could return the user agent string from the function so you could perform
    certain actions based on which kind of device is accessing the website. Rather
    than do that, let’s learn how to detect specific devices with JavaScript when
    the browser arrives at the mobile site.


    ### Using JavaScript to Detect Specific Devices


    In some cases, you’ll want to know what specific mobile device is accessing your
    mobile website or application so you can have some control over the user’s experience.
    This control might come in the form of enabling or disabling certain functions
    or displaying data and content tailored to the user’s specific device.


    The technique is surprisingly similar to the method we used for PHP. Let’s examine
    a couple of ways to detect a specific mobile device, first using pure JavaScript
    and then using jQuery.


    #### Detecting mobile devices with JavaScript


    In JavaScript, as with PHP, you’ll use a regular expression to search through
    the device’s user agent string. From there you can add code to provide specific
    functionality in your mobile website based on the device accessing the site.


    Here’s a simple example:


    [Click here to view code image](#images.html_p257pro01)


    var mobile_device = navigator.userAgent.match(/(iPad)|(iPhone)/i);


    if(mobile_device) {


        // your code handling specific functionality for these devices


    } else {


        // your code to handle functionality outside of these devices


    }


    As you can see, you’re using a regular expression to look for a match to the user
    agent string. JavaScript gathers user agent information in its `navigator` object,
    and you can access that information in `navigator.userAgent`.


    On an iPhone 4 using Safari as the browser, the user agent string might look something
    like this:


    [Click here to view code image](#images.html_p257pro02)


    Mozilla/5.0 (iPhone; U; CPU iPhone OS 4_3_3 like Mac OS X; en-us) AppleWebKit/533.17.9
    (KHTML, like Gecko) Version/5.0.2 Mobile/8J2 Safari/6533.18.5


    Using JavaScript’s `match()` method, you can determine whether the `navigator.userAgent`
    has a match in the regular expression `/(iPad)|(iPhone)/i`. If you were using
    the tool at [http://regexpal.com](http://regexpal.com) to test your regular expression,
    it would look like **[Figure 17.2](#ch17.html_ch17fig02)**.


    ![Image](graphics/jquery-17-2.jpg)


    Figure 17.2\. The regular expression appears in the upper pane while the lower
    pane highlights the matches found in the user agent string.


    Now that you know how to test for specific mobile devices, you can build functionality
    into your site that lets you provide custom information and interactivity for
    those devices. Here’s a sample of a JavaScript `switch` statement that illustrates
    how to code this:


    [Click here to view code image](#images.html_p258pro01)


    var mobile_device = navigator.userAgent;


    switch(true) {


        case /(iPad)|(iPod)|(iPhone)/i.test(mobile_device):


            // code for these devices


        break;


        case /(android)/i.test(mobile_device):


            // code for this device


        break;


        default:


            // code for all other devices


        break;


    }


    You can create a case for as many mobile device types and user agent strings as
    needed to customize and enhance the user experience for anyone who accesses your
    website with a mobile device.


    Keep in mind that regular expression testing and matching can be expensive in
    terms of processing overhead, so don’t get carried away with lots of testing.
    Be careful when planning and designing your mobile applications so that functionality
    applies to as broad a range of devices as possible to reduce the number of tests
    that you make.


    * * *


    ![Image](graphics/note.jpg) Note


    Visit [http://detectmobilebrowsers.com/](http://detectmobilebrowsers.com/) for
    open-source ready-made code in a number of languages that you can build your mobile
    device detection around.


    * * *


    #### Detecting mobile browser features with jQuery


    Using pure JavaScript to detect mobile devices is the way to go when you need
    to know if a mobile device is accessing your website. You can go one step further
    and determine if a certain browser feature or function is supported with jQuery
    using jQuery’s `.support` method.


    Technically, you can’t do device detection with jQuery, but you can determine
    whether the browser—mobile or otherwise—will support certain features or functionality.
    This allows you to be browser agnostic during development, instead giving you
    the ability to account for certain browser features and handle exceptions as needed.


    For instance, you may want to know if the browser accessing your site adheres
    to the World Wide Web Consortium’s box model recommendation because portions of
    your layout rely on that feature. The following jQuery code will determine if
    the box model feature is true:


    $.support.boxModel;


    Now you can handle exceptions with a test:


    [Click here to view code image](#images.html_p259pro01)


    var box_model = $.support.boxModel;


    if(!box_model) {


        // place your exception handling code here


    }


    Here’s a partial list of the features you can detect using `.support`:


    • `ajax` will be `true` if the browser can support XMLHttpRequest.


    • `cors` will be `true` if the browser can support a cross-domain XMLHttpRequest.


    • `opacity` will be `true` if the browser supports this CSS property (all IE browsers
    will return false as they use alpha filters).


    • `submitBubbles` will be true if a submit event can bubble up the DOM tree.


    To find the rest of the list of jQuery `.support` properties, visit [http://api.jquery.com/jQuery.support/](http://api.jquery.com/jQuery.support/).


    ### Wrapping Up


    Detecting when a mobile device accesses your website and getting specific information
    about that device could not be easier to do now that you have a solid code foundation
    for building your jQuery Mobile websites and applications.


    You have several good tools available to you for configuring and testing regular
    expressions and digging deeper into user agent strings. With a firm grasp of these
    tools, it’s easy to develop mobile device detection for any website.


    The next question is, “How do I test my websites on as many mobile devices as
    possible?” Most of us can’t afford to purchase all the mobile devices available,
    so we’ll turn our attention to mobile device simulators. That’s up next!'
