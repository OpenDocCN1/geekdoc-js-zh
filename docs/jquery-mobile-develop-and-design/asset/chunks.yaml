    #### Nested lists


    Nested lists are hidden by default and load like additional pages. When a list
    is nested within another list item, the parent list item becomes a hyperlink to
    the child list and a new `ui-page` is generated for that list via the framework.
    To create a nested list, simply take any list item and add another unordered or
