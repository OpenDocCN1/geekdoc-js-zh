- fmt: 'Once you have a web server set up, you need to upload the Drupal files then
    download a MySQL database to configure Drupal. There are a number of free MySQL
    apps you can download and use for the database. This example uses `Sequel Pro`
    for Mac OS, which you’ll find at [www.sequelpro.com](http://www.sequelpro.com).
    For the sample in this chapter, we’ll be creating a database named `jqm-drupal`
    using `Sequel Pro`, as shown in [Figure 16.1](#ch16.html_ch16fig01).


    ![Image](graphics/jquery-16-1.jpg)


    Figure 16.1\. A database named `jqm-drupal` is added to store Drupal data.


    With the database set up, visit the site and complete the six-step installation
    process. The first step is choosing a profile ([Figure 16.2](#ch16.html_ch16fig02)).
    Unless you know exactly what you want, choose the `Standard` option, because it
    includes common features to prevent you from wasting your time reinventing the
    wheel with your Drupal configurations.


    ![Image](graphics/jquery-16-2.jpg)


    Figure 16.2\. Choose a profile for the Drupal installation process.


    Now it’s time to choose the language ([Figure 16.3](#ch16.html_ch16fig03)). By
    default, English is the only option, but you can click the link in this webpage
    to learn how to install Drupal in other languages.


    ![Image](graphics/jquery-16-3.jpg)


    Figure 16.3\. Choose a language for the Drupal installation process.


    After choosing the language, the technical requirements are verified. If the technical
    requirements do not pass the verification, a list of issues will be displayed.
    You’ll need to address them all before moving to the next installation step. Issues
    typically consist of simple file permissions that need to be adjusted. Once the
    verification process is complete, the next step is database configuration ([Figure
    16.4](#ch16.html_ch16fig04)). This step consists of selecting the database type,
    in this case, MySQL. Enter the database login information, including the database
    name `jqm-drupal` and the database username and password you used to create the
    database.


    ![Image](graphics/jquery-16-4.jpg)


    Figure 16.4\. (Left) The database configuration step of the Drupal installation
    process.


    Now it’s time to enter your site information ([Figure 16.5](#ch16.html_ch16fig05)),
    such as the site name and site e-mail address that will be used for automated
    e-mails (like registration information), a username, e-mail address, and password
    for an administrator account. It’s important to remember this login information:
    You’ll need it to log in to the Drupal administration area.


    ![Image](graphics/jquery-16-5.jpg)


    Figure 16.5\. (Right) The site configuration step of the Drupal installation process.


    Finally, you’ll see a congratulations screen, and you can view your new Drupal
    website ([Figure 16.6](#ch16.html_ch16fig06)).


    ![Image](graphics/jquery-16-6.jpg)


    Figure 16.6\. The Drupal installation process has successfully completed.


    With Drupal installed, you can log in to the Drupal administration area using
    the username and password you just entered. Within the administration area, you
    can completely manage your website: You can create webpages, blog posts, and users,
    as well as install modules and themes. Now it’s time to set up the jQuery Mobile
    theme for our sample website.


    ### Theming Drupal with jQuery Mobile


    Adding a jQuery Mobile theme to Drupal is fairly easy, but not as easy as with
    WordPress. Drupal requires two items to be installed to use a jQuery Mobile theme:
    the jQuery Mobile module and the `jQM` theme.


    #### Installing the jQuery Mobile module


    The jQuery Mobile module was created to enhance the theme and provide admin functionality,
    such as choosing the framework version, setting swatches, and even theming individual
    menus and other layout elements. You can find more information about the module
    at [http://drupal.org/project/jquerymobile](http://drupal.org/project/jquerymobile).
    Once downloaded, this module needs to be placed into the `sites/all/modules/`
    directory of your Drupal installation. Within the module folder, there’s a file
    named `README.txt` that lists the steps for completing the installation ([Figure
    16.7](#ch16.html_ch16fig07)).


    ![Image](graphics/jquery-16-7.jpg)


    Figure 16.7\. jQuery Mobile module installation process.


    The first step in this process is to create a directory named `libraries` in the
    `sites/all` directory ([Figure 16.8](#ch16.html_ch16fig08)).


    ![Image](graphics/jquery-16-8.jpg)


    Figure 16.8\. Create a `libraries` directory.


    Within that directory, create a directory named `jquery` ([Figure 16.9](#ch16.html_ch16fig09)).


    ![Image](graphics/jquery-16-9.jpg)


    Figure 16.9\. Create a `jquery` directory.


    Download and copy the jQuery Mobile framework and jQuery library into the `jquery`
    directory you just created ([Figure 16.10](#ch16.html_ch16fig10)).


    ![Image](graphics/jquery-16-10.jpg)


    Figure 16.10\. (Left) The jQuery Mobile framework and jQuery library.


    Create a directory named `custom` in the `jquery` directory ([Figure 16.11](#ch16.html_ch16fig11)).


    ![Image](graphics/jquery-16-11.jpg)


    Figure 16.11\. (Right) Create a `custom` directory.


    In the `settings.php` file, you can add the following variables:


    ```php

    $conf[''jquerymobile_front''] = 0;

    $conf[''jquerymobile_ns''] = '''';

    $conf[''jquerymobile_autoInitialize''] = '''';

    $conf[''jquerymobile_subUrl''] = '''';

    $conf[''jquerymobile_activePage''] = '''';

    $conf[''jquerymobile_activeBtn''] = '''';

    $conf[''jquerymobile_ajaxEnabled''] = '''';

    $conf[''jquerymobile_hashEnabled''] = '''';

    $conf[''jquerymobile_defaultTransition''] = '''';

    $conf[''jquerymobile_defaultDialog''] = '''';

    $conf[''jquerymobile_minScrollBack''] = '''';

    $conf[''jquerymobile_loadingMessage''] = '''';

    $conf[''jquerymobile_errorMessage''] = '''';

    ```


    At last it’s time to activate the module in the Drupal administration area. Visit
    the modules section and locate the jQuery Mobile module, which should appear under
    the Mobile section ([Figure 16.12](#ch16.html_ch16fig12)).


    ![Image](graphics/jquery-16-12.jpg)


    Figure 16.12\. Activate the jQuery Mobile module.


    #### Installing the jQuery Mobile theme


    With the jQuery Mobile module installed, configured, and activated, it’s time
    for the theme. You can download the `jQM` theme from [http://drupal.org/project/jqm](http://drupal.org/project/jqm).
    This theme converts the front-end of the website into a jQuery Mobile experience.
    The theme requires the `jquerymobile` module, therefore it’s important to download
    and install it before attempting to use this theme. Luckily, we just did this,
    so now it’s time to set up the theme.


    With the theme downloaded, place it in the `sites/all/themes/jqm/` directory of
    your Drupal installation. To activate the theme, go to the Appearance page of
    the Drupal administration area and select the `Enable` link below the theme ([Figure
    16.13](#ch16.html_ch16fig13)).


    ![Image](graphics/jquery-16-13.jpg)


    Figure 16.13\. (Left) Activate the jQuery Mobile theme.


    By default, the theme will not include any pages or articles, so when you visit
    the site you will see a login screen. However, you should see that the jQuery
    Mobile theme is now active and driving the style of your header, footer, text
    inputs, and buttons ([Figure 16.14](#ch16.html_ch16fig14)).


    ![Image](graphics/jquery-16-14.jpg)


    Figure 16.14\. (Right) A default Drupal installation with the jQuery Mobile theme.

