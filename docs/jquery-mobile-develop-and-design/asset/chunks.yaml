  trans: "\n\n你也可以通过 jQuery Mobile API 更新工具栏的位置。这种方法有时是必要的，例如当小部件（如手风琴）展开并导致页面高度发生变化时。你可以调用以下代码来更新工具栏的位置：\n\
    \n点击此处查看代码图像\n\n```javascript\n$.mobile.fixedToolbars.show(true);\n```\n\n当你正在构建动态内容时，这段代码非常好用。\n\
    \n除了固定工具栏外，你还可以创建全屏固定页眉。全屏固定页眉与固定头部相同，唯一区别是内容位于工具栏之后，因此内容仍然是全屏的，而工具栏是透明的。点击页面时，工具栏也会消失。要创建全屏固定工具栏，只需添加\
    \ `data-fullscreen` 属性并将其设置为 `true`：\n\n点击此处查看代码图像\n\n```html\n<div data-role=\"\
    header\" data-fullscreen=\"true\" data-position=\"fixed\">\n    <h1>Page Title</h1>\n\
    </div>\n```\n\n对于普通的固定工具栏，内容位于页眉和页脚之间。全屏工具栏常用于视频播放器或幻灯片播放。\n\n### 创建导航栏\n\n导航在网页页眉中显示得最为显著。jQuery\
    \ Mobile 提供了一个名为 `navbar` 的部件来创建导航。导航栏并不要求位于页眉工具栏中，但它们通常出现在页眉或页脚中。让我们看看如何有效地将其用作移动网站页眉中的页面导航。导航栏本质上是一个包含在带有\
    \ `data-role` 值为 `navbar` 的元素中的简单无序列表：\n\n点击此处查看代码图像\n\n```html\n<div data-role=\"\
    header\">\n    <div data-role=\"navbar\">\n        <ul>\n            <li><a href=\"\
    /\">Home</a></li>\n            <li><a href=\"#\">About</a></li>\n            <li><a\
    \ href=\"#\">Contact</a></li>\n        </ul>\n    </div>\n</div>\n```\n\njQuery\
    \ Mobile 再次通过添加单个属性，使其能够极其轻松地将简单的 HTML 标记转换为视觉上具有吸引力且功能完备部件。图 6.8 显示了此代码在视觉上的渲染效果。\n\
    \n![Image](img/jquery-6-8.jpg)\n\n图 6.8。用在页眉工具栏中的导航栏。\n\n该框架酷的地方在于，它根据按钮的数量均匀地划分导航栏的空间。这就是为什么图\
    \ 6.8 中的每个按钮都是比例的。导航栏唯一的注意事项是，如果它们包含超过五个超链接，它们将开始换行到多行，如图 6.9 所示。\n\n![Image](img/jquery-6-9.jpg)\n\
    \n图 6.9。拥有五个按钮按钮的导航栏。\n\n这在某种上是一个局限性，但它也是一种幸运，因为移动设备没有足够的水平空间来容纳这么多按钮。\n\n页眉导航栏的另一个优点是，它们不需要你移除页面标题。你仍然可以使用带有页面标题的标题元素，然后在下方添加导航栏。或者，更好的是，你可以添加一个\
    \ Logo 然后添加一个导航栏，就像你在整个网络上通常看到的那样：\n\n点击此处查看代码图像\n\n```html\n<div data-role=\"\
    header\">\n    <img src=\"assets/img/trademark-jquerymobiletv.png\">\n    <div\
    \ data-role=\"navbar\">\n        <ul>\n            <li><a href=\"/\">Home</a></li>\n\
    \            <li><a href=\"#\">About</a></li>\n            <li><a href=\"#\">Contact</a></li>\n\
    \        </ul>\n    </div>\n</div>\n```\n\n如图 6.10 所示，Logo 被添加在导航上方。页眉工具栏可以包含多个元素；它们不仅限于按钮或页面标题。\n\
    \n![Image](img/jquery-6-10.jpg)\n\n图 6.10。页眉中的导航栏和 Logo。\n\n图 6.11 显示了一个导航栏。\n\
    \n![Image](img/jquery-6-11.jpg)\n\n图 6.11。导航栏和 Logo。\n\n### 总结\n\n工具栏可以帮助你建立页面上的一致性。除了固定工具栏外，你还可以创建全屏固定页眉。全屏固定页眉与固定头部相同，唯一区别是内容位于工具栏之后，因此内容仍然是全屏的，而工具栏是透明的。点击页面时，工具栏也会消失。\n\
    \n### 布局选项\n\njQuery Mobile 的灵活之处在于它支持标准 HTML，同时也提供了自定义布局。当你需要将内容组织成网格时，网格非常有用。你可以通过定义你想要的列数来创建一个网格。以下示例显示了如何创建一个网格布局。\n\
    \n"
- fmt: "\nFigure 7.1. A two-column grid.\n\nThe result of this code will look similar\
    \ to [Figure 7.2](#ch07.html_ch07fig02).\n\n![Image](graphics/jquery-7-2.jpg)\n\
    \nFigure 7.2. Multiple grids with different column amounts.\n\nOn their own, columns\
    \ are pretty bland, but you can add predefined jQuery Mobile classes or write\
    \ your own CSS for the existing classes. For example, the jQuery Mobile framework\
    \ includes a class called `ui-bar` that adds padding and another set of classes\
    \ that can be appended with a letter to customize the theme, which will affect\
    \ the background, miscellaneous font styling, and so on. We’ll learn more about\
    \ jQuery Mobile themes later in the book. The following example uses the `ui-bar-a`\
    \ class to add a blue background gradient, font styling, and other CSS updates:\n\
    \n[Click here to view code image](#images.html_p092pro01)\n\n```html\n<div class=\"\
    ui-grid-a\">\n    <div class=\"ui-block-a\">\n        <div class=\"ui-bar ui-bar-b\"\
    ><strong>2-Column</strong></div>\n    </div>\n    <div class=\"ui-block-b\">\n\
    \        <div class=\"ui-bar ui-bar-b\">Column</div>\n    </div>\n</div>\n```\n\
    \n[Figure 7.3](#ch07.html_ch07fig03) shows the result of this code, which looks\
    \ much nicer than the previous examples, adding styling updates that enhance the\
    \ grid.\n\n![Image](graphics/jquery-7-3.jpg)\n\nFigure 7.3. A two-column grid\
    \ with the ui-bar class.\n\nAdding custom CSS to a grid column is simple. Since\
    \ the grid is standard HTML markup, you can append a custom CSS class to any of\
    \ the elements. In the following example, a custom class `block-title` has been\
    \ added to the first column and another class has been added to all `div` elements\
    \ in the grid:\n\n[Click here to view code image](#images.html_p093pro01)\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>Grids - jQuery Mobile: Design\
    \ and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n    <style type=\"text/css\">\n    .ui-grid-a div {\n        background-color:\
    \ #ccc;\n    }\n    .ui-grid-a div.block-title {\n        background-color: #fff;\n\
    \    }\n    </style>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div\
    \ data-role=\"header\" data-position=\"fixed\">\n            <h1>My Page Title</h1>\n\
    \        </div>\n        <div data-role=\"content\">\n            <div class=\"\
    ui-grid-a\">\n                <div class=\"ui-block-a block-title\">2-Column</div>\n\
    \                <div class=\"ui-block-b\">Column</div>\n            </div>\n\
    \        </div>\n        <div data-role=\"footer\" data-position=\"fixed\">\n\
    \            <h4>Copyright</h4>\n        </div>\n    </div>\n</body>\n</html>\n\
    ```\n\nThe result of this code will look similar to [Figure 7.4](#ch07.html_ch07fig04).\n\
    \n![Image](graphics/jquery-7-4.jpg)\n\nFigure 7.4. A two-column grid with custom\
    \ CSS.\n\nUsing a two-column grid would have been a better way to handle the functionality\
    \ for the button groups in [Chapter 5](#ch05.html_ch05), [Dialog and Buttons](#ch05.html_ch05).\
    \ Rather than using floats to align the control groups, you could use the grid\
    \ to separate them. The following code shows how a grid could be used to create\
    \ layouts within a toolbar:\n\n[Click here to view code image](#images.html_p095pro01)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>Grid with controlgroup - jQuery\
    \ Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n    <style type=\"text/css\">\n    .ui-grid-a .ui-block-b {\n    \
    \    text-align: right;\n    }\n    </style>\n</head>\n<body>\n    <div data-role=\"\
    page\">\n        <div data-role=\"header\">\n            <div class=\"ui-grid-a\"\
    >\n                <div class=\"ui-block-a\">\n                    <div data-role=\"\
    controlgroup\" data-type=\"horizontal\">\n                        <a href=\"#\"\
    \ data-role=\"button\" data-icon=\"home\">Home</a>\n                        <a\
    \ href=\"#\" data-role=\"button\" data-icon=\"arrow-l\">Back</a>\n           \
    \         </div>\n                </div>\n                <div class=\"ui-block-b\"\
    >\n                    <div data-role=\"controlgroup\" data-type=\"horizontal\"\
    >\n                        <a href=\"#\" data-role=\"button\" data-icon=\"delete\"\
    >Delete</a>\n                        <a href=\"#\" data-role=\"button\" data-icon=\"\
    check\">Save</a>\n                    </div>\n                </div>\n       \
    \     </div>\n        </div>\n        <div data-role=\"content\">\n          \
    \  <p>Body</p>\n        </div>\n        <div data-role=\"footer\" data-position=\"\
    fixed\">\n            <h4>Copyright</h4>\n        </div>\n    </div>\n</body>\n\
    </html>\n```\n\n[Figure 7.5](#ch07.html_ch07fig5) shows the visual result of this\
    \ code.\n\n![Image](graphics/jquery-7-5.jpg)\n\nFigure 7.5. A grid used to separate\
    \ control groups.\n\n### Grid rows\n\njQuery Mobile also lets you create grids\
    \ with multiple rows. The same rules apply as the classes used for columns; however,\
    \ rows are defined by each new set of blocks that you add to a grid. For example,\
    \ to create a four-column grid, the `ui-grid-c` class must be used as usual. Inside\
    \ the grid is where things get: simply repeat sets of columns. In this case, it’ll\
    \ be multiple sets in a four-column layout. The following example shows a four-column\
    \ grid with two rows:\n\n[Click here to view code image](#images.html_p097pro01)\n\
    \n```html\n<div class=\"ui-grid-c\">\n    <div class=\"ui-block-a\">\n       \
    \ <div class=\"ui-bar ui-bar-b\">A</div>\n    </div>\n    <div class=\"ui-block-b\"\
    >\n        <div class=\"ui-bar ui-bar-b\">B</div>\n    </div>\n    <div class=\"\
    ui-block-c\">\n        <div class=\"ui-bar ui-bar-b\">C</div>\n    </div>\n  \
    \  <div class=\"ui-block-d\">\n        <div class=\"ui-bar ui-bar-b\">D</div>\n\
    \    </div>\n    <div class=\"ui-block-a\">\n        <div class=\"ui-bar ui-bar-b\"\
    >A</div>\n    </div>\n    <div class=\"ui-block-b\">\n        <div class=\"ui-bar\
    \ ui-bar-b\">B</div>\n    </div>\n    <div class=\"ui-block-c\">\n        <div\
    \ class=\"ui-bar ui-bar-b\">C</div>\n    </div>\n    <div class=\"ui-block-d\"\
    >\n        <div class=\"ui-bar ui-bar-b\">D</div>\n    </div>\n</div>\n```\n\n\
    Each element with the `ui-block-a` class automatically clears the row before it,\
    \ resulting in a new row. When looking at the actual CSS included in the jQuery\
    \ Mobile framework for the `ui-block-a` class, you can see that it clears left\
    \ floats, therefore the result looks similar to [Figure 7.6](#ch07.html_ch07fig06).\n\
    \n![Image](graphics/jquery-7-6.jpg)\n\nFigure 7.6. A grid with multiple rows and\
    \ columns.\n\n### Collapsible Content\n\njQuery Mobile provides a widget that\
    \ allows developers to create content that can expand and contract. This widget,\
    \ referred to as collapsible content, includes a header and content area; the\
    \ header acts as a button that can be touched to expand and contract the content\
    \ area. To create a collapsible content area, apply the `data-role` attribute\
    \ with a value of `collapsible` to a `div` that will be used to contain a heading\
    \ and content area. In the following example, the container element with a `data-role`\
    \ set to `collapsible` includes a heading and a paragraph element:\n\n[Click here\
    \ to view code image](#images.html_p099pro01)\n\n```html\n<div data-role=\"collapsible\"\
    >\n    <h3>Collapsible content header</h3>\n</div>\n```\n"
