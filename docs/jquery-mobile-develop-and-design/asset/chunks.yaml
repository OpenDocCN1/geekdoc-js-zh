    The `lazy-img` class is used to determine which images to load lazily, and the
    `data-image` attribute is used as a reference to the unique image for that tag
    that is loaded when the portion of the page is revealed in the browser. There
    are endless possibilities for adding custom functionality using the scroll events;
    this is just one example, but it is a powerful one that increases the speed at
    which webpages load.


    ### Page Transition Events


    Imagine knowing when a page transition is going to occur before it even happens.
    Add to that knowing ahead of time when a page is going to hide. With page transition
    events, this is possible. jQuery Mobile page animations are powered by page transitions.
    The animations used during the transition between pages were defined in previous
    chapters, but there are also events associated with each step of a page transition.
    Events occur before and after each page transition and can be used to execute
    custom code at any time during this process. As shown in **[Figure 13.3](#ch13.html_ch13fig03)**,
    four events are associated with page transitions, and they occur in sequence.


    ![Image](graphics/jquery-13-3.jpg)


    Figure 13.3\. The four events associated with jQuery Mobile’s page transition
    process.


    The first two events occur on the page currently in view when the page transition
    begins, and the final two events occur on the page that is coming into view.


    Attaching event handlers to these events is easy with the jQuery `on` method.
    You can attach an event handler to a single element for each of the events. In
    the following example, the `on` method is attached to `div#my-page` and allows
    custom event handlers to be created for each of the page transition events. The
    `div` with an `id` of `my-page` is being used as the page container in the HTML
    document, therefore at any step of page transition these events trigger the custom
    script that writes to the console:


    [Click here to view code image](#images.html_p200pro01)


    $(document).ready(function() {


        $(''div#my-page'').on({


        pagebeforeshow: function(event, ui) {


            console.log(''This page is about to be shown: ''+ ui.prevPage);


        },'
