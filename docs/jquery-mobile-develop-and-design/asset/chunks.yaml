    ### Creating Custom Search Filters


    The jQuery Mobile framework gives you two options for creating custom search filters.
    The `listview` includes a `filterCallback` option that can be extended with a
    custom callback function. By extending this callback function, two arguments—`text`
    and `searchValue`—become available and can be used to write custom search criteria.
