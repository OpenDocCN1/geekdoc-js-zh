    </div>\n```\n\n图 7.3 显示此代码的结果，它看起来比之前的示例漂亮得多，添加了增强网格的样式更新。\n\n![Image](img/jquery-7-3.jpg)\n\
    \n图 7.3。带有 `ui-bar` 类的双列网格。\n\n在网格列中添加自定义 CSS 是非常简单的。由于网格是标准的 HTML 标记，你可以向任何元素添加自定义\
    \ CSS 类。在接下来的示例中，已向第一列添加了自定义类 `block-title`，并向网格中的所有 `div` 元素添加了另一个类：\n\n点击此处查看代码图像\n\
    \n```html\n<!DOCTYPE html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n    <title>Grids - jQuery Mobile: Design and Develop</title>\n\
    \    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n    <style type=\"text/css\">\n    .ui-grid-a div {\n        background-color:\
    \ #ccc;\n    }\n    .ui-grid-a div.block-title {\n        background-color: #fff;\n\
    \    }\n    </style>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div\
    \ data-role=\"header\" data-position=\"fixed\">\n            <h1>My Page Title</h1>\n\
    \        </div>\n        <div data-role=\"content\">\n            <div class=\"\
    ui-grid-a\">\n                <div class=\"ui-block-a block-title\">2-Column</div></div>\n\
    \                <div class=\"ui-block-b\">Column</div></div>\n            </div>\n\
    \        </div>\n        <div data-role=\"footer\" data-position=\"fixed\">\n\
    \            <h4>Copyright</h4>\n        </div>\n    </div>\n</body>\n</html>\n\
    ```\n\n此代码的结果将与 图 7.4 类似。\n\n![Image](img/jquery-7-4.jpg)\n\n图 7.4。带有自定义 CSS 的双列网格。\n\
    \n使用双列网格是处理 第 5 章 对话框与按钮 中按钮组功能的更好方法。与其使用浮动（floats）来对齐控制组，不如使用网格将它们隔离开。下面的代码展示了如何使用网格在工具栏内创建布局：\n\
