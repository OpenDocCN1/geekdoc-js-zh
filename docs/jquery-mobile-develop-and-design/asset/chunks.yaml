  trans: "\n\n`$(this)` 与在 JavaScript 中使用 `this` 关键字相同；在这种情况下，它适用于当前触发 `click` 事件的元素。在考虑作用域时，`this`\
    \ 始终指向与闭包上下文相关的对象。在示例中，`div.foo` 是对象，而 `click` 事件的处理器函数就是闭包上下文。jQuery 会自动在你的匿名处理函数内部将被点击的元素赋值为\
    \ `$(this)`。这使得你能够访问执行事件的元素，即使相同的代码被应用于多个元素上也是如此。函数用于作为事件的结果或对函数的简单直接的调用来执行脚本或一组脚本。\n\
    \n### `bind` 方法与自定义事件\n\n正如你将在本书的后续部分学到的，`bind` 方法经常被 `jQuery Mobile` 框架用于处理自定义事件。\n\
    \n#### jQuery Mobile 自定义事件\n\n`jQuery Mobile`提供的自定义事件为框架原生功能之外的开发提供了非常有钩子，这意味着你可以拦截某些现有的事件并添加自己的自定义代码。这些事件包括\
    \ `touch`、`mouse` 和 `window` 事件，你将在本书的后续部分学习如何扩展它们。jQuery 中 `bind` 方法的语法与之前的代码示例非常相似。\n\
    \n点击此处查看代码图片\n\n```javascript\n$('div.foo').bind('click', function(e) {\n    //\
    \ 在此处编写你的自定义代码\n});\n```\n\n区别在于，你可以使用同一个处理器对多个事件做出反应：\n\n点击此处查看代码图片\n\n```javascript\n\
    $('div.foo').bind('mouseenter mouseleave', function(e) {\n    // 在此处编写你的自定义代码\n\
    });\n```\n\n***\n\n![Image](img/note.jpg) 备注\n\n函数与方法之间的区别在于，函数是独立的，而方法与对象关联的。在这种情况下，`bind`\
    \ 方法与 `jQuery` 对象关联联。\n\n***\n\n#### 处理自定义事件\n\n或者你也可以处理自定义事件，例如由 `jQuery Mobile`\
    \ 框架实现的：\n\n点击此处查看代码图片\n\n```javascript\n$('div.foo').bind('displayMyName', function(e,\
    \ myName) {\n    alert('My name is: '+ myName);\n});\n\n$('button').click(function\
    \ () {\n    $('div.foo').trigger('displayMyName', ['John Smith']);\n});\n```\n\
    \n当我们讨论如何将 `jQuery Mobile` 事件与自定义处理函数绑定时，将更深入地介绍绑定事件的内容。\n\n### 等待文档就绪\n\n开发者之间的一种常见做法是在执行任何\
    \ JavaScript 之前等待网页加载。这样做的原因是确保在尝试访问或操作网页元素之前，这些元素是可用的。尝试访问不可用的文档元素可能会导致意想不到的行为，并可能破坏你后续所有的\
    \ JavaScript 代码。在传统的 JavaScript 中，等待页面加载的最常用方法是使用 `window.onload` 事件。然而，这种方法是在文档加载之后发生的，因为它实际上在等待网页内内的所有图像和横幅加载，这会极大地延迟你的脚本执行。幸运的是，jQuery\
    \ 提供了一个 `ready` 事件，让你的代码在文档可用时立即做出响应。\n\n点击此处查看代码图片\n\n```javascript\n$(document).ready(function()\
    \ {\n    // 在此处编写你的自定义代码\n});\n```\n\n首先，你需要选择文档对象本身，然后应用 `ready` 事件。当 `ready`\
    \ 事件触发时，它将执行包含你自定义代码的函数。继续之前的示例，你需要将自定义代码添加到 `ready` 事件中，以确保在尝试应用 `click` 事件之前文档是就绪的：\n\
    \n点击此处查看代码图片\n\n```javascript\n$(document).ready(function() {\n    $('div.foo').click(function()\
    \ {\n        alert($(this).html());\n    });\n});\n```\n\n或者你可以使用简写版本，它消除了访问 `document`\
    \ 和设置 `ready` 事件的需要。\n\n点击此处查看代码图片\n\n```javascript\n$(function() {\n    $('div.foo').click(function()\
    \ {\n        alert($(this).html());\n    });\n});\n```\n\n使用 `ready` 事件是任何 jQuery\
    \ 开发中的事实标准。这种方法不仅确保了你的代码会在适当的时间触发，还利于创建完全不干扰的代码，这意味着你可以将所有的 jQuery 代码写在一个独立的外部文件中，只需从你的\
    \ HTML 网页中简单引用它即可。\n\n### 应用特殊特效\n\n`jQuery` 以其允许你在不使用第三方插件（如 `Flash`）的情况下创建特殊特效而闻名。该库提供了许多将动画整合到网页中的技术。动画可以创建一个更具视觉吸引力的网页，也可以用于其他更具实用的目的，例如为用户交互提供视觉反馈。`jQuery`\
    \ 框架包含了许多预置的动画方法，例如 `fadeIn`、`fadeOut`、`fadeTo`、`show`、`toggle`、`slideUp` 和 `slideDown`\
    \ 等。\n\n```javascript\n$(document).ready(function() {\n    $('div.foo').fadeIn();\n\
    });\n```\n\n尽管这些预置方法看起来是独立的，但它们许多内部是由 `animate` 方法驱动的。`animate` 方法可以用于对任何数值 CSS\
    \ 属性进行动画处理，例如 `height`、`opacity`、`left` 和 `right`。\n\n点击此处查看代码图片\n\n```javascript\n\
    $(document).ready(function() {\n    $('div.foo').click(function() {\n        $(this).animate({\n\
    \            height: '50'\n        }, 1000, function() {\n            // 动画完成后执行的自定义代码\n\
    \        });\n    });\n});\n```\n\n在这个示例中，当 `div.foo` 被点击时，它的 `height` 属性将在 1\
    \ 秒（1000 毫秒）内增加 50 像素，动画完成后，回调函数将执行你的自定义代码。这种功能非常强大；你不仅可以在事件触发时执行动画，还可以在动画完成后触发函数甚至另一个事件，以此类推。\n\
    \n#### 队列方法\n\n`queue` 方法提供了一种队列连续效果的方法，这意味着可以在队列中运行多个效果，或者通过 `clearQueue` 方法停止队列。`queue`\
    \ 方法主要由 `FX` 队列（即默认队列）使用，但也可以通过 `jQuery` API 可用。\n\n`queue` 和 `dequeue` 方法旨在与特定的元素或对象关联。使用\
    \ `queue` 方法时，你需要分配一个参数作为参数，例如一个匿名函数：\n\n```javascript\n$(document).ready(function()\
    \ {\n    $('div.foo').fadeOut().queue(function(){\n        $('div.foo').fadeIn();\n\
    \        next();\n    });\n});\n```\n\n这种功能让你能够不使用 JavaScript 函数（如 `setTimeout`\
    \ 或 `setInterval`）来产生基于时间线的动画。\n\n这些示例仅涵盖了动画方法。`jQuery` 包含了创建队列以提供额外功能的方法。**表\
    \ 1.1** 列出了 jQuery 中可用的队列方法。\n\n表 1.1 队列方法\n\n![Image](img/01tab01.jpg)\n\n正如提到的，尽管队列通常用于效果并在\
    \ jQuery 文档中列在效果下，但它们也可以用于队列其他功能，例如一系列异步方法调用，这引导我们进入使用 jQuery Ajax。\n\n#### 使用\
    \ Ajax\n\n"
- fmt: "\nAjax is an acronym for asynchronous JavaScript and XML. Asynchronous means\
    \ that you can make a request to a server via Hypertext Transfer Protocol (`HTTP`)\
    \ and continue to process other data while waiting for the response. For example,\
    \ you can make calls to a server-side script to retrieve data from a database\
    \ as XML, send data to a server-side script to be stored in a database, or simply\
    \ load an XML file to populate pages of your website without refreshing the webpage.\
    \ The functionality available through the `jQuery` framework makes Ajax development\
    \ much easier than traditional JavaScript, by requiring less code and offering\
    \ additional methods and event handlers to cover any situation. The amount of\
    \ `jQuery` code needed to handle Ajax is minimal compared to traditional JavaScript,\
    \ even when developing complex functionality, which ultimately makes development\
    \ much faster.\n\nWith traditional JavaScript, Ajax requires a lot of redundant\
    \ code to form a request and handle the response because of all the variations\
    \ that are necessary for the different browsers. To make a request and handle\
    \ the response, you need to write code similar to the following:\n\n[Click here\
    \ to view code image](#images.html_p015pro01)\n\n```javascript\nif(window.XMLHttpRequest)\
    \ {\n    request = new XMLHttpRequest();\n}\nelse if(window.ActiveXObject) {\n\
    \    request = new ActiveXObject('MSXML2.XMLHTTP');\n}\n\nrequest.onreadystatechange\
    \ = onResponse;\nrequest.open('GET', 'url for request', true);\nrequest.send(null);\n\
    \nfunction checkReadyState(obj) {\n    if(obj.readyState == 0) { // Sending Request\
    \ }\n    if(obj.readyState == 1) { // Loading Response }\n    if(obj.readyState\
    \ == 2) { // Response Loaded }\n    if(obj.readyState == 3) { // Response Ready\
    \ }\n    if(obj.readyState == 4) {\n        if(obj.status == 200) {\n        \
    \    return true;\n        }\n        else if(obj.status == 404) {\n         \
    \   // File not found\n        }\n        else {\n            // There was a problem\
    \ retrieving the XML\n        }\n    }\n}\n\nfunction onResponse() {\n    if(checkReadyState(request))\
    \ {\n        // Handle the response with one of the following properties\n   \
    \     //alert(request.responseXML);\n        //alert(request.responseText);\n\
    \    }\n}\n```\n\n`jQuery` is accomplishing the same functionality as traditional\
    \ JavaScript, but you don’t have to worry about writing most of it. It’s not that\
    \ traditional JavaScript is hard to write; it’s just that there’s a lot to write\
    \ and it tends to get messy, especially when you compare it to how easy it is\
    \ to write a request and response with `jQuery`. The following is a sample Ajax\
    \ request using `jQuery`, which is very similar to the previous JavaScript example:\n\
    \n[Click here to view code image](#images.html_p016pro01)\n\n```javascript\njQuery.ajax({\n\
    \    url: 'url for request',\n    success: function(xml) {\n        // Parse the\
    \ response\n    }\n});\n```\n\nThis code uses the `jQuery` object’s `ajax` method,\
    \ includes a `url` property for the request, and handles a `success` callback\
    \ with an anonymous function. Many more properties can be used within the `jQuery`\
    \ object’s `ajax` method, such as the `type` of request, either `POST` or `GET`\
    \ (the default), a `username` and `password`, and `crossDomain`. However, this\
    \ example shows the `ajax` method in its most basic form to illustrate the simplicity\
    \ of `jQuery` Ajax calls.\n\nAjax is used in the `jQuery Mobile` framework to\
    \ handle page changes and to load or preload a page. The framework provides access\
    \ through the application programming interface (`API`) to handle this functionality,\
    \ and we’ll cover it in-depth later in this book.\n\n## Wrapping Up\n\n`jQuery`\
    \ has made user-interface enhancements far easier by simplifying JavaScript and\
    \ combining it with the syntax of `CSS`. The framework provides a way to write\
    \ less, spend less time testing, and achieve more complex results in less time.\
    \ `jQuery` lets you enhance webpages by easily adding custom interactions, as\
    \ well as custom effects to provide visual feedback to users, ultimately creating\
    \ a better user experience.\n\nThis book is not intended to teach the `jQuery`\
    \ framework, but this chapter reviewed concepts that are necessary to understand\
    \ and work with the `jQuery Mobile` framework. To learn more about the `jQuery`\
    \ framework, visit `jquery.com`.\n"
  raw: 'Ajax is an acronym for asynchronous JavaScript and XML. Asynchronous means
    that you can make a request to a server via Hypertext Transfer Protocol (HTTP)
    and continue to process other data while waiting for the response. For example,
    you can make calls to a server-side script to retrieve data from a database as
    XML, send data to a server-side script to be stored in a database, or simply load
    an XML file to populate pages of your website without refreshing the webpage.
    The functionality available through the jQuery framework makes Ajax development
    much easier than traditional JavaScript, by requiring less code and offering additional
    methods and event handlers to cover any situation. The amount of jQuery code needed
    to handle Ajax is minimal compared to traditional JavaScript, even when developing
    complex functionality, which ultimately makes development much faster.


    With traditional JavaScript, Ajax requires a lot of redundant code to form a request
    and handle the response because of all the variations that are necessary for the
    different browsers. To make a request and handle the response, you need to write
    code similar to the following:


    [Click here to view code image](#images.html_p015pro01)


    if(window.XMLHttpRequest) {


        request = new XMLHttpRequest();


    }


    else if(window.ActiveXObject) {


        request = new ActiveXObject(''MSXML2.XMLHTTP'');


    }


    request.onreadystatechange = onResponse;


    request.open(''GET'', ''url for request'', true);


    request.send(null);


    function checkReadyState(obj) {


        if(obj.readyState == 0) { // Sending Request }


        if(obj.readyState == 1) { // Loading Response }


        if(obj.readyState == 2) { // Response Loaded }


        if(obj.readyState == 3) { // Response Ready }


        if(obj.readyState == 4) {


            if(obj.status == 200) {


                return true;


            }


            else if(obj.status == 404) {


                // File not found


            }


            else {


                // There was a problem retrieving the XML


            }


        }


    }


    function onResponse() {


        if(checkReadyState(request)) {


            // Handle the response with one of the following properties


            //alert(request.responseXML);


            //alert(request.responseText);


        }


    }


    jQuery is accomplishing the same functionality as traditional JavaScript, but
    you don’t have to worry about writing most of it. It’s not that traditional JavaScript
    is hard to write; it’s just that there’s a lot to write and it tends to get messy,
    especially when you compare it to how easy it is to write a request and response
    with jQuery. The following is a sample Ajax request using jQuery, which is very
    similar to the previous JavaScript example:


    [Click here to view code image](#images.html_p016pro01)


    jQuery.ajax({


        url: ''url for request'',


        success: function(xml) {


            // Parse the response


        }


    });


    This code uses the jQuery object’s `ajax` method, includes a `url` property for
    the request, and handles a `success` callback with an anonymous function. Many
    more properties can be used within the jQuery object’s `ajax` method, such as
    the `type` of request, either POST or GET (the default), a `username` and `password`,
    and `crossDomain`. However, this example shows the `ajax` method in its most basic
    form to illustrate the simplicity of jQuery Ajax calls.


    Ajax is used in the jQuery Mobile framework to handle page changes and to load
    or preload a page. The framework provides access through the application programming
    interface (API) to handle this functionality, and we’ll cover it in-depth later
    in this book.


    ### Wrapping Up


    jQuery has made user-interface enhancements far easier by simplifying JavaScript
    and combining it with the syntax of CSS. The framework provides a way to write
    less, spend less time testing, and achieve more complex results in less time.
    jQuery lets you enhance webpages by easily adding custom interactions, as well
    as custom effects to provide visual feedback to users, ultimately creating a better
    user experience.


    This book is not intended to teach the jQuery framework, but this chapter reviewed
    concepts that are necessary to understand and work with the jQuery Mobile framework.
    To learn more about the jQuery framework, visit [jquery.com](http://jquery.com).
    The online documentation is very comprehensive and includes code samples, developer
    comments, and in-depth descriptions of the available objects, methods, events,
    and so on. You can also visit the jQuery forums at [forum.jquery.com](http://forum.jquery.com),
    where other developers are available to help with any coding questions you may
    have.


    ## 2\. The Role of HTML5


    As the starting point for all jQuery Mobile development, HTML5 plays a key role
    in the jQuery Mobile framework. HTML5 provides the gateway for everything from
    defining how your webpage renders in mobile, tablet, or desktop browsers to custom
    attributes that define widgets and themes and much more. This chapter provides
    an overview of how HTML5 is used and what features are utilized most by the jQuery
    Mobile framework.


    ### Semantic HTML5


    Accessibility is a major focus and priority of the jQuery Mobile framework. This
    is one reason why the framework is built on semantic HTML and why it’s available
    to the widest possible range of devices. The techniques that the framework uses
    to support A-grade browsers even provide access for users with screen readers
    such as VoiceOver for Apple iPhone.


    jQuery Mobile uses three levels to grade the support of the framework: A, B, and
    C. A is full; B is full, minus Ajax; and C is basic support.


    Standard, semantic HTML gives you the security of providing a mobile website that
    is accessible to the greatest range of users without having to do the testing
    yourself. This is the power of the jQuery Mobile framework.


    #### Creating an HTML5 template


    Creating a basic page template using HTML5 is incredibly easy. All you need to
    do is add the `<!DOCTYPE>` declaration followed by standard HTML, such as opening
    and closing `html`, `head`, `title,` and `body` elements. The declaration must
    be the first thing in your HTML5 document because it instructs the browser about
    what version of HTML is being used so it can interpret your markup.


    [Click here to view code image](#images.html_p020pro01)


    <!DOCTYPE html>


    <html>


        <head>


            <title>Page Title</title>


        </head>


    <body>


    </body>


    </html>


    The `<!DOCTYPE>` declaration is supported by all major browsers. It’s also much
    simpler to use than previous versions of HTML. HTML 4, for example, includes three
    different versions of the `<!DOCTYPE>` declaration and requires the document type
    definition (DTD) because it’s based on Standard Generalized Markup Language (SGML).


    ### The viewport Meta Tag


    The `viewport` meta tag was introduced by mobile Safari to let web developers
    control the size and scale of the viewport. Many other major mobile browsers now
    support this tag. It is used to set the browser’s layout viewport to improve the
    presentation of webpages. Mobile web browsers obviously have a much smaller screen
    size than desktop browsers and because of this they have a different layout viewport
    association. If you’ve ever viewed a desktop website on a mobile phone that isn’t
    using a viewport association that accommodates mobile devices, you’ve most likely
    noticed that the site looks similar to [Figure 2.1](#ch02.html_ch02fig01). Without
    the `viewport` tag, your webpage can appear small, or zoomed out, as any other
    webpage not built for mobile would display. The webpage can be very hard to read
    without zooming in.


    ![Image](graphics/jquery-2-1.jpg)


    Figure 2.1\. A website without the viewport association that best accommodates
    mobile devices.


    * * *


    ![Image](graphics/note.jpg) Note


    The iPhone screenshot used for [Figure 2.1](#ch02.html_ch02fig01) was captured
    in Mobilizer, a mobile preview tool from Springbox ([http://www.springbox.com/mobilizer/](http://www.springbox.com/mobilizer/)).


    * * *'
