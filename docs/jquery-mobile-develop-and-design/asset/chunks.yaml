    # 18. Testing with Simulators


    When it comes to testing mobile websites and applications, you have several options:
    You can use the browser on the desktop where you develop your markup and code,
    a mobile device, or a mobile simulator. Each has advantages and disadvantages.


    The single largest advantage to testing with a simulator is that you can get immediate
    feedback on the way your mobile site will look on a mobile device. This will help
    you tweak your layout and give you clues about how your page-to-page navigation
    will work.


    There’s a huge downside. The simulator interaction with your mobile website is
    drastically different from the interaction on a physical device. You’ll miss the
    touch-enabled features of the device. Your last line of testing should always
    be done on the kinds of devices you expect that your visitors will actually use.


    ## Exploring Your Testing Options


    If you test on the desktop, you can get immediate results. The downside is that,
    even resized, a desktop web browser won’t offer the same experience as a mobile
    device. For example, scroll bars are much wider and more intrusive on a desktop
    web browser. Using a desktop browser is good for immediate spot checks.


    Most mobile developers have two or three physical devices available for testing,
    but can’t afford to purchase more than that. One solution is “crowd testing,”
    where you ask your friends to access your website or application via their devices
    and give you feedback about any issues they find. Another solution is using remote
    labs. Testing in remote labs can be expensive, but it lets you test your sites
    in multiple devices from the comfort of your desk.


    Another option is using a mobile simulator. Mobile simulators are evolving and
    come in a couple of flavors: ones you work with online and ones you download and
    install on your desktop. Some simulators come with mobile development tool packages
    and software development kits (SDK). All typically offer the same sort of immediate
    feedback that testing on your desktop browser does. The downside is that you can’t
    interact with simulators using gestures available to you on many touch-enabled
    mobile devices, and sometimes a simulator may not be configured in a way that
    duplicates the mobile device’s browser and operating system.


    Let’s dig in and find some mobile simulators.


    ## Developing for the Mobile Web


    One of the most important questions you need to ask yourself is, who am I developing
    my mobile website for?


    Since you’re focused on developing websites and applications using `jQuery Mobile`,
    this chapter talks about simulators that deliver the proper experience in a full-fledged
    mobile web browser typically available on smart-phones and pads used by a great
    many mobile customers today.


    There are other simulators available for mobile devices that don’t deliver the
    same kind of experience you’d expect from a fully capable web browser. If you
    expect that your website visitor will be using these kinds of devices, I strongly
    recommend that you look into these simulators and learn how to use them as well.
    Developing for these devices may mean that you have to add code to redirect or
    strip down your site to accommodate these users.


    You should answer the question of who you’re designing your mobile website for
    at the outset of your planning process. Knowing your target audience and the devices
    you anticipate they use will make development and testing go much more smoothly.


    ## Finding Online Simulators


    Finding solid online mobile device simulators is akin to finding your prince (or
    princess). You have to kiss a lot of frogs first. Enter “mobile device simulator”
    into Google, and the results can be staggering and frustrating.


    You’ll need to take into account that most online simulators are affected by the
    browser you use to access the simulator. Most online simulators tend to inherit
    the characteristics of the parent browser and many do not present or honor attributes
    such as mobile user agent strings or visual elements present in mobile device
    browsers. We’ll talk more about those issues in the `[Using Simulators for Testing](#ch18.html_ch18lev1sec3)`
    section later in this chapter.


    Here are some of the better simulators you’ll find online:


    - **Cowemo at [www.mobilephoneemulator.com/](http://www.mobilephoneemulator.com/)**


    The great thing about this mobile emulator is that it offers several different
    smartphone layouts. The menu allows you to easily switch between mobile devices
    and orientation, as shown in `[Figure 18.1](#ch18.html_ch18fig01)`.


    ![Image](graphics/jquery-18-1.jpg)


    Figure 18.1\. The menu and choices available for the simulator at [mobilephoneemulator.com](http://mobilephoneemulator.com).


    The screen of the emulator is uncluttered (`[Figure 18.2](#ch18.html_ch18fig02)`),
    making it easy to work with your mobile site. The downside is that the browser
    inherits the user agent string from the parent browser, making it difficult to
    test actions that rely on specific mobile devices. Additionally, you can’t access
    sites that you may be working with locally (`localhost`); you must upload your
    sites to a server accessible from the web.


    ![Image](graphics/jquery-18-2.jpg)


    Figure 18.2\. The uncluttered layout of the website at [mobilephoneemulator.com](http://mobilephoneemulator.com).
    The user agent string inherited its attributes from the parent browser.


    If you’re testing layout, this is a great tool. You can switch between devices
    quickly. Devices are rendered with the proper screen width and height (there’s
    a mode to enlarge the screen size so you can attend to details), which makes it
    perfect for capturing screenshots of your sites on different devices.


    - **Opera Mini at [www.opera.com/developer/tools/mini/](http://www.opera.com/developer/tools/mini/)**


    Although Opera Mini may not be one of the most widely used browsers, a growing
    number of people choose to download it and use it instead of the browsers that
    come with their mobile devices. The online test site (`[Figure 18.3](#ch18.html_ch18fig03)`)
    is clean and easy to use.


    ![Image](graphics/jquery-18-3.jpg)


    Figure 18.3\. The Opera Mini simulator.


    Be aware of the way that Opera Mini interprets Cascading Style Sheets (`CSS`).
    Sometimes, more complex layouts aren’t rendered as you would expect. It does correctly
    report most user agent strings if you need those to be available when testing,
    and you must upload your sites to a web server to test.


    - **Mobile Websites 4U at [www.mobilewebsites4u.com/tester/](http://www.mobilewebsites4u.com/tester/)**


    This simulator is great, but it has some, such as offering only four screen layouts
    and inheriting the user agent string from the parent browser. It also uses a desktop
    browser scroll bar that may affect your site’s layout. Have a look at `[Figure
    18.4](#ch18.html_ch18fig04)`, and you’ll see how the scroll bar eats up some screen
    real estate.


    ![Image](graphics/jquery-18-4.jpg)


    Figure 18.4\. The desktop’s standard scroll bar is used in the Mobile Websites
    4U simulator rather than something befitting a mobile browser.


    One significant advantage is that you can test from your local machine without
    having to upload your site files to a web server. Having the ability to quickly
    check your layout is a real plus for any mobile device emulator.


    ## Using Simulators for Testing


    Now that you have some simulators in your toolbox, it’s time to incorporate them
    into your development workflow. Let’s start by testing in the online emulators.


    ### Testing with online emulators


    For most online emulators, all you’re required to do is upload your mobile site
    to a web server, navigate to the online emulator, and type the URL (many will
    require that you type the `http://` prefix to the URL) into the emulator’s address
    bar. If all is well, you’ll see your mobile site in the screen of the simulator.

