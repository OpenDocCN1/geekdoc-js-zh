  trans: "\n\n## 表 4.2. 禁用 Ajax 的链接类型\n\n![Image](img/04tab02.jpg)\n\n表 4.3 包含了在基础\
    \ HTML 超链接基础上添加特定属性的链接类型。\n\n### 表 4.3. 杂链接类型\n\n![Image](img/04tab03.jpg)\n\n\
    jQuery Mobile 框架使用了许多超链接属性对普通的 HTML 网页进行增强。这就是为什么 jQuery Mobile 比从零开始创建移动网站更有吸引力的另一个原因。它让你能够专注于重要的事情，而消除了在每次创建新的移动网站时都编写核心功能的需求。\n\
    \n以下示例展示了表中涵盖的几种链接类型。\n\n此网页提供了三种可以在 jQuery Mobile 中使用的链接类型示例：内部链接、外部链接以及一个禁用\
    \ Ajax 的链接：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta\
    \ http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    <title>Single-page\
    \ template - Page 1 - jQuery Mobile: Design and Develop</title>\n    <link rel=\"\
    stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body class=\"container\">\n    <div data-role=\"page\">\n\
    \        <div data-role=\"header\">\n            <h1>Page 1</h1>\n        </div>\n\
    \        <div data-role=\"content\">\n            <p><a href=\"single-page-2.html\"\
    >链接到页面 2</a>a></p>\n            <p><a href=\"single-page-2.html\" rel=\"external\"\
    >到页面 2 的外部链接</a>a></p>\n            <p><a href=\"single-page-2.html\" data-ajax=\"\
    false\">禁用 Ajax 的链接到页面 2</a>a></p>\n        </div>\n        <div data-role=\"\
    footer\">\n            Copyright\n        </div>\n    </div>\n</body>\n</html>\n\
    ```\n\n内部链接不需要特殊的标记，框架将在该处介入，并在当前页面与被链接的页面之间创建页面过渡。外部链接是需要 `rel` 属性的链接，该属性的值必须设置为\
    \ `external`。将超链接设置为外部链接会禁用 Ajax，将其从页面哈希历史记录（hashtag history）中移除，并在点击链接时刷新网页。禁用\
    \ Ajax 的链接需要一个值为 `false` 的 `data-ajax` 属性。这也会禁用 Ajax，将其从页面哈希历史记录中移除并刷新网页，与上一个示例相同，主要区别在于\
    \ `rel=\"external\"` 属性可以在 jQuery 的轻微帮助下，作为一种符合标准的方式来创建目标为新窗口的超链接。\n\n在接下来的示例中，有一个内部链接和一个充当返回按钮的超链接：\n\
    \n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1\">\n    <title>Single-page template\
    \ - Page 2 - jQuery Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\"\
    \ href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\" />\n\
    \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body class=\"container\">\n    <div data-role=\"page\">\n\
    \        <div data-role=\"header\">\n            <h1>Page 2</h1>\n        </div>\n\
    \        <div data-role=\"content\">\n            <p><a href=\"single-page.html\"\
    >到页面 1 的 Ajax 链接</a></p>\n            <p><a href=\"#\" data-rel=\"back\">返回按钮</a></p>\n\
    \        </div>\n        <div data-role=\"footer\">\n            Copyright\n \
    \       </div>\n    </div>\n</body>\n</html>\n```\n\n将 `data-rel` 属性设置为 `back`\
    \ 会创建一个像返回按钮的超链接。当点击此链接时，jQuery Mobile 框架会自动链接到历史记录中的上一个页面。\n\n### 预加载与缓存\n\n\
    在处理任何基于内容的操作时，页面缓存非常重要。缓存指的是收集文件的隐藏存储区域。默认情况下，浏览器通过将关联文件放在用户计算机的本地目录中来处理网页缓存，以便网页及其关联资源在访问时加载得更快。jQuery\
    \ Mobile 将这一概念进一步了一步：框架允许页面在被链接或在浏览器中显示之前就进行缓存。利用此功能就像使用一个名为 `data-prefetch` 的\
    \ HTML 属性一样简单。只需将其添加到网页中的任何超链接中，一旦网页加载，这些超链接指向的 URL 就会被预加载并缓存。下一行代码显示了如何向超链接添加此属性，以预加载并缓存其指向的页面：\n\
    \n点击此处查看代码图片\n\n```html\n<a href=\"page2.html\" data-prefetch>链接到页面 2</a>\n```\n\
    \n在网络浏览器中运行此示例时，请求会在页面加载时立即发出。图 4.2 显示了 Chrome 在页面加载时发出的 `XMLHttpRequest` 示例。\n\
    \n![Image](img/jquery-4-2.jpg)\n\n图 4.2. jQuery Mobile 使用 prefetch 属性预加载页面。\n\n\
    框架还提供了一种通过应用程序接口（API）处理页面预加载的方法。我们将在书后更具体地讨论 API，但了解如何访问它非常重要。\n\n![Image](img/note.jpg)\
    \ 注意：应用程序接口（API）允许多个软件之间进行通信。\n\n要通过程序化预加载页面，你首先需要访问 jQuery Mobile 对象：\n\n`.mobile`\n\
    \n一旦文档对象准备就绪，使用 `loadPage` 方法传递你想预加载的 URL，并为请求定义若干属性：\n\n点击此处查看代码图片\n\n```javascript\n\
    $(document).ready(function() {\n    $.mobile.loadPage( \"page2.html\", {\n   \
    \     type: false,\n        reloadPage: false,\n        type: 'get'\n    });\n\
    });\n```\n\n在 `loadPage` 方法中，你可以传递许多参数作为选项。表 4.4 列出了这些可选参数。\n\n表 4.4. loadPage\
    \ 可选参数\n\n![Image](img/04tab04.jpg)\n\n除了提供文件加载控制外，jQuery Mobile 框架还提供了在文档对象模型（DOM）中缓存的控制。就像预加载选项一样，你可以通过\
    \ HTML 属性或 jQuery Mobile API 定义是否应在 DOM 中缓存页面。以下示例显示了如何在 `page` 标签中使用该属性来缓存网页：\n\
    \n点击此处查看代码图片\n\n```html\n<div data-role=\"page\" data-dom-cache=\"true\">\n```\n\
    \n要使用 API 缓存网页，你可以设置所有页面默认缓存：\n\n```javascript\n$.mobile.page.prototype.options.domCache\
    \ = true;\n```\n\n或者，你可以独立地缓存页面。你可以这样缓存 id 为 `my-page` 的页面：\n\n```javascript\n\
    $('#my-page').page(true);\n```\n\n在处理单页模板时，jQuery Mobile 还会管理它预加载的页面，以防止 DOM 过大。如果许多页面保留在\
    \ DOM 中，浏览器的内存使用可能会失控，浏览器可能会变慢或崩溃。为了管理内存大小，框架会在访问者离开页面时，通过 `pagehide` 事件自动将 Ajax\
    \ 加载的页面从 DOM 中移除。你将在书的后部分学习更多关于这一点以及其他事件的内容。\n\n"
- fmt: "\nThere are a number of benefits to preloading and caching pages. They load\
    \ quicker and prevent the Ajax loading message from appearing when a visitor tries\
    \ to access the preloaded page. However, it’s important to keep in mind that each\
    \ preloaded page creates an additional HTTP request, which uses more bandwidth.\
    \ Therefore, it’s important to preload pages only when you think visitors are\
    \ likely to view a subsequent webpage.\n\n### Working with Page Transitions\n\n\
    A number of page transitions can be used with the jQuery Mobile framework. All\
    \ the page transitions are CSS-based effects. When using Ajax navigation, the\
    \ page transitions work between linked pages or form submissions. `[Table 4.5](#ch04.html_ch04tab05)`\
    \ lists the available page transitions in the framework.\n\nTable 4.5\\. Page\
    \ transitions\n\n![Image](graphics/04tab05.jpg)\n\n* *\n\n![Image](graphics/note.jpg)\
    \ Note\n\nUse the `flip` transition with caution, because it is supported only\
    \ by browsers that support 3D CSS transform rendering.\n\n* *\n\nEach of these\
    \ page transitions is easy to set up globally as a default using the `defaultPageTransition`\
    \ property. To set it up properly, it’s necessary to bind to the `mobileinit`\
    \ event, which is accessible through the API via the jQuery Mobile object:\n\n\
    [Click here to view code image](#images.html_p055pro01)\n\n```javascript\n$(document).bind(\"\
    mobileinit\", function() {\n    $.mobile.defaultPageTransition = 'fade';\n});\n\
    ```\n\nThe binding of the event handler needs to be executed before the jQuery\
    \ Mobile library loads. Therefore, in your HTML file, arrange your JavaScript\
    \ files in a specific order:\n\n[Click here to view code image](#images.html_p055pro02)\n\
    \n```html\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n<script src=\"assets/js/custom-jqm-transitions.js\"></script>\n<script\
    \ src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"></script>\n\
    ```\n\nThey can also be set on a per-link basis to override the default page transition.\
    \ This option is useful for a number of situations, such as creating pop-up windows\
    \ that use the `pop` transition:\n\n[Click here to view code image](#images.html_p056pro01)\n\
    \n```html\n<a href=\"popup.html\" data-transition=\"pop\">Pop-up</a>\n```\n\n\
    Or, form submissions that use the `flip` transition:\n\n[Click here to view code\
    \ image](#images.html_p056pro02)\n\n```html\n<form action=\"\" method=\"get\"\
    \ data-transition=\"flip\">\n    <input type=\"text\" name=\"name\">\n    <input\
    \ type=\"submit\" value=\"Submit\">\n</form>\n```\n\nIt’s even possible to set\
    \ the page transition to `none` to disable the page transition for a particular\
    \ hyperlink or form submission:\n\n[Click here to view code image](#images.html_p056pro03)\n\
    \n```html\n<form action=\"\" method=\"get\" data-transition=\"none\">\n    <input\
    \ type=\"text\" name=\"name\">\n    <input type=\"submit\" value=\"Submit\">\n\
    </form>\n```\n\njQuery also creates a reverse transition by automatically applying\
    \ the same page transition when the back button is pressed.\n\nThe complete example\
    \ code for the global and individual page transitions looks like the following:\n\
    \n[Click here to view code image](#images.html_p056pro04)\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html;\
    \ charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n    <title>Page Transitions - jQuery Mobile: Design and\
    \ Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"assets/js/custom-jqm-transitions.js\"></script>\n\
    \    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body class=\"container\">\n    <div data-role=\"page\">\n\
    \        <div data-role=\"header\"><h1>Page Name</h1></div>\n        <div data-role=\"\
    content\">\n            <p><a href=\"popup.html\" data-transition=\"pop\">Pop-up</a></p>\n\
    \            <form action=\"\" method=\"get\" data-transition=\"flip\">\n    \
    \            <input type=\"text\" name=\"name\">\n                <input type=\"\
    submit\" value=\"Submit\">\n            </form>\n        </div>\n    </div>\n\
    </body>\n</html>\n```\n"
  raw: 'There are a number of benefits to preloading and caching pages. They load
    quicker and prevent the Ajax loading message from appearing when a visitor tries
    to access the preloaded page. However, it’s important to keep in mind that each
    preloaded page creates an additional HTTP request, which uses more bandwidth.
    Therefore, it’s important to preload pages only when you think visitors are likely
    to view a subsequent webpage.


    ### Working with Page Transitions


    A number of page transitions can be used with the jQuery Mobile framework. All
    the page transitions are CSS-based effects. When using Ajax navigation, the page
    transitions work between linked pages or form submissions. **[Table 4.5](#ch04.html_ch04tab05)**
    lists the available page transitions in the framework.


    Table 4.5\. Page transitions


    ![Image](graphics/04tab05.jpg)


    * * *


    ![Image](graphics/note.jpg) Note


    Use the flip transition with caution, because it is supported only by browsers
    that support 3D CSS transform rendering.


    * * *


    Each of these page transitions is easy to set up globally as a default using the
    `defaultPageTransition` property. To set it up properly, it’s necessary to bind
    to the `mobileinit` event, which is accessible through the API via the jQuery
    Mobile object:


    [Click here to view code image](#images.html_p055pro01)


    $(document).bind("mobileinit", function() {


        $.mobile.defaultPageTransition = ''fade'';


    });


    The binding of the event handler needs to be executed before the jQuery Mobile
    library loads. Therefore, in your HTML file, arrange your JavaScript files in
    a specific order:


    [Click here to view code image](#images.html_p055pro02)


    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


    <script src="assets/js/custom-jqm-transitions.js"></script>


    <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


    They can also be set on a per-link basis to override the default page transition.
    This option is useful for a number of situations, such as creating pop-up windows
    that use the `pop` transition:


    [Click here to view code image](#images.html_p056pro01)


    <a href="popup.html" data-transition="pop">Pop-up</a>


    Or, form submissions that use the `flip` transition:


    [Click here to view code image](#images.html_p056pro02)


    <form action="" method="get" data-transition="flip">


        <input type="text" name="name">


        <input type="submit" value="Submit">


    </form>


    It’s even possible to set the page transition to none to disable the page transition
    for a particular hyperlink or form submission:


    [Click here to view code image](#images.html_p056pro03)


    <form action="" method="get" data-transition="none">


        <input type="text" name="name">


        <input type="submit" value="Submit">


    </form>


    jQuery also creates a reverse transition by automatically applying the same page
    transition when the back button is pressed.


    The complete example code for the global and individual page transitions looks
    like the following:


    [Click here to view code image](#images.html_p056pro04)


    <!DOCTYPE html>


    <html>


    <head>


       <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


       <meta name="viewport" content="width=device-width, initial-scale=1">


       <title>Page Transitions - jQuery Mobile: Design and Develop</title>


       <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


       <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


       <script src="assets/js/custom-jqm-transitions.js"></script>


       <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


    </head>


    <body class="container">


        <div data-role="page">


            <div data-role="header"><h1>Page Name</h1></div>


            <div data-role="content">


                <p><a href="popup.html" data-transition="pop">Pop-up</a></p>


                <form action="" method="get" data-transition="flip">


                    <input type="text" name="name">


                    <input type="submit" value="Submit">


                </form>


            </div>


            <div data-role="footer">Copyright</div>


        </div>


    </body>


    </html>


    Beginning with the head of the document, you can see that the jQuery library is
    loaded first, then the custom JavaScript where the `mobileinit` event from our
    previous example is bound and the default page transition is set. Last, but not
    least, the jQuery Mobile library is loaded. Within the page there’s a hyperlink
    that has a `pop` transition applied and a form that has a `flip` transition applied.


    ### Customizing Loading Messages


    When pages are loading, a default message appears if there’s a delay or if the
    page is not yet preloaded. The jQuery Mobile framework allows you to customize
    this message and a page-error loading message.


    You can customize the loading message through the `loadingMessage` property. Set
    `loadingMessage` to any custom string by binding to the `mobileinit` event, which
    jQuery Mobile fires as soon as the document loads.


    [Click here to view code image](#images.html_p058pro01)


    $(document).bind("mobileinit", function() {


        $.mobile.loadingMessage = ''Please wait'';


    });


    This code will display a loading message that says “Please wait.” The default
    message used for page loading is “Loading.” The property can also be set to `false`
    to display no message at all:


    [Click here to view code image](#images.html_p058pro02)


    $(document).bind("mobileinit", function() {


        $.mobile.loadingMessage = false;


    });


    When there is an error loading a page, jQuery Mobile displays a message that can
    also be customized through the API. The default message for page-load errors is
    “Error Loading Page.” You can set the `pageLoadErrorMessage` property to any custom
    string as the error message:


    [Click here to view code image](#images.html_p058pro03)


    $(document).bind("mobileinit", function() {


        $.mobile.pageLoadErrorMessage = ''There was an error, please try again.'';


    });


    ### Wrapping Up


    Working with pages is easy with jQuery Mobile: all you really need to know is
    basic HTML and a few mobile-related attributes. With most of the heavy lifting
    being done by the framework, it’s easy to focus on the results of the website
    you’re building. Understanding the internal functionality behind how pages work
    in jQuery Mobile is what begins to set you up for writing custom functionality.
    Customizing specific functionality in the messaging and behind the scenes helps
    to personalize your website. The level of customization that jQuery Mobile provides
    can be very useful in making a website more user-friendly. Visual indicators,
    like custom loading messages and page transitions, set expectations for visitors
    and provide them with a frame of reference, so they know when certain things are
    happening. Preloading and caching improves usability by speeding up page loads
    and giving visitors what they want when they want it. jQuery Mobile provides fine-grained
    control to enhance mobile websites in a custom way.


    ## 5\. Dialog Windows and Buttons


    No mobile website or application is complete without dialog windows, pop-ups,
    and buttons to provide feedback and options to users. The jQuery Mobile framework
    lets you create all of these with the addition of a simple `data-rel` attribute.


    ### Creating a Basic Dialog Window


    Creating a basic dialog window is easy with jQuery Mobile. Just use the `data-rel`
    attribute on any anchor tag and set its value to `dialog`:


    data-rel="dialog"'
