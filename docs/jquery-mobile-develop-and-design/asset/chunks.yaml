  trans: "\n\nAjax 是异步 JavaScript 和 XML（asynchronous JavaScript and XML）的缩写。异步意味着你可以通过超文本传输协议（`HTTP`）向服务器发送请求，并在等待响应的同时处理其他数据。例如，你可以调用服务器端脚本以\
    \ XML 格式从数据库检索数据，将数据发送到服务器端脚本存储在数据库中，或者简单地加载 XML 文件以在不刷新网页的情况下填充网站页面。通过 `jQuery`\
    \ 框架提供的功能使得 Ajax 开发比传统的 JavaScript 简单得多，因为它需要更少的代码，并提供了额外的方法和事件处理器来涵盖任何情况。与传统的\
    \ JavaScript 相比，即使在开发复杂功能时，处理 Ajax 所需的 `jQuery` 代码极少，这最终加快了开发速度。\n\n使用传统的 JavaScript，由于不同浏览器之间存在各种差异，Ajax\
    \ 需要大量的冗余代码来构建请求和处理响应。要发送请求并处理响应，你需要编写类似以下的代码：\n\n点击此处查看代码图像\n\n```javascript\n\
    if(window.XMLHttpRequest) {\n    request = new XMLHttpRequest();\n}\nelse if(window.ActiveXObject)\
    \ {\n    request = new ActiveXObject('MSXML2.XMLHTTP');\n}\n\nrequest.onreadystatechange\
    \ = onResponse;\nrequest.open('GET', 'url for request', true);\nrequest.send(null);\n\
    \nfunction checkReadyState(obj) {\n    if(obj.readyState == 0) { // Sending Request\
    \ }\n    if(obj.readyState == 1) { // Loading Response }\n    if(obj.readyState\
    \ == 2) { // Response Loaded }\n    if(obj.readyState == 3) { // Response Ready\
    \ }\n    if(obj.readyState == 4) {\n        if(obj.status == 200) {\n        \
    \    return true;\n        }\n        else if(obj.status == 404) {\n         \
    \   // File not found\n        }\n        else {\n            // There was a problem\
    \ retrieving the XML\n        }\n    }\n}\n\nfunction onResponse() {\n    if(checkReadyState(request))\
    \ {\n        // Handle the response with one of the following properties\n   \
    \     //alert(request.responseXML);\n        //alert(request.responseText);\n\
    \    }\n}\n```\n\n`jQuery` 实现了与传统的 JavaScript 相同的功能，但你无需担心编写其大部分代码。这并不是说 JavaScript\
    \ 难以编写，而是要写的内容太多，而且往往会变得混乱，尤其是当你将其与使用 `jQuery` 编写请求和响应的简单程度进行比较时。以下是一个使用 `jQuery`\
    \ 的 Ajax 请求示例，与之前的 JavaScript 示例非常相似：\n\n点击此处查看代码图像\n\n```javascript\njQuery.ajax({\n\
    \    url: 'url for request',\n    success: function(xml) {\n        // Parse the\
    \ response\n    }\n});\n```\n\n此代码使用了 `jQuery` 对象的 `ajax` 方法，包含用于请求的 `url` 属性，并使用匿名函数处理\
    \ `success` 回调。在 `jQuery` 对象的 `ajax` 方法中可以使用许多更多属性，例如请求的 `type`（`POST` 或默认的 `GET`）、`username`\
    \ 和 `password` 以及 `crossDomain`。然而，这个示例展示了 `ajax` 方法的最基本形式，以说明 `jQuery` Ajax 调用的用的性。\n\
    \nAjax 在 `jQuery Mobile` 框架中用于处理页面更改以及加载或预加载页面。该框架通过应用程序编程接口（`API`）提供处理此类功能的访问，我们将在本书的后续部分详细介绍。\n\
    \n## 总结\n\n`jQuery` 通过简化 JavaScript 并将其与 `CSS` 语法结合，使用户界面增强变得更加容易。该框架提供了一种编写更少代码、花费更少测试时间并在更时间内实现更复杂结果的方法。`jQuery`\
    \ 让你通过轻松添加自定义交互以及自定义效果为用户提供视觉反馈，从而增强网页，最终创造出更好的用户体验。\n\n本书并非教授 `jQuery` 框架，但本章回顾了理解和使用\
    \ `jQuery Mobile` 框架所必需的概念。要了解更多关于 `jQuery` 框架的信息，请访问 jquery.com。\n\n"
- fmt: "\nYou can include the `viewport` meta tag in a separate mobile website that\
    \ accommodates the smaller browser display, but this is often beyond many companies’\
    \ capabilities, because it adds time and cost. Plus, the management of two separate\
    \ websites is often too much to handle. Currently, the standard option for rendering\
    \ your website properly is to use the `viewport` meta tag. This tag tells the\
    \ browser to optimize your website based on the best width for viewing it in that\
    \ browser. To use the `viewport` meta tag to set the display, set the `name` of\
    \ the meta tag to `viewport`, then use the `content` attribute to set properties\
    \ and values that meet your needs. Within the `content` attribute, you can define\
    \ the properties and values you want to set for the layout. To add multiple properties\
    \ to a `viewport` meta tag, you need to create a comma-delimited list of property\
    \ and value sets. Here’s the most common setup for the `viewport` meta tag in\
    \ mobile development:\n\n[Click here to view code image](#images.html_p022pro01)\n\
    \n```html\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n```\n\nTo include this tag in your HTML5 template, add it within the `head`\
    \ element:\n\n[Click here to view code image](#images.html_p022pro02)\n\n```html\n\
    <!DOCTYPE html>\n<html>\n    <head>\n        <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n        <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n        <title>Page Title</title>\n  \
    \  </head>\n<body>\n\n</body>\n</html>\n```\n\nThe most important property to\
    \ to set is the `width`, which should be set to `device-width` for mobile websites.\
    \ The second property is `initial-scale`, which defines the state of the website\
    \ when it first loads, after which users can zoom in or out. For example, if you\
    \ were to set the `initial-scale` to 2, rather than 1, by default the website\
    \ would be scaled by 2 (that is, 2 would be used as the multiplier for scaling).\
    \ [Table 2.1](#ch02.html_ch02tab01) describes these and other meta `viewport`\
    \ properties in more detail.\n\nTable 2.1. Meta viewport properties\n\n![Image](graphics/02tab01.jpg)\n\
    \nWhen designing or developing for mobile websites, it’s important to understand\
    \ how your content will display on different devices. Remember that handheld devices\
    \ come in many shapes and sizes and that there are both portrait and landscape\
    \ modes to contend with. I always consider using CSS and/or `viewport` properties\
    \ to create scalable layouts. However, by using the `viewport` meta tag code from\
    \ the code example along with the jQuery Mobile framework, you can be assured\
    \ that your website will render as accurately as possible on a wide range of devices.\n\
    \n### Understanding data-Attributes\n\nHTML5 `data-` attributes let you store\
    \ custom data that’s unseen by the user. In other words, the data is not rendered\
    \ or even used by the browser. With previous versions of HTML, custom data is\
    \ often stored in `title`, `rel`, `class`, or `id` attributes, or in hidden HTML\
    \ elements. The data stored in these attributes is accessible to JavaScript. There\
    \ are many reasons why access to custom data is useful via JavaScript; it can\
    \ be used behind the scenes to create custom functionality or displayed to the\
    \ user when a specific interaction occurs. A good example of using custom data\
    \ in a webpage is in an image gallery: A title and a description can be added\
    \ to an image and then used by JavaScript to display information about the image\
    \ that the user is viewing. The bottom line is that this is a misuse of these\
    \ HTML attributes, but until now it has been the only way to handle certain functionality\
    \ that is otherwise unsupported. Luckily, developers can start using HTML attributes\
    \ appropriately with the support of `data-` attributes.\n\nRather than having\
    \ to use attributes with other predetermined uses, you can now create custom `data-`\
    \ attributes that are more relevant to your data and still render valid HTML.\
    \ The HTML5 specification supports any attribute that begins with `data-` as a\
    \ data storage area. Any name you want to append to the `data-` prefix will be\
    \ supported. For example, if you add custom `data-` attributes to an image tag\
    \ that belongs to an image gallery, you can add custom `data-title` and `data-description`\
    \ attributes and give them any custom value.\n\n[Click here to view code image](#images.html_p024pro01)\n\
    \n```html\n<img src=\"image-path/img.jpg\" data-title=\"My image title\" data-description=\"\
    My image description\">\n```\n\n![Image](graphics/note.jpg) Note\n\nThe only restrictions\
    \ on creating custom `data-` attributes are that the custom portion of the attribute\
    \ must be at least one character long and cannot contain uppercase letters.\n\n\
    The attribute value can be any string, and as always, you need to escape any double\
    \ quotes within your strings.\n\nKeep in mind the possibility of potential name\
    \ clashing. As `data-` attributes become more widespread, it’s likely that JavaScript\
    \ libraries will be looking for attributes with similar names, especially if generic\
    \ attribute names are used, such as `data-description`. A good solution to this\
    \ problem is to use a custom namespace within the name of the `data-` attribute.\
    \ For example, if you’re developing a website for `jquerymobile`, you could use\
    \ `data-jquerytv-`:\n\n```text\ndata-jquerytv-\n```\n\nAs `data-` attributes become\
    \ more widespread, it’s likely that JavaScript libraries will be looking for attributes\
    \ with similar names, especially if generic attribute names are used, such as\
    \ `data-description`. A good solution to this problem is to use a custom namespace\
    \ within the name of the `data-` attribute. For example, if you’re developing\
    \ a website for `jquerymobile`, you could use `data-jquerytv-`:\n\n```text\ndata-jquerytv-\n\
    ```\n\nIf you do not use a custom namespace, the result won’t include a dash between\
    \ your namespace and the value, so your `data-` attributes will be hard to read,\
    \ and jQuery Mobile will look for an attribute like this:\n\n```text\ndata-jquerytvfoo\n\
    ```\n\nThe jQuery Mobile framework uses a number of `data-` attributes for widgets\
    \ and theming. These attributes are listed in Table 2.2.\n\nThe framework itself\
    \ allows you to define a custom namespace using a global option in the configuration\
    \ called `ns`. The `ns` option can be set to any custom value, such as `jquerymobile-`.\
    \ If you do use a custom namespace, it’s best to use a dash at the end:\n\n```text\n\
    jquerymobile-\n```\n\nBe aware that choosing a custom namespace requires you to\
    \ commit to that namespace during coding. For example, when defining a jQuery\
    \ Mobile header you would normally use:\n\n```html\ndata-role=\"header\"\n```\n\
    \nTo add this attribute to your HTML5 template you could simply add a `div` that\
    \ includes the attribute:\n\n```html\n<!DOCTYPE html>\n<html>\n    <head>\n  \
    \      <title>Page Title</title>\n        <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n    </head>\n<body>\n    <div data-role=\"header\">\n  \
    \      <h1>Header</h1>\n    </div>\n</body>\n</html>\n```\n\nHowever, if you define\
    \ a custom namespace in the configuration, you’ll need to define your header as:\n\
    \n```html\ndata-jquerymobiletv-role=\"header\"\n```\n\nWe’ll talk about configuration\
    \ options, including the `ns` option, in more detail later in the book.\n\nWith\
    \ the introduction of `data-` attributes, developers have much more control over\
    \ the data that is added to a webpage. Custom attributes provide a means to support\
    \ semantic HTML while enhancing the webpage with front-end scripting languages,\
    \ such as JavaScript.\n\n### Wrapping Up\n"
  raw: 'You can include the `viewport` meta tag in a separate mobile website that
    accommodates the smaller browser display, but this is often beyond many companies’
    capabilities, because it adds time and cost. Plus, the management of two separate
    websites is often too much to handle. Currently, the standard option for rendering
    your website properly is to use the `viewport` meta tag. This tag tells the browser
    to optimize your website based on the best width for viewing it in that browser.
    To use the `viewport` meta tag to set the display, set the `name` of the meta
    tag to `viewport`, then use the `content` attribute to set properties and values
    that meet your needs. Within the `content` attribute, you can define the properties
    and values you want to set for the layout. To add multiple properties to a `viewport`
    meta tag, you need to create a comma-delimited list of property and value sets.
    Here’s the most common setup for the `viewport` meta tag in mobile development:


    [Click here to view code image](#images.html_p022pro01)


    <meta name="viewport" content="width=device-width, initial-scale=1">


    To include this tag in your HTML5 template, add it within the `head` element:


    [Click here to view code image](#images.html_p022pro02)


    <!DOCTYPE html>


    <html>


        <head>


            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


            <meta name="viewport" content="width=device-width, initial-scale=1">


            <title>Page Title</title>


        </head>


    <body>


    </body>


    </html>


    The most important property to set is the `width`, which should be set to `device-width`
    for mobile websites. The second property is `initial-scale`, which defines the
    state of the website when it first loads, after which users can zoom in or out.
    For example, if you were to set the `initial-scale` to 2, rather than 1, by default
    the website would be scaled by 2 (that is, 2 would be used as the multiplier for
    scaling). **[Table 2.1](#ch02.html_ch02tab01)** describes these and other meta
    `viewport` properties in more detail.


    Table 2.1\. Meta viewport properties


    ![Image](graphics/02tab01.jpg)


    When designing or developing for mobile websites, it’s important to understand
    how your content will display on different devices. Remember that handheld devices
    come in many shapes and sizes and that there are both portrait and landscape modes
    to contend with. I always consider using CSS and/or `viewport` properties to create
    scalable layouts. However, by using the `viewport` meta tag code from the code
    example along with the jQuery Mobile framework, you can be assured that your website
    will render as accurately as possible on a wide range of devices.


    ### Understanding data- Attributes


    HTML5 `data-` attributes let you store custom data that’s unseen by the user.
    In other words, the data is not rendered or even used by the browser. With previous
    versions of HTML, custom data is often stored in `title`, `rel`, `class`, or `id`
    attributes, or in hidden HTML elements. The data stored in these attributes is
    accessible to JavaScript. There are many reasons why access to custom data is
    useful via JavaScript; it can be used behind the scenes to create custom functionality
    or displayed to the user when a specific interaction occurs. A good example of
    using custom data in a webpage is in an image gallery: A title and a description
    can be added to an image and then used by JavaScript to display information about
    the image that the user is viewing. The bottom line is that this is a misuse of
    these HTML attributes, but until now it has been the only way to handle certain
    functionality that is otherwise unsupported. Luckily, developers can start using
    HTML attributes appropriately with the support of `data-` attributes.


    Rather than having to use attributes with other predetermined uses, you can now
    create custom `data-` attributes that are more relevant to your data and still
    render valid HTML. The HTML5 specification supports any attribute that begins
    with `data-` as a data storage area. Any name you want to append to the `data-`
    prefix will be supported. For example, if you add custom `data-` attributes to
    an image tag that belongs to an image gallery, you can add custom `data-title`
    and `data-description` attributes and give them any custom value.


    [Click here to view code image](#images.html_p024pro01)


    <img src="image-path/img.jpg" data-title="My image title" data-description="My
    image description">


    * * *


    ![Image](graphics/note.jpg) Note


    The only restrictions on creating custom `data-` attributes are that the custom
    portion of the attribute must be at least one character long and cannot contain
    uppercase letters.


    * * *


    The attribute value can be any string, and as always, you need to escape any double
    quotes within your strings.


    Keep in mind the possibility of potential name clashing. As `data-` attributes
    become more widespread, it’s likely that JavaScript libraries will be looking
    for attributes with similar names, especially if generic attribute names are used,
    such as `data-description`. A good solution to this problem is to use a custom
    namespace within the name of the `data-` attribute. For example, if you’re developing
    a website for `jquerymobile.tv`, you could use `jquerymobiletv` as your namespace
    in the `data-` attribute:


    data-jquerymobiletv-foo


    Not only does this prevent potential name clashing, it also personalizes the code
    and makes it specific to your website or application.


    The jQuery Mobile framework uses a number of custom `data-` attributes for widgets
    and theming. These attributes are used during initialization and configuration.
    Two common `data-` attributes are listed in [Table 2.2](#ch02.html_ch02tab02).


    Table 2.2\. Common data- attributes in jQuery Mobile


    ![Image](graphics/02tab02.jpg)


    Later in this book we’ll take an in-depth look at theming and using `data-theme`
    attributes with jQuery Mobile. We’ll also cover more `data-` attributes associated
    with the various widgets provided by the framework.


    The framework itself allows you to define a custom namespace using a global option
    in the configuration called `ns` (namespace). The `ns` option can be set to any
    custom value, such as `jquerymobiletv-`. If you do use a custom namespace, it’s
    best to use a dash at the end:


    data-jquerymobiletv-foo


    Otherwise, the result won’t include a dash between your namespace and the custom
    `data-` value, so your `data-` attributes will be hard to read, and jQuery Mobile
    will look for an attribute that looks like the following example:


    data-jquerymobiletvfoo


    Be aware that choosing a custom namespace requires you to commit to that namespace
    during coding. For example, when defining a jQuery Mobile header you would normally
    use:


    data-role="header"


    To add this attribute to your HTML5 template you could simply add a `div` that
    includes the attribute:


    [Click here to view code image](#images.html_p026pro01)


    <!DOCTYPE html>


    <html>


        <head>


            <title>Page Title</title>


            <meta name="viewport" content="width=device-width, initial-scale=1">


        </head>


    <body>


        <div data-role="header">


            <h1>Header</h1>


        </div>


    </body>


    </html>


    However, if you define a custom namespace in the configuration, you’ll need to
    define your header as:


    data-jquerymobiletv-role="header"


    We’ll talk about configuration options, including the `ns` option, in more detail
    later in the book.


    With the introduction of `data-` attributes, developers have much more control
    over the data that is added to a webpage. Custom attributes provide a means to
    support semantic HTML while enhancing the webpage with front-end scripting languages,
    such as JavaScript.


    ### Wrapping Up'
