    ### Wrapping Up


    jQuery Mobile themes are easy to use and powerful at the same time. Every component
    can be themed, and when prebuilt swatches are not enough, you can always go custom.
    Between the ThemeRoller and the ability to manually edit existing classes, you
    should be well on your way to creating your own custom themes.


    # Part III: The Mobile API


    ## 12\. Global Options


    On the surface, the jQuery Mobile framework offers a quick and easy way to create
    mobile websites. However, the framework also has an application programming interface
    (API) that can be used to extend the basic functionality. The jQuery Mobile API
    provides an extra level of control over the customization of your mobile website.
    Everything from the custom setup of global options to hooking into interaction
    events and working with exposed methods is possible with the API. By the end of
    this chapter, you’ll know how to define custom options for your mobile website
    and how to write custom code that interacts with the jQuery Mobile framework.


    ### Extending the mobileinit Event


    As introduced earlier, jQuery Mobile includes an initialization event, named `mobileinit`,
    that loads before jQuery’s `document.ready` event loads. This lets you override
    and extend jQuery Mobile’s default global options, which is where all customization
    begins.


    To extend the `mobileinit` event you need to order your JavaScript files correctly.
    Your custom JavaScript event handler must be included before jQuery Mobile is
    loaded and after the jQuery framework has loaded:


    [Click here to view code image](#images.html_p176pro01)


    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


    <script src="assets/js/custom-jqm.js"></script>


    <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


    To extend the `mobileinit` event you must first bind an anonymous callback function
    to it, so you execute your custom code when the event fires:


    [Click here to view code image](#images.html_p176pro02)


    $(document).bind("mobileinit", function() {


        // Override global options here


    });


    Once you’ve successfully bound a callback function to the `mobileinit` event,
    you can easily override the global options. The `$.mobile` object is the starting
    point for setting all properties. This is where you’ll override global options
    that affect the way your mobile website functions. To override the global options,
    you can use jQuery’s `extend` method to extend the `$.mobile` object:


    [Click here to view code image](#images.html_p177pro01)


    $(document).bind("mobileinit", function() {


        $.extend( $.mobile, {


            property: value


        });


    });


    Or, you can simply override individual properties by setting them directly using
    the `$.mobile` object:


    [Click here to view code image](#images.html_p177pro02)


    $(document).bind("mobileinit", function() {


        $.mobile.property = value;


        // Set other properties


    });


    If you want to update multiple properties, the `extend` method is a cleaner option
    because you don’t need to write the `$.mobile` object multiple times. However,
    if you have only one property to update, setting the property individually requires
    less code.


    ### Creating Custom Namespaces


    The HTML5 `data-` attributes, such as `data-role`, can be customized through namespaces.
    A namespace lets you add a custom name that appears between the `data-` and `-role`
    portion of the `data-role` attribute, for example. This property can be useful
    for customizing your code. It can also prevent name collisions in the future as
    more third-party plug-ins are developed and possibly included in your project.
    The `$.mobile` property for customizing the namespace is `ns`:


    [Click here to view code image](#images.html_p178pro01)


    $(document).bind("mobileinit", function() {


        $.mobile.ns = "jquerymobiletv-";


    });


    You can set the `ns` option to any custom value, such as `jquerymobiletv-.` Using
    the custom namespace produces:


    data-jquerymobiletv-foo


    Notice that a dash has been included at the end of the namespace; without it the
    result won’t include a dash in your namespace, so your `data-` attributes will
    be hard to read and jQuery Mobile will look for an attribute that looks like this:


    data-jquerymobiletvfoo


    Be aware that choosing a custom namespace requires you to commit to that namespace
    while coding. During coding you’ll include this custom namespace in your markup
    for any `data-` attributes that you use. Again, this not only customizes your
    markup, it can also prevent name collisions in the future if third-party plug-ins
    are used. Here’s an example showing a custom `jquerymobiletv-` namespace:


    [Click here to view code image](#images.html_p178pro02)


    <!DOCTYPE html>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>Custom Namespace - jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


    </head>


    <body>'
