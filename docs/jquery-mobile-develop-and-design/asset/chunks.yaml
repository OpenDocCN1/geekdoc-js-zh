    的信息，请访问 `phonegap.com`。jQuery Mobile 的在线文档中甚至有一个关于它的章节。有了这些可能性，你不再需要为原生应用编写多个版本。这使得原生应用开发变得不再那么吸引人，因为你为
    iPhone 开发的应用程序需要为 Android、BlackBerry、Windows Mobile 等其他平台完全重新开发。哦，别忘记每个新版本都需要为这些不同的平台进行更新。jQuery
    Mobile 框架通过让你通过浏览器浏览器即可访问 Web 应用程序和网站，消除了下载和安装移动应用的需求，提供了可以与原生应用开发竞争的移动 Web 体验。


    ## 本书适用读者

    本书适用于具有基础 HTML 经验并兴趣使用 jQuery Mobile 框架创建移动网站的人。


    ## 本书不适用读者

    本书不适用于从未创建过网页的人。


    ## 你将如何学习

    在本书中，你将通过实践来学习。每一章都包含示例代码和描述，帮助你深入理解其工作原理。你也可以在书籍的网站上找到代码示例（[www.peachpit.com/jquerymobile](http://www.peachpit.com/jquerymobile)）。


    ## 你将学习到什么

    本书将教你从创建页面的基础知识到自定义主题，再到使用 `WordPress` 和 `Drupal` 开发你自己的 jQuery Mobile 内容管理系统的的一切。当你读完这本书时，你将成为一名
    jQuery Mobile 专家。


    ## 结语

    jQuery Mobile 框架是一个强大的框架，受到了移动行业领导者的支持。它可以轻松地添加到现有网站中，创建一个不仅支持触摸，而且在大多数主流移动平台上支持并无残障人士访问的移动
    Web 体验。通过该框架易用的功能和内置的渐进式增强技术，设计控制、页面过渡、组件集成、脚本、API 访问等许多功能都触手可及。


    ## 支持的 jQuery Mobile 平台

    jQuery Mobile 框架支持大多数现代桌面、智能手机、平板电脑和电子阅读器平台。与其花费时间在测试多个设备上，你大可以从从开始就为许多平台提供支持。这是因为
    jQuery Mobile 平台采用了渐进式增强方法，这不仅为设备带来了丰富的交互体验，还为旧版浏览器和手机提供了支持。当浏览器无法识别某些特定的 HTML5
    代码时，该网页将渲染为简单但功能完备的网页。旧手机或浏览器用户习惯于有限的 Web 体验，因此这种方法在这种情况下仍然会渲染出一个合格的基础 HTML 网页。


    目前，`Android` 和 `Apple iOS` 是领先的移动操作系统。`Android` 拥有最大的操作系统市场份额（44.2%），而 `Apple`
    在美国拥有最大的手机市场份额（28.6%）。`Windows`、`BlackBerry`、`SymbianOS` 和 `Palm/HP webOS` 操作系统占据了剩余的大部分智能手机市场份额（图
    1）。所有这些平台/操作系统都得到了 jQuery Mobile 框架的支持。


    ![Image](img/jquery-opener-1.jpg)


    图 1. 2011 年操作系统市场份额。


    ### 主要平台

    以下列表提供了有关受 jQuery Mobile 框架完全支持的主要平台的更多信息。


    ![Image](img/jquery-opener-2.jpg)


    ### IOS

    `iOS` 是苹果的移动操作系统。它最初为 `iPhone` 开发，现已扩展到支持其他苹果设备，如 `iPod Touch`、`iPad` 和 `Apple
    TV`。`iOS` 使用 `Safari` 作为其 浏览器。


    ![Image](img/jquery-opener-3.jpg)


    ### ANDROID

    `Android` 是由 `Google` 领导的开源软件项目和操作系统。自根据 `Apache` 许可证发布以来，它已用于大量的手机、平板电脑和其他设备。`Android`
    使用 `Google Chrome` 作为其 浏览器。


    ![Image](img/jquery-opener-4.jpg)


    ### WINDOWS PHONE

    `Windows Phone` 是微软的移动操作系统。该系统与第三方以及微软服务集成。`Windows Phone` 使用 `Internet Explorer
    Mobile` 作为其 浏览器。


    ![Image](img/jquery-opener-5.jpg)


    ### BLACKBERRY

    `BlackBerry` 由一种专有的移动操作系统驱动，在其自己的智能手机和平板电脑上提供。


    ![Image](img/jquery-opener-6.jpg)


    ### WEBOS

    `webOS` 是 Palm 设备使用的开源操作系统。`webOS` 在其浏览器中使用 `WebKit` 布局引擎，简单名为 `Web`。


    ### 分级支持

    jQuery Mobile 使用三级列表列出框架支持的平台。级别分为 `A`、`B` 和 `C`。`A` 包含完整的体验，并可以选择基于 `Ajax` 的页面过渡；`B`
    包含相同的体验，但不包含 `Ajax` 的页面过渡；而 `C` 是基础但功能完备的 HTML 体验。


    `A` 级支持之前提到的所有主要移动操作系统以及，包括 `Apple iOS`、`Android`、`Windows Phone`、`BlackBerry`、`Palm/HP
    webOS`、`Kindle 3`、`Kindle Fire` 等。`B` 级支持包括 `BlackBerry 5`、`Opera Mini` 和 `Nokia
    SymbianOS`。`C` 级支持包括 `BlackBerry 4`、`Windows Mobile` 以及所有旧款智能手机和功能手机。此列表不断演进；要查看最新列表，请访问
    [jquerymobile.com](http://jquerymobile.com)。


    # 第一部分：jQuery Mobile 基础


    ## 1. 理解 jQuery

    jQuery 框架是 jQuery Mobile 框架的骨干，因此在开发 jQuery Mobile 网站之前，了解 jQuery 框架的基础知识会有帮助。虽然不是必须的，但理解
    jQuery 将使使用 jQuery Mobile 变得更加简单，特别是如果你对编写任何自定义功能感兴趣的话。


    `jQuery` 是一个强大且轻量级的 JavaScript 库，简化了 JavaScript 代码并扩展了层级样式表（CSS）的功能。此外，它消除了跨浏览器兼容性问题并符合
    CSS3 标准。这意味着脚本更快、测试更少，针对不同浏览器处理某些功能编写的代码也更少。`jQuery` 框架是 Web 开发应该有的典范：你每次都能得到你所期望的结果。


    ### 开始学习


