    With the database set up, visit the site and complete the installation process
    by adding a site title and creating an admin user ([Figure 15.3](#ch15.html_ch15fig03))).
    Remember the password you use when creating this account, because you’ll need
    it when you’re finished with the installation.


    ![Image](graphics/jquery-15-3.jpg)


    Figure 15.3\. The WordPress installation process.


    That’s it! With WordPress installed, you can now log in to the WordPress administration
    area using the username and password you just entered. Within the administration
    area, you can completely manage your website. For example, you can create webpages,
    blog posts, and users, as well as install plug-ins and themes. With that said,
    now it’s time to set up the `jQuery Mobile` theme for our sample website.


    ### Creating the jQuery Mobile Theme


    Adding a theme to WordPress is super easy. All you need to do is download, buy,
    or create a theme, and then upload it to the `/wp-content/themes/` directory within
    your WordPress site. Once there, you need to activate the theme and voilà, you’re
    finished. The following example uses a `jQuery Mobile` theme from Francis Robert,
    a freelance web programmer who has the most functional `jQuery Mobile` WordPress
    theme I’ve found to date. You can find it in the WordPress category of his blog
    at [http://frobert.com](http://frobert.com). (Thanks, Francis! It’s great to see
    developers sharing great things with each other.)


    Once you’ve downloaded the `jQuery Mobile` theme, you can upload it to the `/wp-content/themes/`
    directory, as mentioned previously. After uploading the theme, log in to the WordPress
    administration area and visit the `Appearance > Themes` page from the left sidebar.
    Once there, select the `Activate` link under the `jQuery Mobile` theme ([Figure
    15.4](#ch15.html_ch15fig04))).


    ![Image](graphics/jquery-15-4.jpg)


    Figure 15.4\. Activating the jQuery Mobile WordPress theme.


    Once activated, the WordPress website includes the `jQuery Mobile` theme, which
    defaults to the prebuilt “a” theme. To change this, you can visit the `Appearance
    > Editor` page from the left sidebar in the WordPress administration area. In
    the right sidebar of the Editor page, there’s a file named `preferences.php`.
    Click this file name and it will load into the text area in the center of the
    page. You can edit this file and save your changes. [Figure 15.5](#ch15.html_ch15fig05)]
    shows what Edit mode looks like for the `jQuery Mobile` theme in the WordPress
    administration area. Editing the `$jqtheme` value assigns the appropriate `jQuery
    Mobile` theme and changes the look of the website.


    ![Image](graphics/jquery-15-5.jpg)


    Figure 15.5\. (Left) Configuring the jQuery Mobile WordPress theme.


    Once installed, activated, and configured, the `jQuery Mobile` theme automatically
    converts the front-end of your WordPress website into a `jQuery Mobile` WordPress
    website. [Figure 15.6](#ch15.html_ch15fig06)] shows an example of the default
    WordPress installation with Francis Robert’s `jQuery Mobile` theme. This is very
    powerful stuff.


    ![Image](graphics/jquery-15-6.jpg)


    Figure 15.6\. (Right) A default WordPress installation with Francis Robert’s jQuery
    Mobile WordPress theme.


    [Figure 15.6](#ch15.html_ch15fig06) also illustrates the sequence that occurs
    when a visitor selects a linked list item from the home page. The home page includes
    a default blog post that’s titled “Hello world!” By selecting this post as a linked
    list item, the page transitions to the blog post, where the full description and
    comments can be read; it’s even possible to post comments from this page.


    ### Adding Blog Posts and Pages


    To create more pages and blog posts, you simply need to log in to the WordPress
    administration area. Once logged in, you can manage all of your content from the
    navigation in the left sidebar. To create a new blog post, select `Posts > Add
    New` ([Figure 15.7](#ch15.html_ch15fig07))).


    ![Image](graphics/jquery-15-7.jpg)


    Figure 15.7\. (Left) Creating a new blog post.


    From this webpage you can add a title and a description, and choose a category
    and tags. You can save the blog post as a draft or publish it by clicking the
    blue `Publish` button in the top-right module. Once published, you can view the
    blog post by visiting the home page of your WordPress website ([Figure 15.8](#ch15.html_ch15fig08))).


    ![Image](graphics/jquery-15-8.jpg)


    Figure 15.8\. (Right) Viewing a new blog post.


    To create a webpage in WordPress visit `Pages > Add New` in the left sidebar ([Figure
    15.9](#ch15.html_ch15fig09))). Just like a blog post you can add a title and description,
    but with pages you can also select the parent page and set the order of the page
    as it will appear in the main menu of the website. Once you’ve finished, publish
    the webpage by clicking the blue `Publish` button in the top right module.


    ![Image](graphics/jquery-15-9.jpg)


    Figure 15.9\. (Left) Creating a new webpage.


    When the new page is published, it appears in the main menu at the top of the
    website ([Figure 15.10](#ch15.html_ch15fig10))).


    ![Image](graphics/jquery-15-10.jpg)


    Figure 15.10\. (Right) Viewing a new webpage.


    By default, the blog posts are listed on the front page by date. To change what’s
    displayed on the front page, visit `Settings > Reading`, and set the front page
    to an actual webpage and the blog posts to a specific webpage that will act as
    the blog portion of the website. In this case, the page titled Blog is used ([Figure
    15.11](#ch15.html_ch15fig11))).


    ![Image](graphics/jquery-15-11.jpg)


    Figure 15.11\. (Left) Setting the home and blog pages.


    Once complete, the page titled Home will be the front page and the page titled
    Blog will be the page where the blog posts are listed ([Figure 15.12](#ch15.html_ch15fig12))).


    ![Image](graphics/jquery-15-12.jpg)


    Figure 15.12\. (Right) The final WordPress Mobile website.


    ## 16. Installing a Mobile Drupal Theme


    Drupal is another content management system (CMS) that powers millions of websites
    and applications. As with WordPress, you can build blogs, websites, and even enterprise
    applications by adding your own customizations or by incorporating modules and
    themes from the Drupal community. This chapter shows you where and how to install
    Drupal on a web server, then explains where to get the `jQuery Mobile` Drupal
    theme and module, how to install them, and how to create new pages.


    ### Getting Started


    To get started with Drupal you must first visit the website at [www.drupal.org](http://www.drupal.org)
    and download the core. The core includes the files needed to run Drupal on a web
    server. If you don’t have a web server of your own, any of the options mentioned
    in Chapter 15](#ch15.html_ch15), “[Installing a Mobile WordPress Theme](#ch15.html_ch15),”
    will work. This includes the web hosts listed on [http://wordpress.org/hosting/](http://wordpress.org/hosting/)
    or any web host of your choice. Again, as with WordPress, the only caveat is that
    your web server needs to have PHP and MySQL in order to run Drupal.


    #### Installing Drupal

