    ### Wrapping Up


    Who would have thought that setting up a mobile content management system would
    be so easy? Using WordPress and the jQuery Mobile theme discussed in this chapter,
    you can have a mobile CMS up and running in no time. The fun part is customizing
    it using the techniques learned throughout this book. WordPress lets you alter
    theme files to create further customizations. You can literally start editing
    the theme files and making updates that will affect how your site renders. You
    can also add custom HTML to your WordPress pages, which can include the widgets
    covered in this book, such as linked lists, collapsible content, and so on.


