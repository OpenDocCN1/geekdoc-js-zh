    \ [`regexpal.com`](http://regexpal.com) 工具来测试你的正则表达式，它看起来会像图 17.2。\n\n![Image](img/jquery-17-2.jpg)\n\
    \n图 17.2。正则表达式出现在上方窗格中，而下方窗格高亮了在用户代理字符串中找到的匹配。\n\n现在你已经知道如何测试特定的移动设备，你可以在你的网站中构建功能，允许为这些设备提供自定义信息和交互。这是一个\
    \ JavaScript `switch` 语句的示例，说明了如何编写此类代码：\n\n点击此处查看代码图像\n\n```javascript\nvar mobile_device\
    \ = navigator.userAgent;\n\nswitch(true) {\n    case /(iPad)|(iPod)|(iPhone)/i.test(mobile_device):\n\
    \        // 这些设备的代码\n        break;\n\n    case /(android)/i.test(mobile_device):\n\
    \        // 该设备的代码\n        break;\n\n    default:\n        // 其他设备的代码\n     \
    \   break;\n}\n```\n\n请记住，正则表达式的测试在处理性能上可能是昂贵的，所以不要沉迷于大量的测试。\n\n![Image](img/note.jpg)\
