  trans: "\n\n预加载和缓存页面有很多益处。它们加载速度更快，并且可以防止访问者尝试访问预加载页面时出现 Ajax 加载提示。然而，重要的是，每个预加载的页面都会创建一个额外的\
    \ HTTP 请求，这会消耗更多带宽。因此，只有在你认为访问者可能会查看后续网页时，才对页面进行预加载。\n\n### 使用页面过渡\n\njQuery Mobile\
    \ 框架可以使用多种页面过渡。所有的页面过渡都是基于 CSS 的效果。在使用 Ajax 导航时，页面过渡发生在链接页面或表单提交之间。表 4.5 列出了框架中可用的页面过渡。\n\
    \n表 4.5 页面过渡\n\n![Image](img/04tab05.jpg)\n\n使用 `flip` 过渡时要小心，因为只有支持 3D CSS 变换渲染的浏览器才支持它。\n\
    \n* 这些页面过渡中的每一个都可以使用 `defaultPageTransition` 属性全局地设置为默认值。要正确设置它，必须绑定到 `mobileinit`\
    \ 事件，可以通过 jQuery Mobile  API 访问该事件：\n\n点击此处查看代码图片\n\n```javascript\n$(document).bind(\"\
    mobileinit\", function() {\n    $.mobile.defaultPageTransition = 'fade';\n});\n\
    ```\n\n事件处理器的绑定需要在 jQuery Mobile 库加载之前执行。因此，在你的 HTML 文件中，请按特定顺序安排 JavaScript 文件：\n\
    \n点击此处查看代码图片\n\n```html\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n<script src=\"assets/js/custom-jqm-transitions.js\"></script>\n<script\
    \ src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"></script>\n\
    ```\n\n也可以基于单个链接进行设置，以覆盖默认页面过渡。此选项在许多情况下非常有用，例如创建一个使用 `pop` 过渡的弹出窗口：\n\n点击此处查看代码图片\n\
    \n```html\n<a href=\"popup.html\" data-transition=\"pop\">Pop-up</a>\n```\n\n\
    或者，使用 `flip` 过渡的表单提交：\n\n点击此处查看代码图片\n\n```html\n<form action=\"\" method=\"get\"\
    \ data-transition=\"flip\">\n    <input type=\"text\" name=\"name\">\n    <input\
    \ type=\"submit\" value=\"Submit\">\n</form>\n```\n\n甚至可以将页面过渡设置为 `none`，以禁用特定超链接或表单提交的页面过渡：\n\
    \n点击此处查看代码图片\n\n```html\n<form action=\"\" method=\"get\" data-transition=\"none\"\
    >\n    <input type=\"text\" name=\"name\">\n    <input type=\"submit\" value=\"\
    Submit\">\n</form>\n```\n\njQuery 会在按下返回键时自动应用相同的页面过渡，从而创建一个反向过渡。\n\n全局和单个页面过渡的完整示例代码如下：\n\
    \n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1\">\n    <title>Page Transitions\
    \ - jQuery Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"\
    http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\" />\n    <script\
    \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"></script>\n\
    \    <script src=\"assets/js/custom-jqm-transitions.js\"></script>\n    <script\
    \ src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"></script>\n\
    </head>\n<body class=\"container\">\n    <div data-role=\"page\">\n        <div\
    \ data-role=\"header\"><h1>Page Name</h1></div>\n        <div data-role=\"content\"\
    >\n            <p><a href=\"popup.html\" data-transition=\"pop\">Pop-up</a></p>\n\
    \            <form action=\"\" method=\"get\" data-transition=\"flip\">\n    \
    \            <input type=\"text\" name=\"name\">\n                <input type=\"\
    submit\" value=\"Submit\">\n            </form>\n        </div>\n    </div>\n\
    </body>\n</html>\n```\n\n"
- fmt: "\nDialog windows can be included with a page or pages in a single HTML file\
    \ just like a multipage template, or they can be external webpages like a single-page\
    \ template. To create a multipage template that includes a dialog window, you\
    \ simply add another jQuery Mobile page—the difference is in how you link to it.\
    \ In other words, any page can be a dialog window; what makes it a dialog is the\
    \ way it’s opened. The following example shows a hyperlink with a `data-rel` attribute,\
    \ which opens a page in a dialog window:\n\n[Click here to view code image](#images.html_p062pro01)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>Dialog - jQuery Mobile: Design\
    \ and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\"><h1>Dialog Test</h1></div>\n        <div data-role=\"content\">\n   \
    \         <p><a href=\"#multipage-dialog\" data-rel=\"dialog\">Open Multi-page\
    \ Dialog</a></p>\n        </div>\n        <div data-role=\"footer\">Copyright</div>\n\
    \    </div>\n    <div data-role=\"page\" id=\"multipage-dialog\">\n        <div\
    \ data-role=\"header\"><h1>Multi-page dialog window</h1></div>\n        <div data-role=\"\
    content\">\n            <p><a href=\"dialog.html\" data-rel=\"back\">OK</a></p>\n\
    \        </div>\n    </div>\n</body>\n</html>\n```\n\nIn this example, there are\
    \ two pages: the first page is displayed by default. Within this default page\
    \ there’s a hyperlink that has a `data-rel=\"dialog\"` and a link to an anchor.\
    \ The anchor that’s being linked to is the ID of the second page. The second page\
    \ is set up like any jQuery Mobile page: it’s opened as a dialog because of the\
    \ way it’s linked to. [Figure 5.1](#ch05.html_ch05fig01) shows the result of this\
    \ code.\n\n![Image](graphics/05fig01.jpg)\n\nFigure 5.1. A multipage dialog window.\n\
    \nAs mentioned, dialog windows can also be external webpages that are linked to\
    \ via a hyperlink with a `data-rel=\"dialog\"` attribute and value. The following\
    \ example is very similar to the previous one, with the main difference being\
    \ that the hyperlink is now pointing to an external HTML file called `dialog-window.html`:\n\
    \n[Click here to view code image](#images.html_p064pro01)\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html;\
    \ charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n    <title>Dialog - jQuery Mobile: Design and Develop</title>\n\
    \    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\"><h1>Dialog Test</h1></div>\n        <div data-role=\"content\">\n   \
    \         <p><a href=\"dialog-window.html\" data-rel=\"dialog\">Open Dialog</a></p>\n\
    \        </div>\n        <div data-role=\"footer\">Copyright</div>\n    </div>\n\
    </body>\n</html>\n```\n\nThe HTML file that’s being linked can be set up like\
    \ any jQuery Mobile:\n\n[Click here to view code image](#images.html_p065pro01)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <title>Dialog - jQuery Mobile: Design\
    \ and Develop</title>\n</head>\n<body>\n    <div data-role=\"page\">\n       \
    \ <div data-role=\"header\"><h1>Single-page window</h1></div>\n        <div data-role=\"\
    content\">\n            <p><a href=\"#\" data-rel=\"back\">OK</a></p>\n      \
    \  </div>\n    </div>\n</body>\n</html>\n```\n\nThe result of this code looks\
    \ like [Figure 5.2](#ch05.html_ch05fig02).\n\n![Image](graphics/05fig02.jpg)\n\
    \nFigure 5.2. A single-page dialog window.\n\njQuery Mobile dialogs can also be\
    \ used as pop-up windows. Rather than loading a dialog that typically provides\
    \ or asks for feedback, the dialog can be another webpage that includes copy,\
    \ media, and so on. In the following example, the dialog is used to open a video\
    \ in a pop-up window:\n\n[Click here to view code image](#images.html_p066pro01)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>Pop-up - jQuery Mobile: Design\
    \ and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n    <style type=\"text/css\">\n        .ui-dialog .ui-header,\n  \
    \      .ui-dialog .ui-content,\n        .ui-dialog .ui-footer {\n            max-width:\
    \ 640px;\n        }\n    </style>\n</head>\n<body>\n    <div data-role=\"page\"\
    >\n        <div data-role=\"header\"><h1>Pop-up Test</h1></div>\n        <div\
    \ data-role=\"content\">\n            <p>President Barack Obama's Inaugural Address</p>\n\
    \            <p><a href=\"popup-window.html\" data-rel=\"dialog\">Play now &gt;</a></p>\n\
    \        </div>\n        <div data-role=\"footer\">Copyright</div>\n    </div>\n\
    </body>\n</html>\n```\n\nDialog windows have predefined width, but these can be\
    \ overwritten via the `.ui-dialog` classes. The HTML file that’s being loaded\
    \ as a pop-up includes a video of President Obama’s address. Since the width of\
    \ a mobile device can be much smaller than 640 pixels, the width for the iframe\
    \ in the pop-up window has been set to 100%.\n\n[Click here to view code image](#images.html_p067pro01)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <title>Pop-up - jQuery Mobile: Design\
    \ and Develop</title>\n</head>\n<body>\n    <div data-role=\"page\">\n       \
    \ <div data-role=\"header\"><h1>President Barack Obama's Inaugural Address</h1></div>\n\
    \        <div data-role=\"content\">\n            <iframe width=\"100%\" height=\"\
    360\" src=\"http://www.youtube.com/embed/3PuHGKnNY\" frameborder=\"0\" allowfullscreen></iframe>\n\
    \        </div>\n    </div>\n</body>\n</html>\n```\n\nBy default, the dialog (or\
    \ pop-up) window includes a Close button, so you don’t need to add any other hyperlinks\
    \ or functionality to the dialog window. [Figure 5.3](#ch05.html_ch05fig03) shows\
    \ an example of the video pop-up window with President Obama’s address.\n\nDialog\
    \ windows also include transitions. The default transition is `pop`, but this\
    \ transition can be changed to `flip` or `slidedown`. To change the transition,\
    \ add the `data-transition` attribute to the hyperlink that includes the `data-rel=\"\
    dialog\"` setting. If we were to add a `slidedown` `data-transition` to the previous\
    \ example, the code would look like this:\n\n```html\n<a href=\"popup-window.html\"\
    \ data-rel=\"dialog\" data-transition=\"slidedown\">Play now &gt;</a>\n```\n\n\
    ### Working with Buttons\n"
  raw: 'Dialog windows can be included with a page or pages in a single HTML file
    just like a multipage template, or they can be external webpages like a single-page
    template. To create a multipage template that includes a dialog window, you simply
    add another jQuery Mobile page—the difference is in how you link to it. In other
    words, any page can be a dialog window; what makes it a dialog is the way it’s
    opened. The following example shows a hyperlink with a `data-rel` attribute, which
    opens a page in a dialog window:


    [Click here to view code image](#images.html_p062pro01)


    <!DOCTYPE html>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>Dialog - jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


    </head>


    <body>


        <div data-role="page">


                <div data-role="header"><h1>Dialog Test</h1></div>


                <div data-role="content">


                        <p><a href="#multipage-dialog" data-rel="dialog">Open Multi-page
    Dialog</a></p>


                </div>


            <div data-role="footer">Copyright</div>


        </div>


        <div data-role="page" id="multipage-dialog">


                <div data-role="header"><h1>Multi-page dialog window</h1></div>


                <div data-role="content">


                    <p><a href="dialog.html" data-rel="back">OK</a></p>


                </div>


        </div>


    </body>


    </html>


    In this example, there are two pages: the first page is displayed by default.
    Within this default page there’s a hyperlink that has a `data-rel="dialog"` and
    a link to an anchor. The anchor that’s being linked to is the ID of the second
    page. The second page is set up like any jQuery Mobile page: it’s opened as a
    dialog because of the way it’s linked to. **[Figure 5.1](#ch05.html_ch05fig01)**
    shows the result of this code.


    ![Image](graphics/05fig01.jpg)


    Figure 5.1\. A multipage dialog window.


    As mentioned, dialog windows can also be external webpages that are linked to
    via a hyperlink with a `data-rel="dialog"` attribute and value. The following
    example is very similar to the previous one, with the main difference being that
    the hyperlink is now pointing to an external HTML file called dialog-window.html:


    [Click here to view code image](#images.html_p064pro01)


    <!DOCTYPE html>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>Dialog - jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


    </head>


    <body>


        <div data-role="page">


                <div data-role="header"><h1>Dialog Test</h1></div>


                <div data-role="content">


                    <p><a href="dialog-window.html" data-rel="dialog">Open External
    Dialog</a></p>


                </div>


            <div data-role="footer">Copyright</div>


        </div>


    </body>


    </html>


    The HTML file that’s being linked to can be set up like any jQuery Mobile webpage:


    [Click here to view code image](#images.html_p065pro01)


    <!DOCTYPE html>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <title>Dialog - jQuery Mobile: Design and Develop</title>


    </head>


    <body>


        <div data-role="page">


                <div data-role="header"><h1>Single-page dialog window</h1></div>


            <div data-role="content">


                <p><a href="#" data-rel="back">OK</a></p>


            </div>


        </div>


    </body>


    </html>


    The result of this code looks like **[Figure 5.2](#ch05.html_ch05fig02)**.


    ![Image](graphics/05fig02.jpg)


    Figure 5.2\. A single-page dialog window.


    jQuery Mobile dialogs can also be used as pop-up windows. Rather than loading
    a dialog that typically provides or asks for feedback, the dialog can be another
    webpage that includes copy, media, and so on. In the following example, the dialog
    is used to open a YouTube video in a pop-up window:


    [Click here to view code image](#images.html_p066pro01)


    <!DOCTYPE html>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>Pop-up - jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


        <style type="text/css">


            .ui-dialog .ui-header,


            .ui-dialog .ui-content,


            .ui-dialog .ui-footer {


                max-width: 640px;


            }


        </style>


    </head>


    <body>


        <div data-role="page">


            <div data-role="header"><h1>Pop-up Test</h1></div>


            <div data-role="content">


                <p>President Barack Obama''s Inaugural Address</p>


                <p><a href="popup-window.html" data-rel="dialog">Play now &gt;</a></p>


            </div>


            <div data-role="footer">Copyright</div>


        </div>


    </body>


    </html>


    Dialog windows have a predefined width, but these can be overwritten via the `.ui-dialog`
    classes. The HTML file in this example that’s being loaded as a pop-up window
    includes a YouTube video of President Obama’s inaugural address. Since the video
    is 640 × 360 pixels, the `max-width` has been set to 640\. However, since the
    width of a mobile device can be much smaller than 640 pixels, the width for the
    video iFrame in the pop-up window has been set to 100%. This allows the video
    to fill the width of the pop-up window regardless of the size, with a `max-width`
    of 640 pixels:


    [Click here to view code image](#images.html_p067pro01)


    <!DOCTYPE html>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <title>Pop-up - jQuery Mobile: Design and Develop</title>


    </head>


    <body>


        <div data-role="page">


            <div data-role="header"><h1>President Barack Obama''s Inaugural Address</h1></div>


            <div data-role="content">


                <iframe width="100%" height="360" src="http://www.youtube.com/embed/3PuHGKnboNY"
    frameborder="0" allowfullscreen></iframe>


            </div>


        </div>


    </body>


    </html>


    By default, the dialog (or pop-up) window includes a Close button, so you don’t
    need to add any other hyperlinks or functionality to the dialog window. **[Figure
    5.3](#ch05.html_ch05fig03)** shows an example of the video pop-up window with
    President Obama’s inaugural address.


    ![Image](graphics/05fig03.jpg)


    Figure 5.3\. A custom pop-up window with video.


    Dialog windows also include transitions. The default transition is `pop`, but
    this transition can be changed to `flip` or `slidedown`. To change the transition,
    add the `data-transition` attribute to the hyperlink that includes the `data-rel="dialog"`
    setting. If we were to add a `slidedown` `data-transition` to the previous example,
    the code would look like this:


    [Click here to view code image](#images.html_p068pro01)


    <a href="popup-window.html" data-rel="dialog" data-transition="slidedown">Play
    now &gt;</a>


    ### Working with Buttons'
