  raw: 'There are two ways to structure webpages for jQuery Mobile. The first is to
    incorporate all the pages within the same file; the second is to create separate
    files, like a typical website. To create multiple pages within a single HTML file,
    you can delineate multiple `page` `data-roles`, which allows each `page` `data-role`
    to contain its own header, content, footer, and so on. The following example gives
    you a basic idea of how to create a multipage jQuery Mobile website in a single
    HTML file:


    [Click here to view code image](#images.html_p034pro01)


    <!DOCTYPE html>


    <html>


        <head>


            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


            <meta name="viewport" content="width=device-width, initial-scale=1">


            <title>Page Title</title>


            <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css"
    />


            <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


            <script src="http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js"></script>


        </head>


    <body>


        <div data-role="page" id="page-one">


            <div data-role="header">


                <h1>Page 1</h1>


            </div>


            <div data-role="content">Body copy for page 1</div>


            <div data-role="footer">Copyright</div>


        </div>


        <div data-role="page" id="page-two">


            <div data-role="header">


                <h1>Page 2</h1>


            </div>


            <div data-role="content">Body copy for page 2</div>


            <div data-role="footer">Copyright</div>


        </div>


    </body>


    </html>


    This approach is not recommended, because files structured this way usually become
    harder to manage and are much larger in file size, so they ultimately will take
    longer to load. For demos or prototypes, this may be an option, but it is strongly
    recommended that you build your mobile websites or applications as separate HTML
    files.


    When using separate HTML files for your webpages, the `page` `data-role` is used
    as a container that the framework loads other webpages into. For example, let’s
    say you have two separate HTML files, `page-1.html` and `page-2.html`. Then you
    add the `page` `data-role` attribute to both files and hyperlink `page-1.html`
    to `page-2.html`:


    [Click here to view code image](#images.html_p035pro01)


    <!DOCTYPE HTML>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>Page 1 - jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/ jquery.min.js"></script>


        <script src="http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js"></script>


    </head>


    <body>


        <div data-role="page">


            <div data-role="header">


                <h1>Page 1 Title</h1>


            </div>


            <div data-role="content">


                <a href="page-2.html">Link to page 2</a>


            </div>


            <div data-role="footer">


                Copyright


            </div>


        </div>


    </body>


    </html>


    With the jQuery Mobile framework included, the `page` `data-role` of `page-1.html`
    will automatically become the container to load the markup within the `page` `data-role`
    of `page-2.html` using an XMLHttpRequest. The XMLHttpRequest is what Ajax uses
    to exchange data with the server without refreshing the webpage; it’s sort of
    like a portal to the backend. **[Figure 3.2](#ch03.html_ch03fig02)** shows an
    example of the XMLHttpRequest that is made when `page-1.html` links to `page-2.html`.
    The request was logged using Chrome Developer Tools. Chrome Developer Tools were
    used in this case to see that the XMLHttpRequest was made by jQuery Mobile when
    the link to `page-2.html` was clicked. Chrome Developer Tools provide a great
    way to test and debug code.


    ![Image](graphics/jquery-3-2.jpg)


    Figure 3.2\. jQuery Mobile uses an XMLHttpRequest to load subsequent pages.


    * * *


    ![Image](graphics/note.jpg) Note


    Chrome Developer Tools are an integrated web development environment built in
    to the Chrome browser.


    * * *


    The HTML page itself is requested and jQuery Mobile uses its contents to display
    the new page. There’s a lot to learn about this simple request, and we’ll cover
    it in more detail in the coming chapters.


    ### Wrapping Up


    Creating pages and including the jQuery Mobile framework is incredibly easy; the
    depth of the framework shines through when we uncover the details that make this
    framework so robust. As you’ve learned, `data-` attributes provide a way to store
    custom data that is unseen by the user, but the data remains accessible to JavaScript
    and, ultimately, to jQuery. This is why `data-` attributes play a large role in
    jQuery Mobile. The framework uses these attributes to transform basic HTML elements
    that use them as stylized widgets. We’ve only scratched the surface of pages and
    toolbars, and there are still many other components to discuss. With this basic
    information under your belt, it’s time to jump in and see what jQuery Mobile has
    to offer.


    # Part II: UI Components


    ## 4\. Creating Multipage Websites


    Now that we’ve covered the basics of structuring mobile webpages, we’ll take a
    deeper look and get a better understanding of the functionality behind them. As
    mentioned in [Chapter 3](#ch03.html_ch03), “[Getting Started with jQuery Mobile](#ch03.html_ch03),”
    there are two ways to structure webpages for jQuery Mobile: incorporate all the
    pages in the same file, or create separate files for each page like a typical
    website. Understanding the different page template types is the foundation for
    customizing a number of different page-related functionalities. In addition to
    learning about the page template types, you’ll also see how to preload and cache
    pages, work with different page transitions, and customize loading messages. You’ll
    learn to create custom functionality to take your pages to the next level.


    ### Multipage Template


    Internal linking occurs automatically when you have multiple jQuery Mobile pages
    in the same HTML file. As you’ve learned, jQuery Mobile pages are defined by adding
    a `data-role` with a value of `page` to an HTML element and anything within that
    page becomes relative to that page. In jQuery Mobile, typical separate webpages
    are considered *single-page* templates, while webpages that contain multiple pages
    are considered *multipage* templates. Let’s refer back to our multipage template
    example from the previous chapter (with a few small additions):


    [Click here to view code image](#images.html_p042pro01)


    <!DOCTYPE html>


    <html>


        <head>


            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


            <meta name="viewport" content="width=device-width, initial-scale=1">


            <title>Multipage template - jQuery Mobile: Design and Develop</title>


            <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


            <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


            <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


    </script>


            <script type="text/javascript" src="assets/js/ui.js">


    </script>


        </head>


    <body class="container">


        <div data-role="page" id="page-one" data-title="Page 1">


            <div data-role="header">


                <h1>Page 1</h1>


            </div>


            <div data-role="content">


                <p>Body copy for page 1</p>


                <p><a href="#page-two">Link to page 2</a></p>


            </div>


            <div data-role="footer">


                Copyright


            </div>


        </div>


        <div data-role="page" id="page-two" data-title="Page 2">


            <div data-role="header">


                <h1>Page 2</h1>


            </div>


            <div data-role="content">


                <p>Body copy for page 2</p>'
