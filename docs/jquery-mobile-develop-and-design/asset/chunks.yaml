    The result of this code will look similar to **[Figure 7.2](#ch07.html_ch07fig02)**.


    ![Image](graphics/jquery-7-2.jpg)


    Figure 7.2\. Multiple grids with different column amounts.


    On their own, columns are pretty bland, but you can add predefined jQuery Mobile
    classes or write your own CSS for the existing classes. For example, the jQuery
    Mobile framework includes a class called `ui-bar` that adds padding and another
    set of classes that can be appended with a letter to customize the theme, which
    will affect the background, miscellaneous font styling, and so on. We’ll learn
    more about jQuery Mobile themes later in the book. The following example uses
    the `ui-bar-a` class to add a blue background gradient, font styling, and other
    CSS updates:


    [Click here to view code image](#images.html_p092pro01)


    <div class="ui-grid-a">


        <div class="ui-block-a">


            <div class="ui-bar ui-bar-b"><strong>2-Column</strong></div>


        </div>


        <div class="ui-block-b">


            <div class="ui-bar ui-bar-b">Column</div>


        </div>


