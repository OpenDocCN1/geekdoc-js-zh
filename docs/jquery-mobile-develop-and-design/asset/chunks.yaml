  trans: "\n正如你所看到的，框架对代码进行了大量补充以实现视觉增强。首先，添加了 `ui-listview` 类来设置页边距，并传递了 `list-style`。然后更新了列表项，将\
    \ `data-theme` 属性设置为 `c` 主题，并添加了一组 CSS 类。我们将在书的后部分学习更多关于 jQuery Mobile 主题的内容。添加的类包括\
    \ `ui-btn`、`ui-btn-icon-right`、`ui-li-has-arrow`、`ui-li` 和 `ui-btn-up-c`。这些名称基本上已经解释了一切；例如，`ui-btn`\
    \ 添加了指针光标，将 `display` 设置为 `block`，并添加了一些间距使其更易点击，而 `ui-btn-icon-right` 则告诉 `span`\
    \ 元素与箭头图标右对齐。你可以通过像 Chrome 开发者工具之类的代码检查器深入查看这些 CSS 类中的每一个一个。图 8.2 显示了列表项的一些类及其属性。\n\
    \n![Image](img/jquery-8-2.jpg)\n\n图 8.2。框架创建的自定义 CSS。\n\n## 数字有序列表\n\n你可以使用 `listview`\
    \ 的 `data-role` 从相同的代码创建有序列表：只需将 `ul` 转换为 `ol` 即可。下面的示例显示了带有数字列表项的修改后的代码：\n\n\
    点击此处查看代码图像\n\n```html\n<ol data-role=\"listview\">\n    <li><a href=\"#\">首页</a></li>\n\
    \    <li><a href=\"#\">文章</a></li>\n    <li><a href=\"#\">视频</a></li>\n    <li><a\
    \ href=\"#\">书籍</a></li>\n    <li><a href=\"#\">更多</a></li>\n</ol>\n```\n\n视觉结果与\
    \ 图 8.3 相似，数字作为列表项的一部分内缩显示。\n\n![Image](img/jquery-8-3.jpg)\n\n图 8.3。一个基础有序列表。\n\
    \n## 嵌套列表\n\n嵌套列表默认是隐藏的，并像额外的页面一样加载。当列表嵌套在另一个列表项内部时，父列表项将变成指向子列表的超链接，框架会为该列表生成一个新的\
    \ `ui-page`。要创建嵌套列表，只需取任何列表项并向其添加另一个无序或有序列表。在以下示例中，我们之前示例中的“更多”列表项被配置为 `h2` 标题，并带有描述和一个嵌套的无序列表：\n\
    \n点击此处查看代码图像\n\n```html\n<ul data-role=\"listview\">\n    <li><a href=\"#\">首页</a></li>\n\
    \    <li><a href=\"#\">文章</a></li>\n    <li><a href=\"#\">视频</a></li>\n    <li><a\
    \ href=\"#\">书籍</a></li>\n    <li>\n        <h2>更多</h2>\n        <p>在 jQuery Mobile\
    \ 上寻找更多资源</p>\n        <ul data-role=\"listview\">\n            <li><a href=\"\
    http://www.jquerymobile.com\">jQuery Mobile</a></li>\n            <li><a href=\"\
    http://www.jquery.com\">jQuery</a></li>\n        </ul>\n    </li>\n</ul>\n```\n\
    \n当框架增强 `listview` 时，“更多”列表项将变为指向嵌套列表的超链接，如 图 8.4 所示。\n\n![Image](img/jquery-8-4.jpg)\n\
    \n图 8.4。选择“更多”列表项后会出现嵌套列表。\n\n从此嵌套列表生成的页面包含一个其值为列表项标题的页眉，然后是嵌套列表本身。列表可以根据你的需要进行任意深嵌套；框架将简单地生成更多的页面。\n\
    \n## 内缩列表\n\n默认情况下，列表的宽度设置为查看列表的设备宽度；换句话说，它们的宽度始终被设置为 100%。你可以添加一个属性来创建所谓的“内缩列表（inset\
    \ list）”，它看起来是内缩在页面之内的（而不是延伸到设备边缘），并且具有圆角。下面的示例显示了一个 `data-inset` 属性设置为 `true`\
    \ 的基础链接列表：\n\n点击此处查看代码图像\n\n```html\n<ul data-role=\"listview\" data-inset=\"\
    true\">\n    <li><a href=\"#\">首页</a></li>\n    <li><a href=\"#\">文章</a></li>\n\
    \    <li><a href=\"#\">视频</a></li>\n    <li><a href=\"#\">书籍</a></li>\n    <li><a\
    \ href=\"#\">更多</a></li>\n</ul\n```\n\n将此属性设置为 `true` 会产生 图 8.5 所示视觉效果。\n\n![Image](img/jquery-8-5.jpg)\n\
    \n图 8.5。`data-inset` 属性设置为 `true` 的基础链接列表。\n\n## 自定义列表\n\n一旦你理解了如何创建基础列表，你可能会发现自己想要更多。可以使用\
    \ `data-` 属性使用分隔符、缩略图等对列表进行自定义。\n\n### 分割列表\n\n分割列表（Split lists）是带有更多选项的列表。你可以通过取任何列表项并添加另一个无序或有序列表来创建嵌套列表。如下示例所示：\n\
    \n点击此处查看代码图像\n\n```html\n<ul data-role=\"listview\" data-inset=\"true\">\n   \
    \ <li>\n        <a href=\"#item-detail\">\n            <h3>使用 jQuery Mobile</h3>\n\
    \            <p>在 Mobile 中有很多组件</p>\n        </a>\n        <a href=\"#item-purchase\"\
    \ data-rel=\"dialog\">购买</a>\n    </li>\n    <li>\n        <a href=\"#item-detail\"\
    >\n            <h3>使用 jQuery API</h3>\n            <p>jQuery 提供了对内容的额外控制</p>\n\
    \        </a>\n        <a href=\"#item-purchase\" data-rel=\"dialog\">购买</a>\n\
    \    </li>\n</ul>\n```\n\n当框架增强 `listview` 时，分割列表项将变为指向详细列表的超链接，如 图 8.6 所示。\n\n\
    ![Image](img/jquery-8-6.jpg)\n\n图 8.6。带有齿轮图标的列表。\n\n你可以使用 `data-split-icon` 属性更改列表项右侧的默认图标。这些与\
    \ 图 8.7 所示的按钮图标相同，但你也可以使用自定义图标。\n\n![Image](img/jquery-8-7.jpg)\n\n图 8.7。`data-split-icon`\
    \ 属性可用的图标。\n\n### 列表分隔符\n\n列表分隔符可以对你的列表项进行分类，是基础列表的另一个有用补充。例如，你可以对列表项进行排序并使用分隔符按字母进行分组，或者使用分隔符按类型对音乐列表进行分组。下面的示例显示了作为分隔符的乐队以及每个乐队的一些专辑标题：\n\
    \n点击此处查看代码图像\n\n```html\n<ul data-role=\"listview\">\n    <li data-role=\"list-divider\"\
    >The Beatles</li>\n    <li>Meet The Beatles!</li>\n    <li>A Hard Day's Night</li>\n\
    \    <li>Help!</li>\n    <li>Rubber Soul</li>\n    <li>Revolver</li>\n    <li\
    \ data-role=\"list-divider\">The Doors</li>\n    <li>The Doors</li>\n    <li>Strange\
    \ Days</li>\n    <li>Waiting for the Sun</li>\n    <li>The Soft Parade</li>\n\
    \    <li>Morrison Hotel</li>\n    <li data-role=\"list-divider\">The Jimi Hendrix\
    \ Experience</li>\n    <li>Are You Experienced</li>\n    <li>Bold as Love</li>\n\
    \    <li>Electric Ladyland</li>\n</ul>\n```\n\n此代码示例中的高亮部分包含一个值为 `list-divider`\
    \ 的 `data-role`。使用 `data-role` 属性值 `list-divider` 会在视觉上将其与其他列表项区分开来。图 8.8 显示了\
    \ `list-divider` `data-role` 如何创建这种隔离。\n\n"
- fmt: "\n![Image](graphics/jquery-8-8.jpg)\n\nFigure 8.8\\. A long list with list\
    \ dividers.\n\n### Count bubbles, thumbnails, and icons\n\nYou can create different\
    \ visual styles in your lists with count bubbles, thumbnails, and icons. To add\
    \ a count bubble to a list item, simply use the `ul-li-count` class. To separate\
    \ the count bubble from the list item text, use a `span` element to contain the\
    \ count bubble value:\n\n[Click here to view code image](#images.html_p115pro01)\n\
    \n```html\n<ul data-role=\"listview\">\n    <li>\n        <a href=\"#inbox\">Inbox\n\
    \            <span class=\"ui-li-count\">12</span>\n        </a>\n    </li>\n\
    \    <li>\n        <a href=\"#outbox\">Outbox\n            <span class=\"ui-li-count\"\
    >0</span>\n        </a>\n    </li>\n    <li>\n        <a href=\"#sent\">Sent\n\
    \            <span class=\"ui-li-count\">57</span>\n        </a>\n    </li>\n\
    \    <li>\n        <a href=\"#trash\">Trash\n            <span class=\"ui-li-count\"\
    >1090</span>\n        </a>\n    </li>\n</ul>\n```\n\nThe end result of the code\
    \ in this example is shown in [Figure 8.9](#ch08.html_ch08fig09).\n\n![Image](graphics/jquery-8-9.jpg)\n\
    \nFigure 8.9\\. A simple list with count bubbles.\n\nEmail folders are a good\
    \ example of list items that can use count bubbles—in this case, to display how\
    \ many pieces of mail are within each section—but count bubbles can be used for\
    \ a number of situations. For example, the list divider example with bands and\
    \ their albums can be converted into a nested list and the parent elements can\
    \ show how many albums/child list items are in each parent list item:\n\n[Click\
    \ here to view code image](#images.html_p116pro01)\n\n```html\n<ul data-role=\"\
    listview\">\n    <li>\n        <h2>The Beatles</h2>\n        <span class=\"ui-li-count\"\
    >5</span>\n        <ul data-role=\"listview\">\n            <li>Meet The Beatles!</li>\n\
    \            <li>A Hard Day's Night</li>\n            <li>Help!</li>\n       \
    \     <li>Rubber Soul</li>\n            <li>Revolver</li>\n        </ul>\n   \
    \ </li>\n    <li>\n        <h2>The Doors</h2>\n        <span class=\"ui-li-count\"\
    >5</span>\n        <ul data-role=\"listview\">\n            <li>The Doors</li>\n\
    \            <li>Strange Days</li>\n            <li>Waiting for the Sun</li>\n\
    \            <li>The Soft Parade</li>\n            <li>Morrison Hotel</li>\n \
    \       </ul>\n    </li>\n    <li>\n        <h2>The Jimi Experience</h2>\n   \
    \     <span class=\"ui-li-count\">3</span>\n        <ul data-role=\"listview\"\
    >\n            <li>Are You</li>\n            <li>Bold as Love</li>\n         \
    \   <li>Electricyland</li>\n        </ul>\n    </li>\n</ul>\n```\n\nThe result\
    \ of this example is shown in [Figure 8.10](#ch08.html_ch08fig10), with count\
    \ bubble and nested lists in the same list item.\n\n![Image](graphics/jquery-8-10.jpg)\n\
    \nFigure 8.10\\. A simple list with count bubbles.\n\nYou can add thumbnails as\
    \ you would add an image to an HTML page. Simply add an anchor element to a list\
    \ item, add an image that will act as a thumbnail, and add a title and the text\
    \ you want to appear next to the icon:\n\n[Click here to view code image](#images.html_p17pro01)\n\
    \n```html\n<ul data-role=\"listview\">\n    <li>\n        <a href=\"#led-zeppelin/led-zeppelin-iv\"\
    >\n            <img src=\"assets/img/led-zeppelin-IV.png\">\n            <h3>Led\
    \ Zeppelin</h3>\n            <p>Led Zeppelin IV</p>\n        </a>\n    </li>\n\
    \    <li>\n        <a href=\"#led-zeppelin/houses-of-the-holy\">\n           \
    \ <img src=\"assets/img/houses-of-the-holy.png\">\n            <h3>Led Zeppelin</h3>\n\
    \            <p>Houses of the Holy</p>\n        </a>\n    </li>\n</ul>\n```\n\n\
    jQuery Mobile knows exactly how to handle lists that are set up this way, as it\
    \ converts the image into a thumbnail for the list items in the `listview`. The\
    \ result of this code is shown in [Figure 8.11](#ch08.html_ch08fig11).\n\n![Image](graphics/jquery-8-11.jpg)\n\
    \nFigure 8.11\\. A list with list item thumbnails.\n\nIcons are added the same\
    \ way as thumbnails; the only difference is that you use the `ui-li-icon` class\
    \ on the image element:\n\n[Click here to view code image](#images.html_p118pro01)\n\
    \n```html\n<ul data-role=\"listview\">\n    <li>\n        <a href=\"#led-zeppelin/led-zeppelin-iv\"\
    >\n            <img src=\"assets/img/led-zeppelin-IV.png\" class=\"ui-li-icon\"\
    \ width=\"16\" height=\"16\">\n            Led Zeppelin: Led Zeppelin IV\n   \
    \     </a>\n    </li>\n    <li>\n        <a href=\"#led-zeppelin/houses-of-the-holy\"\
    >\n            <img src=\"assets/img/houses-of-the-holy.png\" class=\"ui-li-icon\"\
    \ width=\"16\" height=\"16\">\n            Led Zeppelin: Houses of the Holy\n\
    \        </a>\n    </li>\n</ul>\n```\n\n![Image](graphics/note.jpg)\n\n`width`\
    \ and `height` have been added to.\n\n### Wrapping Up\n\nLists are of importance\
    \ to mobile devices. As you’ve seen in this chapter, jQuery relies on lists.\n\
    \n## Search Filtering\n\nBasic search functionality is a common offering on websites,\
    \ but it can be time-consuming to develop. Luckily, jQuery Mobile offers suggestions\
    \ as the user types.\n\n### Creating a Filter Bar\n\nAs mentioned, the jQuery\
    \ framework makes adding a search filter to a list incredibly easy: Just add the\
    \ `data-filter` attribute to your list and set the value to `true`. The following\
    \ example is a list of songs:\n\n```html\n<ul data-role=\"listview\" data-filter=\"\
    true\">\n    <li>Across The Universe</li>\n    <li>Act Naturally</li>\n    <li>Ain't\
    \ She Sweet</li>\n    <li>All I've Got To Do</li>\n    <li>All My Loving</li>\n\
    \    <li>All Together Now</li>\n    <li>All You Need Is Love</li>\n    <li>And\
    \ I Love Her</li>\n    <li>And Your Bird Can Sing</li>\n    <li>Anna (Go To Him)</li>\n\
    \    <li>Another Girl</li>\n    <li>Any Time At All</li>\n    <li>Ask Me Why</li>\n\
    \    <li>Baby It's You</li>\n    <li>Baby, You're A Rich Man</li>\n    <li>Baby's\
    \ In Black</li>\n    <li>Back In The U.S.R.</li>\n    <li>Bad Boy</li>\n    <li>The\
    \ Ballad Of John And Yoko</li>\n    <li>Because</li>\n    <li>Being For The Benefit\
    \ Of Mr. Kite!</li>\n    <li>Besame Mucho</li>\n    <li>Birthday</li>\n    <li>Blackbird</li>\n\
    </ul>\n```\n\nAs you can imagine, this list is incredibly long; however, the `data-filter`\
    \ attribute adds a search filter bar to the top of the list to help the user find\
    \ what he’s looking for. **[Figure 9.1](#ch09.html_ch09fig01)** shows a sample\
    \ of the sequence of events that happens visually when the user types into the\
    \ filter field. As letters are typed, the results narrow, revealing only the items\
    \ that match the search text.\n"
  raw: '![Image](graphics/jquery-8-8.jpg)


    Figure 8.8\. A long list with list dividers.


    #### Count bubbles, thumbnails, and icons


    You can create different visual styles in your lists with count bubbles, thumbnails,
    and icons. To add a count bubble to a list item, simply use the `ul-li-count`
    class. To separate the count bubble from the list item text, use a span element
    to contain the count bubble value:


    [Click here to view code image](#images.html_p115pro01)


    <ul data-role="listview">


        <li>


            <a href="#inbox">Inbox


                <span class="ui-li-count">12</span>


            </a>


        </li>


        <li>


            <a href="#outbox">Outbox


                <span class="ui-li-count">0</span>


            </a>


        </li>


        <li>


            <a href="#sent">Sent


                <span class="ui-li-count">57</span>


            </a>


        </li>


        <li>


            <a href="#trash">Trash


                <span class="ui-li-count">1090</span>


            </a>


        </li>


    </ul>


    The end result of the code in this example is shown in **[Figure 8.9](#ch08.html_ch08fig09)**.


    ![Image](graphics/jquery-8-9.jpg)


    Figure 8.9\. A simple list with count bubbles.


    Email folders are a good example of list items that can use count bubbles—in this
    case, to display how many pieces of mail are within each section—but count bubbles
    can be used for a number of situations. For example, the list divider example
    with bands and their albums can be converted into a nested list and the parent
    elements can show how many albums/child list items are in each parent list item:


    [Click here to view code image](#images.html_p116pro01)


    <ul data-role="listview">


        <li>


            <h2>The Beatles</h2>


            <span class="ui-li-count">5</span>


            <ul data-role="listview">


                <li>Meet The Beatles!</li>


                <li>A Hard Day''s Night</li>


                <li>Help!</li>


                <li>Rubber Soul</li>


                <li>Revolver</li>


            </ul>


        </li>


        <li>


            <h2>The Doors</h2>


            <span class="ui-li-count">5</span>


            <ul data-role="listview">


                <li>The Doors</li>


                <li>Strange Days</li>


                <li>Waiting for the Sun</li>


                <li>The Soft Parade</li>


                <li>Morrison Hotel</li>


            </ul>


        </li>


        <li>


            <h2>The Jimi Hendrix Experience</h2>


            <span class="ui-li-count">3</span>


            <ul data-role="listview">


                <li>Are You Experienced</li>


                <li>Bold as Love</li>


                <li>Electric Ladyland</li>


            </ul>


        </li>


    </ul>


    The result of this example is shown in **[Figure 8.10](#ch08.html_ch08fig10)**,
    with count bubble code and nested lists all in the same list item.


    ![Image](graphics/jquery-8-10.jpg)


    Figure 8.10\. A simple list with count bubbles.


    You can add thumbnails just as you would add an image to an HTML page. Simply
    add an anchor element to a list item, add an image that will act as a thumbnail,
    and add a title and the text you want to appear next to the icon:


    [Click here to view code image](#images.html_p117pro01)


    <ul data-role="listview">


        <li>


            <a href="#led-zeppelin/led-zeppelin-iv">


                <img src="assets/img/led-zeppelin-IV.png" >


                <h3>Led Zeppelin</h3>


                <p>Led Zeppelin IV</p>


            </a>


        </li>


        <li>


            <a href="#led-zeppelin/houses-of-the-holy">


                <img src="assets/img/houses-of-the-holy.png" >


                <h3>Led Zeppelin</h3>


                <p>Houses of the Holy</p>


            </a>


        </li>


    </ul>


    jQuery Mobile knows exactly how to handle lists that are set up this way, as it
    converts the image into a thumbnail for the list items in the listview immediately.
    The result of this code is shown in **[Figure 8.11](#ch08.html_ch08fig11)**.


    ![Image](graphics/jquery-8-11.jpg)


    Figure 8.11\. A list with list item thumbnails.


    Icons are added the same way as thumbnails; the only difference is that you use
    the `ui-li-icon` class on the image element:


    [Click here to view code image](#images.html_p118pro01)


    <ul data-role="listview">


        <li>


            <a href="#led-zeppelin/led-zeppelin-iv">


                <img src="assets/img/led-zeppelin-IV.png" class="ui-li-icon" width="16"
    height="16">


                Led Zeppelin: Led Zeppelin IV


            </a>


        </li>


        <li>


            <a href="#led-zeppelin/houses-of-the-holy">


                <img src="assets/img/houses-of-the-holy.png" class="ui-li-icon" width="16"
    height="16">


                Led Zeppelin: Houses of the Holy


            </a>


        </li>


    </ul>


    * * *


    ![Image](graphics/note.jpg) Note


    `width` and `height` have been added to the image tag because there was some overlap
    with the original images and the text. In a real-world scenario, you should set
    this width and height with CSS.


    * * *


    The `ul-li-icon` class limits the image size to a maximum width and height of
    40 pixels and positions the image properly in the list item. Therefore, the icons
    you create should fit within these dimensions and, since they are web-based images,
    they should be set to 72 dpi. The example in **[Figure 8.12](#ch08.html_ch08fig12)**
    shows how this code renders on a mobile device.


    ![Image](graphics/jquery-8-12.jpg)


    Figure 8.12\. A list with list item icons.


    ### Wrapping Up


    Lists are of great importance to mobile websites and jQuery Mobile itself. As
    you’ve seen in this chapter, the framework relies on lists to create navigation,
    organize data, and much more. The level of customization is up to you; the options
    in this chapter can be combined to create the ultimate list.


    ## 9\. Search Filtering


    Basic search functionality is a common offering on websites these days, but it
    can be time-consuming to develop. Add to that a search that offers suggestions
    as the user types, and the development time can double at least. Search suggestions
    are becoming the norm and people often expect them. Luckily, jQuery Mobile offers
    a solution: search filtering.


    Search filtering is an add-on to the basic `listview`. Adding search filtering
    is as simple as applying a `data-filter` attribute to an unordered or ordered
    `listview`. This feature provides great usability improvements for long lists.


    ### Creating a Search Filter Bar


    As mentioned, the jQuery Mobile framework makes adding a search filter bar to
    a list incredibly easy: Just add the `data-filter` attribute to your list and
    set the value to `true`. The following example is a truncated list of Beatles
    songs. Here the `data-filter` is added to the unordered list element, but it can
    also be added to ordered lists:


    [Click here to view code image](#images.html_p122pro01)


    <ul data-role="listview" data-filter="true">


        <li>Across The Universe</li>


        <li>Act Naturally</li>


        <li>Ain''t She Sweet</li>


        <li>All I''ve Got To Do</li>


        <li>All My Loving</li>


        <li>All Together Now</li>


        <li>All You Need Is Love</li>


        <li>And I Love Her</li>


        <li>And Your Bird Can Sing</li>


        <li>Anna (Go To Him)</li>


        <li>Another Girl</li>


        <li>Any Time At All</li>


        <li>Ask Me Why</li>


        <li>Baby It''s You</li>


        <li>Baby, You''re A Rich Man</li>


        <li>Baby''s In Black</li>


        <li>Back In The U.S.S.R.</li>


        <li>Bad Boy</li>


        <li>The Ballad Of John And Yoko</li>


        <li>Because</li>


        <li>Being For The Benefit Of Mr. Kite!</li>


        <li>Besame Mucho</li>


        <li>Birthday</li>


        <li>Blackbird</li>


        <!-- etc. -->


    </ul>


    As you can imagine, this list is incredibly long; however, the `data-filter` attribute
    adds a search filter bar to the top of the list to help the user find what he’s
    looking for. **[Figure 9.1](#ch09.html_ch09fig01)** shows a sample of the sequence
    of events that happens visually when the user types into the filter field. As
    letters are typed, the results narrow, revealing only the items that match the
    search text.


    ![Image](graphics/jquery-9-1.jpg)


    Figure 9.1\. A basic search filter.'
