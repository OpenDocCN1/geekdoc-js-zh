  trans: "\n\n要向单选按钮或复选框组添加问题或说明，你可以使用 `legend` 元素。要将图例与输入元素分组，可以使用一个 `data-role`\
    \ 为 `controlgroup` 的 `fieldset`。最后，用 `data-role` 为 `fieldcontain` 的 `div` 包围 `fieldset`\
    \ 元素，可以为组披萨配料中的元素添加一些样式，例如外边距和下边框：\n\n点击此处查看代码图像\n\n```html\n<div data-role=\"\
    fieldcontain\">\n    <fieldset data-role=\"controlgroup\">\n        <legend>Pizza\
    \ ingredients:</legend>\n        <label for=\"cheese\">Cheese</label>\n      \
    \  <input type=\"checkbox\" name=\"pizza-ingredients\" id=\"cheese\" value=\"\
    cheese\" />\n        <label for=\"mushroom\">Mushroom</label>\n        <input\
    \ type=\"checkbox\" name=\"pizza-ingredients\" id=\"mushroom\" value=\"mushroom\"\
    \ />\n        <label for=\"pepperoni\">Pepperoni</label>\n        <input type=\"\
    checkbox\" name=\"pizza-ingredients\" id=\"pepperoni\" value=\"pepperoni\" />\n\
    \        <label for=\"green-pepper\">Green Pepper</label>\n        <input type=\"\
    checkbox\" name=\"pizza-ingredients\" id=\"green-pepper\" value=\"green-pepper\"\
    \ />\n    </fieldset>\n</div>\n```\n\n`controlgroup` data-role 在视觉上对按钮分组，如图 10.12\
    \ 所示。\n\n![Image](img/jquery-10-12.jpg)\n\n图 10.12。一个在 fieldset 中带有图例的输入元素组。\n\
    \n还可以创建所谓的水平切换集（horizontal toggle set）。它将元素分组并仅作为文本选项显示它们，而不是包含实际的单选按钮或复选框图标。要创建切换集，为\
    \ `fieldset` 添加 `data-type` 为 `horizontal`。以下标记是关于你何时以及为何使用这种格式的的良好示例：\n\n点击此处查看代码图像\n\
    \n```html\n<div data-role=\"fieldcontain\">\n    <fieldset data-role=\"controlgroup\"\
    \ data-type=\"horizontal\">\n        <legend>Font styles:</legend>\n        <label\
    \ for=\"bold\" class=\"bold\">b</label>\n        <input type=\"checkbox\" name=\"\
    font-style\" id=\"bold\" value=\"bold\" />\n        <label for=\"italic\" class=\"\
    italic\">i</label>\n        <input type=\"checkbox\" name=\"font-style\" id=\"\
    italic\" value=\"italic\" />\n        <label for=\"underline\" class=\"underline\"\
    >u</label>\n        <input type=\"checkbox\" name=\"font-style\" id=\"underline\"\
    \ value=\"underline\" />\n    </fieldset>\n</div>\n```\n\n这种格式提供了可以切换的类似按钮的功能，在这种情况下，用于开启和关闭字体样式。如果没有一些\
    \ CSS 格式化，这段代码将是不完整的；在这种情况下，以下 CSS 将应用到标签上：\n\n点击此处查看代码图像\n\n```css\n<style type=\"\
    text/css\">\n.bold {\n    font-weight: bold;\n}\n.italic {\n    font-style: oblique;\n\
    }\n.underline {\n    text-decoration: underline;\n}\n</style>\n```\n\n这段代码的结果看起来与图\
    \ 10.13 相似。\n\n![Image](img/jquery-10-13.jpg)\n\n图 10.13。一个带有水平切换集格式的按钮组。\n\n\
    复选框和单选按钮比文本输入简单，因为它们只有 `theme` 和 `mini` 选项，这两者也可以作为 `data-` 属性可用。这两种元素都不包含不同的类型；元素类型要是\
    \ `checkbox` 要是 `radio`，因此不需要 `initSelector`。为复选框或单选按钮设置主题与为文本输入设置主题相似。主要区别在于你需要访问\
    \ `checkboxradio` 而不是 `textinput`。以下代码为所有复选框和单选按钮设置主题，并将它们都设为 `mini`：\n\n点击此处查看代码图像\n\
    \n```javascript\n$(\"input[type='checkbox'], input[type='radio']\").checkboxradio({\n\
    \    mini: \"true\",\n    theme: \"e\"\n});\n```\n\n在方法方面，复选框和单选按钮都有 `enable`\
    \ 和 `disable` 方法。然而，它们还包含一个 `refresh` 方法，你可以用它在视觉上操纵元素后更新该元素。例如，如果我们取披萨配料的示例并想要预选奶酪，可以使用带有\
    \ `refresh` 的以下代码：\n\n点击此处查看代码图像\n\n```javascript\n$(\"input#cheese\").attr(\"\
    checked\", true).checkboxradio(\"refresh\");\n```\n\n该方法确保了对复选框进行了视觉更新，以便用户看到它是被选中的。复选框和单选按钮元素包含了与文本输入相同的事件。这些包括绑定标准\
    \ JavaScript 事件的能力，如 `change`、`blur`、`focus`。这些元素还有一个 `create` 事件，你可以在它们在 jQuery\
    \ Mobile 中被创建时使用它。\n\n### 选择菜单 (Select Menus)\n\n选择菜单的调整一直以来非常困难。最后，jQuery Mobile\
    \ 提供了一种视觉效果，这种效果不需要额外的 CSS。为 jQuery Mobile 创建选择菜单，创建一个普通的 HTML `select`。以下示例展示了用于选择类型的选择菜单：\n\
    \n点击此处查看代码图像\n\n```html\n<label for=\"select-cabin\">Cabin type:</label>\n<select\
    \ name=\"select-cabin\" id=\"select-cabin\">\n    <option value=\"economy\">Economy</option>\n\
    \    <option value=\"business\">Business</option>\n    <option value=\"first\"\
    >First class</option>\n</select>\n```\n\n这段标记的结果看起来和功能上如图 10.14 所示。\n\n![Image](img/jquery-10-14.jpg)\n\
    \n图 10.14。选择菜单。\n\n正如复选框和单选按钮一样，你可以添加一些格式化。以下示例包含了带有 `fieldcontain` 的 `div`（见图\
    \ 10.15）：\n\n```html\n<div data-role=\"fieldcontain\">\n    <label for=\"select-cabin\"\
    >Cabin type:</label>\n    <select name=\"select-cabin\" id=\"select-cabin\">\n\
    \        <option value=\"economy\">Economy</option>\n        <option value=\"\
    business\">Business</option>\n        <option value=\"first\">First class</option>\n\
    \    </select>\n</div>\n```\n\n![Image](img/jquery-10-15.jpg)\n\n图 10.15。在 fieldcontain\
    \ 中的选择菜单。\n\n这段标记的结果看起来和功能上如图 10.15 所示。\n\n你也可以像对复选框和单选按钮一样对选择菜单分组。只需为 `fieldset`\
    \ 添加 `controlgroup data-role` 并为该组菜单创建一个图例：\n\n点击此处查看代码图像\n\n```html\n<div data-role=\"\
    fieldcontain\">\n    <fieldset data-role=\"controlgroup\">\n        <legend>Flight\
    \ details:</legend>\n        <label for=\"select-cabin\">Cabin type:</label>\n\
    \        <select name=\"select-cabin\" id=\"select-cabin\">\n            <option>Cabin\
    \ type</option>\n            <option value=\"economy\">Economy</option>\n    \
    \        <option value=\"business\">Business</option>\n            <option value=\"\
    first\">First class</option>\n        </select>\n        <label for=\"select-adults\"\
    >Adults</label>\n        <select name=\"select-adults\" id=\"select-adults\">\n\
    \            <option>Adults</option>\n            <option value=\"1\">1</option>\n\
    \            <option value=\"2\">2</option>\n        </select>\n        <label\
    \ for=\"select-time\">Time</label>\n        <select name=\"select-time\" id=\"\
    select-time\">\n            <option>Time</option>\n            <option value=\"\
    6\">6:00AM</option>\n            <option value=\"7\">7:00AM</option>\n       \
    \ </select>\n    </fieldset>\n</div>\n```\n\n这段标记的结果看起来与图 10.16 相似。\n\n![Image](img/jquery-10-16.jpg)\n\
    \n图 10.16。（左）controlgroup 中的选择菜单。\n\n"
- fmt: "\nOr, this group can be a horizontal group of select inputs, which works well\
    \ for items that are only a few characters long, such as a date of birth (`[Figure\
    \ 10.17](#ch10.html_ch10fig17)`).\n\n![Image](graphics/jquery-10-17.jpg)\n\nFigure\
    \ 10.17\\. (Right) Horizontally grouped select menus.\n\n#### Options\n\nYou can\
    \ also do quite a bit of customization on the select menu using options via the\
    \ API or as `data-` attribute counterparts. The options that can be set for a\
    \ select menu are shown in `[Table 10.1](#ch10.html_ch10tab01)`. All of these\
    \ options can be set via the `selectmenu` method, except the `initSelector` option,\
    \ which is set the same way as a text input.\n\nTable 10.1\\. Select menu options\n\
    \n![Image](graphics/10tab01.jpg)\n\n#### Methods\n\nA select menu has more functionality\
    \ than a text input, checkbox, or radio button and therefore has more methods\
    \ associated with it. The standard `enable` and `disable` methods are included,\
    \ but this element also includes `close`, `open`, and `refresh`. `refresh` can\
    \ be used when a select menu has been rebuilt, for example, if Ajax were used\
    \ to update the select menu based on prior selections in a web form. Or, this\
    \ method can be used to refresh the menu if a visual update has been made. The\
    \ `open` and `close` methods are self-explanatory, but here’s an example of how\
    \ to use the `open` method:\n\n```\n$('select').selectmenu('open');\n```\n\nThis\
    \ code would set all select menus to open by default.\n\nWe’ve already covered\
    \ all the select menu events. This form element includes the option to be bound\
    \ to standard JavaScript events and includes a `create` event.\n\n### Sliders\n\
    \nSliders are a great addition to the group of form elements that are available\
    \ for enhancement via jQuery Mobile. A slider can be used to choose a number within\
    \ a certain range as it sets that number in a corresponding number input. To create\
    \ a slider, you must set the element type to `range` and include a `min` and `max`\
    \ value:\n\n[Click here to view code image](#images.html_p152pro01)\n\n```html\n\
    <label for=\"my-slider\">My slider</label>\n<input type=\"range\" name=\"slider\"\
    \ id=\"my-slider\" value=\"50\" min=\"0\" max=\"100\" />\n```\n\nA default value\
    \ can also be added, which sets the position of the handle on the track. The slider\
    \ in this example displays like `[Figure 10.18](#ch10.html_ch10fig18)`.\n\n![Image](graphics/jquery-10-18.jpg)\n\
    \nFigure 10.18\\. An example of a basic slider.\n\nYou can also add steps to the\
    \ values that are returned. For example, if you didn’t want to return every single\
    \ number between 0 and 100, you could set the `step` attribute to 10, which would\
    \ return every tenth number:\n\n[Click here to view code image](#images.html_p152pro02)\n\
    \n```html\n<label for=\"my-slider\">My slider</label>\n<input type=\"range\" name=\"\
    slider\" id=\"my-slider\" value=\"50\" min=\"0\" max=\"100\" step=\"10\" />\n\
    ```\n\nIn addition to these attributes, you can add a fill highlight, which highlights\
    \ the area of the track to the left of the handle (`[Figure 10.19](#ch10.html_ch10fig19)`):\n\
    \n[Click here to view code image](#images.html_p153pro01)\n\n```html\n<label for=\"\
    my-slider\">My slider</label>\n<input type=\"range\" name=\"slider\" id=\"my-slider\"\
    \ value=\"50\" min=\"0\" max=\"100\" step=\"10\" data-highlight=\"true\" />\n\
    ```\n\n![Image](graphics/jquery-10-19.jpg)\n\nFigure 10.19\\. A slider with a\
    \ fill highlight.\n\n#### Options\n\nThe slider element has a decent selection\
    \ of options you can set via the API or as `data-role` attributes, including `disabled`,\
    \ `highlight`, `initSelector`, `mini`, `theme`, and `trackTheme`. By default,\
    \ the `disabled` option is set to `false`. The `highlight` option defaults to\
    \ `false`; however, it can be used to highlight the track to the left of the handle\
    \ on all sliders if set to `true`, as in the following example:\n\n[Click here\
    \ to view code image](#images.html_p153pro02)\n\n```\n$('.selector').slider({\
    \ highlight: \"true\" });\n```\n\nWe’ve already covered the `initSelector`, `mini`,\
    \ and `theme` options. The `trackTheme` option is unique to the slider; you can\
    \ use it to set the theme of the track to a different theme than the rest of the\
    \ slider.\n\n#### Methods and events\n\nThe slider plug-in includes three methods\
    \ you can use to modify a `slider` element: `enable`, `disable`, and `refresh`.\
    \ The `enable` method enables a disabled slider:\n\n[Click here to view code image](#images.html_p154pro01)\n\
    \n```\n$('.selector').slider('enable');\n```\n\nThe `disable` method disables\
    \ a slider so the user can’t interact with it:\n\n[Click here to view code image](#images.html_p154pro02)\n\
    \n```\n$('.selector').slider('disable');\n```\n\nThe `refresh` method can be used\
    \ to refresh a slider after it’s been updated:\n\n[Click here to view code image](#images.html_p154pro03)\n\
    \n```\n$('.selector').slider('refresh');\n```\n\nThe events available to the slider\
    \ are similar to those for other elements, they include standard JavaScript. The\
    \ slider plug-in also includes a `create` event you can use when the slider is\
    \ created.\n\n### Flip Toggle Switches\n\nFlip toggle switches are another handy\
    \ addition to the form element. They provide a great solution for binary data,\
    \ such as yes/no, on/off, or true/false The switch can be dragged from one position\
    \ to another or the user can press it and the switch will flip to the selected\
    \ location. It’s easy to make toggle switch: simply create a slider with only\
    \ two options. The options can be anything you like, of any length, because the\
    \ control resizes proportionally to the text:\n\n[Click here to view code image](#images.html_p154pro04)\n\
    \n```html\n<label for=\"flip-switch\">Do you like pizza?</label>\n<select name=\"\
    slider\" id=\"flip-switch\" data-role=\"slider\">\n  <option value=\"yes\">Yes</option>\n\
    \  <option value=\"no\">No</option>\n</select>\n```\n\nThe code that produces\
    \ this toggle switch is a select menu with `data-role` set to a value of `slider`\
    \ and, of course, the key is to include only two options. The visual result of\
    \ this slider is shown in `[Figure 10.20](#ch10.html_ch10fig20)`.\n\n![Image](graphics/jquery-10-20.jpg)\n\
    \nFigure 10.20\\. A toggle switch interaction sequence.\n\nThe flip toggle switch\
    \ includes the exact same options, methods, and events as the slider, and each\
    \ is accessed with the same syntax since the toggle switch is essentially an extension\
    \ of the slider. To learn more about the options, methods, and events accessible\
    \ to the flip toggle switch, check out the “[Sliders](#ch10.html_ch10levsec4)”\
    \ earlier in this chapter.\n\n### Wrapping Up\n\njQuery Mobile offers great element\
    \ options for handling form input. Usability increases dramatically with devices\
    \ that respond with the appropriate keyboard based on the input type. Another\
    \ bonus is that all of these form elements degrade when viewed in a browser that\
    \ can’t handle them, so you never need to worry about your webpage breaking because\
    \ someone isn’t using the latest and greatest mobile phone, for example. This\
    \ is just another way that jQuery Mobile helps eliminate some of the common frustrations\
    \ that come along with web development in general.\n\n## 11\\. Theming jQuery\
    \ Mobile\n\njQuery Mobile includes a complete theme framework that lets you customize\
    \ color swatches and icon sets to create custom themed pages, toolbars, content,\
    \ form elements, lists, buttons, and more. The framework uses CSS3 for many of\
    \ its enhancements, such as shadows, gradients, and rounded corners, so no images\
    \ are used to make these visual aspects, which makes the theme more lightweight\
    \ and quick loading.\n\nThis chapter provides an overview of the existing color\
    \ swatches as well as details on how to create a custom theme. Custom theming\
    \ allows you to create mobile versions of websites that follow the same branding\
    \ as desktop versions, creating a unified design between your websites.\n\n###\
    \ Core Color Swatches\n"
