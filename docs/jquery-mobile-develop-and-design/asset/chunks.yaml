  trans: "\n\n`time`、`month`、`date` 和 `datetime` 元素类型都会显示与相应值对应的菜单（图 10.6）。\n\n![Image](img/jquery-10-5.jpg)\n\
    \n图 10.5。用于电话号码的电话键盘。\n\n![Image](img/jquery-10-6.jpg)\n\n图 10.6。iOS 中与时间和日期相关的菜单。\n\
    \n### 选项\n\n文本输入包含两个选项：`initSelector` 和 `theme`。通过 `$.mobile` 对象访问 `textinput`\
    \ 时，这两个选项可用。以下代码显示了如何通过 `textinput` 访问这些选项：\n\n点击此处查看代码\n\n```\n$.mobile.textinput.prototype.options\n\
    ```\n\n一旦你访问了这些选项，就可以单独访问它们中的每一个。例如，如果你想获取 `initSelector` 选项，可以在上一行代码的末尾添加该选项：\n\
    \n点击此处查看代码\n\n```\n$.mobile.textinput.prototype.options.initSelector\n```\n\n\
    `initSelector` 选项定义了框架初始化时初始化的选择器。该选项的暴露允许你定义想要哪些选择器初始化为文本输入。这让你对核心功能具有很好的控制力，允许你根据特定情况定义初始化内容，最终最大限度地减少初始化时间。你不仅可以定义初始化哪些元素类型，还可以对数据角色（data\
    \ roles）进行同样的操作。以下代码排除了所有 `number` 元素类型的 `textinputs`：\n\n点击此处查看代码\n\n```javascript\n\
    $( document ).bind(\"mobileinit\", function() {\n    $.mobile.textinput.prototype.options.initSelector\
    \ = \"input[type='text'], input[type='search'], :jqmData(type='search'), input[type='password'],\
    \ input[type='email'], input[type='url'], input[type='tel'], textarea, input:not([type])\"\
    ;\n});\n```\n\n***\n\n![Image](img/note.jpg) 注意\n\n在 jQuery Mobile 中，可以使用 `textinput`\
    \ 元素创建多种不同的元素类型，包括 `text`、`search`、`number`、`password`、`email`、`url` 和 `tel`。此外，`textarea`\
    \ 也归类为 jQuery Mobile 中的 `textinput` 表单元素类别。这意味着每个元素类型都包含了本章文本输入部分的选项、方法和事件。\n\n\
    ***\n\n图 10.7 显示了一个未经过增强的 `number` 元素类型示例。\n\n![Image](img/jquery-10-7.jpg)\n\n\
    图 10.7。来自 jQuery Mobile 框架增强的数字元素。\n\n经过增强后，`number` 元素看起来漂亮得多，并且用户在移动环境中更容易与之交互（图\
    \ 10.8）。\n\n![Image](img/jquery-10-8.jpg)\n\n图 10.8。带有 jQuery Mobile 框架增强的数字元素。\n\
    \n`textinput` 还包含一个 `theme` 选项，你可以在选择文本输入元素时访问它。`theme` 的值可以根据包含 a–z 的任何预建或自定义色块进行设置：\n\
    \n点击此处查看代码\n\n```javascript\n$('.my-textinput').textinput({theme: 'a'});\n```\n\
    \n此示例访问了一个类名为 `.my-textinput` 的文本输入元素，并将主题设置为 `a`。你将在下一章学习更多关于主题的内容。\n\n从 1.1.0\
    \ 版本开始，jQuery Mobile 还包含了两个新选项：`mini` 和 `preventFocusZoom`。可以使用名为 `mini` 的 `data-`\
    \ 属性设置单个表单元素设置。将表单元素设置为 `mini` 会创建一个更紧凑的版本。要用代码将表单元素设置为 `mini`，只需选择文本输入，然后使用 `textinput`\
    \ 方法设置 `mini` 的值：\n\n点击此处查看代码\n\n```javascript\n$('.my-textinput').textinput({mini:\
    \ true});\n```\n\n此代码在文本输入上的结果与 图 10.9 中的右侧输入相似，该图显示了普通文本输入和 `mini` 文本输入的对比。\n\
    \n![Image](img/jquery-10-9.jpg)\n\n图 10.9。普通和 mini 文本输入。\n\n文本输入的最后一个选项是 `preventFocusZoom`\
    \ 布尔值。当仅在 iOS 中设置为 `true` 时，该选项可以防止网页在用户选择文本输入时被放大。这不是默认设置：通常 iOS 会将网页放大到输入框处，以便完全关注表单元素。这种行为通常没有必要，幸运的是\
    \ jQuery Mobile 团队提供了一个禁用它的选项。你也可以通过名为 `prevent-focus-zoom` 的 `data-` 属性在单个表单元素上设置此选项：\n\
    \n点击此处查看代码\n\n```javascript\n$('.my-textinput').textinput({preventFocusZoom: true});\n\
    ```\n\n除了这些选项，文本输入还有一个特定的 `clearSearchText` 用于清除搜索。只需像之前那样设置它：\n\n点击此处查看代码\n\n\
    ```javascript\n$('.my-textinput').textinput({clearSearchText: 'this can be any\
    \ text'});\n```\n\n### 方法\n\njQuery Mobile 为 `textinput` 提供了两个方法：`enable` 和 `disable`。`enable`\
    \ 方法激活输入并允许用户输入：\n\n```javascript\n$('.my-textinput').textinput('enable');\n```\n\
    \n当文本输入被禁用时，用户无法与之交互：\n\n```javascript\n$('.my-textinput').textinput('disable');\n\
    ```\n\n我们已经在 图 10.8 中见过一个启用的文本输入；禁用的元素看起来像 图 10.10。（见下图）\n\n### 事件\n\n文本输入还可以与虚拟事件或标准的\
    \ JavaScript 事件绑定。可以绑定到文本输入上的 JavaScript 事件包括 `focus`、`blur` 和 `change`。虚拟事件将在书后部分介绍，包括\
    \ `vmouseover`、`vmousedown`、`vmousemove`、`vmouseup`、`vclick` 和 `vmcancel`。要为文本输入绑定事件，只需使用\
    \ `bind` 方法，包含要绑定的事件，并将其连接到处理函数：\n\n```javascript\n$(\".my-textinput\").bind(\"\
    change\", function(event, ui) {\n    console.log('my-textinput has changed');\n\
    });\n```\n\njQuery Mobile 还为某些表单元素添加了自定义事件。文本输入包含 `create` 事件作为其自定义事件。`create`\
    \ 事件可在创建文本输入时执行自定义代码：\n\n```javascript\n$('.my-textinput').textinput({\n    create:\
    \ function(event, ui) {\n        console.log('my-textinput has been created');\n\
    \    }\n});\n```\n\n"
- fmt: "\nTo add a question or statement to a group of radio buttons or checkboxes,\
    \ you can use the `legend` element. To group a legend with input elements, you\
    \ can use a `fieldset` with a `data-role` of `controlgroup`. Lastly, surrounding\
    \ the `fieldset` element `div` with a `data-role` of `fieldcontain` adds some\
    \ styling, such as a margin and a bottom border, to the elements in this group\
    \ of pizza ingredients:\n\n[Click here to view code image](#images.html_p142pro01)\n\
    \n```html\n<div data-role=\"fieldcontain\">\n    <fieldset data-role=\"controlgroup\"\
    >\n        <legend>Pizza ingredients:</legend>\n        <label for=\"cheese\"\
    >Cheese</label>\n        <input type=\"checkbox\" name=\"pizza-ingredients\" id=\"\
    cheese\" value=\"cheese\" />\n        <label for=\"mushroom\">Mushroom</label>\n\
    \        <input type=\"checkbox\" name=\"pizza-ingredients\" id=\"mushroom\" value=\"\
    mushroom\" />\n        <label for=\"pepperoni\">Pepperoni</label>\n        <input\
    \ type=\"checkbox\" name=\"pizza-ingredients\" id=\"pepperoni\" value=\"pepperoni\"\
    \ />\n        <label for=\"green-pepper\">Green Pepper</label>\n        <input\
    \ type=\"checkbox\" name=\"pizza-ingredients\" id=\"green-pepper\" value=\"green-pepper\"\
    \ />\n    </fieldset>\n</div>\n```\n\nThe `controlgroup` data-role groups the\
    \ buttons visually as shown in [Figure 10.12](#ch10.html_ch10fig12).\n\n![Image](graphics/jquery-10-12.jpg)\n\
    \nFigure 10.12\\. A group of input elements with a legend in a fieldset.\n\nIt’s\
    \ also possible to create what’s called a horizontal toggle set. This groups elements\
    \ and reveals them only as text options, rather than including the actual radio\
    \ button or checkbox icon. To create a toggle set, add a `data-type` of `horizontal`\
    \ to the `fieldset`. The following markup is a good example of when and why you\
    \ would use this type of format:\n\n[Click here to view code image](#images.html_p143pro01)\n\
    \n```html\n<div data-role=\"fieldcontain\">\n    <fieldset data-role=\"controlgroup\"\
    \ data-type=\"horizontal\">\n        <legend>Font styles:</legend>\n        <label\
    \ for=\"bold\" class=\"bold\">b</label>\n        <input type=\"checkbox\" name=\"\
    font-style\" id=\"bold\" value=\"bold\" />\n        <label for=\"italic\" class=\"\
    italic\">i</label>\n        <input type=\"checkbox\" name=\"font-style\" id=\"\
    italic\" value=\"italic\" />\n        <label for=\"underline\" class=\"underline\"\
    >u</label>\n        <input type=\"checkbox\" name=\"font-style\" id=\"underline\"\
    \ value=\"underline\" />\n    </fieldset>\n</div>\n```\n\nThis format provides\
    \ button-like functionality that can be toggled, in this case to turn font styles\
    \ on and off. This code would not be complete without some CSS formatting; in\
    \ this case, the following CSS will be applied to the labels:\n\n[Click here to\
    \ view code image](#images.html_p144pro01)\n\n```css\n<style type=\"text/css\"\
    >\n.bold {\n    font-weight: bold;\n}\n.italic {\n    font-style: oblique;\n}\n\
    .underline {\n    text-decoration: underline;\n}\n</style>\n```\n\nThe result\
    \ of this code looks similar to [Figure 10.13](#ch10.html_ch10fig13).\n\n![Image](graphics/jquery-10-13.jpg)\n\
    \nFigure 10.13\\. A group of buttons with horizontal toggle set formatting.\n\n\
    Checkboxes and radio buttons are simpler than text inputs in that they have only\
    \ a `theme` and `mini` option, both of which are also available as `data-` attributes.\
    \ Neither element can include different types; the element type is either `checkbox`\
    \ or `radio`, so there’s no need for an `initSelector`. Setting the theme for\
    \ a checkbox or radio button is similar to setting the theme for a text input.\
    \ The main difference is that you need to access the `checkboxradio`, rather than\
    \ the `textinput`. The following code sets the theme for all checkbox and radio\
    \ buttons and makes them all `mini`:\n\n[Click here to view code image](#images.html_p145pro01)\n\
    \n```javascript\n$(\"input[type='checkbox'], input[type='radio']\").checkboxradio({\n\
    \    mini: \"true\",\n    theme: \"e\"\n});\n```\n\nIn terms of methods, checkboxes\
    \ and radio buttons both have the `enable` and `disable` methods. However, they\
    \ also include a `refresh` method, which you can use to update an element after\
    \ visually manipulating it. For example, if we took the pizza ingredients example\
    \ and wanted to preselect cheese, we could use the following code with `refresh`:\n\
    \n[Click here to view code image](#images.html_p145pro02)\n\n```javascript\n$(\"\
    input#cheese\").attr(\"checked\", true).checkboxradio(\"refresh\");\n```\n\nThis\
    \ method ensures that the visual update is made to the checkbox, so the user sees\
    \ it as selected. The checkbox and radio button elements include the same events\
    \ as the text input. These include the ability to bind standard JavaScript events,\
    \ such as `change`, `blur`, `focus`. These elements also have a `create` event\
    \ that you can use when they’re created in jQuery Mobile.\n\n### Select Menus\n\
    \nSelect menus have been notoriously difficult to adjust. Finally, jQuery Mobile\
    \ has provided a visual look that makes sense with the framework and requires\
    \ no additional CSS. To create a select menu for jQuery Mobile, create a regular\
    \ HTML select menu. The following example shows a simple select menu to choose\
    \ a cabin type for a flight:\n\n[Click here to view code image](#images.html_p146pro01)\n\
    \n```html\n<label for=\"select-cabin\">Cabin type:</label>\n<select name=\"select-cabin\"\
    \ id=\"select-cabin\">\n    <option value=\"economy\">Economy</option>\n    <option\
    \ value=\"business\">Business</option>\n    <option value=\"first\">First class</option>\n\
    </select>\n```\n\nThe result of this markup looks and functions like the example\
    \ shown in [Figure 10.14](#ch10.html_ch10fig14).\n\n![Image](graphics/jquery-10-14.jpg)\n\
    \nFigure 10.14\\. An action sequence of a select menu.\n\nAs with checkboxes and\
    \ radio buttons, you can add a bit of formatting. The following example includes\
    \ a `div` with the `fieldcontain data-role`, which formats the label and select\
    \ menu differently ([Figure 10.15](#ch10.html_ch10fig15)):\n\n[Click here to view\
    \ code image](#images.html_p147pro01)\n\n```html\n<div data-role=\"fieldcontain\"\
    >\n    <label for=\"select-cabin\">Cabin type:</label>\n    <select name=\"select-cabin\"\
    \ id=\"select-cabin\">\n        <option value=\"economy\">Economy</option>\n \
    \       <option value=\"business\">Business</option>\n        <option value=\"\
    first\">First class</option>\n    </select>\n</div>\n```\n\n![Image](graphics/jquery-10-15.jpg)\n\
    \nFigure 10.15\\. A select menu in a fieldcontain.\n\nThe result of this markup\
    \ looks and functions like [Figure 10.15](#ch10.html_ch10fig15).\n\nYou can also\
    \ group select menus as we did with checkboxes and radio buttons. Simply add the\
    \ `controlgroup data-role` to a `fieldset` and create a legend for the group of\
    \ menus:\n\n[Click here to view code image](#images.html_p148pro01)\n\n```html\n\
    <div data-role=\"fieldcontain\">\n    <fieldset data-role=\"controlgroup\">\n\
    \        <legend>Flight details:</legend>\n        <label for=\"select-cabin\"\
    >Cabin type:</label>\n        <select name=\"select-cabin\" id=\"select-cabin\"\
    >\n            <option>Cabin type</option>\n            <option value=\"economy\"\
    >Economy</option>\n            <option value=\"business\">Business</option>\n\
    \            <option value=\"first\">First class</option>\n        </select>\n\
    \        <label for=\"select-adults\">Adults</label>\n        <select name=\"\
    select-adults\" id=\"select-adults\">\n            <option>Adults</option>\n \
    \           <option value=\"1\">1</option>\n            <option value=\"2\">2</option>\n\
    \        </select>\n        <label for=\"select-time\">Time</label>\n        <select\
    \ name=\"select-time\" id=\"select-time\">\n            <option>Time</option>\n\
    \            <option value=\"6\">6:00AM</option>\n            <option value=\"\
    7\">7:00AM</option>\n        </select>\n    </fieldset>\n</div>\n```\n\nThe result\
    \ of this markup looks similar to [Figure 10.16](#ch10.html_ch10fig16).\n\n![Image](graphics/jquery-10-16.jpg)\n\
    \nFigure 10.16\\. (Left) A select menu in a controlgroup.\n"
  raw: 'To add a question or statement to a group of radio buttons or checkboxes,
    you can use the legend element. To group a legend with input elements, you can
    use a fieldset with a `data-role` of `controlgroup`. Lastly, surrounding the `fieldset`
    element `div` with a `data-role` of `fieldcontain` adds some styling, such as
    a margin and a bottom border, to the elements in this group of pizza ingredients:


    [Click here to view code image](#images.html_p142pro01)


    <div data-role="fieldcontain">


        <fieldset data-role="controlgroup">


            <legend>Pizza ingredients:</legend>


            <label for="cheese">Cheese</label>


            <input type="checkbox" name="pizza-ingredients" id="cheese" value="cheese"
    />


            <label for="mushroom">Mushroom</label>


            <input type="checkbox" name="pizza-ingredients" id="mushroom" value="mushroom"
    />


            <label for="pepperoni">Pepperoni</label>


            <input type="checkbox" name="pizza-ingredients" id="pepperoni" value="pepperoni"
    />


            <label for="green-pepper">Green Pepper</label>


            <input type="checkbox" name="pizza-ingredients" id="green-pepper" value="green-pepper"
    />


        </fieldset>


    </div>


    The `controlgroup` data-role groups the buttons visually as shown in **[Figure
    10.12](#ch10.html_ch10fig12)**.


    ![Image](graphics/jquery-10-12.jpg)


    Figure 10.12\. A group of input elements with a legend in a fieldset.


    It’s also possible to create what’s called a horizontal toggle set. This groups
    elements and reveals them only as text options, rather than including the actual
    radio button or checkbox icon. To create a toggle set, add a `data-type` of `horizontal`
    to the `fieldset`. The following markup is a good example of when and why you
    would use this type of format:


    [Click here to view code image](#images.html_p143pro01)


    <div data-role="fieldcontain">


        <fieldset data-role="controlgroup" data-type="horizontal">


            <legend>Font styles:</legend>


            <label for="bold" class="bold">b</label>


            <input type="checkbox" name="font-style" id="bold" value="bold" />


            <label for="italic" class="italic">i</label>


            <input type="checkbox" name="font-style" id="italic" value="italic" />


            <label for="underline" class="underline">u</label>


            <input type="checkbox" name="font-style" id="underline" value="underline"
    />


        </fieldset>


    </div>


    This format provides button-like functionality that can be toggled, in this case
    to turn font styles on and off. This code would not be complete without some CSS
    formatting; in this case, the following CSS will be applied to the labels:


    [Click here to view code image](#images.html_p144pro01)


    <style type="text/css">


    .bold {


        font-weight: bold;


    }


    .italic {


        font-style: oblique;


    }


    .underline {


        text-decoration: underline;


    }


    </style>


    The result of this code looks similar to **[Figure 10.13](#ch10.html_ch10fig13)**.


    ![Image](graphics/jquery-10-13.jpg)


    Figure 10.13\. A group of buttons with horizontal toggle set formatting.


    Checkboxes and radio buttons are simpler than text inputs in that they have only
    a `theme` and `mini` option, both of which are also available as `data-` attributes.
    Neither element can include different types; the element type is either `checkbox`
    or `radio`, so there’s no need for an `initSelector`. Setting the theme for a
    checkbox or radio button is similar to setting the theme for a text input. The
    main difference is that you need to access the `checkboxradio`, rather than the
    `textinput`. The following code sets the theme for all checkbox and radio buttons
    and makes them all `mini`:


    [Click here to view code image](#images.html_p145pro01)


    $("input[type=''checkbox''], input[type=''radio'']").checkboxradio({


            mini: "true",


            theme: "e"


    });


    In terms of methods, checkboxes and radio buttons both have the standard `enable`
    and `disable` methods. However, they also include a `refresh` method, which you
    can use to update an element after visually manipulating it. For example, if we
    took the pizza ingredients example and wanted to preselect cheese as an ingredient
    choice, we could use the following code with a `refresh`:


    [Click here to view code image](#images.html_p145pro02)


    $("input#cheese").attr("checked", true).checkboxradio("refresh");


    This method ensures that the visual update is made to the checkbox, so the user
    sees the checkbox as selected.


    The checkbox and radio button elements include the same events as the text input.
    These include the ability to bind standard JavaScript events, such as a `change`,
    `blur`, `focus` event, and so on. These elements also have a `create` event that
    you can use to execute custom code when they’re created in jQuery Mobile.


    ### Select Menus


    Select menus have been notoriously difficult to visually adjust. Finally, jQuery
    Mobile has provided a visual look that makes sense with the framework and requires
    no additional custom CSS coding. To create a select menu for jQuery Mobile, create
    a regular HTML select menu. The following example shows a simple select menu to
    choose a cabin type for a flight:


    [Click here to view code image](#images.html_p146pro01)


    <label for="select-cabin">Cabin type:</label>


    <select name="select-cabin" id="select-cabin">


       <option value="economy">Economy</option>


       <option value="business">Business</option>


       <option value="first">First class</option>


    </select>


    The result of this markup looks and functions like the example shown in **[Figure
    10.14](#ch10.html_ch10fig14)**.


    ![Image](graphics/jquery-10-14.jpg)


    Figure 10.14\. An action sequence of a select menu.


    As with checkboxes and radio buttons, you can add a bit of formatting. The following
    example includes a `div` with the `fieldcontain data-role`, which formats the
    label and select menu slightly differently (**[Figure 10.15](#ch10.html_ch10fig15)**):


    [Click here to view code image](#images.html_p147pro01)


    <div data-role="fieldcontain">


        <label for="select-cabin">Cabin type:</label>


        <select name="select-cabin" id="select-cabin">


           <option value="economy">Economy</option>


           <option value="business">Business</option>


           <option value="first">First class</option>


        </select>


    </div>


    ![Image](graphics/jquery-10-15.jpg)


    Figure 10.15\. A select menu in a fieldcontain.


    The result of this markup looks and functions like **[Figure 10.15](#ch10.html_ch10fig15)**.


    You can also group select menus as we did with checkboxes and radio buttons. Simply
    add the `controlgroup data-role` to a `fieldset` and create a legend for the group
    of menus:


    [Click here to view code image](#images.html_p148pro01)


    <div data-role="fieldcontain">


        <fieldset data-role="controlgroup">


            <legend>Flight details:</legend>


            <label for="select-cabin">Cabin type:</label>


            <select name="select-cabin" id="select-cabin">


                <option>Cabin type</option>


                <option value="economy">Economy</option>


                <option value="business">Business</option>


                <option value="first">First class</option>


            </select>


            <label for="select-adults">Adults</label>


            <select name="select-adults" id="select-adults">


                <option>Adults</option>


                <option value="1">1</option>


                <option value="2">2</option>


                <!-- etc. -->


            </select>


            <label for="select-time">Time</label>


            <select name="select-time" id="select-time">


                <option>Time</option>


                <option value="6">6:00AM</option>


                <option value="7">7:00AM</option>


                <!-- etc. -->


             </select>


        </fieldset>


    </div>


    The result of this markup looks similar to **[Figure 10.16](#ch10.html_ch10fig16)**.


    ![Image](graphics/jquery-10-16.jpg)


    Figure 10.16\. (Left) A select menu in a controlgroup.'
