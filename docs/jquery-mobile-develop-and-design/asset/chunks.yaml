    ### Page Initialization and Custom Widget Creation


    The jQuery Mobile framework enhances basic HTML markup. This markup enhancement
    magic takes place when page initialization occurs. There are three steps to the
    page initialization process; they occur in the sequence defined in **[Figure 13.4](#ch13.html_ch13fig04)**.


    ![Image](graphics/jquery-13-4.jpg)


    Figure 13.4\. The three steps in jQuery Mobile’s page initialization process.


    The `pagecreatebefore` event occurs when the page is inserted into the DOM, before
    jQuery Mobile initializes plug-ins and enhances the webpage. The `pagecreatebefore`
    event presents a great opportunity to add markup to a webpage before the jQuery
    Mobile framework gets ahold of it and makes enhancements:


    [Click here to view code image](#images.html_p204pro01)


    $(''div#my-page'').on(''pagebeforecreate'', function(event) {


        console.log(''This page is about to be created'');


        $(''div#my-page'').attr(''data-title'', ''My Page'');


    });


    In the example above, a `data-title` was added to `div#my-page` before the jQuery
    Mobile framework enhanced the markup, therefore the `data-title` was used during
    the enhancement.


    The `pagecreate` event occurs after the `pagecreatebefore` event and, therefore,
    after the page is created in the DOM. However, this event still takes place before
    the HTML markup is enhanced by the jQuery Mobile framework. The `pagecreate` event
    is the perfect place to create custom widgets. The following script creates a
    widget named `logo`, which has `image`, `width,` and `height` options:


    [Click here to view code image](#images.html_p204pro02)


    (function($){


        $.widget("mobile.logo", $.mobile.widget, {


            // data-attributes that can be used in HTML markup (includes default values)


            options: {


                image: '''',


                width: 200,


                height: 200


            },


            // This method is required and called by jQuery Mobile to initialize the
    method


            _create: function() {


                console.log("Widget has been created");


                $(document).trigger("logocreate");


                var logoEl = this.element;


                logoEl.css(''background'', ''url(''+logoEl.attr(''data-image'')+'')'');


                logoEl.width(logoEl.attr(''data-width''));


                logoEl.height(logoEl.attr(''data-height''));


            }


        });


        // The pagecreate event is used to initialize widget instances


        $(document).bind("pagecreate", function(e) {


            $(document).trigger("logobeforecreate");


            return $(":jqmData(role=''logo'')", e.target).logo();


        });


    })(jQuery);


    When the markup for the `logo` widget is included in the HTML document, the jQuery
    Mobile framework makes the enhancements according to the script in the `_create`
    method. The following markup shows how this widget would be included in a jQuery
    Mobile webpage:


    [Click here to view code image](#images.html_p205pro01)


    <div data-role="logo" data-image="assets/img/trademark-jquerymobiletv.png" data-width="200"
    data-height="30"></div>


    The `pagecreate` event is bound to the document, so that when the page is created
    the framework finds the `logo` widget markup by its role using the `:jqmData`
    selector and then triggers the `_create` method. In this example, the widget’s
    `_create` method accesses the data-attributes used in the markup to render the
    widget accordingly.


    The framework also includes a `pageinit` method, the final step of the page initialization
    process. This event is triggered after the page has been enhanced by the framework,
    which includes all existing and custom widget enhancements:


    [Click here to view code image](#images.html_p206pro01)


    $(''div#my-page'').on(''pageinit'', function(event) {


        console.log(''This page was just enhanced'');


    });


    **[Figure 13.5](#ch13.html_ch13fig05)** shows an example log in Chrome when running
    a webpage that includes the initialization and custom widget creation.


    ![Image](graphics/jquery-13-5.jpg)


