    is clicked as `$(this)` inside your anonymous handler function. This lets you
    access the element that executed the event, even when the same code is applied
    to multiple elements. Functions are used to execute a script or a set of scripts
    as the result of an event or a simple and direct call to the function.


    As you’ll learn later in this book, the `bind` method is often used by the jQuery
    Mobile framework to handle custom events.


    The custom events provided by jQuery Mobile create useful hooks for development
    beyond the native functionality of the framework, meaning that you can intercept
    certain existing events and add your own custom code. Such events include `touch`,
    `mouse`, and `window` events, all of which you’ll learn how to extend later in
    this book. The syntax for the `bind` method in jQuery is very similar to the previous
    code example.


    [Click here to view code image](#images.html_p010pro01)


    $(''div.foo'').bind(''click'', function(e) {


        // Your custom code here


    });


    The difference is that you can react to multiple events with the same handler:


    [Click here to view code image](#images.html_p010pro02)


    $(''div.foo'').bind(''mouseenter mouseleave'', function(e) {


        // Your custom code here


    });


    * * *


    ![Image](graphics/note.jpg) Note


    The difference between a function and a method is that a function is stand-alone
    and a method is associated with an object. In this case, the `bind` method is
    associated with the jQuery object.


    * * *


    Or you can handle custom events, such as those implemented by the jQuery Mobile
    framework:


    [Click here to view code image](#images.html_p011pro01)


    $(''div.foo'').bind(''displayMyName'', function(e, myName) {


        alert(''My name is: ''+ myName);


    });


    $(''button'').click(function () {


        $(''div.foo'').trigger(''displayMyName'', [''John Smith'']);


    });


    Binding events will be covered in greater depth when we discuss how to bind jQuery
    Mobile events with custom handler functions.


    #### Waiting for documents to be ready


    A common practice among developers is to wait for a webpage to load before executing
    any JavaScript. The reason for doing this is to ensure that the webpage elements
    are available before trying to access or manipulate them. Attempting to access
    unavailable document elements can lead to unexpected behavior and potentially
    break all your subsequent JavaScript. With traditional JavaScript, the most common
    way to wait for the page to load is to use the `window.onload` event. However,
    this approach happens after the document loads, because it actually waits for
    all images and banners to load within a webpage, which can delay your scripts
    tremendously. Luckily, jQuery provides a `ready` event that lets your code respond
    immediately when the document becomes available.


    [Click here to view code image](#images.html_p011pro02)


    $(document).ready(function() {


        // Your custom code here


    });


    First, you need to select the document object itself and then apply the `ready`
    event. When the `ready` event fires, it will execute a function that will contain
    your custom code. Continuing with the previous examples, you need to add the custom
    code to the `ready` event to ensure that the document is ready before trying to
    apply the `click` event:


    [Click here to view code image](#images.html_p012pro01)


    $(document).ready(function() {


        $(''div.foo'').click(function() {


            alert($(this).html());


        });


    });


    Or you can use a shortcut version, which eliminates the need to access the `document`
    and set the `ready` event.


    [Click here to view code image](#images.html_p012pro02)


    $(function() {


        $(''div.foo'').click(function() {


            alert($(this).html());


        });


    });


    Using the `ready` event is the de facto standard with any jQuery development.
    Not only does this approach ensure that your code will fire at the appropriate
    time, it also lends itself to creating completely unobtrusive code, meaning that
    you can write all your jQuery in a separate, external file that is simply referenced
    from your HTML webpage.


    #### Applying special effects


    jQuery is well-known for the special effects it lets you create without using
    third-party plug-ins, such as Flash. The library provides many techniques for
    incorporating animation into a webpage. Animations can create a more visually
    appealing webpage, or they can serve other, more practical purposes, such as providing
    visual feedback to user interactions. Many prebuilt animation methods are included
    in the jQuery framework, such as `fadeIn`, `fadeOut`, `fadeTo`, `show`, `toggle`,
    `slideUp,` and `slideDown`, among others.


    $(document).ready(function() {


        $(''div.foo'').fadeIn();


    });


    Although these prebuilt animation methods appear to be independent, many of them
    are powered internally by the `animate` method. The `animate` method can be used
    to animate any numerical CSS property for an HTML element, such as `height`, `opacity`,
    `left`, and `right`.


    [Click here to view code image](#images.html_p013pro01)


    $(document).ready(function() {


        $(''div.foo'').click(function() {


            $(this).animate(function(){


                height: ''+=50''


        }, 1000, function() {


                // Your custom code, when the animation is complete


            });


        });


    });


    In this example, when `div.foo` is clicked, its `height` property is increased
    by 50 pixels over a time period of 1 second (1000 milliseconds), and when the
    animation is complete, a callback function will execute your custom code. A callback
    function is used to delay the execution of code until something else happens.
    This is pretty powerful stuff; not only can you animate when an event is fired,
    you can fire a function or even another event when the animation is complete,
    and so on.


    These examples covered only the animation methods themselves. jQuery includes
    methods for creating queues to provide additional animation-related functionality.
    **[Table 1.1](#ch01.html_ch01tab01)** lists the queue methods available in jQuery.


    Table 1.1\. Queue methods


    ![Image](graphics/01tab01.jpg)


    The `queue` method provides a way to queue a string of sequential effects, meaning
    that you can run multiple effects in a queue infinitely or you can stop the queue
    by using the `clearQueue` method. The `queue` method is used primarily by the
    FX (“effects”) `queue`, which is the default `queue`, but is also made available
    via the jQuery API. This lets you queue any functionality that you need to happen
    sequentially, not solely animations.


    The `queue` and `dequeue` methods are meant to be associated with a particular
    element or object. To use the `queue` method, you need to assign a `queueName`
    as the argument, such as an anonymous function:


    [Click here to view code image](#images.html_p014pro01)


    $(document).ready(function() {


        $(''div.foo'').fadeOut().queue(function(){


            $(''div.foo'').fadeIn();


            next();


        });


    });


    This sort of functionality lets you produce timeline-based animations without
    using JavaScript functions such as `setTimeout` or `setInterval`.


    As mentioned, although queues are often used for effects and are listed under
    effects in the jQuery documentation, they can also be used to queue other sorts
    of functionality, such as a series of asynchronous method calls, which leads us
    to Ajax using jQuery.


    #### Using Ajax'
