    \     </div>\n        <div data-role=\"content\">\n            <p>Body</p>\n \
    \       </div>\n        <div data-role=\"footer\" data-position=\"fixed\">\n \
    \           <h4>Copyright</h4>\n        </div>\n    </div>\n</body>\n</html>\n\
    ```\n\n图 7.5 显示此代码的结果，它比之前的示例漂亮得多，添加了增强网格的样式更新。\n\n![Image](img/jquery-7-5.jpg)\n\
    \n图 7.5。用于分离控制组的网格。\n\n### 行\n\n在网格列中添加自定义 CSS 是简单的。由于网格是标准的 HTML 标记，你可以向任何元素添加自定义\
    \ CSS 类。在接下来的示例中，已向第一列添加了自定义类 `block-title`，并向网格中的所有 `div` 元素添加了另一个类：\n\n点击此处查看代码图像\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n    <title>Grid with controlgroup - jQuery\
    \ Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n    <style type=\"text/css\">\n    .ui-grid-a .block-b {\n       \
    \ text: right;\n    }\n    </style>\n</head>\n<body>\n    <div data-role=\"page\"\
    >\n        <div data-role=\"header\" data-position=\"fixed\">\n            <div\
    \ class=\"ui-grid-a\">\n                <div class=\"ui-block-a\">\n         \
    \           <div class=\"ui-bar ui-bar-b\">Home</div>\n                </div>\n\
    \                <div class=\"ui-block-b\">\n                    <div class=\"\
    ui-bar ui-bar-b\">Back</div>\n                </div>\n            </div>\n   \
    \     </div>\n        <div data-role=\"content\">\n            <p>Body</p>\n \
    \       </div>\n        <div data-role=\"footer\" data-position=\"fixed\">\n \
    \           <h4>Copyright</h4>\n        </div>\n    </div>\n</body>\n</html>\n\
    ```\n\n### 列\n\njQuery Mobile 也允许你创建具有多个列的网格。例如，为了创建一个四列网格，必须使用 `ui-grid` 类。接的示例展示了具有四列的网格：\n\
    \n```html\n<div class=\"ui-grid-a\">\n    <div class=\"ui-block-a\">\n       \
    \ <div class=\"ui-bar ui-bar-b\">A</div>\n    </div>\n    <div class=\"ui-block-b\"\
    >\n        <div class=\"ui-bar ui-bar-b\">B</div>\n    </div>\n    <div class=\"\
    ui-block-c\">\n        <div class=\"ui-bar ui-bar-b\">C</div>\n    </div>\n  \
    \  <div class=\"ui-block-d\">\n        <div class=\"ui-bar ui-bar-b\">D</div>\n\
    \    </div>\n</div>\n```\n\n每个带有 `ui-block-a` 类的元素会自动清除之前的行，从而产生新行。通过查看 jQuery\
    \ Mobile 框架中包含 `ui-block-a` 类的实际 CSS，你可以看到它清除了左浮动，因此结果与 图 7.6 类似。\n\n![Image](img/jquery-7-6.jpg)\n\
    \n图 7.6。具有多个行和列的网格。\n\n### 折叠内容\n\njQuery Mobile 提供了一个组件，允许开发者创建可以展开和收叠的内容。这种组件被称为折叠内容，包含一个头部和一个内容区域；头部作为可以点击以展开或收叠内容区域的按钮。创建一个折叠内容区域，将\
    \ `data-role` 属性的值设置为 `collapsible` 应用到包含标题和内容区域的 `div` 上。在接的示例中，`data-role` 设置为\
    \ `collapsible` 的容器元素包含标题和一个段落元素：\n\n```html\n<div data-role=\"collapsible\">\n\
    \    <h3>折叠内容头部</h3>\n    <p>这是折叠的内容区域。</p>\n</div>\n```\n"
