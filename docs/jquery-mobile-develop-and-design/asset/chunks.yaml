    \ elementum et.\n\n通过在容器上添加 `collapsible` `data-role`，标题元素将自动转换为按钮，用于展开和收起段落。在视觉上，该示例将产生如图\
    \ 7.7 所示的序列。\n\n![Image](img/jquery-7-7.jpg)\n\n图 7.7\\.. 用于节省空间的折叠内容按钮。\n\n可折叠内容是组织大量信息的极佳方法。一次性显示大量数据可能会让人无从从备，并阻止人们访问您的宝贵内容。通过在用户首次加载网页时隐藏内容，可以保持内容的整洁，让用户只显示他们感兴趣的内容区域。\n\
    \n可折叠内容区域还可以包含一个名为 `data-collapsed` 的属性。默认情况下，折叠内容区域在网页首次加载时是折叠的。`data-collapsed`\
    \ 属性提供了一种在页面首次加载时展开折叠区域的方法。以下示例显示了实现此目的的标记：\n\n点击此处查看代码图像\n\n```\n<div data-role=\"\
    collapsible\" data-collapsed=\"false\">\n    <h3>折叠内容页眉</h3>\n    <p>Lorem ipsum\
    \ dolor sit amet, consectetur adipiscing elit. Praesent non dolor quis elit suscipit\
    \ commodo a eu velit. Nulla sodales velit arcu, at accumsan nisi. Donec porta\
    \ tempus lorem, eget luctus diam luctus ac. Nunc et aliquam massa. Duis enim felis,\
    \ varius quis pharetra quis, iaculis ac nulla. Morbi congue suscipit elit vel\
    \ porta. Proin lacinia scelerisque risus, at elementum diam elementum et.</p>\n\
    </div>\n```\n\n通过在另一个折叠内容区域内部添加另一个折叠内容区域，也可以嵌套折叠内容。以下示例显示了如何编写标记来创建嵌套折叠内容区域：\n\
    \n点击此处查看代码图像\n\n```\n<div data-role=\"collapsible\" data-collapsed=\"false\">\n\
    \    <h3>折叠内容页眉</h3>\n    <p>Lorem ipsum dolor sit amet, consectetur adipiscing\
    \ elit.</p>\n    <div data-role=\"collapsible\">\n        <h3>折叠子项 #1</h3>\n \
    \       <p>Lorem ipsum dolor sit amet.</p>\n    </div>\n    <div data-role=\"\
    collapsible\">\n        <h3>折叠子项 #2</h3>\n        <p>Lorem ipsum dolor sit amet.</p>\n\
    \    </div>\n</div>\n```\n\n此示例中两个高亮显示的折叠内容区域嵌套在主折叠区域中。这种嵌套折叠内容的结果看起来将与图 7.8 相似。\n\
    \n![Image](img/jquery-7-8.jpg)\n\n图 7.8\\. 在打开嵌套折叠内容区域时发生的事件序列。\n\n还可以进行更深层的嵌套；事实上，你可以根据需要进行任意深嵌套。\n\
    \n### 创建手风琴\n\n可折叠内容区域还可以分组以创建手风琴。手风琴本质上是一组相互感知的折叠内容区域。例如，当其中一个折叠内容区域展开时，任何已展开的区域都会关闭，因此每次只有一个内容区域是展开的。\n\
    \n要定义手风琴，必须创建一个容器元素来包含一组可折叠内容区域。在该容器元素上，必须将 `data-role` 设置为值 `collapsible-set`。就这样。以下代码显示了带有两个折叠内容区域的手风琴的标记：\n\
    \n点击此处查看代码图像\n\n```\n<div data-role=\"collapsible-set\">\n    <div data-role=\"\
    collapsible\">\n        <h3>头部 #1</h3>\n        <p>Lorem ipsum dolor sit amet.</p>\n\
    \    </div>\n    <div data-role=\"collapsible\">\n        <h3>头部 #2</h3>\n   \
    \     <p>Lorem ipsum dolor sit amet.</p>\n    </div>\n</div>\n```\n\n此示例中的代码创建了一个手风琴，其功能类似于图\
    \ 7.9 所示的序列。\n\n![Image](img/jquery-7-9)\n\n图 7.9\\. 手风琴示例\n\n### 总结\n\njQuery\
    \ Mobile 让 JavaScript 变得极其易用。使用 `data-` 属性，内容可以折叠。\n\n## 8. 使用列表\n\n列表被频繁使用。jQuery\
    \ Mobile 提供了大量的选项来实现任何设计，例如链接列表、编号列表、内嵌列表、分割列表、带分隔符的列表，以及带有缩略图和图标的列表。你在 jQuery\
    \ Mobile 中看到的的最常见模式之一是链接列表。\n\n### 基础列表\n\n你在 jQuery Mobile 中看到的常见模式之一是链接列表。以下标记显示了使用\
    \ `data-role` 的链接列表：\n\n点击此处查看代码图像\n\n```\n<ul data-role=\"listview\">\n    <li><a\
    \ href=\"#\">首页</a></li>\n    <li><a href=\"#\">文章</a></li>\n    <li><a href=\"\
    #\">视频</a></li>\n    <li><a href=\"#\">书籍</a></li>\n    <li><a href=\"#\">更多</a></li>\n\
    </ul>\n```\n\n此 `listview` 标记由框架增强以生成链接列表。图 8.1 显示了该标记的可视化结果。\n\n![Image](img/8-1.jpg)\n\
    \n图 8.1\\. 链接列表。\n\n增强会改变标记，产生不同的 HTML。下一个示例显示了框架增强后的标记片段。显示了列表标签和第一个列表项以提供增强示例，而新部分被高亮显示以显示代码进行了代码。注意缺失的列表项（`<!--\
    \ etc. -->）都以与第一个列表相同的方式进行了更改：\n\n点击此处查看代码图像\n\n```\n<ul data-role=\"listview\"\
    \ class=\"ui-listview\">\n    <li data-theme=\"c\" class=\"ui-btn ui-icon-right\
    \ ui-li-has-arrow ui-li ui-btn-up-c\">\n        <div class=\"ui-btn-inner ui-li\"\
    \ aria-hidden=\"true\">\n            <div class=\"ui-btn-text\">\n           \
    \     <a href=\"#\" class=\"ui-link-inherit\">首页</a>\n            </div>\n   \
    \         <span class=\"ui-icon ui-icon-arrow-r ui-icon-shadow\"></span>\n   \
    \     </div>\n    </li>\n</ul>\n```\n"
- fmt: "\nAs you can see, the framework makes a lot of additions to the code to produce\
    \ the visual enhancements. First, a `ui-listview` class is added to set the margin,\
    \ passing a `list-style`. Then the list items are updated with a `data-theme`\
    \ attribute set to the `c` theme, and a group of CSS classes is added. We’ll learn\
    \ more about jQuery Mobile themes later in the book. The classes that are added\
    \ are `ui-btn`, `ui-btn-icon-right`, `ui-li-has-arrow`, `ui-li`, and `ui-btn-up-c`.\
    \ The names of the classes basically explain it all; for example, the `ui-btn`\
    \ adds a pointer cursor, sets the display to block, and adds some spacing to make\
    \ it more touchable, while the `ui-btn-icon-right` tells the span element to align\
    \ right with the arrow icon. Each of these CSS classes can be seen in-depth through\
    \ a code inspector like the one in Chrome’s Developer Tools. [Figure 8.2](#ch08.html_ch08fig02)\
    \ shows some of the classes and their properties for a list item.\n\n![Image](graphics/jquery-8-2.jpg)\n\
    \nFigure 8.2. The custom CSS created by the framework.\n\n## Numbered lists\n\n\
    You can create a numbered list from the same code using the `listview` `data-role`:\
    \ simply convert the `ul` to an `ol`. The following example shows the modified\
    \ code with numbered list items:\n\n[Click here to view code image](#images.html_p109pro01)\n\
    \n```html\n<ol data-role=\"listview\">\n    <li><a href=\"#\">Home</a></li>\n\
    \    <li><a href=\"#\">Articles</a></li>\n    <li><a href=\"#\">Videos</a></li>\n\
    \    <li><a href=\"#\">Books</a></li>\n    <li><a href=\"#\">More</a></li>\n</ol>\n\
    ```\n\nThe visual result looks similar to [Figure 8.3](#ch08.html_ch08fig03),\
    \ with the numbers inset as part of the list item.\n\n![Image](graphics/jquery-8-3.jpg)\n\
    \nFigure 8.3. A basic numbered list.\n\n## Nested lists\n\nNested lists are hidden\
    \ by default and load like additional pages. When a list is nested within another\
    \ list item, the parent list item becomes a hyperlink to the child list and a\
    \ new `ui-page` is generated for that list via the framework. To create a nested\
    \ list, simply take any list item and add another unordered or ordered list to\
    \ it. In the following example, the `More` list item from our previous examples\
    \ is configured as an `h2` heading with a description and a nested unordered list:\n\
    \n[Click here to view code image](#images.html_p109pro02)\n\n```html\n<ul data-role=\"\
    listview\">\n    <li><a href=\"#\">Home</a></li>\n    <li><a href=\"#\">Articles</a></li>\n\
    \    <li><a href=\"#\">Videos</a></li>\n    <li><a href=\"#\">Books</a></li>\n\
    \    <li>\n        <h2>More</h2>\n        <p>Find more resources on jQuery Mobile</p>\n\
    \        <ul data-role=\"listview\">\n            <li><a href=\"http://www.jquerymobile.com\"\
    >jQuery Mobile</a></li>\n            <li><a href=\"http://www.jquery.com\">jQuery</a></li>\n\
    \        </ul>\n    </li>\n</ul>\n```\n\nWhen the framework enhances the `listview`,\
    \ the `More` list item becomes a hyperlink to the nested list, as seen in [Figure\
    \ 8.4](#ch08.html_ch08fig04).\n\n![Image](graphics/jquery-8-4.jpg)\n\nFigure 8.4.\
    \ A nested list appears after the More list item is selected.\n\nThe page generated\
    \ from this nested list includes a header with the value of the list item title\
    \ and then the nested list itself. Lists can be nested as deeply as you like;\
    \ the framework will simply generate more and more pages.\n\n## Inset lists\n\n\
    By default, lists are set to the width of the device they are being viewed on;\
    \ in other words, their width is always set to 100 percent. You can add an attribute\
    \ to create what’s known as an inset list, which looks like it’s inset within\
    \ the page (rather than extending to the edges of the device) and has rounded\
    \ corners. The following example shows a basic linked list with the `data-inset`\
    \ attribute set to `true`:\n\n[Click here to view code image](#images.html_p111pro01)\n\
    \n```html\n<ul data-role=\"listview\" data-inset=\"true\">\n    <li><a href=\"\
    #\">Home</a></li>\n    <li><a href=\"#\">Articles</a></li>\n    <li><a href=\"\
    #\">Videos</a></li>\n    <li><a href=\"#\">Books</a></li>\n    <li><a href=\"\
    #\">More</a></li>\n</ul>\n```\n\nSetting this attribute to `true` creates the\
    \ visual results in [Figure 8.5](#ch08.html_ch08fig05).\n\n![Image](graphics/jquery-8-5.jpg)\n\
    \nFigure 8.5. A basic linked list with the data-inset attribute set to true.\n\
    \n## Custom Lists\n\nOnce you understand how to create basic lists, you may find\
    \ yourself wanting more. Lists can be customized with dividers, thumbnails, and\
    \ more using `data-` attributes. This section shows you what attributes can be\
    \ used and how to write the code for each them.\n\n### Split button lists\n\n\
    One option for providing additional list functionality is what’s called a split\
    \ button list. A split button list lets you provide two clickable options within\
    \ the same list item. This is useful for items that require a link for details\
    \ about a particular item as well as another action, such as a button to purchase\
    \ the item or share it on a social network. Creating a split button list is easy:\
    \ just add two anchor tags within a list item that uses the `listview` `data-role`:\n\
    \n[Click here to view code image](#images.html_p12pro01)\n\n```html\n<ul data-role=\"\
    listview\" data-split-icon=\"gear\">\n    <li>\n        <a href=\"#item-detail\"\
    >\n            <h3>Using components in jQuery Mobile</h3>\n            <p>Many\
    \ UI components are available in the Mobile framework.</p>\n        </a>\n   \
    \     <a href=\"#item-purchase\" data-rel=\"dialog\">Buy now</a>\n    </li>\n\
    \    <li>\n        <a href=\"#item-detail\">\n            <h3>Using the jQuery\
    \ API</h3>\n            <p>The jQuery Mobile API provides an extra level of control\
    \ over the customization of your mobile website.</p>\n        </a>\n        <a\
    \ href=\"#item-purchase\" data-rel=\"dialog\">Buy now</a>\n    </li>\n</ul>\n\
    ```\n\nThe split button list in this example contains articles as list items that\
    \ include a title and an overview. When selected, additional details can be viewed\
    \ for a particular article. Each list item also includes a gear icon hyperlink\
    \ that the user can click to pay for access to the article within a dialog window.\
    \ The visual representation of this list is shown in [Figure 8.6](#ch08.html_ch08fig06).\n\
    \n![Image](graphics/jquery-8-6.jpg)\n\nFigure 8.6. A split button list with gear\
    \ icons.\n\nYou can change the default icon for the split button that appears\
    \ on the right side of the list item by using the `data-split-icon` attribute.\
    \ The icons available with the `data-split-icon` attribute are the same as those\
    \ available for buttons, as seen in [Figure 8.7](#ch08.html_ch08fig07), but you\
    \ can also use custom icons.\n\n![Image](graphics/jquery-8-7.jpg)\n\nFigure 8.7.\
    \ Icons available to the split-button-icon attribute.\n\n### List dividers\n\n\
    List dividers let you categorize your list items and are another useful addition\
    \ to basic linked lists. For example, you could alphabetize your list items and\
    \ use dividers to group them by letter of the alphabet, or use dividers to group\
    \ a list of music-related items by genre. The following example shows a list of\
    \ bands as dividers and some of each band’s album titles:\n\n[Click here to view\
    \ code image](#images.html_p114pro01)\n\n```html\n<ul data-role=\"listview\">\n\
    \    <li data-role=\"list-divider\">The Beatles</li>\n    <li>Meet The Beatles!</li>\n\
    \    <li>A Hard Day's Night</li>\n    <li>Help!</li>\n    <li>Rubber Soul</li>\n\
    \    <li>Revolver</li>\n    <li data-role=\"list-divider\">The Doors</li>\n  \
    \  <li>The Doors</li>\n    <li>Strange Days</li>\n    <li>Waiting for the Sun</li>\n\
    \    <li>The Soft Parade</li>\n    <li>Morrison Hotel</li>\n    <li data-role=\"\
    list-divider\">The Jimi Hendrix Experience</li>\n    <li>Are You Experienced</li>\n\
    \    <li>Bold as Love</li>\n    <li>Electric Ladyland</li>\n</ul>\n```\n\nThe\
    \ highlighted sections in this code example include a `data-role` with a value\
    \ of `list-divider`. Using the `data-role` attribute value of `list-divider` visually\
    \ differentiates these from other list items. [Figure 8.8](#ch08.html_ch08fig08)\
    \ shows how the `list-divider` `data-role` creates this separation.\n"
