  trans: "\n\n图 12.2 显示了框架如何转换标记，以包含我们创建并对其应用 CSS 的新类。\n\n![Image](img/jquery-12-2.jpg)\n\
    \n图 12.2。框架根据全局配置设置插入的自定义活动页面类。\n\n另一个名为 `activeBtnClass` 的属性与 `activePageClass`\
    \ 的工作原理完全相同。你可以在 `mobileinit` 回调中设置它。它可以包含任何字符串值，且该字符串值最终可以关联到包含在 CSS 文件中的自定义\
    \ CSS 类。`activePageClass` 和 `activeBtnClass` 属性唯一的区别在于，`activeBtnClass` 允许你对使用的任何按钮的活动状态进行样式设置。\n\
    \n## 启用禁用 Ajax 导航\n\n默认情况下，使用 `$.mobile` 对象的 `ajaxEnabled` 属性将基于 Ajax 的导航设置为 `true`。然而，你可以在配置文件中此此设置为\
    \ `false`：\n\n点击此处查看代码图片\n\n```javascript\n$(document).bind(\"mobileinit\", function()\
    \ {\n    $.extend( $.mobile, {\n        ajaxEnabled: false\n    });\n});\n```\n\
    \n这是一个非常容易修改的属性，但它具有重大影响。将此属性设置为 `false` 会禁用 URL hash 监听，并将所有 URL 加载为标准的 HTTP\
    \ 请求。这样做会导致页面刷新、禁用页面预加载和缓存，并消除页面和对话框过渡。如果你希望你的移动网站运行像标准网站一样，将此选项设置为 `false` 将创建标准的\
    \ HTTP 请求。\n\n## 修改默认页面和对话框过渡\n\n默认情况下，当通过 Ajax 处理页面更改时，jQuery Mobile 中的页面和对话框包含过渡效果。默认页面过渡是\
    \ `slide`，而默认对话框过渡是 `pop`。要更改这些值，请定位到 `defaultPageTransition` 和/或 `defaultDialogTransition`\
    \ 属性：\n\n点击此处查看代码图片\n\n```javascript\n$(document).bind(\"mobileinit\", function()\
    \ {\n    $.extend( $.mobile , {\n        defaultPageTransition: \"fade\",\n  \
    \      defaultDialogTransition: \"fade\"\n    });\n});\n```\n\n如果你运行这段代码，你会看到页面和对话框的过渡都将变为淡入（fade）：\n\
    \n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1\">\n    <title>Page Transitions\
    \ - jQuery Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"\
    http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\" />\n    <script\
    \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"></script>\n\
    \    <script src=\"assets/js/custom-jqm-transitions.js\"></script>\n    <script\
    \ src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"></script>\n\
    </head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"header\"\
    ><h1>Page Name</h1></div>\n        <div data-role=\"content\">\n            <p><a\
    \ href=\"sample-page.html\">Open Another Page</a></p>\n            <p><a href=\"\
    dialog.html\" data-rel=\"dialog\">Open Dialog </a></p>\n        </div>\n     \
    \   <div data-role=\"footer\">Copyright</div>\n    </div>\n</body>\n</html>\n\
    ```\n\n框架包含了六种基于 CSS 的过渡效果：`slide`、`slideup`、`slidedown`、`pop`、`fade`、`flip`，在第四章“使用\
    \ jQuery Mobile 创建多页网站”中都详细介绍过。这些效果也可以通过包含 `data-transition` 属性直接应用在超链接上：\n\n\
    点击此处查看代码图片\n\n```html\n<a href=\"sample-page.html\" data-transition=\"flip\">Data\
    \ transition</a>\n```\n\n使用这段代码将覆盖之前的任何过渡设置。\n\n## 总结\n\njQuery Mobile 框架易于使用，但不要被它的简单性欺骗了——幕后发生了很多事情。有许多方法可以添加自定义功能来创建强大的移动网站。访问\
    \ API 允许进行精细的控制，让你能够告诉框架默认如何行为，甚至可以挂钩到客户端发生的每一次交互中。在下一章节中，你将看到事件如何能为你的自定义项目提供更多控制。\n\
    \n## 13. 挂钩事件\n\njQuery Mobile 提供了你可以使用的自定义事件，用于扩展框架的功能，包括触摸、滚动、设备方向、页面过渡和页面初始化等。挂钩\
    \ jQuery 事件打开了通过基础设置无法实现的整个机会世界。了解网页在任何给定时间的状态可以提供一种你可用于扩展现有功能的控制水平。本章将向你展示如何挂钩到这些事件中的每一个。有许多触摸事件可以挂钩到\
    \ jQuery Mobile。请记住，这些事件仅对支持触摸的设备可用，因此桌面用户可能无法体验到这些事件或通过事件挂钩添加的任何自定义内容。尽管如此，触摸事件不会在桌面设备上引起错误：它们只是不会起，因为鼠标事件主导了桌面体验。这些事件可以触发一个包含任何\
    \ JavaScript 的回调函数。表 13.1 描述了通过 jQuery Mobile API 可的五个触摸事件。\n\n表 13.1. 触摸事件\n\
    ![Image](img/13tab01.jpg)\n\n表 13.2 描述了在表 13.1 中提到的 `swipe` 事件属性。\n\n表 13.2. swipe\
    \ 属性\n![Image](img/13tab02.jpg)\n\n要绑定这些触摸事件中的任何一个，你必须使用 `document.ready` 事件。一旦文档就绪，你就可以访问\
    \ HTML 元素并绑定你选择的触摸事件：\n\n点击此处查看代码图片\n\n```javascript\n$(document).ready(function(){\n\
    \    $(\".test-tap-hold\").bind(\"taphold\", function(event) {\n        $(this).html(\"\
    Tapped and held\");\n    });\n});\n```\n\n一旦文档就绪，`taphold` 事件被绑定到类名为 `.test-tap-hold`\
    \ 的元素。当手指触摸此元素并保持在该时，`taphold` 事件就会触发。以下示例包含了将该事件绑定到 HTML 元素的 JavaScript 文件：\n\
    \n点击此处查看代码图片\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n    <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1\">\n    <title>taphold- jQuery\
    \ Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
    \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
    ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
    header\"><h1>Page title</h1></div>\n        <div data-role=\"content\">\n    \
    \        <ul data-role=\"listview\">\n                <li class=\"test-tap-hold\"\
    >Tap and hold test</li>\n            </ul>\n        </div>\n        <div data-role=\"\
    footer\">Copyright</div>\n    </div>\n</body>\n</html>\n```\n\n正如你所见，页面包含了一个 `listview`，其中包含一个类名为\
    \ `test-tap-hold` 的列表项。\n\n"
- fmt: "\nThe events in [Table 13.1](#ch13.html_ch13tab01) let you tie custom code\
    \ into any state of a mobile website. Knowing when and how a user is interacting\
    \ with the screen gives you a foundation for responding to those interactions.\n\
    \n### Orientation Events\n\nThe jQuery Mobile framework includes a single orientation\
    \ event named `orientationchange`. This event is fired any time the device is\
    \ rotated vertically or horizontally ([Figure 13.2](#ch13.html_ch13fig02)).\n\n\
    ![Image](graphics/jquery-13-2.jpg)\n\nFigure 13.2. Webpages can display vertically\
    \ or horizontally depending on the orientation of the device.\n\nThe orientation\
    \ of the device can be determined during rotation by accessing the `orientation`\
    \ property within the `orientationchange` event. This property returns a read-only\
    \ value of either `portrait` or `landscape`. To hook into the `orientationchange`\
    \ event, the `body` element must be bound to the event:\n\n[Click here to view\
    \ code image](#images.html_p195pro01)\n\n```javascript\n$(document).ready(function(){\n\
    \    $('body').bind('orientationchange', function(event) {\n        console.log('orientationchange:\
    \ '+ event.orientation);\n    });\n});\n```\n\nOf course, it’s also important\
    \ to bind the event after the document is ready so the body is accessible, otherwise\
    \ you’ll receive inconsistent results. You can also take this code a step further\
    \ by using the jQuery trigger method to manually trigger the `orientationchange`\
    \ event when the document is ready:\n\n[Click here to view code image](#images.html_p195pro02)\n\
    \n```javascript\n$(document).ready(function(){\n    $('body').bind('orientationchange',\
    \ function(event) {\n        console.log('orientationchange: '+ event.orientation);\n\
    \    });\n    $('body').trigger('orientationchange');\n});\n```\n\nTriggering\
    \ the event manually when the document is ready makes it possible to determine\
    \ the orientation automatically when the page first loads, which otherwise would\
    \ not occur. The orientation values are also added to the `html` element within\
    \ the webpage and are therefore accessible through CSS. This provides a way to\
    \ respond to a device’s orientation via jQuery Mobile and CSS through what is\
    \ called responsive design.\n\n***\n\n### Responsive Design\n\nWith the plethora\
    \ of devices available on the market today, it’s becoming more and more important\
    \ to design websites that display properly in all the different formats. Responsive\
    \ design is just that: displaying content based on the device format. This includes\
    \ device size, device orientation, and even the way your site reacts to browser\
    \ resizing on desktop machines. Common ways of achieving responsive design are\
    \ through CSS media queries or simply serving an alternative website. jQuery Mobile\
    \ provides a solution that responds automatically.\n\nIn other words, knowing\
    \ the device’s orientation at any given time helps you determine how to render\
    \ the layout of your content. With this sort of power it’s not necessary to have\
    \ multiple websites to handle different devices.\n\n### Scroll Events\n\njQuery\
    \ Mobile offers two scroll events that are triggered when a user scrolls a webpage:\
    \ `scrollstart` and `scrollstop`. The `scrollstart` event triggers when a page\
    \ scroll begins. Like the `orientationchange` event, the `scrollstart` event must\
    \ be bound to the `body` element when the document is ready:\n\n[Click here to\
    \ view code image](#images.html_p197pro01)\n\n```javascript\n$(document).ready(function(){\n\
    \    $('body').bind('scrollstart', function(event) {\n        console.log(\"scrollstart\"\
    );\n    });\n});\n```\n\nThe `scrollstop` event fires when the page scroll stops.\
    \ Binding the `scrollstop` event to the `body` element works the same way as binding\
    \ the `scrollstart` event:\n\n[Click here to view code image](#images.html_p197pro02)\n\
    \n```javascript\n$(document).ready(function(){\n    $('body').bind('scrollstart',\
    \ function(event) {\n        console.log(\"scrollstart\");\n    });\n    $('body').bind('scrollstop',\
    \ function(event) {\n        console.log(\"scrollstop\");\n    });\n});\n```\n\
    \nScroll events can be used together to run custom JavaScript. For example, they\
    \ can be used to create a lazy loading effect, functionality that loads images\
    \ on demand as they are revealed lower on the webpage during scrolling:\n\n[Click\
    \ here to view code image](#images.html_p197pro03)\n\n```javascript\n$(document).ready(function()\
    \ {\n    var _scrollInterval;\n    $(document).bind({\n        scrollstart: function()\
    \ {\n            _scrollInterval = setInterval(\"onScroll()\", 50);\n        },\n\
    \        scrollstop: function() {\n            clearInterval(_scrollInterval);\n\
    \        }\n    });\n});\n\nfunction onScroll() {\n    lazyLoad();\n}\n\nfunction\
    \ lazyLoad() {\n    $('img').each(function() {\n        var viewablePosition =\
    \ $(window).scrollTop() + $(window).height();\n        var viewableImage = $(this).top();\n\
    \        if ($(this).hasClass('lazy-img') && viewablePosition > viewableImage)\
    \ {\n            $(this).attr('src', 'assets/img/trademark.png');\n          \
    \  $(this).css('display', 'block');\n        }\n    });\n}\n```\n\n### Page Transition\
    \ Events\n\nImagine knowing when a page transition is going to occur before it\
    \ even happens. Add to that knowing ahead of time when a page is going to hide.\
    \ With page transition events, this is possible. jQuery Mobile page animations\
    \ are powered by page transitions. The animations used during the transition between\
    \ pages were defined in previous chapters, but there are also events associated\
    \ with each step of a transition. Events occur before and after each page transition\
    \ and can be used to execute custom code at any time during this process. As shown\
    \ in [Figure 13.3](#ch13.html_ch13fig03), four events are associated with page\
    \ transitions, and they occur in sequence.\n\n![Image](graphics/jquery-13-3.jpg)\n\
    \nFigure 13.3. The four events associated with jQuery Mobile’s page transition.\n\
    \nThe first two events occur on the page currently in view when the page transition\
    \ begins, and the final two events occur on the page that is coming into view.\n\
    \nAttaching event handlers to these events is easy with the jQuery `on` method.\
    \ You can attach an event handler to a single element for each of the events.\
    \ In the following example, the `on` method is attached to `div#my-page` and allows\
    \ custom event handlers to be created for each of the page transition events.\
    \ The `div` with an `id` of `my-page` is being used as the page container in the\
    \ HTML document, therefore at any step of page transition these events trigger\
    \ the custom script that writes to the console:\n\n[Click here to view code image](#images.html_p200pro01)\n\
    \n```javascript\n$(document).ready(function() {\n    $('div#my-page').on({\n \
    \       pagebeforeshow: function(event, ui) {\n            console.log('This page\
    \ is about to be shown: '+ ui.prevPage);\n        }\n    });\n});\n```\n"
