  raw: 'Hooking into jQuery Mobile events opens up a world of opportunity. When you
    understand how to hook into jQuery Mobile events, you can create virtually any
    custom functionality you can imagine. From touch events to device orientation
    to page changes and transitions, all events are derived from the user. Knowing
    when and how to react to them is priceless.


    ## 14\. Working with Exposed Methods


    The jQuery Mobile framework includes numerous methods and properties that have
    been exposed on the `$.mobile` object. Exposing a method means giving third-party
    access to it. In other words, jQuery Mobile offers third-party developers access
    to some of the internal methods used throughout its framework. These methods and
    properties let you tap into some core jQuery Mobile functionality to create customizations
    that set your mobile application apart from the rest. This chapter covers changing
    pages, preloading pages, and a number of utility methods and properties.


    ### Changing Pages Programmatically


    Changing pages programmatically means you can use code to direct the browser to
    another page with or without user interaction. One of several exposed methods
    in the jQuery Mobile framework is `changePage`, which adds functionality to standard
    hyperlinks and form submissions by providing a way to change pages programmatically.
    The equivalent to this method in basic JavaScript is `document.location`, which
    is sometimes used to achieve programmatic page changes. In addition to basic page
    changes, the typical jQuery Mobile visuals that occur, such as page loading and
    page transitions, are also available when you change pages programmatically via
    the framework’s API. The `changePage` method is useful when content is dynamically
    added to the page. Let’s add a `click` event to the `logo` widget that was created
    in [Chapter 13](#ch13.html_ch13), “[Hooking into Events](#ch13.html_ch13),” so
    you can use `changePage` to change pages programmatically:


    [Click here to view code image](#images.html_p210pro01)


    (function($){


        $.widget("mobile.logo", $.mobile.widget, {


            options: {


                image: '''',


                width: 0,


                height: 0,


                hyperlink: ''#''


            },


            _create: function() {


                $(document).trigger("logocreate");


                var logoEl = this.element;


                logoEl.css(''background'', ''url(''+this.options.image+'')'');


                logoEl.width(this.options.width);


                logoEl.height(this.options.height);


                // This method will trigger a page change through the jQuery Mobile
    API


                logoEl.click(function() {


                    console.log("Widget has been clicked: "+ $(this).attr(''data-hyperlink''));


                    $.mobile.changePage($(this).attr(''data-hyperlink''));


                });


            }


        });


        $(document).bind("pagecreate", function(e) {


            $(document).trigger("logobeforecreate");


            return $(":jqmData(role=''logo'')", e.target).logo();


        });


    })(jQuery);


    With the `changePage` method in place, the widget can change pages when a user
    selects it. In this example, the hyperlink is expected to be an HTML attribute,
    because the widget has an additional property that supports this option. With
    this option, each instance of the widget can include its own custom hyperlink
    in a `data-hyperlink` attribute:


    [Click here to view code image](#images.html_p211pro01)


    <div data-role="logo" data-image="assets/img/trademark-jquerymobiletv.png" data-width="200"
    data-height="30" data-hyperlink="http://www.jquerymobile.tv"></div>


    Although this may not be the most practical example, it shows how you can create
    a custom widget to handle any functionality. The `changePage` method requires
    at least one argument named `to`, which specifies the page to change during the
    request. The value of the `to` argument can be a string, as in this example, or
    a jQuery collection object. `changePage` also has other optional arguments that
    customize a request. **[Table 14.1](#ch14.html_ch14tab01)** lists the properties
    that can be added.


    Table 14.1\. The changePage properties


    ![Image](graphics/14tab01.jpg)


    Adding a property to the `options` argument is as simple as making a comma-delimited
    list of the properties using JavaScript Object Notation (JSON) and setting the
    specific individual values.


    * * *


    ![Image](graphics/note.jpg) Note


    JSON is a lightweight JavaScript data format that can be used to exchange data
    between systems or a webpage and a database. jQuery uses JSON throughout its libraries
    to pass data and set values.


    * * *


    These optional arguments can provide complex functionality. For example, you can
    set a request type to submit form values:


    [Click here to view code image](#images.html_p213pro01)


    $(document).ready(function() {


        $(''#next-btn'').click(function() {


            $.mobile.changePage( "step2.php", {


                type: "post",


                data: $("form#my-form").serialize()


            });


        });


    });


    This might be helpful in a multistep process where form values are carried from
    one page to another. The following example includes a form with an input field
    for an email address. Rather than a submit button, this form includes an anchor
    element with an `id` of `next-btn`, which when clicked, triggers the `changePage`
    method in the previous example:


    [Click here to view code image](#images.html_p213pro02)


    <!DOCTYPE HTML>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>changePage Form Submission - jQuery Mobile: Design and Develop</title>


        <link rel="stylesheet" href="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css"
    />


        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>


        <script src="http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js"></script>


        <script src="assets/js/custom-jqm-changepage-formsubmission.js"></script>


    </head>


    <body>


        <div data-role="page">


            <div data-role="header"><h1>Page Header</h1></div>


            <div data-role="content">


                <form action="" id="my-form">


                    <label for="emailAddress">Email Address</label>


                    <input type="text" name="emailAddress" id="emailAddress">


                </form>


                <a href="#" id="next-btn">Next</a>


            </div>


            <div data-role="footer">Copyright</div>


        </div>


    </body>


    </html>


    The `changePage` method is set to change to a page named `step2.php`, with the
    `type` property set as a post request and the data property set as the forms serialized
    data. The form includes a single input named `emailAddress`; when the page changes,
    the value of the `emailAddress` input is sent to `step2.php`:


    [Click here to view code image](#images.html_p215pro01)


    <!DOCTYPE HTML>


    <html>


    <head>


        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


        <meta name="viewport" content="width=device-width, initial-scale=1">


        <title>changePage Form Submission: Step 2 - jQuery Mobile: Design and Develop</title>


    </head>


    <body>


        <div data-role="page">


            <div data-role="header"><h1>Page Header</h1></div>


            <div data-role="content">


                <form action="">


                    <label for="firstName">First Name:</label>


                    <input type="text" name="firstName" id="firstName">


                    <label for="lastName">Last Name:</label>


                    <input type="text" name="lastName" id="lastName">


                    <label for="emailAddress">Email Address</label>


                    <input type="text" name="emailAddress" id="emailAddress" value="<?php
    echo $_POST[''emailAddress'']; ?>">


                    <input type="submit" value="Sign me up">


                </form>


            </div>


            <div data-role="footer">Copyright</div>


        </div>


    </body>


