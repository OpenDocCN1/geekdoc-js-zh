- fmt: "\nTo get started with jQuery, you first need to download the framework from\
    \ [jquery.com](http://jquery.com) and include it in your webpage, or you can simply\
    \ reference it via the Google, Microsoft, or jQuery content delivery network (CDN).\
    \ I recommend and most often reference the library via a CDN because it’s faster.\
    \ A CDN will distribute your content across multiple, geographically dispersed\
    \ servers, so the user receives the closest available file. Plus, Google and Microsoft\
    \ both offer versions that support secure socket layers (SSL) via HTTPS, must-haves\
    \ if you’re doing any sort of development under SSL. To include the library via\
    \ a CDN (we’ll use Google as an example), use the `script` element to include\
    \ it within the `<head>` elements or at the end of your webpage.\n\n[Click here\
    \ to view code image](#images.html_p006pro01)\n\n```html\n<script type=\"text/javascript\"\
    \ src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\">\n\
    </script>\n```\n\nIncluding JavaScript files within the `<head>` elements is the\
    \ traditional approach. However, according to Yahoo!, “80 percent of the end-user\
    \ response time is on the front-end.” Most of that time is spent downloading assets,\
    \ such as style sheets, images, scripts, and so on. It’s obviously important to\
    \ reduce the number of assets, but it’s also becoming more common to include JavaScript\
    \ at the end of an HTML file. This is because scripts block parallel downloads,\
    \ meaning that other assets will not download until each script is downloaded\
    \ individually. To ensure that you’re placing your scripts in the correct place,\
    \ simply include them before the closing `</html>` tag.\n\nIt’s also best to use\
    \ the minified version in production environments, because it’s smaller than the\
    \ source version. In addition, although the packed version is smaller than the\
    \ minified version, it requires client-side processing time to decompress the\
    \ file and it’s not available in the most recent versions. According to Yahoo!,\
    \ “In a survey of ten top U.S. websites, minification achieved a 21 percent size\
    \ reduction.”\n\n## jQuery Fundamentals\n\nIf you’re familiar with writing JavaScript\
    \ and CSS, then writing your first jQuery script will feel very familiar, yet\
    \ maybe slightly odd. The jQuery framework is a JavaScript library, meaning that\
    \ it’s built with JavaScript. The fundamentals are the same, as you’re essentially\
    \ still writing JavaScript, it just so happens that you’ll be writing in a way\
    \ that uses the jQuery framework. In other words, while there may be added enhancements\
    \ to certain fundamentals, the core of JavaScript—variables, functions, conditional\
    \ statements, and so on—has not changed. So, you’ll still be using the `var` keyword,\
    \ `if` and `switch` statements, and functions, but you’ll surely notice a lot\
    \ of additional enhancements and different ways of writing things, namely accessing\
    \ HTML elements.\n\njQuery offers many enhancements to the JavaScript language\
    \ and, as mentioned, the best part is that it’s cross-browser compatible, so you\
    \ don’t have to worry about writing multiple versions of the same script to handle\
    \ different browsers anymore, which is quite a relief. This is especially useful\
    \ when working with events, Ajax (discussed later in this chapter), and other\
    \ functionality that traditionally requires some conditional statements to determine\
    \ how the browser will interpret the code.\n\n### Selecting HTML elements\n\n\
    Rather than continually using `document.getElementById()` to access HTML elements\
    \ within your webpage, you can simply use a jQuery selector `jquery()` or the\
    \ `$()` function, which is the shorthand version and the one that I will be using\
    \ throughout this book. Using the jQuery selector not only gives you fewer characters\
    \ to type, but also lets you do far more than access elements by `id`. With jQuery\
    \ selectors, you can also access an array of HTML elements or access an element\
    \ or object by name. The jQuery selector wraps an element or set of elements into\
    \ a jQuery object, allowing you to apply jQuery methods to the object itself.\
    \ And that’s not all: You can even access elements by class name or use CSS selectors\
    \ such as `:first-child`, `:nth-child`, among many others. Here are a few examples:\n\
    \n- To access an element by ID using the jQuery selector, use the `#id` selector,\
    \ just as you would with CSS when attaching a class to an element by ID:\n\n```javascript\n\
    $('#foo');\n```\n\n- To access an element by class name, use the `.class` selector,\
    \ just as you would when creating a CSS class. If you have multiple elements with\
    \ the same class name, they will all be selected.\n\n```javascript\n$('.foo');\n\
    ```\n\n- To target a specific element with a class name, add the element name\
    \ before the class name:\n\n```javascript\n$('div.foo');\n```\n\n- You can even\
    \ target a specific element or set of elements using an element selector:\n\n\
    ```javascript\n$('div');\n```\n\nIf you’re familiar with CSS, you’re probably\
    \ starting to see the pattern unfold and the endless possibilities. The options\
    \ available for structuring a CSS class are the same ones you can use to access\
    \ an HTML element with the jQuery selector. This is how jQuery enhances JavaScript\
    \ and CSS, taking the two and merging their syntax into a new language that enhances\
    \ the overall user experience, when properly used, of course.\n\n### Managing\
    \ events and functions\n\nEvents are used by jQuery to react to user interactions\
    \ on your webpage, such as mouse clicks. Events are very easy to manage in jQuery,\
    \ and they’re reliable across all the major browsers, which is a big deal, because\
    \ this isn’t always the case with traditional JavaScript. jQuery gives you the\
    \ ability to intercept many different events from any existing HTML element. Typically,\
    \ events are used to perform some sort of function. In the following example,\
    \ a `click` event is bound to a `div` element with `foo` as the class name:\n\n\
    [Click here to view code image](#images.html_p006pro01)\n\n```javascript\n$('div.foo').click(function(e)\
    \ {\n    // Your custom code here\n});\n```\n\nBy binding the `click` event to\
    \ the `div`, a function is associated with clicking the mouse on that particular\
    \ `div`. Therefore, anytime `div.foo` is clicked, your custom code in the function\
    \ will be executed.\n\nIf you’re familiar with traditional JavaScript, this syntax\
    \ probably looks strange. Don’t worry—it did to me as well when I first started,\
    \ but once I caught on, I liked it. Once you’re familiar with it, you’ll see that\
    \ this syntax is well contained, easy to understand, and easy to write. Let’s\
    \ break down the previous example:\n\n1. The jQuery selector is used to select\
    \ `div.foo`, which then becomes a jQuery object.\n2. The `div.foo` jQuery object\
    \ then uses the `click` method to fire a handler function when `div.foo` is clicked.\n\
    3. The handler function is used to execute the custom code. The handler also has\
    \ access to the `eventObject`, which is passed as an argument. In this example,\
    \ it is the `e` argument in the handler function.\n\nIf you use the jQuery selector\
    \ to select a class name that’s being used by multiple HTML elements and assign\
    \ a mouse event, that mouse event will be bound to all of those elements automatically.\
    \ Therefore, in the example above, if you had multiple `div` elements with `foo`\
    \ as the class name, the `click` event would be bound to all of them. When working\
    \ with events that are bound to multiple elements, it’s important to consider\
    \ scope to ensure that any custom code you’re executing is applied to the desired\
    \ element.\n\n[Click here to view code image](#images.html_p009pro01)\n\n```javascript\n\
    $('div.foo').click(function(e) {\n    alert($(this).html());\n});\n```\n\nIn this\
    \ example, `$(this)` is used to access the current element in scope.\n\n* *\n\n\
    ![Image](graphics/note.jpg) Note\n\nScope is the enclosing context that values\
    \ are associated with. In this case, the function is the enclosing context and\
    \ `$(this)` is the value.\n"
