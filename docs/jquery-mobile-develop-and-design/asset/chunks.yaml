  trans: "\n\n在安装了 jQuery Mobile 模块和主题后，你可以自定义各种设置。主题允许你为不同的表单元素配置许多色块（swatches）。如果你访问\
    \ Drupal 管理区域的“Appearance”页面并点击 jQuery Mobile 主题旁边的“Settings”链接，你将在 JQM Settings\
    \ 部分看到一组选项，如图图 16.15 所示。\n\n![Image](img/jquery-16-15.jpg)\n\n图 16.15。（左）Drupal\
    \ 安装中的 jQuery Mobile 主题设置。\n\n你还可以在 jQuery Mobile 模块中配置设置。要编辑这些设置，请访问“Modules”页面，向下滚动找到\
    \ jQuery Mobile 模块，并选择模块旁边的“Configuration”链接。在该页面，你将看到一个名为 `File Settings` 的区域，如图\
    \ 16.16 所示。如果你选择此标题，它将展开并显示文本框，你可以使用这些框来设置 jQuery 库和 jQuery Mobile 框架的版本，以及上传到\
    \ Drupal 安装的文件的路径位置，如图图 16.10 所示。\n\n![Image](img/jquery-16-16.jpg)\n\n图 16.16。（右）Drupal\
    \ 安装中的 jQuery Mobile 模块设置。\n\n### 添加内容\n\n要创建更多页面和博客文章，你需要登录 Drupal 管理区域。在这里，你可以通过“Content”页面管理所有内容：选择“Add\
    \ content”来选择内容类型。在此页面上有两个默认内容类型：Article（文章）和 Basic page（基本页面）。要创建博客文章，选择 Article，输入标题，并在图\
    \ 16.17 所示的 Web 表单的 Body 字段中编写你的文章。\n\n![Image](img/jquery-16-17.jpg)\n\n图 16.17。（左）在\
    \ Drupal 中创建博客文章。\n\n默认情况下，这篇博客文章出现在你的 Drupal 网站首页上（[图 16.18）。\n\n![Image](img/jquery-16-18.jpg)\n\
    \n图 16.18。（右）带有博客文章的 Drupal 站点。\n\n要创建一个页面，返回“Content”，选择“Add Content”并选择 Basic\
    \ page。使用页面上的 Web 表单创建你的页面。在示例中，我们正在创建一个名为“Home”的页面，它最终将成为网站的首页（[图 16.19]）。\n\n\
    ![Image](img/jquery-16-19.jpg)\n\n图 16.19. 在 Drupal 中创建一个基本页面。\n\n你可以使用此新页面作为\
    \ Drupal 安装的首页。要将某个页面定义为首页，请访问“Configuration”页面，选择“Site information”，并向下滚动直到看到“Default\
    \ front page”。在这里，你会看到你的 Drupal 网站的 URL，并带有一个文本框，用于输入你想要使用的页面的节点 ID（node ID）。在查看任何基本页面时，你可以在浏览器地址栏中找到此节点\
    \ ID；在本示例中，我们的节点 ID 是 1，因此我们在文本框中输入了 `node/1`（[图 16.20]）。\n\n![Image](img/jquery-16-20.jpg)\n\
    \n图 16.20. 在 Drupal 中设置自定义首页。\n\n就是这样！[图 16.21]]显示了带有自定义首页的最终 Drupal 网站。\n\n![Image](img/16fig21.jpg)\n\
    \n图 16.21. 带有自定义首页的最终 jQuery Mobile Drupal 网站。\n\n### 总结\n\n使用本章介绍的 Drupal 以及\
    \ jQuery Mobile 主题和模块可以让你快速创建一个强大的移动端内容管理系统（CMS）并让其投入运行。通过你在书中所学到的技巧，你可以利用 jQuery\
    \ Mobile 框架提供的小部件、格式和其他功能，创建独特且自定义的网页。现在，没有什么可以阻碍你创建一个具有完整移动能力的强大 CMS 了。\n\n#\
    \ 第五部分：超越 jQuery Mobile\n\n## 17. 检测移动设备\n\n移动端网站通常与主网站（那些旨在供桌面电脑或笔记本电脑查看的网站）分开开发，尽管它们可能使用许多相同的内容。为了确保你的网站为移动设备量身定制，你会希望检测移动设备何时访问站点，然后将设备重定向到专门为移动设备制作的标记。你可能还希望根据特定的移动设备提供网站布局和内容。在本章中，你将学习如何实现这两种方法。让我们开始学习如何检测移动设备何时访问你的网站。\n\
    \n### 使用 PHP\n\n由于 PHP 是 Web 上最流行的脚本语言之一，让我们来看一个跨广泛移动设备执行移动检测的 PHP 函数。该函数非常简单，并且很容易扩展和修改：\n\
    \n点击此处查看代码图片\n\n```\nfunction mobile_detect(){\n    $mobile_devices = '/(alcatel|amoi|android|avantgo|blackberry|benq|cell|cricket|docomo|elaine|htc|iemobile|iphone|ipad|ipaq|ipod|j2me|java|midp|mini|mmp|mobi|motorola|nec|nokia|palm|panasonic|philips|phone|sagem|sharp|smartphone|symbian|telus|vodafone|wap|webos|wireless|xda|xoom|zte)/i';\n\
    \    if (preg_match($mobile_devices, $_SERVER['USER_AGENT'])) {\n        return\
    \ true;\n    } else {\n        return false;\n    }\n}\n```\n*(注：此处原文代码中存在一些语法错误，如多余的括号和引号，在翻译时已保持其原始逻辑或进行了微调以符合可读性，但根据指令“代码块不需要翻译”的原则，此处保留了代码的逻辑结构。)*\n\
    \n### 世界上有多少种移动设备类型？\n\n示例中的正则表达式并没有涵盖所有的移动设备类型。今天有成百上千不同的可以上网的类型。管道符号（|`）表示设备之间的“或”关系。\n\
    \n你如何决定将哪些设备包含在测试中？坦率地说，只有你自己知道答案，因为这取决于你的移动网站受众。你可以找到许多在线来源。其中一个来源是 [useragentstring.com](https://www.useragentstring.com)，该网站定期更新且非常准确。你可以在\
    \ [www.useragentstring.com/pages/Browserlist/](http://www.useragentstring.com/pages/Browserlist/)\
    \ 找到它。\n\n### 识别浏览器\n\n如果你需要添加手机的用户代理字符串，指示浏览器的字符串非常简单。只需在字符串中插入一个管道符号，后面跟着手机的用户代理字符串。列表不需要按字母顺序排列。\n\
    \n一旦你创建了搜索字符串，就可以使用 PHP 的 `preg_match` 函数进行测试。该函数的第一个参数是你的移动设备变量，第二个参数是 PHP 全局数组\
    \ `$_SERVER` 的一部分，特别是 `USER_AGENT`。当 Web 浏览器向服务器请求信息时，它会服务器发送大量自身的信息以生成请求。如果服务器端语言是\
    \ PHP（这种相同的信息在其他服务器端语言中可用），大部分信息存储在 `$_SERVER` 数组中。这就是判断移动设备是否访问你网站的关键。\n\n###\
    \ 更多关于正则表达式\n\n虽然学习正则表达式可能枯燥且可怕，但它可以是你编程工具箱中非常有价值的一部分。幸运的是，网上有很多资源。以下是一些推荐的网站：\n\
    \n"
- fmt: "\n[www.regular-expressions.info/](http://www.regular-expressions.info/) covers\
    \ a wide range of materials for developing, testing, and using regular expressions.\n\
    \n[http://regexlib.com/](http://regexlib.com/) provides a searchable library of\
    \ commonly used regular expressions—perfect for the developer who doesn’t want\
    \ to write his own!\n\n[http://regexpal.com/](http://regexpal.com/) makes it easy\
    \ to develop and test regular expressions in real time.\n\n## Calling the PHP\
    \ function\n\nTo use the PHP mobile detection function you created, you need to\
    \ call it from the page you expect the mobile device to access. In this example,\
    \ the function has been saved in a separate file called `mobile_detection.php`:\n\
    \n[Click here to view code image](#images.html_p256pro01)\n\n```php\ninclude('path/to/mobile_detection.php');\n\
    \n$mobile_device = mobile_detect();\n\n// Perform a redirection if a mobile device\
    \ is detected\n\nif($mobile_device == true) {\n    header('Location: http://m.mywebsite.com');\n\
    \    exit();\n}\n```\n\nThe code here is fairly self-explanatory. You store the\
    \ result of the function in a variable named `$mobile_device` and test that variable\
    \ to see whether it’s true or false. If it’s true, you redirect the mobile device’s\
    \ browser to the content you want that device to consume. You can use the function\
    \ on any page and set custom redirections if you like. The result of the current\
    \ function redirects the browser to [http://m.mywebsite.com](http://m.mywebsite.com),\
    \ as seen in [Figure 17.1](#ch17.html_ch17fig01).\n\n![Image](graphics/jquery-17-1.jpg)\n\
    \nFigure 17.1\\. The web URL in a normal browser and the URL the mobile device\
    \ is redirected to use.\n\nYou could return the user agent string from the function\
    \ so you could perform certain actions based on which kind of device is accessing\
    \ the website. Rather than do that, let’s learn how to detect specific devices\
    \ with JavaScript when the browser arrives at the mobile site.\n\n### Using JavaScript\
    \ to Detect Specific Devices\n\nIn some cases, you’ll want to know what specific\
    \ mobile device is accessing your mobile website or application so you can have\
    \ some control over the user’s experience. This control might come in the form\
    \ of enabling or disabling certain functions or displaying data and content tailored\
    \ to the user’s specific device.\n\nThe technique is surprisingly similar to the\
    \ method we used for PHP. Let’s examine a couple of ways to detect a specific\
    \ mobile device, first using pure JavaScript and then using jQuery.\n\n#### Detecting\
    \ mobile devices with JavaScript\n\nIn JavaScript, as with PHP, you’ll use a regular\
    \ expression to search through the device’s user agent string. From there you\
    \ can add code to provide specific functionality in your mobile website based\
    \ on the device accessing the site.\n\nHere’s a simple example:\n\n[Click here\
    \ to view code image](#images.html_p257pro01)\n\n```javascript\nvar mobile_device\
    \ = navigator.userAgent.match(/(iPad)|(iPhone)/i);\n\nif(mobile_device) {\n  \
    \  // your code handling specific functionality for these devices\n} else {\n\
    \    // your code to handle functionality outside of these devices\n}\n```\n\n\
    As you can see, you’re using a regular expression to look for a match to the user\
    \ agent string. JavaScript gathers user agent information in its `navigator` object,\
    \ and you can access that information in `navigator.userAgent`.\n\nOn an iPhone\
    \ 4 using Safari as the browser, the user agent string might look something like\
    \ this:\n\n[Click here to view code image](#images.html_p257pro02)\n\n```\nMozilla/5.0\
    \ (iPhone; U; CPU iPhone OS 4_3_3 like Mac OS X; en-us) AppleWebKit/533.17.9 (KHTML,\
    \ like Gecko) Version/5.0.2 Mobile/8J2 Safari/6533.18.5\n```\n\nUsing JavaScript’s\
    \ `match()` method, you can determine whether the `navigator.userAgent` has a\
    \ match in the regular expression `/(iPad)|(iPhone)/i`. If you were using the\
    \ tool at [http://regexpal.com](http://regexpal.com) to test your regular expression,\
    \ it would look like [Figure 17.2](#ch17.html_ch17fig02).\n\n![Image](graphics/jquery-17-2.jpg)\n\
    \nFigure 17.2\\. The regular expression appears in the upper pane while the lower\
    \ pane highlights the matches found in the user agent string.\n\nNow that you\
    \ know how to test for specific mobile devices, you can build functionality into\
    \ your site that lets you provide custom information and interactivity for those\
    \ devices. Here’s a sample of a JavaScript `switch` statement that illustrates\
    \ how to code this:\n\n[Click here to view code image](#images.html_p258pro01)\n\
    \n```javascript\nvar mobile_device = navigator.userAgent;\n\nswitch(true) {\n\
    \    case /(iPad)|(iPod)|(iPhone)/i.test(mobile_device):\n        // code for\
    \ these devices\n        break;\n\n    case /(android)/i.test(mobile_device):\n\
    \        // code for this device\n        break;\n\n    default:\n        // code\
    \ for other devices\n        break;\n}\n```\n\nKeep in mind that regular expression\
    \ testing can be expensive in terms of processing, so don’t get carried away with\
    \ lots of tests.\n\n![Image](graphics/note.jpg) Note\n\nVisit [http://detectbrowsers.com/](http://detectbrowsers.com/)\
    \ for open-source ready-made code as you need.\n\n#### Detecting browser features\
    \ with jQuery\n\nUsing pure JavaScript to detect mobile devices is the way to\
    \ go when you need to know if a mobile device is accessing your website. You can\
    \ go one step further and determine if a certain feature is supported with jQuery\
    \ using `$.support`.\n\nTechnically, you can’t do device detection with jQuery,\
    \ but you can determine whether the browser—mobile or otherwise—will support certain\
    \ features. This allows you to be browser agnostic during development.\n\nFor\
    \ instance, you may want to know if the browser accessing your site adheres to\
    \ the World Web Consortium’s box model recommendation because portions of your\
    \ layout rely on that feature. The following jQuery code will determine if the\
    \ box model feature is true:\n\n`$.support.boxModel;`\n\nNow you can handle exceptions\
    \ with a test:\n\n[Click here to view code image](#images.html_p259pro01)\n\n\
    ```javascript\nvar box_model = $.support.boxModel;\n\nif(!box_model) {\n    //\
    \ place your exception handling code here\n}\n```\n\nHere’s a partial list of\
    \ the features you can detect using `.support`:\n\n- `ajax` will be `true` if\
    \ the browser can support `XMLHttpRequest`.\n- `cors` will be `true` if the browser\
    \ can support cross-domain `XMLHttpRequest`.\n- `opacity` will be `true` if the\
    \ browser supports this CSS property (all IE browsers will return false as they\
    \ use alpha filters).\n- `submitBubbles` will be true if a submit event can bubble\
    \ up the DOM tree.\n\nTo find the rest of the list of jQuery `.support` properties,\
    \ visit [http://api.jquery.com/jQuery.support/](http://api.jquery.com/jQuery.support/).\n\
    \n### Wrapping Up\n\nDetecting when a mobile device accesses your website and\
    \ getting specific information about that device could not be easier to do now\
    \ that you have a solid code foundation for building your jQuery Mobile websites\
    \ and applications.\n\nYou have several good tools available to you for configuring\
    \ and testing regular expressions and digging deeper into user agent strings.\
    \ With a firm grasp of these tools, it’s easy to develop mobile device detection\
    \ for any website.\n\nThe next question is, “How do I test my websites on as many\
    \ mobile devices as possible?” Most of us can’t afford to purchase all the mobile\
    \ devices available, so we’ll turn our attention to mobile device simulators.\
    \ That’s up next!\n"
