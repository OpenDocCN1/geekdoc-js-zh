    The screen of the emulator is uncluttered (**[Figure 18.2](#ch18.html_ch18fig02)**),
    making it easy to work with your mobile site. The downside is that the browser
    inherits the user agent string from the parent browser, making it difficult to
    test actions that rely on specific mobile devices. Additionally, you can’t access
    sites that you may be working with locally (localhost); you must upload your sites
    to a server accessible from the web.


    ![Image](graphics/jquery-18-2.jpg)


    Figure 18.2\. The uncluttered layout of the website at [mobilephoneemulator.com](http://mobilephoneemulator.com).
    The user agent string inherited its attributes from the parent browser.


    If you’re testing layout, this is a great tool. You can switch between devices
    quickly. Devices are rendered with the proper screen width and height (there’s
    a mode to enlarge the screen size so you can attend to details), which makes it
    perfect for capturing screenshots of your sites on different devices.


    • **Opera Mini at [www.opera.com/developer/tools/mini/](http://www.opera.com/developer/tools/mini/)**


    Although Opera Mini may not be one of the most widely used browsers, a growing
    number of people choose to download it and use it instead of the browsers that
    come packaged with their mobile devices. The online test site (**[Figure 18.3](#ch18.html_ch18fig03)**)
    is clean and easy to use.


    ![Image](graphics/jquery-18-3.jpg)


    Figure 18.3\. The Opera Mini simulator.


    Be aware of the way that Opera Mini interprets Cascading Style Sheets (CSS). Sometimes,
    more complex layouts aren’t rendered as you would expect. It does correctly report
    most user agent strings if you need those to be available when testing, and you
    must upload your sites to a web-accessible server to test.


    • **Mobile Websites 4U at [www.mobilewebsites4u.com/tester/](http://www.mobilewebsites4u.com/tester/)**


    This simulator is great, but it has some limitations, such as offering only four
    different screen layouts and inheriting the user agent string from the parent
    browser. It also uses a desktop browser scroll bar that may affect your site’s
    layout. Have a look at **[Figure 18.4](#ch18.html_ch18fig04)**, and you’ll see
    how the scroll bar eats up some screen real estate.


    ![Image](graphics/jquery-18-4.jpg)


    Figure 18.4\. The desktop’s standard scroll bar is used in the Mobile Websites
    4U simulator rather than something more befitting a mobile browser.


    One significant advantage is that you can test from your local machine without
    having to upload your site files to a web server. Having the ability to quickly
    check your layout is a real plus for any mobile device emulator.


    ### Using Simulators for Testing


    Now that you have some simulators in your toolbox, it’s time to incorporate them
    into your development workflow. Let’s start by testing in the online emulators.


    #### Testing with online emulators


    For most online emulators, all you’re required to do is upload your mobile site
    to a web server, navigate to the online emulator, and type the URL (many will
    require that you type the `http://` prefix to the URL) into the emulator’s address
    bar. If all is well, you’ll see your mobile site in the screen of the simulator.'
