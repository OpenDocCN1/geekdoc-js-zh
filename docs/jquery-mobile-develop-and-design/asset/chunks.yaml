    class. This class sets a combination of properties that center the text, add a
    margin, create ellipses for overflowing text, and more. The framework also adds
    a tabindex that automatically makes the webpages more accessible by creating a
    logical tabbing sequence, which is used by mobile devices like iOS with their
    built-in Next button. Headers can also include elements other than headings; buttons,
    for example, can be important additions to your toolbars.


    #### Adding buttons


    With the button options discussed in [Chapter 5](#ch05.html_ch05), “[Dialog Windows
