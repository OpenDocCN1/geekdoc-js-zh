    数据库设置好后，访问网站并通过添加站点标题和创建管理员用户完成安装过程（图 15.3）。记住你创建此账户时使用的密码，因为在安装完成后你需要用到它。


    ![Image](img/jquery-15-3.jpg)


    图 15.3。WordPress 安装过程。


    大功告成！安装好 WordPress 后，你现在可以使用刚刚输入的用户名和密码登录 WordPress 管理区域了。在管理区域内，你可以完全管理你的网站。例如，你可以创建网页、博客文章和用户，还可以安装插件和主题。尽管如此，现在是时候为我们的示例网站设置
    `jQuery Mobile` 主题了。


    ### 创建 jQuery Mobile 主题


    在 WordPress 中添加主题非常简单。你所做的就是下载、购买或创建一个主题，然后将其上传到 WordPress 站点内的 `/wp-content/themes/`
    目录。一旦到达那里，你只需要激活该主题，大功告成了。接下来的示例使用了来自 Francis Robert 的 `jQuery Mobile` 主题，他是一位自由
    Web 程序员，他拥有我目前为止发现的功能最强大的 `jQuery Mobile` WordPress 主题。你可以在他博客的 WordPress 分类中找到它：[`frobert.com`](http://frobert.com。（感谢，Francis！看到开发者们互相分享优秀的东西真是太棒了。）


    一旦你下载了 `jQuery Mobile` 主题，就可以像之前提到的那样将其到 `/wp-content/themes/` 目录。上传主题后，登录 WordPress
    管理区域，并从左侧边栏访问“外观 > 主题”（Appearance > Themes）页面。到达后，选择 `jQuery Mobile` 主题下方的“激活”（Activate）链接（图
    15.4）。


    ![Image](img/jquery-15-4.jpg)


    图 15.4。激活 jQuery Mobile WordPress 主题。


    激活后，WordPress 网站将包含 `jQuery Mobile` 主题，该主题默认使用预构建的“a”主题。要更改此，你可以从 WordPress 管理区域左侧边栏访问“外观
    > 编辑器”（Appearance > Editor）页面。在编辑器页面的右侧边栏中，有一个名为 `preferences.php` 的文件。点击此文件名，它将加载到页面中间的文本区域中。你可以编辑此文件并保存更改。图
    15.5 显示了 WordPress 管理区域中 `jQuery Mobile` 主题的编辑模式的貌。编辑 `$jqtheme` 值将分配相应的 `jQuery
    Mobile` 主题并更改网站的外观。


    ![Image](img/jquery-15-5.jpg)


    图 15.5。（左）配置 jQuery Mobile WordPress 主题。


    一旦安装、激活并配置完成，`jQuery Mobile` 主题会自动将你的 WordPress 网站的前端转换为 `jQuery Mobile` WordPress
    网站。图 15.6 显示了带有 Francis Robert 的 `jQuery Mobile` 主题的默认 WordPress 安装示例。这些是非常强大的功能。


    ![Image](img/jquery-15-6.jpg)


    图 15.6。（右）带有 Francis Robert 的 jQuery Mobile WordPress 主题的默认 WordPress 安装。


    图 15.6 还说明了当访问者从首页选择一个链接列表项时发生的发生顺序。首页包含了一篇标题为“Hello world!”的默认博客文章。通过选择此文章作为链接列表项，页面将跳转到博客文章，可以在那里阅读完整的描述和评论；甚至可以从该页面发表评论。


    ### 添加博客文章和页面


    要创建更多页面和博客文章，你只需要登录 WordPress 管理区域。登录后，你可以通过左侧边栏的导航管理你所有的内容。要创建新的博客文章，请选择 `文章
    > 写写`（Posts > Add New）（图 15.7）。


    ![Image](img/jquery-15-7.jpg)


    图 15.7。（左）创建新的博客文章。


    从此网页，你可以添加标题和描述，并选择分类和标签。你可以点击右上角模块中的蓝色“发布”（Publish）按钮将博客文章保存为草稿或将其发布。一旦发布，你可以通过访问
    WordPress 网站的首页来查看博客文章（图 15.8）。


    ![Image](img/jquery-15-8.jpg)


    图 15.8。（右）查看新的博客文章。


    要在 WordPress 中创建网页，请访问左侧边栏的“页面 > 新页面”（Pages > Add New）（图 15.9）。和博客文章一样，你可以添加标题和描述，但对于页面，还可以选择父页面并设置页面在网站主菜单中显示的顺序。完成后，点击右上角模块中的蓝色“发布”（Publish）按钮发布网页。


    ![Image](img/jquery-15-9.jpg)


    图 15.9。（左）创建新的网页。


    当新页面发布时，它将出现在网站顶部的主菜单中（图 15.10）。


    ![Image](img/jquery-15-10.jpg)


    图 15.10。（右）查看新网页。


    默认情况下，博客文章按日期列在首页。要更改首页显示的内容，访问“设置 > 阅读”（Settings > Reading），将首页设置为一个网页，并将博客文章设置为一个特定的网页。在这种情况下，使用了标题为“博客”的页面（图
    15.11）。


    ![Image](img/jquery-15-11.jpg)


    图 15.11。（左）设置首页和博客。


    完成后，标题为“首页”的页面将成为首页，标题为“博客”的页面将是列出博客文章的页面（图 15.12）。


    ![Image](img/jquery-15-12.jpg)


    图 15.12。（右）WordPress 网站。


    ## 安装移动 Drupal 主题


    Drupal 是另一个内容管理系统（CMS），驱动着数百万网站和应用程序。与 WordPress 一样，你可以通过添加自定义功能或整合来自社区的模块和主题来构建博客、网站甚至企业应用。本章将介绍如何在服务器上安装
    Drupal，然后解释如何获取 `jQuery Mobile` Drupal 主题和模块、如何安装它们以及如何创建新页面。


