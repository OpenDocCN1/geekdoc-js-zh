    ## Introducing the Future of Web Development


    Smartphone, tablet, and e-reader statistics are showing an unprecedented adoption
    rate, making the mobile web a very hot topic and requiring a new set of skills
    from web developers and designers. Mobile device usage is skyrocketing; according
    to Nielsen’s third-quarter 2011 Mobile Media Report, “44 percent of U.S. mobile
    subscribers now own a smartphone device, compared to 18 percent just two years
    ago.” That’s more than double in two years, and “the number of smartphone subscribers
    using the mobile Internet has grown 45 percent since 2010.” As for tablets, in
    June 2011 AMI-Partners (Access Markets International) forecasted that “tablet
    adoption among businesses with between 1 and 1,000 employees will grow by 1,000
    percent by 2015.”


    Let’s not forget e-readers, which are becoming very affordable and are more advanced
    then ever, increasing in shipment volume, as “year-over-year growth was 167%”
    according to International Data Corporation (IDC). With the introduction of the
    latest Kindle, mobile Internet access is now becoming a normal experience.


    With these increases in adoption rate, there will no doubt be high demand for
    web developers who can create rich mobile web experiences. The jQuery Mobile framework
    gives web developers a quick and easy way to create mobile web experiences, making
    the mobile web space hard to ignore.


    ### Why jQuery Mobile?


    As a web developer, you don’t have to use the jQuery Mobile framework to create
    a mobile web experience. So why use it? For starters, the framework is built on
    the highly respected and widely used jQuery core and jQuery user interface (UI)
    foundation. It’s currently sponsored by companies such as Mozilla, Palm, Adobe,
    Nokia, BlackBerry, and more. Plus, it works seamlessly across all popular mobile
    device platforms. The jQuery Mobile team is actively and regularly offering new
    releases, blogging about new features, and keeping their comprehensive online
    documentation up to date.


    Most web developers and designers agree that browser and cross-platform testing
    is something they would rather not spend their time on. Imagine all of the devices
    that could potentially be accessing your mobile website. Then imagine having to
    test all of those platforms each and every time you build a mobile website—this
    would be painstaking and incredibly time-consuming. jQuery Mobile gives you this
    support from the start, as the team prides the framework on its approach to supporting
    a wide variety of mobile platforms. The framework is built on clean, semantic
    HTML, which ensures compatibility with a majority of web-enabled devices.


    The framework also includes accessibility features, such as WAI-ARIA (Web Accessibility
    Initiative-Accessible Rich Internet Applications), a technical specification published
    by the World Wide Web Consortium regarding the increase of accessibility of webpages,
    which are integrated into the framework to support screen readers, such as VoiceOver
    on Apple iOS and other assistive technologies. Simply including the jQuery Mobile
    framework in your website unobtrusively transforms your code from semantic HTML
    into a rich, interactive, and accessible mobile experience using jQuery and CSS.
    As you’ll see throughout this book, the jQuery Mobile approach makes mobile web
    development incredibly easy, quick, and efficient, leaving the platform and browser
    testing up to the jQuery Mobile team.


    jQuery Mobile isn’t exclusively for web developers; web designers have access
    to the jQuery UI, which provides complete design control over mobile web applications.
    Built-in UI widgets, such as list views, dialogs, toolbars, search mechanisms,
    and a full set of form elements, are all customizable via the theme framework.
    Later in the book, you’ll also learn about ThemeRoller, which lets you create
    up to 26 theme swatches using a simple, web-based interface. User experience (UX)
    designers also get some love, with access to stencils for OmniGraffle and Visio.
    And, of course, if you want to get geeky with it, the application programming
    interface (API) is available to web developers. As a web developer, you can configure
    defaults, handle many different events, and work with several exposed methods
    and properties.'
