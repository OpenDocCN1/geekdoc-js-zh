    \ `pagebeforeshow` 事件在它的 `ui` 数据对象中包含 `prevPage` 属性。该属性代表即将显示的页面。\n*   `pagebeforehide`\
    \ 事件在它的 `ui` 数据对象中包含 `nextPage` 属性。该属性代表正在切换到的页面。\n*   `pageshow` 事件在它的 `ui` 数据对象中包含\
    \ `prevPage` 属性。该属性代表正在离开的页面。\n*   `pagehide` 事件在它的 `ui` 数据对象中包含 `nextPage` 属性。该属性代表正在切换到的页面。\n\
