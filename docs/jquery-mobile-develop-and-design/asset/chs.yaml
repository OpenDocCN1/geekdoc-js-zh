  \n要在 WordPress 中创建网页，请访问左侧边栏的“页面 > 新页面”（Pages > Add New）（图 15.9）。和博客文章一样，你可以添加标题和描述，但对于页面，还可以选择父页面并设置页面在网站主菜单中显示的顺序。完成后，点击右上角模块中的蓝色“发布”（Publish）按钮发布网页。\n\
  \n![Image](img/jquery-15-9.jpg)\n\n图 15.9。（左）创建新的网页。\n\n当新页面发布时，它将出现在网站顶部的主菜单中（图\
  \ 15.10）。\n\n![Image](img/jquery-15-10.jpg)\n\n图 15.10。（右）查看新网页。\n\n默认情况下，博客文章按日期列在首页。要更改首页显示的内容，访问“设置\
  \ > 阅读”（Settings > Reading），将首页设置为一个网页，并将博客文章设置为一个特定的网页。在这种情况下，使用了标题为“博客”的页面（图 15.11）。\n\
  \n![Image](img/jquery-15-11.jpg)\n\n图 15.11。（左）设置首页和博客。\n\n完成后，标题为“首页”的页面将成为首页，标题为“博客”的页面将是列出博客文章的页面（图\
  \ 15.12）。\n\n![Image](img/jquery-15-12.jpg)\n\n图 15.12。（右）WordPress 网站。\n\n## 安装移动\
  \ Drupal 主题\n\nDrupal 是另一个内容管理系统（CMS），驱动着数百万网站和应用程序。与 WordPress 一样，你可以通过添加自定义功能或整合来自社区的模块和主题来构建博客、网站甚至企业应用。本章将介绍如何在服务器上安装\
  \ Drupal，然后解释如何获取 `jQuery Mobile` Drupal 主题和模块、如何安装它们以及如何创建新页面。\n\n### 入门\n\n\n\n\
  \n一旦你设置好了 Web 服务器，就不需要上传 Drupal 文件，然后下载一个 MySQL 数据库来配置 Drupal。有很多免费的 MySQL 应用程序供你下载并用于数据库。本示例使用了适用于\
  \ Mac OS 的 `Sequel Pro`，你可以在 [www.sequelpro.com](http://www.sequelpro.com) 找到它。对于本章的示例，我们将使用\
  \ `Sequel Pro` 创建名为 `jqm-drupal` 的数据库，如图图 16.1 所示。\n\n![Image](img/jquery-16-1.jpg)\n\
  \n图 16.1。添加了一个名为 `jqm-drupal` 的数据库以存储 Drupal 数据。\n\n数据库设置完成后，访问网站并完成六步安装过程。第一步是选择配置（图\
  \ 16.2）。除非你完全清楚自己想要什么，否则请选择 `Standard` 选项，因为它包含了常用功能，可以防止你在 Drupal 配置上浪费时间去重复造轮。\n\
  \n![Image](img/jquery-16-2.jpg)\n\n图 16.2。为 Drupal 安装过程选择配置。\n\n现在是选择语言的时间（图 16.3）。默认情况下，英语是唯一的选项，但你可以点击此网页上的链接来了解如何使用其他语言安装\
  \ Drupal。\n\n![Image](img/jquery-16-3.jpg)\n\n图 16.3。为 Drupal 安装过程选择语言。\n\n选择语言后，系统将验证技术要求。如果技术要求未通过验证，将显示一个问题列表。在移动到下一个安装步骤之前，你需要解决所有问题。问题通常是需要调整的简单文件权限。一旦验证过程完成，下一步是数据库配置（图\
  \ 16.4）。这一步包括选择数据库类型，在本例中为 MySQL。输入数据库登录信息，包括数据库名称 `jqm-drupal` 以及你创建数据库时使用的数据库用户名和密码。\n\
  \n![Image](img/jquery-16-4.jpg)\n\n图 16.4。（左）Drupal 安装过程的数据库配置步骤。\n\n现在是输入站点信息的时间（图\
  \ 16.5），例如站点名称和用于自动电子邮件（如注册信息）的站点电子邮件地址，以及管理员账户的用户名、电子邮件地址和密码。记住这些登录信息非常重要：你需要它们来登录\
  \ Drupal 管理区域。\n\n![Image](img/jquery-16-5.jpg)\n\n图 16.5。（右）Drupal 安装过程的站点配置步骤。\n\
  \n最后，你将看到一个祝贺屏幕，并查看你的新 Drupal 网站（图 16.6）。\n\n![Image](img/jquery-16-6.jpg)\n\n图\
  \ 16.6。Drupal 安装过程已成功完成。\n\n安装 Drupal 后，你可以使用刚刚输入的用户名和密码登录 Drupal 管理区域。在管理区域内，你可以完全管理你的网站：你可以创建网页、博客文章和用户，还可以安装模块和主题。现在是为我们的示例网站设置\
  \ jQuery Mobile 主题了。\n\n字体 使用 jQuery Mobile 为 Drupal 主题化\n\n在 Drupal 中添加 jQuery\
  \ Mobile 主题相当简单，但没有 WordPress 那么容易。Drupal 需要安装两个项目才能使用 jQuery Mobile 主题：jQuery Mobile\
  \ 模块和 `jQM` 主题。\n\n### 安装 jQuery Mobile 模块\n\n创建 jQuery Mobile 模块是为了增强主题并提供管理功能，例如选择框架版本、设置色块（swatches），甚至对单个菜单和其他布局元素进行主题化。你可以在\
  \ [`drupal.org/project/jquerymobile`](http://drupal.org/project/jquerymobile) 找到更多该模块的信息。下载后，需要将此模块放在\
  \ Drupal 安装的 `sites/all/modules/` 目录下。在模块文件夹内有一个名为 `README.txt` 的文件，列出了完成安装的步骤（图\
  \ 16.7）。\n\n![Image](img/jquery-16-7.jpg)\n\n图 16.7。jQuery Mobile 模块安装过程。\n\n此过程的第一步是在\
  \ `sites/all` 目录下创建一个名为 `libraries` 的目录（图 16.8）。\n\n![Image](img/jquery-16-8.jpg)\n\
  \n图 16.8。创建一个 `libraries` 目录。\n\n在该目录下，创建一个名为 `jquery` 的目录（图 16.9）。\n\n![Image](img/jquery-16-9.jpg)\n\
  \n图 16.9。创建一个 `jquery` 目录。\n\n将 jQuery Mobile 框架和 jQuery 库下载并复制到你刚刚创建的 `jquery`\
  \ 目录中（图 16.10）。\n\n![Image](img/jquery-16-10.jpg)\n\n图 16.10。（左）jQuery Mobile 框架和\
  \ jQuery 库。\n\n在 `jquery` 目录下创建一个名为 `custom` 的目录（图 16.11）。\n\n![Image](img/jquery-16-11.jpg)\n\
  \n图 16.11。（右）创建一个 `custom` 目录。\n\n在 `settings.php` 文件中，你可以添加以下变量：\n\n```php\n$conf['jquerymobile_front']\
  \ = 0;\n$conf['jquerymobile_ns'] = '';\n$conf['jquerymobile_autoInitialize'] = true;\n\
  $conf['jquerymobile_subUrl'] = '';\n$conf['jquerymobile_activePage'] = '';\n$conf['jquerymobile_activeBtn']\
  \ = '';\n$conf['jquerymobile_ajaxEnabled'] = true;\n$conf['jquerymobile_hashEnabled']\
  \ = '';\n$conf['jquerymobile_defaultTransition'] = 'slide';\n$conf['jquerymobile_defaultDialog']\
  \ = '';\n$conf['jquerymobile_minScrollBack'] = '';\n$conf['jquerymobile_loadingMessage']\
  \ = '';\n$conf['jquerymobile_errorMessage'] = '';\n```\n\n最后是在 Drupal 管理区域激活该模块。访问模块部分找到\
  \ jQuery Mobile 模块，它应该出现在 Mobile 部分（图 16.12）。\n\n![Image](img/jquery-16-12.jpg)\n\
  \n图 16.12。激活 jQuery Mobile 模块。\n\n### 安装 jQuery Mobile 主题\n\n在 jQuery Mobile 模块安装、配置并激活后，该是主题的时间了。你可以从\
  \ [`drupal.org/project/jqm`](http://drupal.org/project/jqm) 下载 `jQM` 主题。此主题将网站的前端转换为\
  \ jQuery Mobile 体验。该主题需要 `jquerymobile` 模块，因此在使用此主题之前下载并安装它是重要的。幸运的是我们刚刚完成了，现在是设置主题了。\n\
  \n下载主题后，将其放在 Drupal 安装的 `sites/all/themes/jqm/` 目录下。要激活主题，进入 Drupal 管理区域的 Appearance\
  \ 页面并选择主题下方的 `Enable` 链接（图 16.13）。\n\n![Image](img/jquery-16-13.jpg)\n\n图 16.13。（左）激活\
  \ jQuery Mobile 主题。\n\n默认情况下主题不会包含任何页面或文章，因此当你访问网站时将看到登录屏幕。然而，你应该看到 jQuery Mobile\
  \ 主题现在已激活并驱动着页眉、页脚、文本框和按钮的样式（图 16.14）。\n\n![Image](img/jquery-16-14.jpg)\n\n图 16.14。（右）带有\
  \ jQuery Mobile 主题的默认 Drupal 安装。\n\n\n\n\n在安装了 jQuery Mobile 模块和主题后，你可以自定义各种设置。主题允许你为不同的表单元素配置许多色块（swatches）。如果你访问\
  \ Drupal 管理区域的“Appearance”页面并点击 jQuery Mobile 主题旁边的“Settings”链接，你将在 JQM Settings\
  \ 部分看到一组选项，如图图 16.15 所示。\n\n![Image](img/jquery-16-15.jpg)\n\n图 16.15。（左）Drupal\
  \ 安装中的 jQuery Mobile 主题设置。\n\n你还可以在 jQuery Mobile 模块中配置设置。要编辑这些设置，请访问“Modules”页面，向下滚动找到\
  \ jQuery Mobile 模块，并选择模块旁边的“Configuration”链接。在该页面，你将看到一个名为 `File Settings` 的区域，如图\
  \ 16.16 所示。如果你选择此标题，它将展开并显示文本框，你可以使用这些框来设置 jQuery 库和 jQuery Mobile 框架的版本，以及上传到 Drupal\
  \ 安装的文件的路径位置，如图图 16.10 所示。\n\n![Image](img/jquery-16-16.jpg)\n\n图 16.16。（右）Drupal\
  \ 安装中的 jQuery Mobile 模块设置。\n\n### 添加内容\n\n要创建更多页面和博客文章，你需要登录 Drupal 管理区域。在这里，你可以通过“Content”页面管理所有内容：选择“Add\
  \ content”来选择内容类型。在此页面上有两个默认内容类型：Article（文章）和 Basic page（基本页面）。要创建博客文章，选择 Article，输入标题，并在图\
  \ 16.17 所示的 Web 表单的 Body 字段中编写你的文章。\n\n![Image](img/jquery-16-17.jpg)\n\n图 16.17。（左）在\
  \ Drupal 中创建博客文章。\n\n默认情况下，这篇博客文章出现在你的 Drupal 网站首页上（[图 16.18）。\n\n![Image](img/jquery-16-18.jpg)\n\
  \n图 16.18。（右）带有博客文章的 Drupal 站点。\n\n要创建一个页面，返回“Content”，选择“Add Content”并选择 Basic\
  \ page。使用页面上的 Web 表单创建你的页面。在示例中，我们正在创建一个名为“Home”的页面，它最终将成为网站的首页（[图 16.19]）。\n\n\
  ![Image](img/jquery-16-19.jpg)\n\n图 16.19. 在 Drupal 中创建一个基本页面。\n\n你可以使用此新页面作为 Drupal\
  \ 安装的首页。要将某个页面定义为首页，请访问“Configuration”页面，选择“Site information”，并向下滚动直到看到“Default\
  \ front page”。在这里，你会看到你的 Drupal 网站的 URL，并带有一个文本框，用于输入你想要使用的页面的节点 ID（node ID）。在查看任何基本页面时，你可以在浏览器地址栏中找到此节点\
  \ ID；在本示例中，我们的节点 ID 是 1，因此我们在文本框中输入了 `node/1`（[图 16.20]）。\n\n![Image](img/jquery-16-20.jpg)\n\
  \n图 16.20. 在 Drupal 中设置自定义首页。\n\n就是这样！[图 16.21]]显示了带有自定义首页的最终 Drupal 网站。\n\n![Image](img/16fig21.jpg)\n\
  \n图 16.21. 带有自定义首页的最终 jQuery Mobile Drupal 网站。\n\n## 总结\n\n使用本章介绍的 Drupal 以及 jQuery\
  \ Mobile 主题和模块可以让你快速创建一个强大的移动端内容管理系统（CMS）并让其投入运行。通过你在书中所学到的技巧，你可以利用 jQuery Mobile\
  \ 框架提供的小部件、格式和其他功能，创建独特且自定义的网页。现在，没有什么可以阻碍你创建一个具有完整移动能力的强大 CMS 了。\n\n# 第五部分：超越 jQuery\
  \ Mobile\n\n## 17. 检测移动设备\n\n移动端网站通常与主网站（那些旨在供桌面电脑或笔记本电脑查看的网站）分开开发，尽管它们可能使用许多相同的内容。为了确保你的网站为移动设备量身定制，你会希望检测移动设备何时访问站点，然后将设备重定向到专门为移动设备制作的标记。你可能还希望根据特定的移动设备提供网站布局和内容。在本章中，你将学习如何实现这两种方法。让我们开始学习如何检测移动设备何时访问你的网站。\n\
  \n### 使用 PHP\n\n由于 PHP 是 Web 上最流行的脚本语言之一，让我们来看一个跨广泛移动设备执行移动检测的 PHP 函数。该函数非常简单，并且很容易扩展和修改：\n\
  \n点击此处查看代码图片\n\n```\nfunction mobile_detect(){\n    $mobile_devices = '/(alcatel|amoi|android|avantgo|blackberry|benq|cell|cricket|docomo|elaine|htc|iemobile|iphone|ipad|ipaq|ipod|j2me|java|midp|mini|mmp|mobi|motorola|nec|nokia|palm|panasonic|philips|phone|sagem|sharp|smartphone|symbian|telus|vodafone|wap|webos|wireless|xda|xoom|zte)/i';\n\
  \    if (preg_match($mobile_devices, $_SERVER['USER_AGENT'])) {\n        return\
  \ true;\n    } else {\n        return false;\n    }\n}\n```\n*(注：此处原文代码中存在一些语法错误，如多余的括号和引号，在翻译时已保持其原始逻辑或进行了微调以符合可读性，但根据指令“代码块不需要翻译”的原则，此处保留了代码的逻辑结构。)*\n\
  \n### 世界上有多少种移动设备类型？\n\n示例中的正则表达式并没有涵盖所有的移动设备类型。今天有成百上千不同的可以上网的类型。管道符号（|`）表示设备之间的“或”关系。\n\
  \n你如何决定将哪些设备包含在测试中？坦率地说，只有你自己知道答案，因为这取决于你的移动网站受众。你可以找到许多在线来源。其中一个来源是 [useragentstring.com](https://www.useragentstring.com)，该网站定期更新且非常准确。你可以在\
  \ [www.useragentstring.com/pages/Browserlist/](http://www.useragentstring.com/pages/Browserlist/)\
  \ 找到它。\n\n### 识别浏览器\n\n如果你需要添加手机的用户代理字符串，指示浏览器的字符串非常简单。只需在字符串中插入一个管道符号，后面跟着手机的用户代理字符串。列表不需要按字母顺序排列。\n\
  \n一旦你创建了搜索字符串，就可以使用 PHP 的 `preg_match` 函数进行测试。该函数的第一个参数是你的移动设备变量，第二个参数是 PHP 全局数组\
  \ `$_SERVER` 的一部分，特别是 `USER_AGENT`。当 Web 浏览器向服务器请求信息时，它会服务器发送大量自身的信息以生成请求。如果服务器端语言是\
  \ PHP（这种相同的信息在其他服务器端语言中可用），大部分信息存储在 `$_SERVER` 数组中。这就是判断移动设备是否访问你网站的关键。\n\n### 更多关于正则表达式\n\
  \n虽然学习正则表达式可能枯燥且可怕，但它可以是你编程工具箱中非常有价值的一部分。幸运的是，网上有很多资源。以下是一些推荐的网站：\n\n\n\n\n\n[www.regular-expressions.info/](http://www.regular-expressions.info/)\
  \ 涵盖了开发、测试和使用正则表达式的广泛材料。\n\n[`regexlib.com/`](http://regexlib.com/) 提供了一个可搜索的常用正则表达式库——非常适合不想自己写表达式的开发者！\n\
  \n[`regexpal.com/`](http://regexpal.com/) 让你实时开发和测试正则表达式变得非常简单。\n\n### 调用 PHP 函数\n\
  \n要使用你创建的 PHP 移动设备检测函数，你需要在期望移动设备访问的页面中调用它。在这个示例中，该函数已保存在一个名为 `mobile_detection.php`\
  \ 的独立文件中：\n\n点击此处查看代码图像\n\n```php\ninclude('path/to/mobile_detection.php');\n\n\
  $mobile_device = mobile_detect();\n\n// 如果检测到移动设备，则执行重定向\n\nif($mobile_device ==\
  \ true) {\n    header('Location: http://m.mywebsite.com');\n    exit();\n}\n```\n\
  \n这里的代码非常浅俗易懂。你将函数的运行结果存储在名为 `$mobile_device` 的变量中，并测试该变量是真还是假。如果是真，你会将移动设备的浏览器重定向到你想让该设备\
  \ set 的内容。你可以在任何页面上使用该函数，并根据需要设置自定义重定向。当前函数的执行结果是将浏览器重定向到 [`m.mywebsite.com`](http://m.mywebsite.com)，如图\
  \ 17.1 所示。\n\n![Image](img/jquery-17-1.jpg)\n\n图 17.1。普通浏览器中的 Web URL 以及移动设备被重定向到的\
  \ URL。\n\n你可以让函数返回用户代理（user agent）字符串，这样你就可以根据访问网站的设备类型来执行某些操作。与其那样，让我们学习如何在当浏览器到达移动站点时，使用\
  \ JavaScript 检测特定设备。\n\n### 使用 JavaScript 检测特定设备\n\n在某些情况下，你可能想知道是哪个特定的移动设备正在访问你的移动网站或应用程序，以便你对用户体验进行一些控制。这种控制可能以启用或禁用某些功能，或显示为用户特定设备定制的数据和内容的形式出现。\n\
  \n这种技术与我们为 PHP 使用的方法惊地相似。让我们检查检测特定移动设备的两种方法，首先使用纯 JavaScript，然后使用 jQuery。\n\n###\
  \ 使用 JavaScript 检测移动设备\n\n在 JavaScript 中，与 PHP 一样，你将使用正则表达式来搜索设备的用户代理字符串。从那里，你可以添加代码，根据访问网站的设备在你的移动网站中提供特定功能。\n\
  \n这是一个简单的示例：\n\n点击此处查看代码图像\n\n```javascript\nvar mobile_device = navigator.userAgent.match(/(iPad)|(iPhone)/i);\n\
  \nif(mobile_device) {\n    // 针对这些设备特定功能的代码\n} else {\n    // 处理这些设备之外功能的代码\n}\n\
  ```\n\n如你所见，你正在使用正则表达式来查找用户代理字符串的匹配项。JavaScript 在其 `navigator` 对象中收集用户代理信息，你可以在\
  \ `navigator.userAgent` 中访问该信息。\n\n在运行 Safari 浏览器的 iPhone 4 上，用户代理字符串可能看起来如下所示：\n\
  \n点击此处查看代码图像\n\n```\nMozilla/5.0 (iPhone; U; CPU iPhone OS 4_3_3 like Mac OS X;\
  \ en-us) AppleWebKit/533.17.9 (KHTML, like Gecko) Version/5.0.2 Mobile/8J2 Safari/6533.18.5\n\
  ```\n\n使用 JavaScript 的 `match()` 方法，你可以判断 `navigator.userAgent` 是否匹配正则表达式 `/(iPad)|(iPhone)/i`。如果你使用\
  \ [`regexpal.com`](http://regexpal.com) 工具来测试你的正则表达式，它看起来会像图 17.2。\n\n![Image](img/jquery-17-2.jpg)\n\
  \n图 17.2。正则表达式出现在上方窗格中，而下方窗格高亮了在用户代理字符串中找到的匹配。\n\n现在你已经知道如何测试特定的移动设备，你可以在你的网站中构建功能，允许为这些设备提供自定义信息和交互。这是一个\
  \ JavaScript `switch` 语句的示例，说明了如何编写此类代码：\n\n点击此处查看代码图像\n\n```javascript\nvar mobile_device\
  \ = navigator.userAgent;\n\nswitch(true) {\n    case /(iPad)|(iPod)|(iPhone)/i.test(mobile_device):\n\
  \        // 这些设备的代码\n        break;\n\n    case /(android)/i.test(mobile_device):\n\
  \        // 该设备的代码\n        break;\n\n    default:\n        // 其他设备的代码\n       \
  \ break;\n}\n```\n\n请记住，正则表达式的测试在处理性能上可能是昂贵的，所以不要沉迷于大量的测试。\n\n![Image](img/note.jpg)\
  \ 备注\n\n访问 [`detectbrowsers.com/`](http://detectbrowsers.com/) 获取开源现成代码。\n\n###\
  \ 使用 jQuery 检测浏览器功能\n\n既然你已经知道如何测试特定的移动设备，你就可以在网站中构建功能，允许为那些设备提供自定义信息和交互。当你需要知道是哪个移动设备正在访问你的网站时，使用纯\
  \ JavaScript 检测设备是更好的选择。你可以进一步使用 jQuery 判断是否支持某些功能。\n\n从技术上讲，你无法用 jQuery 进行设备检测，但你可以判断浏览器是否支持某些功能。\n\
  \n例如，你可能想知道访问网站的浏览器是否符合 Web 联盟的盒模型建议，因为你的布局依赖于该功能。以下 jQuery 代码将判断盒模型功能是否可用：\n\n\
  `$.support.boxModel;`\n\n现在你可以通过测试处理异常：\n\n点击此处查看代码图像\n\n```javascript\nvar box_model\
  \ = $.support.boxModel;\n\nif(!box_model) {\n    //在此处放置你的异常处理代码\n}\n```\n\n这里是可以使用\
  \ `.support` 检测的功能部分列表：\n\n- `ajax` 如果浏览器支持 `XMLHttpRequest`，则为 `true`。\n- `cors`\
  \ 如果浏览器支持跨域 `XMLHttpRequest`，则为 `true`。\n- `opacity` 如果浏览器支持此 CSS 属性，则为 `true`（所有\
  \ IE 浏览器将返回 false）。\n- `submitBubbles` 如果提交事件可以向上 DOM 树冒泡，则为 true。\n\n要找到其余 jQuery\
  \ `.support` 属性的完整列表，请访问 [`api.jquery.com/jQuery.support/`](http://api.jquery.com/jQuery.support/)。\n\
  \n## 总结\n\n既然你已经为构建 jQuery Mobile 网站和应用程序奠定了坚实的代码基础，现在检测移动设备何时访问网站并获取有关该设备的特定信息已经再不过简单了。\n\
  \n你现在拥有许多很好的工具来配置和测试正则表达式，并深入研究用户代理字符串。掌握了这些工具，为任何网站开发移动设备检测都是很容易的。\n\n下一个问题是，“我如何在尽可能多的移动设备上测试我的网站？”我们大多数人负担不起购买所有的移动设备，因此我们将把注意力转向移动设备模拟器。接下来就是这个！\n\
  \n\n\n\n\n# 18. 使用模拟器进行测试\n\n在对移动网站和应用程序进行测试时，你有几种选择：你可以使用开发标记和代码的桌面端浏览器、移动设备，或者移动模拟器。每种方式都有其优缺点。\n\
  \n使用模拟器进行测试最大的单一优势是，你可以立即获得关于移动网站在移动设备上显示效果的反馈。这将帮助你调整布局，并为你的页面间导航将如何工作提供线索。\n\n\
  但也有一个巨大的缺点。模拟器与你移动网站的交互与在物理设备上的交互截然不同。你将会错过设备的触控功能。你的最后一步测试应该始终在那些预计访问者实际会使用的类设备上进行。\n\
  \n## 探索你的测试选项\n\n如果你在桌面端进行测试，可以获得即时结果。缺点是，即使调整了尺寸，桌面网页浏览器也无法提供与移动设备相同的体验。例如，滚动条在桌面浏览器上要宽得多且更具干扰性。使用桌面浏览器适用于进行即时的抽检检查。\n\
  \n大多数移动开发者都有二到三个物理设备用于测试，但无力购买更多。一种解决方案是“众测”，即你让朋友通过他们的设备访问你的网站或应用程序，并对发现的任何问题提供反馈。另一种解决方案是使用远程实验室。在远程实验室进行测试可能很昂贵，但它可以让你坐在桌前就能在多个设备上测试网站。\n\
  \n另一个选项是使用移动模拟器。移动模拟器正在不断演进，并分为几种类型：在线使用的类型和下载并安装在桌面电脑上的类型。某些模拟器配备了移动开发工具包和软件开发工具包\
  \ (SDK)。它们通常都提供与在桌面浏览器上测试相同的即时反馈。缺点是，你无法使用在许多触控移动设备上可用的手势与模拟器进行交互，而且有时模拟器的配置可能无法复制移动设备的浏览器和操作系统。\n\
  \n让我们深入研究并寻找一些移动模拟器。\n\n## 为移动 Web 进行开发\n\n你需要问自己的最重要的问题之一是：我是在为谁开发我的移动网站？\n\n由于你专注于使用\
  \ `jQuery Mobile` 开发网站和应用程序，本章将讨论在全功能移动网络浏览器中提供良好体验的模拟器，这种浏览器通常出现在许多移动用户使用的智能手机和平板上。\n\
  \n还有其他针对移动设备的模拟器，但它们无法提供你从全功能浏览器中预期的那种体验。如果你预计网站访问者将使用这类设备，我强烈建议你研究这些模拟器并学习如何使用它们。为这些设备开发可能意味着你必须添加代码来重定向或精简你的网站以适应这些用户。\n\
  \n你应该在规划过程之初就回答为谁设计移动网站的问题。了解你的目标受众和预计他们将使用的设备将使开发和测试变得顺畅得多。\n\n## 寻找在线模拟器\n\n寻找可靠的在线移动设备模拟器就像寻找你的王子（或公主）一样。你必须先亲吻很多青蛙。在\
  \ Google 中输入“mobile device simulator”，结果可能会让你目目震惊且沮丧。\n\n你需要考虑到，大多数在线模拟器都会受到你访问模拟器的浏览器的影响。大多数在线模拟器倾向于继承父浏览器的特征，许多不会呈现或尊重诸如移动用户代理字符串或移动设备浏览器中的视觉元素等属性。我们将在本章稍后的\
  \ `使用模拟器进行测试` 部分详细讨论这些问题。\n\n以下是你在网上找到的一些较好的模拟器：\n\n-   **位于 [www.mobilephoneemulator.com/](http://www.mobilephoneemulator.com/)\
  \ 的 Cowemo**\n\n这种移动模拟器的很棒之处在于它提供了几种不同的智能手机布局。菜单允许你轻松地在移动设备和方向之间切换，如 `图 18.1` 所示。\n\
  \n![Image](img/jquery-18-1.jpg)\n\n图 18.1。[mobilephoneemulator.com](http://mobilephoneemulator.com)\
  \ 模拟器可用的菜单和选项。\n\n模拟器的屏幕非常整洁（`图 18.2`），易于处理你的移动网站。缺点是浏览器继承了父浏览器的用户代理字符串，使得难以测试依赖特定移动设备的操作。此外，你无法访问可能在本地工作的站点\
  \ (`localhost`)；你必须将网站上传到可以从网络访问的服务器上。\n\n![Image](img/jquery-18-2.jpg)\n\n图 18.2。[mobilephoneemulator.com](http://mobilephoneemulator.com)\
  \ 网站的整洁布局。用户代理字符串从父浏览器继承了其属性。\n\n如果你在测试布局，这是一个极佳的工具。你可以快速在设备之间切换。设备以正确的屏幕宽度和高度渲染（有一种模式可以放大屏幕尺寸以便关注细节），这使得它非常适合捕捉不同设备上网站的截图。\n\
  \n-   **位于 [www.opera.com/developer/tools/mini/](http://www.opera.com/developer/tools/mini/)\
  \ 的 Opera Mini**\n\n虽然 Opera Mini 可能不是最广泛使用的浏览器之一，但有越来越多的人选择下载并使用它，而不是移动设备自带的浏览器。在线测试站点（`图\
  \ 18.3`）整洁且易用。\n\n![Image](img/jquery-18-3.jpg)\n\n图 18.3。Opera Mini 模拟器。\n\n注意\
  \ Opera Mini 解析层级样式表 (`CSS`) 的方式。有时，复杂的布局渲染效果并非你预期的那样。如果你在测试时需要这些用户代理字符串，它可以正确报告，但你必须将网站上传到服务器进行测试。\n\
  \n-   **位于 [www.mobilewebsitesu.com/tester/](http://www.mobilewebsitesu.com/tester/)\
  \ 的 Mobile Websites 4U**\n\n这种模拟器很棒，但也有一些缺点，例如仅提供四种屏幕布局并继承父浏览器的用户代理字符串。它还使用了桌面浏览器滚动条，可能会影响你的网站布局。查看\
  \ `图 18.4`，你就会看到滚动条占据了屏幕空间。\n\n![Image](img/jquery-18-4.jpg)\n\n图 18.4。Mobile Websites\
  \ 4U 模拟器使用了桌面标准滚动条，而不是符合移动浏览器的条。\n\n一个显著优势是你可以在本地机器上测试，而无需将站点文件上传到 Web 服务器。快速检查布局的能力对于任何移动设备模拟器来说都是真正的加分项。\n\
  \n## 使用模拟器进行测试\n\n现在你的工具箱里有了模拟器，是时候将它们整合到你的工作流中了。让我们从在在线模拟器测试开始。\n\n### 使用在线模拟器测试\n\
  \n对于大多数在线模拟器，你只需要将你的移动网站上传到 Web 服务器，导航到在线模拟器，并在模拟器的地址栏中输入 URL（许多要求你在 URL 前加上 `http://`\
  \ 前缀）。如果一切顺利，你将在模拟器的屏幕上看到你的移动网站。\n\n\n\n\n\n有一点会显而易见：你无法像使用真实设备那样与桌面模拟器进行交互。如果你正在使用通常支持触控的设备进行测试，你无法在设备屏幕上用手指执行滚动或缩放等相同的操作。你必须使用连接到桌面环境的鼠标和键盘来滚动、点击并以其他方式与模拟器交互。\n\
  \n如果你设计的移动端网站依赖于用户代理字符串（user agent string）或功能检测，那么在桌面设备上也将缺失一些关键功能。你可以使用一些解决方案（参见侧边栏“**伪造用户代理字符串**”）来辅助你的测试。你也可以判断桌面版浏览器的功能集是否与移动浏览器的功能集匹配。重要的是要将在线模拟器加载到尽可能不同的浏览器中，这样你就可以查看浏览器的功能是否支持你为移动端网站或应用程序编写的程序了。\n\
  \n确保导航运行符合你的预期。仔细检查布局，以确保它适应设备的屏幕区域。使用在线模拟器将让你易于发现网站在移动设备上的显示是否良好以及导航是否正常。\n\n***\n\
  \n## 伪造用户代理字符串\n\n在测试过程中，你可以使用一种解决方案来修改请求头，以便向服务器发送正确的用户代理字符串。你必须使用带有 `Modify Headers`\
  \ 插件的 `Mozilla Firefox` 浏览器。你可以在此处获取该插件：\n\n[`addons.mozilla.org/en-US/firefox/addon/modify-headers/`](https://addons.mozilla.org/en-US/firefox/addon/modify-headers/)\n\
  \n如果你选择使用此工具，你可能需要了解用户代理字符串以及如何构建它们。这些信息可以从世界维网联盟（World Wide Web Consortium）获取：\n\
  \n[www.w3.org/Protocols/HTTP/HTRQ_Headers.html](http://www.w3.org/Protocols/HTTP/HTRQ_Headers.html)\n\
  \n该工具提供了一个方便的用户界面，可以从 Firefox 的插件工具栏轻松启动。我鼓励你将其成为你移动开发工具箱的一部分。\n\n***\n\n## 使用远程实验室\n\
  \n如果你无法获得一组物理设备来测试你的移动端网站和应用程序，你可以选择使用远程实验室进行测试。测试成本和体验在不同实验室之间差异很大，因此在决定使用哪个实验室之前，请务必做好研究。\n\
  \n一旦选定了实验室，在开始之前请确保你有一个清晰的测试计划，因为许多实验室按分钟或按小时收费。确保你仔细选择目标设备，一旦选定，就执行你的测试计划不要偏离，因为每一分钟都至关重要。\n\
  \n以下是一些你可能想要考虑的实验室：\n\n- Keynote DeviceAnywhere ([www.keynotedeviceanywhere.com](http://www.keynotedeviceanywhere.com))\
  \ 支持超过 2000 台设备。\n- Paca Mobile Center ([www.pacamobilecenter.com](http://www.pacamobilecenter.com))\
  \ 位于法国，拥有丰富的移动设备。\n- Perfecto Mobile ([www.perfectomobile.com](http://www.perfectomobile.com))\
  \ 目前支持约 500 台设备，但具有激进的定价方案。\n\n你通常有两种选择：有些实验室将设备连接到由测试人员电脑控制的服务器；另一些则允许你通过远程访问的摄像头监控测试。后一种方法需要现场测试人员，由测试人员与设备交互。有些实验室甚至提供自动化脚本测试。\n\
  \n## 使用桌面模拟器进行测试\n\n某些设备制造商提供 SDK，允许你下载并安装模拟器以在桌面上进行测试。最流行的包括 `Android SDK` (developer.android.com/sdk/)、`BlackBerry`\
  \ (bdsc.webapps.blackberry.com/devzone/) 以及随 `XCode` (developer.apple.com/xcode/)\
  \ 用于 `Mac` 的 `iPhone` 模拟器。\n\n另一个较近发布的、适用于 Mac 和 Windows 平台的模拟器称为 `Mobilizer` ([www.springbox.com/mobilizer/](http://www.springbox.com/mobilizer/))。它所示图\
  \ 18.5。\n\n![Image](img/jquery-18-5.jpg)\n\n图 18.5。Mobilizer 仅提供四个设备，但它们是可用的最流行的设备之一。\n\
  \n这些 SDK 各支持某些非常特定的功能集，通常不会涵盖特定制造商提供的所有设备，但使用它们可以让你对布局和导航等内容进行快速检查。\n\n这些设备的测试计划与使用在线模拟器的测试计划类似。你将网站加载到本地服务器或\
  \ Web 可访问服务器上，打开模拟器并输入 URL。你的网站应该会加载，你可以使用电脑的键盘和鼠标与其进行交互。\n\n优点是 SDK 会正确报告用户代理字符串，并让你根据设备标准浏览器的支持情况，测试网站添加或删除功能以及执行重定向的能力。使用多个模拟器进行测试将让你在向公众发布之前，对网站的外观和运行情况更有信心。\n\
  \n## 众测\n\n我的朋友喜欢吃披萨，他们对自己选择的移动设备充满热情。将两者结合，你就获得了一个测试派对的绝佳资源！\n\n在没有在真实设备上进行测试之前，千万不要向公众发布你的移动端网站或应用程序。这样做的一种方法是邀请拥有各种手机和平板电脑的朋友进行测试。\n\
  \n众测的规则与其他测试形式相同：你必须有一个计划。（在测试结束前不要提供披萨。）你可能需要为他们提供一份关于网站交互的简单问卷，以获取他们对网站外观和感受的反馈。\n\
  \n***\n\n![Image](img/note.jpg) 注意\n\n有如 `Mob4` ([www.mob4.com](http://www.mob4.com))\
  \ 这样的众测服务。它们可以引导你完成测试过程。\n\n***\n\n## 总结\n\n测试移动端网站和应用程序有很多方法，你需要勤地设置并使用带有明确计划的模拟器来确保成功。\n\
  \n作为一名开发者，你可能会在工作流中结合在线和桌面模拟器来测试你开发的网站的功能。当你开发到某个阶段时，你可能希望将测试扩展到移动实验室（如果预算允许）。\n\
  \n你始终想要包含的一种模拟是在尽可能多的物理设备上与你的网站交互。这可能限于你现有的设备，也可以涉及邀请你的朋友和熟人进行几次手动检查。别忘记披萨！\n\n\
