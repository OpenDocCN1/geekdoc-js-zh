  \ Mobile 使用其内容来显示新页面。关于这个简单的请求有很多值得学习的地方，我们将在后续章节中进行详细介绍。\n\n## 总结\n\n（由于输入文本截断且重复，此处翻译至有效逻辑结束）\n\
  \n\n\n\n```html\n<a href=\"#page-one\">Link to page 1</a>\n</div>\n<div data-role=\"\
  footer\">\n    Copyright\n</div>\n</div>\n</body>\n</html>\n```\n\n在这个多页模板中，包含了两个由自定义\
  \ `id` 的 `div` 元素定义的页面。jQuery Mobile 框架一次只显示这些页面中的一个，并使用 `data-title` 属性来动态更改页面标题。默认显示的页面由源代码的顺序决定。在示例中，第一个页面的\
  \ `id` 为 `page-one`，但如果交换此文件中页面的顺序，使得 `id` 为 `page-two` 的元素排在最前面，那么它将成为默认加载的页面。换句话说，`id`\
  \ 属性的值并不决定默认显示的页面；默认页面仅取决于源代码的顺序。然而，`id` 还用于其他重要用途，例如页面之间的链接。\n\n这就是 jQuery Mobile\
  \ 页面开始像独立的网页一样工作的地方。请注意，原始模板已添加了超链接，以便从一个页面链接到另一个页面。这类似于 JavaScript 开发中常见的切换功能，在那种功能中，`id`\
  \ 值被用于隐藏和显示某些 HTML 元素。这里的区别是 jQuery Mobile 为你处理了这些功能。要从一个页面链接到另一个页面，你只需要：\n\n1.\
  \ 创建超链接。\n2. 输入井号（`#`）。\n3. 指定你想要链接的页面的 `id` 值。\n\n最终结果如下：\n\n点击此处查看代码图片\n\n<a href=\"\
  #page-two\">Link to page 2</a>\n\n这与创建页面锚点类似；区别在于你引用的是另一个页面的 `id` 值。请记住，每个页面都需要一个唯一的\
  \ `id` 值。在这种情况下，我使用了 `page-one` 和 `page-two`，但你可以使用更具描述性且与 jQuery Mobile 页面内容相关的名称。jQuery\
  \ Mobile 框架的酷之处在于，它可以动态地从一个页面切换到另一个页面，而不需要你编写任何代码。**图 4.1** 展示了这种代码在页面视图以及页面间切换中的示例。\n\
  \n![Image](img/jquery-4-1.jpg)\n\n图 4.1. 一个带有两个页面的多页模板以及之间的过渡。\n\n### 单页模板\n\n单页模板是独立的\
  \ HTML 文件，作为独立的网页运行，就像任何标准网页一样。主要的区别在于 jQuery Mobile 如何使用 Ajax 连接网页。与多页模板一样，单页模板中基于\
  \ Ajax 的导航使用井号（hashtag）来创建页面历史。jQuery Mobile 使用的 Ajax 导航是默认开启，但可以通过将配置中的 `ajaxEnabled`\
  \ 设置为 `false` 来关闭它。你将在书的后续部分学习更多关于配置设置的内容。\n\nAjah 有时 Asynchronous JavaScript and\
  \ HTML 的缩写。Ajah 本质上是去掉了 XML 的 Ajax；它仍然使用 `XMLHttpRequest`，但与服务器交换的是 HTML 而不是 XML。这就是\
  \ jQuery Mobile 在用户浏览独立网页时所使用的技术。我们在上一章中简要介绍了 jQuery Mobile 框架如何使用 `XMLHttpRequest`\
  \ 加载后续页面，但关于这个简单的请求，有很多需要学习和理解的内容。\n\njQuery Mobile 框架的一个大优势是它是如何跟踪历史的：它支持后退和按钮！此外，在加载后续页面时，框架提供了默认的加载消息和页面间的过渡。默认的页面过渡是在两个页面之间滑动，而默认的加载消息是一个带有“loading...”消息的旋转图标。这两个选项都是可配置的，你将在下一章中学习到。现在，让我们看看井号和历史在\
  \ jQuery Mobile 中是如何工作的。\n\n### 井号与历史\n\njQuery Mobile 使用井号（hashtags）来管理单页和多页模板中的历史。`window`\
  \ 对象的 `location.hash` 用于更改和更新历史，因此后退和前进按钮可以像常一样工作，这在其他基于 Ajax 的系统中是不常见的。本质上，jQuery\
  \ Mobile 防止了所有超链接的默认功能，并使用井号功能来处理历史。这不仅更新了历史，井号系统还会创建一个可以书签以便以后参考的有效 URL。\n\njQuery\
  \ Mobile 基于井号的导航唯一问题是它不支持深度链接（deep linking）。然而，你可以使用一些通方法来支持此功能。在 jQuery 的帮助下，你可以为网页添加类似下面的脚本，这样你的深度链接就能正常工作了：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(document).ready(function() {\n    $('a[href^=\"\
  #\"]').bind('click vclick', function () {\n        location.hash = $(this).attr('href');\n\
  \    });\n});\n```\n\n在 HTML 中，所有第一个字符为井号（`#`）的超链接都被识别为锚点。此脚本使用正则表达式来识别它们。回调函数将\
  \ `window` 对象的 `location.hash` 设置为锚点的值并返回 `false`。\n\n![Image](img/note.jpg) 注意事项\n\
  \n脱字符（`^`）在正则表达式中经常用于指定字符串的开头。\n\n`vclick` 事件是支持触摸事件的设备在 jQuery Mobile 中使用的选项。它支持更快的页面更改，并在页面过渡期间保持地址栏隐藏。\n\
  \n从单页模板到启用 Ajax 的多页模板的超链接只会加载源代码中的第一个页面。要从单页模板链接到多页模板，必须使用 `rel=\"external\"` 或\
  \ `data-ajax=\"false\"`。\n\n### 链接类型\n\njQuery Mobile 支持标准的 HTML 链接类型，以及许多与移动体验相关的自定义链接类型。下表提供了\
  \ jQuery Mobile 框架提供的链接类型列表。每个表格根据其结果或对 Ajax 的支持进行分类。**表 4.1** 描述了支持 Ajax 的链接。\n\
  \n表 4.1. 支持 Ajax 的链接类型\n\n![Image](img/04tab01.jpg)\n\n### 分级支持\n\n正如本书引言提到的，jQuery\
  \ Mobile 对支持的平台使用了三级分类列表：A、B 和 C。A 包含完整的体验，并可以选择基于 Ajax 的页面过渡；B 包含相同的体验，但没有基于 Ajax\
  \ 的页面过渡；C 是基础但有效的 HTML 体验。\n\nA 级支持之前提到的所有移动操作系统以及其他，包括 Apple iOS、Android、Windows\
  \ Phone、BlackBerry、Palm WebOS、Kindle 3 和 Kindle Fire。B 级支持 BlackBerry 5、Opera Mini\
  \ 和 Nokia Symbian。C 级支持 BlackBerry 4、Windows Mobile 以及所有旧智能手机和功能手机。访问 [jquerymobile.com](http://jquerymobile.com)\
  \ 查看最新的支持平台列表。\n\n**表 4.2** 描述了禁用 Ajax 页面功能的超链接列表。这些链接对于外部域名的页面、在新窗口中打开的页面、从单页到多页模板的链接，或者链接到不想使用\
  \ Ajax 的页面非常有用。\n\n\n\n\n\n## 表 4.2. 禁用 Ajax 的链接类型\n\n![Image](img/04tab02.jpg)\n\
  \n表 4.3 包含了在基础 HTML 超链接基础上添加特定属性的链接类型。\n\n### 表 4.3. 杂链接类型\n\n![Image](img/04tab03.jpg)\n\
  \njQuery Mobile 框架使用了许多超链接属性对普通的 HTML 网页进行增强。这就是为什么 jQuery Mobile 比从零开始创建移动网站更有吸引力的另一个原因。它让你能够专注于重要的事情，而消除了在每次创建新的移动网站时都编写核心功能的需求。\n\
  \n以下示例展示了表中涵盖的几种链接类型。\n\n此网页提供了三种可以在 jQuery Mobile 中使用的链接类型示例：内部链接、外部链接以及一个禁用 Ajax\
  \ 的链接：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1\">\n    <title>Single-page template\
  \ - Page 1 - jQuery Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\"\
  \ href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\" />\n\
  \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n</head>\n<body class=\"container\">\n    <div data-role=\"page\">\n\
  \        <div data-role=\"header\">\n            <h1>Page 1</h1>\n        </div>\n\
  \        <div data-role=\"content\">\n            <p><a href=\"single-page-2.html\"\
  >链接到页面 2</a>a></p>\n            <p><a href=\"single-page-2.html\" rel=\"external\"\
  >到页面 2 的外部链接</a>a></p>\n            <p><a href=\"single-page-2.html\" data-ajax=\"\
  false\">禁用 Ajax 的链接到页面 2</a>a></p>\n        </div>\n        <div data-role=\"footer\"\
  >\n            Copyright\n        </div>\n    </div>\n</body>\n</html>\n```\n\n\
  内部链接不需要特殊的标记，框架将在该处介入，并在当前页面与被链接的页面之间创建页面过渡。外部链接是需要 `rel` 属性的链接，该属性的值必须设置为 `external`。将超链接设置为外部链接会禁用\
  \ Ajax，将其从页面哈希历史记录（hashtag history）中移除，并在点击链接时刷新网页。禁用 Ajax 的链接需要一个值为 `false` 的 `data-ajax`\
  \ 属性。这也会禁用 Ajax，将其从页面哈希历史记录中移除并刷新网页，与上一个示例相同，主要区别在于 `rel=\"external\"` 属性可以在 jQuery\
  \ 的轻微帮助下，作为一种符合标准的方式来创建目标为新窗口的超链接。\n\n在接下来的示例中，有一个内部链接和一个充当返回按钮的超链接：\n\n点击此处查看代码图片\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1\">\n    <title>Single-page template - Page 2\
  \ - jQuery Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"\
  http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\" />\n    <script\
  \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"></script>\n\
  \    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n</head>\n<body class=\"container\">\n    <div data-role=\"page\">\n\
  \        <div data-role=\"header\">\n            <h1>Page 2</h1>\n        </div>\n\
  \        <div data-role=\"content\">\n            <p><a href=\"single-page.html\"\
  >到页面 1 的 Ajax 链接</a></p>\n            <p><a href=\"#\" data-rel=\"back\">返回按钮</a></p>\n\
  \        </div>\n        <div data-role=\"footer\">\n            Copyright\n   \
  \     </div>\n    </div>\n</body>\n</html>\n```\n\n将 `data-rel` 属性设置为 `back` 会创建一个像返回按钮的超链接。当点击此链接时，jQuery\
  \ Mobile 框架会自动链接到历史记录中的上一个页面。\n\n### 预加载与缓存\n\n在处理任何基于内容的操作时，页面缓存非常重要。缓存指的是收集文件的隐藏存储区域。默认情况下，浏览器通过将关联文件放在用户计算机的本地目录中来处理网页缓存，以便网页及其关联资源在访问时加载得更快。jQuery\
  \ Mobile 将这一概念进一步了一步：框架允许页面在被链接或在浏览器中显示之前就进行缓存。利用此功能就像使用一个名为 `data-prefetch` 的 HTML\
  \ 属性一样简单。只需将其添加到网页中的任何超链接中，一旦网页加载，这些超链接指向的 URL 就会被预加载并缓存。下一行代码显示了如何向超链接添加此属性，以预加载并缓存其指向的页面：\n\
  \n点击此处查看代码图片\n\n```html\n<a href=\"page2.html\" data-prefetch>链接到页面 2</a>\n```\n\
  \n在网络浏览器中运行此示例时，请求会在页面加载时立即发出。图 4.2 显示了 Chrome 在页面加载时发出的 `XMLHttpRequest` 示例。\n\n\
  ![Image](img/jquery-4-2.jpg)\n\n图 4.2. jQuery Mobile 使用 prefetch 属性预加载页面。\n\n框架还提供了一种通过应用程序接口（API）处理页面预加载的方法。我们将在书后更具体地讨论\
  \ API，但了解如何访问它非常重要。\n\n![Image](img/note.jpg) 注意：应用程序接口（API）允许多个软件之间进行通信。\n\n要通过程序化预加载页面，你首先需要访问\
  \ jQuery Mobile 对象：\n\n`.mobile`\n\n一旦文档对象准备就绪，使用 `loadPage` 方法传递你想预加载的 URL，并为请求定义若干属性：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(document).ready(function() {\n    $.mobile.loadPage(\
  \ \"page2.html\", {\n        type: false,\n        reloadPage: false,\n        type:\
  \ 'get'\n    });\n});\n```\n\n在 `loadPage` 方法中，你可以传递许多参数作为选项。表 4.4 列出了这些可选参数。\n\n\
  表 4.4. loadPage 可选参数\n\n![Image](img/04tab04.jpg)\n\n除了提供文件加载控制外，jQuery Mobile 框架还提供了在文档对象模型（DOM）中缓存的控制。就像预加载选项一样，你可以通过\
  \ HTML 属性或 jQuery Mobile API 定义是否应在 DOM 中缓存页面。以下示例显示了如何在 `page` 标签中使用该属性来缓存网页：\n\
  \n点击此处查看代码图片\n\n```html\n<div data-role=\"page\" data-dom-cache=\"true\">\n```\n\
  \n要使用 API 缓存网页，你可以设置所有页面默认缓存：\n\n```javascript\n$.mobile.page.prototype.options.domCache\
  \ = true;\n```\n\n或者，你可以独立地缓存页面。你可以这样缓存 id 为 `my-page` 的页面：\n\n```javascript\n$('#my-page').page(true);\n\
  ```\n\n在处理单页模板时，jQuery Mobile 还会管理它预加载的页面，以防止 DOM 过大。如果许多页面保留在 DOM 中，浏览器的内存使用可能会失控，浏览器可能会变慢或崩溃。为了管理内存大小，框架会在访问者离开页面时，通过\
  \ `pagehide` 事件自动将 Ajax 加载的页面从 DOM 中移除。你将在书的后部分学习更多关于这一点以及其他事件的内容。\n\n\n\n\n\n预加载和缓存页面有很多益处。它们加载速度更快，并且可以防止访问者尝试访问预加载页面时出现\
  \ Ajax 加载提示。然而，重要的是，每个预加载的页面都会创建一个额外的 HTTP 请求，这会消耗更多带宽。因此，只有在你认为访问者可能会查看后续网页时，才对页面进行预加载。\n\
  \n### 使用页面过渡\n\njQuery Mobile 框架可以使用多种页面过渡。所有的页面过渡都是基于 CSS 的效果。在使用 Ajax 导航时，页面过渡发生在链接页面或表单提交之间。表\
  \ 4.5 列出了框架中可用的页面过渡。\n\n表 4.5 页面过渡\n\n![Image](img/04tab05.jpg)\n\n使用 `flip` 过渡时要小心，因为只有支持\
  \ 3D CSS 变换渲染的浏览器才支持它。\n\n* 这些页面过渡中的每一个都可以使用 `defaultPageTransition` 属性全局地设置为默认值。要正确设置它，必须绑定到\
  \ `mobileinit` 事件，可以通过 jQuery Mobile  API 访问该事件：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(document).bind(\"mobileinit\", function() {\n    $.mobile.defaultPageTransition\
  \ = 'fade';\n});\n```\n\n事件处理器的绑定需要在 jQuery Mobile 库加载之前执行。因此，在你的 HTML 文件中，请按特定顺序安排\
  \ JavaScript 文件：\n\n点击此处查看代码图片\n\n```html\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n<script src=\"assets/js/custom-jqm-transitions.js\"></script>\n<script\
  \ src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"></script>\n\
  ```\n\n也可以基于单个链接进行设置，以覆盖默认页面过渡。此选项在许多情况下非常有用，例如创建一个使用 `pop` 过渡的弹出窗口：\n\n点击此处查看代码图片\n\
  \n```html\n<a href=\"popup.html\" data-transition=\"pop\">Pop-up</a>\n```\n\n或者，使用\
  \ `flip` 过渡的表单提交：\n\n点击此处查看代码图片\n\n```html\n<form action=\"\" method=\"get\" data-transition=\"\
  flip\">\n    <input type=\"text\" name=\"name\">\n    <input type=\"submit\" value=\"\
  Submit\">\n</form>\n```\n\n甚至可以将页面过渡设置为 `none`，以禁用特定超链接或表单提交的页面过渡：\n\n点击此处查看代码图片\n\
  \n```html\n<form action=\"\" method=\"get\" data-transition=\"none\">\n    <input\
  \ type=\"text\" name=\"name\">\n    <input type=\"submit\" value=\"Submit\">\n</form>\n\
  ```\n\njQuery 会在按下返回键时自动应用相同的页面过渡，从而创建一个反向过渡。\n\n全局和单个页面过渡的完整示例代码如下：\n\n点击此处查看代码图片\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1\">\n    <title>Page Transitions - jQuery Mobile:\
  \ Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
  \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"assets/js/custom-jqm-transitions.js\"></script>\n\
  \    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n</head>\n<body class=\"container\">\n    <div data-role=\"page\">\n\
  \        <div data-role=\"header\"><h1>Page Name</h1></div>\n        <div data-role=\"\
  content\">\n            <p><a href=\"popup.html\" data-transition=\"pop\">Pop-up</a></p>\n\
  \            <form action=\"\" method=\"get\" data-transition=\"flip\">\n      \
  \          <input type=\"text\" name=\"name\">\n                <input type=\"submit\"\
  \ value=\"Submit\">\n            </form>\n        </div>\n    </div>\n</body>\n\
  </html>\n```\n\n\n\n\n对话框（Dialog windows）可以像多页模板一样包含在单个 HTML 文件的一个或多个页面中，也可以像单页模板一样是外部网页。要创建一个包含对话框窗口的多页模板，你只需要添加另一个\
  \ jQuery Mobile 页面——区别在于你链接到它的方式。换句话说，任何页面都可以是对话框；它之所以成为对话框，取决于它的打开方式。以下示例显示了一个带有\
  \ `data-rel` 属性的超链接，它可以在对话框窗口中打开页面：\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
  >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
  \    <title>Dialog - jQuery Mobile: Design and Develop</title>\n    <link rel=\"\
  stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
  \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
  header\"><h1>Dialog Test</h1></div>\n        <div data-role=\"content\">\n     \
  \       <p><a href=\"#multipage-dialog\" data-rel=\"dialog\">Open Multi-page Dialog</a></p>\n\
  \        </div>\n        <div data-role=\"footer\">Copyright</div>\n    </div>\n\
  \    <div data-role=\"page\" id=\"multipage-dialog\">\n        <div data-role=\"\
  header\"><h1>Multi-page dialog window</h1></div>\n        <div data-role=\"content\"\
  >\n            <p><a href=\"dialog.html\" data-rel=\"back\">OK</a></p>\n       \
  \ </div>\n    </div>\n</body>\n</html>\n```\n\n在例示例中，页有两个页面：第一个页面是默认显示的。在这个默认页面内，有一个带有\
  \ `data-rel=\"dialog\"` 属性并指向锚点的超链接。链接到的锚点是第二个页面的 ID。第二个页面的设置方式与任何 jQuery Mobile\
  \ 页面一样：由于其链接方式，它是作为对话框打开的。图 5.1 显示了这段代码的结果。\n\n![图像](img/05fig01.jpg)\n\n图 5.1。多页对话框窗口。\n\
  \n如所述，对话框窗口也可以通过带有 `data-rel=\"dialog\"` 属性和值的超链接链接到外部网页。接下来的示例与上一个非常相似，主要区别是超链接现在指向了一个名为\
  \ `dialog-window.html` 的外部 HTML 文件：\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
  >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
  \    <title>Dialog - jQuery Mobile: Design and Develop</title>\n    <link rel=\"\
  stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
  \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
  header\"><h1>Dialog Test</h1></div>\n        <div data-role=\"content\">\n     \
  \       <p><a href=\"dialog-window.html\" data-rel=\"dialog\">Open Dialog</a></p>\n\
  \        </div>\n        <div data-role=\"footer\">Copyright</div>\n    </div>\n\
  </body>\n</html>\n```\n\n被链接的 HTML 文件可以像任何 jQuery Mobile 一样设置：\n\n点击此处查看代码图像\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=UTF-8\">\n    <title>Dialog - jQuery Mobile: Design\
  \ and Develop</title>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div\
  \ data-role=\"header\"><h1>Single-page window</h1></div>\n        <div data-role=\"\
  content\">\n            <p><a href=\"#\" data-rel=\"back\">OK</a></p>\n        </div>\n\
  \    </div>\n</body>\n</html>\n```\n\n这段代码的结果如图 5.2 所示。\n\n![图像](img/05fig02.jpg)\n\
  \n图 5.2。单页窗口。\n\n对话框窗口也可以通过带有 `data-rel=\"dialog\"` 属性和值的超链接链接到外部网页。对话框可以通过带有 `data-rel=\"\
  dialog\"` 属性的链接，在下面的示例中，它在对话框窗口中打开了：\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
  >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
  \    <title>Dialog - jQuery Mobile: Design and Develop</title>\n    <link rel=\"\
  stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
  \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n    <style type=\"text/css\">\n        .ui-dialog .ui-header,\n    \
  \    .ui-dialog .ui-content,\n        .ui-dialog .ui-footer {\n            max-width:\
  \ 640px;\n        }\n    </style>\n</head>\n<body>\n    <div data-role=\"page\"\
  >\n        <div data-role=\"header\"><h1>Dialog Test</h1></div>\n        <div data-role=\"\
  content\">\n            <p>President Obama's Inaugural Address</p>\n           \
  \ <p><a href=\"dialog.html\" data-rel=\"dialog\">Play now &gt;</a></p>\n       \
  \ </div>\n        <div data-role=\"footer\">Copyright</div>\n    </div>\n</body>\n\
  </html>\n```\n\n对话框具有预定义的宽度，但可以通过 `.ui-dialog` 类进行覆盖。被加载的 HTML 文件包含了奥马总统就职演视频。由于移动设备的宽度可能比\
  \ 640 像素小得多，弹出窗口中的 iframe 宽度被设置为 100%。\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
  >\n    <title>Pop-up - jQuery Mobile: Design and Develop</title>\n</head>\n<body>\n\
  \    <div data-role=\"page\">\n        <div data-role=\"header\"><h1>President Obama's\
  \ Inaugural Address</h1></div>\n        <div data-role=\"content\">\n          \
  \  <iframe width=\"100%\" height=\"360\" src=\"http://www.youtube.com/embed/3PuHGKnNY\"\
  \ frameborder=\"0\" allowfullscreen></iframe>\n        </div>\n    </div>\n</body>\n\
  </html>\n```\n\n默认情况下，对话框（或弹出窗口）包含一个关闭按钮，因此你不需要为对话框窗口添加任何其他超链接或功能。图 5.3 显示了奥马总统就职视频弹出窗口的示例。\n\
  \n对话框包含过渡效果。默认过渡是 `pop`，但此过渡可以更改为 `flip` 或 `slidedown`。要更改过渡，请在包含 `data-rel=\"dialog\"\
  ` 设置的超链接上添加 `data-transition` 属性。如果在上一个示例中添加 `slidedown` `data-transition`，代码如下：\n\
  \n```html\n<a href=\"popup-window.html\" data-rel=\"dialog\" data-transition=\"\
  slidedown\">Play now &gt;</a>\n```\n\n\n\njQuery Mobile 提供了一种通过 HTML 锚点元素和输入元素创建按钮的方法。通过创建更大的可点击区域，按钮为标准链接和输入框提供了更易用的替代方案。要将超链接转换为按钮，请将\
  \ `data-role` 属性设置为 `button` (图 5.4)：\n\n点击此处查看代码图像\n\n```html\n<a href=\"#\" data-role=\"\
  button\">Hyperlink button</a>\n```\n\n![Image](img/05fig04.jpg)\n\n图 5.4。一个 `data-role`\
  \ 为 `button` 的链接元素。\n\n默认情况下，按钮占据容器元素的全宽度，但你可以使用 `data-inline` 属性将其设置为行内显示。当该属性设置为\
  \ `true` 时，创建的按钮宽度将由链接中的文本决定 (图 5.5)：\n\n点击此处查看代码图像\n\n```html\n<a href=\"#\" data-role=\"\
  button\" data-inline=\"true\">Hyperlink button</a>\n```\n\n![Image](img/05fig05.jpg)\n\
  \n图 5.5。一个 `data-inline` 设置为 `true` 的链接元素。\n\n按钮可以通过许多额外的 `data-` 属性进行增强。表 5.1 列出了所有可能的按钮\
  \ `data-` 属性及其值。\n\n表 5.1 按钮 `data-` 属性\n\n![Image](img/05tab01.jpg)\n\n输入按钮与超链接的区别在于，它们默认都是按钮。接例的提交（Submit）按钮默认为\
  \ jQuery Mobile 按钮：\n\n点击此处查看代码图像\n\n```html\n<input type=\"submit\" value=\"Submit\
  \ button\">\n```\n\n这个输入元素并没有特殊之处。图 5.6 显示了该输入按钮在经过 jQuery Mobile 增强后的外观。\n\n![Image](img/05fig06.jpg)\n\
  \n图 5.6。一个 `data-role` 等于 `button` 的提交按钮。\n\n许多类型的输入元素都会被 jQuery Mobile 自动增强为按钮。这包括\
  \ `type` 属性设置为 `button`、`submit`、`reset` 或 `image` 的输入元素，它们在默认情况下外观相同。更改这种默认增强的办法是将\
  \ `data-role` 设置为 `none`。\n\n按钮可以使用 `data-icon` 属性包含图标。默认图标的数量非常惊人，而且图标极易使用。表 5.2\
  \ 显示了通过 `data-icon` 属性添加到 jQuery Mobile 按钮的每个图标示例。\n\n表 5.2 按钮图标\n\n![Image](img/05tab02.jpg)\n\
  \n按钮图标可以放置在不同的位置。要实现这一点，请使用 `data-iconpos` 属性并将其设置为以下值之一：\n\n- `left`（`left` 是默认值）\n\
  - `right`\n- `top`\n- `bottom`\n- `notext`（如图 5.7 所示，此值仅使用图标，隐藏链接或输入值中的文本。）\n\n\
  ![Image](img/05fig07.jpg)\n\n图 5.7。一个使用 `notext` data-iconpos 配合首页 data-icon 图标的按钮示例。\n\
  \n也可以通过 CSS 使用自定义图标。要创建自定义图标，你首先需要选择一个名称值。为了本次演示，我们将使用 `checkmark`。在使用了按钮插件的链接或输入框中，在\
  \ `data-icon` 属性中使用该值会生成一个 CSS 类。该 CSS 类在自定义值之前包含 `ui-icon-`，因此我们定义的自定义值的 CSS 类为\
  \ `ui-icon-checkmark`。有了这个类，你可以轻松地定位到该类并添加背景图像作为图标：\n\n点击此处查看代码图像\n\n```css\n.ui-icon-checkmark\
  \ {\n    background-image: url(\"5-custom-icon.png\");\n}\n```\n\n在设计图标时，你可能想要创建一个\
  \ 18 × 18 像素带 alpha 透明度的 PNG-8 图片，以匹配内置的 jQuery Mobile 图标。图 5.8 显示了自定义图标的示例。\n\n\
  ![Image](img/05fig08.jpg)\n\n图 5.8。一个自定义的点选图标。\n\n现在我们已经创建了这个图标以及与其关联的 CSS 类，可以将图标分配给按钮了。要将新图标分配给按钮，我们只需使用\
  \ `data-icon` 属性并设置为 `checkmark`：\n\n点击此处查看代码图像\n\n```html\n<a href=\"#checkmark\"\
  \ data-role=\"button\" data-icon=\"checkmark\">Checkmark example</a>\n```\n\n这段代码的最终结果与图\
  \ 5.9 相似。\n\n![Image](img/05fig09.jpg)\n\n图 5.9。一个自定义的点选图标。\n\n## 总结\n\n本章的内容是任何移动网站的基础。\n\
  \n\n\n\n另一个明显的区别是标题元素包含一个 `ui-title` 类。该类设置了一系列组合属性，可以使文本居中、添加外边距、为溢出的文本创建省略号等。框架还添加了\
  \ `tabindex`，它通过创建逻辑性的选项卡切换顺序，自动使网页更具可访问性，该顺序会被像 iOS 带有内置“下一步”按钮的移动设备使用。页眉还可以包含标题元素以外的元素；例如，按钮可以是你工具栏中重要的补充。\n\
  \n### 添加按钮\n\n通过第 5 章中讨论的按钮选项、“**对话框和按钮]”以及无限数量的自定义图标，你可以满足想象到的任何功能需求。页眉是移动 Web\
  \ 应用中突出显示重要按钮的绝佳位置，使用 jQuery Mobile 可以轻松实现。以下示例显示了如何在编辑用户个人资料的对话框页眉元素中添加保存（Save）按钮：\n\
  \n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1\">\n    <title>Header Toolbar -\
  \ jQuery Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"\
  http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\" />\n    <script\
  \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"></script>\n\
  \    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
  header\">\n            <h1>John Doe</h1>\n            <a href=\"#options-dialog\"\
  \ data-icon=\"gear\" class=\"ui-btn-right\" data-rel=\"dialog\">Edit Profile</a>\n\
  \        </div>\n        <div data-role=\"content\">\n            <p>123 E Street</p>\n\
  \            <p>Chicago, Il 60622</p>\n        </div>\n    </div>\n    <div data-role=\"\
  page\" id=\"options-dialog\">\n        <div data-role=\"header\">\n            <h1>Edit\
  \ John Doe</h1>\n            <a href=\"#\" data-icon=\"check\">Save</a>\n      \
  \  </div>\n        <div data-role=\"content\">\n            <label for=\"profile-image\"\
  >Profile Image</label>\n            <p><img src=\"assets/img/profile.png\"></p>\n\
  \            <input type=\"file\" id=\"profile-image\" name=\"profile-image\">\n\
  \            <label for=\"street-address\">Street Address</label>\n            <input\
  \ type=\"text\" id=\"street-address\" name=\"street-address\" value=\"123 E Street\"\
  >\n            <label for=\"city\">City</label>\n            <input type=\"text\"\
  \ id=\"city\" name=\"city\" value=\"Chicago\">\n            <label for=\"state\"\
  >State</label>\n            <input type=\"text\" id=\"state\" name=\"state\" value=\"\
  Il\">\n            <label for=\"zip-code\">Zip Code</label>\n            <input\
  \ type=\"text\" id=\"zip-code\" name=\"zip-code\" value=\"6022\">\n        </div>\n\
  \    </div>\n</body>\n</html>\n```\n\n使用单页模板，添加了第二个页面并设置了一个超链接从默认页面以对话框形式打开它。在对话框窗口中，保存按钮通过\
  \ `data-icon` 属性进行视觉表示。默认页面选项按钮使用齿轮图标，而保存按钮使用勾选图标。插图 6.4 展示了在对话框窗口中显示可编辑表单以修改用户个人资料的方法。在更新输入后，用户可以点击保存按钮。你可以编写代码来处理用户的更新并将其存储在数据库中。\n\
  \n![图像](img/jquery-6-4.jpg)\n\n图 6.4。带有保存按钮的页眉工具栏。\n\n按钮也可以进行分组，而不是单独显示。要对按钮进行分组，只需在它们周围添加一个\
  \ `div` 作为容器，并应用一个值为 `controlgroup` 的 `data-role`，同时将 `data-type` 设置为 `horizontal`：\n\
  \n点击此处查看代码图像\n\n```html\n<div data-role=\"header\">\n    <div data-role=\"controlgroup\"\
  \ data-type=\"horizontal\">\n        <a href=\"#\" data-role=\"button\" data-icon=\"\
  delete\">Delete</a>\n        <a href=\"#\" data-role=\"button\" data-icon=\"check\"\
  >Save</a>\n    </div>\n</div>\n```\n\n你还会注意到 `data-role` 属性被设置为 `button`。此属性和值必须添加到\
  \ `controlgroup` 内部的按钮上，否则超链接将不会渲染为按钮。插图 6.5 显示此示例渲染了一个包含组合删除”和“保存”按钮的工具栏，因此这两个按钮不再显示为独立。\n\
  \n![图像](img/jquery-6-5.jpg)\n\n图 6.5。分组的按钮。\n\n也可以向工具栏中添加多个组组，以便在视觉上将这些组相互隔离开：\n\
  \n点击此处查看代码图像\n\n```html\n<div data-role=\"header\">\n    <div data-role=\"controlgroup\"\
  \ data-type=\"horizontal\" class=\"align-left\">\n        <a href=\"#\" data-role=\"\
  button\" data-icon=\"home\">Home</a>\n        <a href=\"#\" data-role=\"button\"\
  \ data-icon=\"arrow-l\">Back</a>\n    </div>\n    <div data-role=\"controlgroup\"\
  \ data-type=\"horizontal\" class=\"align-right\">\n        <a href=\"#\" data-role=\"\
  button\" data-icon=\"delete\">Delete</a>\n        <a href=\"#\" data-role=\"button\"\
  \ data-icon=\"check\">Save</a>\n    </div>\n</div>\n```\n\n这些按钮组也使用了自定义类，将一组左对齐，另一组右对齐。这些类的\
  \ CSS 是简单的左浮动和右浮动：\n\n```css\n<style type=\"text/css\">\n.align-left {\n    float:\
  \ left;\n}\n.align-right {\n    float: right;\n}\n</style>\n```\n\n插图 6.6 显示了这些按钮组在工具栏中的效果。\n\
  \n![图像](img/jquery-6-6.jpg)\n\n图 6.6。分组。\n\n### 页脚工具栏\n\n页脚工具栏与页眉工具栏相似，但通常位于页面底部而不是顶部。它们经常用于显示版权声明或其他信息。\n\
  \n```html\n<div data-role=\"footer\">\n    <h4>Copyright</h4>\n</div>\n```\n\n正如页眉工具栏中的标题，添加到页脚工具栏的任何文本都需要标题元素来包含间距、对齐等。以下代码示例显示了框架增强后的页脚工具栏：\n\
  \n点击此处查看代码图像\n\n```html\n<div data-role=\"footer\" class=\"ui-footer-a\" role=\"\
  contentinfo\">\n    <h4 class=\"ui-title\" tabindex=\"0\" role=\"heading\" aria-level=\"\
  1\">Copyright</h4>\n</div>\n```\n\n### 工具定位\n\n你可以将工具栏设置为固定（fixed）或全屏（fullscreen）。固定工具栏在网页上始终可见。当页眉工具栏是固定的，即使页面滚动，它也始终出现在顶部。当页脚工具栏是固定的，它始终显示在网络浏览器的底部。要为工具栏添加固定定位，只需要一个值为\
  \ `fixed` 的 `data-position` 属性：\n\n点击此处查看代码图像\n\n```html\n<div data-role=\"page\"\
  >\n    <div data-role=\"header\" data-position=\"fixed\">\n        <h1>Page Title</h1>\n\
  \    </div>\n    <div data-role=\"content\">\n        <p>Body Copy</p>\n    </div>\n\
  \    <div data-role=\"footer\" data-position=\"fixed\">\n        <h4>Copyright</h4>\n\
  \    </div>\n</div>\n```\n\n插图 6.7 显示了这些工具栏在网络浏览器中的渲染情况。\n\n![图像](img/jquery-6-7.jpg)\n\
  \n图 6.7。固定工具栏。\n\n此代码的结果以类似于 CSS 中的固定定位的方式工作，但 jQuery Mobile 并没有使用 CSS 实现此功能。由于许多移动浏览器不支持固定定位，jQuery\
  \ Mobile 使用动态重新定位来代替。\n\n\n\n\n\n你也可以通过 jQuery Mobile API 更新工具栏的位置。这种方法有时是必要的，例如当小部件（如手风琴）展开并导致页面高度发生变化时。你可以调用以下代码来更新工具栏的位置：\n\
  \n点击此处查看代码图像\n\n```javascript\n$.mobile.fixedToolbars.show(true);\n```\n\n当你正在构建动态内容时，这段代码非常好用。\n\
  \n除了固定工具栏外，你还可以创建全屏固定页眉。全屏固定页眉与固定头部相同，唯一区别是内容位于工具栏之后，因此内容仍然是全屏的，而工具栏是透明的。点击页面时，工具栏也会消失。要创建全屏固定工具栏，只需添加\
  \ `data-fullscreen` 属性并将其设置为 `true`：\n\n点击此处查看代码图像\n\n```html\n<div data-role=\"\
  header\" data-fullscreen=\"true\" data-position=\"fixed\">\n    <h1>Page Title</h1>\n\
  </div>\n```\n\n对于普通的固定工具栏，内容位于页眉和页脚之间。全屏工具栏常用于视频播放器或幻灯片播放。\n\n### 创建导航栏\n\n导航在网页页眉中显示得最为显著。jQuery\
  \ Mobile 提供了一个名为 `navbar` 的部件来创建导航。导航栏并不要求位于页眉工具栏中，但它们通常出现在页眉或页脚中。让我们看看如何有效地将其用作移动网站页眉中的页面导航。导航栏本质上是一个包含在带有\
  \ `data-role` 值为 `navbar` 的元素中的简单无序列表：\n\n点击此处查看代码图像\n\n```html\n<div data-role=\"\
  header\">\n    <div data-role=\"navbar\">\n        <ul>\n            <li><a href=\"\
  /\">Home</a></li>\n            <li><a href=\"#\">About</a></li>\n            <li><a\
  \ href=\"#\">Contact</a></li>\n        </ul>\n    </div>\n</div>\n```\n\njQuery\
  \ Mobile 再次通过添加单个属性，使其能够极其轻松地将简单的 HTML 标记转换为视觉上具有吸引力且功能完备部件。图 6.8 显示了此代码在视觉上的渲染效果。\n\
  \n![Image](img/jquery-6-8.jpg)\n\n图 6.8。用在页眉工具栏中的导航栏。\n\n该框架酷的地方在于，它根据按钮的数量均匀地划分导航栏的空间。这就是为什么图\
  \ 6.8 中的每个按钮都是比例的。导航栏唯一的注意事项是，如果它们包含超过五个超链接，它们将开始换行到多行，如图 6.9 所示。\n\n![Image](img/jquery-6-9.jpg)\n\
  \n图 6.9。拥有五个按钮按钮的导航栏。\n\n这在某种上是一个局限性，但它也是一种幸运，因为移动设备没有足够的水平空间来容纳这么多按钮。\n\n页眉导航栏的另一个优点是，它们不需要你移除页面标题。你仍然可以使用带有页面标题的标题元素，然后在下方添加导航栏。或者，更好的是，你可以添加一个\
  \ Logo 然后添加一个导航栏，就像你在整个网络上通常看到的那样：\n\n点击此处查看代码图像\n\n```html\n<div data-role=\"header\"\
  >\n    <img src=\"assets/img/trademark-jquerymobiletv.png\">\n    <div data-role=\"\
  navbar\">\n        <ul>\n            <li><a href=\"/\">Home</a></li>\n         \
  \   <li><a href=\"#\">About</a></li>\n            <li><a href=\"#\">Contact</a></li>\n\
  \        </ul>\n    </div>\n</div>\n```\n\n如图 6.10 所示，Logo 被添加在导航上方。页眉工具栏可以包含多个元素；它们不仅限于按钮或页面标题。\n\
  \n![Image](img/jquery-6-10.jpg)\n\n图 6.10。页眉中的导航栏和 Logo。\n\n图 6.11 显示了一个导航栏。\n\n\
  ![Image](img/jquery-6-11.jpg)\n\n图 6.11。导航栏和 Logo。\n\n## 总结\n\n工具栏可以帮助你建立页面上的一致性。除了固定工具栏外，你还可以创建全屏固定页眉。全屏固定页眉与固定头部相同，唯一区别是内容位于工具栏之后，因此内容仍然是全屏的，而工具栏是透明的。点击页面时，工具栏也会消失。\n\
  \n### 布局选项\n\njQuery Mobile 的灵活之处在于它支持标准 HTML，同时也提供了自定义布局。当你需要将内容组织成网格时，网格非常有用。你可以通过定义你想要的列数来创建一个网格。以下示例显示了如何创建一个网格布局。\n\
  \n\n\n\n图 7.1。双列网格。\n\n此代码的结果将与 图 7.2 类似。\n\n![Image](img/jquery-7-2.jpg)\n\n图 7.2。具有不同列数量的多个网格。\n\
  \n列本身是非常单调的，但你可以添加预定义的 jQuery Mobile 类，或者为现有的类编写你自己的 CSS。例如，jQuery Mobile 框架包含一个名为\
  \ `ui-bar` 的类，它添加了内边距，还有另一组类可以通过在末尾添加字母来定制主题，这会影响背景、杂项字体样式等。我们将在书的后部分学习更多关于 jQuery\
  \ Mobile 主题的内容。接的示例使用 `ui-bar-a` 类来添加蓝色背景渐变、字体样式以及其他的 CSS 更新：\n\n点击此处查看代码图像\n\n\
  ```html\n<div class=\"ui-grid-a\">\n    <div class=\"ui-block-a\">\n        <div\
  \ class=\"ui-bar ui-bar-b\"><<strong>双列</strong></div>\n    </div>\n    <div class=\"\
  ui-block-b\">\n        <div class=\"ui-bar ui-bar-b\">列</div>\n    </div>\n</div>\n\
  ```\n\n图 7.3 显示此代码的结果，它看起来比之前的示例漂亮得多，添加了增强网格的样式更新。\n\n![Image](img/jquery-7-3.jpg)\n\
  \n图 7.3。带有 `ui-bar` 类的双列网格。\n\n在网格列中添加自定义 CSS 是非常简单的。由于网格是标准的 HTML 标记，你可以向任何元素添加自定义\
  \ CSS 类。在接下来的示例中，已向第一列添加了自定义类 `block-title`，并向网格中的所有 `div` 元素添加了另一个类：\n\n点击此处查看代码图像\n\
  \n```html\n<!DOCTYPE html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n    <title>Grids - jQuery Mobile: Design and Develop</title>\n\
  \    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
  \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n    <style type=\"text/css\">\n    .ui-grid-a div {\n        background-color:\
  \ #ccc;\n    }\n    .ui-grid-a div.block-title {\n        background-color: #fff;\n\
  \    }\n    </style>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div\
  \ data-role=\"header\" data-position=\"fixed\">\n            <h1>My Page Title</h1>\n\
  \        </div>\n        <div data-role=\"content\">\n            <div class=\"\
  ui-grid-a\">\n                <div class=\"ui-block-a block-title\">2-Column</div></div>\n\
  \                <div class=\"ui-block-b\">Column</div></div>\n            </div>\n\
  \        </div>\n        <div data-role=\"footer\" data-position=\"fixed\">\n  \
  \          <h4>Copyright</h4>\n        </div>\n    </div>\n</body>\n</html>\n```\n\
  \n此代码的结果将与 图 7.4 类似。\n\n![Image](img/jquery-7-4.jpg)\n\n图 7.4。带有自定义 CSS 的双列网格。\n\
  \n使用双列网格是处理 第 5 章 对话框与按钮 中按钮组功能的更好方法。与其使用浮动（floats）来对齐控制组，不如使用网格将它们隔离开。下面的代码展示了如何使用网格在工具栏内创建布局：\n\
  \n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1\">\n    <title>Grid with controlgroup\
  \ - jQuery Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"\
  http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\" />\n    <script\
  \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"></script>\n\
  \    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n    <style type=\"text/css\">\n    .ui-grid-a div {\n        background-color:\
  \ #ccc;\n    }\n    </style>\n</head>\n<body>\n    <div data-role=\"page\">\n  \
  \      <div data-role=\"header\" data-position=\"fixed\">\n            <div class=\"\
  ui-grid-a\">\n                <div class=\"ui-block-a\">\n                    <div\
  \ class=\"ui-bar ui-bar-b\">Home</div>\n                </div>\n               \
  \ <div class=\"ui-block-b\">\n                    <div class=\"ui-bar ui-bar-b\"\
  >Back</div>\n                </div>\n            </div>\n        </div>\n      \
  \  <div data-role=\"content\">\n            <p>Body</p>\n        </div>\n      \
  \  <div data-role=\"footer\" data-position=\"fixed\">\n            <h4>Copyright</h4>\n\
  \        </div>\n    </div>\n</body>\n</html>\n```\n\n图 7.5 显示此代码的结果，它比之前的示例漂亮得多，添加了增强网格的样式更新。\n\
  \n![Image](img/jquery-7-5.jpg)\n\n图 7.5。用于分离控制组的网格。\n\n### 行\n\n在网格列中添加自定义 CSS 是简单的。由于网格是标准的\
  \ HTML 标记，你可以向任何元素添加自定义 CSS 类。在接下来的示例中，已向第一列添加了自定义类 `block-title`，并向网格中的所有 `div`\
  \ 元素添加了另一个类：\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta\
  \ http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1\">\n    <title>Grid with\
  \ controlgroup - jQuery Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\"\
  \ href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\" />\n\
  \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n    <style type=\"text/css\">\n    .ui-grid-a .block-b {\n        text:\
  \ right;\n    }\n    </style>\n</head>\n<body>\n    <div data-role=\"page\">\n \
  \       <div data-role=\"header\" data-position=\"fixed\">\n            <div class=\"\
  ui-grid-a\">\n                <div class=\"ui-block-a\">\n                    <div\
  \ class=\"ui-bar ui-bar-b\">Home</div>\n                </div>\n               \
  \ <div class=\"ui-block-b\">\n                    <div class=\"ui-bar ui-bar-b\"\
  >Back</div>\n                </div>\n            </div>\n        </div>\n      \
  \  <div data-role=\"content\">\n            <p>Body</p>\n        </div>\n      \
  \  <div data-role=\"footer\" data-position=\"fixed\">\n            <h4>Copyright</h4>\n\
  \        </div>\n    </div>\n</body>\n</html>\n```\n\n### 列\n\njQuery Mobile 也允许你创建具有多个列的网格。例如，为了创建一个四列网格，必须使用\
  \ `ui-grid` 类。接的示例展示了具有四列的网格：\n\n```html\n<div class=\"ui-grid-a\">\n    <div class=\"\
  ui-block-a\">\n        <div class=\"ui-bar ui-bar-b\">A</div>\n    </div>\n    <div\
  \ class=\"ui-block-b\">\n        <div class=\"ui-bar ui-bar-b\">B</div>\n    </div>\n\
  \    <div class=\"ui-block-c\">\n        <div class=\"ui-bar ui-bar-b\">C</div>\n\
  \    </div>\n    <div class=\"ui-block-d\">\n        <div class=\"ui-bar ui-bar-b\"\
  >D</div>\n    </div>\n</div>\n```\n\n每个带有 `ui-block-a` 类的元素会自动清除之前的行，从而产生新行。通过查看\
  \ jQuery Mobile 框架中包含 `ui-block-a` 类的实际 CSS，你可以看到它清除了左浮动，因此结果与 图 7.6 类似。\n\n![Image](img/jquery-7-6.jpg)\n\
  \n图 7.6。具有多个行和列的网格。\n\n### 折叠内容\n\njQuery Mobile 提供了一个组件，允许开发者创建可以展开和收叠的内容。这种组件被称为折叠内容，包含一个头部和一个内容区域；头部作为可以点击以展开或收叠内容区域的按钮。创建一个折叠内容区域，将\
  \ `data-role` 属性的值设置为 `collapsible` 应用到包含标题和内容区域的 `div` 上。在接的示例中，`data-role` 设置为\
  \ `collapsible` 的容器元素包含标题和一个段落元素：\n\n```html\n<div data-role=\"collapsible\">\n\
  \    <h3>折叠内容头部</h3>\n    <p>这是折叠的内容区域。</p>\n</div>\n```\n\n\n\nLorem ipsum dolor\
  \ sit amet, consectetur adipiscing elit. Praesent non dolor quis elit suscipit commodo\
  \ a eu velit. Nulla sodales velit arcu, at accumsan nisi. Donec porta tempus lorem,\
  \ eget luctus diam luctus ac. Nunc et aliquam massa. Duis enim felis, varius quis\
  \ pharetra quis, iaculis ac nulla. Morbi congue suscipit elit vel porta. Proin lacinia\
  \ scelerisque risus, at elementum diam elementum et.\n\n通过在容器上添加 `collapsible` `data-role`，标题元素将自动转换为按钮，用于展开和收起段落。在视觉上，该示例将产生如图\
  \ 7.7 所示的序列。\n\n![Image](img/jquery-7-7.jpg)\n\n图 7.7\\.. 用于节省空间的折叠内容按钮。\n\n可折叠内容是组织大量信息的极佳方法。一次性显示大量数据可能会让人无从从备，并阻止人们访问您的宝贵内容。通过在用户首次加载网页时隐藏内容，可以保持内容的整洁，让用户只显示他们感兴趣的内容区域。\n\
  \n可折叠内容区域还可以包含一个名为 `data-collapsed` 的属性。默认情况下，折叠内容区域在网页首次加载时是折叠的。`data-collapsed`\
  \ 属性提供了一种在页面首次加载时展开折叠区域的方法。以下示例显示了实现此目的的标记：\n\n点击此处查看代码图像\n\n```\n<div data-role=\"\
  collapsible\" data-collapsed=\"false\">\n    <h3>折叠内容页眉</h3>\n    <p>Lorem ipsum\
  \ dolor sit amet, consectetur adipiscing elit. Praesent non dolor quis elit suscipit\
  \ commodo a eu velit. Nulla sodales velit arcu, at accumsan nisi. Donec porta tempus\
  \ lorem, eget luctus diam luctus ac. Nunc et aliquam massa. Duis enim felis, varius\
  \ quis pharetra quis, iaculis ac nulla. Morbi congue suscipit elit vel porta. Proin\
  \ lacinia scelerisque risus, at elementum diam elementum et.</p>\n</div>\n```\n\n\
  通过在另一个折叠内容区域内部添加另一个折叠内容区域，也可以嵌套折叠内容。以下示例显示了如何编写标记来创建嵌套折叠内容区域：\n\n点击此处查看代码图像\n\n\
  ```\n<div data-role=\"collapsible\" data-collapsed=\"false\">\n    <h3>折叠内容页眉</h3>\n\
  \    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>\n    <div data-role=\"\
  collapsible\">\n        <h3>折叠子项 #1</h3>\n        <p>Lorem ipsum dolor sit amet.</p>\n\
  \    </div>\n    <div data-role=\"collapsible\">\n        <h3>折叠子项 #2</h3>\n   \
  \     <p>Lorem ipsum dolor sit amet.</p>\n    </div>\n</div>\n```\n\n此示例中两个高亮显示的折叠内容区域嵌套在主折叠区域中。这种嵌套折叠内容的结果看起来将与图\
  \ 7.8 相似。\n\n![Image](img/jquery-7-8.jpg)\n\n图 7.8\\. 在打开嵌套折叠内容区域时发生的事件序列。\n\n还可以进行更深层的嵌套；事实上，你可以根据需要进行任意深嵌套。\n\
  \n### 创建手风琴\n\n可折叠内容区域还可以分组以创建手风琴。手风琴本质上是一组相互感知的折叠内容区域。例如，当其中一个折叠内容区域展开时，任何已展开的区域都会关闭，因此每次只有一个内容区域是展开的。\n\
  \n要定义手风琴，必须创建一个容器元素来包含一组可折叠内容区域。在该容器元素上，必须将 `data-role` 设置为值 `collapsible-set`。就这样。以下代码显示了带有两个折叠内容区域的手风琴的标记：\n\
  \n点击此处查看代码图像\n\n```\n<div data-role=\"collapsible-set\">\n    <div data-role=\"\
  collapsible\">\n        <h3>头部 #1</h3>\n        <p>Lorem ipsum dolor sit amet.</p>\n\
  \    </div>\n    <div data-role=\"collapsible\">\n        <h3>头部 #2</h3>\n     \
  \   <p>Lorem ipsum dolor sit amet.</p>\n    </div>\n</div>\n```\n\n此示例中的代码创建了一个手风琴，其功能类似于图\
  \ 7.9 所示的序列。\n\n![Image](img/jquery-7-9)\n\n图 7.9\\. 手风琴示例\n\n## 总结\n\njQuery Mobile\
  \ 让 JavaScript 变得极其易用。使用 `data-` 属性，内容可以折叠。\n\n## 8. 使用列表\n\n列表被频繁使用。jQuery Mobile\
  \ 提供了大量的选项来实现任何设计，例如链接列表、编号列表、内嵌列表、分割列表、带分隔符的列表，以及带有缩略图和图标的列表。你在 jQuery Mobile 中看到的的最常见模式之一是链接列表。\n\
  \n### 基础列表\n\n你在 jQuery Mobile 中看到的常见模式之一是链接列表。以下标记显示了使用 `data-role` 的链接列表：\n\n\
  点击此处查看代码图像\n\n```\n<ul data-role=\"listview\">\n    <li><a href=\"#\">首页</a></li>\n\
  \    <li><a href=\"#\">文章</a></li>\n    <li><a href=\"#\">视频</a></li>\n    <li><a\
  \ href=\"#\">书籍</a></li>\n    <li><a href=\"#\">更多</a></li>\n</ul>\n```\n\n此 `listview`\
  \ 标记由框架增强以生成链接列表。图 8.1 显示了该标记的可视化结果。\n\n![Image](img/8-1.jpg)\n\n图 8.1\\. 链接列表。\n\
  \n增强会改变标记，产生不同的 HTML。下一个示例显示了框架增强后的标记片段。显示了列表标签和第一个列表项以提供增强示例，而新部分被高亮显示以显示代码进行了代码。注意缺失的列表项（`<!--\
  \ etc. -->）都以与第一个列表相同的方式进行了更改：\n\n点击此处查看代码图像\n\n```\n<ul data-role=\"listview\"\
  \ class=\"ui-listview\">\n    <li data-theme=\"c\" class=\"ui-btn ui-icon-right\
  \ ui-li-has-arrow ui-li ui-btn-up-c\">\n        <div class=\"ui-btn-inner ui-li\"\
  \ aria-hidden=\"true\">\n            <div class=\"ui-btn-text\">\n             \
  \   <a href=\"#\" class=\"ui-link-inherit\">首页</a>\n            </div>\n       \
  \     <span class=\"ui-icon ui-icon-arrow-r ui-icon-shadow\"></span>\n        </div>\n\
  \    </li>\n</ul>\n```\n\n\n\n正如你所看到的，框架对代码进行了大量补充以实现视觉增强。首先，添加了 `ui-listview` 类来设置页边距，并传递了\
  \ `list-style`。然后更新了列表项，将 `data-theme` 属性设置为 `c` 主题，并添加了一组 CSS 类。我们将在书的后部分学习更多关于\
  \ jQuery Mobile 主题的内容。添加的类包括 `ui-btn`、`ui-btn-icon-right`、`ui-li-has-arrow`、`ui-li`\
  \ 和 `ui-btn-up-c`。这些名称基本上已经解释了一切；例如，`ui-btn` 添加了指针光标，将 `display` 设置为 `block`，并添加了一些间距使其更易点击，而\
  \ `ui-btn-icon-right` 则告诉 `span` 元素与箭头图标右对齐。你可以通过像 Chrome 开发者工具之类的代码检查器深入查看这些 CSS\
  \ 类中的每一个一个。图 8.2 显示了列表项的一些类及其属性。\n\n![Image](img/jquery-8-2.jpg)\n\n图 8.2。框架创建的自定义\
  \ CSS。\n\n## 数字有序列表\n\n你可以使用 `listview` 的 `data-role` 从相同的代码创建有序列表：只需将 `ul` 转换为\
  \ `ol` 即可。下面的示例显示了带有数字列表项的修改后的代码：\n\n点击此处查看代码图像\n\n```html\n<ol data-role=\"listview\"\
  >\n    <li><a href=\"#\">首页</a></li>\n    <li><a href=\"#\">文章</a></li>\n    <li><a\
  \ href=\"#\">视频</a></li>\n    <li><a href=\"#\">书籍</a></li>\n    <li><a href=\"\
  #\">更多</a></li>\n</ol>\n```\n\n视觉结果与 图 8.3 相似，数字作为列表项的一部分内缩显示。\n\n![Image](img/jquery-8-3.jpg)\n\
  \n图 8.3。一个基础有序列表。\n\n## 嵌套列表\n\n嵌套列表默认是隐藏的，并像额外的页面一样加载。当列表嵌套在另一个列表项内部时，父列表项将变成指向子列表的超链接，框架会为该列表生成一个新的\
  \ `ui-page`。要创建嵌套列表，只需取任何列表项并向其添加另一个无序或有序列表。在以下示例中，我们之前示例中的“更多”列表项被配置为 `h2` 标题，并带有描述和一个嵌套的无序列表：\n\
  \n点击此处查看代码图像\n\n```html\n<ul data-role=\"listview\">\n    <li><a href=\"#\">首页</a></li>\n\
  \    <li><a href=\"#\">文章</a></li>\n    <li><a href=\"#\">视频</a></li>\n    <li><a\
  \ href=\"#\">书籍</a></li>\n    <li>\n        <h2>更多</h2>\n        <p>在 jQuery Mobile\
  \ 上寻找更多资源</p>\n        <ul data-role=\"listview\">\n            <li><a href=\"http://www.jquerymobile.com\"\
  >jQuery Mobile</a></li>\n            <li><a href=\"http://www.jquery.com\">jQuery</a></li>\n\
  \        </ul>\n    </li>\n</ul>\n```\n\n当框架增强 `listview` 时，“更多”列表项将变为指向嵌套列表的超链接，如\
  \ 图 8.4 所示。\n\n![Image](img/jquery-8-4.jpg)\n\n图 8.4。选择“更多”列表项后会出现嵌套列表。\n\n从此嵌套列表生成的页面包含一个其值为列表项标题的页眉，然后是嵌套列表本身。列表可以根据你的需要进行任意深嵌套；框架将简单地生成更多的页面。\n\
  \n## 内缩列表\n\n默认情况下，列表的宽度设置为查看列表的设备宽度；换句话说，它们的宽度始终被设置为 100%。你可以添加一个属性来创建所谓的“内缩列表（inset\
  \ list）”，它看起来是内缩在页面之内的（而不是延伸到设备边缘），并且具有圆角。下面的示例显示了一个 `data-inset` 属性设置为 `true` 的基础链接列表：\n\
  \n点击此处查看代码图像\n\n```html\n<ul data-role=\"listview\" data-inset=\"true\">\n    <li><a\
  \ href=\"#\">首页</a></li>\n    <li><a href=\"#\">文章</a></li>\n    <li><a href=\"\
  #\">视频</a></li>\n    <li><a href=\"#\">书籍</a></li>\n    <li><a href=\"#\">更多</a></li>\n\
  </ul\n```\n\n将此属性设置为 `true` 会产生 图 8.5 所示视觉效果。\n\n![Image](img/jquery-8-5.jpg)\n\n\
  图 8.5。`data-inset` 属性设置为 `true` 的基础链接列表。\n\n## 自定义列表\n\n一旦你理解了如何创建基础列表，你可能会发现自己想要更多。可以使用\
  \ `data-` 属性使用分隔符、缩略图等对列表进行自定义。\n\n### 分割列表\n\n分割列表（Split lists）是带有更多选项的列表。你可以通过取任何列表项并添加另一个无序或有序列表来创建嵌套列表。如下示例所示：\n\
  \n点击此处查看代码图像\n\n```html\n<ul data-role=\"listview\" data-inset=\"true\">\n    <li>\n\
  \        <a href=\"#item-detail\">\n            <h3>使用 jQuery Mobile</h3>\n    \
  \        <p>在 Mobile 中有很多组件</p>\n        </a>\n        <a href=\"#item-purchase\"\
  \ data-rel=\"dialog\">购买</a>\n    </li>\n    <li>\n        <a href=\"#item-detail\"\
  >\n            <h3>使用 jQuery API</h3>\n            <p>jQuery 提供了对内容的额外控制</p>\n \
  \       </a>\n        <a href=\"#item-purchase\" data-rel=\"dialog\">购买</a>\n  \
  \  </li>\n</ul>\n```\n\n当框架增强 `listview` 时，分割列表项将变为指向详细列表的超链接，如 图 8.6 所示。\n\n![Image](img/jquery-8-6.jpg)\n\
  \n图 8.6。带有齿轮图标的列表。\n\n你可以使用 `data-split-icon` 属性更改列表项右侧的默认图标。这些与 图 8.7 所示的按钮图标相同，但你也可以使用自定义图标。\n\
  \n![Image](img/jquery-8-7.jpg)\n\n图 8.7。`data-split-icon` 属性可用的图标。\n\n### 列表分隔符\n\
  \n列表分隔符可以对你的列表项进行分类，是基础列表的另一个有用补充。例如，你可以对列表项进行排序并使用分隔符按字母进行分组，或者使用分隔符按类型对音乐列表进行分组。下面的示例显示了作为分隔符的乐队以及每个乐队的一些专辑标题：\n\
  \n点击此处查看代码图像\n\n```html\n<ul data-role=\"listview\">\n    <li data-role=\"list-divider\"\
  >The Beatles</li>\n    <li>Meet The Beatles!</li>\n    <li>A Hard Day's Night</li>\n\
  \    <li>Help!</li>\n    <li>Rubber Soul</li>\n    <li>Revolver</li>\n    <li data-role=\"\
  list-divider\">The Doors</li>\n    <li>The Doors</li>\n    <li>Strange Days</li>\n\
  \    <li>Waiting for the Sun</li>\n    <li>The Soft Parade</li>\n    <li>Morrison\
  \ Hotel</li>\n    <li data-role=\"list-divider\">The Jimi Hendrix Experience</li>\n\
  \    <li>Are You Experienced</li>\n    <li>Bold as Love</li>\n    <li>Electric Ladyland</li>\n\
  </ul>\n```\n\n此代码示例中的高亮部分包含一个值为 `list-divider` 的 `data-role`。使用 `data-role` 属性值\
  \ `list-divider` 会在视觉上将其与其他列表项区分开来。图 8.8 显示了 `list-divider` `data-role` 如何创建这种隔离。\n\
  \n\n\n\n\n![Image](img/jquery-8-8.jpg)\n\n图 8.8。带有列表分隔符的长列表。\n\n### 计数气泡、缩略图和图标\n\
  \n你可以通过计数气泡、缩略图和图标在列表中创建不同的视觉样式。要在列表项中添加计数气泡，只需使用 `ul-li-count` 类。要将计数气泡与列表项文本分开，请使用\
  \ `span` 元素来包含计数气泡的值：\n\n点击此处查看代码图片\n\n```html\n<ul data-role=\"listview\">\n  \
  \  <li>\n        <a href=\"#inbox\">收件箱\n            <span class=\"ui-li-count\"\
  >12</span>\n        </a>\n    </li>\n    <li>\n        <a href=\"#outbox\">发送箱\n\
  \            <span class=\"ui-li-count\">0</span>\n        </a>\n    </li>\n   \
  \ <li>\n        <a href=\"#sent\">已发送\n            <span class=\"ui-li-count\">57</span>\n\
  \        </a>\n    </li>\n    <li>\n        <a href=\"#trash\">垃圾箱\n           \
  \ <span class=\"ui-li-count\">1090</span>\n        </a>\n    </li>\n</ul>\n```\n\
  \n此示例代码的最终结果如 图 8.9 所示。\n\n![Image](img/jquery-8-9.jpg)\n\n图 8.9。带有计数气泡的简单列表。\n\n\
  邮件文件夹是可以使用计数气泡的列表项 Excellent 示例——在这种情况下，用于显示每个区域有多少封邮件——但计数气泡也可用于许多情况。例如，带有条带及其专辑的列表分隔符示例可以转换为嵌套列表，父元素可以显示每个父列表项中有多少专辑/子列表项：\n\
  \n点击此处查看代码图片\n\n```html\n<ul data-role=\"listview\">\n    <li>\n        <h2>The\
  \ Beatles</h2>\n        <span class=\"ui-li-count\">5</span>\n        <ul data-role=\"\
  listview\">\n            <li>Meet The Beatles!</li>\n            <li>A Hard Day's\
  \ Night</li>\n            <li>Help!</li>\n            <li>Rubber Soul</li>\n   \
  \         <li>Revolver</li>\n        </ul>\n    </li>\n    <li>\n        <h2>The\
  \ Doors</h2>\n        <span class=\"ui-li-count\">5</span>\n        <ul data-role=\"\
  listview\">\n            <li>The Doors</li>\n            <li>Strange Days</li>\n\
  \            <li>Waiting for the Sun</li>\n            <li>The Soft Parade</li>\n\
  \            <li>Morrison Hotel</li>\n        </ul>\n    </li>\n    <li>\n     \
  \   <h2>The Jimi Experience</h2>\n        <span class=\"ui-li-count\">3</span>\n\
  \        <ul data-role=\"listview\">\n            <li>Are You</li>\n           \
  \ <li>Bold as Love</li>\n            <li>Electricyland</li>\n        </ul>\n   \
  \ </li>\n</ul>\n```\n\n此示例的结果如 图 8.10 所示，在同一个列表项中包含计数气泡和嵌套列表。\n\n![Image](img/jquery-8-10.jpg)\n\
  \n图 8.10。带有计数气泡的简单列表。\n\n你可以像向 HTML 页面添加图像一样添加缩略图。只需向列表项添加锚点元素，添加一张作为缩略图的图像，并添加你想显示在图标旁边的标题和文本：\n\
  \n点击此处查看代码图片\n\n```html\n<ul data-role=\"listview\">\n    <li>\n        <a href=\"\
  #led-zeppelin/led-zeppelin-iv\">\n            <img src=\"assets/img/led-zeppelin-IV.png\"\
  >\n            <h3>Led Zeppelin</h3>\n            <p>Led Zeppelin IV</p>\n     \
  \   </a>\n    </li>\n    <li>\n        <a href=\"#led-zeppelin/houses-of-the-holy\"\
  >\n            <img src=\"assets/img/houses-of-the-holy.png\">\n            <h3>Led\
  \ Zeppelin</h3>\n            <p>Houses of the Holy</p>\n        </a>\n    </li>\n\
  </ul>\n```\n\njQuery Mobile 确切知道如何处理此类设置的列表，因为它会将图像转换为 `listview` 中列表项的缩略图。此代码的结果如\
  \ 图 8.11 所示。\n\n![Image](img/jquery-8-11.jpg)\n\n图 8.11。带有列表项缩略图的列表。\n\n图标的添加方式与缩略图相同；不同之处在于图像元素上使用了\
  \ `ui-li-icon` 类：\n\n点击此处查看代码图片\n\n```html\n<ul data-role=\"listview\">\n    <li>\n\
  \        <a href=\"#led-zeppelin/led-zeppelin-iv\">\n            <img src=\"assets/img/led-zeppelin-IV.png\"\
  \ class=\"ui-li-icon\" width=\"16\" height=\"16\">\n            Led Zeppelin IV\n\
  \        </a>\n    </li>\n    <li>\n        <a href=\"#led-zeppelin/houses-of-the-holy\"\
  >\n            <img src=\"assets/img/houses-of-the-holy.png\" class=\"ui-li-icon\"\
  \ width=\"16\" height=\"16\">\n            Houses of the Holy\n        </a>\n  \
  \  </li>\n</ul>\n```\n\n![Image](img/note.jpg)\n\n已添加 `width` 和 `height`。\n\n##\
  \ 总结\n\n列表对移动设备至关重要。正如你在本章看到的，jQuery 依赖列表。\n\n## 搜索过滤\n\n基础搜索功能是网站的常见功能，但开发非常耗时。幸运的是，jQuery\
  \ Mobile 在用户输入时提供建议。\n\n### 创建过滤栏\n\n正如提到的，该框架为列表添加搜索过滤非常简单：只需为列表添加 `data-filter`\
  \ 属性并将值设置为 `true`。以下示例是一个歌曲列表：\n\n```html\n<ul data-role=\"listview\" data-filter=\"\
  true\">\n    <li>Across The Universe</li>\n    <li>Act Naturally</li>\n    <li>Ain't\
  \ She Sweet</li>\n    <li>All I've Got To Do</li>\n    <li>All My Loving</li>\n\
  \    <li>All Together Now</li>\n    <li>All You Need Is Love</li>\n    <li>And I\
  \ Love Her</li>\n    <li>And Your Bird Can Sing</li>\n    <li>Anna (Go To Him)</li>\n\
  \    <li>Another Girl</li>\n    <li>Any Time At All</li>\n    <li>Ask Me Why</li>\n\
  \    <li>Baby It's You</li>\n    <li>Baby, You're A Rich Man</li>\n    <li>Baby's\
  \ In Black</li>\n    <li>Back In The U.S.R.</li>\n    <li>Bad Boy</li>\n    <li>The\
  \ Ballad Of John And Yoko</li>\n    <li>Because</li>\n    <li>Being For The Benefit\
  \ Of Mr. Kite!</li>\n    <li>Besame Mucho</li>\n    <li>Birthday</li>\n    <li>Blackbird</li>\n\
  </ul>\n```\n\n正如你可以想象的，这个列表非常长；但是 `data-filter` 属性会在列表顶部添加一个搜索过滤栏，帮助用户找到他想要的内容。**图\
  \ 9.1** 显示了用户在过滤字段中输入时视觉上发生的事件示例。随着字母的输入，结果会缩小，只显示与搜索文本匹配的项。\n\n\n\n\n如你所见，框架为搜索过滤器输入框添加了“过滤项目...”的默认值。你可以通过一个名为\
  \ `data-filter-placeholder` 的额外属性更改此默认文本，该属性可以使用在无序列表（`<ul>`）或有序列表（`<ol>`）元素。下面的示例显示了在之前的披头士歌曲列表中包含此属性的代码：\n\
  \n点击此处查看代码图像\n\n```html\n<ul data-role=\"listview\" data-filter=\"true\" data-filter-placeholder=\"\
  Search the song list...\">\n    <li>Across The Universe</li>\n    <li>Act Naturally</li>\n\
  \    <li>Ain't She Sweet</li>\n    <li>All I've Got To Do</li>\n    <li>All My Loving</li>\n\
  \    <li>All Together Now</li>\n    <li>All You Need Is Love</li>\n    <li>And I\
  \ Love Her</li>\n    <li>And Your Bird Can Sing</li>\n    <li>Anna (Go To Him)</li>\n\
  \    <li>Another Girl</li>\n    <li>Any Time At All</li>\n    <li>Ask Me Why</li>\n\
  \    <li>Baby It's You</li>\n    <li>Baby, You're A Rich Man</li>\n    <li>Baby's\
  \ In Black</li>\n    <li>Back In The U.S.S.R.</li>\n    <li>Bad Boy</li>\n    <li>The\
  \ Ballad Of John And Yoko</li>\n    <li>Because</li>\n    <li>Being For The Benefit\
  \ Of Mr. Kite!</li>\n    <li>Besame Mucho</li>\n    <li>Birthday</li>\n    <li>Blackbird</li>\n\
  \    <!-- etc. -->\n</ul\n```\n\n框架允许你通过 API 更改搜索过滤器文本。要做到这一点，必须在 `mobileinit` 事件触发后访问\
  \ `listview` 组件。你将在书的后部分学习更多关于 jQuery Mobile API 的知识，但现在重要的是要理解在成功访问 API 之前必须初始化框架。一旦访问了\
  \ `listview`，就可以更改它的选项。其中一个选项是 `filterPlaceholder` 属性，可以用于更新搜索过滤器文本。下面的代码显示了如何编写代码的完整示例，包括绑定到\
  \ `mobileinit` 事件：\n\n点击此处查看代码图像\n\n```javascript\n$(document).bind(\"mobileinit\"\
  , function() {\n    $.mobile.listview.prototype.options.filterPlaceholder = \"Search\
  \ the song list...\";\n});\n```\n\n这两个选项的视觉效果相同，允许你定义任何想要出现在搜索字段中的文本。图 9.2 显示了带有自定义占位符文本的搜索过滤器的示例。\n\
  \n![Image](img/jquery-9-2.jpg)\n\n图 9.2.（左）一个带有自定义占位符文本的基础搜索过滤器。\n\n搜索过滤器栏的另一个棒功能是，你不仅可以过滤基本的\
  \ `listview`，还可以过滤包含自定义格式的 `listview`。在自定义格式列表上的搜索过滤器实际上会搜索每个列表项中的所有文本，无论是标题、段落还是其他内容——只要你想到的，框架就会进行过滤。图\
  \ 9.3 显示了一个带有搜索过滤器的自定义格式 `listview` 的示例序列。结果包含来自段落复制和标题的匹配文本的列表项。\n\n![Image](img/jquery-9-3.jpg)\n\
  \n图 9.3.（右）在自定义格式 `listview` 上的基础搜索过滤器。\n\n### 创建自定义搜索过滤器\n\njQuery Mobile 框架为你提供了两种创建自定义搜索过滤器的选项。`listview`\
  \ 包含一个 `filterCallback` 选项，可以使用自定义回调函数对其进行扩展。通过扩展此回调函数，两个参数——`text` 和 `searchValue`\
  \ 变得可用，并可用于编写自定义搜索准则。`text` 参数是当前列表项的值，而 `searchValue` 是输入到搜索过滤器中的文本值。当用户在搜索过滤器中输入内容时，`listview`\
  \ 会遍历列表，比较列表项文本和搜索值，并根据需要过滤结果。图 9.4 显示了当 jQuery Mobile 比较搜索值和每个列表项文本时的 `console.log`\
  \ 示例。\n\n![Image](img/jquery-9-4.jpg)\n\n图 9.4. 搜索过滤器遍历列表项以匹配文本的过程。\n\n要自定义准则，你可以简单地使用\
  \ `filterCallback` 属性设置回调函数：\n\n```javascript\n$.mobile.listview.prototype.options.filterCallback\
  \ = myCallback;\n```\n\n或者，你可以通过 `id` 访问特定的 `listview` 并仅为该 `listview` 设置 `filterCallback`\
  \ 属性：\n\n```javascript\n$('#my-listview').listview('option', myCallback);\n```\n\
  \n让我们尝试使用 `listview` 函数为披头士列表添加自定义搜索过滤器。首先，我们将添加一个 `pageinit` 事件，以确保页面已加载并被框架增强。为此，我们需要为页面添加一个\
  \ `id`，这样我们就可以目标它。下面的示例显示了一个带有 `id` 的页面，通过一个名为 `filter.js` 的 JavaScript 文件来创建回调：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1\">\n    <title>List - jQuery Mobile: Design\
  \ and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.4.3/jquery.mobile-1.4.3.min.css\"\
  >\n    <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"assets/js/filter.js\"></script>\n</head>\n<body>\n\
  \    <div data-role=\"page\" id=\"beatles-page\">\n        <div data-role=\"header\"\
  >\n            <h1>The Beatles</h1>\n        </div>\n        <div data-role=\"content\"\
  >\n            <ul data-role=\"listview\" data-filter=\"true\">\n              \
  \  <li>Across The Universe</li>\n                <li>Act Naturally</li>\n      \
  \          <li>Ain't She Sweet</li>\n                <li>All I've Got To Do</li>\n\
  \                <li>All My Loving</li>\n                <li>All Together Now</li>\n\
  \                <li>All You Need Is Love</li>\n                <li>And I Love Her</li>\n\
  \                <li>And Your Bird Can Sing</li>\n                <li>Anna (Go To\
  \ Him)</li>\n                <li>Another Girl</li>\n                <li>Any Time\
  \ At All</li>\n                <li>Ask Me Why</li>\n                <li>Baby It's\
  \ You</li>\n                <li>Baby, You're A Rich Man</li>\n                <li>Baby's\
  \ In Black</li>\n                <li>Back In The U.S.S.R.</li>\n               \
  \ <li>Bad Boy</li>\n                <li>The Ballad Of John And Yoko</li>\n     \
  \           <li>Because</li>\n                <li>Being For The Benefit Of Mr. Kite!</li>\n\
  \                <li>Besame Mucho</li>\n                <li>Birthday</li>\n    \
  \            <li>Blackbird</li>\n                <!-- etc. -->\n            </ul>\n\
  \        </div>\n    </div>\n    <script src=\"http://code.jquery.com/mobile/1.4.3/jquery.mobile-1.4.3.min.js\"\
  ></script>\n</body>\n</html>\n```\n\n现在，让我们尝试使用 `listview` 函数为披头士列表添加自定义搜索过滤器。**\n\
  \n\n\n\n此示例使用了默认搜索标准来记录文本和 `searchValue` 以供测试。除去 `console.log` 之后，这正是 jQuery Mobile\
  \ 在用户输入搜索过滤栏时用于过滤结果的完全精确代码。首先，将文本转换为小写以实现不区分大小写的搜索，然后使用 JavaScript 原生的 `indexOf`\
  \ 函数在文本中查找与 `searchValue` 匹配的字符串。\n\n现在让我们来看看如何编写自定义回调函数。这次，我们将使用上一个示例中的自定义格式化 `listview`，并对其应用过滤器，该过滤器仅搜索正文内容，而将列表项标题排除在搜索条件之外：\n\
  \n点击此处查看代码图像\n\n```javascript\n$(document).bind(\"mobileinit\", function() {\n \
  \   $.mobile.listview.prototype.options.filterCallback = onlyBody;\n});\n\nfunction\
  \ onlyBody( text, searchValue ) {\n    var splitText = text.trim().split(\"\\n\"\
  );\n    console.log(\"text: \"+ splitText[1]);\n    return splitText[1].toLowerCase().indexOf(\
  \ searchValue ) === -1;\n};\n\nString.prototype.trim = function() {\n    return\
  \ this.replace(/^\\s+|\\s+$/g,\"\");\n}\n```\n\n在例示例中，我们只需要等待 `mobileinit` 事件，因为所有\
  \ `listviews` 的 `filterCallback` 属性在 jQuery Mobile 框架增强页面标记之前就可以访问了。（在上一个示例中，我们针对的特定\
  \ `listview` 必须在框架对其进行增强后才能访问。）一旦触发了 `mobileinit` 事件，我们将 `filterCallback` 设置为 `onlyBody`，这是一个自定义回调函数，它的结构可以像任何其他函数一样，但它将接收两个参数：`text`\
  \ 和 `searchValue`。通过这些参数，我们可以编写任何所需的规则。在这种情况下，我们将拆分 `text` 参数，并仅对包含之前的自定义格式列表示例中\
  \ `p` 元素中的正文内容匹配结果。\n\n除了创建自定义过滤回调函数外，jQuery Mobile 还提供了一个名为 `data-filtertext` 的属性用于过滤列表项。该属性的之处在于，它实际上是发送给\
  \ `filterCallback` 函数的文本值。换句话说，`data-filtertext` 属性中的值变成了 `filterCallback` 函数在比较期间使用的值：\n\
  \n点击此处查看代码图像\n\n```html\n<ul data-role=\"listview\" data-filter=\"true\">\n    <li\
  \ data-filtertext=\"AL\">Alabama</li>\n    <li data-filtertext=\"AK\">Alaska</li>\n\
  \    <li data-filtertext=\"AZ\">Arizona</li>\n    <li data-filtertext=\"AR\">Arkansas</li>\n\
  \    <li data-filtertext=\"CA\">California</li>\n    <li data-filtertext=\"CO\"\
  >Colorado</li>\n    <li data-filtertext=\"CT\">Connecticut</li>\n    <li data-filtertext=\"\
  DE\">Delaware</li>\n</ul>\n```\n\n此示例中的标记使用 `data-filtertext` 属性通过州缩写而不是列表项的完整州名值来过滤列表。图\
  \ 9.5 显示了此过滤器是如何工作的；输入“ar”通常会产生“Arizona”和“Arkansas”，但由于此列表是通过州缩写过滤的，因此“Arkansas”是唯一的匹配项。\n\
  \n![Image](img/jquery-9-5.jpg)\n\n图 9.5。在应用 `data-filtertext` 属性后，搜索标准可以与实际列表项值不同。\n\
  \n## 总结\n\n搜索过滤栏提供了如果通过编程来实现将相当复杂且耗时的功能。jQuery Mobile 让添加甚至自定义此项功能变得极其简单。除了节省时间外，此小部件还为任何大量数据提供了额外价值，并提供了极佳的可用性增强，帮助用户快速高效地找到他们需要的内容。有时，无法精简所有需要放在移动网站上的内容。当出现这种情况且你有一个非常长、似乎几乎无法使用的列表时，搜索过滤栏将是处理该问题的绝佳方法。\n\
  \n## 10. 表单元素\n\njQuery Mobile 框架为每个表单元素暴露了许多内部方法和事件，这意味着你可以从自定义代码中访问它们。这些方法和事件允许你更改和扩展\
  \ jQuery Mobile 表单元素的核心功能，创建让你的移动应用程序与众脱颖出的定制功能。本章涵盖了你可以使用的每个暴露表单元素方法和事件。\n\n###\
  \ 文本输入\n\njQuery Mobile 支持许多不同的文本输入类型，包括 HTML5 输入，如数字、电子邮件、URL、电话以及一些与时间和日期相关的输入。框架增强了所有表单元素，使其在移动设备上更易用。识别具有特定元素类型的表单元素的一个主要优势是键盘会变化。以下是不同的文本输入以及经过\
  \ jQuery Mobile 增强后关联 iOS 键盘的一些示例。\n\n设置元素类型是通过添加名为 `type` 的属性完成的。以下是不同的文本输入以及经过\
  \ jQuery Mobile 增强后关联 iOS 键盘的一些示例。\n\n设置元素类型是通过添加名为 `type` 的属性完成的。这里：\n\n点击此处查看代码图像\n\
  \n```html\n<input type=\"number\">\n```\n\n当 `type` 设置为 `number` 时，iOS 会显示数字键盘。图\
  \ 10.1\n\n![Image](img/jquery-10-1)\n\n图 10.1 当 `type` 设置为 `number` 时的数字键盘。\n\n\
  设置元素类型是通过添加名为 `type` 的属性完成的。这里：\n\n点击此处查看代码图像\n\n```html\n<input type=\"number\"\
  \ pattern=\"0-9]*\">\n```\n\n当 `type` 设置为 `number` 时，iOS 显示数字键盘。图 10.2\n\n![Image](img/jquery-10-2)\n\
  \n图 10.2 应用了 `pattern` 属性时的数字键盘。\n\n设置元素类型是通过添加名为 `type` 的属性完成的。这里：\n\n点击此处查看代码图像\n\
  \n```html\n<input type=\"email\">\n```\n\n当 `type` 设置为 `email` 时，iOS 包含带有 `@` 符号和句点的字母键盘。图\
  \ 10.3\n\n![Image](img/jquery-10-3)\n\n图 10.3 用于电子邮件的 `@` 和 `.` 字母键盘。\n\n### jQuery\
  \ Mobile 1.1.0\n\n在本书出版之前，jQuery Mobile 框架发布了一个新版本 1.1.0 正式版。为了从一些新的表单元素选项中受益，当需要在页面中包含框架、CSS\
  \ 和 jQuery 时必须使用以下代码：\n\n点击此处查看代码图像\n\n```html\n<link rel=\"stylesheet\" href=\"\
  http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.css\" />\n<script src=\"\
  http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"></script>\n<script\
  \ src=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js\"></script>\n\
  ```\n\njQuery Mobile 框架不断升级。在启动项目之前，检查 jquerymobile.com 上的下载页面以确保拥有最新的代码。\n\n* \
  \  `url` 元素类型显示带有正斜杠和 .com 键的字母键盘。图 10.4。\n*   `tel` 元素类型显示用于电话号码的电话键盘。图 10.5。\n\
  \n\n\n\n\n`time`、`month`、`date` 和 `datetime` 元素类型都会显示与相应值对应的菜单（图 10.6）。\n\n![Image](img/jquery-10-5.jpg)\n\
  \n图 10.5。用于电话号码的电话键盘。\n\n![Image](img/jquery-10-6.jpg)\n\n图 10.6。iOS 中与时间和日期相关的菜单。\n\
  \n#### 选项\n\n文本输入包含两个选项：`initSelector` 和 `theme`。通过 `$.mobile` 对象访问 `textinput`\
  \ 时，这两个选项可用。以下代码显示了如何通过 `textinput` 访问这些选项：\n\n点击此处查看代码\n\n```\n$.mobile.textinput.prototype.options\n\
  ```\n\n一旦你访问了这些选项，就可以单独访问它们中的每一个。例如，如果你想获取 `initSelector` 选项，可以在上一行代码的末尾添加该选项：\n\
  \n点击此处查看代码\n\n```\n$.mobile.textinput.prototype.options.initSelector\n```\n\n`initSelector`\
  \ 选项定义了框架初始化时初始化的选择器。该选项的暴露允许你定义想要哪些选择器初始化为文本输入。这让你对核心功能具有很好的控制力，允许你根据特定情况定义初始化内容，最终最大限度地减少初始化时间。你不仅可以定义初始化哪些元素类型，还可以对数据角色（data\
  \ roles）进行同样的操作。以下代码排除了所有 `number` 元素类型的 `textinputs`：\n\n点击此处查看代码\n\n```javascript\n\
  $( document ).bind(\"mobileinit\", function() {\n    $.mobile.textinput.prototype.options.initSelector\
  \ = \"input[type='text'], input[type='search'], :jqmData(type='search'), input[type='password'],\
  \ input[type='email'], input[type='url'], input[type='tel'], textarea, input:not([type])\"\
  ;\n});\n```\n\n***\n\n![Image](img/note.jpg) 注意\n\n在 jQuery Mobile 中，可以使用 `textinput`\
  \ 元素创建多种不同的元素类型，包括 `text`、`search`、`number`、`password`、`email`、`url` 和 `tel`。此外，`textarea`\
  \ 也归类为 jQuery Mobile 中的 `textinput` 表单元素类别。这意味着每个元素类型都包含了本章文本输入部分的选项、方法和事件。\n\n\
  ***\n\n图 10.7 显示了一个未经过增强的 `number` 元素类型示例。\n\n![Image](img/jquery-10-7.jpg)\n\n\
  图 10.7。来自 jQuery Mobile 框架增强的数字元素。\n\n经过增强后，`number` 元素看起来漂亮得多，并且用户在移动环境中更容易与之交互（图\
  \ 10.8）。\n\n![Image](img/jquery-10-8.jpg)\n\n图 10.8。带有 jQuery Mobile 框架增强的数字元素。\n\
  \n`textinput` 还包含一个 `theme` 选项，你可以在选择文本输入元素时访问它。`theme` 的值可以根据包含 a–z 的任何预建或自定义色块进行设置：\n\
  \n点击此处查看代码\n\n```javascript\n$('.my-textinput').textinput({theme: 'a'});\n```\n\n\
  此示例访问了一个类名为 `.my-textinput` 的文本输入元素，并将主题设置为 `a`。你将在下一章学习更多关于主题的内容。\n\n从 1.1.0 版本开始，jQuery\
  \ Mobile 还包含了两个新选项：`mini` 和 `preventFocusZoom`。可以使用名为 `mini` 的 `data-` 属性设置单个表单元素设置。将表单元素设置为\
  \ `mini` 会创建一个更紧凑的版本。要用代码将表单元素设置为 `mini`，只需选择文本输入，然后使用 `textinput` 方法设置 `mini` 的值：\n\
  \n点击此处查看代码\n\n```javascript\n$('.my-textinput').textinput({mini: true});\n```\n\n\
  此代码在文本输入上的结果与 图 10.9 中的右侧输入相似，该图显示了普通文本输入和 `mini` 文本输入的对比。\n\n![Image](img/jquery-10-9.jpg)\n\
  \n图 10.9。普通和 mini 文本输入。\n\n文本输入的最后一个选项是 `preventFocusZoom` 布尔值。当仅在 iOS 中设置为 `true`\
  \ 时，该选项可以防止网页在用户选择文本输入时被放大。这不是默认设置：通常 iOS 会将网页放大到输入框处，以便完全关注表单元素。这种行为通常没有必要，幸运的是\
  \ jQuery Mobile 团队提供了一个禁用它的选项。你也可以通过名为 `prevent-focus-zoom` 的 `data-` 属性在单个表单元素上设置此选项：\n\
  \n点击此处查看代码\n\n```javascript\n$('.my-textinput').textinput({preventFocusZoom: true});\n\
  ```\n\n除了这些选项，文本输入还有一个特定的 `clearSearchText` 用于清除搜索。只需像之前那样设置它：\n\n点击此处查看代码\n\n```javascript\n\
  $('.my-textinput').textinput({clearSearchText: 'this can be any text'});\n```\n\n\
  #### 方法\n\njQuery Mobile 为 `textinput` 提供了两个方法：`enable` 和 `disable`。`enable` 方法激活输入并允许用户输入：\n\
  \n```javascript\n$('.my-textinput').textinput('enable');\n```\n\n当文本输入被禁用时，用户无法与之交互：\n\
  \n```javascript\n$('.my-textinput').textinput('disable');\n```\n\n我们已经在 图 10.8 中见过一个启用的文本输入；禁用的元素看起来像\
  \ 图 10.10。（见下图）\n\n### 事件\n\n文本输入还可以与虚拟事件或标准的 JavaScript 事件绑定。可以绑定到文本输入上的 JavaScript\
  \ 事件包括 `focus`、`blur` 和 `change`。虚拟事件将在书后部分介绍，包括 `vmouseover`、`vmousedown`、`vmousemove`、`vmouseup`、`vclick`\
  \ 和 `vmcancel`。要为文本输入绑定事件，只需使用 `bind` 方法，包含要绑定的事件，并将其连接到处理函数：\n\n```javascript\n\
  $(\".my-textinput\").bind(\"change\", function(event, ui) {\n    console.log('my-textinput\
  \ has changed');\n});\n```\n\njQuery Mobile 还为某些表单元素添加了自定义事件。文本输入包含 `create` 事件作为其自定义事件。`create`\
  \ 事件可在创建文本输入时执行自定义代码：\n\n```javascript\n$('.my-textinput').textinput({\n    create:\
  \ function(event, ui) {\n        console.log('my-textinput has been created');\n\
  \    }\n});\n```\n\n\n\n\n\n要向单选按钮或复选框组添加问题或说明，你可以使用 `legend` 元素。要将图例与输入元素分组，可以使用一个\
  \ `data-role` 为 `controlgroup` 的 `fieldset`。最后，用 `data-role` 为 `fieldcontain` 的\
  \ `div` 包围 `fieldset` 元素，可以为组披萨配料中的元素添加一些样式，例如外边距和下边框：\n\n点击此处查看代码图像\n\n```html\n\
  <div data-role=\"fieldcontain\">\n    <fieldset data-role=\"controlgroup\">\n  \
  \      <legend>Pizza ingredients:</legend>\n        <label for=\"cheese\">Cheese</label>\n\
  \        <input type=\"checkbox\" name=\"pizza-ingredients\" id=\"cheese\" value=\"\
  cheese\" />\n        <label for=\"mushroom\">Mushroom</label>\n        <input type=\"\
  checkbox\" name=\"pizza-ingredients\" id=\"mushroom\" value=\"mushroom\" />\n  \
  \      <label for=\"pepperoni\">Pepperoni</label>\n        <input type=\"checkbox\"\
  \ name=\"pizza-ingredients\" id=\"pepperoni\" value=\"pepperoni\" />\n        <label\
  \ for=\"green-pepper\">Green Pepper</label>\n        <input type=\"checkbox\" name=\"\
  pizza-ingredients\" id=\"green-pepper\" value=\"green-pepper\" />\n    </fieldset>\n\
  </div>\n```\n\n`controlgroup` data-role 在视觉上对按钮分组，如图 10.12 所示。\n\n![Image](img/jquery-10-12.jpg)\n\
  \n图 10.12。一个在 fieldset 中带有图例的输入元素组。\n\n还可以创建所谓的水平切换集（horizontal toggle set）。它将元素分组并仅作为文本选项显示它们，而不是包含实际的单选按钮或复选框图标。要创建切换集，为\
  \ `fieldset` 添加 `data-type` 为 `horizontal`。以下标记是关于你何时以及为何使用这种格式的的良好示例：\n\n点击此处查看代码图像\n\
  \n```html\n<div data-role=\"fieldcontain\">\n    <fieldset data-role=\"controlgroup\"\
  \ data-type=\"horizontal\">\n        <legend>Font styles:</legend>\n        <label\
  \ for=\"bold\" class=\"bold\">b</label>\n        <input type=\"checkbox\" name=\"\
  font-style\" id=\"bold\" value=\"bold\" />\n        <label for=\"italic\" class=\"\
  italic\">i</label>\n        <input type=\"checkbox\" name=\"font-style\" id=\"italic\"\
  \ value=\"italic\" />\n        <label for=\"underline\" class=\"underline\">u</label>\n\
  \        <input type=\"checkbox\" name=\"font-style\" id=\"underline\" value=\"\
  underline\" />\n    </fieldset>\n</div>\n```\n\n这种格式提供了可以切换的类似按钮的功能，在这种情况下，用于开启和关闭字体样式。如果没有一些\
  \ CSS 格式化，这段代码将是不完整的；在这种情况下，以下 CSS 将应用到标签上：\n\n点击此处查看代码图像\n\n```css\n<style type=\"\
  text/css\">\n.bold {\n    font-weight: bold;\n}\n.italic {\n    font-style: oblique;\n\
  }\n.underline {\n    text-decoration: underline;\n}\n</style>\n```\n\n这段代码的结果看起来与图\
  \ 10.13 相似。\n\n![Image](img/jquery-10-13.jpg)\n\n图 10.13。一个带有水平切换集格式的按钮组。\n\n复选框和单选按钮比文本输入简单，因为它们只有\
  \ `theme` 和 `mini` 选项，这两者也可以作为 `data-` 属性可用。这两种元素都不包含不同的类型；元素类型要是 `checkbox` 要是\
  \ `radio`，因此不需要 `initSelector`。为复选框或单选按钮设置主题与为文本输入设置主题相似。主要区别在于你需要访问 `checkboxradio`\
  \ 而不是 `textinput`。以下代码为所有复选框和单选按钮设置主题，并将它们都设为 `mini`：\n\n点击此处查看代码图像\n\n```javascript\n\
  $(\"input[type='checkbox'], input[type='radio']\").checkboxradio({\n    mini: \"\
  true\",\n    theme: \"e\"\n});\n```\n\n在方法方面，复选框和单选按钮都有 `enable` 和 `disable` 方法。然而，它们还包含一个\
  \ `refresh` 方法，你可以用它在视觉上操纵元素后更新该元素。例如，如果我们取披萨配料的示例并想要预选奶酪，可以使用带有 `refresh` 的以下代码：\n\
  \n点击此处查看代码图像\n\n```javascript\n$(\"input#cheese\").attr(\"checked\", true).checkboxradio(\"\
  refresh\");\n```\n\n该方法确保了对复选框进行了视觉更新，以便用户看到它是被选中的。复选框和单选按钮元素包含了与文本输入相同的事件。这些包括绑定标准\
  \ JavaScript 事件的能力，如 `change`、`blur`、`focus`。这些元素还有一个 `create` 事件，你可以在它们在 jQuery\
  \ Mobile 中被创建时使用它。\n\n### 选择菜单 (Select Menus)\n\n选择菜单的调整一直以来非常困难。最后，jQuery Mobile\
  \ 提供了一种视觉效果，这种效果不需要额外的 CSS。为 jQuery Mobile 创建选择菜单，创建一个普通的 HTML `select`。以下示例展示了用于选择类型的选择菜单：\n\
  \n点击此处查看代码图像\n\n```html\n<label for=\"select-cabin\">Cabin type:</label>\n<select\
  \ name=\"select-cabin\" id=\"select-cabin\">\n    <option value=\"economy\">Economy</option>\n\
  \    <option value=\"business\">Business</option>\n    <option value=\"first\">First\
  \ class</option>\n</select>\n```\n\n这段标记的结果看起来和功能上如图 10.14 所示。\n\n![Image](img/jquery-10-14.jpg)\n\
  \n图 10.14。选择菜单。\n\n正如复选框和单选按钮一样，你可以添加一些格式化。以下示例包含了带有 `fieldcontain` 的 `div`（见图 10.15）：\n\
  \n```html\n<div data-role=\"fieldcontain\">\n    <label for=\"select-cabin\">Cabin\
  \ type:</label>\n    <select name=\"select-cabin\" id=\"select-cabin\">\n      \
  \  <option value=\"economy\">Economy</option>\n        <option value=\"business\"\
  >Business</option>\n        <option value=\"first\">First class</option>\n    </select>\n\
  </div>\n```\n\n![Image](img/jquery-10-15.jpg)\n\n图 10.15。在 fieldcontain 中的选择菜单。\n\
  \n这段标记的结果看起来和功能上如图 10.15 所示。\n\n你也可以像对复选框和单选按钮一样对选择菜单分组。只需为 `fieldset` 添加 `controlgroup\
  \ data-role` 并为该组菜单创建一个图例：\n\n点击此处查看代码图像\n\n```html\n<div data-role=\"fieldcontain\"\
  >\n    <fieldset data-role=\"controlgroup\">\n        <legend>Flight details:</legend>\n\
  \        <label for=\"select-cabin\">Cabin type:</label>\n        <select name=\"\
  select-cabin\" id=\"select-cabin\">\n            <option>Cabin type</option>\n \
  \           <option value=\"economy\">Economy</option>\n            <option value=\"\
  business\">Business</option>\n            <option value=\"first\">First class</option>\n\
  \        </select>\n        <label for=\"select-adults\">Adults</label>\n      \
  \  <select name=\"select-adults\" id=\"select-adults\">\n            <option>Adults</option>\n\
  \            <option value=\"1\">1</option>\n            <option value=\"2\">2</option>\n\
  \        </select>\n        <label for=\"select-time\">Time</label>\n        <select\
  \ name=\"select-time\" id=\"select-time\">\n            <option>Time</option>\n\
  \            <option value=\"6\">6:00AM</option>\n            <option value=\"7\"\
  >7:00AM</option>\n        </select>\n    </fieldset>\n</div>\n```\n\n这段标记的结果看起来与图\
  \ 10.16 相似。\n\n![Image](img/jquery-10-16.jpg)\n\n图 10.16。（左）controlgroup 中的选择菜单。\n\
  \n\n\n\n或者，此组可以是一个水平的可选输入项组，它非常适用于长度只有几个字符的项，例如出生日期（图 10.17`）。\n\n![Image](img/jquery-10-17.jpg)\n\
  \n图 10.17。（右侧）水平分组的下拉菜单。\n\n#### 选项\n\n你还可以通过 API 提供的选项或 `data-` 属性的等效项对下拉菜单进行相当的自定义。为下拉菜单可以设置的选项可以在`表\
  \ 10.1`所示。所有这些选项都可以通过 `selectmenu` 方法设置，但 `initSelector` 选项除外，该选项设置方法与文本输入相同。\n\n\
  表 10.1 下拉菜单选项\n\n![Image](img/10tab01.jpg)\n\n#### 方法\n\n下拉菜单的功能比文本输入、复选框或单选按钮更丰富，因此与之关联的方法更多。它包含了标准的\
  \ `enable` 和 `disable` 方法，但该元素还包含了 `close`、`open` 和 `refresh`。当下拉菜单被重新构建时，可以使用 `refresh`，例如，如果使用\
  \ Ajax 根据 Web 表单中之前的选择来更新下拉菜单。或者，如果进行了视觉更新，可以使用此方法来刷新菜单。`open` 和 `close` 方法是自言自明的，但这里有一个如何使用\
  \ `open` 方法的示例：\n\n```\n$('select').selectmenu('open');\n```\n\n此代码将把所有下拉菜单设置为默认打开。\n\
  \n我们已经涵盖了所有的下拉菜单事件。此表单元素包含了绑定到标准 JavaScript 事件的选项，并包含一个 `create` 事件。\n\n### 滑块\n\
  \n滑块是可以通过 jQuery Mobile 增强的表单元素组的一项极佳补充。可以使用滑块在特定范围范围内选择一个数字，因为它会将该数字设置在相应的数字输入框中。要创建一个滑块，你必须将元素类型设置为\
  \ `range` 并包含 `min` 和 `max` 值：\n\n点击此处查看代码图像\n\n```html\n<label for=\"my-slider\"\
  >My slider</label>\n<input type=\"range\" name=\"slider\" id=\"my-slider\" value=\"\
  50\" min=\"0\" max=\"100\" />\n```\n\n也可以添加默认值，它会设置滑块在轨道上的位置。此示例中的滑块显示类似于`图 10.18`。\n\
  \n![Image](img/jquery-10-18.jpg)\n\n图 10.18 一个基础滑块的示例。\n\n你还可以为返回的数值添加步长。例如，如果你不想返回\
  \ 0 到 100 之间的每一个数字，你可以将 `step` 属性设置为 10，这将返回每隔十个数的数字：\n\n点击此处查看代码图像\n\n```html\n\
  <label for=\"my-slider\">My slider</label>\n<input type=\"range\" name=\"slider\"\
  \ id=\"my-slider\" value=\"50\" min=\"0\" max=\"100\" step=\"10\" />\n```\n\n除了这些属性外，你还可以添加填充高亮，它会高亮滑块左侧的轨道区域（`图\
  \ 10.19`）：\n\n点击此处查看代码图像\n\n```html\n<label for=\"my-slider\">My slider</label>\n\
  <input type=\"range\" name=\"slider\" id=\"my-slider\" value=\"50\" min=\"0\" max=\"\
  100\" step=\"10\" data-highlight=\"true\" />\n```\n\n![Image](img/jquery-10-19.jpg)\n\
  \n图 10.19 带有填充高亮的滑块。\n\n#### 选项\n\n滑块元素有一系列相当的选项，你可以通过 API 或 `data-role` 属性进行设置，包括\
  \ `disabled`、`highlight`、`initSelector`、`mini`、`theme` 和 `trackTheme`。默认情况下，`disabled`\
  \ 选项设置为 `false`。`highlight` 选项默认为 `false`；但是，如果设置为 `true`，则可以用于高亮所有滑块中滑块左侧的轨道，如下例例所示：\n\
  \n点击此处查看代码图像\n\n```\n$('.selector').slider({ highlight: \"true\" });\n```\n\n我们已经涵盖了\
  \ `initSelector`、`mini` 和 `theme` 选项。`trackTheme` 选项是滑块特有的；你可以用它将轨道的主设置为与滑块其他部分不同的主题。\n\
  \n#### 方法和事件\n\n滑块插件包含了三个你可以用来修改 `slider` 元素的方法：`enable`、`disable` 和 `refresh`。`enable`\
  \ 方法可以启用被禁用的滑块：\n\n点击此处查看代码图像\n\n```\n$('.selector').slider('enable');\n```\n\n\
  `disable` 方法可以禁用滑块，使用户无法与其交互：\n\n点击此处查看代码图像\n\n```\n$('.selector').slider('disable');\n\
  ```\n\n`refresh` 方法可以在滑块被更新后用于刷新它：\n\n点击此处查看代码图像\n\n```\n$('.selector').slider('refresh');\n\
  ```\n\n滑块可用的事件与其他元素类似，滑块插件还包含一个 `create` 事件，当滑块创建时可以使用。\n\n### 翻转开关\n\n翻转开关是表单元素的另一项实用的补充。它们为二值数据提供了极佳的解决方案，例如是/否、开启/关闭或/假。开关可以从一个位置移动到另一个位置，或者用户可以点击它使其切换到选定位置。制作翻转开关很简单：只需创建一个包含两个选项的滑块，因为它会根据文本调整大小：\n\
  \n点击此处查看代码图像\n\n```html\n<label for=\"flip-switch\">Do you like pizza?</label>\n\
  <select name=\"slider\" id=\"flip-switch\" data-role=\"slider\">\n  <option value=\"\
  yes\">Yes</option>\n  <option value=\"no\">No</option>\n</select>\n```\n\n产生翻转开关的代码是一个\
  \ `data-role` 设置为 `slider` 值的下拉菜单，当然，关键在于包含两个选项。此滑块的视觉结果如`图 10.20`所示。\n\n![Image](img/jquery-10-20.jpg)\n\
  \n图 10.20 翻转开关交互序列。\n\n翻转开关包含了与滑块完全相同的选项、方法和事件，可以使用相同的语法访问，因为翻转开关本质上是滑块的扩展。要了解更多关于翻转开关的选项、方法和事件，请查看本章前面的“滑块”。\n\
  \n## 总结\n\njQuery Mobile 为表单输入提供了极佳的元素选项。设备根据输入类型响应相应的键盘时，可用性大大提高。另一个益处是，所有这些表单元素在无法处理它们的浏览器中查看时都会降级，因此你永远不需要担心由于某人没有使用最新、最强大的手机而导致你的网页崩溃，例如。这仅仅是\
  \ jQuery Mobile 帮助消除通用的 Web 开发中伴随的一些常见困扰的又一种方式。\n\n## 11\\. 为 jQuery Mobile 设置主题\n\
  \njQuery Mobile 包含一个完整的主题框架，允许你自定义色板和图标集，以创建自定义主题的页面、工具栏、内容、表单元素、列表、按钮等。该框架使用 CSS3\
  \ 许多许多增强功能，例如阴影、渐变和圆角，因此不使用图像来实现这些视觉效果，这使得主题更加轻量且加载速度更快。\n\n本章提供了现有色板的概述，并详细说明了如何创建自定义主题。自定义主题允许你创建与桌面版本具有相同品牌设计的移动版本网站，从而在你的网站之间创建统一的设计。\n\
  \n### 核心色板\n\n\n\njQuery Mobile 有一个包含五个色块（swatches）的主题系统，这些色块由字母“a”到“e”定义。单个网页中混合使用这些色块以实现完全自定义。默认色块都包含颜色和纹理、内边距以及预定义的尺寸，以便将它们区分开来。表\
  \ 11.1\n\n使用色块就像使用 `data-theme` 属性一样简单，它可以用于任何带有 jQuery Mobile 框架的 HTML 元素。以下代码显示了一组五个按钮，每个按钮都有不同的默认主题：\n\
  \n点击查看代码图像\n\n```html\n<a href=\"#\" data-role=\"button\" data-theme=\"a\">Swatch\
  \ A</a>\n<a href=\"#\" data-role=\"button\" data-theme=\"b\">Swatch B</a>\n<a href=\"\
  #\" data-role=\"button\" data-theme=\"c\">Swatch C</a>\n<a href=\"#\" data-role=\"\
  button\" data-theme=\"d\">Swatch D</a>\n<a href=\"#\" data-role=\"button\" data-theme=\"\
  e\">Swatch E</a>\n```\n\n无论这是一组按钮、列表项还是栏，jQuery Mobile 框架都赋予了你为这些项目定义不同主题的能力。图 11.1\
  \ 显示了示例中的按钮组。你可以看到，每个按钮根据其分配的主题具有不同的颜色。\n\n![Image](img/jquery-11-1.jpg)\n\n图 11.1\
  \ 分配了不同主题色块的按钮组。\n\n你可以更新现有的色块或创建自定义色块。要创建自定义色块，只需从 jQuery Mobile 样式表中复制一个现有主题色块并将其更新为尚未作为默认色块使用的字母（即“f”到“z”或任何自定义名称）。首先，你需要在表中找到想要复制的色块；在本例中我们使用“a”色块。我们要获取色块的样式表是全书中一直附加到所有示例中的那一个。唯一的区别是，我们将查看未压缩的版本，以便更容易找到色块的开始和结束位置。你可以在\
  \ [`code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.css`](http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.css)\
  \ 找到该样式表的未压缩版本，这与一直以来包含的地址相同，只是缺少了文件名中的 `.min` 部分。要创建色块的副本，只需将许多 CSS 色块类复制粘贴到新的\
  \ CSS 文件中，对后缀 `-a` 进行搜索并替换，替换为“f”到“z”之间的字母。例如，要创建一个“f”色块，你会将 `-a` 搜索并替换为 `-f`，所有的\
  \ CSS 色块类将得到更新，从而得到一个新的“f”色块。以下是 `ui-bar` 类在为“f”色块修改后的示例：\n\n点击查看代码图像\n\n```css\n\
  .ui-bar-f {\n    border: 1px solid #cccccc;\n    background: #cccccc;\n    color:\
  \ #cccccc;\n    font-weight: bold;\n    text-shadow: 0 -1px 1px #000000;\n    background-image:\
  \ -webkit-gradient(linear, left top, left bottom, from(#cccccc), to(#999));\n  \
  \  background-image: -webkit-linear-gradient(#cccccc, #999);\n    background-image:\
  \      -moz-linear-gradient(#cccccc, #999);\n    background-image:      -ms-linear-gradient(#cccccc,\
  \ #999);\n    background-image:      -o-linear-gradient(#cccccc, #999);\n    background-image:\
  \          linear-gradient(#cccccc, #999);\n}\n```\n\n现在由你来自定义这些类的属性。一旦你有了新色块，就可以像下方的按钮示例一样在任何\
  \ jQuery Mobile 元素上轻松使用：\n\n点击查看代码图像\n\n```html\n<a href=\"#\" data-role=\"button\"\
  \ data-theme=\"f\">Custom Swatch F</a>\n```\n\n### ThemeRoller\n\n创建自定义色块的另一种方法是使用\
  \ ThemeRoller 工具，它让你能够在简单的界面中创建一个包含多个自定义色块的整个主题。\n\n![Image](img/tip.jpg)\n\nThemeRoller\
  \ 工具是创建自定义主题的一种简单方法，但可能很难理解底层的 CSS。ThemeRoller 提供了一个视觉化界面，无需编写任何代码即可修改颜色、字体、圆角等。\n\
  \n\n\n\n\n图 11.4 显示了使用 `data-theme` 修改此标记后的结果。\n\n![Image](img/jquery-11-4.jpg)\n\
  \n图 11.4。应用到页面组件以及页眉和页脚工具栏的“b”主题色块。\n\n与页面一样，包含在工具栏中的任何组件都会继承工具栏的主题。以下示例显示了一个带有不同主题和主页图标的页眉：\n\
  \n点击此处查看代码图像\n\n```html\n<div data-role=\"header\" data-theme=\"b\">\n     <h1>jQueryMobile.tv</h1>\n\
  \     <a href=\"#\" data-theme=\"e\" data-icon=\"home\">Home</a>\n</div>\n```\n\n\
  此标记创建了一个在工具栏主题背景下突出的按钮图 11.5。\n\n![Image](img/jquery-11-5.jpg)\n\n图 11.5。一个带有具有不同\
  \ `data-theme` 色块按钮的工具栏组件。\n\n### 内容主题化\n\n主内容区域或任何包含 `data-role=\"content\"` 的元素都可以通过添加\
  \ `data-theme` 属性来设置主题。这允许内容区域对其及其组件覆盖继承的页面组件主题。以下示例显示了内容主题以及其包含的任何组件如何覆盖页面主题：\n\
  \n点击此处查看代码图像\n\n```html\n<div data-role=\"page\" data-theme=\"b\">\n     <div data-role=\"\
  header\" data-theme=\"b\">\n         <h1>jQueryMobile.tv</h1>\n         <a href=\"\
  #\" data-theme=\"e\" data-icon=\"home\">Home</a>\n     </div></div>\n     <div data-role=\"\
  content\" data-theme=\"d\">\n         <h3>Header</h3>\n         <p>这是一个示例，页面和工具栏应用了“b”色块，内容区域应用了“d”色块。</p>\n\
  \         <a href=\"#\" data-role=\"button\" data-inline=\"true\">Button</a>\n \
  \    </div>\n     <div data-role=\"collapsible\" data-collapsed=\"true\" data-theme=\"\
  c\" data-content-theme=\"c\">\n                     <h3>Collapsible header</h3>\n\
  \                     <p>我使用 data-content-theme 来匹配我的页眉</p>\n                    </div></div>\n\
  \     </div>\n     <div data-role=\"footer\" data-theme=\"b\"><h2>Copyright</h2>h2></div>\n\
  </div>\n```\n\n注意页面如何使用“b”色块，而内容区域使用“d”色块。图 11.6 显示了内容组件及其子组件如何覆盖继承的页面组件主题。\n\n\
  ![Image](img/jquery-11-6.jpg)\n\n图 11.6。一个具有与自身主题不同的内容区域的页面。\n\n除了标准内容区域外，折叠内容区域可以包含自定义主题，以区别于其父元素：\n\
  \n点击此处查看代码图像\n\n```html\n<div data-role=\"page\" data-theme=\"b\">\n     <div data-role=\"\
  header\" data-theme=\"b\">\n         <h1>jQueryMobile.tv</h1>\n         <a href=\"\
  #\" data-theme=\"e\" data-icon=\"home\">Home</a>\n     </div></div>\n     <div data-role=\"\
  content\" data-theme=\"d\">\n         <h3>Header</h3>\n         <p>这是一个示例，页面和工具栏应用了“b”色块，内容区域应用了“d”色块。</p>\n\
  \         <div data-role=\"collapsible\" data-collapsed=\"true\" data-theme=\"c\"\
  \ data-content-theme=\"c\">\n                     <h3>Collapsible header</h3>\n\
  \                     <p>我使用 data-content-theme 来匹配我的页眉</p>\n                    </div></div>\n\
  \     </div>\n     <div data-role=\"footer\" data-theme=\"b\"><h2>Copyright</h2>h2></div>\n\
  </div\n```\n\n默认情况下，折叠内容区域的页眉包含自定义的 `data-theme`；但如果没有 `data-content-theme`，折叠内容区域体将与内容区域相同。图\
  \ 11.7 显示了具有自定义 `data-theme` 和 `data-content-theme` 的折叠内容区域示例。\n\n![Image](img/jquery-11-7.jpg)\n\
  \n图 11.7。带有折叠内容区域的页面。\n\n### 表单主题化\n\njQuery Mobile 允许你创建单个表单。与其他一样，表单和元素继承它们所属的页面组件主题。然而，可以使用\
  \ `data-theme` 来定制单个表单、所有表单或某些元素的外。让我们从整个表单开始。以下代码显示了一个包含“e”主题的表单，而页面组件包含“b”主题。注意表单元素包含了自己的\
  \ `data-role`，否则它将继承内容区域的主题：\n\n```html\n<div data-role=\"page\" data-theme=\"b\"\
  >\n     <div data-role=\"header\" data-theme=\"b\">\n           <h1>jQueryMobile.tv</h1>\n\
  \           <a href=\"#\" data-theme=\"e\" data-icon=\"home\">Home</a>\n     </div></div>\n\
  \     <div data-role=\"content\" data-theme=\"d\">\n           <p>此内容区域包含“d”色块。</p>\n\
  \           <form data-role=\"content\" data-theme=\"e\">\n               <label\
  \ for=\"my-text-input\">Text input</label>\n               <input type=\"text\"\
  \ name=\"name\" id=\"my-text-input\" value=\"\" />\n               <a href=\"#\"\
  \ type=\"submit\" data-role=\"button\" data-inline=\"true\">Button</a>\n       \
  \           </form>\n       </div>\n       <div data-role=\"footer\" data-theme=\"\
  b\"><h2>Copyright</h2>h2></div>\n</div\n```\n\n为嵌套内容区域分配不同的 `data-theme` 值是有用的。表单显示了如何使用它们来区分某些内容\
  \ 图 11.8。\n\n![Image](img/jquery-11-8.jpg)\n\n图 11.8。一个与其内容区域分离的自带 data-theme 的表单。\n\
  \n要更改单个表单元素的色块，只需在实际元素上应用 `data-theme` 即可。\n\n点击此处查看代码图像\n\n```html\n<a href=\"\
  #\" type=\"submit\" data-role=\"button\" data-inline=\"true\" data-theme=\"b\">```\n\
  \n这会将按钮设置为与表单其他部分不同的主题。在这种情况下，它有助于识别表单内的按钮，并在视觉上吸引注意力 图 11.9。\n\n![Image](img/jquery-11-9.jpg)\n\
  \n图 11.9。使用 data-theme 属性设置单个表单元素的色块值。\n\n### 列表\n\n列表可能是 jQuery Mobile 中复杂的组件，因为它们是唯一包含主题选项额外属性的元素。例如，`listview`\
  \ 不仅可以包含列表项，还可以包含分割线、计数气泡和分割按钮，我们在本节中看到它们都有自己的主题选项。首先，像本章之前的组件一样，`listview` 本可以包含\
  \ `data-theme`，任何包含的项目都会继承它：\n\n点击此处查看代码图像\n\n```html\n<div data-role=\"page\" data-theme=\"\
  b\">\n     <div data-role=\"header\" data-theme=\"b\">\n         <h1>jQueryMobile.tv</h1>\n\
  \         <a href=\"#\" data-theme=\"e\" data-icon=\"home\">Home</a>\n     </div></div>\n\
  \     <div data-role=\"content\" data-theme=\"d\">\n            <p>此内容区域包含“d”色块。</p>\n\
  \            <ul data-role=\"listview\" data-inset=\"true\" data-theme=\"e\">\n\
  \                    <li><a href=\"#\">List item</a></li>\n                    <li><a\
  \ href=\"#\">List item</a></li>\n                    <li><a href=\"#\">List item</a></li>\n\
  \                    <li><a href=\"#\">List item</a></li>\n                </ul>\n\
  \       </div>\n     <div data-role=\"footer\" data-theme=\"b\"><h2>Copyright</h2>h2></div>\n\
  </div\n```\n\n图 11.10 显示了此标记在移动设备上渲染的示例。正如你所看到的，列表可以有自己的主题，与页面其他部分分开。然而，如果没有定义 `data-theme`，`listview`\
  \ 将简单继承页面或其内容容器的主题。\n\n![Image](img/jquery-11-10.jpg)\n\n图 11.10。带有自定义主题的 listview。\n\
  \n单个列表项也可以覆盖 `listview` 主题。如果某个特定列表项与其他项分开来是合理的，只需为其添加 `data-theme` 属性即可：\n\n```html\n\
  <ul data-role=\"listview\" data-inset=\"true\" data-theme=\"e\">\n    <li>5</li>\n\
  \    <li>20</li>\n    <li>75</li>\n    <li data-theme=\"a\">Total = 100</li>\n</ul>\n\
  ```\n\n\n\n\n\n图 11.11 显示此 `listview` 的示例，它包含“e”色块作为其数据主题（data-theme），以及一个用“a”色块覆盖该主题的列表项。在特定情况下，此功能非常有用，因为它突出并吸引了特定列表项的注意。\n\
  \n![Image](img/jquery-11-11.jpg)\n\n图 11.11。带有列表项的 listview，该列表项分配了不同的 `data-theme`。\n\
  \n要为分隔符设置主题，有一个名为 `data-divider-theme` 的特殊属性。可以将此属性添加到 `listview` 中，为所有列表分隔符设置主题：\n\
  \n点击此处查看代码图片\n\n```html\n<ul data-role=\"listview\" data-inset=\"true\" data-theme=\"\
  e\" data-divider-theme=\"b\">\n    <li data-role=\"list-divider\" role=\"heading\"\
  >我的数字列表</li>\n    <li>5</li>\n    <li>20</li>\n    <li>75</li>\n    <li data-theme=\"\
  a\">总量 = 100</li>\n</ul>\n```\n\n图 11.12 显示了此代码的效果，其中 `listview` 使用 `data-divider-theme`\
  \ 属性作为分隔符。\n\n![Image](img/jquery-11-12.jpg)\n\n图 11.12。带有列表分隔符主题的 listview。\n\n\
  计数泡可以使用 `data-count-theme` 属性设置主题，该属性可以应用于 `listview` 的 `ul` 元素，为列表中的所有的计数泡设置主题：\n\
  \n点击此处查看代码图片\n\n```html\n<ul data-role=\"listview\" data-inset=\"true\" data-theme=\"\
  e\" data-divider-theme=\"b\" data-count-theme=\"b\">\n    <li data-role=\"list-divider\"\
  \ role=\"heading\">我的数字列表</li>\n    <li>列表项 <span class=\"ui-li-count\">5</span></span></li>\n\
  \    <li>列表项 <span class=\"ui-li-count\">20</span></span></li>\n    <li>列表项 <span\
  \ class=\"ui-li-count\">75</span></span></li>\n    <li data-theme=\"a\">总量 <span\
  \ class=\"ui-li-count\">100</span></span></li>\n</ul>\n```\n\n图 11.13 显示了计数泡主题的示例。\n\
  \n![Image](img/jquery-11-13.jpg)\n\n图 11.13。带有计数泡主题的 listview。\n\n拆分按钮（Split buttons）允许你在同一个列表项中设置两个独立的链接。要为这些拆分按钮创建一个独立的主题，你可以向\
  \ `listview ul` 元素添加 `data-split-theme` 属性：\n\n点击此处查看代码图片\n\n```html\n<ul data-role=\"\
  listview\" data-inset=\"true\" data-theme=\"e\" data-split-theme=\"b\">\n    <li\n\
  \        <a href=\"#link1\">列表项</a>\n        <a href=\"#link1Alt\">拆分示例</a>\n  \
  \  </li>\n    <li\n        <a href=\"#link2\">列表项</a>\n        <a href=\"#link2Alt\"\
  >拆分示例</a>\n    </li>\n</ul>\n```\n\n图 11.14 显示了 `data-split-theme` 的示例。\n\n![Image](img/jquery-11-14.jpg)\n\
  \n图 11.14。带有 data-split-theme 的 listview。\n\n## 总结\n\njQuery Mobile 主题既易于使用又强大。每个组件都可以设置主题，当预设的色块不够用时，你始终可以进行自定义。在\
  \ ThemeRoller 和手动编辑类的能力之间，你应该已经能够顺畅地创建你自己的主题了。\n\n# 第三部分：移动 API\n\n## 1. 全局选项\n\n\
  从表面上看，jQuery Mobile 框架提供了一种创建移动网站的快速简单的方法。然而，该框架还拥有应用程序接口（API），可用于扩展基本功能。jQuery\
  \ Mobile API 为你的移动网站的自定义提供了额外层次的控制。从全局选项的设置到挂钩事件以及与暴露的方法交互，通过 API 都是可能的。到本章结束，你将了解如何为你的移动网站定义自定义选项以及如何编写与\
  \ jQuery 框架交互的自定义代码。\n\n### 扩展 mobileinit 事件\n\n如之前介绍的，jQuery Mobile 包含一个名为 `mobileinit`\
  \ 的初始化事件，它在 jQuery 的 `document.ready` 事件之前加载。这让你能够覆盖并扩展 jQuery Mobile 的默认选项，而这正是自定义的开始。要扩展\
  \ `mobileinit` 事件，你需要正确安排 JavaScript 文件的顺序。你的自定义 JavaScript 事件处理程序必须在 jQuery Mobile\
  \ 加载之前且在框架加载之后包含：\n\n点击此处查看代码图片\n\n```html\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n<script src=\"assets/js/custom-qm.js\"></script>\n<script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n```\n\n要扩展 `mobileinit` 事件，你必须先向它绑定一个匿名函数，以便在事件触发时执行你的自定义代码：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(document).bind(\"mobileinit\", function() {\n    // 在此处覆盖全局选项\n\
  });\n```\n\n一旦你成功地为 `mobileinit` 事件绑定了回调函数，你就可以轻松地覆盖全局选项。`$.mobile` 对象是设置所有属性的起点。你将在这里覆盖影响网站运行方式的全局选项。要覆盖全局选项，你可以使用\
  \ jQuery 的 `extend` 方法来扩展 `$.mobile` 对象：\n\n点击此处查看代码图片\n\n```javascript\n$(document).bind(\"\
  mobileinit\", function() {\n    $.extend( $.mobile, {\n        property\n    })\n\
  });\n```\n\n或者，你可以直接通过 `$.mobile` 对象来覆盖全局选项：\n\n点击此处查看代码图片\n\n```javascript\n$(document).bind(\"\
  mobileinit\", function() {\n    $.mobile.property = value\n    // 设置其他属性\n});\n\
  ```\n\n如果你想更新多个属性，`extend` 方法更简洁，因为你不需要多次编写 `$.mobile`。但如果你只有一个属性要更新，单独设置代码更少。\n\
  \n### 创建命名空间\n\nHTML5 `data-` 属性（例如 `data-role`）可以通过命名空间进行自定义。命名空间允许你在 `data-` 和\
  \ `-role` 部分之间添加一个自定义名称。这种属性对于自定义你的代码非常有用。当更多的第三方插件被开发并可能包含在项目中时，它可以防止命名冲突。用于自定义命名空间的\
  \ `$.mobile` 属性是 `ns`：\n\n点击此处查看代码图片\n\n```javascript\n$(document).bind(\"mobileinit\"\
  , function() {\n    $.mobile.ns = \"-\";\n});\n```\n\n注意命名空间结尾有一个连字符；如果没有它，命名空间将不包含连字符，因此你的\
  \ `data-` 属性将难以阅读，且 jQuery Mobile 将查找类似这样的属性：`data-jquerymobilefoo`。\n\n选择自定义命名空间要求你在编码时就投入该命名空间。在编码期间，你将在标记中为任何\
  \ `data-` 属性都包含此自定义命名空间。再次，这不仅自定义了你的标记，在使用第三方插件时还可以防止命名冲突。这里是一个显示 `jquerymobiletv-`\
  \ 命名空间的示例：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta\
  \ http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1\">\n    <title>命名空间 - jQuery\
  \ Mobile: 设计与开发</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
  \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n    <script>\n        $(document).bind(\"mobileinit\", function() {\n\
  \            $.mobile.ns = \"jquerymobiletv-\";\n        });\n    </script>\n</head>\n\
  <body>\n    <div data-role=\"page\" data-jquerymobiletv-id=\"home\">\n        <h1\
  \ data-jquerymobiletv-role=\"heading\">命名空间</h1>\n        <ul data-jquerymobiletv-role=\"\
  list\">\n            <li data-jquerymobiletv-role=\"get\">列表项 1</li>\n         \
  \   <li data-jquerymobiletv-role=\"get\">列表项 2</li>\n        </ul>\n    </div>\n\
  </body>\n</html>\n```\n\n\n\n\n\n```html\n<div data-jquerymobiletv-role=\"page\"\
  >\n    <div data-jquerymobiletv-role=\"header\"><h1>页面名称</h1></div>\n    <div data-jquerymobiletv-role=\"\
  content\"><p>主体内容</p></div>\n    <div data-jquerymobiletv-role=\"footer\">版权所有</div>\n\
  </div>\n</body>\n</html\n```\n\n使用自定义命名空间的好处是不需要进行任何其他修改；代码的结果与使用默认命名空间运行 jQuery\
  \ Mobile 网页的结果相同。\n\n你甚至可以使用级联样式表（CSS）选择器来选择包含自定义 `data-` 属性的特定 HTML 元素。例如，你可以选择一个\
  \ jQuery Mobile 页面元素并对其应用 CSS：\n\n点击此处查看代码图片\n\n```css\n.ui-mobile [data-jquerymobiletv-role=\"\
  page\"] {\n    /*在此处编写自定义 CSS */\n}\n```\n\n随着 `data-` 属性的引入，开发者对添加到网页中的数据拥有了更多的控制权。自定义属性提供了支持语义化\
  \ HTML 的手段，同时通过 JavaScript 等前端脚本语言增强了网页功能。\n\n### 延迟页面初始化\n\n在 jQuery Mobile 中，页面初始化是默认自动发生的。该框架包含一个名为\
  \ `autoInitializePage` 的属性，它决定了是否应该初始化网页。默认情况下，该属性的值设置为 `true`，因此当文档准备就绪时页面始终会被初始化。然而，通过扩展\
  \ `$.mobile` 对象，可以将此属性设置为 `false` 并在之后处理页面初始化。\n\n你可以在其他脚本运行期间临时延迟页面初始化，这正是将 `autoInitializePage`\
  \ 属性设置为 `false` 的完美场景：\n\n点击此处查看代码图片\n\n```javascript\n$(document).bind(\"mobileinit\"\
  , function() {\n    $.extend( $.mobile, {\n        autoInitializePage: false\n \
  \   });\n});\n```\n\n想象一下需要加载大量的客户端 JavaScript，例如一个长姓名列表。在这种情况下，延迟初始化直到文档对象模型（DOM）完成加载可能是一个好主意。这样一来，客户端\
  \ JavaScript 就有机会运行，并且你可以优雅地让数据淡入，而不是让它在访问者眼前一行一行地加载：\n\n点击此处查看代码图片\n\n```html\n\
  <!DOCTYPE html>\n<html\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n    <title>页面初始化 - jQuery Mobile: 设计与开发</title>\n    <link\
  \ rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
  \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"assets/js/custom-jqm.js\"></script>\n    <script src=\"\
  http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"></script>\n</head>\n\
  <body>\n    <div data-jquerymobiletv-role=\"page\" id=\"mypage\">\n        <div\
  \ data-jquerymobiletv-role=\"header\"><h1>页面名称</h1></div>\n        <div data-jquerymobiletv-role=\"\
  content\">\n            <ul data-jquerymobiletv-role=\"listview\" id=\"my-list\"\
  ></ul>\n        </div>>\n        <div data-jquerymobiletv-role=\"footer\">版权所有</div>\n\
  \    </div>\n    <script type=\"text/javascript\">\n        $(\"#mypage\").css('display',\
  \ 'none');\n        var namesArray = new Array(\"Tom\", \"Lucy\", \"Lee\", \"Chris\"\
  , \"Albert\", \"Frank\");\n        for(var i=0; i<namesArray.length; i++) {\n  \
  \          $('#my-list').append('<li><a href=\"#\">'+namesArray[i]+ '</a></li>');\n\
  \        }\n        $.mobile.autoInitializePage = true;\n        $(\"#mypage\").fadeIn(1000);\n\
  \    </script>\n</body>\n</html>\n```\n\n运行此代码会延迟初始化；在循环完成且 `autoInitializePage`\
  \ 属性设置为 `true` 之前，用户将看不到姓名列表，然后使用 `fadeIn` 方法让页面淡入。\n\n图 12.1 显示了一旦 `autoInitializePage`\
  \ 属性设置为 `true` 且页面淡入，页面是如何渲染的。\n\n![图像](img/jquery-12-1) 图 12.1 延迟初始化后渲染的页面。\n\n\
  ### 自定义 subPageKey\n\n`subPageKey` 是一个 URL 查询参数，用作 jQuery 组件生成的子页面的引用（这些组件在书中前面介绍过）。该参数的默认键为\
  \ `ui-page`。然而，可以通过 `subPageKey` 属性更改此键，该属性是 `$.mobile` 对象的一个属性。可以使用字符串值来更新此属性的值，该更改将反映在组件生成的子页面中。创建一个自定义的\
  \ `subPageKey`：\n\n例如，通过 `subPageKey` 属性更改此键，ui-page 就会变为 `my-page-key`\n\n你甚至可以使用级联样式表（CSS）选择器来选择包含自定义\
