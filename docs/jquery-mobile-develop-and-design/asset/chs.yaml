  ## 索引\n\n## 介绍 Web 开发的未来\n\n大多数 Web 开发和设计师都认为，浏览器和跨平台测试不是他们愿意花费时间的事情。想象一下所有可能访问你网站的设备，然后想象一下每次构建网站时都要测试所有的平台——这将是极其艰辛且极其耗时的。jQuery\
  \ Mobile 从一开始就为你提供这种支持，因为该团队以框架支持多种移动平台而自豪。该框架构建在整洁、语义化的 HTML 之上，确保了与大多数网络设备的兼容性。\n\
  \n该框架还包含了无障碍功能，例如 `WAI-ARIA`（Web 可访问性富交互应用程序），这是万维网联盟发布的关于提高网页可访问性的技术规范，它们已集成到框架中，以支持屏幕阅读器（如\
  \ Apple iOS 上的 VoiceOver）和其他辅助技术。只需在你的网站中引入 jQuery Mobile 框架，即可轻松地将你的代码从语义 HTML\
  \ 转换为使用 jQuery 和 CSS 的丰富、交互且无障碍的移动体验。\n\n### 为什么选择 jQuery Mobile？\n\njQuery Mobile\
  \ 不仅适用于 Web 开发人员；Web 设计师可以使用 UI，对移动应用程序进行完全的设计控制。内置组件（如列表视图、对话框、工具栏、搜索机制和全套表单元素）都可以通过主题框架进行自定义。在书的后部分，你还将学习\
  \ ThemeRoller，它可以让你通过简单的 Web 界面创建多达 26 个主题色块。用户体验（UX）设计师也得到了照顾，可以获得 OmniGraffle\
  \ 和 Visio 的模板。当然，如果你想深入钻研，应用程序编程接口（API）可供 Web 开发人员使用。作为一名 Web 开发人员，你可以配置默认值，处理许多不同的事件，并使用多个暴露的方法和属性进行工作。\n\
  \n\n\n\n\n一个新兴的社区正在通过许多第三方应用和框架来支持该框架，你可以使用这些工具构建 jQuery Mobile 应用。此外，兼容 jQuery\
  \ Mobile 的插件和扩展也层出不穷，帮助 Web 开发人员集成自定义组件并为现有的核心功能添加能力。\n\n一个非常重要的第三方框架正在模糊原生开发与移动\
  \ Web 开发之间的界限。作为一个 HTML5 应用平台，`PhoneGap` 允许你使用 Web 技术编写原生应用程序。通过 `PhoneGap`，你的 Web\
  \ 应用程序可以轻松转换为原生应用，并实现获取联系人信息、访问摄像头、使用地理位置、存储数据等功能。要了解更多关于 `PhoneGap` 的信息，请访问 `phonegap.com`。jQuery\
  \ Mobile 的在线文档中甚至有一个关于它的章节。有了这些可能性，你不再需要为原生应用编写多个版本。这使得原生应用开发变得不再那么吸引人，因为你为 iPhone\
  \ 开发的应用程序需要为 Android、BlackBerry、Windows Mobile 等其他平台完全重新开发。哦，别忘记每个新版本都需要为这些不同的平台进行更新。jQuery\
  \ Mobile 框架通过让你通过浏览器浏览器即可访问 Web 应用程序和网站，消除了下载和安装移动应用的需求，提供了可以与原生应用开发竞争的移动 Web 体验。\n\
  \n## 本书适用读者\n本书适用于具有基础 HTML 经验并兴趣使用 jQuery Mobile 框架创建移动网站的人。\n\n## 本书不适用读者\n本书不适用于从未创建过网页的人。\n\
  \n## 你将如何学习\n在本书中，你将通过实践来学习。每一章都包含示例代码和描述，帮助你深入理解其工作原理。你也可以在书籍的网站上找到代码示例（[www.peachpit.com/jquerymobile](http://www.peachpit.com/jquerymobile)）。\n\
  \n## 你将学习到什么\n本书将教你从创建页面的基础知识到自定义主题，再到使用 `WordPress` 和 `Drupal` 开发你自己的 jQuery Mobile\
  \ 内容管理系统的的一切。当你读完这本书时，你将成为一名 jQuery Mobile 专家。\n\n## 结语\njQuery Mobile 框架是一个强大的框架，受到了移动行业领导者的支持。它可以轻松地添加到现有网站中，创建一个不仅支持触摸，而且在大多数主流移动平台上支持并无残障人士访问的移动\
  \ Web 体验。通过该框架易用的功能和内置的渐进式增强技术，设计控制、页面过渡、组件集成、脚本、API 访问等许多功能都触手可及。\n\n## 支持的 jQuery\
  \ Mobile 平台\njQuery Mobile 框架支持大多数现代桌面、智能手机、平板电脑和电子阅读器平台。与其花费时间在测试多个设备上，你大可以从从开始就为许多平台提供支持。这是因为\
  \ jQuery Mobile 平台采用了渐进式增强方法，这不仅为设备带来了丰富的交互体验，还为旧版浏览器和手机提供了支持。当浏览器无法识别某些特定的 HTML5\
  \ 代码时，该网页将渲染为简单但功能完备的网页。旧手机或浏览器用户习惯于有限的 Web 体验，因此这种方法在这种情况下仍然会渲染出一个合格的基础 HTML 网页。\n\
  \n目前，`Android` 和 `Apple iOS` 是领先的移动操作系统。`Android` 拥有最大的操作系统市场份额（44.2%），而 `Apple`\
  \ 在美国拥有最大的手机市场份额（28.6%）。`Windows`、`BlackBerry`、`SymbianOS` 和 `Palm/HP webOS` 操作系统占据了剩余的大部分智能手机市场份额（图\
  \ 1）。所有这些平台/操作系统都得到了 jQuery Mobile 框架的支持。\n\n![Image](img/jquery-opener-1.jpg)\n\
  \n图 1. 2011 年操作系统市场份额。\n\n### 主要平台\n以下列表提供了有关受 jQuery Mobile 框架完全支持的主要平台的更多信息。\n\
  \n![Image](img/jquery-opener-2.jpg)\n\n### IOS\n`iOS` 是苹果的移动操作系统。它最初为 `iPhone` 开发，现已扩展到支持其他苹果设备，如\
  \ `iPod Touch`、`iPad` 和 `Apple TV`。`iOS` 使用 `Safari` 作为其 浏览器。\n\n![Image](img/jquery-opener-3.jpg)\n\
  \n### ANDROID\n`Android` 是由 `Google` 领导的开源软件项目和操作系统。自根据 `Apache` 许可证发布以来，它已用于大量的手机、平板电脑和其他设备。`Android`\
  \ 使用 `Google Chrome` 作为其 浏览器。\n\n![Image](img/jquery-opener-4.jpg)\n\n### WINDOWS\
  \ PHONE\n`Windows Phone` 是微软的移动操作系统。该系统与第三方以及微软服务集成。`Windows Phone` 使用 `Internet\
  \ Explorer Mobile` 作为其 浏览器。\n\n![Image](img/jquery-opener-5.jpg)\n\n### BLACKBERRY\n\
  `BlackBerry` 由一种专有的移动操作系统驱动，在其自己的智能手机和平板电脑上提供。\n\n![Image](img/jquery-opener-6.jpg)\n\
  \n### WEBOS\n`webOS` 是 Palm 设备使用的开源操作系统。`webOS` 在其浏览器中使用 `WebKit` 布局引擎，简单名为 `Web`。\n\
  \n### 分级支持\njQuery Mobile 使用三级列表列出框架支持的平台。级别分为 `A`、`B` 和 `C`。`A` 包含完整的体验，并可以选择基于\
  \ `Ajax` 的页面过渡；`B` 包含相同的体验，但不包含 `Ajax` 的页面过渡；而 `C` 是基础但功能完备的 HTML 体验。\n\n`A` 级支持之前提到的所有主要移动操作系统以及，包括\
  \ `Apple iOS`、`Android`、`Windows Phone`、`BlackBerry`、`Palm/HP webOS`、`Kindle 3`、`Kindle\
  \ Fire` 等。`B` 级支持包括 `BlackBerry 5`、`Opera Mini` 和 `Nokia SymbianOS`。`C` 级支持包括 `BlackBerry\
  \ 4`、`Windows Mobile` 以及所有旧款智能手机和功能手机。此列表不断演进；要查看最新列表，请访问 [jquerymobile.com](http://jquerymobile.com)。\n\
  \n# 第一部分：jQuery Mobile 基础\n\n## 1. 理解 jQuery\njQuery 框架是 jQuery Mobile 框架的骨干，因此在开发\
  \ jQuery Mobile 网站之前，了解 jQuery 框架的基础知识会有帮助。虽然不是必须的，但理解 jQuery 将使使用 jQuery Mobile\
  \ 变得更加简单，特别是如果你对编写任何自定义功能感兴趣的话。\n\n`jQuery` 是一个强大且轻量级的 JavaScript 库，简化了 JavaScript\
  \ 代码并扩展了层级样式表（CSS）的功能。此外，它消除了跨浏览器兼容性问题并符合 CSS3 标准。这意味着脚本更快、测试更少，针对不同浏览器处理某些功能编写的代码也更少。`jQuery`\
  \ 框架是 Web 开发应该有的典范：你每次都能得到你所期望的结果。\n\n### 开始学习\n\n\n\n\n\n要开始使用 jQuery，你首先需要从 [jquery.com](http://jquery.com)\
  \ 下载框架并将其包含在网页中，或者你也可以通过 Google、Microsoft 或 jQuery 内容分发网络（CDN）引用它。我推荐并经常通过 CDN 引用该库，因为它更快。CDN\
  \ 会将你的内容分发到多个地理分散的服务器上，因此用户将接收到最近的文件。此外，Google 和 Microsoft 都提供了通过 HTTPS 支持安全套接层\
  \ (SSL) 的版本，如果你在 SSL 下进行任何类型的开发，这是必不可少的。要通过 CDN 引入库（我们以 Google 为例），使用 `script` 元素将其包含在\
  \ `<head>` 元素内或网页末尾。\n\n点击此处查看代码图片\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\">\n</script>\n\
  ```\n\n在 `<head>` 元素中包含 JavaScript 文件是传统方法。但根据 Yahoo! 的说法，“终端用户响应时间的 80% 都在前端。”大部分时间花在了下载资源上，如样式表、图像、脚本等。减少资源数量显然是重要的，但在\
  \ HTML 文件末尾包含 JavaScript 变得变得越来越常见。这是因为脚本会阻塞并行下载，这意味着在每个脚本被单独下载之前，其他资源将不会下载。为了确保你将脚本放置在正确的位置，只需在闭合的\
  \ `</html>` 标签之前包含它们。\n\n在生产环境中使用压缩后的版本（minified version）是最好的，因为它比源版本更小。此外，虽然包版本（packed\
  \ version）比压缩后的版本更小，但它需要客户端处理时间来解压缩文件，而且在最新版本中已不可用。根据 Yahoo! 的说法，“在对十个美国顶级网站的调查中，代码压缩实现了\
  \ 21% 的体积缩减。”\n\n## jQuery 基础\n\n如果你熟悉编写 JavaScript 和 CSS，那么编写第一个 jQuery 脚本会感到非常熟悉，但可能稍微有一点奇异。jQuery\
  \ 框架是一个 JavaScript 库，这意味着它是用 JavaScript 构建的。基础知识是相同的，因为你本质上仍然在编写 JavaScript，只是恰好你编写的方式使用了\
  \ jQuery 框架。换句话说，虽然对某些基础知识可能增加了增强，但 JavaScript 的核心——变量、函数、条件语句等——并没有改变。所以，你仍然将使用\
  \ `var` 关键字、`if` 和 `switch` 语句以及函数，但你一定会注意到许多额外的增强和不同的编写方式，即访问 HTML 元素。\n\njQuery\
  \ 为 JavaScript 语言提供了许多增强，正如前面提到的，最棒的部分是它是跨浏览器兼容的，因此你再也不需要为处理不同的浏览器编写同一个脚本的多个版本了，这确实让人松了一气。这在处理事件、Ajax（本章稍后会讨论）以及其他传统上需要一些条件语句来确定浏览器如何解释代码的功能时\
  \ 特别有用。\n\n### 选择 HTML 元素\n\n与其不断使用 `document.getElementById()` 来访问网页中的 HTML 元素，你只需简单地使用\
  \ jQuery 选择器 `jquery()` 或 `$()` 函数，后者是简写版本，也是我将在本书中一直使用的版本。使用 jQuery 选择器不仅让你编写的字符更少，还让你能做比通过\
  \ `id` 访问元素多多的事情。通过 jQuery 选择器，你还可以访问 HTML 元素数组，或者通过名称访问元素或对象。jQuery 选择器将一个元素或一组元素封装成一个\
  \ jQuery 对象，允许你对对象本身应用 jQuery 方法。而且不仅如此：你甚至可以通过类名访问元素，或使用 CSS 选择器，如 `:first-child`、`:nth-child`\
  \ 等。以下是几个示例：\n\n-   要使用 jQuery 选择器通过 ID 访问元素，使用 `#id` 选择器，就像你在 CSS 中通过 ID 为元素附加类名一样：\n\
  \n```javascript\n$('#foo');\n```\n\n-   要通过类名访问元素，使用 `.class` 选择器，就像你在创建 CSS 类时一样。如果你有多个具有相同类名的元素，它们都将被选中。\n\
  \n```javascript\n$('.foo');\n```\n\n-   要选取带有特定类名的特定元素，在类名之前添加元素名称：\n\n```javascript\n\
  $('div.foo');\n```\n\n-   你甚至可以使用元素选择器选取特定的元素或一组元素：\n\n```javascript\n$('div');\n\
  ```\n\n如果你熟悉 CSS，你可能开始看到这种模式的展开和无尽的可能性。构建 CSS 类时的可用选项与你使用 jQuery 选择器访问 HTML 元素时使用的选项是相同的。这就是\
  \ jQuery 如何增强 JavaScript 和 CSS 的——它将两者并将它们的语法合并成一种新语言，当然，在合理使用的情况下，这增强了整体用户体验。\n\
  \n### 管理事件和函数\n\njQuery 使用事件来响应网页上的用户交互，例如鼠标点击。在 jQuery 中，事件非常容易管理，而且它们在所有主流浏览器中都是可靠的，这是一件大事，因为在传统的\
  \ JavaScript 中并不总是如此。jQuery 赋予你从任何现有的 HTML 元素拦截许多不同事件的能力。通常，事件被用于执行某种函数。在下面的示例中，一个\
  \ `click` 事件被绑定到类名为 `foo` 的 `div` 元素上：\n\n点击此处查看代码图片\n\n```javascript\n$('div.foo').click(function(e)\
  \ {\n    // 你的代码\n});\n```\n\n通过将 `click` 事件绑定到 `div`，为点击该 `div` 关联了一个函数。因此，每当点击\
  \ `div.foo` 时，你的自定义代码就会执行。\n\n如果你熟悉传统的 JavaScript，这种语法看起来很奇怪。别担心——我刚开始时也是这样，但一旦学会了，我就喜欢它了。一旦你熟悉了它，你会发现这种语法封装良好、易于理解且易于编写。让我们分解一下之前的示例：\n\
  \n1. jQuery 选择器用于选取 `div.foo`，然后变成一个 jQuery 对象。\n2. `div.foo` jQuery 对象在 `div.foo`\
  \ 被点击时使用 `click` 方法触发处理函数。\n3. 处理函数用于执行自定义代码。处理函数还可以访问 `eventObject`，它是作为参数传递的。在示例中，它是处理函数中的参数\
  \ `e`。\n\n如果你使用 jQuery 选择器选择一个多个 HTML 元素使用的类名并分配鼠标事件，该鼠标事件将自动绑定到所有这些元素。因此，在上面的示例中，如果你有多个类名为\
  \ `foo` 的 `div` 元素，`click` 事件将绑定到所有它们。在处理绑定到多个元素的事件时，考虑作用域是重要的，以确保你执行的任何自定义代码都应用于目标元素。\n\
  \n点击此处查看代码图片\n\n```javascript\n$('div.foo').click(function(e) {\n    alert($(this).html());\n\
  });\n```\n\n在此示例中，`$(this)` 用于访问作用范围内的当前元素。\n\n* *\n\n![Image](img/note.jpg) 注意\n\
  \n作用域是值所关联的上下文。在这种情况下，函数是上下文，而 `$(this)` 是值。\n\n\n\n\n\n`$(this)` 与在 JavaScript\
  \ 中使用 `this` 关键字相同；在这种情况下，它适用于当前触发 `click` 事件的元素。在考虑作用域时，`this` 始终指向与闭包上下文相关的对象。在示例中，`div.foo`\
  \ 是对象，而 `click` 事件的处理器函数就是闭包上下文。jQuery 会自动在你的匿名处理函数内部将被点击的元素赋值为 `$(this)`。这使得你能够访问执行事件的元素，即使相同的代码被应用于多个元素上也是如此。函数用于作为事件的结果或对函数的简单直接的调用来执行脚本或一组脚本。\n\
  \n### `bind` 方法与自定义事件\n\n正如你将在本书的后续部分学到的，`bind` 方法经常被 `jQuery Mobile` 框架用于处理自定义事件。\n\
  \n#### jQuery Mobile 自定义事件\n\n`jQuery Mobile`提供的自定义事件为框架原生功能之外的开发提供了非常有钩子，这意味着你可以拦截某些现有的事件并添加自己的自定义代码。这些事件包括\
  \ `touch`、`mouse` 和 `window` 事件，你将在本书的后续部分学习如何扩展它们。jQuery 中 `bind` 方法的语法与之前的代码示例非常相似。\n\
  \n点击此处查看代码图片\n\n```javascript\n$('div.foo').bind('click', function(e) {\n    //\
  \ 在此处编写你的自定义代码\n});\n```\n\n区别在于，你可以使用同一个处理器对多个事件做出反应：\n\n点击此处查看代码图片\n\n```javascript\n\
  $('div.foo').bind('mouseenter mouseleave', function(e) {\n    // 在此处编写你的自定义代码\n\
  });\n```\n\n***\n\n![Image](img/note.jpg) 备注\n\n函数与方法之间的区别在于，函数是独立的，而方法与对象关联的。在这种情况下，`bind`\
  \ 方法与 `jQuery` 对象关联联。\n\n***\n\n#### 处理自定义事件\n\n或者你也可以处理自定义事件，例如由 `jQuery Mobile`\
  \ 框架实现的：\n\n点击此处查看代码图片\n\n```javascript\n$('div.foo').bind('displayMyName', function(e,\
  \ myName) {\n    alert('My name is: '+ myName);\n});\n\n$('button').click(function\
  \ () {\n    $('div.foo').trigger('displayMyName', ['John Smith']);\n});\n```\n\n\
  当我们讨论如何将 `jQuery Mobile` 事件与自定义处理函数绑定时，将更深入地介绍绑定事件的内容。\n\n### 等待文档就绪\n\n开发者之间的一种常见做法是在执行任何\
  \ JavaScript 之前等待网页加载。这样做的原因是确保在尝试访问或操作网页元素之前，这些元素是可用的。尝试访问不可用的文档元素可能会导致意想不到的行为，并可能破坏你后续所有的\
  \ JavaScript 代码。在传统的 JavaScript 中，等待页面加载的最常用方法是使用 `window.onload` 事件。然而，这种方法是在文档加载之后发生的，因为它实际上在等待网页内内的所有图像和横幅加载，这会极大地延迟你的脚本执行。幸运的是，jQuery\
  \ 提供了一个 `ready` 事件，让你的代码在文档可用时立即做出响应。\n\n点击此处查看代码图片\n\n```javascript\n$(document).ready(function()\
  \ {\n    // 在此处编写你的自定义代码\n});\n```\n\n首先，你需要选择文档对象本身，然后应用 `ready` 事件。当 `ready` 事件触发时，它将执行包含你自定义代码的函数。继续之前的示例，你需要将自定义代码添加到\
  \ `ready` 事件中，以确保在尝试应用 `click` 事件之前文档是就绪的：\n\n点击此处查看代码图片\n\n```javascript\n$(document).ready(function()\
  \ {\n    $('div.foo').click(function() {\n        alert($(this).html());\n    });\n\
  });\n```\n\n或者你可以使用简写版本，它消除了访问 `document` 和设置 `ready` 事件的需要。\n\n点击此处查看代码图片\n\n```javascript\n\
  $(function() {\n    $('div.foo').click(function() {\n        alert($(this).html());\n\
  \    });\n});\n```\n\n使用 `ready` 事件是任何 jQuery 开发中的事实标准。这种方法不仅确保了你的代码会在适当的时间触发，还利于创建完全不干扰的代码，这意味着你可以将所有的\
  \ jQuery 代码写在一个独立的外部文件中，只需从你的 HTML 网页中简单引用它即可。\n\n### 应用特殊特效\n\n`jQuery` 以其允许你在不使用第三方插件（如\
  \ `Flash`）的情况下创建特殊特效而闻名。该库提供了许多将动画整合到网页中的技术。动画可以创建一个更具视觉吸引力的网页，也可以用于其他更具实用的目的，例如为用户交互提供视觉反馈。`jQuery`\
  \ 框架包含了许多预置的动画方法，例如 `fadeIn`、`fadeOut`、`fadeTo`、`show`、`toggle`、`slideUp` 和 `slideDown`\
  \ 等。\n\n```javascript\n$(document).ready(function() {\n    $('div.foo').fadeIn();\n\
  });\n```\n\n尽管这些预置方法看起来是独立的，但它们许多内部是由 `animate` 方法驱动的。`animate` 方法可以用于对任何数值 CSS\
  \ 属性进行动画处理，例如 `height`、`opacity`、`left` 和 `right`。\n\n点击此处查看代码图片\n\n```javascript\n\
  $(document).ready(function() {\n    $('div.foo').click(function() {\n        $(this).animate({\n\
  \            height: '50'\n        }, 1000, function() {\n            // 动画完成后执行的自定义代码\n\
  \        });\n    });\n});\n```\n\n在这个示例中，当 `div.foo` 被点击时，它的 `height` 属性将在 1 秒（1000\
  \ 毫秒）内增加 50 像素，动画完成后，回调函数将执行你的自定义代码。这种功能非常强大；你不仅可以在事件触发时执行动画，还可以在动画完成后触发函数甚至另一个事件，以此类推。\n\
  \n#### 队列方法\n\n`queue` 方法提供了一种队列连续效果的方法，这意味着可以在队列中运行多个效果，或者通过 `clearQueue` 方法停止队列。`queue`\
  \ 方法主要由 `FX` 队列（即默认队列）使用，但也可以通过 `jQuery` API 可用。\n\n`queue` 和 `dequeue` 方法旨在与特定的元素或对象关联。使用\
  \ `queue` 方法时，你需要分配一个参数作为参数，例如一个匿名函数：\n\n```javascript\n$(document).ready(function()\
  \ {\n    $('div.foo').fadeOut().queue(function(){\n        $('div.foo').fadeIn();\n\
  \        next();\n    });\n});\n```\n\n这种功能让你能够不使用 JavaScript 函数（如 `setTimeout`\
  \ 或 `setInterval`）来产生基于时间线的动画。\n\n这些示例仅涵盖了动画方法。`jQuery` 包含了创建队列以提供额外功能的方法。**表 1.1**\
  \ 列出了 jQuery 中可用的队列方法。\n\n表 1.1 队列方法\n\n![Image](img/01tab01.jpg)\n\n正如提到的，尽管队列通常用于效果并在\
  \ jQuery 文档中列在效果下，但它们也可以用于队列其他功能，例如一系列异步方法调用，这引导我们进入使用 jQuery Ajax。\n\n#### 使用 Ajax\n\
  \n\n\n\n\nAjax 是异步 JavaScript 和 XML（asynchronous JavaScript and XML）的缩写。异步意味着你可以通过超文本传输协议（`HTTP`）向服务器发送请求，并在等待响应的同时处理其他数据。例如，你可以调用服务器端脚本以\
  \ XML 格式从数据库检索数据，将数据发送到服务器端脚本存储在数据库中，或者简单地加载 XML 文件以在不刷新网页的情况下填充网站页面。通过 `jQuery`\
  \ 框架提供的功能使得 Ajax 开发比传统的 JavaScript 简单得多，因为它需要更少的代码，并提供了额外的方法和事件处理器来涵盖任何情况。与传统的 JavaScript\
  \ 相比，即使在开发复杂功能时，处理 Ajax 所需的 `jQuery` 代码极少，这最终加快了开发速度。\n\n使用传统的 JavaScript，由于不同浏览器之间存在各种差异，Ajax\
  \ 需要大量的冗余代码来构建请求和处理响应。要发送请求并处理响应，你需要编写类似以下的代码：\n\n点击此处查看代码图像\n\n```javascript\n\
  if(window.XMLHttpRequest) {\n    request = new XMLHttpRequest();\n}\nelse if(window.ActiveXObject)\
  \ {\n    request = new ActiveXObject('MSXML2.XMLHTTP');\n}\n\nrequest.onreadystatechange\
  \ = onResponse;\nrequest.open('GET', 'url for request', true);\nrequest.send(null);\n\
  \nfunction checkReadyState(obj) {\n    if(obj.readyState == 0) { // Sending Request\
  \ }\n    if(obj.readyState == 1) { // Loading Response }\n    if(obj.readyState\
  \ == 2) { // Response Loaded }\n    if(obj.readyState == 3) { // Response Ready\
  \ }\n    if(obj.readyState == 4) {\n        if(obj.status == 200) {\n          \
  \  return true;\n        }\n        else if(obj.status == 404) {\n            //\
  \ File not found\n        }\n        else {\n            // There was a problem\
  \ retrieving the XML\n        }\n    }\n}\n\nfunction onResponse() {\n    if(checkReadyState(request))\
  \ {\n        // Handle the response with one of the following properties\n     \
  \   //alert(request.responseXML);\n        //alert(request.responseText);\n    }\n\
  }\n```\n\n`jQuery` 实现了与传统的 JavaScript 相同的功能，但你无需担心编写其大部分代码。这并不是说 JavaScript 难以编写，而是要写的内容太多，而且往往会变得混乱，尤其是当你将其与使用\
  \ `jQuery` 编写请求和响应的简单程度进行比较时。以下是一个使用 `jQuery` 的 Ajax 请求示例，与之前的 JavaScript 示例非常相似：\n\
  \n点击此处查看代码图像\n\n```javascript\njQuery.ajax({\n    url: 'url for request',\n    success:\
  \ function(xml) {\n        // Parse the response\n    }\n});\n```\n\n此代码使用了 `jQuery`\
  \ 对象的 `ajax` 方法，包含用于请求的 `url` 属性，并使用匿名函数处理 `success` 回调。在 `jQuery` 对象的 `ajax` 方法中可以使用许多更多属性，例如请求的\
  \ `type`（`POST` 或默认的 `GET`）、`username` 和 `password` 以及 `crossDomain`。然而，这个示例展示了\
  \ `ajax` 方法的最基本形式，以说明 `jQuery` Ajax 调用的用的性。\n\nAjax 在 `jQuery Mobile` 框架中用于处理页面更改以及加载或预加载页面。该框架通过应用程序编程接口（`API`）提供处理此类功能的访问，我们将在本书的后续部分详细介绍。\n\
  \n## 总结\n\n`jQuery` 通过简化 JavaScript 并将其与 `CSS` 语法结合，使用户界面增强变得更加容易。该框架提供了一种编写更少代码、花费更少测试时间并在更时间内实现更复杂结果的方法。`jQuery`\
  \ 让你通过轻松添加自定义交互以及自定义效果为用户提供视觉反馈，从而增强网页，最终创造出更好的用户体验。\n\n本书并非教授 `jQuery` 框架，但本章回顾了理解和使用\
  \ `jQuery Mobile` 框架所必需的概念。要了解更多关于 `jQuery` 框架的信息，请访问 jquery.com。\n\n\n\n\n你可以在一个独立的移动网站中包含\
  \ `viewport` 元标记标签，以适应较小的浏览器显示，但这通常超出了许多公司的能力范围，因为这增加了的时间和成本。此外，管理两个独立的网站通常是难以应付的负担。目前，正确渲染你网站的标准选项是使用\
  \ `viewport` 元标记标签。该标签告诉浏览器根据在该浏览器中查看时的最佳宽度来优化你的网站。要使用 `viewport` 元标记标签设置显示，请将元标记的\
  \ `name` 属性设置为 `viewport`，然后使用 `content` 属性来设置符合你需求的属性和值。在 `content` 属性中，你可以定义想要为布局设置的属性和值。如需向\
  \ `viewport` 元标记标签添加多个属性，你需要创建一个用逗号分隔的属性和值对列表。以下是移动开发中 `viewport` 元标记标签最常见的设置：\n\
  \n点击此处查看代码图片\n\n```html\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
  >\n```\n\n要将此标签包含在 HTML5 模板中，请将其添加到 `head` 元素中：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n    <head>\n        <meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n        <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n        <title>Page Title</title>\n    </head>\n<body>\n\n\
  </body>\n</html>\n```\n\n要设置的最重要属性是 `width`，对于移动网站，它应该被设置为 `device-width`。第二个属性是\
  \ `initial-scale`，它定义了网站首次加载时的状态，之后用户可以放大或缩小比例。例如，如果你将 `initial-scale` 设置为 2 而不是\
  \ 1，那么默认情况下网站将缩放 2 倍（即 2 将用作缩放的倍数）。表 2.1 详细描述了这些和其他元 `viewport` 属性。\n\n表 2.1. 元\
  \ viewport 属性\n\n![Image](img/02tab01.jpg)\n\n在为移动网站设计或开发时，了解你的内容如何在不同设备上显示非常重要。记住，手持设备有很多形状和大小，而且有竖屏和横屏模式需要处理。我总是考虑使用\
  \ CSS 和/或 `viewport` 属性来创建可缩布局。然而，通过使用代码示例中的 `viewport` 元标记代码结合 jQuery Mobile 框架，你可以确保你的网站可以在广泛设备上尽可能准确渲染。\n\
  \n### 理解数据属性 (data-Attributes)\n\nHTML5 `data-` 属性允许你存储用户不可见的自定义数据。换句话说，这些数据不会被浏览器渲染，甚至不会被使用。在之前的\
  \ HTML 版本中，自定义数据通常存储在 `title`、`rel`、`class` 或 `id` 属性中，或者隐藏的 HTML 元素中。存储在这些属性中的数据可以被\
  \ JavaScript 访问。通过 JavaScript 访问自定义数据有许多用处；它可以在后台创建自定义功能，或者在发生特定交互时向用户显示。在网页中使用自定义数据的一个很好的例子是图片画廊：可以为图片添加标题和描述，然后使用\
  \ JavaScript 显示用户正在查看的图片信息。归根结底是，这是对这些 HTML 属性的误用，但到目前为止，它是处理某些不受支持功能的唯一方法。幸运的是，在\
  \ `data-` 属性的支持下，开发者可以开始恰当地使用 HTML 属性。\n\n你现在不必使用具有其他预定义用途的属性，而是可以创建与你的数据更相关的自定义\
  \ `data-` 属性，并且仍然渲染出有效的 HTML。HTML5 规范支持任何以 `data-` 开头的属性作为数据存储区域。你想要附加到 `data-`\
  \ 前缀的任何名称都将被支持。例如，如果你为属于图片画廊的图片标签添加自定义的 `data-` 属性，你可以添加自定义的 `data-title` 和 `data-description`\
  \ 属性，并给它们赋予任何自定义值。\n\n点击此处查看代码图片\n\n```html\n<img src=\"image-path/img.jpg\" data-title=\"\
  My image title\" data-description=\"My image description\">\n```\n\n![Image](img/note.jpg)\
  \ 注意\n\n创建自定义 `data-` 属性的唯一限制是属性的自定义部分必须至少有一个字符，且不能包含大写字母。\n\n属性值可以是任何字符串，并且如既往一样，你需要对字符串中的任何双引号进行转义。\n\
  \n记住潜在的命名冲突。随着 `data-` 属性变得越来越流行，JavaScript 库可能会寻找具有相似名称的属性，特别是当使用通用属性名称时，例如 `data-description`。解决此问题的良好方法是在\
  \ `data-` 属性的名称中使用自定义命名空间。例如，如果你正在为 `jquerymobile` 开发网站，你可以使用 `data-jquerytv-`：\n\
  \n```text\ndata-jquerytv-\n```\n\n随着 `data-` 属性变得越来越流行，JavaScript 库可能会寻找具有相似名称的属性，特别是当使用通用属性名称时，例如\
  \ `data-description`。解决此问题的良好方法是在 `data-` 属性的名称中使用自定义命名空间。例如，如果你正在为 `jquerymobile`\
  \ 开发网站，你可以使用 `data-jquerytv-`：\n\n```text\ndata-jquerytv-\n```\n\n如果你不使用命名空间，结果将不会在命名空间和值之间包含连字符，因此你的\
  \ `data-` 属性将难以阅读，jQuery Mobile 会寻找这样的属性：\n\n```text\ndata-jquerytvfoo\n```\n\n\
  jQuery Mobile 框架对组件使用了许多 `data-` 属性。框架本身允许你使用名为 `ns` 的全局配置选项定义自定义命名空间。`ns` 选项可以设置为任何自定义值，例如\
  \ `jquerymobile-`。如果你使用自定义命名空间，最好在结尾使用连字符：\n\n```text\njquerymobile-\n```\n\n请注意，选择自定义命名空间意味着你在编码时必须承诺。例如，在定义\
  \ jQuery Mobile 头部时，你通常使用：\n\n```html\ndata-role=\"header\"\n```\n\n要将此属性添加到你的 HTML5\
  \ 模板中，只需添加一个包含该属性的 `div`：\n\n```html\n<!DOCTYPE html>\n<html>\n    <head>\n    \
  \    <title>Page Title</title>\n        <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n    </head>\n<body>\n    <div data-role=\"header\">\n    \
  \    <h1>Header</h1>\n    </div>\n</body>\n</html>\n```\n\n然而，如果你在配置中定义了自定义命名空间，你将需要定义头部为：\n\
  \n```html\ndata-jquerymobiletv-role=\"header\"\n```\n\n我们将在书的后续部分详细讨论配置选项，包括 `ns`\
  \ 选项。\n\n由于 `data-` 属性的引入，开发者对添加到网页中的数据有了更多的控制权。自定义属性提供了一种方法，可以在支持语义化 HTML 的同时，通过前端脚本语言（如\
  \ JavaScript）增强网页。\n\n## 总结\n\n\n\n\n\n认为你需要理解 HTML5 和 jQuery 才能使用 jQuery Mobile\
  \ 框架可能令人望而生畏。幸运的是，该框架的设计方式支持不同技能水平的开发者。你不一定得知道 HTML5 和 jQuery，因为框架提供了一个可以直接从 [jquerymobile.com](http://jquerymobile.com)\
  \ 下载的 HTML5 模板，而 jQuery 对于想要使用它的开发者来说是可用的。唯一绝对必要的条件是理解如何使用 `data-` 属性，因为这是在不使用 jQuery\
  \ 的情况下向网页添加小组件的方法。\n\n## 3. 快速上手 jQuery Mobile\n\n在之前的章节中，我们涵盖了基础 jQuery、如何创建 HTML5\
  \ 模板、如何为移动端浏览添加 `viewport` 元标记，以及如何使用 `data-` 属性。现在，你已经准备好深入研究 jQuery Mobile，看看这些语言、元素和属性是如何通过框架被利用和增强的。jQuery\
  \ Mobile 框架的优点之一是，它的核心是基础的 HTML5 标记和 JavaScript，所有主流浏览器都支持它们。对于基础的 jQuery Mobile\
  \ 开发，老实说并没有多少东西要学。本章涵盖了几个步骤，并对幕后的运作提供了一些背景介绍。在后面的章节中，你将看到如何扩展这些基础概念，以创建更高级的 jQuery\
  \ Mobile 网站甚至是移动 Web 应用。\n\n### jQuery Mobile 如何工作\n\n构建 jQuery Mobile 网站有许多方法。然而，在最简单的形式中，框架运行在\
  \ HTML5 和 jQuery 库之上，将带有 `data-` 属性的元素转换为组件，使其非常容易整合到你现有的 Web 开发实践中。框架中最基本的组件是页面（pages）和工具栏（toolbars），它们将在本章稍后详细介绍。首先，让我们看看如何将\
  \ jQuery Mobile 框架整合到 HTML5 网页中。\n\n### 为你的网站添加 jQuery Mobile 框架\n\n首先，jQuery Mobile\
  \ 框架可以在 [jquerymobile.com](http://jquerymobile.com) 获取。有两种方法可以将 jQuery Mobile 框架添加到你的网页中。\n\
  \n第一种方法是下载单独包，包含了 JavaScript 库和 CSS 文件的完整版本和压缩版本。你还需要从 [jquery.com](http://jquery.com)\
  \ 下载 jQuery 库。\n\n第二种（推荐）选项是包含指向 CDN 托管文件的直接引用，如下所示：\n\n点击此处查看代码图像\n\n```html\n\
  <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\"\
  \ />\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n<script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
  ></script>\n```\n\n![Image](img/note.jpg) 注意\n\n请记住，在本书编写时，jQuery Mobile 框架的最新版本是最终版\
  \ 1。要获取包含这些文件的最新代码，请访问 [jquerymobile.com](http://jquerymobile.com)，你可以直接将其复制并粘贴到你的网页中。\n\
  \n要将框架添加到你在第二章 中创建的 HTML5 模板“HTML5 的角色”中，请将其添加到 `head` 元素内：\n\n点击此处查看代码图像\n\n```html\n\
  <!DOCTYPE html>\n<html\n    <head>\n        <meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n        <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n        <title>Page Title</title>\n        <link rel=\"stylesheet\"\
  \ href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\" />\n    \
  \    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n        <script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
  ></script>\n    </head>\n<body>\n\n</body>\n</html>\n```\n\n推荐使用内容分发网络（CDN）托管文件的主要原因是加载速度更快。CDN\
  \ 会将你的内容分布在多个地理分散的服务器上，因此访问你网页的用户将接收到最近的 Web 文件。\n\n如果你正在开发 Microsoft .net 应用程序，可以使用\
  \ Microsoft CDN 托管的 jQuery Mobile 文件，目前可以在 [`www.asp.net/ajaxLibrary/CDNjQueryMobile10.ashx`](http://www.asp.net/ajaxLibrary/CDNjQueryMobile10.ashx)\
  \ 获取。\n\n有了 jQuery Mobile 框架后，你就可以开始将 HTML5 标记转换为丰富的移动组件。让我们来看看最常见的组件：页面和工具栏。\n\n\
  ### 页面和工具栏\n\n在 jQuery Mobile 中，页面字面意思是由一个 `data-role` 属性为 `page` 的元素定义。我不确定是否还能比这更简单了。jQuery\
  \ Mobile 将将这个 `<div>` 转换为页面。下面的示例了使用这些 `data-roles` 的典型 HTML 结构：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n    <head>\n        <meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n        <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n        <title>Page Title - jQuery Mobile</title>\n      \
  \  <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\"\
  \ />\n        <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n        <script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
  ></script>\n    </head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
  header\">\n            <h1>Page title</h1>\n        </div>\n        <div data-role=\"\
  content\">\n            Body copy\n        </div>\n        <div data-role=\"footer\"\
  >\n            Copyright\n        </div>\n    </div>\n</body>\n</html>\n```\n\n\
  代码与我们之前的示例非常相似，增加了 `page`、`header`、`content` 和 `footer` 元素。jQuery Mobile 对这些标记的视觉转换可以在\
  \ **图 3.1** 中看到。\n\n![Image](img/jquery-3-1.jpg)\n\n图 3.1。jQuery Mobile 在视觉上转换带有特定\
  \ data- 属性的标记。\n\n`header`、`content` 和 `footer` 都被转换为一种基础布局，在视觉上分隔了每个部分。这是默认的 jQuery\
  \ Mobile 主题；在本书后后部分，你将学习如何创建自定义主题。\n\n\n\n` 标签开头处截断了）。根据您提供的上下文，我为您翻译了已给出的部分。如果您有后续文本，请继续提供。\n\
  \n[content]\n\n构建 jQuery Mobile 网页结构有两种方式。第一种是将所有页面整合在同一个文件中；第二种是像典型网站一样创建独立的文件。要在单个\
  \ HTML 文件中创建多个页面，你可以定义多个 `page` `data-roles`，这允许每个 `page` `data-role` 包含自己的页眉（header）、内容（content）、页脚（footer）等。以下示例展示了如何在单个\
  \ HTML 文件中创建多页 jQuery Mobile 网站的基本思路：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
  >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
  \    <title>Page Title</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\"\
  \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
  ></script>\n</head>\n<body>\n    <div data-role=\"page\" id=\"page-one\">\n    \
  \    <div data-role=\"header\">\n            <h1>Page 1</h1>\n        </div>\n \
  \       <div data-role=\"content\">Body copy for page 1</div>\n        <div data-role=\"\
  footer\">Copyright</div>\n    </div>\n    <div data-role=\"page\" id=\"page-two\"\
  >\n        <div data-role=\"header\">\n            <h1>Page 2</h1>\n        </div>\n\
  \        <div data-role=\"content\">Body copy for page 2</div>\n        <div data-role=\"\
  footer\">Copyright</div>\n    </div>\n</body>\n</html>\n```\n\n这种方法并不被推荐，因为这种结构的文件通常会变得难以管理，且文件体积大得多，最终导致加载时间更长。对于演示或原型设计，这可能是一个选项，但强烈建议你将移动网站或应用程序构建为独立的\
  \ HTML 文件。\n\n当使用独立的 HTML 文件构建网页时，`page` `data-role` 被用作容器，框架会将其他网页加载到容器中。例如，假设你有两个独立的\
  \ HTML 文件，`page-1.html` 和 `page-2.html`。然后你向两个文件中都添加 `page` `data-role` 属性，并将 `page-1.html`\
  \ 超链接链到 `page-2.html`：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
  \    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n \
  \   <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n \
  \   <title>Page 1 - jQuery Mobile: Design and Develop</title>\n    <link rel=\"\
  stylesheet\" href=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.css\"\
  \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/ jquery.min.js\"\
  ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0/jquery.mobile-1.0.min.js\"\
  ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
  header\">\n            <h1>Page 1</h1>\n        </div>\n        <div data-role=\"\
  content\">\n            <a href=\"page-2.html\">Link to page 2</a>\n        </div>\n\
  \        <div data-role=\"footer\">\n            Copyright\n        </div>\n   \
  \ </div>\n</body>\n</html>\n```\n\n在包含 jQuery Mobile 框架后，`page-1.html` 的 `page`\
  \ `data-role` 将自动成为容器，通过 `XMLHttpRequest` 加载 `page-2.html` 中 `page` `data-role`\
  \ 内的标记。`XMLHttpRequest` 是 Ajax 用于与服务器交换数据而无需刷新网页的方法；它就像是通往后端的门户。图 3.2 显示了当 `page-1.html`\
  \ 链接 `page-2.html` 时产生的 `XMLHttpRequest` 示例。该请求使用 Chrome 开发者工具记录。在此例中，使用 Chrome\
  \ 开发者工具是为了查看点击指向 `page-2.html` 的链接是由 jQuery Mobile 发起的 `XMLHttpRequest`。Chrome 开发者工具是测试和调试代码的极佳方法。\n\
  \n![Image](img/jquery-3-2.jpg)\n图 3.2. jQuery Mobile 使用 `XMLHttpRequest` 加载后续页面。\n\
  \n![Image](img/note.jpg)\n注意 Chrome 开发者工具是 Chrome 浏览器内置的集成 Web 开发环境。HTML 页面本身被请求，jQuery\
  \ Mobile 使用其内容来显示新页面。关于这个简单的请求有很多值得学习的地方，我们将在后续章节中进行详细介绍。\n\n## 总结\n\n包含 jQuery\
