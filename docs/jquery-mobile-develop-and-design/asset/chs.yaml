  \n\n\n\n\n图 12.2 显示了框架如何转换标记，以包含我们创建并对其应用 CSS 的新类。\n\n![Image](img/jquery-12-2.jpg)\n\
  \n图 12.2。框架根据全局配置设置插入的自定义活动页面类。\n\n另一个名为 `activeBtnClass` 的属性与 `activePageClass`\
  \ 的工作原理完全相同。你可以在 `mobileinit` 回调中设置它。它可以包含任何字符串值，且该字符串值最终可以关联到包含在 CSS 文件中的自定义 CSS\
  \ 类。`activePageClass` 和 `activeBtnClass` 属性唯一的区别在于，`activeBtnClass` 允许你对使用的任何按钮的活动状态进行样式设置。\n\
  \n## 启用禁用 Ajax 导航\n\n默认情况下，使用 `$.mobile` 对象的 `ajaxEnabled` 属性将基于 Ajax 的导航设置为 `true`。然而，你可以在配置文件中此此设置为\
  \ `false`：\n\n点击此处查看代码图片\n\n```javascript\n$(document).bind(\"mobileinit\", function()\
  \ {\n    $.extend( $.mobile, {\n        ajaxEnabled: false\n    });\n});\n```\n\n\
  这是一个非常容易修改的属性，但它具有重大影响。将此属性设置为 `false` 会禁用 URL hash 监听，并将所有 URL 加载为标准的 HTTP 请求。这样做会导致页面刷新、禁用页面预加载和缓存，并消除页面和对话框过渡。如果你希望你的移动网站运行像标准网站一样，将此选项设置为\
  \ `false` 将创建标准的 HTTP 请求。\n\n## 修改默认页面和对话框过渡\n\n默认情况下，当通过 Ajax 处理页面更改时，jQuery Mobile\
  \ 中的页面和对话框包含过渡效果。默认页面过渡是 `slide`，而默认对话框过渡是 `pop`。要更改这些值，请定位到 `defaultPageTransition`\
  \ 和/或 `defaultDialogTransition` 属性：\n\n点击此处查看代码图片\n\n```javascript\n$(document).bind(\"\
  mobileinit\", function() {\n    $.extend( $.mobile , {\n        defaultPageTransition:\
  \ \"fade\",\n        defaultDialogTransition: \"fade\"\n    });\n});\n```\n\n如果你运行这段代码，你会看到页面和对话框的过渡都将变为淡入（fade）：\n\
  \n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1\">\n    <title>Page Transitions\
  \ - jQuery Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"\
  http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\" />\n    <script\
  \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"></script>\n\
  \    <script src=\"assets/js/custom-jqm-transitions.js\"></script>\n    <script\
  \ src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"></script>\n\
  </head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"header\"\
  ><h1>Page Name</h1></div>\n        <div data-role=\"content\">\n            <p><a\
  \ href=\"sample-page.html\">Open Another Page</a></p>\n            <p><a href=\"\
  dialog.html\" data-rel=\"dialog\">Open Dialog </a></p>\n        </div>\n       \
  \ <div data-role=\"footer\">Copyright</div>\n    </div>\n</body>\n</html>\n```\n\
  \n框架包含了六种基于 CSS 的过渡效果：`slide`、`slideup`、`slidedown`、`pop`、`fade`、`flip`，在第四章“使用\
  \ jQuery Mobile 创建多页网站”中都详细介绍过。这些效果也可以通过包含 `data-transition` 属性直接应用在超链接上：\n\n点击此处查看代码图片\n\
  \n```html\n<a href=\"sample-page.html\" data-transition=\"flip\">Data transition</a>\n\
  ```\n\n使用这段代码将覆盖之前的任何过渡设置。\n\n## 总结\n\njQuery Mobile 框架易于使用，但不要被它的简单性欺骗了——幕后发生了很多事情。有许多方法可以添加自定义功能来创建强大的移动网站。访问\
  \ API 允许进行精细的控制，让你能够告诉框架默认如何行为，甚至可以挂钩到客户端发生的每一次交互中。在下一章节中，你将看到事件如何能为你的自定义项目提供更多控制。\n\
  \n## 13. 挂钩事件\n\njQuery Mobile 提供了你可以使用的自定义事件，用于扩展框架的功能，包括触摸、滚动、设备方向、页面过渡和页面初始化等。挂钩\
  \ jQuery 事件打开了通过基础设置无法实现的整个机会世界。了解网页在任何给定时间的状态可以提供一种你可用于扩展现有功能的控制水平。本章将向你展示如何挂钩到这些事件中的每一个。有许多触摸事件可以挂钩到\
  \ jQuery Mobile。请记住，这些事件仅对支持触摸的设备可用，因此桌面用户可能无法体验到这些事件或通过事件挂钩添加的任何自定义内容。尽管如此，触摸事件不会在桌面设备上引起错误：它们只是不会起，因为鼠标事件主导了桌面体验。这些事件可以触发一个包含任何\
  \ JavaScript 的回调函数。表 13.1 描述了通过 jQuery Mobile API 可的五个触摸事件。\n\n表 13.1. 触摸事件\n![Image](img/13tab01.jpg)\n\
  \n表 13.2 描述了在表 13.1 中提到的 `swipe` 事件属性。\n\n表 13.2. swipe 属性\n![Image](img/13tab02.jpg)\n\
  \n要绑定这些触摸事件中的任何一个，你必须使用 `document.ready` 事件。一旦文档就绪，你就可以访问 HTML 元素并绑定你选择的触摸事件：\n\n\
  点击此处查看代码图片\n\n```javascript\n$(document).ready(function(){\n    $(\".test-tap-hold\"\
  ).bind(\"taphold\", function(event) {\n        $(this).html(\"Tapped and held\"\
  );\n    });\n});\n```\n\n一旦文档就绪，`taphold` 事件被绑定到类名为 `.test-tap-hold` 的元素。当手指触摸此元素并保持在该时，`taphold`\
  \ 事件就会触发。以下示例包含了将该事件绑定到 HTML 元素的 JavaScript 文件：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE\
  \ HTML>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html;\
  \ charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
  >\n    <title>taphold- jQuery Mobile: Design and Develop</title>\n    <link rel=\"\
  stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
  \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n</head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"\
  header\"><h1>Page title</h1></div>\n        <div data-role=\"content\">\n      \
  \      <ul data-role=\"listview\">\n                <li class=\"test-tap-hold\"\
  >Tap and hold test</li>\n            </ul>\n        </div>\n        <div data-role=\"\
  footer\">Copyright</div>\n    </div>\n</body>\n</html>\n```\n\n正如你所见，页面包含了一个 `listview`，其中包含一个类名为\
  \ `test-tap-hold` 的列表项。\n\n\n\n\n\n表 13.1 中的事件允许你将自定义代码挂接到移动网站的任何状态中。了解用户何时以及如何与屏幕交互，可以为你响应这些交互奠定基础。\n\
  \n### 方向事件 (Orientation Events)\n\njQuery Mobile 框架包含一个名为 `orientationchange` 的单一方向事件。每当设备垂直或水平旋转时，该事件就会触发（图\
  \ 13.2）。\n\n![Image](img/jquery-13-2.jpg)\n\n图 13.2。网页可以根据设备的方向垂直显示或水平显示。\n\n在旋转过程中，可以通过访问\
  \ `orientationchange` 事件中的 `orientation` 属性来确定设备的方向。该属性返回一个只读值：`portrait`（竖屏）或 `landscape`（横屏）。要挂钩\
  \ `orientationchange` 事件，必须将 `body` 绑定到该事件：\n\n点击此处查看代码图片\n\n```javascript\n$(document).ready(function(){\n\
  \    $('body').bind('orientationchange', function(event) {\n        console.log('orientationchange:\
  \ '+ event.orientation);\n    });\n});\n```\n\n当然，在文档就绪后绑定该事件也是重要的，这样 `body` 才是可访问的，否则你将得到不一致的结果。你还可以通过\
  \ jQuery 的 `trigger` 方法在文档就绪后手动触发 `orientationchange` 事件，从而更进一步：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(document).ready(function(){\n    $('body').bind('orientationchange',\
  \ function(event) {\n        console.log('orientationchange: '+ event.orientation);\n\
  \    });\n    $('body').trigger('orientationchange');\n});\n```\n\n在文档就绪后手动触发该事件，使得在页面首次加载时自动确定方向成为可能，而在其他情况下这是不会发生的。方向值还会被添加到网页内的\
  \ `html` 元素中，因此可以通过 CSS 访问。这提供了一种通过 jQuery Mobile 和 CSS 通过所谓的“响应式设计”来响应设备方向的方法。\n\
  \n***\n\n### 响应式设计 (Responsive Design)\n\n随着如今市场上可用设备的激增，设计在所有不同格式下都能正常显示的网站变得越来越重要。响应式设计正如其名：根据设备格式显示内容。这包括设备尺寸、设备方向，甚至你的网站对桌面机器上浏览器窗口缩放的反应方式。实现响应式设计的常用方法是通过\
  \ CSS 媒体查询或简单地提供一个备用网站。jQuery Mobile 提供了一个自动响应的解决方案。\n\n换句话说，在任何给定时刻知道设备的方向有助于决定如何渲染内容的布局。有了这种能力，就没有必要为处理不同的设备而准备多个网站了。\n\
  \n### 滚动事件 (Scroll Events)\n\njQuery Mobile 提供了两个在用户滚动网页时触发的滚动事件：`scrollstart` 和\
  \ `scrollstop`。当页面滚动开始时，触发 `scrollstart` 事件。与 `orientationchange` 事件一样，`scrollstart`\
  \ 事件必须在文档就绪后绑定到 `body` 元素上：\n\n点击此处查看代码图片\n\n```javascript\n$(document).ready(function(){\n\
  \    $('body').bind('scrollstart', function(event) {\n        console.log(\"scrollstart\"\
  );\n    });\n});\n```\n\n当页面滚动停止时，触发 `scrollstop` 事件。将 `scrollstop` 事件绑定到 `body`\
  \ 元素的方法与绑定 `scrollstart` 事件的方法相同：\n\n点击此处查看代码图片\n\n```javascript\n$(document).ready(function(){\n\
  \    $('body').bind('scrollstart', function(event) {\n        console.log(\"scrollstart\"\
  );\n    });\n    $('body').bind('scrollstop', function(event) {\n        console.log(\"\
  scrollstop\");\n    });\n});\n```\n\n滚动事件可以结合使用以运行自定义 JavaScript。例如，它们可以用于创建懒加载效果，这种功能可以在图像在滚动过程中在页面下方逐渐显现时按需加载它们：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(document).ready(function() {\n    var _scrollInterval;\n\
  \    $(document).bind({\n        scrollstart: function() {\n            _scrollInterval\
  \ = setInterval(\"onScroll()\", 50);\n        },\n        scrollstop: function()\
  \ {\n            clearInterval(_scrollInterval);\n        }\n    });\n});\n\nfunction\
  \ onScroll() {\n    lazyLoad();\n}\n\nfunction lazyLoad() {\n    $('img').each(function()\
  \ {\n        var viewablePosition = $(window).scrollTop() + $(window).height();\n\
  \        var viewableImage = $(this).top();\n        if ($(this).hasClass('lazy-img')\
  \ && viewablePosition > viewableImage) {\n            $(this).attr('src', 'assets/img/trademark.png');\n\
  \            $(this).css('display', 'block');\n        }\n    });\n}\n```\n\n###\
  \ 页面过渡事件 (Page Transition Events)\n\n想象一下，在页面过渡发生之前就知道它将要发生。此外，预先知道页面何时隐藏。通过页面过渡事件，这是可能的。jQuery\
  \ Mobile 页面动画由页面过渡驱动。页面之间切换期间使用的动画在之前的章节中已经定义，但也与过渡的每一步都相关事件。事件会在每个页面过渡之前之后发生，并可以在此过程的任何时间执行自定义代码。如图\
  \ 13.3 所示，有四个事件与页面过渡相关，并且按顺序发生。\n\n![Image](img/jquery-13-3.jpg)\n\n图 13.3 与 jQuery\
  \ Mobile 页面过渡相关的事件。\n\n前两个事件在页面过渡开始时发生在当前视图页面上，最后两个事件发生在进入视图的页面上。\n\n使用 jQuery 的\
  \ `on` 方法可以轻松为这些事件绑定事件处理器。你可以为每个事件的单个元素附加事件处理器。在以下示例中，`on` 方法被绑定到 `div#my-page`，允许为每个页面过渡事件创建自定义事件处理器。具有\
  \ `my-page` id 的 `div` 被用作 HTML 文档中的页面容器，因此在过渡的任何步骤，这些事件都会触发向控制台写入内容的自定义脚本：\n\n\
  点击此处查看代码图片\n\n```javascript\n$(document).ready(function() {\n    $('div#my-page').on({\n\
  \        pagebeforeshow: function(event, ui) {\n            console.log('This page\
  \ is about to be shown: '+ ui.prevPage);\n        }\n    });\n});\n```\n\n\n\n\n\
  \n```javascript\npageshow: function(event, ui) {\n    console.log('This page was\
  \ just hidden: '+ ui.prevPage);\n},\npagebeforehide: function(event, ui) {\n   \
  \ console.log('This page is about to be hidden: '+ ui.nextPage);\n},\npagehide:\
  \ function(event, ui) {\n    console.log('This page was just shown: '+ ui.nextPage);\n\
    }\n�});\n});\n```\n\n如你所见，每个事件都有 `event` 和 `ui` 参数。`event` 参数是事件本身，而 `ui` 参数是一个数据对象，包含一个代表页面的属性。每个事件的\
  \ `ui` 对象都有不同的关联 `page` 属性：\n\n*   `pagebeforeshow` 事件在它的 `ui` 数据对象中包含 `prevPage`\
  \ 属性。该属性代表即将显示的页面。\n*   `pagebeforehide` 事件在它的 `ui` 数据对象中包含 `nextPage` 属性。该属性代表正在切换到的页面。\n\
  *   `pageshow` 事件在它的 `ui` 数据对象中包含 `prevPage` 属性。该属性代表正在离开的页面。\n*   `pagehide` 事件在它的\
  \ `ui` 数据对象中包含 `nextPage` 属性。该属性代表正在切换到的页面。\n\njQuery Mobile 文档使用 `live` 方法来附加页面过渡事件的处理器；然而，该方法在\
  \ jQuery 1.7 中已被弃用，对于使用旧版本 jQuery 的网站，现在推荐 `delegate` 方法。设置 `delegate` 方法与使用 `on`\
  \ 方法类似：\n\n点击此处查看代码图片\n\n```javascript\n$(document).ready(function() {\n    $(document).delegate('div#my-page',\
  \ {\n        pagebeforeshow: function(event, ui) {\n            console.log('This\
  \ page is about to be shown: '+ ui.prevPage);\n        },\n        pageshow: function(event,\
  \ ui) {\n            console.log('This page was just hidden: '+ ui.prevPage);\n\
  \        },\n        pagebeforehide: function(event, ui) {\n            console.log('This\
  \ page is about to be hidden: '+ ui.nextPage);\n        },\n        pagehide: function(event,\
  \ ui) {\n            console.log('This page was just shown: '+ ui.nextPage);\n \
  \       }\n    });\n});\n```\n\n能够钩入页面过渡事件可以带给你大量的控制权。你可以在页面过渡过程中的任何步骤中触发自定义代码。在页面显示之前知道哪个页面将显示，可以让你访问该页面的\
  \ HTML 结构，这对于丢弃不需要的标记、向页面中注入额外的标记等非常有用。这对于即将隐藏的页面也是如此：这些事件可以用于显示对话框或弹出窗口、将 JavaScript\
  \ 属性从一个页面传递到另一个页面等。以下脚本展示了使用这些事件将 JavaScript 属性从一个页面传递到页面的示例：\n\n点击此处查看代码图片\n\n\
  ```javascript\n$(document).ready(function() {\n    $('div#my-page').on({\n     \
  \   pagebeforeshow: function(event, ui) {\n            console.log('This page is\
  \ about to be shown: '+ ui.prevPage);\n            thePreviousPage = ui.prevPage;\n\
  \        },\n        pageshow: function(event, ui) {\n            console.log('This\
  \ page was just hidden: '+ ui.prevPage);\n        },\n        pagebeforehide: function(event,\
  \ ui) {\n            console.log('This page is about to be hidden: '+ ui.nextPage);\n\
  \            console.log('thePreviousPage: '+ thePreviousPage);\n        },\n  \
  \      pagehide: function(event, ui) {\n            console.log('This page was just\
  \ shown: '+ ui.nextPage);\n            console.log('thethePage: +\nPrevious););\n\
  \n```\n\n如你所见，这种功能可能非常强大，但实现非常实现。页面过渡事件允许你在 jQuery Mobile 生命周期期间的任何时间点利用页面数据。\n\n\
  ### 页面初始化与自定义组件\n\njQuery Mobile 框架增强了 HTML 标记。这种标记增强发生在页面初始化时。页面初始化有三个步骤；它们按照 图\
  \ 13.4 中定义的顺序发生。\n\n![Image](img/jquery-13-4.jpg)\n\n图 13.4. jQuery Mobile 页面初始化的三个步骤。\n\
  \n`pagecreatebefore` 事件在页面插入到 DOM 时发生，在 jQuery Mobile 初始化插件并增强网页之前发生。`pagecreatebefore`\
  \ 事件提供了一个在 jQuery Mobile 接管并进行增强之前向网页中添加标记的绝佳机会：\n\n点击此处查看代码图片\n\n```javascript\n\
  $('div#my-page').on('pagecreate', function(event) {\n    console.log('This page\
  \ is about to be created');\n    $('div#my-page').attr('data-title', 'My Page');\n\
  });\n```\n\n在上面的示例中，在 jQuery Mobile 框架增强标记之前，为 `div#my-page` 添加了 `data-title`，因此\
  \ `data-title` 在增强期间被使用。\n\n`pagecreate` 事件在 `pagecreatebefore` 事件之后发生，因此在页面创建于\
  \ DOM 之后。然而，此事件发生在 jQuery Mobile 框架增强 HTML 标记之前。`pagecreate` 事件是创建自定义组件的完美位置。以下脚本创建一个名为\
  \ `logo` 的组件，它具有 `image`、`width` 和 `height` 选项：\n\n点击此处查看代码图片\n\n```javascript\n\
  (function($){\n    $.widget(\"mobile.logo\", $.mobile.widget, {\n        // HTML\
  \ 标记可以使用属性（包含默认值）\n        options: {\n            image: '',\n            width:\
  \ 200,\n            height: 200\n        },\n        // 此方法由 jQuery Mobile 调用以初始化方法\n\
  \        _create: function() {\n            console.log(\"Widget has been created\"\
  );\n            $(document).trigger(\"logocreate\");\n            var logoEl = this.element;\n\
  \            logoEl.css('background', 'url('+logoEl.attr('data-image')+')');\n \
  \           logoEl.width(logoEl.attr('data-width'));\n            logoEl.height(logoEl.attr('data-height'));\n\
  \        }\n    });\n    // pagecreate 事件用于初始化实例\n    $(document).bind(\"pagecreate\"\
  , function(e) {\n        $(document).trigger(\"logobreate\");\n        return $(\"\
  jqmData(role='logo')\", e.target).logo();\n    });\n})(jQuery);\n```\n\n当 `logo`\
  \ 组件的标记包含在 HTML 文档中，jQuery Mobile 框架根据 `_create` 方法中的脚本进行增强。以下标记显示了如何在 jQuery Mobile\
  \ 网页中包含此组件：\n\n点击此处查看代码图片\n\n```html\n<div data-role=\"logo\" data-image=\"assets/img/trademark-jquerymobile.png\"\
  \ data-width=\"200\" data-height=\"30\"></div>\n```\n\n框架还包含了 `pageinit` 方法，页面初始化过程的最后一步。此事件在页面被框架增强后触发，包含了所有现有和自定义组件的增强：\n\
  \n```javascript\n$('div#my-page').on('pageinit', function(event) {\n    console.log('This\
  \ page was just enhanced');\n});\n```\n\n## 总结\n\n\n\n\n\n钩入 jQuery Mobile 事件会开启一个机会世界。当你理解了如何钩入\
  \ jQuery Mobile 事件时，你可以创建你想象的任何任何自定义功能。从触摸事件到设备方向再到页面更改和过渡，所有事件都源自用户。了解何时以及如何对这些事件做出反应是无价的。\n\
  \n## 14. 使用暴露的方法\n\njQuery Mobile 框架包含了许多在 `$.mobile` 对象上暴露的方法和属性。暴露一个方法意味着允许第三方对其进行访问。换句话说，jQuery\
  \ Mobile 为第三方开发者提供了对在其整个框架中使用的某些内部方法的的访问权限。这些方法和属性让你能够利用一些 jQuery Mobile 的核心功能来创建让你的移动应用程序脱颖而出的定制功能。本章涵盖了切换页面、预加载页面以及许多实用方法和属性。\n\
  \n### 程序化切换页面\n\n程序化切换页面意味着你可以使用代码在有或无用户交互的情况下引导浏览器跳转到另一个页面。jQuery Mobile 框架中暴露的方法之一是\
  \ `changePage`，它通过提供程序化切换页的方式，为标准链接和表单提交添加了功能。在基础 JavaScript 中，该方法的等效实现是 `document.location`，它有时用于实现程序化的页面切换。除了基本的页面切换外，通过框架的\
  \ API 程序化切换页面时，典型的 jQuery Mobile 视觉效果（如页面加载和页面过渡）也可用。`changePage` 方法在内容动态添加到页面时非常有用。让我们为第\
  \ 13 章创建的“钩入事件”`logo` 组件添加一个 `click` 事件，这样你就可以使用 `changePage` 程序化切换页面了：\n\n点击此处代码图片\n\
  \n```javascript\n(function($){\n    $.widget(\"mobile.logo\", $.mobile.widget, {\n\
  \        options: {\n            image: '',\n            width: 0,\n           \
  \ height: 0,\n            hyperlink: '#'\n        },\n        _create: function()\
  \ {\n            $(document).trigger(\"logocreate\");\n            var logoEl =\
  \ this.element;\n            logoEl.css('background', 'url('+this.options.image+')');\n\
  \            logoEl.width(this.options.width);\n            logoEl.height(this.options.height);\n\
  \            // 此方法将通过 jQuery Mobile API 触发页面切换\n            logoEl.click(function()\
  \ {\n                console.log(\"Widget has been clicked: \"+ $(this).attr('data-hyperlink'));\n\
  \                $.mobile.changePage($(this).attr('data-hyperlink'));\n        \
  \    });\n        }\n    });\n    $(document).bind(\"pagecreate\", function(e) {\n\
  \        $(document).trigger(\"logobeforecreate\");\n        return $(\":jqmData(role='logo')\"\
  , e.target).logo();\n    });\n})(jQuery);\n```\n\n有了 `changePage` 方法，组件可以在用户选择它时切换页面。在例示例中，预期的链接是一个\
  \ HTML 属性，因为组件有一个支持此选项的额外属性。通过此选项，组件的每个实例都可以在 `data-hyperlink` 属性中包含自己的自定义链接：\n\n\
  点击此处代码图片\n\n```html\n<div data-role=\"logo\" data-image=\"assets/img/trademark-jquerymobiletv.png\"\
  \ data-width=\"200\" data-height=\"30\" data-hyperlink=\"http://www.jquery.tv\"\
  ></div>\n```\n\n虽然这可能不是最实用的示例，但它向你展示了创建一个自定义组件来处理任何功能。`changePage` 方法至少一个名为 `to`\
  \ 的参数，用于指定请求期间要切换的页面。`to` 参数的值可以是一个字符串（如本例所示），也可以是一个 jQuery 对象。`changePage` 还有其他用于自定义请求的可选参数。表\
  \ 14.1. `changePage` 属性。\n\n在 `options` 参数中添加属性非常简单，只需使用 JavaScript 对象 (JSON) 创建一个逗号分隔的属性列表并设置特定值即可。JSON\
  \ 是一种轻量级数据格式，可用于系统或数据库之间交换数据。jQuery 在整个库中使用 JSON 来传递数据和设置值。这些可选参数可以提供复杂的功能。例如，你可以设置请求类型来提交值：\n\
  \n点击此处代码图片\n\n```javascript\n$(document).ready(function() {\n    $('#next-btn').click(function()\
  \ {\n        $.mobile.changePage(\"step2.php\", {\n            type: \"post\",\n\
  \            data: $(\"form#my-form\").serialize()\n        });\n    });\n});\n\
  ```\n\n这在多步骤过程中可能很有帮助，其中表单值从一个页面传递到另一个页面。以下示例包含一个带有电子邮件地址输入字段的表单。该表单没有提交按钮，而是包含一个\
  \ `id` 为 `next-btn` 的锚点元素，点击它时，会触发上一个示例中的 `changePage` 方法：\n\n点击此处代码图片\n\n```html\n\
  <!DOCTYPE HTML>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n    <title>changePage</title>\n    <!-- 省略部分内容以保持结构 -->\n\
  </head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"header\"\
  ><h1>Page Header</h1></div>\n        <div data-role=\"content\">\n            <form\
  \ action=\"\" id=\"my-form\">\n                <label for=\"emailAddress\">Email\
  \ Address</label>\n                <input type=\"text\" name=\"emailAddress\" id=\"\
  emailAddress\">\n            </form>\n            <a href=\"#\" id=\"next-btn\"\
  >Next</a>\n        </div>\n        <div data-role=\"footer\">Copyright</div>\n \
  \   </div>\n</body>\n</html>\n```\n\n`changePage` 方法设置为切换到名为 `step2.php` 的页面，其中\
  \ `type` 属性设置为 post 请求，`data` 属性设置为表单序列数据。表单包含一个名为 `emailAddress` 的输入框；当页面切换时，`emailAddress`\
  \ 输入的值会被发送到 `step2.php`：\n\n点击此处代码图片\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
  \    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n \
  \   <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n \
  \   <title>changePage Form: Step2 - jQuery Mobile: Design and Develop</title>\n\
  </head>\n<body>\n    <div data-role=\"page\">\n        <div data-role=\"header\"\
  ><h1>Page Header</h1></div>\n        <div data-role=\"content\">\n            <form\
  \ action=\"\">\n                <label for=\"firstName\">First Name</label>\n  \
  \              <input type=\"text\" name=\"firstName\" id=\"firstName\">\n     \
  \           <label for=\"lastName\">Last Name</label>\n                <input type=\"\
  text\" name=\"lastName\" id=\"lastName\">\n                <label for=\"emailAddress\"\
  >Email Address</label>\n                <input type=\"text\" name=\"emailAddress\"\
  \ id=\"emailAddress\" value=\"<?php echo $_POST['emailAddress']; ?>\">\n       \
  \         <input type=\"submit\" value=\"Sign me up\">\n            </form>\n  \
  \      </div>\n        <div data-role=\"footer\">Copyright</div>\n    </div>\n</body>\n\
  </html>\n```\n\n\n\n\n`step2.php` 页面包含了额外的表单输入字段，以便在用户正式提交表单之前获取其更多信息。这个示例可以用于新闻邮件的订阅表单，例如先收集电子邮件地址，然后在实际提交表单之前询问姓和名。`emailAddress`\
  \ 通过 PHP 的 `$_POST` 数组从上一个页面传递并写入相应的字段中。\n\n`changePage` 方法是一种强大的手段，不仅可以处理页面切换，还可以处理表单提交。它允许你以许多有趣且独特的方式自定义页面切换。\n\
  \n### 静默加载页面\n\n另一个强大的 `$.mobile` 对象方法是 `loadPage`。你可以使用 `loadPage` 方法加载外部页面而不显示它们。这是预加载页面的一种有用方法，可以让页面在用户点击链接时显示得更快。要使用此方法，你需要编写与我们\
  \ `changePage` 方法相似的代码。首先，你必须等待文档就绪或页面创建。然后，当其中任何一个事件触发时，你就可以调用 `loadPage` 事件来预加载一个或多个页面：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(document).ready(function() {\n    $.mobile.loadPage(\"\
  page2.html\");\n});\n```\n\n这种方法极其易用并具有巨大的处。接的示例嵌入了一个包含 `loadPage` 代码的 JavaScript\
  \ 文件：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE HTML>\n<html\n<head>\n    <meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1\">\n    <title>loadPage- jQuery\
  \ Mobile: Design and Develop</title>\n    <link rel=\"stylesheet\" href=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
  \ />\n    <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
  ></script>\n    <script src=\"http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.js\"\
  ></script>\n    <script src=\"assets/js/custom-jqm-loadpage.js\"></script>\n</head>\n\
  <body>\n    <div data-role=\"page\">\n        <div data-role=\"header\"><h1>Page\
  \ Header</h1></div>\n        <div data-role=\"content\">\n            <a href=\"\
  page2.html\">Link to another page</a>\n        </>\n        <div data-role=\"footer\"\
  >Copyright</div>\n    </div>\n</body>\n</html>\n```\n\n页面一一加载完成且文档就绪，`page2.html`\
  \ 文件就会在点击任何链接之前在后台静默加载。当用户点击链接到 `page2.html` 页面的锚点元素时，该文件会立即显示。**图 14.1** 显示了通过\
  \ `loadPage` 方法加载页面后的标记示例。你可以看到，页面已经加载并插入到当前页面的底部。\n\n![Image](img/jquery-14-1.jpg)\n\
