    # 第 9 章


    ## AJAX 和 API 简介


    在本章中，我们将在 Web 开发背景下探索 AJAX（异步 JavaScript 和 XML）和 API（应用程序编程接口）。AJAX 允许我们向服务器发送异步请求、检索数据，并在无需刷新整个网页的情况下动态更新网页的部分内容。我们将涵盖
    AJAX 的基础知识、使用 JavaScript 发送 HTTP 请求、从 API 获取数据以及处理 JSON 数据。在本章结束时，你将对如何将外部数据集成到你的
    Web 应用程序中并创建动态用户体验有坚固的理解。


    ### 深入理解 AJAX 及其在异步通信中的作用


    AJAX 是一组 Web 开发技术，允许我们在不干扰当前页面的情况下异步从服务器发送和接收数据。通过 AJAX，我们可以在不重新加载整个网页的情况下更新网页的特定部分，提供更流畅、响应更快的用户体验。AJAX
    广泛用于表单提交、实时数据更新和动态内容加载等任务。


    AJAX 的核心是 `XMLHttpRequest` 对象，它允许我们从 JavaScript 发起 HTTP 请求。通过使用 `XMLHttpRequest`
    对象，我们可以与服务器异步通信、发送数据并接收响应。


    ### 使用 JavaScript 发送 HTTP 请求


    要使用 JavaScript 发送 HTTP 请求，我们利用 `XMLHttpRequest` 对象。


    这是一个演示如何向服务器发送 GET 请求并处理响应的示例：


    ![Image](img/image58.png)


    在这个示例中，我们创建了一个新的 `XMLHttpRequest` 对象，并对 URL `"https://api.example.com/data"` 打开了一个
    GET 请求。我们设置了 `onreadystatechange` 事件处理程序，以便在请求状态改变时执行函数。当 `readyState` 为 `XMLHttpRequest.DONE`
    (4) 时，我们检查 `status` 以确保请求执行成功（状态码 200）。如果成功，我们可以使用 `xhr.responseText` 访问响应数据。


    ### 从 API 获取数据并显示在网页上


    API 提供了一种结构化方法来从外部源检索数据并将其集成到我们的 Web 应用程序中。许多流行的网站和服务提供 API，允许开发者以程序方式访问它们的数据和功能。


    这是一个从 API 获取数据并将其显示在网页上的示例：


    ![Image](img/image59.png)


    在这个示例中，我们向 API 端点发送 GET 请求，该端点返回包含用户数据的 JSON 响应。我们使用 `JSON.parse()` 解析 JSON 响应，将其转换为我们可以处理的
    JavaScript 对象。然后，我们可以处理数据并根据需要将其显示在网页上。


    ### 处理 JSON 数据


    JSON（JavaScript 对象表示）是一种轻量级的数据交换格式，广泛用于服务器和 Web 应用程序之间的数据传输。它易于人类读写，并可以被 JavaScript
    轻松解析和生成。


    在与 API 工作时，在响应中接收 JSON 数据是常见的。JSON 数据由键值对组成，可以表示为 JavaScript 对象。


    这是一个处理从 API 获取的 JSON 数据的示例：


    ![Image](img/image60.png)


    在这个示例中，我们使用 `JSON.parse()` 解析 JSON 响应将其转换为 JavaScript 对象。然后，我们可以根据 JSON 的结构使用点表示法或括号表示法访问数据。在这种情况下，我们遍历了一个用户对象数组，并将每个用户的名称打印到控制台。


    ### 练习题


    1. 创建一个简单的天气应用程序，从天气 API 获取天气数据。在网页上显示温度、天气状况和位置。

    2. 构建一个新闻流应用程序，从新闻 API 获取最新的新闻文章。在网页上显示标题、文章摘要和发布日期。

    3. 开发一个货币转换器，从货币 API 获取最新的汇率。允许用户输入一种货币的金额，并显示转换成另一种货币的额后金额。

    4. 创建一个电影搜索应用程序，从电影数据库 API 获取电影数据。允许用户通过标题搜索电影，并在网页上显示电影详情，如标题、发行年份和剧情。


    # 第 10 章


    ## 错误处理与调试简介


    在本章中，我们将深入探讨 JavaScript 中错误处理和调试的主题。作为开发者，遇到错误是常见现象，因此对如何有效地识别、诊断和处理错误有全面的理解至关重要。我们将探索用于错误处理和调试的各种技术和工具，包括理解常见的
    JavaScript 错误、利用浏览器开发人员工具、实现 `try...catch` 语句以及编写整洁可维护的代码。在本章结束时，你将在错误处理和调试方面拥有坚实的基础，使你能够构建稳健可靠的
    JavaScript 应用程序。


    ### 识别和理解常见的 JavaScript 错误


    要精通错误处理，识别并理解开发过程中可能遇到的常见 JavaScript 错误至关重要。让我们深入探讨一些最常见的错误及其产生：


    1. **语法错误 (Syntax Errors)**：当代码语法出现错误时会发生语法错误，导致代码无法正常执行。这些错误通常由于缺少或位置错误的字符、关键字使用不当或无效声明。


    *例如：*


    ![Image](img/image61.png)


    在这个示例中，发生语法错误是因为 `console.log()` 语句中缺少右括号。


    2. **引用错误 (Reference Errors)**：当你尝试访问不存在或超出范围的变量或函数时，会发生引用错误。这些错误通常发生在你拼错变量名、在声明之前访问变量或尝试访问超出作用域的变量时。


    *例如：*


    ![Image](img/image62.png)


    在这个示例中，如果变量 `message` 在访问之前未定义就会发生引用错误。


    3. **类型错误 (Type Errors)**：当你对不类型的值执行操作时，会发生类型错误。这些错误通常发生在你尝试使用不适用于值类型的方法或属性时。


    *例如：*


    ![Image](img/image63.png)


    在这个示例中，发生类型错误是因为 `toUpperCase()` 方法只能用于字符串，不能用于数字。


    ### 使用浏览器开发人员工具进行调试


    现代网络浏览器提供了强大的开发人员工具，为调试 JavaScript 代码提供了卓越的功能。这些工具允许你检查和操作网页的 HTML、CSS 和 JavaScript，从而更容易识别和解决错误。让我们探索浏览器开发人员工具的一些基本功能：


    1. **控制台 (Console)**：控制台是记录消息、检查变量和调试代码的有用工具。你可以使用各种方法，如 `console.log()`、`console.error()`
    和 `console.warn()` 向控制台输出消息和数据。


    *例如：*


    ![Image](img/image64.png)


    该语句向控制台输出“Hello, world!” 消息，帮助你验证特定代码段是否按预期执行。


