    3. **submit 事件**：当表单被提交（通过点击提交按钮或按回车键）时会触发 `submit` 事件。它对于在向服务器提交数据或触发后续操作之前执行表单验证很有用。


    例如：


    ![Image](img/image57.png)


    在这个示例中，我们为表单元素绑定了 `submit` 事件监听器。当表单提交时，会执行指定的函数。我们使用 `event.preventDefault()`
    阻止默认的表单提交，以便进行自定义表单验证和后续操作。


