    # CHAPTER 4


    ## LOOPS AND ITERATION


    In this chapter, we will explore the concept of loops and iteration in JavaScript.
    Loops allow us to repeat a block of code multiple times, making them essential
    for automating tasks and processing collections of data. We will cover `while`
    loops, `for` loops, loop control statements like `break` and `continue`, and iterating
    over arrays and objects. By the end of this chapter, you will have a solid understanding
    of how to use loops.


    ### USING WHILE LOOPS FOR REPETITIVE TASKS


    The `while` loop is a fundamental loop construct in JavaScript that repeatedly
