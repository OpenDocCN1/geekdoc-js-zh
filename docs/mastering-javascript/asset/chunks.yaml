    *   Loop: A control structure that repeats a block of code until a condition is
    met.


    *   DOM (Document Object Model): A programming interface that represents the HTML
    structure of a web page and allows manipulation of its elements.


    *   Event: An action or occurrence that happens in the browser, such as a button
