    ### USING COMPARISON AND LOGICAL OPERATORS


    Comparison operators are used to compare values and return a boolean result. They
    include:


    * Equal to (`==`)

    * Not equal to (`!=`)

    * Greater than (`>`)

    * Less than (`<`)

    * Greater than or equal to (`>=`)

    * Less than or equal to (`<=`)


    Logical operators allow us to combine multiple conditions and evaluate the result.
    The commonly used logical operators in JavaScript are:


    * Logical AND (`&&`): Returns true if both conditions are true.

    * Logical OR (`||`): Returns true if at least one of the conditions is true.

    * Logical NOT (`! `): Inverts the boolean value.


