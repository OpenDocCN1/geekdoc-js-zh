    # CHAPTER 2


    ## VARIABLES AND DATA TYPES


    In this chapter, we will dive deep into the concepts of variables and data types
    in JavaScript. These concepts form the foundation of any programming language
    and are crucial for understanding how to store and manipulate data effectively.
    By the end of this chapter, you will have a solid understanding of how to declare
    variables, work with different data types, handle type conversion and coercion,
    and perform basic arithmetic operations.


    ### DECLARING VARIABLES AND ASSIGNING VALUES


    In JavaScript, variables are used to store and manipulate data. They act as containers
    that hold values. Before we can use a variable, we need to declare it using the
    `var`, `let`, or `const` keyword. Each keyword has its own scope and rules for
    reassignment and redeclaration.


    1. **var**: The `var` keyword was traditionally used in JavaScript for variable
    declaration. It has function scope or global scope, meaning it is accessible throughout
    the entire function or program. It can be redeclared and reassigned within its
    scope.

    2. **let**: Introduced in ECMAScript 6 (ES6), the `let` keyword provides block
    scope, which means the variable is only accessible within the block of code it
    is declared in. It can be reassigned within its scope but cannot be redeclared
    in the same scope.

    3. **const**: Also introduced in ES6, the `const` keyword creates variables that
    are block-scoped and cannot be reassigned or redeclared once a value is assigned
    to them. It is used for values that are intended to remain constant throughout
    the program.


    When declaring variables, it is good practice to use descriptive names that reflect
    the purpose of the variable.


    Here''s an example:


    ![Image](images/image2.png)


    In the example above, we declared three variables: `age`, `firstName`, and `isEmployed`.
    We assigned the number `25` to `age`, the string `"John"` to `firstName`, and
    the boolean value `true` to `isEmployed`.


    ### WORKING WITH DIFFERENT DATA TYPES


    JavaScript supports several data types, each serving a specific purpose. Understanding
    and working with different data types is crucial for developing robust JavaScript
    programs.


    Let''s explore three commonly used data types:


    1. **Strings**: Strings represent sequences of characters and are used to store
    textual data. They are enclosed in single quotes (`''''`) or double quotes (`""`).


    Here''s an example:


    ![Image](images/image3.png)


    In the example above, we declared two variables, `name` and `message`, and assigned
    them string values.


    1. **Numbers**: Numbers represent numeric data and can be integers or floating-point
    numbers. They are used for calculations, comparisons, and various other mathematical
    operations.


    Here''s an example:


    ![Image](images/image4.png)


    In the example above, we declared two variables, `quantity` and `price`, and assigned
    them numeric values.


    1. **Booleans**: Booleans represent logical values and can be either `true` or
    `false`. They are commonly used for making decisions and controlling program flow.


    Here''s an example:


    ![Image](images/image5.png)


    In the example above, we declared two variables, `isLogged` and `isEmailVerified`,
    and assigned them boolean values.


    ### TYPE CONVERSION AND COERCION


    JavaScript provides features for type conversion and coercion, allowing you to
    convert data from one type to another or automatically coerce values during operations.


    Let''s explore these concepts further:


    1. **Type Conversion**: Type conversion is the process of converting a value from
    one data type to another explicitly. JavaScript provides functions and methods
    to facilitate type conversion.


    Here''s an example:


    ![Image](images/image6.png)


    In the example above, we converted the string values of `quantity` and `price`
    to numbers using the `Number()` and `parseFloat()` functions, respectively.


    2. **Type Coercion**: Type coercion, also known as implicit type conversion, is
    the automatic conversion of values from one type to another during certain operations.
    JavaScript performs type coercion in situations such as concatenating strings
    with other data types or performing arithmetic operations on different data types.

