    # 第 7 章


    ## 文档对象模型 (DOM) 操作


    在本章中，我们将深入研究文档对象模型（DOM）的复杂性以及它在 Web 开发中至关重要的作用。DOM 提供了一个强大的接口，允许我们使用 JavaScript
    动态地访问、操作和更新 HTML 文档的内容和结构。我们将涵盖广泛的主题，包括访问和修改 HTML 元素、处理事件和事件监听器、遍历 DOM、创建和删除元素以及优化
    DOM 操作。在本章结束时，你将深入理解如何使用 DOM 创建交互式和动态的网页。


    ### DOM 简介


    文档对象模型（DOM）是一种编程接口，它将 HTML 文档的结构表示为树形结构的对象。它充当 浏览器和 JavaScript 之间的接口，允许我们动态地交互和操作网页元素。DOM
    提供了方法和属性，使能够导航、修改和更新 HTML 文档的内容和结构。


    当网页加载时，浏览器会解析 HTML 标记并构建 DOM 树，其中每个元素、属性和文本节点都被表示为一个对象。这种树形结构允许我们使用 JavaScript
    程序化地访问和操作网页的元素。通过修改 DOM，我们可以动态地更新网页的内容、样式和行为，创建丰富且交互的用户体验。


    ### 使用 JavaScript 访问和修改 HTML 元素


    为了处理 DOM 中的 HTML 元素，我们需要使用 JavaScript 访问并操作它们。我们可以使用各种 DOM 方法，根据标签名、类名或唯一标识符（ID）来选择元素。以下是一些常用方法：


    - `document.getElementById("id")`：选择指定 ID 的元素。

    - `document.getElementsByClassName("class")`：选择具有指定类名的元素。

    - `document.getElementsByTagName("tag")`：选择具有指定标签名的元素。

    - `document.querySelector("selector")`：选择匹配指定 CSS 选择器的第一个元素。

    - `document.querySelectorAll("selector")`：选择所有匹配指定 CSS 选择器的元素。


    一旦我们选择了元素，就可以操作它的属性、特性和内容。


    以下是一些示例：


    ![Image](img/image45.png)


    在本示例中，我们选择了一个 ID 为 `myHeading` 的元素，并修改了它的文本内容和样式属性。


    ### 处理事件和事件监听器


    事件是浏览器中发生的动作或情况，例如按钮点击、鼠标移动或键盘输入。我们可以通过为元素附加事件监听器来响应这些事件。事件监听器是在特定事件发生时执行的函数。它们允许我们响应交互执行自定义操作。


    我们可以使用 `addEventListener()` 方法附加事件监听器。


    这是一个示例：


    ![Image](img/image46.png)


    在本示例中，我们为 ID 为 `myButton` 的按钮附加了点击事件监听器。当点击按钮时，就会执行指定的函数。


    在事件监听器函数中，我们可以访问事件对象，它包含了有关事件以及触发元素的信息。该对象允许我们根据事件类型、目标元素或其他相关数据来执行操作。


    ### 遍历 DOM


    遍历 DOM 涉及通过其结构来访问不同的元素或节点。我们可以在 DOM 树中向上、向下和横向移动，以访问父元素或兄弟元素。以下是一些常用的遍历方法：


    - `parentNode`：返回元素的父节点。

    - `childNodes`：返回元素的子节点集合。

    - `firstChild`：返回元素的第一个子节点。

    - `lastChild`：返回最后一个子节点。

    - `nextSibling`：返回元素的下一个兄弟节点。

    - `previousSibling`：返回元素的上一个兄弟节点。


    这是一个演示 DOM 遍历的示例：


    ![Image](img/image47.png)


    在本示例中，我们选择了 ID 为 `parent` 的父元素，并通过遍历 DOM 来访问其第一个子元素和下一个兄弟元素。


    ### 创建和删除元素


    使用 JavaScript 动态创建并向 DOM 添加新元素，或删除现有元素。这允许我们动态地更新网页的内容和结构。*这是一个示例：*


    ![Image](img/image48.png)


    在本示例中，我们创建了一个新的 `div` 元素，设置了它的文本内容，并将其作为子元素追加到 ID 为 `parent` 的父元素中。


    要从 DOM 中删除元素，我们可以使用 `remove()` 方法：


