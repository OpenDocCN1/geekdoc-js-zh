    赋值给 `firstName`，并将布尔值 `true` 赋值给 `isEmployed`。


    ### 使用不同的数据类型


    JavaScript 支持多种数据类型，每都有特定的用途。理解和处理不同的数据类型对于开发健壮的 JavaScript 程序至关重要。


    让我们探索三种常用的数据类型：


    1. **字符串 (Strings)**：字符串表示字符序列，用于存储文本数据。它们被单引号（`''''`）或双引号（`""`）包含。


    示例：


    ![Image](img/image3.png)


    在上面的示例中，我们声明了两个变量 `name` 和 `message` 并为它们赋值了字符串值。


    1. **数字 (Numbers)**：数字表示数值数据，可以是整数或浮点数。它们用于计算、比较以及各种其他数学运算。


    示例：


    ![Image](img/image4.png)


    在上面的示例中，我们声明了两个变量 `quantity` 和 `price` 并为它们赋值了数值值。


    1. **布尔值 (Booleans)**：布尔值表示逻辑值，可以是 `true` 或 `false`。它们通常用于决策和控制程序流。


    示例：


    ![Image](img/image5.png)


    在上面的示例中，我们声明了两个变量 `isLogged` 和 `isEmailVerified` 并为它们赋值了布尔值。


    ### 类型转换和强制转换


    JavaScript 提供了类型转换和强制转换的功能，允许你将数据从一种类型转换为另一种类型，或者在操作期间自动转换值。


    让我们进一步探索这些概念：


    1. **类型转换**：类型转换是显式将值从一种数据类型转换为另一种的过程。JavaScript 提供了函数和方法来方便类型转换。


