    *   AJAX (Asynchronous JavaScript and XML): A technique used to send and receive
    data from a server without refreshing the entire web page.


    *   JSON (JavaScript Object Notation): A lightweight data interchange format used
    for data storage and exchange between a server and a web application.


    *   API (Application Programming Interface): A set of rules and protocols that
    allow different software applications to communicate with each other.


    *   Error Handling: Techniques used to catch and handle errors that may occur
    during program execution.


    *   Scope: The accessibility and visibility of variables and functions within
    a codebase.


    *   Closure: A function that has access to its own scope, the scope in which it
