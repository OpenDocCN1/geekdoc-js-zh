    # CHAPTER 9


    ## INTRODUCTION TO AJAX AND APIS


    In this chapter, we will explore AJAX (Asynchronous JavaScript and XML) and APIs
    (Application Programming Interfaces) in the context of web development. AJAX allows
    us to make asynchronous requests to servers, retrieve data, and update parts of
    a webpage dynamically without requiring a full page refresh. We will cover the
    fundamentals of AJAX, making HTTP requests using JavaScript, retrieving data from
    APIs, and handling JSON data. By the end of this chapter, you will have a solid
    understanding of how to integrate external data into your web applications and
    create dynamic user experiences.


    ### UNDERSTANDING AJAX AND ITS ROLE IN ASYNCHRONOUS COMMUNICATION


    AJAX is a set of web development techniques that allow us to send and receive
    data from a server asynchronously without interfering with the current page. With
    AJAX, we can update specific sections of a webpage without reloading the entire
    page, providing a smoother and more responsive user experience. AJAX is widely
    used for tasks such as form submission, real-time data updates, and dynamic content
    loading.


    At the heart of AJAX is the `XMLHttpRequest` object, which enables us to make
    HTTP requests from JavaScript. By using the `XMLHttpRequest` object, we can communicate
    with a server, send data, and receive responses asynchronously.


    ### MAKING HTTP REQUESTS USING JAVASCRIPT


    To make an HTTP request using JavaScript, we utilize the `XMLHttpRequest` object.


    Here''s an example that demonstrates how to send a GET request to a server and
    handle the response:


    ![Image](images/image58.png)


    In this example, we create a new `XMLHttpRequest` object and open a GET request
    to the URL `"https://api.example.com/data"`. We set the `onreadystatechange` event
    handler to execute a function when the state of the request changes. When the
    `readyState` is `XMLHttpRequest.DONE` (4), we check the `status` to ensure that
    the request was successful (status code 200). If successful, we can access the
    response data using `xhr.responseText`.


    ### RETRIEVING DATA FROM APIS AND DISPLAYING IT ON A WEBPAGE


    APIs provide a structured way to retrieve data from external sources and integrate
    it into our web applications. Many popular websites and services offer APIs that
    allow developers to access their data and functionality programmatically.


    Here''s an example of retrieving data from an API and displaying it on a webpage:


    ![Image](images/image59.png)


    In this example, we make a GET request to an API endpoint that returns a JSON
    response containing user data. We parse the JSON response using `JSON.parse()`
    to convert it into a JavaScript object that we can work with. We can then process
    the data and display it on the webpage as desired.


    ### HANDLING JSON DATA


    JSON (JavaScript Object Notation) is a lightweight data interchange format that
    is widely used for transmitting data between a server and a web application. It
    is easy for humans to read and write and can be easily parsed and generated by
    JavaScript.


    When working with APIs, it is common to receive JSON data in the response. JSON
    data consists of key-value pairs and can be represented as JavaScript objects.


    Here''s an example of handling JSON data retrieved from an API:


    ![Image](images/image60.png)


    In this example, we parse the JSON response using `JSON.parse()` to convert it
    into a JavaScript object. We can then access the data using dot notation or bracket
    notation, depending on the structure of the JSON. In this case, we iterate over
    an array of user objects and log each user''s name to the console.


    ### EXERCISES


    1. Create a simple weather application that retrieves weather data from a weather
    API. Display the temperature, weather conditions, and location on a webpage.

    2. Build a news feed application that fetches the latest news articles from a
    news API. Display the headlines, article summaries, and publication dates on a
    webpage.

    3. Develop a currency converter that fetches the latest exchange rates from a
    currency API. Allow users to enter an amount in one currency and display the converted
    amount in another currency.

    4. Create a movie search application that retrieves movie data from a movie database
    API. Allow users to search for movies by title and display the movie details,
    such as the title, release year, and plot, on a webpage.


