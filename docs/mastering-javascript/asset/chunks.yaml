    In this chapter, we will explore the concept of functions in JavaScript. Functions
    are reusable blocks of code that perform specific tasks. They enhance the modularity
    and reusability of our programs. We will cover topics such as defining and calling
    functions, passing arguments and returning values, function scope, and utilizing
    built-in functions as well as creating custom functions. By the end of this chapter,
    you will have a solid understanding of how to work with functions in JavaScript.


    ### DEFINING AND CALLING FUNCTIONS


    A function in JavaScript is defined using the **function** keyword, followed by
    the function name, a pair of parentheses, and a block of code enclosed in curly
    braces.


    The basic syntax for defining a function is as follows:


    ![Image](images/image25.png)


    Let''s consider an example of a simple function that greets the user:


    ![Image](images/image26.png)


    To execute or call a function, we simply write the function name followed by parentheses.


    For example:


    ![Image](images/image27.png)


    In this example, calling the **greet()** function executes the code inside the
    function''s block, which displays the greeting message.


    ### PASSING ARGUMENTS AND RETURNING VALUES


    Functions can also accept parameters or arguments, which are values passed into
    the function to perform specific tasks. Parameters are defined inside the parentheses
    of the function declaration. We can use these parameters within the function to
    manipulate data or perform calculations. Additionally, functions can return values
    using the **return** keyword.


    Let''s consider an example of a function that calculates the area of a rectangle
    based on its width and height:


    ![Image](images/image28.png)


    To call this function and retrieve the calculated area, we assign the returned
    value to a variable:


    ![Image](images/image29.png)


    In this example, the **calculateArea()** function accepts two arguments: **width**
    and **height**. It calculates the area by multiplying these two values and returns
    the result using the **return** statement.


    ### UNDERSTANDING FUNCTION SCOPE


    Function scope refers to the visibility and accessibility of variables within
    a function. Variables declared within a function are known as local variables
    and are only accessible within that function. On the other hand, variables declared
    outside of any function are known as global variables and can be accessed from
    anywhere in the program.


    Let''s consider an example that demonstrates function scope:


    ![Image](images/image.png)


    In this example, the **localVariable** is declared within the **myFunction()**
    function and can only be accessed from within that function. The **globalVariable**,
    declared outside of any function, is accessible both within the function and outside
    of it. Attempting to access the **localVariable** outside of the function will
    result in a reference error.


    ### UTILIZING BUILT-IN FUNCTIONS AND CREATING CUSTOM FUNCTIONS


    JavaScript provides a wide range of built-in functions that perform common tasks.
    These functions are readily available for use without the need for defining them.
    Examples of built-in functions include **console.log()**, **alert()**, **prompt()**,
    **parseInt()**, **parseFloat()**, and many more.


    *Let''s see an example that utilizes the* parseInt() *function to convert a string
    to an integer:*


    ![Image](images/image31.png)


    In this example, we use the **parseInt()** function to convert the string **"42"**
    to the integer **42**.


    In addition to built-in functions, we can also create custom functions tailored
    to our specific needs. Custom functions allow us to encapsulate blocks of code
    and execute them whenever necessary, promoting code reusability and maintainability.


    Let''s consider an example of a custom function that calculates the square of
    a number:


    ![Image](images/image32.png)


    In this example, the **square()** function accepts a **number** argument and returns
    the square of that number.


