    ### 优化 DOM 操作


    在处理 DOM 时，考虑性能因素至关重要。过度的 DOM 操作会影响页面的响应速度和用户体验。为了优化 DOM 操作，请考虑以下实践方法：


    - **减少对 DOM 的访问**：存储频繁访问元素的引用，以避免重复的 DOM 查询。

    - **使用高效的 DOM 操作方法**：在可能的情况下，使用 `document.createDocumentFragment()` 或 `element.appendChild()`
    等批量操作，以尽量地减少对 DOM 的更新次数。

    - **使用事件委托**：不要在单个元素上绑定事件监听器，而是考虑使用事件委托在更高级别处理事件，从而减少绑定到 DOM 的事件监听器数量。


    ### 练习题


    1. 创建一个包含用户姓名和邮箱输入字段的表单。实现一个 JavaScript 函数，在点击提交按钮时对表单进行验证。在无效字段旁边显示错误信息。

    2. 构建一个带有缩略图的相册。实现 JavaScript 功能，在点击缩略图时显示完整尺寸的图片。

    3. 开发一个下拉菜单，点击时可以展开和折叠选项。实现 JavaScript 逻辑来切换下拉选项的可见性。

