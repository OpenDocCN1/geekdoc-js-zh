  md: '# Introduction


    A few words about the book, “JavaScript”.


    It is necessary before you start your study of JavaScript to have a basic knowledge
    of HTML, the markup language by which web pages are made. If you lack this then
    you should learn some basic HTML before you start.


    This book contains essential information as you begin a study of JavaScript.


    Before you start this book ask yourself these questions:


    What do you know about the JavaScript computing language?


    Are you keen to use it?


    This book will tell you about starting JavaScript in a simple yet factual way
    that does not blind the reader with science.


    It will tell you about basic commands, comments, operations, strings, arrays and
    many other parts of this computer language.


    There are 6 chapters, which cover basic information, sequential programming, iterative
    programming, conditional programming, dynamic programming, and problems to try
    and further investigation. Each chapter will provide a stepping-stone to further
    exploration if so desired.'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'Before you begin you should have a text editor that automatically produces
    pages for a variety of computer languages. Microsoft Word is useless for this
    task. If you are a Windows user then get Notepad++. It is an amazing piece of
    software.


    If you, like me prefer Macs, then there are a number such as Brackets and Komodo.


    I knew of Linux but had no experience with it until I got a Raspberry Pi mini
