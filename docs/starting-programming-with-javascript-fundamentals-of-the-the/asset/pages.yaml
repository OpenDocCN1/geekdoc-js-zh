    It is worth noting that the alert box is a very powerful tool for locating errors
    in JavaScript code.


    One final point about alert() you can use '''' instead of " " . Just be consistent.
    You can''t have '' " or '' .


    Finally, it is so easy to use a capital A in alert() instead of a lower case a.
    If you do this your program won''t work. JavaScript is sensitive to lower and
    upper case. You will probably make this mistake again and again. Most programmers
    do.


    JavaScript is not the only case sensitive language. Take care!'
