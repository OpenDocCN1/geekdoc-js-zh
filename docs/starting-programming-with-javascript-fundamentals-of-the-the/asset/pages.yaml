    whole lot of rules called protocols. These are very important but unnecessary
    to know about if you are just starting in JavaScript.

    The Internet is a network of domestic, commercial, government etc. networks with
    services such as email, the transfer of files, SMS, and all the files of the World
    Wide Web (WWW).


    # Definition of a Web Server?


    A computer program which serves requested web pages is called a web server. A
    Web client is the program of a user which makes the request. browser is a client
    program requesting files from Web servers. Common browsers include Chrome, Firefox,
    and Safari.


    # Web Pages


    Files on the Internet with the .html suffix are called web pages. They are opened
    by browsers. Such files are the basis of the World Wide Web (WWW), probably the
    most important part of the Internet. The first appearance of HTML was in 1989.
    It was the invention of the English programmer and scientist Tim Berners-Lee who
    was employed by the European Laboratory for Particle Physics in Geneva, Switzerland.


    HTML has gone through a number of developments since then. At the moment we are
    in the fifth version called HTML 5. HTML will be used throughout this book as
    JavaScript was built for use with HTML.'
