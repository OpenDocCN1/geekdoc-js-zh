  md: '# Is It Possible To Put JavaScript on the Server?


    Yes, it is and is frequently done. If you do this then you get server-side JavaScript.
    This extends JavaScript so that it can access files and databases. Client-side
    JavaScript does not have this capability. This book will consider only the client-side
    version.


    # First task


    Type the following up using notepad or some other equivalent text editor such
    as notepad++ or a Mac editor as TextEdit. If you are fortunate enough to have
    Adobe Dreamweaver then use that however it is quite expensive and is not necessary
    for a basic course in JavaScript.


    ```

    <!DOCTYPE HTML>


    <HEAD>


    <TITLE> XYZ </TITLE>


    <script>

    alert("Hello World.");

    </script>


    </HEAD>


    <BODY>

    The dog sat on a log.

    ```'
