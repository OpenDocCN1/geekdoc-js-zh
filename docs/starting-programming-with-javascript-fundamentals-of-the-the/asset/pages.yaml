  md: '# Chapter 3: Iterative Programs


    In the last chapter, we gave you examples of sequential programming in JavaScript.
    In the process, we introduced the document.write command, the standard math operations
    in JavaScript, strings, variables, arrays and the printing of pictures.


    We will continue to refer to a standard HTML file called Txt.HTML.


    In this chapter, we are going to introduce you to writing comments as you program,
    a very important part of programming called iteration, more commonly known as
    loops, a concept called functions and JavaScript files with the suffix .js.


    We start with something very simple.


    Suppose you wanted to print the word ''Frog'' 6 times going down the page.


    ```

    <script>

    document.write("Frog"+\<br>");

    document.write("Frog"+\<br>");

    document.write("Frog"+\<br>");

    document.write("Frog"+\<br>");

    document.write("Frog"+\<br>");

    document.write("Frog"+\<br>");

    </script>

    ```'
