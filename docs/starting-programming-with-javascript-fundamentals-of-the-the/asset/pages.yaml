  md: '# JavaScript


    JavaScript is a high-level programming language. Most computer languages have
    the same program types although some languages are much better for some purposes
    than others.


    JavaScript is a perfect language of instruction for the teaching of programming.
    The reasons are that


    +   (i) It is not necessary to install JavaScript.

    (ii) It is ideal for courses in programming. Its possibilities vary from the most
    fundamental to really cutting edge.

    (iii)


    # Is It True That JavaScript and Java Are the Same?


    JavaScript and Java are totally different languages even though their names are
    alike. They are similar when simple programs are made however JavaScript is easier
    to use and understand. The learning of JavaScript is a great help in learning
    other more complicated languages such as C++, Java, and Python.


    # Is HTML The Same As JavaScript?


    No, they are not the same. They are quite different. HTML is what is known as
    a markup language for the creation of static web page content. JavaScript is a
    computer language which makes possible the creation of dynamic content for web
    pages. This can be confusing because it is possible to place JavaScript code in
    an HTML file, although you will learn this is not good practice.

    Despite that, we will initially put JavaScript code in HTML files as it is easier
    to learn the better practices later.'
  merge: -1
