  md: 'will do this.


    # Comments


    Although what this piece of code does is almost self-evident this is not true.
    Sometimes programs are really complicated. It is always good practice to write
    comments in the program, which do not affect the running of the program but help
    someone who has a look at the program later to understand what is going on. The
    way in which this is done in JavaScript is very similar to what is done in the
    C, C++, Java and PHP languages.


    Here is how the program above could have comments.


    ```

    <script>

    /* This program was written in 2017. The writer was Paul Revere*/


    document.write("Frog"+<br>"); //This is the first line of the program.

    document.write("Frog"+<br>");

    document.write("Frog"+<br>");

    document.write("Frog"+<br>");

    document.write("Frog"+<br>");

