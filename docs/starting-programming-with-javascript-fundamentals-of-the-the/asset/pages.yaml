  md: '9. Ruby


    # Compilers, Interpreters, and Assemblers


    Before use by the computer, languages must be converted to Machine-Code.

    This task is performed by either by a compiler or an interpreter.


    With some languages, the whole program, written in that language, is converted

    to machine code by compilers. In doing this an executable file is created.

    Examples of languages which are compiled are C and C++.


    An interpreter changes a program line by line to machine code. Perl,

    JavaScript, and Ruby are interpreted languages.


    # Is a Server a Computer?


    Most people who know about computers regard a server as a computer that

    provides services to other computers. While this is true the server is actually
    a

    program the server is running which provides these services.

    If you join computers together to talk with one another then you have a network

    or computer network.


    # Internet?


    The Internet dominates our age. It is an open medium comprised of a vast,

    global system of networked computers. The process by which computers'
