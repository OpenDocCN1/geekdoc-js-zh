  mdcn: "\n\n## 第 5 章：创建动态内容\n\n在 JavaScript 中，访问、创建、删除或更改文本框、下拉列表、表格等 HTML 元素的能力是最实用的功能之一。为了实现这一点，它使用了一种名为\
    \ Dom 模型（文档对象模型）的技术。这基于一种被称为 _面向对象编程_ 的方法，这种编程方法对于初学者来说相当复杂。为了为网页创建动态内容，这类计算的知识并不是绝对必要的。\n\
    \n首先，我们将查看如何使用 JavaScript 访问和修改现有的 HTML 元素。\n\n任务一。修改 Txt.HTML，使得点击按钮时弹出一个显示单词“Cat”的警报框。\n\
