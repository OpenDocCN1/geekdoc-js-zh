    # Chapter 1: Computers, Associated Concepts, and The First JavaScript Program


    # Definition of a computer


    This is very complicated. All you need to know is that a computer is a device
    that manipulates data. All useful computers are electronic.


    # Computer languages


    Programming languages range from low to high level. The lowest level language
    is called Machine-Code. It is written in binary using only 1 or 0. Higher programming
    languages are designed for humans to interact with computers. Low-level languages
    are almost indecipherable for most people.


    The list below is a sequence of computer languages starting from the lowest, which
    is Machine-Code to Ruby. Programs are described as having increasing abstraction
    as their level increases.


    # Language


    +   1. Machine-code

    2. Assembly

    3. C

    4. C++

    5. Java

    6. Python

    7. Perl

    8. JavaScript'
