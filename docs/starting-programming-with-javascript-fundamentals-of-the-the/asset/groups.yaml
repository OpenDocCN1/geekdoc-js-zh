    /*获取按钮并放入变量 butn*/\nvar butn = document.getElementById(\"rmv\");\n\nbutn.remove()//消除\
    \ butn\n}\n//结束 removeButton()\n\n打开 Txt.HTML，你会看到“删除”按钮。\n点击它，它消失了。\n\n在本章中，我们提供了使用\
