- md: "\n## Chapter 5: Creating Dynamic Content\n\nIn JavaScript, the ability to access,\
    \ create, destroy or change HTML elements such as text boxes, drop-down lists,\
    \ tables etc. is one of its most useful features. In order to do this, it uses\
    \ a technique called the Dom model. This is based on something called _object\
    \ oriented programming which is a method of programming which is quite complicated\
    \ for beginners. For the purpose of creating dynamic content for web pages knowledge\
    \ of this type of computing is not absolutely necessary.\n\nFirst, we will have\
    \ a look at accessing and altering existing HTML elements using JavaScript.\n\n\
    Task one. Alter Txt.HTML so that when the button is pressed an alert showing the\
    \ word Cat appears.\n\nThis is a really easy thing to do and does not actually\
    \ use the Dom model. However, it is a good first step in learning about this powerful\
    \ technique.\n\nHere is the Txt.HTML code you need.\n\n```\n<!DOCTYPE HTML>\n\n\
    <HEAD>\n<TITLE> XYZ</TITLE>\n<script src=\"hold.js\"></script>\n</HEAD>\n```\n\
    \n```\n<BODY>\n\nThe dog sat on a log.\n\n<hr>\n<p>\n<form>\n<input type=\"button\"\
    \ id=\"butt\" onclick=\"cat()\" value=\"button\"></button>\n<br>\nInitial first\
    \ name:<br>\n<input type=\"text\" name=\"initial\" >\n\n<br> Family name:<br>\n\
    <input type=\"text\" name=\"familyName\" >\n</form>\n\n</BODY>\n\n</HTML>\n```\n\
    \nFor the purposes of the task the vital line is `<input type=\"button\" id=\"\
    butt\" onclick=\"cat()\" value=\"button\"></button>` By putting in the instruction\
    \ onClick=\"cat()\" we are informing the computer that if the button is clicked\
    \ then the function cat() takes place.\n\nThe instructions for the function are\
    \ not found in Txt.HTML they are found in hold.js.\n\nThe code for this function\
    \ should be obvious but in case it isn't then it is written below.\n\n```\nfunction\
    \ cat()\n{ alert('Cat'); }\n```\n\nIf you type the exact code for Txt.HTML as\
    \ above and put the function cat() into hold.js then initially you will get the\
    \ following output.\n\n![](img/927937f44d64882e8c9fd3420cf581d4_55_0.png)\n\n\
    Now click on the button and you get the alert window.\n\n![](img/927937f44d64882e8c9fd3420cf581d4_55_1.png)\n\
    \nNow we are going to use the Dom model to influence what is on the screen showing\
    \ Txt.HTML..\n\nTask two. Alter Txt.HTML so that when the button is pressed a\
    \ prompt appears asking your first name initial, a second prompt appears asking\
