    \ div 中\n\n/*改变表格背景颜色*/\ndocument.getElementById(\"myTable\").style.backgroundColor=\"\
    black\";\n\n/*改变表格字体颜色*/\ndocument.getElementById(\"myTable\").style.color=\"\
    white\";\n}//结束 makeTable()\n```\n\n在本章开头，我们提到除了访问、修改和创建 HTML 元素外，我们还可以销毁它们。实际上，这是最简单的事情。你只需要需要销毁元素的\
