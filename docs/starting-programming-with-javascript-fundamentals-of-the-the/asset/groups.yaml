    ```\n<!DOCTYPE HTML>\n\n<HEAD>\n<TITLE> XYZ</TITLE>\n<script src=\"hold.js\"></script>\n\
    </HEAD>\n```\n\n```\n<BODY>\n\nThe dog sat on a log.\n\n<hr>\n<p>\n<form>\n<input\
