    end of a statement.


    # Strings


    A string is a collection of characters enclosed by " " or '' ''. Strings are incredibly
    important in JavaScript, in fact in most computer languages. You will get to use
    strings in many practical situations as we proceed before we go on we need to
    have a look at some string operations. For anyone using databases, string operations
    are really important no matter what language you are using.


    Open JavaScript.HTML in your text editor and between the <script> and </script>
    tags write the following


    ```

    <script>

    document.write("1+" +"Trop osphere".charAt(3)+"+<br>");

    document.write("2+" +"Trop osphere".charAt(4)+"+<br>");

    document.write("3+" +"Trop osphere".charAt(5)+"+<br>");

    ```


    document.write(4+" "+\+"Bi"+\+"os"+\+"phere"<br>");

    document.write(5+" "+\+"Trop osphere".indexOf(" p")+"<br>");

    document.write(6+" "+\+"Trop osphere".indexOf("ant")+"<br>");

    document.write(7+" "+\+"Trop osphere.replace("here","cat")+"<br>");

    document.write(8+" "+\+"Trop osphere.search("e ph")+"<br>");

    document.write(9+" "+\+"Trop osphere.substring(2,7)+"<br>");

    document.write(10+" "+\+"Trop osphere.toLowerCase()+"<br>");

    document.write(11+" "+\+"Trop osphere.toUpperCase()+"<br>");

    </script>

    ```


    then run.

    The output should be


    1 p

    2

    3 o

    4 Biosphere

    5 3

    6 -1

    7 Tropcat

    8 -1

    9 op os

    10 trop os

    11 ROSPHERE


    Running through each line.

    1. The letters in a string start from 0 so the statement "+Trop osphere".charAt(3)
    writes down the character of 3 is p.

    2. The letters in a string start from 0 so the statement "+Trop osphere".charAt(4)
    writes down the character of 4 is a blank.

    3. The letters in a string start from 0 so the statement "+Trop osphere".charAt(5)
    writes down the character of 5 is o.


    4 The + signs when dealing with strings join them. The strings, in this case,
    are "Bi,"os" and "phere". When they are joined together you get Biosphere.


    5. This statement instructs the computer to reveal the position of "p \(p followed
    by a space), in "Trop sphere". "p " is at position 3 in "Troosphere" so the computer
    returns 3.

    6. This statement instructs the computer to reveal the position of the string
    "ant" in "Trop sphere". The string "ant" is not in "Trop sphere" so the computer
    returns -1.

    7. This statement instructs the computer to replace "here" in "Trop sphere" by
    "cat''. This is done and gives the string "Tropcat".

    8. This statement instructs the computer to search for "e ph" in "Trop sphere".
    This is done and is not found so -1 is returned.

    9. This instruction asks for a substring of the string "Trop sphere". This means
    a set of letters from "Trop sphere". The substring asked for starts from the character
    at position 2 which is 0 then stops before the character at position 7. This is
    the substring "op os".

    10. This statement instructs the computer to make all characters lowercase.

    11. statement instructs the computer to make all characters uppercase.


    You may be mystified by <br>. It is an HTML tag and without this tag, all output
    would be horizontal instead of vertical. <br> is a very useful HTML tag for causing
    lines to have vertical alignment.


