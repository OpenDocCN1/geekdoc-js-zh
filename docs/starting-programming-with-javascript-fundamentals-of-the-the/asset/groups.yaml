    # Arrays


    This sub-topic is of great importance, every computer language uses arrays.


    Basically, an array is a piece of computer memory that holds a set of values.


    Here is a simple example (Don''t worry about statements after //. These are comments
    and don''t affect the actual program.)


    ```html

    <script>

    var numberHold = new Array();//creates new array numberHold

    numberHold[0] = 3;

    numberHold[1] = 6;

    numberHold[2]=-2;//assigns values to numberHold[0] etc


    var numRandom = Math.round(2*Math.random());//creates a number 0,1 randomly


    alert(numberHold[numRandom]);//shows the value of

    numberHold[numRandom]

    </script>

    ```


    If you run this program you will get an output of alert showing one of 3, 6 or
    -2.


    The program first creates a new array then puts 3, 6 and -2 into the variables
    numberHold[0], numberHold[1] and numberHold[2].


    var numRandom = Math.round(2*Math.random()) is one of 0,1 or 2.


    Alert demonstrates whichever of numHold[0], numHold[1] and numHold[2] is selected.


    You need to know that an array *Ar* always begins at 0, the first in the list
    contained by *Ar* is Ar[0].

    You will have noticed the //. Any statement following // is a comment. These do
    not affect the program. We will have more to say about this in the next chapter.


    Another example


    Try this


    ```html

    <script>

    var girls = ["Jane","Fiona","Mary","April","May","June","Julie","Averill","Shirley","Tara"];

    var numm = Math.round(11*Math.random());

    alert(girls[numm]);

    </script>

    ```


    This program if run repeatedly gives a random sequence of windows with one girl''s
    name from the list shown. This is a way of creating arrays when you know the values
    needed. It is not necessary to use new Array(). You just make a variable and set
    it equal to square brackets, which contain the contents of the array.


    The next chapter will show you more examples using arrays.


