    # About The Author\n\nIn addition to this book, Rory Barrett is the author of\
    \ many books published in New Zealand by ESA Publications. He has authored a number\
    \ of others and has his own website www.nceax.co.nz.\n\nHe was the Head of Mathematics\
    \ at three high schools in New Zealand: Rutherford High School, Auckland Grammar\
    \ School, and Macleans College. He was also the Deputy Headmaster at Saint Kentigern\
    \ College.\n\nIn 2014 and 2015 He was in charge of teaching computing at Motueka\
    \ High School, near Nelson, New Zealand. This book is based on his experiences\
    \ in teaching JavaScript to the pupils of this school as well as developing his\
    \ and other websites.\n\n# Table of Contents\n\n- Introduction\n- CHAPTER 1: COMPUTERS,\
    \ ASSOCIATED CONCEPTS, AND THE FIRST JAVCRIPT PROGRAM\n- CHAPTER 2: SEQUENTIAL\
    \ PROGRAMS\n- CHAPTER 3: ITERATIVE PROGRAMS\n- CHAPTER 4: CONDITIONAL PROGRAMS\n\
    - CHAPTER 5: CREATING DYNAMIC CONTENT\n- CHAPTER 6: PROBLEMS TO DO AND WHERE TO\
    \ FROM HERE\n- CONCLUSION\n\n# Introduction\n\nA few words about the book, “JavaScript”.\n\
    \nIt is necessary before you start your study of JavaScript to have a basic knowledge\
    \ of HTML, the markup language by which web pages are made. If you lack this then\
    \ you should learn some basic HTML before you start.\n\nThis book contains essential\
    \ information as you begin a study of JavaScript.\n\nBefore you start this book\
    \ ask yourself these questions:\n\nWhat do you know about the JavaScript computing\
    \ language?\n\nAre you keen to use it?\n\nThis book will tell you about starting\
    \ JavaScript in a simple yet factual way that does not blind the reader with science.\n\
    \nIt will tell you about basic commands, comments, operations, strings, arrays\
    \ and many other parts of this computer language.\n\nThere are 6 chapters, which\
    \ cover basic information, sequential programming, iterative programming, conditional\
    \ programming, dynamic programming, and problems to try and further investigation.\
    \ Each chapter will provide a stepping-stone to further exploration if so desired.\n\
    \nBefore you begin you should have a text editor that automatically produces pages\
    \ for a variety of computer languages. Microsoft Word is useless for this task.\
    \ If you are a Windows user then get Notepad++. It is an amazing piece of software.\n\
    \nIf you, like me prefer Macs, then there are a number such as Brackets and Komodo.\n\
    \nI knew of Linux but had no experience with it until I got a Raspberry Pi mini\
    \ computer, which uses a form of Linux called Raspian. That operating system comes\
    \ with a built-in programming editor called Geany. I have used Geany and have\
    \ to admit it is as good as Notepad++.\n\nAll editors I have mentioned are free.\
    \ I actually use Dreamweaver, which is very good but unfortunately, it is quite\
    \ expensive.\n\nNow onto Chapter 1.\n\n# Chapter 1: Computers, Associated Concepts,\
    \ and The First JavaScript Program\n\n## Definition of a computer\n\nThis is very\
    \ complicated. All you need to know is that a computer is a device that manipulates\
    \ data. All useful computers are electronic.\n\n## Computer languages\n\nProgramming\
    \ languages range from low to high level. The lowest level language is called\
    \ Machine-Code. It is written in binary using only 1 or 0. Higher programming\
    \ languages are designed for humans to interact with computers. Low-level languages\
    \ are almost indecipherable for most people.\n\nThe list below is a sequence of\
    \ computer languages starting from the lowest, which is Machine-Code to Ruby.\
    \ Programs are described as having increasing abstraction as their level increases.\n\
    \n## Language\n\n- 1. Machine-code\n- 2. Assembly\n- 3. C\n- 4. C++\n- 5. Java\n\
    - 6. Python\n- 7. Perl\n- 8. JavaScript\n- 9. Ruby\n\n## Compilers, Interpreters,\
    \ and Assemblers\n\nBefore use by the computer, languages must be converted to\
    \ Machine-Code.\nThis task is performed by either by a compiler or an interpreter.\n\
    \nWith some languages, the whole program, written in that language, is converted\n\
    to machine code by compilers. In doing this an executable file is created.\nExamples\
    \ of languages which are compiled are C and C++.\n\nAn interpreter changes a program\
    \ line by line to machine code. Perl,\nJavaScript, and Ruby are interpreted languages.\n\
    \n## Is a Server a Computer?\n\nMost people who know about computers regard a\
    \ server as a computer that\nprovides services to other computers. While this\
    \ is true the server is actually a\nprogram the server is running which provides\
    \ these services.\nIf you join computers together to talk with one another then\
    \ you have a network\nor computer network.\n\n## Internet?\n\nThe Internet dominates\
    \ our age. It is an open medium comprised of a vast,\nglobal system of networked\
    \ computers. The process by which computers\nexchange data is called packet switching.\
    \ Packet switching is governed by a whole lot of rules called protocols. These\
    \ are very important but unnecessary to know about if you are just starting in\
    \ JavaScript.\nThe Internet is a network of domestic, commercial, government etc.\
    \ networks with services such as email, the transfer of files, SMS, and all the\
    \ files of the World Wide Web (WWW).\n\n## Definition of a Web Server?\n\nA computer\
    \ program which serves requested web pages is called a web server. A Web client\
    \ is the program of a user which makes the request. browser is a client program\
    \ requesting files from Web servers. Common browsers include Chrome, Firefox,\
    \ and Safari.\n\n## Web Pages\n\nFiles on the Internet with the .html suffix are\
    \ called web pages. They are opened by browsers. Such files are the basis of the\
    \ World Wide Web (WWW), probably the most important part of the Internet. The\
    \ first appearance of HTML was in 1989. It was the invention of the English programmer\
    \ and scientist Tim Berners-Lee who was employed by the European Laboratory for\
    \ Particle Physics in Geneva, Switzerland.\n\nHTML has gone through a number of\
    \ developments since then. At the moment we are in the fifth version called HTML\
    \ 5. HTML will be used throughout this book as JavaScript was built for use with\
    \ HTML.\n\n## JavaScript\n\nJavaScript is a high-level programming language. Most\
    \ computer languages have the same program types although some languages are much\
    \ better for some purposes than others.\n\nJavaScript is a perfect language of\
    \ instruction for the teaching of programming. The reasons are that\n\n- (i) It\
    \ is not necessary to install JavaScript.\n- (ii) It is ideal for courses in programming.\
    \ Its possibilities vary from the most fundamental to really cutting edge.\n-\
    \ (iii)\n\n## Is It True That JavaScript and Java Are the Same?\n\nJavaScript\
    \ and Java are totally different languages even though their names are alike.\
    \ They are similar when simple programs are made however JavaScript is easier\
    \ to use and understand. The learning of JavaScript is a great help in learning\
    \ other more complicated languages such as C++, Java, and Python.\n\n## Is HTML\
    \ The Same As JavaScript?\n\nNo, they are not the same. They are quite different.\
    \ HTML is what is known as a markup language for the creation of static web page\
    \ content. JavaScript is a computer language which makes possible the creation\
    \ of dynamic content for web pages. This can be confusing because it is possible\
    \ to place JavaScript code in an HTML file, although you will learn this is not\
    \ good practice.\n"
  mdcn: "\n\n# 从 JavaScript 开始编程\n\n由一位教师编写的 JavaScript 计算机语言基础。对于没有基础知识的人来说，这是一本非常好的书。\n\
    \n# RORY BARRETT\n\n```javascript\nfor (i=1; i < n+1; i++) {\n  c[i] = new Array(c[i]);\n\
    \  c[i][0]=0;\n  holder=1+Math.floor(i);\n  c[i]=c[i-1][holder]\n}\n```\n\n本书版权所有。\n\
    \n未经出版者面许可，不得以任何形式或任何手段（电子或机械）存储或传输本书的部分，包括在检索系统中记录或存储任何信息。\n\n除非获得出版者的书面许可，否则通过复印或任何其他方式进行复制。\n\
    \nNCEAX 在新西兰印刷\n\nwww.nceax.co.nz\n\n# 关于作者\n\n除了这本书之外，Rory Barrett 还是多本由 ESA\
    \ Publications 出版、在新西兰出版的书的作者。他还撰写了许多其他书籍，并拥有自己的网站 www.nceax.co.nz。\n\n他曾担任新西兰三所高中的数学系主任：Rutherford\
    \ 高中、Auckland Grammar 学校和 Macleans College。他曾担任 Saint Kentigern College 的副校长。\n\
    \n2014 年和 2015 年，他负责新西兰内尔森附近 Motueka 高中的的计算机教学工作。这本书基于他向该校学生教授 JavaScript 的经验，以及开发自己及其他网站的经验。\n\
    \n# 目录\n\n- 引言\n- 第一章：计算机、相关概念以及第一个 JavaScript 程序\n- 第二章：顺序程序\n- 第三章：迭代程序\n- 第四章：条件程序\n\
    - 第五章：创建动态内容\n- 第六章：待完成的问题及后续去向\n- 结语\n\n# 引言\n\n关于《JavaScript》这本书的几点介绍。\n\n在开始学习\
    \ JavaScript 之前，有必要对 HTML 拥有基础知识，HTML 是制作网页的标记语言。如果你缺乏这些知识，那么在开始之前你应该学习一些基础的 HTML。\n\
    \n本书包含了你开始学习 JavaScript 时的基本信息。\n\n在开始阅读这本书之前，请问问自己这些问题：\n\n你对 JavaScript 计算机语言了解多少？\n\
    \n你渴望使用它吗？\n\n本书将以一种简单且实用的方式教你入门 JavaScript，而不会让读者被科学术语困扰。\n\n它将告诉你基本命令、注释、操作、字符串、数组以及这种计算机语言的许多其他部分。\n\
    \n本书共 6 章，涵盖了基础信息、顺序编程、迭代编程、条件编程、动态编程以及待尝试的问题和进一步研究。如果需要，每一章都将为进一步探索提供阶梯。\n\n\
    在开始之前，你应该拥有一个可以自动生成各种计算机语言页面的文本编辑器。Microsoft Word 对于这项任务是没用的。如果你是 Windows 用户，请下载\
    \ Notepad++。它是一个非常出色的软件。\n\n如果你像我一样偏爱 Mac，那么还有像 Brackets 和 Komodo 这样的软件。\n\n我知道\
    \ Linux，但在我买了一台树莓派微型电脑之前没有使用经验，它使用一种名为 Raspian 的 Linux。该操作系统自带了一个名为 Geany 的编程编辑器。我用过\
    \ Geany，不得不承认它和 Notepad++ 一样好。\n\n我提到的所有编辑器都是免费的。我实际上在使用 Dreamweaver，它非常好，但遗憾的是相当昂贵。\n\
    \n现在进入第一章。\n\n# 第一章：计算机、相关概念以及第一个 JavaScript 程序\n\n## 计算机的定义\n\n这非常复杂。你只需要知道，计算机是一个处理数据的设备。所有有用的计算机都是电子设备。\n\
    \n## 计算机语言\n\n编程语言从低级到高级级不等。最低级的语言被称为机器码（Machine-Code）。它使用二进制编写，只使用 1 或 0。高级编程语言是为了人类与计算机交互设计的。低级语言对大多数人来说几乎是不可读的。\n\
    \n下面的列表是从最低的机器码到 Ruby 的计算机语言序列。程序被描述为随着层级的提高，其抽象程度不断增加。\n\n## 语言\n\n- 1. 机器码\n\
    - 2. 汇编语言\n- 3. C\n- 4. C++\n- 5. Java\n- 6. Python\n- 7. Perl\n- 8. JavaScript\n\
    - 9. Ruby\n\n## 编译器、解释器和汇编器\n\n在计算机使用之前，语言必须转换为机器码。\n这项任务由编译器或解释器完成。\n\n对于某些语言，用该语言编写的整个程序由编译器转换为机器码。在此过程中，会创建一个可执行文件。编译型语言示例有\
    \ C 和 C++。\n\n解释器逐行将程序转换为机器码。Perl、JavaScript 和 Ruby 是解释型语言。\n\n## 服务器是计算机吗？\n\n\
    大多数了解计算机的人将服务器视为为其他计算机提供服务的计算机。虽然事实确实如此，但服务器实际上是服务器上运行的提供这些服务的程序。\n如果你将计算机连接在一起相互通信，你就拥有了一个网络或计算机网络。\n\
    \n## 互联网？\n\n互联网主导着我们的时代。它是一个开放媒介，由庞大的全球网络计算机系统组成。计算机交换数据的被称为包交换（packet switching）。包交换由许多称为协议（protocols）的规则管理。这些规则非常重要，但如果你刚开始学习\
    \ JavaScript，则没有必要了解。\n互联网是由国内、商业、政府等网络组成的，提供诸如电子邮件、文件传输、短信以及万维网（WWW）的所有文件的服务。\n\
    \n## Web 服务器的定义？\n\n提供请求网页的计算机程序被称为 Web 服务器。Web 客户端发送请求的用户程序。浏览器是向 Web 服务器请求文件的客户端程序。常见的浏览器包括\
    \ Chrome、Firefox 和 Safari。\n\n## 网页\n\n互联网上以 .html 后缀的文件被称为网页。它们由浏览器打开。此类文件是万维网（WWW）的基础，万维网可能是互联网最重要的部分。HTML\
    \ 首次出现于 1989 年。它是在瑞士日内瓦欧洲核物理实验室工作的英国程序员和科学家 Tim Berners-Lee 发明的。\n\n自那时起，HTML\
    \ 经历了多次发展。目前我们处于第五版本，即 HTML5。本书将一直使用 HTML，因为 JavaScript 是为了与 HTML 使用而设计的。\n\n\
    ## JavaScript\n\nJavaScript 是一种高级编程语言。大多数计算机语言具有相同的程序类型，尽管某些语言对于某些目的比其他语言更合适。\n\
    \nJavaScript 是教学编程的完美语言。原因是：\n\n- (i) 不需要安装 JavaScript。\n- (ii) 它是编程课程的理想选择。它的可能性从最基础到最前沿不等。\n\
    - (iii)\n\n## JavaScript 和 Java 是一样的吗？\n\nJavaScript 和 Java 是两种完全不同的语言，尽管名称相似。它们在制作简单程序时很相似，但\
    \ JavaScript 更容易使用和理解。学习 JavaScript 对于学习 C++、Java 和 Python 等更复杂的语言非常有帮助。\n\n##\
    \ HTML 和 JavaScript 是一样的吗？\n\n不，它们不一样。它们非常不同。HTML 是众的用于创建静态网页内容的标记语言。JavaScript\
    \ 是一种可以为网页创建动态内容的计算机语言。这可能会令人困惑，因为可以将 JavaScript 代码放置在 HTML 文件中，尽管你将了解到这不是良好的做法。\n\
    \n"
