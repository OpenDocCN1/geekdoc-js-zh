    \ = \"50px\";//更改文本框的高度（垂直方向）\nob.style.fontSize=\"24pt\";//更改文本框中的字体大小\nob.style.fontFamily=\"\
    arial\";//将文本框中使用的字体更改为 arial\nob.value = nam;//将你的姓氏输入文本框中\n\n//结束 changeButton()\n\
    ```\n\n将 `onclick = \"FunctionName()\"` 改为 `onclick()`\n\n在处理了文本框和按钮后，让我们现在来看下拉框，这是一种用于获取选择的方法。\n\
