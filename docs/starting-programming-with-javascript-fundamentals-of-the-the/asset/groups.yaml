    \    row.appendChild(headerCell);\n} //添加表头\n\nfor (var i = 1; i < students.length;\
    \ i++)\n{ /*每个学生创建一个行*/\nrow = table.insertRow(-1);\nfor (var j = 0; j < columnCount;\
    \ j++)\n{\n    var cell = row.insertCell(-1);//创建一个单元格\n    cell.innerHTML = students[i][j];//设置单元格的\
    \ innerHTML\n} // 添加数据行\n\ndvTable = document.getElementById(\"dvTable\");//获取用于放置表格的\
