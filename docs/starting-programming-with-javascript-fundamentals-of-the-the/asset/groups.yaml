    \ = cat;\n```\n\n现在运行程序，你将得到所需的 cat 警报。\n\n现在来创建任务 (3) 的表格。\n\n首先，让我们有一个新版本的 Txt.HTML。\n\
    \n```html\n<!DOCTYPE HTML>\n<HEAD>\n<TITLE> XYZ </TITLE>\n<script src=\"hold.js\"\
