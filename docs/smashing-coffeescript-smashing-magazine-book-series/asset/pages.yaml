  md: "In some instances, the output JavaScript is a lot less concise than the input\
    \ CoffeeScript. After all, CoffeeScript makes some things incredibly convenient.\
    \ If it didn't, there wouldn't be as much point to using it. Comprehensions are\
    \ an excellent example of this:\n\n```\ndouble = (x) -> x*2\n```\n\n```\nevens\
    \ = [double x for x in [1..10]]\n```\n\nThis is wonderfully concise code, but\
    \ the resultant JavaScript is anything but:\n\n```\n// Generated by CoffeeScript\
    \ 1.4.0\nfunction() {\n  var double, evens, x;\n\n  double = function(x) {\n \
    \   return x * 2;\n  }\n\n  evens = [\n    function() {\n      var _i, _results;\n\
    \      _results = (function() {\n        for (_i = 1; _i <= 10; x = ++_i) {\n\
    \          _results.push(double(x));\n        }\n        return _results;\n  \
    \    })()\n    }()\n  ];\n}.call(this);\n```\n\nAgain, a lot of the intent is\
    \ clear, while a comprehension is little more than a dressed-up loop, it's not\
    \ totally why this loop is so large. The CoffeeScript compiler is again using\
    \ anonymous functions to wrap code and ensure that it isn't causing side effects\
    \ elsewhere, and it's also generating a number of internal variables that don't\
    \ actually appear in the original CoffeeScript source.\n\nVariables with names\
    \ that begin with an underscore, such as _i or _results in the previous example,\
    \ are those that have been automatically created. For this reason, it is often\
    \ useful to steer clear of using variables with such names in CoffeeScript so\
    \ that it's obvious which variables refer back to the original source, with the\
    \ exception of naming class attributes or methods (where a leading underscore\
    \ denotes a private part of the class).\n\nSo far I have suggested that it's better\
    \ not to look too hard at the JavaScript output, but to attempt to learn CoffeeScript\
    \ on its own merits. However, as you write more complex software, you will inevitably\
    \ find yourself looking more and more at the compiled output."
  merge: -1
