  md: '# WRITING RELIABLE SOFTWARE


    There are many tools available to developers who want to create reliable software.
    Using test frameworks, for example, demonstrates that the code works to some degree
    and can provide an assurance that its behavior has not changed over time. Using
    patterns helps you avoid well-known design flaws and architectural mistakes. Debuggers
    are another important tool, allowing you to inspect the workings of the program
    as it executes and verify that it does what you intended.


    Most developers, including me, consider debugging a necessary evil. Software exhibits
    a variety of problems that are referred to as bugs, and for the most part, there''s
    no silver bullet. Software can go wrong in so many ways that programmers use different
    types of debuggers to uncover what''s going wrong. Traditionally, though, the
    web hasn''t provided excellent support for debugging. Although many developers
    use JavaScript and basic support for inspecting JavaScript programs is built into
    browsers, non-web application developers rarely have access to such tools. The
    state of the art on the desktop includes debuggers that can change code while
    running, and not just stop programs but run them backward to understand how they
    ended up in a specific state.


    With excellent debuggers, there is little stopping you from writing an application
    in any language you please, but on the web, things are not so easy. Indeed, one
    of the main reasons people can be put off by CoffeeScript is when their code goes
    wrong (and that''s pretty inevitable), they will be dropped into a JavaScript
    console.


    Now, there''s nothing wrong with JavaScript, but for many programmers—particularly
    those just learning CoffeeScript—it''s a tricky off-putting. Developers may feel
    as though it provides less information and debugging will be harder, and if they
    have to go through the JavaScript code anyway, why not simply write in JavaScript?


    Fortunately, a number of tools make CoffeeScript not only bearable with a browser
    but also quite productive to use. You can debug CoffeeScript directly within the
    usual developer tools browser, or as use CoffeeScript within the console—technically,
    another form of Read, Evaluate, Print, Loop (REPL) interface.


    As well demonstrating these various tools, it also makes sense to look deeper
    into how CoffeeScript is compiled into JavaScript. In previous chapters, I held
    off comparing CoffeeScript to JavaScript because CoffeeScript doesn''t necessarily
    look like it. However, at this point, it is time to find out more about what''s
    actually happening under the covers and how this system really works.


    # READING AND DEBUGGING COFFESCRIPT AND JAVASCRIPT


    Interestingly, one of the key goals of the original CoffeeScript compilation process
    was to make the transformation as easy to understand as possible. A developer
    who knows JavaScript'
