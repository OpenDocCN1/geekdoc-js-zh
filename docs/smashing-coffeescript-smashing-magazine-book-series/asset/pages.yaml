  md: '# CHAPTER 12 • Mobile CoffeeScript Applications 245


    ```

    activePageClass: ''active'',

    hashListeningEnabled: false,

    linkBindingEnabled: false,

    pushStateEnabled: false


    ));

    <script>

    <script src="jqm/jquery.mobile-1.2.0.js"></script>

    ```


    The application.css and application.js files are already listed; these are the
    main bundles for the application being written. Although it''s possible to bundle
    the jQM stylesheet into the existing bundle, that''s a step too far at this point.


    It''s also technically plausible to bundle the jQM JavaScript file, but that would
    cause problems at this point. To ensure that jQM and Spine play well, many of
    jQM''s automatic features need to be turned off first.


    You achieve this by configuring the jQM library by adjusting the settings on jQuery
    mobile, which is done when the mobileinit event is received. It''s tempting to
    think that order doesn''t matter and that this configuration can be done at any
    point, but that''s not the case!


    To make the mobile experience as slick as possible, jQM starts many of its features
    early in the browser''s page lifecycle. It doesn''t wait for the DOM ready to
    start doing things, and in fact if the script block with the event handler is
    placed after the reference to the jQM script, it''s highly probable that the jQM
    script was cached locally, the mobileinit event may have been triggered even before
    the event handler could be set up.


    Here are the key automatic features being disabled:


    +   - AJAX links: By default, jQM intercepts links and attempts to load them via
    Spine so that pages can be transitioned on and off, which interferes with the
    Spine navigate()

    - Hash listening, link binding, push support: Again, part of jQM''s navigation
    support, this interferes with Spine.

    - Page initialization: jQM can interrogate a page for widgets and automatically
    create them; this doesn''t work well with Spine''s render support. The alternative
    is to instantiate manually, which is fine.


    It''s not the case that this is the right line to draw. For example, jQM''s AJAX
    link support can coexist with Spine.mobile. It wouldn''t be hard to use jQM''s
    system of navigation in preference to Spine.mobile''s own or to rely on the system
    of transitions provided by jQM.


    However, if the core mobile support is to be provided by jQM, the better approach
    is to write a standard Spine application with jQM, rather than attempt to melt
    it into Spine.mobile, and indeed you can find few examples online of people who
    have just that.'
  merge: -1
  pgno: 260
