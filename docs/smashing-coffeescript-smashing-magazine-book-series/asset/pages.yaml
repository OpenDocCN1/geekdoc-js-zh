  md: 'Query''s on () function is incredibly flexible, handling not only clicks and
    double-clicks, other types of mouse movement or input, form submission, and other
    browser events; it''s really worth working through the jQuery API in this area
    and taking in all of the available events.


    There is another jQuery feature worth mentioning this point. Most events on a
    page bubble: The user clicks on a button, and button receives the click event,
    but that click event also registers the button''s DOM parent, and against the
    parent''s parent, so on and so forth unless some piece of code deliberately prevents
    the event from bubbling.


    jQuery ensures the bubbling happens consistently on the various browsers and allows
    you to attach handlers to nodes that the handlers pick up events from children
    nodes. This gives you two great options at the same time:


    +   - An ability to write a single handler that can process events from a variety
    of different DOM nodes beneath it,

    - An ability to listen for events from DOM nodes that will be created later in
    the code.


    Generally, the fewer handlers a page has, the better the performance; although
    an event that has to bubble up through a number of nodes before it reaches a handler
    will have a negative impact on performance. it''s good to strike a balance here.


    As an example, this is what a click handler on the slideshow panels could like:


    ```

    $$(slideshow).on("click","li", (event) -> do something

    ```


    The handler is placed on the slideshow node itself, but as well as giving jQuery
    the event you want to receive("click") you also give it a CSS selector. Now, any
    click event on a child node of slideshow that matches that CSS selector triggers
    this event handler.


    If at any stage you find yourself adding handlers to sets of nodes using jQuery,
    particularly where the number of potential nodes is very high, if you can use
    this delegated event style inside. This is a very efficient method of handling
    events.


    # PAGE EVENTS


    You''ve seen a variety of different ways of incorporating events into your code,
    but there''s an important class of event that hasn''t been covered yet: synthetic
    events. Although most events in a browser occur because the user has done something—clicked
    a button, entered some information into a form—it''s possible for the code on
    the page to generate and receive custom events unrelated to any specific DOM node
    on the page.


    These types of events have a number of different uses, but the use case discussed
    here is the ability to pass messages in and out of encapsulated code.'
  merge: -1
