  md: '# CHAPTER 5 Object-Oriented Design


    Earlier in my description of inheritance, I mentioned the difference between CoffeeScript
    and JavaScript, and this difference in notation is the practical consequence.
    Since CoffeeScript is compiled to JavaScript, it must internally run on that prototypical
    system of inheritance, even though it provides a largely faithful alternative.
    The keyword this is used in both systems, but unfortunately refers to different
    things!


    Usually, CoffeeScript hides the various JavaScript foibles that a programmer doesn''t
    need to know about, but it can''t really hide this difference. Ensuring that this
    remains consistent in CoffeeScript creates a (very) small performance overhead,
    slightly more complex output, but importantly, it creates a real difference among
    calling conventions when interoperating with JavaScript libraries and applications.
    So, sadly, it''s a difference you need to understand.


    Fortunately, the basic rules here are pretty straightforward:


    +   * If the function is not in a class definition, use the thin arrow.

    * If the function is the constructor of a class, use the thin arrow.

    * If it''s neither of these, and you have no overriding reason not to, use the
    fat arrow.


    Always use the fat arrow for functions defined in classes, except the constructor,
    unless there''s a reason not to.


    # EXTENDING CLASSES


    Having looked at the encapsulation of objects in CoffeeScript, you''re ready to
    look at inheritance. Inheritance is an important form of code reuse, and it''s
    also an issue of design and style. When programming in an object-oriented fashion,
    the class inheritance hierarchy is as important as any other aspect of the program
    architecture, and a badly thought-out structure leads to code that''s very difficult
    to maintain.


    The image rotor mentioned previously, even translated into a class-based format,
    suffers from a number of built-in assumptions. Primarily, the type of transition
    is hard-coded in the main piece of the code; later if other developers want to
    implement a new transition that perhaps moves the panels from the top downward,
    they''ll have a lot of trouble. Certainly, to remove those assumptions, they''d
    need replacement of the code already written.


    This process of removing assumptions is often called abstracting: identifying
    the key things that a piece of code is and finding a more generalized version
    of the function that can the basis of a number of more specific pieces of code.


    Is it possible to teach a programmer how to abstract? Unfortunately, no. For one
    thing, how an abstraction holds up over time depends heavily on how the requirements
    for a piece of software change over time. No matter how beautiful the design,
    if it doesn''t fit the needs of the program, it is essentially no good, and programmers
    are usually not psychic. This is where experience matters a lot, but new programmers
    learn which designs stand the test of time. (These are often referred to as design
    patterns, and they''re an essential part of every programmer''s toolbox.'
