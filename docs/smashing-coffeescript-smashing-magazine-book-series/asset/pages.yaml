  md: '# UNDERSTANDING MOBILE FIRST PRINCIPLES


    What is the point of using a mobile web browser? After all, as well as the bandwidth
    costs being significantly more expensive than the wired equivalent, the devices
    are smaller, less capable, and don''t last very long on batteries. To say they
    don''t provide an equivalent experience is putting mildly.


    That would be an incredibly cynical point of view, though. Over the globe, the
    past 20 years have been marked by the advent of the smartphone: a device with
    previously unheard of technical specifications and capabilities.


    Not only have phones become smaller and more powerful, they also have sold like
    hot cakes all over the world and have redefined the meaning of personal computing.
    A mid-range phone, at the time of this writing, delivers a quad-core CPU running
    2GB RAM, a 16GB disk, and a five-inch screen capable of playing high-definition
    movie content at full resolution. (I write this safe in the knowledge that such
    information will quickly date this book and in a few years, readers will chuckle
    at these specifications.)


    The mobile world is hardly limited to phones. Tablet computers are arguably becoming
    one of the most popular hardware categories, and although they somewhat lacking
    in portability, they boast technical specifications and large screens generally
    with a higher resolution than much expensive laptops.


    Obviously, mobile is more than a trend or fashion. In many ways that the actual
    definition of computing is changing. The traditional "box and monitor" setup of
    a desktop computer now represents a small part of the overall computer market,
    and even the laptop is becoming less popular as people find they can do without
    a keyboard in favor of a touchscreen.


    Many developers have come to an inescapable conclusion: Not only is mobile important,
    but also may be the most important delivery mechanism. Mobile first is the catchphrase
    that these developers live by. In essence, badly served by existing desktop-focused
    sites. This perspective accepts that mobile is important and badly served Instead
    of continuing to design desktop sites as developers have done, it might be better
    to make the site work with mobile first and then extend gracefully for the full
    desktop experience.


    There is a lot to be said for this point of view. Rather than mobile playing second
    to the desktop alternative, mobile first asks readers to create a common core
    of a site that works well across a broad range of devices and tune it up when
    possible. In theory, this approach may mean less work for developers, and in practice,
    it gives users a more consistent experience.


    Mobile is wonderful, but like some other wonderful things, it has a significant
    downside. Actually, in this case, there are quite a few:


    +   The mobile marketplace is technologically fractured.


    +   The mobile experience necessarily varies by geography.'
  merge: -1
