    Debugging CoffeeScript is slightly harder than debugging JavaScript browsers don''t
    offer native support for the language. The tools available are very good though,
    once you get to know them. This chapter covered these key topics:


    +   - Understanding the JavaScript output of the CoffeeScript compiler

    - Using Firebug to set breakpoints in the JavaScript source and debug a CoffeeScript
    application

    - Using Acebug to give the browser console a CoffeeScript REPL

    - Generating CoffeeScript source maps and debugging the code more or less natively
    in the browser


    You also took a look at using the CoffeeScript Redux compiler during the source
