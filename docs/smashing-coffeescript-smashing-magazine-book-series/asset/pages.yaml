  md: '# Searching for Packages


    The first thing most people want to do is look around and see what''s available.
    The way to accomplish this is as obvious as you might hope. Type npm search <searchTerm>
    at the command prompt:


    ```

    $ npm search coffee-script

    npm http GET https://registry.npmjs.org/-/all/since?..

    npm http 200 https://registry.npmjs.org/-/all/since?..

    NAME DESCRIPTION

    [..]

    coffee-script Unfancy JavaScript

    [..]

    ```


    I''ve removed the lines describing different packages from this search result.
    Quite often when a search is requested, a lot of results come back. npm has a
    big directory with utilities, libraries, and tools of all sorts. Although originally
    aimed at server-side code for node.js users, the directory has since blossomed
    into client-side code as well, as familiar libraries such as jQuery are also included.
    Many developers end using npm to manage third-party libraries simply because of
    ease of use.


    The first time a search is run, npm downloads a search index. In the previous
    example, a search was run before, so the first two lines of the log show that
    the existing search index is just being updated.


    # Installing Packages


    As mentioned, installation is a breeze, but you need to decide whether packages
    will be installed globally or locally. Global generally means for every user on
    your computer, and you will wisely need some form of administrative permission
    to install globally, but that''s the easiest way to get up and running. You use
    local installation to install dependencies in a specific project, and the dependencies
    live in the project folder, so no systemwide installation occurs, and no administrative
    permission is generally required.


    Local installation is slightly more advanced. The main problem is that if you
    use to install tools, the tools generally aren''t available in the shell immediately
    because they''re installed in a nonstandard location where the shell will never
    look.


    # INSTALLING COFFECRIPT


    Typing npm install <originalname> at the command prompt asks npm to install the
    given package, and usually the package name will be discovered with a search.
    Go ahead and install CoffeeScript with the following command:


    ```

    $ npm install -g coffee-script

    npm http GET https://registry.npmjs.org/coffee-script

    npm http 304 https://registry.npmjs.org/coffee-script

    coffee-script@1.0.0 * /usr/lib/npm/node_modules/coffee-script

    ```'
