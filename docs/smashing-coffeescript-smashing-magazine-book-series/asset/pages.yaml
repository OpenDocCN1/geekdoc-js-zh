  md: '# CHAPTER 10 • Writing Applications with Spine


    page and remain accessible if the browser goes offline. This is a basic step up
    and can be added to Spine models very simply:


    ```

    class Event extends Spine.Model

    @configure "Event", "allDay", "description", "start", "end"

    @extend Spine.Model.Local

    ```


    All you need is the additional extension. This extension hooks into the regular
    load and save process, ensuring that the data is retrieved from or saved to the
    browser.


    LocalStorage might be okay for some applications, but it is quite a limited system.
    Even if storing the information in the browser alone were sufficient, localStorage
    has a relatively small 5Mb capacity in most browsers. What you really need is
    a process that enables Spine to retrieve information from the server using AJAX,
    and save data back when it is created or updated.


    Surprisingly, adding an AJAX-backed persistence model into a model definition
    is straightforward:


    ```

    class Event extends Spine.Model

    @configure "Event", "allDay", "description", "start", "end"

    @extend Spine.Model.Ajax

    ```


    At a basic level that is all is required: Internal data loading and saving is
    again intercepted and routed to the server. This might look too good to be true,
    and in a way it is; Although it is simple to extend a model in this fashion, there
    are some quite rigid rules about how the persistence layer communicates with the
    server.


    The Ajax persistence assumes the server-side data API is REST-based. The basic
    URL that it is derived from the class name in the first instance. The name is
    converted to lower-case and then pluralized, so that the Event model is expected
    to be available on the URL /events.


    If the default choice of URL is not acceptable, then adding a static @url attribute
    to the class definition overrides that path. Either way, the basic load and save
    operations take place against the path given:


    +   - GET /events is used to retrieve all the objects for a model.

    - POST /events is used to create a new object for a model.

    - PUT /events/:id is used to update a specific object (where the object identifier
    is appended to the URL).

    - DELETE /events/:id is used to remove an object.


    There are REST-style solutions available for node.js that make the development
    of the server-side counterpart to this scheme quite straightforward. Readers with
    Ruby experience may recognize this scheme in particular with the Ruby on the Rails
    framework, and, indeed, Spine integrates incredibly well with Rails.'
