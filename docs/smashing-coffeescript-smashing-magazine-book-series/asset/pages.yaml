  md: '# CHAPTER 12 • Mobile Development 239


    The route already prescribed for this page is /products, and it needs a controller
    and a view, before you add those, you need a model to represent the data:


    ```

    Spine = require(''spine'')


    class Product extends Spine.Model

    @configure (''Product'', ''name'', ''price'', ''description'', ''image'')

    @extend Spine.Model.Ajax


    @url = "/productlist.json"


    module.exports = Product

    ```


    Making use of the standard Spine AJAX-backed model means that although much of
    the work of creating, loading, and saving products is unnecessary, although a
    static file is in use for this example, it is easy to have this model talk to
    a back-end web service that is retrieving data from a database or search engine.
    The JSON format closely follows the model definition:


    ```

    "id": 1,

    "name": "Toy bear",

    "price": 1499,

    "description": "A lovely cuddly bear, perfect for small children",

    "image": "",

    "new": true

    {

    "id": 2,

    "name": "Fire engine",

    "price": 2999,

    "description": "Fight fires with this chunky red fire engine!",

    "image": "",

    "new": false

    }

    ```


    This productlist.json can be placed in the public/ folder of the project, and
    the server will automatically make it available. This kind of approach is handy
    for all sorts of static data and is useful for prototyping different user interfaces
    quickly without requiring a working server to respond to data requests.


    # Controlling Related Panels


    With a (very simple) product database in place, the controllers and views for
    the various product-oriented application pages can now be set up:'
