    # BUILDING THE APPLICATION


    With a skeleton application ready and waiting, it''s now possible to get into
    the meat of the

    subject: building the application functionality. So far, the Model-View-Controller
    pattern has

    been discussed in the abstract. Now, it''s time to review the components that
    actually need to

    be implemented. Most applications have at least one of the following:


    +   - Models: These are the classes that manage data and provide state for the
    application.

    - Views: These present data to the user and are essentially just HTML templates
    with

    pieces of logic in to display the data correctly.

    - Controllers: In Spine, they perform a couple of different functions, but are
    used to

    modify models and pass them into the views to be rendered.


    Spine also provides


    +   - Stacks: One of the most common tasks within web applications is to control
    what is

    onscreen at any given time, and Spine provides stacks to group controllers together
    to

    control which ones are active. Stacks are actually specialized controllers,

    having an additional manager component that controls which is active at any given

    time.

    - Modules: As well as using AngularJS''s native inheritance, Spine provides the
    ability to

    mix additional class or instance functionality, using Spine.Module. This class

    actually forms the base of all Spine classes.

    - Events: Because binding DOM events to logic is an incredibly common pattern,
    Spine

    provides this as a specific module. It can be mixed into other classes, and both
    models

    and controllers have it mixed in by default.

    - Routes: Used by controllers to map URLs (either virtual ones, or real ones as

    supported by HTML5 local history) to views, routes allow the user to navigate
    around the

    inapplication in a controlled manner. The routes module is mixed into controllers
    byndefault.


    Although this doesn''t look like an awful lot, most useful tasks can be accomplished
    using one

    or more of these classes. Additional functionality is quite easy to write and
    build on top of

    base; indeed, the chapter examines in depth how strong mobile device support can
    be

    built on this framework as well.'
