    \ practically anywhere, including within expressions.\n\nRemember when I said\
    \ that functions don't get names in CoffeeScript, and you have to assign them\
    \ to variables to call them by a name? Hopefully the implication of lexical scoping\
    \ is clear: functions in CoffeeScript can be referenced only after declaration\
