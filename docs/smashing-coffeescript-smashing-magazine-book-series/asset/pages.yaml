  md: '# ABOUT THE AUTHOR


    Alex Hudson''s first computers comprised an Amstrad 1512 and Oric Atmos: two peculiarly
    British machines, coming with slightly odd versions of BASIC. As was the case
    with most 8-bit machines of that era, they also arrived with programming manuals
    and assembly language instruction set documentation, and from that point Alex
    was hooked.


    By his teens, the Internet "had happened": or, at least, dial-up CompuServe access
    arrived in the UK. With a group of like-minded friends who enjoyed swapping code,
    now on the peculiarly British Psion 3a portable computer, Alex won one of the
    first national awards for a school''s website—in hindsight, probably due more
    to lack of competition than technical innovation.


    Swapping code on the internet turned out to be the next big thing, and Alex became
    an active member of the UK free software and open source community, developing
    applications and libraries and actively contributing to a number of different
    projects, including Linux, Hula (later Bongo), and later became a Fedora Developer.


    Alex has a broad background in information systems. From leading development of
    innovative foreign language e-learning systems to large databases for Government
    projects, the common theme in his work life has been digital application development.
    Having co-founded and advised a number of start-ups, he currently serves as the
    Chief Technical Officer at mydecocom, an innovative homeware start-up making big
    strides in Europe.'
