    hem needs to be told that it''s a dependency by editing the slug.json. However,
    there is a slight wrinkle: As a relatively standard jQuery plug-in, FullCalendar
    expects to be attach to the jquery object, which doesn''t lend itself naturally
    to jqueryify.'
