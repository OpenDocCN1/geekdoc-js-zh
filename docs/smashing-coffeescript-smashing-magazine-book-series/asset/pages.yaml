    \ some of the features of models allowing you to save and retrieve data, but that\
    \ functionality is not much use if the application cannot be sure the data is\
    \ correct. Validating that the data meets specific criteria is an invaluable step\
    \ before accepting it, and the most sensible place to do this is within the model\
    \ itself.\n\nA model validation function is extremely easy to write. This is how\
    \ the Event model could be extended to include basic validation:\n\n```\nclass\
    \ Event extends Spine.Model\n@configure \"Event\", \"title\", \"allDay\", \"description\"\
    , \"start\", \"end\"\n\nvalidate: =>\n  if @start > @end\n    return \"Event ends\
    \ before it starts\"\n  if @title == \"\"\n    return \"Event has no title\"\n\
    ```\n\nFor any Spine model validate() is called immediately before the model is\
    \ saved. If validate() returns anything, validation fails. By convention, a string\
    \ containing a useful error message is the normal means of failing validation.\n\
    \nValidation occurs specifically when the methods save(), create() or update Attributes()\
    \ are called on a model object, and these methods return false if validation fails.\
    \ (Ordinarily the object itself would be returned, as part of a somewhat-fluid\
    \ API design.)\n\nIn addition to changing the result of those method calls when\
    \ validation fails the error event is triggered. Following are several of the\
    \ options that help you handle this event:\n\n+   - Ignoring the event is always\
    \ a possibility. This usually isn't the most user-friendly approach.\n- The error\
    \ string can be displayed to the user, in the hope that the information in it\
    \ contains enough information to help them work out what went wrong.\n- If the\
