  md: "# CHAPTER 14 · Server-Side CoffeeScript 283\n\napp.use() is the interesting\
    \ work begins to happen. The various statements here have one thing in common:\
    \ they define a piece of the middleware. The application has a stack of middleware,\
    \ and each time use() is called, a new handler is appended to that stack.\n\n\
    Middleware is nothing special. It's simply a function with a specific signature,\
    \ and use () takes a reference to that function. Then, on each request, each middleware\
    \ gets to look at the request before the application, in turn. The previous code\
    \ references non-standard middleware csrfMiddleware. Its definition is simple:\n\
    \n```\ncsrfMiddleware = (req, res, next)\nres.locals._csrf = req.session._csrf\
    \ ? \"disabled\"\nnext();\n```\n\nEvery piece of middleware has this (req, res,\
    \ next) signature, allowing it to see a request (the first argument), after the\
    \ response (the second argument), and call the next (the last). It's similar to\
    \ the controller signature except that a controller is effectively the last function\
    \ to be called, so there's no need for next ().\n\nThe main use of middleware\
    \ is to do a global task that would otherwise need to be repeated in the controllers.\
    \ Using middleware is a great way of ensuring the code doesn't become too repetitive.\
    \ In the previous example, the middleware sets a local variable within the response\
    \ context, which means every template written for this application can rely oncsrf\
    \ being in the template context. This information is used to prevent cross-site\
    \ request forgery (CSRF) attacks, a common vulnerability in web applications.\n\
    \n> CSRF attacks are covered later in this chapter in the section on security\
    \ measures.\n\nWith the middleware configuration out of the way, the remaining\
