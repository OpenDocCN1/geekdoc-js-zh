    ```


    And running it over good or bad files is equally easy:


    ```

    $ cofelint good.coffee bad.coffee

    ```


    +   - good.coffee

    - #4: Line contains inconsistent indentation. Expected 2 got 1.

    - #4: Line contains tab indentation.


    Lint! > 2 errors and 0 warnings in 2 files


    In this instance, cofelint has recognized that the indentation in the second file
    is incorrect—tabs have been used. Unfortunately, it hasn''t gone far as to correct
    the problem, but you do have the line numbers, which is the best thing.


