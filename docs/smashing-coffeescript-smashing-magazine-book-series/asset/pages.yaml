    Source: Mozilla Firefox on Microsoft Windows 7


    So, what are the problems with this implementation? Well, it''s not well encapsulated
    although the code is in the DOM ready handler, it would be better to wrap it in
    its own function so that you could expand the ready handler to include other code
    without having to worry about the interaction. Generally, a single ready handler
    is better than having multiple separate ones: in particular, it makes the order
    of execution code much clearer.


