    # THE CALENDAR MODEL DATA


    The calendar application you looked at can create basic events, but provides little
    ability to edit those events. To be useful the application should allow the user
    to change the information held against the event, such as the title or the start
    time. The FullCalendar plug-in also allows users to move events using drag-and-drop,
    and the application should support that too.


    This is conceptually simple as a process. The application will have interfaces
    that the user can use to manipulate the data for events. These changes are reflected
    in the model, which is saved.


    Since the plug-in supports drag-and-drop as a way of changing basic information,
    that makes a good place to start. First, the plug-in needs to be told that the
    editable features should be turned on. I''ve changed the creation of the calendar
    to this:


    ```

    @el.fullCalendar

    height: 600

    width: 600

    defaultView: "month"

    events: @getEvents

    dayClick: @dayClick

    editable: true

    eventResizeStop: @changeEvent

    eventDragStop: @changeEvent

    header

    left: "month,agendaWeek,agendaDay"

    center: "title"

    right: "today prev,next"

    ```


    The editable attribute is set to true to turn on the editable features. When the
    calendar allows an event to be moved, it''s effectively changing the start and
    end date associated with the event.


    The plug-in can communicate these changes in two ways: the eventResizeStop event
    (which indicates the user has resized the event, changing the end date) and the
    eventDragStop (which indicates the event was dragged, changing both start and
    end date). I don''t mind whether the start date has changed, I''ve set the same
    handler on both events.


    Lastly, the header configuration has changed. This changes the user interface
    of the calendar to allow day and week views to be selected as well as the default
    month view. This is a cosmetic change, affecting an event to make shorter or longer
    works on the best day and week views.


    In case of the FullCalendar plug-in, the underlying event data it''s using is
    the Event model created in the application. This makes the event handler incredibly
    simple:


    ```

    onChange(event, jsEvent, ui, view) =>

    event.save()

    ```'
