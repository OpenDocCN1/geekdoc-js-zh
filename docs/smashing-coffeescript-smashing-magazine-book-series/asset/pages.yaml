  md: '# CHAPTER 7 • Testing with Jasmine 127


    # Unit Testing Versus Integration Testing


    One of the key things to test when writing tests is whether the test is supposed
    to be a unit test or an integration test. Some developers get them confused; other
    developers don''t see the value in one or other of these types of tests.


    A unit test should be a relatively stand-alone test of the functionality of a
    specific piece of code, usually a class or function. Unit tests should not test
    other pieces of code at the same time, which means that both the test and the
    artifact being tested are separable and independent as possible: ideally, totally
    stand-alone. Where a class or function is coupled to another piece of code, you
    can use mock objects/functions or stubs to remove the dependency.


    Integration tests are almost the opposite. Instead of testing code singularly,
    we test how the code works when it''s brought together, and the ideal integration
    test is something that tests the final application as a whole. Integration tests
    necessarily depend on multiple pieces of code, if not the entire application,
    and generally don''t make use of mocks or other "fake" test harnesses.


    When using tests to drive development, the tests are the most important. These
    are the tests that specify how a new piece of code is supposed to work, and should
    ideally fail first before the code is written. On the other hand, the integration
    tests lend some degree of confidence to the release process so that the test suite
    passing is a sign that at least all the key functions of the application continue
    to work properly.


    Although Jasmine can be used for integration testing, I think that its main strength
    is in unit testing and that there is a huge amount of value in testing the behaviors
    of the classes being written for an application, as a form of documentation if
    nothing else.


    When considering what a good test should look like then, take into account these
    factors:


    +   - Does this test me, or a co-developer, something about how the application
    is supposed to behave?

    - How thorough is the test in terms of the functionality being looked at?

    - Do the tests exercise all the different code paths within the application?

    - Are the tests at the right level of abstraction to ensure they are testing the
    functionality in general, and not the implementation details?


    # TESTING INSIDE THE BROWSER


    Using console-based test runners is a really good start, and I highly recommend
    doing so for testing business logic and more "pure" pieces of application code.
    For testing server-side code, the environment makes a lot of sense because it
    runs on node as it would be for the application. On the client-side, though, things
    are somewhat different.'
