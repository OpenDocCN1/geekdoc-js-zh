    \ in nature; don't use them as a general-purpose passing mechanism.\n\n# FUNCTION\
    \ PARAMETERS AND EXISTENTIAL OPERATORS\n\nThe usual way of passing data into a\
    \ function is to use the arguments of the function, and CoffeeScript offers some\
    \ useful features that make function even more powerful. Unlike other languages,\
    \ CoffeeScript allows functions to be defined with \"default\" parameters:\n\n\
    ```\ndefault_greeting = \"Hello\"\n```\n\n```\ngreet = (greeting = default_greeting)\
    \ ->\n  console.log #{greeting}!\n```\n\n```\ngreet() = outputs Hello!\ngreet\
    \ \"HI\" = outputs Hi!\n```\n\nUnlike other languages, CoffeeScript allows the\
    \ default value of a parameter to be any expression: it could be a fixed value\
    \ like a number or a string, but it could also be a variable (as above), a calculation,\
    \ or even a call to another function. The expression is evaluated at run-time,\
    \ every time the function is called.\n\nThe function parameters are not always\
    \ the most appropriate place to construct a default value, but there are plenty\
    \ of times when a default value is needed. In the previous example of attributing\
    \ the slide, the code you liked like this:\n\n```\n# configurable attribute\n\
    active = $(slideshow).data('start') ? 0\n```\n\nNote at the end of the line the\
    \ use of an existential operator: ?. You will likely come across Boolean logic\
    \ in expressions before; for example, false or true is a valid CoffeeScript expression\
    \ and it evaluates to true. What is actually happening is that or first evaluates\
    \ the truth of the expression to its left. If it's true, the entire expression\
    \ evaluates to true automatically. If it's false, the entire expression evaluates\
    \ to the truth of the expression on the right.\n\n? operates in the same way as\
    \ or, except instead of testing for truth, it tests for existence: true ? false\
    \ is a valid expression that evaluates to true, because the left-hand side is\
    \ defined. The expression false ? true evaluates differently to the or though:\
    \ since false is also defined, the expression evaluates to false."
