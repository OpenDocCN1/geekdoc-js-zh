  md: "# CHAPTER 4 • Ajaxx Requests 79\n\n+   - Is there something you can ask the\
    \ user to do to improve the chances of success?\n- What’s going to happen if the\
    \ code fails here?\n\nToo often, developers fling their hands up at the idea of\
    \ checking for errors. After all, they rarely happen in deployed systems. But\
    \ often steps can be taken to mitigate or even solve errors.\n\nXHR requests can\
    \ fail for a number of reasons. Sometimes, they fail because of the network traffic\
    \ is interrupted momentarily, for other transient reasons—for example, they time\
    \ out, and the user gets bored waiting and tries to reload the page, and it works\
    \ the second time.\n\nParticularly maddening for users, though, is when they spend\
    \ time entering data into a system, only to find the final save fail and the application\
    \ carry on regardless, effectively throwing away their carefully crafted information.\n\
    \n# GENERATING ERRORS\n\nIt might sound strange, but one of the most positive\
    \ things you can do is use an environment in which errors can be created. Errors\
    \ rarely happen, waiting for one to occur and to see how an application fails\
    \ isn’t very efficient. Once, they’re written, error handlers aren not often tested\
    \ and although they may have worked originally, the fateful \"bit rot\" (where\
    \ working code behaving correctly, even when it hasn’t been changed) sets in,\
    \ and they cease to work as desired.\n\nCreating errors and testing how to handle\
    \ them on an ongoing basis is a really useful technique. So that you can properly\
    \ explore different ways of handling errors, allow me to introduce another bit\
    \ of the CoffeeScript server code:\n\n```\nhttp = require 'http'\nfs = require\
    \ 'fs'\nurl = require 'url'\nport = 8081\n\ncalls = 0\n\nhttp.createServer(request,\
    \ response) ->\n  query = url.parse(request.url, true).query\ntype = query.type\
    \ ? \"\"\n\n# CORS responses\nheaders =\n  'Access-Control-Allow-Origin': '*',\n\
    \  'Access-Control-Allow-Credentials': true,\n  'Access-Control-Allow-Methods':\
    \ 'POST, GET, PUT, DELETE, OPTIONS',\n  'Access-Control-Allow-Headers': 'Content-Type',\n\
    \  'Content-Type': 'text/javascript'\n```\n\n// write back data, or fail"
