  md: "# CHAPTER 3 • Web Forms\n\nwarning labels placed against them. In some instances,\
    \ an empty but required input will also\ndeserve a warning, so an additional parameter\
    \ is added to the function, defaulting to false:\n\n```\nvalidate = (form, schema,\
    \ warnRequired-false) ->\nvalid = true\n```\n\nThe goal of this validator is to\
    \ alter the user interface of the form to reflect the current\nvalidation state.\
    \ So, the first order of business is to undo any previous changes, because they\n\
    may be out of date now:\n\n```\n# remove any validation UI\nform.find('[role=alert\"\
    ]').remove()\nform.find(':input').removeClass('invalid')\n```\n\njQuery's :input\
    \ selector is incredibly useful. It matches any input, whether it's an\n<input>\
    \ node or something more exotic like a <select>. The code doesn't\n$(':input'),\
    \ though, because it would select literally all forms on the page. Using\nfind()\
    \ means you're only looking at those DOM nodes that are children of the form node.\n\
    \nThe next step is to work through the validation schema again, performing the\
    \ validation tests\nbut now adding CSS classes where appropriate:\n\n```\nfor\
    \ input in schema\nmessages = []\n\ninputNode = form.find(\"input[name=#{input.name}]\"\
    )\nvalue = inputNode.attr('val')\nif value == '' and not inputNode.attr('required')\n\
    \    next # empty, optional, inputs are valid\n\nfor test in input.valid\nresult\
    \ = validators[test.type](value, test.config)\nif not result[0] # value is not\
    \ valid\n    valid = false\n    messages.push(\"#{input.humanName} #{result[1]}\"\
    )\n```\n\n```\nif messages.length > 0 # then this input is invalid\n    addWarning\
    \ inputNode, messages.join(\", \")\n    inputNode.addClass('invalid')\nelse\n\
    \    inputNode.addClass('valid')\n```\n\nThe validator is now operating directly\
    \ on the form, most of the code is concerned\nwith querying or adjusting the DOM\
    \ node with the form. The core validation\ntest is the same as before, but it's\
    \ skipped on empty inputs, so that the validator can\nbe activated before the\
    \ user has finished the form. Without skipping, the validator will\ncomplain that\
    \ inputs the user hasn't reached been completed—annoying users,\nrather than letting\
    \ them."
  merge: -1
