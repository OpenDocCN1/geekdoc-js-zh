  md: "# CHAPTER 4 • Ajax Requests\n\nThe second parameter is more useful. If it's\
    \ timeout, the browser is waiting for a response and didn't get one; if it's abort,\
    \ the request was terminated before a response was received. parsererror means\
    \ the request succeeded but jQuery could not make sense of it (for example, it\
    \ was told it was receiving JSON but the server sent XML instead), and error covers\
    \ any error response.\n\nIt's often possible to decide a strategy to respond to\
    \ the error on the base of the second parameter:\n\n+   - timeout is likely a\
    \ networking problem and may be temporary. If the request should be idempotent,\n\
    - abort, if called by the script itself, often indicates a request not meeting\
    \ the security expectations of the browser. It is unlikely to work now or in the\
    \ future. If the script has the ability to abort requests, though this probably\
    \ isn't an error and can be justified.\n- parsererror indicates some kind of fault\
    \ on the server and usually isn't worth retrying.\n- error can indicate a variety\
    \ of faults. Select HTTP error might indicate different responses. For example,\
    \ 403 indicates that the user is not authorized. The user needs to log in access\
    \ the service, perhaps the login has expired. 502 is an internal server error\
    \ code, but indicates a temporary problem, making the original request could be\
