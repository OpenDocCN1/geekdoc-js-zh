    is to make use of a group of related principles that, taken together, are object-oriented
    programming.


    # WHAT DOES IT MEAN TO BE OBJECT-ORIENTED?


    Surprisingly, there isn’t a universally agreed upon definition of what it means
    to be object-oriented (commonly referred to as "OO”), and perhaps even more surprising,
    the term generally doesn’t refer to a set of features of a general language, but
    to a set of capabilities. Virtually no language makes it impossible to program
    in an object-oriented fashion; however, programmers tend to refer to languages
    that provide specific syntactic constructs to manage objects as object-oriented.


    Although there is no definitive list of abilities or attributes that qualify a
    language as being object-oriented, there are features that are widely associated
    with object-oriented programming that most programmers would expect to see in
    such a language: encapsulation, inheritance, and "sub-type polymorphism."


    +   **Encapsulation**: Put simply, encapsulate means to put barriers around the
    code you write, hide the implementation from using the code. This is a little
    like putting a case around a piece of electronics. For example, my radio is encapsulated
    in a box, and I’m mostly unaware of the internal implementation. It provides a
    series of buttons that I can push to it perform certain operations, in much the
    same way a library provides an API.


