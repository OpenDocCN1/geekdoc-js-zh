  md: "# CHAPTER 11 • Writing jQuery Plug-ins 23\n\n```\nif not $.contains([0], e.target)\n\
    \  hide()\n```\n\nThe first click handler does the job of the previous two. It's\
    \ bound to the overall container, and if the target is the selected element label,\
    \ then it toggles the drop-down. If the target is not the label, the handler assumes\
    \ the target is a drop-down item, and records the item's value before hiding the\
    \ drop-down list.\n\nThe second click handler is new and triggers the drop-down\
    \ to close if there is a click somewhere else on the page while it is open, copying\
