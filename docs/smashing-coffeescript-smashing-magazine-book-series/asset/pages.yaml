  md: '# PART III


    ```

    <a href="*"> Home</a>

    </li>

    <li>

    <a href="contact"> Contacts</a>

    </li>

    <li>

    <a href="tags"> &lt;tags &amp; attributes&gt;</a>

    </li>

    </ul>

