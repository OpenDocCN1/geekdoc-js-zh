  md: '# CHAPTER 13

    DATA BINDINGS AND FORM ELEMENTS


    DEVELOPING SLICK INTERFACES for web applications is all very well and good. However,
    rather than developing the next shiny web 2.0 application, often what''s really
    needed is an application that allows users to perform large-scale day-to-day data
    processing. Although much less enthralling to programmers, this kind of application
    is the meat and potatoes of web development.


    Working with a large amounts of data is one of the areas in which the web browser
    is weakest, in terms of both the development platform offered and the ability
    of the browser to store and manipulate data sets. The challenge of working in
    this area involves bringing browsers up to the standard desktop applications set,
    while addressing the unique problems faced operating on the web.'
  merge: -1
  pgno: 272
- img_proc: true
  md: "# ONE-WAY BINDINGS ONTO FORM VIEWS\n\nDesktop application developers are familiar\
    \ with the concept of a binding. Binding brings together data modeling in the\
    \ background—perhaps a simple data structure or some more complicated object—and\
    \ a user interface designed to represent all or part of that. It breathes life\
    \ into the user interface by injecting the data in all the right places.\n\nTo\
    \ some extent, developers will be familiar with one-way bindings already. When\
    \ an HTML form is created on a page, it is generally submitted back to the server.\
    \ The browser comes with a binding built in, which takes the data out of the user\
    \ interface controls and turns them into the body of an HTTP request that the\
    \ server will readily understand. Moreover, these bindings can actually be quite\
    \ complex:\n\n+   - Form elements are given names, and the values of those elements\
    \ are submitted to the server with those names.\n- Individual elements are given\
    \ a name, but name may be used once or more times within a given form—leading\
    \ to the submission of different data items with the same name.\n- Form elements\
    \ can present a label to a user that reflects the value they store, which is submitted.\
    \ An obvious example is a `select` control.\n\nThere are also rules about whether\
    \ an input has been set, whether its value is passed back to the server, and a\
    \ host of different encoding issues. In short, the browser is capable of doing\
    \ a lot of work on behalf of the humble web.\n\nDoes the browser quite enough,\
    \ though? Getting the data from the page and onto the server is useful; however,\
    \ nothing allows the data to go in the opposite direction. While from the start,\
    \ browsers were designed to be smart and capable, they were also designed to communicate\
    \ with smart servers. The general idea was that if a form needed to be populated\
    \ with data, the server was in the ideal position to do so. Of course, this design\
    \ hails from the days before AJAX, and although nothing still holds, it's not\
    \ the only way to design this sharing of data.\n\nTo do something bit more fitting\
    \ with the Web 2.0 world, you need to slightly sidestep the built-in binding machinery.\
    \ A first step is to have a binding that, given a JSON structure, can populate\
    \ a form with data and then later to do the reverse—turn the data in the form\
    \ into a JSON structure.\n\n# A SIMPLE BINDING INTERFACE\n\nIn the first instance,\
    \ all that is required is less than an interface composed of two steps: set the\
    \ form data; get the form data. Here's an example of how to work out an HTML 5\
    \ form:\n\n```\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <script\
    \ src=\"jquery-1.8.1.min.js\" type=\"text/javascript\"></script>\n  <script src=\"\
    binding_onload.js\" type=\"text/javascript\"></script>\n```\n```"
  merge: -1
  pgno: 273
- img_proc: true
  md: "```\n</head>\n<body>\n<h1>One-way binding</h1>\n\n<button id=\"set\">Set Data</button>\
    \ <button id=\"get\">Get Data</button>\n\n<form id=\"test\">\n  <p>Text field:\
    \ <input type=\"text\" name=\"field_text\" value=\"**\"</p>\n  <p>Radio buttons:\n\
    \n  <label><input type=\"radio\" name=\"field_radio\" value=\"1\"></label>\n \
    \ <label><input type=\"radio\" name=\"field_radio\" value=\"2\"></label></p>\n\
    \  <p>Check box:\n  <label><input type=\"checkbox\" name=\"field_check\" value=\"\
    1\"></label></p>\n  <p>Drop-down: <select name=\"field_select\">\n  <option value=\"\
    1\">One</option>\n  <option value=\"2\">Two</option>\n  </select></p>\n</form>\n\
    </body>\n</html>\n```\n\nThis is obviously a contrived example, but even here\
    \ some of the real complexity of forms is visible. A selection of different controls,\
    \ which behave in very different ways, is present. Outside the main form are two\
    \ controls, one set data on the form and the other to retrieve it.\n\nFor one\
    \ moment, assume that the binding is already written. In real life, such things\
    \ are rarely true—but it's often useful to start from the perspective of how something\
    \ might look, in an ideal world. The alternative of getting stuck in the implementation\
    \ of minutiae early in the process is a recipe for overly complex and over-engineered\
    \ solutions. In this case, the ideal solution for the one-way binding is simple:\n\
    \n```\n$ -> =\ndata = {\n  field_text: \"Text value\"\n  field_radio: \"2\"\n\
    \  field_check: \"1\"\n  field_select: \"2\"\n}\nnbinding = new Binding();\n\n\
    (\"#set\").click ->\n  binding.set_value(\"#test\",\", data)\n\n(\"@get\").click\
    \ ->\n  console.log(binding.get_value())\n```"
