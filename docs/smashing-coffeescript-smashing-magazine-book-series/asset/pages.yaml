    # CONVENTIONS FOR TESTING THE UI


    So far, most of the tests that have been discussed have been relatively "pure":
    testing pieces of class logic and other methods, where the goal is to ensure that
    an algorithm has been correctly implemented. Where side of testing is actually
    relatively easy: checking functions whose inputs and outputs are fundamental data
    types like strings or numbers is straightforward, and in fact most developers
    would be entirely capable of writing a test suite for those sorts of checks without
    the need for any overarching framework.


    Testing user interface components, is an entirely different practice. A number
    of systems are available to this kind of work. One that springs to mind immediately
    is Selenium, which is a browser-hosted system that can either play back recorded
    tests (which are relatively easy to create, although quite brittle in practice)
    or drive the web browser through a specific API that allows you to write tests
    that act as a user would when interacting with the web application.


    Jasmine is an entirely adequate system for doing user interface testing, but it
    does require a different frame of mind. A number of differences in the environment
    can make things interesting. The most common stumbling blocks are the types of
    optimizations that browsers make to pages to speed up the rendering process.'
