- img_proc: true
  md: 'However, Spine is by no means the game in town. jQuery is entirely useful in
    the mobile world, as are the jQuery UI widgets, for many developers, using a library
    that they''re already familiar with a great way to explore this new world.


    Additionally, though, jQuery has a specific mobile-friendly version, imaginatively
    entitled jQuery mobile, available at http://jquery.com/. The rest of this chapter
    focuses on Spine and jQuery for mobile devices.


    # SPINE MOBILE


    Spine.mobile is the name of a flavor of Spine that is aimed squarely at mobile
    phone devices, and you can access it at http://spinejs.com/mobile.


    Many of the same things that made Spine attractive here alike, too. Instead of
    Spine.mobile being a rewrite or a significant addition to Spine, it is actually
    a relatively small amount of library code that makes the development of Spine
    apps for the mobile device much easier to accomplish. Also with the main point
    of Spine, Spine.mobile is written in clear and documented CoffeeScript; it''s
    a good idea to open up the source files and take a peek.


    So, what does Spine.mobile bring to the table? The key additional features from
    your point of view as a developer


    +   - You can use the initial setup, which is aimed at mobile, right out of the
    box.

    - The specialist stage and panels enable you to develop mobile-friendly UI.

    - Transitions and events are tuned to mobile hardware.

    - Hem integration lets you build and package your mobile app into an easy-to-deploy
    bundle.


    There are other benefits as well. The combination of offline support and the ability
    to deliver an application via PhoneGap in particular means that this framework
    makes it possible to write a mobile HTML 5 application that can be packaged and
    delivered as a native application with virtually full access to the hardware on
    the device. This usage is outside the scope of this book, but it''s worth knowing
    how far you can take Spine.mobile.


    Spine.mobile is influenced by the look and feel of the various operating systems
    of Apple devices–iOS, However, as a system, it''s very easy to theme and restyle,
    either to provide a similarly integrated experience on other operating systems
    (such as Android) or it, to provide an entirely different experience.


    # Starting a Basic Spine.mobile Application


    Downloading and setting up a new project is straightforward, and if Spine is already
    available, you already have all the components you need. Getting them is simply
    a matter of asking npm for them:


    ```

    npm install -g spine.app hem

    ```'
