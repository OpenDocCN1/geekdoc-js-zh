- img_proc: true
  md: "# CHAPTER 12 • Mobile CoffeeScript Applications 249\n\n```\nif params.item\n\
    \  CartItem.create(\n    product: params.item\n    quantity: 1\n```\n\nWith other\
    \ controllers, render() can be triggered at several points during its lifetime,\
    \ in this case, the panel renders anytime the CartItem data changes. This model\
    \ hasn't yet defined but will represent the application's idea of a shopping cart.\
    \ As items are added or removed, the cart is rerendered.\n\nItems are added into\
    \ the cart via the navigation, the route setup doesn't contain the identifier\
    \ of the product the user has requested. Instead, the actual item is passed through\
    \ in the params object. The active() implementation on panel looks for the item,\
    \ and if it exists, creates a cart that represents the product. The mere act of\
    \ creating this new CartItem causes the cart to rerender.\n\nThe implementation\
    \ of render() calls for a little bit of description. The cart is a series of items,\
    \ so a .jeco template is used to produce list, but a checkout area is also required\
    \ below the items so that they can be purchased. If the cart is empty, the checkout\
    \ shouldn't be present.\n\nIt's possible to write a single ece template that performs\
    \ the looping manually and contains all the pieces of logic. This approach loses\
    \ the main benefit of the .jeco system: the cart items are no longer automatically\
    \ related to the data that produces them. This means you have to write supporting\
    \ code to work out which item is. The easier alternative is to use a couple of\
    \ different views and join them with a single container.\n\nThus, the views/cart/items.jeco\
    \ template is still quite simple:\n\n```\n<div class=\"item\">\n<div data-role=\"\
    controlgroup\" data-type=\"horizontal\" class=\"group\">\n  <a href=\"#\" data-role=\"\
    button\" data-iconpos=\"notext\" data-icon=\"delete\" class=\"del\">Del</a>\n\
    </div>\n\n<span class=\"quantity\"><%= quantity %> x</span>\n\n<%%= product?.name\
    \ %>\n</div>\n```\n\nThe users can remove items from the cart using the provided\
    \ button and can also see the quantity of the items they're ordering. As a .jeco\
    \ template, the <div class=\"item\"> is associated with the individual CartItem.\n\
    \nThe views/cart/checkout.jeco template (notice it's eco, not jeco) is even simpler:\n\
    \n```\n<div>\n<button class=\"checkout\" data-iconpos=\"right\">Checkout</button>\n\
    </div>\n```"
  merge: -1
