  md: 'The downside is that without great deal of flexibility in the layout and the
    styling attributes given on the form, it will tend to look formulaic and manufactured,
    but for many tasks, that''s actually more of a feature than a problem.


    # FORM AS MODEL, VIEW, AND CONTROLLER


    When defining objects like these, where a data schema is driving the view of something,
    as well as business logic like validation, and potentially the data storage or
    other tasks, you need to keep the concerns carefully separated. Otherwise, the
    end result is a kind of object that''s performing a variety of different tasks
    and getting bigger and more complex as development proceeds.


    It''s possible to make the form class create its own HTML markup, and in some
    ways that may seem preferable. This rendering is very closely coupled to the implementation
    of FormMapper—because it''s inspecting the schema attached to the constructor—and
    such a close coupling is usually a sure sign that the classes should be merged.


    In this instance, though, it would be difficult to completely separate the tasks
    into different logical units. Rendering is a relatively crucial task to separate
    often the same form definition will be needed in different contexts where the
    visual presentation of the form on a page must be very different. The additional
    look and feel data can be passed into the renderer, which will encapsulate the
    logic for deciding which HTML markup to use in the different scenarios.


    However, that said, the close coupling causes the classes to be highly reliant
    on each other. In a sense, it''s better to think of mapper and renderer as a suite
    of related classes, even though there is no inheritance or other technical link
    between them.


    # SUMMARY


    This has been a relatively in-depth look at different ways of working with forms
    in HTML. Although an exciting topic, forms continue to be the bedrock of many
    web applications, and you looked at some techniques that make handling forms easier
    and the use of form data more dynamic.


    Binding data to forms, whether in one direction or two, is a familiar concept
    for desktop application programmers, but web browsers have tended to have relatively
    poor support for it as a concept. However, you''ve seen with smart use of browser
    features and the important observable pattern it''s not difficult to build, and
    this can be used to make applications more interactive.'
