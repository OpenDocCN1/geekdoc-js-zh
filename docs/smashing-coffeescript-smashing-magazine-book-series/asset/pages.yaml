  md: '# 184 PART III


    In addition to the html() method on the controller, several other utility functions
    are automatically provided:


    +   - append(elements...), to add new DOM nodes to @el


    +   - prepend(elements...), which also adds new DOM nodes to @el, but does so
    by inserting it before the existing content


    +   - appendTo(element), which appends @el to either element.el itself (making
    it very convenient to use this to attach controllers to other controllers)


    +   - replace(element), which removes the existing node @el itself and replaces
    it with a new one given


    These utility functions probably feel familiar because they are similar to the
    node manipulation jQuery. The interesting side-effect of using this approach rather
    than setting attributes manually, though, that the information in @elements is
    used to update the automatically set attributes on the object, ensuring that the
    references are always correct and latest ones!


    The same goes for the handlers set up in @events: if content of @el changes at
    a later date, the correct event handlers still fire. It wouldn''t matter in the
    previous example if we were added after @events had been processed, making it
    not only simple to use this infrastructure, but also beneficial. The days of manual
    event handling be over.


    A couple of non-DOM related methods are available as well. The most useful one
    is the log() that comes from the Spine.Log mix-in. (By default it is only mixed
    into controllers, but it can be mixed elsewhere too.) If the attribute @trace
    is true on an object, a call to @log() results in a console. log(@log) call with
    the same arguments, but prefixed by the contents of the @logPrefix:


    ```

    class Example extends Spine.Controller

    ```


    ```

    logPrefix: ''[controllers.example.Example]

    trace: true

    ```


    When this controller is instantiated, the browser console shows the message [controllers.example.Example]
    Ready. With the use of @trace, the logging functionality can be turned on or off
    on a per-class basis. I highly recommend using this functionality rather than
    manual calls to console.log(). I tend to set a prefix that includes the local
    path to the file and then the class name (since a file could contain multiple
    class definitions). I also recommend leaving in logging statements that are potentially
    useful and simply turning them off, rather than removing them from the code.'
