    DEBUGGING COFFEESCRIPT


    NO MATTER HOW expert the programmer, some system debugging is always necessary.
    Developers just learning often fall back onto "printing" output to the console.
    Although this works and gives insight into the inner workings of the code, it
    doesn''t scale very far or last very long.


    As the sophistication of the code grows, so does the sophistication of the bugs;
    in fact, they tend to stay one or two steps ahead. What you need are better tools,
    and with the browser environment currently being one of the most popular development
