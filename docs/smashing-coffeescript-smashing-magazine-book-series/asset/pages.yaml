  md: "# TASKS AND THE CAKEFILE\n\nNot long after CoffeeScript was initially developed,\
    \ there was a recognized need for some kind of build tool. Build tools, such as\
    \ make and ant, are commonplace on other platforms. In general, build tools provide\
    \ a few key features:\n\n+   - The ability to express a dependency among different\
    \ source files so that they can be included together\n- An awareness of when source\
    \ files were last modified so that they're not recompiled\n- Options to compile\
    \ part of a project rather than the whole thing\n\nThe build tool for CoffeeScript\
    \ took many cues from the popular make tool, and indeed was named after it—it\
    \ called cake. And, by general consensus, although cake is a powerful tool, it's\
    \ an incredibly simple one.\n\n# STARTING WITH CAKE\n\nAlthough cake is the tool,\
    \ the most important part of the tool is actually the configuration—the Cakefile.\
    \ This is the file that defines the various tasks needed within a project, and\
    \ it's these tasks that cake executes. Without a Cakefile, cake literally does\
    \ not know how to do anything.\n\nThe definitions for tasks are written directly\
    \ in CoffeeScript, which gives you enough flexibility and a degree of responsibility\
    \ to make sure they behave themselves. Tasks depend on other tasks, which is to\
    \ say that a task can request another to be done.\n\nA basic task definition can\
    \ look very simple. Right now, take a look at an actual working Cakefile that\
    \ does something useful (you'd need to name the file, literally, Cakefile, usually\
    \ in the root directory of a project):\n\n```\nfs = require 'fs'\n\noption '-o',\
    \ '--output [DIR]', 'directory for compiled code'\n\ntask 'watch', 'Watch current\
    \ directory for changes', (options) ->\n(spawn) = require 'child_process'\nargs\
    \ = ['-w', '-c']\nif options.output\n  args = args.concat ['-o', options.output]\n\
    args = args.concat ['/']\n\nprocess.chdir = _originalDirname\n\ncoffee = spawn('coffee',\
    \ args)\ncoffee.stderr.on('data', (data) ->\n  process.stderr.write(data.toString())\n\
    coffee.stdout.on('data', (data) ->\n  console.log(data.toString())\n```"
  merge: -1
