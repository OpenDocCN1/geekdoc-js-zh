  md: '# SUMMARY


    Writing real-time applications takes understanding and care, but really isn''t
    too difficult. Thisnchapter has given you some insight into:


    +   - How real-time connections work between the browser and the server

    - The importance of thinking about the data structures being used by an application
    and how they might change for a real-time application

    - Structuring the different logical parts of an application between the client
    and the server


    I expect over the next five to ten years that many (if not most) applications
    developed for web

    brows will have some element of real-time functionality, and as support for the
    modern

    webs becomes more widespread it will lead people to think about how applications

    work in different fashion.'
