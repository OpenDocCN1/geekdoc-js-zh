    # Ajax Requests


    If the request is already "in flight" (it''s been started but not yet completed),
    the jXHR object returned by the $.ajax() call can be cancelled by calling .abort()
    on it, and the appropriate promises are automatically rejected.


    Deciding when to cancel a request (the policy) is substantially harder, though.
    At the root of it, cancelling a request effectively means dropping data that had
    been destined for the server. In many instances, this data is valuable and dropping
    it is not an option.


    Sometimes, the better practice is to warn a user that things are getting bad before
    actively starting to cancel requests. Attempting to ensure user data isn''t being
    lost is generally a good rule of thumb, and if data is at risk, not making any
    requests is better than keeping them and having them cancelled.


    # LOCAL STORAGE AND OFFLINE APPS


    You can use a variety of different strategies to make applications resilient in
    the face of network failure. Deferring until the network is working or even cancelling
    them where appropriate can result in a satisfactory user experience if it''s a
    slightly slower one.


    In some instances


    # A SHORT HISTORY OF LOCAL STORAGE


    Right from start, the earliest browsers had some form of local storage available.
    The feature that took off most quickly was the cookie, which is still in use today.
    Ostensibly designed so that browsers could retain authentication tokens and other
    user data, cookies are actually quite generous in terms of what they commonly
    offer. Up to 20 cookies for a site, with each cookie storing at least 4Kb of data,
    is a basic requirement, with most browsers offering the ability to do much more.


    Cookies have a number of downsides:


    +   - Although 20 × 4Kb is not an insignificant amount of data


    As part of the most recent efforts to reinvigorate HTML by the Hypertext Application
    Technology Working Group (WHATWG) efforts in HTML 5, the issue of local storage
    came'
