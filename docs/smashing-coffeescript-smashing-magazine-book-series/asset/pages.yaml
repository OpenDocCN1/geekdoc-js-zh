  md: 'As developers started writing graphical desktop applications, they constantly
    encountered a number of similar issues. Logic for retrieving data and business
    rules about how to treat the data were often coded so that they were embedded
    in the user interface code. This meant that whenever the user interface needed
    to be updated, all the code that fetched data for the interface needed to be reimplemented.


    Clearly, this was not the right way around. Separation of concerns became the
    watchword, and when developers analyzed their software, they found three major
    concerns:


    +   - The handling of data, validation, and business logic (models)

    - The display and editing of data (views)

    - The logic that tied the various functionalities of the software together (controllers)


    By separating certain tasks into specific pieces of software and and ensuring
    that those different parts weren''t too closely coupled, developers structured
    their software in such a way that they were able to make major changes—for example,
    changing how the software wrote data to disk—without those impacting the front-end
    user interface, and vice versa.


    As web development, particularly on the client-side, became more sophisticated,
    developers who were creating software for browsers took those lessons from the
    big desktop applications and started to apply them to the new environment. The
    MVC pattern in particular has become so popular that not only is it a framework
    for any language you can think of that implements the MVC pattern guaranteed,
    you''re almost sure to have a selection of such frameworks to choose from!


    # INTRODUCING EXPRESS.JS


    Rather than implement all the parts of a framework that you might need to write
    a substantial application in CoffeeScript, I have chosen to demonstrate a lightweight
    but popular framework—Express.js.


    By no means a full MVC framework, Express provides a standardized library of most
    of the common requirements for a server-based application. Express isn''t what
    is commonly known as an opinionated framework; instead, it concentrates on providing
    a flexible selection of functions to build a server. In this example, I use these
    features in an MVC–style. All of the ideas and principles embodied in my code
    are transferable to other frameworks.


    In my opinion, the most important part of any application is always the model,
    and because the model contains the story and the business logic, which seems a
    relatively natural conclusion to draw. However, there is some disagreement about
    this, and you will find examples of software with relatively "skinny" models that
    end up having a good degree of logic built into their controllers.


    This is particularly obvious when a developer uses a system such as Mongoose,
    which automatically handles the loading, saving, and querying of data. Because
    so much of the data'
