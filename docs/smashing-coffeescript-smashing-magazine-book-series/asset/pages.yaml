  md: "The factory includes these standard features:\n\n+   * Encapsulating functionality\
    \ in a single object\n* Associating the object with the DOM node it's applied\
    \ to, using $.data()\n* Namespacing the API to prevent name clashing or just to\
    \ keep things tidy\n* Protecting against design for a jUI widget being instantiated\
    \ more than once\n\nThe best-practice for a jUI widget is comfortable JavaScript\
    \ having been designed with that language in mind, but is less ideal for CoffeeScript.\
    \ Again, take a look at the JavaScript first:\n\n```\n// the jQuery.custom namespace\
    \ will automatically be created if needed\n$.widget(\"custom.widget\", {\n  options:\
    \ {\n    className:\"\n  },\n  create: function() {\n    // this function creates\
    \ the widget\n  },\n  do_something: function() {\n    // this is a \"public\"\
    \ method\n  },\n  _widgetfunc: function() {\n    // this is an uncallable \"private\"\
    \ method\n  },\n  _setOption: function(key, value) {\n    // this is used to respond\
    \ to option changes\n    switch (key) {\n      case \"some_option\":\n       \
