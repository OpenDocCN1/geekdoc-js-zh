  md: '# 308 PART IV


    to a known state so that, for example, if their browser crashes, they don''t lose
    their existing work (or at least, lose as little of it as possible!)


    The clear event implemented by the server is: it returns clients to the known
    state of having an entirely clear canvas. Again, this is very much over-simplified.
    Depending on the context, this type of function will be least protected by some
    measure of security and an authorization mechanism of some sort.


    Before moving on, I want to note quickly that, although the initial data is sent
    to the client using socket.emit(), the later calls are all to socket.broadcast.emit().


    # HANDLING REMOTE UPDATES


    With a server in place, it is now possible to look how the whiteboard application
    needs to be rewritten to take advantage of this new framework. There is no real
    need to change the API, but the constructor for the class will need to be updated:


    ```

    constructor: (@container) ->

    @canvas = `<canvas>`

    css(@height: @height, width: @width, border: "1px solid black")

    attr(@height: @height, width: @width) [0]

    @container).append(@canvas)


    @ctx = @canvas.getContext(''2d'')

    @is_drawing = false


    $(canvas).on("mousedown mousemove", (event) => \

    offset = $(event.target).offset(0)


    x = event.pageX - offset.left

    y = event.pageY - offset.top


    @canvas_handler(x, y, event.handleObj.type)

    ```


    At this point, the constructor is basically the same, although the previous draw()
    function has been changed to canvas_handler() to emphasize the split between dealing
    with the event and actually performing a drawing operation. After this point,
    comes though, the socket.io:


    ```

    @socket = io.connect(''http://localhost:8016/'')


    @socket.on(''initialize'', (drawing) => \

    for segment in drawing

    @draw_segment segment

    ```


    ```

    @socket.on(''clear'', \

    @clear())

    ```'
