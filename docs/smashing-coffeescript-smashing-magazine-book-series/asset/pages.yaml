  md: '# CHAPTER 2


    the names to fade in quickly rather than simply appear. You can do this in one
    line with jQuery; sorry when this single line looks unintelligible right now,
    I''ll break it down by piece:


    ```

    $ -> $("li").hide().fadeIn(300)

    ```


    There''s actually a lot of combined magic here: some jQuery, and some CoffeeScript.
    Leave the $ idiom to one side for a moment; you look at how it actually works.
    For now, all you need to know is that it means here''s code to run after the DOM
    is ready. This part is really important. If this code runs soon as the browser
    is to execute it, the DOM probably not be complete. The browser would not finish
    parsing the document (depending on where you placed the <script> tag referencing
    the code, other factors).


    So although you might want to alter the list items on the page, if the list items
    are not in the DOM yet you haven''t have anything to manipulate! You need to wait
    until the DOM is ready, and handy, the browser has a specific built-in to trigger
    that.


    The next part of the expression is no less magical:


    ```

    $("li").hide().fadeIn(100)

    ```


    There are four list items on the page, but apparently one command here. You would
    ordinarily use a loop of some to address each list item at a time (this is called
    iteration).


    The basic secret is is when you use a CSS-selector with jQuery, it always returns
    a list of nodes, or it might be in which case nothing is found, or it might be
    a list with a single item, in which case only one node is found, but it will be
    a list. When $("li) returns a list of all the <li> nodes, and the list is "wrapped"
    in a jQuery object—so you can then call hide() and fadeIn() on that returned list,
    and internally jQuery is performing the requested function on each node. The loop
    is—it''s just hidden within jQuery.


    Putting all information together and translating it into rough English, this line
    of CoffeeScript is saying "When the DOM is ready, every <li> node and hide it,
    then fade each in."


    # THE "DOM READY" HANDLER


    Earlier, I set the $ expression, and now it''s time to come back and explain it
    fully. There are a couple of twists you haven''t seen yet. The first is a little
    piece of jQuery magic: although you give $ a selector or set of DOM nodes, in
    special case you can pass it a function instead.


    Since all scripts need to wait for the browser to get the DOM into a ready state,
    at some point, you can use jQuery''s event handler support to do this, document
    is the name the browser gives the DOM structure and when the browser has finished
    parsing the HTML document receives a "ready" event.'
