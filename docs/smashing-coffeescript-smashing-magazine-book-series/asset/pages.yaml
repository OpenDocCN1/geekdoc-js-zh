  md: '# CHAPTER


    # 15


    # REAL-TIME

    WEB WITH

    SOCKET.IO


    **THE MAJOR SHIFT** to client-side technology—loosely referred to as the AJAX
    or Web 2.0—required big changes in the way web developers went about their work.
    As well as confronting greater performance issues and facing the problem of intermittent
    network connectivity, developers also must go through a change in mind set in
    order to appropriately architect an application with extensive client-side functionality.


    If there is a "next big thing," real-time functionality is it. However, along
    with the issues that client-server communications already bring the special challenges
    of real time. Rather than using the traditional request-response model, developers
    need to think more abstractly about what the client is doing and take a more general
    approach to the design of web services.'
