  md: 'Data is passed to and from the server as JSON objects as you might expect,
    but you might not have expected this persistence mechanism to load all the server-side
    objects at once. This is down for a couple of reasons:


    +   - It simplifies the process of retrieving the data, since the client never
    needs to work out which objects are available on the server-side.


    +   - Useful model features as @search() can assume that all objects are always
    available locally, instead of attempting to construct some kind of search that
    the server would understand to retrieve a subset of objects.


    These reasons are entirely understandable, but come with their own set of drawbacks:


    +   - There''s no mechanism by which the server can notify the client that an
    object has changed, making this system less useful for applications where multiple
    users are accessing the same data at the same time.


    +   - The application has to download all the available objects before it starts
    to execute, putting a practical limit on the amount of data it can sensibly with.


    +   - With this "download all" behavior the application may end up consuming large
    amounts of bandwidth.


    These compromises are unacceptable for some applications. If that is the case,
    the Spine models can be used, but a custom persistence mechanism needs to be designed.


    One way of reducing the load is to download lists of object identifiers in the
    first instance rather than the entire objects, and lazy load objects as needed.
    Equality, the search mechanism could be restricted in functionality to enable
    the handling of queries on the server-side. Which approach is the best will depend
    on the application.


    # SUMMARY


    In this chapter you took a speedy, but relatively deep, look at Spine. As a web
    application framework Spine is lightweight, but it provides a variety of crucial
    features that much larger and more impressive impressive systems are all built
    around:


    +   - The Model-View-Controller design pattern is a template for architecture
    coding.


    +   - Stylus—a CoffeeScript-like solution for CSS—has a powerful, expressive syntax
    that can be used to solve practical development problems.


    +   - Eco is an engine for templating HTML code, and the jEco system is useful
    for binding the resulting templates with the data that drives them, simplifying
    click handlers and view-level logic.


    +   - Controllers can be used to decouple functionality and provide a high-level
    navigation and interface control mechanism.


    +   - Lastly, Spine''s data model support was to demonstrate how model-based events
    can help you keep the view up to date while still keeping code loosely.'
