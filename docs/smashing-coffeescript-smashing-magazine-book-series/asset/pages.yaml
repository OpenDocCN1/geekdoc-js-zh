  md: "# CHAPTER 15\n\n# SHARING MODELS\n\nBecause you are at the business end of\
    \ the codebase, it can be tempting to allow the key logic of an application to\
    \ be used on the client-side—for example, to use it to validate data entry before\
    \ data is sent back to the server. I've also seen developers attempt to abstract\
    \ their data storage model sufficiently for it to be used with a server-side technology\
    \ such as MongoDB and client-side offline technology as `indexedDB`. In general—and\
    \ I don't say this lightly—attempts are doomed to fail.\n\nThis is an excellent\
    \ example of how the similarity between the platform tends to hide the different\
    \ considerations. On the server side, where many requests are coming in from different\
    \ users, performance is crucial in terms of speed of execution and memory consumption.\
    \ The potential cost could be disk space needed to ensure that queries complete\
    \ as quickly as possible—for example, when the database indexes a large data set.\n\
    \nOn the client-side, the requirements are almost entirely the opposite. The performance\
    \ doesn't matter so much, because there's a single user and only that user's data\
    \ is on the system, rather than multiple users and their associated data. Equally,\
    \ the amount of storage *does matter* a fair amount, because all the local storage\
    \ mechanisms have limits on how much data they can store—extreme data that isn't\
    \ absolutely needed by the client in offline mode shouldn't be stored.\n\nIt's\
    \ very difficult to make the shared model or model-level logic make sense for\
    \ most applications. The requirements in the server and client environments are\
    \ very different, and sooner or later one of the side—or even both—will end up\
    \ worse because of the compromises made to ensure that the code remains compatible\
    \ for both consumers.\n\n# DEALING WITH CALLBACK PYRAMIDS\n\nDeveloping an event-driven\
    \ application usually means making use of asynchronous APIs—function calls that\
    \ take a callback function as an argument, and complete immediately without having\
    \ any work done. The callback function is later called when the work requested\
    \ is. True in the browser and we see in Chapter 14 that server-side code running\
    \ node.js is heavily event-driven. For an application working in real-time on\
    \ the server side, it becomes even more important: every piece must be asynchronous.\
    \ This results in heavy use of callbacks.\n\nA callback refers to a block of code\
    \ that relies on a number of callbacks that depend on each other. Usually this\
    \ would be where there are a number of separate calls to read files or access\
    \ a database. Imagine a server-side view that would automatically log users into\
    \ their account, creating an account if one did not exist and then updating the\
    \ “last logged in time:\n\n```\nauto_account: (req, res, next) =>\n  params =\
    \ req.body\n```"
