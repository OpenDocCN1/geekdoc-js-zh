  md: "One validation task remains: to find inputs that are required but don't have\
    \ a specific entry in the schema associated with them. If they've been completed,\
    \ you need to ensure they are marked as valid:\n\n```\n# find any non-validated\
    \ required fields, and mark them valid if filled\nfor inputNode in form.find(':input[required]')\n\
    \  value = $(inputNode).val()\n  if value != \"\" and not $(inputNode).hasClass(\"\
    invalid\")\n    $(inputNode).addClass(\"valid\")\n  else if value == \"\"\n  \
    \  valid = false\n    if warnRequired\n      addWarning inputNode, \"This field\
    \ is required\"\n```\n\nreturn valid\n\nThe new warnRequired parameter. If set\
    \ to true, it marks empty required with a warning as the input were invalid. This\
    \ alerts users about missed inputs when they attempt to submit the form, but users\
    \ shouldn't be bothered with these warnings before they've finished the form—the\
    \ input is already marked with a yellow bordering, indicating that it's required.\n\
    \nThe final change is that this validator simply returns true or false, rather\
    \ than return the various validation messages. Because the messages are now being\
    \ inserted directly into the page, there's no need to pass them back.\n\n# CONTINUOUS\
    \ VALIDATION\n\nTriggering validation on form submissions makes a lot of sense.\
    \ After users input all the data that they think is required, checking their work\
    \ before sending it to the server is logical. That's not the only way of validating,\
    \ though. Running validation earlier gives the user an opportunity to correct\
    \ data they've just entered.\n\nThe validation code just discussed goes to some\
    \ points to avoid unnecessary pop-up warnings. It can be triggered at any point,\
    \ and it should adjust the form so that potential problems with the data entered\
    \ are highlighted, but it won't complain about data not yet entered.\n\nBecause\
    \ the validator can now run at any point, it makes sense to run it early and often,\
    \ as shown here:\n\n```\nform = $('#feedback')\n\nvalidationHandler = (event)\
    \ ->\n  warnRequired = event?.type == \"submit\"\n  if not validate(form, loginValidation,\
    \ warnRequired)\n    event.preventDefault()\n```"
  merge: -1
