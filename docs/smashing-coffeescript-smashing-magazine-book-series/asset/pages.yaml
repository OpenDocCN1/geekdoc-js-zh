  md: "# 174 PART III CoffeeScript Application Development\n\ncolors where needed,\
    \ it's now possible to say “that color, but 10% lighter,” and that's what Stylus\
    \ outputs.\n\nBy the way, variables don't need a $ prefix to be treated as such.\
    \ That's simply my personal preference; I find it helps to highlight the terms\
