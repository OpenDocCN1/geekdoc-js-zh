    ```


    Generally, the output JavaScript is pretty-printed, which is to say that it''s
    indented correctly and each statement appears on its own line. With the debugger
    statement, though, the line is combined with the next line in the code. This is
    actually really useful: When the breakpoint is triggered, it''s triggering on
    the next line of CoffeeScript.


    Using the debugger statement is an accurate way of pinpointing the execution of
    the program and which part of the original CoffeeScript is being referred to.


    # USING ACEBUG


    Firebug is very helpful: Almost single-handedly, it turned Firefox into a useful
    development platform and has become one of the most popular plug-ins for the browser.
    However, it''s also worth mentioning Acebug, which is effectively a plug-in for
    Firefox.


    Like Firebug, Acebug is available from the Mozilla Add-Ons directory, where you
    can find it at https://addons.mozilla.org/firefox/addon/acebug.


    Acebug adds a few features to the main Firebug UI, rather than providing something
    completely different. It enables the source views within Firebug to show source
    with syntax highlighting, for example. But the main reason for interest is that
    it extends Firebug so you can evaluate CoffeeScript at runtime.


    Once installed, Acebug adds little more than a simple up-arrow button to the main
    Firebug interface. This button is located in the far-right side of the console
    input. Click this button to open the more powerful Acebug console window showing
    in Figure 8-3.


    To begin with, the console expects JavaScript. Press Shift+Return to open an Acebug
    command prompt, and use lang=cs to switch the console into CoffeeScript mode.
    After that, all the script typed into the console is expected to be CoffeeScript,
    and this can be run using the controls beneath the window. Scripts can also be
    loaded and saved, which can be useful when you''re loading specific code to debug.


    However, as useful as the Acebug console is, there''s a big difference between
    being able to type in CoffeeScript and test how it works and being able to directly
    debug the CoffeeScript source within the context of the browser. Reading the JavaScript
    and understanding how it''s translated allows broader use of the existing JavaScript
    debugging tools, but a piece is still missing—source maps.'
