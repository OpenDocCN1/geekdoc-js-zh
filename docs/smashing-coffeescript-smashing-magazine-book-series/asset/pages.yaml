  md: "# Adding the Shopping Cart\n\nThe add to basket action was left hanging on\
    \ the product page, and indeed the all-important cart hasn't yet been completed.\
    \ You can remedy that now.\n\nThe first step is to use jQM to render buttons and\
    \ pass the information about the product through the cart:\n\n```\nclass ProductView\
    \ extends BasePanel\n\nevents:\n  'click .addToBasket': 'add'\n\nrender: =>\n\
    \  return unless @item\n  @Html require('views/product/view')(@item)\n  @SetTitle\
    \ @item.name\n  @el.find('.productview').button()\n\nadd: (e) =>\n  @navigate\
    \ 'cart'\n  item: @item\n  trans: 'right'\n```\n\nEvery time render called, the\
    \ button is upgraded with jQM. That's because every time the template engine is,\
    \ the previous markup is entirely replaced. This seems somewhat wasteful, although\
    \ the truth of the matter is that Spine goes to great lengths to reduce this.\n\
    \nWhen the Add button is clicked, the item in question has already been saved.\
    \ It's set to this item when this panel is activated, the job is merely to communicate\
    \ that information to the cart. In this instance, it's done via the navigation\
    \ system.\n\nA few schools of thought exist on how best to do things like this.\
    \ Generally, putting an ID in a URL and requesting that the state of something\
    \ (like a cart) would be pretty bad form, but this is a closed navigation system,\
    \ and URLs aren't really being used.\n\nYou can add the item directly from this\
    \ controller. This is poor design: The product page would be coupled closely to\
    \ the cart implementation, and if the cart ever needs to change, the product page\
    \ must also change.\n\nAnother, much better solution is to use a synthetic view.\
    \ Previously, I advocated listening for these on the <body> of the main document\
    \ as convention. In the mobile environment, these can be bound to the global state\
    \ instead. For simplicity here, I've used the navigation to pass through the data.\n\
    \nAs there's no cart controller; however, this again is not a complex affair:\n\
    \n```\nSpine = require('spine')\nBasePanel = require 'controllers/basepanel'\n\
    ```"
  merge: -1
  pgno: 262
