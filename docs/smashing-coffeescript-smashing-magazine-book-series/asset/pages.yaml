  md: 'To be notified of the event handler needs to be attached to document, and a
    handler is simply a function that takes the code you executed when the event happens.
    In this example the handler can look like this:


    ```

    callback = -> $(li).hide().fadeIn(300)

    ```


    This says that callback is a function that takes no arguments. When called the
    callback function manipulates the list on the page. To attach it to the DOM-ready
    event you just call $(document).ready(callback), and the browser is responsible
    for calling the function when the DOM is ready.


    This is such a common pattern, or idiom, that has a special case: if you pass
    a function into $,Query assumes the function is a DOM-ready callback. That makes
    these two expressions equivalent:


    ```

    $(document).ready(callback)

    ```


    ```

    $(callback)

    ```


    You now have virtually all the pieces of the puzzle. The last piece is that the
    callback function doesn''t need to be assigned to a variable. Because you don''t
    need to give it a name, it can be passed into jQuery directly:


    ```

    $->$(li).hide().fadeIn(300)

    ```


    Since the parents enclose the entire function definition they can be left out
    (ensuring you leave a space between $ and -> and finally you arrive at the original
    code.


    You might be forgiven for whether all this cleverness is worth it; the code is
    short, but at what expense? In my opinion, this illustrates the natural fit of
    CoffeeScript to web programming and particularly when partnered with jQuery; in
    general, the syntax doesn''t have much impact on readability or comprehension
    in these types of situations. Common patterns were designed to be terse because
    they are used time and again. There are some idioms in CoffeeScript that take
    some time to get used; once you''re over that particular hump things quickly start
    to feel natural, and you''ll find the expressive power of language language probably
    its key feature.


    # SELECTORS, NOW EVEN MORE USABLE


    To recap one of the key pieces of the jQuery API: When you''re selecting nodes
    from the DOM, you always get back list (also called an array), no matter whether
    there are nodes, one node, or many. Fundamentally, a lot of jQuery functions operate
    on lists, and while chaining jQuery functions together hides that somewhat, that''s
    is happening underneath.


    Sometimes the jQuery functions are not enough, and you need to step outside of
    the jQuery API. A common requirement is to operate in a more sophisticated way
    on a set of nodes, or to build data structures from them.'
