  md: '# 128 PART II • CoffeeScript Projects


    An in-browser test runner is also an excellent addition to the testing arsenal
    for a number of reasons:


    +   - Much of the client-side code tends to be concerned with UI. This means running
    in an environment that has a working DOM.

    - Different browsers present different environments. Having an in-browser test
    runner allows the same suite of tests to be deployed against different browsers,
    ensuring compatibility.

    - Often, the more graphical test runners are simply easier to use.


    However, an in-browser test runner has a few downsides. Obviously, the code being
    tested needs to run in that environment, so this approach is not appropriate for
    testing pieces of server code, although specific functionality can be tested,
    and some browsers do not perform as well as others, leading to some test taking
    a little to run.


    To start some in-browser testing, first download the Jasmine stand-alone release
    at https://github.com/pivotal/jasmine/downloads.


    Right now, this package is distributed as a ZIP archive containing various files
    and directories:


