    \ it produced:\n\n```\n// Generated by CoffeeScript 1.4.0\nfunction() {\n\n  window.onload\
    \ = function() {\n    var textbox;\n    textbox = document.getElementById(\"textbox\"\
    );\n    return textbox.appendChild(document.createTextNode(\"Time to make coffee!\"\
    ));\n  };\n}.call(this);\n```\n\nImmediately, it's clear that the original CoffeeScript\
    \ is more concise than the resulting JavaScript—in general, will be true of most,\
