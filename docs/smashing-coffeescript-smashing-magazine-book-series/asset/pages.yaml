  md: '# CHAPTER 1 Starting Up Your CoffeeScript Environment


    servers) to allow developers to download and install "packages" of software alongside
    their own applications, and maintain the list of packages (or "dependencies")
    required to run the application.


    npm provides you with solutions to all these types of problems:


    +   - Instead of making you search for different tools, npm has a single public
    directory that anyone can search (and even publish code to!).

    - Instead of making you download that tool you requires, npm can automatically
    fetch the dependencies and install them for you.

    - Instead of making you manually update the installed tools, npm can automatically
    refresh them to the latest version upon request.


    If you''ve used a packaged operating system, such as one of the GNU/Linux distributions
    or one of the "parts" style systems on Mac OS X or Windows, this type of setup
    will be immediately familiar. Like many of the better package managers, npm gives
    you another option: You can install tools globally, but also locally—that is,
    you can make the tools available on a per-project basis. It''s entirely possible
    to use a cutting-edge version of a tool in one project and an older one in another,
    giving you control over when updates to production tools happen.


    # INSTALLING COFFEE USING NPM


    Because npm is a key part of the node, by far the easiest way to get npm is to
    install node.js. Doing so installs the package manager and gives you a command-line
    JavaScript environment through which you can execute CoffeeScript and the various
    build tools you''ll need later on.


    The latest node.js download options can be found here: http://nodejs.org/download/.


    For Windows and Mac OS X, there are standard binary installers that install the
    node.js tools for you. On other operating systems, there are various third-party
    binary packages and installers that are generally preferable to compiling node.js
    from source.


    # A QUICK TOUR OF NPM


    npm is designed to be used from the command line. On Windows, you can choose Command
    Prompt from the Accessories section of the Start menu to access the command line.
    On Mac OS X, the application is called Terminal and lives in the Utilities folder.


    For those of you who aren''t command-line interface (CLI) aficionados, don''t
    worry; although npm is text-based, it''s difficult to get lost in. To begin with,
    it''s always useful to know where the help is. Type npm help at the command prompt
    to retrieve a list of available commands and npm help <command> to get more guidance
    on a specific command.'
