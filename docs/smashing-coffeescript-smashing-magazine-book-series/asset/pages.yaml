  md: '# CHAPTER 12 Mobile CoffeeScript Applications 231


    If you haven''t yet read through the part of this book that covers Spine (Chapter
    10), I recommend doing that first before going much further. The mobile framework
    is built upon the standard Spine framework, and you will need to feel comfortable
    with the basic Spine concepts before moving on to the differences in the mobile
    version.


    Setting up a new project can be done with the spine command, but this time tell
    tell it that the project is a mobile one:


    ```

    spine mobile ./application

    ```


    Once spine is finished, the directory tree looks almost identical to a regular
    Spine app. The only difference is the addition of a theme.style file in the css
    directory.


    Starting the application, before any modifications, is also the same: grab any
    additional modules you need locally and start them:


    ```

    npm install

    hem server

    ```


    hem displays the IP address and port that it''s listening to, by default 0.0.0.0:9294.
    Ordinarily, this would translate to the URL http://127.0.0.1:9294/, although you
    may need to change the port number if hem has not been able to open the default
    port. Accessing the URL in the browser confirms that things are working properly,
    as shown in Figure 12-1.


    ![](img/e3ca65867e7abc9da32dd88bfc67c4e4_246_0.png)


    Figure 12-1: The Spine.mobile home page opens in your browser.'
  merge: -1
  pgno: 246
- img_proc: true
  md: "# 232 PART III\n\nThe key entry point to starting up the application is in\
    \ public/index.html, and this startup page is displayed by the \"Getting Started\"\
    \ script added to that page—one of the first steps to beginning to use the project\
    \ is to remove that script.\n\nAs in a regular Spine application, everything else\
    \ is bundled by them: the models, controllers, and other pieces of code are turned\
    \ into a single application.js file, and the style sheets are processed and compiled\
    \ similarly. However, from this point, things begin to get a little different.\n\
    \n# Setting the Stage (and Panels)\n\nSpine makes two key facilities available\
    \ in its mobile variant: the global stage and panels. Most users of mobile applications\
    \ are familiar with the transitions that applications use to go from one page\
    \ to another. They usually orient a to the fact that progress forward is a transition\
    \ to the right, whereas going back is a transition to the left. To facilitate\
    \ these transitions, panels are used to hold the parts of the user interface so\
    \ that they can be swapped on and off as needed.\n\nUsing panels is all very well,\
    \ but they need to be tied together somehow, and the object that does so is called\
    \ the stage. In general, an application has a single stage containing multiple\
    \ panels; the application itself is an instance of the global stage.\n\nSpine\
    \ generates the markup for these elements instead of requiring you to create them\
    \ manually; the main index.html file generally has an entirely empty <body> tag,\
    \ but it's useful to take a look at what it's creating:\n\n```\n<body class=\"\
    stage\">\n<header></header>\n<article class=\"viewport\">\n  <div class=\"panel\
    \ active\">\n    <header></header>\n    <article></article>\n  </div>\n  <div\
    \ class=\"panel\">\n    <header></header>\n    <article></article>\n  </div>\n\
    </article>\n<footer></footer>\n</body>\n```\n\nThis markup demonstrates a single\
    \ stage containing two panels, the first of which is active. The first thing to\
    \ notice is the use of HTML 5 tags. The semantics of the header, article, and\
    \ footer are translated directly into the interface of the phone. (See Figure\
    \ 12-2)."
  merge: -1
  pgno: 247
