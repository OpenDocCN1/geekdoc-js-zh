  md: 'I use the feature set of this database sparsely; my reason for choosing it
    is the simplicity and maturity of the API for Node.js. A database speaking a dialect
    of SQL is another good choice, and in many cases, the transition to such a system
    isn''t complicated.


    # WRITING A SIMPLE SERVER


    In chapter 4, I examined the detail of an HTTP request from the point of view
    of the client. From the perspective of the server, things are much the same:


    +   - Incoming HTTP requests are primarily identified by a verb such as GET or
    PUT and a URL including hostname and document path, but they also include a variety
    of headers and potentially a response body.

    - The server deals with the request and issues a response, which consists of headers
    and a response body.

    - A client may issue a few requests simultaneously, and as HTTP is generally stateless,
    some mechanism such as cookies are required to correctly identify the same client
    over a number of requests (simultaneous or not).


    From experience with asynchronous server-side calls, you probably won''t be surprised
    that the response on the server-side is also asynchronous—and then some. To deliver
    the scalability for which it is famous, Node.js requires that software gives up
    the thread of execution as early as possible (known as yielding) so that other
    parts of the software can run.


    At first, this may seem jarring. Although server-side calls are asynchronous in
    the browser, not much else is. For example, storing data in a cookie or using
    local storage is generally synchronous. On the server-side, any operation that
    cannot be immediately fulfilled is a candidate for an asynchronous interface—for
    example, reading from disk, which from the perspective of a computer is an incredibly
    slow process, is asynchronous.


    # USING MONGODB


    To illustrate the requirement to write code as asynchronously as possible, you
    begin your exploration of the world of server-side Node.js deep in I/O territory—in
    the database. Although requests to a database are generally easy to state (for
    example, Fetch me all the documents for this user) the computation and calculation
    that the database undertakes is often significantly more difficult and may take
    tens or hundreds of milliseconds. While that doesn''t sound like all, add thousands
    of clients, and it becomes tens or hundreds of seconds, which is an altogether
    different proposition.


    Unlike other database systems, MongoDB doesn''t require a formal schema for the
    data it holds—it can be passed as a set of data in JSON format, and it will store
    it. This document-oriented approach is at odds with the traditional relational
    approach of the SQL database server and may be better or worse, depending on the
    type of workload.


    Rather than accessing MongoDB directly, I demonstrate the use of Mongoose, which
    is known as an object document mapper (or ODM). Using an ODM requires the specification'
