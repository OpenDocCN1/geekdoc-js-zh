  md: 'A function called doRotation() is defined, and this is where the images on
    the page are swapped over. First, it starts a jQuery animation to move the current
    panel to the left–back onto the deck. Then, it starts by moving the next panel
    off-screen to the right (which happens immediately), and then animates this panel
