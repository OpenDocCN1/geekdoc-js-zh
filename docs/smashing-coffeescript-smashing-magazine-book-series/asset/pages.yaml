  md: "# 234 PART III\n\nseparate header and content area rather than entire container.\
    \ (The stage, because it contains everything including the footer, can be transitioned\
    \ as a single container.)\n\nTwo utility functions at the panel level are worth\
    \ mentioning:\n\n+   - setTitle(title) is used to change the text of the title\
    \ in the header of this panel.\n- addButton(text, callback) is used to add a button\
    \ to the header of the panel.\n\n# CREATING AN E-COMMERCE SHOP\n\nTo show you\
    \ the power of the system, I'll walk you through some of the steps for setting\
    \ up an e-commerce shop using Spine. The idea here is generally known as m-commerce\
    \ (mobile commerce) destination—that is, putting together an application that\
    \ allows users to find the products they're looking for and taking them all the\
    \ way to purchase in a mobile-friendly environment.\n\n> I'm covering the build\
    \ of the application step by step, but there is quite a lot of code covered in\
    \ this chapter. I'd like to remind you that you can download the full source to\
    \ this application at http://wiley.com/go/smashingcoffeescript.\n\nUsers access\
    \ the application with one hand, so the interface is thumb-driven: Important buttons\
    \ are near the bottom, and the user navigates through scrolling with swipes and\
    \ tapping large buttons.\n\nThe first step is to put together the home page. Right\
    \ now, there's a bare-bones application in app/index.coffee, and no models, views,\
    \ or controllers. I like to put important pages, such as the home page, in their\
    \ own controllers—for no other reason than they tend to grow old features and\
    \ defy attempts to standardize them.\n\nThe first step is to create a new controller\
    \ called Home. This can be done manually, by running the command spine controller\
    \ home will set up the basic controller for us in controllers/home.coffee. Update\
    \ the controller so that it looks like this:\n\n```\nSpine = require 'spine'\n\
    Panel = require 'spine.mobile'\n\nclass Home extends Panel\n\ntitle: 'Toy Shop'\n\
    \nconstructor: ->\n  super\n\n  routes\n    '/home': (params) -> @active(params)\n\
    \n  render()\n```"
  merge: -1
