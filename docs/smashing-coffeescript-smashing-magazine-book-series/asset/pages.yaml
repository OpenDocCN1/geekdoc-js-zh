    the main ones; LocalStorage and IndexedDB.


    # LOCALSTORAGE


    The first solution that was proposed, and that received considerable support in
    the beginning,

    goes by the not-entirely-imaginative name of LocalStorage. It''s implemented in
    virtually\every browser enjoying market share today (excluding Internet Explorer
    before version 8) and

    is implemented to a surprisingly consistent standard.


    LocalStorage directly solves many of the local storage issues that web applications
    face:


    +   - Although storage area size is not guaranteed, browsers so far have consistently
    allowed up

    to 5M of data to be stored.

    - Browsers may ask users if they will allow the application to store information
    locally, but

    once received, this permission is stored for the future.

    - The interface is well-supported and incredibly straightforward.


    Using LocalStorage is not much more complex than accessing an object within Coffee-

    Script. As always, it is useful to test whether the features exist:


    ```

    if window?.localStorage is null

    console.log("Local storage is not supported in this browser!")

