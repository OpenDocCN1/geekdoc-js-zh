  md: "# CHAPTER 2 • Using jQuery: DOM Manipulation 37\n\n```\ncontrol = $('<button</button>'.insertAfter(slideshow))\n\
    ```\n\nYou haven't seen jQuery like this before: You've seen nodes passed to it,\
    \ you've seen CSS selectors passed to it, and you've also seen the special case\
    \ of passing a function to it. But in this instance of HTML markup is being passed\
    \ as a string. What's that doing? This is another nifty jQuery shortcut: in the\
    \ same way that a browser opens an HTML document into a DOM tree, this short cut\
    \ parses an HTML fragment into a DOM fragment, ready to insert into the DOM. The\
    \ call to insertAfter() does what you would expect: it takes the DOM fragment\
    \ that was created, and inserts it into the slideshow-node that was originally\
    \ passed into the rotator() function.\n\nWith the control button in place, you\
    \ can now create functions to start and stop the timer which calls the slideshow\
    \ rotator setInterval() passes back a reference to the timer when it is created\
    \ and can be used later to cancel it:\n\n```\ntimer = null\n\ndoStart = ->\n \
    \ timer = window.setInterval(doRotation, duration)\n  control.text(\"Pause\")\n\
    \ndStop = ->\n  window.clearInterval(timer)\n  timer = null\n  control.text(\"\
    Unpause\")\n```\n\nThe variable timer is set to null to begin with ensure that\
    \ you have it in scope. Without, the lexical scoping rules, timer in doStart()\
    \ would be a different variable to timer in doStop(), and the whole thing would\
    \ not work.\n\nAll that is left to do is set up the click handler and set the\
    \ slideshow in motion at the start:\n\n```\n$(control).click ->\n  if timer then\
    \ doStop() else doStart()\n```\n\nNo preventDefault() is needed on this handler,\
    \ because a plain <button> has no default action. By defining a specific internal\
    \ function to start the slideshow itself, the startup and the click handler are\
    \ quite DRY as well. At only one point in the code is the slideshow actually started,\
    \ even though that might start in two different circumstances.\n\n# GENERAL EVENT\
    \ HANDLING\n\nAs you might imagine, there are many different types of events other\
    \ than simple mouse clicks. The click handler setup is a shortcut to a more general\
    \ form of event handler:\n\n```\n$(control).on \"click\", (event) ->\n  if timer\
    \ then doStop() else doStart\n```"
