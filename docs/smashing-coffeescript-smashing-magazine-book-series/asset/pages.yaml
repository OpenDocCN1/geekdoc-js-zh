  md: "A simple way of adding the calendar controller into the application is to modify\
    \ the root\ncontroller in app/index.coffee:\n\n```\nclass App extends Spine,\n\
    ```\n\n```\nconstructor: ->\n  super\n  @calendar = new(\"controllers/calendar\"\
    )()\n  @calendar.appendTo(@)\n```\n\nAll that has been added here are two lines.\
    \ The first creates only one controller exported from the app/controllers/calendar.coffee\
    \ file, there isn't a need to refer to the class name of the controller directly.\
    \ This pattern\nis quite common in Spine applications, particularly with view\
    \ templates. It's concise and\ncontains the file name reference right where the\
    \ call is being made.\n\nThe alternative would be to do something like Calendar\
    \ = require(\"controllers/calendar\") at the top of the file, and call new Calendar\
    \ () later. This alternative is less\nconcise, but isn't a problem unless the\
    \ controller is accessing a large number of templates.\n\n# STACKING CONTROLLERS\n\
    \nMost applications developed under a framework like Spine are intended to be\
    \ single-page\napplications, sometimes referred to as Rich Internet Applications\
    \ or RIAs. There are two key\nSpine features that you architect the application\
    \ easily from the start: stacks, which ensure that\nonly one controller in a group\
    \ is active at any one time, and routes, which map URLs to\ncontrollers.\n\nThese\
    \ two features can be used separately, but I think they're most valuable when\
    \ used\ntogether. For example, a stack = require(\"spine/lib/manager\").Stack\n\
    \n```\nStack = require(\"spine/lib/manager\").Stack\n{PageView, PagePrint, PageEdit}\
    \ = require(\"controllers/pages\")\n```\n\n```\nclass Pages extends Spine.Stack\n\
    \ncontrollers:\n  view: PageView\nprintable: PagePrint\nedit: PageEdit\n```\n\n\
    ```\nroutes:\n  /pages/:id: 'view'\n  /pages/:id/print: 'printable'\n  /pages/:id/edit:\
    \ 'edit'\n```\n\n```\ndefault: 'view'\n```"
