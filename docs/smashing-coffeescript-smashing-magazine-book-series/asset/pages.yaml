  md: '# ANATOMY OF A JQUERY PLUGIN


    The jQuery library was first published, it was seen as a compatibility library—a
    kind of shim that developers could use to smooth over the various cracks in different
    browsers so that they could get on with the real work of developing web applications.


    It didn''t take long, though, for other developers to start adding functionality
    to jQuery, and in fact the first plug-in arrived at the end of January 2006—some
    two weeks after the main announcement of jQuery (although jQuery had, at that
    point, been in development for months).


    As with any system of extension, you might wonder why it should be an extension
    at all. As an open-source project, coding additional functionality and contributing
    it shouldn''t be a problem—assuming, of course, that the code is good enough!


    Good plug-ins tend to have one or more of the following features:


    +   - They implement functionality that is at a higher level of abstraction than
    the rest of the library, and could be seen as simply a grouping of lot of lower-level
    functionality.

    - They implement functionality that is of narrow interest—only a small minority
    of the user base is likely to use it.

    - There is no compelling reason for the plug-in to be in core because it doesn''t
    need to access internals or make use of any other special privilege.


    Indeed, in my opinion, the last reason is particularly good. For the same reason
    developers use object-oriented design, design by contract, or use of any the other
    methods of decoupling code, keeping code separate from other code as possible
    and making use of a small but well-understood shared API is a fundamental aspect
    of software development that pops up in many different ways.


    Using plug-ins provides a great way of packaging self-contained functionality.
    With jQuery, they are particularly good at adding behavior or user-interface functionality
    to a page. Some words of warning though: First, plug-ins have an incredibly limited
    API and include certain restrictions on how they can be accessed. Second, they''re
    no panacea—by self-contained functionality, I mean something like a drop-down
    menu or a type of animation. A application is no doubt self contained; however,
    it is far too complicated to design within the framework of a plug-in. If a plug-in
    ends up being more than three or four pages of code, it''s probably too complicated
    and should be broken up.


    # CREATING A SKELETON PLUGIN


    This is another rare occasion where a JavaScript appetizer needs to come before
    the main course of CoffeeScript. Because this is a JavaScript library, the majority
    of the documentation for plug-ins (available at http://docs.jquery.com/Plugins/Authoring/)
    is written with JavaScript in mind. The best-practice skeleton is particularly
    insightful, so it''s the starting point:'
