  md: "# CHAPTER 11 • Writing iQuery-plugins 223\n\nBoth jqUI and CoffeeScript do\
    \ the same work. To allow one widget to extend from another, jqUI puts in place\
    \ a somewhat classical-looking inheritance hierarchy in the same way that CoffeeScript\
    \ does with its class definitions.\n\nHowever, although both pieces of software\
    \ are trying to achieve the same thing, they go about in a different way, which\
    \ can cause problems to combine the two systems. As an example, a method on a\
    \ CoffeeScript object can have a bound version of this, whereas a jqUI widget\
    \ generally won not. If a CoffeeScript object inherits from a jqUI one and calls\
    \ the superclass from a bound, weird things happen.\n\nTake a step back at this\
    \ point, though. What is the jqUI widget actually doing for you? The factory is\
    \ made up of several different pieces:\n\n+   - $.widget(): This is the main entry\
    \ point to the factory, but it mainly concerns itself with the functionality for\
    \ this inheritance hierarchy.\n\n+   - $.widget.extend(): This mixes one object\
    \ into another.\n\n+   - $.widget.bridge(): This is the function that converts\
    \ a single function call on the jQuery object to a series of method calls on the\
    \ widget object.\n\n+   - $.Widget(): Not to be confused with its lowercase brother,\
    \ but this documents the interface that widgets should conform to.\n\nLooking\
    \ at the preceding parts, you can see that $.widget.bridge() is definitely interesting,\
    \ and $.widget() is sort of interesting, but you could probably do without the\
    \ rest of it. And it turns out that this is actually true. CoffeeScript developers\
    \ don't get as much out of the full factory as JavaScript developers do. Most\
    \ of the work the factory is doing is already done by CoffeeScript, and it doesn't\
    \ make sense to merge the two somehow.\n\nOnce the main widget factory is set\
    \ aside, you're free to write a class hierarchy that makes sense and uses the\
    \ CoffeeScript-native features.\n\nOne thing the widget factory does is call the\
    \ _init() method of a new widget when it's set up that a base class can be created\
    \ to mimic that functionality:\n\n```\nclass jQueryUIWidget\n  options: {}\n\n\
    \  constructor: (options, @element) ->\n    options = $.extend(@options, options)\n\
    \    if @widget_name\n      $(@element).data(@widget_name, @)\n    _init()\n\n\
    \  widget: =>\n    @element\n\n  init: =>\n    _setOption: =>\n    refresh: =>\n\
    ```"
  merge: -1
  pgno: 238
