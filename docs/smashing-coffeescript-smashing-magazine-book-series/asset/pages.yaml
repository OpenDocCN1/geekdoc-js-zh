  md: "# CHAPTER 8\n\nNamed \"CoffeeScript Redux,\" this compiler is entirely compatible\
    \ with Ashkenas’ CoffeeScript brings to the table some exciting features:\n\n\
    +   - It parses source code to abstract syntax trees, working in phases; this\
    \ allows the compiler to optimize the code, for example.\n- Original source information\
    \ is passed through the compilation process by these AST nodes, giving much better\
    \ error messages on malformed input.\n- Source information also allows the compiler\
    \ to build source maps accurately without hacking in the feature.\n- Internally\
    \ defined JavaScript Variables are guaranteed not to clash with the variables\
    \ defined in a program. Unfortunately, this can happen with the current compiler;\
    \ for example, defining _this can lead to very strange things happening.\n\nRedux\
    \ is turning into an excellent compiler. Although there are some rough edges and\
    \ it hasn't yet a formal release, the majority of code I've tested with it compiles\
