- img_proc: true
  md: '# CHAPTER 12 Mobile CoffeeScript Applications 229


    I want to explore these various issues by one because each one has a direct impact
    on the development of mobile and touch devices.


    First, the technologically fractured marketplace: In many ways, the browser market
    for mobile devices is very much like the ''bad old days'' of Netscape and Internet
    Explorer. Many different versions of browsers are available, and many of them
    have poor support for various keys. In fact, iPhone''s original versions of mobile
    Safari are cyn labeled ''the new IE 6'' by some, as they lack a number of crucial
    features and have spotty support for some modern web standards but have a broad
    base of users who are unlikely to upgrade quickly.


    Although it''s a pretty stretch to say that the situation in the current marketplace
    is as bad as it was in the ''bad old days,'' it is certainly true that the promotion
    of HTML 5 hasn''t materialized and there are a number of competing standards for
    even basic functionality as such touch detection. Browser compatibility in this
    is difficult.


    Second, remember that mobile very often means exactly: mobile: With the advent
    of 3G and 4G in particular, mobile devices have access to relatively high bandwidth,
    allowing their users to download a large amount of data and have very rich experiences.
    As the bandwidth on the radio side has increased, though, the footprint of the
    radio masts has decreased—out-side metropolitan areas, in particular, it is very
    easy to run out of signal.


    Developers targeting mobile devices need plan for disconnection. Lack of access
    to a network is not simply a transient condition or something that can be ignored
    by waiting for the user to refresh the page; it is a technological fact of life
    that needs to be baked in right the start. There are some solutions, including
    those discussed in previous chapters, such as the various forms of local storage
    support (see Chapter 4), but there are certainly no silver bullets.


    Last, this industry is still quite. Mobile devices are incredibly powerful, and
    the browsers on them are vastly better than the old desktop browsers, but mobile
    is still not as polished a development environment as the desktop.


    For example, if you''re developing an application that''s broken on a mobile device
    and you need to break out the debugger, Firebug on most of these devices is a
    no-no. Potentially, you might be able to use Firebug Lite, but that may not be
    a huge help. Mobile versions of Chrome are remotely connected, but right now doing
    so requires a wired USB connection and is generally a bit of a pain to set up.
    Most mobile environments have emulators which can be tested, but these are even
    more of a pain, and the more effort it takes to bring up the testing environment,
    the less likely it is that you can automate testing tools like Jasmine or Selenium.


    # JQUERY AND MOBILE APPLICATIONS


    Single-page applications are generally a good approach to mobile development.
    Spine is used to deliver this (I discuss Spine in detail in Chapter 10).'
  merge: -1
