  md: "# 300 PART IV\n\n```\n@db.verify_user params.username, params.password, (user)\
    \ =>\n  if not user\n    @db.create_user params.username, params.password, (result)\
    \ =>\n      if result.status == \"ok\"\n        user = result.user\n        req.session.user_id\
    \ = user.id\n        user.update_last_logged_in()\n        @db.save_user user,\
    \ () =>\n          res.redirect \"/dashboard\"\n  else\n    next req, res\n  req.session.user_id\
    \ = user.id\n  user.update_last_logged_in()\n  @db.save_user user, () =>\n   \
    \ res.redirect \"/dashboard\"\n```\n\nAs you can see, with each successive callback\
    \ the code is getting further indented to the right. This is often referred to\
    \ as callback hell. There are only some levels of callback that can be used before\
    \ the code becomes too indented.\n\nOne good approach to this type of problem\
    \ is to remember that functions can be created within other functions. The previous\
    \ example could be written this way:\n\n```\nauto_account: (req, res, next) =>\n\
    \  params = req.body\n\nonLogin = (user) =>\n  req.session.user_id = user.id\n\
    \  user.update_last_logged_in()\n  @db.save_user user, () =>\n    res.redirect\
    \ \"/dashboard\"\n\n@db.verify_user params.username, params.password, (user) =>\n\
    \  if not user\n    @db.create_user params.username, params.password, (result)\
    \ =>\n      if result.status == \"ok\"\n        mLogin result.user\n    else\n\
    \      next req, res\n  else\n    mLogin user\n```\n\nBy extracting the logic\
    \ into the onLogin function, the code is actually simpler than the previous version.\
    \ There is a slight loss of readability with this solution since the code being\
    \ executed is defined first, but my experience is that separating callbacks into\
    \ standalone functions ends making the various code paths better and less interdependent.\
    \ The scope of each function is clearer, and data not already in the enclosing\
    \ scope (such as user in the last example) has to be explicitly passed through."
