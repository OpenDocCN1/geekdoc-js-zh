    this test is still

    appropriate.


    If the API is available, you can access it by referring to localStorage:


    ```

    localStorage.username = "test";

    ```


    That''s literally all there is to it! Once a new piece of data is stored in the
    localStorage

    object, it will be there again in the next page request, or in the next browser
    tab, or the next

    visit to the application.


    Removing data is as expected:


    ```

    delete localStorage.username;

    ```


    And looking at all the information stored locally is equally easily:


    ```

    for key, value of localStorage

    console.log("Key is #{\ + key + \}, value is #{\ + value + "}");

    ```


    There''s also a useful event that is fired whenever the localStorage object is
