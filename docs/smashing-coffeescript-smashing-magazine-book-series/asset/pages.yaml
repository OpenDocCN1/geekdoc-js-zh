  md: "# PART III\n\nThis fires when an item is selected from the drop-down. self\
    \ is a reference to what would normally be this—the object is bound automatically\
    \ by qUI to the container of the widget, so that is is a convenient way of picking\
    \ the back up.\n\nHaving gotten the reference, the selected value is stored internally\
    \ and the button representing that value displays in the user interface, is less\
    \ costly than re rendering the widget.\n\nThe remove event does the inverse. It\
    \ removes the button from the user interface and removes the value from the internal\
    \ list:\n\n```\n_event_remove: (event) ->n  event.preventDefault()\n  self = $(event.target).parents('.{\
    \ widget_name }').data(widget_name)\n  index = $(event.target).parent().index()\n\
    \  $(self.pieces).find(\"li\").slice(index,index+1).remove()\n  self._selected.splice(index,\
    \ 1)\n```\n\nAgain, the reference to the actual instantiated object must be looked\
    \ up via the DOM because you don't have this bound as it would be in a normal\
    \ CoffeeScript class instance.\n\nThe hard work of the widget is now completed,\
    \ and you just have to implement the option API so that the selected value can\
