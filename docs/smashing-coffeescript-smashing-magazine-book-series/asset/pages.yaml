  md: "A much better idea is to provide feedback to the user, which you can do using\
    \ a combination of validation and supporting CSS styles. A common scheme that\
    \ you may have seen before used colored borders around input elements to denote\
    \ their current validation status, as shown here:\n\n+   - No border on an empty\
    \ element indicates that it hasn't been validated and isn't a required input.\n\
    - A yellow border on an empty element indicates it hasn't been validated but is\
    \ a required input.\n- A red border, with associated warning message, indicates\
    \ validation failed on the input.\n- A green border with a green tick following\
    \ the input validation is successful.\n\nThat last point is crucial. Relying on\
    \ colors alone for this type of task is generally a bad idea, but particularly\
    \ so in this case because a percentage of the population are red-green color blind.\
    \ Not being able to easily distinguish \"valid\" and \"invalid\" states would\
    \ be a poor user experience (See Figure 3-1).\n\n![](img/e3ca65867e7abc9da32dd88bfc67c4e4_65_0.png)\n\
    \nFigure 3-1: This is one way your input form might look.\nSource: Mozilla Firefox\
    \ on Windows 7\n\nMost of the validation states can be controlled directly with\
    \ CSS classes, and jQuery provides the capability to set and unset these states\
    \ from the code. In order to display helpful messages, though, an additional capability\
    \ to insert the messages into the DOM is required. You can use a utility function\
    \ like this:\n\n```\naddWarning = (node, message) ->\n  label = `$(`<label role='alert'\
    \ for='${node.name}'>\\${message}</label>>`)\n  $(node).insertBefore(label)\n\
    ```\n\nThis function does little more than insert another label before a given\
    \ form input, which itself can be styled using CSS to make it appear in the correct\
    \ position. role='alert' is a little piece of accessibility coding to give users\
    \ using web browsers a chance to understand why this label has suddenly popped\
    \ up.\n\nThe core validation function is going to change substantially. Instead\
    \ of passing in a set of data, the first change is to pass in the form so that\
    \ invalid inputs can be identified and"
  merge: -1
