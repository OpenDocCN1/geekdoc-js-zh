  md: '# 310 PART IV


    ```

    @ctx.stroke()\n@ctx.closePath()

    ```


    ```

    clear :==

    @ctx.clearRect(0, 0, @width, @height)

    ```


    Here the clear () implementation is pretty straightforward—using the known width
    and height of the canvas, simply clears a rectangular area across the entire canvas.


    The logic within draw_segment () is very different from that used previously,
    though. Rather than a segment beginning with mouse down and lines being drawn
    to reflect mouse movement and the segment being closed with mouse up, there is
    now just a short segment to reflect the line being drawn at this exact moment.
    Destructuring assignment is used to pull the coordinates out of a four-element
    array, which is being used as the basic data type here (to represent a line segment).


    With the server running and the same drawing opened in two different browser windows,
    the real-time nature of this system is clearly demonstrated in Figure 15-2.


    ![](img/e3ca65867e7abc9da32dd88bfc67c4e4_325_0.png)


    Figure 15-2: The same whiteboard is open in two different browsers that are updating
    simultaneously.'
