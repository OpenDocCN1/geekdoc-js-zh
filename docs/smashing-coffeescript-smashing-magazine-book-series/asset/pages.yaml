    \ how Coffee-Script will compile something into JavaScript:\n\n+   - Variables\
    \ are always defined within functions, and global variables are never used; indeed,\
    \ the code output is generally wrapped within a function.\n- Functions are not\
    \ named; they are created as anonymous functions and references held to them using\
    \ variables.\n- Blocks created with indentation translate directly to bracketed\
    \ structures; ditto data structures such as arrays, and so on.\n\nThe output of\
    \ the coffee compiler will generally be very readable JavaScript; less readable\
    \ code is generally more indicative of developers cutting corners, such as not\
    \ declaring variables or checking that a variable has a defined value. But that\
    \ code is Crockford JSLint-clean tends to look very similar. Take for this example:\n\
    \n```\nellipse = (input) ->nif input?.length < 30 then input else *#{input[0..27]}...\"\
    \n```\n\n```\ntest = ellipse \"The cat sat on the very mat.\"\n```\n\nThis function\
    \ trims sentences that are too long. The conversion to JavaScript is clear:\n\n\
    ```\n' Generated by CoffeeScript 1.4.0\n(function() {\n var ellipse, test;\n\n\
    elipse = function(input) {\n if (input != null && input.length > 0) < 30) {\n\
    \ return input;\n} else {\n return \"\" + input.slice(0, 28) + \"...\";\n}\n\n\
    test = ellipse(\"The cat sat on the mat\");\n}).call(this);\n```\n\nThere is a\
    \ great deal of sanity-checking in the output JavaScript, and the compiler goes\
    \ to some lengths to ensure that the code generated won't conflict with other\
    \ code by wrapping it in an anonymous function. The core logic, though, is the\
    \ same. Even though the if statement is more verbose and the return in CoffeeScript\
    \ is implicit, it's quite easy to see where various parts of JavaScript originated."
