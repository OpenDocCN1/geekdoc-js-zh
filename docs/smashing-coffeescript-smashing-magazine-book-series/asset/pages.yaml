    One of the advantages of using a system like this is the built-in escaping: on
    the last item being rendered the various special HTML characters have been changed
    into entities to prevent them from being misinterpreted. The <== tag does for
    all data, so there is no need to escape before output. As well as making the code
    more straightforward this tag makes the application more secure, because there
    are fewer possibilities to attack the application using cross-site scripting flaws
    or similar methods.


    Eco is neatly integrated into the hem build system, so in fact it may not have
    been entirely clear how the template is accessed. This is the key line:


    ```

    @html require(''views/demo'')

    ```


    The @html method call is on the controller, and is replacing the content of the
    element associated with the controller, so it''s clear that the require() method
    is where the HTML content is actually coming from. How this works is quite clear,
    though.


    As part of the build process, hem looks through the project to find templates
    with an extension of either .eco (in this case) or .jeco. It compiles the templates
    using Eco, turning them into JavaScript functions that accept the context as an
    argument. These are placed in modules named after the template, so views/demo
    refers to the file app /views/demo, eco. Each module exports this single compiled
    function, so the template can be run directly from the require() call by simply
    passing in the data.


    # DATA BINDING


    hem recognizes two types of Eco template files: The .eco variety is pretty straightforward.
    The .jeco variety is quite different.


    Generating HTML from templates on the client-side is an easy process. A common
    problem developers have is the next step after that: responding to events that
    are triggered on the generated DOM nodes. It''s usually necessary to have the
    data that was used to create the template in the event handler. For example, if
    there is a list of files in the user interface each with a Delete button, using
    the same click handler for each button makes sense. The handler needs to be able
    to identify which specific file the user is requesting to delete.'
