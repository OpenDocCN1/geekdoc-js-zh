    are, underneath, simply adding script tags to the page) complete or fail. A successful
    event is produced by jQuery when the JSONP callback function is triggered, but
    if the request fails, there is no error event.


    Thus, the only way to detect that a JSONP request has failed is to time it out.
    You set a 3.5-second timeout on the main AJAX call and also set up a 4-second
    timer to notify the user. If the call succeeds, the timer showing the error message
    is cancelled.


    # CROSS-ORIGIN RESOURCE SHARING


    JSONP as a system works well, in many ways, it''s less ideal. It forces requests
    to return data as script content, relies on randomly generated function names
    not clashing, and is essentially limited to GET requests. A more recent method
    of allowing these requests, Cross-Origin Resource Sharing (more commonly referred
    to as CORS), doesn''t suffer from these problems.


    CORS is an opt-in system where the HTTP server indicates that specific resources
    can be accessed from other origins by including additional headers in the response.
    To make a resource available from any origin, a server just needs to include this
    header:


    ```

    Access-Control-Allow-Origin: *

    ```


    As with many security-gets, you need to remain aware of a number of limitations:


    +   - The request headers from a browser to a resource on another origin are generally
    ''cleansed'' before sending, for example, cookies aren''t sent automatically.


    +   - Additional headers can be requested, as cookies and other information, but
    this requires further resource configuration on the server.


    +   - CORS is not yet consistently supported by all browsers, and in particular,
    versions of Microsoft Internet Explorer previous to version 10 have terrible support.


    For these reasons, CORS is not yet a complete answer, but for those browsers that
    support it, CORS is an excellent solution.


    # EXAMPLE: USER REGISTRATION FORM


