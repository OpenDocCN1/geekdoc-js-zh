  md: '# CHAPTER 9 • Building Resources with Cake and Helm 153


    The task is the key part of the Cakefile. This is one of the units of work that
    a Cakefile defines. Essentially, a task is a simple function that takes a set
    of options and is given a command name and a command description—what goes on
    the task is flexible, because after all, this is just CoffeeScript. The watch
    task described in the preceding code is using the coffee compiler to recompile
    source code in the given area into JavaScript.


    fs and child_process are two node.js libraries used to read from the filesystem
    and execute programs (this is an oversimplification, but it will do for now!),
    so this task is simply executing the coffee compiler with the appropriate arguments.


    If cake is called from the command line, without any arguments, it will use the
    task definitions to describe what tasks are available:


    ```

    cake

    Cakefile defines the following tasks:

    ```


    ```

    cake watch # Watch current directory for code

    -o. --output      directory for compiled code

    ```


    One of the key features of cake is that it will search parent directories for
    the presence of a Cakefile. This means that only one Cakefile is needed in a project,
    even if the source is split across a number of directories levels deep. If the
    Cakefile is located in a different directory, the variable __originalDirname identifies
    where it was called from.


    The watch task just defined in such a way that the CoffeeScript compiler is invoked
    in the current directory, which may be a few levels down from where the Cakefile
    is located. Usually, a task in a Cakefile will operate within the directory the
    Cakefile defines the task is located. This allows you to call cake watch in any
    subdirectory, and only code in that subdirectory is watched for changes and potentially
    recompiled.


    # THINKING ABOUT PROJECT DIRECT LAYOUT


    At this point, you need to begin developing a consistent way of laying out the
    project directories and keeping conventions about the location of code. Doing
    so helps simplify the definitions of tasks and Cakefiles to be standardized among
    projects or even other users.


    When developing larger applications using frameworks later in the book, you will
    find some suggestions on how a web application project might be laid out; however,
    in general, the people working on a project and its objectives are the primary
    guides for a project''s layout.


    For example, I intend to keep my source files within a src/ directory, but if
    I were working on a project that included source written in both CoffeeScript
    and JavaScript, or other languages, I would probably split again rather than having
    both sets of files in the same directory.


    Just keep in mind that consistency and good structure are crucial components to
    a project''s layout.'
