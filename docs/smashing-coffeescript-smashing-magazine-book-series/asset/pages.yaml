  md: "# CHAPTER 10 • Writing Applications with Spine\n\n.jeco templates provide a\
    \ convenient solution to this problem. When compiled .jeco templates act the same\
    \ as regular templates with some differences:\n\n+   - Instead of exporting a\
    \ function that returns HTML, they export a function that returns a DOM tree.\n\
    - Data used to \"render\" the template output is saved as $.data('item') on the\
    \ top-level DOM node.\n- As a special case, the template function can be passed\
    \ an array of data. The template is run once for each item in the array—effectively\
    \ running the template multiple times—and each data item is associated with the\
    \ relevant DOM node. This is ideal for producing lists of items using a single\
    \ template.\n\nAlthough little more than out a crude form of data binding, this\
    \ system is really useful when data is being used and generic event handlers are\
    \ processing events on that list. It leads to a natural two-controller pattern\
    \ that is common in Spine applications:\n\n```\nclass Files extends Spine.Controller\n\
    \  constructor() ->\n    super\n    @list = new FilesList()\n    @render()\n\n\
    \  render: =>\n    html = \"<ul></ul>\"\n    @list.appendTo(el.find(\"ul\"))\n\
    ```\n\nThis is the \"master\" controller whose whole job is to act as a container\
    \ for the list that is going to be embedded. For example, I've embedded the HTML\
    \ directly into the render function, but I recommend against this practice. Embedding\
    \ HTML mixes the view and controller together, and they should be separate. It's\
    \ much better to have content as an .eco template. @list is the controller for\
    \ the individual items and is using a .jeco template, producing some UI for each\
    \ item:\n\n```\nclass FilesList extends Spine.Controller\n  events:\n    \"click\
    \ .action-delete\": \"deleteFile\"\n  constructor() ->\n    super\n    @render()\n\
    \n  render: =>\n    data = [\n      { name: 'README.md' },\n      { name: 'index.html'\
    \ },\n      { name: 'index.css' }\n    ]\n```"
