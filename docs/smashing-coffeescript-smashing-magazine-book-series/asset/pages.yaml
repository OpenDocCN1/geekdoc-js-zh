  md: "has come from elsewhere—many services, such as web analytics or advertising\
    \ servers, ask that you place a small piece of JavaScript on the page. Retaining\
    \ that in the original JavaScript makes it easier for another developer to search\
    \ for that piece of code, as well as ensuring that no unintentional changes in\
    \ functionality are made by translating it to another language. Generally, though,\
    \ I argue that such snippets should probably be in a separate file and not interspersed\
    \ in the CoffeeScript.\n\nTo insert JavaScript into a program, simply surround\
    \ the code with backticks (`). Because the pass-through process isn't totally\
    \ straightforward, to avoid a number of bear traps. Take a look at this example:\
    \ ->\n\n```\nhide_content = =\n  .each('.panel', function (i, panel) {\n    $(panel).hide();\n\
    \  });\n  $('.message').text(\"Panels hidden\");\n\n  true\n```\n\nhide_complicated\
    \ ()\n\nI've written deliberately overcomplicated JavaScript to demonstrate the\
    \ point here. The JavaScript is surrounded with backticks to mark that block as\
    \ not being CoffeeScript and therefore not needing translation. Even then, this\
    \ doesn't look terribly naturally.\n\nThe content between the backticks is treated\
    \ as a single expression for the purposes of CoffeeScript, even though it might\
    \ be a series of expressions. This facet has some unfortunate consequences. For\
    \ example, if a CoffeeScript function has only a JavaScript body, all that happens\
    \ is that the first JavaScript expression is evaluated and returned—the rest of\
    \ the code will not be executed!\n\nThis is because CoffeeScript functions, in\
    \ the absence of explicit return statements, return the value of the last expression.\
    \ The JavaScript block is such an expression, so it returns the value of expression,\
    \ but by the time it goes conversion to JavaScript, it's no longer a single expression\
    \ but a series of statements, and the return comes before the first statement.\
    \ To avoid the implicit return inserted before the block of JavaScript being inserted,\
    \ a single true is left as the last expression of the function, which is what\
    \ ends up being automatically returned.\n\nAlso, it can be incredibly easy to\
    \ think of this as a templating system—to put in JavaScript statements that aren't\
    \ well-formed, but which in combination might be:\n\n```\nfunction foo() {\n \
