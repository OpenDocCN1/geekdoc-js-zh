  md: 'As an example, you can set up invisible sections of DOM to testing, and for
    the most part this works. By setting DOM subtree to be invisible, though, some
    browsers get lazy about computing things; for example the size of a given element
    might be 0 in either direction. An element that is not visible is not laid out
    on the page, and the layout step the browser can''t sensibly work out what dimensions
    it has. If the widget in question is backed by logic that attempts to respond
    to screen dimensions (as an example), the behavior of the widget will be very
    different when it is onscreen.


    There are other files, too. Although the test runner can run from a local file:///URL,
    some browsers will prevent certain features from working; an example might be
    Google Chrome''s unwillingness to load local content.


    All that said, testing parts of the user interface of an application is one of
    the most valuable things you can do. I tend to prefer these types of tests as
    a way of writing integration tests against an entire application, but it''s also
    entirely possible and valid to write unit-esque tests with widgets and smaller
    pieces of functionality and ensure they''re working properly.


    # DRIVING JQUERY


    The most popular way to perform front-end user interface testing with Jasmine
    is to use the Jasmine jQuery project, available at https://github.com/velesin/jasmine-jquery.


    It''s also available via npm as the jasmine-jquery package. Either way of obtaining
    it is fine; to use a minimal change to the test HTML to include the line:


    ```

    <script type="text/javascript" src="path/to/jasmine-jquery.js"></script>

    ```


    There are two key features that this provides:


    +   - A series of jQuery-relevant matches so that specs can be easily written
    assertions about the behavior of the front-end UI

    - The ability to load fixture data for the tests, including fragments of HTML
    and CSS, and a system for mocking AJAX queries


    Some of the matches available in jasmine are significantly enhanced; for example,
    it is possible to write expect(DOM nodes).toBe(jQuery selector) to set expectations
    about the document. If the expectation is that every element having the class
    "active" will actually be a button, the test must


    ```

    expect(\(".active")).toBe("button")

    ```


    jQuery is used to find the DOM nodes in this question, but any reference to DOM
    nodes can be used; the toBe() matcher then uses jQuery again to see if the nodes
    indeed match the requirement.'
