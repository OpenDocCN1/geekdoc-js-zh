  md: "# CHAPTER 4 • Ajax Requests\n\nXHR requests return data in any format that\
    \ the browser can handle. You can use an HTML response, for example, one of the\
    \ most common patterns in the community now is to simply return structured data\
    \ in the form of JSON.\n\nThe content of directory.coffee that is going to power\
    \ this directory is not complicated, although you will find it helpful to go through\
    \ it line by line:\n\n```\n$.ajax({\n  url: './testdata.json',\n  type: 'GET',\n\
    \  dataType: 'json',\n  done: function(data) {\n    $('#staff').append('<li>'+m.name+'</li>')\
    \ for m in data.members\n```\n\njQuery provides a number of functions to do XHR\
    \ requests, such as $.get() and $.post(), which are simple wrappers over $.ajax().\
    \ I used $.ajax() here because the wrappers, in honesty, are not really worth\
    \ using. They simplify life by a very small amount, but needlessly limit the ability\
    \ to do basic tasks such as detect errors.\n\nThe API .ajax() is nice and simple:\
    \ An object is passed to configure the request being made, and generally there\
    \ is no need to pass more information than in the previous example:\n\n+   - url:\
    \ Where to send the request\n- type: Which HTTP method to use in the request\n\
    - dataType: The type of data expected in the response\n\nSending the request is\
    \ easy, and the next step is to wait for the response and act on it. $.ajax returns\
    \ what jQuery returns is a jqXHR object, which is the jQuery abstraction over\
    \ the XHR API of the browser it is running. More importantly, though, it implements\
    \ what's known as the Promise interface, which is much more interesting in this\
    \ context.\n\nBecause the requests are asynchronous, the code making a request\
    \ doesn't wait for the response. Instead, the idea is to set up various handlers\
    \ that will be triggered when the response finally comes back. The Promise interface\
    \ is just like setting a handler to register a potential future click on a button.\
    \ It provides the ability to set these handlers that are later triggered, as well\
    \ as various features to manage these handlers.\n\nFor XHR requests, a couple\
    \ of parts of the Promise interface are of interest:\n\n+   - done(): To set handlers\
    \ to be called on successful completion of the request\n- fail(): To set handlers\
    \ that handle errors\n- then(): To set handlers to be called on either success\
    \ or failure"
  merge: -1
  pgno: 82
