    \ different whiteboard boards, take a look at the server-side implementation that\
    \ will be used to facilitate the collaboration:\n\n```\nio = require('socket.io').listen(8016)\n\
    \ncurrent_drawing = []\n\nsocket.sockets.on('connection', (socket) -> {\n\nsocket.emit('initialize',\
    \ current_drawing)\n\nsocket.on('draw', (segment) -> {\n  current_drawing.push(segment)\n\
    \  socket.broadcast.emit('draw', segment)\n})\n\nsocket.on('clear', () -> {\n\
    \  current_drawing = []\n  socket.broadcast.emit('clear')\n})\n```\n\nAs you may\
    \ appreciate from that short listing, this is definitely an overly simplified\
    \ version of the application. In particular, there is a severe limitation that\
    \ this server supports only one collaborative drawing at a time. The drawing is\
    \ modeled internally as an array, although this could be extended a number of\
    \ ways to support many drawings at the same time.\n\nThe server sits listening\
    \ for incoming WebSocket connections, and on receipt of a connection, the first\
    \ thing it does is emit(the current drawing to the client—that is, it sends all\
    \ the data it has for a drawing. This doesn't do anything for the first user connecting,\
    \ but for users who connect after others have started drawing, it allows their\
    \ whiteboards to be updated to reflect all the previous drawing.\n\nThis demonstrates\
    \ an important principle: With any type of client-side programming, it is dangerous\
    \ to assume that the software is in stable or reliable. After all, it only takes\
    \ a second for the user to press the Refresh button in his or her browser and\
    \ to return the page to a clean slate. Whenever possible, have a system that restores\
    \ visiting clients"
