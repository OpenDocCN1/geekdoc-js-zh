    # CODING IN GOOD STYLE


    You can do a number of things to help avoid errors from the start, and some tools
    can be brought to about the problem. It''s excellent practice in general to detect
    problems or errors as early as possible, but you will probably pick and choose
    among these different techniques to find those that work best in your projects.


    To avoid pitfalls, I recommend you follow a number of basic rules, and they''re
    all about how you actually format your code. Of course, coding style is a topic
    among professionals. Most developers have their own preferred style, and you are
    free to break these rules, but they reflect common practice and more importantly,
    are backed up with some solid reasoning.


    +   - Use spaces to indent your code. CoffeeScript uses indentation to control
    the logical flow of code. This means that whitespace at the start of each line
    is critically important, and I recommend that you use spaces and indent at two-space
    intervals. By all means, use the Tab key to indent code—this is entirely natural—but
    have your editor inserts spaces. Mixing tabs and spaces leads to trouble in a
    single file, and consistency really is king here.

    - Make sure you use spaces around operators. For example, a+b is a valid CoffeeScript
    expression, but a + b (note the single extra space after) is not. The preferred
    form, to avoid that kind of error, is to have space on both sides of the operator:
    a + b.

    - Use a editor that displays whitespace, usually with a light dot in the center
    of the character. In particular, this immediately shows that spaces have been
    used to indent, which makes mistakes in a file obvious before you attempt to run
    the code.

    - Only omit parentheses for readability. It is often useful to omit parentheses
    because the extra bit of white space in the code can make it less dense and slightly
    more readable. However, readability should never be at the cost of ambiguity—if
    you have to think about what code is doing, it is becoming unreachable! Take this
    example:


    ```

    biggest = Math.max(Math.abs x, Math.abs y)

    ```'
