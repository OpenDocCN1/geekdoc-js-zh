  md: '# CLEANER CLICK HANDLERS


    Encapsulation is all good, and keeping things in opaque boxes is a nice technique
    for ensuring that one part of a web page cannot interfere with another. However,
    that''s not always what you want: most pages are more interactive than that, and
    to interact with something without needing a way in, as it were. You can provide
    this and still keep the code nicely encapsulated.


    Ever since JavaScript was first built into the browser, there has been a way to
    trigger JavaScript functions from clicks on a page from links, buttons, or other
    page elements. A link with a click trigger would have something like this:


    ```

    <a href="javascript:doSomething();"></a>

    ```


    This method worked relatively well, but it came with a downside: put code in the
    HTML markup, meant that if you ever wanted to change the name of the function
    you had to do it in a few places.


    Better ways were developed, and the current state of the jQuery event handler
    that can be applied to a variety of nodes, not just links and buttons. Like other
    jquery features, you find the nodes you''re interested in by using a selector,
    and the click() function allows you to attach your own click handler directly
    to them, looking something like this:


    ```

    $("clickable").click(event) {

    event.preventDefault();

    console.log("clicked!");

    }

    ```


    This click handler would be attached to a node in HTML as <a href="="clickable">...</a>.
    Usually, when you click a link the browser takes you to the URL specified in the
    href attribute. However, when a specific click handler is attached that''s usually
    undesirable behavior, so the first thing the handler does is prevent the default
    action from occurring.


    The great thing about these types of handlers is that you can define them within
    other functions, and they inherit the parent scope!Handlers like these can be
    used to interact with encapsulated pieces of functionality, so let''s take a look
    at exactly how that can work. Going back to the encapsulated slideshow, say that
    you want to add a button to the page that will allow you to pause and un-pause
    the slideshow at any time.


    The main rotation function can stay as currently written. The main thing to change
    is the way that it runs. Recall that it doesn''t run constantly; rather, you have
    a timer setup that calls it once in a while:


    ```

    window.setInterval(doRotation, duration)

    ```


    This code runs forever and is not suitable for what you want: a way of starting
    the slideshow is needed, but also a way of stopping it later. You can provide
    a button for triggering the stop, and for case-of-use you can make the text on
    the button reflect the action occurs if it is clicked. First place a button on
    the page to control this:'
  merge: -1
  pgno: 51
