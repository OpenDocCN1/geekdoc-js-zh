  md: '# 126 PART II · CoffeeScript Projects


    One of the downsides of mocks is that to implement correctly, almost inevitably
    you need to create a complete copy of the API being mocked, and for some objects,
    that''s an awful lot of work. Spies can simplify this tremendously, though: Instead
    of mocking an entire object, you can use a spy to patch over the pieces that weren''t
    wanted, leaving the rest intact.


    Spies are also an excellent method of inducing errors. For example, you can use
    them to force objects or functions to return specific error codes without manually
    supplying the path to trigger the error. This is great news for tests: The logical
    flow of code-handling errors is generally one of the least-used and most untested
    parts of an application, because generally errors occur only rarely.


    # BEHAVIOR-DRIVEN DEVELOPMENT: WHAT IS A GOOD TEST?


    For a number of years around the turn of the century, test-driven development
    (TDD) was all the rage. Part of this movement was undoubtedly a visceral reaction
    to corporate development environments that relied heavily on manual QA teams to
    do the majority of testing, but it all doveiled neatly with the developers'' excitement
    over Agile development methodologies.


    The purpose of Agile development was to correct the fact that in many projects,
    there''s insufficient information about what the end product should look like—particularly
    at the start of a project. Rather than attempt to manage and plan the development
    of something that might not meet the needs of the end user, Agile developers assume
    that a project will change substantially.


    Planning for change turns out to be something that can be done quickly. It means
    doing development in small units and performing regular testing with the end user
    to see how on track the development is. (You can use this approach to make incremental
    changes that nudge the direction of development, rather than massive project resets.)
    The approach also means writing software that is adaptable.


    Writing adaptive software sounds like a recipe for disaster. The temptation to
    build unnecessary features is great, leading to over-engineered solutions that
    take too long to deliver. It turns out that there is another way of ensuring that
    software is adaptable: making it amenable to refactoring.


    Refactoring is the process by which the internal workings of an application are
    changed from one design or architecture to another, and it sometimes implies changing
    some critical pieces of code. This is where the story comes back to testing: By
    comprehensive test of the application functionality at different levels, you''ll
    find it much easier and more reliable to refactor the application software.


    Substantial, well-engineered test suites are as much a development tool as they
    are a part of the application. With the ability to make radical changes and demonstrate
    that the application is still working to specification, you can be bolder in all
    aspects of your work, when creating new features or performing routine maintenance
    and clean-up.'
