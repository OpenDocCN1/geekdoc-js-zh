    \ it would be better to parameterize the CSS, but at this point you run into a\
    \ problem with CoffeeScript.\n\nFor a convenience, CoffeeScript automatically\
    \ quotes the keys within objects. Most of the time this is incredibly useful:\n\
    \n```\ncss = (left: '-400px')\nconsole.log css.left # outputs -400px\n```\n\n\
    However, it means you can't write code like this:\n\n```\ndirection = \"left\"\
    \ncss = (direction: \"0px\")\n```\n\n```\nconsole.log css.direction # outputs\
    \ 0px\nconsole.log css.left # undefined\nconsole.log css[direction] # undefined,\
    \ equivalent to css.left\n```\n\nThe key cannot be evaluated when defining the\
    \ object, only when accessing values (when in fact any expression can be used).\
    \ This slideshow will be updating the CSS attributes a lot though, so it makes\
    \ sense to write this logic into a utility function:\n\n```\ncss_setting = (value)\
