  md: '# CHAPTER 10 • Writing Applications with Spine


    As a final touch, Spine offers a controller method called $. This is the jQuery
    API (or Zepto, if you prefer a lighter-weight version) scoped to @el. In simple
    terms, it means that this type of query is unnecessary:


    ```

    $(@el).find(''.button'')

    ```


    This version is more concise and does the same thing:


    ```

    $$(''.button'')

    ```


    As you might imagine, the selectors used in @events and @elements are scoped exactly
    the same way. You might have asked why I used class-based selectors in the example
    earlier: because of this scoping effect, there is no need to use lots of IDs on
    elements. In fact, since element identifiers are required to be unique in a given
    HTML document (very strange results can occur if this rule is violated) it''s
    actually much nicer to use classes.


    Developers need to be wary of different ways of selecting. The benefit of IDs
    is that the element returned is exactly what you want, but the downside is they
    can clash. Classes don''t clash, but you need to keep in mind that the best class
    names might be used elsewhere. With this built-in system, you get the best of
    both worlds: certainty that the selectors are operating only over the template,
    and the security that the template won''t disrupt other parts of the page.


    I strongly recommend using these built-in class for manipulating the DOM and setting
    up events. The usual jQuery interface can be made available, but it can be trivially
    easy for code in one controller to inspect or modify DOM nodes "owned" by another
    controller. Doing that accidentally is problematic; doing it deliberately is really
    poor design. It should never be necessary to do the latter, and by using $ consistently
    rather than $ it''s impossible to do the former.


    # ADDING CONTROLLERS


    Having come this—writing a controller for the calendar that runs the plug-in on
    the correct DOM element, and the basic suite of tests—is good, but the application
    itself isn''t doing anything interesting yet. The controller is ready, but it
    isn''t being used.


    Spine applications can be thought of as trees of controllers, really. The main
    application class is a controller itself, and its main job is to instantiate the
    other controllers that are needed and mediate between them. A simple application
    may have only a couple of controllers, but by using controllers for UI elements
    as well, it''s possible to quickly generate tens of the things without realizing
    it.'
