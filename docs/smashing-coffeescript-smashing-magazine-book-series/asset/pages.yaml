  md: '# CHAPTER 8 Dummy CoffeeScript


    ![](img/e3ca65867e7abc9da32dd88bfc67c4e4_156_0.png)


    Figure 8-2: Setting a breakpoint on line 7 in CoffeeScript


    For small- to medium-size scripts, this approach is useful. The approach breaks
    down somewhat if the scripts become too large (it can be difficult to find the
    right line within the debugger) or if there are a of loops within the code section
    in question. Using the step functions around loops can be incredibly tedious and
    time-consuming.


    One of the interesting things web developers don''t realize is that the breakpoint
    can be set within the code as well. Consider this short bit of code:


    ```

    brokenFunc = ->

    debugger

    console.log("This won''t work"

    ```


    Putting the debugger statement in the code triggers the browser''s built-in debugging
    capability, which in Firebug means it will treat the debugger statement as if
    it were a breakpoint, meaning Firebug pauses execution in the debugger. The CoffeeScript
    compiler also does something interesting with this code:


    ```

    function() {

    var brokenFunc;


    brokenFunc = function() {

    debugger;    return console.lg("This won''t work");

    };

    ```'
