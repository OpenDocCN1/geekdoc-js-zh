  md: "# CHAPTER 2\n\nIt's always good to challenge assumptions into code. Quite often,\
    \ an assumption in the code represents a potential bug. A good example in the\
    \ slideshow: how many slides the slideshow have? By referring to panels.length\
    \ you're not assuming a specific number of panels, but by having a concept of\
    \ \"active panel\" and \"next panel\" you are assuming that there are at least\
    \ two panels. There is no check for this, and a single panel slideshow would certainly\
    \ not work well with this code!\n\n# KEEPING CODE DRY\n\nOne of the big advantages\
    \ of parameterization is that it keeps the code DRY. If you haven't heard that\
    \ term before, let me expand the acronym for you: Don't Repeat Yourself. Whenever\
    \ you see code that looks the same or repeated, or the same value or expression\
    \ repeated within the code, it means there is an opportunity to remove repetitiveness.\n\
    \nAs another example, the 400px width assumption is not only built into the code\
    \ for the image slideshow, but it is in three different places. At some point\
    \ later, you might decide to change it to 600px without changing each reference,\
    \ and if you missed a reference it would likely introduce a bug. That's why it's\
    \ good to make it DRY.\n\nNow have a look at a better—and DRY—version of the slideshow.\
    \ There are a number of new CoffeeScript-items here too, so I take this piece\
    \ by piece. The first thing to do, is to define an overall function to wrap this\
    \ slideshow into a single neat package. It's going to be called rotator(), and\
    \ to start a slideshow you pass it an array list node to work:\n\n```\nrotator\
    \ = (slideshow) ->\npannels = $(slideshow).find('li')\nreturn if panels.length\
    \ < 2 # can't rotate with fewer than 2 panels!\n```\n\nSo far so: it looks for\
    \ panels (the list items) and refuses to run if there are not enough to start\
    \ a slideshow. Notice that the return call is conditional, and the expression\
    \ to determine whether you return can come after. You can write this type of code\
    \ either way, but often simple statements like this read better in the suffixed-expression\
    \ style.\n\nNext, to parameterize this bit further, you set up some configuration\
    \ variables and read some data into them:\n\n```\n# configurable attributes\n\
    active = $(slideshow).data('start') ? 0\ndirection = $(slideshow).data('direction')\
