    By default, the fixture loader will look in spec/javascript/fixtures/ (although
    this is configurable, and loading the content is straightforward: The test makes
    a call to loadFixtures("testform.html"), and the runner automatically loads the
    fragment into the page.


    One of the benefits of this is in addition to the snippet being available in the
    page, the runner also ensures that it''s loaded in a container that is cleaned
    up between tests, ensuring that the tests don''t affect each other. Fixtures are
    cached during runs, too, so the same fixture can be loaded again and again with
    very little performance penalty.


    More than one fixture can be loaded at a time using loadFixtures() a list of fixtures,
    or by calling appendLoadFixtures(). There is also a readFixture() function that
    returns the contents of a fixture as a string; it''s useful for testing templates,
    example.


    You can load stylesheets and JSON data in the same way; each has its own function,
    and is sandboxed independently so that the data is properly cleared off the page
    before the next test run:


    +   - loadStylextures() and appendStyleFixtures() work similarly to their HTML
    counterparts.

    - getJSONFixture() returns the JSON data contained in the fixture file, as a structure,
    not a string.


    JSON fixtures are incredibly useful: By combining the ability of Jasmine to spy
    on functions with the ability to load JSON data from a file, you can easily create
    mock AJAX requests. Doing so is useful in many ways, primarily of course, testing
    the application with a framework like Jasmine. However, you can use a good mock
    framework in other ways too. For example, if the AJAX queries to the server are
    all mocked out, you can develop the front without having to contact an actual
    server for the AJAX information.


