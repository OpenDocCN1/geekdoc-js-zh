  md: 'Integrating this into an Express.js application is also pretty straightforward:


    ```

    express = require(''express'')

    app = express()

    io = require(''socket.io'').listen app

    ```


    ```

    io.sockets.on ''connection'', (socket) ->

    socket.emit ''event'', {''initial'': ''data''})


    socket.on ''other event'', (data) ->

    console.log data

    ```


    In this case, socket.io needs to be given an instance of the application that
    it''s working alongside works almost identically to the client-side version. In
    the preceding code, emit(it) is used instead of send(); send(''data'') is simply
    shorthand for emit(''message'', ''data'') and nothing more complex than that.
    In any substantial application, there will be a requirement for a number of different
    message types or events, so generally emit() is the preferred API.


    # INTEGRATING STATIC AND REAL-TIME


    In the previous chapter, a micro-blogging application was developed primarily
    as a server-side Express.js application. With socket.io, there is an obvious way
    to turn the system into one that can publish news in real time so that users viewing
    their dashboards need to refresh the page—the new blogs will simply appear over
    the page time, as they''re posted.


    However, there''s a small problem here. The existing rendering is happening server-side
    to begin with. It is possible to implement logic on the client-side, which involves
    duplicating a large portion of code, violating the DRY principle and causing a
    maintenance headache.


    This is a similar problem faced by developers attempting to build a system that
    is partly server-side rendered, partly client-side rendered. AJAX is an acceptable
    compromise, but it is relatively limited in terms of the flexibility it offers
    (the markup being created is still static from the point of view of the client-side
    application).


    # RENDERING ON THE CLIENT SIDE


    A better solution is to make the system much AJAX-native to begin with, such that
    all the key rendering takes place on the client-side. At first glance, this would
    seem to mean the initial page load slightly longer—the page needs to fully load
    and then make the request for the first tranche of data, and only then will it
    render. However, there''s a neat trick—you can "prime the pump," to speak, and
    include the first set of data in the page itself, negating the need for an initial
    AJAX call.'
