  md: '# CHAPTER 4


    # AJAX REQUESTS


    NO MATTER HOW interactive they are, there is a limit to what websites or applications
    can do without somehow saving information. To begin with, developers use forms
    to send information back and forth from the server, which works but can be clunky
    in terms of the user experience.


    AJAX requests, which are executed by the browser in the background, give end users
    a smooth experience and also allow you, as a developer, to simplify the amount
    of logic that must be shared between the client-side and server-side of an application.


    To get the most out of AJAX as an architecture, you need to understand what''s
    going on underneath the covers, so in this chapter I''ll dig into not only how
    to make AJAX requests but what''s happening, and some of the security implications
    all developers need to be aware of.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# GETTING DATA TO AND FROM THE SERVER


    You''ll recall from the introduction that the XHR API was first introduced by
    Microsoft in Internet Explorer largely for the use of their webmail product. By
    then, users had become used to their computers opening a pop-up when new mail
    arrived, and Microsoft realized there was no way to do that within the existing
    browser architecture without constantly refreshing the page.


    The XHR API has essentially a single function: It allows client-side code to make
    requests to the server without having to refresh the page. Whether it''s checking
    for mail, or downloading large amounts of data, it allows a developer to write
    an application that loads on a single page, and that page never needs to be refreshed.
    This style of architecture, AJAX (Advanced JavaScript and XML) initially, and
    sometimes called Rich Internet Application (RIA) now, is a very different approach
    to building web applications.


    In previous chapters, I utilize the jQuery library throughout this chapter to
    provide many of the basic functions used to transfer data. Although the basic
    XHR API in each browser is similar, jQuery takes care of many the nuts and bolts
    of performing AJAX requests and really provides a very consistent interface across
    all browsers.


    Before diving into how to create requests, I want to recall a bit about how HTTP
    requests work under the hood. Requests made to the server using the XHR methods
    are virtually identical to any other request by a browser, as the request to load
    a page, and much of the knowledge about how forms work (for example) is immediately
    transferable.


    # HTTP REQUEST


    Each HTTP request is made up of a few key pieces of information: the path that
    the browser is attempting to access, the hostname of the site wanted, and the
    method (sometimes called the ''verb''). Consider a URL such as `http://www.example.com/index.html`.
    It is divided into the path (/index.html) and the hostname (www.example.com),
    and the default method chosen is GET.


    Those pieces of information are placed in the request headers, along with a variety
    of other information (for example, identification of the type of browser making
    the request and sending over any cookies that might have been set). The request
    is made up of these headers and a request body.


    One crucial piece of information is usually added to a request, the MIME type,
    which tells what type of data they''re receiving. HTML files usually have a MIME
    type of text/html, for example. However, not only do responses from the server
    have a type, the request to the server has one, too.


    Many methods are available for your use, but only four of them are commonly used
    by web applications: GET, POST, PUT, and DELETE. Though for many of you this will
    be recap, the basics of how these methods work.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# GET and POST


    Of the four commonly used verbs, these are the most important ones. It’s not too
    wide of the mark to think of these as being roughly analogous to “read” and “write/modify”
    in terms of their use.


    The requested URL, as a whole, should generally identify a resource on a server.
    In terms of static content the URLs are files, but they could also refer to the
    contents of a database, for example—and the GET request is effectively asking
    for the content of that resource. It is important to note that a GET request is
    supposed to be idempotent—that’s a fancy way of saying that if a browser makes
    such a request, there should be no modification on the server-side, so that (in
    general) the browser makes two requests in a row, it will get exactly its response.


    Usually, when making a GET request, the request body is entirely empty and any
    additional data that the browser wants to send consists of encoded parameters
    appended to the URL.


    Because it’s designed to modify a resource on the server, a POST request isn’t
    idempotent. The point of such a request is that the state of the server may (or
    may not!) change. The request body is generally used to send across additional
    data. More data can be encoded into this section than can be appended to the URL,
    making this request type suitable for even big jobs like uploading files.


    # PUT and DELETE


    Closely related to the POST type is the PUT request. They function virtually identically,
    but PUT’s role is more akin to “create” than “modify”. Although it modifies server
    state, PUT is an idempotent operation. Using PUT with the same resource twice
    should have the same effect as doing so once.


    DELETE is relatively obvious. The intended purpose is to remove resources on the
    server. It definitely modifies server state, but the effect of doing so twice
    in a row should be the same as doing it once, so DELETE is also idempotent. Like
    GET, there is usually no use of the request body.


    # Understanding Caching


    Why is it important to understand how these methods work and whether they’re idempotent?
    The key issue for you, the developer, is actually caching, whether it’s caching
    on the server, caching in the browser, or caching in a proxy (or, worse, caching
    at each of those locations).


    It can take some time for servers to generate output, it’s not a good idea to
    have them spend time re-creating data they’ve already created for each and every
    visitor. Also, if a browser has already downloaded a file and a good copy is available,
    it’s not spending the time downloading it again. Caching like this is altogether
    good for performance.'
  merge: -1
