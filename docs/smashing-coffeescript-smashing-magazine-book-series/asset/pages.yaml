    \ 0\n}\n\nli {\n  list-style none outside none\n  display inline-block\n  color\
    \ $theme-menu\n}\n&:hover {\n  color lighten($theme-menu, 10%)\n}\n```\n\nThis\
    \ probably doesn't need much explaining, which speaks to the clarity of the system.\
    \ A variable is declared to hold a reference to the main color being used, but\
    \ Stylus understands the concepts of colors well and can manipulate them. So,\
    \ instead of having to list separate"
