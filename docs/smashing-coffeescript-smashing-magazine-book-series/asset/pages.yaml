  md: 'With this utility function available, you can now move the slideshow panels
    into their initial position on either the left or the right, depending on direction
    they need to slide. In the original slide example, panels that are off screen
    on one side like a set of cards:


    ```

    # move panels into initial position

    $(panel).css(css_setting(''100px'') for panel in panels

    $(panels!active).css(css_setting(''0px'')

    ```


    Now, the code moves all the panels off-screen and then moves the active one back
    to where it was. Since active is now a configurable variable, you can choose which
    panel is the one to start with, and it could be any of them, from first to last.


    Finally, you''re back to defining the function that does the main work. The first
    line of the function serves a bit of description:


    ```

    doRotation =

    which panel to show next?

    next = (active + direction + panels.length) % panels.length

    ```


    The calculation for which panel should be next has become a lot more complicated,
    because you need to take into account the fact that you could be working through
    the panels back-wards! This can be broken into separate steps:


    +   1. Calculate next as active + direction.

    2. Check that next is not greater than panels.length (and reset to 0 if it is).

    3. Check that next is not less than 0 (and reset to panels.length if it is).


    This type of range-checking is the typical ground for an off-by-one bug, so an
    expression is used, relying on the modulo % to provide the bounds checking.


    If you haven''t seen modulo before, its primary usefulness is that it can be used
    to wrap a number series between 0 and some maximum. For example, when counting
    from 0 to 7, the resulting series modulo 4 would go from 0 to 3 twice (0%4 is
    0,3%4 is 3,4%4 is 0 again). This is often used in web development where repetitive
    patterns are used—a loop value modulo 2 is used to color the alternate rows in
    a table, for example.


    In this example, calculating the number of panels ensures the counter runs off
    the positive end of array. It''s always wrapped to 0. When working backwards through
    the panels, modulo itself doesn''t offer much help—it''s quite happy to work with
    negative numbers, rather than wrapping -1 back to the number of panels. To stop
    this happening, the number of panels is added before taking the modulo, ensuring
    that the counter is positive and doesn''t affect the result. (You might want to
    play with some of numbers on the CoffeeScript REPL to convince yourself this is
    correct!)


    The basic CSS movement and animation is much like the original, except that you
    use the various parameters instead of fixed values, and instead of using a fixed
    width you use the 100%:'
