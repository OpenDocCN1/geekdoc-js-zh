  md: '# CHAPTER 2 · Using iQuery: DOM Manipulation 27


    ```

    alterThingAgain()

    ```


    ```

    console.log thing

    ```


    In this really simple code, two functions are defined, both of set thing to a
    value, and both functions are called. The browser is then asked to output the
    value of thing. But what should the value be?


    If you use global scope, the variable called thing would be the same variable
    everywhere. So first it would get set to 1, and then it get set to 2, when the
    browser outputs its value, it would output 2.


    However CoffeeScript doesn''t use global scope. Variables are "scoped" to the
    enclosing function and although alterThing and alterThingAgain both alter variable
    called thing, it''s actually a different variable in each case. In fact, when
    the browser comes to output the value of thing, it''s referring to a third variable
    that was never defined, so the output is undefined.


    Making a couple of changes to this contrived example demonstrates the really neat,
    useful property of "lexical scope" (which is the fancy name for this feature):


    ```

    alter = ->

    thing = 0

    nalterThing = ->

    thing = 1

    nalterThingAgain = ->

    thing = 2

    nalterThing()

    alterThingAgain()

    console.log thing # outputs 2

    nalter():

    console.log thing # outputs undefined

    ```


    When a function is defined in CoffeeScript, it uses variables as are declared
    as its inner scope. Then, when a child function is defined within a function,
    those variables not already declared created, giving the child function the ability
    to see the variables declared in its parent. The variables declared in the child
    are not visible to the parent, though


    In the previous example, the variable thing is created in the inner scope of the
    function alter(), and is visible in the two functions defined within (). Thus,
    when you define alterThing(), it can "see" thing (set to 0 at the time you defined
    the function) and modify its value alone. Functions inherit the scope from their
    parent.


    Thus, when we call alter(), thing is set to 0 initially, then set by 1 by the
    call to alter-Thing(), and then set to 2 by the call to alterThingAgain(). When
    you output thing for the first time, the value is 2.'
