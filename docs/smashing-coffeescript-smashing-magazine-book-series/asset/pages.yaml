    Fixtures don''t need to be absolutely authentic. They can be scaled-down versions
    of the real

    thing, and the key point is that they are predictable, having as much variety
    in the

    data as may be encountered in real life is always a bonus.


    Jasmine jQuery has the ability to load a few different types of fixtures. HTML
    fixtures, for

