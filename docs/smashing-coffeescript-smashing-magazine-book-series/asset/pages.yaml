    \ to set test to 0.\n\n# USING UTILITY FUNCTIONS\n\nFunctions in CoffeeScript\
    \ are so easy to define that they quickly become ubiquitous: written in good style;\
    \ a non-trivial CoffeeScript program often uses a lot of small functions to make\
