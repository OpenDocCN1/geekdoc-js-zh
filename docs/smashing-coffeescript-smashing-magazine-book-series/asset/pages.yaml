    It''s readable and easy to get wrong.


    +   - Consistent naming: The CoffeeScript standard is to use camelNaming for variables
    and attributes (and, therefore, functions—because they are referenced using variables).
    Classes, as a special case, a capitalized first letter as well, LikeThis. Constants
    in code are ALL_UPPER_CASE and "private" functions have _leadingUndcores.


    This is the most argue presented here, but if you''re planning on reusing code
    from the community or contributing yours via npm, it''s useful for no other reason
    than consistency.


    # More Style Guidelines


    The code in this book is laid out according to the preceding rules, along with
    other rules. These rules are heavily influenced by, and identical to, those generally
    agreed to by the CoffeeScript community at large. In turn, those rules have been
    influenced by many years of experience of developers in other communities, such
    as Python, Ruby, and JavaScript, and reflect yours of coding practice.


    Many code editing environments also have the ability to syntax highlight: if that
    feature it correctly highlight CoffeeScript, I encourage you to enable it. My
    experience is that the sooner an error is detected the easier it is to fix, and
    a good highlighter is a lot of help.


    Edit your code in small bursts, particularly to begin with. It''s incredibly frustrating
    to spend tens of minutes writing some code only to find it doesn''t even compile,
