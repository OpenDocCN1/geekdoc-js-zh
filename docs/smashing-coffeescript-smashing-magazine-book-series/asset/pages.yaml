- img_proc: true
  md: '# DEFINING REAL-TIME APPLICATIONS


    Before starting to look at code, it''s important to understand what real-time
    actually means. You can find a number of different definitions, some of which
    describe things that are easier to achieve than others.


    However, in traditional computer science, real-time has a specific meaning that
    refers to the ability of a piece of software to complete work in a given time
    frame. For example, if a computer controls a washing machine, the computer must
    be able to calculate the level of water in a timely way so that the drum (tub)
    doesn''t overflow. Control controls are the obvious applications for these techniques—for
    example, car engine control systems or aircraft fly-by-wire-control systems—and
    it''s worth being clear that this class of real-time is definitely not what we
    mean.


    Instead, a real-time system as far as the web is concerned is one that attempts
    to reflect the current state of affairs as they change, whether it''s straightforward
    as an e-mail inbox changing the number of e-mails unread as more come in or a
    stock trading system displaying the correct share price (which also meets the
    traditional definition of real-time).


    On the web, the traditional architecture is that a client performs a request,
    and the server creates a response. Generally, the server wasn''t able to contact
    the client outside of that framework. Unless the client made a request, the server
    didn''t have any type of response to send. From a client perspective, this architecture
    is pretty much useless in terms of displaying up-to-date information.


    # POLLING THE SERVER FOR DATA


    Although HTTP as a protocol was not really designed with server-client communication
    in mind, it was extended to do almost right from the start. The earliest versions
    of Netscape Navigator contained a featured server push that could be seen as a
    forerunner of the current technology. Unlike many of the other features of Navigator,
    it was rarely used and not cloned by the competitors, but allowed the server to
    keep open the browser after a request and push data when needed.


    In addition, the concept of polling is as old as the hills and can be brought
    to bear here, too. With polling, instead of needing a specific mechanism by which
    the server can push information toward the client, the client simply keeps touch
    with the server by contacting it regularly. Although this means that the client
    is generally up to date, this approach has a big problem: The more regularly the
    client polls—the more up-to-date it is—the more resources the client consumes
    on the server-side. To be truly real time might require updating many times per
    minute, generating much more load per user than would otherwise be the case. Polling
    can never be a true substitute for real-time data. If an application polls infrequently,
    it doesn''t cause much load but it doesn''t stay up to date either. By polling
    frequently enough to look real-time, the application will consume significant
    server-side resources.'
  merge: -1
  pgno: 307
