    This neatly illustrates one of the nice things about this approach: With a single
    application file, compressed and client-side cache, the footprint of the application
    can be low on the first HTTP request which subsequently drops to zero, and once
    the browser has downloaded the content, it can keep reusing it. One of the notable
    about web clients today is that they be on fast internet connections, but issue
