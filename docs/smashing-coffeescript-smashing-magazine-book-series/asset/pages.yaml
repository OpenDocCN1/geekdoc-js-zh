    the resulting output.


    This feature is, of course, generally discouraged, and there''s no good reason
    to ever use it. Often, developers using it in the wild have a better, more CoffeeScript-native
    alternative available; they just don''t know how to. Defining functions is a favorite.
    Rather than explore CoffeeScript fully and understand how it works, it''s easier
    to simply drop in a piece of JavaScript.


    In some ways, resorting to JavaScript isn''t a bad thing. Even though it is a
