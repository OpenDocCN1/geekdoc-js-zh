  md: 'the data schema upfront, but once you supply a schema, it creates much of the
    scaffolding needed for accessing a database, including saving and intelligent
    querying of data.


    The primary example I show in this chapter is a microblogging application, along
    the lines of a service such as twitter.com or ident.ca. Since there is a lot of
    code, I''ll break it down into chunks, and I recommend downloading a complete
    copy of the application from wiley.com/go/smashingfreescript.


    The main data to capture for this application is information about user accounts
    and the microblogs posted from these accounts. This is how the initial interface
    with Mongoose looks:


    ```

    mongoose = require ''mongoose''

    db = mongoose.createConnection(''localhost'', ''demo'')


    User = db.model(''User'', new mongoose.Schema({

    name: ''string'',

    password: ''string'',

    follows: [ type: mongoose.Schema.Types.ObjectId, ref: ''User'' ]

    })


    Blog = db.model(''Blog'', new mongoose.Schema({

    author: mongoose.Schema.Types.ObjectId, ref: ''User''

    blog: ''string'',

    date: type: Date, default: Date.now

    }))

    ```


    After the Mongoose library is imported into the code, a connection is opened to
    the MongoDB server. In this instance, the assumption is that the database is running
    on the local host and that there is a "database" within Mongoose called demo available
    for use. Mongo''s internal structure is simple: Documents (which are a lot like
    files) are read and written from collections (which are a lot like folders) in
    databases (which like disk partitions).


    The schema used here defines two classes, although not with anything that resembles
    CodeScript. Three pieces of information are stored about a user: name (string),
    password (also a string), and a list of other users the user follows.


    Actually, four pieces of information are stored here. Well as the explicit fields
    listed, each object is given an attribute _id that uniquely identifies the object
    within the collection. These identifiers are used to refer to objects, when a
    user has a list of other users (followers), what it actually is an array of objects.


    The microblogs have a similar structure: a single author, the blog text, and a
    post date that defaults to the time the Blog object was created. So far, so good.


    # ARCHITECTING WITH MVC


    Before going much further, it''s worth spending a little bit time on some architectural
    considerations. You may have come across the acronym MVC. It stands for Model,
    View, Controller and is a software design pattern that dates from some of the
    earliest graphical interfaces.'
