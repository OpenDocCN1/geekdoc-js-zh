  md: '# CHAPTER 12 • Mobile CoffeeScript Applications 235


    ```

    render = =

    @html require(''views/home/index'')())


    module.exports = Home

    ```


    I have made the executive decision that this e-commerce shop will sell toys. It''s
    probably for the best that I''m not a businessman in my real life!


    Along with setting the title for this panel, the constructor adds a single route
    that enables this panel and calls the render () function to generate the actual
    interface. As a single-page application, its panels are rendered relatively early
    on and tend to stick around. Be sure to bear this in mind, particularly if the
    application will load data in chunks, because continuous rerendering on application
    startup is an unfortunate side effect of not paying attention to what''s going
    on.


    # Setting Up Your Application''s Navigation


    A controller for the homepage has been created, but the actual view template has
    not yet been created; the spine app doesn''t set this up for you. Views are stored
    in the views directory, in a directory named after the controller. For the homepage
    the full path to the view should be views/home/index and the contents are deliberately
    simple:


    ```

    <h3>Welcome!</h3>

    ```


    ```

    <p>This is the mobile website for the online toyshop. Browse our products and
    if you like it, why not buy it?</p>

    ```


    +   <ul><li><a class="nav-item" data-navigate=''/products''>Latest products</a></li><li><a
    class="nav-item" data-navigate=''/cart''>Your cart</a></li><li><a class="nav-item"
    data-navigate=''/login''>Your account</a></li></ul>


    Certainly, the promotional text is unlikely to win any awards; however, the main
    function of this page is to serve as a navigational launching point for the user.


    Again, this layout highlights the difference between mobile and desktop apps.
    A desktop-oriented site is more likely to display navigation at the top or side
    of every page so that the user can flip from page to page. On a mobile screen,
    every pixel counts, and every part of the screen taken up with navigation is a
    piece of wasted display. Also, the further down page you go, the more tedious
    it is to return to where the navigation is.


    Another wrinkle is that routing is more or less invisible to the end user, which
    is contradictory to design principles used on desktop applications. Most of the
    time, the URL bar is not visible to users, and it''s possible to package mobile
    sites like this as applications—either as HTML 5 applications or as native apps
    via a system such as PhoneGap—where there is no URL bar.


    ![](img/e3ca65867e7abc9da32dd88bfc67c4e4_250_0.png)'
