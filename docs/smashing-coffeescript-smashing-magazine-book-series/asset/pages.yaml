  md: "# COFFEESCRIPT IN THE BROWSER\n\nUsing CoffeeScript directly in the browser\
    \ is a quick way to start using the language because the barrier to entry is low,\
    \ and you can immediately start becoming familiar with the process. There is no\
    \ need to download any fancy tools or install a web server. Only three things\
    \ are required:\n\n+   - A web browser: I recommend Mozilla Firefox for the developer\
    \ tools, but at this stage, it doesn't matter which browser you choose.\n- Your\
    \ preferred text editor: I use geany, TextMate, Sublime, vim, and emacs are all\
    \ popular.\n- A copy of coffee-script.js: You can download this file from https://jashkenas.github.com/coffee-script/extras/coffee-script.js.\n\
    \n# STARTING COFFEESCRIPT IN PLAIN HTML\n\nI start the introduction to the language\
    \ with a short and trivial script to demonstrate Coffee-Script being loaded and\
    \ executed by the browser:\n\n```\n<DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <script src=\"coffee-script.js\" type=\"text/javascript\"></script>\n  <script\
    \ type=\"text/coffeescript\">\n    runWhenReady = () => {\n      textbox = document.getElementById(\"\
    textbox\")\n      text = document.createElement(\"Time to make coffee!\")\n  \
    \    textbox.appendChild(text)\n    }\n    window.onload = runWhenReady\n  }\n\
    </script>\n</head>\n<body>\n  <div id=\"textbox\"></div>\n</body>\n</html>\n```\n\
    \nSave this as an HTML file in the same directory as the copy of coffee-script.js\
    \ you downloaded, and open it directly in your web browser. You should see the\
    \ message \"Time to make coffee!\" in your browser confirming that the code did\
    \ indeed work.\n\nThroughout this book, I'm going to be writing HTML 5 and occasionally\
    \ some small pieces of CSS. If you've never used HTML/CSS before, or if you're\
    \ a bit rusty, I recommend the documentation available at the Mozilla Developer\
    \ Network, or MDN. A good starting point is here: https://developer.mozilla.org/en-US/docs/HTML/\n\
    \nMDN is an excellent reference resource covering all browsers, not just Firefox,\
    \ and all the key features and APIs within a browser."
