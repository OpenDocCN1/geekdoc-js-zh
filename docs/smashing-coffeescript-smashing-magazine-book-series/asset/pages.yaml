- img_proc: true
  md: "# CHAPTER 12 Mobile CoffeeScript Applications 253\n\n```\n@buffer.push path\n\
    \npop: =\n  @buffer.pop()\n@buffer.pop() ? '/home'\n```\n\nThis class listens\
    \ to navigation changes, stores them as an ordered list, and gives callers the\
    \ ability to pop off the end of the list. In fact, it pops off: the last item\
    \ is the current page, and the penultimate item is the page wants to go back to.\
    \ When the navigation is called to visit that page, it is pushed back onto the\
    \ stack again.\n\nYou need to be sure a single history exists for the application\
    \ so it is only instantiated once as part of the constructor for the global stage:\n\
    \n```\n@history = new NavigationHistory()\n```\n\nThe history is now accessible\
    \ to the BasePanel implementation, which you can use to create a back event handler\
    \ to navigate the application to the previous page:\n\n```\nback: (e) =>\n  e.preventDefault()\n\
    \  @navigate(@stage.history.pop()), trans: 'left'\n```\n\nEvery panel has access\
    \ to its parent stage as @stage, which will usually be the global stage. Complex\
    \ applications can have more than one stage though, in which case the panel's\
    \ parent stage is not assured to be the global stage. The panel can instead call\
    \ @globalStage() to get the reference to the global stage. In this case, I know\
    \ that the parent stage of all my panels is the global stage.\n\nIt is possible\
    \ to BasePanel add the Back button to the header; however, your application may\
    \ have pages where such a button is not desired (as the home page), so there are\
    \ two alternatives:\n\n+   - Add the button in the BasePanel, but make it configurable.\n\
    - Add the button in the subclass.\n\nEither approach is fine. If there are several\
    \ panels and most of them have the Back button, the first choice leads to the\
    \ least code. If there are only a few panels or only a few of them have the Back\
    \ button, the second option is better. Regardless, the final addition to the appropriate\
    \ panel is simple:\n\n```\nconstructor: ->\n  super\n  @addButton('Back', 'back')\n\
    ```"
  merge: -1
