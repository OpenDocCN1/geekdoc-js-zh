  md: "# CHAPTER 11 • Writing iQuery Plug-ins 25\n\n```\n@items.fadeIn()\n\nhide:\
    \ =>\n  @showing = false\n  @items.fadeOut()\n```\n\nYou could implement such\
    \ a simple change as a piece of configuration rather than a sub-class. For a small\
    \ number of features, that's a reasonable approach. However, that of compromise\
    \ tends to work out badly in the long run when many such features are implemented.\
    \ The code becomes punctuated by various if clauses that change behavior based\
    \ on different pieces of configuration.\n\n# JQUERY UI\n\nAlthough the plug-system\
    \ for jQuery is very powerful, there is another way of developing the pieces of\
    \ reusable user interface applications to need—jQuery UI.\n\nAs one of the pieces\
    \ unders the general jQuery umbrella, jQuery UI fits into the general ethos of\
    \ the library as you might expect. The role of jQuery UI (or jUI) is to provide\
    \ a set of effects, behaviors, and pieces of jUI that fit well into a jQuery-based\
    \ project, and work on both small and a large scale.\n\nAs well as providing parts\
    \ of the code and the framework for putting these widgets together, jQuery includes\
    \ a CSS-based system called theme roller that separates the styles used to create\
    \ the structure of the widgets from the styles used to adapt the look and feel\
    \ of the widgets.\n\nThe key underpinning of jUI as a system is the Widget Factory,\
    \ also known as $.widget, the base on which all the widgets are built. Not only\
    \ does $.widget provide a common structure and interface, it encodes a system\
    \ of inheritance that allows widgets built using it to be cleanly and easily extended.\n\
    \nWith this structure in place, widgets tend to be a lot more sophisticated than\
    \ jQuery plug-ins. In particular:\n\n+   * It's usually easy to remove an effect\
    \ from an element once it has been added—few plug-ins allow the developer to downgrade\
    \ an element later.\n* It's usually easy to change the effect applied to an element.\n\
    * Plug-ins often do not pass events to the code that called them."
