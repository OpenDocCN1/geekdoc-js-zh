  md: "the controller itself, using a dictionary in a format {\"event selector\":\
    \ \n\"method name\"}.\n\n+   - elements: Similar to the events use case, object\
    \ attributes can be quickly set to DOM nodes by listing selectors in this dictionary,\
    \ in the format (\"selector\": \"attribute name\").\n\nThese two items are so\
    \ important it's worth going through a specific example:\n\n```\nSpine = require('spine');\n\
    \nclass Example extends Spine.Controller {\n\nevents:\n  \"selector\": \"button\"\
    \n\nelements:\n  \".button\": \"button\"\n  \".label\": \"label\"\n\n  constructor()\
    \ ->\n    super\n\n  @html ***\n  <p class=\"button\">Click me</button></p>\n\
    \  <p class=\"text\"></p>\n  ***\n\n  buttonclick: (e) =>\n    e.preventDefault();\n\
    \    $(label).text 'Button clicked!'\n}\n```\n\nmethod is a short-hand for \"\
    replace the contents of @el with this\". In this example, the method is being\
    \ used in the constructor to set the output; otherwise this would be separated\
    \ into a template, which will be clearer later in this chapter when I cover views\
    \ in more detail.\n\nbuttonclick() is the click handler attached to the button\
    \ on the page, and note that it's not being attached manually: Spine.Controller\
    \ is handling that work, by looking through @events. In this example, Spine.Controller\
    \ sees it needs to deliver click to any node change .button to the buttonClick()\
    \ method. Everything is referred to via the use of strings, so a direct function\
    \ reference is not needed.\n\nWithin the click handler is a reference to @label,\
    \ and again this isn't something that has set up manually. @elements is used to\
    \ find parts of the page based on the selectors, so both @label and @button are\
    \ set up automatically."
