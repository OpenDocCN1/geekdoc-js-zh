  md: '# CHAPTER 12 Mobile CoffeeScript Applications 233


    ![](img/e3ca65867e7abc9da32dd88bfc67c4e4_248_0.png)


    Figure 12-2: The basic Spine display, related to the HTML mark-up


    The toolbars at the top and bottom of the application are not always there. Some
    applications drop one or the other or, indeed, have neither. But developers use
    consistent conventions in a lot of mobile applications. The top toolbar is mapped
    to `<header>` in both the stage and the panels, and the bottom toolbar is `<footer>`
    of the stage.


    The part remaining, which is `<article>` in both the stage and the panels, is
    effectively the content area. Also, notice that the stage `<article>` ends stretching
    over the stage `<header>` (via the use of the `viewport` class). This is because
    the stage `<header>` actually isn''t all that useful; it simply serves as a standard
    backdrop so that the toolbars in different panels can transition smoothly.


    # Understanding the Stages and Panels


    Before barreling into implementation, I want to take a few moments to talk about
    what the stages and panels actually are. Although so far I have talked about these
    components as though they are brand-new features of Spine.mobile, that''s not
    entirely true: Underneath, both stages and panels within it are simply Spine controllers.


    Although I''ve tended to refer to the stage and the global stage as one and the
    same, and for many applications they will be, you can have more than one stage.
    The stages are held together by a single manager, and the global stage is the
    first stage in the application.


    The implementation of the stage is simple and largely concerned with providing
    transition support between stages. Although many applications do not directly
    use this support, it''s there. But it''s just a Spine controller and can be treated
    as such.


    The story with the panel is similar. Again, it''s just a controller underneath,
    although it inherits from the stage rather than Spine.Controller directly. Again,
    a large part of the code deals with transitions between panels, although at the
    panel level, it deals with'
  merge: -1
