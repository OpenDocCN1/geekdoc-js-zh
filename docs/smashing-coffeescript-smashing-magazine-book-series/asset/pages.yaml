  md: '# SECURING THE APPLICATION


    So far, the application is designed with authentication (the process of identifying
    the user) but with little regard to authorization (checking that users are entitled
    to access the requested resource) and common security measures to keep out those
    ill intentions.


    The first job is to define which routes require an authenticated session, and
    then perhaps which users might be entitled to access those routes. There are a
    number of ways to create this kind of architecture, and the best choice is application-dependent.
    If only a small number of users with the same level of access are accessing a
    web application, your main goal is ensuring that all the users are successfully
    authenticated.


    On the other hand, if a site is being accessed by a large number of users with
    different levels of access or with personal data that shouldn''t have access to,
    your job becomes a lot complicated. It becomes necessary to create a flexible
    system that can deal with the different requirements they crop up within the application.


    A sensible choice is to use the idea of separating the task from the controller,
    effectively building a single controller from a number of parts. To ensure that
    a user has been authenticated, a single check is needed:


    ```

    secure = (next) ->

    return (req, res) ->

    res.redirect(''/login'' unless session.user_id

    next req, res

    ```


    The internal logic here is simple: If there is no identifier for the user in the
    request session, which is secure and private to the application, the user has
    not logged in and should be redirected to a login page.


    To deliver this, a function that returns a controller is written, which allows
    the function to wrap another controller so that, if the test succeeds, the function
    can simply call the controller as the controller—passing in the request and response
    objects. This check can now be added to the route definition for a resource, with
    the dashboard for example (leaving out the body of the function to deal with POST
    data):


    ```

    app.get ''/dashboard'', secure dashboard

    app.post ''/dashboard'', secure (req, res) ->

    ```


    Blink, and you''d miss it: the secure() call is just in front of the "standard"
    controller and appears almost as a new keyword—it''s descriptive of the task it''s
    performing.


    You can extend this concept in a variety of ways. For example, if user accounts
    have roles, it might be useful to limit some resources to not logged-in users
    but also to those with specific account roles:


    ```

    secure = (roles, next) ->

    return (req, res) ->

    ```'
