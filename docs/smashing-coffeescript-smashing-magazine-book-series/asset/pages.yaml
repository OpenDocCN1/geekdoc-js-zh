- img_proc: true
  md: "# PART III • CoffeeScript Application\n\nIt is possible to include this template\
    \ every time and write logic to add the button or not in the template; not much\
    \ of a saving is made either way, and it's a matter of taste. I personally prefer\
    \ not to have logic in the template unless it's required.\n\nAlthough the slightly\
    \ different types of templates have been used, both output DOM nodes, and thus\
    \ the output can be combined using a containing <div>, which is then put onto\
    \ the panel.\n\nWiring the cart item Delete button into the controller code takes\
    \ little effort because the .ereco template generates that section of the DOM:\n\
    \n```\nclass CartListItem extends BasePanel {\n  events:\n    '.del': 'remove'\n\
    \n    remove: (e) => {\n      e.preventDefault()\n      item = $(e.target).parents('.item').data('item')\n\
    \      if item\n        item.destroy()\n    }\n}\n```\n\nFinding the item associated\
    \ with the node is slightly more difficult: The event arrives via a button that\
    \ is deep in the body of the template, and the data is associated with the top\
    \ level containing the <div> node. Walking the tree of parent nodes is the easiest\
    \ way to find it. However, it's worth noting that the class used to identify the\
    \ container will not get confused with other nodes on the page because bugs that\
    \ it are difficult to correct without\n\nIf the associated data is found, the\
    \ destroy() method is called on it. This removes the relevant CartItem model,\
    \ which in turn triggers the event and then causes the panel to rerender. With\
    \ event triggers like this in place, there is no need to manually call render().\
    \ To do duplicates logic and ends making up the code more complex than it needs\
    \ to be.\n\n# JUMPING AND HISTORY\n\nOne of the last tasks to bring this application\
    \ together is to put in place some consistent navigation on the various panels\
    \ so that users can move backward and forward through the application smoothly\
    \ and quickly. The main launching point has been put on the home page, but two\
    \ toolbars are on each page so far have remained relatively unexplored.\n\nIf\
    \ you have more than a passing familiarity with user interface design principles,\
    \ you are probably familiar with Fitts' Law. This is a rule about user interface\
    \ for mouse users, in essence, that the farther the pointer is from an object,\
    \ the bigger the object ought to be to make it easy to hit. The corners of the\
    \ screen are particularly prized under this law because the action of blocking\
    \ further pointer progress when it hits the edge increases the effective size\
    \ of the button underneath. This is why operating systems tend to put key functions\
    \ in the corners of screens."
  merge: -1
  pgno: 265
- img_proc: true
  md: "Mobile design has a similar principle: When users are using a device in one-hand\
    \ mode, prodding at buttons primarily with their thumb, there is an arc across\
    \ the device where it's relatively easy to hit the screen. The bottom-left corner\
    \ is quite easy to hit, the bottom-right is slightly less so, the top-right is\
    \ not too bad, the top-left is a bit of a stretch (making the bold assumption,\
    \ of course, that the user is right-handed: largely, but obviously not always,\
    \ true).\n\nFor two of the most important buttons in the application, then, I\
    \ place a link to the home page on the bottom left in the footer area and a link\
    \ to the cart bottom right. Additionally, I want the cart button to be attached\
    \ to the footer shows the users how many items are currently in their cart.\n\n\
    Since the footer is the global stage, the app/index.coffee file is the place to\
    \ go to add these new features:\n\n```\nclass App extends Stage.Global\nevents:\n\
    \  'tap footer .home' -> @navigate('/home', trans: 'left'\n  'tap footer .cart'\
    \ -> @navigate('/cart', trans: 'right'\n\nconstructor: ->\n  super\n\n  new Home\n\
    \  new Cart\n  new ProductPanel\n\nSpine.Route.setup shim: true\n\nCartItem.bind('change',\
    \ @update_title)\n\n@cart_button = $(\"<div class=\"button cart right\"></div>\"\
    )\n@home_button = $(\"<div class=\"button home\">Home</div>\")\n@footer.append(@home_button,\
    \ @cart_button)\n@update_title: =>\n\n@navigate('/home')\n\nupdate_title: =>\n\
    \  quan = 0\n  if CartItem.count() > 0\n    quan = (item.quantity for item in\
    \ CartItem.all())\n      .reduce((a, b) => a + b)\n  @cart_button.text = \"Cart\
    \ (\" + quan + \")\")\n```\n\nPutting the buttons into the footer is a simple\
    \ matter for the constructor. Because the footer is essentially a fixture for\
    \ the app there, there's no rendering process to worry about. Events are wired\
    \ up for the buttons being added, and for once transition to the left is being\
    \ used. In general, when the user hits the Home button, it feels like going back\
    \ to the start, so that transition is appropriate."
  merge: -1
  pgno: 266
