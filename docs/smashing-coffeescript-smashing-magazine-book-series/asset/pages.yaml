  md: '# Accessing the API


    You''ve already been introduced to require(), so you know how to use it in code:


    ```

    api = require(''./user-model'')

    user = new api.User(''alex'')

    console.log user.name

    ```


    This code works as expected, and large libraries with extensive functionality
    are often used like this. However, if only a single piece of functionality is
    needed, CoffeeScript''s destructuring assignment can make the process of getting
    function references slightly simpler:


    ```

    {User} = require(''./user-model'')

    user = new User(''alex'')

    console.log user.name

    ```


    This code is functionally equivalent, but now there''s no intermediate variable
    acting as a namespace. Destructuring is really useful. It allows the developer
    to call a function that returns an array or an object, and immediately assign
    the results to separate variables.


    Lastly, a useful thing to point out about CommonJS module loader is, as the name
    implies, it was originally designed for JavaScript, which means that the same
    require() will work in JavaScript and the problem of making CoffeeScript-defined
    functions available in JavaScript code effectively goes away. The module export
    system can be used to pass the reference to a function through to calling JavaScript,
    and the developer doesn''t need to play tricks with the global scope.


    # USING EXTENDS ON EXISTING CLASSES


    As we''ve seen, calling CoffeeScript from JavaScript, and vice versa, presents
    a few small problems that can be easily overcome with just a bit of extra understanding.
    But things can get much more complicated than that!


    Classes can be defined in CoffeeScript, and JavaScript has an equivalent based
    on objects, but CoffeeScript''s classful inheritance is a big addition to standard
    JavaScript functionality. Is it possible for a CoffeeScript class to inherit from
    a JavaScript object and vice versa?


    The answer is yes—but this is where things can get very complicated, very quickly.


    # NOT ALL OBJECTS ARE CREATED EQUAL


    In CoffeeScript, the new keyword is used to create new instances of classes. However,
    in JavaScript, that''s not always used—some developers prefer to ignore the prototypical
    inheritance.'
