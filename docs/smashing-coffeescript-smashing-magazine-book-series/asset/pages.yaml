  md: '# CHAPTER 6


    a series of components for a Java application. However, it''s often worth thinking
    about how the code is going to be used within the JavaScript and what might be
    the most natural interface.


    One popular method is to create an API that simply returns a single type of object
    whose member functions always return the object itself. This is the fluent interface
    made by jQuery, and it makes sense in a variety of contexts. Although it''s used
    for DOM manipulation primarily in jQuery, similar interfaces have been used to
    query databases and filter plan.


    Another less popular but still common interface goes one step further. Instead
    of returning a single type of object, a single instance of a type is returned
    via a function call. Any time that function call called, the exact instance is
    returned, no matter where the caller is. This is technically known as the Singleton
    pattern.


