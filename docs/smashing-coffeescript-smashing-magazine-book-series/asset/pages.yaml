  md: "The event handlers are in the same way, although they end up being simpler:\n\
    \n```\n_event_select: (event, ui) =>\n  event.preventDefault()\n  @_selected.auto.push.val('')\n\
    \  $(@pieces.selected.append(@_makeButton ui.item)\n\n_event_remove: (event) =>\n\
    \  event.preventDefault()\n  index = $(event.target).parent().index()\n  @pieces.find(\"\
    *li\").slice(index, index+1).remove()\n  @_selected.slice(index, 1)\n```\n\nThere's\
    \ no need to look up the instance from the DOM now that the reference is bound\
    \ to the methods.\n\nAnd the private button-making method is updated with some\
    \ additional jUi classes to make it look slightly more perfect:\n\n```\n_makeButton:\
    \ (item) =>\n  $(\"<li class=\"ui-state-default ui-corner-all\"#${item.label}\\\
    n  <span class=\"ui-icon ui-icon-close\">\"></span></li>\")\n```\n\nThat's all\
    \ we require for the widget, and you can use the class without it being available\
    \ via the jQuery API. However, the point is to retain the same API—and this is\
    \ where $.widget.bridge() comes in. Functionally, this works almost identically\
    \ to the attach() you saw earlier when looking at classful jQuery plug-ins:\n\n\
    ```\n$.widget.bridge('simplewidget', SimpleWidget)\n$('#widget').simplewidget()\n\
    ```\n\nAnd that's all there is to it!\n\nThere's nothing wrong with this avenue.\
    \ It simplifies the process of writing widgets and creating hierarchies of widgets.\
    \ However, on the flip side, this approach takes widgets out of the normal jUi\
    \ hierarchy, which may or may not be a problem. As a result, it is not possible\
    \ to extend from a classful widget using a widget factory object or vice versa.\
    \ That is desirable depends on the context where the code is to be used. My experience\
    \ of jUi widgets is that those provided by the project themselves, very few of\
    \ them are actually cleanly extensible anyway.\n\n# SUMMARY\n\nDeveloping new\
    \ user interface elements is one of the first things programmers usually do when\
    \ introduced to jQuery. This chapter takes development with jQuery a few steps\
    \ further:"
