  md: "# Activating jQM Widgets Manually\n\nEarlier, a set of navigation links was\
    \ placed on the home page as a launch point for the user. Initially styled just\
    \ as a list of links, this set of navigation links is now an excellent candidate\
    \ for a jQM widget. This library excels at taking relatively standard pieces of\
    \ markup and rendering the element in a larger, more button-like format, which\
    \ is good news for mobile users who need a target that's easy to hit with a thumb.\n\
    \nThe change to the render () function in the Home panel is simple:\n\n```\nrender:\
    \ =\n@html require('views/home/index')\n@el.addClass('ui-page').find(\".nav-list\"\
    ).listview()\n```\n\nOrdinarily, using jQM's progressive enhancement, this type\
    \ of widget will be automatically enabled using a bit of declarative markup among\
    \ these lines:\n\n```\n<ul data-role=\"listview\">\n  <li><a class=\"nav-item\"\
    >_</a></li>\n</ul>\n```\n\nThis of data attributes is very common. The extremely\
    \ popular Dojo JavaScript library takes a similar approach, for example. But because\
    \ the automatic system has been turned off to work properly with Spine's render\
    \ framework, the widgets needs to be instantiated manually. In general, the data-role\
    \ of a jQM declarative widget is the same as the function call that jQM extends\
    \ jQuery. So you just need to find the element and call listview() on it.\n\n\
    As shown in Figure 12-5, the home page now looks slightly spittier with the addition\
    \ of the jQM widget.\n\n![](img/e3ca65867e7abc9da32dd88bfc67c4e4_261_0.png)\n\n\
    Figure 12-5: The app now has large navigation buttons."
  merge: -1
  pgno: 261
