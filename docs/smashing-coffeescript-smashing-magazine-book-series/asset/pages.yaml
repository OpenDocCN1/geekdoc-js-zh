- img_proc: true
  md: "# PART I\n\nHTML 5 has a number of useful validation features. The required\
    \ attribute does what it says and ensures that specific form elements must be\
    \ complete before being submitted. Also, new input types are available, such as\
    \ email, url, tel, number, date, and search. Primarily, the new input types allow\
    \ the browser to alter its user interface to suit the user. For example, on a\
    \ mobile phone, when data is entered into an input type=\"tel\"> the virtual keyboard\
    \ pops up will likely contain only numbers, and also offer the ability to look\
    \ up a telephone number in the user's address book. But, as a secondary feature,\
    \ new types of form input also offer some amount of validation (varying from browser\
    \ to browser) that the data entered is of the right type.\n\nAs good as HTML 5\
    \ is, client-side validation still has a role in scripting. In some instances,\
    \ there will be requirements for data that cannot be expressed in the HTML—for\
    \ example, requiring that at least one of inputs be filled in. Nothing prevents\
    \ you from using both the HTML 5 markup and client-side validation at the same\
    \ time, though—they are complementary techniques and will not interfere with each\
    \ other.\n\nHere we now to validate the login form using scripting. This code\
    \ also ensures that the password is a certain length and contains numeric as well\
    \ as alphabetical characters. Generally, this kind of stringency is applied to\
    \ the registration form rather than the login form, but it demonstrates the principle:\n\
    \n```\n$ \n\nform = $(form#login');\n\nform.submit(event) -> {\ndata[input.name]\
    \ = input.value for input in form.serializeArray();\n\nif (data.password.length\
    \ < 6)\n  invalid_reason = \"Password is too short!\"\n  if (!/\\d/.test(data.password))\n\
    \    invalid_reason = \"Password must contain a number!\"\n  if (!/\\w/.test(data.password))\n\
    \    invalid_reason = \"Password must contain a letter!\"\n\nif (invalid_reason)\
    \ {\n  event.preventDefault();\n  alert invalid_reason;\n}\n```\n\nAs noted, the\
    \ code waits for the DOM to be ready and then attaches a submission event handler\
    \ to the form. When the user attempts to submit the form, this event handler will\
    \ run.\n\nThe validation process is straightforward: Collect the data as it's\
    \ entered into the form and then check data items you're interested in. If the\
    \ validation fails, let the user know why and prevent submission of the form."
  merge: -1
  pgno: 61
- img_proc: true
  md: "# CHAPTER 3 • Working With Forms\n\nThis example uses validation as a type\
    \ of security measure. By checking that the password meets the system rules, it\
    \ can pick up typos and missed characters before the data is submitted to the\
    \ server. You'll see similar rules put in place for the user registration example\
    \ later on. It's important to note that client-side validation is to help the\
    \ user only; it doesn't form part of any security system, because it's trivial\
    \ to bypass. Never ever rely on this type of validation to enforce security on\
    \ a system you develop!\n\n# SYSTEMATIZING VALIDATION\n\nIt's tempting to write\
    \ a function to validate a specific form and attach that as a submission handler\
    \ to perform validation, but this approach tends to lead to repetitive code. A\
    \ better approach is to think about the separate components of validation and\
    \ how they can be joined up.\n\nWorking from the bottom up, clearly validation\
    \ functions are needed. They will take a value and return true or false based\
    \ on whether the value can be validated. Some sort of description or mapping is\
    \ needed to determine which validation functions need to be used on which form\
    \ elements, and lastly some overall function is needed to pull the whole thing\
    \ together.\n\nThe description or mapping is the first place to start because\
    \ it can describe the validation you want to do as a simple data structure:\n\n\
    ```\nloginValidation = [\n  name: 'password',\n  humanName: 'Password',\n  valid:\
    \ [\n    {type: 'length', config: {min: 6}},\n    {type: 'regex', config: {regex:\
    \ /\\d/, message: 'must contain a number'}},\n    {type: 'regex', config: {regex:\
    \ /\\w/, message: 'must contain a letter'}}\n  ]\n];\n```\n\nIt's worth thinking\
    \ about a problem first by considering sensible data structures that will be needed\
    \ to solve the problem. In this example, the validation rules or schema, are simply\
    \ an array of objects, and the intention is to have one object per piece of data\
    \ that needs to be validated. However, each piece of data needs to be validated\
    \ against a few rules; hence, each object has an array valid that contains each\
    \ rule you want to validate the piece of data against.\n\nEach validator needs\
    \ different information in order to perform the validation, which is why there\
    \ is a config object on each rule—the specifics of each validation are pushed\
    \ down against each rule."
  merge: -1
  pgno: 62
- img_proc: true
  md: "# PART : CoffeeScript Basics\n\nThe next pieces needed are the functions that\
    \ will validate the individual values. These functions will need to be given the\
    \ value, of course, and they'll also need to receive config object to know exactly\
    \ how to validate the date. It's possible to make them return true or false based\
    \ on whether the validation passes. In this case, I'm making it a bit more sophisticated\
    \ by also returning a reason for the validation failure, where appropriate:\n\n\
    ```\nvalidateLength = {value, config} ->\n  if config.min?\n    return [false,\
    \ 'to short'] if value.length < config.min\n    if config.max?\n      return [false,\
    \ 'too long'] if value.length > config.max\n  return [true, '']\n```\n\n```\n\
    validateRegex = (value, config) ->\n  return [false, config.message] if not config.regex.test(value)\n\
    \  return [true, '']\n```\n\nIt's important that the validators have the same\
    \ function signature. That is to say, they take the same arguments. The code decodes\
    \ at runtime, based on the schema, which validator to call, and if each validator\
    \ needs to be called differently, a great deal of complexity is created. Now I\
    \ wrap these validators into a single object, where the key is the name of the\
    \ validator and the value is the validation function itself:\n\n```\nvalidators\
    \ =\n  length: validateLength\n  regex: validateRegex\n```\n\nIn the schema, instead\
    \ of referencing the functions, I've referenced them by a name. This validators\
    \ object is mapping the name to the actual function call. It's also possible to\
    \ define the validation functions first and use the functions directly in the\
    \ schema; however, that couples the code closely into the data structure and makes\
    \ it much more difficult to encapsulate the validation later.\n\nThe pieces for\
    \ the validator are now all in place. The validation functions themselves have\
    \ been defined, and there's a format for the schema that describes which functions\
    \ to call on what data. The validator needs both data to validate and the schema\
    \ by which to validate it:\n\n```\nvalidate = {data, schema} ->\n  valid = true\n\
    \  messages = []\n```\n\n```\nfor input in schema\n  for test in input.test\n\
    \    result = validators[test.type](data[input.name], test.config)\n    if not\
    \ result[0] # value is not valid\n      valid = false\n      messages.push(\\\
    #{input.humanName}: \\#{result[1]})\nreturn [valid, messages]\n```"
  merge: -1
  pgno: 63
- img_proc: true
  md: "# CHAPTER 3 • Working With Forms\n\nThe main body of the validator is not doing\
    \ much. It iterates through every input object in the schema, looking at each\
    \ rule attached to it in turn. If the data does not validate, it sets the entire\
    \ result to false and adds the reason the validation failed to a list of messages.\
    \ When it's done, it returns the result and the list of messages (which hopefully\
    \ are empty).\n\nIt's now really simple to attach the validation schema to the\
    \ form, and this is done after the DOM is ready, as:\n\n$ ->\n\n```\nform = $('form#login');\n\
    \nform.submit(event) => {\n  data = {};\n  data[input.name] = input.value for\
    \ input in form.serializeArray();\n\n  result = validate(data, loginValidation);\n\
    \n  if not result[0] {\n    event.preventDefault();\n    alert(result[1].join(\"\
    , \" \\));\n  }\n}\n```\n\nThe submission handler is a lot simpler now. It collects\
    \ the data from the form, sends it to the validator along with the validation\
    \ schema, and if the result is not true, it displays the reason—or reasons!—why,\
    \ and halts the submission.\n\nOverall, there's a lot more up-front code in this\
    \ validator than the simple validation function originally attached to. Most of\
    \ this code is entirely reusable though. To validate another form, you just need\
    \ to define a new schema for the validation and add the validator as a submission\
    \ handler. The validation can be used again and again on many different forms,\
    \ and as it's reused, the overall amount of code will be much less.\n\n# COMMON\
    \ FORM TECHNIQUES\n\nSo far the focus of this chapter has been on collecting and\
    \ validating data and the basic knowledge of forms required to make use of them.\
    \ Now it's time to go a bit further. Clientside scripting is useful for providing\
    \ validation beyond the capability of the browser, but it is capable of a lot\
    \ more than that. This section looks how you can extend form functionality to\
    \ enhance the user experience even further, using the techniques already covered.\n\
    \n# DISPLAYING VALIDATION RESULTS ONLINE\n\nValidation is a process that gives\
    \ users information. The point is not to get in their way (although users' *perspectives*,\
    \ it might seem like that sometimes), but to make sure that, as far as possible,\
    \ the data sent to the server is correct.\n\nThe examples covered so far do a\
    \ reasonable job of validating the data, but they do a poor job of communicating\
    \ problems back to the user. Utilizing the generally despised native alert() dialog\
    \ when validation fails does not result in an excellent user interface."
  merge: -1
