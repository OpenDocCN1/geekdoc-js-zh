  md: '# Anatomy of a Spine Application


    Before going too much further with the application just created, take a look at
    what''s actually on the disk:


    ```

    |-- app controllers

    |-- index.coffee

    |-- lib

    |   -- setup.coffee

    |   -- models

    |-- views

    |-- css

    |-- index.styl

    |   -- mixin.styl

    |-- .npmignore

    |-- package.json

    |-- Procfile

    |-- public

    |   -- favicon.ico

    |   -- index.html

    |-- slug.json

    test

    |-- public

    |   -- lib

    |     -- jasmine.css

    |     -- jasmine.html.js

    |     -- jasmine.js

    |-- specs

    ```


    In broad terms, the top-most directories are the most interesting: app/ is where
    the main application code is going to live, css/ is used to create stylesheets,
    public/ contains any static content that may be needed, and test/ contains the
    various test suites for the application, which is, Jasmine-based, should be relatively
    familiar.


    The two most interesting top-most files are package.json and slug.json, which
    hold some configuration for npm and here, respectively. On the face of it, their
    contents are quite similar: They may contain dependency information for the application.
    slug.json, being the here file, is concerned with the browser for the front-end
    code. It asks, "What are the other libraries that need to be sent to the browser
    for the client-side portions to function correctly? package.json, on the other
    hand, is concerned with the back-end code, What are the other libraries needed
    to build or run this application?


    Of the remaining files, Procfile is of interest only if you use the Heroku web
    platform, and .npmignore just lets npm know that the modules directory (created
    when npm install is) is not part of the package and shouldn''t be included in
    any deployment.'
