  md: "The rule here is actually easy to remember: When using an object constructor\
    \ defined in JavaScript, use a direct translation in CoffeeScript, and do not\
    \ insert new where it wouldn't be used natively.\n\n# CALLING COFFEESCRIPT FROM\
    \ JAVASCRIPT\n\nGoing in the other direction, writing new code in CoffeeScript\
    \ but calling it from JavaScript, is actually relatively easy—although there are\
    \ a couple of tricks to be aware of.\n\nClasses and objects transfer easily and\
    \ natively. In fact, their usage is so similar, you only need to know the appropriate\
    \ JavaScript syntax. Look again at a simple class:\n\n```\nclass User\n  constructor:\
    \ (@name) ->\n\n  getName: =>\n    @name\n```\n\nThis construct in JavaScript\
    \ is almost identical to the CoffeeScript version:\n\n```\nvar user = new User('test');\n\
    console.log(\"The user's name is \" * + user.getName());\n```\n\nMany JavaScript\
    \ libraries no longer require the use of the new keyword to create new instances\
