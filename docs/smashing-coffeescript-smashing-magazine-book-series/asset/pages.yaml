  md: "# CHAPTER 11 • Writing jQuery Plug-ins 209\n\nA couple of the empty method\
    \ bodies are left out for simplicity, but so, it's clear that this code is tighter\
    \ and more concise than the JavaScript version. Additionally, the overall wrapper-aliasing\
    \ s to jQuery on the off-chance that calling the plug-in has turned jQuery option\
    \ off—isn really needed; $ = jquery at the top of the file is sufficient, because\
    \ CoffeeScript already wraps the body of the code.\n\nWriting a procedural plug-in\
    \ using this skeleton is an exercise in filling in the blanks. The structure is\
    \ straightforward, and most plug-ins will have three or four extra methods defined.\n\
    \nHowever, a few things still aren't right. Primarily, this code doesn't mix well\
    \ with CoffeeScript's class-style object-oriented features, which means that some\
    \ of the existing development patterns and practices you've looked at are difficult\
    \ to apply.\n\n# WRITING A CLASSFUL PLUG-IN\n\nAlthough the prototypical nature\
    \ of JavaScript inheritance can provide the functionality required, within CoffeeScript\
    \ it feels unnatural to use those features directly—the provided classes and inheritances\
    \ are more straightforward, easier to use, and (arguably, at least) more idiomatic\
    \ CoffeeScript.\n\njQuery's plug-interface assumes the inverse, which is not entirely\
    \ surprising because the library was designed for JavaScript, and for the majority\
    \ of its life until this point, CoffeeScript didnt even exist. However, this demonstrates\
    \ how a CoffeeScript API can be adapted for the most un-CoffeeScript-like codebase.\n\
    \nBefore looking at how a CoffeeScript class-based plug-in might be integrated\
    \ into jQuery, take a look at how it might be written. Keep things simple, the\
    \ same API is used, but with a few modifications:\n\n+   - Instead of a plain\
    \ object and manual apply, there is a standard class.\n- There is an init() function—the\
    \ constructor—and a destroy() function.\n- API calls are methods defined in the\
    \ class.\n\nThe example here will be an upgraded <select> element, allowing developers\
    \ to put whatever elements within the drop-down they want, not just the text that\
    \ most browsers are limited to.\n\nConstructing this new select is the most difficult\
    \ piece, so first think about the structure of the rest of this plug-in, which\
    \ is starting from a regular class:\n\n```\nclass UpdateSelectPlugin\n\n  defaults:\n\
    \    background: \"white\"\n\n  constructor:(name, element, options) ->\n```"
