  md: '# CHAPTER 11 • Writing iQuery Plug-ins 219


    As an example, take a look at a tagging component. This kind of widget is familiar
    to users of Facebook, Gmail, or other similar web-based systems. The widget looks
    like a text input box; when the user clicks in a dropdown displays values from
    which the user can choose. If the user selects one of the suggested values, that
    value is put into the input as a kind of button. Some examples are shown in Figure
    11-1.


    ![](img/e3ca65867e7abc9da32dd88bfc67c4e4_234_0.png)


    Figure 11-1: This tagging component offers autocomplete and deletable selections.


    These components can be sophisticated:


    +   - If values have been selected, users can get rid of them by clicking a Close
    or Delete button on each, or by back-spacing over them—mixing text and graphical
    inputs.

    - If the user types a value that didn''t appear in the suggestion box, the widget
    may suggest to the server that will be created so that it is added to future suggestions.


    Of course, different developers want widgets to work in different ways. This widget
    can be extended in numerous ways by different people. This flexibility is crucial.


    You build a widget like this out of several components:


    +   - A text box for input

    - A suggestion drop-down'
