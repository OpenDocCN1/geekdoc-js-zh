  md: "# Making the API Visible\n\nExposing functionality is simple:\n\n```\nclass\
    \ UserModel\n  constructor: (@name) ->\n\nmodule?.exports =\n  User: UserModel\n\
    ```\n\nThat's the full definition for a simple class, and the export statement\
    \ required so that it can be used elsewhere. By now, the class definition won't\
    \ be problematic for you, but the export statement looks like a bit weird.\n\n\
    The first thing to understand is that usually the information exported will be\
    \ an object. The possible to export single values, but quite often that's too\
    \ restrictive—for internal export-ing single class may make sense, but when making\
    \ an API, usually there are a number of classes or functions to make visible.\n\
    \nTake a look at how that works in practice at the code shell. The function to\
    \ find the exported information is simply require():\n\n```\n$ coffee\ncoffee>\
    \ require('./user-model')\n{ User: [Function: UserModel] }\n```\n\nThe interface\
    \ is simple. Pass the name of the file to require(), and it passes back the exported\
    \ information. Although I've defined a class User, underneath JavaScript implements\
    \ classes as functions, so the structure has come back as an object with the names\
    \ given as attributes and functions as the values.\n\nLook back at the export:\n\
    \n```\nmodule?.exports =\n  User: UserModel\n```\n\nThe object is defined on the\
    \ second line, and you can put in there as many classes or functions you want\
    \ to export. Often, the name given matches the class name, but that doesn't have\
    \ to be the case (as just shown).\n\nYou could have simply written module.exports;\
    \ however, adding the question mark is a good practice. In environments without\
    \ module loaders, module generally doesn't exist, so attempting to reference module.exports\
    \ directly will cause an error."
