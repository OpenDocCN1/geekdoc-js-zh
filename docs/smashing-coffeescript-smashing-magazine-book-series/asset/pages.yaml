    # # BUILDING SOURCE MAPS


    There is an answer to the conundrum of how to debug CoffeeScript natively in the
    browser. While CoffeeScript itself is becoming rather popular, it''s actually
    one of a set of languages that compiles into JavaScript. Other projects, such
    as Google''s Dart project, seek to reach similar goals, and some projects, such
    as escript, have goals that are fundamentally different.


    All of these languages and compilers use the JavaScript runtime as a platform
    for executing code. It is thanks to the speed of modern JavaScript engines, particularly
    in browsers, that this is even thinkable. And as it becomes a more popular choice,
    more and more developers run into the problem of how to debug the native code.


    Source maps are a solution to this problem, and some others. Originally proposed
    by Google, the source map''s technical specification has been worked on collaboratively
    with other browser makers and so far enjoys support in most of the leading browsers
    (with the exception of Internet Explorer).'
