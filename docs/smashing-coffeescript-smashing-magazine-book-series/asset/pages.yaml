    # WORKING WITH MODELS


    You''ve seen how model objects can be created, saved, and retrieved by their unique
    identifiers. There are some other static methods to know:


    +   - exists(id): Determines whether an object with that unique identifier exists

    - destroy(id): Removes an object with a given unique identifier

    - destroyAll(): Removes all objects of that model

    - all(): Fetches all objects of that model

    - count(): Counts the objects of that model that exist


    These are relatively simple methods to understand but the most useful static method
    is difficult to explain. select() is used to "search" the objects for a given
    model, and return only those that meet certain criteria. To do this a callback
    function that discriminates wanted and unwanted objects is placed.


    As an example, imagine that you want to search for all events currently taking
    place. This requires a search for any event that has already started but not finished:


    ```

    current_events = Event.select(event) ->

    now = new Date()

    event.start < now < event.end

    ```


    Event.select() is being passed an anonymous function that takes an event as an
    argument and returns an expression that evaluates to true if the event was currently
    taking place. Letting select() passes each object of model to the anonymous function
    it was given, and if the function evaluates to true it includes that object in
    its return list. To put it another way, it''s returning all the objects for that
    model except those for which the function returns false.


    This is a tremendously flexible system. The filtering or search process can be
    as simple or as complex as the function to select().


    In addition to the static methods you learned earlier, there are some useful instance
    methods:


    +   - load(attrs): Updates the attributes of the model object from the attributes
    of the object passed in

    - destroy(): Removes a specific model object

    - toJSON(): Turns the model object into a JavaScript object containing only the
    keys and values of the configured model attributes.'
