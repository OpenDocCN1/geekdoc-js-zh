  md: 'There''s a further problem: localStorage doesn''t take into account that the
    browser have the same application open in a number of windows or tabs. This opens
    up the possibility that the application in one tab can read information from local
    storage and write it back in response to user input, but in the meantime, the
    same application in another tab might have already modified the information, meaning
    that out-of-date information had already been changed being stored again.


    Add to those problems there''s no way to effectively query the local storage for
    a specific key or a certain value—and that the performance of the implementations
    wasn''t much to write home about in the first place—and you have many developers
    who feel it''s simply not the effort.


    # INDEXEDDB


    To cure the various maladies of localStorage, a variety of structured data próposals
    the existing SQL in one way or another to provide the equivalent of a database
    and make it available as a form of local storage.


    As many standards, initially a number of competing but similar implementations
    were developed by different browser vendors. However, these views eventually coalesced
    around a single proposal that is now called IndexedDB.


    IndexedDB is not very much like databases in systems of used on the server-side
    to store massive amounts of information. There''s no requirement here to create
    data schemas, write queries to retrieve data, and develop complex mappings to
    translate data from the program to the database and back. IndexedDB is a form
    of object database, which can store JavaScript (and hence CoffeeScript!) objects
    directly.


    Although very similar to a key-value store in the same vein as LocalStorage, the
    IndexedDB API is almost entirely asynchronous, which means that calls to the API
    will return immediately, but handlers need to be set up to monitor the success
    (or not) of the call.


    Additionally, as its name suggests, IndexedDB contains a concept of indexes. That
    is, it stores parts of the information stored within it such that queries on the
    objects within it can be executed very quickly. Indexes can be added in an arbitrary
    fashion, so if (for example) the database is storing a list of users, an index
    can be added on their names so that queries by name quickly find the appropriate
    entries.


    Take a look at some quick examples, and it becomes clear that this is entirely
    another level of complexity:


    ```

    idb = window.indexedDB ||

    window.webkitIndexedDB ||

    window.mozIndexedDB ||

    window.moz_indexedDB

    ```'
