  md: "# 248 PART III •\n\n```\nCartItem = require('models/cart')\n\nclass Cart extends\
    \ BasePanel\n    constructor: ->\n        super\n\n        @list = new CartItemList\n\
    \n        @routes\n            '/cart': (params) -> @list.active(params)\n\n \
    \       CartItem.fetch()\n```\n\n```\nmodule.exports = Cart\n```\n\nAgain, an\
    \ umbrella-style controller panel is used to bring the cart panels together. To\
    \ begin with only one is listed, although it's probably appropriate to have the\
    \ checkout another panel within this system.\n\nThe shopping cart is a simple\
    \ list of products, and in a sense, is much like the product listing page, but\
    \ the functionality ends up being quite different. The basic panel to list the\
