  md: '# 302 PART IV


    extremely important development pattern that is crucial to distributed multiuser
    real-time collaboration: the Operational Transform.


    # OPERATIONAL TRANSFORMATION


    No textual description of Operational Transformation, or OT, is wholly adequate
    because the system is really, at its heart, a form of algebra. Don''t let this
    put you off though! Originally developed as a way of allowing more than one user
    to work on a document at once, OT is a way of thinking about how information is
    used within an application.


    For a simple example, imagine two users collaborating on the sentence, "The cat
    sat on the mat." The first user may want to change the cat to brown; the second
    user may want the mat to be red; in which case, the end result would be, "The
    brown cat sat on the red." However, there are two possible intermediate stages,
    depending on the timing of who makes the first edit. If the software worked in
    whole sentences, it would not be possible to make two simultaneous edits like
    this—one would get lost.


    The point of OT is to describe the changes made by a user in a way that allows
    for variations in sequence and timing. Changes to a document are broken into their
    smallest appropriate description—for, "Insert the word between the red and mat."
    This approach makes it easy to combine them even when the order changes, and the
    changes themselves are likely to conflict (although, of course, if two users attempt
    to change the same word at a time, a conflict of edits is inevitable).


    OT is not a single technology per se. Or something like it, can actually be implemented
    in a variety of ways, and the primitive operations, the small units that are the
    currency of OT, will be different from application to application. For a text
    document, inserting and removing characters may be enough; for a graphical application,
    a broader range of potential operations is required.


    # SEPARATING INPUT FROM OPERATION


    The keyaway from OT is that input and operation should be almost entirely separated.
    If an application has multiple simultaneous users, it''s almost as though a single
    computer has a number of different keyboards at which users are typing different
    things. Some of managing these different inputs and turning the stream of keystrokes
    from each user into an ordered process is required.


    To do this, OT asks that you consider the changes that an application might make
    to the data it has as a series of transforms and that input into the application
    is nothing more than a request for a specific operation that does the transformation.


    Viewed in that way, an architecture for this kind of application begins to suggest
    itself naturally. Starting with a model for the data in question, an interface
    is created that transforms the data in certain ways using a series of primitives
    (such as insert or remove a character, or add/remove/size/rotate a graphic)—whether
    it is local mouse, touch or keyboard, or remote input via some network socket—into'
  merge: -1
