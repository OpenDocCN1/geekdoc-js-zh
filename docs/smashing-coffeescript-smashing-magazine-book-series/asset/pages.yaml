    return code is 201, which indicates success. If the username does exist, the return
    code is 401, indicating failure. The change in return code dictates which handler
    on done() or fail() is called.


    However, the second type of error is different. It is returned by the server when
    something- has gone wrong (for example, an HTTP response with return code 500,
    indicating an internal error), or it might be the request itself failed (in which
    case, there''s literally no response).


    So, the handler set on the fail() callback as to handle two types of errors: the
    expected errors, which represent failure to validate, and unexpected errors, which
    indicate a technical issue.


