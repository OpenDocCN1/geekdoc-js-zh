    # COMPARING LOCAL STORAGE OPTIONS


    Recommended IndexedDB API for anything but the most serious uses is difficult
    because it''s not the most broadly supported feature at this point. However, with
    judicious use of polyfills, it''s possible to make a similar enough API available
    on other browsers to lessen the problem (although, if the performance of the database
    is critical, a polyfilled version will likely be sufficiently quick).


    Additionally, the API takes a lot of effort to use localStorage, particularly
    in the asynchronous version, which is the most broadly implemented so far. The
    standardization process between the browser vendors has taken a long time, and
    even where browsers support the API there is little consistency among them.


    However, the effort is worth it in a number of scenarios. IndexedDB is the future
    of the local storage, and in its current format it is quite complex, it offers
    significant benefits, and the complexity will be cut down with simpler interfaces
    built on top of it. For applications that need have reliable and predictable local
    storage, IndexedDB is the best future-proofed option available.


    # SUMMARY


    Although requests are popular and the API looks straightforward, it''s actually
    an incredibly tough and deep area. Using AJAX requests a reliable network is one
    thing, but dealing with mobile users is quite another.


