  md: '# BEST PRACTICES, FORMALIZED


    As developers started larger and larger JavaScript applications, they began to
    collect idioms and patterns that represented "best practice," which meant a variety
    of things, including only features that were broadly supported by browsers but
    staying away from features that had broad support but questionable value.


    As an example of the latter, to today there are arguments about whether JavaScript
    statements should end with a semicolon. Neither the specification nor the implementations
    require it unless than one statement is on a line, the rules about how a semicolon
    may be inserted into code are baroque and difficult to understand. But, many developers
    prefer not having superfluous semicolons in their code, and omit them.


    Global variables were also eschewed, and various object-oriented design patterns
    became common. First, working with the browser''s Document Object Model (DOM)
    became vastly easier using jQuery''s fluent API than the official W3C DOM API;
    second, virtually all the remaining browser incompatibilities that developers
    had to contend with were eliminated by compensating for them at the library level.


    CoffeeScript has been inspired by all of these ideas, and Concepts have been borrowed
    from functional programming languages, such as the increased emphasis on expressions
    over imperative code, also from popular systems scripting languages as Perl, Ruby,
    Python, which have developed succinct approaches to common data structure manipulations
    and explored what it means to be a dynamic language.


    As an example of how web programming has influenced CoffeeScript, you need no
    further than the humble function. JavaScript made the decision to make functions
    first-class objects, meaning that you can treat functions as any other data. You
    can return them as values from functions, and you can create them on the fly.
    Because web applications need to deal with asynchronous processes (in practice,
    this means functions return before they actually complete their work, such as
    the XMLHttpRequest API) it became natural to use functions as callbacks, a practice
    familiar to anyone who has developed a GUI on the desktop.


    In CoffeeScript, functions not only first-class, but are actually the easiest
    things to type. The syntax is concise, and you can construct them just about anywhere
    you please. This neatly demonstrates the whole approach of CoffeeScript: the things
    you need every day are concise and easily accessible. Programmers rarely, if ever,
    need to repeat themselves, and the amount of "boilerplate" code is minimal.


    Equally, it''s surprisingly hard to write invalid CoffeeScript, and certainly
    by the time the compiler does its work translating the code into JavaScript, the
    chances of any syntactic or typographic mistakes making it into the output are
    very small. As an example of how this can make a difference, many JavaScript programmers
    lay out arrays over multiple lines and start each with a comma. They do so because
    it prevents a trailing comma being left in the array. This is a well-known mistake
    that most browsers are'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'willing to tolerate. Internet Explorer, on the other hand, is entirely unforgiving
    of such an error and will generally decline to run any of the code that follows.
    A mistake is practically impossible to commit in CoffeeScript.


    In the short time it''s been available, there are already examples of CoffeeScript
    influencing the design of other languages—including JavaScript, where many of
    the Coffee features, if not the actual syntax, are being built into proposals
    for revisions of the language. This is not just a tribute to the design of Jeremy
    Ashkenas and the CoffeeScript community but also a strong indicator of the momentum
    to improve the browser platform for web designers and application developers.
    The brilliance and power of CoffeeScript could be summed up as “tomorrow’s web
    platform, running today”.


    # SOME WORDS ON THE SYNTAX


    This book introduces the CoffeeScript syntax gradually through example. Additionally,
    although the code being run is actually JavaScript, the JavaScript code generated
    will not be discussed, mainly because that''s a CoffeeScript implementation detail,
    which can change from version to version.


    It''s quite possible, although a bit of a stretch, to mentally translate CoffeeScript
    into the JavaScript that will run. I gently encourage you not to do so, at least
    while learning the language. The many advantages that CoffeeScript offers from
    the developer thinking in a style idiomatic to CoffeeScript, which means leaving
    the JavaScript behind.


    That said, for those of you who want to gain the deepest understanding of the
    language and know JavaScript well, it is often instructive to look at how CoffeeScript
    actually does that translation. For one thing, you''ll immediately gain a deep
    appreciation of how many lines of code the compiler is saving you from having
    to write!


    # HOW THIS BOOK IS STRUCTURED


    In addition to introducing CoffeeScript gradually, I''ve tried to put this book
    together in a way that makes sense and progresses technically. Most of the simpler
    topics are towards the front, and as you work through the book the sense of sophistication
    of the code and the concepts being discussed increases.


    +   - Chapter 1—Starting Up Your CoffeeScript Environment: This is the most crucial
    chapter, since without it you cant make progress. I recommend making sure you
    have a working environment in which you can test the code before trying to read
    too much further.


    +   - Chapter 2—Using jQuery: DOM Manipulation: You have likely had contact with
    jQuery by now, and this chapter serves as an introduction to CoffeeScript through
    some simple webpage code, and in particular it explores functions.


    +   - Chapter 3—Working with Forms: Although not tremendously exciting, forms
    have been the mainstay of web application development from the start and probably
    be for years to come. This chapter also introduces some more advanced CoffeeScript
    techniques.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '+   Chapter 4—Ajax requests: At this point, the book begins to get a bit more
    technical, as you examine how browsers create HTTP requests and look at the security
    of such requests and how to handle network reliability issues.


    +   Chapter 5—Object-Oriented Design: This might be one of the main reasons you''ve
    picked up this book; early on you''ll be looking at how CoffeeScript supplements
    the JavaScript OO system.


    +   Chapter 6—Using JavaScript Libraries: Although this is primarily a CoffeeScript
    book, it wouldn''t be complete without a look at how JavaScript integrates, and
    this chapter examines one of different scenarios.


    +   Chapter 7—Testing with Jasmine: Sometimes thought of as a bit of a passing
    fashion, test-driven development is extremely important to me, and in this chapter
    you learn some of the key tools for CoffeeScript applications.


    +   Chapter 8—Debugging CoffeeScript: Despite the the done in the previous chapter,
    bugs are a fact of life, but fortunately, there is a broad repertoire of debugging
    tools for CoffeeScript, and I''ll show you the most important.


    +   Chapter 9—Building Resources with cake and heme: This is the first chapter
    that will begin to look at genuinely large-scale CoffeeScript applications, by
    first looking at how they might be built and deployed.


    +   Chapter 10—Writing Applications with Spine: As a client-side framework, Spine
    is among the easiest to learn and use, and as a bonus it is written in CoffeeScript.
    I''ll show you how to write Spine applications but also how to get the most out
    of the framework itself.


    +   Chapter 11—Writing jQuery Plug-Ins: I tend to think that jQuery is arguably
    the most important JavaScript library, and although its use has been covered,
    this chapter is all about extending the library itself, as well as examining some
    code from its sister project, jQuery UI.


    +   Chapter 12—Mobile CoffeeScript Applications: I am a believer in the importance
    of mobile devices, which continue to rise in popularity, and this chapter of the
    book concentrates on developing Spine-style applications for the small devices
    and touchscreens.


    +   Chapter 13—Data Binding and Form Elements: Many of the proceeding chapters
    have concentrated on some interactivity of sort, but this will explore one of
    the most difficult areas: binding data to forms within the browser. This is some
    of the most complex event-driven code in the book.


    +   Chapter 14—Server-Side CoffeeScript: Although there are some small examples
    of server-side code dotted throughout the book, this is the main introduction
    to the popular Node.js system and some of the key modules. By no means is this
    an in-depth exploration, but I hope this will your appetite for much more.


