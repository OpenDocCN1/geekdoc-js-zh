  md: '# CHAPTER 2 Using jQuery: DOM Manipulation 39


    Not all types of page interactivity are like the slideshow developed earlier in
    this chapter. Not is only the code encapsulated, but the user interface to it
    is pretty encapsulated too. It exists in a specific area on the page, and doesn''t
    interact with another part of the page. It''s nice to have a feature that can
    be well isolated, but it''s not always possible to isolate a feature completely.


    As an example, say you have a page that contains three different slideshows, but
    that you need a single button that can pause all of them. The naive approach to
    this would be to create a button before any of the slideshows are created, and
    then pass this button to each slideshow so it can attach a click handler to or
    agree on some common selector that each slideshow can find. It would work, but
    it would be a bit messy, and it''s not an approach that will scale well to more
    complicated page interactions.


    This is where custom events come in. Instead of attaching separate handlers to
    one button, you can simply have the slideshows listen for a custom event, and
    have your single controlling button issue this custom event.


    On the slideshow itself, you can implement these controls with two simple listeners
    for some custom events:


    ```

    $(''body'').bind ''slideshow.start'', ->

    doStart()

    ```


    ```

    $(''body'').bind ''slideshow.stop'', ->

    deStop()

    ```


    These event handlers look like any other event handlers, except that the event
    being listened for is specific to the slideshow code. The event handler is attached
    to the <body> node on the page by convention: To listen for the events, the handler
    needs to be attached to a node on the DOM. <body> is convenient because it''s
    always going to be on the page, and if it''s triggered but not caught by any listener
    it won''t end up bubbling very far; there should be only one parent. It''s useful
    to choose a different node if the events should be somewhere private within a
    piece of code, but the page body is generally a good choice.


    Using these custom events makes it easy to place a single control on the page
    to control every slideshow. To stop all the slideshows you can do this now:


    ```

    control = $(''<buttonStop all</button>''

    $(''body'').append(control)

    $(control).click ->

    $(''body'').trigger(''slideshow.stop'')

    ```


    A button is created, placed on the page, and a click handler attached to it which
    triggers the custom event—it''s as simple as that. This really straightforward
    mechanism lets you plug different pieces of code together. It''s even possible
    to send additional information through the custom event:'
