  md: "# CHAPTER 10 • Writing Applications with Spine\n\nthis stack is created first\
    \ activates the controller labeled \"view\" (which is PageView) as defined by\
    \ the default attribute.\n\nThe controllers are individually labeled under the\
    \ controllers attribute, and then referred to by label based on the URI. currently\
    \ set in the browser. The routes configured in this example identify three different\
    \ URI formats, each having an identifier as a variable component. The path `/pages/123/edit`\
    \ routes to the PageEdit controller by this rule set.\n\nNavigation to a URL can\
    \ be caused by a number of different ways. The application can trigger itself\
    \ by calling @navigate(path) but equally navigation can be triggered by the user\
    \ clicking a link. Virtually all browsers support hash fragment navigation, resulting\
    \ in paths that look like example.com/#internal/path. For the purposes of the\
    \ application, everything before and including the # symbol is ignored. The browser,\
    \ on the other hand, mainly cares about the part of URL before the # and ignores\
    \ any changes after it. This convention ensures that the browser remains on the\
    \ page, while the application is to identify different locations based on the\
    \ changes.\n\nModern browsers also have the option of using HTML 5's History API,\
    \ which provides the facility without using in-page anchors (appending a # and\
    \ extra information to the URL) to ensure that the browser doesn't navigate away\
    \ from the page. Enable the History API by calling Spine.route.setup(history:\
    \ true) early in the application start up. Unfortunately, it's more or less impossible\
    \ to turn this feature on for just those browsers that support it.\n\nWhen navigation\
    \ to a specific URL is triggered the routing rules are consulted to work out which\
    \ controller to activate. Each controller's active() method is then called, passing\
    \ in any potential variable parameters identified in the route:\n\n```\nclass\
    \ PageEdit extends Spine.Controller\n\nactive: (params) => {\n  super\n\n  page\
    \ = Page.find(params.id)\n  @render()\n}\n```\n\nIn this example, the route has\
    \ a variable identifier component—named id in the route—and therefore is available\
    \ in active(params) as params.id.\n\nIn addition to managing which controller\
    \ is active the stack modifies the DOM nodes assigned as controller containers.\
    \ Each time active() is called on a controller, the CSS class is set on its container\
    \ node and removed from any other controllers in the stack. This ensures that\
    \ inactive controllers can be hidden from view with a simple CSS rule:\n\n```\n\
    .stack > :not(.active) {\n  display: none\n}\n```"
