  md: '# MASTER COFFECRIPT AND BREW UP COMPLEX JAVCRIPT APPLICATIONS FASTER AND EASIER
    THAN EVER BEFORE


    Highly descriptive and easy to read, the CoffeeScript language adds syntactic
    sugar to JavaScript, making it faster and easier than ever to create complex JavaScript
    apps. Besides requiring one-third less code than JavaScript, CoffeeScript lets
    you program with more sophisticated features, such as list comprehension and pattern
    matching.


    Getting the hang of CoffeeScript can be a bit tricky at first, especially for
    programmers who cut their teeth on JavaScript parents, brackets, and often frustrating
    syntactic quirks. Written by expert Alex Hudson, this book gets you up and running
    with CoffeeScript right away. Featuring dozens of full-color illustrations and
    screen shots, this step-by-step guide delivers what you need to:


    +   * MASTER COSCRIPT LANGUAGE, SYNTAX, AND PATTERNS-FAST

    * PRODUCE MORE CONCISE, BETTER QUALITY CODE IN ONETHIRD THE TIME

    * GET THE HANG OF ADVANCED HTML5 FEATURES AND REAL-TIME COMMUNICATION IN COFFECRIPT

    * USE COFFECRIPT WITHIN NODE.JS PROJECTS

    * BLEND JAVASCRIPT WITH COFFECRIPT FOR VASTLY BETTER OUTCOMES


    With Smashing CoffeeScript to guide, in no time you''ll be writing perfect code
    with CoffeeScript and streamlining your JavaScript development.


    Alex Hudson is a technology expert and programmer. A hacker by trade, he likes
    to keep on top of new technologies. He hacks in C, C#, JavaScript, Perl, PHP,
    Python, and Vala primarily, and due to the day his job has a keen interest in
    HTML5, CSS, SQL, and NoSQL.


    Visit www.wiley.com/go/smashingcoffeescript to download example code files


    ![](img/e3ca65867e7abc9da32dd88bfc67c4e4_339_0.png)


