    work happens when data is retrieved from a server, manipulated somewhat, and then
    modified on the server. Almost all AJAX applications are patterned in this way.
    To demonstrate this point more thoroughly, in this section, I''ve put together
    a real-world example of how the front-end and back-end services are connected
    to provide a user registration service.'
