  md: 'As discussed earlier, though global is often used by server-side JavaScript
    implementations. On the browser, the uppermost scope is window. Perhaps you are
    happy coding for a specific implementation, or if not, perhaps you''re doing a
    little bit of extra coding to cope with that difference—for example:


    ```

    test =

    console.log "I can be called from JavaScript now"


    window.Test = test

    global.Test = test

    ```


    Note that a small amount of duplication occurs, but in general, this works reasonably
    well, and there are ways of making this extra code a bit simpler if there''s a
    need to export many functions.


    Lastly, in many environments, this (used outside of class definitions) refers
    to whichever object is acting as the global scope, which means as a final piece
    of simplification, the function can be written as


    ```

    console.log "I can be called from JavaScript now"

    ```


    # USING COMMONJS MODULES


    It''s clear at this point that you can write libraries a number of different ways,
    and as expected, different developers make use of all of them, sometimes simultaneously.
    This problem extended across different projects, but thankfully, we are now at
    hand to mitigate it, and one of the most useful solutions comes from CommonJS.


    At its heart, CommonJS is simply a group of developers with the goal of making
    the broad JavaScript ecosystem more consistent and cohesive. They have defined
    approaches in many areas, and module loading is one that they are known for.


    With any JavaScript project of significant size, early on the code gets broken
    up into a number of different files. The files are usually sewn together for deployment
    purposes, but quickly with problems that arise: Do they need to be sewn back into
    a specific order? How is it determined files are needed? CommonJS module loading
    is the answer to these problems and more.


    The module loading is based on a simple idea: expressing dependencies. If a piece
    of code uses a certain class or function, it needs a way of saying, "I need this."
    If a piece of code provides a certain class or function, it needs a way of saying,
    "I provide this."


    Those two pieces of information can be used to determine which files are needed,
    in what order, and to some degree, the module loading system also ensures that
    the authors of the code use standard methods of exposing the functionality in
    their libraries.'
