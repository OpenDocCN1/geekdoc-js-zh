  md: '# Alternatives to Spine


    I''d like to talk about what''s available other than Spine. As I''ve mentioned,
    other frameworks are available, and I thought long and hard about covering the
    Backbone framework (which was written by Jeremy Ashkenas, author of CoffeeScript)
    instead of Spine in this chapter. However, the relation between the two frameworks
    is a close one. Backbone was created first and is written in JavaScript (relying
    as well on the Underscore js library, which provides a number of useful additional
    features, many of which are now built into CoffeeScript).


    Both frameworks implement the MVC pattern, although Backbone also includes the
    concept of model-based data that usually represent something on the server-side,
    such as a collection of search results, from a page table or, a similar subset
    of data. Spine has no concept and uses methods to retrieve the data rather than
    through a collection. This is more of a matter of taste than ideology, but some
    developers seize on it a matter of great interest.


    Beyond that, the frameworks are very similar; in a sense, you can speak of Spine
    as being a CoffeeScript implementation Most of the developmental knowledge on
    one framework transfers easily to the other. CoffeeScript developers gain some
    useful conveniences, such as the ability to refer to the CoffeeScript source,
    easy integration with the hem, and the use of the native class system. These last
    few points convinced me to cover Spine in this book; if you wish to explore Backbone,
    doing so is only a small feat.


    Some other frameworks are worth mentioning, too. Angular has built up a large
    following, largely on the back of its comprehensive approach to data binding,
    making it immensely unsuitable for building large applications on data. As framework
    has strong "opinions" on how features should be implemented makes it inflexible,
    and has a substantial amount of code in it; it''s very much the total solution,
    though.


    Knockout also deserves a special mention as a declarative system based on a different
    pattern called Model-View-Model, or MVVM. Again, it relies on using two-way data
    binding to do the heavy lifting people value most, but frees you from writing
    views and controllers in the same style you do in MVC: In a view this is just
    an HTML page, albeit with special attributes that make it look more like a template.
    As the developer, you write models (effectively, standard JavaScript objects,
    with some slight enhancements), and Knockout binds the view and model so that
    changes in one are reflected immediately in the other.


    I''ve personally used it with great success in a number of projects, although
    a point comes where the complexity of the view weighs quite heavily. Although
    a page using Knockout.js bindings looks a lot like an HTML template, there tends
    to be more logic than I''m happy with, making simple interface changes more complicated
    to achieve.


    # CREATING A NEW SPINE APPLICATION


    Spine comes with some few tools that make it really easy not only to starting
    the application but also to add new pieces to it, and to actually running it as
    want. The first step, as you said, is to ensure that the correct pieces are installed
    and available for use with npm:


    ```

    npm install -g spine.app hem

    ```'
