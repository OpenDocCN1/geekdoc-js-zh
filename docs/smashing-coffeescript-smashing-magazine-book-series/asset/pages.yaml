  md: "This base class updates the options in the class definition and provides a\
    \ getter to access the\nDOM element associated with the widget. If a widget name\
    \ is given, that name is used to\nassociate the instance of the widget with the\
    \ DOM element.\n\nIt would be nice if you didn't have to supply a widget name.\
    \ Unfortunately, this is difficult for\na number of reasons. It's difficult or\
    \ impossible to determine from a given object which\nclass actually is—because\
    \ the class is essentially a CoffeeScript invention. Without being\nable to determine\
    \ the class, it is impossible to work out a widget name that makes sense and\n\
    does't clash with other widgets, so you must provide one.\n\nThe start of the\
    \ new version of the tagging widget now looks a lot more like standard\nCoffeeScript:\n\
    \n```\nclass SimpleWidget extends JqueryUIWidget\n\nwidget_name: \"simplewidget\"\
    \n\noptions:\n values: [\"One\", \"Two\", \"Three\", \"Four\"]\n\n_selected: []\n\
    \n_init:\n @pieces = =\n  auto: $(`<input>\")\n  selected: $(`<ul></ul>`)\n\n\
    \ @refresh():\n```\n\nOnce the widget is created, the fat-arrow methods can be\
    \ used, which immediately\nstarts many of the references easier and clearer. The\
    \ process of refreshing the content\nalso starts looking a lot clearer:\n\n```\n\
    refresh: =>\n @pieces.selected.off('click').html('')\n for obj in @selected\n\
    \  @pieces.selected.append @makeButton obj\n\n $(@element).html('')\n  .addClass(@widget_name)\n\
    \  .append(@pieces.selected)\n  .append(@pieces.auto)\n\n @pieces.auto.autocomplete\n\
    \ source: @options.values\n select: @event_select\n\n @pieces.selected.on('click',\
    \ 'span', @event_remove\n```"
