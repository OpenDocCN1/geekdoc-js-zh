  md: '# PART II  CoffeeScript Proie


    This process has a couple of notable stages. First, the source files must be defined
    within an array, building the build task a list of files and—crucially—the correct
    order in which they should be joined. For some code, the order in which the files
    are merged won''t matter, but in some situations it will, particularly where objects
    or other structures are initialized as part of the process of parsing the code.


    Second, the source is joined before being converted into JavaScript by the coffee
    compiler. Doing so isn''t absolutely necessary, but it reduces the overhead of
    the various tweaks coffee performs, such as the surrounding closure that adds
    to code being output.


    # HEM FOR FURTHER MINIFICATION


    The higher-level tool hem brings together many of the features of the build process
    already discussed and so that you don''t have to write the various tasks manually
    and directly.


    At this point, hem is probably not on your system, but like all the other packages
    used here, you can easily install it by calling npm install hem at the command
    line.


    hem has slightly stronger expectations about how a project''s directory structure
    is laid out, and which these are configurable, the defaults are sensible:


    +   * /app/—Contains the source code to the application.

    * /css/—Contains all stylesheets used by the project.

    * /public/—Contains any external resources, such as images.

    * /test/specs/—Contains any test files included.


    A sister command, Spine.app, will create a project with this layout already in
    place. Again, easily installed by npm install spine.app, Spine offers a variety
    of functionality that I''ll cover when you look at Spine in depth in Chapter 10;
    but the command of interest right now is


    ```

    $ spine app ./new-path

    ```


    This creates the standard file layout under the directory new-path as well as
    a number of files describing the project. Once you''ve created these, you have
    some minor setup to do bring in various library dependencies of the build system:


    ```

    $ cd ./new-path

    $ npm install

    ```


    Although this installs a number of different libraries, none of these become part
    of the project; they''re simply there for the use of the various hem functions.'
