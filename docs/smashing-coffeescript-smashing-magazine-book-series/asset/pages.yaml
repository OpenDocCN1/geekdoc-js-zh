  md: "# PART IV\n\nlogic built into them as possible. Controllers should orchestrate\
    \ the various model changes in response to a request and then render the appropriate\
    \ view to the client, while ensuring that only the logic required in a controller\
    \ is present and that application state or business rules rightfully should belong\
    \ in the model do not seep into them.\n\nThat said, like any good rules, there\
    \ are always exceptions. My experience is that different applications require\
    \ at least slightly different designs, and there are sometimes good reasons to\
    \ make some of these sections less separate than they ought to be. My first principle\
    \ is to avoid building anything that will be difficult to refactor later. I have\
    \ broken these rules and later come to regret my decision!\n\n# RENDERING VIEWS\n\
    \nThe view is really simplest component of the application, and the easiest to\
    \ describe. However, before looking at a view, take a look at the simplest possible\
    \ controller:\n\n```\napp.get('/', (req, res) =\n  res.render 'index.eco',\n \
    \ locals:\n    title: 'Home'\n```\n\nA lot is happening in this few lines of code.\
    \ app is the object that represents the entire application, and for the moment,\
    \ you don't have to know precisely how it's set up. Suffice it to say, the get()\
    \ method is defining what's known as a route.\n\nIt's no coincidence that the\
    \ method is named the same as the HTTP verb—app also has post, delete, and put\
    \ methods—and this call links the view and path used in the request to a function\
    \ that handles specific request, the controller. Each such controller has a (req,\
    \ res) signature. The first argument represents the HTTP request, the second response.\n\
    \nThis controller is essentially doing no work. It's calling the render() method\
    \ on the response, telling it which template file to use and what variables to\
