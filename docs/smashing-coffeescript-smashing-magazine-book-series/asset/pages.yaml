  md: "# 240 PART III • CoffeeScript Application Development\n\n```\nclass ProductPanel\
    \ extends Panel\n\n  constructor:\n    super\n\n    @show = new ProductView\n\
    \    @list = new ProductList\n\n  routes:\n    '/products/:id': (params) -> @show.active(params)\n\
    \    '/products': (params) -> @list.active(params)\n\n  Product.fetch()\n```\n\
    \nmodule.exports = ProductPanel\n\nThe ProductPanel controller is the main controller\
    \ for all product-related activities. Two routes are set up—one to list all products,\
    \ one to show an individual product page—and these are assigned to two yet-to-be-created\
    \ controllers. In addition, the product information is loaded as part of the constructor.\n\
    \nAt this point, it may not seem terribly to be loading up the product information\
    \ right at the start. After all, hope your shop will be successful enough that\
    \ there will be too many products to hold in memory at once! This doesn't need\
    \ to be a direct model, though. a smarter model that does searching or pagination\
    \ behind the scenes would be quite useful.\n\nNo view is associated with this\
    \ controller; it's more like an umbrella that serves only to instantiate the other\
    \ panels that will be needed. This pattern is rarely common: Panels share the\
    \ scene with each other. (It's possible to have a sufficiently complex pop-up\
    \ dialog, for example, that needs its own controller, but it doesn't make much\
    \ sense to have in a pop-up panel.) Here, there is a state binding that them together\
    \ (in this case, the product data), so it makes sense to group them by panel.\
    \ Since this panel isn't actually going to display anything directly, it doesn't\
    \ need to inherit from the BasePanel class class.\n\nListing the products available\
    \ in the shop requires a ProductList class set up earlier.\n\n```\nclass ProductList\
    \ extends BasePanel\n\n  title: 'Products'\n\n  className: 'products list list'\n\
    \n  constructor:\n    super\n    Product.bind 'refresh change', @render\n\n  render:\n\
    \    items = Product.all()\n@html require('views/product/list')(items)\n```"
  merge: -1
