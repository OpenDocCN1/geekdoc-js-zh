  md: '# # ACKNOWLEDGMENTS


    To begin with, I''d like to thank the wonderful team at Wiley: firstly, Chris
    Webb for reaching out to me in the first place but then being incredibly positive
    about the various ideas I pitched to him. Secondly, Sydney Jones Argenta, whose
    tolerance and patience with me has been out-matched only by her skilled leadership
    of this project, and without whom this book wouldn''t have happened. I also need
    to thank the various editors and reviewers who spent their time on my manuscripts,
    this book is so much the better for their work.


    A large proportion of this book covers CoffeeScript, jQuery, and Spine; software
    authored largely (to begin with, at least) by three individuals: Jeremy Ashkenenas,
    John Resig and Alex McCaw, respectively. They deserve not only my thanks for their
    prolific technical authorship (beyond even those projects mentioned), but broader
    recognition of their contribution to the Internet and technology in general. The
    world needs more inspirational coders of their ilk.


    Lastly, I need to thank my family for providing the time and space to write. My
    wife is my constant support, and my parents, sister and various in-laws have all
    been tremously encouraging. I have a new-found respect for those who commit to
    writing a book but also for their families, whose contribution is difficult to
    overstate.'
