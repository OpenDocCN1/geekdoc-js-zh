  md: "# CHAPTER 2 • Using iQuery: DOM Manipulation 41\n\n# DETECTING CSS FEATURES\n\
    \nOne of the latest and greatest features from CSS3 that has begun to see wide\
    \ support is the concept of the CSS Transition. Transitions allow you to write\
    \ specific types of simple animation with no code. You simply define them within\
    \ a page's stylesheet.\n\nThe benefits of this type of approach are numerous:\
    \ Controlling animation from within the browser's JavaScript engine requires to\
    \ execute many times per second to 'run' the animation and position elements correctly\
    \ for the next frame, which means less time for running other parts of the code.\
    \ Additionally, browsers tend to have access to graphical acceleration hardware,\
    \ which means that the animation effect can often be offloaded to the graphics\
    \ card, reducing the load created by the browser but also making the effect smoother.\n\
    \nThe general approach for detecting a CSS feature is simply to examine the DOM\
    \ and look to see if a CSS style is available, and this is easy to do in CoffeeScript,\
    \ making liberal use of the existential operators.\n\nPicking a node on the DOM\
    \ is the first step, so that you can examine the various properties available\
    \ within node.style. That makes up the first few steps of the detection function.\
    \ It's possible that you can't find a DOM node, although it would be highly unusual\
    \ within a browser. But it is more possible in an environment outside of a browser\
    \ such as node. It is also possible that the DOM node does not have CSS styles\
    \ defined, so the function returns false early in either of those situations.\
    \ The existential operator can be used to\n\n```\nsupportsCss = [property] ->\n\
    \  node = document.body ? document.documentElement\nreturn false if not node?.style\n\
    ```\n\nIf the code gets past that, it can test for specific CSS feature support.\
    \ In the first instance, that is easy: if the property exists, return true. However,\
    \ CSS isn't that simple! A feature could be implemented but hidden behind a vendor\
    \ prefix. This is often done when a feature is being tested, or if the support\
    \ is not 100% complete. It's up to you to determine whether to test for vendor\
    \ prefix styles, but this is how you do it:\n\n```\nreturn true if node.style[property]\n\
    \nprefixes = ['Moz', 'WebKit', 'KHTML', 'ms', 'Oac']\nreturn true for prefixes\
    \ in when node.style['#' + prefix + '#{property}']\n```\n\n```\nreturn false\n\
    ```\n\nTesting the various prefixes uses the most list comprehension you've seen\
    \ yet, and it's worth fully understanding what that line is doing. The when filters\
    \ out the prefixed properties that do not exist; if a prefixed property exists\
    \ the return clause is triggered. And, if none of the properties tested exists,\
    \ the function simply returns false."
