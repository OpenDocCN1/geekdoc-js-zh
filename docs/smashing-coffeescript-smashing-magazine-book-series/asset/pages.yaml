  md: '# PART II


    ![](img/e3ca65867e7abc9da32dd88bfc67c4e4_155_0.png)


    Figure 8-1: The Firebug console tab demonstrates code being run in the REPL.


    The script debugger support built Firebug is fine (although obviously reliant
    on the features within the browser), and one of the features that I use a lot
    lets me set breakpoints within the code and then step Script through execution,
    as follows:


    +   Open Firebug, click Script, and select the source file from the drop-down
    list. (This will be the JavaScript file).


    +   Find the line that you are interested in the source code and in the left column
    by the line number to set a breakpoint. (Ignore lines with gray numbers: Breakpoints
    cannot be set on those lines, pick the next line that can be used.) Figure 8-2
    shows what this procedure looks like.


    +   Reload the page to reset the execution of scripts or click the Rerun button
    on the Script tab.


    +   When the breakpoint hits, it''s then possible to step over the line (so that
    the next line can be executed), step into the line (if the line contains a function
    call, the next line to be executed will be the first line of that function), or
    step out of the line. (If it is called from a function, the next line to be executed
    will be the next line of that function.)'
