  md: '# CHAPTER 8 · Debugging CoffeeScript 139


    Familiarizing yourself with the output is not a bad thing at all. In fact, although
    it will look quite complex to begin with, before long, you will be to recognize
    the various structures that CoffeeScript outputs and understand where they''ve
    come from.


    Another aspect I''ve found is that reading the output occasionally surprises me;
    the JavaScript construct is not what I expected, and I would have coded it by
    hand different. Within the CoffeeScript issue tracker there is a lot of debate
    about exactly what code the compiler should be emitting. What is being output
    is the result of these debates: the collective JavaScript knowledge of the CoffeeScript
    community. I often say to people that one of the best ways to learn JavaScript
    is to study the output of the CoffeeScript compiler.


    # USING FIREBUG


    Being able to read JavaScript is half of the battle, but you can employ other
    tips and tricks to make the debugging experience slightly more pleasurable. To
    begin, I will discuss the use of Firefox on the Mozilla Firefox browser. I find
    this is one of the better environments to use. (Firefox on other browsers is definitely
    not the same thing at all). However, the developer tools within Google Chrome
    have a lot to recommend them.


    If you don''t have already, Firebug is available on this web page, which you can
    find at https://addons.mozilla.org/en-US/firefox/addon/firebug/.


    Simply click the Download Now to install the Firebug plug-in. In theory, it is
    also available within the browser by selecting Add-Ons from the Tools menu. However,
    when you search for Firebug, the system throws up hundreds of entries because
    there are now so many Firebug extensions.


    Once inactive, the browser toolbar should include a button with an insect logo.
    When grayed out, Firebug is inactive. Clicking the button activates the tool for
    that specific site, bringing up a panel at the bottom of the browser that can
    be docked into a separate window. The panel contains a number of tabs:


    +   - Console is the main browser console, where errors appear. It also contains
    a basic JavaScript REPL prompt at the bottom.

    - HTML allows exploration of the correct DOM tree and applied CSS rules.

    - CSS shows details of the loaded stylesheet rules.

    - Script shows details of the loaded scripts and gives access to script debugger.

    - Net lists the various network connections that the browser is making.

    - Resource allows inspection of all the resources that have been loaded for the
    page, such as scripts, images, fonts, and anything else.


    When activated, the panel should look like the one in Figure 8-1, which shows
    the Console tab.'
