  md: '# CHAPTER 12 Mobile CoffeeScript Applications 241


    So far, all of this is familiar. This panel is behaving as the other panels, although
    it''s the first passing data into the template. This is an opportune moment to
    start using the .jeco template format. Recall that well as compiling the template
    into the application, the .jeco provides an additional piece of jQuery that binds
    the original data into the template output. In normal Spine, this works brilliantly
    for list handling within Spine.model.


    The view is placed in views/product/list.jeco and is just a template for a single
    item:


    Since a series of items is being passed through to the template, the output will
    be a series of <div class="item">, but now the event handling becomes really straightforward:


    ```

    item = $(e.target).data(''item'')

    @navigate(''/products'', item.id, trans: ''right'')

    ```


    Any time a node with the class item is clicked, the handler above it is triggered.
    Since the .jeco template is outputting nodes, the original data item can be retrieved
    straight from the click target, and navigate can be called immediately with the
    item ID. This listing isn''t a lot to write home about at this point, but it looks
    like the one in Figure 12-3.


    ![](img/e3ca65867e7abc9da32dd88bfc67c4e4_256_0.png)


    Figure 12-3: Produce a basic list of products.'
  merge: -1
  pgno: 256
