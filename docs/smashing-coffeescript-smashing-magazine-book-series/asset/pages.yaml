  md: "# 208 III • CoffeeScript Application Developer\n\nI'm sure the point regarding\
    \ init() is clear: This is where the plug-in does the initial work and sets up\
    \ any ongoing functionality is required. However, destroy() takes a little more\
    \ explaining—after all, if the user is going to move on to another page, what\
    \ is the point of deliberately destroying the instance of the plug-in?\n\nThe\
    \ primary reason is to ensure that a DOM node doesn't need to be destroyed just\
    \ to remove a plug-in. A plug-in may need to be removed for many reasons—for example,\
    \ if a page has a large number of dynamic elements—but in theory, they can be\
    \ removed when the element is removed.\n\nFor larger applications, though, there\
    \ are times when a plug-in is added to a DOM node's to be long-lived. For example,\
    \ think about a plug-in used to edit part of a page within a content-management\
    \ system that automatically makes parts of the page editable or not. When users\
    \ finish editing, they want the page to return to the static mode, without the\
    \ editor. Perhaps the relevant DOM node is simply deleted and re-created, but\
    \ this approach steps on the toes of any other attached plug-in—meaning that the\
    \ application must track which plug-ins are using nodes and manage them appropriately.\n\
    \nInstead, using destroy(), the plug-in can selectively remove the parts of the\
    \ node that should be removed, and the rest of the node (including any other active\
    \ plug-ins) remains. This approach is much cleaner than destroy and re-create\
    \ and means plug-management isn't required. Additionally, on pages with many elements,\
    \ the browser does slightly better on the memory-management front—keeping the\
    \ pages fast.\n\nNow that the JavaScript version is covered, take a look at how\
    \ that translates into CoffeeScript. I keep this relatively straightforward for\
    \ side-by-side comparison:\n\n```\n() ->\nmethods =\n  init: (options) ->\n  \
    \  each ->\n      # initialise the plug-in here, once for each DOM node\n\n  destroy:\
    \ ->\n    each ->\n      # remove each attached node\n\nposition: ->\n  etc.\n\
    \n$fn.tooltip = (method) ->\n  if methods\n    methods().apply this, arguments[...]\n\
    \  else if type method == 'object' or not method\n    methods.init.apply this,\
    \ arguments\n  else\n    $.error '#{ method } does not exist on jQuery.tooltip'\n\
    ```"
