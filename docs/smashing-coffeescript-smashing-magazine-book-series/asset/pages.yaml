  md: '# CHAPTER 6 • Using JavaScript Libraries 109


    There''s a variable, no_elements, and a function, clearDisplay(). They have obvious
    and clear names in JavaScript. Do they translate simply to CoffeeScript?


    For functions, things are actually quite clear. By defining a function in JavaScript,
    you''re creating a block of code that can be called using a name. The name is
    created in a global scope and cannot be changed, although it can be redefined
    later on. That global name is also available in CoffeeScript and refers to the
    same block of code, so life is simple.


    Variables, though, are a totally different matter. Variables always have scope
    to the extent that it''s usually not to say that a particular variable is "global"
    in any sense—although there is often an outermost scope that behaves very globally.
    In browsers, that scope is usually window, in fact, a global variable as the preceding
    one will be window.no_elements. On the server side, though, it might be global.no_elements,
    depending on which server is executing the code.


    Thankfully, the number of times to access a variable elsewhere in JavaScript is
    actually needed, very very few, and when using third-party libraries, it''s almost
    unheard of. Functions and objects, as far as APIs are concerned, rule.


    # Constructing Objects


    In general, the JavaScript world, there are two ways of creating new objects,
    although they''re more or less equivalent, there are minor differences between
    the two.


    The first form uses the new keyword and takes full advantage of the prototypical
    system that JavaScript uses:


    ```

    user = new User();

    ```


    Aside from the trailing semicolon, this translates directly into CoffeeScript,
    new keyword and all. Because CoffeeScript objects are based on their JavaScript
    counterparts, there should be no noticeable difference between an object defined
    within JavaScript versus one defined within CoffeeScript.


    The second form eschews the new keyword, preferring instead to provide a function
    that returns a new object:


    ```

    user = User();

    ```


    When translating this usage into CoffeeScript, it''s tempting to reinsert the
    new keyword to make the call look like any other object construction. Although
    this tends to work in many instances, it can generate insidious bugs—particularly
    if the JavaScript function is implementing something like a Singleton pattern
    and returning to the same object instance for each call, for example.'
  merge: -1
