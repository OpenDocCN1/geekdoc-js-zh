  md: "So, first, the element is inspected to see if there is an existing instance\
    \ attached with the\nplug-name, and if so it is retrieved, otherwise a new one\
    \ is created. Then, if a valid method\nname was passed, it is called on that instance\
    \ with the other arguments provided.\n\nThis functionality is then attached to\
    \ jQuery, using the name. klass is simply a\nmispelled version of class—being\
    \ a reserved word, can't say class directly—the other\nAPI is actually simple:\
    \ A class and a name are all you need:\n\n```\n$ -> \nattach(UpdateSelectPlugin,\
    \ 'updateSelect')\n$(select.important()).updateSelect({background: 'red'})\n$(select.notimportant()).updateSelect()\n\
    ```\n\nNow the functionality to create instances attached to specific nodes has\
    \ been added to jQuery\nand can be called directly. The API is also translated,\
    \ so to remove this updater selector from\ntnotimportant elements is as simple\
    \ as this:\n\n```\n$(select.notimportant()).updateSelect('destroy')\n```\n\nOther\
    \ methods such as getval() and setval() work in a similar manner. And indeed,\
    \ the\nactual object can be retrieved and operated on directly:\n\n```\nsel =\
    \ ${'upgrade'}.updateSelect()[0]\ns.setval('orange')\nconsole.log sel.getval()\n\
    ```\n\nAs well as using the standard jQuery API then, it's possible to make available\
    \ a more advanced\nAPI that feels more natural to the CoffeeScript developer.\n\
    \n# INHERITING FROM AN EXISTING PLUG-IN\n\nNow you've done all the work to define\
    \ a plug-in in the form of standard CoffeeScript\nclass, it's time to see the\
    \ actual benefits of that work. The key benefit of defining a plug-in as\nCoffeeScript\
    \ class is the ability to inherit from it, to re-use functionality. For the most\
    \ part, the\npublic API of a plug-in is not going to change much, but internally\
    \ will be a variety of\nmethods that could be overridden. Architecting the internal\
    \ structures is the most\ndifficult part of ensuring that the code can be reused.\n\
    \nWith the upgraded drop-down class, the show() and hide() methods are separate,\
    \ even\nthey aren't complicated. The separation enables you to override them in\
    \ a subclass. It's\nnow easy to write a new plug-in with a different animation\
    \ to display the drop-down. For\nexample, to make the drop-down fade is as simple\
    \ as this:\n\n```\nclass FadeSelectPlugin extends UpdateSelectPlugin\n\nshow:\
    \ =\n  @showing = true\n```"
