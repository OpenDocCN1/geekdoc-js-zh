  md: "# CHAPTER 15 • Real-Time Web with Socket.io\n\n# COMET FOR LIGHTWEIGHT POLLING\n\
    \nAround the same time AJAX became popular, a new method of doing real-time updates\
    \ on the server-side became popular; it was informally known as Comet after many\
    \ different developers starting the technique. Relying on the fact that a server\
    \ doesn't need to give a response as soon as possible to a client, Comet takes\
    \ the architecture of polling but turns it into something genuinely real time:\
    \ The client opens a connection and makes a request, but the server doesn't respond\
    \ until it has event data to respond (or until the connection times out—which\
    \ may be a very long time indeed).\n\nConsuming fewer resources than polling,\
    \ but requiring a totally different technical setup, Comet makes a reasonably\
    \ good fit with AJAX techniques, although it's also possible to implement it with\
    \ other means (iframes, for example). However, this is very much a hedge-podge\
    \ solution. It is effectively still a polling mechanism, which adds additional\
    \ resource cost, and can tend to cause unfortunate side effects with web caches.\n\
    \nBetter solutions didn't arrive until the implementation of HTML 5, and after\
    \ this wait, two solutions came along it: Server-Side Events and WebSockets, both\
    \ of which are being standardized as part of the HTML 5 effort.\n\n# SERVER-SIDE\
    \ EVENTS AND WEB SOCKETS\n\nServer-Side Events, or SSE (not to be confused with\
    \ the Intel instruction technology), were proposed by the makers of the Opera\
    \ browser. They are the simpler implementation of an event-driven design and are\
    \ really unidirectional. Once the browser opened a connection to the server, the\
    \ connection is used by the server to send updates to the browser, but not for\
    \ two-way conversions. Supported by all A-grade browsers other than Internet Explorer,\
    \ SSE events are trivial to listen for:\n\n```\nif 'EventSource' of window\nevents\
    \ = new EventSource '/some/url'\nevents.addEventListener 'message', =>\n  if e.origin\
    \ == 'example.com'\n    console.log e.data\n```\n\nThis snippet first checks that\
    \ the browser supports the interface and then connects to a URL to listen for\
    \ events. A simple event handler is used to listen for messages—much like clicks\
    \ or other events are handled—and although the origin of the event should always\
    \ be checked as a security measure, it is very easy to set up a connection as\
    \ the browser does most of the other management.\n\nThere is, of course, much\
    \ more depth to this interface, with the ability to send custom events and get\
    \ more detailed status information.\n\nWebSockets are much more sophisticated\
    \ and, as such, a more difficult to use. In fact, they have been so difficult\
    \ to get that some browsers have taken a number of attempts to implement them\
    \ in a secure fashion—unlike SSE, WebSockets introduce a full bidirectional"
  merge: -1
  pgno: 308
- img_proc: true
  md: "communication channel with a web server, although notionally based on HTTP,\
    \ is effectively a brand-new protocol. The browser interface to this system is\
    \ again being standard-ized through the HTML 5 project, but the protocol is a\
    \ different matter, going through the IETF process under the cozy name of RFC\
    \ 6455.\n\nWhile WebSockets enjoy slightly wider browser support——because of the\
    \ support built into Internet Explorer 10, although sandy earlier—there have been\
    \ a number of different editions of the protocol, and realistically browsers released\
    \ much before 2012 support the latest (more secure) variation. However, the future\
    \ of the protocol is incredibly rosy, given its broad acceptance.\n\nConnecting\
    \ to a web socket is similar to SSE:\n\n```\n 'WebSocket' of window\nsocket =\
    \ new WebSocket 'ws://example.com:8080/updates'\n\nsocket.onload = =>\nsocket.send\
    \ 'Some message'\n\nsocket.onmessage = (event) =>\nconsole.log e.data\n```\n\n\
    The first obvious difference is that, as well as listening for messages, the client-side\
    \ has the chance to communicate messages back to the server as. Whether this is\
    \ a blessing or a curse is difficult to determine. A perfectly serviceable communication\
    \ channel is available (standard AJAX), but for it to use in the server of SSE,\
    \ it would need to tie the incoming AJAX request to the outgoing SSE channel in\
    \ order to provide something approaching WebSocket functionality.\n\nAnother major\
    \ difference is that the URI for the WebSocket endpoint is not http—it uses the\
    \ scheme ws:// to indicate that it is RFC 6455 protocol (or it may specify wss://\
    \ / as the secure, encrypted alternative).\n\nChoosing which type of system to\
    \ use (whether an up-to-date HTML 5-based system, or something akin to the earlier\
    \ polling-style mechanisms) is generally more of a server-side than a client-side\
    \ consideration. Where an existing web service framework is being used, there\
    \ may be less choice, particularly in the deployment of WebSockets. However, it's\
    \ also true that turning an existing service into one that is real-time capable\
    \ is such a radical step that often a more or less complete redesign is required.\n\
    \n# DOING MICRO-LOGGING IN I'M REAL TIME\n\nNow that I just said choosing a system\
    \ can be tough, I'm going to show you the way out on the client-side at least:\
    \ socket.io.\n\nWith the myriad options available, you may be thinking there's\
    \ too much choice and that the different options all do roughly the same thing\
    \ anyway. socket.io takes views and provides"
  merge: -1
  pgno: 309
- img_proc: true
  md: "an abstract interface to a socket that you don't have to worry about which\
    \ of the various\nAPIs are available in the browser code is running on. Much as\
    \ jQuery abstracts away\nspecifics of doing DOM manipulation, socket.io simplifies\
    \ the process of server-client\ncommunication through the browser.\n\nIn addition\
    \ to supporting the various in-browser APIs, socket.io provides a Flash-based\n\
    alternative—means that on the various older editions of Internet Explorer, the\n\
    chance of having to fall back to polling: pretty slim and that virtually all A-grade\
    \ browser\nusers will have a genuine WebSocket-like experience.\n\nIn addition,\
    \ socket.io provides namespaces and multiplexing, allowing an application to run\n\
    many different types of message over the same socket, without having to worry\
    \ about\nimplementing complex logic to separate\n\nBut all, socket.io comes with\
    \ a simple API that is more or less the same on both\nclient- and server-side.\
    \ Accessing a server with socket.io from the client is as simple as:\n\n```\n\
    socket = io.connect('http://127.0.0.1/')\nsocket.on('connection', () => {\n  socket.send('Initial\
    \ message');\n\nsocket.on('message', (msg) => {\n  # take some action\n  console.log(msg)\n\
    });\n```\n\nA socket.io connection is generally given an http endpoint on the\
    \ server, which is either\ndirectly a socket.io server or at least a connection\
    \ that can be passed to socket.io for\nprocessing.\n\nMuch like AJAX within the\
    \ client, the initial connection and then the sending and receiving\nof messages\
    \ happens asynchronously, so anonymous functions are again the order of\nday.\
    \ An application will usually open the socket early on as part of the page-loading\n\
    process and leave it open until the point where it is genuinely no longer needed—the\n\
    connect process, although quick, should occur only once on a page.\n\nThe server-side\
    \ equivalent is only slightly more complex than this:\n\n```\nio = require('socket.io').listen(80)\n\
    \nsio.on('connection', (socket) => {\n  socket.on('message', () => {\n    socket.send('This\
    \ is a response to an incoming message')\n  });\n});\n```\n\nThe API is also very\
