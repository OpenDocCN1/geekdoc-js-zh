    \ especially about whether users believe they’re online. For example, most people\
    \ with laptops or other mobile devices are familiar with a browser’s offline mode,\
    \ and it’s easy to trigger by turning off the WiFi device (or otherwise manually\
    \ taking the machine off the network). In most cases, the browser notices instantly\
    \ that the network has disappeared and can communicate to fact that scripts are\
    \ running.\n\n# STRATEGIES TO DEFER REQUESTS\n\nAs dealing with errors, there\
    \ is no correct way to decide when or how to defer requests. Indeed, whether it\
    \ makes sense to defer requests depends on the context of the application:\n\n\
    +   Where a request is attempting to save user data back to a server, it’s generally\
    \ preferable to defer the request rather than throw it away completely.\n\n+ \
    \  If a request is merely asking if there’s“anything new” from the server, it’s\
    \ unlikely to be worth deferring the question in any situation—better to simply\
    \ ask later when the response might come back.\n\n+   If a request is idempotent\
