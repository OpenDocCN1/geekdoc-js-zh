    2. FullCalendar receives the event and passes it through to the controller.

    3. The controller receives the events and creates a new event.

    4. The model fires a create event, triggering FullCalendar to re-load the data.


    This is a clean architecture: the separate pieces of code communicate using a
    system of well-defined events. Now look at how this is implemented in the controller.
    The first change is in the controller:


    ```

    Spine = require ''spine''

    Event = require ''models/calendar''


    class Calendar extends Spine.Controller:

    ```'
