  md: "# 212 PART III • CoffeeScript Application Develo...\n\nNote that some problems\
    \ start to become apparent. A basic implementation of handlers for this might\
    \ look as follows:\n\n```\n@select.bind('click', (e) =>\n  e.preventDefault()\n\
    \  if (@showing) then hide() else @show()\n@select.on('click', (e) => {\n  e.preventDefault()\n\
    \  e.stopPropagation()\n  @setval $(e.target).data('value')\n  @hide()\n```\n\n\
    The first handler is on the main element to show or hide the drop-down. That's\
    \ straight-forward enough, but then the click handler for the drop-down element\
    \ has an interesting extra clause: e.stopPropagation().\n\npreventDefault() is\
    \ used widely and stops the browser from taking the default action on a link—such\
    \ as visiting another page. stopPropagation() is much less often and is used to\
    \ prevent an event from bubbling. When a node on a page receives an event, such\
    \ as a click, it passes that event to the parent in the hierarchy. This is how,\
    \ for a hover state can work on multiple items within a DOM tree: The node that\
    \ the pointer is over gets mouseenter event that bubbles up through its parent\
    \ nodes, causing each of them to move into the hover state (if they weren't already).\n\
    \nIf the user clicks a DOM node that is beneath the main container, the container\
    \ receives the click event as well—and because the behavior is already bound to\
    \ that (to show or hide the drop-down), the behavior is triggered inappropriately.\n\
    \nOne way to prevent this situation is to use stopPropagation(), which ensures\
    \ that the event doesn't bubble up the DOM hierarchy. However, this is usually\
    \ a sign of poor design: It's always possible to ignore an event, but it's never\
    \ possible to get back an event that hasn't bubbled up.\n\nThere are performance\
    \ reasons to avoid bubbling events. Although browsers shortcuts, bubbling events\
    \ further than necessary to trigger the various bound handlers can slow performance,\
    \ especially when there are a lot of handlers on page. Even then, though, preventing\
    \ the bubbling should generally be a method of last resort.\n\nA better approach\
    \ is to ignore or interpret events based on the target of the event:\n\n```\n\
    @select.on('click', (e) =>\n  e.preventDefault()\n  if e.target == @selected_elem[0]\n\
    \  if (@showing) then hide() else @show()\nelse\n  @setval $(e.target).data('value')\n\
    \  @hide()\n```"
