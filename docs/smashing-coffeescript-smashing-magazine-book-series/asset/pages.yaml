  md: '# PUTTING COFFEE IN THE SERVER


    Before delving too far into the details, I want to take a few moments to recap
    some of the long and glorious history of JavaScript, starting with the early days
    of Netscape . From the beginning, JavaScript was intended to be a server-side
    language and a client-side one, and one of the earliest versions of Netscape Enterprise
    Server included for it. By 1996, Microsoft also had included support for the language
    in its web-server product.


    JavaScript was potentially poised to become big, but it simply didn''t take off
    for many reasons, the biggest hurdle being the server-side implementation was
    even less standardized than browsers were. A web developer could write script
    and stand a fair chance of working in the major browsers of the time; no such
    feat was possible with the wildly incompatible servers.


    With the arrival of Web2.0, two important things happened. First, new life was
    breathed into JavaScript, and its popularity as a language and development platform
    exploded. Second, web developers became ever-more concerned with their platforms,
    and cloud computing took off, the challenge to develop "web scale" applications
    that could serve many users simultaneously was taken up by many.


    JavaScript had a natural inclination toward event-driven programming. Google released
    a super-fast JavaScript implementation in its browser called V8, and an enterprise
    developer Ryan Dahl put two together to get four. He recognized that, with V8,
    JavaScript was not only fast enough to drive sophisticated server applications
    but also the event-driven design was a natural solution to the scaling challenge
    of dealing with thousands of network clients (the so-called C10k problem—adapting
    web servers to handle as many ten thousand clients at once, consequent solution
    was Node.js, and its growth in popularity since its release has mirrored the incredible
    resurgence of interest in JavaScript.


    # NODEJS AND COFFECRIPT


    This chapter focuses on Node.js on the server-side, using CoffeeScript instead
    of the traditional JavaScript. Many of CoffeeScript''s aren''t immediately evident
    as those in Node.js. Node.js provides an advanced JavaScript platform that not
    only offers excellent language support but also a wealth of libraries and tools
    to build software. However, the addition of more naturally classed object support
    and other facilities for programming-in-the-large that CoffeeScript brings to
    are a huge boon in this environment, and regarded by many enthusiasts as nearly
    essential for the development and ongoing maintenance of large server databases.


    The Node.js library package manager npm should be familiar to you at this stage.
    I continue to use in this chapter to assemble the various dependencies required
    to put together a functioning web-server application.


    In addition, I use the MongoDB document database, which is available on all platforms
    at www.mongodb.org. The installation and set up of this database is a little beyond
    the scope of this book, but the process is straightforward in most instances.'
