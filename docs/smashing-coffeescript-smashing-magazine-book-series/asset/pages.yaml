    deeper at Stylus—the system used to generate the output styles—and see how that
    side of the system fits together.


    # STYLING AN APPLICATION WITH STYLUS


    Stylus is a library in its own right—a system separate from Spine in the same
    way that hem and other parts of the default framework are usable in their own
    right. It''s not far wrong to think of Stylus as a templating system, but as well
    as being designed specifically for CSS. Stylus has a few features that make it
    a bit more powerful than a more generic system of templates.


    Now, consider some of the problems specific to CSS, which all developers come
    up against one or another. The list is in a sense enough, and different developers
    make different points, but these are the main things that spring to my mind:


    +   **Impossible or difficult to remove CSS rules:** CSS has inheritance, but
    it applies to nodes in the DOM; classes can be used as a form of mix-in to apply
    common rules to different elements, but then the set of required classes needs
    to be set on each node.

    **Easy to write invalid CSS:** Browsers are incredibly forgiving, but it''s easy
    to leave a quote dangling, or miss a parenthesis, and things break.

    **CSS can be very verbose:** Developers often find themselves writing the same,
    or similar, rules again and again; this gets worse when vendor prefixes are thrown
    into the mix.

    **Compiled, CSS can be very difficult to plough through:** Finding where a rule
    has come from, particularly if a templating system is generating the CSS, can
    be a royal pain.


    For larger projects, these are extreme pain points, impacting maintainability
    and your ability to get work done. Stylus has answers for all these failures and
    more, though, and is a huge boon for serious development work.


    # WORKING WITH STYLUS


    In a lot of ways there are huge similarities between Stylus and CoffeeScript:
    they share some common principles and their syntax has ended up very similar.
    Indentation is significant, various pieces of punctuation are optional, and the
    emphasis is on brevity. As, tools, they make a lot of sense together.'
