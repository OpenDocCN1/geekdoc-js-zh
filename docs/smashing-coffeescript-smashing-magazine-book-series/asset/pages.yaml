  md: '# CHAPTER 13


    jQuery. In general, this type of pattern is broadly useful –particularly where
    the comprehension involves matching or some other type of filtering, using CoffeeScript''s
    ever-useful keyword.


    The second key point is the distinction of different types of input. Unfortunately,
    in terms of setting a value on an input, jQuery''s val() implementation is slightly
    overloaded:


    +   - When operating with input types such as the standard text box, setting a
    value with val() simply sets the value attribute of the input, which becomes immediately
    the set value of the text.


    +   - When operating with input types that involve selection, such as a check
    box, val() again sets the value attribute of the input, but it does not make any
    change to the input selection.


    This last scenario is crucial. When the value of the input and the concept of
    the input being are two different things, it''s important to understand that val()
    is only setting the value of the input. It will not affect whether the input is
    selected; that has to be handled separately.


    The actual operation the binding is performing is not exactly as described earlier.
    It''s not simply transferring the data into the form; it''s also looking at each
    element and adjusting its value and selecting or checking it as necessary.


    There is a lot to say for an implementation like this. For the straightforward
    AJAX applications, a more sophisticated setup will be unnecessary. True, this
    implementation does impose limitations. By using an object as a key-value store,
    for example, the form is now limited to containing elements with unique names
    otherwise the form would not know which element of a duplicate name to set a specific
    piece of data on binding.


    In other applications, though, it becomes important to work with both the data
    and the user interface, and the most painful limitation of a one-way binding becomes
    obvious: Before data can be changed or accessed, it needs to be retrieved from
    the form. While the data is being changed, the form must be locked to ensure that
    the data doesn''t change and that it is then put back before the user can progress.
    The solution to this situation is to implement two-way binding.


    # TWO-WAY BINDINGS


    It is possible to use the one-way binding to retrieve and set data as required,
    in practice, coordinating this process generally ends with user experience limitations—for
    example, disabling a form while data is loaded in the background, leaving the
    user with little to do but perhaps waits a “loading” graphic.


    What is really a desired way of linking the form to the data at a slightly deeper
    level so that the current state of one always reflects the current state of the
    other, and if one changes, then the other changes in response.'
