  md: '# CHAPTER 14


    # SERVER-SIDEnCOFFEESCRIPT


    THE COFFEESCRIPT YOU''VE seen so far in this book is best described as *client-side*.
    Coffee-Script is designed as a solution to the various problems that web developers
    face, which usually mean code working within the environment of the web browser.
    Although many of the facilities and features of CoffeeScript are designed to solve
    client-side-problems, it’s not the whole story.


    JavaScript has exploded as a server-side scripting language over the past few
    years, and the reason for this is a project called Node.js, or simply *node*.


    Taking a different approach to the technical architecture of a web server, node
    asks the JavaScript developer to write highly event-driven and function-oriented
    code.


    It turns out that the event-driven style of coding required by node suits CoffeeScript
    down to the ground: all of the features that make CoffeeScript compelling in the
    client-side environment transfer directly to the server-side environment, and
    development of node-based servers is even more straightforward.'
