  md: '# CHAPTER 10 • Writing Applications with Spine


    match() to test whether a string matches a specific regular expression pattern,
    which is a feature that should definitely be used sparingly but that one could
    day be a lifesaver. image-size() is also interesting: It takes the path to an
    image, and it creates the correct width and height declarations for that image.


    I suggest reading the full documentation just to get a complete picture of Stylus''s
    repertoire. I also caution that the 80/20 rule apply strongly: A probable case
    of about 20 percent of the feature set will be the mainstay of what may get used,
    and for most people, it will be a similar set. You may be tempted to use ever-smarter
    features within the system, but it''s best to avoid doing so unless you have a
    good reason not. What you gain by reducing the size of the stylesheet can end
    up lost when the next poor developer comes along and has to spend time figuring
    what''s actually going on.


    The last thing I suggest is having a look at a project called nib. This is a library
    of mixins designed for Stylus to get the maximum out of CSS 3. It''s available
    at http://vision.github.com/nib.


    If there is a CSS 3 feature that you would like to use, the chances are that nib
    already has a mix-in that makes the feature much easier to use and that is cross-browser
    compatible by default.


    # SPINE''S DEFAULT STYLES


    Now, look at the default files provided by the skeleton Spine application: ./css/index.styl
    ./css/mixin.styl. The key file is the first one, and in its untouched state, it''s
    incredibly straightforward:


    ```

    @import ''mixin''

    ```


    Notice that @import is a valid declaration in a CSS file, usually asking the browser
    to go fetch another stylesheet. However, in this case, it isn''t getting a full
    URL, and in fact, even the filename are missing the file extension!


    What''s happening here is that the Stylus system is taking over this specific
    declaration and in-lining the content of mixin.styl. If the reference is to a
    file with a .css extension, the content is in-lined without processing, effectively
    just a nice way of saving some work and getting the content it would have to go
    and get. Without an extension, Stylus treats the file as another Stylus stylesheet:
    The content is pulled in, as though the rules had been written directly in the
    file, and the stylesheet is further processed.


    The mixin.styl file is far more interesting. As the name suggests, this is a series
    of mix-ins provided to make life a bit more straightforward for you, and to give
    some hints at the kind of things that are possible. Here are some examples of
    these functions:


    ```

    border-radius()

    -moz-border-radius: arguments

    -webkit-border-radius: arguments

    border-radius: arguments

    ```'
