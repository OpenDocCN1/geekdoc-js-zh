  md: "Calls to navigate() within the application don't result in changes to the URL.\
    \ The slightly annoying side effect of this is that if the application attempts\
    \ to navigate to an invalid route, nothing happens. There are a number of foibles\
    \ of mobile development, and this happens to be one of them.\n\nThese types of\
    \ launch points are more common because, although they involve an extra click,\
    \ the user can get to them quickly. It doesn't have to be the case that the home\
    \ page or any other page is used for navigation, either; navigation could appear\
    \ in a pop-up or as a response to a swipe command, although users sometimes have\
    \ trouble discovering such solutions.\n\n# Handling Events\n\nSome links are now\
    \ added to the mobile page, but they are inactive and don't work. They need to\
    \ be hooked up to navigate(). You can achieve this by adding a click handler to\
    \ the homepage panel:\n\n```\nevents:\n  'tap .nav-item': 'click'\n\nclick:\n\
    \  @navigate(e.target).data('navigate'), trans: 'right'\n```\n\nThe click handler\
    \ is nice and simple: If called, it looks to see if the event target has a data-navigate\
    \ attribute, and if so, the handler navigates to that attribute. The object passed\
    \ through as that the transition moves toward the right, which indicates progress\
    \ forward than backward.\n\nThis handler could also look at the href attribute;\
    \ however, because the URL doesn't actually exist on the server making content\
    \ available feels so semantically wrong to me. It requires the use of a class\
    \ or some additional URL inspection logic to prevent the internal handler from\
    \ taking over links to external sites (for example). However, I wouldn't say that\
    \ this approach is wrong per se; you can find plenty of online apps that just\
    \ do that.\n\nLike any other Spine controller, this handler is triggered by an\
    \ event table; however, something new is here: the tap event. As discussed previously,\
    \ mobile browsers make slightly different events available in different ways,\
    \ but Spine.mobile tries to smooth out this in a number of ways:\n\n+   - Touch\
    \ start and end events are analyzed and turned into swipe events, including direction\
    \ (for example swipeUp, swipeDown, swipeLeft, swipeRight).\n- If the device is\
    \ touch capable, click events are generally ignored.\n- If the device is not touch-capable,\
    \ click events are turned into tap events.\n\nThis isn't terribly ideal because\
    \ events are not readily synthesizable on touch devices, but it enables you to\
    \ develop a mobile site that will function effectively on a desktop device."
  merge: -1
  pgno: 251
- img_proc: true
  md: "# CHAPTER 12 Mobile CoffeeScript Applications 237\n\n# Emulating touchscreen\
    \ Chrome browser devices\n\nRecent versions of the Google Chrome browser include\
    \ basic touch input emulation as a feature for developers. Press F12 to access\
    \ the developer tools, and click on the bottom-right corner to access developer\
    \ settings. Under the User Agent heading is an Emulate Touch Events option.\n\n\
    When this option is enabled, the mouse can be used to generate touch events in\
    \ the browser, including swipes. However, it does not disable mouse events, so\
    \ you can expect to receive mouseover events, for example.\n\nReceiving both mouse\
    \ and touch events sounds odd, but in practice most developers need to assume\
    \ that this can happen anyway. The release of Microsoft Windows 8 has highlighted\
    \ that touch-friendly operating systems are still going to be paired with desktop-class\
    \ hardware, and that devices with both a touchscreen and a mouse should be expected.\n\
    \nI generally recommend that developers design applications that work correctly\
    \ with just touch, just mouse, or the combination of touch and mouse.\n\n# Writing\
    \ Extensible Panels\n\nAlthough the footer is more or less a global feature for\
    \ the application, the same is not true of the header. It is well known to keep\
    \ all part of the header as the user navigates through the application, though.\
    \ this can be done by creating an abstract panel class as an intermediary between\
    \ the panels being used and the `Spine` Panel class.\n\nIn this instance, I've\
    \ written a navigation handler for the homepage panel, it would probably be better\
    \ in the intermediate object because it's the type of functionality that should\
    \ be reused on different panels again again. This approach gives me the opportunity\
    \ to change the behavior of the group in a consistent way without having to resort\
    \ to patching the parent object.\n\nI've called this intermediate controller `BasePanel`,\
    \ and it can be created using `spine.app` as usual:\n\n```\nSpine = require 'spine'\n\
    {Panel} = require 'spine.mobile'\n\nclass BasePanel extends Panel\n\n  constructor:\
    \ ->\n    super\n\n  click: (e) =>\n    @navigate $(e.target).data('navigate'),\
    \ trans: 'right'\n\nmodule.exports = BasePanel\n```"
  merge: -1
  pgno: 252
- img_proc: true
  md: "The updated homepage controller then inherits from this new base:\n\n```\n\
    BasePanel = require 'controllers/basepanel'\nclass Home extends BasePanel {\n\
    \  events:\n    'tap .nav-item': 'click'\n\n  title: 'Toy Shop'\n\n  constructor()\
    \ {\n    super\n    routes {\n      '/home': (params) -> @active(params)\n   \
    \ }\n  }\n  render: => {\n    @html require('views/home/index')\n    @el.addClass('ui-page').find(\\\
    *.nav-list').list()\n    @el.removeClass('ui-page')\n  }\n}\nmodule.exports =\
    \ Home\n```\n\n# PROVIDING A PRODUCT LISTING\n\nThe first page of any note in\
    \ an e-commerce site usually displays the product catalog. Some-times it is set\
    \ up to display product categories, where products are grouped into various families\
    \ and the user navigates the hierarchy. More commonly, a search facility requires\
    \ the user to enter keywords and then returns an appropriate list of products\
    \ to the user.\n\nFor the purpose of this example, I'm using a piece of static\
    \ data on the back end to render a list of products, but nothing prevents a category-based\
    \ or search-based approach from being useful. The key with mobile is to get users\
    \ to the product or information they're interested in as quickly as possible.\n\
    \nFor small lists of information, like a small product catalog, simply displaying\
    \ the list is the most thumb-friendly approach. As the length of a list gets longer,\
    \ breaking it into chunks such as categories makes sense. At a certain length\
    \ the categories become too lengthy or large and keyword search the easier interface.\
    \ There is a trade-off where the interface is becoming more complex in order to\
    \ find the right result for the user more quickly.\n\nIn an ideal world, the search\
    \ engine is the best solution for this, but if the search results aren't great\
    \ or if users aren't in a position to explain exactly what they're looking for,\
    \ a browsable hierarchy can be more friendly."
  merge: -1
  pgno: 253
