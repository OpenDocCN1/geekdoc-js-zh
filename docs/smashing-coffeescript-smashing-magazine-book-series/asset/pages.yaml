    \ available, and since the CoffeeScript compiler doesn't do, you must do so manually.\
    \ Here's an example for node.js:\n\n```\nglobal?.Test = ->\n  console.log(\"I\
    \ can be called from JavaScript now\")\n```\n\nThe JavaScript code is now free\
