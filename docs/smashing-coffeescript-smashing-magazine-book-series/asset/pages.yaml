  md: '# CHAPTER


    # 9nBUILDING RESOURCES WITH CAKE AND HEM


    AS A COMPILED language, CoffeeScript source files are not the sort of thing that
    can be deployed directly, though actually, in all but the simplest JavaScript
    applications, the source is never deployed directly. To provide end users with
    the best performance, multiple processes are generally run over source files,
    which at least merges them into fewer, larger files. These processes often "minify"
    the files, too, by removing as much redundant information as possible.


    This chapter explores a few basic, useful tools: cake, stitch, and hem. As well
    as covering the processes as they apply to CoffeeScript source files, the chapter
    explains how you can use these tools to build other resources within a project,
    making the whole thing ready for production deployment.'
