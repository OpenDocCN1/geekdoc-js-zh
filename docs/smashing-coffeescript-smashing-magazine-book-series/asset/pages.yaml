  md: '# CHAPTER 3 • Working With Forms 53


    ```

    form.submit validationHandler

    form.on ''keyup'', '':input'', validationHandler

    validationHandler()

    ```


    The validationHandler utility function is new and slightly more sophisticated
    event handlers covered previously. Notice that references to event have existential
    property accessor embedded-event?.type is used instead of event.type.


    Without the existential operator, attempting to access event.type is essentially
    asking the type property of the undefined value, which will generate an error
    in most browsers. You can write this instead:


    ```

    warnRequired = if event event.type == "submit" else false

    ```


    This is a common pattern that JavaScript provides another idiom: using to say
    "give me this object, but if this object isn''t defined, just give me undefined".
    This process is called "soaking" because it "soaks up" the errors that would otherwise
    be generated without testing the first. This allows you to use this utility directly
    or as a normal event handler. When called, no event object exists, so the soaked
    access ensures errors are not thrown.


    Before moving from this validator, one of the event bindings deserves special
    mention:


    ```

    form.on ''keyup'', '':input'', validationHandler

    ```


    This is a delegated event handler. The handler is attached to the form node and
    listens for all children that match the given selector—that is to say, any input
    on the form. Every key event now triggers the validation handler.


    In practice, this means that as users fill out input, it''s validated as they
    type. Changes to the input are picked up almost immediately, and users get instant
    feedback about what they''ve entered. (See Figure 3-2).


    ![](img/e3ca65867e7abc9da32dd88bfc67c4e4_68_0.png)


    Figure 3-2: Feedback is validated as the user enters information.


    Source: Mozilla Firefox on Microsoft Windows 7'
