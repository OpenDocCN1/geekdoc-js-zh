  md: 'You can set more than one handler, and of course it''s not always necessary
    to set a handler for every event. I recommend, though, that you always set some
    sort of error handler. Otherwise, it''s easy to miss errors, particularly in a
    development environment.


    Looking back at the success handler on the previous request:


    ```

    .done(data) ->

    $(''staff'').append("<li>${m.name}</li>") for m in data.members)

    ```


    This is just simple function expecting data in the same structure as the testdata.json
    file contents. Since $.ajax() was set up to receive a JSON response to the request,
    the response body (testdata.json file contents) is automatically parsed into an
    actual structure.


    # CROSS-ORIGIN REQUEST HANDLING


    At this point, I want to comment on some of the security features found in modern
    browsers. Early in the process of developing the XHR APIs in different browsers,
    it was clear that there were substantial security concerns. Consider this scenario:


    +   1. A user Joe visits nefarious.com.

    2. A script on nefarious.com attempts to make an XHR request to popular-email.com,
    on the basis that many people use it and remain logged in.

    3. Joe, unfortunately, is a popular-email.com user and is logged in.

    4. The XHR request to Joe''s inbox succeeds, and the script makes another XHR
    request to send his private emails to the operator of the nefarious.com website.


    Without some type of security measure in this place, this scenario would be an
    easy setup for attack, and with many popular websites available—not just for e-mail
    but also for e-commerce and banking—before too long a user of those sites would
    likely get caught.


    Early on the standardization process, this type of scenario and many others were
    discussed by the various browser manufacturers, who recognized that allowing client-side
    code to make requests to any server it liked, there was a fundamental security
    problem that the end-user could not be protected from.


    Instead of allowing this possibility, the browser developers decided that browsers
    should restrict XHR requests to the same place script came from—a security measure
    called same origin.


    # UNDERSTANDING BROWSER REQUEST SOURCE


    The origin is defined as the combination of the hostname, the protocol, and the
    port number (given). So http://example.com/test.js has the same origin as https://example.com/testdata.json,
    but it doesn''t have the same origin as https://popular-email.com/inbox/ or even
    https://example.com/testdata.json (note the different protocol).'
  merge: -1
  pgno: 83
- img_proc: true
  md: "# CHAPTER 4 • Ajax Requests\n\nRequests to resources on different origins are\
    \ denied by the browser. Generally, and most\nanoying, the browser will not issue\
    \ a warning, either to the code making the XHR request\nhas been denied or even\
    \ to the browser user. The request simply fails. This is another\nreason I always\
    \ recommend an error handler for XHR requests. The error handler fires in\nrecognition\
    \ of the denied request, even if it doesn't indicate why the request was denied.\n\
    \n# JSONP REQUESTS\n\nAlthough having additional browser security is rarely a\
    \ bad thing, in some instances it does\nget in the way. It's not always the case\
    \ that resources in other origins should be treated as\nprotected. So, although\
    \ by default they are blocked by browsers, with some work, it is\npossible to\
    \ make requests that arent restricted.\n\nYou've been able to place scripts from\
    \ different origins in one single HTML page, and\nallow them to interact—for example,\
