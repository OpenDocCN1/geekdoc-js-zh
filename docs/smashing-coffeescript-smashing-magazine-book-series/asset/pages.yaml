    \ say to begin with dynamic languages, these types of data hiding are not entirely\
    \ necessary. They're used more often within compiled languages, because the reduced\
    \ API scope of the class definition leads to faster compilation. In dynamic languages,\
    \ data hiding doesn't benefit performance, so the convention is usually to prefix\
