    When you define functions that have no arguments, feel free to leave off the parentheses.
    Similarly, if you have a line that consists of only one function call, you can
    leave them off—but if you need to think about whether they should be, it''s best
    to leave them. Implicit parentheses never close until the expression is finished:
    so for clarity I recommend omitting the outermost pair:


    ```

    biggest = Math.max Math.abs(x), Math.abs(y)

