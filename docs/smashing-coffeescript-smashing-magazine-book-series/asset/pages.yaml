  md: "# BASIC HTML5 FORMS\n\nBefore looking at how to work with forms in CoffeeScript,\
    \ take a look at the forms themselves and how to implement them in HTML 5. Giving\
    \ users the ability to log in to a website by providing a username and password\
    \ is a common feature, and the form for that isn't complicated:\n\n```\n<body>\n\
    <fieldset>\n  <legend>Enter your username &amp; password to log in</legend>\n\
    <form method=\"POST\" id=\"login\">\n    <p><label>Username:\\label>\n      <input\
    \ type=\"text\" name=\"username\" autofocus required>\n    </label></p>\n    <p><label>Password:\\\
    label>\n      <input type=\"password\" name=\"password\" required>\n    </label></p>\n\
    \    <p><input type=\"submit\" value=\"Log In\"></p>\n  </form>\n</fieldset>\n\
    </body>\n```\n\nMost of this is valid HTML 4 as well, so one immediately apparent\
    \ feature is that HTML 5 forms are very backward-compatible. That is, new features\
    \ are added in a way that allows browsers to work even if they don't understand\
    \ the new features. For you, a developer, this is excellent news—HTML 5 forms\
    \ can be deployed today, and with the new features are crucial to the functioning\
    \ of the form, they can be polyfilled on older browsers.\n\nTwo specific HTML\
    \ 5 features are used on the previous form. First, setting the autofocus attribute\
    \ on the username field asks the browser to immediately focus the username field\
    \ for data entry. This saves users from having to select the input before they\
    \ start typing. Second, both input fields have the required attribute set, indicating\
    \ to the browser that they must be filled in before the form can be submitted.\
    \ Before HTML 5, both of these new features would require some form of client-side\
    \ JavaScript.\n\n# COLLECTING FORM DATA\n\nThe first step to using a form in any\
    \ way is to be able to see what data the form holds. This can happen at a number\
    \ of stages. It's possible for the browser to watch the data as the user enters\
    \ it and intercept the submission of the form data before it's sent to the web\
    \ server. It's also possible to take the process of data collection and form submission\
    \ entirely away from the browser and to handle manually using AJAX techniques.\n\
    \nTo begin, check the jQuery provides to investigate the data held within a form.\
    \ The most immediately useful feature is .serializeArray(), which returns the\
    \ data held in the form as an array. On the login form, the data returned could\
    \ look like this:"
