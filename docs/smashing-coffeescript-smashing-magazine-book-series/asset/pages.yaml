    \ is to hide the original element on the page:\n\n```\njq.after(@select).hide()\n\
    ```\n\n# ATTACHING THE PLUGIN-IN TO JQUERY\n\nHaving written a plugin-based on\
    \ a class structure, you might be thinking that it's not totally clear how this\
    \ might be used with jQuery. The absolute ideal interface would be some-thing\
    \ like this:\n\n```\n$.fn.updateSelect = UpdateSelectPlugin\n```\n\nUnfortunately,\
    \ jQuery is not going to instantiate the plug-in for you, so something smarter\
    \ is needed. It needs to be able to create instances of a plug-in, as well as\
    \ the mapping of (potentially chained) function calls to instance method calls.\
    \ On the bright side, this is a piece of code that can be reused and need not\
    \ to be boilerplate:\n\n```\nattach = (class, name) ->\n$.fn[name] = (optsMethod,\
    \ args...) ->\nresult = []\n\nfor elem in %\n  data = $(elem).data()\n  obj =\
    \ data[\"plugin_${name}\"]? = new klass(name,\n  elem, optsMethod)\n\n  result.push(obj)\n\
    \nif obj[optsMethod]\n  obj[optsMethod](args...)\n\nreturn result\n```\n\nThe\
    \ fundamental tool used here is jQuery's data() functionality. You can use it\
    \ to store arbitrary data against a DOM node, and to ensure that references to\
    \ any objects are cleaned up if the node is removed from the document."
