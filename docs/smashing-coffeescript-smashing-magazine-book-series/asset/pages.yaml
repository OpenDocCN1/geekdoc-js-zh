  md: "# CHAPTER 2 • Using iQuery: DOM Manipulation 33\n\nmight seem like academic\
    \ difference, but for something like setting a sensible default to a variable\
    \ it's crucial. A JavaScript developer might write an expression like var test\
    \ = $(node).data('test') || 1; as a way of setting a default, and many times that\
    \ works fine However, because logical or tests for truth, existence, it means\
    \ that you can never override a default that evaluates to true with anything that\
