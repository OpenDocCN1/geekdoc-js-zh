    \ valid: false, reason: 'Too long'})\n    else\n      promise.resolve({ valid:\
    \ true })\n    return promise\n```\n\nImplementation of the interface used earlier\
    \ when making AJAX calls you the likes of .done() and .fail(), which allow you\
    \ to set handlers to receive the success (or otherwise) status of an X request.\
    \ In the preceding code, the other side of the Promise interface is: .resolve()\
    \ and .reject() are used to decide success, or otherwise, which is then reported\
    \ to the handlers that have been set.\n\nThis is one of the most important aspects\
    \ of asynchronous design: When using an asynchronous interface, there's not always\
    \ a delay between asking a question and getting an answer.\n\nWith the validator\
    \ in the preceding code, the validation happens immediately, and on many browsers,\
    \ it's probably synchronous, too. However, by reusing the asynchronous API, it's\
