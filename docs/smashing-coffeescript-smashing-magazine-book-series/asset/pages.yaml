  md: 'The key concept here is that in CoffeeScript all functions are actually anonymous—that
    to say, they don''t have a name. If you want to refer to them sometime after you
    define them, you need to assign them to a variable to have a name to. This means
    runReady is not a function name at all; it''s just the name of the variable you''re
    using to refer to the function you defined. The previous two examples can also
    be called as you would:


    ```

    double(2) // this will return 4

    doubleIfEven(2) // this will also return 4

    doubleIfEven(3) // this will return 3

    ```


    For some readers, this distinction will seem odd. In languages where functions
    are treated as first-class citizens, they''re usually given names, and an anonymous
    function—sometimes referred to as a closure, or a lambda, depending on the language—a
    less frequently used. However, it quickly becomes second nature if you are in
    practice. The syntactical difference is an extra = in the function definition.


    # COMPILING COFFESCRIPT OUTSIDE THE BROWSER


    Now that you''ve successfully run some CoffeeScript in the browser, I''m going
    to quickly pull the rug from under your feet: this isn''t how to develop CoffeeScript.
    What''s happening here is that the CoffeeScript compiler is being loaded into
    the browser, with additional tooling to allow it to look for <script> content
    with the text/javascript type. When the compiler finds scripts it loads the content,
    compiles it to JavaScript which is then passed to the browser to execute. At this
    point, you''re bound to realize that this isn''t the most efficient process.


    So, what would happen next? The simple answer is it''s generally best to compile
    CoffeeScript into JavaScript and deliver it to the browser in the same way JavaScript
    is delivered. For projects consisting mainly of static files, this approach requires
    a small amount of extra work; for more projects, the compilation process can be
    integrated into existing media delivery systems, alongside other steps, such as
    automatic code checkers, test harnesses, and delivery compression, which I cover
    later on.


    # WHAT IS NPM?


    Throughout this book, you''ll be calling on the services of a variety of tools
    and libraries (not least of CoffeeScript), most of which are developed by different
    people as part of projects. Ordinarily, using a diverse tool set like this would
    be a pain. First, you''d have to track the tool you use and go through the process
    of installing it, making sure that it works with the other tools you''ve installed.
    You''d need to keep the tool up-to-date, and new features will require you to
    find other tools and install them before using the first tool. This problem has
    often been dubbed dependency hell in cycles.


    Enter the package manager, npm, to manage additional libraries or utilities that
    your project might need. Although not officially or historically an abbreviation
    of "node.js package manager", it was developed within the node.js project (a JavaScript
    execution environment for'
