    # TRIGGERING MODEL EVENTS


    Spine models have a sort of "life cycle" associated with them, and emit events
    in response to various changes. Four key events are associated with individual
    records in a model:


    +   - create is emitted when the instance is first created.

    - update is emitted when the data in the instance is changed.

    - destroy is emitted when the instance is destroyed.

    - error is emitted when the data in the instance fails validation. (You look at
    the validation process later in this chapter.)


    These additional three events are slightly less specific:


    +   - save is emitted when an instance is either created or updated.

    - change is emitted when an instance is created, updated, or destroyed.

    - refresh is emitted when all the records have been replaced by new data from
    the server.


    It''s possible to bind to any of these events through the model and react to the
    changes in the data. These events can be used to drive updates to the user interface
    by setting up handlers that listen for changes in model data and call render()
    (or an equivalent function) when changes occur.


    With a model for events defined, it''s possible to demonstrate how the user interface
    can be made to react to data events. The process I want to create looks like this:


    +   1. The user clicks on an appropriate date in the calendar to create a new
