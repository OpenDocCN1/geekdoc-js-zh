  md: '# PART IV


    Although is not the prettiest system in the world, the initial goals are met!
    The user is able to draw on the surface, and in principle, nothing is stopping
    that information from being communicated to a server in order to be broadcast
    to other users.


    # MODELING INFORMATION ACCORDING TO OT


    I made the claim earlier starting from a single-user application design like was
    probably the wrong way to start, so now let me explain that statement more fully,
    the design for the whiteboard given so far and incorporating the ideas of operational
    transformation.


    In any system where collaboration occurs in real time, careful thought must be
    given to how updated information arrives into the system and into individual clients,
    and how those clients resolve the problem of receiving the same data as other
    clients but potentially in a different order or at a slightly different time.


    There is a specific issue in this case: the canvas drawing context. The system,
    as coded, draws shapes by joining short lines end-to-end, where the new line is
    drawn from the point at which the last stopped. This has implications:


    +   * Drawing more than one of these segments simultaneously is going to be impossible.

    * Entire segments must be communicated to the server; otherwise, a client that
    closed sending a line end would effectively block the drawing from receiving any
    updates.


    Neither of these useful features, and in fact, it gets slightly worse. If the
    system can communicate only with whole segments, the real-time nature is effectively
    lost. A user''s screen is effectively frozen until the end of their current drawing
    operation, at which point, it updates with any changes that happened in the meantime.
    That could easily be achieved with polling as.


    So, in fact, a different model is required. Rather than rely on the context of
    the canvas to join these lines up, the information being passed to clients should
    be the entire line being drawn—two x, y coordinates ensuring that drawing operations
    are atomic and completed quickly so that the real-time nature of the system is
    apparent. If three people are drawing simultaneously, their drawings would update
    instantly in each user''s view of the whiteboard.


    This is an excellent example of where a data model that makes sense for a single-user
    application makes little sense in a multiser context—or, in fact, impairs the
    desired design would look like. Although the technical limitation of the canvas
    has been used as a convenient hook to talk about these types of design consideration,
    they come into play in many scenarios:


    +   * When drawing a chat server, it is important that text from users is properly
    ordered? Does it matter that user B''s response to user A''s question is seen
    in the wrong order by user C?'
