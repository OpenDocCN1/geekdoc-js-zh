  md: '# CHAPTER 3 • Working With Forms


    Setting form data is in many ways easier than getting the data in the first place;
    it''s simplified by jQuery : excellent : input selector and val () function, which
    can write values as well as read them.


    One notable CoffeeScript feature used here is the loop over object. Compare the
    syntax of looping over a list to the syntax of looping over an object:


    ```

    for value in some list

    for key, value of some_object

    ```


    They work in very similar ways. At this point, you must be sure that you recognize
    the difference between in (looping on a list) and (looping on an object). Array
    and property membership can also be tested with these operators:


    ```

    some_list = [...]

    some_object = (one: 1, two: 2)


    5 in some_list # true

    11 in some_list # false


    ''one'' of some_object # true

    ''three'' of some_object # false

    ```


    # MULTI-STEP FORMS


    For many projects, small single-area forms are enough. For example, there''s little
    requirement for expanding forms like simple login boxes and user registrations,
    or even some of the more complex forms used in content management and other sophisticated
    applications.


    Occasionally, though, it''s useful to break down a form into multiple steps. a
    form may be too large to comfortably display on a page—a significant rationale
    for developers targeting mobile devices. Additionally, if a form is constructed
    as separate steps if they form logical blocks, such as validation which can be
    performed in pieces. Quite often, this is a usability enhancement, as it allows
    mistakes to be corrected more easily as the user progresses through the steps.
    Additionally, if a form is more reactive to the information already entered, it
    can be possible to customize or omit later sections of a form based on responses
    already received—a significant benefit to the end user.


    # SELECTIVE FORM DISPLAY


    Using existing form state to display or adjust on-page elements (which cannot
    logically be selected, or to highlight most likely options) leads to highly interactive
    and easy-to-use user interfaces, and you can use a number of different technical
    approaches to achieve this level of interactivity.


    From the start, differentiate among the various concerns within form-handling
    code. it''s tempting to use the logic used to validate a form, for example, and
    add sections of code to'
