- img_proc: true
  md: 'The single goal of the source map is to tie an executable statement—in this
    case, JavaScript—back to a line in the original source code. This is useful in
    a couple of contexts:


    +   - If CoffeeScript has been transformed into JavaScript, any JavaScript errors
    that occur at runtime can be traced back to the original CoffeeScript source.


    +   - If the JavaScript has been through a preprocessor, minified, or otherwise
    compressed, a source map can trace the error from the compacted source code back
    to the original, uncompressed version.


    As a technical feature, source maps are conceptually quite simple. Modern debuggers
    in browsers can already give reasonable output when an error occurs, making clear
    which column of which line triggered the error. The source map simply translates
    the (file, line, column) tuple back to the original source, and the browser displays
    that information.


    Now, there is some bad news: At the time of this writing, the current version
    of CoffeeScript (1.4) does not support the generation of source maps. While source
    maps are conceptually quite simple, they are actually a bit of devil to implement.
    Compilers do an awful of work with the source code, transforming it into internal
    data structures before the actual compilation process: It''s tempting to think
    that they process source line-by-line, but they simply don''t work like that.
    The information about the source needs to be carried through the entire compilation
    process in order for it to be available at the end to generate the source map.


    # INTRODUCING COFFEE REDUX


    Though the current version of CoffeeScript doesn''t support the generation of
    source maps, a version of CoffeeScript does: CoffeeScript Redux, available on
    GitHub at https://github.com/michaelficar/CoffeeScriptRedux.


    CoffeeScript was originally written as a Ruby program and then rewritten in CoffeeScript
    to become self-hosting. The compiler could compile itself. Becoming self-hosting
    is a milestone for the compiler, indicating that its feature complete and predictable
    in its output. However, in compiler theory, things can become more sophisticated
    than that.


    Michael Ficarra, an extremely active member of the CoffeeScript community, also
    happens to be a Masters student at Worcester Polytechnic Institute (WPI)—pronounced,
    I am reliable, "Whoopee!"). Recognizing the various Implementations in the existing
    CoffeeScript compiler, he put forward a project plan to write a new compiler based
    on well-known, more advanced compiler techniques. Both academic and a CoffeeScript
    enthusiast stood him in good stead. When he publicized the plan on the crowd-funding
    website Kickstarter, it took less than two months to achieve $13,785 for his plan,
    more than the requested amount.'
