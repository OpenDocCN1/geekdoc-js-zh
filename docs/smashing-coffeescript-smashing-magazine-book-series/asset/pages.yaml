  md: '# CHAPTER 7


    # TESTING WITH JASMINE


    IN MANY PROFESSIONS experts agree on a set of practices that are really good ideas,
    but few in the profession actively follow those conventions. In the field of web
    development, automated code testing is such an idea. It''s not that developers
    think doing so is a bad idea; it''s just that they rarely find the time to spend
    on it.


    For many, the idea of automated code testing works very well for libraries with
    established APIs that rarely change, but in the context of peripheral application
    logic or, more especially, user interfaces, automated testing becomes a much more
    complex proposition. A variety of tools are now available that can be brought
    to bear in these different situations and make automatic testing truly straightforward.


    The key tool introduced in this chapter is Jasmine, which is a system for writing
    and running test suites. Jasmine tests describe simple observable behaviors about
    a piece of code, and then run the code to see if the behavior occurs. As a fundamental
    description of how your code should behave, these types of tests can also be viewed
    as a specification of the problem and can lead you to think about your code in
    different ways.'
  merge: -1
  pgno: 136
- img_proc: true
  md: "# INTRODUCING JASMINE\n\nJasmine, one of the libraries originally designed\
    \ for use in JavaScript, is a behavior-driven test suite. There are variety of\
    \ different ideas about how to design tests and how they should be integrated\
    \ into projects. The key idea with behavior-driven development (BDD) testing is\
    \ that the tests are simple and descriptive; reading them is similar to reading\
    \ English.\n\nAs well as making the process of writing tests quite easy, Jasmine\
    \ provides a range of interfaces which the tests can be run and evaluated. It\
    \ offers a command-line interface as you might expect, but you can also run tests\
    \ within the browser or via a library API. This enables you to call and use tests\
    \ in a number of contexts, maximizing the value of the test suite for a given\
    \ project.\n\n# SETTING UP A SPEC AREA TO RUN JASMINE TESTS\n\nYou can run Jasmine\
    \ tests a number of different ways, but the simplest and most straightforward\
    \ is to begin with a command-line test runner. A test runner is the harness that\
    \ locates and executes the tests, and it usually reports the results. To begin\
    \ with, the jasmine-node package from the usual npm sources is enough for these\
    \ needs. Installing that package is easy:\n\n```\nnpm install jasmine-node\n```\n\
    \nAs the name suggests, this runner uses Jasmine and node to run the tests. By\
    \ convention, tests are stored in a directory spec/ (although it could have another\
    \ name), and sometimes tests are categorized by beneath by putting different tests\
    \ in different subdirectories.\n\nA test need not be very complicated. Here is\
    \ a simple spec that tests the functionality of a very bare-bones CoffeeScript\
    \ script:\n\n```\nclass SimpleClass\n  constructor: (@name) ->\n```\n\n```\ndescribe\
    \ 'SimpleClass', ->\n```\n\n```\nit 'takes the name we give it',\n  obj = new\
    \ SimpleClass('foo')\n  expect(obj.name).toEqual('foo')\n```\n\nIt's unusual to\
    \ use the code in the same file as the test itself. Rather, in the real world,\
    \ SimpleClass would be accessed by the test using require(), but for these purposes,\
    \ it helps illustrate the point. Save this file as spec/simple.spec.coffee. Having\
    \ spec in the filename is important because it lets the runner know which files\
    \ contain Jasmine tests.)You can execute the test runner:\n\n```\njasmine-node\
    \ --coffee spec/\n```"
  merge: -1
