    \n# WORKING WITH FUNCTIONS\n\nWhen you start learning a new language, particularly\
    \ if you don't have many under your belt already, you might think about how to\
    \ define your variables. The tendency is to use global scope, which means making\
    \ the variable accessible anywhere in the code. You define it once, and then you\
    \ can use it anywhere else.\n\nIt becomes hard to manage all your variable names\
    \ once the code gets to a certain length, but more importantly it's very easy\
    \ to re-use a variable accidentally and introduce bugs into the code. This style\
    \ of coding is not maintainable.\n\nIn CoffeeScript, functions play two important\
