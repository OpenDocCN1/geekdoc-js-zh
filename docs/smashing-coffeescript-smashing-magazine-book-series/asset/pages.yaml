- img_proc: true
  md: "```\n{\n  'name': 'username', 'value': 'alex',\n  'name': 'password', 'value':\
    \ 'notverysecure'\n}\n```\n\nThis is an array of objects, with a name and a value,\
    \ and each corresponding to a single <input> on the form. At first glance, this\
    \ isn't the most useful representation. The more obvious structure for this data\
    \ is\n\n```\n'username': 'alex', 'password': 'notverysecure'\n```\n\nA single\
    \ object with direct keys and values from the form initially makes some sense.\
    \ However, it's not always the case that a form includes only a single input with\
    \ a given name. Some <select> can have multiple values, and in fact it's also\
    \ possible to have other types of input with duplicate names—check boxes, for\
    \ example.\n\nBecause different forms need to be handled in different ways, jQuery\
    \ doesn't hold a particular opinion on how your data should be structured. It\
    \ simply returns an object for each input with a value set, and you get back the\
    \ list of objects.\n\nThankfully, JavaScript makes it very easy to process this\
    \ data and turn it into a form that's more useful, and as you have guessed, the\
    \ easiest tool to use for this is the comprehension. The list of objects can be\
    \ “flattened” to a single object:\n\n```\ndata = {}\ndata[input.name] = input.value\
    \ for input in form.serializeArray()\n```\n\nThis is a useful step to most simple\
    \ forms; the alternative searching the array of objects returned by serializeArray()\
    \ something like this:\n\n```\ninputs = form.serializeArray()\nusername = input.value\
    \ for input in inputs when input.name == \"username\"\npassword = input.value\
    \ for input in inputs when input.name == \"password\"\n```\n\nAs well as not being\
    \ terribly pretty code, and certainly not DRY, this is an inefficient solution.\
    \ It's often easy to forget that a comprehension is, at heart, a loop. Every time\
    \ an input value is pulled out of this list like this, it means that the entire\
    \ list has been looped over—a lot of work with little end result.\n\n# VALIDATING\
    \ FORM DATA\n\nUsually, the first requirement when you adding a form to a page\
    \ is to do a minimal amount of validation. This could be for a number of reasons.\
    \ For example, it's usually not to allow an empty form to be submitted, but more\
    \ than that, if it looks like the user has entered data that isn't suitable for\
    \ some reason, it's good practice to give the user feedback as quickly as possible."
