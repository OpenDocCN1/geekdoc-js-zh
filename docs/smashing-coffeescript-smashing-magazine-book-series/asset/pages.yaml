  md: "# CONTROLLING SUBMIT BUTTON INTERACTION\n\nThe validation function needs an\
    \ extra parameter—warnRequired—to indicate that the user was attempting to submit\
    \ the form, and mark any empty but required inputs with a validation error.\n\n\
    Another approach to the same problem is to prevent the user from submitting the\
    \ form before the entire form has been validated. This simplifies the validator\
    \ slightly, removing the parameter warnRequired and the logic required to implement\
    \ it, thus making the event handler more straightforward:\n\n```\n$form = $('form#feedback')\n\
    \nvalidationHandler = (event) ->\n  disabled_submit = false\n  if not validate(form,\
    \ loginValidation)\n    disabled_submit = true\n  event.preventDefault()\nform.find('input[type=\"\
    submit\"]').attr('disabled', disabled_submit)\n\nform.submit validationHandler\n\
    form.on('keyup', ':input', validationHandler)\nvalidationHandler()\n```\n\nThe\
    \ result of this validation is to disable the submit button if the form does validate\
    \ (or if the form is invalid, the user can no longer click the submission button\
    \ to submit the form. The submit event handler remains attached because there\
    \ are other methods of submitting the form (on many browsers, users can press\
    \ the Enter key to submit a form), but the special logic for form submission is\
    \ removed.\n\nWhether this is a reasonable approach is up to you and the context\
    \ in which the form needs to operate. Generally, it's not good practice to prevent\
    \ users from taking actions without telling them why the actions aren't possible.\n\
    \n# PREPOPATING FORM ELEMENTS\n\nOccasionally, it's useful to prepopulate form\
    \ elements. You can do so by settings values manually in the HTML or on the server-side\
    \ generating the HTML, but it can also be done on the client-side. This is both\
    \ easy and useful in a number of different scenarios, such as reviewing and editing\
    \ data already held on a system.\n\n```\npopulate = (form, data) ->\n  for key,\
    \ value of data\n    form.find('input[name='+key+]').val(value)\n```"
