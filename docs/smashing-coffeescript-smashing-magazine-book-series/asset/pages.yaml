    \  return style\n```\n\nCalling this function with a specific value returns the\
    \ object with that value set under the key left or right, depending on the direction\
    \ the slideshow is set up. Instead of hardcoding the left: '-400px' (for example)\
    \ you can now write css_setting '-400px*' is slightly sleighter but more powerful."
