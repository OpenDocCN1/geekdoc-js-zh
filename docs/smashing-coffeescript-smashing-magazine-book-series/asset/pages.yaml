    \ most interesting: defining variables within the scope of a function, you can\
    \ effectively hide those variables from the rest of the code. Hiding it means\
    \ that you can't accidentally trample on the value in another section of the code,\
    \ but it also means that you can't purposefully change it.\n\n“This is the first\
    \ example using \"nested\" functions. Depending on what languages you've used\
