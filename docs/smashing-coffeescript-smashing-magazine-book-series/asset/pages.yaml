    \    title: 'Shopping Cart'\n\n    render: =>\n        items = CartItem.all()\n\
    \        container = $('<<div></div>')\n\n        container.append require('views/cart/items')\\\
    items)\n        container.find('.group a').button()\n        container.find('.group').controlgroup\n\
    \            type: 'horizontal'\n            mini: 0\n\n        if items.length\
    \ > 0\n            checkout = require('views/cart/checkout')()\n            container.append\
    \ checkout\n            $(container).find('button.checkout').button()\n```\n\n\
    ```\n@html container\n\nactive: (params) =>\n    super\n```"
