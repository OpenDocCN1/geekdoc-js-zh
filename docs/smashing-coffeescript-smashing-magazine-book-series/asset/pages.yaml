- img_proc: true
  md: "# CHAPTER 10\n\nnow that the template syntax and expressions are identical.\
    \ The key difference is simply that jEco templates come wrapped with some extra\
    \ logic.\n\nEco is comparable to common server-side templating systems: The concepts\
    \ are the same, and the syntax looks incredibly similar to other systems you might\
    \ be familiar with.\n\nThe most fundamental part of Eco is the use of expressions.\
    \ Each template is \"rendered\" by feeding the template into Eco with some data\
    \ (the data is the \"context\"). Eco evaluates the various expressions within\
    \ the template and outputs a string. The expressions are more or less CoffeeScript\
    \ expressions, so a template might look like this:\n\n```\n<% if @categories.length:\
    \ %>\n<ul>\n  <% for category in @categories %>\n    <li>\n      <a href=\"<%=\
    \ category.url %>\"><%= category.name %></a>\n    </li>\n  <% end %>\n</ul>\n\
    <% else: %>\n<p>No categories to list.</p>\n<% end %>\n```\n\nThere are some minor\
    \ differences apparent for: example, in CoffeeScript, code is easily delimited\
    \ into blocks just by using indentation. That's not really possible within the\
    \ context of HTML, so blocks are created by the use of a colon on loops or conditionals\
    \ within the Eco tags. It is good style to indent the tags to separate the blocks\
    \ visually, but the indentation itself is not used.\n\nEco has two main tag types:\
    \ <% for evaluating expressions without generating output, and <%= to the value\
    \ of an expression. A template is called on a set of data that is provided by\
    \ the controller; a minimal example to run the previous template looks like this:\n\
    \n```\nrender: =\ndata = =\ncategories: [\n  { url: '/', name: 'Home' },\n  {\
    \ url: '/contact', name: 'Contacts' },\n  { url: '/tags', name: '<tags & attributes>'\
    \ },\n]\n@html require('views/demo')(data)\n```\n\nWith this data, the resultant\
    \ HTML output would be this:\n\n```\n<ul>\n<li>\n```"
