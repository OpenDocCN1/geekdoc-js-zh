  md: "# PART III - Coffe Application Development\n\nWhen browsers first began to\
    \ implement parts of the CSS3 standard, the ability to add corners to boxes was\
    \ one of the first things developers jumped on. Before this, achieving rounded\
    \ corners required careful placement of four images within the box, being careful\
    \ to place them pixel-perfect against the border edge so that they covered the\
    \ corner but also lined with the sides. However, although the CSS was a much more\
    \ robust solution, it required vendor prefixes for wide compatibility, and when\
    \ many boxes needed round corners, this ended up bloating CSS stylesheets unnecessarily.\n\
    \nThe border-radius() mix-in solves this problem nicely. A simple Stylus rule\
    \ like\n\n```\n.title\n  border-radius: 8px\n```\n\ngenerates a complete CSS rule\
    \ like this:\n\n```\n.title {\n  -moz-border-radius: 8px;\n  -webkit-border-radius:\
    \ 8px;\n  border-radius: 8px;\n```\n\nOver the course of a large stylesheet, it's\
    \ easy to see how the use of mix-ins is a powerful tool: It keeps the code concise,\
    \ but it is keeping it DRY. (Remember: don't repeat yourself!) If a new vendor\
    \ prefix is needed on the border-radius rules, one line of code adds, and when\
    \ the CSS is rebuilt, it will flow into all the rules using the mix-in.\n\nThis\
    \ example is best\n\n```\nvbg-gradient(fc = #FFF, tc = #FFF)\nbackground: fc;\n\
    background: -webkit-gradient(linear, left top, left bottom, from(fc), to(tc))\n\
    background: -moz-linear-gradient(top, fc, tc)\nbackground: linear-gradient(top,\
    \ fc, tc)\n```\n\nPutting a vertical gradient on an element is a common task,\
    \ and yes, this takes care of some vendor prefixes. But actually, more value is\
    \ added here: The WebKit version of this rule is not much like the Mozilla implementation,\
    \ or the vanilla CSS3 version.\n\nIn my experience, when vendor prefixes require\
    \ slightly different syntax or worse—they take the same arguments in a different\
    \ order, it’s a recipe for bugs. You won't notice an error in the CSS; in fact,\
