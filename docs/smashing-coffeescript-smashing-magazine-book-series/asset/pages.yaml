  md: '# USING JQUERY: DOM MANIPULATION


    JQUERY IS CONSIDERED the pre-eminent library for creating and manipulating HTML.
    This chapter is dedicated to demonstrating how to use jQuery on CoffeeScript projects.
    Although designed originally for use from JavaScript, the fluent API that jQuery
    works incredibly well in CoffeeScript—arguably, it''s easier to use than in the
    native JavaScript.


    jQuery came to prominence for its straightforward approach to manipulating web
    pages, but has quickly become more of a utility library than that. As well smoothing
    out various browser differences, it provides a range of additional functionality,
    to the extent that jQuery has almost become a platform itself.'
