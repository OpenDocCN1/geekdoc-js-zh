  md: '```

    $$(body).on(''custom'', (event, num, obj) ->

    console.log num # outputs 1

    console.log obj # outputs (2=3)

    ```


    Are there downsides to custom events? Admittedly, yes when developing code custom
    events, be aware that the event names and any data that you pass through them
    effectively become a kind of API for the code—contract between caller and callee.
    If the name of the custom event is changed, any existing triggers no longer work.
    As with any other kind of API, a public function, such as events used in this
    style, should ideally be documented and the convention for triggering it should
    change rarely.


    Be aware that triggering and listening for custom events is a kind of coupling
    between different pieces of code. The coupling is quite loose, but it''s there
    nonetheless, especially when the event may not be triggered and, or heard by many
    handlers. When events are triggered by a single specific piece of code, and heard
    by another specific piece of code, they''re becoming surrogates for function calls
    and that generally a sign of bad design.


    # FEATURE DETECTION FOR PRACTICAL POLYFILL


    Before I finish this chapter on some of the specifics of jQuery, it''s important
    to talk about one final tool for the toolbox: the polyfill. Inspired by the legends
    of how improve the world over, the term polyfill is used to describe small pieces
    of code that cover up the deficiencies of specific browsers: Literally, filling
    in the cracks.


    Modern browsers have come a long way, but people still use older versions that
    dont directly support features that are available in up-to-date software. The
    general idea with a polyfill is to provide a piece of code as a fallback for older
    browsers that implement a feature or provides an effective substitute.


    This type of approach is not to be confused with browser-sniffing. That practice,
    examining the browser''s version and enabling (or disabling) features for specific
    browsers, is quite right frowned upon. It prevents code from being broadly forward
    compatible, and relies on the original developer having detected the browser correctly.
    It also misses the point: The problem is not the browser version per se, but the
    ability (or not) for a browser to support a specific feature.


    So, rather than attempt to sniff the browser, the better approach is to use feature
    detection, where you detect whether a browser supports a particular feature before
    attempting to use it.'
