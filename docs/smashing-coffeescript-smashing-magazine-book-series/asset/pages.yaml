    # Avoiding Storage Problems


    I implied earlier that there are other local storage solutions beyond localStorage,
    namely IndexedDB. Given the description of localStorage so far, it''s difficult
    to see why this solution isn''t sufficient. Unfortunately, there is a number of
    problems—specifically that many people advocate against it, even though it''s
    relatively mature at this point and enjoys support.


    The first issue is, although the interface looks and behaves a lot like a traditional
    object on its face, a few quirks are underneath. Here is an example:


    ```

    localStorage.doesStoreNumbers = 1

    console.log typeof 1

    console.log typeof localStorage.doesStoreNumbers

    ```


    Storing a number in local storage should be easy; however, that''s not what happens.
    The output of the previous example is two lines, the first being just number because
    that''s the value of 1. The second line, though, is string because values stored
    in localStorage always come back as strings, even if that''s not what they were
    originally.


    This imposes a cost in overhead, because the option of ignoring the types isn''t
    really available: 1 + 1 == 2, but "1" + "1" == "11"--and, in a numeric context,
    it evaluates to 11, which is a potential disaster.


    Given that the types cannot be ignored, some sort of options is required to convert
    the values as they come back from localStorage. A variety of options are available:


    +   - Manually remember which key had what type and convert on access (painful
    and error-prone!)

    - Encode the type into the key name using a scheme like Hungarian notation (less-prone
    but still painful).

    - Store all values as a serialized JSON object (less error-prone, less painful,
    but still creates overhead).


    None of these options are particularly enticing, and although the problem is solvable,
    from what a very simple API it detracts significantly because it needs to be wrapped
    with a layer of extra logic rather than be accessed directly.'
