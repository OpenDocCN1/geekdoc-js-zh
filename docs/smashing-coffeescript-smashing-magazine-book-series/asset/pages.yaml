- img_proc: true
  md: '# INTRODUCING SPINE


    Choosing a web framework is the sort of topic that gets many developers hot under
    the collar. Since the framework encodes or (worse!) enforces specific practices,
    people''s attitudes towards frameworks are often closely related to whether they
    think those practices are good or bad and whether they offer value to the developer.


    For me, two key things make Spine worth investigating: First, it''s built around
    the most popular application structure pattern, Model-View-Controller (MVC); second,
    it''s a relatively minimal implementation.


    The MVC pattern has been around since 40 years and is certainly a concept that
    predates the use of asynchronous web applications. The key points of the design
    are enumerated here:


    +   - Data and associated logic are stored in models.

    - Data is presented to the user through views.

    - The user interacts with controllers to manipulate the models.

    - Changes in the model data are reflected in the associated views.


    This feedback loop—the user interacting with the controller modifies models, which
    in turn updates the views that the user sees—is the fundamental principle and
    was used early in desktop application programming to ensure that business logic
    wasn''t tied too closely to the logic presenting the user interface.


    One of the key benefits of this arrangement is that the state—the part of the
    software that has to remember things—is confined to the models. Other parts of
    the code, or should be, effectively stateless, making things much easier to test.


    Some implementations of the MVC pattern haven''t been true to the original pattern
    but are more like interpretations of the spirit of the pattern. HTTP is not an
    ideal fit for this pattern. Although the browser making HTTP requests to the server
    is an ideal conduit with which the user can interact with the application controller,
    there is no equivalent in the opposite direction. If the view needs to change,
    it can do only in response to a user request.


    Spine, on the other hand, is entirely a client-side application framework. All
    of the application—the models, views, and controllers—reside on the client, and
    it suffers no such disadvantage—although, without some compensating system as
    web sockets, getting data to and from the server is still a per-request operation.


    The minimalist nature of Spine is also a useful feature. Although it cuts down
    the amount of code in the application—laudable, but not a killer feature—the core
    of Spine is readable, conciseScript. It''s easy to get under the hood to see how
    a specific feature works, but more than that, it''s a great example of native
    CoffeeScript coding, with a number of conventions and idioms that are well adopting.'
