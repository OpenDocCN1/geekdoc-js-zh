    \ \"render()\"\n```\n\nThe root tag @el is specified as a <div>, and then the\
    \ constructor calls the FullCalendar plug-in on that element itself. This isn't\
    \ the right way to add functionality to the page, because most of the time @el\
    \ is a container for other elements. In this case it makes sense because the controller\
    \ is really just a widget, but the usual patterns create new DOM nodes that are\
    \ appended to the container @el.\n\nCreation of the calendar itself is there done\
    \ as part of the controller. Although this isn't called as part of the standard\
    \ process and it would probably be better named refresh(). It's a conventional\
    \ name rather than part of the Spine API.\n\n# CONTROLLING THE PAGE\n\nIt's worth\
    \ talking through what the vanilla Spine.Controller is doing in the background.\
    \ One of the first things it does is create the <div> node, which you can override\
    \ that with the @tag attribute. Often one will include-tag—as shown in the earlier\
    \ example—even with the default, so that it's explicit.\n\nThere are some useful\
    \ default attributes:\n\n+   - className: Since the controller is creating the\
    \ DOM node, it looks at this to see if there is a specific CSS class that should\
    \ be set on the node.\n- attributes: Similar to className but more general; this\
    \ allows other attributes to be set on the node by default. It's even possible\
    \ to set the class attribute and that will override the className.(I strongly\
    \ recommend not using that \"feature\", though!)\n- events: One of the most common\
    \ operations developers perform with front-end code is listen for events with\
    \ handlers. Spine makes this easy by building the functionality into"
