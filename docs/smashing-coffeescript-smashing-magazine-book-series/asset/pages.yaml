  md: '# INTRODUCTION


    If you have bought this book, or at least picked it up because it interested you,
    then you have at least least heard of Coffeescript and have an inkling of what
    the language is. In the words of its author, "CoffeesScript is a little language
    that compiles into JavaScript," and in a sense, that is all you need to know about
    the language. But a number of more profound ideas follow from that simple concept.


    To understand CoffeesScript properly, it''s important to understand the history
    of JavaScript. In the early days of Netscape Navigator, an engineer by the name
    of Brendan Eich was given the task of writing a scripting language that the browser
    would interpret, along with only two guiding principles. First, the language needed
    to look like Java, because that was the cool language at the time. Second, he
    had ten days to write a functioning implementation.


    That was tremendously tall order but that Eich was equal to. He created a small,
    language that fulfilled looked and acted like Java, called "Mocha". Additionally,
    he made decisions that set the language apart from others, by treating functions
    as first-class objects that could be passed around and using prototypical object
    inheritance rather than the classical style preferred by the likes of C++ and
    Java. JavaScript, as it was eventually called, set its first release in 1995 as
    part of Netscape Navigator 2.0.


    In 2000, Microsoft released a new version of its web/calendar client, Outlook
    Web Access, using HTML and JavaScript. Under the hood, it of new browser Microsoft
    had the XMLHttpRequest API to talk asynchronously to the server. This object allowed
    information to flow to and from the browser outside the usual HTTP request: The
    user interface updated progressively, rather than the browser viewport blanking
    as the browser went to fetch a new version of the entire page. This supplied a
    much smoother experience for users, the web server had to work substantially less,
    and the system in general scaled better.


    This technique was picked up slowly but surely, but burst into the mainstream
    when James Garrett wrote an article describing this architectural approach to
    web application building and dubbed it AJAX (Asynchronous JavaScript and XML).
    Without realizing it, he''d lit the proverbial-blue touch paper.


    AJAX as an architectural concept gained adoption quickly, to the point that now
    browsing the web with JavaScript turned off is virtually impossible. Large applications,
    such as Googles Gmail, were written to run entirely client-side, and the imperative
    to create richer browser features led to results such as HTML 5. Browser competition,
    which had stagnated since the Internet Explorer 6 was released, quickly heated
    up with new entrants such as Mozilla Firefox and, later, Google''s Chrome. Most
    importantly, many of the problems associated with programming applications for
    the web began to melt away. As focus on web standards'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'became more important, browser incompatibility was greatly reduced, and renewed
    emphasis on the speed of JavaScript execution allowed client-side developers to
    create increasingly sophisticated applications.


    All amid this excitement, and the development of JavaScript-based applications
    "in the large" (a term coined in 1975 to describe the process of programming and
    maintaining complex software applications by teams of engineers), the fundamental
    design of the language that had held well all these years began to fall short.
    JavaScript is an interpreted language with a dynamic type system, many of the
    static analysis and compilation tools come to the aid of the developer are unavailable.
    The design of the object system when JavaScript is prototypical, and even swathes
    of the development community aren’t familiar with it. Developers coming from other
    languages, such as Java, found themselves particularly uneasy without the concept
    of classes.


    In 2009, Jeremy Ashkenas started writing his solution to these problems—CoffeeScript—and
    announced the release of an initial version on Christmas Eve. Writing the first
    lines of code took 11 days, echoing, albeit unintentionally, Benjamin Eich’s efforts
    almost 15 years previously.


    The goals were relatively simple: Expose the better parts of JavaScript, add higher-level
    functionality, and ignore as many of the warts of the language as possible. Although
    Ashkenas initially intended CoffeeScript to be as much a thought experiment as
    a tool in its own right, the little language surged in popularity. This popularity
    quickly pushed the project forward, and in exactly one year, a stable 1.0 version
    was reached.


    # WHY LINE COFFEESCRIPT?


    Why did people flock to the CoffeeScript project in the first place? Although
    the initial implementation worked, right from the start it was a little rough.
    In fact, many of the major decisions that came to make the language stand apart
    from JavaScript had not been made; even the whitespace that one would use to mark
    code blocks, was yet to come. The language and the syntax were initially influenced
    by Ashkenas’s development on large-scale web applications, by the chorus of feedback
    from other engineers honed and fine-tuned the language.


    The idea that CoffeeScript embodied, though, that you could write code for the
    browser in a higher-level and more concise, readily understandable language than
    JavaScript, but still benefit from the wide deployment of JavaScript by compiling
    code into JavaScript, similar to the way a C++ suite compiles source into machine
    code.


    Many of the changes contained in the CoffeeScript syntax are directly aimed at
    web developers, which is different than JavaScript, where the language was heavily
    influenced by systems programming. Before JavaScript, there wasn’t a concept of
    what a client-side web application might look like, or what types of problems
    needed to be solved, or even why you would contemplate such a thing in the first
    place. CoffeeScript, on the other hand, was designed with this context in mind
    and hindsight 20:20.'
  merge: -1
  pgno: 17
