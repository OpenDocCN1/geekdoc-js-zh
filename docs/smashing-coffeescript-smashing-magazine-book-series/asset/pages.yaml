- img_proc: true
  md: "# PART :\n\nAlthough good for performance, caching can wreak havoc if not properly\
    \ controlled. For example, if stock ticker application is continually pulling\
    \ back stock market quotes that have been cached and are hours old, the application\
    \ is rendered useless for all users.\n\nThe rules over HTTP requests can be cached,\
    \ and for how long, are quite complex. However, it's generally enough to understand\
    \ that POST, PUT, and DELETE invalidate cache entries, but that GET requests can\
    \ happily be cached at various points from the browser to the end entries.\n\n\
    # EASILY RETRIEVING INFORMATION\n\nHaving reviewed some of the intricacies of\
    \ making HTTP requests, it's time to look at how requests are made in practice.\
    \ For all of the complexity, the first few steps are actually satisfactorily simple.\
    \ Consider a staff directory, where the information is returned from a server.\
    \ The page itself is quite straightforward:\n\n```\n<DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n<script src=\"jquery.js\" type=\"text/javascript\"></script>\n\
    <script src=\"directory.js\" type=\"text/javascript\"></script>\n</head>\n<body>\n\
    <h1>Staff List</h1>\n<ul id=\"staff\">\n\n</ul>\n</body>\n</html>\n```\n\nIt's\
    \ not always the case that the page must be initially empty and the data retrieved\
    \ later, but for the purposes of this example, that's the intention. When the\
    \ user loads the page, the code does an AJAX callback against the server to load\
    \ the initial list of users.\n\nNow, to make this work, it's not necessary to\
    \ set up an actual server at this stage. That would be a relatively huge amount\
    \ of work for a small win! Instead, because browsers are capable of loading files\
    \ from the local system, you can use static data. Save this content in the same\
    \ directory as a file called testdata.json:\n\n```\n[\n  \"staff\": \"Staff List\"\
    ,\n  \"members\": [\n    { \"id\": 1, \"type\": \"executive\", \"name\": \"Jim\
    \ Jones\"},\n    { \"id\": 2, \"type\": \"executive\", \"name\": \"Alice Arnold\"\
    },\n    { \"id\": 3, \"type\": \"admin\", \"name\": \"Laura Lansbury\"},\n   \
    \ { \"id\": 4, \"type\": \"admin\", \"name\": \"Paul Peterson\" }\n  ]\n]\n```"
  merge: -1
