  md: "# Developing the Product Page\n\nThe next stage of the process is to get the\
    \ user to the product page. This is where the interest is working. Users get the\
    \ opportunity to add the product to their baskets and start the purchasing process.\n\
    \nLook at the panel for the product page; the route for this has already been\
    \ set up:\n\n```\nclass ProductView extends BasePanel\n\ntitle: 'Product page'\n\
    \nclassName: 'products show'\n\nconstructor: ->\n    super\n    @active (params)\
    \ ->\n    @change params\n\nrender: =>\n    return unless @item\n    @html require('views/product/view')\
    \ (@item)\n    @setTitle @item.name\n\nchange: (params) ->\n    @item = Product.find(params.id)\n\
    \    @render()\n```\n\nThis is a great example to help explain how the rendering\
    \ system is working. Rendering should happen as early as possible so that by the\
    \ time the panel is active and has transitioned onto the screen, it's already\
    \ set up. If this isn't the case, the display changes oddly through, or worse,\
    \ the browser is so busy drawing the panel that the transition stutters and the\
    \ site loses that feeling of smoothness.\n\nThe product page is not a static page,\
    \ though. It has to be able to display a number of different products, and rendering\
    \ one time is simply not enough. Rather than calling render() as part of the constructor,\
    \ this panel registers a handler that is called anytime the panel is activated\
    \ through the navigation system.\n\nThe handler is an anonymous function that\
    \ calls change() whenever the panel is activated and is installed by calling the\
    \ function active() on the controller. In this, active() is defined in the Spine\
    \ Manager, and has two roles: calling it without an argument activates the panel,\
    \ but passing a function as an argument ensures function is called every time\
    \ the panel is activated.\n\nWhen the panel is activated, the ID of the product\
    \ to be shown is passed through; this is part of the route specified. This information\
    \ is then used to look up the product, and render() is called so that the product\
    \ can be run through the template and displayed on the page."
  merge: -1
  pgno: 257
- img_proc: true
  md: "```\n<div class=\"productview\">\n  <img src=\"<%= @image %>\">\n  <h3><%=\
    \ @name %></h3>\n  <p><%= @description %></p>\n  <p>$ <%= @price / 100 %></p>\n\
    \  <button class=\"addToBasket\" data-icon=\"plus\">Add to basket</button>\nn</div>\n\
    ```\n\nAn add to basket action enables the user to place this item into his shopping\
    \ cart. (See Figure 12-4.)\n\n![](img/e3ca65867e7abc9da32dd88bfc67c4e4_258_0.png)\n\
    \nFigure 12-4: The product page has minimal formatting.\n\n# BRINGING IN JQUERY\
    \ MOBILE\n\nAlthough Spine.mobile does an excellent job of making the mobile environment\
    \ much more accessible and usable, this simple system is little more than an excellent\
    \ framework for a single-page application.\n\nClearly, though to present the user\
    \ with a normal mobile experience, a user interface layer is needed. For desktop\
    \ applications, jQuery UI is an example of a library that plays this role nicely,\
    \ not just putting together various usable widgets and a sensible theme but also\
    \ providing of the building blocks to create custom widgets that behave predictably\
    \ within the browser environment."
  merge: -1
  pgno: 258
- img_proc: true
  md: "# 244 PART III: CoffeeScript\n\nLuckily, such a library is available for the\
    \ touch environment, too, and it is called jQuery Mobile. It's available at http://jquerymobile.com/.\n\
    \njQuery Mobile, or JQM, provides numerous features, with the most important of\
    \ those listed here:\n\n+   - A flexible theme and layout system that has been\
    \ bench-tested in a variety of mobile browsers, not just the “A-grade” variety\n\
    - A progressive enhancement system to make use of additional functionality where\
    \ the browser supports it\n- Built-in navigation, transition, and event support\n\
    - A broad range of mobile- and touch-friendly widgets for a variety of uses\n\n\
    You likely noticed some overlap with Spine. Although Spine doesn't delve into\
    \ the world of widgets, or even far into the world of layout, it definitely does\
    \ a lot of work in the transition and event department and has its own system\
    \ of navigation.\n\nMoreover, JQM's progressive enhancement to work really well,\
    \ pages must have some declarative content built into them, which doesn't work\
    \ amazingly well with Spine.mobile's render infrastructure. The progressive enhancement\
    \ tends to get lost if a panel needs to be rendered, the automatic system runs\
    \ at the right time to enhance the page at.\n\nHowever, these two systems are\
    \ not incompatible, and in fact some substantial benefits occur when running the\
    \ two of them together. Primarily you are able to start using the wide variety\
    \ of JQM widgets, which are well designed and blend into sites that have a native\
    \ feel (the sort that Spine provides out of the box). It just takes a little extra\
    \ effort.\n\nThe first step to making this work is to build in JQM's stylesheets\
    \ and code, which requires some edits to public/index.html:\n\n```\n<link rel=\"\
    stylesheet\" href=\"application.css\" type=\"text/css\" charset=\"utf-8\">\n<link\
    \ rel=\"stylesheet\" href=\"jqm/jquery.1.2.0.min.css\" />\n\n<script src=\"application.js\"\
    \ type=\"text/javascript\" charset=\"utf-8\"></script>\n<script type=\"text/javascript\"\
    \ charset=\"utf-8\">\nvar jQuery = require(\"jqueryify\");\nvar exports = this;\n\
    jQuery(function() {\n  var App = require(\"index\");\n  exports.app = new App({el:\
    \ jQuery(\"body\")});\n\n})(document).bind(\"mobileinit\", function() {\n  jQuery.extend.bind(jqm,mobile,\
    \ {\n    ajaxEnabled: false,\n    autoInitializePage: false,\n```\n\n*"
