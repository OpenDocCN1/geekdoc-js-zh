  md: "# CHAPTER 15 • Real-Time Web with Socket.io 309\n\n```\n@socket.on 'draw',\
    \ (segment)\n@draw_segment segment\n```\n\nIn a sense, this can be viewed as entirely\
    \ the inverse of the server-side code, and it's worth having a look at both pieces\
    \ of code side by side because it becomes clear quickly when they match up.\n\n\
    On initial connection, the server will send back the information for the drawing\
    \ in its current state. It's possible to send these as a series of separate draw\
    \ events, but that would be wasteful in terms of resources (because it would trigger\
    \ a large number of client-side events, which could end up being slow for larger\
    \ drawings); however, it's reasonable to view them as batched draw events, and\
    \ that's how the code treats\n\nTwo other events are set up, for the draw event\
    \ and one for the clear event. The main logic for these events is, of course,\
    \ elsewhere, so first look at the new canvas_handler() function, which also uses\
    \ the draw_segment() function:\n\n```\ncanvas_handler: (x, y, type) => {\n  switch\
    \ type {\n    when \"mousedown\"\n      @last_x = x\n      @last_y = y\n\n   \
    \ when \"mousemove\" = true\n      if (@is_drawing)\n        @draw_segment([@last_x,\
    \ @last_y, x, y])\n        @socket.emit \"draw\", [@last_x, @last_y, x, y])\n\
    \      @last_x = x\n      @last_y = y\n    else\n      @is_drawing = false\n \
    \ }\n}\n```\n\nPreviously, the equivalent relied on the canvas context to remember\
    \ the finishing coordinates of the last drawing operation—that is no longer possible,\
    \ so this handler is remembering @last_x and @last_y specifically, based on previous\
    \ events.\n\nAlthough now it's mostly tweaking internal state, when the handler\
    \ is in the drawing mode, it does two things. First, it draws a line from the\
    \ previous coordinates of the mouse pointer; second, it sends that information\
    \ directly to the server so that it will be instantly rebroadcast to all the clients\
    \ connected to the drawing.\n\nNow, only two remaining functions defined in this\
    \ class need to be explained:\n\n```\ndraw_segment: (segment) => {\n  [x1, y1,\
    \ x2, y2] = segment\n  ctx.moveTo(x1, y1)\n  ctx.lineTo(x2, y2)\n}\n```"
