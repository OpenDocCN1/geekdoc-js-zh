    And the honest answer, from my perspective, is that in general doing so isn't\
    \ a good idea.\nAlso, developing a project in multiple languages increases the\
    \ difficulty of finding and fixing bugs. However, there are many scenarios where\
    \ this makes sense:\n\n+   - Using existing libraries: This is probably the primary\
    \ reason most developers\nstart using CoffeeScript. It's difficult to imagine\
    \ that the language would become popular\nas as if developers had not been able\
    \ to continue use jQuery—arguably, it has\ncome popular precisely because it is\
    \ easier to use!\n- Transitioning existing projects: This is not as common as\
    \ the preceding reason, but\ndevelopers who want to use CoffeeScript but have\
    \ existingpotentially large) codebases\nin JavaScript may have a period during\
    \ which they are developing new functionality\nin CoffeeScript alongside the existing\
    \ code. Without the ability to transition, it's much\nharder to start using CoffeeScript.\n\
    - Creating new libraries: CoffeeScript provides a number of programming-in-the-large\n\
    features that make it to write clean APIs that others can develop, and it makes\n\
    sense to start new code in CoffeeScript.\n\nThese three scenarios nearly cover\
    \ the three possibilities: JavaScript from a\nCoffeeScript application, calling\
    \ CoffeeScript from a JavaScript application, and writing\napplications that are\
    \ a mix of both.\n\nLike many features of development systems, the fact that something\
    \ is possible doesn't imply\nin any way that it's a good idea I've listed these\
    \ three possibilities in order of complexity.\nCalling JavaScript from CoffeeScript\
    \ is easy, reliable, and throughout this book it happens\nconstantly (for example,\
    \ using jQuery). Going the other direction is equally reliable, but it's\nslight\
    \ more complex because of the increased protections CoffeeScript offers. Likewise,\
    \ mixing\ncode can be a recipe for trouble (I demonstrate some potential pitfalls\
    \ later in the\nsection on mixing JavaScript directly in CoffeeScript source),\
