  md: "# PART IV • Advanced CoffeeScript\n\n```\nrole_ok = req.session.user? unless\
    \ req.session.user_id and role_ok\nres.redirect('/login') unless res\nnext, res\n\
    app.get('/admin', secure['admin'], (req, res) ->\n```\n\nThe ability to configure\
    \ the behavior on the route makes this approach highly flexible. In contrast,\
    \ it is possible to implement the controls as middleware, for example, white-listing\
    \ those paths that don't require authentication and implementing the role-checking\
    \ logic within the middleware. However, that's less flexible and not as self-descriptive\
    \ as adding the information onto the route definition.\n\n# Considering CSRF Attacks\n\
    \nAttacks on web applications are, sadly, numerous. It's entirely beyond the scope\
    \ of this book to attempt to enumerate or demonstrate fool-proof methods of preventing\
    \ them. However, \"perfect is the enemy of good,\" and it would be a poor show\
    \ to indicate this problem. To illustrate some solutions, I will briefly focus\
    \ on cross-site request forgery (CSRF) attacks.\n\nThe CSRF middleware cropped\
    \ up fairly earlier, although at the time I didn't explain what it was. Request\
    \ forgery is actually a simple attack. By manipulating a website, an attacker\
    \ can trick a user's browser into making a request for a different website, and\
    \ with a carefully crafted request, the attacker can do some serious no good.\
    \ For example, if a user is logged on to the microblogging application, it's possible\
    \ craft requests to delete their blogs (for example), on the face of it, the system\
    \ will allow—a logged-on user have the ability to do that.\n\nAn answer to CSRF\
    \ attacks is to ensure that requests are as difficult to forge as possible. In\
    \ general, that means putting a piece of information into a form that the system\
    \ later checks to ensure that the request it's processing isn't a forged request.\
    \ A common way of doing this is to place a token in your forms that validates\
    \ each user. The token is an unguessable piece of information that an attacker\
    \ could not use without getting the intended victim to fetch the CSRF token on\
    \ the behalf of the attack.\n\nExpress.js already comes with a system for creating\
    \ and validating tokens, and the @csrf middleware shown earlier ensures that the\
    \ token is placed into the template context so it's available in all responses.\
    \ The page templates from earlier also included a form input being placed into\
    \ forms to pass through this token; the only missing piece is in the view:\n\n\
    ```\nrender = (path, options, callback) ->\n  opts = {}\n  opts[k] = v for k,\
    \ v of options._locals\n  opts[k] = v for k, v of options._locals\n\n  opts._csrf_input\
    \ name= ->\n    \"<input type=\"hidden\" name=\"#{options._locals.csrf}\" *>\"\
    \n```"
  merge: -1
