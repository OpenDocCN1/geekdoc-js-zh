    # CLASSES AND INHERITANCE


    Although making use of libraries such as jQuery to write code is straightforward,
    it becomes clear quickly to even a novice at writing procedural code—a series
    of bare statements on the page—doesn’t get very far. The first tool in the toolbox
    is the function, which allows you to write a series of statements and wrap them
    up so that they can be reused/called again and again. This principle is basic:
    "Don''t repeat yourself."


    Functions are powerful things in JavaScript, and therefore in CoffeeScript, too.
    Functions can contain variables and even functions within their scope. This combination
    enables developers to take that wrapping one stage further and encapsulate large
    pieces of logic into single functions, hiding the details of the implementation
    from the code calling them. This is an application of another basic principle
    called loose coupling.


