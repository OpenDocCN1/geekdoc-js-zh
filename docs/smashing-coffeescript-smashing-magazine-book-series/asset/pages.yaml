- img_proc: true
  md: '# CHAPTER 15 • Real-Time Web with Socket.io 303


    a series of primitive operations and sends those operations that originated locally
    to the network for other users to access.


    The question of conflict has been studiously avoided so far, so let me address
    it now. With any system where multiple users request simultaneous changes, it
    is virtually certain that the system (in least, even if it is difficult in practice)
    will allow users to make requests that cannot be reconciled with each other—for
    example, the two users changing a word in a sentence.


    So in general, the question is not “how do I avoid conflicts?” but really “how
    do I deal with conflicts?” And, like many other problems, the correct solution
    is in the eye of the beholder. Developers do whatever makes the most sense for
    their application. That said, here are some common strategies:


    +   - The software picks a winner. Usually, the first change wins, and later changes
    that conflict are backed out. This requires sufficient centralization to be able
    to determine reliably which change was made first.


    +   - Both changes lose. In case of conflict, both changes are rolled back and
    the users will need to reenter to try again.


    +   - A user picks a winner. Usually this is done by conflict resolution (that
    is, making a further change that resolves the conflict), but also potentially
    by picking one of the changes.


    There is no obvious right or wrong to any of these, although (for example) if
    the data is important and throwing out that conflict is highly undesirable, the
    manual conflict-resolution process might be attractive. Equally, if changes are
    generally unimportant, it might be best to throw them away.


    Ideally, in all situations, users on the losing end of the algorithm will be warned
    in some manner—at least showing them the change that has not been made. However,
    by this point, the user interface is begin resembling something closer to a version
    control system—namely not simple and easy to use, and users as a rule to have
    difficulty with the concept of conflicting editing and an ordered history of changes.


    # BUILDING A MEETING WHITEBOARD APP


    To demonstrate collaboration in the wider sense of the world, a more down-to-earth
    example is appropriate, and to do this, I''ll walk you through the idea of providing
    a real-time conference whiteboard. Using Socket.io and HTML 5''s `<canvas>` widget,
    the idea is straightforward. We provide a whiteboard for a user, but transmit
    the user’s drawing to a server, which broadcasts those same drawings out to other
    users connected to the same drawing.


    The starting point for this application is a single-user whiteboard that demonstrates
    the mode of drawing and the data structures at play. As a general rule, this is
    the wrong way to go about the process of design, and this example demonstrates
    why—as is often the case, examining the mistakes made along the way is more instructive
    than the final solution itself!'
