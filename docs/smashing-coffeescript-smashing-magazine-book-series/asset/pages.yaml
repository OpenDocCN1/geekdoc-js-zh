  md: '# VIEWING THE RESULTS


    It might feel slightly odd that I''ve managed to come this far by writing a few
    scraps of HTML. The view is where the “output” happens, and is therefore one of
    the key parts of the application. With a good understanding of what the controller
    is it''s now possible to look at where the view fits in and all honesty, views
    in Spine are simple.


    There are a number of different ways of generating the HTML needed for an application.
    Frameworks like Spine are aimed squarely at the “single page application” where
    the application runs entirely on the client-side. The user does not visit other
    pages and the browser refreshes pages from the server. Using him (and stitch,
    underneath) to compile and deliver JavaScript and CSS works well, but it doesnt
    really address the problem of how or when to deliver HTML markup to the browser.


    There are a few different approaches you can take:


    +   * Write all the HTML required into a single page, hiding everything to begin
    with: This approach has the advantage of being quick and simple, but isn’t maintainable
    and causes the initial page load to be quite slow.

    * Write the HTML in different files and use a compiler to generate a single page:
    This approach is more maintainable than the first approach, but doesn’t address
    any of the other shortcomings.

    * Load the HTML as required, perhaps through AJAX calls: This approach is much
    more lightweight, but requires a running server doing work for the application.
    This application could never work offline.

    * Generate the HTML on-the-fly in the controller, using strings or jQuery calls:
    This approach is definitely lightweight but mixes the view into the controller,
    creating where it isn’t wanted.


    None of these solutions are ideal, and thankfully Spine provides an alternative:
    HTML can be written in different files and compiled into JavaScript functions.
    This allows the controller to access the view without requiring everything to
    be built into the page, and keeps the view structurally separate from the controller.


    Spine provides this feature by fully integrating a template engine Eco. Like the
    other libraries used by Spine, Eco is a natural fit, allowing CoffeeScript expressions
    in the template code. Eco can also be extended using functions called “helpers”
    to allow specialized template handling code throughout the application. It’s also
    written in CoffeeScript and is easy to follow. I would recommend having a read
    through to try to follow what’s going on internally.


    # USING (ECO TEMPLATES


    Although I just said that Spine provides a single template engine, there are actually
    two different forms that can be used: the standard Eco template, and the hem-specific
    “Eco” template. The difference will be fully explored later in this chapter, but
    to suffice for'
