  md: '# PART II • CoffeeScript Projects


    Without being very explicit, hem is letting the world know that it has done something.
    In fact,

    hem''s what''s happened:


    +   - hem follows the dependencies among the modules, as described earlier.

    - The module sources required are joined together and compiled into JavaScript,
    using a tool called stitch.

    - Additional requirements, potentially in JavaScript, are identified from the
    slug.json configuration file and included in the source.

    - The resultant JavaScript is put through a minification process that strips out
    much extraneous content as possible and is saved as a single file.


    After this process is complete, the file public/application.js contains all the
    application-code that has been written, plus any dependencies required by the
    application—including jQuery if required, or any other third-party library. Literally,
    the whole project is reduced to a single file.


    hem also contains a built-in server, which can access these resources. By default,

    hem serves the file ./public/index.html on the root that contains references to
    the Spine

    startup guide. Starting the server is easy:


    ```

    $ hem server

    >> Strata web server version 0.15.1 running on node 0.6.18

    >> Listening on 0.0.0.0:9294, CTRL+C to stop

    ```


    It''s now serving pages and can be accessed via the browser going to

    http://127.0.0.1:9294.


    The default reference to the startup guide can be removed, leaving little except
    the references

    to /application.js and /application.css. After the content is updated,

    them server, on request, will construct this content automatically, behind the
    scenes. This

    environment is a useful one for testing because the code being delivered to the
    browser is as it

    would be in production.


    # SUMMARY


    Most projects end up requiring a build system of some sort. It''s unlikely that
    you would want

    deliver resources to the end user in the exact same form as you develop them.


    In this chapter you examined some of the tools that can be used to build deployment-ready

    files for a CoffeeScript application:


    +   - Designing a sensible application layout for a CoffeeScript project

    - Using cake to define and run build tasks as part of the development process

    - Using hem to bring together the various source files and other project resources
    into

    bundles that can be deployed'
