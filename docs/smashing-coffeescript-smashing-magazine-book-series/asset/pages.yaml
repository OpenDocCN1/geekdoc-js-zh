    # MODELLING CLIENT-SIDE DATA


    The most crucial parts of any application are the algorithms and structures that
    represent the core data the application is dealing with. In some applications
    the core data is about people, in others the core data is about physical objects.
    This process of relating the data to the domain in which the application operates
    is generally referred to as "modeling."


    Among the original proponents of object-oriented programming techniques, there
    was extensive debate about whether developers should seek to model the real world
    directly. Some felt that the power of objects allowed them the programmer to relate
    their internal processes to happening for real: as example, in a financial accounts
    handling system, each transaction might be represented by a separate object.


    Others felt that attempting to develop solutions that closely matched the real
    world in their internal architecture was missing the point. Their argument was
    that the developer should use the structures and algorithms that best suit the
    problem, which might be quite different than the way the problem is structured
    in the real world. Search engines, for example, don''t model their database as
    a series of documents but instead extract keywords and perform statistical models
    of data. It would be too slow to perform searches on individual documents.


    This argument has never really gone away: This is a classic problem that doesn''t
    have a "right answer." Using models based on real-world objects is a useful metaphor
    that helps programmers understand a problem and write code that correctly solves
    it. However, realworld models are usually not the most efficient structures for
    solving a problem and in some instances can be disastrously inefficient. Choosing
    the correct data structures for an application may be the most important decision
    you can make when writing a program.


    # CREATING A SPRING MODEL


    For the calendar application I''m going to take a real-world approach to defining
    the model. The calendar is going to contain events, and each event will have a
    defined start and end. Events need to be named somehow for display on the calendar
    and an extended description of what they are about would be useful.


    The plug-in I''m using to display this information, FullCalendar, has similar
    ideas about what events look like. So I''m going to write an event model that
    is very close to what the plug-in expects to reduce the need for any "translation"
    of data.


    To begin with, a model needs some defined attributes, but not much. By convention
    these attributes are saved in the application''s models directory. Create the
    model for an event by calling spring model:


    ```

    create app/models/event.coffee

    create test/specs/models/event.coffee

    ```'
