  md: "# CHAPTER 14 • Server-Side CoffeeScript 289\n\n```\nfs.readFile(path, 'utf8',\
    \ (err, str)\n  return callback(err) if err:\n    callback null, eco.render str,\
    \ opts\n```\n\nThe render () wraps the Eco engine and is the function provided\
    \ to Express.js early in the process of configuring the views. Its job is to implement\
    \ the view renderer API that Express expects, with an implementation that calls\
    \ the Eco system to generate the view output.\n\nFirst it merges all the local\
    \ variables in the context into a single object, to be later passed through Eco.\
    \ It also defines a function on that object. Since Eco templates can contain any\
    \ CoffeeScript expression, they need not limit themselves to variables and simple\
    \ expressions. Function calls are possible, a function is the most appropriate\
    \ way of exposing the functionality, although I strongly recommend using it.\n\
    \nIn this case a function is the most appropriate way of exposing the functionality,\
    \ as it is generating an input for the form and forming the input with the CSRF\
    \ token for the current user. Each template with a format that requires protection\
    \ must only include the call to <% _csrf_input() %> to place the token-containing\
    \ input in the form.\n\n# Other Attacks\n\nThere are a variety of other attacks,\
    \ and it's virtually impossible to give even high-level guidance the best way\
    \ to defend against them. However, here's a bit of advice I'd like to offer:\n\
    \n+   - Never trust input from the remote browser, either when processing it in\
    \ the first instance or later reusing it.\n- There is virtually no good reason\
    \ to output data in a non-escaped fashion, and certainly never a good reason if\
    \ the data output contains any user input.\n- Don't rely on any single scheme\
    \ to deliver security; validate input, check forms for forgery, check authentication\
    \ tokens, defend the application in depth.\n- Never send information to the browser\
    \ unless it's absolutely required; instead use the session.\n- As much as possible,\
    \ stay up on the state of the art. A few years ago, SQL injections (a of incorrectly\
    \ trusted input attack) were all the rage, but there is always a new attack just\
    \ around the corner.\n\nSadly, being a CoffeeScript user alone confers little\
    \ benefit (although many of the various checks that the system performs for you\
    \ compilation and runtime are of value), and if you're just starting to exercise\
    \ your server-side development skills, many of these design factors will feel\
    \ slightly unfamiliar. Don't let that pass you off; read the subject, but more\
    \ importantly, put yourself in the attacker's shoes and think about the weak spots."
