    \ things will work without it, but when things go wrong the errors will be very\
    \ strange and difficult to debug.\n\n# Making Functions Available\n\nDefining\
    \ classes in CoffeeScript and then using them from JavaScript code is easy. Doing\
    \ the same with functions is a lot more difficult because CoffeeScript generally\
    \ does not name functions.\n\nWithout names, the calling JavaScript cannot access\
