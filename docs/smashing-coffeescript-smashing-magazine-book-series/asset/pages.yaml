  md: '# PART III • CoffeeScript Application Development


    As a reminder, the complete sources to the examples given in this book are available
    from wiley.com/go/smashingcoffeescript. Since the application examples in this
    chapter are particularly involved, I recommend downloading them and using them
    alongside the text.


    # PREPARING THE GROUND


    For the calendar booking application, I''ve used a prewritten widget for the actual
    presentation of the calendar: Adam Shaw''s "FullCalendar" jQuery plugin-in, available
    at http://arshaw.com/fullcalendar.


    Quite often an application will start like this: There are already pieces of library
    code for either the client or the server portion, and the first job is loading
    the library or libraries into the project and making them available so you can
    begin building the application.


    Now, it is possible to download the FullCalendar plug-in and use it according
    to the instructions, putting the various scripts into the public/ folder, altering
    the public/index.html file to add the scripts to the page, and then writing the
    code that will make use of the scripts. This isn''t the Spine way, though.


    What is preferable for the various pieces of code to be included in the system
    in such a way that hem can pick them up and work with them in the same way as
    other parts of the system, so that''s the next job.


    Upon downloading and unpacking the FullCalendar plug-in, you''ll find a number
    of files. This list shows the ones you need, by where they should be placed:


    +   - fullcalendar/fullcalendar.js is the main script file; copy this to .lib/.

    - jquery/jquery-ui-X.X.X.custom.min.js includes some jQuery routines; copy this
    to .lib/ as well.

    - jquery/jquery-X.X.X.min.js is a copy of jQuery; copy this to .lib/.

    - fullcalendar/fullcalendar.css is the main stylesheet; copy this to .css/


    Actually, the situation with the jQuery UI file is slightly more complex. FullCalendar
    uses some specific interactions from jQuery UI—drag and drop behavior, mostly—to
    offer specific features. If you use a custom version of the code including only
    those behaviors, however, it''s likely that other features may be needed in the
    application, as well include the full version of jQuery UI (or, at least, a version
    customized for the application). FullCalendar won''t mind; it needs those behaviours.


