  md: '# REUSING SERVER-SIDE CODE ON THE CLIENT


    Since the advent of node.js, developers have asked whether the "holy grail" is
    reachable: a single code base executed partly on the server, partly on the client,
    with shared code between the two sides to simplify development and speed up delivery.


    There are some obvious reasons for optimism. With both the server-side and client-side
    possessing JavaScript execution environments, and a developer’s natural taste
    for reuse of code, developing code for both client- and server-side execution
    is seemingly an excellent fit.


    Some in the web development community see things differently. Although admitting
    the theoretical advantages, a number of developers see sharing code between the
    client-side and the server-side as bad practice, because the two environments
    are quite different. Still others find the whole idea antithetical, in both principle
    and practice, because the considerations and work load on the two sides are so
    radically different.


    I tend to sit on the fence on this: for most applications, I think there can be
    either a benefit or a detriment, and this difference may not be clear to many
    developers until they actually try it. That said, following are some thoughts
    on my experiences regarding what is likely to produce a "win" or a "lose."


    # SHARING TEMPLATES


    For me, the template code that creates or modifies markup is the strongest candidate
    for for sharing between the client and server side. The examples shown so far
    in this book have relied on the Eco engine, executing in the node.js environment.
    In reality, nothing requires that it actually has to execute in that environment,
    and indeed Eco comes with a compiler that turns templates into JavaScript functions
    that can be called on directly.


    The big advantage is the ability to generate the same markup for a given template
    on the server or the client, keeping the template itself DRY, while not significantly
    increasing the system’s complexity to a crawl.


    The primary downsides are that passing templates through the client-side is a
    more involved affair—the application is effectively creating data that it would
    ordinarily be processing. If the server-side is passing templates through the
    client-side, it is also possible to use server-side templates to generate templates
    that are then passed to the client. This type of scheme, which may seem clever
    and flexible at first glance, is an absolute nightmare in practice. It results
    in fragile applications that occasionally generate invalid template code, leading
    to frustrating and challenging debugging sessions.


    In addition to Eco, a variety of other templating systems are available, many
    of which are "pure" JavaScript designed for use within the browser but can also
    be deployed server-side. These solutions are even more suitable for sharing code,
    where the primary requirement is on the client-side, but the occasional server-side
    render is helpful.'
