  md: '# JQUERY''S FLUENT API


    Arguably the finest decision made when authoring jQuery was the use of the fluent
    API. Coined in 2005 by design patterns Martin Fowler and Eric Evans, the term
    "fluent" is associated with a method-chaining style of code structure. Although
    as a design pattern it had been used in decades by that point, it was particularly
    appropriate to dynamic languages.


    Each web browser, there is something called the Document Object Model, or DOM.
    But what is the DOM? It is almost like a window into the internal functioning
    of the browser: it represents the internal data structure of how the browser has
    interpreted the HTML document, and any assets mentioned in the document, but does
    so in a standard way where for the most part is in every browser. The browser
    parses the HTML document into a pyramid-like structure—with the `<html>` node
    at the top, the `<head>` and `<body>` nodes underneath, and so on and from this
    it creates the DOM.


    jQuery gives you a number of tools to manipulate this document structure. If you
    haven''t used jQuery before, the basic rules of the API are simple to state:


    +   * There is a function called jquery(), but most people call it $—that''s an
    alias for it to save you from having to type the full name each time,

    * If you pass DOM nodes or a CSS selector, jquery() will return a list of the
    selected nodes, and the list will be wrapped with jQuery functions,

    * jquery() has a variety of attributes that make up the main API and which you
    can call on DOM nodes.


    Here''s a fragment of a simple HTML document:


    ```

    <body>

    <h2>Staff Directory</h2>

    <ul>

    <li class="executive">Jim Jones</li>

    <li class="executive">Alice Arnold</li>

    <li class="admin">Laura Laansbury</li>

    <li class="admin">Paul Peterson</li>

    </ul>

    </body>

    ```


    Within the DOM, this would be structured as a <body> node with two children: <h2>
    and <ul>. The <ul> would have four children, the <li> nodes. Some of the list
    items are not well-formed; they are not closed. From a DOM perspective, that actually
    doesn''t matter: once a document has been parsed a node is a node, and the mark-up
    of the document matters only if any error causes the browser to structure the
    DOM in a way that was not intended; for example, turning the list item into an
    unintended sub-list.


    With basic understanding, it''s time to dive into jQuery with CoffeeScript to
    see how this works in practice, and how the fluent interface is a really great
    thing. Say that you wanted to avoid a cheesy effect to this staff directory page:
    when the visitor arrives, you''d'
