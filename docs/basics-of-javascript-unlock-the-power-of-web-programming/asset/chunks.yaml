    ## 6.4 访问对象属性：点号表示法与方括号表示法


    访问 JavaScript 对象属性主要有两种方式：点号表示法和方括号表示法。理解何时以及如何使用每种方法，可以帮助你高效地处理对象及其属性。


    ### 6.4.1 何时使用点号表示法


    点号表示法是访问对象属性最常见、最直接的方式。它因其可读性和简洁性而备受青睐。


    ![](img/image_rsrc20G.jpg)


    点号表示法应在以下情况使用：


    - 属性名事先已知，并且是一个有效的 JavaScript 标识符。

    - 访问的是不需要动态求值的静态属性。


    ### 6.4.2 何时使用方括号表示法


    方括号表示法比点号表示法更灵活，但可能稍显冗长。它允许使用标识符中不允许的字符，例如空格或数字开头。此外，当属性名是动态确定时，方括号表示法至关重要。


    ![](img/image_rsrc20H.jpg)


    在以下情况使用方括号表示法：


    - 属性名包含特殊字符或空格。

    - 属性名以数字开头。

    - 属性名存储在变量中或需要计算得出。


    ### 6.4.3 动态属性名


    在处理动态确定的属性（例如基于用户输入或运行时值）时，方括号表示法大放异彩。


    ![](img/image_rsrc20J.jpg)这种能力在需要灵活性的场景中特别有用，例如遍历对象中的键或根据变量输入访问属性。


    ### 6.4.4 属性存在性与枚举


    要检查对象是否具有特定属性，可以使用 `in` 运算符或 `Object.hasOwnProperty()` 方法。


    ![](img/image_rsrc20K.jpg)


    要枚举（列出）对象的属性，可以使用 `Object.keys()`、`Object.values()` 或 `Object.entries()` 方法，它们分别返回属性的名称、值或两者。


    ![](img/image_rsrc20M.jpg)


    选择合适的表示法并理解属性存在性与枚举，可以让你在 JavaScript 应用程序中更有效地操作和查询对象。


    ## 深入理解对象


    ### 7.1 面向对象 JavaScript 简介


    面向对象编程（OOP）是一种基于“对象”概念的编程范式，对象可以包含字段（通常称为属性）形式的数据和过程（通常称为方法）形式的代码。JavaScript 通过其原型支持
    OOP，并且从 ES6（ECMAScript 2015）开始，还支持使用类来实现经典的 OOP 概念。


    #### 7.1.1 面向对象编程的四大支柱


    面向对象编程的四大基础支柱包括：


    1. 封装：该原则是将数据以及操作数据的方法捆绑到一个称为“对象”的单一单元中。它允许限制对对象某些组件的访问，这是数据抽象和控制的第一步。


    2. 抽象：抽象意味着隐藏复杂的现实，只暴露必要的部分。它通过提供实体的简化模型来突出其在交互上下文中的行为，从而有助于降低编程复杂性和工作量。


    3. 继承：这是一种机制，允许一个类获取另一个类的属性（方法和字段）。通过继承，你可以创建一个通用类，然后将其扩展为更专门的类。


    4. 多态：多态允许实体以多种形式表示。它是在不同对象上调用相同方法，并让每个对象以自己的方式响应的能力。


    #### 7.1.2 JavaScript 中的对象和类


    在 JavaScript 中，传统上，对象的原型是添加方法和属性的主要方式。然而，ECMAScript 6 引入了类，它在基于原型的继承之上添加了一层薄薄的抽象，使得实现复杂的对象结构更加容易。


    示例：


    ![](img/image_rsrc20N.jpg)


    #### 7.1.3 封装与信息隐藏


    JavaScript 类通过将数据（属性）和操作数据的函数（方法）集成到一个称为类的单一单元中来支持封装。然而，直到最近的补充（如私有类字段），JavaScript
    并没有直接支持数据隐藏。这通常通过闭包或较新的私有字段语法来实现。


    使用私有字段的示例：


    ![](img/image_rsrc20P.jpg)


    #### 7.1.4 类中的方法与 `this` 上下文


    方法是可以对对象执行的操作，JavaScript 方法作为函数定义存储在属性中。


