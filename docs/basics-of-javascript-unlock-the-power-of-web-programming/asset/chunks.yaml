    ### 4.2.2 Function Expressions


    A function expression assigns an anonymous function or a named function to a variable.
    Function expressions are not hoisted, meaning they cannot be called before they
    are defined in the code.


    Syntax:


    ![](image_rsrc1YP.jpg)Example:


    ![](image_rsrc1YR.jpg)Attempting to call `greet` before its definition will result
    in an error because function expressions do not enjoy hoisting.


    ### 4.2.3 Named vs. Anonymous Functions


    Function expressions can be anonymous (as seen above) or named.


    Named Function Expression:


    ![](image_rsrc1YS.jpg)


    A key difference is in debugging: named functions can be easier to identify in
    a stack trace. However, within the function body, you use the name to refer to
    the function itself, such as creating a recursive call.


    Anonymous Function Expression:


    ![](image_rsrc1YT.jpg)


    Anonymous functions are common, especially as arguments to other functions or
    in IIFEs. The absence of a name simplifies the syntax but can make debugging more
    challenging.


    ### 4.2.4 Hoisting in Functions


    Hoisting is a JavaScript mechanism where variables and function declarations are
    moved to the top of their containing scope before code execution. However, this
    behavior differs between function declarations and expressions.


    - Function Declarations: Are fully hoisted, meaning the entire function is moved
    to the top of its scope and can be used before it''s declared in the source code.


    - Function Expressions: The variable declaration is hoisted, but not the function
    assignment. If you try to invoke a function expression before its definition,
    you''ll encounter an error as the function will not be defined yet.


