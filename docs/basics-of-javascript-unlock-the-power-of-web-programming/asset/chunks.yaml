    使用提前返回是一种通过一旦满足特定条件就退出函数来提高代码可读性的策略，避免了 if-else 语句的深层嵌套，并使函数的主要操作清晰明了。


    ![](img/image_rsrc1ZH.jpg)


    提前返回有助于防止不必要的计算，并使函数的逻辑更易于理解。


    返回值是函数的一个强大方面，可以显著影响代码的结构和质量。充分利用它们可以编写更具表现力、模块化和健壮的 JavaScript 应用程序。


    ## 5.4 理解回调函数


    回调函数是 JavaScript 中的一个基础概念，用于促进异步操作、自定义功能以及处理可能不会立即完成的操作。它们是作为参数传递给其他函数的函数，允许基于事件或条件实现更动态的执行流程。


    ### 5.4.1 基本用法和示例


    回调函数在给定任务完成时被调用。这种模式允许一个函数接受另一个函数作为参数，并在自身执行完成后执行该函数。


