    In JavaScript, functions can be created in several ways, each with its own nuances
    and implications for use. Understanding the differences between function declarations
    and expressions, and how naming and hoisting affect their behavior, is essential
    for effective JavaScript development.


    ### 4.2.1 Function Declarations


    A function declaration defines a named function. One of the key features of function
    declarations is that they are hoisted, meaning the function can be called before
    its declaration in the code.


