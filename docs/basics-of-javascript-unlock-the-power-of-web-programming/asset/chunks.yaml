    ## 2.5 Understanding Operator Precedence


    ### 2.5.1 What Is Operator Precedence and Why It Matters


    Operator precedence refers to the rules that determine the order in which operations
    are processed in an expression. In JavaScript, as in mathematics, certain operations
    are performed before others unless explicitly instructed otherwise with the use
    of parentheses.


    Understanding operator precedence is crucial because it ensures that complex expressions
    are evaluated as intended without unexpected results. For example, arithmetic
    operations follow the conventional order observed in math (multiplication before
    addition), which impacts how an expression is evaluated.


    ### 2.5.2 Operator Precedence and Associativity Rules


    Operators in JavaScript have a specific precedence level, which determines the
    order in which they are evaluated. Operators with higher precedence are evaluated
    before those with lower precedence.


    When operators have the same level of precedence, their associativity (left-to-right
    or right-to-left) determines the order. For instance, the assignment operator
    (`=`) has rightto-left associativity, meaning that an expression like `x = y =
    5` is processed as `x = (y = 5)`.


    Examples of operator precedence levels from highest to lower:


    - Grouping: `()` has the highest precedence and can alter the natural precedence
    order.


    - Member Access: `.` for accessing object properties.


    - Unary Operators: Such as `++`, `--`, `!`, and typeof.


    - Multiplication and Division: `*`, `/`, and `%`.


    - Addition and Subtraction: `+` and `-`.


    - Relational: `<`, `<=`, `>`, and `>=`.


    - Equality: `==`, `!=`, `===`, and `!==`.


    - Logical AND: `&&`.


    - Logical OR: `||`.


    - Assignment: `=`, `+=`, `-=`, `*=`, and `/=`.


    ### 2.5.3 Overriding Default Precedence: The Use of Parentheses


    Parentheses `()` can override the standard order of operations, ensuring that
    expressions within parentheses are evaluated first, regardless of the natural
    precedence rules. This allows for explicit control over the evaluation order in
    complex expressions.


    ### 2.5.4 Practical Examples of Operator Precedence in Action


    1\. Without Parentheses:


    ![](image_rsrc1XF.jpg)Multiplication (`*`) has a higher precedence than addition
    (`+`), so 4 is multiplied by 5 before adding 3 to the result.


    2\. With Parentheses:


    ![](image_rsrc1XG.jpg)Parentheses alter the natural precedence, so 3 is added
    to 4 before the result is multiplied by 5.


    3\. Combining Different Types:


    ![](image_rsrc1XH.jpg)Multiplication is performed first, followed by addition
    and subtraction from left to right according to their associativity.


    4\. Logical Operators:


    ![](image_rsrc1XJ.jpg)Logical AND (`&&`) has a higher precedence than logical
    OR (`||`), but using parentheses can change the evaluation order for clarity or
    to alter the result.


    Understanding and utilizing operator precedence allows for the crafting of precise
    and accurate expressions in JavaScript, crucial for developing logical and efficient
    code.


