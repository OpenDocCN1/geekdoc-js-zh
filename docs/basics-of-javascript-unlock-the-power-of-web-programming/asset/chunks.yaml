    中的每个语句通常后跟一个分号（`;`）来标记当前语句的结束，但需要注意的是，由于自动分号插入（ASI）机制，JavaScript 引擎即使没有分号也能解释语句的结束。


    JavaScript 程序可以包含用于存储数据的变量、用于重复操作的循环、用于将代码组织成可重用块的函数等等。基本结构依赖于这些构造来构建更复杂的操作和工作流程。


