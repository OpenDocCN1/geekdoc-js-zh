    `Async/await` 可视为 `Promises` 的语法糖，旨在进一步简化异步编程。它标志着 JavaScript 处理异步操作的最新演进，提供了一种直观的方式来编写既易于阅读又易于编写的异步代码。


    `Async/await` 在幕后处理 `Promises`，无需手动使用 `.then()` 和 `.catch()` 方法，并减少了样板代码，尤其是在处理复杂的异步工作流或需要按顺序执行多个异步操作时。


    通过建立在 `Promises` 和生成器奠定的基础之上，`async/await` 使 JavaScript 的异步编程模型更加易用且更加强大，使开发者能够编写干净、高效且可维护的异步代码。


    总之，JavaScript 异步编程特性的持续演进——从回调到 `Promises`，从生成器到 `async/await`——展示了该语言的适应性及其对改善开发者体验和代码可读性的承诺。这些特性为开发者提供了在现代
    Web 开发中高效处理日益复杂的异步操作所需的工具。


    ## 浏览器环境


    ### 10.1 DOM（文档对象模型）简介


    #### 10.1.1 什么是 DOM？


    文档对象模型（DOM）是浏览器提供的编程接口，允许脚本动态访问和更新网页的内容、结构和样式。本质上，DOM 将文档表示为可编程操作的对象层次树。页面的每个元素都是该对象树的一部分，并可通过
    DOM API 进行访问。


    #### 10.1.2 DOM 树与节点


    DOM 将网页结构组织为节点树，其中每个节点代表文档的一部分。这棵树包括从根文档节点到各个文本节点的所有内容：


    - 文档节点：代表整个 HTML 文档的根节点。

    - 元素节点：代表 HTML 元素（`<div>`、`<header>`、`<p>` 等），并作为其他类型节点的容器。

    - 文本节点：包含 HTML 元素内的文本，并且始终是叶子节点，因为它们不能包含任何其他节点。

    - 属性节点：在现代 DOM 规范中不再被视为 DOM 树的一部分。属性现在是元素节点的属性。


    #### 10.1.3 在 JavaScript 中访问 DOM


    通常使用 JavaScript 访问 DOM，它提供了多种从 DOM 树中选择节点的方法：


    - `document.getElementById(id)`：通过 `id` 属性选择单个元素节点。

    - `document.getElementsByTagName(tagName)`：返回具有指定标签名称的实时元素集合。

    - `document.getElementsByClassName(className)`：返回具有指定类名的实时元素集合。

    - `document.querySelector(selector)`：返回匹配指定 CSS 选择器的第一个元素。

    - `document.querySelectorAll(selector)`：返回匹配指定 CSS 选择器的所有元素的 `NodeList`。


    #### 10.1.4 DOM 操作的方法与属性


    一旦选中节点，DOM API 提供了许多方法和属性来操作这些元素：


    - 更改元素样式和类：`element.style` 等属性和 `element.classList.add/remove/toggle` 等方法允许动态控制
    CSS 样式和类。

    - 操作元素内容：`innerHTML` 和 `textContent` 属性允许获取或设置元素的 HTML 或文本内容。

    - 创建和移除元素：`document.createElement(tagName)` 和 `element.removeChild(child)` 等方法允许在
    DOM 树中动态添加或移除节点。

    - 属性操作：`element.setAttribute(name, value)` 和 `element.getAttribute(name)` 等方法用于管理元素属性。

    - 事件处理：使用 `element.addEventListener(event, handler, [options])` 添加事件监听器，使你能够响应用户交互执行代码。


    理解 DOM 对于 Web 开发至关重要，因为它是 HTML 文档与 JavaScript 代码之间的桥梁，能够实现动态、交互式和响应式的 Web 体验。


    ### 10.2 选择与操作 DOM 元素


    #### 10.2.1 使用 `getElementById`、`getElementsByClassName` 和 `getElementsByTagName`


    DOM 提供了多种从页面中选择元素的方法，使开发者能够轻松地使用 JavaScript 访问和操作这些元素。


    - `getElementById`：此方法通过 ID 检索元素。它是选择元素最快、最常用的方法之一。


    ![](img/image_rsrc22C.jpg)


    - `getElementsByClassName`：此方法返回一个实时的 `HTMLCollection`，包含所有具有指定类名的元素。


    ![](img/image_rsrc22D.jpg)


    - `getElementsByTagName`：返回具有给定标签名称的实时 `HTMLCollection`。


    ![](img/image_rsrc22E.jpg)


    #### 10.2.2 查询选择器简介


    查询选择器是强大的工具，允许在 DOM 中进行复杂的 CSS 样式选择。它们有两种变体：


    - `querySelector`：返回匹配指定 CSS 选择器的第一个元素。


    ![](img/image_rsrc22F.jpg)


    - `querySelectorAll`：返回一个静态的 `NodeList`，表示匹配指定 CSS 选择器组的元素列表。


    ![](img/image_rsrc22G.jpg)


    查询选择器非常灵活，能够基于非常复杂的条件选择元素。


    #### 10.2.3 操作元素属性与特性


    选中元素后，可以修改其属性和特性。属性直接在 HTML 标签上定义，而特性是这些元素在 JavaScript 对象表示中的值。


    - 设置和获取属性：使用 `setAttribute` 设置属性值，或使用 `getAttribute` 获取属性值。


    ![](img/image_rsrc22H.jpg)


    - 修改特性：直接更改诸如 `innerHTML`、`textContent` 或 `style` 等特性。


    ![](img/image_rsrc22J.jpg)


    #### 10.2.4 创建、插入和移除节点


    DOM API 允许动态创建和操作内容，使开发者能够添加、替换或移除页面上的元素。


    - 创建新元素：`createElement()` 方法创建一个新的元素节点。


    ![](img/image_rsrc22K.jpg)


    - 插入元素：可以使用 `appendChild()` 或 `insertBefore()` 将创建的元素插入到 DOM 中。


    ![](img/image_rsrc22M.jpg)


    - 移除元素：`removeChild()` 方法从 DOM 中移除元素。较新的方法包括 `remove()`，它不需要父节点引用。


    ![](img/image_rsrc22N.jpg)


    DOM 提供的这些技术和工具是与网页元素动态交互的基础，使开发者能够构建高度交互且用户友好的网站。


    ### 10.3 处理事件：响应用户输入


    #### 10.3.1 理解事件流：捕获与冒泡


    事件流是事件在网页上接收的顺序。主要有两个阶段：捕获阶段和冒泡阶段。


    - 捕获阶段：当事件发生时，它首先从最外层的祖先向下移动到目标元素。这是捕获阶段。最初，大多数事件处理程序设置为在冒泡阶段（而非捕获阶段）响应。

    - 冒泡阶段：到达目标元素后，事件会向上冒泡到最外层的祖先。JavaScript 中的大多数事件在冒泡阶段工作，从而更容易实现事件委托。


    使用 `addEventListener` 方法，可以通过第三个参数指定事件监听器是在捕获阶段还是冒泡阶段触发：


    ![](img/image_rsrc22P.jpg)


