    ## 6.4 Accessing Object Properties: Dot vs. Bracket Notation


    Two primary ways to access properties of JavaScript objects are dot notation and
    bracket notation. Understanding when and how to use each can help you efficiently
    work with objects and their properties.


    ### 6.4.1 When to Use Dot Notation


    Dot notation is the most common and straightforward way to access a property of
    an object. It''s preferable for its readability and simplicity.


    ![](image_rsrc20G.jpg)


    Dot notation should be used when:


    - The property name is known ahead of time and it''s a valid JavaScript identifier.


    - You are accessing static properties that don''t require dynamic evaluation.


    ### 6.4.2 When to Use Bracket Notation


    Bracket notation offers more flexibility than dot notation but can be slightly
    more verbose. It allows the use of characters that aren''t allowed in identifiers,
    such as spaces or starting with digits. Additionally, bracket notation is essential
    when property names are determined dynamically.


    ![](image_rsrc20H.jpg)


    Use bracket notation when:


    - The property name contains special characters or spaces.


    - The property name starts with a digit.


    - The property name is stored in a variable or needs to be computed.


    ### 6.4.3 Dynamic Property Names


    Bracket notation shines when working with properties that are dynamically determined
    (for instance, based on user input or runtime values).


    ![](image_rsrc20J.jpg)This capability is particularly useful in scenarios requiring
    flexibility, such as iterating over keys in an object or accessing properties
    based on variable inputs.


    ### 6.4.4 Property Existence and Enumeration


    To check if an object has a specific property, you can use the `in` operator or
    `Object.hasOwnProperty()` method.


    ![](image_rsrc20K.jpg)


    To enumerate (list) an object''s properties, you can use `Object.keys()`, `Object.values()`,
    or `Object.entries()` methods which return the properties'' names, values, or
    both, respectively.


    ![](image_rsrc20M.jpg)


    Selecting the appropriate notation and understanding property existence and enumeration
    allows for more effective object manipulation and querying within your JavaScript
    applications.


    ## Deeper into Objects


    ### 7.1 Introduction to Object-Oriented JavaScript


    Object-Oriented Programming (OOP) is a programming paradigm based on the concept
    of "objects", which can contain data in the form of fields (often known as attributes
    or properties) and code in the form of procedures (often known as methods). JavaScript
    supports OOP through its prototypes and includes support for classical OOP concepts
    using classes as of ES6 (ECMAScript 2015).


    #### 7.1.1 The Pillars of Object-Oriented Programming


    The four foundational pillars of Object-Oriented Programming include:


    1. Encapsulation: This principle is about bundling the data and the methods that
    operate on the data under a single unit called an "object". It allows for restricting
    access to some of the object''s components, which is the first step towards data
    abstraction and control.


    2. Abstraction: Abstraction means hiding the complex reality while exposing only
    the necessary parts. It helps in reducing programming complexity and effort by
    providing a simplified model of an entity that highlights its behavior in the
    context of its interaction.


    3. Inheritance: This is a mechanism that allows one class to acquire the properties
    (methods and fields) of another. With inheritance, you can create a general class
    and then extend it to more specialized classes.


    4. Polymorphism: Polymorphism allows entities to be represented in multiple forms.
    It is the ability to call the same method on different objects and have each of
    them respond in their own way.


    #### 7.1.2 Objects and Classes in JavaScript


    In JavaScript, traditionally, the object''s prototype has been the primary method
    for adding methods and attributes. However, ECMAScript 6 introduced classes which
    added a thin layer of abstraction over the prototype-based inheritance, making
    it easier to implement complex object structures.


