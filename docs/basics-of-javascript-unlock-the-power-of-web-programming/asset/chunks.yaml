    ### 4.3.2 箭头函数与 `this` 关键字


    箭头函数最有益的特性之一是它们如何处理 `this` 关键字。与传统函数不同，箭头函数内部的 `this` 值由外围（封闭）词法上下文决定，而不是由函数的调用方式决定。


    示例：


    ![](img/image_rsrc1Z0.jpg)在这个示例中，箭头函数内部的 `this` 正确地指向了 `Timer` 对象，因为它从外围代码继承了
    `this`。


    ### 4.3.3 限制与特性


    虽然箭头函数有几个优点，但它们也有局限性：


    - 没有 `new` 关键字：箭头函数不能用作构造函数，尝试这样做会导致错误。


    - 没有 `arguments` 对象：箭头函数没有自己的 `arguments` 对象。不过，你可以使用剩余参数来实现类似功能。


    - 不能改变 `this`：`this` 的值是词法绑定的，意味着不能通过 `call`、`apply` 或 `bind` 等方法改变它。


    ### 4.3.4 箭头函数的实际用途


    箭头函数在以下几种场景中表现出色：


    - 回调和高阶函数：它们非常适合传递给数组方法（如 `.map()`、`.filter()` 和 `.reduce()`）的简短回调函数。


    ![](img/image_rsrc1Z1.jpg)


    - 事件处理程序：当使用箭头函数作为事件处理程序时，它们会保留词法 `this`。


    ![](img/image_rsrc1Z2.jpg)


    - 异步操作：箭头函数广泛用于 Promise 和异步函数中。


    ![](img/image_rsrc1Z3.jpg)


    理解何时以及如何有效使用箭头函数可以大大简化你的 JavaScript 代码，并帮助在异步操作中维护 `this` 上下文，从而编写出更清晰、更易于维护的代码。


    ## 4.4 作用域：理解局部与全局


    作用域是 JavaScript 中的一个基本概念，决定了变量和函数在代码不同部分的可访问性。理解作用域对于管理变量的生命周期以及避免冲突和错误至关重要。


    ### 4.4.1 什么是作用域？


    JavaScript 中的作用域指的是变量或函数可访问的上下文。JavaScript 有三种主要的作用域类型：


    - 全局作用域：在全局作用域中定义的变量可以从代码的任何部分访问。


    - 函数（局部）作用域：在函数内部定义的变量只能在该函数内部访问。


    - 块级作用域：在块 `{}` 内部定义的变量只能在该块内部访问。这个概念在使用 `let` 和 `const` 关键字时适用。


    ### 4.4.2 局部（函数）作用域与块级作用域


    - 函数作用域：使用 `var` 在函数内部声明的变量无法从函数外部访问。


