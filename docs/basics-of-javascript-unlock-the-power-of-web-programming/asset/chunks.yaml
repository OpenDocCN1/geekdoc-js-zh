    ## 4.2 探索函数声明与函数表达式


    在 JavaScript 中，可以通过多种方式创建函数，每种方式都有其细微差别和使用影响。理解函数声明与表达式之间的区别，以及命名和提升如何影响它们的行为，对于有效的
    JavaScript 开发至关重要。


    ### 4.2.1 函数声明


    函数声明定义了一个具名函数。函数声明的一个关键特性是它们会被提升，这意味着可以在代码中声明之前调用该函数。


