    ![](img/image_rsrc1XF.jpg)


    乘法（`*`）的优先级高于加法（`+`），因此先将 4 乘以 5，再将结果加上 3。


    2. 有括号：


    ![](img/image_rsrc1XG.jpg)


    括号改变了自然优先级，因此先将 3 与 4 相加，再将结果乘以 5。


