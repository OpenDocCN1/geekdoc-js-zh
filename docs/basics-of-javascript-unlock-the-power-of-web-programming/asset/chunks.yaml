    ### 4.4.4 The `let` and `const` Keywords


    Introduced in ES6, `let` and `const` provide block-level scoping, offering more
    control than `var`, which is function-scoped or globally-scoped.


    - `let` allows you to declare variables that are limited in scope to the block,
    statement, or expression in which they are used.


    - `const` is similar to `let` but is used to declare variables whose value should
    not change through re-assignment.


    Both `let` and `const` are not hoisted like `var`, making them safer to use as
    they prevent unintentional referencing before declaration.


    ### 4.4.5 Variable Shadowing and Scope Chain


    Variable shadowing occurs when a variable of the same name is declared within
    a nested scope, effectively overshadowing the variable in the outer scope.


    ![](image_rsrc1Z6.jpg)


    The scope chain is the mechanism by which JavaScript searches for variables and
    functions: starting from the innermost scope and moving outwards until it finds
    the variable or function it''s looking for, or until it reaches the global scope.


    Understanding scope, including distinctions between global, local, and block scope,
    as well as concepts like shadowing and the scope chain, is foundational for writing
    clear, effective JavaScript code. This knowledge helps in avoiding common pitfalls
    related to variable access and lifecycle.


    ## More on Functions


    ### 5.1 Functions Calling Functions: A Deeper Dive


    Expanding upon the basic understanding of functions in JavaScript, this section
    delves into more complex interactions and concepts surrounding functions. By exploring
    composition, recursion, and the use of higher-order and pure functions, we unlock
    powerful programming paradigms and techniques.


    ### 5.1.1 Composition and Function Chaining


    Function Composition is the process of combining two or more functions to produce
    a new function. Composing functions allows for creating more modular and reusable
    code.


    Function Chaining involves calling multiple functions on the same object consecutively.
    This is a common pattern in JavaScript, often seen in libraries such as jQuery
    or Lodash.


