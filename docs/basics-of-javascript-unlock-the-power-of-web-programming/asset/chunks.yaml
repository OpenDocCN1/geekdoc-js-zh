    每种模式都有其自身的优点和适用场景。选择哪种模式取决于继承的复杂性、性能考量以及个人或团队的偏好等因素。


    JavaScript 的原型继承模型相比经典模型更具灵活性且更简洁。通过充分理解和利用原型，开发者可以实现强大且高效的继承结构。


    ## 7.5 高级对象模式与技巧


    随着开发者深入使用 JavaScript，他们经常会遇到需要高级对象操作和设计模式的复杂场景。这些模式和技巧有助于编写更易维护、更灵活且更具扩展性的代码。


    ### 7.5.1 组合优于继承


    “组合优于继承”原则建议，对象的行为和状态应通过包含其他对象来获得，而不是从超类继承。这种方法可以构建更模块化、更易于理解的系统，因为它鼓励设计小而可复用的实体。


    组合避免了深层继承层次结构的陷阱，后者可能变得笨重且脆弱。我们不再问“这个对象是什么？”，而是问“这个对象能做什么？”，关注能力而非血统。


    ![](img/image_rsrc20Z.jpg)


    ### 7.5.2 混入与对象组合


    混入是对象组合的一种形式，其中组件的特性被混合到复合对象中。这使得对象可以从多个来源构建，增加了对象定义和使用的灵活性。


    ![](img/image_rsrc210.jpg)


    ### 7.5.3 封装私有属性和方法


    JavaScript 没有内置对私有属性和方法的支持，但可以通过模拟实现。一种常见的技术是使用闭包：


    ![](img/image_rsrc211.jpg)


    随着 ES6 的推出，JavaScript 引入了一种更正式的方式来定义私有字段，即使用哈希 `#` 前缀：


    ![](img/image_rsrc212.jpg)


    ### 7.5.4 对象不可变性与只读属性


    使对象不可变（创建后无法更改）是一种强大的技术，尤其在函数式编程和创建可预测的状态管理时。要使属性只读，可以使用 `Object.defineProperty()`
    或 `Object.defineProperties()`：


    ```javascript

    const obj = {};

    Object.defineProperty(obj, ''readOnly'', {


    value: ''This is read-only'',

    writable: false, // 阻止属性被写入。 });


    console.log(obj.readOnly); // ''This is read-only''

    // obj.readOnly = ''New Value''; 在严格模式下尝试写入此属性将失败。

    ```


    对于深层不可变性，可以使用 `Object.freeze()` 递归冻结对象，但需要注意的是，默认情况下这是一个浅层操作。


    采用这些高级模式和技巧有助于编写更健壮、更模块化且更易维护的 JavaScript 代码。它们使开发者能够充分利用 JavaScript 面向对象能力的全部潜力，同时管理大型代码库中的复杂性。


    ## 异步 JavaScript


    ### 8.1 理解异步 JavaScript


    异步 JavaScript 允许执行长时间运行的操作而不阻塞主线程，从而保持用户界面的响应性。理解 JavaScript 中处理异步操作的核心概念和可用工具对于现代
    Web 开发至关重要。


    #### 8.1.1 事件循环与非阻塞 I/O


    JavaScript 是单线程的，这意味着它一次只能执行一段代码。事件循环是一种机制，它允许 JavaScript 通过尽可能将操作卸载到系统内核来执行非阻塞
    I/O 操作（如读取文件或发起 HTTP 请求）。


    当这些操作完成时，它们会作为事件返回给 JavaScript。事件循环持续检查消息队列中是否有这些完成事件，并在它们到达时处理其回调函数。这种模型允许 JavaScript
    在等待异步操作完成的同时执行其他任务。


    #### 8.1.2 使用回调函数


    回调函数是作为参数传递给另一个函数的函数，当异步操作完成时，该函数会执行回调。虽然回调有助于管理异步操作，但它们可能导致“回调地狱”或“末日金字塔”，即回调嵌套在回调中，使代码难以阅读和维护。


    ![](img/image_rsrc213.jpg)


    #### 8.1.3 Promise：创建与链式调用


    `Promise` 是一个表示异步操作最终完成（或失败）的对象。与回调相比，`Promise` 提供了一种更清晰、更灵活的方式来处理异步操作。


    你可以通过链式调用 `.then()` 来处理异步操作序列，从而编写出既更易读又更易维护的代码。此外，`.catch()` 提供了一种集中处理错误的方式。


    ![](img/image_rsrc214.jpg)


    #### 8.1.4 Async/Await 实现异步流程控制


    `async`/`await` 简化了使用 `Promise` 所需的语法，使异步代码看起来更像同步代码，从而更易于理解和调试。


    `async` 函数返回一个 `Promise`，而 `await` 会暂停 `async` 函数的执行，直到 `Promise` 被解决。


    ![](img/image_rsrc215.jpg)


    #### 8.1.5 异步 JavaScript 中的错误处理


    在异步 JavaScript 中，正确的错误处理对于确保可靠性和可维护性至关重要。使用回调时，需要在每个回调中手动处理错误。`Promise` 和 `async`/`await`
    则分别通过 `.catch()` 和 `try`/`catch` 块提供了更简化的错误处理方式。


    ![](img/image_rsrc216.jpg)


    理解这些概念并有效利用 JavaScript 提供的处理异步操作的工具，是开发现代 Web 应用程序的基本技能。


    ## 8.2 发起 HTTP 请求


    发起 HTTP 请求是 Web 开发的基础，它使客户端代码能够与服务器、API 和其他 Web 服务进行通信。理解如何有效地发起和管理这些请求对于创建动态、数据驱动的
    Web 应用程序至关重要。


    ### 8.2.1 Fetch API 简介


    `Fetch` API 提供了一种基于 Promise 的现代机制来发起异步 HTTP 请求。与旧技术相比，`Fetch` 提供了更强大、更灵活的功能集来处理请求和响应。它内置于全局
    window 作用域中，因此在现代浏览器中可直接使用。


    ![](img/image_rsrc217.jpg)


    ### 8.2.2 使用 XMLHttpRequest 实现 AJAX


    在 `Fetch` 出现之前，`XMLHttpRequest`（`XHR`）是 Web 应用程序与服务器异步交互的主要方式。虽然它不如 `Fetch` 友好，但理解
    `XHR` 对于维护旧代码库或在某些 `Fetch` 不可用的特定场景中仍然很重要。


    ### 8.2.3 处理网络错误与 Fetch API 的局限性


    虽然 `Fetch` 简化了发起 HTTP 请求的过程，但处理潜在错误并了解其局限性至关重要。一个常见的误解是 `Fetch` 仅在网络错误时拒绝其 `promise`，而不会针对
    HTTP 错误状态（如 404 或 500）拒绝。


    要正确处理错误（包括 HTTP 状态错误）：![](img/image_rsrc218.jpg)


    ### 8.2.4 超越 GET 请求：POST、PUT、DELETE


    `Fetch` 可以处理所有类型的 HTTP 请求，包括 POST、PUT 和 DELETE。这通过在 `fetch` 调用中设置选项来实现，指定 `method`，以及非
    GET 请求所需的 `headers` 和 `body`。


    ### 8.2.5 使用 Headers 和 CORS


    HTTP 请求中的 Headers 允许客户端在请求或响应中传递附加信息。例如，Headers 可用于指定内容类型、身份验证令牌或 CORS（跨域资源共享）策略。


    '
- fmt: '

    Cross-Origin Resource Sharing (CORS) is a security mechanism that restricts how
    resources on a web page can be requested from another domain outside the domain
    from which the first resource was served. When working with APIs or conducting
    POST, PUT, or DELETE operations, it''s common to encounter CORS errors if the
    server is not configured to allow requests from your domain.


    Managing headers and understanding CORS are vital for developing web apps that
    interact securely and efficiently with external services.


    ![](image_rsrc219.jpg)


    Mastering these aspects of making HTTP requests opens up a vast array of possibilities
    for web developers, from interacting with third-party APIs to building complex
    web applications that rely on server-side data and operations.


    ## 8.3 Handling JSON Data


    JavaScript Object Notation (JSON) is a lightweight data-interchange format that
    is easy for humans to read and write, and easy for machines to parse and generate.
    It is based on a subset of the JavaScript Programming Language and is commonly
    used for transmitting data in web applications between clients and servers.


    ### 8.3.1 JSON Format and Data Types


    JSON is built on two structures:


    - A collection of name/value pairs (often implemented as an object, record, struct,
    dictionary, hash table, keyed list, or associative array).

    - An ordered list of values (often implemented as an array, vector, list, or sequence).


    JSON supports the following data types:


    - strings

    - numbers

    - booleans (`true` and `false`)

    - null

    - objects (collections of name/value pairs)

    - arrays (ordered lists of values)


    Data is structured in key/value pairs where every key is a string, and the value
    can be any of the JSON-supported data types. Strings in JSON must be written in
    double quotes. ![](image_rsrc21A.jpg)


    ### 8.3.2 Parsing JSON with `JSON.parse`


    `JSON.parse` transforms a string of JSON format into a JavaScript object. This
    is especially useful when you receive JSON data as text from a server and need
    to convert it to a JavaScript object for manipulation.


    ### 8.3.3 Stringifying Objects with `JSON.stringify`


    `JSON.stringify` takes a JavaScript object and converts it into a string in JSON
    format. This is particularly useful when you need to send data from the client
    to a server in JSON format.


    ![](image_rsrc21B.jpg)


    ### 8.3.4 Best Practices for Working with JSON Data


    1. Use Valid JSON: Always ensure the JSON data is correctly formatted. Tools and
    online validators can help check your JSON.

    2. Double Quotes: Names and string values should be enclosed in double quotes.

    3. Check for undefined: `JSON.stringify` skips properties with values of `undefined`.
    Be cautious of this when stringifying objects.

    4\. Date Handling: JSON does not have a "date" type. Dates are typically represented
    as strings, and the conversion to and from a JavaScript Date object must be handled
    manually.

    5. Avoid Circular References: Circular references will cause `JSON.stringify`
    to throw an error. If your object contains circular references, you must remove
    them or use a custom replacer function.

    6. Pretty Print for Debugging: When debugging or aiming for readability, you can
    use the third parameter of `JSON.stringify` to pretty-print your JSON.


    Handling JSON data efficiently and according to best practices allows developers
    to seamlessly exchange data between clients and servers, making it a crucial skill
    in modern web development.


    ## 8.4 Advanced Asynchronous Patterns


    Mastering advanced asynchronous patterns in JavaScript is crucial for developing
    complex and efficient web applications. These patterns enable handling multiple
    operations concurrently, iterating over asynchronous operations, and optimizing
    performance for high-frequency events.


    ### 8.4.1 Promises and `Promise.all` for Concurrent Tasks


    Promises are at the heart of modern asynchronous JavaScript, allowing for cleaner
    and more manageable code. When dealing with multiple asynchronous operations that
    need to run concurrently, `Promise.all` comes into play. It takes an iterable
    of promises and returns a single Promise that resolves when all of the promises
    in the iterable have resolved or when the iterable contains no promises.


    ### 8.4.2 Async Iterators and Generators


    Async iterators and generators provide a way to handle asynchronous data streams
    seamlessly. An async generator is a function that can pause its execution while
    waiting for asynchronous actions to complete, yielding results as they become
    available.


    ![](image_rsrc21C.jpg)


    ### 8.4.3 Debouncing and Throttling Asynchronous Operations


    Debouncing and throttling are techniques to control the number of times a function
    can execute, particularly useful in optimizing performance for events that occur
    at a high frequency, such as window resizing, scrolling, or keypress events.


    - Debouncing ensures that the function gets called once after a specified time
    interval has elapsed since the last time it was invoked.

    - Throttling limits the function execution to once every specified time interval,
    regardless of how many times it is called.


    These patterns prevent unnecessary calls to expensive operations and can significantly
    improve performance in web applications.


    ![](image_rsrc21D.jpg)


    ### 8.4.4 Using Web Workers for Non-blocking Background Tasks


    Web Workers provide a simple means for web content to run scripts in background
    threads. Using Web Workers, you can perform intensive computations or data processing
    without blocking the user interface, improving the performance and responsiveness
    of web applications.


    ![](image_rsrc21E.jpg)


    Understanding and applying these advanced asynchronous patterns can significantly
    enhance the performance, usability, and maintainability of web applications, enabling
    developers to build sophisticated features and manage complex data operations
    efficiently.


