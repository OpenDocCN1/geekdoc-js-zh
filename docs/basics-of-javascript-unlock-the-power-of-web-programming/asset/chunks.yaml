    JavaScript classes support encapsulation by integrating data (properties) and
    functions (methods) that operate on data into a single unit called a class. However,
    until recent additions (like private class fields), JavaScript did not directly
    support the hiding of data. This has usually been accomplished using closures
    or the newer private fields syntax.


