    `Async/await` can be viewed as syntactic sugar over `Promises`, designed to simplify
    asynchronous programming even further. It marks the latest evolution in handling
    asynchronous operations in JavaScript, providing a straightforward way to write
    asynchronous code that is both easy to read and write.


    `Async/await` handles `Promises` behind the scenes, eliminating the need for manual
    `.then()` and `.catch()` methods, and reduces boilerplate code, especially when
    dealing with complex asynchronous workflows or when needing to perform multiple
    asynchronous operations in sequence.


    By building on the foundation laid by `Promises` and generators, `async/await`
    has made JavaScript''s asynchronous programming model more accessible and more
    powerful, enabling developers to write clean, efficient, and maintainable asynchronous
    code.


    In conclusion, the continuous evolution of JavaScript''s features for asynchronous
    programming—from callbacks to `Promises`, and from generators to `async/await`—demonstrates
    the language''s adaptability and its commitment to improving developer experience
    and code readability. These features provide developers with the tools needed
    to efficiently handle increasingly complex asynchronous operations in modern web
    development.


    ## The Browser Environment


    ### 10.1 Introduction to the DOM (Document Object Model)


    #### 10.1.1 What is the DOM?


    The Document Object Model (DOM) is a programming interface provided by the browser
    that allows scripts to dynamically access and update the content, structure, and
    style of a webpage. Essentially, the DOM represents the document as a hierarchical
    tree of objects that can be manipulated programmatically. Every element of the
    page is part of this object tree and can be accessed using the DOM API.


    #### 10.1.2 DOM Tree and Nodes


    The DOM organizes a webpage''s structure as a tree of nodes, where each node represents
    a part of the document. This tree includes everything from the root document node
    to individual text nodes:


    - Document Node: The root node that represents the entire HTML document.

    - Element Nodes: Represent HTML elements (`<div>`, `<header>`, `<p>`, etc.) and
    serve as containers for other types of nodes.

    - Text Nodes: Contain the text within HTML elements and are always leaf nodes
    since they cannot contain any other node.

    - Attribute Nodes: No longer considered part of the DOM tree in modern DOM specifications.
    Attributes are now properties of element nodes.


    #### 10.1.3 Accessing the DOM in JavaScript


    Accessing the DOM is typically done using JavaScript, which provides various methods
    to select nodes from the DOM tree:


    - `document.getElementById(id)`: Selects a single element node by its `id` attribute.

    - `document.getElementsByTagName(tagName)`: Returns a live collection of elements
    with the specified tag name.

    - `document.getElementsByClassName(className)`: Returns a live collection of elements
    that have the specified class name.

    - `document.querySelector(selector)`: Returns the first element that matches a
    specified CSS selector.

    - `document.querySelectorAll(selector)`: Returns a `NodeList` of all elements
    matching the specified CSS selector.


    #### 10.1.4 Methods and Properties for DOM Manipulation


    Once a node is selected, the DOM API provides numerous methods and properties
    to manipulate these elements:


    - Changing Element Styles and Classes: Properties like `element.style` and methods
    like `element.classList.add/remove/toggle` allow for controlling CSS styles and
    classes dynamically.

    - Manipulating Element Content: The `innerHTML` and `textContent` properties let
    you get or set the HTML or text content of an element.

    - Creating and Removing Elements: Methods such as `document.createElement(tagName)`
    and `element.removeChild(child)` allow for dynamic addition or removal of nodes
    in the DOM tree.

    - Attributes Manipulation: Methods like `element.setAttribute(name, value)` and
    `element.getAttribute(name)` are used to manage element attributes.

    - Event Handling: Adding event listeners using `element.addEventListener(event,
    handler, [options])` enables you to execute code in response to user interactions.


    Understanding the DOM is crucial for web development because it is the bridge
    between your HTML documents and JavaScript code, allowing dynamic, interactive,
    and responsive web experiences.


    ### 10.2 Selecting and Manipulating DOM Elements


    #### 10.2.1 Using `getElementById`, `getElementsByClassName`, and `getElementsByTagName`


    The DOM provides several methods to select elements from the page, enabling developers
    to easily access and manipulate those elements using JavaScript.


    - `getElementById`: This method retrieves an element by its ID. It is one of the
    fastest and most common ways to select an element.


    ![](image_rsrc22C.jpg)


    - `getElementsByClassName`: This method returns a live `HTMLCollection` of all
    elements that have the specified class name(s).


    ![](image_rsrc22D.jpg)


    - `getElementsByTagName`: It returns a live `HTMLCollection` of elements with
    the given tag name.


    ![](image_rsrc22E.jpg)


    #### 10.2.2 Introduction to Query Selectors


    Query selectors are powerful tools that allow for complex CSS-style selection
    of elements within the DOM. They come in two varieties:


    - `querySelector`: Returns the first element that matches a specified CSS selector.


    ![](image_rsrc22F.jpg)


    - `querySelectorAll`: Returns a static `NodeList` representing a list of elements
    matching the specified group of CSS selectors.


    ![](image_rsrc22G.jpg)


    Query selectors are highly versatile and capable of selecting elements based on
    very sophisticated criteria.


    #### 10.2.3 Manipulating Element Attributes and Properties


    Once an element is selected, you can modify its attributes and properties. Attributes
    are defined directly on an HTML tag, whereas properties are the values on the
    JavaScript object representation of these elements.


    - Setting and Getting Attributes: Use `setAttribute` to set an attribute''s value,
    or `getAttribute` to retrieve it.


    ![](image_rsrc22H.jpg)


    - Modifying Properties: Directly change properties such as `innerHTML`, `textContent`,
    or `style`.


    ![](image_rsrc22J.jpg)


    #### 10.2.4 Creating, Inserting, and Removing Nodes


    The DOM API allows for dynamic content creation and manipulation, giving developers
    the ability to add, replace, or remove elements on the page.


    - Creating New Elements: `createElement()` method creates a new element node.


    ![](image_rsrc22K.jpg)


    - Inserting Elements: `appendChild()` or `insertBefore()` can be used to insert
    created elements into the DOM.


    ![](image_rsrc22M.jpg)


    - Removing Elements: `removeChild()` method removes an element from the DOM. Newer
    approaches include `remove()`, which does not require a parent node reference.


    ![](image_rsrc22N.jpg)


    These techniques and tools provided by the DOM are fundamental to interacting
    with web page elements dynamically, allowing developers to build highly interactive
    and user-friendly websites.


    ### 10.3 Handling Events: Responding to User Input


    #### 10.3.1 Understanding Event Flow: Capturing and Bubbling


    Event flow is the order in which events are received on the web page. There are
    two main phases: capturing phase and bubbling phase.


    - Capturing Phase: When an event occurs, it first moves down the document, from
    the outermost ancestor to the target element. This is the capturing phase. Initially,
    most event handlers are set to react during the bubbling phase, not capturing.

    - Bubbling Phase: After reaching the target element, the event bubbles up again
    to the outermost ancestor. Most events in JavaScript work in the bubbling phase,
    allowing for easier event delegation.


    Using the `addEventListener` method, you can specify whether an event listener
    should occur during the capturing or bubbling phase through the third parameter:


    ![](image_rsrc22P.jpg)


    #### 10.3.2 Adding and Removing Event Listeners

