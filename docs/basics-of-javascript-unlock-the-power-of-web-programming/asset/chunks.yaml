    ### 4.2.3 具名函数与匿名函数


    函数表达式可以是匿名的（如上所示），也可以是具名的。


    具名函数表达式：


    ![](img/image_rsrc1YS.jpg)


    一个关键区别在于调试：具名函数在堆栈跟踪中更容易识别。然而，在函数体内，你可以使用该名称来引用函数本身，例如创建递归调用。


    匿名函数表达式：


    ![](img/image_rsrc1YT.jpg)


    匿名函数很常见，尤其是作为其他函数的参数或在 IIFE 中使用。没有名称简化了语法，但可能使调试更具挑战性。


    ### 4.2.4 函数中的提升


    提升是 JavaScript 的一种机制，其中变量和函数声明会在代码执行前被移动到其包含作用域的顶部。然而，这种行为在函数声明和表达式之间有所不同。


    - 函数声明：完全提升，意味着整个函数被移动到其作用域的顶部，并且可以在源代码中声明之前使用。


    - 函数表达式：变量声明被提升，但函数赋值不会被提升。如果尝试在定义之前调用函数表达式，你会遇到错误，因为该函数尚未定义。


