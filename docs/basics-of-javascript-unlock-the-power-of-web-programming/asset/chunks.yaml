    ordered collections that require key-based access.


    ### 9.5.2 Sets in JavaScript: Unique Collections of Values


    Sets are collections of unique values of any type. They are particularly useful
    when you need to ensure that each item appears only once:


    Sets support operations like union, intersection, and difference through various
    methods, although some of these operations require additional JavaScript logic
    to implement.


    ### 9.5.3 WeakMap and WeakSet: Handling References Lightly


    WeakMap and WeakSet are variants of the Map and Set collections designed for scenarios
    where only weak references to the keys are maintained. This allows items in these
    collections to be garbage-collected if there are no other references to them:


    - WeakMap allows garbage collection for key-value pairs when keys are no longer
    referenced.


    - WeakSet allows the collection''s values to be garbage-collected if they are
    not referenced elsewhere.


    These structures are useful in situations where memory management is a concern,
    such as when dealing with DOM nodes in web applications.


    ![](image_rsrc226.jpg)


    ### 9.5.4 Utilizing Typed Arrays for Binary Data


    Typed Arrays provide an interface for accessing raw binary data more efficiently.
    They are particularly useful when dealing with files, streams, or complex data
    structures that involve numerical data:


    ![](image_rsrc227.jpg)


    Typed Arrays support various data types, such as `Int8`, `Uint8`, `Int16`, `Uint16`,
    `Int32`, `Uint32`, `Float32`, and `Float64`, providing flexibility in handling
    different types of numerical data efficiently.


    These new data structures introduced in ES6 and beyond significantly expand JavaScript''s
    capabilities for handling diverse data types and collections, offering more tools
    and options for developers to write efficient and clean code.


    ## 9.6 Improving Asynchronous Programming in JavaScript


    Asynchronous programming in JavaScript has evolved significantly, particularly
    with the introduction of ES6 and later iterations of the language. This evolution
    has led to cleaner, more readable, and more manageable code when dealing with
    asynchronous operations such as API calls, file operations, or any tasks that
    require waiting for execution to complete. Let''s explore some of the key features
    that have contributed to these improvements.


    ### 9.6.1 Promises and Async/Await: Making Asynchronous Code Cleaner


    Before the introduction of Promises and async/await, asynchronous code in JavaScript
    relied heavily on callbacks, leading to a phenomenon known as "callback hell,"
    where code became nested and difficult to follow. ES6 introduced Promises as a
    solution to this issue, providing a more manageable structure for handling asynchronous
    operations:


    ![](image_rsrc228.jpg)


    Building on Promises, async/await introduced in ES8 (ECMAScript 2017), allows
    for writing asynchronous code that looks and behaves like synchronous code, making
    it even cleaner and easier to understand:


    ![](image_rsrc229.jpg)


    ### 9.6.2 Iterator and Generators: Creating Custom Iterables


    Iterators and generators provide a way for JavaScript objects to define or customize
    their iteration behavior. This is particularly useful in asynchronous programming
    for managing custom data flows. Generators are functions that can be paused and
    resumed, yielding multiple values over time:


    ![](image_rsrc22A.jpg)


    ### 9.6.3 Handling Asynchronous Operations with Generators


    Generators can be combined with Promises to handle asynchronous operations in
    a way that looks synchronous. This pattern was a stepping stone toward the async/await
    syntax, allowing asynchronous execution flow to be paused and resumed:


    ![](image_rsrc22B.jpg)


