    方法中的 `this` 关键字指向该方法的“所有者”。在类的上下文中，`this` 指向类的一个实例（对象）。


    然而，`this` 的值直到方法被调用时才被绑定。如果方法依赖于 `this`，那么将其作为回调传递时可能会导致错误。箭头函数可用于自动将 `this` 绑定到函数定义所在的作用域，而不是使用它的作用域。


    理解这些概念对于在 JavaScript 中有效利用面向对象编程技术至关重要，最终有助于编写更结构化、更易于管理的代码。


    ## 7.2 理解 `this` 关键字


    JavaScript 中的 `this` 关键字是一个强大的特性，一旦理解它，就能极大地增强代码的灵活性和能力。它指向所属的对象，因此是上下文相关的。它的值会根据函数的调用方式而变化。


    ### 7.2.1 全局作用域和函数作用域中的 `this`


    在全局执行上下文（任何函数外部）中，无论是否处于严格模式，`this` 都指向全局对象。在 Web 浏览器中，全局对象是 `window`。


    ![](img/image_rsrc20R.jpg)


    在普通（非箭头）函数中，`this` 在函数被调用时动态设置。在全局作用域或未与任何对象关联的函数内部，非严格模式下 `this` 指向全局对象，严格模式下则为
    `undefined`。


    ![](img/image_rsrc20S.jpg)


    ### 7.2.2 方法和构造函数中的 `this`


    当方法作为对象的属性被调用时，`this` 指向调用该方法的对象。


    在构造函数（旨在与 `new` 关键字一起使用的函数或类）中，`this` 指向新创建的对象实例。


    ![](img/image_rsrc20T.jpg)


    ### 7.2.3 使用 `call`、`apply` 和 `bind` 的 `this`


    `call`、`apply` 和 `bind` 是允许你在调用函数时手动设置 `this` 值的方法。


    - `call()` 允许你以指定的 `this` 值和逐个提供的参数来调用函数。


    - `apply()` 与 `call` 类似，但接受一个参数数组。


    - `bind()` 返回一个新函数，允许你永久设置 `this` 值。


    ### 7.2.4 箭头函数与词法 `this`


    箭头函数没有自己的 `this` 上下文；相反，它们捕获创建时所在封闭作用域的 `this` 值。这被称为词法作用域。


    ![](img/image_rsrc20U.jpg)


    由于箭头函数中 `this` 的词法作用域特性，它们特别适用于回调函数，因为你希望 `this` 指向外部上下文。


    理解 `this` 的行为使得在 JavaScript 中能够进行更灵活的面向对象编程，让开发者能够显式定义并控制代码执行的上下文。


    ## 7.3 构造函数与对象实例


    JavaScript 提供了多种创建对象和实现继承的范式，每种范式都有其细微差别和适用场景。理解这些差异对于编写健壮且可维护的代码至关重要。


    ### 7.3.1 使用构造函数创建对象


    构造函数是 JavaScript 中创建对象的传统方式。这些函数使用 `this` 关键字为对象分配属性，当函数与 `new` 关键字一起调用时，这些属性将被赋予新创建的对象。


    ![](img/image_rsrc20V.jpg)


    ### 7.3.2 `new` 关键字及其作用


    将 `new` 关键字与构造函数一起使用会执行以下操作：


    1. 创建一个新的空对象。

    2. 将构造函数的 `this` 上下文设置为指向新创建的对象。

    3. 执行构造函数体，为新对象添加属性和方法。

    4. 将新对象的原型设置为构造函数的 `prototype` 属性。

    5. 返回新创建的对象（除非构造函数显式返回了另一个非原始对象）。


    ### 7.3.3 工厂函数与构造函数


    与构造函数不同，工厂函数通常不使用 `new` 关键字或 `this`。相反，它们显式创建并返回一个新对象。工厂函数可以提供更灵活的对象创建方式，因为它们可以返回任何对象，并为该对象使用任何原型。


    ![](img/image_rsrc20W.jpg)


    ### 7.3.4 使用 `call` 和 `apply` 实现构造函数继承


    继承可以通过在构造函数中使用 `call` 或 `apply` 方法来实现，允许一个构造函数在其内部调用另一个构造函数，并将上下文（`this`）设置为新创建的对象。


    ![](img/image_rsrc20X.jpg)


    在构造函数中使用 `call` 或 `apply` 提供了一种强大的方式，使一种类型能够继承另一种类型的特性，从而可以模拟其他面向对象编程语言中的经典继承模式。


    理解这些创建对象和实现对象间继承的机制，是有效使用 JavaScript 动态且灵活的对象系统的基础。


    ## 7.4 原型与继承


    JavaScript 采用基于原型的继承模型，这与许多其他语言中基于类的继承截然不同。该模型允许对象从其他对象继承属性和方法。


    ### 7.4.1 理解 JavaScript 中的原型


    在 JavaScript 中，每个函数和对象都有一个名为 `prototype` 的属性，但 `null` 对象除外，它是原型链的终点。当函数作为构造函数与
    `new` 关键字一起使用时，新创建的对象会从构造函数的 `prototype` 继承属性和方法。


    `prototype` 属性是 JavaScript 对象之间相互继承特性的一种机制。例如，JavaScript 数组继承自 `Array.prototype`，这使得所有数组都能使用
    `map`、`filter` 和 `reduce` 等方法。


    ### 7.4.2 原型链与继承


    原型链是对象之间的一系列链接，每个对象都引用其原型父对象。当访问对象的属性或方法时，JavaScript 首先在对象自身中查找。如果找不到，则查找对象的原型，然后是原型的原型，依此类推，直到到达
    `null`。这条链是 JavaScript 中继承的基础。


    例如，假设有一个对象 `O` 继承自 `原型 B`，而 `原型 B` 又继承自 `原型 A`。如果在 `O` 上找不到某个属性，查找会转移到 `B`，如果在
    `B` 上也找不到，则继续到 `A`。


    ### 7.4.3 原型属性的遮蔽


    当添加到对象的属性与对象原型链中的某个属性同名时，就会发生遮蔽。对象上的属性会“遮蔽”原型上的属性，这意味着如果对象自身存在同名属性，则无法通过该对象直接访问原型上的属性。


    这可能很有用，但也需要注意，因为如果不小心遮蔽了原型属性，可能会导致意外行为。


    ```javascript

    function Person() {}

    Person.prototype.name = "Anonymous";


    const person = new Person();

    console.log(person.name); // Anonymous


    person.name = "John"; console.log(person.name); // John - 实例上的属性遮蔽了原型上的属性。

    ```


    ### 7.4.4 原型继承模式


    在 JavaScript 中，有几种使用原型实现继承的模式：


    - 构造函数模式：如前所述，使用构造函数和 `new` 关键字。


    - 原型模式：直接操作构造函数的 `prototype` 以实现继承。


    - `Object.create()`：一种现代方法，可以创建具有指定原型对象和属性的新对象。


    使用 `Object.create()`，可以轻松设置继承：


    ![](img/image_rsrc20Y.jpg)


