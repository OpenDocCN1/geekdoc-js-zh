    ## 在 JavaScript 中处理数据


    ### 2.1 理解 JavaScript 的值与变量


    #### 2.1.1 JavaScript 中的值与变量是什么？


    在 JavaScript 中，值与变量的概念是基础。**值**指的是程序中表示的实际数据，例如数字（如 `5` 或 `2.14`）、字符串（如 `"Hello,
    world!"`）或布尔值（`true` 或 `false`）。本质上，值是我们通过程序操作的数据片段。


    而**变量**是存储值的容器。它们为我们提供了一种用描述性名称标记数据的方式，从而使我们的程序更容易被人类理解，也更容易被计算机操作。例如，与其记住数字 `3.14`
    代表数学常数 Pi，我们可以简单地将它存储在一个名为 `pi` 的变量中。


    #### 2.1.2 值与变量的区别


    理解值与变量的区别对于在 JavaScript 中进行有效编程至关重要。**值**是内存中不可变的数据片段。当我们在程序中使用一个值时，我们直接引用该数据。


    然而，**变量**是对值的可变引用。变量并不“包含”数据，它只是指向内存中的值。当我们开始对变量执行操作或为变量赋予新值时，这种区别就变得重要了。变量所指向的内存位置的内容可以改变，但值本身（例如数字
    `42` 或字符串 `"hello"`）是不可变的。


    #### 2.1.3 在 JavaScript 中声明变量


    JavaScript 提供了三个用于声明变量的关键字：`var`、`let` 和 `const`。


    - `var`：在 ES6（ECMAScript 2015）之前，`var` 是 JavaScript 中声明变量的唯一方式。使用 `var` 声明的变量具有函数作用域，如果在函数外部声明，则具有全局作用域。缺点之一是
    `var` 声明可能因变量提升而导致混淆。


    - `let`：在 ES6 中引入，`let` 允许开发者声明块级作用域的变量，通过将变量的作用域限制在其声明的块内，显著提高了代码的可管理性。


    - `const`：同样在 ES6 中引入，`const` 用于声明旨在成为常量或值不应通过重新赋值改变的变量。与 `let` 一样，`const` 也是块级作用域的。


    要声明一个变量，你需要指定关键字，后跟变量名：`let age = 30;`


    #### 2.1.4 变量命名约定与最佳实践


    在 JavaScript 中命名变量时，需要遵循一些约定和最佳实践：


    - 使用描述性且有意义的名称，清晰表明变量所代表的数据。例如，使用 `userName` 而不是 `str` 或 `n`。


    - 变量名采用驼峰命名法（camelCase）（例如 `userProfile`、`isLoading`）。


    - 对于保存常量值的 `const` 变量，通常使用大写字母加下划线（例如 `MAX_USERS`、`API_KEY`）。


    - 避免使用 JavaScript 保留字（如 `new`、`class`、`function`）作为变量名。


    - 保持名称长度合理。虽然描述性名称很好，但过长的名称可能使代码更难阅读。


    遵循这些约定和最佳实践不仅能让你的代码更易读，还有助于避免一些与 JavaScript 中变量声明和命名相关的常见陷阱。


    ### 2.2 探索数据类型：从数字到字符串


    #### 2.2.1 原始数据类型：概述与用法


    JavaScript 支持多种原始类型，这些基本数据类型构成了代码的基础构建块。包括：


    - **数字**：表示整数和浮点数。

    - **字符串**：表示文本数据。

    - **布尔值**：表示真值（`true`）或假值（`false`）。

    - **`null`**：表示有意缺失任何对象值。

    - **`undefined`**：表示尚未赋值的变量。

    - **符号**：在 ES6 中引入，符号是唯一且不可变的原始值，用作对象属性的键。


    每种原始类型在 JavaScript 应用程序中都有特定用途，从使用布尔值控制流程，到使用数字和字符串表示和操作数据。


    #### 2.2.2 理解数字与数学运算


    在 JavaScript 中，`Number` 类型同时表示整数和浮点数。算术运算如加法（`+`）、减法（`-`）、乘法（`*`）和除法（`/`）可用于构建数字表达式。`Number`
    类型下还存在特殊的数值，包括 `Infinity`、`-Infinity` 和 `NaN`（非数字）。


    数值运算示例：


    ![](img/image_rsrc1X5.jpg)


    JavaScript 还包含 `Math` 对象，它提供了更复杂的数学函数和常量，例如 `Math.sqrt()`（平方根）、`Math.pow()`（幂运算）和
    `Math.PI`（π）。


    #### 2.2.3 处理字符串：创建与操作文本


    JavaScript 中的字符串是用于表示文本的字符序列。它们可以使用单引号（`''`）、双引号（`"`）或反引号（\`\`）定义（模板字面量），模板字面量支持多行字符串和通过
    `${}` 语法嵌入变量。


    字符串操作和方法对于文本处理至关重要，包括：


    - **拼接**：使用 `+` 运算符或 `concat()` 方法组合字符串。

    - **切片**：使用 `slice()` 方法提取字符串的一部分。

    - **长度**：使用 `.length` 属性确定字符串的长度。

    - **替换**：使用 `replace()` 方法将字符串的一部分替换为另一部分。


    字符串操作示例：


    ![](img/image_rsrc1X6.jpg)


    #### 2.2.4 布尔值、Null 和 Undefined：特殊数据类型


    - **布尔值**表示逻辑值，可以是 `true` 或 `false`。它们常用于控制结构（如 `if` 语句）中，以确定程序的流程。

    - **`null`** 是 JavaScript 中的一个特殊值，表示有意的非值。它通常用于表示变量有意不指向任何对象或值。

    - **`undefined`** 是自动分配给已声明但尚未赋值的变量的值。它也可以是未显式返回任何内容的函数的返回值。


    理解这些数据类型及其操作对于在 JavaScript 中有效编程至关重要，因为它们构成了更复杂结构和逻辑的基础。


    ### 2.3 声明变量：`let`、`const` 和 `var`


    #### 2.3.1 `let`、`const` 和 `var` 之间的区别


    - **`var`**：此关键字声明一个变量，并可选择将其初始化为一个值。`var` 声明的变量是函数作用域或全局作用域（如果在函数外部声明）的，并且会受到变量提升的影响（这意味着它们可以在声明之前在代码中被引用）。

    - **`let`**：在 ES6（ECMAScript 2015）中引入，`let` 允许声明块级作用域的变量，与 `var` 相比，显著缩小了变量可见的作用域。使用
    `let` 声明的变量可以更新，但不能在同一作用域内重新声明。

    - **`const`**：同样在 ES6 中引入，`const` 用于声明旨在成为常量或值不应通过重新赋值改变的变量。与 `let` 一样，`const`
    也是块级作用域的。


