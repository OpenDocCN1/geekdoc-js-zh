    asynchronous operations such as API calls, file operations, or any tasks that
    require waiting for execution to complete. Let''s explore some of the key features
    that have contributed to these improvements.


    ### 9.6.1 Promises and Async/Await: Making Asynchronous Code Cleaner


    Before the introduction of Promises and async/await, asynchronous code in JavaScript
    relied heavily on callbacks, leading to a phenomenon known as "callback hell,"
    where code became nested and difficult to follow. ES6 introduced Promises as a
    solution to this issue, providing a more manageable structure for handling asynchronous
    operations:


    ![](image_rsrc228.jpg)


    Building on Promises, async/await introduced in ES8 (ECMAScript 2017), allows
    for writing asynchronous code that looks and behaves like synchronous code, making
    it even cleaner and easier to understand:


    ![](image_rsrc229.jpg)


    ### 9.6.2 Iterator and Generators: Creating Custom Iterables


    Iterators and generators provide a way for JavaScript objects to define or customize
    their iteration behavior. This is particularly useful in asynchronous programming
    for managing custom data flows. Generators are functions that can be paused and
    resumed, yielding multiple values over time:


    ![](image_rsrc22A.jpg)


    ### 9.6.3 Handling Asynchronous Operations with Generators


    Generators can be combined with Promises to handle asynchronous operations in
    a way that looks synchronous. This pattern was a stepping stone toward the async/await
    syntax, allowing asynchronous execution flow to be paused and resumed:


    ![](image_rsrc22B.jpg)


