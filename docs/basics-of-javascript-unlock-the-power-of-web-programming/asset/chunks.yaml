    ### 4.3.2 Arrow Functions and the `this` Keyword


    One of the most beneficial features of arrow functions is how they handle the
    `this` keyword. Unlike traditional functions, the value of `this` inside an arrow
    function is determined by the surrounding (enclosing) lexical context and not
    by how the function is called.


    Example:


    ![](image_rsrc1Z0.jpg)In this example, `this` inside the arrow function correctly
    refers to the `Timer` object because it inherits `this` from the surrounding code.


    ### 4.3.3 Limitations and Features


    While arrow functions have several advantages, they come with limitations:


    - No `new` Keyword: Arrow functions cannot be used as constructors, and attempting
    to do so will result in an error.


    - No `arguments` Object: Arrow functions do not have their own `arguments` object.
    However, you can achieve similar functionality using rest parameters.


    - Cannot Change `this`: The value of `this` is lexically bound, meaning it cannot
    be altered with methods like `call`, `apply`, or `bind`.


    ### 4.3.4 Practical Uses of Arrow Functions


    Arrow functions shine in several scenarios:


    - Callbacks and Higher-Order Functions: They''re perfect for short callback functions
    passed to methods like `.map()`, `.filter()`, and `.reduce()` on arrays.


    ![](image_rsrc1Z1.jpg)


    - Event Handlers: When using arrow functions as event handlers, they preserve
    the lexical `this`.


    ![](image_rsrc1Z2.jpg)


    - Asynchronous Operations: Arrow functions are widely used in promises and asynchronous
    functions.


    ![](image_rsrc1Z3.jpg)


    Understanding when and how to use arrow functions effectively can greatly simplify
    your JavaScript code and help maintain `this` context in asynchronous operations,
    leading to cleaner and more maintainable code.


    ## 4.4 Scope: Understanding Local vs. Global


    Scope is a fundamental concept in JavaScript, determining the accessibility of
    variables and functions in various parts of your code. Understanding scope is
    essential for managing the lifecycle of variables and avoiding conflicts and bugs.


    ### 4.4.1 What is Scope?


    Scope in JavaScript refers to the context in which a variable or function is accessible.
    JavaScript has three main types of scope:


    - Global Scope: Variables defined in the global scope are accessible from any
    part of the code.


    - Function (Local) Scope: Variables defined within a function are only accessible
    within that function.


    - Block Scope: Variables defined inside a block `{}` are only accessible within
    that block. This concept applies when using `let` and `const` keywords.


    ### 4.4.2 Local (Function) Scope vs. Block Scope


    - Function Scope: Variables declared with `var` within a function cannot be accessed
    from outside the function.


    ![](image_rsrc1Z4.jpg)


    - Block Scope: Introduced with ES6, variables declared with `let` and `const`
    are scoped to the nearest enclosing block, not just to function blocks.


