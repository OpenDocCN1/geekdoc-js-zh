    The `this` keyword in a method refers to the "owner" of the method. In the context
    of a class, `this` refers to an instance of the class (an object).


    However, the value of `this` is not bound until a method is called. This can lead
    to errors when passing methods as callbacks if they rely on `this`. Arrow functions
    can be used to automatically bind `this` to the scope of where the function is
    defined, not where it is used.


    Understanding these concepts is crucial for effectively utilizing Object-Oriented
    Programming techniques in JavaScript, ultimately leading to more structured and
    manageable code.


    ## 7.2 Understanding the `this` Keyword


    The `this` keyword in JavaScript is a powerful feature that, when understood,
    greatly enhances the flexibility and capabilities of your code. It refers to the
    object it belongs to, making it context-dependent. Its value can change depending
    on how a function is called.


    ### 7.2.1 `this` in Global and Function Scopes


    In the global execution context (outside of any function), `this` refers to the
    global object whether in strict mode or not. In web browsers, the global object
    is `window`.


    ![](image_rsrc20R.jpg)


    In a regular (non-arrow) function, `this` is set dynamically when the function
    is called. In the global scope or inside a function not associated with any object,
    `this` refers to the global object in non-strict mode and is `undefined` in strict
    mode.


    ![](image_rsrc20S.jpg)


    ### 7.2.2 `this` in Methods and Constructors


    When a method is called as a property of an object, `this` points to the object
    the method is called on.


    In constructors (functions or classes intended to be used with the `new` keyword),
    `this` refers to the newly created object instance.


    ![](image_rsrc20T.jpg)


    ### 7.2.3 `this` with `call`, `apply`, and `bind`


    `call`, `apply`, and `bind` are methods that allow you to set the value of `this`
    manually when invoking a function.


    - `call()` allows you to invoke a function with a specified `this` value and arguments
    provided individually.


    - `apply()` is similar to `call` but takes an array of arguments.


    - `bind()` returns a new function, allowing you to set the `this` value permanently.


    ### 7.2.4 Arrow Functions and Lexical `this`


    Arrow functions do not have their own `this` context; instead, they capture the
    `this` value of the enclosing scope at the time they are created. This is known
    as lexical scoping.


    ![](image_rsrc20U.jpg)


    Because of the lexical scoping of `this` in arrow functions, they are particularly
    useful for callbacks, where you want `this` to refer to the outer context.


    Understanding the behavior of `this` allows for more flexible, object-oriented
    programming in JavaScript, letting developers explicitly define and control the
    context of their code executions.


    ## 7.3 Constructors and Object Instances


    JavaScript provides multiple paradigms to create objects and facilitate inheritance,
    each with its nuances and use cases. Understanding these differences is crucial
    for crafting robust and maintainable code.


    ### 7.3.1 Creating Objects with Constructor Functions


    Constructor functions are a conventional means to create new objects in JavaScript.
    These functions use the `this` keyword to assign properties to the object that
    will be created when the function is invoked with the `new` keyword.


    ![](image_rsrc20V.jpg)


    ### 7.3.2 The `new` Keyword and Its Effects


    Using the `new` keyword with a constructor function does several things:


    1. It creates a new, empty object.

    2. It sets the `this` context of the constructor function to point to the newly
    created object.

    3. It executes the body of the constructor, adding properties and methods to the
    new object.

    4. It sets the prototype of the new object to the constructor function''s `prototype`
    property.

    5. It returns the newly created object (unless the constructor explicitly returns
    a different, non-primitive object).


    ### 7.3.3 Factory Functions vs. Constructors


    Unlike constructor functions, factory functions typically do not use the `new`
    keyword or `this`. Instead, they create and return a new object explicitly. Factory
    functions can offer a more flexible way to create objects, as they can return
    any object and use any prototype for that object.


    ![](image_rsrc20W.jpg)


    ### 7.3.4 Constructor Inheritance with `call` and `apply`


    Inheritance can be implemented in constructors through the use of the `call` or
    `apply` methods, allowing one constructor function to call another constructor
    function within it, setting up the context (`this`) to the newly created object.


    ![](image_rsrc20X.jpg)


    Using `call` or `apply` within constructors provides a powerful method for one
    type to inherit the characteristics of another, making it possible to mimic classical
    inheritance patterns found in other object-oriented programming languages.


    Understanding these mechanisms for creating and inheriting between objects is
    foundational for working effectively with JavaScript''s dynamic and flexible object
    system.


    ## 7.4 Prototypes and Inheritance


    JavaScript employs a prototype-based model for inheritance, a distinct approach
    compared to the class-based inheritance seen in many other languages. This model
    allows objects to inherit properties and methods from other objects.


    ### 7.4.1 Understanding Prototypes in JavaScript


    In JavaScript, every function and object has a property named `prototype`, except
    for the `null` object, which is the end of the prototype chain. When a function
    is used as a constructor with the `new` keyword, the newly created object inherits
    properties and methods from the constructor function''s `prototype`.


    The `prototype` property is a mechanism whereby JavaScript objects inherit features
    from one another. For instance, JavaScript arrays inherit from `Array.prototype`,
    enabling all arrays to utilize methods like `map`, `filter`, and `reduce`.


    ### 7.4.2 Prototype Chain and Inheritance


    The prototype chain is a series of links between objects where each object references
    its prototype parent. When accessing a property or method of an object, JavaScript
    first searches the object itself. If it doesn’t find it, it searches the object’s
    prototype, then the prototype’s prototype, and so on, until it reaches `null`.
    This chain is the foundation of inheritance in JavaScript.


    For example, suppose we have an object `O` that inherits from `Prototype B`, which
    in turn inherits from `Prototype A`. If a property is not found on `O`, the search
    moves to `B`, and if not found on `B`, it continues to `A`.


    ### 7.4.3 Shadowing Prototype Properties


    Shadowing occurs when a property added to an object has the same name as one in
    the object’s prototype chain. The property on the object "shadows" the one on
    the prototype, meaning the prototype’s property won''t be accessed directly through
    the object if a property with the same name exists on the object itself.


    This can be useful, but it''s also something to be aware of, as it can lead to
    unexpected behavior if you accidentally shadow prototypes properties.


    ```javascript

    function Person() {}

    Person.prototype.name = "Anonymous";


    const person = new Person();

    console.log(person.name); // Anonymous


    person.name = "John"; console.log(person.name); // John - The property on the
    instance shadows the prototype''s property.

    ```


    ### 7.4.4 Prototypal Inheritance Patterns


    There are several patterns for implementing inheritance in JavaScript using prototypes:


    - Constructor Pattern: Using constructor functions and the `new` keyword, as mentioned
    earlier.


    - Prototype Pattern: Directly manipulating the `prototype` of constructors for
    inheritance.


    - `Object.create()`: A modern approach where you can create a new object with
    the specified prototype object and properties.


    Using `Object.create()`, you can easily set up inheritance:


