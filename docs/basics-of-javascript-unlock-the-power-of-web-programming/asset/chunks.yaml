    使用 `addEventListener` 方法添加事件监听器很简单。然而，移除事件监听器需要引用被添加的确切函数。


    ![](img/image_rsrc22R.jpg)


    ### 10.3.3 常见 DOM 事件与事件对象属性


    常见的 DOM 事件包括：


    - 鼠标事件：`click`、`dblclick`、`mousedown`、`mouseup`、`mouseover`、`mouseleave`

    - 键盘事件：`keydown`、`keyup`、`keypress`

    - 表单事件：`submit`、`change`、`focus`、`blur`


    每个事件处理程序都会接收一个事件对象，其中包含与事件相关的属性和方法。常见属性包括：


    - `type`：事件类型（例如 `click`）。

    - `target`：触发事件的目标元素。

    - `currentTarget`：事件监听器所附加的元素。

    - `preventDefault()`：阻止与事件关联的默认行为的方法。


    ### 10.3.4 事件处理中的防抖与节流


    防抖和节流是用于控制因某些事件（如滚动、调整大小、按键）而触发的函数执行次数的技术，可提升性能和用户体验。


    - **防抖**：确保触发事件停止触发一段预定时间后，函数才执行。适用于窗口调整大小等只关心最终状态的事件。


    ![](img/image_rsrc22S.jpg)


    - **节流**：确保函数在指定时间间隔内最多被调用一次，无论触发事件触发多少次。适用于滚动等需要限制更新频率的事件。


    ![](img/image_rsrc22T.jpg)


    防抖和节流对于高效处理事件至关重要，可确保 Web 应用保持响应迅速且性能良好。


    ## 10.4 动态创建页面与页面间导航


    ### 10.4.1 动态修改当前文档


    网页的动态修改允许在不重新加载整个页面的情况下添加、删除或更改内容和元素。这可以显著提升用户体验，使 Web 应用感觉更响应、更交互。相关技术包括：


    - 直接操作 DOM 以添加、删除或更改元素。

    - 更改元素的样式和可见性，以动态显示/隐藏内容。

    - 利用模板和框架根据用户操作或数据变化渲染内容。


    JavaScript 与 DOM API 共同提供了实时操作网页内容和结构所需的所有工具。


    ### 10.4.2 使用 History API 进行页面导航


    History API 提供了一种标准方式来操作浏览器历史记录，使开发者能够在 Web 应用中实现复杂的导航机制：


    - `history.pushState()`：向浏览器的会话历史栈中添加一个状态，允许更改地址栏中显示的 URL 而无需重新加载页面。

    - `history.replaceState()`：将会话历史栈中的当前状态替换为新状态，从而允许修改当前 URL 而无需重新加载页面。

    - `window.onpopstate` 事件：当活动历史记录条目发生变化时触发，允许开发者在用户使用浏览器的后退和前进按钮导航时动态更新页面内容。


    这些工具在单页应用中尤其有用，因为用户在导航时页面不会完全重新加载。


    ### 10.4.3 实现单页应用（SPA）基础


    单页应用（SPA）是加载单个 HTML 页面并根据用户与应用的交互动态更新该页面的 Web 应用。SPA 使用 AJAX 和 History API 创建流畅且响应迅速的
    Web 应用，具体方式包括：


    - 异步加载内容并实时更新 DOM，无需页面重新加载。

    - 更改 URL 并维护功能正常的浏览器历史记录，无需完全刷新页面。

    - 仅请求所需的数据（通常为 JSON 格式）并在客户端渲染 UI，从而减少服务器往返次数。


    React、Angular 和 Vue.js 等框架和库常用于高效开发 SPA。


    ### 10.4.4 用于异步页面更新的 AJAX 和 Fetch API


    AJAX（异步 JavaScript 和 XML）和 Fetch API 是允许通过后台与服务器交换少量数据来异步更新网页的技术。


    - **AJAX**：实现网页与服务器之间的异步数据交换，允许在不重新加载整个页面的情况下更新网页部分内容。

    - **Fetch API**：提供基于 Promise 的现代机制，用于发起网络请求和获取资源。它比传统 AJAX 中使用的旧版 `XMLHttpRequest`
    对象更通用、更强大。


    ![](img/image_rsrc22U.jpg)


    这些技术的结合使开发者能够创建动态、用户友好的 Web 应用，无缝加载新内容而无需页面重新加载，从而提升整体用户体验。


    ## 10.5 高级 DOM 操作与优化技术


    创建高性能 Web 应用通常需要高级 DOM 操作和优化技术。这些方法有助于缓解因过度或低效的 DOM 操作而导致的性能瓶颈。


    ### 10.5.1 使用文档片段实现最佳性能


    在插入或操作多个 DOM 元素时，提升性能的一种常见方法是使用**文档片段**。文档片段充当一个轻量级的最小文档对象，可以容纳 DOM 节点。你可以像操作实际
    DOM 一样向其中追加节点，但由于文档片段不属于活动 DOM 树的一部分，修改它不会引起回流或重绘。完成后，你可以将整个片段追加到 DOM 中，仅触发一次回流和重绘周期。


    ![](img/image_rsrc22V.jpg)


    ### 10.5.2 高效处理大型列表和滚动事件


    对于处理大型列表或频繁滚动事件的 Web 应用，**虚拟滚动**或**窗口化**技术有助于保持流畅的性能。这些方法仅加载和渲染用户可见的大型列表子集，并在用户滚动时动态渲染其他项目。React
    Virtualized 或 React Window 等库可帮助在 React 应用中实现这些模式。


    ### 10.5.3 最小化回流与重绘的策略


    回流和重绘会显著影响 Web 应用的性能。以下是一些最小化其影响的策略：


    - **批量 DOM 更新**：尽可能将 DOM 操作分组。使用文档片段进行批量添加或删除。

    - **修改类而非样式**：更改元素的 `className`（从而应用一组新的 CSS 规则）比频繁修改内联样式更高效。

    - **对动画使用 `transform` 和 `opacity`**：更改这些属性不会引起回流，并且可能由合成线程处理。

    - **利用 `will-change` CSS 属性**：向浏览器提示某个元素即将发生变化，使其能够在变化发生前进行优化。


    ### 10.5.4 使用 MutationObserver 观察 DOM 变化


    `MutationObserver` 是一个强大的 API，允许开发者监视 DOM 树的变化。它适用于在 DOM 更新时执行代码，而无需轮询 DOM 或手动绑定更新事件。它可以用于观察元素的添加、删除、属性更改等，对于动态更新
    UI 或根据用户交互触发功能非常有用。


    ![](img/image_rsrc22W.jpg)


    虽然非常有用，但务必谨慎使用 `MutationObserver`，以避免因回调执行过多而导致性能问题。


