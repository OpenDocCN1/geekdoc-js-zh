    Ok : false\n};\n```\n\n- **Good:**\n```javascript\nreturn {\nok : true\n};\n```\n\
    \n### 14. DO use semi-colons at the end of your lines\n\nWhile the use of semi-colons\
    \ at the end of your lines is not TECHNICALLY required, your code will do better\
