  trans: "\n\n当然，想要涵盖每一个技巧来帮助你学习 JavaScript 的最佳实践几乎是不可能的。相反，我们希望将重点放在你学习编码时会遇到的主要属性上。在接下来的章节中，我们将为你提供一些较简单的最佳实践，帮助你走上正确的道路。请记住，关于编码，总有更多的信息需要学习。\n\
    \n这是一个极佳的开始！\n\n- **不要**声明布尔值对象、字符串或数字\n- **要**初始化任何变量\n- **不要**使用 `newObject()`\n\
    - **要**使用参数默认值\n- **不要**使用自动类型转换\n- **要**使用 \"Timer\" 优化代码\n- **不要**向 \"SetTimeOut\"\
    \ 或 \"SetInterval\" 传递字符串\n- **要**使用 \"For-in\" 语句\n- **不要**使用 \"With\" 语句\n\n\
    ## 1. 不要声明布尔值对象、字符串或数字\n\n在编写代码时，将你的布尔值、字符串和数字视为原始值是非常重要的。你不希望将它们视为对象。如果你将这些代码中的任何一个定义为对象可能会可能会糟糕的副作用，并减慢你的执行速度。\n\
    \n这里有一个简单的例子：\n\n```\nvar x= \"Joe\";\nvar y= new String (\"Joe\");\n(x ===y)\n\
    ```\n\n- 如你所见，这将为 false，因为 `x` 是字符串而 `y` 是对象。它会抛出一个错误，这是你可以避免的！\n\n## 2. 初始化任何变量\n\
    \n无论你是在学习编码，还是只想提高技能，在声明变量时初始化它们都是非常好的习惯。这样做可以帮助避免未定义值（undefined），提供一个单一的操作位置，并帮助你获得更整洁的代码。\n\
    \n## 3. 不要使用 `newObject()`\n\n虽然我们之前稍微提到这一点，但记住它是重要的。这里有一份快速参考表，帮助你记住应该使用哪些代码与其相似代码。通过良好的组织，你可以保持代码的整洁。\n\
    \n- **要使用**： `{}` **不要使用**：`new Object()`\n- **要使用**：`0` **不要使用**：`new Number()`\n\
    - **要使用**： `\" \"` **不要使用**：`new String()`\n- **要使用**：`false` **不要使用**：`new Boolean()`\n\
    - **要使用**：`function () {}` **不要使用**：`new Function()`\n- **要使用**：`/()/` **不要使用**：`new\
    \ RegExp()`\n- **要使用**：`[]` **不要使用**：`new Array()`\n\n## 4. 使用参数默认值\n\n我们邀请你花一点时间问问自己：关于函数我记得什么？当你的函数缺少参数时，你称它为什么什么？没错！那个缺失参数的值被称为\
    \ `undefined`。如果你以前没有意识到这一点，这些 `undefined` 值可以并且将会破坏你的代码。为了打破这个习惯，请尽力自动为你的参数赋值。\n\
    \n这里有一个例子：\n\n```\nfunction myFunction (x, y) {\n  if ( x === undefined) {\n \
    \   x= 1;\n  }\n}\n```\n\n## 5. 不要使用自动类型转换\n\n在编写代码时，你想要意识到可能被转换为 `NaN` 或字符串的数字。如果你需要复习，`NaN`\
    \ 代表 \"Not a Number”（不是数字）。由于 JavaScript 是弱类型语言，这种情况可能会自动发生。你代码中的变量可以改变数据类型，也可以包含几种不同类型的数据。\n\
    \n这里有一个简单的例子：\n\n```\nvar x = \"Hey\";\n```\n\n- 在这种情况下，`x` 是字符串，但如果你继续：`x= 4;`\n\
    - 那么，这将你的 `x` 变为数字。你可以看到这可能在你的代码中引起错误。\n\n你还应该意识到，如果你在做数学题，JavaScript 会将数字转换为字符串。如果你输入方式不对，它会给你一个答案，但可能不是你想要的那个。这里有一个简单的例子：\n\
    \n- 在这个例子中，`typeof x` 将是一个数字\n```\nvar x = 5+ 7; // x.valueOf() 将为 12\n```\n\n\
    - 在下一个例子中，`typeof x` 将是一个字符串\n```\nvar x = 5+ \"7\"; // x.valueOf() 将为 57\n```\n\
    \n在另一种情况下，你可以尝试使用你的函数从一个字符串中减去另一个字符串。在这种情况下，它将返回 `NaN`。\n\n使用这个例子：\n\n```\n\"\
    Goodbye\" – \"Love\" // 这将返回 NaN\n```\n\n## 6. 使用 \"Timer\" 优化代码\n\n这种实践非常简单。是否曾经你需要一种快速的方法来准确确定你的操作将需要多长时间？幸运的是，Firebug\
    \ 有一个 \"timer\" 功能，可以为你记录结果！有时，掌握一些小技巧对你的编码有所帮助。\n\n这是该功能的代码：\n\n```\nfunction\
    \ TimeTracker () {\n  console.time (\"MyTimer\");\n  for (x=4000; x > 0; x--)\
    \ {}\n  console.timeEnd (\"MyTimer\");\n}\n```\n\n## 7. 不要向 \"SetTimeOut\" 或 \"\
    SetInterval\" 传递字符串\n\n记得我们告诉过你不要使用 `eval` 函数吗？这段代码的功能相同。这就是为什么我们建议永远不要向 `SetTimeOut`\
    \ 或 `SetInterval` 传递字符串。遗憾的是，这段代码的效率极低。\n\n而不是这段代码：\n\n```\nsetInterval (\n  \"\
    document.getElementById('container').innerHTML+= 'The New: 2000\n```\n\n使用这一个：\n\
    \n```\nsetInterval(someFunction);\n```\n\n## 8. 使用 \"For in\" 语句\n\n有时当你遍历对象中的项时，你可能注意到通过这种方式可以包装你的代码。这种方式可以过滤你的信息。\n\
    \n这里有一个例子：\n\n```\nfor (key in object) {\n  if(object.hasOwnProperty(key)) {\n\
    \    //做一些操作\n  }\n}\n```\n\n## 9. 不要使用 \"With\" 语句\n\n现在，这个编码技巧是有争议的。一方面，\"with\"\
    \ 语句听起来像是访问代码中深层嵌套任何对象的简便方法。\n\n这里有一个例子：\n\n```\nwith (person.bodyparts) {\n \
    \ hand = true;\n  foot= true;\n}\n```\n\n- 正如我们所提到的，你应该使用这些代替：\n`person.bodyparts.hand=\
    \ true;`\n`person.bodyparts.foot= true;`\n\n经过一些测试，发现这些代码表现糟糕，特别是在设置时。与其使用 \"\
    with\"，你可以使用 `var` 并获得正确的结果。\n\n## 结论\n\n我们就这里！我们希望在书的这里你对自己的编码技能感觉更好、更有信心。\n\n\
    诚然，有时会有挑战，但通过足够的练习，你会变得更好！记住，我们在书中包含的示例只是一角。改进编码的方法有很多，继续努力吧。\n\n这本书提供了许多关于将最佳实践应用于\
    \ JavaScript 编程代码的话题。为了获得更优质、更高效的代码，意识到这一点是非常重要的。\n\n在第一章中，我们回顾了一些常见的错误。我们希望你理解这些可能破坏你代码的简单错误。之后，我们回顾了一些关于实践更好编码的通用建议。我们涵盖了关于提高性能的最佳实践，以及关于注释和日志的最佳实践。最后，我们为初学者讨论了一些实用技巧。\n\
    \n我们希望你获得很多价值的信息。\n\n祝你的编码之旅好运连！！\n\n## 关于作者\n\nCharlie Masterson 是一位计算机程序员和讲师，开发过多个应用程序和计算机程序。\n\
    \n作为一名计算机科学学生，他早期对编程感兴趣，但学习非常复杂的话题感到沮丧。\n\nCharlie 需要一种可以轻松学习的方法。他很快发现了一系列让他学得更快更好的教学系列。通过同样的方法，Charlie\
    \ 成功地学习了不同的编程语言，现在通过写作教授这些主题。\n\n通过他编写的计算机编程书籍，他希望为对计算机主题感兴趣的读者提供巨大的价值。\n\n"
