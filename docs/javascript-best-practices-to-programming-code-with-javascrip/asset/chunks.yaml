  trans: "\n\n- 为了修复这个错误，你将希望始终使用分号和括号。这样，你的代码会更易读，你不会被换行所困扰，而且当你移动代码时，永远不需要担心你的初始语句是否闭合。\n\
    - 如果你有多余的逗号，请记住最后一个属性不应该以逗号结尾。虽然某些浏览器（如 Firefox）不会被多余的逗号困扰，但 Internet explorer\
    \ 则会。在编写代码时，请记住防患未缪于于医！\n\n## 条件语句 (Conditional Statements)\n\n在编写代码时，有三种常见的条件语句错误。以下是其中一些：\n\
    \n1. 在编写代码时，尽量不要因使用赋值运算符而产生困扰。当你这样做时，你实际上是在将第二个参数的值传递给第一个参数。显然，这会导致逻辑问题。当这种情况发生时，如果\
    \ `var2` 中的值不为零，它将返回 true 而不会抛出错误。\n\n示例：\n\n```javascript\nif(var1 = var2) {}\n\
    ```\n\n* 这将返回 true 或 false，取决于 `var2` 的值。它将 `var2` 赋值给 `var1`。你必须小心，以防这并非你的本意！\n\
    \n2. 记住你所有的条件注释都必须在括号内。这似乎是一个简单的错误。然而，你会惊讶于发现它是多么常见！\n\n示例：\n\n```javascript\n\
    if(var1 == var2) {}\n```\n\n3. 对于大多数情况，JavaScript 是弱类型的。但在切换 `switch` 语句时，事实并非如此。当你使用\
    \ `case` 比较时，你的 JavaScript 将不是弱类型。\n\n示例：\n\n```javascript\nvar myVar = 1;\n\n\
    if(myVar == '1') {\nalert (\"hey\");\n}\n\nswitch(myVar) {\ncase '1' :\nalert(\"\
    hey\");\n```\n\n* 在第一行中，你的代码将返回 true，因为 JavaScript 是弱类型的。\n* 至于第三行中的 alert，它会显示，因为大多数时候，JavaScript\
    \ 不关心数据类型。\n* 在最后一行，你的 alert 将不会显示，因为你的数据类型不匹配。\n* 但是，如果你想让 JavaScript 也检查数据类型，而不是使用两个等号，你应该使用三个等号\
    \ (===)。在这种情况下，将不会触发 alert：\n\n```javascript\nvar myVar = 1;\n\nif(myVar === '1')\
    \ {\nalert (\"hey\");\n}\n```\n\n## 变量作用域 (Variable Scope)\n\n并不意外，有很多问题可能源于变量作用域。其中一些问题包括在函数内部从局部变量覆盖全局变量，甚至错误地认为局部变量是全局变量。正如你稍后将学到的，最好根本不要使用任何全局变量。如果你无法避免它们，至少要知道如何避免它们。\n\
    \n当你有全局变量时，记住它们不会通过典型的 `var` 关键字声明。相反，你必须使用特定的术语来声明变量，以防止它们具有全局作用域。这里有一个变量在声明函数后并获得全局作用域的示例：\n\
    \nCODE:\n\n```javascript\nanonymousFunction1 = function(){\nglobalvar= 'global\
    \ scope';\nreturn globalvar;\n} ();\n\nalert(globalvar);\n```\n\n* 在这段代码中，缺少了\
    \ \"var\"，当这种情况发生时，它会在全局声明。\n\nCODE:\n\n```javascript\nanonymousFunction2 = function(){\n\
    var localvar = 'local scope' ;\nreturn localvar;\n} ();\n\nalert(localvar);\n\
    ```\n\n* 在这段代码中，有一个局部声明的 \"var\"。\n* 最后，将出现 \"localvar is not defined.\" 的错误。如你所示，这是因为没有全局定义的\
    \ localvar。\n\n## HTML id 冲突 (HTML id Conflicts)\n\n这个小错误更多是关于 CSS 的最佳实践，但有时当你遇到\
    \ JavaScript 问题时，它可能会有所帮助。HTML id 允许 JavaScript 进行 DOM 绑定以实现索引。正如你记得的，属性和函数在你的代码中共享同一个命名空间。所以，如果你的属性和函数恰好同名，你可能会创建一个逻辑错误。这些错误很难追踪！当你使用\
    \ JavaScript 编写代码时，我们建议避免使用与 ID 值相同的变量名。此外，如果你在标记 HTML，请尽量不要使用属性名作为值。这有助于避免混淆。\n\
    \n这是一个示例：\n\nCODE:\n\n```javascript\nvar listitems= document.getElementsByTagName('a');\n\
    var aCount= listitems.length;\n```\n\n* 如果你恰好有一个 `<a id=\"length\">`，它有时返回 `<a>`\
    \ 而不是你请求的计数。这就是为什么记住这个小贴士非常重要。\n\n## 字符串替换 (String Replace)\n\n这种字符串替换在代码世界中是另一个非常常见的错误。你可能犯了假设你的字符串\
    \ `replace` 方法行为的错误。当你做出假设时，可能会影响你所有可能的匹配项。如果你之前没有意识到，JavaScript 只会更改字符串中 `replace`\
    \ 方法的第一个出现处。如果你想替换所有出现处，需要你先设置一个全局修饰符（modifier）。\n\n这是一个很好的例子：\n\nCODE:\n\n```javascript\n\
    var myString = \"the string were talking about\";\nmyString= myString.replace(/\
    \ /, \"%10\"); //\n\"the%10string were talking about\"\n\nmyString = myString.replace(/\
    \ /g,\"%10\"); //\n\"the%10string%10were%10talking%10about\"\n```\n\n‘this’\n\n\
    如果你习惯使用 JavaScript 编写代码，你可能犯了忘记使用 `this` 的错误。如果这让你感到陌生，JavaScript 中的函数是作为对象属性访问的。当你未能使用\
    \ `this` 标识符时，可能会丢失。\n\n这是一个错误的示例：\n\n```javascript\nfunction myFunction () {\n\
    var myObject = {\nobjProperty: \" the text you are using\",\nobjMethod: function\
    \ () {\nalert (objProperty);\n}\n};\nmyObject. objMethod ();\n}\n```\n\n这是使用 `this`\
    \ 的正确代码：\n\n```javascript\nfunction myFunction () {\nvar myObject = {\nobjProperty:\
    \ \" the text you are using\",\nobjMethod: function () {\nalert (this.objProperty);\n\
    }\n};\nmyObject. objMethod ();\n}\n```\n\n## 参数缺失 (Missing Parameter)\n\n在编写代码时，记住你将希望更新所有的函数调用。这种情况发生在为函数添加参数时。有时，人们忽略这一点并导致一些简单的错误。记住，如果你确实需要为特殊情况添加参数，你必须先为参数设置一个默认值。这样，你就不会错过任何脚本中的调用更新。\n\
    \n这是一个示例：\n\n```javascript\nfunction addressFunction ( city, state, country){\n\
    Country = country || \"London\" ;\n}\n```\n\n## 函数覆盖/重载 (Overwriting/ Overloading\
    \ Functions)\n\n在编写代码时，如果你多次声明同一个函数，对该函数的最后声明将覆盖之前的任何函数。这可能很难，因为它不会给你任何警告或错误提示。在\
    \ JavaScript 中没有重载。这就是为什么在代码中避免任何 JavaScript 核心名称很重要。你还应该希望避免过度包含 JavaScript 文件。如果发生这种情况，它可能会覆盖另一个脚本中的相同函数。相反，我们建议使用命名空间和函数，这里有一个示例：\n\
    \nCODE:\n\n```javascript\n// 创建命名空间\n// 如果命名空间不存在，则创建它。\nif (!window.THENAMESPACE)\
    \ {\nwindow [ 'THENAMESPACE' ] = {}; }\n\n// 注意此函数在匿名函数内部可见\nfunction myFunction\
    \ (var1, var2){\n//局部函数代码将在这里 }\n\n/* 这将局部函数附加到你的命名空间中。这意味着它在外部使用命名空间时是可以访问的*/\n\
    window['THENAMESPACE']['myFunction'] = myFunction;\n\n};\n\n// 注意括号将开启一个立即执行 //\n\
    ```\n\n* 是括号包含了使你的匿名函数生效的代码。\n\n 正确使用 ‘For Each’ (Using ‘For Each’ Correctly)\n\
    \n"
- fmt: "\nAs you will recall, JavaScript uses the `\"for\"` loop for your object attributes,\
    \ properties, and methods. It uses the code to loop all your property names in\
    \ an object. This loop will also include the functions and properties that you\
    \ are not interested in having in your code. If you filter out these values, you\
    \ will want to use the `hasOwnProperty` or the `typeof` function. While coding,\
    \ we suggest staying away from the `each`; the only time you will want to use\
    \ `each` is when you want to iterate methods and object properties.\n\nHere are\
    \ a few tips when coding:\n\n- `for (var myVar in myObject)` The code from above\
    \ is meant to iterate a specific variable in the properties of a specific object.\
    \ This will not matter what order it is in. The `for…in` loop will not iterate\
    \ the built-in properties.\n- `for (var i=0; i <myArray.length; i++)` This code\
    \ should be used for all elements of your array. It will iterate thru all of the\
    \ above.\n- `for each (var myVar in myObject)` This code is meant for specific\
    \ variables in all of your object’s properties.\n- If you wish to solve this issue,\
    \ you will want to use the `for…in` if you are using it for objects. When you\
    \ want to loop your array, just use `for`. Here is an example:\n\n```javascript\n\
    listItems=document.getElementsByTagName('La');\n\nfor each (var listitem in listItems){\n\
    \n}\n```\n- Note: The code from above will go thru all of the methods of the object\
    \ and all of the properties.\n- This will include any native properties and methods.\
    \ Please also note that it will not go thru the array. Instead, it will throw\
    \ an error.\n- Due to the fact that there is the array of objects that you will\
    \ want to look thru. Use the `for` loop such as followed:\n```javascript\nfor\
    \ ( var i = 1; i <listItems.length; i++) {\n\n}\n```\n\n## Function Location\n\
    \nWhen you are using JavaScript to code, remember that there are two ways that\
    \ you are able to declare the function. First, you will declare a function if\
    \ you want to form a variable assignment. When you do this, the location of the\
    \ function will not matter.\n\nHere is a simple example:\n\n```javascript\nvar\
    \ myFunction = function (arg1, arg2){\n\n// You can put any code here, again,\
    \ it doesn’t matter\n\n};\n```\n\n- When the function is declared as `function\
    \ myFunction (arg1, arg2) {}`, this means that it can be used in your file, no\
    \ matter where it is. This is both before and after your function has been declared.\
    \ However, if your function happens to be declared with a variable assignment,\
    \ it can only be used by code that will execute this assignment according to its\
    \ function.\n\n## Undefined and Null\n\nGoing back to basic coding 101, it is\
    \ important that you understand these terms are not one the same! In case you\
    \ forgot, `null` is used for an object in your code. `Undefined` will be used\
    \ for the variables, methods, and the properties in your code. In order to be\
    \ `null`, the object in question will need to be defined. If it is not, you can\
    \ test to see if it is `null`. When an object is not defined, it cannot be tested\
    \ and will throw an error. Here is an example:\n\n```javascript\nif (myObject\
    \ ! == null && typeof(myObject) ! =='undefined') {\n}\n```\n- Note: if `myObject`\
    \ happens to be `undefined`, remember that it cannot be tested for `null`. Instead,\
    \ it will throw an error.\n\n```javascript\nif (typeof (myObject) ! == 'undefined'\
    \ && myObject !== null) {\n}\n```\n- Note: This code will be in charge of handling\
    \ `myObject`.\n\n## Statement Switching\n\nWhen you are using the `switch` statement\
    \ in JavaScript, there are a few things you need to recognize. First, remember\
    \ that there is no datatype conversion. Instead, there is match, and at this points,\
    \ all of expressions are going to be executed until there is either a `return`\
    \ statement or a `break` statement. In this case, you can include multiple cases\
    \ in your code in a single block! Remember as stated earlier in the chapter, your\
    \ Data Type is going to be important. In comparisons, JavaScript is loosely typed.\
    \ Statements are something you will need to pay attention to. We will go over\
    \ this practice in later chapters. Be sure to stick around and learn as much you\
    \ can.\n\n## Chapter 2: General Recommendations\n\nWhile you are reading through\
    \ this book, we want it as a learning tool. Essentially, we wish for you to also\
    \ use this as a quick guide. Below, we will list a general recommendation checklist\
    \ for you to peek at while you are in the middle of coding. Remember that everyone\
    \ is going to make mistakes. When you are learning to code, it is like learning\
    \ a new language. This important factor is to catch your mistakes, then try to\
    \ make them little possible. Here is your checklist:\n\n- DO NOT persist password\
    \ locally\n- DO NOT use hard code usernames (or passwords) in your client processed\
    \ codes\n- DO NOT use hard code strings in a program template or code\n- DO NOT\
    \ test for variables against the strings for any triggered events\n- DO NOT use\
    \ hyphens when naming a variable\n- DO NOT leave a `\"debugger\"` statement in\
    \ your code\n- DO NOT use the function `eval()`\n- DO NOT EVER use Global Variables\n\
    - DO NOT leave any dangling commas, especially in object definitions and lists\n\
    - DO define all of your local vars at the TOP of your function\n- DO use `===`\
    \ explicit comparators\n- DO use shortcuts for your value assignment\n- DO place\
    \ braces on the right side of your block definitions\n- DO use semi-colons at\
    \ the end of your lines\n- DO follow naming conventions for your functions and\
    \ variables\n- DO use double quotes for your NLS’d Strings\n\n### 1. DO NOT persist\
    \ password locally\nAs you could imagine, if you store any passwords in your code,\
    \ this could create some security holes. These are aspects you will want to avoid\
    \ at all costs. The last thing you will want to do is be exploited by an attacker\
    \ because you made a simple mistake. In any case, we suggest never persisting\
    \ your passwords in `sessionStorage`, `Cookies`, or even `localStorage`. Instead,\
    \ allow the user to get the password through normal mechanisms such as the browser.\
    \ Just avoid putting it in code at all costs.\n\n### 2. DO NOT use hard code usernames\
    \ (or passwords) in your client processed codes\nAgain, this is an easy way to\
    \ create security holes. To some coders, this could make you just a lazy coder!\
    \ Even if your code is just a test or a simple demo, never use your username and\
    \ password in the code. You just never know who could get hands on the code. The\
    \ internet is a very wide world.\n\n### 3. DO NOT use hard code strings in a program\
    \ template or code\nWhen you are coding, you should just always assume that your\
    \ code is going to be translated. If you want to avoid being lazy, at least create\
    \ a map for the key values of your strings.\n\nHere is a simple example:\n\n```javascript\n\
    this.Text = {\n    \"greeting\" : \"Hello\",\n    \"firstName\" ; \"First name\"\
    ,\n};\n```\n\n### 4. DO NOT test for variables against the strings for any triggered\
    \ events\nRemember that while you are condition checking in your code, these checks\
    \ should be made against the variables or the reference node that is meant to\
    \ trigger an event. We suggest not doing these checks against multilingual values.\
    \ If you do this, it could help reduce the chance of throwing an error. By doing\
    \ this, it will also help improve the maintainability of the code. When you are\
    \ careful, the code will clearly show the actual conditions for the given action\
    \ in the code. Here is an incorrect example followed by a better example:\n\n\
    **Incorrect Example:**\n```javascript\nif acct.type.match(/^A LINE OF CREDIT.*/)\
    \ ||\nacct.type.match (/LINEA DE CREDITO.*/) ) {\n```\n\n**Correct Example:**\n\
    ```javascript\nif (acct.type === this.acct.TYPES.credit) {\n```\n"
