  trans: "\n\n正如你所记得，JavaScript 使用 `\"for\"` 循环来处理你的对象属性、属性和方法。它使用代码来遍历对象中的所有属性名。此循环也会包含你并不希望出现在代码中的某些函数和属性。如果你想过滤掉这些值，你可能需要使用\
    \ `hasOwnProperty` 或 `typeof` 函数。在编码时，我们建议避免使用 `each`；你唯一想要使用 `each` 的时机是你想要遍历方法和对象属性时。\n\
    \n以下是编码时的几点提示：\n\n- `for (var myVar in myObject)` 上述代码用于遍历特定对象属性中的特定变量。这与属性的顺序无关。`for…in`\
    \ 循环不会迭代内置内置属性。\n- `for (var i=0; i <myArray.length; i++)` 这段代码应用于你数组的所有元素。它将遍历上述所有元素。\n\
    - `for each (var myVar in myObject)` 这段代码用于你对象所有属性中的特定变量。\n- 如果你想解决这个问题，在用于对象时，你将需要使用\
    \ `for…in`。当你想要循环数组时，只需使用 `for` 即可。这是一个示例：\n\n```javascript\nlistItems=document.getElementsByTagName('La');\n\
    \nfor each (var listitem in listItems){\n\n}\n```\n- 注意：上述代码将遍历对象的所有方法和所有属性。\n\
    - 这包括任何原生属性和方法。请注意，它不会遍历数组。相反，它会抛出错误。\n- 由于存在一个你想要查看的对象数组，请如下使用 `for` 循环：\n```javascript\n\
    for ( var i = 1; i <listItems.length; i++) {\n\n}\n```\n\n## 函数位置 (Function Location)\n\
    \n当你使用 JavaScript 编码时，请记住你有两种声明函数的方法。首先，如果你想进行变量赋值，则会声明一个函数。当你这样做时，函数的位置并不重要。\n\
    \n这是一个简单的示例：\n\n```javascript\nvar myFunction = function (arg1, arg2){\n\n// 你可以在这里放置任何代码，同样，这并不重要\n\
    \n};\n```\n\n- 当函数声明为 `function myFunction (arg1, arg2) {}` 时，这意味着它可以被你的文件使用，无论位置在哪里。这在函数声明之前之后都可以。但是，如果你的函数恰好是通过变量赋值声明的，那么它只能由根据其函数执行该赋值的代码使用。\n\
    \n## 未定义与空 (Undefined and Null)\n\n回到基础编码 101，理解这些术语并不是同一个非常重要！万你忘记了，`null` 用于你代码中的对象。`Undefined`\
    \ 将用于你代码中的变量、方法和属性。为了成为 `null`，所讨论的对象需要被定义。如果未定义，你可以测试它是否为 `null`。当对象未定义时，它无法被测试并会抛出错误。这是一个示例：\n\
    \n```javascript\nif (myObject ! == null && typeof(myObject) ! =='undefined') {\n\
    }\n```\n- 注意：如果 `myObject` 恰好是 `undefined`，记住它不能被测试为 `null`。相反，它会抛出错误。\n\n```javascript\n\
    if (typeof (myObject) ! == 'undefined' && myObject !== null) {\n}\n```\n- 注意：这段代码负责处理\
    \ `myObject`。\n\n## 语句切换 (Statement Switching)\n\n在 JavaScript 中使用 `switch` 语句时，有几点你需要识别。首先，记住没有数据类型转换。相反，是匹配，在此时，所有的表达式都将被执行，直到遇到\
    \ `return` 语句或 `break` 语句。在这种情况下，你可以在代码的单个块中包含多个情况！记住正如本章节前面提到的，你的数据类型将非常重要。在比较中，JavaScript\
    \ 是弱类型的。语句是你需要注意的内容。我们将在后面的章节中讨论这一实践。请务必继续留下来并尽可能多学习。\n\n## 第 2 章：通用建议 (Chapter\
    \ 2: General Recommendations)\n\n当你阅读这本书时，我们希望它成为一个学习工具。本质上说，我们希望你也能将其作为一个快速指南。下面，我们将为你列出一份通用建议清单，供你在编码过程中查看。请记住，每个人都会出错。当你学习编码时，就像学习一门新语言。这个重要因素是发现你的错误，然后尝试让这些错误尽可能少发生。以下是你的清单：\n\
    \n- 不要在本地持久化密码\n- 不要在你的客户端处理代码中使用硬编码的用户名（或密码）\n- 不要在程序模板或代码中使用硬编码字符串\n- 不要针对任何触发的事件中对变量与字符串进行比对测试\n\
    - 不要在命名变量时使用连字符\n- 不要在代码中留下 `\"debugger\"` 语句\n- 不要使用函数 `eval()`\n- 永远不要使用全局变量\n\
    - 不要留下任何悬挂的逗号，特别是在对象定义和列表中\n- 请在函数的**顶部**定义你所有的局部变量\n- 使用 `===` 显式比较运算符\n- 为你的值赋值使用快捷方式\n\
    - 将大括号放在块定义的右侧\n- 在行末尾使用分号\n- 遵循你的函数和变量的命名规范\n- 为你的多语言字符串使用双引号\n\n### 1. 不要在本地持久化密码\
    \ (DO NOT persist password locally)\n正如你想象的，如果你在代码中存储任何密码，可能会创建安全漏洞。这些是你希望尽力避免的方面。你最不想的就是因为犯了简单的错误而被攻击者利用。任何情况下，我们建议不要在\
    \ `sessionStorage`、`Cookies` 甚至 `localStorage` 中持久化密码。相反，允许用户通过正常机制获取密码。只需避免将其放入代码中。\n\
    \n### 2. 不要在客户端处理代码中使用硬编码的用户名（或密码）（DO NOT use hard code usernames (or passwords)\
    \ in your client processed codes)\n再次，这是一种创建安全漏洞的简单方法。对于某些编码员来说，这可能会让你成为一个懒惰的程序员！即使你的代码只是测试或简单的演示，也不要在代码中使用你的用户名和密码。你永远不知道谁会拿到代码。互联网是一个非常广的世界。\n\
    \n### 3. 不要在程序模板或代码中使用硬编码字符串（DO NOT use hard code strings in a program template\
    \ or code）\n当你编码时，你应该始终假设你的代码将被翻译。如果你想避免偷懒，至少为你的字符串的键值创建一个映射。\n\n这是一个简单的示例：\n\n\
    ```javascript\nthis.Text = {\n    \"greeting\" : \"Hello\",\n    \"firstName\"\
    \ ; \"First name\",\n};\n```\n\n"
- fmt: "\n- While you are coding, be sure to be aware of your patterns. Some have\
    \ made the mistake of checking the `target.label` of an event to determine whether\
    \ or not it is a source button. Instead, we suggest using an `\"class\"` or `\"\
    id\"` identifier. This way, it will not break an application if it gets translated.\n\
    \n### 5. DO NOT use hyphens when naming a variable\n\nCoding can be difficult;\
    \ this is why we suggest not using hyphens in a variable name. if this happens,\
    \ it could be confused as an attempt at subtraction. For example:\n\n```javascript\n\
    var hello-name = \"Welcome\";\n```\n\n- The way this code is set up, it will try\
    \ to take the name away from the world. Obviously, this will throw an error.\n\
    \n### 6. DO NOT leave a \"debugger\" statement in your code\n\nAs a reminder,\
    \ a `\"debugger\"` statement is used to force your browser to a breakpoint during\
    \ any testing. This is the code that helps most developers to locate the bugs\
    \ quickly and efficiently. However, it could build other failures if it is accidently\
    \ left in the code. Instead, we suggest manually setting up a breakpoint by using\
    \ a browser tool instead. This could save you the time and hassle at the end of\
    \ the day.\n\n### 7. DO NOT use the function \"eval()\"\n\nThere is a saying that\
    \ some developers use that is known as \"eval is evil.\" This should be an easy\
    \ way to remember that you should rarely use `eval`, if ever. This code is a very\
    \ easy way to make bad things happen in your code. Unless you truly know what\
    \ you are doing with code, the source needs always to be trusted. If not, it could\
    \ lead to vulnerabilities in your code. As you learned earlier, this is something\
    \ you want to avoid at all costs!\n\n### 8. DO NOT EVER use Global Variables\n\
    \nThis is something we will say over and over again. When you are defining local\
    \ variables, always use the `var` statement. If not, the variable will be placed\
    \ into a global scope. You need to avoid this. Instead, we suggest using an AMD\
    \ based loader. This way, it will eliminate any packages or modules that are globally\
    \ namespaced. Please also note that this will not apply on browsers that provide\
    \ global including `console`, `navigator`, `window`, or `document`.\n\n### 9.\
    \ DO NOT leave any dangling commas, especially in object definitions and lists\n\
    \nWhile most browsers will actually allow this with modern technology, it used\
    \ to cause Internet Explorer to throw errors. It should be noted that by leaving\
    \ dangling commas, it could create some sloppy programming. Most of the time,\
    \ an issue like this is seen in `define` statements. It has also been found after\
    \ the last method/function in a declared class. Here is an incorrect example:\n\
    \n```javascript\nvar a = [1,2,3,];\nvar b = { a:1, b: \"B\", c: x,};\n```\n\n\
    - As a general tip, you will want to generate your visual lists by using an `Array`.\
    \ This way, you can join the results. Here is an example:\n\n```javascript\nconsole.log\
    \ ( \"A List of Names: \", nameList.join (\"firstname, lastname\") );\n```\n\n\
    ### 10. DO define all of your local var’s at the TOP of your function\n\nWhile\
    \ this isn’t necessarily required, by defining your local variables at the top\
    \ of your function, it can lead to a leaner code. The local variables are normally\
    \ at the `\"function\"` scope. In other words, they are accessible within any\
    \ enclosing function. This does not mean that they are only within the closing\
    \ blocks. Instead, random `\"var\"` definitions that are placed throughout an\
    \ entire function could lead to errors such as unintended variable re-assignment.\
    \ Remember this will also apply for the `for (var I in...)` blocks as well. While\
    \ the `I` variable will not be scoped for the block, it will be scoped for the\
    \ outer containing function. This can become very confusing as this is a common\
    \ practice in other coding languages. Please note that this is not the case for\
    \ JavaScript. Please just define your local variables at the top of your function\
    \ to avoid any unintended side-effects.\n\n### 11. DO use (ie\"===\") explicit\
    \ comparators\n\nIn JavaScript, you will always want to use the explicit comparators\
    \ over any coerced comparators. By using the coerced comparators, you will be\
    \ able to convert any value types then be able to match and compare them.\n\n\
    Here is a great example of doing this:\n\n```javascript\n\"Hey\" == 2\n\" \" ==\
    \ 1\n1 == true\n```\n\n- By using the triple equals as compared to the `!==` this\
    \ will force your code to create a pure comparison of the values.\n\n### 12. DO\
    \ use shortcuts for your value assignment defaults\n\nWhen you are coding, your\
    \ main goal is to make your code fast and readable. By using the logical OR during\
    \ operation assignments, this will allow your code to have default values. Here\
    \ is an example of putting simple validation on an input args. By doing this,\
    \ it will ensure that the code will work on any expected object.\n\n```javascript\n\
    //\"Args\" will default to an empty object if it is not defined\nargs = args ||\
    \ {} ;\n//As you know, args will be an object. Now that it is defined, it will\
    \ be safe to do a var greeting such as:\nvar greeting = args. Greeting || \"Hello\"\
    ;\n```\n\n### 13. DO place braces on the right side of your block definitions\n\
    \nWhile this is a personal style choice, it is always suggested to place the braces\
