  trans: "\n-   在编写代码时，务必注意你的模式。有些人犯了这样一个错误，即通过检查事件的 `target.label` 来判断它是否为源按钮。相反，我们建议使用\
    \ `\"class\"` 或 `\"id\"` 标识符。这样，即使应用程序被翻译，它也不会崩溃。\n\n### 5. 命名变量时切勿使用连字符（hyphens）\n\
    \n编码可能是困难的；这就是为什么我们建议不要在变量名中使用连字符。如果发生这种情况，它可能会被误认为是减法操作。例如：\n\n```javascript\n\
    var hello-name = \"Welcome\";\n```\n\n-   按照这段代码的设置方式，它将尝试从世界中减去 name。显然，这将抛出一个错误。\n\
    \n### 6. 不要在此代码中遗留 \"debugger\" 语句\n\n提醒一下，`\"debugger\"` 语句用于在任何测试期间强制浏览器在断点处停止。这是帮助大多数开发者快速、高效地定位错误的代码。然而，如果意外遗留在代码中，可能会导致其他故障。相反，我们建议使用浏览器工具手动设置断点。这在最终可以为你节省时间并避免麻烦。\n\
    \n### 7. 不要使用函数 \"eval()\"\n\n有一个开发者常用的俗语叫做 \"eval is evil\"（eval 是邪恶的）。这应该是一个容易记住的观点：你应该很少使用\
    \ `eval`，如果非要用的话。这段代码是让你的代码产生很多坏结果的一种非常简单的方法。除非你清楚自己在代码中做什么，否则必须始终对来源保持信任。如果不是，它可能会导致你的代码出现漏洞。正如你之前学到的，这是你不惜一切也要避免的事情！\n\
    \n### 8. 永远不要使用全局变量\n\n这是我们将反复强调的一点。当你定义局部变量时，请务必使用 `var` 语句。否则，变量将被放置在全局作用域中。你需要避免这一点。相反，我们建议使用基于\
    \ AMD 的加载器。这样，它将消除任何全局命名空间的包或模块。请注意，这不适用于提供全局对象的环境（如 `console`、`navigator`、`window`\
    \ 或 `document`）的浏览器。\n\n### 9. 不要留下任何悬空逗号（dangling commas），特别是在对象定义和列表中\n\n虽然在现代技术下，大多数浏览器实际上允许这样做，但在过去这曾会导致\
    \ Internet Explorer 抛出错误。应该指出，留下悬空逗号可能会导致一些粗糙的编程。大多数情况下，这类问题出现在 `define` 语句中。在声明的类的最后一个方法/函数之后也发现过这种情况。这是一个错误的示例：\n\
    \n```javascript\nvar a = [1,2,3,];\nvar b = { a:1, b: \"B\", c: x,};\n```\n\n\
    -   作为一个通用提示，你可能希望通过 `Array` 来生成你的视觉列表。这样，你可以合并结果。这里有一个示例：\n\n```javascript\n\
    console.log ( \"A List of Names: \", nameList.join (\"firstname, lastname\") );\n\
    ```\n\n### 10. 务必在函数顶部定义所有的局部 var\n\n虽然这并非必须，但通过在函数顶部定义局部变量，可以使代码更加简洁。局部变量通常位于\
    \ `\"function\"` 作用范围内。换句话说，它们在任何嵌套函数内部都是可的。这并不意味着它们只存在于闭块内。相反，在整个函数中随机放置的 `\"\
    var\"` 定义可能会导致意外的变量重新赋值等错误。请记住，这也适用于 `for (var I in...)` 块。虽然变量 `I` 不会在块级作用域，但它会在外部包含的函数作用域内。这可能会变得非常困惑，因为这是其他编程语言中的常见做法。请注意，JavaScript\
    \ 的情况并非如此。请将你的局部变量定义在函数顶部，以避免任何意外的副作用。\n\n### 11. 务必使用 (======) 显式比较符\n\n在 JavaScript\
    \ 中，你总是希望使用显式比较符而不是任何强制转换的比较符。通过使用强制转换的比较符，你将能够转换任何类型，然后对它们进行匹配和比较。\n\n这里有一个这样做的极佳示例：\n\
    \n```javascript\n\"Hey\" == 2\n\" \" == 1\n1 == true\n```\n\n-   与 `!==` 相比，使用三等号将强制你的代码对值进行纯粹比较。\n\
    \n### 12. 务必使用快捷方式进行值的默认值赋值\n\n在编写代码时，你的主要目标是让代码快速且易读。通过在操作赋值中使用逻辑或（OR），可以让你的代码拥有默认值。这里有一个对输入参数进行简单验证的示例。这样做可以确保代码在任何预期的对象上运行。\n\
    \n```javascript\n//\"Args\" 如果未定义则将默认为空对象\nargs = args || {} ;\n//如你所知，args 是一个对象。现在它被定义了，这样执行\
    \ var greeting 才是安全的：\nvar greeting = args. Greeting || \"Hello\";\n```\n\n###\
    \ 13. 务必将大括号放在块定义的右侧\n\n虽然这是一种个人风格选择，但始终建议将大括号放在块定义的右侧，以保持代码安全。随着你开始编写更多代码，你会发现一种让你的工作更轻松的风格。这里有几个放置括号的示例：\n\
    \n-   **错误：**\n```javascript\nreturn// 如果你这样做，返回值将是 undefined，不符合对象的预期。\n{//这将确保块是有效的。请注意，它将是无操作（no-ops）！\n\
    Ok : false\n};\n```\n\n-   **正确：**\n```javascript\nreturn {\nok : true\n};\n```\n\
    \n### 14. 务必在行末尾使用分号\n\n虽然在行末尾使用分号在技术上不是强制的，但你的代码这样写会更好。与其猜测编译器将如何解释这些行，不如直接在末尾放置分号，这样就没有猜测游戏了！\n\
    \n### 15. 务必遵循函数和变量的命名规范\n\n这样做有助于创建更整洁的代码。记住，你并不总是那个阅读/编写自己代码的人。为了保持代码的一致性，请使用以下命名规范来保持有序：\n\
    \n-   首先，确保你的常量始终大大写\n    示例：`var A= 1.2`\n-   其次，当你使用私有变量时，尝试使用前导下划线\n    示例：`_myUsername`\n\
    -   最后，记住普通变量将按以下格式标记：\n    示例：`camelCase`\n\n### 16. 务必为你的 NLS 字符串使用双引号\n\n在编码中，许多语言会大量使用单引号作为特定语言的一部分。大多数情况下，翻译人员无法理解\
    \ `\"JSON\"` 结构样式。如果发生这种情况，单引号字符串会导致无效字符串。\n\n这里有一个示例：\n\n```json\nEnglish: {\
    \ \"end\" : \"The end of the story\" }\n```\n\n## 第三章：注释和日志的最佳实践\n\n在使用 JavaScript\
    \ 编写代码时，你有一些技巧可以让你的注释和日志变得更简单。记住，当你工作或练习编码时，你希望尽所能地保持代码的整洁有序。日志和注释都应该贯穿整个代码。请注意，使用任何一种都不会产生性能开销。大多数情况下，它们在你的构建阶段就会被移除。\n\
    \n在这里，我们将为你提供一个在处理日志和注释时需要记住的快速列表：\n\n-   务必使用正确的日志级别\n-   所有复杂逻辑都使用注释\n-   使用标准日志记录任何有用细节\n\
    -   任何公共函数、变量或模块都使用 JSDoc 语法\n-   不要字符串拼接\n\n### 1. 务必使用正确的日志级别\n\n"
- fmt: "\nPlease note that both `WL.logger` and `Console` both support a few different\
    \ levels for logging. If you don’t recall, these include: `warn`, `error`, `log`,\
    \ and `debug`. When you use a proper level in your coding for a certain situation,\
    \ it will help you manage what you log in a better way. For example, if you are\
    \ building code, your default for the Dojo is going to be removing the logging\
    \ that appears below the \"error.\" In this case, any `console.error()` would\
    \ remain in the code. The issue with this is that after you build, any error conditions\
    \ would be removed from the code and then it would be lost.\n\n## 2. DO use comment\
    \ for all complex logic\n\nMost of the time, a code in JavaScript is readable\
    \ if you have the skills. There are those times when the code gets too complex\
    \ even to solve complex problems.. For example, it isn't always practical to have\
    \ a refractor code just so that someone else (such as a novice) can understand\
    \ the code. This also stands for the developers who try to be \"elegant\" with\
    \ their code. To keep it simple, and make everyone's lives easier, comment your\
    \ complex code. At the end of the day, this will help aid everyone in the comprehension\
    \ of the code.\n\n## 3. DO use standard logging for any useful details\n\nWhen\
    \ you are creating code, your logging should include content that will be meaningful.\
    \ Most developers will want to stay liberal when they are logging by using `console.log()`.\
    \ When creating a log, be sure to provide the valuable content such as module,\
    \ `source`, and `function`. Any message that you include should be descriptive\
    \ and include useful variables. We also suggest avoiding using `alert()` statements\
    \ as a substitute for the logging. Most of the times, it could get left in the\
    \ code, and it will make it more difficult for everyone.\n\n## 4. DO use JSDoc\
    \ Syntax for any public functions, variables, or modules\n\nIf you weren't already\
    \ aware, `JSDOC` is a way that you can annotate your JavaScript code. This is\
    \ a reason why it is vital to comment on your public variables and functions properly.\
    \ By nature, private variables and functions can be documented, but they are less\
    \ important. If you are using a reusable code, it could be contributed to a public\
    \ or private library, and at this point, it will need to be properly documented.\n\
    \n## 5. DO NOT use string concatenation\n\nWhile you are coding, we suggest using\
    \ multiple arguments when you are logging. This way, you will be able to avoid\
    \ using string concatenation. This is a very common anti-pattern within logging.\n\
    \nHere is a bad example:\n\n```\nConsole.error (\"Invalid arguments provided:\
    \ \" + args);\n```\n\n- In this case, the code will fail. The output has to run\
    \ `toString()` on the objects. In this case, it will show as the following:\n\
    `Invalid arguments provided: [Object]`\n\n- Instead, you will want to use multiple\
    \ arguments to show the object you want. Here is the proper example:\n\n```\n\
    Console.error (\"Invalid arguments provided:\", args);\n```\n\n- As you can see,\
    \ it is a simple fix, but it something you could be making fairly easily.\n\n\
    # Chapter 4: Tips for Better Performance\n\nWhether you are a novice in the coding\
    \ world or have been practicing for a while, you can admit to yourself that you\
    \ make mistakes. Remember that this is ok. There are always ways to help you perform\
    \ better in coding.\n\nIn this chapter, we will be providing you with just a few\
    \ ways to help improve your code. From minimizing your DOM access to staying suspicious\
    \ of any logic inside of your loops, there is always room for improvement.\n\n\
    Here is your checklist if you are in a rush!\n\n- DO ensure that your 3rd party\
    \ libraries are always optimized\n- minimize any DOM manipulation and DOM access\n\
    - keep your DOM at a minimum\n- stay suspicious of the logic inside of your loops\n\
    - delay JavaScript Loading\n- reduce activity in your loops\n\n## 1. DO ensure\
    \ that your 3rd party libraries are always optimized\n\nWhile coding, you will\
    \ want to be aware that you will ALWAYS need to optimize any custom JavaScript.\
    \ On top of this, you must be sure that you are using an optimized version of\
    \ any 3rd party libraries as well. As a general tip, minimized libraries will\
    \ have `\".min\"` in their title. While researching, you will want to look for\
    \ websites that promise you are using an optimized version as opposed to a developer's\
    \ source.\n\n## 2. DO minimize any DOM manipulation and DOM access\n\nIf you weren't\
    \ already aware, `DOM` is incredibly slow compared to any other code in your application.\
    \ This is why it is vital for you to minimize any access to the `DOM` when it\
    \ is possible. If you absolutely need to access a certain node, we suggest doing\
    \ this once and then store your results into a local variable. Last, we suggest\
    \ you build a large `DOM` fragment to insert once. This is a much better option\
    \ compared to building nodes into your `DOM` and having to iterate it every time.\n\
    \n## 3. DO keep your DOM at a minimum\n\nIf you are coding for an application,\
    \ you will want the code to be as quick and seamless as possible. Unfortunately,\
    \ the performance will drop as the complexity and `DOM` size increase. By being\
    \ proactive on your `DOM` size, you can improve the reflow of the operations.\
    \ Luckily, you have two basic options to help minimize your `DOM`. First, you\
    \ could destroy the view to save state. You will also need to destroy its children.\
    \ While this can become complex to manage the state and child widget, it is actually\
    \ very unlikely that your user will revisit this view again. Instead, you will\
    \ want to clean up any `DOM` resources or memory.\n\nYour second option is to\
    \ use the `DomCache` code. For this, the code will offload the view’s node tree.\
    \ In return, it will turn into a `DomFragment` variable and be transitioned out\
    \ of the code. At this point, if you need the view again, you can check your cache\
    \ and then reinsert it back into the `DOM`. If you have a view that is revisited,\
    \ this is the best option for you.\n\n## 4. DO stay suspicious of the logic inside\
    \ of your loops\n\nFor most developers, it is normal to iterate through your elements\
    \ and data by using a loop. However, you do not want to take the information as\
    \ it happens within your loop. Remember that a number of potential negative performances\
    \ could occur. You will want to keep your eye out for `DOM` access, storage access,\
    \ math calculations, `AJAC` calls, and any other manipulations. The sooner you\
    \ catch any of these outside of your loop, the better!\n\n## 5. DO delay JavaScript\
    \ Loading\n\nIf you put your script at the bottom of the page, it will allow your\
    \ browser to load the page first. But, while your script is loading, your browser\
    \ will not be able to start other downloads. If this happens, other rendering\
    \ activity could be blocked. Instead, try using the code `defer=\"true\"` in your\
    \ script tag. this attribute will be executed once your page has finished parsing.\
    \ Please note that this will only work on external scripts. Try the following\
    \ code example:\n\n```\n<script>\nwindow. onload = downScripts;\n\nfunction downScripts\
    \ ( ) {\n  var element = document. createElement (\"thescript\");\n  element.src\
    \ = \"theScript.js\";\n  document.body.appendChild(element);\n}\n</script>\n```\n\
    \n## 6. Do reduce activity in your loops\n\nRemember that the loops in your code\
    \ will include a statement. This statement will be executed during each iteration\
    \ of the loop. If your statements are placed outside of the loop, this will help\
    \ you run the loop faster.\n\nHere is an example of a bad code and a better code\
    \ to help improve the performance:\n\n- **Bad Code:**\n```javascript\nvar I;\n\
    for (I = 1; I<arr.length; I++) {\n```\n\n- **Better Code Performance:**\n```javascript\n\
    var I;\nvar m = arr.length;\nfor ( I = 1; I < m; I++) {\n```\n\n# Chapter 5: Best\
    \ JavaScript Tips for Beginners\n\nWhether you like it or not, as a programmer\
    \ or web or app developer, you need to learn JavaScript. It is considered the\
    \ computer language of the future simply because it is an integral part of web\
    \ ad app development.\n"
