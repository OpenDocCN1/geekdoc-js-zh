    ### 引言

    欢迎阅读我们的书籍《JavaScript：JavaScript 编程最佳实践》。无论你是编程初学者还是已经从事了一段时间，你都知道 JavaScript 是有多难用！即使是最简单的错误也会搞乱你的整个代码！我们在这里想告诉你，这种情况发生在每个人身上！在那种情况下，你并不孤单。你如何处理这些错误决定了你与其他程序员的颖开来。


    你会因为一个错误就放弃吗？当然不！生活的意义就在于犯错并从从中学习。在这些章节中，我们将教你一些基础实践，以增强你在 `JavaScript` 方面的技能。我们将为你提供最好的方法、流程和技术，帮助你编写出更好的
    JavaScript JavaScript 编程代码。随着你的学习，你可以将你的新技能应用到日常生活中。


    我们的目标是让读者精通 `JavaScript` 代码，以便他们通过阅读这本书来扩展知识。如果你读到了这一步，我们预计你已经具备一些 `JavaScript`
    的基础知识，即使只是基础。有时，`JavaScript` 教程可能会令人沮丧。代码并不总是容易解释清楚的话题。我们承诺让这个编码过程尽可能简单。


    在第一章中，我们将深入探讨每个程序员都犯过的某些常见 `JavaScript` 错误。你可能会发现自己并不是唯一一个犯这些错误的人。事实上，有些错误看起来非常愚蠢！别担心；有时往往是最微小的错误最容易修复！也许你忽略了细节，例如引号不匹配，甚至更改了你的变量名。你意识到属性和变量名是区分大小写的吗？如果不知道，我们已经为你涵盖了！


    在介绍常见错误之后，我们将介绍一些通用建议以帮助改进你的代码。例如，我们将介绍如何定义你的局部 `vars`、如何避免全局变量等！一旦我们讨论了通用建议，我们将转向改进你的注释、日志和整体性能的技巧。正如我们之前提到的，我们的首要目标是培养你作为程序员的技能。


    在阅读时，请随时停下来练习我们提供的代码。毕竟，熟能生胜！最终，编码将对你来说变得更加自然，你不需要频繁停下来思考代码了。当然，错误是不可避免的，但随着你的学习，你可能会发现自己犯的错误越来越少。我们希望你阅读愉快，并在过程中学到一些东西！


    ## 第一章：常见的 JavaScript 错误

    是的，你可能知道所有要遵循的代码。只需记住，在 `JavaScript` 中编码可能会让你绊倒，无论你编写代码的时间有多长。以下示例是人们掉入的一些常见陷阱。当你工作时，尝试在脑海中记住这些模型。这样，当你编写代码或调试时，就能更早地发现问题！


    ### 引号、大括号和圆括号不匹配

    如果你经常这样做，有一个简单的方法可以避免这种错误。你只需要同时编写你的起始和结束元素即可！完成后，你就可以输入你想添加到代码中的元素了。这里有一个例子：


    ```javascript

    var myString=" ";


    function myFunction(){


    if(){


    }

    }

    ```


    - 第一行，你要在输入字符串值之前编写引号。这样你就不会忘记它们了。

    - 在你的第二行，一旦打开括号就关闭它。

    - 在你的代码中，确保你双检查并计算左右圆括号。

    - 最后，如果你打开了圆括号，务必关闭它！


    ### 大写敏感

    万一你不知道，函数和变量都是区分大小写的。在你工作时，非常容易犯这种静默错误。当你命名时，我们建议你保持一致。作为一个小技巧，只需记住 JavaScript
    内部 CSS 属性将使用驼峰命名法（camelCase）。这是一个简单的示例：


    ```javascript

    getElementById("theId") != getElementByID("theId");

    ```


    - 你发现错误了吗？本应该是 `Id` 而不是 `ID`


    ```javascript

    getElementById("theId") != getElementById("theID");

    ```


    - 这一次呢？你抓到了！`Id` 不等于 `ID`。你可以看到这是一个常见的错误，尤其是当你试图快速操作时！


    ### 换行符和额外的逗号

    当你编写代码时，你将避开硬换行。当你使用换行符时，它们会被解释为行尾的分号。这也发生在字符串中。当你在引号中包含硬换行时，你将得到错误。它最可能是“未结束的字符串”解析错误。这里有一个例子：


    - 未结束的字符串错误：

    ```javascript

    var bad= <ul id="myId">

    <li>writing the text</li>

    <li>even more text </li>

    </ul>;

    ```


    - 正确的换行

    ```javascript

    var good= ''<ul id="myId">'' +

    ''<li> writing the text</li>'' +

    ''<li> even more text </li>'' +

    ''</ul>'';

    ```


    - 需要注意的是，这种分号规则在控制结构中并不适用。在控制结构中，闭合圆括号之后的换行符并不是由分号提供的。


