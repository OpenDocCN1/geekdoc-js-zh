  trans: "\n\n请注意，`WL.logger` 和 `Console` 都支持几种不同的日志级别。如果你不记得了，它们包括：`warn`、`error`、`log`\
    \ 和 `debug`。当你在编码中针对特定情况使用适当级别时，将帮助你更好地管理记录的日志。例如，如果你正在构建代码，对于 Dojo 的默认设置将移除出现在“error”以下的日志。在这种情况下，任何\
    \ `console.error()` 都会保留在代码中。这样做的问题是，在你完成构建后，任何错误情况都将从代码中移除并导致其丢失。\n\n## 2. 务必对所有复杂逻辑使用注释\n\
    \n大多数情况下，如果你具备技能，JavaScript 代码是可读的。但也有某些时候，代码变得过于复杂，甚至无法解决复杂问题。例如，为了让其他人（如新手）理解代码而进行重构代码并不总是实际的。这对于那些试图让代码“优雅”的开发者来说也是如此。为了保持简单并让大家的生活更轻松，请为你的复杂代码编写注释。归结底，这将有助于所有人理解代码。\n\
    \n## 3. 务必对任何有用细节使用标准日志\n\n当你编写代码时，你的日志应该包含有意义的内容。大多数开发者会希望通过使用 `console.log()`\
    \ 在记录日志时保持慷慨。在创建日志时，务必提供价值内容，如模块、`source` 和 `function`。你包含的任何消息都应该是描述性的并包含有用的变量。我们还建议避免使用\
    \ `alert()` 语句代替日志。在大多数情况下，它可能会遗留在代码中，并让大家的工作变得更加困难。\n\n## 4. 务必对任何公共函数、变量或模块使用\
    \ JSDoc 语法\n\n如果你还不知道，`JSDOC` 是你用来注释 JavaScript 代码的一种方法。这就是为什么正确地注释你的公共变量和函数至关重要的原因。从本质上说，私有变量和函数可以记录，但它们重要性较低。如果你正在使用可复代码，它可能会被贡献到公共或私有库中，此时它需要适当的文档说明。\n\
    \n## 5. 勿使用字符串拼接\n\n在你编写代码时，我们建议在记录日志时使用多个参数。这样，你就可以避免使用字符串拼接。这是日志记录中常见的一种反模式。\n\
    \n这里有一个错误的示例：\n\n```\nConsole.error (\"Invalid arguments provided: \" + args);\n\
    ```\n\n- 在这种情况下，代码将失败。输出必须对对象运行 `toString()`。在这种情况下，它将显示如下：\n`Invalid arguments\
    \ provided: [Object]`\n\n- 取反，你将希望使用多个参数来显示你想要的对象。这里是正确的示例：\n\n```\nConsole.error\
    \ (\"Invalid arguments provided:\", args);\n```\n\n- 如你所见，这是一个简单的修复，但你可以相当容易地完成它。\n\
    \n# 第 4 章：提高性能的技巧\n\n无论你是编程界的新还是已经实践了一段时间，你都可以向自己承认你会犯错。记住，这没关系。总有方法帮助你在编码中表现更好。\n\
    \n在本章中，我们将为你提供几种帮助改进代码的方法。从最小化 DOM 访问到对循环内部的任何逻辑保持怀疑，总有改进的空间。\n\n如果你赶时间，这是你的清单！\n\
    \n- 务必确保你的第三方库始终经过优化\n- 最小化任何 DOM 操作和 DOM 访问\n- 将你的 DOM 保持最小\n- 对循环内部的逻辑保持怀疑\n\
    - 延迟 JavaScript 加载\n- 减少循环中的活动量\n\n## 1. 务必确保你的第三方库始终经过优化\n\n在编码时，你要意识到你**始终**需要优化任何自定义的\
    \ JavaScript。此外，你必须确保你也在使用任何第三方库的优化版本。作为一个通用的提示，最小化的库在其标题中会包含 `\".min\"`。在研究时，你将想要寻找承诺你提供的是优化版本而非开发者源码的网站。\n\
    \n## 2. 务必最小化任何 DOM 操作和 DOM 访问\n\n如果你还不知道，`DOM` 与你应用程序中的任何其他代码相比都缓慢得多。这就是为什么在可能的情况下最小化对\
    \ `DOM` 的访问至关重要的原因。如果你绝对需要访问某个节点，我们建议只这样做一次，将结果存储在本地变量中。最后，我们建议构建一个大的 `DOM` 片片并一次插入。与将节点构建到你的\
    \ `DOM` 中并在每次迭代它相比，这是一个好得多的选项。\n\n## 3. 务必将你的 DOM 保持最小\n\n如果你在为应用程序编写代码，你将希望代码尽可能快速且无缝。遗憾的是，随着复杂性和\
    \ `DOM` 大小的增加，性能将会下降。通过主动控制 `DOM` 大小，你可以改进操作的重流。幸运的是，你有两个基本选项来帮助最小化你的 `DOM`。首先，你可以销毁视图以保存状态。你还需要销毁子元素。虽然管理状态和子组件可能会变得复杂，但你的用户实际上不太再次访问此视图。相反，你将希望清理任何\
    \ `DOM` 资源或内存。\n\n你的第二个选项是使用 `DomCache` 代码。为此，代码将卸载视图的节点树。作为回报，它将转化为 `DomFragment`\
    \ 变量并重新插入 `DOM`。如果你需要视图，这是最佳选择。\n\n## 4. 对循环内部的逻辑保持怀疑\n\n对于大多数开发者来说，使用循环遍历你的元素和数据是正常的。然而，你不希望在循环中进行这些操作。记住，这可能会导致许多负面性能。越早在循环之外捕捉\
    \ DOM 访问、存储访问、数学计算、AJAC 调用或其他操作就越好！\n\n## 5. 延迟 JavaScript 加载\n\n如果你将脚本放在页面底部，它将允许浏览器先加载页面。但是，当你的脚本加载时，浏览器将无法启动其他下载。如果发生这种情况，其他渲染活动可能会被阻塞。相反，尝试在你的脚本标签中使用\
    \ `defer=\"true\"` 代码。此属性将在页面解析完成后执行。请注意，这适用于外部脚本。尝试以下代码示例：\n\n```\n<script>\n\
    window. onload = downScripts;\n\nfunction downScripts ( ) {\n  var element = document.\
    \ createElement (\"thescript\");\n  element.src = \"theScript.js\";\n  document.body.appendChild(element);\n\
    }\n</script>\n```\n\n## 6. 减少循环中的活动量\n\n记住代码中的循环将包含一个语句。该语句将在循环的每次迭代中执行。如果你将语句放在循环之外，这将帮助你更快地运行循环。\n\
    \n这是一个有助于提高性能的错误代码和代码示例：\n\n- **错误代码：**\n```javascript\nvar I;\nfor (I = 1; I<arr.length;\
    \ I++) {\n```\n\n- **更好的代码性能：**\n```javascript\nvar I;\nvar m = arr.length;\n\
    for ( I = 1; I < m; I++) {\n```\n"
- fmt: "\nOf course, it would be next to impossible to cover every trick to help you\
    \ learn the best practices for JavaScript. Instead, we want to focus on the main\
    \ attributes you will come across as you learn to code. In the chapter to follow,\
    \ we will provide you with some of the simpler best practices to get you on the\
    \ right path. Remember that there is always more information to learn about coding.\n\
    \nThis is just an excellent start!\n\n- DO NOT declare Boolean Objects, Strings,\
    \ or Numbers\n- DO Initialize Any Variables\n- DO NOT use `newObject()`\n- DO\
    \ use Parameter Defaults\n- DO NOT use Automatic Type Conversions\n- DO use \"\
    Timer\" to Optimize Code\n- DO NOT Pass String to \"SetTimeOut\" or \"SetInterval\"\
    \n- DO use \"For in\" Statements\n- DO NOT use \"With\" Statements\n\n## 1. DO\
    \ NOT declare Boolean Objects, Strings, or Numbers\n\nWhile you are coding, it\
    \ is very important that you treat your Booleans, strings, and numbers as primitive\
    \ values. You will not want to see these as objects. If you define any of these\
    \ codes as objects, it could produce bad side effects and will just slow down\
    \ the speed of your execution.\n\nHere is a quick example:\n\n```\nvar x= \"Joe\"\
    ;\nvar y= new String (\"Joe\");\n(x ===y)\n```\n\n- As you can see, this will\
    \ be false due to the fact that `x` is a string while `y` is an object. It will\
    \ throw an error, and this is something you can avoid!\n\n## 2. DO Initialize\
    \ Any Variables\n\nWhether you are learning code, or are just looking to fix your\
    \ skills, it is great practice to initialize your variables as you declare them.\
    \ When you do this, it will help avoid undefined values, it will provide you with\
    \ a single place to do this, and it will help give you a cleaner code.\n\n## 3.\
    \ DO NOT use `newObject()`\n\nWhile this is something we touched on a bit earlier,\
    \ it is important to remember. Here is a quick cheat sheet to help you remember\
    \ which code to use compared to its similar code. By being organized, you can\
    \ keep your code clean.\n\n- DO USE: `{}` DO NOT USE: `new Object()`\n- DO USE\
    \ `0` DO NOT USE `new Number()`\n- DO USE `\" \"` DO NOT USE `new String()`\n\
    - DO USE `false` DO NOT USE `new Boolean()`\n- DO USE `function () {}` DO NOT\
    \ USE `new Function()`\n- DO USE `/()/` DO NOT USE `new RegExp()`\n- DO USE `[]`\
    \ DO NOT USE `new Array()`\n\n## 4. DO use Parameter Defaults\n\nWe invite you\
    \ to ask a moment to ask yourself, what do I remember about functions? What do\
    \ you call it when your function is missing an argument? That's right! The value\
    \ of that missing argument will be called `undefined`. If you weren't already\
    \ aware, these `undefined` values can and will break your code. To break this\
    \ habit, try your best to assign values to your arguments automatically.\n\nHere\
    \ is an example:\n\n```\nfunction myFunction (x, y) {\n  if ( x === undefined)\
    \ {\n    x= 1;\n  }\n}\n```\n\n## 5. DO NOT use Automatic Type Conversions\n\n\
    While you are coding, you will want to be aware of the numbers that could be converted\
    \ to `NaN` or strings. If you need a refresher, `NaN` stands for Not a Number.\
    \ This is something that can happen automatically due to the fact that JavaScript\
    \ is typed loosely. The variables in your code can change the data type as well\
    \ as contain a few different types of data.\n\nHere is a quick example:\n\n```\n\
    var x = \"Hey\";\n```\n\n- In this case, `x` is a string but if you were to continue;\
    \ `x= 4;`\n- Then, this changes your `x` to a number. You can see where this could\
    \ cause errors in your code.\n\nYou also should be aware that your JavaScript\
    \ will convert numbers into strings if you are doing mathematical problems. If\
    \ you type it the wrong way, it will give you an answer, but it may not be the\
    \ one you wanted. Here is a quick example:\n\n- In this example, `typeof x` will\
    \ be a number\n```\nvar x = 5+ 7; // x.valueOf() will be 12\n```\n\n- In this\
    \ next example, the `typeof x` will be a string\n```\nvar x = 5+ \"7\"; // x.valueOf()\
    \ will be 57\n```\n\nIn a different case, you could try to use your function to\
    \ subtract one string from another string. In this case, it will return as `NaN`.\n\
    \nUse this example:\n\n```\n\"Goodbye\" – \"Love\" // This will return as NaN\n\
    ```\n\n## 6. DO use \"Timer\" to Optimize Code\n\nThis practice is super simple.\
    \ Are there ever times that you need a quick way to determine exactly how long\
    \ your operation will take? Luckily, Firebug has a \"timer\" feature that will\
    \ log the results for you! Sometimes it helps to have some tricks on the side\
    \ to help your coding along.\n\nHere is the code for that:\n\n```\nfunction TimeTracker\
    \ () {\n  console.time (\"MyTimer\");\n  for (x=4000; x > 0; x--) {}\n  console.timeEnd\
    \ (\"MyTimer\");\n}\n```\n\n## 7. DO NOT Pass String to \"SetTimeOut\" or \"SetInterval\"\
    \n\nRemember when we told you not to use the `eval` function? This code will function\
