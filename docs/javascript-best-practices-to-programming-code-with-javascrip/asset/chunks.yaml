    - To fix this mistake, you will want always to use semi-colons and parenthesis.
    This way, your code is easier to read, you will not get tripped up by the breaking
    lines, and when you move your code around, you will never have to worry about
    your initial statement closing.

    - If you have extra commas, remember that your last property should not end with
    a comma. While some browsers won''t be tripped up by the extra commas (such as
    Firefox), Internet explorer will. Just try and remember that it is better to be
    safe than sorry when you are working with code!


    ## Conditional Statements


    When you are coding, there are three common conditional statement mistakes. Here
    are some of the following:


    1. When you are coding, try not to get tripped up by using an assignment operator.
    When you do this, you are conveying your second argument value to your first.
    Obviously, this will come back as a logic issue. When this happens, it will return
    true and will not throw an error if value in `var2` is not zero.


    Example:


    ```javascript

    if(var1 = var2) {}

    ```


    * This will return true or false, depends on value in `var2`. It assigns `var2`
    to `var1`. You have to be careful in case this is something you did not mean!


    2. Remember that all of your conditional comments have to be within parentheses.
    This may seem like a simple mistake. However, you would be surprised just how
    common it is!


    Example:


    ```javascript

    if(var1 == var2) {}

    ```


    3. For most cases, JavaScript is loosely typed. This is not the fact when you
    switch statements. Your JavaScript will not be loosely typed when you use case
    comparisons.


    Example:


    ```javascript

    var myVar = 1;


    if(myVar == ''1'') {

    alert ("hey");

    }


    switch(myVar) {

    case ''1'' :

    alert("hey");

    ```


    * In the first line, your code will return true because JavaScript is loosely
    typed

    * As for your alert in the third lime, it will show because most of the time,
    JavaScript will not care about the data type

    * In the last line, your alert will NOT show because your data types will not
    match.

    * However, if you want to make javascript also check the data type, instead of
    two equals signs, you should use three (===). In this case, this will not alert:


    ```javascript

    var myVar = 1;


    if(myVar === ''1'') {

    alert ("hey");

    }

    ```


    ## Variable Scope


    Not surprising, there are quite a few issues that can come from the variable scope.
    Some of these issues include overwriting the global variable from a local variable
    within your function or even thinking that a local variable is incorrectly a global
    variable. As you will be learning later, it is best just not to use any global
    variables. If you can''t avoid them, at least know how to avoid them.


    When you have global variables, remember that they will not be declared by the
    typical `var` keyword. Instead, you must declare your variables with the key term
    to keep them from having a global scope. Here is an example of a variable having
    a declared function and in return, getting a global scope:


    CODE:


    ```javascript

    anonymousFunction1 = function(){

    globalvar= ''global scope'';

    return globalvar;

    } ();


    alert(globalvar);

    ```


    * In this code, the "var" is missing, when this happens, globally will be declared.


    CODE:


    ```javascript

    anonymousFunction2 = function(){

    var localvar = ''local scope'' ;

    return localvar;

    } ();


    alert(localvar);

    ```


    * In this code, there is a locally declared "var"

    * Last, there will be an error of "localvar is not defined." As you can see, this
    is because there is no globally defined localvar.


    ## HTML id Conflicts


    This little mistake is more of a best practice for CSS, but sometimes it can be
    helpful if you are having a JavaScript issue. An HTML id allows JavaScript to
    have DOM bindings to allow indexing. As you will recall, both properties and functions
    share a namespace in your coding. So, if your properties and function happen to
    have the same name, you may be creating a logic error. These errors are hard to
    track down! When you are using JavaScript to code, we suggest avoiding variable
    names that are also ID values. Also, if you are marking your HTML, try not to
    use a property name as a value. This will help avoid confusion.


    Here is an example:


    CODE:


    ```javascript

    var listitems= document.getElementsByTagName(''a'');

    var aCount= listitems.length;

    ```


    * If you happened to have `<a id="length">`, it would sometimes return as `<a>`
    instead of the count you asked for. This is why it is very important to remember
    this little tip.


    ## String Replace


    This string replace happens to be another very common mistake in the coding world.
    You may have made this mistake of assuming the behavior of your string replace
    method. When you make assumptions, it could impact all of your possible matches.
    If you weren''t already aware, JavaScript will only change the first occurrence
    in your string replace method. If you want to replace all of your occurrences,
    it should be noted that you will need first to set a global modifier.


    Here is a good example:


    CODE:


    ```javascript

    var myString = "the string were talking about";

    myString= myString.replace(/ /, "%10"); //

    "the%10string were talking about"


    myString = myString.replace(/ /g,"%10"); //

    "the%10string%10were%10talking%10about"

    ```


    ‘this’


    If you are used to using JavaScript for coding, you may have made the mistake
    of forgetting to use the `this`. If this isn’t ringing a bell for you, the functions
    in JavaScript are defined as object accessing properties. When you fail to use
    the `this` identifier, things may get lost.


    Here is an incorrect example:


    ```javascript

    function myFunction () {

    var myObject = {

    objProperty: " the text you are using",

    objMethod: function () {

    alert (objProperty);

    }

    };

    myObject. objMethod ();

    }

    ```


    Here is the correct code when you use `this`:


    ```javascript

    function myFunction () {

    var myObject = {

    objProperty: " the text you are using",

    objMethod: function () {

    alert (this.objProperty);

    }

    };

    myObject. objMethod ();

    }

    ```


    ## Missing Parameter


    When you are coding, remember that you will want to update all of your function
    calls. This happens when you add the parameter to your function. Sometimes, people
    miss this and cause themselves some simple errors. Remember that if you do need
    to add a parameter to a special case, you will have to first set a default value
    for the parameter first for your function. This way, you won''t miss updating
    your calls in any of your scripts.


    Here is an example:


    ```javascript

    function addressFunction ( city, state, country){

    Country = country || "London" ;

    }

    ```


    ## Overwriting/ Overloading Functions


    When you are coding, if you declare a function more than once, your last declaration
    of the same function will overwrite any of the previous functions. This can be
    difficult because it will not give you any warnings or sign of error. In JavaScript,
    there is no overloading. This is why it is important to avoid any core names of
    JavaScript in your code. You will also want to avoid including JavaScript files
    in excess. If this happens, it could overwrite the same function in another script.
    Instead, we suggest using namespaces and functions instead, here is an example:


    CODE:


    ```javascript

    // the creation of the namespace

    // if the namespace does not exist, create it.

    if (!window.THENAMESPACE) {

    window [ ''THENAMESPACE'' ] = {}; }


    // note that this function is only accessible in the anonymous function

    function myFunction (var1, var2){

    //the local function code will go here }


    /* This will attach the local function to your namespace. This meaning that it
    will be accessible outside of your anonymous function when it uses the namespace*/

    window[''THENAMESPACE''][''myFunction''] = myFunction;


    };


    //Note that the parenthesis will open an immediate execution //

    ```


    * It is the parenthesis that encompasses the code that will make your anonymous
    function.


    ## Using ‘For Each’ Correctly

