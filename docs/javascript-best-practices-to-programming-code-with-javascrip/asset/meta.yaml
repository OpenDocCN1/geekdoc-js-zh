  - 第 4 章：提高性能的技巧
- - '###'
  - 1. 务必确保你的第三方库始终经过优化
- - '###'
  - 2. 务必最小化任何 DOM 操作和 DOM 访问
- - '###'
  - 3. 务必将你的 DOM 保持最小
- - '###'
  - 4. 对循环内部的逻辑保持怀疑
- - '###'
  - 5. 延迟 JavaScript 加载
- - '###'
  - 6. 减少循环中的活动量
- - '###'
  - 1. 不要声明布尔值对象、字符串或数字
- - '###'
  - 2. 初始化任何变量
- - '###'
  - 3. 不要使用 `newObject()`
- - '###'
  - 4. 使用参数默认值
- - '###'
  - 5. 不要使用自动类型转换
- - '###'
  - 6. 使用 "Timer" 优化代码
- - '###'
  - 7. 不要向 "SetTimeOut" 或 "SetInterval" 传递字符串
- - '###'
  - 8. 使用 "For in" 语句
- - '###'
  - 9. 不要使用 "With" 语句
