    \nfunction exampleScope() {\n\n if (true) {\n\n   var x = 10; // Function-scoped\
    \ with var\n\n   let y = 20; // Block-scoped with let\n\n   const z = 30; // Block-scoped\
    \ with const\n\n } \n\nconsole.log(x); // Outputs: 10\n\n // console.log(y); //\
    \ Error: y is not defined (block scope)\n\n // console.log(z); // Error: z is\
    \ not defined (block scope)\n\n} \n\nexampleScope();   \n\nIn this example, x\
    \ is accessible outside the block due to function scope, while y and z are block-scoped\
    \ and not accessible outside the block.\n\n# 89\\. What is the purpose of the\
    \ \"Proxy\" object in JavaScript?\n\nExplanation: The Proxy object in JavaScript\
    \ is used to create custom behaviors for fundamental operations (like property\
    \ access, assignment, enumeration, etc.) on objects. It allows interception and\
    \ customization of these operations.\n\nAnalogy:\n\nThink of a Proxy as a personal\
    \ assistant managing your requests. Instead of directly interacting with an object,\
    \ you delegate requests to the assistant, who can modify, reject, or enhance the\
    \ requests.\n\n// Example:\n\nconst handler = {\n\n get: function (target, property)\
    \ {\n\n   return property in target ? target[property] : 'Property not found!';\n\
    \n }\n\n}; \n\nconst person = new Proxy({}, handler);\n\nperson.name = 'John';\
    \ \n\nconsole.log(person.name); // Outputs: John\n\nconsole.log(person.age); //\
    \ Outputs: Property not found!   \n\nIn this example, the Proxy intercepts property\
    \ access and provides a custom response for non-existing properties.\n\n# 90\\\
    . Explain the concept of the \"IIFE\" (Immediately Invoked Function Expression)\
    \ pattern.\n\nExplanation: IIFE is a JavaScript pattern where a function is defined\
    \ and executed immediately after its creation. It's often used to create a private\
    \ scope for variables, preventing them from polluting the global scope.\n\nAnalogy:\n\
    \nConsider an IIFE as a personal bubble. You do your activities inside the bubble,\
    \ and once done, you pop it. The activities and variables inside the bubble don't\
    \ affect the external environment.\n\n// Example:\n\n(function () {\n\n // Private\
    \ scope\n\n const secretNumber = 42;\n\n console.log(secretNumber);\n\n})(); //\
    \ Immediately invoked \n\n// console.log(secretNumber); // Error: secretNumber\
    \ is not defined   \n\nIn this example, the IIFE encapsulates secretNumber, making\
    \ it inaccessible from outside the function."
