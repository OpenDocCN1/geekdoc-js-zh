    // Example of Closure\n\nfunction outerFunction() {\n\n let outerVar = 'I am from\
    \ the outer function';\n\n function innerFunction() {\n\n   console.log(outerVar);\
    \ // Accessing outerVar from the outer function\n\n }\n\nreturn innerFunction;\n\
    \n} \n\nlet closureExample = outerFunction();\n\nclosureExample(); // This still\
    \ logs \"I am from the outer function\"   \n\nAnalogy:\n\nImagine a backpack (closure)\
    \ containing some items (variables). Even if you move away from the place where\
    \ you packed your bag, you still have access to the items inside. Similarly, a\
    \ closure allows a function to carry its variables wherever it goes.\n\n# 16\\\
    . Write a piece of code demonstrating closure:\n\nfunction outerFunction() {\n\
    \n let outerVar = 'I am from the outer function';\n\n function innerFunction()\
    \ {\n\n   console.log(outerVar);\n\n }\n\nreturn innerFunction;\n\n} \n\nlet closureExample\
    \ = outerFunction();\n\nclosureExample(); // Outputs: \"I am from the outer function\"\
    \   \n\nIn this example, innerFunction is returned from outerFunction, creating\
    \ a closure. When closureExample is invoked, it still has access to outerVar even\
    \ though outerFunction has completed execution.\n\n# 17\\. What is hoisting?\n\
    \nHoisting is a JavaScript behavior where variable and function declarations are\
    \ moved to the top of their containing scope during the compilation phase. This\
    \ means you can use variables and functions before they are declared in your code.\n\
    \n// Variable Hoisting\n\nconsole.log(myVar); // Outputs: undefined\n\nvar myVar\
    \ = 42; \n\n// Function Hoisting\n\nmyFunction(); // This works even though the\
    \ function is declared later\n\nfunction myFunction() {\n\n console.log('Hello,\
    \ World!');\n\n}   \n\nAnalogy:\n\nThink of hoisting like a magician who pulls\
    \ items out of a hat. Even if the magician reveals the items later in the show,\
    \ you knew they were there from the beginning. Similarly, JavaScript moves declarations\
    \ to the top, making them accessible even before they are explicitly written.\n\
    \n# 18\\. Are let and const hoisted?\n\nYes, let and const are hoisted, but they\
    \ have a behavior called the \"temporal dead zone.\" In this zone, variables exist\
    \ but cannot be accessed until they are declared. This is unlike var, which is\
    \ initialized with undefined during hoisting.\n\n // Example causing ReferenceError\
    \ due to temporal dead zone\n\nconsole.log(myVar); // Throws a ReferenceError\n\
    \nlet myVar = 42; \n\nAnalogy:\n\nImagine a curtain lifting during a play. let\
    \ and const are behind the curtain from the start, but you can't see or interact\
    \ with them until the curtain is fully raised.\n\n# 19\\. What is scope in JavaScript?\n\
    \nScope in JavaScript defines the region or context where variables and functions\
    \ are accessible. It determines the visibility and lifetime of these identifiers.\
    \ There are two main types of scope:\n\n*   Global Scope: Variables declared outside\
    \ any function or block have global scope and can be accessed throughout the entire\
    \ program.\n\n*   Local Scope: Variables declared inside a function or block have\
    \ local scope and are only accessible within that function or block.\n\nAnalogy:\n\
    \nThink of scope like the visibility of rooms in a house. A variable declared\
    \ in the living room (global scope) can be seen from any room, while a variable\
    \ in the bedroom (local scope) is only visible within that specific room.\n\n\
    # 20\\. Explain Scope and Scope Chain in JavaScript:\n\nScope: Scope refers to\
