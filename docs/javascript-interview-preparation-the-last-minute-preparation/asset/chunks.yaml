    \n*   \"complete\": The document and its resources are fully loaded.\n\n// Example:\n\
    \ndocument.addEventListener('readystatechange', () => {\n\n console.log(document.readyState);\n\
    \n});   \n\nIn this example, the code logs the document's ready state as it changes\
    \ during the loading process.\n\n# 96\\. Explain the concept of \"event bubbling\"\
    \ in the DOM.\n\nExplanation: Event bubbling is a phase in the DOM event flow\
    \ where an event starts from the target element that triggered it and then bubbles\
    \ up through its ancestors in the DOM tree. This allows ancestor elements to react\
    \ to the same event.\n\nAnalogy:\n\nImagine dropping a pebble in water; the ripples\
    \ (event) not only reach the point where the pebble fell but also spread outwards,\
    \ affecting the surrounding areas.\n\n// Example:\n\n<div id=\"parent\">\n\n <button\
    \ id=\"child\">Click me!</button>\n\n</div> \n\n<script>\n\ndocument.getElementById('parent').addEventListener('click',\
    \ () => {\n\n console.log('Parent clicked!');\n\n}); \n\ndocument.getElementById('child').addEventListener('click',\
    \ () => {\n\n console.log('Child clicked!');\n\n});\n\n</script>   \n\nIn this\
    \ example, clicking the \"Click me!\" button triggers both the child and parent\
    \ click events due to event bubbling.\n\n# 97\\. How does the \"Map\" object differ\
    \ from a regular JavaScript object?\n\nExplanation: The Map object in JavaScript\
    \ is a data structure that allows you to store key-value pairs with some advantages\
    \ over regular objects. Unlike objects, Map keys can be of any data type, and\
    \ the order of key-value pairs is maintained.\n\nAnalogy:\n\nThink of a regular\
    \ object like a dictionary with words (keys) and definitions (values). A Map is\
    \ like an expanded dictionary where the order of entries is preserved, and the\
    \ words can be anything.\n\nKey Differences:\n\n*   Key Type: Map allows keys\
    \ of any type, including objects and functions.\n\n*   Order: Map maintains the\
    \ order of key-value pairs.\n\n*   Size Property: Map has a size property to get\
    \ the number of entries.\n\n// Example:\n\n// Using a Map\n\nconst myMap = new\
    \ Map();\n\nmyMap.set('name', 'John');\n\nmyMap.set(42, 'Answer to the Ultimate\
    \ Question'); console.log(myMap.get('name')); // Outputs: John \n\n// Using a\
    \ regular object\n\nconst myObject = {\n\n name: 'John',\n\n 42: 'Answer to the\
    \ Ultimate Question'\n\n};\n\nconsole.log(myObject['name']); // Outputs: John\
    \   \n\nIn this example, myMap and myObject both store key-value pairs, but myMap\
    \ has more flexibility.\n\n# 98\\. What is the purpose of the \"WeakMap\" and\
    \ \"WeakSet\" objects in JavaScript?\n\nExplanation: WeakMap and WeakSet are specialized\
    \ objects in JavaScript designed for use cases where you want to associate additional\
    \ data with objects without preventing the objects from being garbage-collected.\n\
    \nAnalogy:\n\nConsider a sticky note attached to an item; a WeakMap is like a\
    \ sticky note that won't prevent the item from being discarded if no other references\
    \ exist.\n\nKey Characteristics:\n\n*   Entries in WeakMap are weakly held, allowing\
    \ associated objects to be garbage-collected.\n\n*   WeakSet holds weak references\
    \ to objects, ensuring they can be garbage-collected.\n\n// Example:\n\n// Using\
    \ WeakMap\n\nconst secretKey = new WeakMap();\n\nconst object = {}; \n\nsecretKey.set(object,\
    \ 'sensitive data');\n\nconsole.log(secretKey.get(object)); // Outputs: sensitive\
    \ data \n\n// Using WeakSet\n\nconst weakSet = new WeakSet();\n\nconst obj1 =\
    \ { name: 'John' };\n\nconst obj2 = { name: 'Jane' }; \n\nweakSet.add(obj1);\n\
    \nweakSet.add(obj2); \n\nconsole.log(weakSet.has(obj1)); // Outputs: true\n\n\
    obj1 = null; // obj1 can be garbage-collected console.log(weakSet.has(obj1));\
    \ // Outputs: false   "
