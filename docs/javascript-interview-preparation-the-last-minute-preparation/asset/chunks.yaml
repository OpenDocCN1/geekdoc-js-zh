  trans: "\n\n# 91. \"WebSockets\" API 与传统的 HTTP 通信有何区别？\n\n解释：`WebSockets API` 在单个长连接上提供了一个全双工通信通道。与遵循请求响应模型的传统\
    \ HTTP 通信不同，WebSockets 允许双向通信，实现了客户端与服务器之间的实时数据交换。\n\n类比：\n\n将传统的 HTTP 想象成通过邮寄寄信。你发送一个请求，接收者用响应回复。WebSockets\
    \ 就像电话，，双方都可以随时说话和倾听。\n\n主要区别：\n\n- 连接类型：HTTP 是无状态且无连接的，而 WebSockets 维持着持久的全双工连接。\n\
    - 延迟：WebSockets 通过消除了每次通信都需建立新连接的需求，降低了延迟。\n- 使用场景：HTTP 适用于请求-响应场景，而 WebSockets\
    \ 擅于聊天、游戏和实时更新等实时应用。\n\n# 92. JavaScript 中“可变（mutable）”和“不可变（immutable）”数据类型之间的区别是什么？\n\
    \n解释：在 JavaScript 中，“可变”和“不可变”指的是数据在创建后是否可以被修改。可变数据类型允许修改，而不可变数据类型一旦创建就无法被更改。\n\
    \n类比：\n\n将可变数据想象成白板；你可以擦掉并重写信息。不可变数据就像在石头上刻字；一旦刻在那里，你就无法更改它，但可以创建一个新的。\n\n示例：\n\
    \n- 可变：数组和对象可以在创建后被修改。\n- 不可变：字符串和数字不能更改；操作会创建新值。\n\n# 93. 解释 \"Promise.all\"\
    \ 方法在处理多个 promise 中的作用。\n\n解释：`Promise.all` 是 JavaScript 中的一个方法，接收一个 Promise 数组并返回一个新的\
    \ Promise。当所有输入的 Promise 都解析时，该新 Promise 将以所有解析值的数组的形式完成；如果有第一个被拒绝的 Promise，它将以该原因被拒绝。\n\
    \n类比：\n\n想象一个团队项目，每个团队成员负责一项任务。`Promise.all` 通过等待所有成员完成任务后再宣布项目完成，从而确保项目的成功。\n\
    \n```javascript\nconst promise1 = fetch('https://api.example.com/data/1');\n\n\
    const promise2 = fetch('https://api.example.com/data/2'); \n\nPromise.all([promise1,\
    \ promise2])\n  .then(responses => {\n    // 两个 promise 都成功解析\n    console.log(responses);\n\
    \  })\n  .catch(error => {\n    // 至少有一个 promise 被拒绝\n    console.error(error);\n\
    \  });\n```\n\n在此示例中，`Promise.all` 确保只有当 promise 都成功解析时，才会执行 `.then` 块中的代码。\n\n\
    # 94. \"防抖（debounce）\"模式是如何提高 JavaScript 应用性能的？\n\n解释：`debounce` 是一种限制函数调用频率的技术，特别是在响应滚动或打字等快速事件时。它通过推迟函数的执行，直到距离上次调用通过了一段时间后，来提高性能。\n\
    \n类比：\n\n想象正在输入查询语句；防抖就像是在执行搜索之前等待简短的停顿。它防止了不必要的中间搜索并增强了用户体验。\n\n```javascript\n\
    function debounce(func, delay) {\n  let timeoutId; \n  return function (...args)\
    \ {\n    clearTimeout(timeoutId);\n    timeoutId = setTimeout(() => func(...args),\
    \ delay);\n  };\n} \n\nconst searchFunction = debounce(query => {\n  // 执行搜索操作\n\
    \  console.log(`Searching for: ${query}`);\n}, 300); \n\n// 使用\nsearchFunction('JavaScript');\n\
    searchFunction('Web Development');\n// 在最后一次调用 300ms 后，仅触发一次搜索操作   \n```\n\n在此示例中，`debounce`\
    \ 函数确保搜索操作只在简短的停顿后才执行。\n\n# 95. JavaScript 中 \"document.readyState\" 属性的用途是什么？\n\
    \n解释：`document.readyState` 属性指示文档的加载状态。它告知文档是在加载中、已完全加载还是处于交互状态。\n\n类比：\n\n想象一本书；`document.readyState`\
    \ 就像检查书籍是否仍在打印中、已打印完毕或已打开供阅读。\n\n可能的值：\n\n- \"loading\"：文档正在加载。\n- \"interactive\"\
    ：文档已完成加载并准备好交互。\n- \"complete\"：文档及其资源已完全加载。\n\n```javascript\ndocument.addEventListener('readystatechange',\
    \ () => {\n  console.log(document.readyState);\n});\n```\n\n在此示例中，代码会在加载过程中状态发生变化时记录文档的就绪状态。\n\
    \n# 96. 解释 DOM 中的“事件冒泡（event bubbling）”概念。\n\n解释：事件冒泡是 DOM 事件流中的阶段，事件从触发它的目标元素开始，然后通过\
    \ DOM 树中的祖先元素向上冒泡。这使得祖先元素能够对同一个事件做出反应。\n\n类比：\n\n想象向水里丢入一颗石子；涟漪（事件）不仅会到达石子掉落点，还会向外扩散，影响周围区域。\n\
    \n```html\n<div id=\"parent\">\n  <button id=\"child\">点击我!</button>\n</div> \n\
    \n<script>\ndocument.getElementById('parent').addEventListener('click', () =>\
    \ {\n  console.log('父元素被点击!');\n}); \n\ndocument.getElementById('child').addEventListener('click',\
    \ () => {\n  console.log('子元素被点击!');\n});\n</script>\n```\n\n在此示例中，由于事件冒泡，点击“点击我！”按钮会同时触发子元素和父元素的点击事件。\n\
    \n# 97. Map 对象与普通对象有什么区别？\n\n解释：`Map` 对象在 JavaScript 中是一种允许存储键值对的数据结构，相比普通对象，`Map`\
    \ 的键可以是任何类型。\n\n类比：\n\n将普通对象想象成带有单词（键）和定义（值）的字典。Map 是扩展后的字典。\n\n主要区别：\n\n字体 键类型：Map\
    \ 允许任何类型的键，包括对象和函数。\n- 顺序：Map 保持键值对的顺序。\n- 大小属性：Map 有 `size` 属性来获取条目数量。\n\n```javascript\n\
    // 使用 Map\nconst myMap = new Map();\nmyMap.set('name', 'John');\nmyMap.set(42,\
    \ 'Answer to the Question'); \nconsole.log(myMap.get('name')); // 输出: John \n\n\
    // 使用普通对象\nconst myObject = {\n  name: 'John',\n  42: 'Answer to the Question'\n\
    };\nconsole.log(myObject['name']); // 输出: John\n```\n\n在此示例中，`myMap` 和 `myObject`\
    \ 都存储键值对，但 `Map` 更灵活。\n\n# 98. JavaScript 中 \"WeakMap\" 和 \"WeakSet\" 对象的用途是什么？\n\
    \n解释：`WeakMap` 和 `WeakSet` 是 JavaScript 中的特殊对象，适用于希望与对象关联额外数据但又不防止对象被垃圾回收的场景。\n\
    \n类比：\n\n考虑贴在物品上的便利贴；`WeakMap` 就像一张便利贴，如果没有其他引用，它不会防止该物品被丢弃。\n\n特性：\n\n- `WeakMap`\
    \ 中的条目是弱引用的，允许关联的对象被垃圾回收。\n- `WeakSet` 持有对象的弱引用，确保它们可以被垃圾回收。\n\n```javascript\n\
    // 使用 WeakMap\nconst secretKey = new WeakMap();\nconst object = {}; \nsecretKey.set(object,\
    \ 'sensitive data');\nconsole.log(secretKey.get(object)); // 输出: sensitive data\
    \ \n\n// 使用 WeakSet\nconst weakSet = new WeakSet();\nconst obj1 = { name: 'John'\
    \ };\nconst obj2 = { name: 'Jane' }; \nweakSet.add(obj1);\nweakSet.add(obj2);\
    \ \nconsole.log(weakSet.has(obj1)); // 输出: true\n\nobj1 = null; // obj1 可以被垃圾回收\
    \ \nconsole.log(weakSet.has(obj1)); // 输出: false\n```\n\n"
- fmt: "\nIn this example, using `WeakMap` and `WeakSet` allows associated data to\
    \ be tied to objects without preventing their disposal.\n\n# 99. How does the\
    \ \"Immutable.js\" library help with managing immutable data structures?\n\nExplanation:\
    \ The `Immutable.js` library is designed to facilitate the creation and manipulation\
    \ of immutable data structures in JavaScript. Immutable data structures, once\
    \ created, cannot be changed. Instead, any operation results in the creation of\
    \ a new structure.\n\nAnalogy:\nThink of a snapshot in time; `Immutable.js` helps\
    \ you take snapshots of data, preserving historical states without altering the\
    \ original.\n\nKey Features:\n* Persistent Data Structures: Operations on `Immutable.js`\
    \ structures don't modify the existing structure but return a new one.\n* Efficient\
    \ Updates: Only changed parts of the data structure are replaced, making updates\
    \ more efficient.\n* Preventing Mutations: Helps avoid unintentional data mutations.\n\
    \nExample:\n```javascript\nconst { Map } = require('immutable');\n\nconst originalMap\
    \ = Map({ key: 'value' });\n\nconst updatedMap = originalMap.set('newKey', 'newValue');\
    \ \n\nconsole.log(originalMap.get('newKey')); // Outputs: undefined\n\nconsole.log(updatedMap.get('newKey'));\
    \ // Outputs: newValue   \n```\n\nIn this example, `Immutable.js` ensures that\
    \ modifying `originalMap` creates a new map, leaving the original unaltered.\n\
    \n# 100. How does the \"Promise.race\" function work, and when might it be useful?\n\
    \nExplanation: `Promise.race` is a method that takes an iterable of promises and\
    \ returns a new promise. This new promise resolves or rejects as soon as the first\
    \ promise in the iterable resolves or rejects.\n\nAnalogy:\nImagine a race where\
    \ multiple runners (promises) compete. `Promise.race` declares a winner (resolves\
    \ or rejects) based on the first runner to finish.\n\nExample:\n```javascript\n\
    const promise1 = new Promise(resolve => setTimeout(() => resolve('Winner!'), 1000));\n\
    \nconst promise2 = new Promise((_, reject) => setTimeout(() => reject('Loser!'),\
    \ 500)); \n\nPromise.race([promise1, promise2])\n  .then(result => console.log(result))\
    \ // Outputs: Loser!\n  .catch(error => console.error(error)); // Outputs: Loser!\n\
    ```\n\nIn this example, `Promise.race` resolves or rejects based on the first\
    \ promise to settle, helping optimize response times.\n"
