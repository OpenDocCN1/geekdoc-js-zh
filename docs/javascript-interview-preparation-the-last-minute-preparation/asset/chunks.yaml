    \ Example:\n\n```javascript\nconst multiplyByTwo = function(x) {\n  return x *\
    \ 2;\n}; \n\nfunction processNumber(num, operation) {\n  return operation(num);\n\
    } \n\nconst result = processNumber(5, multiplyByTwo); // Outputs: 10\n```\n\n\
