  trans: "\n\n将“展开”（spread）运算符想象为从一个配方拷贝食材到另一个。它从一个数组中提取元素或从一个对象提取属性，并将它们展开到一个新的数组或对象中。\n\
    \n// 示例：\n\n```javascript\nconst originalArray = [1, 2, 3];\nconst newArray =\
    \ [...originalArray, 4, 5]; \nconsole.log(newArray); // 输出: [1, 2, 3, 4, 5]  \
    \ \n```\n\n在这个示例中，“展开”运算符用于通过展开 `originalArray` 的元素并附加额外的元素来创建一个新数组。\n\n# 82.\
    \ JavaScript 事件循环如何处理不同优先的任务？\n\n解释：JavaScript 事件循环负责执行代码、处理事件和管理任务。具有不同优先的任务被放置在不同的队列中，事件循环按照特定的顺序处理它们：回调队列、微任务队列和动画帧。\n\
    \n类比：\n\n想象一个正在管理任务的多任务秘书。高优先级任务位于待办列表的最顶端，确保紧急事项首先处理，然后是重要性稍低的任务。\n\n// 示例：\n\
    \n```javascript\nsetTimeout(() => console.log('Task 1'), 0);\nPromise.resolve().then(()\
    \ => console.log('Task 2'));\nconsole.log('Task 3');   \n```\n\n在这个示例中，尽管 `Task\
    \ 1` 的超时时间为 0，但它会进入回调队列，而微任务队列处理 `Task 2`。`Task 3` 是主执行栈的一部分。\n\n# 83. 解释网络安全中“同源策略”的概念。\n\
    \n解释：同源策略是网络浏览器实现的一种安全措施。它限制网页向与提供该页面的不同的域名发送请求，以防止潜在的安全漏洞，如跨站脚本攻击 (XSS) 和跨站请求伪造\
    \ (CSRF)。\n\n类比：\n\n将同源策略想象成俱乐部的入场策略。只有来自同一俱乐部（源）的客人才允许进入，以防止不受欢迎的客人进入。\n\n示例：\n\
    \n来自 `https://example.com` 的脚本受到同源策略限制，无法向 `https://api.example2.com` 发请求。\n\n\
    # 84. JavaScript 中“记忆化”（memoization）技术的目的是什么？\n\n解释：记忆化是一种通过根据输入参数缓存函数结果来优化函数性能的技术。如果再次遇到相同的输入，则返回缓存的结果而不是重新计算函数。\n\
    \n类比：\n\n想象一个带有内存功能的计算器。如果你执行了一次计算并并在稍后重复它，你可以使用内存而不是再次执行这些步骤。\n\n// 示例：\n\n```javascript\n\
    const memoizedFunction = (function () {\n  const cache = {}; \n  return function\
    \ (arg) {\n    if (arg in cache) {\n      return cache[arg];\n    } else {\n \
    \     const result = expensiveOperation(arg);\n      cache[arg] = result;\n  \
    \    return result;\n    }\n  };\n})();   \n```\n\n在这个示例中，`memoizedFunction` 缓存了结果，避免了对相同参数的冗余计算。\n\
    \n# 85. JavaScript 中的 `reduce` 函数是如何工作的？你能提供一个示例吗？\n\n解释：JavaScript 中的 `reduce`\
    \ 函数用于将数组的值累加为单个结果。它接受一个回调函数和一个初始值，将回调应用到每个元素上并累加结果。\n\n类比：\n\n将 `reduce` 想象成厨师在准备菜时组合食材。每种食材（数组元素）都会经过处理，最终结果就是完成的菜肴。\n\
    \n// 示例：\n\n```javascript\nconst numbers = [1, 2, 3, 4, 5]; \nconst sum = numbers.reduce((accumulator,\
    \ current) => accumulator + current, 0); \nconsole.log(sum); // 输出: 15   \n```\n\
    \n在这个示例中，`reduce` 函数从初始值 0 开始计算数组中数字之和。\n\n# 86. 解释 JavaScript 中“柯里化”（currying）的概念。\n\
    \n解释：柯里化是函数式编程中的一种技术，将具有多个参数的函数转换为一系列函数，每个函数只接受一个参数。它允许函数的部分应用，创建更具重用性和可组合的代码。\n\
    \n类比：\n\n将柯里化考虑为制作披萨的过程。不是一次性做好整张披萨，而是单独准备每一层，使其更容易自定义。\n\n// 示例：\n\n```javascript\n\
    const curryAdd = a => b => a + b; \nconst add5 = curryAdd(5);\nconsole.log(add5(3));\
    \ // 输出: 8   \n```\n\n在这个示例中，`curryAdd` 将一个两个参数的加法函数转换为柯里化函数，实现了部分应用。\n\n# 87.\
    \ 内容安全策略（CSP）在 Web 开发中有什么意义？\n\n解释：内容安全策略 (CSP) 是一种安全标准，有助于防止各种类型的攻击，例如跨站脚本攻击\
    \ (XSS)。它允许 Web 开发者声明哪些内容源被认为是信任的是可以执行的。\n\n类比：\n\n将 CSP 想象成在建筑处检查入口权限的安保。只有获得批准的个人（信任源）才允许进入，从而降低未经授权访问的风险。\n\
    \n示例：\n\n如 `Content-Security-Policy: script-src 'self'` 的 CSP 头部确保脚本仅在来自同源时才执行。\n\
    \n# 88. JavaScript 如何处理变量作用域？\n\n解释：变量作用域定义了变量何时可以访问。JavaScript 有函数作用域、块作用域和全局作用域。\n\
    \n类比：\n\n将变量作用域想象成房子里的房间。每个房间代表不同的作用域，放在其中的变量仅在房间内访问。\n\n// 示例：\n\n```javascript\n\
    function exampleScope() {\n  if (true) {\n    var x = 10; // var 是函数作用域\n    let\
    \ y = 20; // let 是块作用域\n    const z = 30; // const 是块作用域\n  }\n  console.log(x);\
    \ // 输出: 10\n  // console.log(y); // 错误：y 未定义 (块作用域)\n  // console.log(z); //\
    \ 错误：z 未定义 (块作用域)\n}\nexampleScope();\n```\n\n在这个示例中，`x` 因为是函数作用域可以在块外部访问，而 `y`\
    \ 和 `z` 是块作用域的。\n\n# 89. JavaScript 中 `Proxy` 对象的目的是什么？\n\n解释：JavaScript 中的 `Proxy`\
    \ 对象用于为对象上的基础操作（如属性访问、赋值、枚举等）创建自定义行为。它允许对这些操作进行拦截和自定义。\n\n类比：\n\n将 Proxy 想象成一个管理请求的私人助理。你不是直接对象交互，而是将请求委托给助理，助理可以修改、拒绝或增强这些请求。\n\
    \n// 示例：\n\n```javascript\nconst handler = {\n  get: function (target, property)\
    \ {\n    return property in target ? target[property] : 'Property not found!';\n\
    \  }\n}; \n\nconst person = new Proxy({}, handler);\nperson.name = 'John'; \n\
    console.log(person.name); // 输出: John\nconsole.log(person.age); // 输出: Property\
    \ not found!\n```\n\n在这个示例中，`Proxy` 拦截了属性访问并为不存在的属性提供了自定义响应。\n\n# 90. 解释 IIFE（立即调用函数表达式）模式。\n\
    \n解释：IIFE 是一种 JavaScript 模式，函数在创建后立即执行。它经常用于创建私有域作用域域污染全局作用域。\n\n类比：\n\n将 IIFE\
    \ 想象成个人气泡。你在气泡内活动，完成后将其戳破。气泡内的活动和变量不会影响外部环境。\n\n// 示例：\n\n```javascript\n(function\
    \ () {\n  // 私有作用域\n  const secretNumber = 42;\n  console.log(secretNumber);\n\
    })(); // 立即执行\n\n// console.log(secretNumber); // 错误：secretNumber 未定义   \n```\n\
    \n在这个示例中，IIFE 封装了 `secretNumber`，使其在函数外部无法访问。\n\n"
- fmt: "\n# 91. How does the \"WebSockets\" API differ from traditional HTTP communication?\n\
    \nExplanation: The `WebSockets API provides a full-duplex communication channel\
    \ over a single, long-lived connection. Unlike traditional HTTP communication,\
    \ which follows a request-response model, WebSockets allow bidirectional communication,\
    \ enabling real-time data exchange between clients and servers.\n\nAnalogy:\n\n\
    Think of traditional HTTP as sending letters by mail. You send a request, and\
    \ the recipient replies with a response. WebSockets are like a phone call, where\
    \ both parties can speak and listen at any time.\n\nKey Differences:\n\n- Connection\
    \ Type: HTTP is stateless and connectionless, while WebSockets maintain a persistent,\
    \ full-duplex connection.\n- Latency: WebSockets reduce latency by eliminating\
    \ the need to establish a new connection for each communication.\n- Usage: HTTP\
    \ is suitable for request-response scenarios, while WebSockets excel in real-time\
    \ applications like chat, gaming, and live updates.\n\n# 92. What is the difference\
    \ between \"mutable\" and \"immutable\" data types in JavaScript?\n\nExplanation:\
    \ In JavaScript, \"mutable\" and \"immutable\" refer to whether the data can be\
    \ changed after creation. Mutable data types allow modifications, while immutable\
    \ data types, once created, cannot be altered.\n\nAnalogy:\n\nConsider mutable\
    \ data like a whiteboard; you can erase and rewrite information. Immutable data\
    \ is like carving information on stone; once it's there, you can't change it but\
    \ can create a new one.\n\nExample:\n\n- Mutable: Arrays and objects can be modified\
    \ after creation.\n- Immutable: Strings and numbers cannot be changed; operations\
    \ create new values.\n\n# 93. Explain the role of the \"Promise.all\" method in\
    \ handling multiple promises.\n\nExplanation: `Promise.all` is a method in JavaScript\
    \ that takes an array of promises and returns a new promise. This new promise\
    \ fulfills with an array of resolved values when all input promises are resolved\
    \ or rejects with the reason of the first rejected promise.\n\nAnalogy:\n\nThink\
    \ of a team project where each team member is responsible for a task. `Promise.all`\
    \ ensures the success of the project by waiting for all members to complete their\
    \ tasks before declaring the project done.\n\n```javascript\nconst promise1 =\
    \ fetch('https://api.example.com/data/1');\n\nconst promise2 = fetch('https://api.example.com/data/2');\
    \ \n\nPromise.all([promise1, promise2])\n  .then(responses => {\n    // Both promises\
    \ resolved successfully\n    console.log(responses);\n  })\n  .catch(error =>\
    \ {\n    // At least one promise rejected\n    console.error(error);\n  });\n\
    ```\n\nIn this example, `Promise.all` ensures that the code inside the `.then`\
    \ block is executed only when both promises are resolved successfully.\n\n# 94.\
    \ How does the \"debounce\" pattern improve performance in JavaScript applications?\n\
    \nExplanation: The `debounce` pattern is a technique that limits the rate at which\
    \ a function is invoked, especially in response to rapid events like scrolling\
    \ or typing. It improves performance by postponing the execution of the function\
    \ until a certain time has passed since the last invocation.\n\nAnalogy:\n\nImagine\
    \ typing a search query; debounce is like waiting for a brief pause before performing\
    \ the search. It prevents unnecessary intermediate searches and enhances the user\
    \ experience.\n\n```javascript\nfunction debounce(func, delay) {\n  let timeoutId;\
    \ \n  return function (...args) {\n    clearTimeout(timeoutId);\n    timeoutId\
    \ = setTimeout(() => func(...args), delay);\n  };\n} \n\nconst searchFunction\
    \ = debounce(query => {\n  // Perform search operation\n  console.log(`Searching\
    \ for: ${query}`);\n}, 300); \n\n// Usage\nsearchFunction('JavaScript');\nsearchFunction('Web\
    \ Development');\n// Only one search operation is triggered after 300ms from the\
    \ last invocation   \n```\n\nIn this example, the `debounce` function ensures\
    \ that the search operation is executed only after a brief pause.\n\n# 95. What\
    \ is the purpose of the \"document.readyState\" property in JavaScript?\n\nExplanation:\
    \ The `document.readyState` property indicates the loading status of the document.\
    \ It informs whether the document is still loading, fully loaded, or in an interactive\
    \ state.\n\nAnalogy:\n\nThink of a book; `document.readyState` is like checking\
    \ whether the book is still being printed, fully printed, or open for reading.\n\
    \nPossible Values:\n\n- \"loading\": The document is still loading.\n- \"interactive\"\
    : The document has finished loading and is ready for interaction.\n- \"complete\"\
    : The document and its resources are fully loaded.\n\n```javascript\ndocument.addEventListener('readystatechange',\
    \ () => {\n  console.log(document.readyState);\n});\n```\n\nIn this example, the\
    \ code logs the document's ready state as it changes during the loading process.\n\
    \n# 96. Explain the concept of \"event bubbling\" in the DOM.\n\nExplanation:\
    \ Event bubbling is a phase in the DOM event flow where an event starts from the\
    \ target element that triggered it and then bubbles up through its ancestors in\
    \ the DOM tree. This allows ancestor elements to react to the same event.\n\n\
    Analogy:\n\nImagine dropping a pebble in water; the ripples (event) not only reach\
    \ the point where the pebble fell but also spread outwards, affecting the surrounding\
    \ areas.\n\n```html\n<div id=\"parent\">\n  <button id=\"child\">Click me!</button>\n\
    </div> \n\n<script>\ndocument.getElementById('parent').addEventListener('click',\
    \ () => {\n  console.log('Parent clicked!');\n}); \n\ndocument.getElementById('child').addEventListener('click',\
    \ () => {\n  console.log('Child clicked!');\n});\n</script>\n```\n\nIn this example,\
    \ clicking the \"Click me!\" button triggers both the child and parent click events\
    \ due to event bubbling.\n\n# 97. How does the \"Map\" object differ from a regular\
    \ JavaScript object?\n\nExplanation: The `Map` object in JavaScript is a data\
    \ structure that allows you to store key-value pairs with some advantages over\
    \ regular objects. Unlike objects, `Map` keys can be of any data type, and the\
    \ order of key-value pairs is maintained.\n\nAnalogy:\n\nThink of a regular object\
    \ like a dictionary with words (keys) and definitions (values). A `Map` is like\
    \ an expanded dictionary where the order of entries is preserved, and the words\
    \ can be anything.\n\nKey Differences:\n\n- Key Type: `Map` allows keys of any\
    \ type, including objects and functions.\n- Order: `Map` maintains the order of\
    \ key-value pairs.\n- Size Property: `Map` has a `size` property to get the number\
    \ of entries.\n\n```javascript\n// Using a Map\nconst myMap = new Map();\nmyMap.set('name',\
    \ 'John');\nmyMap.set(42, 'Answer to the Ultimate Question'); \nconsole.log(myMap.get('name'));\
    \ // Outputs: John \n\n// Using a regular object\nconst myObject = {\n  name:\
    \ 'John',\n  42: 'Answer to the Ultimate Question'\n};\nconsole.log(myObject['name']);\
    \ // Outputs: John\n```\n\nIn this example, `myMap` and `myObject` both store\
    \ key-value pairs, but `myMap` has more flexibility.\n\n# 98. What is the purpose\
    \ of the \"WeakMap\" and \"WeakSet\" objects in JavaScript?\n\nExplanation: `WeakMap`\
    \ and `WeakSet` are specialized objects in JavaScript designed for use cases where\
    \ you want to associate additional data with objects without preventing the objects\
    \ from being garbage-collected.\n\nAnalogy:\n\nConsider a sticky note attached\
    \ to an item; a `WeakMap` is like a sticky note that won't prevent the item from\
    \ being discarded if no other references exist.\n\nKey Characteristics:\n\n- Entries\
    \ in `WeakMap` are weakly held, allowing associated objects to be garbage-collected.\n\
    - `WeakSet` holds weak references to objects, ensuring they can be garbage-collected.\n\
    \n```javascript\n// Using WeakMap\nconst secretKey = new WeakMap();\nconst object\
    \ = {}; \nsecretKey.set(object, 'sensitive data');\nconsole.log(secretKey.get(object));\
    \ // Outputs: sensitive data \n\n// Using WeakSet\nconst weakSet = new WeakSet();\n\
    const obj1 = { name: 'John' };\nconst obj2 = { name: 'Jane' }; \nweakSet.add(obj1);\n\
    weakSet.add(obj2); \nconsole.log(weakSet.has(obj1)); // Outputs: true\n\nobj1\
    \ = null; // obj1 can be garbage-collected \nconsole.log(weakSet.has(obj1)); //\
    \ Outputs: false\n```\n"
