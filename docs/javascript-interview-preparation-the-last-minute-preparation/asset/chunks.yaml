  trans: "\n\n```javascript\nconst shallowCopy = { ...original };\n\n// Deep copy\
    \ (using a library like lodash)\n\nconst deepCopy = _.cloneDeep(original);\n```\n\
    \n在示例中，浅拷贝后修改 `original.b.c` 会影响 `shallowCopy`，而深拷贝则保持两个对象相互独立。\n\n# 72. \"async/await\"\
    \ 特性是如何简化 JavaScript 中的异步代码的？\n\n解释：JavaScript 中的 `async/await` 特性简化了使用 `Promises`\
    \ 处理异步代码的语法。`async` 用于定义一个返回 `Promise` 的函数，而 `await` 用于暂停执行，直到 `Promise` 状态确定（settled）。\n\
    \n类比：\n\n将 `async/await` 想象成读一本菜谱。在等待某个特定食材煮好的同时，你可以开始准备下一个食材。\n\n示例：\n\n```javascript\n\
    async function fetchData() {\n  return new Promise(resolve => {\n    setTimeout(()\
    \ => {\n      resolve('Fetched data');\n    }, 1000);\n  });\n}\n\nasync function\
    \ fetchDataAndPrint() {\n  const data = await fetchData();\n  console.log(`Data:\
    \ ${data}`);\n}\n\nfetchDataAndPrint();\n```\n\n在此示例中，`fetchDataAndPrint` 等待 `fetchData`\
    \ `Promise` 解析，使得代码看起来更同步且更具可读性。\n\n# 73. 解释 JavaScript 中的记忆化（memoization）概念。\n\
    \n解释：记忆化是一种技术，通过缓存昂贵函数调用的结果，以便当再次出现相同输入时，将返回缓存的结果而不是重新执行函数。\n\n类比：\n\n将记忆化想象成一个厨师记录菜谱及其结果。如果厨师以前做过某道特定的菜，他们会检查记录，看是否可以复用结果。\n\
    \n示例：\n\n```javascript\nconst memoizedFunction = (function () {\n  const cache\
    \ = {};\n\n  return function (arg) {\n    if (arg in cache) {\n      return cache[arg];\n\
    \    } else {\n      const result = expensiveOperation(arg);\n      cache[arg]\
    \ = result;\n      return result;\n    }\n  };\n})();\n```\n\n在此示例中，`memoizedFunction`\
    \ 根据输入 `arg` 缓存结果，避免了相同参数的冗余计算。\n\n# 74. JavaScript 中 \"try/catch\" 语句的目的是什么？\n\
    \n解释：`try/catch` 语句用于处理 JavaScript 中的异常（错误）。`try` 块中的代码会被执行，如果发生错误，它会在 `catch`\
    \ 块中被捕获并处理。\n\n类比：\n\n将 `try/catch` 想象成带着安全网开车。如果你在道路上遇到意外的障碍，安全网（`catch` 块）会帮助你处理这种情况。\n\
    \n示例：\n\n```javascript\ntry {\n  // 可能会出错误的代码\n  const result = calculateResult();\n\
    \  console.log(`Result: ${result}`);\n} catch (error) {\n  // 处理错误\n  console.error(`Error:\
    \ ${error.message}`);\n}\n```\n\n在此示例中，如果在执行 `calculateResult` 期间发生错误，它将在 `catch`\
    \ 块中被捕获并记录。\n\n# 75. Web 开发中 \"localStorage\" 和 \"sessionStorage\" 有什么区别？\n\n\
    解释：`localStorage` 和 `sessionStorage` 都是 Web 存储选项，但它们在持久性和范围上不同。`localStorage`\
    \ 在浏览器关闭后数据依然存在，并且可以在浏览器标签页间访问；而 `sessionStorage` 数据仅在页面会话期间持久，并且针对特定标签页。\n\n\
    类比：\n\n将 `localStorage` 视为长期记忆，你可以在其中存储信息以备将来参考。`sessionStorage` 类似于短期记忆，用于在特定任务期间临时存储信息。\n\
    \n示例：\n\n```javascript\n// 在 localStorage 中存储数据\nlocalStorage.setItem('user',\
    \ 'John');\n\n// 在 sessionStorage 中存储数据\nsessionStorage.setItem('token', 'abc123');\n\
    ```\n\n在此示例中，即使用户关闭并稍后打开浏览器，存储在 `localStorage` 中的数据也会存在。`sessionStorage` 中的数据仅在同一个会话中可用。\n\
    \n# 76. 函数声明（function declaration）和函数表达式（function expression）之间的区别是什么？\n\n解释：函数声明使用\
    \ `function` 关键字定义函数，并会被提升到其作用域的顶部。函数表达式是作为表达式的一部分创建一个函数，并且不会被提升。\n\n类比：\n\n将函数声明想象成菜谱中一个独立的菜谱。你可以在菜谱的任何地方引用它。函数表达式就像嵌入句子中的菜谱；你只能在提到它后才能使用它。\n\
    \n示例：\n\n```javascript\n// 函数声明\nfunction add(a, b) {\n  return a + b;\n}\n\n\
    // 函数表达式\nconst subtract = function(a, b) {\n  return a - b;\n};\n```\n\n在此示例中，`add`\
    \ 是函数声明，而 `subtract` 是赋值给变量的函数表达式。\n\n# 77. 解释 JavaScript 中“事件委托”（Event Delegation）模式的作用。\n\
    \n解释：事件委托是一种模式，将单个事件监听器附加到多个元素的公共祖先上。它利用事件冒泡处理子元素上的事件，而无需为每个子元素单独附加监听器。\n\n类比：\n\
    \n想象老师指派一名代表来收集反馈。老师不需要与每个学生交谈，而是与代表交谈，由代表传达反馈。\n\n示例：\n\n* 项目 1\n* 项目 2\n* 项目\
    \ 3\n\n在此示例中，单个点击事件监听器附加到 `ul` 元素上，通过事件委托处理 `li` 的点击。\n\n# 78. 如何在 JavaScript\
    \ 中处理异步代码中的错误？\n\n解释：在异步代码中的错误可以通过 `try/catch` 块来处理。使用 `await` 时，`try/catch` 可以捕获拒绝的\
    \ Promise。\n\n类比：\n\n处理异步错误就像等待交付。你可以使用 `try/catch` 处理意外情况。\n\n示例：\n\n```javascript\n\
    async function fetchData() {\n  try {\n    const response = await fetch('https://api.example.com/data');\n\
    \    const data = await response.json();\n    console.log(data);\n  } catch (error)\
    \ {\n    console.error(`Error fetching data: ${error.message}`);\n  }\n}\n```\n\
    \n在此示例中，`try/catch` 处理了数据获取过程。\n\n# 79. \"fetch\" API 的目的是什么？它是如何用于 HTTP 请求的？\n\
    \n解释：`fetch` API 用于在 JavaScript 中发送 HTTP 请求。它返回一个 `Promise`，该 Promise 解析为请求的 `Response`。\n\
    \n类比：\n\n将 `fetch` 想象成给朋友写信。你发送信件并等待回复，回复可能包含请求的信息。\n\n示例：\n\n```javascript\n\
    fetch('https://api.example.com/data')\n  .then(response => response.json())\n\
    \  .then(data => console.log(data))\n  .catch(error => console.error(`Error fetching\
    \ data: ${error.message}`));\n```\n\n在此示例中，`fetch` 函数用于发送请求，随后的 `.then()` 和 `.catch()`\
    \ 块处理响应。\n\n# 80. 解释 \"RESTful\" API 的概念。\n\n解释：RESTful API（表现状态转移）是一种用于设计网络应用的架构风格。它使用一组约束来实现客户端和服务器之间扩展且无状态的通信。\n\
    \n类比：\n\n将 RESTful API 考虑为餐厅的菜单。菜单提供了清晰选项（端点），每个订单（HTTP 请求）都是独立的，允许厨房（服务器）专注于烹饪而无需记住之前的订单。\n\
    \n示例：\n\nRESTful API 可能包含类似 `/users`（获取用户列表）或 `/products/123`（获取特定产品详情）的端点。\n\n"
- fmt: "\nThink of the \"spread\" operator as copying ingredients from one recipe\
    \ to another. It takes elements from one array or properties from one object and\
    \ spreads them into a new array or object.\n\n// Example:\n\n```javascript\nconst\
    \ originalArray = [1, 2, 3];\nconst newArray = [...originalArray, 4, 5]; \nconsole.log(newArray);\
    \ // Outputs: [1, 2, 3, 4, 5]   \n```\n\nIn this example, the \"spread\" operator\
    \ is used to create a new array by spreading the elements of `originalArray` and\
    \ appending additional elements.\n\n# 82. How does the JavaScript event loop handle\
    \ tasks with different priorities?\n\nExplanation: The JavaScript event loop is\
    \ responsible for executing code, handling events, and managing tasks. Tasks with\
    \ different priorities are placed in different queues, and the event loop processes\
    \ them in a specific order: the callback queue, microtask queue, and animation\
    \ frame.\n\nAnalogy:\n\nImagine a multitasking secretary managing tasks. High-priority\
    \ tasks go to the top of the to-do list, ensuring urgent matters are addressed\
    \ first, followed by less critical tasks.\n\n// Example:\n\n```javascript\nsetTimeout(()\
    \ => console.log('Task 1'), 0);\nPromise.resolve().then(() => console.log('Task\
    \ 2'));\nconsole.log('Task 3');   \n```\n\nIn this example, even though `Task\
    \ 1` has a timeout of 0, it goes to the callback queue, while the microtask queue\
    \ handles `Task 2`. `Task 3` is part of the main execution stack.\n\n# 83. Explain\
    \ the concept of the same-origin policy in web security.\n\nExplanation: The same-origin\
    \ policy is a security measure implemented by web browsers. It restricts web pages\
    \ from making requests to a different domain than the one that served the web\
    \ page, preventing potential security vulnerabilities like Cross-Site Scripting\
    \ (XSS) and Cross-Site Request Forgery (CSRF).\n\nAnalogy:\n\nThink of the same-origin\
    \ policy as a door policy at a club. Only guests from the same club (origin) are\
    \ allowed in, preventing unwanted guests from entering.\n\nExample:\n\nA script\
    \ from `https://example.com` is restricted from making requests to `https://api.example2.com`\
    \ due to the same-origin policy.\n\n# 84. What is the purpose of the \"memo\"\
    ization technique in JavaScript?\n\nExplanation: Memoization is a technique used\
    \ to optimize the performance of a function by caching its results based on its\
    \ input parameters. If the same input is encountered again, the cached result\
    \ is returned instead of recomputing the function.\n\nAnalogy:\n\nImagine a calculator\
    \ with a memory feature. If you perform a calculation and want to repeat it later,\
    \ you can use the memory instead of going through the steps again.\n\n// Example:\n\
    \n```javascript\nconst memoizedFunction = (function () {\n  const cache = {};\
    \ \n  return function (arg) {\n    if (arg in cache) {\n      return cache[arg];\n\
    \    } else {\n      const result = expensiveOperation(arg);\n      cache[arg]\
    \ = result;\n      return result;\n    }\n  };\n})();   \n```\n\nIn this example,\
    \ `memoizedFunction` caches results, avoiding redundant computations for the same\
    \ argument.\n\n# 85. How does the \"reduce\" function work in JavaScript, and\
    \ can you provide an example?\n\nExplanation: The `reduce` function in JavaScript\
    \ is used to accumulate values from an array into a single result. It takes a\
    \ callback function and an initial value, applying the callback to each element,\
    \ and accumulating the result.\n\nAnalogy:\n\nThink of reduce as a chef combining\
    \ ingredients while preparing a dish. Each ingredient (array element) is processed,\
    \ and the final result is the completed dish.\n\n// Example:\n\n```javascript\n\
    const numbers = [1, 2, 3, 4, 5]; \nconst sum = numbers.reduce((accumulator, current)\
    \ => accumulator + current, 0); \nconsole.log(sum); // Outputs: 15   \n```\n\n\
    In this example, the `reduce` function calculates the sum of the numbers in the\
    \ array starting with an initial value of 0.\n\n# 86. Explain the concept of \"\
    currying\" in JavaScript.\n\nExplanation: Currying is a technique in functional\
    \ programming where a function with multiple arguments is transformed into a sequence\
    \ of functions, each taking a single argument. It allows partial application of\
    \ functions, creating more reusable and composable code.\n\nAnalogy:\n\nConsider\
    \ currying as a pizza-making process. Instead of making the entire pizza at once,\
    \ you prepare each layer separately, making it easier to customize.\n\n// Example:\n\
    \n```javascript\nconst curryAdd = a => b => a + b; \nconst add5 = curryAdd(5);\n\
    console.log(add5(3)); // Outputs: 8   \n```\n\nIn this example, `curryAdd` transforms\
    \ a two-argument addition function into a curried function, enabling partial application.\n\
    \n# 87. What is the significance of the \"Content Security Policy\" (CSP) in web\
    \ development?\n\nExplanation: Content Security Policy (CSP) is a security standard\
    \ that helps prevent various types of attacks, such as Cross-Site Scripting (XSS).\
    \ It allows web developers to declare which sources of content are considered\
    \ trusted and can be executed.\n\nAnalogy:\n\nThink of CSP as a security guard\
    \ checking entry permissions at a building. Only approved individuals (trusted\
    \ sources) are allowed inside, reducing the risk of unauthorized access.\n\nExample:\n\
    \nA CSP header like `Content-Security-Policy: script-src 'self'` ensures that\
    \ scripts are only executed if they come from the same origin.\n\n# 88. How does\
    \ JavaScript handle variable scope?\n\nExplanation: Variable scope defines where\
    \ a variable is accessible. JavaScript has function scope, block scope, and global\
    \ scope.\n\nAnalogy:\n\nImagine variable scope as rooms in a house. Each room\
    \ represents a different scope, and variables placed in it are only accessible\
    \ within.\n\n// Example:\n\n```javascript\nfunction exampleScope() {\n  if (true)\
    \ {\n    var x = 10; // Function-scoped with var\n    let y = 20; // Block-scoped\
    \ with let\n    const z = 30; // Block-scoped with const\n  }\n  console.log(x);\
    \ // Outputs: 10\n  // console.log(y); // Error: y is not defined (block scope)\n\
    \  // console.log(z); // Error: z is not defined (block scope)\n}\nexampleScope();\n\
    ```\n\nIn this example, `x` is accessible outside the block due to function scope,\
    \ while `y` and `z` are block-scoped.\n\n# 89. What is the purpose of the \"Proxy\"\
    \ object in JavaScript?\n\nExplanation: The `Proxy` object in JavaScript is used\
    \ to create custom behaviors for fundamental operations (like property access,\
    \ assignment, enumeration, etc.) on objects. It allows interception and customization\
    \ of these operations.\n\nAnalogy:\n\nThink of a Proxy as a personal assistant\
    \ managing your requests. Instead of directly interacting with an object, you\
    \ delegate requests to the assistant, who can modify, reject, or enhance the requests.\n\
    \n// Example:\n\n```javascript\nconst handler = {\n  get: function (target, property)\
    \ {\n    return property in target ? target[property] : 'Property not found!';\n\
    \  }\n}; \n\nconst person = new Proxy({}, handler);\nperson.name = 'John'; \n\
    console.log(person.name); // Outputs: John\nconsole.log(person.age); // Outputs:\
    \ Property not found!\n```\n\nIn this example, the `Proxy` intercepts property\
    \ access and provides a custom response for non-existing properties.\n\n# 90.\
    \ Explain the concept of the \"IIFE\" (Immediately Invoked Function Expression)\
    \ pattern.\n\nExplanation: IIFE is a JavaScript pattern where a function is defined\
    \ and executed immediately after its creation. It's often used to create a private\
    \ scope for variables, preventing them from polluting the global scope.\n\nAnalogy:\n\
    \nConsider an IIFE as a personal bubble. You do your activities inside the bubble,\
    \ and once done, you pop it. The activities and variables inside the bubble don't\
    \ affect the external environment.\n\n// Example:\n\n```javascript\n(function\
    \ () {\n  // Private scope\n  const secretNumber = 42;\n  console.log(secretNumber);\n\
    })(); // Immediately invoked \n\n// console.log(secretNumber); // Error: secretNumber\
    \ is not defined   \n```\n\nIn this example, the IIFE encapsulates `secretNumber`,\
    \ making it inaccessible from outside the function.\n"
