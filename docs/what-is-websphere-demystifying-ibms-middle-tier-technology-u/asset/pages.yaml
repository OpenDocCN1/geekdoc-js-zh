  md: '# What are the J2EE protocols?


    As interesting as your Servlets and EJBs might be, nobody cares about them if
    they can''t interact with them, which brings us to the third prong of the J2EE
    spork: protocols.


    When it comes to J2EE, there are four basic protocols we will encounter:


    +   - RMI (remote method invocation)

    - IIOP (Internet inter-orb protocol)

    - http (hypertext transport protocol)

    - https (secure http)


    # What is http?


    Http is the protocol of the Internet. When someone requests an html file, opens
    up a pdf, or downloads a zip file, they''re using the Hyper Text Transfer Protocol.
    When a client calls on a JSP or a Servlet, they invoke it using the http protocol.


    # What is https?


    Of course, some people don''t like the idea of their requests, which includes
    anything they may have typed into a textfield or an online form, shooting across
    the Internet in plain text.


    To address the security concerns associated with transferring data across the
    Internet, Netscape created https, the Hyper Text Transfer Protocol with secure
    sockets, also known as "secure http."'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Chapter 9


    Htps basically piggybacks on top of http, encrypting and securing a request and
    response so that nobody can view it, and no unscrupulous individual can tamper
    with the request or response midstream.


    Http and https are the protocols we use to access web-based components, which
    from a J2EE perspective, means Servlets and JSPs.


    # What is RMI?


    Invoking EJBs is quite a bit different from invoking a Servlet or a JSP. EJBs
    use RMI over IIOP to handle EJB requests and to send back a response.


    Regardless of whether it is a Servlet or a stand-alone Java application that might
    be invoking an EJB, RMI over IIOP is the protocol being used.'
