  md: '# Model View Controller


    # Chapter 10

    Model View Controller


    # What is MVC?


    Some call it a design pattern, while others call it a best practice. I''m pretty
    content to simply describe it as a darned good philosophy for putting together
    your enterprise applications.


    The basic idea behind MVC, Model-View-Controller, is that when you develop your
    application, you should layer it into three distinct parts:


    +   - a Model

    - a View

    - a Controller


    # So, what is a View?


    The view is the user interface. The view provides a window into your application.


    In our web-based applications, the view is usually the web page we can see in
    our Internet browser. Technically speaking, the view will be the markup language
    that is returned to the client.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Chapter 10


    The view may take on many different forms, including:


    +   - The page displayed in an Internet browser

    - The Graphical User Interface of an app

    - The screen of an Internet enabled cell phone

    - The face of a personal data assistant (PDA)


    The view is responsible for displaying data, displaying feedback messages to the
    user, and generating the overall look of an application.


    # What is the model?


    The model is the business logic required to make applications work.


    Enterprise applications have to do innumerable crazy tasks, such as:


    +   - Transferring data between EJBs and Servlets

    - Interacting with back end databases

    - Plopping messages on message queues

    - Interacting with CICS transaction servers

    - Looking up objects in a naming service


    These types of interactions require some real razzle-dazz code, and all of this
    Java voodoo is best kept away from your view and your controller.


    We like to factor out all of our business logic into Java components, which we
    collectively refer to as the model.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# Model View Controller


    How do we interact with a database? How do we add a message to a message queue?
    How do we efficiently pass data across network from one EJB to another?


    All of these problems are addressed and implemented by reusable Java components,
    commonly referred to as JavaBeans, which make up the model of an application.


    So the view is responsible for generating the handsome, overall look of our application,
    and we have all of these great business components that implement business logic,
    that are known as the model. The last piece of the MVC puzzle is the controller.


    # What is the controller?


    The controller is designed to handle the initial client request, extract input
    from the user, and kick off the execution of the business logic required to process
    a client request.


    The controller is one of the most complicated aspects of application development.


    The following are responsibilities of the controller:


    # Input Validation


    The controller must validate user input. Such mundane tasks as making sure that
    a user has filled in all of the required text fields of a form, and checking to
    see that the user has also supplied a properly formatted email address falls into
    the realm of the controller.


    # Request Validation


    The controller must make sure that every request is a valid request.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Chapter 10


    For example, a user may have bookmarked a page that displays the value of their
    stock portfolio. Of course, if the user logs out and then comes back to that page
    later, we will need the user to log in again, so the application can display the
    portfolio of that particular user. In this case, the controller will make sure
    a user has logged in and visited the appropriate pages the lead up the fulfillment
    of the current request being made on the server.


    # Delegation to Business Components (To The Model)


    The controller is also responsible for figuring out which model components need
    to be used to fulfill the current request.


    If a user needs to read data from a database, the controller will call upon business
    components to perform JDBC. If a user needs to read a message from a message queue,
    the controller will delegate to model components that have been designed to implement
    messaging.


    # Flow Control


    Depending upon a variety of variables, including whether the client request is
    valid, or whether all of the business objects that have been invoked have executed
    successfully, the controller will figure out which component will be invoked to
    generate a view for the client. The controller handles the overall flow of an
    application.'
