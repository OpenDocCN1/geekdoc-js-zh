  md: '# Chapter 3


    # What exactly are Servlets?


    An application server must be capable of handling and responding to requests that
    come in over the Internet. A Servlet is simply a Java based component that handles
    web-based requests.


    The purpose of a Servlet is to accept and process a web-based request, and subsequently
    send a response back to the client. Since the client is likely a person surfing
    the Internet, the response delivered to the client usually takes the form of a
    web page.


    > "Servlets respond to web based requests."


    Servlets are popular because they are incredibly easy to code. With only a little
    bit of a Java background, anyone can code a Servlet and dive head first into the
    empty pool know as server side development.


    # Just how easy is coding a Java Servlet?


    There are only two methods you really need to worry about coding a Servlet:


    +   - the doGet method

    - the doPost method.


    The doGet method of a Servlet is automatically called when a client invokes your
    Servlet by clicking on a link, choosing a bookmark from their list of favorites,
    or typing the name of your Servlet directly into the address bar of a web browser.'
