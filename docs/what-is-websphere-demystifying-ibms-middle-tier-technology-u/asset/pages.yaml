  md: '# What is a custom user registry?


    A custom user registry is a user registry you write yourself. You may need to
    implement a custom user registry if you''re trying to integrate WebSphere with
    some other legacy applications that don''t support LDAP or the local user registry.


    # Is a custom user registry difficult to implement?


    Implementing a custom user registry isn''t as daunting a task as it might sound.
    Basically, you just have to implement a few Java interfaces that allow the WebSphere
    Application Server to authenticate a username and password. After authenticating
    a username and password combination, a custom user registry must then be able
    to tell the Application Server about the different groups to which an authenticated
    user belongs.


    Write the code needed to implement the Java interfaces required to provide this
    type of functionality, make the WebSphere Application Server aware of the code
    you''ve written, and voila, you have implemented a custom user registry. While
    perhaps this is a bit of an oversimplification, developing a custom user registry
    really isn''t that difficult a task.


    Authentication against a user registry is the first half of the security pie.
    The second half is authorization.'
