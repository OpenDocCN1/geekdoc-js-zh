    of EJB. However, I must be remiss and accept the wisdom of those who created and
    contribute to the J2EE specification.


    Messaging is an important part of almost every enterprise environment, and until
    J2EE 1.3, the developer was responsible for reading messages from a queue, and
    subsequently processing those messages.'
