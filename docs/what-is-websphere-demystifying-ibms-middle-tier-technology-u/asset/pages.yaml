  md: '# J2EE Protocols and Services


    # Chapter 9

    J2EE Protocols and Services


    # Why are J2EE Services significant?


    J2EE components by themselves are pretty boring. What makes J2EE components interesting,
    far more interesting than anything you could write using the Standard Java Development
    Kit (SDK), are the various J2EE services they can access.


    What services are we talking about?


    To name a few:


    +   - A Transaction Service

    - A Naming Service

    - A Messaging Service

    - A Security Service


    A J2EE application server implements a variety of application programming interfaces
    (APIs) that provide EJB and Servlet developer''s access to the important services
    that have been implemented by those clever sausages on the WebSphere development
    team.


    WebSphere provides a security service that challenges users for a username and
    password when they try to access a secured resource; the security service subsequently
    provides authorization for access to other J2EE resources.


    Using various J2EE APIs, a developer can access this security service and do sexy
    things with it, such as finding out the name with which a user logged.'
