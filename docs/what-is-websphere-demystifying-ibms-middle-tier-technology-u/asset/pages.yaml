    # Can I bypass the web server and tunnel directly to my application server?


    Yes, you can bypass the web server. WebSphere is what is known as an ‘embedded
    http server.’ It is this embedded web server that handles requests for the actual
    web server handling requests on port 80.


    The Web server takes requests in port 80, and then forwards to the web container
    of the application server, which is usually handling requests on port 9080 or
    9090.


    You can explicitly specify the IP address of your server and the port number,
    and test your Servlets and JSP files directly. It’s a great way to test your applications,
    but you should never use it in production.


    In fact, if you look at the admin console for WebSphere, using the default configuration,
    it runs on port 9090, and is not accessed through a web server.'
