    # How do you implement workload management with WebSphere?


    If you want to protect yourself from a single, crazy, JVM going out of control
    and eventually shutting down your applications, what do you deploy your application
    onto two or more JVMs? That way, if one JVM shuts down, another JVM can pick up
    the slack. In the meantime, WebSphere will recognize that a JVM has been injured,
    send it to triage, and hopefully get it back up and running again soon. With an
    extra JVM running and picking up the slack, your clients won''t experience any
    downtime.


    # What is a cluster?


    A cluster is the term given to two or more JVMs working together to serve up a
    common set of EJBs and Servlets. If you want to workload manage your applications,
    which essentially means having redundant JVMs on which your applications are running,
    what do you do set up a ''cluster''.


    With a cluster, when you deploy your application, rather than deploying to a single
    JVM, you deploy your application to the cluster as a whole. Then each member of
    the cluster, each Java Virtual Machine that is, is capable of handling and servicing
    requests from clients.


    When it comes to JVMs, the more the merrier!'
