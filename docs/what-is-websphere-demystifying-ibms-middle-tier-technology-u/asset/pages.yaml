  md: '# Chapter 21


    Once J2EE compliance is achieved, IBM then gets a whole boardat of time to improve
    the usability of their application server, which is exactly what they have done.


    Between the release of WebSphere 5 and WebSphere 6, IBM has fixed a large number
    of bugs, added a number of usability enhancement, and most significantly, improved
    the ability of an application server to recover from a failure. Whereas previous
    versions of WebSphere might take a few minutes to recover from a complete server
    failure, WebSphere 6 promises to recover in just a matter of seconds. This major
    tweaking can mean a savings of hundreds of thousands of dollars a year to transactionally
    heavy, mission critical enterprise applications.


    # How has the J2EE specification changed from WebSphere 5 to WebSphere 6?


    From a J2EE perspective, the most significant change from WebSphere 5 to WebSphere
    6 is the implementation of J2EE 1.4. Version 5 was J2EE 1.3 compliant.


    J2EE 1.4 moves the EJB spec to 2.1, the Servlet spec to 2.4 and the JSP spec to
    2.0.


    # What is new with the Servlet 2.4 and JSP 2.0 specifications?


    Servlets haven''t changed much over the last few years, after all, they work pretty
    damn good as they are. However, there are a few things about the Servlet spec
    that gets developers bitches.


    One of the biggest problems with Servlets is the whole mechanism of logging out
    a user from an application. The log out process has never been properly defined
    in the Servlet specification. Each vendor has implemented a


