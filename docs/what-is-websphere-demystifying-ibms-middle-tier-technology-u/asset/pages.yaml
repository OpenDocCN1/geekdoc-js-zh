  md: '# What parameters are passed to the doPost or doGet method of a Servlet?


    The doPost and doGet methods are passed two very important objects:


    +   - an HttpServletRequest object

    - an HttpServletResponse object


    The HttpServletRequest, a.k.a. request, and the HttpServletResponse, a.k.a. response,
    make handling web based requests incredibly easy.


    > "Servlets are popular because Servlets are incredibly easy to code."


    Anything you want to know, or for that matter, are allowed to know about the client,
    comes through the request object. **Get it?** The request object describes the
    request that has come in from the client.


    Anything you want to do to the client can be done through the response object.
    **Get it?** The response object allows you to manage the response that gets sent
    back to the client.


    Servlet programming really is that easy. Sure, there are a few method calls you
    have to get familiar with, but with a bit of a Java background, getting up to
    speed with Servlet programming will be a lead-pipe cinch.'
