- img_proc: true
  md: '# What are the common challenges enterprise developers encounter?


    Enterprise programming is hard. In an enterprise environment, there are a number
    of mission critical challenges that must be addressed and implemented properly,
    otherwise applications will fail.


    Some of the typical challenges that enterprise developers encounter include:


    # Database Access:


    How do we ensure that data in our application is completely, totally, 100% in
    sync with what is in the database? This is a requirement of almost every enterprise
    application, but without an intimate knowledge of how a database works, implementing
    database synchronization properly is a significant challenge.


    # Transactional Updates:


    If I''m updating three different databases in an ''all or nothing'' type of scenario,
    and one of those database writes fails, how do I roll back writes to the other
    two databases?


    What if one of those databases is in Kalamazoo and two of them are in Tuktoyaktuk?
    How do you maintain the transactional integrity of your updates?


    # Distributed Programming:


