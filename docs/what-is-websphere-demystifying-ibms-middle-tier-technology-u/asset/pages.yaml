    # So what benefit does vertical scaling provide?


    Vertical scaling provides a variety of benefits, especially if your environment
    is heavy on hardware.


    First of all, in a vertically scaled environment, if one JVM goes offline, whether
    intentionally or not, the other JVMs can pick up the slack, so you get a certain
    degree of failover, although its not exactly the level of failover we usually
    associate with workload management. With vertical scaling, we are still node dependent.


    A more likely rationale for implementing a vertically scaled environment is to
    take advantage of powerful, multiprocessor machines.


    The fact is, despite the use of our modern, multithreaded operating systems, there
    are enough concurrent processes within a JVM to make having one java.exe process
    running on a multiprocessor system a fairly inefficient endeavor.


    To take maximum advantage of your multiprocessor machine, you should implement
    vertical scaling and have n-1 JVMs running, where n is the number of processors
    in your system, and l is the number between zero and two.


    # What is Horizontal Scaling?


    Horizontal scaling occurs when you deploy an application across multiple physical
    machines. Horizontal scaling is typically what we think of when the term ‘workload
    management’ is thrown around.


    WebSphere makes implementing horizontal scaling incredibly easy. The first step
    is to install the base edition


