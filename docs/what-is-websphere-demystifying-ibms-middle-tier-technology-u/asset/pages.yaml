    module for a given Java file or Servlet, wouldn’t you? Well, this type of foolish
    thinking is wrong, and has caused all sorts of deployment problems.


    By default, each classloader, with the exception of the ExtJarClassLoader, is
    set up with a ‘PARENT_FIRST’ configuration. A PARENT_FIRST configuration forces
    a'
