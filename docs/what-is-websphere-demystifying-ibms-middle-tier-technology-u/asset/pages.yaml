    EJBs provide the ability to interact with the security service of the application
    server, and you can lock EJBs right down to the method level. This type of security
    would be relatively difficult to implement with regular JavaBeans.


    Needing this type of security is a good reason to use an EJB, but it shouldn’t
    be a reason on its own.


    If security is the problem you need addressed, you could probably avoid using
    EJBs and lock down your applications by securing Servlets and JSPs instead. The
    Java Authentication and Authorization Service (JAAS) could also be used to facilitate
    a secure system using EJBs, but even JAAS introduces an extra level of complexity.


    EJBs do indeed provide secure access right down to the method level, and if this
    is the type of security you need, EJBs might be a viable solution.


    +   - Do I need to make sure that the data application receives is completely
    and totally in sync with the data in the database?


    +   - Do I need a persistence model?


    CMPs and BMPs address the many difficulties associated with communicating with
    a database, as they provide a persistent object model that makes sure the data
