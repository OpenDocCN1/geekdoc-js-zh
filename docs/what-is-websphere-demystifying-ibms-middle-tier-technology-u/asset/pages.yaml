    # What were the drawbacks to a centralized JNDI

    service?


    Centralization of this superbly important J2EE service,

    called JNDI, certainly had its drawbacks. The biggest

    drawback to a centralized naming service was the fact that

    if this service went down, your entire enterprise

    environment was.


    So what’s a J2EE server vendor like IBM to do? Should

    they have a centralized naming service that makes looking\up objects easy, but
    also acts as a performance bottleneck,

    or should they have a distributed naming service that

    eliminates a single point of failure?


    IBM decided to pick their poison, and felt that having

    the developers chase down the occasional

    NameNotFoundException was far more acceptable than

    having a single point of failure in the WebSphere

    architecture. WebSphere 5 uses what is known as a

    distributed naming system.


    IBM has always been the vendor of failover and

    scalability, so it’s not surprising that their current

