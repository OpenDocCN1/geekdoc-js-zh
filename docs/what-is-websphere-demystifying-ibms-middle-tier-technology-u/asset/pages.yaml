    **JNDI:** Great. And when someone asks, where should I send them?


    **EJB:** Point them to my home. It''s the big mansion on the corner.


    **JNDI:** Will do best! After all, binding names to objects is what I do best!


    # Who assigns resources their JNDI names?


    When resources such as DataSources and message queues are created and configured
    by the administrator, the JNDI name is one of the configurable properties.


    For the most part, the WebSphere administrator has the final say over the name
    a resource will use when binding itself to JNDI.'
