  md: '# Chapter 17


    # When accessing a connection pool, my developers are providing unique usernames
    and passwords. How does this effect pooling?


    This completely defeats the process of database pooling.


    All connections in a pool must have the same access rights associated with them.
    If you create a new connection with a different username and password, it will
    exist in its own separate pool. If every connection is given its own username
    and password, each connection is a pool unto itself.


    Be careful when using usernames and passwords to obtain connections from a DataSource.
    To track database access, using a logging mechanism would be a better option than
    matching each connection with a username and password.


    # How does a connection pool work?


    When your server starts up, the connection pooling service initializes a number
    of connections to your database; this is based upon the minimum number of connections
    specified in the DataSource properties window.


    Each time a client asks for a connection, the DataSource gives the client one
    from the pool. When a client is done with the connection, the connection is returned
    to the pool, rather than being destroyed.


    If the number of connections in use equals the number of connections in the pool,
    the DataSource throws an extra connection into the pool, just in case another
    client makes a request for one. The DataSource will keep throwing connections
    into the pool until the number of connections'
