  md: '# Session Management


    # How do persistent sessions work?


    The basic idea behind persistent sessions is that whenever a session is created,
    the application server writes the session id to a special ''session database.''
    Any information subsequently stuffed into a users session gets added to the persistent
    session database.


    If the server that initially created the users session fails, any other server
    in the cluster can pick up from where the failed server left off. If one JVM goes
    down, any alternate server can look up the client''s information in the session
    database using the session id that gets passed back to the server through the
    client''s cookie. A redundant server can then pull any required session information
    out of the central persistent database. Any problems on the server are completely
    transparent, and if something does go wrong, the client never knew there was a
    problem.


    Of course, this scenario isn''t without its drawbacks. First of all, persisting
    sessions requires quite a few database writes, which is resource intensive. Persisting
    session information to a database is going to to slow your applications down a
    tad.


    Furthermore, the database becomes a central point of failure itself. If maintaining
    a robust application server is important to you, you better either use db2, which
    we all know never fails, or else cluster your database servers.


    # What is ''memory to memory'' session replication?


    If persisting sessions to a centralized database isn''t up your alley, WebSphere
    5 presents a new option for session failover: memory-to-memory session replication.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# Chapter 13


    The idea behind memory replication is that if servers are clustered to support
    an application, you can configure the application servers in the cluster to pass
    session information back and forth from one JVM to the other. Each application
    server keeps a copy of the session data being used by the other servers in the
    cluster.


    Memory to memory session replication is said to be more efficient than writing
    to a centralized database, although it does present a few potential bottlenecks
    itself.


    # What are the drawbacks of memory to memory session replication?


    Memory to memory replication does indeed have its drawbacks. First of all, network
    traffic may become large if session information is being replicated across a large
    number of application servers.


    Secondly, a significant amount of memory is going to be consumed in order to implement
    session failover.


    For instance, imagine you have five servers, and each server maintains a gig of
    session data. That gig must be replicated on each of the other four servers, so
    each server would need five gigs of memory – one gig for current session data,
    and four gigs of failover data for each of the four servers in the cluster. That’s
    a lot of memory!


    Of course, those clever sausages at WebSphere do provide a mechanism to address
    the memory and network traffic dilemma presented by memory-to-memory session replication.'
