  md: '# Chapter 21


    # What is new with EJB 2.1?


    In previous EJB versions, it was surprisingly difficult to write a J2EE component
    that could execute some type of processing at regular intervals. It was difficult
    to schedule calls to an EJB.


    EJB 2.1 introduces a simple yet powerful timer service that allows EJBs to be
    notified and then execute some type of logic at regular time intervals. The timer
    service is something EJB developers have been requesting for years.


    EJB 2.1 also adds a variety of features to the EJB Query Language, EJBQL. EJBQL
    is an object-oriented way of querying a database, but instead of using a reference
    to database tables, rows and columns, it references the name and properties of
    an EJB. The EJB container then translates these names into database tables at
    runtime. EJBQL makes EJBs much more portable, flexible and object oriented.


    EJBQL was new with EJB 2.0, so the various vendors could only agree on basic querying
    and updating functionality. EJB 2.1 adds a variety of new features to EJBQL that
    make it closer to a regular SQL. New features or calls include MAX, MIN, SUM,
    AVG and COUNT.


    EJB 2.0 introduced the Message Driven Bean (MDB) that interacted with a JMS messaging
    infrastructure. The MDB spec has now been abstracted out to allow for many more
    messaging implementations other than JMS. Messaging support on a J2EE application
    server continues to grow.'
  merge: -1
