  md: '# Getting Started with WebSphere


    # Chapter 1

    Getting Started with IBM

    WebSphere®


    # What is WebSphere?


    You can’t touch and you can’t taste it, although a few

    ministrators I know have colorfully described how it

    smills.


    Technically speaking, it’s not something you can buy

    either, although I do know a few managers who swear they

    have paid for it dearly. WebSphere on its own isn’t really

    something you can sell, although IBM does plan on making

    aboload of dough from it.


    So, what exactly is WebSphere?


    +   * WebSphere is a marketing term.

    * WebSphere is an IBM trademark.

    * WebSphere is an IBM branding.

    * WebSphere will conquer the middle-tier.


    WebSphere isn’t an actual product you can buy, but

    rather an umbrella under which all IBM middleware

    products reside.


    WebSphere is an IBM branding, associating a vast array

    tools sold to IBM customers that help enable the middle-

    tier.


    WebSphere represents IBM''s vision to take over the

    middle-tier, or at the very least, stop it from falling into the

    hands of Microsoft or Oracle.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Chapter 1


    # What is the middle-tier?


    If you think about it, every time we use the Internet, our interactions are data
    driven. Whether we are checking to see if our electricity bill is past due, or
    searching for the correct spelling of a word they were throwing around on last
    nights Charlie Rose, our interaction is data driven.


    # Table 1-1 Components that Reside on the Client, Middle and Data Tiers


    | Client Tier | Middle Tier (WebSphere) | Data Tier |

    | --- | --- | --- |

    | Web Browsers | Web Services | Message Queues |

    | PDAs | J2EE Servers | Databases |

    | Cell Phones | .NET Servers | Persistent Data |


    We live in the information age, and information is power. Big businesses and domineering
    governments hold huge stores of information, some of which they want us to see,
    and some of which they want to secure very tightly.


    > “Information is Power”


    The terabytes of data companies store in db2 and Oracle databases represents the
    ‘data-tier.’ The data-tier, also'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Getting Started with WebSphere


    known as the ‘back-end,’ is what hackers, crackers, and everyday users want to
    get their dirty little fingers on.


    These other users, and the web browsers they use, such as Internet Explorer, Netscape
    and Opera, represent the ‘client tier.’ The client tier is also known as the ‘front
    end.’


    # **“The Internet is data driven”


    So, if all of our data is stored in databases on the back end, and our clients
    are surfing the Internet on the front end, then the middle-tier represents the
    infrastructure needed to bridge the gap between the client-tier and the data-tier.


    # What is middleware?


    The middle-tier bridges the gap between the client-tier and the data-tier. Middleware
    is the software that makes this middle-tier work. IBM sells a ton of software
    to enable the middle-tier, and selling this middleware software is what WebSphere
    is all about.


    # **“Selling middleware is what WebSphere is all about.”**


    The amount of software IBM sells under the brand name “WebSphere” is staggering.
    If there is a need, IBM has a middleware solution for it. Heck, even if there
    isn’t a need, IBM is willing to sell you a solution. They’re ‘good people’ in
    that regard.'
  merge: -1
