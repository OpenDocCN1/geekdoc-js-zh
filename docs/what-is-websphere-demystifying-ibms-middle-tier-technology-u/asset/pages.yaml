  md: '# Servlets and Java Server Pages (JSPs)


    # Where does a Java Server Page (JSP) fit into this whole framework?


    There are only two types of J2EE components we can write: EJBs and Servlets. This
    may comes as a bit of a shock, but a JSP is really just a Servlet, although coded
    in a slightly different manner.


    The SampleServlet coded earlier had an ugly mix of HTML tags and Java. Optimally,
    markup language and Java code should never be mixed together.


    **A JSP is just a Servlet turned inside out.**


    Servlets are intended to acts as controllers, and Java is used to implement this
    control logic. However, HTML tags get mixed in with the Java code if the Servlet
    also takes on the responsibility of sending data back to the client.


    Mixing Java and HTML within a single component creates a maintainability nightmare,
    so as much as possible, we try to keep complex Java logic in a Servlet, and have
    the generation of dynamic HTML factored out into a JSP.


    # Is there anything you can do in a JSP that you can’t do in a Servlet?


    A JSP is just a Servlet that’s been turned inside out. 😊 A Servlet is Java code
    with a little bit of HTML in it. A JSP file is mostly HTML with a little bit of
    Java inside of it. But there’s nothing you can do with a JSP that you can’t do
    with a Servlet.'
  merge: -1
