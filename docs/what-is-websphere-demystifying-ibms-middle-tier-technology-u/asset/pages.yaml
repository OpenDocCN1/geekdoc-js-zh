  md: '# Model View Controller


    replace your thermostat? Of course not - you fix the furnace.


    In fact, maybe you just want to switch from oil to gas, or you want to add an
    air conditioner for those hot and muggy summer days. All of these additions and
    upgrades to your model can occur independently from your view and your controller.


    A good MVC architecture isolates problems, debugging easier, and makes it possible
    to plug components in and out of one layer without affecting components in the
    other layers.


    A good MVC home heating system allows me to fix, upgrade or replace my furnace
    while leaving my thermostat and thermometers alone.


    # Pluggability


    In my house, my crazy Dad always turns the temperature down around eleven at night,
    and then gets up at around five in the morning and turns the heat up so the house
    is nice and toasty when my Mom and I get up at around noon.


    Of course, if I was a generous son, I could buy one of those new digital thermostats
    that automatically change the temperature depending upon the time of the day.
    My Dad could stay in bed, and my Mom and I wouldn''t get woken up at five in the
    morning every time my Dad goes down to fiddle with the thermostat.


    Again, MVC affords us plugability. I can swap out one controller, throw in a different
    controller, and it doesn''t affect any of the other layers.'
