  md: '# Chapter 16 J2EE Security


    What is the difference between authentication and authorization?


    Authentication is the process of proving that you are indeed who you say are.
    With WebSphere, you will usually do this by providing a username and a password.
    The WebSphere security service then checks your credentials against a ''user registry''
    and verifies that you are indeed who you say are. If your credentials check out,
    WebSphere will tell you to try to log in again.


    Don''t get too excited being successfully authenticated though. Being authenticated
    doesn''t necessarily mean you have the right to access anything. In fact, you
    may have just authenticated yourself as an undesirable, and you might not be allowed
    to access anything. Being authenticated is a start, but once you are authenticated,
    you must then be authorized in order to access resources on the server.


    For example, imagine I was interested in accessing a secured Servlet. I might
    successfully authenticate myself as an agent, but if only tagagents and doubleagents
    have access to that resource, well, I''m out of luck. WebSphere won''t allow me
    to access it.


    So, authentication is proving that you are indeed who you say you are. Authorization
    is the process of evaluating whether an authenticated user has the required rights
    to access the resource in which they are interested.


    ![](img/a64fe132c0e172db17f8974af89bd4d4_162_0.png)'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Chapter 16


    > Authentication is the process of proving who you are.

    Authorization is the process of giving a user access to a particular resource.


    # What is a user registry?


    A user registry is simply a place for keeping track of usernames, passwords, and
    the various groups to which users belong.


    Every enterprise operating system keeps track of usernames and passwords. We''re
    probably all familiar with the Administrators group on a Windows machine, and
    maybe even the root user on a UNIX machine. These users and groups are part of
    the Windows or Unix operating system''s user registry.


    The local operating system of the machine on which WebSphere is installed is the
    default user registry used by the WebSphere Application Server.


    However, despite the default user registry for a WebSphere installation, the local
    operating system''s user registry is not a viable registry for WebSphere if you
    are trying to implement a scalable, highly available, enterprise architecture.
    If you need a user registry, you really should be using one of the other user
    registry options that are compatible with the WebSphere Application Server.


    WebSphere can use three different types of user registries:


    +   - An LDAP Directory

    - A Custom User Registry

    - A Local OS User Registry'
