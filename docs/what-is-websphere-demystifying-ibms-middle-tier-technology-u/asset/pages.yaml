  md: '# Servlets and Java Server Pages (JSPs)


    # What should I use, a Servlet or a JSP?


    To a question like that, there really are no right answers. There are only wrong
    answers, and all we can do is try not to get a wrong answer.


    As a good rule of thumb, a Servlet should be used to initially handle an incoming
    request and implement some control logic. This might include validating user input
    and making sure a user is making a reasonable request.


    A Java Server Page should be used when you are mostly generating HTML. A JSP should
    only ever require a minor amount of Java logic. This makes JSP files much easier
    to maintain.


    > "A JSP can do anything a Servlet can do"


    Generally speaking, most applications have a Servlet handle the incoming request,
    and then the Servlet forwards to a JSP to generate display and subsequently send
    HTML back to the client.


    Again, anything a Servlet can do a JSP can do, and vice versa. In fact, the only
    difference real between the two is how they''re coded


    # Servlets and JSPs sure don’t look the same


    Even though they look different, when a client calls a JSP, the Application Server
    actually calls a special Servlet of its own that reads the JSP, and subsequently
    creates a Java Servlet based on what is coded inside the Java Server Page.


    The Application Server then compiles the code that it creates, and then the newly
    compiled Servlet is loaded and'
