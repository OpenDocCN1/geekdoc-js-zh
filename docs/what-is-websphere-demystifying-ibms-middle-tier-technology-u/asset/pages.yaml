    own business, and don''t bother anyone if they''ve never been invoked. However,
    feed a few to those Servlets and get them loaded, and they remain resident in
    memory until the party ends, which happens when someone pulls the plug on the
    application server.


    So, the request gets sent from the client, to the web server, and the web server
    passes the request to the'
