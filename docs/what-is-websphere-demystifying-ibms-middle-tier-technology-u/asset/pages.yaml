  md: '# Chapter 19


    # The Null Classloader


    The machine code that initializes the system classloader is the null classloader
    referred to as the null classloader because it is not a Java class at all, as
    are all other classloaders. The null classloader is platform specific machine
    instructions that kick off the whole classloading process.


    All classloaders, with the exception of the null classloader, are implemented
    as Java classes. Something must load the very first Java classloader to get the
    process started. Loading the first pure Java classloader is the job of the null
    classloader.


    The null classloader also takes care of loading all of the the code needed to
    support the basic Java Runtime Environment (JRE), including classes in the java.util
    and the java.lang packages.


    # The System Classloader: sun.misc.Launcher


    The null classloader loads a true Java class of type sun.misc.Launcher. The sun.misc.Launcher
    classloader prepares the Java Runtime Environment needed by our application server.


    Truth be told, the sun.misc.Launcher is actually made up of two inner classes
    that do the actual classloading:


    +   * sun.misc.Launcher$ExtClassLoader (parent)

    * sun.misc.Launcher$AppClassLoader (system)


    ExtClassLoader is the parent of AppClassLoader. Of the two, the inner class, sun.misc.Launcher$AppClassLoader
    holds the true title of system classloader'
