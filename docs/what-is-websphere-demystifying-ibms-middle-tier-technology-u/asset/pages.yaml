  md: '# Chapter 6

    Message Driven Beans


    # What is a Message Driven Bean, MDB?


    Anxiously anticipated, and newly introduced with J2EE 1.3, is the Message Driven
    Entity Bean (MDB).


    Messaging is an important part of any enterprise applications. Messaging allows
    an application to put information on a message queue, and be assured that that
    information will be processed at some time in the foreseeable future.


    Essentially, message queues allow an application to implement delayed processing.
    Delayed processing of messages is also known as asynchronous messaging.


    # How does asynchronous messaging work?


    Have you ever placed an order over the Internet, been been told that your order
    has been processed, and then you don''t get an actual confirmation email for about
    an hour or two?


    When you placed your order, the website grabbed your order information, which
    likely included your email address and credit card number, and then shoved that
    information in a message, and plopped that message on a message queue. When the
    application server got a little bored, or at least when the workload down a little
    bit, the application server grabbed your order off the queue and processed it,
    thus the delay in your email confirmation. That is asynchronous messaging in action.'
  merge: -1
