  md: '# Chapter 8

    Using EJBs


    When should you use EJBs?


    EJBs are incredibly powerful components that allow developers to easily take advantage
    of the application server''s security, transaction, naming and distribution services.
    However, EJBs are also incredibly resource intensive. If you use EJBs excessively,
    you''ve just bought yourself a one-way ticket to performance problemville.


    Before committing to using an EJB, ask yourself the following questions:


    +   - Do I need to manage some serious database transactions?


    EJBs are great for managing transactions, and if you have a largely transactional
    system, EJBs just may be your saving grace.


    +   - Do I need object distribution?


    +   - Are users calling my components remotely?


    This is a good case for using EJBs, as EJBs are inherently distributed objects.
    However, this alone is not a compelling reason to employ an EJB centric solution.


    There are many mechanisms for implementing remote distribution including remote
    method invocation (RMI) and network socket programming, both of which are more
    efficient than using an EJB.'
