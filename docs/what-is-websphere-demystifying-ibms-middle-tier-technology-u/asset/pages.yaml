  md: '# Chapter 16


    Http is a relatively simple protocol. It has about six or seven methods associated
    with it, and of those six seven possible network method calls, there are only
    two with which we are generally concerned.


    Http is the protocol of the Internet. When you click on a link, type a URL into
    the address bar of a web browser, or even select a bookmarked site from your list
    of favorites, you have triggered a GET invocation on the http protocol. Basically,
    you’re asking the http protocol to get a resource for you from a server.


    When you fill out a form and click the submit button, you are most likely invoking
    a POST invocation. Essentially, you’re asking the http protocol to post or send
    information to a website or server for processing.


    There are other methods in the http protocol as well, including an http PUT for
    saving files to a server, and an http DELETE, which can delete resources from
    a server, but these two dangerous features are always disabled on a secured server.
    After all, we don’t generally want clients to be saving or deleting resources
    from our application servers or web servers.


    When you secure a web-based resource such as a Servlet, you basically state which
    http methods a client can use to invoke the Servlet.


    For instance, you might have a Servlet that handles a login form that is posted
    to the server. In this case, you would allow only certain users to invoke the
    Servlet through an http POST invocation. If an unauthorized user tries to POST
    to the Servlet, the server will send an unauthorized error message back to the
    client.


    Another scenario might include a Java Server Page that displays usage statistics
    for your database. Obviously, only database administrators should have the right
    to view this'
  merge: -1
