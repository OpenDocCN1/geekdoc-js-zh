  md: '# What is an IBM Extension?


    Any vendor, so long as they have implemented the J2EE spec properly, is allowed
    to go beyond the spec and add features they think users of their application server
    might find helpful.


    Extensions represent a competition point – if a vendor has a bunch of extensions
    that makes their server easier to use, people will theoretically flock to that
    vendor. At least, that’s what Adam Smith taught us.


    The IBM extension file for the ear really isn’t that interesting, as it simply
    allows you to set up a shared session context and specify a reload interval for
    various modules. We’ll see some more interesting extensions when we crack open
    the EJB and web modules.


    # Figure 11-3


    | Ear Level Extensions | WebSphere Extensions |

    |---|---|

    | A shared session context, and reload interval, are IBM extensions to the spec
    that are configured at the ear level. | The following are extension properties
    for the WebSphere Application Server.

    Reload interval: second(s)

    Shared session context |


    The truly interesting part of an ear file is the war and jar files that the ear
    file contains.


    > “Extensions are additions to the standard J2EE deployment descriptors. They
    enable the use of enterprise extensions, older systems, or behavior not defined
    by the specification” –Application Assembly Tool'
