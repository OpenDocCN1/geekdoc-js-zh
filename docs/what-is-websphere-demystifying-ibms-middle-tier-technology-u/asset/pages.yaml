    Perhaps the biggest change in the Servlet API is the deprecation of the SingleThreadModel.


    By implementing the SingleThreadModel, a developer could turn the inherent threading
    mechanism of a Servlet off. This would be done to avoid those very difficult to
    diagnose threading problems.


    Of course, turning off threading in a Servlet has always been shunned, and quite
    frankly, it’s a pretty lazy and ineffective way to deal with problematic threading
    issues. While I’m all about being lazy, I like being lazy and effective, not ineffective.
    Personally, I’m glad to see the SingleThreadModel go. If you have threading issues,
    deal with them, don’t simply turn threading off and slow down your J2EE applications.


    The JSP 2.0 spec remains relatively unchanged from version 1.2, although a couple
    of exciting features have been added.


    A simple expression language that makes accessing collections inside a script
    much easier has been introduced.


    New features have also been added to simplify the creation of custom tags, but
