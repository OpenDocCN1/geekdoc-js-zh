  md: '# Chapter 10


    The D in MVCD stands for data, and that’s exactly what cocoon is, a data centric
    framework.


    Cocoon figures that when a client comes to your website, they’re interested in
    data. Instead of using JSPs to generate HTML, Cocoon uses XML Server Pages, XSPs,
    to generate data marked up in an XML document. An XSL transition then easily converts
    that XML into any markup language your client may want.


    # “Cocoon adds a ‘D’ to MVC”


    Get a Cocoon application that serves up HTML pages, and in about five minutes,
    you can have that same application coughing up PDFs, WML, HTML, and even gif images
