  md: '# J2EE Security


    # What is LTPA?


    LTPA stand for Light-weight, Third Party Authentication.


    If you have any sense at all, your production environment is likely made up of
    many different computers hosting IBM software. One server might be a SameTime
    server, one might be a Lotus Domino server, and if you''re lucky, you''ll likely
    have applications running on three or four separate WebSphere Application Servers
    as well.


    IBM figures that if its client base is loyal enough to install IBM products on
    a bunch of computers in their domain, then the least IBM could do is implement
    a single sign on environment.


    In a Single Sign-On (SSO) environment, if a user is initially authenticated and
    authorized by any one of the IBM products participating in the domain, then that
    user will be able to access any of the other servers without being challenged
    again for their username and password.


    Requiring only a single authentication in order to access a variety of back end
    resources is the ultimate goal of any production environment. It''s rarely easy,
    although IBM''s SSO does facilitate the process.


    # How do you configure Single Sign On (SSO)?


    As you could imagine, a few things must be configured in order to get LightWeight
    Third Party authentication to work properly.


    The first requirement of SSO is having all of the servers in your SSO domain share
    a common domain name. For example, if your domain name is pulpjava.com, your servers
    would need to be named was1.pulpjava.com, lotus.pulpjava.com and sametime.pulpjava.com.
    Each'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Chapter 16


    computer in a single sign environment must share the same domain name.


    The second step, after all of your servers are configured with the same top level
    domain name, is to share a common LTPA key amongst your servers. The ability to
    create an LTPA key is built right into the WebSphere Application Server.


    All IBM products that are going to participate in your SSO domain must share a
    common LTPA key. If you have a bunch of IBM products that share a domain name
    and an LTPA key, they will correspondingly participate in a single sign on environment.


    Finally, each machine in your SSO domain must be configured to use the same set
    of LDAP servers. It only makes sense to have all of your application servers authenticating
    against a common user registry.


    # How does SSO work?


    When a user authenticates against a server participating in LTPA, that server
    places an LTPA token, uniquely encrypted using the special, shared LTPA key, on
    the client machine in the form of a cookie. When the client makes a subsequent
    request to a second server, this LTPA token is automatically passed to the second
    server. The second server then un-encrypts the clients LTPA token using the algorithm
    associated with the common LTPA key, and subsequently gains access to the user’s
    authentication data.


    If the LTPA token and the LTPA key jive, the credentials passed to the server
    by the user can be trusted. The IBM server handling the current request trusts
    that the user has already been authenticated. The server will not challenge the
    client again for a username and password.'
