  md: '# What is J2SE?


    The Java 2 Standard Edition, J2SE, is simply the latest incarnation of the basic
    Java development and runtime environment that has been available to developers
    since day one. J2SE is also referred to to as, correctly or not, the SDK (Standard
    Development Kit), JDK (Java Development Kit was the former name) or even the JRE
    (Java Runtime Environment).


    The J2SE allows developers to create basic and simple Java applications that can
    run on any desktop computer.


    J2SE applications do not support enterprise J2EE components such as Servlets,
    EJBs and Java Server Pages (JSPs). Furthermore, J2SE doesn''t provide facilities
    for developing small, compact applications that run well on Palm Pilots® or cell
    phones. The J2SE simply provides an effective environment for developing desktop
    applications.


    # What is J2ME?


    J2ME, the Java 2 Micro Edition, is a special Java development environment that
    makes it easier to create applications that can be run on small, handheld devices.


