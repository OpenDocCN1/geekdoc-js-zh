  md: '# Chapter 19


    classloader to ask its parent to try and load a given Java class first.


    If a web module needs some chunk of Java code that is sitting right there in the
    \lib directory of the war, the web module classloader first asks its parent classloader,
    the application classloader, to find the Java class file.


    And what do you think the application classloader does when asked to load a Java
    class file?


    When the application classloader is asked to load a class, it delegates to its
    parent, the WebSphere extensions classloader, to see if it can find and load the
    file.


    By now, you can probably guess where the WebSphere extensions classloader goes
    before looking on its own local classpath for the file in question. Yes, it defers
    to the system classloader, which then defers to the null classloader. The null
    classloader then tries to find the Java class of interest on its own local classpath,
    and if it does find the file, it will load it on the JVM.


    # So, what happens when the system classloader can’t load the class your looking
    for?


    Of course, there’s a good chance that the Java class of interest will not be on
    the system or null classloader’s classpath. After all, why would you put a class
    required by your web module in the lib directory of the JRE upon which WebSphere
    runs?


    When we hit the top of the classloading hierarchy, the class-finding baton gets
    passed back down the ladder, one classloader at a time, opposite to the order
    in which the hierarchy was climbed.'
