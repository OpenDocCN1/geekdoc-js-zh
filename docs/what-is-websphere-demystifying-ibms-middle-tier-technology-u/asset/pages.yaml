  md: '# Servlets and Java Server Pages (JSPs)


    # An Example of a Request-Response Cycle


    Let''s take a look at a simple example of a request-response cycle that might
    occur occur between a web-based client and the WebSphere Application Server.


    Let''s say you, as a developer, wanted to know which browser a client was using.
    Maybe you were even wondering if the client was using a Palm Pilot or a Nokia
    cell phone. Maybe you need to know which language the client speaks. Where would
    you find this information? In the HttpServletRequest object of course!


    And say you wanted to plant a cookie on a client machine, or simply send some
    HTML back to be displayed in the client''s browser. How would you do that? Well,
    you''d call some methods in the HttpServletResponse object, that''s how!


    For the most part, the primary job of the Servlet is to inspect the incoming request,
    and then figure out what kind of a response to send back to the client.


    # Inspecting the Request


    From the request, we can find out what a user may have typed into a generic text
    field, what their preferred language is, and even which browser they are using.
    The Servlet then uses this information to make sure the request being made is
    indeed a valid request.


    If the request is indeed indeed valid, the Servlet will execute the appropriate
    business logic required to fulfill the request, and then figure out what type
    of markup language and content should be sent back to the client.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Chapter 3


    # Generating a Response


    After handling a request, the Servlet must formulate a response and subsequently
    send something back to the user. After processing a request, it is very important
    that we inform the user about the success, failure, or overall status of their
    interaction with the application server. This is the gist of handling the Servlet
    request-response cycle.


    # The Challenge


    The challenging part of developing Servlets is deciding what to do between handling
    the request and formulating a response.


    For example, the request object can tell you what a user has typed into a couple
    of text fields, or which radio buttons a user has selected. What are you going
    to do with this information?


    > The complexity of your Servlets is only limited by your Java programming skills.


    Perhaps you want to save the input to a database. Maybe you want to place some
    information about the client''s request on a message queue. Maybe you want to
    interact with an Enterprise Java Bean, which would then require a JNDI lookup
    and an interaction with the UserTransaction object. Crazy stuff for sure, but
    you can do it if you want to.


    The point I''m trying to make is this: it is easy to get information about a client
    from the request object, and it is even easier to send a response back to the
    client using the response object. What do you do between handling the request
    and sending a response back to the client is only limited by your own creativity
    and the extent of your Java programming skills.'
  merge: -1
