  md: '# Administrative Security: Console Users


    Prior to WebSphere 5, if a user had any access to the WebSphere Application Server
    administrative console, that user had complete and total access to the administrative
    console. If you wanted to give a user the ability to rotate log files at four
    in the morning, you also had to give that user the rights to to delete the entire
    application server and uninstall every running application. There was no happy
    medium.


    WebSphere 5 has changed all of that. Whereas earlier versions of WebSphere only
    differentiated between administrators and non-administrators, WebSphere 5 provides
    four different administrative roles with which we can associate trusted users:


    +   * Administrator

    * Operator

    * Configurator

    * Monitor


    A monitor can monitor whether various objects are stopped or started, but cannot
    make any changes to a live system


    A configurator has all the rights of a monitor, but can also change settings on
    various objects. They do not have the right to stop and start resources however.'
