    So the Cree Indian learns Spanish, and the Estonian learns Spanish, and the two
    can communicate with each other. Furthermore, if anyone wants to jump into the
    conversation, all they have to do is learn Spanish, and they can contribute as
    well. Spanish becomes the common language for doing business.


    > Note: the language scenario for web services is by no means original. I just
    wish I could remember who related it to me I could give them credit for it.


    In the enterprise world of application development, J2EE isn''t the only middleware
    solution, although it is definitely the best. A variety of standard and proprietary
    middleware implementations exist, from new .NET implementations, to legacy CORBA
    infrastructures. In fact, as companies merge and grow, these diverse sets of systems
    often exist within the same company. Getting these different middleware solutions
    to communicate is a'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Chapter 21


    problem, after all, they don’t speak the same language – Web Services address
    this very issue.


    # How do Web Services work?


    Web Services work by communicating with each other through text marked up in XML
    format. These XML text messages are transported across a network on a standard
    protocol called SOAP (Simple Object Access Protocol), which runs over http, the
    transport protocol of the Internet.


    A Web Service describes itself in a Web Services Language Definition file (WSDL).
    The WSDL file describes what a web service can do, and how text messages should
    be formatted when a client wants to invoke a Web Service on a server.


    For example, a credit card verification Web Service would have a WSDL file that
    would say something like this:


    > “Hey, I’m a Web Service named CreditCardChecker. If you want me to verify a
    credit card date and number, send me an XML message formatted like this:


    ```

    <number>### ### ### ###</number>

    <date>MM-DD-YY</date>

    ```


    If you give me an XML message marked up like that, I’ll give you response in XML
    format that looks like this:


    ```

    <valid>true || false</valid>

    ```


    You can just parse the XML for true or false to find out if the credit card is
    valid or not.


    “That’s it! I’m looking forward to hearing from you!!!


    Of course, this whole WSDL definition is in a structured, xml format, but you
    get the idea.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# WebSphere 6 and Web Services


    So, in order to create or use a Web Service, a component really only needs to
    be able to understand XML, and send a message over a network using the SOAP protocol.
    Supporting Web Services is a bit of work for some, but no more than teaching a
    Cree Indian and an Estonian to speak Spanish. 🙂


    Reading a WSDL file and parsing an XML message isn''t a lot to ask, considering
    that the payoff is the ability to communicate with any available Web Service on
    the Internet, regardless of its ‘behind the scenes’ implementation.


    # Are there any drawbacks to Web Services?


    Web Services are slow.


    Imagine a Cree Indian and an Estonian speaking Spanish to each other. The Cree
    Indian is translating all Spanish words back into Cree in order to understand
    the Estonian. When the Cree Indian wants to say something back to the Estonian,
    she figures out what she wants to say in Cree, and then translates it into Spanish,
    sending a Spanish translation to the Estonian. These translations would really
    slow down the whole process.


    Of course, the Estonian is new to Spanish as well, so the same type of translations
    between Estonian and Spanish must take place.


    It would be very interesting being a fly on the wall when this conversation is
    going on – assuming you''re a fly that speaks Spanish that is.


    Web Services are equally slow – after all, XML must be parsed and reconstructed
    on both sides of the Web Services equation. Furthermore, Web Services will be
    passing text-'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Chapter 21


    based messages across a network, which is always a potential application bottleneck.


    Of course, the benefit is the fact that the Web Services are more effective than
    any other solution on the market for gluing together diverse architectures and
    implementations. If your problem is making a .NET application talk to you Enterprise
    JavaBeans, Web Services will solve your problems, and the performance issue will
    seem rather insignificant compared to the overall benefits.


    # Why are Web Services so hot?


    IBM believes that they have the best middleware products on the market, and while
    I may throw out a sarcastic comment here and there regarding Big Blue, I believe
    them — especially with their WebSphere 6 offerings.


    But as great as IBM software and hardware is, there are plenty of companies out
    there that have invested heavily in non-IBM or even non-J2EE implementations,
    be it .NET, CORBA or a custom middleware infrastructure. It’s pretty hard to convince
    a company that has invested millions in .NET to spend millions more migrating
    to WebSphere and J2EE. For IBM, companies that are heavily invested in non-J2EE
    solutions are not likely going to be throwing much revenue IBM’s way, either now
    or in the future.


    But with Web Services, IBM can easily weasel their way into a .NET shop. Any .NET
    resource can easily be wrapped up in a Web Service, and WebSphere will be able
    to interact with it. A company wouldn’t have to throw away a .NET investment in
    order to adopt WebSphere. .NET and WebSphere could easily co-exist, leveraging
    the best of both technologies, and IBM could slowly migrate applications over
    to their amazing platform.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# WebSphere 6 and Web Services


    Of course, Microsoft has a similar philosophy. So does Oracle, WebLogic and all
    of the other middleware players.


    As far as Microsoft is concerned, if they can wrap up all of those JEEEE applications
    with Web Services, and subsequently communicate with their ease to use .NET framework,
    then an entire J2EE market and opportunity will open up for them.


    The great thing about Web Services is that every vendor is jumping on the bandwagon
    and playing along. And it is great for clients as well as vendors, because Web
    Services makes it possible for a company to bring in a variety of different middleware
    solutions and take advantage of a ‘best of breed’ scenario.


    Web Services also opens up the middleware market to all of the major players.
    Competition in the market between all middleware providers will appeal to those
    misguided free-market types, and hopefully, the level of quality of the products
    on the market will greatly improve, with the best middleware solution market rising
    to the top. At least, that’s what Adam Smith taught us.


    Web Services is currently the most exciting part of the middleware market.


    # How does J2EE 1.4 integrate Web Services?


    Java Specification Request (JSR) 109 – Implementing Enterprise Web Services is
    a new part of the J2EE 1.4 specification. This specification standardizes how
    Web Services are created and subsequently deployed to a J2EE compliant application
    server.


    JSR 109 also describes the semantics through which a Servlet or EJB may use and
    interact with Web Services. For the very first time, Web Services are being'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Chapter 21


    incorporated into the J2EE specification. This is the most significant change
    or addition to the J2EE spec.


    Of course, it should be noted that IBM has always, or at least since WebSphere
    4, had extensive support for Web Services. IBM has pushed the evolution of Web
    Services as much as, if not more than, any other middleware vendor.


    Web Services is finally part of the J2EE specification, but this isn’t anything
    new for WebSphere. Web Services have been an an important part of the IBM game
    plan for a very long time.


    Web Services and WebSphere together make a powerful combination, powerful enough
    to conquer the middle tier. Just you wait and see.'
  merge: -1
  pgno: 269
