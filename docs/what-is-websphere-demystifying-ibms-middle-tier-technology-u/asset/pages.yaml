  md: 'JSP. When a JSP is invoked, whether invoked through a bookmark or typed into
    the address bar of a web browser, it is typically requested through a GET invocation.
    To secure this JSP, you would give the database administrators group exclusive
    access to the resource through a GET invocation, and disallow anyone else from
