    # Why might you serve Servlets by class name?


    Older applications invoked a Servlet by using the class name of the Servlet in
    the URL. Enabling the ability to serve a Servlet by class name allows clients
    to call a Servlet by using an address such as:


    ```

    http://mncz.com/webmodule/com.myapp.servlet.MyServlet

    ```


    You might enable Servlets by class name in order to support older Servlet applications.
    However, serving Servlets by class name bypasses the application server''s security
    service, opening a security hole that could easily be penetrated by a clever hacker.


    Migrate your older applications as soon as possible, and get out of the habit
    of serving Servlets by class name.


