  md: '# Entity Beans


    With a top down mapping, tools such as WebSphere Studio Application Developer
    will allow you to create EJB components first, and then the tool will generate
    SQL scripts that will create database tables based upon the components you have
    coded.


    Meet in the middle happens when your database administrators and your application
    developers just can''t agree on how to coordinate the relational model with the
    object model. The developers go off and create EJBs. The database admins go off
    and create their database. Then some poor schmuck has to figure out how to bring
    the two parts together. In other words, the schmuck must meet the relational and
    object models in the middle.


    Meet in the middle allows Java developers to map EJBs that have been created in
    isolation to database tables that already exist. This is probably the most common
    type of EJB mapping we see in the industry.


    # What is a BMP Entity Bean?


