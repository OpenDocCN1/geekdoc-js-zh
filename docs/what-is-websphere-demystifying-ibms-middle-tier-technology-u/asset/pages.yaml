  md: '# # Chapter 20

    WebSphere Portal


    # ## Why do we need a portal?


    Enterprise development is hard. That’s why we need J2EE. J2EE provides a strong
    foundation upon which we can build our enterprise applications. Important services,
    such as database pooling and security, are implemented by those clever spuds who
    design the application server-enterprise architects and developers are then allowed
    to concentrate on the business logic needed to get their applications up and running.


    Unfortunately, J2EE isn’t a panacea in itself. The developer is still burdened
    with a significant amount of work if they want to get their applications working
    properly. A J2EE application server will take care of transactions and object
    distribution, but it won’t help your notoriously lazy Java developers with common
    tasks such as internationalization or error handling; addressing these tedious
    tasks still falls into the domain of the developer.


    Of course, we do have a variety of open source projects that help address such
    issues. Apache frameworks such as Struts and Cocoon further simplify J2EE development
    by'
