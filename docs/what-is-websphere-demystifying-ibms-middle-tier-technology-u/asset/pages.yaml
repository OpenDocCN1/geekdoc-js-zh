    # What happens if my JNDI name or resource reference doesn''t resolve properly?


    If the naming service fails to resolve your JNDI lookup, you will enter the world
    of the NameNotFoundException, and in quite unremarkable fashion, your application
    will ground to a halt.


    Don''t fret though – you''re not alone. I don''t know how many developers who
    haven''t dedicated a weekend or two to debugging naming issues on an application
    server.


    Here are a few JNDI troubleshooting hints:


    +   * Your name is case sensitive, and my name is case sensitive. Extend the same
    courtesy to your JNDI bound objects. JNDI names are case sensitive.


    +   * Try to stick with lower case letters when naming your EJBs, nodes and servers.
    One lettered inconsistently will throw the lookup right off.


    +   * You should also notice that the name of the ejb is usually just the package
    name and the name of the home interface, all subfoldered under the ejb directory.


    +   * A common mistake is to do a lookup on the relative name “ejb/com.ibm.UserHome”
    The dot notation won''t work. Elements of the package name are delineated by Unix
