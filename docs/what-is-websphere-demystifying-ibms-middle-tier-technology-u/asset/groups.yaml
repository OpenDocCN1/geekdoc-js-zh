    A stateless session bean is a session bean that does not maintain any internal
    state. From a Java standpoint, a session bean does not possess any internal state.


    > "Stateless session beans don’t discriminate."


    ### When would I use a stateless bean?


    On the surface, a stateless session bean might appear to be useless. After all,
    it doesn''t interact with a database, it doesn''t read from a message queue, and
    it doesn''t even possess internal state.


    Quite contrary to first impressions, stateless session beans are the most important,
    most useful and most exciting JavaBeans our developers will create.


    ### A Session Bean Scenario


    Imagine your application had a requirement that it must be able to update three
    different databases in an all or nothing type of transaction.


    Database One might represent a users savings account, for which the user is transferring
    out $100.


    Database Two represents the user’s checking account, which the user is transferring
    in $100. The money being transferred into the checking account is equal to the
    money being transferred out of the savings account.


    And when the transfer into the checking account is complete, and the transfer
    out of the savings account is complete, a third database keeps track of the transaction,
    so that the user can be charged exorbitant banking fees at the end of the month.


    How could we coordinate this simultaneous and transactional update of three different
    databases? We could simply create a stateless session bean with a single method
    that calls on three different entity beans.


    We could tell this one method, by configuring its deployment descriptor, to run
    within the scope of a transaction, so if any database writes fail, all the database
    writes will be rolled back.

