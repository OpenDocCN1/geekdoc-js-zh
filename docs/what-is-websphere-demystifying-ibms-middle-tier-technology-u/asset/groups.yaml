    # Chapter 19


    # The Application Classloader:

    com.ibm.ws.classloader.CompoundClassLoader


    Of course, our humble enterprise applications are by means on the same level as
    the ominous JVM and the ever important WebSphere Application Server. Correspondingly,
    our early files are given their own humble little loaders, separate from that
    of the WebSphere Application Server (WAS) and the Java Runtime Environment (JRE).
    A special classloader, called the com.ibm.ws.classloader.CompoundClassLoader,
    loads the resources found packaged inside our EAR files.


    The CompoundClassLoader can pull classes out of all of the different modules in
    an ear file. By default, all utility Jar files, connector modules, and EJB modules
    will have their classes loaded by the same instance of a common classloader.


    Since all of the utility Jars, EJB and connector modules (notice that I didn''t
    say web modules) share the same classloader instance, files in one module of the
    ear will be visible to other modules in the ear. This is a manifestation of the
    fact that a classloader is entitled to pull classes out of any JAR on its classpath.


    # Web Modules and the CompoundClassLoader


    By default, web modules do not share the same classloader instance as the other
    modules inside of an ear. Web modules get their own, private instance of the CompoundClassLoader,
    which will only load classes that exist within the web module. War files have
    their own private classloader, ensuring none of the other modules can peek inside
    the war file for classes they might need.'
