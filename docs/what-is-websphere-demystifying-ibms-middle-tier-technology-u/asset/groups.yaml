    In WebSphere 4, there was a central naming service to which all JNDI addressable
    resources in a common WebSphere domain were bound.


    With a single, centralized naming service, JNDI naming exceptions were few and
    far between. Regardless of which JVM your resource was running on, all you had
    to do was connect to the centralized naming service, which was accessible from
    any application server, provide the appropriate JNDI name or resource reference
    of the object'
