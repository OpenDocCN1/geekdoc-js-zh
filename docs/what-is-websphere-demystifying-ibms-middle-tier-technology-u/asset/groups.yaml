    # 第 21 章


    归根结底，问题在于它们使用的语言不同——Web 服务正是为了解决这个问题。


    ## Web 服务是如何工作的？


    Web 服务通过 XML 格式标记的文本进行相互通信来工作。这些 XML 文本消息通过一种名为 SOAP（简单对象访问协议）的标准协议在网络上传输，该协议运行在互联网的传输协议
    http 之上。


    Web 服务在 Web 服务语言定义文件（WSDL）中描述自身。WSDL 文件描述了 Web 服务可以做什么，以及当客户端想要调用服务器上的 Web 服务时，文本消息应该如何格式化。


    例如，一个信用卡验证 Web 服务将有一个 WSDL 文件，其内容可能如下：


    > “嘿，我是一个名为 CreditCardChecker 的 Web 服务。如果你想让我验证信用卡的日期和号码，请向我发送一个格式如下的 XML 消息：


    ```

    <number>### ### ### ###</number>

    <date>MM-DD-YY</date>

    ```


    如果你给我一个像这样标记的 XML 消息，我将给你一个看起来像这样的 XML 格式的响应：


    ```

    <valid>true || false</valid>

    ```


    你只需解析 XML 查找 true 或 false，即可找出信用卡是否有效。


    “就是这样！我期待你的回复！！！”


    当然，这整个 WSDL 定义都是结构化的 XML 格式，但你已经明白它的意思了。


    ## WebSphere 6 与 Web 服务


    因此，为了创建或使用 Web 服务，组件实际上只需要能够理解 XML，并使用 SOAP 协议在网络上发送消息。对于某些人来说，支持 Web 服务是一项工作量，但并不比教一个克鲁伊印第人和一个爱沙尼亚人说西班牙语难多少。🙂


    读取 WSDL 文件并解析 XML 消息并不是什么困难，考虑到回报是可以与互联网上任何可用的 Web 服务通信，无论其“幕后”实现如何。


    ## Web 服务有什么缺点吗？


    Web 服务很慢。


    想象一个克鲁伊印第人和爱沙尼亚人正在用西班牙语互相交流。克鲁伊印第人将所有的西班牙语单词翻译回克鲁伊语以便理解爱沙尼亚人。当克鲁伊印第人想回爱沙尼亚人说话时，她先用克鲁伊语想好要的话，然后将其翻译成西班牙语，将西班牙语翻译发送给爱沙尼亚人。这些翻译会极减慢整个过程。


    当然，爱沙尼亚人对西班牙语也是新的，因此爱沙尼亚语和西班牙语之间必须进行相同类型的翻译。


    在这场对话发生时充当一只墙上的苍蝇会非常有意思——假设你是一只会西班牙语的苍蝇的话。


    Web 服务同样慢——毕竟，XML 在 Web 服务的等式双方都必须经过解析和重构。此外，Web 服务将在网络上传输基于文本的消息，这始终是一个潜在的应用程序瓶颈。


    当然，它的好处在于 Web 服务在将不同的架构和实现连接在一起方面比市场上的任何其他解决方案都更有效。如果你的问题是让 .NET 与你的 Enterprise
    JavaBeans 通话，Web 服务将解决你的问题，与整体收益相比，性能问题将显得微不足道。


    ## 为什么 Web 服务如此火热？


    IBM 相信他们拥有市场上最好的中间件产品，虽然我在这里可能会对“大蓝（IBM）”抛出一些讽刺的言论，但我相信他们——尤其是他们的 WebSphere 6
    产品。


    但无论 IBM 的软件和硬件有多优秀，市场上也有许多公司对非 IBM 甚至非 J2EE 的实现投入了资，无论是 .NET、CORBA 还是自定义的中间件基础设施。要说服一家在
    .NET 上投入了数百万美元的公司再花数百万迁移到 WebSphere 和 J2EE 是困难的。对于 IBM 来说，那些大量投资非 J2EE 解决方案的公司，现在或未来都不可能再为
    IBM 带来大量收入。


    但通过 Web 服务，IBM 可以轻松地渗透进 .NET 领域。任何 .NET 资源都可以轻松地封装在 Web 服务中，而 WebSphere 能够与之交互。公司不需要为了采用
    WebSphere 而丢弃对 .NET 的投资。.NET 和 WebSphere 可以轻松共存，利用这两种技术的各自长处，而 IBM 可以缓慢地将应用程序迁移到他们惊人的平台上。


    ## WebSphere 6 与 Web 服务


    当然，微软也有类似的哲学。Oracle、WebLogic 以及所有其他中间件领域的参与者也是如此。


    对于微软来说，如果他们能用 Web 服务封装所有这些 J2EE 应用程序，并随后与易于使用的 .NET 框架进行通信，那么整个 J2EE 市场将为他们敞开。Web
    服务的伟大之处在于，每个供应商都在赶潮流并配合。这对客户来说也是极好的，因为 Web 服务让公司能够引入各种中间件解决方案，并利用“同类最优”场景。Web
    服务还为所有主要供应商开放了中间件市场。所有误导市场类型之间的竞争，希望市场产品的质量将大大提高，最好的解决方案将脱颖而出。至少，Adam 是这样教我们的。


    ## J2EE 如何集成 Web 服务？


    Java 规范 (JSR) 109 描述了 EJB 首次使用和与 Web 服务交互的语义，并被纳入 J2EE 规范。当然，需要注意的是，IBM 一直对 Web
    服务有广泛的支持。IBM 对 Web 服务演进的推动与其他任何其他供应商相当，甚至更多。Web 服务终于成为了 J2EE 规范的一部分，但这对 WebSphere
    来说并不是新事。Web 服务长期以来一直是其计划的重要部分。Web 服务和 WebSphere 构成了一个强大的组合，足以征服中间层。拭目以待吧。


    '
