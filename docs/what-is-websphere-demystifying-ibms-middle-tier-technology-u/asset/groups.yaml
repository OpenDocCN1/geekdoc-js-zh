    \n或者可能一个用户正在参加在线考试：我们希望跟踪用户提供的每一个答案。http 协议没有提供从上一次调用到下一次调用跟踪用户操作的机制。这正是 Servlet\
    \ API，更具体说是 HttpSession 发挥用场的地方。\n\n![](img/a64fe132c0e172db17f8974af89bd4d4_129_0.png)\n\
    \n> 加拿大和 http 协议有一个共同点：它们都是无状态的。加拿大有十个省和三个相对空旷的地区，但没有州。当然，他们盯着密歇根州已经很久了。\n\n##\
    \ HttpSession 的目的是什么？\n\nHttpSession 为无状态的、基于 Web 的服务器交互添加了状态。当客户端向应用程序服务器调用时，Servlet\
    \ 开发者可以程序化地创建 HttpSession 并与该客户端关联。然后可以使用该会话来跟踪有关用户的各种信息。\n\n如果用户告诉我们他们喜欢的颜色，我们可以在他们的会话中存储信息。如果用户给了我们地址和电话号码，我们可以将其存储在他们的会话中。如果他们正在参加在线考试，我们还可以把给他们的每个问题的答案也放入会话中。然后我们可以在任何时间回到该会话对象并提取这些信息。\n\
    \n所以，当用户完成在线考试后，我们可以进入他们的会话，找出哪些题答对了，哪些题答错了。如果客户端正在挑选书籍或其他想要购买的产品，当他们点击“结账”时，我们可以进入他们的会话，处理订单并告诉他们购买金额是多少。\n\
    \nHttpSessions 为无状态协议添加了状态，它们是使在线应用程序正常运行的关键。\n\n## WebSphere 如何将会话映射到客户端？\n\n\
    那么，我们有了这个神奇的组件，它能从无状态协议创建出有状态的体验。问题是，WebSphere 是怎么做的？\n\n嗯，当应用程序服务器为用户创建会话时，会生成一个疯狂唯一的数字并立即与该用户关联。然后，每当开发者将信息放入用户的会话时，该信息会自动与客户端的唯一\
    \ ID 关联。这一切都在服务器上安全地完成。\n\n为了将客户端的浏览器与其会话绑定，WebSphere 在客户端浏览器上放置一个瞬态 cookie（transient\
    \ cookie）。这个瞬态 cookie 包含了创建用户会话时生成的那个疯狂唯一的数字。\n\n我们放置在客户端机器上的 cookie 包含客户端唯一的\
    \ session id。在客户端向服务器发出的后续请求中，包含 session id 的 cookie 都会通过网络传回，漂亮！服务器就将用户与其会话绑定了。\n\
    \n## 第 13 章\n## 什么是瞬态 cookie（transient cookie）？\n\nWebSphere 通过用户的 Web 浏览器在客户端机器上放置一个瞬态\
    \ cookie。\n\n瞬态 cookie 维护在浏览器内存中，永远不会被写入文本文件。所有其他类型的 cookie 实际上都会持久地存储在用户的硬盘上。\n\
    \n因为 cookie 驻留在内存中，当客户端关闭浏览器时，cookie 以及随后的客户端会话将会丢失。\n\n某些客户端认为 cookie 是一个潜在的安全漏洞，尽管没有证据支持这一说法。为了安抚安全意识强的用户，可以配置浏览器接受瞬态\
    \ cookie，而不是那些实际写入硬盘的 cookie。\n\n## 如果禁用 cookie，我的应用程序还能工作吗？\n\n是的，如果禁用 cookie，你的\
    \ WebSphere 程序将无法工作——至少在默认配置下。Cookie 是存储 session id 的首选机制。\n\n如果禁用 cookie 听起来很有吸引力，但让我问你一个问题：如果客户担心一个名为\
    \ cookie 的简单文本文件会破坏他们的电脑，那么你获取那个焦虑用户的电子邮件地址、家庭地址或信用卡的概率是多少？我会说介于零和负之间。\n\n害怕 cookie\
    \ 是理性的。你不必担心无法服务这些理性的客户端。\n\n## 图 13-1 使用 Netscape Navigator 查看 Cookie\n\nWebSphere\
    \ 在客户端浏览器上放置了一个名为 JSESSIONID 的 cookie。\n\n查看并删除存储在计算机上的 cookie。\n\n| 站点 | Cookie\
    \ 名称 |\n|---|---|\n| google.com | PREF |\n| localhost | JSESSIONID |\n| netscape.com\
    \ | sampler |\n| netscape.com | BCISP |\n\n所选 Cookie 的信息\n名称: JSESSIONID\n内容:\
    \ 0000OCHSDJHDPV3UFHC0H3ZBUA:-1\n主机: localhost\n路径: /\n安全: \n过期: 会话结束\n策略: 无策略\n\
    \n## 管理 session id 有其他选项吗？\n\nWebSphere 提供了三种将用户与其会话绑定的机制：\n\n- Cookies\n- URL\
    \ 重写\n- SSL 跟踪\n\n**图 13-2** Web 提供了三种跟踪 session id 的机制。\n\n会话跟踪机制：[ ] 启用 SSL\
    \ 跟踪 [x] 启用 Cookies [ ] 启用 URL 重写 [ ] 启用协议重写\n\n## 什么是 URL 重写？\n\nURL 重写是一个很好的\
    \ session id 映射选项，因为与 cookie 不同，它无法被禁用。这起起来可能很有吸引力，但它绝不是跟踪 session id 的万能药。\n\n\
    当你使用 URL 重写时，客户端的唯一 session id 会被添加到页面上每个链接的末尾。因此，用户访问不是：\n\n- www.ibm.com/index.html\
    \ 而是：\n- www.ibm.com/index.html?sessionid=123xyz\n\n"
