    \ “ear 只是一个带有 .ear 后缀的 zip 文件”\n\n当然，考虑到 Java 世界的现状，简单地将“zip 文件”称为“zip 文件”就太过于直白了。相反，我们必须给这个\
    \ zip 文件起一个可爱又亲切的小名字，比如“ear”。\n\n# 第 11 章\n\n有人发现“ear”可以代表 Enterprise Application\
    \ Archive（企业应用归），每个人都会喜欢这个可爱的缩写词。\n\n现在，ear 文件本身并不有趣。有趣的是压缩在 ear 文件内部的所有所有内容。\n\
    \n## 图 11-1\n\near 文件只是一个带有 ear 后缀的 zip 文件。你可以使用诸如 WinZip 的压缩工具打开任何 ear 文件。\n\n\
    img/a64fe132c0e172db17f8974af89bd4d_99.png\n\n使用 WinZip 或任何其他解压工具打开 ear 文件将将看到各种\
    \ war 文件、jar 文件和几个 XML 文件。ear 文件至少包含一个 web 模块、EJB 模块或资源模块。一旦满足了这一要求，欢迎任何数量的额外\
    \ EJB 或 web 模块。\n\n# 探索 EAR\n\n## application.xml 的重要性是什么？\n\n每个 ear 文件中都有一个名为\
    \ application.xml 的 xml 文件，它是企业归档的部署描述符。如果你打开这个部署描述符查看，你会发现它真的写着：“我是一个企业级应用，我包含了一堆\
    \ web 模块和 EJB 模块。”\n\n在 ear 的根目录下还有一个 xml 文件，其中包含了关于 J2EE 规范扩展的信息。\n\n## 图 11-2\
    \ Application.xml 文件\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<application\
    \ id=\"Application\">\n  <display-name>PulpJava</display-name>\n  <module id=\"\
    EjbModule\">\n    <ejb>PulpJavaEJB.jar</ejb>\n  </module>\n  <module id=\"WebModule\"\
    >\n    <web>\n      <web-uri>PulpJavaWeb.war</web-uri>\n      <context-root>PulpJavaWeb</context-root>\n\
    \    </web>\n  </module>\n  <module id=\"ConnectorModule\">\n    <connector>PulpJavaConnector.jar</connector>\n\
    \  </module>\n</application>\n```\n\n## 什么是 IBM 扩展（IBM Extension）？\n\n只要供应商正确实现了\
    \ J2EE 规范，就允许超越规范，添加他们认为应用程序服务器用户可能会有帮助的功能。扩展代表了一个点——如果一个供应商拥有一系列让其服务器更容易使用的扩展，人们就会蜂拥于该供应商。至少，亚当·斯密（Adam\
    \ Smith）是这么教的。\n\n用于 ear 的 IBM 扩展文件其实并不有趣，因为它仅仅允许你设置共享会话上下文并为各种模块指定重新加载间隔。当我们打开\
    \ EJB 和 web 模块时，会看到更有趣扩展。\n\n## 图 11-3\n\n| Ear 级扩展 | WebSphere 扩展 |\n|---||---|\n\
    | 共享会话上下文和重新加载间隔是针对规范的 IBM 扩展，在 ear 级别进行配置。 | 以下是 WebSphere 应用服务器的扩展属性：br>重新加载间隔：秒(s)<br>共享会话上下文\
    \ |\n\near 文件真正有趣的部分是它包含的 war 和 jar 文件。\n\n> “扩展是对标准 J2EE 部署描述符的补充。它们允许使用企业扩展、旧系统或规范未定义的行为”\
    \ – 应用组装工具（Application Assembly Tool）\n\n## 什么是 WAR 文件？\n\n我提到过 Java 世界倾向于拿普通的\
    \ zip 文件给它们起可爱又亲切的名字吗？没有什么能比一个好的 war 包更能体现“可爱又亲切”。\n\nWAR 是 Web Application Archive（Web\
    \ 归档）的缩写。\n\n你所有的动态 Web 内容，包括所有的 Java Server Pages、所有编译后的 Servlets、支持的 Java 类，以及包括\
    \ web 模块部署描述符和扩展文件的其他几个文件，都被压缩成单个文件。当你压缩了所有的 Web 组件并将 zip 文件的扩展名改为 .war 时，你就有了一个准备好部署的\
    \ J2EE web 模块。\n\n你所有的动态 Web 组件都打包在一个 WAR 文件中。\n\n> 所以，如果布鲁斯·斯普林斯（Bruce Springsteen）问你“war，它是做什么用的？”，你可以简单地回答：“它非常适合将你所有的基于\
    \ Web 的组件打包一个单一、简单、易于管理的 zip 文件。”\n\nimg/a64fe132c0e172db17f8974af89bd4d_102_png\n\
    \n就像 ear 文件一样，war 文件也会包含一个部署描述符，尽管 web 模块中的部署描述符名为 web.xml，而不是 application.xml。如果你打开\
    \ war 文件，还会注意到 web 模块强制性的扩展和绑定文件，分别命名为 ibm-web-ext.xml 和 ibm-web-bnd.xml。\n\n\
    ear 文件的部署描述符指向它包含的各种 web 和 EJB 模块，而 web 模块的部署描述符则指向由 Web 容器部署和管理的各种 Servlet。\n\
    \n当然，web.xml 文件可能比简单指向它包含的各种 Servlet 要复杂得多。\n\n## 图 11-4 观察 War 文件内部\n\n与 ear\
    \ 文件类似，war 文件是一个带有创意命名 .war 后缀的 zip 文件。web 模块被打包成 war 文件。\n\nimg/a64fe132c0e172db17f8974af89bd4d_103_0\n\
    \n## war 的部署描述符可以配置哪些类型的内容？\n\nweb 模块的部署描述符包括\n\n- 模块级变量 (ServletContext)\n- 哪些\
    \ Servlet 在启动时加载\n- Servlet 的初始化参数\n- 如何对 Servlet 进行安全保护\n- 错误代码映射\n- 生命周期监听器\n\
    - Servlet 过滤器\n\nweb.xml 文件包含了许多黄金配置数据，但 web 部署描述符中最重要的部分是 web 模块所包含的各种 Servlet\
    \ 的列表和映射。\n\n"
