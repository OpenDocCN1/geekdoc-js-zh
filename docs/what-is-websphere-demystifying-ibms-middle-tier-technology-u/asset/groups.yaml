    ## Flavors of WebSphere


    ## What is the Network Deployment Manager?


    Base installations of WebSphere are great, but without the ability to recover
    from a system failure, not too many people are going to be interested in it. If
    you want to implement a workload managed architecture, you’ve got to install the
    Network Deployment Manager.


    The Network Deployment Manager, also known as the network deploy tool, dmgr, or
    even just the deployment manager, is a completely separate installation from the
    base install, and can reside on any computer on your network.


    The network deploy tool can be installed on the same computer as a base installation,
    or it can alternatively be installed on a clean, green, computing machine that
    has nothing but an operating systems and all of the required fix packs configured.


    ## How does the deployment manager work?


    After installing the deployment manager, the dmgr seeks out, with the assistance
    of the WebSphere Administrator, unsuspecting base installations that are oblivious
    to the newly installed deployment manager.


    Either by invoking the addNode command from the bin directory of the base installation,
    or by using the deployment manager’s admin console and connecting to a running
    base installation, the deployment manager essentially hypnotizes an independently
    running base install, subsequently instructing the base installation to join the
    deployment manager’s domain and obtain all future configuration changes and updates,
    from the time of federation and forward, from the deployment manager.


    ## Chapter 15


    > The Deployment Manager acts like a menacing WebSphere Borg ship, seeking out
    independent base installations and then federating the base installations into
    a common administrative domain.


    ## How many base installations can the network deploy tool manage?


    Any number of nodes can be added to a deployment manager. Once these independent
    base installations are federated, the deployment manager becomes a single, central
    point of administration.


    All of the WebSphere installations that are managed by a single deployment manager,
    including the deployment manager itself, are collectively referred to as an administrative
    cell or a common administrative domain.


    ## How does the deployment manager store the configuration data of the cell?


    The way the WebSphere 5, Network Deployment Manager maintains the configuration
    data for the administrative domain represents quite a departure from previous
    versions of WebSphere. The deployment manager maintains all of the configuration
    data for the entire cell in xml files stored on its local file system.


    WebSphere 3 and 4 maintained all configuration information in a centralized, JDBC
    compliant database. Of course, the centralized database introduced a single point
    of failure inside of the WebSphere architecture, while at the same time, presenting
    a potential performance bottleneck.


    WebSphere decided that storing configuration data in xml format on the file system
    of the deployment manager, and then pushing those changes out to base installations


    ## Flavors of WebSphere


    was a robust implementation that eliminated the centralized database as a bottleneck
    and central point of failure.


    In a network deploy managed environment, when the configuration of one of the
    WebSphere base installations needs to change, the change must be done through
    the deployment manager. The deployment manager writes these changes to an xml
    file on its local file system and pushes the changes out to the various base installation
    nodes within the cell. Transferring configuration data between the deployment
    manager and the base installation is referred to as *synchronization*.


    ## What happens if the deployment manager goes down?


    Another interesting characteristic of the deployment manager is the fact that
    there is no 24/7-uptime requirement. If the deployment manager goes down, there
    is no negative impact upon the applications that are running on the base installation.
    This is attributable to the fact that the deployment manager is used only for
    making changes to a cells configuration.


    The deployment manager does not handle, serve or respond to client requests. If
    the deployment manager goes down, it will not be possible to make configuration
    changes to the administrative cell, but so long as your hard working base installations
    are up and running, applications will continue to run uninterrupted. The base
    installations are responsible for responding to client based requests, not the
    deployment manager.


    The deployment manager doesn''t run any web based applications or resources such
    as JSPs or Servlets, and it isn''t designed to host Enterprise Java Beans. The
    deployment manager simply accepts configuration changes


    ## Chapter 15


    from an administrator, and pushes those changes out to the WebSphere base installations
    within the cell.


    ## What is the node agent?


    When a base installation becomes ‘federated’ into the domain, a dormant process,
    known as the node agent, becomes active. The node agent is a java process that
    runs on base installations and communicates with the deployment manager, accepting
    configuration updates, and subsequently writing those updates to its local set
    of xml files.


    Configuration changes are made through the deployment manager. When a base installation
    starts up, and also at predefined intervals, the node agent running on the base
    installation will communicate with the deployment manager and receive updates
    or configuration changes. Those configuration changes are then integrated into
    the runtime environment of the base installation.


    ## How does a federated base differ from an unfederated base?


    An unfederated base runs all of the services required to support the J2EE specification
    on a single, lonely, Java Virtual Machine (JVM). When a node becomes federated,
    a new Java Virtual Machine, known as the node agent, becomes active. An unfederated
    base installation does not maintain an active node agent.


    Furthermore, any messaging infrastructure that may have been configured on a base
    installation gets factored out as a separate JVM when an unfederated base installation
    becomes federated.


    An unfederated base installation runs all J2EE components, and provides all of
    the service and protocols required by the J2EE specification, within a single
    Java Virtual Machine.


    A base installation runs all J2EE services and components on a single JVM. In
    a federated domain, several Java Virtual Machines can work together to support
    the management and runtime environment required by out J2EE applications.


    ## What exactly is a node?


    When we think of a node, we typically think of a single, physical computer. Even
    if we open a book about WebSphere, networking, or development, any diagram that
    sees a node usually refers to a single, physical machine. This is not exactly
    the case with WebSphere.


    With WebSphere, a node refers to an installation of the WebSphere software.


    For example, you could install the base edition on a computer, and then come along
    with the discs for the network deployment manager and install that on the same
    machine as well. In that case, you would have two WebSphere nodes: one node representing
    the deployment manager and one node representing the base install.


    You could even install the base edition into two separate directories on your
    file system, start both of those installations at the same time, and you would
    actually have two base edition nodes running on a single computer. So essentially,
    the node refers to an installation of the WebSphere software, not a single physical
