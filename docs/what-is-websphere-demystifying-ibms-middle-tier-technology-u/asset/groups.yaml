    Will my WebSphere 4 applications work with the WebSphere 5, distributed namespace?


    Backwards compatibility? Don’t be a fool.


    In WebSphere 5, each JVM maintains its own local namespace. Objects created on
    that JVM are bound to the naming service running on that JVM.


