    \ 名称不是在部署描述符中配置的。\n\n固定名称到依赖拓扑名称的绑定成为 WebSphere 域的持久属性，并与单元中的每个节点和应用程序服务器共享。\n\
    \n固定或持久的 JNDI 名称是 WebSphere 单元配置的一部分。相比之下，资源引用是在 Web 或 EJB 模块的部署描述符中配置的。\n\nWebSphere\
    \ 管理员的工作是进入管理控制台，并将持久名称映射到运行在域中某个应用程序服务器上的依赖拓扑的资源。\n\n## 第 18 章\n\n## 固定 JNDI\
    \ 名称是如何工作的？\n\n以下描述了如何将持久 JNDI 名称映射到依赖拓扑的 JNDI 名称。\n\n- cell/cluster/england05/ejb/com/ulpjava/session/Timer\
    \ 是集群化 EJB 的依赖拓扑名称\n- 该 EJB 的持久引用被配置在持久命名空间下，名称为 ejb/Timer\n- cell/persistent/ejb/Timer\
    \ 是开发者在客户端代码中执行 JNDI 查找时使用的名称\n- 应用程序服务器将持久名称解析为依赖拓扑名称，并向客户端返回 EJB 的引用\n\n从单元中的任何节点开始，对名称\
    \ cell/persistent/ejb/Timer 的查找将始终解析为在 worldcup 节点上的 england05 集群中运行的 Timer。\n\
    \n在名为“持久命名空间”的空间中，实际上并不存在任何 EJB，相反，在此持久命名空间上执行的查找将被定向到部署在 WebSphere 域中特定节点上特定服务器上的真实存在的\
    \ J2EE 资源。\n\n## 使用 JNDI 进行企业级命名\n\n图 18-3 配置持久名称映射\n\n运行在 worldcup 节点上 germany01\
    \ 服务器上的 Timer ejb，可以使用固定名称 cell/persistent/ejb/Timer 进行查找。\n\n## 新命名空间绑定\n\n-\
    \ 步骤 2：指定基本属性\n\n| 绑定类型 | EJB |\n| :--- | :--- |\n| 绑定标识符 | Timer 绑定 |\n| 命名空间中的名称\
    \ | ejb/Timer |\n| 企业级 Bean 位置 | Node worldcup |\n| 服务器 | germany01 |\n| JNDI\
    \ 名称 | ejb/com/ulpjava/session/Timer |\n\n## 我的 WebSphere 4 应用程序可以在 WebSphere\
    \ 5 分布式命名空间下运行吗？\n\n向后兼容性？别傻了。\n\n在 WebSphere 5 中，每个 JVM 维护其自己的本地命名空间。在该 JVM 上创建的对象将绑定到运行在该\
    \ JVM 上的命名服务。\n\n如果您的旧应用程序对运行在同一 JVM 上的资源进行查找，那么您应该是没问题的。但是，如果您的旧应用程序使用公共命名空间查找运行在域中另一个应用程序服务器上的\
    \ EJB 或其他资源，那么您的应用程序可能会失败。\n\n当您的组件位于一个 JVM 中，而您正尝试解析绑定到单元中另一个应用程序服务器上的 JNDI 服务器的资源时，对本地命名空间的查找将无法作用。如果您的任何旧\
    \ J2EE 应用程序使用中心化命名服务来查找远程对象（这可能有很多），那么它们将根本无法工作。\n\n再次，在 WebSphere 5 中，每个 JVM\
    \ 都管理自己的自己的命名服务。WebSphere 5 消除了 JNDI 作为中心化的单点故障，但当您将应用程序从版本 4 迁移到版本 5 时，它会引入巨大的\
    \ NameNotFoundException 烦恼。\n\n## 从版本 4 迁移到版本 5 时我们如何解决 NameNotFoundException？\n\
    \n好消息是，WebSphere 4 应用程序部署描述符中的资源引用可以重新配置，映射到运行在 WebSphere 5 应用程序服务器上的资源的固定名称。如果重新配置资源引用以指向固定名称，`java:comp/env`\
    \ 查找将能够工作，从而保留 WebSphere 4 和 WebSphere 5 命名实现之间的向后兼容性。\n\n## 使用 JNDI 进行企业级命名\n\
    \n 名称绑定看起来像是大量工作？\n\n将抽象名称绑定到体系特定的名称确实为 WebSphere 管理员增加了工作量，但这是值得的。而且实际上，这不应该给您的管理团队带来太大困难。\n\
    \n首先，查找名称从一开始就应该以资源引用的形式从应用程序中抽象出来。将旧应用程序从一个 WebSphere 版本迁移到另一个版本应该只涉及编辑部署描述符，可能还有少量属性文件。\n\
    \n其次，“一种方式编码，另一种方式部署”应该是一种准则，而不是新奇事。强制开发者抽象出他们在应用程序中使用的名称，并允许管理员将代码中使用的名称绑定到服务器上运行的真实\
    \ EJB，可以提高灵活性和维护性。创建命名空间绑定是一项额外的工作，但它会产生丰厚的回报。\n\n我只是使用像 ejb/User 这样的相对名称查找我的组件，一切运行良好。\n\
    \n如果您正在使用直接 JNDI 查找，您就是在履薄冰。\n\n如果您访问本地服务器上的资源，像 `ejb/User` 这样的纯相对名称将始终有效；然而，一旦您将应用程序跨越到多个服务器、集群或更改了\
    \ EJB 的部署名称，你就进入了“痛苦”的环境。\n\n当您所有的 EJB 和 Servlets 都运行在相同服务器上时（这在测试环境中发生），相对名称将有效。如果您将相同的应用程序移动到生产环境，那么当您追逐\
    \ JNDI 异常时，您就要向清洁人员打招呼了。\n\n提前计划，并结合使用资源引用和持久命名空间。\n\n## 如果我的 JNDI 名称或资源引用无法正确解析会怎样？\n\
    \n如果命名服务无法解析您的 JNDI 查找，您将进入 NameNotFoundException 的世界，并且平庸地，您的应用程序将停滞。\n\n不过别担心——您并不孤单。我不知道有多少开发者没有花几个周末来调试应用程序服务器上的命名问题。\n\
    \n这里有一些 JNDI 故障排除提示：\n\n- 您的名称是大小敏感的，我的名称也是大小敏感的。对您的 JNDI 绑定对象同样的尊重。JNDI 名称是大小敏感的。\n\
    - 在命名 EJB、节点和服务器时，尽量使用小写字母。大小不一致的字母会导致查找失败。\n- 您还应该注意到 EJB 的名称通常只是包名和同类接口的名称，全部位于\
    \ `ejb` 目录下。\n- 一个常见的错误是对相对名称 `ejb/com.ibm.UserHome` 进行查找。点表示法不起作用。包名元素是用 Unix\
    \ 斜杠分隔的，而不是点。\n\n## 使用 JNDI 进行企业级命名\n\n## 我查找 EJB 时仍然遇到困难。有什么建议吗？\n\n当查找 EJB 遇到困难时，您最好的朋友是\
    \ `dumpsnamespace` 工具。`dumpsnamespace` 工具连接到在本地服务器上运行的 JNDI 服务，并告诉您绑定到本地命名空间的具体内容。`dumpsnamespace`\
    \ 还可以提供有关绑定到持久命名空间的对象的信息。\n\n您甚至可以提供 IP 地址作为参数并连接到远程 JNDI 服务器。\n\n使用 `dumpsnamespace`\
    \ 时，始终要小心连接到端口 2809 或 9809。取决于您如何配置兼容性，您的端口号可能会有差异。\n\n你好运。追逐 NameNotFoundException\
    \ 永远不那么有趣，但只要耐心坚持，您就能破解困扰您的命名难题。\n\n"
