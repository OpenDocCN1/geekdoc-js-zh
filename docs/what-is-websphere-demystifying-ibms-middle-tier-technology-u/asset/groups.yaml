    # Chapter 19


    # WebSphere Classloader: com.ibm.ws.bootstrap.ExtClassLoader


    WebSphere doesn’t want to step on any toes when it starts loading the classes
    that it needs at runtime. Rather than using the system classloader, WebSphere
    uses its own special classloader to load the J2EE resources it needs.


    When the system classloader is finished initializing, WebSphere takes over, kicking
    off its own classloader.


    The WebSphere classloader physically manifests itself as a Java class of type
    com.ibm.ws.bootstrap.ExtClassLoader


    Whereas the system classloader loads resources that support the Java Runtime Environment
    (JRE), the WebSphere classloader is responsible for initializing the J2EE runtime
    environment.


    The WebSphere classloader, also known as the WebSphere extensions classloader,
    loads all of the classes and files located in the \lib directory of the WebSphere
    Application Server.


