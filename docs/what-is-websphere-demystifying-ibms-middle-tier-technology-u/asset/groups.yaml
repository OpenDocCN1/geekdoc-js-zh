    # What is a utility JAR file?


    Regular Jar files may also included in the ear file. Java jar files placed in
    the ear simply contain Java code that might be shared between web modules and
    EJB modules.


    Utility JAR files are incredibly important because they make it possible for EJB,
    web and client modules to share the same set and version of Java classes. Common
    components used by EJB and web modules are packaged together in a regular JAR
    file that resides in the root of the ear file, alongside all of the client, web
    and EJB archives.


    Figure 11-8 Looking Inside an Utility Jar File


    Utility jar files aren''t nearly as sexy as war files and ear files. They simply
    contain reusable Java components, which I guess are kinda sexy.


