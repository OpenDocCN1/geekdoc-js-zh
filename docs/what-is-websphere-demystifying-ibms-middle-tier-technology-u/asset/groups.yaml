    government, it will need to know the user’s annual income. Portlets provide an
    edit mode, combined with a PortletData object, that allows them to take input
    from the user and store that information persistently. If a user tells a portlet
    their annual income, that portlet will permanently remember that information.


    A portlet, such as a weather portlet, might ask the user which cities should have
