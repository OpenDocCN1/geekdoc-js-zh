    # What are the drawbacks of using the WebSphere extensions classloader for common
    files?


    One thing that should be stated when talking about classloaders and the extensions
    directory is that any component that does a call back into a web module or an
    ejb module must be placed inside the ear and not on a classpath outside of the
    ear.


    For example, say a Servlet calls on a helper class that uses an EJB. If that helper
    class was placed outside of the ear, the Servlet would be calling a component
    that exists outside of the application context. If the helper class then made
    a call back into the ear, to interact with an EJB for instance, that callback
    would be treated as a completely anonymous invocation from a component outside
    of the application''s context.


    This poses a real problem, especially if we have security turned on or transactions
    running. By leaving the ear, the entire security context of the Servlet will be
    lost, and the resulting call will end up with an unauthenticated user cannot access
    the EJB, despite the fact that the client was challenged when the Servlet was
    first invoked.


    If you''re having problems with security, and you''re getting errors indicating
    that a secured resource is being invoked by an anonymous user, despite being challenged
    every time you try to access the component in question, then a component outside
    of the ear is making a callback.


    This scenario can be especially frustrating due to the fact that when security
    is not on, everything works fine. Only'
