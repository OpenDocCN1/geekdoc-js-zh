    # Where does WebSphere Portal fit into the whole WebSphere world?


    The WebSphere Portal Server is an extension to the WebSphere Application Server.
    The portal runs on top of the WebSphere Application Server – it does not replace
    it.


    WebSphere Portal takes advantage of all of the fundamental J2EE services and components
    such as naming, security, EJBs, Servlets and JSPs. By doing so in a fabulously
    creative and inventive manner, the portal provides a boatload of functionality
    over and above what someone would expect from a basic J2EE environment.


    # Why is the portal so hot?


    The portal is a complete environment for managing and integrating a large number
    diverse applications and user repositories across an enterprise wide system.


    A single administrative interface makes it possible to manage users, applications,
    content, look, feel and navigation of an entire website. Centralized administration
    of a huge web based infrastructure is probably the most compelling reason for
    adopting the portal.'
