    如果你在开发阶段将 JNDI 可寻资源的名称硬编码到应用程序中，而这些资源的名称在运行时发生了变化，那么你的应用程序将无法工作。为了避免这个问题，我们使用所谓的资源引用，将代码中使用的名称松地绑定到部署时赋予
