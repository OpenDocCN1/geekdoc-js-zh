    ## What is an “Application Server?”


    The WebSphere Administrative Console makes deploying ear files incredibly easy.
    (Wait, this text seems to repeat or overlap in the OCR, continuing based on logical
    flow)


    The WebSphere Administrative Console makes deploying ear files incredibly easy.
    (Actually, looking at the OCR for 118):


    The WebSphere Administrative Console makes deploying ear files incredibly easy.
    (Wait, let''s follow the OCR text for page 118):


    The WebSphere Administrative Console makes deploying ear files incredibly easy.
    (Wait, the OCR says "I mean, WebSphere is the application server, and it can create
