    # Chapter 16


    # What needs to be done to secure a JSP?


    In order to secure a JSP:


    +   - a mapping for the JSP must exist in the deployment descriptor of the web
    module

    - the JSP must be moved under the WEB-INF folder of the web module.


    If a JSP is outside of the WEB-INF folder, it can be invoked directly by any client,
    and none of the security configurations will restrict access. For JSP security
    to work properly, the JSP should be moved to a folder under the WEB-INF directory,
    and subsequently invoked through a name mapping.


    These name mappings, also known as URL mappings, are configured in the web.xml
    file.


    # What is a J2EE security role?


    The security infrastructure of a J2EE application is abstracted out as much as
    possible. For example, you wouldn''t write the actual names of users and groups
    from your user registry directly into your application. After all, your company
    might merge with another company, and your LDAP content and structure might completely
    change. If you have the names of users and groups from your LDAP server or user
    registry embedded in your applications, migration to a new LDAP server is going
    to be painful.


    When securing a J2EE application, the first task is to figure out, at a very abstract
    level, “who is going to be using this application."'
