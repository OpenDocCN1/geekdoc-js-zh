    ## WebSphere Portal


    ## 为什么我们需要门户（Portal）？


    企业级开发是困难的。这就是为什么我们需要 J2EE。J2EE 提供了一个坚实的基础，我们可以在此基础上构建企业应用程序。重要的服务（如连接池和安全性）是由那些设计应用程序服务器的聪明人们——企业架构师和开发者实现的，然后架构师和开发者被允许专注于让其应用程序运行所需的所需的业务逻辑。


    遗憾的是，J2EE 本身并不是万灵妙药。如果开发者想让他们的应用程序正常运行，他们仍然要承担大量工作。J2EE 应用程序服务器会处理事务和对象分布，但它不会帮助那些出了名的懒惰
    Java 开发者去处理国际化或错误处理等常见任务；处理这些繁琐的任务仍然属于开发者的领域。


    当然，我们确实有各种开源项目来帮助解决此类问题。Apache 框架（如 Struts 和 Cocoon）通过提供一个处理输入验证、错误处理和国际化的通用框架，进一步简化了
    J2EE 开发；然而，这仍然是不够的。有效地管理和维护庞大的企业环境极其复杂，仅仅通过 J2EE 和开源项目的组合无法解决。这就是门户大显身场。


    ## WebSphere Portal 在整个 WebSphere 世界中处于什么位置？


    WebSphere Portal Server 是 WebSphere Application Server 的扩展。门户运行在 WebSphere Application
    Server 之上——它并没有取代它。


    WebSphere Portal 利用了所有的基础 J2EE 服务和组件，例如命名、安全、EJB、Servlet 和 JSP。通过以极具创造力和创新的方式实现这些功能，门户提供了远超人们对基础
    J2EE 环境预期的功能。


    ## 为什么门户如此热门？


    门户是一个用于管理和集成跨整个系统的多种应用程序和用户库的完整环境。


    单一的管理界面使得管理整个网站的用户、应用程序、内容、外观和导航成为可能。对大型 Web 基础设施进行集中化管理可能是采用门户最有说服力的理由。


    ## 门户如何促进应用程序开发？


    门户开发者不再像构建典型的 J2EE 应用程序那样开发 Servlet，而是开发一种被称为 portlet（端口组件）的东西。


    portlet 在许多方面与 Servlet 相似。portlet 处理请求，并随后必须确定如何响应。然而，portlet 与 Servlet 之间的巨大区别在于，portlet
    负责渲染返回给客户端的网页中的*一小部分*。由于返回给客户端的页面实际上是多个 portlet 输出的组合，加上皮肤和主题，门户发送给客户端的响应通常被称为门户页面（portal
    page）。


    portlet 被放置在发送给客户端的整个页面上的一个小正方形内。门户提供了一个非常可插拔的环境。


    ## 开发 portlet 而不是 Servlet 的好处是什么？


    由于仅负责门户页面上的一的一小块区域，portlet 被迫使保持高度聚焦且具有特定的性质。portlet 的创建变得简单，是因为它们的用途非常明确，且受到功能蔓延的影响。


    此外，通过 portlet，开发者可以非常专注于业务逻辑和功能，并避免许多


