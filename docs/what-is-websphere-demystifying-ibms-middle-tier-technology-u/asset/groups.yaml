    # Exploring the EAR


    # Why might an ear file contain more than one web module?


    An ear file can contain any number of web and EJB modules. This begs the question,
    “should I deploy all of my web content in a common war file, or should I separate
    my web content into separate war files?”


    Well, application partitioning is an inexact science, but there are some rules
    we can follow.


    Take for instance a scenario where your enterprise application provides web access
    for both your human resources (hr) and accounting departments. Should this web
    application be separated into an accounting.war and an hr.war file, or should
    everything be packaged together into a single hraccounting war file?


    > When it comes to application packaging, there are no ''right answers.'' There
    are only ''wrong answers.'' The best we can do is try not to get the wrong answer.


    Here are a few important points to consider when developing, packaging and subsequently
    deploying an application.


    # The Session Problem


    Sessions, a mechanism for storing transient information about the client interacting
    with your website, are not shared across war files. If session information needs
    to be shared amongst hr and accounting modules, splitting your Servlets and JSPs
    across multiple war files is going to be a problem.'
  - '[PAGE 115]


    # Chapter 11


    # The Common ServletContext


    Servlets and JSPs can share information between each other by using a special
    scope named the ServletContext. If you are placing information in this ServletContext,
    such as the IP address of the accounting database, you probably don’t want you’re
    hr application to be able to access it.


    The ServletContext is not shared between war files. If you do not want one set
    of Servlets to see another set of Servlet’s ServletContext, you’re going to have
    to separate the two applications into separate war files.


    # Forwarding to a JSPs


    A common design pattern is to have a Servlet handle a request, and have that Servlet
    forward to a JSP for display. However, Servlets can only forward to JSPs packaged
    inside of a common war. You can use a special method called ‘redirect’ to send
    a user to a JSP in a different web module, but the redirection becomes a brand
    new request, and information about the initial request and response is lost.


    # Manageability


    Manageability of your applications must always be a prime concern. The cost of
    any application is not how much money is require to develop it, or the hardware
    required to run it, but is instead the cost of managing that application over
    the long-term.


    If the two applications you are packaging are large, separating them into two
    separate war files will make them much easier to manage. Modularity helps facilitate
    maintainability, and maintainability is good.'
