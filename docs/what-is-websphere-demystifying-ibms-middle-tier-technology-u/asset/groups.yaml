    # J2EE Security


    A role can be associated with any number of users, any number of groups, and for
    that matter, any combination therein.


    At runtime, the WebSphere Application Server authenticates all users against the
    configured user registry. The application server then figures out which J2EE roles
    the authenticated user falls into, and then authorizes access to resources based
    on the access rights outlined in the deployment descriptors of the web and EJB
    modules.


    Configuring J2EE security is just that easy!


    # Figure 16-7 Role to User Registry Mapping


    At deployment time, the abstract roles in your application are mapped to users
    and groups that exist inside of your user registry.


    | Role | Everyone? | Mapped Groups |

    |---|---|---|

    | customers | | Yankees Canadians |

    | bank managers | | Republicans |

    | tellers | | Power Users |

    | turkeybasters | | Shawn |

    | system | | db2admin Backup Operators |


