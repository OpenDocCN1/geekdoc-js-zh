    ## Figure 12-3


    ## Application Server Properties


    The JVM on which our applications run is not a regular JVM. A look at the configurable
    properties of an Application Server shows many delicious features to configure.


    | Additional Properties |

    | :--- |

    | Transaction Service |

    | Web Container |

    | EJB Container |

    | Dynamic Cache Service |

    | Logging and Tracking |

    | Server Components |

    | Process Definition |

    | Performance Monitoring Service |

    | End Points |

    | Classloader |

    | Server Security |


    To further complicate matters, you can have WebSphere kick off multiple java.exe
    process, perhaps dedicating a unique java.exe process for each complex application
    you have in production. In that case, we would say that you have three application
    servers running, since there are three different java.exe processes running.


    Of course, this can get confusing. WebSphere, the J2EE certified product that
    you purchase from IBM is referred to as the ‘application server.’ Yet, at the
    same time, each of the java.exe processes that run and support our J2EE applications
    is also referred to as ‘application servers.’ Isn’t this all rather confusing,
    having one term that is used to describe two fairly different things?


    So, how do we resolve this naming conflict? WebSphere is an ‘application server,’
    yet what we deploy our ear files to, essentially JVMs are ‘application servers’
    as well?


    ## Chapter 12


    When I''m consulting, I try to establish a common vocabulary as early as possible.
    When I''m talking about the product WebSphere, like the one that comes on the
    CD that you purchase from IBM, I refer to using the acronym WAS, which rhymes
    with spazz, meaning WebSphere Application Server (WAS).


    ![](img/a64fe132c0e172db17f8974af89bd4d4_121_0.png)


    When I''m referring to the java process on which ear files are deployed, I refer
    to them as JVMs, and to a lesser extent, ''application servers,'' although I try
    my best to avoid the term. In its truest form, the term ''application server''
    is meant to refer to a JVM on which J2EE applications are running.


    Establish a common vocabulary between developers, administrators and managers
    as early as possible. Understanding what your teammates are saying isn''t nearly
    as important as understanding what they mean.


    ## What is the implication of a failed JVM?


    One of the problems with an application server, or JVM, or java.exe process, or
    whatever you want to call it, the fact that it can fail. It can all of a sudden
    disappear, or even get so tripped up over itself that it sits there and consumes
    memory and clock cycles but it doesn''t actually do anything.


    Of course, this type of scenario would never happen if you were using software
    and hardware from IBM, but if you''ve got software from any of those fly by night
    companies such as Microsoft or Oracle, you just might run into a situation like
    this.


    And what happens when your virtual machine shuts down? Well, your applications
    stop working of course. They don''t just run on their own, you know.


    ## How do you implement workload management with WebSphere?


    If you want to protect yourself from a single, crazy, JVM going out of control
    and eventually shutting down your applications, what do you deploy your application
    onto two or more JVMs? That way, if one JVM shuts down, another JVM can pick up
    the slack. In the meantime, WebSphere will recognize that a JVM has been injured,
    send it to triage, and hopefully get it back up and running again soon. With an
    extra JVM running and picking up the slack, your clients won''t experience any
    downtime.


    ## What is a cluster?


    A cluster is the term given to two or more JVMs working together to serve up a
    common set of EJBs and Servlets. If you want to workload manage your applications,
    which essentially means having redundant JVMs on which your applications are running,
    what do you do set up a ''cluster''.


    With a cluster, when you deploy your application, rather than deploying to a single
    JVM, you deploy your application to the cluster as a whole. Then each member of
    the cluster, each Java Virtual Machine that is, is capable of handling and servicing
    requests from clients.


    When it comes to JVMs, the more the merrier!


    ## Chapter 12


    ## What is Vertical Scaling?


    If a cluster is a collection of JVMs working together to provide a workload managed
    environment, then “vertical scaling” happens when each of those JVMs are running
    on the same physical machine.


    Figure 12-4 Cluster and Application Servers


    As you can see, from these two screens pulled from the admin console, a cluster
    is a collection of application servers living together in harmony.


    ## Application Servers


    ![](img/a64fe132c0e172db17f8974af89bd4d4_123_0.png)


    Now I know what you’re thinking: vertical doesn’t provide any failover support,
    does it?


    Well, if the cleaning staff accidentally kicks out the power cord on your server,
    then indeed, you’re going to experience some downtime.


    ## WebSphere Deployment


    ## So what benefit does vertical scaling provide?


    Vertical scaling provides a variety of benefits, especially if your environment
    is heavy on hardware.


    First of all, in a vertically scaled environment, if one JVM goes offline, whether
    intentionally or not, the other JVMs can pick up the slack, so you get a certain
    degree of failover, although its not exactly the level of failover we usually
    associate with workload management. With vertical scaling, we are still node dependent.


    A more likely rationale for implementing a vertically scaled environment is to
    take advantage of powerful, multiprocessor machines.


    The fact is, despite the use of our modern, multithreaded operating systems, there
    are enough concurrent processes within a JVM to make having one java.exe process
    running on a multiprocessor system a fairly inefficient endeavor.


    To take maximum advantage of your multiprocessor machine, you should implement
    vertical scaling and have n-1 JVMs running, where n is the number of processors
    in your system, and l is the number between zero and two.


    ## What is Horizontal Scaling?


    Horizontal scaling occurs when you deploy an application across multiple physical
    machines. Horizontal scaling is typically what we think of when the term ‘workload
    management’ is thrown around.


    WebSphere makes implementing horizontal scaling incredibly easy. The first step
    is to install the base edition


    ## Chapter 12


    of WebSphere onto a couple of different machines, and then install the Deployment
    Manager on another machine. Make the base editions part of the deployment manager’s
    administrative domain, and then use the administrative console to create a cluster.


    The WebSphere Administrative Console makes it very easy to create a cluster of
    JVMs on multiple nodes. When you subsequently deploy your applications to the
    cluster, the various JVMs on the nodes will take part in serving up the application.
    If one node goes down, the other JVMs on nodes will pick up the slack.


    ## Figure 12-5 Horizontal Scaling


    When creating a cluster, WebSphere asks which node each JVM or Application Server
    should. WebSphere takes care of the rest!


    ![](img/a64fe132c0e172db17f8974af89bd4d4_125_0.png)


    Do I have to copy the contents of the ear to each node taking part in?


    Prior to WebSphere 5, configuring a cluster through the admin console merely updated
    a central database where configuration was maintained for the entire administrative
    domain. An administrator was still responsible for physically moving all of the
    files and code associated with the ear to each node serving the application. This
    was quite a tedious bit of work.


    ## WebSphere Deployment


    With WebSphere 5, the administrator no longer needs to transfer files from one
    node to another. A built in file transfer process transports the enterprise archive
    associated with the application to each of the nodes participating in workload
    management.


    ## Can I deploy an application to just one member or JVM in a cluster?


    Once you create a cluster of JVMs, you can no longer deploy an application to
    just one JVM in that cluster. With a cluster, it is all or nothing.


    However, there is nothing stopping an administrator from setting up another JVM,
    separate from the cluster, on which to deploy an application.


    ## Can I do Workload Management (WLM) with the base installation?


    The base installation allows you to create multiple servers, but it does not provide
    any facilities for clustering. In order to implement horizontal or vertical scaling,
    you must purchase a license for the Network Deployment Manager. I’m sure IBM will
    be helpful if you ask to buy one.


    ## Why isn’t there a button to start my server in the base installation?


    The base edition allows you to create as many ‘application servers’, meaning JVMs,
    as you want, but it doesn’t provide any facilities for staring them. I guess someone
    at the WebSphere labs really wants you to upgrade to the deployment manager.

    '
