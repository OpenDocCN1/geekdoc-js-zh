    rather an umbrella under which all IBM middleware

    products reside.


    WebSphere is an IBM branding, associating a vast array

    tools sold to IBM customers that help enable the

    middle-tier.


    WebSphere represents IBM''s vision to take over the

    middle-tier, or at the very least, stop it from falling into the hands of Microsoft
    or Oracle.


