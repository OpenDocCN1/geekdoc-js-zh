    # WebSphere at Runtime


    # From Web Server to WebSphere


    When a client makes a request for a JSP or a Servlet, the request initially goes
    to the web server. The web server reads the plugin-cfg.xml file and realizes that
    the request that came in should be sent to the application server for processing.


    The plugin-cfg.xml file also provides the ipaddress/port combination of listening
    application servers. The web server, using the http protocol, then sends the request
    to the WebSphere JVM listening on the appropriate port.


    That JVM listening on the appropriate port represents our application server,
    and the port the JVM listens on can be configured through that JVM''s web container.


    The web server handles the incoming request, and matches that request to the application
    server set up to handle the given Servlet or JSP.


    # Inside the Web Container


    If the Servlet hasn''t been called before, the JVM loads the Servlet and then
    generates a thread to handle the request.


    Servlets are shy little creatures. They sit on the hard drive just minding their
    own business, and don''t bother anyone if they''ve never been invoked. However,
    feed a few to those Servlets and get them loaded, and they remain resident in
    memory until the party ends, which happens when someone pulls the plug on the
    application server.


    So, the request gets sent from the client, to the web server, and the web server
    passes the request to the'
