    # How can we provide session failover with WebSphere?


    Fortunately, our beloved WebSphere goes over and above the the spec by providing
    several options for persisting a session beyond the JVM in which it was created.
    The two supported mechanisms for providing session failover include:


    +   - Memory to memory session replication

    - Database persistence


    Until WebSphere 5, using a centralized database to store session information was
    the only option available for persisting sessions. By and large, persisting sessions
    works pretty well.'
