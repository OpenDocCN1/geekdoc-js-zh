    # Chapter 18


    to change the binding between the resource reference and the actual name of the
    EJB. No change to the code would need to be made.


    Resource references area great!


    # What does a resource reference lookup look like?


    Resource references include the String "java:comp/env/" before the name of the
    configured reference name.


    To look up an ejb with the JNDI bound name of ej/com/pulpjava/session/Timer, using
    a resource reference of ejb/Timer, your code would look something like this:


    ```

    //connect to the root of the JNDI server

    InitialContext jndi = new InitialContext();


    //lookup the ejb using the resource reference

    jndi.lookup("java:comp/env/ejb/Timer");


    //not using the reference...a bad practice

    jndi.lookup("ejb/com/pulpjava/session/Timer");

    ```


    Notice how when using the resource reference, we use the prefix java:comp.


    The last line of code in this example looks up the Timer EJB according to the
    name used when binding the timer to the naming service. This is not a scalable
    or easily maintainable solution, and should never be done in production code.


    # Enterprise Naming with JNDI


    # What does java:comp/env/ejb/Timer mean?


    Interpreting java:comp/env/ejb/Timer goes something like this:


    - Using the connection to a JNDI server, connect to the common Java namespace
    (java:)

    - Look for a component bound to the common environment of the name service (comp/env)

    - Find, in the deployment descriptor of the calling resource, a reference for
    ejb/Timer

    - Resolve the resource reference – in this case:


    ejb/Timer (the resource reference)

    resolves to

    ejb/com/pulpjava/session/Timer


    - Return to the client a reference to the resolved resource


    # Where are resource references stored and configured?


    A resource reference is an abstract binding configured in the deployment descriptor
    of the J2EE module of the component that uses it.


    For example, if a Servlet uses a resource reference, the deployment descriptor
    for the web module it would contain the resource reference. If an EJB used a resource
    reference, the ejb-jar.xml file, which is the deployment descriptor for an EJB
    module, would contain the resource reference.


    # Chapter 18


    When the application assembler prepares the application for deployment, they will
    configure the bindings and make sure the abstract name in the web or ejb module
    maps to the appropriate resource running on the server. After all, the name of
    the resource in the development environment will likely be different from the
    name of the resource in the pre-production (pre-prod) or testing environment.


    Again, develop one way, deploy another, and use configured bindings to tie the
    two together. Resource references make this happen.


    # Isn’t configuring resource references and doing these bindings a lot of work?


    The extra configuration the administrator or application assembler must perform
    before deployment does constitute a bit of extra work, but it is not a huge burden.
    It sure beats having to dig into the code and fix all of the hard coded JNDI name
    references if the runtime name of a given resource ever changes. Besides, WebSphere
    Administrators never have much to do anyways – they like the extra work.


    # How has naming changed between WebSphere 4 and WebSphere 5?


    In WebSphere 4, there was a central naming service to which all JNDI addressable
    resources in a common WebSphere domain were bound.


    With a single, centralized naming service, JNDI naming exceptions were few and
    far between. Regardless of which JVM your resource was running on, all you had
    to do was connect to the centralized naming service, which was accessible from
    any application server, provide the appropriate JNDI name or resource reference
    of the object in question, and Bob’s your uncle – the resource would be found.


    # What were the drawbacks to a centralized JNDI service?


    Centralization of this superbly important J2EE service, called JNDI, certainly
    had its drawbacks. The biggest drawback to a centralized naming service was the
    fact that if this service went down, your entire enterprise environment was.


    So what’s a J2EE server vendor like IBM to do? Should they have a centralized
    naming service that makes looking up objects easy, but also acts as a performance
    bottleneck, or should they have a distributed naming service that eliminates a
    single point of failure?


    IBM decided to pick their poison, and felt that having the developers chase down
    the occasional NameNotFoundException was far more acceptable than having a single
    point of failure in the WebSphere architecture. WebSphere 5 uses what is known
    as a distributed naming system.


    IBM has always been the vendor of failover and scalability, so it’s not surprising
    that their current implementation of the Java Naming and Directory Interface (JNDI)
    would lean in the direction of a solution that was more robust.


    # How did we resolve remotely bound JNDI resources with WebSphere 4?


    Looking up Java components in the common namespace how WebSphere applications
    have resolved JNDI names for the longest time. In fact, with prior versions of
    WebSphere, this common namespace was great, because all of the JVMs in a domain
    or cell shared the same namespace.


    If I had an EJB running on one node, and I had a Servlet clustered on a bunch
    of Java Virtual Machines on another machine somewhere else in the domain, all
    I had to do from my Servlet was connect to the local namespace, look up a resource
    reference using java:comp/env, and then the application server would take care
    of resolving the EJB to the appropriate JVM on the appropriate remote server.


    Resolving remote EJBs was a piece of cake with WebSphere 4.


    # How do we lookup remote JNDI objects using WebSphere 5?


    WebSphere 5 introduced a brand new naming mechanism called “topology dependent
    JNDI names.”


    As mentioned earlier, every Java Virtual Machine in your WebSphere 5 domain, also
    know as a WebSphere cell, has its own local JNDI namespace. While this local namespace
    is great at resolving other local objects that are bound to it, this local namespace
    will not, by default, resolve JNDI addressable objects bound to other application
    servers in the cell. This is a huge departure from the implementation of the naming
    service in WebSphere 4.


    To help facilitate resolving objects running on remote JVMs, WebSphere allows
    you to perform a JNDI lookup that includes both the name of the node and the name
    of the Java Virtual Machine on which the remote resource is running. To do this,
    you use a “topology dependent JNDI.”


    # Chapter 18


    # What do topology dependentNDI names look like?


    Imagine an administrative cell named ''soccer'' and a node in that cell named
    ''worldcup''. To find an EJB named ''ejb/pulpjava/session/Timer'' that is running
    on an application server named germany01, the topology dependent JNDI name would
    look like this:


    ```

    cell/nodes/worldcup/servers/germany01/ejb/pulpjava/session/Timer

    ```


    Notice how the JNDI name includes the name of the node, the server, and the EJB.
    The name is dependent upon the topology of WebSphere.


    # What is the advantage to using a topology dependent name?


    Using a topology dependent name, you will always be successful in locating a resource.
    Since you are specifying explicitly the name of the node, the server on which
    the resource is running, there is absolutely no ambiguity with regards to which
    resource you are searching.


    A topology dependent name will always resolve because the lookup is rerouted,
    through the local namespace, to the appropriate naming service.


    # How do I reference a cluster when using a topology dependent name?


    Deploying an application across multiple JVMs is known as clustering. The WebSphere
    5 infrastructure allows you to point to a cluster of servers, rather than a single
    instance of an application server.


    For an EJB named ejb/com/pulpjava/session/Timer, deployed to a cluster named england05,
    the lookup would be as follows:


    ```

    jndi.lookup("cell/cluster/england05/ejb/com/pulpjava/session/Timer");

    ```


    Notice that there is no mention of a server in the lookup, only the cluster. The
    lookup may resolve to the Timer EJB on any of the Java Virtual Machines that participate
    in the cluster.


    # Should I use topology dependent names in your code?


    Topology dependent names will always resolve, but you''d have to be heavily inebrated
    to actually use them in your code. Anyone who places architecture specific references
    in what should be an architecturally neutral application deserves a good whooping.


    A topology dependent name uses both the name of the node, and the name of the
    server on which the J2EE resource is deployed. At development time, you have absolutely
    no idea what the nodes and production servers will be named - and even if you
    did, those names might change in the future. Using topology dependent names in
    your code is insane.


