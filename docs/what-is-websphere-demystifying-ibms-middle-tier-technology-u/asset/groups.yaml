    # Chapter 5


    Not only these vendor-supplied components represent data contained in a database,
    they have inherent knowledge about how to update the database, retrieve data,
    and even create new rows in the database table, so long as they are supplied with
    a unique primary key. These vendor-supplied components are quite amazing, and
    remove much of the need to compose boring SQL statements or develop data components
    whose silly setters and getters transactionally interact with a database.


    > "Vendor supplied entity beans are known as CMPs"


    This vendor supplied entity beans are know as CMPs. or Container Managed Persistence
    beans, because it is the vendor''s EJB container that implements the persistence
    for us.


    # How does top down, bottom up, and meet in the middle mappings differ?


    Vendors provide many ways to create Container Managed Persistence beans (CMPs),
    including:


    - top down

    - bottom up

    - meet in the middle


    "Bottoms-up" occurs when you already have a database, and you want to create EJBs
    based on your database tables.


    Top down happens when you first create your EJBs and object model, and want to
    have database tables created based upon that model.


    # Entity Beans


    With a top down mapping, tools such as WebSphere Studio Application Developer
    will allow you to create EJB components first, and then the tool will generate
    SQL scripts that will create database tables based upon the components you have
    coded.


    Meet in the middle happens when your database administrators and your application
    developers just can''t agree on how to coordinate the relational model with the
    object model. The developers go off and create EJBs. The database admins go off
    and create their database. Then some poor schmuck has to figure out how to bring
    the two parts together. In other words, the schmuck must meet the relational and
    object models in the middle.


    Meet in the middle allows Java developers to map EJBs that have been created in
    isolation to database tables that already exist. This is probably the most common
    type of EJB mapping we see in the industry.


    # What is a BMP Entity Bean?


    A BMP is any entity bean that isn''t a CMP. That was easy.


    As discussed earlier, Container Managed Persistence (CMP) beans relieve the developer
    from having to write SQL code, which Java developers are notoriously bad at doing.


    With Bean Managed Persistence (BMP), the developer is burdened with the responsibility
    of writing all of the SQL code required to update, delete, create and find data
    in our underlying database tables. Basically, with a BMP, the developer has to
    do more work, and God forf, maybe even talk to a database person to help put together
    some SQL statements.


    # Chapter 5


    # Why would anyone want to use a BMP?


    Creating BMPs is definitely a more involved process than having a development
    tool create CMPs for you. Nevertheless, compelling reasons to use BMPs do exist.


    # Your Database Doesn’t Support Container Mapping


    Depending upon your database, a CMP isn’t always an option. For example, WebSphere
    Studio Application Developer only allows you to create CMPs for certain databases,
    although most databases are supported. However, you might be in trouble if you’re
    using a special object oriented database, or perhaps a database that doesn’t have
    the same market penetration as Oracle or DB2.


    # Your Database is Far Too Complicated


    Your database might be too complicated for the development tools that make container-managed
    persistence possible.


    If your database is filled with crazy joins, you have an egregious amount of many-to-many
    relationships, and your ERD looks like a map of the North American rail system,
    then I’m afraid that the conventionally available CMP tools won’t be much of use
    to you. In a case like this, you have to write your own crazy SQL code to interact
    with your crazy database - the development tools simply won’t have anything to
    do with you.


    # Portability is an Issue


    Another thing to think about is portability. Of course, if you’re using DB2 and
    WebSphere, portability isn’t an issue, because IBM is the best, and you would
    never want to leave them. But it is important to note, despite an ongoing effort
    to standardize EJB development, one vendor’s CMPs are a little bit different from
    that of another vendor. WebSphere CMPs won’t necessarily port to a WebLogic server,
    although the latest incarnation of the CMP spec is indeed bridging that gap.


    Assuming the SQL being used within them is fairly standard, BMPs will port from
    one database to another with ease. Portability is more achievable with a BMP than
    a CMP.


    # Performance and Control


    Generally, a CMP will perform faster than a BMP, especially if you’re going from
    a WebSphere Application Server to a DB2 database. believe it or not, those clever
    sausages at IBM know a lot more about efficiently connecting to a DB2 database
    than you or I.


    Furthermore, CMPs can take all sorts of shortcuts behind the scenes that we simply
    don’t know about. Vendors compete on who has got the most efficient application
    server, and efficiently connecting to a backend database is a pretty big sales
    point. CMPs are generally better at interacting with a database than BMPs.


    # Can I use CMPs and BMPs at the same time?


    Choosing between CMPs and BMPs is not an all or nothing decision. Container and
    Bean Managed Entity beans can coexist quite efficiently within the same application
    server.


    In fact, a creative use of inheritance and interfaces makes it easy to interchange
    BMPs and CMPs. This would allow you to quickly create CMPs, and seamlessly switch
    to BMPs in the future if the need ever arises.


    # What is better, a CMP or a BMP?


    I''m sure some would argue that BMPs, since you code them pretty much from scratch,
    give you more control, and even though I suggest that CMPs are faster than BMPs,
    others might argue that by implementing things like a ‘dirty bit’ pattern and
    performing some funky SQL magic, you could actually make BMPs more efficient than
    CMPs. That may be true as well. The ability to control database access in a BMP
    provides the opportunity for infinite refinement.


    Nevertheless, the cost of any application is not how much it costs to create,
    host, or get it deployed. The biggest cost associated with an enterprise application
    is maintaining it over time, and maintaining the optimized BMP code, which was
    written by the in-house supergenius, after she’s left the company to investigate
    at MIT, might be insurmountable. CMPs are best if you can use them.


    CMPs are much easier to maintain that BMPs. Maintaining a component with no code
    inside of it is the kind of task for which I’ll gladly volunteer.


    This brings us to another point – love them or hate them, CMPs do provide a standard
    framework for mapping Java components to a back end database – making object-oriented,
    transactional, database access possible. A common framework that is easy to learn,
    and for that matter, easy to find a new hire that understands it, is, a good thing.


    Use CMPs if you can. They will make your life easier in the long run.


    # Should I have a one to one relationship between Entity Beans and database tables?


    With top down and bottom up mappings, CMPs are incredibly easy to create. I can
    point my development tool at a database and create hundreds of CMPs in a matter
    of minutes – one for every table in the database. It’s just that easy. In fact,
    it’s too easy.


    Entity beans are resource intensive, and using them ‘willy-nilly’ will ground
    your applications to a crawl.


    # **With EJBs, effective use is minimal use.**


    When you are using an entity bean, make sure you really, really, really need the
    features entity bean provides. These features include security, multithreaded
    access, and transactional integrity. Do not use Entity Beans just because you
    need a simple, object oriented relational database component model.


    > “Entity Beans are often overkill.”


    Frameworks like Hibernate and Java Data Objects (JDO) exist; EJBs are often overkill
    when all you need is an object oriented approach to database access. If you don’t
    need all the features of an EJB when updating a database, look at some of the
    alternatives to entity beans.


    When it comes to EJBs, effective use is minimal use. That should be the mantra
    of your enterprise developers.

