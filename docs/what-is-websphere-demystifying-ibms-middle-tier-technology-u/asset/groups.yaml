    | PDAs | J2EE Servers | Databases |

    | Cell Phones | .NET Servers | Persistent Data |


    We live in the information age, and information is power. Big businesses and domineering
    governments hold huge stores of information, some of which they want us to see,
    and some of which they want to secure very tightly.


    > “Information is Power”


