    ## What is so bad about hard coding JNDI names into your code?


    If you hardcode the names of JNDI addressable resources into your applications
    during the development phase, and the name of those resources happen to change
    at runtime, your applications will not work To avoid this problem, we use something
    called a resource reference to loosely bind the names used in our code to the
    actual name given to a J2EE resource at deployment time. At least, that''s what
    we should do.


    ## How does a resource reference work?


    Never hardcode a JNDI name in Java code. Code the name of a resource reference
    instead.


    For example, if an EJB is bound to the JND server with the name `ejb/com/pulpjava/session/Timer`,
    a resource reference with the name `ejb/Timer` could be configured to point to
    this EJB.


    In your code, you would perform a lookup against the name `java:comp/env/ejb/Timer`,
    which is the full name of the resource reference. The WebSphere environment recognizes
    anything under `java:comp/env/` as a resource reference lookup. In this case,
    WebSphere will find a resource reference that binds the abstract name `ejb/com/pulpjava/session/Timer`
    with the actual ejb name, and at runtime, a reference to the `ejb/com/pulpjava/session/Timer`
    will be returned to the client.


    If the actual name of the EJB running on the server ever changes, the application
    assembler would only be required

