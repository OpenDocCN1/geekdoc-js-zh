    # Chapter 19


    However, you can switch from module centric classloading. By making classloading
    to application centric classloading. By making this change, all modules in an
    ear, including web and ejb modules, will use the same classloader instance. The
    web module will not be given a separate and unique classloader


    The implication of an application classloader policy is that any module will be
    able to see classes in any other module in the ear, including web modules. With
    a module centric classloader policy, ejbs and utility classes cannot see classes
    inside of a WAR.


    # How can two versions of the same class be loaded on the same JVM?


    People find it difficult to get their head around the fact that it is possible
    to load two or more different versions of the same class onto a JVM. Not only
    is this possible, it is extremely common.


    One of the rules of classloading is that a classloader never use or access classes
    loaded by a classloader beneath it in the hierarchy. If a web module configured
    with a parent-last configuration loads a class called com.servlet.User, and then
    the application classloader, or even the WebSphere classloader, is asked to load
    the com.servlet.User class so long version of the class file can be found on their
    classpath, which is indeed different from the classpath of the web module, a separate
    instance of the same class will be loaded onto the JVM.


    You must be very careful where you package your Java classes, because placing
    a file in a war file, an EJB module, a utility jar inside of an ear, or even on
    the WebSphere classpath, will have a significant impact on classloading, class
    instantiation, and class visibility.'
- md: '

    ## Is it possible to have multiple instances of a singleton running on a JVM?


    A singleton is a Java class that is programmed in such a way that ensures only
    one instance of that class is ever loaded onto the JVM. A singleton is one of
    the most common design patterns in existence, and is extremely effective when
    trying to mitigate access to various resources.


    However, if a singleton class is packaged and placed on the classpath of different
    classloaders, it is indeed possible to have many instances of a singleton running.
    If a singleton is managing some mission critical resources, be sure that your
    applications are packaged in such a way that the classloading hierarchy won''t
    start spinning off multiple instances.


    ## Why am I getting Serialization errors when I run my applications?


    Another interesting problem that can arise from having a different classloader
    for each application and web module, especially when you configure a parent-last
    configuration, is conflicting versions of the same class being loaded.


    For example, say a web module was using com.pulpjava.User version 1.1, and an
    EJB module in another project was using com.pulpjava.User version 1.2. You can
    only have one version of a JavaBean loaded on a JVM right? Wrong!


    Even though both applications might be running on the same JVM, if the web module
    was configured with a parent-last classloading configuration, and it then tried
    to pass a User object to the EJB module, there would be all sorts of serialization
    and version errors, because both modules would be using different versions of
    the same JavaBean.


    Both modules may have a User class, and both modules can load that class onto
    the JVM. However, when they try to pass the User object back and forth, runtime
    exceptions will be thrown because the versions are out of sync.


    This type of scenario can produce a variety of cryptic error messages, and troubleshooting
    comes down to figuring which module is loading which version of the class.


    The solution usually requires redeploying the applications in such a way that
    they can communicate with each other properly. This may be implemented by repackaging
    the applications to ensure that both EJB and web modules are using the same classloader
    to load the com.pulpjava.User class.


    An alternative solution is to play around the serialization id of the com.pulpjava.User
    class to make the JVM think the two classes are the same. Regardless, solving
    serialization id errors are never fun.


    ## What is class visibility?


    A classloader can never use or access a class loaded by a classloader below itself
    on the hierarchy. This can create a bizarre scenario where a web module might
    be able to find a Java class named User, but an EJB, which uses a different classloader,
    gets a ClassNotFoundException when trying to access the exact same class.


    Reckoning with the fact that all of this is happening on the same JVM, I usually
    just start shouting at the JVM, demanding to know why it can find the file just
    fine in the web module, but not in the EJB module. For what it it''s worth, I''ve
    never found shouting at a JVM to be successful way of resolving ClassNotFoundException,
    but it does tend to make me feel better.


    Class visibility describes which classes can be seen by which classloader, and
    subsequently, which J2EE components.


    Troubleshooting classloader issues is extremely difficult without a fundamental
    understanding of how classloading works.


    ## Sometimes I can access a class, other times I can’t!


    An interesting scenario happens when you’ve got three classes all accessing a
    fourth. Let’s just say the fourth is a database driver.


    If the driver is packaged in the root of the ear, the Servlet will be able to
    call on the driver when it runs. An EJB in the same project will also be able
    to call on the driver when it runs. However, a common component packaged on the
    WebSphere extension classpath, will NOT be able to call upon the driver and will
    instead cough up a ClassNotFoundException.


    Again, you will be able to prove that indeed the driver can be found by the JVM,
    since both your EJB and your Servlets will be able to use it. You can even profile
    the driver on the JVM and prove without a doubt that not only can the JVM find
    the class, but the JVM can load it and run it without any hint of a glitch.


    It’s only when the component packaged at the ws.ext level tries to make a call
    to the component below it on the classloader hierarchy that your application runs
    into a problem.


    It''s a hard lesson to learn, but a classloader cannot make calls to classes that
    are on the path of a classloader below it on the classloader hierarchy.


    ## Where is the best place to package common components?


    In the preceding scenario, you could do one of two things to eliminate the ClassNotFoundException:


    - move the driver up to the ws.ext directory along with the common component

    - move the common component down into the ear along with driver


    Personally, I would do both. Typically, drivers go on the ws.ext classpath, and
    common components go into the root of the ear.


    ## How do we best package our applications?


    So, with all of these classloaders and various classpath issues, the question
    becomes, “how should we package our applications, and where should we place various
    jar files such as common components, drivers, utility classes and others?”


    The first rule is: all of your EJBs go in EJB modules, and all of your Servlets
    should go in your web modules. Unfortunately, from there it gets a little tricky.


    For example, where should you put the jar files that have the implementation of
    your custom tags? Custom tags make JSP development much easier, and they are a
    web centric component, so conventional wisdom says you should put it in the lib
    directory of your web module. But what if your ear file has four or fourteen web
    modules that use those custom tags? Should you duplicate the jar file that contains
    the code for your custom tags and place a copy of that jar in each of the fourteen
    web modules, or should you just put one central copy inside of the ear.


    Should you duplicate the file 14 times, or should you have every module reference
    just one, single copy? Duplication seems like such a waste, doesn''t it?


    Placing the jar containing the Java code that implements the custom tags in the
    root of the ear means you have one central location for your code, and when the
    application runs, only one instance of a class will be created to handle the requests,
    despite having many modules. That definitely sounds like the best alternative,
    but to be honest, that''s not the alternative I''d go with.


    Personally, I''d place a copy of the jar file in each war. That means the code
    is redundantly copied from war to fourteen times, which in itself is a bad thing.
    It also means that I''ll have extra instances of common tag classes running, which
    means a slight degradation in performance. But for my money, I''d rather duplicate
    that code in each war.


    The long-term cost of any project is not the cost of getting it up and running,
    but the cost of managing and maintaining that application over time.


    Having every web module pointing to the same custom tag code is making future
    version changes a real headache. If I update the custom tag code at the ear level,
    then every web module must upgrade to use the newer version as well. Expecting
    every web module in the application to update at the same time is unreasonable.


    It would be much easier to place this jar file in each war, and when a new version
    of the library comes out, the battle to migrate the application can be waged on
    a war-by-war basis. After all, when was the last time every single application
    in your enterprise migrated at exactly the same time? Most likely never.


    ## How should you package common utility components?


    Now let''s think about a general set of common components. Say for instance, your
    company has a set of common components that include a User object, Employee interface
    and a bunch of other useful and reusable objects that get used in all of your
    EJB and web modules. Where would place a jar file like this?


    ![Figure 19-6 Your common components should go in the ear, along with war files
    and ejb modules.](img/a64fe132c0e172db17f8974af89bd4d4_245_0.png)

    '
