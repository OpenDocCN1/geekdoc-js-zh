    # What do our Servlets do?


    Well, the Servlet can do pretty much anything the developer wants it to do. When
    programming Servlets, a developer is only limited by their creativity, and more
    likely, their Java programming skills.


    Typically, a Servlet implements some control logic. For example, a Servlet might
    figure out what a user typed into some textfields in a web-based form. It might
    then take that information and save it to a database.


    Servlets are intended to be controllers. While Servlets can interact directly
    with a database, they’re not really supposed to. Instead, Servlets are supposed
    to delegate to a JavaBean or an EJB to do such things. Let’s say, for the sake
    of argument, a Servlet calls an EJB.


    # From a Servlet to an EJB


    To call an EJB, especially one residing on an application server in a galaxy far,
    far away, we must first connect to the naming service of remote application server.


    The naming service is like a gatekeeper for objects running on a server. If someone
    wants access to a remote EJB, they call on the gatekeeper and ask if an EJB named
    “com/ibm/UserEJB” is around. If there is indeed an EJB with that name running
    around the server, you’re in. If not, you get an exception.


    So, to call our EJB, we first connect to the EJB’s naming service and ask if it’s
    Home. If it is, we get a handle to that EJB and can call its methods, just as
    though it were a regular JavaBean.'
