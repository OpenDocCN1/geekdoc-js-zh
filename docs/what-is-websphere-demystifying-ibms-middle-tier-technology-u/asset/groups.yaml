    # Chapter 13


    # What is the default mechanism for managing session failover when you set up
    a cluster?


    By default, a cluster provides no session failover. Session failover must be configured
    explicitly through the WebSphere Administrative Console.


    Setting up database persistence is a bit of work, but it''s not too painful as
    long as your application servers can all connect to a common JDBC database.


    A big benefit to in-memory session replication, on the other hand, is the fact
    that is can be easily set up and configured. On new installations, in-memory session
    replication seems to be the failover mechanism of choice.


    It must be noted that session management doesn’t just happen by default. It must
    be configured explicitly, and it must be tested as well. Don’t wait until your
    application server fails to find out if your session replication is working properly.


