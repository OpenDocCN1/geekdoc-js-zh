    ## WebSphere, Java, Portal, and J2EE Training


    ## Get Trained by the Expert


    Do you need WebSphere, Java, J2EE or Portal training? Come and attend one of the
    exciting, open enrollment classes in Toronto, Ontario Canada.


    ## Open Enrollment in Toronto, Ottawa and Calgary


    Cameron McKenzie, the author of the ExamScan series of books, along with What
    is WebSphere?, and the goodbook series of books, uses his unique facilitation
    techniques, along with his in-depth knowledge of Java based technology, to teach
    students and inspire them to gain a deeper understanding of the technologies they
    use.


    ## Custom, Corporate Classes Available


    Cameron McKenzie also dedicates two weeks a month to providing custom, corporate
    training for classes of six students or more. If you can''t make it to Toronto,
    you can always bring Cameron to your own, private, training facilities. Demand
    is high, book early, and make sure your education demands will be met in the most
    efficient, and effective, manner possible.


    For more details, email Cameron at mail@cameronmckenzie.com, and check out the
    www.technicalfacilitation.com website for more details.


    ## More Great Books on Java and J2EE


    Always in stock, and always discounted, when you buy directly from the publisher,
    either on amazon.com, or directly from the website, www.pulpjava.com.


