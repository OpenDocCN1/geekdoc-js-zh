    # What is a classloader?


    Java applications run on a Java Virtual Machine (JVM).


    Our J2EE applications run on a Java Virtual Machine as well, after all, they are
    written in Java.


    In the WebSphere world, the JVM that our J2EE applications run on is often referred
    to as an ‘application server,’ since it is responsible for serving our J2EE applications
    up to clients. Under the covers though, an application server is nothing more
    than a souped-up JVM running on the server.


    If you are so inclined, you can even monitor the JVM responsible for serving up
    your J2EE applications by bringing up the Windows Task Manager and looking for
    the java.exe process that’s hogging your memory and consuming all of your processor’s
    clock cycles. That’s the Java Virtual Machine that enables your WebSphere applications.


    J2EE applications are written in Java, and JVMs have the job of running and executing
    the Java code you have written.


    When a client calls a Servlet, or an EJB calls the constructor of a JavaBean,
    compiled Java code, also known'
  - '[PAGE 223]


    # Chapter 19


    as bytecode, must be loaded and subsequently run on a JVM. Finding the appropriate
    Java bytecode file, and throwing that bytecode onto a piping hot JVM is the job
    of a very special, and extremely important component known as a classloader.


    Classloaders locate Java bytecode files and load that Java bytecode on the JVM.
    Without a classloaders, our J2EE applications simply would not work.


    Important Java classes that must be loaded onto the Java Virtual Machine in order
    to get our applications to perform properly include:


    +   - classes that implement the basic Java runtime environment such as java.lang.Interger


    +   - the code IBM has written to support and implement the J2EE specification


    +   - EJBs and the JavaBeans they use to implement complex business logic


    +   - all of the Servlets, JSPs and helper classes that make our web based applications
    behave the way they should


    Understanding how classloaders work is one of the most important aspects of WebSphere
    development, packaging and deployment. Unfortunately, classloading is also one
    of the most misunderstood aspects of J2EE development, leading to innumerable
    problems at both runtime and design time.


    To understand how the WebSphere runtime works, you must have a good grasp of J2EE
    classloading.'
  - '[PAGE 224]


    # What does a classloader do?


    If a Java class is invoked and needs to be executed on a Java Virtual Machine,
    a special Java component, called a classloader, is used to find the Java class
    of interest, pull that Java class off of the file system, and execute the bytecode
    of that class file on the Java Virtual Machine.


    A classloader is a special Java class file that is responsible for loading other
    classes onto a Java Virtual Machine. While this may seem simple and straightforward,
    don''t get too cocky, ''cuz from here, things get really complicated.


    Life would be simple if there was just one, monolithic classloader that did all
    of the classloading, but life just isn''t that simple. There are actually quite
    a number of different classloaders that work together to locate and load Java
    bytecode. If you want to package your applications properly, and avoid ClassNotFound,
    you must be familiar with the many WebSphere classloaders.


    If Java classes are loaded by classloaders, and classloaders are Java components,
    who loads the first classloader?


    The old chicken and egg scenario, rearing its ugly head. If classloaders are Java
    classes, and Java classes must be loaded onto a JVM to run, how does the first
    classloader get loaded? It''s a good question.


    When a JVM starts up, a special chunk of machine code runs that loads the system
    classloader. This special hunk of machine code is known as the null classloader.'
