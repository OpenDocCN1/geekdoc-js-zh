    # 探索 EAR


    ## 为什么 ear 文件可能包含多个 web 模块？


    ear 文件可以包含任意数量的 web 和 EJB 模块。这引出了一个问题：“我应该将所有的 web 内容部署到一个公共的 war 文件中，还是应该将我的
    web 内容拆分成单独 war 文件？”


    嗯，应用划分并不是一门精确的科学，但有一些我们可以遵循的规则。


    例如考虑这样一个场景：你的企业级应用为人力资源（hr）和会计部门提供 web 访问。这个 web 应用应该被拆分成 accounting.war 和 hr.war
    文件，还是将所有内容打包成一个单一的 hraccounting war 文件？


    > 当涉及到应用打包时，没有所谓的“标准答案”。只有“错误答案”。我们能做的最好就是尽量避免得到错误答案。


    在开发、打包以及随后部署应用时，有几个重要的点需要考虑。


    # 会话问题


    会话（Sessions）是一种存储与你网站交互的客户端瞬时信息的机制，它们在 war 文件之间是不共享的。如果会话信息需要在 hr 和会计模块之间共享，那么将你的
    Servlets 和 JSPs 分散在多个 war 文件中将成为问题。


    # 第 11 章


    ## 通用的 ServletContext


    Servlets 和 JSPs 可以通过一个名为 ServletContext 的特殊作用域相互共享信息。如果你将信息放在此 ServletContext
    中（例如会计数据库的 IP 地址），你可能不希望你的 hr 应用能够访问它。


    ServletContext 在 war 文件之间是不共享的。如果你不希望让一组 Servlets 看到另一组 Servlet 的 ServletContext，你就必须将这两个应用程序分离到不同的
    war 文件中。


    # 向 JSP 转发


    一种常见的设计模式是让 Servlet 处理请求，并让该 Servlet 转发到一个 JSP 进行显示。然而，Servlets 只能转发到打包在同一个 war
    内部的 JSP。你可以使用一个名为‘redirect’（重定向）的特殊方法将用户发送到不同 web 模块中的 JSP，但重定向将变成一个全新的请求，初始请求和响应的信息将会丢失。


    # 可管理性


    应用的可管理性必须始终是首要考虑的问题。任何应用的成本都不在于开发它所需的资金，或运行它所需的硬件，而是长期管理该应用的成本。


    如果你正在打包的两个应用很大，将它们拆分为两个独立的 war 文件将使它们更容易管理。模块化有助于提高可维护性，而可维护性是好的。


    WebSphere 部署


    # 第 12 章

    WebSphere 部署


    ![](img/a64fe132c0e172db17f8974af89bd4d4_116_0.png)


    应用部署是简单的，特别是当 ear 文件已正确组装时。


    对于 WebSphere，部署的艺术本质上是确认 ear 文件中各种描述符里定义的名称和绑定是正确的。谁知道呢，也许管理员需要将 EJB 与连接池关联，然后点击完成，但如果
    ear 设置得当，那就是部署应该有的最高难度了。


    ## “应用部署很简单”


    现在我确定许多 WebSphere 管理员会对这种评估感到皱眉，而经理们肯定会乐之形舞，但事实是，当 ear 文件正确组装时（最好使用 WebSphere
    Studio Application Developer），部署确实是简单的。


    WebSphere 管理中困难的部分是配置应用程序运行的环境。这涵盖了从设置连接池和配置消息队列，到管理持久的 JNDI 命名空间以及绑定适当的资源引用一切内容。那才是困难的部分！


    要向 WebSphere 部署一个简单的 J2EE 应用，即一个对消息或连接池没有巨大依赖的应用，你所做的只是指定一个运行该运行的 Java 虚拟机并点击“完成”。


