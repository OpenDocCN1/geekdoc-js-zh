    # Chapter 4

    ## Enterprise Java Beans


    ![](img/a64fe132c0e172db17f8974af89bd4d4_46_0.png)


    ## What exactly is an Enterprise Java Bean, EJB?


    Let us establish one undeniable fact: enterprise programming is hard.


    Sure, Servlets are superb at handling client requests, and Java Server Pages are
    fabulous at generating markup for a client, but request-response programming is
    not where Java developers earn their salt.


    Java developers earn their salt by implementing some seriously complicated business
    logic. Fiddling with a Servlet’s request and response objects all day long won’t
    impress anybody.


    Enterprise programming is hard, but EJBs make some of the toughest parts of enterprise
    programming just a little bit easier.


    45


    ## What are the common challenges enterprise developers encounter?


    Enterprise programming is hard. In an enterprise environment, there are a number
    of mission-critical challenges that must be addressed and implemented properly,
    otherwise applications will fail.


    Some of the typical challenges that enterprise developers encounter include:


    ### Database Access:


    How do we ensure that data in our application is completely, totally, 100% in
    sync with what is in the database? This is a requirement of almost every enterprise
    application, but without an intimate knowledge of how a database works, implementing
    database synchronization properly is a significant challenge.


    ### Transactional Updates:


    If I''m updating three different databases in an ''all or nothing'' type of scenario,
    and one of those database writes fails, how do I roll back writes to the other
    two databases?


    What if one of those databases is in Kalamazoo and two of them are in Tuktoyaktuk?
    How do you maintain the transactional integrity of your updates?


    ### Distributed Programming:


    I''m in Gun Barrel, Texas, but I want users in Antigonish, Nova Scotia to remotely
    invoke the methods in my Java components. How do I make a local component accessible
    to remote applications?


    ## Enterprise Java Beans


    ### Multithreading:


    Multithreading remotely accessible components that must handle a gargantuan load
    is a difficult and onerous task. How are you going to do it?


    ### Secure Access:


    You only want Double Agents to call one method of your JavaBean, and only Secret
    Agents can call the other method. How ya gonna do it? With a typical Java application,
    it''s almost impossible.


    ## How do EJBs Make Life Easier?


    Database concurrency, distributed transactions, multithreading, distributed programming
    and secure accesses are all issues our enterprise applications must deal with.


    If we have to deal with these issues alone, we''re going to be in an ugly world
    of hurt. The good news is that EJBs deal with these issues, and by dealing with
    them, they make enterprise programming much, much easier.


    ## So, how do EJBs work?


    There is quite a bit going on inside of an EJB.


    To take care of things like security and transaction management, EJBs use special
    XML files called deployment descriptors. The deployment descriptor contains information
    about how the EJB, and its methods, should behave at runtime. When WebSphere loads
    an EJB, it reads the associated deployment descriptor and follows the instructions
    therein.


    Chapter 4


    EJBs also implement a number of common design patterns, such as the proxy, pooling
    and singleton patterns. EJBs are designed well, and EJBs work well when used properly.


    ## **Enterprise programming is hard**


    Another interesting thing about an EJB is that unlike a regular Java component,
    an EJB isn’t just one single file on the file system. An EJB is actually a collection
    of three or more class files that work together to create a single, logical entity.


    Figure 4-1


    An EJB, like the TimerJB, is actually three or more Java files working together
    to create a single, logical component.


    ![](img/a64fe132c0e172db17f8974af89bd4d4_49_0.png)


    Let there be no mistake about it: EJBs have a learning curve associated with them.
    Enterprise Java Beans are harder to write than a regular JavaBean or Java component.
    But don’t fret. The payoffs make the learning curve well worth it.


    Anyone who has a Java background can pick up EJB technology relatively quickly.
    A few learning pains will result in a vast array of programming gains.


    48


    ## What types of EJBs (Enterprise Java Beans) are there?


    EJBJs come in three different flavors:


    - Session Beans

    - Entity Beans

    - Message Driven Beans


    Let’s take a look at them one at a time.


    ## Chapter 5

    ## Entity Beans


    ## What are Entity Beans?


    Entity Beans represent an object-oriented bridge between your enterprise application
    and your relational database.


    > "Entity Beans represent persistent data"


    Entity beans are special Java components that represent persistent data. When
    we say persistent data, we are usually speaking about data stored in a database.
    Theoretically though, Entity Beans could map to anything from data in a text file,
    to a serialized JavaBean on the file system. Nevertheless, the vast majority of
    the time, your persistent data is stored in a database.


    ## An Entity Bean Example


    Imagine you have a database containing a table named USER. This USER table has
    columns that represent a users name, phone number, password and email address.


    > "Entity Beans represent persistent data"


    Imagine you have a database containing a table named USER. This USER table has
    columns that represent a users name, phone number, password and email address.


    Chapter 5


    Figure 5-1


    An entity bean maps to a database table. Properties of the Entity Bean match to
    columns in the database.


    | Enterprise Beans | Tables |

    | :--- | :--- |

    | PulpEJB | PULJAVA |

    | User | ADMINISTRATOR |

    | id: java.Integer | INTEGER |

    | name: java.String | VARCHAR(100) |

    | phone: java.String | VARCHAR(100) |

    | email: java.String | VARCHAR(100) |

    | password: java.String | VARCHAR(100) |


    An entity bean represents your backend data, and the EJB framework ensures that
    an entity bean is always 100% in sync, at all times, with the data in database.
    That is the promise of the EJB. Accessing data is the flipside of updating data,
    but with an EJB, the promise is the same: 100% synchronicity.


    > “The EJB promise is 100% synchronicity.”


    When a developer calls a getter method on an EJB, such as userEJB.getName(), the
    application would subsequently be given exclusive access to the name field of
    that particular user in the database.


    When you call a getter method on an EJB, the application server absolutely guarantees
    that the returned information will be completely and totally in sync with what
    is in the database. Achieving this end on your own by hacking around with regular
    Java code would be hard, if not darned near impossible. Accomplishing this with
    an entity bean is incredibly easy.


    ## How does an entity bean ensure transactional integrity?


    I often get asked this question? answer: I really don''t know.


    I think it''s done through a collection of database locks, method calls, and a
    little bit of Haitian Voodoo, but I''m not completely sure.


    The fact is, I don''t know, and I don''t need to know. All I have to worry about
    is writing the EJB.


    All the underlying plumbing that makes these EJBs work is implemented by a bunch
    of clever sausages at IBM that know far more about database access and transaction
    management then I''ll ever know. I''ll leave the infrastructure stuff up to them.
    I''ll stick to coding these simple little entity beans.


    ## What is a CMP Entity Bean?


    Entity beans come in two different flavors: Container Managed Persistence (CMP)
    and Bean Managed Persistence (BMP)


    Since most applications need to interact with persistent data, and since most
    vendors want you to buy their application server, each vendor has implemented
    a custom mechanism to easily create an entity bean that maps directly to a database
    table and the subsequent columns contained in that table.

