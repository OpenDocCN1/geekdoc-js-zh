    # So, what is WebSphere?


    Fundamentally, WebSphere is an IBM trademark. WebSphere is a branding that IBM
    affixes to all of their middleware products.


    WebSphere isn’t a product itself, but there are many products that live in the
    shade of the WebSphere umbrella.


    WebSphere branded products include: application accelerators, extension products,
    and at the heart of it all, the foundation product: the J2EE certified, WebSphere
    Application Server.


    J2EE is a hot topic these days, and the WebSphere Application Server is taking
    the middleware market by storm.


    The WebSphere Application Server is IBM’s solid entry in the J2EE middleware market.'
