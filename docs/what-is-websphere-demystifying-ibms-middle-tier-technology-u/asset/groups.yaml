    # Figure 13-4 Tuning Sessions


    A variety of options exists for tuning session replication between cluster members.


    +   - Very high (optimize for performance)

    Write frequency: Time based: 300 seconds

    Write contents: Only updated attributes

    Schedule sessions cleanup: true


    +   - High

    Write frequency: Time based: 300 seconds

    Write contents: All session attributes

    Schedule sessions cleanup: false


    +   - Medium

    Write frequency: End of servlet service

    Write contents: Only updated attributes

    Schedule sessions cleanup: false


    +   - Low (optimize for failover)

    Write frequency: End of servlet service

    Write contents: All session attributes

    Schedule sessions cleanup: false


    +   - Custom settings

    Write frequency: Time based: 120 seconds

    Write contents: Only updated attributes

    Schedule sessions cleanup: false


    # How can the use of in memory session replication be optimized for performance?


    First of all, WebSphere gives you the ability to configure how often replication
    occurs. That can minimize the amount of network traffic created, although it does
    reduce the ability of your cluster to recover from a failover.


    Secondly, WebSphere allows you to set up a master and slave relationship between
    application servers. If you had five servers, you could add two servers to dedicated
    session masters. Session data would be replicated to these two masters, and these
    two masters only. This would significantly reduce network traffic and the memory
    required to support in memory replication.'
