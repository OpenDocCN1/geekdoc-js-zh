    The drawback to packaging static content in the war is that you are now burdening
    your application server with the task of acting like a web server. This may introduce
    significant performance and scalability issues down the road.


    Your web server is incredibly efficient at serving up static content. As as much
    as possible, we should let the web server do what it does best, and keep static
    content away from the application server.


    # Why might you serve Servlets by class name?


    Older applications invoked a Servlet by using the class name of the Servlet in
    the URL. Enabling the ability to serve a Servlet by class name allows clients
    to call a Servlet by using an address such as:


    ```

    http://mncz.com/webmodule/com.myapp.servlet.MyServlet

    ```


    You might enable Servlets by class name in order to support older Servlet applications.
    However, serving Servlets by class name bypasses the application server''s security
    service, opening a security hole that could easily be penetrated by a clever hacker.


    Migrate your older applications as soon as possible, and get out of the habit
    of serving Servlets by class name.


    # Should you precompile your JSPs?


    Precompiling your JSPs is a good idea. Doing will alert you to any compile errors
    that exist within your JSP files early, and you can then fix those problems before
    you slam head first into a runtime exception.


    Don''t get fooled into thinking that this will make your files run faster on the
    application server though. Despite'
