    # What should we place on the ws.ext classpath?


    The extensions classpath is a great place to throw any commonly used components
    that do not make callbacks into the same version of J2EE application. This includes
    elements such as common parsers and database drivers.


    Every application in the enterprise should be connecting to the same mail server.
