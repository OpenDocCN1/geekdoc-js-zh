    The JNDI name is dependent upon the topology of the WebSphere environment.


    # What is the advantage to using a topology dependent JNDI name?


    Using a topology dependent name, you will always be successful in locating a JNDI
    addressable resource. Since you are specifying explicitly the name of the resource,
