    ## How does a resource reference work?


    Of course, you would never, ever want to hard code the JNDI name into your Java
    code. There’s a whole whack of reasons why, not the least of is the fact that
    the name you use at development time might be very different from the name WebSphere
    gives to the resource at runtime.


    "Develop one way, deploy another, and use configurable bindings to tie the two
    together."


