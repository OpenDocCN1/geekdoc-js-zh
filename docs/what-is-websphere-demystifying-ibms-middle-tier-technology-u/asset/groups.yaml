    # What is a WAR file?


    Did I mention the Java world’s propensity for taking regular zip files and giving
    them cute and cuddly names? Few things exemplify ‘cute and cuddly’ like a good
    war.


    WAR is an acronym for Web Application rArchive.


    All of your dynamic web content, which includes all Java Server Pages, all compiled
    Servlets, supporting Java classes, and a couple of other files including a deployment
    descriptor and an extensions file for the web module, gets zipped up into a single
    file. When you zip up all of your web components and then change the extension
    of your zip file to .war, you have a J2EE web module that is ready for deployment.


    All of your dynamic web components are packaged up in a WAR file.


    > So, if Bruce Springsteen ever asks you “war, what is it good for?” you can simply
    reply, “it’s great for packaging all of your web based components into a single,
    simple, easy to manage zip file.”


