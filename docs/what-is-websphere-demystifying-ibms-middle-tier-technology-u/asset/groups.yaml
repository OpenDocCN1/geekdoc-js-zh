- md: "\n# Chapter 10\n\nThe D in MVCD stands for data, and that’s exactly what cocoon\
    \ is, a data-centric framework.\n\nCocoon figures that when a client comes to\
    \ your website, they’re interested in data. Instead of using JSPs to generate\
    \ HTML, Cocoon uses XML Server Pages, XSPs, to generate data marked up in an XML\
    \ document. An XSL transition then easily converts that XML into any markup language\
    \ your client may want.\n\n## “Cocoon adds a ‘D’ to MVC”\n\nGet a Cocoon application\
    \ that serves up HTML pages, and in about five minutes, you can have that same\
    \ application coughing up PDFs, WML, HTML, and even gif images of what the html\
    \ pages would look like.\n\nThe Cocoon framework is awesome, and every time I\
    \ use it, I’m amazed at how mature and robust it is.\n\nThe biggest drawback with\
    \ Cocoon is the fact that it uses XSL transitions extensively, and XSL transitions\
    \ can be very, very slow. Cocoon is fairly resource intensive. Still, if you have\
    \ the hardware, think about adopting it as a framework – it is indeed a very powerful\
    \ Model-View-Controller framework.\n\n## PART II:\nPackaging, Deployment and the\
    \ WebSphere Runtime\n\n# Chapter 11\nExploring the EAR\n\nWhen a developer hands\
    \ their application to the WebSphere administrator for deployment, the enterprise\
    \ application is delivered to the administrator as an ear file.\n\n## What is\
    \ an ear file?\n\nWell, in simplest terms, an ear file is a zip file renamed with\
    \ a .ear extension.\n\nIf you double-click on an ear file, you can open it up\
    \ with WinZip, and the contents of the ear file will be exposed to all to see.\n\
    \nA lot of things go inside an ear file, after all, an ear does represent a complete\
    \ J2EE enterprise application. An enterprise application is made up of innumerable\
    \ EJBs, Servlets, JavaBeans and even a bunch of XML files. It only makes sense\
    \ that we would compress all of these items into a single file, and deliver that\
    \ single, convenient, zipped up file to our WebSphere Administrator for deployment.\n\
    \n> “An ear is just a zip file with a .ear extension”\n\nOf course, with the Java\
    \ world being what it is, simply calling a “zip file” a “zip file” would be far\
    \ too straightforward. Instead, we have to give our zip file a cute and cuddly\
    \ little name, such as “ear.”\n\n# Chapter 11\n\nSomeone figured that “ear” could\
    \ stand for Enterprise Application Archive, and everyone would get a kick out\
    \ of this cute little acronym.\n\nNow an ear file itself isn’t too interesting\
    \ on its own. What is interesting is all of the things zipped up inside of the\
    \ ear file.\n\n## Figure 11-1\n\nAn ear file is just a zip file with an ear extension.\
    \ You can open up any ear using a zip utility such as WinZip.\n\nimg/a64fe132c0e172db17f8974af89bd4d_99.png\n\
    \nOpening an ear file with WinZip or any other decompression utility will reveal\
    \ a variety of war files, jar files, and couple XML files. An ear file will contain\
    \ at least one web module, EJB module, or resource module. Once that requirement\
    \ has been met, any number of additional EJB or web modules are welcome.\n\n#\
    \ Exploring the EAR\n\n## What is the importance of the application.xml?\n\nAn\
    \ xml file found in every ear, named application.xml, is the deployment descriptor\
    \ for the enterprise archive. If you were to open up the deployment descriptor\
    \ and take a look at it, you’d see that it really says “I’m an enterprise application,\
    \ and I contain a bunch of web modules and EJB modules.”\n\nThere’s also an xml\
    \ file in the root of the ear which contains info about extensions to the J2EE\
    \ spec.\n\n## Figure 11-2 The Application.xml File\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<application id=\"Application\">\n  <display-name>PulpJava</display-name>\n\
    \  <module id=\"EjbModule\">\n    <ejb>PulpJavaEJB.jar</ejb>\n  </module>\n  <module\
    \ id=\"WebModule\">\n    <web>\n      <web-uri>PulpJavaWeb.war</web-uri>\n   \
    \   <context-root>PulpJavaWeb</context-root>\n    </web>\n  </module>\n  <module\
    \ id=\"ConnectorModule\">\n    <connector>PulpJavaConnector.jar</connector>\n\
    \  </module>\n</application>\n```\n\n## What is an IBM Extension?\n\nAny vendor,\
    \ so long as they have implemented the J2EE spec properly, is allowed to go beyond\
    \ the spec and add features they think users of their application server might\
    \ find helpful. Extensions represent a point – if a vendor has a bunch of extensions\
    \ that makes their server easier to use, people will flock to that vendor. At\
    \ least, that’s what Adam Smith taught.\n\nThe IBM extension file for the ear\
    \ really isn’t that interesting, as it simply allows you to set up a shared session\
    \ context and specify a reload interval for various modules. We’ll see more interesting\
    \ extensions when we crack open the EJB and web modules.\n\n## Figure 11-3\n\n\
    | Ear Level Extensions | WebSphere Extensions |\n|---||---|\n| A shared session\
    \ context, and reload interval, are IBM extensions to the spec that are configured\
    \ at the ear level. | The following are extension properties for the WebSphere\
    \ Application Server:<br>Reload interval: second(s)<br>Shared session context\
    \ |\n\nThe truly interesting part of an ear file is the war and jar files that\
    \ the ear file contains.\n\n> “Extensions are additions to the standard J2EE deployment\
    \ descriptors. They enable the use of enterprise extensions, older systems, or\
    \ behavior not defined by the specification” – Application Assembly Tool\n\n##\
    \ What is a WAR file?\n\nDid I mention the Java world’s propensity for taking\
    \ regular zip files and giving them cute and cuddly names? Few things exemplify\
    \ ‘cute and cuddly’ like a good war.\n\nWAR is an acronym for Web Application\
    \ Archive.\n\nAll of your dynamic web content, which includes all Java Server\
    \ Pages, all compiled Servlets, supporting Java classes, and a couple of other\
    \ files including a deployment descriptor and extensions file for the web module,\
    \ gets zipped up into a single file. When you zip up all of your web components\
    \ and then change the extension of your zip file to .war, you have a J2EE web\
    \ module that is ready for deployment.\n\nAll of your dynamic web components are\
    \ packaged up in a WAR file.\n\n> So, if Bruce Springsteen ever asks you “war,\
    \ what is it for?” you can simply reply, “it’s great for packaging all of your\
    \ web based components into a single, simple, easy to manage zip file.”\n\nimg/a64fe132c0e172db17f8974af89bd4d_102_0.png\n\
    \nLike the ear file, a war file will contain a deployment descriptor, although\
    \ the deployment descriptor in the web module is named web.xml, not application.xml.\
    \ If you crack open a war file, you will also notice the compulsory extension\
    \ and binding files for the web module, appropriately named ibm-web-ext.xml and\
    \ ibm-web-bnd.xml respectively.\n\nWhereas the deployment descriptor for the ear\
    \ file points to the various web and EJB modules it contains, the deployment descriptor\
    \ for the web module points to the various Servlets that are to be deployed and\
    \ managed by the web container.\n\nOf course, the web.xml file can get much more\
    \ complex than simply pointing to the various Servlets that it contains.\n\n##\
    \ Figure 11-4 Looking Inside a War File\n\nNot unlike an ear file, a war file\
    \ is a zip file with a creatively named .war extension. A web module gets packaged\
    \ up as a war file.\n\nimg/a64fe132c0e172db17f8974af89bd4d_103_0.png\n\n## What\
    \ types of things can be configured in the deployment descriptor of the war?\n\
    \nThe deployment descriptor for the web module includes such things as\n\n- module\
    \ level variables (ServletContext)\n- which Servlets should load on start-up\n\
    - initialization parameters for a Servlet\n- how Servlets should be secured\n\
    - error code mappings\n- lifecycle listeners\n- Servlet filters\n\nMany golden\
    \ nuggets of configuration data are contained in the web.xml file, but by far,\
    \ the most important part of the web deployment descriptor is the listing and\
    \ mappings for the various Servlets that a web module contains.\n"
