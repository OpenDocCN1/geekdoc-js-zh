    # Chapter 11

    Exploring the EAR


    When a developer hands their application to the WebSphere administrator for deployment,
    the enterprise application is delivered to the administrator as an ear file.


    # What is an ear file?


    Well, in simplest terms, an ear file is a zip file renamed with a .ear extension.


    If you double-click on an ear file, you can open it up with WinZip, and the contents
    of the ear file will be exposed to all to see.


    A lot of things go inside an ear file, after all, an ear does represent a complete
    J2EE enterprise application. An enterprise application is made up of innumerable
    EJBs, Servlets, JavaBeans and even a bunch of XML files. It only makes sense that
    we would compress all of these items into a single file, and deliver that single,
    convenient, zipped up file to our WebSphere Administrator for deployment


    > “An ear is just a zip file with a .ear extension"


    Of course, with the Java world being what it is, simply calling a “zip file” a
    “zip file” would be far too straightforward. Instead, we have to give our zip
    file a cute and cuddly little name, such as “ear.”'
