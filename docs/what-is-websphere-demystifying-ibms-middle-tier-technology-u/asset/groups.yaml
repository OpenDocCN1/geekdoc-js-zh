  - '[PAGE 168]


    # What is a custom user registry?


    A custom user registry is a user registry you write yourself. You may need to
    implement a custom user registry if you''re trying to integrate WebSphere with
    some other legacy applications that don''t support LDAP or the local user registry.


    # Is a custom user registry difficult to implement?


    Implementing a custom user registry isn''t as daunting a task as it might sound.
    Basically, you just have to implement a few Java interfaces that allow the WebSphere
    Application Server to authenticate a username and password. After authenticating
    a username and password combination, a custom user registry must then be able
    to tell the Application Server about the different groups to which an authenticated
    user belongs.


    Write the code needed to implement the Java interfaces required to provide this
    type of functionality, make the WebSphere Application Server aware of the code
    you''ve written, and voila, you have implemented a custom user registry. While
    perhaps this is a bit of an oversimplification, developing a custom user registry
    really isn''t that difficult a task.


    Authentication against a user registry is the first half of the security pie.
    The second half is authorization.'
- md: "\n# Chapter 16\n\n## How do you lock down your J2EE components?\n\nThere are\
    \ two types of J2EE components that we can develop and deploy to an application\
    \ server:\n\n- Enterprise Java Beans (EJBs)\n- Servlets and Java Server Pages\
    \ (JSPs)\n\nThe process of securing a J2EE application is the process of securing\
    \ EJBs and Servlets.\n\n## What can you secure in an EJB?\n\nEnterprise JavaBeans\
    \ are easy to secure. The EJB framework simplifies many aspects of enterprise\
    \ development, and securing your component model is incredibly easy when you are\
    \ using Enterprise JavaBeans.\n\nWhen securing an EJB, you have several options.\n\
    \nThe most simplistic option is not to secure an EJB all, providing clients full\
    \ access to the EJB.\n\nThe next option is to lock down the EJB as a whole and\
    \ only allow certain users or groups to call the publicly exposed methods of the\
    \ EJB.\n\nThe last option is to restrict access to an EJB based on different methods\
    \ within the EJB. For example, you could have only agents' all getter methods,\
    \ only servlet-agents allowed to call setter methods, and give double-agents the\
    \ right to access all methods of the EJB component.\n\nYou can secure EJBs right\
    \ down to the individual method level. This type of security would be extremely\
    \ difficult with a regular JavaBean. This granular, method level security is one\
    \ of the many compelling reason to integrate EJBs into your project.\n\n## J2EE\
    \ Security\n\n### Figure 16-4 Securing Methods of an EJB\n\nJ2EE security is outlined\
    \ in xml files known as deployment descriptors. In this example, trekkies and\
    \ competitors are given permission to call the getElapsedTime and start methods\
    \ of the StatefulSession EJB.\n\n```\n<method-permission>\n  <role-name>trekkies</role-name>\n\
    \  <role-name>competitors</role-name>\n</method-permission>\n\n<method>\n  <ejb-name>StatefulSession</ejb-name>\n\
    \  <method-int>Remote</method-int>\n  <method-name>getElapsedTime</method-name>\n\
    \  <method-params></method-params>\n</method>\n\n<method>\n  <ejb-name>StatefulSession</ejb-name>\n\
    \  <method-int>Remote</method-int>\n  <method-name>start</method-name>\n  <method-params></method-params>\n\
    </method>\n</method-permission>\n```\n\n## What can you secure in a Servlet?\n\
    \nSecuring Servlets is a little different from securing EJBs. Unlike an Enterprise\
    \ Java Bean, you cannot secure the individual methods of a Servlet. Instead, you\
    \ secure Servlets based upon the http method the client uses to invoke the Servlet.\n\
    \nHttp is a relatively simple protocol. It has about six or seven methods associated\
    \ with it, and of those six seven possible network method calls, there are only\
    \ two with which we are generally concerned.\n\nHttp is the protocol of the Internet.\
    \ When you click on a link, type a URL into the address bar of a web browser,\
    \ or even select a bookmarked site from your list of favorites, you have triggered\
    \ a GET invocation on the http protocol. Basically, you’re asking the http protocol\
    \ to get a resource for you from a server.\n\nWhen you fill out a form and click\
    \ the submit button, you are most likely invoking a POST invocation. Essentially,\
    \ you’re asking the http protocol to post or send information to a website or\
    \ server for processing.\n\nThere are other methods in the http protocol as well,\
    \ including an http PUT for saving files to a server, and an http DELETE, which\
    \ can delete resources from a server, but these two dangerous features are always\
    \ disabled on a secured server. After all, we don’t generally want clients to\
    \ be saving or deleting resources from our application servers or web servers.\n\
    \nWhen you secure a web-based resource such as a Servlet, you basically state\
    \ which http methods a client can use to invoke the Servlet.\n\nFor instance,\
    \ you might have a Servlet that handles a login form that is posted to the server.\
    \ In this case, you would allow only certain users to invoke the Servlet through\
    \ an http POST invocation. If an unauthorized user tries to POST to the Servlet,\
    \ the server will send an unauthorized error message back to the client.\n\nAnother\
    \ scenario might include a Java Server Page that displays usage statistics for\
    \ your database. Obviously, only database administrators should have the right\
    \ to view this JSP. When a JSP is invoked, whether invoked through a bookmark\
    \ or typed into the address bar of a web browser, it is typically requested through\
    \ a GET invocation. To secure this JSP, you would give the database administrators\
    \ group exclusive access to the resource through a GET invocation, and disallow\
    \ anyone else from viewing the JSP over any of the other http methods.\n\nSecuring\
    \ web-based resources involves figuring out which users and groups should be allowed\
    \ to access the given resource, and then figuring out which http method the user\
    \ will be using to invoke that resource.\n\n### Figure 16-5 Securing Web Resources\n\
    Servlets are secured based on the http method used to invoke them.\n\n![](img/a64fe132c0e172db17f8974af89bd4d4_172_0.png)\n\
    \n## What needs to be done to secure a JSP?\n\nIn order to secure a JSP:\n\n-\
    \ a mapping for the JSP must exist in the deployment descriptor of the web module\n\
    - the JSP must be moved under the WEB-INF folder of the web module.\n\nIf a JSP\
    \ is outside of the WEB-INF folder, it can be invoked directly by any client,\
    \ and none of the security configurations will restrict access. For JSP security\
    \ to work properly, the JSP should be moved to a folder under the WEB-INF directory,\
    \ and subsequently invoked through a name mapping.\n\nThese name mappings, also\
    \ known as URL mappings, are configured in the web.xml file.\n\n## What is a J2EE\
    \ security role?\n\nThe security infrastructure of a J2EE application is abstracted\
    \ out as much as possible. For example, you wouldn't write the actual names of\
    \ users and groups from your user registry directly into your application. After\
    \ all, your company might merge with another company, and your LDAP content and\
    \ structure might completely change. If you have the names of users and groups\
    \ from your LDAP server or user registry embedded in your applications, migration\
    \ to a new LDAP server is going to be painful.\n\nWhen securing a J2EE application,\
    \ the first task is to figure out, at a very abstract level, “who is going to\
    \ be using this application.\"\n\nFor example, if I have a banking application,\
    \ my users would probably fall into the following abstract categories:\n\n- Customers\n\
    - Tellers\n- Bank Managers\n- Auditors\n- Maybe even a system object that performs\
    \ various repetitive functions\n\nIf each of these groups has a unique level of\
    \ access to different Servlets and JSPs in the application, then we must create\
    \ corresponding 'J2EE roles' in the deployment descriptor of the web module representing\
    \ these abstract categories. The roles might also be define in the deployment\
    \ descriptor of the EJB module as well. Heck, you could even make these roles\
    \ globally available by defining them in the deployment descriptor of the ear.\n\
    \nThe point is, to configure J2EE security, you define in the deployment descriptors\
    \ of the application the abstract roles people using your application will fall\
    \ into. These definitions are in the deployment descriptor, not actually in any\
    \ of your Java code, so if the roles or categorizations change in the future,\
    \ the code shouldn't be affected - only the deployment descriptors need to change.\n\
    \n## How are J2EE roles used to implement security?\n\nWith J2EE security roles\
    \ defined in the deployment descriptors of the J2EE modules, you then secure Servlets\
    \ and EJBs based on these predefined roles. For example, you might specify that\
    \ only users who fall into the bankmanager role can invoke the DailyDepositsServlet.\n\
    \nYou could then specify that only users who fall into the tellers and bankmanagers\
    \ role can invoke the withdraw and deposit methods of the AccountEJB. You might\
    \ then specify that bankmanagers, tellers and even clients can call the getBalance()\
    \ method of the AccountEJB.\n\nPerhaps only bankmanagers can use http GET invocation\
    \ to access the DailymActivity. Maybe both bankmanagers and tellers can use an\
    \ http POST invocation to access the TransferFundsServlet, and only clients can\
    \ call the changepassword.jsp file using an http GET invocation.\n\n### Figure\
    \ 16-6 Defining J2EE Security Roles\nSecurity roles as abstract defined in the\
    \ deployment descriptor. They are abstract groupings, and are not mapped to actual\
