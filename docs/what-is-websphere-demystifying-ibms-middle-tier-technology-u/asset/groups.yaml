    # Chapter 14


    Application Server, who in turn invokes and threads the appropriate Servlet.


    ## What do our Servlets do?


    Well, the Servlet can do pretty much anything the developer wants it to do. When
    programming Servlets, a developer is only limited by their creativity, and more
    likely, their Java programming skills.


    Typically, a Servlet implements some control logic. For example, a Servlet might
    figure out what a user typed into some textfields in a web-based form. It might
    then take that information and save it to a database.


    Servlets are intended to be controllers. While Servlets can interact directly
    with a database, they’re not really supposed to. Instead, Servlets are supposed
    to delegate to a JavaBean or an EJB to do such things. Let’s say, for the sake
    of argument, a Servlet calls an EJB.


    ## From a Servlet to an EJB


    To call an EJB, especially one residing on an application server in a galaxy far,
    far away, we must first connect to the naming service of remote application server.


    The naming service is like a gatekeeper for objects running on a server. If someone
    wants access to a remote EJB, they call on the gatekeeper and ask if an EJB named
    “com/ibm/UserEJB” is around. If there is indeed an EJB with that name running
    around the server, you’re in. If not, you get an exception.


    So, to call our EJB, we first connect to the EJB’s naming service and ask if it’s
    Home. If it is, we get a handle to that EJB and can call its methods, just as
    though it were a regular JavaBean.


    ## WebSphere at Runtime


    So, what will you do with this remote EJB? Well, probably tell it what the user
    typed into textfields that appeared on the user''s web page. The EJB can then
    show that information on a message queue, or if it is an Entity Bean, the data
    might even get saved to a database. The world is your oyster you''re using EJBs.


    ## Switching Protocols


    Now you may not have noticed the little sle of hand that was played on you there,
    but there was a switch of protocols when you weren''t looking.


    When the client request is routed from the client to the web server, http/https
    is the protocol. When the web server forwards to the web container of the application
    server, the protocol remains http/https.


    Figure 14-3

    Web servers forward all request for JSPs or Servlets to the J2EE server. This
    all occurs over http/https.


    ## Servlet Invoking an EJB


    ![](img/a64fe132c0e172db17f8974af89bd4d4_148_0.png)


    ![](img/a64fe132c0e172db17f8974af89bd4d4_148_1.png)


    ![](img/a64fe132c0e172db17f8974af89bd4d4_148_2.png)


    J2EE Server (Servlets and JSPs)

    J2EE Server (Serving EJBs)


    However, when a request is made from the Servlet engine to the EJB container,
    the protocol switches from http to RMI/IIOP (Remote Method Invocation over the
    Internet Inter-Orb Protocol).


    Don''t worry, the whole protocol switch happens behind the scenes, so we don''t
    have to worry about it in our code, but it is empowering to know what is going
    on under the covers.


    ## From the Web Container, Back to the Web Server


    Once the Servlet is done interacting with the EJBs, JavaBeans or other Java components
    that might help the Servlet implement control logic, then it figures that it has
    to send some response back to the client. After all, the client always likes to
    see a web page that lets them know everything is working the way it should.


    Servlets themselves don''t generate HTML to display to the client. Well, they
    can, but again, they''re not supposed to. Instead, they forward to a JSP.


    The JSP then runs, and when it''s done running, it forwards all of the html it
    has generated back to the web server. The Web server then forwards the html back
    to the client along with any images or other files the html page might need to
    display properly.


    And that''s it, a simple round trip for our J2EE application.


    ## What if we use the Edge components?


    The above scenario assumes all of your requests are routed through a single web
    server. Of course, the site might just be so popular that one web server isn''t
    enough. If that''s the case, you''ll need to set up two or more web servers, install
    the WebSphere plug-in on both machines, and then get a third machine that will
    work as an IP sprayer.


    An IP sprayer handles all incoming requests, and then sprays those requests across
    your various HTTP servers. IBM Edge Components provide a software package that
    allows you to set up a machine to act as an IP sprayer. It also provides a variety
    of caching mechanisms as well.


    Nortel and Cisco also provide hardware solutions for spraying requests across
    web servers. The Edge server also provides a few tools that can pull performance
    information off your web servers and allow the Nortel or Cisco routers to spray
    the web servers that are most capable of handling requests.


    ## How does security effect overall application flow?


    When you turn security on, the WebSphere Security Service will challenge the client
    for a username and password as soon as a secured resource is requested. The client
    then provides the appropriate credentials, and WebSphere will validate those credentials
    against a user registry, most likely an LDAP server.


    If your credentials check out, and you are authorized to view the Servlet you
    selected, WebSphere will invoke Servlet, and your credentials will be passed onto
    any EJBs or JSPs that your Servlet subsequently invokes.


    When content is returned to your browser, WebSphere will go so far as a little
    LTPA token in a cookie it plants on your machine. The cookie keeps getting sent
    back to the server on subsequent requests, and the token tells WebSphere that
    it can trust you and that it doesn''t need to ask you for your username and password
    again.


    ## Which Web Servers can you install the plugin into?


    The IBM plugin can be installed into all of the major web server vendors on the
    market today. This includes:


    - Sun One

    - Microsoft IIS

    - Netscape

    - Apache

    - IPlanet

    - Domino


    ## Can I bypass the web server and tunnel directly to my application server?


    Yes, you can bypass the web server. WebSphere is what is known as an ‘embedded
    http server.’ This embedded server handles requests on port 80.


    You can explicitly specify the IP address of your server and the port number,
    and test your Servlets and JSP files. It’s a great way to test, but you should
    never use it in production.


    In fact, if you look at the admin console for WebSphere, using the default configuration,
    it runs on port 9090, and is not accessed through a web server.


    ![](img/a64fe132c0e172db17f8974af89bd4d4_152_0.png)


    # Chapter 15


    ## Flavors of WebSphere


    IBM is always willing to sell you a product that will address your needs. Heck,
    they’ll even sell you products you don’t need. They’re ‘good people’ like that.
    🙂


    IBM provides several editions of the WebSphere Application Server to fit the specific
    needs of customers.


    - WebSphere Base Edition

    - WebSphere Enterprise Edition

    - WebSphere Network Deploy


    ## What is the Base Installation?


    The base installation is a fully certified, J2EE compliant application server.
    The base edition provides a runtime environment that allows you to deploy, run
    and manage all of the J2EE components your developers create. Deployment of your
    Servlets and EJB applications to the base edition is straightforward and easy.


    The WebSphere Base Installation implements all of the services and components
    required by the J2EE specification, including:


    - A Naming Service

    - JDBC Extensions

    - A Messaging Service

    - A Security Service

    - A Transaction Service


    The base edition also allows you to communicate with your Servlets and JSPs by
    using the standard J2EE protocols, namely http, https and RMI/IIOP.


    There’s only one minor piece of functionality missing from the base install. What
    is that missing piece? The base installation is missing the ability to do workload
    management and provide failover, that’s what is missing.


    Yes, you heard correctly: the base installation provides no facilities for supporting
    failover or workload management. If your interested in being able to recover from
    the cleaning staff accidentally pulling the plug out of one of your servers, I’m
    afraid your going going to have to ask IBM if they will sell you the Network Deployment
    Manager as well.

