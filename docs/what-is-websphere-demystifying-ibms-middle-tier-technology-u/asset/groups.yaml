    # Chapter 11


    precompiling JSPs, the application server will still turn any updated JSPs into
    a Servlet the first time the JSP is encountered. The application server will then
    compile the Servlet it creates, and load the Servlet into memory. Precompiling
    does not always sidestep this behavior. Your mileage may vary, so it is important
    to test this behavior on your own.


    Precompiling JSPs won’t necessarily make your applications any more responsive
    at runtime. It will alert you to any compile errors in your JSPs though, which
    is indeed a valuable feature.


    # What is a jar file?


    A jar is, once again, just a zip file with the extension to jar. It just sounds
    so cute to say that we “package our JavaBeans in little jars.”


    When inside an ear file, a jar file can be one of three types:


    +   - EJB jar file, containing all the resources needed by an EJB module


    +   - a Java jar file, simply containing Java code needed to support web modules
    and EJB modules


    +   - a client jar file, containing the code required to support a J2EE compliant,
    stand alone Java app


    The ear file differentiates between EJB jar files, client jar files, and java
    jar files by looking in its own deployment descriptor named application.xml.'
