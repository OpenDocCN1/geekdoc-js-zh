    # Exploring the EAR


    The deployment descriptor also specifies whether an EJB is a message driven bean,
    entity bean or a session bean. Again, this is the information application server
    needs in order to properly manage the EJBs you created at runtime.


    The ejb-jar.xml file describes how to manage the EJBs you wish to deploy at runtime.
    I guess that’s why they call it a ‘deployment descriptor.’


    And not unlike a war file, or the ear file as a whole, the EJB jar file also contains
    an extensions file. For EJBs, IBM extensions include the ability to support EJB
    inheritance, and to configure relationship mappings for container managed persistence
    (CMP) beans.


    A WebSphere EJB jar file might also contain a schema map, a field attributes beans
    and a ddl file, which will create database tables to support your CMPs if you
    don’t already have the underlying database created. A WebSphere EJB module is
    a very clever thing.


    The schema map and ddl files are provided just in case you want to create database
    tables based upon the container managed persistent beans you’re using, although
    they are not necessary for the day to day execution of your EJBs.


    # What is a client jar file?


    A client jar file simply contains the Java code required to run a stand-alone
    Java application. A client jar file also contains a deployment descriptor, which
    generally contains nothing more than a link to the Java class that kicks off the
    standalone app.'
