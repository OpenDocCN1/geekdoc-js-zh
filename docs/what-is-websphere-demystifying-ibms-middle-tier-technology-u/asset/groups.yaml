    If you use the administrative console of the WebSphere Application Server, and
    look at the various features of ‘application server,’ the type you create within
    WebSphere, you’ll notice that many of its properties are curiously similar to
    the ones you might see on a regular, everyday, Java Virtual Machine.


    Some things you can configure on this mysterious entity called application server
    include:


    - classpath

    - debugging service

    - output logs

    - heap size


    Sounds an awful lot like the properties of a Java Virtual Machine to me!


    You can monitor the various processes that are running on your Windows system
    using the task manager. Next time you start your WebSphere Application Server,
    fire up the task manager, and you’ll notice a java.exe gets kicked off that consumes
    upwards of two hundred megs of memory. That java.exe process is your application
    server.


    # Chapter 12


    ## Figure 12-2 server1 Server to JVM Mapping


    An application server is a server which provides services required to run enterprise
    applications. Using the process id from the Admin Console, you can map the server''s
    process id to the actual JVM or java.exe process running on your computer.


    (Image de-referenced from page 119)


    Of course, we must accept that the JVM running our enterprise applications is
    much more than just the simple process that supports the standard Java development
    kit (SDK). The java.exe process on which our applications run also supports a
    web container, EJB container, a naming service, security service and transaction
    service, just to name a few.


    Nevertheless, under the covers, an ''application server'' is simple a java.exe
    process running on your computer.


