  - '[PAGE 162]


    # Chapter 16 J2EE Security


    What is the difference between authentication and authorization?


    Authentication is the process of proving that you are indeed who you say are.
    With WebSphere, you will usually do this by providing a username and a password.
    The WebSphere security service then checks your credentials against a ''user registry''
    and verifies that you are indeed who you say are. If your credentials check out,
    WebSphere will tell you to try to log in again.


    Don''t get too excited being successfully authenticated though. Being authenticated
    doesn''t necessarily mean you have the right to access anything. In fact, you
    may have just authenticated yourself as an undesirable, and you might not be allowed
    to access anything. Being authenticated is a start, but once you are authenticated,
    you must then be authorized in order to access resources on the server.


    For example, imagine I was interested in accessing a secured Servlet. I might
    successfully authenticate myself as an agent, but if only tagagents and doubleagents
    have access to that resource, well, I''m out of luck. WebSphere won''t allow me
    to access it.


    So, authentication is proving that you are indeed who you say you are. Authorization
    is the process of evaluating whether an authenticated user has the required rights
    to access the resource in which they are interested.


    ![](img/a64fe132c0e172db17f8974af89bd4d4_162_0.png)'
  - '[PAGE 163]


    # Chapter 16


    > Authentication is the process of proving who you are.

    Authorization is the process of giving a user access to a particular resource.


    # What is a user registry?


    A user registry is simply a place for keeping track of usernames, passwords, and
    the various groups to which users belong.


    Every enterprise operating system keeps track of usernames and passwords. We''re
    probably all familiar with the Administrators group on a Windows machine, and
    maybe even the root user on a UNIX machine. These users and groups are part of
    the Windows or Unix operating system''s user registry.


    The local operating system of the machine on which WebSphere is installed is the
    default user registry used by the WebSphere Application Server.


    However, despite the default user registry for a WebSphere installation, the local
    operating system''s user registry is not a viable registry for WebSphere if you
    are trying to implement a scalable, highly available, enterprise architecture.
    If you need a user registry, you really should be using one of the other user
    registry options that are compatible with the WebSphere Application Server.


    WebSphere can use three different types of user registries:


    +   - An LDAP Directory

    - A Custom User Registry

    - A Local OS User Registry'
  - '[PAGE 164]


    # Figure 16-1 General Security Settings for WebSphere


    Local OS, LDAP, and Custom are the three compatible user registries with the WebSphere
    Application Server.


    | General Properties | |

    |---|-|

    | Enabled | |

    | Enforce Java 2 Security | |

    | Use Domain Qualified User IDs | |

    | Cache Timeout | *600 |

    | Issue Permission Warning | |

    | Active Protocol | CSI and SAS |

    | Active Authentication Mechanism | * SWAM ple |

    | Active User Registry | Local OS LDAP Custom |


    # What is LDAP?


    LDAP is an acronym standing for Lightweight Directory Access Protocol.


    An LDAP directory is a great place to store all sorts of data, especially data
    that rarely changes. The names of the printers in your office, the IP address
    of your mail server or even targets of opportunity in the event of a nuclear war
    are examples of data that rarely change and would subsequently be good candidates
    for being stored in an LDAP directory.


    LDAP is a fast and efficient mechanism for storing data that is largely read only.
    The email address of your company CEO is the type of data you will maintain in
    your LDAP server. The value of you stock portfolio is not.'
  - '[PAGE 165]


    # Chapter 16


    The names of our users, and for that matter, their passwords, are examples of
    data that are often read and rarely updated. If you are using WebSphere, you’re
    most likely using an LDAP server as the user registry.


    # ## What does an LDAP directory do?


    An LDAP server is very effective at keeping a listing of all the users in your
    workplace. LDAP can even assemble those users together into a set of meaningful
    groups. For example, you could have Joe in the agents and secretagents LDAP group,
    and you could have Cynthia in the LDAP groups called administrators and doubleleagents.


    LDAP is used to store information about your WebSphere users, while at the same
    time, allowing you to organize those users into a meaningful set of groups.


    Furthermore, an LDAP server is also incredibly efficient at determining if a username
    and password stored in the LDAP server matches the username and password of that
    shady character that is currently trying to log in.


    # Figure 16-2 LDAP Users and Groups


    LDAP effectively organizes users into groups. Notice that a given user can be
    associated with several different groups.


    | Tan | Babs | Cec | Tan | Cec | Dave | Ash |

    |---|---|---|---|---|---||

    | admins | | | aliens | | athletes | |


    164'
  - '[PAGE 166]


    # J2EE Security


    If the user name and password supplied by the client indeed matches a username
    and password combination in the directory, LDAP will work with WebSphere to authenticate
    the user and let WebSphere know the various groups to which that user belongs.


    LDAP is an incredibly effective user registry, and it is the preferred and recommended
    user registry for the WebSphere Application Server.


    For an enterprise application, an LDAP server is great choice as a user registry.


    # Where can I buy LDAP?


    LDAP is a specification, not a product. Nevertheless, there are many vendors out
    there who provide implementations of the LDAP spec.


    Some popular implementations of the LDAP specification include:


    +   - Windows Active Directory

    - Netscape Enterprise Server

    - Novell Directory Service

    - OpenLDAP


    IBM loves LDAP so much, they actually have three different implementations of
    the spec:


    +   - Secureway Directory Server

    - IBM Directory Server (IDS)

    - Lotus Domino Directory Server'
