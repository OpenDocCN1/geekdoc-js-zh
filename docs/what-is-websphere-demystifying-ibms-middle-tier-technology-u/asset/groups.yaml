    # WebSphere at Runtime


    # Chapter 14

    WebSphere at Runtime


    ![](img/a64fe132c0e172db17f8974af89bd4d4_142_0.png)


    Let’s look at a typical web based interaction with our application server at runtime.


    Let’s use a typical scenario where the request is coming in from an Internet browser,
    such as Internet Explorer, Netscape Navigator or Opera. We’ll also simplify the
    interaction by eliminating the complications presented by workload enhancements
    such as the Edge Server components, network sprayers and caching proxies. We’ll
    just focus on a typical web based interaction between a web based client and our
    WebSphere Application Server.


    # From Client to Web Server


    When dealing with web based requests, before tunneling through to our application
    server, a client will always hit a web server first. The WebSphere Application
    Server does not replace the need for a web server. A web server remains as a pivotal
    part of the WebSphere architecture as ever.


    Web servers are great at doing one thing: serving up files. A web server takes
    requests from clients, maps that request to a file on the system, and then sends
    that file back to the client.


    If you want an html5 file, a web server can efficiently and reliably find that
    file and send it back to you. If you need an image, a web server can serve it
    up to you as well. You


    # Chapter 14


    want to download a zip file or a pdf file quickly and efficiently? A web server
    can make that happen.


    Unfortunately though, your web server is about as intelligent as a male model.
    A web server can serve up static files until the cows come home, but ask your
    web server to add ‘one plus one’ and you’ll be waiting there for a very, very
    long time.


    Figure 14-1

    A web server responds to a request for static content.


    # Request - Response Cycle with a Web Server


    ![](img/a64fe132c0e172db17f8974af89bd4d4_143_0.png)


    If our applications use any images, HTML, pdf or zip files, we like to keep all
    of those static files on the web server. If we need some logic or dynamic content
    in our applications, we will delegate to our Servlets, JSPs, EJBs and JavaBeans
    that are running on our Application Server.


    Now here is the dilemma. Our application server contains all of our Servlets and
    JSPs, but all of the requests go through the web server, and the web server, not
    being a very clever machine, tries to handle all requests, regardless of whether
    the request is for an image, html file, or to our detriment, a Servlet or a JSP.


    # WebSphere at Runtime


    # How do you stop a web server from trying to handle requests for your Servlets
    and JSPs?


    The key to stopping a web server from trying to serve up JSPs or Servlets, is
    to install something called the WebSphere Plug-in on the web server.


    The general idea, although not a hard and fast rule, is that before you install
    WebSphere, you should install your web server first. Even when you do a full installation
    of the Application Server, behind the scenes, WebSphere installs the web server
    first, and then installs the ‘WebSphere plug-in’ into that web server.


    ![](img/a64fe132c0e172db17f8974af89bd4d4_144_0.png)


    # Forwarding Servlet Requests to a J2EE Web Container


    What exactly does the web server plug-in do?


    As was stated earlier, the web server tries to handle every single request that
    it receives. However, when the WebSphere Application Server comes onto the scene,
    it introduces itself to the web server and has a conversation that goes something
    like this:


