    # Servlets and Java Server Pages (JSPs)


    Figure 3-1


    Typing a URL in the address bar will trigger a Servlet''s doGet method


    ![](img/a64fe132c0e172db17f8974af89bd4d4_34_0.png)


    The doGetPost method of a Servlet is usually invoked when a user fills out an
    html form and clicks the submit button.


    If a user is going to call your Servlet by clicking on a link, you code the doGet
    method. If the user will be filling out a form and sending data to the server,
    you code the doGetPost method. It''s just that easy!


