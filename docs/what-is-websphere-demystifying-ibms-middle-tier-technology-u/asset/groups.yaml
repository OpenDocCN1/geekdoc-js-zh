    ## 在 JVM 上是否可能运行多个实例的单例？


    单例是一个 Java 类，其设计方式确保了该类始终有一个实例被加载到 JVM 中。单例是存在的最常见设计模式之一，在尝试限制对各种资源的访问时非常有效。


    然而，如果一个单例类被打包并放置在不同类加载器（classloaders）的类路径上，那么确实有可能运行多个单例实例。如果单例正在管理某些关键任务的资源，请务必确保您的应用程序打包方式不会导致类加载层级结构启动出多个实例。


    ## 为什么我在运行应用程序时会遇到序列化错误？


    当每个应用程序和 Web 模块使用不同的类加载器（特别是当配置了父类优先（parent-last）配置时），可能会出现另一个有趣的问题：加载了同一个类的冲突版本。


    例如，假设 Web 模块使用 `com.pulpjava.User` 1.1 版本，而另一个项目中的 EJB 模块使用 `com.pulpjava.User`
    1.2 版本。你认为 JVM 上只能加载一个版本的 JavaBean，对吧？错！


    即使两个应用程序可能运行在同一个 JVM 上，如果 Web 模块配置了父类优先的类加载配置，并且它随后尝试将 User 对象传递给 EJB 模块，就会出现各种序列化和版本错误，因为两个模块都在使用同一个
    JavaBean 的不同版本。


    两个模块可能一个 User 类，且两个模块都可以将该类加载到 JVM 中。然而，当它们尝试互相传递 User 对象时，会因为版本不同步而抛出运行时异常。


    这种类型的场景可能会产生各种晦懂的错误信息，而排故障的关键在于弄清楚是哪个模块加载了哪个版本的类。


    解决方案通常需要重新部署应用程序，以便它们能够正确地通信。这可以通过重新打包应用程序来实现，确保 EJB 和 Web 模块都使用相同的类加载器来加载 `com.pulpjava.User`
    类。


    另一种解决方案是调整 `com.pulpjava.User` 类的序列化 ID（serialization id），让 JVM 认为这两个类是同一个。无论如何，解决序列化
    ID 错误都不是好玩的。


    ## 什么是类可见性？


    类加载器永远无法使用或访问由其层级结构中下方类加载器所加载的类。这可能会创建一个奇异的场景：Web 模块可能能够找到名为 User 的 Java 类，但使用不同类加载器的
    EJB 在尝试访问完全相同的类时会抛出 `ClassNotFoundException`。


    考虑到这一切都发生在同一个 JVM 上，我通常只会对着 JVM 大大叫，要求它解释为什么在 Web 模块中可以完好地找到文件，但在 EJB 模块中却找不到。说实话，我从未发现对着
    JVM 大大叫是解决 `ClassNotFoundException` 的有效方法，但它确实能让我感觉好受。


    类可见性描述了哪些类可以被哪些类加载器看到，随后被哪些 J2EE 组件看到。


    如果没有对类加载工作原理的根本理解，排查类加载器问题是非常困难的。


    ## 有时我可以访问某个类，有时却不能！


    当三个类都访问第四个类时，会出现有趣的场景。假设第四个类是一个数据库驱动程序。


    如果驱动程序打包在 ear 的根目录下，Servlet 在运行时就能调用该驱动程序。同一个项目中的 EJB 在运行时也能调用该驱动程序。然而，打包在 WebSphere
    扩展类路径上的通用组件将无法调用该驱动程序，而是会抛出 `ClassNotFoundException`。


    再次，你将能够证明 JVM 确实可以找到驱动程序，因为你的 EJB 和 Servlet 都能使用它。你甚至可以在 JVM 上对驱动程序进行性能分析，毫无问题的证明
    JVM 不仅可以找到该类，而且可以加载并运行它而没有任何异常。


    只有当打包在 `ws.ext` 级别的组件尝试调用类加载器层级结构中方的组件时，你的应用程序才会遇到问题。


    这是一个惨痛的教训：类加载器无法调用位于其类加载器层级结构下方路径上的类。


    ## 打包通用组件的最佳位置在哪里？


    在前面的场景中，你可以采取两件事之一来消除 `ClassNotFoundException`：


    - 将驱动程序移动到 `ws.ext` 目录，与通用组件一起

    - 将通用组件移动到 ear 中，与驱动程序一起


    我个人认为，我会两个都做。通常，驱动程序放在 `ws.ext` 类路径上，而通用组件放在 ear 的根目录下。


    ## 我们如何才能打包应用程序？


    那么，有了这些类加载器和各种类路径问题，问题变成了：“我们应该如何打包应用程序，以及在哪里放置各种 jar 文件（如通用组件、驱动程序、工具类等）？”


    第一条规则是：所有的 EJB 都应该放在 EJB 模块中，所有的 Servlet 都应该放在 Web 模块中。遗憾的是，从这里开始变得有点棘手。


    例如，你应该将包含自定义标签实现实现的 jar 文件放在哪里呢？自定义标签让 JSP 开发变得简单得多，而且它是一个以 Web 为中心的组件，所以常识认为你应该把它放在
    Web 模块的 `lib` 目录中。但如果你的 ear 文件有四个或十四个使用这些自定义标签的 Web 模块呢？你应该复制包含自定义标签代码的 jar 文件，并将该
    jar 的副本放在十四个 Web 模块中的每一个中，还是在 ear 内部放置一个中心副本？


    你应该复制该文件 14 次，还是让每个模块只引用一个唯一的副本？复制似乎是极大的浪费，不是吗？


    将包含实现自定义标签的 Java 代码的 jar 包放在 ear 的根目录下，意味着你的代码有一个中心位置，当应用程序运行时，尽管有许多模块，也只会创建一个类实例来处理请求。这听起来绝对是最好的替代方案，但老实说，那不是我会采取的方案。


    我个人会在每个 war 中放置一个 jar 包副本。这意味着代码被冗余地从 war 复制了十四次，这本身是一件坏事。这也意味着会有额外的通用标签类实例运行，这意味着性能略有下降。但对我来说，我宁愿在每个
    war 中复制这些代码。


    任何项目的长期成本并不是让其运行的成本，而是随着时间管理和维护该应用程序的成本。


    让每个 Web 模块指向相同的自定义标签代码会让未来的版本更改变得非常头疼。如果我在 ear 层更新了自定义标签代码，那么每个 Web 模块也必须升级到新版本。期望应用程序中的每个
    Web 模块同时更新是不合理的。


    将此 jar 文件放在每个 war 中要简单得多，当新版本的库发布时，可以以每个 war 为单位进行应用程序迁移的斗争。毕竟，你的企业中所有应用程序准确在同一时间迁移是什么时候？最可能永远没有。


    ## 我们应该如何打包通用工具组件？


    现在让我们思考一组通用的组件。例如，你的公司有一组通用组件，包括 User 对象、Employee 接口以及许多在所有 EJB 和 Web 模块中使用的其他有用且可复用的对象。你会把这样的
    jar 文件放在哪里呢？


    ![图 19-6 你的通用组件应该与 war 文件和 ejb 模块一起放在 ear 中。](img/a64fe132c0e172db17f8974af89bd4d4_245_0.png)


