    ## Chapter 7


    We could even slap a security attribute on the method as well so that only certain
    users can call it.


    Furthermore, by using an inherently multithreaded EJB, we know that concurrent
    access won''t be a problem. After all, that is what a J2EE compliant application
    server promises us when we use EJBs.


    We can also invoke the session bean''s method remotely, since EJBs implicitly
    implement remote distribution through remotely invocable interfaces.


    Stateless session beans become the glue that holds the whole EJB horse together.


    ## Chapter 8

    ## Using EJBs


    ### When should you use EJBs?


    EJBs are incredibly powerful components that allow developers to easily take advantage
    of the application server''s security, transaction, naming and distribution services.
    However, EJBs are also incredibly resource intensive. If you use EJBs excessively,
    you''ve just bought yourself a one-way ticket to performance problemville.


    Before committing to using an EJB, ask yourself the following questions:


    - Do I need to manage some serious database transactions?


    EJBs are great for managing transactions, and if you have a largely transactional
    system, EJBs just may be your saving grace.


    - Do I need object distribution?


    - Are users calling my components remotely?


    This is a good case for using EJBs, as EJBs are inherently distributed objects.
    However, this alone is not a compelling reason to employ an EJB centric solution.


    There are many mechanisms for implementing remote distribution including remote
    method invocation (RMI) and network socket programming, both of which are more
    efficient than using an EJB.


    Needing object distribution is a good reason for using an EJB, but I’d look for
    another reason or two before committing to an EJB based solution.


    - Do I need security down to to the method level?


    EJBs provide the ability to interact with the security service of the application
    server, and you can lock EJBs right down to the method level. This type of security
    would be relatively difficult to implement with regular JavaBeans.


    Needing this type of security is a good reason to use an EJB, but it shouldn’t
    be a reason on its own.


    If security is the problem you need addressed, you could probably avoid using
    EJBs and lock down your applications by securing Servlets and JSPs instead. The
    Java Authentication and Authorization Service (JAAS) could also be used to facilitate
    a secure system using EJBs, but even JAAS introduces an extra level of complexity.


    EJBs do indeed provide secure access right down to the method level, and if this
    is the type of security you need, EJBs might be a viable solution.


    - Do I need to make sure that the data application receives is completely and
    totally in sync with the data in the database?


    - Do I need a persistence model?


    CMPs and BMPs address the many difficulties associated with communicating with
    a database, as they provide a persistent object model that makes sure the data
    obtained by your application is completely and totally in sync with the database.


    Again, if this type of persistence modeling is what you need, go ahead and use
    EJBs. However, if your application is largely reading data from a database, and
    data collisions are rare and not likely to be detrimental when they happen, I
    wouldn''t use an entity bean framework. In that scenario, I''d look at Java Data
    Data Objects (JDO) or Hibernate. Remember, entity beans are incredibly resource
    intensive. Use them only if you need them.


    - Do I need multithreaded access with large workloads


    EJBs are inherently multithreaded, and application servers, especially WebSphere,
    are highly scalable. The need for a soundly multithreaded system is a good peripheral
    reason for using EJBs, but I wouldn''t base my decision on multithreading support
    alone. After all, you can always synchronize methods in a regular POJO (plain
    ordinary java object.).


    ## Use EJBs Sparingly


    The point is, EJBs are incredibly powerful, but they are also incredibly resource
    intensive. Use them when they make sense, but use them sparingly.


    Unnecessary EJBs will slow down your applications and performance will quickly
    become an issue. There is a good reason why many of the J2EE design patterns demonstrate
    how you can achieve many of the benefits of using EJBs while minimizing their
    actually use.


    If you choose to use EJBs, choose to use them wisely.


    ## J2EE Protocols and Services


    ## Chapter 9

    J2EE Protocols and Services


    ### Why are J2EE Services significant?


    J2EE components by themselves are pretty boring. What makes J2EE components interesting,
    far more interesting than anything you could write using the Standard Java Development
    Kit (SDK), are the various J2EE services they can access.


    What services are we talking about?


    To name a few:


    - A Transaction Service

    - A Naming Service

    - A Messaging Service

    - A Security Service


    A J2EE application server implements a variety of application programming interfaces
    (APIs) that provide EJB and Servlet developer''s access to the important services
    that have been implemented by those clever sausages on the WebSphere development
    team.


    WebSphere provides a security service that challenges users for a username and
    password when they try to access a secured resource; the security service subsequently
    provides authorization for access to other J2EE resources.


    Using various J2EE APIs, a developer can access this security service and do sexy
    things with it, such as finding out the name with which a user logged.


    It was mentioned earlier that EJBs can easily manage distributed transactions.
    Well, it''s not the EJB that manages the transaction, it''s WebSphere that does.
    The underlying transaction handles. As developers, we simply edit a deployment
    descriptor that tells WebSphere how our EJB will participate.


    What J2EE is all about:


    J2EE is all about the components developers can write, and the various J2EE services
    they can access. By allowing Servlets and EJBs to interact with a highly robust
    security, naming, messaging, and transaction service, the J2EE framework empowers
    developers to create highly effective applications.


    ### What are the J2EE protocols?


    As interesting as your Servlets and EJBs might be, nobody cares about them if
    they can''t interact with them, which brings us to the third prong of J2EE: protocols.


    When it comes to J2EE, there are four basic protocols we will encounter:


    - RMI (remote method invocation)

    - IIOP (Internet orb protocol)

    - http (hypertext transport protocol)

    - https (secure http)


    ### What is http?


    Http is the protocol of the Internet. When someone requests an html file, opens
    up a pdf, or downloads a zip file, they''re using the Hyper Text Transport Protocol.
    When a client calls on a JSP or a Servlet, they invoke it using the http protocol.


    ### What is https?


    Of course, some people don''t like the idea of their requests, which includes
    anything they may have typed into a textfield or an online form, shooting across
    the Internet in plain text.


    To address the security concerns associated with transferring data across the
    Internet, Netscape created https, the Hyper Text Transfer Protocol with secure
    sockets, also known as "secure http."


    ### What is RMI?


    Htps basically piggybacks on top of http, encrypting and securing a request and
    response so that nobody can view it, and no unscrupulous individual can tamper
    with the request or response midstream.


    Http and https are the protocols we use to access web-based components, which
    from a J2EE perspective, means Servlets and JSPs.


    Invoking EJBs is quite a bit different from invoking a Servlet or a JSP. EJBs
    use RMI over IIOP to handle EJB requests and to send back a response.

