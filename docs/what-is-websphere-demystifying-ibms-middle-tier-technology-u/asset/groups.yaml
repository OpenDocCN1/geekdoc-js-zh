    # 第 5 章


    这些供应商提供的组件不仅代表数据库中包含的数据，它们还拥有关于如何更新数据库、检索数据，甚至在数据库表中创建新行的内在知识，只要为它们提供唯一的主键。这些供应商提供的组件非常惊人，它们消除了许多编写无聊
    SQL 语句或开发那些带有愚蠢 setter 和 getter 与数据库进行事务性交互的数据组件的需求。


    > “供应商提供的实体豆被称为 CMP”


    这些供应商提供的实体豆被称为 CMP，或者说叫容器托管持久化（Container Managed Persistence）豆，因为是由供应商的 EJB 容器为我们实现了持久化。


    # 自上而下、自下而上和折中映射有何区别？


    供应商提供了多种创建容器托管持久化豆（CMPs）的方法，包括：


    - 自上而下（top down）

    - 自下而上（bottom up）

    - 折中方案（meet in the middle）


    “自下而上”发生在你已经有一个数据库，并且想根据数据库表创建 EJB 的时候。


    自上而下下发生在你首先创建 EJB 和对象模型，并希望根据该模型创建数据库表的时候。


    # 实体豆（Entity Beans）


    使用自上而下的映射时，WebSphere Studio Application Developer 等工具允许你先创建 EJB 组件，然后工具将生成 SQL
    脚本，根据你编写的组件创建数据库表。


    折中方案发生在你的数据库管理员和应用程序开发者无法就如何协调关系模型与对象模型达成一致时。开发者自己去创建 EJB，数据库管理员自己去创建他们的数据库。然后某个可怜的倒霉蛋得想办法将这两部分结合起来。换句话说，这个倒霉蛋必须在关系模型和对象模型的中间汇合。


    折中方案允许 Java 开发者将独立创建的 EJB 映射到已经存在的数据库表中。这可能是我们在行业中看到的常见的 EJB 映射类型。


    # 什么是 BMP 实体豆？


    BMP 是任何不是 CMP 的实体豆。这太简单了。


    正如之前讨论的那样，容器托管持久化（CMP）豆减轻了开发者编写 SQL 代码的负担，而 Java 开发者在编写 SQL 方面是出了名的糟糕。


    使用豆托管持久化（BMP）时，开发者承担了编写更新、删除、创建和查找底层数据库表所需的全部 SQL 代码的责任。基本上，使用 BMP 开发者必须做更多工作，老天保佑，可能还要去和数据库人员交流协助编写一些
    SQL 语句。


    # 第 5 章


    # 为什么有人会想使用 BMP？


    创建 BMP 绝对比让开发工具为你创建 CMP 的过程复杂得多。尽管如此，使用 BMP 的过人理由确实存在。


    # 你的数据库不支持容器映射


    取决于你的数据库，CMP 并不总是可选。例如，WebSphere Studio Application Developer 只允许你为某些数据库创建 CMP，尽管大多数数据库都受支持。然而，如果你正在使用特殊的面向对象数据库，或者可能是一个市场渗透率没有
    Oracle 或 DB2那么高的数据库，你可能会遇到麻烦。


    # 你的数据库太复杂了


    你的数据库可能对于那些实现容器托管持久化的开发工具来说太复杂了。


    如果你的数据库充满了疯狂的连接（joins），拥有极其大量的多对多关系，并且你的 ERD 看起来像一张北美铁路系统地图，那么我担心现有的 CMP 工具对你来说大大用处。在这种情况下，你必须编写自己的疯狂
    SQL 代码来与你疯狂的数据库进行交互——开发工具根本无法帮上你的忙。


    # 可移植性是一个问题


    另一个需要考虑的因素是可移植性。当然，如果你正在使用 DB2 和 WebSphere，可移植性就问题，因为 IBM 是最好的，你永远不会想离开他们。但需要注意的是，尽管一直在努力标准化
    EJB 开发，但一个供应商的 CMP 与另一个供应商的略有不同。WebSphere 的 CMP 不一定能迁移到 WebLogic 服务器，尽管 CMP 规范的最新版本确实正在弥补这一差距。


    假设它们使用的 SQL 相当标准，BMP 可以轻松地从一个数据库迁移到另一个。与 CMP 相比，BMP 的可移植性更容易实现。


    # 性能与控制


    通常情况下，CMP 的性能会比 BMP 快，特别是当你从 WebSphere Application Server 迁移到 DB2 数据库时。信不由，IBM
    那些聪明的家伙们在高效连接 DB2 数据库方面比你或我都要懂得多。


    此外，CMP 可以在后台采取各种我们根本不知道的捷径。供应商之间竞争的是谁拥有最高效的应用程序服务器，而高效地连接后端数据库是一个非常大的卖点。与 BMP
    相比，CMP 与数据库交互通常更好。


    # 我可以同时使用 CMP 和 BMP 吗？


    在 CMP 和 BMP 之间做出选择并不是一个全有或全无的决定。容器和豆托管实体豆可以在同一个应用程序服务器内高效地共存。


    事实上，对继承和接口的创造性使用使得 BMP 和 CMP 的交换变得简单。这允许你快速创建 CMP，并在将来如果需要，无缝切换到 BMP。


    # CMP 更好还是 BMP 更好？


    我确定有人会辩称 BMP 更好，因为你几乎是从零开始编写代码的，它们带给你更多控制权；尽管我建议 CMP 比 BMP 快，但其他人可能会认为，通过实现诸如“脏位”（dirty
    bit）模式并执行一些奇特的 SQL 魔术，你实际上可以让 BMP 比 CMP 更高效。这可能也是真的。在 BMP 中控制数据库访问提供了无限优化的机会。


    然而，任何应用程序的成本并不在于创建、托管或部署它的费用。与企业级应用相关的最大成本是随时间的维护，而维护那些由内部超级天才在离开公司去 MIT 访学后编写并优化的
    BMP 代码，可能是无法逾越的。如果你可以使用 CMP，那么 CMP 是最好的。


    CMP 的维护比 BMP 简单得多。维护一个内部没有任何代码的组件是我乐意自愿承担的任务。


    这把我们引向另一个点——无论你喜欢还是讨厌它们，CMP 都为将 Java 组件映射到后端数据库提供了一个标准框架——使得面向对象的、事务的数据库访问成为可能。一个易于学习的通用框架，而且，易于找到理解它的新员工，是一件好事。


    可以使用 CMP 就请使用它们。长远来看，它们会让你的生活变得更容易。


    # 实体豆和数据库表之间应该有一有一一的关系吗？


    在自上而下和自下而上的映射中，创建 CMP 极其简单。我可以让开发工具指向数据库，并在几分钟内创建数百个 CMP——数据库中的每个表一个。就这么简单。事实上，它太简单了。


    实体豆是资源密集型的，随心所欲地使用它们会让你的应用程序运行极其缓慢。


    # **对于 EJB，有效使用就是极少使用。**


    当你使用实体豆时，确保你真的、真的、真的需要实体豆提供的功能。这些功能包括安全性、多线程访问和事务完整性。不要仅仅你需要一个简单的面向对象的关系型数据库组件模型就使用实体豆。


    > “实体豆通常是过度设计的。”


    存在如 Hibernate 和 Java Data Objects (JDO) 这样的框架；当你只需要一种面向对象的方法数据库访问方法时，EJB 往往是过度设计的。如果你在更新数据库时不需要
    EJB 的所有功能，请查看实体豆的一些替代方案。


    谈到 EJB，有效使用就是极少使用。这应该是你们企业级开发者的座右铭。


    '
