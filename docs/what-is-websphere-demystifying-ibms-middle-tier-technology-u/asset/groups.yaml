    but with the portal, it is implicitly built into the framework.


    # How does the portal enhance the J2EE security framework?


    Along with the highly customizable and pluggable nature of the framework, a portal
    also provides a much more granular level of security when compared to a typical
    J2EE application.


    While a user has the ability to add and remove portlets from a page, an administrator
    can restrict which portlets a user actually has rights to view.


    Furthermore, an administrator can set up a portal page and lock parts of the page,
    restricting a user’s ability to remove certain portlets from a page.


    An administrator can even restrict how a user accesses a portlet.'
  - '[PAGE 257]


    # What are portlet modes?


    A portlet has three modes, view, edit and configure.


    View mode runs when a portlet is displayed on a page. This is the default mode
    of a portlet.


    But a portlet can also be customized by a user. When a user customizes a portlet,
    such as providing income information to a tax portlet, a portlet is said to be
    in edit mode.


    Furthermore, a portlet can have global settings that are associated with all instances
    of that particular portlet, not just a specific user. When manipulating these
    global settings of a portlet, the portlet is said to be in config mode.


    An administrator can restrict a user''s access to each of these portlet modes.
    For example, all anonymous users can view the sports portlet, which displays last
    nights NHL scores. An authenticated user might be allowed to edit the sports portlet
    and have the portlet put the results of the user''s favorite hockey team towards
    the top of the screen. An administrator could be given config rights to the portlet,
    specifying the IP address of the server the portlet uses to actually get lasts
    nights sports scores.


    Whereas Servlet API only allows security to be applied to how a resource is invoked,
    namely through an http get or post invocation, the portlet API allows an administrator
    to secure how the portlet is used. This provides a much greater level of control
    to the administrator. The fact that all of this is done through a single, portal
    administrative console is a huge bonus.'
