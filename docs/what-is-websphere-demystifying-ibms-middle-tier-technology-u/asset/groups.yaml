    # Are there other options for managing session ids?


    WebSphere provides three mechanisms for tying a user to their session:


    +   * Cookies

    * URLRewriting

    * SSL ID tracking


    **Figure 13-2** Web provides three mechanisms for tracking session ids.


    Session tracking mechanism: [ ] Enable SSL ID tracking [x] Enable Cookies [ ]
    Enable URL Rewriting [ ] Enable protocol switch rewriting


    # What is URL rewriting?


    URL rewriting is a great session id mapping option because, unlike cookies, it
    can''t be turned off. This may sound appealing at first, but it is by no means
    a panacea for session id tracking.


    When you use URL rewriting, the unique session id of a client gets added to the
    end of every link on a web page. So instead of a user going to:


    +   * www.ibm.com/index.html go to:

    * www.ibm.com/index.html?sessionid=123xyz'
- md: '

    # Session Management


    As you can see, the user''s session id gets attached to the URL this is used when
    making a subsequent request back to the server.


    The good news is that by adding the session id to every link, URL rewriting always
    works and it can''t be turned off. The bad news? Well, the fact that the session
    id must be added to every link on every web page on every part of your website.


    ## How do you implement URL rewriting?


    How do you add that special id to the end of every URL or link a user might click
    on? Well, you have to encode the URL, which means writing Java code wherever you
    see a hyperlink, and turning every single page in your website into a JSP. After
    all, Java won''t work if it''s in a regular HTML page.


    So, implementing URL rewriting means extra work for the web development team,
    and it''s going to place a much greater load on your application server.


    Think about it. When you use URL rewriting, you can not allow your users to navigate
    to a single HTML page within your website.


    HTML pages are not dynamic, and if your user navigates to a static HTML page,
    their session id will be lost. If you have a significant amount of static html
    content, your application server is going to have the job of generating all of
    that static content and delivering it to the client with the session id embedded
    at the end of every internal link that might appear on the web page. That''s a
    lot of extra work for the server.


    # Chapter 13


    Figure 13-3 Session Management


    Managing sessions is an important part of WebSphere Administration.


    | General Properties | |

    |---|---|

    | Session tracking mechanism: | [ ] Enable SSL ID tracking<br>[x] Enable Cookies<br>[
    ] Enable URL Rewriting<br>[ ] Enable protocol switch |

    | Maximum in-memory session count: | 1000 sessions |

    | Overflow: | [x] Allow overflow |

    | Session timeout: | ( ) No timeout<br>( ) Set timeout<br>30 minutes |

    | Security integration: | [ ] Enable |

    | Serialize session access: | [ ] Allow serial access<br>Maximum wait time: 5
    seconds<br>[x] Allow access on timeout |


    ## How does URL rewriting effect the client?


    URL rewriting makes client side navigation much less pleasant.


    Imagine a user is about to buy a big ticket item off your website, but just before
    they do, they go to yahoo.com to check their stock portfolio. After seeing how
    well their IBM stock is doing, they then type in your web site address to make
    their purchase, only to find out that all of the information they had provided
    about their big order has been destroyed. That has happened because when they
    typed your address into the browser, there was no reference to your session id.
    If you were using cookies, your client wouldn''t run into this problem.


    ## What is Secure Socket Layer (SSL) encoding?


    Because SSL creates a unique id to encrypt all interactions between the client
    and the server, the application server can piggyback off this SSL id to keep track
    of the client''s session id.


    The two drawbacks to using this is the fact that SSL must be enabled, and the
    fact that SSL encoding is only supported by the IBM Http Server (IHS) and the
    SunOne web server.


    If you have a highly secure website, this might be a very feasible option for
    maintaining session ids. Furthermore, we''ll probably see more web servers supported
    in the future.


    ## What is Session affinity?


    The J2EE spec requires an application server to implement session affinity, also
    known as ''sticky sessions''.


    Implementing workload management means setting up multiple Java Virtual Machines
    that can handle client requests. In a workload-managed environment, if a client
    requests a JSP or a Servlet, there may be several JVMs capable of handling the
    request.


    Session affinity states that when a server/JVM creates a session for a user, every
    subsequent request from that user must be directed back to that server or JVM
    that initially handled it. A user is tied to the server that created their session,
    thus the term ''sticky sessions.''


    # Chapter 13


    Managing session data is quite a big job for the application server. Ensuring
    that a user is always sent to the JVM that created the user’s session makes sure
    that session data can be pulled out of memory quickly and efficiently.


    ## What are the implications of session affinity on workload management and failover?


    According to session affinity, if a JVM holding a given user’s session information
    goes down, all of that user’s session information is lost. It’s kinda weird that
    they’d have something in the J2EE spec that seems to work against the whole idea
    of workload management and failover, but believe it or not, it’s in there.


    ## How can we provide session failover with WebSphere?


    Fortunately, our beloved WebSphere goes over and above the the spec by providing
    several options for persisting a session beyond the JVM in which it was created.
    The two supported mechanisms for providing session failover include:


    - Memory to memory session replication

    - Database persistence


    Until WebSphere 5, using a centralized database to store session information was
    the only option available for persisting sessions. By and large, persisting sessions
    works pretty well.


    # Session Management


    ## How do persistent sessions work?


    The basic idea behind persistent sessions is that whenever a session is created,
    the application server writes the session id to a special ''session database.''
    Any information subsequently stuffed into a users session gets added to the persistent
    session database.


    If the server that initially created the users session fails, any other server
    in the cluster can pick up from where the failed server left off. If one JVM goes
    down, any alternate server can look up the client''s information in the session
    database using the session id that gets passed back to the server through the
    client''s cookie. A redundant server can then pull any required session information
    out of the central persistent database. Any problems on the server are completely
    transparent, and if something does go wrong, the client never knew there was a
    problem.


    Of course, this scenario isn''t without its drawbacks. First of all, persisting
    sessions requires quite a few database writes, which is resource intensive. Persisting
    session information to a database is going to to slow your applications down a
    tad.


    Furthermore, the database becomes a central point of failure itself. If maintaining
    a robust application server is important to you, you better either use db2, which
    we all know never fails, or else cluster your database servers.


    ## What is ''memory to memory'' session replication?


    If persisting sessions to a centralized database isn''t up your alley, WebSphere
    5 presents a new option for session failover: memory-to-memory session replication.


    # Chapter 13


    The idea behind memory replication is that if servers are clustered to support
    an application, you can configure the application servers in the cluster to pass
    session information back and forth from one JVM to the other. Each application
    server keeps a copy of the session data being used by the other servers in the
    cluster.


    Memory to memory session replication is said to be more efficient than writing
    to a centralized database, although it does present a few potential bottlenecks
    itself.


    ## What are the drawbacks of memory to memory session replication?


    Memory to memory replication does indeed have its drawbacks. First of all, network
    traffic may become large if session information is being replicated across a large
    number of application servers.


    Secondly, a significant amount of memory is going to be consumed in order to implement
    session failover.


    For instance, imagine you have five servers, and each server maintains a gig of
    session data. That gig must be replicated on each of the other four servers, so
    each server would need five gigs of memory – one gig for current session data,
    and four gigs of failover data for each of the four servers in the cluster. That’s
    a lot of memory!


    Of course, those clever sausages at WebSphere do provide a mechanism to address
    the memory and network traffic dilemma presented by memory-to-memory session replication.

    '
