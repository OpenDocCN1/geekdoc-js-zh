    ## WebSphere 的各种类型


    ## 什么是网络部署管理器？


    WebSphere 的基础安装虽然很棒，但如果没有从系统故障中恢复的能力，就不会有太多人对其感兴趣。如果你想实现工作负载管理架构，你就必须安装网络部署管理器（Network
    Deployment Manager）。


    网络部署管理器，也称为网络部署工具、dmgr，甚至直接称为部署管理器，是一个与基础安装完全独立的安装程序，它可以存在于你网络上的任何一台计算机上。


    网络部署工具可以安装在与基础安装相同的同一台计算机上，也可以安装在一个干净、纯净的计算机器上，这台机器上只有操作系统以及已配置好的所有所需的补丁包（fix
    packs）。


    ## 部署管理器是如何工作的？


    在安装部署管理器之后，dmgr 在 WebSphere 管理员的帮助下，寻找那些对新安装的部署管理器一无所知的的基础安装。




    通过从基础安装的 `bin` 目录调用 `addNode` 命令，或者通过使用部署管理器的管理控制台连接到正在运行的基础安装，部署管理器本质上是“催眠”了一个独立运行的基础安装，随后指示该基础安装加入部署器的域（domain），并从联邦（federation）开始及以后从部署管理器获取所有未来的配置更改和更新。


    ## 第 15 章


    > 部署管理器就像一个带有威胁的 WebSphere 母舰，寻找独立的基础安装，然后将这些基础安装联邦到一个公共的管理域中。


    ## 网络部署工具可以管理多少个基础安装？


    部署管理器可以添加任意数量的节点。一旦这些独立的基础安装完成联邦，部署管理器就变成了一个单一的中央管理点。


    由单个部署管理器管理的所有 WebSphere 安装（包括部署管理器本身）统称为管理单元（cell）或公共管理域。


    ## 部署管理器如何存储单元的配置数据？


    WebSphere 5 网络部署管理器维护管理域配置数据的方式与 WebSphere 之前的版本有很大不同。部署管理器将整个单元的所有配置数据存储在位于本地文件系统的
    xml 文件中。


    WebSphere 3 和 4 将所有配置信息维护在中心式的、符合 JDBC 标准的数据库。。，中心式数据库在 WebSphere 架构内部引入了单点故障，同时也带来了潜在的性能瓶颈。


    WebSphere 决定在部署管理器的文件系统上以 xml 格式存储配置数据，然后将这些更改推送到基础安装


    ## WebSphere 的各种类型


    是一种稳健的实现，它消除了中心式数据库作为瓶颈和单点故障。


    在网络部署管理环境中，当其中一个 WebSphere 基础安装的配置需要更改时，必须通过部署管理器进行更改。部署管理器将这些更改写入其本地文件系统上的 xml
    文件中，并将更改推送到单元内的各个基础安装节点。在部署管理器和基础安装之间传输配置数据被称为*同步*（synchronization）。


    ## 如果部署管理器宕机会发生什么？


    部署管理器的另一个特点是它没有 24/7 全天运行的要求。如果部署管理器宕机，对运行在基础安装上的应用程序没有负面影响。这归因于部署管理器仅用于更改单元的配置。


    部署管理器不处理、提供或响应客户端请求。如果部署管理器宕机，将无法对管理单元进行配置更改，但只要你那些辛勤的基础安装仍在运行，应用程序将继续不受中断地运行。基础安装负责响应基于的请求，而不是部署管理器。


    部署管理器不运行任何基于 Web 的应用程序或资源（如 JSP 或 Servlets），它也没有设计用于托管企业 Java Bean（Enterprise
    Java Beans）。部署管理器仅接受来自


    ## 第 15 章


    来自管理员的配置更改，并将这些更改推送到单元内的 WebSphere 基础安装。


    ## 什么是节点代理（node agent）？


    当基础安装被“联邦”到域时，一个名为节点代理的休眠进程会变为激活。节点代理是一个运行在基础安装上的 java 进程，它与部署管理器通信，接收配置更新，随后将这些更新写入其本地的
    xml 文件集中。


    配置更改通过部署管理器进行。当基础安装启动时以及在预定义的间隔期间，运行在基础安装上的节点代理将与部署管理器通信并接收更新或配置更改。这些配置更改随后会被集成到基础安装的运行环境中。


    ## 联邦基础安装与非联邦基础安装有什么区别？


    非联邦基础安装在单一、孤独的 Java 虚拟机（JVM）上运行支持 J2EE 规范的所有服务。当一个节点变为联邦时，一个新的名为节点代理的 Java 虚拟机就会变为激活。非联邦基础安装不维护激活的节点代理。


    此外，在基础安装上可能配置的任何消息基础设施，在非联邦基础安装变为联邦时，将作为一个独立的 JVM 被提取出来。


    非联邦基础安装在单一 Java 虚拟机内运行所有 J2EE 组件，并提供 J2EE 规范所需的所有和服务协议。


    基础安装在单一 JVM 上运行所有 J2EE 服务和组件。在联邦域中，多个 Java 虚拟机可以协同工作，以支持 J2EE 应用程序所需的管理和运行环境。


    ## 节点到底是指什么？


    当我们思考节点时，通常认为的是单台物理计算机。。即使我们打开一本关于 WebSphere、网络或开发的书，任何涉及节点的图表通常指的单台物理机器。这在 WebSphere
    中并非如此。


    对于 WebSphere 来说，节点指的是一个软件的安装。


    例如，你可以在计算机上安装基础版，然后带着部署管理器的磁盘也安装在同一台机器上。在这种情况下，会有两个 WebSphere 节点：一个代表部署管理器，一个代表基础安装。


    你甚至可以将基础版安装到文件系统的两个不同目录下，并同时启动这两个安装，你实际上在单台计算机上运行了两个基础版节点。因此，节点本质指的是 WebSphere
    软件的安装，而不是单台物理机器。


    ## 第 15 章


    ## 你真的可以在同一台机器上安装两个基础版本吗？


    两个基础版本可以在同一台物理机器上很好地共存。事实上，一个常见的场景是在单台计算机上拥有两个基础版本和两个部署管理器。在这种场景下，一个网络部署/基础组合代表测试配置。另一个网络部署/基础配置代表预生产环境。


    一台强大的 IBM 硬件可以轻松地用作测试和预生产环境，而且通常这就是 WebSphere 开发和测试环境的配置方式。


    应该提到的是，为了支持这种配置，有一些端口冲突需要解决。当单台机器上安装第二个节点时，WebSphere 会尝试重新配置尽可能多的端口，尽管个人经验表明，某些端点必须进行微调才能协调工作。正确配置这种这种场景可能需要一天时间，但如果你有硬件支持它，那是非常值得的。


    ## 应该把 WebSphere 安装到 C:\Program Files\WebSphere 吗？


    C:\Program Files\WebSphere 是 Windows 机器上 WebSphere 服务器的默认安装目录。我不喜欢。


    在大多数情况下，你永远永远不应该质疑 WebSphere 或任何随它的文档。如果在安装过程中，WebSphere 告诉你上是关的，


