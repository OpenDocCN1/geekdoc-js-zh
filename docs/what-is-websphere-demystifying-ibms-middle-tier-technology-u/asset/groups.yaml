    # What is Secure Socket Layer (SSL) encoding?


    Because SSL creates a unique id to encrypt all interactions between the client
    and the server, the application server can piggyback off this SSL id to keep track
    of the client''s session id.


    The two drawbacks to using this is the fact that SSL must be enabled, and the
    fact that SSL encoding is only supported by the IBM Http Server (IHS) and the
    SunOne web server.


    If you have a highly secure website, this might be a very feasible option for
    maintaining session ids. Furthermore, we''ll probably see more web servers supported
    in the future.


    # What is Session affinity?


    The J2EE spec requires an application server to implement session affinity, also
    known as ''sticky sessions''.


    Implementing workload management means setting up multiple Java Virtual Machines
    that can handle client requests. In a workload-managed environment, if a client
    requests a JSP or a Servlet, there may be several JVMs capable of handling the
    request.


    Session affinity states that when a server/JVM creates a session for a user, every
    subsequent request from that user must be directed back to that server or JVM
    that initially handled it. A user is tied to the server that created their session,
    thus the term ''sticky sessions.'''
