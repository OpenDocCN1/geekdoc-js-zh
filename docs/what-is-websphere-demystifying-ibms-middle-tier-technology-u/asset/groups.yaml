    WebSphere: Hey, WebServer?

    Web Server: Ya, what''s up.

    WebSphere: Hey, not much.

    Web Server: What can I do for you?

    WebSphere: Well, I know that you''re really great at serving up static files and
    all, but you''re going to get some crazy requests for JSPs and Servlets that I
    won''t be able to find on your file system.

    Web Server: Really? What am I going to do? I won''t be able to find any of these
    JSPs and end up sending a bunch of 404 errors to clients, and the clients will
    be pissed!

    WebSphere: Hey, calm down. Here''s what you do: just take those request and send
    them to me. I''ll handle the request, generate some HTML, give that HTML back
    to you, and you can send the HTML back to the client.

    Web Server: Kewl. You do the work, but the client thinks it''s handling the request?
    I like this arrangement already. How do I make files to send to you though?

    WebSphere: Don''t worry. I''ll make a thorough list and write it down in a special
    file called plugin-cfg.xml. Just read that file every once in a while and keep
