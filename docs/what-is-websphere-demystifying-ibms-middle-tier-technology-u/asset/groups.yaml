    # What is J2EE?


    # Chapter 2

    What is J2EE?


    # The WebSphere Application Server

    is J2EE Certified. What is J2EE?


    A few years ago, it became quite evident that the

    standard Java development environment simply wasn’t

    equipped well enough to handle the needs of a modern

    enterprise environment. While the Standard Development

    Kit (SDK™) provided a solid foundation for Java

    development, it simply didn’t provide a conducive

    environment for developing distributed, enterprise

    applications.


    For that matter, it wasn’t that great at creating small

    applications that would run on a handheld device like a

    PDA (Personal Data Assistant) or a cell phone.


    So, the powers that be broke the Java world into three

    dinct segments:


    +   - Java 2 Standard Edition (J2SE™)

    - Java 2 Micro Edition (J2ME™)

    - Java 2 Enterprise Edition (J2EE™)'
