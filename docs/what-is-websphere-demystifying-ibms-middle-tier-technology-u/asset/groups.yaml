    \n# 配置资源引用和进行这些绑定工作量很大吗？\n\n管理员或应用程序组装器在部署前必须执行的额外配置确实包含了一些额外工作，但并不是巨大的负担。如果给定资源的运行时名称发生变化，这确实比挖掘代码并修复所有硬编码的\
    \ JNDI 名称引用要好得多。此外，WebSphere 管理员反正也没什么闲事做——他们喜欢这些额外的工作。\n\n# WebSphere 4 和 WebSphere\
    \ 5 之间的命名发生了什么变化？\n\n在 WebSphere 4 中，有一个中央命名服务，所有通用 WebSphere 域内的 JNDI 可寻资源都绑定到该服务。\n\
    \n由于有了单一的中心化命名服务，JNDI 命名异常极少发生。无论你的资源运行在哪个 JVM 上，你所需要做的就是连接到中心化命名服务（该服务可以任何应用程序服务器访问），提供相关对象的适当\
    \ JNDI 名称或资源引用，然后大功告成——资源就被找到了。\n\n# 中心化 JNDI 服务有什么缺点？\n\n这种被称为 JNDI 的、极其重要的 J2EE\
    \ 服务的中心化确实有其缺点。中心化命名服务的最大缺点是，如果该服务宕机，你的整个企业环境也就挂了。\n\n那么，像 IBM 这样的 J2EE 服务器厂商该怎么办？他们是应该拥有一个易于查找对象但作为性能瓶颈的中心化命名服务，还是应该拥有一个消除单点故障的分布式命名服务？\n\
    \nIBM 决定“两毒中选一种”，认为让开发者去追溯偶尔出现的 `NameNotFoundException` 比在 WebSphere 架构中存在单点故障要接受得多。WebSphere\
    \ 5 使用的是所谓的分布式命名系统。\n\nIBM 一直是故障转移和可扩展性的供应商，因此他们目前对 Java 命名和目录接口 (JNDI) 的实现倾向于更健壮的解决方案，这并不意外。\n\
    \n# 我们以前是如何用 WebSphere 4 解决远程绑定的 JNDI 资源的？\n\n在通用命名空间中查找 Java 组件是 WebSphere 长期以来解析\
    \ JNDI 名称的方式。事实上，在 WebSphere 之前的版本中，这个通用命名空间非常棒，因为域或单元中的所有 JVM 共享相同的命名空间。\n\n\
    如果我在一个节点上运行一个 EJB，并将一个 Servlet 部署在域内其他地方的机器上的多个 Java 虚拟机上，我的 Servlet 所需要做的就是连接到本地命名空间，使用\
    \ `java:comp/env` 查找资源引用，然后应用程序服务器就会处理将 EJB 解析到相应远程服务器上的相应 JVM。\n\n在 WebSphere\
    \ 4 中解析远程 EJB 是轻而易举的。\n\n# 我们如何使用 WebSphere 5 查找远程 JNDI 对象？\n\nWebSphere 5 引入了一种全新的命名机制，称为“拓扑依赖命名”。\n\
    \n正如前面提到的，WebSphere 5 的本地命名空间中的每个 Java 虚拟机都有自己的本地命名空间。虽然这个本地命名空间非常适合绑定到它的本地对象，但它默认不会解析绑定到其他应用程序服务器的对象。\n\
    \n为了便于解析在远程 JVM 上的对象，WebSphere 5 允许你进行 JNDI 查找，这包含了节点名称以及运行远程资源的服务器名称。要做到这一点，你使用“拓扑依赖\
    \ JNDI”。\n\n# 第 18 章\n\n# 拓扑依赖名称是什么样子的？\n\n假设有一个名为 `soccer` 的单元，以及单元中有一个名为 `worldcup`\
    \ 的节点。对于运行在名为 `germany01` 服务器上的 `ejb/pulpjava/session/Timer`，拓扑依赖名称如下：\n\n```\n\
    cell/worldcup/servers/germany01/ejb/pulpjava/session/Timer\n```\n\n注意这个 JNDI 名称包含了节点名称、服务器和\
    \ EJB。\n\n# 使用拓扑依赖名称有什么优势？\n\n使用拓扑依赖名称，你将始终成功找到资源。由于你明确指定了运行资源的节点名称和服务器，因此在搜索时没有任何歧义。\n\
    \n拓扑依赖名称总是能够解析，因为查找通过本地命名空间重定向到适当的命名服务。\n\n# 使用拓扑依赖名称如何引用集群？\n\n将应用程序部署在多个 JVM\
    \ 上被称为集群。WebSphere 5 基础设施允许你指向服务器集群，而不是单个应用程序服务器实例。\n\n对于部署到名为 `england05` 集群的\
    \ `ejb/com/pulpjava/session/Timer` EJB，查找如下：\n\n```\njndi.lookup(\"cell/cluster/england05/ejb/com/pulpjava/session/Timer\"\
    );\n```\n\n注意查找中没有提到服务器，只有集群。该查找可能会解析到参与集群的任何 Java 虚拟机上的 Timer EJB。\n\n# 我应该在代码中使用拓扑依赖名称吗？\n\
    \n拓扑依赖名称总是可以解析的，但如果你真的在代码中使用它们，那你一定是是喝醉了。任何在本应该是架构中立的应用程序中放置特定特定引用的人都应该挨受教育。\n\
    \n拓扑依赖名称使用了节点名称以及部署 J2EE 资源的服务器名称。在开发期间，你完全不知道节点和生产服务器将命名为什么什么——即使你知道，这些名称未来可能会更改。在代码中使用拓扑依赖名称是疯狂的。\n\
    \n正如在企业应用程序中设置资源引用以绑定 `java:comp/env` 名称一样\n\n"
