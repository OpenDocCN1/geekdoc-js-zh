    # Chapter 17

    Database Connection Pooling


    Session management is one of the most mission critical services the application
    server provides to our applications. Managing user centric data on the server,
    and tying that data to a web based client, makes it possible to create a Servlet
    and JSP application that maintains meaningful state over an http network.


    From a performance perspective, the session management features of a J2EE application
    server do not come for free. In fact, poorly managed sessions, or lazy programmers
    placing far too much information into an HttpSession, can ground your applications
    to a halt.


    Poorly managed HttpSessions are the second most common bottleneck in a J2EE application.
    What is the most common performance bottleneck in J2EE applications, you wonder?
    Bar none, poorly managed database connections represent the biggest performance
    bottleneck in a J2EE application.


    What is the best way to address the performance problem associated with database
    connection? The best solution is to use a connection pool, and manage that connection
    pool effectively.'
  - '[PAGE 189]


    # Chapter 17


    # What is a DataSource?


    From a J2EE perspective, a DataSource is just another name for a pool of database
    connections. For us, a DataSource is a connection pool, although the term can
    be applied to a pool of connections to a variety of back ends.


    # Why do we need to use DataSources?


    Connecting to a database, maintaining that connection, and then subsequently tearing
    that connection down is a highly resource intensive activity. Interacting with
    a database is one of the most significant performance cost your applications will
    have.


    > Performance specialist say that 80% of all performance gains can be achieved
    by fine tuning your use of database connections.

    of course, the same group of people also say that 80% of all performance gains
    are achieved by fine tuning the type of data you place into HttpSessions, so you''ve
    got to take these types of statements with a grain of salt.

    The point remains. Connecting to a database has a high cost associated with it.


    ![](img/a64fe132c0e172db17f8974af89bd4d4_189_0.png)


    With a typical J2EE application, almost every user is going to interact with your
    database at some point in time, and those interactions are likely going to be
    very short and to the point. The client will grab data from your database, surf
    your site for a while, and then maybe save some data to your database. But each
    client will by no means need a permanent or extended connection to your data.'
  - '[PAGE 190]


    # Database Connection Pooling


    # The Database Connectivity Problem


    Now here’s the problem: Setting up and tearing down database connections is extremely
    resource intensive.


    Instead of creating a new connection every time a client needs access to a database,
    a developer should set up a collection of connections. One hundred client may
    be able to service all one hundred clients with only ten database connections.
    To do this, we set up a pool of semi-permanent database connections, and when
    a client needs a connection, we just give them out of the collection.


    Rather than creating and destroying a database connection every time a client
    wants to access our database, we just create a small pool of connections, and
    grab a connection from the pool when a client needs one.


    Connection pooling is incredibly efficient, and it frees up a bunch of resources
    that can then be used to address all of the other bottlenecks in your application.


    # How do I create a connection pool?


    A few years ago, if you wanted to pool your database connections, you had to either
    write your own code, or download some code off the Internet that implemented pooling.
    You then used that connection pooling code in your applications.


    Of course, databases are very complicated things – far too complicated for us
    lowly Java developers to try and write connection pooling code for. In house connection
    pooling code is often poorly written, and connection code downloaded off the Internet
    usually results in stale connections and all sorts of other cryptic SQLExceptions.'
