  - '[PAGE 217]


    If your old applications did lookups on resources running on the same JVM, you
    should be okay. However, if your old applications used the common namespace to
    look up EJBs or other resources running on a different application server in the
    domain, then your applications will likely fail.


    When your component is in one JVM, and you are trying to resolve a resource that
    is bound to a JNDI server on another application server in the cell, a lookup
    on the local namespace will not work. If any of your old J2EE applications used
    the centralized naming service to look up remote objects, which is likely to be
    many, then they simply will not work.


    Again, in WebSphere 5, every JVM manages its own naming service. WebSphere 5 eliminates
    JNDI as a centralized, single point of failure, but it does introduce a huge NameNotFoundException
    headache when you are migrating your applications from version four to version
    five.


    # How do we resolve NameNotFoundExceptions when migrating from version 4 to version
    5?


    The good news is that a resource reference in a deployment descriptor of a WebSphere
    4 application can be reconfigured to map to a fixed name of a resource running
    on a WebSphere 5 application server. If the resource reference is reconfigured
    to point at the fixed name, java:comp/env lookups will work, preserving backwards
    compatibility between WebSphere 4 and WebSphere 5 naming implementations.'
  - '[PAGE 218]


    # Enterprise Naming with JNDI


    # Name binding seems like a lot of work?


    Binding abstract names to architecturally specific names indeed creates more work
    for the WebSphere administrator, but it’s worth it. And in in reality, it shouldn’t
    present a great deal of hardship for your administrative team.


    First of all, lookup names should have been abstracted out of applications, in
    the form of resource references, right from the start. Migrating older applications
    from one version of WebSphere to another should merely involve editing deployment
    descriptors, and perhaps the odd property file.


    Secondly, ‘code one way, deploy another’ should be a mantra, not a newflash. Forcing
    developers to abstract out the names they use in their applications, and allowing
    administrators to bind a name used in code to a living, breathing, EJB running
    on a server, improves flexibility and maintainability. Creating a namespace binding
    is a little extra work, but it pays dividends.


    I’m just looking up my components using a relative name like ejb/User and everything
    works fine.


    If you’re using direct JNDI lookups, you’re walking on eggshells.


    Purely relative names such as ejb/User will always work if you’re accessing a
    resource on the local server; However, as soon as you break your application across
    multiple servers, clusters, or change the deployment name of your EJB, you’re
    entering the environment of ouch.


    When all of your EJBs and Servlets are running on the same server, which might
    occur in a testing environment, relative names will work. If you move that same'
  - '[PAGE 219]


    application into a production environment, then you''ll be saying ''Hola'' to
    the cleaning staff as you chase you''re your JNDI exceptions.


    Plan ahead and use a combination of resource references and the persistent namespace.


    # What happens if my JNDI name or resource reference doesn''t resolve properly?


    If the naming service fails to resolve your JNDI lookup, you will enter the world
    of the NameNotFoundException, and in quite unremarkable fashion, your application
    will ground to a halt.


    Don''t fret though – you''re not alone. I don''t know how many developers who
    haven''t dedicated a weekend or two to debugging naming issues on an application
    server.


    Here are a few JNDI troubleshooting hints:


    +   * Your name is case sensitive, and my name is case sensitive. Extend the same
    courtesy to your JNDI bound objects. JNDI names are case sensitive.


    +   * Try to stick with lower case letters when naming your EJBs, nodes and servers.
    One lettered inconsistently will throw the lookup right off.


    +   * You should also notice that the name of the ejb is usually just the package
    name and the name of the home interface, all subfoldered under the ejb directory.


    +   * A common mistake is to do a lookup on the relative name “ejb/com.ibm.UserHome”
    The dot notation won''t work. Elements of the package name are delineated by Unix
    slashes, not periods.'
  - '[PAGE 220]


    # Enterprise Naming with JNDI


    # I''m still having trouble looking up my EJBs.

    Any pointers?


    Your best friend when having trouble looking up an EJB is the dumpsnamespace utility.
    The dumpsnamespace utility connects to the JNDI service running on your local
    sever and tells you exactly what is bound to the local namespace. Dumpsnamespace
    can provide information about objects bound to the persistent namespace as well.


    You can even provide an ip-address as an argument and connect to remote JNDI servers.


    Always be careful which sever and port to which you''re connecting when using
    a dumpsnamespace will go against port 2809 or 9809. Depending on how you''ve configured
    compatibility, your port number might vary by a digit here or there.


    Good luck. Chasing down NameNotFoundExceptions is never fun, but with patience
    and persistence, you''ll crack the naming nut that''s bothering you.'
- md: "\n# Chapter 19\nClassloading Solved\n\n## What is a classloader?\n\nJava applications\
    \ run on a Java Virtual Machine (JVM).\n\nOur J2EE applications run on a Java\
    \ Virtual Machine as well, after all, they are written in Java.\n\nIn the WebSphere\
    \ world, the JVM that our J2EE applications run on is often referred to as an\
    \ ‘application server,’ since it is responsible for serving our J2EE applications\
    \ up to clients. Under the covers though, an application server is nothing more\
    \ than a souped-up JVM running on the server.\n\nIf you are so inclined, you can\
    \ even monitor the JVM responsible for serving up your J2EE applications by bringing\
    \ up the Windows Task Manager and looking for the java.exe process that’s hogging\
    \ your memory and consuming all of your processor’s clock cycles. That’s the Java\
    \ Virtual Machine that enables your WebSphere applications.\n\nJ2EE applications\
    \ are written in Java, and JVMs have the job of running and executing the Java\
    \ code you have written.\n\nWhen a client calls a Servlet, or an EJB calls the\
    \ constructor of a JavaBean, compiled Java code, also as bytecode, must be loaded\
    \ and subsequently run on a JVM. Finding the appropriate Java bytecode file, and\
    \ throwing that bytecode onto a piping hot JVM is the job of a very special, and\
    \ extremely important component known as a classloader.\n\nClassloaders locate\
    \ Java bytecode files and load that Java bytecode on the JVM. Without a classloaders,\
    \ our J2EE applications simply would not work.\n\nImportant Java classes that\
    \ must be loaded onto the Java Virtual Machine in order to get our applications\
    \ to perform properly include:\n\n- classes that implement the basic Java runtime\
    \ environment such as java.lang.Integer\n- the code IBM has written to support\
    \ and implement the J2EE specification\n- EJBs and the JavaBeans they use to implement\
    \ complex business logic\n- all of the Servlets, JSPs and helper classes that\
    \ make our web based applications behave the way they should\n\nUnderstanding\
    \ how classloaders work is one of the most important aspects of WebSphere development,\
    \ packaging and deployment. Unfortunately, classloading is also one of the most\
    \ misunderstood aspects of J2EE development, leading to innumerable problems at\
    \ both runtime and design time. \n\nTo understand how the WebSphere runtime works,\
    \ you must have a good grasp of J2EE classloading.\n\n## What does a classloader\
    \ do?\n\nIf a Java class is invoked and needs to be executed on a Java Virtual\
    \ Machine, a special Java component, called a classloader, is used to find the\
    \ Java class of interest, pull that Java class off of the file system, and execute\
    \ the bytecode of that class file on the Java Virtual Machine.\n\nA classloader\
    \ is a special Java class file that is responsible for loading other classes onto\
    \ a Java Virtual Machine. While this may seem simple and straightforward, don't\
    \ get too cocky, 'cuz from here, things get really complicated.\n\nLife would\
    \ be simple if there was just one, monolithic classloader that did all of the\
    \ classloading, but life just isn't that simple. There are actually quite a number\
    \ of different classloaders that work together to locate and load Java bytecode.\
    \ If you want to package your applications properly, and avoid ClassNotFound,\
    \ you must be familiar with the many WebSphere classloaders.\n\nIf Java classes\
    \ are loaded by classloaders, and classloaders are Java components, who loads\
    \ the first classloader?\n\nThe old chicken and egg scenario, rearing its ugly\
    \ head. If classloaders are Java classes, and Java classes must be loaded onto\
    \ a JVM to run, how does the first classloader get loaded? It's a good question.\n\
    \nWhen a JVM starts up, a special chunk of machine code runs that loads the system\
    \ classloader. This special hunk of machine code is known as the null classloader.\n\
    \n## The Null Classloader\n\nThe machine code that initializes the system classloader\
    \ is the null classloader referred to as the null classloader because it is not\
    \ a Java class at all, as are all other classloaders. The null classloader is\
    \ platform specific machine instructions that kick off the whole classloading\
    \ process.\n\nAll classloaders, with the exception of the null classloader, are\
    \ implemented as Java classes. Something must load the very first Java classloader\
    \ to get the process started. Loading the first pure Java classloader is the job\
    \ of the null classloader.\n\nThe null classloader also takes care of loading\
    \ all of the code needed to support the basic Java Runtime Environment (JRE),\
    \ including classes in the java.util and the java.lang packages.\n\n## The System\
    \ Classloader: sun.misc.Launcher\n\nThe null classloader loads a true Java class\
    \ of type sun.misc.Launcher. The sun.misc.Launcher classloader prepares the Java\
    \ Runtime Environment needed by our application server.\n\nTruth be told, the\
    \ sun.misc.Launcher is actually made up of two inner classes that do the actual\
    \ classloading:\n\n- sun.misc.Launcher$ExtClassLoader (parent)\n- sun.misc.Launcher$AppClassLoader\
    \ (system)\n\nExtClassLoader is the parent of AppClassLoader. Of the two, the\
    \ inner class, sun.misc.Launcher$AppClassLoader holds the true title of system\
    \ classloader.\n\n## Classloading Solved\n\nQuite appropriately, the sun.misc.Launcher\
    \ is often referred to as the bootstrap classloader as well as the system classloader.\
    \ Any jars found in the jre/lib directory of the JRE (not the WebSphere lib directory),\
    \ will be loaded by the system classloader. The system classloader is tightly\
    \ integrated with the components that implement the Java Runtime Environment (JRE).\n\
    \nFrom within the WebSphere administrative console, you have the option of adding\
    \ Java files and resources to the WebSphere classloader. When you add libraries\
    \ to the WebSphere classpath, you are actually asking the system classloader to\
    \ load those classes when they are needed. Appropriately, the system classloader\
    \ is also known as the CLPATH.\n\nEnvironment Options\n- ws.ext.dirs\n- C:\\struts\\\
    PulpJavaExt\n- C:\\struts\\PulpClass\n\nThe system classloader is great at initializing\
    \ the basic Java Runtime Environment (JRE), but from a J2EE perspective, the system\
    \ classloader isn’t nearly as sexy as the WebSphere classloader.\n\n## WebSphere\
    \ Classloader: com.ibm.ws.bootstrap.ExtClassLoader\n\nWebSphere doesn’t want to\
    \ step on any toes when it starts loading the classes it needs. Rather than using\
    \ the system classloader, WebSphere uses its own classloader to load the J2EE\
    \ resources it needs.\n\nWhen the system classloader is finished initializing,\
    \ WebSphere takes over, kicking off its own classloader.\n\nThe WebSphere classloader\
    \ physically manifests itself as a Java class of type com.ibm.ws.bootstrap.ExtClassLoader\
    \ Whereas the system classloader loads resources that support the Java Runtime\
    \ Environment (JRE), the WebSphere classloader is responsible for initializing\
    \ the J2EE runtime environment.\n\nThe WebSphere classloader, also known as the\
    \ WebSphere extensions classloader, loads all of the classes and files located\
    \ in the lib directory of the WebSphere Application Server.\n\nFigure 19-2 The\
    \ WebSphere\\AppServer\\lib Directory\nThe WebSphere extensions classloader looks\
    \ for files stored in JAR files in the lib directory of the Application Server.\n\
    \n| | | | |\n|---|---|---|---|---|\n| lib | | exthelper.jar | ivjb35.jar | jmsserver1.jar\
    \ |\n| | | exthelperimpl.jar | ivt.jar | jmxc.jar |\n| | | ffdc.jar | lsworb.jar\
    \ | jmxext.jar |\n| | | filetransfer.jar | j2c.jar | jmxxx.jar |\n| | | hplwps.jar\
    \ | j2impl.jar | jrom.jar |\n| | | hplwps1.jar | j2int.jar | js.jar |\n| j2ee.jar\
    \ | | htmlhelper.jar | j2ee.jar | itaPrivate.jar |\n| JAR File | | httpsession.jar\
    \ | j2ee-validation.jar | itsPrivate.jar |\n| | | httpsessiondb.jar | jaaslogin.jar\
    \ | jython.jar |\n| | | httpsessionmtm.jar | jacl.jar | I0b2bxl.jar |\n| | | idl.jar\
    \ | jdom.jar | Improxy.jar |\n| | | ivjbfaceall.jar | jflit.jar | logutil.jar\
    \ |\n| | | ivjbase.jar | jmsserver.jar | ltext.jar |\n"
