    ## 类加载问题的解决


    即使开发者将此文件直接封装在设计用于使用该文件的 EAR 包中，`java.lang.Integer` 类的新实现也永远不会被任何类加载器加载。


    `java.lang.Integer` 类已经存在于空类加载器（null classloader）的类路径上，处于类加载层级的最顶端。因此，如果将这个修改过的
    `java.lang.Integer` 类新实现与 EAR 或 WAR 文件一起打包，该修改过的实现将永远不会被加载。无论部署了多少个带有欺造版 `java.lang.Integer`
    类实现的应用程序，只有由空类加载器加载的那一个会被使用。


    类加载层级提供了一种安全、一致且可靠的类加载行为。


    ## 类加载层级会引起问题吗？


    现在，当你正沉浸在 Java 类加载层级高效性的光辉中，请考虑以下替代场景：


    也许你的某位开发者完全失控了，痴迷于 XML，并在所有的 Web 应用程序中使用了最新、最强大的 Xerces XML 解析器。该开发者正确地将实现 XML
    解析器所需的文件封装在 WAR 的 `lib` 目录下，与所有需要使用 xerces 解析器的 Servlet 和辅助类放在一起。WebSphere 不应该在寻找这些
    Xerces-XML 解析器文件时有问题，对吧？


    嗯，开发者可能在开发工具中配置了一切使其运行“完美无缺”，但只要应用程序进入生产环境，就会产生各种：


    # 第 19 章


    关于弃用方法、不符合规范的类，甚至是某些被调用的方法实际上并不的错误。


    这就变得有趣了。🙂


    IBM 对 WebSphere Application Server 的实现依赖于大量的 JAR 文件和 Java 文件，其中许多文件来自 `xerces`、`xalan`
    和 `ant` 等常见的开源项目。


    如果你检查应用程序服务器的 `lib` 目录（即 WebSphere 扩展类加载器从中拉取类的目录），你会发现存在大量的 JAR 文件和 Java 类，这些类可能与你尝试使用市场上最新、最强大的技术发生冲突。


    在这种特定场景下，WebSphere 扩展类加载器正在加载它自己的、旧版本的 `xerces.jar` 文件。尽管已经将最新的 `xerces.jar` 文件放置在
    Web 模块的 `lib` 目录下，但开发者对最新 xerces 实现的任何调用都没有正常工作。应用程序服务器 `lib` 目录中的旧 `xerces.jar`
    文件优于在类路径层级中下方找到的任何 `xerces.jar` 文件。


    ## 当 WebSphere 从错误的 jar 文件加载类时，我该怎么办？


    在这种场景下，WebSphere `lib` 目录下的 `xerces.jar` 文件与 Web 模块 `lib` 目录下的 `xerces.jar` 文件之间存在冲突。当我们想要使用
    WebSphere 在后台使用的最新版本技术时，我们该怎么办？


    无论你做什么，都不要用最新版本替换 WebSphere `lib` 目录中现有的 JAR 文件。那会搞砸一切。


    但同时，你不能直接丢弃开发团队使用 Apache 最新框架所做的所有工作。


    所以现在的问题变成了：“使用最新版本 `xalan.jar` 文件进行的所有开发工作都白费了吗？”嗯，并不一定。


    虽然“父类优先”（parent first）是默认的类加载行为，但 WebSphere 允许你配置类加载器采用“父类最后”（parent-last）类加载配置。


    ## 什么是“父类最后”类加载？


    在每个类加载器级别设置的“父类最后”配置，指示类加载器在将任务交给父类之前先在本地查找资源。在“父类最后”配置下，只有当所要求的 Java 文件不在自身的本地类路径上时，类加载器才会最后委托给父类。


    如果你的开发者一直在使用最新版本的 xerces，但 WebSphere 使用的是位于其 `lib` 目录中的旧版本，你可以配置 Web 模块（甚至是 EAR）的类加载器，使其在查找要加载的
    Java 文件时使用“父类最后”配置。


    # 第 19 章


    ## 表 19-2 类加载器层级


    | 类加载器 | 目的 | 默认范围 |

    | --- | --- | --- |

    | null classloader | 初始化 Java 运行环境的码 | 来自基础 Java 运行时库的类 |

    | System classloader sun.misc.Launcher | 加载基础 Java 运行时环境使用的类 | JRE 中 lib 目录下的类
    |

    | WebSphere Bootstrap Classloader ExtClassLoader | 加载 J2EE 和 WebSphere 运行环境 |
    WebSphere lib 目录 |

    | Security Classloader ProtectionClassLoader | 我认为是加载与安全相关的 Java 类 | 不确定 |

    | External Jar Classloader ExtJarClassLoader | 加载需要 PARENT_LAST 委托模式的常用类 | 应用程序的
    lib\app 目录 |

    | Non WAR Classloader CompoundClassLoader | 用于加载 ear 内部模块的文件，web 模块除外 | 此 CompoundClassLoader
    实例在 EAR 的所有非 web 模块中具有范围 |

    | Internal Jar Classloader JarClassLoader | 使 EAR 非 web 模块中的类对 web 组件可见 | 此 CompoundClassLoader
    实例在 EAR 的所有非 web 模块中具有范围 |

    | WAR Classloader CompoundClassLoader | 加载 WAR 中的找到 web 组件和 Java 代码 | EAR 内部的单个
    WAR 文件 |


    236


    当 Web 模块被配置为使用“父类最后”配置时，如果 `xerces.jar` 文件被放置在 WAR 的 `lib` 目录下，WAR 类加载器将首先从 Web
    模块拉取类，然后推迟交给 WebSphere 扩展类加载器。


    此外，当 WebSphere 本身需要 `xerces.jar` 的旧版本时，它会使用类加载器，它会查找自己的目录并找到旧版本。WebSphere 和 WAR
    文件将使用相同一组但不同的版本。


    ## 图 19-5 类加载器设置


    一个 ear 可以拥有模块或应用程序类加载策略。它也可以有 `parent_first` 或 `parent_last` 类加载模式。


    - 应用程序 设置


    应用程序：


    | Exam | 类加载器模式: PARENT_FIRST |

    | --- | --- |

    | ExamEJB.jar WAR 类加载器: | MODULE |

    | ExamWeb.war : | APPLICATION |


    ## 什么是模块或应用程序类加载策略？


    之前提到，web 模块默认使用 `CompoundClassLoader` 实例，该实例与 ear 中的其他模块是分离。这是 ear 的默认类加载策略，被称为模块中心类加载。


    # 第 19 章


    然而，你可以从模块中心类加载切换到应用程序类加载。通过此更改，ear 中的所有模块（包括 web 和 ejb 模块）将使用同一个类加载器实例。web 模块将不再获得独立的类加载器。应用程序类加载策略的影响是，任何模块都能看到
    ear 中任何其他模块的类。在模块中心类加载策略下，ejb 和工具类无法看到 WAR 内部的类。


    ## 如何在同一个 JVM 上加载两个版本的同一个类？


    人们很难理解在 JVM 上加载两个或多个不同版本的同一个类是可能的。这不仅可能，而且非常常见。


    类加载规则之一是，类加载器永远不会使用或访问由层级之类加载器加载的类。如果配置了“父类最后”的 web 模块加载了名为 `com.servlet.User`
    的类，然后应用程序类加载器或 WebSphere 类加载器被请求加载 `com.servlet.User` 类，只要在其类路径上可以找到该类文件（这与 web
    模块的类路径确实不同），就会将该类的另一个实例加载到 JVM 中。


    '
