    # What types of things can be configured in the deployment descriptor of the war?


    The deployment descriptor for the web module includes such things as


    +   - module level variables (ServletContext)

    - which Servlets should load on start-up

    - initialization parameters for a Servlet

    - how Servlets should be secured

    - error code mappings

    - lifecycle listeners

    - Servlet filters


    Many golden nuggets of configuration data are contained in the web.xml file, but
    by far, the most important part of the web deployment descriptor is the listing
    and mappings for the various Servlets that a web module contains.


    The deployment descriptor for the web module is read by the application server
    when the application starts, and the web.xml file describes to the web container
    how to manage the various web based resources contained within the war file.


    Since the web.xml file is read when an application starts, and only when it starts,
    it is important to note that any changes to your application that effects the
    deployment descriptor requires a starting and stopping of the application on the
    server. Essentially, the application must be taken offline for a moment, and your
    Servlets and JSP files are not capable of responding to client requests during
    that interval.'
- md: "\n# What type of extensions exist for a web module?\n\nAn IBM web module goes\
    \ beyond the specification by allowing an administrator to enable such things\
    \ as:\n\n- a default error page\n- file system reloading\n- enablement of directory\
    \ browsing\n- serving Servlets by classname\n- precompilation of JSP files\n\n\
    You can even use the IBM extension file to enable a file serving Servlet that\
    \ allows your application server to serve up html, pdf, zip or any other type\
    \ of non-java based file from your web server.\n\n# Why would you enable the file\
    \ serving Servlet?\n\nFor the most part, static content should be delivered through\
    \ your web server. Web servers are very efficient at serving up images, html files,\
    \ zip files, pdf files, etc.\n\n> \"Static content should be handled by the web\
    \ server\"\n\nYour application server should be used to serve up dynamic content\
    \ through JSPs, Servlets and other Java components that require a good deal of\
    \ logic.\n\nNow, having said that, there are times when you might be interested\
    \ in serving up static content through your web module, the most common reason\
    \ being security.\n\n# Exploring the EAR\n\nThe mechanism that secures Servlets\
    \ and EJBs does not extend itself to the web server. If you want to secure content\
    \ that resides on your web server, and make that content part of a single authorization\
    \ environment that integrates with the WebSphere Application Server, then you\
    \ have a problem.\n\nTo maintain a single authorization and authentication environment\
    \ between the web server and the application server, you will have to kindly ask\
    \ IBM to sell you another product, such as Tivoli Access Manager (TAM) or WebSeal.\
    \ Don’t worry, IBM is very helpful when it comes to selling you more middleware\
    \ products.\n\n# Figure 11-5 WebSphere Web Module Extensions\n\nIBM provides a\
    \ number of salacious extensions to the Servlet and JSP specification.\n\n# WebSphere\
    \ Extensions\n\n- General\n- Reloading enabled\n  - Reload interval: [ ] second(s)\n\
    \  - Default error page: [Browse...]\n  - Additional class path: [ ]\n- File serving\
    \ enabled\n  - Directory browsing enabled\n  - Serve servlets byclassname\n  -\
    \ Precompile JSPs\n  - Automatic Request Encoding enabled\n  - Automatic Response\
    \ Encoding enabled\n  - Automatic Filter Loading enabled\n\n# Chapter 11\n\nAn\
    \ alternative to buying products that create a single authorization environment\
    \ between your web server and your application server, is to move your static\
    \ content into your web module. You can then secure your web module and subsequently\
    \ secure the static content inside of it Static content then becomes the domain\
    \ of the security service of the WebSphere Application Server, and a common, single\
    \ authorization environment exists between your static and dynamic content.\n\n\
    # What is the implication of including static content in a war file?\n\nThe benefit\
    \ to packaging static content within a war is having your static and dynamic content\
    \ secured by a common security mechanism that doesn't involve any third party\
    \ products.\n\n# Table 11-1\nComponents that should reside on the Web and J2EE\
    \ Server\n\n| Web Server | J2EE Application Server |\n| --- | --- |\n| Markup\
    \ | Dynamic Content |\n| - HTML | JSPs |\n| - WML | Servlets |\n| Images | EJBs\
    \ |\n| - GIFs | JavaBeans |\n| - JPG | Web Services |\n| Documents | |\n| - PDFs\
    \ | |\n| - Word docs | |\n\nThe drawback to packaging static content in the war\
    \ is that you are now burdening your application server with the task of acting\
    \ like a web server. This may introduce significant performance and scalability\
    \ issues down the road.\n\nYour web server is incredibly efficient at serving\
    \ up static content. As as much as possible, we should let the web server do what\
    \ it does best, and keep static content away from the application server.\n\n\
    # Why might you serve Servlets by class name?\n\nOlder applications invoked a\
    \ Servlet by using the class name of the Servlet in the URL. Enabling the ability\
    \ to serve a Servlet by class name allows clients to call a Servlet by using an\
    \ address such as:\n\n```\nhttp://mncz.com/webmodule/com.myapp.servlet.MyServlet\n\
    ```\n\nYou might enable Servlets by class name in order to support older Servlet\
    \ applications. However, serving Servlets by class name bypasses the application\
    \ server's security service, opening a security hole that could easily be penetrated\
    \ by a clever hacker.\n\nMigrate your older applications as soon as possible,\
    \ and get out of the habit of serving Servlets by class name.\n\n# Should you\
    \ precompile your JSPs?\n\nPrecompiling your JSPs is a good idea. Doing will alert\
    \ you to any compile errors that exist within your JSP files early, and you can\
    \ then fix those problems before you slam head first into a runtime exception.\n\
    \nDon't get fooled into thinking that this will make your files run faster on\
    \ the application server though. Despite\n\n# Chapter 11\n\nprecompiling JSPs,\
    \ the application server will still turn any updated JSPs into a Servlet the first\
    \ time the JSP is encountered. The application server will then compile the Servlet\
    \ it creates, and load the Servlet into memory. Precompiling does not always sidestep\
    \ this behavior. Your mileage may vary, so it is important to test this behavior\
    \ on your own.\n\nPrecompiling JSPs won’t necessarily make your applications any\
    \ more responsive at runtime. It will alert you to any compile errors in your\
    \ JSPs though, which is indeed a valuable feature.\n\n# What is a jar file?\n\n\
    A jar is, once again, just a zip file with the extension to jar. It just sounds\
    \ so cute to say that we “package our JavaBeans in little jars.”\n\nWhen inside\
    \ an ear file, a jar file can be one of three types:\n\n- EJB jar file, containing\
    \ all the resources needed by the\n- client jar file, containing the code required\
    \ to run a standalone Java application\n- client jar file, simply containing the\
    \ deployment descriptor\n\nThe ear file de-jar file also contains a deployment\
    \ descriptor named application.xml.\n\n# What is so special about ejb-jar?\n\n\
    A jar is, once again, just a zip file with the extension to jar. It just sounds\
    \ so cute to say that we “package our JavaBeans in little jars.”\n\nThe deployment\
    \ descriptor also specifies whether an EJB is a message driven bean, entity bean\
    \ or a session bean. Again, this is the information application server needs in\
    \ order to properly manage the EJBs you created.\n\nThe ejb-jar.xml file describes\
    \ how to manage the. I guess that’s why they call it a ‘deployment descriptor.’\n\
    \n# Figure 11-6 Looking Inside an EJB.jar\n\nAll of your EJBs, along with any\
    \ deployment descriptors gathered together in the\n\n![image](img/a64fe132c0e172db17f8974af89bd4d_110)\n\
    \n# Chapter 11\n\nWhereas the deployment descriptor for a web module points to\
    \ the various Servlets the web module contains, you won't be surprised to discover\
    \ that the deployment descriptor for the EJB module points to.\n\n# Figure 11-7\
    \ WebSphere EJB Extensions\n\nWebSphere provides many tantalizing extensions to\
    \ the.\n\n-* WebSphere Extensions\nThe following are extension properties for\
    \ the WebSphere Application Server.\n\n| Session Timeout\n| --- | --- |\n| Timeout\
    \ integer | 1111 |\n| Activity Session Type | Container |\n\n| Bean Cache\n| ---\
    \ | --- |\n| Activate at | ACTIVITY_SESSION |\n| Load at | TRANSACTION |\n| Pinned\
    \ for | TRANSACTION |\n\n| Local Transaction 2.0\n| --- | --- |\n| Boundary |\
    \ BeanMethod |\n| Resolver | ContainerAtBoundary |\n| Unresolver action | Rollback\
    \ |\n\n# Locale Invocation\n| Locale location: SERVER |\n"
