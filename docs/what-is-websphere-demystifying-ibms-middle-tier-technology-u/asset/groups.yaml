    # Chapter 11


    ## What is a utility JAR file?


    Regular Jar files may also be included in the ear file. Java jar files placed
    in the ear simply contain Java code that might be shared between web modules and
    EJB modules.


    Utility JAR files are incredibly important because they make it possible for EJB,
    web and client modules to share the same set and version of Java classes. Common
    components used by EJB and web modules are packaged together in a regular JAR
    file that resides in the root of the ear file, alongside all of the client, web
    and EJB archives.


    Figure 11-8 Looking Inside an Utility Jar File


    Utility jar files aren''t nearly as sexy as war files and ear files. They simply
    contain reusable Java components, which I guess are kinda sexy.


    ![](img/a64fe132c0e172db17f8974af89bd4d4_113_0.png)


    112


    # Exploring the EAR


    ## Why might an ear file contain more than one web module?


    An ear file can contain any number of web and EJB modules. This begs the question,
    “should I deploy all of my web content in a common war file, or should I separate
    my web content into separate war files?”


    Well, application partitioning is an inexact science, but there are some rules
    we can follow.


    Take for instance a scenario where your enterprise application provides web access
    for both your human resources (hr) and accounting departments. Should this web
    application be separated into an accounting.war and an hr.war file, or should
    everything be packaged together into a single hraccounting war file?


    > When it comes to application packaging, there are no ''right answers.'' There
    are only ''wrong answers.'' The best we can do is try not to get the wrong answer.


    Here are a few important points to consider when developing, packaging and subsequently
    deploying an application.


    # The Session Problem


    Sessions, a mechanism for storing transient information about the client interacting
    with your website, are not shared across war files. If session information needs
    to be shared amongst hr and accounting modules, splitting your Servlets and JSPs
    across multiple war files is going to be a problem.


    # Chapter 11


    ## The Common ServletContext


    Servlets and JSPs can share information between each other by using a special
    scope named the ServletContext. If you are placing information in this ServletContext,
    such as the IP address of the accounting database, you probably don’t want your
    hr application to be able to access it.


    The ServletContext is not shared between war files. If you do not want one set
    of Servlets to see another set of Servlet’s ServletContext, you are going to have
    to separate the two applications into separate war files.


    # Forwarding to a JSP


    A common design pattern is to have a Servlet handle a request, and have that Servlet
    forward to a JSP for display. However, Servlets can only forward to JSPs packaged
    inside of a common war. You can use a special method called ‘redirect’ to send
    a user to a JSP in a different web module, but the redirection becomes a brand
    new request, and information about the initial request and response is lost.


    # Manageability


    Manageability of your applications must always be a prime concern. The cost of
    any application is not how much money is required to develop it, or the hardware
    required to run it, but is instead the cost of managing that application over
    the long-term.


    If the two applications you are packaging are large, separating them into two
    separate war files will make them much easier to manage. Modularity helps facilitate
    maintainability, and maintainability is good.


    WebSphere Deployment


    # Chapter 12

    WebSphere Deployment


    ![](img/a64fe132c0e172db17f8974af89bd4d4_116_0.png)


    Application deployment is easy, especially when an ear file has been assembled
    properly.


    With WebSphere, the art of deployment is essentially confirming that the names
    and bindings that are outlined in the various descriptors in the ear file are
    correct. Who knows, maybe an administrator will be required to associate an EJB
    with a connection pool, and then click finish, but if the ear is set up properly,
    that is as difficult as deployment should get.


    ## “Application Deployment is Easy”


    Now I''m sure that many a WebSphere administrator will cringe at that assessment,
    and surely managers will delight, but the fact is, when an ear file is assembled
    properly, preferably with WebSphere Studio Application Developer, deployment will
    indeed be easy.


    The tough part of WebSphere administration is configuring the environment within
    which the application will run. This includes everything from setting up connection
    pools and configuring message queues to managing a persistent JNDI namespace and
    binding the appropriate resource references. That’s the hard part!


    To deploy a simple J2EE application to WebSphere, that is, an application that
    doesn''t have huge dependencies on messaging or connection pooling, all you need
    to do is specify a Java Virtual Machine upon which the application will run and
    click ‘Finish.’


    115


