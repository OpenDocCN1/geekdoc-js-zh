    # Chapter 17


    To address both the good implementation of connection pooling, and the need for
    a good implementation of connection pooling, open source projects like Struts
    and Cocoon built connection pooling right into their framework. These implementations
    usually work pretty well.


    Of course, not everybody is using Struts and Cocoon, but every application certainly
    needs connection pooling, so the J2EE community brought the concept of connection
    pooling into the specification. Now, all J2EE compliant application servers must
    implement a connection pooling service that can be created and configured by an
    administrator, and subsequently accessed programmatically through the JDBC extensions
    API.


    # I am using WebSphere and Struts. Should I use the pooling facilities of Struts
    or WebSphere?


    While open source projects such as Cocoon and Struts provide connection pooling
    facilities, if you are using WebSphere, you really should be using WebSphere’s
    connection pooling service.


    First of all, connection pooling is a significant competition point as far as
    J2EE application servers go, and a big part of having the best J2EE application
    server on the market is having a very efficient connection pooling mechanism.
    IBM puts a lot of work into making their connection pools as efficient as possible.


    Secondly, if you are using a DB2 database, IBM has built all sorts of wizardry
    and magic into their DB2 connection pools. Believe it or not, IBM knows a lot
    more about DB2 than you, me, or even those clever cucumbers at open source projects
    like Struts and Cocoon.


    Thirdly, WebSphere monitoring tools such as Resource Analyzer can track WebSphere
    connection pools in much more detail than they can custom connection pools. Monitoring
    various properties of connection pools is pivotal in optimizing their configuration.


    Fourthly, if you have a problem with your WebSphere connection pool, you can get
    fast, quality support from IBM. This won’t likely be the case with open source
    connection pool implementations.


    Finally, you paid for WebSphere, so why not use it? IBM works pretty damn hard
    to get their connection pooling to work right. Take advantage of all of that hard
    work.


    # What is a JDBC provider?


    In order for WebSphere to connect to a database, it needs some software provided
    by the vendor that makes that database. This database connection software is known
    as a database driver.


    IBM provides a set of database drivers that makes it possible to connect to db2.
    These database drivers are zipped up in a file named db2java.zip. Oracle and Microsoft
    also provide drivers that make connecting to their databases possible.


    A JDBC provider states the name of your database driver, the type of database
    to which that driver connects, and where that driver is stored on your file system.


    Before you create a connection pool, you must first register a JDBC provider through
    which WebSphere can establish connections to your database.


    # Chapter 17


    Figure 17-1 Configuring a JDBC Provider


    A JDBC Provider simply describes a database driver, the implementation class,
    and where that class can be found.


    JDBC Providers >


    # DB2 Legacy CLI-based Type 2 JDBC Provider


    | General Properties | |

    | :--- | :--- |

    | Scope | |

    | Name | DB2 Type 2 JDBC Driver (XA) |

    | Description | DB2 JDBC2-compliant Provider |

    | Classpath | C:/SQLLIB/java/db2java.zip |

    | Native Library Path | |

    | Implementation Class | COM.ibm.db2.jdbc.DB2XA |

    | Apply | OK |


    # What properties can I configure for a connection pool?


    There is a lot more to connection pooling than simply configuring a DataSource
    in WebSphere, and then having your developers access that pool in their code.
    If you want to optimize performance, you must tweak your connection pool. Here''s
    a look at those tweakable parameters:


    # Figure 17-2 Configuring a Connection Pool


    A variety of parameters exist for configuring a connection pool


    # Connection Pools


    ![](img/a64fe132c0e172db17f8974af89bd4d4_194_0.png)


    # Minimum Connections:


    This setting is the lower limit on the number of connections that will exist in
    your pool. This is also the number of connections that will be created when the
    server starts up for the first time. Keep this number as low as possible, since
    lazy initialization, which implies initializing resources only when they are first
    needed, is a preferred design practice.


    # Maximum Connections:


    This is the maximum number of connections that can ever exist in the pool.


    You may have a license restriction on the number of connections your database
    can maintain. In that case, your maximum number of connections might equal the
    number of licenses you have.


    From a performance standpoint, you should have done some type of load testing
    on your database, and from this testing, come to a conclusion about what the maximum
    number of connections is that your backend can maintain before a significant degradation
    in performance is observed. The maximum connections parameter should then be set
    to this upper performance limit. After all, what’s the point of supporting one
    more user, if it destroys the experience of the thousand users already using your
    site?


    Developers should prepare for handling the exceptions that get thrown when the
    connection limit has been reached. When this happens, new users who require a
    database connection should be given a polite message about traffic being excessive.
    Politely ask them to come back later, and they will.


    # Unused Timeout:


    After a connection has splashed around in the pool for a certain amount of time
    without actually being used, it’s obvious that the connection isn’t needed anymore.
    The unused timeout setting dictates how long a connection can fool around in the
    pool before it’s told to towel off and go home.


    # Aged Timeout:


    Aged timeout is how long a connection can exist before it''s removed from the
    pool. The connection may be perfectly healthy when it reaches its aged timeout,
    but it will be destroyed regardless.


    Quite often, firewalls and proxies will have a maximum amount of time that a connection
    can exist through them. Setting the aged timeout to be less than the firewall
    or proxy timeout will help you avoid getting mysterious stale connections.


    # Reap Time:


    Reap time represents how often the connection pooling thread, the one that times
    out old connections and removes unused connections from the pool, will run.


    # Connection Timeout:


    If all the connections in the pool are in use, the connection timeout represents
    how long the DataSource will let a client wait for a connection to become available.
    If this time limit is hit, a ConnectionTimeoutException, a subclass of SQLException,
    is unapologetically thrown back to the client.


    # Purge Policy


    When a stale connection, or fatal connection error happens, you have the option
    of terminating the failing connection, or purging every database connection in
    the pool.


    # When accessing a connection pool, my developers are providing unique usernames
    and passwords. How does this effect pooling?


    This completely defeats the process of database pooling.


    All connections in a pool must have the same access rights associated with them.
    If you create a new connection with a different username and password, it will
    exist in its own separate pool. If every connection is given its own username
    and password, each connection is a pool unto itself.


    Be careful when using usernames and passwords to obtain connections from a DataSource.
    To track database access, using a logging mechanism would be a better option than
    matching each connection with a username and password.


    # How does a connection pool work?


    When your server starts up, the connection pooling service initializes a number
    of connections to your database; this is based upon the minimum number of connections
    specified in the DataSource properties window.


    Each time a client asks for a connection, the DataSource gives the client one
    from the pool. When a client is done with the connection, the connection is returned
    to the pool, rather than being destroyed.


    If the number of connections in use equals the number of connections in the pool,
    the DataSource throws an extra connection into the pool, just in case another
    client makes a request for one. The DataSource will keep throwing connections
    into the pool until the number of connections

