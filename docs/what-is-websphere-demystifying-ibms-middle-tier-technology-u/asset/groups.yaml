    # WebSphere 6 and Web Services


    # Chapter 21

    WebSphere 6 and Web Services


    # What’s new with WebSphere 6?


    After two or so years of fun trying to master the intricacies of WebSphere 5,
    IBM is giving the world an opportunity to learn their middle tier technology all
    over again, as they release their latest version of WebSphere, creatively branded
    WebSphere 6.


    Fortunately, the jump from WebSphere 5 to WebSphere 6 will not nearly be as significant
    as earlier WebSphere migrations.


    The fact is, J2EE and WebSphere have achieved a real level of stability. While
    the move from WebSphere 3 to 3.5, or even VisualAge for Java to WebSphere Studio
    was fairly traumatic, moving from WebSphere 5 to WebSphere 6 will be a relatively
    straightforward upgrade.


    After all, WebSphere has been J2EE compliant since version 3.53. For IBM, movement
    from one version of J2EE to another simply involves integrating a few new features
    into their tool, which IBM is getting quite good at.'
  - '[PAGE 261]


    # Chapter 21


    Once J2EE compliance is achieved, IBM then gets a whole boardat of time to improve
    the usability of their application server, which is exactly what they have done.


    Between the release of WebSphere 5 and WebSphere 6, IBM has fixed a large number
    of bugs, added a number of usability enhancement, and most significantly, improved
    the ability of an application server to recover from a failure. Whereas previous
    versions of WebSphere might take a few minutes to recover from a complete server
    failure, WebSphere 6 promises to recover in just a matter of seconds. This major
    tweaking can mean a savings of hundreds of thousands of dollars a year to transactionally
    heavy, mission critical enterprise applications.


    # How has the J2EE specification changed from WebSphere 5 to WebSphere 6?


    From a J2EE perspective, the most significant change from WebSphere 5 to WebSphere
    6 is the implementation of J2EE 1.4. Version 5 was J2EE 1.3 compliant.


    J2EE 1.4 moves the EJB spec to 2.1, the Servlet spec to 2.4 and the JSP spec to
    2.0.


    # What is new with the Servlet 2.4 and JSP 2.0 specifications?


    Servlets haven''t changed much over the last few years, after all, they work pretty
    damn good as they are. However, there are a few things about the Servlet spec
    that gets developers bitches.


    One of the biggest problems with Servlets is the whole mechanism of logging out
    a user from an application. The log out process has never been properly defined
    in the Servlet specification. Each vendor has implemented a


    260'
  - '[PAGE 262]


    slightly different mechanism for logging out a user, making portability difficult.
    With Servlet 2.4, there is finally a common semantic for logging users out of
    an application.


    The Servlet spec has also made it possible to garner more information about a
    user’s request, including information about the IP address of the client, and
    the IP and port of the web server that forwarded the request to the application
    server. All pretty minor stuff in the overall big picture, but it makes Servlet
    developers happy.


    Perhaps the biggest change in the Servlet API is the deprecation of the SingleThreadModel.


    By implementing the SingleThreadModel, a developer could turn the inherent threading
    mechanism of a Servlet off. This would be done to avoid those very difficult to
    diagnose threading problems.


    Of course, turning off threading in a Servlet has always been shunned, and quite
    frankly, it’s a pretty lazy and ineffective way to deal with problematic threading
    issues. While I’m all about being lazy, I like being lazy and effective, not ineffective.
    Personally, I’m glad to see the SingleThreadModel go. If you have threading issues,
    deal with them, don’t simply turn threading off and slow down your J2EE applications.


    The JSP 2.0 spec remains relatively unchanged from version 1.2, although a couple
    of exciting features have been added.


    A simple expression language that makes accessing collections inside a script
    much easier has been introduced.


    New features have also been added to simplify the creation of custom tags, but
    by and large, developing JSP view components remains business as usual.'
  - '[PAGE 263]


    # Chapter 21


    # What is new with EJB 2.1?


    In previous EJB versions, it was surprisingly difficult to write a J2EE component
    that could execute some type of processing at regular intervals. It was difficult
    to schedule calls to an EJB.


    EJB 2.1 introduces a simple yet powerful timer service that allows EJBs to be
    notified and then execute some type of logic at regular time intervals. The timer
    service is something EJB developers have been requesting for years.


    EJB 2.1 also adds a variety of features to the EJB Query Language, EJBQL. EJBQL
    is an object-oriented way of querying a database, but instead of using a reference
    to database tables, rows and columns, it references the name and properties of
    an EJB. The EJB container then translates these names into database tables at
    runtime. EJBQL makes EJBs much more portable, flexible and object oriented.


    EJBQL was new with EJB 2.0, so the various vendors could only agree on basic querying
    and updating functionality. EJB 2.1 adds a variety of new features to EJBQL that
    make it closer to a regular SQL. New features or calls include MAX, MIN, SUM,
    AVG and COUNT.


    EJB 2.0 introduced the Message Driven Bean (MDB) that interacted with a JMS messaging
    infrastructure. The MDB spec has now been abstracted out to allow for many more
    messaging implementations other than JMS. Messaging support on a J2EE application
    server continues to grow.'
  - '[PAGE 264]


    # Are there any other changes over and above increments to existing specifications?


    While many specs are being updated in J2EE 1.4, the biggest change is the integration
    of web services into the specification.


    # What are Web Services?


    Imagine an Estonian and a Cree Indian (North American Indigenous) were doing business
    together. Communication would be an issue, after all, not many Cree Indians speak
    Estonian, speak Cree. For the two to communicate, they would be best to try and
    learn a common language. If they were to be conducting business in the US, they
    might agree to use the common language of America — Spanish.


    So the Cree Indian learns Spanish, and the Estonian learns Spanish, and the two
    can communicate with each other. Furthermore, if anyone wants to jump into the
    conversation, all they have to do is learn Spanish, and they can contribute as
    well. Spanish becomes the common language for doing business.


    > Note: the language scenario for web services is by no means original. I just
    wish I could remember who related it to me I could give them credit for it.


    In the enterprise world of application development, J2EE isn''t the only middleware
    solution, although it is definitely the best. A variety of standard and proprietary
    middleware implementations exist, from new .NET implementations, to legacy CORBA
    infrastructures. In fact, as companies merge and grow, these diverse sets of systems
    often exist within the same company. Getting these different middleware solutions
    to communicate is a'
- md: '

    # Chapter 21


    problem after all, they don’t speak the same language – Web Services address this
    very issue.


    ## How do Web Services work?


    Web Services work by communicating with each other through text marked up in XML
    format. These XML text messages are transported across a network on a standard
    protocol called SOAP (Simple Object Access Protocol), which runs over http, the
    transport protocol of the Internet.


    A Web Service describes itself in a Web Services Language Definition file (WSDL).
    The WSDL file describes what a web service can do, and how text messages should
    be formatted when a client wants to invoke a Web Service on a server.


    For example, a credit card verification Web Service would have a WSDL file that
    would say something like this:


    > “Hey, I’m a Web Service named CreditCardChecker. If you want me to verify a
    credit card date and number, send me an XML message formatted like this:


    ```

    <number>### ### ### ###</number>

    <date>MM-DD-YY</date>

    ```


    If you give me an XML message marked up like that, I’ll give you response in XML
    format that looks like this:


    ```

    <valid>true || false</valid>

    ```


    You can just parse the XML for true or false to find out if the credit card is
    valid or not.


    “That’s it! I’m looking forward to hearing from you!!!


    Of course, this whole WSDL definition is in a structured, xml format, but you
    get the idea.


    ## WebSphere 6 and Web Services


    So, in order to create or use a Web Service, a component really only needs to
    be able to understand XML, and send a message over a network using the SOAP protocol.
    Supporting Web Services is a bit of work for some, but no more than teaching a
    Cree Indian and an Estonian to speak Spanish. 🙂


    Reading a WSDL file and parsing an XML message isn''t a lot to ask, considering
    that the payoff is the ability to communicate with any available Web Service on
    the Internet, regardless of its ‘behind the scenes’ implementation.


    ## Are there any drawbacks to Web Services?


    Web Services are slow.


    Imagine a Cree Indian and an Estonian speaking Spanish to each other. The Cree
    Indian is translating all Spanish words back into Cree in order to understand
    the Estonian. When the Cree Indian wants to say something back to the Estonian,
    she figures out what she wants to say in Cree, and then translates it into Spanish,
    sending a Spanish translation to the Estonian. These translations would really
    slow down the whole process.


    Of course, the Estonian is new to Spanish as well, so the same type of translations
    between Estonian and Spanish must take place.


    It would be very interesting being a fly on the wall when this conversation is
    going on – assuming you''re a fly that speaks Spanish that is.


    Web Services are equally slow – after all, XML must be parsed and reconstructed
    on both sides of the Web Services equation. Furthermore, Web Services will be
    passing text-based messages across a network, which is always a potential application
    bottleneck.


    Of course, the benefit is the fact that the Web Services are more effective than
    any other solution on the market for gluing together diverse architectures and
    implementations. If your problem is making a .NET application talk to you Enterprise
    JavaBeans, Web Services will solve your problems, and the performance issue will
    seem rather insignificant compared to the overall benefits.


    ## Why are Web Services so hot?


    IBM believes that they have the best middleware products on the market, and while
    I may throw out a sarcastic comment here and there regarding Big Blue, I believe
    them — especially with their WebSphere 6 offerings.


    But as great as IBM software and hardware is, there are plenty of companies out
    there that have invested heavily in non-IBM or even non-J2EE implementations,
    be it .NET, CORBA or a custom middleware infrastructure. It’s pretty hard to convince
    a company that has invested millions in .NET to spend millions more migrating
    to WebSphere and J2EE. For IBM, companies that are heavily invested in non-J2EE
    solutions are not likely going to be throwing much revenue IBM’s way, either now
    or in the future.


    But with Web Services, IBM can easily weasel their way into a .NET shop. Any .NET
    resource can easily be wrapped up in a Web Service, and WebSphere will be able
    to interact with it. A company wouldn’t have to throw away a .NET investment in
    order to adopt WebSphere. .NET and WebSphere could easily co-exist, leveraging
    the best of both technologies, and IBM could slowly migrate applications over
    to their amazing platform.


    ## WebSphere 6 and Web Services


    Of course, Microsoft has a similar philosophy. So does Oracle, WebLogic and all
    of the other middleware players.


    As far as Microsoft is concerned, if they can wrap up all of those J2EE applications
    with Web Services, and subsequently communicate with ease to use .NET framework,
    then an entire J2EE market will open up for them. The great thing about Web Services
    is that every vendor is jumping on the bandwagon and playing along. And it is
    great for clients as well, because Web Services makes it possible for a company
    to bring in a variety of different middleware solutions and take advantage of
    ‘best of breed’ scenario. Web Services also opens up the middleware market to
    all major providers. Competition between all misguided market types, and hopefully,
    the level of quality of the products on the market will greatly improve, with
    the best solution rising to the top. At least, that’s what Adam taught us.


    ## How does J2EE integrate Web Services?


    Java Specification (JSR) 109 describes the semantics through which EJB may use
    and interact with Web Services for the first time, incorporated into the J2EE
    specification. Of course, it should be noted that IBM has always had extensive
    support for Web Services. IBM has pushed the evolution of Web Services as much
    as, if not more than, any other vendor. Web Services is finally part of the J2EE
    specification, but this isn’t anything new for WebSphere. Web Services have been
    an important part of the game plan for a very long time. Web Services and WebSphere
    together make a powerful combination, enough to conquer the middle tier. Just
    wait and see.

    '
