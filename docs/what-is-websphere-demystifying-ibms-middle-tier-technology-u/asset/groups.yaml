    # Chapter 11


    An alternative to buying products that create a single authorization environment
    between your web server and your application server, is to move your static content
    into your web module. You can then secure your web module and subsequently secure
    the static content inside of it Static content then becomes the domain of the
    security service of the WebSphere Application Server, and a common, single authorization
    environment exists between your static and dynamic content.


    # What is the implication of including static content in a war file?


    The benefit to packaging static content within a war is having your static and
    dynamic content secured by a common security mechanism that doesn''t involve any
    third party products.


