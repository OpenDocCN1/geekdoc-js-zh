    # WebSphere Deployment


    With WebSphere 5, the administrator no longer needs to transfer files from one
    node to another. A built in file transfer process transports the enterprise archive
    associated with the application to each of the nodes participating in workload
    management.


    # Can I deploy an application to just one member or JVM in a cluster?


    Once you create a cluster of JVMs, you can no longer deploy an application to
    just one JVM in that cluster. With a cluster, it is all or nothing.


    However, there is nothing stopping an administrator from setting up another JVM,
    separate from the cluster, on which to deploy an application.


    # Can I do Workload Management (WLM) with the base installation?


    The base installation allows you to create multiple servers, but it does not provide
    any facilities for clustering. In order to implement horizontal or vertical scaling,
    you must purchase a license for the Network Deployment Manager. I’m sure IBM will
    be helpful if you ask to buy one.


    # Why isn’t there a button to start my server in the base installation?


    The base edition allows you to create as many ‘application servers’, meaning JVMs,
    as you want, but it doesn’t provide any facilities for staring them. I guess someone
    at the WebSphere labs really wants you to upgrade to the deployment manager.'
