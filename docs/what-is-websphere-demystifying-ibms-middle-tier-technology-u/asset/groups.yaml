    # What is a portal theme?


    A portal theme is a set of images and JSP pages that interact with the portal
    framework to generate the overall look and feel of the portal page.


    A portal theme determines how navigation links within the portal will be displayed,
    where a banner image or a footer graphic will be placed, and even the fonts and
    colors that will be used when a portlet gets displayed on a page is determined
    by the theme.


    A theme is designed and developed by a graphic artist, allowing a portal developer
    to focus on generating the content displayed by a portlet. The theme will determine
    how that content looks when it is displayed.


    This concept of a theme is a godsend, as it eliminates the time that gets wasted
    when Java developers are trying to figure out why an image or a link isn’t displaying
    properly. Images, graphics and navigation can all be factored out into the theme,
    which falls into the domain of your graphic artists and view specialists.


    # What is a portal skin?


    A portal skin is simply a border around a portlet. If you want to change how a
    portlet gets rendered on a page,


    252'
