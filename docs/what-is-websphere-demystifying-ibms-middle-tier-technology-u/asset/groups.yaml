    # Chapter 20


    A common functionality any organization might want to integrate into their portal
    environment might include the ability to create chatrooms, or perhaps instant
    message other users that are online.


    IBM provides a variety of sexy portlets known as collaborative portlets, or collaborative
    components that provide just such features, including people awareness, instant
    messaging and SameTime chatrooms.


    Along with providing this type of functionality through a number of collaborative
    portlets, IBM also exposes this functionality through a variety of collaborative
    programming APIs, so developers can use the collaborative infrastructure to incorporate
    people awareness and messaging into their own custom portal applications.


    The WebSphere Portal Server is an important part of IBM''s plan to conquer the
    middle tier. Looking forward, I really don''t envision any large WebSphere environments
    not incorporating portal functionality to a certain extent.


    The Portal simply provides far too much out of the box functionality to be ignored.


    # WebSphere 6 and Web Services


    # Chapter 21

    WebSphere 6 and Web Services


    # What’s new with WebSphere 6?


    After two or so years of fun trying to master the intricacies of WebSphere 5,
    IBM is giving the world an opportunity to learn their middle tier technology all
    over again, as they release their latest version of WebSphere, creatively branded
    WebSphere 6.


    Fortunately, the jump from WebSphere 5 to WebSphere 6 will not nearly be as significant
    as earlier WebSphere migrations.


    The fact is, J2EE and WebSphere have achieved a real level of stability. While
    the move from WebSphere 3 to 3.5, or even VisualAge for Java to WebSphere Studio
    was fairly traumatic, moving from WebSphere 5 to WebSphere 6 will be a relatively
    straightforward upgrade.


    After all, WebSphere has been J2EE compliant since version 3.53. For IBM, movement
    from one version of J2EE to another simply involves integrating a few new features
    into their tool, which IBM is getting quite good at.


    # Chapter 21


    Once J2EE compliance is achieved, IBM then gets a whole board of time to improve
    the usability of their application server, which is exactly what they have done.


    Between the release of WebSphere 5 and WebSphere 6, IBM has fixed a large number
    of bugs, added a number of usability enhancement, and most significantly, improved
    the ability of an application server to recover from a failure. Whereas previous
    versions of WebSphere might take a few minutes to recover from a complete server
    failure, WebSphere 6 promises to recover in just a matter of seconds. This major
    tweaking can mean a savings of hundreds of thousands of dollars a year to transactionally
    heavy, mission critical enterprise applications.


    # How has the J2EE specification changed from WebSphere 5 to WebSphere 6?


    From a J2EE perspective, the most significant change from WebSphere 5 to WebSphere
    6 is the implementation of J2EE 1.4. Version 5 was J2EE 1.3 compliant.


    J2EE 1.4 moves the EJB spec to 2.1, the Servlet spec to 2.4 and the JSP spec to
    2.0.


    # What is new with the Servlet 2.4 and JSP 2.0 specifications?


    Servlets haven''t changed much over the last few years, after all, they work pretty
    damn good as they are. However, there are a few things about the Servlet spec
    that gets developers bitches.


    One of the biggest problems with Servlets is the whole mechanism of logging out
    a user from an application. The log out process has never been properly defined
    in the Servlet specification. Each vendor has implemented a slightly different
    mechanism for logging out a user, making portability difficult. With Servlet 2.4,
    there is finally a common semantic for logging users out of an application.


    The Servlet spec has also made it possible to garner more information about a
    user’s request, including information about the IP address of the client, and
    the IP and port of the web server that forwarded the request to the application
    server. All pretty minor stuff in the overall big picture, but it makes Servlet
    developers happy.


    Perhaps the biggest change in the Servlet API is the deprecation of the SingleThreadModel.


    By implementing the SingleThreadModel, a developer could turn the inherent threading
    mechanism of a Servlet off. This would be done to avoid those very difficult to
    diagnose threading problems.


    Of course, turning off threading in a Servlet has always been shunned, and quite
    frankly, it’s a pretty lazy and ineffective way to deal with problematic threading
    issues. While I’m all about being lazy, I like being lazy and effective, not ineffective.
    Personally, I’m glad to see the SingleThreadModel go. If you have threading issues,
    deal with them, don’t simply turn threading off and slow down your J2EE applications.


    The JSP 2.0 spec remains relatively unchanged from version 1.2, although a couple
    of exciting features have been added.


    A simple expression language that makes accessing collections inside a script
    much easier has been introduced.


    New features have also been added to simplify the creation of custom tags, but
    by and large, developing JSP view components remains business as usual.


    # Chapter 21


    # What is new with EJB 2.1?


    In previous EJB versions, it was surprisingly difficult to write a J2EE component
    that could execute some type of processing at regular intervals. It was difficult
    to schedule calls to an EJB.


    EJB 2.1 introduces a simple yet powerful timer service that allows EJBs to be
    notified and then execute some type of logic at regular time intervals. The timer
    service is something EJB developers have been requesting for years.


    EJB 2.1 also adds a variety of features to the EJB Query Language, EJBQL. EJBQL
    was new with EJB 2.0, EJBQL is an object-oriented way of querying a database,
    but instead of using tables, rows and columns, it references the name and properties
    of an EJB. The EJB container then translates these names into database tables.
    EJBQL makes EJBs much more portable, flexible.


    EJB 2.1 adds a variety of features to EJBQL that make it closer to a regular SQL.
    New features or calls include MAX, MIN, SUM, AVG and COUNT.


    EJB 2.0 introduced the Message Driven Bean (MDB) that interacted with a JMS messaging
    infrastructure. The MDB spec has now been abstracted out to allow for many messaging
    implementations other than JMS. Messaging support on a J2EE application server
    continues to grow.


    # Are there any other changes over above increments to existing specifications?


    While many specs are being updated in J2EE 1.4, the biggest change is the integration
    of web services into the specification.


    # What are Web Services?


    Imagine an Estonian and a Cree Indian (North American Indigenous) were doing business
    together. Communication would be an issue, after all, not many Cree Indians speak
    Estonian, speak Cree. For the two to communicate, they would be best to try and
    learn a common language. If they were to be conducting business in the US, they
    might agree to use the common language of America — Spanish.


    So the Cree Indian learns Spanish, and the Estonian learns Spanish, and the two
    can communicate with each other. Furthermore, if anyone wants to jump into the
    conversation, all they have to do is learn Spanish, and they can contribute as
    well. Spanish becomes the common language for doing business.


    > Note: the language scenario for web services is by no means original. I just
