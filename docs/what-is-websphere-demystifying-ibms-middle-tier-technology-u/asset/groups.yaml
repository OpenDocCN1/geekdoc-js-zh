    # Enterprise Naming with JNDI


    # What does java:comp/env/ejb/Timer mean?


    Interpreting java:comp/env/ejb/Timer goes something like this:


    +   Using the connection to a JNDI server, connect to the common Java namespace
    (java:)

    - Look for a component bound to the common environment of the name service (comp/env)

    - Find, in the deployment descriptor of the calling resource, a reference for
    ejb/Timer

    - Resolve the resource reference – in this case:


    ejb/Timer (the resource reference)

    resolves to

    ejb/com/pulpjava/session/Timer


    +   - Return to the client a reference to the resolved resource


    # Where are resource references stored and configured?


    A resource reference is an abstract binding configured in the deployment descriptor
    of the J2EE module of the component that uses it.


    For example, if a Servlet uses a resource reference, the deployment descriptor
    for the web module it would contain the resource reference. If an EJB used a resource
    reference, the ejb-jar.xml file, which is the deployment descriptor for an EJB
    module, would contain the resource reference.'
