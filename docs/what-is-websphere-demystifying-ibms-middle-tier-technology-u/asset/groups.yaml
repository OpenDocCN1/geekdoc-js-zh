    ## Classloading Solved


    Even if a developer packaged this file right inside of an ear that was designed
    to use it, the new implementation of the java.lang.Integer class would never get
    loaded by any of the classloaders.


    The java.lang.Integer class already exists on the classpath of the null classloader,
    right at the top of the classloading hierarchy, so if this new, hacked implementation
    of the java.lang.Integer class was packaged along with an ear or war file, the
    hacked implementation would never be loaded. Regardless of the number of applications
    that might be deployed with a fraudulent implementation of the java.lang.Integer
    class, only the one loaded by the null classloader, would ever be used.


    The classloading hierarchy provides a secure, consistent and reliable class loading
    behavior.


    ## Does the classloading hierarchy ever cause problems?


    Now, while you are basking in the glow of the effectiveness of the Java classloading
    hierarchy, think about this alternative scenario:


    Perhaps one of your developers has gone hog wild, XML crazy, and has been using
    the latest, greatest version of the Xerces XML parser in all of their web applications.
    The developer correctly packages the files required to implement the XML parser
    in the lib directory of the war, right alongside all of the Servlets and helper
    classes that need to use the xerces parser. WebSphere shouldn’t have any problem
    finding these Xerces-XML parser files, right?


    Well, the developer may have configured everything to work ‘honky dorie’ in the
    development tool, but as soon as the application goes into production, all sorts
    of errors will be


    # Chapter 19


    be generated about deprecated methods, classes not conforming, or even that certain
    methods being invoked don''t actually exist.


    This is where things get interesting. 🙂


    The IBM implementation of the WebSphere Application Server relies on a boatload
    of JAR files and Java files, many of which come from common, open source projects
    such as xerces, xalan and ant.


    If you check out the ''lib'' directory of the application server, which is the
    directory the WebSphere extensions classloader pulls classes from, you''ll discover
    a plethora of JAR files and Java classes that just might conflict with your attempt
    to use the latest and greatest technologies on the open market.


    In this particular scenario, the WebSphere extensions classloader is picking up
    its own, older version of the xerces.jar file. None of the calls the developers
    are making to the latest xerces implementation are working properly, despite having
    placed the latest xerces.jar file right there in the lib directory of the web
    module. The older xerces.jar file in the lib directory of the application server
    trumps any xerces.jar file found below it on the classpath hierarchy.


    ## What do I do when WebSphere is loading classes from the wrong jar file?


    In this scenario, we have a conflict between the xerces.jar file in the WebSphere
    lib directory, and the xerces.jar file in the lib directory of the web module.
    What do we do when we want to use the latest and greatest edition of a technology
    that WebSphere uses behind the scenes?


    Whatever you do, do not replace the existing JAR file in WebSphere lib directory
    with the latest and greatest edition. That will hose everything.


    But at the same time, you can''t just throw away all of the work your development
    team has done using the latest and greatest frameworks from Apache.


    So the question now becomes: ‘has all of the development done using the latest
    version of the xalan.jar file been in vain?’ Well, not necessarily.


    Although ‘parent first’ is the default classloading behavior, WebSphere allows
    you to configure your classloaders to employ a ‘parent-last’ classloading configuration
    instead.


    ## What is ‘parent-last’ classloading?


    A ‘parent-last’ configuration, which is set on a per classloader level, instructs
    a classloader to look locally for resources before passing the job off to a parent.
    With a parent-last configuration, a classloader will only delegate to the parent
    last if the Java file in question is not on its own local classpath.


    If your developers have been working with the latest version of xerces, but WebSphere
    using the older version that sits in its lib directory, you can configure the
    classloader for the web module, or even for the ear, to use a parent last configuration
    when looking for Java files to load.


