    logged in. Using higher calculus, we could triangulate the elapsed time based
    on the current time and the time the user first entered over our site, which is
    stored in our TimerEJB. The timer would be a simple, yet perfect, stateful session
    bean.


    # What is a Stateless Session Bean?


    If you make eye contact with a session bean, and it is not a stateful session
    bean, then you are staring deep into the soul of a stateless session bean.


    A stateless session bean is a session bean that doesn''t possess any internal
    state.


    From a Java programming standpoint, a stateless session bean doesn''t contain
    any meaningful instance variables.


    > A stateless session bean has no instance variables


    From a user''s point of view, one instance of a stateless session bean is identical
    to any other instance of the same stateless session bean. Since there is no internal
    state to differentiate one stateless session bean from another, a client cannot
    tell the difference between one and another.


    A stateless session bean does have methods. A stateless session bean ‘does stuff,’
    but it doesn''t necessarily keep track of what it has done from one method invocation
    to another.


    You could think of a stateless session bean as a ‘task oriented’ component that
    can do something important for us, and when it is done, it is ready to do the
    same thing again for someone else. A stateless session bean doesn''t discriminate.'
