    # How does a portal facilitate application development?


    Rather than developing Servlets, as one would do if they were putting together
    a typical J2EE application, a portal developer develops something called a portlet.


    A portlet is similar in many ways to a Servlet. A portlet handles a request and
    must subsequently figure out how to respond. However, the big difference between
    a portlet and a Servlet is the fact that a portlet is responsible for rendering
    only a *small portion* of the web page that is returned to a client. Because the
    page that is sent back to a client is actually a combination of the output from
    many portlets, along with the inclusion of skins and a theme, the response a portal
    sends back to a client is usually referred to as a portal page.


    A portlet is given a small square on the overall page that is sent back to the
    client. The final page that gets aggregated and sent back to the client can be
    made up of many different and diverse portlets, some which might be completely
    independent, while others might actually interact with each other.


    The portal provides a very pluggable environment.


    # What is the benefit of developing portlets instead of Servlets?


    By only being responsible for a very small slice of real estate on the portal
    page, a portlet is forced to be highly focused and very specific in nature. Creating
    portlets is simplified by the fact that their purpose is very clear, and unlikely
    to be the victim of feature creep.


    Furthermore, with a portlet, the developer can be very focused on business logic
