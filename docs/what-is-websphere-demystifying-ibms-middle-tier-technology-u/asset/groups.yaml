    including how minimize and maximize buttons look, or how the border of a portlet
    is delineated, you can create and apply a custom skin.


    A skin is simply a collection of images and a JSP page that generates a table
    with three rows, with the top row displaying the title of the portlet, the middle
    row being the body, and the bottom row being a footer or trailer for the portlet.


    # How does the portal create a customizable environment?


    A portal developer develops portlets, and portlets are supposed to have a very
    specific function.


    For example, one portlet might tell you the weather in various cities that are
    important to you. Another portlet might tell you last night''s hockey scores.
    A third portlet might be designed to calculate your taxes based on your annual
    income. Portlets are intended to be very focused in their implementation, and
    having a clear requirement making developing portlets much easier.


    But a great thing about the portal is the fact that a user gets to choose which
    portlets appear on their portal page. The portal environment is extremely customizable.


    Using a very simple interface, a user can choose to have the weather, sports scores
    and taxation portlet all appear on the same portal page. All three portlets, although
    developed independently, can be easily aggregated together and displayed on the
    same web page.


    From there, a user can subsequently add, or remove portlets at will. The user
    has an incredible amount of control over which portlets display as they navigate
    through the portal.'
  - '[PAGE 255]


    # How does the portal facilitate a pluggable enterprise environment?


    While portlets are typically developed independently, the portal a framework provides
    facilities for unrelated portlets to communicate information back and forth to
    each other.


    For example, perhaps one portlet displays a user''s taxes based on their annual
    income. Another portlet could be configured to display how much a user could reduce
    their taxes based on retirement fund contributions. When a user changes their
    income using the first portlet, the second portlet can be messaged and subsequently
    update the information it provides.


    Furthermore, while the two portlets might communicate with each other when they
    exist on the same page, both would be able to work independently as well. So if
    a user removed the retirement savings portlet from the portal page, the taxation
    portlet would still work normally. This level of pluggability is simply not possible
    in a typical J2EE application. The portal is amazing.


    And beyond providing pluggable portlets that allow a user to customize their overall
    portal page navigation experience, portlets themselves allow for a very high level
    of customization.


    # What is a portlet edit mode?


    While a user can customize and configure which portlets will appear on a given
    portal page, a user can do further customizations by providing individualized
    information to an actual portlet.


    A user can individually customize Portlets. For example, if a portlet calculates
    how much tax a user owes the'
