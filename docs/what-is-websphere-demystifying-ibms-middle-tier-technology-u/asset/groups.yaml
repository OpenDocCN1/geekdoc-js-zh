    \ [Power Users] <br> Select from special subject: [EVERYONE] |\n| Role(s) | *\
    \ Administrator Configurator Operator Monitor |\n\n## Chapter 17\nDatabase Connection\
    \ Pooling\n\nSession management is one of the most mission critical services the\
    \ application server provides to our applications. Managing user centric data\
