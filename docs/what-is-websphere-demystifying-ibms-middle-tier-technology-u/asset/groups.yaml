    ## Chapter 12


    Any server created with the base edition can be started by going to the bin folder
    of the base edition’s install directory and running the ‘startServer’ command,
    while providing the case sensitive name of the server that was created using the
    admin console.


    ## You can combine horizontal and vertical scaling?


    Absolutely! If you wish to implement vertical scaling, and run four JVMs on a
    multiprocessor machine, and you also wish to concurrently take advantage of horizontal
    scaling by running an extra JVM on a second, less powerful machine, WebSphere
    provides all of the facilities you need to do this. In fact, it is no harder or
    easier than implementing horizontal or vertical scaling by themselves.


    ## Does creating a cluster automatically provide session failover?


    No. But you configure WebSphere to implement session failover, and when it’s configured,
    it works really, really well. Read on to learn to learn more!


    ## Chapter 13

    ### Session Management


    ## What is a Session?


    A session, or more accurately, an HttpSession, is probably the most important
    object in the entire Servlet API. Its importance cannot be understated.


    First of all, an HttpSession has nothing to do with a Session EJB, so let''s get
    that association out of your mind right away. It is a completely different monster.
    An HttpSession is a server-managed component completely independent of the EJB
    spec.


    ## The Session Issue


    Here’s the issue: the http protocol, the mechanism we use to surf the Internet
    and browse websites, is stateless. Once a Web server is done handling a client
    request, the web server completely forgets about what it just did, kinda like
    fish in Finding Nemo.


    The http protocol treats every request as a brand spanking new, unassociated request,
    regardless of how many client-server interactions may have happened with a particular
    client in the past.


    A web server, using the http protocol, doesn’t maintain any meaningful state with
    a client.


    ## Chapter 13

    ## What is the impact of a Stateless protocol on our Applications?


    A stateless protocol, such as http, causes all sorts of problems for our web-based
    applications. For example, if someone surfs to our site and sees a product they
    want to buy, we want to keep track of that information until the user decides
    to check out.


    Or perhaps a user is taking an online exam: we would want to keep track of every
    answer the user has provided. The http protocol provides no mechanism for keeping
    track of a user''s actions from one invocation to the other. That''s where the
    Servlet API, and more specifically, the HttpSession, comes in.


    ![](img/a64fe132c0e172db17f8974af89bd4d4_129_0.png)


    > Canada and the http protocol have one thing in common: they are both stateless.
    Canada has ten provinces and three relatively empty territories, but no states.
    Of course, they have been eyeing Michigan for a while.


    ## What is the purpose of the HttpSession?


    The HttpSession add state to a stateless, web based, interaction with a server.
    When a client makes a call to an application server, a Servlet developer can programmatically
    create and associate an HttpSession with that client. The session can then be
    used to keep track of all sorts of information about the user.


    If the user tells us their favorite color, we can store information in their session.
    If the user gives us their address and phone number, we can store that in their
    session. If they''re taking an online exam, we can put the answer to every question
    they''ve been given into the session as well. We can then go back into that session
    object, at any point in time, and pull that information out.


    So when a user is done taking an online exam, we can go into their session and
    find out which questions they got correct, and which questions they got wrong.
    If the client is picking books, or other products they want to purchase, when
    they click ‘check out,’ we can go into their session, process their order, and
    tell them how much their purchase will be.


    HttpSessions add state to a stateless protocol, and they are pivotal in making
    online applications work.


    ## How does WebSphere map a session to a client?


    So, we’ve got this miraculous component that creates a stateful experience out
    of a stateless protocol. The question is, how does WebSphere do it?


    Well, when an application server creates a session for a user, a crazy, unique
    number is generated that immediately gets associated with that user. Then, any
    time a developer puts information into a user’s session, the information is automatically
    associated with the client’s unique id. This all happens securely on the server.


    In order to tie a client’s browser to their session, WebSphere plants a transient
    cookie on the client’s. This transient cookie contains that crazy unique number
    that was generated when the user’s session was created.


    The cookie we place on the client machine contains the client’s unique session
    id. On every subsequent request made by the client to the server, the cookie containing
    the session id is sent back across the network, and Voila!, the server ties the
    user to their session.


    ## Chapter 13

    ## What is a transient cookie?


    WebSphere plants a transient cookie on the client machine through their web browser.


    A transient cookie is maintained in the memory of the browser, and will never
    actually be written to a textfile. All other types of cookies actually get stored
    persistently on the users hard drive.


    Because the cookie is resident in memory, when a client closes their browser,
    the cookie, and subsequently the client’s session, is lost.


    Some clients see cookies as a potential security loophole, although no evidence
    to support this claim has ever come to light. To appease the security conscious,
    users can configure their web browsers to accept transient cookies, but not cookies
    that actually get written to the hard drive. As a result, a transient cookie will
    allow sessions to be associated with more clients than using cookies that persist
    to a user’s hard drive.


    ## If cookies are turned off, will my applications stop working?


    Yes, if cookies are turned off, your WebSphere applications will stop working
    - with the default WebSphere configuration at least. Cookies are the preferred
    mechanism for storing the session id on a client machine.


    If your clients turn cookies off, your applications won’t work. This may seem
    detrimental to you architecture, but let me ask you a question: what are you losing
    if you can’t service clients that are afraid of cookies?


    The fact is, if a customer is afraid that a simple little textfile called a cookie
    is going to wreak havoc on their computer, then what are the odds that you are
    going to get that paranoid user''s email address, home address, or credit card
    number? I''d say the odds are somewhere between zero and negative none.


    A fear of cookies is irrational. You really shouldn''t worry about not being able
    to service these irrational clients.


    ## Figure 13-1 Viewing Cookies with Netscape Navigator


    WebSphere plants a cookie named JSESSIONID on the client machine.


    View and remove cookies that are stored on your computer.


    | Site | Cookie Name |

    |---|---|

    | google.com | PREF |

    | localhost | JSESSIONID |

    | netscape.com | sampler |

    | netscape.com | BCISP |


    Information about the selected Cookie

    Name: JSESSIONID

    Content: 0000OCHSDJHDPV3UFHC0H3ZBUA:-1

    Host: localhost

    Path: /

    Server Secure: no

    Expires: at end of session

    Policy: no policy about storing identifiable information


    ## Are there other options for managing session ids?


    WebSphere provides three mechanisms for tying a user to their session:


    - Cookies

    - URLRewriting

    - SSL ID tracking


    **Figure 13-2** Web provides three mechanisms for tracking session ids.


    Session tracking mechanism: [ ] Enable SSL ID tracking [x] Enable Cookies [ ]
    Enable URL Rewriting [ ] Enable protocol switch rewriting


    ## What is URL rewriting?


    URL rewriting is a great session id mapping option because, unlike cookies, it
    can''t be turned off. This may sound appealing at first, but it is by no means
    a panacea for session id tracking.


    When you use URL rewriting, the unique session id of a client gets added to the
    end of every link on a web page. So instead of a user going to:


    - www.ibm.com/index.html go to:

    - www.ibm.com/index.html?sessionid=123xyz

