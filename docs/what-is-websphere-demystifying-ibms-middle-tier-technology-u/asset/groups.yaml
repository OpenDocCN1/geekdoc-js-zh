    # I am using WebSphere and Struts. Should I use the pooling facilities of Struts
    or WebSphere?


    While open source projects such as Cocoon and Struts provide connection pooling
    facilities, if you are using WebSphere, you really should be using WebSphere’s
    connection pooling service.


    First of all, connection pooling is a significant competition point as far as
    J2EE application servers go, and a big part of having the best J2EE application
    server on the market is having a very efficient connection pooling mechanism.
    IBM puts a lot of work into making their connection pools as efficient as possible.


    Secondly, if you are using a DB2 database, IBM has built all sorts of wizardry
    and magic into their DB2 connection pools. Believe it or not, IBM knows a lot
    more about DB2 than you, me, or even those clever cucumbers at open source projects
    like Struts and Cocoon.


    Thirdly, WebSphere monitoring tools such as Resource Analyzer can track WebSphere
    connection pools in much'
