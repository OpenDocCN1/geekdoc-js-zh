    For example, if I have a banking application, my users would probably fall into
    the following abstract categories:


    +   - Customers

    - Tellers

    - Bank Managers

    - Auditors

    - Maybe even a system object that performs various repetitive functions


    If each of these groups has a unique level of access to different Servlets and
    JSPs in the application, then we must create corresponding ''J2EE roles'' in the
    deployment descriptor of the web module representing these abstract categories.
    The roles might also be define in the deployment descriptor of the EJB module
    as well. Heck, you could even make these roles globally available by defining
    them in the deployment descriptor of the ear.


    The point is, to configure J2EE security, you define in the deployment descriptors
    of the application the abstract roles people using your application will fall
    into. These definitions are in the deployment descriptor, not actually in any
    of your Java code, so if the roles or categorizations change in the future, the
    code shouldn''t be affected - only the deployment descriptors need to change.


