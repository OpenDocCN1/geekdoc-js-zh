    # WebSphere at Runtime


    # How do you stop a web server from trying to handle requests for your Servlets
    and JSPs?


    The key to stopping a web server from trying to serve up JSPs or Servlets, is
    to install something called the WebSphere Plug-in on the web server.


    The general idea, although not a hard and fast rule, is that before you install
    WebSphere, you should install your web server first. Even when you do a full installation
    of the Application Server, behind the scenes, WebSphere installs the web server
    first, and then installs the ‘WebSphere plug-in’ into that web server.


    ![](img/a64fe132c0e172db17f8974af89bd4d4_144_0.png)


    # Forwarding Servlet Requests to a J2EE Web Container


    What exactly does the web server plug-in do?


    As was stated earlier, the web server tries to handle every single request that
    it receives. However, when the WebSphere Application Server comes onto the scene,
    it introduces itself to the web server and has a conversation that goes something
    like this:'
