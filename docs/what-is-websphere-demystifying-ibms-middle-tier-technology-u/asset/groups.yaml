    # Classloading Solved


    You can also add files to the WebSphere classloader''s classpath by editing the
    WebSphere system property ws.ext.dirs.


    Since the com.ibm.ws.bootstrap.ExtClassLoader loads all of the classes required
    to support WebSphere and the J2EE specification, it is also known as the WebSphere
    bootstrap classloader, as it essentially bootstraps the WebSphere runtime environment.


    The WebSphere j2ee.jar file, which is pretty much the bytecode embodiment of the
    WebSphere Application Server, falls onto the classpath of the WebSphere extensions
    classloader. The ExtClassLoader pretty much loads WebSphere, and all of the peripheral
    components make WebSphere run.


    So, a null classloader kick starts the JVM, a bootstrap classloader loads classes
    needed by the basic Java Runtime Environment (JRE), and then WebSphere takes over,
    using the extensions classloader to invite all of its friends and family to come
    over and join in the fun.


    Table 19-1 Basic Classloader Hierarchy for WebSphere


    | Classloader Name | Implementation | Class Path |

    | --- | --- | --- |

    | Null classloader | Machine Code | JRE Binaries |

    | Classpath classloader or System Classloader | sun.misc.Launcher sun.misc.Launcher
    | jre\lib |

    | WebSphere Extensions Classloader | com.ibm.ws.bootstrap.ExtClassLoader | WebSphere\lib
    |


    # Chapter 19


    # The Application Classloader:

    com.ibm.ws.classloader.CompoundClassLoader


    Of course, our humble enterprise applications are by means the same level as the
    ominous JVM and the ever important WebSphere Application Server. Correspondingly,
    our early files are given their own humble little loaders, separate from that
    of the WebSphere Application Server (WAS) and the Java Runtime Environment (JRE).
    A special classloader, called the com.ibm.ws.classloader.CompoundClassLoader,
    loads the resources found packaged inside our EAR files.


    The CompoundClassLoader can pull classes out of all of the different modules in
    an ear file. By default, all utility Jar files, connector modules, and EJB modules
    will have their classes loaded by the same instance of a common classloader.


    Since all of the utility Jars, EJB and connector modules (notice that I didn''t
    say web modules) share the same classloader instance, files in one module of the
    ear will be visible to other modules in the ear. This is a manifestation of the
    fact that a classloader is entitled to pull classes out of any JAR on its classpath.


    # Web Modules and the CompoundClassLoader


    By default, web modules do not share the same classloader instance as the other
    modules inside of an ear. Web modules get their own, private instance of the CompoundClassLoader,
    which will only load classes that exist within the web module. War files have
    their own private classloader, ensuring none of the other modules can peek inside
    the war file for classes they might need.


    # Classloading Solved


    ![](img/a64fe132c0e172db17f8974af89bd4d4_230_0.png)


    The classloader instance used by the web module is a sibling of the instance used
    by the ear. As a result, a web module can see files inside other jars in an ear.
    However, other modules cannot see classes inside a war. Sibling classloaders can
    see classes on the classpath of an ancestor. An ancestor cannot see classes on
    the classpath of a sibling.


    # What is the classloader hierarchy?


    The picture I am trying to draw here is one of a crazy classloader hierarchy,
    with the null classloader at the top, the classpath classloader a little below,
    the WebSphere extensions classloader directly underneath, the application classloader
    residing under the WebSphere classloader, and a lonely web module classloader
    resting at the very bottom.


    In its simplest form, this is the classloader hierarchy for J2EE applications
    deployed to the WebSphere Application Server.


    # Which classloaders will load my Java classes at runtime?


    When a classloader, such as the CompoundClassLoader for a web module, looks for
    a Java file, where do you think it looks?


    Logically, you’d assume that the web module classloader would look in the web
    module for a given Java file or Servlet, wen’t you? Well, this type of foolish
    thinking is wrong, and has caused all sorts of deployment problems.


    By default, each classloader, with the exception of the ExtJarClassLoader, is
    set up with a ‘PARENT_FIRST’ configuration. A PARENT_FIRST configuration forces
    a


    # Chapter 19


    classloader to ask its parent to try and load a given Java class first.


    If a web module needs some chunk of Java code that is sitting right there in the
    \lib directory of the war, the web module classloader first asks its parent classloader,
    the application classloader, to find the Java class file.


    And what do you think the application classloader does when asked to load a Java
    class file?


    When the application classloader is asked to load a class, it delegates to its
    parent, the WebSphere extensions classloader, to see if it can find and load the
    file.


    By now, you can probably guess where the WebSphere extensions classloader goes
    before looking on its own local classpath for the file in question. Yes, it defers
    to the system classloader, which then defers to the null classloader. The null
    classloader then tries to find the Java class of interest on its own local classpath,
    and if it does find the file, it will load it on the JVM.


    # So, what happens when the system classloader can’t load the class you'' looking
    for?


    Of course, there’s a good chance that the Java class of interest will not be on
    the system or null classloader’s classpath. After all, why would you put a class
    required by your web module in the lib directory of the JRE upon which WebSphere
    runs?


    When we hit the top of the classloading hierarchy, the class-finding baton gets
    passed back down the ladder, one classloader at a time, opposite to the order
    in which the hierarchy was climbed.


    # Figure 19-3 Inverted Classloading Hierarchy for an EJB


    When loading EJB module classes, the CompoundClassLoader delegates to its parent
    opposed to the rules of classloading.


    Classloader for the EJB module:


    ```

    ++com.ibm.ws.classloader.CompoundClassLoader

    ++++com.ibm.ws.classloader.ExtJarClassLoader

    ++++++com.ibm.ws.classloader.ProtectionClassLoader

    ++++++++++com.ibm.ws.bootstrap.ExtClassLoader

    ++++++++++++sun.misc.Launcher$AppClassLoader

    +++++++++++++++++++sun.misc.Launcher$ExtClassLoader

    ++++++++++++++++++++++++null

    ```


    # Figure 19-4 Inverted Classloading Hierarchy for a Servlet


    Notice the subtle difference between the classloader hierarchy for a web component,
    as opposed to an EJB component as described in figure 19-3


    Classloader for the web module:


    ```

    ++com.ibm.ws.classloader.CompoundClassLoader

    ++++com.ibm.ws.classloader.JarClassLoader

    ++++++com.ibm.ws.classloader.ExtJarClassLoader

    ++++++++++com.ibm.ws.classloader.ProtectionClassLoader

    ++++++++++++++++++++com.ibm.ws.bootstrap.ExtClassLoader

    ++++++++++++++++++++sun.misc.Launcher$AppClassLoader

    +++++++++++++++++++sun.misc.Launcher$ExtClassLoader

    ++++++++++++++++++++++++null

    ```


    # Chapter 19


    If the null or WebSphere classloader can’t find the class file of interest, and
    if the WebSphere classloader can’t find for it, the classloader for it, the classloader
    with authority over the ear starts looking, and if the classloader for the ear
    can’t find the file, it’s up to the web module to locate it, which in the case
    of a Servlet or JSP, was the classloader that was asked to load the file in the
    first place!


    If the class in question was in the lib directory of the web module to begin with,
    it’s not until the entire hierarchy has exhaustively been explored, that the web
    module classloader can finally load the file of interest.


    # What happens when none of the classloaders can locate a particular Java class
    file?


    A Java file might be found by any classloader in the hierarchy, but it is the
    first classloader that finds the file, starting from the top of the hierarchy
    down, that actually does the loading.


    If a class file is found, life is good, and our Java applications will hopefully
    run fine. If none of the classloaders can find the file, then we run head into
    the java.lang.ClassNotFoundException.


    # Why the Hierarchy of Classloaders?


    While the behavior of the classloading hierarchy may seem a little bit convoluted,
    it is actually quite a good idea, and for the most part, it works quite well.


    Imagine for a second that some cheeky monkey wrote their own implementation of
    the java.lang.Integer class, hacking around, really messing up the implementation
    of this fundamental Java class.


    232

