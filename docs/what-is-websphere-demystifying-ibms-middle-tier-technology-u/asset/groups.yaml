    ## Figure 12-1 Deploying Applications to WebSphere


    The WebSphere Administrative Console makes deploying ear files incredibly easy.


    | Options | Values |

    | --- | --- |

    | Distribute Application | Yes |

    | Use Binary Configuration | No |

    | Cell/Node/Server | Click here |

    | Enable Class Reloading | No |

    | Create MBeans for Resources | Yes |

    | Deploy EJBs | No |

    | Reload Interval in Seconds | 0 |

    | Application Name: | PulpJava |

    | Directory to Install Application | |

    | Pre-compile JSP | No |

    | Application Name | PulpJava |

    | Deploy WebServices | No |


