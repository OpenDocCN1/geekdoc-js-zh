    will likely be updated at the same time. Placing database drivers for db2 in the
    ws.ext classpath will make updating the database drivers for all of your applications
    easy and manageable.


    There is an art to effectively packaging your J2EE applications. With an understanding
    of how the various WebSphere and JVM classloaders work, you will make deployment
    easier, and avoid those tedious ClassNotFoundExceptions at runtime'
