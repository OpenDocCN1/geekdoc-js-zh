    When a web module is configured to use a parent last configuration, if the xerces.jar
    file is placed in the lib directory of the war, the war classloader will pull
    classes from the web module first, and defer to the WebSphere extensions classloader,
    which pulls in the older version of xerces, later.


    Furthermore, when WebSphere itself needs the older version of the xerces.jar file,
    it will use the WebSphere classloader, which will look into its local lib directory
    and find the older version. Both WebSphere and the war file will be using the
    correct, yet different, versions of the same set of classes.


    ## Figure 19-5 Classloader Settings


    An ear can have a module or application classloader policy. It can also have a
    parent_first or parent_last classloader mode.


    - * Application Settings


    Enter settings for the application.


    Applications:


    | Exam | Classloader mode: PARENT_FIRST |

    | --- | --- |

    | ExamEJB.jar WAR classloader: | MODULE |

    | ExamWeb.war Start weight: | MODULE APPLICATION |


    ## What is a module or application classloader policy?


    It was stated earlier that the web module, by default, uses an instance of the
    CompoundClassLoader that is separate from the other modules in the ear. This is
    the default classloader policy for an ear, known as module centric classloading.


    # Chapter 19


    However, you can switch from module centric classloading. By making classloading
    to application centric classloading. By making this change, all modules in an
    ear, including web and ejb modules, will use the same classloader instance. The
    web module will not be given a separate and unique classloader The implication
    of an application classloader policy is that any module will be able to see classes
    in any other module in the ear, including web modules. With a module centric classloader
    policy, ejbs and utility classes cannot see classes inside a WAR.


    ## How can two versions of the same class be loaded on the same JVM?


    People find it difficult to get their head around the fact that it is possible
    to load two or more different versions of the same class onto a JVM. Not only
    is this possible, it is extremely common.


    One of the rules of classloading is that a classloader never use or access classes
    loaded by a classloader beneath it in the hierarchy. If a web module configured
    with a parent-last configuration loads a class called com.servlet.User, and then
    the application classloader, or even the WebSphere classloader, is asked to load
    the com.servlet.User class so long version of the class file can be found on their
    classpath, which is indeed different from the classpath of the web module, a separate
    instance of the same class will be loaded onto the JVM.


    You must be very careful where you package your Java classes, because placing
    a file in a war file, an EJB module, a utility jar inside of an ear, or even on
    the WebSphere classpath, will have a significant impact on classloading, class
    instantiation, and class visibility.

