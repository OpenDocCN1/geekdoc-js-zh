    ## Chapter 20


    of the frustrations associated with generating a handsome looking page.


    The job of creating a handsome overall look and feel for a portal page is delegated
    to graphic designers and html experts who put together special portal components
    called skins and themes. Portal embraces an MVC framework, and abstracts the view
    portion out to a much higher level than typical Servlet-JSP applications do.


    ## What is a portal theme?


    A portal theme is a set of images and JSP pages that interact with the portal
    framework to generate the overall look and feel of the portal page.


    A portal theme determines how navigation links within the portal will be displayed,
    where a banner image or a footer graphic will be placed, and even the fonts and
    colors that will be used when a portlet gets displayed on a page is determined
    by the theme.


    A theme is designed and developed by a graphic artist, allowing a portal developer
    to focus on generating the content displayed by a portlet. The theme will determine
    how that content looks when it is displayed.


    This concept of a theme is a godsend, as it eliminates the time that gets wasted
    when Java developers are trying to figure out why an image or a link isn’t displaying
    properly. Images, graphics and navigation can all be factored out into the theme,
    which falls into the domain of your graphic artists and view specialists.


    ## What is a portal skin?


    A portal skin is simply a border around a portlet. If you want to change how a
    portlet gets rendered on a page, including how minimize and maximize buttons look,
    or how the border of a portlet is delineated, you can create and apply a custom
    skin.


    A skin is simply a collection of images and a JSP page that generates a table
    with three rows, with the top row displaying the title of the portlet, the middle
    row being the body, and the bottom row being a footer or trailer for the portlet.


    ## How does the portal create a customizable environment?


    A portal developer develops portlets, and portlets are supposed to have a very
    specific function.


    For example, one portlet might tell you the weather in various cities that are
    important to you. Another portlet might tell you last night''s hockey scores.
    A third portlet might be designed to calculate your taxes based on your annual
    income. Portlets are intended to be very focused in their implementation, and
    having a clear requirement making developing portlets much easier.


    But a great thing about the portal is the fact that a user gets to choose which
    portlets appear on their portal page. The portal environment is extremely customizable.


    Using a very simple interface, a user can choose to have the weather, sports scores
    and taxation portlet all appear on the same portal page. All three portlets, although
    developed independently, can be easily aggregated together and displayed on the
    same web page.


    From there, a user can subsequently add, or remove portlets at will. The user
    has an incredible amount of control over which portlets display as they navigate
    through the portal.


    ## How does the portal facilitate a pluggable enterprise environment?


    While portlets are typically developed independently, the portal framework provides
    facilities for unrelated portlets to communicate information back and forth to
    each other.


    For example, perhaps one portlet displays a user''s taxes based on their annual
    income. Another portlet could be configured to display how much a user could reduce
    their taxes based on retirement fund contributions. When a user changes their
    income using the first portlet, the second portlet can be messaged and subsequently
    update the information it provides.


    Furthermore, while the two portlets might communicate with each other when they
    exist on the same page, both would be able to work independently as well. So if
    a user removed the retirement savings portlet from the portal page, the taxation
    portlet would still work normally. This level of pluggability is simply not possible
    in a typical J2EE application. The portal is amazing.


    And beyond providing pluggable portlets that allow a user to customize their overall
    portal page navigation experience, portlets themselves allow for a very high level
    of customization.


    ## What is a portlet edit mode?


    While a user can customize and configure which portlets will appear on a given
    portal page, a user can do further customizations by providing individualized
    information to an actual portlet.


    A user can individually customize Portlets. For example, if a portlet calculates
    how much tax a user owes the government, it will need to know the user’s annual
    income. Portlets provide an edit mode, combined with a PortletData object, that
    allows them to take input from the user and store that information persistently.
    If a user tells a portlet their annual income, that portlet will permanently remember
    that information.


    A portlet, such as a weather portlet, might ask the user which cities should have
    their daily forecast displayed. A sports portlet might ask which sports teams
    should have their previous nights results listed. The user only needs to provide
    this information once in the portals edit mode, and the portal will continually
    use this information every subsequent time a user accesses the portal. This type
    of user specific customization is not easily achieved with a regular J2EE application,
    but with the portal, it is implicitly built into the framework.


    ## How does the portal enhance the J2EE security framework?


    Along with the highly customizable and pluggable nature of the framework, a portal
    also provides a much more granular level of security when compared to a typical
    J2EE application.


    While a user has the ability to add and remove portlets from a page, an administrator
    can restrict which portlets a user actually has rights to view.


    Furthermore, an administrator can set up a portal page and lock parts of the page,
    restricting a user’s ability to remove certain portlets from a page.


    An administrator can even restrict how a user accesses a portlet.


    ## What are portlet modes?


    A portlet has three modes, view, edit and configure.


    View mode runs when a portlet is displayed on a page. This is the default mode
    of a portlet.


    But a portlet can also be customized by a user. When a user customizes a portlet,
    such as providing income information to a tax portlet, a portlet is said to be
    in edit mode.


    Furthermore, a portlet can have global settings that are associated with all instances
    of that particular portlet, not just a specific user. When manipulating these
    global settings of a portlet, the portlet is said to be in config mode.


    An administrator can restrict a user''s access to each of these portlet modes.
    For example, all anonymous users can view the sports portlet, which displays last
    nights NHL scores. An authenticated user might be allowed to edit the sports portlet
    and have the portlet put the results of the user''s favorite hockey team towards
    the top of the screen. An administrator could be given config rights to the portlet,
    specifying the IP address of the server the portlet uses to actually get lasts
    nights sports scores.


    Whereas Servlet API only allows security to be applied to how a resource is invoked,
    namely through an http get or post invocation, the portlet API allows an administrator
    to secure how the portlet is used. This provides a much greater level of control
    to the administrator. The fact that all of this is done through a single, portal
    administrative console is a huge bonus.


    ## How does the portal provide centralized administration?


    Beyond the significant usability improvements a portal environment provides to
    developers and users, perhaps the biggest benefit of the portal is how it provides
    centralized administration of both users and applications.


    The cost of any application is not how much the hardware costs to get it to run,
    or how much an application costs to develop. The real cost of any application
    is related to the effort involved in maintaining that application over the long
    term.


    WebSphere Portal provides a central point of management and administration of
    both users and applications. From the WebSphere portal, you can interact with
    your LDAP server to manage users and groups, you can update, install and manage
    your portal applications, and you can easily manage the security of your applications,
    controlling which users and groups have access rights to your various applications.


    Centralized administration makes the management of a large number of users and
    applications much cost effective over the long run, and a central point of administration
    makes management easier as well.


    ## What are the collaborative services?


    Integrating new functionality into an existing J2EE application can be a time
    consuming proposition. With the pluggable infrastructure of the portal, adding
    new and exciting functionality is as simply as installing a new portlet or two.
    An enterprise environment can develop and deploy their own custom portlets, while
    at the same time, purchasing out of the box portlets from third party vendors
    such as Pinnacore.

