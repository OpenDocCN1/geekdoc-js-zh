    # 类加载问题解决


    明智的做法是在 ear（企业归档文件）的根目录下放置一个副本，而不是在每个 Web 和 EJB 模块中重复常见的组件 jar 包文件。


    现在我知道这直接与上一个场景中的可维护性论点相矛盾，但事实是，对于通用组件，你通常需要强制统一的版本控制。


    一种常见的的设计模式是 EJB 和 Servlet 之间相互传递 JavaBean。这些 JavaBean 必须处于相同的版本，并具有相同的属性和方法集；否则，在
    EJB 和 Servlet 之间来回传输这些对象的序列化（marshalling）过程将会失败。


    将这些通用组件打包在 ear 的根目录下，将有助于维护应用程序中所有 EJB 和 Web 模块的统一版本。


    请记住，你可能（而且很可能）会遇到从一个 ear 文件中的组件调用另一个 ear 文件中的组件的情况，它们可能会使用在你的通用组件 jar 包中定义的类来回传数据。如果是此类情况，你仍然可能会遇到
    jar 包之间版本不兼容的问题，迫使你同时升级多个 ear 文件中的通用组件。


    对我来说，这是一个我愿意承担的风险，我将依靠我的架构师在设计文档中有效地且准确地描述应用程序之间的依赖关系。


    当然，如果你想绝对确保所有企业级应用都使用相同版本的通用组件，你可以将 `common-components.jar` 文件从 ear 的根目录移除，并将通用组件放在
    `ws.ext` 目录下，但我认为这也是一个很大的代价。


    # 第 19 章


    ## 使用 WebSphere 扩展类加载器加载文件的缺点是什么？


    在讨论类加载器和扩展目录时，应该说明一点：任何回调到 web 模块或 ejb 模块的组件都必须放在 ear 内部，而不是 ear 外部的类路径上。


    例如，假设一个 Servlet 调用一个使用 EJB 的辅助类。如果该辅助类被放在 ear 之外，Servlet 就会调用一个位于应用程序上下文之外的组件。如果该辅助类随后回调到
    ear（例如与 EJB 交互），那么该回调将被视为来自应用程序上下文之外组件的、完全匿名的调用。


    这构成了一个真正的问题，特别是当我们开启了安全性或正在运行事务时。离开 ear，Servlet 的整个安全上下文将会丢失，导致最终的调用由于未身份验证的用户无法访问
    EJB，尽管客户端在 Servlet 第一次调用时经过了身份验证。


    如果你在安全性方面遇到问题，并且收到错误指示某个受保护资源被匿名用户调用（尽管在你每次尝试访问相关组件时都经过了挑战），那么就是 ear 之外的组件正在进行回调。


    这种场景可能特别令人沮丧，因为事实当没有开启安全性时，一切运行正常正常。只有当你开启安全性时，这类问题才会显现出来。


    因此，如果我们希望这些组件能够保持其安全或事务上下文，那么任何回调到 ear 的组件都必须放在 ear 内部。


    ## 我们应该在 `ws.ext` 类路径上放置什么？


    扩展类路径是放置任何不回调同一版本 J2EE 应用程序的常用组件的好地方。这包括诸如通用解析器和数据库驱动程序等元素。


    企业中的每个应用程序都应该连接到同一个邮件服务器。如果邮件服务器发生变化或 DB2 版本进行更新，所有应用程序都可能同时更新。将 db2 的数据库驱动程序放在
    `ws.ext` 类路径中，将使更新所有应用程序的数据库驱动变得简单且易于管理。


    有效地打包 J2EE 应用程序是一门艺术。通过理解各种 WebSphere 和 JVM 类加载器的工作原理，你将使部署变得更容易，并避免运行时出现那些枯燥的
    `ClassNotFoundException`。


