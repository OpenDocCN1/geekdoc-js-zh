    Runtime Environment | Classes found in the lib directory of the JRE |

    | WebSphere Bootstrap Classloader ExtClassLoader | Loads the J2EE and WebSphere
    runtime environment | The WebSphere lib directory |

    | Security Classloader ProtectionClassLoader | Loads security related Java classes,
    I think | Not sure |

    | External Jar Classloader ExtJarClassLoader | Loads common classes needing a
    PARENT_LAST mode of delegation | The lib\app directory of the application server
    |

    | Non WAR Classloader CompoundClassLoader | Used to load files inside modules
    of an ear, with the exception of the web module | This instance of the CompoundClassLoader
    has scope in all non-web modules of an EAR |

    | Internal Jar Classloader JarClassLoader | Makes classes in non-web modules of
    an EAR visible to web components | This instance of the CompoundClassLoader has
    scope in all non-web modules of an EAR |

    | WAR Classloader CompoundClassLoader | Loads the web components and Java code
