    ## WebSphere, Java, Portal 和 J2EE 培训


    ## 向专家学习学习


    您是否需要 WebSphere、Java、J2EE 或 Portal 培训？欢迎参加在加拿大安大略省多伦多市举办的精彩开放式注册课程。


    ## 多伦多、渥太华和卡尔加的开放式注册


    《ExamScan》系列书籍、《What is WebSphere?》以及《goodbook》系列丛书的作者 Cameron McKenzie，将利用其独特的引导技巧以及对基于
    Java 技术的深厚知识，教授学生，并激励他们对所使用的技术有更深层次的理解。


    ## 提供定制化企业课程


    Cameron McKenzie 每月还会抽出两周时间，为 6 人及以上的课程提供定制化的企业培训。如果您无法前往多伦多，可以随时邀请 Cameron 前往您自己的私人培训设施。需求很大，请尽早预订，以确保以最高效、有效的方式满足您的教育需求。


    欲了解更多信息，请发送邮件至 mail@cameronmckenzie.com 联系 Cameron，并访问 www.technicalfacilitation.com
    网站查看详情。


    ## 关于 Java 和 J2EE 的优秀书籍更多


