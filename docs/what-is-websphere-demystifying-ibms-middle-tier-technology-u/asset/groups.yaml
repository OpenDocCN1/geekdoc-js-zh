    ## Chapter 6

    ## Message Driven Beans


    ### What is a Message Driven Bean, MDB?


    Anxiously anticipated, and newly introduced with J2EE 1.3, is the Message Driven
    Entity Bean (MDB).


    Messaging is an important part of any enterprise applications. Messaging allows
    an application to put information on a message queue, and be assured that that
    information will be processed at some time in the foreseeable future.


    Essentially, message queues allow an application to implement delayed processing.
    Delayed processing of messages is also known as asynchronous messaging.


    ### How does asynchronous messaging work?


    Have you ever placed an order over the Internet, been been told that your order
    has been processed, and then you don''t get an actual confirmation email for about
    an hour or two?


    When you placed your order, the website grabbed your order information, which
    likely included your email address and credit card number, and then shoved that
    information in a message, and plopped that message on a message queue. When the
    application server got a little bored, or at least when the workload down a little
    bit, the application server grabbed your order off the queue and processed it,
    thus the delay in your email confirmation. That is asynchronous messaging in action.


    ## Chapter 6


    By using a same message queue, we can delay processing, while at the same time,
    ensuring that a particular task will be transactionally performed.


    Asynchronous messaging, which occurs when a message is placed on a queue and a
    client does not need to wait for that message to be processed, is an important
    part of any enterprise environment. Curiously though, J2EE has been fairly shy
    when it comes to providing a framework that eases the burden of message-oriented
    programming.


    Well, with WebSphere 5 and J2EE 1.3, we have message driven entity beans, MDBs,
    which make reading messages off a queue much, much easier.


    Message driven entity beans are a special type of Enterprise Java Bean (EJB) that
    is designed to wait for messages to be dropped off a message queue, and then subsequently
    read those messages and react to the information contained therein.


    ### How do message driven beans compare to the other Enterprise Java Beans?


    In use, creation and deployment, a message driven bean is quite a bit different
    from any other type of EJB. To be honest, I kinda cringe at the fact that this
    snobbish little messaging component has been included under the sacrosanct heading
    of EJB. However, I must be remiss and accept the wisdom of those who created and
    contribute to the J2EE specification.


    Messaging is an important part of almost every enterprise environment, and until
    J2EE 1.3, the developer was responsible for reading messages from a queue, and
    subsequently processing those messages.


    ## Message Driven Beans


    To help standardize the way applications read asynchronous messages off a queue,
    and to stop the pissing contest between developers who contended they had best
    implementation of messaging, J2EE introduced the Message Driven Entity Bean (MDB).


    Essentially, an MDB reads messages off a queue or topic, and then executes business
    logic based on the contents of that message. Quite often, the MDB just converts
    the message into a plain ordinary Java object (POJO), and then passes that POJO
    off to a Session Bean for further processing.


    ## Chapter 7

    ## Session Beans


    ### What is a Session Bean?


    There are three types of Enterprise Java Beans:


    - Entity Beans (BMPs and CMPs)

    - Message Driven Beans (MDBs)

    - Session Beans (Stateless and Stateful)


    We have discussed entity and we have discussed message driven beans. A session
    bean is anything that doesn''t fall into the two aforementioned categories.


    A tongue in cheek definition for sure, but it is surprisingly accurate. After
    all, message driven beans are tied to a message queue or topic. An entity bean
    is bound to persistent data. A session bean is truly a free spirit, entitled to
    do whatever the heck it wants.


    ### When would you use a Session bean?


    Session beans are important J2EE components, but before we diving into the virtues
    of the session bean, let''s rehash the reasons why we would want to use an EJB
    in the first place. EJBs are great because they provide:


    - Remote distribution

    - Transaction management

    - Multithreaded control

    - Secure access down to the method level


    Now imagine we wanted to take advantage of all, or even just some, of these great
    services, but we weren''t interested in persisting data to a database, and we
    weren''t interested in reading messages off of a message queue. What option would
    we have? Well, we could use a Session bean!


    Session beans come in two different flavors:


    - Stateful Session Beans

    - Stateless Session Beans


    ### What is a Stateful Session Bean?


    A stateful session bean is a session bean that maintains internal data in the
    form of instance variables. Furthermore, when a user creates a stateful session
    bean, the internal properties of that bean are tied to the user that created it.


    ![](img/a64fe132c0e172db17f8974af89bd4d4_67_0.png)


    > If America was an EJB, it would be a stateful session bean. After all, it has
    fifty different states, 52 if you include Canada and Mexico.


    A simple stateful session bean might be a timer. If user logs into our website,
    we could create a stateful timer that stores the time of first contact. The login
    time would represent the internal state of the session bean.


    Using our stateful session bean, any time our user requests a new web page, we
    could create a stateful timer that stores the time of first contact. The login
    time would represent the internal state of the session bean.


    ### What is a Stateless Bean?


    A stateful session bean is a session bean that maintains internal data in the
    form of instance variables. Furthermore, when a user creates a stateful session
    bean, the internal properties of that bean are tied to the user that created it.


    A stateful session bean is a session bean that maintains internal data in the
    form of instance variables. Furthermore, when a user creates a stateful session
    bean, the internal properties of that bean are tied to the user that created it.


    A stateful session bean is a session bean that maintains internal data in the
