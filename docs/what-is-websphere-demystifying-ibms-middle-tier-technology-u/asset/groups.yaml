    ## Database Connection Pooling


    in use stabilizes, or the maximum number of connections allowed is hit.


    If the maximum number of connections is hit, and a client asks for another connection,
    the client will wait the number of seconds specified by the wait timeout property
    of the DataSource. If none of the existing connections are returned to the pool
    in that time, the client will be thrown a ConnectionWaitTimeoutException.


    Every once in a while, as specified by the reap time, the DataSource will poll
    each of the connections and ask them how old they are and how long it has been
    since they were last used by a client. If any connections have either hit the
    aged timeout, or the unused timeout, those connections are removed from the pool.


    If database traffic dies down, connections will continue to be removed from the
    pool, based on the unused timeout, until the minimum number of connections is
    met. the number of connections will remain at that minimum until database activity
    increases.


    This is the yin and the yang associated with managing database connections through
    a DataSource.


    ## Enterprise Naming with JNDI


    ## Chapter 18

    Enterprise Naming with

    JNDI


    ![](img/a64fe132c0e172db17f8974af89bd4d4_200_0.png)


    ## What is ‘Naming?’


    JNDI, the Java Naming and Directory Interface, is one of the most important J2EE
    services your applications will employ.


    J2EE components are interesting and powerful because the can take advantage of
    a variety of features and services that are implemented and managed by the J2EE
    application server; However, most of these services and features are created,
    initialized, maintained and exist outside of the Java code our developers write.


    Applications must be capable of accessing these server managed J2EE services.
    The first step towards gaining access to these resources is looking them up through
    a directory naming service.


    ## What J2EE components and services are initially accessed through JNDI?


    A short list of the elusive enterprise objects initially accessed though a naming
    service includes:


    - Remote Enterprise JavaBeans

    - DataSources

    - Transaction Objects

    - Custom Services

    - Message Queues

    - Local Enterprise JavaBeans

    - Mail Servers


    All enterprise environments, be it CORBA or .Net, use the facilities of a naming
    service. In a J2EE environment, the Java Naming and Directory Interface (JNDI)
    provides our components access to the underlying naming service implemented by
    the Application Server.


    ## How does a naming service work?


    When WebSphere boots, a variety of resources are initialized and subsequently
    bound to the naming service.


    The first step in accessing a JNDI bound resource, such as an EJB, is to look
    up the resource according to its JNDI bound name. The naming service will then
    return to the client a reference to the object of interest.


    ## Enterprise Naming with JNDI


    ## A Conversation Between JNDI and an EJB at Start-Up


    **EJB:** Hey, JNDI, do you know who I am?


    **JNDI:** Ya, you''re a really important EJB.


    **EJB:** That''s right, and people are going to be coming around these parts asking
    for me.


    **JNDI:** What''s your name?


    **EJB:** "ejb/com/pulpjava/session/Timer"


    **JNDI:** Great. And when someone asks, where should I send them?


    **EJB:** Point them to my home. It''s the big mansion on the corner.


    **JNDI:** Will do best! After all, binding names to objects is what I do best!


    ## Who assigns resources their JNDI names?


    When resources such as DataSources and message queues are created and configured
    by the administrator, the JNDI name is one of the configurable properties.


    For the most part, the WebSphere administrator has the final say over the name
    a resource will use when binding itself to JNDI.


    ## Chapter 18


    ## What is an InitialContext?


    A naming service uses a directory, or folder structure, to keep track of objects
    and their corresponding names.


    For example, EJBs usually go under a sub-directory named ejb, and database related
    objects usually go under a subdirectory named jdbc. An InitialContext is a connection
    to the root or base directory of the naming service, off of which all folders
    or subdirectories branch.


    To use an analogy, if the Windows operating system was a directory server, the
    InitialContext would be the root, C:\, since all folders and subdirectories sprout
    from there.


    ## Figure 18-1 Exploring a JNDI Tree


    Objects are bound to a directory in a tree like structure.


    ![](img/a64fe132c0e172db17f8974af89bd4d4_203_0.png)


    ## Enterprise Naming with JNDI


    When looking up an object bound to a JNDI server, we reference the directory of
    the object relative to the root of the directory, or as we say in developerspeak,
    we reference the InitialContext.


    ## How does JNDI help with distributed programming?


    To obtain a reference to an EJB running on a remote server, we must first connect
    to the naming service on that server. Once we have a connection to the remote
    naming service, we provide the JNDI name of the desired EJB. If we provide the
    correct name, the naming service will return a reference to the EJB in question.


    ## How do I look up a JNDI addressable resource?


    When a connection pool is created, or EJB is deployed, the name of the JNDI addressable
    resource is bound with the name pulpds, or EJB is bound with the name ejb/pulpjava/session/Timer.


    To lookup a JNDI addressable resource in your application, your Java code would
    look something like:


    ```java

    //connect to the root of the naming service

    InitialContext jndi = new InitialContext();

    //lookup a datasource

    jndi.lookup("jdbc/pulpds");

    //lookup the EJB

    jndi.lookup("ejb/pulpjava/session/Timer");

    ```


