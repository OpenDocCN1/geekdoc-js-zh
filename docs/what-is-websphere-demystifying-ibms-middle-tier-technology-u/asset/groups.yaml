    # Chapter 16


    IDS is actually the latest release of the freely available Secureway Directory
    Server, so in reality, IBM only has two LDAP directory servers. The Lotus Domino
    Directory Server is a little more feature filled, and as a result, does have a
    price tag attached to it.


    Any LDAP compliant directory can be used as a user registry with WebSphere. WebSphere
    is very non-judgmental, and can play with any of the LDAP kids on the block.


    # Figure 16-3 Configuring LDAP as a User Registry


    Many different LDAP directories are compatible with the WebSphere Application
