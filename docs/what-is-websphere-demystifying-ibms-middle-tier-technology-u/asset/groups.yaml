    # Classloading Solved


    Smart money says you should put one copy in the root of the ear, and not duplicate
    the common component jar file in each of your web and EJB modules.


    Now I know that this directly contradicts the maintainability argument of the
    previous scenario, but the fact is, with common components, you often need to
    enforce a common versioning.


    A common design pattern has EJBs and Servlets passing JavaBeans back and forth
    to each other. These JavaBeans must be at the same version level, and have the
    same set of properties and methods; otherwise, the process of marshalling these
    objects back and forth between EJBs and Servlets is going to fail.


    Packaging these common components in the root of the ear will help maintain a
    common version across all EJB and Web modules in the application.


    Keep in mind that you may, and likely will, have components from one ear file
    calling components in another ear file, and they’ll probably pass data back and
    forth using classes defined in your common components jar file. If this is the
    case you could still run into the problem of having version incompatibilities
    between jar files, forcing you to upgrade the common components in several ear
    files at the same time.


    For me, that’s a chance I’m willing to take, and I’m going to depend on my architects
    to have articulated the application interdependency effectively and in exact detail
    within the design documents.


    Of course, if you want to be absolutely positive all enterprise applications are
    using the same version of your common components, you could remove the common-components.jar
    file out of the root of the ear, and place the common components in the ws.ext
    directory, but I think that''s a pretty big trigger to pull as well.


    # Chapter 19


    ## What are the drawbacks of using the WebSphere extensions classloader for common
    files?


    One thing that should be stated when talking about classloaders and the extensions
    directory is that any component that does a call back into a web module or an
    ejb module must be placed inside the ear and not on a classpath outside of the
    ear.


    For example, say a Servlet calls on a helper class that uses an EJB. If that helper
    class was placed outside of the ear, the Servlet would be calling a component
    that exists outside of the application context. If the helper class then made
    a call back into the ear, to interact with an EJB for instance, that callback
    would be treated as a completely anonymous invocation from a component outside
    of the application''s context.


    This poses a real problem, especially if we have security turned on or transactions
    running. By leaving the ear, the entire security context of the Servlet will be
    lost, and the resulting call will end up with an unauthenticated user cannot access
    the EJB, despite the fact that the client was challenged when the Servlet was
    first invoked.


    If you''re having problems with security, and you''re getting errors indicating
    that a secured resource is being invoked by an anonymous user, despite being challenged
    every time you try to access the component in question, then a component outside
    of the ear is making a callback.


    This scenario can be especially frustrating due to the fact that when security
    is not on, everything works fine. Only when you turn security on does a problem
    like this rear its ugly head.


    So, any components making a callback into the ear must be placed within the ear
    if we wish for those components to maintain their security or transactional contexts.


    ## What should we place on the ws.ext classpath?


    The extensions classpath is a great place to throw any commonly used components
    that do not make callbacks into the same version of J2EE application. This includes
    elements such as common parsers and database drivers.


    Every application in the enterprise should be connecting to the same mail server.
    If the mail server changes, or the version of DB2 is updated, all of the applications
    will likely be updated at the same time. Placing database drivers for db2 in the
    ws.ext classpath will make updating the database drivers for all of your applications
    easy and manageable.


    There is an art to effectively packaging your J2EE applications. With an understanding
    of how the various WebSphere and JVM classloaders work, you will make deployment
    easier, and avoid those tedious ClassNotFoundExceptions at runtime.


    # Chapter 20

    ## WebSphere Portal


    ## Why do we need a portal?


    Enterprise development is hard. That’s why we need J2EE. J2EE provides a strong
    foundation upon which we can build our enterprise applications. Important services,
    such as database pooling and security, are implemented by those clever spuds who
    design the application server-enterprise architects and developers are then allowed
    to concentrate on the business logic needed to get their applications up and running.


    Unfortunately, J2EE isn’t a panacea in itself. The developer is still burdened
    with a significant amount of work if they want to get their applications working
    properly. A J2EE application server will take care of transactions and object
    distribution, but it won’t help your notoriously lazy Java developers with common
    tasks such as internationalization or error handling; addressing these tedious
    tasks still falls into the domain of the developer.


    Of course, we do have a variety of open source projects that help address such
    issues. Apache frameworks such as Struts and Cocoon further simplify J2EE development
    by providing a common framework that does input validation, error handling, and
    internationalization; however, this simply isn''t enough. Effectively managing
    and maintaining a vast enterprise environment is simply far too complex to be
    addressed by a simple combination of J2EE and open source projects. This is where
    the portal comes in.


    ## Where does WebSphere Portal fit into the whole WebSphere world?


    The WebSphere Portal Server is an extension to the WebSphere Application Server.
    The portal runs on top of the WebSphere Application Server – it does not replace
    it.


    WebSphere Portal takes advantage of all of the fundamental J2EE services and components
    such as naming, security, EJBs, Servlets and JSPs. By doing so in a fabulously
    creative and inventive manner, the portal provides a boatload of functionality
    over and above what someone would expect from a basic J2EE environment.


    ## Why is the portal so hot?


    The portal is a complete environment for managing and integrating a large number
    diverse applications and user repositories across an enterprise wide system.


    A single administrative interface makes it possible to manage users, applications,
    content, look, feel and navigation of an entire website. Centralized administration
    of a huge web based infrastructure is probably the most compelling reason for
    adopting the portal.


    ## How does a portal facilitate application development?


    Rather than developing Servlets, as one would do if they were putting together
    a typical J2EE application, a portal developer develops something called a portlet.


    A portlet is similar in many ways to a Servlet. A portlet handles a request and
    must subsequently figure out how to respond. However, the big difference between
    a portlet and a Servlet is the fact that a portlet is responsible for rendering
    only a *small portion* of the web page that is returned to a client. Because the
    page that is sent back to a client is actually a combination of the output from
    many portlets, along with the inclusion of skins and a theme, the response a portal
    sends back to a client is usually referred to as a portal page.


    A portlet is given a small square on the overall page that is sent back to the
    client. The final page that gets aggregated and sent back to the client can be
    made up of many different and diverse portlets, some which might be completely
    independent, while others might actually interact with each other.


    The portal provides a very pluggable environment.


    ## What is the benefit of developing portlets instead of Servlets?


    By only being responsible for a very small slice of real estate on the portal
    page, a portlet is forced to be highly focused and very specific in nature. Creating
    portlets is simplified by the fact that their purpose is very clear, and unlikely
    to be the victim of feature creep.


    Furthermore, with a portlet, the developer can be very focused on business logic
    and functionality and avoid many

