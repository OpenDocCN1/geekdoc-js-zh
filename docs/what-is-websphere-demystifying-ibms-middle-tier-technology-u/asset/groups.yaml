    # Chapter 10


    # Division of Labor: Parallel Development


    The division of labor is another great benefit of MVC.


    If I need a home heating system, I can have people developing the thermostat,
    knitting sweaters for my sister, and building a furnace concurrently. Parallel
    development is what we call that, and it helps your applications get to market
    faster.


    Furthermore, we can apply appropriate skills to appropriate tasks. I don''t want
    grandma building a furnace, and I don''t want furnace guy knitting a sweater for
    my sister. People can concentrate on what they do best, and the best cohesive
    product will be developed in the end.


    # Support for Multiple Views


    Even the fact that I can tell how hot or cold it is in various different ways
    demonstrates a massive benefit of MVC design.


    Think about your applications. You may have one database that stores information.
    There are probably common sets of steps users have to go through to access to
    that information. These steps, or flow, can easily be managed by the controller.
    But what if users want this data in many different forms?


    Clients might want to view data in a web page, they may need to see that data
    using WAP on a palm pilot, or they may even want it as an image or a .pdf file.
    If we''re using good MVC, our applications will be able to easily adapt to the
    changing needs of our end users.'
  - '[PAGE 90]


    # How does J2EE support MVC?


    The nice thing about J2EE is that it fits perfectly into a model-view-controller
    architecture.


    # "Servlets act as our controller."


    Servlets act as our controller. Servlets are intended to handle incoming requests,
    make sure the request is valid, and delegate to various model components to do
    work.


    As far as model components go, those are our JavaBeans and EJBs. These are the
    components that do the tough work for us and implement the business logic required
    to fulfill a client request.


    # "JavaBeans and EJBs are the model."


    Finally, when a Servlet is finished calling on various JavaBeans and EJBs, it
    calls on a Java Server Page (JSP) to generate some markup for the client, also
    known as a view.


    In a J2EE environment, we can have our best web page and graphic designers creating
    the JSP pages, the database and transactionally aware Java Gurus creating our
    EJBs, and our senior Java developers gluing everything together with an effective
    use of Servlets and the occasional JavaBean.


    # "Java Server Pages provide the view."


    A clear separation of roles, parallel development, and a modular application where
    components can easily be plugged in and pulled without negatively affecting other
    layers of our program are just some of the benefits we garner from developing
    good view controller applications.'
  - '[PAGE 91]


    # How do frameworks like Struts fit into this MVC framework?


    One of the most difficult parts of developing an enterprise application is developing
    the controller.


    A controller must not only control how a user transitions from one page to another,
    but it must also make sure that any data a user is sending to the server is valid.
    If a user is sending garbage to the server, a good controller will provide useful,
    internationalized error messages where appropriate.


    > “Struts has always been a controller centric framework”


    The Struts framework provides a built-in mechanism for validating input data and
    handling errors. Struts removes the burden of developing an error identification
    and error notification system from the developer. Struts helps facilitate the
    development of good, robust controllers.


    Struts is a fantastic, open source framework that is incredibly pervasive. Struts
    will make many of the routine tasks you really hate doing a little bit easier.
    Don''t be fooled though, Struts won''t revolutionize the way you program.


    # So, what exactly does Struts do for us?


    Struts solves very common development problems. It doesn''t solve every problem,
    but it does address a few problems that arise over and over again in our J2EE
    applications.


    First of all, Struts provides a great mechanism for handling user input. Struts
    makes it very easy to validate'
  - '[PAGE 92]


    # Model View Controller


    any data a user might have typed into a form and submitted to the server.


    Form handling and input validation is always a stabbing pain in the neck. The
    Struts framework provides a fantastic form validation mechanism that reduces this
    stabbing pain to a much more tolerable throbbing sensation.


    # “Struts solves very common problems”


    Secondly, Struts provides a relatively simple mechanism for providing feedback
    to a user. Not only does Struts help weed out bad input data, it also provides
    a mechanism for telling the user what they did wrong, so they can resubmit their
    form with something different filled out wrong.


    Furthermore, if the preferred language of the user is German, it would be nice
    to send error messages back to that user in German.


    Actually, always sending error messages back to users in German isn''t a bad idea
    in itself. Instructions always seem so much more authoritative when relayed in
    Deutsch.


    # “Struts simplifies internationalization.”


    The point is, Struts provides some great facilities for internationalizing your
    applications as well – and not just error messages, but every single text string
    in your entire project.


    Now don''t get overly excited by this whole internationalization thing. Struts
    will do some internationalization, but it does not do language translation.


    Struts is not a translation server. If you have written your application in English,
    you will still have to hire a French linguist to translate the whole site so it
    can be


    91'
  - '[PAGE 93]


    # Chapter 10


    understood by les Quebecois. You''ll also have to have the site translated into
    Spanish so Americans can understand it.


    Struts doesn''t do translations, but it will recognize the preferred language
    of the client, and send back appropriately internationalized content.


    # Struts does internationalization, not translation


    Struts also forces the developer to use good MVC, or as it''s affectionately known,
    Model-View-Controller. MVC is a darned good best practice, and Struts makes sure
    your developers stick to it.


    Struts even provides a few neat custom tags that help the developer generate HTML
    to send to the client. The Struts custom tags become especially handy when generating
    HTML pages that include internationalized error messages.


    # Struts enforces good MVC techniques.


    The latest incarnation of the Struts framework, version 1.1, introduces a fantastic
    new element called Tiles. While much of the Struts framework deals with controlling
    the flow of your application, Tiles provides some fantastic features for assembling
    complex web pages from much smaller html and JSP snippets


    # What support does Struts provide for view development?


    The Tiles portion of the Struts framework provides a sweet mechanism for assembling
    web pages, a mechanism that was dearly lacking in earlier versions.


    Struts also provides features for handling database connection pools. This facility
    was quite helpful back in


    92'
  - '[PAGE 94]


    # Model View Controller


    the dinosaur age when application servers didn''t provide robust connection pooling
    services, but if you''re deploying to WebSphere, or any other J2EE compliant application
    server for that matter, using the Struts connection pooling services will only
    cause you problems. Stay away from them.


    So, here''s Struts does for you:


    +   * Provides a common development framework

    * Helps internationalize our applications

    * Helps with input validation

    * Enforces a good MVC design pattern

    * Facilitates html development through Tiles

    * Helps provide user feedback

    * Provides a collection of semi-useful custom tags


    So that''s it. Struts doesn''t write code for you. Struts doesn''t solve your
    performance problems. Struts isn''t a rapid application development environment.


    But Struts does address five or six specific areas of application development
    that are often neglected, done poorly, and implemented inconsistently across the
    enterprise. By addressing issues such as form validation, error feedback and internationalization,
    Struts allows developers to concentrate on the more pressing aspects of application
    development and design.


