    # 运行时的 WebSphere


    # 第 14 章

    运行时的 WebSphere


    ![](img/a64fe132c0e172db17f8974af89bd4d4_142_0.png)


    让我们看看运行时与我们的应用程序服务器进行典型的 Web 交互。


    让我们使用一个典型场景，请求来自 Internet 浏览器（如 Internet Explorer、Netscape Navigator 或 Opera）。我们还将通过消除负载增强（如
    Edge Server 组件、网络喷射器 network sprayers 和缓存代理）带来的复杂性来简化交互。我们只需关注 Web 客户端与我们的 WebSphere
    应用程序服务器之间典型的 Web 交互。


    # 从客户端到 Web 服务器


    在处理 Web 请求时，在隧道到我们的应用程序服务器之前，客户端总是会先访问 Web 服务器。WebSphere 应用程序服务器并不取代 Web 服务器的需求。Web
    服务器仍然是 WebSphere 架构中至关重要的部分。


    Web 服务器擅长做一件事：提供文件。Web 服务器接收客户端的请求，将该请求映射到系统上的文件，然后将该文件发回客户端。


    如果你想要一个 html5 文件，Web 服务器可以高效且可靠地找到该文件并将其发送给你。如果你需要一张图片，Web 服务器也可以向你提供它。你


    # 第 14 章


    想要快速高效地下载 zip 文件或 pdf 文件吗？Web 服务器可以实现这一点。


