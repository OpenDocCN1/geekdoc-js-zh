    - `data-src` 属性指向你要懒加载的图片。\n\nJavaScript：只需简单调用 bLazy，并通过选项映射进行微调：\n\n```\nvar\
    \ bLazy = new Blazy({\n    //options here\n});\n```\n\n要了解更多关于 bLazy 及其可用选项的信息，请访问以下链接：\n\
    \n- [bLazy.js – A lazyload image script](https://b-lazy.io)\n- [bLazy.js 官网](https://b-lazy.io)\n\
    - [bLazy.js 示例](https://b-lazy.io/demo/)\n- [GitHub 上的 bLazy.js 项目](https://github.com/dinbror/blazy)\n\
    \n## #5 使用模糊图片效果的懒加载\n\n如果你是 Medium 的读者，你一定注意到该网站是如何加载文章中的主图的。\n\n你首先看到的是一张模糊的、低分辨率图片副本，而其高分辨率版本正在被懒加载：\n\
    \n![](img/b5c46321d5b832f9c2208abb5a26242b_38_0.png)\n\n3-3. Medium 网站上的模糊占位图片。\n\
    \nMedium 网站上的模糊占位图片。\n\n40  前端性能\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_39_0.png)\n\
    \n![](img/b5c46321d5b832f9c2208abb5a26242b_39_1.png)\n\n3-4. Medium 网站上的高分辨率懒加载图片。\n\
    \nMedium 网站上的高分辨率懒加载图片。\n\n你可以通过多种方式实现这种有趣的模糊效果的图片懒加载。\n\n我最喜欢的技术是 Craig Buckler\
    \ 的方法。以下是这个方案的所有优点：\n\n- 性能：仅 463 字节的 CSS 和 1,007 字节的压缩后 JavaScript 代码\n- 支持视网膜屏幕\n\
    - 无依赖：无需 jQuery 或其他库和框架\n- 渐进增强，以应对旧版浏览器和 JavaScript 失败的情况\n\n你可以在[如何构建你自己的渐进式图片加载器](link)中阅读全部内容，并在项目的\
    \ [GitHub 仓库](link)中下载代码。\n\n## 结论\n\n以上就是五种图片懒加载的方法，你可以开始在你的项目中进行实验和测试。\n\n##\
    \ 优化 CSS：ID 选择器及其他误区\n\nIvan Ćurić\n\n第 4 章\n\n在当下的典型场景中，普通网站会加载 500KB 的 gzip\
    \ 压缩 JavaScript 和 1.5MB 的图片，运行在中端 Android 设备上，通过 3G 网络，往返时间为 400ms，CSS 选择器性能根本算不上我们应该担心的问题。\n\
    \n不过，这个话题仍然值得一提，特别是要清除围绕它的一些神话和传说。那我们就直接开始吧。\n\n## CSS 解析基础\n\n首先，让我们达成共识——本文不涉及\
    \ CSS 属性和值的性能。我们这里讨论的是选择器本身的性能开销。我将聚焦于 Blink 渲染引擎，具体是 Chrome 62。\n\n选择器可以分为几个组，并按（大致）从最快到最慢的顺序排列：\n\
    \n| 排名 | 类型 | 示例 |\n|---|---|---|\n| 1. | ID | `#classID` |\n| 2. | 类 | `.class`\
    \ |\n| 3. | 标签 | `div` |\n| 4. | 通用和相邻兄弟 | `div ~ a,div + a` |\n| 5. | 子和后代 |\
    \ `div > a,div a` |\n| 6. | 通用 | `*` |\n| 7. | 属性 | `[type=\"text\"]` |\n| 8.\
    \ | 伪类和伪元素 | `a:first-of-type, a:hover` |\n\n这是否意味着你应该只使用 ID 和类？嗯……不一定。这要看情况。首先，我们来了解一下浏览器如何解析\
    \ CSS 选择器。\n\n浏览器从右向左读取 CSS。复合选择器中最右边的选择器被称为**关键**选择器。例如，在 `#id .class > ul a`\
    \ 中，关键选择器是 `a`。浏览器首先匹配所有关键选择器。在这个例子中，它先找到页面上所有匹配 `a` 选择器的元素。然后它找到页面上所有 `ul` 元素，并将\
    \ `a` 元素筛选出仅那些是 `ul` 后代的元素——依此类推，直到最左边的选择器。\n\n因此，选择器越短越好。如果可能，确保关键选择器是类或 ID，以保持快速和具体。\n\
    \n## 性能测量\n\nBen Frain 在 2014 年创建了[一系列测试](series of tests)来测量选择器性能。该测试包含一个由 1000\
    \ 个相同元素组成的庞大 DOM，并测量解析各种选择器的速度，从 ID 到一些非常复杂和长的复合选择器。他发现最慢和最快选择器之间的差异约为 15ms。\n\
    \n不过，那是在 2014 年。从那以后情况发生了很大变化，在不断变化的浏览器环境中，死记硬背规则几乎是没用的。务必记住要进行自己的测试，尤其是在涉及性能时。\n\
    \n我自己去做了测试，为此我使用了 Paul Lewis 的测试，该测试在 [Paul Irish 的评论](Paul Irish's comment)中提到，表达了对有用但复杂的\"\
    [数量选择器](quantity selectors)\"的担忧：\n\n> 这些选择器是最慢的选择器之一。比类似 \"div.box:not(:empty):last-of-type\
    \ .title\" 这样的选择器慢约 500 倍。测试页面 [http://jsbin.com/gozula/1/quiet](http://jsbin.com/gozula/1/quiet)\n\
    \n测试规模有所提升，达到 50000 个元素，你可以[亲自测试](link)。我在 2014 款 MacBook Pro 上进行了 10 次运行取平均值，结果如下：\n\
    \n| 选择器 | 查询时间 (ms) |\n|----------|-----------------|\n| `div` | 4.8740 |\n| `.box`\
    \ | 3.625 |\n| `.box > .title` | 4.4587 |\n| `.box .title` | 4.5161 |\n| `.box\
    \ ~ .box` | 4.7082 |\n| `.box + .box` | 4.6611 |\n| `.box:last-of-type` | 3.944\
    \ |\n| `.box:nth-of-type(2n - 1)` | 16.8491 |\n| `.box:not(:last-of-type)` | 5.8947\
    \ |\n| `.box:not(:empty):last-of-type .title` | 8.0202 |\n| `.box:nth-last-child(n+6)\
    \ ~ div` | 20.8710 |\n\n结果当然会因你使用 `querySelector` 还是 `querySelectorAll`，以及页面上匹配节点的数量而有所不同，但\
    \ `querySelectorAll` 更接近 CSS 的真实用例，即定位所有匹配元素。\n\n即使在如此极端的情况下，有 50000 个元素需要匹配，并使用像最后一个那样疯狂的选择器，我们发现最慢的约为\
    \ 20ms，而最快的简单类选择器约为 3.5ms。差距并不是那么大。在一个现实、更\"温和\"的 DOM 中，大约有 1000–5000 个节点，你可以预期这些结果会降低\
    \ 10 倍，达到亚毫秒级的解析速度。\n"
