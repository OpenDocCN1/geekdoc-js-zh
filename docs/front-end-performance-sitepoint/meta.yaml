  md: '# # 1. Avoid Animating Expensive CSS Properties


    Whether you plan on animating CSS properties using [CSS Transitions/CSS keyframes](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Transitions/Using_CSS_transitions)
    or JavaScript, it''s important to know which properties bring about a change in
    the geometry of the page (layout) — meaning that the position of other elements
    on the page will have to be recalculated, or that painting operations will be
    involved. Both layout and painting tasks are very expensive for browsers to process,
    especially if you have several elements on your page. As a consequence, you''ll
    see animation performance improve significantly if you avoid animating CSS properties
    that trigger layout or paint operations and stick to properties like transforms
    and opacity, because modern browsers do an excellent job of optimizing them.


    On [CSS Triggers](https://csstriggers.com/) you''ll find an up-to-date list of
    CSS properties with information about the work they trigger in each modern browser,
    both on the first change and on subsequent changes.


    ![](img/b5c46321d5b832f9c2208abb5a26242b_94_0.png)


    9-1. CSS Triggers Website


    Changing CSS properties that only trigger composite operations is both an easy
    and effective step you can take to optimize your web animations for performance.'
