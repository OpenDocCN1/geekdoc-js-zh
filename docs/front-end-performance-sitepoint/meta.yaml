    \ **注意！**\n\n警告会突出显示那些可能在过程中让你绊倒的潜在问题。\n\n# 你的网站应该支持哪些浏览器？\n\n克雷格·巴克勒\n\n第1章\n\
    \n“*我的网站/应用应该支持哪些浏览器？*”这个问题**经常被客户和开发者提出。简单的答案是列出排名前N的主流应用程序。但这种策略是否已经过时了？**\n\
    \n## 使用率最高的浏览器有哪些？\n\n根据**StatCounter**的数据，2017年5月桌面端使用率最高的十款浏览器是：\n\n1. Chrome\
    \ — 59.37% 市场份额\n2. Firefox — 12.76%\n3. Safari — 10.55%\n4. IE — 8.32%\n5. Edge\
    \ — 3.42%\n6. Opera — 1.99%\n7. Android (平板) — 1.24%\n8. Yandex Browser — 0.48%\n\
    9. UC Browser — 0.41%\n10. Coc Coc — 0.33%\n\n**移动端现在占所有网络使用的54.25%**，因此我们也需要审视排名前十的手机浏览器：\n\
    \n1. Chrome — 49.23%\n2. Safari — 17.73%\n3. UC Browser — 15.89%\n4. Samsung Internet\
    \ — 6.58%\n5. Opera — 5.03%\n6. Android — 3.75%\n7. IEMobile — 0.68%\n8. BlackBerry\
    \ — 0.26%\n9. Edge — 0.15%\n10. Nokia — 0.12%\n\n全球统计数据并不能说明全部情况：\n\n- 不同地区的模式差异显著。例如，Yandex是俄罗斯使用率第二高的浏览器（12.7%份额）。搜狗是中国使用率第三高的浏览器（6.5%）。Opera\
    \ Mobile/Mini在非洲的份额为28%。\n- 新的浏览器版本定期发布。Chrome、Firefox和Opera每六周更新一次；检查几个月前的版本是不切实际的。\n\
    - 同一款浏览器在不同设备和操作系统上的工作方式可能不同。Chrome有适用于Windows、macOS、Linux、Android、iOS和ChromeOS各个版本的，但在所有地方它都不是同一个应用程序。\n\
    - 在各种设备上存在着一个非常长的、包含老旧和新奇、古怪和优秀浏览器的长尾，包括游戏机、电子书阅读器和智能电视。\n- 你网站的分析数据永远不会与全球统计数据完全匹配。\n\
    \n## 浏览器差异如此之大吗？\n\n尽管应用程序多种多样，但所有浏览器都有相同的目标：*渲染网页*。它们通过渲染引擎实现这一点，并且存在一定的交融：\n\
    \n1. Webkit用于macOS和iOS上的Safari。\n2. Blink是Webkit的一个分支，现在用于Chrome、Opera、Vivaldi和Brave。\n\
    3. Gecko用于Firefox。\n4. Trident用于Internet Explorer。\n5. EdgeHTML是Trident的升级版，用于Edge。\n\
    \n大多数浏览器使用这些引擎中的一种。它们是拥有不同团队的独立项目，但公司（主要）通过W3C合作，确保每个人都以相同的方式采用新技术。浏览器比以往任何时候都更接近，现代智能手机应用程序与其桌面端对应物不相上下。然而，没有任何两个浏览器的渲染方式完全相同。大多数差异是微妙的，但当你转向尖端技术时，它们变得更加明显。某个特定功能可能在一个浏览器中完全实现，在另一个浏览器中部分实现，而在其他浏览器中则不存在。\n\
    \n## 我的网站能在所有浏览器中工作吗？\n\n可以。渐进增强（PE）等技术建立了一个基线（可能只是HTML），然后在支持的情况下用CSS和JavaScript进行增强。现代浏览器会获得现代布局、动画效果和交互式小部件。古老的浏览器可能只获得无样式的HTML。其他浏览器则介于两者之间。PE对于内容网站和具有基本表单功能的应用程序效果很好。随着你转向具有丰富自定义界面的应用程序，它变得不那么实用。你新的协作视频编辑应用程序不太可能在十年前的IE7上运行。它可能无法在通过3G网络连接的小屏幕设备上工作。也许可以提供替代界面，但结果可能是一个笨重的、独立的应用程序，很少有人愿意使用。考虑到遗留浏览器用户的规模，成本将是难以承受的。\n\
    \n## 网站所有者建议\n\n网站所有者应了解以下网络的基本原则和限制。\n\n- **网络不是印刷品！** 你的网站/应用不会在所有地方看起来都一样。每个设备都有不同的操作系统、浏览器、屏幕尺寸、功能等。\n\
    - **功能可能不同** 你的网站可以为所有人工作，但体验和设施会有所不同。即使是像日期输入字段这样基础的东西，也可能有多种多样的可能性，但理想情况下，核心应用程序将保持可操作性。\n\
    - **评估你的项目** 务实一点。这是内容网站、简单应用程序、类似桌面端的应用程序、快速动作游戏等等。建立浏览器兼容性的基本水平。例如，它必须在大多数两年内的浏览器上、在600像素屏幕宽度下、通过快速Wi-Fi连接时能工作。\n\
    - **评估你的受众** 不要依赖全球浏览器统计数据。主要用户是谁？他们是IT新手还是高度技术化的？是个人、小公司还是政府组织？他们是坐在办公桌前还是在移动中？没有应用程序适用于所有人——首先专注于核心用户。尽可能检查你现有系统的分析数据，但要理解底层数据。如果你的应用在Opera\
    \ Mini中无法工作，你不太可能拥有Opera Mini用户。你是否屏蔽了市场中相当大的一部分？\n- **变化是常态** 令人惊奇的是，二十年前编写的网页今天仍然可以工作。它不一定美观或易用，但浏览器仍然保持向后兼容。（*大部分是这样。*\
    \ `<blink>`标签可以继续沉寂！）然而，技术在不断演进。你的网站或应用程序越复杂，就越可能需要持续维护。\n\n## 网站开发者建议\n\n只要稍加注意，就有可能支持各种各样的浏览器。\n\
    \n- **拥抱网络！** 网络是一个与设备无关的平台。内容和\n"
