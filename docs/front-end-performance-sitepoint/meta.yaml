    # The Future: The CSS `font-display` Property


    Since their first appearance, you''ve handled custom fonts using CSS `@font-face`
    and `font-family`. It''s only fair to expect CSS to solve any issue related to
    downloading custom fonts. But at present, only JavaScript-based solutions are
    usable.


    However, this won''t be so indefinitely. A smart CSS property is around the corner,
    `font-display`, which is part of the [CSS Font Rendering Controls Module Level
    1](https://example.com).


    `font-display` lets you:


    +   - Decide if you want to show text using a fallback font or hide it while the
    font is loading.

    - Control what you want to do once the font has loaded, i.e., continue to show
    the fallback font or replace it with the custom font. You can also do so on a
    per-element basis.

    - Specify your own timeout values for each font and even for a specific element.'
