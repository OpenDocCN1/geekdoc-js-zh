    \n7-2. FOIT：在 Firefox v.52 上字体加载完成后，http://blog.instagram.com/ 页面。文字已变为可见\n\n\
    换句话说，一旦浏览器开始下载字体，所有文字都会变得不可见。因此用户会在一段时间内看着没有文字的屏幕，在网络条件不佳的情况下，这感觉就像永远等不到头。此外，不同浏览器处理\
    \ FOIT 的方式也有所不同：\n\n+ Blink 和 Firefox 浏览器通过引入三秒超时来解决 FOIT：文字在字体加载期间会消失最多三秒钟。如果字体在此期间未能加载完成，网站会显示备用字体，随后在自定义字体完全加载后替换为自定义字体。这种行为产生了一个新名词\
    \ **FOUT**（又一个缩写）：**未样式化文字闪烁**。\n- Safari、默认 Android 浏览器和 Blackberry 不使用超时，而是等到自定义字体加载完成才显示文字。如果发生任何问题导致字体未能加载，用户就只能看到屏幕上的隐形文字。\n\
    - IE/Edge 浏览器不会隐藏文字，而是立即显示备用字体，这似乎是微软做出的更好设计决策。\n\n虽然在网站上阅读文字时字体突然变化并非最佳用户体验，但在加载字体时盯着空白屏幕看要糟糕得多。理想情况下，一个可行的方法应该同时克服\
    \ FOUT 和 FOIT。不过，尽管这是一个尚未解决的问题，但许多专家已有一些共识，认为 FOUT 比 FOIT 好得多。\n\n解决字体加载相关问题，需要同时优化文件大小和控制浏览器默认行为，以消除\
    \ FOIT 并尽量减少 FOUT 的突兀影响。\n\n让我们逐一详细看看每个任务。\n\n## 优化自定义字体文件的建议\n\n你可以采取一些措施，确保字体文件不会过于臃肿。\n\
    \n### #1 尽量减少项目中的字体种类\n\n不要以为因为可以从大量精美的字体中选择，就需要用许多不同的字体来拖累网站。事实恰恰相反。\n\n在大多数情况下，几种精心搭配的字体就能为你的设计带来奇效，同时对网站性能的影响也更小。\n\
    \n### #2 根据浏览器支持提供网页字体格式\n\n主要有四种字体格式：\n\n+ **True Type Font (TTF)**，一种自 80 年代末就存在的常见字体格式\n\
    - **Web Open Font Format (WOFF)**，2009 年开发的格式，基于 Open Type 或 True Type，但具有压缩和额外的元数据\n\
    - **Web Open Font Format (WOFF2)**，比 WOFF 压缩率更高的格式\n- **Embedded Open Type (EOT)**，微软设计的用于网页嵌入式字体的格式。\n\
    \n虽然你可以在 `@font-face` 声明中指定所有这些格式，但只用其中两种就可以了。方法如下：\n\n```\n@font-face {\n   \
    \ font-family: 'Open Sans';\n    src: local('Open Sans'),\n    local('OpenSans'),\n\
    \    url('fonts/open-sans.woff2')\n    format('woff2'),\n    url('fonts/open-sans.woff')\
    \ format('woff');\n}\n```\n\n你向浏览器建议的第一种格式是 woff2，它提供了额外压缩的优势。如果你的浏览器不支持 woff2，它会选择\
    \ woff，这种格式压缩效果良好，且 [所有主流浏览器的最新版本都支持](https://caniuse.com/woff2)。只有 Opera Mini\
    \ 不支持，此外还有 IE8 和较旧的 Android Mobile 浏览器。如果你在网页开发中采用渐进增强的方法，可以简单让这些旧浏览器回退到系统字体，例如\
    \ Arial、Verdana 等。\n\n### #3 只加载你需要的样式\n\n字体通常有不同的变体——斜体、粗体等。每种字体变体都会增加文件大小，因此如果网站上不会使用到某个字体变体，尽量避免将其添加到\
    \ `@font-face` 代码中。请记住，如果你使用 `<i>` 标签来添加图标，这是非常常见的做法，这就足以让浏览器加载斜体字体变体（[Zack Leatherman\
    \ 2015 年 Santa Clara Velocity 演讲中的第 77 张幻灯片](https://vimeo.com/133446040)）。如果那是你页面中唯一使用\
    \ `<i>` 的地方，改用 `<span>` 标签来放置图标，或将 `<i>` 元素的 `font-style` 设置为 `normal`，就可以避免浏览器下载不必要的资源。\n\
    \n### #4 精简你的字符集\n\n避免加载所选字体提供的所有字符、数字和符号。相反，只选择网页实际使用的字符集。\n\n你可以在 Dudley Storey\
    \ 的 [用 CSS 字体子集化削减页面加载时间](https://www.smashingmagazine.com/2014/11/slash-page-load-times-css-font-subsetting/)\
    \ 中了解关于字体子集化的全部内容。\n\n## 应对 FOIT\n\n让我们看看如今有哪些处理 FOIT 的替代方案。我从有效且推荐的做法中选出了最简单的实现方式。不过，你可以在\
    \ Zach Leatherman 的 [字体加载策略全面指南](https://www.zachleat.com/web/comprehensive-webfonts/)\
    \ 中了解更复杂的方法。\n\n### 不使用自定义字体\n\n如果你无法忍受用户盯着隐形文字或字体替换闪烁的想法，最简单的选择就是放弃自定义字体，仅依赖网页安全字体。\n\
    \n这些字体预先安装在用户设备上，因此浏览器无需加载它们。即使决定使用自定义字体，网页安全字体通常也会作为备用字体添加到 [字体栈](https://www.fontstacks.com/)\
    \ 中。\n\n放弃为设计选择完美的自定义字体并不是一个令人兴奋的方案，但这是一个完全可行的选择——尤其是如果你将其视为一种过渡策略，直到已经初现曙前沿解决方案获得广泛的浏览器支持。\n\
    \n选择这种方法不需要你使用 `@font-face`。你只需将字体栈添加到 CSS 的 `font-family` 属性即可。以下是今天你实施方案的方法：\n\
    \n```\nbody {\n    font-family: -apple-system, BlinkMacSystemFont,\n    \"Segoe\
    \ UI\", Roboto, Oxygen-Sans, Ubuntu, Cantarell,\n    \"Helvetica Neue\", sans-serif;\n\
    }\n```\n\nAderinokun 的 [新的系统字体栈？](https://www.webdesignerdepot.com/2015/01/the-new-system-font-stack/)\
    \ 提供了更多关于现代字体栈的信息。\n\n### Web Font Loader\n\n一个长期的解决方案是 [Web Font Loader](https://github.com/typekit/webfontloader)，这是一个由\
    \ Google 和 [Typekit](https://typekit.com/) 开发的 JavaScript 库，可以与来自多个来源的字体配合使用——例如\
    \ Google Fonts、Typekit、你自托管的字体文件等。\n\nWeb Font Loader 将自定义字体作为后台进程加载，同时向用户显示备用字体，从而避免\
    \ FOIT。你可以设置一个时间限制，字体必须在此期限内加载。如果请求超过此限制，用户将只能看到以备用字体显示的文本。一旦自定义字体加载完成，脚本会将页面上的备用字体替换为自定义字体。\n\
    \n以下是两个学习如何使用 Web Font Loader 的精彩教程：\n\n+ [如何使用字体加载器提升页面性能](https://www.udacity.com/blog/improving-web-font-performance-with-webfontloader-20731a4a230b)\n\
    - [使用 Web Font Loader 加载网页字体](https://www.html5rocks.com/en/tutorials/webfont/performance/)\n\
    \n### CSS Font Loading API\n\n[CSS Font Loading API](https://drafts.csswg.org/css-font-loading-3/)\
    \ 是一种基于标准的方式来加载和控制网页字体。\n\n整体推荐的方法仍然是避免 FOIT 并尽可能管理 FOUT。这个 API 可以跟踪字体加载的每个阶段。你可以利用这些信息来使用网页安全字体\n"
