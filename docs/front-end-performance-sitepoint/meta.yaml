    ![](img/b5c46321d5b832f9c2208abb5a26242b_69_0.png)


    7-2. FOIT: Page at http://blog.instagram.com/ after fonts have been loaded on
    Firefox v.52. Text has become visible


    In other words, as soon as browsers start downloading a font, all text becomes
    invisible. So users look at a screen with no text for some time, which under sub-par
    network conditions can feel like forever. Furthermore, the way different browsers
    handle FOIT also varies:


    +   - Blink and Firefox browsers tackle FOIT by introducing a three-second timeout:
    the text disappears for up to three seconds during font loading. If the font hasn''t
    loaded within this time frame, the website displays a fallback font, which is
    subsequently replaced with the custom font once this is fully loaded. This behavior
    gives rise to what is known as **FOUT** (another acronym): **Flash Of Unstyled
    Text**.

    - Safari, the default Android Browser and Blackberry don''t use a timeout but
    display no text until the custom font is loaded. If anything goes wrong and the
    font doesn''t get loaded, users are left with invisible text on the screen.

    - IE/Edge browsers don''t hide text, but display the fallback font right away,
    which seems to be a better design decision by Microsoft.'
  - '[PAGE 70]


    Although having a sudden change in typeface when reading text on a website is
    not the best user experience, staring at a blank screen while the font is loading
    sounds much worse. Ideally, a working approach should overcome both FOUT and FOIT.
    However, although it''s an open issue, there is some consensus among a number
    of experts that FOUT is way better than FOIT.


    Tackling the issues related to loading fonts involves working both on optimizing
    the file size and taking control of the default browser behavior so as to eliminate
    FOIT and minimizing the jarring impact of FOUT.


    Let''s look closer into each task one at a time.


    # Tips on Optimizing Custom Font Files


    There are a few steps you can take to make sure your font files are not super
    heavy.


    # #1 Minimize the number of typefaces in your project


    Don''t think that just because you can choose from tons of beautiful typefaces,
    you need to weigh down your website with a multitude of different fonts. The opposite
    is the case.


    In most situations, a couple of judiciously paired typefaces can work wonders
    for your design and have a lighter impact on website performance.


    # #2 Provide web font formats based on browser support


    There are four main font formats:


    +   - **True Type Font (TTF)**, a common font format that''s been around since
    the late 80s

    - **Web Open Font Format (WOFF)**, a format developed in 2009 which is Open Type
    or True Type, only with compression and further metadata'
  - "[PAGE 71]\n\n+   - **Web Open Font Format (WOFF2)**, a better compressed format\
    \ than WOFF\n- **Embedded Open Type (EOT)**, a format designed by Microsoft to\
    \ be used for embedded fonts on the web.\n\nAlthough you could specify all of\
    \ them in your `@font-face` declaration, you can get away with just two of them.\
    \ Here's how:\n\n```\n@font-face {\n    font-family: 'Open Sans';\n    src: local('Open\
    \ Sans'),\n    local('OpenSans'),\n    url('fonts/open-sans.woff2')\n    format('woff2'),\n\
    \    url('fonts/open-sans.woff') format('woff');\n}\n```\n\nThe first format you\
    \ suggest to the browser is woff2, which gives you the advantage of extra compression.\
    \ If your browser doesn't support woff2, it just selects woff, which has good\
    \ compression and enjoys [support by the latest versions of all major browsers](https://caniuse.com/woff2).\
    \ Only Opera Mini lacks support for it, together with IE8 and older Android Mobile\
    \ browsers. If you use a progressive enhancement approach to web development,\
    \ you could simply let these older browsers fall back on a system font, e.g.,\
    \ Arial, Verdana, etc.\n\n# #3 Load just the styles you need\n\nFonts usually\
    \ have different variants — italic, bold, etc. Each font variation adds weight\
    \ to the file size, so try to avoid adding a font variation to your `@font-face`\
    \ code if you're not going to use it on your website. Keep in mind that if you\
    \ use an `<i>` tag to add an icon, which is quite common, that is enough to get\
    \ the browser to load the italic font variant ([Slide 77 in Zack Leatherman's\
    \ Santa Clara Velocity talk of 2015](https://vimeo.com/133446040)). If that's\
    \ the only instance of `<i>` in your page, using a `<span>` tag for the icon or\
    \ setting the `font-style` for the `<i>` element to `normal` instead would spare\
    \ the browser from having to download unnecessary resources."
