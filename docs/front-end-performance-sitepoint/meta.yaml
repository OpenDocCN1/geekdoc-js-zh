    +   5. Opera — 5.03%

    6. Android — 3.75%

    7. IEMobile — 0.68%

    8. BlackBerry — 0.26%

    9. Edge — 0.15%

    10. Nokia — 0.12%


    The worldwide statistics don''t tell the whole story:


    +   - Patterns vary significantly across regions. For example, Yandex is the second
    most-used Russian browser (12.7% share). Sogou is the third most-used browser
    in China (6.5%). Opera Mobile/Mini has a 28% share in Africa.

    - New browser releases appear regularly. Chrome, Firefox and Opera receive updates
    every six weeks; it would be impractical to check versions going back more than
    a few months.

    - The same browsers can work differently across devices and operating systems.
    Chrome is available for various editions of Windows, macOS, Linux, Android, iOS
    and ChromeOS, but it''s not the same application everywhere.

    - There is an exceedingly long tail of old and new, weird and wonderful browsers
    on a range of devices including games consoles, ebook readers and smart TVs.

    - Your site''s analytics will never match global statistics.


    # Are Browsers So Different?


    Despite the organic variety of applications, all browsers have the same goal:
    to *render web pages*. They achieve this with a rendering engine and there is
    some cross-pollination:


    +   1. Webkit is used in Safari on macOS and iOS.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '+   2. Blink is a fork of Webkit now used in Chrome, Opera, Vivaldi and Brave.

    3. Gecko is used in Firefox.

    4. Trident is used in Internet Explorer.

    5. EdgeHTML is an update of Trident used in Edge.


    The majority of browsers use one of these engines. They''re different projects
    with diverse teams but the companies (mostly) collaborate via the W3C to ensure
    new technologies are adopted by everyone in the same way. Browsers are closer
    than they''ve ever been, and modern smartphone applications are a match for their
    desktop counterparts. However, no two browsers render in quite the same way. The
    majority of differences are subtle, but they become more pronounced as you move
    toward cutting-edge technologies. A particular feature may be fully implemented
    in one browser, partially implemented in another, and non-existent elsewhere.


    # Can My Site Work in Every Browser?


    Yes. Techniques such as progressive enhancement (PE) establish a baseline (perhaps
    HTML only) then enhance with CSS and JavaScript when support is available. Recent
    browsers get a modern layout, animated effects and interactive widgets. Ancient
    browsers may get unstyled HTML only. Everything else gets something in between.
    PE works well for content sites and apps with basic form-based functionality.
    It becomes less practical as you move toward applications with rich custom interfaces.
    Your new collaborative video editing app is unlikely to work in the decade-old
    IE7. It may not work on a small screen device over a 3G network. Perhaps it''s
    possible to provide an alternative interface but the result could be a separate,
    clunky application few would want to use. The cost would be prohibitive given
    the size of the legacy browser user base.'
