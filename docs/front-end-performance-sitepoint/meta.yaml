    ## 上下文决定一切


    你可能已经注意到，主要瓶颈是网站加载所需的时间。具体来说，是 JavaScript 的下载、解析、编译和执行时间。除了加载更少的 JavaScript 以及更智能地加载之外，别无他法。


    但是，除了启动网站之外，你的代码实际做的工作呢？那里肯定也有一些性能提升空间，对吧？


    在深入优化代码之前，先考虑一下你在构建什么。你是在构建框架还是 VDOM 库？你的代码需要每秒执行数千次操作吗？你是在做处理用户输入和/或动画的时间关键型库吗？如果不是，你可能想把时间和精力花在更有影响力的地方。


    不是说编写高性能代码不重要，但通常在宏观层面上影响甚微或没有影响，尤其是谈到微优化时。所以，在你因为比较 JSperf.com 上的结果而陷入关于 `.map`
    与 `.forEach` 与 `for` 循环的 Stack Overflow 争论之前，确保你能看到森林而不仅仅是树木。50k ops/s 在纸面上可能比
    1k ops/s 好 50 倍，但在大多数情况下这不会有什么区别。


    ## 解析、编译与执行


    从根本上说，大多数非高性能 JS 的问题不在于运行代码本身，而在于代码开始执行*之前*必须采取的所有步骤。


    我们在这里谈论的是抽象层次。你电脑中的 CPU 运行的是机器码。你电脑上运行的大多数代码都是编译后的二进制格式。（我说的是*代码*而不是*程序*，考虑到如今各种
    Electron 应用。）这意味着，除了所有操作系统层面的抽象之外，它直接在你的硬件上运行，不需要任何准备工作。


    JavaScript 不是预编译的。它通过（相对较慢的）网络到达你的浏览器，以可读代码的形式存在，而浏览器实际上就是 JS 程序的"操作系统"。


    这段代码首先需要被解析——也就是说，被读取并转换成计算机可索引的结构，用于编译。然后它被编译成字节码，最后编译成机器码，之后才能被你的设备/浏览器执行。


    另一个*非常*重要的点需要提及：JavaScript 是单线程的，运行在浏览器的主线程上。这意味着一次只能运行一个进程。如果你的 DevTools 性能时间线充满了黄色峰值，CPU
    运行在 100%，你就会遇到长帧/掉帧、卡顿滚动以及各种其他糟糕的问题。


    ![](img/b5c46321d5b832f9c2208abb5a26242b_86_0.png)


    8-5. DevTools 中的一个长时运行任务


    来源：Paul Lewis - [When everything''s important, nothing is!](https://medium.com/@paul_lewis/when-every-things-important-nothing-is-35890f28c7f5)。


    所以，在 JS 开始工作之前，有这么多工作需要完成。在 Chrome 的 V8 引擎中，解析和编译占据了 JS 总执行时间的高达 50%。


    ![](img/b5c46321d5b832f9c2208abb5a26242b_86_1.png)


    8-6. 移动和桌面端 JS 解析时间对比


    来源：Addy Osmani - [JavaScript Start-up Performance](https://medium.com/reloading/javascript-start-up-performance-69200f43b201)。


    你应该从本节中记住两点：


    1. 虽然不是严格线性的，但 JS 解析时间随包体大小而增长。你交付的 JS 越少越好。

    2. 你使用的每一个 JS 框架（React、Vue、Angular、Preact……）都是另一层抽象（除非它是预编译的，比如 [Svelte](https://svelte.dev/)）。这不仅会增加你的包体大小，还会降低代码速度，因为你没有直接与浏览器对话。


    有一些方法可以缓解这个问题，比如使用 service worker 在后台和另一个线程中工作，使用 asm.js 编写更容易编译为机器指令的代码，但那是另一个话题了。


    然而，你可以做的是避免对所有事情都使用 JS 动画框架，并[了解什么会触发重绘和重排](https://csstriggers.com/)。只有在绝对无法用常规
    CSS 过渡和动画实现动画时，才使用库。


    即使它们可能在使用 CSS 过渡、合成属性和 `requestAnimationFrame()`，它们仍然在主线程上的 JS 中运行。它们基本上只是每 16
    毫秒用内联样式猛烈敲打你的 DOM，因为除此之外它们能做的并不多。你需要确保所有 JS 在每帧 8 毫秒内完成执行，以保持动画流畅。


    另一方面，CSS 动画和过渡则在主线程之外运行——在 GPU 上，如果实现得高效，不会引起重布局/重排。


    考虑到大多数动画要么在加载期间运行，要么在用户交互期间运行，这可以为你的 Web 应用提供急需的喘息空间。


    [Web Animations API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Animations_API)
    是一套即将推出的功能集，将允许你在主线程之外执行高性能的 JS 动画，但目前，还是坚持使用 CSS 过渡和 [FLIP](https://aerotwist.com/blog/flip-your-animations/)
    等技术。


