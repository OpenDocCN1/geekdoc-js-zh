    by Dudley Storey.


    # Tackling FOIT


    Let''s look at some alternatives available today for dealing with FOIT. I''ve
    singled out the simplest approaches to implement among effective and recommended
    practices. However, you can learn about far more sophisticated ones in Zach Leatherman''s
    [A Comprehensive Guide to Font Loading Strategies](https://www.zachleat.com/web/comprehensive-webfonts/).


    # Don''t use custom fonts


    If you can''t stand the idea of your users staring at invisible text or at font-swapping
    shifts, the most simple option is to give up on custom fonts and rely solely on
    web-safe fonts.


    These fonts are preinstalled on users'' devices, so the browser doesn''t need
    to load them. Even when deciding to use custom fonts, web safe-fonts are commonly
    added to the [font stack](https://www.fontstacks.com/) as a fallback.


    Giving up on the perfect custom font for your design is not an exciting approach,
    but it''s perfectly viable — especially if you consider this as a transitory stance
    until cutting edge solutions, which are already on the horizon, gain wide browser
    support.


    Opting for this approach doesn''t require you to use `@font-face`. You just add
    your font stack to the CSS `font-family` property. Here''s how you could do this
    today:'
