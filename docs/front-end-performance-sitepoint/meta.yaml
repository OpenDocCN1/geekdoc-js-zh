    \ library to use this plugin for lazy loading images.\n\nFor a full list of options\
    \ and add-ons, visit the [Lazy Load XT repo on GitHub](https://github.com).\n\n\
    ## #4 bLazy.js — Vanilla JavaScript Plugin\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_35_0.png)\n\
    \n3-2. bLazy jQuery plugin for lazy loading images.\n\nbLazy is a smart vanilla\
    \ JavaScript plugin for lazy loading images. More specifically:\n\n> bLazy is\
    \ a lightweight lazy loading image script (less than 1.2KB minified and gzipped).\
    \ It lets you lazy load and multi-serve your images so you can save bandwidth\
    \ and server requests. The user will have faster load times and save data loaded\
    \ if he/she doesn't browse the whole page.\n\n**bLazy website**\n\nThis small,\
    \ dependency-free plugin lets you:\n\n- lazy load both embedded images and background\
    \ images\n- serve different images according to screen size and high resolution\
    \ screens\n- lazy load everything with a `src` attribute, e.g., iframes, HTML5\
    \ videos, scripts, unity games etc.\n- lazy load images inside a scrolling container\n\
    - support legacy browsers, back to IE7 and IE8\n- use a CDN, so you don't need\
    \ bLazy hosted on your server.\n\nHere's a basic implementation.\n\nThe markup:\n\
    \n```\n<img class=\"b-lazy\" src=\"placeholder.gif\" data-src=\"image.jpg\"\n\
    alt=\"test image\">\n```\n\nYou need to modify the regular `img` tag as follows:\n\
    \n- Add a class of `.b-Lazy`.\n- Use a placeholder image as value for the `src`\
    \ attribute. To save HTTP requests, you can also use an inline [base64-encoded\
    \ transparent gif](base64-encoded transparent gif). But beware, doing so won't\
    \ have the benefits of caching on subsequent pages where you use the same image.\n\
    - The `data-src` attribute points to the image you want to lazy load.\n\nThe JavaScript:\
    \ enter a simple call to bLazy and fine-tune with a map of options:\n\n```\nvar\
    \ bLazy = new Blazy({\n    //options here\n});\n```\n\nTo learn more on bLazy\
    \ and its available options, follow these links:\n\n- [bLazy.js – A lazyload image\
    \ script](https://b-lazy.io)\n- [bLazy.js Website](https://b-lazy.io)\n- [bLazy.js\
    \ Examples](https://b-lazy.io/demo/)\n- [bLazy.js Project on GitHub](https://github.com/dinbror/blazy)\n\
    \n## #5 Lazy Loading with Blurred Image Effect\n\nIf you are a Medium reader,\
    \ you have certainly noticed how the site loads the main image inside a post.\n\
    \nThe first thing you see is a blurred, low-resolution copy of the image, while\
    \ its high-res version is being lazy loaded:\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_38_0.png)\n\
    \n3-3. Blurred placeholder image on Medium website.\n\nBlurred placeholder image\
    \ on Medium website.\n\n40  Front End Performance\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_39_0.png)\n\
    \n![](img/b5c46321d5b832f9c2208abb5a26242b_39_1.png)\n\n3-4. High-res, lazy loaded\
    \ image on Medium website.\n\nHigh-res, lazy loaded image on Medium website.\n\
    \nYou can lazy load images with this interesting blurring effect in a number of\
    \ ways.\n\nMy favorite technique is by Craig Buckler. Here's all the goodness\
    \ of this solution:\n\n- Performance: only 463 bytes of CSS and 1,007 bytes of\
    \ minified JavaScript code\n- Support for retina screens\n- Dependency-free: no\
    \ jQuery or other libraries and frameworks required\n- Progressively enhanced\
    \ to counteract older browsers and failing JavaScript\n\nYou can read all about\
    \ it in [How to Build Your Own Progressive Image Loader](link) and download the\
    \ code on the project's [GitHub repo](link).\n\n## Conclusion\n\nAnd there you\
    \ have it — five ways of lazy loading images you can start to experiment with\
    \ and test out in your projects.\n\n## Optimizing CSS: ID Selectors and Other\
    \ Myths\n\nIvan Ćurić\n\nChapter 4\n\nIn today's typical scenario, where the average\
    \ website ships 500KB of gzipped JavaScript and 1.5MB of images, running on a\
    \ midrange Android device via 3G with a 400ms round trip time, CSS selector performance\
    \ is the least of our problems.\n\nStill, there's something to be said about the\
    \ topic, especially to weed out some of the myths and legends surrounding them.\
    \ So let's dive right in.\n\n## The Basics of CSS Parsing\n\nFirst, to get on\
    \ the same page — this article isn't about the performance of CSS properties and\
    \ values. What we're covering here is the performance cost of the selectors themselves.\
    \ I'll be focusing on the Blink rendering engine, specifically Chrome 62.\n\n\
    The selectors can be split into a few groups and (roughly) sorted from the least\
    \ to most expensive:\n\n| rank | type | example |\n|---|---|---|\n| 1. | ID |\
    \ `#classID` |\n| 2. | Class | `.class` |\n| 3. | Tag | `div` |\n| 4. | General\
    \ and adjacent sibling | `div ~ a,div + a` |\n| 5. | Child and descendant | `div\
    \ > a,div a` |\n| 6. | Universal | `*` |\n| 7. | Attribute | `[type=\"text\"]`\
    \ |\n| 8. | Pseudo-classes and elements | `a:first-of-type, a:hover` |\n\nDoes\
    \ this mean that you should only use IDs and classes? Well … not really. It depends.\
    \ First, let's cover how browsers interpret CSS selectors.\n\nBrowsers read CSS\
    \ from right to left. The rightmost selector in a compound selector is known as\
    \ the **key** selector. So, for instance, in `#id .class > ul a`, the key selector\
    \ is `a`. The browser first matches all key selectors. In this case, it finds\
    \ all elements on the page that match the `a` selector. It then finds all `ul`\
    \ elements on the page and filters the `a`s down to just those elements that are\
    \ descendants of `ul`s — and so on until it reaches the leftmost selector.\n\n\
    Therefore, the shorter the selector, the better. If possible, make sure that the\
    \ key selector is a class or an ID to keep it fast and specific.\n\n## Measuring\
    \ the Performance\n\nBen Frain created [a series of tests](series of tests) to\
    \ measure selector performance back in 2014. The test consisted of an enormous\
    \ DOM comprising 1000 identical elements, and measuring the speed it took to parse\
    \ various selectors, ranging from IDs to some seriously complicated and long compound\
    \ selectors. What he found was that the delta between the slowest and fastest\
    \ selector was ~15ms.\n\nHowever, that was back in 2014. Things have changed a\
    \ lot since then, and memorizing rules is all but useless in the ever-changing\
    \ browser landscape. Always remember to do your own tests, especially when performance\
    \ is concerned.\n\nI went to do my own tests, and for that I used Paul Lewis'\
    \ test mentioned in [Paul Irish's comment](Paul Irish's comment) expressing concern\
    \ over the useful, yet convoluted \"[quantity selectors](quantity selectors)\"\
    :\n\n> These selectors are among the slowest possible. ~500 slower than something\
    \ wild like \"div.box:not(:empty):last-of-type .title\". Test page [http://jsbin.com/gozula/1/quiet](http://jsbin.com/gozula/1/quiet)\n\
    \nThe test was bumped up a bit, to 50000 elements, and you can [test it out yourself](link).\
    \ I did an average of 10 runs on my 2014 MacBook Pro, and what I got was the following:\n\
    \n| Selector | Query Time (ms) |\n|----------|-----------------|\n| `div` | 4.8740\
    \ |\n| `.box` | 3.625 |\n| `.box > .title` | 4.4587 |\n| `.box .title` | 4.5161\
    \ |\n| `.box ~ .box` | 4.7082 |\n| `.box + .box` | 4.6611 |\n| `.box:last-of-type`\
    \ | 3.944 |\n| `.box:nth-of-type(2n - 1)` | 16.8491 |\n| `.box:not(:last-of-type)`\
    \ | 5.8947 |\n| `.box:not(:empty):last-of-type .title` | 8.0202 |\n| `.box:nth-last-child(n+6)\
    \ ~ div` | 20.8710 |\n\nThe results will of course vary depending on whether you\
    \ use `querySelector` or `querySelectorAll`, and the number of matching nodes\
    \ on the page, but `querySelectorAll` comes closer to the real use case of CSS,\
    \ which is targeting all matching elements.\n\nEven in such an extreme case, with\
    \ 50000 elements to match, and using some really insane selectors like the last\
    \ one, we find that the slowest one is ~20ms, while the fastest is the simple\
    \ class at ~3.5ms. Not really that much of a difference. In a realistic, more\
    \ \"tame\" DOM, with around 1000–5000 nodes, you can expect those results to drop\
    \ by a factor of 10, bringing them to sub-millisecond parsing speeds."
