    **67% of webpages now use custom fonts.** However, popularity and widespread adoption
    haven''t come without some performance and user experience-related issues.


    In this article, I''ll go through what''s not so good about the way web fonts
    are commonly used and loaded, as well as point you to well-tested workarounds
    and future standards-based solutions.


    # Why Custom Web Fonts?


    Users come to your website for content. Therefore, great typography is crucial
    on the web: readability, legibility and well-crafted typographic design are a
    must for brand recognition and the success of your message.


    The best way to achieve beautiful typography is by loading custom web fonts —
    that is, font files that are not already installed on users'' devices.


    Since browser support for the CSS `@font-face` rule has become widespread, using
    custom web fonts in websites has increased by leaps and bounds. However, fonts
    can have a heavy file size, and loading extra resources on your website doesn''t
    come without some negative impact on performance.


    Since file size can certainly be an issue, paying attention to how custom web
    fonts are loaded comes to the forefront.


    # What Is the Flash of Invisible Text (FOIT) All About?


    The most common way of using a custom web font is to specify the fonts used inside
    a CSS `@font-face` declaration and leave the browser to its default behavior.
    This is not ideal. Since information about fonts is located in the CSS, by default
    browsers delay the loading of fonts until the CSS is parsed. That''s not all.
    As [Zach Leatherman](https://zachleat.com/) has made abundantly clear, to trigger
    a font download, a number of conditions must be met besides a valid `@font-face`
    declaration:'
- md: " + an HTML node that uses the same `font-family` specified inside `@font-face`\n\
    - in Webkit and Blink browsers, that node must not be empty\n- in [browsers that\
    \ support the unicode range descriptor](https://) inside `@font-face`, the content\
    \ must also match the specified unicode range.\n\nIf all the points above are\
