    instead on the purple part — style parsing and laying out the elements.


    After constructing the DOM and CSSOM, the browser needs to combine the two into
    a render tree before finally painting it on the screen. In that step, the browser
    needs to figure out the computed CSS for each matching element. You can see this
    yourself in the **Elements > Styles** panel of the developer tools. It takes all
    the matching styles, the cascade, and browser-specific user agent styles to construct
    the final, computed CSS for the element.


    It can then proceed to the layout (also known as reflow) step, where it computes'
  - '[PAGE 47]


    the geometry, and constructs the box model of the page, placing each element on
    its respective position on the viewport. Layout is the most computationally intensive
    part of this process.


    Finally, the browser converts each node in the render tree to actual pixels on
    the screen in the paint stage.


    Now, what happens when we mutate the DOM by *changing* some classes on the page,
    adding or removing some nodes, modifying some attributes, or in any way messing
    with the HTML (or the stylesheets themselves)?


    We invalidate the computed styles and the browser needs to invalidate *everything*
    down the tree of the matched selectors. While today''s browsers are much smarter,
    it used to be the case that if you changed a class on the *body* element, all
    the descendant elements needed to have their computed styles recalculated.


    One way to avoid this issue is to reduce the complexity of your selectors. Instead
    of writing `#nav > .list > li > a`, use a single selector, like `.nav-link`. That
    way, you reduce the scope of style invalidation, since if you modify anything
    inside the `#nav`, you won''t trigger recalculations for the entire node.


    Another way is to reduce the scope — such as the number of invalidated elements.
    Be specific with your CSS. Keep this in mind especially during animations, where
    the browser has only ~10ms to do all the work required.


    If you want to get down to the nitty gritty details of style invalidation, I recommend
    reading [Style Invalidation in Blink](link).


    # Conclusion


    To sum it up, you shouldn''t worry about selector performance, unless you *really*
    go overboard. While the topic was all the rage in 2012, browsers have gotten a
    *lot* faster and smarter since. Even Google doesn''t worry about it anymore. If
    you'
  - '[PAGE 48]


    check out Google''s [Page Speed Insights page](https://developers.google.com/speed/pagespeed/insights/),
    you won''t see the rule "Use efficient CSS selectors" which was removed in 2013.


    Instead, focus on making your CSS maintainable and readable. Your colleagues and
    your future self will thank you for it. Try to optimize the CSS delivery by including
    only the used styles. And after that, get to know the rendering pipeline. Unlike
    selectors, styles themselves *can* be expensive, and [the difference between a
    janky site and a smooth one](https://developers.google.com/web/fundamentals/performance/rendering/stick-to-compositor-only-properties-and-manage-layer-count)
    can often be found in how the CSS is implemented.


    And as a final note: always do your own tests.


    Don''t just believe what someone wrote on the internet a few years ago. The landscape
    is changing drastically and at an incredible pace. What''s relevant today might
    become obsolete sooner than you know.'
  - '[PAGE 49]


    # Chapter 5

    Optimizing CSS: Tweaking Animation Performance with DevTools


    Maria Antonietta Perna'
  - '[PAGE 50]


    > This article is part of a series created in partnership with <u>SiteGround</u>.
    Thank you for supporting the partners who make SitePoint possible.


    **CSS animations are known to be super performant. Although this is the case for
    simple animations on a few elements, if you didn''t code your animations with
    performance in mind and add more complexity, website users will soon take notice
    and possibly get annoyed.**


    In this article, I introduce some useful browser DevTools features that will enable
    you to check what happens under the hood when animating with CSS. This way, when
    an animation looks a bit choppy, you''ll have a better idea why and what you can
    do to fix it.


    # Developer Tools for CSS Performance


    Your animations need to hit 60 fps (frames per second) to run fluidly in the browser.
    The lower the rate, the worse your animation will look. This means the browser
    has no more than about 16 milliseconds to do its job for one frame. But what does
    it do during that time? And how would you know if your browser is keeping up with
    the desired framerate?


    I think nothing beats user experience when it comes to assessing the quality of
    an animation. However, developer tools in modern browsers, while not always 100%
    reliable, have been getting smarter and smarter, and there''s quite a bit you
    can do to review, edit and debug your code using them.


    This is also true when you need to check framerate and CSS animation performance.
    Here''s how it works.


    # Exploring the Performance Tool in Firefox


    In this article I use the Firefox Performance tool. The other big contender is
    the Chrome Performance Tool. You can pick your favorite, as both browsers offer
    powerful performance features.'
- md: "## Performance Tools\n\nTo open the developer tools in Firefox, choose one\
    \ of these options:\n\n1.  Right-click on your web page and choose *Inspect Element*\
    \ in the context menu.\n2.  If you use the keyboard, press Ctrl + Shift + I on\
    \ Windows and Linux or Cmd + Opt + I on macOS.\n\nNext, click on the *Performance*\
    \ tab. Here, you'll find the button that lets you start a recording of your website's\
    \ performance:\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_51_0.png)\n\nPress\
    \ that button and wait for a few seconds or perform some action on the page. When\
    \ you're done, click the *Stop Recording Performance* button:\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_51_1.png)\n\
    \nIn a split second, Firefox presents you with tons of well-organized data that\
    \ will help you make sense of which issues your code is suffering from.\n\nThe\
    \ result of a recording inside the *Performance* panel looks something like this:\n\
    \n![](img/b5c46321d5b832f9c2208abb5a26242b_52_0.png)\n\nThe *Waterfall* section\
    \ is perfect for checking issues related to CSS transitions and keyframe animations.\
    \ Other sections are the *Call Tree* and the *JS Flame Chart*, which you can use\
    \ to find out about bottlenecks in your JavaScript code.\n\nThe Waterfall has\
    \ a summary section at the top and a detailed breakdown. In both, the data is\
    \ color-coded:\n\n- Yellow bars refer to JavaScript operations.\n- Purple bars\
    \ refer to calculating HTML elements' CSS styles (recalculate styles) and laying\
    \ out your page (layout). Layout operations are quite expensive for the browser\
    \ to perform, so if you animate properties that involve repeated layouts (also\
    \ known as *reflows* — such as `margin`, `padding`, `top`, `left`, etc. — the\
    \ results could be janky.\n- Green bars refer to painting your elements into one\
    \ or more bitmaps (Paint). Animating properties like `color`, `background-color`,\
    \ `box-shadow`, etc., involves costly paint operations, which could be the cause\
    \ of sluggish animations and poor user experience.\n\nYou can also filter the\
    \ type of data you want to inspect. For instance, I'm interested only in CSS-related\
    \ data, so I can deselect everything else by clicking on the filter icon at the\
    \ top left of the screen:\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_53_0.png)\n\
    \n5-4. Filter feature inside Firefox Performance Dev Tools.\n\nThe big green bar\
    \ below the Waterfall summary represents information on the framerate.\n\nA healthy\
    \ representation would look quite high, but most importantly, consistent — that\
    \ is, without too many deep gaps.\n\nLet's illustrate this with an example.\n\n\
    ## The Performance tool in action\n\nThis is a simple [CSS animation](https://developer.mozilla.org/en-US/docs/Web/CSS/@keyframes)\
    \ using the `@keyframes` keyword. The test page looks like this:\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_54_0.png)\n\
    \n5-5. Demo page with rectangular box visible.\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_54_1.png)\n\
    \n5-6. Demo page with rectangular box about to slide out.\n\nThe rectangular purple\
    \ box slides in and out of view in an infinite cycle.\n\nI've done this by animating\
    \ the `margin-left` property of the `<div>` element that represents the rectangular\
    \ box on the screen. Here's what the `@keyframes` animation block looks like:\n\
    \n```\n@keyframes slide-margin {\n  100% {\n    margin-left: 0;\n  }\n}\n```\n\
    \nThe performance data I get from this animation looks like this:\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_55_0.png)\n\
    \n5-7. Recording of animating with margins in Firefox Performance panel of the\
    \ developer tools.\n\nThe framerate visual looks a bit jagged and the framerate\
    \ is an average of 44.82 fps, which is a bit low.\n\nAlso, notice all the layout\
    \ and paint operations that take place during the animation. These are costly\
    \ operations the browser performs on its main thread, which has a negative impact\
    \ on performance.\n\nFinally, if you access the `Inspector` tool, click in the\
    \ `Animation` section and hover over the animation name, an information box pops\
    \ up with all the relevant data about the current animation. If your animation\
    \ were optimized, there would be a message stating the fact. In this case, there\
    \ is no message:\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_56_0.png)\n\n5-8.\
    \ Animation panel inside the Inspector tool with info about the current animation.\n\
    \nNow, I'm going to change my code and make a new recording as the browser animates\
    \ the CSS `translate3d()` property using this `@keyframes` block:\n\n```\n@keyframes\
    \ slide-three-d {\n  100% { transform: translate3d(0, 0, 0); }\n}\n```\n\nThis\
    \ is what the recording of the performance looks like:\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_56_1.png)\n\
    \n5-9. Recording of animation done using translate3d.\n\nNow the framerate is\
    \ higher (56.83 fps) and the waterfall is showing no costly layout and paint operations.\n\
    \nAlso, if you open the *Inspector* tab of the developer tools, access the *Animation*\
    \ panel and hover the mouse over the name of the animation, you can see something\
    \ like this:\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_57_0.png)\n\n5-10. Animation\
    \ panel in the Inspector of Firefox Developer Tools.\n\nThe info box relative\
    \ to the animation name states that all animations are optimized, which is good\
    \ news for your website visitors.\n\n## Only Animate CSS *Opacity*, *Transforms*\
    \ and *Filters*\n\nYou've probably heard this piece of advice before, but just\
    \ in case, it's worth going over it again: if you want your animations to run\
    \ smoothly, animate only CSS opacity, transforms and filters. Animating everything\
    \ else will put your browser under pressure to perform costly tasks in very little\
    \ time, which often doesn't yield the best results.\n\nAs the Performance tool\
    \ in your browser confirms, repeated layout and paint operations are not your\
    \ friend.\n\nHowever, each browser handles CSS properties a bit differently. If\
    \ you want to know exactly which browser triggers layout and paint operations\
    \ for which properties (especially when updating values for those properties,\
    \ which is what is involved in web animation), head over to [CSS Triggers](https://csstriggers.com).\n\
    \nTo ensure performant animations, a popular approach is to force the browser\
    \ to hand over the work of changing some properties to the GPU (Graphical Processing\
    \ Unit), which relieves the browser's main thread of some pressure and takes advantage\
    \ of hardware acceleration. You can do so by using the `will-change` CSS property,\
    \ or the `translateZ(0)` and `translate3d(0,0,0)` hacks. All of these tricks will\
    \ work, but if you overdo it you could actually get exactly what you're trying\
    \ to avoid, i.e., janky animations.\n\nI'm not going into the details of hardware\
    \ acceleration for web animation performance, but if you'd like to dig deeper,\
    \ take a look at the resources listed below.\n\n## Resources\n\n- [High Performance\
    \ Animations](https://aerotwist.com/blog/performant-css-animations/) by Paul Lewis\
    \ and Paul Irish\n- [CSS animations and transitions performance: looking inside\
    \ the browser](https://aerotwist.com/blog/css-animations-and-transitions-performance-looking-inside-the-browser/)\
    \ by Max Vujovic\n- [Animations and Performance](https://aerotwist.com/blog/animations-and-performance/)\
    \ by Paul Lewis and Sam Thorogood\n- [Stick to Compositor-Only Properties and\
    \ Manage Layer Count](https://csstriggers.com/) by Paul Lewis\n- [Tricks for GPU\
    \ Composited CSS](https://saraoueidan.com/blog/css-gpu-hack-explained/) by Sara\
    \ Soueidan\n- [An Introduction to the CSS will-change Property](https://dev.opera.com/articles/css-will-change-property/)\
    \ by Nick Salloum\n- [Animating CSS properties](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_animated_properties)\
    \ by MDN\n\n## Lightning Fast Websites with Prefetching\n\nMaria Antonietta Perna\n\
    \nChapter 6\n\nThis article is part of a series created in partnership with [SiteGround](https://www.siteground.com/).\
    \ Thank you for supporting the partners who make SitePoint possible.\n\n**In this\
    \ article, I'll discuss prefetching, what it is, and how developers can use it\
    \ to wow visitors with high-performance websites.**\n\n## What Is Prefetching?\n\
    \nAlthough optimizing a website for initial page load is great, for the highly\
    \ interactive websites users expect today, this might not be enough.\n\nWhat if\
    \ browsers knew which link users were about to click, or which page they were\
    \ about to visit next, so that content could automagically appear on their screen\
    \ at the speed of light?\n\nWell, browsers *can* do that now. In fact, some major\
    \ browsers are smart enough to make these kinds of guesses based on visitors'\
    \ browsing patterns, document markup and structure, the user's device, connectivity,\
    \ etc. Therefore, browsers already try to anticipate the resources needed to build\
    \ the page visitors are likely to access, get those resources ready and display\
    \ the page at warp speed when users request it. However, developers can use their\
    \ knowledge of the website or web application to help browsers single out those\
    \ crucial resources more accurately.\n\nThis is what prefetching is, a hint for\
    \ browsers to foresee users' every browsing wish and make it come true in a snap.\n\
    \nYou can find prefetching in the [**Resource Hints**](https://w3c.github.io/resource-hints/)\
    \ specification led by Ilya Grigorik.\n\nIn what follows, I'm going to discuss:\n\
    \n- DNS-prefetching\n- Link/Resource prefetching\n- Prerendering (Page prefetching)"
  mdcn: "\n## 性能工具\n\n要在 Firefox 中打开开发者工具，请选择以下任一选项：\n\n1.  在网页上右键单击，并在上下文菜单中选择 *检查元素*。\n\
    2.  如果使用键盘，在 Windows 和 Linux 上按 Ctrl + Shift + I，在 macOS 上按 Cmd + Opt + I。\n\n\
    接下来，点击 *性能* 标签页。在这里，你会找到一个按钮，可以启动网站性能录制：\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_51_0.png)\n\
    \n点击该按钮并等待几秒钟，或在页面上执行一些操作。完成后，点击 *停止录制性能* 按钮：\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_51_1.png)\n\
    \nFirefox 几乎会立刻为你呈现大量组织良好的数据，这些数据将帮助你理解代码遇到了哪些问题。\n\n*性能* 面板中的录制结果大致如下所示：\n\n\
    ![](img/b5c46321d5b832f9c2208abb5a26242b_52_0.png)\n\n*瀑布图* 部分非常适合检查与 CSS 过渡和关键帧动画相关的问题。其他部分是\
    \ *调用树* 和 *火焰图*，你可以用它们来找出 JavaScript 代码中的瓶颈。\n\n瀑布图顶部有一个概览部分和一个详细分解部分。在这两部分中，数据都用颜色编码：\n\
    \n- 黄色条代表 JavaScript 操作。\n- 紫色条代表计算 HTML 元素的 CSS 样式（重计算样式）和页面布局（布局）。布局操作对浏览器来说执行成本很高，因此如果你动画化涉及重复布局（也称为\
    \ *重排* —— 例如 `margin`、`padding`、`top`、`left` 等）的属性，结果可能会卡顿。\n- 绿色条代表将元素绘制到一个或多个位图中（绘制）。动画化\
    \ `color`、`background-color`、`box-shadow` 等属性涉及昂贵的绘制操作，这可能是动画卡顿和用户体验不佳的原因。\n\n\
    你也可以过滤要检查的数据类型。例如，我只对与 CSS 相关的数据感兴趣，因此我可以点击屏幕左上角的过滤器图标来取消选择其他所有内容：\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_53_0.png)\n\
    \n5-4. Firefox 性能开发者工具中的过滤功能。\n\n瀑布图概览下方的大绿条代表帧率信息。\n\n健康的帧率表现应该相当高，但最重要的是要稳定\
    \ —— 即没有太多深度的间隙。\n\n让我们用一个例子来说明。\n\n## 性能工具实战\n\n这是一个使用 `@keyframes` 关键字的简单 [CSS\
    \ 动画](https://developer.mozilla.org/en-US/docs/Web/CSS/@keyframes)。测试页面如下所示：\n\
    \n![](img/b5c46321d5b832f9c2208abb5a26242b_54_0.png)\n\n5-5. 可见矩形框的演示页面。\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_54_1.png)\n\
    \n5-6. 矩形框即将滑出的演示页面。\n\n这个紫色的矩形框在视野中无限循环地滑入滑出。\n\n这是通过动画化代表屏幕上矩形框的 `<div>` 元素的\
    \ `margin-left` 属性实现的。`@keyframes` 动画块如下所示：\n\n```\n@keyframes slide-margin {\n\
    \  100% {\n    margin-left: 0;\n  }\n}\n```\n\n我从这个动画中获得的性能数据如下所示：\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_55_0.png)\n\
    \n5-7. 在 Firefox 开发者工具的性能面板中录制使用 margin 进行动画的结果。\n\n帧率可视化图看起来有点参差不齐，平均帧率为 44.82\
    \ fps，有点低。\n\n另外，请注意动画过程中发生的所有布局和绘制操作。这些是浏览器在其主线程上执行的昂贵操作，会对性能产生负面影响。\n\n最后，如果你访问\
    \ `检查器` 工具，点击 `动画` 部分并将鼠标悬停在动画名称上，会弹出一个信息框，显示有关当前动画的所有相关数据。如果你的动画已经过优化，会有一条消息说明这一事实。在这种情况下，没有消息：\n\
    \n![](img/b5c46321d5b832f9c2208abb5a26242b_56_0.png)\n\n5-8. 检查器工具中的动画面板，显示有关当前动画的信息。\n\
    \n现在，我将更改我的代码，并在浏览器使用此 `@keyframes` 块动画化 CSS `translate3d()` 属性时进行新的录制：\n\n```\n\
    @keyframes slide-three-d {\n  100% { transform: translate3d(0, 0, 0); }\n}\n```\n\
    \n性能录制结果如下所示：\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_56_1.png)\n\n5-9. 使用\
    \ translate3d 进行动画的录制结果。\n\n现在帧率更高了（56.83 fps），瀑布图中没有显示昂贵的布局和绘制操作。\n\n另外，如果你打开开发者工具的\
    \ *检查器* 标签页，访问 *动画* 面板并将鼠标悬停在动画名称上，你可以看到类似这样的内容：\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_57_0.png)\n\
    \n5-10. Firefox 开发者工具检查器中的动画面板。\n\n相对于动画名称的信息框指出所有动画都已优化，这对你的网站访问者来说是个好消息。\n\n\
    ## 只动画化 CSS *不透明度*、*变换* 和 *滤镜*\n\n你可能以前听过这个建议，但以防万一，值得再强调一遍：如果你想让动画运行流畅，请只动画化\
    \ CSS 不透明度、变换和滤镜。动画化其他所有内容会让你的浏览器在很短的时间内承受执行昂贵任务的压力，这通常无法产生最佳效果。\n\n正如浏览器中的性能工具所确认的那样，重复的布局和绘制操作不是你的朋友。\n\
    \n然而，每个浏览器处理 CSS 属性的方式略有不同。如果你想确切知道哪个浏览器为哪些属性触发布局和绘制操作（特别是在更新这些属性的值时，这正是网络动画所涉及的），请访问\
    \ [CSS Triggers](https://csstriggers.com)。\n\n为了确保动画性能，一种流行的方法是强制浏览器将更改某些属性的工作交给\
    \ GPU（图形处理单元），这减轻了浏览器主线程的一些压力，并利用了硬件加速。你可以通过使用 `will-change` CSS 属性，或者 `translateZ(0)`\
    \ 和 `translate3d(0,0,0)` 技巧来实现。所有这些技巧都有效，但如果你过度使用，实际上可能会得到你试图避免的结果，即动画卡顿。\n\n\
    我不会深入探讨用于网络动画性能的硬件加速细节，但如果你想深入研究，请查看下面列出的资源。\n\n## 资源\n\n- [高性能动画](https://aerotwist.com/blog/performant-css-animations/)\
    \ 作者：Paul Lewis 和 Paul Irish\n- [CSS 动画和过渡性能：深入浏览器内部](https://aerotwist.com/blog/css-animations-and-transitions-performance-looking-inside-the-browser/)\
    \ 作者：Max Vujovic\n- [动画与性能](https://aerotwist.com/blog/animations-and-performance/)\
    \ 作者：Paul Lewis 和 Sam Thorogood\n- [坚持使用仅限合成器的属性并管理层数](https://csstriggers.com/)\
    \ 作者：Paul Lewis\n- [GPU 合成 CSS 的技巧](https://saraoueidan.com/blog/css-gpu-hack-explained/)\
    \ 作者：Sara Soueidan\n- [CSS will-change 属性简介](https://dev.opera.com/articles/css-will-change-property/)\
    \ 作者：Nick Salloum\n- [动画化 CSS 属性](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_animated_properties)\
    \ 作者：MDN\n\n## 通过预取实现闪电般快速的网站\n\nMaria Antonietta Perna\n\n第 6 章\n\n本文是与 [SiteGround](https://www.siteground.com/)\
    \ 合作创建的系列文章的一部分。感谢支持 SitePoint 的合作伙伴。\n\n**在本文中，我将讨论预取、它是什么，以及开发者如何利用它来用高性能网站给访客留下深刻印象。**\n\
    \n## 什么是预取？\n\n虽然为网站的初始页面加载进行优化很棒，但对于当今用户所期望的高交互性网站来说，这可能还不够。\n\n如果浏览器知道用户即将点击哪个链接，或者接下来要访问哪个页面，以便内容能够自动以光速出现在他们的屏幕上，那会怎样？\n\
    \n嗯，浏览器现在*确实*可以做到这一点。事实上，一些主要的浏览器足够智能，可以根据访客的浏览模式、文档标记和结构、用户的设备、连接情况等进行此类猜测。因此，浏览器已经在尝试预判构建访客可能访问的页面所需的资源，准备好这些资源，并在用户请求时以极快的速度显示页面。然而，开发者可以利用他们对网站或网络应用的了解，帮助浏览器更准确地找出这些关键资源。\n\
    \n这就是预取，一个提示浏览器预见用户的每一个浏览愿望并立即实现它的提示。\n\n你可以在 Ilya Grigorik 领导的 [**资源提示**](https://w3c.github.io/resource-hints/)\
    \ 规范中找到预取。\n\n在下文中，我将讨论：\n\n- DNS 预取\n- 链接/资源预取\n- 预渲染（页面预取）\n"
