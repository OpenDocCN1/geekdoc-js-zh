- img_proc: true
  md: 'CDN - you keep seeing the acronym. Maybe in URLs, maybe on landing pages, but
    it never quite clicked - what are Content Delivery Networks, what do they **do**
    exactly?


    We''ll explain in this overview article, and demonstrate on two popular ones in
    followup posts.


    ![](img/b5c46321d5b832f9c2208abb5a26242b_102_0.png)


    # CDN Basics


    A CDN is a network of computers that delivers content.


    More specifically, it''s a bunch of servers geographically positioned between
    the origin server of some web content, and the user requesting it, all with the
    purpose of delivering the content faster by reducing latency. This is their *primary
    purpose*.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'These geographically closer servers, also called PoPs or Points of Presence,
    also cache the cacheable content which removes a lot of the load from the origin
    server. There are different types of CDNs offering different kinds of services,
    and they can have differing _network topology_: scattered CDNs aim to have as
    many servers scattered around the world as possible. Akamai is one such CDN. Consolidated
    CDNs have fewer points, but bigger ones built for network performance, throughput,
    and DDoS resistance.


    # Types of CDNs


    We said that their primary purpose was to reduce latency and speed up rendering.
    But in the modern world of 2MB images and 500kb JavaScript libraries that take
    3 minutes to boot up on websites, this latency matters little. But there are other
    purposes to CDNs, too, which evolved over time.


    # Content-oriented CDNs


    Initially, CDNs were just for static content (JS, CSS, HTML). You had to push
    content to them as you created/uploaded it (they didn''t know they needed to update
    their cache with your content, not even as someone requested it).


    Then, they added _origin pulling_, making things more automatic - this meant that
    a user requested the CDN''s URL, and then the CDN requested the origin website''s
    URL automatically, caching what ever it got back. Additionally, availability became
    an important factor. Many CDNs now cache a website''s "last alive" state so that
    if the origin goes down, the CDNed content is still accessible to users, creating
    the illusion of stability until things return to normal.


    Additionally, modern CDNs often offer auto-optimization layers which will automagically
    resize images and save them for future use based on the image size requested.
    This means what if your site has a 2MB header image and someone requests it on
    a 300px wide screen, the CDN will make a copy that''s 30kb in size and 300px wide
    and serve that in the future to all mobile users, automatically making the site
    faster.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# ## Security-oriented CDNs


    The final layer of practicality added to CDNs was DDoS and bot protection. CDNs
    like Incapsula specialize in this.


    As the CDN is the outermost layer of a website''s infrastructure and the first
    recipient of traffic, it can detect DDoS attacks early and block them with special
    DDoS protection servers called *scrubbers* without them ever reaching the origin
    server and crashing it.


    Additionally, by using knowledge crowdsourced from its many clients, a CDN can
    *learn* about suspicious IPs, spammers, botters, even types of crawlers and their
    behavior. For example, a scraper that works on site A will, once identified, stop
    working on site B as well if that site is protected by the same CDN, because the
    traffic filter will recognize a pattern it''s seen before.


    ![](img/b5c46321d5b832f9c2208abb5a26242b_104_0.png)


    10-2. German Shepard Guarding


    What''s more, while CDNs do allow their customers to upload custom'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'certificates, they also offer their own. This has two benefits:


    +   1. When a big vulnerability in the certificates appears, the CDNs usually
    quickly respond because they have the most to lose (all their customers). Hence,
    a fix is usually in place before most people even know about the security hole.

    2. Connections are faster because if many websites use the same CDN, then you''ve
    already established a valid connection and mutual trust with the CDN via its SSL
    certificate, and this process does not have to be repeated for every site that
    uses that CDN''s certificate. This doesn''t impact an individual website as much
    as it does *the entire web*.


    # Biggest Players


    Some of the biggest players in the CDN space are companies like Akamai, AWS Cloudfront,
    Cloudinary, Incapsula, MaxCDN, Fastly, and others.


    Rather than [compare them in full](https://example.com), we''ll list the categories
    in which each can be a champion:


    # Scraping and DDoS Protection


    While fine in every other way too, Incapsula is unbeatable in scraping and DDoS
    protection. With an extensive database of not only offending proxy IP addresses
    but also mouse and browsing patterns of bots and scrapers, Incapsula stops most
    automated attacks dead in their tracks.


    **Choose if:** you''re a web shop and don''t want your competitors to scrap your
    catalog'
  merge: -1
