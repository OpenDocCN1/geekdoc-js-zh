    \ start downloading a font, all text becomes invisible. So users look at a screen\
    \ with no text for some time, which under sub-par network conditions can feel\
    \ like forever. Furthermore, the way different browsers handle FOIT also varies:\n\
    \n+ Blink and Firefox browsers tackle FOIT by introducing a three-second timeout:\
    \ the text disappears for up to three seconds during font loading. If the font\
    \ hasn't loaded within this time frame, the website displays a fallback font,\
    \ which is subsequently replaced with the custom font once this is fully loaded.\
    \ This behavior gives rise to what is known as **FOUT** (another acronym): **Flash\
    \ Of Unstyled Text**.\n- Safari, the default Android Browser and Blackberry don't\
    \ use a timeout but display no text until the custom font is loaded. If anything\
    \ goes wrong and the font doesn't get loaded, users are left with invisible text\
    \ on the screen.\n- IE/Edge browsers don't hide text, but display the fallback\
    \ font right away, which seems to be a better design decision by Microsoft.\n\n\
    Although having a sudden change in typeface when reading text on a website is\
    \ not the best user experience, staring at a blank screen while the font is loading\
    \ sounds much worse. Ideally, a working approach should overcome both FOUT and\
    \ FOIT. However, although it's an open issue, there is some consensus among a\
    \ number of experts that FOUT is way better than FOIT.\n\nTackling the issues\
    \ related to loading fonts involves working both on optimizing the file size and\
    \ taking control of the default browser behavior so as to eliminate FOIT and minimizing\
    \ the jarring impact of FOUT.\n\nLet's look closer into each task one at a time.\n\
    \n## Tips on Optimizing Custom Font Files\n\nThere are a few steps you can take\
    \ to make sure your font files are not super heavy.\n\n### #1 Minimize the number\
    \ of typefaces in your project\n\nDon't think that just because you can choose\
    \ from tons of beautiful typefaces, you need to weigh down your website with a\
    \ multitude of different fonts. The opposite is the case.\n\nIn most situations,\
    \ a couple of judiciously paired typefaces can work wonders for your design and\
    \ have a lighter impact on website performance.\n\n### #2 Provide web font formats\
    \ based on browser support\n\nThere are four main font formats:\n\n+ **True Type\
    \ Font (TTF)**, a common font format that's been around since the late 80s\n-\
    \ **Web Open Font Format (WOFF)**, a format developed in 2009 which is Open Type\
    \ or True Type, only with compression and further metadata\n- **Web Open Font\
    \ Format (WOFF2)**, a better compressed format than WOFF\n- **Embedded Open Type\
    \ (EOT)**, a format designed by Microsoft to be used for embedded fonts on the\
    \ web.\n\nAlthough you could specify all of them in your `@font-face` declaration,\
    \ you can get away with just two of them. Here's how:\n\n```\n@font-face {\n \
    \   font-family: 'Open Sans';\n    src: local('Open Sans'),\n    local('OpenSans'),\n\
    \    url('fonts/open-sans.woff2')\n    format('woff2'),\n    url('fonts/open-sans.woff')\
    \ format('woff');\n}\n```\n\nThe first format you suggest to the browser is woff2,\
    \ which gives you the advantage of extra compression. If your browser doesn't\
    \ support woff2, it just selects woff, which has good compression and enjoys [support\
    \ by the latest versions of all major browsers](https://caniuse.com/woff2). Only\
    \ Opera Mini lacks support for it, together with IE8 and older Android Mobile\
    \ browsers. If you use a progressive enhancement approach to web development,\
    \ you could simply let these older browsers fall back on a system font, e.g.,\
    \ Arial, Verdana, etc.\n\n### #3 Load just the styles you need\n\nFonts usually\
    \ have different variants — italic, bold, etc. Each font variation adds weight\
    \ to the file size, so try to avoid adding a font variation to your `@font-face`\
    \ code if you're not going to use it on your website. Keep in mind that if you\
    \ use an `<i>` tag to add an icon, which is quite common, that is enough to get\
    \ the browser to load the italic font variant ([Slide 77 in Zack Leatherman's\
    \ Santa Clara Velocity talk of 2015](https://vimeo.com/133446040)). If that's\
    \ the only instance of `<i>` in your page, using a `<span>` tag for the icon or\
    \ setting the `font-style` for the `<i>` element to `normal` instead would spare\
    \ the browser from having to download unnecessary resources.\n\n### #4 Keep your\
    \ character sets down\n\nAvoid loading all the characters, numbers and symbols\
    \ your chosen font makes available. Instead, select just the character sets you\
    \ actually use on your webpage.\n\nYou can learn everything about fonts subsetting\
    \ in [Slash Page Load Times With CSS Font Subsetting](https://www.smashingmagazine.com/2014/11/slash-page-load-times-css-font-subsetting/),\
    \ by Dudley Storey.\n\n## Tackling FOIT\n\nLet's look at some alternatives available\
    \ today for dealing with FOIT. I've singled out the simplest approaches to implement\
    \ among effective and recommended practices. However, you can learn about far\
    \ more sophisticated ones in Zach Leatherman's [A Comprehensive Guide to Font\
    \ Loading Strategies](https://www.zachleat.com/web/comprehensive-webfonts/).\n\
    \n### Don't use custom fonts\n\nIf you can't stand the idea of your users staring\
    \ at invisible text or at font-swapping shifts, the most simpleOption is to give\
    \ up on custom fonts and rely solely on web-safe fonts.\n\nThese fonts are preinstalled\
    \ on users' devices, so the browser doesn't need to load them. Even when deciding\
    \ to use custom fonts, web safe-fonts are commonly added to the [font stack](https://www.fontstacks.com/)\
    \ as a fallback.\n\nGiving up on the perfect custom font for your design is not\
    \ an exciting approach, but it's perfectly viable — especially if you consider\
    \ this as a transitory stance until cutting edge solutions, which are already\
    \ on the horizon, gain wide browser support.\n\nOpting for this approach doesn't\
    \ require you to use `@font-face`. You just add your font stack to the CSS `font-family`\
    \ property. Here's how you could do this today:\n\n```\nbody {\n    font-family:\
    \ -apple-system, BlinkMacSystemFont,\n    \"Segoe UI\", Roboto, Oxygen-Sans, Ubuntu,\
    \ Cantarell,\n    \"Helvetica Neue\", sans-serif;\n}\n```\n\n[The New System Font\
    \ Stack?](https://www.webdesignerdepot.com/2015/01/the-new-system-font-stack/),\
    \ by Aderinokun, provides more information on the modern font stack.\n\n### The\
    \ Web Font Loader\n\nOne long-standing solution is the [Web Font Loader](https://github.com/typekit/webfontloader),\
    \ a JavaScript library developed by Google and [Typekit](https://typekit.com/),\
    \ which works with fonts coming from multiple sources — such as Google Fonts,\
    \ Typekit, your self-hosted font files, etc.\n\nThe Web Font Loader loads custom\
    \ fonts as a background process while displaying fallback fonts to users, thereby\
    \ avoiding FOIT. You can set a time limit of your choice within which the font\
    \ must load. If the request exceeds this limit, users will only see the text styled\
    \ with a fallback font. Once the custom font is loaded, the script swaps the fallback\
    \ font on the page with the custom font.\n\nHere are two awesome tutorials to\
    \ learn how to use the Web Font Loader:\n\n+ [How to Improve Page Performance\
    \ with a Font Loader](https://www.udacity.com/blog/improving-web-font-performance-with-webfontloader-20731a4a230b)\n\
    - [Loading Web Fonts with the Web Font Loader](https://www.html5rocks.com/en/tutorials/webfont/performance/)\n\
    \n### The CSS Font Loading API\n\nThe [CSS Font Loading API](https://drafts.csswg.org/css-font-loading-3/)\
    \ is a standards-based way of loading and taking control of web fonts.\n\nThe\
    \ overall recommended approach remains that of avoiding FOIT and managing FOUT\
    \ as best as possible. This API can keep track of every stage of font loading.\
    \ You can use this information to style text using web-safe fonts"
