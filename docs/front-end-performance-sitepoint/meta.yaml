    # # What are the Most-used Browsers?


    The top ten desktop browsers according to **StatCounter** for May 2017 were:


    +   1. Chrome — 59.37% market share

    2. Firefox — 12.76%

    3. Safari — 10.55%

    4. IE — 8.32%

    5. Edge — 3.42%

    6. Opera — 1.99%

    7. Android (tablet) — 1.24%

    8. Yandex Browser — 0.48%

    9. UC Browser — 0.41%

