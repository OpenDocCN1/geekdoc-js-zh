    # ## Security-oriented CDNs


    The final layer of practicality added to CDNs was DDoS and bot protection. CDNs
    like Incapsula specialize in this.


    As the CDN is the outermost layer of a website''s infrastructure and the first
    recipient of traffic, it can detect DDoS attacks early and block them with special
    DDoS protection servers called *scrubbers* without them ever reaching the origin
    server and crashing it.


    Additionally, by using knowledge crowdsourced from its many clients, a CDN can
    *learn* about suspicious IPs, spammers, botters, even types of crawlers and their
    behavior. For example, a scraper that works on site A will, once identified, stop
    working on site B as well if that site is protected by the same CDN, because the
    traffic filter will recognize a pattern it''s seen before.


    ![](img/b5c46321d5b832f9c2208abb5a26242b_104_0.png)


    10-2. German Shepard Guarding


    What''s more, while CDNs do allow their customers to upload custom'
- md: ' certificates, they also offer their own. This has two benefits:


    1. When a big vulnerability in the certificates appears, the CDNs usually quickly
    respond because they have the most to lose (all their customers). Hence, a fix
    is usually in place before most people even know about the security hole.


    2. Connections are faster because if many websites use the same CDN, then you''ve
    already established a valid connection and mutual trust with the CDN via its SSL
    certificate, and this process does not have to be repeated for every site that
    uses that CDN''s certificate. This doesn''t impact an individual website as much
    as it does *the entire web*.


    ## Biggest Players


    Some of the biggest players in the CDN space are companies like Akamai, AWS Cloudfront,
    Cloudinary, Incapsula, MaxCDN, Fastly, and others.


    Rather than [compare them in full](https://example.com), we''ll list the categories
    in which each can be a champion:


    ## Scraping and DDoS Protection


    While fine in every other way too, Incapsula is unbeatable in scraping and DDoS
    protection. With an extensive database of not only offending proxy IP addresses
    but also mouse and browsing patterns of bots and scrapers, Incapsula stops most
    automated attacks dead in their tracks.


    **Choose if:** you''re a web shop and don''t want your competitors to scrap your
    catalog


    ## Speed and Global Reach


    Akamai, the CDN that even Facebook uses, has a proven track record of global availability.
    Their scattered model of network topology and availability in even the poorer
    parts of the world (something other CDNs lack) make content served with Akamai
    smooth to load even in low-connectivity areas. A close second is AWS Cloudfront
    from Amazon.


    **Choose if:** you''re aiming for global reach, from China to US, from Finland
    to Antarctica.


    ## Affordability


    Amazon Cloudfront is the cheapest of the paid plans (we don''t count free plans
    as those often lack important features) and has the arguably largest reach after
    Akamai, which isn''t exactly cheap (a scattered topology is expensive to maintain).


    **Choose if:** price is an issue.


    ## Hotlinking


    Hotlinking is when someone selects "Copy image address" on an image hosted on
    your website, and includes it in their own directly, with the original URL intact.
    This is usually sloppy and lazy work on the side of content thieves, but can lead
    to big expenses if the copycat succeeds in sharing their site on large-impact
    social media website like Facebook or Reddit, and your server suffers for it.
    MaxCDN and KeyCDN both offer very good hotlinking protection.


    **Choose if:** you''ve got a gallery, travel blog, or any other image-rich site
    which is at risk of hotlinking.


    ## Other


    We encourage you to go out and investigate on your own. There are countless posts
    comparing the CDNs one to the other, and each plan of each CDN differs in offered
    options to the next one. It''s extremely difficult to cover them all, and the
    landscape constantly changes.


    ## Implementation Process


    Implementing a CDN typically entails changing some DNS records in the control
    panel of the registrar (the company renting you your domain name). This results
    in all traffic hitting the CDN first, which in turn hits your website. Since it
    all happens behind the scenes (through IPs), the process is transparent to the
    user.


    ![](img/b5c46321d5b832f9c2208abb5a26242b_107_0.png)


    ## 10-3. Front end vs back end


    Sometimes, sites will add a special subdomain to their main domain on which to
    host images, JavaScript, CSS, and other static content. If you open the Network
    tab of a browser''s dev console or just pay attention to the status bar of your
    browser while a site like Facebook is loading, you''ll notice a lot of URLs with
    `cdn` in them - that''s the site in question requesting only *some* of its content
    from CDNs.


    Why not request all content through CDNs? Because static content is usually big
    - 2MB images, 500kb of JS, etc. This is worth serving quickly, because a) it doesn''t
    change often and can be cached for a long time and b) removes a big, big load
    from the main server of the app, which can be dynamic.


    ## Conclusion


    In this article, you learned what a CDN was and how it works. You found out about
    the different types of CDNs and their potential scope of work, as well as the
    biggest players in the field.'
  mdcn: '

    证书，它们还提供自己的证书。这有两个好处：


    1. 当证书出现重大漏洞时，CDN 通常会迅速响应，因为他们损失最大（所有客户）。因此，修复通常在大多数人知道这个安全漏洞之前就已经到位。


    2. 连接速度更快，因为如果许多网站使用同一个 CDN，那么你已经通过其 SSL 证书与该 CDN 建立了有效的连接和互信，因此不必为使用该 CDN 证书的每个网站重复此过程。这对*整个互联网*的影响比对单个网站的影响更大。


    ## 主要玩家


    CDN 领域的一些主要玩家包括 Akamai、AWS Cloudfront、Cloudinary、Incapsula、MaxCDN、Fastly 等公司。


    我们不会[全面比较它们](https://example.com)，而是列出每个 CDN 可以成为冠军的类别：


    ## 爬虫和 DDoS 防护


    虽然 Incapsula 在其他方面也很出色，但在爬虫和 DDoS 防护方面无人能敌。凭借庞大的数据库，不仅包含恶意代理 IP 地址，还包括机器人和爬虫的鼠标行为和浏览模式，Incapsula
    能将大多数自动化攻击扼杀在萌芽状态。


    **适合选择如果你：**你是一家网店，不想让竞争对手抓取你的商品目录


    ## 速度和全球覆盖


    Akamai 是连 Facebook 都在使用的 CDN，拥有经过验证的全球可用性记录。其分散的网络拓扑模型以及在世界较贫困地区（其他 CDN 所缺乏的）的可用性，使得通过
    Akamai 提供的内容即使在连接较差的地区也能流畅加载。紧随其后的是 Amazon 的 AWS Cloudfront。


    **适合选择如果你：**你追求全球覆盖，从中国到美国，从芬兰到南极洲。


    ## 性价比


    Amazon Cloudfront 是付费计划中最便宜的（我们不计算免费计划，因为它们通常缺少重要功能），而且覆盖面可以说仅次于 Akamai（Akamai
    的价格并不便宜——分散的拓扑结构维护成本很高）。


    **适合选择如果你：**价格是个问题。


    ## 盗链防护


    盗链是指有人在你的网站上托管的图片上选择"复制图片地址"，然后直接将其嵌入自己的页面中，保留原始 URL 不变。这通常是内容窃取者的偷懒行为，但如果模仿者成功在
    Facebook 或 Reddit 等高影响力的社交媒体网站上分享其网站，你的服务器就会因此承受巨大开销。MaxCDN 和 KeyCDN 都提供非常出色的盗链保护。


    **适合选择如果你：**你有一个图片库、旅游博客或任何其他图片丰富的网站，存在被盗链的风险。


    ## 其他


    我们鼓励你亲自去调查研究。有无数的文章逐一比较各个 CDN，每个 CDN 的每个计划在提供的功能上也各不相同。要全部涵盖它们极其困难，而且这个领域一直在变化。


    ## 实施过程


    实施 CDN 通常需要在注册商（租用你域名的公司）的控制面板中更改一些 DNS 记录。这会导致所有流量先经过 CDN，然后再到达你的网站。由于这一切都在后台（通过
    IP）完成，所以整个过程对用户来说是透明的。


    ![](img/b5c46321d5b832f9c2208abb5a26242b_107_0.png)


    ## 10-3. 前端与后端


    有时，网站会在其主域名上添加一个特殊的子域名，用于托管图片、JavaScript、CSS 和其他静态内容。如果你打开浏览器开发者控制台的网络选项卡，或者在
    Facebook 等网站加载时留意浏览器的状态栏，你会注意到许多 URL 中包含 `cdn`——那就是该网站仅从 CDN 请求其*部分*内容。


    为什么不通过 CDN 请求所有内容？因为静态内容通常很大——2MB 的图片、500kb 的 JS 等。这些内容值得快速提供，因为 a) 它们不经常变化，可以长时间缓存，以及
    b) 大大减轻了应用主服务器的负担，而主服务器可能需要处理动态内容。


    ## 结论


    在本文中，你了解了 CDN 是什么以及它如何运作。你了解了不同类型的 CDN 及其潜在工作范围，以及该领域的主要玩家。

