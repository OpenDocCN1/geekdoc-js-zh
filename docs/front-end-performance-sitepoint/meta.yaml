    games console, IE6, etc. Learn the basics of progressive enhancement. Even if
    you choose not to adopt it for your full application, there will be pockets of
    functionality where it becomes invaluable.


    ## Adopt Defensive Development Techniques


    Consider the problem before reaching for the nearest pre-written module, library
    or framework. Understand the consequences of that technology before you start.
    Frameworks should provide a browser support list because they have been tested
    in limited number of applications. Learn about browser limits and quirks. For
    example, if you''re considering an SVG chart, be aware that it can look odd in
    IE9 to 11 and fail in IE8 and below. That doesn''t mean it''s a binary choice
    of rejecting SVGs or abandoning IE support. There are always compromises which
    do not incur significant development. For example:


    -   accept SVG rendering is weird but it remains usable

    -   only show a table of data in IE, or

    -   provide an SVG download which IE users can open elsewhere.


    ## Test early and test often


    You cannot possibly test every device, but developing for a single browser is
    futile. Continually test your project in a variety of applications. Leaving testing
    to the end will have catastrophic consequences. It''s easy for us to blame tools
    and browser inadequacies, but the majority of issues can be rectified during the
    development process if they''re spotted early. That''s not to say everything must
    work identically in every browser every time. Feature regressions are inevitable.
    For example:


    -   Progressive Web Apps do not work offline on iPhones and iPads — but online
    operation is fine.

    -   CSS Grid is not supported in IE — but float, flexbox or full-width block fallbacks
    should be acceptable.

    -   The desktop edition of Firefox does not show a calendar for date fields —
    but users can still enter one.


    Install a selection of browsers on your development PC. Mac and Linux users can
    obtain Microsoft Edge and IE testing tools at developer.microsoft.com/microsoft-edge/.
    It''s more difficult for Windows and Linux users to test Safari; online test services
    such as BrowserStack are the easiest option. Modern browsers have excellent mobile
    emulation facilities, but use a few real devices to appreciate touch control and
    performance on slower hardware and networks.


    **Use HTTPS on your end** The web is gradually making HTTPS the preferred protocol,
    and this trend is going to continue. Google Chrome is even starting to indicate
    that non-HTTPS sites as insecure, which is a good reason for you to configure
    your site to use HTTPS. Our web hosting partner, [SiteGround](https://www.siteground.com/),
    for example, made it easy for their clients to make the move to HTTPS. To do that,
    they automated the installation of Let’s Encrypt SSL certificates for all new
    WordPress accounts, and for existing ones, they made the switch to HTTPS possible
    with just a click.


    ## You Haven''t Answered the Question!


    The question *"which browsers should you support?"* has become too restrictive.
    Presume your answer was just "Chrome":


    -   *which devices and OS is it running on?*

    -   *what range of screen sizes will be supported?*

    -   *which version are you referring to? The latest? Chrome 10 and above?*

    -   *what happens when a new version of Chrome is released?*

    -   *what will happen in other browsers when Chrome effectively becomes your application''s
    runtime?*


    Providing a browser support list has become impractical for client-facing projects.
    Perhaps the best answer is: *"we''ll develop your project according to presumed
    demographics then test as in many devices, OSes, browsers, and versions as possible
    according to budget and time constraints"*. Even then, you''ll miss that aging
    Blackberry the CEO insists on using. Develop for the web — *not* browsers.


    ## Are Your WordPress Themes Flexible or Fast?


    Maria Antonietta Perna


    *This article is part of a series created in partnership with [SiteGround](https://www.siteground.com/).
    Thank you for supporting the partners who make SitePoint possible.*


    **If you''ve developed WordPress themes for mass distribution, you might have
    come across the problem of finding the perfect balance between building performant
    themes and building feature-rich, media-heavy products for your customers.**


    Let''s look closer into what the tension might be all about and how you can find
    ways to compromise between creating fast-loading themes and giving users the flexibility
    and easy customization options they love and expect.


    ## Are Flexibility and Performance at Odds When Coding WordPress Themes?


    I will start by saying that my discussion is not going to be about performance
    in relation to an entire WordPress website, which might include a number of different
    factors like finding a [great hosting provider](https://www.siteground.com/wordpress-hosting.htm),
    implementing caching mechanisms, leveraging both back-end and front-end techniques,
    etc.


    Also, the topic is not about the performance of WordPress themes you code from
    scratch either for your own use or for a specific client. In these particular
    cases you tailor your themes to the specific needs of yourself or your individual
    client, which should make performance optimizations easy to accommodate.


    Rather, my focus will be on WordPress themes you code for the general public,
    to be distributed on WordPress.org or an online marketplace. The scenario is one
    where you, as the theme developer, have no control over how your theme is going
    to be used and customized.


    But why could coding for performance clash with coding themes for the public?


    On the whole, performance requires you to:


    -   stick to simple designs

    -   include a limited number of features into your themes (more features are likely
    to require more processing power and resources, all of which impacts on theme
    performance)

    -   add the minimum number of page templates for a theme to function (fewer templates
    require fewer resources, which is good for performance)

    -   perform as few database queries as possible (querying the database takes time)

    -   limit the number and size of images and other media, which are notoriously
    heavy files

    -   minimize the number of HTTP requests (each round trip to the server and back
    takes some time with obvious negative consequences on performance).


    On the other hand, a considerable number of your theme''s users are likely more
    entrepreneurial than tech minded. Therefore, what they might be looking for is
    a product they can turn into pretty much anything without so much as one line
    of code, with lots of functionality out of the box, breathtaking photo and video
    assets, super delightful parallax and other animation effects, and such like.


    To give theme users all the flexibility they would like could come with some performance
    costs. But let''s go into a few specific points that illustrate how this can happen
    and how you can find some middle ground for a successful outcome.


    ## Themes are for appearance, plugins for functionality


    Although a number of reputable WordPress experts have been throwing some well-argued
    [criticisms against the so-called kitchen sink themes](kitchen sink themes) —
    that is, those multipurpose themes that can become anything to anybody by offering
    any functionality under the sun — the demand for them is still going strong.


    Themes that give users the ability to easily add social media buttons, SEO features,
    contact forms, price tables, etc., while attracting a lot of attention from buyers,
    don''t come without some serious drawbacks.


    In particular, this kind of WordPress theme comes tightly coupled with plugins
    specifically built for it, or even integrated directly into the theme. This practice
    is widely frowned upon for the following reasons:


    -   Some of the plugins that come bundled with a theme can have vulnerabilities
    that put theme users at risk. If the theme doesn''t come with specific plugins
    installed it''s less open to such risks

    -   A super important drawback of tight integration between themes and plugins
    is what Ren Ventura identifies as theme lock. Here''s his explanation of this
    problem:


    > Theme lock occurs when a WordPress user cannot change his or her theme without
    gutting most of the site’s functionality. Once the theme is deactivated, it deactivates
    things like shortcodes and custom post types that were registered by the theme.
    Without these features that the user has heavily incorporated into the site, things
    fall apart.


    As a consequence, when you change theme, a lot of the stuff you thought it was
    part of your website content disappears with the old theme. For instance, if your
    theme offered the ability to add testimonials to your website, once you change
    theme all the content related to your testimonials will be gone. Not nice.


    -   And of course, bloat and hence performance costs. Let''s say you don''t need
    a testimonials section on your website. Yet, all the code that makes that functionality
    work in the theme is still there: it takes up space on your server, which ultimately
    costs money.


    A great maxim the Theme Review Team (i.e., the volunteers who review themes submitted
    on the WordPress.org themes repo) rightly enforces is: **keep functionality separate
    from appearance. Plugins deal with functionality,**'
  mdcn: '

    更简单的接口可以在任何地方工作：现代笔记本电脑、功能手机、游戏主机、IE6 等。学习渐进增强的基础知识。即使你不打算将其应用于整个应用，也会有一些功能模块让你受益匪浅。


    ## 采用防御性开发技术


    在使用现成的预制模块、库或框架之前，先考虑问题所在。在开始之前，了解该技术的后果。框架应该提供浏览器支持列表，因为它们只在有限的应用中进行了测试。了解浏览器的限制和怪癖。例如，如果你正在考虑使用
    SVG 图表，请注意它在 IE9 到 11 中可能显示异常，在 IE8 及以下版本中会完全失效。但这并不意味着你要么拒绝 SVG，要么放弃支持 IE。总有不会显著增加开发负担的折中方案。例如：


    -   接受 SVG 渲染怪异但仍可用

    -   仅在 IE 中显示数据表格，或者

    -   提供 SVG 下载，让 IE 用户可以在其他软件中打开。


    ## 尽早测试，频繁测试


    你不可能测试每台设备，但只为单一浏览器开发是徒劳的。持续在各种应用中测试你的项目。将测试留到最后将带来灾难性的后果。我们很容易归咎于工具和浏览器的不足，但大多数问题如果能在开发早期发现，都可以得到纠正。这并不是说所有浏览器中的功能都必须完全一致。功能退化是不可避免的。例如：


    -   渐进式 Web 应用无法在 iPhone 和 iPad 上离线工作——但在线运行是正常的。

    -   CSS Grid 在 IE 中不受支持——但 float、flexbox 或全宽块级回退应该是可以接受的。

    -   Firefox 桌面版不会为日期字段显示日历——但用户仍然可以输入日期。


    在你的开发 PC 上安装多款浏览器。Mac 和 Linux 用户可以在 developer.microsoft.com/microsoft-edge/ 获取
    Microsoft Edge 和 IE 测试工具。Windows 和 Linux 用户测试 Safari 则更为困难；BrowserStack 等在线测试服务是最简单的选择。现代浏览器都有出色的移动端模拟功能，但还是要用一些真实设备来体验触控操作以及在较慢硬件和网络上的性能表现。


    **在终端使用 HTTPS** 网络正逐渐将 HTTPS 作为首选协议，这一趋势还将继续。Google Chrome 甚至开始将非 HTTPS 网站标记为不安全，这也是你配置网站使用
    HTTPS 的一个好理由。我们的网站托管合作伙伴 [SiteGround](https://www.siteground.com/)，例如，让他们的客户轻松迁移到
    HTTPS。为此，他们为所有新的 WordPress 账户自动安装了 Let''s Encrypt SSL 证书，对于现有账户，他们也只需点击一下即可切换到
    HTTPS。


    ## 你还没回答问题！


    *"应该支持哪些浏览器？"* 这个问题已经变得过于局限。假设你的答案只是 "Chrome"：


    -   *它在哪些设备和操作系统上运行？*

    -   *将支持哪些范围的屏幕尺寸？*

    -   *你指的是哪个版本？最新的？Chrome 10 及以上？*

    -   *当 Chrome 的新版本发布时会发生什么？*

    -   **当 Chrome 实际上成为你应用的运行时时，其他浏览器会发生什么？*


    提供浏览器支持列表对于面向客户的项目来说已经变得不切实际。也许最好的答案是：*"我们将根据假设的目标受众来开发项目，然后根据预算和时间限制，在尽可能多的设备、操作系统、浏览器和版本上进行测试"。*
    即便如此，你还是会遗漏那位 CEO 坚持使用的旧款黑莓。为网络开发——*而不是*为浏览器开发。


    ## 你的 WordPress 主题是灵活的还是快速的？


    Maria Antonietta Perna


    *本文是与 [SiteGround](https://www.siteground.com/) 合作创建的系列文章的一部分。感谢支持使 SitePoint
    成为可能合作伙伴们。*


    **如果你曾为大规模分发开发过 WordPress 主题，你可能会遇到在构建高性能主题和构建功能丰富、媒体密集的产品之间找到完美平衡的问题。**


    让我们更深入地了解这种紧张关系的本质，以及如何在创建快速加载的主题和赋予用户喜爱并期望的灵活性和简单自定义选项之间找到妥协之道。


    ## 在编写 WordPress 主题时，灵活性和性能是否矛盾？


    我首先要说的是，我的讨论不会涉及整个 WordPress 网站的性能，这可能包括许多不同的因素，如找到[优秀的主机提供商](https://www.siteground.com/wordpress-hosting.htm)、实施缓存机制、利用后端和前端技术等。


    此外，这个话题也不是关于为自己使用或为特定客户从头开始编写的 WordPress 主题的性能。在这些特定情况下，你根据你自己或个别客户的具体需求来定制主题，这应该使性能优化易于实现。


    相反，我的重点将放在你为大众编写的 WordPress 主题上，这些主题将在 WordPress.org 或在线市场上分发。在这种情况下，作为主题开发者的你无法控制主题将如何被使用和定制。


    但是，为什么为性能编码可能会与为公众编码主题产生冲突呢？


    总体而言，性能要求你：


    -   坚持简洁的设计

    -   在主题中包含有限数量的功能（更多功能可能需要更多的处理能力和资源，所有这些都会影响主题性能）

    -   添加主题运行所需的最少页面模板数量（更少的模板需要更少的资源，这对性能有利）

    -   尽可能少地执行数据库查询（查询数据库需要时间）

    -   限制图像和其他媒体的数量和大小，这些文件 notoriously 体积庞大

    -   最小化 HTTP 请求的数量（每次与服务器的往返都需要时间，显然会对性能产生负面影响）。


    另一方面，你的相当一部分主题用户可能更具创业精神而不是技术思维。因此，他们可能正在寻找一款无需编写一行代码就能变成几乎任何样子的产品，具有丰富的开箱即用功能、令人惊叹的的照片和视频资源、超级令人愉悦的视差和其他动画效果等等。


    为主题用户提供他们想要的所有灵活性可能会带来一些性能成本。但让我们深入几个具体要点，说明这种情况如何发生，以及你如何为成功结果找到一些中间地带。


    ## 主题负责外观，插件负责功能


    尽管一些知名的 WordPress 专家已经提出了一些有理有据的[对所谓厨房水槽主题的批评](kitchen sink themes)——即那些通过提供各种功能来满足任何人的多功能主题——但对它们的需求仍然强劲。


    让用户能够轻松添加社交媒体按钮、SEO 功能、联系表单、价格表等的主题，虽然吸引了大量买家的关注，但并非没有一些严重的缺点。


    特别是，这类 WordPress 主题与专门为它构建的插件紧密耦合，甚至直接集成到主题中。这种做法因以下原因而广受诟病：


    -   与主题捆绑的一些插件可能存在漏洞，使主题用户面临风险。如果主题没有预装特定插件，则面临此类风险的可能性较小

    -   主题与插件之间紧密集成的一个超级重要的缺点是 Ren Ventura 所说的主题锁定。以下是他对这个问题的解释：


    > 主题锁定发生在 WordPress 用户无法在不破坏网站大部分功能的情况下更换主题时。一旦主题被停用，它会停用由主题注册的短代码和自定义文章类型等功能。如果没有用户已深度整合到网站中的这些功能，一切都会崩溃。


    因此，当你更换主题时，很多你以为是网站内容一部分的东西会随旧主题一起消失。例如，如果你的主题提供了向网站添加客户评价的功能，一旦你更换主题，所有与客户评价相关的内容都会消失。这可不太妙。


    -   当然，还有臃肿及其性能成本。假设你的网站不需要客户评价部分。然而，使该功能在主题中运行的所有代码仍然存在：它占用服务器空间，最终耗费金钱。


    主题审核团队（即审查提交到 WordPress.org 主题仓库的主题的志愿者）正确执行的一条伟大格言是：**将功能与外观分离。插件处理功能，**

    '
