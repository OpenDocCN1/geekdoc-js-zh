- md: "# Conclusion\n\nCoding WordPress themes for the general public may involve\
    \ catering for diverse and sometimes incompatible needs: those of your customer\
    \ base, of web performance, hence the needs of visitors of those websites that\
    \ use your themes, and even your own needs as WordPress theme designer and creator.\n\
    \nIn this article I've expressed my views on how to address the dilemma WordPress\
    \ theme developers might face between the demands of flexibility and those of\
    \ performance.\n\n# Chapter 3\n\n# Five Techniques to Lazy Load Images for Website\
    \ Performance\n\nMaria Antonietta Perna\n\n*This article is part of a series created\
    \ in partnership with [SiteGround](https://www.siteground.com/). Thank you for\
    \ supporting the partners who make SitePoint possible.*\n\n**With images making\
    \ up a whopping <u>65%</u> of all web content, page load time on websites can\
    \ easily become an issue.**\n\nEven when <u>properly optimized</u>, images can\
    \ weigh quite a bit. This can have a negative impact on the time visitors have\
    \ to wait before they can access content on your website. Chances are, they get\
    \ impatient and navigate somewhere else, unless you come up with a solution to\
    \ image loading that doesn't interfere with the perception of speed.\n\nIn this\
    \ article, you will learn about five approaches to lazy loading images that you\
    \ can add to your web optimization toolkit to improve the user experience on your\
    \ website.\n\n## What Is Lazy Loading?\n\nLazy loading images means loading images\
    \ on websites asynchronously — that is, after the above-the-fold content is fully\
    \ loaded, or even conditionally, only when they appear in the browser's viewport.\
    \ This means that if users don't scroll all the way down, images placed at the\
    \ bottom of the page won't even be loaded.\n\nA number of websites use this approach,\
    \ but it's especially noticeable on image-heavy sites. Try browsing your favorite\
    \ online hunting ground for high-res photos, and you'll soon realize how the website\
    \ loads just a limited number of images. As you scroll down the page, you'll see\
    \ placeholder images quickly filling up with real images for preview. For instance,\
    \ notice the loader on [Unsplash.com](https://unsplash.com/): scrolling that portion\
    \ of the page into view triggers the replacement of a placeholder with a full-res\
    \ photo:\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_30_0.png)\n\n3-1. Lazy loading\
    \ in action on Unsplash.com\n\n## Why Should You Care About Lazy Loading Images?\n\
    \nThere are at least a couple of excellent reasons why you should consider lazy\
    \ loading images for your website:\n\n- If your website uses JavaScript to display\
    \ content or provide some kind of functionality to users, loading the DOM quickly\
    \ becomes critical. It's common for scripts to wait until the DOM has completely\
    \ loaded before they start running. On a site with a significant number of images,\
    \ lazy loading — or loading images asynchronously — could make the difference\
    \ between users staying or leaving your website.\n- Since most lazy loading solutions\
    \ work by loading images only if the user has scrolled to the location where images\
    \ would be visible inside the viewport, those images will never be loaded if users\
    \ never get to that point. This means considerable savings in bandwidth, for which\
    \ most users, especially those accessing the web on mobile devices and slow-connections,\
    \ will be thanking you.\n\nWell, lazy loading images helps with website performance,\
    \ but what's the best way to go about it?\n\nThere is no perfect way.\n\nIf you\
    \ live and breathe JavaScript, implementing your own lazy loading solution shouldn't\
    \ be an issue. Nothing gives you more control than coding something yourself.\n\
    \nAlternatively, you can browse the web for viable approaches and start experimenting\
    \ with them. I did just that and came across these five interesting techniques.\n\
    \n## 1 David Walsh's Simple Image Lazy Load and Fade\n\nDavid Walsh has proposed\
    \ his own custom script for lazy loading images. Here's a simplified version:\n\
    \nThe `src` attribute of the `img` tag is replaced with a `data-src` attribute\
    \ in the markup:\n\n```\n<img data-src=\"image.jpg\" alt=\"test image\">\n```\n\
    \nIn the CSS, `img` elements with a `data-src` attribute are hidden. Once loaded,\
    \ images will appear with a nice fade-in effect using CSS transitions:\n\n```\n\
    img { opacity: 1; transition: opacity 0.3s; }\nimg[data-src] { opacity: 0; }\n\
    ```\n\nJavaScript then adds the `src` attribute to each `img` element and gives\
    \ it the value of their respective `data-src` attributes. Once images have finished\
    \ loading, the script removes the `data-src` attribute from `img` elements altogether:\n\
    \n```\n.forEach.call(document.querySelectorAll('img[data-src]'), function(img)\
    \ {\n    img.setAttribute('src',\n    img.getAttribute('data-src'));\n    img.onload\
    \ = function() {\n    img.removeAttribute('data-src');\n    };\n});\n```\n\nDavid\
    \ Walsh also offers a fallback solution to cover cases where JavaScript fails,\
    \ which you can find out more about on [his blog](https://davidwalsh.name).\n\n\
    The merit of this solution: it's a breeze to implement and it's effective.\n\n\
    On the flip side, this method doesn't include loading on scroll functionality.\
    \ In other words, all images are loaded by the browser, whether users have scrolled\
    \ them into view or not. Therefore, you get the advantage of a fast loading page\
    \ because images are loaded after the HTML content. However, you don't get the\
    \ saving on bandwidth that comes with preventing unnecessary image data from being\
    \ loaded when visitors don't view the entire page content.\n\n## 2 Robin Osborne's\
    \ Progressively Enhanced Lazy Loading\n\nRobin Osborne suggests a super ingenious\
    \ solution based on [progressive enhancement](https://en.wikipedia.org/wiki/Progressive_enhancement).\
    \ In this case, lazy loading itself, which is achieved using JavaScript, is considered\
    \ the enhancement over regular HTML and CSS.\n\nWhy progressive enhancement? Well,\
    \ if you display images using a JavaScript-based solution, what happens if JavaScript\
    \ is disabled or an error occurs which prevents the script from working as expected?\
    \ In this case, without progressive enhancement, users are likely to see no images\
    \ at all. Not cool.\n\nYou can see the details of a basic version of Osborne's\
    \ solution in this [Pen](https://codepen.io), and a more comprehensive one, which\
    \ takes into account the case for *broken JavaScript*, in this other [Pen here](https://codepen.io).\n\
    \nThis technique has a number of advantages:\n\n- The progressive enhancement\
    \ approach ensures users always have access to content.\n- Not only does it cater\
    \ for a situation where JavaScript is not available, but also for those cases\
    \ when JavaScript is *broken*: we all know how error-prone scripts can be, especially\
    \ in an environment where a significant number of scripts are running.\n- It lazy\
    \ loads images on scroll, so not all images will be loaded if users don't scroll\
    \ to their location in the browser.\n- It doesn't rely on any external dependencies,\
    \ hence no frameworks or plugins are necessary.\n\nYou can learn all the details\
    \ of Robin Osborne's approach on [his blog](https://osborne.io).\n\n## 3 Lazy\
    \ Load XT jQuery Plugin\n\nA quick and easy alternative for implementing lazy\
    \ loading of images is to let a JavaScript/jQuery plugin do the heavy lifting\
    \ for you.\n\nLazy Load XT is a feature-packed jQuery plugin. You can opt for\
    \ a simplified version called `jquery.LazyLoadxt.js`, which lets you just lazy\
    \ load images. Alternatively, you can use `jquery.LazyLoadxt.extra.js`, which\
    \ is an extended version of the plugin. With the extended version, you can lazy\
    \ load iframes, videos, and generally all tags that use a `src` attribute.\n\n\
    To include Lazy Load XT in your project, at the bottom of your HTML page before\
    \ the closing `</body>` tag, add the [jQuery library](https://jquery.com/), followed\
    \ by one of the two Lazy Load XT flavors mentioned above. For instance:\n\n```\n\
    <script src=\"jquery.js\"></script>\n<script src=\"jquery.lazyloadxt.js\"></script>\n\
    ```\n\nIf you don't want to use jQuery, Lazy Load XT offers a much lighter option,\
    \ a **small script called _jqlight.LazyLoadxt.min.js_:**\n\n```\n<script src=\"\
    jqlight.lazyloadxt.js\"></script>\n<script src=\"jquery.lazyloadxt.js\"></script>\n\
    ```\n\nIn your HTML document, mark up images using a `data-src` attribute instead\
    \ of the regular `src` attribute, like this:\n\n```\n<img data-src=\"lazy.jpg\"\
    \ width=\"100\" height=\"100\" alt=\"test image\">\n```\n\nYou can then leave\
    \ the plugin to initialize itself, or you can manually initialize it yourself.\
    \ For instance, to initialize a selection of elements write:\n\n```\n$(elements).lazyLoadXT();\n\
    ```\n\nThis plugin makes tons of add-ons for extra functionality available. To\
    \ mention just a couple:\n\n- By adding `jquery.lazyloadxt.spinner.css`, you can\
    \ display an animated spinner as the image is loading.\n- You can add all the\
    \ [Animate.css](https://daneden.github.io/animate.css/) fun effects for image\
    \ loading if you just include `animate.min.css` in your project and write this\
    \ line of code in your JavaScript file: `$.LazyLoadXT.onLoad.addClass = 'animated\
    \ bounceOutLeft';`. Of course, you can replace `bounceOutLeft` with any of the\
    \ effects Animate.css provides."
  mdcn: "\n# 结论\n\n为普通用户开发 WordPress 主题可能需要满足多样化且有时相互冲突的需求：你的客户群体需求、网站性能需求（即使用你主题的网站访客的需求），甚至作为\
    \ WordPress 主题设计师和创建者你自身的需求。\n\n在本文中，我阐述了关于 WordPress 主题开发者如何在灵活性与性能要求之间寻求平衡的观点。\n\
    \n# 第三章\n\n# 五种提升网站性能的图片延迟加载技术\n\n玛丽亚·安东妮塔·佩尔纳\n\n*本文是与 [SiteGround](https://www.siteground.com/)\
    \ 合作创建的系列文章之一。感谢支持 SitePoint 的合作伙伴。*\n\n**图片占网页内容总量的 <u>65%</u>，因此网站的页面加载时间很容易成为问题。**\n\
    \n即使经过<u>适当优化</u>，图片体积仍然可能相当大。这会影响访客访问网站内容前的等待时间。除非你找到一种不影响速度感知的图片加载解决方案，否则访客很可能因不耐烦而转向其他网站。\n\
    \n本文将介绍五种图片延迟加载方法，你可以将其加入网页优化工具箱，以改善网站用户体验。\n\n## 什么是延迟加载？\n\n图片延迟加载是指异步加载网站图片——即在首屏内容完全加载后加载图片，甚至仅在图片进入浏览器视口时才条件性加载。这意味着如果用户没有滚动到底部，页面底部的图片甚至不会被加载。\n\
    \n许多网站采用这种方式，在图片密集型网站上尤为明显。尝试浏览你喜爱的高分辨率图片网站，你会发现网站仅加载有限数量的图片。随着页面滚动，占位符图片会迅速被真实预览图片填充。例如，注意\
    \ [Unsplash.com](https://unsplash.com/) 的加载指示器：滚动该页面区域时，占位符会被高分辨率照片替换。\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_30_0.png)\n\
    \n3-1. Unsplash.com 上的延迟加载实践\n\n## 为什么应该关注图片延迟加载？\n\n至少有两个充分的理由让你考虑为网站实现图片延迟加载：\n\
    \n- 如果你的网站使用 JavaScript 显示内容或为用户提供功能，快速加载 DOM 变得至关重要。通常脚本会等待 DOM 完全加载后才开始运行。对于图片数量较多的网站，延迟加载（或异步加载图片）可能影响用户留在网站还是离开。\n\
    \n- 由于大多数延迟加载方案仅在用户滚动到图片在视口中可见的位置时才加载图片，如果用户从未滚动到该位置，这些图片永远不会被加载。这意味着可以显著节省带宽，特别是对于通过移动设备和慢速连接访问网络的用户，他们会对此心怀感激。\n\
    \n虽然延迟加载图片有助于提升网站性能，但最佳实现方式是什么？\n\n并没有完美的方案。\n\n如果你精通 JavaScript，实现自定义的延迟加载方案应该不成问题。没有什么比自己编码更能掌控全局。\n\
    \n或者，你可以浏览网络寻找可行方案并开始尝试。我正是这样做了，并发现了这五种有趣的技术。\n\n## 1 David Walsh 的简单图片延迟加载与淡入效果\n\
    \nDavid Walsh 提出了自定义的图片延迟加载脚本。这是一个简化版本：\n\n在标记中，`img` 标签的 `src` 属性被替换为 `data-src`\
    \ 属性：\n\n```\n<img data-src=\"image.jpg\" alt=\"test image\">\n```\n\n在 CSS 中，带有\
    \ `data-src` 属性的 `img` 元素被隐藏。加载完成后，图片将使用 CSS 过渡效果淡入显示：\n\n```\nimg { opacity:\
    \ 1; transition: opacity 0.3s; }\nimg[data-src] { opacity: 0; }\n```\n\nJavaScript\
    \ 为每个 `img` 元素添加 `src` 属性，并赋予其对应的 `data-src` 属性值。图片加载完成后，脚本会移除 `img` 元素的 `data-src`\
    \ 属性：\n\n```\n.forEach.call(document.querySelectorAll('img[data-src]'), function(img)\
    \ {\n    img.setAttribute('src',\n    img.getAttribute('data-src'));\n    img.onload\
    \ = function() {\n    img.removeAttribute('data-src');\n    };\n});\n```\n\nDavid\
    \ Walsh 还提供了一个备选方案来处理 JavaScript 失效的情况，你可以在[他的博客](https://davidwalsh.name)了解更多。\n\
    \n该方案的优点：实现简单且效果显著。\n\n另一方面，这种方法不包含滚动时加载功能。换言之，无论用户是否滚动到图片位置，所有图片都会被浏览器加载。因此，虽然页面加载速度快（因为图片在\
    \ HTML 内容之后加载），但无法通过阻止不必要的图片数据加载来节省带宽。\n\n## 2 Robin Osborne 的渐进增强式延迟加载\n\nRobin\
    \ Osborne 提出了一种基于[渐进增强](https://en.wikipedia.org/wiki/Progressive_enhancement)的巧妙方案。在这里，通过\
    \ JavaScript 实现的延迟加载本身被视为对常规 HTML 和 CSS 的增强。\n\n为什么选择渐进增强？如果你使用基于 JavaScript 的方案显示图片，当\
    \ JavaScript 被禁用或脚本因错误无法正常工作时会发生什么？在这种情况下，没有渐进增强的话，用户很可能看不到任何图片。这可不太好。\n\n你可以在\
    \ [CodePen](https://codepen.io) 查看 Osborne 方案的基础版本详情，在[另一个 CodePen](https://codepen.io)\
    \ 查看更全面的版本（考虑了 *JavaScript 失效* 的情况）。\n\n这项技术具有多重优势：\n\n- 渐进增强方法确保用户始终能访问内容。\n\
    - 不仅处理了 JavaScript 不可用的情况，还考虑了 JavaScript *失效* 的场景：我们都知道脚本容易出错，尤其是在多个脚本同时运行的环境中。\n\
    - 它在滚动时延迟加载图片，因此如果用户没有滚动到图片位置，就不会加载所有图片。\n- 不依赖任何外部依赖，无需框架或插件。\n\n你可以在 [Robin\
    \ Osborne 的博客](https://osborne.io) 学习该方案的全部细节。\n\n## 3 Lazy Load XT jQuery 插件\n\
    \n实现图片延迟加载的一个快速简便的替代方案是使用 JavaScript/jQuery 插件来处理繁重的工作。\n\nLazy Load XT 是一个功能丰富的\
    \ jQuery 插件。你可以选择名为 `jquery.LazyLoadxt.js` 的简化版本，它仅支持图片延迟加载。或者，你可以使用 `jquery.LazyLoadxt.extra.js`，这是插件的扩展版本。通过扩展版本，你可以延迟加载\
    \ iframe、视频以及所有使用 `src` 属性的标签。\n\n要在项目中使用 Lazy Load XT，请在 HTML 页面底部 `</body>`\
    \ 标签前添加 [jQuery 库](https://jquery.com/)，然后添加上述两种 Lazy Load XT 版本之一。例如：\n\n```\n\
    <script src=\"jquery.js\"></script>\n<script src=\"jquery.lazyloadxt.js\"></script>\n\
    ```\n\n如果你不想使用 jQuery，Lazy Load XT 提供了一个更轻量的选择：**一个名为 _jqlight.LazyLoadxt.min.js_\
    \ 的小脚本：**\n\n```\n<script src=\"jqlight.lazyloadxt.js\"></script>\n<script src=\"\
    jquery.lazyloadxt.js\"></script>\n```\n\n在 HTML 文档中，使用 `data-src` 属性标记图片，而不是常规的\
    \ `src` 属性，如下所示：\n\n```\n<img data-src=\"lazy.jpg\" width=\"100\" height=\"100\"\
    \ alt=\"test image\">\n```\n\n然后你可以让插件自行初始化，或手动初始化。例如，要初始化选定元素，可编写：\n\n```\n$(elements).lazyLoadXT();\n\
    ```\n\n该插件提供了大量扩展插件以增强功能。仅举几例：\n\n- 通过添加 `jquery.lazyloadxt.spinner.css`，可以在图片加载时显示动画旋转指示器。\n\
    - 只需在项目中包含 `animate.min.css` 并在 JavaScript 文件中添加这行代码：`$.LazyLoadXT.onLoad.addClass\
    \ = 'animated bounceOutLeft';`，即可为图片加载添加所有 [Animate.css](https://daneden.github.io/animate.css/)\
    \ 的趣味效果。当然，你可以将 `bounceOutLeft` 替换为 Animate.css 提供的任何效果。\n"
