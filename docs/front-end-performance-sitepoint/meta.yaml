  md: '# Preface


    Performance simply matters. Technology may allow us to “go bigger”, but maybe
    not necessarily be better when it comes to performance. Servers and Internet connections
    are getting more sophisticated, and as a result, we feel the need to keep filling
    them. However, this isn’t the time to become lazy. This is the time to utilize
    the amazing tools that are available for making websites faster, and to learn
    how to improve user experience and satisfaction.


    This is a practical collection of tutorials on front-end website performance for
    web developers. It’s packed with useful, real world hints and tips that you can
    use on your sites today.


    # Who Should Read This Book?


    This book is for all front-end developers that want to build sites and apps that
    run faster. You’ll need to be familiar with HTML and CSS and have a reasonable
    level of understanding of JavaScript in order to follow the discussion.


