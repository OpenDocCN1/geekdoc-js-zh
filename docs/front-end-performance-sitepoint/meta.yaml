    your users'' browser to a crawl while capping off their data plans.


    Try shipping less JS. You might not need [the entire Lodash library](https://www.npmjs.com/package/lodash)
    for your project. Do you absolutely *need* to use a JS framework? If yes, have
    you considered using something other than React, such as [Preact](https://preactjs.com/)
    or [HyperHTML](https://viperhtml.js.org/hyper.html), which are less than 1/20
    the size of React? Do you need [TweenMax](https://greensock.com/tweenmax) for
    that scroll-to-top animation? The convenience of npm and isolated components in
    frameworks comes with a downside: the first response of developers to a problem
    has become to throw more JS at it. When all you have is a hammer, everything looks
    like a nail.


    When you''re done pruning the weeds and shipping less JS, try shipping it *smarter*.
    Ship what you need, when you need it.


    Webpack 3 has *amazing* features called [code splitting](https://webpack.js.org/guides/code-splitting/)
    and [dynamic imports](https://webpack.js.org/guides/code-splitting/#dynamic-imports).
