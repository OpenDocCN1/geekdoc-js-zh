    **With images making up a whopping <u>65%</u> of all web content, page load time
    on websites can easily become an issue.**


    Even when <u>properly optimized</u>, images can weigh quite a bit. This can have
    a negative impact on the time visitors have to wait before they can access content
    on your website. Chances are, they get impatient and navigate somewhere else,
    unless you come up with a solution to image loading that doesn''t interfere with
    the perception of speed.


    In this article, you will learn about five approaches to lazy loading images that
    you can add to your web optimization toolkit to improve the user experience on
    your website.


    # # What Is Lazy Loading?


    Lazy loading images means loading images on websites asynchronously — that is,
    after the above-the-fold content is fully loaded, or even conditionally, only
    when they appear in the browser''s viewport. This means that if users don''t scroll
    all the way down, images placed at the bottom of the page won''t even be loaded.


    A number of websites use this approach, but it''s especially noticeable on image-heavy
    sites. Try browsing your favorite online hunting ground for high-res photos, and
    you''ll soon realize how the website loads just a limited number of images. As
    you scroll down the page, you''ll see placeholder images quickly filling up with
    real images for preview. For instance, notice the loader on [Unsplash.com](https://unsplash.com/):
    scrolling that portion of the page into view triggers the replacement of a placeholder
    with a full-res photo:'
  merge: -1
  pgno: 29
- img_proc: true
  md: '![](img/b5c46321d5b832f9c2208abb5a26242b_30_0.png)


    3-1. Lazy loading in action on Unsplash.com


    # # Why Should You Care About Lazy Loading Images?


    There are at least a couple of excellent reasons why you should consider lazy
    loading images for your website:


    +   - If your website uses JavaScript to display content or provide some kind
    of functionality to users, loading the DOM quickly becomes critical. It''s common
    for scripts to wait until the DOM has completely loaded before they start running.
    On a site with a significant number of images, lazy loading — or loading images
    asynchronously — could make the difference between users staying or leaving your
    website.

    - Since most lazy loading solutions work by loading images only if the user has
    scrolled to the location where images would be visible inside the viewport, those
    images will never be loaded if users never get to that point. This means considerable
    savings in bandwidth, for which most users, especially those accessing the web
    on mobile devices and slow-connections, will be thanking you.'
