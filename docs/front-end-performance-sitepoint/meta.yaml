- md: "# Chapter 10: What Is a CDN and How Does It Work?\n\n- CDN Basics [103]\n-\
    \ Types of CDNs [104]\n- Biggest Players [106]\n- Implementation Process [108]\n\
    - Conclusion [109]\n\n# Preface\n\nPerformance simply matters. Technology may\
    \ allow us to “go bigger”, but maybe not necessarily be better when it comes to\
    \ performance. Servers and Internet connections are getting more sophisticated,\
    \ and as a result, we feel the need to keep filling them. However, this isn’t\
    \ the time to become lazy. This is the time to utilize the amazing tools that\
    \ are available for making websites faster, and to learn how to improve user experience\
    \ and satisfaction.\n\nThis is a practical collection of tutorials on front-end\
    \ website performance for web developers. It’s packed with useful, real world\
    \ hints and tips that you can use on your sites today.\n\n# Who Should Read This\
    \ Book?\n\nThis book is for all front-end developers that want to build sites\
    \ and apps that run faster. You’ll need to be familiar with HTML and CSS and have\
    \ a reasonable level of understanding of JavaScript in order to follow the discussion.\n\
    \n# Conventions Used\n\nYou’ll notice that we’ve used certain typographic and\
    \ layout styles throughout this book to signify different types of information.\
    \ Look out for the following items.\n\n# Code Samples\n\nCode in this book is\
    \ displayed using a fixed-width font, like so:\n\n```\n<h1>A Perfect Summer's\
    \ Day</h1>\n<p>It was a lovely day for a walk in the park.\nThe birds were singing\
    \ and the kids were all back at school.</p>\n```\n\nWhere existing code is required\
    \ for context, rather than repeat all of it, ⋮ will be displayed:\n\n```\nfunction\
    \ animate() {\n    :\nnew_variable = \"Hello\";\n}\n```\n\nSome lines of code\
    \ should be entered on one line, but we've had to wrap them because of page constraints.\
    \ An ↵ indicates a line break that exists for formatting purposes only, and should\
    \ be ignored:\n\n```\nURL.open(\"http://www.sitepoint.com/responsive-web-↵design-real-user-testing/?responsive1\"\
    );\n```\n\n## Tips, Notes, and Warnings\n\n### **Hey, You!**\n\nTips provide helpful\
    \ little pointers.\n\n### **Ahem, Excuse Me ...**\n\nNotes are useful asides that\
    \ are related—but not critical—to the topic at hand. Think of them as extra tidbits\
    \ of information.\n\n### **Make Sure You Always ...**\n\n... pay attention to\
    \ these important points.\n\n### **Watch Out!**\n\nWarnings highlight any gotchas\
    \ that are likely to trip you up along the way.\n\n# Which Browsers Should Your\
    \ Website Support?\n\nCraig Buckler\n\nChapter 1\n\nThe question \"*which browsers\
    \ should my website/app support?*\" is **often raised by clients and developers.\
    \ The simple answer is a list of the top N mainstream applications. But has that\
    \ policy become irrelevant?**\n\n## What are the Most-used Browsers?\n\nThe top\
    \ ten desktop browsers according to **StatCounter** for May 2017 were:\n\n1. Chrome\
    \ — 59.37% market share\n2. Firefox — 12.76%\n3. Safari — 10.55%\n4. IE — 8.32%\n\
    5. Edge — 3.42%\n6. Opera — 1.99%\n7. Android (tablet) — 1.24%\n8. Yandex Browser\
    \ — 0.48%\n9. UC Browser — 0.41%\n10. Coc Coc — 0.33%\n\n**Mobile now accounts\
    \ for 54.25% of all web use** so we also need to examine the top ten phone browsers:\n\
    \n1. Chrome — 49.23%\n2. Safari — 17.73%\n3. UC Browser — 15.89%\n4. Samsung Internet\
