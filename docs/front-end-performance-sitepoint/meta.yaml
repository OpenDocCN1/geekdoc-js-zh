    \ format('woff2'),\n       url('/web/css/fonts/lato/lato-regular-webfont.woff')\
    \ format('woff');\n  font-weight: 400;\n  font-style: normal;\n  font-display:\
    \ swap;\n}\n\nbody {\n  font-family: Lato, sans-serif;\n  font-weight: 400;\n\
    \  font-style: normal;\n}\n```\n\nAccepted values for this property are:\n\n+\
    \   - **auto**: browsers just implement their default behavior.\n- **block**:\
    \ browsers draw invisible text while the font is loading and replace it with the\
    \ desired font as soon as it's loaded.\n- **swap**: browsers use a fallback font\
    \ while the custom font isn't available, but swap the custom font in as soon as\
    \ it loads.\n- **fallback**: similar behavior to `swap`. However, if too much\
    \ time passes until the custom font loads, browsers use the fallback font for\
    \ the duration of the page's lifetime.\n- **optional**: this super smart value\
    \ lets browsers use the custom font only if it's already available. If it isn't,\
    \ browsers use the fallback for the duration of the page's lifetime. The custom\
    \ font may still be downloaded in the background for use on subsequent page loads.\
    \ However, if browsers detect limited bandwidth on users' devices, they might\
    \ not load the custom font at all.\n\nFrom these short descriptions, you can already\
    \ see how `swap` and `optional` could be super useful.\n\n**Browser support**\
    \ for `font-display` is non-existent at this time, but it can be enabled in Chrome\
    \ (via the Experimental Web Platform features\" flag) and"
