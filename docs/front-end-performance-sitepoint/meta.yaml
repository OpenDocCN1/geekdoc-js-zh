    \ Invisible Text**, or **FOIT** for short.\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_68_0.png)\n\
    \n7-1. FOIT: Page at http://blog.instagram.com/ while fonts are loading on Firefox\
    \ v.52. Text is invisible.\n\n![](img/b5c46321d5b832f9c2208abb5a26242b_69_0.png)\n\
    \n7-2. FOIT: Page at http://blog.instagram.com/ after fonts have been loaded on\
