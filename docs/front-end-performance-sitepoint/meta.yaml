    This article is part of a series created in partnership with [SiteGround](https://www.siteground.com/).
    Thank you for supporting the partners who make SitePoint possible.


    **In this article, I''ll discuss prefetching, what it is, and how developers can
    use it to wow visitors with high-performance websites.**


    # What Is Prefetching?


    Although optimizing a website for initial page load is great, for the highly interactive
    websites users expect today, this might not be enough.


    What if browsers knew which link users were about to click, or which page they
    were about to visit next, so that content could automagically appear on their
    screen at the speed of light?


    Well, browsers *can* do that now. In fact, some major browsers are smart enough
    to make these kinds of guesses based on visitors'' browsing patterns, document
    markup and structure, the user''s device, connectivity, etc. Therefore, browsers
    already try to anticipate the resources needed to build the page visitors are
    likely to access, get those resources ready and display the page at warp speed
    when users request it. However, developers can use their knowledge of the website
    or web application to help browsers single out those crucial resources more accurately.


    This is what prefetching is, a hint for browsers to foresee users'' every browsing
    wish and make it come true in a snap.


    You can find prefetching in the [**Resource Hints**](https://w3c.github.io/resource-hints/)
    specification led by Ilya Grigorik.


    In what follows, I''m going to discuss:


    +   - DNS-prefetching

    - Link/Resource prefetching

    - Prerendering (Page prefetching)'
- md: '## DNS-Prefetching


    The internet is a network of computer-readable [IP addresses](e.g., 87.87.87.87)
    that are referenced by human-readable hostnames (e.g., yoursite.com). DNS is the
    protocol that converts hostnames into IP addresses.


    Each time the browser makes an HTTP request for a resource on a different domain,
    it can spend a few milliseconds to resolve the domain to the associated IP address.


    If a website has a Twitter or Facebook widget, Google Analytics, and perhaps one
    or two custom web fonts, then it must have links to other domains. This makes
    DNS lookups unavoidable.


    DNS prefetching helps to decrease waiting time for visitors because the browser
    performs DNS lookups before it sends a request for resources located on other
    domains.


    So, let''s say developers know a website will make a request to somewidget.example.com.
    They can drop a hint for the browser suggesting it to go ahead and prefetch that
    hostname''s DNS by adding a `rel` attribute to the link with the value of `dns-prefetch`,
    like this:


    ```

    <link rel="dns-prefetch" href="//somewidget.example.com">

    ```


    Now, when the request to somewidget.example.com takes place, the browser has already
    performed the DNS lookup ahead of time and users get the results delivered a bit
    sooner.


    [Browser support for DNS-prefetch](https://caniuse.com/#feat=dns-prefetch) at
    this time is present in all major desktop browsers. When support for DNS-prefetching
    is lacking, browsers simply retrieve resources in the usual way. No big deal.


    What if the browser never requests the DNS-prefetched resource? Thankfully, DNS-prefetching
    is not a costly operation, since it doesn''t send more than just a few hundred
    bytes over the network. Once again, no harm done.


    ## Link Prefetching


    According to the [spec](https://example.com/spec), link prefetching ...


    > is used to identify a resource that might be required by the next navigation,
    and that the user agent SHOULD fetch, such that the user agent can deliver a faster
    response once the resource is requested in the future.


    In other words, if developers have grounds to assume users are likely to visit
    a specific web page and know the browser needs some critical resources to deliver
    it, they can use the `prefetch` directive. This points the browser towards the
    resources it should fetch before users actually navigate to that page.


    Keep in mind that prefetching only works with cacheable resources, such as JavaScript,
    images and so on. Here''s what the code looks like:


    ```

    <link rel="prefetch" href="//example.com/future-image.jpg">

    ```


    The browser now knows that the `future-image.jpg` image is going to be needed
    soon, so it can prefetch it and store it locally in the cache. At that point,
    because the browser will have already done the time-consuming work of downloading
    the resource in the background, the benefit of this technique consists in super-fast
    rendering as soon as users click to access the relevant page requiring `future-image.jpg`.


    Link prefetching is great at creating the perception of a fast-loading website,
    but it''s a much more expensive operation than DNS-prefetching. If users never
    access the page which needs the prefetched asset, the browser will have downloaded
    unnecessary data and clogged up its cache.


    At the time of writing, link prefetching is <u>supported by the latest versions
    of Chrome, Firefox, IE/Edge and Opera</u>. Non-supporting browsers will simply
    ignore the hint.


    ## Page Prefetching/Prerendering


    Implementing page prefetching or prerendering is just a matter of adding the `prerender`
    directive inside a link''s `rel` attribute, like this:


    ```

    <link rel="prerender" href="//example.com/future-page.html">

    ```


    Prerendering goes all the way and literally creates an invisible version of the
    entire page users are likely to go to next, including applying CSS and executing
    JavaScript. As soon as users click on the relevant link, the ghost page instantly
    materializes before their eyes, replacing the old content.


    If link prefetching can be an expensive operation, prerendering is even more so.
    In this case, browsers download an entire web page and all its resources on the
    basis of an expectation that users will visit that page, which ultimately may
    or may not happen.


    At this time, prerendering is <u>supported in IE/Edge, Chrome and Opera</u>.


    ## Use Cases for Link Prefetching and Prerendering


    Since both link prefetching and (to a greater extent) prerendering don''t come
    cheap, having a definite idea of when it''s suitable to implement them on a web
    page is important.


    Devs who plan on using resource hints should do so when they have solid grounds
    for assuming which resources to prefetch or prerender based on the website''s
    content, users'' behavior, analytics, etc.


    The Resource Hints spec indicates a number of [use cases](https://resourcehints.github.io/#use-cases)
    where link prefetching could benefit user experience:


    - Search results — It’s reasonable to assume users are interested in those results,
    therefore it’s likely they’re going to click the links leading to the content
    they’re after.

    - Paginated content — Once users are reading the first page of a multi-page article,
    it’s not too far-fetched to assume they’re going to click the link that lands
    them on the next page.

    - Image galleries — Google devs use prefetching on Picasa Web Albums. If users
    are viewing a photo, developers are justified in guessing that the next photo
    is also going to be accessed, so they instruct the browser to download it as soon
    as possible.


    Similarly, Santiago Valdarrama offers some [helpful tips](https://santoshyadav.dev/how-can-i-make-my-website-faster-with-prefetching)
    on when developers could reasonably consider implementing prerendering on a website:


    > When deciding whether to prerender entire pages ahead of time, consider that
    Google prerenders the top results on its search page, and Chrome prerenders pages
    based on the historical navigation patterns of users. Using the same principle,
    you can detect common usage patterns and prerender target pages accordingly. You
    can also use it, just like resource prefetching, on questionnaires or surveys
    where you know users will complete the workflow in a particular order.


    ## Resources


    If you''d like to dig deeper, the following resources are a must-read:


    - [Resource Hints Specification](https://www.w3.org/TR/resource-hints/)

    - [Web Performance Tricks — Beyond the Basics](https://www.smashingmagazine.com/2016/12/)

    - [Prefetching resources](https://developer.mozilla.org/en-US/docs/Web/HTTP/Link_prefetching_FAQ)

    - [Prefetching, preloading, prebrowsing](https://css-tricks.com/prefetching-preloading-prebrowsing/)

    - [One Step Ahead: Improving Performance with Prebrowsing](https://medium.com/@luisvieira_gmr/one-step-ahead-improving-performance-with-prebrowsing-8baedb7937f4)

    - [Front-end performance for web designers and front-end developers](https://developer.yahoo.com/performance/rules.html)


    ## Conclusion


    DNS-prefetching, link prefetching and prerendering are powerful optimization techniques.
    If **implemented responsibly**, on the basis of the knowledge developers have
    of web content and user behavior, prefetching can considerably improve user experience.


    # Optimizing Web Fonts for Performance: the State of the Art


    ## Chapter 7


    Maria Antonietta Perna


    **67% of webpages now use custom fonts.** However, popularity and widespread adoption
    haven''t come without some performance and user experience-related issues.


    In this article, I''ll go through what''s not so good about the way web fonts
    are commonly used and loaded, as well as point you to well-tested workarounds
    and future standards-based solutions.


    ## Why Custom Web Fonts?


    Users come to your website for content. Therefore, great typography is crucial
    on the web: readability, legibility and well-crafted typographic design are a
    must for brand recognition and the success of your message.


    The best way to achieve beautiful typography is by loading custom web fonts —
    that is, font files that are not already installed on users'' devices.


    Since browser support for the CSS `@font-face` rule has become widespread, using
    custom web fonts in websites has increased by leaps and bounds. However, fonts
    can have a heavy file size, and loading extra resources on your website doesn''t
    come without some negative impact on performance.


    Since file size can certainly be an issue, paying attention to how custom web
    fonts are loaded comes to the forefront.


    ## What Is the Flash of Invisible Text (FOIT) All About?


    The most common way of using a custom web font is to specify the fonts used inside
    a CSS `@font-face` declaration and leave the browser to its default behavior.
    This is not ideal. Since information about fonts is located in the CSS, by default
    browsers delay the loading of fonts until the CSS is parsed. That''s not all.
    As [Zach Leatherman](https://zachleat.com/) has made abundantly clear, to trigger
    a font download, a number of conditions must be met besides a valid `@font-face`
    declaration:'
  mdcn: '

    ## DNS 预解析


    互联网是一个由计算机可读的 [IP 地址](例如，87.87.87.87) 组成的网络，这些地址通过人类可读的主机名（例如，yoursite.com）来引用。DNS
    就是将主机名转换为 IP 地址的协议。


    每次浏览器向不同域上的资源发出 HTTP 请求时，它都会花费几毫秒的时间将域解析为关联的 IP 地址。


    如果一个网站有 Twitter 或 Facebook 小部件、Google Analytics，以及可能一两个自定义网络字体，那么它必然有指向其他域的链接。这使得
    DNS 查询不可避免。


    DNS 预解析有助于减少访问者的等待时间，因为浏览器会在发送位于其他域上的资源请求之前执行 DNS 查询。


    所以，假设开发人员知道某个网站将向 somewidget.example.com 发出请求。他们可以给浏览器一个提示，建议它继续预取该主机名的 DNS，方法是在链接中添加一个值为
    `dns-prefetch` 的 `rel` 属性，如下所示：


    ```

    <link rel="dns-prefetch" href="//somewidget.example.com">

    ```


    现在，当向 somewidget.example.com 发出请求时，浏览器已经提前执行了 DNS 查找，用户能够更快地获得结果。


    [DMS 预解析的浏览器支持](https://caniuse.com/#feat=dns-prefetch) 目前已存在于所有主流桌面浏览器中。当缺乏 DNS
    预解析支持时，浏览器只会以通常方式检索资源。没什么大不了的。


    如果浏览器从不请求 DNS 预解析的资源怎么办？幸运的是，DNS 预解析并不是一项昂贵的操作，因为它通过网络发送的数据不会超过几百字节。再次强调，不会造成任何损害。


    ## 链接预取


    根据 [规范](https://example.com/spec)，链接预取……


    > 用于识别下一导航可能需要的资源，用户代理应该获取该资源，以便在将来请求该资源时能够提供更快的响应。


    换句话说，如果开发人员有理由假设用户可能会访问某个特定网页，并且知道浏览器需要一些关键资源来交付该页面，他们可以使用 `prefetch` 指令。这引导浏览器在用户实际导航到该页面之前获取它应该获取的资源。


    请记住，预取仅适用于可缓存的资源，例如 JavaScript、图像等。代码如下所示：


    ```

    <link rel="prefetch" href="//example.com/future-image.jpg">

    ```


    浏览器现在知道 `future-image.jpg` 图像很快就会被需要，因此它可以预取该图像并将其本地存储在缓存中。此时，由于浏览器已经完成了在后台下载资源这一耗时工作，该技术的好处在于用户点击访问需要
    `future-image.jpg` 的相关页面时能够实现超快速渲染。


    链接预取在创建网站快速加载的感知方面表现出色，但它比 DNS 预解析要昂贵得多。如果用户从不访问需要预取资源的页面，浏览器将下载不必要的数据并堵塞其缓存。


    在撰写本文时，链接预取<u>受 Chrome、Firefox、IE/Edge 和 Opera 的最新版本支持</u>。不支持的浏览器将简单地忽略该提示。


    ## 页面预取/预渲染


    实现页面预取或预渲染只需在链接的 `rel` 属性中添加 `prerender` 指令，如下所示：


    ```

    <link rel="prerender" href="//example.com/future-page.html">

    ```


    预渲染更进一步，它 literally 创建了一个用户可能访问的预制页面的隐形版本，包括应用 CSS 和执行 JavaScript。一旦用户点击相关链接，幽灵页面就会立即在他们眼前具体化，取代旧内容。


    如果说链接预取可能是一项昂贵的操作，那么预渲染则更加如此。在这种情况下，浏览器基于用户将访问该页面的预期下载整个网页及其所有资源，而这最终可能会发生也可能不会发生。


    目前，预渲染<u>在 IE/Edge、Chrome 和 Opera 中得到支持</u>。


    ## 链接预取和预渲染的用例


    由于链接预取和（更大程度上的）预渲染都不便宜，明确了解在网页上何时适合实现它们很重要。


    计划使用资源提示的开发人员应该在有充分理由假设要预取或预渲染哪些资源时这样做，这些假设基于网站内容、用户行为、分析等。


    资源提示规范指出了许多[用例](https://resourcehints.github.io/#use-cases)，在这些用例中链接预取可以改善用户体验：


    - **搜索结果** — 可以合理地假设用户对这些结果感兴趣，因此他们很可能会点击链接以找到他们想要的内容。

    - **分页内容** — 一旦用户正在阅读多页文章的第一页，假设他们会点击链接进入下一页并不为过。

    - **图片库** — Google 开发人员在 Picasa 网络相册上使用预取。如果用户正在查看一张照片，开发人员有理由猜测下一张照片也会被访问，因此他们指示浏览器尽快下载它。


    同样，Santiago Valdarrama 提供了一些[有用的提示](https://santoshyadav.dev/how-can-i-make-my-website-faster-with-prefetching)，说明开发人员何时可以合理地考虑在网站上实现预渲染：


    > 在决定是否提前预渲染整个页面时，考虑到 Google 会预渲染其搜索页面上的顶部结果，Chrome 会根据用户的历史导航模式预渲染页面。使用相同的原理，您可以检测常见的使用模式并相应地预渲染目标页面。您也可以像资源预取一样，在问卷或调查中使用它，您知道用户将以特定顺序完成工作流程。


    ## 资源


    如果您想深入了解，以下资源是必读的：


    - [资源提示规范](https://www.w3.org/TR/resource-hints/)

    - [Web 性能技巧 — 超越基础](https://www.smashingmagazine.com/2016/12/)

    - [预取资源](https://developer.mozilla.org/en-US/docs/Web/HTTP/Link_prefetching_FAQ)

    - [预取、预加载、预浏览](https://css-tricks.com/prefetching-preloading-prebrowsing/)

    - [领先一步：通过预浏览提高性能](https://medium.com/@luisvieira_gmr/one-step-ahead-improving-performance-with-prebrowsing-8baedb7937f4)

    - [面向网页设计师和前端开发人员的前端性能](https://developer.yahoo.com/performance/rules.html)


    ## 结论


    DNS 预解析、链接预取和预渲染是强大的优化技术。如果**负责任地实施**，基于开发人员对网页内容和用户行为的了解，预取可以显著改善用户体验。


    # 优化 Web 字体性能：最新技术


    ## 第 7 章


    Maria Antonietta Perna


    **67% 的网页现在使用自定义字体。** 然而，普及和广泛采用并非没有带来一些与性能和用户体验相关的问题。


    在本文中，我将介绍 Web 字体常见使用和加载方式的不足之处，并为您指向经过充分测试的变通方法和基于标准的未来解决方案。


    ## 为什么选择自定义 Web 字体？


    用户访问您的网站是为了内容。因此，出色的排版在网上至关重要：可读性、易读性和精心设计的排版对于品牌识别和您信息的成功必不可少。


    实现精美排版的最佳方式是加载自定义 Web 字体 — 即，尚未安装在用户设备上的字体文件。


    由于浏览器对 CSS `@font-face` 规则的支持已变得广泛，在网站中使用自定义 Web 字体已经大幅增长。然而，字体可能具有较大的文件大小，在您的网站上加载额外资源不可避免地会对性能产生一些负面影响。


    由于文件大小确实可能是一个问题，关注自定义 Web 字体的加载方式变得至关重要。


    ## 什么是不可见文本闪烁（FOIT）？


    使用自定义 Web 字体最常见的方式是在 CSS `@font-face` 声明中指定使用的字体，并让浏览器使用其默认行为。这并不理想。由于字体信息位于 CSS
    中，默认情况下浏览器会延迟加载字体，直到 CSS 被解析。这还不是全部。正如 [Zach Leatherman](https://zachleat.com/)
    已经充分阐明的，要触发字体下载，除了有效的 `@font-face` 声明外，还必须满足许多条件：

