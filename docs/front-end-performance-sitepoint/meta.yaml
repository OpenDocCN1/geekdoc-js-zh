    # Conclusion


    Coding WordPress themes for the general public may involve catering for diverse
    and sometimes incompatible needs: those of your customer base, of web performance,
    hence the needs of visitors of those websites that use your themes, and even your
    own needs as WordPress theme designer and creator.


    In this article I''ve expressed my views on how to address the dilemma WordPress
    theme developers might face between the demands of flexibility and those of performance.'
