    \ gzip 后小于 1.2KB）。它可以让你懒加载和多尺寸提供图片，从而节省带宽和服务器请求。用户将获得更快的加载时间，并且如果他们没有浏览整个页面，还能节省加载的数据。\n\
    \n**bLazy 官网**\n\n这个小巧、无依赖的插件让你可以：\n\n- 懒加载嵌入式图片和背景图片\n- 根据屏幕尺寸和高分辨率屏幕提供不同的图片\n\
    - 懒加载任何带有 `src` 属性的内容，例如 iframe、HTML5 视频、脚本、Unity 游戏等\n- 在滚动容器内部懒加载图片\n- 支持旧版浏览器，兼容至\
    \ IE7 和 IE8\n- 使用 CDN，因此你无需将 bLazy 托管在自己的服务器上\n\n下面是一个基本实现。\n\nHTML 标记：\n\n```\n\
    <img class=\"b-lazy\" src=\"placeholder.gif\" data-src=\"image.jpg\"\nalt=\"test\
    \ image\">\n```\n\n你需要按如下方式修改常规的 `img` 标签：\n\n- 添加 `.b-Lazy` 类。\n- 使用占位图片作为 `src`\
