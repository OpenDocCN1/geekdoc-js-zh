- img_proc: true
  md: '# Speed and Global Reach


    Akamai, the CDN that even Facebook uses, has a proven track record of global availability.
    Their scattered model of network topology and availability in even the poorer
    parts of the world (something other CDNs lack) make content served with Akamai
    smooth to load even in low-connectivity areas. A close second is AWS Cloudfront
    from Amazon.


    **Choose if:** you''re aiming for global reach, from China to US, from Finland
    to Antarctica.


    # Affordability


    Amazon Cloudfront is the cheapest of the paid plans (we don''t count free plans
    as those often lack important features) and has the arguably largest reach after
    Akamai, which isn''t exactly cheap (a scattered topology is expensive to maintain).


    **Choose if:** price is an issue.


    # Hotlinking


    Hotlinking is when someone selects "Copy image address" on an image hosted on
    your website, and includes it in their own directly, with the original URL intact.
    This is usually sloppy and lazy work on the side of content thieves, but can lead
    to big expenses if the copycat succeeds in sharing their site on large-impact
    social media website like Facebook or Reddit, and your server suffers for it.
    MaxCDN and KeyCDN both offer very good hotlinking protection.


    **Choose if:** you''ve got a gallery, travel blog, or any other image-rich site
    which is at risk of hotlinking.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Other


    We encourage you to go out and investigate on your own. There are countless posts
    comparing the CDNs one to the other, and each plan of each CDN differs in offered
    options to the next one. It''s extremely difficult to cover them all, and the
    landscape constantly changes.


    # Implementation Process


    Implementing a CDN typically entails changing some DNS records in the control
    panel of the registrar (the company renting you your domain name). This results
    in all traffic hitting the CDN first, which in turn hits your website. Since it
    all happens behind the scenes (through IPs), the process is transparent to the
    user.


    ![](img/b5c46321d5b832f9c2208abb5a26242b_107_0.png)


    10-3. Front end vs back end


    Sometimes, sites will add a special subdomain to their main domain on which to
    host images, JavaScript, CSS, and other static content. If you open the Network
    tab of a browser''s dev console or just pay attention to the status bar of your'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'browser while a site like Facebook is loading, you''ll notice a lot of URLs
    with `cdn` in them - that''s the site in question requesting only *some* of its
    content from CDNs.


    Why not request all content through CDNs? Because static content is usually big
    - 2MB images, 500kb of JS, etc. This is worth serving quickly, because a) it doesn''t
    change often and can be cached for a long time and b) removes a big, big load
    from the main server of the app, which can be dynamic.


    # Conclusion


    In this article, you learned what a CDN was and how it works. You found out about
    the different types of CDNs and their potential scope of work, as well as the
    biggest players in the field.'
  merge: -1
  pgno: 108
