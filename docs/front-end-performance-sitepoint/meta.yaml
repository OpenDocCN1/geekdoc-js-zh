    \ over to [Getting started with CSS Font Loading](https://example.com) by Manuel\
    \ Matuzovic and have a look at his [CodePen demo](https://example.com).\n\n##\
    \ The Future: The CSS `font-display` Property\n\nSince their first appearance,\
    \ you've handled custom fonts using CSS `@font-face` and `font-family`. It's only\
    \ fair to expect CSS to solve any issue related to downloading custom fonts. But\
    \ at present, only JavaScript-based solutions are usable.\n\nHowever, this won't\
    \ be so indefinitely. A smart CSS property is around the corner, `font-display`,\
    \ which is part of the [CSS Font Rendering Controls Module Level 1](https://example.com).\n\
    \n`font-display` lets you:\n\n- Decide if you want to show text using a fallback\
    \ font or hide it while the font is loading.\n- Control what you want to do once\
    \ the font has loaded, i.e., continue to show the fallback font or replace it\
    \ with the custom font. You can also do so on a per-element basis.\n- Specify\
    \ your own timeout values for each font and even for a specific element.\n\nHere's\
    \ what this property looks like in code:\n\n```css\n@font-face {\n  font-family:\
    \ Lato;\n  src: url('/web/css/fonts/lato/lato-regular-webfont.woff2') format('woff2'),\n\
    \       url('/web/css/fonts/lato/lato-regular-webfont.woff') format('woff');\n\
    \  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\nbody\
    \ {\n  font-family: Lato, sans-serif;\n  font-weight: 400;\n  font-style: normal;\n\
    }\n```\n\nAccepted values for this property are:\n\n- **auto**: browsers just\
    \ implement their default behavior.\n- **block**: browsers draw invisible text\
    \ while the font is loading and replace it with the desired font as soon as it's\
    \ loaded.\n- **swap**: browsers use a fallback font while the custom font isn't\
    \ available, but swap the custom font in as soon as it loads.\n- **fallback**:\
    \ similar behavior to `swap`. However, if too much time passes until the custom\
    \ font loads, browsers use the fallback font for the duration of the page's lifetime.\n\
    - **optional**: this super smart value lets browsers use the custom font only\
    \ if it's already available. If it isn't, browsers use the fallback for the duration\
    \ of the page's lifetime. The custom font may still be downloaded in the background\
    \ for use on subsequent page loads. However, if browsers detect limited bandwidth\
    \ on users' devices, they might not load the custom font at all.\n\nFrom these\
    \ short descriptions, you can already see how `swap` and `optional` could be super\
    \ useful.\n\n**Browser support** for `font-display` is non-existent at this time,\
    \ but it can be enabled in Chrome (via the \"Experimental Web Platform features\"\
    \ flag) and Firefox (via the `layout.css.font-display.enabled` flag).\n\n## What\
    \ About FOUT?\n\nAlthough all the approaches outlined above make possible the\
    \ elimination of FOIT, either by swapping in the custom font at a later time or\
    \ by displaying just the fallback font, they can do little against FOUT.\n\nAlthough\
    \ FOUT makes text still available to users, it can very well be annoying, especially\
    \ when the fallback font is wider and/or higher than the custom font it is temporarily\
    \ replacing, which often causes a shift in the page content.\n\nYou can mitigate\
    \ the jarring effect of the swap by adjusting the fallback font's x-height and\
    \ width so as to match the desired custom font's x-height and width as closely\
    \ as possible.\n\nYou can do this in a number of ways, but I find this little\
    \ [Font Style Matcher tool](https://www.x-height.net/) by Monica Dinculescu really\
    \ helpful.\n\n## Conclusion\n\nIn this article I've outlined the issues of file\
    \ size and Flash of Invisible Text related to using custom fonts on websites.\n\
    \nI've presented the latest approaches and pointed you to further resources where\
    \ you can read more and learn how to implement those techniques in your projects.\n\
    \n# Chapter 8\n\n## JavaScript Performance Optimization Tips: An Overview\n\n\
    Ivan Ćurić\n\nIn this chapter, there's lots of stuff to cover across a wide and\
    \ wildly changing landscape. It's also a topic that covers everyone's favorite:\
    \ The JS Framework of the Month™.\n\nWe'll try to stick to the \"Tools, not rules\"\
    \ mantra and keep the JS buzzwords to a minimum. Since we won't be able to cover\
    \ everything related to JS performance in one or two chapters, make sure you read\
    \ the references and do your own research afterwards.\n\nBut before we dive into\
    \ specifics, let's get a broader understanding of the issue by answering the following:\
    \ what is considered as performant JavaScript, and how does it fit into the broader\
    \ scope of web performance metrics?\n\n### Setting the Stage\n\nFirst of all,\
    \ let's get the following out of the way: if you're testing exclusively on your\
    \ desktop device, you're excluding [more than 50%](https://example.com) of your\
    \ users.\n\n### Desktop vs Mobile vs Tablet Market Share Worldwide\n\nOct 2016\
    \ - Oct 2017\n\n![图 8-1 显示 2016 年 11 月移动用户数量超过了桌面用户数量](img/b5c46321d5b832f9c2208abb5a26242b_79_0.png)\n\
    \n8-1. The number of mobile users overtook the number of desktop users in November\
    \ 2016\n\nThis trend will only continue to grow, as the emerging market's preferred\
    \ gateway to the web is a sub-$100 Android device. The era of the desktop as the\
    \ main device to access the Internet is over, and the next billion internet users\
    \ will visit your sites primarily through a mobile device.\n\nTesting in Chrome\
    \ DevTools' device mode isn't a valid substitute to testing on a real device.\
    \ Using CPU and network throttling helps, but it's a fundamentally different beast.\
    \ Test on real devices.\n\nEven if you *are* testing on real mobile devices, you're\
    \ probably doing so on your brand spanking new $600 flagship phone. The thing\
    \ is, that's not the device your users have. The median device is something along\
    \ the lines of a Moto G1 — a device with under 1GB of RAM, and a very weak CPU\
    \ and GPU.\n\nLet's see how it stacks up when [parsing an average JS bundle](https://example.com).\n\
    \n![图示显示了在 Moto G1 设备上解析平均 JS 包的时间](img/b5c46321d5b832f9c2208abb5a26242b_80_0.png)\n\
    \nSource: Addy Osmani - [Time spent in JS parse & eval for average JS](https://example.com).\n\
    \nOuch. While this image only covers the parse and compile time of the JS (more\
    \ on that later) and not general performance, it's strongly correlated and can\
    \ be treated as an indicator of general JS performance.\n\nTo quote Bruce Lawson,\
    \ \"[it's the World-Wide Web, not the Wealthy Western Web](https://example.com)\"\
    . So, your target for web performance is a device that's **~25x slower** than\
    \ your MacBook or iPhone. Let that sink in for a bit. But it gets worse. Let's\
    \ see what we're actually aiming for.\n\n### What Exactly Is Performant JS Code?\n\
    \nNow that we know what our target platform is, we can answer the next question:\
    \ what *is* performant JS code?\n\nWhile there's no absolute classification of\
    \ what defines performant code, we do have a user-centric performance model we\
    \ can use as a reference: [The RAIL model](https://web.dev/rail/).\n\n![图 8-3\
    \ 显示了 RAIL 模型：响应/动画/空闲工作/加载](img/b5c46321d5b832f9c2208abb5a26242b_81_0.png)\n\n\
    8-3. RAIL: Respond/Animate/Idle work/Load\n\nSource: Sam Saccone - [Planning for\
    \ Performance: PRPL](https://www.youtube.com/watch?v=4bZ3yQJxkfk)\n\n### Respond\n\
    \nIf your app responds to a user action in under 100ms, the user perceives the\
    \ response as immediate. This applies to tappable elements, but not when scrolling\
    \ or dragging.\n\n### Animate\n\nOn a 60Hz monitor, we want to target a constant\
    \ 60 frames per second when animating and scrolling. That results in around 16ms\
    \ per frame. Out of that 16ms budget, you realistically have 8–10ms to do all\
    \ the work, the rest taken up by the browser internals and other variances.\n\n\
    ### Idle work\n\nIf you have an expensive, continuously running task, make sure\
    \ to slice it into smaller chunks to allow the main thread to react to user inputs.\
    \ You shouldn't have a task that delays user input for more than 50ms.\n\n###\
    \ Load\n\nYou should target a page load in under 1000ms. Anything over, and your\
    \ users start getting twitchy. This is a pretty difficult goal to reach on mobile\
