    # # What Exactly Is Performant JS Code?


    Now that we know what our target platform is, we can answer the next question:
    what *is* performant JS code?


    While there''s no absolute classification of what defines performant code, we
    do have a user-centric performance model we can use as a reference: [The RAIL
    model](https://web.dev/rail/).


    ![](img/b5c46321d5b832f9c2208abb5a26242b_81_0.png)


    8-3. RAIL: Respond/Animate/Idle work/Load


    Source: Sam Saccone - [Planning for Performance: PRPL](https://www.youtube.com/watch?v=4bZ3yQJxkfk)


    # ## Respond


    If your app responds to a user action in under 100ms, the user perceives the response
    as immediate. This applies to tappable elements, but not when scrolling or dragging.'
  - '[PAGE 82]


    # Animate


    On a 60Hz monitor, we want to target a constant 60 frames per second when animating
    and scrolling. That results in around 16ms per frame. Out of that 16ms budget,
    you realistically have 8–10ms to do all the work, the rest taken up by the browser
    internals and other variances.


    # Idle work


    If you have an expensive, continuously running task, make sure to slice it into
    smaller chunks to allow the main thread to react to user inputs. You shouldn''t
    have a task that delays user input for more than 50ms.


    # Load


    You should target a page load in under 1000ms. Anything over, and your users start
    getting twitchy. This is a pretty difficult goal to reach on mobile devices as
    it relates to the page being interactive, not just having it painted on screen
    and scrollable. In practice, it''s even less:'
