    | **Leftover budget** | **0-400 ms** | **300-700 ms** |


    Network overhead of one HTTP request!


    ## 8-4. JavaScript 1000ms budget


    Fast By Default: Modern Loading Best Practices (Chrome Dev Summit 2017)


    In practice, aim for the 5s time-to-interactive mark. It''s what Chrome uses in
    their Lighthouse audit.


    Now that we know the metrics, let''s have a look at some of the statistics:


    - 53% of visits are abandoned if a mobile site takes more than three seconds to
    load

    - 1 out of 2 people expect a page to load in less than 2 seconds

    - 77% of mobile sites take longer than 10 seconds to load on 3G networks

    - 19 seconds is the average load time for mobile sites on 3G networks.


    And a bit more, courtesy of Addy Osmani:


    - Apps became interactive in 8 seconds on desktop (using cable) and 16 seconds
    on mobile (Moto G4 over 3G) at the median, developers shipped 410KB of gzipped
    JS for their pages.


    Feeling sufficiently frustrated? Good. Let''s get to work and fix the web.


    ## Context is Everything


    You might have noticed that the main bottleneck is the time it takes to load up
    your website. Specifically, the JavaScript download, parse, compile and execution
    time. There''s no way around it but to load less JavaScript and load smarter.


    But what about the actual work that your code does aside from just booting up
    the website? There has to be some performance gains there, right?


    Before you dive into optimizing your code, consider what you''re building. Are
    you building a framework or a VDOM library? Does your code need to do thousands
    of operations per second? Are you doing a time-critical library for handling user
    input and/or animations? If not, you may want to shift your time and energy somewhere
    more impactful.


    It''s not that writing performant code doesn''t matter, but it usually makes little
    to no impact in the grand scheme of things, especially when talking about microoptimizations.
    So, before you get into a Stack Overflow argument about `.map` vs `.forEach` vs
    `for` loops by comparing results from JSperf.com, make sure to see the forest
    and not just the trees. 50k ops/s might sound 50× better than 1k ops/s on paper,
    but it won''t make a difference in most cases.


    ## Parsing, Compiling and Executing


    Fundamentally, the problem of most non-performant JS is not running the code itself,
    but all the steps that have to be taken *before* the code even starts executing.


    We''re talking about levels of abstraction here. The CPU in your computer runs
    machine code. Most of the code you''re running on your computer is in the compiled
    binary format. (I said *code* rather than *programs*, considering all the Electron
    apps these days.) Meaning, all the OS-level abstractions aside, it runs natively
    on your hardware, no prep-work needed.


    JavaScript is not pre-compiled. It arrives (via a relatively slow network) as
    readable code in your browser which is, for all intents and purposes, the "OS"
    for your JS program.


    That code first needs to be parsed — that is, read and turned into an computer-indexable
    structure that can be used for compiling. It then gets compiled into bytecode
    and finally machine code, before it can be executed by your device/ browser.


    Another *very* important thing to mention is that JavaScript is single-threaded,
    and runs on the browser''s main thread. This means that only one process can run
    at a time. If your DevTools performance timeline is filled with yellow peaks,
    running your CPU at 100%, you''ll have long/dropped frames, janky scrolling and
    all other kind of nasty stuff.


    ![](img/b5c46321d5b832f9c2208abb5a26242b_86_0.png)


    8-5. A long-running task in DevTools


    Source: Paul Lewis - [When everything''s important, nothing is!](https://medium.com/@paul_lewis/when-every-things-important-nothing-is-35890f28c7f5).


    So there''s all this work that needs to be done before your JS starts working.
    Parsing and compiling takes up to 50% of the total time of JS execution in Chrome''s
    V8 engine.


    ![](img/b5c46321d5b832f9c2208abb5a26242b_86_1.png)


    8-6. Comparison of mobile and desktop JS parse time


    Source: Addy Osmani - [JavaScript Start-up Performance](https://medium.com/reloading/javascript-start-up-performance-69200f43b201).


    There are two things you should take away from this section:


    1. While not necessarily linearly, JS parse time scales with the bundle size.
    The less JS you ship, the better.

    2. Every JS framework you use (React, Vue, Angular, Preact...) is another level
    of abstraction (unless it''s a precompiled one, like [Svelte](https://svelte.dev/)).
    Not only will it increase your bundle size, but also slow down your code since
    you''re not talking directly to the browser.


    There are ways to mitigate this, such as using service workers to do jobs in the
    background and on another thread, using asm.js to write code that''s more easily
    compiled to machine instructions, but that''s a whole ''nother topic.


    What you can do, however, is avoid using JS animation frameworks for everything
    and [read up on what triggers paints and layouts](https://csstriggers.com/). Use
    the libraries only when there''s absolutely no way to implement the animation
    using regular CSS transitions and animations.


    Even though they may be using CSS transitions, composited properties and `requestAnimationFrame()`,
    they''re still running in JS, on the main thread. They''re basically just hammering
    your DOM with inline styles every 16ms, since there''s not much else they can
    do. You need to make sure all your JS will be done executing in under 8ms per
    frame in order to keep the animations smooth.


    CSS animations and transitions, on the other hand, are running off the main thread
    — on the GPU, if implemented performantly, without causing relayouts/reflows.


    Considering that most animations are running either during loading or user interaction,
    this can give your web apps the much-needed room to breathe.


    The [Web Animations API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Animations_API)
    is an upcoming feature set that will allow you to do performant JS animations
    off the main thread, but for now, stick to CSS transitions and techniques like
    [FLIP](https://aerotwist.com/blog/flip-your-animations/).


    ## Bundle Sizes are Everything


    Today it''s all about bundles. Gone are the times of Bower and dozens of `<script>`
    tags before the closing `</body>` tag.


    Now it''s all about `npm install` -ing whatever shiny new toy you find on NPM,
    bundling them together with Webpack in a huge single 1MB JS file and hammering
    your users'' browser to a crawl while capping off their data plans.


    Try shipping less JS. You might not need [the entire Lodash library](https://www.npmjs.com/package/lodash)
    for your project. Do you absolutely *need* to use a JS framework? If yes, have
    you considered using something other than React, such as [Preact](https://preactjs.com/)
    or [HyperHTML](https://viperhtml.js.org/hyper.html), which are less than 1/20
    the size of React? Do you need [TweenMax](https://greensock.com/tweenmax) for
    that scroll-to-top animation? The convenience of npm and isolated components in
    frameworks comes with a downside: the first response of developers to a problem
    has become to throw more JS at it. When all you have is a hammer, everything looks
    like a nail.


    When you''re done pruning the weeds and shipping less JS, try shipping it *smarter*.
    Ship what you need, when you need it.


    Webpack 3 has *amazing* features called [code splitting](https://webpack.js.org/guides/code-splitting/)
    and [dynamic imports](https://webpack.js.org/guides/code-splitting/#dynamic-imports).
    Instead of bundling all your JS modules into a monolithic `app.js` bundle, it
    can automatically split the code using the `import()` syntax and load it asynchronously.


