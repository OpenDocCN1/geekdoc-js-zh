    That''s not a lot of time, so keeping your code lean could make a difference to
    the smoothness of your animations.


    Decoupling the code for handling events like scrolling, resizing, mouse events,
    etc., from the code that handles screen updates using `requestAnimationFrame()`
    is a great way to optimize your animation code for performance.


    For a deep discussion of this optimization tip and related sample code, check
    out [Leaner, Meaner, Faster Animations with requestAnimationFrame](https://www.smashingmagazine.com/2013/05/optimizing-javascript-for-animation-performance/)
    by Paul Lewis.


    # 5. Avoid Long-running JavaScript Code


    Browsers use the main thread to run JavaScript, together with other tasks like
    style calculations, layout and paint operations. Long-running JavaScript code
    could negatively impact on these tasks, which could lead to frames being skipped
    and janky animations as a consequence. Therefore, simplifying your code could
    certainly be a good way to ensure your animations run smoothly.


    For complex JavaScript operations that don''t require access to the DOM, consider
    using [Web Workers](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API).
    The worker thread performs its tasks without impacting on the user interface.


    # 6. Leverage the Browser''s DevTools to Keep Performance Issues in Check


    Your browser''s developer tools provide a way to monitor how hard your browser
    is working to run your JavaScript code, or that of a third-party library. They
    also provide useful information about frame rates and much more.


    You can access the Chrome DevTools by right-clicking on your web page and selecting
    `Inspect` inside the context menu. For example, recording your web page using
    the Performance tools will give you an insight into the performance bottlenecks
    on that page:'
