    \ there's the topic of transpiled code and polyfills. If you're writing modern\
    \ (ES6+) JavaScript, you're probably using Babel to transpile it into ES5 compatible\
    \ code. Transpiling not only increases file size due to all the verbosity, but\
    \ also complexity, and it often has performance regressions compared to native\
    \ ES6+ code.\n\nAlong with that, you're probably using the `babel-polyfill` package\
    \ and `whatwg-fetch` to patch up missing features in older browsers. Then, if\
    \ you're writing code using `async/await`, you also transpile it using generators\
    \ needed to include the `regenerator-runtime`...\n\nThe point is, you add almost\
    \ 100 kilobytes to your JS bundle, which has not only a huge file size, but also\
    \ a huge parsing and executing cost, in order to support older browsers.\n\nThere's\
    \ no point in punishing people who are using modern browsers, though. An approach\
    \ I use, and which Philip Walton covered in [this article](https://philipwalton.com/articles/the-cost-of-javascript-in-2019/),\
