    从这个测试中我们可以看到，没有必要过于担心 CSS 选择器性能。只要不过度使用伪选择器和超长的选择器就好。我们还可以看到 Blink 引擎在过去两年中有了多么大的改进。对于“数量选择器”（`.box:nth-last-child(n+6)
    ~ div`）与“疯狂选择器”（`.box:not(:empty):last-of-type .title`）相比，之前约 500 倍的性能下降，现在只看到了约
    1.5 倍的下降。这是一个惊人的改进，而且浏览器只会越来越好，CSS 选择器性能的影响也将越来越小。


    不过，你*应该*尽可能坚持使用类（class），并采用某种命名空间约定，如 BEM、SMACSS 或 OOCSS，因为这不仅有助于提升网站性能，还能极大地帮助代码的可维护性。过度限定的复合选择器，尤其是与标签选择器和通配选择器一起使用时——例如
    `.header nav ul > li a > .inner`——非常脆弱，是许多意外错误的根源。它们的维护也是一场噩梦，尤其是当你从别人那里继承代码时。


    ## 质量重于数量


    比单纯拥有昂贵选择器更大的问题是拥有*大量*选择器。这就是所谓的"样式膨胀"，你可能已经见过很多次了。典型的例子是网站导入了整个 CSS 框架如 Bootstrap
    或 Foundation，却只使用了不到 10% 的传输 CSS。另一个例子出现在那些老旧、从未重构的项目中，其 CSS 已经退化为我称之为"时间顺序样式表"的东西——随着项目的变更和增长，大量类被追加到文件末尾，现在看起来更像是一个杂草丛生的花园。


    庞大的 CSS 文件不仅需要更长时间来传输（而网络是网站性能中*最大*的瓶颈），它们还需要更长时间来解析。除了从 HTML 构建 DOM 之外，浏览器还需要构建
    CSSOM（CSS 对象模型）来与 DOM 进行比较并匹配选择器。


    所以，保持你的样式精简且 DRY（Don''t Repeat Yourself），不要什么都塞进去，按需加载，需要时可以使用 [UNCSS](https://github.com/uncss/uncss)。


    如果你想更深入地了解浏览器如何解析 CSS，可以查看 [Nicole Sullivan 关于 WebKit 的文章](http://www.stubbornella.org/content/2009/09/22/reflow-repaint-css-performance-making-your-javascript-slow/)、[Ilya
    Grigorik 关于 Blink 如何工作的文章](https://www.igvita.com/2012/02/12/high-performance-networking-in-google-chrome/)，或者
    [Lin Clark 关于 Mozilla 新 Stylo CSS 引擎的文章](https://hacks.mozilla.org/2017/08/inside-a-super-fast-css-engine-quantum-css-aka-stylo/)。


    ## 房间里的大象：样式失效


    到目前为止我们讨论的内容都不错，但我们只讨论了单次渲染过程。如今的网站不再是静态文档，而更像用户可以与之交互的、带有动态内容的应用。


    这使问题复杂化了，因为解析 CSS 只是浏览器渲染管线中的单一步骤。以下是浏览器如何将单帧渲染到屏幕上的以渲染为中心的视图（来源：[Google](https://developers.google.com/web/fundamentals/performance/rendering)）：


    ![4-1. 浏览器渲染管线](img/b5c46321d5b832f9c2208abb5a26242b_46_0.png)


    我们不会深入讨论 JavaScript 性能和合成，而是将聚焦于紫色部分——样式解析和对元素的布局。


    在构建 DOM 和 CSSOM 之后，浏览器需要将两者合并为渲染树，最后将其绘制到屏幕上。在这一步中，浏览器需要为每个匹配元素计算CSS。你可以在开发者工具的
    **元素 > 样式** 面板中亲眼看到这个。它获取所有匹配的样式、层叠以及浏览器特定的用户代理样式，来构建元素的最终计算 CSS。


    然后它才能进入布局（也称为回流）步骤，在那里计算几何信息，构建页面的盒模型，将每个元素放置到视口中的相应位置。布局是这个过程中计算量最大的部分。


    最后，浏览器在绘制阶段将渲染树中的每个节点转换为屏幕上的实际像素。


    现在，当我们通过*更改*页面上的某些类、添加或移除某些节点、修改某些属性，或以任何方式操作 HTML（或样式表本身）来改变 DOM 时，会发生什么？


    我们使计算样式失效，浏览器需要使匹配选择器树下的所有内容失效。虽然如今的浏览器已经聪明得多，但过去的情况是，如果你更改了 *body* 元素上的类，所有后代元素都需要重新计算它们的样式。


    避免这个问题的一种方法是降低选择器的复杂度。不要写 `#nav > .list > li > a`，而是使用单一的选择器，如 `.nav-link`。这样，你就减少了样式失效的范围，因为如果你修改
    `#nav` 内部的任何内容，不会触发整个节点的重新计算。


    另一种方法是缩小范围——例如减少失效元素的数量。让你的 CSS 更具体。特别是在动画中要记住这一点，因为浏览器只有约 10 毫秒的时间来完成所有必要的工作。


    如果你想深入了解样式失效的细节，我推荐阅读 [Blink 中的样式失效](link)。


    ## 结论


    总而言之，你不应该担心选择器性能，除非你*真的*做过头了。虽然这个话题在 2012 年风靡一时，但自那以后浏览器已经变得*快得多*、*聪明得多*了。甚至 Google
    也不再为此担心了。如果你查看 Google 的 [Page Speed Insights 页面](https://developers.google.com/speed/pagespeed/insights/)，你不会看到"使用高效的
    CSS 选择器"这一规则——它在 2013 年就被移除了。


    相反，专注于让你的 CSS 可维护和可读。你的同事和未来的你都会为此感谢你。尝试通过只包含已使用的样式来优化 CSS 交付。之后，去了解渲染管线。与选择器不同，样式本身*可能*是昂贵的，[一个卡顿的网站和一个流畅的网站之间的区别](https://developers.google.com/web/fundamentals/performance/rendering/stick-to-compositor-only-properties-and-manage-layer-count)往往就在于
    CSS 的实现方式。


    最后一点：始终进行你自己的测试。


    不要仅仅相信几年前有人在互联网上的说法。技术环境正在以惊人的速度发生翻天覆地的变化。今天相关的东西可能比你想象的更快就会变得过时。


    # 第 5 章：优化 CSS：使用 DevTools 调整动画性能


    Maria Antonietta Perna


    > 本文是与 <u>SiteGround</u> 合作创建的系列文章之一。感谢支持使 SitePoint 成为可能的合作伙伴。


    **CSS 动画以其超高性能而闻名。虽然对于少量元素的简单动画来说确实如此，但如果你在设计动画时没有考虑性能并增加更多复杂性，网站用户很快就会注意到并可能感到厌烦。**


    在本文中，我将介绍一些有用的浏览器 DevTools 功能，让你能够检查使用 CSS 动画时底层发生了什么。这样，当动画看起来有点卡顿时，你就能更好地了解原因以及可以如何修复。


    ## 用于 CSS 性能的开发者工具


    你的动画需要达到 60 fps（每秒帧数）才能在浏览器中流畅运行。帧率越低，动画效果就越差。这意味着浏览器处理每一帧的时间不超过约 16 毫秒。但在这段时间里它做了什么工作？你又怎么知道浏览器是否跟上了期望的帧率？


    我认为在评估动画质量方面，没有什么能比得上用户体验。然而，现代浏览器中的开发者工具虽然并非总是 100% 可靠，但已经变得越来越智能，而且你可以用它们来审查、编辑和调试代码。


    检查帧率和 CSS 动画性能时也是如此。以下是具体做法。


    ## 探索 Firefox 中的性能工具


    在本文中，我使用 Firefox 性能工具。另一个重要竞争者是 Chrome 性能工具。你可以随意选择，因为两个浏览器都提供了强大的性能功能。

    '
