    # What About FOUT?


    Although all the approaches outlined above make possible the elimination of FOIT,
    either by swapping in the custom font at a later time or by displaying just the
    fallback font, they can do little against FOUT.


    Although FOUT makes text still available to users, it can very well be annoying,
    especially when the fallback font is wider and/or higher than the custom font
    it is temporarily replacing, which often causes a shift in the page content.


    You can mitigate the jarring effect of the swap by adjusting the fallback font''s
    x-height and width so as to match the desired custom font''s x-height and width
    as closely as possible.


    You can do this in a number of ways, but I find this little [Font Style Matcher
    tool](https://www.x-height.net/) by Monica Dinculescu really helpful.


    # Conclusion


    In this article I''ve outlined the issues of file size and Flash of Invisible
    Text related to using custom fonts on websites.


    I''ve presented the latest approaches and pointed you to further resources where
    you can read more and learn how to implement those techniques in your projects.'
