- img_proc: true
  md: 'The role of web animation has evolved from mere decorative fluff to [serving
    concrete purposes](https://link) in the context of user experience — such as providing
    visual feedback as users interact with your app, directing users'' attention to
    fulfill your app''s goals, offering visual cues that help users make sense of
    your app''s interface, and so on.


    To ensure web animation is up to such crucial tasks, it''s important that motion
    takes place at the right time in a fluid and smooth fashion, so that users perceive
    it as aiding them, rather than as getting in the way of whatever action they''re
    trying to pursue on your app.


    One dreaded effect of ill-conceived animation is **jank**, which is explained
    on [jankfree.org](https://jankfree.org) like this:


    > Modern browsers try to refresh the content on screen in sync with a device''s
    refresh rate. For most devices today, the screen will refresh 60 times a second,
    or 60Hz. If there is some motion on screen (such as scrolling, transitions, or
    animations) a browser should create 60 frames per second to PMIC the refresh rate.
    **Jank** is any stuttering, juddering or just plain halting that users see when
    a site or app isn''t keeping up with the refresh rate.


    If animations are janky, users will eventually interact less and less with your
    app, thereby negatively impacting on its success. Obviously, nobody wants that.


    In this article, I''ve gathered a few performance tips to help you solve issues
    with JavaScript animations and make it easier to meet the 60fps (frame per second)
    target for achieving smooth motion on the web.'
  merge: -1
