    There are ways to mitigate this, such as using service workers to do jobs in the
    background and on another thread, using asm.js to write code that''s more easily
    compiled to machine instructions, but that''s a whole ''nother topic.


    What you can do, however, is avoid using JS animation frameworks for everything
    and [read up on what triggers paints and layouts](https://csstriggers.com/). Use
    the libraries only when there''s absolutely no way to implement the animation
    using regular CSS transitions and animations.


    Even though they may be using CSS transitions, composited properties and `requestAnimationFrame()`,
    they''re still running in JS, on the main thread. They''re basically just hammering
    your DOM with inline styles every 16ms, since there''s not much else they can
    do. You need to make sure all your JS will be done executing in under 8ms per
    frame in order to keep the animations smooth.


    CSS animations and transitions, on the other hand, are running off the main thread
    — on the GPU, if implemented performantly, without causing relayouts/reflows.


    Considering that most animations are running either during loading or user interaction,
    this can give your web apps the much-needed room to breathe.


    The [Web Animations API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Animations_API)
    is an upcoming feature set that will allow you to do performant JS animations
