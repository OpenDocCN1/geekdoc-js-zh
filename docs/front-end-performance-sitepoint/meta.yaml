    **themes with appearance.** Getting rid of all the complication will improve theme
    performance and at the same time make it easier for users to install and configure
    WordPress themes.


    # Your users don''t need tons of theme options (but they might not know this)


    Until not long ago, WordPress themes included rather complicated theme option
    pages to enable users to make all sorts of modifications with a button click.


    These days, thanks to a momentous [decision taken by the Theme Review Team on
    WordPress.org](https://wordpress.org) in 2015, most themes offer theme options
    using the [WordPress Customizer](https://wordpress.org), which makes possible
    live previewing the changes as they''re being made by users.


    Unfortunately, the kitchen sink mentality that ruled the old theme option pages
    has started to migrate to the Customizer, which you can now see as also starting
    to get filled up with all sorts of settings.


    Although non technical customers love theme options to make changes to their themes,
    sometimes too many options available bring more problems than they seemingly solve:


    +   - Too many options can paralyze users who are not too familiar with core principles
    of website design.

    - It can take more time than expected to set up and configure a theme.

    - It''s easy to make mistakes like choosing the wrong colors, making text unreadable,
    etc.

    - Users might add too many fonts to their themes, thereby spoiling the design
    and slowing down the website.

    - More options means adding more functionality to the theme, thereby impacting
    on its performance.


    Although your customers might not accept this at first, you are the theme'
  - '[PAGE 23]


    designer, therefore you should be the one who is best placed to make the important
    design decisions for your theme.


    A well-calibrated number of theme options should be sufficient to let your customers
    make some targeted and carefully predefined (by you) modifications to personalize
    the theme and make it their own.


    # ## Implement smart graphics optimization techniques


    Images are likely to put the heaviest weight on theme performance compared to
    template files, scripts and styles. Just run any theme through [Pingdom''s Speed
    Test tool](https://tools.pingdom.com/) to verify this.


    However, a generous use of full-screen, bold images is hardly surprising. Images
    add huge aesthetic value to themes and customers are drawn to a theme largely
    on the basis of its visual impact.


    Although it''s hard to resist the power of great graphics, the guidelines below
    can help you code faster themes without necessarily sacrificing aesthetics (too
    much):


    +   - Using as few images as possible is always a good guiding principle.


    +   - Take advantage of CSS [blend modes](https://developer.mozilla.org/en-US/docs/Web/CSS/blend-mode),
    [filters](https://developer.mozilla.org/en-US/docs/Web/CSS/filter), and semi-transparent
    overlays on low-resolution images to mask pixelation and enhance their visual
    appearance. You can also try to experiment with CSS [blend modes](https://developer.mozilla.org/en-US/docs/Web/CSS/blend-mode)
    and [filters on HTML elements and text](https://developer.mozilla.org/en-US/docs/Web/CSS/filter)
    rather than images to create stunning visual effects wherever possible.


    +   - Make sure the images are of the [appropriate format](https://developer.mozilla.org/en-US/docs/Web/Media/Formats/Image_types)
    and optimized for web.


    +   - Where appropriate, use [CSS sprites](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Images/Implementing_image_sprites_in_CSS)
    to combine your images into a larger image and therefore reduce HTTP requests.


    +   - Try implementing [lazy loading for images](https://developer.mozilla.org/en-US/docs/Web/Performance/Lazy_loading).
    Doing so will achieve faster page load, and if users don''t scroll to the location
    of the `<img>` tag, the image won''t need to be downloaded at all. To lazy load
    images in WordPress you can choose from a number of good plugins, such as [Lazy
    Load](https://wordpress.org/plugins/lazy-load/), [a3 Lazy Load](https://wordpress.org/plugins/a3-lazy-load/)
    and'
