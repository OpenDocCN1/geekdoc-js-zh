  md: '# Chapter 8


    # # JavaScript Performance Optimization Tips: An Overview


    Ivan Ćurić'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'In this chapter, there''s lots of stuff to cover across a wide and wildly changing
    landscape. It''s also a topic that covers everyone''s favorite: The JS Framework
    of the Month™.


    We''ll try to stick to the "Tools, not rules" mantra and keep the JS buzzwords
    to a minimum. Since we won''t be able to cover everything related to JS performance
    in one or two chapters, make sure you read the references and do your own research
    afterwards.


    But before we dive into specifics, let''s get a broader understanding of the issue
    by answering the following: what is considered as performant JavaScript, and how
    does it fit into the broader scope of web performance metrics?


    # ## Setting the Stage


    First of all, let''s get the following out of the way: if you''re testing exclusively
    on your desktop device, you''re excluding [more than 50%](more than 50%) of your
    users.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Desktop vs Mobile vs Tablet Market Share Worldwide


