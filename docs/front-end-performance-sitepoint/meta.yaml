    If all the points above are satisfied, the browser starts downloading the font.
    This means that the browser needs to have parsed not only the CSS code but also
    a website''s text content before it can trigger a font''s download. However, it''s
    just when the **font starts loading that web users are likely to experience the
    dreaded Flash Of Invisible Text**, or **FOIT** for short.


    ![](img/b5c46321d5b832f9c2208abb5a26242b_68_0.png)


    7-1. FOIT: Page at http://blog.instagram.com/ while fonts are loading on Firefox
