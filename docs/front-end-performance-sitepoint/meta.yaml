- md: "## Your users don't need tons of theme options (but they might not know this)\n\
    \nUntil not long ago, WordPress themes included rather complicated theme option\
    \ pages to enable users to make all sorts of modifications with a button click.\n\
    \nThese days, thanks to a momentous decision taken by the Theme Review Team on\
    \ WordPress.org in 2015, most themes offer theme options using the WordPress Customizer,\
    \ which makes possible live previewing the changes as they're being made by users.\n\
    \nUnfortunately, the kitchen sink mentality that ruled the old theme option pages\
    \ has started to migrate to the Customizer, which you can now see as also starting\
    \ to get filled up with all sorts of settings.\n\nAlthough non technical customers\
    \ love theme options to make changes to their themes, sometimes too many options\
    \ available bring more problems than they seemingly solve:\n\n- Too many options\
    \ can paralyze users who are not too familiar with core principles of website\
    \ design.\n- It can take more time than expected to set up and configure a theme.\n\
    - It's easy to make mistakes like choosing the wrong colors, making text unreadable,\
    \ etc.\n- Users might add too many fonts to their themes, thereby spoiling the\
    \ design and slowing down the website.\n- More options means adding more functionality\
    \ to the theme, thereby impacting on its performance.\n\nAlthough your customers\
    \ might not accept this at first, you are the theme designer, therefore you should\
    \ be the one who is best placed to make the important design decisions for your\
    \ theme.\n\nA well-calibrated number of theme options should be sufficient to\
    \ let your customers make some targeted and carefully predefined (by you) modifications\
    \ to personalize the theme and make it their own.\n\n## Implement smart graphics\
    \ optimization techniques\n\nImages are likely to put the heaviest weight on theme\
    \ performance compared to template files, scripts and styles. Just run any theme\
    \ through Pingdom's Speed Test tool to verify this.\n\nHowever, a generous use\
    \ of full-screen, bold images is hardly surprising. Images add huge aesthetic\
    \ value to themes and customers are drawn to a theme largely on the basis of its\
    \ visual impact.\n\nAlthough it's hard to resist the power of great graphics,\
    \ the guidelines below can help you code faster themes without necessarily sacrificing\
    \ aesthetics (too much):\n\n- Using as few images as possible is always a good\
    \ guiding principle.\n- Take advantage of CSS blend modes, filters, and semi-transparent\
    \ overlays on low-resolution images to mask pixelation and enhance their visual\
    \ appearance. You can also try to experiment with CSS blend modes and filters\
    \ on HTML elements and text rather than images to create stunning visual effects\
    \ wherever possible.\n- Make sure the images are of the appropriate format and\
    \ optimized for web.\n- Where appropriate, use CSS sprites to combine your images\
    \ into a larger image and therefore reduce HTTP requests.\n- Try implementing\
    \ lazy loading for images. Doing so will achieve faster page load, and if users\
    \ don't scroll to the location of the `<img>` tag, the image won't need to be\
    \ downloaded at all. To lazy load images in WordPress you can choose from a number\
    \ of good plugins, such as Lazy Load, a3 Lazy Load and Rocket Lazy Load.\n\n##\
    \ Make customer support and education your pillars of strength\n\nInstead of feeding\
    \ your customers lots of confusing and time-consuming theme options, try offering\
    \ full support and education on how to use your themes, image optimization, WordPress\
    \ 101, etc.\n\nYou can do so using:\n\n- blog posts\n- downloadable guides\n-\
    \ video tutorials\n- FAQs on your website\n- a ticket system for more specific\
    \ issues that might arise while using your themes.\n\nSharing the basic know-how\
    \ about your products and the platform you build for is a great way of making\
    \ your themes easy to use for your customers and contributes to generate a high\
    \ level of trust, which is at the core of a healthy and successful business.\n\
    \n## Sometimes Flexibility Wins over Performance\n\nThere may be a limited number\
    \ of cases when you don't think compromising some flexibility for the sake of\
    \ a small performance gain is a good idea.\n\nA couple of examples come to mind.\n\
    \n## When writing DRY code could make your customers unhappy\n\nThe first example\
    \ comes from Tom McFarlin, a well-known WordPress theme developer and author.\n\
    \nIn his blog he explains why he decided to include a long list of WordPress template\
    \ files, thereby going against the DRY coding principle (and also impacting negatively\
    \ on performance to some extent) while developing his theme *Meyer*.\n\n*Meyer*\
    \ was targeted at bloggers and digital publishers without much WordPress technical\
    \ knowledge. Knowing that lack of coding experience would not have stopped this\
    \ audience from tinkering with his theme, Tom McFarlin thought of a way to make\
    \ things easier for them. He provided his customers with a generous number of\
    \ template files they could easily copy and paste into a WordPress child theme\
    \ for customization without hacking the original theme.\n\nMcFarlin writes:\n\n\
    > If the templates are defined in the base theme — rather than, say, a bunch of\
    \ developer-ish conditionals — users are going to have an easier time basing their\
    \ templates off of something that already exists ...\n> \n> So if I had to sum\
    \ this up in some concise way, I’d say that I — like many developers — want to\
    \ keep my code as DRY as possible, but there’s a tradeoff that comes with doing\
    \ so in the context of WordPress theme development.\n> \n> And I don’t think that\
    \ staying DRY is the best way to go about it if you’re going to be marketing a\
    \ product to a wide audience.\n> \n> ***Know Your Customer — the Blogger.***\n\
    \n## Static source code is better for performance but don't use it in your public\
    \ themes\n\nMy second example of when not to compromise flexibility for some performance\
    \ gain in your WordPress themes is based on performance advice from the Codex.\n\
    \nYou'll find some great performance tips there, but there's one I wouldn't recommend\
    \ you use, at least if you're going to release your theme to the general public.\n\
    \nIt goes like this:\n\n> Can static values be hardcoded into your themes? This\
    \ will mean you have to edit code every time you make changes, but for generally\
    \ static areas, this can be a good trade off.\n> \n> For example, your site charset,\
    \ site title, and so on.\n> \n> Can you hardcode menus that rarely change? Avoiding\
    \ functions like `wp_list_pages()` for example.\n> \n> **Codex — WordPress Optimization/WordPress\
    \ Performance**\n\nAvoiding unnecessary calls to the database and optimizing your\
    \ SQL queries are excellent practices every theme should follow.\n\nIf your theme\
    \ runs a bit slow, try looking for problematic database queries that take too\
    \ long to execute. You can use a plugin like Query Monitor in your development\
    \ environment to help you with this task.\n\nHowever, hardcoding bits of information\
    \ like site title, menu items, etc., is out of the question. Even if your users\
    \ never change that info once it's set, they need to set it at least once and\
    \ they rightly expect to do so using WordPress dynamic capabilities.\n\nFurthermore,\
    \ even if your theme's users were prepared to dig into the source code, they would\
    \ have to hack the theme files to add the required data. This is almost never\
    \ a good idea, not least because all changes would be overwritten on the next\
    \ theme update."
  mdcn: "\n## 你的用户不需要大量的主题选项（但他们可能自己并不知道）\n\n就在不久前，WordPress 主题还包含相当复杂的主题选项页面，让用户可以通过一次点击进行各种修改。\n\
    \n如今，得益于 WordPress.org 主题审核团队在 2015 年做出的一项重大决定，大多数主题都通过 WordPress 自定义器（Customizer）来提供主题选项，这使得用户在修改时能够实时预览效果。\n\
    \n不幸的是，曾经主导旧版主题选项页面的“大杂烩”心态已开始迁移到自定义器中，你可能现在看到它也开始被各种设置塞满。\n\n尽管非技术型客户喜欢用主题选项来修改他们的主题，但有时过多的选项带来的问题似乎比它们解决的更多：\n\
    \n-   过多的选项可能会让那些不太熟悉网站设计核心原则的用户感到无所适从。\n-   设置和配置一个主题可能比预期花费更多时间。\n-   很容易犯错，比如选错颜色、导致文本难以阅读等。\n\
    -   用户可能会在他们的主题中添加过多字体，从而破坏设计并拖慢网站速度。\n-   更多的选项意味着为主题添加更多功能，从而影响其性能。\n\n尽管你的客户起初可能不接受这一点，但你是主题设计师，因此你才是最适合为你的主题做出重要设计决策的人。\n\
    \n一个经过精心调校的主题选项数量应该足以让你的客户进行一些有针对性且经过（你）预先定义的修改，以个性化主题并使其成为他们自己的。\n\n## 实施智能的图形优化技术\n\
    \n与模板文件、脚本和样式相比，图像很可能是对主题性能影响最大的因素。只需用 Pingdom 的速度测试工具测试任何一个主题即可验证这一点。\n\n然而，大量使用全屏、醒目的图片也并不奇怪。图片为主题增添了巨大的美学价值，客户在很大程度上是基于视觉冲击力来选择主题的。\n\
    \n尽管很难抗拒精美图形的魅力，但以下指导原则可以帮助你编码出更快的主题，而不必牺牲（太多）美学：\n\n-   尽可能少地使用图像始终是一个好的指导原则。\n\
    -   利用 CSS 混合模式、滤镜和低分辨率图像上的半透明叠加层来掩盖像素化并增强其视觉外观。你也可以尝试在 HTML 元素和文本上（而不是图像上）使用\
    \ CSS 混合模式和滤镜进行实验，以在可能的情况下创造出惊人的视觉效果。\n-   确保图像格式合适并针对网页进行了优化。\n-   在适当的地方，使用\
    \ CSS 雪碧图将你的图像组合成一张大图，从而减少 HTTP 请求。\n-   尝试为图像实现延迟加载。这样做可以实现更快的页面加载，并且如果用户没有滚动到\
    \ `<img>` 标签的位置，图像就完全不需要下载。要在 WordPress 中延迟加载图像，你可以选择许多优秀的插件，例如 Lazy Load、a3 Lazy\
    \ Load 和 Rocket Lazy Load。\n\n## 将客户支持和教育作为你的支柱\n\n与其给你的客户提供大量令人困惑且耗时的主题选项，不如尝试提供全面的支持和教育，教他们如何使用你的主题、图像优化、WordPress\
    \ 基础知识等。\n\n你可以通过以下方式实现：\n\n-   博客文章\n-   可下载的指南\n-   视频教程\n-   你网站上的常见问题解答（FAQ）\n\
    -   用于解决使用你的主题时可能出现的更具体问题的工单系统。\n\n分享关于你的产品和你为其构建平台的基础知识，是让你的主题易于客户使用的绝佳方式，并有助于建立高度的信任感，而这正是健康且成功业务的核心。\n\
    \n## 有时灵活性胜过性能\n\n可能存在少数情况，你认为为了获得微小的性能提升而牺牲一些灵活性并不是个好主意。\n\n我想到了几个例子。\n\n## 编写\
    \ DRY 代码可能会让你的客户不开心\n\n第一个例子来自汤姆·麦克法兰（Tom McFarlin），他是一位著名的 WordPress 主题开发者和作家。\n\
    \n在他的博客中，他解释了为什么在开发他的主题 *Meyer* 时，他决定包含大量的 WordPress 模板文件，从而违反了 DRY（不要重复自己）编码原则（并且在一定程度上对性能也产生了负面影响）。\n\
    \n*Meyer* 的目标用户是那些不太懂 WordPress 技术知识的博主和数字出版商。知道缺乏编码经验并不会阻止这类人群去摆弄他的主题，汤姆·麦克法兰想了一个办法让他们更轻松。他向客户提供了大量的模板文件，他们可以轻松地将这些文件复制粘贴到\
    \ WordPress 子主题中进行自定义，而无需修改原始主题。\n\n麦克法兰写道：\n\n> 如果模板是在基础主题中定义的——而不是，比如说，一堆开发者式的条件判断语句——用户将更容易基于已有的东西来创建他们的模板……\n\
    > \n> 所以如果我必须以某种简洁的方式总结这一点，我会说，我——像许多开发者一样——希望尽可能保持我的代码符合 DRY 原则，但在 WordPress\
    \ 主题开发的背景下这样做会有一个权衡。\n> \n> 如果你打算将产品面向广泛的受众营销，我认为保持 DRY 并不是最好的方式。\n> \n> ***了解你的客户——博主。***\n\
    \n## 静态源代码对性能更好，但不要在你的公开主题中使用\n\n我的第二个关于何时不应为了某些性能提升而牺牲灵活性的例子，基于《Codex》中的性能建议。\n\
    \n你会发现一些很好的性能提示，但有一个我不建议你使用，至少如果你打算将你的主题发布给普通公众的话。\n\n它是这样说的：\n\n> 静态值能否硬编码到你的主题中？这意味着每次更改时你都必须编辑代码，但对于通常是静态的区域，这可能是一个很好的权衡。\n\
    > \n> 例如，你的网站字符集、网站标题等等。\n> \n> 你能硬编码那些很少更改的菜单吗？避免使用像 `wp_list_pages()` 这样的函数。\n\
    > \n> **Codex — WordPress 优化/WordPress 性能**\n\n避免不必要的数据库调用和优化你的 SQL 查询是每个主题都应遵循的优秀实践。\n\
    \n如果你的主题运行有点慢，尝试寻找执行时间过长的数据库查询问题。你可以在开发环境中使用像 Query Monitor 这样的插件来帮助你完成这项任务。\n\
    \n然而，将网站标题、菜单项等信息硬编码进去是绝对不行的。即使你的用户在设置后从未更改过这些信息，他们也至少需要设置一次，并且他们理所当然地期望通过 WordPress\
    \ 的动态功能来完成。\n\n此外，即使你的主题用户愿意深入研究源代码，他们也必须修改主题文件来添加所需的数据。这几乎从来都不是一个好主意，不仅因为所有更改都会在下次主题更新时被覆盖。\n"
