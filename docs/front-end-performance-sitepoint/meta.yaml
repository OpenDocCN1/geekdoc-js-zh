    Feeling sufficiently frustrated? Good. Let''s get to work and fix the web.


    # Context is Everything


    You might have noticed that the main bottleneck is the time it takes to load up
    your website. Specifically, the JavaScript download, parse, compile and execution
    time. There''s no way around it but to load less JavaScript and load smarter.


    But what about the actual work that your code does aside from just booting up
    the website? There has to be some performance gains there, right?


    Before you dive into optimizing your code, consider what you''re building. Are
    you building a framework or a VDOM library? Does your code need to do thousands
    of operations per second? Are you doing a time-critical library for handling user
    input and/or animations? If not, you may want to shift your time and energy somewhere
    more impactful.


    It''s not that writing performant code doesn''t matter, but it usually makes little
    to no impact in the grand scheme of things, especially when talking about microoptimizations.
    So, before you get into a Stack Overflow argument about `.map` vs `.forEach` vs
    `for` loops by comparing results from JSperf.com, make sure to see the forest
    and not just the trees. 50k ops/s might sound 50× better than 1k ops/s on paper,
    but it won''t make a difference in most cases.


    # Parsing, Compiling and Executing


    Fundamentally, the problem of most non-performant JS is not running the code itself,
    but all the steps that have to be taken *before* the code even starts executing.


    We''re talking about levels of abstraction here. The CPU in your computer runs'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'machine code. Most of the code you''re running on your computer is in the compiled
    binary format. (I said *code* rather than *programs*, considering all the Electron
    apps these days.) Meaning, all the OS-level abstractions aside, it runs natively
    on your hardware, no prep-work needed.


    JavaScript is not pre-compiled. It arrives (via a relatively slow network) as
    readable code in your browser which is, for all intents and purposes, the "OS"
    for your JS program.


    That code first needs to be parsed — that is, read and turned into an computer-indexable
    structure that can be used for compiling. It then gets compiled into bytecode
    and finally machine code, before it can be executed by your device/ browser.


    Another *very* important thing to mention is that JavaScript is single-threaded,
    and runs on the browser''s main thread. This means that only one process can run
    at a time. If your DevTools performance timeline is filled with yellow peaks,
    running your CPU at 100%, you''ll have long/dropped frames, janky scrolling and
    all other kind of nasty stuff.'
