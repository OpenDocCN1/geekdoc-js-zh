  md: '# # NumberPattern GG


    Our approach will be to assume that the computer screen is a combination of rows
    and columns, dividing it into smaller boxes—the smallest box treated as a resident
    of just a single character only. The address in smallest box on the display screen
    will logically become a unique (row, column) numeric combination. With this assumption,
    the computer will simply be a unique combination of (row, column) numeric value
    paired boxes that are uniformly spread across the screen.


    | A B C D E D C B A |

    | A B C D D C B A |

    | A B C C B A |

    | A B B A |

    | A A |


    | Col-1 | Col-2 | Col-3 | Col-4 | Col-5 | Col-6 | Col-7 | Col-8 | Col-9 |

    | Row=1 | A B C D E D C B A |

    | Row=2 | A B C D C B A |

    | Row=3 | A B C | C B A |

    | Row=4 | A B | B A |

    | Row=5 | A | A |


