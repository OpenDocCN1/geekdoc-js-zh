  md: '> If you can imagine, you can do it. - Enzo Ferrari


    Practicing nested loops along a correct sense of applying logical conditions can
    immensely build confidence in a novice programmer.


    In general, programmers are always expected to be good at programming logic. If
    a programmer has confidence, further advanced learning will be met with much confidence.
    Every programmer might wish to have that level of imaginative sense so that programming
    logic should get click naturally, making the demand of the problem to be solved.
    It will be just wishing to expect clarity about the visualization of programming
