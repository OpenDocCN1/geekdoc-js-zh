  md: '# Storing different data types


    The intelligence of software is due to a programming language(s). The processing
    of different data types in some form is very core to almost every software. The
    facility to manipulate different types of data correctly is a necessary feature
    of any programming language—the commonly used different data types.


    | General data type | Value examples |

    |---|---|n| Integer | 23, -4, 8908 |

    | Real Numbers | 23.45, 3.1456, -45.27 |

    | Truth Values | True, False |

    | text | "Just do it", "impossible" |

    | Single Character | A, a, @, S, *, 9 |


    Don''t we use different variety of data in our daily life? We actually do, for
    example


    # Equivalent variable assignment | Filled in personal details


    name = **Guido Van Rossum**

    age = 63

    weightInKgs = 53.6

    personLoan = False

    gender = ''M''

    Name : **Guido Van Rossum**

    Age: 63

    Weight(In Kgs): 53.6

    Personal loan (True/False): False

    Gender : M


    We are sometimes required to correctly fill personal details in some way or another.
    Few examples are like school or college admission process, flight booking, or
    any online purchasing. We can easily distinguish different data types, whether
    it is a type numeric, textual, or any other kind. For example, the data 25 could
    be age, price, and many more possibilities. The name of the variable should be
    appropriately chosen. The variable''s chosen name helps us know the meaning of
    the stored contained in.


    **How to store data/value in a variable?**

    Yes, it is made through the facility of variable assignment using assignment operator
    (=).


    # Variable assignment


    The value of a variable can be over-written, which is why it''s called a variable.
    Real-time situation of manually filling data can be simulated using a programming
    language feature known as variable assignment. A variable assignment is a simple
    act of storing an appropriate value in a chosen variable using the assignment
    operator (=). **We can store or assign only one data at a time.**nThe contents
    of variables can be over-written during the course of running or executing the
    program. The format for variable assignment is as follows:


    ```

    variable_name = # assign only one data at a time

    ```


    The variable name doesn''t start with a number. Hence, a variable like **4Age**
    is invalid

    **4Age = 20 # invalid variable name.**


    The name of a variable represents a memory location. It''s not easy to do programming
    using the name of memory locations. Memory address resembles not less than any
    secret key. The name of a variable that we choose should be a user-friendly name
    representing a specific memory location allocated to store data. Python provides
    the inbuilt methods - **id()** and **type(** to know the variable''s memory location
    and data type.'
