    Two major reasons why the approach mentioned in this book works for the novice
    or unconfident programmers;


    A) Visual learning is a great way to improve our learning skills. I have experimented
    with the mentioned approach with many students and found this to be an incredibly
    interesting way to learn program quickly. These teachings are outlined in the
    book to help spark interest in programming. it is a practice built up on common
    sense and basic mathematics; thus, practically anyone can learn programming without
    getting bogged down with technicalities.


