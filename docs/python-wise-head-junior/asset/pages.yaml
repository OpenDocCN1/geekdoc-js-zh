  md: '# # Preface


    # ## EVEN THE GREATEST WAS ONCE A BEGINNER.

    DON''T BE AFRAID TO TAKE THAT FIRST STEP.


    > - Muhammad Ali


    Programming is a kind of mental aerobics that teaches us to keep focus and nourishes
    good

    patience, discipline, and forecasting. These are some main qualities of an achiever.


    *Programming is for everybody and not just an academic exercise.*


    When you visualize and process the information, the learning will become active.
    When you apply

    the information naturally, there is no need for memorization. Programming is not
    about memorizing

    tprogramming logic. It is about applying techniques to solve problems. In order
    to apply an

    approach correctly, one should be able to visualize it correctly. The best introduction
    to

    programming is to learn the logic of programming first. This is a means to build
    confidence and

    interest in programming. A programmer should be able to solve the following logic-based
    problem.

    Based on different inputs, a person should be able to generate a wristwatch of
    customized sizes.

    Because of a lack of wisdom in programming, most beginners cannot accomplish this.
    The excellent

    point is that learning logic-building skills does not require much technical baggage.


    ![](img/19247dc2edd12faecc2f050f298887d0_4_0.png)


    Many beginners judge that if they can learn syntax or explore some common built-in
    features of the

    programming language, they will learn how to solve problems. That is not the truth.
    Learning traffic

    rules and signboards by themselves will not help someone become proficient in
    driving. You''ll have to

    take steps in the right direction. Syntax-oriented learning about programming
    language just

    get started. Syntax-oriented learning for a programming language is suitable for
    experienced

    programmers. Experienced programmers already possess that wisdom, so they only
    need to discover

    the language''s rules and features to use. This does not apply to beginners.'
