  md: "# Patterns by Single Looping\n\nWe can output some of the patterns that we\
    \ have earlier achieved using a nested loop (one-for-loop within another for-loop)\
    \ by single *for-loop* using the `join()` method.\n\n+   * \n*\n*\n*\n*\n*\n*\n\
    \nPattern A1\n\n# StringPatternA1.py\n\n```\ntotalRows = 5 # number of rows to\
    \ display\nstrPlus = \"\" # initialize with blank string.\nstrJoin = \"\" # initialize\
    \ with blank string.\n\nprint(\"Print using operator + \")\nprint()\nfor row in\
    \ range(1,totalRows + 1):\n    # Column level Repetitive Action : without for-loop\n\
    \    # append to the existing string using concatenation operator +\n    strPlus\
    \ = strPlus + \"*\"\n    # Print the updated string stored in variable:line\n\
    \    # and move to the next row\n    print(strPlus)\n\nprint(\"Print using in-built\
    \ function join()(\")\")\nprint()\nfor row in range(1,totalRows + 1):\n    # Column\
    \ level Repetitive Action : without for-loop\n    # append to the existing string\
    \ using single space(\" ) character\n    # as a separator\n    strJoin = \" \\\
    join([\"*\",strJoin])\n    # Print the updated string stored in variable:line\n\
    \    # and move to the next row\n    print(strJoin)\n```\n\n+   * \n*\n*\n*\n\
    *\n*\n*\n\nOutput\n\n325"
