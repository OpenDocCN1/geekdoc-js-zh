  md: '# If-else Shortcut


    Short-cut in any matter is a special case to be applied in a specific situation.
    In programming, people unknowingly confuse themselves simply because they choose
    a special case and try to apply it commonly. Even in the choice of words, two
    words may give almost similar meanings, and when we actually apply those in different
    situations, then only will we be in a position to explore its true potential meaning.


    The shortcut to the if-else option is in almost every programming language known
    as the ternary operator and given by the symbol (:).


    # When to apply if-else shortcut


    The ternary operator is a sort of syntactic sugar for if-else statements usually
    applied in a situation where both if-block and else-block assign different value
    to the same result variable. For example, suppose that the if-else statement is
    something like this:


    | If-statement | If-else shortcut or ternary operator (:) |

    | --- | --- |

    | If(condition): | result = one_value if (condition) else other_value |

    | result = one_value | |

    | else: | |

    | result = other_value | |


    +   Simple if-else can be easily replaced by the use of if-else shortcut represented
    by the one liner ternary operator. In situations only it makes True sense to use
    ternary operator to increase readability.

    - Two outcome result values are possible which are separated by a symbol colon
    (:).

    - Condition is True, then one_value will get assigned to the variable result.

    - Condition is False, then one_value will get assigned to the variable result.


    In the program NumberPatternFF.py, we can use the ternary operator to improve
    the part of source code readability.


    | Separate if-else | Many if-else combined in single if-else |

    | --- | --- |

    | if(row == 0): | if(row == 0): |

    | lw_it_num = (totalRows - 1) | lw_it_num = (totalRows - 1) |

    | else: | lw_it_spaces = 0 |

    | lw_it_num = (totalRows - row) | up_it_spaces = -1 |

    | if(row == 0): | else |

    | lw_it_spaces = 0 | lw_it_num = (totalRows - row) |

    | else: | lw_it_spaces = (totalRows - row + 1) |

    | lw_it_spaces = (totalRows - row + 1) | up_it_spaces = (totalRows + row - 1)
    |


    279'
