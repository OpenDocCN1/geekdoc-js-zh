  md: '# # NumberPattern 1A


    Our programming job is to print this particular logic-based pattern on one part
    of the computer screen. Our approach will assume that the computer screen is a
    combination of rows and columns, virtually dividing it into smaller boxes the
    smallest box treated as a resident of just a single character. The address in
    each smallest box on the display screen will become a unique (row, column) numeric
    combination. With this assumption, the computer screen will simply be a unique
    combination of (row, column) numeric value paired boxes that are uniformly spread
    across the screen.


