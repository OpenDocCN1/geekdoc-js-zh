    respective variables is fixed. We can make it interactive so the data can be supplied
    directly from the keyboard. To supply data directly from the keyboard, we will
    use Python''s builtin function input(). It will be more positive if we input a
    user-friendly message while using method input("Input message"). Example5. Print
    person''s details from the keyboard.


    ```

