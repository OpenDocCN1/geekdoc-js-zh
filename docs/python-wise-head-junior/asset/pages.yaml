  md: '# Convert Logical Conditions to Simple Picture


    We need to express logical conditions in the form of simple picture-based exercises.
    We need to mark those boxes with * character, which rightly fits a logical condition.
    A unique combination of (row, col) pair represents each box. To understand how
    the selection of boxes is made using specific logical conditions are shown in
    the following exercises.


    ExerciseB1: Logical condition (row = col) in the SX5 box.


    The condition (row = col) asks to find those (row, col) pairs in the SX5 box where
    row value and col value are equal. We notice that the values of row and col are
    on the diagonal squares.


    For clear understanding, boxes are marked with thick borders where the row and
    col values are equal


    As per the rule, we should put * character on those boxes whose row and col values
    are equal.


    | col-1 | col-2 | col-3 | col-4 | col-5 |

    |---|---|---|---|---||

    | row-1 | 1,1 | 1,2 | 1,3 | 1,4 | 1,5 |

    | row-2 | 2,1 | 2,2 | 2,3 | 2,4 | 2,5 |

    | row-3 | 3,1 | 3,2 | 3,3 | 3,4 | 3,5 |

    | row-4 | 4,1 | 4,2 | 4,3 | 4,4 | 4,5 |

    | row-5 | 5,1 | 5,2 | 5,3 | 5,4 | 5,5 |


    | col-1 | col-2 | col-3 | col-4 | col-5 |

    |---|---|---|---|---||

    | row-1 | 1,1 | * | 1,2 | 1,3 | 1,4 |

    | row-2 | 2,1 | 2,2 | * | 2,3 | 2,4 |

    | row-3 | 3,1 | 3,2 | 3,3 | * | 3,4 |

    | row-4 | 4,1 | 4,2 | 4,3 | 4,4 | * |

    | row-5 | 5,1 | 5,2 | 5,3 | 5,4 | 5,** |


    Removing other (row, col) value pairs where the consolidated logical condition
    doesn''t equal indicates that we delete them simply means that only those boxes
    were chosen and marked with * character that matches the given logical condition.
    We can represent particular logical conditions by filling small boxes with * character.


    So, the meaning of logical condition took the visual form. The expression of the
    logical condition gets transformed into the simple picture of a line drawn using
    * characters. This helps us to understand how filtering/selection of takes place
    when using logical conditions.


    | col-1 | col-2 | col-3 | col-4 | col-5 |

    |---|---|---|---|---||

    | row-1 | 1,1* | | | | |

    | row-2 | | 2,2* | | | |

    | row-3 | | | 3,3* | | |

    | row-4 | | | | 4,4* | |

    | row-5 | | | | | 5,5* |


    | col-1 | col-2 | col-3 | col-4 | col-5 |

    |---|---|---|---|---||

    | row-1 | * | | | | |

    | row-2 | | * | | | |

    | row-3 | | | * | | |

    | row-4 | | | | * | |

    | row-5 | | | | | * |


    We turned an expression of logical condition into a simple picture of a diagonal
    line drawn using * characters. Such a targeted attempt refines our skill of applying
    logical conditions.'
