  md: '# What is there in the variable''s name?


    We know that in geographical maps, the locations can be represented as a combination
    of longitude & latitude. Think for a moment if our city, town, street places are
    replaced by longitude and latitude values, how much it would become difficult
    to use in our normal communication. So, the choice of a variable should be a meaningful
    name and indicate some purpose associate with it. It is not uncommon to find programmers
    who have this special LVNS sickness.


    # What is LVNS sickness?


    LVNS stands for Single Letter Variable Name Syndrome. Many programmers have this
    special habit of creating suspense through the name of a variable. They allocate
    a single letter for a variable''s name in writing programs. When a program becomes
    lengthy, and someone else has to fix a bug/error for that programming code, it
    will surely turn out to be an irritating experience. Even LVNS programmers may
    find it difficult to get/her own programming logic quickly revisiting after a
    gap of time. If you such programmers, please request them to change this; it is
    an offense. Please prevent yourself from this sickness and be patient enough to
    write meaningful variable names.


    # Input From Keyboard


