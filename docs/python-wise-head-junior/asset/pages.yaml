  md: '# Writing our own functions


    We have often used the concept of generalized expression based on variable(s)
    to represent hardcoded values. We can still go ahead generalize programming logic
    too. One of the major advantages of function with input parameter(s) is to achieve
    customized output by reusing the same programming logic. Writing functions is
    a sensible idea that suggests how we can encapsulate programming logic under different
    names. However, repetition of programming logic should not happen in other functions.
    It should be sliced out only one type of action. We can use them on demand, similar
    to how Lego toys are in use, building something meaningful. We learned the concept
    of code reuse by implementing the most commonly used syntax to create function.
    The function name should begin with def and end with a colon (:). A function may
    or require parameters. It also depends on whether the function requires to be
    input values. Basically, function parameter works as a variable and optionally
    allow for input values as required. We already got this by using different versions
    of in-built methods and functions like print()-the example of our function with
    parameters given as follows. The programming statements written in a function
    should be equally indent.

    def functionName(parameter1,parameter2,...):


    +   # programming logic

    - statement-1

    - statement-2


    Where parameter1, parameter2... are inputs to a function. We can store the output
    result of a variable by means of the function can give as follows.


    result = functionName(value1, value2,...) # variable:result stores the output
    of this function call.


    functionName(value1, value2,...) is a function, and we can call it many times
    within a program to implement targeted functionality. The rules for naming a function
    or a variable are the same and given as:


    +   1) Function name should begin with either character: A-Z, a-z, and underscore(_).

    2) Remaining part of the function name can contain the characters from A-Z, a-z,
    digits(0-9), and underscore(_).

    3) Any reserved word that a programming language is using can''t be used. For
    example, we cannot create our own function and name it as print() or create a
