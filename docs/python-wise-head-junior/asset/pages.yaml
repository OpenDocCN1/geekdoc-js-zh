  md: '# First Python Program


    It is a good gesture to introduce programming to someone with a greeting message,
    and it is not compulsory. Often, first-time learners try to print "Hello World"
    or their own name. The following Welcome.py python program outputs the text Welcome
    to Programming.


    ```

    Welcome.py

