  md: '# Learning by experiments and guesswork


    The usual and common way to learn programming is just by randomly experimenting
    with it. This takes much more time to learn programming as required practice.
    No doubt it has advantages, especially if we want to explore the API/in-built
    libraries or explore the features of a programming language. This particular learning
    style by beginners may act like a killer of interest in the programming subject
    itself. This takes more time to learn programming, and, for some people, it is
    an interesting way. However, everyone can guess every area, and there is no sure
    formula for guesswork to everyone. It''s difficult for a person to experiment
    with programming without making a good guess or even guesswork. The imagination
    regarding programming does not fly for many, and the person''s mind goes blank.
    So will not be a surprise if a person is good in many other activities and lacks
    patience in learning programming. This is not specific to learning programming
    as a subject; it could happen with learning any other subject.


    The ground reality is if imagination and thought process does not fly for a person
    to learn something, it doesn''t go into the head. Learning programming is a switch
    off to many of them. It doesn''t reflect any way of learning. Instead, a systematic
    approach to learning programming based on simple math and common sense makes learners
    thinkers. That approach depth at different levels of difficulties to properly
    learn programming logic is covered in the next section, programming patterns.


    In order to do programming in patterns, the person has to know for-loop and applying
    logical conditions well. Looping is the hardest. A nested loop challenges us to
    think logically in two different directions simultaneously to output a pattern,
    and any pattern is a 2-dimensional simple picture. These type of activities stimulate
    logical thinking. During learning, getting multiple and different thoughts are
    common. Let''s try to think about confusion or doubts from a different perspective.
    It creates a kind of suspense and makes learning exciting. Confusions and doubts
    are good for learning programming, and it is an indication that learner''s thought
    process and imagination becomes active. It happens many times that clearing one''s
    doubt opens the door to explore knowledge areas. So, basically works like a surprise
    knowledge capsule. A learner needs to keep working in order to resolve this specific
    doubt or confusion. So, whenever we have doubt, we have got one chance to improve
    our intelligence.


    Obviously, we will not last if a systematic approach does not support it. A person
    who is good at developing programming logic encounters obstacles whenever required
    to deal with harder subjects of programming. So good programming logic is the
    key, and this book is all about developing programming logic skills, and it doesn''t
    matter if someone initially was a big zero in it. The content in this book surely
    helps a person to become interested in programming. The exercises in increasing
    order of difficulty naturally. Some exercises are specially included only to surprise,
    forcing the learner to think out of the box.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Programming Patterns


    Any pattern is simply a 2-dimensional picture. We deal with 2-dimensional types
    of output most of the time, whether it''s on the desktop/web/mobile application.
    So is the reason to select simple picture-based problems to address common programming
    logic issues. Using a programming language, if someone is good at outfitting in
    two-dimensional, we can expect that person to take care of the three-dimensional
    programming aspect, as such game programming.


    The main idea behind selecting pictorial pattern-based exercises is that it clearly
    validates the programmer''s logic. The mismatching output forces learner to think
    for an appropriate reason. This way of repetitively working on programming logic
    to get the matching output greatly helps the visualization of programming logic.
    It is also type of reverse engineering, and we will see how it works to improve
    programming skills. These exercise does create curiosity a lot. This happens,
    makes learner alert, self-motivated and sure teaches good amount of patience with
    each. The programmer''s imagination should work in a direction to trap the programming
    logic. If this happens, then programming will be an interesting job. In software
    development workplaces, one programmer has to understand other programmers'' programs.
    This is also true; a programmer can learn good programming from other programmers.
    In all cases, mastery over the visualization of programming logic should be the
    prime focus for any beginner programmer. Looping is the only hardest thing in
    a program. Mastering the flow of control in nested loops is enough to boost the
    confidence of beginners programmers.


    In a nutshell, a beginner''s confidence in programming capabilities has a direct
    relation with low/average/high level of visualization of programming logic.


    ![](img/19247dc2edd12faecc2f050f298887d0_90_0.png)


    What we are going to learn is a simple math-based approach to find the actual
    program logic. This technique requires some level of practice, and the more we
    practice more it will refine our imagination to trap the programming logic.'
