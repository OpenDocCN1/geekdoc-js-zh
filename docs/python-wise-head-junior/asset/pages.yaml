  md: '# # Python Project Appendix


    Please refer to Appendix-A at the end of this book.

    **Appendix-A: Installation of IDE and project set-up**

    It shows a step-by-step procedure to create a Python project using IDE. It also
    shows screen-shots of how to create and execute a Python program. Alternatively,
    you can use any free online editor, for example,

    https://www.tutorialspoint.com/execute_python3_online.php

    Click the Execute button to run the program. The main.py tab be opened to write
    the program. A separate window is shown to display the output.


    ![](img/19247dc2edd12faecc2f050f298887d0_17_0.png)


    ![](img/19247dc2edd12faecc2f050f298887d0_17_1.png)


    After completing program, press ''enter'' on the keyboard to see the program''s
    output.

    We should save each program in its own file for later reference. Every file has
    a name and extension. The extension of the program file is ".py". Suppose the
    name of our first program is Welcome, which will output a welcome message. We
    should name the programming file with a meaningful name as per the purpose. So
    we create Welcome.py file.'
