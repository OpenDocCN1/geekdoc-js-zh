  - "[PAGE 83]\n\n# 7.6 Physics Debug Node\n\nA physics body consists of shapes that\
    \ have polygon data. You have to attach a PhysicsSprite to the body in order to\
    \ see the physics body in action; without that, there is an object PhysicsDebugNode\
    \ that you need to add to the layer in order to see the polygons without sprites.\
    \ In the preceding example for box and circle shapes, PhysicsSprite is not attached,\
    \ so we are going to rely on PhysicsDebugNode:\n\n```\nsetupDebugNode : function()\
    \ {\n    this._debugNode = new cc.PhysicsDebugNode(this.space);\n    this.addChild(this._debugNode);\n\
    }\n```\n\nNow the circle and box polygon data will be visible on screen without\
    \ adding PhysicsSprite.\n\n# 7.7 Collision Detection\n\nChipmunk has the ability\
    \ to detect collisions between physical bodies. Every physics body has to be tagged\
    \ with CollisionType so that it will be visible for collision detection:\n\n```\n\
    addCollisionCallback:function() {\n    // 0 and 1 are tag for box and circle\n\
    \    this.space.addCollisionHandler(0, 1, function() {\n        cc.log('Box and\
    \ Circle colliding!');\n        return true;\n    }, null, null, null);\n}\n```\n\
    \nAs you can see, the addCollision handler, with the tag 0,1 for box and circle,\
    \ has been used to detect any collision between the two objects.\n\n# 7.8 Putting\
    \ It All Together\n\nFinally, it is time to put it all together. In the layer\
    \ constructor, include the following code:\n\n```\nthis.initPhysics();\nthis.setupDebugNode();\n\
    this.addWallsAndGround();\nthis.addPhysicsCircle();\nthis.addPhysicsBox();\nthis.addCollisionCallback();\n\
    this.scheduleUpdate();\n```"
