    \n![](img/c9248a93bcc9d1d0881a7269e1be3174_65_0.png)\n\n图 5-2. MenuItem\n\n##\
    \ 5.4 其他 GUI 元素\n\n除了模块和标签外，扩展模块中还可以使用其他 GUI 元素，例如复选框和按钮。为了使用扩展类，我们需要将扩展模块添加到我们的项目中。在\
