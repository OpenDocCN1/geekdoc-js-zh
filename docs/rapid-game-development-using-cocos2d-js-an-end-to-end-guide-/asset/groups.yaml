    —Abdul Rahman


    # 第 1 章


    ## 入门


    ## 1.1 引言


    在早期，游戏很难制作，但近年来 2D 和 3D 框架工具已经演进，简化了游戏开发，并使开发者能够快速制作高质量的游戏。Cocos 是一种被广泛用于制作 2D
    游戏的引擎。多年来，Cocos 在开发者中建立了坚实的基础。市场上的许多流行游戏都是使用 Cocos 开发的。2010 年，Cocos2D 的 C++ 端口
    Cocos2d-x 被引入，这使得开发者能够制作跨平台的 2D 游戏。之后，引入了 Cocos2d 的 JavaScript 端口 Cocos2d-js，使开发者能够制作基于器的游戏以及使用
    JS 的跨平台原生游戏。


    Cocos2d 因其简单性和丰富的特性集，已成为制作 2D 游戏的事实证明的标准。在接下来的章节中，我们将深入研究 Cocos2d-js 框架及其特性。读完本书后，你将对
    Cocos2d-js 框架、最佳实践以及能够让你快速开发出精彩游戏的丰富特性集有坚固的理解。让我们开始吧！


    ## 1.2 环境搭建


    ### 1.2.1 安装 Python


    大多数时候，你将需要使用 Cocos 控制台来创建、运行、编译和部署你的项目。控制台使用 Python，你需要做的第一件事就是安装 Python。你可以从
    Cocos 官网下载：https://www.python.org/downloads/。


    如果你正在开发 MacOS X，它默认安装了 Python。


