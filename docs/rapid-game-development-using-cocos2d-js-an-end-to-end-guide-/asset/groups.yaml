  - "[PAGE 80]\n\nPhysics simulation happens inside the Chipmunk space, where the\
    \ physics body gets physics properties set; those bodies will shapes defined,\
    \ which can be a box or circle or polygon. Every Chipmunk space will have a default\
    \ staticBody as its child, and shapes added to it will not be affected by physical\
    \ properties and will be static objects like walls or obstacles, etc. All the\
    \ bodies will be associated with PhysicsSprite, with its sprite location and rotation\
    \ will be determined by the physics body associated with it. In the upcoming example,\
    \ we are going to create a Chipmunk space, add walls to the four boundaries, and\
    \ add two bodies, a box and a circle, to the space. Then, we are going to watch\
    \ the simulation.\n\n# 7.3 Chipmunk Space\n\nThe first thing you have to do include\
    \ the Chipmunk module in your project.json file:\n\n+   - \"modules\" : [\"cocos2d\"\
    ,...,\"chipmunk\"]\n\nLet's see how this space can be created:\n\n```\ninitPhysics:function()\
    \ {\n  //init space\n  this.space = new cp.Space();\n  //setup the Gravity\n \
    \ this.gravity = cp.v(0, -800); //Earth gravity\n  this.space.sleepIterations\
    \ = 30;\n  this.space.sleepTimeThreshold = Infinity;\n  this.space.collisionSlop\
    \ = Infinity;\n}\n```\n\ninitPhysics function will be placed inside the layer\
    \ object; that is, initPhysics will be one of the properties of layer object.\
    \ The cp.Space class is used to create the space, and gravity, iterations, sleepTimeThreshold,\
