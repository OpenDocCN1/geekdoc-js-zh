    # 7.9.3 Pivot Joint


    In a pivot joint, two physics bodies will be connected using a single anchor point.
    The position and angle of the two bodies with respect to the anchor point will
    be determined by the initial positioning of the bodies and anchor point. It is
    more like two pin joints: one between bodyA''s default anchor point and the joint
    anchor point, and one between bodyB''s default anchor point and the joint anchor
    point. The constraint will be maintained throughout.


