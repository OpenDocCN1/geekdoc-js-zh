    # 第 5 章 添加 GUI\n\n在此处，创建了一个带有普通图像和选中图像的按钮实例：\n\n```\nthis.uiButton = new ccui.Button(res.ButtonImage,res.ButtonImage_Selected);\n\
    ```\n\n并且创建了一个复选框实例，同样使用了普通和选中图像：\n\n```\nthis.uiCheckBox = new ccui.Checkbox(res.Checkbox_Normal,res.Checkbox_Selected);\n\
    ```\n\n如果你运行上一个层，输出结果将类似于图 5-3。\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_67_0.png)\n\
    \n图 5-3. 其他 GUI 元素\n\n# 第 6 章\n\n## 动画之旅\n\n## 6.1 简介\n\n动画是获取任何优秀游戏的关键，因为它能让你的游戏动画变得酷炫且具有视觉吸引力，并帮助你获取更多用户。具有视觉吸引力的游戏会自我营销。花点时间看看\
    \ Google Play 和 App Store 上畅销的游戏。顶级游戏使用清晰且细节丰富的动画来提升用户体验并吸引用户。深呼吸，因为我们将查看 Cocos2d-js\
    \ 中动画系统的细节。让我们开始吧。\n\n## 6.2 动作 (Actions)\n\n动作（Actions）是 Cocos2d-js 中用于精灵（sprite）动画的构造结构。动作会随时间改变精灵的属性，从而使精灵以我们想要的方式进行动画。有几种类型的动作可以应用于精灵上来实现动画。让我们来看一个简单的例子：\n\
    \n```\n1 var action = cc.moveBy(2, cc.p(size.width - 40, size.height - 40));\n\
    2 this.sprite.runAction(action);\n```\n\n在这个示例中，使用 `cc.moveTo` 函数创建对象。任何动作都可以使用\
    \ `runAction` 方法在精灵上运行。该方法通常属于 `cc.Node`，除了精灵之外，我们还可以对任何具有 `cc.Node` 为父节点或顶层父对象的对象（例如层、场景等）。基本上，创建动作有两种变体。\n\
    \n### 6.2.1 By 和 To 动作\n\n之前的代码是 By 变体的示例。让我们来看带有 `To:` 版本的相同示例：\n\n```\n1 var\
    \ action = cc.moveTo(2, cc.p(size.width - 40, size.height - 40));\n2 this.sprite.runAction(action);\n\
    ```\n\nBy 和 To 动作之间的区别在于，`To` 会将目标属性值动画到绝对值，而 `By` 会将目标属性值动画到相对值（例如：如果你有一个位置在\
    \ (10,10) 的精灵，并使用 `moveBy` 动作以 (10,10) 进行动画）。\n\n## 6.3 可用动作\n\n以下是你可以应用的动作列表。组合包括\
    \ By 和 To。\n\n### 6.3.1 Move\n该动作用于移动\nmoveBy(2, cc.p(size.width - 40, size.height\
    \ - 40));\n\n### 6.3.2 Jump\n该动作用于跳跃\nJump(2, cc.p(size.width - 40, size.height\
    \ - 40)), 50, 10);\n\n### 6.3.3 Rotation\n该动作用于动画旋转\nrotateBy(2, 90);\n\n### 6.3.4\
    \ Scale\n该动作用于缩放\nscaleBy(2, 1.5);\n\n### 6.3.5 Skew\n该动作类似于缩放，但它使用了偏移值\nskewBy(2,\
    \ 30);\n\n### 6.3.6 Tint\n该动作用于动画节点的 RGB 通道\ntintTo(2, 255, 255, 255);\n\n###\
    \ 6.3.7 Bezier\n该动作用于通过贝塞尔曲线移动目标\nvar bezier = [[cc.p(0, windowSize.height / 2),\
    \ cc.p(300, -windowSize.height / 2), cc.p(300, 100)];\nvar bezierForward = new\
    \ cc.BezierBy(3, bezier);\nvar bezierTo = new cc.BezierTo(3, bezier);\n\n### 6.3.8\
    \ Cardinal Spline\n这类似于贝塞尔。目标将通过三次样条曲线移动\ncardinalSplineTo(3, array, 0);\n\n##\
    \ 6.4 缓动 (Easing)\n\n默认情况下，所有随时间线性动画节点属性的动作都称为线性插值。这种动画看起来很直白。当你想要为动画添加自然效果时，你的动画需要一个缓动函数。见图\
    \ 6-1。\n\n在 Cocos2d-js 中，有超过 26 种类型的缓动。对于所有缓动，用法方法都是相同的。让我们来看一个例子：\n\n```\nvar\
    \ easing=cc.easeBackIn();\n//或者\nvar easing=new cc.EaseBackIn();\naction.easing(easing);\n\
    ```\n"
