    python setup.py


    ### 1.3 Creating Your App


    When you create a new project, the Cocos console will create a folder structure
    like the one seen in Figure 1-1.


    #### 1.3.1 Folder Structure


    - src: folder where you have all JavaScript files for your game

    - res: folder where you have all images and other resources referenced in your
    game

    - frameworks: folder where you have the Cocos2d-js engine, support files for native

    - project.json: this file has meta information about your Cocos2d-js project

    - mainfest.webapp: which has configuration related to the Web

