    # 7.9 Joints


    Joints are nothing but joining two physics bodies with anchor points or relating
    them with some physical behaviors. In the real world, things we encounter-from
    your phone to your car-are a collection of different pieces of objects joined
    together with joints and nails. The same is true for chipmunk bodies. There are
    different types of joints available in Chipmunk, as follows:


    +   - Pin Joint

    - Slide Joint

    - Pivot Joint

    - Groove Joint

    - Damped Spring

    - Damped Rotary Spring


