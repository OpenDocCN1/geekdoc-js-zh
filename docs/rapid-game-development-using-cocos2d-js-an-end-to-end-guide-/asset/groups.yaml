- md: "\n## 8.5 Accessing Local Storage\n\nLocal storage is nothing but the persistent\
    \ storage facility offered by the platform (Web/Android/iOS) and is where you\
    \ can store the key/value pair and retrieve it from later. Cocosd-js offers an\
    \ API to access the platform's local storage. You can use this API to store stuff\
    \ like game state, user's high score, etc.\n\n- 1 cc.sys.localStorage\n\nThe preceding\
    \ object provides access to the local storage. There are two methods to get/set\
    \ the values:\n\n```javascript\n//set value to the localstorage\nlocalStorage.setItem(<key>,<value>);\n\
    // get value from the localstorage\nvar value = localStorage.getItem(<key>);\n\
    ```\n\n# CHAPTER 8 ■ MISCELLANEOUS FEATURES\n\nThe setItem method provides a way\
    \ to set the value to the local storage using a key as reference. The key is a\
    \ string, and the value could be a primitive value or a JavaScript object.\n\n\
    Let's have a look at a simple example. Create a new layer, as in previous examples,\
    \ add a label to the layer:\n\n```javascript\n1 var size = cc.winSize;\n2 this.label\
    \ = new cc.LabelTTF('', '', 32);\n3 this.label.attr({\n4   x: size.width / 2,\n\
    5   y: size.height / 2\n6 });\n7 this.addChild(this.label);\n```\n\nThen, store\
    \ a string value to local storage and retrieve it var localstorage=cc.sys.localStorage:\n\
    \n```javascript\n1 //Store a key/value in localstorage\n2 localStorage.setItem('key1',\
    \ 'Text from localstorage');\n3\n4 //Retrieve value using key\n5 var text=localStorage.getItem('key1');\n\
    ```\n\nThe complete code should look like the following:\n\n```javascript\n1 var\
    \ LocalStorageLayer = BaseSampleLayer.extend({\n2 sprite:null,\n3 ctor:function\
    \ () {\n4\n5 this.super();\n6\n7 var size = cc.winSize;\n8\n9 this.label = new\
    \ cc.LabelTTF('', '', 32);\n10 this.label.attr({\n11   x: size.width / 2,\n12\
    \   y: size.height / 2\n13 });\n14 this.addChild(this.label);\n15\n16 var localstorage=cc.sys.localStorage;\n\
    17\n18 //Store a key/value in local storage\n19 localStorage.setItem('key1', 'Text\
    \ from localstorage');\n20\nvar text=localStorage.getItem('key1');\n//Retrive\
    \ value using key in localStorage\nthis.Label.setString(text);\nreturn true;\n\
    }));\n```\n\nYou will see the output shown in Figure 8-3.\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_126_0.png)\n\
    \nFigure 8-3. Local storage\n\n## 8.6 Schedule an Interval Callback\n\nIn Chapter\
    \ 6, \"Fun with Animation,\" we read about scheduler and updates, where every\
    \ cc.Node can subscribe to update notification, which is the run loop. Similarly,\
    \ we can create a function to be called at a given interval of time. There is\
    \ a function schedule in cc.Node that does the job for us:\n\n```javascript\n\
    this.schedule(<callback>, <time>);\n```\n\nLet's have a look at an example. First,\
    \ create an empty layer and add a label to it:\n\n```javascript\nvar size = cc.winSize;\n\
    this.Label = new cc.LabelTTF('', '', 32);\nthis.Label.attr({\n  x: size.width\
    \ / 2,\n  y: size.height / 2\n});\nthis.addChild(this.Label);\n```\n\nThen, a\
    \ callback in the layer object and update the Label with text:\n\n```javascript\n\
    onUpdate:function(){\n  this.Label.setString((this.timer++)+' sec');\n}\n```\n\
    \nThen, have a variable timer initialized in c and use the schedule function to\
    \ begin the callback with an interval of 1 second:\n\n```javascript\nthis.timer=0;\n\
    this.schedule(this.onUpdate, 1);\n```\n\nNow the whole code should look like the\
    \ following:\n\n```javascript\nvar SchedulerLayer = BaseSampleLayer.extend({\n\
    sprite:null,\nctor:function () {\n  this.super();\n  var size = cc.winSize;\n\
    \  this.Label = new cc.LabelTTF('', '', 32);\n  this.Label.attr({\n    x: size.width\
    \ / 2,\n    y: size.height / 2\n  });\nthis.addChild(this.Label);\nthis.timer=0;\n\
    this.schedule(this.onUpdate,1);\nreturn true;\n},\nonUpdate:function(){\n  this.Label.setString((this.timer++)+'\
    \ sec');\n});\n```\n\nYou will see the output shown in Figure 8-4.\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_128_0.png)\n\
    \nFigure 8-4. Schedule a function\n\n## 8.7 Accessing Current Language\n\nCocosd-js\
    \ also provides a way to access the language. There is a property in cc.sys where\
    \ let's see a quick example. As in previous examples, add a label to an empty\
    \ layer:\n\n- 1 cc.sys.localStorage\n\nMost of the memory will be consumed by\
    \ textures, so you have to pay close attention to the size of the. Here is the\
    \ full code:\n\n```javascript\nvar LocalStorageLayer = BaseSampleLayer.extend({\n\
    sprite:null,\nctor:function () {\nthis.super();\nvar size = cc.winSize;\nthis.label\
    \ = new cc.LabelTTF('', '', 32);\nthis.label.attr({\n  x: size.width / 2,\n  y:\
    \ size.height / 2\n});\nthis.addChild(this.label);\nvar localstorage=cc.sys.localStorage;\n\
    //Store a key/value in local storage\nlocalStorage.setItem('key1', 'Text from\
    \ localstorage');\nvar text=localStorage.getItem('key1');\n//Retrive value using\
    \ key in localStorage\nthis.Label.setString(text);\nreturn true;\n}));\n```\n\n\
    ## 8.8 Accessing System Capabilities\n\nCocosd-js can be deployed to native platforms,\
    \ which may have different capabilities. For example, if you want to detect if\
    \ the system supports touch, you can simply query this object:\n\n- 1 cc.sys.capabilities\n\
    \nIf you console this browser, you will get an object like the following:\n\n\
    ```javascript\n{\n  accelerometer: true,\n  canvas: true,\n  keyboard: true,\n\
    \  mouse: true,\n  opengl: true\n}\n```\n\n## 8.9 Optimization\n\nOptimization\
    \ is a very crucial part of any game, however, this is not the last process as\
    \ you have to plan ahead. There are certain tips and tricks that have been found\
    \ to be best practices.\n\n### 8.9.1 Memory Optimization\n\n- Most of the memory\
    \ in your game will be consumed by textures, so you have to pay close attention\
    \ to the size of the textures you are loading.\n- Try to combine all the textures\
    \ in your game into a sprite sheet or a texture atlas, this will save lot of memory.\n\
    - Also, it is good practice to always use NPOT instead of POT.\n\n### 8.9.2 Performance\
    \ Optimization\n\n- When it comes to performance or the draw call's frame rate,\
    \ delta time plays an important role.\n- Make sure you avoid using a lot of draw\
    \ calls. Use a single texture for all the sprites in your game, as this will enable\
    \ sprite batching.\n- Also, make sure you use SpriteBatchNode to combine all the\
    \ needed sprites to be rendered in a single draw call if your platform doesn't\
    \ support auto batching.\n- If you write custom shaders, make sure your vertex\
    \ and fragment shaders don't have any intensive operations.\n- Having a complex\
    \ computation in a shader will throttle the performance of the GPU, especially\
    \ in fragment functions, since a fragment function will be executed for every\
    \ pixel in your screen.\n- Try to use 16-bit textures with RGBA4444 color depth.\n\
    \n### 8.9.3 JavaScript Level\n\n- Make sure you have memory leak-free code.\n\
    - When you reference inner nodes maintained in outer nodes, make sure you clear\
    \ the values when they are not needed.\n- Use only documented APIs, as the usage\
    \ and tweaking of internal variables and functions will lead to inconsistent behavior,\
    \ as undocumented APIs are subject to changes in the upcoming versions.\n\n##\
    \ 8.10 Conclusion\n\nSo far, we have seen the features of Cocosd-js from scratch.\
    \ I hope this will give you a head start on your game development. Cocos2d-x is\
    \ big world, and a single book is not enough to explain all of its features in\
    \ detail. We covered almost all of the features and advanced techniques as much\
    \ as possible. It's time for you to create your own awesome game.\n"
  mdcn: "\n\n## 8.5 访问本地存储\n\n本地存储（Local storage）只是平台（Web/Android/iOS）提供的持久化存储设施，你可以在其中存储键/值对并在以后检索它们。Cocosd-js\
    \ 提供了一个用于访问平台本地存储的 API。你可以使用此 API 存储游戏状态、用户高分等内容。\n\n- 1 cc.sys.localStorage\n\
    \n上述对象提供了对本地存储的访问权限。有两种方法可以获取/设置值：\n\n```javascript\n//将值设置到本地存储中\nlocalStorage.setItem(<key>,<value>);\n\
    //从本地存储中获取值\nvar value = localStorage.getItem(<key>);\n```\n\n# 第 8 章 ■ 杂项功能\n\
    \nsetItem 方法提供了一种通过键引用为本地存储设置值的方法。键是一个字符串，而值可以是原始值，也可以是 JavaScript 对象。\n\n让我们来看一个简单的示例。像之前的示例一样，创建一个新层，并在层上添加一个标签：\n\
    \n```javascript\n1 var size = cc.winSize;\n2 this.label = new cc.LabelTTF('',\
    \ '', 32);\n3 this.label.attr({\n4   x: size.width / 2,\n5   y: size.height /\
    \ 2\n6 });\n7 this.addChild(this.label);\n```\n\n然后，将字符串值存储到本地存储并检索它，var localstorage=cc.sys.localStorage:\n\
    \n```javascript\n1 //在本地存储中存储一个键/值\n2 localStorage.setItem('key1', 'Text from\
    \ localstorage');\n3\n4 // 使用键检索值\n5 var text=localStorage.getItem('key1');\n\
    ```\n\n完整的代码应该如下：\n\n```javascript\n1 var LocalStorageLayer = BaseSampleLayer.extend({\n\
    2 sprite:null,\n3 ctor:function () {\n4\n5 this.super();\n6\n7 var size = cc.winSize;\n\
    8\n9 this.label = new cc.LabelTTF('', '', 32);\n10 this.label.attr({\n11   x:\
    \ size.width / 2,\n12   y: size.height / 2\n13 });\n14 this.addChild(this.label);\n\
    15\n16 var localstorage=cc.sys.localStorage;\n17\n18 //在本地存储中存储一个键/值\n19 localStorage.setItem('key1',\
    \ 'Text from localstorage');\n20\nvar text=localStorage.getItem('key1');\n//使用本地存储中的键检索值\n\
    this.Label.setString(text);\nreturn true;\n}));\n```\n\n你将看到图 8-3 所示的输出。\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_126_0.png)\n\
    \n图 8-3. 本地存储\n\n## 8.6 调度间隔回调\n\n在第 6 章“动画乐趣”中，我们学习了调度器（scheduler）和更新（updates），每个\
    \ cc.Node 都可以订阅更新通知，即运行循环。同样，我们可以创建一个在给定时间间隔被调用的函数。cc.Node 中有一个函数 schedule 可以为我们完成这项工作：\n\
    \n```javascript\nthis.schedule(<callback>, <time>);\n```\n\n让我们来看一个示例。首先，创建一个空层并在上面添加一个标签：\n\
    \n```javascript\nvar size = cc.winSize;\nthis.Label = new cc.LabelTTF('', '',\
    \ 32);\nthis.Label.attr({\n  x: size.width / 2,\n  y: size.height / 2\n});\nthis.addChild(this.Label);\n\
    ```\n\n然后，在层对象中编写回调并用文本更新 Label：\n\n```javascript\nonUpdate:function(){\n  this.Label.setString((this.timer++)+'\
    \ sec');\n}\n```\n\n然后，在 c 中初始化变量 timer，并使用 schedule 函数以 1 秒的间隔开始回调：\n\n```javascript\n\
    this.timer=0;\nthis.schedule(this.onUpdate, 1);\n```\n\n现在，整个代码代码应该如下：\n\n```javascript\n\
    var SchedulerLayer = BaseSampleLayer.extend({\nsprite:null,\nctor:function ()\
    \ {\n  this.super();\n  var size = cc.winSize;\n  this.Label = new cc.LabelTTF('',\
    \ '', 32);\n  this.Label.attr({\n    x: size.width / 2,\n    y: size.height /\
    \ 2\n  });\nthis.addChild(this.Label);\nthis.timer=0;\nthis.schedule(this.onUpdate,1);\n\
    return true;\n},\nonUpdate:function(){\n  this.Label.setString((this.timer++)+'\
    \ sec');\n});\n```\n\n你将看到图 8-4 所示的输出。\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_128_0.png)\n\
    \n图 8-4. 调度函数\n\n## 8.7 访问当前语言\n\nCocosd-js 还提供了访问语言的方法。在 cc.sys 中有一个属性，让我们来看一个快速示例。像之前的示例一样，在空层上添加一个标签：\n\
    \n- 1 cc.sys.localStorage\n\n大部分内存将被纹理消耗，因此你必须密切关注大小。这是完整的代码：\n\n```javascript\n\
    var LocalStorageLayer = BaseSampleLayer.extend({\nsprite:null,\nctor:function\
    \ () {\nthis.super();\nvar size = cc.winSize;\nthis.label = new cc.LabelTTF('',\
    \ '', 32);\nthis.label.attr({\nx: size.width / 2,\ny: size.height / 2\n});\nthis.addChild(this.label);\n\
    var localstorage=cc.sys.localStorage;\n//在本地存储中存储一个键/值\nlocalStorage.setItem('key1',\
    \ 'Text from localstorage');\nvar text=localStorage.getItem('key1');\n//使用本地存储中的键检索值\n\
    this.Label.setString(text);\nreturn true;\n}));\n```\n\n## 8.8 访问系统能力\n\nCocosd-js\
    \ 也可以部署到原生平台，这些平台可能有不同的能力。例如，如果你想检测系统是否支持触摸，可以查询此对象：\n\n- 1 cc.sys.capabilities\n\
    \n如果你控制浏览器，将得到一个如下的对象：\n\n```javascript\n{\n  accelerometer: true,\n  canvas:\
    \ true,\n  keyboard: true,\n  mouse: true,\n  opengl: true\n}\n```\n\n## 8.9 优化\n\
    \n优化是任何游戏至关重要的部分，然而这不是最后一个过程，因为你需要提前计划。有一些被证明是最佳实践的技巧。\n\n### 8.9.1 内存优化\n\n大部分内存将被纹理消耗，因此你必须密切关注你加载的纹理的大小。\n\
    - 尝试将游戏中的纹理合并到精灵集或贴图中，这将节省大量内存。\n- 此外，始终使用 NPOT（非幂尺寸尺寸）是一个良好的习惯。\n\n### 8.9.2\
    \ 性能优化\n\n涉及到性能或绘制调用帧率时，帧时间（delta time）起着重要作用。\n- 确保避免使用大量的绘制调用。游戏中的所有精灵使用单个纹理，这将启用批处理。\n\
    - 此外，如果你的平台不支持自动批处理，请确保使用 SpriteBatchNode 合所有需要在单个绘制调用中渲染的精灵。\n- 如果你编写自定义着色器，确保你的顶点着色和片元着色器没有密集操作。\n\
    - 在着色器中有复杂的计算会限制 GPU 的性能，特别是片元函数，因为片元函数会在屏幕每个像素上执行一次。\n- 尝试使用 RGBA4444 色深的 16\
    \ 位纹理。\n\n### 8.9.3 JavaScript 级别\n\n- 确保你的代码没有内存泄漏。\n- 当你在外部节点中引用内部节点时，确保在不需要时清除这些值。\n\
    - 仅使用文档化的 API，因为对内部变量和函数的用法和调整会导致不一致的行为，因为未定义的 API 在后续版本中可能会发生变化。\n\n## 8.10 总结\n\
    \n到为止，我们从零开始了 Cocosd-js 的功能。希望这能为你的游戏开发提供开头。Cocos2d-x 是一个巨大的世界，单本书不足以详细解释它的所有功能。我们已经尽可能涵盖了几乎所有的功能和高级技术。是时候让你创建\
    \ way酷酷的游戏了。\n\n"
