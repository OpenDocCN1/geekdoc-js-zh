    # CHAPTER 5


    # Adding a GUI


    # 5.1 Introduction


    A GUI is another essential part of any game. It shows the HUD display, score,
    any required text, and buttons such as play and pause. Cocos2d-js has pre-defined
    node types to represent GUI elements. Let''s look at them one by one.


    # 5.2 Labels


    If you want to display any text in your game, then Label objects can be used.
    There are two types of label offered by Cocos2d-js.


    # 5.2.1 Label with True Type Font


    You can define a label such that it uses custom type fonts. Usually, these fonts
    have a .ttf file format. In Cocos2d-js, the cc.LabelTTF class can be used to create
    such a label. Let''s have a look at the syntax:


    +   var Label= new cc.LabelTTF(text, fontName, fontSize, dimensions, alignment,
    vAl)

    * [string] text - represents the text you want to display

    * [string] fontName - represents the loaded .ttf font name

    * [Number] fontSize - represents font size

    * [cc.Size] dimensions - label width and height; if not set, this is calculated
    automatically

    HAlignment - represents horizontal alignment of text outside the label; it can
    be one of the following values: {cc.TEXT_ALIGNMENT_LEFT | cc.TEXT_ALIGNMENT_CENTER
    | cc.TEXT_ALIGNMENT_RIGHT}'
