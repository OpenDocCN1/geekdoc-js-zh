- md: "\n## 7.9.10 Ratchet Joint\n\nThe ratchet joint works like a socket wrench,\
    \ where you have the body rotating in angular steps provided the initial angular\
    \ offset, and phase is an angular step, which is the distance between the current\
    \ and the next rotation steps.\n\nLet's look at the syntax:\n\n```\nvar ratchet\
    \ = new cp.ratchetJoint(body1, body2, offset, phase);\n```\n\nThe parameters are\
    \ as follows:\n\n- offset - refers to the initial angular rotation of bodies\n\
    - phase - refers to the distance between steps\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_117_0.png)\n\
    \n# CHAPTER 8\n\n# Miscellaneous Features\n\n## 8.1 Drawing Primitive Shapes\n\
    \nTo draw primitive shapes, cc.Node is used. This node type has functions like\
    \ drawCircle, drawPoly, drawRect, drawSegment. Let's look at an example:\n\n```\n\
    1 this.draw=new cc.DrawNode();\n2 this.addChild(this.draw);\n3\n4 //drawCircle\n\
    5 this.draw.drawCircle(cc.p(cc.winSize.width / 2, cc.winSize.height / 2),\n100,\n\
    6 0, 10, false, 6, cc.color(0, 255, 255);\n7 this.draw.drawCircle(cc.p(cc.winSize.width\
    \ / 2, cc.winSize.height / 2),\n50,\n8 cc.degreesToRadians(90), 50, true, cc.color(0,\
    \ 255, 255));\n```\n\nHere, two circles are drawn on the same DrawNode. You can\
    \ draw any number of shapes on the same node. If you want to clear the shapes,\
    \ use the clear function:\n\n- 1 this.draw.clear();\n\nDrawing a path is possible\
    \ using the drawCardinalSpline method:\n\n- 1 this.draw.drawCardinalSpline(pointsArray,1,1,10,cc.color(255,255,255));\n\
    \nThe first parameter is an array of points that define the path data. The second,\
    \ third, and fourth parameters are tension, segment and line width, and color,\
    \ respectively.\nHere is the full code:\n\n```\n1 var DrawNodeDemoLayer = BaseLayer.extend({\n\
    2 sprite:null,\n3 ctor:function () {\n4\n5 this.__super(););\n```\n\n# CHAPTER\
    \ 8 MISCELLANEOUS FEATURES\n\n```\n6\n7   var size = cc.winSize;\n8\n9   this.draw=new\
    \ cc.DrawNode();\n10  this.addChild(this.draw);\n11\n12  //drawCircle\n13  this.draw.drawCircle(cc.p(size.width\
    \ / 2, size.height / 2), 100,\n14  0, \n15  10, false, 6, cc.color(0, 255, 0,\
    \ 255));\n16  this.draw.drawCircle(cc.p(size.width / 2, size.height / 2), 50,\n\
    17  cc.d\n18  agreesToRadians(90), 50, true, 2, cc.color(0, 255, 255, 255));\n\
    19\n20  return true;\n21  }\n22  \\);\n```\n\nThe output will look like Figure\
    \ 8-1.\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_119_0.png)\n\n**Figure 8-1.**\
    \ DrawNode demo\n\n## 8.2 Adding Music and Sound Effects\n\nIn Cocos2d-js, music\
    \ and sound effects can be added to the game by using the singleton object cc.audioEngine.\
    \ Music represents the long-running background sound in your game, and sound effects\
    \ represent quick sounds like the player jumping, collecting coins, etc. You have\
    \ to be careful with which sound format you use, as browsers won't support certain\
    \ formats. The first thing you have to do during game startup is to pre-load your\
    \ sound files during the onStart method of your app, js:\n\n```\n1 cc.audioEngine.preloadMusic(s_music_background);\n\
    2 cc.audioEngine.preloadEffect(s_music_jump);\n```\n\nThen, you can play your\
    \ music and sound effects as follows:\n\n```\n1 cc.audioEngine.playMusic(s_music_background,\
    \ true);\n2 cc.audioEngine.playEffect(s_music_jump, true);\n```\n\nThe second\
    \ parameter represents whether to loop the sound or not. You can pause, resume,\
    \ and stop your music and effects as follows:\n\n```\n1 //Pause Sound\n2 cc.audioEngine.pauseMusic();\n\
    3 cc.audioEngine.pauseEffect();\n4\n5 //Resume Sound\n6 cc.audioEngine.resumeMusic();\n\
    7 cc.audioEngine.resumeEffect();\n8\n9 //Rewind Music\n10 cc.audioEngine.rewindMusic();\n\
    11\n12 //Stop Sound\n13 cc.audioEngine.stopMusic();\n14 cc.audioEngine.stopEffect();\n\
    ```\n\nFor effects, there is no option to rewind, as the constructs for playing\
    \ music and effects are separate so as to make the system efficient.\n\n## 8.3\
    \ Using Custom Shaders\n\nShaders are responsible for rendering your whole game.\
    \ Everything we do to run the game finally passes through these shaders and is\
    \ processed for rendering. Shaders are classified into vertex and fragment shaders.\
    \ Vertex shaders process the vertex data of your node and pass the output to fragment\
    \ shaders, which process the pixel color for the interpolated vertex data. Cocos2d-x\
    \ uses shaders to do the rendering. GL shaders are\n\n# CHAPTER 8 MISCELLANEOUS\
    \ FEATURES\n\na much bigger concept, and discussing them in detail is out of scope\
    \ of this book. Custom shaders are used to create cool effects in your game. We\
    \ will see how to use custom vertex and fragment shaders on your sprite.\n\nIn\
    \ Cocos2d-js, the cc.GLProgram class represents the shader entity for a particular\
    \ node. Every node has setShaderProgram and getShaderProgram functions to get/set\
    \ with this object.\n\nLet's consider sample vertex and fragment shaders:\n\n\
    ```\n//gray.vsh\nattribute vec4 a_position;\nattribute vec2 a_texcoord;\nattribute\
    \ vec4 a_color;\n\nvarying vec2 v_texcoord;\nvarying vec4 v_color;\n\nvoid main()\
    \ {\n    gl_Position = CC_MVPMatrixMatrix * a_position;\n    v_texcoord = a_texcoord;\n\
    \    v_color = a_color;\n}\n```\n\n```\n//gray.fsh\nvarying vec2 v_texcoord;\n\
    varying vec4 v_color;\nuniform sampler2D CC_texture;\n\nvoid main() {\n    gl_FragColor\
    \ = texture2D(CC_texture, v_texcoord) * v_color;\n}\n```\n\n## 8.4 Motion Trail\n\
    \nIn Cocos2d-js, a trail effect can be achieved through a class called MotionStreak.\
    \ Trail effect is when an object moves and leaves traces behind it. Let's look\
    \ at an example. First, create an empty layer and add a sprite to it:\n\n```\n\
    var MotionTrailLayer = BaseLayer.extend({\n  sprite:null,\n  ctor:function ()\
    \ {\n    this._super();\n\n    var size = cc.winSize;\n\n    this.sprite = new\
    \ cc.Sprite(res.Sprite_Image);\n    this.sprite.attr(\n      x: size.width / 2,\n\
    \      y: 0\n    });\n    this.addChild(this.sprite, 2);\n\n    var action1 =\
    \ cc.moveTo(5, cc.p(size.width / 2, size.height));\n    var action2 = action1.reverse();\n\
    \    var seq1 = new cc.Sequence(action1,action2);\n    this.sprite.runAction(seq1.repeatForever());\n\
    \n    this.tail = new cc.MotionStreak(2, 3, 50, cc.color.WHITE, res.\nTail);\n\
    \    this.tail.attr(\n      x: size.width / 2,\n      y: 0\n    );\n    this.addChild(this.tail);\n\
    \n    var seq2 = seq1.clone();\n    this.tail.runAction(seq2.repeatForever());\n\
    \n    return true;\n  }\n});\n```\n\nAnd you will get the output seen in Figure\
    \ 8-2.\n"
  mdcn: "\n\n## 7.9.10 棘轮关节 (Ratchet Joint)\n\n棘轮关节的作用类似于套筒扳手，在提供初始角度偏移的情况下，体会以角度步长旋转，相位（phase）是一个角度步，即当前旋转步骤与下一个旋转步骤之间的距离。\n\
    \n让我们查看语法：\n\n```\nvar ratchet = new cp.ratchetJoint(body1, body2, offset, phase);\n\
    ```\n\n参数如下：\n\n- offset - 指物体的初始角度旋转\n- phase - 指步骤之间的距离\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_117_0.png)\n\
    \n# 第 8 章\n\n# 其他特性\n\n## 8.1 绘制基础形状\n\n要绘制基础形状，可以使用 `cc.Node`。该节点类型拥有 `drawCircle`、`drawPoly`、`drawRect`、`drawSegment`\
    \ 等函数。让我们来看一个示例：\n\n```\n1 this.draw=new cc.DrawNode();\n2 this.addChild(this.draw);\n\
    3\n4 //drawCircle\n5 this.draw.drawCircle(cc.p(cc.winSize.width / 2, cc.winSize.height\
