    # # 8.9 Optimization


    Optimization is a very crucial part of any kind of game. This is not the last
    process in your game development, however, as you have to plan ahead before your
    coding process. There are certain tips and tricks that have been found to be best
    practices.


    # ##8.9.1 Memory Optimization


    +   - Most of the memory in your game will be consumed by textures, so you have
    to pay close attention to the size of the textures you are loading. Have a best
    practice of loading textures only when needed.

    - Try to combine all the textures in your game into a sprite sheet or a texture
    atlas, this will save you lot of memory.

    - Also, it is good practice to always use NPOT textures instead of POT.


    # ##8.9.2 Performance Optimization


    +   - When it comes to performance or the draw call''s frame rate, delta time
    plays an important role.

    - Make sure you avoid using a lot of draw calls. Use a single texture for all
    the sprites in your game, as this will enable sprite batching.

    - Also, make sure you use SpriteBatchNode to combine all the needed sprites to
    be rendered in a single draw call if your platform doesn''t support auto batching.

    - If you write custom shaders, make sure your vertex and fragment shaders don''t
    have any intensive operations.

    - Having a complex computation in a shader will throttle the performance of the
    GPU, especially in fragment functions, since a fragment function will be executed
    for every pixel in your screen.

    - Try to use 16-bit textures with RGBA4444 color depth.


    122'
