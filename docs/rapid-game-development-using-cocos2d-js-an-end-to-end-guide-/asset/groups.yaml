    # 关于作者


    Hemanth Kumar 和 Abdul Rahman 是一支全栈 JavaScript 专家、研究人员和移动游戏开发者组成的团队，他们在 Web 开发和游戏开发方面拥有丰富的经验。他们精通
    Cocos2d-x、Unity-3-D 以及为游戏构建人工智能。他们也是为高流量网站构建可扩展架构的专家。他们的主要热情在于视频游戏开发。


    他们非常擅长为游戏编写复杂的着色器，已经在 Android 和 iOS 上发布了 Blocky Pass、Little ninja town、Jumbo Jumpie
    等移动游戏；他们还编写了多个 Unity 插件；他们精通 Android 和 iOS 原生应用开发，并构建了多款现在被全球数百万用户使用的成功应用，如 Android
    上的 learn arabic basics 和 iOS 上的 GXP（目标追踪器）；他们还是 OpenGL、WebGL、iOS Metal 以及安卓平台上的
    Vulcan 专家。


    Hemanth 目前在一家公司担任开发者，他在空闲时间开发游戏，他的爱好是听音乐、弹吉他和和看电影。


    Abdul 目前是自由职业者，正在开发他的梦想应用 GXP（iOS 目标追踪器），他的爱好是看电影和欺负朋友。


    # 关于技术审查员


    Nakul Verma 是一位专业游戏开发者，目前在 Aquimo Sports Pvt Ltd 担任高级 Unity 开发者。如果论及行业，他在该领域已有两年左右；但如果论及热情和倾向，他已经在领域活跃了十年。在这两年左右的时间里，他使用多种技术处理过各种类型的游戏。他开发过几款休闲益智游戏、一个无尽跑类游戏、一个无尽休闲游戏、几款卡牌游戏（Cocos2d-JS
    中的 Rummy 和一种非洲游戏）以及一个物理模拟示例，目前正在独立开发自己的游戏，并将很快上线商店。他精通的游戏技术包括 Unity、Cocos 2D-X/JS、Construct
    和 Allegro。游戏一直是他喜欢的爱好之一，还有运动、音乐、霹舞等。技术、小设备、机器和软件一直让他着迷。他总是渴望学习更多他喜欢的事物，无论是在现实世界还是虚拟世界，并最终掌握。他最喜欢的游戏类型是第一人称射击游戏、平台跳跃和益智游戏。当不在制作或玩游戏时，他要么在健身，要么在跳舞，要么在摆弄周围的一些小设备。


