    ## 3.10 Resolution Policies


    Resolution policies are about adapting your game to different screen resolutions
    and profiles. Cocos2d-js offers sets of resolution policies with which to adapt
    your games. Without these, you have to manually scale up or down the content of
    your game based on the screen resolution.


    There are two types of resolution policies: pre-defined policies and custom policies.
    Pre-defined policies are offered by Cocos2d-js and are composed of various combinations
    of container and content strategies; they are supported in native deployments
    as well. With custom policies, you can define your own resolution policies with
    the combination of available containers and content strategies, but custom policies
    are supported only in Web deployments. Let''s have a look.


    ### 3.10.1 Terminology


    You need to be aware of certain terms in order to fully understand resolution
    policies. You may already already know that your game is hosted in canvas in your
    web-based Cocos2d-js game. See Figure 3-13.


    ![](img/c9248a93bcc9d1d0881a7269e1be3174_44_0.png)


    Figure 3-13. Terminology used in resolution policies


    ### 3.10.1.1 Frame


    This represents the container outer to the canvas, usually a body element if you
    use the default index.html generated by the Cocos console.


    ### 3.10.1.2 Container


    Cocos2d-js wraps your canvas in a div element, and that wrapped content is then
    again added to the original container element of canvas.


    ### 3.10.1.3 Content


    Everything inside the canvas which is not part of DOM.


    ### 3.10.1.4 Viewport


    Viewport represents the world rect of canvas; it is canvas coordinates in pixels.


    ### 3.10.1.5 Letter Boxing


    When the width of the container matches the frame but the height does not, you
    get letter boxing (Figure 3-14). It will occur if the w/h ratio does not match
    with the frame, and is also based on the resolution policy you use.


    ![](img/c9248a93bcc9d1d0881a7269e1be3174_45_0.png)


    Figure 3-14. Letter boxing


    ### 3.10.1.6 Pillar Boxing


    When height of the container matches the frame but the width does not, you get
    pillar boxing (see Figure 3-15). The reason for this occurrence is the same as
    for letter boxing.


    ![](img/c9248a93bcc9d1d0881a7269e1be3174_46_0.png)


    ## 3.10.2 Pre-defined Resolution Policies


    There are five predefined policies offered by Cocos2d-js, which we will now discuss.


    ### 3.10.2.1 SHOW_ALL


    This will scale up the container to the maximum size within the container bounds;
    all the contents in current scene will be visible.


    ### 3.10.2.2 NO_BORDER


    This will scale up the container to fill the frame so that there won''t be any
    visible area in frame maintaining the proportion of provided width and height.


    ### 3.10.2.3 EXACT_FIT


    This will scale the container to fit into the frame. Note that the provided width
    and height ratio won''t be maintained.


    ### 3.10.2.4 FIXED_WIDTH


    This will scale the width of the container to match the width of the frame and
    scale the height to match the w/h ratio. You may see letter boxing, if w/h ratio
    won''t match.


    ### 3.10.2.5 FIXED_HEIGHT


    This will scale the height of the container to match the frame''s height and scale
    the width to match the w/h ratio. You may use pillar boxing, if w/h ratio won''t
    match.


    ## 3.10.3 How to Use


    In the file main.js, there is a cc.game.onStart callback. You have to use the
    following line of code to set the resolution profile:


    ```

    cc.view.setDesignResolutionSize(320, 480, cc.RESOLUTION_POLICY.SHOW_ALL);

    ```


    The first two parameters are width and height, which is the aspect ratio of your
    game, and the third is the resolution policy.


    ## 3.10.4 Custom Resolution Policies


    As we seen before, pre-defined policies are a combination of container and content
    strategy. For example, the SHOW_ALL policy is a combination of PROPORTION_TO_FRAME
    and SHOW_ALL, as follows:


    ```

    cc.RESOLUTION_POLICY.SHOW_ALL = new cc.ResolutionPolicy

    (cc.ContainerStrategy.PROPORTION_TO_FRAME, cc.ContainerStrategy.SHOW_ALL);

    ```


    This is the internal implementation of SHOW_ALL. You can define your own policies
    with a combination of pre-defined container and content strategies.

    '
