  - "[PAGE 34]\n\n# CHAPTER 3 A DEEPER LOOK AT SPRITES\n\nThe idea behind the frame\
    \ animation is that we are going to run through each frame in a specific interval\
    \ so that it will look like an animation sequence. In the preceding code, walk01\
    \ to walk11 represent frames with rects in the sprite sheet. If we put these frames\
    \ together and run through it, it will look like a walking animation.\n\nA SpriteFrame\
    \ instance is created with this frame rect array (see Figure 3-6):\n\n```\nvar\
    \ texture = cc.textureCache.addImage(res.SpriteSheet);\nvar animFrames=[];\nfor(var\
    \ index in frameDatas) {\n  var spriteFrame = new cc.SpriteFrame(texture, frameDatas[index]);\n\
    \  var animFrame = new cc.AnimationFrame();\n  animFrame.initWithSpriteFrame(spriteFrame,\
    \ 1, null);\n  animFrames.push(animFrame);\n}\n```\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_34_0.png)\n\
    \n**Figure 3-6.** SpriteFrame\n\nIn this example, we are manually creating the\
    \ cc.SpriteFrame instance, so it is going to need a texture instance of the sprite\
    \ sheet. Thus, we added the sprite sheet to the texture cache, which returns the\
    \ texture instance, which can be used to create all of the sprite frames.\n\n\
    Finally, the cc.Animation instance, which is used to perform the animation, is\
    \ created using the list of images from cc.AnimationFrame with a time interval\
    \ of 0.08 seconds.\n\nThe output will be a nice walk animation.\n\nIn the preceding\
    \ case, frame data has been formed manually, but in reality the sprite sheet will\
    \ be created from an individual image with the help of tools like TexturePack,\
    \ and associated data files will be created. In the case of Cocos2d, it is a PList\
    \ file that has all of the frame data related to the sprite sheet. In the next\
    \ example, will see how to create the frame animation using PList."
