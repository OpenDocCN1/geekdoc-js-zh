- md: "\n## 7.4 Chipmunk Body\n\nA physical object is defined by a body; the body\
    \ has a shape and the sprite's data associated with it. Let's add a circle and\
    \ box to create the created Chipmunk space:\n\n```javascript\naddPhysicsCircle:\
    \ function() {\n  var width=50,height=50,mass=1;\n  this.phBodyCircle = this.space.addBody(new\
    \ cp.Body(mass,\n    mass=0,width*0.5,cc.p(0,0)));\n  this.phBodyCircle.setPos(cc.p(cc.Size.width\
    \ * 0.5,cc.Size.\n    height * 0.1));\n  //4\n  var phShape = this.space.addShape(new\
    \ cp.CircleShape(this.\n    width,cc.p(0, 0));\n  phShape.setFriction(0);\n  phShape.setElasticity(1);\n\
    \  phShape.setCollisionType(0);\n}\naddPhysicsBox: function() {\n  var width=50,height=50,mass=1;\n\
    \  this.phBodyBox = this.space.addBody(new cp.Body(mass,\n    cp.momentForBox(mass,\
    \ \\\n    width,height));\n  this.phBodyBox.setPos(cc.p(cc.Size.width * 0.5,cc.Size.\n\
    \    height * 0.1));\n  //4\n  var phShape = this.space.addShape(new cp.BoxShape(this.phBodyBox,\n\
    \    width,height));\n  phShape.setFriction(0);\n  phShape.setElasticity(1);\n\
    \  phShape.setCollisionType(1);\n}\n```\n\nAs you can see, the circle and box\
    \ are created using cp.Body with mass and momentum objects, and the shape is defined\
    \ for each using cp.CircleShape and cp.BoxShape. This actually serves an important\
    \ part in physics simulations, and collision-based physical movement is based\
    \ on these shape objects.\n\n## CHAPTER 7 ADDING PHYSICS TO YOUR GAME\n\n## 7.5\
    \ Chipmunk StaticBody\n\nChipmunk space will have a single static body. Usually,\
    \ this staticBody is used to define the physical boundaries and static shapes,\
    \ such as walls.\n\n```javascript\naddwallsAndGround: function() {\n    var leftWall\
    \ = new cp.SegmentShape(this.space.staticBody, new\n    cp.v(0, 100000), WALLS_WIDTH);\n\
    \    leftWall.setElasticity(WALLS_ELASTICITY);\n    leftWall.setFriction(WALLS_FRICTION);\n\
    \    this.space.addStaticShape(leftWall);\n\n    var rightWall = new cp.SegmentShape(this.space.staticBody,\
    \ new\n    cp.v(cc.winSize.width, 0), 100000), WALLS_WIDTH);\n    rightWall.setElasticity(WALLS_ELASTICITY);\n\
    \    rightWall.setFriction(WALLS_FRICTION);\n    this.space.addStaticShape(rightWall);\n\
    \n    var bottomWall = new cp.SegmentShape(this.space.staticBody, new\n    cp.v(cc.winSize.width,\
    \ 0), WALLS_WIDTH);\n    bottomWall.setElasticity(WALLS_ELASTICITY);\n    bottomWall.setFriction(WALLS_FRICTION);\n\
    \    this.space.addStaticShape(bottomWall);\n\n    var upperWall = new cp.SegmentShape(this.space.staticBody,\
    \ new\n    cp.v(cc.winSize.width, cc.winSize.height), WALLS_WIDTH);\n    upperWall.setElasticity(WALLS_ELASTICITY);\n\
    \    upperWall.setFriction(WALLS_FRICTION);\n    this.space.addStaticShape(upperWall);\n\
    }\n```\n\nFor creating boundaries, Chipmunk has a SegmentShape, which is used\
    \ to create top, bottom, left, and right walls that are added to the default static\
    \ body in space so that gravity and other forces will not affect this shape.\n\
    \n## 7.6 Physics Debug Node\n\nA physics body consists of shapes that have polygon\
    \ data. You have to attach a PhysicsSprite to the body in order to see the physics\
    \ body in action; without that, there is an object PhysicsDebugNode that you need\
    \ to add to the layer in order to see the polygons without sprites. In the preceding\
    \ example for box and circle shapes, PhysicsSprite is not attached, so we are\
    \ going to rely on PhysicsDebugNode:\n\n```javascript\nsetupDebugNode : function()\
    \ {\n    this._debugNode = new cc.PhysicsDebugNode(this.space);\n    this.addChild(this._debugNode);\n\
    }\n```\n\nNow the circle and box polygon data will be visible on screen without\
    \ adding PhysicsSprite.\n\n## 7.7 Collision Detection\n\nChipmunk has the ability\
    \ to detect collisions between physical bodies. Every physics body has to be tagged\
    \ with CollisionType so that it will be visible for collision detection:\n\n```javascript\n\
    addCollisionCallback:function() {\n    // 0 and 1 are tag for box and circle\n\
