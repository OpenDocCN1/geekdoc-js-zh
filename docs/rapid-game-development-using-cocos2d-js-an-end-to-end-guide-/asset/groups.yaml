    to be executed simultaneously. Be cautious when you execute multiple actions at
    the same time, as it may produce a weird effect if not used properly.


    # 6.7 Stopping an Action


    Every action can be stopped while it is running. The stopAction function of the
    node is used for this purpose:


    +   - sprite.stopAction(action);


    This stops the action immediately regardless of its state. You can use this for
    user actions or any dynamic triggers that require actions to be stopped immediately.'
