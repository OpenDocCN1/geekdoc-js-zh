    # 6.9 Scheulers and Update


    In Cocos2d-js, there is an update loop, which is a main loop; every cc.Node is
    capable of receiving update notifications, then the node has to subscribe to it.
    This subscribe mechanism is implemented with performance considerations in mind.

    In cc.Node, in the ctor, the following method needs to be called:


    ```

    1 this.scheduleUpdate();

    ```


