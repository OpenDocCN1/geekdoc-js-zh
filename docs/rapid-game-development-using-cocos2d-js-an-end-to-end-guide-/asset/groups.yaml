    # CHAPTER 6


    # # Fun with Animation


    #  6.1 Introduction


    Animation is essential to acquire any good game, as it makes you animate game
    cool and visually appealing, and helps you to acquire more users. A visually appealing
    game markets itself. Take a moment to look at the top-grossing games in Google
    Play and App Store. Top games use crisp and detail-rich animations to improve
    the user experience and to engage users. Take a deep breath, as we are going to
    look at the details of the animation system in Cocos2d-js. Let''s begin.


    #  6.2 Actions


    Actions are the construct that is used in Cocos2d-js to animate a sprite. Actions
    change the properties of the sprite over time, and that makes the sprite animate
    in the way we want. There are several types of actions available with which to
    apply animations on sprites. Let''s have a look at a simple example:


    ```

    1 var action = cc.moveBy(2, cc.p(size.width - 40, size.height - 40));

    2 this.sprite.runAction(action);

    ```


    In this example, the object is created using the cc.moveTo function. Any action
    can be run on sprites using the runAction method. This method usually belongs
    to cc.Node, beyond sprites, we can animate any objects that have cc.Node as a
    parent or topmost parent (i.e., layers, scenes, etc.) Basically, there are two
    variations in creating actions.


    #  6.2.1 By and To Actions


    The preceding code is an example of the By variation. Let''s have a look at the
    same example with the To:


    ```

    1 var action = cc.moveTo(2, cc.p(size.width - 40, size.height - 40));

    2 this.sprite.runAction(action);

    ```'
  - '[PAGE 69]


    # CHAPTER 6 ■ FUN WITH ANIMATION


    The only difference between By and To actions is that To will animate the target
    property value to the absolute value, and By will animate the target property
    value to the relative value (Example: If you have a sprite at location (10,10)
    and you use the moveBy action to animate with (5,5), after animating the final
    position of the sprite would be (15,15); in case of moveTo action the final position
    would be (5,5)).


    # 6.3 Available Actions List


    The following is the list of available actions that you can apply on any nodes.
    The listed combinations include By and To Variations, which you can try with simple
    sprites.


    # 6.3.1 Move


    This action is used to animate the x,y position of any node instance:


    ```

    1 var action = cc.moveBy(2, cc.p(size.width - 40, size.height - 40));

    2 var action = cc.moveTo(2, cc.p(size.width - 40, size.height - 40));

    ```


    The first parameter is the duration and the second is the target point value.


    # 6.3.2 Jump


    This action is used to animate the node''s x,y position in a parabolic way that
    looks like it is jumping:


    ```

    1 var action = new cc.Jump(2, cc.p(300, 0), 50, 40);

    2 var action = new cc.Jump(2, 300, 0, 50, 40);

    ```


    The first parameter is the duration, as it is for all actions. The second parameter
    is a point or number that represents the target value (either x or x,y). If it
    is a point, the third parameter is considered as height; if it is a number, then
    the third parameter is considered as a y value. The next two parameters represent
    height and number of jumps. In this case (x,y) and height represent the width
    and height of the parabola.


    # 6.3.3 Rotation


    This action is used to animate the node by modifying the rotation attribute over
    time:


    ```

    1 var action = new cc.Rotate(2, 360);

    2 var action = new cc.RotateTo(2, 360);

    ```


    The first parameter is duration and the second parameter is angleX, which rotates
    around the x axis. The third parameter, angleY, is optional and is used for rotation
    in rare cases.'
  - '[PAGE 70]


    # 6.3.4 Scale


    This action is used to scale the node. It uses the scale function of the node
    to scale the node over the specified duration:


    +   - var action = new cc.ScaleTo(2, 0.5, 2);

    - var action = new cc.ScaleBy(2, 0.5, 2);


    The first parameter is duration and the second and third are sx,sy, which are
    scaleX and scaleY values.


    # 6.3.5 Skew


    This action is similar to scale, but it uses skewX and skewY values to animate
    the skew:


    +   - var action = new cc.SkewTo(2, 37.2, -37.2);

    - var action = new cc.SkewBy(2, 37.2, -37.2);


    Parameters are the same as scale.


    # 6.3.6 Tint


    This action is used to animate the RGB channel of the node; only the By version
    is available for this action:


    +   - var action = new cc.TintBy(2, -127, -255, -127);


    The first parameter is duration, and the next three parameters are deltaR, deltaB,
    and deltaG values.


    # 6.3.7 Bezier


    This action is used to move the target through a Bezier curve:


    +   - var bezier = [[cc.p(0, windowSize.height / 2), cc.p(300, -windowSize.height
    / 2), cc.p(300, 100)];

    - var bezierForward = new cc.BezierBy(3, bezier);

    - var bezierTo = new cc.BezierTo(3, bezier);


    The first parameter is duration and the second is an array that has a list of
    points that defines the Bezier curve.'
  - '[PAGE 71]


    # 6.3.8 Cardinal Spline


    This is similar to Bezier. The target will move through a cardinal spline curve.
    Usually, this action is used when you simulate the movement of a sprite over path
    data, which is a collection of consecutive points. See here:


    ```

    var action = cc.cardinalSplineTo(3, array, 0);

    var action = cc.cardinalSplineTo(3, array, 0);

    ```


    Parameters are the same as for Bezier; however, it has a third parameter that
    represents tension, or the weight between two points, and calculates the duration
    of movement from one to another.


    # 6.4 Easing


    By default, all actions that animate the properties of the node over time linearly
    are called linear interpolation. Such an animation looks straightforward. When
    you want to add organic effects to your animation, your animation needs an easing
    function. See Figure 6-1.


    ![](img/c9248a93bcc9d1d0881a7269e1be3174_71_0.png)


    Figure 6-1. Linear and easing


    As you can see, the first image is linear, which all actions will use by default.
    The other three are different easing functions. In Cocos2d-js, there are over
    26 types of easing. For all easing functions, the usage is the same. Let''s see
    an example:


    ```

    var easing=cc.easeBackIn();

    //or

    var easing=new cc.EaseBackIn();

    action.easing(easing);

    ```'
- md: "\nSo simple! In this example, I have used the EaseBackIn class to create the\
    \ easing object, or you can use a singleton cc.easeBackIn object to run on your\
    \ action. I prefer the first way. Let's see the list of easing functions available\
    \ in Cocos2d-js. Remember: usage is the same for all easing functions.\n\n- cc.EaseBackIn\n\
    - cc.EaseBackInOut\n- cc.EaseBackOut\n- cc.EaseBezierAction\n- cc.EaseBounce\n\
    - cc.EaseBounceIn\n- cc.EaseBounceInOut\n- cc.EaseBounceOut\n- cc.EaseCircleActionIn\n\
    - cc.EaseCircleActionInOut\n- cc.EaseCircleActionOut\n- cc.EaseCubicActionIn\n\
    - cc.EaseCubicActionInOut\n- cc.EaseCubicActionOut\n- cc.EaseElastic\n- cc.EaseElasticIn\n\
    - cc.EaseElasticInOut\n- cc.EaseElasticOut\n- cc.EaseExponentialIn\n- cc.EaseExponentialInOut\n\
    - cc.EaseExponentialOut\n- cc.EaseQuadraticActionIn\n- cc.EaseQuadraticActionInOut\n\
    - cc.EaseQuadraticActionOut\n- cc.EaseQuarticActionIn\n- cc.EaseQuarticActionInOut\n\
    - cc.EaseQuarticActionOut\n- cc.EaseQuinticActionIn\n\n## CHAPTER 6 FUN WITH ANIMATION\n\
    \n- cc.EaseQuinticActionInOut\n- cc.EaseQuinticActionOut\n- cc.EaseRateAction\n\
    - cc.EaseIn\n- cc.EaseInOut\n- cc.EaseOut\n- cc.EaseSineIn\n- cc.EaseSineInOut\n\
    \nThis list will satisfy all your easing needs. All the easing is derived from\
    \ cc.ActionEase, which is the base class.\n\n## 6.5 Sequence\n\nSay, for example,\
    \ two or more actions that need to be performed on a node one after the other.\
    \ Sequence will help us to do that. Let's see an example:\n\n```\nvar seq = new\
    \ cc.Sequence([action1,action2]);\nthis.sprite.runAction(seq);\n```\n\ncc.Sequence\
    \ accepts two parameter types: one is an array of actions, and the other one will\
    \ be discussed later in this section. It can be run using the runAction function\
    \ of the node, just like any other action.\n\n### 6.5.1 Reversing Sequence\n\n\
    Once a sequence is created, it can be reversed and run on any node, as follows:\n\
    \n```\nthis.sprite.runAction(seq.reverse());\n```\n\nThe reverse function will\
    \ reverse the actions in sequence and will return a new instance of sequence.\n\
    \n### 6.5.2 Repeating Sequence\n\nOnce a sequence is created, we can repeat the\
    \ action a finite number of times, and we can repeat it infinitely. See here:\n\
    \n```\n//Repeat sequence 5 times\nthis.sprite.runAction(seq.repeat(5));\n\n//Repeat\
    \ sprite sequence forever\nthis.sprite.runAction(seq.repeatForever());\n```\n\n\
    The repeat and repeatForever functions of sequence are used for this purpose.\n\
    \n### 6.5.3 Action End Callback\n\nIt is possible in a sequence object to attach\
    \ an end callback function for each action.\nLet's see an example:\n\n```\nvar\
    \ seq=new cc.Sequence(action1,cc.callFunc(function(){/*action1 end callback*/}\n\
    this),\naction2,cc.callFunc(function(){/*action2 end callback*/}\nthis));\n```\n\
    \nAs discussed earlier, Sequence accepts two parameter types. It is an array of\
    \ actions, and the other is a series of actions and their action end callback,\
    \ like just seen.\n\n## 6.6 Spawn\n\nThere are scenarios where you want to execute\
    \ two or more actions simultaneously on a node. Spawn is used for this purpose:\n\
    \n```\nvar spawn=new cc.Spawn([action1,action2])\nthis.sprite.runAction(spawn);\n\
    ```\n\nAs you can see, the syntax is similar to Sequence. It accepts an array\
    \ of actions to be executed simultaneously. Be cautious when you execute multiple\
    \ actions at the same time, as it may produce a weird effect if not used properly.\n\
    \n## 6.7 Stopping an Action\n\nEvery action can be stopped while it is running.\
    \ The stopAction function of the node is used for this purpose:\n\n```\nsprite.stopAction(action);\n\
    ```\n\nThis stops the action immediately regardless of its state. You can use\
    \ this for user actions or any dynamic triggers that require actions to be stopped\
    \ immediately.\n\n## 6.8 Sprite Frame Animation\n\nIn Chapter 3, we saw how sprite\
    \ frame animation can be done using sprite sheets. That chapter was more focused\
    \ on sprites, while this section will provide a detailed explanation of it from\
    \ the animation side. Each and every image part in a sprite can be classified\
    \ using SpriteFrame with rect coordinates. The Animation class can be used to\
    \ perform a sprite frame animation sequence on a sprite. Let's see an example:\n\
    \n```\nvar animation = new cc.Animation(spriteFrames, 0.08);\nthis.sprite.runAction(cc.animate(animation).repeatForever());\
    \ // or new\ncc.Animation().pattern can be used.\n```\n\nThe first parameter is\
    \ an array of cc.SpriteFrame instances, and the second is the delay. Like the\
    \ Action class, this also has repeat and repeatForever functions.\n\n## 6.9 Scheulers\
    \ and Update\n\nIn Cocos2d-js, there is an update loop, which is a main loop;\
    \ every cc.Node is capable of receiving update notifications, then the node has\
    \ to subscribe to it. This subscribe mechanism is implemented with performance\
    \ considerations in mind.\nIn cc.Node, in the constructor, the following method\
    \ needs to be called:\n\n```\nthis.scheduleUpdate();\n```\n\nOnce this is done,\
    \ you can define a method update:\n\n```\nupdate:function(dt) {\n}\n```\n\nLet's\
    \ perform an animation using update. First, create a layer and scene as mentioned\
    \ earlier, then add a sprite to the scene:\n\n```\nthis.sprite = new cc.Sprite(res.Sprite_Image);\n\
    this.sprite.attr({\n  x: size.width / 2,\n  y: size.height / 2\n});\nthis.addChild(this.sprite,\
    \ 0);\n```\n\nWe are going to animate the sprite from left to right in ping-pong\
    \ fashion. For that we need to have seed value:\n\n```\nthis.seed=10;\n```\n\n\
    Let's define our update method and animate the sprite:\n\n```\nupdate:function(dt)\
    \ {\n  if(this.sprite.getPositionX()>cc.winSize.width) {\n    this.seed=-10;\n\
    \  } else if (this.sprite.getPositionX()<0) {\n    this.seed=10;\n  }\n  this.sprite.setPosition(this.sprite.getPositionX()+this.seed);\n\
    }\n```\n\nBy now the code should look like the following:\n\n```\nvar SchedLayer\
    \ = BaseLayer.extend({\n  sprite:null,\n  ctor: function () {\n    this._super();\n\
    \    var size = cc.winSize;\n    this.sprite = new cc.Sprite(res.Sprite_Image);\n\
    \    this.sprite.attr({\n      x: size.width / 2,\n      y: size.height / 2\n\
    \    });\n    this.seed=10;\n    this.addChild(this.sprite, 0);\n    this.scheduleUpdate();\n\
    \  },\n  update:function(dt) {\n    if(this.sprite.getPositionX()>cc.winSize.width)\
    \ {\n      this.seed=-10;\n    } else if (this.sprite.getPositionX()<0) {\n  \
    \    this.seed=10;\n    }\n    this.sprite.setPosition(this.sprite.getPositionX()+this.seed);\n\
    \  }\n});\n```\n\nThe output should look like a sprite moving left to right and\
    \ vice versa. See Figure 6-2.\n\n## CHAPTER 7: Adding Physics to Your Game\n\n\
    ### 7.1 Introduction\n\nIn physics-based games, simulating the physics of the\
    \ real world is very important. There are a variety of physics engines available\
    \ today. The most popular one for Cocos2d-js is Chipmunk physics. This was originally\
    \ written in C and later was ported to various platforms. Even though you can\
    \ use other game engines with Cocos2d-js, the Chipmunk engine is highly recommended.\
    \ It is the native physics engine for Cocos2d-x.\n\n### 7.2 Chipmunk Overview\n\
    \nPhysics is all about altering sprites' position and rotation in the right manner\
    \ such that it will look like a physics simulation. There is a clear separation\
    \ between your game world and the physics space. See Figure 7-1.\n\n### 7.3 Chipmunk\
    \ Space\n\nThe first thing you have to do include the Chipmunk module in your\
    \ project.json file:\n\n- \"modules\" : [\"cocos2d\",...,\"chipmunk\"]\n\nLet's\
    \ see how this space can be created:\n\n```\ninitPhysics:function() {\n  //init\
    \ space\n  this.space = new cp.Space();\n  //setup the Gravity\n  this.gravity\
    \ = cp.v(0, -800); //Earth gravity\n  this.space.sleepIterations = 30;\n  this.space.sleepTimeThreshold\
    \ = Infinity;\n  this.space.collisionSlop = Infinity;\n}\n```\n\ninitPhysics function\
    \ will be placed inside the layer object; that is, initPhysics will be one of\
    \ the properties of layer object.\n\n```\nupdate:function(dt) {\n  this.space.step(dt);\n\
    }\n```\n\nPhysics simulation is driven by the step method, which is constantly\
    \ triggered in the update cycle of layer.\n"
  mdcn: "\n太简单了！在这个例中，我 使用了 `EaseBackIn` 类来创建一个缓动对象，或者你也可以使用单例 `cc.easeBackIn` 对象来运行你的动作。我更倾向于第一种方法。让我们来看看\
    \ Cocos2d-js 中可用的缓动函数列表。记住：所有缓动函数的用法都是相同的。\n\n- cc.EaseBackIn\n- cc.EaseBackInOut\n\
