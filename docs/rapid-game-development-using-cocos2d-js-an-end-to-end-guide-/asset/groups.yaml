- md: "\n## CHAPTER 5\n\n## Adding a GUI\n\n## 5.1 Introduction\n\nA GUI is another\
    \ essential part of any game. It shows the HUD display, score, any required text,\
    \ and buttons such as play and pause. Cocos2d-js has pre-defined node types to\
    \ represent GUI elements. Let's look at them one by one.\n\n## 5.2 Labels\n\n\
    If you want to display any text in your game, then Label objects can be used.\
    \ There are two types of label offered by Cocos2d-js.\n\n### 5.2.1 Label with\
    \ True Type Font\n\nYou can define a label such that it uses custom type fonts.\
    \ Usually, these fonts have a .ttf file format. In Cocos2d-js, the cc.LabelTTF\
    \ class can be used to create such a label. Let's have a look at the syntax:\n\
    \n- var Label= new cc.LabelTTF(text, fontName, fontSize, dimensions, alignment,\
    \ vAlignment)\n- [string] text - represents the text you want to display\n- [string]\
    \ fontName - represents the loaded .ttf font name\n- [Number] fontSize - represents\
    \ font size\n- [cc.Size] dimensions - label width and height; if not set, this\
    \ is calculated automatically\n- HAlignment - represents horizontal alignment\
    \ of text outside the label; it can be one of the following values: {cc.TEXT_ALIGNMENT_LEFT\
    \ | cc.TEXT_ALIGNMENT_CENTER | cc.TEXT_ALIGNMENT_RIGHT}\n- vAlignment - vertical\
    \ alignment of text inside the label; it can be one of the following values: {cc.VERTICAL_TEXT_ALIGNMENT_TOP|cc.VERTICAL_TEXT_ALIGNMENT_CENTER|cc.VERTICAL_TEXT_ALIGNMENT_BOTTOM}\n\
    \nAll of these values can be changed dynamically using the appropriate set of\
    \ functions. Please refer to the documentation for more information on these functions.\
    \ You will see real examples in an upcoming section.\n\n### 5.2.2 Label with Bitmap\
    \ Font\n\nIn a bitmap font, each character is represented by an image. All the\
    \ characters should be located in one png file, and info regarding the font will\
    \ be present in a (.fnt) file. The cc.LabelBMFont class is used to represent this\
    \ label type. Let's look at how\n\n```\nvar label = new cc.LabelBMFont(text, fntFile,\
    \ width, alignment, imageOffset)\n```\n- [string] text - represents the text you\
    \ want to display\n- [fntFile] fntFile - represents the .fnt filename\n- [width]\
    \ width - represents the width of the label\n- alignment - represents the horizontal\
    \ alignment of the image label. Can be one of the following values: {cc.TEXT_ALIGN_LEFT|cc.TEXT_ALIGNMENT_CENTER|cc.TEXT_ALIGNMENT_RIGHT}\n\
    - [point] imageOffset - represents the x,y offset point where the image center\
    \ needs to be aligned\n\n### 5.2.3 Example\n\nIn the src folder, create a file\
    \ named labeledemo.js and copy the following code into it:\n\n```\nvar LabelDemoLayer\
    \ = cc.Layer.extend(\n  sprite:null,\n  ctor:function () {\n    this._super();\n\
    \n    var size = cc.winSize;\n    var colorLayer = new cc.LayerColor(cc.color(142,29,42));\n\
    \    this.addChild(colorLayer);\n    this.Label1 = new cc.LabelTTF('Default Font\
    \ Label','', 32);\n\nthis.Label1.attr({\nx: size.width / 2,\ny: size.height /\
    \ 1.3\n});\nthis.addChild(this.Label1);\n\nthis.Label2 = new cc.LabelTTF('Custom\
    \ Font Label','Abduction', 32);\nthis.Label2.attr({\nx: size.width / 2,\ny: size.height\
    \ / 1.5\n});\nthis.addChild(this.Label2);\n\nthis.Label3 = new cc.LabelTTF('Label\
    \ With Stroke','Abduction', 32);\nthis.Label3.attr({\nx: size.width / 2,\ny: size.height\
    \ / 1.9\n});\nthis.Label3.enableShadow(cc.color(0,0,0),10);\nthis.addChild(this.Label3);\n\
    \nthis.Label4 = new cc.LabelTTF('Label With Shadow','Abduction', 32);\nthis.Label4.attr({\n\
    x: size.width / 2,\ny: size.height / 2.3\n});\nthis.Label4.enableShadow(cc.color(0,0,0),\
    \ 50, 50);\nthis.addChild(this.Label4);\n\nthis.Label5 = new cc.LabelFont('Bitmap\
    \ Font', res.BM_Font);\nthis.Label5.attr({\nx: size.width / 2,\ny: size.height\
    \ / 2.9\n});\nthis.addChild(this.Label5);\n\nreturn true;\n}\n```\n\nAs usual,\
    \ do steps to run this layer. Let's see how the label has been used. At first,\
    \ cc.Layer has been included as a child so as to set the background color:\n\n\
    ```\nvar colorLayer = new cc.LayerColor(cc.color(142,29,42));\nthis.addChild(colorLayer);\n\
    ```\n\nThe first label is created using that label 'Default font name', and fontname\
    \ is specified as an empty string so that it falls back to the default font in\
    \ the system.\nThe second label is created with a loaded font name; in this case,\
    \ I have used Abduction.ttf, which is specified in resource.js as follows:\n\n\
    ```\nvar res = {\n  Custom_TTF:\"res/Abduction.ttf\",\n....\n};\n```\n\nSo, during\
    \ the app load, this font will be loaded into memory with other resources in the\
    \ res object:\n\n```\nthis.Label2 = new cc.LabelTTF('Custom Font Label','Abduction',\
    \ 32)\nthis.Label2.attr({\n  x: size.width / 2,\n  y: size.height / 1.5\n})\n\
    this.addChild(this.Label2);\n```\n\nSpecifying the font name 'Abduction' happens\
    \ in the second parameter. Specifying the font filename directly in the label\
    \ will not work.\nThe third label uses the same custom font 'Abduction'; the difference\
    \ is that it enables a stroke on the label:\n\n```\nthis.Label3.enableStroke(cc.color(0,0,0),10);\n\
    ```\n\nThe fourth label is created with a shadow:\n\n```javascript\nthis.Label4.enableShadow(cc.color(0,0,0),\
    \ 50, 50);\n```\n\nThe fifth label uses a bitmap font:\n\n```javascript\nthis.Label5\
    \ = new cc.LabelFont('Bitmap Font', res.BM_Font);\n```\n"
  mdcn: "\n\n## 第 5 章\n\n## 添加 GUI\n\n## 5.1 介绍\n\nGUI 是任何游戏中的另一个重要组成部分。它显示 HUD 显示、分数、任何所需的文本以及播放和暂停等按钮。Cocos2d-js\
    \ 提供了预定义的节点类型来表示 GUI 元素。让我们逐一查看。\n\n## 5.2 标签 (Label)\n\n如果你想在游戏中显示任何文本，可以使用 Label\
    \ 对象。Cocos2d-js 提供了两种类型的标签。\n\n### 5.2.1 使用真类型字体的 Label\n\n你可以定义一个使用自定义字体的标签。通常，这些字体是\
    \ .ttf 文件格式。在 Cocos2d-js 中，可以使用 `cc.LabelTTF` 类来创建这样的标签。让我们来看它的语法：\n\n- var Label=\
    \ new cc.LabelTTF(text, fontName, fontSize, dimensions, alignment, vAlignment)\n\
    - [string] text - 代表你想要显示的文本\n- [string] fontName - 代表加载的 .ttf 字体名称\n- [Number]\
    \ fontSize - 代表字体大小\n- [cc.Size] dimensions - 标签的宽度和高度；如果不设置，将自动计算\n- HAlignment\
    \ - 代表标签外文本的水平对齐；它可以是以下值之一：{cc.TEXT_ALIGNMENT_LEFT | cc.TEXT_ALIGNMENT_CENTER\
    \ | cc.TEXT_ALIGNMENT_RIGHT}\n- vAlignment - 标签内文本的垂直对齐；它可以是以下值之一：{cc.VERTICAL_TEXT_ALIGNMENT_TOP|cc.VERTICAL_TEXT_ALIGNMENT_CENTER|cc.VERTICAL_TEXT_ALIGNMENT_BOTTOM}\n\
    \n所有这些值都可以使用相应的函数set进行动态更改。请参考文档以获取有关这些函数的更多信息。你将在后续章节中看到真实示例。\n\n### 5.2.2 使用位图字体的\
    \ Label\n\n在位图字体中，每个字符由一个图像表示。所有字符应该位于一个 png 文件中，字体信息将存在于 (.fnt) 文件中。`cc.LabelBMFont`\
    \ 类用于表示这种标签类型。让我们看看如何使用\n\n```\nvar label = new cc.LabelBMFont(text, fntFile,\
    \ width, alignment, imageOffset)\n```\n- [string] text - 代表你想要显示的文本\n- [fntFile]\
    \ fntFile - 代表 .fnt 文件名\n- [width] width - 代表标签的宽度\n- alignment - 代表图像标签的水平对齐。可以是以下值之一：{cc.TEXT_ALIGN_LEFT|cc.TEXT_ALIGNMENT_CENTER|cc.TEXT_ALIGNMENT_RIGHT}\n\
    - [point] imageOffset - 代表图像中心需要对齐的 x,y 偏移点\n\n### 5.2.3 示例\n\n在 src 文件夹中，创建一个名为\
    \ `labeledemo.js` 的文件并将以下代码复制到其中：\n\n```\nvar LabelDemoLayer = cc.Layer.extend(\n\
    \  sprite:null,\n  ctor:function () {\n    this._super();\n\n    var size = cc.winSize;\n\
    \    var colorLayer = new cc.LayerColor(cc.color(142,29,42));\n    this.addChild(colorLayer);\n\
    \    this.Label1 = new cc.LabelTTF('Default Font Label','', 32);\n\nthis.Label1.attr({\n\
    x: size.width / 2,\ny: size.height / 1.3\n});\nthis.addChild(this.Label1);\n\n\
    this.Label2 = new cc.LabelTTF('Custom Font Label','Abduction', 32);\nthis.Label2.attr({\n\
    x: size.width / 2,\ny: size.height / 1.5\n});\nthis.addChild(this.Label2);\n\n\
    this.Label3 = new cc.LabelTTF('Label With Stroke','Abduction', 32);\nthis.Label3.attr({\n\
    x: size.width / 2,\ny: size.height / 1.9\n});\nthis.addChild(this.Label3);\n\n\
    this.Label4 = new cc.LabelTTF('Label With Shadow','Abduction', 32);\nthis.Label4.attr({\n\
    x: size.width / 2,\ny: size.height / 2.3\n});\nthis.addChild(this.Label4);\n\n\
    this.Label5 = new cc.LabelFont('Bitmap Font', res.BM_Font);\nthis.Label5.attr({\n\
    x: size.width / 2,\ny: size.height / 2.9\n});\nthis.addChild(this.Label5);\n\n\
    return true;\n}\n```\n\n按照常例，运行此层。让我们看看标签是如何使用的。首先，包含了 `cc.Layer` 作为子节点以便设置背景颜色：\n\
    \n```\nvar colorLayer = new cc.LayerColor(cc.color(142,29,42));\nthis.addChild(colorLayer);\n\
    ```\n\n第一个标签使用的是“默认字体名称”标签，字体名称指定为空字符串，因此它会回退到系统的默认字体。第二个标签使用加载的字体创建；在这种情况下，我使用了\
    \ Abduction，它在 `resource.js` 中指定如下：\n\n```\nvar res = {\n  Custom_TTF:\"res/Abduction.ttf\"\
    ,\n....\n};\n```\n\n因此，在应用加载期间，该字体与 res 对象中的其他资源一起加载到内存中：\n\n```\nthis.Label2\
    \ = new cc.LabelTTF('Custom Font Label','Abduction', 32)\nthis.Label2.attr({\n\
    \  x: size.width / 2,\n  y: size.height / 1.5\n})\nthis.addChild(this.Label2);\n\
    ```\n\n指定字体名称 'Abduction' 发生在第二个参数中。直接在标签中指定字体文件名将不起作用。\n第三个标签使用了相同的自定义字体 'Abduction'；区别在于它为标签开启了描边：\n\
    \n```\nthis.Label3.enableStroke(cc.color(0,0,0),10);\n```\n\n第四个标签带有阴影创建：\n\n\
    ```javascript\nthis.Label4.enableShadow(cc.color(0,0,0), 50, 50);\n```\n\n第五个标签使用位图字体：\n\
    \n```javascript\nthis.Label5 = new cc.LabelFont('Bitmap Font', res.BM_Font);\n\
    ```\n\n"
