- md: "\n# CHAPTER 3 A DEEPER LOOK AT SPRITES\n\nThe idea behind the frame animation\
    \ is that we are going to run through each frame in a specific interval so that\
    \ it will look like an animation sequence. In the preceding code, walk01 to walk11\
    \ represent frames with rects in the sprite sheet. If we put these frames together\
    \ and run through it, it will look like a walking animation.\n\nA SpriteFrame\
    \ instance is created with this frame rect array (see Figure 3-6):\n\n```javascript\n\
    var texture = cc.textureCache.addImage(res.SpriteSheet);\nvar animFrames=[];\n\
    for(var index in frameDatas) {\n  var spriteFrame = new cc.SpriteFrame(texture,\
    \ frameDatas[index]);\n  var animFrame = new cc.AnimationFrame();\n  animFrame.initWithSpriteFrame(spriteFrame,\
    \ 1, null);\n  animFrames.push(animFrame);\n}\n```\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_34_0.png)\n\
    \n**Figure 3-6.** SpriteFrame\n\nIn this example, we are manually creating the\
    \ cc.SpriteFrame instance, so it is going to need a texture instance of the sprite\
    \ sheet. Thus, we added the sprite sheet to the texture cache, which returns the\
    \ texture instance, which can be used to create all of the sprite frames.\n\n\
    Finally, the cc.Animation instance, which is used to perform the animation, is\
    \ created using the list of images from cc.AnimationFrame with a time interval\
    \ of 0.08 seconds.\n\nThe output will be a nice walk animation.\n\nIn the preceding\
    \ case, frame data has been formed manually, but in reality the sprite sheet will\
    \ be created from an individual image with the help of tools like TexturePack,\
    \ and associated data files will be created. In the case of Cocos2d, it is a PList\
    \ file that has all of the frame data related to the sprite sheet. In the next\
    \ example, we will see how to create the frame animation using PList.\n\n# CHAPTER\
    \ 3 A DEEPER LOOK AT SPRITES\n\n## 3.6 Sprite Frame Animation with PList Data\n\
    \nWe have created the same sprite sheet from an individual image using TexturePack,\
    \ and we generated the PList file. See Figure 3-7.\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_35_0.png)\n\
    \nFigure 3-7. TexturePack-generated sprite sheet\n\nWhile generating PList, make\
    \ sure that you have selected the data format as Cocos2d. Figure 3-8 shows the\
    \ generated texture.\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_36_0.png)\n\n\
    **Figure 3-8.** Sprite sheet from TexturePack\n\nYou can examine the PList data\
    \ file in the res folder of the sample project available at https://github.com/nutcrackify/Rapid-_Game_Development_Using_Cocos2d-js.\
    \ In src, create a file called plistanimation.js and copy the following code to\
    \ it:\n\n```javascript\nvar PListAnimationLayer = cc.Layer.extend({\n  sprite:null,\n\
    \  ctor:function () {\n    this._super();\n    var size = cc.winSize;\n    cc.spriteFrameCache.addSpriteFrames(res.Sprite_Sheet1_P,\
    \ res.Sprite_Sheet1);\n    // Create SpriteFrame and AnimationFrame with Frame\
    \ Data\n    var animFrames=[];\n    for(var i=1;i<12;i++) {\n      var str = \"\
    p1_walk\" + (i < 10 ? (\"0\" : i) + \".png\";\n      var spriteFrame=cc.spriteFrameCache.getSpriteFrame(str);\n\
    \      animFrames.push(spriteFrame);\n    }\n\n    // Create an empty sprite\n\
    \    this.sprite = new cc.Sprite();\n    this.sprite.attr({\n      x: size.width\
    \ / 2,\n      y: size.height / 2\n    });\n\n    this.addChild(this.sprite, 0);\n\
    \n    var animation = new cc.Animation(animFrames, 0.08);\n    this.sprite.runAction(cc.animate(animation)).repeatForever();\n\
    \n    return true;\n  }\n});\n```\n\nIn resource.js, include the List and sprite\
    \ sheet file with variables Sprite_Sheet1_P and Sprite_Sheet1; both have been\
    \ added to the frame cache, as follows:\n\n```javascript\ncc.spriteFrameCache.addSpriteFrames(res.Sprite_Sheet1_P,\
    \ res.Sprite_Sheet1);\n\nvar animFrames=[];\nfor(var i=1;i<12;i++) {\n    var\
    \ str = \"p1_walk\" + (i < 10 ? (\"0\" : i) + \".png\";\n    var spriteFrame=cc.spriteFrameCache.getSpriteFrame(str);\n\
    \    animFrames.push(spriteFrame);\n}\n```\n\nBased on the List data and sprite\
    \ sheet, a sprite frame can be created using the getSpriteFrame, function:\n\n\
    Now we have list sprite frames that can be animated using the cc.Animation class:\n\
    \n```javascript\nvar animation = new cc.Animation(animFrames, 0.08);\nthis.sprite.runAction(cc.animate(animation)).repeatForever();\n\
    ```\n\nThis is the same walk animation that we did without PList (Wait, \"This\
    \ is the same walk animation we did using the raw frame data without PList\").\n\
    \n## 3.7 TextureCache with Sprites\n\nTexture caches are an essential part of\
    \ the sprite construct and are used to cache texture data in memory so that when\
    \ the same texture is referred to again, it will be loaded from the cache. This\
    \ improves the overall performance and memory optimization for your game. See\
    \ Figure 3-9.\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_38_0.png)\n\nFigure\
    \ 3-9. Texture cache\n\nWhenever you create a sprite with an image file, internally\
    \ the image file gets loaded to TextureCache, and a Texture2D instance is created\
    \ from the cache. In the previous examples you saw how we loaded the sprite sheets\
    \ into the texture cache and used that to create SpriteFrame instances. See Figure\
    \ 3-10.\n\n## 3.8 SpriteFrameCache with Sprites\n\nSimilar to TextureCache, SpriteFrameCache\
    \ is used to cache the SpriteFrame that is used by cc.Sprite. If you have a sprite\
    \ sheet, individual SpriteFrames can be cached in SpriteFrameCache and used later\
    \ needed. This has been illustrated in the previous code and Figure 3-11.\n\n\
    ![](img/c9248a93bcc9d1d0881a7269e1be3174_40_0.png)\n\n**Figure 3-11.** SpriteCache\
    \ sharing SpriteFrame\n\n## 3.9 Batching\n\nSprite batching is a technique that\
    \ combines multiple sprite renderings using a single draw call, provided that\
    \ the sprites use the same texture or texture sheet.\n\n### 3.9.1 SpriteBatchNode\n\
    \ncc.SpriteBatchNode is the class used to combine multiple sprites into a single\
    \ draw call. Let's look at an example. First, let's create four individual sprites\
    \ with the same sprite sheets and different Sprite rects:\n\n```javascript\nthis.sprite1\
    \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(438,93,64,94));\nthis.sprite1.attr({\n\
    \  x: size.width / 2,\n  y: size.height / 1.5\n});\n\nthis.sprite2 = new cc.Sprite(res.Sprite_Sheet,cc.rect(73,0,72,97));\n\
    this.sprite2.attr({\n  x: size.width / 2,\n  y: size.height / 2\n});\n\nthis.sprite3\
    \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(219,0,72,97));\nthis.sprite3.attr({\n\
    \  x: size.width / 2,\n  y: size.height / 3\n});\n\nthis.sprite4 = new cc.Sprite(res.Sprite_Sheet,cc.rect(365,0,72,97));\n\
    this.sprite4.attr({\n  x: size.width / 2,\n  y: size.height / 5\n});\n```\n\n\
    Now, let's create an instance of SpriteBatchNode with the same sprite sheet:\n\
    \n```javascript\nthis.spritebatch=new cc.SpriteBatchNode(res.Sprite_Sheet);\n\
    ```\n\nLet's add sprites to the SpriteBatchNode:\n\n```javascript\nthis.spritebatch.addChild(this.sprite1,\
    \ 0);\nthis.spritebatch.addChild(this.sprite2, 0);\nthis.spritebatch.addChild(this.sprite3,\
    \ 0);\nthis.spritebatch.addChild(this.sprite4, 0);\n```\n\nFinally, let's add\
    \ spritebatch to the layer:\n\n```javascript\nthis.addChild(this.spritebatch);\n\
    ```\n\nNow, the code below is supposed to look like this:\n\n```javascript\nvar\
    \ SpriteBatchLayer = BaseSampleLayer.extend({\n  sprite:null,\n  ctor:function\
    \ () {\n    this.super();\n    var size = cc.winSize;\n    this.sprite1 = new\
    \ cc.Sprite(res.Sprite_Sheet,cc.rect(438,93,64,94));\n    this.sprite1.attr({\n\
    \      x: size.width / 2,\n      y: size.height / 1.5\n    });\n\n    this.sprite2\
    \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(73,0,72,97));\n    this.sprite2.attr({\n\
    \      x: size.width / 2,\n      y: size.height / 2\n    });\n\n    this.sprite3\
    \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(219,0,72,97));\n    this.sprite3.attr({\n\
    \      x: size.width / 2,\n      y: size.height / 3\n    });\n\n    this.sprite4\
    \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(365,0,72,97));\n    this.sprite4.attr({\n\
    \      x: size.width / 2,\n      y: size.height / 5\n    });\n\n    this.spritebatch=new\
    \ cc.SpriteBatchNode(res.Sprite_Sheet);\n    this.spritebatch.addChild(this.sprite1,\
    \ 0);\n    this.spritebatch.addChild(this.sprite2, 0);\n    this.spritebatch.addChild(this.sprite3,\
    \ 0);\n    this.spritebatch.addChild(this.sprite4, 0);\n\n    this.addChild(this.spritebatch);\n\
    \n    return true;\n  }\n});\n```\n"
  mdcn: "\n\n# 第 3 章 深入了解精灵\n\n帧动画背后的思想是我们在特定的间隔内运行每一帧，以便使其看起来像一段动画序列。在之前的代码中，walk01\
    \ 到 walk11 代表精灵集集中带有矩形区域（rects）的帧。如果我们将这些帧组合在一起并运行，它看起来就像一个行走动画。\n\n使用此帧矩形数组创建一个\
    \ `cc.SpriteFrame` 实例（见图 3-6）：\n\n```javascript\nvar texture = cc.textureCache.addImage(res.SpriteSheet);\n\
    var animFrames=[];\nfor(var index in frameDatas) {\n  var spriteFrame = new cc.SpriteFrame(texture,\
    \ frameDatas[index]);\n  var animFrame = new cc.AnimationFrame();\n  animFrame.initWithSpriteFrame(spriteFrame,\
    \ 1, null);\n  animFrames.push(animFrame);\n}\n```\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_34_0.png)\n\
    \n**图 3-6.** SpriteFrame\n\n在本例中，我们手动创建了 `cc.SpriteFrame` 实例，因此它需要一个精灵集的纹理实例。因此，我们将精灵集添加到纹理缓存中，返回纹理实例，该实例可用于创建所有精灵帧。\n\
    \n最后，使用来自 `cc.AnimationFrame` 的图像列表和 0.08 秒的时间间隔创建了用于执行动画的 `cc.Animation` 实例。\n\
    \n输出将是一个漂亮的行走动画。\n\n在前面的案例中，帧数据是手动构建的，但现实中，精灵集将借助 TexturePack 等工具从单张图像创建，并生成关联的数据文件。在\
    \ Cocos2d 中，它是一个包含所有与精灵集相关的帧数据的 PList 文件。在下一个示例中，我们将将会看到如何使用 PList 创建帧动画。\n\n\
    # 第 3 章 深入了解精灵\n\n## 3.6 使用 PList 数据进行精灵帧动画\n\n我们使用 TexturePack 从单张图像创建了相同的精灵集，并生成了\
    \ PList 文件。见图 3-7。\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_35_0.png)\n\n图\
    \ 3-7. TexturePack 生成的精灵集\n\n生成 PList 时，请确保你选择的数据格式为 Cocos2d。图 3-8 显示了生成的纹理。\n\
    \n![](img/c9248a93bcc9d1d0881a7269e1be3174_36_0.png)\n\n**图 3-8.** 来自 TexturePack\
    \ 的精灵集\n\n你可以查看 https://github.com/nutcrackify/Rapid_Game_Development_Using_C2d\
    \ 示例项目中 `res` 文件夹中的 PList 数据文件。在 `src` 中创建一个名为 `plistanimation.js` 的文件并复制以下代码：\n\
    \n```javascript\nvar PListAnimation = cc.Layer.extend({\n  sprite:null,\n  ctor:function\
    \ () {\n    this._super();\n    var size = cc.winSize;\n    cc.spriteFrameCache.addSpriteFrames(res.Sprite_Sheet1_P,\
    \ res.Sprite_Sheet1);\n    // 使用帧数据创建 SpriteFrame 和 Animation\n    var animFrames=[];\n\
    \    for(var i=1;i<12;i++) {\n      var str = \"p1_walk\" + (i < 10 ? \"0\" :\
    \ i) + \".png\";\n      var spriteFrame=cc.spriteFrameCache.getSpriteFrame(str);\n\
    \      animFrames.push(spriteFrame);\n    }\n\n    // 创建一个空精灵\n    this.sprite\
    \ = new cc.Sprite();\n    this.sprite.attr({\n      x: size.width / 2,\n     \
    \ y: size.height / 2\n    });\n\n    this.addChild(this.sprite, 0);\n\n    var\
    \ animation = new cc.Animation(animFrames, 0.08);\n    this.sprite.runAction(cc.animate(animation)).repeatForever();\n\
    \n    return true;\n  }\n});\n```\n\n在 `resource.js` 中，包含 `Sprite_Sheet1_P` 和\
    \ `Sprite_Sheet1` 变量的 List 和精灵集文件已添加到帧缓存：\n\n```javascript\ncc.spriteFrameCache.addSpriteFrames(res.Sprite_Sheet1_P,\
    \ res.Sprite_Sheet1);\n\nvar animFrames=[];\nfor(var i=1;i<12;i++) {\n    var\
    \ str = \"p1_walk\" + (i < 10 ? \"0\" : i) + \".png\";\n    var spriteFrame=cc.spriteFrameCache.getSpriteFrame(str);\n\
    \    animFrames.push(spriteFrame);\n}\n```\n\n根据 List 数据和精灵集，可以使用 `getSpriteFrame`\
    \ 创建精灵帧：\n\n现在我们有了可以使用 `cc.Animation` 类进行动画的列表帧：\n\n```javascript\nvar animation\
    \ = new cc.Animation(animFrames, 0.08);\nthis.sprite.runAction(cc.animate(animation));\n\
    ```\n\n这是没有没有 PList 的相同行走动画（等待，这是我们使用原始帧数据做的相同行走动画）。\n\n## 3.7 带精灵的 TextureCache\n\
    \n纹理缓存是精灵构造的重要部分，用于在内存中缓存纹理数据，以便当再次引用相同的纹理时将从缓存中加载。这提高了游戏的整体性能并优化了内存。见图 3-9。\n\
    \n![](img/c9248a93bcc9d1d0881a7269e1be3174_38_0.png)\n\n图 3-9. 纹理缓存\n\n每当你使用图像文件创建精灵时，该文件会被加载到\
    \ `TextureCache`，并从缓存创建一个 `Texture2D` 实例。在之前的示例中，你看到了如何将精灵集加载到纹理缓存并用它创建 `SpriteFrame`\
    \ 实例。见图 3-10。\n\n## 3.8 带精灵的 SpriteFrameCache\n\n与 `TextureCache` 类似，`SpriteFrameCache`\
    \ 用于缓存 `cc.Sprite` 使用的 `SpriteFrame`。如果你有一个精灵集，可以将单个 `SpriteFrame` 缓存并在需要时使用。这在之前的代码和图\
    \ 3-11 中已说明。\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_40_0.png)\n\n**图 3-11.**\
    \ SpriteCache 共享 SpriteFrame\n\n## 3.9 批处理 (Batching)\n\n精灵批处理是一种使用单次绘制调用合并多个精灵渲染的技术，前提是精灵使用相同的纹理或纹理集。\n\
    \n### 3.9.1 SpriteBatchNode\n\n`cc.SpriteBatchNode` 用于将多个精灵合并为单次绘制调用的类。让我们来看示例。首先，让我们创建具有相同精灵集但不同精灵矩形的四个独立精灵：\n\
    \n```javascript\nthis.sprite1 = new cc.Sprite(res.Sprite_Sheet,cc.rect(438,93,64,94));\n\
    this.sprite1.attr({\n  x: size.width / 2,\n  y: size.height / 1.5\n});\n\nthis.sprite2\
    \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(73,0,72,97));\nthis.sprite2.attr({\n\
    \  x: size.width / 2,\n  y: size.height / 2\n});\n\nthis.sprite3 = new cc.Sprite(res.Sprite_Sheet,cc.rect(219,0,72,97));\n\
    this.sprite3.attr({\n  x: size.width / 2,\n  y: size.height / 3\n});\n\nthis.sprite4\
    \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(365,0,72,97));\nthis.sprite4.attr({\n\
    \  x: size.width / 2,\n  y: size.height / 5\n});\n```\n\n现在，创建一个相同精灵集的 `SpriteBatchNode`\
    \ 实例：\n\n```javascript\nthis.spritebatch=new cc.SpriteBatchNode(res.Sprite_Sheet);\n\
    ```\n\n将精灵添加到 `SpriteBatchNode`：\n\n```javascript\nthis.spritebatch.addChild(this.sprite1,\
    \ 0);\nthis.spritebatch.addChild(this.sprite2, 0);\nthis.spritebatch.addChild(this.sprite3,\
    \ 0);\nthis.spritebatch.addChild(this.sprite4, 0);\n```\n\n最后，将 `spritebatch`\
    \ 添加到层中：\n\n```javascript\nthis.addChild(this.spritebatch);\n```\n\n现在，下面的代码应该是这样的：\n\
    \n```javascript\nvar SpriteBatchLayer = BaseSampleLayer.extend({\n  sprite:null,\n\
    \  ctor:function () {\n    this._super();\n    var size = cc.winSize;\n    this.sprite1\
    \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(438,93,64,94));\n    this.sprite1.attr({\n\
    \      x: size.width / 2,\n      y: size.height / 1.5\n    });\n\n    this.sprite2\
    \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(73,0,72,97));\n    this.sprite2.attr({\n\
    \      x: size.width / 2,\n      y: size.height / 2\n    });\n\n    this.sprite3\
    \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(219,0,72,97));\n    this.sprite3.attr({\n\
    \      x: size.width / 2,\n      y: size.height / 3\n    });\n\n    this.sprite4\
    \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(365,0,72,97));\n    this.sprite4.attr({\n\
    \      x: size.width / 2,\n      y: size.height / 5\n    });\n\n    this.spritebatch=new\
    \ cc.SpriteBatchNode(res.Sprite_Sheet);\n    this.spritebatch.addChild(this.sprite1,\
    \ 0);\n    this.spritebatch.addChild(this.sprite2, 0);\n    this.spritebatch.addChild(this.sprite3,\
    \ 0);\n    this.spritebatch.addChild(this.sprite4, 0);\n\n    this.addChild(this.spritebatch);\n\
    \n    return true;\n  }\n});\n```\n\n"
