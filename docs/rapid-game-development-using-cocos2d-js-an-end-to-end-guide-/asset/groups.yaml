    # About the Authors


    Hemanth Kumar and Abdul Rahman are a team of full-stack JavaScript experts, researchers,
    and mobile game developers with a wide range of experience in Web and game development.
    They are well versed in Cocos2d-x, Unity-3-D, and building artificial intelligence
    for games. They are also experts in doing scalable architecture for high-traffic
    websites. Their main passion is video game development.


    They are well versed in writing complex shaders for games, they published mobile
    games such as Blocky Pass, Little ninja town, Jumbo Jumpie on both android and
    ios, they wrote several unity plugins as well, they are also good in android and
    ios native apps development and built several successful apps which are now used
    by millions of users world wide such as learn arabic basics for android and GXP
    (goals tracker for ios), they are also experts in OpenGL, WebGL, iOS Metal and
    Vulcan on android.


    Hemanth is currently a developer for a company and he builds games in his free
    time, listening to music, playing guitar, and watching movies are his hobbies.


    Abdul is currently self employed and working on his dream app GXP (goals tracker
    for iOS), watching movies and bullying friends are his hobbies.


    # About the Technical Reviewer


    Nakul Verma is a professional game developer currently working as a senior unity
    developer at Aquimo Sports Pvt Ltd. If you talk about the industry, then he has
    been in this field for around two years, but if you talk about passion and inclination,
    then he has been around for a decade. In these two years or so, he has worked
    on a variety of game genres using multiple technologies along the way. He has
    worked on a couple of casual puzzle games, an endless runner, an endless casual
    game, a couple of card games (Rummy in Cocos2d-JS and an African game), and a
    physics simulation sample, and is currently working independently on his own game
    that will be hitting the stores soon. The game technologies that he is proficient
    in are Unity, Cocos 2D-X/JS, Construct, and Allegro. Gaming has always been one
    of his favorite hobbies, with sports, music, breakdancing, and a few more. Technology,
    gadgets, machines, and software have always fascinated him. He has always had
    the urge to learn more about the things that he likes, be it in the real world
    or in the virtual world, and to eventually. His favorite game genres are first-person
    shooters, platformers, and puzzlers. When he is not making or playing games, he
