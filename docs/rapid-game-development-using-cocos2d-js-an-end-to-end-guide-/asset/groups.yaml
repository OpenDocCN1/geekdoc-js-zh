    \n**图 8-1.** DrawNode 演示\n\n## 8.2 添加音乐和音效\n\n在 Cocos2d-js 中，可以使用单例对象 `cc.audioEngine`\
    \ 为游戏添加音乐和音效。音乐代表游戏中的长时间运行背景音，而音效代表玩家跳跃、收集硬币等快速声音。你必须小心你使用的音频格式，因为浏览器不支持某些格式。在游戏启动期间，你需要做的第一件事是在\
    \ App 的 `onStart` 方法中预加载声音文件：\n\n```\n1 cc.audioEngine.preloadMusic(s_music_background);\n\
    2 cc.audioEngine.preloadEffect(s_music_jump);\n```\n\n然后，你可以按照以下方式播放音乐和音效：\n\n\
    ```\n1 cc.audioEngine.playMusic(s_music_background, true);\n2 cc.audioEngine.playEffect(s_music_jump,\
    \ true);\n```\n\n第二个参数表示是否循环播放声音。你可以按照以下方式暂停、恢复和停止音乐及音效：\n\n```\n1 //暂停声音\n2 cc.audioEngine.pauseMusic();\n\
    3 cc.audioEngine.pauseEffect();\n4\n5 //恢复声音\n6 cc.audioEngine.resumeMusic();\n\
    7 cc.audioEngine.resumeEffect();\n8\n9 //倒回音乐\n10 cc.audioEngine.rewindMusic();\n\
    11\n12 //停止声音\n13 cc.audioEngine.stopMusic();\n14 cc.audioEngine.stopEffect();\n\
    ```\n\n对于音效，没有倒回选项，因为播放音乐和音效的结构是分开的，以提高系统效率。\n\n## 8.3 使用自定义着色器 (Shaders)\n\n\
    着色器负责渲染。着色器负责渲染整个游戏。着色器分为顶点着色器和片元着色器。Cocos2d-x 使用 `GLProgram` 类代表着色器实体。每个节点都有\
    \ `setShaderProgram` 和 `getShaderProgram` 函数来设置/获取该对象。让我们考虑采样顶点和片元着色器：\n\n```\n\
    //gray.vsh\nattribute vec4 a_position;\nattribute vec2 a_texcoord;\nattribute\
    \ vec4 a_color;\n\nvarying vec2 v_texcoord;\nvarying vec4 v_color;\n\nvoid main()\
    \ {\n    gl_Position = CC_MVPMatrix * a_position;\n    v_texcoord = a_texcoord;\n\
    \    v_color = a_color;\n}\n```\n\n```\n//gray.fsh\nvarying vec2 v_texcoord;\n\
    varying vec4 v_color;\nuniform sampler2D CC_texture;\n\nvoid main() {\n    gl_FragColor\
    \ = texture2D(CC_texture, v_texcoord) * v_color;\n}\n```\n\n自定义着色器用于在游戏中创建酷炫的效果。详细讨论它们不在本书的范畴之内。\n\
    \n## 8.4 运动轨迹 (Motion Trail)\n\n在 Cocos2d-js 中，轨迹效果可以通过名为 `MotionStreak` 的类来实现。轨迹效果是物体移动并在留下痕迹。让我们来看一个示例。首先，创建一个空层并在其中添加一个精灵：\n\
    \n```\nvar MotionTrailLayer = BaseLayer.extend({\n  sprite:null,\n  ctor:function\
    \ () {\n    this._super();\n\n    var size = cc.winSize;\n\n    this.sprite =\
    \ new cc.Sprite(res.Sprite_Image);\n    this.sprite.attr(\n      x: size.width\
    \ / 2,\n      y: 0\n    );\n    this.addChild(this.sprite, 2);\n\n    var action1\
    \ = cc.moveTo(5, cc.p(size.width / 2, size.height));\n    var action2 = action1.reverse();\n\
    \    var seq1 = new cc.Sequence(action1,action2);\n    this.sprite.runAction(seq1.repeatForever());\n\
    \n    this.tail = new cc.MotionStreak(2, 3, 50, cc.color.WHITE, res.\nTail);\n\
    \    this.tail.attr(\n      x: size.width / 2,\n      y: 0\n    );\n    this.addChild(this.tail);\n\
    \n    var seq2 = seq1.clone();\n    this.tail.runAction(seq2.repeatForever());\n\
    \n    return true;\n  }\n});\n```\n\n你将得到如图 8-2 所示的输出。\n\n"
