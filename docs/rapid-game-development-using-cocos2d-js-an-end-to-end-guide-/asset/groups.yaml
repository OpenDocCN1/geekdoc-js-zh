    # 7.9.10 Ratchet Joint


    The ratchet joint works like a socket wrench, where you have the body rotating
    in angular steps provided the initial angular offset, and phase is an angular
    step, which is the distance between the current and the next rotation steps.


    Let''s look at the syntax:


    ```

    var ratchet = new cp.ratchetJoint(body1, body2, offset, phase);

    ```


    The parameters are as follows:


    +   - offset - refers to the initial angular rotation of bodies


    +   - phase - refers to the distance between steps


