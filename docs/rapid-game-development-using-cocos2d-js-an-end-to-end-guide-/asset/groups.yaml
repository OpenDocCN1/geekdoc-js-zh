- md: "\n[content]\n# CHAPTER 5 ADDING A GUI\n\nAfter that, all the menu item instances\
    \ are created and added as children to this.Menu. The first menuItem is created\
    \ using a cc.Label instance, as shown here:\n\n```\nvar label-new = new cc.LabelTTF('MenuItem\
    \ with label',36);\nthis.MenuItem1 = new cc.MenuItemLabel(label,'onClicked',this);\n\
    ```\n\nThis is later positioned and added as child to this.Menu. The second MenuItem\
    \ is created using two images: normal and selected state images. See here:\n\n\
    ```\nthis.MenuItem2 = new cc.MenuItemImage(res.MenuItemImage_Normal, res.MenuItemImage_Selected,\
    \ null, 'onClicked', this);\n```\n\nLike in the previous example, LayerColor has\
    \ been added in this layer, so the output will look like Figure 5-2.\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_65_0.png)\n\
    \nFigure 5-2. MenuItem\n\n## 5.4 Other GUI Elements\n\nApart from modules and\
    \ labels, there are other GUI elements that are available in an extension module,\
    \ such as checkbox and button. In order to use extension classes, we need to add\
    \ the extension module to our project. In project.json, in the modules property,\
    \ add 'extension' to the array list:\n\n- \"modules\" : [\"cocos2d\",\"extensions\"\
    ],\n\nThese additional user interface elements are available under the parent\
    \ object ccui. Let's have a look. In the src folder, create a file otherudidemo.js\
    \ and copy the following code into it:\n\n```\nvar OtherUIDemoLayer = cc.Layer.extend({\n\
    \  sprite:null,\n  ctor:function () {\n    this._super();\n    var size = cc.winSize();\n\
    \    var colorLayer = new cc.LayerColor(cc.color(142,29,42));\n    this.addChild(colorLayer)\n\
    \    this.uiButton = new ccui.Button(res.ButtonImage,res.Button_Selected);\n \
    \   this.uiButton.attr({\n      x:size.width/2,\n      y:size.height/1.3\n   \
    \ });\n    this.addChild(this.uiButton)\n    this.uiCheckbox = new ccui.Checkbox(res.CheckBox_Normal,res.CheckBox_Selected);\n\
    \    this.uiCheckbox.attr({\n      x:size.width/2,\n      y:size.height/2\n  \
    \  });\n    this.addChild(this.uiCheckbox)\n    return true;\n  }\n});\n```\n\n\
    # CHAPTER 5 ADDING A GUI\n\nIn this, a button instance has been created with normal\
    \ and selected images:\n\n```\nthis.uiButton = new ccui.Button(res.ButtonImage,res.ButtonImage_Selected);\n\
    ```\n\nAnd a checkbox instance has been created, also using normal and selected\
    \ images:\n\n```\nthis.uiCheckBox = new ccui.Checkbox(res.Checkbox_Normal,res.Checkbox_Selected);\n\
    ```\n\nIf you run the preceding layer, the output will look like Figure 5-3.\n\
    \n![](img/c9248a93bcc9d1d0881a7269e1be3174_67_0.png)\n\nFigure 5-3. Other GUI\
    \ elements\n\n# CHAPTER 6\n\n## FUN WITH ANIMATION\n\n## 6.1 Introduction\n\n\
    Animation is essential to acquire any good game, as it makes your game animation\
    \ cool and visually appealing, and helps you to acquire more users. A visually\
    \ appealing game markets itself. Take a moment to look at the top-grossing games\
    \ in Google Play and App Store. Top games use crisp and detail-rich animations\
    \ to improve the user experience and to engage users. Take a deep breath, as we\
    \ are going to look at the details of the animation system in Cocos2d-js. Let's\
    \ begin.\n\n## 6.2 Actions\n\nActions are the construct that is used in Cocos2d-js\
    \ to animate a sprite. Actions change the properties of the sprite over time,\
    \ and that makes the sprite animate in the way we want. There are several types\
    \ of actions available with which to apply animations on sprites. Let's have a\
    \ look at a simple example:\n\n```\n1 var action = cc.moveBy(2, cc.p(size.width\
    \ - 40, size.height - 40));\n2 this.sprite.runAction(action);\n```\n\nIn this\
    \ example, the object is created using the cc.moveTo function. Any action can\
    \ be run on sprites using the runAction method. This method usually belongs to\
    \ cc.Node, beyond sprites, we can animate any objects that have cc.Node as a parent\
    \ or topmost parent (i.e., layers, scenes, etc.) Basically, there are two variations\
    \ in creating actions.\n\n### 6.2.1 By and To Actions\n\nThe preceding code is\
    \ an example of the By variation. Let's have a look at the same example with the\
    \ To:\n\n```\n1 var action = cc.moveTo(2, cc.p(size.width - 40, size.height -\
    \ 40));\n2 this.sprite.runAction(action);\n```\n\nThe only difference between\
    \ By and To actions is that To will animate the target property value to the absolute\
    \ value, and By will animate the target property value to the relative value (Example:\
    \ If you have a sprite at location (10,10) and you use the moveBy action to animate\
    \ with (10,10)).\n\n## 6.3 Available Actions\n\nThe following is a list of actions\
    \ that you can apply. The combinations include By and To.\n\n### 6.3.1 Move\n\n\
    This action is used to animate the x,y position:\n\n```\n1 var action = cc.moveBy(2,\
    \ cc.p(size.width - 40, size.height - 40));\n2 this.sprite.runAction(action);\n\
    ```\n\nThe first parameter is duration and the second is the target.\n\n### 6.3.2\
    \ Jump\n\nThis action is used to animate the node like jumping:\n\n```\n1 var\
    \ action = cc.Jump(2, cc.p(size.width - 40, size.height - 40), 50, 10);\n2 this.sprite.runAction(action);\n\
    ```\n\nThe first parameter is duration, the second is target, the third is height\
    \ and the fourth is number of jumps.\n\n### 6.3.3 Rotation\n\nThis action is used\
    \ to animate the rotation over time:\n\n```\n1 var action = cc.rotateBy(2, 90);\n\
    2 this.sprite.runAction(action);\n```\n\nThe first parameter is duration and the\
    \ second is the angle.\n\n### 6.3.4 Scale\n\nThis action is used to scale the\
    \ node:\n\n```\n1 var action = cc.scaleBy(2, 1.5);\n2 this.sprite.runAction(action);\n\
    ```\n\nThe first parameter is duration and the second is scale factor.\n\n###\
    \ 6.3.5 Skew\n\nThis action is similar to scale, but it uses skew values:\n\n\
    ```\n1 var action = cc.skewBy(2, 30);\n2 this.sprite.runAction(action);\n```\n\
    \nThe first parameter is duration and the second is skew angle.\n\n### 6.3.6 Tint\n\
    \nThis action is used to animate the RGB channel of the node:\n\n```\n1 var action\
    \ = cc.tintTo(2, 255, 255, 255);\n2 this.sprite.runAction(action);\n```\n\nThe\
    \ first parameter is duration and the next three are deltaR, deltaG, and deltaB.\n\
    \n### 6.3.7 Bezier\n\nThis action is used to move the target through a Bezier\
    \ curve:\n\n```\n1 var bezier = [[cc.p(0, windowSize.height / 2), cc.p(300, -windowSize.height\
    \ / 2), cc.p(300, 100)];\n2 var bezierForward = new cc.BezierBy(3, bezier);\n\
    3 var bezierTo = new cc.BezierTo(3, bezier);\n```\n\nThe first parameter is duration\
    \ and the second is an array that defines the Bezier curve.\n\n### 6.3.8 Cardinal\
    \ Spline\n\nThis is similar to Bezier. The target will move through a cardinal\
    \ spline curve:\n\n```\nvar action = cc.cardinalSplineTo(3, array, 0);\nvar action\
    \ = cc.cardinalSplineTo(3, array, 0);\n```\n\nParameters are the same as for Bezier;\
    \ however, it has a third parameter that represents tension.\n\n## 6.4 Easing\n\
    \nBy default, all actions that animate the properties of the node over time linearly\
    \ are called linear interpolation. Such an animation looks straightforward. When\
    \ you want to add organic effects to your animation, your animation needs an easing\
    \ function. See Figure 6-1.\n\n![](img/c9248a93bcc9d1d0881a7269e1be3174_71_0.png)\n\
    \nFigure 6-1. Linear and easing\n\nAs you can see, the first image is linear,\
    \ which all actions will use by default. The other three are different easing\
    \ functions. In Cocos2d-js, there are over 26 types of easing. For all easing\
    \ functions, the usage is the same. Let's see an example:\n\n```\nvar easing=cc.easeBackIn();\n\
    //or\nvar easing=new cc.EaseBackIn();\naction.easing(easing);\n```\n"
  mdcn: "\n[content]\n# 第 5 章 添加 GUI\n\n之后，所有的菜单项实例都已创建并作为子节点添加到 `this.Menu` 中。第一个\
