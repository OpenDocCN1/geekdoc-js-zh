    is the internal implementation of cc.Sprite.


    # 3.8 SpriteFrameCache with Sprites


    Similar to TextureCache, SpriteFrameCache is used to cache the SpriteFrame that
    is used by cc.Sprite. If you have a sprite sheet, individual SpriteFrames can
    be cached in SpriteFrameCache and used later whenever needed. This has been illustrated
    in the previous code samples and Figure 3-11.'
