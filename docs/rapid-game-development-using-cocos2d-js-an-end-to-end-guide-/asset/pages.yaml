    The repeat and repeatForever functions of sequence are used for this purpose.


    # 6.5.3 Action End Callback


    It is possible in a sequence object to attach an end callback function for each
    action.

    Let''s see an example:


    ```

    var seq=new cc.Sequence(action1,cc.callFunc(function(){/*action1 end callback*/}

