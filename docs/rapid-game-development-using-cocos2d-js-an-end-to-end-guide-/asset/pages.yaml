    the game finally passes through these shaders and is processed for rendering.
    Shaders are classified into vertex and fragment shaders. Vertex shaders process
    the vertex data of your node and pass the output to fragment shaders, which process
    the pixel color for the interpolated vertex data. Cocos2d-x uses shaders to do
    the rendering. GL shaders are'
