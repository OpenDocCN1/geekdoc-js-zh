  md: '# 1.6 Native Deployment


    Apart from the Web, you may also deploy your Cocos2d-js samples to native platforms.

    The Following is the command used for native deployment.


    ```

    cocos deploy [-h] [-s SRC_DIR] [-q] [-p PLATFORM] [-m MODE]\- [-h] is help.

    - [-s SRC_DIR] represents the source folder of Cocos2d-js project.

    - [-q] is quite mode.

    - [-p PLATFORM] represents the target platform (i.e., Android, iOS, etc.).

    - [-m MODE] represents mode of deployment (i.e., release, debug)

    ```


    # 1.6.1 Android Setup


    You can skip this if you already have the Android environment or if you don''t
    want to compile and deploy for Android.


    # 1.6.1.1 Steps


    +   * Install JDK from http://www.oracle.com/technetwork/java/javase/downloads/index.html.

    * Download Android Studio or SDK and NDK from https://developer.android.com/sdk/index.html.

    * Extract the SDK if you are not installing Android Studio.

    * Extract the NDK and place it in the root of SDK, making sure that SDK and NDK
    are in same root folder.

    * Install Apache ant from https://ant.apache.org/bindown.cgl.


    Run the following command in your local Cocos2d-js installation folder and provide
    the Android and NDK paths:


    ```

    python deploy.py

    ```


    To deploy your project to Android, run the following command from the project
    folder via the terminal:


    ```

    cocos deploy -p android -m release

    ```'
