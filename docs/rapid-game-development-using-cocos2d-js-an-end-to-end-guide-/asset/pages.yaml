  md: '# 8.2 Adding Music and Sound Effects


    In Cocos2d-js, music and sound effects can be added to the game by using the singleton
    object cc.audioEngine. Music represents the long-running background sound in your
    game, and sound effects represent quick sounds like the player jumping, collecting
    coins, etc. You have to be careful with which sound format you use, as browsers
    won''t support certain formats. The first thing you have to do during game startup
    is to pre-load your sound files during the onStart method of your app, js:


    ```

    1 cc.audioEngine.preloadMusic(s_music_background);

    2 cc.audioEngine.preloadEffect(s_music_jump);

    ```


    Then, you can play your music and sound effects as follows:


    ```

    1 cc.audioEngine.playMusic(s_music_background, true);

    2 cc.audioEngine.playEffect(s_music_jump, true);

    ```


    The second parameter represents whether to loop the sound or not. You can pause,
    resume, and stop your music and effects as follows:


    ```

    1 //Pause Sound

    2 cc.audioEngine.pauseMusic();

    3 cc.audioEngine.pauseEffect();

    4

    5 //Resume Sound

    6 cc.audioEngine.resumeMusic();

    7 cc.audioEngine.resumeEffect();

    8

    9 //Rewind Music

    10 cc.audioEngine.rewindMusic();

    11

    12 //Stop Sound

    13 cc.audioEngine.stopMusic();

    14 cc.audioEngine.stopEffect();

    ```


    For effects, there is no option to rewind, as the constructs for playing music
    and effects are separate so as to make the system efficient.


