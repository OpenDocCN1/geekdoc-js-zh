    # ## 7.9.2 Slide Joint


    Similar to a pin joint, two physics bodies can be connected through anchor points
    with a slide joint. The only difference here is that the distance between anchor
    points will vary between specified max and min lengths based on the physical simulation.
    That is, the distance between two anchor points can vary over time but cannot
    go below the mentioned min length and cannot go above the mentioned length.


