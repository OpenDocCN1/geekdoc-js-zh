  md: '![](img/c9248a93bcc9d1d0881a7269e1be3174_46_0.png)


    # 3.10.2 Pre-defined Resolution Policies


    There are five predefined policies offered by Cocos2d-js, which we will now discuss.


    # 3.10.2.1 SHOW_ALL


    This will scale up the container to the maximum size within the container bounds;
    all the contents in current scene will be visible.


    # 3.10.2.2 NO_BORDER


    This will scale up the container to fill the frame so that there won''t be any
    visible area in frame maintaining the proportion of provided width and height.


    # 3.10.2.3 EXACT_FIT


    This will scale the container to fit into the frame. Note that the provided width
    and height ratio won''t be maintained.


    # 3.10.2.4 FIXED_WIDTH


    This will scale the width of the container to match the width of the frame and
    scale the height to match the w/h ratio. You may see letter boxing, if w/h ratio
    won''t match.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# 3.10.2.5 FIXED_HEIGHT


    This will scale the height of the container to match the frame''s height and scale
    the width to match the w/h ratio. You may use pillar boxing, if w/h ratio won''t
    match.


    # 3.10.3 How to Use


    In the file main.js, there is a cc.game.onStart callback. You have to use the
    following line of code to set the resolution profile:


    ```

    cc.view.setDesignResolutionSize(320, 480, cc.RESOLUTION_POLICY.SHOW_ALL);

    ```


    The first two parameters are width and height, which is the aspect ratio of your
    game, and the third is the resolution policy.


    # 3.10.4 Custom Resolution Policies


    As we seen before, pre-defined policies are a combination of container and content
    strategy. For example, the SHOW_ALL policy is a combination of PROPORTION_TO_FRAME
    and SHOW_ALL, as follows:


    ```

    cc.RESOLUTION_POLICY.SHOW_ALL = new cc.ResolutionPolicy

    (cc.ContainerStrategy\)

    PROPORTION_TO_FRAME, cc.ContainerStrategy.SHOW_ALL);

    ```


    This is the internal implementation of SHOW_ALL. You can define your own policies
    with a combination of pre-defined container and content strategy.


    # 3.10.5 Pre-defined Container Strategies


    +   - cc.ContainerStrategy.EQUAL_TO_FRAME

    - cc.ContainerStrategy.PROPORTION_TO_FRAME

    - cc.ContainerStrategy.ORIGINAL_CONTAINER


    # 3.10.6 Pre-defined Content Strategies


    +   - cc.ContentStrategy.SHOW_ALL

    - cc.ContentStrategy.NO_BORDER

    - cc.ContentStrategy.EXACT_FIT

    - cc.ContentStrategy.FIXED_WIDTH

    - cc.ContentStrategy.FIXED_HEIGHT'
