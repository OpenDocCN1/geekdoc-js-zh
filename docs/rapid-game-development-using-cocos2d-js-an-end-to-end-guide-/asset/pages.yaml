  md: '# CHAPTER 2


    # Architecture Overview


    # 2.1 Engine Architecture


    Understanding the architecture of Cocos2d-js will give you a solid foundation
    for understanding the overall framework. This section will not cover the detailed
    architecture, which is beyond the scope of this book, but we will cover the necessary
    details that you need to be aware of in order to move forward. Cocos2d-js is a
    pure JavaScript-based game framework. You can compile it as a Web app and run
    in every browser; however, the API and object''s hierarchy are the same as for
    Cocos2d-x. So, with the help of JSB and SpiderMonkey, your JavaScript game code
    can be deployed as a native app that actually utilizes the core rendering pipeline
    of OpenGL/DirectX. Let''s have a look at the architecture in Figure 2-1.


    ![](img/c9248a93bcc9d1d0881a7269e1be3174_23_0.png)


    Figure 2-1. Cocos2d-js stack'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# CHAPTER 2 ARCHITECTURE OVERVIEW


    As you can see, if your app is browser based, your JavaScript game code will utilize
    the library from Cocos2d-js and can run like any other Web app. When you deploy
    this as native app using the Cocos2d console, your JavaScript code will be mapped
    to JavaScript bindings that actually point to native Cocos2d-x. Your JavaScript
    code will be converted to C by SpiderMonkey. So, Cocos2d-x will actually drive
    your JavaScript game.


    # 2.2 JSB


    As mentioned, JSB contains mapping between JavaScript and C++ APIs of Cocos2d-x,
    so when you choose to deploy your game as a native app, all of your API usage
    is mapped to actual C++ API calls with the help of SpiderMonkey. Note that only
    documented Cocos2d-js APIs can be mapped to native API calls. If you try to invoke
    any functions internal to Cocos2d-js that are not documented, the app will work
    out of the box in the browser, but when you deploy it as a native app you may
    not see the same result. It is recommended that you follow the documented APIs
    if you are planning to compile your game to any mobile platform.


    # 2.3 Object Hierarchy


    Cocos2d-js is based on object-oriented principles, so all the entities involved
    are considered classes and objects. Consider Figure 2-2.


    ![](img/c9248a93bcc9d1d0881a7269e1be3174_24_0.png)


    Figure 2-2. Object hierarchy'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Every class in Cocos2d-js, except for a few utilities, is inherited from cc.Node,
    from Scene and Layer to Sprites, all of which are instances of the Node object.
    Whenever you deal with any visible elements in Cocos2d-js, the topmost root object
    is cc.Node. So, most of the time you are dealing with a Node object. The derived
    objects will have their own behaviors and overrides based on their definitions
    and needs.


    # # 2.4 Deploy Options


    As you are working with a pure JavaScript library, there are many more options
    for deploying your app than just relying on the Cocos console.


    # ## 2.4.1 Deploy as Hybrid App


    This option is subjected to your game''s performance. If your game uses a heavy
    draw cycle, then this option is not recommended.


    # ## 2.4.2 Deploy using Titanium


    This option will enable you to deploy your app as a native app, but its feasibility
    may vary based on what you do in your games.


    # ## 2.4.3 Cocos Console


    This is the our recommended way to deploy your app to various platforms, but you
    can use other Cocos2d-x services such as SDKBOX, pluginX, and so on.'
  merge: -1
