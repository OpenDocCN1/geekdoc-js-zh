    # 7.9.7 Rotary Limit Joint


    A rotary limit joint constrains the relative rotation of two bodies, provided
    min and max angular limits. If bodyA and bodyB are linked with a rotary joint
    with min and max angles, the relative rotation of the two bodies will be such
    that the rotation angle won''t go below the min angle and won''t exceed the max
    angle for both bodies.


    Like in previous examples, initialize the Chipmunk space and add a circle, then
    link it with the static body through a slide joint. Now, apply a rotary limit
    between bodyA and bodyB:


    ```

    var rotaryLimitJoint = new cp.rotaryLimitJoint(bodyA, bodyB, -Math.PI/2,

    Mat\nH.PI/2);

    this.space.addConstraint(rotaryLimitJoint);",

    ```


    After bodyA and bodyB, the min and max angles are provided so that the relative
    rotation of both bodies will be in this range.'
