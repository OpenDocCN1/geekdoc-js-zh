  md: "# CHAPTER 1 GETTING STARTED\n\n# 1.3.2 Structure of project.json\n\nThis file\
    \ has meta information about your Cocos2d-js project. Let's have a look into the\
    \ json structure.\n\n```\n{\n  \"version\": \"1.0\",\n  \"name\": \"sampleproject1\"\
    ,\n  \"description\": \"sampleproject1\",\n  \"launch_path\": \"index.html\",\n\
    \  \"icons\": {\n    \"128\": \"/res/icon.png\"\n  },\n  \"developer\": {\n  \
    \  \"name\": \"cocos2d-html5\",\n    \"url\": \"http://cocos2d-x.org/\"\n  },\n\
    \  \"default_locale\": \"en\",\n  \"installs_allowed_from\": [\n    \"*\"\n  ],\n\
    \  \"orientation\": \"portrait-primary\",\n  \"fullscreen\": \"true\"\n}\n```\n\
    \n+   - version - your application version\n- name - name of your application\n\
    - description - the description of your application\n- launch_path - the startup\
    \ HTML file for Cocos2d-js; used by the Cocos console when deploying/debugging\
    \ your application as a Web app\n- icons - application icons of various sizes;\
    \ used by the Cocos console during native deployment\n- developer - information\
    \ about the developer of the application\n- default_locale - default localization\
    \ setting for your application; represents which language to use by default\n\
    - orientation - orientation profile to support\n- fullscreen - used when deployed\
    \ to native platforms\n\n4"
  merge: -1
