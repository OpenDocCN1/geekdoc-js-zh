  md: "# 1.3.3 Code\n\nIf you open main.js, you will see the following code.\n\n```\n\
    cc.game.onStart = function() {\n    //If referenced loading.js, please remove\
    \ it\n    if(cc.ss.isNative && document.getElementById(\"cocosLoading\")) 4\n\n\
    \        document.body.removeChild(document.getElementById(\"cocosLoading\\));\n\
    \n    // Pass to enable retina display, display by default to improve performance\n\
    \    cc.view.enableRetina(false);\n    // Adjust viewport meta\n    cc.view.adjustViewport(true);\n\
    \    // Set up the resolution policy and design resolution size\n    cc.view.setDesignSize(800,\
    \ 450, cc.resolutionPolicy);\n    SHOW_ALL();\n    // The game will be resized\
    \ when browser size changes\n    cc.view.resizeWithBrowser(true);\n    //load\
    \ resources\n    cc.LoaderScene.preload(g_resources, function () {\n        cc.director.runScene(new\
    \ HelloWorldScene());\n    });\ncc.game.run();\n```\n\nThe Cocos2d-engine will\
    \ begin by executing the onStart function, which has code to kickoff your game.\
    \ There are a few configuration-related things going on in the preceding code\
    \ that will be explained in later chapters. For now, we will focus on the cc.LoaderScene\
    \ part.\n\n```\ncc.LoaderScene.preload(g_resources, function () {\n    cc.director.runScene(new\
    \ HelloWorldScene());\n});\n```\n\nThe preceding code loads the \"Hello World\"\
    \ scene. cc director is the single controller instance for your game. The purpose\
    \ of this director is to guide your game through execution, loading and unloading\
    \ the scene and getting information about the game-execution environment, as screen\
    \ size and so on. in the director uses the runScene function to load the HelloWorldScene,\
    \ which is loaded inside preload. preload loads the resources specified in g_resources\
    \ in the Cocos cache, and once the resources have been loaded, a callback function\
    \ is executed that has the code to load the HelloWorldScene."
  merge: -1
