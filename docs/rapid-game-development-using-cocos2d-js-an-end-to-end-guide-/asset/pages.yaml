    # 3.10 Resolution Policies


    Resolution policies are about adapting your game to different screen resolutions
    and profiles. Cocos2d-js offers sets of resolution policies with which to adapt
    your games. Without these, you have to manually scale up or down the content of
    your game based on the screen resolution.


    There are two types of resolution policies: pre-defined policies and custom policies.
    Pre-defined policies are offered by Cocos2d-js and are composed of various combinations
    of container and content strategies; they are supported in native deployments
    as well. With custom policies, you can define your own resolution policies with
    the combination of available containers and content strategies, but custom policies
    are supported only in Web deployments. Let''s have a look.


    34'
