  md: '# 6.8 Sprite Frame Animation


    In Chapter 3, we saw how sprite frame animation can be done using sprite sheets.
    That chapter was more focused on sprites, while this section will provide a detailed
    explanation of it from the animation side. Each and every image part in a sprite
    can be classified using SpriteFrame with rect coordinates. The Animation class
    can be used to perform a sprite frame animation sequence on a sprite. Let''s see
    an example:


    ```

    1 var animation = new cc.Animation(spriteFrames, 0.08);

    2 this.sprite.runAction(cc.animate(animation).repeatForever()); // or new

    3 cc.Animation().patten can be used.

    ```


    The first parameter is an array of cc.SpriteFrame instances, and the second is
    the delay. Like the Action class, this also has repeat and repeatForever functions.


