  md: "# CHAPTER 1 GETTING STARTED\n\nLet's have look at HelloWorldScene and HelloWorldLayer.Open\
    \ app.js inside src.\nat the bottom of app.js you will see code like this:\n\n\
    ```\nvar HelloWorldScene = cc.Scene.scene(\nonEnter:function () {\n    this._super();\n\
    \    var layer = new HelloWorldLayer();\n    this.addChild(layer);\n});\n```\n\
    \nA scene is told to run by invoking the onEnter function, and HelloWorldLayer\
    \ is injected as a child of the scene.\nWe are going to modify HelloWorldLayer\
    \ to make things simple.\n\n```\nvar HelloWorldLayer = cc.layer.extend({\nsprite:null,\n\
    ctor:function () {\n    this._super();\n    var size = cc.size;\n    var helloworld\
    \ = new cc.LabelTTF(\"Hello World\", \"Arial\", 38);\n    // position the label\
    \ on the center of the screen\n    helloworld.x = size.width / 2;\n    helloworld.y\
    \ = size.height / 2 + 200;\n    // add the label as a child to this layer\n  \
    \  this.addChild(helloworld, 5);\n\n    // \"Hello World\" splash screen\n   \
    \ this.sprite = new cc.Sprite(res.HelloWorld_png);\nthis.sprite.attr({\n    x:\
    \ size.width / 2,\n    y: size.height / 2\n});\n    this.addChild(this.sprite,\
    \ 0);\n    return true;\n});\n```\n\nThis layer has two children; one is cc.LabelTTF,\
    \ which has \"Hello World\" as text, and the other is HelloWorld.png sprite. Throughout\
    \ this book, we are going to use portrait resolution screen. So, in main.js, you\
    \ should change the following line:\n\n```\n//This is landscape\ncc.view.setResolutionSize(800,\
    \ 450, cc.ResolutionPolicy.SHOW_ALL);\n```"
