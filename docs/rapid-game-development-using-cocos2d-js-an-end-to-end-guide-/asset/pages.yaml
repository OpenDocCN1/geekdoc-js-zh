    # # 7.9.6 Damped Rotary Spring


    This is similar to the damped spring, the only difference being that it works
    in an angular fashion. Instead of connecting two bodies with anchor points, two
    bodies will be linked though a relative angle at which the bodies want to; stiffness
    and damping determine the position of the bodies at any time.


    Like in previous examples, set up the Chipmunk space, add a circle, and establish
    a slide joint between the circle and static body, then add a damped rotary spring:


    ```

    var dampedRotarySpring = new cp.DampedRotarySpring(bodyA, bodyB, 0, 25, 0.6);

    this.space.addConstraint(dampedRotarySpring);

    ```


    Here, the parameters are bodyA, bodyB, restAngle, stiffness, and damping: refer
    to the previous example for parameter descriptions.'
