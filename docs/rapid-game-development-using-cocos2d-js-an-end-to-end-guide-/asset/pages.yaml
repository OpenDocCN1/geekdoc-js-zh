- img_proc: true
  md: "Physics simulation happens inside the Chipmunk space, where the physics body\
    \ gets physics properties set; those bodies will shapes defined, which can be\
    \ a box or circle or polygon. Every Chipmunk space will have a default staticBody\
    \ as its child, and shapes added to it will not be affected by physical properties\
    \ and will be static objects like walls or obstacles, etc. All the bodies will\
    \ be associated with PhysicsSprite, with its sprite location and rotation will\
    \ be determined by the physics body associated with it. In the upcoming example,\
    \ we are going to create a Chipmunk space, add walls to the four boundaries, and\
