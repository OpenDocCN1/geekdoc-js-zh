    # 1.4 Running "Hello World"


    Make things simple, throughout this book we are going to run all the code in a
    Web browser. However, deploying it on a device as a native app is your choice.
    To run this sample type, navigate to the project path in the terminal and type
    the following command:


    +   - cocos run -p web


    This will launch the app in the browser; however, you can launch the app in Android,
