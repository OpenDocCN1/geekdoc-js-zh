  md: '# 7.9.9 Gear Joint


    A gear joint is similar to motor, but a gear joint won''t introduce the angular
    velocity by itself. Because the angular velocity of one body depends upon the
    other, the velocity depends on the ratio provided. Let''s look at an example.


    First, initialize the Chipmunk space and attach two boxes by a pivot joint to
    the static body, in previous examples. Add a third body, which is going to be
    bound with bodyB via a gear joint:


    ```

    var bodyA = this.addPhysicsBox(cc.p(cc.winSize.width * 0.25,

    cc.winSize.height * 0.5));

    var bodyB = this.addPhysicsBox(cc.p(cc.winSize.width * 0.75,

    cc.winSize.height * 0.5));

    var bodyC = this.addPhysicsBox(cc.p(cc.winSize.width * 0.5,

    cc.winSize.height * 0.3));

    var staticBody=this.space.staticBody;

    this.space.addConstraint(new cp.PivotJoint(bodyA, staticBody,

    cc.p(cc.winSize.width * 0.25, cc.winSize.height * 0.5)));

    this.space.addConstraint(new cp.PivotJoint(bodyB, staticBody,

    cc.p(cc.winSize.width * 0.75, cc.winSize.height * 0.5)));

    this.space.addConstraint(new cp.PivotJoint(bodyC, staticBody,

    cc.p(cc.winSize.width * 0.5, cc.winSize.height * 0.3)));

    ```


    Then, apply simple motor to bodyA and bodyB to introduce constant angular velocity:


    ```

    var gearJoint = new cp.GearJoint(bodyB, bodyC, 0, 2);

    this.space.addConstraint(gearJoint);

    ```


    Then, apply a gear joint to bodyB and bodyC so that the bodyC rotation upon bodyB''s
    angular velocity:


    ```

    var gearJoint = new cp.GearJoint(bodyB, bodyC, 0, 2);

    this.space.addConstraint(gearJoint);

    ```


    The last two parameters are:


    +   - offset - initial angular offset for two bodies

    - ratio - ratio that velocity needs to maintain; in this case, velocity of bodyC
    is twice as slow as bodyB.'
