    # CREATING A DELICIOUS USER WIDGET BY RECEIVING JSONP DATA FROM API REQUESTS


    Delicious (www.delicious.com), shown in Figure 9-16, is a social bookmarking site
    for sharing and discovering Web bookmarks. It lets you bookmark your favorite
    sites and see what others are bookmarking. Delicious was started in September
    2003 and was sold to Yahoo!. The Web site has more than 5.3 million users and
    bookmarked URLs. I have been using Delicious for a few years to keep track of
    useful links. It lets you access your bookmarks from any computer with Internet
    access, and it''s also a good place to post your own projects to gain access to
    more traffic and popularity. Delicious offers various browser plugins-that make
    it incredibly easy to save favorite bookmarks without visiting the Delicious Web
    site. This is one of the reasons the application is popular.'
