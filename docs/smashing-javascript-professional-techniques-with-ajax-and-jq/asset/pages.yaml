  md: '# PART IV: EXPLORING ADVANCED JQUERY


    # HOW TO DISTRIBUTE A JQUERY PLUGIN-IN


    When you are ready to distribute your plug-in, you have quite a few things to
    keep in mind. Here is a quick checklist that is useful to go through before releasing
    your plug-in to the wild!


    +   * Test that the plug-in works on all browsers — IE6, IE7, IE8, Firefox, Safari,
    Chrome, and Opera.

    * Create documentation that explains the options and how to use your plug-in.

    * Add an open source license from the open source initiative Web site (www.opensource.org/licenses/index.html)
    if you wish to make your plug-in open source.


    # PACKAGING YOUR JQUERY PLUGIN-IN FOR DISTRIBUTION


    Be sure your plugin code is ready for production environments. To do so, you can
    use a minification service like Douglas Crockford''s JavaScript Packer (http://jscompress.com/),
    shown in Figure 10-23, to minify your plug-code. Minification is a technique used
    to remove unnecessary characters such as comments, line breaks, white space, and
    tabs to improve loading times. It''s always a good idea to offer both development
    (uncompressed) and production (minified) versions of your plug-in. If your plug-in
    is small (under 4 KB), you don''t have to minify it, but I would get in the habit
    nonetheless.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_295_0.png)


    Figure 10-23: Douglas Crockford has created a minifier script


    JSMin algorithm by Douglas Crockford | Packer method by Dean Edwards | JavaScript
    compression tool/service created by Vance Lucas'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# SUBMITTING YOUR PLUG-IN TO WEB SITES


    You can submit your plug-in to a few sites to help ensure its success and distribution
    to the open source community. If you are releasing your plug-in as open source,
    I would highly suggest that you post it to these locations:


    +   - The jQuery Plug-in section (http://plugins.jquery.com/): The jQuery official
    site offers a wiki where plug-in developers can submit their code. You can upload
    your code either through the browser or by using version-control software such
    as Subversion or Git. Here you can add a name and description, respond to bugs,
    receive ratings from the community, post links to your documentation, and so on.


    +   - Project Hosting on Google code (http://code.google.com/hosting/): Google
    project hosting is very similar to the jQuery plug-in section, offering many of
    the same benefits. The biggest benefit is that it''s Google and therefore gets
    a lot of traffic.'
