    # # SUBMITTING FORMS USING GET AND POST


    GET and POST requests are very similar; they can transmit data from a page to
    a server-side process. Each type of request has its pros and cons, but usually
    the backend developer defines the type of request and the Web developer or designer
    is required to interface with it.


    # Understanding GET Requests


    GET requests submit data to a server-side process by passing parameters in the
    query string. A query string is used to pass form data from one Web page or to
    another Web page. The server-side process always picks up the `key=value` pairs
    from the URL and the content of the page is altered by the query string in the
    URL directly.


    Here’s an example of a query string:


    ```

    http://www.website.com/keyword?productspage&size=5&category=books

    ```


    By passing parameters in the query string, the result is that the query string
    can be easily changed by a user. If the proper security precautions are not set
    up on the server-side script, hackers can infiltrate and cause havoc to your Web
    site or application. Using GET requests is not recommended for unsafe data such
    as financial information or passwords or data you wish to be passed around or
    shown to users. GET requests can be bookmarked or shared, as shown in Figure 9-6,
    a Google search results page.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# PART IV: EXPLORING ADVANCED JQUERY


    query forms - Google Search


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_233_0.png)


    Figure 9-6: search results that we use a GET request

    Reproduced from 2010/06/ Google


    # Understanding POST Requests


    POST requests are different from GET requests in that they post the data to the
    server-side process behind the scenes, which makes them safer, especially for
    transmitting sensitive data. POST requests can also handle long requests when
    passing lots of data to the server-side program better than GET requests.


    If you have submitted a POST request and tried to refresh the page, you would
    find out how the page needs to resend the data to the server. This is a result
    of the way POST requests are structured.


    POST and GET requests are handled in jQuery using the ajax() method. This method
    can be passed many different settings to control what is sent to the server and
    what is received.


    ```

    $.ajax ({

    type: ''POST'',

    url: url,

    data: data,

    sccess: success,

    datype: dataType

    });

    ```


    If you were to write this method in native JavaScript, you would end up with something
    similar to the following code. You would need to write different XMLHttpRequest
    methods for different browsers. jQuery handles all of this in one nice, clean
    function.'
