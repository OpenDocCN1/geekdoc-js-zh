  md: '# PART I: INTRODUCING QUERY AND JAVCRIPT


    Same JavaScript with Less Code

    jQuery is JavaScript: Everything you can do in JavaScript, you can also do in
    jQuery. The possibilities are endless. What I love jQuery is that it gives you
    a base you can build on, but you''re not limited by what jQuery offers. When you''re
    using jQuery, you have three options when coding:


    +   - Use the extensive jQuery API

    - Use or create a jQuery plug-in

    - Write regular JavaScript


    Another benefit of jQuery is the brevity of the code. If I want to change the
    background color in JavaScript, the code looks like this:


    ```

    document.getElementById(''mydiv'').style.backgroundColor = ''red'';",

    ```


    By using the powerful selection engine, jQuery needs only one shorter line to
    achieve the same:


    ```

    $$(''#mydiv'').css(''background-color'', ''red'');

    ```


    The syntax is easier to understand than JavaScript and was created with Web designers
    in mind. When you compare this to other libraries like Prototype or YUI, you can
    see why jQuery has become the choice for many Web professionals. The selector
    engine is the most prominent and loved feature of the jQuery library. It allows
    you to use CSS2 selectors, which makes it incredibly easy for Web designers with
    CSS knowledge to pick up.


    # Chaining


    One of jQuery''s greatest features is chaining, which allows you to chain multiple
    methods after the other. This helps to keep your amount of code smaller and therefore
    improves the speed with which your jQuery code is retrieved from the Web server
    and executed.


    Here''s an example of jQuery code that uses chaining:


    ```

    $(''#foo'').addClass(''active'').prev().removeClass(''active'');

    ```


    Here''s an example that doesn''t use chaining:


    ```

    $(''#foo'').addClass(''active'');

    ```


    ```

    $(''#foo'').next().removeClass(''.active'');

    ```


    The example that uses chaining is a cleaner and more concise way to write jQuery.
    I use chaining in my code examples throughout the book.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_25_0.png)'
  merge: -1
