  md: '# 4


    # WORKING WITH EVENTS


    WORKING WITH EVENTS in jQuery is very similar to working with CSS in HTML. The
    events are separated from the elements that they are being attached to. In native
    JavaScript, all of the events are embedded directly into the HTML, which makes
    it a chore to maintain any custom events and makes it easier to screw something
    up. You have all of these functions in an external file, but they are added to
    the elements as inline JavaScript, so if something changes in one element, it
    has to be updated in all of the elements. With jQuery, all of the element selection
    and event handling is done outside of the DOM in a JavaScript file.


    jQuery supports all of the native JavaScript events, but makes it much easier
    to integrate into your Web sites and applications. In this chapter, I review the
    events that are available to you through the jQuery API, show you each event and
    how it works, and then walk you through a few real-world scenarios.'
  merge: -1
