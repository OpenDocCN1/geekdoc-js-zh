  md: "# PART III: APPLYING QUERY TO YOUR WEB SITE\n\nPagination is frequently set\
    \ up using server-side programming languages like PHP, ASP.NET and Java. The major\
    \ benefit of using a server-side solution is the Web page doesn't need to load\
    \ all of the records at once; they are loaded only when the user requests them.\
    \ You can use jQuery to set pagination, but I recommend doing it only results\
    \ that aren't heavy-loading (where there are more than 100 results), which could\
    \ weigh the page loading time down considerably.\n\nIf your skills are advanced\
    \ enough, you can build jQuery that loads only 10 results, and each time a page\
    \ is clicked, that content is loaded via Ajax and inserted into the current page.\n\
    \nIn the following pagination example, I explain how you can paginate a collection\
    \ of table rows with a few lines of jQuery. The script automatically paginate\
    \ the records that you pass into the selectors and also creates a navigation menu\
    \ underneath that shows all of the pages active. When you click on a page, the\
    \ page number stays to let the user know which page they are on.\n\n+   1. Before\
    \ you add pagination, you need some data to paginate. In this example, I use a\
    \ table, but you could use anything from an unordered list to a group of divs.\
    \ In the following HTML, 12 rows are set up:\n\n```\n<table border=\"0\" cellspacing=\"\
    0\" id=\"data\">\n<tr>\n  <td>1</td>\n  <td>Clothing</td>\n  <td>North Face Jacket</td>\n\
    \  <td>$189.99</td>\n  <td>In-stock</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>Shoes</td>\n\
    \  <td>Nike</td>\n  <td>$59.99</td>\n  <td>In-stock</td>\n</tr>\n<tr>\n  <td>3</td>\n\
    \  <td>Electronics</td>\n  <td>LED TV</td>\n  <td>$589.99</td>\n  <td>Out of stock</td>\n\
    </tr>\n<tr>\n  <td>4</td>\n  <td>Sporting Goods</td>\n  <td>Ping Golf Clubs</td>\n\
    \  <td>$159.99</td>\n  <td>In-stock</td>\n</tr>\n<tr>\n  <td>5</td>\n</tr>\n```\n\
    \n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_179_0.png)"
