  md: '# FOCUSING ON AN INPUT BOX AFTER PAGE LOAD


    Driving focus to a particular form field on a page is a great way to direct users
    to perform a specific action on a page, whether it''s logging in or filling out
    a registration. It''s a simple script you can add to any page to ensure that the
    user is focused on the input right away, as shown in Figure 8-1. If you have a
    conversion-based ecommerce or Retail Site, this could potentially give you a small
    boost in conversion rates.


    +   1. Set up the HTML form elements. For this example, set up two form input="text"
    elements so that you can demonstrate using the :first filter when more than two
    elements are present on the page.


    ```

    ```

    <input type="text1">

    <input type="text2">

    ```

    ```


    +   2. Add a statement that selects the first input and attaches the focus event
    to it. This ensures that when the page loads, the first input has focus applied
    to it:


    ```

    ```

    $(''first'').focus();

    ```

    ```


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_193_0.png)


    Figure 8-1: The focus is applied to the first input element after the page is
    loaded in Firefox


