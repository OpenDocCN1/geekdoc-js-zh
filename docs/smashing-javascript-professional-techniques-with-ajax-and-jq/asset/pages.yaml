  md: "Alternatively, you can include your jQuery library at the bottom of the page.\
    \ This can sometimes increase the speed at which your page loads because the JavaScript\
    \ doesn't get hung up loading at the top while the page continues to load. Also,\
    \ this this way, the entire DOM is guaranteed to load before the JavaScript is\
    \ applied.\n\n```\n<html>\n<head>\n<title>My jQuery Example</title>\n<link href=\"\
    css/global.css\"/>\n</head>\n<body>\n  <h1>Hello jQuery!</h1>\n  <div id=\"page-container\"\
    >\n    <p>You can place your jquery at the end of the page too!</p>\n  </div>\n\
    \  <script src=\"js/jquery.js\" type=\"javascript\"></script>\n  <script type=\"\
    text/javascript\">\n    // script goes here\n  </script>\n</body>\n</html>\n```\n\
    \nIf you are using the Google-hosted version of the jQuery include, instead of\
    \ including a relative path, insert the direct path to the library provided by\
    \ Google:\n\n```\n<html>\n<head>\n<title>My jQuery Example</title>\n<link href=\"\
    css/global.css\"/>\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.4.2/jquery.min.js\"\
    \ type=\"javascript\"></script>\n<script type=\"text/javascript\">\n    // script\
    \ goes here\n  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n# UNDERSTANDING\
    \ THE QUERY WRAPPER\n\nBefore you get started programming with jQuery, you need\
    \ to understand what the jQuery wrapper is and how it applies to the DOM. A wrapper,\
    \ in most programming languages, is something that wraps something else to extend\
    \ the functionality, most often an object. To put this in perspective, the jQuery\
    \ wrapper attaches itself to the DOM using selectors and allows you to extend\
    \ the DOM. jQuery doesn't actually offer any new methods; it just takes methods\
    \ that already exist in native JavaScript and makes them much easier to interact\
    \ with."
