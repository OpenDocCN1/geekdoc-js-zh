  md: '# PART IV: EXPLORING ADVANCED JOUERY


    Appcelerator Titanium Mobile has the following features:


    +   - Lets you match the native user interface to create an application that feels
    familiar to the users

    - Multimedia support for photo, music, and video streaming on the actual device

    - Local file storage to access and store files on the device to speed up the performance
    of the application and offer an application that can be used without an Internet
    connection

    - Access a mobile device''s camera and video camera to create interactive applications

    - Geolocation to create applications that use your location through GPS on the
    mobile phone to offer an extended user experience

    - HTML5 and CSS3 support


    You can obtain the full list by going to www.appcelerator.com/products/titanium-mobile-application-development/.
    At the time of this writing (early of 2010), Appcelerator is personally responsible
    for 4,900 apps and boosts a support community of more than 75,000 developers.
    Part of the reason Appcelerator''s success is that it''s an open-source project,
    which makes it really easy for Web Designers with no hardcore programming knowledge
    to create applications using technology that they use every day.


    Appcelerator Titanium Mobile is not meant for absolute beginners, but Appcelerator
    does offer support and has great online documentation to help you get started.


    # WORKING WITH THE JTOUCH PLUG-IN


    jTouch is an open-source jQuery plug-in that allows you to create an iPhone application
    that mimics native native functionality such as animations, navigation, and themes
    as shown in Figure 11-13. jTouch allows for this functionality by way of HTML,
    CSS, and jQuery.


    jTouch was recently purchased by Sencha and has since been rolled into an application
    called Sencha Touch (shown in Figure 11-14), which is an HTML5 mobile app framework
    that allows you to build Web apps for Apple iOS and Google Android.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_309_0.png)'
