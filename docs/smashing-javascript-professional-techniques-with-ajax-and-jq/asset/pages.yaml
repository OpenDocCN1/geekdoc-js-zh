  md: "```\n$('#status').bind({\n  keypress : function() {\n  }\n});\n```\n\n5. After\
    \ the keyup fires, I need to capture the value of the status input field. I have\
    \ set up a variable named inputText that stores this value. I have set another\
    \ variable called numChar that stores the length of the inputText variable. I\
    \ then create a variable called charRemain that holds the result of subtracting\
    \ numChar from maxNum.\n\n```\n$('#status').bind({\n  keypress : function() {\n\
    \  var inputText = $(this).val();\n  var numChar = inputText.length;\n  var charRemain\
    \ = numChar - maxNum;\n  }\n});\n```\n\n6. After setting up all the variables,\
    \ I need to add a conditional statement using a comparison operator to check if\
    \ the value of numChar is less than or equal to maxNum. If the expression returns\
    \ true, I select the counter element and change the text to the charRemain (number\
    \ of remaining characters).\n\n```\n$('#status').bind({\n  keypress : function()\
    \ {\n  var inputText = $(this).val();\n  var numChar = inputText.length;\n  var\
    \ charRemain = numChar - maxNum;\n  if (numChar <= maxNum) {\n    $('.counter').text(charRemain);\n\
    \  }\n  }\n});\n```\n\n7. Finally, you need to add an else statement that checks\
    \ if the maxNum is greater than numChar. If this expression returns true, prevent\
    \ the user from typing any more letters into the text field using event.preventDefault().\
    \ event.preventDefault() is equivalent to the native JavaScript statement return\
    \ false, which prevents the event from occurring.\n\n```\n$('#status').bind({\n\
    \  keypress : function() {\n  var inputText = $(this).val();\n  var numChar =\
    \ inputText.length;\n  var charRemain = numChar - maxNum;\n  if (numChar <= maxNum)\
    \ {\n    $('.counter').text(charRemain);\n  }\n  else if (numChar > maxNum) {\n\
    \    event.preventDefault();\n  }\n  }\n});\n```"
