    # Selecting Elements by Class


    Similar to selecting by ID, you can also select elements in your page by class
    (.class). The class selector uses the native JavaScript method getElementsByClassName().
    The class selects all elements of the given class in the DOM. If you want to select
    a class using the native JavaScript method getElementsByClassName(), the code
