  md: '# CAPTURING FORM EVENTS


    Similar to mouse-initiated events use the bind handler attachment, you can also
    use the bind method to attach event handlers to form events. Forms are especially
    common across Web sites and applications. You can find them on every application,
    used, for anything from a basic search to a full-blown three-step registration
    form. In some cases, longer forms that ask the user for lists of information can
    be daunting to fill out and create hard-to-clean-up data. jQuery events lend a
    hand in triggering actions, such as form validation when a user leaves a field
    or alerting the user that a certain field needs attention. Form events can enhance
    the user experience in many ways.


    jQuery offers a handful of form events, which are common events also found in
    native JavaScript, to help enhance the experience your users encounter when filling
    out a form. Table 4.3 summarizes each form event and its function.


    # Table 4.3 Names and Functions of the jQuery Form Events


    | Form Event Name | Form Event Function |

    |---|---|

    | change() | Triggers when you make a change inside of a field |

    | focus() | Triggers when you tab into or select a text field |

    | focusin() | Triggers when you tab into or select a text field contained within
    an element |

    | focusout() | Triggers when a text field or text area loses focus to another
    element contained outside the element |

    | blur() | Triggers when a text field or text area loses focus to another element
    |

    | select() | Triggers when text within an element is selected |

    | submit() | Triggers when the form is submitted, either by clicking a Submit
    button or pressing Enter on keyboard |

    | reset() | Triggers when the form is reset using the input type="reset"


    # ADDING A BORDER TO A FORM FIELD WHEN THE USER ADDS FOCUS


    The focus event is used to guide your users through fields in a form. The focus
    event fires when there is focus on an element, usually a form field. After the
    user starts typing, you can run a function to execute using the callback from
    the focus event.


    In the following example, I show you how to set up a focus event that adds a CSS
    border to a form field when a user clicks into it. This is helpful to notify users
    when they are presented with a Web page with many form fields. It helps to notify
    the user field they are currently filling out.


    +   1. The first step involves setting up the HTML. Set an input field and give
    it an ID of firstName.\n2. Create a selector statement that matches the "container"
    element and binds the focus event to the event handler.


    ```

    <input type="text" name="firstName" id="first-name"/>

    ```'
