    # ENHANCING FORMS WITH PLUG-INS


    Incorporating third-party or open source plug-ins into your Web site or application
    allows you to code faster and offer better form validation Due to the large community
    of followers and supporters who work with jQuery, a wide range of plug-ins exists.
    You can find plug-ins that do anything from setting default text on a field to
    validating every form on your site.


    I use plug-ins when creating something myself is not an option due to a limited
    timeframe. In most cases, if someone has already done a good job of creating a
    plug-in, it is unnecessary to try to write my own way. In this section, I review
    two plug-ins that I frequently use with forms: qTip and Validate.


    # INCORPORATING QTIP INTO YOUR WEB SITE


    qTip is a jQuery plugin that allows you to easily set up tooltips on any element.
    The tooltips can contain both static and dynamic content. qTip has many features
    that make it extremely attractive and lightweight plug-in as cross-browser compatibility
    with IE, Firefox, Safari, Opera, and Chrome. On those browsers that aren''t supported,
    the tooltip degrades gracefully. qTip can be applied to any element on the page,
    including paragraph tags, as shown in Figure 8-16.'
