    \ for moving messages around, and auto-completion to the field of an e-mail message.\
    \ Gmail is another great example of Ajax being used to its fullest capacity as\
    \ shown in Figure 9-2.\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_226_0.png)\n\
    \nFigure 9-2: XHR requests in Gmail shown in Firebug\nReproduced from 2010 Google\n\
    \n# LOADING DYNAMIC CONTENT FROM A WEB PAGE\n\nYou can use the jQuery load to\
    \ include HTML content from another location on your Web server into your Current\
    \ Web page. The load method takes the URL of the content as an argument passed\
    \ to the method. The URL needs to be set up as relative path from the page where\
    \ you are referencing it. The load method only allows you to include content that\
    \ lives on the same server or domain.\n\nIf you would like to include content\
    \ from another domain, you need to set up a JSON-P request with a Web service,\
    \ API, or Web server that can support JSON-P, which I review in the chapter.\n\
    \nIf you would load something to occur after or only if the content has been loaded,\
    \ you can provide a callback function to the load method either as an anonymous\
    \ function or a function name:\n\n```\n$(selector).load(URL, function() {\n  alert('The\
    \ content was loaded');\n});\n```"
