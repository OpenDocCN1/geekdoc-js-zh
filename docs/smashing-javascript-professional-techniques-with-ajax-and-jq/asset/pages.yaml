    ### Personal Life


    Jonathan Davis (born April 10, 1970), better known by his name Q. Tin, is an American
    hip hop artist, singer, and occasional actor from Queens, New York City; perhaps
    best known as part of the critically acclaimed group A Tribe Called Quest.


    Q-Tip was born in Harlem, New York. He attended Midtown High High School in Manhattan,
    New York. He moved to Los Angeles in the mid-1990s and changed his name to Carl
    (James) Field. The Q-Tip name stands for "Cool Tip," a New York City slang which
    refers to head. On Marcus Stewart was his childhood nickname because he was skinny
    and had bad hair.


