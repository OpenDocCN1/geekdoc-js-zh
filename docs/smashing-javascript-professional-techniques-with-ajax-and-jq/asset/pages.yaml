    # CREATING A NEWS FEED TICKER WITH MULTIPLE EFFECTS


    With the increasing appeal of being able to reach a broader audience by delivering
    news content through RSS (Really Simple Syndication) feeds, news tickers, and
    widgets has become much more common. News tickers can be anything from a box of
    10 news articles that gets refreshed whenever the page is reloaded, to more advanced
    news tickers that show real-time updates as the Google Real Time Search Engine,
    as seen in Figure 5-12.


    Here I show how to create a basic news feed that pulls in static content using
    multiple effects to fade-in and slide the items into view. This news ticker can
    be expanded to include RSS feeds with a few tweaks, but this should be enough
    to get you started:


    +   The first step is to create a basic HTML news ticker. The goal is to make
    this news ticker as dynamic as possible, so it can be dropped onto any page without
    modifying the page itself. In this case, I have created a page with an H1 element,
    which I use in my selector statement to drop in the news ticker directly after.'
