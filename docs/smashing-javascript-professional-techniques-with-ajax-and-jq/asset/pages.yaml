  md: '# GETTING STARTED WITH JQUERY


    QUERY IS A POPULAR CHOICE among Web designers and developers because the steps
    required to get started developing are minimal. You just have to download a copy
    of the core JavaScript library file and include a script tag link to it on the
    top of your Web site. As with all JavaScript libraries, a JavaScript library include
    must be added to your Web site before you can start using its features in your
    Web site or application.


    This chapter guides you through how to set up an optional local development environment,
    choose the right jQuery download, and set up the jQuery library for inclusion
    in your Web site. I also explain what the jQuery wrapper does.'
