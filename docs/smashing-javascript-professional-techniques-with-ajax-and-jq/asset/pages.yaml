  md: '# #10 CREATING AND USING JQUERY PLUG-INS


    JQUERY ALLOWS WEB DESIGNERS and developers to write powerful plug-ins that extend
    the core functionality of the jQuery library. Developers can also incorporate
    plug-ins created by the open-source community into any Web site or application.
    Any Web designer or developer can implement a jQuery plug-in, but building a custom
    plug-in requires intermediate to expert knowledge of JavaScript.


    In the following chapter, I walk you through how to set up popular jQuery plug-ins
    such as jQuery UI, jQuery Tools, and Fancybox, a lightbox. The last part of the
    chapter focuses on building and distributing custom jQuery plug-ins.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# GETTING TO KNOW PLUG-INS


    Query plug-ins are very widely used; for example, most lightbox windows on Web
    sites are done with a jQuery plug-in. A lightbox shows larger images (such as
    zoom images) in a product catalog (Web site) without the user to leave the current
    Web page. This is done with a div layer with the larger image appearing over a
    semi-transparent background that covers the page. The blogging platform WordPress
    (www.wordpress.com) uses a lightbox-type plug-in within the admin interface to
    add media to a blog post, as shown in Figure 10-1.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_263_0.png)


    Figure 10-1: WordPress uses a lightbox-type plug-in within the admin interface
    to add media to a blog post


    jQuery has an enormous community of plug-in in developers who create great plug-ins
    for commonly used stuff like image galleries, forms, and form elements. Writing
    jQuery plug-ins requires advanced knowledge of JavaScript. You have to be able
    to write a script that can be adapted and applied to a wide range of situations.


    Here are some tips you should consider before using a plug-in:


    +   - Check that it is compatible with the version of jQuery that you are currently
    using.

    - Check that the plug-in is cross-browser compatible (Internet Explorer, Firefox,
    Safari, Chrome, and Opera).

    - Check the date of the last release. If the date is a few years back, you can
    assume that the plug-in is no longer supported.

    - Read the documentation provided with the plug-in to find out how easy the plug-in
    is to implement and whether it can be extended.

    - Check to see what the community response to the plug-in has been. Have most
    people had success with the plug-in?'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# CHAPTER 10: CREATING AND USING JQUERY PLUG-INS


    +   - If you run into issues or bugs the plugin-in is listed on the jQuery Plugin-in
    Web site (http://plugins.jquery.com/) or on the Google Code Project Hosting Web
    site (http://code.google.com/hosting/), you can find a bug report to notify the
    creator of the issue.


    +   - If the plugin-in looks out of date, search for something newer.


    # INCORPORATING A JQUERY PLUGIN-IN INTO YOUR WEB SITE


    Including a jQuery plugin-in on your Web Site is incredible easy. Think of it
    the same way you have to include the jQuery library before you can write any jQuery.
    You have to do the same for the jQuery plugin-in that you are looking to apply
    to your site. Always make sure the jQuery plugin-in file is included directly
    after the jQuery library file or the plugin-in work not.


    You can include many plugin-ins as you would like. The only downside to adding
    multiple plugin-ins with separate file includes is an increase in requests to
    the Web server as the page loads, which could create slower response and longer
    loading times. Figure 10-2 shows multiple jQuery includes being loaded on a Web
    page in Firefox. Any easy way to avoiding multiple requests is to combine all
    of your jQuery plugin-ins into one file called, jquery.js and only include that
    file.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_264_0.png)


    # JavaScript Include Loading Example


    10-2: Multiple jQuery includes being loaded on a Web page in Firefox


    # INCORPORATING JQUERY UI INTO YOUR WEB SITE


    jQuery has an official user interface called jQuery UI, as shown in Figure 10-3,
    which you can access by navigating to jquery.com. The jQuery UI library is separate
    from the jQuery library, but is dependent on the jQuery library''s presence.'
