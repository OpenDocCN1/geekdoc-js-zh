    # WRITING YOUR FIRST JQUERY PLUG-IN


    Writing your community jQuery plug-in is a great way to share code that you have
    created with the jQuery community in any way that can easily adapt to their own
    projects. You can also write a jQuery plug-in for your own use, if you are going
    to be using that same method in a variety of applications within a site.


    Most Web site issues or enhancements that you encounter when building and maintaining
    the DOM or Ajax iterations can be solved with jQuery and in turn can be converted
    into a plug-in for reuse. But on some occasions, a plug-in already exists with
    similar functionality'
