    # USING THE JOQUERY WEB SITE


    The official jQuery Web site (jquery.com) offers great documentation on how to
    use the API, but some of the other areas are lacking in usability and consistency.
    The Web site is organized into five sections:


    +   - Download

    - Documentation

    - Tutorials

    - Bug Tracker

    - Discussion


    The download section offers different ways of accessing the jQuery library for
    download and also through a CDN (content delivery network).


    # WORKING WITH JQUERY API DOCUMENTATION


    The team behind jQuery has spent an enormous amount of time building incredible
    documentation — it''s available for everyone to use. The Web site contains information
    about all of the methods available in current and past versions of jQuery, as
    shown in Figure 12-3. Access the jQuery API documentation by navigating to api.jquery.com.'
  merge: -1
