- img_proc: true
  md: "# PART II: LEARNING THE JQUERY FUNDAMENTALS\n\njQuery has made it possible\
    \ to use native JavaScript effects without having to interact directly with the\
    \ hard-to-understand JavaScript API. With the effects introduced by jQuery, the\
    \ same animated slideshow can be implemented in JavaScript. Using JavaScript-based\
    \ slideshows instead of Flash gives you a SEO (search engine optimization) advantage\
    \ because not all search engines are able to index the content found within Flash.\n\
    \nA key CSS property used in conjunction with the fading of elements on a Web\
    \ page is the opacity property, as shown in Figure 5-9. The opacity property takes\
    \ a value from 0 to 100 or 0.0 to 1.0 and is used in the fadeIn and fadeOut methods.\n\
    \n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_121_0.png)\n\nFigure 5-9: An example\
    \ of how an image fades using the opacity property\n\nThe fadeIn is set up in\
    \ a similar way to the show effect. You have two optional parameters that can\
    \ be passed in: duration and callback. The duration parameter determines how long\
    \ the animation runs in fast or slow, as well as milliseconds (600, 200, 700,\
    \ and so on). The callback parameter allows you to link up a function that executes\
    \ when the show effect is complete.\n\n```\n$(selector).fadeIn(duration, callback)\n\
    ```\n\nThe fadeOut is identical to fadeIn instead of fading an element in it,\
    \ it fades out. The fadeTo effect allows you to distinguish an opacity level that\
    \ you would like the selected element to fade to.\n\n```\n$(selector).fadeIn(duration,\
    \ opacity, callback)\n```\n\n# BUILDING A BASIC IMAGE GALLERY WITH A FADE TRANSITION\n\
    \nTo showcase how to use fading with your Web site, in this section I run through\
    \ how to set up a simple image gallery. This gallery has five images with a list\
    \ of numbers that can be clicked to change the images. When the image changes,\
    \ the current image fades out and the newly selected image fades in. I break this\
    \ down into multiple steps so you can see the progression of how to build incrementally\
    \ to your scripts more:\n\n+   1. Start with some basic HTML. I add all of the\
    \ necessary HTML for the slideshow through jQuery, which makes the script ultra-portable\
    \ and easy to set up.\n```html\n<div class=\"container\">\n  <h1>jquery Images\
    \ Gallery.</h1>\n</div>\n```\n\n+   2. Next, set up a style sheet to ensure the\
    \ image gallery will be laid out correctly on the page."
