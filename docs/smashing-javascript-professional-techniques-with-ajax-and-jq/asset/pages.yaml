  md: "# PART III: APPLYING JQUERY TO YOUR WEB SITE\n\nAlternatively, you can use\
    \ the :last filter to show content only after the last row in the table. Figure\
    \ 7-8 shows the special message script in action using Firefox.\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_175_0.png)\n\
    \nFigure 7-8: The special message script in action using Firefox\n\n# REMOVING\
    \ A ROW USING A FILTER SELECTOR\n\nI work in an environment where removing content,\
    \ whether it be temporarily or permanently, can be quite a challenge. We have\
    \ a schedule of weekly deployments and code that needs to be compiled and tested,\
    \ which prevents quick changes to most pages on the sites. If we need to do a\
    \ quick fix such as removing a product, image, text, or any type of element from\
    \ the DOM, we can use the remove() method, which makes the backend developers\
    \ happy they do not have to get involved. Sometimes, content makes it into a site\
    \ when it shouldn't, work hours during times of limited support. Being able to\
    \ go in and remove the content using jQuery really allows the days and the developers\
    \ to fix the issue next day from the core.\n\nThe remove() method removes whatever\
    \ matched it is attached to from the DOM.\n\nSet up a document.ready handler and\
    \ add a selector statement with remove() method at the end. The matched set, in\
    \ this case, the last table-row, is removed from the DOM. Figure 7-9 shows the\
    \ result of the last row of the table being removed.\n\n```\n$(document).ready(function()\
    \ {\n  $('tr:last').remove();\n});\n```"
