    # SELECTING ELEMENTS IN THE DOM BY THEIR ATTRIBUTES


    Attributes of a tag are useful for parsing extra information about the tag, or
    for interacting with JavaScript. A common HTML tag is the <a> anchor tag, which
    can have such attributes as href, rel, id, class, title. Selecting by attribute
    works well with form fields because you can search inputs by name, type, attribute,
    ID, and so on.


    You can use any of the attributes in Table 3.3 when selecting elements from the
    DOM. I focus on attributes in more in-depth tutorials later in the book, but for
    now, I''m going to go over two common examples of how to work with attributes.


    # Table 3.3 Attribute Names and Their Functions


    | Attribute Name | Attribute Function |

    |---|---|

    | $[attribute="value"] | Targets attributes that contains this value in any part
    of the string (wildcard) |

    | $[attribute=value] | Targets attributes with a value that starts with or is
    equal to a string followed by a hyphen (-) |'
  merge: -1
  pgno: 71
- img_proc: true
  md: "# CHAPTER 3: USING SELECTORS, FILTERS, AND CSS: JQUERY AT ITS CORE\n\n| Attribute\
    \ Name | Attribute Function |\n| --- | --- |\n| $([attribute~value]) | Targets\
    \ attributes that match this value in any part of the string, including spaces\
    \ |\n| $([attribute$=value]) | Targets attributes that end with this value |\n\
    | $([attribute=value]) | Targets attributes that match this value |\n| $([attribute^=value])\
    \ | Targets attributes that start with this value |\n| $([attribute!=value]) |\
    \ Targets attributes that don't have this value |\n| $([attribute=value][attribute=value][attribute=value])\
    \ | Targets multiple attributes |\n\n# SELECTING LINKS THAT CONTAIN A SPECIFIC\
    \ WEB SITE ADDRESS\n\nUsing the wildcard with an attribute is a flexible and commonly\
    \ used filter. The wildcard (*) can be used to search the DOM for any elements\
    \ that contain a specific value. This selector is very fast: If you were to find\
    \ all elements manually, it could take hours. By using the wildcard selector,\
    \ you can achieve the same result in a matter of seconds.\n\nIn the following\
    \ HTML example, I need to find all links where HREF attributes contain the domain\
    \ google.com and add a CSS class that contains a small icon. I filter all the\
    \ HREFs that have the domain google.com in it. I then use the add() method to\
    \ add the .google-icon class. Figure 3-14 shows the browser output after the attribute\
    \ filter has found the domain google.com.\n\n```\n<!doctype html>\n<html>\n<head>\n\
    <style>\n.google-icon {background:url(images/google_icon.jpg) no-repeat;padding:0px}\n\
    }\n</style>\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.4.2/jquery.min.js\"\
    ></script>\n<script>\n$(document).ready(function () {\n  $('ul li a[href*=\"google.com']).addClass('google-icon');\n\
    });\n</script>\n<body>\n<ul>\n  <li><a href=\"http://www.google.com/analytics\"\
    >Google Analytics</a></li>\n  <li><a href=\"http://www.yahoo.com/sports\">Yahoo\
    \ Sports</a></li>\n</ul>\n</body>\n</html>\n```"
