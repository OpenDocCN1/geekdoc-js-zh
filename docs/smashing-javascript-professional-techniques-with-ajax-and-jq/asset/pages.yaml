    \ you need to quickly change all of the hyperlinks to open in a new window, but\
    \ you don't have access to the source code. The code is being generated dynamically\
    \ in a PHP, JSP (Java Server Pages), or ASP (Active Server Pages) file and somewhere\
    \ you can't access it.\n\nInstead, you can write a little jQuery, which saves\
    \ you lot of work editing files and so on compared to making changes to the source\
    \ code. The beauty of using jQuery is that it's extremely easy to comment out\
    \ or delete the code when you longer need it.\n\nHere I show you how to set up\
    \ all the hyperlinks on a page to open in a new window. You can apply many other\
    \ options to hyperlinks on your Web page, such as\n\n+   - Assigning a name to\
    \ all hyperlinks\n- Setting the title tag on all hyperlinks to be the same as\
    \ the anchor text\n- Adding a rel tag to all hyperlinks\n- Removing href from\
    \ all hyperlinks so that they are disabled\n\nIn the following tutorial, I guide\
    \ you through how to set up a jQuery script that loops through all the links in\
    \ a given list, adds a title tag, and sets them up to open in a new window, as\
