  md: '# PART I: INTRODUCING JQUERY AND JAVASCRIPT


    After you''ve added the jQuery library to your page, you write JavaScript code
    using the jQuery API (application programming interface) to access different parts
    of your page the DOM (Document Object Model), which most Web designers and developers
    should be familiar with. If you are a Web designer, you work with on a daily basis
    but not even be aware of it.


    You can also use jQuery to add and remove HTML from your page and respond to actions
    users on your page, such as clicking a link or filling in a form. You can also
    create animations and use Ajax to load content through Web services without having
    to refresh the page.


    # Exploring the Advantages of jQuery


    Web sites have become more than just text, images, and links to other pages. Internet
    users expect greatness from a Web site and the bar is constantly being raised
    by Web sites and companies such as Facebook, Google, Microsoft, Twitter, and Foursquare,
    to name a few. The technology is constantly changing, and using jQuery helps you
    keep up with the fast pace. jQuery is a library that promotes rapid development
    of Web sites or applications allows you to focus on user interaction and interface
    design without having to write long, bloated code.


    Writing jQuery is easier than writing JavaScript code because you are following
    an API. If you are proficient in writing HTML and CSS, you can understand and
    write jQuery because jQuery functionality is based on interactivity within the
    HTML and CSS.


    # Open Source


    JavaScript libraries are supported by the open source community and are well tested
    and updated. The open source community a huge support network. Web designers and
    developers are continually creating tutorials, books, and plug-ins to help and
    extend the jQuery library.


    # Great Documentation


    By far, one of the greatest benefits of jQuery is its documentation, which is
    what makes a great library. The team behind jQuery has spent a great deal of time
    documenting how the library works and how to navigate around their API. The jQuery
    documentation site has tutorials complete with code examples, plus a huge community
    of supporters across the Web. Figure 1-3 shows the Documentation section of the
    jQuery site.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_23_0.png)'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# CHAPTER 1: INTRODUCING JQUERY


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_24_0.png)


    Figure 1-3: The Documentation section of the jQuery Web site


    The community of developers and programmers that has created the jQuery library
    is constantly improving and releasing new versions. jQuery was first released
    2006 as v1.0. Since then, the code has been updated 23 times, which brings us
    to the current release, v1.4.2. jQuery is continuously improved, which is one
    of the reasons it has become popular. Libraries that are not updated often are
    not as popular.


    As updates, the documentation is updated for methods that have become deprecated
    (slated for removal in the next release) and to ensure that the library will be
    backward-compatible—that is, it works with older versions. When a library is updated
    to a new version, the process of upgrading is painless—you just drop the new JavaScript
    library on your server. In addition, you should usually look over the changelog,
    a section that outlines each release and the changes that have been made to the
    library, to see if any methods you are using have become deprecated.


    jQuery is released under the MIT License or the GNU General Public License (GPL),
    version 2. This basically means that it''s free, and as long as you give credit
    to the author within the jQuery plugin in itself, you are free to use the code
    as you wish.'
