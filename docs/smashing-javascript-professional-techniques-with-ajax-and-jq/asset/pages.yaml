- img_proc: true
  md: "# CHAPTER 7: CREATING INTERACTIVE AND EXCITING TABLES\n\n# SORTING ROWS USING\
    \ THE TABLESORTER PLUG-IN\n\nThe tablesorter plug-in allows you to apply sorting\
    \ to any table. The tablesorter plug-in has been around for a few years and is\
    \ well supported with excellent documentation. It works on all the popular browsers.\
    \ Table 7.1 outlines some basic configuration options that can be passed into\
    \ the tablesorter method to give you more control and flexibility. This tutorial\
    \ references version 2.0.5 of the tablesorter plug-in.\n\nFor example, if you\
    \ have a table that contains more than one hundred records and you would like\
    \ to sort all of them by clicking on one header item, you can easily set this\
    \ up using the tablesorter plug-in.\n\nThe benefit to sorting the tabular data\
    \ using jQuery instead of a server-side method is that jQuery is faster in reorganizing\
    \ the records. If you use a server-side solution, the Web site has to reload each\
    \ request whenever a record is reordered, which slows down the results.\n\n# Table\
    \ 7.1 tablesorter Configuration Options\n\n| Option | Description | Default |\n\
    |---|---|---|n| cssAsc | Allows you to specify a class for ascending order | \"\
    headerSortUp\" |\n| cssDesc | Allows you to specify a class for descending order\
    \ | \"headerSortDown\" |\n| cssHeader | Allows you to specify a class for the\
    \ header in the unsorted state | \"header\" |\n| sortForce | Allows you to force\
    \ the sorting | null |\n| sortList | Allows you to specify how the data is sorted\
    \ by passing values in columnIndex and sortDirection | null |\n| sortMultiSortKey\
    \ | Allows you to specify the key used for multi-column sorting | shiftKey |\n\
    \nFor more information about tablesorter, visit: http://tablesorter.com/\n\nIn\
    \ the following example, I show you how easy it is to use the tablesorter plug-in\
    \ to allow sorting options of existing data in a table:\n\n+   1. Before you apply\
    \ the tablesorter plug-in to your table, you need to make sure the table is set\
    \ up correctly. If it's not, the plug won't work. You need to wrap all of the\
    \ table header cells with a <thead> tag and all of the table cells in a <tbody>\
    \ tag, as in the following HTML:\n\n```\n<table border=\"0\" cellpadding=\"0\"\
    \ cellspacing=\"0\" id=\"data\">\n  <thead>\n    <tr>\n      <th>Item #</th>\n\
    \      <th>Category</th>\n      <th>Product</th>\n      <th>Price</th>\n     \
    \ <th>Status</th>\n    </tr>\n  </thead>\n  <tbody>\n```"
  merge: -1
