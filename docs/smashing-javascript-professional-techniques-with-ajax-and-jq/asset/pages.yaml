  md: '# PART I: INTRODUCING QUERY AND JAVASCRIPT


    The power of the wrapper is being able to extend the DOM with much less code than
    native JavaScript. The following code is an example of the jQuery selector statement:


    ```

    $(selector)

    ```


    jQuery has many methods to choose from, but one very important one is called the
    document.ready() handler method, which executes only after the DOM is fully loaded.
    In its simplest form, a method is just another way of describing a function, but
    in other OOP (object-oriented programming) languages, methods have increased benefits
    compared to functions. The power behind jQuery is in manipulating the DOM; therefore,
    you may want to store the document.ready before you do anything with it.


    The document.ready() event handler allows you to put all of your JavaScript code
    within this event to make sure the code is executed when the DOM is ready. This
    is similar to the JavaScript onload event, except the document.ready() event handler
    method only fires after the DOM has loaded.


    The following code is an inline example of how to set up the document ready handler
    method:


    ```

    html

    <head>

    <title>My jQuery Example</title>

    <script src="http://ajax.googleapis.com/libs/jquery/1.4.2/jquery.min.js" type="text/javascript"></script>

    <script type="text/javascript"></script>

    $(document).ready(function() {

    // script goes here

    });

    </head>

    <html>

    <body>

    </body>

    </html>

    ```


    You should get in the habit of setting up the document.ready() event handler and
    any other custom code in an external file. This is the method I prefer because
    it keeps all your code separate in its own JavaScript include. I usually call
    my external file with all of my jQuery code, jquery.function.js, and always make
    sure it is included last, after all your jQuery library file(s).


    You can also use a shortened version of the document.ready() event handler when
    you are trying to optimize the size of the jQuery functions for increased performance,
    such as for a mobile application. The shortened version is set up like this:


    ```

    html

    <head>

    ```'
