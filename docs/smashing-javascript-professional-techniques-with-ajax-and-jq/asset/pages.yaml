  md: '# CREATING AN ACCORDION MENU


    The accordion is a fashionable choice among Web designers and user interface designers
    for Web sites that need to show a lot of content in a small space. The accordion
    hides all of the content except one section. When the mouse hovers over or clicks
    on a specified item, the content associated with that item expands to show or
    contracts to hide. Accordions can be used for navigation, but they have also been
    used for content-related purposes such as showing large amounts of content in
    small spaces. Magento, the open-source e-commerce platform, has implemented an
    accordion-style checkout process, as shown in 6-8.


    Click to show hidden content


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_153_0.png)


    6-8: Magento sites uses an accordion-style checkout process


    In this section, I guide you through a tutorial that shows how to set up a vertical
    accordion, which can be used for a site navigation sidebar. The accordion always
    has one content section open while the rest are closed. The header elements display
    an icon to show the user which content section is open or closed.


    +   1. The first task is to define the HTML structure of the accordion menu. The
    goal is to create a clean code structure, which is easy to set up and maintain
    with jQuery. The HTML structure requires two elements: an accordion header element
    and an accordion content element. The header element is given a class of accordion-header
    and wrapped around H3 tags, which display the header text. The header is the element
    that is clicked on show or hide the content underneath it. The content element
    is set up as an unordered list'
