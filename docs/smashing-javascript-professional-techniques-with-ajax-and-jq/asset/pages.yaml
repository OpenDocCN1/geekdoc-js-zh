  md: "In this tutorial I show you how to set up a Delicious personal favorites widget\
    \ that\nplace on your own Web site or any other Web site using jQuery, as shown\
    \ in Figure 9-21.\nThis tutorial involves using JSONP (JSON with Padding), which\
    \ is a required step when\nwith cross-domain Ajax calls. JSONP allows you to perform\
    \ cross-domain calls by\nwrapping the returned JSON in a callback function that\
    \ is specified by. Without JSON,\nyour cross-domain calls fail. You cannot use\
    \ JSONP with an API that is not set up to receive\nJSON requests.\n\n+   1. The\
    \ CSS controls how the widget is laid out the page. You can either build all the\
    \ CSS\nbefore starting or create the foundation for how it will look and work\
    \ as you\ngo. In the following CSS sample code, there are some references to browser-specific\n\
    rounded corners for Mozilla Firefox and Safari WebKit. The remaining browsers\
    \ just see\nstrait corners using the border property.\n\n```\nbody{\n  font-family:georgia;\n\
    \  font-size:12px;\n}\n\n.widget {\n  border:1px solid #1179CB;\n  -moz-border-radius:5px;\n\
    \  -webkit-border-radius:5px;\n  width:200px;\n}\n\n.widget h1 {\n  font:14px\
    \ georgia;\n  padding:5px;\n  color:#fff;\n  background:#1179CB url(images/delicious_32.png)\
    \ 2px 5px no-repeat;\n  text-indent:20px;\n  height:20px;\n  margin:0;\n}\n\n\
    #user-feed {\n  list-style-type:none;\n  padding:0;\n}\n\n#user-feed li {\n  padding:5px;\n\
    }\n\na{}\n```\n\n+   2. Use the HTML widget that contains the unordered list of\
    \ bookmarks. Create an\nunordered list with the ID #news-feed.\n\n```\n<div class='widget'>\n\
    \  <h1>My Delicious Feed</h1>\n  <ul id='news-feed'></ul>\n</div>\n```\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_250_0.png)"
  merge: -1
  pgno: 250
- img_proc: true
  md: "# PART IV: EXPLORING ADVANCED JOQUERY\n\n3. Create a named variable query and\
    \ set it equal to the URL of my Delicious feed.\n\n```\nvar query = \"http://feeds.delicious.com/v2/json/jakerutter?count=10\"\
    ;\n```\n\n4. Set up the ajax() method and include the following parameters. The\
    \ type is a GET request. The dataType is JSON. The url is set to my variable query\
    \ and the callback function is called processData.\n\n```\n$ajax({\n  type: \"\
    GET\",\n  dataType: \"json\",\n  url: query,\n  success: processData\n});\n```\n\
    \n5. Create empty callback function called processData that is used to accept\
    \ the JSON as data argument.\n\n```\nfunction processData(data {\\ {\n}\n```\n\
    \n6. Create a loop using the each method, which loops through all of the data\
    \ in the data object literal. The index will be accessed as item.\n\n```\nfunction\
    \ processData(data) {\n  $.each(data, function(i, item) {\n  });\n}\n```\n\n7.\
    \ Within the each method, create a selector that sets up a list item (<li>) and,\
    \ using the (html) method, adds an anchor tag. As each list item is created, it\
    \ is appended to the #user-feed unordered list. In each anchor tag, the URL and\
    \ title are added using the index to access each item and its JSON object name.\
    \ In this case .u is the URL and .d is the title.\n\n```\nfunction processData(data)\
    \ {\n  $.each(data, function(i, item) {\n    $('<li>'+<a href=\"'+item.u+'\n```\n\
    \n8. Set up two variables. newsLength is set to the length of the newsArray, news\
    \ Interval holds the numeric value for how often to grab a new headline and insert\
    \ it into the ticker.\n\n```\nvar newsLength = 5;\nvar newsInterval = 2000;\n\
    ```\n\n9. Set up a function called slideArticle() that contains all of the effects\
    \ to make the Delicious user feed widget. The first statement inside the news-feed\
    \ unordered list clones, and adds back into the list, but at the top using the\
    \ prependTo method. The second statement added to select functions the first item\
    \ in the news feeds adds the slideDown effect. Not only do I want to slide the\
    \ item at a duration of 500 milliseconds, but also I would like to fade the item\
    \ at a duration of 1000 milliseconds before it slides into place. I accomplish\
    \ this by chaining the fadeInIn method into the same statement that contains the\
    \ slideDown method. One last statement added to the slideArticle function, which\
    \ removes the item from the list. These three all occur one after the other, which\
    \ simulates a nice fade and sliding effect.\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_251_0.png)"
  merge: -1
  pgno: 251
- img_proc: true
  md: "# CHAPTER 9: WORKING WITH DYNAMIC DATA AND AJAX\n\n```\nfunction slideArticle()\
    \ {\n  $('#user-feed li:last').clone().prepend('#user-feed').css('display','none');\n\
    \  $('#user-feed li:first').fadeIn(1000).slideDown(500);\n  $('#user-feed li:last').fadeOut().remove();\n\
    }\n\nsetInterval(slideArticle, newsInterval);\n\\var newsInterval = 2000;\n```\n\
    \n10. This last piece of JavaScript is probably the most important. I need to\
    \ set up the setInterval function to execute the slideArticle at the newsInterval\
    \ rate (2,000 milliseconds). This function continuously pulls the news ticker.\
    \ Without this, the feed widget won't run.\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_252_0.png)\n\
    \nFigure 9-21:The animated Delicious feed widget\n\n# CREATING A YELP TOP REVIEW\
    \ WIDGET USING JSON VIA THE YELP API\n\nYelp (www.yelp.com) is an online local\
    \ search and reviews service that was founded in 2004. The Web site offers local\
    \ reviews and ratings for everything from restaurants to bookstores, as shown\
    \ in Figure 9-22. Local customers who have visited the establishments and leave\
    \ feedback over the online community. In 2007, Yelp improved their site by providing\
    \ an API for developers to create applications based on Yelp: This has greatly\
    \ increased the reach of the Yelp."
