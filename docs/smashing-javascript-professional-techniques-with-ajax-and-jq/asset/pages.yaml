  md: '# WORKING WITH XML DATA


    XML stands for eensible Markup Language and was first introduced on the scene
    in 1996, so it''s by no means new technology. XML allows you to define a custom
    data structure based on a common standard, which is platform-independent. XML
    is used in many different applications for submitting bank data to creating RSS
    (Really Simple Syndication) feeds. XML is everywhere and a reliable way of transmitting
    data. Figure 9-10 shows an example of RSS from Smashing Magazine (smashingmagazine.com).


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_238_0.png)


    # Smashing Magazine Feed


    Turning All Clients into Dream Clients (or Common Difficulties)

    September 21, 2019 11:33 AM


    Clients can be real tough. Working side by side with some clients can be an amazing
    experience - an experience to payoff that you often want exactly what you have
    gotten yourself into. On the other hand, some clients are an adverse dream to
    work with. Every day working with them tells you how well a designer is and how
    much you enjoy your job actually. The question is, how do we lose our most difficult
    clients and turn them into dream? The answer may be easier than you realize.


    > @smashingmaine How about experience


    Figure 9-10: A sample RSS feed from Smashing Magazine

    Smashing Media GmbH. Created by Sven Lennartz & Vitaly Friedman


    Think about this scenario: You have a home page with a carousel of images. These
    images are maintained by a business user who uploads the images and adds a title,
    description, and URL for where a click should take the user. You could work with
    a developer to create an XML feed for the image data, which is updated on a daily
    basis. You could then take the path to the XML feed and use it in a jQuery GET
    request to build the home page carousel. The upside to using an XML feed is that
    it can be used with other front-end platforms like Flash, Mobile Apps, and so
    on. In a, you have one data structure that can feed many different of applications
    and you only need to involve a developer to initially get the XML set up.


    The downsides of working with XML are that you can only use XML data if it is
    coming from the same Web site domain that you are currently working on, and that
    the code is bloated. If you want to work with data on other domains, you need
    to use JSON-P from the client side, which I will cover in the next tutorial.'
