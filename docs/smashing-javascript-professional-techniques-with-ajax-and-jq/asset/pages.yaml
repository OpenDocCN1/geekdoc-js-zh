  md: '# # CREATING INTERACTIVE AND EXCCITING TABLES


    IN THE LATE NINETIES, during the explosive growth of the Internet and the World
    Wide Web, tables were often used for page design and layouts, which is not what
    they were originally intended for. The problem with using tables for design and
    layout stems from their lack of support for semantic principles, where content
    is separated from design, and the usage of nested tables, which add unnecessary
    page bloat to your code and lead to an accessibility and maintenance nightmare.
    Nested tables occur when you create a page layout with table upon table nested
    into each other to match up to a complex design. Most Web designers and developers
    are now able


    to work purely with HTML and CSS to create semantic designs that no longer use
    tables for layout and therefore separate the content from the presentation layers.\
    HTML tables were used improperly because alternative layout options did not exist
    until the advent of CSS — even then, browsers didn''t support CSS correctly for
    a few years. Tables have a really bad reputation, but if they''re used correctly
    for tabular data, they can be quite useful for showing data in a clean, structured
    format. In the following chapter, I share some ways to enhance your tabular data
    using jQuery.'
  merge: -1
  pgno: 166
- img_proc: true
