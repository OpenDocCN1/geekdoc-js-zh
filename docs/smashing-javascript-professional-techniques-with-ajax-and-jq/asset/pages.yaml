    # CREATING A BASIC DROP-DOWN MENU


    The drop-down menu is one of the most popular ways to approach navigation on a
    Web Site. Many Web sites have categories or sections with many pages in these
    sections. Creating a navigation system that showcases every page on your site
    at once would be challenging, and it would be extremely daunting for the user
    experiencing this scenario.


    The benefit of drop-down menus is that you can list all of your pages in the menu,
    show the top-level entries, and hide the rest. Then it''s up to the user to decide
    if they want to see by hovering over the top-level category, which shows the rest
    of the categories available.


    Drop-down menus can be set up horizontally, with the submenu appearing below the
    main menu, or they can be set up vertically, as shown in Figure 6-3.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_146_0.png)


    Figure 6-3: An example of a drop-down menu


    Reproduced by permission of envato.com


    Here, I show you how to build a basic drop-down menu, as shown in Figure 6-4,
    and then add some fancy effects, as shown in Figure 6-5:'
