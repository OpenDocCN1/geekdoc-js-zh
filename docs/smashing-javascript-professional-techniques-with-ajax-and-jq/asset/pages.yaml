  md: "# UNDERSTANDING THE PLUG-IN STRUCTURE\n\nBefore getting started with how to\
    \ set up the plug-in, I want to discuss the basic plug-in structure. All jQuery\
    \ plug-ins are declared in the jQuery.fn method.\n\n```\njQuery.fn.hidePlugin\
    \ = function() {\n  // plug-in stuff goes here\n);\n```\n\nThe name in bold is\
    \ where you set the name of the plug-in; this is how the plug-in will be referenced.\n\
    \n$('.selector).showhidePlugin();\n\nI also suggest that you save the plug-in\
    \ as jquery.js for consistency. I always like to add the word jQuery at the beginning\
    \ of any JavaScript files that are jQuery-related—it's a great organizational\
    \ tip and helps communicate that it's a jQuery-plugin.\n\nNotice that I'm not\
    \ using the $ alias; I'm using the jQuery namespace to avoid any potential conflicts.\
    \ If you want to use the $ alias instead of jQuery, you can do so by wrapping\
    \ the plug-in with a self-executing anonymous function. It's always better to\
    \ add the self-executing function just to be on the safe side and to be able to\
    \ use the $ alias without any issues.\n\n```\n(function($ {\n  jQuery.fn.showhidePlugin\
