    nA Tribe Called Quest was disbanded in 1998, when Q-Tip pursued a solo career.
    His first solo singles, "Vivant Thing" and "Sheila, Stop," were far more popular
    than anything he had done in A Tribe Called Quest. His solo debut album, *The
    Abstract*, was critically acclaimed and listed a catalog number, which was the
