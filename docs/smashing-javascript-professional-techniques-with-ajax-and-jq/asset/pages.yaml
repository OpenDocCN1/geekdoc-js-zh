    \ 5-megapixel camera.\n\n$299.99\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_98_1.png)\n\
    \nFigure 4-9: The tooltip after I have hovered over the picture, and the output\
    \ in Firefox from the DOM changes\n\n+   2. The next step is to add your document.ready\
