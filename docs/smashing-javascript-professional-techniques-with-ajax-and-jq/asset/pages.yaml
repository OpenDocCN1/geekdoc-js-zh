  md: '# PART III: APPLYING QUERY TO YOUR WEB SITE


    # REMOVING A ROW BASED ON ITS INDEX VALUE


    Similar to adding a row based on index, you can also remove a row by its index
    value. Set up a selector that selects all tr elements that have an index of 1
    and removes them from the DOM using the remove() method. In this case, it would
    only be equal to one row:


    ```

    $(:eq(1)).remove();

    ```


    # ADDING A MESSAGE AFTER ROWS WITH SPECIFIC CONTENT


    If you would like to insert rows into a table before or after a text string contained
    in the table rows, you can do so by using the :contains filter. Similar to the
    Priceline example in Figure 7-7, you can use this filter in conjunction with table
    to show special messages to your users.


    Consider this scenario: You would like to match all rows (Clothing) and add a
    special message after each row that contains this string. It''s a clever way to
    call out specific elements and highlight them within the DOM. It''s important
    to note that the contains filter is case-sensitive. if it comes across any strings
    in a lowercase, if you had specified uppercase, it would be skipped over.


    Create a selector statement using the tr elements on the page. Using the :contains
    filter, you can match all rows that contain the string Clothing. After each matched
    set, you can insert a Special Offer table row. Figure 7-10 shows how an example
    of adding special content using the :contains filter is rendered in a browser.


    > :contains is a filter that allows you to filter DOM elements based on their
    content.


    ```

    $('':tr:contains(''Clothing'')).after(''<tr><td colspan="4" class="special">Special
    Offer TODAY</\></td></tr>'');

    ```


    # REMOVING A ROW BASED ON ITS CONTENT


    Just as you can add a row based on specific content, you can also remove elements
    based on the content contained within them. Use a selector statement that selects
    all tr elements that have the string Clothing and removes them from the DOM.


    ```

    $('':tr:contains(''Clothing'')).remove();

    ```


    # SETTING UP PAGINATION WITH JQUERY


    Pagination involves breaking up content into manageable page-sized pieces. On
    the Web, pagination is everywhere; Figure 7-11 shows pagination on the Google
    search page. Pagination helps to limit the number of results shown at one time
    to make it easier for users to navigate and digest the content delivered to them.


