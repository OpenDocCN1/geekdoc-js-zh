  md: '# PART IV: EXPLORING ADVANCED JQUERY


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_265_0.png)


    Figure 10-3: The jQuery UI home page


    © 2010 The jQuery Project and the jQuery UI Team


    The jQuery UI library is made up of many of interactions and widgets. Interactions
    are functional scripts that you can incorporate into your Web site applications
    to help achieve a task. For example, one interaction, Droppable, can be used in
    any application that performs drag and drop.


    Table 10.1 all out of the feature components that are included within the jQuery
    UI library. We review the most common components in the next sections of this
    chapter.


    | Interactions | Widgets | Utilities | Effects |

    |---|---|---|--|

    | Draggable | Accordion | Position | Show |

    | Droppable | Autocomplete | | Hide |

    | Resizable | Button | | Toggle |

    | Selectable | Date Picker | | |

    | Sortable | Dialog | | |

    | | Progress Bar (forms) | | |

    | | Slider (forms) | | |

    | | Tabs (forms) | | |


    Widgets are self-contained components such as the Accordion widget, which can
    be embedded directly into a Web application to offer a level of interaction for
    those engaging with your user interface. I mainly focus on how to implement a
    few of the widgets into your Web site.'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'jQuery UI also offers methods to extend the jQuery core event methods, such
    as being able to animate background and border colors. The jQuery easing-plugin
    is now included in the jQuery core to allow anyone to add powerful effects to
    its animations.


    jQuery UI is often used in conjunction with Rich Internet Applications (RIA) where
    a lot of interaction takes place within the browser and all of the UI components
    can be utilized.


    # DOWNLOADING JQUERY UI


    You can download the jQuery UI library, as shown in Figure 10-4, by pointing your
    browser to http://jquery.com/download. You can download the entire UI library
    or split it into smaller chunks with the Build Download page to download just
    the jQuery components you will be using. This is a nice option to have: jQuery
    UI is considerably larger than jQuery and you probably won''t use any of the components
    wrapped into the full library.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_266_0.png)


    Figure 10-4: The jQuery UI Build Download page


    © 2010 The jQuery Project and the jQuery UI Team


    # ADDING JQUERY UI TO YOUR SITE


    Similar to the jQuery library, jQuery UI is included as a standalone JavaScript
    file that is uploaded to your Web server and inserted into the head of your page
    directly after the jQuery library. jQuery UI is also available through the Google
    CDN (content delivery network).


    ```

    <script src="http://ajax.googleapis.com/ajax/libs/jqueryui/1.8.5/jquery-ui.min.js"></script>

    ```'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# PART IV: EXPLORING ADVANCED JQUERY CDN


    The downside of including the library through the Google CDN is that you will
    be accessing the entire library with all the components included, which could
    be unnecessary. The benefits of using the CDN are improved performance and caching
    for your Web site.


    The jQuery UI and jQuery library headers look like the following:


    ```

    <script type="text/javascript" src="/jquery-1.4.2.min.js"></script>

    <script type="text/javascript" src="/jquery-ui-1.8.4.custom.min.js"></script>

    ```


    # UNDERSTANDING HOW JQUERY UI WIDGET WORKS


    Each widget has an extensive API composed of options, events, and methods that
    can be applied to create customized components on your site and easily used in
    other places on the Tabs page, as shown in Figure 10-5. The component drives the
    functionality either through the default setup or through options from the API.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_267_0.png)


    Figure 10-5: The jQuery tabs widget with all documentation displayed


    © 2010 The jQuery Project and the jQuery UI Team


    # CUSTOMIZING THE DESIGN OF JQUERY UI


    The jQuery UI library is built on top of a CSS framework, which means you can
    easily customize it by creating your own styles or by creating a theme using ThemeRoller.
    To get more detail on ThemeRoller later in this chapter in the section called
    "Creating a Theme with ThemeRoller." A theme is a collection of CSS styles and
    images that can be applied to all the components in the jQuery UI Library. By
    using the jQuery UI framework, you can ensure that any design work applies to
    current and future UI components.'
