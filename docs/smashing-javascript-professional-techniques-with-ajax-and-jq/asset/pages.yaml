  md: "# CHAPTER 1: INTRODUCING JQUERY\n\nProgressive enhancement is the newer strategy\
    \ of the two, but the main difference\nis the approach of each takes. I cover\
    \ these in the next couple of sections.\n\n# Graceful Degradation\n\nWith the\
    \ graceful degradation approach, you get your Web site working in all modern,\n\
    popular browsers and then work with older browsers to make sure they support those\n\
    features. Web designers and developers have practiced graceful degradation by\
    \ setting\nspecific style sheets or browser hacks for various versions of Internet\
    \ Explorer (ahem,\nnot pointing at fingers, IE6) because of layout issues with\
    \ the box model.\n\n```\n<a href=\"javascript:window.open('help.html', 'help window',\
    \ 'height=800,width=600,toolbar=0');\">Help</a>\n<script>\nnPlease upgrade your\
    \ browser or turn on JavaScript, as your browser is not working\nwith our Website.\n\
    </script>\n```\n\n# Progressive Enhancement\n\nProgressive enhancement refers\
    \ to a strategy of starting with a baseline of features supported\by all browsers\
    \ and adding more features for the modern browsers that support them.\nive enhancement\
    \ is a great practice to adopt because it makes your sites more accessible.\n\
    it you deliver one set of features everyone and add special upgradesnto those\
    \ using more compliant browsers — that is, compatible with features such as CSS3\n\
    and HTML 5. Currently Safari 4 and Opera 10.6 support HTML 5 and CSS3.\n\nThe\
    \ progressive enhancement approach does not assume that everyone JavaScript enabled\n\
    always gives the user an alternative way of accessing the content. The pop-up\n\
    window used in the discussion of practicing unobtrusive JavaScript. Instead, you\
    \ can use\nthe target in the anchor tag to tell the browser to open the link in\
    \ a new browser\nwindow, instead of creating a pop-up. This is supported by all\
    \ popular browsers.\n\n```\n<a href=\"help.html\" target=\"_blank\">Help</a>\n\
    ```\n\nIn this book, I focus on jQuery with the progressive enhancement strategy\
    \ to give more\nmodern browsers a slightly better experience, while still supporting\
    \ the older browsers with a\nbaseline experience.\n\n# Unobtrusive JavaScript\
    \ and jQuery\n\njQuery makes practicing of these strategies (graceful degradation\
    \ and progressive\nenancement) easier because all of the jQuery (JavaScript) code\
    \ lives outside the HTML in an\nexternal JavaScript file or in the head of the\
    \ HTML file you are working with, unless you are\nusing a hosted solution delivered\
    \ by a CDN. The HTML elements contained no embedded\nJavaScript code, therefore\
    \ a fallback approach is always an option as long as the developer\npractices\
    \ in mind when setting up your Web sites.\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_28_0.png)"
