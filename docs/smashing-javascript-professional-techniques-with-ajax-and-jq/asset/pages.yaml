  md: "# CHAPTER 3: USING SELECTORS, FILTERS, AND CSS: JQUERY AT ITS CORE\n\n# Selecting\
    \ Elements by Using the HTML Tag\n\nAfter understanding how the wildcard selector\
    \ works, you can see that the other CSS selectors work the same way. You can select\
    \ any element within the DOM using the element — you need to pass a tag name to\
    \ selector, which is present in the page. This selector uses the native JavaScript\
    \ method getElementsByTagName().\n\nThe native JavaScript function getElementsByByTagName()\
    \ retrieves all elements by their tag name. The code is set up like this:\n\n\
    ```\ndocument.getElementsByTagName('h1');\n```\n\nIn the following HTML example,\
    \ I need to set the font-family property of h1 tags. I can do so by changing the\
    \ CSS, but I don't want h1 tags on other pages to be affected. Instead, I can\
    \ use the tag selector together with the css() method to change the font-family\
    \ property for Hi tags on this page only. I use the ID method to apply the font-family\
    \ property to just the H1 tag that I select.\n\nFigure 3-2 shows the output of\
    \ the following code in the browser with Firefox. This example demonstrates how\
    \ the DOM is altered by the font-family property added to the h1 tag after the\
    \ DOM has loaded.\n\n```\n<!doctype html>\n<html>\n<head>\n  <script src='http://ajax.googleapis.com/ajax/libs/jquery/1.4.2/jquery.min.js'></script>\n\
    \  <script>\n  $(document).ready(function() {\n    $('h1').css('font-family',\
    \ 'arial,verdana');\n  });\n  </script>\n</head>\n<body>\n  <div class='container\"\
    >\n    <h1>Hello jQuery.</h1>\n  </div>\n</body>\n</html>\n```\n\n# Selecting\
    \ Elements by Using the ID Selector\n\nYou can select any ID within the page using\
    \ the ID ('#') selector. The ID selector uses the native JavaScript method getElementById().\
    \ To select a class using the native JavaScript function getElementById(), the\
    \ code is set up in the following manner:\n\n```\ndocument.getElementById('sidebar');\n\
