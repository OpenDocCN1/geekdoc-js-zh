    Reproduced from 2010© Google. www.android.com


    # DISPLAYING CONTENT BASED ON WHICH SMARTPHONE YOUR USERS HAVE


    Using Web rewrites, you can detect desktop versus browser traffic and show them
    an appropriate Web site based on their platform. The following code is an example
    of how you can set up mobile devices for different mobile platforms. Each line
    uses a rewrite condition to test if the user agent is an iPhone, BlackBerry, or
    Android. If it finds a match, the user is redirected to a mobile version of the
    Web site suited to the mobile device. The rewrites use a regular expression with
    Mod_rewrite to set up the different rules for different platforms.'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'Before you can use the following code, you need to make sure your Web server
    is Apache and has Mod_rewrite enabled, although there are alternatives if your
    Web site is hosted on a Windows server that you can find by searching on Google.
    Ask your Web host and they should be able to point you in the right direction:


    ```

    RewriteCond %{HTTP_USER_AGENT} .*"iPhone.*$

    RewriteRule ^\(.*.*)$ http://iphone.yourdomain.com [R=301]

    RewriteCond %{HTTP_USER_AGENT} .*"BlackBerry.*$

    RewriteRule ^\(.*.*)$ http://bb.yourdomain.com [R=301]

    RewriteCond %{HTTP_USER_AGENT} .*"Android.*$

    RewriteRule ^\(.*.*)$ http://android.yourdomain.com [R=301]

    ```


    # DEVELOPING MOBILE WEB SITES AND APPLICATIONS WITH JQUERY


    When you finally start development of a Web site or application for mobile, you
    can integrate jQuery as you would with a desktop Web site or application. Everything
    I have reviewed up to this point in previous chapters works on a mobile phone
    as long as JavaScript is supported.


    # INTRODUCING JQUERY MOBILE PREVIEW


    The jQuery team has announced the release of the jQuery Mobile (http://jquerymobile.com/)
    plug-ins as an alpha version, as shown in Figure 11-13. Discussions and rumors
    are being circulated on the online jQuery community for some time. Will there
    be a separate library for jQuery Mobile? Yes, it is a separate weighing in 6 KB,
    which needs to be included after the jQuery library. Which platforms will be supported?
    Apple iOS, Google Android, BlackBerry, bada, Windows Phone, Symbian, Mobile web,
    and MeeGo. A full compatibility chart can be viewed at http://jquerymobile.com/gbs/.
    How big will the download? The development plug-in is 88 KB and the mobile plug-in
    is 12 KB.


    Because jQuery Mobile has been released as an alpha version, bugs and issues will
    occur, but the plug-in looks very promising as far as its level of support and
    the features that it brings to the table.


    # MOBILE FRAMEWORKS


    Mobile frameworks are similar to JavaScript libraries; they offer a range of APIs
    that interface with the mobile device that you are developing for. Currently,
    Accelerator Titanium and jTouch are the only mobile frameworks that boost jQuery
    support.


    # WORKING WITH ACCELERATOR TITANIUM MOBILE


    Appceler is a development framework for creating mobile and desktop applications
    that was introduced in December 2008, as shown in Figure 11-12. Using it, you
    can create mobile applications for Apple iPhone, Apple iPad, Google Android, and
    BlackBerry phones using HTML, CSS, and JavaScript/jQuery.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_307_0.png)'
