  md: '# CHAPTER 10: CREATING AND USING QUERY-PLUGINS


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_284_0.png)


    A Lightbox


    Figure 10-19: The Netflix website uses a lightbox window overlay to show quick
    about products


    Reproduced by permission of Netflix


    The story of Fancybox begins with the original Lightbox plug-in. I began with
    the original Lightbox plug-in (www.lokeshdhakar.com/projects/lightbox2/) in 2006.
    Since then, new versions have been released, with the last update in 2008. Because
    of the limited support for Lightbox 2, I switched to Thickbox (http://jquery.com/demo/thickness/)
    by Cody Lindley. Thickbox pushed the envelope with lightbox functionality by allowing
    not images, but also videos and dynamic content from all sources to be displayed
    in the lightboxes. I used Thickbox for about three years on various project, until
    the creators of Thickbox stopped supporting it. It was time to move on, so I chose
    Fancybox, shown in Figure 10-20, and have been quite happy with it.


    The lesson behind my history with the Lightbox plug-in is that plug-ins are great,
    but when the person or company continue using it with the hopes that future versions
    of jQuery don''t break the plug-in when you upgrade, or you scrap the plug-in
    and find something that is supported. Each time this scenario happens, I usually
    switch to a new plug-in, which is often better and has more features.


    +   1. When using a plug-in with jQuery, you need to include it in the top of
    your page. It should be included directly after the jQuery library, but before
    any jQuery code that you have created:


    ```

    <script src="/js/fancybox.js"></script>

    ```'
