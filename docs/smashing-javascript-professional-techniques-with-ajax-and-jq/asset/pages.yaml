  md: "# Cross-Browser Compatibility\n\nWith the recent updates to Safari, Firefox,\
    \ Internet Explorer, Google Chrome, and Opera, creating pages that work across\
    \ all of the major browsers is the top priority. Browser wars have become a part\
    \ of every Web designer's daily struggle.\n\nWhen you use jQuery, you can rest\
    \ assured that it's cross-browser compatible with all the popular browsers, such\
    \ as Internet Explorer 6.0+, Firefox 2+, Safari 3.0+, Opera 9+, and Google Chrome.\n\
    \nOften, a major issue with JavaScript is that you need to create different code\
    \ to support multiple browsers. Web designers and developers choose to alternate\
    \ browser-specific style sheets to support CSS in different browsers, mainly Internet\
    \ Explorer versus the rest. The same issue often occurs with JavaScript. The following\
    \ code represents how to set up an Ajax request that works in multiple browsers:\n\
    \n```\nfunction getXml(url) {\n  if (window.XMLHttpRequest) {\n    var xhr = new\
    \ XMLHttpRequest();\n    xhr.open(\"GET\", url, true);\n    xhr.onreadystatechange\
    \ = function() {\n      if (this.readyState == 4 && this.status == 200) {\n  \
    \      callback(this.responseText);\n      }\n    };\n    xhr.send(null);\n  }\n\
    }\n```\n\nWith plain JavaScript, you have to write two different functions, test\
    \ those functions, and fix any bugs. It's quite a lot to manage, not to mention\
    \ the repetition that occurs when you have to write several functions to do the\
    \ same thing to support multiple browsers, instead of one script that supports\
    \ them all, such as in jQuery.\n\nBy contrast, the following piece of code shows\
    \ just how easy an Ajax request is in jQuery:\n\n```\n$.get(url, function(data)\
    \ {\n  callback(data);\n});\n```\n\nAll modern browsers support CSS1 and CSS2\
    \ (the first two versions of Cascading Style Sheets), and most Web designers and\
    \ developers these days use CSS2. CSS3 is in development and offers enhanced features\
    \ such as embedded fonts, rounded corners, advanced background images, and colors,\
    \ text effects, and transitions. Only a handful of browsers currently support\
    \ the full CSS3 spec as of July 2010 — Firefox 4, Internet Explorer 9, Opera 9,\
    \ and Safari 4. Some older versions of these browsers do certain features of CSS3."
  merge: -1
