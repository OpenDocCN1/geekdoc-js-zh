  md: "# PART I: INTRODUCING JQUERY AND JAVASCRIPT\n\njQuery CSS3 support for new\
    \ selectors. What does that mean? One of the new features of CSS3 is additional\
    \ attribute selectors, which are an improvement from the attribute selectors included\
    \ in CSS2 and are similar to the attribute selectors in jQuery. These selectors\
    \ allow you to style content based on its attributes, so you can filter by specific\
    \ values found in the attributes. Check out the following sample code:\n\n```\n\
    p[title=\"foo\"] [background:black;color:white]\n<p class=\"text\" title=\"foo\
    \ is good you\">This is my sample text</pp>\n```\n\n# Practicing Unobtrusive JavaScript\n\
    \nMany of you have probably created pop-up windows by embedding JavaScript directly\
    \ into your HREF refs. The biggest problem with this code is that it's embedded\
    \ into your link HREF. If the user happens to have JavaScript disabled, it is\
    \ rarely case that this link won't work and there is no fallback mechanism to\
    \ enable them to view the help.\n\n```\n<a href=\"javascript:window.open('help.html',\
    \ 'help window', height=800,width=600,toolbar=no\\); return false;\"></a>\n```\n\
    \nThis HTML is an example of unobtrusive JavaScript. For Web designers, it's like\
    \ when you write inline styles instead of separating the presentation layer from\
    \ the content. To contrast with the example of obstructive JavaScript, here is\
    \ an example of how to use jquery to provide an unobtrusive solution using similar\
    \ code. When JavaScript is disabled, this version, instead of wrapping the code\
    \ inside of a click function, offers users the fallback of clicking the link and\
    \ being brought to the help page.\n\n```\n<!doctype html>\n<html>\n<head>\n  <title>Unobtrusive\
    \ jQuery</title>\n  <script type=\"text/javascript\">\n  $(document).ready(function()\
    \ {\n    $('.help-link').click(function() {\n      var linkHref = $(this).attr('href');\n\
    \      window.open(linkHref, 'help window', height=800,width=600,toolbar=no);\n\
    \      return false;\n    });\n  });\n  </script>\n</head>\n<body>\n  <a href=\"\
    help.html\" class=\"help-link\">Help</a>\n</body>\n</html>\n```\n\nGraceful degradation\
    \ and progressive enhancement are strategies dealing with how to newer browser\
    \ features and older unsupported browsers while offering the best user\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_27_0.png)"
