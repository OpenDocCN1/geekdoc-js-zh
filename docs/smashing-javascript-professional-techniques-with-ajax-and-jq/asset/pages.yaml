    \ that the user moves over and off of the images, two different actions occur.\n\
    \n```\n$(document).ready(function() {\n  $('.product-image img').bind({\n    mouseenter:\
    \ function () {\n    },\n    mouseleave: function () {\n    }\n  });\n});\n```\n\
    \nThe difference between mouseover/mouseout and mouseenter/mouseleave is the way\
