    <input type="text" id="name-input" />

    2. Add a statement that selects the name-input element and sets the disabled attribute
    or false using the attr() method:

    $("name-input").attr("disabled", false);


    If you would like to enable the form input, change the parameters that you pass
    into the attr method from disabled to query true.


