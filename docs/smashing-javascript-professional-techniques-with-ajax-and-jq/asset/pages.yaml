    \nFigure 7-12: The final output of the pagination tutorial in Firefox and Firebug\n\
    \n# # CREATING ADVANCED TABLES USING JQUERY PLUG-INS\n\njQuery has an extensive\
    \ community of developers who create jquery plug-ins. In Chapter 10, I explain\
    \ how to create your own plug-ins and also review some popular plug-ins that I\
    \ suggest you use in your projects. The only downside to having so many options\
    \ to choose from is that sometimes the quality of code and support for a plug-in\
    \ is lacking. You can usually tell a good plug-in from bad by the documentation\
    \ that accompanies it.\n\nYou can build your own JQuery code to do table sorting\
    \ and filtering, but quite a powerful plug-ins can also do this. Using a plug-in\
    \ can rapidly speed the implementation of a solution, and because most plug-ins\
    \ are open source, it gives you a good base to get started upon. I review how\
    \ to work with two plug-ins in particular: tablesorter and Visualize."
