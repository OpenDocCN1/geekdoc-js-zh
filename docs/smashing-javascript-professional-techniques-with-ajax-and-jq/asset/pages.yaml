  md: "16. To ensure that the first slide is loaded when the page loads, set up a\
    \ selector statement to select the first anchor tag in the navigation and simulate\
    \ a click on it:\n\n```\n$('$nav li a').eq(0).click();\n```\n\n# ADDING DELAY\
    \ TO CREATE TIMED ANIMATION\n\nAnimations are usually a series of events occurring\
    \ within a given timeframe, being able to delay elements to create a timed animation\
    \ is a basic requirement. jQuery offers a way to add delay to an animation with\
    \ the delay method.\n\nThe delay method was added recently to version 1.4 of the\
    \ jQuery library to allow you to add a delay to the methods that follow it, which\
    \ are attached by chaining. The delay method is only to be used with effects in\
    \ the jQuery library. If you are looking for a more flexible timer function, use\
    \ the native JavaScript setTimeout function.\n\nIf you are looking to display\
    \ a message to your users and have it disappear after a certain amount of time,\
    \ the delay effect is the perfect solution. In example, if I want to display a\
    \ message when the user hovers their mouse over a link. If the user's mouse leaves\
    \ the link, after 10 seconds, I want the message to fade out.\n\n+   1. Set up\
    \ HTML for the tooltip element that contains the message and the show-tip link\
    \ that the user moves over to see the message.\n<a href=\"# class=\"tool-tip\"\
    >Learn more about Peaches</a>\n<div class=\"tool-tip\">\n\nAlthough its botanical\
    \ name Prunus persica suggests the peach is native to Persia, peaches originated\
    \ in China since the early days of Chinese culture. Peaches were mentioned in\
    \ Chinese writings as far back as 10th century BC and were a favoured fruit of\
    \ kings and emperors. Recently, the history of peaches in China has been extensively\
    \ citing numerous original manuscripts dating back to 1100 B.C.\n\n```\n</div>\n\
    ```\n\n+   2. Next, set up a hover event. The hover event toggles between the\
    \ mouseenter and mouseleave events. In the first statement, the mouseover, select\
    \ the tooltip message and fade it out over a duration of 900 milliseconds.\n\n\
    ```\n$('.show-tip').hover(\nfunction() {\n  $('.tool-tip').fadeIn(900);\n),\n\
    function() {\n  }\n});\n```\n\n+   3. In the second statement, the mouseleave,\
    \ select the tooltip message, but this time, delay it for 1000 milliseconds (10\
    \ seconds) and then fade it out over a duration of 900 milliseconds.\n\n```\n\
    $('.show-tip').hover(\nfunction() {\n  $('.tool-tip').fadeIn(900);\n});\n```\n\
    \n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_125_0.png)"
