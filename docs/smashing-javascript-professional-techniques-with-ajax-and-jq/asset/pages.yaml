    </tr>\n<tbody>\n</table>\n```\n\n# ADDING ALTERNATING ROW COLORS USING FILTERS\n\
    \nZebra striping is a common practice used by Web designers to make table rows\
    \ easier to read by adding a background color to each even or odd row, as in Figure\
    \ 7-2, an example of zebra striping from the Web site for Performable (www.performable.com).\
    \ Zebra striping can be done using backend programming languages such as PHP or\
    \ ASP.net, but the downside is that a developer must be involved in. The :even\
    \ and :odd filters in jQuery make it incredibly easy to add this styling to any\
    \ table.\n\nSet up a document ready function and, within, add two statements to\
    \ select the odd and even rows using filters. The first statement selects all\
    \ of the even rows and applies the CSS property background: #dedede (light gray).\
    \ The second statement is to ensure that all of the odd rows have a background\
    \ of white. Figure 7-3 shows the example as output in the browser after the page\
    \ has loaded.\n\n```\n$(document).ready(function() {\n  $('tbody tr:even').css('background',\
    \ '#dedede');\n  $('tbody tr:odd').css('background', '#ffffff');\n});\n```\n\n\
