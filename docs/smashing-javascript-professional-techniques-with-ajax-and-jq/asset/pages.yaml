  md: '# A Brief History of jQuery


    jQuery was created in 2006 by John Resig as an alternative to more complicated
    JavaScript libraries. jQuery enables Web designers and developers to write simpler
    JavaScript that still enables them to perform advanced JavaScript functions on
    their Web sites.


    jQuery is awesome because no hardcore programming knowledge is required to perform
    DOM manipulation. jQuery does some advanced areas that require prior JavaScript
    knowledge, such as using with the Ajax methods to get and post content, reviewed
    in Chapter 9, creating custom jQuery plug-ins, as reviewed in Chapter 11, and
    working with mobile Web sites, as reviewed in Chapter 10.


    Most designers and developers who I know, or have used, jQuery at some point in
    the past four years. When I ask why, they usually answer, "Is there anything easier?"
    Its ease of use attracts so many people to use jQuery; you don''t need a master''s
    degree in computer science to make a form submit via Ajax.


    You may be wondering what sort of things you can do with the jQuery library. The
    answer is, everything you can do with the native JavaScript API. I dive deeper
    into what you can do with jQuery throughout the book, but here is just a quick
    overview of the main features of jQuery:


    +   * Events that include mouse, keyboard, form and user interactions

    * Effects that show/hide, sliding, fading, and custom animations

    * Animation that allows you to make things move by utilizing CSS and native effects

    * Ajax methods to interface with server-side form processing using XML and JSON

    * Extensibility to create your own plug-ins that extend the jQuery API core

    * DOM manipulation

    * Cascading Style Sheet (CSS) manipulation

    * Utilities that provide browser detection and easier interfaces for common JavaScript
    functions


    # Who uses jQuery


    Web designers and developers are the main users of jQuery. I''ve seen jQuery used
    on a wide range of sites: everything from small-town mom and pop Web sites to
    full-blown enterprise sites. Because jQuery is free, all kinds of designers and
    developers use it. It brings the benefits of JavaScript to Web designers who may
    not know a thing about programming, but want to add cool effects to their Web
    site.


    jQuery became more popular when Google and Microsoft started to offer hosted solutions.
    A hosted solution is when a file is hosted from a Web server — in this case, through
    a CDN (content delivery network) — to increase performance from those Web sites
    that use the file. This move by Google and Microsoft indicated that jQuery would
    be a preferred library and a major player within the open source JavaScript library
    community. Google,


