  md: '# USING SELECTORS, FILTERS, AND CSS: JQUERY AT ITS CORE


    SELECTORS ARE THE CORE building blocks of jQuery: Everything you do with the DOM
    (Document Object Model) in jQuery incorporates the use of a selector because you
    need to choose which elements in the DOM you are selecting and manipulating. jQuery
    uses common CSS and XPath selectors that most Web designers and developers are
    already familiar with, as well as a few custom jQuery selectors. This makes jQuery
    flexible and easy to learn. Understanding how selectors work is a key component
    in utilizing jQuery to its fullest capability.


    where CSS selectors can''t help. Filters are often used in conjunction with selectors
    to give you great depth of control when selecting specific elements based on,
    say, their position in a group of elements, their visibility, or a characteristic
    of a format input such as checked or disabled. jQuery also offers a nice range
    of methods for adding and removing CSS classes and also applying styling directly
    to a DOM element.


    Filters give you more flexibility in selecting elements based on a characteristics
    in the DOM,


    In this chapter, I review how to use selectors, filters, and CSS with jQuery through
    various real-world tutorials, which gives you a great understanding of these fundamental
    jQuery methods.'
