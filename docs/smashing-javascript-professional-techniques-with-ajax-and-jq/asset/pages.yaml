    \ where you don't need to validate multiple fields with different types requiring\
    \ advanced validation. I demonstrate advanced validation using a popular jQuery\
    \ validation plug- at the end of this chapter. It's important to remember that\
    \ you never rely solely on client-side JavaScript; server-side validation should\
    \ always be present if client-side is not available.\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_205_0.png)\n\
