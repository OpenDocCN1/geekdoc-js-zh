  md: "The mouseover and mouseout event is triggered when the mouse enters the element\
    \ or descendant element of the element. The mouseenter and mouseleave events are\
    \ triggered only when the mouse enters the element, regardless of whether it has\
    \ children. The mouseover and mouseout event can trigger unintentionally and therefore\
    \ cause issues within your script.\n\n4. The mouseenter state is the first of\
    \ the two states and fires when the mouse enters the selected element, in which\
    \ case is the image tag found within the product-image element. With this, you\
    \ set up a variable tooltip. This variable stores the value that is extracted\
    \ using the attr method from the title tag.\n\n```\n$$(document).ready(function()\
    \ {\n  $('.product-image img').bind({\n    mouseenter: function () {\n      var\
    \ tooltip = $(this).attr(\"title\");\n      $(this).info().after('<p class=\"\
    tooltip\">'+tooltip+'</p>');\n    },\n    mouseleave: function () {\n    }\n \
    \ });\n});\n```\n\n5. The second statement inserts the value of the tooltip, which\
    \ is stored in the variable tooltip into the DOM with the class info. After the\
    \ tooltip is inserted into the DOM, it is wrapped with a p class of tooltip.\n\
    \n```\n$$(document).ready(function() {\n  $('.product-image img').bind({\n   \
    \ mouseenter: function () {\n      var tooltip = $(this).attr(\"title\");\n  \
    \    $(this).info().after('<p class=\"tooltip\">'+tooltip+'</p>');\n    },\n \
    \   mouseleave: function () {\n    }\n  });\n});\n```\n\n6. Finally, the mouseleave\
    \ state fires when the mouse leaves the selected element. This code hides the\
    \ tooltip that you have previously added using the hide() method attached to the\
    \ p.tooltip selector.\n\n```\n$$(document).ready(function() {\n  $('.product-image\
    \ img').bind({\n    mouseenter: function () {\n      var tooltip = $(this).attr(\"\
    title\");\n      $(this).info().after('<p class=\"tooltip\">'+tooltip+'</p>');\n\
    \    },\n    mouseleave: function () {\n      $(this).next('.tooltip').hide();\n\
    \    }\n  });\n});\n```\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_99_0.png)"
