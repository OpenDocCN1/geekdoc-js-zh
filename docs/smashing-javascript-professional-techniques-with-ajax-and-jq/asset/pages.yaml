  md: "# CHAPTER 6: IMPROVING NAVIGATION: MENUS, TABS, AND ACCORDIANS\n\n# ADDING\
    \ ADVANCED EFFECTS TO THE BASIC DROP-DOWN MENU USING ANIMATE\n\nIn this section,\
    \ I show you how to add an opacity change that occurs as the menu slides, which\
    \ is an advanced animation effect that uses the animate method to the basic drop-down\
    \ that I showed you how to create in the previous tutorial. All of the code from\
    \ the previous example is the same, except for two lines in the jQuery. The animate\
    \ method gives you more control over how the drop-down do to appear on the screen\
    \ by allowing you to pass in to four arguments: CSS properties, duration, easing,\
    \ and callback. In this example, I want to toggle the height and change the opacity\
    \ and set the duration to 500 milliseconds. You can also use the keyword fast\
    \ for 200 milliseconds and slow for 600. The result is shown in Figure 6-7.\n\n\
    In short, switch the slide effect with the animate method. Pass along the opacity\
    \ and height CSS properties to the animate method to alter the display of the\
    \ DOM elements of hovering over the user's mouse pointer:\n\n```\n$(document).ready(function()\
    \ {\n  $('#navigation1 .submenu').hover(function() {\n    $(this).find('.submenu').animate({opacity:\
    \ 1,height: 'toggle'}, 500);\n    $(this).closest('.a').addClass('active');\n\
    \  }, function() {\n    $(this).find('.submenu').animate({opacity: 0,height: 'toggle'},\
    \ 500);\n    $(this).find('a').removeClass('active');\n  });\n});\n\n```\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_152_0.png)\n\
    \nFigure 6-7: Advanced effects that have been applied to a drop-down menu as viewed\
    \ in Firefox"
