  md: '# CHAPTER 2: GETTING STARTED WITH JQUERY


    # How to Run JavaScript Live in Firefox Through the Firebug Console


    The Firebug is a great way to use jQuery or JavaScript on a page without having
    to add it to your HTML, run it on a Web server, and so on. The Firebug console
    also gives feedback in form of error messages if your JavaScript has a problem.
    It''s a great way to test code before writing it all out in your HTML.


    # Advanced JavaScript Debugging with Firebug


    For more advanced JavaScript applications, you can use the JavaScript debugger
    tool in Firebug. The JavaScript debugger is a very powerful tool that allows you
    to breakpoint to different parts of the script so you can stop, start, and pause
    your script and take a closer look at variables and objects. I don''t focus too
    much on the JavaScript debugger in this book because it''s for more advanced JavaScript
    programmers.


    # JavaScript Debugging with Other Web Browsers


    Firefox is not the only browser with Web developer tools. Apple Safari, Google
    Chrome, and Internet Explorer all have similar toolsets, but are not as powerful
    as Firefox''s Firebug. The Safari/Chrome debugger shares some common features
    with Firebug, including the inspect element and resource management tab, but they
    lack a powerful debugger like the one included with Firebug. I have limited experience
    working with the other tools. I have used IE/Safari for spot-checking, but Firebug
    is always my main choice for development.


    The basics of JavaScript are all concepts that designers and developers should
    be familiar with prior to entering the world of jQuery and JavaScript libraries.
    That being said, you can use and create basic scripts without needing a solid
    base in JavaScript, but knowing how JavaScript works accelerates your rate of
    development and understanding, which leads to high productivity.


    # DOWNLOADING THE JQUERY LIBRARY


    Before you start developing with jQuery, you first need to download the jQuery
    library from the jQuery Web site. The jQuery library is a JavaScript file that
    can be accessed in either of two ways:


    +   - Download the jquery.js and host it locally on your Web site

    - Use a hosted version from a CDN (content delivery network)


    I recommend downloading a copy of jQuery to your local computer for development
    work and testing, and specifically for when an Internet connection is unavailable.
    To download jQuery, follow these steps:


    +   1. Point your Web browser to the jQuery site at www.jquery.com.

    2. Click the Download link located in the main navigation bar at the top of the
    page, which offers many different ways to access the jQuery Library. Figure 2-11
    shows the download page.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_38_0.png)'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# PART I: INTRODUCING QUERY AND JAVASCRIPT


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_39_0.png)


    Figure 2-11: The jQuery download page


    Many Web sites use free CDN-hosted solutions because they have proven to be reliable
    and fast-loading solutions that provide up the bandwidth from your own site. CDN
    stands for content delivery network, which is a hosted solution provided by companies
    with large networks such as Google, Microsoft, Akamai, and so on.


    Content delivery networks offer the benefit of a larger, high-speed network, which
    serves up the jQuery library from many locations. When a user brings up your site
    in their browser, their location triggers the server closest to them geographically
    to deliver the jQuery library, which in turn decreases the load time. The Google-hosted
    Ajax pages in Figure 2-12 has various options to include jQuery and many other
    libraries in your Web site or others.


    When using the hosted solution, you can specify in the URL version of jQuery to
    use, as shown in the following code example using Google jQuery:


    ```

    <script src="http://ajax.googleapis.com/ajax/jquery/1.4.2/jquery.min.js"></script>

    ```


    Google and Microsoft are large companies with high market penetration, and many
    Web sites already use their hosted jQuery libraries. The more Web sites that use
    hosted versions, the higher the chance that you have already grabbed that file
    from another Web site, so it''s already cached in your browser. (Browser caching
    occurs when you grab a file from a Web site.)'
