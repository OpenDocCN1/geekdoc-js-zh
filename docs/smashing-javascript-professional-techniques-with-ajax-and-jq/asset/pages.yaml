  md: '# CHAPTER 10: CREATING AND USING JQUERY PLUG-INS


    # INCORPORATING POPULAR JQUERY PLUG-INS INTO YOUR WEB SITE


    jQuery has a huge audience of Web designers and developers who contribute great
    plug-ins. The plug-ins have a wide range of applications from Ajax to image galleries.
    If you are looking to do something, the chances are that someone has already created
    a plug-in for that purpose.


    The jQuery Web site has a section (http://plugins.jquery.com/) dedicated to plug-ins
    that allows you to submit your own plug-ins as well as bug reports and on for
    third-party plug-ins that you are using on your site, as shown in Figure 10-16.


    Plug-ins can really speed development time. The documentation for plug-ins is
    usually pretty good, but if you get stuck and can''t find the author to ask for
    help, the jQuery forum (http://plugins.jquery.com/) is a great place to go for
    support and advice.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_280_0.png)


    Figure 10-16: The section of the jQuery Web site dedicated to plug-ins


    ©2010 The jQuery Project


    # USING JQUERY TOOLS


    Similar to jQuery UI, jQuery Tools (http://flowplayer.org/tools/index.html), shown
    in Figure 10-17, is a UI library with six components: tabs, tooltips, scrolling
    functionality, forms, and toolboxes. This library is a great alternative to jQuery
    UI because of its small size, around 16 KB. jQuery UI has a lot of features, but
    it also comes with a lot'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# PART IV: EXPLORING ADVANCED JQUERY


    features that you might not use. That means you have to include a really large
    library, which affects page load speed and Web site performance. That gets annoying
    if you''re not using all of the components in the first place.


    jQuery TOOLS - The missing library for the Web


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_281_0.png)


    jQuery Tools is a collection of the most important user-interface components for
    modern websites. Used by large sites all over the world.


    Figure 10-17: The jQuery Tools home page


    Reproduced by permission of Flowplayer Ltd


    jQuery Tools allows you to download the components that you plan to use, keeping
    the overall file size of the library to a minimum. jQuery Tools is a much slimmed-down
    UI library because it offers only six components, with no theme library or CSS
    framework.


    Adding a design around jQuery Tools components is not as streamlined as using
    jQuery UI. With no CSS framework or fancy theme library, you are left to define
    your own HTML and CSS. Depending upon the Web site or application that you are
    working with, using jQuery Tools instead of jQuery UI can offer benefits such
    as a much smaller library footprint (about 4 KB), the ability to use existing
    HTML code because you don''t have to conform to a set HTML structure, and a usable
    set of components without extra features that you don''t use. I found that if
    your site has some existing design and functionality, it is much easier to work
    with jQuery Tools and retrofit some functionality such as tabs or overlay into
    your code.


    # Setting Up jQuery Tools


    jQuery Tools can be set up in much the same way as jQuery UI. You can either download
    the entire package plug-in with all of the components already included, or you
    can pick and choose which components you want and download just those pieces.'
  merge: -1
  pgno: 281
