  md: '# PART IV: EXPLORING ADVANCED JQUERY


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_315_0.png)


    Figure 12-3: The jQuery API documentation


    © 2010 The jQuery Project


    The jQuery team has also implemented an impressive search feature that makes it
    easy to find what you are looking for. I''ve personally never run into any problems
    trying to find something. The jQuery Web site is also vastly indexed in search
    engines, which is another way to find information on different methods throughout
    the API.


    Each function or method has its own dedicated page with a description, code examples,
    and a comments section. Figure 12-4 shows the css ( ) method dedicated page.


    # FINDING JQUERY TUTORIALS


    The jQuery Web site also houses a section consisting of tutorials created by members
    of the jQuery community and posted by the jQuery team, as seen in Figure 12-5.
    There are tutorials on every part of the API, plus tutorials in other languages.
    This is a great place to start if you want to learn how to do something new with
    jQuery. The jQuery tutorials section is accessed by navigating to docs.jquery.com/Tutorials.


    # ATTENDING A JQUERY MEETUP OR CONFERENCE


    The jQuery meetups are accessed by navigating to http://meetups.jquery.com/. Version
    1.3.2 contains a new section called Meetups, seen in Figure 12-6, which is powered
    by the Web Meetup (www.meetup.com). Meetups are unofficial clubs or gatherings
    for jQuery enthusiasts. They are great ways to network and learn more about jQuery.
    I highly recommend joining a jQuery meetup in a location near you.'
