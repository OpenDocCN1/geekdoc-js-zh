  md: '# PART II: LEARNING THE JQUERY FUNDAMENTALS


    jQuery has a hover event that uses the native JavaScript events. A tooltip is
    just one type of interaction that can be used with the hover event, and there
    are many other possibilities ranging from drop-down navigation menus to image
    previews such as those found on the Zappos Web site, in Figure 4-8.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_97_0.png)


    Figure 4-8: The Zappos Web site image previews when you roll over the mouse


    It''s easy to create a custom tooltip that displays using the hover event in jQuery.
    This example is based around an image with a caption that I want to display directly
    underneath over the image, as shown in Figure 4-9. You might run into a similar
    situation where you don''t want a caption to display all the time, but only when
    the user hovers over the mouse.


    +   1. By creating the HTML for the image so that it has a title attribute set.
    You''re using the title attribute to ensure that users JavaScript can still see
    the tooltip on the image; this is a good example of progressive enhancement. (See
    Chapter 1 for a refresher on progressive enhancement).


    ```

    <h1>Hello jQuery</h1>

    <div class="cart">

    <h2>Shopping Cart</h2>

    <div>

    <div class="product">

    <h3>iPhone 4</h3>

    <div class="product-image"><img src="images/iphone.jpg" title="Steve Jobs holds
    up the newest iPhone 4 alt="Steve Jobs"></div></div>

    <p class="info">iPhone 4 is a GSM cell phone with a high-resolution display, FaceTime
    calling, HD video recording, a 5-megapixel camera, and more.</p>

    <p class="price">$299.99</p>

    </div>

    ```'
