  md: "# PART III: APPLYING JQUERY TO YOUR WEB SITE\n\n```\n<td>In-stock</td>\n</tr>\n\
    &lt;/table&gt;\n```\n\n2. Using the table ID #data, create a selector statement\
    \ that inserts a div with an ID #nav after the #data element on the page, which\
    \ will show underneath the #nav element is used to hold the page number links.\n\
    \n```\n$('#data').after('<div id=\"nav\"></div>');\n```\n\n3. Set up a variable\
    \ rowsShow, which holds the value for how many rows you need to show on each page.\n\
    \n```\nvar rowsShow = \n```\n\n4. Set up a variable rowsTotal, which gets the\
    \ number of rows in the element that you are paginating. The #data element is\
    \ selected and the length property is added to the end, which in this case should\
    \ return 12.\n\n```\nvar rowsTotal = $('#data tr').length;\n```\n\n5. Set up a\
    \ variable numPages, which will be equal to the value of rows divided by rowsShow.\
    \ Notice that the equation is wrapped by the Math.round native JavaScript method.\
    \ Math.round rounds the product of the equation to the nearest number\n\n```\n\
    var numPages = Math.round(rowsTotal/rowsShow);\n```\n\nIn any of totals, when\
    \ you create a variable, if you would like to quickly see that the variable is\
    \ returning a number, insert an alert statement with the variable inside of the\
    \ parenthesis, like this: alert(rowsTotal). This doesnt just to jQuery, but is\
    \ a native JavaScript function that can handle all JS debugging.\n\n6. Set up\
    \ a for loop to iterate through the number of pages and create page number links\
    \ that are used to navigate the pages. Add a variable called pageNum; the value\
    \ is set to i+1, being the iteration variable in the loop. This ensures that the\
    \ page starts at 1. Next, add a selector for the for loop that selects the #nav\
    \ element and adds an anchor link with the rel tag to the index. The page number\
    \ is set to the pageNum\n\n```\nfor (i = 0;i<numPages;i++) {\nvar pageNum = i+1;\n\
    $('#nav').append('<a href=\"#'+i+''>'+pageNum+'</a>');\n}\n```\n\n7. Add up a\
    \ statement to hide all of visible rows in the #data table.\n\n```\n$('#data tr').hide();\n\
    ```\n\n8. Add a statement that selects the first row and shows it.\n\n```\n$('#data\
    \ tr:first').show();\n```\n\n9. Add a statement that selects all of the rows in\
    \ the #data table and use the slice method to limit only first four rows to be\
    \ shown. The slice method allows you to pass two parameters (start and end) to\
    \ slice out a section of any\n\n```\n$('#data tr').slice(0, rowsShow).show();\n\
    ```\n\n10. Add a statement that selects the first page number and adds a class,\
    \ active, to it. This ensures that each page anchor link is selected when the\
    \ pages are loaded.\n\n```\n$('#nav a:first').addClass('active');\n```\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_181_0.png)"
  merge: -1
  pgno: 181
- img_proc: true
  md: "# CHAPTER 7: CREATING INTERACTIVE AND EXCITING TABLES\n\n11. Attach a click\
    \ event to all of the page number links in the #nav element. This click event\
    \ is used to control the pagination; this event contains the guts of the script.\n\
    \n```\n$('#nav a').bind('click', function() {\n  });\n```\n\n12. The first statement\
    \ that is added to the click event removes the active class from whichever link\
    \ is currently active.\n\n```\n$('#nav a').bind('click', function() {\n  $('#nav\
    \ a').removeClass('active');\n  });\n```\n\n13. The next statement adds only the\
    \ active class to the page number link that has been clicked.\n\n```\n$('#nav\
    \ a').bind('click', function() {\n  $('#nav a').removeClass('active');\n  $(this).addClass('active');\n\
    \  });\n```\n\n14. Add a variable called currPage, which stores the value of the\
    \ rel tag that was set up in the for loop.\n\n```\n$('#nav a').bind('click', function()\
    \ {\n  $('#nav a').removeClass('active');\n  $(this).addClass('active');\n  var\
    \ currPage = $(this).attr('rel');\n  });\n```\n\n15. Add a variable startItem,\
    \ which stores the product of currPage multiplied by rowsShown.\n\n```\n$('#nav\
    \ a').bind('click', function() {\n  $('#nav a').removeClass('active');\n  $(this).addClass('active');\n\
    \  var currPage = $(this).attr('rel');\n  var startItem = currPage * rowsShown;\n\
    \  });\n```\n\n16. Add a variable endItem that stores the product of startItem\
    \ plus rowsShown.\n\n```\n$('#nav a').bind('click', function() {\n  $('#nav a').removeClass('active');\n\
    \  $(this).addClass('active');\n  var currPage = $(this).attr('rel');\n  var startItem\
    \ = currPage * rowsShown;\n  var endItem = startItem + rowsShown;\n  });\n```\n\
    \n17. The final statement that is added to the click event controls which records\
    \ are shown when a particular page anchor tag is clicked. Using a selector, grab\
    \ all the table rows within the #data table. The results of this tutorial are\
    \ shown in Figure 7-12.\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_182_0.png)"
  merge: -1
