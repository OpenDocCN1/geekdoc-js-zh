    # DISPLAYING A BACKUP IMAGE USING THE ERROR EVENT


    I work with a handful of e-commerce sites that sell more than 200 products per
    site, which equals around 600 product images on each site when you take into account
    the different-sized images (small, thumbnail, and large) for each product. When
    an image is broken on a product page, the only way I can usually find out is by
    browsing the site until I see the image. Using the jQuery error event, I can detect
    whether an image is missing and set a default image to the attribute of the matched
    element.


    +   1. You need to set up an image tag, which can be as simple as the following
    code. You just need to remember to give a unique ID to the image tag so that you
    can select.

    `<img src="images/loc_portrait10.jpg" id="portrait" />

    2. Next, set up a selector to set the ID equal to portrait.

    3. Add the error event to the selector that you set up in the previous step. The
    error event fires only if the browser does not load the file correctly.

    4. Next, set up a handler function so that when the error fires, something happens.
    In this case, set a default image to the source of the matched element.


    ```

    $$(''#portrait'');

    $(''#portrait'').error(function() {

    $(this).attr(''src'', ''images/default.jpg'');

    });

    ```


    # GETTING STARTED WITH EVENT DELEGATION


    Event delegation and handling in jQuery refers to the execution of events by attaching
    listeners that waits for events to bubble up through the elements in the DOM.
    Figure 4-5 shows how of this occurs in JavaScript. If you have ever worked with
    ActionScript 3.0, the concept of event bubbling should be familiar because it
    is handled in a similar way in jQuery and JavaScript. There are two methods that
    an event can trigger during the listening phase: event capturing and event bubbling.


    Event capturing occurs when an event flows downwards towards the descendants of
    the DOM. Event bubbling is what occurs when an event flows upwards through the
    DOM starting with the source of the event. Most events use the event bubbling
    except for focus and blur. Event capturing differs from event bubbling in the
    direction of how the event flows through the document, and you could argue that
    event bubbling is faster and more efficient. jQuery uses the event bubbling method
    for all of the events.


    An event handler is a function that executes your code as the event occurs. A
    jQuery method is used to attach the event handler to an event. As of jQuery 1.4.2,
    the library offers three different methods for attaching events to elements: `bind()`,
    `live()`, and `delegate()`.'
