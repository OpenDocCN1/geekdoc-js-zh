  md: "# CHAPTER 9: WORKING WITH DYNAMIC DATA AND AJAX\n\nQuery Ajax XML\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_242_0.png)\n\
    \nFigure 9-12: The XML being pulled and loaded to display My Favorite Books widget\n\
    \n# WORKING WITH JSON DATA\n\nJSON stands for JavaScript Object Notation, which\
    \ is similar to XML, but was created only for JavaScript. JSON allows you to create\
    \ your own data structures in the form of name/value pairs. JSON and XML are alike\
    \ in that both are hierarchical and can be processed with Ajax.\n\nJSON has some\
    \ advantages over XML; I personally find that JSON is easier to read. You don't\
    \ have tags to define the structure; the structure is defined by data. This cleaner\
    \ approach leads to code that is much more concise than XML and easier to work\
    \ with and understand. Debates continue to rage online about which JSON or XML\
    \ is better, so it comes down to personal opinion.\n\nThe following code is an\
    \ example of JSON code also shown in Figure 9-13. I have used the same data from\
    \ the preceding XML example so you can see the two types of data compare. At a\
    \ quick glance, you can see that the JSON is much easier to read. Whether that's\
    \ a big advantage is debatable — most of the time, scripts, not a human, but will\
    \ be reading the JSON code.\n\n```\n{\"books\":[\n  \"title\": \"I'm a Stranger\
    \ Myself: Notes on Returning to America After 20 Years Away\"\n]}\n```"
