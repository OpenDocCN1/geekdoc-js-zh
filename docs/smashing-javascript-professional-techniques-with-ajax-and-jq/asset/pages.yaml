    # INCORPORATING JQUERY UI FEATURES INTO YOUR WEB SITE


    After you understand the basics of the jQuery UI plug-in, you can begin incorporating
    different components into your site with ease. In the following section, I introduce
    to how to set up the tabs, accordion, autocomplete, and datepicker components.


    # Tabs


    The jQuery UI tabs is a widget, when applied to DOM elements, creates dynamic
    tabs that can be used in a number of ways to add interactivity to your Web site.
    I recently used the tabs to build an interactive slideshow for the home page of
    a Web site as shown in Figure 10-9. It was incredibly easy to set up using jQuery
    UI and saved me lot of time by using code that is tried and true. The tabs in
    this example are situated along the bottom of the images. Each tab correlates
    to an. As the tabs change, the images change using a fade transition.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_272_0.png)


    Figure 10-9: Thebed slideshow on the Laithwaites Web site

    Reproduced from Laithwaiteswine.com'
