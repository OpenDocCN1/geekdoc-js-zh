  md: '# ENHANCE USER EXPERIENCE BY CREATING RICHER AND MORE INTERACTIVE WEB INTERFACES


    Smashing jQuery demonstrates how you can create rich Web interfaces by easily
    integrating the jQuery framework into your Web site with minimal JavaScript knowledge.
    jQuery allows Web designers to build interactivity that is compatible across all
    major browsers through their Web sites. Jake Rutter, an experienced Web designer
    and developer, shows you how to add interactivity through a series of tutorials,
    providing you with the ability to create great Web applications.


    jQuery can really speed up your development time and allow you to write interactive
    components that you thought were impossible without serious programming knowledge.
    Smashing jQuery provides practical techniques, solutions, and examples with real-world
    solutions that you can use in your everyday environment building Web and mobile
    sites.


    TOPICS COVERED INCLUDE:


    +   - JQUERY FUNDAMENTALS

    - AJAX REQUESTS

    - EVENTS AND EFFECTS

    - DOM MANIPULATION WITH TUTORIALS ON SUCH AS BUILDING A DROP-DOWN MENU

    - GALLERY LIGHTBOXES

    - FORM MANAGEMENT

    - DYNAMIC TABULAR DATA

    - MOUSE EVENT EFFECTS

    - MODAL DIALOG BOXES

    - CUSTOM jQuery PLUG-INS AND MUCH MORE


    Jake Rutter is a Web designer and developer with more than nine years of experience
    in user interface design and front-end development, working with HTML, CSS, and
    JavaScript on Web sites and applications coded in PHP, Ruby on Rails, ASP, and
    Java.


    Visit www.wiley.com/go/smashingjquery to download example code files.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_337_0.png)


