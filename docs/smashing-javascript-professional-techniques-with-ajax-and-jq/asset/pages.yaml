    # CSS Working Group sets out Priorities for 2010


    The CSS Working Group met in Oslo last month for three days of face to face meetings.
    The available, on the CSS Working Group''s blog, reveal removals of CSS3 1 features,
    a draft of the Working Group''s priorities for 2010 and even considering Microsoft
    to accept over their consensus draft result published this year.


    # CSS3 Rocks


    Google has recently updated its HTML5 rocks, originally launched earlier this
    year, with new demos and tutorials for HTML5 and CSS3. The latest update adds,
    among other, a demo of the HTML5 video tag, a demo of CSS3 transitions, and offering
    a number of other demos for the new possibilities afforded by HTML5 and CSS3.


    Since being updated the site has been quite a still online and if you''ve not
