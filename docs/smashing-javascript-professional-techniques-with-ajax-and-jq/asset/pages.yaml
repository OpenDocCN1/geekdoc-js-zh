  md: "jQuery UI includes an autocomplete component that is incredibly easy to set\
    \ up, requiring only a few lines of JavaScript. In the following example, I review\
    \ how to set up the basic autocomplete component shown in Figure 10-13.\n\n+ \
    \  1. Download the Autocomplete component in a jQuery UI bundle using the Build\
    \ Your Download page (http://jquery.com/download) and set up the jQuery UI as\
    \ a JavaScript include in the head of your Web page:\n\n```\n<script type=\"javascript\"\
    \ src=\"js/jquery-ui-1.8.4.custom.min.js\"></script>\n```\n\n+   2. Include the\
    \ theme CSS file:\n\n```\n<link type=\"text/css\" href=\"../themes/base/jquery.ui.all.css\"\
    \ rel=\"stylesheet\" />\n```\n\n+   3. Create an input field with an ID of #search.\
    \ Attach the autocomplete component to it:\n\n```\n<label>Search</label>\n<input\
    \ type=\"text\" id=\"search\" />\n```\n\n+   4. The autocomplete method contains\
    \ an option called source. This is the source of the values that are matched against\
    \ the characters you type into the input field. You can set the source to be a\
    \ remote script, an XML file, or in this case, an array with tags. Please refer\
    \ to the jQuery UI documentation for further information about setting different\
    \ types of sources.\n\n```\nvar availableTags = [\n  \"Nike\",\n  \"Puma\",\n\
    \  \"Aldo\",\n  \"Tiger\",\n  \"Cole Haan\",\n];\n```\n\n+   5. Create a statement\
    \ that selects the #search element, attaches the autocomplete method, and passes\
    \ in the source in the option set to the availableTags variable that was set up\
    \ in the previous step.\n\n```\n$('#search').autocomplete({source: availableTags});\n\
    ```\n\n# Datepicker\n\njQuery UI also includes a very slick datepicker component\
    \ that applies a date picker (a little pop-up calendar that allows you to select\
    \ a date) to any input field that it is applied to, similar to the date picker\
    \ shown on the TripAdvisor Web site in Figure 10-14. Date pickers have become\
    \ commonplace; I can't think of the last time I had to manually enter a date.\n\
    \n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_277_0.png)"
