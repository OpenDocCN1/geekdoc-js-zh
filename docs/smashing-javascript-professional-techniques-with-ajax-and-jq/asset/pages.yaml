    # LIMITING CHARACTER COUNTS ON INPUT FIELDS


    Being able to limit a character count on an input field can be used to restrict
    how many words are included or how many characters you can include in your status
    message. The 140-character limit on Twitter (www.twitter.com) has made the limiting
    character count type of script quite popular in the past year, but it''s still
    a challenge to keep your message or thought under 140 characters. A character
    count limit can also display to how many characters they have left to work with
    under the limit.


    In this tutorial, I show how you can make a remaining character script shown in
    Figure 8-8 and the one used on Twitter.com when creating status updates shorter
    than 140 characters using the jQuery event keypress.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_199_0.png)


    8-8: The script in action as text is entered into the field and the counter counts
    down


    +   1. The first step involves setting up the HTML. Set up an input field and
    give it an ID of status. This input is used with the change event to detect the
    characters being added.

    <textarea cols=''50'' rows=''5'' id=''status''></textarea>

    2. Add an empty div called counter, which is where the remaining character number
    shows up as you type into the field.

    <div id=''counter''></div>'
