  md: '# SETTING UP YOUR DEVELOPMENT ENVIRONMENT


    To get started up your development environment, first, choose which code editor
    you want to use. There are many popular choices such as Dreamweaver, Coda, TextMate,
    or EditPlus name a few. I primarily use Coda, Mac OS software application built
    for Web designers and developers to create Web sites and applications. This software
    is an integrated toolset that has features such as FTP; terminal (command prompt),
    file management, CSS and code editors, syntax highlighting, auto completion, extended
    find and replace functions, preview, and multi-language support. If you don''t
    want to use Coda, you are also free to use old Notepad (Windows) or TextEdit (Mac),
    but you won''t get all the increased features that a code editor can provide.


    Before you can start writing Query, you need a place to test your work: a development
    environment. A development environment can be either a local development setup
    consisting of a local Web server and browser or an external Web host. It basically
    allows you to test any work you are doing in a simulated live environment. The
    beauty of using an application like Coda or Dreamweaver is that you can set up
    your Web host in the application, which allows you to work directly off the server
    and makes testing breeze.


    Some might argue that you can just work from a local folder and open each file
    in a browser, but this won''t give you an accurate view of a live environment.
    You might end developing a few Query functions like this, but when you go live,
    you get a different output. I believe it''s better to work in an environment that''s
    as close to life possible from the start.


    Local development environments are easy to set up and beneficial when you''re
    not able to access the Internet. For Mac users, the most popular choice is MAMP
    (www.mamp.info/), which stands for Mac/Apache/MySQL/PHP as shown in Figure 2-1.
    It is an all-in-one development that you can run locally and test as if you were
    on a live Web server. For Windows users, the Windows version is called WampServer,
    which stands for Windows/Apache/mysql/PHP Server (www.wampserver.com/en/). I would
    suggest whenever possible that you use Apache as a Web server. It''s a very stable
    open source server that runs primarily on Linux.


    Another alternative for Web developers using Mac OS X is to the built-in Apache
    Web server on Mac OS. To set up Apache server on a Mac, follow these steps:


    +   1. Open System Preferences. You should see a group of icons that allow you
    to control settings as Personal, Hardware, Internet and Wireless, System, and
    Other.

    2. Click the Sharing icon to open the Sharing pane and then select the Web Sharing
    box in the list of sharing services. The Sharing pane displays settings to allow
    you to share files, screens, printers, and so on. If the check box is already
    selected, skip this step.

    3. Make sure the Web Sharing box is selected, as shown in Figure 2-2. You have
    started your Apache Web server. You should see a red icon green on the right side
    of the pane and text that says, Your personal website, is green in the Sites folder
    in your home folder, is available at this address: http://xx.xx.xx.xx/~yourname.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_31_0.png)'
  merge: -1
  pgno: 31
- img_proc: true
