    | Numbers only | (^([0-9]+$) |

    | Letters only | (^([A-Za-z]+$) |


    # COPYING THE CONTENTS OF ONE FIELD INTO ANOTHER


    If you have ever purchased something online, you probably had to fill out a form
    by entering your billing address and shipping address. For most consumers, this
    information is the same, so forms often have a Same As Billing check box that
    says "as billing" that copies over all the fields from billing to shipping, preventing
    the customer from needing to re-enter all of information. This check box uses
    a copy field functionality. Not only does it save the customer time, but also
    reduces the likelihood of mis-entering data. Figure 8-14 shows an example of a
    copy field check box on the checkout page of Best Buy''s Web site (www.bestbuy.com).


    The following script shows how to set up a copy field check box, which can be
    added to any form. It doesn''t have to be a billing/shipping form, as it is in
    the following example. The working script is shown in Figure 8-15.


    +   1. Start off by creating two sets of address input fields. The first set contains
    the billing address and the second set contains the shipping address. Add an input
    check box before the fields to control the copying of the fields from billing
    to shipping.'
