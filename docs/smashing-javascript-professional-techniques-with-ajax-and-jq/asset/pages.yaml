  md: '# CHAPTER 11: DEVELOPING THE MOBILE WEB WITH JQUERY


    +   - Header and footer tags for better content organization within HTML files,
    instead of relying on div elements.

    - Integrated audio/video tag support

    - Canvas tags to create graphics and images on the fly

    - Geolocation API (application programming interface)


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_302_0.png)


    # GETTING UP TO START MOBILE WEB DESIGN


    The hardest part about designing for mobile Web is testing your work and deciding
    which mobile platforms to support. I focus on support of Google Android and Apple
    iPhone. To facilitate this, you could purchase an iPhone and an Android phone,
    but this would end up costing a lot of money and effort. Instead, both companies,
    Apple and Google, have created developer portals and offer a development SDK (Software
    Development Kit) that includes an emulator. An emulator is a desktop application
    that you can add to your desktop to simulate iPhone or Android mobile devices
    and be able to test both native applications and Web applications and Web sites.'
