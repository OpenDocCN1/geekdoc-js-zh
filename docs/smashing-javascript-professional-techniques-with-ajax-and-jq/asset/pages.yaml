    4. After the page load, ensure that only the first menu element and content element
    are displayed. The following jQuery hides all the instances of accordion-content
    (content element) that are not the first element by a combination of the not()
    method) and .first filter.


    ```

    $$(''.accordion-content'').not('':first'').hide();

    .not() method filters elements or selectors that matched using the selector that
    precedes it. It can be in the form of a filter, as seen in this, or you can pass
    a specific element, such as seen in the example of the next step.

    ```


    5. You have hidden all the instances of accordion-content that are not the first
    element, create another statement to apply the effect to only the first accordion-content
    element:


    ```

    $$(''.accordion-content:first'').show();

    ```


    6. To create an active or selected item, add a class to the CSS file called header-active.
    Apply this class to the first accordion-header element using the following statement:


    ```

    $$(''.accordion-header:first'').addClass(''header-active'');

    ```


    I have also added icons to the accordion menu and use the element span tags to
    place the icons on the header. I have set up a class called icon-active that shows
    a down arrow graphic notifying the user of which section is open. When the icon-active
    class is not applied, a right arrow graphic is displayed using the span tag. Use
    :first filter to select the first accordion-header element, and then chain a find
    to search for the span and add the class icon-active.


    ```

    $$(''.accordion-header:first'').find(''span'').addClass(''icon-active'');

    ```


    7. Now begins the function stuff: making the accordion react to a user input.
    Attach a click event to the accordion-header menu element.


    ```

    $$(''.accordion-header'').click(function () {

    });

    ```


    8. The first statement added to the click event handler is to make sure any item
    already removed and activates. You can do this by selecting any visible instance
    of accordion-content and applying the slideUp effect to it. Use the prev method
    to go back up the DOM tree element, which in this case is the accordion-header,
    and remove the class header-active from it.


