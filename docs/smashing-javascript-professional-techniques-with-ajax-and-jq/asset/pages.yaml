    3. Create an empty callback function parseXML that will be used to accept the
    xml as a data argument. jQuery on callback automatically passes arguments to the
    callback, whether it''s set up to receive them or not. The arguments passed depend
    on whether it''s the success or error callback that has been set up.


    ```

    function parseXML(xml) {

    }

    ```


    4. Add a selector statement within the parseXML function, which uses the find()
    and each() methods to find each book node.


    ```

    function parseXML(xml) {

    $(xml).find("Book").each(function() {

    });\}

    ```


    5. Set up four variables: author, title, category, and pubdate. Each variable
    is assigned a value using difference selector statements. Because author is an
    attribute of the book node, you can use the attribute filter to select it. The
    remaining values can all be obtained by the find() method to search for each node
    and grab the text out of it.


    ```

    function parseXML(xml) {

    $(xml).find("Book").each(function() {

    var author = $(this).attr("author");

    var title = $(this).find("title").text();

    var category = $(this).find("category").text();

    var pubdate = $(this).find("pubdate").text();

    });

    }

    ```


    6. After you have set up all variables, it''s time to create the HTML that will
    dynamically show up on the page. Create a selector statement that sets up a list
    item <li></li> and, using the HTML() method, adds all of the variables that we
    have set up mixed with some HTML tags for formatting. As each list item is created,
    it is appended to the #books unordered list.


    ```

    function parseXML(xml) {

    $(xml).find("Book").each(function() {

    var author = $(this).attr("author");

    var title = $(this).find("title").text();

    var category = $(this).find("category").text();

    var pubdate = $(this).find("pubdate").text();

    $(''<li></li>'').html(''<b>Title:</b> '' + title + ''<br><b>Author:</b> '' + author
    + ''<br><b>Category:</b> '' + category + '' '' + pubdate).appendTo(''#books'');

    });

    }

    ```


