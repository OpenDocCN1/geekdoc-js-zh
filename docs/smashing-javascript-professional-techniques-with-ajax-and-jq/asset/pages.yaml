  md: '# Introduction


    jQuery is a key part of modern web design and development. It has simplified event
    handling in an easy and fast way. It has simplified a lot of working with the
    DOM. Through jQuery, it is easy to write code for development that would have
    been difficult or impossible with plain JavaScript. It also makes asynchronous
    programming easier.


    This book will provide you with jQuery examples, and help you learn how to use
    jQuery more effectively, mastering asynchronous programming, mastering jQuery
    is better.


    # PART 1: INTRODUCING JQUERY AND JAVASCRIPT


    The first part of this book starts with an introduction to jQuery, JavaScript,
    and development. We will cover the basics of the DOM, how it works, and what it
    is. A full understanding of these concepts is important for using jQuery effectively.
    We will also cover JavaScript for those who are new to programming, and show how
    to use jQuery selectors, events, and effects to build applications.


    # PART 2: LEARNING THE JQUERY FUNDAMENTALS


    The second part of this book takes you on a journey through the fundamentals of
    jQuery, including selectors, events, and methods. We will explore how jQuery''s
    powerful selectors work, how to traverse and manipulate the DOM, and how to use
    AJAX. You will also learn how jQuery effects can be used to enhance pages. We
    will also cover jQuery techniques for building web applications, and creating
    plugins.


    # PART 3: APPLYING JQUERY TO WEB SITES


    The final part of this book shows how you can use jQuery to create dynamic, interactive
    websites. In this part, you will learn about jQuery UI, plugins, and how to use
    jQuery Mobile to set up mobile-friendly applications. We will also cover some
    advanced techniques and reference guides.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# INTRODUCTION


    # PART 4: EXPLORING ADVANCED JQUERY


    There comes a point in every jQuery developer''s career when they want to move
    on to more advanced topics such as working with creating plug-ins, writing jQuery
    to handle Ajax requests, or working with jQuery mobile apps. Part 4 delves into
    these advanced topics. Plus, I include a chapter that outlines all of the jQuery
    resources that are available.


    # WHOS THIS IS FOR


    This book was written for Web designers and front-end developers who are just
    starting out with jQuery. You may have installed and set up a plug-in, but you
    aren''t really familiar with how to write your own jQuery. Maybe you''ve heard
    the buzz about jQuery and are looking for someone to show you how to use jQuery
    to improve your Web site. Readers should have a solid background in HTML and CSS
    and a basic understanding of JavaScript.


    # ABOUT THIS BOOK


    Code and URLs in this book use a special font that looks like this: www.jquery.com.
    Code listings have been colorized similar to how IDEs and text editors use syntax
    coloring to help distinguish between elements of the syntax, such as methods,
    properties, comments, and so on. New terms appear in an italic font. That text
    you type is in a **bold font**. All of the examples in the book are shown using
    the Firefox Web browser, but all examples are compatible with Microsoft Internet
    Explorer 6+, Mozilla Firefox 2.0+, Apple Safari 3.0+, Opera 9.0+, and Google Chrome.
    The code presented in the book''s examples is available for download at www.wiley.com/go/smashingjquery.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_13_0.png)'
