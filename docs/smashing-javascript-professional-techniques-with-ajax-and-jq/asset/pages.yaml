  md: '# CHAPTER 9: WORKING WITH DYNAMIC DATA AND AJAX


    The alternative left is to use the Phone Search API to match my My Web site listing
    on Yelp. Upon looking at my database of restaurants, I found there were more listings
    with phone numbers up to full address information. Using Phone Search would offer
    more consistent data matches from Yelp.


    Before setting up any code, I played around with a few requests from some local
    restaurants and found that the API only returned the restaurant listing for the
    phone number I had supplied, as shown in Figure 9-29. If no restaurant was found
    using the phone number supplied, nothing was returned. Here is an example of the
    URL structure I used with the Phone Search API: http://api.yelp.com/search?...


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_258_0.png)


    Figure 9-29: Search results


    After completing the preceding research on how to integrate Yelp reviews and ratings
    API into StamfordCTGuide, I can move onto the next step of setting up the actual
    implementation by using jQuery to pull Yelp reviews into my web site.


    Because the integration between the Yelp API and StamfordCTGuide will be a cross-domain
    request, I need to set up a callback using JSON. The Yelp API v1.0 doesn''t support
    JSON, but there is another way to work around this issue. The workaround only
    for retrieving data from JSON will not be able to add reviews, ratings, and so
    that''s okay—I don''t need that functionality for this implementation.


    The workaround involves setting up a proxy request being called in the source,
    which is evaluated. I use this technique to get across the cross-domain issue'
