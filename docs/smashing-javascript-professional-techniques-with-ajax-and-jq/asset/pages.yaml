  md: '# PART IV: EXPLORING ADVANCED JQUERY


    # jQuery Meetups - jQuery Meetups


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_317_0.png)


    Figure 12-6: jQuery.com meetups


    © 2010 The jQuery Project


    In to jQuery meetups that are organized by the jQuery community, the developers
    behind jQuery also schedule one or two official jQuery conferences a year in locations
    such as San Francisco and Boston. The jQuery conferences draw small and intimate
    crowds of around 250-300 attendees who focus solely on jQuery-related topics with
    great speakers from the core jQuery team and the outside community. The jQuery
    conferences are a great way to network with other professionals who work with
    jQuery on a daily basis in their careers as well as people who are new to jQuery.
    The jQuery team dedicates a section of their Web site to information on the conference,
    as shown in Figure 12-7.


    A few other conferences have been started in support of the JavaScript professional
    community, but the jQuery Conference is the only one to place full emphasis on
    jQuery.


    # SUBMITTING BUGS TO THE BUG TRACKER


    As you work with the jQuery library, you may come across a bug in the programming.
    The jQuery team has created a Bug Tracker, shown in Figure 12-8, to enable users
    of the library to add bugs to the tracker so that they can be fixed in future
    versions. Tracking bugs is very important, and with jQuery having such a large
    community of users, a structured way to submit bugs to the jQuery team is essential.
    The jQuery bug tracker is accessed by navigating to http://bugs.jquery.com/newticket?redirectedfrom='
