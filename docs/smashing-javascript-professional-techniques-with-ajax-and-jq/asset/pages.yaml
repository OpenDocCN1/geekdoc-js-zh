    \ the genre\nelements using first(). Only the first element will be clickable\
    \ and will have the element\nalbum-cover cloned and added inside it.\n\n```\n\
    $(document).ready(function() {\n  $('.genre').first().delegate('.album-cover',\
    \ 'click', function() {\n    $(this).clone().addClass('rock').appendTo('.genre:first');\n\
    \  });\n});\n```\n\n```\n<div class=\"genre\">\n  <div class=\"album-cover\"></div>\n\
    \  </div>\n<div class=\"genre\">\n  <div class=\"album-cover\"></div>\n  </div>\n\
    \  <div class=\"genre\">\n    <div class=\"album-cover\"></div>\n  </div>\n</div>\n\
    ```\n\n# CAPTURING MOUSE EVENTS\n\nWhen you are ready to use user-initiated interaction\
    \ to your site, jQuery offers a wide range\nof mouse-initiated events that are\
    \ easy to learn yet can be extended in numerous ways to\npropel your Web site\
    \ or application to the next level.\n\nThe bind() method is the most common method\
    \ for attaching events to functions in jQuery and I use it for\\he following examples.\n\
    \n> Although jQuery does not have a native-click event to offer context menus,\
    \ third-party extensions that enable them are available.\n\nTable 4.2 summarizes\
    \ each mouse event and its function.\nThe tutorials following the table are real-world\
    \ examples\nhow to use these events. Most of the tutorials also\nincorporate concepts\
    \ from the previous chapters.\n\n# Table 4.2 jQuery Mouse-Driven Events That Can\
    \ Be Used with bind()\n\n| Event Name | Event Function |\n|---|---|\n| click |\
    \ Fires when mouse button is pressed and released |\n| dblclick | Fires when mouse\
    \ button is doubleclicked |\n| mousedown | Fires when mouse button is pushed |\n\
    | mouseup | Fires when mouse button is released |\n| mouseenter | Fires when mouse\
    \ enters specified element |\n| mouseleave | Fires when mouse leaves specified\
    \ element |\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_92_0.png)"
