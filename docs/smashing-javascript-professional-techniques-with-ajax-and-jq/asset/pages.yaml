  md: '# 12 FINDING JQUERY RESOURCES


    JQUERY HAS A LARGE NUMBER of official and unofficial Web sites and online resources
    dedicated to it. The official jQuery Web site offers some useful things such as
    the API, a download area, and bug tracker, but falls short in other areas. On
    the other hand, the jQuery community is an extremely valuable resource and picks
    up where the jQuery Web site leaves off by offering tutorials, code examples,
    plug-ins, and more. In this chapter, I review all of the official and unofficial
    resources available to the jQuery community.


    continually growing every day. If you do a Google search on jQuery, 18 million
    results are returned, and that number increases daily. Every morning, I read Popurls
    (popurls.com), which aggregates the best of sites such as Digg (www.digg.com),
    Delicious (www.delicious.com), RedDit (www.reddit.com), Twitter (www.twitter.com),
    and many other social communities. Nearly every day, I see at least one top news
    story that features something about jQuery. It''s a hot topic.


    The process of learning about jQuery should not stop after you finish reading
    this book. The jQuery community is a very large one that is'
