  md: '# SMASHING JQUERY


    # CHAPTER


    # 8 CREATING ADVANCED FORMS WITH JQUERY


    FORMS ARE COMMONPLACE all over the Internet, whether they are forms for ecommerce
    and registration or search input fields. Validation ensures that Web forms accept
    correct data, show clear error messages when faulty data is entered, and that
    fields are filled out when a form is submitted. Validation is often handled on
    the server side by Web developers using programming languages as PHP, JSP or ASP.
    Validation on the client using JavaScript is becoming increasingly more common,
    in addition to server-side validation depending on the security level of the data
    that is being validated. Web designers who know jQuery and


    JavaScript can create a better user interface with forms than can a developer
    using backend development.


    jQuery offers several events (focus, blur, change) specifically to be used in
    forms, which I review in Chapter 4, about events. These events are not new to
    JavaScript, but jQuery makes it easier to use these events in conjunction with
    forms. In this many different scenarios where jQuery can help you do more with
    your forms. The techniques that you learn from this chapter are necessary when
    you work with Ajax, which I cover in Chapter 9.'
  merge: -1
  pgno: 192
