  md: "```\n$('.accordion-header').click(function () {\n  $('.accordion-content:visible').slideUp('slow').prev().\n\
    removeClass('header-active');\n});\n```\n\nThe prev() method allows you to search\
    \ the DOM for the previous sibling and you can take a step further by passing\
    \ a selector string ('.active') into the method as an argument.\n\n+   9. Add\
    \ a statement to guarantee that any visible icon-active element is hidden by removing\
    \ the icon-active.\n\n```\n$('.accordion-header').click(function () {\n  $('.accordion-content:visible').slideUp('slow').prev().\n\
    removeClass('header-active');\n  $('.icon-active:visible').removeClass('icon-active');\n\
    });\n```\n\nNote: An important thing to remember is that the addClass(), remove(),\
    \ and hasClass() do not require the period to be included when passing class names\
    \ into. This is often overlooked and can create errors in jQuery scripts; however,\
    \ the is(), filter(), and not() methods that require the period to be included\
    \ before the class name.\n\n+   10. Add a statement that selects the header that\
    \ was clicked using this keyword and add the class-header-active. Then choose\
    \ the next element using the next() method and slide it slowly.\n\n```\n$('.accordion-header').click(function\
    \ () {\n  $('.accordion-content:visible').slideUp('slow').prev().\nremoveClass('header-active');\n\
    \  $('.icon-active:visible').removeClass('icon-active');\n  $(this).addClass('header-active').next().slideDown('slow');\n\
    });\n```\n\nThe next() method is the opposite of the prev() method. Instead of\
    \ the previous sibling, this method returns the next sibling.\n\n+   11. The final\
    \ statement that is inside of the click event handler function uses the \"this\"\
    \ keyword in conjunction to add the class-active to the span tag found within\
    \ the accordion-header element.\n\n```\n$('.accordion-header').click(function\
    \ () {\n  $('.accordion-content:visible').slideUp('slow').prev().\nremoveClass('header-active');\n\
    \  $('.icon-active:visible').removeClass('icon-active');\n  $(this).addClass('header-active').next().slideDown('slow');\n\
    \  $(this).find('span').addClass('icon-active');\n});\n```\n\nIf you work with\
    \ a Web site or application that has menu and content elements dynamically to\
    \ the accordion, just make sure to switch the click attachment method from bind\
    \ to live. Otherwise, the click event won't register new elements that are added\
    \ to the DOM after the page has loaded.\n\nAfter pulling all of the HTML, CSS,\
    \ and jQuery together and loading your page in a browser, you should see the accordion\
    \ in full swing, as shown in Figure 6-9.\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_157_0.png)"
