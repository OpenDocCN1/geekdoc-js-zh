  md: "# PART II: LEARNING THE JQUERY FUNDAMENTALS\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_89_0.png)\n\
    \n# USING BIND TO ATTACH AN EVENT HANDLER TO AN ELEMENT\n\nThe bind event handler\
    \ attachment is the most basic way to capture an event and consists of passing\
    \ event type and event handler to the bind method, which is attached to an element\
    \ using a selector.\n\n```\n.bind(event type, event handler)\n```\n\nIn the following\
    \ example, bind attaches the event handler to the event by selecting all elements\
    \ that contain the class mylink. When the event is invoked, it triggers the alert\
    \ function:\n\n```\n$(document).ready(function() {\n  $('.mylink').bind(click,\
    \ alertMe);\n});\n\nfunction alertMe() {\n  alert('Hello World');\n}\n```\n\n\
    ```\n;\n```\n\nYou can also set up bind events with anonymous functions, which\
    \ is often the Way I set up my event handlers. The following code performs the\
    \ same actions as the previous example but uses an anonymous function instead\
    \ of inserting a function into the click event statement. Anonymous functions,\
    \ also known as function literals, are best used when the code to be executed\
    \ only applies in the current context. Named functions are best suited for when\
    \ the code to be executed will be used in response to multiple events."
  merge: -1
  pgno: 89
- img_proc: true
  md: "```\n$$(document).ready(function() {\n  $('.mylink').bind(click, function()\
    \ {\n    alert(\"Hello World\");\n  });\n});\n```\n\nThe bind event handler works\
    \ only with elements that are currently in the DOM. Consider the following scenario:\
    \ You have an existing element in the DOM called box and would like to duplicate\
    \ it and add the new element to the DOM after a link is clicked. You can set up\
    \ a click event that is attached to a link. Each time that link is clicked, the\
    \ clone() method is invoked on the box element and the result is appended to the\
    \ container element. The following code is an example of how you can use the click\
    \ event to change/add elements that are currently in the DOM when the page has\
    \ loaded:\n\n```\n$(document).ready(function() {\n  $('.box').bind(click, function()\
    \ {\n    $(this).clone().appendTo('.container');\n  });\n});n<div class=\"container\"\
    >\n  <div class=\"box\"></div>\n</div>\n```\n\nBased on how selectors work, you\
    \ might expect that the click event would work on this new element that you've\
    \ added to the DOM. Wrong! It only works with elements that are in the DOM at\
    \ the time of binding the event. The click event is only attached to the first\
    \ element, so you can keep cloning that first element, but none of the other elements\
    \ will have click events attached to them.\n\n# LIVE TO ATTACH AN EVENT HANDLER\
    \ TO AN ELEMENT\n\nThe live event handler is a flexible way to capture an live\
    \ event. It consists of passing an event type and event handler to the live method,\
    \ which is attached to an element using a selector. The setup is very similar\
    \ to the bind method, except that the live method works with current and future\
    \ elements in the DOM.\n\n```\n.live(event type, event handler)\n```\n\nIf we\
    \ take the previous example and add the live event handler attachment, all of\
    \ the elements, current and future, are clickable:\n\n```\n$(document).ready(function()\
    \ {\n  $('.box').live(click, function() {\n    $(this).clone().appendTo('.container');\n\
    \  });\n});\n<div class=\"container\">\n  <div class=\"box\"></div>\n</div>\n\
    ```"
  merge: -1
  pgno: 90
- img_proc: true
  md: "# PART II: LEARNING THE QUERY FUNDAMENTALS\n\nThe live method works really\
    \ well with Web applications where the DOM is much more dynamic and elements are\
    \ being added and removed from the DOM constantly. This is known as DOM scripting.\n\
    \nThe disadvantage of using the live event handler attachment is that you cannot\
    \ chain other methods to the statement as shown in the following code example.\
    \ This code won't work:\n\n```\n$(document).ready(function() {\n  $(container).first().live('click',\
    \ function() {\n    $(this).clone().addClass('square').appendTo('.container:first');\n\
    \  });\n});\n\n<div class=\"container\">\n  <div class=\"box\"></div>\n</div>\n\
    \n<div class=\"container\">\n  <div class=\"box\"></div>\n</div>\n\n<div class=\"\
    container\">\n  <div class=\"box\"></div>\n</div>\n```\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_91_0.png)\n\
    \n# USING DELEGATE TO ATTACH AN EVENT HANDLER TO AN ELEMENT\n\nIf you want to\
    \ add event handlers in a similar fashion to the live method, but also be able\
    \ to chain other methods, the delegate method is the most flexible and best solution.\
    \ It consists of passing a selector, event type, and handler to the delegate method,\
    \ which is attached to an element using a selector. The selector that is passed\
    \ to the delegate method filters the elements to target a specific element or\
    \ set of elements.\n\n```\n.delegate(selector, event type, event handler)\n```\n\
    \nWhen you're using the delegate method, which requires a slightly different setup\
    \ from the bind and live methods, do the following:\n\n+   Create the selector\
    \ statement; in this case, select the container element.\n- '.container'\nNext,\
    \ add the event with delegate. Within the generic element, I am filtering down\
    \ to the album-cover element selected, with each click, this element being cloned\
    \ and added to the generic element.\n\n```\n$(document).ready(function() {\n \
    \ $('.container').delegate('.box', 'click', function() {\n    $(this).clone().appendTo('.container');\n\
    \  });\n});\n```\n\nThe following example shows how to use the delegate method\
    \ and chain other methods."
  merge: -1
  pgno: 91
