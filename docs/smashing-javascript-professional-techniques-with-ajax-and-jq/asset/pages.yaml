  md: "# CHAPTER 5: MAKING YOUR WEB SITE COME ALIVE WITH EFFECTS\n\n```\n,\nfunction()\
    \ {\n  $('.tool-tip').delay(10000).fadeOut(900);\n});\n```\n\n# CHAINING MULTIPLE\
    \ EFFECTS TOGETHER\n\nBy now, you should be pretty familiar with the concept of\
    \ chaining in jQuery. Chaining allows you to add multiple methods to the same\
    \ statement. This helps to keep your amount of code smaller and increases the\
    \ performance of your scripts.\n\nIn the following example, I use chaining to\
    \ illustrate how you can add multiple methods to a selector. The tooltip is first\
    \ set to hidden, and then the element is faded in at a speed of 900 milliseconds.\
    \ A second second delay occurs, and then it fades out at a rate of 900 milliseconds.\n\
    \n```\n$$('.tool-tip').hide().fadeIn(9000).delay(1000).fadeOut(9000);\n```\n\n\
    If you were to write that statement without chaining, it would require three separate\
    \ statements on three individual lines:\n\n```\n$$('.tool-tip').fadeIn(900)\n\
    $('.tool-tip').delay(10000)\n$('.tool-tip').fadeOut(900);\n```\n\nThe preceding\
    \ sequence of jQuery statements results in the same output as the chained example,\
    \ chaining saves space and keeps your code cleaner. Consider a scenario where\
    \ you need to select three different li elements their respective ID names and\
    \ style each of them:\n\n+   <ul id=\"news\">\n  <li id=\"politics\">Politics</li>\n\
    \  <li id=\"sports\">Sports</li>\n  <li id=\"finance\">Finance</li>\n  <li id=\"\
    world\">World</li>\n  <li id=\"local\">Local</li>\n</ul>\n\nYou can do this in\
    \ two ways. The first is by creating three statements that each select the element\
    \ and apply CSS to it:\n\n```\n$$('#politics').css('border', 'lpx solid red');\n\
    $('#finance').css('display', 'none');\n$('#local').css('border', 'lpx solid green');\n\
    ```\n\nThe second way of achieving this is by chaining all of the elements and\
    \ methods into one statement by utilizing the end() method. The end() method puts\
    \ a stop on the current methods and allows you to start chaining new methods again\
    \ after it, without any overlap of\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_126_0.png)"
