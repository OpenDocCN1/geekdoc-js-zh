    # USING FIREBOX IN FIREFOX


    If you are not using Firefox as one of your main development browsers, I highly
    suggest you download it before you proceed any further in this book. For example,
    I use version 3.6.8 of Firefox and version 1.5.4 of Firefox. Hewitt originally
    created Firefox, which is now an open-source development project, in December
    of 2006. Since then, a number of updates to Firefox have been made and more than
    1 million developers now use it.


    Firebug is an extension that provides a tool to Web designers and developers who
    work with HTML, CSS, and JavaScript. Firefox is free and open-source tool available
    to everyone through the Firefox Extensions Web site (addons.mozilla.org).


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_32_1.png)


    Figure 2-2: The Firefox preferences dialog in Mac OS X'
