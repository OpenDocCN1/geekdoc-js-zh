  md: "# RUNNING CODE OUTSIDE OF DOM READY HANDLER\n\njQuery-specific code needs to\
    \ be set up with a document.ready() event handler method. But native JavaScript\
    \ as variables, arrays, and so on can be set outside of the document ready event\
    \ handler because they don't need to wait for the DOM to be ready and are hidden\
    \ from the DOM as they specify within the actual script.\n\nThe following code\
    \ examples a script that relies on the DOM to be loaded before new content can\
    \ be added. There are three variables being set in this script — two of outside\
    \ of the document.ready() event and one being set inside for the document.ready()\
    \ event as it needs access to the for loop set inside it.\n\n```\n<DOCTYPE html>\n\
    <html>\n<head>\n  <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.4.2/jquery.min.js\"\
    ></script>\n</head>\n<script>\n  var numShows = 10;\n  var numTickets = 100;\n\
    \  $(document).ready(function() {\n    for(i=0; i < numTickets; i++) {\n     \
    \ var numTotal = i + 1;\n      $('.container').append('<p>There are ' + numTotal\
    \ + ' tickets available</p>');\n    }\\}\n  });\n</script>\n<body>\n  <div class=\"\
    container\">\n    <!-- -->\n  </div>\n</body>\n</html>\n```\n\n# PREVENTING CONFLICT\
    \ WITH OTHER LIBRARIES\n\nConflicts can occur with other JavaScript libraries\
    \ if you don't take the proper precautions when writing your jQuery. Most conflicts\
    \ occur with the use of the $ alias, Prototype also shares as an alias. You need\
    \ to take two steps to eliminate conflicts with other libraries:\n\n+   1. Add\
    \ the noConflict function at the end of your jQuery Library. The noConflict function\
    \ releases all dependability of the jQuery on the $ alias back to any other libraries\
    \ that are also using it.\n   $.noConflict();\n2. Change all references of the\
    \ $ alias to the jQuery alias as demonstrated in the following example. Change\
    \ this:\n   $(document).ready() {\n     code goes here\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_45_0.png)"
