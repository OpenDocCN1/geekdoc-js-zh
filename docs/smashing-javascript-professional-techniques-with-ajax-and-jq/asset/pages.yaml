  md: "5. After the slide-image element is set up, you need to add an image to show\
    \ up in the element after the page has loaded.\n\n```\n$('.slide-image').html('<img\
    \ src='/images/'+slideArray[0]+'\\/>');\n```\n\n6. Insert the unordered list nav\
    \ into the DOM after the slide-image element. This contains all of the links in\
    \ the slideshow.\n\n```\n$('.slide-image').after('<ul id=\"nav\">/</ul>');\n```\n\
    \n7. Use the length property to determine how many items are in the slideArray\
    \ array, and assign that to the variable slideLength.\n\n```\nvar slideLength\
    \ = slideArray.length;\n```\n\n8. Set up a loop to iterate through all of the\
    \ items in the slideArray using the slideLength to limit the amount of times the\
    \ loop runs to 5.\n\n```\nfor(i=0; i < slideLength; i++) {\n}\n```\n\n9. Because\
    \ there are 5 items in the array, the length returns 5. Add a variable called\
    \ slideText and assign it a value of i (index). This ensures that the anchor text\
    \ starts with 1 and 5, instead of starting with 0 and 4.\n\n```\nfor(i=0; i <\
    \ slideLength; i++) {\n  var slideText = i + 1;\n}\n```\n\n10. Next, using the\
    \ nav element, which I added to the DOM in step 5, append an li element for each\
    \ index in the array. Within each li, include an anchor tag with a rel attribute\
    \ set to the value of slideText and also insert slideText as the anchor text.\
    \ Use this rel attribute to set which image is inserted. 5-10 shows the loop being\
    \ evaluated in the browser with the result being HTML, which can be seen through\
    \ Firebase.\n\n```\nfor(i=0; i < slideLength; i++) {\n  $('#nav').append('<li><a\
    \ href=\"# rel='+slideText+'\">'+slideText+'</a></li>');\n}\n```\n\n11. After\
    \ creating the navigation list, I need to set a click event for each link element.\
    \ Set up a basic click event using the bind method to attach the nav selector\
    \ statement to the handler\n\n```\n$('#nav a').bind('click', function() {\n});\n\
    ```\n\n12. Add a variable called numSlide to hold the value of the attribute rel.\
    \ This value is set only when a slide nav anchor is clicked; then, when the event\
    \ is fired, not bound.\n\n```\n$('#nav a').bind('click', function() {\n  var numSlide\
    \ = $(this).attr('rel');\n});\n```\n\n13. Set the slide-image element and insert\
    \ an image tag with the imgDir and numSlide variables included. This adds the\
    \ correct image and server path as the link is clicked to the page.\n\n```\n$('#nav\
    \ a').bind('click', function() {\n  var numSlide = $(this).attr('rel');\n  $('.slide-image').html('<img\
    \ src='+imgDir+numSlide+'.jpg/>');\n});\n```\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_123_0.png)"
