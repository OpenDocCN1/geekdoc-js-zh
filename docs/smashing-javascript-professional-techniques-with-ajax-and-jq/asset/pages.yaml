    a lighter gray background color to each even or odd row. The :even and :odd filters
    in jQuery make it incredibly easy to add this type of styling to any table. This
    filter is not only for zebra striping—the possibilities for how you can apply
    this filter are nearly endless, but zebra striping is a great example. Figure
    3-9 shows the output of the browser after the page has loaded with a background
    color applied to all of the even rows.'
