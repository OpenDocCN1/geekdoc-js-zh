  md: '# INTRODUCING JQUERY


    JQUERY IS A JAVASCRIPT LIBRARY created to help Web designers and developers write
    and extend JavaScript interactions quickly and concisely using a defined set of
    methods wrapped around the native JavaScript functions. jQuery does not offer
    any new functionality, but it takes existing hard-to-understand-and-write JavaScript
    APIs (application programming interfaces) and makes them available to a wider
    audience through easy-to-understand-and-write jQuery syntax.


    In this chapter, I guide you through the benefits of using a JavaScript library,
    show you the different libraries that are commonly grouped into the same category
    as jQuery, and give you a good background on the features of jQuery and why it''s
    a great library.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# DISCOVERING JAVASCRIPT LIBRARIES


    JavaScript libraries allow Web designers and developers to extend Web page interactivity
    and usability by employing a framework of commonly used JavaScript functions built
    using native JavaScript primitives.


    Think of libraries as frameworks or blueprints with a set of rules and guidelines
    to help you build your site. JavaScript libraries make writing much easier for
    Web designers and developers they are a starting point. Many popular libraries
    such as Prototype, MooTools, Dojo, YUI, and the main focus of this book, jQuery,
    are used widely on the Web today. Each library has a specific feature set, with
    jQuery owning the DOM (Document Object Model) manipulation space.


    The Document Object Model is the actual HTML code that represents a Web page,
    structured like a tree, with each branch being a node tied together in a hierarchical
    structure. Each node can be accessed most commonly through CSS and also JavaScript
    using selectors. The DOM is the API (application programming interface) for how
    Web designers and developers can manipulate the Web page using methods created
    by the HTML standards committee. HTML 5 offers a new set of APIs for interacting
    with the DOM and creating a richer Internet experience for users. When a page
    is fully loaded, the DOM is ready to be interacted with.


    A JavaScript framework allows a Web designer or developer to extend the DOM by
    adding a JavaScript include (library.js) to a page and then using special functions
    set within the library.


    # REALIZING THE BENEFITS OF USING A JAVASCRIPT LIBRARY VERSUS THE TRADITIONAL
    APPROACH


    The greatest benefit of using a JavaScript library is being able to tap into huge
    assortment of functions to extend your Web pages beyond dull, non-interactive
    content.


    JavaScript libraries can offer ways for Web designers and developers to work with
    effects, animations, events, Ajax, and interactive user interface widgets for
    faster and rapid Web development. Designers and developers are not limited to
    those functions provided by the library. You can also write your own.


    The beauty of JavaScript libraries for Web designers who understand the DOM is
    that manipulating the DOM becomes inherently easier than manipulating it by using
    the limited API of JavaScript.


    In order to get the same features by writing your own JavaScript, you would have
    to spend countless hours and long nights programming, testing, and bug fixing,
    which would probably result in massive amounts of code. JavaScript libraries help
    greatly in this area by reducing the amount of code it takes you to do something
    that might normally be four times as big if it was done with native JavaScript.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_17_0.png)'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# CHAPTER 1: INTRODUCING JQUERY


    Avoiding repetition is another benefit of JavaScript libraries. As you start writing
    JavaScript functions to do similar tasks, you end up with a lot of very similar
    code — by using a library, you can eliminate that repetition.


    # GETTING TO KNOW THE MAIN LIBRARY PLAYERS


    When you select a framework, you have about 20 JavaScript libraries to choose
    from, with five of those libraries being the main players — YUI, Prototype, MooTools,
    Dojo, and the topic of this book, jQuery — have risen above the rest because of
    their ease of use and the enormous audiences they have. The main differentiators
    between most of these libraries include size and browser support.


    The five libraries I discuss are open source, which means that anyone can contribute
    to the source code that makes up these libraries. Microsoft software, for example,
    is not open source — it is properly owned by Microsoft. Microsoft employs its
    own programmers to develop it. Microsoft then sells their software for a licensing
    fee. The licensing fee allows you to use the software, for a set period of time,
    and gives you access to support from Microsoft if you have problems.


    Open source software is different. Anyone can download the source code and contribute
    to it — which makes for better code because it''s all created on a volunteer basis
    with a goal of writing better software, not making money. Because you are not
    paying a licensing fee, you are free to do whatever you please with the library.
    The open source community on the Web is huge, with millions of users contributing
    through blogs and forums, and it''s quite easy for designers and developers to
    find support when they need it.


    One important thing to keep in mind is that when you are learning a JavaScript
    library, you are learning to read and write in what feels like another language
    — it is another interpretation of the JavaScript language.


    # YUI


    The YUI (Yahoo! User Interface) JavaScript library was created by the Yahoo! Developer
    Network in 2005 and is under the BSD (Berkeley Software Distribution) license.
    The BSD license allows software to be distributed as permissive-free software,
    which has the least amount of restrictions for distribution purposes compared
    to other licensing options such as GNU General Public Licenses. YUI is fully supported
    on Internet Explorer 6 and later versions, Firefox 3 and later, Safari 3 and later,
    and Opera 10 and later.


    The total size of the YUI library is 31 KB.


    To give you an idea of what YUI code looks like, here is some sample JavaScript
    code showing how to implement a click event using YUI. There are two parts to
    the click event here: the function that is called when the click occurs and the
    actual click event itself. The code is not that elegant and uses a lot of YUI-specific
    syntax.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_18_0.png)'
  merge: -1
  pgno: 18
