    # ADDING A MESSAGE AFTER THE FIRST/LAST ROWS OF THE TABLE


    Adding content dynamically to a page can be done server-side, which requires a
    request to the server and, depending on the size of the database that needs to
    be searched, can take a bit of time and processing power. An easier way to dynamically
    insert content is using jQuery to add static content stored in a jQuery function
    or to load content via Ajax without disrupting activities on the page.


    You can specifically target areas within the table if you have a search results
    page and you would like to insert a special message after the first search result.
