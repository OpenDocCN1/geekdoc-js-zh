  md: '# CHAPTER 11: DEVELOPING THE MOBILE WEB WITH JQUERY


    # WORKING WITH THE APPLE iPhone

    SAFARI MOBILE BROWSER


    A Web site or application for the iPhone Safari browser is really exciting because
    of how advanced the browser is, as shown in Figure 11-6. Safari supports CSS3
    and HTML5, so you can probably understand my excitement. The downside is that
    only a few other browsers, Safari Mobile being one of them, support CSS3 and HTML5,
    so you have to make a plan of which features and mobile devices to support.


    Before native iPhone apps existed, when the first iPhone app was released in June
    2007, the big thing was Web applications. Apple supported this by adding a section
    on their iPhone Web site dedicated to showcasing Web apps created specifically
    for the iPhone, as shown in Figure 11-7.


    Apple has put a lot of effort into creating development portals for both the native
    Safari Web applications. Before you start any development, I highly recommend
    that you visit the Safari Dev Center (refer to Figure 11-8). The Dev Center offers
    videos, technical documentation, and sample code to help you started when you''re
    developing your first Web application for Apple Safari on iPhone.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_304_0.png)


    A day''s worth of parchment.


    In This Issue:

    A Day''s Worth of Parchment

    The French Impression

    A Tint of Original

    More Muscular Clues


    Figure 11-6: The Apple iPhone Safari browser with a Web app


    # WORKING WITH THE GOOGLE AND BROWSER


    Google Chrome, as shown in Figure 11-9, on Android is also exciting to build Web
    applications because of its support for new technologies like CSS3 and HTML5.
    jQuery is also supported on Android, so essentially any work you do for desktop
    Web sites and applications can be easily transferred to mobile.


    Google has developed a lot of effort into creating an excellent portal for developers.
    Similar to the iOS Dev Center, Google Center offers videos, technical documentation,
    code examples, and discussion forums. The Google Android development center, as
    shown in Figure 11-10 (http://developer.android.com/index.html), offers a wealth
    of information and should definitely be checked out before starting any work on
    a Web application.'
