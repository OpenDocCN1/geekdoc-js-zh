  md: '# CHAPTER 10: CREATING AND USING JQUERY PLUGINS


    # The accordion


    The accordion is a great way to show content or even navigation tools in a small
    space and has become very popular on the Internet. When it''s used for navigation,
    the accordion condenses a lot of menu options into a small menu, making it easier
    for users trying to navigate around your site. Sometimes, the various folds of
    the accordion — like the slides of a slideshow — are powered by Ajax therefore
    you don''t need to reload the page to get the new content.


    In Chapter 6, I review how to create your own accordion menu or content: It amounts
    to about ten lines of code. jQuery UI can achieve the same result but with only
    one line of code for the default settings, shown in Figure 10-1.


    An accordion menu


