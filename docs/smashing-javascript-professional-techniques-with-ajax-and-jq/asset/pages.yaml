- img_proc: true
  md: "# PART II: LEARNING THE JQUERY FUNDAMENTALS\n\n5. Create a for loop to loop\
    \ through all of the headlines in newsArray. For each headline, add a list to\
    \ the news-feed unordered list with the headline name between the two li tags:\n\
    \n```\nfor(i=0; i<newsLength; i++) {\n  $('#news-feed').append('<li>'+newsArray[i]+'</li>');\n\
    }\n```\n\n6. Next, use up a function called slideHeadline that contains all of\
    \ the effects to make the news ticker work. The first statement of the function\
    \ selects the last item in the news-feed unordered list, clones it, and inserts\
    \ it back into the list, but using the prepend method.\n\n```\nfunction slideHeadline()\
    \ {\n  $('#news-feed li:last').clone().prepend('#news-feed').hide();\n}\n```\n\
    \n7. The second statement added to the function selects the first item (the cloned\
    \ element) that was just created in the new feed and adds the slideDown effect\
    \ to it.\n\n```\nfunction slideHeadline() {\n  $('#news-feed li:last').clone().prepend('#news-feed').css('display',\
    \ 'none');\n  $('#news-feed li:first').slideDown();\n}\n```\n\n8. Not only do\
    \ I want to slide the first item at a speed of 500 milliseconds, but I also want\
    \ to fade it in, at a rate of 1,000 milliseconds, as I do by adding the fadeIn\
    \ method to the same statement that contains the slideDown method.\n\n```\nfunction\
    \ slideHeadline() {\n  $('#news-feed li:last').clone().prepend('#news-feed').css('display',\
    \ 'none');\n  $('#news-feed li:first').fadeIn(1000).slideDown(500);\n}\n```\n\n\
    9. One last statement added to the slideArticle function removes the item in the\
    \ list. These three statements all once after the other, which simulates a nice\
    \ fade and sliding effect, as illustrated in Figure 5-13.\n\n```\nfunction slideHeadline()\
    \ {\n  $('#news-feed li:last').clone().prepend('#news-feed').css('display', 'none');\n\
    \  $('#news-feed li:first').fadeIn(1000).slideDown(500).remove();\n}\n```\n\n\
    10. This piece of JavaScript is the most important. I set up the Interval JavaScript\
    \ function to execute the slideArticle function at the newsInterval rate (2,000).\
    \ This function continuously loops the news ticker. Without this function, the\
    \ news ticker doesn't run.\n\n```\nsetInterval(slideHeadline, newsInterval);\n\
    ```\n\nThe setInterval is a native JavaScript timer function that allows a specific\
    \ function to run after a given interval of time has passed. There is a similar\
    \ JavaScript timer called setTimeout which continues looping until you tell it\
    \ to, whereas setTimeout only runs once. Two functions will stop these timers\
