  md: "# CHAPTER 6: IMPROVING NAVIGATION: MENUS, TABS, AND ACCORIONS\n\n11. Add a\
    \ statement to the click event handler that selects the navigation element (#tabs\
    \ li a) and removes the tab-active class. This statement is to ensure that only\
    \ one navigation element is selected at a time.\n\n```\n$('#tabs li a').bind('click',\
    \ function () {\n  var linkIndex = $('#tabs li a').index(this);\n  $('#tabs li\
    \ a').removeClass('tab-active');\n  return false;\n});\n```\n\n12. Add a statement\
    \ to the click event handler that selects the content element that is visible\
    \ and applies the hide effect to it.\n\n```\n$('#tabs li a').bind('click', function\
    \ () {\n  var linkIndex = $('#tabs li a').index(this);\n  $('#tabs li a').removeClass('tab-active');\n\
    \  $('.tab:visible').hide();\n  return false;\n});\n```\n\n13. Add a statement\
    \ to the click event handler that filters the content elements based on the current\
    \ index and only shows the content whose index matches that of the content element.\
    \ This statement controls the showing and hiding of content elements based on\
    \ their index values. Even though there is no relationship in the DOM between\
    \ list items and content elements, when a list is clicked, it is matched up solely\
    \ on the order of the index values in both sets of elements. It's a great way\
    \ to keep the code autonomous.\n\n```\n$('#tabs li a').bind('click', function\
    \ () {\n  var linkIndex = $('#tabs li a').index(this);\n  $('#tabs li a').removeClass('tab-active');\n\
    \  $('.tab:visible').hide();\n  $(this.eq('+'+linkIndex+'*')).show();\n  return\
    \ false;\n});\n```\n\nThe eq(index) method returns the set of element(s) at the\
    \ given index.\n\n14. The final statement added to the click event handler adds\
    \ a tab-active class to each element that is clicked to show which tab they are\
    \ using.\n\n```\n$('#tabs li a').bind('click', function () {\n  var linkIndex\
    \ = $('#tabs li a').index(this);\n  $('#tabs li a').removeClass('tab-active');\n\
    \  $('.tab:visible').hide();\n  $(this.eq('+'+linkIndex+'*')).show();\n  $(this).addClass('tab-active');\n\
    \  return false;\n});\n```\n\nIf you work with a Web site or application that\
    \ adds tabs and content elements dynamically to the tabbed content script, make\
    \ sure to switch the click event attachment method from bind to live. Otherwise,\
    \ the click event won't register new elements that are added to the DOM after\
    \ the page has loaded.\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_164_0.png)"
