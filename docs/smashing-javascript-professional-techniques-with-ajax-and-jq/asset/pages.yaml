  md: '# 5 MAKING YOUR WEB SITE COME ALIVE WITH EFFECTS


    IN RECENT YEARS, JavaScript effects have really come of age in an industry where
    Adobe Flash used to rule the online universe. Web sites with image slideshows,
    animated menus, or video-like animations that used to be done exclusively in Flash
    are now often done in JavaScript to facilitate cross-browser and mobile compatibility.
    This increase in JavaScript effects usage has become a major reason for Web designers
    and developers to utilize the effects API in jQuery.


    jQuery utilizes JavaScript effects that you might already be familiar with to
    provide robust offerings that can be easily integrated into any Web site. Because
    they are written in jQuery, the effects are incredibly easy to set up, which makes
    them a popular choice among Web designers and developers.


    In this chapter, I review the effects that are available to you through the jQuery
    API, show you each effect and how it works, and then walk you through a few real-world
    scenarios.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# PART II: LEARNING THE JQUERY FUNDAMENTALS


    # DISCOVERING WHAT JQUERY EFFECTS CAN DO


    As Web designers and front-end developers, it''s our job to make the user interface
    for a Web site usable. Often that involves moving elements off the screen in order
    to fit more content on one page. Users want and expect instant gratification:
    They don''t want to wait around clunky Web sites that have many, pages and take
    forever to load.


    Facebook, the most popular social network, with more than 500 million users, has
    a very interactive and fun interface driven by JavaScript. If you log in to your
    Facebook page, you can chat with friends and check your friend feed without having
    to register a new page. This user experience is created using JavaScript effects
    such as show/hide and animations. Web sites like Facebook are setting the high
    bar for what users are expecting from an online experience.


    Geolocation-based applications are starting to gain more popularity. Many of these
    Web sites incorporate front-end JavaScript Maps-type technologies. Figure 5-1
    shows the Gowalla Web site, a geo-location-based social community.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_111_0.png)


    © 2010 Gowalla Incorporated


    jQuery provides basic effects, such as showing, hiding, sliding, and fading. Table
    5-1 outlines the basic effects that are all set in a similar fashion and have
    the same optional parameters that can be passed into the methods.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# CHAPTER 5: MAKING YOUR WEB SITE COME ALIVE WITH EFFECTS


    Table 5.1 Basic jQuery Effects


    | Effect Name | Effect Function |

    | --- | --- |

    | show() | Shows an element |

    | hide() | Hides an element |

    | toggle() | Toggles between show and hide using click event |

    | slideDown() | Slides element |

    | slideUp() | Slides up |

    | slideToggle() | Toggles between sliding down and sliding up |

    | fadeIn() | Fades in to opaque |

    | fadeOut() | Fades elements out to transparent |

    | fadeTo() | Fades elements to specified opacity |


    # SHOWING AND HIDING ELEMENTS

    USING SHOW AND HIDE


    Showing and hiding elements using jQuery is a basic effect. I showed examples
    of this effect being used in previous chapters, but usually these can be seen
    in conjunction with the click event. It is commonly used across the Internet.
    In Figure 5-2, Google Gmail uses the show/hide effect to show the new Call Phone
    feature overlay.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_112_0.png)


    Reproduced from 2010 © Google'
  merge: -1
  pgno: 112
- img_proc: true
  md: "# PART II: LEARNING THE JQUERY FUNDAMENTALS\n\nThe show or hide effect is attached\
    \ to a selector and two optional parameters can be passed into it. The duration\
    \ parameter determines how the animation runs and can be set using the keywords\
    \ fast or slow, as well as milliseconds (600, 200, 700, and so on). The callback\
    \ parameter allows you to link up a function, which executes when the show effect\
    \ is complete.\n\n```\n$(selector).show(duration, callback)\n```\n\nThe following\
    \ example shows a link with a click event attached. When the link is clicked,\
    \ an element with the class recipe is shown. This is the show effect in its most\
    \ basic form.\n\n```\n<style>\n.recipe(display:none);\n</style>\n$('.recipe-name').bind('click',\
    \ function() {\n  $('.recipe').show();\n});\n```\n\n```\n<a href=\"Key Lime Pie</a>\n\
    <div class=\"recipe\">Key lime pie is an American dessert made of key lime juice,\
    \ egg yolks, and sweetened condensed milk in a pie crust.</div>\n```\n\njQuery\
    \ enables the div to be shown by adding a display:block to the selected element.\
    \ Figure 5-3 shows how the previous code example is rendered in the browser.\n\
    \n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_113_0.png)\n\nFigure 5-3: How the preceding\
    \ code example renders in the browser"
  merge: -1
  pgno: 113
- img_proc: true
  md: "# CHAPTER 5: MAKING YOUR WEB SITE ALIVE WITH EFFECTS\n\nThe hide event works\
    \ exactly like the show event, except that it hides the selected element.\nThe\
    \ inline style is changed to display:none.\n\n```\n$('.recipe-name').bind('click',\
    \ function() {\n  $('.recipe').hide();\n});\n```\n\n<a href=\"#\" class=\"recipe-name\"\
    >Key Lime Pie</a>\n<div class=\"recipe\">Key lime pie is an American dessert made\
    \ of key lime juice, egg yolks, and sweetened milk in a crust.</div>\n\nIf you\
    \ would like more control over the speed of the show effect, pass either the specific\
    \ keyword (fast/slow) or number of milliseconds to the show method.\n\n```\n$('.recipe').show('slow');\n\
    ```\n\nYou can also pass a callback function to the show method, which fires after\
    \ the effect has finished rendering.\n\n# SETTING A MESSAGE TO APPEAR ONLY ONCE\
    \ ON SITE USING THE SHOW METHOD AND COOKIES\n\nSuppose you are in a situation\
    \ where you may want to display a special offer or special message to your users,\
    \ but you only want to show the message once. I've seen messages like this on\
    \ Basecamp, a Web-based project management tool, when a login message is displayed\
    \ telling them about some new feature. You can use the show method coupled with\
    \ a return function that drops a cookie on your user's computer to prevent them\
    \ from seeing this message again on the same computer, under that user account.\n\
    \nTo start, create the message and \"bake\" the cookie:\n\n+   1. Create the HTML\
    \ for the message that you wish to show and include a link to allow the user to\
    \ hide it.\n<a href=\"#\" class=\"special-offer\">View this special offer!</a>\n\
    \n<div id=\"message\">\nSpecial Offer for Members! 50% off your first purchase.<br/>\n\
    <a href=\"#\" class=\"hide\">Hide this message</a>\n</div>\n2. Set up a click\
    \ event for the special offer link to show the message and set the hideMessage\
    \ callback function which we create shortly. Within the click event, add a selector\
    \ statement for the message element with the show effect added to it. You do not\
    \ need to pass the duration parameter into the show method. But you need to add\
    \ the callback function that you want to execute after the show method has finished.\
    \ In this case, hideMessage.\n\n```\n$('.special-offer').bind('click', function()\
    \ {\n  $('#message').show(hideMessage);\n});\n```\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_114_0.png)"
  merge: -1
  pgno: 114
- img_proc: true
  md: "# PART II: LEARNING THE JQUERY FUNDAMENTALS\n\n3. Set up another click event\
    \ for the hide link to hide the message and set the hide callback function.\n\n\
    ```\n$('.hide').bind('click', function() {\n  $('#message').hide(hideMessage);\n\
    });\n```\n\n4. Next, set up the hideMessage() function that drops a cookie on\
    \ the user's computer after they have viewed the message.\n\n```\nfunction hideMessage()\
    \ {\n}\n```\n\n5. Create a cookie called hideCookie and set it to expire 30 days\
    \ after today. The date is set up using the JavaScript date object. This is a\
    \ good example of mixing native JavaScript functions with jQuery. Figure 5-4 shows\
    \ a screenshot of the cookie with its values set in Firefox.\n\n```\nfunction\
    \ hideMessage() {\n  var expDate=new Date();\n  expDate.setDate(expDate.getDate()+30);\n\
    \  document.cookie = \"name=hideCookie;expires=\"+expDate.toUTCString()+\";\"\
    ;\n}\n```\n\nAt this point, you should be able to show and hide the message and\
    \ set the cookie. But what about the users who have already seen the message?\
    \ If they come back to the site tomorrow, you want to make sure they don't see\
    \ it again. You can do that by creating another function that runs the load event\
    \ to hide the message if the cookie is found, as shown in Figure 5-5:\n\n+   1.\
    \ Add a variable that is assigned to the cookie. Using the JavaScript object,\
    \ you can retrieve a cookie by using document.cookie.\n2. Create a conditional\
    \ statement that tests whether the messageCookie has a value and then hides the\
    \ special offer link; otherwise, do nothing.\n\n```\nvar messageCookie = document.cookie;\n\
    \nif (messageCookie) {\n  // if message cookie is present, then hide special offer\
    \ link\n  $('.special-offer').hide();\n} else {\n  // do nothing\n}\n```\n\n#\
    \ TOGGLING BETWEEN SHOW AND HIDE\n\nYou may encounter a situation where you need\
    \ to toggle between the show effect and the hide effect. jQuery has a nice solution\
    \ to that called toggle(). The toggle() method binds an event handler to the click\
    \ event and lets you toggle between show and hide,\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_115_0.png)"
