  md: "# PART II: LEARNING THE JQUERY FUNDAMENTALS\n\n| Table 4.2 (continued)\n| Template\
    \ | Function |\n| mousemove | Fires when mouse moves on specified element |\n\
    | mouseout | Fires when mouse leaves specified element and parent |\n| mouseover\
    \ | Fires when mouse enters specified element and parent |\n\n# ADDING AND REMOVING\
    \ CONTENT TO OR FROM A PAGE WITH A MOUSE CLICK\n\nLearning how to detect a mouse\
    \ click is one of the most basic sought-after events in jQuery. This Internet\
    \ is built on links and text, so users expect to click around your Web site. Being\
    \ able to programmatically add and remove content to from a page is useful, especially\
    \ when you are creating Web applications.\n\nIf you use JavaScript to create a\
    \ click event, add the onclick directly to the element. The onclick is the event\
    \ handler, which then calls a function to be invoked with the click. The downside\
    \ to this technique is that it muddies your inline JavaScript actions that have\
    \ to be added to each element. jQuery uses a selector to add the click to an element\
    \ or multiple elements. Introducing non-semantic code such as inline JavaScript,\
    \ is a poor practice:\n\n```\n<a href=\"product.html\" onclick=\"myFunction();\"\
    >Paper Towels</a></a>\n```\n\njQuery uses a selector to add the click event to\
    \ an element or multiple elements using the binding method. The syntax for a click\
    \ event in jQuery is more concise and isn't added inline to each individual element.\n\
    \n```\n$(selector).bind('click', function() {\n  code to be executed after element\
    \ is clicked\n});\n```\n\nThe following tutorial explains how to add and remove\
    \ one paragraph with a mouse click.\n\n+   1. First, create a link that has a\
    \ class of \"content-link\" and a div that contains the content, which is hidden\
    \ upon page load.\n\n```\n<style>\n.content (display:none);\n</style>\n<li>Hello\
    \ jQuery.</li>\n<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec\
    \ gravida \\00\nrhonus commodo. Aenean sit amet augue iaculis sem consectetur\
