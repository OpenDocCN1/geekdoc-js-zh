    +   - Border Radius to create rounded corners using CSS, as shown in Figure 11-3

    - Border Image to create a border that uses CSS

    - Box Shadow to create drop shadows using CSS3

    - Multiple Backgrounds, which lessens the amount of code you need to display different
    background images and instead declare a different background positioning property
    in CSS

    - New Color Options to select color types other than RGB and offer true opacity
    to transparency without resorting to browser handlers

    - Text Shadow to create drop shadows on textual elements


    For a full list of the new features and features in CSS3, please visit www.css3.info/preview.

    jQuery supports CSS3 selectors.


    # UNDERSTANDING HTML5


    HTML5 has been under development since January 2008 and is just starting to make
    its way into modern browsers.

    Among others, HTML5 offers the following features:


    The benefits of these features are immense, but HTML5 offers many more than I
    haven''t even mentioned. The future of Web design with browsers supporting both
    HTML5 and CSS3 is looking hot.


    +   - Integrated form validation

    - Local storage'
