    \ in Firefox and Debug — similar to hide/show, the element is shown by jQuery\
    \ adding an inline style of display:block to the element\n\n# FADING ELEMENTS\n\
    \nThe fade-in and fade-out effects can add another dimension of interactivity\
    \ to the elements on a Web site. Most often, the fade effect is used with image\
    \ galleries or image slideshows where one image fades out another image fades\
    \ in. Until a few years ago, it seemed the only way to achieve such an effect\
    \ was by using Flash to create an animated slideshow or by using advanced JavaScript\
    \ that required many lines of code."
