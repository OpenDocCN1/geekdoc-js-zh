    # DISPLAYING ALTERATIVE SEARCH OPTIONS WITH THE SLIDETGLE METHOD


    Searching is an integral part of the Web and quite possibly why Google is the
    most successful company around today. Every user expects to be able to search
    and easily find what they are looking for on your site. Building a better user
    interface that gives yours an important improvement. Mozilla has a large community
    of developers who create add-ons for the Firefox browser. Figure 5-7 is an example
    of their search bar with advanced options. If you click the advanced options,
    the advanced search option bar slides down, which keeps you on the same page but
    allows you to expand your search. This feature can be easily added with jQuery
    using the slideToggle method.


    The slideToggle method is very similar to the toggle method for showing and hiding
    elements, except that it isn''t already attached to a click event. If the element
    is already shown and slideToggle is invoked, it is set to slideUp. The opposite
    happens if the element is hidden.


    ```

    $(''message'').slideToggle();

    ```'
