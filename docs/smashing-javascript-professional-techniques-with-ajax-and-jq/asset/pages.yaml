  md: '# CHAPTER 10: CREATING AND USING JQUERY PLUGINS


    or if this is a small one-time fix, moving your code to a plug-in is unnecessary.
    It''s important to keep in mind when creating a jQuery plug-in:


    +   - Create a unique plug-in name. Before choosing a plug-in name, check to see
    if a plug-in with this name already exists.

    - Avoid using the $ alias to avoid conflicts with other JavaScript libraries that
    use a alias.

    - Use comments to explain the plug-in.

    - Make sure the plug-in has an open-source license for distributing.

    - Plan/sketch out the plug-in on a scrap of paper before you start to code.

    - Set up default settings that can be overwritten.

    - Check out the jQuery plug-in documentation, shown in Figure 10-21 (https://jquery.com/plug-ins/authoring).


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_286_0.png)


    Figure 10-21: The jQuery plug-in documentation


    2010 The jQuery Project


