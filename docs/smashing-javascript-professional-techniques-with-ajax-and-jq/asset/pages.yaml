  md: '# DEVELOPING FOR THE MOBILE WEB WITH JQUERY


    YOU CAN USE JQUERY on mobile Web applications as you would any other Web site
    or application. Mobile phones are limited by their screen resolution and bandwidth,
    which are key factors you should keep in mind when creating mobile Web applications.
    Mobile Web applications can be either purely online Web applications accessed
    via a Web browser or on a mobile device, or they can be native Web applications.


    In this chapter, I explain the difference between mobile Web site and a mobile
    application, discuss the benefits of CSS3 and HTML5 on the mobile Web, and guide
    you through how to set up and install mobile browser emulators for Google Android
    and Apple Mobile. Last but not least, I give you a glimpse of what''s to come
    with jQuery Mobile Alpha.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# BUILDING FOR THE MOBILE WEB USING JQUERY


    You can take a few different routes with mobile Web applications. The mobile Web
    market seems to be quite concentrated around two platforms: Apple iPhone/iPad
    and Google Android.


    When you''re creating a Web site or application with multiple browsers, you will
    find it much tougher than doing the same with desktop support for browsers. This
    is still very new territory for jQuery developers because many phones do not have
    native JavaScript support. Smartphones as Apple iPhone and Google Android have
    much more advanced browser capabilities, which makes those platforms the easiest
    to develop for.


    Here are a couple of tips for building mobile Web sites and applications:


    +   - Define your audience before development. This means you need to determine
    who will be using the app. What platform will they be using? Which browser do
    they use? Will it be Wi-Fi or a cellular network?

    - Keep your site or app simple. Mobile devices have limited bandwidth and screen
    sizes.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_299_0.png)


    The Roanoke College Mobile Web site, shown in Figure 11-1, is a good example of
    a Web site designed for the iPhone browser that uses jQuery to load content using
    Ajax method load(). It also uses a jQuery plugin-in to offer a slideshow of images
    around the college.


    > Figure 11-1: The Roanoke College Mobile Web App uses jQuery


    # MOBILE BROWSERS


    Similar to the browser war that has been raging on the desktop for quite a few
    years between Internet Explorer, Mozilla Firefox, Apple Safari, Opera, and newcomer
    Google Chrome, a similar situation is now occurring with the mobile browsers.
    Each mobile browser can offer different advantages, but as the mobile Web application
    market advances, you will see more of the same features across the browsers.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# CHAPTER 11: DEVELOPING FOR THE MOBILE WEB WITH QUERY


    You can create a mobile Web browser application without having to touch any tools
    you already use: HTML, CSS, and jQuery. The two leading smartphone platforms,
    Apple iOS and Google Android, have two advanced mobile browsers included with
    them; the HTML5, CSS3, and JavaScript features supported by these devices are
    outlined in Table 11.1. A native application — software that is built for the
    phone''s operating system as opposed to a Web site or App that can be viewed on
    the phone — offers great benefits, but you can also build something valuable for
    the browser. This makes even greater sense if you are already developing a Web
    site for the desktop browser.


    Table 11.1 Mobile Browser Features

    | HTML5 | CSS3 | JavaScript |

    |---|---|--|

    | Apple Safari 5 | Yes | Yes | Yes |

    | Google Android (Chrome) | Yes | Yes | Yes |

    | Mozilla Firefox Mobile | Yes | Yes | Yes |

    | Opera 10 Mobile | No | Yes | Yes |


    As you can see from the preceding table, the Safari, Chrome, and Firefox mobile
    browsers are the best supported with new features currently on the market. Safari
    and Chrome have a leg up on Firefox because they are the default browsers for
    iPhone and Android. Opera 10 Mobile is now available as a downloadable application
    on Google Android and Apple platforms.


    Both platforms support CSS3 and HTML5. If you haven''t heard anything about these
    advances in Web design, you are in for a real treat! CSS3 and HTML5 are usually
    mentioned in the same sentence because of the nature of what they do, but there
    are a lot of differences between the two technologies.


    # UNDERSTANDING CSS3


    CSS3 (also known as Cascading Style Sheets 3) has been under development since
    December 2005. It''s just starting to make its way into more advanced browsers
    such as Apple Safari 4, Google Chrome, Microsoft Internet Explorer 9, Opera 10,
    and Firefox 4. As these browsers start to gain market share, CSS3 becomes more
    mainstream. You can create a Web site that utilizes these technologies using the
    iPhone and Android platforms. Doing so should help advance your knowledge and
    career because you gain experience with the latest greatest technologies and gain
    a better understanding of the limitations involved with mobile Web site and application
    development.


    CSS3 offers the following new properties, among others, which you can find out
    more at www.css3.info, as shown in Figure 11-2. These properties are beneficial
    to mobile devices because historically many of these properties would need to
    be done using images, CSS workarounds and JavaScript, which would increase the
    size of the pages, therefore decreasing performance. By using CSS properties,
    the performance of the mobile site is not compromised.'
