  md: '# Downloading the Apple iPhone Safari desktop emulator


    You can access the Apple Safari emulator by pointing your browser to developer.apple.com/devcenter/ios/index.action.
    After you have registered as a developer on the Apple.com developer portal, you
    can proceed to download and install the iPhone emulator. After you have installed
    the emulator, you can start it and browse to any Web site using Safari as you
    would a real iPhone, as shown in Figure 11-4.


    # Downloading the Google Android desktop emulator


    You can access the Google Android emulator by visiting to developer.android.com/sdk/index.html.
    After you have downloaded and installed the Android Chrome emulator, you can open
    it up and browse to any Web page using Chrome Mobile as you would be on a real
    Android phone, as shown in Figure 11-5.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_303_0.png)


