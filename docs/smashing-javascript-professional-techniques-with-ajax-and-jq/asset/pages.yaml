    The input field \"first-name\" now has the focus event bound to it, when the user\
    \ clicks or tabs into this field, the border will change to a 1px solid red. It's\
    \ as easy as that.\n\n# SHOWING MESSAGE AFTER A USER LEAVES AN INPUT FIELD\n\n\
    The blur event is opposite of the focus event and is triggered when a user’s mouse\
    \ or cursor leaves the current selected input field or element or another input\
    \ field or is selected. User-interface changes such as a border around an input\
    \ field changing to red or validation occurring on an e-mail address field are\
    \ real-world examples of what can occur as a result of the blur event. I focus\
    \ on more ways ways to create interactive form elements in Chapter 8.\n\n# CAPTURING\
    \ KEYBOARD EVENTS\n\nKeyboard events are similar to mouse events, but instead\
    \ they capture events that originate from the keyboard by the pressing of a key\
    \ or text changing inside of a form field. Keyboard events are used with in-browser\
    \ forms and inline format validation. On some sites that require a username, username\
    \ validation script often validates the data as you type and is probably triggered\
    \ by capturing events that originate from the keyboard. Table 4.4 introduces the\
    \ list of keyboard events and what each function does.\n\nTable 4.4 Names and\
    \ Functions of the jQuery Keyboard Events\n\n| Keyboard Event Name | Keyboard\
    \ Event Function |\n|---|---|\n| keydown() | Triggers when a key is first depressed\
    \ |\n| keypress() | Triggers when a key is pressed once or many times |\n| keyup()\
    \ | Triggers when a key goes up after being pressed |\n\nValidation is a key part\
    \ of Web form. The data that you receive from users is only good as the methods\
    \ you use in place to make sure the data is clean and usable. The change is one\
    \ of many from Table 4.4 that allows you to check a text field so as the text\
    \ or number has been changed inside of it. Contrary to what amateur developers\
    \ think, JavaScript-only validation methods are not secure and back-up server\
    \ side validation, depending on what data is being validated.\n\nA frequently\
    \ used implementation, as seen in Figure 4-12, is the Twitter status input field\
    \ that allows you to type up to a maximum of 140 characters. Each time a letter\
    \ is entered into the input field, it is subtracted from the total amount of allowed\
    \ characters. Text on the page shows many remaining characters are left.\n\nThe\
    \ change event is set up with the bind method in the same way as other events."
