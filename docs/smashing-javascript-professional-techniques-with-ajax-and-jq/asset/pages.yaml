  md: "# Table 4.1 jQuery Document and Window Events\n\n| Event Name | Event Function\
    \ |\n| --- | --- |\n| ready() | Fires when the HTML document has loaded |\n| load()\
    \ | Fires when all assets have loaded |\n| unload() | Fires when browser window\
    \ is closed, or when a user navigates to new page via the address bar or a link\
    \ |\n| resize() | Fires when user resizes the window |\n| scroll() | Fires when\
    \ user initiates scroll |\n| error() | Fires when an error is received from an\
    \ HTTP request |\n\n# DETECTING COMPLETE LOADING OF THE DOM WITH THE READY! EVENT\n\
    \nOne event that is commonly used to check that the DOM (Document Object Model)\
    \ has loaded correctly is the `ready()` event. This event fires JavaScript or\
    \ jQuery code that you declare between its brackets when the DOM is ready.\n\n\
    The document `ready` event handler allows you to put all of your JavaScript jQuery\
    \ code within this event, either inline or in an external file, to make sure the\
    \ code is executed when the DOM is ready. An event handler is a function that\
    \ executes your code as it occurs. It's important that you use the document `ready`\
    \ event handler to ensure the DOM has been correctly loaded, before you try to\
    \ do any DOM manipulation. If you do not use it, your code probably won't work\
    \ in the manner that you intended.\n\n```\n$(document).ready() {\n  alert(\"The\
    \ DOM is ready\");\n}\n```\n\nThis event is for checking to be sure that the document\
    \ is ready, but it doesn't include page assets such as images or video. If you\
    \ would like to check for assets that have been loaded, you use the jQuery `load()`\
    \ event that is outlined in the following tutorial.\n\n# PRELOADING IMAGES WITH\
    \ THE LOAD() EVENT\n\nPreloading images is practical when you're using many images\
    \ and you would like them to be available as soon as a user does something on\
