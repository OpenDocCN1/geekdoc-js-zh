  md: "# PART I: INTRODUCING JQUERY AND JAVASCRIPT\n\nAdvanced users may want to use\
    \ Git (source control software) to access the latest version of the jQuery library.\
    \ I won't be going into further detail about Git, so if you would like to learn\
    \ more about it, check out www.git.com.\n\n# INCLUDING THE JQUERY LIBRARY IN YOUR\
    \ WEB PAGE\n\nAfter you have decided which approach you want to take — either\
    \ downloading a library or using a hosted version of jQuery — you need to set\
    \ it up in your Web page. The jQuery library can be included in script tags and\
    \ live in the `<head></head>` tags of HTML document, or you can include the jQuery\
    \ library before your closing `</body>` tag.\n\nYou must include every CSS (cascading\
    \ stylesheets) before the jQuery library and jQuery custom code because you want\
    \ to ensure that all CSS is applied to the DOM (Document Object Model) before\
    \ you try to change it with jQuery.\n\nYou should always include a doctype in\
    \ your HTML pages. Failing to do so causes all sorts of erratic behavior within\
    \ your Web browser and causes your Web page to fail the validation suite check.\
    \ It helps to ensure that your code works across all browsers. jQuery will not\
    \ always render correctly if a doctype is not present on the page. CSS also renders\
    \ incorrectly when a doctype is not present on the page.\n\nAll of the examples\
    \ in this book use the HTML 5 doctype to ensure progressive enhancement and graceful\
    \ degradation with older browsers. (See Chapter 1 if you need a reminder of progressive\
    \ enhancement and graceful degradation.) The doctype for HTML5 is very simple\
    \ to set up previous doctypes, which are hard to remember.\n\nThe following code\
    \ is the doctype for HTML 5:\n\n```\n<DOCTYPE html>\n```\n\nThe following example\
    \ is a very basic HTML document that outlines how to include jQuery at the top\
    \ of the page. Always include all CSS files to ensure that the page has rendered\
    \ correctly before you manipulate the DOM:\n\n```\n<DOCTYPE html>\n<head>\n  <title>My\
    \ jQuery Example</title>\n  <link href=\"css/global.css\">\n  <script src=\"jquery.js\"\
    \ type=\"javascript\"></script>\n  <script type=\"text/javascript\">\n    // goes\
    \ here\n  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_41_0.png)"
  merge: -1
