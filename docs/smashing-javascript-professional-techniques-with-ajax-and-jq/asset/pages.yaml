  md: "# CHAPTER 3: USING SELECTORS, FILTERS, AND CSS: JQUERY AT ITS CORE\n\nTable\
    \ 3.1 The Anatomy of a jQuery Statement\n\n| The jQuery Alias | The Selector |\
    \ The jQuery Method or Action |\n|---|---|---|n| $ or jQuery | $(div) | .css('border',\
    \ '1px solid #333') |\n\n# SELECTING PAGE ELEMENTS BY USING CSS\n\nJavaScript\
    \ has native functions that can select elements by ID and tag. The downside of\
    \ these functions is that you have to use a different function for each of the\
    \ three types of elements. Also, this creates repetition and code bloat, which\
    \ can become a nightmare. When you use selectors in jQuery, one selector can handle\
    \ multiple types of elements. This makes writing clean and manageable code much\
    \ easier.\n\nAll examples in this book show the browser output as the Firebug\
    \ output you can see what is being added or changed to the DOM. (See Chapter 2\
    \ for more about installing and using Firebug). When you view the page source,\
    \ you don't see the rendered source. The rendered source is the actual code that\
    \ is created after the browser loads and the JavaScript has fired, as you are\
    \ manipulating the DOM, can can change quite noticeably. Firebug shows the rendered\
    \ source, and even show you the source as it changes, so it's the perfect way\
    \ to test your JavaScript and jQuery.\n\nThe following lists out the most common\
    \ jQuery selectors, which I explain in more depth with code and browser throughout\
    \ this chapter:\n\n+   * '$*'\n* '$(p)'\n '* '.class'\n* '$(#id'\n* '.parent ul\
    \ li'\n\nIn this chapter, I apply CSS to the elements using the jQuery .css()\
    \ method. The CSS method in jQuery works by allowing you to pass any CSS properties\
    \ to the CSS method that are then applied to the element matched by the selector.\
    \ The CSS is added to the element, as an inline style over the DOM is loaded and\
    \ ready.\n\nIn each example, you are not limited to the CSS I am applying. I'm\
    \ just showing individual examples of problems you may encounter yourself and\
    \ how to quickly solve them using selectors.\n\n# Selecting Elements by Using\
    \ the Wildcard (*) Selector\n\nIf you would like to select all elements in your\
    \ DOM or within other elements, use the wildcard (*) selector. The wildcard is\
    \ wrapped in quotes between the parentheses directly after the alias.\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_52_0.png)"
