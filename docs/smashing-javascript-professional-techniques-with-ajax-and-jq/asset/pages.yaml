  md: '# CHAPTER 4: WORKING WITH EVENTS


    # UNDERSTANDING HOW THE DOUBLE-CLICK EVENT WORKS


    The double-click event is set up in the same manner as the click event, with the
    exception that it is triggered by double-clicking the mouse. I don''t use the
    double-click event that often, but it can be useful for Web applications that
    act/or look like desktop applications.


    The jQuery double-click event is the same as the native JavaScript doubleclick
    event, which needs to be set up in a similar manner to the onclick event and be
    added directly to the element.


    Desktop software often requires a double-click for an action to occur within the
    program. On the Internet, the double-click action can lend itself well to adding
    products to a shopping cart. You can also use it if your users are not Internet-savvy
    and tend to always double-click. Still, the double-click event is not as commonly
    used as the click event.


    # CREATING A TOOLTIP THAT SHOWS CONTENT DURING THE HOVER EVENT


    Showing tooltips or little informative bubbles on links, form elements, and other
    elements on your page can help users navigate through your site while still being
    able to keep a consistent flow for more experienced users. Tooltips can be simple
    instructions on a form for users who aren''t aware of what a CVV number on a credit
    card is, or more interactive, as in Figure 4-7, which shows an example of a hover-triggered
    tooltip.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_96_0.png)


    Figure 4-7: A hover-triggered tooltip on the jQuery Web site


    © 2010 The jQuery Project and the jQuery UI Team'
