- img_proc: true
  md: '# CHAPTER 9: WORKING WITH DYNAMIC DATA AND AJAX


    # GETTING APPROVED FOR A YELP API KEY


    Before you work with any third-party APIs, you typically need to apply for an
    key except in some cases as you experienced with the previous Delicious API. The
    API key allows the third party to monitor your activity: By using their API, you
    access their servers and they need to monitor your traffic and requests. Most
    APIs allow 100 requests per day; anything more than that needs approval. Sometimes
    fees are involved. You should always check the API key before starting any development.


    The Yelp API limits requests 100 per day for development projects, which can be
    extended to 10,000 requests per day for live implementations after approval from
    Yelp. The API allows you to search businesses by business type, location, and
    neighborhood using three different methods: review search, search phone, and neighborhood.


    The approval process involves submitting a simple form outlining the intention
    of your application and how you utilize the Yelp API. After submitting the application,
    you receive an e-mail from Yelp and are assigned an account manager, who reviews
    your application and approves or disapproves your project. When integrating the
    Yelp API into your project, it is important that you give proper credit to the
    Yelp reviews by displaying the Yelp logo. This also helps to ensure that your
    project implementation is approved by Yelp. I review this process in the following
    tutorial.


    +   1. Before you can apply for a Yelp API key, you need a basic Yelp account.
    Navigate to www.yelp.com/signup, shown in Figure 9-24, and provide the requested
    information (basics like your date.

    2. After you have created a basic Yelp account, you need to login to Yelp through
    the developer portal shown in Yelp 9-25, or at www.yelp.com/login?return_url=%2Fdevelopers%2Fgetting_started%2Fapi_access.

    3. After you successfully log into the developers portal, you need to navigate
    to the API access section shown in Yelp 9-26 or at www.yelp.com/developers/getting-started/api_access.


    When you sign up for API access, you are granted the URL of your Web site and
    how you plan to use the API. Once you are granted, you receive a few e-mails from
    Yelp with instructions on how to use the API and so on. After you have set up
    your application, you need to show it to the account manager at Yelp that you
    have been assigned to have approved for production usage. They usually make sure
    that you are using the Yelp logo and also displaying the necessary information
    as spelled out in the Terms and Conditions you agreed to when you signed up for
    API access.


