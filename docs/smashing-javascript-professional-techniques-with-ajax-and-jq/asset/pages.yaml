  md: '# 9

    WORKING WITH DYNAMIC DATA AND AJAX


    JQUERY IS CAPABLE of DOM manipulation and does it really well. What you might
    not be aware of is that jQuery has various methods that allow for Ajax-type interactions.
    Many people have misconceptions about what Ajax is and what it isn''t. The acronym
    Ajax–s became a big buzzword around the dawn of Web 2.0. Web designers, developers,
    and marketers all claimed they could do Ajax, but what does that mean? It means
    being able to design, build, and market Web sites and applications that transmit
    data back and forth behind the scenes — letting you present a much richer user
    experience to your customers.


    In this chapter, I review how you can use jQuery to perform Ajax-type requests
    with server-side data. I use code examples that I built in previous chapters and
    show how you can add dynamic content to create self-updating widgets. I won''t
    instruct you on how to set up the server-side component, which requires knowledge
    of a backend programming language such as PHP or ASP.net and is beyond the scope
    of the book. I show you how to interact with a few popular server-side third-party
    APIs (application programming interfaces) to build dynamic integrations that can
    pull data from their API''s and present it on a Web site using jQuery.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# DISCOVERING AJAX


    Ajax stands for Asynchronous JavaScript and XML. The lesser-known buzzword is
    XHR, which stands for XML HTTP Request. If you use Firebug for Firefox a lot,
    you''ve probably seen Ajax requests labeled XHR, a type of AJAX request, as shown
    in Figure 9-1.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_225_0.png)


    Figure 9-1: XHR requests in Facebook shown in Firebug


    Ajax is a group of patterns and techniques that allow client-side applications
    to pass data back and forth with server-side applications without requiring a
    page refresh or reload. Ajax creates a seemingly seamless flow of data behind
    the scenes, which asynchronous is part of its name. It passes data back and forth
    asynchronously. Ajax requests are performed via POST or GET requests.


    Ajax requests can be done synchronously and sometimes must be. (Say, for example,
    you are loading an external configuration file and you do not want the rest of
    the script to proceed until you are sure that the config file has loaded successfully.)
    I focus on asynchronous requests only throughout this chapter.


    Facebook offers a great example of Ajax in action. When you log on to Facebook,
    you typically see your news feed of your friends'' status updates and latest activities.
    On the left is a list of friends who are currently online. This is controlled
    through Ajax request to the server that constantly checks whether any of friends
    are online. Perhaps one of your friends notices you and opens a chat session—that''s
    another Ajax request. While you are chatting with your friend, two other friends
    update their statuses, a message appears at the top of your news feed notifying
    you of the new news feed items. All of these are occurring through Ajax requests;
    you haven''t had to refresh/reload the page once. Quite amazing!'
  merge: -1
  pgno: 225
