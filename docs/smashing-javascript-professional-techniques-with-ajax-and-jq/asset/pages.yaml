    # FILTERING DOM ELEMENTS USING JQUERY SELECTOR FILTERS


    Filtering allows you to refine the elements that you are selecting. Filters are
    very handy when you''re to target just one, or a few, elements within your DOM.
    If you have a static HTML document, it is easy to adjust the HTML. But in cases
    where the DOM changes with every page request or load, you need to use a dynamic
    front-end language such as JavaScript to add formatting on the fly.


    A filter is defined by a colon that follows the active filter: :filter.


    # APPLYING BASIC FILTER DEFINITIONS


    As of jQuery 1.4.2, jQuery contains 20 different filters. I give real-world examples
    of the most common, but you can reference the following table to view the full
    list of filters available in jQuery.'
