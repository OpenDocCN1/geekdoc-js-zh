  md: '# GETTING INVOLVED IN THE JQUERY FORUM


    The jQuery Team runs a forum for others, shown in Figure 12-9, that you can use
    to post anything you want about jQuery, whether it be praise, problems, solutions,
    code examples, and so on. It''s a great place for any level of jQuery developer
    to interact with other developers.


    At the time of writing, the forum contains more than 65,000 posts and 143,236
    responses, so it''s a vibrant and active community. You need to set up a free
    account before you can participate. The jQuery Forum section is accessed by navigating
    to http://forum.jquery.com/.


