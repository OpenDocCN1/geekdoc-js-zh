    # CREATING ADVANCED ANIMATIONS


    jQuery offers a method called animate that you can use to create customized animations.
    Instead of chaining fade, slide, and show together, which can be quite limited
    in scope, the animate method allows you to use any CSS property that is controlled
    by a numeric value. The CSS properties that can be used with animate are listed
    in Table 5.2.


    Table 5.2 Common CSS Properties That Can Be Used with the Animate Method


    | CSS Property | Sample Value |

    |---|--|

    | opacity | 0.5 |

    | top | 10 px |

    | height | 100 px |

    | width | 200 px |

    | margin | 10 px |

    | padding | 15 px |'
