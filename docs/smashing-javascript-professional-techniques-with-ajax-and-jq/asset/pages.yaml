  md: '```

    $(''.container'').addClass(''active'');

    ```


    If the DOM element you are adding a class already has a class, the additional
    class will be added after it. If you wish to pass multiple classes to a matched
    set, just make sure you list each class separated by a space.


    ```

    $(''.container'').addClass(''active book'');

    ```


    You are not limited to adding classes by selecting classes. You can also add classes
    to ID and other HTML tags.


    ```

    $(''#page-wrap'').addClass(''alternate'');

    ```


    # Removing a Class from a DOM Element


    You also need to learn how to remove a class from an element. It works in the
    same way, but the method name changes from addClass() to removeClass().


    ```

    $(''#page-wrap'').removeClass(''alternate'');

    ```


    If no class name is passed into the method, any class in that matched set is removed.


    ```

    $(''#page-wrap'').removeClass();

    ```


    You can also remove multiple classes by adding them one after another into the
    method, each one separated by spaces.


    ```

    $(''#page-wrap'').removeClass(''alternate main product'');

    ```


    # Toggling a Class on a DOM Element


    Toggling is the act of turning something on or off. The toggleClass() method is
    useful when you''re working with dynamic Web applications where you may not know
    the on/off state that an element is in.


    In the following example, I toggle the class .alternate on the #page-wrap div.
    If the class does not exist, it is added, and vice versa.


    ```

    $(''#page-wrap'').toggleClass(''alternate'');

    ```'
