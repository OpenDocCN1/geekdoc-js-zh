  md: '# CHAPTER 9: WORKING WITH DYNAMIC DATA AND AJAX


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_256_0.png)


    Figure 9-26: The Yelp API access application


    Reproduced by yelp.com


    StanfordCTGuide.com is on top of WordPress (a blogging and content management
    service platform) and I have a WordPress plug-in to set up allow users to create
    reviews on restaurants. Our small site doesn''t draw enough reviews yet, and Yelp
    has a lot of credibility in terms of reviews and ratings. After reading through
    the Yelp documentation, I decided to set up an integration between Yelp and StanfordCTGuide
    to include reviews from Yelp for every restaurant listing on my site, as shown
    in Figure 9-27.


    As I stated previously, Yelp has a few APIs: Search, Phone, and Neighborhood.
    Search and Phone interest me most. All of the restaurants on StanfordCTGuide.com
    are listed with a street address and phone number. Using the Review API first,
    I tried passing review address data into the method to match up local restaurants
    with Yelp for reviews using this URL: https://api.yelp.com/business_review_searchlocation=650%20Mission%20St%2As%20Francisco%2A%20CA&ysid=XXXXXXXXXXXX.
    The problem I encountered is that the Yelp API didn always return one result.
    Most times, multiple results were returned, as shown in Figure 9-28.


    After a bit of testing, I learned that this was because of the inconsistency with
    which I had entered addresses into the site, I didn''t always add the ZIP code
    or correct street address. The Yelp API uses the address to match a review. If
    a full address isn''t provided, the API has a harder time making an exact match.
    Some API calls returned one result, whereas others returned five. This option
    was not going to work.'
