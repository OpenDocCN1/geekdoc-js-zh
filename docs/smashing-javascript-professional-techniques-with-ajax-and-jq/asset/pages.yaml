    ```\n\n3. I set up two variables: newsLength is set to the length of the newsArray.\
    \ And newsInterval handles the numeric value in milliseconds for how often to\
    \ grab a new headline and insert it into the news ticker.\n\n```\nvar newsLength\
    \ = 2000;\nvar newsInterval = ...\n```\n\n4. Select the H1 element and insert\
    \ the unordered list news-feed after update.\n$('h1').after('<ul id=\\'news-feed'></ul\\\
    >');\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_128_0.png)\n\nFigure 5-12: The\
    \ Real Time Search Engine, which shows new content from Twitter as it is posted\n\
    \nReproduced from 2010 © Google"
  merge: -1
