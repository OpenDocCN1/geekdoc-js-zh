  md: '# PART IV: EXPLORING ADVANCED JQUERY


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_247_0.png)


    9-16: Delicious, a social bookmarking siten© 2010 Yahoo! All rights reserved


    Many online social applications and Web Sites, Delicious has a great developer
    community and API (application programming interface). Delicious offers RSS (Really
    Simple Syndication) feeds of every page as shown in Figure 9-17, including the
    most popular bookmarks and bookmarks organized by the specific user who created
    them. RSS is created using the XML standard for Web feeds.


    Delicious also offers an API interface for more advanced users who wish to build
    Web and mobile apps with the Delicious API, as shown in Figure 9-18. The API allows
    you to post content to display content from Delicious. This requires authentication
    in the form of an API key.


    For the following tutorial, I use the Delicious feeds that are RSS (XML) and JSON
    feeds of data that already resides on the site. You can pass parameters into the
    query string to display specific content, but you can''t add any content to Delicious
    via these feeds. Refer to the documentation on the Delicious Web site for a complete
    list of all available query string variables, as shown in Figure 9-19.


    By adding my username "jakerutter" into the query string of the URL (http://feeds.delicious.com/v2/json/jakerutter?count=10),
    I can retrieve the last ten bookmarks that I have added to Delicious, as shown
    in Figure 9-20. This feed is available to every user and can be added to follow
    a friend''s feed to see all of the bookmarks they have been creating.


