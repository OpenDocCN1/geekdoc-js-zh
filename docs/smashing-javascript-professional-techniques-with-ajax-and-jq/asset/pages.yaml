  md: '# CHAPTER 3: USING SELECTORS, FILTERS, AND CSS: JQUERY AT ITS CORE


    # Cloning HTML Elements


    You may encounter a situation where you need to copy an element in the DOM and
    place it somewhere else. jQuery has a method called clone(), which clones whichever
    element you select. After the element is cloned, you are free to place it where
    you like using other manipulation methods such as the append() method, as shown
    in the following code example:


    ```

    $(''.product'').clone().append(''.product'');

    ```


    # WORKING WITH CSS AND JQUERY


    CSS and jQuery feel like they are meant to work together. I often wonder how I
    survived so long without jQuery, especially when working extensively with CSS.
    Up until this point, I have been using the .css() method to add CSS properties
    to HTML elements on the page in most of my examples. The downside to using the
    .css() method is that it adds inline styles to the HTML. If you prefer to keep
    the code cleaner, I would suggest adding and removing classes instead.


    Table 3.4 outlines all of the CSS methods available to use when working with jQuery.


    # Table 3.4 Commonly Used CSS Methods and Their Abilities


    | Method Name | Method |

    |---|---|

    | .css() | Can retrieve or add CSS properties to any element |

    | .addClass() | Can add a CSS class to any element |

    | .hasClass() | Can test if an element has a CSS class |

    | .removeClass() | Can remove a CSS class from any element |

    | .toggleClass() | Can add and remove CSS classes from any element |


    # Adding CSS to a DOM Element


    If you''ve been working through this chapter in order, you should be familiar
    with now adding CSS to any element in the DOM because I have been using the .css()
    method in all of my code examples. It is a useful method, especially if you are
    testing layout and would like to add borders to all of yours.


    ```

    $(''.container'').css(''border'', ''1px solid #333'');

    ```


    # Adding a Class to a DOM Element


    If you would like to add a class to an existing DOM element, you can use the addClass()
    method. This method works by passing the name of the class that you would like
    to add in the parentheses after the addClass(). When you are adding the class
    name, you do not need to include the period.'
