  md: '# PART II: LEARNING THE JQUERY FUNDAMENTALS


    # UNDERSTANDING EVENTS IN JQUERY


    jQuery Events are a fundamental piece of any Web site or Web page. When the Internet
    first started, it was just static text, images, and hyperlinks. As the technology
    advanced, we started to see more dynamic Web pages that interacted with a database.


    As the back-end ends grew more advanced, so did the front-end, with technologies
    such as Adobe Flash and JavaScript, which added another dimension of interactivity.
    Hyperlinks have become rollers and expanding menus, images have turned into interactive
    galleries with editing abilities, and static text has evolved into powerful and
    dynamic search engines such as the Kayak travel search engine, which offers a
    map-based view, as shown in Figure 4-1. jQuery allows you to see all of the native
    JavaScript events to capture interactions through the keyboard and the mouse,
    but with less code and in an easier-to-understand syntax. That''s why jQuery works!


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_83_0.png)


    Figure 4-1: Many different types of events allow you to visually book hotels on
    a map through the Kayak Web site.


    # WORKING WITH DOCUMENT AND WINDOW EVENTS


    Table 4.1 introduces jQuery document and window events, which are important events
    to keep in mind whenever you are writing jQuery. The table outlines each event
    and their function, allowing you to compare them at a glance to ensure that you
    are using the best-suited event for your script.'
