    # ADDING A ROW AFTER A ROW BASED ON ITS INDEX VALUE


    Just as you add a row based on its position in the table as first or last, you
    can also insert a row based on the index value of the row proceeding or following
    it. Set a selector that selects all elements that have an index of 5 using the
    :eq( ) filter and insert the Special Offer TODAY HTML content directly after the
    matched element.


    > :eq() is a filter selector that allows you to filter by index.


    ```

    $$(tr:eq(5)).after(''<tr><td colspan="4">Special Offer TODAY</td></tr>'');

    ```'
