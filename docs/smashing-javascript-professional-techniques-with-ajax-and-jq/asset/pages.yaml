    # HIGHLIGHTING CURRENT FIELDS IN FORMS


    In larger forms, you can help users keep track of where they are by highlighting
    the field where they are currently. Most browsers have built-in events that highlight
    the current field, such as the Firefox example in Figure 8-3.


    You can set a secondary highlight using CSS and the jQuery event. By adding a
    custom highlight, you can ensure that users know how far along they are in any
    given form. Using CSS, you can add a highlight as shown on the contact form example
    from Wufoo (www.wufoo.com) in Figure 8-4.'
