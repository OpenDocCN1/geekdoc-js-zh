  md: "# CHAPTER 5: MAKING YOUR WEB SITE COME ALIVE WITH EFFECTS\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_124_0.png)\n\
    \n# jQuery Images Galore.\n\nFigure 5-10: The output of the for loop in the browser.\
