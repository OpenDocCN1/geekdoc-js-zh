  md: "# PART III: APPLYING JQUERY TO YOUR WEB SITE\n\n```\n$*(#tabs li a).hover(\n\
    function () {\n  // mouseenter event\n}\nfunction () {\n  // mouseleave event\n\
    }\n```\n\n+   8. You only need to add a statement to the mouseenter handler, which\
    \ uses the animate method because the animation only occurs as the mouse hovers\
    \ her mouse over the tab after 300 milliseconds, the tab moves 20 pixels from\
    \ the left in a span of 50 milliseconds, which is the duration, and then it snaps\
    \ back into place. You can track the animate method by adding different CSS properties\
    \ if you would like a different effect.\nanimate() method works only with CSS\
    \ properties that have numeric properties such as margin, padding, left, top,\
    \ and opacity.\n$*(#tabs li a).hover(\nfunction () {\n  // mouseenter event\n\
    \  $(this).animate({left:20}, 300, function () {\n    $(this).animate({left:0},\
    \ 50);\n  });\n}\nfunction () {\n  // mouseleave event\n})\n\n+   9. Attach a\
    \ click event to the navigation element (#tabs li a). The click event controls\
    \ the showing and hiding of content on the page. Add a return false statement\
    \ to the click event to prevent the default event, which is the browser trying\
    \ to navigate to the link (#) that was clicked, from occurring.\n$*(#tabs li a).bind('click',\
    \ function () {\n  return false;\n})\n\n+   10. The first statement that is added\
    \ to the click event handler is to get the index value of the tab that was clicked.\
    \ Create a selector using the navigation element (#tabs li a), attach the index\
    \ method and pass in this as the parameter and assign it to the variable linkIndex.\n\
    $*(#tabs li a).bind('click', function () {\n  var linkIndex = $('#tabs li a).index(this);\n\
    \  return false;\n})\nUsing an index instead of static class or ID names allows\
    \ the script to handle changes in the HTML by adding or removing tabs, without\
    \ having to rewrite the script as if you had hard-coded elements into the script.\
    \ This script is much more valuable when it can be applied to any number of tabs\
    \ and therefore therefore scalable.\nThe index() method returns the index position\
    \ of an object when a selector or element is passed into the method as a parameter\
    \ and evaluated.\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_163_0.png)"
