    as those seen in Google Analytics in Figure 7-14. Recently, a number of developers
    have developed jQuery plug-ins that can create comparable charts without the dependency
    of Flash. The Visualize plugin-in, created by Filament Group, is one of the best
    solutions for creating charts. The Visualize plugin-in allows you to create graph,
    line, bar and pie charts using tabular data. It has a number of options that can
    be passed to the function to set up and alter a chart on any page using data pulled
    from HTML tables. Table 7.2 lists the Visualize configuration.


