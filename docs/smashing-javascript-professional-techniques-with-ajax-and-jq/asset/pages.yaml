  md: '# WATCHING JQUERY GROW


    The growth of jQuery is impressive — not long ago, it was used by only a small
    network of people. Now with support from companies such as Google and Microsoft,
    among many others as seen in Figure 12-1, for jQuery has exploded. Companies that
    once didn''t want to support jQuery are now totally invested in the fight.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_313_0.png)


    Figure 12-1: Sites using jQuery


    The success of jQuery is a product not only of its creator, John Resig, and his
    team, but also the massive community that supports jQuery. I encourage everyone
    who reads this book to donate to the jQuery Project. It doesn''t have to be a
    massive amount — even $5 makes a difference. The jQuery Project is non-profit.
    Most of the people who work on the project are non-paid volunteers and their goal
    is to make something great, not to make money.


    When you think about all the time and effort jQuery has probably saved, donating
    a few bucks is a great way of saying thanks. To ensure that the people behind
    jQuery can continue creating such a great product, donate at http://jquery.org/donate,
    shown in Figure 12-2.'
  merge: -1
