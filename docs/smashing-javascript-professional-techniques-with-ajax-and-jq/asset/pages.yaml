    \ This variable is included when you set up the images in the slideshow later\
    \ in the tutorial.\n\n```\nvar imgDir = 'insel/adams';\",\n```\n\n+   4. Append\
    \ the element slide-image into the DOM inside of the container element. This inserted\
    \ element holds all of the images as they are added into the DOM.\n$('.container').append('<div\
