  md: '# PART II: LEARNING THE JQUERY FUNDAMENTALS


    # BUILDING AN IMAGE GALLERY WITH TEXT CAPTIONS

    USING ADVANCED ANIMATIONS


    I worked with Flash and ActionScript until two years ago, when I decided to change
    course and start working more with JavaScript and jQuery. I made the switch because
    I can have more control over the DOM using JavaScript and because of the lack
    of Flash and ActionScript on mobile devices such as iPhone. Flash is good for
    advanced animation, but image galleries have come a long way in JavaScript. The
    major benefit I found to learn ActionScript is how similar the languages are to
    each other in how they handle events and effects.


    Understanding the basic concepts behind any programming language gives you huge
    advantage when trying to learn another language: Most of the concepts stay the
    same; only the language syntax changes. Both ActionScript and JavaScript are based
    on ECMAScript, so they have many similarities. And not than once, I have encountered
    a déjà vu moment working with JavaScript because the syntax and conventions closely
    resemble those in ActionScript.


    Back in 2006, I built my first Flash 8 XML-driven slideshow. It was a pretty slick
    application. If you pasted a XML file into the Flash file, it would iterate through
    the XML, add the slides, and animate them, allowing you to click on each slide
    and have take you to a link, as shown in Figure 5-14. I was very proud of that
    script — so proud, that I released it on my blog (overutter.com) and it has been
    downloaded more than 13,000 times. The size of the Flash file was about 5 KB and
    there were 136 lines of code, which was quite compact and impressive at the time.
    It wasn''t until I started with jQuery that I began to realize how much code is
    too much!


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_131_0.png)


    Figure 5-14: A Flash 8 XML gallery I created in 2006'
