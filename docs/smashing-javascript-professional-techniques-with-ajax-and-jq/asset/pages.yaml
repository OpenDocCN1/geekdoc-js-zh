    \ that you use unique IDs for each input because these are used to select each\
    \ input in the next step.\n\n```\n<form id=\"contact-form\">\n<ul>\n    <li><label>Name</label>\n\
    \    <input type=\"text\" id=\"name\" name=\"name\">\n    </li>\n    <li><label>Email</label>\n\
    \    <input type=\"text\" id=\"email\" name=\"email\">\n    </li>\n    <li><label>Phone</label>\n\
    \    <input type=\"text\" id=\"phone\" name=\"phone\">\n    </li>\n    <li><label>Message</label>\n\
    \    <textarea name=\"message\" id=\"message\"></textarea>\n    </li>\n    <li><input\
    \ type=\"submit\" id=\"submit\">\\n</ul>\n</form>\n```\n\nImagine the following\
    \ steps in a scenario where a user visits your Web site and fills out a form,\
    \ which is submitted behind the scenes as an Ajax request:\n\n2. Create a selector\
    \ that selects the #submit input button and binds the click event. Add a return\
    \ false statement so that if the button is clicked, the default form action does\
    \ not take place.\n\n```\n$('#submit').bind('click', function() {\n    return\
    \ false;\n});\n```\n\n3. Set up four variables inside the state: nameVal, emailVal,\
    \ phoneVal, and msgVal. Each variable is set to the value of the input element.\
    \ This is how we grab all the values from the form fields to pass to the server.\n\
    \n```\n$('#submit').bind('click', function() {\n    var nameVal = $('#name').val();\n\
    \    var emailVal = $('#email').val();\n    var phoneVal = $('#phone').val();\n\
    \    var msgVal = $('#message').val();\n    return false;\n});\n```\n\n4. Add\
    \ the POST method after the variables. When setting up the POST method, you have\
    \ to pass in all the form parameters in order for the post to work correctly.\
    \ The parameters are matched with each value from the form that were set up in\
    \ the previous step and passed into the POST method as key:value pairs.\n\n```\n\
    $('#submit').bind('click', function() {\n    var nameVal = $('#name').val();\n\
    \    var emailVal = $('#email').val();\n    var phoneVal = $('#phone').val();\n\
    });\n```\n\n![](img/1acc4cca62f1121e3ee1bc2b5a93931f_236_0.png)"
