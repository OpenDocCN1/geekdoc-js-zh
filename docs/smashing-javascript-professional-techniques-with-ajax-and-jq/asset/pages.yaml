  md: '# CHAPTER 6: IMPROVING NAVIGATION: MENUS, TABS, AND ACCORDIANS


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_158_0.png)


    Figure 6-9: The accordion script in Firefox, the Firebug pane open so you can
    see it


    The accordion script helps you to display a large amount of content in a single
    space, but it has its limitations,


    +   - As you add more menu items to the accordion, you need to scroll further
    down the page to select or view the content embedded within those items. If you
    use an accordion in a real-world application, this limitation can greatly limit
    the user interface, which can decrease usability or even sales, if it''s an e-commerce
    site.


    +   - The accordion does not remember the content that you are in if you refresh
    the page, although this type of functionality can be set up using cookies and
    jQuery. There is also a better, cookie-less technique that involves using accordions
    and query string handling, which you can find out more about Rebecca Murphy''s
    blog (http://blog.rebeccamurphy.com/2007/12/04/anchor-based-url-navigation-with-jquery/).


    +   - The accordion section location cannot be saved if you go to a page and bookmark
    the page expecting the accordion to stay open in that particular section, it won''t.
    The solution would be to set up accordions as mentioned in the preceding paragraph.


    +   - If your Web site audience is not Internet-savvy, they may not be familiar
    with accordions and therefore will not understand how they work.


    # CREATING TABBED CONTENT


    Tab navigation is popular with Web designers and developers as an easy and intuitive
    way for users to navigate through a Web site or application. The tab structure
    is reminiscent of the'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'days of storing files in filing cabinets using tagged hanging headers to identify
    what files were included. The tab structure has been transferred to the Web as
    a great way of organizing your data into logical "filing cabinets" or Web pages.
    Figure 6-10 shows an example of how Basecamp, a project management tool, uses
    tabs to organize and display content within the tools sections.


    ![](img/1acc4cca62f1121e3ee1bc2b5a93931f_159_0.png)


    Figure 6 10: Basecamp, a project management tool. uses tabs to organize and display
    content within the tools sections


    Tab-style navigation is not only seen on the Web, but also on computer desktops.
    Web browsers such as Mozilla Firefox and Google Chrome use tabs to display Web
    pages within one window, and recently Internet Explorer 7 has also adopted this
    type of user interface as well. The chat programs Adium for Mac and Trillian for
    PC have adopted tab-style navigation for organizing multiple sessions into window.


    Some We have taken tab-style navigation to the next level by coupling it with
    dynamic content switching. Instead of using tabs to navigate to different areas
    within their Web sites, dynamic content switching occurs when the tabs are used
    to show content within the same page, similar to how an accordion menu is used
    to display large amounts of data in smaller spaces, but in a more user-friendly
    way. Some Web sites have even the extra mile of showing content that is loaded
    via Ajax when a tab is clicked, which is dynamic content in the pure sense because
    it''s not actually on the page and can change every time. In Figure 6-11, the
    Code Web site (www.panic.com/coda) uses tabs to show dynamic content on the page.
    The content is shown using animation effects, which is pretty nifty. As the user
    clicks each tab, content slides on and off the screen from left to right, or vice
    versa.'
