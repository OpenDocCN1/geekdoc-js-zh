  md: "In the previous example, I set up the mouseenter and mouseleave events using\
    \ a map of event type/handler pairs. The benefit to setting up the events in this\
    \ manner is that it allows you to add more events that you would like to bind\
    \ to this element within the same function.\n\nA JavaScript object literal, also\
    \ known as a map, is a collection of name and value pairs. The syntax is usually\
    \ set up by opening and closing curly brackets with the name values enclosed in\
    \ single quotes and separated by a colon. Each name/value pair is on its own line,\
    \ as shown in the following example:\n\n```\n{\n  'name1' : 'value1',\n  'name2'\
    \ : 'value2',\n  'name3' : 'value3'\n}\n```\n\nYou can use mouseenter and mouseleave\
    \ in another way to still obtain the same output. The hover event binds the mouseenter\
    \ and mouseleave events together into one event, leaving you with syntax that\
    \ is concise and easy to use, as you can see in the following code:\n\n```\n$(document).ready(function()\
    \ {\n  $('.product-image').hover(\n    function () {\n      var toolTip = $(this).attr(\"\
    title\");\n      $('.info').after('<p class=\"tooltip\">tooltip</p>');\n    },\n\
    \    function () {\n      $(this).tooltip().hide();\n    }\n  );\nn});\n```\n\n\
    # CREATING BASIC ADD TO CART FUNCTIONALITY WITH MOUSELDOWN AND MOUSEUP EVENTS\n\
    \nDrag-and-drop functionality on the Web is becoming increasingly popular. It\
    \ adds a level of deeper interactivity by allowing users to move elements on the\
    \ screen in a 3D fashion. Figure 4-10 shows the Yahoo! Sports Fantasy Baseball\
    \ interface featuring a slick drag-and-drop interface.\n\nThe native JavaScript\
