    # How to Inspect and Edit HTML


    The inspect and edit feature of Firefox is very powerful — it makes debugging
    HTML and JavaScript much easier, especially when you are changing the DOM on the
    fly. If you have a script that adds/changes HTML, you can open up the inspect
    window and see the HTML changes in real-time. It''s always the first step I take
    when debugging JavaScript. I always like to make sure that what the HTML is being
    created properly before proceeding. See Figure 2-9 for an example of what your
    screen should look like after you have enabled Firefox with the HTML section.


    # How to Use the Console


    The Firefox console is the second step I take in debugging my JavaScript. After
    I have fixed any issues with the DOM, I use the console to try running my script
    live on the page. You see two panels in the console — the left panel is for showing
    errors and the right panel is otherwise known as the command line.


    +   - Open Firefox and click the Console tab.

    - If there are any errors with your JavaScript, you see them displayed on the
    left pane. Figure 2-10 for an example of Firefox open with errors displayed.'
