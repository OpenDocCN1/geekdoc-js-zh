    ## 10.2 Post Liking


    To allow users to like posts and interact with the content, we''ll update the
    Post model and create a like route. Let''s start by modifying the `models/post.js`
    file:


    ```javascript

    const mongoose = require(''mongoose'');


    const postSchema = new mongoose.Schema({

    title: { type: String, required: true },

    content: { type: String, required: true },

    likes: { type: Number, default: 0 },

    });


    const Post = mongoose.model(''Post'', postSchema);


    module.exports = Post;

    ```


    In this code, we added a `likes` field to the post schema, which will store the
    number of likes a post has received.


    Next, let''s create a like route in the `routes/posts.js` file:


    ```javascript

    const express = require(''express'');


    const router = express.Router();


    const Post = require(''../models/post'');


    const authenticate = require(''../middleware/auth'');


    // Like post route (protected)

    router.put(''/like/:postId'', authenticate, async (req, res) => {

    try {

    const postId = req.params.postId;

    const post = await Post.findById(postId);

    if (!post) {

    return res.status(404).json({ error: ''Post not found'' });

    }

    // Check if the user has already liked the post

    const hasLiked = post.likes.includes(req.user);

    if (hasLiked) {

    return res.status(400).json({ error: ''You have already liked this post'' });

    }

    // Increment the likes count and add the user to the likes array

    post.likes.push(req.user);

    post.likesCount++;

    await post.save();

    res.status(200).json({ message: ''Post liked successfully'' });

    } catch (error) {

    res.status(500).json({ error: ''An error occurred while liking the post'' });

    }

    });


    module.exports = router;

    ```


    In this code, we created a `PUT` route for liking a post. The `authenticate` middleware
    ensures that only authenticated users can access this route. We extract the `postId`
    from the request parameters.


    Inside the route handler, we first find the post based on the `postId`. If the
    post is not found, we return a 404 status code with an error message.


    Next, we check if the user has already liked the post by checking if their username
    is present in the `likes` array of the post. If they have already liked the post,
    we return a 400 status code with an error message.


    If the user has not liked the post, we increment the `likesCount` field and add
    the user''s username to the `likes` array. We then save the updated post and send
    a success message as the response.


