    \ my name is ${this.name} and I'm ${this.age} years old.`);\n};\n\nconst person\
    \ = new Person('John', 30);\nperson.greet(); // Output: Hello, my name is John\
    \ and I'm 30 years old.\n```\n\nIn this example, we define a `Person` constructor\
    \ function that takes `name` and `age` as parameters. We assign these values to\
    \ the object using the `this` keyword. The `greet()` method is added to the prototype\
