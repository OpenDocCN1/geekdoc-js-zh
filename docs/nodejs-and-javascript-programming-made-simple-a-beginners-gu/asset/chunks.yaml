    ```\n\n# 6.8 对象原型与继承\n\nJavaScript 是一种基于原型的语言，这意味着对象可以从其他对象继承属性和方法。这个概念被称为继承。对象可以有一个原型对象，该对象作为其所继承的属性和方法的蓝图。\n\
