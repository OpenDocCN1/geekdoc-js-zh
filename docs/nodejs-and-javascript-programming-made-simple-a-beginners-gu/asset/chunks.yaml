    allowing users to navigate through blog posts, register, log in, and access protected
    routes.


    # Chapter 7: Adding Commenting Functionality


    In this chapter, we will enhance our blogging application by adding the ability
    for users to comment on blog posts. Comments provide a way for users to engage
    with the content and share their thoughts. Let''s dive into implementing commenting
    functionality!


    ## 7.1 Creating a Comment Model


    To begin, let''s create a new model called `Comment` to represent comments on
    blog posts. In the `models/comment.js` file, add the following code:


    ```javascript


    const mongoose = require(''mongoose'');


    const commentSchema = new mongoose.Schema({


    content: {


    type: String,


    required: true,


    },


    postId: {


    type: mongoose.Schema.Types.ObjectId,


    ref: ''Post'',


    required: true,


    },


    createdAt: {


    type: Date,


    default: Date.now,


    },


    });


    const Comment = mongoose.model(''Comment'', commentSchema);


    module.exports = Comment;


    ```


    In this code, we define the `Comment` schema with the `content` field to store
    the comment content, the `postId` field to establish a relationship with the corresponding
    blog post, and the `createdAt` field to store the creation date of the comment.
    We export the `Comment` model for use in other parts of our application.


    ## 7.2 Adding Comment Creation Route


    Next, let''s add a route to handle the creation of comments. In the `routes/comments.js`
    file, add the following code:


    ```javascript


    const express = require(''express'');


    const router = express.Router();


    const Comment = require(''../models/comment'');


    // Create comment route


    router.post(''/create'', (req, res) => {


    const { content, postId } = req.body;


    // Validate input fields


    if (!content || !postId) {


    return res.status(400).json({ error: ''Please provide comment content and associated
    post ID'' });


    }


    // Create a new comment


    const newComment = new Comment({ content, postId });


    // Save the comment to the database


    newComment.save()


    .then(() => {


    res.status(201).json({ message: ''Comment created successfully'' });


    })


    .catch((error) => {


    res.status(500).json({ error: ''An error occurred while creating the comment''
    });


    });


    });


    module.exports = router;


    ```


    In this code, we define a route to handle the creation of comments. We extract
    the `content` and `postId` from the request body and validate that both fields
    are provided. If not, we return a 400 status code with an error message.


    We create a new instance of the `Comment` model with the extracted data and save
    it to the database using the `save` method. If the save operation is successful,
    we return a 201 status code with a success message. Otherwise, we return a 500
    status code with an error message.


    ## 7.3 Retrieving Comments for a Post


    To retrieve all comments for a specific blog post, we''ll add a route that takes
    a post ID as a parameter. In the `routes/comments.js` file, add the following
    code:


    ```javascript


    // Get comments by post ID route


    router.get(''/post/:postId'', (req, res) => {


    const postId = req.params.postId;


    // Find comments by post ID


    Comment.find({ postId })


    .then((comments) => {


    res.status(200).json(comments);


    })


    .catch((error) => {


    res.status(500).json({ error: ''An error occurred while retrieving comments''
    });


    });


    });


    module.exports = router;


    ```


    In this code, we define a route that accepts the


    `postId` as a parameter. We use the `Comment` model''s `find` method to retrieve
    all comments associated with the specified post ID. If the retrieval is successful,
    we return a 200 status code with the array of comments. If there''s an error,
    we return a 500 status code with an error message.


    ## 7.4 Displaying Comments in the Frontend


    To display the comments on the blog post page in the frontend, update your blog
    post template (e.g., `views/post.ejs`) to include the following code:


    ```html


    <!-- Your existing blog post content here -->


    <!-- Comments section -->


    <h2>Comments</h2>


    <div id="comments-container">


    <% comments.forEach((comment) => { %>


    <div class="comment">


    <p><%= comment.content %></p>


    <p>Posted on <%= comment.createdAt.toDateString() %></p>


    </div>


    <% }) %>


    </div>


    <!-- Comment form -->


    <form id="comment-form" action="/comments/create" method="POST">


    <input type="hidden" name="postId" value="<%= post._id %>">


    <textarea name="content" placeholder="Enter your comment"></textarea>


    <button type="submit">Submit</button>


    </form>


    ```


    In this code, we iterate over the `comments` array passed from the server and
    display each comment''s content and creation date. We also provide a comment form
    that includes a hidden field for the post ID and a textarea for entering the comment
    content.


    ## 7.5 Enhancing the User Experience


    To improve the user experience, we can add some JavaScript functionality to enable
    the submission of comments via AJAX and dynamically update the comments section.
    Add the following code to your frontend JavaScript file (e.g., `public/js/main.js`):


    ```javascript


    const commentForm = document.getElementById(''comment-form'');


    const commentsContainer = document.getElementById(''comments-container'');


    commentForm.addEventListener(''submit'', (event) => {


    event.preventDefault();


    const formData = new FormData(commentForm);


    const content = formData.get(''content'');


    const postId = formData.get(''postId'');


    const comment = { content, postId };


    fetch(''/comments/create'', {


    method: ''POST'',


    headers: {


    ''Content-Type'': ''application/json'',


    },


    body: JSON.stringify(comment),


    })


    .then((response) => response.json())


    .then(() => {


    // Clear the comment form


    commentForm.reset();


    // Fetch and update the comments section


    fetch(`/comments/post/${postId}`)


    .then((response) => response.json())


    .then((comments) => {


    updateComments(comments);


    })


    .catch((error) => {


    console.error(''An error occurred while retrieving comments:'', error);


    });


    })


    .catch((error) => {


    console.error(''An error occurred while submitting the comment:'', error);


    });


    });


    function updateComments(comments) {


    commentsContainer.innerHTML = '''';


    comments.forEach((comment) => {


    const commentElement = document.createElement(''div'');


    commentElement.classList.add(''comment'');


    const contentElement = document.createElement(''p'');


    contentElement.textContent = comment.content;


    const dateElement = document.createElement(''p'');


    dateElement.textContent = `Posted on ${new Date(comment.createdAt).toDateString()}`;


    commentElement.appendChild(contentElement);


    commentElement.appendChild(dateElement);


    commentsContainer.appendChild(commentElement);


    });


    }


    ```


    In this code, we add an event listener to the comment form''s submit event. When
    the form is submitted, we prevent the default form submission behavior and extract
    the comment content and post ID.


    We then send a POST request to the `/


    comments/create` endpoint with the comment data as JSON. If the request is successful,
    we clear the comment form and fetch the updated comments for the post. The `updateComments`
    function is called to dynamically update the comments section with the new comments.


    ## 7.6 Summary


    Congratulations! In this chapter, we successfully implemented commenting functionality
    in our blogging application. Users can now comment on blog posts, and the comments
    are stored in the database. We also enhanced the user experience by dynamically
    updating the comments section without requiring a page refresh.


    # Chapter 8: Implementing Search in our Blogging Application


    In this chapter, we''ll enhance our blogging application by adding a search functionality
    that allows users to search for specific blog posts based on keywords. Implementing
    search will improve the user experience and make it easier for users to find relevant
    content. Let''s get started!


    ## 8.1 Setting Up Search Index


    To enable search functionality, we''ll use a powerful search engine called Elasticsearch.
    Follow these steps to set up Elasticsearch in your application:'
