    a user with the same username or email is found, we return a 409 status code with
    an error message.


    If the username and email are unique, we hash the password using bcrypt with a
    cost factor of 10 for security. Then, we create a new user instance with the hashed
    password and save it to the database.


    ## 9.2 User Login and Authentication


    Next, let''s implement user login functionality. Update the `routes/users.js`
    file with the following code:


    ```javascript


    const express = require(''express'');


    const router = express.Router();


    const bcrypt = require(''bcrypt'');


    const jwt = require(''jsonwebtoken'');


    const User = require(''../models/user'');


    // User login route


    router.post(''/login'', async (req, res) => {


    const { username, password } = req.body;


    try {


    // Check if the user exists


    const user = await User.findOne({ username });


    if (!user) {


    return res.status(401).json({ error: ''Invalid username or password'' });


    }


    // Compare the provided password with the stored hashed password


    const passwordMatch = await bcrypt.compare(password, user.password);


    if


    (!passwordMatch) {


    return res.status(401).json({ error: ''Invalid username or password'' });


    }


    // Generate a JWT token


    const token = jwt.sign({ username: user.username }, ''your-secret-key'');


    res.status(200).json({ token });


    } catch (error) {


    res.status(500).json({ error: ''An error occurred while logging in'' });


    }


    });


    module.exports = router;


    ```


    In this code, we handle the `POST` request to the `/login` endpoint. First, we
    check if a user with the provided username exists in the database. If not, we
    return a 401 status code with an error message.


    If the user is found, we compare the provided password with the stored hashed
    password using bcrypt. If the passwords match, we generate a JSON Web Token (JWT)
    using the `jsonwebtoken` library. The JWT will be used for authentication and
    authorization purposes.


    The token is then returned as a response to the client.


    ## 9.3 Protecting Routes with Authentication Middleware


    To protect certain routes and allow only authenticated users to access them, we''ll
    create an authentication middleware. In the `middleware/auth.js` file, add the
    following code:


    ```javascript


    const jwt = require(''jsonwebtoken'');


    // Authentication middleware


    const authenticate = (req, res, next) => {


    const token = req.headers.authorization;


    if (!token) {


    return res.status(401).json({ error: ''Unauthorized'' });


    }


    try {


    const decoded = jwt.verify(token, ''your-secret-key'');


    req.user = decoded.username;


    next();


    } catch (error) {


    res.status(401).json({ error: ''Invalid token'' });


    }


    };


    module.exports = authenticate;


    ```


    In this code, we define an authentication middleware function called `authenticate`.
    This middleware checks if a JWT token is present in the `Authorization` header
    of the request. If no token is found, we return a 401 status code with an "Unauthorized"
    error message.


    If a token is present, we verify it using the same secret key used for token generation.
    If the token is valid, we extract the username from the decoded token and set
    it in the `req.user` property for future use.


