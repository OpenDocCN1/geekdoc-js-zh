  trans: "\n我们的应用程序现在提供了更具参与感且用户友好的体验，允许用户浏览博客文章、注册、登录并访问受保护的路由。\n\n# 第 7 章：添加评论功能\n\
    \n在本章中，我们将通过添加用户对博客文章发表评论的功能来增强我们的博客应用程序。评论为用户提供了与内容互动以及分享想法的途径。让我们深入实现评论功能的实现吧！\n\
    \n## 7.1 创建评论模型\n\n首先，让我们创建一个名为 `Comment` 的新模型来表示博客文章的评论。在 `models/comment.js`\
    \ 文件中，添加以下代码：\n\n```javascript\nconst mongoose = require('mongoose');\n\nconst\
    \ commentSchema = new mongoose.Schema({\ncontent: {\n  type: String,\n  required:\
    \ true,\n},\npostId: {\n  type: mongoose.Schema.Types.ObjectId,\n  ref: 'Post',\n\
    \  required: true,\n},\ncreatedAt: {\n  type: Date,\n  default: Date.now,\n},\n\
    });\n\nconst Comment = mongoose.model('Comment', commentSchema);\n\nmodule.exports\
    \ = Comment;\n```\n\n在这段代码中，我们定义了带有 `content` 字段的 `Comment` 模式用于存储评论内容，`postId`\
    \ 字段用于与相应的博客文章建立关系，`createdAt` 字段用于存储评论的创建日期。我们导出了 `Comment` 模型供应用程序的其他部分使用。\n\
    \n## 7.2 添加创建评论路由\n\n接下来，让我们添加一个处理创建评论的路由。在 `routes/comments.js` 文件中，添加以下代码：\n\
    \n```javascript\nconst express = require('express');\nconst router = express.Router();\n\
    const Comment = require('../models/comment');\n\n// 创建评论路由\nrouter.post('/create',\
    \ (req, res) => {\nconst { content, postId } = req.body;\n// 验证输入字段\nif (!content\
    \ || !postId) {\n  return res.status(400).json({ error: 'Please provide comment\
    \ content and associated post ID' });\n}\n// 创建新评论\nconst newComment = new Comment({\
    \ content, postId });\n// 将评论保存到数据库\nnewComment.save()\n.then(() => {\n  res.status(201).json({\
    \ message: 'Comment created successfully' });\n})\n.catch((error) => {\n  res.status(500).json({\
    \ error: 'An error occurred while creating the comment' });\n});\n});\n\nmodule.exports\
    \ = router;\n```\n\n在这段代码中，我们定义了一个处理创建评论的路由。我们从请求体中提取 `content` 和 `postId` 并验证这两个字段是否都已提供。如果没有提供，我们将返回一个带有错误信息的\
    \ 400 状态码。\n\n我们使用提取的数据创建 `Comment` 模型的一个新实例，并使用 `save` 方法将其保存到数据库。如果保存操作成功，我们将返回一个带有成功消息的\
    \ 201 状态码。否则，我们将返回一个带有错误信息的 500 状态码。\n\n## 7.3 获取特定文章的评论\n\n为了获取特定博客文章的所有评论，我们将添加一个以\
    \ post ID 为参数的路由。在 `routes/comments.js` 文件中，添加以下代码：\n\n```javascript\n// 根据 post\
    \ ID 获取评论的路由\nrouter.get('/post/:postId', (req, res) => {\nconst postId = req.params.postId;\n\
    // 通过 post ID 查找评论\nComment.find({ postId })\n.then((comments) => {\n  res.status(200).json(comments);\n\
    })\n.catch((error) => {\n  res.status(500).json({ error: 'An error occurred while\
    \ retrieving comments' });\n});\n});\n\nmodule.exports = router;\n```\n\n在这段代码中，我们定义了一个接受\
    \ `postId` 作为参数的路由。我们使用 `Comment` 模型的 `find` 方法检索与指定 post ID 关联的所有评论。如果检索成功，我们将返回带有评论数组的\
    \ 200 状态码。如果有错误，我们将返回一个带有错误信息的 500 状态码。\n\n## 7.4 在前端显示评论\n\n为了在前端的博客文章页面显示评论，请更新您的博客文章模板（例如\
    \ `views/post.ejs`）以包含以下代码：\n\n```html\n<!-- 此处为您现有的博客文章内容 -->\n<!-- 评论部分 -->\n\
    <h2>评论</h2>\n<div id=\"comments-container\">\n<% comments.forEach((comment) =>\
    \ { %>\n<div class=\"comment\">\n<p><%= comment.content %></p>\n<p>Posted on <%=\
    \ comment.createdAt.toDateString() %></p>\n</div>\n<% }) %>\n</div>\n<!-- 评论表单\
    \ -->\n<form id=\"comment-form\" action=\"/comments/create\" method=\"POST\">\n\
    <input type=\"hidden\" name=\"postId\" value=\"<%= post._id %>\">\n<textarea name=\"\
    content\" placeholder=\"Enter your comment\"></textarea>\n<button type=\"submit\"\
    >Submit</button>\n</form>\n```\n\n在这段代码中，我们遍历了从服务器传递的 `comments` 数组，并显示每条评论的内容和创建日期。我们还提供了一个评论表单，其中包含一个用于\
    \ post ID 的隐藏字段和一个用于输入评论内容的文本区域。\n\n## 7.5 增强用户体验\n\n为了提高用户体验，我们可以添加一些 JavaScript\
    \ 功能，允许通过 AJAX 提交评论并动态更新评论部分。将以下代码添加到您的 JavaScript 文件中（例如 `public/js/main.js`）：\n\
    \n```javascript\nconst commentForm = document.getElementById('comment-form');\n\
    const commentsContainer = document.getElementById('comments-container');\ncommentForm.addEventListener('submit',\
    \ (event) => {\n  event.preventDefault();\n  const formData = new FormData(commentForm);\n\
    \  const content = formData.get('content');\n  const postId = formData.get('postId');\n\
    \  const comment = { content, postId };\n  fetch('/comments/create', {\n    method:\
    \ 'POST',\n    headers: {\n      'Content-Type': 'application/json',\n    },\n\
    \    body: JSON.stringify(comment),\n  })\n  .then((response) => response.json())\n\
    \  .then(() => {\n    // 重置表单\n    commentForm.reset();\n    // 获取并更新评论\n    fetch(`/comments/post/${postId}`)\n\
    \      .then((response) => response.json())\n      .then((comments) => {\n   \
    \     updateComments(comments);\n      })\n      .catch((error) => {\n       \
    \ console.error('An error occurred while retrieving comments:', error);\n    \
    \  });\n  })\n  .catch((error) => {\n    console.error('An error occurred while\
    \ submitting the comment:', error);\n  });\n});\n\nfunction updateComments(comments)\
    \ {\n  commentsContainer.innerHTML = '';\n  comments.forEach((comment) => {\n\
    \    const commentElement = document.createElement('div');\n    commentElement.classList.add('comment');\n\
    \    const contentElement = document.createElement('p');\n    contentElement.textContent\
    \ = comment.content;\n    const dateElement = document.createElement('p');\n \
    \   dateElement.textContent = `Posted on ${new Date(comment.createdAt).toDateString()}`;\n\
    \    commentElement.appendChild(contentElement);\n    commentElement.appendChild(dateElement);\n\
    \    commentsContainer.appendChild(commentElement);\n  });\n}\n```\n\n## 7.6 总结\n\
    \n恭喜！在本章中，我们成功地为博客应用程序实现了评论功能。用户现在可以对博客文章发表评论，并且评论存储在数据库中。我们还通过动态更新评论部分而无需刷新页面，增强了用户体验。\n\
    \n# 第 8 章：在我们的博客应用程序中实现搜索\n\n在本章中，我们将通过添加搜索功能来增强博客应用程序，允许用户根据关键词搜索特定的博客文章。实现搜索将提高用户体验，并让用户更容易相关内容。让我们开始吧！\n\
    \n## 8.1 设置搜索索引\n\n为了启用搜索功能，我们将使用强大的搜索引擎 Elasticsearch。请按照以下步骤在应用程序中设置 Elasticsearch：\n\
    \n"
- fmt: '

    ### 8.1.1 Install Elasticsearch


    First, you''ll need to install Elasticsearch on your system. Visit the official
    Elasticsearch website (https://www.elastic.co/downloads/elasticsearch) and download
    the appropriate version for your operating system. Follow the installation instructions
    provided by Elasticsearch to complete the installation process.


    ### 8.1.2 Create Elasticsearch Index


    Once Elasticsearch is installed, you need to create an index to store your blog
    posts. An index is similar to a database table and is used to organize and store
    your data. In your terminal, run the following command to create an index named
    "blog_posts":


    ```shell

    curl -XPUT http://localhost:9200/blog_posts

    ```


    ### 8.1.3 Install Elasticsearch Client Library


    To interact with Elasticsearch from our Node.js application, we''ll use the official
    Elasticsearch JavaScript client library called "elasticsearch". Install it by
    running the following command in your project directory:


    ```shell

    npm install elasticsearch

    ```


    With Elasticsearch set up and the client library installed, we can proceed to
    implement the search functionality.


    ## 8.2 Implementing Search Route


    Let''s start by creating a new route to handle search requests. In the `routes/search.js`
    file, add the following code:


    ```javascript

    const express = require(''express'');


    const router = express.Router();


    const { Client } = require(''elasticsearch'');


    // Create Elasticsearch client


    const client = new Client({ node: ''http://localhost:9200'' });


    // Search route

    router.get(''/'', (req, res) => {


    const { query } = req.query;


    // Perform search query

    client

    .search({

    index: ''blog_posts'',

    body: {

    query: {

    match: {

    content: query,

    },

    },

    },

    })

    .then((response) => {


    const hits = response.body.hits.hits.map((hit) => hit._source);

    res.status(200).json(hits);

    })

    .catch((error) => {

    res.status(500).json({ error: ''An error occurred while performing the search''
    });

    });


    });


    module.exports = router;

    ```


    In this code, we create a new route that handles `GET` requests to the `/search`
    endpoint. We extract the search query from the request query parameters.


    Using the `Elastic` client, we perform a search query on the "blog_posts" index.
    We use a `match` query to search for the provided query in the "content" field
    of the blog posts. The search results are returned as `hits`, and we map them
    to extract the source (the blog post data).


    If the search is successful, we return a `200` status code with the `hits` as
    JSON. If there''s an error, we return a `500` status code with an error message.


    ## 8.3 Updating Blog Post Creation Route


    To keep the search index up to date, we need to update the route that creates
    new blog posts. In the `routes/posts.js` file, update the create route as follows:


    ```javascript

    const express = require(''express'');


    const router = express.Router();


    const Post = require(''../models/post'');


    const { Client } = require(''elasticsearch'');


    // Create Elasticsearch client


    const client

    = new Client({ node: ''http://localhost:9200'' });


    // Create post route

    router.post(''/create'', (req, res) => {


    const { title, content } = req.body;


    // Validate input fields

    if (!title || !content) {

    return res.status(400).json({ error: ''Please provide a title and content for
    the post'' });

    }


    // Create a new post

    const newPost = new Post({ title, content });


    // Save the post to the database

    newPost.save()

    .then(() => {


    // Index the new post in Elasticsearch

    client.index({

    index: ''blog_posts'',

    body: {

    title,

    content,

    },

    });

    res.status(201).json({ message: ''Post created successfully'' });

    })

    .catch((error) => {

    res.status(500).json({ error: ''An error occurred while creating the post'' });

    });


    });


    module.exports = router;

    ```


    In this code, after saving the new post to the database, we index the post in
    Elasticsearch using the client''s `index()` method. We specify the index as "blog_posts"
    and provide the post''s title and content as the body of the index request.


    This ensures that the newly created post is added to the search index, allowing
    it to be searchable.


    ## 8.4 Adding Search Form to Frontend


    To allow users to perform searches, we''ll add a search form to the frontend.
    Update your blog''s homepage template (e.g., `views/home.ejs`) with the following
    code:


    ```html

    <!-- Your existing homepage content here -->

    <!-- Search form -->

    <form id="search-form" action="/search" method="GET">

    <input type="text" name="query" placeholder="Search...">

    <button type="submit">Search</button>

    </form>

    ```


    This code adds a simple search form with an input field for the search query and
    a submit button. The form''s action is set to the `/search` endpoint, which we
    defined in the backend.


    ## 8.5 Displaying Search Results


    To display the search results on a dedicated search results page, create a new
    template file called `search_results.ejs` in your views directory. Add the following
    code to the file:


    ```html

    <!-- Your existing page structure and header here -->

    <!-- Search results -->

    <h2>Search Results</h2>

    <div id="search-results-container">

    <% if (results.length === 0) { %>

    <p>No results found.</p>

    <% } else { %>

    <% results.forEach((result) => { %>

    <div class="search-result">

    <h3><%= result.title %></h3>

    <p><%= result.content %></p>

    </div>

    <% }) %>

    <% } %>

    </div>

    <!-- Your existing footer and scripts here -->

    ```


    In this code, we iterate over the `results` array passed from the server and display
    each search result''s title and content. If no results are found, we display a
    message indicating that no results were found.


    ## 8.6 Summary


    Congratulations! In this chapter, we implemented search functionality in our blogging
    application using Elasticsearch. Users can now search for specific blog posts
    based on keywords, enhancing the overall user experience.


    We set up `Elastic`, created a search route, updated the blog post creation route
    to index posts, added a search form to the frontend, and displayed the search
    results on a dedicated page.


