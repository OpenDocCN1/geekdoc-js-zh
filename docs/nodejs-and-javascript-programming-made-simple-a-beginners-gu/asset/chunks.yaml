    const router = express.Router();\nconst Comment = require('../models/comment');\n\
    \n// Create comment route\nrouter.post('/create', (req, res) => {\nconst { content,\
    \ postId } = req.body;\n// Validate input fields\nif (!content || !postId) {\n\
    \  return res.status(400).json({ error: 'Please provide comment content and associated\
    \ post ID' });\n}\n// Create a new comment\nconst newComment = new Comment({ content,\
    \ postId });\n// Save the comment to the database\nnewComment.save()\n.then(()\
    \ => {\n  res.status(201).json({ message: 'Comment created successfully' });\n\
    })\n.catch((error) => {\n  res.status(500).json({ error: 'An error occurred while\
    \ creating the comment' });\n});\n});\n\nmodule.exports = router;\n```\n\nIn this\
    \ code, we define a route to handle the creation of comments. We extract the `content`\
    \ and `postId` from the request body and validate that both fields are provided.\
    \ If not, we return a 400 status code with an error message.\n\nWe create a new\
    \ instance of the `Comment` model with the extracted data and save it to the database\
    \ using the `save` method. If the save operation is successful, we return a 201\
    \ status code with a success message. Otherwise, we return a 500 status code with\
    \ an error message.\n\n## 7.3 Retrieving Comments for a Post\n\nTo retrieve all\
    \ comments for a specific blog post, we'll add a route that takes a post ID as\
    \ a parameter. In the `routes/comments.js` file, add the following code:\n\n```javascript\n\
    // Get comments by post ID route\nrouter.get('/post/:postId', (req, res) => {\n\
    const postId = req.params.postId;\n// Find comments by post ID\nComment.find({\
    \ postId })\n.then((comments) => {\n  res.status(200).json(comments);\n})\n.catch((error)\
    \ => {\n  res.status(500).json({ error: 'An error occurred while retrieving comments'\
    \ });\n});\n});\n\nmodule.exports = router;\n```\n\nIn this code, we define a\
    \ route that accepts the `postId` as a parameter. We use the `Comment` model's\
    \ `find` method to retrieve all comments associated with the specified post ID.\
    \ If the retrieval is successful, we return a 200 status code with the array of\
    \ comments. If there's an error, we return a 500 status code with an error message.\n\
    \n## 7.4 Displaying Comments in the Frontend\n\nTo display the comments on the\
