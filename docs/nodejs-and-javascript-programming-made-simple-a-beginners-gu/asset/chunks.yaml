    # Chapter 6: Enhancing the User Interface


    In this chapter, we will enhance the user interface of our blogging application
    to provide a more engaging and user-friendly experience. We''ll introduce additional
    features and improve the design to make our application stand out. Let''s dive
    in!


    ## 6.1 Adding Styling with CSS


    To improve the visual appeal of our blogging application, let''s add some CSS
    styling. Create a new file called `style.css` in the `public` directory of your
    project. Then, link the CSS file in the `index.html` file as follows:


    ```html


    <!DOCTYPE html>


    <html>


    <head>


    <meta charset="UTF-8">


    <title>My Blogging Application</title>


    <link rel="stylesheet" href="/style.css">


    </head>


    <body>


    <!-- Your HTML code here -->


    </body>


    </html>


    ```


    In the `style.css` file, you can define custom styles to enhance the appearance
    of your application. For example, you can set the background color, font styles,
    padding, margins, and more to create a visually appealing layout.


    ## 6.2 Implementing User Authentication


    To add an extra layer of security and enable personalized features, let''s implement
    user authentication in our blogging application. We''ll use the popular `passport`
    library for authentication. Follow these steps to get started:


    ### 6.2.1 Install Required Packages


    Install the necessary packages by running the following command in your project
    directory:


    ```


    npm install passport passport-local express-session bcrypt


    ```


    ### 6.2.2 Configuring Passport


    In the `app.js` file, add the following code to configure Passport:


    ```javascript


    const passport = require(''passport'');


    const LocalStrategy = require(''passport-local'').Strategy;


    // Configure Passport


    app.use(passport.initialize());


    app.use(passport.session());


    // Configure the LocalStrategy for username/password authentication


    passport.use(new LocalStrategy(


    (username, password, done) => {


    // Logic to authenticate the user


    }


    ));


    // Serialize and deserialize user objects


    passport.serializeUser((user, done) => {


    done(null, user.id);


    });


    passport.deserializeUser((id, done) => {


    // Logic to retrieve user object by ID


    });


    ```


    In this code, we import `passport` and the `LocalStrategy` from the required packages.
    We then configure Passport by initializing and using it in our application.


    We also define the `LocalStrategy` for username/password authentication. Inside
    the strategy callback function, you can implement the logic to authenticate the
    user by checking their credentials against a database or any other authentication
    mechanism.


    Lastly, we serialize and deserialize user objects to maintain user sessions. You
    need to provide the logic to retrieve user objects by ID and store the user''s
    ID in the session.


    ### 6.2.3 Protecting Routes


    To protect certain routes and allow only authenticated users to access them, add
    the following middleware to the routes that require authentication:


    ```javascript


    const ensureAuthenticated = (req, res, next) => {


    if (req.isAuthenticated()) {


    return next();


    }


    res.redirect(''/login'');


    };


    // Example usage: Protect the create route


    router.post(''/create'', ensureAuthenticated, (req, res) => {


    // Logic to create a new blog post


    });


    ```


    In this code, we define a middleware function called `ensureAuthenticated` that
    checks if the user is authenticated using the `isAuthenticated` method provided
    by Passport. If the user is authenticated, we call `next()` to allow them to access
    the route. If not, we redirect them to the login page.


    You can use this `ensureAuthenticated` middleware in any route that requires authentication
    by simply adding it as a parameter before the


    route handler.


    ## 6.3 Adding Pagination to Blog Posts


    As our blogging application grows, it''s essential to add pagination to handle
    a large number of blog posts efficiently. Let''s implement pagination using the
    `mongoose-paginate-v2` package. Follow these steps:


    ### 6.3.1 Install the Package


    Run the following command in your project directory to install the `mongoose-paginate-v2`
    package:


    ```


    npm install mongoose-paginate-v2


    ```


    ### 6.3.2 Implement Pagination


    In the model file where you defined the `Post` schema, add the following code
    to enable pagination:


    ```javascript


    const mongoose = require(''mongoose'');


    const mongoosePaginate = require(''mongoose-paginate-v2'');


    const postSchema = new mongoose.Schema({


    // Your schema definition here


    });


    // Add the paginate plugin to the schema


    postSchema.plugin(mongoosePaginate);


    const Post = mongoose.model(''Post'', postSchema);


    ```


    By adding the `mongoosePaginate` plugin to the schema, you enable pagination for
    the `Post` model.


    ### 6.3.3 Implement Pagination Logic


    In the route where you retrieve blog posts, update the code as follows to implement
    pagination:


    ```javascript


    router.get(''/posts'', (req, res) => {


    const page = parseInt(req.query.page) || 1;


    const perPage = 10; // Number of posts per page


    Post.paginate({}, { page, limit: perPage })


    .then((result) => {


    res.status(200).json(result);


    })


    .catch((error) => {


    res.status(500).json({ error: ''An error occurred while retrieving blog posts''
    });


    });


    });


    ```


    In this code, we retrieve the `page` parameter from the query string (e.g., `?page=2`)
    and set a default value of 1 if no page is specified. We also define the `perPage`
    variable to specify the number of posts to display per page.


    Using the `paginate` method provided by the `mongoose-paginate-v2` plugin, we
    pass an empty object to retrieve all blog posts. We also provide the `page` and
    `limit` options to specify the current page number and the number of posts per
    page, respectively.


    The paginated result will be returned with information about the current page,
    total pages, and the array of blog posts.


    ## 6.4 Summary


    In this chapter, we focused on enhancing the user interface of our blogging application.
    We added CSS styling to improve the visual appeal, implemented user authentication
    using Passport for added security, and introduced pagination to handle a large
    number of blog posts efficiently.'
