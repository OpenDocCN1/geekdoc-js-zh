    \ Web 开发中，事件是浏览器中发生的动作或情况。这些事件可以由用户交互触发，例如点击按钮、悬停在元素上或提交表单。JavaScript 提供了一种强大的机制来捕获和处理这些事件。\n\
    \n# 7.2 事件处理器\n\n事件处理器是在特定事件响应执行的函数。我们可以将事件处理器附加到 HTML 元素上，以定义事件发生时应该发生什么。这是一个示例：\n\
    \n```javascript\nvar button = document.getElementById(\"myButton\");\n\nbutton.onclick\
    \ = function() {\n  alert(\"Button clicked!\");\n};\n```\n\n在这个示例中，我们使用 `document.getElementById()`\
    \ 选择了 id 为 \"myButton\" 的 HTML 按钮元素。然后我们将一个匿名函数赋值给按钮的 `onclick` 事件处理器。当按钮被点击时，该函数会被执行，并显示“Button\
    \ clicked!”的警告消息。\n\n# 7.3 事件监听器\n\n除了事件处理器，我们还可以使用事件监听器来处理事件。事件监听器提供了一种更灵活的方式来为元素附加多个事件处理器。这是一个示例：\n\
    \n```javascript\nvar button = document.getElementById(\"myButton\");\n\nbutton.addEventListener(\"\
    click\", function() {\n  alert(\"Button clicked!\");\n});\n```\n\n在这个示例中，我们使用\
    \ `addEventListener()` 方法为按钮元素附加了一个 \"click\" 事件监听器。该监听器被定义为一个匿名函数，当按钮被点击时会显示\
    \ alert 消息。\n\n# 7.4 事件对象\n\n当事件发生时，JavaScript 会创建一个包含该事件信息的事件对象。可以在事件处理器或监听器函数内部访问此对象，以便根据事件详情执行特定的操作。这是一个示例：\n\
    \n```javascript\nvar button = document.getElementById(\"myButton\");\n\nbutton.addEventListener(\"\
    click\", function(event) {\n  console.log(\"Button clicked at coordinates:\",\
    \ event.clientX, event.clientY);\n});\n```\n\n在这个示例中，我们访问事件对象的 `clientX` 和 `clientY`\
    \ 属性，以记录在按钮上点击鼠标的坐标。\n\n# 7.5 事件传播\n\n事件传播是指在嵌套元素上发生事件时，处理事件的顺序。有两种类型的事件传播：冒泡和捕获。\n\
    \n在冒泡阶段，事件首先由最内层的元素处理，然后沿着 DOM 树向上传播到它的父元素。这是大多数事件的默认行为。\n\n在捕获阶段，事件首先由最外层的祖先元素处理，然后沿着\
    \ DOM 树向下传播到最内层的元素。\n\n# 7.6 事件委托\n\n事件委托是一种技术，我们在父元素上附加单个事件处理器，并处理来自其子元素的事件。这在动态添加或删除子元素时非常有用，因为我们不需要为每个元素单独附加事件处理器。事件从子元素传播到父元素，我们可以使用事件委托来识别事件的具体目标。\n\
