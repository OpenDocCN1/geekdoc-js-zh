    ## 11.1 Comment Model


    To support comments, we need to create a Comment model. Open the `models/comment.js`
    file and add the following code:


    ```javascript

    const mongoose = require(''mongoose'');


    const commentSchema = new mongoose.Schema({

    postId: { type: mongoose.Schema.Types.ObjectId, ref: ''Post'', required: true
    },

    content: { type: String, required: true },

    author: { type: mongoose.Schema.Types.ObjectId, ref: ''User'', required: true
    },

    createdAt: { type: Date, default: Date.now },

    });


    const Comment = mongoose.model(''Comment'', commentSchema);


    module.exports = Comment;

    ```


    In this code, we define the structure of a comment using Mongoose''s Schema. A
    comment belongs to a specific post (`postId`) and is associated with an author
    (`author`). The `content` field holds the actual comment text, and `createdAt`
    stores the timestamp of when the comment was created.


    ## 11.2 Comment Routes


    Now, let''s create the routes for handling comments in the `routes/comments.js`
    file:


    ```javascript

    const express = require(''express'');


    const router = express.Router();


    const Comment = require(''../models/comment'');


    const Post = require(''../models/post'');


    const authenticate = require(''../middleware/auth'');


    // Create comment route (protected)

    router.post(''/create'', authenticate, async (req, res) => {

    try {

    const { postId, content } = req.body;

    const post = await Post.findById(postId);

    if (!post) {

    return res.status(404).json({ error: ''Post not found'' });

    }

    const comment = new Comment({

    postId,

    content,

    author: req.user,

    });

    await comment.save();

    res.status(201).json({ message: ''Comment created successfully'' });

    } catch (error) {

    res.status(500).json({ error: ''An error occurred while creating the comment''
    });

    }

    });


    // Get comments for a post route

    router.get(''/post/:postId'', async (req, res) => {

    try {

    const postId = req.params.postId;

    const comments = await Comment.find({ postId }).populate(''author'', ''username'');

    res.status(200).json(comments);

    } catch (error) {

    res.status(500).json({ error: ''An error occurred while fetching the comments''
    });

    }

    });


    module.exports = router;

    ```


    In the code above, we define two routes. The first route (`/create`) handles the
    creation of a new comment. It requires authentication (`authenticate` middleware)
    to ensure only logged-in users can leave comments. We extract the `postId` and
    `content` from the request body. Then, we check if the associated post exists.
    If the post is found, we create a new comment instance, set the appropriate values,
    and save it to the database.


    The second route (`/post/:postId`) fetches all the comments associated with a
    specific post. We extract the `postId` from the request parameters and use it
    to find the comments. The `populate()` method is used to replace the `author`
    ID with the actual `username` of the comment author.


