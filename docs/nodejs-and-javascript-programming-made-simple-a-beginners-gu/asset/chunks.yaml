    \ as a blueprint defining the properties and behaviors of objects belonging to\
    \ that class.\n\nThe key principles of object-oriented programming are:\n\n- Encapsulation:\
    \ Encapsulation allows us to encapsulate related data (properties) and functionality\
    \ (methods) within an object, preventing direct access from outside and providing\
    \ controlled access through defined interfaces.\n- Inheritance: Inheritance enables\
    \ objects to inherit properties and methods from other objects. It promotes code\
    \ reuse and hierarchical relationships between classes.\n- Polymorphism: Polymorphism\
    \ allows objects of different classes to be treated as objects of a common superclass.\
    \ It enables flexible and interchangeable usage of objects based on their shared\
    \ behaviors.\n\n# 11.2 Creating Objects in JavaScript\n\nIn JavaScript, objects\
    \ can be created using object literals or constructor functions.\n\nObject literals\
    \ are a convenient way to create objects by defining their properties and methods\
    \ directly. Here's an example:\n\n```javascript\nconst person = {\n  name: 'John',\n\
    \  age: 30,\n  greet() {\n    console.log(`Hello, my name is ${this.name} and\
