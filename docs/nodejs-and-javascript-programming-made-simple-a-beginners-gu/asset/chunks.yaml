    },\n});\n\nconst Comment = mongoose.model('Comment', commentSchema);\n\nmodule.exports\
    \ = Comment;\n```\n\nIn this code, we define the `Comment` schema with the `content`\
    \ field to store the comment content, the `postId` field to establish a relationship\
    \ with the corresponding blog post, and the `createdAt` field to store the creation\
    \ date of the comment. We export the `Comment` model for use in other parts of\
    \ our application.\n\n## 7.2 Adding Comment Creation Route\n\nNext, let's add\
