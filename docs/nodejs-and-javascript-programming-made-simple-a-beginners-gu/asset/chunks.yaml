    ### 13.1.1 为 Post 模型添加索引\n\n让我们从为 `models/post.js` 文件中的 `Post` 模型添加索引开始：\n\n```javascript\n\
    const mongoose = require('mongoose');\n\nconst postSchema = new mongoose.Schema({\n\
