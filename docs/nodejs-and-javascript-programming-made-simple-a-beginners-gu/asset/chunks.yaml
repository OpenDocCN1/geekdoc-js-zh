    \n## 3.1 Node.js 模块简介\n\nNode.js 模块允许你将代码组织并封装为可重用的单元。每个模块可以包含函数、变量或对象，这些可以被应用程序的部分访问。通过将代码拆分为模块，你可以实现更好的代码组织、重用性和可维护性。\n\
    \n### 3.1.1 创建模块\n\n在 Node.js 中创建模块，你可以在单独的文件定义代码并使用 `module.exports` 导出它们。让我们来看示例：\n\
