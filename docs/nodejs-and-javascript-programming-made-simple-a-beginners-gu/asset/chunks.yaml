    \    const contentElement = document.createElement('p');\n    contentElement.textContent\
    \ = comment.content;\n    const dateElement = document.createElement('p');\n \
    \   dateElement.textContent = `Posted on ${new Date(comment.createdAt).toDateString()}`;\n\
    \    commentElement.appendChild(contentElement);\n    commentElement.appendChild(dateElement);\n\
    \    commentsContainer.appendChild(commentElement);\n  });\n}\n```\n\nIn this\
    \ code, we add an event listener to the comment form's submit event. When the\
    \ form is submitted, we prevent the default form submission behavior and extract\
    \ the comment content and post ID.\n\nWe then send a POST request to the `/comments/create`\
    \ endpoint with the comment data as JSON. If the request is successful, we clear\
