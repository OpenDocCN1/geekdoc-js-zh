    注释用于在代码中添加解释性说明。JavaScript 引擎会忽略注释，其目的是为开发者提供上下文并使代码更具读性。JavaScript 中有两种类型的注释：


    - 单行注释：用两个正斜杠（`//`）表示。`//` 后任何内容都被视为注释，且不会被浏览器执行。


    ```javascript

    // 这是一个单行注释

    ```


    - 多行注释：包含在 `/*` 和 `*/` 之间。多行注释可以跨多行，适用于提供较长的解释或注释掉部分代码。


    ```javascript

    /*

    这是一个多行注释。

    它可以跨越多行。

    */

    ```


    # 2.2 JavaScript 运算符


    JavaScript 中的运算符是用于对操作数（值或变量）执行操作的符号。它们允许我们进行数学计算、比较值、赋值值等。让我们探索一下 JavaScript
    中一些常用的运算符。


    ## 2.2.1 算术运算符


    算术运算符用于执行数学计算。JavaScript 包含以下算术运算符：


    - 加法 (`+`)：相两个数字或拼接两个字符串。

    - 减法 (`-`)：从一个数字中减去另一个数字。

    - 乘法 (`*`)：两个数字相乘。

    - 除法 (`/`)：将一个数字除以另一个数字。

    - 取模 (`%`)：返回除法后的余数。

    - 递增 (`++`)：将值加 1。

    - 递减 (`--`)：将值减 1。这里这里有一个演示算术运算符使用的示例：


    ```javascript

    var x = 5;

    var y = 2;

    var sum = x + y;      // 7

    var difference = x - y; // 3

    var product = x * y;    // 10

    var quotient = x / y;   // 2.5

    var remainder = x % y;  // 1

    x++; // x 现在是 6

    y--; // y 现在是 1

    ```


    ## 2.2.2 赋值运算符


    赋值运算符用于给变量赋值。它们将赋值运算符 (`=`) 与其他算术或逻辑运算符结合。最常见的赋值运算符有：


    - `=`：给变量赋值。

    - `+=`：将变量的当前值加上一个值，并将结果赋值。

    - `-=`：从变量的当前值中减去一个值，并将结果赋值。

    - `*=`：将变量的当前值乘以一个值，并将结果赋值。

    - `/=`：将变量的当前值除以一个值，并将结果赋值。


    这里有一个说明赋值运算符使用的示例：


    ```javascript

    var x = 5;

    var y = 2;

    x += y; // 等于 x = x + y; (x 现在是 7)

    y -= 1; // 等于 y = y - 1; (y 现在是 1)

    ```


    ## 2.2.3 比较运算符


    比较运算符用于比较值并返回布尔结果（true 或 false）。它们通常用于用于条件语句和循环中。以下是 JavaScript 中的一些比较运算符：


    - `==`：检查两个值是否相等。

    - `!=`：检查两个值是否不等。

    - `>`：检查左侧的值是否大于右侧的值。

    - `<`：检查左侧的值是否小于右侧的值。

    - `>=`：检查左侧的值是否大于或等于右侧的值。

    - `<=`：检查左侧的值是否小于或等于右侧的值。

    - `===`：检查两个值是否严格相等（同时检查值和类型）。


    这里有一个演示比较运算符使用的示例：


    ```javascript

    var x = 5;

    var y = 2;

    console.log(x == y);    // false

    console.log(x > y);      // true

    console.log(x <= 5);    // true

    console.log(x === "5"); // false

    ```


    # 2.3 JavaScript 表达式


    表达式是值、变量和运算符的组合，用于产生结果。它们可以是简单的单个值，也可以是复杂的多个运算符和变量的组合。理解表达式对于编写动态交互的 JavaScript
    代码至关重要。


    ## 2.3.1 算术表达式


    算术表达式涉及使用算术运算符进行数学计算。这是一个算术表达式的示例：


    ```javascript

    var x = 5;

    var y = 2;

    var result = (x + y) * 3;

    console.log(result); // 21

    ```


    在这个示例中，表达式 `(x + y) * 3` 执行加法和乘法以产生结果 21。


    ## 2.3.2 字符串拼接


    在 JavaScript 中，`+` 运算符也用于字符串拼接。它允许你将两个或多个字符串合并为一个字符串。这是一个示例：


    ```javascript

    var firstName = "John";

    var lastName = "Doe";

    var fullName = firstName + " " + lastName;

    console.log(fullName); // "John Doe"

    ```


    在这种情况下，`+` 运算符拼接了 `firstName` 的值、一个空格字符和 `lastName` 以形成全名。


    ## 2.3.3 逻辑表达式


    逻辑表达式涉及使用逻辑运算符（`&&`, `||`, `!`）执行逻辑操作。它们通常用于条件语句以评估多个条件。这是一个示例：


    ```javascript

    var x = 5;

    var y = 10;

    var result = (x > 3) && (y < 15);

    console.log(result); // true

    ```


    在这个示例中，逻辑表达式 `(x > 3) && (y < 15)` 评估两个条件是否为真并返回 `true`。


    # 2.4 总结


    在本章中，我们深入探讨了 JavaScript 语法、运算符和表达式。我们学习了语句、分号和注释，这些有助于结构化和记录代码。我们探索了各种类型的运算符，包括算术、赋值和比较运算符，以及它们如何在
    JavaScript 代码中使用。最后，我们研究了表达式以及它们如何用于执行数学计算、拼接字符串和评估逻辑条件。


    理解 JavaScript 语法、运算符和表达式对于编写有效且意义的代码至关重要。有了这些基础概念，你将能够应对更复杂的编程任务并构建交互应用程序。


    在下一章中，我们将探索 JavaScript 控制流语句，例如条件语句和循环。这些控制流语句使我们能够做出并重复操作。

