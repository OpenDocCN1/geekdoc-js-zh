    # 2.1 JavaScript 语法


    语法指的是在编程语言中编写代码的规则集。正确的语法确保代码结构正确，并且可以被人类和机器理解。让我们探索 JavaScript 语法的一些基本方面。


    ## 2.1.1 语句和分号


    在 JavaScript 中，语句是代码的构建块。语句是执行特定操作的指令。JavaScript 中的每个语句都以分号（`;`）结束，表示语句的完成。虽然分号在
    JavaScript 中并非强制，但一致使用它们被认为是一种良好的习惯，以避免潜在问题。


    例如，以下语句为变量赋值：


    ```javascript

    var name = "John";

    var age = 25;

    ```


