    \n# 8.1 AJAX 简介\n\nAJAX 是一种允许 Web 应用程序在后台异步发送和接收数据的技术。通过 AJAX，我们可以在不需要完全刷新网页的情况下更新网页的一部分，从而获得更流畅、响应迅速的用户体验。AJAX\
    \ 允许我们使用 JavaScript 与服务器交互并检索数据。\n\n# 8.2 XMLHttpRequest 对象\n\nXMLHttpRequest\
