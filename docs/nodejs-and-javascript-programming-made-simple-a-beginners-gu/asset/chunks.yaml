    \ 属性。\n\n## 6.6 对象方法\n\n除了属性，JavaScript 对象还可以包含方法。方法是与对象关联的函数，可以使用点表示法调用。\n\n\
    JavaScript 中的方法是与对象关联的函数，可以使用对象的属性执行操作或计算。让我们来看一个示例：\n\n```javascript\nvar calculator\
