    \ day\"。\n\n### 3.2 循环语句\n\n循环语句允许我们多次执行某块代码。当我们想要重复执行某任务或遍历数据集合时，这些语句非常有用。JavaScript\
    \ 提供了几种循环语句，包括 `for` 循环、`while` 循环和 `do...while` 循环。\n\n### 3.2.1 for 循环\n\n当我们提前知道迭代次数时，通常使用\
    \ `for` 循环。它由三部分组成：初始化、条件和更新。以下是其语法：\n\n```javascript\nfor (initialization; condition;\
    \ update) {\n// 每次迭代中执行的代码\n}\n```\n\n让我们来看一个 `for` 循环的示例：\n\n```javascript\n\
    for (var i = 1; i <= 5; i++) {\n  console.log(i);\n}\n```\n\n在这个示例中，循环将迭代五次，并显示数字\
    \ 1 到 5。\n\n### 3.2.2 while 循环\n\n当我们提前不知道具体的迭代次数时，使用 `while` 循环。只要指定的条件为真，它就会继续执行某块代码。以下是其语法：\n\
    \n```javascript\nwhile (condition) {\n// 每次迭代中执行的代码\n}\n```\n\n让我们来看一个 `while`\
    \ 循环的示例：\n\n```javascript\nvar i = 1;\n\nwhile (i <= 5) {\n  console.log(i);\n\
    \  i++;\n}\n```\n\n在这个示例中，循环将迭代五次，与之前的 `for` 循环示例类似。\n\n### 3.2.3 do...while 循环\n\
    \n`do...while` 循环类似于 `while` 循环，但它保证在检查条件之前至少执行一次代码块代码。以下是其语法：\n\n```javascript\n\
    do {\n// 每次迭代中执行的代码\n} while (condition);\n```\n\n让我们来看一个 `do...while` 循环的示例：\n\
    \n```javascript\nvar i = 1;\n\ndo {\n  console.log(i);\n  i++;\n} while (i <=\
    \ 5);\n```\n\n在这个示例中，循环将迭代五次，与之前的示例相同。\n\n### 3.3 总结\n\n在本章中，我们探索了 JavaScript\
    \ 控制流语句，包括条件语句和循环语句。我们学习了如何使用 `if` 和 `switch` 语句进行决策，以及如何使用 `for`、`while` 和 `do...while`\
    \ 循环来重复代码。理解控制流对于创建动态且交互式的 JavaScript 程序至关重要。\n\n在下一章中，我们将深入 JavaScript 函数，函数允许我们将代码组织成可重用的块并执行特定任务。准备好学习如何编写高效且模块化的\
    \ JavaScript 代码吧！\n\n# 第 4 章：JavaScript 函数\n\n在第 3 章中，我们探索了 JavaScript 中的控制流语句，这允许我们做出决策并重复代码块。现在，让我们深入\
    \ JavaScript 函数，它是构建模块化和可重用代码的重要部分。\n\n### 4.1 函数简介\n\nJavaScript 中的函数是一个执行特定任务或计算值的代码块。函数允许我们将代码组织成逻辑化且可重用的单元。它们有助于提高代码的可读性，促进代码的重用性，并使我们的程序更于管理。\n\
    \n### 4.2 函数声明\n\n在 JavaScript 中，我们可以使用 `function` 关键字声明函数，后面紧跟函数名、参数列表（可选）以及用大括号括起来的代码块。以下是函数声明的基本语法：\n\
    \n```javascript\nfunction functionName(parameter1, parameter2, ...) {\n// 要执行的代码\n\
    }\n```\n\n让我们定义一个计算数字平方的简单函数：\n\n```javascript\nfunction square(number) {\n  var\
    \ result = number * number;\n  return result;\n}\n```\n\n在这个示例中，我们定义了一个 `square`\
    \ 函数，它接收一个参数 `number`。在函数内部，通过将其乘以自身来计算 `number` 的平方。\n\n### 4.3 函数调用\n\n要执行函数并获取所需的结果，我们需要调用函数，即使用其函数名并加上括号\
    \ `()`。这里是调用 `square` 函数的示例：\n\n```javascript\nvar number = 5;\nvar squaredNumber\
    \ = square(number);\nconsole.log(squaredNumber); // 输出: 25\n```\n\n在这个示例中，我们将值\
    \ 5 赋值给变量 `number`。\n\n### 4.4 函数参数和参数\n\n函数可以接受参数，参数是在调用时传递给函数的占位符。参数允许函数变得灵活并处理不同的值。当我们调用函数时，传入参数，这些是替换函数参数的实际值。让我们修改\
    \ `square` 函数以利用参数：\n\n```javascript\nfunction square(number) {\n  var result\
    \ = number * number;\n  return result;\n}\n\nvar number = 5;\nvar squaredNumber\
    \ = square(number);\nconsole.log(squaredNumber); // 输出: 25\n```\n\n在本示例中，函数声明中的\
    \ `number` 参数是调用函数时传递的值（此处为 5）的占位符。\n\n### 4.5 return 语句\n\n函数中的 `return` 语句用于指定函数返回的值。它标记函数执行并将指定的值发送给调用者。让我们修改\
    \ `square` 函数以包含一个 `return` 语句：\n\n```javascript\nfunction square(number) {\n\
    \  return number * number;\n}\n\nvar number = 5;\nvar squaredNumber = square(number);\n\
    console.log(squaredNumber); // 输出: 25\n```\n\n在这个更新版本中，`return` 语句直接返回计算结果，而无需中间变量。\n\
    \n### 4.6 函数作用域\n\nJavaScript 中的函数有自己的作用域。在函数内部定义的变量具有局部作用域，这意味着只能在函数内部访问。相反，在任何函数之外定义的变量具有全局作用域，可以在代码的任何地方访问。让我们通过示例检查函数作用域的概念：\n\
    \n```javascript\nvar globalVariable = \"I'm a global variable\";\n\nfunction myFunction()\
    \ {\n  var localVariable = \"I'm a local variable\";\n  console.log(localVariable);\
    \ // 输出: I'm a local variable\n  console.log(globalVariable); // 输出: I'm a global\
    \ variable\n}\n\nmyFunction();\nconsole.log(localVariable); // 错误: localVariable\
    \ 未定义\n```\n\n"
