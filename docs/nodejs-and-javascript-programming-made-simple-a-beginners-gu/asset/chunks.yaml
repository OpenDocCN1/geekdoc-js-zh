    \ my name is John and I'm 30 years old.\n```\n\nConstructor functions provide\
    \ a way to create objects based on a blueprint (class) using the `new` keyword.\
    \ Here's an example:\n\n```javascript\nfunction Person(name, age) {\n  this.name\
