    \ using `Object.create()`:\n\n```javascript\nconst personPrototype = {\n  greet()\
    \ {\n    console.log(`Hello, my name is ${this.name} and I'm ${this.age} years\
    \ old.`);\n  }\n};\n\nconst person = Object.create(personPrototype);\nperson.name\
