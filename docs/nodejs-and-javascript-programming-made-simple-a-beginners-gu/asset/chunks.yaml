    body and the `postId` from the URL parameters. We validate that both fields are
    provided and return a 400 status code with an error message if they are missing.


    Next, we use the `findByIdAndUpdate` method to find the blog post by its ID and
    update its `title` and `content`. If the update is successful, we return a 200
    status code with a success message. If there''s an error, we return a 500 status
    code with an error message.


    ## 5.4 Deleting a Blog Post


    Lastly, let''s implement the logic for deleting a blog post. Update the `/delete/:id`
    route in the `routes.js` file as follows:


    ```javascript


    // Delete route


    router.delete(''/delete/:id'', (req, res) => {


    const postId = req.params.id;


    // Find the blog post by ID and delete it


    Post.findByIdAndDelete(postId)


    .then(() => {


    res.status(200).json({ message: ''Blog post deleted successfully'' });


    })


    .catch((error) => {


    res.status(500).json({ error: ''An error occurred while deleting the blog post''
    });


    });


    });


    ```


    In this code, we retrieve the `postId` from the URL parameters. Then, we use the
    `findByIdAndDelete` method to find the blog post by its ID and delete it from
    the database. If the deletion is successful, we return a 200 status code with
    a success message. If there''s an error, we return a 500 status code with an error
    message.


    ## 5.5 Summary


