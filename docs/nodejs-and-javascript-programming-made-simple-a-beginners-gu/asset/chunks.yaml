    JavaScript 代码，允许你将 HTML 和 JavaScript 代码分离，以便更好的组织性和可维护性。


    # 1.6 你的第一个 JavaScript 程序


    让我们直接进入编码阶段！在 JavaScript 中，传统的“Hello, World!”程序可以写写如下：


    ```javascript

    console.log("Hello, World!");

    ```


    在这里，我们使用 `console.log()` 函数在浏览器控制台中显示“Hello, World!”消息。控制台是开发过程中调试和打印输出的有用工具。通过使用
    `console.log()`，你可以检查变量、跟踪代码流并解决可能出现的任何问题。


