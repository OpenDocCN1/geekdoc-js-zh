  trans: "\n\n> 一个不仅使用 `JSON.parse()` 函数，还为不支持 `JSON.parse()` 的旧版浏览器提供回退方案，并通过验证字符来处理字符串求值安全漏洞的函数。\n\
    \n`jQuery.getJSON()`\n\n> 将 `jquery.ajax()` 函数与 JSON 解析为 JavaScript 对象的功能合二为一的简写形式。\n\
    \n单页 Web 应用\n\n> 打破传统多页面模式，创造更无缝应用体验的网页。\n\n模型-视图-控制器（MVC）\n\n> 一种将应用程序划分为三个组件的架构模式：模型（数据）、视图（展示）和控制器（更新模型和视图）。\n\
    \nAngularJS\n\n> 一种使用 JavaScript 对象作为数据模型的 MVC JavaScript 框架。\n\n我们还讨论了以下关键概念：\n\
    \n*   jQuery 是一个抽象工具，通过减少请求和解析数据的开发时间来*支持* JSON。此外，它还处理了浏览器版本兼容性问题。\n\n*   在 AngularJS\
    \ MVC 概念中：\n\n    *   JSON 是模型（或数据模型）。\n\n    *   HTML 是视图，并使用语法与模型进行数据绑定。\n\n\
    \    *   控制器是 Angular JavaScript 文件及用于定义和处理与模型及视图交互的语法。\n\n*   AngularJS 在其 MVC\
    \ 架构中*利用*了 JavaScript 对象和 JSON。\n\n# 第 8 章 JSON 与 NoSQL\n\n## 引言\n\n我们生活在“信息时代”，海量的数据和知识触手可及。我们可以在维基百科等网站上查询关于特定主题（如“裸鼹鼠”）的信息。关于“裸鼹鼠”的信息必须存储在某个地方，而那个地方归根结底就是数据库。\n\
    \n## 关系型数据库\n\n如果你过去使用过数据库并熟悉 SQL，那么你很可能使用的是*关系型数据库*。关系型数据库以表、列和行的形式组织数据。每个表代表某个事物，例如账户。代表账户的表可能与代表账户地址的表存在关系。每个表中的键（例如包含账户标识符的列）形成了两个表之间的关系。\n\
    \n为了创建、操作和查询这些关系型数据库，我们使用*结构化查询语言（SQL）*。使用 SQL，我可以从一个或多个数据库表中查询列和行（示例 8-1）。\n\n\
    ### 示例 8-1\n\n一个简单的 SQL 查询，将从 Account 表返回 AccountID、FirstName 和 LastName 的列和行\n\
    \n```sql\nSELECT accountId, firstName, lastName \nFROM Account\n```\n\n利用关系型数据库中表之间的关系，我还可以从多个表中查询列和行（示例\
    \ 8-2）。\n\n### 示例 8-2\n\n一个连接两个表的查询；这将返回所有账户及其相关地址的名字、姓氏、街道地址和邮政编码的列和行\n\n```sql\n\
    SELECT Account.firstName, Account.lastName, Address.street, Address.zip  \nFROM\
    \ Account \nJOIN Address \nON Account.accountId = Address.accountId\n```\n\n##\
    \ NoSQL 数据库\n\n数据库的“NoSQL”名称告诉我们它不是关系型数据库。我们不能使用 SQL 来查询连接在一起的表的列和行。这个名称并没有告诉我们*它是什么*。它只是说：“我找到了一种非关系型的替代数据存储方式。”自然，不止一种“替代方式”。\n\
    \n当今世界上的 NoSQL 数据库在本质上差异巨大，就像老虎和大象一样不同。这些类型的数据库在本质上各不相同，因为数据具有不同的大小、形状和用途。NoSQL\
    \ 数据库的创建者意识到了这一点，因此为数据的存储和检索创建了脱离传统关系型模式的家园。\n\n## 键值存储\n\nNoSQL 数据库的一个例子是*键值存储*。键值存储将简单数据建模为键值对。如果我们把英语词典做成一个数据库，它很适合键值存储。每个单词可以是一个键，每个定义可以是一个值。对于简单的数据结构，这种数据库是关系型数据库开销的绝佳替代方案。\n\
    \n## 文档存储\n\n我们将在本章探讨的 NoSQL 数据库类型是*文档存储*。这种关系型数据库的替代方案围绕文档的概念来组织数据，而不是将数据片段表示为表并进行关联。目前世界上有\
    \ 20 多种不同的文档存储数据库在使用，有些使用 XML 文档，有些使用 JSON 文档。\n\n在本章中，我们将介绍一种使用 JSON 文档存储数据的文档存储数据库。让我们来看看\
    \ CouchDB。\n\n## CouchDB\n\n由于 CouchDB 是一种 NoSQL 数据库，它采用非关系型方式使用 JSON 文档存储数据。\n\
    \n假设我需要存储客户的账户数据。使用关系型数据库，账户信息可能会迅速分散到多个表中。如果某个账户需要多个地址，则需要一个单独的地址表来支持这种一对多关系。\n\
    \n在关系型数据库中，一对多关系（例如一个账户有多个地址）必须通过连接查询才能将数据重新组合在一起。此外，如果我查询数据库中的单个账户及其所有关联的地址记录，结果将包含多行。每一行都会重复相同的账户字段，但每行的地址不同。因此，数据结构存在于数据库内部，但在查询时被扁平化为列和行。\n\
    \n使用 CouchDB，数据中的关系不需要将数据分离存储后再重新组装以供读取。关系在数据内部表达，并且随着数据进出数据库，结构得以保持。\n\n在示例 8-3\
    \ 中，账户地址的一对多关系表示为数组中的对象。\n\n### 示例 8-3\n\n表示一个账户的 JSON 文档\n\n```json\n{\n  \"\
    firstName\": \"Bob\",\n  \"lastName\": \"Barker\",\n  \"age\": 91,\n  \"addresses\"\
    : [\n    {\n      \"street\": \"123 fake st\",\n      \"city\": \"Somewhere\"\
    ,\n      \"state\": \"OR\",\n      \"zip\": 97520\n    },\n    {\n      \"street\"\
    : \"456 fakey ln\",\n      \"city\": \"Some Place\",\n      \"state\": \"CA\"\
    ,\n      \"zip\": 96026\n    }\n  ]\n}\n```\n\n使用 CouchDB 文档存储，当我向数据库请求一个账户时，我会得到一个结构化的文档作为返回。无需组装。这既方便又快速。\n\
    \n然而，文档存储并非适用于所有数据存储场景。如果需要多个关联，这种模型很快就会变得麻烦。如果我想让地址中的城市、州和邮政编码之间建立关系呢？一旦需要这些关系，关系型模型会更适合数据，因为在单个文档中表达复杂关系会很困难。\n\
    \nCouchDB 另一个擅长的方面是促进数据的演变。有些数据会随时间演变。例如，在 1990 年，我可能只需要为账户记录中的电话号码设置以下字段：\n\n\
    *   家庭电话\n*   工作电话\n*   传真\n\n如今我们已不在 1990 年，我们需要一个移动电话字段。数据需要演变。\n\n"
- fmt: "\nIn a relational database, we would need to modify the schema of the address\
    \ table to support this mobile phone field. We might also decide to get rid of\
    \ the fields on the account table and move the phone numbers to their own table.\n\
    \nWith CouchDB, our data is allowed to evolve without having to modify schema.\
    \ I could easily represent phone numbers in JSON as an array of objects ([Example\
    \ 8-4](#text00010.html_ex0804) )), and allow an account to have as many phone\
    \ records as they truly have.\n\n### Example 8-4. An array of phone number objects\n\
    \n```json\n {\n  \"phoneNumbers\": [\n    {\n      \"description\": \"home phone\"\
    ,\n      \"number\": \"555-555-5555\"\n    },\n    {\n      \"description\": \"\
    cell phone\",\n      \"number\": \"123-456-7890\"\n    },\n    {\n      \"description\"\
    : \"fax\",\n      \"number\": \"456-789-1011\"\n    }\n  ]\n}\n```\n\nIf in the\
    \ future an account gains a new number, we can just add it to the array, as shown\
    \ in [Example 8-5](#text00010.html_ex0805) .\n\n### Example 8-5. The array of\
    \ phone number objects gets a new “space phone”\n\n```json\n {\n  \"phoneNumbers\"\
    : [\n    {\n      \"description\": \"home phone\",\n      \"number\": \"555-555-5555\"\
    \n    },\n    {\n      \"description\": \"cell phone\",\n      \"number\": \"\
    123-456-7890\"\n    },\n    {\n      \"description\": \"fax\",\n      \"number\"\
    : \"456-789-1011\"\n    },\n    {\n      \"description\": \"space phone\",\n \
    \     \"number\": \"932-932-932\"\n    }\n  ]\n}\n```\n\nAdditionally, if we needed\
    \ a new field on the account record, such as “galaxy,” we would just add it to\
    \ all future records ([Example 8-6](#text00010.html_ex0806) ). No schema modification\
    \ required.\n\n### Example 8-6. The addition of a “galaxy” field to an account\
    \ record\n\n```json\n {\n  \"firstName\": \"Octavia\",\n  \"lastName\": \"Wilson\"\
    ,\n  \"age\": 26,\n  \"addresses\": [\n    {\n      \"street\": \"123 fake st\"\
    ,\n      \"city\": \"Somewhere\",\n      \"state\": \"OR\",\n      \"zip\": 97520\n\
    \    }\n  ],\n  \"galaxy\": \"Milky Way\"\n}\n```\n\nData moves in and out of\
    \ the CouchDB database as JSON documents. The question now is, how do we put data\
    \ in, and how do we get it out? Couch DB uses HTTP for an API. Let’s take a look\
    \ at the CouchDB API.\n\n# The CouchDB API\n\nWith CouchDB, the way we ask the\
    \ database for data is by requesting resources with HTTP. With HTTP, we make requests\
    \ for resources with a URL. The resource we request from CouchDB is a JSON document\
    \ (`application/json`). If I have a database named `accounts` locally, I can use\
    \ the URL `http://localhost:5984/accounts` to get information about the database.\
    \ [Example 8-7](#text00010.html_ex0807) information about the accounts is returned\
    \ in JSON format.\n\n### Example 8-7. Response from http://localhost:5984/accounts\n\
    \n```json\n {\n    \"db_name\": \"accounts\",\n    \"doc_count\": 3,\n    \"doc_del_count\"\
    : 0,\n    \"update_seq\": 7,\n    \"compact\": false,\n    \"disk_size\": 28773,\n\
    \    \"data_size\": 1248,\n    \"instance_start_time\": \"143249347758600\",\n\
    \    \"disk_version\": 6,\n    \"committed_update_seq\": 7\n}\n```\n\nNotice the\
    \ `\"doc_count\"` name-value pair. This specifies how many documents are in my\
    \ database, and I can query for each document in the database by the unique identifier\
    \ with the URL `http://localhost:5984/accounts/unique_identifier`. If I do not\
    \ know the identifiers for my documents, I can use the URL `http://localhost:5984/accounts/_all_docs`\
    \ to retrieve an array of the row. [Example 8-8](#text00010.html_ex0808) the JSON\
    \ resource at `http://localhost:5984/accounts/_all_docs` contains an array of\
    \ the identifiers for each document in my database.\n\n### Example 8-8. Array\
    \ of document\n\n```json\n {\n    \"total_rows\": 3,\n    \"offset\": 0,\n   \
    \ \"rows\": [\n        {\n            \"id\": \"3636fa3c716f9dd4f7407bd6f700052\"\
    ,\n            \"key\": \"3636fa3c716f9dd4f7407bd6f700052\",\n            \"value\"\
    : {\n                \"rev\": \"1-8a9527cbfc22e28984df3a3e603265\"\n         \
    \   }\n        },\n        {\n            \"id\": \"ddc14ef71396463f530f88001538\"\
    ,\n            \"key\": \"ddc14ef71396463f530f88001538\",\n            \"value\"\
    : {\n                \"rev\": \"1-3aef6fae7fff90dacff5d6440ceb\"\n           \
    \ }\n        },\n        {\n            \"id\": \"ddc14ef71396463f530f880019ea\"\
    ,\n            \"key\": \"ddc14ef71396463f530f880019ea\",\n            \"value\"\
    : {\n                \"rev\": \"5-c38761b81edaf9842a6357492b7d38\"\n         \
    \   }\n        }\n    ]\n}\n```\n\nIf I grab the first identifier (`3636fa3c716f9dd4f7407bd6f700052`)\
    \ from this array, I can then structure a URL to make a request for the document\
    \ [Example 8-9](#text00010.html_ex0809) ).\n\n### Example 8-9. JSON resource representing\
    \ an account at URL http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700052\n\
    \n```json\n {\n    \"_id\": \"3636fa3c716f9dd4f7407bd6f700052\",\n    \"_rev\"\
    : \"1-8a9527cbfc22e28984df3a3e603265\",\n    \"firstName\": \"Billy\",\n    \"\
    lastName\": \"Bob\",\n    \"address\": {\n        \"street\": \"123 another st\"\
    ,\n        \"city\": \"Somewhere\",\n        \"state\": \"OR\",\n        \"zip\"\
    : \"97501\"\n    },\n    \"age\": 54,\n    \"gender\": \"male\",\n    \"famous\"\
    : false\n}\n```\n\nWe’ve seen how to request data from a CouchDB database. Now\
    \ let’s take a look at how we deliver data.\n\nIf I want to add another account\
    \ document to my accounts database, I would do so by posting to the URL `http://localhost:5984/accounts/`\
    \ (see Examples [8-10](#text00010.html_ex0810) and [8-11](#text00010.html_ex0811)\
    \ ).\n\n### Example 8-10. HTTP headers for request (http://localhost:5984/accounts/)\n\
    \n```\nPOST /accounts/\nHost: localhost:5984\nContent-Type: application/json\n\
    Cache-Control: no-cache\n```\n\n### Example 8-11. http://localhost:5984/\n\n```json\n\
    \ {\n    \"firstName\": \"Janet\",\n    \"lastName\": \"Jackson\",\n    \"address\"\
    : {\n        \"street\": \"456 Fakey Fake st\",\n        \"city\": \"Somewhere\"\
    ,\n        \"state\": \"CA\",\n        \"zip\": \"96520\"\n    },\n    \"age\"\
    : 54,\n    \"gender\": \"female\",\n    \"famous\": true\n}\n```\n\n### Note\n\
    \nIf you use the Chrome browser, check out “Postman” in the Chrome Web Store.\
    \ Postman gives you a simple interface for building up HTTP requests (`GET`, `POST`,\
    \ `DELETE`, etc.).\n\nAfter the HTTP request is successful, the CouchDB API will\
    \ deliver a response in JSON format that includes the newly generated [Example\
    \ 8-12](#text00010.html_ex0812) ).\n\n### Example 8-12. The JSON response from\
    \ http://localhost:5984/\n\n```json\n {\n    \"ok\": true,\n    \"id\": \"3636fa3c716f9dd4f7407bd6f700052\"\
    ,\n    \"rev\": \"1-363f3b4bf90183781d08fe22487f3c90\"\n}\n```\n\nI may now form\
    \ a URL using the new identifier to request the JSON document [Example 8-13](#text00010.html_ex0813)\
    \ ).\n\n### Example 8-13. Resource at URL http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c\n\
    \n```json\n {\n    \"_id\": \"3636fa3c716f9dd4f7407bd6f70007c\",\n    \"_rev\"\
    : \"1-363f3b4bf90183781d08fe22487f3c90\",\n    \"firstName\": \"Janet\",\n   \
    \ \"lastName\": \"Jackson\",\n    \"address\": {\n        \"street\": \"456 Fakey\
    \ Fake st\",\n        \"city\": \"Somewhere\",\n        \"state\": \"CA\",\n \
    \       \"zip\": \"96520\"\n    },\n    \"age\": 54,\n    \"gender\": \"female\"\
    ,\n    \"famous\": true\n}\n```\n"
