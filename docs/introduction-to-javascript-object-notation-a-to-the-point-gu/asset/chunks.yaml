    \   `\\u` followed by hexadecimal characters (e.g., the smiley emoticon, `\\u263A`\
    \ )\n\nThe JSON shown in [Example 3-9](#text00005.html_ex3_9_parserError) will\
    \ produce a parser error because the tab and new line characters must be escaped.\
    \ [Example 3-10](#text00005.html_ex3_10_fix) shows how to fix the problem.\n\n\
