    \ attack*  is an attack that relies on the ability to inject malicious code into\
    \ an otherwise innocent website.\n\n## Cross-Site Scripting (XSS)\n\nCross-site\
    \ scripting (XSS) attacks are a type of injection attack.  A hole in security\
