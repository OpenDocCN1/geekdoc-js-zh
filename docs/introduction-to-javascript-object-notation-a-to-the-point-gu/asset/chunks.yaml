  trans: "\n\n# jQuery 与 JSON\n\n[jQuery](http://jquery.com/) 是一种抽象工具，它允许开发者通过满足 HTML\
    \ 文档对象模型（DOM）的操纵来专注于构建功能。这是一种用于与 HTML 页面交互的约定。在这一模型中，底层的 HTML 被视为一个对象和一组可以枚举、访问和操作的节点。\n\
    \n在 JavaScript 中，不使用 jQuery 框架也可以对 DOM 进行操作。然而，开发者例行需要对 DOM 进行 de 某些操作，这些操作需要编写几行代码。例如，对\
    \ DOM 的一种常用操作是隐藏一个 HTML 元素。假设我有一个想要隐藏的按钮（示例 7-1）。\n\n### 示例 7-1. 一个在网页浏览器中显示“My\
    \ Button”文本的 HTML 按钮\n\n```\n <button id=\"myButton\">My Button</button>\n```\n\
    \n如示例 7-2 所示，为了在 JavaScript 中实现隐藏按钮的目标，我必须在 HTML 文档对象上调用 `getElementById(id)`\
    \ 函数，然后将 `style.display` 属性设置为 `\"none\"`。\n\n### 示例 7-2. 这行 JavaScript 将隐藏 id\
    \ 为“myButton”的 HTML 按钮；它不会显示在浏览器中\n\n```\n document.getElementById(\"myButton\"\
    ).style.display = \"none\";\n```\n\njQuery 使用少于一半的代码字符实现了相同的目标（示例 7-3）。\n\n###\
    \ 示例 7-3. 这行 jQuery 将隐藏 id 为“myButton”的 HTML 按钮；它不会显示在浏览器中\n\n```\n $(\"#myButton\"\
    ).hide();\n```\n\n为了实现相同的目标而输入少于一半的字符可以节省生产时间。除了节省时间，jQuery 还处理了 Internet 浏览器的兼容性问题。例如，在第\
    \ 5 章中，我提到了 `JSON.parse()` 是比 `eval()` 解析 JSON 的更安全的替代方案。在旧版本的 Internet Explorer、Firefox\
    \ 和 Chrome 中，`JSON.parse()` 是不支持支持的。这意味着无论你使用 `JSON.parse()` 编写了什么功能，对于那些未能更新浏览器的少数用户来说，该功能将无法工作。\n\
    \njQuery 为你处理许多常见的版本兼容性问题，包括提到的 `JSON.parse()` 问题。jQuery 有一个解析 JSON 的函数：`jQuery.parseJSON`。在示例\
    \ 7-4 中，使用 JavaScript 的 `JSON.parse()` 解析 JSON。在示例 7-5 中，使用内置的 jQuery 函数解析 JSON。\n\
    \n### 示例 7-4. 使用 JSON.parse() 在 JavaScript 中解析 JSON\n\n```\n var myAnimal = JSON.parse('{\
    \ \"animal\" : \"cat\" }');\n```\n\n### 示例 7-5. 使用 jQuery 的.parseJSON 解析 JSON\n\
    \n```\n var myAnimal = jQuery.parseJSON('{ \"animal\" : \"cat\" }');\n```\n\n\
    在示例中，你可以看到 jQuery 示例似乎并没有在输入上节省任何字符。然而，`jQuery.parseJSON()` 函数所做的远比一行代码要多。如果你查看\
