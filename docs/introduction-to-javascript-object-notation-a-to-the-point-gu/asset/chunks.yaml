    \ string from the server, and client side I use the `eval()` JavaScript function\
    \ to convert the JSON string response to a JavaScript object. I use that JavaScript\
    \ object in my client-side code to display the message value directly in the HTML.\n\
    \nLet’s take a look at some less innocent JSON in [Example 5-9](#text00007.html_ex0509)\
    \ .\n\n##### Example 5-9. Not-so-innocent JSON\n\n```\n {\n    \"message\": \"\
    <div onmouseover=\\\"alert('gotcha!')\\\">hover here.</div>\"\n}\n```\n\nThe not-so-innocent\
    \ JSON in the example includes JavaScript. While this JavaScript is within the\
