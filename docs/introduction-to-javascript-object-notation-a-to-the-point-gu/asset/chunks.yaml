  trans: "\n\n## 在 INI、XML 和 JSON 中存储设置\n\n让我们来看看如何以 INI、XML 和 JSON 格式存储相同的设置信息（分别参见示例\
    \ 10-1、10-2 和 10-3）。\n\n### 示例 10-1. INI 格式 (`settings.ini`)\n\n```\n [general]\n\
    playIntro=false\nmouseSensitivity=0.54\n\n[display]\ncomplexTextures=true\nbrightness=4.2\n\
    widgetsPerFrame=326\nmode=windowed\n\n[sound]\nvolume=1\neffects=0.68\n```\n\n\
    ### 示例 10-2. XML 格式 (`settings.xml`)\n\n```\n <?xml version=\"1.0\" encoding=\"\
    UTF-8\" ?>\n<settings>\n    <general>\n        <playIntro>false</playIntro>\n\
    \        <mouseSensitivity>0.54</mouseSensitivity>\n    </general>\n    <display>\n\
    \        <complexTextures>true</complexTextures>\n        <brightness>4.2</brightness>\n\
    \        <widgetsPerFrame>326</widgetsPerFrame>\n    </display>\n    <sound>\n\
    \        <volume>1</volume>\n        <effects>0.68</effects>\n    </sound>\n</settings>\n\
    ```\n\n### 示例 10-3. JSON 格式 (`settings.json`)\n\n```\n {\n    \"general\": {\n\
    \        \"playIntro\": false,\n        \"mouseSensitivity\": 0.54\n    },\n \
    \   \"display\": {\n        \"complexTextures\": true,\n        \"brightness\"\
    : 4.2,\n        \"widgetsPerFrame\": 326,\n        \"mode\": \"windowed\"\n  \
    \  },\n    \"sound\": {\n        \"volume\": 1,\n        \"effects\": 0.68\n \
    \   }\n}\n```\n\n### 优点与缺点\n\n这三种格式都是人类可读的。如果我想更改声音设置，可以快速在每个文件中找到这些内容并修改数字。这使得它们非常适合用作配置文件。\n\
    \n每种格式都有其优缺点。INI 文件更便于人类阅读，因为它缺少了 XML 中的 `<` 和 `>` 符号，也没有 JSON 的那种大括号和双引号。INI\
    \ 在处理更复杂的数据（如嵌套信息或复杂的列表）时并不理想。XML 可以容纳更复杂的数据，但它不具备 JSON 那样的数据类型。\n\n除了每种数据格式的优缺点外，考虑所用语言/框架的解析易用性也很重要。如果你的应用程序已经大量使用\
    \ JSON 解析器，那么 JSON 可能是你配置文件的最佳选择。\n\n在 第 9 章 中，我们简要地查看了在服务器端使用 Node.js JSON。JSON\
    \ 作为配置文件的一个很好的真实示例是 Node.js 默认的 JavaScript 包管理器：`npm`。它也被 AngularJS 和 jQuery 等其他框架使用。\n\
    \n### JSON 作为配置文件\n\n`npm` 包管理器使用 JSON 作为名为 `package.json` 的配置文件。`package.json`\
    \ 文件包含特定于每个包特定信息，如名称、版本、作者、贡献者、依赖项、脚本和许可（参见 示例 10-4）。\n\n### 示例 10-4. `npm` 的示例\
    \ `package.json` 文件\n\n```\n {\n  \"name\": \"bobatron\",\n  \"version\": \"1.0.0\"\
    ,\n  \"description\": \"The extraordinary library of Bob.\",\n  \"main\": \"bob.js\"\
    ,\n  \"scripts\": {\n    \"prepublish\": \"coffee -o lib/ -c src/bob.coffee\"\n\
    \  },\n  \"repository\": {\n    \"type\": \"git\",\n    \"url\": \"git://github.com/bobatron/bob.git\"\
    \n  },\n  \"keywords\": [\n    \"bob\",\n    \"tron\"\n  ],\n  \"author\": \"\
    Bob Barker <bob.barker@fakemail.com> (http://bob.com/)\",\n  \"license\": \"BSD-3-Clause\"\
    ,\n  \"bugs\": {\n    \"url\": \"https://github.com/bobatron/issues\"\n  }\n}\n\
    ```\n\n虽然 JSON 作为配置文件存在于一处，但它仍然扮演着数据交换格式的角色。对于位于某个目录下的设置文件，这种交换发生在人类和计算机之间。数据正在进行通信。\n\
    \n## 概览\n\n作为存储在服务器上的配置文件，或通过 URL 请求的资源，JSON 正在履行其作为数据交换格式的职责。我们已经在本书的章节中探索了这些职责（或角色）。让我们大体回顾一下\
    \ JSON 在当今世界是如何使用的。\n\n在服务器端，对象可以序列化为 JSON 文本格式，并反序列化回对象。也可以从服务器端代码中请求 JSON。我们在\
    \ 第 9 章 讨论的 ASP.NET 和 PHP 示例中看到了这一点。\n\n此外，JSON 是一种可以从服务器端请求的易解析数据格式。我们在 第 8 章\
    \ 中通过 CouchDB 看到了这一点。\n\nJSON 是一种通过 HTTP 请求的 API 格式。我们在 第 6 章 中通过 OpenWeatherMap\
    \ 看到了这一点。\n\nJavaScript `HttpRequest` 使用这种 API 格式。我们在 JSON 对象中看到了这一点。\n\n对于 JSON\
    \ 对象，通过内置的 `JSON.parse()` 函数实现这一点。\n\n从 JSON 对象来看，在服务器上使用这种格式。JSON 在全球范围内以这种方式进出。当我们再次查看\
    \ 6000 英的数据时，JSON 并不是唯一的数据交换格式。\n\nJSON 是一种流行的数据交换格式，因为许多系统将数据建模为对象。数据通常存储在关系型数据库中。虽然关系型数据库的表是表格，但数据中的关系被拆分为实体。每个实体（例如地址）都具有本质上是键值对的“字段”。\n\
    \n在支持面向对象编程的 JavaScript 浏览器系统中，JSON 是数据交换的理想格式。JSON 在 JavaScript 中与 Web API 通通信非常出色。\n\
    \n在面向对象的服务器端 Web 框架中，JSON 是数据交换的理想格式。JSON 在进出系统时保持其作为字面量量的结构，表现优异。\n\n正如 JSON\
    \ 作为配置文件 中的示例一样，必须考虑格式的优缺点。这归根底是工具要用工具的问题。\n\n## 索引\n\n### 符号\n\n*   \" \" (双引号)\n\
    \n    *   JSON 中的字符串值，JSON 字符串数据类型\n    *   JSON 键值对中的，正确的 JSON 语法\n    *   JSON\
    \ 字符串中的，正确的 JSON 语法\n    *   JSON 字符串内部，JSON 字符串数据类型\n\n*   $ (美元符号)，JSON 数字数据类型\n\
    \n*   ' ' (单引号)\n\n"
