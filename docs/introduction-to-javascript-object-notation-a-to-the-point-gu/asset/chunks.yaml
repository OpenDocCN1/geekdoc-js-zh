    # Chapter 1. What Is JSON?


    Before we look at JSON from a low-level point of view, let’s take a look at JSON
    from about 6,000 feet. From the mountain summit, we can see JSON flitting about
    in the world, carrying data in its lightweight format. If we look through our
    binoculars at JSON, we will see data among many curly bracket characters (`{}`).
    However, if we step back, and watch *how* it’s being used, we will ultimately
    see that it is a data interchange format.


    ## JSON Is a Data Interchange Format


    A data interchange format is a text format used to exchange data between platforms.
    Another data interchange format you may already have heard of is XML. The world
    needs data interchange formats, like XML and JSON, to exchange data between very
    different systems.


    Imagine for a moment a world comprised of hundreds of tiny, isolated islands among
    a vast ocean. Each island has its own unique language and customs. The islands
    all have seafaring merchants that travel long distances between the islands. Outside
    trade is an integral part of all the island economies and contributes to a high
    standard of living for the islanders. If it weren’t for the highly trained carrier
    seagulls, this would not be possible.


    The carrier seagulls move from island to island, carrying a paper report of data
    on which goods are in the highest demand. This way, merchants find out where they
    should move to next, and which goods they should acquire before embarking on their
    long voyages across the oceans. This important data allows all the islands to
    prosper without the threat of shortages.


    Keep in mind, each island speaks a different language. If the data were passed
    around in several languages, each island would need to invest in researchers to
    learn all the world’s languages and employ a team of translators. This would be
    expensive and time consuming. This is an intelligent world, however, so the islands
    all agreed on a single language with a standard format for communicating their
    trade data. Each island employs just a single translator that understands the
    one data format of the trade reports brought by the carrier seagulls.

