    \ heard of is `text/html` .\n\nThe MIME type for JSON is `application/json` .\n\
    \nThe Internet Assigned Numbers Authority (IANA) maintains [a comprehensive list\
    \ of media types](http://www.iana.org/assignments/media-types/media-types.xhtml)\
    \ .\n\n# Key Terms and Concepts\n\nThis chapter covered the following key terms:\n\
    \nLiteral\n\n> A value that is written precisely as it is meant to be interpreted.\n\
    \nVariable\n\n> A value that can be changed and is represented by an identifier,\
    \ such as *x* .\n\nMaximum portability (in data interchange)\n\n> Transcending\
    \ the base portability of the data format by ensuring the data itself will be\
    \ compatible across systems or platforms.\n\nName-value pair\n\n> A name-value\
    \ pair (or key-value pair) is a property or attribute with a name, and a corresponding\
    \ value.\n\nSyntax validation\n\n> Validation concerned with the form of JSON.\n\
    \nConformity validation\n\n> Validation concerned with the unique data structure.\n\
    \nWe also discussed these key concepts:\n\n*   JSON is based on the syntactic\
    \ representation of the properties of JavaScript object literals. This *does not*\
    \ include the functions of JavaScript object literals.\n\n*   In the JSON name-value\
    \ pair, the name is always surrounded by double quotes.\n\n*   In the JSON name-value\
    \ pair, the value can be a string, number, boolean, null, object, or array.\n\n\
    *   The list of name-value pairs in JSON is surrounded by curly brackets.\n\n\
    *   In JSON, multiple name-value pairs are separated by a comma.\n\n*   JSON files\
    \ use the *.json* extension.\n\n*   The JSON media type is `application/json`\
    \ .\n\n# Chapter 3. JSON Data Types\n\nIf you’ve already learned a programming\
    \ language or two, you likely have an understanding of data types. If not, that’s\
    \ OK too. Let’s take a quick look.\n\n# Quick Look at Data Types\n\nImagine what\
    \ would happen if you hand a little boy that knows nothing about tools a hammer,\
    \ and you don’t tell him what it’s for. Property and bodily damage would likely\
    \ occur. If this child is well behaved and coordinated, we could give this child\
    \ a set of instructions for using the hammer. Instead of running around damaging\
    \ things, the child would only ever use it for hammering nails and removing them\
    \ (it’s a well-behaved child, remember). Additionally, when you say to the child,\
    \ “Will you pass me the hammer, please?”, he doesn’t hand you the screwdriver.\
    \ Knowing what something is ahead of time and how to use it is as useful in computing\
    \ as it is in the real world.\n\nIn computing, we most often need to know what\
    \ type of data we are dealing with because we can do different things with different\
    \ types of data. I can multiply a number by another number, but I can’t multiply\
    \ a word by another number. If I have a list of words, I can sort them alphabetically.\
    \ I can’t sort the number 5 alphabetically. So, in programming, when a method\
    \ (or function) says, “Will you pass me the number, please?”, if we know what\
    \ a number is, we won’t make the mistake of passing it the word “ketchup.”\n\n\
    In computer science, there is a set of data types referred to as primitive data\
    \ types. The word “primitive” evokes imagery of Stone Age cavemen sitting around\
    \ a fire grunting and sharpening sticks. It’s not that these data types are unrefined\
    \ like the cavemen; rather, it’s that they are some of the first, most basic types\
    \ of data. Like modern man and cavemen, some of the more modern and progressive\
    \ data types in existence have their roots in these primitive data types:\n\n\
    *   Numbers (e.g., 5 or 5.09)\n\n    *   Integer\n\n    *   Floating-point number\n\
    \n    *   Fixed-point number\n\n*   Characters and strings (e.g., “a” or “A” or\
    \ “apple”)\n\n*   Booleans (i.e., true or false)"
