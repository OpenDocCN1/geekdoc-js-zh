    \ 这行 JavaScript 将隐藏 id 为“myButton”的 HTML 按钮；它不会显示在浏览器中\n\n```\n document.getElementById(\"\
    myButton\").style.display = \"none\";\n```\n\njQuery 使用少于一半的代码字符实现了相同的目标（示例 7-3）。\n\
    \n### 示例 7-3. 这行 jQuery 将隐藏 id 为“myButton”的 HTML 按钮；它不会显示在浏览器中\n\n```\n $(\"#myButton\"\
    ).hide();\n```\n\n为了实现相同的目标而输入少于一半的字符可以节省生产时间。除了节省时间，jQuery 还处理了 Internet 浏览器的兼容性问题。例如，在第\
    \ 5 章中，我提到了 `JSON.parse()` 是比 `eval()` 解析 JSON 的更安全的替代方案。在旧版本的 Internet Explorer、Firefox\
    \ 和 Chrome 中，`JSON.parse()` 是不支持支持的。这意味着无论你使用 `JSON.parse()` 编写了什么功能，对于那些未能更新浏览器的少数用户来说，该功能将无法工作。\n\
    \njQuery 为你处理许多常见的版本兼容性问题，包括提到的 `JSON.parse()` 问题。jQuery 有一个解析 JSON 的函数：`jQuery.parseJSON`。在示例\
    \ 7-4 中，使用 JavaScript 的 `JSON.parse()` 解析 JSON。在示例 7-5 中，使用内置的 jQuery 函数解析 JSON。\n\
    \n### 示例 7-4. 使用 JSON.parse() 在 JavaScript 中解析 JSON\n\n```\n var myAnimal = JSON.parse('{\
    \ \"animal\" : \"cat\" }');\n```\n\n### 示例 7-5. 使用 jQuery 的.parseJSON 解析 JSON\n\
    \n```\n var myAnimal = jQuery.parseJSON('{ \"animal\" : \"cat\" }');\n```\n\n\
    在示例中，你可以看到 jQuery 示例似乎并没有在输入上节省任何字符。然而，`jQuery.parseJSON()` 函数所做的远比一行代码要多。如果你查看\
    \ jQuery 库源码中该函数的代码，它尝试使用原生的 `JSON.parse()` 函数。如果浏览器中不可用（对于旧版本），它将回退到使用 `new Function()`，这等同于使用\
    \ `eval()`。\n\n（此处省略了原文中重复出现的段落）\n\n# AngularJS\n\n[注：原文此处为：The [AngularJS framework](https://angularjs.org/)\
    \ is an abstraction tool that caters to single-page applications. *Single-page\
    \ applications* are web pages that break away from the traditional multipage approach\
    \ to create a more seamless experience.*）\n\n[AngularJS 框架](https://angularjs.org/)\
    \ 是一种面向单页应用的抽象工具。*单页应用*是脱离了传统多页方法以创建更无缝体验的网页。\n\n（注：原文后续包含大量重复的示例和描述，已按要求去重处理。）\n\
    \n"
- fmt: "\n# AngularJS Learning Curve and Data Binding\n\n## Introduction\n\nAngularJS\
    \ can have a steep learning curve, especially for those that have been working\
    \ with JavaScript and HTML Document Object Model (DOM) manipulations for years.\
    \ It requires a shift in thinking about how to interact with the DOM. AngularJS\
    \ seeks to decouple DOM manipulation from application logic.\n\nThis decoupling\
    \ of DOM manipulation can be expressed by comparing how we would achieve the same\
    \ goal without the AngularJS framework and with it. For example, I need to change\
    \ a message on a page from the generic “Hello, stranger” ([Example 7-8](#text00009.html_ex0708))\
    \ to a personalized greeting when a user signs in ([Example 7-9](#text00009.html_ex0709)).\
    \ In JavaScript, we would achieve this by manipulating the DOM.\n\n## Comparing\
    \ DOM Manipulation and AngularJS Data Binding\n\n### Example 7-8: The HTML message\
    \ when the user is not signed in\n\n```html\n<h1 id=\"message\">Hello, stranger!</h1>\n\
    ```\n\n### Example 7-9: The JavaScript to change the message if the user is signed\
    \ in\n\n```javascript\nif (signedIn) {\n    var message = \"Hello, \" + userName\
    \ + \"!\";\n    document.getElementById(\"message\").innerHTML = message;\n}\n\
    ```\n\n## AngularJS Data Binding\n\nIn AngularJS, as the HTML is our view, we\
    \ set it up to prepare for changes in our data model ([Example 7-10](#text00009.html_ex0710)).\n\
    \n### Example 7-10: The HTML view with AngularJS attributes and syntax for data\
    \ binding\n\n```html\n<body ng-app=\"myApp\">\n    <div id=\"wrapper\" ng-controller=\"\
    myAppController\">\n        <h1 id=\"message\">Hello {{ userData.userName }}!</h1>\n\
    \    </div>\n</body>\n```\n\nThe `\"ng-app\"` and `\"ng-controller\"` attributes\
    \ on the HTML tags (`<body>` and `<div>`) are syntax for setting up the view to\
    \ support data binding. Data binding is exactly what it sounds like: we are “binding”\
    \ data to a page through a series of placeholders. The AngularJS syntax uses “handlebars”\
    \ for these placeholders where data is to be bound. These handlebars are two open\
    \ curly brackets (`{{`) and two closing curly brackets (`}}`) surrounding syntax\
    \ for the placeholder (`userData.userName` in [Example 7-10](#text00009.html_ex0710)).\n\
    \nIn [Example 7-11](#text00009.html_ex0711), the JavaScript controller with a\
    \ `userData` object is added to the global scope; this allows the view (the HTML)\
    \ to use the object for data binding.\n\n### Example 7-11: userData object added\
    \ to global scope\n\n```javascript\nangular.module('myApp', [])\n    .controller('myAppController',\
    \ function($scope) {\n        $scope.userData = { userName : \"Stranger\" };\n\
    \        if(signedIn)\n        {\n            $scope.userData = { userName : \"\
    Bob\" };\n        }\n    });\n```\n\nIn the AngularJS JavaScript controller file,\
    \ instead of manipulating the DOM, the data model is manipulated. The data model\
    \ being manipulated is the `userData` object. Both the plain JavaScript/HTML example\
    \ and the Angular example achieve the same functionality. For my simple example,\
    \ the Angular way might seem like more effort, especially for an abstraction tool.\
    \ However, when you delve into a complex application such as a page that allows\
    \ users to perform create, read, update, and delete (CRUD) operations on their\
    \ user info, the Angular way simplifies development.\n\n[Example 7-11](#text00009.html_ex0711)\
    \ showed a JavaScript object `userData` for a data model. AngularJS leverages\
    \ JavaScript objects by using them as the model in the MVC architecture. As we\
    \ know, JSON is the notation for JavaScript object literals. So where does JSON\
    \ fit in with AngularJS?\n\nThe question to ask is, “Where does our data model\
    \ come from?” In the example code, my data model was hardcoded into the controller.\
    \ If we return to the example of a digital encyclopedia, we know that data has\
    \ to live somewhere. When data is stored, it is usually stored in a database of\
    \ some sort.\n\nHow we get that data into the data model of our single-page web\
    \ application is up to the developers. In an AngularJS data model, the most common\
    \ vehicle for getting that data from the database to the data model is with JSON.\
    \ This is often a JSON resource requested over HTTP, a client–server relationship.\
    \ AngularJS leverages this relationship for retrieving data models easily with\
    \ a core AngularJS service: `$http`.\n\nIn [Example 7-12](#text00009.html_ex0712),\
    \ the AngularJS `$http` is used to get weather data from the OpenWeatherMap API;\
    \ the JSON is added to the global scope as an object named `weatherData`. The\
    \ response appears in [Example 7-13](#text00009.html_ex0713).\n\n## Data Model\
    \ and JSON\n\n### Example 7-12: Getting weather data from the OpenWeatherMap API\n\
    \n```javascript\nangular.module('myApp', [])\n    .controller('myAppController',\
    \ function($scope, $http) {\n        $http.get('http://api.openweathermap.org/data/2.5/weather?lat=35&lon=139').\n\
    \            success(function(data, status, headers, config) {\n             \
    \   $scope.weatherData = data;\n            });\n    });\n```\n\n### Example 7-13:\
    \ The JSON response from the OpenWeatherMap API\n\n```json\n{\n    \"coord\":\
    \ {\n        \"lon\": 139,\n        \"lat\": 35\n    },\n    \"sys\": {\n    \
    \    \"message\": 0.0099,\n        \"country\": \"JP\",\n        \"sunrise\":\
    \ 1431805135,\n        \"sunset\": 1431855710\n    },\n    \"weather\": [\n  \
    \      {\n            \"id\": 800,\n            \"main\": \"Clear\",\n       \
    \     \"description\": \"sky is clear\",\n            \"icon\": \"02n\"\n    \
    \    }\n    ],\n    \"base\": \"stations\",\n    \"main\": {\n        \"temp\"\
    : 291.116,\n        \"temp_min\": 291.116,\n        \"temp_max\": 291.116,\n \
    \       \"pressure\": 1020.61,\n        \"sea_level\": 1028.58,\n        \"grnd_level\"\
    : 1020.61,\n        \"humidity\": 95\n    },\n    \"wind\": {\n        \"speed\"\
    : 1.51,\n        \"deg\": 339.501\n    },\n    \"clouds\": {\n        \"all\"\
    : 8\n    },\n    \"dt\": 1431874405,\n    \"id\": 1851632,\n    \"name\": \"Shuzenji\"\
    ,\n    \"cod\": 200\n}\n```\n\nThe JSON from the OpenWeatherMap API is deserialized\
    \ by the AngularJS `$http`. After it is added to the global scope as an object\
    \ named `weatherData`, it becomes our data model that we can bind to in our HTML\
    \ view with handlebars syntax.\n\nIn [Example 7-14](#text00009.html_ex0714), inside\
    \ the handlebars syntax, the data being bound is the weather description. The\
    \ weather description is in the weather property, which contains an array of objects,\
    \ with only one value. I select the value at index 0 with `weather[0]` and then\
    \ the property `description`.\n\n### Example 7-14: Binding the weather description\n\
    \n```html\n<body ng-app=\"myApp\">\n    <div id=\"wrapper\" ng-controller=\"myAppController\"\
    >\n        <div>\n            {{ weatherData.weather[0].description }}\n     \
    \   </div>\n    </div>\n</body>\n```\n\nAt the time of writing this chapter, the\
    \ weather was “sky is clear.” I could make this single-page application update\
    \ every 60 seconds to deliver the description of the current weather. The HTTP\
    \ request would happen behind the scenes, and the data model updating would automatically\
    \ change the HTML view. The human would not have to initiate this request; this\
    \ can all take place in the background. Additionally, with the MVC concept, the\
    \ JavaScript code I write does not have to make the change to the DOM. Updating\
    \ the data model automatically updates the view.\n\nAngularJS leverages JavaScript\
    \ Objects and JSON in its model-view-controller architecture. jQuery supports\
    \ JSON with easy functions for requesting and parsing JSON. Much of the success\
    \ of a data interchange format hinges on support by those who interchange data.\
    \ In the client–server relationship of the Web, we can see that JSON is supported\
    \ both by JavaScript and its powerful abstraction tools. In Chapters [8](#text00010.html_chapter_nosql)\
    \ and [9](#text00011.html_chapter_jsonserverside), we will see how JSON is supported\
    \ and used on the server side of that relationship.\n\n## Key Terms and Concepts\n\
    \nThis chapter covered the following key terms:\n\nAbstraction\n\n> A technique\
    \ for dealing with complex systems that involves focusing on smaller areas of\
    \ that system.\n\nFramework\n\n> An abstraction tool that saves time and allows\
    \ for focus on building features.\n\n`jQuery.parseJSON()`\n"
