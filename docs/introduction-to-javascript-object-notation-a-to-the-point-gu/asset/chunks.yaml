  trans: "\n```\nvar myXMLHttpRequest = new XMLHttpRequest();\nvar url = \"http://api.openweathermap.org/data/2.5/weather?lat=35&lon=139\"\
    ;\n\nmyXMLHttpRequest.onreadystatechange = function() {\n    if (myXMLHttpRequest.readyState\
    \ === 4 && myXMLHttpRequest.status === 200) {\n        var myObject = JSON.parse(myXMLHttpRequest.responseText);\n\
    \        var myJSON = JSON.stringify(myObject);\n    }\n}\nmyXMLHttpRequest.open(\"\
    GET\", url, true);\nmyXMLHttpRequest.send();\n```\n\n在示例中，代码的第二行创建了一个包含 JSON 资源\
    \ URL 的变量。然后我创建了一个函数，并将其赋值给 `myXMLHttpRequest` 的 `onreadystatechange` 属性。该函数会在\
    \ `readyState` 属性每次变化时执行。在函数中，我检查 `readyState` 是否为 4（表示“完成”）以及 HTTP 状态码是否为 200（表示“成功”）。如果两者都为真，则将\
    \ JSON 解析为 JSON 对象。\n\n当你把对象转换为文本，再把文本转换回对象时，经常会听到两个术语：*序列化*和*反序列化*。序列化是将对象转换为文本的过程。反序列化是将文本转换回对象的过程。\n\
    \n在示例 6-5 中，JavaScript 使用 `JSON.parse()` 进行反序列化。在 `responseText` 中，JSON 仅仅是一种数据交换格式的文本。一旦通过\
    \ `JSON.parse()` 解析后，它就不再是 JSON，而是 JavaScript 对象。\n\n##### 示例 6-5. 反序列化\n\n```\n\
    var myJSON = JSON.parse(myXMLHttpRequest.responseText);\n```\n\n使用 `JSON.parse()`\
    \ 进行反序列化是必要的，因为 JSON 尚未成为对象。请记住，JSON 代表 JavaScript 对象*表示法*。当它以 JSON 形式存在时，它是对象的一种文本字面量表示。要使\
    \ JSON 成为真正的对象，必须对其进行反序列化。在 JavaScript 中，我们也可以使用 `JSON.stringify()` 对 JSON 进行序列化。\n\
    \n在示例 6-6 中，`myObject` 变量获得反序列化后的 JSON。现在它是一个对象。`myJSON` 变量获得序列化后的对象。现在它是 JSON。\n\
    \n##### 示例 6-6. 对象反序列化后再序列化\n\n```\n// the JSON response deserialized \nvar myObject\
    \ = JSON.parse(myXMLHttpRequest.responseText); \n\n// The object serialized\n\
    var myJSON = JSON.stringify(myObject); \n```\n\n最后，示例中的最后两行代码用于设置请求，然后通过 HTTP\
    \ 协议发送请求（示例 6-7）。\n\n##### 示例 6-7. 设置并发送 JSON 请求\n\n```\nmyXMLHttpRequest.open(\"\
    GET\", url, true);\nmyXMLHttpRequest.send();\n```\n\n你可能会觉得奇怪，处理 JSON 响应的代码出现在请求发送之前。我甚至在讨论请求的设置和发送之前就提到了它。`onreadystatechange`\
    \ 属性的函数值是一个 EventHandler。底层的 JavaScript 引擎（不是我的代码）有逻辑在每次就绪状态变化时访问该属性的值（我的函数）。就绪状态从\
    \ 0 到 4 分别是：\n\n0 for UNSENT\n\n> 在 `open()` 函数执行之前的状态。\n\n1 for OPENED\n\n> 在\
    \ `open()` 函数执行之后、`send()` 函数执行之前的状态。\n\n2 for HEADERS_RECEIVED\n\n> 在 `send()`\
    \ 函数执行之后，响应头和状态可用的状态。\n\n3 for LOADING\n\n> 响应头已接收，但响应体仍在获取中的状态。\n\n4 for DONE\n\
    \n> 完成；已收到包含头部和主体的完整消息。\n\n* * *\n\n###### 注意\n\n处理就绪状态的状态码可能看起来令人困惑。在第 7 章中，我们将看到如何使用\
    \ jQuery 简化 `XMLHttpRequest`。使用 jQuery，我们可以通过简单的 `getJSON()` 函数获取 JSON，并以更易读的方式处理状态：`done()`、`fail()`、`always()`。\n\
    \n* * *\n\n在示例中，我使用了一个属于 OpenWeatherMap API 的 URL。这是一个通过网络 API 提供天气数据的网络服务。该 API\
    \ 为各种天气数据提供 XML 和 JSON 资源的 URL。我的示例展示了如何在客户端使用 JavaScript 请求并接收来自该 API 的 JSON。然而，互联网浏览器出于安全考虑有关于共享的规则。同源策略规定，网站只能与同一域名的站点进行此类后台请求。这样是为了保护用户，因为除非他们知道什么是浏览器开发者工具，否则他们*看到*这些请求的发生。\n\
    \n我分享的代码可以在 URL 为 *http://www.mycoolsite.com* 的站点上的脚本中执行。这是来源域，因为它是原始请求的 URL。API\
    \ 的 URL 是：\n\n> *http://api.openweathermap.org/data/2.5/weather?lat=35&lon=139*\n\
    \n域 *http://api.openweathermap.org* 与来源域 *http://www.mycoolsite.com* 不匹配。这明显违反了同源策略。这种后台请求和响应之所以能够实现，只是因为\
    \ OpenWeatherMap API 的开发者跨越了一些障碍。让我们来看看这些障碍和漏洞，了解公共 API 的幕后请求是如何实现的。\n\n# 关系困扰与共享规则\n\
    \n我意识到我在这里留下了一个悬念。我刚刚展示了一段可以工作但违反同源浏览器规则的代码。它不应该工作，但由于 OpenWeatherMap API 的开发者跨越了一个障碍，它却工作了。听起来像一部糟糕的肥电剧，两个人无法决定他们的关系。浏览器会允许对公共\
    \ Web API 的请求吗？请继续关注。\n\n## 跨域资源共享 (CORS)\n\n一些 Web 开发者可能多年编写 JavaScript AJAX\
    \ 代码，向公共 Web API 发起请求，却从未遇到同源策略。这是因为大多数公共 API 已在自己的服务器上实现了 CORS。服务器在响应头中提供一些以\
    \ `Access-Control-Allow` 为前缀的额外属性（示例 6-8）。\n\n##### 示例 6-8. OpenWeatherMap API\
    \ 响应中针对资源 http://api.openweathermap.org/data/2.5/weather?lat=35&lon=139 的 Access-Control-Allow\
    \ 头\n\n```\nAccess-Control-Allow-Credentials:true\nAccess-Control-Allow-Methods:GET,\
    \ POST\nAccess-Control-Allow-Origin:*\n```\n\n这些头信息定义了是否允许凭证、哪些 HTTP 方法被允许（`GET`、`POST`、`PUT`、`DELETE`、`HEAD`、`OPTIONS`、`TRACE`、`CONNECT`），以及最重要的，允许哪些来源域。在示例中，提供了星号（`*`）。这是一个通配符，表示允许任何来源域。\n\
    \nCORS 使得像 OpenWeatherMap 这样的站点能够以允许用户在客户端的 AJAX 交互中包含数据的方式共享数据。此外，CORS 还可用于防止网站对\
    \ API 进行恶意操作，例如 CSRF。如果你记得第 5 章中的示例，一个坏人能够将 JSON 链接到 `<script>` 标签中并利用银行站点的信任。银行可以采取的安全措施是实现\
    \ CORS，并在其响应中包含示例 6-9 中所示的头信息。\n\n##### 示例 6-9. CORS 用作安全措施\n\n```\nAccess-Control-Allow-Methods:POST\n\
    Access-Control-Allow-Origin:http://www.somebank.com\n```\n\n在示例中，`POST` 是唯一允许的方法。如果有人尝试从\
    \ `<script>` 标签中的 URL 请求此资源（使用 `GET` 方法），浏览器将不允许。此外，通过指定银行的来源站点 URL，浏览器将拒绝访问除\
    \ *http://www.somebank.com* 之外的任何网站。\n"
- fmt: "\nImplementing CORS is not always an option, and JSON is not always hosted\
    \ by a full-fledged web API. Perhaps you have two sites with two different domains\
    \ (`http://domainone.com` and `http://domaintwo.com`) and you want to share a\
    \ JSON file from `http://domainone.com` to `http://domaintwo.com`. This is where\
    \ JSON-P comes in.\n\n## JSON-P\n\nJSON-P stands for JSON with padding. I mentioned\
    \ in [Chapter 5](#text00007.html_chapter_securityConcerns) that `<script>` tags\
    \ are exempt from same-origin policies. JSON-P uses this exemption to request\
    \ JSON from servers without the same origin.\n\nJSON-P is not as ideal as CORS,\
    \ since it is classified as a workaround (CORS is the preferred method, as it\
    \ is a standard). However, when push comes to shove, sometimes a workaround like\
    \ this is needed. You need a relationship between `http://domainone.com` and `http://domaintwo.com`,\
    \ and the browser rules about sharing can make this frustrating when CORS is not\
    \ an option.\n\nThe “padding” in JSON-P is very simple. It’s JavaScript added\
    \ to the JSON document. See [Example 6-10](#text00008.html_ex0610).\n\n### Example\
    \ 6-10. JSON with padding (JSON-P)\n\n```\ngetTheAnimal(\n    {\n        \"animal\"\
    : \"cat\"\n    }\n);\n```\n\nThe JavaScript “padding” in this JSON document is\
    \ a call to a function with the JSON supplied as a parameter. Function parameters\
    \ provide a way to pass data into the function. For example, if I wanted a function\
    \ that added two numbers together, I would need a way to pass those two numbers\
    \ into the function.\n\nThis function is defined in our client-side code, in our\
    \ JavaScript ([Example 6-11](#text00008.html_ex0611)).\n\n### Example 6-11. The\
    \ function declared in our JavaScript\n\n```\nfunction getTheAnimal(data) {\n\
    \    var myAnimal = data.animal; // will be \"cat\"\n}\n```\n\nAfter the function\
    \ is declared in the JavaScript, some setup is required. This is the part of JSON-P\
    \ that takes advantage of the `<script>` tag exemption from the same-origin policy.\
    \ See [Example 6-12](#text00008.html_ex0612).\n\n### Example 6-12. The <script>\
    \ tag is created and dynamically appended to the HTML document after the <head>\
    \ tag\n\n```\nvar script = document.createElement(\"script\");\nscript.type =\
    \ \"text/javascript\";\nscript.src = \"http://notarealdomain.com/animal.json\"\
    ;\ndocument.getElementsByTagName('head')[0].appendChild(script);\n```\n\nFor servers\
    \ implementing JSON-P, it is also customary to allow the user to decide what the\
    \ function should be named. This is usually passed in via the URL as a query string\
    \ parameter. See [Example 6-13](#text00008.html_ex0613).\n\n### Example 6-13.\
    \ A name for the function communicated to the server via the query string\n\n\
    ```\nscript.src = \"http://notarealdomain.com/animal.json?callback=getThing\"\
    ;\n```\n\nThe server would receive my function name in the callback and generate\
    \ the padding dynamically in the JSON file. See [Example 6-14](#text00008.html_ex0614).\n\
    \n### Example 6-14. A dynamically named function in the JSON padding\n\n```\n\
    getThing(\n    {\n        \"animal\": \"cat\"\n    }\n);\n```\n\nJSON-P still\
    \ requires effort on the server side, as the JSON resource must contain the JavaScript\
    \ padding. Both CORS and JSON-P require an effort on the server side. Therefore,\
    \ a cross-domain `XMLHttpRequest` by a client is dependent on the server of the\
    \ JSON resource for success.\n\n## Key Terms and Concepts\n\nThis chapter covered\
    \ the following key terms:\n\nWeb API\n\n> A set of instructions and standards\
    \ for interacting with a service over HTTP.\n\n`XMLHttpRequest`\n\n> A JavaScript\
    \ object, primarily used in AJAX programming, that retrieves data from a URL without\
    \ reloading the page.\n\nHyperText Transfer Protocol (HTTP)\n\n> The protocol\
    \ that is the very foundation of data communication for the World Wide Web.\n\n\
    Serialization\n\n> The act of converting the object into text.\n\nDeserialization\n\
    \n> The act of converting the serialized text back into an object.\n\nSame-origin\
    \ policy\n\n> The Internet browser requires scripts to originate from the same\
    \ domain for security.\n\nCross-origin resource sharing (CORS)\n\n> Allows resources\
    \ (e.g., a JSON document) to be requested from another domain outside of the domain\
    \ of the requestor by defining permission in the response headers.\n\nJSON with\
    \ padding (JSON-P)\n\n> Uses the `<script>` tag exemption from the same-origin\
    \ policy to request JSON from servers without the same origin.\n\nWe also discussed\
    \ these key concepts:\n\n*   The relationship between the JavaScript `XMLHttpRequest`\
    \ and a web API is a client–server relationship.\n*   `XMLHttpRequest` isn’t just\
    \ for XML. We use it to request JSON resources as well.\n*   A website caters\
    \ to humans, and a web API caters to code. Both serve resources over HTTP.\n*\
    \   The same-origin policy can cause relationship woes for client–server interactions\
    \ between JavaScript and a JSON resource.\n*   A cross-domain `XMLHttpRequest`\
    \ by a client is dependent on the server of the JSON resource for success.\n\n\
    ## Chapter 7. JSON and Client-Side Frameworks\n\nIn [Chapter 6](#text00008.html_chapter_Jsxmlhttp),\
    \ we took a look at a client–server relationship between the web browser and a\
    \ web API. In this chapter, we will zoom the lens to the client side of that relationship,\
    \ and see how some client-side frameworks are supporting or leveraging JSON.\n\
    \nLet’s take a quick look at what a framework is, for those that are not familiar\
    \ with the concept. In the physical world, “framework” can be used to describe\
    \ an essential supporting structure, or an underlying structure. In computing,\
    \ a framework is not an underlying structure. It is a structure that sits on a\
    \ layer above software or a programming language to provide support to the developers.\n\
    \nA framework in computing is a supporting structure, but not in a way that can\
    \ be related to the beams of a building. If the JavaScript language were a house,\
    \ a JavaScript framework would not be the supporting structure of that building.\
    \ In fact, you can build a very strong house without a JavaScript framework.\n\
    \nIf we were in the business of building houses with JavaScript, a JavaScript\
    \ framework would be like ordering a prefabricated house that already contains\
    \ plumbing and wiring for electricity. With our prefabricated houses, we could\
    \ focus on creating whatever type of kitchen sink we wanted and running water\
    \ would just be a matter of connecting the sink to the plumbing. We could focus\
    \ on installing nice cabinetry and beautiful granite countertops. In essence,\
    \ our JavaScript framework would allow us to save time and focus on building features.\n\
    \nThis time-saving and focus-inducing framework is known in computer science as\
    \ an abstraction tool. For those not familiar with the concept of abstraction,\
    \ it may elicit images of Picasso’s art with strange faces made from shapes. Abstraction\
    \ is not complex art, but a technique for dealing with complex systems.\n\nIf\
    \ you were tasked with building a spaceship and you had no experience in rocket\
    \ science, where would you start? Most of us would say, “Clearly I’m not the best\
    \ person for this job,” but what if you had no choice? You could stare right into\
    \ the face of that complex task and feel like it is impossible. You could panic\
    \ and lock yourself into a room. Or, you could use abstraction.\n\nWith abstraction,\
    \ you focus on one piece of the whole puzzle at a time. We break the task of building\
    \ a spaceship into all of its essential pieces, such as supporting human life\
    \ on the ship or launching the ship into outer space. We focus on each part of\
    \ the complex system until the system is whole.\n\nAn abstraction tool is any\
    \ tool that facilitates abstraction. A JavaScript framework facilitates abstraction\
    \ with prefabricated libraries that have already dealt with complexities in the\
    \ system. Not that we can build a real spaceship out of a JavaScript framework,\
    \ but if we could that framework might contain a ship that can already launch\
    \ into space. This would allow the ship builders to focus on how they are going\
    \ to support human life inside the ship.\n"
