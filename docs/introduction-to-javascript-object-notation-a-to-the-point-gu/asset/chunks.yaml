    \ JSON, the `json_decode` function is called.\n\n### Serializing JSON\n\nIn PHP,\
    \ we can quickly serialize PHP objects with the built-in support for JSON. In\
    \ this section, we will create a PHP object representing an address, and serialize\
    \ to JSON.\n\nIn [Example 9-11](#text00011.html_ex0911) , we first create a class\
    \ representing an account. Then, we create a new instance of the class for Bob\
    \ Barker’s account. An `Account` object is created. Finally, on the last line,\
    \ we call the built-in function `json_encode` to serialize the `Account` object\
    \ (results shown in [Example 9-12](#text00011.html_ex0912) ).\n\n##### Example\
    \ 9-11. Creating and serializing an account\n\n```\n <?php\nclass Account {\n\
    \    public $firstName;\n    public $lastName;\n    public $phone;\n    public\
    \ $gender;\n    public $addresses;\n    public $famous;\n}\n\nclass Address {\n\
    \    public $street;\n    public $city;\n    public $state;\n    public $zip;\n\
    }\n\n$address1 = new Address();\n$address1->street = \"123 fakey st\";\n$address1->city\
    \ = \"Somewhere\";\n$address1->state = \"CA\";\n$address1->zip = 96027;\n\n$address2\
    \ = new Address();\n$address2->street = \"456 fake dr\";\n$address2->city = \"\
    Some Place\";\n$address2->state = \"CA\";\n$address2->zip = 96345;\n\n$account\
    \ = new Account();\n$account->firstName = \"Bob\";\n$account->lastName = \"Barker\"\
    ;\n$account->gender = \"male\";\n$account->phone = \"555-555-5555\";\n$account->famous\
    \ = true;        \n$account->addresses = array ($address1, $address2);\n\n$json\
    \ = json_encode($account);\n\n?>\n```\n\n##### Example 9-12. The JSON result from\
    \ json_encode($account)\n\n```\n {\n    \"firstName\": \"Bob\",\n    \"lastName\"\
    : \"Barker\",\n    \"phone\": \"555-555-5555\",\n    \"gender\": \"male\",\n \
    \   \"addresses\": [\n        {\n            \"street\": \"123 fakey st\",\n \
    \           \"city\": \"Somewhere\",\n            \"state\": \"CA\",\n       \
    \     \"zip\": 96027\n        },\n        {\n            \"street\": \"456 fake\
    \ dr\",\n            \"city\": \"Some Place\",\n            \"state\": \"CA\"\
    ,\n            \"zip\": 96345\n        }\n    ],\n    \"famous\": true\n}\n```\n\
    \n### Deserializing JSON\n\nTo serialize JSON in PHP, we used the built-in `json_encode`\
    \ function. To deserialize JSON, we use the `json_decode` function. Unfortunately,\
    \ this does not have built-in support for deserializing the JSON to a specified\
    \ PHP object, such as the `Account` class. So, we must do a little processing\
    \ to reshape our data back into the PHP object.\n\nLet’s add a new function to\
    \ the `Account` object, to load up its properties from a JSON string.\n\nIn [Example 9-13](#text00011.html_ex0913)\
    \ , the `loadFromJSON` function accepts a JSON string for a parameter, calls the\
    \ built-in `json_decode` function to deserialize to a generic PHP object, and\
    \ maps the name-value pairs to the `Account` properties by name in the `foreach`\
    \ loop.\n\n##### Example 9-13. Adding a function to the Account object\n\n```\n\
    \ class Account {\n    public $firstName;\n    public $lastName;\n    public $phone;\n\
    \    public $gender;\n    public $addresses;\n    public $famous;\n\n    public\
    \ function loadFromJSON($json)\n    {\n        $object = json_decode($json);\n\
    \        foreach ($object AS $name => $value) \n        {\n            $this->{$name}\
    \ = $value;\n        }\n    }\n}\n```\n\nNext, we can create a new `Account` object,\
    \ and call the new `loadFromJSON` function ([Example 9-14](#text00011.html_ex0914)\
    \ ).\n\n##### Example 9-14. Calling our new loadFromJSON function to deserialize\
    \ the account JSON back into the `Account` object; the last line will display\
    \ “Bob Barker”\n\n```\n $json = json_encode($account);\n\n$deserializedAccount\
    \ = new Account();\n$deserializedAccount->loadFromJSON($json);\n\necho $deserializedAccount->firstName\
    \ . \" \" . $deserializedAccount->lastName;\n```\n\n### Requesting JSON\n\nTo\
    \ make an HTTP request for a resource with PHP, I can use the built-in function\
    \ `file_get_contents` . This function returns the resource body as a string. We\
    \ can then deserialize the string to a PHP object (see Examples [9-15](#text00011.html_ex0915)\
    \ and [9-16](#text00011.html_ex0916) ).\n\n##### Example 9-15. Resource at URL\
    \ http://localhost:5984/accounts/ddc14efcf71396463f53c0f8800019ea from my local\
    \ CouchDB API\n\n```\n {\n    \"_id\": \"ddc14efcf71396463f53c0f8800019ea\",\n\
    \    \"_rev\": \"6-69fd853972074668f99b88a86aa6a083\",\n    \"address\": {\n \
    \       \"street\": \"123 fakey ln\",\n        \"city\": \"Some Place\",\n   \
    \     \"state\": \"CA\",\n        \"zip\": \"96037\"\n    },\n    \"gender\":\
    \ \"female\",\n    \"famous\": false,\n    \"age\": 28,\n    \"firstName\": \"\
    Mary\",\n    \"lastName\": \"Thomas\"\n}\n```\n\n##### Example 9-16. Calling the\
    \ built-in file_get_contents function to get the account JSON resource from the\
    \ CouchDB API. Next, a new Account object is created and our loadFromJSON function\
    \ is called to deserialize. The last line will display “Mary Thomas.”\n\n```\n\
    \ $url = \"http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c\";\n\
    $json = file_get_contents($url);\n\n$deserializedAccount = new Account();\n$deserializedAccount->loadFromJSON($json);\n\
    \necho $deserializedAccount->firstName . \" \" . $deserializedAccount->lastName;\
    \ \n```\n\n# A Smorgasbord of JSON HTTP Requests"
