  trans: "\n此外，如果银行只允许使用 `POST` 请求而不是 `GET` 请求来获取敏感的 `JSON`，那么坏人就无法利用其 URL 中的链接了。`GET`\
    \ 和 `POST` 是用于与服务器通信的两种 HTTP 方法。`GET` 是对数据的请求，可以返回响应。`POST` 是数据的提交，也可以返回响应。如果服务器允许对某个链接进行\
    \ `GET` 请求，那么它就可以直接在浏览器或 `<script>` 标签中被链接。然而，`POST` 无法被直接链接。如果没有那个方便的 `<script>`\
    \ 标签，坏人将受到资源共享策略的束缚，从而防止他在客户端进行任何其他可能欺骗银行使其信任他的操作。\n\n这并不意味着与 `JSON` 的 HTTP 数据交换应该完全限制在\
    \ `POST` 方法上。判断是否允许对页面或资源使用 `GET` 请求的一个通俗法则是问自己：此页面是否会需要通过 URL 直接访问，或者在 `<script>`\
    \ 标签中使用？如果答案是“否”，那么就应该禁用 `GET` 方法，以防止任何人通过 URL 或 `<script>` 标签访问它。\n\n*敏感*数据也是这种利用的关键。如果\
    \ `JSON` 只包含一个鸟类种类列表，坏人可能不会建立一个网站来尝试窃取数据。然而，在应对安全威胁时，习惯是非常重要的。如果你不养成在 `JSON` 中使用顶层数组的习惯，并且不养成方便地使用\
    \ `GET` 代替 `POST` 的习惯，那么你就不可能成为那个编写导致巨大漏洞和一堆愤怒客户代码的人。\n\n# 注入攻击\n\n注入攻击有许多形状和形式。归根结底，它们依赖于发现安全性中可利用的漏洞。刚刚介绍的\
    \ CSRF 攻击是一种依赖信任的攻击。而*注入攻击*是一种依赖向看似无害的网站注入恶意代码的攻击。\n\n## 跨站脚本 (XSS)\n\n跨站脚本 (XSS)\
    \ 攻击是注入攻击的一种。在处理 `JSON` 时经常发生的一种安全漏洞位于 JavaScript 获取 `JSON` 字符串并将其转换为 JavaScript\
    \ 对象的点。\n\n记住，`JSON` 本身只是文本。在编程中，如果我们想对该对象的文本表示形式做任何有用的操作，就需要将其加载到内存中并变为对象。然后就可以在编程逻辑中对其进行操作、检查和使用。\n\
    \n在 JavaScript 中，实现此点的方法一种是使用名为 `eval()` 的函数，它接收一个字符串，编译它然后执行它。\n\n在 示例 5-5 中，JavaScript\
    \ 代码使用 `eval()` 函数将动物/猫对象加载到内存中。随后可以在代码中访问对象的属性。第三行的 alert 将弹出一个显示“cat”的浏览器警告。\n\
    \n### 示例 5-5. 访问对象属性\n\n```\n var jsonString = '{\"animal\":\"cat\"}';    \n \
    \   var myObject = eval(\"(\" + jsonString + \")\"); \n    alert(myObject.animal);\n\
    ```\n\n随着 `JSON` 多年的发展，这种漏洞已经被认知。`JSON.parse()` 函数通过具有判别性来处理这种漏洞。该函数只会解析 `JSON`，而不会执行脚本。示例\
    \ 5-7 用 `JSON.parse()` 替换了 `eval()`。\n\n在 Web 开发中，另一个与安全问题同样受关注的问题是跨浏览器支持。随着 Web\
    \ 的演进，网站托管者必须决定他们应该支持哪些浏览器以及哪些版本。本质上，他们必须决定放弃谁。总会有人不更新他们的互联网浏览器，或者使用无法跟上演进标准的较冷门的互联网浏览器。\n\
    \n更安全的 `JSON.parse()` 函数目前在所有主流浏览器及其最新版本中均支持。然而，一小部分用户仍在使用的某些早期互联网浏览器版本并不支持此函数。如果使用了\
    \ `JSON.parse()`，那一小部分用户将无法使用依赖 `JSON` 的网站功能。通常，这通过寻找优雅失败的方法来解决。例如，与其显示一个满是泛滥错误的网页，不如考虑一个捕获这些错误并显示类似“请将浏览器更新到最新版本”消息的页面。\n\
    \n## 安全漏洞：架构决策\n\n在章节开始，我说过：“`JSON` 本身并不是威胁。”这仍然成立，但在某些情况下，威胁可以直接包含在 `JSON` 数据中，同时保持为合法的\
    \ `JSON`。\n\n让我们来看一些完全无害的 `JSON` (示例 5-8)。\n\n### 示例 5-8. 完全无害的 JSON\n\n```\n\
    \ {\n    \"message\": \"hello, world!\"\n}\n```\n\n现在，假定我托管了一个网站，它在数据库中存储消息，然后在网页上显示它们供用户阅读。我从未听过这种利用方式，所以我有一个页面，其中一个用户可以向另一个用户发送包含任何内容的消息。在我的消息页面上，我从服务器请求\
    \ `JSON` 字符串，在客户端我使用 `eval()` JavaScript 函数将 `JSON` 字符串响应转换为 JavaScript 对象。我在客户端代码中使用该\
    \ JavaScript 对象将消息值直接显示在 HTML 中。\n\n让我们来看 示例 5-9 中一些不无害的 `JSON`。\n\n### 示例 5-9.\
    \ 不那么无害的 JSON\n\n```\n {\n    \"message\": \"<div onmouseover=\\\"alert('gotcha!')\\\
    \">hover here.</div>\"\n}\n```\n\n示例中不无害的 `JSON` 包含了 JavaScript。虽然这段 JavaScript\
    \ 在 `JSON` 键值对的范围内，但它仅仅是一个文本字符串。这是完全合法的 `JSON`，并且这种 `JSON` 在很多地方使用并不构成威胁。\n\n\
    然而，示例中的 JavaScript 当在消息网站的 HTML 中输出时，是一个威胁。这里显示的“不那么无害的 `JSON`”每当用户鼠标光标悬停在屏幕消息上时，就会弹出一个显示“gotcha!”的警告框。问题在于，比弹出警告框可以做更糟糕的事。坏人可以包含脚本来访问你在页面上所有的私有消息，并将它们发送到自己的服务器上进行读取。\n"
- fmt: "\nWhat could I have done to prevent this? For one, I could have taken measures\
    \ to disallow HTML in my messages. This could involve both client-side and server-side\
    \ validation. Additionally, I could ensure that any HTML characters included in\
    \ the message were escaped, so the HTML characters such as `<div>` would display\
    \ as `&lt;div&gt;` on the page (`&lt;div&gt;` would not function as valid HTML).\
    \ All of these measures would be specific to the client-side and server-side code\
    \ that I am using in my architecture.\n\nMost injection attacks involve architecture\
    \ that has not been built with one important question in mind: how can a bad guy\
    \ exploit this? The decision to allow HTML in the JSON and display the values\
    \ directly on the page was a seemingly innocent architectural decision. In avoiding\
    \ injection attacks, the key is to think through possible exploits, and take the\
    \ extra (and sometimes arduous) steps to prevent them.\n\n# Key Terms and Concepts\n\
    \nThis chapter covered the following key terms:\n\n### Server side (in web development)\n\
    > The operations that take place behind the scenes on the server where a page\
    \ or resource is being requested. The server provides the response that the Internet\
    \ browser processes and/or loads.\n\n### Client side (in web development)\n> The\
    \ operations that take place in the Internet browser from the point that a requested\
    \ page is loaded. This is typically HTML, CSS, and JavaScript.\n\n### Cross-site\
    \ request forgery (CSRF)\n> An exploit that takes advantage of a site’s trust\
    \ in a user’s browser.\n\n### Top-level JSON array\n> A JSON array that exists\
    \ outside of a name-value pair and at the top level of the document.\n\n### Injection\
    \ attack\n> An attack that relies on injecting data into a web application to\
    \ facilitate the execution or interpretation of malicious data.\n\n### JSON cross-site\
    \ scripting (XSS) attack\n> A type of injection attack that takes advantage of\
    \ an innocent website by intercepting or replacing JSON being served to the site\
    \ by a third party with a malicious script.\n\nWe also discussed these key concepts:\n\
    \n* JSON by itself is not a threat. It is just text.\n* Three things to remember\
    \ that will address security concerns with JSON:\n    * Do not use top-level arrays.\
    \ Top-level arrays are valid JavaScript that can be linked to in a `<script>`\
    \ tag and used.\n    * Use HTTP `POST` instead of `GET` for JSON that is not intended\
    \ for the public. The HTTP `GET` request can be linked to in a URL and placed\
    \ in a `<script>` tag.\n    * Use `JSON.parse()` instead of `eval()`. The `eval()`\
    \ function will compile and execute the string that is passed in, which opens\
    \ your code up for attacks. `JSON.parse()` only parses JSON.\n* Holes in security\
    \ are often introduced through architectural decisions that do not ask the basic\
    \ question of “How can a bad guy exploit this?”\n\n# Chapter 6. The JavaScript\
    \ XMLHttpRequest and Web APIs\n\nThe JavaScript `XMLHttpRequest` and web APIs\
    \ might be difficult to say three times fast, but it’s really not as complicated\
    \ as it sounds. It is a simple client and server relationship. The JavaScript\
    \ `XMLHttpRequest` is the client making the requests, and the web API is the server\
    \ sending the responses.\n\nIn the client–server restaurant example discussed\
    \ in the previous chapter, I referred to the server as the kitchen and the client\
    \ as the customer. This chapter will focus on a type of kitchen and how this kitchen\
    \ operates.\n\nIt goes without saying that not every restaurant operates the same.\
    \ In some restaurants, you can drive up to a window to order your food. Some restaurants\
    \ are open to the public and other restaurants may only serve as a cafeteria inside\
    \ of a large company campus.\n\nA client–server relationship that most of us participate\
    \ in is surfing the Internet. Oftentimes we think of ourselves as traveling, or\
    \ exploring around the Internet. In reality, we are usually sitting and staring\
    \ into a screen. The Internet browser isn’t going anywhere either. It just sits\
    \ in place, as if at a table in a restaurant, making requests and receiving responses.\
    \ Once the server gives us our response, it is done with us and moves on to some\
    \ other entity making a request.\n\nThe request being made by the Internet browser\
    \ is for a resource. When we are “surfing the Internet,” we either click a link\
    \ with a URL or we directly type in a URL in our browser. URL stands for Universal\
    \ Resource Locator. The URLs we use in our Internet browsing are for locating\
    \ HTML resources, which allows us to see our websites, including the one with\
    \ pictures of cute kittens. In this scenario, the resource we are requesting has\
    \ a content type of `text/html`.\n\nAnother client–server relationship that doesn’t\
    \ directly involve humans is a web API. A web API serves content over HTTP just\
    \ like a website does, but it is not meant for human eyes. You can think of it\
    \ as a restaurant that caters to code because the majority of requests to these\
    \ servers are made by code.\n\nProgramming code doesn’t usually order up pictures\
    \ of cute kittens to look at like we do. Its appetite usually consists of requesting\
    \ data. This chapter is about a type of client that orders up JSON (a resource\
    \ with a content type of `application/json`), and the type of restaurant that\
    \ caters to these customers: web APIs.\n\nLet’s begin by taking a look at web\
    \ APIs, and the role JSON has within a web API.\n\n# Web APIs\n\nUnlike humans,\
    \ code doesn’t have a pair of eyes that want to read an article or view a picture.\
    \ Code needs to view that “something” in a format that it can read (parse). This\
    \ is where a data interchange format (like JSON, shown in [Example 6-1](#text00008.html_ex0601))\
    \ steps into the picture.\n\n### Example 6-1. JSON weather data from the OpenWeatherMap\
    \ web API\n\n```json\n\n    \"dt\": 1433383200,\n    \"temp\": {\n        \"day\"\
    : 293.5,\n        \"min\": 293.5,\n        \"max\": 293.5,\n        \"night\"\
    : 293.5,\n        \"eve\": 293.5,\n        \"morn\": 293.5\n    },\n    \"pressure\"\
    : 1015.06,\n    \"humidity\": 98,\n    \"weather\": [\n        {\n           \
    \ \"id\": 802,\n            \"main\": \"Clouds\",\n            \"description\"\
    : \"scattered clouds\",\n            \"icon\": \"03n\"\n        }\n    ],\n  \
    \  \"speed\": 2.86,\n    \"deg\": 134,\n    \"clouds\": 44\n}\n```\n\nThe JSON\
    \ weather data example can be “read” by any code capable of parsing JSON. This\
    \ JSON resource can be requested with a URL (the code example is a subset of the\
    \ full JSON document):\n\n> *http://api.openweathermap.org/data/2.5/forecast/daily?lat=35&lon=139&cnt=10&mode=json*\n\
    \nThough many public web APIs like OpenWeatherMap are for “reading,” many APIs\
    \ such as the PayPal API are more interactive. A *web API* is a set of instructions\
    \ and standards for interacting with a service over HTTP. That interaction can\
    \ include create, read, update, and delete (CRUD) operations and the web API will\
    \ have a reference outlining these instructions and standards.\n\nFor example,\
    \ according to the PayPal API reference, I can create a new invoice with the PayPal\
    \ API by posting JSON to the URL:\n\n> *https://api.sandbox.paypal.com/v1/invoicing/invoices*\n\
    \nIn [Example 6-2](#text00008.html_ex0602), we have JSON representing an invoice\
    \ to be sent as a request to the PayPal API.\n\n### Example 6-2. An invoice for\
    \ the PayPal API\n"
