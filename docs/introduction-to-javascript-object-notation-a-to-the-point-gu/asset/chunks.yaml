    \n```\n var jsonString = '{\"animal\":\"cat\"}';    \n    var myObject = JSON.parse(jsonString);\
    \ \n    alert(myObject.animal);\n```\n\nIn web development, another concern that\
    \ often weighs just as heavily as security concerns is cross-browser support.\
    \ As the Web evolves, those who host websites must decide which browsers and which\
