- fmt: "\n# Literals and JSON\n\n## Variables and Literals\n\nIn programming, the\
    \ word \"literal\" is a noun. A `literal` is a value that is represented literally\
    \ with data. It is written precisely as it is meant to be interpreted. If you\
    \ aren't familiar with programming concepts, then this might seem strange. Let's\
    \ take a quick look at literals.\n\nDo you carry cash in your wallet, or a debit\
    \ card? When I stop off at the sandwich shop and hand the cashier a five dollar\
    \ bill for my sandwich, I physically watch my five dollars leave my wallet. When\
    \ I swipe my debit card to pay for a sandwich, I know I have five dollars less\
    \ in my back account, even though I didn't see it happen.\n\nIn programming, we\
    \ often use variables to represent values. For example, I might use a `variable`\
    \ I call `x` in an expression like:\n\n```\n x = 5 \n```\n\nThen, later on, I\
    \ might want to add five more to `x`:\n\n```\n x = x + 5 \n```\n\nAt this point,\
    \ we know the value of `x` is 10, but we don't *see* 10. In this example, `x`\
    \ was the variable, and 5 was a literal. In our sandwich shop example, we could\
    \ say that the five dollars cash was a literal, and the debit card was a variable.\
    \ When we *see* the actual value, it is a literal value.\n\nIn the \"`x` = 5\"\
    \ example, 5 is a number literal. A number is a data type. Other types of data\
    \ are strings (made up of characters), boolean (`true` or `false`), `null` (nothing),\
    \ collections of values, and objects. Representing a number value in a way that\
    \ we can see is simple, and we use a number character. Representing a boolean\
    \ value is also simple and we can use `true`/`false` or `0`/`1`. If you are familiar\
    \ with the concept of objects, you will understand that representing an object\
    \ is no easy or simple matter. If you aren't familiar with the concept of objects,\
    \ that is OK too.\n\n## Data Types\n\nIn programming, the concept of an object\
    \ is similar to how you would describe a real-world object, such as your shoes.\
    \ You could describe your shoes with attributes or properties such as color, style,\
    \ brand, and the type of insole. Some of these attribute values could be a number,\
    \ such as shoe size, and others could be a boolean (`true`/`false`) such as \"\
    has laces.\" [Example 2-1](#text00004.html_shoe_example) shows an example.\n\n\
    ### Example: Describing Shoes with JSON\n\n##### Example 2-1. Using JSON to describe\
    \ the shoes I'm wearing right now\n\n```\n {\n    \"brand\": \"Crocs\",\n    \"\
    color\": \"pink\",\n    \"size\": 9,\n    \"hasLaces\": false\n}\n```\n\nDon't\
    \ be concerned just yet about the syntax in the shoe example; we will arrive there\
    \ later in this chapter. The main point of the shoe example is that you (even\
    \ a human) can literally read the attributes of my shoe. The data type for my\
    \ JSON shoe example is object. The literal value of the object exposes the properties\
    \ or attributes in a way which we can see (and read). These attributes or properties\
    \ of the shoe object are represented as name-value pairs.\n\nJSON is based on\
    \ JavaScript object literals. The key phrase here is \"based on.\" In JavaScript\
    \ (and most programming languages with objects), the object can include a function.\
    \ So not only could I represent the properties of my shoe with the JavaScript\
    \ object, but I could create a function called `walk`.\n\nHowever, data interchange\
    \ is about data, so JSON does not include the functions of JavaScript object literals.\
    \ The way that JSON is based on JavaScript object literals is purely in the syntactic\
    \ representation of the object literal and its properties. This representation\
    \ of properties is achieved with name-value pairs.\n\n## Name-Value Pairs\n\n\
    The concept of name-value pairs is widespread in computing. They are called by\
    \ other names as well: key-value pairs, attribute-value pairs, and field-value\
    \ pairs. In this book, we will refer to them as name-value pairs.\n\nIf you are\
    \ familiar with the concept of name-value pairs, JSON will seem natural to you.\
    \ If you aren't familiar with name-value pairs, that's OK too. Let's take a quick\
    \ look at name-value pairs.\n\nIn a name-value pair, you first declare the name.\
    \ For example, `animal`. Now, pair implies two things: a name and a value. So\
    \ let's give our name (in this case, `animal`) a value. To simplify this concept\
    \ for this chapter, let's use a string value. With name-value pairs in JSON, the\
    \ value can also be a number, a boolean, `null`, an array, or an object. We will\
    \ go more in depth with the other value data types beyond string in [Chapter 3](#text00005.html_chapter_jsondatatypes).\
    \ So, for this name-value pair, which has the name `animal`, we will use the string\
    \ value `cat`:\n\n```\n \"animal\" : \"cat\"\n```\n\n`animal` is the name and\
    \ `cat` is the value. There are many ways that we could choose to delimit, or\
    \ separate, the name and the value. If I were to provide you with a directory\
    \ of a company's employees with their job titles, I'd probably hand you a list\
    \ that looks something like this:\n\n* Bob Barker, Chief Executive Officer\n*\
    \ Janet Jackson, Chief Operations Officer\n* Mr. Ed, Chief Financial Officer\n\
    \nFor my employee directory, I used commas to separate my job titles (names) and\
    \ employee names (values). I also placed the value on the left and the name on\
    \ the right.\n\nJSON uses the colon character (`:`) to separate the names and\
    \ values. The name is always on the left and the value is always on the right.\
    \ Let's take a look at a few more:\n\n```\n \"animal\" : \"horse\"\n\n\"animal\"\
    \ : \"dog\"\n```\n\nSimple, right? A name and a value, and you have a name-value\
    \ pair.\n\n## Proper JSON Syntax\n\nNow let's take a look at what proper JSON\
    \ syntax entails. The name, which in our example is `animal`, is always surrounded\
    \ in double quotes. The name in the double quotes can be any valid string. So,\
    \ you could have a name that looks like this, and it would be perfectly valid\
    \ JSON:\n\n```\n \"My animal\": \"cat\"\n```\n\nYou can even place an apostrophe\
    \ in the name:\n\n```\n \"Lindsay's animal\": \"cat\"\n```\n\nNow that you know\
    \ that this is valid JSON, I'm going to tell you why you shouldn't do this. The\
    \ name-value pairs used in JSON are a friendly data structure to many systems.\
    \ Having a space or special character (other than a–z, 0–9) in the name would\
    \ not be taking `portability` into consideration. In [Chapter 1](#text00003.html_chapter_whatisjson),\
    \ we defined this key term as \"transferring information between platforms in\
    \ a way that is compatible with both systems.\" We can do things in our JSON data\
    \ that decrease portability; therefore, we say it is important to avoid spaces\
    \ or special characters for `maximum portability`.\n\nThe name in the name-value\
    \ pair of your JSON, if it is to be loaded in memory by a system as an object,\
    \ will become a \"property\" or \"attribute.\" A property or attribute in some\
    \ systems can include an underscore character (`_`) or numbers, but in most cases\
    \ it is considered good form to stick to the characters of the alphabet, A–Z or\
    \ a–z. So, if I wanted to include multiple words in my name, I would format like\
    \ so:\n\n```\n \"lindsaysAnimal\": \"cat\"\n```\n\nor\n\n```\n \"myAnimal\": \"\
    cat\"\n```\n\nThe `cat` value in the example has double quotes. Unlike the name\
    \ in the name-value pair, the value does not always have double quotes. If our\
    \ value is a string data type, we must have double quotes. In JSON, the remaining\
    \ data types are number, boolean, array, object, and `null`. These will not be\
    \ surrounded in double quotes. The format of these will be covered in [Chapter\
    \ 3](#text00005.html_chapter_jsondatatypes).\n\nJSON stands for JavaScript Object\
    \ Notation. So, the only thing we are missing is the syntax that makes it an object.\
    \ We need curly brackets surrounding our name-value pair to make it an object.\
    \ So, one before...\n\n```\n { \"animal\" : \"cat\" }\n```\n\n...and one after.\
    \ When you are formatting your JSON, picture a knighting ceremony where the master\
    \ of the ceremony dubs the new knight on the shoulders with a sword. You are the\
    \ master of the ceremony, and you must dub your JSON as an object on each side\
    \ with a curly bracket. \"I dub thee, sir JSON.\" The ceremony would not be complete\
    \ without a tap on each shoulder.\n"
