  trans: "\n## 数据类型概述\n\n在不同的编程语言中，那些\"一成不变的\"数据类型通常被称为原始数据类型，或该语言的内置类型。这意味着类型的定义以及可以用它做什么是不可改变的。编程语言不会允许你重新定义两个数相加的含义。这些原始数据类型因语言而异，并且通常会在前述列表中添加一些类型，比如字节、引用（或指针，或句柄）。\n\
    \n除了原始数据类型外，大多数编程语言中还会使用其他数据类型。这些通常被称为复合数据类型，因为它们是原始数据类型的融合或组合。复合数据类型就像沙堡一样，有其结构。如果我们把沙堡拆开，可以看到它是用沙子、树枝和水建造的。如果我们把复合数据类型的结构拆开，会发现它是由原始数据类型构成的。\n\
    \n复合数据类型的一个常见例子是枚举数据类型。之前，我提到了按字母顺序对列表进行排序。单词列表在不同的编程语言中可以用不同的数据类型表示（例如列表或数组）。如果我们拆开这个数据结构，会发现它是由原始数据类型（字符或`strings`）构成的。枚举数据类型是一种可以枚举的数据结构。我可以逐一提及结构中的每个元素，也可以计算它们的数量。参见示例\
    \ 3-1。\n\n##### 示例 3-1. \"让我列举你人格中的优点\"可以用编程中的数组字面量来表示\n\n```\n [\n    \"witty\"\
    ,\n    \"charming\",\n    \"brave\",\n    \"bold\"\n]\n```\n\n你不需要理解这个例子中的数组字面量数据结构，就能看到我们可以逐一提及这些\"\
    优点\"，并且确定它们有四个。\n\n另一种复合数据类型是对象数据类型。在第 2 章中，我们探讨了对象数据类型，因为 JavaScript Object Notation（JSON）基于\
    \ JavaScript 的对象字面量表示法。此外，我用 JSON 描述了我当时穿的鞋子（参见示例 3-2）。\n\n##### 示例 3-2. 用 JSON\
    \ 描述的我的鞋子\n\n```\n {\n    \"brand\": \"Crocs\",\n    \"color\": \"pink\",\n  \
    \  \"size\": 9,\n    \"hasLaces\": false\n}\n```\n\n这个对象字面量让我们看到，这里的对象数据类型由名称-值对组成。如果我们解构这个数据结构，会发现它由原始数据类型组成：`string`、`number`\
    \ 和 `boolean`。我们名称-值对中的名称（`\"brand\"`、`\"color\"`、`\"size\"`、`\"hasLaces\"`）都是\
    \ `string` 数据类型。值 `\"Crocs\"` 和 `\"pink\"` 都是 `string` 数据类型。值 `9` 是 `number` 数据类型。值\
    \ `false` 是 `boolean` 数据类型。\n\n## JSON 数据类型\n\n虽然编程语言在复合类型方面可能有所不同，甚至在附加的原始类型方面也略有差异，但大多数语言都共享我在本章前面提到的那些原始类型：\n\
    \n- 数字（例如 5 或 5.09）\n  - 整数\n  - 浮点数\n  - 定点数\n- 字符和 `strings`（例如 \"a\" 或 \"A\"\
    \ 或 \"apple\"）\n- 布尔值（即 true 或 false）\n\n对象数据类型是一种在一些较流行的编程语言（如 Java 和 C#）中常见的数据结构，但并非所有语言都有。JSON\
    \ 基于对象字面量表示法和对象数据类型，你可能会认为这对于数据交换格式来说是个问题。毕竟，数据格式的目标是在两个不同系统之间进行通信，并且公共基础应该在该格式中表达。记住，复合数据类型对象的数据结构可以解构为原始类型。即使对于没有对象数据类型的编程语言，一旦将对象数据结构解构为这些原生类型，它就非常友好了。\n\
    \nJSON 数据类型有：\n\n- `Object`\n- `String`\n- `Number`\n- `Boolean`\n- `Null`\n-\
    \ `Array`\n\n## JSON 对象数据类型\n\nJSON 对象数据类型很简单。JSON 的根是一个对象。它是一个用花括号包围的名称-值对列表。当你在\
    \ JSON 中创建一个也是对象的名称-值对时，你的 JSON 就会开始呈现嵌套。在示例 3-3 中，这通过用嵌套对象描述一个人来说明。\n\n#####\
    \ 示例 3-3. 嵌套对象\n\n```\n {\n    \"person\": {\n        \"name\": \"Lindsay Bassett\"\
    ,\n        \"heightInInches\": 66,\n        \"head\": {\n            \"hair\"\
    : {\n                \"color\": \"light blond\",\n                \"length\":\
    \ \"short\",\n                \"style\": \"A-line\"\n            },\n        \
    \    \"eyes\": \"green\"\n        }\n    }\n}\n```\n\n这里的顶层名称-值对是 `person`，其值是一个对象。这个对象有三个名称-值对：`\"\
    name\"`、`\"heightInInches\"` 和 `\"head\"`。`\"name\"` 名称-值对有一个 `string` 类型的值 `\"\
    Lindsay Bassett\"`。`\"heightInInches\"` 名称-值对有一个 `number` 类型的值。`\"head\"` 名称-值对有一个对象值。`\"\
    hair\"` 名称-值对也有一个对象值，包含三个 `string` 数据类型的名称-值对：`\"color\"`、`\"length\"` 和 `\"style\"\
    `。`\"head\"` 对象还有一个 `\"eyes\"` 名称-值对，值为 `\"green\"`。\n\n## JSON 字符串数据类型\n\n之前我们在本书中简要探讨过\
    \ JSON 字符串数据类型，以动物/猫为例：\n\n```\n { \"animal\" : \"cat\" }\n```\n\n值 `\"cat\"`\
    \ 是 `string` 数据类型。在现实世界中，除非这条数据是给宠物店的，否则数据中的字符串值不会那么简单。即使是宠物店，它的数据中也可能不止一个像 \"\
    cat\" 这样的单词。也许这家店想传递最新促销活动的详情：\n\n> 今天在 Bob's Best Pets，您购买小狗时可获得免费的 8 盎司 Bill's\
    \ Kibble 样品袋。在结账时只需说\"Bob's the best!\"。\n\nJSON 字符串可以由任何 Unicode 字符组成，促销文本中的所有字符都是有效的。字符串值必须始终用*双*引号包围。\n\
    \n在第 2 章的\"故事：JSON 的双引号\"中，我提到用单引号包围字符串值是无效的（参见示例 3-4）。\n\n##### 示例 3-4. 这不是有效的\
    \ JSON\n\n```\n {\n    'title': 'This is my title.',\n    'body': 'This is the\
    \ body.'\n}\n```\n\n这可能会让人困惑，特别是如果你过去见过使用单引号的 JavaScript 对象字面量。在 JavaScript 中，我们可以交替使用单引号或双引号。但是，重要的是要记住\
    \ JSON 不是 JavaScript 对象字面量；它只是*基于* JavaScript 对象字面量。在 JSON 中，只允许使用双引号来包围字符串值。\n\
    \n上一章还提到了 JSON 如何被解析器读取。在解析器眼中，当一个值以双引号（`\"`）开头时，它期望一段文本，并以另一个双引号结束。如果文本字符串中包含双引号，则会产生问题。\n\
    \n例如，假设我们正在开展一项宠物店促销活动，顾客需要在结账时说\"Bob's the best!\"才能获得一袋免费狗粮。如果我们使用示例 3-5 中的代码，就会遇到问题，因为我们不能简单地用双引号包围促销数据。\n\
    \n##### 示例 3-5. 此代码无法工作\n\n```\n {\n    \"promo\": \"Say \"Bob's the best!\" at\
    \ checkout for free 8oz bag of kibble.\"\n}\n```\n"
- fmt: "\nThere are quotes inside of the value, and the parser is going to read that\
    \ first quote character in front of “Bob” in the promotional text as the end of\
    \ the string. Then, when the parser finds the remainder of the text just hanging\
    \ out there and not belonging to a name-value pair, it will produce an error.\
    \ To deal with this, we must escape our quote inside of any string value by preceding\
    \ it with a backslash character (`\\`), as shown in [Example 3-6](#text00005.html_ex3-6_backslash)\
    \ .\n\n### Example 3-6. Using a backslash character to escape quotes inside of\
    \ strings fixes the problem\n\n```\n {\n    \"promo\": \"Say \\\"Bob's the best!\\\
    \" at checkout for free 8oz bag of kibble.\"\n}\n```\n\nThis backslash character\
    \ will tell the parser that the quote is not the end of the string. Once the parser\
    \ actually loads the string into memory, any backslash character that precedes\
    \ a quote character will be removed and the text will come out on the other side\
    \ as intended.\n\nQuotes are not the only thing that need escaping when it comes\
    \ to the JSON string. Because the backslash character is used to escape other\
    \ characters, we must also escape the backslash. For example, the JSON shown in\
    \ [Example 3-7](#text00005.html_ex3_7_comm), which is meant to communicate the\
    \ location of my *Program Files* directory, will produce an error. To fix this\
    \ problem, we must escape the backslash character by adding another backslash\
    \ character, as shown in [Example 3-8](#text00005.html_ex3_8_anotherbackslash)\
    \ .\n\n### Example 3-7. The backslash used in this code will throw an error\n\n\
    ```\n {\n    \"location\": \"C:\\Program Files\"\n}\n```\n\n### Example 3-8. The\
    \ backslash character must be escaped with another backslash character\n\n```\n\
    \ {\n    \"location\": \"C:\\\\Program Files\"\n}\n```\n\nIn addition to the double\
    \ quote and backslash characters, you must escape the following characters:\n\n\
    * `\\/` (forward slash)\n* `\\b` (backspace)\n* `\\f` (form feed)\n* `\\t` (tab)\n\
    * `\\n` (new line)\n* `\\r` (carriage return)\n* `\\u` followed by hexadecimal\
    \ characters (e.g., the smiley emoticon, `\\u263A`)\n\nThe JSON shown in [Example\
    \ 3-9](#text00005.html_ex3_9_parserError) will produce a parser error because\
    \ the tab and new line characters must be escaped. [Example 3-10](#text00005.html_ex3_10_fix)\
    \ shows how to fix the problem.\n\n### Example 3-9. The tab and new line characters\
    \ used in this JSON will cause an error\n\n```\n {\n    \"story\": \"\\t Once\
    \ upon a time, in a far away land \\n there lived a princess.\"\n}\n```\n\n###\
    \ Example 3-10. JSON with tab and new line characters escaped\n\n```\n {\n   \
    \ \"story\": \"\\\\t Once upon a time, in a far away land \\\\n there lived a\
    \ princess.\"\n}\n```\n\n# The JSON Number Data Type\n\nNumbers are a common piece\
    \ of information to pass around in data. Inventory, money, latitude/longitude,\
    \ and Earth’s mass are all data that can be represented as numbers; see [Example\
    \ 3-11](#text00005.html_ex3_11_data) .\n\n### Example 3-11. Representing numbers\
    \ in JSON\n\n```\n {\n    \"widgetInventory\": 289,\n    \"sadSavingsAccount\"\
    : 22.59,\n    \"seattleLatitude\": 47.606209,\n    \"seattleLongitude\": -122.332071,\n\
    \    \"earthsMass\": 5.97219e+24\n}\n```\n\nA number in JSON can be an integer,\
    \ decimal, negative number, or an exponent.\n\nMy widget inventory is 289\\. Inventory\
    \ is typically represented by an integer (or whole number). I don’t typically\
    \ sell a half of something, so my inventory number will never include a decimal\
    \ point.\n\nMy sad savings account contains $22.59\\. Though some programming\
    \ languages do have a data type for money, we typically represent money in JSON\
    \ as a decimal number and omit the $.\n\nIf you take a look at the latitude and\
    \ longitude for the City of Seattle, you will see they are both decimal numbers,\
    \ and the longitude is a negative decimal number. Negative numbers are represented\
    \ with the standard minus sign character preceding the number.\n\nAdditionally,\
    \ I’m representing the very large number of Earth’s mass in kg using E Notation.\
    \ E Notation is particularly great for scientific data and is a supported number.\n\
    \n# The JSON Boolean Data Type\n\nIn the English language, two of the simplest\
    \ answers we have for questions are “yes” or “no.” If you ask your friend the\
    \ question, “Would you like toast with your eggs?”, he will answer “yes” or “no.”\n\
    \nIn computer programming, the boolean data type is simple. It is either true\
    \ or false. If you ask your computer, “Would you like toast with your eggs?”,\
    \ it will answer “true` or “false.”\n\nIn some programming languages, the literal\
    \ value for `true` can be `1`, and `0` for false. Sometimes the literal value\
    \ characters use casing — for example, `True` or `TRUE`. In JSON, the literal\
    \ value for `true` can be `true`. Any other casing will produce an error. \n\n\
    In [Example 3-12](#text00005.html_ex3_12), the boolean value is `false`:\n\n```\n\
    \ {\n    \"toastBreakfast\": false,\n    \"Lunch\": false\n}\n```\n\nIn [Example\
    \ 3-13](#text00005.html_ex3_14), the boolean value is `true`:\n\n```\n {\n   \
    \ \"freckleCount\": 1,\n    \"hairy\": true\n}\n```\n\n# The JSON Null Type\n\n\
    When we have nothing, we use `null`. In JSON, `null` is a value that represents\
    \ an empty value or no value. It is not the same as `0` or `false`.\n\n`null`\
    \ is often used to indicate that a variable exists but has no value. For example,\
    \ if a user hasn't provided a phone number, we might set that field to `null`.\n\
    \n```\n {\n    \"phoneNumber\": null\n}\n```\n\n# The JSON Array Data Type\n\n\
    Now let’s explore the array data type. If you aren’t familiar with arrays, that’s\
    \ OK. Let’s take a quick look at what an array is.\n\nImagine a container that\
    \ holds a dozen eggs. The container has 12 compartments for eggs. When I first\
    \ bought the eggs, there were 12\\. This would be an array of size 12, containing\
    \ 12 eggs. See [Example 3-15](#text00005.html_ex3_15) .\n\n### Example 3-15. This\
    \ is an array of strings (for the sake of simplicity, I will use the string “egg”\
    \ for each of the eggs in the compartments)\n\n```\n {\n    \"eggCarton\": [\n\
    \        \"egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\",\n    \
    \    \"egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\",\n        \"\
    egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\"\n    ]\n}\n```\n\n\
    Notice that I have a name-value pair. The name is `\"eggCarton\"` and the value\
    \ is an array. The array is always surrounded in square brackets (`[]` ). Inside\
    \ the array, we have a list, and each list item is separated by a comma. This\
    \ might look similar to how we format our name-value pairs, but the key difference\
    \ is that it is a list of only values. These values can be any of the valid JSON\
    \ data types (string, number, object, boolean, array, and null).\n\nNow suppose\
    \ I take out two eggs to make myself eggs over easy with toast for breakfast.\
    \ My egg carton still has 12 compartments, but two eggs are missing. See [Example\
    \ 3-16](#text00005.html_example_3_16) .\n"
