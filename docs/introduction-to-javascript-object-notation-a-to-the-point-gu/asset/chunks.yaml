  trans: "\n\n在关系型数据库中，我们需要修改地址表的模式（schema）以支持此手机字段。我们还可能决定删除账户表中的字段，并将电话号码移动到单独的表中。\n\
    \n使用 CouchDB，我们的数据允许演进，而无需修改模式。我可以轻松地在 JSON 中将电话号码表示为对象数组（示例 8-4 )），并允许账户拥有其真实拥有的数量电话记录。\n\
    \n### 示例 8-4. 电话对象数组\n\n```json\n {\n  \"phoneNumbers\": [\n    {\n      \"description\"\
    : \"home phone\",\n      \"number\": \"555-555-5555\"\n    },\n    {\n      \"\
    description\": \"cell phone\",\n      \"number\": \"123-456-7890\"\n    },\n \
    \   {\n      \"description\": \"fax\",\n      \"number\": \"456-789-1011\"\n \
    \   }\n  ]\n}\n```\n\n如果未来某个账户获得了一个新号码，我们只需要将其添加到数组中，如 示例 8-5 所示。\n\n### 示例 8-5.\
    \ 电话对象数组增加新的“太空电话”\n\n```json\n {\n  \"phoneNumbers\": [\n    {\n      \"description\"\
    : \"home phone\",\n      \"number\": \"555-555-5555\"\n    },\n    {\n      \"\
    description\": \"cell phone\",\n      \"number\": \"123-456-7890\"\n    },\n \
    \   {\n      \"description\": \"fax\",\n      \"number\": \"456-789-1011\"\n \
    \   },\n    {\n      \"description\": \"space phone\",\n      \"number\": \"932-932-932\"\
    \n    }\n  ]\n}\n```\n\n此外，如果账户记录中需要一个新字段，例如“galaxy（系）”，我们只需将其添加到所有未来的记录中（示例 8-6\
    \ )）。不需要修改模式。\n\n### 示例 8-6. 在账户记录中添加“galaxy”字段\n\n```json\n {\n  \"firstName\"\
    : \"Octavia\",\n  \"lastName\": \"Wilson\",\n  \"age\": 26,\n  \"addresses\":\
    \ [\n    {\n      \"street\": \"123 fake st\",\n      \"city\": \"Somewhere\"\
    ,\n      \"state\": \"OR\",\n      \"zip\": 97520\n    }\n  ],\n  \"galaxy\":\
    \ \"Milky Way\"\n}\n```\n\n数据以 JSON 文档的形式进出 CouchDB 数据库。现在的问题是，我们如何存入数据，以及如何取出数据？CouchDB\
    \ 使用 HTTP 作为 API。让我们来看看 CouchDB API。\n\n# CouchDB API\n\n使用 CouchDB，我们向数据库请求数据的方法是通过\
    \ HTTP 请求资源。通过 HTTP，我们使用 URL 发资源请求。我们从 CouchDB 请求的资源是一个 JSON 文档 (`application/json`)。如果我在本地有一个名为\
    \ `accounts` 的数据库，我可以使用 URL `http://localhost:5984/accounts` 获取有关该数据库的信息。示例 8-7\
    \ 关于账户的信息以 JSON 格式返回。\n\n### 示例 8-7. 来自 http://localhost:5984/accounts 的响应\n\n\
    ```json\n {\n    \"db_name\": \"accounts\",\n    \"doc_count\": 3,\n    \"doc_del_count\"\
    : 0,\n    \"update_seq\": 7,\n    \"compact\": false,\n    \"disk_size\": 28773,\n\
    \    \"data_size\": 1248,\n    \"instance_start_time\": \"14324934775860\",\n\
    \    \"disk_version\": 6,\n    \"committed_update_seq\": 7```\n\n注意 `\"doc_count\"\
    ` 键值对，它指定了数据库中有多少个文档，可以通过 URL `http://localhost:5984/accounts/unique` 查询数据库中的每个文档。如果我不知道文档的标识符，可以使用\
    \ URL `http://localhost:5984/accounts/_all_docs` 获取数据库中每个文档的标识符数组。示例 8-8 `http://localhost:5984/accounts/_all_docs`\
    \ \n\n### 示例 8-8. 文档数组\n\n```json\n {\n    \"total_rows\": 3,\n    \"offset\"\
    : 0,\n    \"rows\": [\n        {\n            \"id\": \"3636fa3c71f9dd4f7407bd6f700052\"\
    ,\n            \"key\": \"3636fa3c71f9dd4f7407bd6f700052\",\n            \"value\"\
    : {\n                \"rev\": \"1-8a9527cbfc22e2894df3a3e603265\"\n          \
    \  }\n        },\n        {\n            \"id\": \"ddc14ef7139646f530f8801538\"\
    ,\n            \"key\": \"ddc14ef7139646f530f8801538\",\n            \"value\"\
    : {\n                \"rev\": \"1-3aef6faefff90dac5d6440ceb\"\n            }\n\
    \        },\n        {\n            \"id\": \"c14ef7139646f530f88019ea\",\n  \
    \          \"key\":\": \"c14ef7139646f530f88019ea\",\n            \"value\": {\n\
    \                \"rev\": \"5-c38761b81edaf9842a6357492bd738\"\n            }\n\
    \        }\n    ]\n}```\n\n如果我从这个数组中获取第一个标识符 (`3636fa3c71f9dd4f7407bd6f700052`)，我就可以构造一个\
    \ URL 来请求该文档 示例 8-9 )。\n\n### 示例 8-9. URL http://localhost:5984/accounts/3636fa3c71f9dd4f7407bd6f700052\
    \ 代表账户的 JSON 资源\n\n```json\n {\n    \"_id\": \"3636fa3c71f9dd4f7407bd6f700052\"\
    ,\n    \"_rev\": \"1-8a9527cbfc22e2894df3a3e603265\",\n    \"firstName\": \"Billy\"\
    ,\n    \"lastName\": \"Bob\",\n    \"address\": {\n        \"street\": \"123 another\
    \ st\",\n        \"city\": \"Somewhere\",\n        \"state\": \"OR\",\n      \
    \  \"zip\": \"97501\"\n    },\n    \"age\": 54,\n    \"gender\": \"male\",\n \
    \   \"famous\": false\n}\n\n我们已经看到了如何从 CouchDB 数据库请求数据。现在让我们来看看如何交付数据。\n\n如果我想向我的\
    \ accounts 数据库添加另一个账户文档，我可以通过向 URL `http://localhost:5984/accounts/` 发送 POST 请求（参见示例\
    \ 8-10 和 8-11 )）。\n\n### 示例 8-10. 请求的 HTTP Header (http://localhost:5984/accounts/)\n\
    \n```\nPOST /accounts/\nHost: localhost:5984\nContent-Type: application/json\n\
    Cache-Control: no-cache\n```\n\n### 示例 8-11. http://localhost:5984/\n\n```json\n\
    \ {\n    \"firstName\": \"Janet\",\n    \"lastName\": \"Jackson\",\n    \"address\"\
    : {\n        \"street\": \"456 Fakey Fake st\",\n        \"city\": \"Somewhere\"\
    ,\n        \"state\": \"CA\",\n        \"zip\": \"96520\"\n    },\n    \"age\"\
    : 54,\n    \"gender\": \"female\",\n    \"famous\": true\n}\n```\n\n### 注意\n\n\
    如果你使用 Chrome 浏览器，请在 Chrome 应用商店查看“Postman”。Postman 为你提供了一个简单的界面来构建 HTTP 请求（`GET`、`POST`、`DELETE`\
    \ 等）。\n\n在 HTTP 请求成功后，CouchDB API 将以 JSON 格式交付响应，其中包含新生成的 示例 8-12 )。\n\n### 示例\
    \ 8-12. 来自 http://localhost:5984/ 的 JSON 响应\n\n```json\n {\n    \"ok\": true,\n\
    \    \"id\": \"3636fa3c71f9dd4f7407bd6f700052\",\n    \"rev\": \"1-36f3b4bf90183781d08fe22487f3c90\"\
    \n}```\n\n我现在可以使用新的标识符构造 URL 来请求 JSON 文档 示例 8-13 )。\n\n### 示例 8-13. URL http://localhost:5984/accounts/3636fa3c71f9dd4f7407bd6f70007c\
    \ 的资源\n\n```json\n {\n    \"_id\": \"3636fa3c71f9dd4f7407bd6f70007c\",\n    \"\
    _rev\": \"1-36f3b4bf90183781d08fe22487f3c90\",\n    \"firstName\": \"Janet\",\n\
    \    \"lastName\": \"Jackson\",\n    \"address\": {\n        \"street\": \"456\
    \ Fakey Fake st\",\n        \"city\": \"Somewhere\",\n        \"state\": \"CA\"\
    ,\n        \"zip\": \"96520\"\n    },\n    \"age\": 54,\n    \"gender\": \"female\"\
    ,\n    \"famous\": true\n}\n```\n\n"
- fmt: "\n### Example 8-14. Response after posting the updated JSON document to `http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c`\n\
    \n```\n {\n    \"ok\": true,\n    \"id\": \"3636fa3c716f9dd4f7407bd6f700076c\"\
    ,\n    \"rev\": \"3-29ede949ceed9df62bd7caecb095bffe\"\n}\n```\n\nIf I want to\
    \ delete a document, I use the HTTP `DELETE` method and pass the revision identifier\
    \ into the URL as a query string parameter ([Example 8-15](#text00010.html_ex0815)).\n\
    \n### Example 8-15. `rev` is communicated as a query string parameter\n\n```\n\
    \ http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c?\n       rev=3-29ede949ceed9df62bd7caecb095bffe\n\
    ```\n\nIf I request the resource at URL `http://localhost:5984/accounts/` once\
    \ more, it will now show that there are four documents ([Example 8-16](#text00010.html_ex0816)).\n\
    \n### Example 8-16. JSON document at URL `http://localhost:5984/accounts/`; the\
    \ `doc_count` name-value pair now has a value of 4\n\n```\n {\n    \"db_name\"\
    : \"accounts\",\n    \"doc_count\": 4,\n    \"doc_del_count\": 0,\n    \"update_seq\"\
    : 8,\n    \"purge_seq\": 0,\n    \"compact_running\": false,\n    \"disk_size\"\
    : 32869,\n    \"data_size\": 1560,\n    \"instance_start_time\": \"1432493477586600\"\
    ,\n    \"disk_format_version\": 6,\n    \"committed_update_seq\": 8\n}\n```\n\n\
    These examples showed how we can view and create the JSON documents that are stored\
    \ in a \\`CouchDB\\` database. If this were all we could do, we would quickly\
    \ run into problems. Perhaps I need a list of last names that only includes famous\
    \ people. In \\`CouchDB\\`, we can achieve this with “views.” See [Example 8-17](#text00010.html_ex0817).\n\
    \nViews are how we can restructure and query the data from a \\`CouchDB\\` database.\
    \ The views are stored in a JSON document called a design document. The design\
    \ document specifies the language, and may include multiple views.\n\n### Example\
    \ 8-17. A \\`CouchDB\\` design document for the accounts database that includes\
    \ a view for famous people\n\n```\n {\n   \"_id\": \"_design/lists\",\n   \"_rev\"\
    : \"8-4124de7756277c6a937004a763d6247d\",\n   \"language\": \"javascript\",\n\
    \   \"views\": {\n       \"famous\": {\n           \"map\": \"function(doc){if(doc.lastName!==null&&doc.famous){emit\n\
    \           (doc.lastName,null)}}\"\n       }\n   }\n}\n```\n\nEach view is an\
    \ object that may contain a \\`map\\` and \\`reduce\\` function. In [Example 8-17](#text00010.html_ex0817),\
    \ there is only a \\`map\\` function. The \\`map\\` function takes each document\
    \ as a parameter, and then the `emit()` function is called. This essentially transforms\
    \ the data ([Example 8-18](#text00010.html_ex0818)).\n\n### Example 8-18. A closer\
    \ look at the \\`map\\` function for the \\`famous\\` view\n\n```\n function(doc)\
    \ {\n    if (doc.lastName !== null && doc.famous) {\n        emit(doc.lastName,\
    \ null)\n    }\n}\n```\n\nIn [Example 8-18](#text00010.html_ex0818), the function\
    \ checks each JSON document in the database to make sure we have a last name,\
    \ and that the name-value pair for \\`\"famous\"\\` is true. The parameters for\
    \ `emit()` are \\`key\\` and \\`value\\`, and these will display as name-value\
    \ pairs in the transformed document result.\n\nI can then request this view as\
    \ a resource via the URL `http://localhost:5984/accounts/_design/lists/_view/famous`\
    \ (see [Example 8-19](#text00010.html_ex0819)). The structure is \\`/<db-name>/_design/<design_document_name>/_view/<view_name>/\\\
    `.\n\n### Example 8-19. The resource at URL `http://localhost:5984/accounts/_design/lists/_view/famous`\n\
    \n```\n {\n    \"total_rows\": 2,\n    \"offset\": 0,\n    \"rows\": [\n     \
    \   {\n            \"id\": \"ddc14efcf71396463f53c0f880001538\",\n           \
    \ \"key\": \"Barker\",\n            \"value\": null\n        },\n        {\n \
    \           \"id\": \"3636fa3c716f9dd4f7407bd6f700076c\",\n            \"key\"\
    : \"Jackson\",\n            \"value\": null\n        }\n    ]\n}\n```\n\nIn addition\
    \ to the \\`map\\` step, you may optionally \\`reduce\\` the results. \\`CouchDB\\\
    ` has three built-in \\`reduce\\` functions: \\`_count\\`, \\`_sum\\`, and \\\
    `_stats\\`. These are useful after transforming the data with the \\`map\\` step\
    \ to retrieve statistical information on your data set.\n\nFor example, I may\
    \ want information on how many accounts there are based on gender. I can add a\
    \ new view to my design document (see [Example 8-20](#text00010.html_ex0820)).\n\
    \n### Example 8-20. The design document with an addition of a \\`gender_count\\\
    ` view\n\n```\n {\n   \"famous\": {\n       \"map\": \"function(doc){if(doc.lastName!==null&&doc.famous){emit\n\
    \       (doc.lastName,null)}}\"\n   },\n   \"gender_count\": {\n       \"map\"\
    : \"function(doc){if(doc.gender!==null) emit(doc.gender);}\",\n       \"reduce\"\
    : \"_count\"\n   }\n}\n```\n\nIn the \\`map\\` step for the \\`gender_count\\\
    ` view, the function is emitting the value from the \\`gender\\` name-value pair.\
    \ Without the \\`reduce\\` step, this would produce an array of objects that have\
    \ the gender value for \\`key\\` (see [Example 8-21](#text00010.html_ex0821)).\n\
    \n### Example 8-21. The \\`gender_count\\` view after the \\`map\\` step\n\n```\n\
    \ {\n    \"total_rows\": 4,\n    \"offset\": 0,\n    \"rows\": [\n        {\n\
    \            \"id\": \"3636fa3c716f9dd4f7407bd6f700076c\",\n            \"key\"\
    : \"female\",\n            \"value\": null\n        },\n        {\n          \
    \  \"id\": \"ddc14efcf71396463f53c0f8800019ea\",\n            \"key\": \"female\"\
    ,\n            \"value\": null\n        },\n        {\n            \"id\": \"\
    3636fa3c716f9dd4f7407bd6f7000552\",\n            \"key\": \"male\",\n        \
    \    \"value\": null\n        },\n        {\n            \"id\": \"ddc14efcf71396463f53c0f880001538\"\
    ,\n            \"key\": \"male\",\n            \"value\": null\n        }\n  \
    \  ]\n}\n```\n\nAfter the \\`reduce\\` step with the built-in \\`_count\\` function,\
    \ we get a result that provides a count of all the records (see [Example 8-22](#text00010.html_ex0822)).\n\
    \n### Example 8-22. Resource at URL `http://localhost:5984/accounts/_design/lists/_view/gender_count`\n\
    \n```\n {\n    \"rows\": [\n        {\n            \"key\": null,\n          \
    \  \"value\": 4\n        }\n    ]\n}\n```\n\nWhat we are looking for is a count\
    \ for each unique gender, so we need to pass in the \\`group\\` flag to group\
    \ the results by key. To achieve this, we add a query string parameter \\`?group=true\\\
    ` to the URL (see [Example 8-23](#text00010.html_ex0823)).\n\n### Example 8-23.\
    \ Resource at URL `http://localhost:5984/accounts/_design/lists/_view/gender_count?group=true`\n\
    \n```\n {\n    \"rows\": [\n        {\n            \"key\": \"female\",\n    \
    \        \"value\": 2\n        },\n        {\n            \"key\": \"male\",\n\
    \            \"value\": 2\n        }\n    ]\n}\n```\n\nWith the \\`CouchDB\\`\
    \ API, we can create any number of design documents and views for a database.\
    \ Each of the views within the design documents optionally contain a \\`map\\\
    ` and \\`reduce\\` function to transform the data. We can then create our custom\
    \ set of URL resources for transformed data sets from our stored JSON documents.\
    \ Essentially, we can build our own custom API for our data with the \\`CouchDB\\\
    ` API.\n\n# Key Terms and Concepts\n\nThis chapter covered the following key terms:\n\
    \nRelational Database\n\n> A type of database that is structured to recognize\
    \ relationships in the stored data.\n\nNoSQL Database\n\n> A type of database\
    \ that is *not* structured on relationships in the stored data.\n\n\\`CouchDB\\\
    `\n\n> A document store type of NoSQL database that stores data in the form of\
    \ JSON documents.\n\nWe also discussed these key concepts:\n\n*   In a relational\
    \ database, there are usually tables, columns, and rows, and relationships between\
    \ each of those tables, columns, and rows. There are primary keys and foreign\
    \ keys.\n\n*   There are many types of NoSQL databases that break away from the\
    \ relational model.\n\nWe also discussed \\`CouchDB\\`. Here are some key points\
    \ to remember:\n\n*   It is a document store type of NoSQL database.\n\n*   It\
    \ stores and manages JSON documents.\n\n*   It maintains the structure of the\
    \ data as it is stored and retrieved.\n\n*   It uses an HTTP API for accessing\
    \ data as JSON document resources.\n\n*   It uses JavaScript as its query language\
    \ with the map and reduce functions for views that can be accessed through the\
    \ HTTP API.\n\n# Chapter 9. JSON on the Server Side\n\nWhen we talk about web\
    \ client–server relationships, we can categorize technologies as client side or\
    \ server side:\n"
