    ##### Example 9-3. The resulting JSON from the serialization of the ASP.NET CustomerAccount\
    \ object\n\n```\n {\n    \"firstName\": \"Bob\",\n    \"lastName\": \"Barker\"\
    ,\n    \"phone\": \"555-555-5555\",\n    \"addresses\": [\n        {\n       \
    \     \"street\": null,\n            \"city\": \"Somewhere\",\n            \"\
    state\": \"CA\",\n            \"zip\": 96520\n        },\n        {\n        \
    \    \"street\": null,\n            \"city\": \"Some Place\",\n            \"\
    state\": \"CA\",\n            \"zip\": 96538\n        }\n    ],\n    \"famous\"\
    : true\n}\n```\n\n### Deserializing JSON\n\nWe can deserialize JSON back into\
    \ an ASP.NET object with one line of code ([Example 9-4](#text00011.html_ex0904)\
    \ ).\n\n##### Example 9-4. The deserialization of the JSON string from the earlier\
    \ example; it is deserialized to the specified type, “CustomerAccount”\n\n```\n\
    \ CustomerAccount customerAccount = \n    JsonConvert.DeserializeObject<CustomerAccount>(json);\n\
    ```\n\nJson.NET gives us the ability to deserialize our JSON into a specific type\
    \ of object, such as the `CustomerAccount` object from the example. With this,\
    \ our data can retain its shape as it moves in and out of the server-side code.\
    \ However, it is important that our object property names match up with the names\
    \ of the name-value pairs in our JSON document. Otherwise, deserialization will\
    \ fail.\n\n### Requesting JSON\n\nTo make an HTTP request for a resource, I can\
    \ use the built-in ASP.NET `System.Net.WebClient` class. With this class, I can\
    \ call the `DownloadString` method to download the requested resource from a specified\
    \ URL as a string (see Examples [9-5](#text00011.html_ex0905) and [9-6](#text00011.html_ex0906)\
    \ ).\n\n##### Example 9-5. Downloading a JSON address document as a string from\
    \ my local CouchDB addresses database\n\n```\n using(var webClient = new WebClient())\n\
    {\n    string json = webClient.DownloadString(\"3636fa3c716f9dd4f7407bd6f700076c\"\
    );\n}\n```\n\n##### Example 9-6. The JSON resource at the URL http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c\n\
    \n```\n {\n    \"_id\": \"3636fa3c716f9dd4f7407bd6f700076c\",\n    \"_rev\": \"\
    2-e04207c11104e06b3a8f030f14c35580\",\n    \"address\": {\n        \"street\"\
    : \"456 Fakey Fake st\",\n        \"city\": \"Somewhere\",\n        \"state\"\
    : \"CA\",\n        \"zip\": \"96520\"\n    },\n    \"age\": 54,\n    \"gender\"\
    : \"female\",\n    \"famous\": true,\n    \"firstName\": \"Janet\",\n    \"lastName\"\
    : \"Jackson\"\n}\n```"
