  trans: "\n在 JSON 中，多个键值对之间用逗号分隔。因此，为了扩展 `animal/cat` 示例，我们来添加一个颜色：\n\n```\n { \"\
    animal\" : \"cat\", \"color\" : \"orange\" }\n```\n\n观察 JSON 语法的另一种方法是从读取它的机器的视角来看待。与人类不同，机器是极其死板的、以规则和指令为导向的生物。当你在字符串值（未被引号包围）之外使用以下任何字符时，你实际上是在提供的一条关于如何读取你的数据的指令：\n\
    \n*   `{`（左大括号）表示“开始对象”\n*   `}`（右大括号）表示“结束对象”\n*   `[`（左方括号）表示“开始数组”\n*   `]`（右方括号）表示“结束数组”\n\
    *   `:`（冒号）表示“分隔键值对中的名称和值”\n*   `,`（逗号）表示“分隔对象中的键值对”或“分隔数组中的值”；也可以理解为“这里还有下一个”\n\
    \n如果你忘记用右大括号表示“结束对象”，那么你的对象将不会被识别为对象。如果你在键值对列表的末尾放置逗号，你给出了“这里还有下一个”的指令，但却没有提供后续内容。因此，保持语法正确至关重要。\n\
    \n# 语法验证\n\n与机器不同，作为一个使用键盘的人类，产生错误就像漏掉一次按键一样简单。令人惊讶的是，我们产生的错误并没有比想象中得多。验证 JSON\
    \ 是处理 JSON 工作的重要组成部分。\n\n你的集成开发环境 (IDE) 可能对你的 JSON 有了内置的验证功能。如果你的 IDE 支持插件和加载项，如果那里还没有集成，你可能可能会在那里找到一个验证工具。如果你不使用\
    \ IDE，或者不知道我在说什么，那也没关系。\n\n有很多在线工具可以用于格式化和验证 JSON。在你的搜索引擎中快速搜索“JSON 验证”，你就能得到几个结果。这里有几个值得提及的：\n\
    \n[JSON 格式化与验证器](http://jsonformatter.curiousconcept.com/)\n\n> 一个具有多种选项的格式化工具，以及可以突出错误的漂亮界面。处理后的\
    \ JSON 显示在一个窗口中，该窗口既可以作为树/节点风格可视化工具，也可以从那里复制/粘贴你格式化后的代码。\n\n[JSON 编辑器](https://www.jsoneditoronline.org/)\n\
    \n> 一个用于 JSON 的全功能验证、格式化和可视化工具。错误指示会显示在错误所在的行。验证后，会显示有用的解析错误信息。可视化工具以树/节点格式显示你的\
    \ JSON。\n\n[JSONLint](http://jsonlint.com/)\n\n> 一个不带花哨的 JSON 验证工具。只需复制、粘贴并点击“validate”。它还会贴心地为你格式化你的\
    \ JSON。这些这些是用于*语法验证*的工具。稍后在第 4 章中，我们将讨论另一种类型的验证，一致性验证（conformity validation）。语法验证关注的是\
    \ JSON 本身的格式，而一致性验证关注的是独特的数据结构。对于示例 2-5，语法验证关注的是我们的 JSON 是否正确（被大括号包围，用逗号分隔键值对）。一致性验证关注的是我们的数据是否包含了名称、品种和年龄。此外，一致性验证还会关注年龄的值是否为数字，以及名称的值是否为字符串。\n\
    \n### 示例 2-5.验证示例\n\n```\n {\n    \"name\": \"Fluffy\",\n    \"breed\": \"Siamese\"\
    ,\n    \"age\": 2\n}\n```\n\n# JSON 作为文档\n\n你可能会发现，在未来使用 JSON 的过程中，你只是在代码中创建它，并在一个只能通过开发者工具检查的不可见世界中传递。然而，作为一种数据交换格式，JSON\
    \ 可以成为自己的文档并存在于文件系统中。JSON 的扩展名很容易记忆：`.json`。\n\n所以，如果我将 `animal/cat` JSON 保存为文件并存储在计算机上，它看起来像这样：`C:\\\
    animals.json`。\n\n# JSON MIME 类型\n\n当你向他人传递数据时，通常需要提前告诉他们数据是什么类型。你可能会听到这被称为互联网媒体类型、内容类型（content\
    \ type）或 MIME 类型。这种类型格式为 `type`/`subtype`。你可能已经听过的一种类型是 `text/html`。\n\nJSON 的\
    \ MIME 类型是 `application/json`。\n\n互联网分配号码机构 (IANA) 维护着[一份全面的媒体类型列表](http://www.iana.org/assignments/media-types/media-types.xhtml)。\n\
    \n# 术语与概念\n\n本章涵盖了以下关键术语：\n\n**字面量 (Literal)**\n> 按照其预期意图精确编写的值。\n\n**变量 (Variable)**\n\
    > 一个可以更改并由标识符（如 `x`）表示的值。\n\n**最大可移植性（在数据交换中）**\n> 通过确保数据本身在系统或平台之间兼容，从而超越数据格式的基本可移植性。\n\
    \n**键值对 (Name-value pair)**\n> 键值对（或称为 key-value pair）是具有名称和对应值的属性或特性。\n\n**语法验证\
    \ (Syntax validation)**\n> 关注 JSON 格式的验证。\n\n**一致性验证 (Conformity validation)**\n\
    > 关注独特数据结构的验证。\n\n我们讨论了这些概念：\n\n*   `{`（左大括号）表示“开始对象”\n*   `}`（右大括号）表示“结束对象”\n\
    *   `[`（左方括号）表示“开始数组”\n*   `]`（右方括号）表示“结束数组”\n*   `:`（冒号）表示“分隔键值对中的名称和值”\n*  \
    \ `,`（逗号）表示“分隔对象中的键值对”或“分隔数组中的值”；也可以理解为“这里还有下一个”\n*   `.json` 是扩展名。\n*   `application/json`\
    \ 是媒体类型。\n"
- fmt: "\n## Data Types Overview\n\nIn different programming languages, the types\
    \ of data that are \"set in stone\" are often referred to as the primitive data\
    \ types, or the built-in types, of that language. This means that the definition\
    \ of the type and what can be done with it is unchangeable. The programming language\
    \ isn't going to allow you to redefine what it means to add two numbers together.\
    \ These primitive data types vary from language to language, and will often include\
    \ additions to the preceding list, such as a byte or reference (or pointer, or\
    \ handler).\n\nBeyond the primitive data types, there are other data types that\
    \ are used in most programming languages. These are often referred to as composite\
    \ data types, because they are a fusion, or compound, of the primitive data types.\
    \ Composite data types, like a sandcastle, have a structure to them. If we took\
    \ apart the sandcastle, we could see that the structure was built with sand, sticks,\
    \ and water. If we took apart the data structure of a composite data type, we\
    \ would find that it was built with our primitive data types.\n\nOne example of\
    \ a composite data type that is commonly used in programming languages is an enumeration\
    \ data type. Earlier, I mentioned the sorting of a list alphabetically. A list\
    \ of words could be represented with different data types in different programming\
    \ languages (e.g., a list or an array). If we took apart this data structure,\
    \ we would find that it is made up of the primitive data types of characters or\
    \ `strings`. The enumeration data type is a data structure that you can enumerate.\
    \ I can mention each thing in the structure one by one and I can also count how\
    \ many there are. See [Example 3-1](#text00005.html_ex_arrayLiteral).\n\n#####\
    \ Example 3-1. \"Let me enumerate the fine qualities of your personality\" could\
    \ be represented in programming as an array literal\n\n```\n [\n    \"witty\"\
    ,\n    \"charming\",\n    \"brave\",\n    \"bold\"\n]\n```\n\nYou don't need to\
    \ understand the array literal data structure in this example to see that we can\
    \ mention each of these \"fine qualities\" one by one, and also establish that\
    \ there are four of them.\n\nAnother composite data type is the object data type.\
    \ In [Chapter 2](#text00004.html_chapter_jsonsyntax), we explored the object data\
    \ type, because JavaScript Object Notation is based on the object literal notation\
    \ of JavaScript. Additionally, I used JSON to describe the shoes I was wearing\
    \ (see [Example 3-2](#text00005.html_ex3-2_shoes)).\n\n##### Example 3-2. My shoe\
    \ described in JSON\n\n```\n {\n    \"brand\": \"Crocs\",\n    \"color\": \"pink\"\
    ,\n    \"size\": 9,\n    \"hasLaces\": false\n}\n```\n\nThis object literal allows\
    \ us to see that the object data type here is made up of name-value pairs. If\
    \ we were to deconstruct this data structure, we would see that it is made up\
    \ of the primitive data types: `string`, `number`, and `boolean`. Our names (`\"\
    brand\"`, `\"color\"`, `\"size\"`, `\"hasLaces\"`) in our name-value pairs are\
    \ all `string` data types. The values `\"Crocs\"` and `\"pink\"` are both of the\
    \ `string` data type. The value `9` is of the `number` data type. The value `false`\
    \ is of the `boolean` data type.\n\n## JSON Data Types\n\nThough programming languages\
    \ may vary when it comes to composite types, and even a little when it comes to\
    \ additional primitive types, most share those primitive types I mentioned earlier\
    \ in the chapter:\n\n- Numbers (e.g., 5 or 5.09)\n  - Integer\n  - Floating-point\
    \ number\n  - Fixed-point number\n- Characters and `strings` (e.g., \"a\" or \"\
    A\" or \"apple\")\n- Booleans (i.e., true or false)\n\nThe object data type is\
    \ a data structure that is common to some of the more popular programming languages,\
    \ such as Java and C#, but not all. With JSON being based on object literal notation\
    \ and the object data type, you'd think this would be problematic for a data interchange\
    \ format. After all, the goal of a data format is communicating between two different\
    \ systems and common ground should be expressed in that format. Remember that\
    \ the data structure that is the composite data type object can be deconstructed\
    \ into the primitive types. Even to programming languages that do not have the\
    \ object data type, once the object data structure is deconstructed into those\
    \ native types, it is quite friendly.\n\nThe JSON data types are:\n\n- `Object`\n\
    - `String`\n- `Number`\n- `Boolean`\n- `Null`\n- `Array`\n\n## JSON Object Data\
    \ Type\n\nThe JSON object data type is simple. JSON, at its root, is an object.\
    \ It is a list of name-value pairs surrounded in curly braces. When you create\
    \ a name-value pair within your JSON that is also an object, your JSON will begin\
    \ to look nested. In [Example 3-3](#text00005.html_ex3-3_nested), this is illustrated\
    \ with a person described with nested objects.\n\n##### Example 3-3. Nested objects\n\
    \n```\n {\n    \"person\": {\n        \"name\": \"Lindsay Bassett\",\n       \
    \ \"heightInInches\": 66,\n        \"head\": {\n            \"hair\": {\n    \
    \            \"color\": \"light blond\",\n                \"length\": \"short\"\
    ,\n                \"style\": \"A-line\"\n            },\n            \"eyes\"\
    : \"green\"\n        }\n    }\n}\n```\n\nThe top-level name-value pair here is\
    \ `person`, with the value of an object. This object has three name-value pairs:\
    \ `\"name\"`, `\"heightInInches\"`, and `\"head\"`. The `\"name\"` name-value\
    \ pair has a `string` value of `\"Lindsay Bassett\"`. The `\"heightInInches\"\
    ` name-value pair has a `number` value. The `\"head\"` name-value pair has an\
    \ object value. The `\"hair\"` name-value pair has an object value as well, with\
    \ three `string` data typed name-value pairs: `\"color\"`, `\"length\"`, and `\"\
    style\"`. The `\"head\"` object also has an `\"eyes\"` name-value pair with a\
    \ value of `\"green\"`.\n\n## JSON String Data Type\n\nWe briefly explored the\
    \ JSON string data type earlier in this book with the animal/cat example:\n\n\
    ```\n { \"animal\" : \"cat\" }\n```\n\nThe value `\"cat\"` has a `string` data\
    \ type. In the real world, unless this data is for a pet shop, the string values\
    \ in the data won't be quite as simple. Even a pet shop might have more to say\
    \ in its data than a single word like \"cat.\" Perhaps the shop wants to pass\
    \ along the details of its latest promotion:\n\n> Today at Bob's Best Pets you\
    \ can get a free 8 oz. sample bag of Bill's Kibble with your purchase of a puppy.\
    \ Just say \"Bob's the best!\" at checkout.\n\nThe JSON string can be comprised\
    \ of any of the Unicode characters, and all the characters in that promotional\
    \ text are valid. A string value must always be surrounded in *double* quotes.\n\
    \nIn [\"A Story: The Double Quotes of JSON\"](#text00004.html_astory_sidebar)\
    \ in [Chapter 2](#text00004.html_chapter_jsonsyntax), I mentioned that single\
    \ quotes around a string value are not valid ([Example 3-4](#text00005.html_ex3-4_invalidjson)).\n\
    \n##### Example 3-4. This is not valid JSON\n\n```\n {\n    'title': 'This is\
    \ my title.',\n    'body': 'This is the body.'\n}\n```\n\nThis can be confusing,\
    \ especially if you've seen JavaScript object literals in the past that use single\
    \ quotes. In JavaScript, we are allowed to use single quotes or double quotes\
    \ interchangeably. However, it is important to remember that JSON is not a JavaScript\
    \ object literal; it is only *based on* JavaScript object literals. In JSON, only\
    \ double quotes are allowed for surrounding a string value.\n\nAlso mentioned\
    \ in the previous chapter was how JSON is read by a parser. In the eyes of a parser,\
    \ when a value begins with a double quote (`\"`), it expects a string of text\
    \ that will be ended by another double quote. This poses a problem if the string\
    \ of text contains double quotes in it.\n\nFor example, suppose we're running\
    \ a pet shop promotion where customers need to say \"Bob's the best!\" at checkout\
    \ to receive a free bag of kibble. If we use the code in [Example 3-5](#text00005.html_ex3-5_problem),\
    \ we would run into a problem, because we can't simply surround the promotional\
    \ data in double quotes.\n\n##### Example 3-5. This code won't work\n\n```\n {\n\
    \    \"promo\": \"Say \"Bob's the best!\" at checkout for free 8oz bag of kibble.\"\
    \n}\n```\n"
