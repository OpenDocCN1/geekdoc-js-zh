  trans: "\n\n# AngularJS 学习曲线与数据绑定\n\n## 引言\n\nAngularJS 可能有陡峭的学习曲线，特别是对于那些已经使用 JavaScript\
    \ 和 HTML 文档对象模型 (DOM) 操作多年的人来说。它需要改变与 DOM 交互的思维方式。AngularJS 试图将 DOM 操作与应用程序逻辑解耦。\n\
    \n这种 DOM 操作的解耦可以通过比较我们在没有 AngularJS 框架和有 AngularJS 框架的情况下如何实现相同目标来表达。例如，我需要将页面上的消息从通用的\"\
    你好，陌生人\"（示例 7-8）更改为用户登录时的个性化问候（示例 7-9）。在 JavaScript 中，我们通过操作 DOM 来实现这一点。\n\n##\
    \ 比较 DOM 操作与 AngularJS 数据绑定\n\n### 示例 7-8：用户未登录时的 HTML 消息\n\n```html\n<h1 id=\"\
    message\">Hello, stranger!</h1>\n```\n\n### 示例 7-9：如果用户已登录则更改消息的 JavaScript\n\n\
    ```javascript\nif (signedIn) {\n    var message = \"Hello, \" + userName + \"\
    !\";\n    document.getElementById(\"message\").innerHTML = message;\n}\n```\n\n\
    ## AngularJS 数据绑定\n\n在 AngularJS 中，由于 HTML 是我们的视图，我们设置它以准备数据模型的变化（示例 7-10）。\n\n\
    ### 示例 7-10：带有 AngularJS 属性和数据绑定语法的 HTML 视图\n\n```html\n<body ng-app=\"myApp\"\
    >\n    <div id=\"wrapper\" ng-controller=\"myAppController\">\n        <h1 id=\"\
    message\">Hello {{ userData.userName }}!</h1>\n    </div>\n</body>\n```\n\nHTML\
    \ 标签（`<body>` 和 `<div>`）上的\"ng-app\"和\"ng-controller\"属性是设置视图以支持数据绑定的语法。数据绑定正是它的字面意思：我们通过一系列占位符将数据\"\
    绑定\"到页面。AngularJS 语法使用\"手柄\"作为这些占位符，用于绑定数据。这些手柄是两个左花括号（`{{`）和两个右花括号（`}}`），包围占位符的语法（在示例\
    \ 7-10 中为 `userData.userName`）。\n\n在示例 7-11 中，带有 `userData` 对象的 JavaScript 控制器被添加到全局作用域；这允许视图（HTML）使用该对象进行数据绑定。\n\
    \n### 示例 7-11：userData 对象添加到全局作用域\n\n```javascript\nangular.module('myApp', [])\n\
    \    .controller('myAppController', function($scope) {\n        $scope.userData\
    \ = { userName : \"Stranger\" };\n        if(signedIn)\n        {\n          \
    \  $scope.userData = { userName : \"Bob\" };\n        }\n    });\n```\n\n在 AngularJS\
    \ JavaScript 控制器文件中，不是操作 DOM，而是操作数据模型。被操作的数据模型是 `userData` 对象。纯 JavaScript/HTML\
    \ 示例和 Angular 示例都实现了相同的功能。对于我的简单示例，Angular 方式可能看起来更费力，特别是对于一个抽象工具来说。然而，当你深入到一个复杂的应用程序（如允许用户对其用户信息执行创建、读取、更新和删除（CRUD）操作的页面）时，Angular\
    \ 方式简化了开发。\n\n示例 7-11 展示了一个用于数据模型的 JavaScript 对象 `userData`。AngularJS 通过在 MVC\
    \ 架构中使用 JavaScript 对象作为模型来利用它们。众所周知，JSON 是 JavaScript 对象字面量的表示法。那么 JSON 在 AngularJS\
    \ 中扮演什么角色？\n\n要问的问题是：\"我们的数据模型从哪里来？\"在示例代码中，我的数据模型被硬编码到控制器中。如果我们回到数字百科全书的例子，我们知道数据必须存储在某个地方。当数据被存储时，它通常存储在某种数据库中。\n\
    \n我们如何将这些数据放入单页 Web 应用程序的数据模型中取决于开发人员。在 AngularJS 数据模型中，从数据库获取数据到数据模型最常见的方式是使用\
    \ JSON。这通常是通过 HTTP 请求的 JSON 资源，一种客户端-服务器关系。AngularJS 利用这种关系，通过核心 AngularJS 服务\
    \ `$http` 轻松检索数据模型。\n\n在示例 7-12 中，AngularJS `$http` 用于从 OpenWeatherMap API 获取天气数据；JSON\
    \ 作为名为 `weatherData` 的对象添加到全局作用域。响应显示在示例 7-13 中。\n\n## 数据模型与 JSON\n\n### 示例 7-12：从\
    \ OpenWeatherMap API 获取天气数据\n\n```javascript\nangular.module('myApp', [])\n  \
    \  .controller('myAppController', function($scope, $http) {\n        $http.get('http://api.openweathermap.org/data/2.5/weather?lat=35&lon=139').\n\
    \            success(function(data, status, headers, config) {\n             \
    \   $scope.weatherData = data;\n            });\n    });\n```\n\n### 示例 7-13：OpenWeatherMap\
    \ API 的 JSON 响应\n\n```json\n{\n    \"coord\": {\n        \"lon\": 139,\n     \
    \   \"lat\": 35\n    },\n    \"sys\": {\n        \"message\": 0.0099,\n      \
    \  \"country\": \"JP\",\n        \"sunrise\": 1431805135,\n        \"sunset\"\
    : 1431855710\n    },\n    \"weather\": [\n        {\n            \"id\": 800,\n\
    \            \"main\": \"Clear\",\n            \"description\": \"sky is clear\"\
    ,\n            \"icon\": \"02n\"\n        }\n    ],\n    \"base\": \"stations\"\
    ,\n    \"main\": {\n        \"temp\": 291.116,\n        \"temp_min\": 291.116,\n\
    \        \"temp_max\": 291.116,\n        \"pressure\": 1020.61,\n        \"sea_level\"\
    : 1028.58,\n        \"grnd_level\": 1020.61,\n        \"humidity\": 95\n    },\n\
    \    \"wind\": {\n        \"speed\": 1.51,\n        \"deg\": 339.501\n    },\n\
    \    \"clouds\": {\n        \"all\": 8\n    },\n    \"dt\": 1431874405,\n    \"\
    id\": 1851632,\n    \"name\": \"Shuzenji\",\n    \"cod\": 200\n}\n```\n\n来自 OpenWeatherMap\
    \ API 的 JSON 被 AngularJS `$http` 反序列化。在它作为名为 `weatherData` 的对象添加到全局作用域后，它成为我们的数据模型，我们可以在\
    \ HTML 视图中使用手柄语法绑定它。\n\n在示例 7-14 中，在手柄语法内部，被绑定的数据是天气描述。天气描述在 weather 属性中，它包含一个对象数组，只有一个值。我用\
    \ `weather[0]` 选择索引 0 处的值，然后是属性 `description`。\n\n### 示例 7-14：绑定天气描述\n\n```html\n\
    <body ng-app=\"myApp\">\n    <div id=\"wrapper\" ng-controller=\"myAppController\"\
    >\n        <div>\n            {{ weatherData.weather[0].description }}\n     \
    \   </div>\n    </div>\n</body>\n```\n\n在撰写本章时，天气是\"天空晴朗\"。我可以让这个单页应用程序每 60 秒更新一次，以提供当前天气的描述。HTTP\
    \ 请求将在后台发生，数据模型更新将自动更改 HTML 视图。人类不需要发起此请求；这一切都可以在后台进行。此外，使用 MVC 概念，我编写的 JavaScript\
    \ 代码不必更改 DOM。更新数据模型会自动更新视图。\n\nAngularJS 在其模型-视图-控制器架构中利用 JavaScript 对象和 JSON。jQuery\
    \ 通过简单的函数支持 JSON 请求和解析。数据交换格式的成功很大程度上取决于数据交换者的支持。在 Web 的客户端-服务器关系中，我们可以看到 JSON\
    \ 被 JavaScript 及其强大的抽象工具所支持。在第 8 章和第 9 章中，我们将看到 JSON 在该关系的服务器端如何被支持和使用。\n\n##\
    \ 关键术语和概念\n\n本章涵盖以下关键术语：\n\n抽象\n\n> 一种处理复杂系统的技术，涉及专注于该系统的较小区域。\n\n框架\n\n> 一种节省时间并允许专注于构建功能的抽象工具。\n\
    \n`jQuery.parseJSON()`\n\n"
- fmt: "\n> A function that not only uses the `JSON.parse()` function, but uses a\
    \ fallback for older browsers that doesn’t support `JSON.parse()` and handles\
    \ the security hole of evaluating a string by validating characters.\n\n`jQuery.getJSON()`\n\
    \n> Shorthand for the `jquery.ajax()` function and parsing the JSON into a JavaScript\
    \ object all in one.\n\nSingle-page web applications\n\n> Web pages that break\
    \ away from the traditional multipage approach to create a more seamless application\
    \ experience.\n\nModel-view-controller (MVC)\n\n> An architectural pattern that\
    \ divides an application into three components: the model (data), the view (presentation),\
    \ and the controller (updates the model and view).\n\nAngularJS\n\n> An MVC JavaScript\
    \ framework that uses JavaScript objects as the data model.\n\nWe also discussed\
    \ these key concepts:\n\n*   jQuery is an abstraction tool that *supports* JSON\
    \ by cutting down on production time for requesting and parsing data. Additionally,\
    \ it handles browser-version support issues.\n\n*   With the AngularJS MVC concept:\n\
    \n    *   JSON is the model (or data model).\n\n    *   HTML is the view and uses\
    \ syntax for data binding with the model.\n\n    *   Controllers are the Angular\
    \ JavaScript files and syntax for defining and handling the interactions with\
    \ the model and the view.\n\n*   AngularJS *leverages* JavaScript objects and\
    \ JSON in its MVC architecture.\n\n# Chapter 8. JSON and NoSQL\n\n## Introduction\n\
    \nWe live in the 'information age' where vast amounts of data and knowledge are\
    \ easily accessible. We can query for information on a specific subject like 'naked\
    \ mole-rat' on sites like Wikipedia. The information on 'naked mole-rat' has to\
    \ be stored somewhere, and that somewhere is ultimately a database.\n\n## Relational\
    \ Databases\n\nIf you've worked with a database in the past and are familiar with\
    \ SQL, you were most likely working with a *relational database*. Relational databases\
    \ are structured with tables, columns, and rows. Each table is representative\
    \ of something, such as an account. The table representing an account may have\
    \ a relationship with a table that represents addresses for accounts. A key in\
    \ each table, such as a column that contains an account identifier, forms a relationship\
    \ between the two tables.\n\nTo create, manipulate, and query these relational\
    \ databases, we use *Structured Query Language (SQL)*. With SQL, I can query for\
    \ columns and rows from one or more tables of the database ([Example 8-1](#text00010.html_ex0801)).\n\
    \n### Example 8-1\n\nA simple SQL query that will return columns and rows for\
    \ AccountID, FirstName, and LastName from the Account table\n\n```sql\nSELECT\
    \ accountId, firstName, lastName \nFROM Account\n```\n\nWith the relationships\
    \ between the tables in a relational database, I may also query columns and rows\
    \ from multiple tables ([Example 8-2](#text00010.html_ex0802)).\n\n### Example\
    \ 8-2\n\nA query joining two tables together; this will return columns and rows\
    \ for first name, last name, street address, and zip code of all accounts and\
    \ their related addresses\n\n```sql\nSELECT Account.firstName, Account.lastName,\
    \ Address.street, Address.zip  \nFROM Account \nJOIN Address \nON Account.accountId\
    \ = Address.accountId\n```\n\n## NoSQL Databases\n\nThe \"NoSQL\" title given\
    \ to a database tells us that it is not a relational database. We cannot use SQL\
    \ to ask the database for columns and rows of tables joined together. What the\
    \ title does not tell us is *what it is*. It simply says, \"I've found an alternative\
    \ way to store data that is not relational.\" Naturally, there is more than one\
    \ \"alternative way.\"\n\nThe NoSQL databases out in the world today vary in nature\
    \ as much as a tiger from an elephant. These types of databases vary in nature\
    \ because data has different sizes, shapes, and purposes. The creators of these\
    \ NoSQL databases realized this and thus created homes for data to be stored and\
    \ retrieved that break away from the traditional relational mold.\n\n## Key-Value\
    \ Store\n\nOne example of a NoSQL database is a *key-value store*. The key-value\
    \ store models simple data as key-value pairs. If we were to take the English\
    \ dictionary and make a database out of it, it could fit well in a key-value store.\
    \ Each word could be a key, and each definition could be a value. This type of\
    \ database is a great alternative to the overhead of a relational database for\
    \ simple data structures.\n\n## Document Store\n\nThe type of NoSQL database we\
    \ are going to explore in this chapter is a *document store*. This alternative\
    \ to a relational database structures data around the concept of a document rather\
    \ than representing and relating pieces of data as tables. There are currently\
    \ 20+ different document store databases being used out in the world today, some\
    \ using XML documents and others JSON documents.\n\nIn this chapter, we will take\
    \ a look at one type of document store database that uses JSON documents to store\
    \ data. Let's take a look at CouchDB.\n\n## CouchDB\n\nAs CouchDB is a NoSQL database,\
    \ it has a nonrelational way of storing data with JSON documents.\n\nLet's say\
    \ I need to store account data for customers. With a relational database, account\
    \ information could quickly span across several tables. If I needed to have more\
    \ than one address for an account, then a separate address table would be necessary\
    \ to support this one-to-many relationship.\n\nIn a relational database, a one-to-many\
    \ relationship such as an account with multiple addresses must be queried with\
    \ a join to put the data back together again. Additionally, if I were to query\
    \ the database for a single account and all of its address records joined, the\
    \ results would contain multiple rows. Each row would have a repeat of the same\
    \ account fields, with a different address for each row. Thus, the structure of\
    \ the data exists inside of the database, but is flattened into columns and rows\
    \ when queried.\n\nWith CouchDB, the relationships within the data do not require\
    \ the data to be separated for storage and reassembled later for reading. The\
    \ relationships are expressed within the data, and the structure is maintained\
    \ as the data moves in and out of the database.\n\nIn [Example 8-3](#text00010.html_ex0803),\
    \ the one-to-many relationship of account addresses is represented as objects\
    \ in an array.\n\n### Example 8-3\n\nA JSON document representing an account\n\
    \n```json\n{\n  \"firstName\": \"Bob\",\n  \"lastName\": \"Barker\",\n  \"age\"\
    : 91,\n  \"addresses\": [\n    {\n      \"street\": \"123 fake st\",\n      \"\
    city\": \"Somewhere\",\n      \"state\": \"OR\",\n      \"zip\": 97520\n    },\n\
    \    {\n      \"street\": \"456 fakey ln\",\n      \"city\": \"Some Place\",\n\
    \      \"state\": \"CA\",\n      \"zip\": 96026\n    }\n  ]\n}\n```\n\nWith the\
    \ CouchDB document store, when I ask the database for an account, I get a structured\
    \ document in return. There is no assembly required. This is both convenient and\
    \ faster.\n\nHowever, a document store is not a one-size-fits-all solution for\
    \ data storage. This model can quickly turn troublesome if multiple associations\
    \ are needed. What if I wanted to have relationships between cities, states, and\
    \ zip codes for an address? As soon as these relationships are needed, then the\
    \ relational model would better suit the data, as it would be difficult to express\
    \ complex relationships within a single document.\n\nAnother thing that CouchDB\
    \ does well is the facilitation of evolving data. Some data evolves over time.\
    \ For example, in 1990, I could have probably gotten away with these fields for\
    \ phone numbers in a record for an account:\n\n*   Home Phone\n*   Work Phone\n\
    *   Fax\n\nNow that we aren't in 1990, we need a field for a mobile phone. The\
    \ data needs to evolve.\n"
