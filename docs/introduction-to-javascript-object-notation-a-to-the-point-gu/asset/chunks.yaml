  trans: "\n\n# 字面量与 JSON\n\n## 变量与字面量\n\n在编程中，“literal”（字面）一词是一个名词。`literal`（字面量）是用数据直接字面表示的值。它的编写方式与其预期的解释方式完全一致。如果你不熟悉编程概念，这可能看起来很奇怪。让我们快速看一眼字面量。\n\
    \n你钱包里带的是现金还是借记卡？当我在三明治店停下，给收银员递一张五美元钞票买三明治时，我亲眼看着我的五美元离开了钱包。当我刷借记卡支付三明治的钱钱时，我知道我的银行账户里少了五美元，尽管我没有看到这个过程的发生。\n\
    \n在编程中，我们经常使用变量来表示值。例如，我可能会在一个表达式中使用一个名为 `x` 的 `variable`：\n\n```\n x = 5 \n```\n\
    \n然后，之后，我可能想给 `x` 再加五：\n\n```\n x = x + 5 \n```\n\n此时，我们知道 `x` 的值是 10，但我们并没有*看到*\
    \ 10。在这个例子中，`x` 是变量，而 5 是字面量。在我们三明治店的例子中，我们可以说现金现金是一个字面量，而借记卡是一个变量。当我们*看到*实际的值时，它就是一个字面量值。\n\
    \n在 \"`x` = 5”的例子中，5 是数字字面量。数字是一种数据类型。其他类型的数据有字符串（由字符组成）、布尔值（`true` 或 `false`）、`null`（无）、值集合和对象。以我们能看到的方式表示数字值是简单的，我们使用数字字符。表示布尔值也很简单，我们可以使用\
    \ `true`/`false` 或 `0`/`1`。如果你熟悉对象的概念，你就会理解表示一个对象并不是一件容易或简单的事。如果你不熟悉对象的概念，那也没关系。\n\
    \n## 数据类型\n\n在编程中，对象的概念与你描述现实世界中的物体（例如你的鞋）的方式相似。你可以通过属性或特性（properties）来描述你的鞋，例如颜色、款式、品牌和鞋垫的类型。这些属性值中的一些可以是一个数字（例如鞋码），另一些可以是布尔值（`true`/`false`），例如“有鞋带”。示例\
    \ 2-1 展示了一个例子。\n\n### 示例：用 JSON 描述我现在的鞋\n\n##### 示例 2-1. 使用 JSON 描述我正穿的鞋\n\n```\n\
    \ {\n    \"brand\": \"Crocs\",\n    \"color\": \"pink\",\n    \"size\": 9,\n \
    \   \"hasLaces\": false\n}\n```\n\n先不要担心鞋示例中的语法；我们将在本章后面再讨论。鞋子例子的要点是你（即使是人类）可以从字面上读取我鞋的属性。我的\
    \ JSON 鞋子示例的数据类型是对象。对象的字面量值以一种我们可以看到（并读取）的方式展示了属性或特性。鞋对象的这些属性或特性以键值值对（name-value\
    \ pairs）的形式表示。\n\nJSON 基于 JavaScript 对象字面量。这里的关键短语是“基于”。在 JavaScript（以及大多数带有对象的编程语言）中，对象可以包含函数。因此，我不仅可以用\
    \ JavaScript 对象表示我鞋的属性，还可以创建一个名为 `walk` 的函数。\n\n然而，数据交换是关于数据的，因此 JSON 不包含 JavaScript\
    \ 对象字面量的函数。JSON 基于 JavaScript 对象字面量的方式纯粹现在对象字面量及其属性的语法表示上。这种对属性的表示是通过键值对来实现的。\n\
    \n## 键值对\n\n键值对的概念在计算中广泛存在。它们也有其他名称：键值对（key-value pairs）、属性-值对和字段-值对。在书中，我们将它们称为键值对。\n\
    \n如果你熟悉键值对的概念，JSON 对你来说将显得很自然。如果你不熟悉键值对，那也没关系。让我们快速看一眼键值对。\n\n在键值对中，你首先声明名称。例如，`animal`。现在，“配对”（pair）意味着两个东西：一个名字和一个值。所以，让我们给我们的名字（在这种情况下是\
    \ `animal`）赋一个值。为了简化本章的概念，让我们使用字符串值。在 JSON 的键值对中，值也可以是数字、布尔值、`null`、数组或对象。我们将在\
    \ 第 3 章 中深入讨论字符串之外的其他值数据类型。因此，对于这个名为 `animal` 的键值对，我们将使用字符串值 `cat`：\n\n```\n \"\
    animal\" : \"cat\"\n```\n\n`animal` 是名字，`cat` 是值。我们有很多方法可以选择分隔或分开名称和值。如果我给你提供一个公司员工的目录以及他们的职位，我可能会给你一个看起来像这样的列表：\n\
    \n* Bob Barker, 首席执行官\n* Janet Jackson, 首席运营官\n* Mr. Ed, 首席财务官\n\n对于我的员工目录，我使用逗号来分隔职位（名称）和员工姓名（值）。我还将值放在左侧（注：此处原文为\
    \ placed the value on the left，但示例中是值在右，此处忠实原文翻译，但逻辑上通常是键在左）。*修正：原文为 \"I also\
    \ placed the value on the left\"* 这里的逻辑。JSON 使用冒号（`:`）来分隔名称和值。名称始终在左侧，值在右侧。让我们看几个：\n\
    \n```\n \"animal\" : \"horse\"\n\n\"animal\" : \"dog\"\n```\n\n## 正确的 JSON 语法\n\
    \n现在让我们看看什么是正确的 JSON 语法包含什么。在我们的例子中，名称 `animal` 始终被双引号包围。名称可以是任何合法的字符串。所以，如果我想在名称中包含多个单词，我会这样格式化：\n\
    \n```\n \"lindsaysAnimal\": \"cat\"\n```\n\n或者\n\n```\n \"myAnimal\": \"cat\"\n\
    ```\n\n`cat` 值在示例中带有双引号。与键值对中的名称不同，值并不总是带有双引号。如果我们的值是字符串数据类型，我们必须有双引号。\n\n"
- fmt: "\nIn JSON, multiple name-value pairs are separated by a comma. So, to extend\
    \ the `animal/cat` example, let’s add a color:\n\n```\n { \"animal\" : \"cat\"\
    , \"color\" : \"orange\" }\n```\n\nAnother way to look at JSON syntax would be\
    \ through the eyes of the machine that is reading it. Unlike humans, machines\
    \ are very rigidly rule- and instruction-oriented creatures. When you use any\
    \ of the following characters outside of a string value (not surrounded in quotes),\
    \ you are providing an instruction on how your data is to be read:\n\n*   `{`\
    \ (left curly bracket) says “begin object”\n*   `}` (right curly bracket) says\
    \ “end object”\n*   `[` (left square bracket) says “begin array”\n*   `]` (right\
    \ square bracket) says “end array”\n*   `:` (colon) says “separating a name and\
    \ a value in a name-value pair”\n*   `,` (comma) says “separating a name-value\
    \ pair in an object” or “separating a value in an array”; can also be read as\
    \ “here comes another one”\n\nIf you forget to say “end object” with a right curly\
    \ bracket, then your object will not be recognized as an object. If you place\
    \ a comma at the end of your list of name-value pairs, you are giving the instruction\
    \ “here comes another one” and then not providing it. Therefore, it is important\
    \ to be correct in your syntax.\n\n# Syntax Validation\n\nUnlike machines, as\
    \ a human using a keyboard, creating an error is as simple as a missed keystroke.\
    \ It’s amazing, really, that we don’t produce more errors than we do. Validating\
    \ JSON is an important part of working with JSON.\n\nYour integrated development\
    \ environment (IDE) might have built-in validation for your JSON. If your IDE\
    \ supports plug-ins and add-ons, you might find a validation tool there if it\
    \ is not already integrated. If you don’t use an IDE, or have no idea what I’m\
    \ talking about, that’s OK too.\n\nThere are many online tools for formatting\
    \ and validating JSON. A quick jaunt on your search engine for “JSON validation”\
    \ will give you several results. Here are a few worth mentioning:\n\n[JSON Formatter\
    \ & Validator](http://jsonformatter.curiousconcept.com/)\n\n> A formatting tool\
    \ with options, and a beautiful UI that highlights errors. The processed JSON\
    \ displays in a window that doubles as a tree/node style visualization tool and\
    \ a window to copy/paste your formatted code from.\n\n[JSON Editor Online](https://www.jsoneditoronline.org/)\n\
    \n> An all-in-one validation, formatting, and visualization tool for JSON. An\
    \ error indicator is displayed on the line of the error. Upon validation, helpful\
    \ parsing error information is displayed. The visualization tool displays your\
    \ JSON in a tree/node format.\n\n[JSONLint](http://jsonlint.com/)\n\n> A no-bells-and-whistles\
    \ validation tool for JSON. Simply copy, paste, and click “validate.” It also\
    \ kindly formats your JSON.\n\nThese are tools for *syntax validation*. Later,\
    \ in [Chapter 4](#text00006.html_chapter_jsonschema), we’ll discuss another type\
    \ of validation called conformity validation. Syntax validation concerns the form\
    \ of JSON itself, whereas conformity validation concerns a unique data structure.\
    \ For [Example 2-5](#text00004.html_ex2-5_syntaxvalidation), syntax validation\
    \ would be concerned that our JSON is correct (surrounded in curly brackets, dividing\
    \ our name-value pairs with commas). Conformity validation would be concerned\
    \ that our data included a name, breed, and age. Additionally the conformity validation\
    \ would be concerned that the value of age is a number, and the value of name\
    \ is a string.\n\n### Example 2-5. Validation example\n\n```\n {\n    \"name\"\
    : \"Fluffy\",\n    \"breed\": \"Siamese\",\n    \"age\": 2\n}\n```\n\n# JSON as\
    \ a Document\n\nYou might find that in your future experiences with JSON, you\
    \ are only ever creating it in code and passing it around in an unseen world that\
    \ can only be inspected by developer tools. However, as a data interchange format,\
    \ JSON can be its own document and live in a filesystem. The file extension for\
    \ JSON is easy to remember: `.json`.\n\nSo, if I were to save my `animal/cat`\
    \ JSON to a file and store it on my computer, it would look something like this:\
    \ `C:\\animals.json`.\n\n# The JSON MediaType\n\nOftentimes when you are passing\
    \ data to someone else, you need to tell them ahead of time what type it is. You\
    \ may hear this called an Internet media type, a content type, or a MIME type.\
    \ This type is formatted as `type`/`subtype`. One type that you may have already\
    \ heard of is `text/html`.\n\nThe MIME type for JSON is `application/json`.\n\n\
    The Internet Assigned Numbers Authority (IANA) maintains [a comprehensive list\
    \ of media types](http://www.iana.org/assignments/media-types/media-types.xhtml).\n\
    \n# Key Terms and Concepts\n\nThis chapter covered the following key terms:\n\n\
    **Literal**\n> A value that is written precisely as it is meant to be interpreted.\n\
    \n**Variable**\n> A value that can be changed and is represented by an identifier,\
    \ such as `x`.\n\n**Maximum portability (in data interchange)**\n> Transcending\
    \ the base portability of the data format by ensuring the data itself will be\
    \ compatible across systems or platforms.\n\n**Name-value pair**\n> A name-value\
    \ pair (or key-value pair) is a property or attribute with a name, and a corresponding\
    \ value.\n\n**Syntax validation**\n> Validation concerned with the form of JSON.\n\
    \n**Conformity validation**\n> Validation concerned with unique data structure.\n\
    \nWe also discussed these concepts:\n\n*   `{` (left curly bracket) says “begin\
    \ object”\n*   `}` (right curly bracket) says “end object”\n*   `[` (left square\
    \ bracket) says “begin array”\n*   `]` (right square bracket) says “end array”\n\
    *   `:` (colon) says “separating a name and a value in a name-value pair”\n* \
    \  `,` (comma) says “separating a name-value pair in an object” or “separating\
    \ a value in an array”; can also be read as “here comes another one”\n*   `.json`\
    \ is the extension.\n*   `application/json` is the media type.\n\n# Chapter 3.\
    \ JSON Data Types\n\nIf you’ve already learned a programming language or two,\
    \ you likely have an understanding of data types. If not, that’s OK too. Let’s\
    \ take a quick look.\n\n## Quick Look at Data Types\n\nImagine what would happen\
    \ if you hand a little boy that knows nothing about tools a hammer, and you don’t\
    \ tell him it’s for. Property and bodily damage would likely occur. If this child\
    \ is well behaved and coordinated, we could give this child a set of instructions\
    \ for using. Instead of running around damaging things, the child would only ever\
    \ use it for hammering nails and removing them. Additionally, when you say to\
    \ the child, “Will you pass me the hammer, please?”, he doesn’t hand you the screwdriver.\n\
    \nIn computing, we most often need to know what type of data we are dealing with\
    \ because we can do different things with different types of data. I can multiply\
    \ a number by another number, but I can’t multiply a word by another number. If\
    \ I have a list of words, I can sort them alphabetically. I can’t sort the number\
    \ 5 alphabetically. So, in programming, when a method ( function) says, “Will\
    \ you pass me the number, please?”, if we know what a number is, we won’t make\
    \ the mistake of passing it the word “ketchup.”\n\nIn computer science, there\
    \ is a set of data types referred to as primitive data types. The word “primitive”\
    \ evokes imagery of Stone Age cavemen sitting around a fire grunting and sharpening\
    \ sticks. It’s not that these data types are unrefined like cavemen; rather, it’s\
    \ that they are some of the first, most basic types of data. Like modern man and\
    \ cavemen, some of the more modern and progressive data types in existence have\
    \ their roots in these primitive data types:\n\n*   Numbers (e.g., 5 or 5.09)\n\
    \    *   Integer\n    *   Floating-point number\n    *   Fixed-point number\n\
    *   Characters and strings (e.g., “a” or “A” or “apple”)\n*   Booleans (i.e.,\
    \ true or false)\n"
