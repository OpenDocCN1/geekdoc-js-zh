    \ are referred to as JavaScript libraries or tool kits. Each of them creates a\
    \ layer between the complex systems and your task at hand. Many of them allow\
    \ for easy manipulation of the HTML Document Object Model, and others are focused\
    \ on building full-fledged client-side web applications.\n\nLet’s take a look\
    \ at some JavaScript frameworks and their relationship with JSON.\n\n# jQuery\
    \ and JSON\n\n[jQuery](http://jquery.com/) is an abstraction tool that allows\
    \ developers to focus on building features by catering to manipulation of the\
    \ HTML Document Object Model (DOM). The is a convention for interacting with the\
    \ HTML page. In this model, the underlying HTML is treated as an object and a\
    \ set of nodes that can be enumerated, accessed, and manipulated.\n\nManipulation\
    \ of the DOM in JavaScript is possible without the jQuery framework. However,\
    \ there are some things developers routinely need to do with the DOM that take\
    \ several lines of code. For example, a common thing to do with the DOM is hide\
    \ an HTML element. Let’s say I have a button that I want hidden ([Example 7-1](#text00009.html_ex0701)\
    \ ).\n\n##### Example 7-1. An HTML button that displays in a web browser with\
    \ the text “My Button”\n\n```\n <button id=\"myButton\">My Button</button>\n```\n\
    \nAs shown in [Example 7-2](#text00009.html_ex0702) , to achieve the goal of hiding\
    \ the button in JavaScript, I must call the function `getElementById(`*`id`* `)`\
    \ on the HTML document object, then set the `style.display` property to `\"none\"\
    ` .\n\n##### Example 7-2. This line of JavaScript will hide the HTML button with\
    \ the id “myButton”; it will not display in the browser\n\n```\n document.getElementById(\"\
    myButton\").style.display = \"none\";\n```\n\njQuery achieves the same goal with\
    \ less than half the characters in code ([Example 7-3](#text00009.html_ex0703)\
    \ ).\n\n##### Example 7-3. This line of jQuery will hide the HTML button with\
    \ the id “myButton”; it will not display in the browser\n\n```\n $(\"#myButton\"\
    ).hide();\n```\n\nHaving to type less than half the characters to achieve the\
    \ same goal saves on production time. In addition to saving time, jQuery also\
    \ deals with Internet browser compatibility issues. For example, in [Chapter 5](#text00007.html_chapter_securityConcerns)\
    \ , I brought up `JSON.parse()` as a safer   alternative to `eval()` for parsing\
    \ JSON. In older versions of Internet Explorer, Firefox, and Chrome, `JSON.parse()`\
    \ is not supported. This means whatever feature you wrote using `JSON.parse()`\
    \ will not work for a small percentage of your users who fail to update their\
    \ browsers.\n\njQuery deals with many common version compatibility issues for\
    \ you, including the mentioned `JSON.parse()` issue. jQuery has a function for\
    \ parsing JSON: `jQuery.parseJSON` . In [Example 7-4](#text00009.html_ex0704)\
    \ , JSON is parsed with the JavaScript `JSON.parse()` . In [Example 7-5](#text00009.html_ex0705)\
    \ , JSON is parsed with the built-in jQuery function.\n\n##### Example 7-4. Parsing\
    \ JSON in JavaScript with JSON.parse()\n\n```\n var myAnimal = JSON.parse('{ \"\
    animal\" : \"cat\" }');\n```\n\n##### Example 7-5. Parsing JSON with jQuery using\
    \ jQuery.parseJSON\n\n```\n var myAnimal = jQuery.parseJSON('{ \"animal\" : \"\
    cat\" }');\n```\n\nIn the examples, you can see that the jQuery example doesn’t\
    \ appear to be saving any characters for typing. However, the `jQuery.parseJSON()`\
