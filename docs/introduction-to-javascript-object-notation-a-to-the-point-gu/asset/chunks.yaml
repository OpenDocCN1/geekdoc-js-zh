    \ new line characters escaped\n\n```\n {\n    \"story\": \"\\\\t Once upon a time,\
    \ in a far away land \\\\n there lived a princess.\"\n}\n```\n\n# The JSON Number\
    \ Data Type\n\nNumbers are a common piece of information to pass around in data.\
    \ Inventory, money, latitude/longitude, and Earth’s mass are all data that can\
    \ be represented as numbers; see [Example 3-11](#text00005.html_ex3_11_data) .\n\
    \n##### Example 3-11. Representing numbers in JSON\n\n```\n {\n    \"widgetInventory\"\
    : 289,\n    \"sadSavingsAccount\": 22.59,\n    \"seattleLatitude\": 47.606209,\n\
    \    \"seattleLongitude\": -122.332071,\n    \"earthsMass\": 5.97219e+24\n}\n\
    ```\n\nA number in JSON can be an integer, decimal, negative number, or an exponent.\n\
    \nMy widget inventory is 289\\. Inventory is typically represented by an integer\
    \ (or whole number). I don’t typically sell a half of something, so my inventory\
    \ number will never include a decimal point.\n\nMy sad savings account contains\
    \ $22.59\\. Though some programming languages do have a data type for money, we\
    \ typically represent money in JSON as a decimal number and omit the $.\n\nIf\
    \ you take a look at the latitude and longitude for the City of Seattle, you will\
    \ see they are both decimal numbers, and the longitude is a negative decimal number.\
    \ Negative numbers are represented with the standard minus sign character preceding\
    \ the number.\n\nAdditionally, I’m representing the very large number of Earth’s\
    \ mass in kg using E Notation. E Notation is particularly great for scientific\
    \ data and is a supported number.\n\n# The JSON Boolean Data Type\n\nIn the English\
    \ language, two of t he simplest answers we have for questions are “yes” or “no.”\
    \ If you ask your friend the question, “Would you like toast with your eggs?”,\
    \ he will answer “yes” or “no.”\n\nIn computer programming, the boolean data type\
    \ is simple. It is either true or false. If you ask your computer, “Would you\
    \ like toast with your eggs?”, it will answer “true” or “false.”\n\nIn some programming\
    \ languages, the literal value for `true` can be `1` , and `0` for false. Sometimes\
    \ the literal value characters use casing — for example, `True` or `TRUE` , and\
    \ `false` or `FALSE` . In JSON, the literal value for the boolean data type is\
    \ always all lowercase: `true` or `false` . Any other casing will produce an error.\
    \ In [Example 3-12](#text00005.html_preference_example) , booleans are used to\
    \ communicate data about my preferences for breakfast and lunch.\n\n##### Example\
    \ 3-12. Preferences\n\n```\n {\n    \"toastWithBreakfast\": false,\n    \"breadWithLunch\"\
    : true\n}\n```\n\n# The JSON null Data Type\n\nWhen we have nothing of something,\
    \ you might think it appropriate to say there is zero of that something. Right\
    \ now, I own zero watches. The thing is, zero is a number. This implies we were\
    \ counting in the first place.\n\nWhat if there was a standard format of describing\
    \ someone’s wrist in JSON, which included some attributes? See Examples [3-13](#text00005.html_example_bob)\
    \ and [3-14](#text00005.html_example_author) .\n\n##### Example 3-13. Next-door\
    \ neighbor Bob’s might look like this\n\n```\n {\n    \"freckleCount\": 0,\n \
    \   \"hairy\": true,\n    \"watchColor\": \"blue\"\n}\n```\n\n##### Example 3-14.\
    \ Mine would look like this\n\n```\n {\n    \"freckleCount\": 1,\n    \"hairy\"\
    : false,\n    \"watchColor\": null\n}\n```\n\nI don’t have a watch color because\
    \ I’m not wearing a watch. In programming, `null` is a way of saying zero, zilch,\
    \ and none without having to use a number. The value for watch color cannot be\
    \ defined, therefore it is `null` .\n\n`null` should not, however, be confused\
    \ with `undefined` , which you might run across in JavaScript. `undefined` is\
    \ not a JSON data type, but in JavaScript, `undefined` is what you get when you\
    \ try to access an object or a variable that does not exist at all. In JavaScript,\
    \ `undefined` has a relationship with an object or variable with both its declared\
    \ name and value not existing, and `null` has a relationship only with a value\
    \ of an object or a variable. `null` is a value that means “no value.” In JSON,\
    \ `null` must always be all lowercase characters.\n\n# The JSON Array Data Type\n\
    \nNow let’s explore the array data type. If you aren’t familiar with arrays, that’s\
    \ OK. Let’s take a quick look at what an array is.\n\nImagine a container that\
    \ holds a dozen eggs. The container has 12 available compartments for eggs. When\
    \ I first bought the eggs, there were 12\\. This would be an array of size 12,\
    \ containing 12 eggs. See [Example 3-15](#text00005.html_example3_15) .\n\n#####\
    \ Example 3-15. This is an array of strings (for the sake of simplicity, I will\
    \ use the string “egg” for each of the eggs in the compartments)\n\n```\n {\n\
    \    \"eggCarton\": [\n        \"egg\",\n        \"egg\",\n        \"egg\",\n\
    \        \"egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\",\n    \
    \    \"egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\",\n        \"\
    egg\"\n    ]\n}\n```\n\nNotice that I have a name-value pair. The name is `\"\
    eggCarton\"` and the value is an array. The array is always surrounded in square\
    \ brackets (`[]` ). Inside the array, we have a list, and each list item is separated\
    \ by a comma. This might look similar to how we format our name-value pairs, but\
    \ the key difference is that it is a list of only values. These values can be\
    \ any of the valid JSON data types (string, number, object, boolean, array, and\
    \ null).\n\nNow suppose I take out two eggs to make myself eggs over easy with\
    \ toast for breakfast. My egg carton still has 12 compartments, but two eggs are\
    \ missing. See [Example 3-16](#text00005.html_example_3_16) ."
