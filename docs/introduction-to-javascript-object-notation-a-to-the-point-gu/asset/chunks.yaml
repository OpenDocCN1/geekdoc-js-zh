    \n# 关于作者\n\n**Lindsay Bassett** 热衷于撰写和教授技术知识。她的在线技术课程和书籍都秉承“直击要点”的风格，适合忙碌的 IT\
    \ 专业人士或学生。她将每个主题提炼到基础层面，并擅长将枯燥的技术内容转化为轻松愉快的阅读体验。\n\n# 版权页\n\n"
- fmt: "\nThe animal on the cover of *Introduction to JavaScript Object Notation*\
    \ is a harbor seal (*Phoca vitulina*), a marine mammal commonly found in temperate\
    \ and arctic waters along the coastline of North America and Europe. They are\
    \ “true seals,” meaning that they have short front flippers, stout sausage-like\
    \ bodies, and no external ear flaps.\n\nEach harbor seal can be identified by\
    \ a unique pattern of spots, and coloration varies: they can be silver, gray,\
    \ brown, bluish-gray, or tan, with dark or light spots depending on the main color\
    \ of their coat. The average body length is 6 feet and weight can range from 120\
    \ to 370 pounds; females are slightly smaller than males.\n\nWhile seals may appear\
    \ clumsy when wriggling themselves onto land (known as “hauling out”), their sleek\
    \ frame and strong rear flippers make them agile and formidable in the water.\
    \ Their diet varies seasonally as they move between different feeding grounds,\
    \ but harbor seals generally eat a variety of fish, squid, crustaceans, and mollusks.\
    \ They can dive up to 1,500 feet and spend up to 40 minutes underwater, but shallow\
    \ dives lasting 3–7 minutes are more common.\n\nHarbor seals spend roughly half\
    \ their time on land — primarily to rest and regulate their temperature, but also\
    \ for social interaction and giving birth. Seals often have favorite resting and\
    \ pupping sites, but will abandon the location if it is disturbed too often by\
    \ humans. For this reason, coastal development near known seal haul-out beaches\
    \ needs to be carefully considered.\n\nHarbor seal pups are able to swim at birth,\
    \ and within a few days, can remain underwater for up to two minutes. They are\
    \ weaned after four to six weeks, but almost double their weight in this time\
    \ due to the high fat content of their mother’s milk.\n\nMany of the animals on\
    \ O’Reilly covers are endangered; all of them are important to the world. To learn\
    \ more about how you can help, go to [animals.oreilly.com](http://animals.oreilly.com).\n\
    \nThe cover image is from *Lydekker’s Royal Natural History*. The cover fonts\
    \ are URW Typewriter and Guardian Sans. The text font is Adobe Minion Pro; the\
    \ heading font is Adobe Myriad Condensed; and the code font is Dalton Maag’s Ubuntu\
