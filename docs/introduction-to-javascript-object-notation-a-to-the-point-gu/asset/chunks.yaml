    \ \n    alert(myObject.animal);\n```\n\n[Example 5-5](#text00007.html_ex0505)\
    \ is relatively harmless because the JSON is directly in the code. Typically,\
    \ the JSON would be coming from another server. This server is often a third-party\
    \ server, which you have no control over. For example, if I were asking Facebook’s\
    \ server for some JSON, I have no control over what JSON it gives me. If the server\
    \ were exploited, or the JSON intercepted somehow, I could be served malicious\
    \ code.\n\nThe issue with the `eval()` function is it takes a string, and compiles\
    \ and executes it without discrimination. If my JSON is coming from a third-party\
    \ server and is replaced with a malicious script, then my perfectly innocent website\
    \ will be compiling and executing this malicious code in the Internet browsers\
    \ of those who visit my site.\n\nIn the JavaScript code in [Example 5-6](#text00007.html_ex0506)\
    \ , I’ve replaced the JSON string with some JavaScript. When this code runs, the\
