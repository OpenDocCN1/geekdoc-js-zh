    \ Schema ([Example 4-4](#text00006.html_ex0404) ).\n\n##### Example 4-4. This\
    \ JSON conforms to our JSON Schema for “Cat”\n\n```\n {\n  \"name\": \"Fluffy\"\
    ,\n  \"age\": 2,\n  \"declawed\": false\n}\n```\n\nEarlier I stated that a JSON\
    \ Schema can answer the following questions:\n\nAre the data types of the values\
    \ correct?\n\n> We can specify that a value has to be a number, string, etc.\n\
    \nDoes this include the required data?\n\n> We can specify what data is required,\
    \ and what is not.\n\nAre the values in the format that I require?\n\n> We can\
    \ specify ranges, minimum and maximum.\n\nWith the very simple cat example, the\
    \ first question was answered. We were able to validate that the JSON for the\
    \ cat “Fluffy” has the correct data types for the values of name, age, and declawed.\
    \ Let’s answer the second question: does this include the required data?\n\nWhen\
    \ we ask for data, there are often properties (or fields) that we must have values\
    \ for, and others that are optional. For example, when I create a new account\
    \ on a shopping website, I need to complete a shipping address form. That address\
    \ form requires my name, street, city, state, and zip code. Optionally, I can\
    \ include a company name, apartment number, and a second line for a street address.\
    \ If I leave out one of the required fields, I cannot move forward with the account\
    \ creation.\n\nTo achieve this required logic in the JSON schema, we add a fourth\
    \ name-value pair after `\"$schema\"` , `\"title\"` , and `\"properties\"` . This\
    \ name-value pair has the name `\"required\"` and a value of the array data type.\
    \ The array includes the fields we require.\n\nIn [Example 4-5](#text00006.html_ex0405)\
    \ , we first add another field for `\"description\"` . Next, we add a fourth name-value\
    \ pair, `\"required\"` , with an array of required values for its value. `\"name\"\
    ` , `\"age\"` , and `\"declawed\"` are required, so we add them to this list.\
    \ We leave out `\"description\"` because it’s not required.\n\n##### Example 4-5.\
    \ Defining the required fields\n\n```\n {\n  \"$schema\": \"http://json-schema.org/draft-04/schema#\"\
    ,\n  \"title\": \"Cat\",\n  \"properties\": {\n    \"name\": {\n      \"type\"\
    : \"string\"\n    },\n    \"age\": {\n      \"type\": \"number\",\n      \"description\"\
    : \"Your cat's age in years.\"\n    },\n    \"declawed\": {\n      \"type\": \"\
    boolean\"\n    },\n    \"description\": {\n      \"type\": \"string\"\n    }\n\
    \  },\n  \"required\": [\n    \"name\",\n    \"age\",\n    \"declawed\"\n  ]\n\
    }\n```\n\nWith the addition of `\"required\"` to our JSON schema, the JSON in\
    \ [Example 4-6](#text00006.html_ex0406) is valid. This JSON conforms to our JSON\
    \ schema for `\"Cat\"` with the required fields of `\"name\"` , `\"age\"` , and\
    \ `\"declawed\"` . We are including the optional name-value pair, `\"description\"\
    ` .\n\n##### Example 4-6. Valid JSON\n\n```\n {\n  \"name\": \"Fluffy\",\n  \"\
    age\": 2,\n  \"declawed\": false,\n  \"description\" : \"Fluffy loves to sleep\
    \ all day.\"\n}\n```"
