  trans: " # JSON 序列化与反序列化\n\n## ASP.NET JSON 反序列化\n\n### 示例 9-7. 将 JSON 资源作为字符串反序列化；代码最后一行的\
    \ `fullName` 变量将求值为 \"Janet Jackson\"\n\n```\n CustomerAccount customerAccount;\n\
    using (var webClient = new WebClient())\n{\n    string json = webClient.DownloadString(\n\
    \        \"http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c\");\n\
    \    customerAccount = JsonConvert.DeserializeObject<CustomerAccount>(json); \
    \             \n}\n\nstring fullName = customerAccount.firstName + \" \" + customerAccount.lastName;\
    \ \n```\n\n在这些示例中，我们可以看到 JSON 对象的结构对 ASP.NET 对象非常友好。只要 ASP.NET 对象的属性与 JSON 中键值对的名称匹配，在这个\
    \ Web 框架中进行 JSON 的序列化和反序列化是非常简单的。\n\n## PHP\n\nPHP 是一种用于创建动态网页的服务器端脚本语言。PHP 代码可以直接嵌入到\
    \ HTML 文档中（参见 示例 9-8 ）。\n\n### 示例 9-8. 此 HTML 页面将显示一个带有文本 \"Hello, World\" 的标题\
    \ (<h1>) 标签\n\n```\n <!DOCTYPE html>\n<html>\n    <head>\n        <meta charset=\"\
    UTF-8\">\n        <title>Hello, World</title>\n    </head>\n    <body>\n     \
    \   <h1>\n        <?php\n           echo \"Hello, World\";\n        ?>\n     \
    \   </h1>\n    </body>\n</html>\n```\n\n此外，PHP 还包含了对象数据类型。对象是通过类来定义的（参见 示例 9-9\
    \ ）。\n\n### 示例 9-9. 一个表示猫的 PHP 类\n\n```php\n class Cat\n{\n    public $name;\n\
    \    public $breed;\n    public $age;\n    public $declawed;\n}\n```\n\n当类被实例化时，就会创建一个对象。然后该对象就可以在编程逻辑中使用（示例\
    \ 9-10 ）。\n\n### 示例 9-10. 类已实例化并设置了属性。创建了一个对象。代码最后一行将显示 \"Fluffy Boo。\"\n\n```php\n\
    \ $cat = new Cat();\n   $cat->name = \"Fluffy Boo\";\n   $cat->breed = \"Maine\
    \ Coon\";\n   $cat->age = 2.5;\n   $cat->declawed = false;\n\n   echo $cat->name;\n\
    ```\n\nPHP 还包含对 JSON 序列化和反序列化的内置支持。PHP 将此称为 JSON 的编码和解码。当我们编码某些内容时，我们将其转换为编码（不可读的）的形式。当我们解码某些内容时，我们将其转换回可读的形式。从\
    \ PHP 的角度来看，JSON 是一种编码格式。因此，要序列化 JSON，需要调用 `json_encode` 函数；要反序列化 JSON，则调用 `json_decode`\
    \ 函数。\n\n### 序列化 JSON\n\n在 PHP 中，我们可以利用对 JSON 的内置支持快速序列化 PHP 对象。在本节中，我们将创建一个表示地址的\
    \ PHP 对象，并将其序列化为 JSON。\n\n在 示例 9-11 中，我们首先创建了一个表示账户的类。然后，为 Bob Barker 的账户创建该类的新实例。创建了一个\
    \ `Account` 对象。最后，在最后一行，我们调用内置函数 `json_encode` 来序列化 `Account` 对象（结果如 示例 9-12 所示）。\n\
    \n#### 示例 9-11. 创建并序列化账户\n\n```php\n <?php\nclass Account {\n    public $firstName;\n\
    \    public $lastName;\n    public $phone;\n    public $gender;\n    public $addresses;\n\
    \    public $famous;\n}\n\nclass Address {\n    public $street;\n    public $city;\n\
    \    public $state;\n    public $zip;\n}\n\n$address1 = new Address();\n$address1->street\
    \ = \"123 fakey st\";\n$address1->city = \"Somewhere\";\n$address1->state = \"\
    CA\";\n$address1->zip = 96027;\n\n$address2 = new Address();\n$address2->street\
    \ = \"456 fake dr\";\n$address2->city = \"Some Place\";\n$address2->state = \"\
    CA\";\n$address2->zip = 96345;\n\n$account = new Account();\n$account->firstName\
    \ = \"Bob\";\n$account->lastName = \"Barker\";\n$account->gender = \"male\";\n\
    $account->phone = \"555-555-5555\";\n$account->famous = true;        \n$account->addresses\
    \ = array ($address1, $address2);\n\n$json = json_encode($account);\n\n?>\n```\n\
    \n#### 示例 9-12. `json_encode($account)` 的 JSON 结果\n\n```json\n {\n    \"firstName\"\
    : \"Bob\",\n    \"lastName\": \"Barker\",\n    \"phone\": \"555-555-5555\",\n\
    \    \"gender\": \"male\",\n    \"addresses\": [\n        {\n            \"street\"\
    : \"123 fakey st\",\n            \"city\": \"Somewhere\",\n            \"state\"\
    : \"CA\",\n            \"zip\": 96027\n        },\n        {\n            \"street\"\
    : \"456 fake dr\",\n            \"city\": \"Some Place\",\n            \"state\"\
    : \"CA\",\n            \"zip\": 96345\n        }\n    ],\n    \"famous\": true\n\
    }\n```\n\n### 反序列化 JSON\n\n在 PHP 中，我们使用内置的 `json_encode` 函数来序列化 JSON。要反序列化 JSON，我们使用\
    \ `json_decode` 函数。不幸的是，这没有内置反序列化 JSON 的支持，因此我们必须进行一些处理将数据转换回 `Account` 对象。\n\n\
    从 PHP 的角度来看，在 示例 9-13 中，`loadFromJSON` 函数接收 JSON 字符串，通过 `foreach` 循环将键值对映射到 `Account`\
    \ 。\n\n#### 示例 9-13. 为 `Account` 对象添加函数\n\n```php\n class Account {\n    public\
    \ $firstName;\n    public $lastName;\n    public $phone;\n    public $gender;\n\
    \    public $addresses;\n    public $famous;\n\n    public function loadFromJSON($json)\
    \ {\n        $object = json_decode($json);\n        foreach ($object as $name\
    \ => $value) {\n            $this->{$name} = $value;\n        }\n    }\n}\n```\n\
    \n接下来，我们可以创建一个 `Account` 对象，并调用新的 `loadFromJSON` 函数（示例 9-14 ）。\n\n#### 示例 9-14.\
    \ 调用新的 `loadFromJSON` 函数来反序列化账户 JSON；最后一行将显示 \"Bob Barker\"\n\n```php\n $json\
    \ = json_encode($account);\n\n$deserializedAccount = new Account();\n$deserializedAccount->loadFromJSON($json);\n\
    \necho $deserializedAccount->firstName . \" \" . $deserializedAccount->lastName;\n\
    ```"
- fmt: "\nIn both the PHP and ASP.NET examples, we can see that though JSON is based\
    \ on the object literal notation of the JavaScript language, the notation translates\
    \ well to objects of other programming languages. As server-side programming languages\
    \ are many and diverse, many of them support objects and the data types of JSON.\
    \ This is ideal, as it allows the structure or “shape” of the data to be maintained\
    \ as it moves in and out of a system as JSON.\n\nAdditionally, the support for\
    \ JSON on the server side is massive. Most server-side languages (or frameworks)\
    \ either provide built-in support for JSON serializing/deserializing, or have\
    \ libraries or modules available. This support for JSON on the server side contributes\
    \ to its success as a data interchange format.\n\nLet’s take a look at a few bite-sized\
    \ examples of JSON HTTP requests on the server side. In each of these examples,\
    \ you will see an HTTP request for a JSON resource, the parsing of that resource\
    \ into an object, and the rendering of a value from a JSON document.\n\nThe JSON\
    \ document in all these examples will be from the OpenWeatherMap API. All the\
    \ rendering of values will be based on a subset of the JSON resource at `http://api.openweathermap.org/data/2.5/weather?q=London,uk`\
    \ (see [Example 9-17](#text00011.html_ex0917)).\n\n### Example 9-17. The coordinates\
    \ object of the JSON resource for weather data from the OpenWeatherMap API; this\
    \ represents the latitude and longitude of London, UK\n\n```\n {\n    \"coord\"\
    : {\n        \"lon\": -0.13,\n        \"lat\": 51.51\n    }\n}\n```\n\n## Ruby\
    \ on Rails\n\nRuby on Rails is a server-side web application framework. It is\
    \ written in the Ruby programming language and based on the model-view-controller\
    \ (MVC) architecture.\n\nIn Ruby, a gem is a package for installing a program\
    \ or library. To serialize and deserialize JSON in Ruby on Rails, the JSON ruby\
    \ gem is required. Once you have the JSON gem installed, parsing JSON is as simple\
    \ as `JSON.parse()` ([Example 9-18](#text00011.html_ex0918)).\n\nIn [Example 9-18](#text00011.html_ex0918),\
    \ we make an HTTP request to the OpenWeatherMap API and deserialize the JSON into\
    \ a Ruby Object. Finally, in the last line of the code, we render the longitude\
    \ (`lon`) from the coordinates (`coord`) object of the data.\n\n### Example 9-18.\
    \ HTTP Request to the OpenWeatherMap API\n\n```\n require 'net/http'\nrequire\
    \ 'json'\n\nurl = URI.parse('http://api.openweathermap.org/data/2.5/weather?q=London,uk')\n\
    request = Net::HTTP::Get.new(url.to_s)\nresponse = Net::HTTP.start(url.host, url.port)\
    \ {|http|\nhttp.request(request)\n}\n\nweatherData = JSON.parse(response.body)\n\
    \nrender text: weatherData[\"coord\"][\"lon\"]\n```\n\n## Node.js\n\nNode.js is\
    \ JavaScript on the server side (without an Internet browser), made possible with\
    \ Google’s open source V8 JavaScript engine. With Node.js, you can build server-side\
    \ applications with JavaScript.\n\nEarlier in this book, we covered JSON with\
    \ JavaScript on the client side and saw that JSON is deserialized into a JavaScript\
    \ object with a simple `JSON.parse()`. The same is true in Node.js, as it *is*\
    \ JavaScript.\n\nHowever, we don’t use the `XMLHttpRequest` object in Node.js,\
    \ as it is a JavaScript object specific to Internet browsers. In Node.js, we can\
    \ request our JSON (and other types of resources) with a much better named function:\
    \ `get()`.\n\nIn [Example 9-19](#text00011.html_ex0919), we make an HTTP request\
    \ to the OpenWeatherMap API and deserialize the JSON into a JavaScript Object.\
    \ We then print the longitude (`lon`) from the coordinates (`coord`) object of\
    \ the data with `console.log()`.\n\n### Example 9-19. Making an HTTP request to\
    \ the API and deserializing to a JavaScript object\n\n```\n var http = require('http');\n\
    http.get({\n    host: 'api.openweathermap.org',\n    path: '/data/2.5/weather?q=London,uk'\n\
    }, function(response) {\n    var body = '';\n    response.on('data', function(data)\
    \ {\n        body += data;\n    });\n    response.on('end', function() {\n   \
    \     var weatherData = JSON.parse(body);\n        console.log(weatherData.coord.lon);\n\
    \    });\n});\n```\n\n## Java\n\nJava is an object-oriented programming language.\
    \ Java can be run in the web browser as Java applets, or standalone on a machine\
    \ with the Java Runtime Environment (JRE).\n\nThere are many libraries available\
    \ that support JSON in Java. In this section, I will use the following libraries\
    \ to get the JSON resource from a URL and deserialize it to an object in Java:\n\
    \n*   [Apache Commons IO](https://commons.apache.org/proper/commons-io/)\n*  \
    \ [JSON in Java](http://www.json.org/java/)\n\nIn [Example 9-20](#text00011.html_ex0920),\
    \ we get the JSON resource as a string from the OpenWeatherMap API. After that,\
    \ we deserialize the JSON string by instantiating a `JSONObject`. We then print\
    \ the longitude (`lon`) from the coordinates (`coord`) object of the data with\
    \ `System.out.println()`.\n\n### Example 9-20. Deserializing a JSON string with\
    \ a JSONObject\n\n```\n import java.io.IOException;\nimport java.net.URL;\n\n\
    import org.apache.commons.io.IOUtils;\nimport org.json.JSONException;\nimport\
    \ org.json.JSONObject;\n\npublic class HelloWorldApp {\n\n    public static void\
    \ main(String[] args) throws IOException, JSONException {\n        String url\
    \ = \"http://api.openweathermap.org/data/2.5/weather?q=London,uk\";\n        String\
    \ json = IOUtils.toString(new URL(url));\n        JSONObject weatherData = new\
    \ JSONObject(json);\n        JSONObject coordinates = weatherData.getJSONObject(\"\
    coord\");\n        System.out.println(coordinates.get(\"lon\"));\n    }  \n\n\
    }\n```\n\n## Key Terms and Concepts\n\nThis chapter covered the following key\
    \ terms:\n\nASP.NET\n> A server-side web framework developed by Microsoft.\n\n\
    PHP\n> A server-side scripting language used to make dynamic web pages.\n\nRuby\
    \ on Rails\n> A server-side web application framework running on Ruby.\n\nNode.js\n\
    > JavaScript on the server side running on Google’s V8 JavaScript engine.\n\n\
    Java\n> An object-oriented programming language.\n\nWe also discussed these key\
    \ concepts:\n\n*   On the server side, JSON can be deserialized into an object\
    \ for use in programming logic and serialized into JSON format from an object.\n\
    *   JSON has a huge amount of support on *both* the client side and the server\
    \ side, which makes it a very successful data interchange format for the Web.\n\
    \n## 读累了记得休息一会哦~\n\n**公众号：古德猫宁李**\n\n*   电子书搜索下载\n*   书单分享\n*   书友学习交流\n\n**网站：**[沉金书屋\
    \ https://www.chenjin5.com](https://www.chenjin5.com)\n\n*   电子书搜索下载\n*   电子书打包资源分享\n\
    *   学习资源分享\n\n# Chapter 10. Conclusion\n\nFrom about 6,000 feet, we can see JSON\
    \ flitting about in the world, carrying data in and out of systems. JSON is great\
    \ at doing its job as a data interchange format, and we have seen that expressed\
    \ in this book. However, if you look closely through your binoculars, you can\
    \ see that JSON is simply staying put in some places.\n\nDespite the phenomena\
    \ of JSON staying put in some places, this book has mostly ignored the subject.\
    \ The focus has been on interchanging data between two parties. Essentially, moving\
    \ data.\n\nJSON can be both a receptacle and a vehicle for data, and it is not\
    \ bound to a single purpose. We saw that illustrated with the role of JSON in\
    \ NoSQL. More and more, JSON is making its way into projects and endeavors as\
    \ a very useful tool. To further illustrate, let’s take one last look at a role\
    \ that JSON plays out in the world today: staying put in one place as a configuration\
    \ file.\n\n### JSON as a Configuration File\n\nIn [Chapter 9](#text00011.html_chapter_jsonserverside),\
    \ we explored two server-side web technologies that support parsing JSON. As discussed\
    \ in that chapter, JSON is widely supported by most server-side web languages\
    \ (or frameworks). It has become popular to use JSON for storing configuration\
    \ data due to wide support, ease of parsing on the server, and human readability.\n\
    \nA configuration or settings file is often used in software, so settings may\
    \ be changed without having to recompile. There are several formats for configuration\
    \ files, including INI and XML.\n"
