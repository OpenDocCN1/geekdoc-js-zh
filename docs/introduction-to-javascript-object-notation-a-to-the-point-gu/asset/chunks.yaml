  trans: "\n\n### 示例 3-16. 我已经从纸盒里取出了两个鸡蛋来做早餐\n\n```\n {\n    \"eggCarton\": [\n \
    \       \"egg\",\n        null,\n        \"egg\",\n        \"egg\",\n        \"\
    egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\"\
    ,\n        \"egg\",\n        null,\n        \"egg\"\n    ]\n}\n```\n\n如你所见，我从两个特定的格子中取出了鸡蛋。这些格子变空了，因为鸡蛋已经不存在了。我们用`null`表示这一点。\n\
    \n数组为每个“格子”都有一个索引。我们从 0 开始，因此第一个格子的索引为 0，第二个为 1，依此类推。最后一个格子的索引为 11。因此，我在索引 1 和\
    \ 10 的位置取出了鸡蛋。这是一个有效的数组。\n\n如果我在索引 10 的空格子中放入数字`5`，在大多数编程语言中，这将是一个无效的数组。参见示例 3-17。\n\
    \n### 示例 3-17. 这在大多数编程语言中将是无效的\n\n```\n {\n    \"eggCarton\": [\n        \"egg\"\
    ,\n        null,\n        \"egg\",\n        \"egg\",\n        \"egg\",\n     \
    \   \"egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\",\n        \"\
    egg\",\n        5,\n        \"egg\"\n    ]\n}\n```\n\n我说过“大多数编程语言”，但在 JSON 中，混合和匹配数据类型是有效的。我会告诉你为什么，然后我会告诉你为什么你不应该在\
    \ JSON 中这样做。\n\n在 JavaScript 中，你定义一个变量。例如，在示例 3-18 中，我们有一个名为`something`的变量，并为其赋值数字`5`。\n\
    \n### 示例 3-18. 在 JavaScript 中定义变量\n\n```\n var something = 5;\n```\n\n在下一行，我们可以将该变量更改为字符串值（示例\
    \ 3-19）。\n\n### 示例 3-19. 将该变量更改为字符串值\n\n```\n something = \"bob\";\n```\n\n我们甚至可以将其更改为对象值（示例\
    \ 3-20）。\n\n### 示例 3-20. 将该变量更改为对象值\n\n```\n something = { person: \"bob\" };\n\
    ```\n\n`var something`（变量）的值可以是数字、字符串、数组、`null`或对象。在大多数编程语言中，变量不允许如此多变。通常你会将某个变量声明为`int`、`string`或`object`之一。因此，当你声明一个名为`something`的变量时，你会说`int\
    \ something = 5`。你会说`string something = \"bob\"`或者你会说`Person something = new Person(\"\
    bob\")`。因此，在大多数编程语言中，当你声明一个数组时，你是在提前声明每个容器中必须包含的数据类型，之后不能随意更改。\n\nJSON 是一种数据交换格式。如果你将\
    \ JSON 数组交给不打算使用 JavaScript 处理 JSON 的人，你的数组在解析时会出错。\n\n例如，假设你参加一个会议，商贩们正在销售石头收藏品。你有要卖的石头收藏品。一个家伙出现并想买你的\
    \ 50 块石头收藏品，他拿走了，但当他回家时发现石头收藏品不是 50 块，而是 20 块石头、20 根棍子和 10 片口香糖（其中一片已经被嚼过）。\n\n\
    让我们更仔细地看看每种数据类型的数组示例。在 JSON 中，数组可以是任何支持的数据类型。因此，我们可以有字符串数组、数字数组、布尔数组、对象数组或数组的数组。数组的数组称为多维数组。让我们看一些例子。\n\
    \n假设我们有一个已报名课程的学生名单。这可以用字符串数组表示（示例 3-21）。\n\n### 示例 3-21. 使用字符串数组表示学生名单\n\n```\n\
    \ {\n    \"students\": [\n        \"Jane Thomas\",\n        \"Bob Roberts\",\n\
    \        \"Robert Bobert\",\n        \"Thomas Janerson\"\n    ]\n}\n```\n\n学生参加测试后，我们可以用数字数组表示他们的成绩（示例\
    \ 3-22）。\n\n### 示例 3-22. 使用数字数组表示测试成绩\n\n```\n {\n    \"scores\": [\n        93.5,\n\
    \        66.7,\n        87.6,\n        92\n    ]\n}\n```\n\n如果我们需要为判断题创建答案键，可以使用布尔数组（示例\
    \ 3-23）。\n\n### 示例 3-23. 使用布尔数组表示判断题的答案\n\n```\n {\n    \"answers\": [\n     \
    \   true,\n        false,\n        false,\n        true,\n        false,\n   \
    \     true,\n        true\n    ]\n}\n```\n\n对象数组可用于表示整个测试，包括问题和答案（示例 3-24）。\n\n\
    ### 示例 3-24. 使用对象数组表示测试的问题和答案\n\n```\n {\n    \"test\": [\n        {\n       \
    \     \"question\": \"The sky is blue.\",\n            \"answer\": true\n    \
    \    },\n        {\n            \"question\": \"The earth is flat.\",\n      \
    \      \"answer\": false\n        },\n        {\n            \"question\": \"\
    A cat is a dog.\",\n            \"answer\": false\n        }\n    ]\n}\n```\n\n\
    要表示三个不同测试的成绩，可以使用数组的数组，即多维数组（示例 3-25）。\n\n### 示例 3-25. 使用数组的数组表示三个不同测试的成绩\n\n\
    ```\n {\n    \"tests\": [\n        [\n            true,\n            false,\n\
    \            false,\n            false\n        ],\n        [\n            true,\n\
    \            true,\n            true,\n            true,\n            false\n\
    \        ],\n        [\n            true,\n            false,\n            true\n\
    \        ]\n    ]\n}\n```\n\n# 关键术语和概念\n\n本章涵盖以下关键术语：\n\nJSON 字符串数据类型\n\n> 字符串值，如\
    \ `\"my string\"`，用双引号包围。\n\nJSON 布尔数据类型\n\n> `true` 或 `false` 值。\n\nJSON 数字数据类型\n\
    \n> 数字值，如 `42`，可以是正整数或负整数、小数或指数。\n\nJSON 空数据类型\n\n> `null` 值表示空值。\n\nJSON 数组数据类型\n\
    \n> 数组是值的集合或列表，值可以是字符串、数字、布尔、对象或数组类型；数组的值用方括号（`[]`）包围，以逗号分隔。\n\nJSON 对象数据类型\n\n\
    > 对象数据类型是由逗号分隔的键值对集合，用花括号（`{}`）包围。\n\n我们还讨论了以下关键概念：\n\n*   JSON 中的布尔数据类型值`true`或`false`始终为全小写字符（即`true`，而不是`True`或`TRUE`）。\n\
    *   JSON 中的`null`数据类型值始终为全小写字符（即`null`，而不是`NULL`或`Null`）。\n*   对象和数组的一个关键区别是对象是键值对的列表或集合，而数组是值的列表或集合。\n\
    *   另一个关键区别是数组的值*应该*全部具有相同的数据类型。\n\n# 第 4 章 JSON Schema\n\n在第 3 章中，我们介绍了 JSON\
    \ 数据类型。讨论了数据类型的重要性和实用性。提前知道某物是什么及其用途（记住那个拿锤子的孩子）会产生很大的不同。\n\n在大多数数据交换场景中，数据被创建以通过互联网或网络发送给另一方。该方通常对所期望的文档格式有要求，包括结构和数据类型。他们通常会提供文档来说明格式并提供示例。\n\
    \n"
- fmt: "\n# Conformity Validation and JSON Schema\n\nEven when the most detailed,\
    \ beautiful documentation is provided, it is not difficult to create errors in\
    \ your data. To be clear, these aren’t syntax errors we are talking about here.\
    \ These are errors of misunderstanding, like “I sent an apple, and you were expecting\
    \ an orange.” In this book, I will refer to this type of validation as *conformity\
    \ validation* so that it may be distinguished from syntax validation.\n\n## Scenario\
    \ Without Schema\n\nIn this scenario, the process usually plays out in the following\
    \ steps:\n\n1. You are finished creating your data and you feel confident.\n2.\
    \ You send your data across the Internet to the other party. Your Internet connection\
    \ is slow today, and the data file you are sending is huge, so it takes several\
    \ minutes.\n3. You get an error response because your data was not formatted how\
    \ they were expecting it. Confidence deflated. If you’re lucky, the error response\
    \ will tell you something meaningful, like what you did wrong.\n4. You pore over\
    \ their documentation, find what you think you did wrong, fix it, and start back\
    \ at step 1.\n\nThis scenario has existed with data interchange since before JSON\
    \ existed. Fortunately, the people of the technology industry are problem solvers,\
    \ and the concept of the schema was born.\n\n## Contracts with Validation Magic\n\
    \nIn the real world, we often use contracts between two parties where the outcome\
    \ is important. When I sign a contract that says I will complete a project for\
    \ someone, the details are outlined in that contract. I agree that I will deliver\
    \ the spaceship by August 31st, and the final product will have a fully functional\
    \ spaceship with life support, lasers, and three engines.\n\nImagine now that\
    \ we live in a world of wizards and magic. When the company I’m doing the project\
    \ for handed me the contract, they added a bit of magic. At any time, I can tap\
    \ my wand on the contract and it will tell me whether I’ve met my end of the bargain.\
    \ I’d never have to walk into the meeting to proclaim “I’m done!” and be met with\
    \ the embarrassing response of “What about the third engine you promised to put\
    \ on the spaceship. Where is it?” At any time I can verify that I am *really*\
    \ done with the project and walk into the meeting with confidence.\n\nA data interchange\
    \ schema is much like that imagined world of wizards and magic. Before we send\
    \ our data, we can at any time validate it for conformity with the schema and\
    \ find out whether our data is acceptable. When we are interchanging data with\
    \ a schema, the process is much different than our scenario without the schema:\n\
    \n1. You validate the conformity of your data with your schema and fix any errors\
    \ found. You are usually given useful information about the errors.\n2. You are\
    \ finished creating your data and you feel confident.\n3. You send your data across\
    \ the Internet and you get a success response. Mission complete.\n\nAdditionally,\
    \ the JSON schema can be used on the other end of the transaction by the party\
    \ that is accepting the data. A JSON schema can be a first line of defense in\
    \ accepting data, to verify that the data conforms. It can answer all of these\
    \ questions before the data is processed:\n\nAre the data types of the values\
    \ correct?\n\n> We can specify that a value has to be a number, string, etc.\n\
    \nDoes this include the required data?\n\n> We can specify what data is required,\
    \ and what is not.\n\nAre the values in the format that I require?\n\n> We can\
    \ specify ranges, minimum and maximum.\n\n## Introduction to JSON Schema\n\nWhile\
    \ JSON is fairly mature, JSON Schema is still under development. As of April 2015,\
    \ JSON Schema is in draft 4. This doesn’t mean that you shouldn’t use JSON Schema\
    \ — it just means it’s still evolving to better serve the world.\n\nA JSON Schema\
    \ is written with JSON, so reading or writing one is only a few steps away. In\
    \ our very first name-value pair of our JSON, we must declare it as a schema document\
    \ (see Example 4-1).\n\n#### Example 4-1: The `$schema` Declaration\n\n```json\n\
    \ {\n    \"$schema\": \"http://json-schema.org/draft-04/schema#\"\n}\n```\n\n\
    The second name-value pair in our JSON Schema Document will be the `title` (see\
    \ Example 4-2).\n\n#### Example 4-2: Adding a Title\n\n```json\n {\n    \"$schema\"\
    : \"http://json-schema.org/draft-04/schema#\",\n    \"title\": \"Cat\"\n}\n```\n\
    \nIn the third name-value pair of our JSON Schema Document, we will define the\
    \ `properties` that we want to be included in the JSON. The `properties` value\
    \ is essentially a skeleton of the name-value pairs of the JSON we want. Instead\
    \ of a literal value, we have an object that defines the data type, and optionally\
    \ the description (see Example 4-3).\n\n#### Example 4-3: Defining Properties\n\
    \n```json\n {\n  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\n \
    \ \"title\": \"Cat\",\n  \"properties\": {\n    \"name\": {\n      \"type\": \"\
    string\"\n    },\n    \"age\": {\n      \"type\": \"number\",\n      \"description\"\
    : \"Your cat's age in years.\"\n    },\n    \"declawed\": {\n      \"type\": \"\
    boolean\"\n    }\n  }\n}\n```\n\nWe can then validate that our JSON conforms to\
    \ the JSON Schema (see Example 4-4).\n\n#### Example 4-4: Conforming JSON\n\n\
    ```json\n {\n  \"name\": \"Fluffy\",\n  \"age\": 2,\n  \"declawed\": false\n}\n\
    ```\n\nEarlier I stated that a JSON Schema can answer the following questions:\n\
    \nAre the data types of the values correct?\n\n> We can specify that a value has\
    \ to be a number, string, etc.\n\nDoes this include the required data?\n\n> We\
    \ can specify what data is required, and what is not.\n\nAre the values in the\
    \ format that I require?\n\n> We can specify ranges, minimum and maximum.\n\n\
    With the very simple cat example, the first question was answered. We were able\
    \ to validate that the JSON for the cat “Fluffy” has the correct data types for\
    \ the values of `name`, `age`, and `declawed`. Let’s answer the second question:\
    \ does this include the required data?\n\nWhen we ask for data, there are often\
    \ properties (or fields) that we must have values for, and others that are optional.\
    \ For example, when I create a new account on a shopping website, I need to complete\
    \ a shipping address form. That address form requires my name, street, city, state,\
    \ and zip code. Optionally, I can include a company name, apartment number, and\
    \ a second line for a street address. If I leave out one of the required fields,\
    \ I cannot move forward with the account creation.\n\nTo achieve this required\
    \ logic in the JSON schema, we add a fourth name-value pair after `$schema`, `title`,\
    \ and `properties`. This name-value pair has the name `required` and a value of\
    \ the array data type. The array includes the fields we require.\n\nIn Example\
    \ 4-5, we first add another field for `description`. Next, we add a fourth name-value\
    \ pair, `required`, with an array of required values for its value. `name`, `age`,\
    \ and `declawed` are required, so we add them to this list. We leave out `description`\
    \ because it’s not required.\n\n#### Example 4-5: Defining Required Fields\n\n\
    ```json\n {\n  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\n  \"\
    title\": \"Cat\",\n  \"properties\": {\n    \"name\": {\n      \"type\": \"string\"\
    \n    },\n    \"age\": {\n      \"type\": \"number\",\n      \"description\":\
    \ \"Your cat's age in years.\"\n    },\n    \"declawed\": {\n      \"type\": \"\
    boolean\"\n    },\n    \"description\": {\n      \"type\": \"string\"\n    }\n\
    \  },\n  \"required\": [\n    \"name\",\n    \"age\",\n    \"declawed\"\n  ]\n\
    }\n```\n\nWith the addition of `required` to our JSON schema, the JSON in Example\
    \ 4-6 is valid. This JSON conforms to our JSON schema for `Cat` with the required\
    \ fields of `name`, `age`, and `declawed`. We are including the optional name-value\
    \ pair, `description`.\n\n#### Example 4-6: Valid JSON\n\n```json\n {\n  \"name\"\
    : \"Fluffy\",\n  \"age\": 2,\n  \"declawed\": false,\n  \"description\" : \"Fluffy\
    \ loves to sleep all day.\"\n}\n```\n"
