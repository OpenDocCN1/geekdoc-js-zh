    \ the list of required fields. The JSON in [Example 4-7](#text00006.html_ex0407)\
    \ conforms to our JSON Schema for `\"Cat\"` with the required fields of `\"name\"\
    ` , `\"age\"` , and `\"declawed\"` .\n\n##### Example 4-7. Valid JSON without\
    \ the “description” field\n\n```\n {\n  \"name\": \"Fluffy\",\n  \"age\": 2,\n\
    \  \"declawed\": false\n}\n```\n\nIt is important to note that if you do not include\
    \ the `\"required\"` name-value pair in your JSON schema with the array of required\
    \ names, then nothing is required. A JSON object with no name-value pairs inside\
    \ it would be considered valid. Without the array of `\"required\"` , the JSON\
    \ in [Example 4-8](#text00006.html_ex0408) is considered valid for the `\"Cat\"\
    ` JSON Schema.\n\n##### Example 4-8. Valid JSON\n\n```\n {}\n```\n\nThe third\
    \ and final question we can answer with our JSON schema is: are the values in\
    \ the format I require? We answered the question about the data types of our values,\
    \ but we often need a specific format for the type. For example, I require a username,\
    \ but the username should not exceed 20 characters. Additionally, I might ask\
    \ you to think of a number between 10 and 100\\. We can express these specific\
    \ requirements in our JSON schema.\n\nIn the cat JSON, we have requirements such\
    \ as name being a string and age being a number. However, we do not want someone\
    \ giving us data with a really long cat name, a really short cat name, or a negative\
    \ number for the cat’s age. In our JSON schema, we can define a minimum length\
    \ and a maximum length for a string, and a minimum for a number.\n\nIn [Example 4-9](#text00006.html_ex0409)\
    \ , validation has been added to ensure that the cat’s name is a minimum of 3\
    \ characters and a maximum of 20 characters. Additionally, we ensure that the\
    \ age of the cat submitted is not a negative number.\n\n##### Example 4-9. Validating\
    \ the cat JSON\n\n```\n {\n  \"$schema\": \"http://json-schema.org/draft-04/schema#\"\
    ,\n  \"title\": \"Cat\",\n  \"properties\": {\n    \"name\": {\n      \"type\"\
    : \"string\",\n      \"minLength\": 3,\n      \"maxLength\" : 20\n    },\n   \
    \ \"age\": {\n      \"type\": \"number\",\n      \"description\": \"Your cat's\
    \ age in years.\",\n      \"minimum\" : 0\n    },\n    \"declawed\": {\n     \
    \ \"type\": \"boolean\"\n    },\n    \"description\": {\n      \"type\": \"string\"\
    \n    }\n  },\n  \"required\": [\n    \"name\",\n    \"age\",\n    \"declawed\"\
    \n  ]\n}\n```\n\nThe JSON in [Example 4-10](#text00006.html_ex0410) is not valid\
    \ with the `\"Cat\"` JSON Schema because the name value exceeds the `\"maxLength\"\
    ` , and the age value precedes the `\"minimum\"` .\n\n##### Example 4-10. Invalid\
    \ JSON\n\n```\n {\n  \"name\": \"Fluffy the greatest cat in the whole wide world\"\
    ,\n  \"age\": -2,\n  \"declawed\": false,\n  \"description\" : \"Fluffy loves\
    \ to sleep all day.\"\n}\n```\n\nThe JSON in [Example 4-11](#text00006.html_ex0411)\
    \ is valid with the cat JSON Schema and conforms to the requirements for the values.\n\
    \n##### Example 4-11. This JSON is valid\n\n```\n {\n  \"name\": \"Fluffy\",\n\
    \  \"age\": 2,\n  \"declawed\": false,\n  \"description\" : \"Fluffy loves to\
    \ sleep all day.\"\n}\n```\n\nIf we return to the comparison of a schema to a\
    \ contract, you can see that the details of our contract can be very specific.\
    \ The examples provided in this chapter are introductory and just the tip of the\
    \ iceberg. JSON Schema even supports regular expressions (character patterns,\
    \ such as an email address format) and enum (a list of possible values). If you\
    \ wish to become a master of JSON Schema, visit the following pages, where you\
    \ can find links to the specifications:\n\n*   [The home of JSON Schema](http://json-schema.org/)\n\
    \n*   [JSON Schema validation specification](http://json-schema.org/latest/json-schema-validation.html)\n\
    \nThere is a long and growing list of JSON Schema libraries and projects for specific\
    \ programming languages and frameworks. A quick Google search of “JSON Schema\
    \ Validation [insert programming language name here]” should get you what you\
    \ need if you’d like to integrate JSON Schema validation into a project. Additionally,\
    \ there are a few online validators, which are programming language agnostic and\
    \ great for experimenting with JSON Schema:\n\n*   [JSON Schema Lint](http://jsonschemalint.com/draft4/)\n\
    \n*   [JSON Schema Validator](http://www.jsonschemavalidator.net/)\n\nIf I go\
    \ to the JSON Schema Lint website, I will be presented with two text areas: one\
    \ for the JSON schema, and another for the JSON document to be validated. If I\
    \ paste in the schema from [Example 4-9](#text00006.html_ex0409) and the JSON\
    \ from [Example 4-10](#text00006.html_ex0410) , I will see the following errors:\n\
    \n*   Field: data.name, Error: has longer length than allowed , Value: “Fluffy\
    \ the greatest cat in the whole wide world”\n\n*   Field: data.age, Error: is\
    \ less than minimum, Value: -2\n\nIf I go to the JSON Schema Validator website,\
    \ I am also presented with the same two text areas. Once again, if I paste in\
    \ the schema from [Example 4-9](#text00006.html_ex0409) and the JSON from [Example 4-10](#text00006.html_ex0410)\
    \ , I will see errors. Additionally, the line numbers of the JSON will display\
    \ a red x, showing us where the errors are at in the JSON.\n\n*   Message: String\
    \ ‘Fluffy the greatest cat in the whole wide world’ exceeds maximum length of\
    \ 20, Schema Path: #/properties/name/maxLength\n\n*   Message: Integer -2 is less\
    \ than minimum value of 0, Schema Path: #/properties/age/minimum\n\nThe JSON Schema\
    \ Validator not only points us to the line numbers where the error takes place,\
    \ but also gives us the paths to the schema requirements that are causing the\
    \ validation to fail. The two validators may have described the errors a bit differently,\
    \ but both found the same errors.\n\n# Key Terms and Concepts\n\nThis chapter\
    \ covered the following key term:\n\nJSON Schema\n\n> A virtual contract for data\
    \ interchange.\n\nWe also discussed these key concepts:\n\n*   A JSON validator\
    \ provides syntax validation, while JSON Schema provides conformity validation.\n\
    \n*   JSON Schema can serve as a first line of defense in accepting data or as\
    \ a time (and sanity) saving tool for the party providing the data that ensures\
    \ their data will conform to what is accepted.\n\n*   A JSON Schema can answer\
    \ the following three questions for conformity validation:\n\n    Are the data\
    \ types of the values correct?\n\n    > We can specify that a value has to be\
    \ a number, string, etc.\n\n    Does this include the required data?\n\n    >\
    \ We can specify what data is required, and what is not.\n\n    Are the values\
    \ in the format that I require?\n\n    > We can specify ranges, minimum and maximum.\n\
    \n# Chapter 5. JSON Security Concerns\n\nJSON alone is not much of a threat. After\
    \ all, it’s only a data interchange format. By itself, it is just a document,\
    \ or a stream, of data. The real security concerns with JSON arise in the way\
    \ that it is used. In this chapter, we will take a look at two of the most common\
    \ security concerns for JSON on the Web: cross-site request forgery and cross-site\
    \ scripting.\n\nBefore we move forward in discussing security concerns, and enter\
    \ into the remaining chapters of this book, we need an understanding of client-side\
    \ and server-side relationships. Let’s take a quick look at these relationships,\
    \ for those that do not yet understand this concept.\n\n# A Quick Look at Client-\
    \ and Server-Side Relationships\n\nUpon arriving at Pierre’s Fine Dining for dinner,\
    \ I sit down at a lovely table where the napkins are folded into swans. A tall\
    \ man in slacks and a nice shirt approaches the table and says, “My name is Thomas,\
    \ and I am here to serve you this evening.” After he recognizes me, he lowers\
    \ his voice and says, “By the way, you are one of my favorite clients.”  He wags\
    \ his eyebrows and says, “Here is our special menu.\" \n\nAfter perusing the special\
    \ menu, I tell Thomas what I would like for dinner, and after some time he brings\
    \ it to the table. I eat a lovely dinner, and then later pay $200 for the artistically\
    \ arranged plates of tiny food. It was another fine evening at Pierre’s Fine Dining,\
    \ where Thomas was the server, and I was the client. "
