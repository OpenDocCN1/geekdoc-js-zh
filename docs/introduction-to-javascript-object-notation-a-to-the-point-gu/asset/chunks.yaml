    \ as Java applets, or standalone on a machine with the Java Runtime Environment\
    \ (JRE).\n\nThere are many libraries available that support JSON in Java. In this\
    \ section, I will use the following libraries to get the JSON resource from a\
    \ URL and deserialize it to an object in Java:\n\n*   [Apache Commons IO](https://commons.apache.org/proper/commons-io/)\n\
    \n*   [JSON in Java](http://www.json.org/java/)\n\nIn [Example 9-20](#text00011.html_ex0920)\
    \ , we get the JSON resource as a string from the OpenWeatherMap API. After that,\
    \ we deserialize the JSON string by instantiating a `JSONObject` . We then print\
    \ the longitude (`lon` ) from the coordinates (`coord` ) object of the data with\
    \ `System.out.println()` .\n\n##### Example 9-20. Deserializing a JSON string\
    \ with a JSONObject\n\n```\n import java.io.IOException;\nimport java.net.URL;\n\
    \nimport org.apache.commons.io.IOUtils;\nimport org.json.JSONException;\nimport\
    \ org.json.JSONObject;\n\npublic class HelloWorldApp {\n\n    public static void\
    \ main(String[] args) throws IOException, JSONException {\n        String url\
    \ = \"http://api.openweathermap.org/data/2.5/weather?q=London,uk\";\n        String\
    \ json = IOUtils.toString(new URL(url));\n        JSONObject weatherData = new\
    \ JSONObject(json);\n        JSONObject coordinates = weatherData.getJSONObject(\"\
    coord\");\n        System.out.println(coordinates.get(\"lon\"));\n    }  \n\n\
    }\n```\n\n# Key Terms and Concepts\n\nThis chapter covered the following key terms:\n\
    \nASP.NET\n\n> A server-side web framework developed by Microsoft.\n\nPHP\n\n\
    > A server-side scripting language used to make dynamic web pages.\n\nRuby on\
    \ Rails\n\n> A server-side web application framework running on Ruby.\n\nNode.js\n\
    \n> JavaScript on the server side running on Google’s V8 JavaScript engine.\n\n\
    Java\n\n> An object-oriented programming language.\n\nWe also discussed these\
    \ key concepts:\n\n*   On the server side, JSON can be deserialized into an object\
    \ for use in programming logic and serialized into JSON format from an object.\n\
    \n*   JSON has a huge amount of support on *both* the client side and the server\
    \ side, which makes it a very successful data interchange format for the Web.\n\
    \n# 读累了记得休息一会哦~\n\n**公众号：古德猫宁李**\n\n*   电子书搜索下载\n\n*   书单分享\n\n*   书友学习交流\n\n\
    **网站：**[沉金书屋 https://www.chenjin5.com](https://www.chenjin5.com)\n\n*   电子书搜索下载\n\
    \n*   电子书打包资源分享\n\n*   学习资源分享\n\n# Chapter 10. Conclusion\n\nFrom about 6,000\
    \ feet, we can see JSON flitting about in the world, carrying data in and out\
    \ of systems. JSON is great at doing its job as a data interchange format, and\
    \ we have seen that expressed in this book. However, if you look closely through\
    \ your binoculars, you can see that JSON is simply staying put in some places.\n\
    \nDespite the phenomena of JSON staying put in some places, this book has mostly\
    \ ignored the subject. The focus has been on interchanging data between two parties.\
    \ Essentially, moving data.\n\nJSON can be both a receptacle and a vehicle for\
    \ data, and it is not bound to a single purpose. We saw that illustrated with\
    \ the role of JSON in NoSQL. More and more, JSON is making its way into projects\
    \ and endeavors as a very useful tool. To further illustrate, let’s take one last\
    \ look at a role that JSON plays out in the world today: staying put in one place\
    \ as a configuration file.\n\n# JSON as a Configuration File\n\nIn [Chapter 9](#text00011.html_chapter_jsonserverside)\
    \ , we explored two server-side web technologies that support parsing JSON. As\
    \ discussed in that chapter, JSON is widely supported by most server-side web\
    \ languages (or frameworks). It has become popular to use JSON for storing configuration\
    \ data due to wide support, ease of parsing on the server, and human readability.\n\
    \nA configuration or settings file is often used in software, so settings may\
    \ be changed without having to recompile. There are several formats for configuration\
    \ files, including INI and XML."
