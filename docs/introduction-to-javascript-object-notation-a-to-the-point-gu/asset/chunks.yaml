    \     \"business_name\": \"Bob Equipment, LLC\",\n        \"phone\": {\n     \
    \       \"country_code\": \"001\",\n            \"national_number\": \"5555555555\"\
    \n        },\n        \"address\": {\n            \"line1\": \"123 Fake St.\"\
    ,\n            \"city\": \"Somewhere\",\n            \"state\": \"OR\",\n    \
    \        \"postal_code\": \"97520\",\n            \"country_code\": \"US\"\n \
    \       }\n    },\n    \"billing_info\": [\n        {\n            \"email\":\
    \ \"someguy@someguy.com\"\n        }\n    ],\n    \"items\": [\n        {\n  \
    \          \"name\": \"Widgets\",\n            \"quantity\": 20,\n           \
    \ \"unit_price\": {\n                \"currency\": \"USD\",\n                \"\
    value\": 89\n            }\n        }\n    ],\n    \"note\": \"Special Widgets\
    \ Order!\",\n    \"payment_term\": {\n        \"term_type\": \"NET_45\"\n    },\n\
    \    \"shipping_info\": {\n        \"first_name\": \"Some\",\n        \"last_name\"\
    : \"Guy\",\n        \"business_name\": \"Not applicable\",\n        \"address\"\
    : {\n            \"line1\": \"456 Real Fake Dr\",\n            \"city\": \"Some\
    \ Place\",\n            \"state\": \"OR\",\n            \"postal_code\": \"97501\"\
    ,\n            \"country_code\": \"US\"\n        }\n    }\n}\n```\n\nWith the\
    \ PayPal API, once the invoice is created, I can request (read), update, and delete\
    \ that invoice.\n\nOperations done behind the scenes in JavaScript, such as the\
    \ request for the weather data, are referred to as asynchronous. Asynchronous\
    \ operations are operations that take place in the background without interrupting\
    \ the main transmission.\n\nIn the case of JavaScript asynchronous operations,\
    \ the “main transmission” would be the display of the web browser. For example,\
    \ a news web page might include a sidebar with real-time weather data. While you’re\
    \ reading your news article, code in the background could asynchronously update\
    \ the weather display every 60 seconds. This operation would not require the page\
    \ to reload, nor would it interrupt your page scrolling to read your article.\
    \ The only thing on the page to change would be the sidebar with the weather data.\n\
    \nThe asynchronous (background) operations of JavaScript are referred to as AJAX.\
    \ AJAX stands for Asynchronous JavaScript and XML. When we are making behind-the-scenes\
    \ requests for JSON, this would technically be Asynchronous JavaScript and JSON\
    \ (AJAJ). However, the term “AJAX” has been used for so long that it has become\
    \ less of an acronym and more of a word to describe *any* asynchronous operations\
    \ in JavaScript. Here in this book and elsewhere, you will see the term AJAX used\
    \ to describe Asynchronous JavaScript and JSON. This is not done in error.\n\n\
    Let’s take a look at how we can achieve AJAX with JSON and the JavaScript `XMLHttpRequest`.\n\
    \n# The JavaScript `XMLHttpRequest`\n\nThough the JavaScript `XMLHttpRequest`\
    \ sounds like it has to do with XML, we use it for making HTTP requests. During\
    \ the time it was named with XML in it, XML was the star data interchange format\
    \ for making these types of requests. However, `XMLHttpRequest` *is not* restricted\
    \ to XML. We use it to request JSON despite its name.\n\nEarlier, I began several\
    \ phrases with “Code that fetches.” The JavaScript `XMLHttpRequest` is code that\
    \ fetches a resource. This phraseology is common when talking about HTTP requests,\
    \ though in reality the code isn’t chasing through cyberspace like a dog fetching\
    \ a ball. The code sits where it is and politely asks for the resource to be delivered.\n\
    \nIf we return to the restaurant example, we can imagine the JavaScript code sitting\
    \ at a restaurant table. The JavaScript code doesn’t go to the kitchen to request\
    \ JSON, nor does it yell across the restaurant. There is protocol in a restaurant.\
    \ That protocol requires you to summon a waiter who writes down your order and\
    \ carries it to the kitchen.\n\nThere is also protocol that allows code to send\
    \ requests to web servers that may be hundreds or thousands of miles away. The\
    \ very foundation of data communication that allows us to visit our favorite websites\
    \ is based on a protocol called *HyperText Transfer Protocol (HTTP)*. When we\
    \ type *http://www.cutelittlekittens.com* into our Internet browser, we are using\
    \ the HyperText Transfer Protocol to make a request for a resource. In the case\
    \ of the cute kittens website, that resource is an HTML page with cute kitten\
    \ images embedded into it. Code that needs to make a request for a JSON resource\
    \ uses the same protocol (HTTP).\n\nIn JavaScript, the code that uses the protocol\
    \ to make this request is the `XMLHttpRequest`. JavaScript is an object-oriented\
    \ language, so naturally the `XMLHttpRequest` is an object. Once it is created\
    \ by using the syntax `new XmlHttpRequest()` ([Example 6-3](#text00008.html_ex0603)),\
    \ and assigned to a variable, it has functions that can be called to request resources\
    \ from a location.\n\n##### Example 6-3. A JavaScript `XMLHttpRequest` object\n\
    \n```\n var myXmlHttpRequest = new XMLHttpRequest();\n```\n\nThe `XMLHttpRequest`\
    \ is an object, and [Example 6-3](#text00008.html_ex0603) shows the creation of\
    \ a new `XMLHttpRequest` object. Even if you don’t know JavaScript, if you’ve\
    \ read the book up to this point, your knowledge of JSON will help you visualize\
    \ a JavaScript object. After all, JSON is based on the literal notation of JavaScript\
    \ objects.\n\nWe say that a JavaScript object has properties. These “properties”\
    \ are simply name-value pairs. The properties of the `XMLHttpRequest` are named\
    \ `onreadystatechange`, `readyState`, `response`, `responseText`, `responseType`,\
    \ `responseXML`, `status`, `statusText`, `timeout`, `ontimeout`, `upload`, and\
    \ `withCredentials`. Note the inconsistency on the casing of these properties.\
    \ Some use camelCase and others are all lowercase. This may cause hairpulling\
    \ in your future if you decide to write your own `XMLHttpRequest` code, as you\
    \ will not only need to remember what the properties are called, but the different\
    \ casing.\n\nOne of the key differences between a typical object in programming\
    \ and a JSON object is that JSON lacks executable instructions. JSON is composed\
    \ only of properties because it is meant for data interchange. A typical object\
    \ in programming will also include functions (or methods). For example, I can\
    \ describe my shoes in JSON with name-value pairs such as: `\"color\": \"pink\"\
    ` and `\"brand\": \"crocs\"`. What I cannot do in JSON is give life to those shoes,\
    \ by calling a function (or method) such as `shoe.walk()`.\n\nThe available functions\
    \ of the `XMLHttpRequest` that we are most interested in are:\n\n*   `open(` `method`,\
    \ `url`, `async`(optional), `user`(optional), `password`(optional))\n*   `send()`\n\
    \nThe available properties of the `XMLHttpRequest` that we are most interested\
    \ in are:\n\n`onreadystatechange`\n\n> Has a value of a function that we can define\
    \ in our code.\n\n`readyState`\n\n> Returns a value ranging from 0–4 that represents\
    \ a status code.\n\n`status`\n\n> Returns the HTTP status code (like 200 for success).\n\
    \n`responseText`\n\n> When the response is successful, this will contain the body\
    \ of the response as text (JSON if this is what we are requesting).\n\nFor those\
    \ of you not familiar with JavaScript, here is a mind-bender: a property can have\
    \ a function for a value. This is possible in JavaScript because a function is\
    \ an object. An object is a type of data, and therefore can be assigned to a variable\
    \ (property), modified, and passed around. In the programming world, these are\
    \ called first-class functions. The `onreadystatechange` property has a value\
    \ of a function.\n\n[Example 6-4](#text00008.html_ex0604) creates a new `XMLHttpRequest`\
    \ object and gets JSON from the OpenWeatherMap API.\n\n##### Example 6-4. A new\
    \ `XMLHttpRequest` object\n"
