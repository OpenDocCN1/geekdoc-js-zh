  trans: "\n我们也可以省略 `\"description\"` 字段，因为它未包含在必需字段列表中。示例 4-7 中的 JSON 符合我们为 `\"Cat\"\
    ` 定义的 JSON Schema，包含了 `\"name\"`、`\"age\"` 和 `\"declawed\"` 必需字段。\n\n### 示例 4-7.\
    \ 不包含“description”字段的有效 JSON\n\n```json\n {\n  \"name\": \"Fluffy\",\n  \"age\"\
    : 2,\n  \"declawed\": false\n}\n```\n\n需要注意的是，如果你在 JSON schema 中不包含带有包含必需字段名称数组的\
    \ `\"required\"` 键值对，那么没有任何字段是必填的。一个内部没有任何键值对的 JSON 对象也将被认为是有效的。如果没有 `\"required\"\
    ` 数组，示例 4-8 中的 JSON 对于 `\"Cat\"` JSON Schema 来说是有效的。\n\n### 示例 4-8. 有效 JSON\n\n\
    ```json\n {}\n```\n\n我们可以用 JSON schema 回答的第三个也是最后一个问题是：值是否符合我要求的格式？我们回答了关于值类型的问题，但我们通常对类型有特定的格式要求。例如，我需要一个用户名，但用户名不应超过\
    \ 20 个字符。此外，我可能会让你想一个 10 到 100 之间的数字。我们可以在 JSON schema 中表达这些特定需求。\n\n在猫的 JSON\
    \ 中，我们有诸如名称为字符串、年龄为数字的要求。然而，我们不希望有人提供非常长的猫名、非常短的猫名，或者提供负数的猫年龄。在我们的 JSON schema\
    \ 中，我们可以为字符串定义最小长度和最大长度，为数字定义最小值。\n\n在示例 4-9 中，添加了验证，以确保猫的名字至少有 3 个字符，最多有 20 个字符。此外，我们还确保提交的猫年龄不是负数。\n\
    \n### 示例 4-9. 验证猫 JSON\n\n```json\n {\n  \"$schema\": \"http://json-schema.org/draft-04/schema#\"\
    ,\n  \"title\": \"Cat\",\n  \"properties\": {\n    \"name\": {\n      \"type\"\
    : \"string\",\n      \"minLength\": 3,\n      \"maxLength\" : 20\n    },\n   \
    \ \"age\": {\n      \"type\": \"number\",\n      \"description\": \"Your cat's\
    \ age in years.\",\n      \"minimum\" : 0\n    },\n    \"declawed\": {\n     \
    \ \"type\": \"boolean\"\n    },\n    \"description\": {\n      \"type\": \"string\"\
    \n    }\n  },\n  \"required\": [\n    \"name\",\n    \"age\",\n    \"declawed\"\
    \n  ]\n}\n```\n\n示例 4-10 中的 JSON 不符合 `\"Cat\"` JSON Schema，因为名称值超过了 `\"maxLength\"\
    `，且年龄值小于 `\"minimum\"`。\n\n### 示例 4-10. 无效 JSON\n\n```json\n {\n  \"name\": \"\
    Fluffy the greatest cat in the whole wide world\",\n  \"age\": -2,\n  \"declawed\"\
    : false,\n  \"description\" : \"Fluffy loves to sleep all day.\"\n}\n```\n\n示例\
    \ 4-11 中的 JSON 符合猫 JSON Schema，并满足对值的要求。\n\n### 示例 4-11. 此 JSON 是有效的\n\n```json\n\
    \ {\n  \"name\": \"Fluffy\",\n  \"age\": 2,\n  \"declawed\": false,\n  \"description\"\
    \ : \"Fluffy loves to sleep all day.\"\n}\n```\n\n如果回到将 schema 比作合同的比较，你可以发现我们合同的细节可以非常具体。本章提供的示例只是引入性的，仅仅是冰山一角。JSON\
    \ Schema 甚至支持正则表达式（字符模式，例如电子邮件地址格式）和枚举（可能值的列表）。如果你想成为 JSON Schema 的精通，请访问以下页面，你可以在那里找到规范的链接：\n\
    \n*   [JSON Schema 主页](http://json-schema.org/)\n*   [JSON Schema 验证规范](http://json-schema.org/latest/json-schema-validation.html)\n\
    \n针对特定编程语言和框架的 JSON Schema 库和项目列表很长且不断增长。如果你想将 JSON Schema 验证集成到项目中，在 Google 上搜索“JSON\
    \ Schema Validation [在此插入编程语言名称]”就能得到你需要的。此外，还有几个在线验证器，它们与编程语言无关，非常适合实验 JSON Schema：\n\
    \n*   [JSON Schema Lint](http://jsonschemalint.com/draft4/)\n*   [JSON Schema\
    \ Validator](http://www.jsonschemavalidator.net/)\n\n如果我进入 JSON Schema Lint 网站，将看到两个文本区域：一个用于\
    \ JSON schema，另一个用于待验证的 JSON 文档。如果我粘贴示例 4-9 中的 schema 和示例 4-10 中的 JSON。\n"
- fmt: "\nYour Internet browser has a relationship with websites, just like I have\
    \ the relationship with Pierre’s Fine Dining. This relationship is a bustling\
    \ world of *requests* and *responses*. I request a plate of food, and the kitchen\
    \ responds by creating the specific food I requested and sends it out to be delivered\
    \ to me.\n\nWhen you go to your favorite website to look at cute kitten pictures,\
    \ the Internet browser on your computer is the client and the computer that hosts\
    \ the cute kitten pictures is the server. Your Internet browser makes a request\
    \ that travels around the Internet until the computer behind the cute kitten picture\
    \ website receives it. The cute kitten website then serves up the page in a response\
    \ that gets sent back across the Internet. Your browser then renders the page\
    \ for you on the screen.\n\nIn this relationship, we draw a line in the sand and\
    \ say that everything sent in response by the cute kitten pictures website that\
    \ will be dealt with by the browser is called client-side code. In the restaurant\
    \ example, the response would be the plate of food and the table where I sit would\
    \ be the Internet browser. The table receives the plate of food and now I can\
    \ see it and consume it.\n\nWe then say that everything that happened before that\
    \ response page was sent, essentially the creation of it, is the server-side code.\
    \ In the restaurant example, the server-side code would be everything that happens\
    \ in the kitchen. I never go into the kitchen, and I don’t see what they are doing\
    \ in there to make my plate of food. The subtle difference between the restaurant\
    \ example and the real world is that the server is not the guy running back and\
    \ forth between the kitchen and the table. The kitchen is the server, and that\
    \ guy is the Internet.\n\nThe public doesn’t see what the cute kitten pictures\
    \ website is doing in its metaphorical kitchen. The site could be using PHP, or\
    \ ASP.NET, or any number of programming languages. Whatever it’s using in its\
    \ kitchen doesn’t matter to my browser, so long as the site hands over a response\
    \ with client-side code.\n\nThe response that I get from the site is a combination\
    \ of HTML, CSS, and JavaScript. Just like I can inspect everything at the table\
    \ in the restaurant, I can hit F12 in my browser, and using developer tools I\
    \ can see all the HTML, CSS, and JavaScript for the page. I can even see the JavaScript\
    \ code for that annoying flashing pop up with the dancing kittens.\n\nClient side\
    \ is everything happening in a user’s Internet browser, and server side is everything\
    \ that is happening on the server where the website is hosted. When client-side\
    \ code is referred to, it usually means JavaScript, HTML, or CSS. When server-side\
    \ code is referred to, it usually means server-side languages such as ASP.NET,\
    \ Ruby on Rails, or Java.\n\nNow let’s take a look at the important subject of\
    \ security concerns.\n\n# Cross-Site Request Forgery (CSRF)\n\nCross-site request\
    \ forgery, or CSRF (pronounced sea-surf), is an exploit that takes advantage of\
    \ a site’s trust in a user’s Internet browser. CSRF vulnerabilities have been\
    \ around a long time, way before JSON came into existence.\n\nAn example of a\
    \ CSRF exploit with JSON would be something like this.\n\nYou sign into a banking\
    \ website. This website has a JSON URL that includes some sensitive information\
    \ about you ([Example 5-1](#text00007.html_ex0501)).\n\n## Example 5-1. Your sensitive\
    \ information in JSON format\n\n```json\n[\n    {\n        \"user\": \"bobbarker\"\
    \n    },\n    {\n        \"phone\": \"555-555-5555\"\n    }\n]\n```\n\nYou might\
    \ think, “Hey, this JSON is missing its curly brackets!” This is valid JSON. Dangerous\
    \ valid JSON because it is also a valid JavaScript script. This is called a *top-level\
    \ JSON array*.\n\nThe example banking website uses authentication with session\
    \ cookies to make sure that this information is only given to you — the logged\
    \ in and registered user.\n\nThe bad guy in this example finds the URL to the\
    \ sensitive JSON data on the banking website and puts it in a `<script>` tag on\
    \ *his* own website. If you aren’t sure what a `<script>` tag is, you can find\
    \ them behind the scenes on most modern web pages. This is called the code-behind,\
    \ and it is an HTML document. If you go to your favorite website, right-click,\
    \ and select view source, you should find one or more tags that look like the\
    \ one shown in [Example 5-2](#text00007.html_ex0502).\n\n## Example 5-2. Example\
    \ of a <script> tag (the “src” attribute in this tag specifies where the script\
    \ is located)\n\n```html\n<script src=\"https://code.jquery.com/jquery-2.1.4.min.js\"\
    ></script>\n```\n\nInternet browsers have rules about sharing between websites\
    \ with different domains (`http://domainone.com` and `http://domaintwo.com` are\
    \ different domains). The bad guy uses the `<script>` tag because it is exempt\
    \ from those rules about sharing ([Example 5-3](#text00007.html_ex0503)). It is\
    \ often necessary and normal to use a script hosted by another website, so the\
    \ `<script>` tag gets an exception. The JSON is using a top-level array that makes\
    \ it valid JavaScript, so he gets away with it.\n\n## Example 5-3. Example of\
    \ what the <script> tag on the bad guy’s site might look like\n\n```html\n<script\
    \ src=\"https://www.yourspecialbank.com/user.json\"></script>\n```\n\nOne key\
    \ thing for this to work is your relationship with the bank’s website. Without\
    \ your relationship, the link in the `<script>` tag won’t return sensitive data.\
    \ That link doesn’t just host your sensitive data. It is a dynamic link, which\
    \ returns the sensitive data for the member that is logged in. When you log in\
    \ with the bank, you have initiated a relationship where the bank trusts that\
    \ you are who you say you are.\n\nThis exploit depends on that trust. In order\
    \ for the bad guy to exploit the trust, he needs you to come to his website that\
    \ has the stolen `<script>` tag while you are logged in to your bank. To achieve\
    \ this, the bad guy might send out a million emails to people that say, “There\
    \ is an important message for you on your banking website.” These emails will\
    \ often be formatted exactly like emails that people are familiar with from their\
    \ bank (or the website they are attempting to exploit). If they don’t check the\
    \ email headers to see who it’s from, or hover over the link to question if it’s\
    \ going to their trusted website’s real domain, then they will likely click it.\n\
    \nFor example’s sake, let’s pretend you were ill and not thinking clearly, so\
    \ you clicked on the link. Additionally, you didn’t log out of your banking site\
    \ last time you were there, so your session still exists. You are currently in\
    \ a state of the trust relationship with the bank. Once the page to the bad guy’s\
    \ site loads, you may realize that you’ve landed somewhere strange and leave.\
    \ By then it’s too late. The bad guy’s site was able to retrieve the sensitive\
    \ JSON data and send it back to its own servers and keep. Ouch.\n\nWhat could\
    \ the bank and its web developers have done differently to prevent a CSRF exploit?\n\
    \nTo start, the bank could have turned the array into a value in a JSON object.\
    \ This would make it invalid JavaScript. See [Example 5-4](#text00007.html_ex0504).\n\
    \n## Example 5-4. By wrapping the array in an object, it is no longer valid JavaScript\
    \ that can be loaded in a <script> tag\n\n```json\n{\n    \"info\": [\n      \
    \  {\n            \"user\": \"bobbarker\"\n        },\n        {\n           \
    \ \"phone\": \"555-555-5555\"\n        }\n    ]\n}\n```\n"
