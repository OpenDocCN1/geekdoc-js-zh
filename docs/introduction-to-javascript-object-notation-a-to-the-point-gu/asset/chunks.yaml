    # 前言


    在我作为网页开发者的历程中，我学到了一件事：无论我对这些主题在精神上多么投入，找到时间来投入却是另一回事。快速发展的技术世界不在乎任何人有多忙。它不会说：“放松，慢慢学习，我理解你有家庭，安静的学习时间很难得。”它说的是：“不断进化，否则就会被淘汰。”


    我在写这本书时牢记这一情感。这本书很薄——它有意避开了诸如“JSON 的历史”之类的主题。


    虽然我感谢道格拉斯·克罗克福德发现 JSON，但我没有提及他或 JSON 演变成今天这个样子的那些岁月。这本书是关于*它今天的模样*的。如果你想了解 JSON
    的历史，维基百科有一个[优秀的概述](https://en.wikipedia.org/wiki/JSON#History)。


    本书旨在直击 JSON 的核心。它旨在简洁明了，让你快速上手。它是为忙碌的 IT 专业人士写的。


    ## 读者对象


    在写这本书时，我也在思考你是谁。你可能是一个前端开发新手。或者你可能已经专注于服务器端 Web 应用开发多年，现在需要为 Web API 学习 JSON。你可能是
    `PHP`、`Ruby`、`C`、`Java` 或 `ASP.NET` 开发者。这个列表还在继续。很多不同角色的人都想并且需要学习 JSON。


    在本书中，我避免过多的术语，并为刚接触 Web 编程的读者解释先决概念。我尽量照顾到所有人。但是，我必须对您已有的知识做一些假设。如果您是 Web 开发的新手，这本书不应该是您拿起的第一本书。


    我假设您至少具备以下基础知识：


    *   HTML


    > 您了解 HTML 的用途，能够识别 HTML 文档的结构以及至少一些标签。


    *   JavaScript


    > 您了解 JavaScript 的用途，知道 `<script>` 标签、函数和变量是什么。如果您只是初学者也没关系。我的代码示例保持简单。


    *   编程概念


    > 我将为您提供了关于对象和数组等概念的快速解释，供需要复习的新手参考。但是，如果您尚未使用*任何*编程语言，这本书不是您起步的地方。


    ## JSON 的学习方法


    这些年来，我无数次需要学习新技术，往往是在有截止日期的项目中。我买大部头的书，浏览教程，试图吸收足够的信息以知道自己正在做什么。当我浏览数百页时，我在寻找这三个基本问题的答案：


    *   它是什么？

    *   我如何使用它？

    *   坏人如何利用它？


    写这本书时，我力求直击这些问题的要点，这样您就不必费力寻找答案。


    在第 1 –4 章中，我们将从底层探索 JSON。首先，我将回答“它是什么？”这个终极问题。然后，我们将学习语法、语法验证、数据类型和模式验证。


    在第 5 章中，我们将探讨安全相关的重要主题。本章包括对客户端和服务器端概念的入门介绍，这些概念对本书其余部分很重要。本章将回答“坏人如何利用它？”这个问题。


    其余章节探讨 JSON 作为数据交换格式所扮演的多种角色。这些章节旨在回答“我如何使用它？”这个问题。


    这些章节包含许多 JSON 示例以及与 JSON 交互的技术。关于第 6 –9 章，需要注意以下几点：


    > 技术

    > 我高级别地介绍几种技术，如 `jQuery`、`AngularJS` 和 `CouchDB`。每个主题都大到可以（并且已经）写成整本书。我有意省略了这些技术的安装说明和更深入的解释。重点是让您了解这些技术如何使用
    JSON。如果您想尝试这些技术的示例，您需要做一些准备工作来搭建环境。不过，这些示例很简单。如果您能在基本层面上运行它们，就应该能够试一试。


    > 代码示例

    > 在本书中您会看到许多代码示例，其中有些可能使用您不熟悉的编程语言。这些语言的语法不会被解释。如果您不理解语法，请不要惊慌。重点是让您“了解大意”，而代码的作用会在说明中给出。本书使用的所有代码示例均可在此书的
    [GitHub 仓库](https://github.com/lindsaybassett/json) 中找到。


    第 6 –9 章的最终目的是向您展示 JSON 在当今世界是如何使用的，并激发您在自己的项目中思考。如果您从未见过 JSON 用作文档存储数据库中的文档，您会想到在项目中使用它吗？知道是一半的战斗。


    在每一章中，我们力求在简洁和提供足够信息之间取得平衡，以免您的学习留下大的空白。最终，整本书的结构旨在让您快速上手 JSON，同时不牺牲对 JSON 是什么及其可能用途的深入理解。


    ## 本书使用的约定


