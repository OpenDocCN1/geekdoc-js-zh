  trans: "\n在 PHP 和 ASP.NET 的示例中，我们可以看到，虽然 JSON 基于 JavaScript 语言的对象字面量表示法，但该表示法可以很好地转换为其他编程语言的对象。由于服务器端编程语言种类繁多且多样化，其中许多语言都支持对象和\
    \ JSON 的数据类型。这是理想的，因为它允许数据结构或“形状”在作为 JSON 在系统内外传输时保持不变。\n\n此外，服务器端对 JSON 的支持非常广泛。大多数服务器端语言（或框架）都提供内置的\
    \ JSON 序列化/反序列化支持，或者有可用的库或模块。服务器端对 JSON 的这种支持促成了它作为数据交换格式的成功。\n\n让我们看几个服务器端 JSON\
    \ HTTP 请求的小例子。在每个示例中，你将看到一个针对 JSON 资源的 HTTP 请求，将该资源解析为对象，以及从 JSON 文档中渲染一个值。\n\n\
    所有这些示例中的 JSON 文档都将来自 OpenWeatherMap API。所有值的渲染都将基于 `http://api.openweathermap.org/data/2.5/weather?q=London,uk`\
    \ 上 JSON 资源的子集（参见示例 9-17）。\n\n### 示例 9-17。OpenWeatherMap API 天气数据 JSON 资源的坐标对象；这表示英国伦敦的纬度和经度\n\
    \n```\n {\n    \"coord\": {\n        \"lon\": -0.13,\n        \"lat\": 51.51\n\
    \    }\n}\n```\n\n## Ruby on Rails\n\nRuby on Rails 是一个服务器端 Web 应用框架。它使用 Ruby\
    \ 编程语言编写，并基于模型-视图-控制器（MVC）架构。\n\n在 Ruby 中，gem 是用于安装程序或库的软件包。要在 Ruby on Rails 中序列化和反序列化\
    \ JSON，需要 JSON ruby gem。一旦安装了 JSON gem，解析 JSON 就和 `JSON.parse()` 一样简单（参见示例 9-18）。\n\
    \n在示例 9-18 中，我们向 OpenWeatherMap API 发出 HTTP 请求，并将 JSON 反序列化为 Ruby 对象。最后，在代码的最后一行，我们从数据的坐标（`coord`）对象中渲染经度（`lon`）。\n\
    \n### 示例 9-18。向 OpenWeatherMap API 发出 HTTP 请求\n\n```\n require 'net/http'\nrequire\
    \ 'json'\n\nurl = URI.parse('http://api.openweathermap.org/data/2.5/weather?q=London,uk')\n\
    request = Net::HTTP::Get.new(url.to_s)\nresponse = Net::HTTP.start(url.host, url.port)\
    \ {|http|\nhttp.request(request)\n}\n\nweatherData = JSON.parse(response.body)\n\
    \nrender text: weatherData[\"coord\"][\"lon\"]\n```\n\n## Node.js\n\nNode.js 是服务器端的\
    \ JavaScript（无需 Web 浏览器），它基于 Google 开源的 V8 JavaScript 引擎实现。使用 Node.js，你可以用 JavaScript\
    \ 构建服务器端应用程序。\n\n在本书早些时候，我们介绍了客户端 JavaScript 中的 JSON，并看到 JSON 通过简单的 `JSON.parse()`\
    \ 反序列化为 JavaScript 对象。在 Node.js 中也是如此，因为它*是* JavaScript。\n\n但是，在 Node.js 中我们不使用\
    \ `XMLHttpRequest` 对象，因为它是一个特定于 Web 浏览器的 JavaScript 对象。在 Node.js 中，我们可以用一个名称更好的函数\
    \ `get()` 来请求 JSON（和其他类型的资源）。\n\n在示例 9-19 中，我们向 OpenWeatherMap API 发出 HTTP 请求，并将\
    \ JSON 反序列化为 JavaScript 对象。然后我们使用 `console.log()` 从数据的坐标（`coord`）对象中打印经度（`lon`）。\n\
    \n### 示例 9-19。向 API 发出 HTTP 请求并反序列化为 JavaScript 对象\n\n```\n var http = require('http');\n\
    http.get({\n    host: 'api.openweathermap.org',\n    path: '/data/2.5/weather?q=London,uk'\n\
    }, function(response) {\n    var body = '';\n    response.on('data', function(data)\
    \ {\n        body += data;\n    });\n    response.on('end', function() {\n   \
    \     var weatherData = JSON.parse(body);\n        console.log(weatherData.coord.lon);\n\
    \    });\n});\n```\n\n## Java\n\nJava 是一种面向对象的编程语言。Java 可以作为 Java 小程序在 Web 浏览器中运行，也可以在装有\
    \ Java 运行时环境（JRE）的机器上独立运行。\n\nJava 中有许多支持 JSON 的库。在本节中，我将使用以下库从 URL 获取 JSON 资源并将其反序列化为\
    \ Java 中的对象：\n\n*   [Apache Commons IO](https://commons.apache.org/proper/commons-io/)\n\
    *   [Java 中的 JSON](http://www.json.org/java/)\n\n在示例 9-20 中，我们从 OpenWeatherMap\
    \ API 获取 JSON 资源作为字符串。之后，我们通过实例化 `JSONObject` 来反序列化 JSON 字符串。然后我们使用 `System.out.println()`\
    \ 从数据的坐标（`coord`）对象中打印经度（`lon`）。\n\n### 示例 9-20。使用 JSONObject 反序列化 JSON 字符串\n\n\
    ```\n import java.io.IOException;\nimport java.net.URL;\n\nimport org.apache.commons.io.IOUtils;\n\
    import org.json.JSONException;\nimport org.json.JSONObject;\n\npublic class HelloWorldApp\
    \ {\n\n    public static void main(String[] args) throws IOException, JSONException\
    \ {\n        String url = \"http://api.openweathermap.org/data/2.5/weather?q=London,uk\"\
    ;\n        String json = IOUtils.toString(new URL(url));\n        JSONObject weatherData\
    \ = new JSONObject(json);\n        JSONObject coordinates = weatherData.getJSONObject(\"\
    coord\");\n        System.out.println(coordinates.get(\"lon\"));\n    }  \n\n\
    }\n```\n\n## 关键术语和概念\n\n本章涵盖以下关键术语：\n\n> ASP.NET\n> 一种由微软开发的服务器端 Web 框架。\n\n>\
    \ PHP\n> 一种用于制作动态网页的服务器端脚本语言。\n\n> Ruby on Rails\n> 运行在 Ruby 上的服务器端 Web 应用框架。\n\
    \n> Node.js\n> 在 Google 的 V8 JavaScript 引擎上运行的服务器端 JavaScript。\n\n> Java\n> 一种面向对象的编程语言。\n\
    \n我们还讨论了以下关键概念：\n\n*   在服务器端，JSON 可以反序列化为对象以用于编程逻辑，也可以从对象序列化为 JSON 格式。\n*   JSON\
    \ 在客户端和服务器端*两者*都有大量的支持，这使其成为一种非常成功的 Web 数据交换格式。\n\n## 读累了记得休息一会哦~\n\n**公众号：古德猫宁李**\n\
    \n*   电子书搜索下载\n*   书单分享\n*   书友学习交流\n\n**网站：**[沉金书屋 https://www.chenjin5.com](https://www.chenjin5.com)\n\
    \n*   电子书搜索下载\n*   电子书打包资源分享\n*   学习资源分享\n\n# 第 10 章 结论\n\n从大约 6000 英尺的高度，我们可以看到\
    \ JSON 在世界中穿梭，在系统之间携带数据。JSON 作为数据交换格式表现出色，我们在这本书中已经看到了这一点。然而，如果你用双筒望远镜仔细观察，你会发现\
    \ JSON 在某些地方只是停留在原地。\n\n尽管存在 JSON 在某些地方停留的现象，但本书大部分忽略了这个主题。重点一直放在双方之间的数据交换上。从本质上讲，是数据的移动。\n\
    \nJSON 可以既是数据的容器也是数据的载体，它不局限于单一目的。我们通过 JSON 在 NoSQL 中的角色看到了这一点。越来越多的项目和应用开始使用\
    \ JSON 作为非常实用的工具。为了进一步说明，让我们最后看一下 JSON 在当今世界中扮演的另一个角色：作为配置文件停留在某个地方。\n\n### JSON\
    \ 作为配置文件\n\n在第 9 章中，我们探索了两种支持解析 JSON 的服务器端 Web 技术。正如该章所讨论的，JSON 被大多数服务器端 Web 语言（或框架）广泛支持。由于广泛的支持、在服务器上易于解析以及人类可读性，使用\
    \ JSON 存储配置数据已变得流行。\n\n配置文件或设置文件在软件中经常使用，这样可以在不重新编译的情况下更改设置。配置文件有多种格式，包括 INI 和\
    \ XML。\n"
- fmt: "\n## Storing Settings in INI, XML, and JSON\n\nLet’s take a look at how we\
    \ could store the same settings information in INI, XML, and JSON format (in Examples\
    \ [10-1](#text00012.html_ex1001) , [10-2](#text00012.html_ex1002) , and [10-3](#text00012.html_ex1003)\
    \ , respectively).\n\n### Example 10-1. INI Format (`settings.ini`)\n\n```\n [general]\n\
    playIntro=false\nmouseSensitivity=0.54\n\n[display]\ncomplexTextures=true\nbrightness=4.2\n\
    widgetsPerFrame=326\nmode=windowed\n\n[sound]\nvolume=1\neffects=0.68\n```\n\n\
    ### Example 10-2. XML Format (`settings.xml`)\n\n```\n <?xml version=\"1.0\" encoding=\"\
    UTF-8\" ?>\n<settings>\n    <general>\n        <playIntro>false</playIntro>\n\
    \        <mouseSensitivity>0.54</mouseSensitivity>\n    </general>\n    <display>\n\
    \        <complexTextures>true</complexTextures>\n        <brightness>4.2</brightness>\n\
    \        <widgetsPerFrame>326</widgetsPerFrame>\n    </display>\n    <sound>\n\
    \        <volume>1</volume>\n        <effects>0.68</effects>\n    </sound>\n</settings>\n\
    ```\n\n### Example 10-3. JSON Format (`settings.json`)\n\n```\n {\n    \"general\"\
    : {\n        \"playIntro\": false,\n        \"mouseSensitivity\": 0.54\n    },\n\
    \    \"display\": {\n        \"complexTextures\": true,\n        \"brightness\"\
    : 4.2,\n        \"widgetsPerFrame\": 326,\n        \"mode\": \"windowed\"\n  \
    \  },\n    \"sound\": {\n        \"volume\": 1,\n        \"effects\": 0.68\n \
    \   }\n}\n```\n\n### Advantages and Disadvantages\n\nAll three of these formats\
    \ are human readable. If I wanted to change my sound settings, I could quickly\
    \ locate this in each of the files and change the numbers. This is what makes\
    \ them great for configuration files.\n\nEach of these formats has its own pros\
    \ and cons. The INI file is easier for a human to read since it’s lacking the\
    \ less-than and greater-than symbols of the XML and the curly brackets and double\
    \ quotes of JSON. The INI is not so great for more complex data, such as nested\
    \ information or complex lists. XML can accommodate more complex data, but it\
    \ does not have data types like JSON.\n\nIn addition to the pros and cons for\
    \ each data format, ease of parsing by the language/framework being used is also\
    \ important to consider. If a JSON parser is already being used heavily by your\
    \ application, then JSON may be the best fit for your configuration file.\n\n\
    In [Chapter 9](#text00011.html_chapter_jsonserverside) , we took a brief look\
    \ at Node.js with JSON on the server side. A good real-world example of JSON as\
    \ a configuration file is the JavaScript package manager that is the default for\
    \ Node.js: `npm`. It is also used by other frameworks such as AngularJS and jQuery.\n\
    \n### JSON as a Configuration File\n\nThe `npm` package manager uses JSON as a\
    \ configuration file called `package.json`. The `package.json` file contains information\
    \ specific to each package, such as the name, version, author, contributors, dependencies,\
    \ scripts, and licensing (see [Example 10-4](#text00012.html_ex1004) ).\n\n###\
    \ Example 10-4. An example `package.json` file for `npm`\n\n```\n {\n  \"name\"\
    : \"bobatron\",\n  \"version\": \"1.0.0\",\n  \"description\": \"The extraordinary\
    \ library of Bob.\",\n  \"main\": \"bob.js\",\n  \"scripts\": {\n    \"prepublish\"\
    : \"coffee -o lib/ -c src/bob.coffee\"\n  },\n  \"repository\": {\n    \"type\"\
    : \"git\",\n    \"url\": \"git://github.com/bobatron/bob.git\"\n  },\n  \"keywords\"\
    : [\n    \"bob\",\n    \"tron\"\n  ],\n  \"author\": \"Bob Barker <bob.barker@fakemail.com>\
    \ (http://bob.com/)\",\n  \"license\": \"BSD-3-Clause\",\n  \"bugs\": {\n    \"\
    url\": \"https://github.com/bobatron/issues\"\n  }\n}\n```\n\nThough JSON is sitting\
    \ in one place as a configuration file, it is still playing the role of a data\
    \ interchange format. In the case of a settings file that sits in a directory\
    \ somewhere, the interchange is happening between the human and the computer.\
    \ The data is communicated.\n\n## The Big Picture\n\nAs a configuration file sitting\
    \ on a server, or a resource being requested by a URL, JSON is doing its job as\
    \ a data interchange format. We’ve explored these jobs (or roles) in the chapters\
    \ of this book.  Let’s do a big picture recap of how JSON is being used out in\
    \ the world today.\n\nOn the server side, objects can be serialized to the JSON\
    \ text format, and deserialized back into an object. JSON can also be requested\
    \ from the server-side code. We saw this in action with both the ASP.NET and PHP\
    \ examples discussed in [Chapter 9](#text00011.html_chapter_jsonserverside) .\n\
    \nAdditionally, JSON is a text format that can also be used as a document for\
    \ a document store type of database. We saw this in [Chapter 8](#text00010.html_chapter_nosql)\
    \ with CouchDB. This database was also interfaced with through an HTTP web API.\n\
    \nAn HTTP web API provides a request and response system for resources such as\
    \ HTML and JSON documents. These documents are requested via HTTP with a URL.\
    \ We also saw this in [Chapter 6](#text00008.html_chapter_Jsxmlhttp) with the\
    \ OpenWeatherMap API providing weather data as JSON resources.\n\nThe JavaScript\
    \ `XmlHttpRequest` can request a JSON resource from a URL. To use the JSON in\
    \ the JavaScript code, we must deserialize the JSON to a JavaScript object. This\
    \ is quickly achieved with the built-in JavaScript `JSON.parse()` function.\n\n\
    From a JavaScript object, to the JSON format, to an object on the server, we can\
    \ see the data move full circle. Every day data moves in and out of systems around\
    \ the world, and that data is in an interchange format.\n\nIf we again take a\
    \ look from 6,000 feet, we can see that JSON is not alone as a data interchange\
    \ format. Some data is being moved around in a comma-separated values (CSV) format,\
    \ or an Excel format. Both are tabular. Other data is being moved in an XML format,\
    \ which supports nesting of data.\n\nData has many formats, and many shapes. Systems\
    \ that push out and receive data in these formats are diverse. Both the shape\
    \ of the data and the systems interchanging the data have to be considered when\
    \ choosing a format for data interchange. As much as this book loves JSON and\
    \ views it as a fantastic format for data, JSON is not always the answer.\n\n\
    For example, let’s say two systems needed to communicate inventory data, and those\
    \ two systems both stored that information in a tabular format. Would it make\
    \ sense to convert that tabular data into an object format, serialize to JSON,\
    \ convert back into an object format, and then back into tabular data again? No,\
    \ in that case we’d be adding extra steps just for the sake of JSON. A more appropriate\
    \ format for this data would be a tabular one, such as CSV or tab delimited.\n\
    \nJSON is a popular format for data interchange because many systems are modeling\
    \ data as objects. The data is often being stored in a relational database. Though\
    \ the tables of relational databases are tabular, the relationships in the data\
    \ are broken out into entities that can be seen as objects. Each entity, such\
    \ as an address, has “fields” that are essentially name-value pairs.\n\nIn systems\
    \ such as an Internet browser, where JavaScript supports object-oriented programming,\
    \ JSON is ideal for interchanging data. JSON is great in JavaScript for communicating\
    \ with web APIs and creating AJAX interactions.\n\nIn systems such as a server-side\
    \ web framework that is object oriented, JSON is ideal for interchanging data.\
    \ JSON shines for data by maintaining its structure as an object literal as it\
    \ moves in and out of the system.\n\nLike the example in [“JSON as a Configuration\
    \ File”](#text00012.html_json_as_config_file) , the pros and cons must be examined\
    \ for choosing a format. It all boils down to the right tool for the right job.\n\
    \n## Index\n\n### Symbols\n\n*   \" \" (quotation marks, double)\n\n    *   enclosing\
    \ string values in JSON , [The JSON String Data Type](#text00005.html_idp2136320)\n\
    \n    *   in JSON name-value pairs , [Proper JSON Syntax](#text00004.html_idp3346384)\n\
    \n    *   in JSON strings , [Proper JSON Syntax](#text00004.html_idp3026448)\n\
    \n    *   inside JSON strings , [The JSON String Data Type](#text00005.html_idp2147984)\n\
    \n*   $ (dollar sign) , [The JSON Number Data Type](#text00005.html_idp3978304)\n\
    \n*   ' ' (quotation marks, single)\n"
  raw: "Let’s take a look at how we could store the same settings information in INI,\
    \ XML, and JSON format (in Examples [10-1](#text00012.html_ex1001) , [10-2](#text00012.html_ex1002)\
    \ , and [10-3](#text00012.html_ex1003) , respectively).\n\n##### Example 10-1.\
    \ An example of a game settings file in INI format (settings.ini)\n\n```\n [general]\n\
    playIntro=false\nmouseSensitivity=0.54\n\n[display]\ncomplexTextures=true\nbrightness=4.2\n\
    widgetsPerFrame=326\nmode=windowed\n\n[sound]\nvolume=1\neffects=0.68\n```\n\n\
    ##### Example 10-2. An example of a game settings file in XML format (settings.xml)\n\
    \n```\n <?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<settings>\n    <general>\n\
    \        <playIntro>false</playIntro>\n        <mouseSensitivity>0.54</mouseSensitivity>\n\
    \    </general>\n    <display>\n        <complexTextures>true</complexTextures>\n\
    \        <brightness>4.2</brightness>\n        <widgetsPerFrame>326</widgetsPerFrame>\n\
    \    </display>\n    <sound>\n        <volume>1</volume>\n        <effects>0.68</effects>\n\
    \    </sound>\n</settings>\n```\n\n##### Example 10-3. An example of a game settings\
    \ file in JSON format (settings.json)\n\n```\n {\n    \"general\": {\n       \
    \ \"playIntro\": false,\n        \"mouseSensitivity\": 0.54\n    },\n    \"display\"\
    : {\n        \"complexTextures\": true,\n        \"brightness\": 4.2,\n      \
    \  \"widgetsPerFrame\": 326,\n        \"mode\": \"windowed\"\n    },\n    \"sound\"\
    : {\n        \"volume\": 1,\n        \"effects\": 0.68\n    }\n}\n```\n\nAll three\
    \ of these formats are human readable. If I wanted to change my sound settings,\
    \ I could quickly locate this in each of the files and change the numbers. This\
    \ is what makes them great for configuration files.\n\nEach of these formats has\
    \ its own pros and cons. The INI file is easier for a human to read since it’s\
    \ lacking the less-than and greater-than symbols of the XML and the curly brackets\
    \ and double quotes of JSON. The INI is not so great for more complex data, such\
    \ as nested information or complex lists. XML can accommodate more complex data,\
    \ but it does not have data types like JSON.\n\nIn addition to the pros and cons\
    \ for each data format, ease of parsing by the language/framework being used is\
    \ also important to consider. If a JSON parser is already being used heavily by\
    \ your application, then JSON may be the best fit for your configuration file.\n\
    \nIn [Chapter 9](#text00011.html_chapter_jsonserverside) , we took a brief look\
    \ at Node.js with JSON on the server side. A good real-world example of JSON as\
    \ a configuration file is the JavaScript package manager that is the default for\
    \ Node.js: npm. It is also used by other frameworks such as AngularJS and jQuery.\n\
    \nThe npm package manager uses JSON as a configuration file called *package.json*\
    \ . The *package.json* file contains information specific to each package, such\
    \ as the name, version, author, contributors, dependencies, scripts, and licensing\
    \ (see [Example 10-4](#text00012.html_ex1004) ).\n\n##### Example 10-4. An example\
    \ package.json file for npm\n\n```\n {\n  \"name\": \"bobatron\",\n  \"version\"\
    : \"1.0.0\",\n  \"description\": \"The extraordinary library of Bob.\",\n  \"\
    main\": \"bob.js\",\n  \"scripts\": {\n    \"prepublish\": \"coffee -o lib/ -c\
    \ src/bob.coffee\"\n  },\n  \"repository\": {\n    \"type\": \"git\",\n    \"\
    url\": \"git://github.com/bobatron/bob.git\"\n  },\n  \"keywords\": [\n    \"\
    bob\",\n    \"tron\"\n  ],\n  \"author\": \"Bob Barker <bob.barker@fakemail.com>\
    \ (http://bob.com/)\",\n  \"license\": \"BSD-3-Clause\",\n  \"bugs\": {\n    \"\
    url\": \"https://github.com/bobatron/issues\"\n  }\n}\n```\n\nThough JSON is sitting\
    \ in one place as a configuration file, it is still playing the role of a data\
    \ interchange format. In the case of a settings file that sits in a directory\
    \ somewhere, the interchange is happening between the human and the computer.\
    \ The data is communicated.\n\n# The Big Picture\n\nAs a configuration file sitting\
    \ on a server, or a resource being requested by a URL, JSON is doing its job as\
    \ a data interchange format. We’ve explored these jobs (or roles) in the chapters\
    \ of this book.  Let’s do a big picture recap of how JSON is being used out in\
    \ the world today.\n\nOn the server side, objects can be serialized to the JSON\
    \ text format, and deserialized back into an object. JSON can also be requested\
    \ from the server-side code. We saw this in action with both the ASP.NET and PHP\
    \ examples discussed in [Chapter 9](#text00011.html_chapter_jsonserverside) .\n\
    \nAdditionally, JSON is a text format that can also be used as a document for\
    \ a document store type of database. We saw this in [Chapter 8](#text00010.html_chapter_nosql)\
    \ with CouchDB. This database was also interfaced with through an HTTP web API.\n\
    \nAn HTTP web API provides a request and response system for resources such as\
    \ HTML and JSON documents. These documents are requested via HTTP with a URL.\
    \ We also saw this in [Chapter 6](#text00008.html_chapter_Jsxmlhttp) with the\
    \ OpenWeatherMap API providing weather data as JSON resources.\n\nThe JavaScript\
    \ `XmlHttpRequest` can request a JSON resource from a URL. To use the JSON in\
    \ the JavaScript code, we must deserialize the JSON to a JavaScript object. This\
    \ is quickly achieved with the built-in JavaScript `JSON.parse()` function.\n\n\
    From a JavaScript object, to the JSON format, to an object on the server, we can\
    \ see the data move full circle. Every day data moves in and out of systems around\
    \ the world, and that data is in an interchange format.\n\nIf we again take a\
    \ look from 6,000 feet, we can see that JSON is not alone as a data interchange\
    \ format. Some data is being moved around in a comma-separated values (CSV) format,\
    \ or an Excel format. Both are tabular. Other data is being moved in an XML format,\
    \ which supports nesting of data.\n\nData has many formats, and many shapes. Systems\
    \ that push out and receive data in these formats are diverse. Both the shape\
    \ of the data and the systems interchanging the data have to be considered when\
    \ choosing a format for data interchange. As much as this book loves JSON and\
    \ views it as a fantastic format for data, JSON is not always the answer.\n\n\
    For example, let’s say two systems needed to communicate inventory data, and those\
    \ two systems both stored that information in a tabular format. Would it make\
    \ sense to convert that tabular data into an object format, serialize to JSON,\
    \ convert back into an object format, and then back into tabular data again? No,\
    \ in that case we’d be adding extra steps just for the sake of JSON. A more appropriate\
    \ format for this data would be a tabular one, such as CSV or tab delimited.\n\
    \nJSON is a popular format for data interchange because many systems are modeling\
    \ data as objects. The data is often being stored in a relational database. Though\
    \ the tables of relational databases are tabular, the relationships in the data\
    \ are broken out into entities that can be seen as objects. Each entity, such\
    \ as an address, has “fields” that are essentially name-value pairs.\n\nIn systems\
    \ such as an Internet browser, where JavaScript supports object-oriented programming,\
    \ JSON is ideal for interchanging data. JSON is great in JavaScript for communicating\
    \ with web APIs and creating AJAX interactions.\n\nIn systems such as a server-side\
    \ web framework that is object oriented, JSON is ideal for interchanging data.\
    \ JSON shines for data by maintaining its structure as an object literal as it\
    \ moves in and out of the system.\n\nLike the example in [“JSON as a Configuration\
    \ File”](#text00012.html_json_as_config_file) , the pros and cons must be examined\
    \ for choosing a format. It all boils down to the right tool for the right job.\n\
    \n# Index\n\n### Symbols\n\n*   \" \" (quotation marks, double)\n\n    *   enclosing\
    \ string values in JSON , [The JSON String Data Type](#text00005.html_idp2136320)\n\
    \n    *   in JSON name-value pairs , [Proper JSON Syntax](#text00004.html_idp3346384)\n\
    \n    *   in JSON strings , [Proper JSON Syntax](#text00004.html_idp3026448)\n\
    \n    *   inside JSON strings , [The JSON String Data Type](#text00005.html_idp2147984)\n\
    \n*   $ (dollar sign) , [The JSON Number Data Type](#text00005.html_idp3978304)\n\
    \n*   ' ' (quotation marks, single)"
