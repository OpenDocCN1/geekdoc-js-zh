  trans: "\n我本可以做些什么来防止这种情况？首先，我可以采取措施在我的消息中禁用 HTML。这可能涉及客户端和服务器端的验证。此外，我可以确保消息中包含的任何\
    \ HTML 字符都被转义，这样像 `<div>` 这样的 HTML 字符在页面上显示为 `&lt;div&gt;`（`&lt;div&gt;` 不作为有效的\
    \ HTML 解析）。这些措施将针对我在架构中使用的客户端和服务器代码。\n\n大多数注入攻击都涉及一种在构建时没有考虑到一个重要问题的架构：坏人会如何利用这一点？在\
    \ JSON 中允许 HTML 并直接在页面上显示值似乎是一个看似无害的架构决策。在防止注入攻击时，关键在于透彻地思考可能的利用方式，并采取额外的（有时是艰巨的）步骤来防止它们。\n\
    \n# 关键术语与概念\n\n本章涵盖了以下关键术语：\n\n### 服务端（Web 开发中）\n> 在服务器后台进行的操作，服务器正在请求页面或资源。服务器提供互联网浏览器处理和/或加载的响应。\n\
    \n### 客户端（Web 开发中）\n> 从请求的页面加载开始，在互联网浏览器中进行的操作。这通常是 HTML、CSS 和 JavaScript。\n\n\
    ### 跨站请求伪造 (CSRF)\n> 利用网站对用户浏览器的信任的一种利用手段。\n\n### 顶层 JSON 数组\n> 存在于键值对之外且位于文档顶层的\
    \ JSON 数组。\n\n### 注入攻击\n> 一种依赖于向 Web 应用程序注入数据的攻击，以促进恶意数据的执行或解释。\n\n### JSON 跨站脚本\
    \ (XSS) 攻击\n> 一种注入攻击，通过拦截或替换第三方提供给网站的 JSON 为恶意脚本来利用一个无害的网站。\n\n我们还讨论了这些核心概念：\n\
    \n* JSON 本身并不是威胁。它只是文本。\n* 记住以下三点，以解决 JSON 的安全担忧：\n    * 不要使用顶层数组。顶层数组是有效的 JavaScript，可以在\
    \ `<script>` 标签中链接并使用。\n    * 对于不面向公众的 JSON，使用 HTTP `POST` 代替 `GET`。HTTP `GET`\
    \ 请求可以链接到 URL 中并放置在 `<script>` 标签中。\n    * 使用 `JSON.parse()` 代替 `eval()`。`eval()`\
    \ 函数将编译并执行传入的字符串，这会让你的代码容易受到攻击。`JSON.parse()` 只解析 JSON。\n* 安全漏洞通常是通过架构决策引入的，而这些决策没有询问“坏人如何利用这一点？”这个基础问题。\n\
    \n# 第 6 章：JavaScript XMLHttpRequest 和 Web APIs\n\nJavaScript `XMLHttpRequest`\
    \ 和 Web APIs 可能很难快速读出三次，但它实际上并没有听起来那么复杂。这是一种简单的客户端与服务器的关系。JavaScript `XMLHttpRequest`\
    \ 是发送请求的客户端，而 Web API 是发送响应的服务器。\n\n在上一章讨论的客户端-服务器餐厅示例中，我将服务器称为厨房，将客户端称为客户。本章将关注一种厨房以及这种厨房是如何运作的。\n\
    \n不言而喻，并不是所有的餐厅都以此相同的方式。在某些餐厅，你可以开车到窗边点餐。有些餐厅向公众开放，而另一些可能仅作为大型公司园区内部的食堂。\n\n我们大多数人参与的一种客户端-服务器关系是冲浪互联网。通常我们认为自己是在正在旅行或在互联网上探索。事实上，我们通常是坐在那里盯着屏幕。互联网浏览器也没有去哪里。它就停在那里，就像坐在餐厅的桌旁一样，发送请求并接收响应。一旦服务器给了我们响应，它就对我们完成了，并转向另一个发送请求的实体。\n\
    \n浏览器发出的请求是针对某种资源的。当我们“冲浪互联网”时，我们要么点击带有 URL 的链接，要么直接在浏览器中输入 URL。URL 代表通用资源定位符（Universal\
    \ Resource Locator）。我们在浏览时使用的 URL 用于定位 HTML 资源，这使我们看到自己的网站，包括那个有可爱猫咪图片的网站。在这种场景下，我们请求的资源的内容类型为\
    \ `text/html`。\n\n另一种不直接涉及人类的客户端-服务器关系是 Web API。Web API 像网站一样通过 HTTP 提供内容，但它不是为了人类的眼睛设计的。你可以将其想象为一家为代码服务的餐厅，因为对这些服务器的大多数请求是由代码发出的。\n\
    \n编程代码通常不会像我们一样点可爱猫咪的照片来看。它的胃口通常由请求数据组成。本章介绍一种点 JSON（内容类型为 `application/json`\
    \ 的资源）的客户端，以及招待这些客户的餐厅类型：Web APIs。\n\n让我们先来看看 Web APIs，以及 JSON 在 Web API 中扮演的角色。\n\
    \n# Web APIs\n\n与人类不同，代码没有想要阅读文章或查看图片的双眼。代码需要以它能够读取（解析）的格式查看那个“某物”。这就是数据交换格式（如示例\
    \ 6-1 所示所示）发挥作用的地方。\n\n### 示例 6-1。来自 OpenWeatherMap Web API 的 JSON 天气数据\n\n```json\n\
    \    \"dt\": 1433383200,\n    \"temp\": {\n        \"day\": 293.5,\n        \"\
    min\": 293.5,\n        \"max\": 293.5,\n        \"night\": 293.5,\n        \"\
    eve\": 293.5,\n        \"morn\": 293.5\n    },\n    \"pressure\": 1015.06,\n \
    \   \"humidity\": 98,\n    \"weather\": [\n        {\n            \"id\": 802,\n\
    \            \"main\": \"Clouds\",\n            \"description\": \"scattered clouds\"\
    ,\n            \"icon\": \"03n\"\n        }\n    ],\n    \"speed\": 2.86,\n  \
    \  \"deg\": 134,\n    \"clouds\": 44\n}\n```\n\nJSON 天气数据示例可以被任何能够解析 JSON 的代码“读取”。此\
    \ JSON 可以通过 URL 请求（代码示例是完整 JSON 文档的子集）：\n\n> *http://api.openweathermap.org/data/2.5/forecast/daily?lat=35&lon=139&cnt=10&mode=json*\n\
    \n虽然像 OpenWeatherMap 这样的许多公共 Web API 用于“读取”，但许多像 PayPal 的 API 更具交互性。*Web API*\
    \ 是通过 HTTP 与服务交互的一组指令和标准。这种交互可以创建、读取、更新和删除（CRUD）操作，并且 Web API 将有一份概述这些指令和标准的参考。\n\
    \n例如，根据 PayPal API 参考，我可以通过向 URL 发送 JSON 使用 PayPal API 创建新发票：\n\n> *https://api.sandbox.paypal.com/v1/invoicing/invoices*\n\
    \n在示例 6-2 中，我们有一个代表发票的 JSON，将作为向 PayPal API 发送的请求。\n\n### 示例 6-2。PayPal API 的发票\n\
    \n"
