    value\": 89\n            }\n        }\n    ],\n    \"note\": \"Special Widgets\
    \ Order!\",\n    \"payment_term\": {\n        \"term_type\": \"NET_45\"\n    },\n\
    \    \"shipping_info\": {\n        \"first_name\": \"Some\",\n        \"last_name\"\
    : \"Guy\",\n        \"business_name\": \"Not applicable\",\n        \"address\"\
    : {\n            \"line1\": \"456 Real Fake Dr\",\n            \"city\": \"Some\
    \ Place\",\n            \"state\": \"OR\",\n            \"postal_code\": \"97501\"\
    ,\n            \"country_code\": \"US\"\n        }\n    }\n}\n```\n\n使用 PayPal\
    \ API，一旦创建了发票，我就可以请求（读取）、更新和删除该发票。\n\n在 JavaScript 后台执行的操作，例如请求天气数据，被称为异步操作。异步操作是在后台进行的操作，不会中断主传输。\n\
    \n在 JavaScript 异步操作的情况下，“主传输”指的是网页浏览器的显示。例如，一个新闻网页可能包含一个带有实时天气数据的侧边栏。当你阅读新闻文章时，后台代码可以每\
    \ 60 秒异步更新天气显示。此操作不需要重新加载页面，也不会中断你滚动页面阅读文章。页面上唯一变化的是带有天气数据的侧边栏。\n\nJavaScript\
    \ 的异步（后台）操作被称为 AJAX。AJAX 代表异步 JavaScript 和 XML（Asynchronous JavaScript and XML）。当我们后台请求\
    \ JSON 时，严格来说应该是异步 JavaScript 和 JSON（AJAJ）。然而，“AJAX”这个术语已经使用了很长时间，以至于它不再是一个缩写词，而更像是一个描述\
    \ JavaScript 中*任何*异步操作的词汇。在本书及其他地方，你会看到 AJAX 这个术语被用来描述异步 JavaScript 和 JSON。这并非错误。\n\
    \n让我们看看如何通过 JSON 和 JavaScript 的 `XMLHttpRequest` 实现 AJAX。\n\n# JavaScript 的 `XMLHttpRequest`\n\
    \n尽管 JavaScript 的 `XMLHttpRequest` 听起来与 XML 有关，但我们用它来发起 HTTP 请求。在它被命名为包含 XML 的时代，XML\
    \ 是进行这类请求的主要数据交换格式。然而，`XMLHttpRequest` *并不*局限于 XML。尽管名字如此，我们用它来请求 JSON。\n\n之前，我多次以“获取资源的代码”开头。JavaScript\
    \ 的 `XMLHttpRequest` 就是获取资源的代码。这种说法在谈论 HTTP 请求时很常见，尽管实际上代码并不会像狗捡球一样在赛博空间里追逐。代码待在原地，礼貌地请求资源被传送过来。\n\
    \n如果我们回到餐厅的例子，可以想象 JavaScript 代码坐在餐厅的桌子旁。JavaScript 代码不会去厨房请求 JSON，也不会在餐厅里大喊大叫。餐厅有规矩。这个规矩要求你召唤服务员，服务员记下你的订单并送到厨房。\n\
    \n同样，也有规矩允许代码向可能数百或数千英里之外的网络服务器发送请求。让我们能够访问喜爱网站的数据通信基础，基于一种称为*超文本传输协议（HTTP）*的协议。当我们在互联网浏览器中输入\
    \ *http://www.cutelittlekittens.com* 时，我们正在使用超文本传输协议请求一个资源。对于可爱小猫网站来说，这个资源是一个嵌入了可爱小猫图片的\
    \ HTML 页面。需要请求 JSON 资源的代码使用相同的协议（HTTP）。\n\n在 JavaScript 中，使用该协议发起请求的代码就是 `XMLHttpRequest`。JavaScript\
    \ 是一种面向对象的语言，因此 `XMLHttpRequest` 自然是一个对象。一旦通过语法 `new XmlHttpRequest()`（示例 6-3）创建并赋值给一个变量，它就有了一些函数，可以调用这些函数来从某个位置请求资源。\n\
    \n##### 示例 6-3. 一个 JavaScript `XMLHttpRequest` 对象\n\n```\n var myXmlHttpRequest\
    \ = new XMLHttpRequest();\n```\n\n`XMLHttpRequest` 是一个对象，示例 6-3 展示了创建一个新的 `XMLHttpRequest`\
    \ 对象的过程。即使你不懂 JavaScript，如果你读到了这里，你对 JSON 的了解也会帮助你想象一个 JavaScript 对象。毕竟，JSON 是基于\
    \ JavaScript 对象的字面量表示法。\n\n我们说 JavaScript 对象具有属性。这些“属性”就是名称-值对。`XMLHttpRequest`\
    \ 的属性名为 `onreadystatechange`、`readyState`、`response`、`responseText`、`responseType`、`responseXML`、`status`、`statusText`、`timeout`、`ontimeout`、`upload`\
    \ 和 `withCredentials`。注意这些属性的大小写不一致。有些使用驼峰式，有些则全小写。如果你将来决定编写自己的 `XMLHttpRequest`\
    \ 代码，这可能会让你抓狂，因为你不仅需要记住这些属性叫什么，还要记住不同的大小写。\n\n编程中的典型对象与 JSON 对象之间的一个关键区别是，JSON\
    \ 缺少可执行指令。JSON 仅由属性组成，因为它用于数据交换。编程中的典型对象还会包含函数（或方法）。例如，我可以用 JSON 通过名称-值对来描述我的鞋子，比如：`\"\
    color\": \"pink\"` 和 `\"brand\": \"crocs\"`。但我无法在 JSON 中通过调用函数（或方法）如 `shoe.walk()`\
    \ 来赋予鞋子生命。\n\n我们最感兴趣的 `XMLHttpRequest` 的可用函数有：\n\n*   `open(` `method`, `url`,\
    \ `async`(可选), `user`(可选), `password`(可选))\n*   `send()`\n\n我们最感兴趣的 `XMLHttpRequest`\
    \ 的可用属性有：\n\n`onreadystatechange`\n\n> 其值是一个我们可以在代码中定义的函数。\n\n`readyState`\n\n\
    > 返回一个 0–4 之间的值，表示状态码。\n\n`status`\n\n> 返回 HTTP 状态码（如 200 表示成功）。\n\n`responseText`\n\
    \n> 当响应成功时，它将包含响应的正文文本（如果是 JSON，就是我们请求的内容）。\n\n对于那些不熟悉 JavaScript 的人来说，这里有一个令人费解的地方：属性可以有一个函数作为值。这在\
    \ JavaScript 中是可能的，因为函数是一个对象。对象是一种数据类型，因此可以赋值给变量（属性）、修改和传递。在编程世界中，这被称为一等函数。`onreadystatechange`\
    \ 属性的值就是一个函数。\n\n示例 6-4 创建了一个新的 `XMLHttpRequest` 对象，并从 OpenWeatherMap API 获取 JSON。\n\
    \n##### 示例 6-4. 一个新的 `XMLHttpRequest` 对象\n"
- fmt: "\n```\nvar myXMLHttpRequest = new XMLHttpRequest();\nvar url = \"http://api.openweathermap.org/data/2.5/weather?lat=35&lon=139\"\
    ;\n\nmyXMLHttpRequest.onreadystatechange = function() {\n    if (myXMLHttpRequest.readyState\
    \ === 4 && myXMLHttpRequest.status === 200) {\n        var myObject = JSON.parse(myXMLHttpRequest.responseText);\n\
    \        var myJSON = JSON.stringify(myObject);\n    }\n}\nmyXMLHttpRequest.open(\"\
    GET\", url, true);\nmyXMLHttpRequest.send();\n```\n\nIn the example, on the second\
    \ line of code I’m creating a variable that contains the URL for a JSON resource.\
    \ I then create a function and assign it to the `onreadystatechange` property\
    \ of `myXMLHttpRequest`. This function will be executed every time the `readyState`\
    \ property changes. In the function, I check to see if the `readyState` is 4 (code\
    \ for “done”) and that the HTTP status is 200 (code for success). If both of those\
    \ things are true, I then parse the JSON into a JSON object.\n\nTwo terms that\
    \ you will often hear about when JSON is turned into text from an object and then\
    \ from an object back into text are *serialization* and *deserialization*. Serialization\
    \ is the act of converting the object into text. Deserialization is the act of\
    \ converting the text back into an object.\n\nIn [Example 6-5](#text00008.html_ex0605),\
    \ the JavaScript is deserializing with `JSON.parse()`. In the `responseText`,\
    \ the JSON is simply text as a data interchange format. Once it is parsed by `JSON.parse()`,\
    \ it is no longer JSON, but a JavaScript object.\n\n##### Example 6-5. Deserialization\n\
    \n```\nvar myJSON = JSON.parse(myXMLHttpRequest.responseText);\n```\n\nThis deserialization\
    \ with `JSON.parse()` is necessary because the JSON is not yet an object. Remember\
    \ that JSON stands for JavaScript Object *Notation*. While it is in its JSON form,\
    \ it is a literal representation of an object in the form of text. In order for\
    \ JSON to become a real object, it must be deserialized. In JavaScript, we can\
    \ also serialize the JSON with `JSON.stringify()`.\n\nIn [Example 6-6](#text00008.html_ex0606),\
    \ the `myObject` variable gets the deserialized JSON. This is now an object. The\
    \ `myJSON` variable gets the serialized object. This is now JSON.\n\n##### Example\
    \ 6-6. Object deserialized and then serialized\n\n```\n// the JSON response deserialized\
    \ \nvar myObject = JSON.parse(myXMLHttpRequest.responseText); \n\n// The object\
    \ serialized\nvar myJSON = JSON.stringify(myObject); \n```\n\nFinally, the last\
    \ two lines in my example are setting up the request and then sending it via the\
    \ HTTP protocol ([Example 6-7](#text00008.html_ex0607)).\n\n##### Example 6-7.\
    \ The request for JSON is set up and sent\n\n```\nmyXMLHttpRequest.open(\"GET\"\
    , url, true);\nmyXMLHttpRequest.send();\n```\n\nYou may find it strange that the\
    \ code that handles the JSON response appears before the request is sent. I even\
    \ talked about it before I talked about the request being set up and sent. The\
    \ function value of the `onreadystatechange` property is an EventHandler. The\
    \ underlying JavaScript engine (not my code) has logic to access the properties\
    \ value (my function) every time the ready state changes. The ready states from\
    \ 0–4 are:\n\n0 for UNSENT\n\n> The state before the `open()` function has been\
    \ executed.\n\n1 for OPENED\n\n> The state after the `open()` function has been\
    \ executed but before `send()` has been executed.\n\n2 for HEADERS_RECEIVED\n\n\
    > The state after the `send()` function has been executed and headers and status\
    \ are available.\n\n3 for LOADING\n\n> The headers have been received but the\
    \ response text is still being retrieved.\n\n4 for DONE\n\n> Complete; the full\
    \ message with headers and body has been received.\n\n* * *\n\n###### Note\n\n\
    Dealing with status codes for ready states may seem confusing. In [Chapter 7](#text00009.html_chapter_json_csframework),\
    \ we will see how the `XMLHttpRequest` can be simplified with jQuery. With jQuery,\
    \ we can get JSON with a simple `getJSON()` function, and deal with status in\
    \ a more human-readable way: `done()`, `fail()`, `always()`.\n\n* * *\n\nIn my\
    \ example, I used a URL that belongs to the OpenWeatherMap API. This is a web\
    \ service that provides weather data through an API. The API has URLs for both\
    \ XML and JSON resources for a variety of weather data. My example showed how\
    \ I requested and received JSON from this API on the client side with JavaScript.\
    \ However, Internet browsers have rules about sharing for security purposes. The\
    \ same-origin policy states that a website should only have these sort of background\
    \ requests with sites on the same domain. This is to protect users because unless\
    \ they know what Internet browser developer tools are, they can’t *see* these\
    \ requests happening.\n\nThe code I shared in my example could be executed in\
    \ a script on a site with the URL *http://www.mycoolsite.com*. This is the origin\
    \ domain because it is the URL of the original request. The URL for the API is:\n\
    \n> *http://api.openweathermap.org/data/2.5/weather?lat=35&lon=139*\n\nThe domain\
    \ *http://api.openweathermap.org* does not match the origin domain of *http://www.mycoolsite.com*.\
    \ This clearly violates the same-origin policy. This background request and response\
    \ is only made possible by some hoops that the makers of the OpenWeatherMap API\
    \ jumped through. Let’s take a look at these hoops and loopholes to see how behind-the-scenes\
    \ requests with public APIs are made possible.\n\n# Relationship Woes and Rules\
    \ About Sharing\n\nI realize I left you on a cliffhanger back there. I just showed\
    \ you some code that does work, but violates same-origin Internet browser rules.\
    \ It shouldn’t work, but it does, only because of a hoop that the makers of the\
    \ OpenWeatherMap API jumped through. Sounds like a bad soap opera, where two people\
    \ can’t make up their minds what their relationship is. Will the browser allow\
    \ the request to the public web API? Stay tuned.\n\n## Cross-Origin Resource Sharing\
    \ (CORS)\n\nSome web developers can go years writing JavaScript AJAX code that\
    \ makes requests from public web APIs without ever running into same-origin policies.\
    \ This is because most public APIs have implemented CORS on their own servers.\
    \ The server supplies some extra properties in the response header prefixed with\
    \ `Access-Control-Allow` ([Example 6-8](#text00008.html_ex0608)).\n\n##### Example\
    \ 6-8. The Access-Control-Allow headers from the OpenWeatherMap API response for\
    \ the resource at http://api.openweathermap.org/data/2.5/weather?lat=35&lon=139\n\
    \n```\nAccess-Control-Allow-Credentials:true\nAccess-Control-Allow-Methods:GET,\
    \ POST\nAccess-Control-Allow-Origin:*\n```\n\nThese headers define whether credentials\
    \ are allowed, which of the HTTP methods are allowed (`GET`, `POST`, `PUT`, `DELETE`,\
    \ `HEAD`, `OPTIONS`, `TRACE`, `CONNECT`), and most importantly, which origin domains\
    \ are allowed. In the example, the asterisk (`*`) is supplied. This is a wildcard\
    \ that says any origin domain is allowed.\n\nCORS makes it possible for sites\
    \ like OpenWeatherMap to share their data in a way that allows users to include\
    \ it in AJAX interactions on the client side. Additionally, CORS can be used to\
    \ disallow websites from doing mischievous things with an API such as CSRF. If\
    \ you remember the example from [Chapter 5](#text00007.html_chapter_securityConcerns),\
    \ a bad guy was able to link to JSON in a `<script>` tag and exploit the trust\
    \ of a banking site. A security measure that the bank could put in place is to\
    \ implement CORS and include the headers shown in [Example 6-9](#text00008.html_ex0609)\
    \ in its response.\n\n##### Example 6-9. CORS used as a security measure\n\n```\n\
    Access-Control-Allow-Methods:POST\nAccess-Control-Allow-Origin:http://www.somebank.com\n\
    ```\n\nIn the example, `POST` is the only allowed method. If someone tried to\
    \ request this resource from a URL in a `<script>` tag (using the `GET` method),\
    \ the browser will not allow it. Additionally, by specifying the URL of the origin\
    \ site for the bank, the Internet browser will deny access to any website other\
    \ than *http://www.somebank.com*.\n"
