  trans: "\n\n在客户端，我们有 HTML、CSS 和 JavaScript。\n\n在服务器端，有 PHP、ASP.NET、Node.js、Ruby\
    \ on Rails、Java、Go 以及许多许多语言。\n\n作为 Web 客户端，我们使用 HTTP 向服务器发送资源请求。服务器返回一个文档，例如 HTML\
    \ 或 JSON。当该文档是一个 JSON 文档时，服务器端代码必须处理它的创建。\n\n除了*提供* JSON 文档外，服务器还可能*接收* JSON 文档。我们在第\
    \ 8 章中见过了这一点，当时我们使用 HTTP 将一个 JSON 文档发布到 CouchDB Web API。当接收到文档时，服务器端代码必须处理该文档的解析。\n\
    \n在之前的章节中，我们讨论了 JavaScript 如何为 Web API 上的 JSON 资源在后台发送起 HTTP 请求。人们很容易认为 JavaScript\
    \ 扮演了这一角色，因为它被归类为“客户端”。然而，JavaScript 并不是唯一可以为 JSON 资源发送 HTTP 请求的语言。服务器端 Web 框架也可以发起\
    \ HTTP 请求。\n\n在服务器端技术请求 JSON 的场景下，它的角色就变成了客户端。以下是服务器端 Web 框架代码发起 HTTP 请求的一些示例场景：\n\
    \n* 使用 Web API 数据来填充网站的动态页面。这可以是公共的第三方 Web API，也可以是你自己的私有 Web API，如 CouchDB。\n\
    \n* 通过与 Web API 通信将支付网关集成到电子商务网站的结算代码中。\n\n* 使用 Web API 获取发送到特定地址的实时运费。\n\n在本章中，我们将研究\
    \ JSON 在服务器端的角色。服务器端 Web 框架或脚本语言会生成动态网页。当对资源提出请求时，服务器根据某些编程逻辑创建该资源。\n\n# JSON\
    \ 的序列化、反序列化和请求\n\n一种数据交换格式在 Web 上的成功需要客户端和服务器端的支持。如果我们只有客户端有支持，而服务器端没有，那么 JSON\
    \ 将无济于事。幸运的是，JSON 被大多数服务器端 Web 框架或脚本语言广泛支持。如果它们没有内置 JSON 序列化和反序列化的支持，可能存在相应的库或扩展来支持它。\n\
    \n* * *\n\n### 注意\n\n正如你从第 6 章中所记得的，序列化是将对象转换为文本的行为。反序列化是将文本转换回对象的行为。\n\n让我们来看看\
    \ JSON 如何在服务器端被序列化、反序列化和请求。\n\n## ASP.NET\n\nASP.NET 是由微软开发的一个服务器端 Web 框架。最初，使用该框架进行\
    \ Web 开发仅通过 Web Forms 实现，这是一种 GUI 状态驱动的模型。然而，它现在包含了多个扩展，允许使用不同的模型进行开发，例如 ASP.NET\
    \ MVC（模型-视图-控制器架构）和 ASP.NET Web API（一种用于为 Web 服务构建 HTTP Web API 的架构）。\n\n此外，ASP.NET\
    \ 使用通用语言运行时 (CLR)，允许开发者使用任何支持 CLR 的语言编写代码，如 C#、F#、Visual Basic .NET (VB.NET) 等。在本节中，我将使用\
    \ C# 所有示例。\n\n与 JavaScript 不同，ASP.NET 不容易解析 JSON。要解析 JSON，我们必须选择一个第三方 ASP.NET\
    \ 库并将其引入项目。在本书编写期间，最流行的库是 `Json.NET`，它是 Newtonsoft 开发的开源 JSON 框架。\n\n让我们来看看如何使用\
    \ `Json.NET` 库序列化和反序列化 JSON。\n\n### 序列化 JSON\n\n通过 ASP.NET 和 `Json.NET`，我们可以快速将\
    \ ASP.NET 对象序列化为 JSON。首先，我需要一个对象来处理。对于此示例，我们将创建一个与第 8 章中使用结构相同的 `CustomerAccount`\
    \ 对象（参见示例 9-1）。\n\n#### 示例 9-1. ASP.NET C# 中的 `CustomerAccount` 对象\n\n```csharp\n\
    public class CustomerAccount\n{\n    public string firstName { get; set; }\n \
    \   public string lastName { get; set; }\n    public string phone { get; set;\
    \ }\n    public Address[] addresses { get; set; }\n    public bool famous { get;\
    \ set; }\n}\n\npublic class Address\n{\n    public string street { get; set; }\n\
    \    public string city { get; set; }\n    public string state { get; set; }\n\
    \    public int zip { get; set; }\n}\n```\n\n现在我们有了表示对象的类，让我们为 Bob Barker 的账户创建一个新对象。在最后一行，我们将使用\
    \ `Json.NET` 库将此对象序列化为 JSON（参见示例 9-2 和 9-3）。\n\n#### 示例 9-2. C# 中为 Bob Barker\
    \ 账户创建的新对象；在最后行，我们将此对象序列化为 JSON\n\n```csharp\nCustomerAccount bobsAccount = new\
    \ CustomerAccount();\nbobsAccount.firstName = \"Bob\";\nbobsAccount.lastName =\
    \ \"Barker\";\nbobsAccount.phone = \"555-555-5555\";\n\n// ... \nstring json =\
    \ JsonConvert.SerializeObject(bobsAccount);\n```\n\n#### 示例 9-3. 序列化 `CustomerAccount`\
    \ 对象产生的 JSON\n\n```json\n{\n    \"firstName\": \"Bob\",\n    \"lastName\": \"\
    Barker\",\n    \"phone\": \"555-555-5555\",\n    \"addresses\": [\n        {\n\
    \            \"street\": null,\n            \"city\": \"Somewhere\",\n       \
    \     \"state\": \"CA\",\n            \"zip\": 0\n        }\n    ],\n    \"famous\"\
    : false\n}\n```\n\n### 反序列化 JSON\n\n我们可以一行代码将 JSON 反序列化回对象（参见示例 9-4）。\n\n####\
    \ 示例 9-4. 将字符串反序列化为指定的类型 `CustomerAccount`\n\n```csharp\nCustomerAccount customerAccount\
    \ = JsonConvert.DeserializeObject<CustomerAccount>(json);\n```\n\n`Json.NET` 能够将\
    \ JSON 转换为特定的对象，例如示例中的 `CustomerAccount` 对象。通过它，我们的数据可以在移动时保持形状。但是，对象的属性必须与 JSON\
    \ 文档中的键值对名称匹配，否则反序列化将失败。\n\n### 请求 JSON\n\n要为资源发送 HTTP 请求，我可以使用内置的 ASP.NET `WebClient`\
    \ 类。通过该类，我可以调用 `DownloadString` 方法从指定的 URL 下载资源为字符串（参见示例 9-5 和 9-6）。\n\n#### 示例\
    \ 9-5. 从本地 CouchDB 数据库下载 JSON 文档为字符串\n\n```csharp\nusing(var webClient = new WebClient())\n\
    {\n    string json = webClient.DownloadString(\"http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c\"\
    );\n}\n```\n\n#### 示例 9-6. URL `http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c`\
    \ 处的 JSON 资源\n\n```json\n{\n    \"_id\": \"3636fa3c716f9dd4f7407bd6f700076c\"\
    ,\n    \"_rev\": \"2-e04207c11104e06b3a8f030f14c35580\",\n    \"address\": {\n\
    \        \"street\": \"456 Fakey Fake st\",\n        \"city\": \"Somewhere\",\n\
    \        \"state\": \"CA\",\n        \"zip\": \"96520\"\n    },\n    \"age\":\
    \ 54,\n    \"gender\": \"female\",\n    \"famous\": true,\n    \"firstName\":\
    \ \"Janet\",\n    \"lastName\": \"Jackson\"\n}\n```\n"
- fmt: "\n# JSON Serialization and Deserialization\n\n## ASP.NET JSON Deserialization\n\
    \n### Example 9-7. Deserialization of the JSON resource as a string; the `fullName`\
    \ variable in the last line of code will evaluate to \"Janet Jackson\"\n\n```\n\
    \ CustomerAccount customerAccount;\nusing (var webClient = new WebClient())\n\
    {\n    string json = webClient.DownloadString(\n        \"http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c\"\
    );\n    customerAccount = JsonConvert.DeserializeObject<CustomerAccount>(json);\
    \              \n}\n\nstring fullName = customerAccount.firstName + \" \" + customerAccount.lastName;\
    \ \n```\n\nIn these examples, we can see that the structure of the JSON object\
    \ makes it friendly for ASP.NET objects. So long as the properties of the ASP.NET\
    \ object and the names of the name-value pairs of the JSON match up, serializing\
    \ and deserializing JSON in this web framework is simple.\n\n## PHP\n\nPHP is\
    \ a server-side scripting language used to make dynamic web pages. The PHP code\
    \ can be embedded directly into HTML documents (see [Example 9-8](#text00011.html_ex0908)\
    \ ).\n\n### Example 9-8. This HTML page will display a header (<h1>) tag with\
    \ the text \"Hello, World\"\n\n```\n <!DOCTYPE html>\n<html>\n    <head>\n   \
    \     <meta charset=\"UTF-8\">\n        <title>Hello, World</title>\n    </head>\n\
    \    <body>\n        <h1>\n        <?php\n           echo \"Hello, World\";\n\
    \        ?>\n        </h1>\n    </body>\n</html>\n```\n\nAdditionally, PHP includes\
    \ the object data type. Objects are defined with a class (see [Example 9-9](#text00011.html_ex0909)\
    \ ).\n\n### Example 9-9. A PHP class representing a cat\n\n```\n class Cat\n{\n\
    \    public $name;\n    public $breed;\n    public $age;\n    public $declawed;\n\
    }\n```\n\nWhen a class is instantiated, an object is created. The object can then\
    \ be used in programming logic ([Example 9-10](#text00011.html_ex0910) ).\n\n\
    ### Example 9-10. The class is instantiated, and the properties set. An object\
    \ is created. The last line of code will display \"Fluffy Boo.\"\n\n```\n $cat\
    \ = new Cat();\n   $cat->name = \"Fluffy Boo\";\n   $cat->breed = \"Maine Coon\"\
    ;\n   $cat->age = 2.5;\n   $cat->declawed = false;\n\n   echo $cat->name;\n```\n\
    \nPHP also includes built-in support for serializing and deserializing JSON. PHP\
    \ refers to this as encoding and decoding JSON. When we encode something, we convert\
    \ it to a coded (unreadable) form. When we decode something, we convert it back\
    \ into a readable form. From the perspective of PHP, JSON is in a coded format.\
    \ Therefore, to serialize JSON, the `json_encode` function is called, and to deserialize\
    \ JSON, the `json_decode` function is called.\n\n### Serializing JSON\n\nIn PHP,\
    \ we can quickly serialize PHP objects with the built-in support for JSON. In\
    \ this section, we will create a PHP object representing an address, and serialize\
    \ to JSON.\n\nIn [Example 9-11](#text00011.html_ex0911) , we first create a class\
    \ representing an account. Then, we create a new instance of the class for Bob\
    \ Barker’s account. An `Account` object is created. Finally, on the last line,\
    \ we call the built-in function `json_encode` to serialize the `Account` object\
    \ (results shown in [Example 9-12](#text00011.html_ex0912) ).\n\n#### Example\
    \ 9-11. Creating and serializing an account\n\n```\n <?php\nclass Account {\n\
    \    public $firstName;\n    public $lastName;\n    public $phone;\n    public\
    \ $gender;\n    public $addresses;\n    public $famous;\n}\n\nclass Address {\n\
    \    public $street;\n    public $city;\n    public $state;\n    public $zip;\n\
    }\n\n$address1 = new Address();\n$address1->street = \"123 fakey st\";\n$address1->city\
    \ = \"Somewhere\";\n$address1->state = \"CA\";\n$address1->zip = 96027;\n\n$address2\
    \ = new Address();\n$address2->street = \"456 fake dr\";\n$address2->city = \"\
    Some Place\";\n$address2->state = \"CA\";\n$address2->zip = 96345;\n\n$account\
    \ = new Account();\n$account->firstName = \"Bob\";\n$account->lastName = \"Barker\"\
    ;\n$account->gender = \"male\";\n$account->phone = \"555-555-5555\";\n$account->famous\
    \ = true;        \n$account->addresses = array ($address1, $address2);\n\n$json\
    \ = json_encode($account);\n\n?>\n```\n\n#### Example 9-12. The JSON result from\
    \ `json_encode($account)`\n\n```\n {\n    \"firstName\": \"Bob\",\n    \"lastName\"\
    : \"Barker\",\n    \"phone\": \"555-555-5555\",\n    \"gender\": \"male\",\n \
    \   \"addresses\": [\n        {\n            \"street\": \"123 fakey st\",\n \
    \           \"city\": \"Somewhere\",\n            \"state\": \"CA\",\n       \
    \     \"zip\": 96027\n        },\n        {\n            \"street\": \"456 fake\
    \ dr\",\n            \"city\": \"Some Place\",\n            \"state\": \"CA\"\
    ,\n            \"zip\": 96345\n        }\n    ],\n    \"famous\": true\n}\n```\n\
    \n### Deserializing JSON\n\nTo serialize JSON in PHP, we used the built-in `json_encode`\
    \ function. To deserialize JSON, we use the `json_decode` function. Unfortunately,\
    \ this does not have built-in support for deserializing the JSON to a specified\
    \ PHP object, such as the `Account` class. So, we must do a little processing\
    \ to reshape our data back into the PHP object.\n\nLet’s add a new function to\
    \ the `Account` object, to load up its properties from a JSON string.\n\nIn [Example 9-13](#text00011.html_ex0913)\
    \ , the `loadFromJSON` function accepts a JSON string for a parameter, calls the\
    \ built-in `json_decode` function to deserialize to a generic PHP object, and\
    \ maps the name-value pairs to the `Account` properties by name in the `foreach`\
    \ loop.\n\n#### Example 9-13. Adding a function to the `Account` object\n\n```\n\
    \ class Account {\n    public $firstName;\n    public $lastName;\n    public $phone;\n\
    \    public $gender;\n    public $addresses;\n    public $famous;\n\n    public\
    \ function loadFromJSON($json)\n    {\n        $object = json_decode($json);\n\
    \        foreach ($object AS $name => $value) \n        {\n            $this->{$name}\
    \ = $value;\n        }\n    }\n}\n```\n\nNext, we can create a new `Account` object,\
    \ and call the new `loadFromJSON` function ([Example 9-14](#text00011.html_ex0914)\
    \ ).\n\n#### Example 9-14. Calling our new `loadFromJSON` function to deserialize\
    \ the account JSON back into the `Account` object; the last line will display\
    \ \"Bob Barker\"\n\n```\n $json = json_encode($account);\n\n$deserializedAccount\
    \ = new Account();\n$deserializedAccount->loadFromJSON($json);\n\necho $deserializedAccount->firstName\
    \ . \" \" . $deserializedAccount->lastName;\n```\n\n### Requesting JSON\n\nTo\
    \ make an HTTP request for a resource with PHP, I can use the built-in function\
    \ `file_get_contents` . This function returns the resource body as a string. We\
    \ can then deserialize the string to a PHP object (see Examples [9-15](#text00011.html_ex0915)\
    \ and [9-16](#text00011.html_ex0916) ).\n\n#### Example 9-15. Resource at URL\
    \ `http://localhost:5984/accounts/ddc14efcf71396463f53c0f8800019ea` from my local\
    \ CouchDB API\n\n```\n {\n    \"_id\": \"ddc14efcf71396463f53c0f8800019ea\",\n\
    \    \"_rev\": \"6-69fd853972074668f99b88a86aa6a083\",\n    \"address\": {\n \
    \       \"street\": \"123 fakey ln\",\n        \"city\": \"Some Place\",\n   \
    \     \"state\": \"CA\",\n        \"zip\": \"96037\"\n    },\n    \"gender\":\
    \ \"female\",\n    \"famous\": false,\n    \"age\": 28,\n    \"firstName\": \"\
    Mary\",\n    \"lastName\": \"Thomas\"\n}\n```\n\n#### Example 9-16. Calling the\
    \ built-in `file_get_contents` function to get the account JSON resource from\
    \ the CouchDB API. Next, a new `Account` object is created and our `loadFromJSON`\
    \ function is called to deserialize. The last line will display \"Mary Thomas.\"\
    \n\n```\n $url = \"http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c\"\
    ;\n$json = file_get_contents($url);\n\n$deserializedAccount = new Account();\n\
    $deserializedAccount->loadFromJSON($json);\n\necho $deserializedAccount->firstName\
    \ . \" \" . $deserializedAccount->lastName; \n```\n\n# A Smorgasbord of JSON HTTP\
    \ Requests\n"
