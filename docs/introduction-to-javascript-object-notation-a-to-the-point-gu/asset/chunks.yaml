  trans: "\n# 一致性验证与 JSON Schema\n\n即使提供了最详细、最漂亮的文档，在数据中创建错误也并不难。需要明确的是，我们这里讨论的不是语法错误，而是理解错误，比如“我发送了一个苹果，而你期望的是一个橙子”。在这本书中，我将把这种验证称为*一致性验证*，以便与语法验证区分开来。\n\
    \n## 无 Schema 的场景\n\n在这个场景中，过程通常按以下步骤进行：\n\n1. 你完成了数据的创建，并且充满信心。\n2. 你通过互联网将数据发送给另一方。你的网络连接今天很慢，而且要发送的数据文件很大，所以需要几分钟。\n\
    3. 你收到错误响应，因为你的数据格式不符合他们的预期。信心受挫。如果幸运的话，错误响应会告诉你一些有意义的信息，比如你做错了什么。\n4. 你仔细阅读他们的文档，找到你认为错误的地方，修复它，然后从第\
    \ 1 步重新开始。\n\n这种场景在 JSON 出现之前就存在于数据交换中。幸运的是，科技行业的人是问题解决者，schema 的概念应运而生。\n\n##\
    \ 带验证魔法的契约\n\n在现实世界中，我们经常使用双方之间的契约，其中结果很重要。当我签署一份合同，说我将为某人完成一个项目时，细节都在合同中列出。我同意在\
    \ 8 月 31 日前交付宇宙飞船，最终产品将是一艘配备生命支持系统、激光器和三台引擎的完整宇宙飞船。\n\n想象一下，我们生活在一个巫师和魔法的世界里。当我为之做项目的公司把合同交给我时，他们加了一点魔法。随时，我可以用魔杖轻敲合同，它会告诉我是否已经履行了我的义务。我永远不必走进会议室宣称“我完成了！”然后得到令人尴尬的回应“你承诺放在宇宙飞船上的第三台引擎呢？它在哪里？”随时我可以验证我*真的*完成了项目，然后自信地走进会议室。\n\
    \n数据交换 schema 非常类似于那个想象的巫师和魔法世界。在发送数据之前，我们可以随时验证数据是否符合 schema，并确定我们的数据是否可接受。当我们使用\
    \ schema 进行数据交换时，过程与没有 schema 的场景大不相同：\n\n1. 你验证数据与 schema 的一致性，并修复发现的任何错误。通常你会收到关于错误的有用信息。\n\
    2. 你完成了数据的创建，并且充满信心。\n3. 你通过互联网发送数据，并收到成功响应。任务完成。\n\n此外，JSON schema 可以被接收数据的一方在交易的另一端使用。JSON\
    \ schema 可以作为接收数据的第一道防线，验证数据是否符合。它可以在数据处理之前回答所有这些问题：\n\n值的数&#xA0;据类型是否正确？\n\n\
    > 我们可以指定一个值必须是数字、字符串等。\n\n这是否包含所需的数据？\n\n> 我们可以指定哪些数据是必需的，哪些不是。\n\n值的格式是否符合我的要求？\n\
    \n> 我们可以指定范围、最小值和最大值。\n\n## JSON Schema 简介\n\n虽然 JSON 相当成熟，但 JSON Schema 仍在开发中。截至\
    \ 2015 年 4 月，JSON Schema 处于第 4 版草案。这并不意味着你不应该使用 JSON Schema —— 这只是意味着它仍在不断发展，以更好地服务于世界。\n\
    \nJSON Schema 是用 JSON 编写的，所以阅读或编写它只需要几步。在我们的 JSON 中第一个名称-值对，我们必须将其声明为 schema 文档（参见示例\
    \ 4-1）。\n\n#### 示例 4-1：`$schema` 声明\n\n```json\n {\n    \"$schema\": \"http://json-schema.org/draft-04/schema#\"\
    \n}\n```\n\n我们的 JSON Schema 文档中的第二个名称-值对是 `title`（参见示例 4-2）。\n\n#### 示例 4-2：添加标题\n\
    \n```json\n {\n    \"$schema\": \"http://json-schema.org/draft-04/schema#\",\n\
    \    \"title\": \"Cat\"\n}\n```\n\n在我们的 JSON Schema 文档的第三个名称-值对中，我们将定义我们希望包含在\
    \ JSON 中的 `properties`。`properties` 值本质上是我们想要的 JSON 的名称-值对的骨架。与字面值不同，我们有一个对象来定义数据类型，以及可选的描述（参见示例\
    \ 4-3）。\n\n#### 示例 4-3：定义属性\n\n```json\n {\n  \"$schema\": \"http://json-schema.org/draft-04/schema#\"\
    ,\n  \"title\": \"Cat\",\n  \"properties\": {\n    \"name\": {\n      \"type\"\
    : \"string\"\n    },\n    \"age\": {\n      \"type\": \"number\",\n      \"description\"\
    : \"Your cat's age in years.\"\n    },\n    \"declawed\": {\n      \"type\": \"\
    boolean\"\n    }\n  }\n}\n```\n\n然后我们可以验证我们的 JSON 是否符合 JSON Schema（参见示例 4-4）。\n\
    \n#### 示例 4-4：符合规范的 JSON\n\n```json\n {\n  \"name\": \"Fluffy\",\n  \"age\": 2,\n\
    \  \"declawed\": false\n}\n```\n\n之前我说过，JSON Schema 可以回答以下问题：\n\n值的数&#xA0;据类型是否正确？\n\
    \n> 我们可以指定一个值必须是数字、字符串等。\n\n这是否包含所需的数据？\n\n> 我们可以指定哪些数据是必需的，哪些不是。\n\n值的格式是否符合我的要求？\n\
    \n> 我们可以指定范围、最小值和最大值。\n\n通过这个非常简单的猫示例，第一个问题得到了回答。我们能够验证猫“Fluffy”的 JSON 是否具有正确的\
    \ `name`、`age` 和 `declawed` 值的数据类型。让我们回答第二个问题：这是否包含所需的数据？\n\n当我们请求数据时，通常有些属性（或字段）是必须要有值的，而其他则是可选的。例如，当我在购物网站上创建新账户时，我需要填写送货地址表单。该地址表单要求我的姓名、街道、城市、州和邮政编码。可选地，我可以包括公司名称、公寓号码和街道地址的第二行。如果我遗漏了必填字段之一，我将无法继续创建账户。\n\
    \n为了在 JSON schema 中实现这种必需逻辑，我们在 `$schema`、`title` 和 `properties` 之后添加第四个名称-值对。这个名称-值对的名称是\
    \ `required`，值是数组数据类型。该数组包含我们要求的字段。\n\n在示例 4-5 中，我们首先为 `description` 添加另一个字段。然后，我们添加第四个名称-值对\
    \ `required`，其值是必需值的数组。`name`、`age` 和 `declawed` 是必需的，所以我们将它们添加到此列表中。我们不包括 `description`，因为它不是必需的。\n\
    \n#### 示例 4-5：定义必填字段\n\n```json\n {\n  \"$schema\": \"http://json-schema.org/draft-04/schema#\"\
    ,\n  \"title\": \"Cat\",\n  \"properties\": {\n    \"name\": {\n      \"type\"\
    : \"string\"\n    },\n    \"age\": {\n      \"type\": \"number\",\n      \"description\"\
    : \"Your cat's age in years.\"\n    },\n    \"declawed\": {\n      \"type\": \"\
    boolean\"\n    },\n    \"description\": {\n      \"type\": \"string\"\n    }\n\
    \  },\n  \"required\": [\n    \"name\",\n    \"age\",\n    \"declawed\"\n  ]\n\
    }\n```\n\n通过在 JSON schema 中添加 `required`，示例 4-6 中的 JSON 是有效的。此 JSON 符合我们的 `Cat`\
    \ JSON schema，其中 `name`、`age` 和 `declawed` 为必填字段。我们包括了可选的名称-值对 `description`。\n\
    \n#### 示例 4-6：有效的 JSON\n\n```json\n {\n  \"name\": \"Fluffy\",\n  \"age\": 2,\n\
    \  \"declawed\": false,\n  \"description\" : \"Fluffy loves to sleep all day.\"\
    \n}\n```\n"
- fmt: "\nWe may also leave out the `\"description\"` field, as it’s not included\
    \ in the list of required fields. The JSON in [Example 4-7](#text00006.html_ex0407)\
    \ conforms to our JSON Schema for `\"Cat\"` with the required fields of `\"name\"\
    ` , `\"age\"` , and `\"declawed\"` .\n\n### Example 4-7. Valid JSON without the\
    \ “description” field\n\n```json\n {\n  \"name\": \"Fluffy\",\n  \"age\": 2,\n\
    \  \"declawed\": false\n}\n```\n\nIt is important to note that if you do not include\
    \ the `\"required\"` name-value pair in your JSON schema with the array of required\
    \ names, then nothing is required. A JSON object with no name-value pairs inside\
    \ it would be considered valid. Without the array of `\"required\"` , the JSON\
    \ in [Example 4-8](#text00006.html_ex0408) is considered valid for the `\"Cat\"\
    ` JSON Schema.\n\n### Example 4-8. Valid JSON\n\n```json\n {}\n```\n\nThe third\
    \ and final question we can answer with our JSON schema is: are the values in\
    \ the format I require? We answered the question about the data types of our values,\
    \ but we often need a specific format for the type. For example, I require a username,\
    \ but the username should not exceed 20 characters. Additionally, I might ask\
    \ you to think of a number between 10 and 100\\. We can express these specific\
    \ requirements in our JSON schema.\n\nIn the cat JSON, we have requirements such\
    \ as name being a string and age being a number. However, we do not want someone\
    \ giving us data with a really long cat name, a really short cat name, or a negative\
    \ number for the cat’s age. In our JSON schema, we can define a minimum length\
    \ and a maximum length for a string, and a minimum for a number.\n\nIn [Example\
    \ 4-9](#text00006.html_ex0409) , validation has been added to ensure that the\
    \ cat’s name is a minimum of 3 characters and a maximum of 20 characters. Additionally,\
    \ we ensure that the age of the cat submitted is not a negative number.\n\n###\
    \ Example 4-9. Validating the cat JSON\n\n```json\n {\n  \"$schema\": \"http://json-schema.org/draft-04/schema#\"\
    ,\n  \"title\": \"Cat\",\n  \"properties\": {\n    \"name\": {\n      \"type\"\
    : \"string\",\n      \"minLength\": 3,\n      \"maxLength\" : 20\n    },\n   \
    \ \"age\": {\n      \"type\": \"number\",\n      \"description\": \"Your cat's\
    \ age in years.\",\n      \"minimum\" : 0\n    },\n    \"declawed\": {\n     \
    \ \"type\": \"boolean\"\n    },\n    \"description\": {\n      \"type\": \"string\"\
    \n    }\n  },\n  \"required\": [\n    \"name\",\n    \"age\",\n    \"declawed\"\
    \n  ]\n}\n```\n\nThe JSON in [Example 4-10](#text00006.html_ex0410) is not valid\
    \ with the `\"Cat\"` JSON Schema because the name value exceeds the `\"maxLength\"\
    ` , and the age value precedes the `\"minimum\"` .\n\n### Example 4-10. Invalid\
    \ JSON\n\n```json\n {\n  \"name\": \"Fluffy the greatest cat in the whole wide\
    \ world\",\n  \"age\": -2,\n  \"declawed\": false,\n  \"description\" : \"Fluffy\
    \ loves to sleep all day.\"\n}\n```\n\nThe JSON in [Example 4-11](#text00006.html_ex0411)\
    \ is valid with the cat JSON Schema and conforms to the requirements for the values.\n\
    \n### Example 4-11. This JSON is valid\n\n```json\n {\n  \"name\": \"Fluffy\"\
    ,\n  \"age\": 2,\n  \"declawed\": false,\n  \"description\" : \"Fluffy loves to\
    \ sleep all day.\"\n}\n```\n\nIf we return to the comparison of a schema to a\
    \ contract, you can see that the details of our contract can be very specific.\
    \ The examples provided in this chapter are introductory and just the tip of the\
    \ iceberg. JSON Schema even supports regular expressions (character patterns,\
    \ such as an email address format) and enum (a list of possible values). If you\
    \ wish to become a master of JSON Schema, visit the following pages, where you\
    \ can find links to the specifications:\n\n*   [The home of JSON Schema](http://json-schema.org/)\n\
    *   [JSON Schema validation specification](http://json-schema.org/latest/json-schema-validation.html)\n\
    \nThere is a long and growing list of JSON Schema libraries and projects for specific\
    \ programming languages and frameworks. A quick Google search of “JSON Schema\
    \ Validation [insert programming language name here]” should get you what you\
    \ need if you’d like to integrate JSON Schema validation into a project. Additionally,\
    \ there are a few online validators, which are programming language agnostic and\
    \ great for experimenting with JSON Schema:\n\n*   [JSON Schema Lint](http://jsonschemalint.com/draft4/)\n\
    *   [JSON Schema Validator](http://www.jsonschemavalidator.net/)\n\nIf I go to\
    \ the JSON Schema Lint website, I will be presented with two text areas: one for\
    \ the JSON schema, and another for the JSON document to be validated. If I paste\
    \ in the schema from [Example 4-9](#text00006.html_ex0409) and the JSON from [Example\
    \ 4-10](#text00006.html_ex0410).\n"
