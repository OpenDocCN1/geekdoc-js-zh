    \ or who use a less popular Internet browser that isn’t keeping up with the evolving\
    \ standards.\n\nThe much safer `JSON.parse()` function is currently supported\
    \ in all major Internet browsers and their most recent versions. However, some\
    \ earlier Internet browser versions that a small percentage of users are still\
    \ on do not support this function. If `JSON.parse()` is used, that small percentage\
    \ of users will not be able to use the functionality of the website that relies\
    \ on JSON. Oftentimes, this is dealt with by finding ways to gracefully fail.\
    \ For example, instead of a web page full of rampant errors, consider one that\
    \ catches those errors and displays a message such as “Please update your browser\
    \ to the latest version.”\n\n## Holes in Security: Architectural Decisions\n\n\
    At the beginning of the chapter, I said, “JSON by itself is not a threat.”  This\
    \ still holds true, but there are some scenarios in which a threat can be included\
    \ directly within the JSON data, while still remaining valid JSON.\n\nLet’s take\
    \ a look at some perfectly innocent JSON ([Example 5-8](#text00007.html_ex0508)\
    \ ).\n\n##### Example 5-8. Perfectly innocent JSON\n\n```\n {\n    \"message\"\
    : \"hello, world!\"\n}\n```\n\nNow let’s pretend that I host a website that stores\
