  trans: "\n实现 CORS 并不总是可选的，而且 JSON 也不总是由完整的 Web API 托管。可能你有两个不同域名的站点（`http://domainone.com`\
    \ 和 `http://domaintwo.com`），并且你想从 `http://domainone.com` 分享 JSON 文件到 `http://domaintwo.com`。这就是\
    \ JSON-P 派上用场的地方\n\n## JSON-P\n\nJSON-P 代表带有填充的 JSON（JSON with padding）。我在第五章\
    \ 中提到过 `<script>` 标签不受同源策略的限制。JSON-P 利用这一例外向非同源的服务器请求 JSON。\n\nJSON-P 没有 CORS\
    \ 那么理想，因为它被归类为通变方案（CORS 是首选方法，因为它是一个标准）。然而，在迫不得的情况下，有时需要这样的通变方案。你需要 `http://domainone.com`\
    \ 和 `http://domaintwo.com` 之间存在关系，当 CORS 不可用用时，浏览器关于共享的规则可能会让你感到很沮丧。\n\nJSON-P\
    \ 中的“填充”非常简单。它是添加到 JSON 文档中的 JavaScript。参见示例 6-10。\n\n### 示例 6-10.带有填充的 JSON (JSON-P)\n\
    \n```\ngetTheAnimal(\n    {\n        \"animal\": \"cat\"\n    }\n);\n```\n\n此\
    \ JSON 文档中的 JavaScript “填充”是一个对函数的调用，并将 JSON 作为参数提供。函数参数提供了一种将数据传递函数的方法。例如，如果我想要一个将两个数字相加的函数，我需要一种方法将这两个数字传入函数。\n\
    \n该函数定义在我们的客户端代码中，在我们的 JavaScript 中 (示例 6-11)。\n\n### 示例 6-11. 在 JavaScript 中声明的函数\n\
    \n```\nfunction getTheAnimal(data) {\n    var myAnimal = data.animal; // 将是 \"\
    cat\"\n}\n```\n\n在 JavaScript 中声明函数后，需要进行一些设置。这是 JSON-P 利用 `<script>` 标签不受同源策略限制的部分。参见示例\
    \ 6-12。\n\n### 示例 6-12. <script> 标签被创建并在 <head> 标签后动态附加到 HTML 文档中\n\n```\nvar\
    \ script = document.createElement(\"script\");\nscript.type = \"text/javascript\"\
    ;\nscript.src = \"http://notarealdomain.com/animal.json\";\ndocument.getElementsByTagName('head')[0].appendChild(script);\n\
    ```\n\n对于实现 JSON-P 的服务器，习惯做法也是允许用户决定函数的名称。这通常通过 URL 中的查询字符串参数传递。参见示例 6-13。\n\n\
    ### 示例 6-13. 通过查询字符串传递给服务器的函数名\n\n```\nscript.src = \"http://notarealdomain.com/animal.json?callback=getThing\"\
    ;\n```\n\n服务器将在回调中接收我的函数名，并在 JSON 文件中动态生成填充。参见示例 6-14。\n\n### 示例 6-14. JSON 填充中动态命名的函数\n\
    \n```\ngetThing(\n    {\n        \"animal\": \"cat\"\n    }\n);\n```\n\nJSON-P\
    \ 仍然需要在服务器端努力，因为 JSON 资源必须包含 JavaScript 填充。CORS 和 JSON-P 都需要在端努力。因此，客户端的跨域 `XMLHttpRequest`\
    \ 成功取决于 JSON 资源的服务器。\n\n## 关键术语和概念\n\n本章涵盖了以下关键术语：\n\nWeb API\n\n> 一组通过 HTTP 与服务交互的指令和标准。\n\
    \n`XMLHttpRequest`\n\n> 一个 JavaScript 对象，主要用于 AJAX 编程，用于在不重新加载页的情况下从 URL 获取数据。\n\
    \n超文本传输协议 (HTTP)\n\n> 世界万网数据通信的基础性协议。\n\n序列化 (Serialization)\n\n> 将对象转换为文本的行为。\n\
    \n反序列化 (Deserialization)\n\n> 将序列化的文本转换回对象的行为。\n\n同源策略 (Same-origin policy)\n\n\
    > 为了安全，互联网浏览器要求脚本源于同一域。\n\n跨源资源共享 (CORS)\n\n> 通过在响应头中定义权限，允许从请求者之外的其他域请求资源（例如\
    \ JSON 文档）。\n\n带有填充的 JSON (JSON-P)\n\n> 使用 `<script>` 标签不受同源策略限制的例外向非同源服务器请求 JSON。\n\
    \n我们还讨论了这些关键概念：\n\n*   JavaScript `XMLHttpRequest` 与 Web API 之间的关系是客户端-服务器关系。\n\
    *   `XMLHttpRequest` 不仅用于 XML。我们也用它来请求 JSON 资源。\n*   网站为人类服务，而 Web API 为代码服务。两者通过\
    \ HTTP 提供资源。\n*   同源策略可能会导致 JavaScript 与 JSON 资源之间客户端-服务器交互的困扰。\n*   客户端的跨域 `XMLHttpRequest`\
    \ 成功取决于 JSON 资源的服务器。\n\n## 第 7 章.JSON 与客户端框架\n\n在第六章 中，我们看了 浏览器与 Web API 之间的客户端-服务器关系。在本章中，我们将把镜头对准该关系的客户端，看看一些客户端框架是如何支持或利用\
    \ JSON 的。\n\n对于不熟悉该概念的人，让我们快速看一眼什么是框架。在物理世界中，“框架”可以用来描述一种至关重要的支撑结构或底层结构。在计算中，框架并不是底层结构。它是一个位于软件或编程语言之上的结构，用于为开发者提供支持。\n\
    \n计算中的框架是一种支撑结构，但其方式无法与建筑的梁联系起来。如果 JavaScript 语言是一栋房子，那么 JavaScript 框架就不会是该建筑的支撑结构。事实上，即使没有\
    \ JavaScript 框架，你也可以建造非常坚固的房子。\n\n如果我们从事用 JavaScript 建造房子的业务，那么 JavaScript 框架就像订购一栋预制房屋，里面已经包含了水路和电气布线。有了我们的预制房屋，我们可以专注于创建任何种类型的水槽，而水流自来只是将水槽连接到管道的问题。我们可以专注于安装精美的橱柜和漂亮的大理石台面。本质上，我们的\
    \ JavaScript 框架允许我们节省时间并专注于功能的构建。\n"
- fmt: "\n# jQuery and JSON\n\n[jQuery](http://jquery.com/) is an abstraction tool\
    \ that allows developers to focus on building features by catering to manipulation\
    \ of the HTML Document Object Model (DOM). The is a convention for interacting\
    \ with the HTML page. In this model, the underlying HTML is treated as an object\
    \ and a set of nodes that can be enumerated, accessed, and manipulated.\n\nManipulation\
    \ of the DOM in JavaScript is possible without the jQuery framework. However,\
    \ there are some things developers routinely need to do with the DOM that take\
    \ several lines of code. For example, a common thing to do with the DOM is hide\
    \ an HTML element. Let’s say I have a button that I want hidden ([Example 7-1](#text00009.html_ex0701)).\n\
    \n### Example 7-1. An HTML button that displays in a web browser with the text\
    \ “My Button”\n\n```\n <button id=\"myButton\">My Button</button>\n```\n\nAs shown\
    \ in [Example 7-2](#text00009.html_ex0702), to achieve the goal of hiding the\
    \ button in JavaScript, I must call the function `getElementById(id)` on the HTML\
    \ document object, then set the `style.display` property to `\"none\"`.\n\n###\
    \ Example 7-2. This line of JavaScript will hide the HTML button with the id “myButton”;\
    \ it will not display in the browser\n\n```\n document.getElementById(\"myButton\"\
    ).style.display = \"none\";\n```\n\njQuery achieves the same goal with less than\
    \ half the characters in code ([Example 7-3](#text00009.html_ex0703)).\n\n###\
    \ Example 7-3. This line of jQuery will hide the HTML button with the id “myButton”;\
    \ it will not display in the browser\n\n```\n $(\"#myButton\").hide();\n```\n\n\
    Having to type less than half the characters to achieve the same goal saves on\
    \ production time. In addition to saving time, jQuery also deals with Internet\
    \ browser compatibility issues. For example, in [Chapter 5](#text00007.html_chapter_securityConcerns),\
    \ I brought up `JSON.parse()` as a safer alternative to `eval()` for parsing JSON.\
    \ In older versions of Internet Explorer, Firefox, and Chrome, `JSON.parse()`\
    \ is not supported. This means whatever feature you wrote using `JSON.parse()`\
    \ will not work for a small percentage of your users who fail to update their\
    \ browsers.\n\njQuery deals with many common version compatibility issues for\
    \ you, including the mentioned `JSON.parse()` issue. jQuery has a function for\
    \ parsing JSON: `jQuery.parseJSON`. In [Example 7-4](#text00009.html_ex0704),\
    \ JSON is parsed with the JavaScript `JSON.parse()`. In [Example 7-5](#text00009.html_ex0705),\
    \ JSON is parsed with the built-in jQuery function.\n\n### Example 7-4. Parsing\
    \ JSON in JavaScript with JSON.parse()\n\n```\n var myAnimal = JSON.parse('{ \"\
    animal\" : \"cat\" }');\n```\n\n### Example 7-5. Parsing JSON with jQuery using\
    \ jQuery.parseJSON\n\n```\n var myAnimal = jQuery.parseJSON('{ \"animal\" : \"\
    cat\" }');\n```\n\nIn the examples, you can see that the jQuery example doesn’t\
    \ appear to be saving any characters for typing. However, the `jQuery.parseJSON()`\
    \ function is doing much more than one line of code. If you look at the function\
    \ code for this in the jQuery library source, it attempts to use the native `JSON.parse()`\
    \ function. If that is not available in the browser (for old versions), it falls\
    \ back to using `new Function()`, which is the equivalent of using `eval()`. Additionally,\
    \ there is some logic checking for invalid characters, which would be present\
    \ in a script in an injection attack attempt, in which case an error is thrown.\n\
    \nIn addition to `jQuery.parseJSON`, there is a function for making an HTTP request\
    \ for JSON. If we take a look at our example from [Chapter 6](#text00008.html_chapter_Jsxmlhttp),\
    \ we can see that requesting a resource over HTTP with JavaScript can require\
    \ a good chunk of code ([Example 7-6](#text00009.html_ex0706)).\n\n### Example\
    \ 7-6. This example code creates a new XMLHttpRequest object and gets JSON from\
    \ the OpenWeatherMap API\n\n```\n var myXMLHttpRequest = new XMLHttpRequest();\n\
    var url = \"http://api.openweathermap.org/data/2.5/weather?lat=35&lon=139\";\n\
    \nmyXMLHttpRequest.onreadystatechange = function() {\n    if (myXMLHttpRequest.readyState\
    \ === 4 && myXMLHttpRequest.status === 200) {\n        var myObject = JSON.parse(myXMLHttpRequest.responseText);\n\
    \        var myJSON = JSON.stringify(myObject);\n    }\n}\nmyXMLHttpRequest.open(\"\
    GET\", url, true);\nmyXMLHttpRequest.send();\n```\n\nIn jQuery, we can request\
    \ the JSON resource by writing just a few lines of code ([Example 7-7](#text00009.html_ex0707)).\n\
    \n### Example 7-7. This jQuery code will create a new XMLHttpRequest and retrieve\
    \ the same JSON resource as the preceding example; this includes deserializing\
    \ the JSON into a JavaScript object\n\n```\nvar url = \"http://api.openweathermap.org/data/2.5/weather?lat=35&lon=139\"\
    ;\n$.getJSON(url, function(data) {\n   // do something with weather data\n});\n\
    ```\n\nThe jQuery JavaScript framework supports JSON in a way that cuts down on\
    \ production time for requesting and parsing JSON. This includes parsing JSON\
    \ in a way that support older versions of Internet browsers. We can say that jQuery\
    \ *supports* interacting with JSON.\n\nNow let’s take a look at AngularJS, a library\
    \ that *leverages* JavaScript objects and JSON.\n\n# AngularJS\n\nThe jQuery framework\
    \ is an abstraction tool that caters to manipulation of the Document Object Model\
    \ (DOM). The [AngularJS framework](https://angularjs.org/) is an abstraction tool\
    \ that caters to single-page applications. *Single-page web applications* are\
    \ web pages that break away from the traditional multipage approach to create\
    \ a more seamless application experience.\n\nThe traditional multipage web application\
    \ experience is heavily tied to the human interaction between client and server.\
    \ The human either types in or clicks a URL that makes a request for a resource\
    \ with HTTP. This dance between the client and server and the human in a traditional\
    \ web application involves each step “moving” to a new web page.\n\nBefore the\
    \ Internet grew up into a beast that could handle the massive amounts of multimedia\
    \ that it does today, most applications for the masses were desktop applications.\
    \ If you wanted a digital encyclopedia, you installed it on your computer. The\
    \ application that you interacted with was more or less seamless. When you searched\
    \ for something in your encyclopedia, there was no URL bar with a page that changed\
    \ addresses.\n\nSingle-page web applications seek to return to that seamless application\
    \ experience right in your Internet browser. Quite a bit of this is achieved through\
    \ JavaScript, and our good friend `XMLHttpRequest`. Instead of the human hopping\
    \ from resource to resource through URLs and links to URLs, the code in the background\
    \ handles the resource requests while the human remains on one page.\n\nThe AngularJS\
    \ framework is an abstraction tool that saves the developer from having to build\
    \ the single-page application from the ground up. The single-page web application\
    \ is a complex system, and by no means does AngularJS build it for the developer.\
    \ Instead, it provides a framework based on the model-view-controller (MVC) architectural\
    \ concept.\n\nAngularJS implements the MVC concept as follows:\n\n### Model\n\n\
    > JavaScript objects are the data model.\n\n### View\n\n> HTML (uses syntax for\
    \ data binding with the model).\n\n### Controller\n\n> The JavaScript files that\
    \ use the AngularJS syntax defining and handling the interactions with the model\
    \ and the view.\n"
