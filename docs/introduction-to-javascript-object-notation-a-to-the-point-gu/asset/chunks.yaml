    \ string data typed name-value pairs: `\"color\"` , `\"length\"` , and `\"style\"\
    ` . The `\"head\"` object also has an `\"eyes\"` name-value pair with a value\
    \ of `\"green\"` .\n\n# The JSON String Data Type\n\nWe briefly explored the JSON\
    \ string data type earlier in this book with the animal/cat example:\n\n```\n\
    \ { \"animal\" : \"cat\" }\n```\n\nThe value `\"cat\"` has a string data type.\
    \ In the real world, unless this data is for a pet shop, the string values in\
    \ the data won’t be quite as simple. Even a pet shop might have more to say in\
    \ its data than a single word like “cat.” Perhaps the shop wants to pass along\
    \ the details of its latest promotion:\n\n> Today at Bob’s Best Pets you can get\
    \ a free 8 oz. sample bag of Bill’s Kibble with your purchase of a puppy. Just\
    \ say “Bob’s the best!” at checkout.\n\nThe JSON string can be comprised of any\
    \ of the Unicode characters, and all the characters in that promotional text are\
    \ valid. A string value must always be surrounded in *double* quotes.\n\nIn [“A\
    \ Story: The Double Quotes of JSON”](#text00004.html_astory_sidebar) in [Chapter 2](#text00004.html_chapter_jsonsyntax)\
    \ , I mentioned that single quotes around a string value are not valid ([Example 3-4](#text00005.html_ex3-4_invalidjson)\
    \ ).\n\n##### Example 3-4. This is not valid JSON\n\n```\n {\n    'title': 'This\
    \ is my title.',\n    'body': 'This is the body.'\n}\n```\n\nThis can be confusing,\
    \ especially if you’ve seen JavaScript object literals in the past that use single\
    \ quotes. In JavaScript, we are allowed to use single quotes or double quotes\
    \ interchangeably. However, it is important to remember that JSON is not a JavaScript\
    \ object literal; it is only *based on* JavaScript object literals. In JSON, only\
    \ double quotes are allowed for surrounding a string value.\n\nAlso mentioned\
    \ in the previous chapter was how JSON is read by a parser. In the eyes of a parser,\
    \ when a value begins with a double quote (`\"` ), it expects a string of text\
    \ that will be ended by another double quote. This poses a problem if the string\
    \ of text contains double quotes in it.\n\nFor example, suppose we’re running\
    \ a pet shop promotion where customers need to say “Bob’s the best!” at checkout\
    \ to receive a free bag of kibble. If we use the code in [Example 3-5](#text00005.html_ex3-5_problem)\
    \ , we would run into a problem, because we can’t simply surround the promotional\
    \ data in double quotes.\n\n##### Example 3-5. This code won’t work\n\n```\n {\n\
    \    \"promo\": \"Say \"Bob's the best!\" at checkout for free 8oz bag of kibble.\"\
    \n}\n```"
