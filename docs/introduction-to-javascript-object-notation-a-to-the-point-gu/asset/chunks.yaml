  trans: "\n值内部包含了引号，解析器会将宣传文本中“Bob”字前面的第一个引号字符识别为字符串的结束。然后，当解析器发现剩余的文本悬空在那里，且不属于任何键值对时，它将会产生一个错误。为了解决这个问题，我们必须在任何字符串值内部的引号前面加上一个反斜杠字符（`\\\
    `）来对其进行转义，如示例 3-6 所示。\n\n### 示例 3-6. 使用反斜杠字符转义字符串内的引号解决了问题\n\n```\n {\n    \"\
    promo\": \"Say \\\"Bob's the best!\\\" at checkout for free 8oz bag of kibble.\"\
    \n}\n```\n\n这个反斜杠字符会告诉解析器，该引号并不是字符串的结束。一旦解析器实际上将字符串加载到内存中，任何位于引号之前的反斜杠字符都将被删除，文本将以预期的方式输出。\n\
    \n在处理 JSON 字符串时，引号并不是唯一需要转义的内容。因为反斜杠字符用于转义其他字符，所以我们必须转义反斜杠本身。例如，示例 3-7 所示的 JSON\
    \ 旨在表示我的 *Program Files* 目录的位置，会导致错误。要修复这个问题，我们必须通过添加另一个反斜杠字符来转义反斜杠字符，如示例 3-8\
    \ 所示。\n\n### 示例 3-7. 代码中使用的反斜杠将抛出错误\n\n```\n {\n    \"location\": \"C:\\Program\
    \ Files\"\n}\n```\n\n### 示例 3-8. 反斜杠字符必须用另一个反斜杠字符转义\n\n```\n {\n    \"location\"\
    : \"C:\\\\Program Files\"\n}\n```\n\n除了双引号和反斜杠字符，你必须转义以下字符：\n\n* `\\/`（正斜杠）\n\
    * `\\b`（退格）\n* `\\f`（分页符）\n* `\\t`（制表符）\n* `\\n`（换行符）\n* `\\r`（回车符）\n* `\\u` 后接跟十六进制字符（例如，微笑表情，`\\\
    u263A`）\n\n示例 3-9 所示的 JSON 将产生解析器错误，因为制表符和换行符必须被转义。示例 3-10 显示了如何修复这个问题。\n\n###\
    \ 示例 3-9. 此 JSON 中使用的制表符和换行符将导致错误\n\n```\n {\n    \"story\": \"\\t Once upon a\
    \ time, in a far away land \\n there lived a princess.\"\n}\n```\n\n### 示例 3-10.\
    \ 转义了制表符和换行符的 JSON\n\n```\n {\n    \"story\": \"\\\\t Once upon a time, in a far\
    \ away land \\\\n there lived a princess.\"\n}\n```\n\n# JSON 数字数据类型\n\n数字是数据传递中常见的信息。库存、金钱、纬度/经度和地球质量都是都可以表示为数字的数据；请参示例\
    \ 3-11 。\n\n### 示例 3-11. 在 JSON 中表示数字\n\n```\n {\n    \"widgetInventory\": 289,\n\
    \    \"sadSavingsAccount\": 22.59,\n    \"seattleLatitude\": 47.606209,\n    \"\
    seattleLongitude\": -122.332071,\n    \"earthsMass\": 5.97219e+24\n}\n```\n\n\
    JSON 中的数字可以是整数、小数、负数或指数。\n\n我的小部件库存是 289。库存通常用整数（或整体）表示。我通常不卖某物的一半，所以我的库存数字永远不会包含小数点。\n\
    \n可怜的储蓄账户有 $22.59。虽然某些编程语言确实有用于货币的数据类型，但我们通常在 JSON 中用小数表示货币，并省略 $ 符号。\n\n如果你看看西雅图市的纬度，你会发现它们都是小数，而且经度是一个负小数。负数用数字前的标准减号字符表示。\n\
    \n此外，我使用科学计数法（E Notation）用千克表示巨大的地球质量。科学计数法对于科学数据特别有用，并且是一种支持的数字类型。\n\n# JSON\
    \ 布尔数据类型\n\n在英语中，我们对问题最简单的两个答案是“yes”或“no”。如果你问你的朋友“你想吃鸡蛋配吐司吗？”，他会回答“yes”或“no”。\n\
    \n在计算机编程中，布尔数据类型非常简单。它只有 true 或 false。如果你问你的电脑“你想吃鸡蛋配吐司吗？”，它会回答“true”或“false”。\n\
    \n在某些编程语言中，`true` 的字面值可以是 `1`，false 为 `0`。有时字面值字符会区分大小写——例如，`True` 或 `TRUE`。在\
    \ JSON 中，`true` 的字面值可以是 `true`。任何其他大小写都会产生错误。\n\n在示例 3-12 中，布尔值为 `false`：\n\n\
    ```\n {\n    \"toastBreakfast\": false,\n    \"Lunch\": false\n}\n```\n\n在示例 3-13\
    \ 中，布尔值为 `true`：\n\n```\n {\n    \"freckleCount\": 1,\n    \"hairy\": true\n}\n\
    ```\n\n# JSON Null 类型\n\n当我们无所有时，使用 `null`。在 JSON 中，`null` 是一个表示空值或无的值。它不同于 `0`\
    \ 或 `false`。\n\n`null` 通常用于表示变量存在但没有值。例如，如果用户没有提供电话，我们将该字段设置为 `null`。\n\n```\n\
    \ {\n    \"phoneNumber\": null\n}\n```\n\n# JSON 数组数据类型\n\n现在让我们探索数组类型。如果你不熟悉数组，没关系。让我们看一下数组。\n\
    \n想象一个装鸡蛋的容器。这个容器有 12 个隔层。当我第一次买鸡蛋时，有 12 个。这是一个大小为 12 的数组，包含 12 个鸡蛋。请参示例 3-15\
    \ 。\n\n### 示例 3-15. 这是一个字符串数组（为了简单起见，我对隔层中的每个鸡蛋都使用了字符串“egg”）\n\n```\n {\n    \"\
    eggCarton\": [\n        \"egg\",\n        \"egg\",\n        \"egg\",\n       \
    \ \"egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\"\
    ,\n        \"egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\"\n   \
    \ ]\n}\n```\n\n注意，我有一个键值对。键是 `\"eggCarton\"`，值是一个数组。数组始终位于方括号（`[]`）中。在数组内部，我们有一个列表，每个列表项用逗号分隔。这看起来与我们格式化键值对的方式相似，但区别在于它只有值的列表。这些值可以是任何有效的\
    \ JSON 数据类型（字符串、数字、对象、布尔、数组和 null）。\n\n现在假设我取出两个鸡蛋，给自己做早餐煎蛋配吐司。我的蛋盒仍然有 12 个隔层，但缺少了两个鸡蛋。请参示例\
    \ 3-16 。\n"
- fmt: "\n### Example 3-16. I’ve removed two eggs from the carton to make breakfast\n\
    \n```\n {\n    \"eggCarton\": [\n        \"egg\",\n        null,\n        \"egg\"\
    ,\n        \"egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\",\n  \
    \      \"egg\",\n        \"egg\",\n        \"egg\",\n        null,\n        \"\
    egg\"\n    ]\n}\n```\n\nAs you can see, I removed the eggs from two specific compartments.\
    \ Those compartments became empty because the eggs no longer exist. We represent\
    \ this with `null`.\n\nAn array has an index for each of the “compartments.” We\
    \ begin with 0, so the first compartment has an index of 0, the second has an\
    \ index of 1, and so on. The last compartment will have an index of 11. So, I\
    \ removed the eggs at the indices of 1 and 10. This is a valid array.\n\nIf I\
    \ put the number `5` in the empty compartment at index 10, in most programming\
    \ languages this would be an invalid array. See [Example 3-17](#text00005.html_example_317).\n\
    \n### Example 3-17. This would not be valid in most programming languages\n\n\
    ```\n {\n    \"eggCarton\": [\n        \"egg\",\n        null,\n        \"egg\"\
    ,\n        \"egg\",\n        \"egg\",\n        \"egg\",\n        \"egg\",\n  \
    \      \"egg\",\n        \"egg\",\n        \"egg\",\n        5,\n        \"egg\"\
    \n    ]\n}\n```\n\nI said “most programming languages,” but in JSON, the mixing\
    \ and matching of data types is valid. I will tell you why, and then I will tell\
    \ you why you shouldn’t do this in your JSON.\n\nIn JavaScript, you define a variable.\
    \ For instance, in [Example 3-18](#text00005.html_example318), we have a variable\
    \ named `something` and we assign it the number `5` for its value.\n\n### Example\
    \ 3-18. Defining a variable in JavaScript\n\n```\n var something = 5;\n```\n\n\
    On the very next line, we could change that variable to have a string value ([Example\
    \ 3-19](#text00005.html_example319_stringvalue)).\n\n### Example 3-19. Changing\
    \ that variable to have a string value\n\n```\n something = \"bob\";\n```\n\n\
    And we could even change it to have a value of an object ([Example 3-20](#text00005.html_ex320_valueobject)).\n\
    \n### Example 3-20. Changing that variable to have a value of an object\n\n```\n\
    \ something = { person: \"bob\" };\n```\n\nThe value for my `var something` (variable)\
    \ can be a number, string, array, `null`, or object. In most programming languages,\
    \ variables aren’t allowed to be so shifty. Normally you would declare something,\
    \ as either an `int`, a `string`, or an `object`. So, when you declared your variable\
    \ called `something`, you would say `int something = 5`. You would say `string\
    \ something = \"bob\"` or you would say `Person something = new Person(\"bob\"\
    )`. So in most programming languages, when you declare an array, you are declaring\
    \ ahead of time what data type has to be in each of your containers, and you can’t\
    \ just change it around after the fact.\n\nJSON is a data interchange format.\
    \ If you hand your JSON array over to someone that is not going to be using your\
    \ JSON with JavaScript, your array will cause an error when it is being parsed.\n\
    \nFor example, suppose you attend a convention where merchants are selling collections\
    \ of rocks. You have a collection of rocks to sell. A guy shows up and wants to\
    \ buy your collection of 50 rocks, and he takes them, but when he gets home he\
    \ finds the rock collection does not contain 50 rocks, but it contains 20 rocks,\
    \ 20 sticks, and 10 pieces of gum (one of which has already been chewed).\n\n\
    Let’s take a closer look at some examples of arrays of each data type. In JSON,\
    \ the array can be any of the supported data types. So, we can have an array of\
    \ strings, an array of numbers, an array of booleans, an array of objects, or\
    \ an array of arrays. An array of arrays is called a multidimensional array. Let’s\
    \ take a look at some examples.\n\nSuppose we have a roster with the names of\
    \ students who signed up for a course. This can be represented using an array\
    \ of strings ([Example 3-21](#text00005.html_ex321)).\n\n### Example 3-21. Using\
    \ an array of strings to represent a roster of students\n\n```\n {\n    \"students\"\
    : [\n        \"Jane Thomas\",\n        \"Bob Roberts\",\n        \"Robert Bobert\"\
    ,\n        \"Thomas Janerson\"\n    ]\n}\n```\n\nAfter the students have taken\
    \ a test, we can use an array of numbers to represent their scores ([Example 3-22](#text00005.html_ex322)).\n\
    \n### Example 3-22. Using an array of numbers to represent test scores\n\n```\n\
    \ {\n    \"scores\": [\n        93.5,\n        66.7,\n        87.6,\n        92\n\
    \    ]\n}\n```\n\nIf we need to create an answer key for a true/false test, we\
    \ could use an array of booleans ([Example 3-23](#text00005.html_ex323)).\n\n\
    ### Example 3-23. Using an array of booleans to represent the answers of a true/false\
    \ test\n\n```\n {\n    \"answers\": [\n        true,\n        false,\n       \
    \ false,\n        true,\n        false,\n        true,\n        true\n    ]\n\
    }\n```\n\nAn array of objects could be used to represent the entire test, including\
    \ questions and answers ([Example 3-24](#text00005.html_ex324)).\n\n### Example\
    \ 3-24. Using an array of objects to represent the questions and answers of a\
    \ test\n\n```\n {\n    \"test\": [\n        {\n            \"question\": \"The\
    \ sky is blue.\",\n            \"answer\": true\n        },\n        {\n     \
    \       \"question\": \"The earth is flat.\",\n            \"answer\": false\n\
    \        },\n        {\n            \"question\": \"A cat is a dog.\",\n     \
    \       \"answer\": false\n        }\n    ]\n}\n```\n\nTo represent the scores\
    \ from three different tests, an array of arrays, or a multidimensional array,\
    \ could be used ([Example 3-25](#text00005.html_ex325)).\n\n### Example 3-25.\
    \ Using an array of arrays to represent the scores from three different tests\n\
    \n```\n {\n    \"tests\": [\n        [\n            true,\n            false,\n\
    \            false,\n            false\n        ],\n        [\n            true,\n\
    \            true,\n            true,\n            true,\n            false\n\
    \        ],\n        [\n            true,\n            false,\n            true\n\
    \        ]\n    ]\n}\n```\n\n# Key Terms and Concepts\n\nThis chapter covered\
    \ the following key terms:\n\nJSON string data type\n\n> A string value, like\
    \ `\"my string\"` , surrounded in double quotes.\n\nJSON boolean data type\n\n\
    > A `true` or `false` value.\n\nJSON number data type\n\n> A number value, like\
    \ `42`, that can be a positive or negative integer, decimal, or exponent.\n\n\
    JSON null data type\n\n> A `null` value represents an empty value.\n\nJSON array\
    \ data type\n\n> An array is a collection or list of values, and the values can\
    \ have a data type of string, number, boolean, object, or array; the values in\
    \ an array are surrounded by square brackets (`[]`) and delimited by a comma.\n\
    \nJSON object data type\n\n> The object data type is a set of name-value pairs\
    \ delimited by a comma and surrounded by curly brackets (`{}`).\n\nWe also discussed\
    \ these key concepts:\n\n*   The boolean data type value of `true` or `false`\
    \ in JSON is always all lowercase characters (i.e., `true`, not `True` or `TRUE`).\n\
    \n*   The `null` data type value in JSON is always all lowercase characters (i.e.,\
    \ `null`, not `NULL` or `Null`).\n\n*   One key difference between an object and\
    \ an array is that an object is a list or collection of name-value pairs and an\
    \ array is a list or collection of values.\n\n*   Another key difference between\
    \ an array and an object is that an array’s values *should* all have the same\
    \ data type.\n\n# Chapter 4. JSON Schema\n\nIn [Chapter 3](#text00005.html_chapter_jsondatatypes),\
    \ we covered the JSON data types. The importance and usefulness of data types\
    \ was discussed. Knowing ahead of time what something is and what it is for (remember\
    \ the kid with the hammer) makes a world of difference.\n\nIn most scenarios with\
    \ data interchange formats, the data is being created to send across the Internet\
    \ or a network to another party. That party usually has a desired format for the\
    \ document that they are expecting, including structure and data types. They will\
    \ usually provide documentation that explains the format and provides examples.\n"
