  trans: "\n你的互联网浏览器与网站之间存在着关系，就像我与 Pierre’s Fine Dining 餐厅之间的关系一样。这种关系是一个充满*请求*与*响应*的热闹世界。我请求一份食物，厨房通过制作我请求的特定食物并将其发送给我做出响应。\n\
    \n当你访问喜爱的网站看可爱猫咪照片时，你电脑上的互联网浏览器就是客户端，而托管这些可爱猫咪照片的电脑就是服务器。你的互联网浏览器发送一个请求，该请求在互联网上传输，直到可爱猫咪网站背后的计算机接收到它。然后，可爱猫咪网站会在响应中提供页面，该响应通过互联网传回。接着，你的浏览器会在屏幕上为你渲染出该页面。\n\
    \n在这种关系中，我们划了一条分界线，并称可爱猫咪网站通过响应发送的所有且将由浏览器处理的内容都称为“客户端代码”。在餐厅的例子中，响应就是那盘菜，而我坐的桌子就是互联网浏览器。桌子接收了菜，现在我就可以看到并享用了了。\n\
    \n我们接着说，在响应页面发送之前发生的一切（本质上是它的创建过程）都是“服务器端代码”。在餐厅的例子中，服务器端代码就是厨房里发生的一切。我从不进入厨房，也看不到他们在里面是如何制作我的那盘菜的。餐厅例子与现实世界之间的细微差别在于，服务器并不是那个在厨房和桌子之间来回跑的人。厨房是服务器，而那就是互联网。\n\
    \n公众看不到可爱猫咪网站在它比喻的厨房里在做什么。该网站可能在使用 PHP、ASP.NET 或任何其他编程语言。无论它在厨房里使用什么，只要网站交付一个带有客户端代码的响应，对我我的浏览器来说就无关紧。\n\
    \n我从网站获得的响应是 HTML、CSS 和 JavaScript 的组合。就像我可以检查餐厅桌上的所有东西一样，我可以在浏览器中按 F12，使用开发者工具查看页面的所有\
    \ HTML、CSS 和 JavaScript。我甚至能看到那个烦人的、带有跳舞猫咪闪烁弹出窗口的 JavaScript 代码。\n\n客户端是用户互联网浏览器中发生的一切，而服务器端是位于托管网站的服务器上发生的一切。当提到客户端代码时，通常指的是\
    \ JavaScript、HTML 或 CSS。当提到服务器端代码时，通常指的是如 ASP.NET、Ruby on Rails 或 Java 等服务器端语言。\n\
    \n现在，让我们来看一下安全忧虑这一重要主题。\n\n# 跨站请求伪造 (CSRF)\n\n跨站请求伪造，或 CSRF（读作 sea-surf），是一种利用网站对用户互联网浏览器的信任的攻击手段。CSRF\
    \ 漏洞已经存在很长时间了，远在 JSON 出现之前。\n\n一个使用 JSON 的 CSRF 攻击示例如下所示。\n\n你登录了一个银行网站。该网站有一个\
    \ JSON  URL，其中包含了关于你的一些敏感信息（示例 5-1）。\n\n## 示例 5-1. JSON 格式的你的敏感信息\n\n```json\n\
    [\n    {\n        \"user\": \"bobbarker\"\n    },\n    {\n        \"phone\": \"\
    555-555-5555\"\n    }\n]\n```\n\n你可能会想：“嘿，这个 JSON 缺少了大括号！”这是有效的 JSON。是危险的有效 JSON，因为它也是有效的\
    \ JavaScript 脚本。这被称为*顶层 JSON 数组*。\n\n示例中的银行网站使用会话 Cookie 进行身份验证，以确保这些信息仅提供给你——已登录并注册的用户。\n\
    \n此示例中的坏人找到了银行网站上敏感 JSON 数据的 URL，并将其放在*他自己*网站的一个 `<script>` 标签中。如果你不确定 `<script>`\
    \ 标签是什么，你可以在大多数现代网页的后台找到它们。这被称为后置代码（code-behind），是一个 HTML 文档。如果你访问你喜爱的网站，右键点击并选择“查看源代码”，你应该能找到一个或多个类似于示例\
    \ 5-2 所示的标签。\n\n## 示例 5-2. <script> 标签示例（该标签中的“src”属性指定了脚本所在的位置）\n\n```html\n\
    <script src=\"https://code.jquery.com/jquery-2.1.4.min.js\"></script>\n```\n\n\
    互联网浏览器对于不同域名的网站之间的共享有规定（`http://domainone.com` 和 `http://domaintwo.com` 是不同的域名）。坏人使用\
    \ `<script>` 标签是因为它可以免于那些共享规则（示例 5-3）。使用托管在另一个网站的脚本通常是必要且常的，因此 `<script>` 标签获得了一个例外。该\
    \ JSON 使用顶层数组使其成为有效的 JavaScript，所以他得逞了。\n\n## 示例 5-3. 坏人网站上的 <script> 标签可能的样子\n\
    \n```html\n<script src=\"https://www.yourspecialbank.com/user.json\"></script>\n\
    ```\n\n这种操作能起作用的一个关键点是你与银行网站之间的关系。如果没有这种关系，`<script>` 标签中的链接将不会返回敏感数据。该链接并不只是托管你的敏感数据。它是一个动态链接，为已登录的用户返回敏感数据。当你登录银行时，你建立了一种银行信任你所声明身份的关系。\n\
    \n这种攻击依赖于这种信任。为了让坏人利用这种信任，他需要你在访问其窃取的 `<script>` 标签的网站时登录银行。为了实现这一点，坏人可能会向人们发送数百万封邮件，说：“你的银行网站有一条重要消息。”这些邮件的格式通常与人们熟悉的银行（或他们尝试攻击的网站）的邮件完全一致。如果他们不检查邮件头查看是谁发送的，或者不悬停在链接上质疑它是否指向他们信任网站的真实域名，那么他们很可能会点击。\n\
    \n为了 sake 起见，假设你当时生病了，头脑不清，所以你点击了链接。此外，你上次离开银行网站时没有注销，所以你的会话仍然存在。你正处于与银行的关系状态中。一旦坏人网站的页面加载，你可能会意识到自己来了一个奇怪的地方并离开。但那时已经太晚了。坏人网站已经获取了敏感的\
    \ JSON 数据并将其传回自己的服务器并留存。哎。\n\n银行及其 Web 开发人员可以采取什么不同的做法来防止 CSRF 攻击？\n\n首先，银行可以将数组转换为\
    \ JSON 对象中的一个值。这将使其成为无效的 JavaScript。参见示例 5-4。\n\n## 示例 5-4. 通过将数组封装在对象中，它不再是可以在\
    \ <script> 标签中加载的有效 JavaScript\n\n```json\n{\n    \"info\": [\n        {\n   \
    \         \"user\": \"bobbarker\"\n        },\n        {\n            \"phone\"\
    : \"555-555-5555\"\n        }\n    ]\n}\n```\n"
- fmt: "\nAlso, if the bank had only allowed `POST` requests instead of `GET` requests\
    \ to retrieve the sensitive `JSON`, then the bad guy couldn’t have used the link\
    \ in his URL. `GET` and `POST` are two HTTP methods that are used to communicate\
    \ with the server. `GET` is a request for data, and can return a response. `POST`\
    \ is a submission of data, and can also return a response. If a server allows\
    \ a `GET` request for a link, it can be linked to directly in a browser or a `<script>`\
    \ tag. `POST`, however, cannot be linked to directly. Without that handy `<script>`\
    \ tag, the bad guy would have his hands tied with resource sharing policies, preventing\
    \ him from doing anything else client side that could spoof the bank into trusting\
    \ him.\n\nThis does not mean that HTTP data interchange with `JSON` should be\
    \ entirely limited to the `POST` method. A good rule of thumb for deciding whether\
    \ or not to allow `GET` requests for a page or resource is to ask: will this page\
    \ ever need to be accessed directly by URL, or used in a `<script>` tag? If the\
    \ answer is “no,” then the `GET` method should be disallowed to prevent just anyone\
    \ from accessing it via a URL or `<script>` tag.\n\n*Sensitive* data is also key\
    \ to this exploit. If the `JSON` only contained a list of species of birds, the\
    \ bad guy probably wouldn’t set up a site to attempt to steal the data. However,\
    \ in being prepared for security threats, habits are important. If you don’t get\
    \ into the habit of using top-level arrays in your `JSON`, and you don’t get into\
    \ the habit of conveniently using `GET` instead of `POST`, then you aren’t susceptible\
    \ to being that person that wrote the code that caused a huge exploit and a bunch\
    \ of angry customers.\n\n# Injection Attacks\n\nInjection attacks take many shapes\
    \ and forms. Ultimately, they rely on finding exploitable holes in security. The\
    \ CSRF attack that was just covered was an attack that relied on trust. An *injection\
    \ attack* is an attack that relies on the ability to inject malicious code into\
    \ an otherwise innocent website.\n\n## Cross-Site Scripting (XSS)\n\nCross-site\
    \ scripting (XSS) attacks are a type of injection attack. A hole in security that\
    \ often takes place with `JSON` is at the point where the JavaScript fetches a\
    \ string of `JSON` and turns it into a JavaScript object.\n\nRemember that `JSON`\
    \ by itself is just text. In programming, if we want to do anything useful with\
    \ that textual representation of an object, it needs to be loaded into memory\
    \ as an object. It can then be manipulated, inspected, and used in programming\
    \ logic.\n\nIn JavaScript, one way to do this is by using a function called `eval()`,\
    \ which takes a string, compiles it, and then executes it.\n\nIn [Example 5-5](#text00007.html_ex0505),\
    \ the JavaScript code uses the `eval()` function to load the animal/cat object\
    \ into memory. The properties of the object can then be accessed in the code.\
    \ The alert on the third line will pop up a browser alert that says “cat.”\n\n\
    ### Example 5-5. Accessing object properties\n\n```\n var jsonString = '{\"animal\"\
    :\"cat\"}';    \n    var myObject = eval(\"(\" + jsonString + \")\"); \n    alert(myObject.animal);\n\
    ```\n\nAs `JSON` has grown up over the years this vulnerability has been recognized.\
    \ The `JSON.parse()` function deals with this vulnerability by being discriminate.\
    \ This function will only parse `JSON`, and will not execute scripts. [Example\
    \ 5-7](#text00007.html_ex0507) replaces `eval()` with `JSON.parse()`.\n\nIn web\
    \ development, another concern that often weighs just as heavily as security concerns\
    \ is cross-browser support. As the Web evolves, those who host websites must decide\
    \ which browsers and which versions they should support. Essentially, they have\
    \ to decide who to leave behind. There will always be people that don’t update\
    \ their Internet browsers, or who use a less popular Internet browser that isn’t\
    \ keeping up with the evolving standards.\n\nThe much safer `JSON.parse()` function\
    \ is currently supported in all major Internet browsers and their most recent\
    \ versions. However, some earlier Internet browser versions that a small percentage\
    \ of users are still on do not support this function. If `JSON.parse()` is used,\
    \ that small percentage of users will not be able to use the functionality of\
    \ the website that relies on `JSON`. Oftentimes, this is dealt with by finding\
    \ ways to gracefully fail. For example, instead of a web page full of rampant\
    \ errors, consider one that catches those errors and displays a message such as\
    \ “Please update your browser to the latest version.”\n\n## Holes in Security:\
    \ Architectural Decisions\n\nAt the beginning of the chapter, I said, “`JSON`\
    \ by itself is not a threat.” This still holds true, but there are some scenarios\
    \ in which a threat can be included directly within the `JSON` data, while still\
    \ remaining valid `JSON`.\n\nLet’s take a look at some perfectly innocent `JSON`\
    \ ([Example 5-8](#text00007.html_ex0508)).\n\n### Example 5-8. Perfectly innocent\
    \ JSON\n\n```\n {\n    \"message\": \"hello, world!\"\n}\n```\n\nNow let’s pretend\
    \ that I host a website that stores messages in a database and then displays them\
    \ on a web page for a user to read. I’ve never heard of this exploit, so I have\
    \ a page where one user can send another user a message that contains anything.\
    \ On my messages page, I request the `JSON` string from the server, and client\
    \ side I use the `eval()` JavaScript function to convert the `JSON` string response\
    \ to a JavaScript object. I use that JavaScript object in my client-side code\
    \ to display the message value directly in the HTML.\n\nLet’s take a look at some\
    \ less innocent `JSON` in [Example 5-9](#text00007.html_ex0509).\n\n### Example\
    \ 5-9. Not-so-innocent JSON\n\n```\n {\n    \"message\": \"<div onmouseover=\\\
    \"alert('gotcha!')\\\">hover here.</div>\"\n}\n```\n\nThe not-so-innocent `JSON`\
    \ in the example includes JavaScript. While this JavaScript is within the bounds\
    \ of the `JSON` name-value pair, it is simply a string of text. This is perfectly\
    \ valid `JSON` and there are many places where this `JSON` could be used that\
    \ is not a threat.\n\nHowever, the JavaScript in the example, when outputted within\
    \ the HTML on the messaging website, is a threat. The “not-so-innocent `JSON`”\
    \ shown here will cause an alert to pop up with the message “gotcha!” every time\
    \ the user hovers their mouse cursor over the message on the screen. The problem\
    \ is that far worse could be done than popping up an alert. A bad guy could include\
    \ a script to access all of your private messages on the page and send them to\
    \ his own server to read.\n"
