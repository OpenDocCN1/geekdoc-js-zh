  trans: "\n\n《JavaScript 对象表示导引》（Introduction to JavaScript Object Notation）封面上的动物是海豹（*Phoca\
    \ vitulina*），这是一种常见于北美和欧洲沿岸温带及北极水域的海洋哺乳动物。它们是“真海豹”，这意味着它们的前鳍较短，身体像香肠一样粗壮，且没有外耳廓。\n\
    \n每只海豹都可以通过独特的斑点图案来识别，且颜色各异：它们可以是银色、灰色、棕色、蓝灰色或褐色，斑点的深浅取决于其皮发的主色。平均体长为 6 英尺，重量范围在\
    \ 120 到 370 磅之间；雌性体比雄性略小。\n\n虽然海豹在爬上陆地（被称为“上岸”）时可能看起来很笨拙，但它们流线型的躯体和强力的后鳍让它们在水中非常敏捷且强大。它们的饮食随季节在不同觅食地之间的移动而变化，但海豹通常食用各种鱼类、鱿鱼、甲壳类和软体动物。它们可以潜水达\
    \ 1500 英尺，并在水下停留长达 40 分钟，但持续 3-7 分钟的浅潜更为常见。\n\n海豹大约有一半的时间在陆地上度过——主要是休息和调节体温，也是为了社交和产仔。海豹通常有喜爱的休息和产仔地，但如果该地经常受到人类干扰，它们就会离开该地。因此，在已知的海豹上岸海滩附近进行海岸开发需要仔细考虑。\n\
    \n海豹幼崽出生就能游泳，几天后就能水下停留长达两分钟。它们在四到六周后断奶，但由于母乳脂肪含量高，它们在此期间重量几乎增加了一倍。\n\nO'Reilly\
    \ 封面上的许多动物都是濒危物种；它们对世界都很重要。要了解更多如何提供帮助的信息，请访问 [animals.oreilly.com](http://animals.oreilly.com)。\n\
