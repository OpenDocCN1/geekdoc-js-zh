  trans: "\n### 示例 8-14. 将更新后的 JSON 文档发布到 `http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c`\
    \ 后的响应\n\n```\n {\n    \"ok\": true,\n    \"id\": \"3636fa3c716f9dd4f7407bd6f700076c\"\
    ,\n    \"rev\": \"3-29ede949ceed9df62bd7caecb095bffe\"\n}\n```\n\n如果我想删除一个文档，我会使用\
    \ HTTP `DELETE` 方法，并将修订版标识符作为查询字符串参数传递到 URL 中（参见示例 8-15）。\n\n### 示例 8-15. `rev`\
    \ 作为查询字符串参数传递\n\n```\n http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c?\n\
    \       rev=3-29ede949ceed9df62bd7caecb095bffe\n```\n\n如果我再次请求 URL `http://localhost:5984/accounts/`\
    \ 上的资源，现在会显示有四个文档（参见示例 8-16）。\n\n### 示例 8-16. URL `http://localhost:5984/accounts/`\
    \ 处的 JSON 文档；`doc_count` 名称-值对现在的值为 4\n\n```\n {\n    \"db_name\": \"accounts\"\
    ,\n    \"doc_count\": 4,\n    \"doc_del_count\": 0,\n    \"update_seq\": 8,\n\
    \    \"purge_seq\": 0,\n    \"compact_running\": false,\n    \"disk_size\": 32869,\n\
    \    \"data_size\": 1560,\n    \"instance_start_time\": \"1432493477586600\",\n\
    \    \"disk_format_version\": 6,\n    \"committed_update_seq\": 8\n}\n```\n\n\
    这些示例展示了如何查看和创建存储在 `CouchDB` 数据库中的 JSON 文档。如果这就是我们能做的全部，我们很快就会遇到问题。也许我需要一个只包含名人的姓氏列表。在\
    \ `CouchDB` 中，我们可以通过“视图”来实现。参见示例 8-17。\n\n视图是我们重组和查询 `CouchDB` 数据库中数据的方式。视图存储在称为设计文档的\
    \ JSON 文档中。设计文档指定语言，并且可以包含多个视图。\n\n### 示例 8-17. 用于账户数据库的包含名人视图的 `CouchDB` 设计文档\n\
    \n```\n {\n   \"_id\": \"_design/lists\",\n   \"_rev\": \"8-4124de7756277c6a937004a763d6247d\"\
    ,\n   \"language\": \"javascript\",\n   \"views\": {\n       \"famous\": {\n \
    \          \"map\": \"function(doc){if(doc.lastName!==null&&doc.famous){emit\n\
    \           (doc.lastName,null)}}\"\n       }\n   }\n}\n```\n\n每个视图是一个对象，可以包含\
    \ `map` 和 `reduce` 函数。在示例 8-17 中，只有一个 `map` 函数。`map` 函数将每个文档作为参数，然后调用 `emit()`\
    \ 函数。这实际上是对数据进行转换（参见示例 8-18）。\n\n### 示例 8-18. 深入了解 `famous` 视图的 `map` 函数\n\n```\n\
    \ function(doc) {\n    if (doc.lastName !== null && doc.famous) {\n        emit(doc.lastName,\
    \ null)\n    }\n}\n```\n\n在示例 8-18 中，该函数检查数据库中的每个 JSON 文档，以确保我们有一个姓氏，并且 `“famous”`\
    \ 的名称-值对为真。`emit()` 的参数是 `key` 和 `value`，它们将显示为转换后文档结果中的名称-值对。\n\n然后我可以通过 URL\
    \ `http://localhost:5984/accounts/_design/lists/_view/famous` 请求此视图作为资源（参见示例 8-19）。结构为\
    \ `/<db-name>/_design/<design_document_name>/_view/<view_name>/`。\n\n### 示例 8-19.\
    \ URL `http://localhost:5984/accounts/_design/lists/_view/famous` 处的资源\n\n```\n\
    \ {\n    \"total_rows\": 2,\n    \"offset\": 0,\n    \"rows\": [\n        {\n\
    \            \"id\": \"ddc14efcf71396463f53c0f880001538\",\n            \"key\"\
    : \"Barker\",\n            \"value\": null\n        },\n        {\n          \
    \  \"id\": \"3636fa3c716f9dd4f7407bd6f700076c\",\n            \"key\": \"Jackson\"\
    ,\n            \"value\": null\n        }\n    ]\n}\n```\n\n除了 `map` 步骤外，你还可以选择对结果进行\
    \ `reduce`。`CouchDB` 有三个内置的 `reduce` 函数：`_count`、`_sum` 和 `_stats`。这些在用 `map`\
    \ 步骤转换数据后用于检索数据集的统计信息。\n\n例如，我可能想要基于性别了解有多少账户。我可以将新视图添加到设计文档中（参见示例 8-20）。\n\n\
    ### 示例 8-20. 添加了 `gender_count` 视图的设计文档\n\n```\n {\n   \"famous\": {\n       \"\
    map\": \"function(doc){if(doc.lastName!==null&&doc.famous){emit\n       (doc.lastName,null)}}\"\
    \n   },\n   \"gender_count\": {\n       \"map\": \"function(doc){if(doc.gender!==null)\
    \ emit(doc.gender);}\",\n       \"reduce\": \"_count\"\n   }\n}\n```\n\n在 `gender_count`\
    \ 视图的 `map` 步骤中，函数从 `gender` 名称-值对发出值。如果没有 `reduce` 步骤，这将生成一个对象数组，其中 `key` 的值为性别（参见示例\
    \ 8-21）。\n\n### 示例 8-21. `map` 步骤后的 `gender_count` 视图\n\n```\n {\n    \"total_rows\"\
    : 4,\n    \"offset\": 0,\n    \"rows\": [\n        {\n            \"id\": \"3636fa3c716f9dd4f7407bd6f700076c\"\
    ,\n            \"key\": \"female\",\n            \"value\": null\n        },\n\
    \        {\n            \"id\": \"ddc14efcf71396463f53c0f8800019ea\",\n      \
    \      \"key\": \"female\",\n            \"value\": null\n        },\n       \
    \ {\n            \"id\": \"3636fa3c716f9dd4f7407bd6f7000552\",\n            \"\
    key\": \"male\",\n            \"value\": null\n        },\n        {\n       \
    \     \"id\": \"ddc14efcf71396463f53c0f880001538\",\n            \"key\": \"male\"\
    ,\n            \"value\": null\n        }\n    ]\n}\n```\n\n在使用内置 `_count` 函数进行\
    \ `reduce` 步骤后，我们得到一个提供所有记录计数的结果（参见示例 8-22）。\n\n### 示例 8-22. URL `http://localhost:5984/accounts/_design/lists/_view/gender_count`\
    \ 处的资源\n\n```\n {\n    \"rows\": [\n        {\n            \"key\": null,\n  \
    \          \"value\": 4\n        }\n    ]\n}\n```\n\n我们想要的是每个唯一性别的计数，因此需要传入 `group`\
    \ 标志以按 key 对结果进行分组。为此，我们在 URL 中添加查询字符串参数 `?group=true`（参见示例 8-23）。\n\n### 示例 8-23.\
    \ URL `http://localhost:5984/accounts/_design/lists/_view/gender_count?group=true`\
    \ 处的资源\n\n```\n {\n    \"rows\": [\n        {\n            \"key\": \"female\"\
    ,\n            \"value\": 2\n        },\n        {\n            \"key\": \"male\"\
    ,\n            \"value\": 2\n        }\n    ]\n}\n```\n\n使用 `CouchDB` API，我们可以为数据库创建任意数量的设计文档和视图。设计文档中的每个视图可以可选地包含\
    \ `map` 和 `reduce` 函数来转换数据。然后，我们可以为存储的 JSON 文档的转换数据集创建自定义的 URL 资源集。本质上，我们可以使用\
    \ `CouchDB` API 为数据构建自己的自定义 API。\n\n# 关键术语和概念\n\n本章涵盖以下关键术语：\n\nRelational Database\n\
    \n> 一种在存储数据中识别关系的数据库结构类型。\n\nNoSQL Database\n\n> 一种在存储数据中*不是*基于关系的数据库结构类型。\n\n\
    `CouchDB`\n\n> 一种文档存储类型的 NoSQL 数据库，以 JSON 文档形式存储数据。\n\n我们还讨论了以下关键概念：\n\n*   在关系数据库中，通常有表、列和行，并且这些表、列和行之间存在关系。有主键和外键。\n\
    \n*   有许多类型的 NoSQL 数据库脱离了关系模型。\n\n我们还讨论了 `CouchDB`。以下是一些需要记住的关键点：\n\n*   它是一种文档存储类型的\
    \ NoSQL 数据库。\n\n*   它存储和管理 JSON 文档。\n\n*   它在存储和检索时保持数据的结构。\n\n*   它使用 HTTP API\
    \ 将数据作为 JSON 文档资源进行访问。\n\n*   它使用 JavaScript 作为查询语言，通过 map 和 reduce 函数实现视图，可通过\
    \ HTTP API 访问。\n\n# 第 9 章 服务器端的 JSON\n\n当我们谈论 Web 客户端-服务器关系时，我们可以将技术分为客户端或服务器端：\n"
- fmt: "\nOn the client side, we have HTML, CSS, and JavaScript.\n\nOn the server\
    \ side, there is PHP, ASP.NET, Node.js, Ruby on Rails, Java, Go, and many, many\
    \ more.\n\nAs a web client, we send requests for resources to a server using HTTP.\
    \ The server responds with a document, such as HTML or JSON. When that document\
    \ is a JSON document, the server side code must handle the creation of it.\n\n\
    In addition to *serving* a JSON document, a server may *receive* a JSON document.\
    \ We saw this in [Chapter 8](#text00010.html_chapter_nosql) when we used HTTP\
    \ to post a JSON document to the CouchDB web API. When a document is received,\
    \ the server-side code must handle the parsing of that document.\n\nIn previous\
    \ chapters, we discussed how JavaScript can make behind-the-scenes HTTP requests\
    \ for JSON resources to web APIs. It's easy to think of JavaScript playing this\
    \ role because it is categorized as \"client side.\" However, JavaScript isn't\
    \ the only language that can make HTTP requests for JSON resources. HTTP requests\
    \ can also be made by a server-side web framework.\n\nIn the scenario where JSON\
    \ is requested by a server-side technology, its role becomes the client. Here\
    \ are some example scenarios where HTTP requests are made by server-side web framework\
    \ code:\n\n* Using a web API for data to populate dynamic pages of a website.\
    \ This could be a public third-party web API or your own private web API such\
    \ as CouchDB.\n\n* Integrating a payment gateway into checkout code for an ecommerce\
    \ website by communicating with a web API.\n\n* Using a web API for retrieving\
    \ real-time shipping costs for shipping to a specific address.\n\nIn this chapter,\
    \ we will be examining JSON's role on the server side. A server-side web framework\
    \ or scripting language produces dynamic web pages. When a request is made for\
    \ a resource, the server creates the resource with some programming logic.\n\n\
    # Serializing, Deserializing, and Requesting JSON\n\nThe success of a data interchange\
    \ format on the Web requires support on both the client and server side. If we\
    \ were to have support on the client side, but not the server side, JSON would\
    \ be dead in the water. Fortunately, JSON is widely supported by most server-side\
    \ web frameworks or scripting languages. If they do not have built-in support\
    \ for serializing and deserializing JSON, it is likely that a library or extension\
    \ exists to support it.\n\n* * *\n\n### Note\n\nAs you'll recall from [Chapter\
    \ 6](#text00008.html_chapter_Jsxmlhttp), serialization is the act of converting\
    \ the object into text. Deserialization is the act of converting the text back\
    \ into an object.\n\nLet's take a look how JSON can be serialized, deserialized,\
    \ and requested server side.\n\n## ASP.NET\n\nASP.NET is a server-side web framework\
    \ developed by Microsoft. Originally, web development with this framework was\
    \ achieved solely with Web Forms, a GUI state-driven model. However, it now includes\
    \ several extensions that allow for development with different models, such as\
    \ ASP.NET MVC (a model-view-controller architecture), and ASP.NET web API (an\
    \ architecture for building HTTP web APIs for Web Services).\n\nAdditionally,\
    \ ASP.NET uses Common Language Runtime (CLR), which allows developers to write\
    \ their code in any CLR-supported language such as C#, F#, Visual Basic .NET (VB.NET),\
    \ and many more. In this section, I will be writing all examples in C#.\n\nUnlike\
    \ JavaScript, ASP.NET does not easily parse JSON. To parse JSON, we must choose\
    \ a third-party ASP.NET library and bring it into our project. At the time this\
    \ book is written, the most popular library is `Json.NET`, an open source JSON\
    \ framework by Newtonsoft.\n\nLet's take a look at how we can serialize and deserialize\
    \ JSON with the `Json.NET` library.\n\n### Serializing JSON\n\nWith ASP.NET and\
    \ `Json.NET`, we can quickly serialize our ASP.NET objects into JSON. First, I\
    \ need an object to work with. For this example, we will create a `CustomerAccount`\
    \ object with the same structure that we used in [Chapter 8](#text00010.html_chapter_nosql)\
    \ (see [Example 9-1](#text00011.html_ex0901)).\n\n#### Example 9-1. A `CustomerAccount`\
    \ object in ASP.NET C#\n\n```csharp\npublic class CustomerAccount\n{\n    public\
    \ string firstName { get; set; }\n    public string lastName { get; set; }\n \
    \   public string phone { get; set; }\n    public Address[] addresses { get; set;\
    \ }\n    public bool famous { get; set; }\n}\n\npublic class Address\n{\n    public\
    \ string street { get; set; }\n    public string city { get; set; }\n    public\
    \ string state { get; set; }\n    public int zip { get; set; }\n}\n```\n\nNow\
    \ that we have a class representing our object, let's create a new object, for\
    \ Bob Barker's account. On the very last line, we will serialize this object to\
    \ JSON using the `Json.NET` library (see Examples [9-2](#text00011.html_ex0902)\
    \ and [9-3](#text00011.html_ex0903)).\n\n#### Example 9-2. A new object for Bob\
    \ Barker's account in C#; in the last line, we serialize this object to JSON\n\
    \n```csharp\nCustomerAccount bobsAccount = new CustomerAccount();\nbobsAccount.firstName\
    \ = \"Bob\";\nbobsAccount.lastName = \"Barker\";\nbobsAccount.phone = \"555-555-5555\"\
    ;\n\nAddress[] addresses;\naddresses = new Address[2];\n\nAddress bobsAddress1\
    \ = new Address();\nbobsAddress1.state = \"123 fakey st\";\nbobsAddress1.city\
    \ = \"Somewhere\";\nbobsAddress1.state = \"CA\";\nbobsAddress1.zip = 96520;\n\n\
    addresses[0] = bobsAddress1;\n\nAddress bobsAddress2 = new Address();\nbobsAddress2.state\
    \ = \"456 fake dr\";\nbobsAddress2.city = \"Some Place\";\nbobsAddress2.state\
    \ = \"CA\";\nbobsAddress2.zip = 96538;\n\naddresses[1] = bobsAddress2;\n\nbobsAccount.addresses\
    \ = addresses;\nbobsAccount.famous = true;\n\nstring json = JsonConvert.SerializeObject(bobsAccount);\n\
    ```\n\n#### Example 9-3. The resulting JSON from the serialization of the ASP.NET\
    \ `CustomerAccount` object\n\n```json\n{\n    \"firstName\": \"Bob\",\n    \"\
    lastName\": \"Barker\",\n    \"phone\": \"555-555-5555\",\n    \"addresses\":\
    \ [\n        {\n            \"street\": null,\n            \"city\": \"Somewhere\"\
    ,\n            \"state\": \"CA\",\n            \"zip\": 96520\n        },\n  \
    \      {\n            \"street\": null,\n            \"city\": \"Some Place\"\
    ,\n            \"state\": \"CA\",\n            \"zip\": 96538\n        }\n   \
    \ ],\n    \"famous\": true\n}\n```\n\n### Deserializing JSON\n\nWe can deserialize\
    \ JSON back into an ASP.NET object with one line of code ([Example 9-4](#text00011.html_ex0904)).\n\
    \n#### Example 9-4. The deserialization of the JSON string from the earlier example;\
    \ it is deserialized to the specified type, `CustomerAccount`\n\n```csharp\nCustomerAccount\
    \ customerAccount = \n    JsonConvert.DeserializeObject<CustomerAccount>(json);\n\
    ```\n\n`Json.NET` gives us the ability to deserialize our JSON into a specific\
    \ type of object, such as the `CustomerAccount` object from the example. With\
    \ this, our data can retain its shape as it moves in and out of the server-side\
    \ code. However, it is important that our object property names match up with\
    \ the names of the name-value pairs in our JSON document. Otherwise, deserialization\
    \ will fail.\n\n### Requesting JSON\n\nTo make an HTTP request for a resource,\
    \ I can use the built-in ASP.NET `System.Net.WebClient` class. With this class,\
    \ I can call the `DownloadString` method to download the requested resource from\
    \ a specified URL as a string (see Examples [9-5](#text00011.html_ex0905) and\
    \ [9-6](#text00011.html_ex0906)).\n\n#### Example 9-5. Downloading a JSON address\
    \ document as a string from my local CouchDB addresses database\n\n```csharp\n\
    using(var webClient = new WebClient())\n{\n    string json = webClient.DownloadString(\"\
    3636fa3c716f9dd4f7407bd6f700076c\");\n}\n```\n\n#### Example 9-6. The JSON resource\
    \ at the URL `http://localhost:5984/accounts/3636fa3c716f9dd4f7407bd6f700076c`\n\
    \n```json\n{\n    \"_id\": \"3636fa3c716f9dd4f7407bd6f700076c\",\n    \"_rev\"\
    : \"2-e04207c11104e06b3a8f030f14c35580\",\n    \"address\": {\n        \"street\"\
    : \"456 Fakey Fake st\",\n        \"city\": \"Somewhere\",\n        \"state\"\
    : \"CA\",\n        \"zip\": \"96520\"\n    },\n    \"age\": 54,\n    \"gender\"\
    : \"female\",\n    \"famous\": true,\n    \"firstName\": \"Janet\",\n    \"lastName\"\
    : \"Jackson\"\n}\n```\n"
