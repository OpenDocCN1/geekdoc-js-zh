    ```\n\n现在传感器值应该定期显示在 LCD 屏幕上。怎么样？\n\n## [6] 调试准备\n\n既然有了一些运动，你可能想进一步调整运动。程序中写入的速度常数和模糊常数是根据我们的环境临时设置的，所以请适应你的环境。但是，每次重写程序都很耗时。所以，如果你有能力，使用另一个\
    \ micro:bit 并从外部 PC 重写这些值会非常方便。这对于以后检查程序流程非常有用。\n\n### (1) 监视器配置\n\n如下图所示。\n![](img/image_rsrc2DK.jpg)\n\
    \nmicro:bit 内置的无线通信功能使其易于实现。\n\n### (2) 凸轮机器人侧\n\n在凸轮机器人侧使用以下函数。\n![](img/image_rsrc2DM.jpg)\n\
    \n切换到 Javascript 时，如下所示。\n\n```\n--------------------------------------------\n\
    radio.onReceivedString(function (receivedString) {})\nradio.setTransmitPower(7)\n\
    radio.setGroup(1)\nbasic.forever(function () {\n    radio.sendString(\"12345\"\
    )\n})\n--------------------------------------------\n```\n\n### (3) 用于中继的 micro:bit\
    \ 侧\n\n此外，在专门用于发送和接收的 micro:bit 侧，准备以下块并写入。\n![](img/image_rsrc2DN.jpg)\n\n###\
    \ (4) PC 侧\n\n从以下 URL 下载用于串行通信的驱动程序，并将其设置在与此专用发送/接收 micro:bit 进行串行通信的 PC 上。\n\
    （下载 URL）https://os.mbed.com/docs/mbed-os/v5.15/tutorials/windows-serial-driver.html\n\
    \n此外，PC 侧需要具有显示从 micro:bit 发送的字符串以及轻松向 micro:bit 发送命令字符串功能的终端软件。我们使用以下两个终端软件。\n\
    1) Tera Term\nhttps://ttssh2.osdn.jp/\n![](img/image_rsrc2DP.jpg)\n2) RS232C 测试工具（Rs232cTool）\n\
    http://nonsoft.la.coocan.jp/Download/Rs232cTool/index.html\n有各种语言的软件，但这是日语软件。\n\
    ![](img/image_rsrc2DR.jpg)\n\nmicro:bit 串行通信波特率固定为 115200。写入发送字符串并按下 `TEXT transmission`\
    \ 按钮将其发送到 micro:bit。\n\n### (5) 命令\n\n程序中使用的以下常量可以从外部更改。\n1) 模糊常量列表 `fuzzyList[]`\n\
    2) 速度常量列表 `speedList[]`\n3) 定时器表 `timeTable[]`\n4) LCD 显示指令 `screen`\n5) 死区值 `dZone`\n\
    6) 后退偏移 `offset[]`\n7) 启动/停止指令 `step`\n8) 引用当前设置\n\n从终端软件发送的命令格式如下。为了方便 micro:bit\
    \ 串行通信，终止符为 `#`。\n1) 写入模糊常量列表 `fuzzyList = [200, 40, 200]`\n   `F (列表顺序) = (值)#`\n\
    \   示例：`F0=200#, F1=40#, F2=200#`\n2) 写入速度常量列表 `speedList = [60, 80, 100, 120]`\n\
    \   `S (列表顺序) = (值)#`\n   示例：`S0=60#, S1=80#, S2=100#, S3=120#`\n3) 写入定时器表 `timeTable\
    \ = [500, 2, 200, 400, 4000]`\n   `T (列表顺序) = (值)#`\n   示例：`T0=500#, T1=2#, T2=200#,\
    \ T3=400#, T4=4000#`\n4) LCD 屏幕显示指令 `screen`\n   `D (显示屏幕编号)#`\n   示例：`D0#, D1#,\
    \ D2#`\n5) 死区值 `dZone`（我们将在将来使用）\n   （设置模糊计算的死区。它小于 `fuzzyList[0]`。）\n   `Z (死区值)#`\n\
    \   示例：`Z20#`（如果偏差在此数字内，模糊计算返回 0）\n6) 后退偏移 `offset = [30, 40]`（我们将在将来使用）\n   用于调整传感器在后退时检测线路时的值。\n\
    7) 启动/停止指令 `step`\n   `R (启动/停止选择)#`\n   示例：`R0#`（停止）`R1#`（启动）\n8) 引用当前设置\n  \
    \ （查询上述 1 到 6 的当前设置）\n   `Q (查询编号)#`\n   示例：\n   `Q0#`（模糊常量列表）\n   `Q1#`（速度常量列表）\n\
    \   `Q2#`（定时器表 1）\n   `Q3#`（定时器表 2）\n   `Q4#`（LCD 显示屏幕编号）\n   `Q5#`（死区值）\n   `Q6#`（偏移）\n\
    \n### (6) 接收程序\n\n无线接收到字符串时的程序如下。\n\n```\n===========================\nlet dZone\
    \ = 20  //死区\nlet offset = [30, 40]\n\n//无线电\nradio.onReceivedString(function\
    \ (receivedString) {\n    let str = receivedString\n    //DispString(str)\n  \
    \  let k = 0\n    let data = 0\n    //首先，取出第一个字符\n    let header = str[0]\n  \
    \  //找到 '=' 的位置\n    let m = str.indexOf('=')\n    //如果 '=' 不存在\n    if (m ==\
    \ -1) {\n        //找到 '#' 的位置\n        let n = str.indexOf('#')\n        //如果\
    \ '#' 不存在\n        if (n == -1)\n            return\n        //提取 str 中从 1 到 n-1\
    \ 的字符\n        let str1 = str.slice(1, n)\n        //将 str1 转换为数字\n        k =\
    \ parseInt(str1)\n    }\n    else {\n        //提取 str 中从 1 到 m-1 的字符\n       \
    \ let str1 = str.slice(1, m)\n        //将 str1 转换为数字\n        k = parseInt(str1)\n\
    \        //找到 '#' 的位置\n        let n = str.indexOf('#')\n        //如果 '#' 不存在\n\
    \        if (n == -1)\n            return\n        //提取 str 中从位置 m+1 到 n-1 的字符\n\
    \        str1 = str.slice(m + 1, n)\n        //将 str1 转换为数字\n        data = parseInt(str1)\n\
    \    }\n    if (header == 'F') { //模糊\n        if (k >= 0 && k <= 2)\n       \
    \     fuzzyList[k] = data\n    }\n    else if (header == 'S') { //速度\n       \
    \ if (k >= 0 && k <= 3)\n            speedList[k] = data\n    }\n    else if (header\
    \ == 'D') { //显示\n        if (k >= 0 && k <= 2)\n            screen = k\n    }\n\
    \    else if (header == 'T') { //定时器\n        if (k >= 0 && k < TIMERSIZE)\n \
    \           timeTable[k] = data\n    }\n    else if (header == 'R') { //运行\n \
    \       if (k == 0) {\n            MotorStop()\n            step = Step.STOP\n\
    \        }\n        else if (k == 1)\n            step = Step.START\n    }\n \
    \   else if (header == 'Z') { //死区\n        if (k >= 0 && k <= fuzzyList[0])\n\
    \            dZone = k\n    }\n    else if (header == 'B') { //后退偏移\n        if\
    \ (k >= 0 && k <= 1 )\n            offset[k] = data\n    }\n    else if (header\
    \ == 'Q') {    //查询\n        if (k == 0)     //模糊\n            header = 'F'\n\
    \        else if (k == 1)    //速度\n            header = 'S'\n        else if (k\
    \ == 2)    //定时器 1\n            header = 'T'\n        else if (k == 3)    //定时器\
    \ 2\n            header = 'U'\n        else if (k == 4)    //显示\n            header\
    \ = 'D'\n        else if (k == 5)    //死区\n            header = 'Z'\n        else\
    \ if (k == 6)    // 后退偏移\n            header = 'B'\n    }\n    basic.pause(50)\
    \  //ms\n    SendRadio(header)\n})\n===========================\n```\n\n### (7)\
    \ 响应程序\n\n无线响应的程序如下。由于 micro:bit 的无线通信，一次最多可以发送 18 个单字节字符。\n\n```\n===========================\n\
    function SendRadio(str: string) {\n    let str1 = \"\"\n    let str2 = \"\"\n\
    \    let str3 = \"\"\n    let str4 = \"\"\n    switch (str) {\n        case 'F':\n\
