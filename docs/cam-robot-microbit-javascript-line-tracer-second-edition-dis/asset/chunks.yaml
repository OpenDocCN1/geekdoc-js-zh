    # Introduction


    Swinging both hands…, are you walking?

    And wearing caterpillar rubber shoes, you''re standing out!

    You can easily go up the slopes around here, can''t you!

    What!  "Walking along the black line"?

    I see‥ Oh dear!  You are stepping back when stick out!

    You never fall even if protrude a little!

    Oh!!  You have a big body, but you turn smoothly, don''t you!  I''m impressed!

    I like it!  What''s your name?

    "Cam robot"

    Huh, ~ cam?  Where is the cam attached?

    "Little modified so as to use a microcomputer instead of a cam."

    Oh ~!  Using a microcomputer~

    So, what kind of trick does that microcomputer do internally?

    "That''s written in this book!"

    Huh?  Let''s see………

    So, using a microcomputer called “micro:bit” on a commercially available cam robot,
    this project makes the robot move along a black line.

    It can utilize a useful free tool called MakeCode. It can also write with MakeCode
    block editor, but the screen may tend to be complicated, so it is better to switch
    to Javascript.

    When using the recent Javascript editor, it can tell you where and why an error
    occurred.

    The goal of line tracing is clear, and it is simple Javascript for micro:bit,
    so even middle school and high school students can fully use it.

    Like almost everything in the world, seemingly complex behaviors are made up of
    simple, small parts.

    So, let''s go forward with confidence!

    This book will help you.


    ![](image_rsrc2BG.jpg)


    The URL of the video sample is as follows.

    In the 2nd edition, RGB LED display has been added. Also, only the programs that
    run along the center of the road are dealt with so that it can handle cases where
    roads intersect.


    https://youtu.be/LIoKmstp0kk


    "Note"

    If [Bad response for 130->255] is displayed when downloading the program to the
    micro:bit, you need to update the firmware of the micro:bit.

    As our firmware version was 241, we updated it to the latest version (253) and
    it solved.

    If applicable, please update as described below.

    Troubleshooting downloads with WebUSB


    https://makecode.microbit.org/device/usb/webusb/troubleshoot


