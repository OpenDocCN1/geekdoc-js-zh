    \                    //执行模糊计算（偏差）\n                    //控制使得左右传感器的密度差为 0\n  \
    \                  fuzResult = Fuzzy(leftVal - rightVal)\n                   \
    \ led.plot(3, 4)\n                }\n                let spLeft = speed - fuzResult\n\
    \                let spRight = speed + fuzResult\n                Restrict(spLeft,\
    \ spRight)  //速度限制\n                Advance(speedLeft, speedRight)\n         \
    \       basic.pause(timeTable[Timer.PERIOD]) //控制周期\n                for (let\
    \ n = 0; n < 4; n++)\n                    led.unplot(n, 4)\n            }\n  \
    \          break\n        case Step.GOBACK: //开始后退\n            if (CheckTimer(Timer.WAIT)\
    \ == State.UP) {\n                SendRadio2(\"BACK\", leftSensor, rightSensor)\n\
    \                FallBack(S_LOW, S_LOW)    //低速后退\n                OnTimer(Timer.BACK)\n\
    \                step = Step.BACK\n            }\n            break\n        case\
    \ Step.BACK:    //后退中\n            leftVal = leftSensor\n            rightVal\
    \ = rightSensor\n            //当左侧传感器检测到道路时\n            if (leftVal > onRoad\
    \ && rightVal < onRoad) {\n                MotorStop()\n                SendRadio2(\"\
    L-ON\", leftSensor, rightSensor)\n                speedLeft = -S_SLOW\n      \
    \          speedRight = S_LOW //加速右电机\n                Advance(speedLeft, speedRight)\n\
    \                OnTimer(Timer.BACK)\n                led.plot(4, 4)\n       \
    \         step = Step.RESTART\n            }\n            //当右侧传感器检测到道路时\n   \
    \         else if (rightVal > onRoad && leftVal < onRoad) {\n                MotorStop()\n\
