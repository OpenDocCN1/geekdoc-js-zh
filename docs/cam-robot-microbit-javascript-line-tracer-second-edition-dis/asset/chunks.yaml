    \ Preparation for debugging\n\nNow that you have some movement, you may want to\
    \ adjust the movement further. The speed constants and fuzzy constants are written\
    \ in the program are temporary according to our environment, so please adapt to\
    \ your environment. However, rewriting the program each time is time-consuming.\
    \ So, if you can afford it, it is very convenient if you can use another micro:bit\
    \ and rewrite these values from an external PC. This is very useful for checking\
    \ the program flow later.\n\n### (1) Monitor configuration\n\nIt is like the image\
    \ below.\n![](image_rsrc2DK.jpg)\n\nmicro:bit's built-in wireless communication\
    \ function makes it easy to implement.\n\n### (2) Cam robot side\n\nUse the following\
    \ functions on the cam robot side.\n![](image_rsrc2DM.jpg)\n\nWhen switching to\
    \ Javascript, it is as follows.\n\n```\n--------------------------------------------\n\
    radio.onReceivedString(function (receivedString) {})\nradio.setTransmitPower(7)\n\
    radio.setGroup(1)\nbasic.forever(function () {\n    radio.sendString(\"12345\"\
    )\n})\n--------------------------------------------\n```\n\n### (3) micro:bit\
    \ side for relay\n\nIn addition, on the micro:bit side dedicated to transmission\
    \ and reception, prepare the following block and write it.\n![](image_rsrc2DN.jpg)\n\
    \n### (4) PC side\n\nDownload the driver for serial communication from the following\
    \ URL and set it on the PC that performs serial communication with this dedicated\
    \ transmission/reception micro:bit.\n(Download URL) https://os.mbed.com/docs/mbed-os/v5.15/tutorials/windows-serial-driver.html\n\
    \nIn addition, terminal software is required on the PC side that has the function\
    \ of displaying character strings sent from micro:bit and easily sending command\
    \ strings to micro:bit. We use the following two terminal softwares.\n1) Tera\
    \ Term\nhttps://ttssh2.osdn.jp/\n![](image_rsrc2DP.jpg)\n2) RS232C test tool (Rs232cTool)\n\
    http://nonsoft.la.coocan.jp/Download/Rs232cTool/index.html\nThere is software\
    \ in various languages, but this is Japanese software.\n![](image_rsrc2DR.jpg)\n\
    \nmicro:bit serial communication baud rate is fixed at 115200. Write the transmission\
    \ character string and press the `TEXT transmission` button to send it to micro:bit.\n\
    \n### (5) Command\n\nThe following constants used in the program can be changed\
    \ externally.\n1) Fuzzy constant list `fuzzyList[]`\n2) Speed constant list `speedList[]`\n\
    3) Timer table `timeTable[]`\n4) LCD display instruction `screen`\n5) Dead zone\
    \ value `dZone`\n6) Retraction offset `offset[]`\n7) Start / stop instruction\
    \ `step`\n8) Referencing the current setting\n\nThe format of the command sent\
    \ from the terminal software is as follows. For the convenience of micro:bit serial\
    \ communication, the terminal symbol is `#`.\n1) Write fuzzy constant list `fuzzyList\
    \ = [200, 40, 200]`\n   `F (list order) = (value)#`\n   Example: `F0=200#, F1=40#,\
    \ F2=200#`\n2) Write the speed constant list `speedList = [60, 80, 100, 120]`\n\
    \   `S (list order) = (value)#`\n   Example: `S0=60#, S1=80#, S2=100#, S3=120#`\n\
    3) Writing the timer table `timeTable = [500, 2, 200, 400, 4000]`\n   `T (list\
    \ order) = (value)#`\n   Example: `T0=500#, T1=2#, T2=200#, T3=400#, T4=4000#`\n\
    4) LCD screen display instruction `screen`\n   `D (display screen number)#`\n\
    \   Example: `D0#, D1#, D2#`\n5) Dead zone value `dZone` (We will use it in the\
    \ future)\n   (Set the dead zone for fuzzy calculation. It is smaller than `fuzzyList[0]`.)\n\
    \   `Z (dead zone value)#`\n   Example: `Z20#` (If the deviation is within this\
    \ number, the fuzzy calculation returns 0)\n6) Retraction offset `offset = [30,\
    \ 40]` (We will use it in the future)\n   It is for adjusting values when the\
    \ sensor detects the line when moving backward.\n7) Start / stop instruction `step`\n\
    \   `R (start / stop selection)#`\n   Example: `R0#` (Stop) `R1#` (Start)\n8)\
    \ Referencing the current setting\n   (Queries the current settings from 1 to\
    \ 6 above)\n   `Q (inquiry number)#`\n   Example:\n   `Q0#` (Fuzzy constant list)\n\
    \   `Q1#` (List of speed constants)\n   `Q2#` (Timer table 1)\n   `Q3#` (Timer\
    \ table 2)\n   `Q4#` (LCD display screen number)\n   `Q5#` (Dead zone value)\n\
    \   `Q6#` (offset)\n\n### (6) Receiving program\n\nThe program when the character\
    \ string was received wirelessly was as follows.\n\n```\n===========================\n\
