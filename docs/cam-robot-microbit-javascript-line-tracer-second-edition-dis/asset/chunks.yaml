    \  //死区\n            str1 = dZone.toString()\n            str4 = \"Zone \" + str1\n\
    \            break\n        case 'B':   //后退偏移\n            str1 = offset[0].toString()\n\
    \            str2 = offset[1].toString()\n            str4 = \"Offset \" + str1\
    \ + \": \" + str2\n            break\n        default:\n            return\n \
    \   }\n    radio.sendString(str4)\n}\n===========================\n```\n\n将无线通信的初始设置添加到初始化部分。\n\
