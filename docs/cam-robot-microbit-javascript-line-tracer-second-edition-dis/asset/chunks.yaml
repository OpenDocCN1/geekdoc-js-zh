    Preparation for debuggingNow that you have some movement, you may want to adjust
    the movement further. The speed constants and fuzzy constants are written in the
    program are temporary according to our environment, so please adapt to your environment.However,
    rewriting the program each time is time-consuming.So, if you can afford it, it
    is very convenient if you can use another micro:bit and rewrite these values from
    an external PC.This is very useful for checking the program flow later.(1) Monitor
    configurationIt is like the image below.![](image_rsrc2DK.jpg)micro:bit''s built-in
    wireless communication function makes it easy to implement.(2) Cam robot sideUse
    the following functions on the cam robot side.![](image_rsrc2DM.jpg)When switching
    to Javascript, it is as follows.--------------------------------------------radio.onReceivedString(function
    (receivedString) {})radio.setTransmitPower(7)radio.setGroup(1)basic.forever(function
    () {radio.sendString("12345")})--------------------------------------------(3)
    micro:bit side for relayIn addition, on the micro:bit side dedicated to transmission
    and reception, prepare the following block and write it.![](image_rsrc2DN.jpg)(4)
    PC sideDownload the driver for serial communication from the following URL and
    set it on the PC that performs serial communication with this dedicated transmission/reception
    micro:bit.(Download URL)https://os.mbed.com/docs/mbed-os/v5.15/tutorials/windows-serial-driver.htmlIn
    addition, terminal software is required on the PC side that has the function of
    displaying character strings sent from micro:bit and easily sending command strings
    to micro:bit.We use the following two terminal softwares.1) Tera Termhttps://ttssh2.osdn.jp/![](image_rsrc2DP.jpg)2)
    RS232C test tool (Rs232cTool)http://nonsoft.la.coocan.jp/Download/Rs232cTool/index.htmlThere
    is software in various languages, but this is Japanese software.![](image_rsrc2DR.jpg)micro:bit
    serial communication baud rate is fixed at 115200.Write the transmission character
    string and press the "TEXT transmission" button to send it to micro:bit.(5) CommandThe
    following constants used in the program can be changed externally.1) Fuzzy constant
    list​ fuzzyList[]2) Speed constant list​ speedList[]3) Timer table​ timeTable
    []4) LCD display instruction​ screen5) Dead zone value​ ​ dZone6) Retraction offset​
    offset[]7) Start / stop instruction​ step8) Referencing the current settingThe
    format of the command sent from the terminal software is as follows. For the convenience
    of micro:bit serial communication, the terminal symbol is #.1) Write fuzzy constant
    list  fuzzyList = [200, 40, 200]​ F (list order) = (value)#​ Example:  F0=200#,
    F1=40#, F2=200#2) Write the speed constant list  speedList = [60, 80, 100, 120]​
    S (list order) = (value)#​ Example:  S0=60#, S1=80#, S2=100#, S3=120#3) Writing
    the timer table  timeTable = [500, 2, 200, 400, 4000]​ T (list order) = (value)#​
    Example:  T0=500#, T1=2#, T2=200#, T3=400#, T4=4000#4) LCD screen display instruction  
    screen​ D (display screen number)#​ Example:  D0#, D1#, D2#5) Dead zone value  
    dZone​ ​ (We will use it in the future)​ (Set the dead zone for fuzzy calculation.
    It is smaller than fuzzyList [0].)​ Z (dead zone value)＃​ Example:  Z20#​ (If
    the deviation is within this number, the fuzzy calculation returns 0)6) Retraction
    offset   offset = [30, 40] ​ (We will use it in the future)​ It is for adjusting
    values when the sensor detects the line when moving backward.7) Start / stop instruction  
    step​ R (start / stop selection)＃​ Example:  R0#   (Stop)​ ​ R1#   (Start)8) Referencing
    the current setting​ (Queries the current settings from 1 to 6 above)​ Q (inquiry
    number)＃Example:  Q0#​ (Fuzzy constant list)​ Q1#​ (List of speed constants)​
    Q2#​ (Timer table 1)​ Q3#​ (Timer table 2)​ Q4#​ (LCD display screen number)​
    Q5#​ (Dead zone value)​ Q6#​ (offset)(6) Receiving programThe program when the
    character string was received wirelessly was as follows.===========================let
    dZone = 20  //dead zonelet offset = [30, 40]//Radioradio.onReceivedString(function
    (receivedString) {let str = receivedString//DispString(str)let k = 0let data =
    0//First, take out the first characterlet header = str[0]//Find the ''='' positionlet
    m = str.indexOf(''='')//If ''='' does not existif (m == -1) {//Find the position
    of ''#''let n = str.indexOf(''#'')//If ''#'' does not existif (n == -1)return//Extract
    characters from 1 to n-1 in strlet str1 = str.slice(1, n)//Convert str1 to a numberk
    = parseInt(str1)}else {//Extract characters from 1 to m-1 in strlet str1 = str.slice(1,
    m)//Convert str1 to a numberk = parseInt(str1)//Find the position of ''#''let
    n = str.indexOf(''#'')//If ''#'' does not exis tif (n == -1)return//Extract characters
    from position m + 1 to n-1 of strstr1 = str.slice(m + 1, n)//Convert str1 to a
    numberdata = parseInt(str1)}if (header == ''F'') { //Fuzzyif (k >= 0 && k <= 2)fuzzyList[k]
    = data}else if (header == ''S'') { //Speedif (k >= 0 && k <= 3)speedList[k] =
    data}else if (header == ''D'') { //Displayif (k >= 0 && k <= 2)screen = k}else
    if (header == ''T'') { //Timerif (k >= 0 && k < TIMERSIZE)timeTable[k] = data}else
    if (header == ''R'') { //Runif (k == 0) {MotorStop()step = Step.STOP}else if (k
    == 1)step = Step.START}else if (header == ''Z'') { //Dead zoneif (k >= 0 && k
    <= fuzzyList[0])dZone = k}else if (header == ''B'') { //Back offsetif (k >= 0
    && k <= 1 )offset[k] = data}else if (header == ''Q'') {    //Queryif (k == 0)     //Fuzzyheader
    = ''F''else if (k == 1)    //Speedheader = ''S''else if (k == 2)    //Timer1header
    = ''T''else if (k == 3)    //Timer2header = ''U''else if (k == 4)    //Displayheader
    = ''D''else if (k == 5)    //Dead zoneheader = ''Z''else if (k == 6)    // Back
    offsetheader = ''B''}basic.pause(50)  //msSendRadio(header)})===========================(7)
    Response programThe program that responds wirelessly is as follows. Due to micro:bit''s
    wireless communication, the maximum number of characters that can be sent at one
