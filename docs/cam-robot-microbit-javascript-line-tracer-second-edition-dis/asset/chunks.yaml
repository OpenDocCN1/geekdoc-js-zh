- fmt: "\n> Reference page: https://www.amazon.co.jp/BBC-micro-bit/dp/B074M58PL7\n\
    ![](image_rsrc2BM.jpg)\n\n3) Motor driver expansion board (DFROBOT SKU_DFR0548)\n\
    > Reference page: https://www.switch-science.com/catalog/4016/\n![](image_rsrc2BN.jpg)\n\
    \n4) Reflective photo sensor (ROHM RPR-220) 2 pieces\n> Reference page: http://akizukidenshi.com/catalog/g/gI-11401/\n\
    ![](image_rsrc2BP.jpg)\n\n5) LCD panel (I2C AQM1602)\n> Reference page: http://akizukidenshi.com/catalog/g/gK-08896/\n\
    ![](image_rsrc2BR.jpg)\n\n6) Bidirectional voltage level conversion module for\
    \ I2C bus (FXMA2102)\n> Reference page: http://akizukidenshi.com/catalog/g/gM-05825/\n\
    ![](image_rsrc2BS.jpg)\n\n7) 4 AA battery boxes\n> Reference page: https://www.amazon.co.jp/dp/B01H1P6KEQ\n\
    ![](image_rsrc2BT.jpg)\n\n8) Rechargeable nickel-metal hydride battery 4 pieces\n\
    > Reference page: https://www.amazon.co.jp/dp/B00CWNMR5Y\n![](image_rsrc2BU.jpg)\n\
    \n9) RGB LED module with built-in microcomputer 4 pieces\n> Reference page: http://akizukidenshi.com/catalog/g/gM-08414/\n\
    ![](image_rsrc2BV.jpg)\n\n## (2) Preparation of cam program robot\n\nThe following\
    \ pages are very useful for assembly.\n\n1) Explanation page on how to assemble\n\
    https://sanuki-tech.net/micro-bit/tamiya/assembly-cam-program-robot/\n![](image_rsrc2BW.jpg)\n\
    \nAssemble except for No.1, No.6, and No.7 of the assembly manual attached to\
    \ the cam robot. No.14 and No.17 battery boxes are made according to the above\
    \ explanation page.\n\n2) Explanation page on how to incorporate micro:bit\nhttps://sanuki-tech.net/micro-bit/tamiya/mounting-of-microbit/\n\
    ![](image_rsrc2BX.jpg)\n\n3) Explanation page of method to control cam robot\n\
    https://sanuki-tech.net/micro-bit/tamiya/programming-of-cam-program-robot/\n![](image_rsrc2BY.jpg)\n\
    \n## (3) Preparation of substrate\n\nThe photo sensor board, LCD board, and RGB\
    \ LED board were created as shown below.\n![](image_rsrc2BZ.jpg)\n![](image_rsrc2C0.jpg)\n\
    ![](image_rsrc2C1.jpg)\n![](image_rsrc2C2.jpg)\n\nThe photo has four photo sensors,\
    \ but only the center two are used. The motor driver expansion board has the following\
    \ configuration.\n![](image_rsrc2C3.jpg)\n\n## (4) Preparation for software creation\n\
    \n1) Makecode editor\nDownload the Makecode editor from the URL below.\nhttps://www.microsoft.com/en-us/p/makecode-for-micro-bit/9pjc7sv48lcx?activetab=pivot:overviewtab\n\
    ![](image_rsrc2C4.jpg)\n\n2) Add a driver and check the ON / OFF operation of\
    \ the motor.\n![](image_rsrc2C5.jpg)\n\nAdd a driver to operate the motor to the\
    \ program. Go to \"New project\", \"Advanced block\", \"Extension\" in the MakeCode\
    \ editor, and enter `https://github.com/DFRobot/pxt-motor` in the search field.\
    \ Then, `motor` is displayed, so click it.\n![](image_rsrc2C6.jpg)\n\nThis will\
    \ add `DF-Driver` to the list of blocks.\n![](image_rsrc2C7.jpg)\n\nFacing the\
    \ direction of travel of the cam robot, each motor is connected to the following\
    \ terminals.\n- Left motor ... M1 terminal\n- Right motor ... M2 terminal\n\n\
    Click `DF-Driver` in the block editor to display the items shown below.\n![](image_rsrc2C8.jpg)\n\
    \nSelect `Motor` and specify the motor, rotation direction, and speed. The speed\
    \ is a value from 0 to 255, but let's check with a value of about 100 at first.\n\
    ![](image_rsrc2C9.jpg)\n\nPress the `Download` button to write the program to\
    \ micro:bit.\n![](image_rsrc2CA.jpg)\n\nTurn on the cam robot and operate the\
    \ motor. Does the motor work? Stop temporarily (turn off the power at this stage)\
    \ and rewrite the speed value. `Download` again and watch the motor turn from\
    \ low to high speed.\n\nNext, let's switch to the Javascript editor. On the Javascript\
    \ screen, the one written with the block editor is displayed as follows.\n\n```\n\
    motor.MotorRun(motor.Motors.M1, motor.Dir.CW, 100)\nmotor.MotorRun(motor.Motors.M2,\
    \ motor.Dir.CW, 100)\nbasic.forever(function () {})\n```\n\nUse these, prepare\
    \ forward and backward programs.\n\n## (5) Confirmation of forward / backward\
    \ movement\n\n```\n===========================\n//Heading to the forward direction\
    \ of the cam robot, M1: left wheel, M2: right wheel\nfunction Advance(speed1:\
    \ number, speed2: number) {\n    motor.MotorRun(motor.Motors.M1, motor.Dir.CW,\
    \ speed1)\n    motor.MotorRun(motor.Motors.M2, motor.Dir.CW, speed2)\n}\nfunction\
    \ FallBack(speed1: number, speed2: number) {\n    motor.MotorRun(motor.Motors.M1,\
    \ motor.Dir.CCW, speed1)\n    motor.MotorRun(motor.Motors.M2, motor.Dir.CCW, speed2)\n\
    }\nfunction MotorStop(){\n    motor.motorStopAll()\n}\n===========================\n\
    ```\n\nLet's call these functions from the main loop.\n\n```\n===========================\n\
    // main loop\nbasic.forever(function () {\n    Advance(80, 80)\n    basic.pause(1000)\
    \  //ms\n    MotorStop()\n    basic.pause(1000)  //ms\n    FallBack(80, 80 )\n\
    \    basic.pause(1000)  //ms\n    MotorStop()\n    basic.pause(1000)  //ms\n})\n\
    ===========================\n```\n\nIf the argument of `Advance(80, 80)` is set\
    \ to a minus value, the motor reverses, so it is possible to use `Advance(-80,\
    \ -80)` instead of `FallBack(80, 80)`. When changing the traveling direction of\
    \ the cam robot, you can change the direction greatly by changing the left and\
    \ right rotation directions like `Advance(80, -80)`.\n\n## (6) RGB LED display\n\
    \nAlthough not directly related to driving control, this color-changing LED is\
    \ excellent for enjoying the operation of the Cam robot. In this book, the LED\
    \ display color is changed separately for left and right according to the wheel\
    \ speed and the optical sensor value. You can check the changes in the sensor\
    \ value and speed even from a distance, which may be useful for reviewing the\
    \ driving software.\n\nFrom the Makecode editor, press `advanced block` `extension`\
    \ and click `neopixel` displayed on the screen.\n![](image_rsrc2CB.jpg)\n\n`Neopixel`\
    \ is added to the block list.\n![](image_rsrc2CC.jpg)\n\nWhen you click `Neopixel`,\
    \ the items shown below are displayed.\n![](image_rsrc2CD.jpg)\n\nAmong this,\
    \ use the tool shown below.\n![](image_rsrc2CE.jpg)\n\n```\nlet strip = neopixel.create(DigitalPin.P0,\
    \ 24, NeoPixelMode.RGB)\n```\n![](image_rsrc2CF.jpg)\n\n```\nstrip.setPixelColor(0,\
    \ neopixel.colors(NeoPixelColors.Red))\n```\n![](image_rsrc2CG.jpg)\n\n```\nstrip.show()\n\
    ```\n\nUsing this tool, I have been prepared with the following functions. The\
    \ color assignment according to the speed and sensor value is shown in the figure\
    \ below.\n![](image_rsrc2CH.jpg)\n\n```\n===========================\nlet item\
    \ = neopixel.create(DigitalPin.P15, 4, NeoPixelMode.RGB)\nlet colorTable = [0X0000ff,\
    \ 0x00ffff, 0x00ff00, 0xffff00, 0xff00ff]\n\n//For speed\nfunction NeoSpeed(pos:\
    \ number, speed: number) {\n    //-40...60...120\n    let index = 0\n    if (speed\
    \ < 0)\n        item.setPixelColor(pos, colorTable[0])\n    else {\n        if\
    \ (speed >= 60) {  //60...120\n            speed -= 60 //0..60\n            index\
    \ = speed / 15  //0...3\n            if (index > 3)\n                index = 3\n\
    \        }\n        else\n            index = 0\n        index += 1\n        item.setPixelColor(pos,\
    \ colorTable[index])\n    }\n    return index\n}\n\n//For sensor\nfunction NeoSensor(pos:\
    \ number, sensor: number) {\n    //0...1023\n    let index = 0\n    sensor -=\
    \ 300\n    if (sensor >= 0) {\n        index = sensor / 200    //0,1,2,3..\n \
    \       index += 1\n        if (index > 4)\n            index = 4\n    }\n   \
    \ item.setPixelColor(pos, colorTable[4 - index])\n    return index\n}\n\n//0=left\
    \ front, 1=left rear, 2=right rear, 3=right front\n//Display only when the values\
    \ are different\nlet oldIndex = 0\nfunction NeoShow() {\n    let a = NeoSensor(0,\
    \ leftSensor)\n    let b = NeoSensor(3, rightSensor)\n    let c = NeoSpeed(1,\
    \ speedLeft)\n    let d = NeoSpeed(2, speedRight)\n    let val = a << 12 + b <<\
    \ 8 + c << 4 + d\n    if (oldIndex != val) {\n        oldIndex = val\n       \
    \ item.show()\n    }\n}\n===========================\n```\n\n## [2] Acquisition\
    \ of sensor value and LCD display\n\nNow, our aim is to change the rotation speed\
    \ of the left and right motors and adjust the direction in which to operate the\
    \ cam robot along the line. This judgment is based on the values of the left and\
    \ right sensors. So next, let's get the sensor value.\n\n### (1) Acquisition of\
    \ sensor value\n\nFacing the traveling direction of the cam robot,\n- Left side\
    \ sensor is connected to P0 terminal,\n- Right side sensor is connected to P1\
    \ terminal.\n\nWhen writing in the block editor as shown below,\n![](image_rsrc2CJ.jpg)\n\
    \nIn Javascript, it is expressed as follows.\n\n```\nlet leftSensor = 0\nlet rightSensor\
    \ = 0\nbasic.forever(function () {\n    leftSensor = pins.analogReadPin(AnalogPin.P0)\n\
    \    rightSensor = pins.analogReadPin(AnalogPin.P1)\n})\n```\n\nWe can use this\
    \ to get sensor values. This value is from 0 to 1023 because micro:bit analog\
    \ input conversion is 10 bits. However, it is difficult to confirm the value with\
    \ the micro:bit LED panel, so let's display it on the external LCD panel.\n\n\
    In the future, as the program becomes longer, it will be necessary to edit efficiently.\
    \ In the current version of the Makecode editor, switching between blocks and\
    \ Javascript will change the position of functions and variables. As a countermeasure,\n\
    1) Do not switch to block\n2) There is a method of editing Javascript with another\
    \ editor (development environment) and pasting it on the Javascript screen of\
    \ Makecode.\n\nWe use Microsoft Visual Studio Community 2019 because it is difficult\
    \ to edit Javascript with Makecode editor. Please refer to this method as well.\n\
    \n### (2) Program preparation\n\nNow, create the software according to the instructions\
    \ for the LCD panel (I2C AQM1602). Create the following basic program and call\
    \ it from the LCD display program.\n\n1) Initial setting\n2) Write commands and\
    \ characters\n\nIn the initial setting, the following commands are sent in order,\
    \ but it is necessary to leave more time than the internal processing time between\
    \ commands. Initialization could not be performed even for a time that was a little\
    \ more than the microsecond written in the AQM1602 manual, so here we drastically\
    \ set it to a long time (millisecond). Also, since the I2C transmission method\
    \ prepared in the block editor is slightly different from the method shown in\
    \ the AQM1602 manual, here we use a buffer method. A description of the buffer\
    \ is provided below.\nhttps://makecode.microbit.org/types/buffer\n\nThe signal\
    \ sent to the LCD with I2C is as shown below. The LCD address is `0x3E`. In the\
    \ figure below, the command (`0x80`) for specifying the display matrix and the\
    \ display data (`\"ABC123\"`) are sent.\n![](image_rsrc2CK.jpg)\n\nCommand section\
    \ expansion\n![](image_rsrc2CM.jpg)\n\nData section expansion\n![](image_rsrc2CN.jpg)\n\
    \n### (3) Flow chart\n\nCreate the LCD initialization according to the flowchart\
    \ below.\n![](image_rsrc2CP.jpg)\n\n```\n===========================\n// LCD Initialize\n\
    let initList = [0x38, 0x39, 0x14, 0x73, 0x56, 0x6C, 0x38, 0x01, 0x0C]\n// For\
    \ AQM1602\nfunction InitLcd() {\n    basic.pause(100)\n    let len = initList.length\n\
    \    for (let n = 0; n < len; n++) {\n        WriteCommand(0, initList[n])\n \
    \       basic.pause(10)\n        if (n == 5)\n            basic.pause(300)\n \
    \   }\n}\n===========================\n```\n\nWrite commands and character strings\
    \ according to the flowchart below.\n![](image_rsrc2CR.jpg)\n![](image_rsrc2CS.jpg)\n\
    \n```\n===========================\n// LCD\nfunction WriteCommand(regi: number,\
    \ data: number) {\n    let cmd = pins.createBuffer(2);\n    cmd[0] = regi\n  \
    \  cmd[1] = data\n    pins.i2cWriteBuffer(0x3e, cmd, false);\n    control.waitMicros(30)\n\
    }\n\n// LCD\nfunction WriteString(col: number, row: number, str: string) {\n \
    \   if (row == 0)\n        WriteCommand(0, 128 + col)\n    else if (row == 1)\n\
    \        WriteCommand(0, 192 + col)\n    else\n        return\n    let len = str.length\n\
    \    let buff = pins.createBuffer(len + 1)\n    buff[0] = 64\n    for (let n =\
    \ 0; n <= len - 1; n++)\n        buff[n + 1] = str.charCodeAt(n)\n    pins.i2cWriteBuffer(0x3e,\
    \ buff, false)\n}\n===========================\n```\n\nSince the sensor value\
    \ changes from 0 to 1023, it is always displayed in the area of 4 characters,\
    \ and when the number of digits is small, it is filled with spaces.\n\n```\n===========================\n\
    //LCD\nfunction FillSpace(str: string, len: number) {\n    let m = len - str.length\n\
    \    if (m > 0) {\n        for (let n = 0; n < m; n++)\n            str += \"\
    \ \"\n    }\n    return str\n}\n===========================\n```\n\n### (4) Display\
    \ of sensor value\n\nLet's display the left and right sensor values on the LCD.\
    \ Write the values of right sensor and left sensor on the first line of the LCD.\n\
    ![](image_rsrc2CT.jpg)\n\n```\n===========================\nlet leftSensor = 0\n\
    let rightSensor = 0\n\n//LCD\nfunction ShowLcd() {\n    let str1 = Math.round(rightSensor).toString()\n\
    \    str1 = FillSpace(str1, 4)\n    WriteString(0, 0, str1)\n    str1 = Math.round(leftSensor).toString()\n\
    \    str1 = FillSpace(str1, 4)\n    WriteString(12, 0, str1)\n}\n===========================\n\
    ```\n\n### (5) Background\n\nDuring the operation of the cam robot, sensor values\
    \ are always required, so capture them in the background. In Javascript of Makecode,\
    \ how to write is to open `New project` and select `Run in background` from `Advanced\
    \ block` `Control`.\n![](image_rsrc2CU.jpg)\n\nIf you switch to Javascript, you\
    \ will find that you should write as follows.\n\n```\ncontrol.inBackground(function\
    \ () {})\n```\n\nIn this function, write the part that captures the left and right\
    \ sensor values.\n\n```\n===========================\n// Background worker\ncontrol.inBackground(function\
    \ () {\n    while (true) {\n        leftSensor = pins.analogReadPin(AnalogPin.P0)\n\
    \        rightSensor = pins.analogReadPin(AnalogPin.P1)\n        basic.pause(5)\
    \  //ms\n    }\n})\n===========================\n```\n\nThe background also uses\
    \ CPU time, so the above `basic.pause()` is required. Without this, most of the\
    \ CPU time will be taken in the background and the main program will not run.\
    \ The time of `pause()` is determined in consideration of the control cycle of\
    \ fuzzy control that follows.\n\nNow that we are ready, call the LCD display function\
    \ in the main loop.\n\n```\n===========================\n//Starting point\nInitLcd()\n\
    \n// main loop\nbasic.forever(function () {\n    ShowLcd()\n    basic.pause(500)\
    \  //ms\n})\n===========================\n```\n\nHow is it? Did it display? When\
    \ moving the black paper under the sensor, does it change the value? The left\
    \ and right values are different on the handmade sensor board of the cam robot\
    \ used this time. Whether it is due to the influence of ambient light, differences\
    \ in component constants, or because the mounting position is not accurate, for\
    \ example, as shown in the figure below.\n![](image_rsrc2CV.jpg)\n\nIf OK, you\
    \ have got a way to know the most important sensor values, so let's move on to\
    \ the next step.\n\n## [3] Operation policy\n\nNow, with what kind of policy do\
    \ you control the movement of the cam robot? Moving along the road, but along\
    \ which part of the road do you move? In the center of the road? Or the edge of\
    \ the road?\n\nThe sensor concentration of the board created this time is as shown\
    \ below. Since a lot of light is reflected on white paper, the value is low due\
    \ to the hardware configuration. On black paper, the value input to the microcomputer\
    \ is high because there is little reflected light. The figure below shows the\
    \ values of each sensor when the black paper is moved from right to left by hand.\n\
    ![](image_rsrc2CW.jpg)\n\n### (1) The center of the road\n\nIf you want to control\
    \ the cam robot to the center of the road, you will control so that the slope\
    \ of the straight line connecting the left and right sensor values is horizontal\
    \ (that is so that the difference between the left and right sensor values to\
    \ 0). Even if there is a difference in the sensor values on the left and right\
    \ in the same black area, there should be somewhere where the inclination is almost\
    \ horizontal. Control it with the goal.\n![](image_rsrc2CX.jpg)\n\nTo respond\
    \ to the intersection of road lines, the second edition of this book only deals\
    \ with running along the center of the road. What explained here is only an example.\
    \ Besides this, your readers may find innovative ways. There is no right answer\
    \ for control. Failure is natural. The most important thing is to think of various\
    \ ways for yourself and try hard.\n\n### (2) Operation procedure\n\nAfter turning\
    \ on the power,\n1) Place the cam robot on the white part of the paper on which\
    \ the course is drawn and press the B button to read the white sensor value. To\
    \ confirm that you have pressed it, it will display the number 1 on the micro:bit\
    \ LED screen.\n![](image_rsrc2CY.jpg)\n2) Place the left and right sensors on\
    \ the black part of the paper and press the B button to read the black sensor\
    \ value. Similarly, the number 2 is displayed on the LED screen of micro:bit.\n\
    ![](image_rsrc2CZ.jpg)\n\nThe order of 1) and 2) can be reversed. At the end of\
    \ this operation, the white and black representative values and the median value\
    \ are determined. If this operation is omitted, the default value will be used.\n\
    3) Place the two central sensors on the line and press the A button to start.\n\
    ![](image_rsrc2D0.jpg)\n4) Press the B button to stop at any time. Since the typical\
    \ values of black and white are remembered, the operation can be restarted simply\
    \ by pressing the A button.\n\n### (3) Flow chart\n\nThe flowchart is as shown\
    \ below.\n![](image_rsrc2D1.jpg)\n\n### (4) Fuzzy calculation\n\nThe above fuzzy\
    \ calculation is described in detail in `Fuzzy & PID2` of the same `Discover How`\
    \ series as this document but uses its own fuzzy calculation. This is determined\
    \ as the following diagram shows.\n![](image_rsrc2D2.jpg)\n\nThe meaning of `fuzzyList[]`\
    \ below is as follows.\n- `fuzzyList[0]` Maximum deviation value (horizontal axis)\n\
    - `fuzzyList[1]` Maximum deviation change (vertical axis)\n- `fuzzyList[2]` Output\
    \ maximum value\n\nThe fuzzy calculation program is as follows.\n\n```\n===========================\n\
    //Fuzzy\n//fuzzyList[2] is multiplied by 10, so the result should be 1/10\nlet\
    \ fuzzyList = [200, 40, 200]\nlet oldDiff = 0\nlet fuzResult = 0\nlet target =\
    \ 0\n\n//Fuzzy  Calculate the amount to suppress\nfunction Fuzzy(val: number)\
    \ {\n    let x0 = target - val  //Deviation from median\n    let y0 = x0 - oldDiff\
    \   //Deviation change amount\n    oldDiff = x0\n    let dv = fuzzyList[0]   \
    \  //Maximum deviation\n    let ddv = fuzzyList[1]    //Maximum difference in\
    \ deviation change\n    let lout = -fuzzyList[2]    //Output maximum value\n \
    \   let a = ddv / dv //Slope = deviation change amount / deviation\n    let d\
    \ = x0 + a * y0 //numerator\n    let x1 = d / (a * a + 1)    //X coordinate of\
    \ intersection = numerator / denominator\n    let lx = dv   //Deviation\n    let\
    \ result = (x1 * lout) / lx\n    //Limit output\n    let limit = fuzzyList[2]\n\
    \    if (result < -limit)\n        result = -limit\n    else if (result > limit)\n\
    \        result = limit\n    return result / 10\n}\n===========================\n\
    ```\n\n### (5) Motor reversal\n\nBy the way, if the motor speed is lower than\
    \ a certain value, the wheels hardly move. An example: `Advance(80, 30)` Right\
    \ wheel does not move. Therefore, as shown in the figure below, we reverse the\
    \ motor at a certain speed or less.\n\nFor example,\n- If `fuzzyList = [200, 40,\
    \ 200]`, the output range of Fuzzy is -20～20.\n- If `speedList = [60, 80, 100,\
    \ 120]`, the range of speed is `Center speed ± Fuzzy`, so it is as shown in the\
    \ table below.\n![](image_rsrc2D3.jpg)\n\nWhen `fuzzyList = [200, 40, 300]`, the\
    \ output range of Fuzzy is -30 to 30, so it is as shown in the table below.\n\
    ![](image_rsrc2D4.jpg)\n\nThis is shown in the figure below.\n![](image_rsrc2D5.jpg)\n\
    \nThe program to limit the motor speed is as follows.\n\n```\n===========================\n\
    let speedList = [60, 80, 100, 120]    //SLOW,LOW,MID,HIGH\nlet S_SLOW = speedList[0]\
    \  //SLOW\nlet S_LOW = speedList[1]    //LOW\nlet S_MID = speedList[2]    //MID\n\
    let S_HIGH = speedList[3]  //HIGH\nlet speedLeft = 0\nlet speedRight = 0\n\n//Speed\
    \ limit\nfunction Restrict(spLeft: number, spRight:number) {\n    if (spLeft >\
    \ S_HIGH)\n        speedLeft = S_HIGH\n    else if (spLeft < S_LOW)\n        speedLeft\
    \ = spLeft - S_SLOW * 2\n    else\n        speedLeft = spLeft\n    if (spRight\
    \ > S_HIGH)\n        speedRight = S_HIGH\n    else if (spRight < S_LOW)\n    \
    \    speedRight = spRight - S_SLOW * 2\n    else\n        speedRight = spRight\n\
    }\n===========================\n```\n\n## [4] Creation of main program\n\nLet's\
    \ write the main program according to the previous flowchart. The flowchart of\
    \ the fuzzy control part (*1) is as follows.\n![](image_rsrc2D6.jpg)\n![](image_rsrc2D7.jpg)\n\
    \n### (1) Variable definition\n\nDefine various variables.\n\n```\n===========================\n\
    //Sensor value\nlet roadList = [250, 450, 650]    //WHITE, GRAY, BLACK\nlet R_WHITE\
    \ = roadList[0]    //WHITE\nlet R_GRAY = roadList[1]    //GRAY\nlet R_BLACK =\
    \ roadList[2]    //BLACK\nlet offset = [30, 40]   //White, Black\nlet offRoad\
    \ = 0\nlet onRoad = 0\nlet leftVal = 0\nlet rightVal = 0\n\n//Sequence steps\n\
    let Step = {\n    STOP: 0,\n    START: 1 ,\n    FORWARD: 2,\n}\nlet step = Step.STOP\n\
    ===========================\n```\n\n### (2) Main program\n\nThe main program is\
    \ as follows.\n\n```\n===========================\nfunction IsStart() {\n    return\
    \ input.buttonIsPressed(Button.A)\n}\nfunction IsStop() {\n    return input.buttonIsPressed(Button.B)\n\
    }\n\n//Starting point\nInitLcd()\n\n//Main Loop\nbasic.forever(function () {\n\
    \    if (IsStart() == true && step == Step.STOP) {  //Start\n        basic.clearScreen()\n\
    \        step = Step.START\n    }\n    else if (IsStop() == true && step != Step.STOP)\
    \ { //Stop\n        MotorStop()\n        basic.clearScreen()\n        step = Step.STOP\n\
    \    }\n    switch (step) {\n        case Step.STOP: //While stopped\n       \
    \     //Get sensor values and set roadList\n            if (IsStop() == true)\
    \ {\n                if (leftSensor < R_GRAY && rightSensor < R_GRAY) {\n    \
    \                R_WHITE = Math.max(leftSensor, rightSensor)\n               \
    \     basic.showNumber(1)\n                }\n                else if (leftSensor\
    \ > R_GRAY && rightSensor > R_GRAY) {\n                    R_BLACK = Math.min(leftSensor,\
    \ rightSensor)\n                    basic.showNumber(2)\n                }\n \
    \               R_GRAY = (R_WHITE + R_BLACK) / 2\n            }\n            break\n\
    \        case Step.START:    //Start moving forward\n            offRoad = R_WHITE\
    \ + offset[0]\n            onRoad = R_BLACK - offset[1]\n            speedLeft\
    \ = S_LOW\n            speedRight = S_LOW\n            basic.pause(500)\n    \
    \        Advance(speedLeft, speedRight)    //Start moving forward\n          \
    \  step = Step.FORWARD\n            break\n        case Step.FORWARD: //While\
    \ moving forward\n            //Use the value at the time of judgment\n      \
    \      leftVal = leftSensor\n            rightVal = rightSensor\n            let\
    \ speed = S_LOW\n            if (leftVal < offRoad) {\n                speed =\
    \ S_LOW\n                fuzResult = Fuzzy(leftVal - R_GRAY)\n               \
    \ led.plot(1, 4)\n            }\n            else if (rightVal < offRoad) {\n\
    \                speed = S_LOW\n                fuzResult = Fuzzy(R_GRAY - rightVal)\n\
    \                led.plot(2, 4)\n            }\n            else {\n         \
    \       speed = S_MID\n                //Perform Fuzzy calculation (deviation)\n\
    \                //Control so that the density difference between the left and\
    \ right sensors is 0\n                fuzResult = Fuzzy(leftVal - rightVal)\n\
    \                led.plot(3, 4 )\n            }\n            let spLeft = speed\
    \ - fuzResult\n            let spRight = speed + fuzResult\n            Restrict(spLeft,\
    \ spRight)  //Speed limit\n            Advance(speedLeft, speedRight)\n      \
    \      basic.pause(timeTable[Timer.PERIOD]) //Control cycle\n            for (let\
    \ n = 0; n < 4; n++)\n                led.unplot(n, 4)\n            break\n  \
    \  }\n})\n===========================\n```\n\nDownload this program to micro:bit\
    \ and see how it works. How is it?\n\n## [5] Creation of timer\n\nAfter confirming\
    \ the movement to some extent, let's make it possible to confirm the white and\
    \ black sensor values on the LCD screen performed before starting. The display\
    \ interval on the LCD screen is, for example, if set 0.1 seconds which is too\
    \ fast for human eyes to follow the change, so let's use 0.5 seconds here. Also,\
    \ within this 0.5 sec time, the wheels are controlled according to the sensor\
    \ value, we can't write as `basic.pause(500) // ms`. So let's run a timer outside\
    \ of the main loop, and from time to time, check the elapsed timer time from the\
    \ main loop. Here we will discuss how to use the running timer and how to use\
    \ the PWM timer.\n\n### (1) Common part\n\nFirst, it will describe the parts that\
    \ are common to the two timers.\n- `TIMERSIZE` Number of timers\n- `timeValue[]`\
    \ Downcount value\n- `timeTable[]` Timer setting value (ms)\n- `State` Timer status\
    \ (OFF, ON, UP)\n\nI have prepared 5 timers, each of which will be used for the\
    \ following purposes.\n- `SHOW` LCD display cycle\n- `PERIOD` Control cycle\n\
    - `SURE` Overhang confirmation time\n- `WAIT` Waiting time\n- `BACK` Retreat time\
    \ limit\n\n```\n===========================\nlet TIMERSIZE = 5\nlet timeValue\
    \ = [0, 0, 0, 0, 0]\nlet Timer = {\n    SHOW: 0,\n    PERIOD: 1,\n    SURE: 2,\n\
    \    WAIT: 3,\n    BACK: 4\n}\nlet timeTable = [500, 2, 200, 400, 4000] //ms\n\
    let State = {\n    OFF: 0,\n    ON: 1,\n    UP: 2\n}\n===========================\n\
    ```\n\nThese are common timer operation functions.\n- `OnTimer()` Start the specified\
    \ timer\n- `OffTimer()` Stop the specified timer\n- `CheckTimer()` Check if the\
    \ specified timer has expired\n- `InitTimer()` Initialize timer\n\n### (2) Running\
    \ time\n\nUse `input` and `other uptime` from blocks in the Makecode editor.\n\
    ![](image_rsrc2D8.jpg)\n\nYou can find out the elapsed time by doing the following.\n\
    ![](image_rsrc2D9.jpg)\n\n```\nlet elapsed = 0\nlet startTime = input.runningTime()\n\
    basic.forever(function () {\n    elapsed = input.runningTime() - startTime\n})\n\
    ```\n\n1) Running timer\nLet's configure the timer with running time. Add the\
    \ following variables and constants.\n- `startTime[]` Timer start time\n\n```\n\
    ===========================\n//Timer\nlet startTime = [0, 0, 0, 0, 0]\n===========================\n\
    ```\n\n2) Running time timer operation\n\n```\n===========================\n//\
    \ Timer\nfunction OnTimer(n: number) {\n    if (n < TIMERSIZE) {\n        startTime[n]\
    \ = input.runningTime()\n        timeValue[n] = timeTable[n]\n    }\n}\nfunction\
    \ OffTimer(n: number) {\n    if (n < TIMERSIZE) {\n        timeValue[n] = 0\n\
    \    }\n}\nfunction CheckTimer(n: number) {\n    let result = 0\n    if (n < TIMERSIZE)\
    \ {\n        if (timeValue[n] == 0)\n            result = State.OFF\n        else\
    \ {\n            let elapsedTime = input.runningTime() - startTime[n]\n      \
    \      if (timeValue[n] <= elapsedTime)  //ms\n                result = State.UP\n\
    \            else\n                result = State.ON\n        }\n    }\n    return\
    \ result\n}\nfunction InitTimer() {\n    for (let n = 0; n < TIMERSIZE; n++)\n\
    \        timeValue[n] = 0\n    OnTimer(Timer.SHOW)\n}\n===========================\n\
    ```\n\n### (3) PWM output\n\nThe other is to use the accurate PWM output provided\
    \ in the CPU as shown below. In the figure below, the P12 and P16 terminals are\
    \ connected.\n![](image_rsrc2DA.jpg)\n![](image_rsrc2DB.jpg)\n\n```\npins.onPulsed(DigitalPin.P16,\
    \ PulseValue.High, function () {})\npins.analogWritePin(AnalogPin.P12, 512)\n\
    pins.analogSetPeriod(AnalogPin.P12, 10000)\n```\n\nThe figure below shows the\
    \ PWM output waveform with the above settings. (Cycle 10ms)\n![](image_rsrc2DC.jpg)\n\
    \n1) PWM timer\nConfigure a timer that uses the PWM output.\n- `timeState[]` Timer\
    \ status (OFF, ON, UP)\n\n```\n===========================\nlet timeState = [0,\
    \ 0, 0, 0, 0]\n===========================\n```\n\n2) PWM timer operation\n`pins.onPulsed()`\
    \ This is called by the PWM pulse and counts down.\n\n```\n===========================\n\
    //Called every 10ms\npins.onPulsed(DigitalPin.P16, PulseValue.High, function ()\
    \ {\n    for (let n = 0; n < TIMERSIZE; n++) {\n        if (timeState[n] == State.ON)\
    \ {\n            if (timeValue[n] > 0)\n                timeValue[n] -= 10\n \
    \           if (timeValue[n] <= 0) {\n                timeState[n] = State.UP\n\
    \            }\n        }\n    }\n})\n\n// Timer\nfunction OnTimer(n: number)\
    \ {\n    if (n < TIMERSIZE) {\n        timeValue[n] = timeTable[n]\n        timeState[n]\
    \ = State.ON\n    }\n}\nfunction OffTimer(n: number) {\n    if (n < TIMERSIZE)\
    \ {\n        timeState[n] = State.OFF\n    }\n}\nfunction CheckTimer(n: number)\
    \ {\n    if (n < TIMERSIZE)\n        return timeState[n]\n    else\n        return\
    \ State.OFF\n}\nfunction InitTimer() {\n    for (let n = 0; n < TIMERSIZE; n++)\
    \ {\n        timeValue[n] = 0\n        timeState[n] = State.OFF\n    }\n    OnTimer(Timer.SHOW)\n\
    }\n===========================\n```\n\nAlthough there is no big difference between\
    \ the two methods, using the PWM output will slightly shorten the time to check\
    \ for time-up as you do not need to calculate the running time.\n1) Processing\
    \ time when using PWM output (about 20us)\n![](image_rsrc2DD.jpg)\n2) Processing\
    \ time when running time is used (about 93us)\n![](image_rsrc2DE.jpg)\n\nHowever,\
    \ there is no big difference in the cycle time of the main loop, so it doesn't\
    \ matter which one you use. The figure below shows the cycle time measured while\
    \ performing operation control, but it is a guideline because it varies depending\
    \ on the processing loop.\n1) Cycle time when using PWM output (36ms for short)\n\
    ![](image_rsrc2DF.jpg)\n2) Cycle time when running time is used (35ms for short)\n\
    ![](image_rsrc2DG.jpg)\n\nAnd, since the control cycle is also included in the\
    \ timer list, change it as follows.\n\n```\n===========================\n:Advance(speedLeft,\
    \ speedRight)\nbasic.pause(timeTable[Timer.PERIOD]) //Control cycle\nbreak:\n\
    ===========================\n```\n\n### (4) Initialization\n\nFirst, initialize\
    \ the timer and LCD. When using the PWM timer, start here.\n\n```\n===========================\n\
    //Operation\nfunction Initial() {\n    InitTimer()\n    InitLcd()\n    // For\
    \ PWM timer\n    pins.analogWritePin(AnalogPin.P12, 512)     //Duty 50%\n    pins.analogSetPeriod(AnalogPin.P12,\
    \ 10000)  //Period 10ms\n}\n===========================\n```\n\nThe LCD display\
    \ function is called periodically from the main loop as shown below.\n\n```\n\
    ===========================\n//Starting point\nInitial()\n\n//Main Loop\nbasic.forever(function\
    \ () {\n    (The part indicated by the button as mentioned above)\n    switch\
    \ (step) {\n        (Control part as mentioned above)\n    }\n    if (CheckTimer(Timer.SHOW)\
    \ == State.UP) {\n        OnTimer(Timer.SHOW)\n        ShowLcd()\n    }\n})\n\
    ===========================\n```\n\nAdd so that the center value of the left and\
    \ right sensors is also displayed on the LCD screen. Also, it is convenient to\
    \ be able to display the motor speed, so let's switch the display screen as shown\
    \ in the figure.\n1) Display of left and right sensors and fuzzy calculation results\
    \ (screen = 0)\n![](image_rsrc2DH.jpg)\n2) Motor speed and fuzzy calculation results\
    \ (screen = 1)\n![](image_rsrc2DJ.jpg)\n3) LCD screen OFF (screen = 2)\n\n```\n\
    ===========================\nlet Screen = {\n    Sensor: 0,\n    Speed: 1,\n \
