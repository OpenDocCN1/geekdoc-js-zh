    \        str4 = \"Speed \" + str1 + \": \" + str2 + \": \" + str3\n          \
    \  break\n        case 'T':  // 由于字符限制，省略 timeTable [1]\n            str1 = timeTable[0].toString()\n\
    \            str2 = timeTable[2].toString()\n            str4 = \"Time1 \" + str1\
    \ + \": \" + str2\n            break\n        case 'U':\n            str1 = timeTable[3].toString()\n\
    \            str2 = timeTable[4].toString()\n            str4 = \"Time2 \" + str1\
    \ + \": \" + str2\n            break\n        case 'D':\n            str1 = screen.toString()\n\
