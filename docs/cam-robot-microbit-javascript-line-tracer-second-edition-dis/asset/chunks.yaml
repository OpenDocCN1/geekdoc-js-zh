    \nDo other configuration commands work correctly?\n\n## [7] To smooth control\n\
    \n### (1) Dead zone\n\nDue to the time lag from the detection of the sensor to\
    \ the reflection of the actual movement, you may see behavior like shaking its\
    \ head. If the difference from the target value is small, how will the behavior\
    \ change if it is ignored? This is called the dead zone, and as shown in the figure\
    \ below, it controls the output in a certain input range and performs smooth control,\
    \ and is mainly used in the industrial field.\n![](image_rsrc2DT.jpg)\n\nAs shown\
    \ below, when the difference from the target value in the fuzzy calculation is\
    \ small, the program can be realized simply by returning the control amount =\
    \ 0.\n\n```\n===========================\nfunction Fuzzy(val: number) {\n    let\
    \ x0 = target - val  //Deviation from median\n    if (-dZone < x0 && x0 < dZone)\
    \ {   //Dead zone\n        oldDiff = 0\n        return 0\n    }\n    :\n===========================\n\
    ```\n\n### (2) Noise removal\n\nIn general, digital signals and analog signals\
    \ input to the CPU board from outside have noise. Here, since the sensor value\
    \ is an analog signal, the method of taking the median value is used to eliminate\
    \ sudden values. Change the background worker by adding the following function\
    \ to use the median value of three consecutively entered values.\n\n```\n===========================\n\
    //Find the median of three values\nfunction CalcMedian(a: number, b: number, c:\
    \ number) {\n    let center = 0\n    if (a < b) {\n        if (c < a)\n      \
    \      center = a\n        else if (c > b)\n            center = b\n        else\n\
    \            center = c\n    }\n    else {\n        if (c < b)\n            center\
    \ = b\n        else if (c > a)\n            center = a\n        else\n       \
    \     center = c\n    }\n    return center\n}\n\n//Background worker\ncontrol.inBackground(function\
    \ () {\n    let pointer = 0\n    let buffL = [0, 0, 0]\n    let buffR = [0, 0,\
    \ 0]\n    let buffSize = 3 //buffL.length\n    while (true) {\n        buffL[pointer]\
    \ = pins.analogReadPin(AnalogPin.P0)\n        buffR[pointer] = pins.analogReadPin(AnalogPin.P1)\n\
    \        if (++pointer >= buffSize)\n            pointer = 0\n        leftSensor\
    \ = CalcMedian(buffL[0], buffL[1], buffL[2])\n        rightSensor = CalcMedian(buffR[0],\
    \ buffR[1], buffR[2])\n        basic.pause(5)  //ms\n    }\n})\n===========================\n\
    ```\n\n## [8] Response when protruding the road\n\nNow, we are going to think\
    \ about how to deal with it if it protrudes off the road. For example,\n1) Check\
    \ if it has surely stuck out the road. (By timer)\n2) If it protrudes, stop temporarily\
    \ and start retreating.\n3) If one of the sensors detects a road during the retreat,\
    \ it is determined that there is a road in that direction, and it slightly turns\
    \ the vehicle in that direction.\n4) After a little advance, when both sensors\
    \ detect the road, restart again.\n\nIt is the method shown below. After protrudes,\
    \ if the left sensor detects the road first when it backs, it changes the direction\
    \ of travel a little so that the body turns to the left.\n![](image_rsrc2DU.jpg)\n\
    \nSimilarly, after protrudes, if the right sensor detects the road first when\
    \ it backs, it changes the direction of travel a little so that the body turns\
    \ to the right.\n![](image_rsrc2DV.jpg)\n\n### (1) Flow chart\n\nThe flowchart\
    \ shown below is created using this method.\n![](image_rsrc2DW.jpg)\n\nIn each\
    \ case, for checking how the sensor value is used, so let's add the following\
    \ functions.\n\n```\n===========================\n//Send sensor values\nfunction\
    \ SendRadio2(str1: string, val1: number, val2: number) {\n    let str2 = Math.round(val1).toString()\n\
    \    let str3 = Math.round(val2).toString()\n    let str4 = str1 + \": \" + str2\
    \ + \": \" + str3\n    radio.sendString(str4)\n}\n===========================\n\
    ```\n\n### (2) Add to main loop\n\nAdd sections related to retreat. We use `offset[]`\
    \ to expand the range slightly to determine whether it is on the road or not.\n\
    \n```\n===========================\n//Sequence steps\nlet Step = {\n    STOP:\
    \ 0,\n    START: 1,\n    FORWARD: 2,\n    GOBACK: 3,\n    BACK: 4,\n    RESTART:\
    \ 5,\n    GOSTOP: 6\n}\n===========================\n```\n\nCreate a program according\
    \ to the flowchart above.\n\n```\n===========================\n//Main Loop\nfunction\
    \ IsStart() {\n    return input.buttonIsPressed(Button.A)\n}\nfunction IsStop()\
    \ {\n    return input.buttonIsPressed(Button.B)\n}\n\nbasic.forever(function ()\
    \ {\n    if (IsStart() == true && step == Step.STOP) {  //Start\n        basic.clearScreen()\n\
    \        step = Step.START\n    }\n    else if (IsStop() == true && step != Step.STOP)\
    \ {\n        MotorStop()\n        basic.clearScreen()\n        OnTimer(Timer.WAIT)\n\
    \        step = Step.STOP\n    }\n    switch (step) {\n        case Step.STOP:\
    \ // While stopped\n            if (CheckTimer(Timer.WAIT) == State.ON)\n    \
    \            break\n            //Get sensor values and set a target\n       \
    \     if (IsStop() == true) {\n                if (leftSensor < R_GRAY && rightSensor\
    \ < R_GRAY) {\n                    R_WHITE = Math.max(leftSensor, rightSensor)\n\
    \                    basic.showNumber(1)\n                }\n                else\
    \ if (leftSensor > R_GRAY && rightSensor > R_GRAY) {\n                    R_BLACK\
    \ = Math.min(leftSensor, rightSensor)\n                    basic.showNumber(2)\n\
    \                }\n                R_GRAY = (R_WHITE + R_BLACK) / 2\n       \
    \     }\n            break\n        case Step.START:    //Start moving forward\n\
    \            offRoad = R_WHITE + offset[0]\n            onRoad = R_BLACK - offset[1]\n\
    \            speedLeft = S_LOW\n            speedRight = S_LOW\n            basic.pause(500)\n\
    \            Advance(speedLeft, speedRight)\n            OffTimer(Timer.SURE )\n\
    \            step = Step.FORWARD\n            break\n        case Step.FORWARD:\
    \ //While moving forward\n            //Use the value at the time of judgment\n\
    \            leftVal = leftSensor\n            rightVal = rightSensor\n      \
    \      //Check for a certain amount of time whether both sensors have left the\
    \ road or not\n            if (leftVal < offRoad && rightVal < offRoad) {\n  \
    \              let state = CheckTimer(Timer.SURE)\n                if (state ==\
    \ State.OFF)\n                    OnTimer(Timer.SURE)\n                else if\
    \ (state == State.UP){\n                    //Stop once and start retreating\n\
    \                    MotorStop()\n                    OnTimer(Timer.WAIT)\n  \
    \                  led.plot(0, 4)\n                    step = Step.GOBACK\n  \
    \              }\n            }\n            //When either sensor is on the road\n\
    \            else {\n                OffTimer(Timer.SURE)\n                let\
    \ speed = S_LOW\n                if (leftVal < offRoad) {\n                  \
    \  speed = S_LOW\n                    fuzResult = Fuzzy(leftVal - R_GRAY)\n  \
    \                  led.plot(1, 4)\n                }\n                else if\
    \ (rightVal < offRoad) {\n                    speed = S_LOW\n                \
    \    fuzResult = Fuzzy(R_GRAY - rightVal)\n                    led.plot(2, 4)\n\
    \                }\n                else {\n                    speed = S_MID\n\
    \                    //Perform Fuzzy calculation (deviation )\n              \
    \      //Control so that the density difference between the left and right sensors\
    \ is 0\n                    fuzResult = Fuzzy(leftVal - rightVal)\n          \
    \          led.plot(3, 4)\n                }\n                let spLeft = speed\
    \ - fuzResult\n                let spRight = speed + fuzResult\n             \
    \   Restrict(spLeft, spRight)  //Speed limit\n                Advance(speedLeft,\
    \ speedRight)\n                basic.pause(timeTable[Timer.PERIOD]) //Control\
    \ cycle\n                for (let n = 0; n < 4; n++)\n                    led.unplot(n,\
    \ 4)\n            }\n            break\n        case Step.GOBACK: //Start retreat\n\
    \            if (CheckTimer(Timer.WAIT) == State.UP) {\n                SendRadio2(\"\
    BACK\", leftSensor, rightSensor)\n                FallBack(S_LOW, S_LOW)    //Retreat\
    \ at low speed\n                OnTimer(Timer.BACK)\n                step = Step.BACK\n\
    \            }\n            break\n        case Step.BACK:    //Retreating\n \
    \           leftVal = leftSensor\n            rightVal = rightSensor\n       \
    \     //When the left sensor detects the road\n            if (leftVal > onRoad\
    \ && rightVal < onRoad) {\n                MotorStop()\n                SendRadio2(\"\
    L-ON\", leftSensor, rightSensor)\n                speedLeft = -S_SLOW\n      \
    \          speedRight = S_LOW //Speed up the right motor\n                Advance(speedLeft,\
    \ speedRight)\n                OnTimer(Timer.BACK)\n                led.plot(4,\
    \ 4)\n                step = Step.RESTART\n            }\n            //When the\
    \ right sensor detects the road\n            else if (rightVal > onRoad && leftVal\
    \ < onRoad) {\n                MotorStop()\n                SendRadio2(\"R-ON\"\
    , leftSensor, rightSensor)\n                speedLeft = S_LOW //Speed up the left\
