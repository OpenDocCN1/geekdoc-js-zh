    ```\n\n## 后记\n\n非常感谢您阅读到这里。您觉得怎么样？尽管模糊计算的结果是正负值，但我认为能够在 `Motor()` 函数中不改变 CW 或\
    \ CCW 的情况下改变两个车轮的速度是很方便的。然而，令人惊讶的是，模糊参数（`fuzzyList[]`）和速度参数（`speedList[]`）的细微差别会极大地改变行为。而且，起初沿道路边缘的控制效果更好，但调整参数后，沿道路中心的运行变得最佳。这也令人惊讶。而且，正如我之前提到的，在第二版中，只解释了沿道路中心的方法，以便能够处理道路交叉的情况。仍然有许多部分需要探索和改进。为此，我们需要您的想法，您一直陪伴我们走到这里。\n\
