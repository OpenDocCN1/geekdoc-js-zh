    \                step = Step.START\n            }\n            else if (CheckTimer(Timer.BACK)\
    \ == State.UP) {\n                MotorStop()\n                step = Step.GOSTOP\n\
    \            }\n            break\n        case Step.RESTART: //Restart\n    \
    \        if (leftSensor > onRoad && rightSensor > onRoad) {\n                MotorStop()\n\
