    RGB LED displayAlthough not directly related to driving control, this color-changing
    LED is excellent for enjoying the operation of the Cam robot. In this book, the
    LED display color is changed separately for left and right according to the wheel
    speed and the optical sensor value. You can check the changes in the sensor value
    and speed even from a distance, which may be useful for reviewing the driving
    software.From the Makecode editor, press "advanced block" "extension" and click
    “neopixel” displayed on the screen.![](image_rsrc2CB.jpg)"Neopixel" is added to
    the block list.![](image_rsrc2CC.jpg)When you click "Neopixel", the items shown
    below are displayed.![](image_rsrc2CD.jpg)Among this, use the tool shown below.![](image_rsrc2CE.jpg)let
    strip = neopixel.create(DigitalPin.P0, 24, NeoPixelMode.RGB)![](image_rsrc2CF.jpg)strip.setPixelColor(0,
    neopixel.colors(NeoPixelColors.Red))![](image_rsrc2CG.jpg)strip.show()Using this
    tool, I have been prepared with the following functions.The color assignment according
    to the speed and sensor value is shown in the figure below.![](image_rsrc2CH.jpg)===========================let
    item = neopixel.create(DigitalPin.P15, 4, NeoPixelMode.RGB)let colorTable = [0X0000ff,
    0x00ffff, 0x00ff00, 0xffff00, 0xff00ff]//For speedfunction NeoSpeed(pos: number,
    speed: number) {//-40...60...120let index = 0if (speed < 0)item.setPixelColor(pos,
    colorTable[0])else {if (speed >= 60) {  //60...120speed -= 60 //0..60index = speed
    / 15  //0...3if (index > 3)index = 3}els eindex = 0index += 1item.setPixelColor(pos,
    colorTable[index])}return index}//For sensorfunction NeoSensor(pos: number, sensor:
    number) {//0...1023let index = 0sensor -= 300if (sensor >= 0) {index = sensor
    / 200    //0,1,2,3..index += 1if (index > 4)index = 4}item.setPixelColor(pos,
    colorTable[4 - index])return index}//0=left front, 1=left rear, 2=right rear,
    3=right front//Display only when the values are differentlet oldIndex = 0function
    NeoShow() {let a = NeoSensor(0, leftSensor)let b = NeoSensor(3, rightSensor)let
    c = NeoSpeed(1, speedLeft)let d = NeoSpeed(2, speedRight)let val = a << 12 + b
    << 8 + c << 4 + dif (oldIndex != val) {oldIndex = valitem.show()}}===========================[2]
    Acquisition of sensor value and LCD displayNow, our aim is to change the rotation
    speed of the left and right motors and adjust the direction in which to operate
    the cam robot along the line.This judgment is based on the values of the left
    and right sensors.So next, let''s get the sensor value.(1) Acquisition of sensor
    valueFacing the traveling direction of the cam robot,Left side sensor is connected
    to P0 terminal,Right side sensor is connected to P1 terminal.When writing in the
    block editor as shown below,![](image_rsrc2CJ.jpg)In Javascript, it is expressed
    as follows.let leftSensor = 0let rightSensor = 0basic.forever(function () {leftSensor
    = pins.analogReadPin(AnalogPin.P0)rightSensor = pins.analogReadPin(AnalogPin.P1)})We
    can use this to get sensor values.This value is from 0 to 1023 because micro:bit
    analog input conversion is 10 bits.However, it is difficult to confirm the value
    with the micro:bit LED panel, so let''s display it on the external LCD panel.In
    the future, as the program becomes longer, it will be necessary to edit efficiently.In
    the current version of the Makecode editor, switching between blocks and Javascript
    will change the position of functions and variables.As a countermeasure,1) Do
    not switch to block2) There is a method of editing Javascript with another editor
    (development environment) and pasting it on the Javascript screen of Makecode.We
    use Microsoft Visual Studio Community 2019 because it is difficult to edit Javascript
    with Makecode editor. Please refer to this method as well.(2) Program preparationNow,
    create the software according to the instructions for the LCD panel (I2C AQM1602).Create
    the following basic program and call it from the LCD display program.1) Initial
    setting2) Write commands and charactersIn the initial setting, the following commands
    are sent in order, but it is necessary to leave more time than the internal processing
    time between commands.Initialization could not be performed even for a time that
    was a little more than the microsecond written in the AQM1602 manual, so here
    we drastically set it to a long time (millisecond).Also, since the I2C transmission
    method prepared in the block editor is slightly different from the method shown
    in the AQM1602 manual, here we use a buffer method. A description of the buffer
    is provided below.https://makecode.microbit.org/types/bufferThe signal sent to
    the LCD with I2C is as shown below.The LCD address is 0x3E.In the figure below,
    the command (0x80) for specifying the display matrix and the display data ("ABC123")
    are sent.![](image_rsrc2CK.jpg)Command section expansion![](image_rsrc2CM.jpg)Data
    section expansion![](image_rsrc2CN.jpg)(3) Flow chartCreate the LCD initialization
    according to the flowchart below.![](image_rsrc2CP.jpg)===========================//
    LCD Initializelet initList = [0x38, 0x39, 0x14, 0x73, 0x56, 0x6C, 0x38, 0x01,
    0x0C]// For AQM1602function InitLcd() {basic.pause(100)let len = initList.lengthfor
    (let n = 0; n < len; n++) {WriteCommand(0, initList[n])basic.pause(10)if (n ==
    5)basic.pause(300)}}===========================Write commands and character strings
    according to the flowchart below.![](image_rsrc2CR.jpg)![](image_rsrc2CS.jpg)===========================//
    LCDfunction WriteCommand(regi: number, data: number) {let cmd = pins.createBuffer(2);cmd[0]
    = regicmd[1] = datapins.i2cWriteBuffer(0x3e, cmd, false);control.waitMicros(30)}//
    LCDfunction WriteString(col: number, row: number, str: string) {if (row == 0)WriteCommand(0,
    128 + col)else if (row == 1)WriteCommand(0, 192 + col)elseretur nlet len = str.lengthlet
    buff = pins.createBuffer(len + 1)buff[0] = 64for (let n = 0; n <= len - 1; n++)buff[n
    + 1] = str.charCodeAt(n)pins.i2cWriteBuffer(0x3e, buff, false)}===========================Since
    the sensor value changes from 0 to 1023, it is always displayed in the area of
    4 characters, and when the number of digits is small, it is filled with spaces.===========================//LCDfunction
    FillSpace(str: string, len: number) {let m = len - str.lengthif (m > 0) {for (let
    n = 0; n < m; n++)str += " "}return str}===========================(4) Display
    of sensor valueLet''s display the left and right sensor values on the LCD.Write
    the values of right sensor and left sensor on the first line of the LCD.![](image_rsrc2CT.jpg)===========================let
    leftSensor = 0let rightSensor = 0//LCDfunction ShowLcd() {let str1 = Math.round(rightSensor).toString()str1
    = FillSpace(str1, 4)WriteString(0, 0, str1)str1 = Math.round(leftSensor).toString()str1
    = FillSpace(str1, 4)WriteString(12, 0, str1)}===========================(5) BackgroundDuring
    the operation of the cam robot, sensor values are always required, so capture
    them in the background.In Javascript of Makecode, how to write is to open "New
    project" and select "Run in background" from "Advanced block" "Control".![](image_rsrc2CU.jpg)If
    you switch to Javascript, you will find that you should write as follows.control.inBackground(function
    () {})In this function, write the part that captures the left and right sensor
    values.===========================// Background workercontrol.inBackground(function
    () {while (true) {leftSensor = pins.analogReadPin(AnalogPin.P0)rightSensor = pins.analogReadPin(AnalogPin.P1)basic.pause(5)  //ms}})===========================The
    background also uses CPU time, so the above basic.pause () is required. Without
    this, most of the CPU time will be taken in the background and the main program
    will not run.The time of pause () is determined in consideration of the control
    cycle of fuzzy control that follows.Now that we are ready, call the LCD display
    function in the main loop.===========================//Starting pointInitLcd()//
    main loopbasic.forever(function () {ShowLcd()basic.pause(500)  //ms})===========================How
    is it?  Did it display?When moving the black paper under the sensor, does it change
    the value?The left and right values are different on the handmade sensor board
    of the cam robot used this time.Whether it is due to the influence of ambient
    light, differences in component constants, or because the mounting position is
    not accurate, for example, as shown in the figure below.![](image_rsrc2CV.jpg)If
    OK, you have got a way to know the most important sensor values, so let''s move
    on to the next step.[3] Operation policyNow, with what kind of policy do you control
    the movement of the cam robot?Moving along the road, but along which part of the
    road do you move?In the center of the road? Or the edge of the road?The sensor
    concentration of the board created this time is as shown below.Since a lot of
    light is reflected on white paper, the value is low due to the hardware configuration.
    On black paper, the value input to the microcomputer is high because there is
    little reflected light.The figure below shows the values of each sensor when the
    black paper is moved from right to left by hand.![](image_rsrc2CW.jpg)(1) The
    center of the roadIf you want to control the cam robot to the center of the road,
    you will control so that the slope of the straight line connecting the left and
    right sensor values is horizontal (that is so that the difference between the
    left and right sensor values to 0).Even if there is a difference in the sensor
    values on the left and right in the same black area, there should be somewhere
    where the inclination is almost horizontal. Control it with the goal.![](image_rsrc2CX.jpg)To
    respond to the intersection of road lines, the second edition of this book only
    deals with running along the center of the road.What explained here is only an
    example.Besides this, your readers may find innovative ways.There is no right
    answer for control. Failure is natural.The most important thing is to think of
    various ways for yourself and try hard.(2) Operation procedureAfter turning on
    the power,1) Place the cam robot on the white part of the paper on which the course
    is drawn and press the B button to read the white sensor value.To confirm that
    you have pressed it, it will display the number 1 on the micro:bit LED screen.![](image_rsrc2CY.jpg)2)
    Place the left and right sensors on the black part of the paper and press the
    B button to read the black sensor value.Similarly, the number 2 is displayed on
    the LED screen of mcro:bit.![](image_rsrc2CZ.jpg)The order of 1) and 2) can be
    reversed. At the end of this operation, the white and black representative values
    and the median value are determined. If this operation is omitted, the default
    value will be used.3) Place the two central sensors on the line and press the
    A button to start.![](image_rsrc2D0.jpg)4) Press the B button to stop at any time.
    Since the typical values of black and white are remembered, the operation can
    be restarted simply by pressing the A button.(3) Flow chartThe flowchart is as
    shown below.![](image_rsrc2D1.jpg)(4) Fuzzy calculationThe above fuzzy calculation
    is described in detail in "Fuzzy & PID2" of the same "Discover How" series as
    this document but uses its own fuzzy calculation.This is determined as the following
    diagram shows.![](image_rsrc2D2.jpg)The meaning of "fuzzyList []" below is as
    follows.fuzzyList[0]​ Maximum deviation value (horizontal axis)fuzzyList[1]​ Maximum
    deviation change (vertical axis)fuzzyList[2]​ Output maximum valueThe fuzzy calculation
    program is as follows.===========================//Fuzzy//fuzzyList[2] is multiplied
    by 10, so the result should be 1/10let fuzzyList = [200, 40, 200]let oldDiff =
    0let fuzResult = 0let target = 0//Fuzzy  Calculate the amount to suppressfunction
    Fuzzy(val: number) {let x0 = target - val  //Deviation from medianlet y0 = x0
    - oldDiff   //Deviation change amountoldDiff = x0let dv = fuzzyList[0]     //Maximum
    deviationlet ddv = fuzzyList[1]    //Maximum difference in deviation changelet
    lout = -fuzzyList[2]    //Output maximum valuelet a = ddv / dv //Slope = deviation
    change amount / deviationlet d = x0 + a * y0 //numeratorlet x1 = d / (a * a +
    1)    //X coordinate of intersection = numerator / denominatorlet lx = dv   //Deviationlet
    result = (x1 * lout) / lx//Limit outputlet limit = fuzzyList[2]if (result < -limit)result
    = -limitelse if (result > limit)result = limitreturn result / 10}===========================(5)
    Motor reversalBy the way, if the motor speed is lower than a certain value, the
    wheels hardly move.An example: Advance(80, 30)   Right wheel does not moveTherefore,
    as shown in the figure below, we reverse the motor at a certain speed or less.For
    example,If "fuzzyList = [200, 40, 200]", the output range of Fuzzy is -20～20.If
    "speedList = [60, 80, 100, 120]", the range of speed is "Center speed ± Fuzzy",
    so it is as shown in the table below.![](image_rsrc2D3.jpg)When fuzzyList = [200,
    40, 300], the output range of Fuzzy is -30 to 30, so it is as shown in the table
    below.![](image_rsrc2D4.jpg)This is shown in the figure below.![](image_rsrc2D5.jpg)The
    program to limit the motor speed is as follows.===========================let
    speedList = [60, 80, 100, 120]    //SLOW,LOW,MID,HIGHlet S_SLOW = speedList[0] 
    //SLOWlet S_LOW = speedList[1]    //LOWlet S_MID = speedList[2]    //MIDlet S_HIGH
    = speedList[3]  //HIGHlet speedLeft = 0let speedRight = 0//Speed limitfunction
    Restrict(spLeft: number, spRight:number) {if (spLeft > S_HIGH)speedLeft = S_HIGHelse
    if (spLeft < S_LOW)speedLeft = spLeft - S_SLOW * 2elsespeedLeft = spLef tif (spRight
    > S_HIGH)speedRight = S_HIGHelse if (spRight < S_LOW)speedRight = spRight - S_SLOW
    * 2elsespeedRight = spRight}===========================[4] Creation of main programLet''s
    write the main program according to the previous flowchart.The flowchart of the
    fuzzy control part (*1) is as follows.![](image_rsrc2D6.jpg)![](image_rsrc2D7.jpg)(1)
    Variable definitionDefine various variables.===========================//Sensor
    valuelet roadList = [250, 450, 650]    //WHITE, GRAY, BLACKlet R_WHITE = roadList[0]    //WHITElet
    R_GRAY = roadList[1]    //GRAYlet R_BLACK = roadList[2]    //BLACKlet offset =
    [30, 40]   //White, Blacklet offRoad = 0let onRoad = 0let leftVal = 0let rightVal
    = 0//Sequence stepslet Step = {STOP: 0,START: 1 ,FORWARD: 2,}let step = Step.STOP===========================(2)
    Main programThe main program is as follows.===========================function
    IsStart() {return input.buttonIsPressed(Button.A)}function IsStop() {return input.buttonIsPressed(Button.B)}//Starting
    pointInitLcd()//Main Loopbasic.forever(function () {if (IsStart() == true && step
    == Step.STOP) {  //Startbasic.clearScreen()step = Step.START}else if (IsStop()
    == true && step != Step.STOP) { //StopMotorStop()basic.clearScreen()step = Step.STOP}switch
    (step) {case Step.STOP: //While stopped//Get sensor values and set roadListif
    (IsStop() == true) {if (leftSensor < R_GRAY && rightSensor < R_GRAY) {R_WHITE
    = Math.max(leftSensor, rightSensor)basic.showNumber(1)}else if (leftSensor > R_GRAY
    && rightSensor > R_GRAY) {R_BLACK = Math.min(leftSensor, rightSensor)basic.showNumber(2)}R_GRAY
    = (R_WHITE + R_BLACK) / 2}breakcase Step.START:    //Start moving forwardoffRoad
    = R_WHITE + offset[0]onRoad = R_BLACK - offset[1]speedLeft = S_LOWspeedRight =
    S_LOWbasic.pause(500)Advance(speedLeft, speedRight)    //Start moving forwardstep
    = Step.FORWARDbreakcase Step.FORWARD: //While moving forward//Use the value at
    the time of judgmentleftVal = leftSensorrightVal = rightSensorlet speed = S_LOWif
    (leftVal < offRoad) {speed = S_LOWfuzResult = Fuzzy(leftVal - R_GRAY)led.plot(1,
    4)}else if (rightVal < offRoad) {speed = S_LOWfuzResult = Fuzzy(R_GRAY - rightVal)led.plot(2,
    4)}else {speed = S_MID//Perform Fuzzy calculation (deviation)//Control so that
    the density difference between the left and right sensors is 0fuzResult = Fuzzy(leftVal
    - rightVal)led.plot(3, 4 )}let spLeft = speed - fuzResultlet spRight = speed +
    fuzResultRestrict(spLeft, spRight)  //Speed limitAdvance(speedLeft, speedRight)basic.pause(timeTable[Timer.PERIOD])
    //Control cyclefor (let n = 0; n < 4; n++)led.unplot(n, 4)break}})===========================Download
    this program to micro:bit and see how it works.How is it?[5] Creation of timerAfter
    confirming the movement to some extent, let''s make it possible to confirm the
    white and black sensor values on the LCD screen performed before starting.The
    display interval on the LCD screen is, for example, if set 0.1 seconds which is
    too fast for human eyes to follow the change, so let''s use 0.5 seconds here.Also,
    within this 0.5 sec time, the wheels are controlled according to the sensor value,
    we can''t write as "basic.pause (500) // ms".So let''s run a timer outside of
    the main loop, and from time to time, check the elapsed timer time from the main
    loop.Here we will discuss how to use the running timer and how to use the PWM
    timer.(1) Common partFirst, it will describe the parts that are common to the
    two timers.TIMERSIZE​ ​ Number of timerstimeValue[]​ ​ Downcount valuetimeTable[]​
    ​ Timer setting value (ms)State​ ​ Timer status (OFF, ON, UP)I have prepared 5
    timers, each of which will be used for the following purposes.SHOW​ ​ LCD display
    cyclePERIOD​ ​ Control cycleSURE​ ​ Overhang confirmation timeWAIT​ ​ Waiting
    timeBACK​ ​ Retreat time limit===========================let TIMERSIZE = 5let
    timeValue = [0, 0, 0, 0, 0]let Timer = {SHOW: 0,PERIOD: 1,SURE: 2,WAIT: 3,BACK:
    4}let timeTable = [500, 2, 200, 400, 4000]​ //mslet State = {OFF: 0,ON: 1,UP:
    2}===========================These are common timer operation functions.OnTimer()​
    ​ Start the specified timerOffTimer()​ ​ Stop the specified timerCheckTimer()​
    Check if the specified timer has expiredInitTimer()​ ​ Initialize timer(2) Running
    timeUse "input" and "other uptime" from blocks in the Makecode editor.![](image_rsrc2D8.jpg)You
    can find out the elapsed time by doing the following.![](image_rsrc2D9.jpg)let
    elapsed = 0let startTime = input.runningTime()basic.forever(function () {elapsed
    = input.runningTime() - startTime})1) Running timerLet''s configure the timer
    with running time.Add the following variables and constants.startTime[]​ ​ Timer
    start time===========================//Timerlet startTime = [0, 0, 0, 0, 0]===========================2)
    Running time timer operation===========================// Timerfunction OnTimer(n:
    number) {if (n < TIMERSIZE) {startTime[n] = input.runningTime()timeValue[n] =
    timeTable[n]}}function OffTimer(n: number) {if (n < TIMERSIZE) {timeValue[n] =
    0}}function CheckTimer(n: number) {let result = 0if (n < TIMERSIZE) {if (timeValue[n]
    == 0)result = State.OFFelse {let elapsedTime = input.runningTime() - startTime[n]if
    (timeValue[n] <= elapsedTime)  //msresult = State.UPelseresult = State.ON}}return
    result}function InitTimer() {for (let n = 0; n < TIMERSIZE; n++)timeValue[n] =
    0OnTimer(Timer.SHOW)}===========================(3) PWM outputThe other is to
    use the accurate PWM output provided in the CPU as shown below. In the figure
    below, the P12 and P16 terminals are connected.![](image_rsrc2DA.jpg)![](image_rsrc2DB.jpg)pins.onPulsed(DigitalPin.P16,
    PulseValue.High, function () {})pins.analogWritePin(AnalogPin.P12, 512)pins.analogSetPeriod(AnalogPin.P12,
    10000)The figure below shows the PWM output waveform with the above settings.
    (Cycle 10ms)![](image_rsrc2DC.jpg)1) PWM timerConfigure a timer that uses the
    PWM output.timeState[]​ ​ Timer status (OFF, ON, UP)===========================let
    timeState = [0, 0, 0, 0, 0]===========================2) PWM timer operationpins.onPulsed()​
    This is called by the PWM pulse and counts down.===========================//Called
    every 10mspins.onPulsed(DigitalPin.P16, PulseValue.High, function () {for (let
    n = 0; n < TIMERSIZE; n++) {if (timeState[n] == State.ON) {if (timeValue[n] >
    0)timeValue[n] -= 10if (timeValue[n] <= 0) {timeState[n] = State.UP}}}})// Timerfunction
    OnTimer(n: number) {if (n < TIMERSIZE) {timeValue[n] = timeTable[n]timeState[n]
    = State.ON}}function OffTimer(n: number) {if (n < TIMERSIZE) {timeState[n] = State.OFF}}function
    CheckTimer(n: number) {if (n < TIMERSIZE)return timeState[n]elsereturn State.OFF}function
    InitTimer() {for (let n = 0; n < TIMERSIZE; n++) {timeValue[n] = 0timeState[n]
    = State.OFF}OnTimer(Timer.SHOW)}===========================Although there is no
    big difference between the two methods, using the PWM output will slightly shorten
    the time to check for time-up as you do not need to calculate the running time.1)
    Processing time when using PWM output (about 20us)![](image_rsrc2DD.jpg)2) Processing
    time when running time is used (about 93us)![](image_rsrc2DE.jpg)However, there
    is no big difference in the cycle time of the main loop, so it doesn''t matter
    which one you use.The figure below shows the cycle time measured while performing
    operation control, but it is a guideline because it varies depending on the processing
    loop.1) Cycle time when using PWM output (36ms for short)![](image_rsrc2DF.jpg)2)
    Cycle time when running time is used (35ms for short)![](image_rsrc2DG.jpg)And,
    since the control cycle is also included in the timer list, change it as follows.===========================:Advance(speedLeft,
    speedRight)basic.pause(timeTable[Timer.PERIOD]) //Control cyclebreak:===========================(4)
    InitializationFirst, initialize the timer and LCD. When using the PWM timer, start
    here.===========================//Operationfunction Initial() {InitTimer()InitLcd()//
    For PWM timerpins.analogWritePin(AnalogPin.P12, 512)     //Duty 50%pins.analogSetPeriod(AnalogPin.P12,
    10000)  //Period 10ms}===========================The LCD display function is called
    periodically from the main loop as shown below.===========================//Starting
    pointInitial()//Main Loopbasic.forever(function () {(The part indicated by the
    button as mentioned above)switch (step) {(Control part as mentioned above)}if
    (CheckTimer(Timer.SHOW) == State.UP) {OnTimer(Timer.SHOW)ShowLcd()}})===========================Add
