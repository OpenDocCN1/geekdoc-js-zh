    string) {let str1 = ""let str2 = ""let str3 = ""let str4 = ""switch (str) {case
    ''F'':str1 = fuzzyList[0].toString( )str2 = fuzzyList[1].toString()str3 = fuzzyList[2].toString()str4
    = "Fuzzy " + str1 + ": " + str2 + ": " + str3breakcase ''S'':  // speedList [0]
    is omitted due to character limitstr1 = speedList[1].toString()str2 = speedList[2].toString()str3
    = speedList[3].toString()str4 = "Speed " + str1 + ": " + str2 + ": " + str3breakcase
    ''T'':  // timeTable [1] is omitted due to character limitstr1 = timeTable[0].toString()str2
    = timeTable[2].toString()str4 = "Time1 " + str1 + ": " + str2breakcase ''U'':str1
    = timeTable[3].toString()str2 = timeTable[4].toString()str4 = "Time2 " + str1
    + ": " + str2breakcase ''D'':str1 = screen.toString()str4 = "Screen " + str1breakcase
    ''Z'':   //Dead zonestr1 = dZone.toString()str4 = "Zone " + str1breakcase ''B'':   //Back
    offsetstr1 = offset[0].toString()str2 = offset[1].toString()str4 = "Offset " +
    str1 + ": " + str2breakdefault:return}radio.sendString(str4)}===========================Add
