    from the detection of the sensor to the reflection of the actual movement, you
    may see behavior like shaking its head.If the difference from the target value
    is small, how will the behavior change if it is ignored?This is called the dead
    zone, and as shown in the figure below, it controls the output in a certain input
    range and performs smooth control, and is mainly used in the industrial field.![](image_rsrc2DT.jpg)As
    shown below, when the difference from the target value in the fuzzy calculation
    is small, the program can be realized simply by returning the control amount =
    0.===========================function Fuzzy(val: number) {let x0 = target - val  //Deviation
    from medianif (-dZone < x0 && x0 < dZone) {   //Dead zoneoldDiff = 0return 0}：===========================(2)
    Noise removalIn general, digital signals and analog signals input to the CPU board
    from outside have noise.Here, since the sensor value is an analog signal, the
    method of taking the median value is used to eliminate sudden values.Change the
    background worker by adding the following function to use the median value of
    three consecutively entered values.===========================//Find the median
    of three valuesfunction CalcMedian(a: number, b: number, c: number) {let center
    = 0if (a < b) {if (c < a)center = aelse if (c > b)center = belsecenter = c}else
    {if (c < b)center = belse if (c > a)center = aelsecenter = c}return center}//Background
    workercontrol.inBackground(function () {let pointer = 0let buffL = [0, 0, 0]let
    buffR = [0, 0, 0]let buffSize = 3​ //buffL.lengthwhile (true) {buffL[pointer]
    = pins.analogReadPin(AnalogPin.P0)buffR[pointer] = pins.analogReadPin(AnalogPin.P1)if
    (++pointer >= buffSize)pointer = 0leftSensor = CalcMedian(buffL[0], buffL[1],
    buffL[2])rightSensor = CalcMedian(buffR[0], buffR[1], buffR[2])basic.pause(5)  //ms}})===========================[8]
    Response when protruding the roadNow, we are going to think about how to deal
    with it if it protrudes off the road.For example,1) Check if it has surely stuck
    out the road. (By timer)2) If it protrudes, stop temporarily and start retreating.3)
    If one of the sensors detects a road during the retreat, it is determined that
    there is a road in that direction, and it slightly turns the vehicle in that direction.4)
    After a little advance, when both sensors detect the road, restart again.It is
    the method shown below.After protrudes, if the left sensor detects the road first
    when it backs, it changes the direction of travel a little so that the body turns
    to the left.![](image_rsrc2DU.jpg)Similarly, after protrudes, if the right sensor
    detects the road first when it backs, it changes the direction of travel a little
    so that the body turns to the right.![](image_rsrc2DV.jpg)(1) Flow chartThe flowchart
    shown below is created using this method.![](image_rsrc2DW.jpg)In each case, for
    checking how the sensor value is used, so let''s add the following functions.===========================//Send
    sensor valuesfunction SendRadio2(str1: string, val1: number, val2: number) {let
    str2 = Math.round(val1).toString()let str3 = Math.round(val2).toString()let str4
    = str1 + ": " + str2 + ": " + str3radio.sendString(str4)}===========================(2)
    Add to main loopAdd sections related to retreat.We use “offset[]” to expand the
    range slightly to determine whether it is on the road or not.===========================//Sequence
    stepslet Step = {STOP: 0,START: 1,FORWARD: 2,GOBACK: 3,BACK: 4,RESTART: 5,GOSTOP:
    6}===========================Create a program according to the flowchart above.===========================//Main
    Loopfunction IsStart() {return input.buttonIsPressed(Button.A)}function IsStop()
    {return input.buttonIsPressed(Button.B)}basic.forever(function () {if (IsStart()
    == true && step == Step.STOP) {  //Startbasic.clearScreen()step = Step.START}else
    if (IsStop() == true && step != Step.STOP) {MotorStop()basic.clearScreen()OnTimer(Timer.WAIT)step
    = Step.STOP}switch (step) {case Step.STOP: // While stoppedif (CheckTimer(Timer.WAIT)
    == State.ON)break//Get sensor values and set a targetif (IsStop() == true) {if
    (leftSensor < R_GRAY && rightSensor < R_GRAY) {R_WHITE = Math.max(leftSensor,
    rightSensor)basic.showNumber(1)}else if (leftSensor > R_GRAY && rightSensor >
    R_GRAY) {R_BLACK = Math.min(leftSensor, rightSensor)basic.showNumber(2)}R_GRAY
    = (R_WHITE + R_BLACK) / 2}breakcase Step.START:    //Start moving forwardoffRoad
    = R_WHITE + offset[0]onRoad = R_BLACK - offset[1]speedLeft = S_LOWspeedRight =
    S_LOWbasic.pause(500)Advance(speedLeft, speedRight)OffTimer(Timer.SURE )step =
    Step.FORWARDbreakcase Step.FORWARD: //While moving forward//Use the value at the
    time of judgmentleftVal = leftSensorrightVal = rightSensor//Check for a certain
    amount of time whether both sensors have left the road or notif (leftVal < offRoad
    && rightVal < offRoad) {let state = CheckTimer(Timer.SURE)if (state == State.OFF)OnTimer(Timer.SURE)else
    if (state == State.UP){//Stop once and start retreatingMotorStop()OnTimer(Timer.WAIT)led.plot(0,
    4)step = Step.GOBACK}}//When either sensor is on the roadelse {OffTimer(Timer.SURE)let
    speed = S_LOWif (leftVal < offRoad) {speed = S_LOWfuzResult = Fuzzy(leftVal -
    R_GRAY)led.plot(1, 4)}else if (rightVal < offRoad) {speed = S_LOWfuzResult = Fuzzy(R_GRAY
    - rightVal)led.plot(2, 4)}else {speed = S_MID//Perform Fuzzy calculation (deviation
    )//Control so that the density difference between the left and right sensors is
    0fuzResult = Fuzzy(leftVal - rightVal)led.plot(3, 4)}let spLeft = speed - fuzResultlet
    spRight = speed + fuzResultRestrict(spLeft, spRight)  //Speed limitAdvance(speedLeft,
    speedRight)basic.pause(timeTable[Timer.PERIOD]) //Control cyclefor (let n = 0;
    n < 4; n++)led.unplot(n, 4)}breakcase Step.GOBACK: //Start retreatif (CheckTimer(Timer.WAIT)
    == State.UP) {SendRadio2("BACK", leftSensor, rightSensor)FallBack(S_LOW, S_LOW)    //Retreat
    at low speedOnTimer(Timer.BACK)step = Step.BACK}breakcase Step.BACK:    //RetreatingleftVal
    = leftSensorrightVal = rightSensor//When the left sensor detects the roadif (leftVal
    > onRoad && rightVal < onRoad) {MotorStop()SendRadio2("L-ON", leftSensor, rightSensor)speedLeft
    = -S_SLOWspeedRight = S_LOW //Speed up the right motorAdvance(speedLeft, speedRight)OnTimer(Timer.BACK)led.plot(4,
    4)step = Step.RESTART}//When the right sensor detects the roa delse if (rightVal
    > onRoad && leftVal < onRoad) {MotorStop()SendRadio2("R-ON", leftSensor, rightSensor)speedLeft
    = S_LOW //Speed up the left motorspeedRight = -S_SLOWAdvance(speedLeft, speedRight)OnTimer(Timer.BACK)led.plot(4,
    4)step = Step.RESTART}//When the both sensors detect the roadelse if (leftVal
    > onRoad && rightVal > onRoad) {MotorStop()led.unplot(4, 4)step = Step.START}else
    if (CheckTimer(Timer.BACK) == State.UP) {MotorStop()step = Step.GOSTOP}breakcase
    Step.RESTART: //Restartif (leftSensor > onRoad && rightSensor > onRoad) {MotorStop()SendRadio2("RES",
    leftSensor, rightSensor)led.unplot(4, 4)step = Step.START}else if (CheckTimer(Timer.BACK)
    == State.UP) {MotorStop()step = Step.GOSTOP}breakcase Step.GOSTOP://Help Markbasic.showIcon(IconNames.Chessboard)OnTimer(Timer.WAIT
    )step = Step.STOPbreak}===========================How is it? Did it go well?It
    seems that retreating is more tuff than moving forward.On the climbing mountain
    world, it''s like saying that you need more courage to turn back, rather than
    aiming for the summit?That''s it for the whole explanation.After that, if the
    movement is not desirable even if adjust the parameters, please make improvements
    boldly.We most look forward to improving with your own ideas.Finally, as many
    source codes are scattered in the text, we have posted all the programs here.It
    also includes the RGB LED display.[9] All programs posted===========================//
    JavaScript source code//Motor ====================//Heading  to the forward direction
    of the cam robot, M1: left wheel, M2: right wheelfunction Advance(speed1: number,
    speed2: number) {motor.MotorRun(motor.Motors.M1, motor.Dir.CW, speed1)motor.MotorRun(motor.Motors.M2,
    motor.Dir.CW, speed2)}function FallBack(speed1: number, speed2: number) {motor.MotorRun(motor.Motors.M1,
    motor.Dir.CCW, speed1)motor.MotorRun(motor.Motors.M2, motor.Dir.CCW, speed2)}function
    MotorStop() {motor.motorStopAll()}//Specify the speed of the motor to be controlled
    with a value from 0 to 255let speedList = [60, 80, 100, 120]    //SLOW,LOW,MID,HIGHlet
    S_SLOW = speedList[0]  //SLOWlet S_LOW = speedList[1]    //LOWlet S_MID = speedList[2]    //MIDlet
    S_HIGH = speedList[3]  //HIGHlet speedLeft = 0let speedRight = 0//Speed limitfunction
    Restrict(spLeft: number, spRight: number) {if (spLeft > S_HIGH)speedLeft = S_HIGHelse
    if (spLeft < S_LOW)speedLeft = spLeft - S_SLOW * 2elsespeedLeft = spLeftif (spRight
    > S_HIGH)speedRight = S_HIGHelse if (spRight < S_LOW)speedRight = spRight - S_SLOW
    * 2elsespeedRight = spRight}//NeoPixel  ====================let item = neopixel.create(DigitalPin.P15,
    4, NeoPixelMode.RGB)let colorTable = [0X0000ff, 0x00ffff, 0x00ff00, 0xffff00,
    0xff00ff]//For speedfunction NeoSpeed(pos: number, speed: number) {//-40...60...120let
    index = 0if (speed < 0)item.setPixelColor(pos, colorTable[0])else {if (speed >=
    60) {  //60...120speed -= 60 //0..60index = speed / 15  //0...3if (index > 3 )index
    = 3}elseindex = 0index += 1item.setPixelColor(pos, colorTable[index])}return index}//For
    sensorfunction NeoSensor(pos: number, sensor: number) {//0...1023let index = 0sensor
    -= 300if (sensor >= 0) {index = sensor / 200    //0,1,2,3..index += 1if (index
    > 4)index = 4}item.setPixelColor(pos, colorTable[4 - index])return index}//0=left
    front, 1=left rear, 2=right rear, 3=right front//Display only when the values
    are differentlet oldIndex = -1function NeoShow() {let a = NeoSensor(0, leftSensor)let
    b = NeoSensor(3, rightSensor)let c = NeoSpeed(1, speedLeft)let d = NeoSpeed(2,
    speedRight)let val = a << 12 + b << 8 + c << 4 + dif (oldIndex != val) {oldIndex
    = valitem.show()}}//Sensor Pin connection//leftSensor=P0,rightSensor=P1,exLeft=P2,exRight=P4(no
    connection)// LCD ====================let initList = [0x38, 0x39, 0x14, 0x73,
    0x56, 0x6C, 0x38, 0x01, 0x0C]// For AQM1602function InitLcd() {basic.pause(100)let
    len = initList.lengthfor (let n = 0; n < len; n++) {WriteCommand(0, initList[n])basic.pause(10)if
    (n == 5)basic.pause(300)}}// LCDfunction WriteCommand(regi: number, data: number)
    {let cmd = pins.createBuffer(2);cmd[0] = regicmd[1] = datapins.i2cWriteBuffer(0x3e,
    cmd, false);control.waitMicros(30)}// LCDfunction WriteString(col: number, row:
    number, str: string) {if (row == 0)WriteCommand(0, 128 + col)else if (row == 1)WriteCommand(0,
    192 + col)elsereturnlet len = str.lengthlet buff = pins.createBuffer(len + 1)buff[0]
    = 6 4for (let n = 0; n <= len - 1; n++)buff[n + 1] = str.charCodeAt(n)pins.i2cWriteBuffer(0x3e,
    buff, false)}//LCDfunction FillSpace(str: string, len: number) {let m = len -
    str.lengthif (m > 0) {for (let n = 0; n < m; n++)str += " "}return str}//Sensorlet
    leftSensor = 0let rightSensor = 0//Screen0-----//rightSensor   Center    leftSensor//                   Fuzzy//Screen1-----//rightSensor              leftSensor//speedRight   Fuzzy   speedLeftlet
    Screen = {Sensor: 0,Speed: 1,Off: 2}let screen = Screen.Sensor//LCDfunction ShowLcd()
    {led.toggle(4, 3)    //Ready lamplet str1 = ""switch (screen) {case Screen.Sensor:str1
    = Math.round(rightSensor).toString()str1 = FillSpace(str1, 4)WriteString(0, 0,
    str1 )let val = (rightSensor + leftSensor) / 2 //Centerstr1 = Math.round(val).toString()str1
    = FillSpace(str1, 4)WriteString(6, 0, str1)str1 = Math.round(leftSensor).toString()str1
    = FillSpace(str1, 4)WriteString(12, 0, str1)str1 = Math.round(fuzResult).toString()str1
    = FillSpace(str1, 4)WriteString(6, 1, str1)breakcase Screen.Speed:str1 = Math.round(rightSensor).toString()str1
    = FillSpace(str1, 4)WriteString(0, 0, str1)str1 = Math.round(leftSensor).toString()str1
    = FillSpace(str1, 4)WriteString(12, 0, str1)str1 = Math.round(speedRight).toString()str1
    = FillSpace(str1, 4)WriteString(0, 1, str1)str1 = Math.round(fuzResult).toString()str1
    = FillSpace(str1, 4)WriteString(6, 1, str1)str1 = Math.round(speedLeft).toString()str1
    = FillSpace(str1, 4)WriteString(12, 1, str1)break}}//Fuzzy ====================//micro:
    bit analog input resolution is 10 bits//fuzzyList[0] : Fuzzy The Maximum deviation//fuzzyList[1]
    : Fuzzy The maximum difference in deviation change//fuzzyList[2] : Fuzzy Maximum
    output//fuzzyList[2] is multiplied by 10, so the result should be 1/10let fuzResult
    = 0let target = 0//Fuzzy  Calculate the amount to suppresslet fuzzyList = [200,
    40, 200]let oldDiff = 0let dZone = 20  //dead zonefunction Fuzzy(val: number)
    {let x0 = target - val  //Deviation from medianif (-dZone < x0 && x0 < dZone)
    {   //Dead zoneoldDiff = 0return 0}let y0 = x0 - oldDiff   //Deviation change
    amountoldDiff = x0let dv = fuzzyList[0]     //Maximum deviationlet ddv = fuzzyList[1]    //Maximum
    difference in deviation changelet lout = -fuzzyList[2]    //Output maximum valuelet
    a = ddv / dv //Slope = deviation change amount / deviationlet d = x0 + a * y0
    //numeratorlet x1 = d / (a * a + 1)    //X coordinate of intersection = numerator
    / denominator let lx = dv   //Deviationlet result = (x1 * lout) / lx//Limit outputlet
    limit = fuzzyList[2]if (result < -limit)result = -limitelse if (result > limit)result
    = limitreturn result / 10}// Timer ====================let TIMERSIZE = 5let startTime
    = [0, 0, 0, 0, 0]let timeValue = [0, 0, 0, 0, 0]let Timer = {SHOW: 0 ,PERIOD:
    1,SURE: 2,WAIT: 3,BACK: 4}let timeTable = [500, 2, 200, 400, 4000]  //mslet State
    = {OFF: 0,ON: 1,UP: 2}// Timerfunction OnTimer(n: number) {if (n < TIMERSIZE)
    {startTime[n] = input.runningTime()timeValue[n] = timeTable[n]}}function OffTimer(n:
    number) {if (n < TIMERSIZE) {timeValue[n] = 0}}function CheckTimer(n: number)
    {let result = 0if (n < TIMERSIZE) {if (timeValue[n] == 0)result = State.OFFelse
    {let elapsedTime = input.runningTime() - startTime[n]if (timeValue[n] <= elapsedTime)  //msresult
    = State.UPelseresult = State.ON}}return result}function InitTimer() {for (let
    n = 0; n < TIMERSIZE; n++)timeValue[n] = 0OnTimer(Timer.SHOW)}//radio====================//11500
    =>14400byte/sec, 20byte/line, 720line/sec, =>1.39ms/line=>about 2ms//When a character
    string is received wirelesslyradio.onReceivedString(function (receivedString)
    {let str = receivedString//DispString(str)let k = 0let data = 0//First, take out
    the first characterlet header = str[0]//Find the ''='' positionlet m = str.indexOf(''='')//If
    ''='' does not existif (m == -1) {//Find the position of ''#''let n = str.indexOf(''#'')//If
    ''#'' does not existif (n == -1)return//Extract characters from 1 to n-1 in strlet
    str1 = str.slice(1, n)//Convert str1 to a numberk = parseInt(str1)}else {//Extract
    characters from 1 to m-1 in strlet str1 = str.slice(1, m)//Convert str1 to a numberk
    = parseInt(str1)//Find the position of ''# ''let n = str.indexOf(''#'')//If ''#''
    does not existif (n == -1)return//Extract characters from position m + 1 to n-1
    of strstr1 = str.slice(m + 1, n)//Convert str1 to a numberdata = parseInt(str1)}//Display
    on LCD//DispNumber(k, data)if (header == ''F'') { //Fuzzyif (k >= 0 && k <= 2)fuzzyList[k]
    = data}else if (header == ''S'') { //Speedif (k >= 0 && k <= 3)speedList[k] =
    data}else if (header == ''D'') { //Displayif (k >= 0 && k <= 2)screen = k}else
    if (header == ''T'') { //Timerif (k >= 0 && k < TIMERSIZE)timeTable[k] = data}else
    if (header == ''R'') { //Runif (k == 0) {MotorStop()step = Step.STOP}else if (k
    == 1)step = Step.START}else if (header == ''Z'') { //Dead zoneif (k >= 0 && k
    <= fuzzyList[0] )dZone = k}else if (header == ''Q'') {    //Queryif (k == 0)     //Fuzzyheader
    = ''F''else if (k == 1)    //Speedheader = ''S''else if (k == 2)    //Timer1header
    = ''T''else if (k == 3)    //Timer2header = ''U''else if (k == 4)    //Displayheader
    = ''D''else if (k == 5)    //Dead zoneheader = ''Z''}basic.pause(50)  //msSendRadio(header)})//Respond
    to ''Query''function SendRadio(str: string) {let str1 = ""let str2 = ""let str3
    = ""let str4 = ""switch (str) {case ''F'':str1 = fuzzyList[0].toString()str2 =
    fuzzyList[1].toString()str3 = fuzzyList[2].toString()str4 = "Fuzzy " + str1 +
    ": " + str2 + ": " + str3breakcase ''S'': // speedList [0] is omitted due to character
    limitstr1 = speedList[1].toString()str2 = speedList[2].toString()str3 = speedList[3].toString()str4
    = "Speed " + str1 + ": " + str2 + ": " + str 3breakcase ''T'':str1 = timeTable[0].toString()str2
    = timeTable[1].toString()str4 = "Time1 " + str1 + ": " + str2breakcase ''U'':str1
    = timeTable[2].toString()str2 = timeTable[3].toString()str4 = "Time2 " + str1
    + ": " + str2breakcase ''D'':str1 = screen.toString()str4 = "Screen " + str1breakcase
    ''Z'':   //Dead zonestr1 = dZone.toString()str4 = "Zone " + str1breakdefault:return}radio.sendString(str4)}//Send
    sensor valuesfunction SendRadio2(str1: string, val1: number, val2: number) {let
    str2 = Math.round(val1).toString()let str3 = Math.round(val2).toString()let str4
    = str1 + ": " + str2 + ": " + str3radio.sendString(str4)}//Operation  ====================function
    Initial() {InitTimer()InitLcd()radio.setTransmitPower(7)radio.setGroup(1)}//Sensor
    valuelet roadList = [250, 450, 650]    //WHITE, GRAY, BLACK, Default valuelet
    R_WHITE = roadList[0]    //WHITElet R_GRAY = roadList[1]    //GRAYlet R_BLACK
    = roadList[2]    //BLACKlet offset = [30, 40]   //White, Blacklet offRoad = 0let
    onRoad = 0let leftVal = 0let rightVal = 0//Sequence stepslet Step = {STOP: 0,START:
    1,FORWARD: 2,GOBACK: 3,BACK: 4,RESTART: 5,GOSTOP: 6}let step = Step.STOPfunction
    IsStart() {return input.buttonIsPressed(Button.A)}function IsStop() {return input.buttonIsPressed(Button.B)}//Starting
    point  ====================Initial()//Main Loop ====================basic.forever(function
    () {if (IsStart() == true && step == Step.STOP) {  //Startbasic.clearScreen()screen
    = Screen.Offstep = Step.STAR T}else if (IsStop() == true && step != Step.STOP)
    { //StopMotorStop()basic.clearScreen()screen = Screen.SensorOnTimer(Timer.WAIT)step
    = Step.STOP}switch (step) {case Step.STOP: //While stoppedif (CheckTimer(Timer.WAIT)
    == State.ON)break//Get sensor values and set roadListif (IsStop() == true) {if
    (leftSensor < R_GRAY && rightSensor < R_GRAY) {R_WHITE = Math.max(leftSensor,
    rightSensor)basic.showNumber(1)}else if (leftSensor > R_GRAY && rightSensor >
    R_GRAY) {R_BLACK = Math.min(leftSensor, rightSensor)basic.showNumber(2)}R_GRAY
    = (R_WHITE + R_BLACK) / 2}breakcase Step.START:    //Start moving forwardoffRoad
    = R_WHITE + offset[0]onRoad = R_BLACK - offset[1]speedLeft = S_LOWspeedRight =
    S_LOWbasic.pause(500)Advance(speedLeft, speedRight)OffTimer(Timer.SURE)step =
    Step.FORWARDbreakcase Step.FORWARD: //While moving forward//Use the value at the
    time of judgmen tleftVal = leftSensorrightVal = rightSensor//Check for a certain
    amount of time whether both sensors have left the road or notif (leftVal < offRoad
    && rightVal < offRoad) {let state = CheckTimer(Timer.SURE)if (state == State.OFF)
    {Advance(speedLeft / 2, speedRight / 2)basic.pause(timeTable[Timer.PERIOD])OnTimer(Timer.SURE)}else
    if (state == State.UP) {//Stop once and start retreatingMotorStop()OnTimer(Timer.WAIT)led.plot(0,
    4)step = Step.GOBACK}}//When either sensor is on the roadelse {OffTimer(Timer.SURE)let
    speed = S_LOWif (leftVal < offRoad) {speed = S_LOWfuzResult = Fuzzy(leftVal -
    R_GRAY)led.plot(1, 4)}else if (rightVal < offRoad) {speed = S_LOWfuzResult = Fuzzy(R_GRAY
    - rightVal)led.plot(2, 4)}else {//Perform Fuzzy calculation (deviation)//Control
    so that the density difference between the left and right sensors is 0fuzResult
    = Fuzzy(leftVal - rightVal)speed = S_MIDled.plot(3, 4)}let spLeft = speed - fuzResultlet
    spRight = speed + fuzResultRestrict(spLeft, spRight)  //Speed limitAdvance(speedLeft,
    speedRight)basic.pause(timeTable[Timer.PERIOD]) //Control cyclefor (let n = 0;
    n < 4; n++)led.unplot(n, 4)}breakcase Step.GOBACK: //Start retreatif (CheckTimer(Timer.WAIT)
    == State.UP) {SendRadio2("BACK", leftSensor, rightSensor)FallBack(S_SLOW, S_SLOW)    //Retreat
    at low speedOnTimer(Timer.BACK)step = Step.BACK}breakcase Step.BACK:    //Retreating//Use
    the value at the time of judgmentleftVal = leftSensorrightVal = rightSensor//When
    the left sensor detects the roadif (leftVal > onRoad && rightVal < onRoad) {MotorStop()SendRadio2("L-ON",
    leftVal, rightVal)speedLeft = -S_SLOWspeedRight = S_LOW //Speed up the right motorAdvance(speedLeft,
    speedRight)OnTimer(Timer.BACK)led.plot(4, 4)step = Step.RESTART}//When the right
    sensor detects the roa delse if (rightVal > onRoad && leftVal < onRoad) {MotorStop()SendRadio2("R-ON",
    leftVal, rightVal)speedLeft = S_LOW //Speed up the left motorspeedRight = -S_SLOWAdvance(speedLeft,
    speedRight)OnTimer(Timer.BACK)led.plot(4, 4)step = Step.RESTART}//When the both
    sensors detect the roadelse if (leftVal > onRoad && rightVal > onRoad) {MotorStop()led.unplot(4,
    4)step = Step.START}else if (CheckTimer(Timer.BACK) == State.UP) {MotorStop()step
    = Step.GOSTOP}breakcase Step.RESTART: //Restartif (leftSensor > onRoad && rightSensor
    > onRoad) {MotorStop()SendRadio2("RES", leftSensor, rightSensor)led.unplot(4,
    4)step = Step.START}else if (CheckTimer(Timer.BACK) == State.UP) {MotorStop()step
    = Step.GOSTOP}breakcase Step.GOSTOP://Help Markbasic.showIcon(IconNames.Chessboard)OnTimer(Timer.WAIT
    )step = Step.STOPbreak}if (CheckTimer(Timer.SHOW) == State.UP) {OnTimer(Timer.SHOW)ShowLcd()NeoShow()}})//Calculate
    the medianfunction CalcMedian(a: number, b: number, c: number) {let center = 0if
    (a < b) {if (c < a)center = aelse if (c > b)center = belsecenter = c}else {if
    (c < b)center = belse if (c > a)center = aelsecenter = c}return center}//Background
    workercontrol.inBackground(function () {let pointer = 0let buffL = [0, 0, 0]let
    buffR = [0, 0, 0]let buffSize = 3    //buffL.lengthwhile (true) {buffL[pointer]
    = pins.analogReadPin(AnalogPin.P0)buffR[pointer] = pins.analogReadPin(AnalogPin.P1)if
    (++pointer >= buffSize)pointer = 0leftSensor = CalcMedian(buffL[0], buffL[1],
    buffL[2])rightSensor = CalcMedian(buffR[0], buffR[1], buffR[2])basic.pause(5)  //ms}})===========================AfterwordThank
    you very much for reading this far.What did you think?Even though the result of
    the fuzzy calculation is a plus or minus value, I thought it was convenient to
    be able to change the speed of both wheels without changing CW or CCW in the Motor()
    function.However, it was surprising that subtle differences in the fuzzy parameters
    (fuzzyList []) and the speed parameters (speedList []) drastically changed the
    behavior.And at first, the control along the road edge worked better, but after
    adjusting the parameters, the operation along the center of the road became best.
    This was also surprised.And, as I mentioned earlier, in the second edition, only
    the method along the center of the road was explained so that it can handle the
    case where the road intersects.There are still many parts that need to be explored
    and improved.To do this, we need your ideas, who come along with us so far.Long
    ago, to the question "What do you need to go well with a computer?", which I have
    seen an article that reads, "It''s Oriental patience."Rather than throwing it
    away immediately, we need courageously challenging to find something new, "there
    may be lurking something treasure in this challenging problem?"The journey may
    be long, but "patience" is there to support you.With this book as a foothold,
    we look forward to your future success.Once again, thank you very much.'
