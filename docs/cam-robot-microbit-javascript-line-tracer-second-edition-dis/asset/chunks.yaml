    \           step = Step.GOBACK\n                }\n            }\n           \
    \ //当任一传感器在道路上时\n            else {\n                OffTimer(Timer.SURE)\n  \
    \              let speed = S_LOW\n                if (leftVal < offRoad) {\n \
    \                   speed = S_LOW\n                    fuzResult = Fuzzy(leftVal\
    \ - R_GRAY)\n                    led.plot(1, 4)\n                }\n         \
    \       else if (rightVal < offRoad) {\n                    speed = S_LOW\n  \
    \                  fuzResult = Fuzzy(R_GRAY - rightVal)\n                    led.plot(2,\
