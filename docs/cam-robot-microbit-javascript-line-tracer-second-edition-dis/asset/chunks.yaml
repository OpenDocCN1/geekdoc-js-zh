    \ many source codes are scattered in the text, we have posted all the programs\
    \ here. It also includes the RGB LED display.\n\n## [9] All programs posted\n\n\
    ```\n===========================\n// JavaScript source code\n\n//Motor ====================\n\
    //Heading  to the forward direction of the cam robot, M1: left wheel, M2: right\
    \ wheel\nfunction Advance(speed1: number, speed2: number) {\n    motor.MotorRun(motor.Motors.M1,\
    \ motor.Dir.CW, speed1)\n    motor.MotorRun(motor.Motors.M2, motor.Dir.CW, speed2)\n\
    }\nfunction FallBack(speed1: number, speed2: number) {\n    motor.MotorRun(motor.Motors.M1,\
    \ motor.Dir.CCW, speed1)\n    motor.MotorRun(motor.Motors.M2, motor.Dir.CCW, speed2)\n\
    }\nfunction MotorStop() {\n    motor.motorStopAll()\n}\n\n//Specify the speed\
    \ of the motor to be controlled with a value from 0 to 255\nlet speedList = [60,\
    \ 80, 100, 120]    //SLOW,LOW,MID,HIGH\nlet S_SLOW = speedList[0]  //SLOW\nlet\
    \ S_LOW = speedList[1]    //LOW\nlet S_MID = speedList[2]    //MID\nlet S_HIGH\
    \ = speedList[3]  //HIGH\nlet speedLeft = 0\nlet speedRight = 0\n\n//Speed limit\n\
    function Restrict(spLeft: number, spRight: number) {\n    if (spLeft > S_HIGH)\n\
    \        speedLeft = S_HIGH\n    else if (spLeft < S_LOW)\n        speedLeft =\
    \ spLeft - S_SLOW * 2\n    else\n        speedLeft = spLeft\n    if (spRight >\
