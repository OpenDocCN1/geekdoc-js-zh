    \  led.unplot(4, 4)\n                step = Step.START\n            }\n      \
    \      else if (CheckTimer(Timer.BACK) == State.UP) {\n                MotorStop()\n\
    \                step = Step.GOSTOP\n            }\n            break\n      \
    \  case Step.GOSTOP:\n            //Help Mark\n            basic.showIcon(IconNames.Chessboard)\n\
    \            OnTimer(Timer.WAIT )\n            step = Step.STOP\n            break\n\
    \    }\n})\n===========================\n```\n\nHow is it? Did it go well? It\
    \ seems that retreating is more tuff than moving forward. On the climbing mountain\
