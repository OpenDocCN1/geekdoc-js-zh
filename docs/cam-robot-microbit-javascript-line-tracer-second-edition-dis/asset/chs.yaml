  ![](img/image_rsrc2BM.jpg)\n\n3) 电机驱动扩展板（DFROBOT SKU_DFR0548）\n> 参考页面：https://www.switch-science.com/catalog/4016/\n\
  ![](img/image_rsrc2BN.jpg)\n\n4) 反射式光电传感器（ROHM RPR-220）2 个\n> 参考页面：http://akizukidenshi.com/catalog/g/gI-11401/\n\
