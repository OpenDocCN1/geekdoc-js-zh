  \n其他配置命令是否正确工作？\n\n# [7] 实现平滑控制\n\n## (1) 死区\n\n由于从传感器检测到实际运动反映存在时间延迟，您可能会看到类似摇头的行为。如果与目标值的差异很小，忽略它会如何改变行为？这称为死区，如下图所示，它在一定的输入范围内控制输出，实现平滑控制，主要用于工业领域。\n\
  ![](img/image_rsrc2DT.jpg)\n\n如下所示，当模糊计算中与目标值的差异很小时，程序可以简单地通过返回控制量 = 0 来实现。\n\n\
  ```\n===========================\nfunction Fuzzy(val: number) {\n    let x0 = target\
  \ - val  //与中值的偏差\n    if (-dZone < x0 && x0 < dZone) {   //死区\n        oldDiff\
  \ = 0\n        return 0\n    }\n    :\n===========================\n```\n\n## (2)\
  \ 噪声去除\n\n通常，从外部输入到 CPU 板的数字信号和模拟信号都有噪声。这里，由于传感器值是模拟信号，使用取中值的方法来消除突变值。通过添加以下函数来更改后台工作器，以使用连续输入的三个值的中值。\n\
  \n```\n===========================\n//求三个值的中值\nfunction CalcMedian(a: number, b:\
  \ number, c: number) {\n    let center = 0\n    if (a < b) {\n        if (c < a)\n\
  \            center = a\n        else if (c > b)\n            center = b\n     \
  \   else\n            center = c\n    }\n    else {\n        if (c < b)\n      \
  \      center = b\n        else if (c > a)\n            center = a\n        else\n\
  \            center = c\n    }\n    return center\n}\n\n//后台工作器\ncontrol.inBackground(function\
  \ () {\n    let pointer = 0\n    let buffL = [0, 0, 0]\n    let buffR = [0, 0, 0]\n\
  \    let buffSize = 3 //buffL.length\n    while (true) {\n        buffL[pointer]\
  \ = pins.analogReadPin(AnalogPin.P0)\n        buffR[pointer] = pins.analogReadPin(AnalogPin.P1)\n\
  \        if (++pointer >= buffSize)\n            pointer = 0\n        leftSensor\
  \ = CalcMedian(buffL[0], buffL[1], buffL[2])\n        rightSensor = CalcMedian(buffR[0],\
  \ buffR[1], buffR[2])\n        basic.pause(5)  //ms\n    }\n})\n===========================\n\
  ```\n\n# [8] 冲出道路时的应对\n\n现在，我们要考虑如果冲出道路该如何处理。例如，\n1) 检查是否确实冲出了道路。（通过定时器）\n2) 如果冲出，暂时停止并开始后退。\n\
  3) 如果在后退过程中某个传感器检测到道路，则判断该方向有道路，并稍微向该方向转弯。\n4) 稍微前进后，当两个传感器都检测到道路时，再次重新启动。\n\n如下所示的方法。冲出后，如果后退时左侧传感器首先检测到道路，则稍微改变行驶方向，使车身向左转。\n\
  ![](img/image_rsrc2DU.jpg)\n\n同样，冲出后，如果后退时右侧传感器首先检测到道路，则稍微改变行驶方向，使车身向右转。\n![](img/image_rsrc2DV.jpg)\n\
  \n## (1) 流程图\n\n使用此方法创建如下所示的流程图。\n![](img/image_rsrc2DW.jpg)\n\n在每种情况下，为了检查传感器值的使用方式，让我们添加以下函数。\n\
  \n```\n===========================\n//发送传感器值\nfunction SendRadio2(str1: string,\
  \ val1: number, val2: number) {\n    let str2 = Math.round(val1).toString()\n  \
  \  let str3 = Math.round(val2).toString()\n    let str4 = str1 + \": \" + str2 +\
  \ \": \" + str3\n    radio.sendString(str4)\n}\n===========================\n```\n\
  \n## (2) 添加到主循环\n\n添加与后退相关的部分。我们使用 `offset[]` 稍微扩大范围以判断是否在道路上。\n\n```\n===========================\n\
  //序列步骤\nlet Step = {\n    STOP: 0,\n    START: 1,\n    FORWARD: 2,\n    GOBACK:\
  \ 3,\n    BACK: 4,\n    RESTART: 5,\n    GOSTOP: 6\n}\n===========================\n\
  ```\n\n根据上面的流程图创建程序。\n\n```\n===========================\n//主循环\nfunction IsStart()\
  \ {\n    return input.buttonIsPressed(Button.A)\n}\nfunction IsStop() {\n    return\
  \ input.buttonIsPressed(Button.B)\n}\n\nbasic.forever(function () {\n    if (IsStart()\
  \ == true && step == Step.STOP) {  //开始\n        basic.clearScreen()\n        step\
  \ = Step.START\n    }\n    else if (IsStop() == true && step != Step.STOP) {\n \
  \       MotorStop()\n        basic.clearScreen()\n        OnTimer(Timer.WAIT)\n\
  \        step = Step.STOP\n    }\n    switch (step) {\n        case Step.STOP: //\
  \ 停止时\n            if (CheckTimer(Timer.WAIT) == State.ON)\n                break\n\
  \            //获取传感器值并设置目标\n            if (IsStop() == true) {\n              \
  \  if (leftSensor < R_GRAY && rightSensor < R_GRAY) {\n                    R_WHITE\
  \ = Math.max(leftSensor, rightSensor)\n                    basic.showNumber(1)\n\
  \                }\n                else if (leftSensor > R_GRAY && rightSensor\
  \ > R_GRAY) {\n                    R_BLACK = Math.min(leftSensor, rightSensor)\n\
  \                    basic.showNumber(2)\n                }\n                R_GRAY\
  \ = (R_WHITE + R_BLACK) / 2\n            }\n            break\n        case Step.START:\
  \    //开始前进\n            offRoad = R_WHITE + offset[0]\n            onRoad = R_BLACK\
  \ - offset[1]\n            speedLeft = S_LOW\n            speedRight = S_LOW\n \
  \           basic.pause(500)\n            Advance(speedLeft, speedRight)\n     \
  \       OffTimer(Timer.SURE )\n            step = Step.FORWARD\n            break\n\
  \        case Step.FORWARD: //前进时\n            //使用判断时的值\n            leftVal =\
  \ leftSensor\n            rightVal = rightSensor\n            //检查两个传感器是否都离开了道路一段时间\n\
  \            if (leftVal < offRoad && rightVal < offRoad) {\n                let\
  \ state = CheckTimer(Timer.SURE)\n                if (state == State.OFF)\n    \
  \                OnTimer(Timer.SURE)\n                else if (state == State.UP){\n\
  \                    //停止一次并开始后退\n                    MotorStop()\n            \
  \        OnTimer(Timer.WAIT)\n                    led.plot(0, 4)\n             \
  \       step = Step.GOBACK\n                }\n            }\n            //当任一传感器在道路上时\n\
  \            else {\n                OffTimer(Timer.SURE)\n                let speed\
  \ = S_LOW\n                if (leftVal < offRoad) {\n                    speed =\
  \ S_LOW\n                    fuzResult = Fuzzy(leftVal - R_GRAY)\n             \
  \       led.plot(1, 4)\n                }\n                else if (rightVal < offRoad)\
  \ {\n                    speed = S_LOW\n                    fuzResult = Fuzzy(R_GRAY\
  \ - rightVal)\n                    led.plot(2, 4)\n                }\n         \
  \       else {\n                    speed = S_MID\n                    //执行模糊计算（偏差）\n\
  \                    //控制使得左右传感器的密度差为 0\n                    fuzResult = Fuzzy(leftVal\
  \ - rightVal)\n                    led.plot(3, 4)\n                }\n         \
  \       let spLeft = speed - fuzResult\n                let spRight = speed + fuzResult\n\
  \                Restrict(spLeft, spRight)  //速度限制\n                Advance(speedLeft,\
  \ speedRight)\n                basic.pause(timeTable[Timer.PERIOD]) //控制周期\n   \
  \             for (let n = 0; n < 4; n++)\n                    led.unplot(n, 4)\n\
  \            }\n            break\n        case Step.GOBACK: //开始后退\n          \
  \  if (CheckTimer(Timer.WAIT) == State.UP) {\n                SendRadio2(\"BACK\"\
  , leftSensor, rightSensor)\n                FallBack(S_LOW, S_LOW)    //低速后退\n \
  \               OnTimer(Timer.BACK)\n                step = Step.BACK\n        \
  \    }\n            break\n        case Step.BACK:    //后退中\n            leftVal\
  \ = leftSensor\n            rightVal = rightSensor\n            //当左侧传感器检测到道路时\n\
  \            if (leftVal > onRoad && rightVal < onRoad) {\n                MotorStop()\n\
  \                SendRadio2(\"L-ON\", leftSensor, rightSensor)\n               \
  \ speedLeft = -S_SLOW\n                speedRight = S_LOW //加速右电机\n            \
  \    Advance(speedLeft, speedRight)\n                OnTimer(Timer.BACK)\n     \
  \           led.plot(4, 4)\n                step = Step.RESTART\n            }\n\
  \            //当右侧传感器检测到道路时\n            else if (rightVal > onRoad && leftVal <\
