  md: "# Chapter 5: Text Manipulation\n\nHere’s how we could use three of the methods\
    \ available in the main Validate class, name string, email and url, to validate\
    \ the data from a form:\n\nFile: 11.php (excerpt)\n\n```\n<?php\n// Include PEAR::Validate\n\
    require_once 'Validate.php';\n\n// Include file to strip quotes if needed\nrequire_once\
    \ 'MagicQuotes/strip_quotes.php';\n\n// Initialize errors array\n$errors = array('name'\
    \ => '', 'email' => '', 'url' => '');\n\n// If the form is submitted...\nif (isset($_POST['submit']))\
    \ {\n\n  // Define the options for formatting the name field\n  $name_options\
    \ = array(\n    'format' => VALIDATE_ALPHA . VALIDATE_SPACE,\n    'min_length'\
    \ => 5\n  );\n\n  // Validate name\n  if (!Validate::string($_POST['name'], $name_options))\
    \ {\n    $errors['name'] = ' class=error';\n  }\n\n  // Validate email\n  if (!Validate::email($_POST['email']))\
    \ {\n    $errors['email'] = ' class=error';\n  }\n\n  // Validate url\n  if (!Validate::url($_POST['url']))\
    \ {\n    $errors['url'] = ' class=error';\n  }\n}\n?>\n```\n\nFirst, we include\
    \ PEAR::Validate and my own code that handles magic quotes. Then, having tested\
    \ to see that the form was submitted, we call the validate methods to check fields.\
    \ The first check is to see if the name field is a string containing only letters\
    \ from the alphabet or space characters, and at least five characters long (this\
    \ was defined by the $name_options array).\n\n160\n\nwww.it-ebooks.info"
