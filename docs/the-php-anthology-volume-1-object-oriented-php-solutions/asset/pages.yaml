  md: '# Chapter 4: Files


    to a file, which is very similar to connecting to a database; the process uses
    the fopen function to "connect", and fclose to "disconnect". Using fopen, the
    value returned is a PHP file pointer, known as the handle of the file. When you
    use fopen to connect to a file, you must specify the path to the file and a mode
    in which the file is to be accessed, such as r for read


    ```

    // Open a file for reading

    $fp = fopen($filename, ''r'');

    ```


    The various modes available are explained in the manual[2].


    # The Binary File Modifier


    Unlike Linux, Windows differentiates between binary and ASCII files. An additional
    modifier, b can be used to identify binary files to PHP, so that they are dealt
    correctly with Windows.


    ```

    // Open a binary file for reading

    $fp = fopen($filename, ''rb'');

    ```


    Even if the code you''re writing is currently used on a Unix-based system, it''s
    worth implementing the b modifier for binary files to ensure portability.


    The dread function could be used in older versions as a substitute for file_get_contents:


    ```

    <?php

    // Variable to store the location of the file

    $location = ''demo/writeSecureScripts.html'';


    // Open the file handle for reading

    $fp = fopen($location, ''r'');


    // Read the complete file into a string

    $file = fread($fp, filesize($location));


    // Close the file handle

    fclose($fp);


    echo $file;

    ?>

    ```


    > [2] http://www.php.net/fopen'
