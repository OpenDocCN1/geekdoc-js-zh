    \ 'October' => 10,\n    'November' => 11,\n    'December' => 12\n);\n\nforeach($months\
    \ as $name => $num) {\n    $dateMath = new DateMath(2023, $num, 1, 0, 0);\n  \
    \  echo $name . ' has ' . $dateMath->daysInMonth() . ' <br/>';\n}\n?>\n```\n\n\
    This helps me remember that:\n\nJanuary has 31 days\nFebruary has 28 days"
