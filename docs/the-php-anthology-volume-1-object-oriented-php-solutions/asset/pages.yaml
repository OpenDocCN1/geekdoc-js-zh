    # # How do I display charts and graphs with PHP?


    Displaying data in graphical form is a powerful way to communicate with your site''s
    visitors, and help yourself understand exactly how your site is being used. The
    graphs could show anything from your monthly site traffic statistics (as seen
    in Volume II, Chapter 4), to reports of sales made on your site.


    A number of projects extend PHP''s basic capabilities to render images, allowing
    data to be displayed as some form of graph or chart. First and foremost is the
    excellent JpGraph library[4], a project written in PHP that makes full use of
    the GD library and PHP''s image functions. Then to provide a detailed examination
    is the scope of this book. Over IMAX in size, the documentation is excellent,
    and offers many useful examples. I''ve also recommended some further reading at
    the end of this chapter. Here, however, I''ll be showing you how to display bar
    and pie charts from the same set of data.


    Be aware that JpGraph is licensed for noncommercial use (make sure you read the
    licensing information on the site). The version used is 1.11. The code here also
    assumes you''ve added the jgraph/src/ directory to your PHP include path, to allow
    the JpGraph class files to be loaded.


    +   [4] http://www.aditus.nu/jgraph/index.php'
