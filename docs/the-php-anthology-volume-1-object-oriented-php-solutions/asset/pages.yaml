    # FULLTEXT Searches


    MySQL provides an alternative that does most of the work for you—FULLTEXT

    index. Indexes in a database are much like the index of a book; they provide a\means
    to locate information within the database quickly from an organized list.

    AEXT index allows you to search a table for particulars.


    FULLTEXT indexes were introduced to MySQL with version 3.23. The implement-\ation
    at this point here was fairly limited but still useful for basic searching, which
    is

    what I''ll demonstrate here. In MySQL 4.0.1, this functionality was extens-

    ed to a full Boolean search mechanism that gives you the ability to build

    some like Google™''s advanced search features. FULLTEXT indexes also

    result to be returned with a “relevance” value so that, for example, the results

    of multiple word searches can be displayed in terms of how well each result

    matches your user''s particular search.


    To take advantage of FULLTEXT, you first need to instruct MySQL to

    begin an index of the columns you want to search:


    ```

    ALTER TABLE articles FULLTEXT art_search (title, body, author)

    ```


    Once you''ve done that, you need to INSERT a new record (or modifying an existing

    one) to get MySQL to build the index. You also need at least three records in

    t database for FULLTEXT searches to work, because non-Boolean searches will

    only return results if the search occurred in less than 50% of the rows in'
