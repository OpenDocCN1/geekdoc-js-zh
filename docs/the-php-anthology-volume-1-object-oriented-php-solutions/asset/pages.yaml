    # Backslashes and the ANSI SQL Standard


    Note that using the backslash as an escape character is not standard ANSI SQL.
    If MySQL is the only database you''ll ever use, the backslash may be acceptable,
    but the same SQL statement run on another database may fail. According to ANSI
    SQL we should escape apostrophes with another single apostrophe: ''PHP\''


    ```

    INSERT INTO articles SET title=''PHP\''s Greatest Hits'';

    ```


    The question is, how do we make sure our apostrophes are escaped when we build
    a query on the fly in PHP? Dealing with this situation has become rather confusing
    due to the number of alternative solutions:


    +   - We have the php.ini setting magic_quotes_gpc. Magic quotes are a feature
    of PHP which, when turned on, automatically escapes single and double quotes,
    as well as backslashes and null characters in incoming GET, POST and cookie variables,
    by adding backslashes to the strings. This may sound great, but in practice it
    quickly makes for trouble, typically where forms are involved.


    Say you have a form which is used for editing articles. Your script takes the
    user enters and inserts it into MySQL. Now, if the user fails to complete some
    information, you might need to re-display the details that have been entered in
    the form so far. With magic quotes you''d have to strip out all the slashes it
    added to the values (with PHP''s stripslashes!)


    Then, if you wanted to run the code on a server where magic_quotes_gpc is disabled?
    You would have to check it to see if magic quotes is switched on and bypass the
    use of stripslashes. Headaches are inevitable, and if you make a mistake and end
    up with spurious backslashes stored in your database, you may have a painful cleanup
    ahead of you.


    Magic quotes are discussed in some detail in Chapter 1. If you do switch off magic_quotes_gpc
    as I advise, you should be aware of the potential risks to security. See the section
    "SQL Injection Attacks" below and Appendix C.


    > It continually amazes how many professionally designed sites fail to handle
    character escaping properly! Keep an eye out for unexpected backslashes in your
    own Web travels. See Chapter 1 for my advice on how to deal with your own sites.'
