    Another handy way to get around is to "short cut" to functions by passing the
    name of the topic you are interested in via the URL. For example, try entering
    the following in your browser''s address field: http://www.php.net/strings. This
    will take you to http://www.php.net/manual/en/ref/strings.php, which is the main
    page for the Strings extension. Looking at this page, you''ll see a list of all
