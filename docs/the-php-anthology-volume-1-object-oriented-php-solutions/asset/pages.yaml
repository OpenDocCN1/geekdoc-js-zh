    # Form Fields and HTML Content


    We have another catch in dealing with HTML form elements that should be prepopulated
    with a value—perhaps one that''s taken from a database.


    Imagine you have a form that allows users to edit the details of their account
    with your site, such as the “profile” page that comes in online forums. In the
    form there''s a field that allows users to modify their “nickname.” The field
    might look something like this:


    ```

    <input type="text" name="nickname" value="<?php $nickname; ?>">

    ```


    The value of the $nickname variable would come from your database. If the user
    has a nickname “Joe Bloggs” there’s no problem. The final HTML that’s delivered
    to the browser will be:


    ```

