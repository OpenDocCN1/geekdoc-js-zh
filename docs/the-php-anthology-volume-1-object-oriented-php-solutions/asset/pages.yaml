  md: '# The Top Security Vulnerabilities


    contains the session ID. In general, it''s better to handle sessions with cookies.

    If you''re working with your own cookie-based authentication, store an identifying
    session ID in the cookie only, not the user name and password.


    # Cross Site Scripting (XSS)


    By using the legitimate mechanisms your site provides, it''s possible for attackers
    to post on your site, for example, JavaScript that results in other users giving
    away your session IDs, thereby allowing the attacker to hijack your session. Less
    serious, but equally embarrassing, is simply posting HTML that "scrambles" the
    layout of your page, perhaps closing a tag tag prematurely. Use a "deny all" approach,
    or, better yet, employ a separate markup language as BasicDBObject with PHP functions
    like strip_tags and htmlentities. If you really want to allow HTML to be posted,
    consider building a filter based on PEAR::XML_HTMLSax [see Volume II, Chapter
    2).


    # Command Injection


    Command injection occurs when an attacker is able to influence the way PHP interacts
    with external systems, such as the file system or database. A SQL injection is
    an example, which occurs when an attacker uses a form or URL to modify a database
    query. This was discussed in detail in Chapter 3. The bottom line is: escape all
    data you receive from a user before you it in a query.


    # Error Handling


    An experienced attacker will be able to gain a lot of important information about
    your system from error messages. Although this comes under the heading of "security
    by obscurity" (which is no substitute for having a really secure application),
    for a live site, it''s a good idea to practice log error messages to a file, rather
    than display them to the browser. See Appendix A for details.


    # Insecure Use of Cryptography


    First of all, when it comes to cryptography, don''t roll your own. Remember that
    if it''s an algorithm that needs to be decoded, someone (other than you) is also
    capable of decoding it. Remember, strictly speaking, MD5 is not an encryption
    algorithm (i.e. you cannot decrypt an


