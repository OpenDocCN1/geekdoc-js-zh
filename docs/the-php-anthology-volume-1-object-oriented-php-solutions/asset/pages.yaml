    # How do I use FTP from PHP?


    One of the great things about PHP is the sheer amount of functionality that''s
    either built in, or is just an extension away; File Transfer Protocol (FTP) is
    no exception. Using PHP''s FTP functionality, it''s possible to have PHP scripts
    as clients to an FTP server. This can be useful for building a Web interface for
    your FTP repository, developing a tool to update your site from your PHP development
    environment. In order to use the FTP functions, you''ll need to make sure your
    host has enabled PHP''s FTP functionality (Appendix B).


    ![](img/b7e89640aa5fa679509a99b07948ad75_151_0.png)


    # FTP is Not Secure


    When you connect to a normal FTP server by any means, the user name and password
    you provide are sent in clear text to the server. This information can be read
    by someone using a packet sniffer that''s “plugged in” between you and the server
    you''re connecting to. Be sure to change your passwords regularly, and, in general,
    try to avoid FTP when a better alternative is available.


    If you have SSH access to your site and use Windows, WinSCP[6] is a good tool
    for transferring files across the secure connection.


    [6] http://winscsp.vse.cz/eng/'
