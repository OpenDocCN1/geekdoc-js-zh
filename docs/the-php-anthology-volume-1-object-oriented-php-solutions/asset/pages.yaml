    # How do I search my table?


    Some people are just impatient; rather than trawling your site with the friendly
    navigation system you''ve provided, they demand information now! Hence PHP developers
    like you and I am required to implement search features to provide visitors a
    ''short cut'' to find the information they want. In days of storing all content
    in the form of HTML files, this could be quite a problem, but now that you are
    using a database to store content, searching becomes much easier.


    # Select What You Like


    The most basic form of search occurs against a single column, with the LIKE op-rator:


    ```

    SELECT * FROM articles WHERE title LIKE ''How %''

    ```


    The % is the wildcard character. The above statement will select all articles
    in which the title begins with the word “How." MySQL also has support for POSIX
    regular'
