    # JpGraph and PHP Notices


    Depending on which version of JpGraph you are using, you may run into trouble
    if you have PHP''s error notices switched on in php.ini. The generated error messages
    can cause the graph image to fail to display. The examples in this chapter explicitly
    disable notices in order to avoid this problem. See Chapter 10 for more information
    on how to control error reporting.


    # Bar Graph


    Let''s see how you can generate a bar graph with JpGraph.


    Assuming it''s available somewhere in your include path, in this case we''ll include
    the core "engine" as well as the bar graph class. Next, we set up two arrays of
    sample data, which will be used for the X and Y axes of the graph. In a practical
    application, these might be results you''ve fetched from MySQL.


    > File: 8.php (excerpt)


    ```

    <php

    // JpGraph does not work with notices enabled

    error_reporting(E_ALL ^ E_NOTICE);


    // Include the necessary JpGraph libraries

    require_once ''jjgraph.php''; // Core engine

    require_once ''jjgraph_bar.php''; // Bar graph


    // Sample data could be a database query

    $xdata = array(''Mousem'', ''Pens'', ''T-Shirts'', ''Mugs''); // X Axis

    $ydata = array(35, 43, 15, 110); // Y Axis

    ```


    The JpGraph API is, in many cases, self-explanatory, and comes with (useful) API
    documentation. The first step in generating a graph from your data arrays is to
    set up the "foundations" of the graph itself, such as and background color.


    > File: 8.php (excerpt)


    ```

    // Set up the graph

    $graph = new Graph(400, 200, ''auto''); // Width, height

    $graph->SetMargin(40, 20, 20, 20); // Margin widths

    $graph->SetScale(''textlin''); // X text, Y linear

    $graph->SetColor(''green''); // Plot background green

    $graph->SetMarginColor(''navy''); // Margin color navy

    $graph->SetShadow(); // Use a drop shadow

    $graph->SetFrame(true, ''blue''); // Blue frame

    ```


