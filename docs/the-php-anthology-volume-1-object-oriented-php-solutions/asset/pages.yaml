  md: 'Now, let''s say that, in response to one of the options on your user control
    panel,

    you want to make some changes to the look and feel of the site. Let''s put this

    into action:


    ```

    $lookAndfeel = new LookAndFeel(); // Create a LookAndFeel

    $output = new Output($lookAndfeel); // Pass it to an Output


    // Modify some settings

    $lookAndfeel->setColor(''red'');

    $lookAndfeel->setSize(''large'');


    // Display the output

    echo $output->display();

    ```


    Using the color and size methods, we change the color to "red" and the

    size to "large," right? Well, in fact, no. The output display still says:


    Color is white and size is medium


    Why is that? The problem is that we''ve only passed a copy of the LookAndFeel

    object to $output. The changes we make to $lookAndfeel have no effect on

    t copy that $output uses to generate the display.


    To fix this we have modify the Output class so that it uses a reference to the

    LookAnd object it is given. We do this by altering the constructor:


    ```

    function Output(&$lookAndfeel)

    {

    $this->lookAndfeel = &$lookAndfeel;

    }

    ```


    Notice that we have to use the reference operation twice here. This is because

    the variable is being passed twice—first to the constructor function, then again,

    to place it in a member variable.


    Once we''ve made these changes, the display looks like this:


    Color is red and size is large


    In summary, passing by reference keeps the target variable "linked" to the source

    variable, so that if one changes, so does the other.'
