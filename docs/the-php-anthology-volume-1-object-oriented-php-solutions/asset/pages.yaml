  md: '# Chapter 9: Web Page Elements


    Array

    (


    ```

    [0] => forums

    [1] => discussion

    [2] => php

    )

    ```


    In your code, you need to have some kind of decision logic that passes the handling
    of each variable to code that knows what to do with it. In this example,


    +   From the “root” PHP script of your site (e.g. index.php), examine variable
    0 to find out which code to pass this job to. In this case, it’s the forums code.


    +   From the forums code, examine variable 1 to find out which code within the
    forum application should deal with this. In this case, it’s the discussion code.


    +   In the discussion code, examine variable 2 to find out which discussion should
    be displayed.


    In each case, the code delegates the work to some other code until it reaches
    the point where it’s time to do some real work (e.g. the discussion code performs
    a database query to select all threads in the requested discussion, and displays
    them as an HTML table).


    How you handle the delegation of work is a matter of preference and experience.
    You might simply use an include statement to load the PHP script each time a decision
    is made. More complex, but often more flexible approaches object orientation,
    the decision-making process is based on the selection of the correct class to
    deal with each step.


    Either way, this takes your website down to becoming a framework—a structured
    environment which you add the code for your applications, the framework executes
    on demand. While considering how you’ll do this, it’s worth investigating some
    of the other PHP frameworks available, such as eZ publish[16], Phrame[17] and
    Ambivalence[18] for further insight into the design issues you’ll need to take
    into account.


    +   [16] http://developer.ez.no/

    [17] http://phrame.sourceforge.net/

    [18] http://amb.sourceforge.net/'
