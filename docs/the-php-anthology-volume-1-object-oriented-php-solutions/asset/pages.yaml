    # Do I really need to write SQL?


    A good quality to possesses as a programmer is laziness—the desire to do as much
    as possible with the minimum amount of effort. Although you may not want to cite
    it as one of your strong points in a job interview, being motivated to make easier
    for yourself is a boon in developing a well developed application.


    Now that you''ve read this chapter on PHP and MySQL, I think it''s a good time
    to reveal that SQL not wrong with it, but because always causes grief. A syntax
    error in my PHP, for example, PHP will find it. But PHP won''t find errors in
    SQL statements, and MySQL error messages can be less revealing. If I am handling
    SQL in an application, I''ll spend a fair amount of time debugging—it I could
    have spent taking it easily!


    If you could avoid having to write SQL statements altogether? If you think back
    to "How do I create flexible SQL statements?", where we constructed SQL strings
    "on the fly" based on incoming variables, you may have an inkling that there would
    be some kind of generic solution to make generating SQL even easier. Well, it''s
    called PEAR::DB_DataObject[3].


    DB_DataObject is a class encapsulates the process of writing SQL statements in
    a single API. It takes advantage of the "grammar" of SQL and provides you with
    a mechanism that removes almost any need to write any SQL yourself. As an approach
    to dealing with databases, it''s usually described as a database persistence layer,
    or alternatively, by using the Data Access Objects (DAO) design pattern. You''ll
    find further discussion of the general techniques used by DB_DataObject at the
    end of this chapter.


    Here, I will provide a short introduction to DB_DataObject to get you started,
    as it''s a subject that could easily absorb a whole chapter examined in depth.
    The DB_DataObject documentation[4] on the PEAR Website should provide you


    [3] http://pear.php.net/DB_DataObject

    [4] http://pear.php.net/manual/en/package.database.db-dataobject.php'
