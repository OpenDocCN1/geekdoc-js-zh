  md: '# Chapter 1: PHP Basics


    Let''s look at the argument string haystack. This says the first argument should
    be a string value, while haystack simply names the argument so that it can be
    referred to in the detailed description. Note that the third argument is placed
    inside square brackets, which means it''s optional (i.e. you don''t have to supply
    this).


    Here''s how you could use strpos:


    ```

    <?php

    $haystack = ''Hello World!'';

    $needle = ''old'';


    // Use the strpos() function

    $position = strpos($haystack, $needle);


    echo ''The substring '' . '' in '' . $haystack . '' begins at character '' . $position;

    ?>

    ```


    Notice that I''ve used strpos similarly to the way it appears in the manual. Using
    the variables $haystack and $needle to make clear how each variable relates to
    the explanation in the manual, but you can use whatever variables you like.


    The function signature convention is used consistently throughout the manual,
    so once you''re used to it, you''ll be able to grasp quickly how to use functions
    you haven''t tried before.


