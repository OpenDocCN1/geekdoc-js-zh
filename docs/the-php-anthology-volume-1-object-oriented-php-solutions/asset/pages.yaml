  md: "# Chapter 3: PHP and MySQL\n\nthat are included in every PHP script, making\
    \ it possible to change many scripts at one time. We'll be looking at further\
    \ tricks we can employ to make life easier in a moment.\n\nThe mysql_connect function\
    \ does the work of connecting to a MySQL server. The value it returns is either\
    \ a link identifier (a value supplied by PHP to identify the connection), or FALSE,\
    \ making the connection failed.\n\n```\nif (!$dbConn = mysql_connect($host, $dbUser,\
    \ $dbPass))\n    die('Could not connect to server');\n```\n\nThis statement asks\
    \ the question \"Did I successfully connect to the MySQL server?\" If not, use\
    \ die to terminate the script.\n\nNext, we've selected the database we want with\
    \ mysql_select_db, using the same if technique:\n\n```\nif (!mysql_select_db($dbName,\
    \ $dbConn)) {\n```\n\nNote that we provided the variable to link the identifier\
    \ as the second argument to mysql_select_db. We wouldn't usually do this (the\
    \ argument is optional), but when a complex script jiggles multiple database connections,\
    \ this method can help PHP knows which you are referring to.\n\nFinally, we've\
    \ used mysql_close to disconnect from the server again:\n\n```\nmysql_close($dbConn);\n\
    ```\n\nThis occurs at the bottom of the script, once we've run some imaginary\
    \ PHP code that used the connection. Closing the connection is generally optional—PHP\
    \ automatically closes connections after the script finishes¹.\n\n> Connections\
    \ with mysql_pconnect This function establishes a persistent connection to the\
    \ database to be reused by multiple PHP scripts. Using a persistent connection\
    \ makes your scripts slightly faster, as PHP no longer has to reconnect each time,\
    \ but speed comes at a price: if your website runs on a shared server, persistent\
    \ connections monopolize that server, resulting in other sites being unable to\
    \ connect at times. In such environments, it's typical to avoid mysql_pconnect,\
    \ or configure MySQL so that connections are terminated the moment they stop doing\
    \ anything, using a short connection timeout value."
