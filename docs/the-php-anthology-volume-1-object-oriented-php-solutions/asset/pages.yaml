    ```


    But what happens if someone uses a nickname like “Joe The Hacker” Bloggs”? The
    form element will end up looking like this:


    ```

    <input type="text" name="nickname" value="Joe The Hacker" Bloggs />

    ```


    This is bad for Web browsers. At best, they’ll display a form field containing
    just the name “Joe”; at worst, they’ll scramble the page completely.


    Again, it’s PHP to the rescue! The function htmlcharacters will identify characters
    that are likely to cause problems, and convert them to a special code so that
    browsers recognize them as part of the content. The characters in'
