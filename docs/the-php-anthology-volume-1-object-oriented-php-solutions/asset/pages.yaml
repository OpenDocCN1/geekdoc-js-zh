    (File, Save As) go-pear.php. From here, you have a number of options.


    Storing go-pear.php somewhere your Web server''s document root directory will
    allow you to run the script as a Web page. This behavior is still experimental,
    though there are no guarantees it''ll work correctly. If you use this approach,
    make sure that the script is not publicly available!


    Better to execute the go-pear.php script via the command line, for example:


    ```

    /usr/local/bin/php /home/username/pear/go-pear.php

    ```


    Or, on Windows:


    ```

    c:\php\cli php c:\pear\go-pear.php

    ```


    This will start an interactive command line interface, which will ask you questions
    about how you like PEAR installed. Note that the "installation prefix" is the
    directory in which PEAR (as well as any packages you install later) will be installed,
    and is referred to as $prefix, while $php_dir is the path to your PHP installation
    (in which go-pear.php will put PEAR-related documentation by default, unless you
    specify otherwise). Windows users should be aware of


    > [8] http://www.phpbuilder.com/columns/jayesh20021111.php3


    > [9] http://www.phpbuilder.com/'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# Appendix D: Working with PEAR


    changing the installation prefix pops up a Windows "Browse" dialog box, through
    which you can specify the required directory.


    With the installation options set to your requirements, the go-pear.php script
    will connect to the PEAR website, and download all the packages required to set
    up the package manager (it also asks if you require additional packages, which
    are well worth). Packages are installed in a subdirectory of the directory you
    specified as the installation prefix (so, in the above examples you''d end up
    with c:\pear\pear or /home/username/pear/pear).


    Finally, if you let, the go-pear.php installer will attempt to modify your include_path
    in php.ini. To do this manually, assuming you used the directories above, you
    specify the following:


    ```

    include_path = ":/home/username/pear/pear*

    ```


    For Windows users, the path is as follows:


    ```

    include_path = \;c:\pear\pear*

    ```


    Finally, to use the PEAR package manager from the command line, you need to set
    up environment variables. For Windows users these can be automatically added to
    your Windows registry by right clicking on the file PEAR_ENV.reg and choosing
    Run. They may also be manually configured as environment variables via the Windows
    Control Panel. With Unix-based systems can configure them to be up every time
    you log in, by editing the .profile in your home directory (/home/username):


    ```

    # Enviment variables

    export PEAR_PEAR_SYCONF_DIR=/home/username

    export PEAR_PEAR_INSTALL_DIR=/home/username/pear/pear

    export PEAR_PEAR_DOC_DIR=/home/username/pear/pear/docs

    export PEAR_PEAR_BIN_DIR=/home/username

    export PEAR_PEAR_DATA_DIR=/home/username/pear/pear/data

    export PEAR_PEAR_TEST_DIR=/home/username/pear/pear/tests

    export PEAR_PEAR_PHP_BIN=/local/bin/php

    ```


    Finally, you need to add the PEAR command line script to your system path, which,
    on Windows, can be achieved through the System Control Panel application (on the
    Advanced tab, click Environment Variables), by appending: c:\pear to the PATH.


    On Unix-based systems, adding the following to your .profile script:


    ```

    export PATH=$PATH;/home/username/pear

    ```'
  merge: -1
  pgno: 378
- img_proc: true
  md: 'Once you''ve done all that, you''re ready to move on and use the package manager
    in one of its many incarnations.


    # The PEAR Package Manager


    Assuming you set PEAR correctly, you can now use the command line interface to
    the PEAR package manager to install packages. For example, from the command line,
    type:


    ```

    pear install HTML_Common

    ```


    That will install the package HTML_Common from the PEAR Website. The package names
    for the command line are the same as on the Website.


    The PEAR Package Manager uses XML_RPC to communicate with the PEAR Website. If
    you''re behind a proxy server or firewall, you will need to tell the PEAR domain
    name of the proxy server:


    ```

    pear config-set http_proxy.your-isp.com

    ```


    To unset the variable at later stage, simply use:


    ```

    pear config-set http_proxy ""

    ```


    Now to add QuickForm to the installed PEAR packages, you simply need to type:


    ```

    pear install HTML_QuickForm

    ```


    Should another release of QuickForm be made after you''ve installed it, you can
    upgrade the version with:


    ```

    pear upgrade HTML_QuickForm

    ```


    If, for some reason, you later decide you don''t need QuickForm anymore, you can
    remove it using:


    ```

    pear uninstall HTML_QuickForm

    ```


    For a list of all PEAR commands, simply type pear.


    Now, if you don''t like command lines, there''s also an (experimental) Web-based
    front end to PEAR (as well as a PHP-GTK front end, which is the scope of this
    discussion). To use it, you first need to install it from the command line'
  merge: -1
  pgno: 379
- img_proc: true
  md: '# Appendix D: Working with PEAR


    (note that if you executed go-pear.php through your Web server, the Web-based

    front end is also installed for you). Type the following commands:


    ```

    pear install Net UserAgent_Detect

    pear install Pager

    pear install HTML_Template_IT

    pear install PEAR_Frontend_Web

    ```


    Note the first three packages are required by PEAR_Frontend_Web. With that

    done, you can launch the front end from your Web server using the following

    simple script:


    ```

    <php

    // Optional if include path not set

    # ini_set(''include_path'', ''c:\htdocs\PEAR'');


    require_once ''PEAR.php'';


    // For Windows users

    # $pear_user_config = ''c:\windows\pear.ini'';

    // For Unix users

    $pear_user_config = ''/home/username/pear/pear/pear/pear.conf'';


    $HTML = TRUE; // Switch off for older browsers


    require_once ''PEAR/WebInstaller.php'';

    ?>

    ```


    # Installing Packages Manually


    It''s possible to install packages manually (although this involves more work),
    but

    it''s important to watch the include paths carefully when doing so. First of all,

    create a directory that will be the base of all the PEAR classes you need. This

    directory must be in your include path. Next, install the main PEAR packnage[11]-download
    the latest stable version and extract it directly to the directory

    you''ve created, so that PEAR is in the root of this directory.


    Installing further packages can be completed in more or less the same fashion,

    but need to be careful which directory you extract to. For example, looking

    at PEAR::DB, the main DB.php file goes alongside the PEAR file in the root

    of the PEAR class directory, while further PEAR::DB-related files go in the sub-\irectory
    DB. The best way to check is to look at the package.xml file that comes


    > [11] http://pear.php.net/package/PEAR'
  merge: -1
  pgno: 380
- img_proc: true
  md: with every PEAR package. This contains an element called filelist, which lists
    all the files contained in the package and the location at which they should be
    installed. For each file, check the baseinstalldir attribute which, if specified,
    tells you where, relative to the root PEAR class directory, the file should be
    placed. The name attribute specifies the path and filename relative to the baseinstalldir
    (or just the root PEAR class directory if there's no baseinstalldir attribute),
    where each file should be placed.
