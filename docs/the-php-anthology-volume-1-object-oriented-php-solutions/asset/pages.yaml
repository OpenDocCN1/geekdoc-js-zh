  md: '# How do I repair a corrupt table?


    Although it shouldn''t happen, occasionally data stored in MySQL becomes corrupted.
    There are a number of (rare) circumstances where this can happen; Windows is particularly
    susceptible as it doesn''t have the robust locking mechanism of Unix-based systems.
    With heavy loads, on which INSERT and UPDATE queries are common alongside SELECTs
    are also likely to suffer occasional corruption. Assuming you are using the MyISAM
    table type (you''ll be this unless you''ve specified otherwise), there''s good
    news; in general, you should be able to recover all the data in a corrupt table.


    Note that the information provided here represents a quick reference for times
    when you need help. It''s worth reading the MySQL manual on Disaster Prevention
    and Recovery[2] so that you know exactly what you''re doing.


    MySQL provides two important utilities to deal with corrupt tables, as well as
    a handy SQL syntax for those who can get to the MySQL command line.


    First, the error utility can be run from the command line to give a rough idea
    of what MySQL error codes mean. The utility should be available from the bin subdirectory
    of your MySQL installation. Typing error 145, for example, will tell you:


    145 = Table was marked as crashed and should be repaired


    From the command line, you can then use the utility myisamchk to check the database
    files themselves:


    ```

    myisamchk /path/to/mysql/data/table_name

    ```


    To repair a corrupt table with myisamchk, the syntax is as follows:


    ```

    myisamchk -r /path/to/mysql/data/table_name

    ```


    Using SQL, you can also check and fix tables using a query like this:


    ```

    CHECK TABLE articles

    ```


    And this:


    > [2] http://www.mysql.com/doc/en/Disaster_Prevention.html'
