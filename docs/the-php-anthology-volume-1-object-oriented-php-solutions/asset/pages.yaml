  md: '# Do I really need to write SQL?


    with plenty of further help. The version used here was 1.1; note that it requires
    that you have the PEAR::DB database abstraction layer installed (see Appendix
    D for more information on installing PEAR libraries).


    The first step in getting started with DB_DataObject is to point it at your database
    and tell it to generate the DataObject that will constitute your interface with
    the tables. DB_DataObject automatically generates your database, MySQL''s introspection
    functionality, and generates a class for each table in the database, as well as
    a configuration file containing the details of the columns defined by the table.
    To let DB_DataObject know where your database can be found, you need to provide
    it a configuration file like this:


    File: db_dataobject.ini


    ```

    [DB_DataObject]

    ; PEAR::DB DSN

    database = mysql://harry:secret@localhost/sitepoint

    ; Location where sitepoint.ini schema file should be created

    schema_location = /htdocs/php/PHPL/ExampleApps/DataObject

    ; Location where DataObject classes should be created

    class_location = /htdocs/php/PHPL/ExampleApps/DataObject

    ; Prefix for including files from your code

    require_prefix = ExampleApps/DataObject

    ; Classes should be prefixed with this string e.g. DataObject_User

    class_prefix = DataObject

    ; Debugging information: O=off, 1=display sql, 2=display results,

    debug = 0

    ; Prevent SQL INSERT, UPDATE or DELETE from being performed

    debug_ignore_updates = false

    ; Whether to die of error with a PEAR_ERROR_DIE or not

    dont_die = false

    ```


    The above file follows the same formatting as php.ini. Most important is the first
    line, which is a PEAR::DB DSN string that defines the variables needed to connect
    to the database. This file is used both to generate the DataObject classes and
    to use them in performing queries.


    With that in place, we can use this script (which must be run from the command
    line) to generate the classes:


    File: 22.php


    ```

    <<?php

    // Builds the DataObjects classes

    $_SERVER[''argv''][1] = ''db_dataobject.ini'';

    ```


