  md: 'In the above script, weve called directly PHP''s MySQL functions, which act
    on the variables we pass to them. This generally results in our getting back a
    new variable with which we can perform further work.


    An object oriented approach to solving the same problem might look like this:


    ```

    <?php

    // OOP Example


    // Include MySQL class

    require_once ''Database/MySQL.php'';


    // Instantiate MySQL class, connect to MySQL and select database

    $db = new MySQL(''localhost'', ''harify'', ''secret'', ''sitepoint'');


    // Perform a query selecting five articles

    $sql = ''SELECT * FROM articles LIMIT 0,5'';

    $result = $db->query($sql); // Creates a MySQLResult object


    // Display the results

    while ($row = $result->fetch()) {

    // Display results

    }

    ?

    ```


    The detail of dealing with MySQL using PHP''s MySQL functions has now been delegated
    to an object thats created from the MySQL class (which we''ll use throughout this
    book, which is constructed in Chapter 3). Although this example may not entirely
    clear the advantages of OOP, given that, in terms of the amount of code, it is
    very similar to the first example, what it does is that some of the original script''s
    complexity is now being taken care of by MySQL class.


    For example, we no longer need to perform two steps to connect to the MySQL server,
    and select a database; rather, we can handle both steps in one when we create
    the MySQL object. Also, should wish to have the script fetch the results from
    a different database, as PostgreSQL, we could use the relevant class provided
    the same application programming interface (API) as the MySQL class—and, to do
    so, we d only need to change a single line of the above example. We''ll do exactly
    that in Volume II, Chapter 7.


    The object oriented approach really shows in situations in which objects interact
    with each other. I''ll leave further discussion of that to the solutions in this
    chapter, but it''s an important concept. As you become fluent in object ori'
