    document. The class will automatically determine whether you''ve placed HTML in
    the body of the message and set the correct MIME headers accordingly. You can
    also add an alternative text message and, by using AddEmbeddedImage, you can place
    an attached image in the body of the HTML message.


    Putting it all together in a single example, here''s what we get:


    ```

    <?php

    // Include the phpmailer class

    require ''ThirdParty/phpmailer/class.phpmailer.php'';


