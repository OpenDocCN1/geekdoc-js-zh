  md: 'The most obvious way to change the filename that appears in the URL is to rename
    the file; that is, we could simply rename the script .php to article. Of course,
    without the .php extension, Apache has no way of knowing that the file is a PHP
    script. By default, it will simply send the unparsed PHP code to the browser—definitely
    not what we want!


    To correct this we need to tell Apache to treat the file as a PHP script. This
    can be done easily with a .htaccess file, but first you need to make sure Apache
    is configured to allow it. If you''re working on your own server, you simply need
    to ensure that AllowOverride is set to All in Apache''s httpd.conf file. If you''re
    working with a Web host, you''ll need to ask them to do the honours. Once that''s
    done, drop the following code into a file named .htaccess, save it in the same
    directory as the script you to rename:


    ```

    <Files article>

    ForceType application/x-httpd-php

    </Files>

    ```


    This directive tells Apache to treat the file named article as a PHP script. Simple,
    right?


    To try this out, check the forctype directory in the code archive for this chapter.
    I''ve set it up with a script called article and a .htaccess file that identifies
    it as a PHP script. Here''s the code for article:


    ```

    <?php

    // Include the PathVars class

    require_once ''Url/PathVars.php'';


    // Create Instance of PathVars

    $PathVars = new PathVars($_SERVER[''SCRIPT_NAME'']);


    echo ''This is the article script<br/>'';


    if ($PathVars->fetchIndex(0)) {

    echo ''The article ID is '' . $PathVars->fetchIndex(0);

    }?

    ```


    Try loading it with an article ID in the URL suffix (e.g. http://www.example.com/phpanth/WebPageElements/forctype/article/123).
    If Apache is cor-'
