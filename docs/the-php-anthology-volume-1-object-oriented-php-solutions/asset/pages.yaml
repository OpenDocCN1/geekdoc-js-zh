  md: '# 10 Error Handling


    In Chapter 1, I introduced PHP’s in-built error handling mechanism, and we discussed
    that errors in general are usually broken into four basic types:


    +   - Syntax Errors: The script fails to obey the basic language rules of PHP
    and cannot be executed.

    - Semantic Errors: In executing the code, PHP encountered a situation that is
    illegal in terms of the “grammar” of PHP, such as passing a string to a function
    that expects an array.

    - Environment Errors: A problem has been encountered in the environment used by
    the PHP script during execution, such as the MySQL server being unavailable.

    - Logic Errors: The script executes correctly as far as the PHP engine is concerned,
    but does not what the designer expects.


    In this chapter, we''ll look at the mechanisms PHP provides to extend the native
    error reporting mechanism and give you greater control over how errors are handled.
    The benefit of these mechanisms is generally realized in dealing with environment
    errors; the mechanisms provide your code the opportunity to'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'gracefully exit execution, and allow you to hide errors from your site’s visitors
    while receiving notifications of the errors.


    # Error Handling in PHP 5


    The soon-to-released PHP 5 will include a new error handling mechanism that should
    radically improve the errors are handled in PHP 4. PHP 5 will provide a try-catch
    control structure that''s common to languages such as Java. It''s worth keeping
    in mind that this change is on the horizon, so that you can easily modify your
    code when the time comes. These modifications might simply involve a search and
    replace operation for all instances where you used trigger_error. Or perhaps they''ll
    be more elaborate, passing all calls to trigger_error through a single function
    you define yourself, which will allow you to switch to the new mechanism for generating
    errors simply by modifying that function.


    # How do I implement a custom error handler with PHP?


    By now you''re probably well acquainted with PHP''s native error reporting: possibly
    you''re acquainted with it more closely than you''d like, thanks to syntax errors.
    PHP 4 provides for generating and handling errors mechanisms that you can control;
    these are described in the PHP Manual[1]. Being able to generate your own error
    messages allows you to add additional error reporting to your application, helping
    you track down problems and bugs after they occur. Meanwhile, the ability to create
    your own error handler allows you to log error messages and control the output
    delivered to your site''s visitors.


    # Error Levels


    Once a PHP script has been parsed to rule out syntax errors, PHP can generate
    three categories of error while running a script:


    +   Errors: fatal errors that result in PHP halting further execution of the script

    Warnings: general environment errors from which PHP can recover


    [1] http://www.php.net/errorfunc'
