  md: '# Chapter 7: Images


    Thanks to patent issues with GIF images[2], support for this format in the GD
    library ceased in version 1.6. It is possible to find old versions of the GD library
    online using it may put you in the line of fire from Unisys or IBM. What makes
    life even more entertaining is that the GD library only began to support for the
    PNG format (a free alternative to GIF supported by newer browsers) in version
    1.6. In these examples, I''ll assume you have GD version 2.0 (which is bundled
    with the latest versions of PHP) with Freetype, JPEG, and PNG support built in.


    The good news is the patent on the GIF format expires in 2004, so hopefully we''ll
    see GIF support return to the GD library soon. Until then, it''s worth regarding
    the PNG format as the preferred alternative. PNG is capable of supporting 32-bit
    images, compared with GIF''s 8 bits. In addition, PNG uses a more efficient compression
    algorithm, reducing the amount of bandwidth used when comparing an 8-bit PNG with
    an 8-bit GIF.


    # MIME Types


    MIME stands for Multipurpose Internet Mail Extensions, a standard originally conceived
    to help identify different content types. MIME has since the de facto standard
    for describing content types on the Internet. When you deal with images in PHP,
    it''s important to have a grasp of the different content types, or you may end
    up struggling for hours with a simple problem.


    In general, before you send requested content to the browser, your server must
    announce the content type using a special Content-Type header, so the browser
    knows what to do with the content. For example, here are the headers that a server
    might send to announce an image in Portable Network Graphics (PNG) format:


    ```

    HTTP/1.1 200 OK

    Date: Fri, 28 Mar 2003 21:42:44 GMT

    Server: Apache/1.3.27 (Unix) PHP/4.3.1

    Last-Modified: Wed, 26 Feb 2003 01:27:19 GMT

    Content-Length: 1164

    Connection: close

    Content-Type: image/png

    ```


    > [2] http://www.gnu.org/philosophy/gif.html'
