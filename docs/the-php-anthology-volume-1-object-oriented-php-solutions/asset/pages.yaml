    The mail reading functionality of PEAR::Mail_Mime is a "work in progress", but
    you can make your life easier by reading email with its Mail_mimeDecode class.


    This example achieves the same objectives as the previous script, but the code
    is much simpler:


    ```

    #!/usr/bin/php

    <?php

    // Include the PEAR mimeDecode class

    require_once ''Mail/mimeDecode.php'';


    // Read the email from the stdin file

    $fp = fopen(''php://stdin'', ''r'');

    $email = fread($fp, filesize(php://stdin));

    close($fp);


    $code = new Mail_mimeDecode($email, "\r\n");

    $structure = $code->decode();


    // Forward the message to the hotline email

    if (strpos($structure->headers[''from''], ''vip@example.com'')) {

    mail(''youyourdomain.com'', ''Urgent Message!'',

    Check your mail!'');

    }

    ```


    The variable $structure contains a data structure with all the key elements of
    the email provided in a named form. For example, $structure->headers[''from'']
    contains the "From" address of the message.


