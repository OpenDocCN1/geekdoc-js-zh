  md: '# Chapter 4: Files


    # How do I create compressed ZIP/TAR files with PHP?


    Perhaps you have a directory that contains many files, or different types of files,
    as well as subdirectories. There may be situations in which you need to create
    a download of the whole directory that preserves its original structure. The command
    line approach to achieving this on Unix-based systems is to create an "archive"
    file such as .tar file (.tar files are "Tape Archives" and were originally conceived
    to help back up a system onto tape), and then compress that file with gzip or
    bzip2. If you had a directory called mywork you wanted to store as a single compressed
    file, you might enter the following into the command line:


    ```

    tar cvf mywork.tar ./mywork

    gzip mywork.tar

    ```


    This gives you a file mywork.tar.gz. To unzip and extract the file you could:


    ```

    gunzip mywork.tar.gz

    tar xvf mywork.tar

    ```


    This recreates the directory below your current working directory. Note that you
    can perform the above examples in a single line on a typical Linux distribution,
    if you use the ''z'' flag to compress tar zcvf mywork.tar.gz ./mywork and extract
    tar xvzf mywork.tar.gz.


    Using PHP''s system function, you could execute these commands from a PHP script,
    assuming your web server has permissions to use the tar and gzip/bzip2 executables
    (which probably won''t). How would you create archives from data stored in your
    database, or from nodes in an XML document for that?


    Thanks to PEAR::Archive_Tar[10], it''s all possible. The basic functionality allows
    you to build .tar files provided you have the zlib or b2 extensions installed,
    you can also compress the file.


    Let''s create an archive from some of the files we were working with earlier in
    the chapter:


    > [10] http://pear.php.net/Archive_Tar'
