  md: '# Appendix A: PHP Configuration


    # Table A.1. Key Security and Portability Settings


    | Setting | Notes |

    |---| register_globals (default: off) | Automatically creates global variables
    from incoming HTTP request variables, as GET and POST. For security and portability,
    it is highly recommended to switch this off. See http://www.php.net/register_globals
    for more details. |

    | magic_quotes_gpc (default: off) | Automatically escapes quotes in incoming request
    variables with a backslash, helping prevent SQL injection attacks. If you know
