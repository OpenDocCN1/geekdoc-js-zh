  md: "# # How do I display data in a table?\n\nHTML tables are the natural result\
    \ of much of PHP's interaction with data stored in MySQL databases. Having a tool\
    \ in your kit for quick table generation is an essential time as you build PHP\
    \ applications.\n\nThe simplest approach to generating a table using the MySQL\
    \ class I built in Chapter 3 might look like this:\n\n```\n$db = &new MySQL($host,\
    \ $dbUser, $dbPass, $dbName);\n$sql = \"SELECT * FROM user ORDER BY lastName,\
    \ firstName\";\n$result = $db->query($sql);\necho \"<table align=\\\"center\\\
    >\\n\";\necho \"<tr><th>Login</th><th>Name</th><th>Email</th></tr>\\n\";\n\nwhile\
    \ ($row = $result->fetch(\n)) {\n  echo \"<tr>\\n\";\n  echo \"<td>\" . $row['login']\
    \ . \"</td>\\n\";\n  echo \"<td>\" . $row['firstName'] . \" ' ' . $row['lastName']\
    \ . \"</td>\\n\";\n  echo \"<td>\" . $row['email'] . \"</td>\\n\";\n  echo \"\
    </tr>\\n\";\n}\necho \"</table>\";\";\n```\n\nIt's fine for simple things, this\
    \ method can become a burden as tables grow more complex.\n\n# ## PEAR Shaped\
    \ Tables\n\nThe task of building more complex tables is made easier by PEAR::HTML\
    \ Table[1]. Developed by Bertrand Mansion and Adam Daniel, HTML_Table provides\
    \ a handy API for table construction that doesn't require you to type a tag of\
    \ HTML. For complex tables, this can save a lot of time, and reduce your chance\
    \ of making mistakes with HTML itself. The version used here was 1.5.\n\n> [1]\
    \ http://pcar.php.net/HTML_Table"
