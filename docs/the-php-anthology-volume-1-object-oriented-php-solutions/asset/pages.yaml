- img_proc: true
  md: 'The Content-Type header is used to specify the MIME type of the content on
    the current URL. In this case, the MIME type is image/png, which signifies a PNG
    image.


    Where this becomes important in PHP is when we''re generating an image from a
    PHP script. By default, PHP scripts send a MIME type of text/html (an HTML document).
    So, in instances when your script is sending an image instead of HTML, you''ll
    need to specify the MIME type using PHP''s header function.


    ```

    <?php

    header(''Content-Type: image/png'');

    ?>

    ```


    The MIME types you''ll need for images are outlined in Table 7.1.


    | Image File Interchange Format | MIME Type |

    |---|---|

    | JPEG (.jpg) | image/jpeg^1 |

    | Portable Network Graphics (.png) | image/png |

    | Graphics Interchange Format (.gif) | image/gif |

    | Windows Bitmap (.bmp) | image/bmp |

    | Scalable Vector Graphics (.svg) | image/xml+svg


    > ^1Internet Explorer understands the image/jpeg type, but when uploading a JPEG
    image it sends a type of image/pjpg.


    # # How do I create thumbnail images?


    If your site allows images to be uploaded, perhaps for display with submitted
    content, how can you make sure the images displayed will be of a suitable size?
    If a user uploads a particularly large image, it might destroy the layout of the
    page when it''s displayed. One solution is to create thumbnail images, which guarantee
    that the images displayed never exceed a certain height and width.


    Building a basic thumbnail is a five stage process:


    +   1. Load the source image into a PHP variable.'
