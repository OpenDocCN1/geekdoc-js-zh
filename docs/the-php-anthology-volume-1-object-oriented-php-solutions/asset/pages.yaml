  md: '# About The Author


    Harry is a technical writer, programmer, and system engineer. He has worked in
    corporate IT since 1994, having completed a Bachelor’s degree in Physics. He first
    came across PHP in 1999, while putting together a small Intranet. Today, he''s
    the lead developer of a corporate Extranet, where PHP plays an important role
    in delivering a unified platform for numerous back office systems.


    In his off hours he writes technical articles for SitePoint and runs phpPatterns
    (http://www.phppatterns.com/), a site exploring PHP application design.


    Originally from the United Kingdom, he he now lives in Switzerland. In May, Harry
    became the proud father of a beautiful baby girl who keeps him busy all day (and
    night!)


