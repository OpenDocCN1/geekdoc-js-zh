  md: '# How do I include one PHP script in another?


    Having discovered that writing thousand-line scripts may not be the best way to
    stay organized, you''re probably looking for ways to break your code into separate
    files. Perhaps, while using someone else''s Open Source application, you find
    yourself struggling to eliminate error messages like the one below:


    ```

    Fatal error: Failed opening required ''script.php''

    ```


    # Mutual Inclusion


    PHP provides four commands that allow you to add the contents of PHP script to
    another, namely include, require, include_once and require_once. In each case,
    PHP fetches the file named in the command, then executes its contents. The difference
    between include and require is the way they behave should they be unable to find
    the file they were told to fetch.


    include will generate a PHP warning message like this:


    ```

    Warning: Failed opening ''script.php'' for inclusion

    ```


    This will allow the script that called the include command to continue execution.


    By contrast, require results in a fatal error like the one shown above, which
    means the calling script will terminate, bringing everything to a halt. If the
    file that was required is critical to your application, having the script terminate
    is a very good thing.


    The include_once and require_once behave similarly to their respective commands,
    but if the script has already been included or required anywhere (by any of the
    four commands), the statement will be ignored. At glance, it may not be obvious
    how these commands can be used; surely you''ll know how many times you''ve used
    an include command, right? Where the_once becomes extremely handy is in more complex
    applications in which you have PHP scripts that include other PHP scripts, which
    in turn include yet more PHP scripts. This is particularly important when you
    use libraries of classes (which we will explore in Chapter 2), and those classes
    are being reused by many scripts. One class may depend on another being available;
    using a require_once to include'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'the required class ensures it will always be available, yet causes no problem
    if the class happens to have been used elsewhere.


    To see all in action, let''s make a script include_me.php:


    File: include_me.php


    ```

    <?php

    // include_me.php

    echo ''I\ve been included!<br />'';

    ?>

    ```


    Every time this script is included it will display the message "I''ve been included!
    so we know it''s worked.


    Now, lets the various ways we can include this file in another script:


    File: 5.php


    ```

    <?php

    // This works fine

    echo '' <br />Requiring Once: '';

    require_once ''include_me.php'';


    // This works fine as well

    echo '' <br />Including: '';

    include ''include_me.php'';


    // Nothing happens as file is already included

    echo '' <br />Including Once: '';

    include_once ''include_me.php'';


    // This is fine

    echo '' <br />Requiring: '';

    require ''include_me.php'';


    // Again nothing happens - the file is included

    echo '' <br />Requiring once again: '';

    require_once ''include_me.php'';


    // Produces a warning message as the file doesn''t exist

    echo '' <br />Include the wrong file: '';

    include ''include_wrong.php'';


    // Produces a fatal error and script execution halts

    echo '' <br />Requiring the wrong file: '';

    ```'
