- img_proc: true
  md: '# Chapter 1: PHP Basics


    Alternatively, we can enter the full path to another.php, like this:


    ```

    ```include ''/home/username/www/another.php'';```

    ```


    The PHP configuration file php.ini also contains the directive include_path. This
    allows you to specify directories from which files can be included, without the
    need to specify their locations when using one of the commands.


    This approach needs to be used with caution, as it may lead to strange results
    if an included file of the same name exists in more than one directory, yet it
    can be an effective means to solve include-related headaches. PHP''s PEAR[25]
    class library, for example, relies on using the directory that contains PEAR''s
    files to the include path. Note also it''s not a good idea to specify too many
    locations in your include path, as this will slow PHP when it tries to find the
    scripts you''ve included in your code.


    If you use Apache in a shared hosting environment, you may be able to override
    the value of include_path using a .htaccess file. Placed in the directory to which
    you want to apply it (it will also apply to all subdirectories), the file should
    contain something like this:


    ```

    ```php_value include_path ":/usr/local/lib/php:/home/user/phplib/```

    ```


    The same can be accomplished with the PHP function ini_set, for example:


    ```

    ```ini_set(''include_path'', ''C:/phplib/'');```

    ```


    This allows changes to be made at runtime within a PHP script.


    You''ll find a reference to php.ini values in Appendix A.


    # How do I write portable PHP code?


    Not all PHP installations are the same. Depending on version and configuration
    settings in php.ini, your script may or not run correctly on another server where
    PHP is installed. However, there are some good practices you can adopt to make
    life easier and minimize the need to rewrite code for other servers.


    > [25] http://pear.php.net/'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Keep All Configuration Central


    For most PHP applications, it will be necessary to provide information describing
    the environment in which the script will run, including database user names and
    passwords, directory locations, and so on. As a general rule, try to keep the
    majority of this information in a single place—maybe even a single file—so that
    when the information needs to be modified, you can do it in all the place. That
    said, when building modular applications, you may want to store elements of the
    configuration that are local to a specific "module" with the module itself, rather
    than centrally.


    How exactly you choose to store this information is a matter of personal choice.
    In some cases, it may be worth considering an XML file or storing some of the
    information in a database. It''s also worth being aware of the `parse_ini_file`
    function, which I''ll explore in Chapter 4.


    A simple but effective mechanism is to place all the settings in a single file
    as PHP constants, which makes them available from any function or class in your
    application. For example:


    ```

    <?php

    // Configuration settings

    define(''DOMAIN'', ''sitepoint.com'');


    // In another script

    echo ''The domain is '' . DOMAIN;

    ```


    Constants need to be used with caution, though. To make your functions and classes
    reusable in other applications, they shouldn''t depend on constants of a fixed
    name; rather, they should accept configuration information as arguments from a
    central configuration file, which you can pass to functions and classes as required.
    If you look at Chapter 3, when connecting to MySQL we can identify a number of
    variables we need to have in a central location: the server host name, the user
    name, the password, and the name of the selected database.


    Using the `require_once` command we looked at in the previous solution, we can
    create a file called, for instance, `config.php`, and place it outside the public
    Web directories. This helps ensure that no accidentally browses to the file containing
    this critical information, which would place the site''s security at risk.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Use the Full <?php ?> Tags


    PHP supports a variety of tags to mark up sections of PHP code, including the
    short tags (<? ?>), and ASP-style tags(< % %). These are controlled by php.ini
    with the settings short_open_tag and asp_tags. While you have these settings set
    to On, other people may not. The short tag style, for example, causes a problem
    when the PHP is mixed with XML documents, use processing instructions like this:


    ```

    <?xml version="1.0"?>

    ```


    If we have a document which contains PHP and XML, and we have the short_open_tag
    turned On, PHP will mistake the XML processing instruction <?php for a PHP opening
    tag.


    It''s possible that your code will need to run in environments where short_open_tags
    and asp_tags are both off. The best way to ensure that they are to get into the
    habit of using the <?php ?> tag style, otherwise there may be a lot of code rewriting
    to do in some dark future.


    # register_globals


    PHP is capable of turning incoming data into native PHP variables. This feature
    is controlled by the register_globals setting in php.ini. With register_globals
    switched on, if I point my browser at an address like http://www.mysite.com/index.php
    PHP will automatically create a variable $logged_in and assign it the value of
    1. The PHP now recommends this setting be disabled because it presents a risk
    to security, the previous example suggests.


    So, in php.ini make sure the code is in place:


    ```

    register_globals = Off

    ```


    This will force you to access incoming data via the predefined superglobal variables
    (e.g. $_GET[''username'']), which means they won''t conflict with variables you''ve
    created in your script.


    Using a .htaccess file with Apache, the same result can be achieved with the following
    code:


    ```

    php_flag register_globals off

    ```'
  merge: -1
