    # How do I deal with time zones?


    Ever since Britannia ruled the waves, the world has been encountered with the

    problem that all time is centered on an area of London called Greenwich. Now\home
    to the National Maritime Museum, Greenwich is home to a dimly

    lit pub where you''ll find it a good idea not to mention you''re out of town.


    Using longitude terminology, time zones operate east and west around the globe,

    and measure many hours before or after Greenwich the sun reaches its

    highest point in the day. The fact that no one sees the sun in Greenwich

    appnever deterred early sailors, who used clocks set to Greenwich Mean

    Time (GMT) to work out how east or west they''d travelled around the globe.

    days, GMT is also referred to as coordinated universal time (UTC), Zulu

    time, universal time, or simply world time.


    Dealing with time zones is also problematic as today''s Web developer as

    it was the early explorers, and it requires some effort to make sure you get it

    right. Maybe the country in which your site is hosted is in a different time

    to the one in which you''re based. You may also need to allow visitors to set
    their

    own time zone, so your site can adapt time-sensitive content accordingly.


    Your host should provide you with a server that''s configured correctly and provides

    you with a time value that''ll be able to use PHP''s date and time

    functions. The server should also be accurately configured for the time zone in

    it it resides. You can check these values with PHP''s date function, as shown

    here:


