    be confronted with text in the line feeds have been stripped out and replaced
    with br tags. If users were expecting to edit HTML, they may be very confused.
    Converting the br elements back to line feeds is a possibility, but adds complexity
    and confusion to your code.


    By applying nl2br only at the point at which content is displayed to an user,
    after it has been fetched from your database, you''ll avoid many head-aches.


    In some cases, it may be acceptable to remove parts of a string as you insert
    into the database, as is the case with the strip_tags function (see below), but
    it''s usually better to avoid reformatting the string until you need to render
    it for a browser.


    # Tag Stripping


    If you allow your site to be updated by the general public, being able to use
    HTML is important in preventing visitors posting markup that interferes with your
    site''s layout.


    The PHP function strip_tags handles most of this job almost perfectly. Given some
    text, strip_tags will eliminate anything that looks like an HTML tag. To be more
    exact, what strip_tags does remove any block of text that begins with < and ends
    with >. Everything else the tags is left exactly as it was. Here''s a simple example:'
  merge: -1
