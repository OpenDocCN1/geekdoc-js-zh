    The content-disposition header tells the browser to treat the file as a download
    (i.e. not to display it in the browser window), and gives it the name of the file.
    The content-type header also tells the browser what type of file you are sending;
    in most cases, this should be chose to match the type of file you are sending;
    however, Internet Explorer 5 and Opera browsers have a bad habit of displaying
    recognized files in the browser regardless of the content-disposition header,
    so we set the MIME type to the made-up value application/x-download for those
    browsers. Finally, the content-length header tells the browser the size of the
    file, so that it''s able to display a download progress bar.


    # Send HTTP Headers First


    > Remember that headers must be delivered before any other content is sent to
    the browser.


    Be aware that PHP''s output control functions can be helpful, as they let you
    send to the browser in the right order: you can "hold" content already sent out
    by PHP while letting the headers pass. Volume II, Chapter 5 for further details
    on output control.


    Now that delivery of the file is under your control, you can fit this functionality
    into your authentication system, for example, to control who can download the
    file.


    # File Distribution Strategy


    One of the Internet''s unsolvable problems is how best to distribute files from
    a Website. If you sell artwork in JPEG format, for example, how will you handle
    the process of accepting payments from customers and letting them download only
    the image they paid for? How can you make sure they don''t redistribute the images
    they buy? How many times will customers be allowed to download an image they''ve
    paid for?


    136'
