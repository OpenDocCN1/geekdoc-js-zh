  md: "# Chapter 10: Error Handling\n\n```\n<?php\nerror_reporting(E_ALL); // Report\
    \ all errors\nerror_reporting(2047); // Report all errors\nerror_reporting(0);\
    \ // Turn off error reporting\n?>\n```\n\nGenerally, you won't need to change\
    \ the error levels beyond the examples above.\n\n# Which Error Reporting Level?\n\
    \nWhen developing your code, set the error level to its highest value, E_ALL (or\
    \ 2047). This will inform you of all errors. In particular, it will display notices\
    \ that help you find uninitialized variables—the source of many logic error. This\
    \ error level will also ensure maximum portability for others using your code,\
    \ who may prefer to run PHP at this level and not see all error messages generated\
    \ by your work.\n\nThe best way to set this error level is in php.ini, using the\
    \ error_reporting setting. If this is not possible, the next best solution is\
    \ to use a .htaccess file with the following command:\n\n```\nphp_value error_reporting\
    \ 2047\n```\n\nHowever you do it, it's important to apply the setting globally\
    \ to all your code.\n\nRemember, too, the simple fact that you've told PHP not\
    \ to report errors doesn't mean they aren't happening! Be careful when developing\
    \ code and use full error reporting.\n\nAn important thing not to note is that\
    \ the error reporting applies to the built-in PHP error handler, not to error\
    \ handlers you define yourself (which we'll be looking at shortly). In other words,\
    \ you can switch off error reporting as far as the default PHP reporting mechanism\
    \ is concerned, while still catching errors with an error handler you have defined\
    \ yourself.\n\nOne more mechanism that is available for controlling error is the\
    \ error suppression operator, which can be used to suppress error messages generated\
    \ by PHP functions and expressions. For example:\n\n```\n<?php\n// Use error reporting\
    \ operator\nif (!@mysql_connect('localhost', 'wronguser', 'wrongpassword')) {\n\
    \    echo 'Error connecting to MySQL Server: ' . mysql_error();\n}\n```"
