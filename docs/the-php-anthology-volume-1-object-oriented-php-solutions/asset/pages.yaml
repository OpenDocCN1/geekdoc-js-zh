  md: '# Guidelines for Dealing with Forms


    +   Use the POST method when declaring your form in HTML. This prevents form values
    from appearing in the URL, and allows a larger amount of data to be submitted
    through the form.


    +   Use PHP''sspecialchars when populating form fields with PHP values, to avoid
    malformed HTML, as discussed in Chapter 5.


    +   Don''t rely exclusively on JavaScript validation. It can improve the user
    experience, but older JavaScript validation can be easily bypassed by the user.


    +   If use normal HTTP, data will be sent in "clear text" over the Internet. This
    means it can be intercepted by someone using a packet sniffer. When you send confidential
    information such as financial details, use an encryption technology such as SSL.


