  md: "```\n/**\n * Provides the number of days in the month\n * @return int number\
    \ of days in the month\n * @access public\n */\nfunction daysInMonth() {\n   \
    \ return date('t', $this->timeStamp);\n}\n```\n\nWe simply rely again on the PHP\
    \ date function to do the hard work, but it's good to have this method available\
    \ from our class—this makes it a complete solution for common date-related problems.\n\
    \nLet's put it to the test:\n\n```\n<?php\n// Include DateMath class\nrequire_once\
    \ 'DateTime/DateMath.php';\n\n$months = array(\n    'January' => 01,\n    'February'\
