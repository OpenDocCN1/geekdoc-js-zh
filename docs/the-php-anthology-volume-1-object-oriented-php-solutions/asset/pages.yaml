  md: "The easiest way to see how inheritance works in PHP is by example. Let’s say\
    \ we have this simple class:\n\n```\n<?php\nclass Hello {\n    function sayHello()\
    \ {\n        return 'Hello World!';\n    }\n}\n```\n\nUsing the extends keyword,\
    \ we can make a class that's a child of Hello:\n\n```\nclass Goodbye extends Hello\
    \ {\n    function sayGoodbye() {\n        return 'Goodbye World!';\n    }\n}\n\
    ```\n\nGoodbye is now a child of Hello. Expressed the other way around, Hello\
    \ is the parent or superclass of Goodbye. Now, we can simply instantiate the child\
    \ class and have access to the sayHello and the sayGoodbye methods using a single\
    \ object:\n\n```\n$msg = &new Goodbye();\necho $msg->sayHello() . '<br />';\n\
    echo $msg->sayGoodbye() . '<br />';?>\n```\n\nThat example shows the basics of\
    \ how inheritance works, but doesn’t demonstrate its real power... This comes\
    \ with the addition of overriding.\n\n# Overriding\n\nWhat happens when we give\
    \ a function in the child the same name as a function in the parent? An example:"
