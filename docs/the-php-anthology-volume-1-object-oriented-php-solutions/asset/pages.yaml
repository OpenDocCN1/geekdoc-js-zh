  pgno: 280
- img_proc: true
  md: "var $totalPages;\n\n```\n/**\n * The row MySQL should start its select with\n\
    \ * @access private\n * @var int\n */\n```\n\nvar $startRow;\n\n```\n/**\n * SimplePager\
    \ Constructor\n * @param int number of rows per page\n * @param int total number\
    \ of rows available\n * @param int current page being viewed\n * @access public\n\
