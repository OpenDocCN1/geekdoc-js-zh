  md: '# Chapter 3: PHP and MySQL


    ```

    $sql = "SELECT * FROM articles ORDER BY title";

    ```


    It''s handy to keep it in a separate variable, as when we get into writing complex
    queries and something goes wrong, we can double-check our query with this one-liner:


    ```

    echo $sql;

    ```


    +   2. Next, tell MySQL to perform the query:


    ```

    $queryResource = mysql_query($sql, $dbConn);

    ```


    This can be confusing at first. When you tell MySQL to perform a query, it doesn''t
    immediately give you the results. Instead, it holds the results in memory until
    you tell it what to do. PHP keeps track of the results with a resource identifier,
    which is what you get back from the mysql query function. In the code below, we''ve
    stored the identifier in $queryResource.


    +   3. Finally, use mysql_fetch_array to fetch one row at a time from the set
    results:


    ```

    while ($row = mysql_fetch_array($queryResource, MYSQL_ASSOC))

    ```


    This places row of the results in turn in the variable $row. Each of these rows
    will be represented by an array. By using the additional argument MYSQL_ASSOC
    with mysql_fetch_array, we''ve told the function to give us an array in which
    keys correspond to column names in the table. If you omit the MYSQL_ASSOC argument,
    each column will appear twice in the array: once with a numerical index (i.g.
    $row[0], $row[1], etc.), and once with a string index (i.g. $row[''title''], $row[''author''],
    etc.). While this doesn''t usually cause a problem, specifying the type value
    you want will speed up things slightly.


    Using a loop, as shown above, is a common way to process each row of the result
    set in. The loop effectively says, "Fetching rows from MySQL until I can''t get
    any more", the body of the loop processing the rows as they''re fetched.


    # Forego Buffering on Large Queries


    ![](img/b7e89640aa5fa679509a99b07948ad75_94_0.png)


    For large queries (that is, queries that produce large result sets), you can improve
    performance dramatically by telling PHP not to buffer the query. When a query
    is buffered, the entire result set is retrieved from MySQL and stored in memory
    before your script is allowed to proceed. An'
