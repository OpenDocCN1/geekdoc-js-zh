    # How do I back up my database?


    The bigger a database becomes, the more nerve wracking it can be not to have a
    backup of the data it contains. What if your server crashes and everything is
    lost? Frankly, MySQL comes with two alternatives: a command line called mysqldump,
    and a query syntax for backing up tables.


    Here''s how you can export the contents of a database from the command line with
    mysqldump:


    ```

    mysqldump -uharryf -psecret sitepoint > sitepoint.sql

    ```


    This command will log in to MySQL as user "harry" (-uharryf) and output the contents
    of the sitepoint database to a file called sitepoint.sql The contents of sitepoint.sql
    will be a series of queries that can be run against MySQL, perhaps using the mysql
    utility to perform the reverse operation from the command line:


    ```

    mysql -uharryf -psecret sitepoint < sitepoint.sql

    ```


    Using the PHP function system, you can execute the above command within a PHP
    script you need to be logged in and able to execute PHP scripts from the command
    line). The following class puts this together in a handy PHP form that you can
    use to keep regular backups of your site.


    > /** * MySQLDump Class/** * Backs up database, creating a file for each day of
    the week, using the mysqldump utility. / * Can compress backup file with gzip
    of bzip2 / * Intended for command line execution in conjunction with cron / *
    Requires the user executing the script has permission to execute mysqldump. *
    <`code` **


    File: Database/MySQLDump.php (in SPLIB)


