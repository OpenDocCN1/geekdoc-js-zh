    \n# PHP does not cascade constructors\n\n![](img/b7e89640aa5fa679509a99b07948ad75_72_0.png)\n\
    \nMost object oriented languages, like Java, will run the constructor of the parent\
    \ class atomically, before running an overriding constructor in the child class.\
    \ This is cascading constructors—it's a feature that PHP does not have.\n\nIf\
    \ you create a constructor in a child class, be aware that you are completely\
    \ overriding the parent class's constructor, and that you must explicitly it from\
    \ your new constructor if you still want the parent class to handle its share\
