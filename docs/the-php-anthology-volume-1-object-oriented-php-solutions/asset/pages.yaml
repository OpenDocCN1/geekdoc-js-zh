  md: "Further information can be found in the PHP manual[26], and in Kevin Yank's\
    \ article, Write Secure Scripts with PHP 4.2![27] on SitePoint.\n\n# Magic Quotes\n\
    \n**Magic quotes** is a feature intended to help prevent security breaches in\
    \ sites developed by PHP beginners.\n\nIt adds **escape characters** (see Chapter\
    \ 5 for more information) to incoming URL query strings, from posts, and code\
    \ data automatically, *before* your script is able to access any of these values.\
    \ Should you insert the data directly into your database, there's no risk of someone\
    \ being able to tamper with the database magic quotes functionality is switched\
    \ on.\n\nFor beginners, this is certainly a useful way to prevent disasters. However,\
    \ once you understand **SQL injection attacks**, and have developed the habit\
    \ of dealing with them in your code, the magic quote functionality can become\
    \ more of a problem than it's worth.\n\nMagic quotes functionality is controlled\
    \ by a PHP configuration setting, `magic_quotes_gpc`, which can be either on or\
    \ off.\n\nMy preference is to always have magic quotes switched off, and escaping\
    \ for SQL statements myself. Unfortunately, this means the code I won't port well\
    \ to PHP installations where magic quotes are switched on (I'll end up with backslashes\
    \ in my content). Frankly, to deal with this problem, PHP provides the function\
    \ `get_magic_quotes_gpc`, which can be used to find whether magic quotes are switched\
    \ on. To keep the code in this portable book, I'll use a simple file that strips\
    \ magic quotes, the functionality to be enabled:\n\n```\n<?php\n/**\n * Checks\
    \ for magic_quotes_gpc = On and strips them from incoming\n * requests if necessary\n\
    \ */\nif (get_magic_quotes_gpc()) {\n  $GET = array_map('stripslashes', $_GET);\n\
    \  $POST = array_map('stripslashes', $_POST);\n\n```\n\n[26] http://www.php.net/registerglobals\n\
    [27] http://www.sitepoint.com/article/758"
