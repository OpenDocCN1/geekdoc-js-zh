    ?>\n</h2>\n<p><a href=\"<?php echo $baseUrl; ?>?category=PHP\">PHP</a></p>\n<p><a\
    \ href=\"<?php echo $baseUrl; ?>?category=MySQL\">MySQL</a></p>\n<p><a href=\"\
    <?php echo $baseUrl; ?>?category=CSS\">CSS</a></p>\n<body>\n</html>\n```\n\nAs\
    \ you can see, the controlling logic looks above for a $_GET['category'] variable.\
    \ If it exists, it creates an instance of CategoryHeader, displaying the navigation\
    \ to allow users to find their way back to the home page. If it doesn't exist,\
    \ it creates an instance of the parent StandardHeader instead, which applies when\
    \ users view the home page (and therefore does not require breadcrumbs to find\
    \ their way back).\n\nIn other words, inheritance allows us to add the extra functionality\
    \ we need without having to reproduce the logic that already resides within the\
    \ parent class; the existing methods and logic can be reused for the child subclass.\n\
    \nInheritance provides a powerful mechanism to make classes that are modular,\
    \ addressing a specific problem while still making shared methods and variables\
    \ can be used irrespective of the specific object we're dealing with.\n\n# Avoid\
    \ Deep Inheritance Structures\n\nAs a general rule of thumb, using inheritance\
    \ to build class hierarchies, avoiding deeper than two generations.\n\n![](img/b7e89640aa5fa679509a99b07948ad75_75_0.png)"
