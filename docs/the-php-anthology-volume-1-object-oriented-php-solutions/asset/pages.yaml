    # How do I build effective navigation with PHP and MySQL?


    A solid navigation system is one of the most critical elements of a Website. Get
    it right, and you''ll have visitors surfing away for hours. Get it wrong, and
    you may find yourself making a cameo appearance at http://www.webpagethastuck.com/.
    The good news is that this is well-trodden ground; the ingredients for making
    a successful navigation system have been clearly defined.


    Here, we''ll learn how to put together two of the most solid and widely used types
    of navigation for a hierarchical category structure: crumb trail and the tree
    menu.


    Note that the approach to database structuring that I''ve used is known as the
    adjacency list model. This approach is perhaps the easiest to understand and is
    widely used. Often, it''s not the best way to store hierarchical information in
    a database, because extensive processing is required to analyze the data and reconstruct
    the tree. If you need to store large quantities of hierarchical data, a better
    model is the modified preorder tree traversal model (also known as nested sets),
    described in the article Storing Hierarchical Data in a Database[11].


    PEAR::Tree[12] provides a useful class for dealing with nested sets. See the section
    called "Further Reading" at the end of this chapter for more information.


    # Hansel and Gretel


    Crumb trail navigation is designed to help users understand where they are within
    a site, and help them get back to where they came from. You''ve probably seen
    crumb trail navigation somewhere on the Internet; if you visit SitePoint''s


    +   [11] http://www.sitepoint.com/article/1105

    [12] http://pear.php.net/Tree'
