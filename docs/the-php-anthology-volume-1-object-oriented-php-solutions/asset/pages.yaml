  md: '# Chapter 6: Dates and Times


    ```

    echo ''1st Jan 1902'': . mktime(0, 0, 0, 1, 1902) . ''<br />;

    echo ''1st Dec 1969'': . mktime(0, 0, 0, 12, 1969) . ''<br />;

    echo ''1st Jan 1970'': . mktime(0, 0, 0, 1, 1970) . ''<br />;

    echo ''1st Jan 2037'': . mktime(0, 0, 0, 1, 2037) . ''<br />;

    echo ''1st Jan 2038'': . mktime(0, 0, 0, 1, 2038) . ''<br />;

    echo ''19th Jan 2038'': . mktime(0, 0, 0, 19, 2038) . ''<br />;

    echo ''20th Jan 2038'': . mktime(0, 0, 0, 20, 2038) . ''<br />;

    ?

    ```


    Depending on your operating system, and particularly on Windows, this may generate
    a range of different PHP warnings.


    Another thing to be aware of Unix timestamps is that they vary in length; in January
    2, 1970 will obviously be shorter than a contemporary timestamp. When placing
    Unix timestamps in your database, a column size of 10 (INT) should be more than
    enough to keep your application running for the next 270+ years (assuming it''s
    not running on a 32-bit operating system, course).


    # MySQL Timestamps


    MySQL timestamps are simpler than Unix timestamps. The generalized form is YYYY-MM-DD
    HH:MM:SS and is typically stored in a column of type DATETIME (note also the column
    types DATE and TIME, which store only YYYY-MM-DD and HH:MM:SS respectively).


    For simple sorting and comparison operations, timestamps in this form are perfect
    and they have the advantage of being human-readable. They have a predictable length
    (until we get to the year 9999), which makes them easier to validate.


    On the downside, you''re still stilled with problems when it comes to more complicated
    date-related operations. If you would group data on a weekly basis, for example
    You''ll probably end converting the MySQL timestamp to a Unix timestamp to achieve
    this, and such conversions can significantly down an application that handles
    large sets of data.


    Personally, of the two timestamps, I prefer to use Unix timestamps to store information
    in MySQL. Of course, I plan to be retired and fishing when 2038 comes around,
    but I''ll provide examples of both here, and leave the choice to you.'
