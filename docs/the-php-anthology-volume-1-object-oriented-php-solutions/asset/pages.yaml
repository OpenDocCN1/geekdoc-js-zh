  md: "Next, we have the PHP function addslashes. Applied to any string, addslashes\
    \ will use backslashes to escape single quotes, double quotes, backslashes and\
    \ null characters. This makes it an effective means to escape strings for use\
    \ in queries.\n\nIf magic quotes are, of course, you must not use addslashes,\
    \ or characters would be escaped twice! To solve this conflict, you can check\
    \ if magic quotes is enabled with the function get_magic_quotes_gpc, which returns\
    \ TRUE if magic quotes is enabled and FALSE if it isn't. You can bundle this test\
    \ with a function as follows:\n\n```\n<<?php\nfunction safeAddSlashes($string)\n\
    {\n    if (get_magic_quotes_gpc()) {\n        return $string;\n    } else {\n\
    \        return addslashes($string);\n    }\n}\n?>\n```\n\nThe third way, which\
    \ is very similar to addslashes, uses the function mysql_escape_string or mysql_real_escape_string\
    \ (the latter was added in PHP 4.3.0) which uses the underlying MySQL C+ API (provided\
    \ by the developers of MySQL, rather than the developers of PHP) to escape special\
    \ characters.\n\nThese functions escape null characters, line feeds, carriage\
    \ returns, backslashes, single quotes, double quotes, and end-of-file characters.\
    \ Since PHP 4.3.0, both functions have used the current character set for the\
    \ connection between PHP and MySQL. There is, therefore, no difference between\
    \ these functions in the latest PHP versions, so free to stick with the shorter\
    \ of the two, mysql_escape_string, if your server is up-to-date.\n\nAs this method\
    \ is effect, in the built-mechanism provided by MySQL escaping strings, I recommend\
    \ it over addslashes or magic_quotes_gpc. Of course, if you want your SQL to port\
    \ well to other databases, you may want to consider \"hiding\" the function within\
    \ a class method, which allows you to swap out the class—including the escape\
    \ mechanism—when moving to a different database."
