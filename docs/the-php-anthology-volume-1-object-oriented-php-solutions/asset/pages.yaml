    # Be Sure it''s an Upload


    Perhaps you have a more complicated script in which you passed the temporary name
    to another PHP variable, performed various tricks, and then forgot you''d left
    a hole in your code—a hole that allowed a user to modify the contents of the PHP
    variable with a different file name! It''s worth using the function is_uploaded_file
    to double-check that the uploaded file really is the right one before you do anything
    with it, such as copying it to a public where others others see it. In the past,
    people have tricked PHP scripts into copying a file containing a password, rather
    than the image that was actually uploaded, to a public directory. Be safe, rather
    sorry.


