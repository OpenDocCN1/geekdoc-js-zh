  md: "# Chapter 2: Object Oriented PHP\n\n# Polymorphism\n\nAnother powerful aspect\
    \ of object oriented programming is polymorphism—the ability of different classes\
    \ to share an interface.\n\nAn interface is one or more methods that you use a\
    \ class for a particular purpose. For example, you could have two database connection\
    \ classes—one for MySQL and one for PostgreSQL. As long as they offered a query\
    \ method, you could use them interchangeably for running queries on different\
    \ databases. The query method is a simple interface that the two classes share.\n\
    \nThe classes sharing the same interface are often inherited from a parent class\
    \ that makes the common methods available. Again, this is best understood by example.\n\
    \nFirst, we define an abstract base class, Message, which provides the common\
    \ method get(). Beneath the Message class, we define concrete classes, each of\
    \ which creates a specific message.\n\nThe terms \"abstract\" and \"concrete\"\
    \ refer to class usage, in particular, whether a class is intended to be used\
    \ directly or not. An abstract class is one in which some functionality or structure\
    \ is to be shared by all subclasses, but is not intended to be used directly;\
    \ typically, it has one or more empty methods that don't do anything useful. A\
    \ concrete class is a subclass of the abstract class from which you can create\
    \ objects. Some languages, like Java, provide support for abstract classes within\
    \ the language syntax—PHP 4 doesn't offer. You can still use the concept of abstract\
    \ classes when designing applications, you might consider adding documentation\
    \ to tell other developers working with the code that the class is abstract.\n\
    \n```\n<?php\nclass Message {\n    var $message;\n    function setMessage($message)\n\
    \    {\n        $this->message = $message;\n    }\n    function getMessage()\n\
    \    {\n        return $this->message;\n    }\n}\n```\n\nFile: 14.php (excerpt)\n\
    \nwww.it-ebooks.info"
