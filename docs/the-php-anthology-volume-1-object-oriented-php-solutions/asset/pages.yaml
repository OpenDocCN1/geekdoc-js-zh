  md: '# Chapter 3: PHP and MySQL


    This allows us to access them again via the property names, as with

    $articles->title.


    Further methods are provided to make the query more complex, for example, the

    whereAdd method:


    ```

    File: 24.php (excerpt)

    // Instantiate the DataObjectArticles class

    $articles = new DataObjectArticles();


    // Assign a value to search the ''Author'' column

    $articles->author = ''Kevin Yank'';


    // Add a where clause

    $whereAdd(''published'')-> . '' mtime(0, 0, 5, 1, 2002));


    // Perform the query

    $articles->find();

    ```


    This allows us to add a condition to the WHERE clause:


    ```

    SELECT * FROM articles

    WHERE published > 102024000 AND articles.author = ''Kevin Yank''

    ```


    There are other methods, if these fail to provide what you need,

    can use the query method to execute a hard-coded query. Note that if you find

    yourself needing to use the query method, it may be a good idea to create

    subclass of the generated Data class, and wrap the query in a useful

    method name that describes it accurately.


    DB_DataObject also deals effectively with table joins, which, although slightly

    more detailed than the example above, is certain a time saver when compared

    to writing complex queries by hand.


    That concludes our short introduction to DB_DataObject, but this section should

    have given you a taste of what it can do for you. The big advantage is that

    making your database with SQL far less exhausting and error-prone. Also,

    by centering access to a particular table in a single class, it helps simplify

    dealing with changes to the table structure.


