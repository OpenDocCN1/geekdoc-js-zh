  md: "# Chapter 10: Error Handling\n\n# Generating Errors\n\nAs we saw above, there\
    \ are three error levels that you can use to report messages about errors in your\
    \ code: errors, warnings, and notices. The medium for the generation of error\
    \ messages is the function trigger_error[2], which can be placed anywhere in your\
    \ code and, on execution, will result in PHP reporting errors of the level you\
    \ specify. Your choices are E_USER_ERROR, E_USER_WARNING and E_USER_NOTICE, the\
    \ \"user\" in this sense being you—the PHP developer.\n\nHere's a simple example:\n\
    \nFile: 6.php\n\n```\n<?php\nif (!@mysql_connect('localhost', 'wronguser', 'wrongpassword'))\
    \ {\n    trigger_error('Error connecting to MySQL Server: ' . \n    mysql_error(),\
    \ E_USER_ERROR);\n}\n\necho 'Hello World!';\\?>\n```\n\nHere, we used the error\
    \ suppression operator to suppress the normal error message so we can display\
    \ a more useful message using trigger_error. The second argument we supplied to\
    \ trigger_error, which is optional, is the level at which we want the error reported;\
    \ the default is E_USER_NOTICE.\n\nIt's worth considering from a theoretical standpoint\
    \ what we've done here. The normal error level PHP would use if mysql_connect\
    \ failed would be a warning, which it regards this as an environmental error that\
    \ does not impede the running of the script. However, we suppressed the normal\
    \ warning message and increased the severity to an error. Since errors are fatal\
    \ to a PHP script, this halts PHP's execution of the script. The instruction to\
    \ echo \"Hello World!\" will not be executed in this case, yet the warning that\
    \ PHP would have normally produced would have allowed it to execute.\n\nWhy did\
    \ we do this? If the script follows the database connection attempt relied on\
    \ database connection to produce useful output, it would make much sense to let\
    \ the script continue on its merry if the database connection fails. While some\
    \ applications might be able to make do without the database connection, we can\
    \ use trigger_error to stop those that can't in their tracks.\n\n> [2] http://www.php.net/trigger_error"
  merge: -1
  pgno: 344
