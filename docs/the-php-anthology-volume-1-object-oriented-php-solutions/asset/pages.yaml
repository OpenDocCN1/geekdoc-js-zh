    # ## QuickForm Validation Rule Types


    We used the required in the above example. QuickForm comes with a number of built-in
    rules for specific situations, as well as some more general rules. The supported
    rules are:


    +   - required: the form field must be supplied a value

    - maxLength: the field value is constrained to a maximum length in characters

    - minlength: the field value must contain a minimum number of characters

    - rangelength: the field value must be exactly the specified length

    - email: the field value must be a valid email address

    - emailorblank: the field value must be a valid email address or be empty

    - lettersonly: the field value may contain only the letters ''a'' to ''z'' (case
    insensitive)

    - alphanumeric: the field value may contain only the letters ''a'' to ''z'' (case
    insensitive) or numbers


    272


