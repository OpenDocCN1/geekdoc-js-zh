  md: '# Chapter 9: Web Page Elements


    One particularly nice feature of the popular Apache server is that, when presented
    with a URL like http://www.example.com/article.php/123/4, it''s smart enough to
    recognize that article.php is the filename and everything that follows it (/123/4),
    which we will call the URL suffix. The trick, of course, is to get PHP to use
    that URL suffix and read the values contained therein.


    Fortunately, while Apache is conveniently blind to the URL suffix, PHP provides
    a few variables which can be useful to gather this information, namely $_SERVER[''PATH_INFO''],
    $_SERVER[''PATH_SELF''], $_SERVER[''REQUEST_URI''] and $_SERVER[''SCRIPT_NAME''].
    The following script demonstrates them in action:


    ```

    <?php

    // Examine some pre-defined variables

    echo $_SERVER[''PATH_INFO''] . '' @$_SERVER[''PATH_INFO''] .

    ''<br />'';

    echo $_SERVER[''PATH_SELF''] . '' @$_SERVER[''PATH_SELF''] .

    ''<br />'';

    echo $_SERVER[''REQUEST_URI''] . '' @$_SERVER[''REQUEST_URI''] .

    ''<br />'';

    echo $_SERVER[''SCRIPT_NAME''] . '' @$_SERVER[''SCRIPT_NAME''] .

    ''<br />'';

    ?>

    ```


    File: 18.php


    If you put this file on your server and load it as, say, http://www.example.com/php/WebPageElements/18.php,
    the output is:


    ```

    $_SERVER[''PATH_INFO'']: /this/is

    $_SERVER[''PATH_SELF'']: /phpanth/WebPageElements/18.php

    $_SERVER[''REQUEST_URI'']: /phpanth/WebPageElements/18.php

    $_SERVER[''SCRIPT_NAME'']: /phpanth/WebPageElements/18.php

    ```


    At first glance, variables aren''t especially inspiring. But look what happens
    when we add a URL suffix and query the string, like as http://www.example.com/phpanth/WebPageElements/18.php/is?=test:


    ```

    $_SERVER[''PATH_INFO'']: /this/is

    $_SERVER[''PATH_SELF'']: /phpanth/WebPageElements/18.php/this/is

    $_SERVER[''REQUEST_URI'']: /phpanth/WebPageElements/18.php?is=test

    $_SERVER[''SCRIPT_NAME'']: /phpanth/WebPageElements/18.php

    ```


