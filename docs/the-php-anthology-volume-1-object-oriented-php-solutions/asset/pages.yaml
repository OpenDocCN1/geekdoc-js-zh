  md: "# How do I solve common date problems?\n\nConsider the types of calculations\
    \ our brains make each time we're confronted with a calendar:\n\n> “I’d like it\
    \ finished by the 3rd of March... That’s only five days away!”\n\nIt's clear there's\
    \ more to dealing with dates than simply organizing data in order of significance,\
    \ or displaying an individual datum. In this solution, we'll look at some of the\
    \ common problems you may encounter when dealing with dates and times. In particular,\
    \ we'll see how to deal with\n\n+   - days of the week\n\n+   - weeks of the year\n\
    \n+   - days of the year\n\n+   - the number of days in a month\n\n+   - leap\
    \ years\n\nIn the process, we'll build a class that can be easily reused in your\
    \ own applications.\n\nThe following code lays the foundation for the class:\n\
    \n```\n<?php\n/**\n * DateMath class for solving common date problems\n * @package\
    \ SPLIB\n */\nclass DateMath {\n/**\n * Unix timestamp\n * @access private\n *\
    \ @var int\n */\nvar $timeStamp;\n/**\n```"
  merge: -1
  pgno: 200
- img_proc: true
  md: "# How do I solve common date problems?\n\n+   * DateMath constructor\n* If\
    \ parameters not provided, DateMath uses current time\n* `code>\n* $DateMath =\
    \ new DateMath(2003,8,22); // Uses 22 August 2003\n* $DateMath = new DateMath();\
    \ // Uses current date and time\n`\n* @param int year (e.g. 2003)\n* @param int\
    \ month (e.g. 8 for August )\n* @param int day of month (e.g. 22 )\n* @param int\
    \ hours (e.g. 15)\n* @param int minutes (e.g. 5)\n* @param int seconds (e.g. 7\
    \ )\n*/\n\n```\nfunction DateMath($y = NULL, $m = NULL, $d = NULL, $h = NULL,\n\
    $i = NULL, $s = NULL)\n{\n    $time = time();\n\n    $y = is_numeric($y) ? $y\
    \ : date('Y', $time);\n    $m = is_numeric($m) ? $m : date('m', $time);\n    $d\
    \ = is_numeric($d) ? $d : date('d', $time);\n    $h = is_numeric($h) ? $h : date('H',\
    \ $time);\n    $i = is_numeric($i) ? $i : date('i', $time);\n    $s = is_numeric($s)\
    \ ? $s : date('s', $time);\n    $this->timestamp = mktime($h, $i, $s, $m, $d,\
    \ $y);\n```\n\n+   /**\n* For setting a Unix timestamp\n* @param a Unix timestamp\n\
    * @return void\n* @access public\n*/\n\n```\nfunction setTimestamp($timeStamp)\n\
    {\n    $this->timestamp = $timeStamp;\n}\n```\n\nThe constructor checks whether\
    \ you've passed any values for a date, the arguments appearing in the order year,\
    \ month, day, hour, minute and finally second. Any parameter for which you fail\
    \ to provide a numeric value will assume the current date or time. The constructor\
    \ then turns this into a timestamp, which will make later calculations easier.\n\
    \nIf I want to begin with a timestamp, I can use the setTimestamp method to provide\
    \ my own."
