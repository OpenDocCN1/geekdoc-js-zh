  md: "# Chapter 4: Files\n\n```\n$chunk = fgets($fp);\necho $chunk;\n\n// Close the\
    \ file handle!\nclose($fp);\n?>\n```\n\nAll we had to do change the point at which\
    \ we directed the fopen function to a URL!\n\nThe problem with this approach is\
    \ that we've taken a function that is geared to the local file system and used\
    \ to access a remote Web server. fopen doesn't handle the sorts problems that\
    \ you'd typically encounter on the Internet, such as time-outs, and it fails to\
    \ provide the detailed error reporting that you may need for remote connections.\
    \ It also strips off the HTTP headers sent by the remote Web server, which are\
    \ sometimes necessary—in the case of Web services, for example—automatically takes\
    \ care of request headers, which you may need to control yourself.\n\nLet's look\
