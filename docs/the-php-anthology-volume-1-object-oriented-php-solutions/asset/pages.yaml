  md: 'Many details of MySQL''s date/time features are database-specific, and wouldn''t
    port to other databases well needed.


    Your database should be responsible for keeping track of your data, formatting
    it for display.


    You generally need to rely on MySQL''s built-in functions to perform some of the
    work when you use MySQL timestamps. Let me show you another example that suffers
    from "complex syndrome."


    Say you want to display a statistic that tell you how many days ago the last article
    was published on the site. To do this, you''d need to calculate the "distance"
    in days (as opposed to the difference) today''s date and the date on the last
    article was published. MySQL can do this for:


    ```

    SELECT TO_DAYS(NOW()) - TO_DAYS(published)

    FROM articles

    ORDER BY published DESC

    LIMIT 1

    ```


    This may look fine, but the SQL statement is gradually becoming more complicated.
    If I store the data as a Unix timestamp instead, the query would look like this:


    ```

    SELECT published

    FROM articles

    ORDER BY published DESC

    LIMIT 1

    ```


    Then, to display the result in PHP, I''d use the following:


    ```

    $daysAgo = floor((time()) - $row[''published'']) / 86400;

    ```


    86400 is the number of seconds in a day; the floor function is used to round down
    decimal to its integer value.


    Of course, you may not agree that it''s simpler to handle things in PHP, in which
    case I fully encourage you to explore MySQL''s date handling features. In the
    end, Unix timestamps and MySQL timestamps can be used to achieve the same ends;
    which you prefer is a matter of taste.'
