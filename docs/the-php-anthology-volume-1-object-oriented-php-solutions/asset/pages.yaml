  md: '# Chapter 7: Images


    +   2. Determine the height and width of the original image.

    3. Create a blank thumbnail image of the correct size.

    4. Copy the original image to the blank thumbnail.

    5. Display the thumbnail using the correct content type.


    Let''s create a thumbnail from a large version of the SitePoint logo in JPEG format:


    File: 1.php


    ```

    <?php

    // Specify source image

    $sourceImage = ''sample_images/sitepoint_logo.jpg'';


    // Specify thumbnail height and width

    $thumbWidth = 200;

    $thumbHeight = 90;


    // Load the source image

    $original = imagecreatefromjpeg($sourceImage);


    // Get the size of the original

    $dims = getimagesize($sourceImage);


    // Create a thumbnail (slightly reduced height)

    $thumb = imagecreatetruecolor($thumbWidth, $thumbHeight);


    // Copy a resized version of the original onto the thumbnail

    imagecopyresampled($thumb, $original, 0, 0, 0, 0, $thumbWidth, $thumbHeight, $dims[0],
    $dims[1]);


    // Send the content header

    header("Content-type: image/jpeg");


    // Display the image

    imagejpeg($thumb);

    ?>

    ```


    In the example above, we used imagecreatefromjpeg to load an image from the file
    system into a PHP variable. The getimagesize function tells us the width and height
    of the image (more on getimagesize in a moment).


    The imagecreatetruecolor function is used to create a blank image (in memory,
    as a PHP variable) into which the thumbnail image will be placed. Note that as


