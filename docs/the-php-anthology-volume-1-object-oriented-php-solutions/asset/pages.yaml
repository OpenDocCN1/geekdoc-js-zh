  md: "Let's see how it works with a simple example. We'll repeat the above user list\
    \ and add some attractive visuals. First, having included the HTML_Table class,\
    \ we'll build a switch statement that allows us to order the results by a particular\
    \ column:\n\n```\n// Include the PEAR::HTML_Table class\nrequire_once 'HTML/Table.php';\n\
    \n$db = &new MySQL($host, $dbUser, $dbPass, $dbName);\n\n// Basic SQL statement\n\
    $sql = \"SELECT * FROM user\"\n\n// A switch to allow sorting by column\nswitch\
    \ (@$GET['sort']) {\n  case 'login':\n    $sql = \" ORDER BY login ASC\";\n  \
    \  break;\n  case 'email':\n    $sql = \" ORDER BY email ASC\";\n    break;\n\
    \  default:\n    $sql = \" ORDER BY lastName, firstName\";\n    break;\n}\n```\n\
    \nTo use HTML_Table, you'll need to be happy with PHP's arrays; many of the arguments\
    \ accepted by HTML_Table are passed in array format. HTML attributes are typically\
    \ passed as associative (named) arrays, while row data is passed as indexed (numbered)\
    \ arrays:\n\n```\n// Overall style for the table\n$tableStyle = array(\n  'width'\
    \ => '650',\n  'style' => 'border: 1.75px dotted #800080';\n);\\n// Create the\
    \ table, passing the style\n$table = new HTML_Table($tableStyle);\n\n// Define\
    \ a style for the caption of the table\n$captionStyle = array(\n```"
