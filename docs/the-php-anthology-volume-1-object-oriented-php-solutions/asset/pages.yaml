  md: '# Error Levels


    Notices potential problems that PHP doesn’t really care about, but

    which may reflect bugs in your code


    An understanding of this categorization will prove useful when it comes to generating
    your errors.


    The error reporting level determines which of the above categories of error will
    cause PHP to display an error message. The default error reporting level for a
    PHP installation is set by the error_reporting option in php.ini. For example,
    setting it to E_ALL tells PHP to report all error types:


    ```

    error_reporting = E_ALL

    ```


    Except for this special case, telling PHP to use a particular error level will
    see PHP reports from that only; the levels must be combined using bitwise operators
    if you use PHP to report multiple error types. For example, to report all error
    types except notices, the setting is often configured as follows:


    ```

    error_reporting = E_ALL & -E_NOTICE

    ```


    You can determine the current error reporting level within a PHP script using
    the error_reporting function:


    ```

    <php

    echo error_reporting();

    ?>

    ```


    This will display the current level as an integer (e.g. 2047 for E_ALL). You can
    also set the error level using the error_reporting function. For example:


    ```

    <php

    error_reporting(E_ALL ^ E_NOTICE); // Report all except notices

    echo error_reporting(); // Displays 2039

    ?>

    ```


    In the example, we tell PHP to report all errors except notices, using the bitwise
    XOR operator, ^, to subtract the E_NOTICE error level from the E_ALL error level.


    Some other illustrative examples follow:'
