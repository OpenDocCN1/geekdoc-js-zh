  md: "# A Basic Connection\n\nHere is a MySQL database connection in its simplest\
    \ form:\n\n```\n<?php\n$host = 'localhost'; // Hostname of MySQL server\n$dbUser\
    \ = 'harry'; // Username for MySQL\n$dbPass = 'secret'; // Password for user\n\
    $dbName = 'sitepoint'; // Database name\n\n// Make connection to MySQL server\n\
    if (!$dbConn = mysql_connect($host, $dbUser, $dbPass)) {\n    die('Could not connect\
    \ to server');\n}\n\n// Select the database\nif (!mysql_select_db($dbName, $dbConn))\
    \ {\n    die('Could not select database');\n}\n\necho 'Connection successful!';\n\
    // ... some code here using MySQL\n\n// Close the connection when finished\nmysql_close($dbConn);\n\
    ```\n\nIt's important to remember that MySQL is a separate server program, like\
    \ Apache. These servers may run on the same physical computer (hence our use of\
    \ $host = 'localhost'; in the above example) it's also possible to connect to\
    \ MySQL on a remote computer, for example $host = 'anothercomputer.com'; To make\
