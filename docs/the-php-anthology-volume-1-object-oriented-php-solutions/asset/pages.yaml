  md: '# How do I add a watermark to an image?


    Another common problem you may have to solve is how to watermark an image, that
    is, how to place some identifying image or text to show that you own the copyright.
    With the GD library and PHP, it''s a snap!


    If you have a logo or other identifiable graphic with a transparent background,
    you can easily place this over another image:


    ```

    <?php

    // Load the original image

    $image = imagecreatefrompng(''sample_images/mysql_logo.png'');


    // Get image width

    $iWidth = imagesx($image);


    // Allow transparent images...

    imagealphablending($image, true);


    // Get the watermark image

    $watermark = imagecreatefrompng(''sample_images/sitepoint_watermark.png'');


    // Get the height and width

    $wmWidth = imagesx($watermark);

    $wmHeight = imagesy($watermark);


    // Find the right far position

    $xPos = $iWidth - $wmWidth;


    // Copy the watermark to the top right of original image

    imagecopy($image, $watermark, $xPos, 0, 0, 0, $wmWidth, $wmHeight);


    // Send the HTTP content header

    header(''Content-Type: image/png'');


    // Display the final image

    imagejpeg($image);

    ?>

    ```


    The process is simply a matter of loading the original image and switching on
    alpha blending (drawing transparency), so that images with transparent back-'
