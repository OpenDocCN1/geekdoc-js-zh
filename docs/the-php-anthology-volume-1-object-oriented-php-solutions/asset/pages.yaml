    It''s well worth browsing the file system for "goodies" in an idle mode.


    PHP provides fairly functions for handling files, but better is to use PEAR::File
    This provides an even simpler API for reading files and allows you to take advantage
    of other PEAR classes for performing tasks like finding a file in a file system
    and modifying an .htaccess file. PEAR can be found at the PEAR Website[4]; the
    version used here was 1.0.3 (see Appendix D for instructions on how to install
    PEAR).


    One particularly useful feature of PEAR::File is it allows files to be locked
    while they are being read, which means you won''t suffer conflicts when two people
    work on the file at the same time. PEAR::File also deals with errors nicely.


