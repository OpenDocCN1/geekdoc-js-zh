  md: '# Chapter 10: Error Handling


    E_USER_NOTICE to display on all pages of your site a message that states, “At
    1PM today the site will be down for ten minutes due to routine maintenance.”


    errors triggered at these levels may not be the only errors generated when your
    application executes. The PHP-generated error types, E_PARSE, E_ERROR, E_WARNING,
    and E_NOTICE will also be “in force” unless you specifically disable them, or
    suppress them with the suppression operator. This means you can distinguish between
    “PHP level” errors and “application level” errors, which helps make error handling
    flexible.


    # Custom Error Handler


    Now that you’re acquainted with PHP’s error levels and seen the trigger_error
    function in action, it’s time to look at how to implement a custom error handler.


    PHP provides you with the ability to specify your own error handler with which
    you can catch errors and respond to them as you choose, perhaps displaying a friendly
    message to your site''s visitors while updating an error log with a detailed message
    for your site''s administrators. The mechanism that allows you to do this is a
    PHP function that will be used as a callback–function that will be called automatically
    by PHP. With the function defined, we instruct PHP to use the error handler with
    the set_error_handler[3] function, which takes as its argument the name of your
    custom error handling function. Note that it is possible to use class methods
    as custom error handlers but the code required to do this is a pretty ugly hack,
    so we will avoid using such cases in case.


    Be warned that you cannot handle errors that cause PHP to halt immediately, the
    E_PARSE and E_ERROR levels. The E_ERROR level would be used in circumstances where
    PHP has run out of available memory (parsing a huge XML document with the DOM
    extension) and is forced to halt immediately. As E_PARSE—well, you weren’t editing
    a file on a live web server, you?


    Here’s a simple example of a custom error handler geared to deal with an E_USER_ERROR:


    [3] http://www.php.net/set_error_handler'
