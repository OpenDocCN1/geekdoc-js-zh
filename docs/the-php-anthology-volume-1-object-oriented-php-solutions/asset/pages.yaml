  md: "# Chapter 5: Text Manipulation\n\n```\n<?php\n$text = 'This is <b>bold</b>\
    \ text';\n\n// Strip that tag\necho strip_tags($text);\n?>\n```\n\nThe output:\n\
    \n**This is bold text**\n\nYou can also use strip_tags a list of allowed tags\
    \ that you want to ignore it. For example,\n\n```\n<?php\n$text = 'This is <b>bold</b>\
    \ and this is <i>italic</i>';\n   What about this <a href=\"http://www.php.net/\"\
    >link</a>?';\n\n// Strip those tags\necho strip_tags($text, '<b><i></i>');\n?>\n\
    ```\n\nHere's the HTML it returns:\n\nThis is <b>bold</b> and this is <i>italic</i>.\n\
    \   What about this link?\n\nAs you can see, strip_tags leaves the text between\
    \ opening and closing tags. If it finds a < character but fails to find a matching\
    \ > character, it will remove all the text to the end of the string.\n\nRemoving\
    \ HTML with strip_tags does one drawback, however, in the handling of attributes.\
    \ If you allow some tags, your site's members may be able to use attributes, as\
    \ style, within those tags, which can result in some strange layouts. Still, JavaScript\
    \ contained in a link can result in a cross-site scripting (XSS) security exploit\
    \ (see Appendix C).\n\nIn the next solution, I will show you how to implement\
    \ a “custom code” system that provides a more reliable mechanism to allow certain\
    \ tags. Later on, we'll look at how you could go about examining the contents\
    \ of the attributes-themselves in order to check that they're valid."
