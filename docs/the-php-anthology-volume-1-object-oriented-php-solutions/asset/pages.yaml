    # Counting Affected Rows


    It''s also possible to find how many rows were affected by an UPDATE, INSERT or
    DELETE query, using the PHP function mysql_affected_rows. Use of mysql_affected_rows
    is not common in typical PHP applications, but the fetch could be a good way to
    inform users, "You''ve just deleted 1854 records from the Customers table. Have
    a nice day!


    Unlike mysql_num_rows, which takes a set resource identifier as its argument,
    mysql_affected_rows takes the database connection identifier. It returns the number
    of rows affected by the last query that modified the database, for the specified
    connection.


    Here''s how mysql_affected_rows can be used:


    ```

    // Connect to MySQL

    $dbConn = &connectToDB($host, $dbUser, $dbPass, $dbName);


    // A query which updates the database

    $sql = "UPDATE

    articles

    author=''The Artist Formerly Known as...''

    WHERE

    author=''HarryF''


    // Run the query, identifying the connection

    $queryResource = mysql_query($sql, $dbConn);


    // Fetch the number of rows affected

    $changedRows = mysql_affected_rows($dbConn);

    ```


    echo $changedRows . ''<br />'';


    As situations in which mysql_affected_rows is needed are uncommon, I''ll omit
    this from the MySQLResult class in the interests of keeping things simple.'
