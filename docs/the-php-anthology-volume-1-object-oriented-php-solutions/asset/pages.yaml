  md: "# Chapter 5: Text Manipulation\n\n# Formatting\n\nTwo other powerful functions\
    \ are the printf and sprintf functions, the former displaying the output to the\
    \ screen, the latter to another string. Here's an example:\n\nFile: 7.php\n\n\
    ```\n<?php\n$fruit = array('banana', 'mango', 'pear');\n$price = array('30', '50',\
    \ '35');\n\n// A string with formatting\n$format = \"A %1$s costs %2$d cents.<br\
    \ />n\";\n\nfor ($i = 0; $i < 3; $i++) {\n    printf($format, $fruit[$i], $price[$i]);\n\
    }\n?>\n```\n\nThis produces the following output:\n\n| A banana costs 30 cents.\
    \ |\n| A mango costs 50 cents. |\n| A pear costs 35 cents. |\n\nIn this example,\
    \ $format contains special characters that printf and sprintf recognize and replace\
    \ with a value we supply. For more details, refer to the PHP Manual[3].\n\nPHP\
    \ also has the ability to treat strings as arrays, at least from the point of\
    \ view simple syntax. For example:\n\nFile: 8.php\n\n```\n<?php\n$string = 'Hello\
    \ World!';\n\n$length = strlen($string);\n\nfor ($i = 0; $i < $length; $i++) {\n\
    \    echo $string[$i]. '<br />';\n}\n?>\n```\n\n> [3] http://www.php.net/sprintf\n\
    \n152\n\nwww.it-ebooks.info"
