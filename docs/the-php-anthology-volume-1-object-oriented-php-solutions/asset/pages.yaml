- img_proc: true
  md: "```\nfunction Articles(&$db)\n{\n  // Assign the object to a local member variable\n\
    \  $this->db = &$db;\n  $this->readArticles();\n}\nfunction readArticles()\n{\n\
    \  // Perform a query using the MySQL class\n  $sql = \"SELECT * FROM articles\
    \ LIMIT 0,5\";\n  $this->result = &$this->db->query($sql);\n}\nfunction fetch()\n\
    {\n  return $this->result->fetch();\n}\n```\n\n// Create an instance of the MySQL\
    \ class\n$db = new MySQL('localhost', 'harryf', 'secret', 'sitepoint');\n\n//\
    \ Create an instance of the Article class, passing it the MySQL\nobject\n$articles\
    \ = &new Articles($db);\n\n```\nwhile ($row = $articles->fetch()) {\n  echo '<pre>';\n\
    \  print_r($row);\n  echo '</pre>';\n}?\n```\n\nIn this example, we instantiate\
    \ the MySQL class outside the Articles class, then pass it to the Articles constructor\
    \ as Articles is instantiated. Articles is then able to use the MySQL object to\
    \ perform a specific query. In this case, Articles aggregates the MySQL object.\
    \ Figure 2.2 illustrates this relationship with UML."
