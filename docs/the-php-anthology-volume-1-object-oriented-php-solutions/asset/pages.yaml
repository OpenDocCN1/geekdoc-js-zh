    to do full table scans, in this particular instance it''s a choice between the

    lesser of two evils, the alternative method being using many recursive queries,

    which will drastically slow down your application''s performance.


    You need to be aware, that the more rows you have in your table, the

    more memory PHP will need to handle these classes. As menus don''t change

    frequently, you can get around this by using some form of caching—a subject

    we will discuss in Volume II, Chapter 5.


