    # Semantic Errors


    Semantic errors occur when you write code that obeys the rules of PHP’s syntax,
    but which, when executed, breaks the “runtime rules” of PHP. For example, the
    foreach statement you give to it an array:


    ```

    <?php

    $variable = ''This is not an array'';


    foreach ($variable as $key => $value) {

    echo $key . '':'' . $value;

    }?>

    ```


    Because $variable was not an array, this script produces the following error message:


    > Warning: Invalid argument supplied for foreach() in c:\htdocs\sitepoint\phpbasics\3.php
    on line 4


    Semantic errors usually result in a Warning error message like this one.


    # Environment Errors


    Environment errors occur when something external to a PHP script causes a problem.
    For example, your MySQL server might have been down at the point at which your
    PHP script tried to connect to it. Perhaps you specified an incorrect path to
    a file you wanted to open, so PHP was unable to find the file.


    These errors also occur when we take a PHP script that has been written on one
    system, and execute it on another system with a different environment. The'
