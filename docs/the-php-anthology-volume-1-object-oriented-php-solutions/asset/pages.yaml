  md: "# It’s a Wrap\n\nOne final function that's nice to know about is wordrap. If\
    \ you have a long string of text that contains no particular formatting, you can\
    \ use wordrap to insert a character, such as new line character (\n), at a given\
    \ interval, wordwrap takes not to break up words unless you specifically tell\
    \ it to. This can be particularly useful for constructing well-laid out email\
    \ messages, we'll see in Chapter 8.\n\n# How do I make changes to the contents\
    \ of a string?\n\nPHP comes with a powerful collection of string functions. With\
    \ a first glance at the manual[1], they may seem simple, but with a little cunning\
    \ there's much you can accomplish with them. For example, PEAR:XML_HTMLSax[2]\
    \ is a complete SAX parser for badly formed XML (such as HTML). It works almost\
    \ entirely without the use of regular expressions, relying on functions like strpos\
    \ and substr to do the work.\n\n# Search and Replace\n\nStarting with a simple\
    \ example, let's consider the following code:\n\n```\n<php\n// Parts of a string\
    \ inside an HTML tag\nfunction addTag($text, $word, $tag)\n{\n    $length = strlen($word);\n\
    \    $start = strpos($text, $word);\n    $word = '<' . $tag . $word . '</' . $tag\
    \ . '>';\n    return substr_replace($text, $word, $start, $length);\n}\n```\n\n\
    ```\n$text = <<EOD\nPHP (recursive acronym for \"PHP: Hypertext Preprocessor\"\
    ) is a widely-used Open Source general-purpose scripting language that is especially\
    \ suited for Web development and can be embedded\n```\n\n+   [1] http://www.php.net/strings\n\
    [2] http://pear.php.net/package-info.php?package=XML_HTMLSax"
