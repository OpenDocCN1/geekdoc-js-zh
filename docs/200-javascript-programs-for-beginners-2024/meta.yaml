    \ (up, down, left, right)\n    const directions = [\n      [0, -2],\n      [0,\
    \ 2],\n      [-2, 0],\n      [2, 0]\n    ];\n\n    // Shuffle the directions randomly\n\
    \    directions.sort(() => Math.random() - 0.5);\n\n    for (const [dr, dc] of\
    \ directions) {\n      const newRow = row + dr;\n      const newCol = col + dc;\n\
    \n      // Check if the new cell is within bounds and unvisited\n      if (newRow\
    \ >= 0 && newRow < this.rows && newCol >= 0 && newCol < this.cols && this.grid[newRow][newCol]\
    \ === 0) {\n        // Mark the cell between the current and new cell as visited\n\
    \        this.grid[row + dr / 2][col + dc / 2] = 1;\n\n        // Recursively\
    \ visit the new cell\n        this.visitCell(newRow, newCol);\n      }\n    }\n\
