    \n  // 从右向左，将每个第二位数字加倍\n  for (let i = digits.length - 2; i >= 0; i -= 2) {\n\
    \    let doubledDigit = digits[i] * 2;\n\n    // 如果加倍结果大于 9，则减去 9\n    if (doubledDigit\
    \ > 9) {\n      doubledDigit -= 9;\n    }\n\n    digits[i] = doubledDigit;\n \
    \ }\n\n  // 计算所有数字的总和\n  const sum = digits.reduce((acc, digit) => acc + digit,\
    \ 0);\n\n  // 找到最小的数字 (x)，使得 (sum + x) 是 10 的倍数\n  const checkDigit = (10 - (sum\
    \ % 10)) % 10;\n\n  return checkDigit;\n}\n\n// 示例用法\nconst partialNumber = 123456789;\
    \ // 替换为你想要计算校验位的部分数字\nconst checkDigit = calculateLuhnCheckDigit(partialNumber);\n\
    const fullNumber = `${partialNumber}${checkDigit}`;\n\nconsole.log(`部分数字：${partialNumber}`);\n\
    console.log(`校验位：${checkDigit}`);\nconsole.log(`带校验位的完整数字：${fullNumber}`);\n```\n\
    \n## 137. 基础迷宫生成器\n\n创建一个基础迷宫生成器涉及使用算法来生成随机的迷宫布局。一种常见的迷宫生成算法是递归回溯算法。\n\n```javascript\n\
    class MazeGenerator {\n  constructor(rows, cols) {\n    this.rows = rows;\n  \
    \  this.cols = cols;\n    this.grid = Array.from({ length: rows }, () => Array(cols).fill(0));\n\
    \  }\n\n  generateMaze() {\n    this.visitCell(0, 0);\n  }\n\n  visitCell(row,\
    \ col) {\n    this.grid[row][col] = 1; // 将当前单元格标记为已访问\n\n    // 定义可能的方向（上、下、左、右）\n\
    \    const directions = [\n      [0, -2],\n      [0, 2],\n      [-2, 0],\n   \
    \   [2, 0]\n    ];\n\n    // 随机打乱方向\n    directions.sort(() => Math.random() -\
    \ 0.5);\n\n    for (const [dr, dc] of directions) {\n      const newRow = row\
    \ + dr;\n      const newCol = col + dc;\n\n      // 检查新单元格是否在边界内且未被访问\n      if\
    \ (newRow >= 0 && newRow < this.rows && newCol >= 0 && newCol < this.cols && this.grid[newRow][newCol]\
    \ === 0) {\n        // 将当前单元格和新单元格之间的单元格标记为已访问\n        this.grid[row + dr / 2][col\
    \ + dc / 2] = 1;\n\n        // 递归访问新单元格\n        this.visitCell(newRow, newCol);\n\
    \      }\n    }\n  }\n\n  printMaze() {\n    for (const row of this.grid) {\n\
    \      console.log(row.map(cell => (cell === 1 ? ' ' : '#')).join(''));\n    }\n\
    \  }\n}\n\n// 示例用法\nconst mazeRows = 11;\nconst mazeCols = 21;\n\nconst mazeGenerator\
    \ = new MazeGenerator(mazeRows, mazeCols);\nmazeGenerator.generateMaze();\nmazeGenerator.printMaze();\n\
    ```\n\n## 138. 检查一个年份是否为神奇年份\n\n神奇年份是指月份和日期（以两位数形式表示）的乘积等于年份最后两位数字的年份。例如，在 1978\
    \ 年，月份 (7) 和日期 (8) 的乘积是 56，这与年份的最后两位数字相符。\n\n```javascript\nfunction isMagicYear(year)\
    \ {\n  const yearStr = year.toString();\n  const month = parseInt(yearStr.substring(0,\
    \ 2), 10);\n  const day = parseInt(yearStr.substring(2, 4), 10);\n\n  return month\
    \ * day === parseInt(yearStr.substring(4), 10);\n}\n\n// 示例用法\nconst yearToCheck\
    \ = 1978; // 替换为你想要检查的年份\nif (isMagicYear(yearToCheck)) {\n  console.log(`${yearToCheck}\
    \ 是一个神奇年份！\U0001F389`);\n} else {\n  console.log(`${yearToCheck} 不是一个神奇年份。\U0001F614\
    `);\n}\n```\n\n## 139. 基础填字游戏\n\n创建一个基础填字游戏涉及定义一个网格并将单词放入其中，确保它们正确交叉。下面是一个简单的\
