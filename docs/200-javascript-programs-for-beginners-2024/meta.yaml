- md: "## 159. Find the Area of a Tetrahedron\n\nThis program calculates the surface\
    \ area of a regular tetrahedron given the length of its edges (a). The formula\
    \ for the surface area of a regular tetrahedron is Surface Area = √3 * a^2, where\
    \ a is the length of an edge.\n\n```javascript\nfunction calculateTetrahedronSurfaceArea(edgeLength)\
    \ {\n  const surfaceArea = Math.sqrt(3) * Math.pow(edgeLength, 2);\n  return surfaceArea;\n\
    }\n\n// Example usage\nconst edgeLength = 5; // Replace with the length of an\
    \ edge of the tetrahedron\nconst tetrahedronSurfaceArea = calculateTetrahedronSurfaceArea(edgeLength);\n\
    console.log(`The surface area of the tetrahedron is: ${tetrahedronSurfaceArea.toFixed(2)}`);\n\
    ```\n\n## 160. Check if a Number is an Automorphic Number\n\nThis program checks\
    \ if a given positive integer is an automorphic number. An automorphic number\
    \ is a number whose square ends with the number itself. For example, 5 is an automorphic\
    \ number because 5^2 = 25, and 25 ends with 5.\n\n```javascript\nfunction isAutomorphicNumber(number)\
    \ {\n  const square = number * number;\n  const numberDigits = String(number);\n\
    \  const squareDigits = String(square);\n\n  return squareDigits.endsWith(numberDigits);\n\
    }\n\n// Example usage\nconst automorphicNumber = 25; // Replace with the number\
    \ you want to check\nif (isAutomorphicNumber(automorphicNumber)) {\n  console.log(`${automorphicNumber}\
    \ is an Automorphic Number!`);\n} else {\n  console.log(`${automorphicNumber}\
    \ is not an Automorphic Number.`);\n}\n```\n\n## 161. Calculate the Area of a\
    \ Pyramid\n\nThis program calculates the surface area of a square pyramid given\
    \ the length of the base side (s) and the slant height (l). The formula for the\
    \ surface area of a square pyramid is **Surface Area = s^2 + 2 * s * l**, where\
    \ **s** is the length of a base side and **l** is the slant height.\n\n```javascript\n\
    function calculatePyramidSurfaceArea(sideLength, slantHeight) {\n  const baseArea\
    \ = Math.pow(sideLength, 2);\n  const lateralArea = 2 * sideLength * slantHeight;\n\
    \  const surfaceArea = baseArea + lateralArea;\n  return surfaceArea;\n}\n\n//\
    \ Example usage\nconst sideLength = 4; // Replace with the length of a side of\
    \ the pyramid's base\nconst slantHeight = 5; // Replace with the slant height\
    \ of the pyramid\nconst pyramidSurfaceArea = calculatePyramidSurfaceArea(sideLength,\
    \ slantHeight);\nconsole.log(`The surface area of the pyramid is: ${pyramidSurfaceArea.toFixed(2)}`);\n\
    ```\n\n## 162. Check if a Number is a Smith–Morra Gambit Number\n\nThis program\
    \ checks if a given positive integer is a Smith–Morra Gambit number. A Smith–Morra\
    \ Gambit number is a positive integer that can be expressed as the sum of the\
    \ digits of its prime factors, including repetitions.\n\n```javascript\nfunction\
    \ isSmithMorraGambitNumber(number) {\n  // Function to calculate the sum of digits\n\
    \  const digitSum = (n) => n.toString().split('').reduce((acc, digit) => acc +\
    \ parseInt(digit), 0);\n\n  // Function to calculate the prime factorization of\
    \ a number\n  const primeFactorization = (n) => {\n    const factors = [];\n \
    \   for (let i = 2; i <= n; i++) {\n      while (n % i === 0) {\n        factors.push(i);\n\
    \        n /= i;\n      }\n    }\n    return factors;\n  };\n\n  // Get the prime\
    \ factorization of the number and calculate the sum of its digits\n  const factors\
    \ = primeFactorization(number);\n  const sumOfDigits = factors.reduce((acc, factor)\
    \ => acc + digitSum(factor), 0);\n\n  // Check if the sum of digits of prime factors\
    \ equals the original number\n  return sumOfDigits === digitSum(number);\n}\n\n\
    // Example: Check if 22 is a Smith-Morra Gambit Number\nconsole.log(isSmithMorraGambitNumber(22));\
    \ // Output: true\n```\n\n## 163. Check if a Number is a Solitary Number\n\nThis\
    \ program checks if a number is a solitary number:\n\n```javascript\nfunction\
    \ getProperDivisorsSum(number) {\n  let sum = 1; // Start with 1 as every number\
    \ is divisible by 1\n\n  for (let i = 2; i <= Math.sqrt(number); i++) {\n    if\
    \ (number % i === 0) {\n      sum += i;\n\n      if (i !== number / i) {\n   \
    \     sum += number / i;\n      }\n    }\n  }\n  return sum;\n}\n\nfunction isSolitaryNumber(number)\
    \ {\n  const sum = getProperDivisorsSum(number);\n  return number !== sum;\n}\n\
    \n// Example usage\nconst solitaryNumber = 28; // Replace with the number you\
    \ want to check\nif (isSolitaryNumber(solitaryNumber)) {\n  console.log(`${solitaryNumber}\
    \ is a Solitary Number!`);\n} else {\n  console.log(`${solitaryNumber} is not\
    \ a Solitary Number.`);\n}\n```\n\n## 164. Basic Tower of Hanoi Puzzle\n\nThe\
    \ Tower of Hanoi is a classic problem in computer science and mathematics. It\
    \ consists of three pegs and a number of disks of different sizes, which can slide\
    \ onto any peg. The puzzle starts with the disks in a neat stack in ascending\
    \ order of size on one peg, the smallest at the top. The objective is to move\
    \ the entire stack to another peg, obeying the following simple rules:\n\n1. Only\
    \ one disk can be moved at a time.\n2. Each move consists of taking the upper\
    \ disk from one of the stacks and placing it on top of another stack or on an\
    \ empty peg.\n3. No disk may be placed on top of a smaller disk.\n\n```javascript\n\
    function towerOfHanoi(n, source, auxiliary, target) {\n  if (n === 1) {\n    console.log(`Move\
    \ disk 1 from ${source} to ${target}`);\n    return;\n  }\n\n  towerOfHanoi(n\
    \ - 1, source, target, auxiliary);\n  console.log(`Move disk ${n} from ${source}\
    \ to ${target}`);\n  towerOfHanoi(n - 1, auxiliary, source, target);\n}\n\n//\
    \ Example usage\nconst numberOfDisks = 3;\nconst sourcePeg = 'A';\nconst auxiliaryPeg\
    \ = 'B';\nconst targetPeg = 'C';\n\nconsole.log(`Tower of Hanoi solution for ${numberOfDisks}\
    \ disks:`);\ntowerOfHanoi(numberOfDisks, sourcePeg, auxiliaryPeg, targetPeg);\n\
    ```\n\n## 165. Calculate the Area of a Frustum\n\nThis program calculates the\
    \ surface area of a frustum of a cone given the radii of its top and bottom bases\
    \ (r1 and r2) and the slant height (l). The formula for the surface area of a\
    \ frustum of a cone is Surface Area = π * (r1 + r2) * l + π * r1^2 + π * r2^2,\
    \ where π is the mathematical constant Pi.\n\n```javascript\nfunction surfaceAreaOfFrustum(r1,\
    \ r2, l) {\n  const surfaceArea = Math.PI * (r1 + r2) * l + Math.PI * r1 ** 2\
    \ + Math.PI * r2 ** 2;\n  console.log(`Surface Area of the frustum is: ${surfaceArea}`);\n\
    }\n\n// Example: Calculate the surface area of a frustum with top radius 4, bottom\
    \ radius 8, and slant height 6\nsurfaceAreaOfFrustum(4, 8, 6);\n```\n\n## 166.\
    \ Check if a Number is a Motzkin Number\n\nThis program checks if a given positive\
    \ integer is a Motzkin number. A Motzkin number is a number in the sequence of\
    \ Motzkin numbers, which counts the number of different ways of drawing non-intersecting\
    \ chords between points on a circle (not necessarily touching every point with\
    \ a chord).\n\n```javascript\nfunction isMotzkinNumber(number) {\n  if (number\
    \ < 0) {\n    return false;\n  }\n\n  // Use dynamic programming to calculate\
    \ Motzkin numbers\n  const motzkinNumbers = [1, 1];\n  for (let n = 2; n <= number;\
    \ n++) {\n    const nextMotzkin = ((2 * n + 1) * motzkinNumbers[n - 1] + (3 *\
    \ n - 3) * motzkinNumbers[n - 2]) / (n + 2);\n    motzkinNumbers.push(nextMotzkin);\n\
    \  }\n\n  return motzkinNumbers.includes(number);\n}\n\n// Example usage\nconst\
    \ motzkinNumber = 5; // Replace with the number you want to check\nif (isMotzkinNumber(motzkinNumber))\
    \ {\n  console.log(`${motzkinNumber} is a Motzkin Number!`);\n} else {\n  console.log(`${motzkinNumber}\
    \ is not a Motzkin Number.`);\n}\n```\n\n## 167. Check if a Number is a Padovan\
    \ Number\n\nThis program checks if a given positive integer is a Padovan number.\
    \ A Padovan number is a number in the Padovan sequence, which is similar to the\
    \ Fibonacci sequence but uses a recurrence relation of P(n) = P(n-2) + P(n-3)\
    \ with initial values P(0) = P(1) = P(2) = 1.\n\n```javascript\nfunction isPadovanNumber(number)\
    \ {\n  if (number < 0) {\n    return false;\n  }\n\n  const padovanNumbers = [1,\
    \ 1, 1];\n\n  while (padovanNumbers[padovanNumbers.length - 1] <= number) {\n\
    \    const nextPadovan = padovanNumbers[padovanNumbers.length - 2] + padovanNumbers[padovanNumbers.length\
    \ - 3];\n    padovanNumbers.push(nextPadovan);\n  }\n\n  return padovanNumbers.includes(number);\n\
    }\n\n// Example usage\nconst padovanNumber = 9; // Replace with the number you\
    \ want to check\nif (isPadovanNumber(padovanNumber)) {\n  console.log(`${padovanNumber}\
    \ is a Padovan Number!`);\n}\n```"
