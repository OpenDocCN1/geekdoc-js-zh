    \ {\n      const row = [];\n      for (let j = 0; j < 4; j++) {\n        row.push(this.cards[i\
    \ * 4 + j]);\n      }\n      board.push(row);\n    }\n    return board;\n  }\n\
    \n  displayBoard() {\n    for (const row of this.board) {\n      console.log(row.map(card\
    \ => (card.faceUp ? card.value : 'X')).join(' '));\n    }\n  }\n\n  flipCard(row,\
    \ col) {\n    const card = this.board[row][col];\n    if (!card.faceUp && this.flippedCards.length\
