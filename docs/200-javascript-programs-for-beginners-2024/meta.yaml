- md: "## 11. Check if a Number is Odd or Even\n\nThis program prompts the user to\
    \ enter a number and checks whether it is odd or even. It then displays the result.\n\
    \n```javascript\n// Prompt user for a number\nlet number = parseInt(prompt(\"\
    Enter a number:\"));\n\n// Check if input is a valid integer\nif (!isNaN(number)\
    \ && Number.isInteger(number)) {\n  // Check if the number is odd or even\n  if\
    \ (number % 2 === 0) {\n    console.log(`${number} is an even number.`);\n  }\
    \ else {\n    console.log(`${number} is an odd number.`);\n  }\n} else {\n  console.log(\"\
    Please enter a valid integer.\");\n}\n```\n\n## 12. Find the Largest Among Three\
    \ Numbers\n\nThis program prompts the user to enter three numbers and determines\
    \ and displays the largest among them.\n\n```javascript\n// Prompt user for three\
    \ numbers\nlet num1 = parseFloat(prompt(\"Enter the first number:\"));\nlet num2\
