- md: "## 39. Count the Number of Vowels in a String\n\nThis program counts the number\
    \ of vowels in a given string:\n\n```javascript\n// Prompt user for a string\n\
    let inputString = prompt(\"Enter a string:\");\n\n// Check if input is a valid\
