    const numbers = [5, 2, 8, 1, 7, 3];\nconst result = findMedian(numbers);\n\nconsole.log(\"\
    Median:\", result);\n```\n\n## 103. 计算两点之间的距离\n\n计算二维平面中两点 (x1, y1) 和 (x2, y2)\
    \ 之间的距离：\n\n```javascript\nfunction calculateDistance(x1, y1, x2, y2) {\n  //\
