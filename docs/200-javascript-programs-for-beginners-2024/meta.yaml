    ## 33. 检查字符串是否为回文\n\n此程序检查给定的字符串是否为回文。回文是正读和反读都相同的字符串。\n\n```javascript\n// 检查字符串是否为回文的函数\n\
    function isPalindrome(str) {\n  // 移除非字母数字字符并转换为小写\n  const cleanStr = str.replace(/[^a-zA-Z0-9]/g,\
