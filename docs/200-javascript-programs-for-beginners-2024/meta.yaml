    Please enter a valid integer greater than 1.\");\n}\n```\n\n## 14. 打印区间内的所有质数\n\
    \n此程序提示用户输入一个区间的起始和结束数字，然后打印该区间内的所有质数。\n\n```javascript\n// 提示用户输入区间\nlet startNumber\
