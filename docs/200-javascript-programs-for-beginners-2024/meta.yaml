    \  const lowercaseChars = 'abcdefghijklmnopqrstuvwxyz';\n  const numericChars\
    \ = '0123456789';\n  const specialChars = '!@#$%^&*()-_+=';\n\n  // Combine character\
    \ sets\n  const allChars = uppercaseChars + lowercaseChars + numericChars + specialChars;\n\
    \n  // Check if the input length is a valid positive number\n  if (!Number.isInteger(length)\
    \ || length <= 0) {\n    return \"Invalid input. Please provide a positive integer\
    \ for the password length.\";\n  }\n\n  // Generate the random password\n  let\
    \ password = '';\n  for (let i = 0; i < length; i++) {\n    const randomIndex\
    \ = Math.floor(Math.random() * allChars.length);\n    password += allChars.charAt(randomIndex);\n\
    \  }\n\n  return password;\n}\n\n// Example usage:\nconst passwordLength = 12;\n\
    const randomPassword = generateRandomPassword(passwordLength);\n\nconsole.log(`Generated\
    \ Password: ${randomPassword}`);\n```\n\n## 94. 计算单利\n\n在 JavaScript 中计算单利的程序：\n\
    \n```javascript\nfunction calculateSimpleInterest(principal, rate, time) {\n \
    \ // Check if the inputs are valid positive numbers\n  if (isNaN(principal) ||\
    \ isNaN(rate) || isNaN(time) || principal <= 0 || rate <= 0 || time <= 0) {\n\
    \    return \"Invalid inputs. Please provide valid positive numbers.\";\n  }\n\
    \n  // Calculate simple interest\n  const simpleInterest = (principal * rate *\
    \ time) / 100;\n\n  return simpleInterest;\n}\n\n// Example usage:\nconst principalAmount\
    \ = 1000;\nconst interestRate = 5; // 5%\nconst investmentTime = 2; // 2 years\n\
    \nconst interestAmount = calculateSimpleInterest(principalAmount, interestRate,\
    \ investmentTime);\n\nconsole.log(`Principal Amount: $${principalAmount}`);\n\
    console.log(`Interest Rate: ${interestRate}%`);\nconsole.log(`Investment Time:\
    \ ${investmentTime} years`);\nconsole.log(`Simple Interest: $${interestAmount}`);\n\
    ```\n\n## 95. 实现一个基本的秒表\n\n要在 JavaScript 中实现一个基本的秒表，可以使用 `Date` 对象来测量经过的时间。\n\n\
    ```javascript\nlet startTime;\nlet stopwatchInterval;\n\nfunction startStopwatch()\
    \ {\n  startTime = new Date().getTime();\n  stopwatchInterval = setInterval(updateDisplay,\
    \ 1000);\n}\n\nfunction stopStopwatch() {\n  clearInterval(stopwatchInterval);\n\
    }\n\nfunction resetStopwatch() {\n  stopStopwatch();\n  updateDisplay(0);\n}\n\
    \nfunction updateDisplay() {\n  const currentTime = new Date().getTime();\n  const\
    \ elapsedTime = Math.floor((currentTime - startTime) / 1000);\n  const minutes\
    \ = Math.floor(elapsedTime / 60);\n  const seconds = elapsedTime % 60;\n\n  const\
    \ formattedTime = `${minutes}:${seconds < 10 ? \"0\" : \"\"}${seconds}`;\n\n \
    \ document.getElementById(\"display\").textContent = formattedTime;\n}\n```\n\n\
    ## 96. 检查一个数是否为完全数\n\n完全数是一个正整数，它等于其所有真因数（不包括自身）之和。\n\n```javascript\nfunction\
    \ isPerfectNumber(number) {\n  // Check if the input is a positive integer\n \
    \ if (!Number.isInteger(number) || number <= 0) {\n    return \"Invalid input.\
    \ Please provide a positive integer.\";\n  }\n\n  // Find divisors and calculate\
    \ sum\n  let sum = 0;\n  for (let i = 1; i <= Math.floor(number / 2); i++) {\n\
    \    if (number % i === 0) {\n      sum += i;\n    }\n  }\n\n  // Check if the\
    \ sum of divisors equals the original number\n  return sum === number;\n}\n\n\
    // Example usage:\nconst testNumber = 28;\nconst result = isPerfectNumber(testNumber);\n\
    console.log(`Is ${testNumber} a perfect number? ${result}`);\n```\n\n## 97. 该程序计算圆柱体的体积\n\
    \n该程序计算圆柱体的体积：\n\n```javascript\nfunction calculateCylinderVolume(radius, height)\
    \ {\n  // Check if the inputs are valid positive numbers\n  if (isNaN(radius)\
