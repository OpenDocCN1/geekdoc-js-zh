    game.makeGuess('i');\ngame.makeGuess('o');\ngame.makeGuess('u');\ngame.makeGuess('s');\n\
    ```\n\n## 143. Calculate the Euler's Totient Function\n\nThis program calculates\
    \ Euler's Totient Function, also known as Euler's Phi Function, which counts the\
    \ positive integers up to a given integer n that are relatively prime to n. The\
    \ formula for Euler's Totient Function is: φ(n) = n * (1 - 1/p1) * (1 - 1/p2)\
    \ * ... * (1 - 1/pk), where p1, p2, ..., pk are the distinct prime factors of\
    \ n.\n\n```javascript\nfunction eulerTotientFunction(n) {\n  if (n <= 0) {\n \
    \   return \"Input must be a positive integer.\";\n  }\n\n  let result = n; //\
    \ Initialize result as n\n\n  // Iterate through all prime factors of n\n  for\
    \ (let p = 2; p * p <= n; p++) {\n    if (n % p === 0) {\n      while (n % p ===\
    \ 0) {\n        n /= p;\n      }\n      result -= result / p; // Apply the formula\
    \ for prime factors\n    }\n  }\n\n  // If n is a prime number greater than 1\n\
    \  if (n > 1) {\n    result -= result / n;\n  }\n\n  return Math.floor(result);\
    \ // Return the result as an integer\n}\n```\n\n```javascript\n// Example usage\n\
    const n = 12; // Replace with the positive integer for which you want to calculate\
    \ Euler's Totient Function\nconst result = eulerTotientFunction(n);\nconsole.log(`Euler's\
    \ Totient Function for ${n} is: ${result}`);\n```\n\n## 144. Basic Memory Matching\
    \ Game\n\nCreating a basic memory matching game involves displaying a grid of\
    \ face-down cards, allowing the player to flip two cards at a time, and checking\
    \ for matches.\n\n```javascript\nclass MemoryMatchingGame {\n  constructor(cards)\
    \ {\n    this.cards = cards.concat(cards); // Duplicate the cards to create pairs\n\
    \    this.shuffleCards();\n    this.board = this.createBoard();\n    this.flippedCards\
    \ = [];\n    this.attempts = 0;\n    this.matches = 0;\n  }\n\n  shuffleCards()\
    \ {\n    for (let i = this.cards.length - 1; i > 0; i--) {\n      const j = Math.floor(Math.random()\
    \ * (i + 1));\n      [this.cards[i], this.cards[j]] = [this.cards[j], this.cards[i]];\n\
    \    }\n  }\n\n  createBoard() {\n    const board = [];\n    for (let i = 0; i\
    \ < 4; i++) {\n      const row = [];\n      for (let j = 0; j < 4; j++) {\n  \
    \      row.push(this.cards[i * 4 + j]);\n      }\n      board.push(row);\n   \
    \ }\n    return board;\n  }\n\n  displayBoard() {\n    for (const row of this.board)\
    \ {\n      console.log(row.map(card => (card.faceUp ? card.value : 'X')).join('\
    \ '));\n    }\n  }\n\n  flipCard(row, col) {\n    const card = this.board[row][col];\n\
    \    if (!card.faceUp && this.flippedCards.length < 2) {\n      card.faceUp =\
    \ true;\n      this.flippedCards.push(card);\n\n      if (this.flippedCards.length\
    \ === 2) {\n        this.attempts++;\n        if (this.flippedCards[0].value ===\
    \ this.flippedCards[1].value) {\n          this.matches++;\n          console.log('Match\
    \ found!');\n        } else {\n          console.log('No match. Try again.');\n\
    \          this.flippedCards.forEach(card => (card.faceUp = false));\n       \
    \ }\n\n        this.flippedCards = [];\n      }\n\n      this.displayBoard();\n\
    \n      if (this.matches === this.cards.length / 2) {\n        console.log(`Congratulations!\
    \ You completed the game in ${this.attempts} attempts.`);\n        process.exit();\n\
    \      }\n    }\n  }\n}\n```\n\n```javascript\n// Example usage\nconst cards =\
    \ [\n  { value: 'A', faceUp: false },\n  { value: 'B', faceUp: false },\n  { value:\
