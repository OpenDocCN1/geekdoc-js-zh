- md: "## 20. Make a Simple Calculator\n\nThis program implements a simple calculator\
    \ that can perform basic arithmetic operations. It prompts the user to enter two\
    \ numbers and choose an operation (addition, subtraction, multiplication, or division).\
    \ It then performs the selected operation and displays the result.\n\n```javascript\n\
    // Prompt user for two numbers\nlet num1 = parseFloat(prompt(\"Enter the first\
    \ number:\"));\nlet num2 = parseFloat(prompt(\"Enter the second number:\"));\n\
    \n// Check if inputs are valid numbers\nif (!isNaN(num1) && !isNaN(num2)) {\n\
    \  // Prompt user for the operation\n  let operation = prompt(\n    \"Choose an\
    \ operation (+ for addition, - for subtraction, * for multiplication, / for division):\"\
    \n  );\n\n  // Perform the selected operation\n  let result;\n  switch (operation)\
    \ {\n    case \"+\":\n      result = num1 + num2;\n      break;\n    case \"-\"\
    :\n      result = num1 - num2;\n      break;\n    case \"*\":\n      result =\
    \ num1 * num2;\n      break;\n    case \"/\":\n      if (num2 !== 0) {\n     \
    \   result = num1 / num2;\n      } else {\n        console.log(\"Cannot divide\
    \ by zero.\");\n        break;\n      }\n      break;\n    default:\n      console.log(\"\
    Invalid operation.\");\n      break;\n  }\n\n  // Display the result\n  if (result\
    \ !== undefined) {\n    console.log(`Result of ${num1} ${operation} ${num2} is:\
    \ ${result}`);\n  } else {\n    console.log(\"Please enter valid numbers.\");\n\
    \  }\n}\n```\n\n## 21. Find the Sum of Natural Numbers\n\nThis program calculates\
    \ the sum of natural numbers up to a given positive integer **n**. The sum is\
    \ calculated using the formula: **sum = n * (n + 1) / 2**.\n\n```javascript\n\
    // Prompt user for a positive integer\nlet n = parseInt(prompt(\"Enter a positive\
    \ integer:\"));\n\n// Check if input is a valid positive integer\nif (!isNaN(n)\
    \ && Number.isInteger(n) && n > 0) {\n  // Calculate the sum of natural numbers\n\
    \  let sum = (n * (n + 1)) / 2;\n  console.log(`The sum of natural numbers from\
    \ 1 to ${n} is: ${sum}`);\n} else {\n  console.log(\"Please enter a valid positive\
    \ integer.\");\n}\n```\n\n## 22. Check if the Numbers Have the Same Last Digit\n\
    \nThis program prompts the user to enter two numbers and checks if they have the\
    \ same last digit.\n\n```javascript\n// Prompt user for two numbers\nlet num1\
    \ = parseInt(prompt(\"Enter the first number:\"));\nlet num2 = parseInt(prompt(\"\
    Enter the second number:\"));\n\n// Check if inputs are valid integers\nif (\n\
    \  !isNaN(num1) &&\n  !isNaN(num2) &&\n  Number.isInteger(num1) &&\n  Number.isInteger(num2)\n\
    ) {\n  // Extract the last digit of each number\n  let lastDigit1 = Math.abs(num1\
    \ % 10);\n  let lastDigit2 = Math.abs(num2 % 10);\n\n  // Check if the last digits\
    \ are the same\n  if (lastDigit1 === lastDigit2) {\n    console.log(\n      `The\
    \ last digit of ${num1} is the same as the last digit of ${num2}.`\n    );\n \
    \ } else {\n    console.log(\n      `The last digit of ${num1} is different from\
    \ the last digit of ${num2}.`\n    );\n  }\n} else {\n  console.log(\"Please enter\
    \ valid integers.\");\n}\n```\n\n## 23. Find HCF or GCD\n\nThis program prompts\
    \ the user to enter two positive integers and calculates their Highest Common\
    \ Factor (HCF) or Greatest Common Divisor (GCD).\n\n```javascript\n// Prompt user\
    \ for two positive integers\nlet num1 = parseInt(prompt(\"Enter the first positive\
    \ integer:\"));\nlet num2 = parseInt(prompt(\"Enter the second positive integer:\"\
    ));\n\n// Check if inputs are valid positive integers\nif (!isNaN(num1) && !isNaN(num2)\
    \ && Number.isInteger(num1) && Number.isInteger(num2) && num1 > 0 && num2 > 0)\
    \ {\n    // Find the HCF or GCD\n    let smallerNumber = Math.min(num1, num2);\n\
    \    let hcf = 1;\n\n    for (let i = 1; i <= smallerNumber; i++) {\n        if\
    \ (num1 % i === 0 && num2 % i === 0) {\n            hcf = i;\n        }\n    }\n\
    \n    console.log(`The HCF (GCD) of ${num1} and ${num2} is: ${hcf}`);\n} else\
    \ {\n    console.log(\"Please enter valid positive integers.\");\n}\n```\n\n##\
    \ 24. Find LCM\n\nThis program prompts the user to enter two positive integers\
    \ and calculates their Least Common Multiple (LCM).\n\n```javascript\n// Prompt\
    \ user for two positive integers\nlet num1 = parseInt(prompt(\"Enter the first\
    \ positive integer:\"));\nlet num2 = parseInt(prompt(\"Enter the second positive\
    \ integer:\"));\n\n// Check if inputs are valid positive integers\nif (!isNaN(num1)\
    \ && !isNaN(num2) && Number.isInteger(num1) && Number.isInteger(num2) && num1\
    \ > 0 && num2 > 0) {\n    // Find the LCM\n    let largerNumber = Math.max(num1,\
    \ num2);\n    let lcm = largerNumber;\n\n    while (true) {\n        if (lcm %\
    \ num1 === 0 && lcm % num2 === 0) {\n            console.log(`The LCM of ${num1}\
    \ and ${num2} is: ${lcm}`);\n            break;\n        }\n        lcm += largerNumber;\n\
    \    }\n} else {\n    console.log(\"Please enter valid positive integers.\");\n\
    }\n```\n\n## 25. Find the Factors of a Number\n\nThis program prompts the user\
    \ to enter a positive integer and calculates and displays its factors.\n\n```javascript\n\
    // Prompt user for a positive integer\nlet number = parseInt(prompt(\"Enter a\
    \ positive integer:\"));\n\n// Check if input is a valid positive integer\nif\
    \ (!isNaN(number) && Number.isInteger(number) && number > 0) {\n  console.log(`Factors\
    \ of ${number}:`);\n\n  // Find and display the factors\n  for (let i = 1; i <=\
    \ number; i++) {\n    if (number % i === 0) {\n      console.log(i);\n    }\n\
    \  }\n} else {\n  console.log(\"Please enter a valid positive integer.\");\n}\n\
    ```\n\n## 26. Find Sum of Natural Numbers Using Recursion\n\nThis program calculates\
    \ the sum of natural numbers up to a given positive integer using recursion. It\
    \ prompts the user to enter a positive integer n and then calculates and displays\
    \ the sum using a recursive function.\n\n```javascript\n// Define a recursive\
    \ function to calculate the sum of natural numbers\nfunction sumOfNaturalNumbers(n)\
    \ {\n  if (n === 1) {\n    return 1;\n  } else {\n    return n + sumOfNaturalNumbers(n\
    \ - 1);\n  }\n}\n\n// Prompt user for a positive integer\nlet number = parseInt(prompt(\"\
    Enter a positive integer:\"));\n\n// Check if input is a valid positive integer\n\
    if (!isNaN(number) && Number.isInteger(number) && number > 0) {\n  // Calculate\
    \ and display the sum using recursion\n  let sum = sumOfNaturalNumbers(number);\n\
    \  console.log(`The sum of natural numbers up to ${number} is: ${sum}`);\n} else\
    \ {\n  console.log(\"Please enter a valid positive integer.\");\n}\n```\n\n##\
    \ 27. Guess a Random Number\n\nThis program generates a random number between\
    \ a specified range and allows the user to guess the number. It provides feedback\
    \ on whether the guessed number is too high, too low, or correct. The user continues\
    \ guessing until they correctly identify the random number.\n\n```javascript\n\
    // Generate a random number between 1 and 100 (you can adjust the range)\nconst\
    \ randomNumber = Math.floor(Math.random() * 100) + 1;\n\n// Initialize variables\n\
    let userGuess;\nlet attempts = 0;\n\n// Game loop\ndo {\n  // Prompt user for\
    \ a guess\n  userGuess = parseInt(prompt(\"Guess the random number (between 1\
    \ and 100):\"));\n\n  // Check if the input is a valid number\n  if (!isNaN(userGuess))\
    \ {\n    attempts++;\n\n    // Provide feedback to the user\n    if (userGuess\
    \ < randomNumber) {\n      console.log(\"Too low! Try again.\");\n    } else if\
    \ (userGuess > randomNumber) {\n      console.log(\"Too high! Try again.\");\n\
    \    } else {\n      console.log(`Congratulations! You guessed the correct number\
    \ ${randomNumber} in ${attempts} attempts.`);\n    }\n  } else {\n    console.log(\"\
    Please enter a valid number.\");\n  }\n} while (userGuess !== randomNumber);\n\
    ```\n\n## 28. Shuffle Deck of Cards\n\nThis program simulates shuffling a standard\
    \ deck of playing cards. It generates a deck of cards, displays the initial order,\
    \ shuffles the deck, and then displays the shuffled order.\n\n```javascript\n\
    // Function to create a standard deck of cards\nfunction createDeck() {\n    const\
    \ suits = [\"Hearts\", \"Diamonds\", \"Clubs\", \"Spades\"];\n    const ranks\
    \ = [\"2\", \"3\", \"4\", \"5\", \"6\", \"7\", \"8\", \"9\", \"10\", \"Jack\"\
    , \"Queen\", \"King\", \"Ace\"];\n\n    let deck = [];\n\n    for (let suit of\
    \ suits) {\n        for (let rank of ranks) {\n            deck.push(`${rank}\
    \ of ${suit}`);\n        }\n    }\n\n    return deck;\n}\n\n// Function to shuffle\
    \ the deck of cards\nfunction shuffleDeck(deck) {\n  for (let i = deck.length\
    \ - 1; i > 0; i--) {\n    const j = Math.floor(Math.random() * (i + 1));\n   \
    \ [deck[i], deck[j]] = [deck[j], deck[i]]; // Swap elements to shuffle\n  }\n\
    }\n\n// Create and display an initial deck of cards\nconst initialDeck = createDeck();\n\
    console.log(\"Initial Deck:\");\nconsole.log(initialDeck);\n\n// Shuffle the deck\
    \ and display the shuffled deck\nconst shuffledDeck = [...initialDeck]; // Create\
    \ a copy to avoid modifying the original\nshuffleDeck(shuffledDeck);\nconsole.log(\"\
    \\nShuffled Deck:\");\nconsole.log(shuffledDeck);\n```"
  mdcn: "## 20. 制作一个简易计算器\n\n本程序实现了一个简易计算器，可以执行基本的算术运算。它会提示用户输入两个数字并选择一种运算（加法、减法、乘法或除法）。然后执行所选运算并显示结果。\n\
    \n```javascript\n// 提示用户输入两个数字\nlet num1 = parseFloat(prompt(\"Enter the first\
    \ number:\"));\nlet num2 = parseFloat(prompt(\"Enter the second number:\"));\n\
    \n// 检查输入是否为有效数字\nif (!isNaN(num1) && !isNaN(num2)) {\n  // 提示用户选择运算\n  let operation\
    \ = prompt(\n    \"Choose an operation (+ for addition, - for subtraction, * for\
    \ multiplication, / for division):\"\n  );\n\n  // 执行所选运算\n  let result;\n  switch\
    \ (operation) {\n    case \"+\":\n      result = num1 + num2;\n      break;\n\
    \    case \"-\":\n      result = num1 - num2;\n      break;\n    case \"*\":\n\
    \      result = num1 * num2;\n      break;\n    case \"/\":\n      if (num2 !==\
    \ 0) {\n        result = num1 / num2;\n      } else {\n        console.log(\"\
    Cannot divide by zero.\");\n        break;\n      }\n      break;\n    default:\n\
    \      console.log(\"Invalid operation.\");\n      break;\n  }\n\n  // 显示结果\n\
    \  if (result !== undefined) {\n    console.log(`Result of ${num1} ${operation}\
    \ ${num2} is: ${result}`);\n  } else {\n    console.log(\"Please enter valid numbers.\"\
    );\n  }\n}\n```\n\n## 21. 求自然数之和\n\n本程序计算从1到给定正整数 **n** 的自然数之和。求和公式为：**sum = n\
    \ * (n + 1) / 2**。\n\n```javascript\n// 提示用户输入一个正整数\nlet n = parseInt(prompt(\"\
    Enter a positive integer:\"));\n\n// 检查输入是否为有效的正整数\nif (!isNaN(n) && Number.isInteger(n)\
    \ && n > 0) {\n  // 计算自然数之和\n  let sum = (n * (n + 1)) / 2;\n  console.log(`The\
    \ sum of natural numbers from 1 to ${n} is: ${sum}`);\n} else {\n  console.log(\"\
    Please enter a valid positive integer.\");\n}\n```\n\n## 22. 检查数字是否具有相同的末位数\n\n\
    本程序提示用户输入两个数字，并检查它们是否具有相同的末位数。\n\n```javascript\n// 提示用户输入两个数字\nlet num1 = parseInt(prompt(\"\
    Enter the first number:\"));\nlet num2 = parseInt(prompt(\"Enter the second number:\"\
    ));\n\n// 检查输入是否为有效的整数\nif (\n  !isNaN(num1) &&\n  !isNaN(num2) &&\n  Number.isInteger(num1)\
    \ &&\n  Number.isInteger(num2)\n) {\n  // 提取每个数字的末位数\n  let lastDigit1 = Math.abs(num1\
    \ % 10);\n  let lastDigit2 = Math.abs(num2 % 10);\n\n  // 检查末位数是否相同\n  if (lastDigit1\
    \ === lastDigit2) {\n    console.log(\n      `The last digit of ${num1} is the\
    \ same as the last digit of ${num2}.`\n    );\n  } else {\n    console.log(\n\
    \      `The last digit of ${num1} is different from the last digit of ${num2}.`\n\
    \    );\n  }\n} else {\n  console.log(\"Please enter valid integers.\");\n}\n\
    ```\n\n## 23. 求最大公约数（HCF 或 GCD）\n\n本程序提示用户输入两个正整数，并计算它们的最大公约数（HCF）或最大公因数（GCD）。\n\
    \n```javascript\n// 提示用户输入两个正整数\nlet num1 = parseInt(prompt(\"Enter the first\
    \ positive integer:\"));\nlet num2 = parseInt(prompt(\"Enter the second positive\
    \ integer:\"));\n\n// 检查输入是否为有效的正整数\nif (!isNaN(num1) && !isNaN(num2) && Number.isInteger(num1)\
    \ && Number.isInteger(num2) && num1 > 0 && num2 > 0) {\n    // 求最大公约数\n    let\
    \ smallerNumber = Math.min(num1, num2);\n    let hcf = 1;\n\n    for (let i =\
    \ 1; i <= smallerNumber; i++) {\n        if (num1 % i === 0 && num2 % i === 0)\
    \ {\n            hcf = i;\n        }\n    }\n\n    console.log(`The HCF (GCD)\
    \ of ${num1} and ${num2} is: ${hcf}`);\n} else {\n    console.log(\"Please enter\
    \ valid positive integers.\");\n}\n```\n\n## 24. 求最小公倍数\n\n本程序提示用户输入两个正整数，并计算它们的最小公倍数（LCM）。\n\
    \n```javascript\n// 提示用户输入两个正整数\nlet num1 = parseInt(prompt(\"Enter the first\
    \ positive integer:\"));\nlet num2 = parseInt(prompt(\"Enter the second positive\
    \ integer:\"));\n\n// 检查输入是否为有效的正整数\nif (!isNaN(num1) && !isNaN(num2) && Number.isInteger(num1)\
    \ && Number.isInteger(num2) && num1 > 0 && num2 > 0) {\n    // 求最小公倍数\n    let\
    \ largerNumber = Math.max(num1, num2);\n    let lcm = largerNumber;\n\n    while\
    \ (true) {\n        if (lcm % num1 === 0 && lcm % num2 === 0) {\n            console.log(`The\
    \ LCM of ${num1} and ${num2} is: ${lcm}`);\n            break;\n        }\n  \
    \      lcm += largerNumber;\n    }\n} else {\n    console.log(\"Please enter valid\
    \ positive integers.\");\n}\n```\n\n## 25. 求一个数的因数\n\n本程序提示用户输入一个正整数，计算并显示其所有因数。\n\
    \n```javascript\n// 提示用户输入一个正整数\nlet number = parseInt(prompt(\"Enter a positive\
    \ integer:\"));\n\n// 检查输入是否为有效的正整数\nif (!isNaN(number) && Number.isInteger(number)\
    \ && number > 0) {\n  console.log(`Factors of ${number}:`);\n\n  // 查找并显示因数\n\
    \  for (let i = 1; i <= number; i++) {\n    if (number % i === 0) {\n      console.log(i);\n\
    \    }\n  }\n} else {\n  console.log(\"Please enter a valid positive integer.\"\
    );\n}\n```\n\n## 26. 使用递归求自然数之和\n\n本程序使用递归方法计算从1到给定正整数的自然数之和。它会提示用户输入一个正整数 n，然后使用递归函数计算并显示总和。\n\
    \n```javascript\n// 定义一个递归函数来计算自然数之和\nfunction sumOfNaturalNumbers(n) {\n  if\
    \ (n === 1) {\n    return 1;\n  } else {\n    return n + sumOfNaturalNumbers(n\
    \ - 1);\n  }\n}\n\n// 提示用户输入一个正整数\nlet number = parseInt(prompt(\"Enter a positive\
    \ integer:\"));\n\n// 检查输入是否为有效的正整数\nif (!isNaN(number) && Number.isInteger(number)\
    \ && number > 0) {\n  // 使用递归计算并显示总和\n  let sum = sumOfNaturalNumbers(number);\n\
    \  console.log(`The sum of natural numbers up to ${number} is: ${sum}`);\n} else\
    \ {\n  console.log(\"Please enter a valid positive integer.\");\n}\n```\n\n##\
    \ 27. 猜随机数\n\n本程序生成一个指定范围内的随机数，并允许用户猜测该数字。它会提供反馈，告知用户猜测的数字是太高、太低还是正确。用户将持续猜测，直到正确猜中随机数。\n\
    \n```javascript\n// 生成一个1到100之间的随机数（你可以调整范围）\nconst randomNumber = Math.floor(Math.random()\
    \ * 100) + 1;\n\n// 初始化变量\nlet userGuess;\nlet attempts = 0;\n\n// 游戏循环\ndo {\n\
    \  // 提示用户输入猜测的数字\n  userGuess = parseInt(prompt(\"Guess the random number (between\
    \ 1 and 100):\"));\n\n  // 检查输入是否为有效数字\n  if (!isNaN(userGuess)) {\n    attempts++;\n\
    \n    // 向用户提供反馈\n    if (userGuess < randomNumber) {\n      console.log(\"Too\
    \ low! Try again.\");\n    } else if (userGuess > randomNumber) {\n      console.log(\"\
    Too high! Try again.\");\n    } else {\n      console.log(`Congratulations! You\
    \ guessed the correct number ${randomNumber} in ${attempts} attempts.`);\n   \
    \ }\n  } else {\n    console.log(\"Please enter a valid number.\");\n  }\n} while\
    \ (userGuess !== randomNumber);\n```\n\n## 28. 洗牌一副扑克牌\n\n本程序模拟洗一副标准扑克牌。它会生成一副牌，显示初始顺序，洗牌，然后显示洗牌后的顺序。\n\
    \n```javascript\n// 创建一副标准扑克牌的函数\nfunction createDeck() {\n    const suits = [\"\
    Hearts\", \"Diamonds\", \"Clubs\", \"Spades\"];\n    const ranks = [\"2\", \"\
    3\", \"4\", \"5\", \"6\", \"7\", \"8\", \"9\", \"10\", \"Jack\", \"Queen\", \"\
    King\", \"Ace\"];\n\n    let deck = [];\n\n    for (let suit of suits) {\n   \
    \     for (let rank of ranks) {\n            deck.push(`${rank} of ${suit}`);\n\
    \        }\n    }\n\n    return deck;\n}\n\n// 洗牌函数\nfunction shuffleDeck(deck)\
    \ {\n  for (let i = deck.length - 1; i > 0; i--) {\n    const j = Math.floor(Math.random()\
    \ * (i + 1));\n    [deck[i], deck[j]] = [deck[j], deck[i]]; // 交换元素以洗牌\n  }\n\
    }\n\n// 创建并显示初始牌组\nconst initialDeck = createDeck();\nconsole.log(\"Initial Deck:\"\
    );\nconsole.log(initialDeck);\n\n// 洗牌并显示洗牌后的牌组\nconst shuffledDeck = [...initialDeck];\
    \ // 创建副本以避免修改原始牌组\nshuffleDeck(shuffledDeck);\nconsole.log(\"\\nShuffled Deck:\"\
    );\nconsole.log(shuffledDeck);\n```"
