- md: "## 29. Display Fibonacci Sequence Using Recursion\n\nThis program displays\
    \ the Fibonacci sequence up to a specified number of terms using recursion. It\
    \ prompts the user to enter the number of terms and then uses a recursive function\
    \ to generate and display the Fibonacci sequence.\n\n```javascript\n// Function\
    \ to generate the Fibonacci sequence using recursion\nfunction fibonacci(n) {\n\
    \  if (n <= 1) {\n    return n;\n  } else {\n    return fibonacci(n - 1) + fibonacci(n\
    \ - 2);\n  }\n}\n\n// Prompt user for the number of terms in the Fibonacci sequence\n\
    let numTerms = parseInt(prompt(\"Enter the number of terms in the Fibonacci sequence:\"\
    ));\n\n// Check if input is a valid non-negative integer\nif (!isNaN(numTerms)\
    \ && Number.isInteger(numTerms) && numTerms >= 0) {\n  console.log(`Fibonacci\
    \ sequence of ${numTerms} terms:`);\n\n  // Display the Fibonacci sequence using\
    \ recursion\n  for (let i = 0; i < numTerms; i++) {\n    console.log(fibonacci(i));\n\
    \  }\n} else {\n    console.log(\"Please enter a valid non-negative integer for\
    \ the number of terms.\");\n}\n```\n\n## 30. Find Factorial of Number Using Recursion\n\
    \nThis program calculates the factorial of a given non-negative integer using\
    \ recursion. It prompts the user to enter a non-negative integer and then uses\
    \ a recursive function to compute and display its factorial.\n\n```javascript\n\
    // Function to calculate the factorial using recursion\nfunction factorial(n)\
    \ {\n  if (n === 0 || n === 1) {\n    return 1;\n  } else {\n    return n * factorial(n\
    \ - 1);\n  }\n}\n\n// Prompt user for a non-negative integer\nlet number = parseInt(prompt(\"\
    Enter a non-negative integer:\"));\n\n// Check if input is a valid non-negative\
    \ integer\nif (!isNaN(number) && Number.isInteger(number) && number >= 0) {\n\
    \  // Calculate and display the factorial using recursion\n  let result = factorial(number);\n\
    \  console.log(`The factorial of ${number} is: ${result}`);\n} else {\n  console.log(\"\
    Please enter a valid non-negative integer.\");\n}\n```\n\n## 31. Convert Decimal\
    \ to Binary\n\nThis program converts a decimal number to its binary equivalent.\
    \ It prompts the user to enter a decimal number and then calculates and displays\
    \ its binary representation.\n\n```javascript\n// Function to convert decimal\
    \ to binary\nfunction decimalToBinary(decimalNumber) {\n  if (decimalNumber ===\
    \ 0) {\n    return \"0\";\n  }\n\n  let binaryResult = \"\";\n  while (decimalNumber\
    \ > 0) {\n    let remainder = decimalNumber % 2;\n    binaryResult = remainder\
    \ + binaryResult;\n    decimalNumber = Math.floor(decimalNumber / 2);\n  }\n \
    \ return binaryResult;\n}\n\n// Prompt user for a decimal number\nlet decimalNumber\
    \ = parseInt(prompt(\"Enter a decimal number:\"));\n\n// Check if input is a valid\
    \ integer\nif (!isNaN(decimalNumber) && Number.isInteger(decimalNumber) && decimalNumber\
    \ >= 0) {\n  // Convert and display the binary equivalent\n  let binaryEquivalent\
    \ = decimalToBinary(decimalNumber);\n  console.log(`The binary equivalent of ${decimalNumber}\
    \ is: ${binaryEquivalent}`);\n} else {\n  console.log(\"Please enter a valid non-negative\
    \ integer.\");\n}\n```\n\n## 32. Find ASCII Value of Character\n\nThis program\
    \ prompts the user to enter a character and then calculates and displays its ASCII\
    \ value.\n\n```javascript\n// Prompt user for a character\nlet character = prompt(\"\
    Enter a character:\");\n\n// Check if input is a valid single character\nif (character.length\
    \ === 1) {\n    // Calculate and display the ASCII value\n    let asciiValue =\
    \ character.charCodeAt(0);\n    console.log(`The ASCII value of '${character}'\
    \ is: ${asciiValue}`);\n} else {\n    console.log(\"Please enter a valid single\
    \ character.\");\n}\n```\n\n## 33. Check Whether a String is Palindrome or Not\n\
    \nThis program checks whether a given string is a palindrome or not. A palindrome\
    \ is a string that reads the same forward as backward.\n\n```javascript\n// Function\
    \ to check if a string is a palindrome\nfunction isPalindrome(str) {\n  // Remove\
    \ non-alphanumeric characters and convert to lowercase\n  const cleanStr = str.replace(/[^a-zA-Z0-9]/g,\
    \ \"\").toLowerCase();\n\n  // Compare the original and reversed strings\n  return\
    \ cleanStr === cleanStr.split(\"\").reverse().join(\"\");\n}\n\n// Prompt user\
    \ for a string\nlet inputString = prompt(\"Enter a string:\");\n\n// Check if\
    \ input is a valid string\nif (inputString.length > 0) {\n  // Check and display\
    \ if the string is a palindrome\n  if (isPalindrome(inputString)) {\n    console.log(`\"\
    ${inputString}\" is a palindrome.`);\n  } else {\n    console.log(`\"${inputString}\"\
    \ is not a palindrome.`);\n  }\n} else {\n  console.log(\"Please enter a valid\
    \ string.\");\n}\n```\n\n## 34. Sort Words in Alphabetical Order\n\nThis program\
    \ prompts the user to enter a sentence or a list of words and then sorts and displays\
    \ the words in alphabetical order.\n\n```javascript\n// Prompt user for a sentence\
    \ or a list of words\nlet inputString = prompt(\"Enter a sentence or a list of\
    \ words:\");\n\n// Check if input is a valid string\nif (inputString.length >\
    \ 0) {\n    // Split the input into an array of words\n    let wordsArray = inputString.split(/\\\
    s+/);\n\n    // Sort the array of words in alphabetical order\n    let sortedWords\
    \ = wordsArray.sort();\n\n    // Display the sorted words\n    console.log(\"\
    Sorted Words:\");\n    console.log(sortedWords.join(', '));\n} else {\n    console.log(\"\
    Please enter a valid string.\");\n}\n```\n\n## 35. Replace Characters of a String\n\
    \nThis program prompts the user to enter a string, a target character, and a replacement\
    \ character. It then replaces all occurrences of the target character with the\
    \ replacement character and displays the modified string.\n\n```javascript\n//\
    \ Prompt user for a string\nlet inputString = prompt(\"Enter a string:\");\n\n\
    // Check if input is a valid string\nif (inputString.length > 0) {\n    // Prompt\
    \ user for a target character and a replacement character\n    let targetChar\
    \ = prompt(\"Enter the target character:\");\n    let replacementChar = prompt(\"\
    Enter the replacement character:\");\n\n    // Check if targetChar is a single\
    \ character and input is not empty\n    if (targetChar.length === 1) {\n     \
    \   // Replace all occurrences of targetChar with replacementChar\n        let\
    \ modifiedString = inputString.split(targetChar).join(replacementChar);\n\n  \
    \      // Display the modified string\n        console.log(`Modified String: ${modifiedString}`);\n\
    \    } else {\n        console.log(\"Please enter a valid target character (single\
    \ character).\");\n    }\n} else {\n    console.log(\"Please enter a valid string.\"\
    );\n}\n```\n\n## 36. Reverse a String\n\nThis program prompts the user to enter\
    \ a string and then reverses and displays the characters of the string.\n\n```javascript\n\
    // Prompt user for a string\nlet inputString = prompt(\"Enter a string:\");\n\n\
