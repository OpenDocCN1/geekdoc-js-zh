    \     if (this.flippedCards.length === 2) {\n        this.attempts++;\n      \
    \  if (this.flippedCards[0].value === this.flippedCards[1].value) {\n        \
    \  this.matches++;\n          console.log('找到配对了！');\n        } else {\n     \
    \     console.log('没有配对。再试一次。');\n          this.flippedCards.forEach(card =>\
    \ (card.faceUp = false));\n        }\n\n        this.flippedCards = [];\n    \
    \  }\n\n      this.displayBoard();\n\n      if (this.matches === this.cards.length\
    \ / 2) {\n        console.log(`恭喜！你在 ${this.attempts} 次尝试后完成了游戏。`);\n        process.exit();\n\
    \      }\n    }\n  }\n}\n```\n\n```javascript\n// 示例用法\nconst cards = [\n  { value:\
    \ 'A', faceUp: false },\n  { value: 'B', faceUp: false },\n  { value: 'C', faceUp:\
