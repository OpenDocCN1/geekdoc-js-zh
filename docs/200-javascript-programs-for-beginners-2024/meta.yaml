    \ and for multiples of both 3 and 5, it prints \"FizzBuzz\":\n\n```javascript\n\
    function fizzBuzzGame() {\n  console.log(\"Welcome to the FizzBuzz Game!\");\n\
    \  console.log(\"Let's play FizzBuzz!\");\n\n  for (let i = 1; i <= 100; i++)\
    \ {\n    let output = \"\";\n\n    if (i % 3 === 0) {\n      output += \"Fizz\"\
    ;\n    }\n\n    if (i % 5 === 0) {\n      output += \"Buzz\";\n    }\n\n    console.log(output\
    \ || i);\n  }\n}\n\n// Start the FizzBuzz Game\nfizzBuzzGame();\n```\n\n## 200.\
    \ Swap Pairs of Adjacent Digits\n\nThis program takes an even-length integer and\
    \ swaps pairs of adjacent digits. For example, for the number 123456, the program\
    \ will swap pairs of adjacent digits to produce the number 214365.\n\n```javascript\n\
    function swapPairsOfAdjacentDigits(number) {\n  // Convert the number to a string\
    \ to manipulate individual digits\n  const numberStr = String(number);\n  const\
    \ length = numberStr.length;\n\n  // Check if the number has an even length\n\
    \  if (length % 2 !== 0) {\n    console.log(\"Please enter an integer with an\
    \ even length.\");\n    return;\n  }\n\n  // Swap pairs of adjacent digits\n \
    \ let swappedNumber = \"\";\n  for (let i = 0; i < length; i += 2) {\n    swappedNumber\
    \ += numberStr[i + 1] + numberStr[i];\n  }\n\n  // Convert the result back to\
    \ an integer\n  const result = parseInt(swappedNumber, 10);\n  console.log(`Original\
    \ Number: ${number}`);\n  console.log(`Swapped Number: ${result}`);\n  console.log(`Number\
    \ with Swapped Pairs of Adjacent Digits: ${result}`);\n  return result;\n}\n\n\
    // Example: Swap pairs of adjacent digits of the number 123456\nswapPairsOfAdjacentDigits(123456);\n\
    ```\n\n## 201. Capitalization Changer\n\nThis program takes a string as input\
    \ and changes the capitalization of all letters. Uppercase letters are converted\
    \ to lowercase, and lowercase letters are converted to uppercase.\n\n```javascript\n\
    function changeCapitalization(inputString) {\n  let resultString = \"\";\n\n \
    \ for (const char of inputString) {\n    // Check if the character is uppercase\n\
    \    if (char === char.toUpperCase()) {\n      // Convert uppercase to lowercase\n\
    \      resultString += char.toLowerCase();\n    } else {\n      // Convert lowercase\
    \ to uppercase\n      resultString += char.toUpperCase();\n    }\n  }\n\n  console.log(`Original\
    \ String: ${inputString}`);\n  console.log(`String with Changed Capitalization:\
    \ ${resultString}`);\n}\n\n// Example: Change the capitalization of the string\
    \ \"Hello World\"\nchangeCapitalization(\"Hello World\");\n```\n\n## 202. Array\
    \ Halves Swapper\n\nThis program takes an array of integers with an even length\
    \ and swaps its two halves.\n\n```javascript\nfunction swapArrayHalves(arr) {\n\
    \  const length = arr.length;\n\n  // Check if the array has an even length\n\
    \  if (length % 2 !== 0) {\n    console.log(\"Please provide an array with an\
    \ even length.\");\n    return;\n  }\n\n  // Calculate the midpoint of the array\n\
    \  const midpoint = length / 2;\n\n  // Swap the two halves of the array\n  for\
    \ (let i = 0; i < midpoint; i++) {\n    const temp = arr[i];\n    arr[i] = arr[midpoint\
    \ + i];\n    arr[midpoint + i] = temp;\n  }\n\n  console.log(\"Original Array:\
    \ \" + arr.join(\", \"));\n  console.log(\"Array with Swapped Halves: \" + arr.join(\"\
    , \"));\n}\n\n// Example: Swap halves of the array [1, 2, 3, 4, 5, 6]\nswapArrayHalves([1,\
    \ 2, 3, 4, 5, 6]);\n```"
