  - "[PAGE 285]\n\nthe sequence of Motzkin numbers, which counts the number of different\
    \ ways of drawing non-intersecting chords between points on a circle (not necessarily\
    \ touching every point with a chord).\n\n```\nfunction isMotzkinNumber(number)\
    \ {\n  if (number < 0) {\n    return false;\n  }\n\n  // Use dynamic programming\
