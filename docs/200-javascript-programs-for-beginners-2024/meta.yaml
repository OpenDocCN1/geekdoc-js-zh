- md: "## 100. Convert Feet to Meters\n\nTo convert feet to meters in JavaScript,\
    \ you can use the following conversion formula:\n\nMeters = Feet × 0.3048\n\n\
    Here's a simple function that performs the conversion:\n\n```javascript\nfunction\
    \ feetToMeters(feet) {\n  // Check if the input is a valid number\n  if (isNaN(feet))\
    \ {\n    return \"Invalid input. Please provide a valid number of feet.\";\n \
    \ }\n\n  // Perform the conversion\n  const meters = feet * 0.3048;\n\n  return\
    \ meters;\n}\n\n// Example usage:\nconst feetValue = 10;\nconst metersValue =\
    \ feetToMeters(feetValue);\n\nconsole.log(`${feetValue} feet is equal to ${metersValue.toFixed(2)}\
    \ meters`);\n```\n\n## 101. Convert Days to Years, Months, and Days\n\nTo convert\
    \ a given number of days into years, months, and remaining days in JavaScript,\
    \ you can use the following function:\n\n```javascript\nfunction convertDaysToYearsMonthsDays(days)\
    \ {\n  // Check if the input is a valid positive number\n  if (isNaN(days) ||\
    \ days <= 0) {\n    return \"Invalid input. Please provide a valid positive number\
    \ of days.\";\n  }\n\n  // Calculate years\n  const years = Math.floor(days /\
    \ 365);\n\n  // Calculate remaining days after removing years\n  const remainingDaysAfterYears\
    \ = days % 365;\n\n  // Calculate months\n  const months = Math.floor(remainingDaysAfterYears\
    \ / 30);\n\n  // Calculate remaining days after removing months\n  const remainingDaysAfterMonths\
    \ = remainingDaysAfterYears % 30;\n\n  return {\n    years,\n    months,\n   \
    \ remainingDays: remainingDaysAfterMonths\n  };\n}\n\n// Example usage:\nconst\
    \ totalDays = 1000;\nconst result = convertDaysToYearsMonthsDays(totalDays);\n\
    \nconsole.log(`${totalDays} days is approximately ${result.years} years, ${result.months}\
    \ months, and ${result.remainingDays} days.`);\n```\n\n## 102. Find the Median\
    \ of an Array\n\nTo find the median of an array in JavaScript, you can create\
    \ a function that sorts the array and then determines the median based on its\
    \ length.\n\n```javascript\nfunction findMedian(arr) {\n  // Check if the input\
    \ is a valid array\n  if (!Array.isArray(arr) || arr.length === 0) {\n    return\
    \ \"Invalid input. Please provide a non-empty array.\";\n  }\n\n  // Sort the\
    \ array\n  const sortedArray = arr.slice().sort((a, b) => a - b);\n\n  // Calculate\
    \ the median\n  const middleIndex = Math.floor(sortedArray.length / 2);\n\n  if\
    \ (sortedArray.length % 2 === 0) {\n    // If the array has an even number of\
    \ elements, return the average of the middle two\n    const median = (sortedArray[middleIndex\
    \ - 1] + sortedArray[middleIndex]) / 2;\n    return median;\n  } else {\n    //\
    \ If the array has an odd number of elements, return the middle element\n    return\
    \ sortedArray[middleIndex];\n  }\n}\n\n// Example usage:\nconst numbers = [5,\
    \ 2, 8, 1, 7, 3];\nconst result = findMedian(numbers);\n\nconsole.log(\"Median:\"\
    , result);\n```\n\n## 103. Calculate the Distance Between Two Points\n\nTo calculate\
    \ the distance between two points (x1, y1) and (x2, y2) in a two-dimensional plane:\n\
    \n```javascript\nfunction calculateDistance(x1, y1, x2, y2) {\n  // Check if the\
    \ inputs are valid numbers\n  if (isNaN(x1) || isNaN(y1) || isNaN(x2) || isNaN(y2))\
    \ {\n    return \"Invalid inputs. Please provide valid numerical coordinates.\"\
    ;\n  }\n\n  // Calculate the distance using the distance formula\n  const distance\
    \ = Math.sqrt(Math.pow((x2 - x1), 2) + Math.pow((y2 - y1), 2));\n\n  return distance;\n\
    }\n\n// Example usage:\nconst x1 = 1;\nconst y1 = 2;\nconst x2 = 4;\nconst y2\
    \ = 6;\n\nconst result = calculateDistance(x1, y1, x2, y2);\n\nconsole.log(`The\
    \ distance between (${x1}, ${y1}) and (${x2}, ${y2}) is ${result.toFixed(2)}`);\n\
    ```\n\n## 104. Check if a Number is a Perfect Square\n\nTo check if a number is\
    \ a perfect square in JavaScript, you can calculate the square root of the number\
    \ and then check if the square of the integer part of the square root is equal\
    \ to the original number.\n\n```javascript\nfunction isPerfectSquare(number) {\n\
    \  // Check if the input is a valid positive number\n  if (isNaN(number) || number\
    \ < 0) {\n    return \"Invalid input. Please provide a valid non-negative number.\"\
    ;\n  }\n\n  // Calculate the square root\n  const squareRoot = Math.sqrt(number);\n\
    \n  // Check if the square of the integer part of the square root is equal to\
    \ the original number\n  return squareRoot === Math.floor(squareRoot);\n}\n\n\
    // Example usage:\nconst testNumber = 25;\nconst result = isPerfectSquare(testNumber);\n\
    \nconsole.log(`Is ${testNumber} a perfect square? ${result}`);\n```\n\n## 105.\
    \ Find the Area of a Rectangle\n\nTo find the area of a rectangle in JavaScript,\
    \ you can create a function that takes the length and width as parameters and\
    \ applies the formula:\n\nArea = Length × Width\n\n```javascript\nfunction calculateRectangleArea(length,\
    \ width) {\n  // Check if the inputs are valid positive numbers\n  if (isNaN(length)\
    \ || isNaN(width) || length <= 0 || width <= 0) {\n    return \"Invalid inputs.\
    \ Please provide valid positive numbers for length and width.\";\n  }\n\n  //\
    \ Calculate the area of the rectangle\n  const area = length * width;\n\n  return\
    \ area;\n}\n\n// Example usage:\nconst rectangleLength = 5;\nconst rectangleWidth\
    \ = 8;\n\nconst result = calculateRectangleArea(rectangleLength, rectangleWidth);\n\
    \nconsole.log(`The area of the rectangle with length ${rectangleLength} and width\
    \ ${rectangleWidth} is ${result}`);\n```\n\n## 106. Convert Binary to Decimal\n\
    \nTo convert a binary number to a decimal number in JavaScript, you can create\
    \ a function that takes a binary string as input and calculates the decimal equivalent.\n\
    \n```javascript\nfunction binaryToDecimal(binaryString) {\n  // Check if the input\
    \ is a valid binary string\n  if (!/^[01]+$/.test(binaryString)) {\n    return\
    \ \"Invalid input. Please provide a valid binary string.\";\n  }\n\n  // Convert\
    \ binary to decimal\n  const decimalValue = parseInt(binaryString, 2);\n\n  return\
    \ decimalValue;\n}\n\n// Example usage:\nconst binaryNumber = \"1101\";\nconst\
    \ decimalResult = binaryToDecimal(binaryNumber);\n\nconsole.log(`The decimal equivalent\
    \ of binary ${binaryNumber} is ${decimalResult}`);\n```\n\n## 107. Count the Number\
    \ of Words in a Sentence\n\nTo count the number of words in a sentence in JavaScript,\
    \ you can create a function that splits the sentence into words and then counts\
    \ the number of resulting elements in the array.\n\n```javascript\nfunction countWords(sentence)\
    \ {\n  // Check if the input is a valid string\n  if (typeof sentence !== 'string')\
    \ {\n    return \"Invalid input. Please provide a valid sentence.\";\n  }\n\n\
    \  // Use a regular expression to split the sentence into words\n  const words\
    \ = sentence.split(/\\s+/);\n\n  // Filter out empty strings\n  const nonEmptyWords\
    \ = words.filter(word => word.length > 0);\n\n  // Count the number of words\n\
    \  const wordCount = nonEmptyWords.length;\n\n  return wordCount;\n}\n\n// Example\
    \ usage:\nconst sentence = \"This is a sample sentence.\";\nconst result = countWords(sentence);\n\
    \nconsole.log(`The sentence \"${sentence}\" has ${result} words.`);\n```\n\n##\
    \ 108. Find the Union of Two Arrays\n\nTo find the union of two arrays in JavaScript,\
    \ you can create a function that concatenates the arrays and removes duplicate\
    \ elements.\n\n```javascript\nfunction findUnion(arr1, arr2) {\n  // Check if\
    \ the inputs are valid arrays\n  if (!Array.isArray(arr1) || !Array.isArray(arr2))\
    \ {\n    return \"Invalid inputs. Please provide valid arrays.\";\n  }\n\n  //\
    \ Concatenate the arrays and remove duplicates\n  const unionArray = Array.from(new\
    \ Set([...arr1, ...arr2]));\n\n  return unionArray;\n}\n\n// Example usage:\n\
    const array1 = [1, 2, 3, 4, 5];\nconst array2 = [3, 4, 5, 6, 7];\n\nconst result\
    \ = findUnion(array1, array2);\n\nconsole.log(\"Union of Arrays:\", result);\n\
    ```\n\n## 109. Calculate the Factorial of a Large Number\n\nCalculating the factorial\
    \ of a large number can quickly lead to very large results, and JavaScript has\
    \ limitations in terms of precision. To handle large factorials, you can use libraries\
    \ that support arbitrary-precision arithmetic. One such library is the \"BigInt\"\
    \ type in JavaScript, which is available in modern environments.\n\n```javascript\n\
    function calculateFactorial(n) {\n  // Check if the input is a valid non-negative\
    \ integer\n  if (!Number.isInteger(n) || n < 0) {\n    return \"Invalid input.\
    \ Please provide a non-negative integer.\";\n  }\n\n  // Use BigInt to handle\
