    );\n}\n```\n\n## 17. 打印斐波那契数列\n\n此程序提示用户输入项数，然后打印斐波那契数列到该数量的项。斐波那契数列是一个数字序列，其中每个数字是前两个数字的和，通常从0和1开始。\n\
    \n```javascript\n// 提示用户输入斐波那契数列的项数\nlet numTerms = parseInt(\n  prompt(\"Enter\
