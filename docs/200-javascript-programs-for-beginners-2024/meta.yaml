  md: "# 143. Calculate the Euler's Totient Function\n\nThis program calculates Euler's\
    \ Totient Function, also known as Euler's Phi Function, which counts the positive\
    \ integers up to a given integer n that are relatively prime to n. The formula\
    \ for Euler's Totient Function is: φ(n) = n * (1 - 1/p1) * (1 - 1/p2) * ... *\
    \ (1 - 1/pk), where p1, p2, ..., pk are the distinct prime factors of n.\n\n```\n\
    function eulerTotientFunction(n) {\n  if (n <= 0) {\n    return \"Input must be\
    \ a positive integer.\";\n  }\n\n  let result = n; // Initialize result as n\n\
    \n  // Iterate through all prime factors of n\n  for (let p = 2; p * p <= n; p++)\
    \ {\n    if (n % p === 0) {\n      while (n % p === 0) {\n        n /= p;\n  \
    \    }\n      result -= result / p; // Apply the formula for prime factors\n \
    \   }\n  }\n\n  // If n is a prime number greater than 1\n```"
