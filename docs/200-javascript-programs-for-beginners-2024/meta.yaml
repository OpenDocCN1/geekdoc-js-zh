    \ a valid non-negative integer.\");\n}\n```\n\n## 31. 将十进制数转换为二进制\n\n此程序将十进制数转换为其二进制等效值。它提示用户输入一个十进制数，然后计算并显示其二进制表示。\n\
    \n```javascript\n// 将十进制数转换为二进制的函数\nfunction decimalToBinary(decimalNumber) {\n\
    \  if (decimalNumber === 0) {\n    return \"0\";\n  }\n\n  let binaryResult =\
    \ \"\";\n  while (decimalNumber > 0) {\n    let remainder = decimalNumber % 2;\n\
    \    binaryResult = remainder + binaryResult;\n    decimalNumber = Math.floor(decimalNumber\
    \ / 2);\n  }\n  return binaryResult;\n}\n\n// 提示用户输入一个十进制数\nlet decimalNumber\
    \ = parseInt(prompt(\"Enter a decimal number:\"));\n\n// 检查输入是否为有效的整数\nif (!isNaN(decimalNumber)\
    \ && Number.isInteger(decimalNumber) && decimalNumber >= 0) {\n  // 转换并显示二进制等效值\n\
