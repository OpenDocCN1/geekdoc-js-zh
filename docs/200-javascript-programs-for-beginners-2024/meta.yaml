  mdcn: "## 110. 检查一个数是否为强数\n\n强数（或数字阶乘）是指这样一个数：其各位数字的阶乘之和等于该数本身。要在 JavaScript 中检查一个数是否为强数，可以创建一个函数，计算每个数字的阶乘，并检查它们的和是否等于原始数字。\n\
    \n```\nfunction calculateFactorial(number) {\n  let result = 1;\n  for (let i\
    \ = 2; i <= number; i++) {\n    result *= i;\n  }\n  return result;\n}\n```\n\n\
    ```\nfunction isStrongNumber(num) {\n  // 检查输入是否为非负整数\n  if (!Number.isInteger(num)\
