    \  console.log(\n    \"Please enter valid positive integers, ensuring that the\
    \ starting number is less than the ending number and both are greater than 0.\"\
    \n  );\n}\n```"
  mdcn: "## 11. 检查一个数字是奇数还是偶数\n\n此程序提示用户输入一个数字，并检查它是奇数还是偶数，然后显示结果。\n\n```javascript\n\
