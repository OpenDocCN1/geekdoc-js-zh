  md: "# 215. Prefix Sums\n\nThis program creates an array of prefix sums for a given\
    \ array. The prefix sum of a sequence is a new sequence where each element is\
    \ the sum of all preceding elements in the original sequence.\n\n```\nfunction\
    \ prefixSums(inputArray) {\n  let prefixSum = 0;\n  const prefixSumArray = [];\n\
    \n  for (const num of inputArray) {\n    prefixSum += num;\n    prefixSumArray.push(prefixSum);\n\
    \  }\n\n  console.log(\"Original Array:\", inputArray);\n  console.log(\"Prefix\
    \ Sums Array:\", prefixSumArray);\n}\n\n// Example: Create prefix sums for the\
    \ array [1, 2, 3, 4, 5]\nprefixSums([1, 2, 3, 4, 5]);\n```"
  merge: -1
  pgno: 359
- img_proc: true
  md: "# 216. Next Prime Number\n\nThis program finds the smallest prime number strictly\
    \ greater than a given number. It checks numbers one by one starting from the\
    \ given number until it finds the next prime.\n\n```\nfunction isPrime(num) {\n\
    \  if (num < 2) return false;\n  for (let i = 2; i <= Math.sqrt(num); i++) {\n\
    \    if (num % i === 0) return false;\n  }\n  return true;\n}\n\nfunction nextPrimeNumber(givenNumber)\
    \ {\n  let nextNumber = givenNumber + 1;\n\n  while (!isPrime(nextNumber)) {\n\
    \    nextNumber++;\n  }\n\n  console.log(`Given Number: ${givenNumber}`);\n  console.log(`Next\
    \ Prime Number: ${nextNumber}`);\n}\n\n// Example: Find the next prime number\
    \ greater than 10\nnextPrimeNumber(10);\n```"
  merge: -1
  pgno: 360
- img_proc: true
  md: "# 217. Reverse Order of Bits\n\nThis program reverses the order of bits in\
    \ an integer. It converts the integer to its binary representation, reverses the\
    \ bits, and converts it back to an integer.\n\n```\nfunction reverseOrderOfBits(integer)\
    \ {\n  const binaryRepresentation = integer.toString(2).padStart(8, '0'); // Assuming\
    \ 8 bits for simplicity\n  const reversedBinary = binaryRepresentation.split('').reverse().join('');\n\
    \  const reversedInteger = parseInt(reversedBinary, 2);\n\n  console.log(`Original\
    \ Integer: ${integer}`);\n  console.log(`Binary Representation: ${binaryRepresentation}`);\n\
    \  console.log(`Reversed Binary: ${reversedBinary}`);\n  console.log(`Reversed\
    \ Integer: ${reversedInteger}`);\n}\n\n// Examples: Reverse order of bits for\
    \ given integers\nreverseOrderOfBits(14);\nreverseOrderOfBits(56);\nreverseOrderOfBits(234);\n\
    ```"
  merge: -1
  pgno: 361
