    \ if (board[i][j] === 'X') {\n          continue;\n        }\n\n        for (let\
    \ row = i - 1; row <= i + 1; row++) {\n          for (let col = j - 1; col <=\
    \ j + 1; col++) {\n            if (row >= 0 && row < this.rows && col >= 0 &&\
    \ col < this.cols && board[row][col] === 'X') {\n              board[i][j]++;\n\
    \            }\n          }\n        }\n      }\n    }\n    return board;\n  }\n\
    \n  displayBoard() {\n    console.log('Minesweeper Board:');\n    for (const row\
