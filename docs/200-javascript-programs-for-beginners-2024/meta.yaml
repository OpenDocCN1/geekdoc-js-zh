    \nconsole.log('Welcome to Simon Says! Repeat the sequence correctly to advance.');\n\
    \n// Start the game loop\nsimonSaysGame.play();\n```\n\n## 147. Calculate the\
    \ Area of a Hexagon\n\nThis program calculates the area of a regular hexagon given\
    \ the side length ( s ). The formula for the area of a regular hexagon is Area\
    \ = (3 * √3 * s^2) / 2 , where s is the side length.\n\n```javascript\nfunction\
    \ calculateHexagonArea(sideLength) {\n  const area = (3 * Math.sqrt(3) / 2) *\
    \ Math.pow(sideLength, 2);\n  return area;\n}\n\n// Example usage\nconst sideLength\
    \ = 5; // Replace with the length of a side of your hexagon\nconst hexagonArea\
    \ = calculateHexagonArea(sideLength);\nconsole.log(`The area of the hexagon is:\
    \ ${hexagonArea.toFixed(2)}`);\n```\n\n## 148. Check if a Number is a Pronic Number\n\
    \nThis program checks if a given non-negative integer is a pronic number, also\
    \ known as a rectangular number or oblong number. A pronic number is a product\
    \ of two consecutive integers. The nth pronic number is given by the formula:\
    \ `n * (n + 1)`.\n\n```javascript\nfunction isPronicNumber(number) {\n  for (let\
    \ i = 0; i * (i + 1) <= number; i++) {\n    if (i * (i + 1) === number) {\n  \
    \    return true;\n    }\n  }\n  return false;\n}\n\n// Example usage\nconst pronicNumber\
    \ = 6; // Replace with the number you want to check\nif (isPronicNumber(pronicNumber))\
    \ {\n  console.log(`${pronicNumber} is a Pronic Number!`);\n} else {\n  console.log(`${pronicNumber}\
    \ is not a Pronic Number.`);\n}\n```\n\n## 149. Basic Minesweeper Game\n\nCreating\
    \ a basic Minesweeper game involves generating a grid with mines and numbers,\
    \ allowing the player to uncover cells, and providing feedback on the presence\
    \ of mines.\n\n```javascript\nclass MinesweeperGame {\n  constructor(rows, cols,\
    \ numMines) {\n    this.rows = rows;\n    this.cols = cols;\n    this.numMines\
    \ = numMines;\n    this.board = this.createBoard();\n    this.gameOver = false;\n\
    \  }\n\n  createBoard() {\n    const board = Array.from({ length: this.rows },\
    \ () => Array(this.cols).fill(0));\n\n    // Place mines randomly\n    for (let\
    \ i = 0; i < this.numMines; i++) {\n      let row, col;\n      do {\n        row\
    \ = Math.floor(Math.random() * this.rows);\n        col = Math.floor(Math.random()\
    \ * this.cols);\n      } while (board[row][col] === 'X');\n      board[row][col]\
    \ = 'X';\n    }\n\n    // Calculate numbers around mines\n    for (let i = 0;\
