    function findMaxIntegerForSum(targetSum) {\n  let currentSum = 0;\n  let maxInteger\
    \ = 0;\n\n  while (currentSum + maxInteger + 1 <= targetSum) {\n    maxInteger++;\n\
    \    currentSum += maxInteger;\n  }\n\n  console.log(`Maximum Integer (n) for\
