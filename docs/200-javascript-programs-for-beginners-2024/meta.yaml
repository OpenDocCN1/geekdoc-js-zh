    \ the specified range and adds them up to find the total sum.\n\n```javascript\n\
    function sumOfCubes(upToInteger) {\n  let cubesSum = 0;\n\n  for (let i = 1; i\
    \ <= upToInteger; i++) {\n    // Calculate the cube of each integer and add to\
    \ sum\n    cubesSum += Math.pow(i, 3);\n  }\n\n  console.log(`Sum of Cubes from\
    \ 1 to ${upToInteger}: ${cubesSum}`);\n}\n\n// Example: Compute the sum of cubes\
    \ up to the integer 5\nsumOfCubes(5);\n```\n\n## 205. Maximum Integer for Sum\n\
    \nThis program finds the maximum integer **n** such that the sum of integers from\
