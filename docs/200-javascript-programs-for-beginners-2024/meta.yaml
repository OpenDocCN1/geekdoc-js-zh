    \ Common Divisor (GCD), also known as the Greatest Common Factor (GCF) or Highest\
    \ Common Factor (HCF), is the largest positive integer that divides both numbers\
    \ without leaving a remainder. There are different algorithms to calculate the\
    \ GCD of two numbers, and one commonly used algorithm is the Euclidean Algorithm.\n\
    \n```\nfunction calculateGCD(a, b) {\n  // Check if the inputs are valid numbers\n\
