    \nconsole.log(`The distance between (${x1}, ${y1}) and (${x2}, ${y2}) is ${result.toFixed(2)}`);\n\
    ```\n\n## 104. 检查一个数是否为完全平方数\n\n要在 JavaScript 中检查一个数是否为完全平方数，可以计算该数的平方根，然后检查平方根整数部分的平方是否等于原始数字。\n\
    \n```javascript\nfunction isPerfectSquare(number) {\n  // Check if the input is\
