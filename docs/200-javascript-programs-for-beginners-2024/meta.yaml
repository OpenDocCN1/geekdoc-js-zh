    \  console.log(\"Please enter a valid non-negative integer.\");\n}\n```\n\n##\
    \ 32. 查找字符的 ASCII 值\n\n此程序提示用户输入一个字符，然后计算并显示其 ASCII 值。\n\n```javascript\n// 提示用户输入一个字符\n\
