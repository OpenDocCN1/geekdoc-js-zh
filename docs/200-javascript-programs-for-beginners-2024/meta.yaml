    Enter the third number:\"));\n\n// Check if inputs are valid numbers\nif (!isNaN(num1)\
    \ && !isNaN(num2) && !isNaN(num3)) {\n  // Find the largest among the three numbers\n\
    \  let largestNumber = Math.max(num1, num2, num3);\n  console.log(\n    `The largest\
    \ number among ${num1}, ${num2}, and ${num3} is: ${largestNumber}`\n  );\n} else\
    \ {\n  console.log(\"Please enter valid numbers for all three inputs.\");\n}\n\
    ```\n\n## 13. Check Prime Number\n\nThis program prompts the user to enter a number\
    \ and checks whether it is a prime number or not. It then displays the result.\n\
    \n```javascript\n// Prompt user for a number\nlet number = parseInt(prompt(\"\
    Enter a number:\"));\n\n// Check if input is a valid integer greater than 1\n\
    if (!isNaN(number) && Number.isInteger(number) && number > 1) {\n  let isPrime\
    \ = true;\n\n  // Check for factors from 2 to the square root of the number\n\
    \  for (let i = 2; i <= Math.sqrt(number); i++) {\n    if (number % i === 0) {\n\
    \      isPrime = false;\n      break;\n    }\n  }\n\n  // Display the result\n\
    \  if (isPrime) {\n    console.log(`${number} is a prime number.`);\n  } else\
    \ {\n    console.log(`${number} is not a prime number.`);\n  }\n} else {\n  console.log(\"\
    Please enter a valid integer greater than 1.\");\n}\n```\n\n## 14. Print All Prime\
    \ Numbers in an Interval\n\nThis program prompts the user to enter a starting\
    \ and ending number for an interval and then prints all the prime numbers within\
    \ that interval.\n\n```javascript\n// Prompt user for the interval\nlet startNumber\
    \ = parseInt(\n  prompt(\"Enter the starting number of the interval:\")\n);\n\
    let endNumber = parseInt(prompt(\"Enter the ending number of the interval:\"));\n\
    \n// Check if inputs are valid integers and the startNumber is less than the endNumber\n\
    if (\n  !isNaN(startNumber) &&\n  !isNaN(endNumber) &&\n  Number.isInteger(startNumber)\
    \ &&\n  Number.isInteger(endNumber) &&\n  startNumber < endNumber &&\n  startNumber\
    \ > 1\n) {\n  console.log(`Prime numbers in the interval [${startNumber}, ${endNumber}]:\
    \ `);\n\n  // Check for prime numbers in the interval\n  for (let i = startNumber;\
    \ i <= endNumber; i++) {\n    let isPrime = true;\n    for (let j = 2; j <= Math.sqrt(i);\
    \ j++) {\n      if (i % j === 0) {\n        isPrime = false;\n        break;\n\
    \      }\n    }\n\n    if (isPrime) {\n      console.log(i);\n    }\n  }\n} else\
    \ {\n  console.log(\n    \"Please enter valid integers, ensuring that the starting\
    \ number is less than the ending number and greater than 1.\"\n  );\n}\n```\n\n\
    ## 15. Find the Factorial of a Number\n\nThis program calculates the factorial\
    \ of a given number. The factorial of a non-negative integer n, denoted as n!,\
    \ is the product of all positive integers less than or equal to n.\n\n```javascript\n\
    // Prompt user for a non-negative integer\nlet number = parseInt(prompt(\"Enter\
    \ a non-negative integer:\"));\n\n// Check if input is a valid non-negative integer\n\
    if (!isNaN(number) && Number.isInteger(number) && number >= 0) {\n  // Calculate\
    \ the factorial\n  let factorial = 1;\n  for (let i = 1; i <= number; i++) {\n\
    \    factorial *= i;\n  }\n\n  console.log(`The factorial of ${number} is: ${factorial}`);\n\
    } else {\n  console.log(\"Please enter a valid non-negative integer.\");\n}\n\
    ```\n\n## 16. Display the Multiplication Table\n\nThis program prompts the user\
    \ to enter a number and displays its multiplication table up to a specified range\
    \ (e.g., up to 10).\n\n```javascript\n// Prompt user for a number\nlet number\
    \ = parseInt(prompt(\"Enter a number for the multiplication table:\"));\n\n//\
