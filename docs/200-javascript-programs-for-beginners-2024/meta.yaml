- md: "## 140. Find the Area of a Regular Polygon\n\nThis program calculates the area\
    \ of a regular polygon given the number of sides ( n ) and the side length ( s\
    \ ). The formula for the area of a regular polygon is Area = (n * s^2) / (4 *\
    \ tan(π/n)) , where n is the number of sides, s is the side length, and tan is\
    \ the tangent function.\n\n```javascript\nfunction calculateRegularPolygonArea(n,\
    \ s) {\n  const numerator = 1 / 4 * n * Math.pow(s, 2);\n  const denominator =\
    \ Math.tan(Math.PI / n);\n  const area = numerator / denominator;\n  return area;\n\
    }\n```\n\n```javascript\n// Example usage\nconst numberOfSides = 6; // Replace\
    \ with the number of sides of your polygon\nconst sideLength = 5;  // Replace\
    \ with the length of each side of your polygon\n\nconst polygonArea = calculateRegularPolygonArea(numberOfSides,\
    \ sideLength);\nconsole.log(`The area of the regular polygon is: ${polygonArea.toFixed(2)}`);\n\
    ```\n\n## 141. Check if a Number is an Abundant Number\n\nAn abundant number (or\
    \ excessive number) is a positive integer that is smaller than the sum of its\
    \ proper divisors, excluding itself. The sum of proper divisors is greater than\
    \ the number itself.\n\n```javascript\nfunction getProperDivisorsSum(number) {\n\
    \  let sum = 0;\n  for (let i = 1; i <= Math.floor(number / 2); i++) {\n    if\
    \ (number % i === 0) {\n      sum += i;\n    }\n  }\n  return sum;\n}\n\nfunction\
    \ isAbundantNumber(number) {\n  const divisorsSum = getProperDivisorsSum(number);\n\
    \  return divisorsSum > number;\n}\n\n// Example usage\nconst numberToCheck =\
    \ 12; // Replace with the number you want to check\nif (isAbundantNumber(numberToCheck))\
    \ {\n  console.log(`${numberToCheck} is an Abundant Number! \U0001F389\U0001F389\
    `);\n} else {\n  console.log(`${numberToCheck} is not an Abundant Number. \U0001F641\
    \U0001F641`);\n}\n```\n\n## 142. Basic Word Guessing Game\n\nCreating a basic\
    \ word guessing game in a console environment involves generating a random word,\
    \ allowing the player to make guesses, and providing feedback on correct and incorrect\
    \ guesses.\n\n```javascript\nclass WordGuessingGame {\n  constructor(wordList)\
    \ {\n    this.wordList = wordList;\n    this.selectedWord = this.getRandomWord();\n\
    \    this.guesses = [];\n    this.maxAttempts = 6;\n  }\n\n  getRandomWord() {\n\
    \    const randomIndex = Math.floor(Math.random() * this.wordList.length);\n \
    \   return this.wordList[randomIndex].toUpperCase();\n  }\n\n  displayWord() {\n\
    \    return this.selectedWord\n      .split('')\n      .map(letter => (this.guesses.includes(letter)\
    \ ? letter : '_'))\n      .join(' ');\n  }\n\n  makeGuess(letter) {\n    letter\
    \ = letter.toUpperCase();\n\n    if (!this.guesses.includes(letter)) {\n     \
    \ this.guesses.push(letter);\n      if (!this.selectedWord.includes(letter)) {\n\
    \        this.maxAttempts--;\n\n        if (this.maxAttempts === 0) {\n      \
    \    console.log(`Sorry, you're out of attempts. The word was: ${this.selectedWord}`);\n\
    \          process.exit();\n        }\n      }\n    }\n\n    console.log(`Attempts\
    \ left: ${this.maxAttempts}`);\n    console.log(`Current word: ${this.displayWord()}`);\n\
    \n    if (!this.displayWord().includes('_')) {\n      console.log('Congratulations!\
    \ You guessed the word!');\n      process.exit();\n    }\n  }\n}\n```\n\n```javascript\n\
    // Example usage\nconst wordList = ['javascript', 'python', 'java', 'ruby', 'typescript'];\n\
    const game = new WordGuessingGame(wordList);\n\nconsole.log('Welcome to the Word\
    \ Guessing Game!');\nconsole.log(`Attempts left: ${game.maxAttempts}`);\nconsole.log(`Current\
    \ word: ${game.displayWord()}`);\n\n// Simulate the game loop (you can replace\
