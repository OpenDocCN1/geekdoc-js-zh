    \ {\n  // Specify the range for the multiplication table\n  const range = 10;\n\
    \n  console.log(`Multiplication table for ${number} (up to ${range}):`);\n\n \
    \ // Display the multiplication table\n  for (let i = 1; i <= range; i++) {\n\
    \    let result = number * i;\n    console.log(`${number} x ${i} = ${result}`);\n\
    \  }\n} else {\n  console.log(\"Please enter a valid integer.\");\n}\n```\n\n\
    ## 17. Print the Fibonacci Sequence\n\nThis program prompts the user to enter\
    \ the number of terms and then prints the Fibonacci sequence up to that number\
    \ of terms. The Fibonacci sequence is a series of numbers where each number is\
    \ the sum of the two preceding ones, usually starting with 0 and 1.\n\n```javascript\n\
    // Prompt user for the number of terms in the Fibonacci sequence\nlet numTerms\
    \ = parseInt(\n  prompt(\"Enter the number of terms in the Fibonacci sequence:\"\
    )\n);\n\n// Check if input is a valid integer\nif (!isNaN(numTerms) && Number.isInteger(numTerms)\
    \ && numTerms > 0) {\n  console.log(`Fibonacci sequence of ${numTerms} terms:\
    \ `);\n\n  let fibArray = [0, 1];\n\n  // Generate the Fibonacci sequence\n  for\
    \ (let i = 2; i < numTerms; i++) {\n    fibArray[i] = fibArray[i - 1] + fibArray[i\
    \ - 2];\n  }\n\n  console.log(fibArray.join(\", \"));\n} else {\n  console.log(\"\
    Please enter a valid positive integer for the number of terms.\");\n}\n```\n\n\
    ## 18. Check Armstrong Number\n\nThis program prompts the user to enter a number\
    \ and checks whether it is an Armstrong number or not. An Armstrong number (also\
    \ known as a narcissistic number or pluperfect digital invariant) is a number\
    \ that is the sum of its own digits each raised to the power of the number of\
    \ digits in the number. For example, 153 is an Armstrong number because $1^3 +\
    \ 5^3 + 3^3 = 153$.\n\n```javascript\n// Prompt user for a number\nlet number\
    \ = parseInt(prompt(\"Enter a number:\"));\n\n// Check if input is a valid positive\
    \ integer\nif (!isNaN(number) && Number.isInteger(number) && number > 0) {\n \
    \ let originalNumber = number;\n  let numberOfDigits = originalNumber.toString().length;\n\
    \  let sum = 0;\n\n  // Calculate the sum of digits each raised to the power of\
    \ the number of digits\n  while (originalNumber > 0) {\n    let digit = originalNumber\
    \ % 10;\n    sum += Math.pow(digit, numberOfDigits);\n    originalNumber = Math.floor(originalNumber\
    \ / 10);\n  }\n\n  // Check if the number is an Armstrong number\n  if (sum ===\
    \ number) {\n    console.log(`${number} is an Armstrong number.`);\n  } else {\n\
    \    console.log(`${number} is not an Armstrong number.`);\n  }\n} else {\n  console.log(\"\
    Please enter a valid positive integer.\");\n}\n```\n\n## 19. Find Armstrong Number\
    \ in an Interval\n\nThis program prompts the user to enter a range (start and\
    \ end) and then prints all Armstrong numbers within that interval.\n\n```javascript\n\
    // Prompt user for the interval\nlet startNumber = parseInt(\n  prompt(\"Enter\
    \ the starting number of the interval:\")\n);\nlet endNumber = parseInt(prompt(\"\
    Enter the ending number of the interval:\"));\n\n// Check if inputs are valid\
    \ positive integers and the startNumber is less than the endNumber\nif (\n  !isNaN(startNumber)\
    \ &&\n  !isNaN(endNumber) &&\n  Number.isInteger(startNumber) &&\n  Number.isInteger(endNumber)\
    \ &&\n  startNumber > 0 &&\n  startNumber < endNumber\n) {\n  console.log(\n \
    \   `Armstrong numbers in the interval [${startNumber}, ${endNumber}]: `\n  );\n\
    \n  // Check for Armstrong numbers in the interval\n  for (let i = startNumber;\
    \ i <= endNumber; i++) {\n    let originalNumber = i;\n    let numberOfDigits\
    \ = originalNumber.toString().length;\n    let sum = 0;\n\n    while (originalNumber\
