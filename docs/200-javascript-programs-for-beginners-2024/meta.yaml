    \nconsole.log(`${totalDays} days is approximately ${result.years} years, ${result.months}\
    \ months, and ${result.remainingDays} days.`);\n```\n\n## 102. 查找数组的中位数\n\n要在\
    \ JavaScript 中查找数组的中位数，可以创建一个函数，先对数组进行排序，然后根据其长度确定中位数。\n\n```javascript\nfunction\
    \ findMedian(arr) {\n  // Check if the input is a valid array\n  if (!Array.isArray(arr)\
    \ || arr.length === 0) {\n    return \"Invalid input. Please provide a non-empty\
    \ array.\";\n  }\n\n  // Sort the array\n  const sortedArray = arr.slice().sort((a,\
    \ b) => a - b);\n\n  // Calculate the median\n  const middleIndex = Math.floor(sortedArray.length\
    \ / 2);\n\n  if (sortedArray.length % 2 === 0) {\n    // If the array has an even\
    \ number of elements, return the average of the middle two\n    const median =\
    \ (sortedArray[middleIndex - 1] + sortedArray[middleIndex]) / 2;\n    return median;\n\
    \  } else {\n    // If the array has an odd number of elements, return the middle\
