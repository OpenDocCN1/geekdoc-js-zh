- md: "## 91. Find the Sum of Digits in a Number\n\nTo find the sum of digits in a\
    \ number using JavaScript, you can use a loop to iterate through each digit and\
    \ add them together.\n\n```javascript\nfunction sumOfDigits(number) {\n  // Check\
    \ if the input is a valid number\n  if (isNaN(number) || !Number.isInteger(number)\
    \ || number < 0) {\n    return \"Invalid input. Please provide a non-negative\
    \ integer.\";\n  }\n\n  // Convert the number to a string to iterate through its\
    \ digits\n  const digitsArray = String(number).split(\"\").map(Number);\n\n  //\
    \ Calculate the sum of digits\n  const sum = digitsArray.reduce((acc, digit) =>\
    \ acc + digit, 0);\n\n  return sum;\n}\n\n// Example usage:\nconst inputNumber\
    \ = 12345;\nconst result = sumOfDigits(inputNumber);\n\nconsole.log(`The sum of\
    \ digits in ${inputNumber} is: ${result}`);\n```\n\n## 92. Check if a String is\
    \ a Palindromic Phrase\n\nTo check if a string is a palindromic phrase in JavaScript,\
    \ you can create a function that removes non-alphanumeric characters and compares\
    \ the string with its reversed version.\n\n```javascript\nfunction isPalindromicPhrase(str)\
    \ {\n  // Check if the input is a valid string\n  if (typeof str !== 'string')\
    \ {\n    return \"Invalid input. Please provide a string.\";\n  }\n\n  // Remove\
    \ non-alphanumeric characters and convert to lowercase\n  const cleanedStr = str.replace(/[^a-zA-Z0-9]/g,\
    \ \"\").toLowerCase();\n\n  // Compare the cleaned string with its reversed version\n\
    \  return cleanedStr === cleanedStr.split(\"\").reverse().join(\"\");\n}\n\n//\
    \ Example usage:\nconst phrase1 = \"A man, a plan, a canal, Panama!\";\nconst\
    \ phrase2 = \"Hello, world!\";\n\nconsole.log(`Is \"${phrase1}\" a palindromic\
    \ phrase? ${isPalindromicPhrase(phrase1)}`);\nconsole.log(`Is \"${phrase2}\" a\
    \ palindromic phrase? ${isPalindromicPhrase(phrase2)}`);\n```\n\n## 93. Generate\
    \ a Random Password\n\nTo generate a random password in JavaScript, you can create\
    \ a function that combines random characters from various character sets.\n\n\
    ```javascript\nfunction generateRandomPassword(length) {\n  // Define character\
    \ sets\n  const uppercaseChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\n  const lowercaseChars\
    \ = 'abcdefghijklmnopqrstuvwxyz';\n  const numericChars = '0123456789';\n  const\
    \ specialChars = '!@#$%^&*()-_+=';\n\n  // Combine character sets\n  const allChars\
    \ = uppercaseChars + lowercaseChars + numericChars + specialChars;\n\n  // Check\
    \ if the input length is a valid positive number\n  if (!Number.isInteger(length)\
    \ || length <= 0) {\n    return \"Invalid input. Please provide a positive integer\
    \ for the password length.\";\n  }\n\n  // Generate the random password\n  let\
    \ password = '';\n  for (let i = 0; i < length; i++) {\n    const randomIndex\
    \ = Math.floor(Math.random() * allChars.length);\n    password += allChars.charAt(randomIndex);\n\
    \  }\n\n  return password;\n}\n\n// Example usage:\nconst passwordLength = 12;\n\
    const randomPassword = generateRandomPassword(passwordLength);\n\nconsole.log(`Generated\
    \ Password: ${randomPassword}`);\n```\n\n## 94. Calculate Simple Interest\n\n\
    Program To calculate simple interest in JavaScript:\n\n```javascript\nfunction\
    \ calculateSimpleInterest(principal, rate, time) {\n  // Check if the inputs are\
    \ valid positive numbers\n  if (isNaN(principal) || isNaN(rate) || isNaN(time)\
    \ || principal <= 0 || rate <= 0 || time <= 0) {\n    return \"Invalid inputs.\
    \ Please provide valid positive numbers.\";\n  }\n\n  // Calculate simple interest\n\
    \  const simpleInterest = (principal * rate * time) / 100;\n\n  return simpleInterest;\n\
    }\n\n// Example usage:\nconst principalAmount = 1000;\nconst interestRate = 5;\
    \ // 5%\nconst investmentTime = 2; // 2 years\n\nconst interestAmount = calculateSimpleInterest(principalAmount,\
    \ interestRate, investmentTime);\n\nconsole.log(`Principal Amount: $${principalAmount}`);\n\
    console.log(`Interest Rate: ${interestRate}%`);\nconsole.log(`Investment Time:\
    \ ${investmentTime} years`);\nconsole.log(`Simple Interest: $${interestAmount}`);\n\
    ```\n\n## 95. Implement a Basic Stopwatch\n\nTo implement a basic stopwatch in\
    \ JavaScript, you can use the `Date` object to measure the elapsed time.\n\n```javascript\n\
    let startTime;\nlet stopwatchInterval;\n\nfunction startStopwatch() {\n  startTime\
    \ = new Date().getTime();\n  stopwatchInterval = setInterval(updateDisplay, 1000);\n\
    }\n\nfunction stopStopwatch() {\n  clearInterval(stopwatchInterval);\n}\n\nfunction\
    \ resetStopwatch() {\n  stopStopwatch();\n  updateDisplay(0);\n}\n\nfunction updateDisplay()\
    \ {\n  const currentTime = new Date().getTime();\n  const elapsedTime = Math.floor((currentTime\
    \ - startTime) / 1000);\n  const minutes = Math.floor(elapsedTime / 60);\n  const\
    \ seconds = elapsedTime % 60;\n\n  const formattedTime = `${minutes}:${seconds\
    \ < 10 ? \"0\" : \"\"}${seconds}`;\n\n  document.getElementById(\"display\").textContent\
    \ = formattedTime;\n}\n```\n\n## 96. Check if a Number is a Perfect Number\n\n\
    A perfect number is a positive integer that is equal to the sum of its proper\
    \ divisors (excluding itself).\n\n```javascript\nfunction isPerfectNumber(number)\
    \ {\n  // Check if the input is a positive integer\n  if (!Number.isInteger(number)\
    \ || number <= 0) {\n    return \"Invalid input. Please provide a positive integer.\"\
    ;\n  }\n\n  // Find divisors and calculate sum\n  let sum = 0;\n  for (let i =\
    \ 1; i <= Math.floor(number / 2); i++) {\n    if (number % i === 0) {\n      sum\
    \ += i;\n    }\n  }\n\n  // Check if the sum of divisors equals the original number\n\
    \  return sum === number;\n}\n\n// Example usage:\nconst testNumber = 28;\nconst\
    \ result = isPerfectNumber(testNumber);\nconsole.log(`Is ${testNumber} a perfect\
    \ number? ${result}`);\n```\n\n## 97. This program calculates the Volume of a\
    \ Cylinder\n\nThis program calculates the Volume of a Cylinder:\n\n```javascript\n\
    function calculateCylinderVolume(radius, height) {\n  // Check if the inputs are\
    \ valid positive numbers\n  if (isNaN(radius) || isNaN(height) || radius <= 0\
    \ || height <= 0) {\n    return \"Invalid inputs. Please provide valid positive\
    \ numbers.\";\n  }\n\n  // Calculate the volume of the cylinder\n  const volume\
    \ = Math.PI * Math.pow(radius, 2) * height;\n\n  return volume;\n}\n\n// Example\
    \ usage:\nconst cylinderRadius = 5;\nconst cylinderHeight = 10;\n\nconst cylinderVolume\
    \ = calculateCylinderVolume(cylinderRadius, cylinderHeight);\n\nconsole.log(`Cylinder\
    \ Volume: ${cylinderVolume.toFixed(2)} cubic units`);\n```\n\n## 98. Generate\
    \ a Random Quote\n\nTo generate a random quote in JavaScript, you can create an\
    \ array of quotes and use a function to pick a random quote from that array.\n\
    \n```javascript\nfunction generateRandomQuote() {\n  const quotes = [\n    \"\
    The only way to do great work is to love what you do. - Steve Jobs\",\n    \"\
    In three words I can sum up everything I've learned about life: it goes on. -\
    \ Robert Frost\",\n    \"The greatest glory in living lies not in never falling,\
    \ but in rising every time we fall. - Nelson Mandela\",\n    \"Life is what happens\
    \ when you're busy making other plans. - John Lennon\",\n    \"Get busy living\
    \ or get busy dying. - Stephen King\"\n    // Add more quotes as needed\n  ];\n\
    \n  // Generate a random index to pick a quote from the array\n  const randomIndex\
    \ = Math.floor(Math.random() * quotes.length);\n\n  // Return the randomly selected\
    \ quote\n  return quotes[randomIndex];\n}\n\n// Example usage:\nconst randomQuote\
    \ = generateRandomQuote();\nconsole.log(\"Random Quote:\", randomQuote);\n```\n\
    \n## 99. Find the Intersection of Two Arrays\n\nTo find the intersection of two\
    \ arrays in JavaScript, you can create a function that iterates through both arrays\
    \ and identifies the common elements.\n\n```javascript\nfunction findIntersection(arr1,\
    \ arr2) {\n  // Check if the inputs are valid arrays\n  if (!Array.isArray(arr1)\
    \ || !Array.isArray(arr2)) {\n    return \"Invalid inputs. Please provide valid\
    \ arrays.\";\n  }\n\n  // Use a Set to store unique elements of the first array\n\
    \  const set = new Set(arr1);\n\n  // Filter the second array to include only\
    \ elements present in the set\n  const intersection = arr2.filter(element => set.has(element));\n\
    \n  return intersection;\n}\n\n// Example usage:\nconst array1 = [1, 2, 3, 4,\
    \ 5];\nconst array2 = [3, 4, 5, 6, 7];\n\nconst result = findIntersection(array1,\
    \ array2);\n```"
  mdcn: "## 91. 计算数字各位数之和\n\n要在 JavaScript 中计算一个数字的各位数之和，可以使用循环遍历每一位数字并将它们相加。\n\n\
