  mdcn: "## 119. 检查一个字符串是否是另一个字符串的变位词\n\n变位词是通过重新排列另一个单词或短语的字母而形成的。要检查两个字符串是否是变位词，可以比较两个字符串中的字符是否具有相同的频率。\n\
