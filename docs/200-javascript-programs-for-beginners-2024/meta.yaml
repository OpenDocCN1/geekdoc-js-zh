    \    this.matches = 0;\n  }\n\n  shuffleCards() {\n    for (let i = this.cards.length\
    \ - 1; i > 0; i--) {\n      const j = Math.floor(Math.random() * (i + 1));\n \
    \     [this.cards[i], this.cards[j]] = [this.cards[j], this.cards[i]];\n    }\n\
