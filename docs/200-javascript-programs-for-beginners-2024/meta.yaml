    \ that the starting number is less than the ending number and greater than 1.\"\
    \n  );\n}\n```\n\n## 15. 计算一个数的阶乘\n\n此程序计算给定数字的阶乘。一个非负整数 n 的阶乘，记作 n!，是所有小于或等于\
    \ n 的正整数的乘积。\n\n```javascript\n// 提示用户输入一个非负整数\nlet number = parseInt(prompt(\"\
    Enter a non-negative integer:\"));\n\n// 检查输入是否为有效的非负整数\nif (!isNaN(number) &&\
