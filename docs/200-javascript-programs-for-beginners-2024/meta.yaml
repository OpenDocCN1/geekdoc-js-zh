    \ target);\n}\n\n// 示例用法\nconst numberOfDisks = 3;\nconst sourcePeg = 'A';\nconst\
    \ auxiliaryPeg = 'B';\nconst targetPeg = 'C';\n\nconsole.log(`Tower of Hanoi solution\
    \ for ${numberOfDisks} disks:`);\ntowerOfHanoi(numberOfDisks, sourcePeg, auxiliaryPeg,\
    \ targetPeg);\n```\n\n## 165. 计算圆台的面积\n\n此程序根据给定的上底半径（r1）、下底半径（r2）和斜高（l）计算圆台的表面积。圆台的表面积公式为：表面积\
    \ = π * (r1 + r2) * l + π * r1^2 + π * r2^2，其中 π 是数学常数圆周率。\n\n```javascript\n\
    function surfaceAreaOfFrustum(r1, r2, l) {\n  const surfaceArea = Math.PI * (r1\
    \ + r2) * l + Math.PI * r1 ** 2 + Math.PI * r2 ** 2;\n  console.log(`Surface Area\
    \ of the frustum is: ${surfaceArea}`);\n}\n\n// 示例：计算上底半径为 4、下底半径为 8、斜高为 6 的圆台的表面积\n\
