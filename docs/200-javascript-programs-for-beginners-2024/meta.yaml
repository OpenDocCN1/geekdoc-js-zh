    const feetValue = 10;\nconst metersValue = feetToMeters(feetValue);\n\nconsole.log(`${feetValue}\
    \ feet is equal to ${metersValue.toFixed(2)} meters`);\n```\n\n## 101. 将天数转换为年、月和天\n\
    \n要在 JavaScript 中将给定的天数转换为年、月和剩余的天数，可以使用以下函数：\n\n```javascript\nfunction convertDaysToYearsMonthsDays(days)\
    \ {\n  // Check if the input is a valid positive number\n  if (isNaN(days) ||\
    \ days <= 0) {\n    return \"Invalid input. Please provide a valid positive number\
    \ of days.\";\n  }\n\n  // Calculate years\n  const years = Math.floor(days /\
    \ 365);\n\n  // Calculate remaining days after removing years\n  const remainingDaysAfterYears\
    \ = days % 365;\n\n  // Calculate months\n  const months = Math.floor(remainingDaysAfterYears\
    \ / 30);\n\n  // Calculate remaining days after removing months\n  const remainingDaysAfterMonths\
    \ = remainingDaysAfterYears % 30;\n\n  return {\n    years,\n    months,\n   \
    \ remainingDays: remainingDaysAfterMonths\n  };\n}\n\n// Example usage:\nconst\
