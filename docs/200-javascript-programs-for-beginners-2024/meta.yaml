    \    console.log('Game over! You hit a mine.');\n      this.gameOver = true;\n\
    \    } else if (cell === 0) {\n      this.board[row][col] = ' ';\n      this.uncoverNeighbors(row,\
    \ col);\n    } else {\n      this.board[row][col] = cell.toString();\n    }\n\n\
    \    this.checkWin();\n  }\n\n  uncoverNeighbors(row, col) {\n    for (let i =\
    \ row - 1; i <= row + 1; i++) {\n      for (let j = col - 1; j <= col + 1; j++)\
