  - "[PAGE 347]\n\n# 203. Sum of Digits in String\n\nThis program computes the sum\
    \ of all the digits that occur in a given string. It identifies digits in the\
    \ string and adds them up to calculate the total sum.\n\n```\nfunction sumOfDigitsInString(inputString)\
    \ {\n  let digitSum = 0;\n\n  for (const char of inputString) {\n    // Check\
    \ if the character is a digit\n    if (/\\d/.test(char)) {\n      // Convert the\
    \ digit character to its numerical value and add to sum\n      digitSum += parseInt(char,\
    \ 10);\n    }\n  }\n\n  console.log(`Original String: ${inputString}`);\n  console.log(`Sum\
    \ of Digits in the String: ${digitSum}`);\n}\n\n// Example: Compute the sum of\
    \ digits in the string \"abc123xyz456\"\nsumOfDigitsInString(\"abc123xyz456\"\
    );\n```"
  - "[PAGE 348]\n\n# 204. Sum of Cubes\n\nThis program computes the sum of cubes of\
    \ all integers from 1 to a given integer. It calculates the cube of each integer\
    \ in the specified range and adds them up to find the total sum.\n\n```\nfunction\
    \ sumOfCubes(upToInteger) {\n  let cubesSum = 0;\n\n  for (let i = 1; i <= upToInteger;\
    \ i++) {\n    // Calculate the cube of each integer and add to sum\n    cubesSum\
    \ += Math.pow(i, 3);\n  }\n\n  console.log(`Sum of Cubes from 1 to ${upToInteger}:\
    \ ${cubesSum}`);\n}\n\n// Example: Compute the sum of cubes up to the integer\
    \ 5\nsumOfCubes(5);\n```"
  - "[PAGE 349]\n\n# 205. Maximum Integer for Sum\n\nThis program finds the maximum\
    \ integer **n** such that the sum of integers from 1 to **n** (inclusive) does\
    \ not exceed a given target sum **targetSum**. It calculates the sum using the\
    \ formula **Sum = n * (n + 1) / 2**.\n\n```\nfunction findMaxIntegerForSum(targetSum)\
    \ {\n  let currentSum = 0;\n  let maxInteger = 0;\n\n  while (currentSum + maxInteger\
    \ + 1 <= targetSum) {\n    maxInteger++;\n    currentSum += maxInteger;\n  }\n\
    \n  console.log(`Maximum Integer (n) for Sum <= ${targetSum}: ${maxInteger}`);\n\
    }\n\n// Example: Find the maximum integer for the sum <= 15\nfindMaxIntegerForSum(15);\n\
    ```"
  - "[PAGE 350]\n\n# 206. URL Breakdown\n\nThis program breaks a URL address into\
    \ its parts and puts them into an array. The URL structure considered is `scheme://domain[/:path]`,\
    \ where `path` is optional.\n\n```\nfunction breakURL(url) {\n  const urlParts\
    \ = {};\n  const urlRegex = /^(\\w+):\\/\\/([\\w.-]+)(\\/.*)?$/;\n  const matches\
    \ = url.match(urlRegex);\n\n  if (!matches) {\n    console.log(\"Invalid URL format.\"\
    );\n    return;\n  }\n\n  urlParts.scheme = matches[1];\n  urlParts.domain = matches[2];\n\
    \  urlParts.path = matches[3] || \"\";\n\n  console.log(\"URL Parts:\");\n  console.log(urlParts);\n\
    }\n\n// Example: Breakdown the URL \"https://www.example.org/page\"\nbreakURL(\"\
    https://www.example.org/page\");\n```"
  - "[PAGE 351]\n\n# # 207. Sort Strings by Length\n\nThis program sorts the strings\
    \ of a given array of strings in order of increasing length. It uses the `Array.sort`\
    \ method to achieve the desired order.\n\n```\njavascript\nfunction sortStringsByLength(stringsArray)\
    \ {\n  const sortedArray = stringsArray.slice().sort((a, b) => a.length - b.length);\n\
    \n  console.log(\"Original Array of Strings:\");\n  console.log(stringsArray);\n\
