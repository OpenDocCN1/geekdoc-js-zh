    \n## 30. 使用递归计算数字的阶乘\n\n此程序使用递归计算给定非负整数的阶乘。它提示用户输入一个非负整数，然后使用递归函数计算并显示其阶乘。\n\n\
    ```javascript\n// 使用递归计算阶乘的函数\nfunction factorial(n) {\n  if (n === 0 || n ===\
    \ 1) {\n    return 1;\n  } else {\n    return n * factorial(n - 1);\n  }\n}\n\n\
    // 提示用户输入一个非负整数\nlet number = parseInt(prompt(\"Enter a non-negative integer:\"\
    ));\n\n// 检查输入是否为有效的非负整数\nif (!isNaN(number) && Number.isInteger(number) && number\
