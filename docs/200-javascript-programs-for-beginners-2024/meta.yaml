    \n  return true;\n}\n\n// Example usage\nconst inputString = \"The quick brown\
    \ fox jumps over the lazy dog\";\nif (isPangram(inputString)) {\n  console.log('The\
    \ given string is a pangram! ✅✅');\n} else {\n  console.log('The given string\
    \ is not a pangram. ❌❌');\n}\n```\n\n## 130. Basic Sudoku Solver\n\nThis program\
    \ solves a basic 9x9 Sudoku puzzle using a backtracking algorithm. The solver\
    \ fills in the empty cells of the Sudoku grid by recursively trying numbers until\
    \ a solution is found.\n\n```\n// Function to check if a number can be placed\
    \ in a particular cell\nfunction isSafe(board, row, col, num) {\n  // Check if\
    \ 'num' is not present in the current row and column\n  for (let i = 0; i < 9;\
    \ i++) {\n    if (board[row][i] === num || board[i][col] === num) {\n      return\
    \ false;\n    }\n  }\n\n  // Check if 'num' is not present in the 3x3 subgrid\n\
    \  const startRow = Math.floor(row / 3) * 3;\n  const startCol = Math.floor(col\
    \ / 3) * 3;\n  for (let i = 0; i < 3; i++) {\n    for (let j = 0; j < 3; j++)\
    \ {\n      if (board[startRow + i][startCol + j] === num) {\n        return false;\n\
    \      }\n    }\n  }\n\n  return true;\n}\n\n// Function to find an empty cell\
    \ in the Sudoku grid\nfunction findEmptyCell(board) {\n  for (let row = 0; row\
    \ < 9; row++) {\n    for (let col = 0; col < 9; col++) {\n      if (board[row][col]\
    \ === 0) {\n        return [row, col];\n      }\n    }\n  }\n  return null;\n\
    }\n\n// Function to solve the Sudoku puzzle using backtracking\nfunction solveSudoku(board)\
    \ {\n  const emptyCell = findEmptyCell(board);\n\n  if (!emptyCell) {\n    //\
    \ No empty cell found, the puzzle is solved\n    return true;\n  }\n\n  const\
    \ [row, col] = emptyCell;\n\n  // Try filling the empty cell with numbers 1 to\
    \ 9\n  for (let num = 1; num <= 9; num++) {\n    if (isSafe(board, row, col, num))\
    \ {\n      // If placing 'num' in the current cell is safe, try the next step\n\
    \      board[row][col] = num;\n\n      // Recursively attempt to solve the rest\
    \ of the puzzle\n      if (solveSudoku(board)) {\n        return true;\n     \
    \ }\n\n      // If placing 'num' in the current cell leads to an invalid solution,\
    \ backtrack\n      board[row][col] = 0;\n    }\n  }\n\n  // No number from 1 to\
    \ 9 can be placed in the current cell, backtrack\n  return false;\n}\n\n// Example\
    \ usage\nconst sudokuBoard = [\n  [5, 3, 0, 0, 7, 0, 0, 0, 0],\n  [6, 0, 0, 1,\
    \ 9, 5, 0, 0, 0],\n  [0, 9, 8, 0, 0, 0, 0, 6, 0],\n```"
