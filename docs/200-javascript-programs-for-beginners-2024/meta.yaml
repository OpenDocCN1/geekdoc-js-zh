  mdcn: "## 简介\n\n在欣赏这本精彩的书籍之前，JavaScript编程一直很复杂。\n\n专注于最重要的事情——编写代码，从第一个程序到最后一个程序，将帮助你快速提升作为程序员的技能，并为你提供理解以下内容所需的知识：\n\
    \n程序的流程、语法、方向、工作原理、如何向代码添加关键字、做出明智决策等等。\n\n这是一本非常重要的指南，通过它你可以学会创建更多……一旦你解决了一定数量的程序，你将能够发展自己，并将你自己的想法变为现实，甚至无需思考。\n\
    \n## 1. 打印 Hello World\n\n“Hello World”程序是编程中的经典，通常是学习新编程语言时编写的第一个程序。在这种情况下，目标是将文本字符串“Hello,\
    \ World!”打印到浏览器控制台。\n\n```\nconsole.log(\"Hello, World!\");\n```\n\n## 2. 两个数字相加\n\
    \n该程序专注于接收两个数字作为输入，然后显示它们的和。它提示用户输入两个数字，将它们相加，并打印结果。\n\n```\nlet num1 = parseFloat(prompt(\"\
    Enter the first number:\"));\nlet num2 = parseFloat(prompt(\"Enter the second\
    \ number:\"));\n\nif (!isNaN(num1) && !isNaN(num2)) {\n  let sum = num1 + num2;\n\
    \  console.log(`The sum of ${num1} and ${num2} is: ${sum}`);\n} else {\n  console.log(\"\
    Please enter valid numbers.\");\n}\n```\n\n## 3. 求平方根\n\n该程序提示用户输入一个数字并计算其平方根。然后显示结果，确保输入的数字为非负数。\n\
    \n```\nlet inputNumber = parseFloat(prompt(\"Enter a non-negative number:\"));\n\
    \nif (!isNaN(inputNumber) && inputNumber >= 0) {\n  let squareRoot = Math.sqrt(inputNumber);\n\
    \  console.log(`The square root of ${inputNumber} is: ${squareRoot}`);\n} else\
    \ {\n  console.log(\"Please enter a valid non-negative number.\");\n}\n```\n\n\
    ## 4. 计算三角形面积\n\n该程序提示用户输入三角形的底和高，并使用公式：面积 = 1/2 × 底 × 高 来计算其面积。然后显示计算出的面积。\n\n\
    ```\nlet base = parseFloat(prompt(\"Enter the base of the triangle:\"));\nlet\
    \ height = parseFloat(prompt(\"Enter the height of the triangle:\"));\n\nif (!isNaN(base)\
    \ && !isNaN(height) && base > 0 && height > 0) {\n  let area = 0.5 * base * height;\n\
    \  console.log(\n    `The area of the triangle with base ${base} and height ${height}\
    \ is: ${area}`\n  );\n} else {\n  console.log(\"Please enter valid positive numbers\
    \ for base and height.\");\n}\n```\n\n## 5. 交换两个变量\n\n该程序提示用户输入两个变量并交换它们的值。然后显示交换前后的变量。\n\
    \n```\nlet variable1 = prompt(\"Enter the first variable:\");\nlet variable2 =\
    \ prompt(\"Enter the second variable:\");\n\nconsole.log(\n  `Before swapping:\
    \ Variable1 = ${variable1}, Variable2 = ${variable2}`\n);\n\n// Swapping the variables\n\
    let temp = variable1;\nvariable1 = variable2;\nvariable2 = temp;\n\nconsole.log(\n\
    \  `After swapping: Variable1 = ${variable1}, Variable2 = ${variable2}`\n);\n\
    ```\n\n## 6. 求解二次方程\n\n该程序求解形如 ax^2 + bx + c = 0 的二次方程，其中 a、b 和 c 是系数。它使用二次公式来求方程的根。\n\
    \n```\n// Prompt user for coefficients\nlet a = parseFloat(prompt(\"Enter the\
    \ coefficient a:\"));\nlet b = parseFloat(prompt(\"Enter the coefficient b:\"\
    ));\nlet c = parseFloat(prompt(\"Enter the coefficient c:\"));\n\n// Calculate\
    \ the discriminant\nlet discriminant = b ** 2 - 4 * a * c;\n\n// Check if roots\
    \ are real\nif (!isNaN(a) && !isNaN(b) && !isNaN(c)) {\n  if (discriminant > 0)\
    \ {\n    let root1 = (-b + Math.sqrt(discriminant)) / (2 * a);\n    let root2\
    \ = (-b - Math.sqrt(discriminant)) / (2 * a);\n    console.log(\n      `The roots\
    \ of the quadratic equation are: ${root1} and ${root2}`\n    );\n  } else if (discriminant\
    \ === 0) {\n    let root = -b / (2 * a);\n    console.log(`The quadratic equation\
    \ has a repeated root: ${root}`);\n  } else {\n    console.log(\"The quadratic\
    \ equation has complex roots.\");\n  }\n} else {\n  console.log(\"Please enter\
    \ valid numbers for coefficients.\");\n}\n```\n\n## 7. 将公里转换为英里\n\n该程序提示用户输入以公里为单位的距离，并使用转换系数将其转换为英里：1公里约等于0.621371英里。然后显示转换后的距离。\n\
    \n```\n// Prompt user for distance in kilometers\nlet kilometers = parseFloat(prompt(\"\
    Enter the distance in kilometers:\"));\n\n// Conversion factor\nconst kilometersToMilesConversionFactor\
    \ = 0.621371;\n\n// Check if input is a valid number\nif (!isNaN(kilometers))\
    \ {\n  // Convert kilometers to miles\n  let miles = kilometers * kilometersToMilesConversionFactor;\n\
    \  console.log(`${kilometers} kilometers is approximately ${miles} miles.`);\n\
    } else {\n  console.log(\"Please enter a valid number for the distance in kilometers.\"\
    );\n}\n```\n\n## 8. 将摄氏度转换为华氏度\n\n该程序使用公式 F = (C * 9/5) + 32 将温度从摄氏度转换为华氏度，其中\
    \ F 是华氏温度，C 是摄氏温度。\n\n```\n// Prompt user for temperature in Celsius\nlet celsius\
    \ = parseFloat(prompt(\"Enter the temperature in Celsius:\"));\n\n// Check if\
    \ input is a valid number\nif (!isNaN(celsius)) {\n  // Convert Celsius to Fahrenheit\n\
    \  let fahrenheit = (celsius * 9) / 5 + 32;\n  console.log(\n    `${celsius} degrees\
    \ Celsius is equal to ${fahrenheit} degrees Fahrenheit.`\n  );\n} else {\n  console.log(\"\
    Please enter a valid number for the temperature in Celsius.\");\n}\n```\n\n##\
    \ 9. 生成随机数\n\n该程序生成一个用户定义范围内的随机数。它提示用户输入范围的最小值和最大值，然后显示在该范围内生成的随机数。\n\n```\n//\
    \ Prompt user for the range\nlet minRange = parseFloat(prompt(\"Enter the minimum\
    \ value of the range:\"));\nlet maxRange = parseFloat(prompt(\"Enter the maximum\
    \ value of the range:\"));\n\n// Check if input is a valid number\nif (!isNaN(minRange)\
    \ && !isNaN(maxRange) && minRange < maxRange) {\n  // Generate a random number\
    \ within the specified range\n  let randomNumber = Math.random() * (maxRange -\
    \ minRange) + minRange;\n  console.log(\n    `A random number between ${minRange}\
    \ and ${maxRange} is: ${randomNumber}`\n  );\n} else {\n  console.log(\n    \"\
    Please enter valid numbers, ensuring that the minimum value is less than the maximum\
    \ value.\"\n  );\n}\n```\n\n## 10. 检查数字是正数、负数还是零\n\n该程序提示用户输入一个数字，并检查它是正数、负数还是零。然后显示结果。\n\
    \n```\n// Prompt user for a number\nlet number = parseFloat(prompt(\"Enter a number:\"\
    ));\n\n// Check if input is a valid number\nif (!isNaN(number)) {\n  // Check\
    \ if the number is positive, negative, or zero\n  if (number > 0) {\n    console.log(`${number}\
    \ is a positive number.`);\n  } else if (number < 0) {\n    console.log(`${number}\
    \ is a negative number.`);\n  } else {\n    console.log(\"The entered number is\
    \ zero.\");\n  }\n} else {\n  console.log(\"Please enter a valid number.\");\n\
    }\n```\n\n- 190. 抛硬币游戏\n- 191. 斐波那契数生成器\n- 192. 数学测验游戏\n- 193. 颜色猜测游戏\n- 194.\
    \ 单词拼乱游戏\n- 195. 国家首都测验游戏\n- 196. 猜动物\n- 197. 讲笑话\n- 198. 购物清单\n- 199. FizzBuzz\
    \ 游戏\n- 200. 交换相邻数位\n- 201. 大小写转换器\n- 202. 数组两半交换器\n- 203. 字符串中数字之和\n- 204. 立方和\n\
    - 205. 求和的最大整数\n\n- 206. URL 解析\n- 207. 按长度排序字符串\n- 208. 简化绝对路径\n- 209. 计算数组中的公共元素\n\
    - 210. 检查数字中的相同数位\n- 211. 最右侧整数位置\n- 212. 反转16位无符号短整数的位\n- 213. 大于15检查器\n- 214.\
    \ 将第一个数字替换为 $\n- 215. 前缀和\n- 216. 下一个质数\n- 217. 反转位顺序\n- 218. 金字塔"
