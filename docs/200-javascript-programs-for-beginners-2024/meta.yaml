    \ enter a valid non-negative integer.\");\n}\n```\n\n## 16. 显示乘法表\n\n此程序提示用户输入一个数字，并显示其乘法表到指定范围（例如，到10）。\n\
    \n```javascript\n// 提示用户输入一个数字\nlet number = parseInt(prompt(\"Enter a number\
