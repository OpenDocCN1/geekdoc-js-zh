    \ a , b , and c ) and the height of the prism ( h ). The formula for the surface\
    \ area of a triangular prism is **Surface Area = (Perimeter of the base * Height)\
    \ + (2 * Area of the base)** , where the perimeter of the base is **Perimeter\
    \ = a + b + c** and the area of the base is calculated using Heron's formula.\n\
    \n```\nfunction calculateTriangularPrismSurfaceArea(a, b, c, height) {\n  const\
    \ baseArea = 0.25 * Math.sqrt((-a + b + c) * (a - b + c) * (a + b - c) * (a +\
    \ b + c));\n  const perimeter = a + b + c;\n  const surfaceArea = baseArea + perimeter\
    \ * height;\n  return surfaceArea;\n}\n```\n\n```\n// Example usage\nconst sideA\
    \ = 3; // Replace with the length of side A of the triangular base\nconst sideB\
