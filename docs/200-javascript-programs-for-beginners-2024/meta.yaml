    \ > 0 && molesToWhack > 0) {\n    const holes = Array.from({ length: totalHoles\
    \ }, () => emptyHoleSymbol);\n    const randomMoleIndex = Math.floor(Math.random()\
    \ * totalHoles);\n    holes[randomMoleIndex] = moleSymbol;\n\n    console.log(`\\\
    nHoles: ${holes.join(\" \")}`);\n\n    const userWhackIndex = parseInt(prompt(\"\
    Enter the index to whack the mole:\"), 10);\n\n    if (isNaN(userWhackIndex) ||\
    \ userWhackIndex < 0 || userWhackIndex >= totalHoles) {\n      console.log(`Invalid\
