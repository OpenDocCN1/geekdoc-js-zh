    \ of the rhombus is: ${rhombusArea.toFixed(2)}`);\n```\n\n## 135. Check if a Number\
    \ is a Catalan Number\n\nThis program checks if a given non-negative integer is\
    \ a Catalan number. Catalan numbers are a sequence of natural numbers that occur\
    \ in various counting problems, often involving recursive structures. The nth\
    \ Catalan number is given by the formula: **Cn = (2n)! / ((n + 1)! * n!)**.\n\n\
    ```javascript\n// Function to calculate binomial coefficient (n choose k)\nfunction\
    \ binomialCoefficient(n, k) {\n  if (k > n - k) {\n    k = n - k;\n  }\n\n  let\
    \ result = 1;\n  for (let i = 0; i < k; i++) {\n    result *= (n - i);\n    result\
