    \ a reality without even having to think about it.\n\n## 1. Print Hello World\n\
    \nThe \"Hello World\" program is a classic in programming and is often the first\
    \ program written when learning a new programming language. In this case, the\
    \ goal is to print the text string \"Hello, World!\" to the browser console.\n\
    \n```\nconsole.log(\"Hello, World!\");\n```\n\n## 2. Add Two Numbers\n\nThis program\
    \ focuses on taking two numbers as input and then displaying their sum. It prompts\
    \ the user to enter two numbers, adds them together, and prints the result.\n\n\
    ```\nlet num1 = parseFloat(prompt(\"Enter the first number:\"));\nlet num2 = parseFloat(prompt(\"\
    Enter the second number:\"));\n\nif (!isNaN(num1) && !isNaN(num2)) {\n  let sum\
    \ = num1 + num2;\n  console.log(`The sum of ${num1} and ${num2} is: ${sum}`);\n\
    } else {\n  console.log(\"Please enter valid numbers.\");\n}\n```\n\n## 3. Find\
    \ the Square Root\n\nThis program prompts the user to enter a number and calculates\
    \ its square root. It then displays the result, ensuring that the entered number\
    \ is non-negative.\n\n```\nlet inputNumber = parseFloat(prompt(\"Enter a non-negative\
    \ number:\"));\n\nif (!isNaN(inputNumber) && inputNumber >= 0) {\n  let squareRoot\
    \ = Math.sqrt(inputNumber);\n  console.log(`The square root of ${inputNumber}\
    \ is: ${squareRoot}`);\n} else {\n  console.log(\"Please enter a valid non-negative\
    \ number.\");\n}\n```\n\n## 4. Calculate the Area of a Triangle\n\nThis program\
    \ prompts the user to enter the base and height of a triangle and calculates its\
    \ area using the formula: Area = 1/2 × Base × Height. It then displays the calculated\
    \ area.\n\n```\nlet base = parseFloat(prompt(\"Enter the base of the triangle:\"\
    ));\nlet height = parseFloat(prompt(\"Enter the height of the triangle:\"));\n\
    \nif (!isNaN(base) && !isNaN(height) && base > 0 && height > 0) {\n  let area\
    \ = 0.5 * base * height;\n  console.log(\n    `The area of the triangle with base\
    \ ${base} and height ${height} is: ${area}`\n  );\n} else {\n  console.log(\"\
    Please enter valid positive numbers for base and height.\");\n}\n```\n\n## 5.\
    \ Swap Two Variables\n\nThis program prompts the user to enter two variables and\
    \ swaps their values. It then displays the variables before and after the swap.\n\
    \n```\nlet variable1 = prompt(\"Enter the first variable:\");\nlet variable2 =\
    \ prompt(\"Enter the second variable:\");\n\nconsole.log(\n  `Before swapping:\
    \ Variable1 = ${variable1}, Variable2 = ${variable2}`\n);\n\n// Swapping the variables\n\
    let temp = variable1;\nvariable1 = variable2;\nvariable2 = temp;\n\nconsole.log(\n\
    \  `After swapping: Variable1 = ${variable1}, Variable2 = ${variable2}`\n);\n\
    ```\n\n## 6. Solve Quadratic Equation\n\nThis program solves a quadratic equation\
    \ of the form ax^2 + bx + c = 0, where a, b, and c are coefficients. It uses the\
    \ quadratic formula to find the roots of the equation.\n\n```\n// Prompt user\
    \ for coefficients\nlet a = parseFloat(prompt(\"Enter the coefficient a:\"));\n\
    let b = parseFloat(prompt(\"Enter the coefficient b:\"));\nlet c = parseFloat(prompt(\"\
    Enter the coefficient c:\"));\n\n// Calculate the discriminant\nlet discriminant\
    \ = b ** 2 - 4 * a * c;\n\n// Check if roots are real\nif (!isNaN(a) && !isNaN(b)\
    \ && !isNaN(c)) {\n  if (discriminant > 0) {\n    let root1 = (-b + Math.sqrt(discriminant))\
    \ / (2 * a);\n    let root2 = (-b - Math.sqrt(discriminant)) / (2 * a);\n    console.log(\n\
    \      `The roots of the quadratic equation are: ${root1} and ${root2}`\n    );\n\
    \  } else if (discriminant === 0) {\n    let root = -b / (2 * a);\n    console.log(`The\
    \ quadratic equation has a repeated root: ${root}`);\n  } else {\n    console.log(\"\
    The quadratic equation has complex roots.\");\n  }\n} else {\n  console.log(\"\
    Please enter valid numbers for coefficients.\");\n}\n```\n\n## 7. Convert Kilometers\
    \ to Miles\n\nThis program prompts the user to enter a distance in kilometers\
    \ and converts it to miles using the conversion factor: 1 kilometer is approximately\
    \ equal to 0.621371 miles. It then displays the converted distance.\n\n```\n//\
    \ Prompt user for distance in kilometers\nlet kilometers = parseFloat(prompt(\"\
    Enter the distance in kilometers:\"));\n\n// Conversion factor\nconst kilometersToMilesConversionFactor\
    \ = 0.621371;\n\n// Check if input is a valid number\nif (!isNaN(kilometers))\
    \ {\n  // Convert kilometers to miles\n  let miles = kilometers * kilometersToMilesConversionFactor;\n\
    \  console.log(`${kilometers} kilometers is approximately ${miles} miles.`);\n\
    } else {\n  console.log(\"Please enter a valid number for the distance in kilometers.\"\
    );\n}\n```\n\n## 8. Convert Celsius to Fahrenheit\n\nThis program converts a temperature\
    \ from Celsius to Fahrenheit using the formula: F = (C * 9/5) + 32, where F is\
    \ the temperature in Fahrenheit and C is the temperature in Celsius.\n\n```\n\
    // Prompt user for temperature in Celsius\nlet celsius = parseFloat(prompt(\"\
    Enter the temperature in Celsius:\"));\n\n// Check if input is a valid number\n\
    if (!isNaN(celsius)) {\n  // Convert Celsius to Fahrenheit\n  let fahrenheit =\
    \ (celsius * 9) / 5 + 32;\n  console.log(\n    `${celsius} degrees Celsius is\
    \ equal to ${fahrenheit} degrees Fahrenheit.`\n  );\n} else {\n  console.log(\"\
    Please enter a valid number for the temperature in Celsius.\");\n}\n```\n\n##\
    \ 9. Generate a Random Number\n\nThis program generates a random number between\
    \ a user-defined range. It prompts the user to enter the minimum and maximum values\
    \ of the range, and then it displays the generated random number within that range.\n\
    \n```\n// Prompt user for the range\nlet minRange = parseFloat(prompt(\"Enter\
    \ the minimum value of the range:\"));\nlet maxRange = parseFloat(prompt(\"Enter\
    \ the maximum value of the range:\"));\n\n// Check if input is a valid number\n\
    if (!isNaN(minRange) && !isNaN(maxRange) && minRange < maxRange) {\n  // Generate\
    \ a random number within the specified range\n  let randomNumber = Math.random()\
    \ * (maxRange - minRange) + minRange;\n  console.log(\n    `A random number between\
    \ ${minRange} and ${maxRange} is: ${randomNumber}`\n  );\n} else {\n  console.log(\n\
    \    \"Please enter valid numbers, ensuring that the minimum value is less than\
    \ the maximum value.\"\n  );\n}\n```\n\n## 10. Check if a number is Positive,\
    \ Negative, or Zero\n\nThis program prompts the user to enter a number and checks\
    \ whether it is positive, negative, or zero. It then displays the result.\n\n\
    ```\n// Prompt user for a number\nlet number = parseFloat(prompt(\"Enter a number:\"\
    ));\n\n// Check if input is a valid number\nif (!isNaN(number)) {\n  // Check\
    \ if the number is positive, negative, or zero\n  if (number > 0) {\n    console.log(`${number}\
    \ is a positive number.`);\n  } else if (number < 0) {\n    console.log(`${number}\
    \ is a negative number.`);\n  } else {\n    console.log(\"The entered number is\
    \ zero.\");\n  }\n} else {\n  console.log(\"Please enter a valid number.\");\n\
    }\n```\n\n- 190. Coin Tossing Game\n- 191. Fibonacci Number Generator\n- 192.\
