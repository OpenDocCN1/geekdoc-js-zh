- md: "## 110. Check if a Number is a Strong Number\n\nA strong number (or digital\
    \ factorial) is a number such that the sum of its individual digits, each factorialized,\
    \ is equal to the number itself. To check if a number is a strong number in JavaScript,\
    \ you can create a function that calculates the factorial of each digit and checks\
    \ if their sum equals the original number.\n\n```\nfunction calculateFactorial(number)\
    \ {\n  let result = 1;\n  for (let i = 2; i <= number; i++) {\n    result *= i;\n\
    \  }\n  return result;\n}\n```\n\n```\nfunction isStrongNumber(num) {\n  // Check\
    \ if the input is a non-negative integer\n  if (!Number.isInteger(num) || num\
    \ < 0) {\n    return false;\n  }\n\n  // Convert the number to an array of digits\n\
    \  const digits = Array.from(String(num), Number);\n\n  // Calculate the factorial\
    \ of each digit and sum them\n  const digitFactorialSum = digits.reduce((sum,\
    \ digit) => sum + calculateFactorial(digit), 0);\n\n  // Check if the sum equals\
    \ the original number\n  return digitFactorialSum === num;\n}\n\n// Example usage:\n\
    const testNumber = 145;\nconst result = isStrongNumber(testNumber);\n\nconsole.log(`${testNumber}\
    \ is a strong number: ${result}`);\n```\n\n## 111. Check if a Number is a Narcissistic\
    \ Number\n\nA Narcissistic Number (or Armstrong Number) is a number that is the\
    \ sum of its own digits each raised to the power of the number of digits. For\
    \ example, 153 is a narcissistic number because 1^3 + 5^3 + 3^3 equals 153.\n\n\
    ```\nfunction isNarcissisticNumber(num) {\n  // Check if the input is a non-negative\
    \ integer\n  if (!Number.isInteger(num) || num < 0) {\n    return false;\n  }\n\
    \n  const numStr = num.toString();\n  const numDigits = numStr.length;\n  let\
    \ sum = 0;\n\n  for (let i = 0; i < numDigits; i++) {\n    const digit = parseInt(numStr[i],\
    \ 10);\n    sum += Math.pow(digit, numDigits);\n  }\n\n  return sum === num;\n\
    }\n\n// Example usage:\nconst testNumber = 1634;\nconst result = isNarcissisticNumber(testNumber);\n\
    \nconsole.log(`${testNumber} is a Narcissistic Number: ${result}`);\n```\n\n##\
    \ 112. Count the Number of Consonants in a String\n\nYou can create a JavaScript\
    \ function to count the number of consonants in a given string.\n\n```\nfunction\
    \ countConsonants(str) {\n  // Check if the input is a valid string\n  if (typeof\
    \ str !== 'string') {\n    return \"Invalid input. Please provide a valid string.\"\
    ;\n  }\n\n  // Define a regular expression pattern for consonants\n  const consonantPattern\
    \ = /[bcdfghjklmnpqrstvwxyz]/gi;\n\n  // Use match() to find all consonants in\
    \ the string\n  const consonants = str.match(consonantPattern);\n\n  // Return\
    \ the count of consonants\n  return consonants ? consonants.length : 0;\n}\n\n\
    // Example usage:\nconst testString = \"Hello World\";\nconst result = countConsonants(testString);\n\
    \nconsole.log(`The number of consonants in \"${testString}\" is: ${result}`);\n\
    ```\n\n## 113. Check if a Number is a Triangular Number\n\nThis program checks\
    \ if a given positive integer is a triangular number. A triangular number is a\
    \ number that can be represented in the form of a triangle with dots. Mathematically,\
    \ a triangular number $T_n$ is given by the formula: $T_n = n * (n + 1) / 2$.\n\
    \n```\nfunction isTriangularNumber(num) {\n  // Check if the input is a non-negative\
    \ integer\n  if (!Number.isInteger(num) || num < 0) {\n    return false;\n  }\n\
    \n  // Iterate through natural numbers until the sum exceeds or equals the input\
    \ number\n  let sum = 0;\n  let n = 0;\n\n  while (sum < num) {\n    n++;\n  \
    \  sum += n;\n  }\n\n  // Check if the input number is equal to a triangular number\n\
    \  return sum === num;\n}\n\n// Example usage:\nconst testNumber = 10;\nconst\
    \ result = isTriangularNumber(testNumber);\n\nconsole.log(`${testNumber} is a\
    \ triangular number: ${result}`);\n```\n\n## 114. Find the Area of a Trapezoid\n\
    \nThis program calculates the area of a trapezoid given the lengths of its bases\
    \ ( a and b ) and its height ( h ). The formula for the area of a trapezoid is:\
    \ Area = (a + b) * h / 2 .\n\n```\nfunction trapezoidArea(base1, base2, height)\
    \ {\n  // Check if the inputs are valid numbers\n  if (isNaN(base1) || isNaN(base2)\
    \ || isNaN(height) || base1 <= 0 || base2 <= 0 || height <= 0) {\n    return \"\
