  mdcn: "## 29. 使用递归显示斐波那契数列\n\n此程序使用递归显示斐波那契数列，直到指定的项数。它提示用户输入项数，然后使用递归函数生成并显示斐波那契数列。\n\
    \n```javascript\n// 使用递归生成斐波那契数列的函数\nfunction fibonacci(n) {\n  if (n <= 1) {\n\
    \    return n;\n  } else {\n    return fibonacci(n - 1) + fibonacci(n - 2);\n\
    \  }\n}\n\n// 提示用户输入斐波那契数列的项数\nlet numTerms = parseInt(prompt(\"Enter the number\
