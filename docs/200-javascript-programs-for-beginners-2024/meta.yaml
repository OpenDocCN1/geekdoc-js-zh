  - "[PAGE 129]\n\n# # 76. Pass a Function as Parameter\n\nYou can pass a function\
    \ as a parameter to another function. This allows you to create higher-order functions,\
    \ which are functions that can accept other functions as arguments.\n\n```\njavascript\n\
    // Function that takes another function as a parameter\nfunction operateOnNumbers(a,\
    \ b, operation) {\n  return operation(a, b);\n}\n\n// Example functions to be\
    \ passed as parameters\nfunction add(x, y) {\n  return x + y;\n}\n\nfunction multiply(x,\
    \ y) {\n  return x * y;\n}\n\n// Example usage\nlet result1 = operateOnNumbers(3,\
    \ 5, add);\nconsole.log(\"Result of addition:\", result1); // Outputs: 8\n\nlet\
    \ result2 = operateOnNumbers(3, 5, multiply);\nconsole.log(\"Result of multiplication:\"\
    , result2); // Outputs: 15\n```"
  - "[PAGE 130]\n\n# 77. Get the Dimensions of an Image\n\nTo get the dimensions (width\
    \ and height) of an image in JavaScript, you can create an `Image` object, load\
    \ the image, and then access the `width` and `height` properties.\n\n```\nfunction\
    \ getImageDimensions(imageSrc) {\n  // Create an Image object\n  var img = new\
    \ Image();\n\n  // Set the source of the image\n  img.src = imageSrc;\n\n  //\
    \ Wait for the image to load\n  img.onload = function() {\n    // Access the width\
    \ and height properties\n    var width = img.width;\n    var height = img.height;\n\
    \n    // Display the dimensions\n    console.log(\"Width:\", width);\n    console.log(\"\
    Height:\", height);\n  };\n\n  // Handle image loading error\n  img.onerror =\
    \ function() {\n    console.error(\"Error loading the image.\");\n  };\n}\n```"
- md: "## 78. Remove All Whitespaces From a Text\n\nTo remove all whitespaces from\
    \ a text in JavaScript, you can use a regular expression and the `replace` method.\n\
    \n```\nfunction removeWhitespaces(inputText) {\n  // Use a regular expression\
    \ to replace all whitespaces with an empty string\n  return inputText.replace(/\\\
    s/g, \"\");\n}\n\n// Example usage\nlet textWithWhitespaces = \"This is a text\
    \ with spaces\";\nlet textWithoutWhitespaces = removeWhitespaces(textWithWhitespaces);\n\
    \nconsole.log(\"Original Text:\", textWithWhitespaces);\nconsole.log(\"Text without\
    \ Whitespaces:\", textWithoutWhitespaces);\n```\n\n## 79. Write to Console\n\n\
    Writing to the console in JavaScript is typically done using the `console.log()`\
    \ method.\n\n```\n// Write a message to the console\nconsole.log(\"Hello, world!\"\
    );\n\n// You can also log variables or expressions\nlet number = 42;\nconsole.log(\"\
    The answer is:\", number);\n\n// Multiple values can be logged in a single statement\n\
    let firstName = \"John\";\nlet lastName = \"Doe\";\nconsole.log(\"Full Name:\"\
    , firstName, lastName);\n```\n\n## 80. Convert Date to Number\n\nTo convert a\
    \ JavaScript `Date` object to a numeric value representing the number of milliseconds\
    \ since the Unix Epoch (January 1, 1970), you can use the `getTime()` method.\n\
    \n```\n// Create a Date object\nconst currentDate = new Date();\n\n// Get the\
    \ numeric representation of the date (milliseconds since the Unix Epoch)\nconst\
    \ numericDate = currentDate.getTime();\n\nconsole.log(\"Current Date:\", currentDate);\n\
    console.log(\"Numeric Representation:\", numericDate);\n```\n\n## 81. Find the\
    \ Average of Two Numbers\n\nTo find the average of two numbers in JavaScript,\
    \ you can add the two numbers together and then divide the sum by 2.\n\n```\n\
    function findAverage(num1, num2) {\n  // Calculate the sum of the two numbers\n\
    \  let sum = num1 + num2;\n\n  // Calculate the average by dividing the sum by\
    \ 2\n  let average = sum / 2;\n\n  return average;\n}\n\n// Example usage:\nlet\
    \ number1 = 10;\nlet number2 = 20;\n\nlet result = findAverage(number1, number2);\n\
    \nconsole.log(`The average of ${number1} and ${number2} is: ${result}`);\n```\n\
    \n## 82. Calculate the Area of a Circle\n\nThis program calculates the area of\
    \ a circle in JavaScript:\n\n```\nfunction calculateCircleArea(radius) {\n  //\
    \ Check if the radius is a valid number\n  if (isNaN(radius) || radius <= 0) {\n\
    \    return \"Invalid radius. Please provide a positive number.\";\n  }\n\n  //\
    \ Calculate the area\n  const area = Math.PI * Math.pow(radius, 2);\n\n  return\
    \ area;\n}\n\n// Example usage:\nconst radius = 5;\nconst area = calculateCircleArea(radius);\n\
    \nconsole.log(`The area of a circle with radius ${radius} is: ${area}`);\n```\n\
    \n## 83. Random Color Generator\n\nTo generate a random color in JavaScript, you\
    \ can create a function that generates random values for the red, green, and blue\
    \ components of the color.\n\n```\nfunction generateRandomColor() {\n  // Generate\
    \ random values for red, green, and blue components\n  const red = Math.floor(Math.random()\
    \ * 256);\n  const green = Math.floor(Math.random() * 256);\n  const blue = Math.floor(Math.random()\
    \ * 256);\n\n  // Create the RGB color string\n  const color = `rgb(${red}, ${green},\
    \ ${blue})`;\n\n  return color;\n}\n\n// Example usage:\nconst randomColor = generateRandomColor();\n\
    \nconsole.log(\"Random Color:\", randomColor);\n```\n\n## 84. Check if a String\
    \ is Empty\n\nTo check if a string is empty in JavaScript, you can use the `length`\
    \ property of the string. If the length is zero, it means the string is empty.\n\
    \n```\nfunction isEmptyString(str) {\n  return str.length === 0;\n}\n\n// Example\
    \ usage:\nconst emptyString = \"\";\nconst nonEmptyString = \"Hello, world!\"\
    ;\n\nconsole.log(\"Is emptyString empty?\", isEmptyString(emptyString)); // Outputs:\
    \ true\nconsole.log(\"Is nonEmptyString empty?\", isEmptyString(nonEmptyString));\
    \ // Outputs: false\n```\n\n## 85. Capitalize the First Letter of a String\n\n\
    To capitalize the first letter of a string in JavaScript, you can use a combination\
    \ of the `charAt()`, `toUpperCase()`, and `slice()` methods.\n\n```\nfunction\
    \ capitalizeFirstLetter(str) {\n  // Check if the string is not empty\n  if (str.length\
    \ === 0) {\n    return \"Empty string\";\n  }\n\n  // Capitalize the first letter\
    \ and concatenate the rest of the string\n  return str.charAt(0).toUpperCase()\
    \ + str.slice(1);\n}\n\n// Example usage:\nconst originalString = \"hello, world!\"\
    ;\nconst capitalizedString = capitalizeFirstLetter(originalString);\n\nconsole.log(\"\
    Original String:\", originalString);\nconsole.log(\"Capitalized String:\", capitalizedString);\n\
    ```\n\n## 86. Find the Maximum Element in an Array\n\nTo find the maximum element\
    \ in an array in JavaScript, you can use the `Math.max()` function along with\
    \ the spread operator (`...`) to pass the array elements as individual arguments.\n\
    \n```\nfunction findMaxElement(arr) {\n  // Check if the array is not empty\n\
    \  if (arr.length === 0) {\n    return \"Empty array\";\n  }\n\n  // Use Math.max()\
    \ with the spread operator to find the maximum element\n  const maxElement = Math.max(...arr);\n\
    \n  return maxElement;\n}\n\n// Example usage:\nconst numbers = [5, 2, 9, 1, 7];\n\
    const maxNumber = findMaxElement(numbers);\n\nconsole.log(\"Array:\", numbers);\n\
    console.log(\"Maximum Element:\", maxNumber);\n```\n\n## 87. Reverse an Array\n\
    \nTo reverse an array in JavaScript, you can use the `reverse()` method, which\
    \ is available for arrays. This method reverses the elements of an array in place.\n\
    \n```\nfunction reverseArray(arr) {\n  // Use the reverse() method to reverse\
    \ the array in place\n  return arr.reverse();\n}\n\n// Example usage:\nconst originalArray\
    \ = [1, 2, 3, 4, 5];\nconst reversedArray = reverseArray(originalArray);\n\nconsole.log(\"\
    Original Array:\", originalArray);\nconsole.log(\"Reversed Array:\", reversedArray);\n\
    ```\n\n## 88. Calculate the Power of a Number\n\nTo calculate the power of a number\
    \ in JavaScript, you can use the `Math.pow()` method or the exponentiation operator\
    \ (`**`).\n\n```\n// Using Math.pow()\nfunction calculatePowerWithMathPow(base,\
    \ exponent) {\n  return Math.pow(base, exponent);\n}\n\n// Using the exponentiation\
    \ operator (**)\nfunction calculatePowerWithExponentiationOperator(base, exponent)\
    \ {\n  return base ** exponent;\n}\n\n// Example usage:\nconst baseNumber = 2;\n\
    const exponentNumber = 3;\n\nconst resultWithMathPow = calculatePowerWithMathPow(baseNumber,\
    \ exponentNumber);\nconst resultWithExponentiationOperator = calculatePowerWithExponentiationOperator(baseNumber,\
    \ exponentNumber);\n\nconsole.log(`${baseNumber} to the power of ${exponentNumber}\
    \ using Math.pow(): ${resultWithMathPow}`);\nconsole.log(`${baseNumber} to the\
    \ power of ${exponentNumber} using the exponentiation operator (**): ${resultWithExponentiationOperator}`);\n\
    ```\n\n## 89. Find the Minimum Element in an Array\n\nTo find the minimum element\
    \ in an array in JavaScript, you can use the `Math.min()` function along with\
    \ the spread operator (`...`) to pass the array elements as individual arguments.\n\
    \n```\nfunction findMinElement(arr) {\n  // Check if the array is not empty\n\
    \  if (arr.length === 0) {\n    return \"Empty array\";\n  }\n\n  // Use Math.min()\
    \ with the spread operator to find the minimum element\n  const minElement = Math.min(...arr);\n\
    \n  return minElement;\n}\n\n// Example usage:\nconst numbers = [5, 2, 9, 1, 7];\n\
    const minNumber = findMinElement(numbers);\n\nconsole.log(\"Array:\", numbers);\n\
    console.log(\"Minimum Element:\", minNumber);\n```\n\n## 90. Convert Minutes to\
    \ Hours and Minutes\n\nTo convert a total number of minutes to hours and remaining\
    \ minutes in JavaScript, you can use simple mathematical operations.\n\n```\n\
    function convertMinutesToHoursAndMinutes(totalMinutes) {\n  // Check if the input\
    \ is a valid positive number\n  if (isNaN(totalMinutes) || totalMinutes < 0) {\n\
    \    return \"Invalid input. Please provide a non-negative number of minutes.\"\
    ;\n  }\n\n  // Calculate hours and remaining minutes\n  const hours = Math.floor(totalMinutes\
    \ / 60);\n  const minutes = totalMinutes % 60;\n\n  // Construct the result string\n\
    \  const result = `${hours} hours and ${minutes} minutes`;\n\n  return result;\n\
    }\n\n// Example usage:\nconst totalMinutes = 135;\nconst convertedTime = convertMinutesToHoursAndMinutes(totalMinutes);\n\
    \nconsole.log(`${totalMinutes} minutes is equivalent to: ${convertedTime}`);\n\
    ```"
  mdcn: "## 78. 从文本中移除所有空白字符\n\n要在 JavaScript 中从文本中移除所有空白字符，你可以使用正则表达式和 `replace`\
    \ 方法。\n\n```\nfunction removeWhitespaces(inputText) {\n  // 使用正则表达式将所有空白字符替换为空字符串\n\
    \  return inputText.replace(/\\s/g, \"\");\n}\n\n// 使用示例\nlet textWithWhitespaces\
    \ = \"This is a text with spaces\";\nlet textWithoutWhitespaces = removeWhitespaces(textWithWhitespaces);\n\
    \nconsole.log(\"Original Text:\", textWithWhitespaces);\nconsole.log(\"Text without\
    \ Whitespaces:\", textWithoutWhitespaces);\n```\n\n## 79. 写入控制台\n\n在 JavaScript\
    \ 中，通常使用 `console.log()` 方法将内容写入控制台。\n\n```\n// 将消息写入控制台\nconsole.log(\"Hello,\
    \ world!\");\n\n// 你也可以记录变量或表达式\nlet number = 42;\nconsole.log(\"The answer is:\"\
    , number);\n\n// 可以在单个语句中记录多个值\nlet firstName = \"John\";\nlet lastName = \"Doe\"\
    ;\nconsole.log(\"Full Name:\", firstName, lastName);\n```\n\n## 80. 将日期转换为数字\n\
    \n要将 JavaScript 的 `Date` 对象转换为表示自 Unix 纪元（1970年1月1日）以来毫秒数的数值，你可以使用 `getTime()`\
    \ 方法。\n\n```\n// 创建一个 Date 对象\nconst currentDate = new Date();\n\n// 获取日期的数值表示（自\
    \ Unix 纪元以来的毫秒数）\nconst numericDate = currentDate.getTime();\n\nconsole.log(\"\
    Current Date:\", currentDate);\nconsole.log(\"Numeric Representation:\", numericDate);\n\
    ```\n\n## 81. 求两个数的平均值\n\n要在 JavaScript 中求两个数的平均值，你可以将两个数相加，然后将和除以 2。\n\n```\n\
    function findAverage(num1, num2) {\n  // 计算两个数的和\n  let sum = num1 + num2;\n\n\
    \  // 通过将和除以 2 来计算平均值\n  let average = sum / 2;\n\n  return average;\n}\n\n//\
    \ 使用示例：\nlet number1 = 10;\nlet number2 = 20;\n\nlet result = findAverage(number1,\
    \ number2);\n\nconsole.log(`The average of ${number1} and ${number2} is: ${result}`);\n\
    ```\n\n## 82. 计算圆的面积\n\n这个程序在 JavaScript 中计算圆的面积：\n\n```\nfunction calculateCircleArea(radius)\
    \ {\n  // 检查半径是否为有效数字\n  if (isNaN(radius) || radius <= 0) {\n    return \"Invalid\
    \ radius. Please provide a positive number.\";\n  }\n\n  // 计算面积\n  const area\
    \ = Math.PI * Math.pow(radius, 2);\n\n  return area;\n}\n\n// 使用示例：\nconst radius\
    \ = 5;\nconst area = calculateCircleArea(radius);\n\nconsole.log(`The area of\
    \ a circle with radius ${radius} is: ${area}`);\n```\n\n## 83. 随机颜色生成器\n\n要在 JavaScript\
    \ 中生成随机颜色，你可以创建一个函数，为颜色的红、绿、蓝分量生成随机值。\n\n```\nfunction generateRandomColor() {\n\
    \  // 为红、绿、蓝分量生成随机值\n  const red = Math.floor(Math.random() * 256);\n  const green\
    \ = Math.floor(Math.random() * 256);\n  const blue = Math.floor(Math.random()\
    \ * 256);\n\n  // 创建 RGB 颜色字符串\n  const color = `rgb(${red}, ${green}, ${blue})`;\n\
    \n  return color;\n}\n\n// 使用示例：\nconst randomColor = generateRandomColor();\n\
    \nconsole.log(\"Random Color:\", randomColor);\n```\n\n## 84. 检查字符串是否为空\n\n要在\
    \ JavaScript 中检查字符串是否为空，你可以使用字符串的 `length` 属性。如果长度为零，则表示字符串为空。\n\n```\nfunction\
    \ isEmptyString(str) {\n  return str.length === 0;\n}\n\n// 使用示例：\nconst emptyString\
    \ = \"\";\nconst nonEmptyString = \"Hello, world!\";\n\nconsole.log(\"Is emptyString\
    \ empty?\", isEmptyString(emptyString)); // 输出：true\nconsole.log(\"Is nonEmptyString\
    \ empty?\", isEmptyString(nonEmptyString)); // 输出：false\n```\n\n## 85. 将字符串首字母大写\n\
    \n要在 JavaScript 中将字符串的首字母大写，你可以结合使用 `charAt()`、`toUpperCase()` 和 `slice()` 方法。\n\
    \n```\nfunction capitalizeFirstLetter(str) {\n  // 检查字符串是否不为空\n  if (str.length\
    \ === 0) {\n    return \"Empty string\";\n  }\n\n  // 将首字母大写并连接字符串的其余部分\n  return\
    \ str.charAt(0).toUpperCase() + str.slice(1);\n}\n\n// 使用示例：\nconst originalString\
    \ = \"hello, world!\";\nconst capitalizedString = capitalizeFirstLetter(originalString);\n\
    \nconsole.log(\"Original String:\", originalString);\nconsole.log(\"Capitalized\
    \ String:\", capitalizedString);\n```\n\n## 86. 查找数组中的最大元素\n\n要在 JavaScript 中查找数组中的最大元素，你可以使用\
    \ `Math.max()` 函数和展开运算符（`...`）将数组元素作为单独的参数传递。\n\n```\nfunction findMaxElement(arr)\
    \ {\n  // 检查数组是否不为空\n  if (arr.length === 0) {\n    return \"Empty array\";\n\
