    \ usage:\nconst number = 50;\nconst result = calculateFactorial(number);\n```"
  mdcn: "## 100. 将英尺转换为米\n\n要在 JavaScript 中将英尺转换为米，可以使用以下换算公式：\n\n米 = 英尺 × 0.3048\n\
    \n这是一个执行转换的简单函数：\n\n```javascript\nfunction feetToMeters(feet) {\n  // Check if\
    \ the input is a valid number\n  if (isNaN(feet)) {\n    return \"Invalid input.\
