    Please enter a valid positive integer for the number of terms.\");\n}\n```\n\n\
    ## 18. 检查阿姆斯特朗数\n\n此程序提示用户输入一个数字，并检查它是否为阿姆斯特朗数。阿姆斯特朗数（也称为自恋数或超完全数字不变数）是一个数字，它等于其各位数字的幂之和，幂的指数是该数字的位数。例如，153是一个阿姆斯特朗数，因为\
    \ $1^3 + 5^3 + 3^3 = 153$。\n\n```javascript\n// 提示用户输入一个数字\nlet number = parseInt(prompt(\"\
    Enter a number:\"));\n\n// 检查输入是否为有效的正整数\nif (!isNaN(number) && Number.isInteger(number)\
    \ && number > 0) {\n  let originalNumber = number;\n  let numberOfDigits = originalNumber.toString().length;\n\
    \  let sum = 0;\n\n  // 计算各位数字的幂之和，幂的指数是位数\n  while (originalNumber > 0) {\n \
    \   let digit = originalNumber % 10;\n    sum += Math.pow(digit, numberOfDigits);\n\
    \    originalNumber = Math.floor(originalNumber / 10);\n  }\n\n  // 检查该数字是否为阿姆斯特朗数\n\
    \  if (sum === number) {\n    console.log(`${number} is an Armstrong number.`);\n\
    \  } else {\n    console.log(`${number} is not an Armstrong number.`);\n  }\n\
    } else {\n  console.log(\"Please enter a valid positive integer.\");\n}\n```\n\
    \n## 19. 在区间内找出阿姆斯特朗数\n\n此程序提示用户输入一个范围（起始和结束），然后打印该区间内的所有阿姆斯特朗数。\n\n```javascript\n\
