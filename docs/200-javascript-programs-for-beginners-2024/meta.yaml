- md: "## 125. Check if a Number is a Smith Number\n\nThis program checks if a given\
    \ positive integer is a Smith number. A Smith number is a composite number for\
    \ which the sum of its digits is equal to the sum of the prime factors' digits.\
    \ The sum of the prime factors' digits is computed recursively until prime factors\
    \ are obtained.\n\n```\nfunction isPrime(num) {\n  if (num < 2) return false;\n\
    \  for (let i = 2; i <= Math.sqrt(num); i++) {\n    if (num % i === 0) return\
    \ false;\n  }\n  return true;\n}\n\nfunction sumOfDigits(number) {\n  return number.toString().split('').reduce((sum,\
    \ digit) => sum + parseInt(digit, 10), 0);\n}\n\nfunction primeFactors(number)\
    \ {\n  const factors = [];\n  for (let i = 2; i <= number; i++) {\n    while (isPrime(i)\
    \ && number % i === 0) {\n      factors.push(i);\n      number /= i;\n    }\n\
    \  }\n  return factors;\n}\n\nfunction isSmithNumber(number) {\n  const originalSum\
    \ = sumOfDigits(number);\n  const primeFactorSum = primeFactors(number).reduce((sum,\
    \ factor) => sum + sumOfDigits(factor), 0);\n\n  return originalSum === primeFactorSum;\n\
    }\n\n// Example: Check if 728 is a Smith number\nconsole.log(isSmithNumber(728));\
    \ // Output: true\n```\n\n## 126. Basic Chessboard\n\nThis program generates a\
    \ basic representation of a chessboard using characters. It creates an 8x8 grid\
    \ with alternating black and white squares, providing a simple visual representation\
    \ of a chessboard.\n\n```\n// Function to generate a basic chessboard\nfunction\
    \ generateChessboard() {\n  const size = 8; // Size of the chessboard (8x8)\n\
    \  const chessboard = [];\n\n  for (let row = 0; row < size; row++) {\n    const\
    \ currentRow = [];\n    for (let col = 0; col < size; col++) {\n      // Use 'X'\
    \ for black squares and ' ' for white squares\n      const isBlack = (row + col)\
    \ % 2 === 1;\n      const square = isBlack ? 'X' : ' ';\n      currentRow.push(square);\n\
    \    }\n\n    chessboard.push(currentRow.join(' '));\n  }\n\n  return chessboard.join('\\\
    n');\n}\n\n// Example usage\nconst chessboard = generateChessboard();\nconsole.log(chessboard);\n\
    ```\n\n## 127. Generate a Random Password with Specific Criteria\n\nThis program\
