    \nconsole.log(`Cylinder Volume: ${cylinderVolume.toFixed(2)} cubic units`);\n\
    ```\n\n## 98. 生成随机名言\n\n要在 JavaScript 中生成随机名言，可以创建一个名言数组，并使用一个函数从该数组中随机选取一条名言。\n\
    \n```javascript\nfunction generateRandomQuote() {\n  const quotes = [\n    \"\
