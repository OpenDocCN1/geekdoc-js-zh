    \t\tpop();\n\t}\n}\n```\n\n代码中最大的改动是**solutionMessage**函数，让我们更详细地看看这个部分。之前我们只是根据**solution**变量的值使用\
    \ if-else 语句来决定屏幕上显示什么内容。如果 solution 为**true**，我们就显示白色背景；如果 solution 为**false**，我们就显示黑色背景。\n\
    \n现在，如果 solution 是这两个值中的任意一个（**true**或**false**），我们会将其传递给一个名为**solutionMessage**的函数，该函数使用**gameScore.total**作为**random**函数的种子来选择一条随机消息显示。\n\
    \n```javascript\nif (solution == true || solution === false) {\n\tsolutionMessage(gameScore.total,\
    \ solution);\n}\n```\n\n在**solutionMessage**函数内部，有两个数组，里面包含了一堆消息值，根据**solution**的值来决定显示哪些内容。\n\
