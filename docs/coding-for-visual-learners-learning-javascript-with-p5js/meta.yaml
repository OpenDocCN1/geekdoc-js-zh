    If you find yourself wishing that p5.js transformations weren’t this complicated,
    you can try building your own functions to handle and abstract away the complexity.
    Here is an example rectangle function that takes a fifth argument, which is the
    rotation parameter.


    ```

    1 function rectC(x, y, width, height, rotation) {

    2     if (rotation === undefined) {

