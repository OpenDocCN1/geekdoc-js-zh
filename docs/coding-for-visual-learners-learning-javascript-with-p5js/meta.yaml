    Finally, inside curly braces we write the code that we want to have repeated.
    Once the counter variable doesn’t satisfy the test condition, the loop terminates,
    and the program returns to its normal evaluation.


    If the test condition never fails, then we would have a loop that would end up
    creating an *infinite loop*, a loop that doesn’t have an exit condition so that
    it keeps going on and on until the program is terminated by external means. The
    **draw** function in p5.js is in an infinite loop; it keeps drawing to the screen
    until we close the browser window.


    Even though infinite loops are a valid use case, loops are most commonly used
    for executing an operation for a known amount of times. Let’s create a loop that
    will draw given number of ellipses to the screen using a *for loop*.


    ```

    1 function setup() {

    2     createCanvas(800, 300);

    3     rectMode(CENTER);

    4 }

