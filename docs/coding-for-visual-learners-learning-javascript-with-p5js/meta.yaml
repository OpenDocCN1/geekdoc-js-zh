    \ X 形。\n\n## 总结\n\n在本章中，我们快速开始了 p5.js 的使用，并在屏幕上绘制了形状。\n\n我们发现需要将代码写入两个名为 `setup`\
    \ 和 `draw` 的函数定义块中。任何只需要执行一次的内容都放在 `setup` 函数下，而任何我们想要制作动画或进行交互的内容则放入 `draw` 函数中。将代码写入这两个函数是\
