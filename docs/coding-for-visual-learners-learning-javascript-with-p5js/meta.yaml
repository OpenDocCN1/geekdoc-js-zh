    # Gentle Introduction to JavaScript


    We can write something as simple as `1 + 1` to the screen. This is a valid JavaScript
    code which adds these two numbers together. If we are to execute this code, by
    pressing the Play button, we still won''t see anything. This is kind of disappointing
    because we would have at least expected to see the result of this calculation.


    To be able to see the results of JavaScript operations on the screen we can use
    a **function** called **console.log()**.


    A **function** is a programming structure that contains other code inside it that
    is written to perform a specific action. Functions allow us to perform complex
    operations by just calling them with their defined function name. When we are
    calling a function - which we can also refer to as *executing* the function -
    we would write its name, in this case **console.log**, and place brackets next
    to it. If the function requires an input to perform its functionality, then we
    would provide that input inside the brackets just like we are doing in this example.


    **console.log** is a built-in JavaScript function that displays - or logs - the
    given value inside the console below the editor. When I say built-in, it means
    that most JavaScript execution environments would have this function. For example
    web browsers have a section in their interfaces called *console*, which we can
    access through the developer tools. p5.js also has a section that is called *console*
    as well below the editing area.


    We can also have user defined functions that we can create for ourselves which
    won''t be available to anyone else until we somehow share it with other people.
    Libraries such as p5.js have bunch of functions of their own. We will be using
    p5.js functions to draw shapes to the screen and create all kinds of interactive
    and animated visuals. We will dwell more into the concept of functions later on
    but for now know that there is this function that comes with JavaScript called
    **console.log** that accepts a value and displays that value inside the console
    underneath the editor. Initially the other functions that we will be learning
    about won''t have a dot in their name. **console.log** is a bit different in that
    sense, but the reasons for the ''dot'' usage will be explained later.


    Let''s add a couple of more **console.log** statements into our code.


    ```

    1 console.log(1 + 1)

    2 console.log(5 + 10)

    3 console.log(213 * 63)

    4 console.log(321314543265 + 34251646315526623)

    ```


    When we execute this code, we will see the following results being displayed inside
    the console.'
