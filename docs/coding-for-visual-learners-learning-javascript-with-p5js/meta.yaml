    13-02


    # ## Summary


    This was definitely a challenging example that puts everything we have learned
    so far into a test.


    It is very impressive that we can build a game just by using p5.js that can run
    on the web and can be played by millions of people. And it wasn''t all that difficult
    as well; the entire program is just around 200 lines. There is certainly room
    for improvement where we can make the game difficulty dynamic based on the player
    performance, add more visual flair and add a dynamic scoring system where we can
    assign different points to correct guesses based on the amount of time it took
    to guess a number. The game can be converted to display words instead of numbers.
    It can show images that you need to type the name for or calculations that you
    need to answer. The possibilities are numerous!


    Having said that, p5.js might not be the best platform to create games with if
    we wanted to build more advanced projects. A proper game library would come with
    features such as an asset loading system, sprite support, collision detection,
    physics engine, particle systems... which is more often than not required when
    building advanced games. This is not to say you can''t use p5.js to build a game,
    though; we just proved that it is entirely possible. It is just that there are
    other libraries out there that are more specialized around that solution whereas
    p5.js is more tailored towards creating interactive, animated experiences on the
    web.'
