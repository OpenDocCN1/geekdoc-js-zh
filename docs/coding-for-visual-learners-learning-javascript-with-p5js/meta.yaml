    5     angleMode(DEGREES);\n6 }\n7 \n8 function draw() {\n9     background(220);\n\
    10    \n11    push();\n12    fill(237, 34, 93);\n13    translate(width/2, height/2);\n\
    14    rotate(45);\n15    rect(0, 0, 150, 150);\n16    pop();\n17    \n18    fill(255,\
    \ 255, 255);\n19    rect(0, 0, 75, 75);\n20 }\n```\n\n![](img/41e582902bed374827550eb87c185e8d_107_1.png)\n\
    \n12-06"
- md: "Brilliant! Whatever we are doing in between the **push** and **pop** functions\
    \ don’t end up affecting anything else that is outside these function calls. It\
    \ is important to note that we would always call **push** and **pop** functions\
    \ together. Using one but not the other doesn’t make any sense.\n\nLet’s update\
    \ our example so that we can still translate the pink rectangle to the middle\
    \ but apply a different rotation value to it.\n\n```javascript\n1 function setup()\
    \ {\n2     createCanvas(800, 300);\n3     rectMode(CENTER);\n4     noStroke();\n\
    5     angleMode(DEGREES);\n6 }\n7\n8 function draw() {\n9     background(220);\n\
    10\n11     push();\n12     fill(237, 34, 93);\n13     translate(width/2, height/2);\n\
    14     rotate(45);\n15     rect(0, 0, 150, 150);\n16     pop();\n17\n18     push();\n\
    19     fill(255, 255, 255);\n20     translate(width/2, height/2);\n21     rotate(30);\n\
    22     rect(0, 0, 75, 75);\n23     pop();\n24 }\n```\n\nIf you find yourself wishing\
    \ that p5.js transformations weren’t this complicated, you can try building your\
    \ own functions to handle and abstract away the complexity. Here is an example\
    \ rectangle function that takes a fifth argument, which is the rotation parameter.\n\
    \n```javascript\n1 function rectC(x, y, width, height, rotation) {\n2     if (rotation\
    \ === undefined) {\n3             rotation = 0;\n4     }\n5     push();\n6   \
    \  translate(x, y);\n7     rotate(rotation);\n8     rect(0, 0, width, height);\n\
    9     pop();\n10 }\n```\n\nHere, we are creating our rectangle drawing function\
    \ called **rectC** that wraps the original **rect** function but uses the **push**\
    \ and **pop** to save state and set transformation and accepts an optional rotation\
    \ parameter. If the rotation argument is not provided, then it will assume the\
    \ value **undefined**. If that’s the case, I can just set the rotation value to\
    \ be 0 instead. Here is the above example refactored to make use of this function.\
    \ Notice it is much more concise this time.\n\n```javascript\nfunction setup()\
    \ {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n    noStroke();\n   \
    \ angleMode(DEGREES);\n}\n\nfunction draw() {\n    background(220);\n\n    fill(237,\
    \ 34, 93);\n    rectC(width/2, height/2, 150, 150, 45);\n\n    fill(255, 255,\
    \ 255);\n    rectC(width/2, height/2, 75, 75, 30);\n}\n\nfunction rectC(x, y,\
    \ width, height, rotation) {\n    if (rotation === undefined) {\n        rotation\
    \ = 0;\n    }\n    push();\n    translate(x, y);\n    rotate(rotation);\n    rect(0,\
    \ 0, width, height);\n    pop();\n}\n```\n\n## Summary\n\nWhen working with a\
    \ drawing library, it gets pretty important to be able to transform shapes. In\
    \ this chapter, we have seen how p5.js transform functions work. We learned about\
    \ the **translate** and **rotate** functions. We also learned about the **angleMode**\
    \ function which lets us set the units that would be used by the **rotate** function.\n\
    \nWe then learned about the **push** and **pop** functions and found out how they\
    \ can be used in conjunction with the transformation functions to isolate the\
    \ state and apply transformations to individual shapes.\n\nLearning these functions\
    \ aren't really crucial to learning Javascript, but I find that knowing about\
    \ them is pretty essential when using p5.js.\n\n## Practice\n\nTry building something\
    \ cool on your own before moving on to the next chapter where we will be building\
    \ an interactive game together!\n\n## 13 - Final Project\n\n### Let’s Build a\
    \ Game!\n\nIn this chapter, we will be building a game that makes use of everything\
    \ that we have seen so far. We will also learn a couple of more tricks along the\
    \ way as well. The fact that we can build a simple game using the p5.js library\
    \ is pretty impressive and very illustrative of the capabilities of this library.\n\
    \nOur game is going to be simple. It is a typing speed game where we will be rapidly\
    \ displaying numbers to the player and expect the player to enter the current\
    \ number on the screen using their keyboard. If they enter the correct number\
    \ in the given amount of time, they score. We will keep track of the score to\
    \ be able to display it at the end of the game. It would be great if the game\
    \ presents a strong visual experience but the primary focus is going to be around\
    \ getting the game logic right.\n\nLet’s create a breakdown of things that we\
    \ need to create:\n- We need to display a number on the screen every N frames.\n\
    - We don’t want the number to remain static on the screen. It should be animated\
    \ to make it easier or harder to read with time.\n- That number needs to remain\
    \ on the screen until the next number is displayed or until the player presses\
    \ a key in an attempt to match the number.\n- If the player entry matches to the\
    \ number on the screen, we will display a success message. If not, the failure\
    \ will be indicated.\n- We need to keep the amount of success and failure, and\
    \ after X many frames / or attempts display the results to the user.\n- We need\
    \ to find a way to restart the game after it is over.\n\n### Getting Started\n\
    \nThe first item on our list is to be able to display a unique number on screen\
    \ at regular intervals. Remember that we used the **remainder** operator to achieve\
    \ this feat before. Here, we will be displaying a number in between 0 and 9 on\
    \ the screen every 100 frames.\n\n```javascript\n1 var content;\n2\n3 function\
    \ setup() {\n4   createCanvas(800, 300);\n5   textAlign(CENTER, CENTER);\n6 }\n\
    7\n8 function draw() {\n9   background(220);\n10  if (frameCount === 1 || frameCount\
