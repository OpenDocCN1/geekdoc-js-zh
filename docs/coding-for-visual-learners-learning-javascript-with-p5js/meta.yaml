- md: "Using the `keyCode` variable we could identify which alphanumeric key is pressed\
    \ as well with a bit of decoding. But there is another variable that works specifically\
    \ well for the alphanumeric characters and that is called `key`. `key` variable\
    \ stores the value of the alphanumeric key that is pressed as is, so it makes\
    \ it easier to identify which key was pressed.\n\n## Summary\n\nIn this chapter,\
    \ we learned about a better way to handle events, and that is event functions.\n\
    \nWe particularly focused on two event functions that are: `mousePressed` and\
    \ `keyPressed` event functions.\n\nWe also learned about some of the variables\
    \ that we can use inside the `keyPressed` function, that is `key` and `keyCode`.\
    \ `key` makes identifying the alphanumeric key presses easier whereas `keyCode`\
    \ is ideal for detecting other key presses as it can be compared against p5.js\
    \ variables such as `ENTER`, `SPACE`, etc. that makes identifying those buttons\
    \ easier.\n\nFrom the JavaScript part of the things we learned about the `parseInt`\
    \ function that can be used to convert number-like values (which includes strings\
    \ that represent a number as well) into an integer number.\n\n## Practice\n\n\
    Draw a rectangle to the screen where the keyboard arrow keys can control the position\
    \ of the rectangle.\n\n## 12 - More on p5.js\n\n## Rotate & Translate\n\nAt this\
    \ point, we are almost ready to work on our final project; an interactive game\
    \ built using Javascript and p5.js! Before we do that, I would like to demonstrate\
    \ couple more useful p5.js functions to extend the realm of things that we can\
    \ build.\n\nNotice how we can draw shapes on the screen using our current knowledge,\
    \ but we can’t really transform them like rotating them around their center. That’s\
    \ a big blocker on the kinds of visuals that we can build, so let’s learn how\
    \ to do transformations in p5.js to enhance our abilities.\n\nHaving used other\
    \ kinds of drawing libraries, I should say that doing transformations such as\
    \ scaling, rotating and translating shapes can be a bit unintuitive in p5.js.\
    \ Here is an example that demonstrates how to use the p5.js **rotate** function\
    \ that would allow us to rotate shapes.\n\n```javascript\nfunction setup() {\n\
    \    createCanvas(800, 300);\n    rectMode(CENTER);\n}\n\nfunction draw() {\n\
    \    background(220);\n    rect(width/2, height/2, 50, 50);\n    rect(width/2+50,\
    \ height/2+50, 50, 50);\n}\n```\n\n![12-01](img/41e582902bed374827550eb87c185e8d_102_0.png)\n\
    \nCurrently, we are drawing two rectangles that are diagonal to each other. Let’s\
    \ make use of the **rotate** function to see what’s going to happen.\n\n```javascript\n\
    function setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n    noStroke();\n\
    }\n\nfunction draw() {\n    background(220);\n    fill(237, 34, 93);\n    rotate(5);\n\
    \    rect(width/2, height/2, 50, 50);\n    rect(width/2+50, height/2+50, 50, 50);\n\
    }\n```\n\nYou will notice that both of the shapes disappeared from the screen.\
    \ If you were expecting the shapes to move by only 5 degrees, this must be a confusing\
    \ result. This happens because the default units that **rotate** function works\
    \ within p5.js is radians. We can make this function work using degrees instead\
    \ by using the **angleMode** function with the **DEGREES** p5.js variable. Make\
    \ this declaration inside the **setup** function.\n\n```javascript\nangleMode(DEGREES);\n\
    ```\n\nNow things work in a way that is more or less expected. We can now observe\
    \ that when we call the **rotate** function, we end up rotating every shape that\
    \ comes after the function call.\n\n```javascript\nfunction setup() {\n    createCanvas(800,\
    \ 300);\n    rectMode(CENTER);\n    noStroke();\n    angleMode(DEGREES);\n}\n\n\
    function draw() {\n    background(220);\n    fill(237, 34, 93);\n    rotate(5);\n\
    \    rect(width/2, height/2, 50, 50);\n    rect(width/2+50, height/2+50, 50, 50);\n\
    }\n```\n\n![12-02](img/41e582902bed374827550eb87c185e8d_104_0.png)\n\nAnother\
    \ thing to notice is that the rotation happens around the origin point, the top\
    \ left corner of the canvas. Whereas when we are controlling shapes, we would\
    \ usually like to have them rotate around their origin. So this function, as is,\
    \ doesn’t seem to be extremely useful.\n\n```javascript\nfunction setup() {\n\
    \    createCanvas(800, 300);\n    rectMode(CENTER);\n    noStroke();\n    angleMode(DEGREES);\n\
    }\n\nfunction draw() {\n    background(220);\n    fill(237, 34, 93);\n    rotate(5);\n\
    \    rect(width/2, height/2, 50, 50);\n    rect(width/2+50, height/2+50, 50, 50);\n\
    }\n```\n\nTo be able to have better control over the **rotate** function, we should\
    \ look into the **translate** function. **translate** function moves the object\
    \ for the given x and y translation amount from the origin point. Let’s make use\
    \ of it inside our current setup.\n\n```javascript\nfunction setup() {\n    createCanvas(800,\
    \ 300);\n    rectMode(CENTER);\n    noStroke();\n    angleMode(DEGREES);\n}\n\n\
    function draw() {\n    background(220);\n    fill(237, 34, 93);\n    translate(150,\
    \ 0);\n    rotate(5);\n    rect(width/2, height/2, 50, 50);\n    rect(width/2+50,\
    \ height/2+50, 50, 50);\n}\n```\n\n![12-03](img/41e582902bed374827550eb87c185e8d_105_0.png)\n\
    \nWhat's happening right now is that the **translate** function moves everything\
    \ inside the canvas 150 pixels to the right. It moves the entire coordinate system\
    \ as the rotation is also happening around 150px right-hand side of the origin\
    \ instead of happening from the origin.\n\nWithout further ado, here is how to\
    \ rotate things around their origin. I think it is easier to show how it is done\
    \ than to explain it. We will work with a single shape for now.\n\n```javascript\n\
    function setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n    noStroke();\n\
    \    angleMode(DEGREES);\n}\n\nfunction draw() {\n    background(220);\n    fill(237,\
    \ 34, 93);\n    translate(width/2, height/2);\n    rotate(45);\n    rect(0, 0,\
    \ 100, 100);\n}\n```\n\n![12-04](img/41e582902bed374827550eb87c185e8d_105_1.png)\n\
    \nIn this example, we are drawing a shape as we usually do but using the **translation**\
    \ function to set its x and y coordinates instead of feeding those values directly\
    \ into the shape drawing function. Doing this, when coupled with using the **rectMode**\
    \ function allow us to draw the shape with its center located at the origin. Basically,\
    \ we start off by drawing the shape at the origin point as all the transformation\
    \ functions work relative to that point. Then we use the **translate** and **rotate**\
    \ functions to move the shape to desired position and angle. Using this approach,\
    \ we need to remember to call **rotate** after **translate** function or the rotation\
    \ will still be happening relative to the original origin point which is probably\
    \ not desired.\n\nThe current shortcoming with this approach and with the usage\
    \ of transformation functions, in general, is that everything that we draw from\
    \ this point onward will be using this new origin point. The way to fix this is\
    \ using **push** and **pop** functions.\n\n## Push & Pop\n\nThe p5.js **push**\
    \ function allows us to create a new state and **pop** function restores the state\
    \ to the previous conditions. This allows us to have completely different settings\
    \ applied to individual objects without worrying if those settings will affect\
    \ the shapes that come after as long as we do everything in between a **push**\
    \ and a **pop** call. Again it is easier to see this in an example.\n\nWith our\
    \ current setup, everything that we draw after the **translate** and **rotate**\
    \ functions will have that 45 degrees of rotation applied to them.\n\n```javascript\n\
    function setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n    noStroke();\n\
    \    angleMode(DEGREES);\n}\n\nfunction draw() {\n    background(220);\n    fill(237,\
    \ 34, 93);\n    translate(width/2, height/2);\n    rotate(45);\n    rect(0, 0,\
    \ 150, 150);\n\n    fill(255, 255, 255);\n    rect(0, 0, 75, 75);\n}\n```\n\n\
    ![12-05](img/41e582902bed374827550eb87c185e8d_107_0.png)\n\nLet’s implement the\
    \ **push** and **pop** functions here so that we can isolate the transformation\
    \ that we are applying to the bigger rectangle.\n\n```javascript\nfunction setup()\
    \ {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n    noStroke();\n   \
    \ angleMode(DEGREES);\n}\n\nfunction draw() {\n    background(220);\n    \n  \
    \  push();\n    fill(237, 34, 93);\n    translate(width/2, height/2);\n    rotate(45);\n\
    \    rect(0, 0, 150, 150);\n    pop();\n    \n    fill(255, 255, 255);\n    rect(0,\
    \ 0, 75, 75);\n}\n```\n\n![12-06](img/41e582902bed374827550eb87c185e8d_107_1.png)"
  mdcn: "\n通过 `keyCode` 变量，我们可以通过一些解码来识别按下的是哪个字母数字键。但还有另一个变量专门适用于字母数字字符，那就是 `key`。`key`\
    \ 变量会直接存储所按下字母数字键的值，因此更容易识别按下了哪个键。\n\n## 总结\n\n在本章中，我们学习了一种更好的事件处理方式，即事件函数。\n\n\
    我们特别关注了两个事件函数：`mousePressed` 和 `keyPressed` 事件函数。\n\n我们还学习了可以在 `keyPressed` 函数内部使用的一些变量，即\
    \ `key` 和 `keyCode`。`key` 使得识别字母数字键的按下更加容易，而 `keyCode` 则非常适合检测其他按键，因为它可以与 p5.js\
    \ 变量（如 `ENTER`、`SPACE` 等）进行比较，这使得识别这些按钮变得更容易。\n\n从 JavaScript 的角度来看，我们学习了 `parseInt`\
    \ 函数，该函数可用于将类似数字的值（包括表示数字的字符串）转换为整数。\n\n## 练习\n\n在屏幕上绘制一个矩形，使用键盘方向键控制矩形的位置。\n\n\
    ## 12 - 更多 p5.js 内容\n\n## 旋转与平移\n\n至此，我们几乎准备好开始最终项目了；一个使用 Javascript 和 p5.js 构建的互动游戏！在此之前，我想再演示几个有用的\
    \ p5.js 函数，以扩展我们能够构建的内容范畴。\n\n请注意，我们虽然能用现有知识在屏幕上绘制形状，但无法真正地对它们进行变换，比如绕其中心旋转。这对于我们能构建的视觉效果是一个很大的障碍，所以让我们学习如何在\
    \ p5.js 中进行变换，以增强我们的能力。\n\n根据使用其他绘图库的经验，我应该说在 p5.js 中进行缩放、旋转和平移形状等操作可能有点不直观。下面是一个示例，演示如何使用\
    \ p5.js 的 **rotate** 函数来旋转形状。\n\n```javascript\nfunction setup() {\n    createCanvas(800,\
    \ 300);\n    rectMode(CENTER);\n}\n\nfunction draw() {\n    background(220);\n\
    \    rect(width/2, height/2, 50, 50);\n    rect(width/2+50, height/2+50, 50, 50);\n\
    }\n```\n\n![12-01](img/41e582902bed374827550eb87c185e8d_102_0.png)\n\n目前，我们绘制了两个对角放置的矩形。让我们利用\
    \ **rotate** 函数看看会发生什么。\n\n```javascript\nfunction setup() {\n    createCanvas(800,\
    \ 300);\n    rectMode(CENTER);\n    noStroke();\n}\n\nfunction draw() {\n    background(220);\n\
    \    fill(237, 34, 93);\n    rotate(5);\n    rect(width/2, height/2, 50, 50);\n\
    \    rect(width/2+50, height/2+50, 50, 50);\n}\n```\n\n你会注意到两个形状都从屏幕上消失了。如果你期望形状只移动5度，这结果肯定令人困惑。发生这种情况是因为\
    \ **rotate** 函数在 p5.js 中默认使用的单位是弧度。我们可以通过使用 **angleMode** 函数配合 p5.js 的 **DEGREES**\
    \ 变量，使该函数改用度数。在 **setup** 函数内部进行此声明。\n\n```javascript\nangleMode(DEGREES);\n```\n\
    \n现在事情的运作方式或多或少符合预期了。我们可以观察到，当调用 **rotate** 函数时，函数调用之后的所有形状都会被旋转。\n\n```javascript\n\
    function setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n    noStroke();\n\
    \    angleMode(DEGREES);\n}\n\nfunction draw() {\n    background(220);\n    fill(237,\
    \ 34, 93);\n    rotate(5);\n    rect(width/2, height/2, 50, 50);\n    rect(width/2+50,\
    \ height/2+50, 50, 50);\n}\n```\n\n![12-02](img/41e582902bed374827550eb87c185e8d_104_0.png)\n\
    \n另一个需要注意的地方是，旋转是围绕原点（画布的左上角）发生的。然而，在控制形状时，我们通常希望它们绕自身的原点旋转。因此，这个函数本身似乎并不是非常有用。\n\
    \n```javascript\nfunction setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n\
    \    noStroke();\n    angleMode(DEGREES);\n}\n\nfunction draw() {\n    background(220);\n\
    \    fill(237, 34, 93);\n    rotate(5);\n    rect(width/2, height/2, 50, 50);\n\
    \    rect(width/2+50, height/2+50, 50, 50);\n}\n```\n\n为了能更好地控制 **rotate** 函数，我们应该研究一下\
    \ **translate** 函数。**translate** 函数将对象从原点移动给定的 x 和 y 平移量。让我们在当前的设置中使用它。\n\n```javascript\n\
    function setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n    noStroke();\n\
    \    angleMode(DEGREES);\n}\n\nfunction draw() {\n    background(220);\n    fill(237,\
    \ 34, 93);\n    translate(150, 0);\n    rotate(5);\n    rect(width/2, height/2,\
    \ 50, 50);\n    rect(width/2+50, height/2+50, 50, 50);\n}\n```\n\n![12-03](img/41e582902bed374827550eb87c185e8d_105_0.png)\n\
    \n当前发生的情况是，**translate** 函数将画布内的所有内容向右移动了150像素。它移动了整个坐标系统，因为旋转也是在原点右侧150像素处发生的，而不是从原点开始。\n\
    \n事不宜迟，下面是如何让形状绕其自身原点旋转的方法。我认为展示如何做比解释它更容易。我们现在将使用单个形状来操作。\n\n```javascript\n\
    function setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n    noStroke();\n\
    \    angleMode(DEGREES);\n}\n\nfunction draw() {\n    background(220);\n    fill(237,\
    \ 34, 93);\n    translate(width/2, height/2);\n    rotate(45);\n    rect(0, 0,\
    \ 100, 100);\n}\n```\n\n![12-04](img/41e582902bed374827550eb87c185e8d_105_1.png)\n\
    \n在这个例子中，我们像往常一样绘制形状，但使用 **translation** 函数来设置其 x 和 y 坐标，而不是直接将这些值输入形状绘制函数。这样做，结合使用\
    \ **rectMode** 函数，允许我们绘制的形状以其自身中心位于原点。基本上，我们从在原点绘制形状开始，因为所有的变换函数都是相对于该点工作的。然后，我们使用\
    \ **translate** 和 **rotate** 函数将形状移动到所需的位置和角度。使用这种方法，我们需要记住在 **translate** 函数之后调用\
    \ **rotate**，否则旋转仍然会相对于原始的原点发生，这可能不是我们想要的。\n\n这种方法以及通用变换函数的当前缺点是，我们从此点开始绘制的所有内容都将使用这个新的原点。解决这个问题的方法是使用\
    \ **push** 和 **pop** 函数。\n\n## Push 与 Pop\n\np5.js 的 **push** 函数允许我们创建一个新的状态，而\
    \ **pop** 函数将状态恢复到之前的条件。这使我们能够为单个对象应用完全不同的设置，而不用担心这些设置会影响之后的形状，只要我们在 **push**\
    \ 和 **pop** 调用之间完成所有操作即可。再次强调，通过示例来看会更容易理解。\n\n根据我们当前的设置，在 **translate** 和 **rotate**\
    \ 函数之后绘制的所有内容都将应用45度的旋转。\n\n```javascript\nfunction setup() {\n    createCanvas(800,\
    \ 300);\n    rectMode(CENTER);\n    noStroke();\n    angleMode(DEGREES);\n}\n\n\
    function draw() {\n    background(220);\n    fill(237, 34, 93);\n    translate(width/2,\
    \ height/2);\n    rotate(45);\n    rect(0, 0, 150, 150);\n\n    fill(255, 255,\
    \ 255);\n    rect(0, 0, 75, 75);\n}\n```\n\n![12-05](img/41e582902bed374827550eb87c185e8d_107_0.png)\n\
    \n让我们在这里实现 **push** 和 **pop** 函数，以便我们可以隔离应用于较大矩形的变换。\n\n```javascript\nfunction\
    \ setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n    noStroke();\n\
    \    angleMode(DEGREES);\n}\n\nfunction draw() {\n    background(220);\n    \n\
    \    push();\n    fill(237, 34, 93);\n    translate(width/2, height/2);\n    rotate(45);\n\
    \    rect(0, 0, 150, 150);\n    pop();\n    \n    fill(255, 255, 255);\n    rect(0,\
    \ 0, 75, 75);\n}\n```\n\n![12-06](img/41e582902bed374827550eb87c185e8d_107_1.png)\n"
