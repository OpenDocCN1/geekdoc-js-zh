    \ side. They should also be moving at different speeds.\n\n## 05 - Conditional\
    \ Statements and Comparison Operators\n\n### frame, frameRate, and frameCount\n\
    \nIn the previous chapter, we saw some of the variables that p5.js makes available\
    \ for us. One important thing to note is that these variables can only be used\
    \ from inside the p5.js functions **setup** and **draw**. If we were to try to\
