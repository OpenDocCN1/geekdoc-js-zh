    \n如果你尝试在屏幕上绘制这些形状，此时你可能会注意到，每当调用一个形状函数时，它都会在之前的形状之上进行绘制。我们可以通过改变函数调用的顺序来影响形状的堆叠顺序。\n\
    \n```\n1 function setup() {\n2     createCanvas(800, 300);\n3     background(220,220,220);\n\
