    \n# About the Author\n\nEngin Arslan is a Web Developer with a Bachelor of Science\
    \ in Materials Engineering and a Postgraduate Degree in Visual Effects. Before\
    \ becoming a Developer, he worked as a Visual Effects Artist / Technical Director\
    \ on films and TV shows including Resident Evil, Tron, Mama, Pompeii, Vikings\
    \ and Strain. He received an Emmy Nomination and won a Canadian Screen Award for\
    \ his achievements in Visual Effects. During his time in VFX, he fell in love\
    \ with Python and with programming in general. As a result he changed careers\
    \ to be able to immerse himself completely in software development. Engin currently\
    \ works at a Toronto-based digital services company, where he helps develop solutions\
    \ in strategic problem spaces using emerging technologies. He also works at Seneca\
    \ College as a part-time professor and is an author for Pluralsight.\n\n# 01 -\
    \ Introduction\n\n## Why Learn Coding?\n\nMy first serious interaction with coding\
    \ was at College. We had to take a course on a programming language called **C\
    \ Sharp**. I failed the course the first time I had to take it and barely passed\
    \ it the second time that I had to take it again. With that defeat in mind, I\
    \ stayed away from coding for the longest time. I considered it to be a talent\
    \ that I simply didn't possess. Later, I went on to change my career from Engineering\
    \ to Visual Effects as I wanted to work in a field that had more room for creative\
    \ expression. But working in Visual Effects, I came to realize that, the entire\
    \ operation is actually enabled by the power of computation. From the software\
    \ that is used to the pipeline management that facilitates the production… Coding\
    \ is everywhere. It allows studios to deliver mind blowing effects for movies\
    \ that makes hundreds of millions of dollars in the box office.\n\nUpon realizing\
    \ the power of coding in my field, I decided to embark on a journey to learn more\
    \ about it. I ended up teaching myself Python, a programming language that is\
    \ widely used in Visual Effects. And doing so have been immensely gratifying.\
    \ Not only it allowed me to become more accomplished in my work in Visual Effects\
    \ and create award winning effects, but also empowered me to transition to an\
    \ even more rewarding career in Software Development.\n\nAt this age and time\
    \ that we live in, coding is simply invaluable. It has the power to uplift your\
    \ career, your future prospects and even your intellectual capacity. Computation\
    \ is driving one of the largest capital expansions in history and there has never\
    \ been a better time to learn coding than now.\n\n## Coding vs Programming\n\n\
    You must be hearing the terms Coding and Programming in similar contexts and might\
    \ be wondering what the difference between them is. In the past few years coding\
    \ has become the term of choice to make programming more approachable to general\
    \ population. Basically the premise is that you could be coding and still be contributing\
    \ to digital economy without actually doing programming.\n\nLet me give you an\
    \ example of that: You could be using web languages such as **HTML** and **CSS**\
    \ which are not programming languages. So when coding in those languages you are\
    \ not really programming but styling or structuring websites (more on their usage\
    \ in the next section). But you could also be coding in **JavaScript** which is\
    \ an actual programming language. Programming languages allow you to make computer\
    \ 'do' things. Every time you are programming something, you are also coding.\
    \ But when you are coding, you might not be programming. Coding is a more general\
    \ term that is used for describing all cases where you are communicating intent\
    \ to the computer.\n\nBasically you can think of programming as a subset of coding.\
    \ But truth be told these two terms are used almost interchangeably nowadays.\
    \ The main purpose of this book is to teach you how to program. We will be coding\
    \ for programming purposes by using the programming language JavaScript.\n\n##\
    \ On HTML and CSS\n\nLooking at my path for learning programming, I find some\
    \ of the efforts to teach coding to beginners to be a bit lacking. One of the\
    \ primary problems in the area is using HTML and CSS as introductory languages.\n\
    \nThe problem with these languages is that they are not even programming languages!\
    \ HTML is a markup language that is used to define the structure of a document\
    \ in a way that a web browser would understand. So HTML teaches you how to write\
    \ text for browser so that the browser would know what parts of it is a document\
    \ header vs a paragraph, etc...\n\nLikewise, CSS is not a programming language\
    \ either. It is a styling language that allows us to style HTML documents to have\
    \ them look aesthetically pleasing and ideally make them more user-friendly than\
    \ before. Furthermore, even though CSS can be used to create incredibly good looking\
    \ results, it is usually very unintuitive to work with and can be hard to reason\
    \ about even for a programmer. Learning CSS, you are not only not learning programming,\
    \ you are very likely engaging in an activity that might not be fun as a beginner\
    \ if styling websites is not your sole intention.\n\nThis push to teach coding\
    \ using these languages is understandable. After all, given the large dominance\
    \ of web applications and their immense profitability in certain cases, people\
    \ found themselves wanting to build their own projects for the web. And if you\
    \ are to build a website, you need to use these languages to a certain degree.\
    \ But having these languages as a starting point could create a misconception\
    \ about what coding is. Coding can be an immensely rewarding and engaging activity\
    \ when you are building programs or applications as the domain of possibilities\
    \ is substantially bigger. As discussed previously, we need to be using programming\
    \ languages to build programs so the apparent question is: \"What makes a language\
    \ a programming language?\"\n\nYou can always check Wikipedia for a semi-formal\
    \ definition. But to me, for a language to be considered a programming language\
    \ it needs to have certain control structures available to it that would allow\
    \ us to express some basic operations. Even this definition probably makes little\
    \ sense to a beginner. What is meant is that there are structures in programming\
    \ languages that allows the computer to perform *logical* operations. Some of\
    \ the examples to such structures, that we will see more about later, are: conditionals\
    \ which allows the program to output different results based on given"
  mdcn: "\n# 为视觉学习者而写：编程入门\n\n## 使用 p5.js 学习 JavaScript\n\n**Engin Arslan**\n\n© 2017\
    \ Engin Arslan\n\n> 致我的父母，\n\n如果没有你们，我将一无所有。字面意义上的。\n\n# 目录\n\n- [01 - 简介](#)\n\
    \  - [为什么要学习编程？](#)\n  - [编码（Coding）与编程（Programming）](#)\n  - [关于 HTML 和 CSS](#)\n\
    \  - [为什么要学习 JavaScript？](#)\n  - [为什么我们有不同的语言？](#)\n  - [使用 p5.js 学习 JavaScript](#)\n\
    \  - [关于本书](#)\n- [02 - 入门指南](#)\n  - [使用 p5.js 代码编辑器](#)\n  - [JavaScript 简明介绍](#)\n\
    \  - [p5.js 起步](#)\n  - [更多关于函数的内容](#)\n  - [p5.js 中的坐标系](#)\n  - [小结](#)\n- [03\
    \ - p5.js 中的颜色](#)\n  - [p5.js 中的颜色函数](#)\n  - [小结](#)](#)\n  - [练习](#)\n- [04\
    \ - 运算符与变量](#)\n  - [设置](#)\n  - [变量](#)\n  - [变量（续）](#)\n  - [p5.js 中的预定义变量](#)\n\
    \  - [小结](#)\n  - [练习](#)\n- [05 - 条件语句与比较运算符](#)\n  - [frame, frameRate 和 frameCount](#)\n\
    \  - [条件判断](#)\n  - [小结](#)\n  - [练习](#)\n- [06 - 更多 p5.js 变量](#)\n  - [介绍](#)\n\
    \  - [mouseIsPressed](#)\n  - [mouseX & mouseY](#)\n  - [小结](#)\n  - [练习](#)\n\
    - [07 - 循环](#)\n  - [For 循环](#)\n  - [随机（Random）和噪声（Noise）函数](#)\n  - [小结](#)\n\
    \  - [练习](#)\n- [08 - 函数](#)\n  - [创建函数](#)\n  - [回顾 Setup 和 Draw 函数](#)\n  -\
    \ [小结](#)\n  - [练习](#)\n- [09 - 对象](#)\n  - [对象简介](#)\n  - [构造函数](#)\n  - [小结](#)\n\
    - [10 - 数组](#)\n  - [使用数组](#)\n  - [小结](#)\n  - [练习](#)\n- [11 - 事件](#)\n  - [简介与\
    \ mousePressed](#)\n  - [keyPressed](#)\n  - [小结](#)\n  - [练习](#)\n- [12 - 更多\
    \ p5.js 进阶](#)\n  - [旋转（Rotate）与平移（Translate）](#)\n  - [Push 与 Pop](#)\n  - [小结](#)\n\
    \  - [练习](#)\n- [13 - 最终项目](#)\n  - [让我们打造一个游戏吧！](#)\n  - [起步](#)\n  - [用户交互](#)\n\
    \  - [记录用户得分](#)\n  - [最终代码](#)\n- [14 - 结语与后续方向](#)\n  - [恭喜你！](#)\n  - [接下来去哪里学习？](#)\n\
    \n# 关于作者\n\nEngin Arslan 是一位 Web 开发人员，拥有材料工程理学学士学位和视觉特效研究生学位。在成为开发人员之前，他曾担任视觉特效艺术家/技术总监，参与了包括《生化危机》（Resident\
    \ Evil）、《创：战纪》（Tron）、《妈妈》（Mama）、《庞贝》（Pompeii）、《维京传奇》（Vikings）和《血族》（Strain）在内的多部电影和电视剧。他凭借在视觉特效方面的成就获得了艾美奖提名并赢得了加拿大电影奖。在从事\
    \ VFX 期间，他爱上了 Python 以及广义上的编程。因此，他决定转换职业道路，以便完全沉浸在软件开发中。Engin 目前就职于多伦多的一家数字服务公司，利用新兴技术在战略性问题领域协助开发解决方案。他同时在\
    \ Seneca 学院担任兼职教授，并且是 Pluralsight 的作者。\n\n# 01 - 简介\n\n## 为什么要学习编程？\n\n我第一次严肃地接触编程是在大学期间。我们必须修一门关于一种名为\
    \ **C Sharp**（C#）编程语言的课程。第一次修这门课时我挂科了，第二次补考时才勉强及格。带着这种挫败感，我在很长一段时间里都远离了编程。我认为编程是一种我根本不具备的天赋。后来，我想在更有利于创意表达的领域工作，于是将职业从工程转向了视觉特效（VFX）。但在从事视觉特效工作后，我意识到，整个操作实际上是由计算能力支撑的。从所使用的软件到促进生产的流水线管理……编程无处不在。它让工作室能够为电影创造出令人惊叹的特效，从而在票房上斩获数亿美元。\n\
    \n在意识到编程在我所在领域的力量后，我决定开始一段深入学习它的旅程。最终我自学了 Python，这是一种在视觉特效中广泛使用的编程语言。而这次尝试让我获得了巨大的成就感。它不仅让我能在视觉特效工作中更加出色，创造出获奖的特效，还赋予了我转向更具回报的软件开发职业的能力。\n\
    \n在我们生活的这个时代，编程简直是无价之宝。它有能力提升你的职业生涯、未来的前景，甚至你的智力水平。计算正在推动历史上最大规模的资本扩张之一，现在是学习编程的最佳时机。\n\
    \n## 编码（Coding）与编程（Programming）\n\n你可能经常在相似的语境中听到“编码（Coding）”和“编程（Programming）”这两个词，并好奇它们之间有什么区别。在过去几年中，“Coding”成为了一个首选词汇，旨在让编程对于大众来说更具亲和力。基本上，其前提是你可以进行\
    \ coding，在不需要真正进行 programming 的情况下依然能为数字经济做出贡献。\n\n让我举个例子：你可以使用 **HTML** 和 **CSS**\
    \ 这样的 Web 语言，它们并不是编程语言。所以，当你用这些语言进行 coding 时，你并不是在真正地 programming，而是在为网站进行样式设计或结构搭建（下一节将详细介绍它们的用途）。但你也可以使用\
    \ **JavaScript** 进行 coding，它是一门真正的编程语言。编程语言允许你让计算机“执行”操作。每当你进行 programming 时，你也在进行\
    \ coding。但当你进行 coding 时，你不一定是在 programming。Coding 是一个更通用的术语，用于描述所有你向计算机传递意图的情况。\n\
    \n基本上，你可以将 programming 视为 coding 的一个子集。但坦白说，这两个词在如今几乎被互换使用。本书的主要目的是教你如何 programming。我们将使用\
    \ JavaScript 这种编程语言，为了 programming 的目的而进行 coding。\n\n## 关于 HTML 和 CSS\n\n回顾我的编程学习之路，我发现一些针对初学者的编程教学方法有些欠缺。该领域的主要问题之一就是将\
    \ HTML 和 CSS 作为入门语言。\n\n这些语言的问题在于，它们甚至根本不是编程语言！HTML 是一种标记语言，用于以 Web 浏览器能够理解的方式定义文档的结构。因此，HTML\
    \ 教你如何为浏览器编写文本，以便浏览器知道哪些部分是文档标题，哪些部分是段落等等。\n\n同样，CSS 也不是编程语言。它是一种样式语言，允许我们对 HTML\
    \ 文档进行美化，使其具有美感，且在理想情况下比之前更用户友好。此外，尽管 CSS 可以创造出极其出色的视觉效果，但它的操作通常非常不直观，即使对于程序员来说，推理其逻辑也可能很困难。学习\
    \ CSS，你不仅没有在学习 programming，而且如果你并非单纯为了设计网站，你很可能在从事一项对初学者来说并不有趣的活动。\n\n这种推动使用这些语言来教授\
    \ coding 的做法是可以理解的。毕竟，鉴于 Web 应用程序的巨大主导地位及其在某些情况下的极高盈利能力，人们希望能够构建自己的 Web 项目。如果你要构建一个网站，你在一定程度上必须使用这些语言。但将这些语言作为起点可能会导致对\
    \ coding 的误解。当你构建程序或应用程序时，coding 可以是一项极具回报且引人入胜的活动，因为其可能性领域要大得多。如前所述，我们需要使用编程语言来构建程序，那么显而易见的问题是：“是什么让一种语言成为编程语言？”\n\
    \n你随时可以在维基百科上查看半正式的定义。但对我来说，一种语言要被认为是编程语言，它需要具备某些控制结构，以便让我们表达一些基本操作。即使这个定义对初学者来说可能也没什么意义。其含义是，编程语言中存在允许计算机执行*逻辑*操作的结构。这类结构的一些例子（我们稍后会详细介绍）包括：允许程序根据给定条件输出不同结果的条件判断……\n"
