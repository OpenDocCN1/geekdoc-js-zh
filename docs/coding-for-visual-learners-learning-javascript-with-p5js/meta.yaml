    \   text(currentIndex, width/2, height/2);\n}\n```\n\n![](img/41e582902bed374827550eb87c185e8d_93_0.png)\n\
    \n### 10-06\n\n太棒了！使用这段代码，我们应该能在屏幕上看到一系列数字。但我们感兴趣的不是在屏幕上显示数字，而是显示数组中的单词。利用我们的知识，这很容易实现。我们将使用方括号表示法来访问数组中的单个项。\n\
    \n让我们创建另一个名为 **currentWord** 的变量，它将存储由 **currentIndex** 变量确定的当前单词。现在，我们可以在 text\
    \ 函数中使用这个变量来代替 **currentIndex**。\n\n```javascript\n1 var currentWord = words[currentIndex];\n\
    ```\n\n我们快完成了。但我想做的另一件事是根据单词更改背景颜色，因为现在的效果在美学上并不理想。\n\n我们将创建另一个名为 **colors** 的数组，其中包含颜色信息。事实证明，我们可以将一个数组传递给\
    \ p5.js 的颜色函数，这与一个接一个地传递值效果相同。\n\n因此，以下这两个表达式将创建相同的颜色。\n\n```javascript\n1 fill(255,\
    \ 0, 0);\n2 fill([255, 0, 0]);\n```\n\n我们将创建 **colors** 数组，其中包含我们将要使用的颜色数组。我们可以尝试自己想一些颜色值，但那样很难找到好看的颜色。\n\
    \nAdobe 有一个网页，我们可以在其中找到用于设计的配色方案。我将使用它来为我的可视化效果寻找一个合适的主题：[https://color.adobe.com/](https://color.adobe.com/)\n\
    \n在 explore 选项卡下，一旦我们找到了心仪的主题，就可以点击编辑按钮查看颜色的 RGB 值。我们可以选择自己喜欢的色板。以下是从该网站选择的颜色样本。\n\
    \n```javascript\n1 var colors = [\n2     [63, 184, 175],\n3     [127, 199, 175],\n\
    4     [218, 216, 167],\n5     [255, 158, 157],\n6     [255, 61, 127],\n7 ];\n\
    ```\n\n请注意，我的数据格式略有不同，因为我不希望行长度太长，以免影响代码的可读性。这仅仅是一种风格选择。\n\n现在，我们可以在 **fill**\
    \ 函数中使用这些颜色值，在每一帧更改背景颜色。最终代码如下所示：\n\n```javascript\n1 var words = ['I', 'love',\
    \ 'programming', 'with', 'JavaScript'];\n2 var colors = [\n3     [63, 184, 175],\n\
    4     [127, 199, 175],\n5     [218, 216, 167],\n6     [255, 158, 157],\n7    \
    \ [255, 61, 127],\n8 ];\n9\n10 function setup() {\n11     createCanvas(800, 300);\n\
    12     textAlign(CENTER, CENTER);\n13     frameRate(3);\n14 }\n15\n16 function\
    \ draw() {\n17     var currentIndex = frameCount % words.length;\n18     var currentColor\
    \ = colors[currentIndex];\n19     var currentWord = words[currentIndex];\n20 \
    \    background(currentColor);\n21     fill(255);\n22     textSize(45);\n23  \
    \   text(currentWord, width / 2, height / 2);\n24 }\n```\n\n## 总结\n\n在本章中，我们学习了一种名为“数组”的\
    \ JavaScript 数据结构。数组允许我们以顺序方式存储任何类型的多个值。存储在数组中的值可以使用方括号表示法来访问。\n\n我们可以在创建数组时填充所需的值，或者在创建后使用\
    \ **push** 方法进行填充。\n\n数组在与循环配合使用时尤其有用。循环使我们能够以非常简单的方式访问数组中的项。\n"
