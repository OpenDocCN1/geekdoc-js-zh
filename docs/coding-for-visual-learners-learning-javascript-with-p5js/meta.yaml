    11    fill(237, 34, 93);\n12    noStroke();\n13\n14    var x = canvasWidth / 2;\n\
    15    var y = canvasHeight / 2;\n16\n17    ellipse(x, y, 200, 200);\n18    fill(255);\n\
    19    rect(x, y, 150, 30);\n20 }\n```\n\nA variable that is declared at the top\
    \ level is called a *global variable*. It is usually not the best idea to declare\
    \ variables at this top level since we run our code in a browser, where other\
    \ things that are working in the browser such as plugins, add-ons, etc. might\
    \ cause conflicts by defining variables with the same name for their purposes.\
    \ Whenever two variable declarations share the same name, the one that gets declared\
    \ later overwrites the other one since the code is executed from top to bottom.\
    \ This might result in programs not behaving as expected. But it is not something\
    \ that you should necessarily worry about a lot as a beginner since other, more\
    \ experienced, developers - having the same concern - would have safeguards in\
    \ place to ensure their variables are not being overwritten. For now, we can put\
    \ our variables in the top section and be able to share them in different functions\
    \ that are defined at the same level or below.\n\nIn this case, we are initializing\
    \ the necessary variables outside the setup function so that those variables would\
    \ be accessible from both the **setup** and **draw** functions. Now we can try\
    \ setting the **canvasWidth** and **canvasHeight** variables to different values\
    \ and notice how the shape always remains at the center because its position is\
    \ derived using the same variables as the canvas.\n\n## Predefined Variables in\
    \ p5.js\n\np5.js, being a super helpful library, has a couple of predefined variables\
    \ that we can use to obtain certain values. Two such variable names that we can\
    \ use are **width** and **height**. By using these variable names inside the **setup**\
    \ or **draw** function, we can get the current canvas size. This allows us to\
    \ do the same thing that we were trying to do by defining our own variable names.\
    \ p5.js developers must have realized this is something that a lot of developers\
    \ would try to do by themselves and hence provided an easier solution to the problem.\n\
    \nWith this knowledge, the above code could be written like this:\n\n```javascript\n\
    function setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n}\n\n\
    function draw() {\n    background(1, 186, 240);\n    fill(237, 34, 93);\n    noStroke();\n\
    \n    var x = width / 2;\n    var y = height / 2;\n\n    ellipse(x, y, 200, 200);\n\
    \    fill(255);\n    rect(x, y, 150, 30);\n}\n```\n\nYou should note that **width**\
    \ and **height** are p5.js variables which mean that they won't be available outside\
    \ the setup or draw functions.\n\nNow that we know how to use variables, we can\
    \ animate our shapes! The trick to animation in p5.js is remembering that **draw**\
    \ function is constantly being executed for us by p5.js. Whatever we are putting\
    \ inside this function is actually being redrawn each time the **draw** function\
    \ is executed again.\n\nThe number of times that this **draw** function is executed\
    \ (can be thought as rendered to the screen) is called a frame rate. By default,\
    \ p5.js has a frame rate of 60. This means that it tries to re-draw (or render)\
    \ the content of the **draw** function 60 times a second. If we had a way to change\
    \ the values of the variables that we are using in between each of these **draw**\
    \ calls, then we would be able to create animations.\n\nThis should remind you\
    \ of flipbook animations. Each call to a **draw** function results in a static\
    \ image, but since it happens 60 times a second when each of these images is slightly\
    \ different, you perceive it to be animated.\n\nTo be able to create an animation,\
    \ we are going to initialize a variable outside the **draw** function called **count**.\
    \ And inside the **draw** function, we will use this simple expression which will\
    \ increment the **count** variable by one every time the **draw** function is\
    \ called.\n\n```javascript\ncount = count + 1;\n```\n\nNow if we are to make use\
    \ of this variable in a position argument, we can make a shape move. This is an\
    \ amazing step forward in our p5.js adventure."
