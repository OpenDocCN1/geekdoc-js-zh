    Since these shapes are not being positioned relative to the canvas size, if we
    are to change the size of the canvas, the relative position of the shapes will
    change as well. For a square canvas, the shape is currently at the center, but
    for a wider canvas, the shape might start falling to the left-hand side. To have
    the shapes close to the center for any given canvas size, we can start off by
    using a variable to set the width and height values for the canvas. Then we can
