    \n计算机擅长的事情之一就是重复。想象一下，需要在屏幕上创建 1000 个具有不同参数的形状。以我们目前的编程知识，这将耗费我们极不合理的时间。对于这类我们希望原封不动或带有变化地重复代码的情况，我们可以利用一种称为\
    \ *循环* 的编程结构。循环允许我们反复执行一段代码。\n\n我们已经熟悉了 p5.js 中循环的概念。仔细想想，**draw** 函数就是一个持续的循环，它被一遍又一遍地执行，直到我们退出\
    \ p5.js 程序。在本章中，我们将学习如何自己构建这种循环。\n\nJavaScript 中有几种不同的循环结构，但 *for 循环* 到目前为止是最流行的。它允许我们重复执行一段操作特定的次数。一个\
    \ *for 循环* 有四个部分。下面是如何构建 *for 循环* 的一个例子。\n\n```\nfor (var i = 0; i < 10; i = i\
    \ + 1) {\n    // 执行一些操作\n}\n```\n\n在第一部分，我们初始化一个变量来跟踪循环执行的次数——我们称之为计数器变量。\n\n\
    ```\nvar i = 0;\n```\n\n按照惯例，在 *for 循环* 内部，我们通常倾向于使用简短的变量名，如 **i** 或 **j**，特别是当该变量仅用于控制\
    \ *for 循环* 的流程时。但如果对你的情况有意义，也请随意使用其他名称。\n\n在第二部分，我们为循环定义了一个测试条件，每次循环即将开始时都会对这个条件进行求值。在这个例子中，我们检查计数器变量是否小于数字\
