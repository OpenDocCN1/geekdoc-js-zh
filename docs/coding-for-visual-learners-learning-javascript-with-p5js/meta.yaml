    But we don’t need to do this using the p5.js library. Because of how the p5.js
    library is architected, it looks for function declarations with the name **setup**
    and **draw**, and executes these functions for us. The reason why p5.js takes
    control of the execution of these functions is that it executes them in a very
    specific manner.


    p5.js executes the **setup** function only once and then goes on to execute the
    draw function in a repeated manner such that if we don’t stop the process it will
    just keep working forever. This is a very standard behaviour with any graphical
    interface - think of the web browser, the games you play, or the operating system
    you interface with. These are just programs that continuously work - and display
    to the screen - until we explicitly close them. This is why p5.js creates an execution
    loop for the **draw** function so that things will persist on the screen instead
    of appearing for a second and then disappearing.


