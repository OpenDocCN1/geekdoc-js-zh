  md: 'the fact that knowing a programming language actually makes it more likely
    that you will be able to pick up another language as they share similar principles
    among each other.


    Choosing which language to learn as your first can sometimes be a tough choice
    as there are lots of viable options out there. Sometimes the choice is dictated
    by the application domain. If you are seeking to build a game using the Unreal
    Engine maybe you should just learn **C++**. But then again if it''s your first
    time interfacing with a programming language, you might be faced with such a steep
    learning curve that it might be discouraging.


    JavaScript stands to be a great choice to learn as your first programming language.
    As mentioned earlier, it is widely used and has a vast application domain which
    would allow you to experiment with lots of different applications. It has a big
    and active community behind it and have a very concise syntax which makes it closer
    to human languages.


    # Learning JavaScript with p5.js


    One of the most challenging aspects of learning programming is to find engaging
    examples that are not only fun and impressive but also illustrative of the subject
    matter at hand. Once you get the hang of it, programming is a highly rewarding
    and an engaging activity but to a beginner most of the problems that a professional
    programmer has to tackle, might seem uninteresting or straight up boring. That''s
    why this book uses a JavaScript library, an add-on, called **p5.js** in teaching
    this introduction to programming book. p5.js will allow you to create engaging
    interactive and visual pieces that you would have fun while creating and it will
    also let you build a strong foundation for software development. The visual nature
    of this library will allow us to actually see the results from our scripts as
    graphics and develop an intimate understanding of programming structures.


    p5.js is a programming library. A programming library can be thought as a collection
    of code that is built for a specific purpose so that whenever you need to perform
    an action that relates to that purpose you can use a library instead of building
    that functionality yourself. Libraries build on and extend the core capabilities
    of a language. For JavaScript, there are more than hundred thousands of libraries
    out there that allows you to perform a large variety of operations. So it is always
    a good idea to check if someone already created an open source or even a paid
    library for your needs before trying to implement your own functionality. The
    idea is that, a library would be a battle tested solution for a particular problem
    that you can utilize with confidence, instead of devising your own solution which
    might introduce unforeseen problems into the program you are developing. This
    is particularly true for JavaScript as the core language doesn''t have any built-in,
    standard, library and hence development efforts rely heavily on external libraries
    to tackle common problems. Here are examples for couple of interesting libraries
    to give you a taste what is available out there:'
  merge: -1
  pgno: 11
- img_proc: true
  md: '+   - Faker.js (https://github.com/Marak/Faker.js) : Generate massive amounts
    of fake data

    - franc (https://github.com/wooorm/franc) : Detect the language of a given text.

    - jimp (https://github.com/oliver-moran/jimp) : An image processing library

    - cylon.js (https://cylonjs.com/) : A robotics framework for robotics, physical
    computing and the internet of things.


    p5.js is a creative coding library that is based on the idea of sketching. Just
    like how sketching can be thought of as a minimal approach to drawing to quickly
    prototype an idea, p5.js is built on the concept of writing the minimal amount
    of code to translate your visual, interaction or animation ideas to the screen.
    p5.js is a JavaScript implementation of the popular library called **Processing**
    which is based on the **Java** programming language.


    It is worth mentioning that **Java** and **JavaScript** are completely unrelated
    languages. The reason why JavaScript is named after Java is an unfortunate branding
    and marketing decision made back in the day.


    The concise nature of p5.js makes it a very easy library to learn. But don''t
    let this simplicity trick you into believing that p5.js has limited capabilities.
    p5.js has an impressive amount of functionality, history and community behind
    it to make it a valuable learning investment if you ever wanted to create art,
    design, motion or interactive pieces using code. A p5.js program can be anywhere
    from a few lines of code to thousands. Since p5.js was built with simplicity in
    mind, sometimes small p5.js programs are referred to as sketches. Even though
    that''s a clever way to describe it, I am personally not a huge fan of that wording
    since it obfuscates the fact that what you are doing is programming after all.


    You can find pragmatic applications of p5.js such as creating data visualizations:'
