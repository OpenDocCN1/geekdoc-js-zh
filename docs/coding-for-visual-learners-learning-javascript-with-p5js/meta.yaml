  md: 'The solution to this problem is; instead of declaring our variables inside
    the **setup** function, we should declare them at this top level so they would
    be accessible from everything else that is declared inside at the top level.


    ```

    1 var canvasWidth = 800;

    2 var canvasHeight = 300;

    3

    4 function setup() {

    5     createCanvas(canvasWidth, canvasHeight);

    6     rectMode(CENTER);

    7 }

    8

    9 function draw() {

    10    background(1, 186, 240);

    11    fill(237, 34, 93);

    12    noStroke();

    13

    14    var x = canvasWidth / 2;

    15    var y = canvasHeight / 2;

    16

    17    ellipse(x, y, 200, 200);

    18    fill(255);

    19    rect(x, y, 150, 30);

    20 }

    ```


    A variable that is declared at the top level is called a *global variable*. It
    is usually not the best idea to declare variables at this top level since we run
    our code in a browser, where other things that are working in the browser such
    as plugins, add-on''s, etc. might cause conflicts by defining variables with the
    same name for their purposes. Whenever two variable declarations share the same
    name, the one that gets declared later overwrites the other one since the code
    is executed from top to bottom. This might result in programs not behaving as
    expected. But it is not something that you should necessarily worry about a lot
    as a beginner since other, more experienced, developers - having the same concern
    - would have safeguards in place to ensure their variables are not being overwritten.
    For now, we can put our variables in the top section and be able to share them
    in different functions that are defined at the same level or below.


    In this case, we are initializing the necessary variables outside the setup function
    so that those variables would be accessible from both the **setup** and **draw**
    functions. Now we can try setting the **canvasWidth** and **canvasHeight** variables
    to different values and notice how the shape always remains at the center because
    its position is derived using the same variables as the canvas.


