  md: "# 08 - Functions\n\n# Creating Functions\n\nFunctions are primary building\
    \ blocks of JavaScript. They allow us to write programs in a more efficient and\
    \ scalable manner. Functions help us to manage complexity by containing and grouping\
    \ operations under a single executable name. We already know how to call functions\
    \ by using the p5.js predefined functions such as **ellipse** or **background**.\
    \ We even created our own functions as p5.js forces us to put our code into two\
    \ function declarations, **setup** and **draw**. If we wanted to create our own\
    \ functions, we would be following the same convention that we have been using\
    \ for the creation, or declaration, of these functions.\n\nTo create (or to declare)\
    \ a new function, we would start off by using the function keyword and then give\
    \ the function a name of our choosing that ideally describes the behaviour or\
    \ purpose of the function.\n\n```\nfunction functionName() {\n    // function\
    \ body\n}\n```\n\nNext, to the function name we would open brackets. If we want\
    \ to build a function that works with user input, we can define parameters inside\
    \ the brackets that would act as placeholder variable names for the future user\
    \ input. We will see how this works in a bit.\n\nThen we have curly braces. Inside\
    \ curly braces can be referred to as the function body. In there, we would write\
    \ the code that would construct the logic of the function. We can also make use\
    \ of the parameters, the variable names we defined inside the brackets next to\
    \ the function name, as part of the operations we want to perform inside the function\
    \ body.\n\nLet's look at a simple example. Notice how p5.js has an **ellipse**\
    \ function but not a **circle** function. This is not really an issue since we\
    \ can easily create a circle by providing the ellipse function with same width\
    \ and height values. For argument's sake, though, let's create a **circle** function\
    \ that would work with three values: the x and y position that we want to draw\
    \ our circle at and the diameter of the circle.\n\nHere is how to do it. Inside\
    \ the brackets, we will be writing down variable names that would eventually be\
    \ provided when this function is called. These names are called *parameters* as\
    \ they parameterize the functionality of the operation we are creating. We"
  merge: -1
  pgno: 71
- img_proc: true
  md: "will be using these parameters inside our function to be able to let the user\
    \ control the inner workings of the function.\n\n```\nfunction circle(x, y, diameter)\
    \ {\n    ellipse(x, y, diameter, diameter);\n}\n```\n\nWe can choose anything\
    \ as parameter names, but it usually makes sense to use names that communicate\
    \ the intent clearly. So in our case, using the names; x, y, and radius makes\
    \ sense.\n\nAfter defining this function, we can call it by using its name and\
    \ providing it with values. Values provided to the function are called *arguments*\
    \ to the function. Notice that the function might fail or not work as expected\
