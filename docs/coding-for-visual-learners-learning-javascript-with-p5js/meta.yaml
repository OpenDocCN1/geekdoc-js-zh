    value instead of typing the value again. Here is how that works:


    ```

    1 var bigNumber = 321314543265 + 34251646315526623

    2 console.log(bigNumber)

    3 console.log(bigNumber - 10)

    ```


    We are creating a variable called **bigNumber** by using the **var** keyword.
    **var** is the keyword that we need to use whenever we are creating a variable.
    After the **var** keyword, we are giving this variable a name, which in this case
    is **bigNumber**.


    It is important to choose a variable name that makes sense for the current context.
    In this example, this might not matter too much, but as our programs get more
    complex, meaningful variable names can help us understand what’s going when reading
    our code. So naming this kind of a variable that holds a large number as **cat**
    wouldn’t make much sense and can confuse other people that might read our code.
    It might even confuse us if we are to come back to our code couple of months later.
    Programmers always strive to make their code as readable as possible.


    Once this variable is declared, we can assign a value to it by using the equal
    operator. This might seem unusual at first. In Math, the equal operator is used
    to signify equality in between two values. Here we are using it to do a value
    assignment to a variable. It takes the value on the right-hand side of the operation
    and assigns it to the variable on the left-hand side. This is a pretty common
    procedure that exists in many programming languages.'
  - '[PAGE 20]


    Now that we have a variable that points to a value, we can use this variable name
    in operations instead of the value itself. As mentioned earlier, it is good to
    have variable names that make sense. There are also some rules that govern what
    we can, and can''t use as variable names. For example, we can''t use some of the
    special characters such as dashes or exclamation marks or use a space character
    inside our variable names.

    Another restriction is that we can''t use certain JavaScript reserved names as
    variable names; we can''t call our variable **var** as this name is already in
    use by JavaScript. If we tried to use **var** as a variable name; as in `var var
    = 5`, JavaScript would **throw** an error.


    This mention of rules might be making you uneasy at this point. After all programming
    is supposed to be fun right? But don''t worry the reserved name list is relatively
    short, so you don''t need to memorize it. And as you learn more of the language,
    you would also develop a better sense as to which names to avoid.


    Regarding rules, there is another rule that should be mentioned. JavaScript needs
    us to place semicolons after each statement. If we don''t do this our program
    can still work but might fail in certain edge conditions that can be hard to identify
    later on. So it is a good idea to use semicolons after every statement even though
    it means a bit more work on our part. The above code should actually be written
    like this:


    ```

    console.log(1 + 1);

    console.log(5 + 10);

    console.log(213 * 63);

    var bigNumber = 321314543265 + 34251646315526623;

    console.log(bigNumber);

    console.log(bigNumber - 10);

    ```


    Notice that doing `bigNumber - 10` wouldn''t change the initial value of the **bigNumber**
    variable. In this following example, the **console.log** statement would still
    output 10.


    ```

    var x = 10;

    x + 5;

    console.log(x);

    ```


    If we want to change the value of a variable, then we need to assign a new value
    to it.


    ```

    var bigNumber = 321314543265 + 34251646315526623;

    console.log(bigNumber);

    bigNumber = 3;

    console.log(bigNumber);

    ```


    In this example, the **console.log** would display the value `3` because we override
    the initial value with another value on line 3.


    There is this concept of data types in JavaScript (and in other languages as well)
    to differentiate in between different kinds of values. These numbers that we have
    been'
  - '[PAGE 21]


    using are of a data type called **Number**. There is another data type called
    **Strings** that is used to represent textual information.


    In JavaScript, we can''t just write a word and expect it to represent data. For
    example, we want to **console.log** the word **hello**. If we do this right now,
    we will notice that we are getting an error. JavaScript doesn''t understand what
    **hello** means. It assumes that it is a variable that is not defined yet.


    ```

    1 console.log(hello);

    2 > 1: Uncaught ReferenceError: hello is not defined

    ```


    But what if we wanted to actually input the word **hello** to the computer? There
    are programs out there that work with textual data, which needs to process a given
    name or address, etc. In that case we can provide the data using quotation marks
    which mean that we are providing the value as a **string**.


    ```

    1 console.log(''hello'');

    ```


    JavaScript is not complaining this time. Anytime we are dealing with textual data
    we need to place it in quotation marks, this would make it registered as a string.
    And when I say textual data, it can be numbers as well. A string can consist of
    numeric values:


    ```

    1 console.log(''1234'');

    ```


    In that case, they are not treated as Mathematical numbers that we can perform
    Math operations with, but just as text.


    We can perform operations on strings, but it doesn''t yield the same result as
    when we would perform those operations using numbers. We can actually add two
    strings together:


    ```

    1 console.log(''hello'' + ''world'');

    2 > ''helloworld''

    ```


    And this will just combine these two words together. And when I say we can''t
    perform Math operations with strings that contain numeric values, this is what
    it meant:


    ```

    1 console.log(''1'' + ''1'');

    2 > ''11''

    ```


    In this case, the numeric values are not treated as numbers but as strings, and
    they are not summed together but combined. This act of combining strings is commonly
    referred to as *concatenation* operation in programming.'
  - "[PAGE 22]\n\nconcerned. We can define strings by using either single quotation\
    \ ' or double quotation marks \" but we have to finish the string with the same\
    \ symbol we choose to start defining with. Also in our programs, we shouldn't\
    \ use one type of quotation mark for one string and another for a different one.\
    \ Consistency is very important when developing programs.\n\nOne other thing that's\
    \ worth mentioning before wrapping up this section is the concept of **comments**.\
    \ Comments allow us to write things into our programs that won't get executed\
    \ by the computer. Such as:\n\n```\n// various examples. (this is a comment)\n\
    console.log(1 + 1);\nconsole.log(5 + 10);\nconsole.log(213 * 63);\nvar bigNumber\
    \ = 321314543265 + 342516463155266237;\nconsole.log Success);\nconsole.log(bigNumber\
    \ - 10);\n```\n\nThe line that starts with double slashes gets ignored by JavaScript.\
    \ Double slashes allow us to comment on a single line; if we needed to comment\
    \ on multiple lines, we would either need to use double slashes at the beginning\
    \ of each line or use the /* */ symbol like:\n\n```\n// various examples\n// disabling\
    \ the first 3 lines by using multiline comments:\n/*\nconsole.log(1 + 1);\nconsole.log(5\
    \ + 10);\nconsole.log(213 * 63);\n*/\nvar bigNumber = 321314543265 + 342516463155266237;\n\
    console.log(bigNumber);\nconsole.log(bigNumber - 10);\n```\n\nBelieve it or not,\
    \ this is enough of a JavaScript primer to get us started with using p5.js. If\
    \ you are using the code editor, click on the **New Project** button to be able\
