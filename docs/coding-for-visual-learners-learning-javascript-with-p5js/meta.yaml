    \n请注意，现在所有的形状都在使用相同的动画。如果我们想让每个形状获得不同的 noise 值该怎么办？目前数值是重复的，因为当 **noise** 函数接收到相同的值时，会返回相同的输出。为了让每个形状获得不同的输出值，我们可能需要重写上述函数，利用\
    \ **for loop** 的 **i** 和 **j** 值来调整 noise 的采样位置。\n\n```javascript\n1 function\
    \ setup() {\n2     createCanvas(800, 300);\n3     rectMode(CENTER);\n}\n\nfunction\
    \ draw() {\n    background(1, 75, 100);\n    fill(237, 34, 93);\n    noStroke();\n\
    \    var diameter = 50;\n\n    for (var i=0; i<width/diameter; i=i+1) {\n    \
    \    for (var j=0; j<height/diameter; j=j+1) {\n            ellipse(\n       \
    \         diameter/2 + i * diameter,\n                diameter/2 + j * diameter,\n\
    \                diameter * noise(frameCount/100 + j*10000 + i*10000),\n     \
    \           diameter * noise(frameCount/100 + j*10000 + i*10000)\n           \
    \ );\n        }\n    }\n}\n```\n\n![](img/41e582902bed374827550eb87c185e8d_69_0.png)\n\
    \n07-08\n\n我们在上面作为乘数使用的 10000 这个值是完全随机的。我们只是想确保提供给 noise 函数的坐标彼此之间距离足够远。\n\n##\
    \ 总结\n\n循环是编程中最强大的结构之一。它让我们能够利用计算机真正的计算能力，大规模地重复执行操作，而这些操作如果由人类在合理的时间内完成几乎是不可能的。\n\
    \n在本章中，我们学习了如何构建 **for loops**（for 循环），以及如何将循环相互嵌套，从而获得一个重复形状的网格，而不仅仅是一行形状。\n\n\
    我们还学习了 p5.js 的 **random** 和 **noise** 函数及其之间的区别。\n\n## 练习\n\n创建一个循环，生成一组矩形数组，其颜色从黑色逐渐变为白色。你应该这样构建循环，使得由一个单一变量来控制绘制矩形的数量。\n\
    \n![](img/41e582902bed374827550eb87c185e8d_70_0.png)\n\n# 08 - 函数\n\n## 创建函数\n\
    \n函数是 JavaScript 的基础构建块。它们允许我们以更高效、更具可扩展性的方式编写程序。函数通过将操作包含在一个单一的可执行名称下进行分组，帮助我们管理复杂性。我们已经知道如何通过使用\
    \ p5.js 的预定义函数（如 **ellipse** 或 **background**）来调用函数。我们甚至创建了自己的函数，因为 p5.js 强制我们将代码放入两个函数声明中：**setup**\
    \ 和 **draw**。如果我们想创建自己的函数，我们将遵循与创建（或声明）这些函数相同的约定。\n\n要创建（或声明）一个新函数，我们会先使用 `function`\
    \ 关键字，然后给函数起一个我们选择的名字，理想情况下该名称应描述函数的行为或目的。\n\n```javascript\nfunction functionName()\
    \ {\n    // function body\n}\n```\n\n接下来，在函数名后面我们会打开括号。如果我们想构建一个处理用户输入的函数，可以在括号内定义参数，这些参数将作为未来用户输入的占位变量名。我们稍后会看到这是如何运作的。\n\
    \n然后是大括号。大括号内部被称为函数体。在其中，我们将编写构建函数逻辑的代码。我们也可以在函数体中执行的操作中使用参数（即我们在函数名旁括号内定义的变量名）。\n\
    \n让我们来看一个简单的例子。请注意 p5.js 有 **ellipse** 函数但没有 **circle** 函数。这其实不是问题，因为我们可以通过向 ellipse\
    \ 函数提供相同的宽度和高度值来轻松创建圆形。但为了论证起见，让我们创建一个 **circle** 函数，它接收三个值：我们想要绘制圆形的 x 和 y 位置，以及圆形的直径。\n\
    \n具体做法如下。在括号内，我们将写下在调用该函数时最终会提供的变量名。这些名称被称为 *参数 (parameters)*，因为它们将我们创建的操作的功能参数化。我们将在函数内部使用这些参数，以便让用户控制函数的内部运行。\n\
    \n```javascript\nfunction circle(x, y, diameter) {\n    ellipse(x, y, diameter,\
    \ diameter);\n}\n```\n\n我们可以随意选择参数名称，但通常使用能清晰传递意图的名称更有意义。因此在我们的例子中，使用 x、y 和 diameter\
    \ 这些名称是合理的。\n\n定义好这个函数后，我们可以通过使用其名称并为其提供值来调用它。提供给函数的这些值被称为该函数的 *实参 (arguments)*。请注意，如果没有提供所有必需的实参，函数可能会失败或无法按预期工作。\n\
    \n```javascript\ncircle(width/2, height/2, 100);\n```\n\n如果你觉得这些术语令人困惑，不用太担心。习惯它们可能需要一段时间。函数的\
    \ *参数 (parameters)* 可以被看作是用户在使用函数时最终会提供的值。而调用函数时提供的这些相同的值则被称为 *实参 (arguments)*。\n\
    \n有了 **circle** 函数，我们再也不需要担心使用 **ellipse** 函数来画圆了。我们可以直接使用自己的函数来绘制那些完美的圆。既然我们自己实现了\
    \ **circle** 函数，我们就知道它在底层实际上使用了 ellipse 函数来绘制这些圆。但函数的妙处在于，一旦它们可用，我们其实不需要知道它们是如何工作的。我们可以直接使用它们，而无需思考它们是如何实现的。由创建\
    \ p5.js 的聪明人们实现的 **ellipse** 函数内部可能使用了各种手段来绘制椭圆，但对我们而言，调用它就能画出一个椭圆，这就足够了。\n\n\
    在这个例子中，创建 circle 函数并没有带来太高的效率。事实上，我们只需向 **ellipse** 函数传递三个实参而不是四个就能画圆。但在构建更复杂的程序时，函数变得非常重要，因为它们通过将操作包含在单一的可执行名称下，帮助我们管理复杂性。函数本质上是黑盒。它们封装了所包含的代码，并且在函数内部使用\
    \ **var** 关键字声明的任何变量在函数外部都是不可见的。\n\n```javascript\nfunction setup() {\n    createCanvas(800,\
    \ 300);\n    sayHello();\n}\n\nfunction draw() {\n    background(220);\n}\n\n\
    function sayHello() {\n    var message = 'Hello World!';\n    console.log(message);\n\
    }\n\nconsole.log(message);\n```\n\n第 15 行的 **console.log** 函数将抛出错误，因为变量 **message**\
    \ 仅在 **sayHello** 函数内部可见。\n\n函数可以不带输入、带单个输入或多个输入，并且它们要么 *返回 (return)* 一个结果，要么不返回。让我解释一下我所说的返回值的含义。\n\
    \n假设我们要创建一个函数，将给定的数值乘以自身，本质上是计算给定数字的平方。这里有一个实现该功能的函数，它接收一个数字作为参数，并创建一段文本将该数字显示在屏幕上。因此它是有一定用处的，因为我们可以使用这个函数将结果显示在屏幕上，从而知道一个极大的数字的平方可能是多少。\n\
    \n```javascript\n1 function setup() {\n2     createCanvas(800, 300);\n3 }\n\n\
    5 function draw() {\n6     background(1, 75, 100);\n7     fill(237, 34, 93);\n\
    8     squared(10);\n9 }\n\n11 function squared(num) {\n12     textSize(60);\n\
    13     textAlign(CENTER, CENTER);\n14     text(num * num, width/2, height/2);\n\
    15 }\n```\n\n![](img/41e582902bed374827550eb87c185e8d_73_0.png)\n"
