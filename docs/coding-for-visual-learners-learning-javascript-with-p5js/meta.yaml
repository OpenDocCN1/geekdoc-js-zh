  mdcn: "\n如果我们输入 **True** 或 **False**，将无法得到相同的结果。编程语言对书写方式非常敏感。**True** 并不等同于 **true**。此外，**True**\
    \ 并不是 JavaScript 能够识别的值，因此在不加引号的情况下编写它会导致错误。\n\n```javascript\nconsole.log(True);\n\
    //Uncaught ReferenceError: True is not defined(...)\n```\n\n我们可以使用**比较**运算符来生成\
    \ **true** 或 **false** 值。比较运算符允许我们比较两个值，并根据比较结果生成一个 **true** 或 **false** 值。以下是比较运算符的示例。我们有**大于**符号，它比较两个数字，如果左侧的数字大于右侧的数字，则返回\
    \ **true**，否则返回 **false**。\n\n```javascript\n10 > 2; // would evaluate to true\n\
    1 > 100; // false\nconsole.log(100 > 1); //true\n```\n\n**大于或等于**在左侧的值大于或等于右侧的值时返回\
    \ **true**。\n\n```javascript\nconsole.log(100 >= 100); //true\n```\n\n此外还有**小于**和**小于或等于**比较运算符。\n\
    \n```javascript\nconsole.log(1 < 10); //true\nconsole.log(10 <= 10); //true\n\
    ```\n\n为了比较两个值以检查它们是否相等，我们会使用“三等号” **===**。这与我们在数学课上习惯的不同，数学中的等号运算符是单等号 =。但在 JavaScript\
    \ 中，单等号运算符已被用作赋值操作。\n\n```javascript\nconsole.log(1 === 1); //true\n```\n\n我们还可以进行比较以检查两个值是否不相等。为此，我们在等号前使用一个感叹号。\n\
    \n```javascript\nconsole.log(1 !== 1);\n```\n\n请务必尝试使用我们学到的比较运算，看看它们在控制台中会生成什么样的结果。\n\
    \n让我们来看一个使用了 **if** 结构的示例。\n\n```javascript\nvar num;\n\nfunction setup() {\n\
    \    num = 1;\n    createCanvas(800, 300);\n    textAlign(CENTER, CENTER);\n \
    \   fill(237, 34, 93);\n}\n\nfunction draw() {\n    background(220);\n    textSize(48);\n\
    \    if (num === 1) {\n        text('TRUE', width / 2, height / 2);\n    }\n}\n\
    ```\n\n由于括号内的表达式求值为 **true**，因此 **if 块**将被执行。毕竟，数字 1 等于数字 1。我们将看到单词 TRUE 显示在屏幕上，因为这就是\
    \ **if 块**内部代码的作用。\n\n如果我们把 **num** 变量的值改为 2，那么屏幕上将不会显示任何内容，因为这一次，**if 块**的比较结果将为\
    \ **false**，条件语句将不会被执行。\n\n除了 **if** 块，我们还可以使用另一种额外的结构，称为 **else 块**。**else**\
    \ 块紧跟在 **if** 块之后，并为所有不被 **if** 块覆盖的其他比较情况执行。让我们使用 **else** 块来扩展之前的示例。\n\n```javascript\n\
    var num;\n\nfunction setup() {\n    num = 2;\n    createCanvas(800, 300);\n  \
    \  textAlign(CENTER, CENTER);\n    fill(237, 34, 93);\n}\n\nfunction draw() {\n\
    \    background(220);\n    textSize(48);\n\n    if (num === 1) {\n        text('TRUE',\
    \ width / 2, height / 2);\n    } else {\n        text('FALSE', width / 2, height\
    \ / 2);\n    }\n}\n```\n\n现在在这个例子中，只要 **if** 语句不被执行，**else** 语句就会被执行。也就是说，对于 **num**\
    \ 变量除 1 以外的所有值，都会执行此语句。\n\n顺便说一下，请注意我们通过两次编写 **text** 函数而产生了重复。我们可以**重构**代码使其更加简洁。根据维基百科的定义，重构是在不改变外部行为的情况下，对现有计算机代码进行重新结构化（更改分解方式）的过程。\n\
    \n```javascript\nvar num;\n\nfunction setup() {\n    num = 2;\n    createCanvas(800,\
    \ 300);\n    textAlign(CENTER, CENTER);\n    fill(237, 34, 93);\n}\n\nfunction\
    \ draw() {\n    var value;\n    background(220);\n    textSize(48);\n\n    if\
    \ (num === 1) {\n        value = 'TRUE';\n    } else {\n        value = 'FALSE'\n\
    \    }\n    text(value, width/2, height/2);\n}\n```\n\n这段代码在重构之前的问题是，如果我们想更改文本的位置，我们需要记得在两个\
    \ text 函数调用中都进行更改。这看起来似乎很容易记住，但即使是这样的小事实际上也会让代码维护变得困难得多。\n\n在 if 条件语句中，我们还可以添加另一个条件块，即\
    \ **else if** 块。**else if** 块允许我们处理额外的条件。例如，我们可以在上面的示例中添加几个 **else if** 块：\n\n\
    ```javascript\nvar num;\n\nfunction setup() {\n    num = 2;\n    createCanvas(800,\
    \ 300);\n    textAlign(CENTER, CENTER);\n    fill(237, 34, 93);\n}\n\nfunction\
    \ draw() {\n    var value;\n    background(220);\n    textSize(48);\n\n    if\
    \ (num === 1) {\n        value = 'TRUE';\n    } else if (num === 2) {\n      \
    \  value = 'STILL TRUE';\n    } else if (num === 3) {\n        value = 'YEP, TRUE';\n\
    \    } else {\n        value = 'FALSE'\n    }\n    text(value, width/2, height/2);\n\
    }\n```\n\n尝试更改 **num** 变量的值，看看代码如何运行。通过使用 **else if** 块，我们可以为 **num** 的值处理更多特定的条件。\n\
    \n利用我们学到的知识，让我们修改在前一章编写的代码，使动画的行为取决于 **frameCount** 变量。\n\n```javascript\nfunction\
    \ setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n}\n\nfunction\
    \ draw() {\n    background(1, 186, 240);\n    fill(237, 34, 93);\n    noStroke();\n\
    \n    var x = width / 2;\n    var y = height / 2;\n    var size = 200;\n    if\
    \ (frameCount < 60) {\n        size = size + frameCount;\n    } else {\n     \
    \   size = size + 60;\n    }\n\n    ellipse(x, y, size, size);\n    fill(255);\n\
    \    rect(x, y, size*0.75, size*0.15);\n}\n```\n\n我们修改了之前的示例，使得如果 **frameCount**\
    \ 的值小于 60，形状将使用 **frameCount** 进行动画演示；否则，它将保持静止。\n\n为了让这段代码更易于维护，我们可以做哪些小重构？我们应该将数值\
    \ 60 保存到一个变量中，这样就不用在两个地方重复修改它。\n\n我们还可以通过使用 **&&** 或 **||** 运算符将两个逻辑表达式组合在一起，创建复合语句。**&&**\
    \ 代表**且 (and)**。它允许我们编写只有在*条件语句的所有部分都为真时*才求值为 **true** 的表达式。假设我们希望仅在 **frameCount**\
    \ 大于 10 **且** 小于 60 时才让形状产生动画。我们可以使用复合 **and** 语句将这两个条件结合起来。\n\n```javascript\n\
    if (10 < frameCount && frameCount < 60) {\n    size = size + frameCount;\n} else\
    \ {\n    size = size + 60;\n}\n```\n\n**||** 代表**或 (OR)**。只要条件语句中有一部分为 **true**，**OR**\
    \ 复合语句就会返回 **true**。假设我们希望在 **frameCount** 小于 60 **或** **frameCount** 值大于 120\
    \ 时让形状产生动画。为了表达这一点，我们可以写成如下形式。\n\n```javascript\nif (frameCount < 60 || frameCount\
    \ > 120) {\n    size = size + frameCount;\n} else {\n    size = size + 60;\n}\n\
    ```\n\n# 总结\n\n在本章中，我们学习了帧的概念以及它如何帮助我们在 p5.js 中创建动画图像。\n\n我们还学习了 p5.js 的 `frameCount`\
    \ 变量（用于跟踪目前显示了多少帧）以及 `frameRate` 函数（允许我们设置 p5.js 的帧率）。\n\n我们学习了一些其他的 p5.js 函数，例如允许我们在屏幕上绘制文本的\
    \ `text` 函数，以及允许我们对齐屏幕上绘制文本的 `textAlign` 函数。\n\n在 JavaScript 领域，我们学习了比较运算符、*Boolean*（布尔）数据类型（`true`\
    \ 和 `false`），以及最重要的 `if`、`else if` 和 `else` 条件语句。这些结构在编程中非常常见，并且存在于许多其他编程语言中。它们允许我们编写行为更加智能的代码，而不是盲目地从上到下执行。\n\
    \n# 练习\n\n创建一个动画：五个初始在屏幕外的矩形从左侧进入屏幕。它们应该以不同的速度移动，并在即将离开屏幕之前停止。\n"
