    \ if the value on the left-hand side is bigger or equal to the value on the right-hand\
    \ side.\n\n```javascript\nconsole.log(100 >= 100); //true\n```\n\nThere is also\
    \ **smaller** and **smaller or equals** comparison operators.\n\n```javascript\n\
