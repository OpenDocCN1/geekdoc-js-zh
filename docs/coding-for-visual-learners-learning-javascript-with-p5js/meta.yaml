    to the color that you choose and make use of those values inside p5.js.


    We can actually pass a fourth argument to a color setting function. This fourth
    argument, called the alpha component of the color, controls the opacity of the
    color and again accepts values from 0 to 255. 0 would result in full transparency
    and 255 would result in full opaqueness.


    So we can pass a single value, three values or four values to a color setting
    function. I don''t want to overwhelm you with too much information, but we can
    pass only two arguments as well. If we are to do so, we would be setting a grayscale
    color and an alpha component for that grayscale color.


    If this abundance of options seems overwhelming, remember that they are there
    for our convenience. p5.js could have restricted the color functions to only work
    with four inputs which would have covered all the cases but would have been time-consuming
    to provide additional data when you only wanted something like opaque white which
    happens more often than not. It seems like developers of p5.js built their functions
