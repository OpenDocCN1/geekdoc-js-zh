- md: "## 06 - More p5.js Variables\n\n### Intro\n\nIn the previous chapter, we learned\
    \ about the p5.js **frameCount** variable that provides us with a number that\
    \ represents the number of times the **draw** function is called. There are bunch\
    \ of other highly useful variables that we could be using in p5.js. We will be\
    \ learning about a few more in this chapter.\n\n### mouseIsPressed\n\n**mouseIsPressed**\
    \ is the first p5.js variable that we will see, that will allow us to add some\
    \ interactivity to our programs. **mouseIsPressed** is a p5.js variable that assumes\
    \ the value **true** when the mouse is clicked on the canvas area and **false**\
    \ for every other time. Let's alter our example from the previous chapter to quickly\
    \ see how we can use this variable.\n\n```\nfunction setup() {\n    createCanvas(800,\
    \ 300);\n    rectMode(CENTER);\n}\n\nfunction draw() {\n    background(1, 186,\
    \ 240);\n    fill(237, 34, 93);\n    noStroke();\n\n    var x = width / 2;\n \
    \   var y = height / 2;\n    var size = 200;\n    ellipse(x, y, size, size);\n\
    \    fill(255);\n    if (mouseIsPressed === true) {\n        rect(x, y, size *\
    \ 0.75, size * 0.15);\n    }\n}\n```\n\nClicking on the canvas area will now display\
    \ the rectangle inside the circle. By using the **mouseIsPressed** p5.js variable,\
    \ we made the display of the rectangle conditional to the mouse click.\n\nToggling\
    \ the state of something based on mouse click might be a more involving example\
    \ so let's see how to tackle that as well. Say we would like to change the background\
    \ color for our sketch every time we click the mouse button. We will make it so\
    \ that it will toggle in between two colors.\n\n```\nvar toggle = true;\n\nfunction\
    \ setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n}\n\nfunction\
    \ draw() {\n    if (mouseIsPressed === true) {\n        toggle = !toggle;\n  \
    \  }\n\n    if (toggle === true) {\n        background(1, 186, 240);\n    } else\
    \ {\n        background(250, 150, 50);\n    }\n\n    fill(237, 34, 93);\n    noStroke();\n\
    \n    var x = width / 2;\n    var y = height / 2;\n    var size = 200;\n\n   \
    \ ellipse(x, y, size, size);\n    fill(255);\n    rect(x, y, size * 0.75, size\
    \ * 0.15);\n}\n```\n\nIn this example, we are creating a global variable called\
    \ **toggle** that would store a **boolean** value. Then we make this **boolean**\
    \ value to change to the opposite of what it was with each mouse click by using\
    \ the exclamation mark operator. When used in front of a **boolean** value, *exclamation*\
    \ mark would simply invert that value, meaning it would make a **true** a **false**\
    \ and vice versa.\n\nYou might notice that the **mouseIsPressed** variable doesn't\
    \ seem to work great in capturing our clicks. This is because **draw** function\
    \ is being called numerous times in a second which makes it hard to detect mouse\
    \ clicks using a conditional. Later, we will see a better way of detecting mouse\
    \ clicks using p5.js **Events**.\n\n### mouseX & mouseY\n\np5.js variable **mouseX**\
    \ holds the current horizontal position of the mouse and **mouseY** holds the\
    \ current vertical position. This sounds simple enough, but it has the potential\
    \ to enable a great deal of user interaction in our programs and hence is incredibly\
    \ useful variables. If we are to provide these values as x and y coordinates of\
    \ a shape, we would essentially be moving that shape as we move our cursor on\
    \ the screen.\n\nLet's try this with a simplified version of our previous program.\
    \ Here is a version of it with just a circle being drawn in the middle of the\
    \ screen.\n\n```\nfunction setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n\
    }\n\nfunction draw() {\n    background(1, 75, 100);\n    fill(237, 34, 93);\n\
    \    noStroke();\n\n    var x = width / 2;\n    var y = height / 2;\n    var size\
