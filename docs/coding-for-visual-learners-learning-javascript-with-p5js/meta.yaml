    \ = 800;\n3     var canvasHeight = 300;\n4\n5     createCanvas(canvasWidth, canvasHeight);\n\
    6     rectMode(CENTER);\n7 }\n8\n9 function draw() {\n10     background(1, 186,\
    \ 240);\n11     fill(237, 34, 93);\n12     noStroke();\n13\n14     var x = canvasWidth/2;\n\
    15     var y = canvasHeight/2;\n16\n17     ellipse(x, y, 200, 200);\n18     fill(255);\n\
