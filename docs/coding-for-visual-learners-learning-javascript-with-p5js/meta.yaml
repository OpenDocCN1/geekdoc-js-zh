    We also learned about the **this** keyword which allows us to refer to the properties
    of the object from within the object itself.


    We learned about two ways of creating objects. One of them is using an **object
    initializer**, and the other one is using **constructor functions**. While we
    are creating a single object using an object initializer, constructor functions
    act as a blueprint from which we can create many object instances using the **new**
    keyword.


    There is a whole programming paradigm called *Object Oriented Programming* across
    different programming languages that leverage the usage of objects for code organization
    and clarity. Using p5.js, we don''t necessarily need to create objects to organize
    our code, but I wanted to introduce objects for two reasons:


    First of all, objects are a fundamental part of the JavaScript Language. If you
    would like to learn more about the language at a later time, you would need to
    get comfortable with how objects work.


    Secondly, JavaScript has other built-in structures that are based on objects that
    we will be using so it was important for us to familiarize ourselves more with
    objects.


    Now if you are just starting out, the takeaway from this chapter should be to
    know that there is this data structure that exists in JavaScript called **Objects**
    that helps with organizing code. It also allows for code to be represented in
    a certain way that makes it easier to work with and reason about in certain cases.
    As we are starting out, we won''t make use of objects all that much, but it is
    important to know of them for your later studies.'
- md: "## 10 - Arrays\n\n### Working with Arrays\n\n**Arrays** are another useful\
    \ data structure in JavaScript, that is based on **Objects**, which makes certain\
    \ operations much easier to perform.\n\nArrays are a sequential collection of\
    \ data that is stored with a numbered index. Remember that we use curly brackets\
    \ to create an empty object. We can create an empty array in a similar fashion\
    \ by using square brackets.\n\n```javascript\n1 var arr = [];\n```\n\nIn this\
    \ example, we created an empty array and used a variable called **arr** to store\
    \ that array. Now if we wanted to add elements to this array, we can use the **push**\
    \ method that array objects have.\n\n```javascript\n1 var arr = [];\n2 arr.push(1);\n\
    3 arr.push(\"hello world\");\n4 arr.push({\"name\":\"value\"});\n5 console.log(arr);\n\
    ```\n\nIn this example, we are pushing three new values to the previously empty\
    \ array. In the first line, we are pushing in a value of **number** type, in the\
    \ second line we are pushing a **string** type into the array and in the third\
    \ line we are pushing an **object** type into it.\n\nNow if we are to look at\
    \ the contents of the array by using **console.log**, we will see something like\
    \ this on screen:\n\n```javascript\n1 [1,\"hello world\",{\"name\":\"value\"}]\n\
    ```\n\nNotice how we used different data types and objects to populate the Array.\
    \ Arrays can contain any object, even other arrays. Just like how it is with JavaScript\
    \ objects, we can populate an Array at creation time by providing desired values\
    \ inside square brackets using a comma to separate them. Let’s create an array\
    \ with four numbers in it.\n\n```javascript\n1 var arr = [15, 40, 243, 53];\n\
    2 console.log(arr);\n```\n\nWe can use the index number property that automatically\
    \ gets generated to access the individual items in an array. One thing to know\
    \ though is the indices that refer to the stored items in an array starts from\
    \ 0. To access an individual item in an array, we can type the variable name that\
    \ the array is stored in, and then use the index number in square brackets to\
    \ refer to that item at that index. The number 0, will refer to the first item\
    \ in the array - which is 15 -, the index number 1 will be for the second item,\
    \ etc...\n\n```javascript\n1 var arr = [15, 40, 243, 53];\n2 var firstItem = arr[0];\n\
    3 console.log(firstItem);\n```\n\nIf we try to access an item that doesn’t exist,\
    \ we will get an **undefined** value. Which makes sense because that item is not\
    \ defined. Remember objects also return an **undefined** value when we try to\
    \ access a property that doesn’t exist.\n\nLet’s see how the array data structure\
    \ can simplify things when building programs. We will start with a simple example.\
    \ Imagine we want to create five different circles of distinct sizes. To be able\
    \ to do so, with our current knowledge, we would need to create five different\
    \ variables and assign those variables the desired values. And then call the **ellipse**\
    \ function five times, using a different variable each time.\n\n```javascript\n\
    1 var size1 = 200;\n2 var size2 = 150;\n3 var size3 = 100;\n4 var size4 = 50;\n\
    5 var size5 = 25;\n6\n7 ellipse(width/2, height/2, size1, size1);\n8 ellipse(width/2,\
    \ height/2, size2, size2);\n9 ellipse(width/2, height/2, size3, size3);\n10 ellipse(width/2,\
    \ height/2, size4, size4);\n11 ellipse(width/2, height/2, size5, size5);\n```\n\
    \nWe are only drawing five circles to the screen, but this is already looking\
    \ like a burdensome solution. What if we needed to draw 100 circles or even 1000?\
    \ This is where arrays come into play and make our job much easier.\n\nFirst,\
    \ let’s create an array of desired circle sizes. As mentioned earlier, we can\
    \ use the index numbers to access the individual items in an array. We will use\
    \ this knowledge to fetch the desired values from our array.\n\n```javascript\n\
    1 var sizes = [200, 150, 100, 50, 25];\n2\n3 ellipse(width/2, height/2, sizes[0],\
    \ sizes[0]);\n4 ellipse(width/2, height/2, sizes[1], sizes[1]);\n5 ellipse(width/2,\
    \ height/2, sizes[2], sizes[2]);\n6 ellipse(width/2, height/2, sizes[3], sizes[3]);\n\
    7 ellipse(width/2, height/2, sizes[4], sizes[4]);\n```\n\nThis is already looking\
    \ so much better. But notice the amount of repetition that’s still happening.\
    \ We are essentially typing the same thing over and over again when calling the\
    \ **ellipse** function, the only thing that’s changing is the index numbers. A\
    \ very clear pattern is emerging here if we had a structure that would create\
    \ a loop for us to call **ellipse** function five times with increasing values,\
    \ then we wouldn't have to repeat ourselves.\n\nLuckily, we know how to create\
    \ a *for loop* that would help us to do precisely that. Here is the above code\
    \ re-written to use a for loop.\n\n```javascript\n1 var sizes = [200, 150, 100,\
    \ 50, 25];\n2 for (var i = 0; i < 5; i++) {\n3     ellipse(width / 2, height /\
    \ 2, sizes[i], sizes[i]);\n4 }\n```\n\nHere is the usage of the code inside a\
    \ p5.js example:\n\n```javascript\n1 function setup() {\n2     createCanvas(800,\
    \ 300);\n3     fill(237, 34, 93);\n4     strokeWeight(2);\n5 }\n6 \n7 function\
    \ draw() {\n8     var sizes = [200, 150, 100, 50, 25];\n9     for (var i = 0;\
    \ i < 5; i++) {\n10        ellipse(width / 2, height / 2, sizes[i], sizes[i]);\n\
    11    }\n12 }\n```\n\n![](img/41e582902bed374827550eb87c185e8d_87_0.png)\n10-01\n\
    \nNotice the usage of the number five inside the for loop header. It is there\
    \ because the array that we are using has five items in it. So if there were six\
    \ items, then we should update this value to be six. But this is a bit problematic,\
    \ what if we made our array bigger but forgot to update this value? Luckily we\
    \ can use an array property called **length** instead, which would give us the\
    \ number of items in an array. We can re-write the above code to make use of the\
    \ **length** property.\n\n```javascript\n1 var sizes = [200, 156, 100, 25, 5];\n\
    2 for (var i = 0; i < sizes.length; i++) {\n3   ellipse(width / 2, height / 2,\
    \ sizes[i], sizes[i]);\n4 }\n```\n\nOur code is much more concise now, and it\
    \ is insanely scalable as well. We can just keep adding new values to the sizes\
    \ array, and an equal amount of circles will be drawn for us. Just for fun, let's\
    \ automate this setup even further. Currently, we are manually creating the array\
    \ that has the size values. But we could create another for loop that would populate\
    \ this array with any amount of random number of our choosing by using the **random**\
    \ function.\n\n```javascript\n1 var sizes = [];\n2 \n3 function setup() {\n4 \
    \    createCanvas(800, 600);\n5     noFill();\n6     for (var i=0; i<100; i++)\
    \ {\n7         var randomValue = random(5, 500);\n8         sizes.push(randomValue);\n\
    9     }\n10 }\n11 \n12 function draw() {\n13     background(255);\n14     for\
    \ (var i = 0; i < sizes.length; i++) {\n15         ellipse(width / 2, height /\
    \ 2, sizes[i], sizes[i]);\n16     }\n17 }\n```\n\n![](img/41e582902bed374827550eb87c185e8d_89_0.png)\n\
    10-02\n\nLet’s walk through what’s happening in this example. We are first setting\
    \ the background color to be white inside the **draw** function. Also, we are\
    \ calling the **noFill** function that would draw the shapes without a fill color.\
    \ These are just stylistic choices. We are creating an empty **sizes** array that\
    \ we will be populating with random numbers. Then we are creating a loop that\
    \ is going to iterate for 100 times. Inside that loop, for each iteration, we\
    \ are creating a random value in between 5 and 500 using the **random** function,\
    \ and pushing that generated random value inside the **sizes** array using the\
    \ **push** method.\n\nThe next step remains the same. We are creating ellipses\
    \ for all the values that exist in the **sizes** array. Notice how changing a\
    \ single value in this program, the amount of random numbers being generated which\
    \ is at 100 right now controls the entire outcome. This is a great example that\
    \ exhibits how simple programming structures can create very robust and scalable\
    \ solutions.\n\nLet’s work on another visualization using Arrays! The plan is\
    \ to create an animation that is sequentially and continuously going to display\
    \ the given words in a stylistic manner.\n\nFirst, let’s refresh our knowledge\
    \ on how to create text in p5.js. We would be using the **text** function that\
    \ takes three arguments: the text to display, and the x and y position of"
  mdcn: "\n## 10 - 数组\n\n### 使用数组\n\n**数组 (Arrays)** 是 JavaScript 中另一种非常有用的数据结构，它基于\
    \ **对象 (Objects)** 构建，这使得某些操作执行起来更加简单。\n\n数组是一个按编号索引存储的顺序数据集合。记住，我们使用花括号来创建一个空对象；类似地，我们可以使用方括号来创建一个空数组。\n\
    \n```javascript\n1 var arr = [];\n```\n\n在这个例子中，我们创建了一个空数组，并使用名为 **arr** 的变量来存储该数组。现在，如果我们想向这个数组添加元素，可以使用数组对象自带的\
    \ **push** 方法。\n\n```javascript\n1 var arr = [];\n2 arr.push(1);\n3 arr.push(\"\
    hello world\");\n4 arr.push({\"name\":\"value\"});\n5 console.log(arr);\n```\n\
    \n在这个例子中，我们将三个新值推入之前为空的数组中。在第一行，我们推入了一个 **number**（数字）类型的值；在第二行，我们将一个 **string**（字符串）类型推入数组；在第三行，我们将一个\
    \ **object**（对象）类型推入其中。\n\n现在，如果我们使用 **console.log** 查看数组的内容，屏幕上会显示类似这样的内容：\n\n\
    ```javascript\n1 [1,\"hello world\",{\"name\":\"value\"}]\n```\n\n请注意，我们使用了不同的数据类型和对象来填充数组。数组可以包含任何对象，甚至可以是其他数组。就像\
    \ JavaScript 对象一样，我们可以在创建数组时，通过在方括号内提供所需的值（并用逗号分隔）来对其进行初始化。让我们创建一个包含四个数字的数组。\n\
    \n```javascript\n1 var arr = [15, 40, 243, 53];\n2 console.log(arr);\n```\n\n\
    我们可以使用自动生成的索引编号属性来访问数组中的单个项目。但需要知道的一点是，指向数组中存储项的索引是从 0 开始的。要访问数组中的单个项目，我们可以输入存储该数组的变量名，然后使用方括号中的索引号来引用该位置的项目。数字\
    \ 0 将指向数组中的第一个项目（即 15），索引号 1 将指向第二个项目，依此类推……\n\n```javascript\n1 var arr = [15,\
    \ 40, 243, 53];\n2 var firstItem = arr[0];\n3 console.log(firstItem);\n```\n\n\
    如果我们尝试访问一个不存在的项目，将会得到一个 **undefined**（未定义）值。这很合理，因为该项目确实没有被定义。记住，当我们尝试访问对象中不存在的属性时，同样会返回\
    \ **undefined** 值。\n\n让我们看看数组数据结构在构建程序时如何简化问题。我们从一个简单的例子开始。假设我们想创建五个大小不同的圆。根据我们目前的知识，我们需要创建五个不同的变量，并为这些变量分配所需的值。然后调用五次\
    \ **ellipse** 函数，每次使用一个不同的变量。\n\n```javascript\n1 var size1 = 200;\n2 var size2\
    \ = 150;\n3 var size3 = 100;\n4 var size4 = 50;\n5 var size5 = 25;\n6\n7 ellipse(width/2,\
    \ height/2, size1, size1);\n8 ellipse(width/2, height/2, size2, size2);\n9 ellipse(width/2,\
    \ height/2, size3, size3);\n10 ellipse(width/2, height/2, size4, size4);\n11 ellipse(width/2,\
    \ height/2, size5, size5);\n```\n\n虽然我们只在屏幕上绘制五个圆，但这看起来已经是一个很累赘的解决方案了。如果我们需要绘制\
    \ 100 个甚至 1000 个圆怎么办？这就是数组发挥作用的地方，它能让我们的工作变得轻松许多。\n\n首先，让我们创建一个包含所需圆尺寸的数组。正如前面提到的，我们可以使用索引号来访问数组中的单个项目。我们将利用这个知识从数组中获取所需的值。\n\
    \n```javascript\n1 var sizes = [200, 150, 100, 50, 25];\n2\n3 ellipse(width/2,\
    \ height/2, sizes[0], sizes[0]);\n4 ellipse(width/2, height/2, sizes[1], sizes[1]);\n\
    5 ellipse(width/2, height/2, sizes[2], sizes[2]);\n6 ellipse(width/2, height/2,\
    \ sizes[3], sizes[3]);\n7 ellipse(width/2, height/2, sizes[4], sizes[4]);\n```\n\
    \n这样看起来已经好多了。但请注意，仍然存在大量重复。在调用 **ellipse** 函数时，我们基本上是在一遍又一遍地输入相同的内容，唯一改变的是索引号。这里出现了一个非常清晰的模式：如果我们有一个结构可以为我们创建一个循环，让我们用递增的值调用五次\
    \ **ellipse** 函数，那么我们就不用重复编写代码了。\n\n幸运的是，我们知道如何创建 *for 循环 (for loop)* 来精准地实现这一点。下面是将上述代码改写为使用\
    \ for 循环后的样子：\n\n```javascript\n1 var sizes = [200, 150, 100, 50, 25];\n2 for\
    \ (var i = 0; i < 5; i++) {\n3     ellipse(width / 2, height / 2, sizes[i], sizes[i]);\n\
    4 }\n```\n\n以下是在 p5.js 示例中使用该代码的方式：\n\n```javascript\n1 function setup() {\n2\
    \     createCanvas(800, 300);\n3     fill(237, 34, 93);\n4     strokeWeight(2);\n\
    5 }\n6 \n7 function draw() {\n8     var sizes = [200, 150, 100, 50, 25];\n9  \
    \   for (var i = 0; i < 5; i++) {\n10        ellipse(width / 2, height / 2, sizes[i],\
    \ sizes[i]);\n11    }\n12 }\n```\n\n![](img/41e582902bed374827550eb87c185e8d_87_0.png)\n\
    10-01\n\n请注意 for 循环头部使用的数字 5。之所以使用它，是因为我们使用的数组包含五个项目。所以如果有六个项目，我们就应该将这个值更新为 6。但这有点问题，如果我们扩大了数组但忘记更新这个值怎么办？幸运的是，我们可以改用一个名为\
    \ **length** 的数组属性，它能给出数组中项目的数量。我们可以重写上述代码以利用 **length** 属性。\n\n```javascript\n\
    1 var sizes = [200, 156, 100, 25, 5];\n2 for (var i = 0; i < sizes.length; i++)\
    \ {\n3   ellipse(width / 2, height / 2, sizes[i], sizes[i]);\n4 }\n```\n\n现在我们的代码更加简洁，而且具有极强的可扩展性。我们只需不断向\
    \ sizes 数组中添加新值，程序就会为我们绘制相应数量的圆。为了增加趣味性，让我们进一步自动化这个设置。目前，我们是手动创建包含尺寸值的数组。但我们可以创建另一个\
    \ for 循环，利用 **random** 函数用我们选择的任意数量的随机数来填充这个数组。\n\n```javascript\n1 var sizes\
    \ = [];\n2 \n3 function setup() {\n4     createCanvas(800, 600);\n5     noFill();\n\
    6     for (var i=0; i<100; i++) {\n7         var randomValue = random(5, 500);\n\
    8         sizes.push(randomValue);\n9     }\n10 }\n11 \n12 function draw() {\n\
    13     background(255);\n14     for (var i = 0; i < sizes.length; i++) {\n15 \
