    The first thing you should notice is that the **translate** function call results
    accumulate. If we perform a **translate** of (0, 100) after `width/ 2, height/2`,
    the resulting **translate** would be `width/2, height/2 + 100`.


    Another thing that is new in this code is the p5.js **sin** ** and **map** functions
    that we are using to create a blinking text. A **sin** function calculates the
    sine of an angle. Given sequential values the resulting **sine** ** value would
    alternate in between -1 and 1. -1 and 1 are hardly useful to us as numeric values
    in our use case though. A value that alternates in between 0 and 255 would be
    vastly more useful if we are to use this **value to set **alpha** of a **fill**
    function. This is where the **map** ** function comes into play. The **map** function
    maps the given value that is within the given range (second and third arguments)
    to the new given range (fourth and fifth arguments).


    ```

    1 var alternatingValue = map(sin(frameCount/10), -1, 1, 0, 255);

    ```


    We are mapping the result of the **sin** function that is in between -1 and 1
    to 0 and 255.


    Instead of simply executing a **return** ** statement we can instead call this
    new **function to display a message to the player. Next thing we implemented is
    a way to **restart the game once it is over. For this, we require two things.
    First we need a **way to respond to the **ENTER** key. And then we need to re-initialize
    the relevant **game variables to create the impression of a new game starting.


    This is the part of the **keyPressed** ** function that responds to the **ENTER**
