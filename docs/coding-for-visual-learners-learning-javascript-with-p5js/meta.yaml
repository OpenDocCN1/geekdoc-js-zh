    \ size*0.15);\n\n20\n\n21    count = count + 1;\n22 }\n```\n\n## 总结\n\n在本章中，我们回顾了之前见过的运算符，并讨论了运算符优先级。然后我们再次审视了变量，并进一步学习了它们的行为，特别是关于作用域的内容。我们还学习了\
