  md: '# 09 - Objects


    # Introduction to Objects


    JavaScript uses a data structure called **Object** that helps to organize data
    together. There are a couple of ways of creating an **object** in JavaScript,
    one way of doing it would be by using the curly brackets.


    ```

    1 var colors = {};

    ```


    These curly brackets are called *Object Initializer*. They create an empty object.
    We hold a reference to the object by using the variable **color**.


    Now, we can add properties to this **color** object by providing the desired property
    names after a dot. This is called *dot notation*. We will also assign values to
    these newly created properties.


    ```

    1 var colors = {};

    2 colors.black = 0;

    3 colors.darkGray = 55;

    4 colors.gray = 125;

    5 colors.lightGray = 175;

    6 colors.white = 255;

    ```


    If we are to look at the object at this point by using **console.log**, we would
    see it looks something like this.


    ```

    1 {"black":0,"darkGray":55,"gray":125,"lightGray":175,"white":255}

    ```


    We could also have created an object with the same properties from get go, by
    providing these properties inside curly brackets.


    ```

    1 var colors = {

    2     black: 0,

    3     darkGray: 55,

    4     gray: 125,

    5     lightGray: 175,

    6     white: 255,

    7 };

    ```


    Objects are basically *key-value* pairs. Each key stores a *value* and each *key-value*
    pair make up a *property* on an object.


    To be able to access a value on an object, we can again use the dot notation.'
