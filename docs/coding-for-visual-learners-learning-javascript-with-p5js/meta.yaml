  - "[PAGE 102]\n\n# 12 - More on p5.js\n\n# Rotate & Translate\n\nAt this point,\
    \ we are almost ready to work on our final project; an interactive game built\
    \ using Javascript and p5.js! Before we do that, I would like to demonstrate couple\
    \ more useful p5.js functions to extend the realm of things that we can build.\n\
    \nNotice how we can draw shapes on the screen using our current knowledge, but\
    \ we can’t really transform them like rotating them around their center. That’s\
    \ a big blocker on the kinds of visuals that we can build, so let’s learn how\
    \ to do transformations in p5.js to enhance our abilities.\n\nHaving used other\
    \ kinds of drawing libraries, I should say that doing transformations such as\
    \ scaling, rotating and translating shapes can be a bit unintuitive in p5.js.\
    \ Here is an example that demonstrates how to use the p5.js **rotate** function\
    \ that would allow us to rotate shapes.\n\n```\n1 function setup() {\n2     createCanvas(800,\
    \ 300);\n3     rectMode(CENTER);\n4 \n5 }\n6 \n7 function draw() {\n8     background(220);\n\
    9     rect(width/2, height/2, 50, 50);\n10    rect(width/2+50, height/2+50, 50,\
