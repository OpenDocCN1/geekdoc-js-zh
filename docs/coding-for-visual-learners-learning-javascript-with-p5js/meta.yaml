    ```javascript\n1 Uncaught ReferenceError: canvasHeight is not defined (sketch:\
    \ line 14)\n2 Uncaught ReferenceError: canvasWidth is not defined (sketch: line\
    \ 14)\n```\n\nThis might come as a surprise since we clearly declared these variables\
    \ inside the **setup** function. The reason for this error has to do with something\
    \ called the **scope**. The scope of a variable determines where a variable will\
    \ be accessible. JavaScript variables when using the **var** keyword to declare\
    \ them have a *function scope*.\n\nHow *function scope* works is that any variable\
    \ that is declared inside a function won't be visible from outside the function.\
    \ It is only available to the function that it lives in and other functions that\
    \ might be nested inside this function. Likewise, if we were to have a variable\
    \ that is at the top level, this variable would be visible to everything that\
    \ is at that level and at levels that are nested inside that level, like the functions\
    \ that might be defined in there. The problem that we are faced with right now\
    \ is that the variables that are defined inside the **setup** function are not\
    \ visible from the **draw** function, and if we were to declare variables inside\
    \ the **draw** function, they wouldn't be visible inside other functions at the\
    \ same level.\n\nThe solution to this problem is; instead of declaring our variables\
    \ inside the **setup** function, we should declare them at this top level so they\
    \ would be accessible from everything else that is declared inside at the top\
    \ level.\n\n```javascript\n1 var canvasWidth = 800;\n2 var canvasHeight = 300;\n\
    3\n4 function setup() {\n5     createCanvas(canvasWidth, canvasHeight);\n6   \
