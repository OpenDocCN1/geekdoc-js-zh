  md: 'We can’t get the same result if we are to type **True** or **False**. Programming
    languages are particular in how you write things. **True ** is not equivalent
    to **true. ** Moreover **True ** is not a value that JavaScript recognizes so
    writing it without quotation marks will result in an error.


    ```

    1 console.log(True);

    2 //Uncaught ReferenceError: True is not defined(...)

    ```


    We can use **comparison** operators to generate **true** or **false** values.
    Comparison operators allow us to compare two values to each other and as a result
    they generate a **true** or **false** value based on the result of that comparison.
    Here are examples of comparison operators. We have the **bigger-than** symbol
    which compares two numbers and if the number on the left-hand side is bigger than
    the one on the right-hand side it returns **true**, otherwise it returns **false**.


    ```

    1 10 > 2; // would evaluate to true

    2 1 > 100; // false

    3 console.log(100 > 1); //true

    ```


    **Bigger or equals** returns **true** if the value on the left-hand side is bigger
    or equal to the value on the right-hand side.


    ```

    1 console.log(100 >= 100); //true

    ```


    There is also **smaller** and **smaller or equals** comparison operators.


    ```

    1 console.log(1 < 10); //true

    2 console.log(10 <= 10); //true

    ```


    To compare two values to each other to check for equivalency we would use the
    ‘triple’ equal sign **===**. This is different than what we might be used to from
    our math classes where the equality operator is a single equal sign operator =.
    But in JavaScript we already use the single equal sign operator as an assignment
    operation.


    ```

    1 console.log(1 === 1); //true

    ```


    We can also make a comparison to check if two values are not equal to each other.
    For this purpose, we use an exclamation mark in front of the equal sign.


    ```

    1 console.log(1 !== 1);

    ```


    Make sure to try to use the comparison operations that we learned about to see
    what kind of results they generate in the console.


