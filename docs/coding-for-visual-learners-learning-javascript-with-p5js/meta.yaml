    \ for us: **frameCount**.\n\nRemember how we defined a **count** function in the\
    \ previous chapter to be able to count the number of times that the **draw** function\
    \ is getting called. We can actually use the variable called **frameCount** that\
    \ p5.js provides us for this same purpose. **frameCount** is a variable that keeps\
    \ count of the number of times the **draw** function is called throughout the\
    \ lifetime of a program. By default, the **draw** function is called a maximum\
    \ of 60 times per second. A setting called **frameRate** inside p5.js determines\
    \ this value.\n\nThe introduction of this variable warrants a discussion about\
    \ what **frames** are in p5.js. We can think of a **frame** as the result of the\
    \ **draw** function call. **draw** function gets called numerous times in a second,\
    \ and the **frameRate** function determines this amount. If we are to call the\
    \ **frameRate** function with no arguments, it will return us the current **frameRate**\
    \ for p5.js - which we can save into a variable and **console.log** to see its\
    \ value for every frame.\n\n```javascript\n1 function setup() {\n2     createCanvas(400,\
    \ 400);\n3 }\n4\n5 function draw() {\n6     background(220);\n7     console.log(frameRate());\n\
    8 }\n```\n\nThe default rate is around 60. This means that the **draw** function\
    \ will be executed for a maximum amount of 60 times per second. This number depends\
    \ on our system resources. For performance related reasons, such as due to limited\
    \ system resources, the actual frame rate that can be achieved might be lower\
    \ than this target value. We can consider 60 as ideal frame rate that p5.js strives\
    \ to achieve, but the actual frame rate and hence the performance might be less\
    \ than this.\n\nThink of frames as sheets in a flip book animation. More sheets\
    \ viewed per second will mean smoother animation. That’s why high frame rates\
    \ are desirable. The animation might look jaggy if the frame rate is low. We can\
    \ set the frame rate explicitly in p5.js by passing an integer value to the **frameRate**\
