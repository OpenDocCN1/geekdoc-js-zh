    \n# 08 - Functions\n\n## Creating Functions\n\nFunctions are primary building\
    \ blocks of JavaScript. They allow us to write programs in a more efficient and\
    \ scalable manner. Functions help us to manage complexity by containing and grouping\
    \ operations under a single executable name. We already know how to call functions\
    \ by using the p5.js predefined functions such as **ellipse** or **background**.\
    \ We even created our own functions as p5.js forces us to put our code into two\
    \ function declarations, **setup** and **draw**. If we wanted to create our own\
    \ functions, we would be following the same convention that we have been using\
    \ for the creation, or declaration, of these functions.\n\nTo create (or to declare)\
    \ a new function, we would start off by using the function keyword and then give\
    \ the function a name of our choosing that ideally describes the behaviour or\
    \ purpose of the function.\n\n```javascript\nfunction functionName() {\n    //\
    \ function body\n}\n```\n\nNext, to the function name we would open brackets.\
    \ If we want to build a function that works with user input, we can define parameters\
    \ inside the brackets that would act as placeholder variable names for the future\
    \ user input. We will see how this works in a bit.\n\nThen we have curly braces.\
    \ Inside curly braces can be referred to as the function body. In there, we would\
    \ write the code that would construct the logic of the function. We can also make\
    \ use of the parameters, the variable names we defined inside the brackets next\
    \ to the function name, as part of the operations we want to perform inside the\
    \ function body.\n\nLet's look at a simple example. Notice how p5.js has an **ellipse**\
    \ function but not a **circle** function. This is not really an issue since we\
    \ can easily create a circle by providing the ellipse function with same width\
    \ and height values. For argument's sake, though, let's create a **circle** function\
    \ that would work with three values: the x and y position that we want to draw\
    \ our circle at and the diameter of the circle.\n\nHere is how to do it. Inside\
    \ the brackets, we will be writing down variable names that would eventually be\
    \ provided when this function is called. These names are called *parameters* as\
    \ they parameterize the functionality of the operation we are creating. We will\
    \ be using these parameters inside our function to be able to let the user control\
    \ the inner workings of the function.\n\n```javascript\nfunction circle(x, y,\
    \ diameter) {\n    ellipse(x, y, diameter, diameter);\n}\n```\n\nWe can choose\
    \ anything as parameter names, but it usually makes sense to use names that communicate\
    \ the intent clearly. So in our case, using the names x, y, and diameter makes\
    \ sense.\n\nAfter defining this function, we can call it by using its name and\
    \ providing it with values. Values provided to the function are called *arguments*\
    \ to the function. Notice that the function might fail or not work as expected\
    \ if all the required arguments are not provided.\n\n```javascript\ncircle(width/2,\
    \ height/2, 100);\n```\n\nDon't worry too much if you feel like the terminology\
    \ is confusing. It might take some time to get used to it. The *parameters* of\
    \ a function can be thought as the values that the user would eventually provide\
    \ when they are using the function. Those same values that are provided when calling\
    \ the function are referred to as *arguments*.\n\nWith the **circle** function,\
    \ we don't need to worry about using the **ellipse** function to draw circles\
    \ anymore. We can just use our own function to draw those perfectly round circles.\
    \ Having implemented the **circle** function ourselves, we know that it actually\
    \ uses the ellipse function under the hood to draw those circles. But the neat\
    \ thing about functions is that we don't really need to know how they work once\
    \ they are available to us. We can just use them without thinking how they are\
    \ implemented. **ellipse** function that is implemented by the smart people that\
    \ created p5.js might be using all sorts of things inside to draw an ellipse,\
    \ but as far as we are concerned it draws an ellipse when it is called, and that's\
    \ all that matters.\n\nIn this example, creating a circle function doesn't buy\
    \ us too much efficiency. As a matter of fact, we can just pass three arguments\
    \ to the **ellipse** function instead of four to draw a circle instead. But functions\
    \ become really important to use when we are building more complex programs as\
    \ they help us to manage the complexity by containing and grouping operations\
    \ under a single executable name. Functions are essentially blackboxes. They encapsulate\
    \ the code that they contain and whatever variables that are declared using the\
    \ **var** keyword inside the function are not visible from outside the function.\n\
    \n```javascript\nfunction setup() {\n    createCanvas(800, 300);\n    sayHello();\n\
    }\n\nfunction draw() {\n    background(220);\n}\n\nfunction sayHello() {\n   \
    \ var message = 'Hello World!';\n    console.log(message);\n}\n\nconsole.log(message);\n\
    ```\n\nThe **console.log** function on line 15 will throw an error because the\
    \ variable **message** is only visible from inside the function **sayHello**.\n\
    \nFunctions can work with no input, a single input or multiple inputs and they\
    \ either *return* a result or don't. Let me explain what I mean by returning a\
    \ value.\n\nLet's say we want to create a function that multiplies a given numeric\
    \ value by itself, essentially calculating the square of the given number. Here\
    \ is one function that does that, it receives a number as a parameter and creates\
    \ text that displays that number on the screen. So it is somewhat useful since\
    \ we can use this function to display to the screen and learn what might be the\
    \ square of an absurdly large number.\n\n```javascript\n1 function setup() {\n\
    2     createCanvas(800, 300);\n3 }\n\n5 function draw() {\n6     background(1,\
    \ 75, 100);\n7     fill(237, 34, 93);\n8     squared(10);\n9 }\n\n11 function\
    \ squared(num) {\n12     textSize(60);\n13     textAlign(CENTER, CENTER);\n14\
    \     text(num * num, width/2, height/2);\n15 }\n```\n\n![](img/41e582902bed374827550eb87c185e8d_73_0.png)"
  mdcn: "\n我们将重写上述程序，改为使用 **noise** 函数。我们会将 **frameCount** 变量传给 noise 函数，因为在 p5.js\
    \ 中这是获取序列号的一个好方法。但我们会将 **frameCount** 除以 100，以便稍微减慢数值的变化速度，从而减缓最终动画的速度。\n\n```javascript\n\
    1 function setup() {\n2     createCanvas(800, 300);\n3     rectMode(CENTER);\n\
