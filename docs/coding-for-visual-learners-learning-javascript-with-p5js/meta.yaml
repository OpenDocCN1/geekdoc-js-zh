  - '[PAGE 106]


    In this example, we are drawing a shape as we usually do but using the **translation**
    function to set its x and y coordinates instead of feeding those values directly
    into the shape drawing function. Doing this, when coupled with using the **rectMode**
    function allow us to draw the shape with its center located at the origin. Basically,
    we start off by drawing the shape at the origin point as all the transformation
    functions work relative to that point. Then we use the **translate** and **rotate**
    functions to move the shape to desired position and angle. Using this approach,
    we need to remember to call **rotate** after **translate** function or the rotation
    will still be happening relative to the original origin point which is probably
    not desired.


    The current shortcoming with this approach and with the usage of transformation
    functions, in general, is that everything that we draw from this point onward
    will be using this new origin point. The way to fix this is using **push** and
    **pop** functions.


    # Push & Pop


    The p5.js **push** function allows us to create a new state and **pop** function
    restores the state to the previous conditions. This allows us to have completely
    different settings applied to individual objects without worrying if those settings
    will affect the shapes that come after as long as we do everything in between
    a **push** and a **pop** call. Again it is easier to see this in an example.


    With our current setup, everything that we draw after the **translate** and **rotate**
    functions will have that 45 degrees of rotation applied to them.


    ```

    1 function setup() {

    2     createCanvas(800, 300);

    3     rectMode(CENTER);

    4     noStroke();

    5     angleMode(DEGREES);

    6 }

    7

    8 function draw() {

    9     background(220);

    10    fill(237, 34, 93);

    11    translate(width/2, height/2);

    12    rotate(45);

    13    rect(0, 0, 150, 150);

    14

    15    fill(255, 255, 255);

    16    rect(0, 0, 75, 75);

    17 }

    ```'
