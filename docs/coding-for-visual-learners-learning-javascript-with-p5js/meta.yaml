    # Summary


    In this chapter, we haven''t seen any new JavaScript functionality or new programming
    structures. We just looked at some operating principles of the p5.js library and
    some specific functions that comes with it. In particular we learned about how
    some of the color setting functions work in p5.js, such as **fill**, **stroke**
    and **strokeWeight**. We also learned about other functions that are related to
    fill and stroke operations such as **noStroke** and **noFill**. Another thing
    we learned about is the RGB color model.


    Even though this chapter didn''t really advance our programming language, I think
    one point is very valuable to make. You might be thinking to yourself that you
    are not into creative coding and won''t need this p5.js specific information after
    this book, having learned to code. But these operating principles such as using
    additive RGB values, or concepts such as fill and stroke are so commonly used
    that even though what we are learning could seem very specific to p5.js, they
    are general principles or concepts that are utilized by lots of other drawing
    libraries or programs. Understanding them will serve us well in our journey of
    learning how to program.


    # Practice


    Build the above script in such a way that one variable would control the size
    of all the circles (meaning changing that variable should change the size of all
    the circles) and another one should control the radius difference for all the
    circles.'
