    # # 10 - Arrays


    # ## Working with Arrays


    **Arrays** are another useful data structure in JavaScript, that is based on **Objects**,
    which makes certain operations much easier to perform.


    Arrays are a sequential collection of data that is stored with a numbered index.
    Remember that we use curly brackets to create an empty object. We can create an
    empty array in a similar fashion by using square brackets.


    ```

    1 var arr = [];

    ```


    In this example, we created an empty array and used a variable called **arr**
    to store that array. Now if we wanted to add elements to this array, we can use
    the **push** method that array objects have.


    ```

    1 var arr = [];

    2 arr.push(1);

    3 arr.push("hello world");

    4 arr.push({"name":"value"});

    5 console.log(arr);

    ```


    In this example, we are pushing three new values to the previously empty array.
    In the first line, we are pushing in a value of **number** type, in the second
    line we are pushing a **string** type into the array and in the third line we
    are pushing an **object** type into it.


    Now if we are to look at the contents of the array by using **console.log**, we
    will see something like this on screen:


    ```

    1 [1,"hello world",{"name":"value"}]

    ```


    Notice how we used different data types and objects to populate the Array. Arrays
    can contain any object, even other arrays. Just like how it is with JavaScript
    objects, we can populate an Array at creation time by providing desired values
    inside square brackets using a comma to separate them. Let’s create an array with
    four numbers in it.


    ```

    1 var arr = [15, 40, 243, 53];

    2 console.log(arr);

    ```


