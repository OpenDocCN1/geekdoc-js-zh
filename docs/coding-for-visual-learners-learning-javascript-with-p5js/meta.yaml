    \ 10)], width / 2, height / 2);\n```\n\n## 总结\n\n这绝对是一个具有挑战性的例子，它将我们目前为止所学的所有内容都纳入了考验。\n\
    \n令人印象深刻的是，我们仅使用 p5.js 就能构建一个可以在网页上运行、供数百万人游玩的游戏。而且这并不困难；整个程序大约只有 200 行代码。当然，还有改进的空间，比如我们可以根据玩家表现动态调整游戏难度，增加更多视觉效果，以及添加动态计分系统，根据猜测数字所用的时间为正确答案分配不同的分数。游戏可以转换为显示文字而非数字。它可以显示图片，让你输入名称，或者展示需要你回答的计算题。可能性数不胜数！\n\
    \n话虽如此，如果我们想要构建更高级的项目，p5.js 可能并不是最好的游戏开发平台。一个合适的游戏库会提供诸如资源加载系统、精灵支持、碰撞检测、物理引擎、粒子系统……等功能，而这些在开发高级游戏时往往是必需的。这并不是说你不能用\
    \ p5.js 来制作游戏；我们刚刚就证明了这完全可行。只是还有其他专门针对游戏开发的库，而 p5.js 更侧重于创建网页上的交互式动画体验。\n\n# 14\
    \ - 结语与下一步方向？\n\n## 恭喜！\n\n完成本书后，你现在应该已经熟悉了 JavaScript 语言的基础知识以及编程的通用概念，因为我们学到的概念广泛适用于不同的编程语言。\n\
    \n想象一下，在学习一门自然语言（如英语）时学习过去时态是什么感觉。英语和日语中构造过去时态句子的结构可能有所不同，但一旦你发现它们之间的对应关系，你对过去时态的概念性理解就能让你更轻松地将知识从一种语言迁移到另一种语言。\n\
    \n在本书中，我们使用 JavaScript 学习了编程语言中的基本结构，如变量、运算符、循环、条件语句、函数、对象和数组。就我个人所接触过的所有编程语言而言，它们都以这样或那样的方式实现了这些概念。它们的语法可能不同，但工作原理非常相似。一般来说，你在一种编程语言中获得的知识高度可迁移到其他语言。\n\
    \n除了 JavaScript，我们还顺道学习了 p5.js 库。这意味着，如果你想运用新获得的编程知识，你可以非常自如地继续使用 p5.js。\n\n目前我们知识中缺失的是如何将作品部署到网络上，从而与全世界分享。由于这是一本专注于学习编程的书，我不想让我们被次要的运营性事务分散注意力。但这将是我在未来课程中最终会探索的内容，因为这可能是你想要学习的。\n\
    \n在这一点上，你可能会感到有些受限，特别是如果你想继续打磨在 p5.js 中新学到的技能之外的东西。从这里出发，一个人该走向何方呢？\n\n## 下一步方向？\n\
    \n正如本书开头所提到的，学习 JavaScript 将为你打开一扇机会之门，因为有很多领域可以应用你的知识。下一步去哪里，当然取决于你想在哪个方向提升技能。\n\
    \n如果你想超越 p5.js，创建面向用户的 Web 应用程序，你肯定需要学习 **HTML** 和 **CSS** 的基础知识，以便为你的项目构建图形界面。之后，学习一些\
    \ **DOM API** 会很有用，这样你就能将页面上的界面元素与 JavaScript 命令关联起来。如果你想构建稍微复杂一些的界面，那么 **jQuery**\
    \ 可能会有帮助，因为它让使用 JavaScript 处理网页变得更加容易。如果你想构建更高级的界面，其中有很多交互和页面元素之间的状态依赖关系，那么像 **AngularJS**\
    \ 这样的前端框架或像 **React** 这样的库会非常有用。我建议不要急于学习这些工具，尽管它们现在是热门话题。从纯 JavaScript 开始，然后过渡到\
    \ jQuery 来构建稍微复杂一些的界面，这将帮助你理解这些更复杂工具被设计来解决的问题。\n\n也许你想做一些服务器端编程。那么你应该学习 **Node.js**。服务器端编程可能涉及任何不需要在客户端、浏览器上进行的后端计算，也可能涉及构建与宿主计算机操作系统交互的脚本，以执行诸如创建文件和文件夹、删除它们等操作。**Node.js**\
    \ 脚本不一定需要为 Web 应用程序的后端服务。**Node.js** 的主要优势在于，它为你的机器提供了一个环境，而不是在浏览器中运行 JavaScript。Node.js\
    \ 将 JavaScript 从浏览器环境的限制中解放出来。例如，**Electron**。它是一个基于 **Node.js** 的框架，允许你使用 Web\
    \ 技术构建原生桌面应用程序。你可以使用 **Electron** 用 JavaScript 构建 Web 浏览器，而不是在浏览器中使用 JavaScript\
    \ 构建东西！\n\n自动操作网页、以编程方式连接互联网和抓取在线数据可能是你的兴趣所在。为此，有 **Phantom.js** 和 **Casper.js**。如果你想进行高级数据可视化，那么你应该看看\
    \ **D3** 库。也许你想进入机器人领域，或者使用 JavaScript 编程物联网设备。那为什么不试试 **Johnny-Five** 呢？你可以使用\
    \ JavaScript 构建原生移动应用（**React Native**）、HTML5 游戏（**Phaser**）、数据库（**mongoDB**）、3D\
    \ 视觉效果和动画（**Three.js**），甚至利用人工智能的认知应用（**IBM Watson**）。\n\n学习新的编程语言时，最好有一个计划：一个你想要构建的愿景。理想情况下，这是一个最小可行项目，你可以在不给自己增加太多工作或技术IoT困扰的情况下启动。达到那个点，然后构建下一个东西。始终在进步，始终在学习新东西。欢迎来到编程的世界。我迫不及待地想看看你会创造出什么。\n"
