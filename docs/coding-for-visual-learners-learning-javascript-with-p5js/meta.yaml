    # # 03 - Colors in p5.js


    # ## Color Functions in p5.js


    Now that we can draw shapes in p5.js let’s look at how to control the color in
    our sketches. We are already assigning a light gray color to the background by
    passing the values 220, 220, 220 to the **background** function.


    p5.js by default uses the *RGB* color values where R stands for red, G stands
    for green and B stands for blue. This means that we will *usually* need to pass
    these three color components to a color accepting function to set the desired
    color. Each of these color components can have a value in between 0 and 255. This
    means that if we are to pass 0, 0, 0 to the **background** function, we will end
    up getting a black color for the background and if we are to pass 255, 255, 255,
    we will get a white color. p5.js being a helpful library allows us to pass a single
    value when we want all these three values to be equal. Which means that instead
    of passing 0, 0, 0; we can also just pass a single 0.


    Whenever we have equal amounts of these three color components, the resulting
    color will be a white, black or a shade of grey. So passing a single value to
    a color setting function is useful if we wanted to have a grayscale color. But
    if we want hue in our color then we need to pass all these three values to be
    able to specify the amount that we want for each component. 255 is the maximum
    value that a color component can accept; so if we are to pass 255, 0, 0 as a color
    to the **background** function we will get a pure red color. If we pass 0, 255,
    0, then we will get a pure green color, and so on.


    RGB color model is an additive model, which means that adding these colors together
    in their full intensity will result in white compared to paint colors which are
    subtractive, where adding them all together will result in a dark-brownish color.
    Finding the exact color that you want by tinkering with these values can be a
    bit hard if you are not too familiar working with additive RGB colors. If that’s
    the case you can use an online color picker service to help you with finding the
    desired color. An online search for the term ‘color picker’ will result in numerous
    results that you can use to identify the RGB components for the desired color.
    Here is an example service from Firefox.


    [Color picker tool](https://colorpicker.tool)'
