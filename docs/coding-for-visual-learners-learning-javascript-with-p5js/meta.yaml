    \ area or the number of circles being drawn, but things will still continue to\
    \ function properly.\n\nSomething to keep in mind is; putting loops inside one\
    \ another can make our program really slow due to the number of operations that\
    \ need to be performed. Also, sometimes nested structures can make our programs\
    \ hard to read as well.\n\n## Random and Noise Functions\n\nSince we can now create\
