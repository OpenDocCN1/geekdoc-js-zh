    \n![](img/41e582902bed374827550eb87c185e8d_36_0.png)\n\n### 03-03\n\n![](img/41e582902bed374827550eb87c185e8d_36_1.png)\n\
    \n### 03-04\n\n## 04 - 运算符与变量\n\n### 准备工作\n\n在本书开头，我们学习了在 JavaScript 中可以使用的一些变量和数学运算。在本章中，我们将把这些知识付诸实践。\n\
    \n让我们先创建几个形状，以便有东西可以操作。使用 **ellipse** 和 **rect** 函数，让我们创建一个大致像小车的形状。\n\n```javascript\n\
    1 function setup() {\n2     createCanvas(800, 300);\n3 }\n4\n5 function draw()\
    \ {\n6     background(220);\n7     ellipse(100, 200, 50, 50);\n8     ellipse(200,\
    \ 200, 50, 50);\n9     rect(50, 160, 200, 20)\n10 }\n```\n\n![](img/41e582902bed374827550eb87c185e8d_37_0.png)\n\
    \n看着我们的粗略绘图，我对它的位置并不完全满意。我现在希望把它画得更靠右侧。现在移动该形状意味着我们需要增加每个形状函数中 x 坐标参数的值。\n\n假设我们想给所有指定\
    \ x 位置的数字都加上 150。我们可以尝试在脑中计算并在那里输入结果，但幸运的是，我们可以使用 JavaScript 轻松地进行数学运算。与其输入加法的结果，我们只需直接写出所需的运算，JavaScript\
    \ 就会为我们计算。\n\n```javascript\nfunction setup() {\n    createCanvas(800, 300);\n\
    }\n\nfunction draw() {\n    background(220);\n    ellipse(100 + 150, 200, 50,\
    \ 50);\n    ellipse(200 + 150, 200, 50, 50);\n    rect(50 + 150, 160, 200, 20)\n\
    }\n```\n\n![](img/41e582902bed374827550eb87c185e8d_38_0.png)\n\n其他运算符也同样适用；我们可以用类似的方式进行减法、乘法或除法。\n\
    \n在使用运算符时，我们需要记住的一点是运算顺序。你可能已经在数学课上学过，某些运算符的优先级高于其他运算符。例如，如果我们想给一个数字加上 2 然后乘以\
    \ 4，我们可能会倾向于这样写：\n\n```javascript\n10 + 2 * 4\n```\n\n但在这次运算中，乘法会在加法之前发生。2 会先与\
    \ 4 相乘，然后再加到 10 上，因此上述运算的结果将是 18，而不是预期的 48。\n\n为了能够控制运算顺序，我们可以使用括号。例如，我们可以将上面的等式写成这样：\n\
    \n```javascript\n(10 + 2) * 4\n```\n\n括号内的任何内容都将在其他运算之前被计算。在运算顺序中，括号优先，然后是乘法和除法，最后是加法和减法。\n\
    \n### 变量\n\n能够像这样评估表达式会让我们的计算工作变得更容易。但我认为在这个例子中，真正的问题在于需要在三个不同位置输入相同的数字。这非常重复且劳累。这就是使用变量会很有帮助的情况。\n\
    \n每当我们需要一个值，并且需要在多个地方使用该值时，我们就希望将该值存储在一个变量中。使用变量的优势在于，如果我们需要更新该值，我们只需要在一个地方进行修改即可。让我们更新这个例子以使用变量。\n\
    \n记得如何创建变量。我们会从使用 **var** 关键字开始。出于稍后将讨论的原因，使用这个关键字非常重要。\n\n然后，我们会为变量选择一个名称。选择一个有意义的名称也很重要。将这个变量命名为\
    \ **offset**（偏移量）或 **x** 可能是合理的，因为我会用它来在 x 轴上偏移形状。使用合理的名称将有助于他人甚至我们自己理解代码。我们始终希望程序尽可能具有可读性。\n\
    \n现在我们有一个指向某个值的变量，我们可以在运算中使用这个变量而不是值本身。这样一来，我们只需要在同一个地方更改这个变量的值，就能看到形状在移动。\n\n\
    ```javascript\nfunction setup() {\n    createCanvas(800, 300);\n}\n\nfunction\
    \ draw() {\n    background(220);\n    var offset = 150;\n\n    ellipse(100 + offset,\
    \ 200, 50, 50);\n    ellipse(200 + offset, 200, 50, 50);\n    rect(50 + offset,\
    \ 160, 200, 20)\n}\n```\n\n### 变量（续）\n\n我想在另一个例子中说明变量的另一种行为。让我们先在屏幕中间画一个圆，并在中间画一个矩形。\n\
    \n```javascript\nfunction setup() {\n    createCanvas(800, 300);\n    rectMode(CENTER);\n\
    }\n\nfunction draw() {\n    background(1, 186, 240);\n    fill(237, 34, 93);\n\
    \    noStroke();\n```\n"
