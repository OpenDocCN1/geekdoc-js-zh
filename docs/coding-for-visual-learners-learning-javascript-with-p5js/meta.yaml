    # # 06 - More p5.js Variables


    # ## Intro


    In the previous chapter, we learned about the p5.js **frameCount** variable that
    provides us with a number that represents the number of times the **draw** function
    is called. There are bunch of other highly useful variables that we could be using
    in p5.js. We will be learning about a few more in this chapter.


    # ## mouseIsPressed


    **mouseIsPressed** is the first p5.js variable that we will see, that will allow
    us to add some interactivity to our programs. **mouseIsPressed** is a p5.js variable
    that assumes the value **true** when the mouse is clicked on the canvas area and
    **false** for every other time. Let’s alter our example from the previous chapter
    to quickly see how we can use this variable.


    ```

    1 function setup() {

    2     createCanvas(800, 300);

    3     rectMode(CENTER);

    4 }

    5

    6 function draw() {

    7     background(1, 186, 240);

    8     fill(237, 34, 93);

    9     noStroke();

    10

    11    var x = width / 2;

    12    var y = height / 2;

    13    var size = 200;

    14    ellipse(x, y, size, size);

    15    fill(255);

    16    if (mouseIsPressed === true) {

    17        rect(x, y, size*0.75, size*0.15);

    18    }

    19 }

    ```


    Clicking on the canvas area will now display the rectangle inside the circle.
    By using the **mouseIsPressed** p5.js variable, we made the display of the rectangle
    conditional to the mouse click.


    Toggling the state of something based on mouse click might be a more involving
    example so let’s see how to tackle that as well. Say we would like to change the
    background color for our sketch every time we click the mouse button. We will
    make it so that it will toggle in between two colors.'
