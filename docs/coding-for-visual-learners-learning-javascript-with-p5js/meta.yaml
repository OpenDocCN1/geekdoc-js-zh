- md: "## Constructor Function\n\nThere is another way of creating objects in JavaScript,\
    \ and that is by using functions. The declarations we would be making inside an\
    \ object creating function is very similar to what we were doing when working\
    \ with an *object initializer*.\n\n```javascript\nvar Circle = function() {\n\
    \    this.x = width/2;\n    this.y = height/2;\n    this.size = 50;\n    this.draw\
    \ = function() {\n        ellipse(this.x, this.y, this.size, this.size);\n   \
    \ };\n    this.grow = function() {\n        if (this.size < 200) {\n         \
    \   this.size += 1;\n        }\n    }\n};\n```\n\nAn object creating function\
    \ is called a **constructor function**. We can think of it as a template or a\
    \ blueprint for creating new objects that derive their properties from this constructor\
    \ function.\n\nLet me show an example to better explain what I mean. Say we want\
    \ to have a circle just like in the previous examples that exhibit the behaviour\
    \ that is defined by this Circle constructor. In this case, we will not use this\
    \ constructor function directly for our purposes, but we will use it to instantiate\
    \ a new circle that is modelled after this template function.\n\n```javascript\n\
    var myCircle = new Circle();\n```\n\nWe used the **Circle** constructor function\
    \ and the **new** keyword to create a *new* instance of a circle called **myCircle**\
    \ that gets its properties from the constructor function. Basically, the **new**\
    \ keyword allows us to create a new instance of an object from a Constructor function.\
    \ We can think of the **Circle** constructor function as a blueprint and the **myCircle**\
    \ as an actual circle built from that blueprint. Now we can draw this newly created\
    \ circle to the screen by calling the draw method on it.\n\n```javascript\nmyCircle.draw();\n\
    ```\n\n**Here is the full example:**\n\n```javascript\nvar circle;\n\nfunction\
    \ setup() {\n    createCanvas(800, 300);\n    fill(237, 34, 93);\n    noStroke();\n\
    \    circle = new Circle();\n}\n\nfunction draw() {\n    background(220);\n  \
    \  circle.draw();\n    circle.grow();\n}\n\nvar Circle = function() {\n    this.x\
    \ = width/2;\n    this.y = height/2;\n    this.size = 50;\n    this.draw = function()\
    \ {\n        ellipse(this.x, this.y, this.size, this.size);\n    };\n    this.grow\
    \ = function() {\n        if (this.size < 200) {\n            this.size += 1;\n\
    \        }\n    };\n};\n```\n\nThe beauty of this method is that we can keep creating\
    \ new circles from the same blueprint. And since these circles are separate entities\
    \ -instances-, they can have different properties from each other. Let’s see an\
    \ example of that.\n\n```javascript\nvar circle_1;\nvar circle_2;\nvar circle_3;\n\
    \nfunction setup() {\n    createCanvas(800, 300);\n    fill(237, 34, 93);\n  \
    \  noStroke();\n    circle_1 = new Circle();\n    circle_2 = new Circle();\n \
    \   circle_3 = new Circle();\n}\n\nfunction draw() {\n    background(220);\n \
    \   circle_1.draw();\n    circle_1.grow();\n\n    circle_2.x = 150;\n    circle_2.draw();\n\
    \    circle_2.grow();\n\n    circle_3.x = 650;\n    circle_3.draw();\n    circle_3.grow();\n\
    }\n\nvar Circle = function() {\n    this.x = width / 2;\n    this.y = height /\
    \ 2;\n    this.size = 50;\n    this.draw = function() {\n        ellipse(this.x,\
    \ this.y, this.size, this.size);\n    };\n    this.grow = function() {\n     \
    \   if (this.size < 200) {\n            this.size += 1;\n        }\n    };\n};\n\
    ```\n\nIn this example, we are creating three variables outside the p5.js functions\
    \ called **circle_1**, **circle_2** and **circle_3**. These variables are created\
    \ outside the p5.js functions is so that they would be in scope for both of those\
    \ functions.\n\nWe are making these variables to be Circle instances by assigning\
    \ the **Circle** constructor function using the **new** keyword to them. Now that\
    \ we have three separate circle objects, we can change their properties in the\
    \ **draw** function, and get different results from each one of them.\n\nOne thing\
    \ that is important to note is how we are using a function name that starts with\
    \ a capital letter for the constructor function. We use a capital letter to remind\
    \ ourselves and others that this function is a constructor function and needs\
    \ to be called with the **new** keyword.\n\nIt is important to call a constructor\
    \ function with the **new** keyword. If we don't use the **this** keyword inside\
    \ the constructor function, it won't work properly as it wouldn't refer to the\
    \ instance object but the global object.\n\nUsage of the capital letter is not\
    \ a rule but a convention. No one forces us to do it. But it is expected that\
    \ we follow this convention since not realizing a function is a constructor function\
    \ and then calling it without the **new** keyword will have unintended consequences.\n\
    \n## Summary\n\nIn this chapter, we learned about the JavaScript objects. Simply\
    \ put, objects are a way of organizing code.\n\nWe learned about the dot notation\
    \ and the square bracket notation that are used to access the properties on an\
    \ object.\n\nWe also learned about the **this** keyword which allows us to refer\
    \ to the properties of the object from within the object itself.\n\nWe learned\
    \ about two ways of creating objects. One of them is using an **object initializer**,\
    \ and the other one is using **constructor functions**. While we are creating\
    \ a single object using an object initializer, constructor functions act as a\
    \ blueprint from which we can create many object instances using the **new** keyword.\n\
    \nThere is a whole programming paradigm called *Object Oriented Programming* across\
    \ different programming languages that leverage the usage of objects for code\
    \ organization and clarity. Using p5.js, we don't necessarily need to create objects\
    \ to organize our code, but I wanted to introduce objects for two reasons:\n\n\
    First of all, objects are a fundamental part of the JavaScript Language. If you\
    \ would like to learn more about the language at a later time, you would need\
    \ to get comfortable with how objects work.\n\nSecondly, JavaScript has other\
    \ built-in structures that are based on objects that we will be using so it was\
    \ important for us to familiarize ourselves more with objects.\n\nNow if you are\
    \ just starting out, the takeaway from this chapter should be to know that there\
    \ is this data structure that exists in JavaScript called **Objects** that helps\
    \ with organizing code. It also allows for code to be represented in a certain\
    \ way that makes it easier to work with and reason about in certain cases. As\
    \ we are starting out, we won't make use of objects all that much, but it is important\
    \ to know of them for your later studies."
  mdcn: "\n## 构造函数\n\n在JavaScript中创建对象还有另一种方式，那就是使用函数。我们将在创建对象的函数内部进行的声明，与我们使用*对象初始化器*时所做的非常相似。\n\
    \n```javascript\nvar Circle = function() {\n    this.x = width/2;\n    this.y\
    \ = height/2;\n    this.size = 50;\n    this.draw = function() {\n        ellipse(this.x,\
    \ this.y, this.size, this.size);\n    };\n    this.grow = function() {\n     \
    \   if (this.size < 200) {\n            this.size += 1;\n        }\n    }\n};\n\
    ```\n\n一个用于创建对象的函数被称为**构造函数**。我们可以把它看作是一个模板或蓝图，用于创建从这个构造函数派生其属性的新对象。\n\n让我举个例子来更好地解释我的意思。假设我们想要一个与前面示例相同的圆圈，它表现出这个\
    \ `Circle` 构造函数定义的行为。在这种情况下，我们将不会直接使用这个构造函数来达到目的，而是用它来实例化一个新的圆圈，这个圆圈是按照这个模板函数建模的。\n\
    \n```javascript\nvar myCircle = new Circle();\n```\n\n我们使用了 **Circle** 构造函数和 **new**\
    \ 关键字来创建一个名为 **myCircle** 的圆圈的*新*实例，该实例从构造函数获取其属性。基本上，**new** 关键字允许我们从构造函数创建一个对象的新实例。我们可以将\
    \ **Circle** 构造函数看作蓝图，将 **myCircle** 看作是从该蓝图构建的实际圆圈。现在我们可以通过调用它的 `draw` 方法将这个新创建的圆圈绘制到屏幕上。\n\
    \n```javascript\nmyCircle.draw();\n```\n\n**以下是完整示例：**\n\n```javascript\nvar circle;\n\
    \nfunction setup() {\n    createCanvas(800, 300);\n    fill(237, 34, 93);\n  \
    \  noStroke();\n    circle = new Circle();\n}\n\nfunction draw() {\n    background(220);\n\
    \    circle.draw();\n    circle.grow();\n}\n\nvar Circle = function() {\n    this.x\
    \ = width/2;\n    this.y = height/2;\n    this.size = 50;\n    this.draw = function()\
    \ {\n        ellipse(this.x, this.y, this.size, this.size);\n    };\n    this.grow\
    \ = function() {\n        if (this.size < 200) {\n            this.size += 1;\n\
    \        }\n    };\n};\n```\n\n这种方法的美妙之处在于，我们可以从同一个蓝图不断创建新的圆圈。而且由于这些圆圈是独立的实体——实例——它们可以彼此拥有不同的属性。让我们看一个这样的例子。\n\
    \n```javascript\nvar circle_1;\nvar circle_2;\nvar circle_3;\n\nfunction setup()\
    \ {\n    createCanvas(800, 300);\n    fill(237, 34, 93);\n    noStroke();\n  \
    \  circle_1 = new Circle();\n    circle_2 = new Circle();\n    circle_3 = new\
    \ Circle();\n}\n\nfunction draw() {\n    background(220);\n    circle_1.draw();\n\
    \    circle_1.grow();\n\n    circle_2.x = 150;\n    circle_2.draw();\n    circle_2.grow();\n\
    \n    circle_3.x = 650;\n    circle_3.draw();\n    circle_3.grow();\n}\n\nvar\
    \ Circle = function() {\n    this.x = width / 2;\n    this.y = height / 2;\n \
    \   this.size = 50;\n    this.draw = function() {\n        ellipse(this.x, this.y,\
    \ this.size, this.size);\n    };\n    this.grow = function() {\n        if (this.size\
    \ < 200) {\n            this.size += 1;\n        }\n    };\n};\n```\n\n在这个示例中，我们在\
    \ p5.js 函数外部创建了三个变量，分别名为 **circle_1**、**circle_2** 和 **circle_3**。这些变量在 p5.js\
    \ 函数外部创建，是为了让它们在两个函数的作用域内都可用。\n\n我们通过使用 **new** 关键字将 **Circle** 构造函数赋值给它们，从而使这些变量成为\
    \ `Circle` 实例。现在我们有三个独立的圆圈对象，我们可以在 **draw** 函数中更改它们的属性，并从每个对象获得不同的结果。\n\n需要注意的一点是我们如何为构造函数使用以大写字母开头的函数名。我们使用大写字母是为了提醒自己和其他人，这个函数是一个构造函数，需要使用\
    \ **new** 关键字来调用。\n\n使用 **new** 关键字调用构造函数很重要。如果我们不在构造函数内部使用 **this** 关键字，它将无法正常工作，因为它不会指向实例对象，而是指向全局对象。\n\
    \n使用大写字母不是规则，而是一种约定。没有人强迫我们这样做。但期望我们遵循这个约定，因为没有意识到一个函数是构造函数，然后在不使用 **new** 关键字的情况下调用它，将会产生意想不到的后果。\n\
    \n## 总结\n\n在本章中，我们学习了JavaScript对象。简而言之，对象是一种组织代码的方式。\n\n我们学习了用于访问对象属性的点表示法和方括号表示法。\n\
    \n我们还学习了 **this** 关键字，它允许我们从对象内部引用对象的属性。\n\n我们学习了两种创建对象的方式。其中一种是使用**对象初始化器**，另一种是使用**构造函数**。虽然我们使用对象初始化器创建单个对象，但构造函数充当蓝图，我们可以使用\
    \ **new** 关键字从中创建许多对象实例。\n\n在不同的编程语言中，存在一种利用对象进行代码组织和清晰化的完整编程范式，称为*面向对象编程*。使用p5.js，我们不一定需要创建对象来组织代码，但我想介绍对象有两个原因：\n\
    \n首先，对象是JavaScript语言的基本组成部分。如果你想在以后进一步学习这门语言，你需要熟悉对象的工作方式。\n\n其次，JavaScript还有其他基于对象的内置结构，我们将使用它们，因此让我们更熟悉对象是很重要的。\n\
    \n现在，如果你刚开始，本章的要点应该是知道JavaScript中存在一种名为**对象**的数据结构，它有助于组织代码。它还允许代码以某种方式表示，在某些情况下更容易处理和推理。由于我们刚开始，我们不会过多地使用对象，但为了你以后的学习，了解它们是很重要的。\n"
