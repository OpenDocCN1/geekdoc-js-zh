    \n为了在平面上定位任何点，我们使用一个两轴坐标系。纵轴称为 Y 轴，横轴称为 X 轴。这两个轴相交的点被称为*原点*（origin）。在我们绘制形状的画布（canvas）中，原点位于画布的左上角。从原点向下，Y\
