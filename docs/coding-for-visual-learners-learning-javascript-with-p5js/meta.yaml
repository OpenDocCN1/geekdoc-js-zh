  md: '# About the Author


    Engin Arslan is a Web Developer with a Bachelor of Science in Materials Engineering
    and a Postgraduate Degree in Visual Effects. Before becoming a Developer, he worked
    as a Visual Effects Artist / Technical Director on films and TV shows including
    Resident Evil, Tron, Mama, Pompeii, Vikings and Strain. He received an Emmy Nomination
    and won a Canadian Screen Award for his achievements in Visual Effects. During
    his time in VFX, he fell in love with Python and with programming in general.
    As a result he changed careers to be able to immerse himself completely in software
    development. Engin currently works at a Toronto-based digital services company,
    where he helps develop solutions in strategic problem spaces using emerging technologies.
    He also works at Seneca College as a part-time professor and is an author for
    Pluralsight.'
