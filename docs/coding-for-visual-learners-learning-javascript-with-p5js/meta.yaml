    \ be thought of as a minimal approach to drawing to quickly prototype an idea,\
    \ p5.js is built on the concept of writing the minimal amount of code to translate\
    \ your visual, interaction or animation ideas to the screen. p5.js is a JavaScript\
    \ implementation of the popular library called **Processing** which is based on\
    \ the **Java** programming language.\n\nIt is worth mentioning that **Java** and\
    \ **JavaScript** are completely unrelated languages. The reason why JavaScript\
    \ is named after Java is an unfortunate branding and marketing decision made back\
    \ in the day.\n\nThe concise nature of p5.js makes it a very easy library to learn.\
    \ But don't let this simplicity trick you into believing that p5.js has limited\
    \ capabilities. p5.js has an impressive amount of functionality, history and community\
    \ behind it to make it a valuable learning investment if you ever wanted to create\
    \ art, design, motion or interactive pieces using code. A p5.js program can be\
    \ anywhere from a few lines of code to thousands. Since p5.js was built with simplicity\
    \ in mind, sometimes small p5.js programs are referred to as sketches. Even though\
    \ that's a clever way to describe it, I am personally not a huge fan of that wording\
    \ since it obfuscates the fact that what you are doing is programming after all.\n\
    \nYou can find pragmatic applications of p5.js such as creating data visualizations:\n\
    \n![](img/41e582902bed374827550eb87c185e8d_13_0.png)\n\nor you can use it to create\
    \ abstract generative art:\n\n![](img/41e582902bed374827550eb87c185e8d_14_0.png)\n\
    \nYou can even create animated or interactive visuals. We will be building an\
    \ interactive game by the end of this book using p5.js!\n\n## About This Book\n\
    \nThe emphasis of this book will be primarily on learning programming using JavaScript\
    \ and p5.js and secondarily in creating visuals. I am hoping that the examples\
    \ that we would be going through would be engaging for you and would motivate\
    \ you to build your skill set in the highly rewarding field of programming. The\
    \ primary aim is to teach you how to program so that you can choose to pursue\
    \ whatever field that you would like with your newly established skill set. The\
    \ skills that you will acquire from this book is highly transferrable and could\
    \ be used wherever you choose to build; whether web applications, programmable\
    \ robots or generative art. This means that I will provide you with enough context\
    \ so that you can build a strong foundation for programming. But I also won’t\
    \ hinder your momentum with irrelevant technical or theoretical points. The aim\
    \ is to build a strong but a minimum viable knowledge to get you running with\
    \ coding. This is the book that I wished I had available when I was learning coding\
    \ myself.\n\nIf you are an artist or a visual designer this book is perfect for\
    \ you as you might find the examples we will be building to be directly relevant\
    \ to your work. If not, this is still a great book for learning programming as\
    \ the visual nature of the exercises will help you grasp the fundamentals of programming\
    \ easier and let you build a strong foundation in a shorter amount of time.\n\n\
    This book will present various JavaScript and p5.js features and concepts in the\
    \ following chapters. The knowledge will be enforced by building several useful\
    \ examples like an animation and a data visualization and as a final project,\
    \ we will be building a game that can be deployed online using what we learned\
    \ in this book!\n\nHere is a rundown of the topics that we will be covering:\n\
    \n- **02 - Getting Started** We will learn some very basic JavaScript commands\
    \ and operations to get started with using p5.js\n- **03 - Colors in p5.js** This\
    \ will be a p5.js specific chapter where we learn about how colors defined and\
    \ used in p5.js. This doesn’t pertain to JavaScript but needs to be explored regardless\
    \ to be able to use p5.js in a comfortable manner.\n- **04 - Operations and Variables**\
    \ We will make use of the JavaScript knowledge we acquired in the second chapter\
    \ in p5.js context.\n- **05 - If - Else Statements and Comparison Operators**\
    \ This chapter will allow us to write programs that can respond to different conditions\
    \ by using conditionals and comparison operators.\n- **06 - More p5.js Variables**\
    \ This will be another p5.js specific chapter where we will learn about several\
    \ library specific variables.\n- **07 - Loops** Here we will learn about loops\
    \ which will allow us to build programs that handles enormous amount of calculation\n\
    - **08 - Functions** Functions are the building blocks of JavaScript and we will\
    \ learn more about them to build more scalable, modular and robust programs in\
    \ this chapter.\n- **09 - Objects and 10 - Arrays** Objects and Arrays are JavaScript\
    \ data structures that will allow us to organize our code and handle complexity\
    \ in more intelligent ways.\n- **11 - Events** p5.js Event handling will allow\
    \ us to write programs that handles user interaction.\n- **12 - More on p5.js**\
    \ Another p5.js only chapter where we learn more about library specific features\
    \ before diving into our final project.\n- **13 - Main Project** We will build\
    \ a game using everything we have learned up to this chapter!\n\n# 02 - Getting\
    \ Started\n\n## Using the p5.js Code Editor\n\nLet’s get this started. First we\
    \ will install p5.js code editor into our system. To install the p5.js editor\
    \ we can go to their web page and download the editor for our operating system,\
    \ whether we are using Mac, Windows or Linux, by following the links on the download\
    \ page.\n\n[p5.js | download](http://p5js.org/download)\n\n![](img/41e582902bed374827550eb87c185e8d_16_0.png)\n\
    \nWe can also use an online editor to code with p5.js. One of the easy to use\
    \ options that is available at the time of the preparation of this book can be\
    \ found in this link: [p5.js online editor - alpha](https://alpha.editor.p5js.org)\n\
    \nOnce we launch the editor, we will see an area where we can write our code.\
    \ A code editor is pretty similar to a text editor, like **Notepad** or **Word**,\
    \ but it has special features that make coding much easier such as highlighting\
    \ of special words for a given programming language, which in this case that language\
    \ is JavaScript.\n\n![](img/41e582902bed374827550eb87c185e8d_17_0.png)\n\nHow\
    \ this specific editor works is that, whenever we have some code ready to be executed\
    \ we will press the *play* button at the top of the page. This play button will\
    \ launch another page that displays the visual result of our code - that is if\
    \ our code was doing any drawing to the screen. Online Editor works in a similar\
    \ manner but it shows the results on the right hand-side panel instead of launching\
    \ a new page. Pressing the Play button at this point wouldn’t do much as we didn’t\
    \ write any code that draws to the screen. We will just see an empty screen get\
    \ generated. But as we can see, this editor has some code already written into\
    \ it. This code that we see is needed for almost all the p5.js programs that we\
    \ will be writing so it is included here for our convenience.\n\n```javascript\n\
    1 function setup() {\n2 \n3 }\n4 \n5 function draw() {\n6 \n7 }\n```\n\nLet’s\
    \ just delete this code for now. Before we start using p5.js to learn JavaScript,\
    \ we will see couple of things on the fundamentals of JavaScript.\n\nYou can find\
    \ the code examples that we will be using throughout this book at the [Github\
    \ repository](https://github.com).\n\n## Gentle Introduction to JavaScript\n\n\
    We can write something as simple as `1 + 1` to the screen. This is a valid JavaScript\
    \ code which adds these two numbers together. If we are to execute this code,\
    \ by pressing the Play button, we still won't see anything. This is kind of disappointing\
    \ because we would have at least expected to see the result of this calculation.\n\
    \nTo be able to see the results of JavaScript operations on the screen we can\
    \ use a **function** called **console.log()**.\n\nA **function** is a programming\
    \ structure that contains other code inside it that is written to perform a specific\
    \ action. Functions allow us to perform complex operations by just calling them\
    \ with their defined function name. When we are calling a function - which we\
    \ can also refer to as *executing* the function - we would write its name, in\
    \ this case **console.log**, and place brackets next to it. If the function requires\
    \ an input to perform its functionality, then we would provide that input inside\
    \ the brackets just like we are doing in this example.\n\n**console.log** is a\
    \ built-in JavaScript function that displays - or logs - the given value inside\
    \ the console below the editor. When I say built-in, it means that most JavaScript\
    \ execution environments would have this function. For example web browsers have\
    \ a section in their interfaces called *console*, which we can access through\
    \ the developer tools. p5.js also has a section that is called *console* as well\
    \ below the editing area.\n\nWe can also have user defined functions that we can\
    \ create for ourselves which won't be available to anyone else until we somehow\
    \ share it with other people. Libraries such as p5.js have bunch of functions\
    \ of their own. We will be using p5.js functions to draw shapes to the screen\
    \ and create all kinds of interactive and animated visuals. We will dwell more\
    \ into the concept of functions later on but for now know that there is this function\
    \ that comes with JavaScript called **console.log** that accepts a value and displays\
    \ that value inside the console underneath the editor. Initially the other functions\
    \ that we will be learning about won't have a dot in their name. **console.log**\
    \ is a bit different in that sense, but the reasons for the 'dot' usage will be\
    \ explained later.\n\nLet's add a couple of more **console.log** statements into\
    \ our code.\n\n```javascript\n1 console.log(1 + 1)\n2 console.log(5 + 10)\n3 console.log(213\
    \ * 63)\n4 console.log(321314543265 + 34251646315526623)\n```\n\nWhen we execute\
    \ this code, we will see the following results being displayed inside the console."
  mdcn: "\n- Faker.js (https://github.com/Marak/Faker.js) : 生成大量假数据\n- franc (https://github.com/wooorm/franc)\
    \ : 检测给定文本的语言。\n- jimp (https://github.com/oliver-moran/jimp) : 一个图像处理库\n- cylon.js\
    \ (https://cylonjs.com/) : 一个用于机器人、物理计算和物联网的机器人框架。\n\np5.js 是一个基于素描理念的创意编程库。就像素描可以被视为一种极简的绘画方式，用于快速将想法原型化，p5.js\
    \ 建立在用最少的代码将你的视觉、交互或动画想法呈现在屏幕上的理念。 p5.js 是流行库 **Processing** 的 JavaScript 实现，而\
    \ Processing 基于 **Java** 编程语言。\n\n值得一提的是，**Java** 和 **JavaScript** 是完全不相关的语言。JavaScript\
    \ 之所以以 Java 命名，是当时一个不幸的品牌和营销决策。\n\np5.js 的简洁性使其成为一个非常容易学习的库。但不要让这种简单性欺骗了你，让你觉得\
    \ p5.js 能力有限。p5.js 背后拥有令人印象深刻的功能、历史和社区，使其成为一项有价值的学习投资，如果你曾经想用代码来创作艺术、设计、动态作品或交互作品。一个\
    \ p5.js 程序可以是从几行代码到数千行不等。由于 p5.js 以简洁为设计目标，有时小的 p5.js 程序被称为素描。尽管这是一个巧妙的描述方式，但我个人并不太喜欢这种说法，因为它模糊了你所做的毕竟是编程这一事实。\n\
    \n你可以找到 p5.js 的务实应用，比如创建数据可视化：\n\n![](img/41e582902bed374827550eb87c185e8d_13_0.png)\n\
    \n或者你可以用它来创造抽象生成艺术：\n\n![](img/41e582902bed374827550eb87c185e8d_14_0.png)\n\n\
    你甚至可以创建动画或交互式视觉作品。我们将在本书末尾使用 p5.js 构建一个交互式游戏！\n\n## 关于本书\n\n本书的重点主要是使用 JavaScript\
    \ 和 p5.js 学习编程，其次是创造视觉效果。我希望我们将要学习的示例能够吸引你，并激励你在高回报的领域——编程——中建立自己的技能。主要目标是教会你如何编程，以便你能够选择自己感兴趣的任何领域，运用你刚刚建立的技能。你从本书中获得的技能具有很高的可迁移性，可以在你选择的任何地方使用；无论是\
    \ Web 应用、可编程机器人还是生成艺术。这意味着我将为你提供足够的背景知识，以便你能够建立坚实的编程基础。但我也不会用不相关的技术或理论要点来阻碍你的进度。目标是建立一套强大但最小可行的知识，让你能够尽快开始编程。这是我在学习编程时希望拥有的那本书。\n\
    \n如果你是一位艺术家或视觉设计师，这本书非常适合你，因为你可能会发现我们将要构建的示例与你的直接工作相关。如果不是，这仍然是一本学习编程的好书，因为练习的视觉本质将帮助你更容易地掌握编程基础，并让你在更短的时间内建立坚实的基础。\n\
    \n本书将在后续章节中介绍各种 JavaScript 和 p5.js 特性和概念。知识将通过构建几个有用的示例来加强，比如动画和数据可视化，作为最终项目，我们将构建一个游戏，可以使用我们在本书中学到的知识部署到网上！\n\
    \n以下是我们将要涵盖的主题的概览：\n\n- **02 - 入门** 我们将学习一些非常基础的 JavaScript 命令和操作，以开始使用 p5.js\n\
    - **03 - p5.js 中的颜色** 这将是一个 p5.js 专属章节，我们将学习颜色在 p5.js 中是如何定义和使用的。这不属于 JavaScript\
    \ 的范畴，但为了舒适地使用 p5.js，无论如何都需要探索。\n- **04 - 运算和变量** 我们将在 p5.js 的上下文中运用第二章中学到的 JavaScript\
    \ 知识。\n- **05 - If - Else 语句和比较运算符** 本章将让我们通过使用条件语句和比较运算符来编写能够响应不同条件的程序。\n- **06\
    \ - 更多 p5.js 变量** 这将是另一个 p5.js 专属章节，我们将学习几个库特定的变量。\n- **07 - 循环** 在这里我们将学习循环，这将使我们能够构建处理大量计算的程序\n\
    - **08 - 函数** 函数是 JavaScript 的构建块，我们将在本章中学习更多关于它们的知识，以构建更可扩展、模块化和健壮的程序。\n- **09\
    \ - 对象和 10 - 数组** 对象和数组是 JavaScript 数据结构，将使我们能够以更智能的方式组织代码和处理复杂性。\n- **11 - 事件**\
    \ p5.js 事件处理将使我们能够编写处理用户交互的程序。\n- **12 - 更多关于 p5.js 的内容** 另一个 p5.js 专属章节，我们在深入最终项目之前学习更多关于库特定功能的内容。\n\
    - **13 - 主项目** 我们将使用到本章为止学到的所有知识来构建一个游戏！\n\n# 02 - 入门\n\n## 使用 p5.js 代码编辑器\n\n\
    让我们开始吧。首先，我们将在系统中安装 p5.js 代码编辑器。要安装 p5.js 编辑器，我们可以访问他们的网页，根据我们的操作系统（无论是 Mac、Windows\
    \ 还是 Linux）下载编辑器，通过下载页面上的链接。\n\n[p5.js | 下载](http://p5js.org/download)\n\n![](img/41e582902bed374827550eb87c185e8d_16_0.png)\n\
    \n我们还可以使用在线编辑器来编写 p5.js 代码。在本书准备期间可用的一个易于使用的选项可以在这个链接找到：[p5.js 在线编辑器 - alpha](https://alpha.editor.p5js.org)\n\
    \n一旦我们启动编辑器，我们将看到一个可以编写代码的区域。代码编辑器与文本编辑器（如 **记事本** 或 **Word**）非常相似，但它具有特殊功能，使编程变得更容易，例如为给定编程语言突出显示特殊单词，在这里这种语言是\
    \ JavaScript。\n\n![](img/41e582902bed374827550eb87c185e8d_17_0.png)\n\n这个特定编辑器的工作方式是，每当我们有一些准备好执行的代码时，我们就会按下页面顶部的\
    \ *播放* 按钮。这个播放按钮将启动另一个页面，显示我们代码的视觉结果——也就是说，如果我们的代码有任何绘制到屏幕上的操作。在线编辑器以类似的方式工作，但它会在右侧面板显示结果，而不是启动一个新页面。此时按播放按钮不会有什么效果，因为我们还没有编写任何绘制到屏幕上的代码。我们只会看到一个空白屏幕被生成出来。但正如我们所见，这个编辑器中已经写好了一些代码。我们看到的这段代码几乎是我们将要编写的大多数\
    \ p5.js 程序都需要的，所以这里为了方便而包含它。\n\n```javascript\n1 function setup() {\n2 \n3 }\n\
    4 \n5 function draw() {\n6 \n7 }\n```\n\n让我们暂时删除这段代码。在我们开始使用 p5.js 学习 JavaScript\
    \ 之前，我们将先了解几个 JavaScript 基础知识点。\n\n你可以在 [Github 仓库](https://github.com) 中找到我们将在本书中使用的代码示例。\n\
    \n## JavaScript 简明介绍\n\n我们可以写一些像 `1 + 1` 这样简单的东西到屏幕上。这是一个有效的 JavaScript 代码，将这两个数字相加。如果我们执行这段代码，通过按下播放按钮，我们仍然看不到任何东西。这有点令人失望，因为我们至少应该能看到这个计算的结果。\n\
    \n为了能够在屏幕上看到 JavaScript 运算的结果，我们可以使用一个叫做 **console.log()** 的**函数**。\n\n**函数**是一种编程结构，包含写在其中的其他代码，用于执行特定的操作。函数使我们能够通过调用它们的定义函数名来执行复杂操作。当我们调用一个函数时——我们也可以称之为\
    \ *执行* 该函数——我们会写出它的名字，在本例中是 **console.log**，并在其旁边加上括号。如果该函数需要输入来执行其功能，那么我们会像在这个例子中那样，在括号内提供该输入。\n\
    \n**console.log** 是一个内置的 JavaScript 函数，用于在编辑器下方的控制台中显示——或记录——给定的值。当我说内置时，意味着大多数\
    \ JavaScript 执行环境都会有这个函数。例如，Web 浏览器在其界面中有一个叫做 *控制台* 的部分，我们可以通过开发者工具访问它。p5.js 也有一个叫做\
    \ *控制台* 的部分，在编辑区域下方。\n\n我们也可以创建用户自定义的函数，这些函数在我们以某种方式分享给其他人之前，不会提供给其他人使用。像 p5.js\
    \ 这样的库有自己的一大堆函数。我们将使用 p5.js 的函数在屏幕上绘制形状，并创建各种交互式和动画视觉效果。我们稍后会深入探讨函数的概念，但现在要知道，JavaScript\
    \ 有一个叫做 **console.log** 的函数，它接受一个值并在编辑器下方的控制台中显示该值。最初，我们将会学习的其他函数名称中不会有圆点。**console.log**\
    \ 在这方面有点不同，但使用\"点\"的原因将在后面解释。\n\n让我们再在代码中添加几个 **console.log** 语句。\n\n```javascript\n\
    1 console.log(1 + 1)\n2 console.log(5 + 10)\n3 console.log(213 * 63)\n4 console.log(321314543265\
    \ + 34251646315526623)\n```\n\n当我们执行这段代码时，我们将在控制台内部看到以下结果被显示出来。\n"
