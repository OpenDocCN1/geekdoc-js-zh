    \ each time the **draw** function is executed again.\n\nThe number of times that\
    \ this **draw** function is executed (can be thought as rendered to the screen)\
    \ is called a frame rate. By default, p5.js has a frame rate of 60. This means\
    \ that it tries to re-draw (or render) the content of the **draw** function 60\
    \ times a second. If we had a way to change the values of the variables that we\
