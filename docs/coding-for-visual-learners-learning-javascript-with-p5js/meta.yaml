    09-02


    In this example, we are creating three variables outside the p5.js functions called
    **circle_1**, **circle_2** and **circle_3**. These variables are created outside
    the p5.js functions is so that they would be in scope for both of those functions.


    We are making these variables to be Circle instances by assigning the **Circle**
    constructor function using the **new** keyword to them. Now that we have three
    separate circle objects, we can change their properties in the **draw** function,
    and get different results from each one of them.


    One thing that is important to note is how we are using a function name that starts
    with a capital letter for the constructor function. We use a capital letter to
    remind ourselves and others that this function is a constructor function and needs
    to be called with the **new** keyword.


    It is important to call a constructor function with the **new** keyword. If we
    don''t use the **this** keyword inside the constructor function, it won''t work
    properly as it wouldn''t refer to the instance object but the global object.


    Usage of the capital letter is not a rule but a convention. No one forces us to
    do it. But it is expected that we follow this convention since not realizing a
    function is a constructor function and then calling it without the **new** keyword
    will have unintended consequences.


    # Summary


    In this chapter, we learned about the JavaScript objects. Simply put, objects
    are a way of organizing code.


    We learned about the dot notation and the square bracket notation that are used
    to access the properties on an object.'
