    This might come as a surprise since we clearly declared these variables inside
    the **setup** function. The reason for this error has to do with something called
    the **scope**. The scope of a variable determines where a variable will be accessible.
    JavaScript variables when using the **var** keyword to declare them have a *function
    scope*.


    How *function scope* works is that any variable that is declared inside a function
    won''t be visible from outside the function. It is only available to the function
    that it lives in and other functions that might be nested inside this function.
    Likewise, if we were to have a variable that is at the top level, this variable
    would be visible to everything that is at that level and at levels that are nested
    inside that level, like the functions that might be defined in there. The problem
    that we are faced with right now is that the variables that are defined inside
    the **setup** function are not visible from the **draw** function, and if were
    to declare variables inside the **draw** function; they wouldn''t be visible inside
    other functions at the same level.'
