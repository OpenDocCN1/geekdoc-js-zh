    # Summary


    In this chapter we learned about a JavaScript data structure called Arrays. Arrays
    allow us to store multiple values of any type in a sequential fashion. The values
    that are stored in an array can be accessed using the square bracket notation.


    We can populate an array with the desired values when they are first created or
    after their creation using the **push** method.


    Arrays are particularly useful when used with loops. Loops let us access the items
    in an array in a very easy manner.'
- md: "We also learned about the **remainder** operator. Remainder operator returns\
    \ the remainder from a division operation in between two numbers. Using this operator,\
    \ we can derive sequential values that cycle in between zero and the desired value.\n\
    \n## Practice\n\nBuild a function called **countdown** that would get two arguments,\
    \ a number and a message, and would create a visualization that is similar to\
    \ above that would display a countdown from the given number to number 0. At the\
    \ end of the countdown, it should display the given message, the second argument,\
    \ to the screen.\n\nFeel free to add another parameter to the function that would\
    \ control how long each number would stay on the screen.\n\n```javascript\ncountdown(10,\
    \ \"Launch!\");\n```\n\n## 11 - Events\n\n### Intro & mousePressed\n\nIn the earlier\
    \ chapters, we learned about a p5.js variable called **mouseIsPressed**, which\
    \ assumes the value **true** when the mouse is clicked and **false** for all other\
    \ instances.\n\nWe also learned that this is not a great way of capturing user\
    \ input as the execution speed of the **draw** function can make it hard to get\
    \ this variable triggered in a reliable way. That’s why there are other ways of\
    \ handling user input inside p5.js, namely the *events*, which solves this problem.\n\
    \nUsing events, we can capture the user input outside the **draw** function loop.\n\
    \nThere are numerous event functions in p5.js that we can declare to make use\
    \ of the event system. One of those functions is the **mousePressed** function.\n\
    \nThe idea is similar to the **draw** and **setup** functions where we will be\
    \ declaring this function with this particular name (just like **setup** and **draw**\
    \ are) which is treated by p5.js in a special manner.\n\nIn a p5.js code, the\
    \ function that we declare under the name **mousePressed** gets triggered every\
    \ time the mouse button is clicked. Let’s re-write our previous example that makes\
    \ use of the **mouseIsPressed** variable to make use of **mousePressed** event\
    \ function instead.\n\n```javascript\nvar toggle = true;\n\nfunction setup() {\n\
    \  createCanvas(800, 300);\n  rectMode(CENTER);\n}\n\nfunction draw() {\n  if\
    \ (toggle === true) {\n    background(1, 186, 240);\n  } else {\n    background(250,\
    \ 150, 50);\n  }\n\n  fill(237, 34, 93);\n  noStroke();\n\n  var x = width / 2;\n\
    \  var y = height / 2;\n  var size = 200;\n\n  if (frameCount < 60) {\n    size\
    \ = size + frameCount;\n  } else {\n    size = size + 60;\n  }\n\n  ellipse(x,\
    \ y, size, size);\n  fill(255);\n  rect(x, y, size*0.75, size*0.15);\n}\n\nfunction\
    \ mousePressed() {\n    toggle = !toggle;\n}\n```\n\nWell, that was a simple refactor!\
    \ We are simply declaring a function that we don't execute ourselves. The execution\
    \ of it is handled by p5.js whenever the corresponding action takes place.\n\n\
    There are lots of other event functions. A complete list can be found under https://p5js.org/reference/#group-Events\n\
    \n### keyPressed\n\nOne other event function that might be worth learning about\
    \ is the **keyPressed** function. As the name implies **keyPressed** function\
    \ gets triggered every time a key is pressed. Let's quickly test how it works\
    \ in a brand new sketch.\n\n```javascript\nfunction setup() {\n    createCanvas(800,\
    \ 300);\n}\n\nfunction draw() {\n    background(220);\n}\n\nfunction keyPressed()\
    \ {\n    console.log('pressed');\n}\n```\n\nIn this example, every time we press\
    \ a key we would see a message 'pressed' displayed in the console. Let's look\
    \ at a more involving example where pressing a key each time creates a shape in\
    \ the canvas.\n\n```javascript\nvar pressed;\n\nfunction setup() {\n    createCanvas(800,\
    \ 300);\n    background(220);\n}\n\nfunction draw() {\n    if (pressed === true)\
    \ {\n        ellipse(\n            random(width),\n            random(height),\n\
    \            50,\n            50\n        );\n    }\n    pressed = false;\n}\n\
    \nfunction keyPressed() {\n    pressed = true;\n}\n```\n\nThe shapes are created\
    \ after we press a key.\n\n![](img/41e582902bed374827550eb87c185e8d_98_0.png)\n\
    \nNotice a couple of things. First of all, we moved the **background** function\
    \ to be under the **setup** function. This is to ensure that the shapes we draw\
    \ remain on the screen. If we are to have a **background** function call inside\
    \ the **draw** function, then it would paint over everything, on every frame which\
    \ is not desirable for this use case. Also, we are spreading the **ellipse** function\
    \ call over a couple of lines again to increase legibility.\n\nWe have a global\
    \ variable called **pressed**. With each key press, we are setting the value of\
    \ this global variable to be **true**. When this happens, the **draw** function\
    \ renders an **ellipse** to the screen since the conditional statement gets executed.\
    \ Then the draw function immediately sets the **pressed** value to **false** again\
    \ so that we only get one ellipse.\n\nWe are going to improve this example a little\
    \ bit to make it more pleasant to the eye. Currently, the circles are looking\
    \ a bit too uniform, and the colors are a bit too dull. We will make it so that\
    \ every time we are creating a circle, it uses a random size between 0 and 200\
    \ and a random color from a list of predefined random colors.\n\n```javascript\n\
    var pressed;\nvar colors = [];\n\nfunction setup() {\n    createCanvas(800, 300);\n\
    \    background(0);\n    colors = [\n        [245, 3, 155],\n        [13, 159,\
    \ 215],\n        [148, 177, 191],\n        [100, 189, 167],\n        [242, 226,\
    \ 133],\n        [176, 230, 110],\n        [123, 90, 240]\n    ];\n}\n\nfunction\
    \ draw() {\n    noStroke();\n    if (pressed === true) {\n        var randomIndex\
    \ = parseInt(random(colors.length), 10);\n        var randomSize = random(200);\n\
    \n        fill(colors[randomIndex]);\n        ellipse(\n            random(width),\n\
    \            random(height),\n            randomSize,\n            randomSize\n\
    \        );\n    }\n    pressed = false;\n}\n\nfunction keyPressed() {\n    pressed\
    \ = true;\n}\n```\n\n![](img/41e582902bed374827550eb87c185e8d_99_0.png)\n\n11-02\n\
    \nTo be able to select a random color each time a key is pressed, we need to generate\
    \ a random **integer** in between 0 and the length of the colors array minus 1.\
    \ Minus 1 because array indices start counting from 0.\n\nTo generate any random\
    \ number in between 0 and the length of the array minus 1, We can simply write\
    \ the random function as `random(colors.length)`. This would end up generating\
    \ a number in between 0 and up until the number of items in **colors** array (excluding\
    \ that number). The problem though is that the number being generated is a floating\
    \ point number meaning it has decimal places. Whereas, we need an integer number\
    \ to be able to access items in an array. So we need to convert the decimal number\
    \ into a whole number. There are a couple of ways to solve this. One way could\
    \ be to use the p5.js **floor** function, which rounds down the given floating\
    \ point number to the nearest integer. Another solution could be to use the native\
    \ JavaScript function called **parseInt** which converts a given value into an\
    \ integer - if the value can be converted. We can’t expect to throw a name to\
    \ it and receive an integer.\n\nWe need to pass the second parameter to **parseInt**\
    \ function to set the number base that the calculation will happen. That base\
    \ almost always is 10. Using **parseInt** function on a float number looks something\
    \ like this.\n\n```javascript\nvar num = parseInt(0.5, 10);\nconsole.log(num);\
    \ // will be 0.\n```\n\nIdentifying the pressed key is only part of the issue,\
    \ though. Another thing that we should be able to do is to identify which button\
    \ the user pressed. Inside the **keyPressed** function, we could theoretically\
    \ identify any key pressed by using the **keyCode** variable. **keyCode** variable\
    \ holds the last key that the user pressed in an encoded manner. Such that if\
    \ the user pressed the key ‘a’, it would return the value ‘65’, for ‘b’; ‘66’,\
    \ etc...\n\np5.js being a helpful library makes it easier to identify some of\
    \ the keys by providing variables for these options: **BACKSPACE, DELETE, ENTER,\
    \ RETURN, TAB, ESCAPE, SHIFT, CONTROL, OPTION, ALT, UP_ARROW, DOWN_ARROW, LEFT_ARROW,\
    \ RIGHT_ARROW.**\n\nFor example here is a small code snippet that executes a **console.log**\
    \ statement whenever the ‘Enter’ key is pressed.\n\n```javascript\nfunction setup()\
    \ {\n    createCanvas(800, 300);\n}\n\nfunction draw() {\n    background(220);\n\
    }\n\nfunction keyPressed() {\n    if (keyCode === ENTER) {\n        console.log('Enter\
    \ Pressed');\n    }\n}\n```"
  mdcn: "\n我们还学习了**取余**运算符。取余运算符返回两个数相除后的余数。通过这个运算符，我们可以得到在零与期望值之间循环的序列值。\n\n## 练习\n\
    \n构建一个名为 **countdown** 的函数，该函数接收两个参数：一个数字和一个消息。它将创建一个类似于上文的可视化效果，从给定数字倒计时到0。倒计时结束后，它应在屏幕上显示给定的消息（即第二个参数）。\n\
    \n你可以自由添加另一个参数来控制每个数字在屏幕上停留的时长。\n\n```javascript\ncountdown(10, \"Launch!\");\n\
    ```\n\n## 11 - 事件\n\n### 简介与 mousePressed\n\n在之前的章节中，我们学习了一个名为 **mouseIsPressed**\
    \ 的 p5.js 变量，当鼠标被点击时，它的值为 **true**，在其他所有情况下为 **false**。\n\n我们还了解到，这并不是捕获用户输入的好方法，因为\
    \ **draw** 函数的执行速度可能使此变量难以可靠地触发。这就是为什么在 p5.js 中有其他处理用户输入的方法，即 **事件**，它解决了这个问题。\n\
    \n使用事件，我们可以在 **draw** 函数循环之外捕获用户输入。\n\np5.js 中有众多事件函数，我们可以声明它们来利用事件系统。其中一个函数就是\
    \ **mousePressed** 函数。\n\n其思想类似于 **draw** 和 **setup** 函数：我们将使用这个特定名称（就像 **setup**\
    \ 和 **draw** 一样）来声明这个函数，p5.js 会以特殊方式处理它。\n\n在 p5.js 代码中，我们声明的名为 **mousePressed**\
    \ 的函数会在每次鼠标按钮被点击时触发。让我们重写之前的例子，这次不使用 **mouseIsPressed** 变量，而是使用 **mousePressed**\
    \ 事件函数。\n\n```javascript\nvar toggle = true;\n\nfunction setup() {\n  createCanvas(800,\
    \ 300);\n  rectMode(CENTER);\n}\n\nfunction draw() {\n  if (toggle === true) {\n\
    \    background(1, 186, 240);\n  } else {\n    background(250, 150, 50);\n  }\n\
    \n  fill(237, 34, 93);\n  noStroke();\n\n  var x = width / 2;\n  var y = height\
    \ / 2;\n  var size = 200;\n\n  if (frameCount < 60) {\n    size = size + frameCount;\n\
    \  } else {\n    size = size + 60;\n  }\n\n  ellipse(x, y, size, size);\n  fill(255);\n\
    \  rect(x, y, size*0.75, size*0.15);\n}\n\nfunction mousePressed() {\n    toggle\
    \ = !toggle;\n}\n```\n\n嗯，这只是一个简单的重构！我们只是声明了一个我们自己并不直接执行的函数。它的执行由 p5.js 在相应动作发生时处理。\n\
    \n还有很多其他事件函数。完整列表可以在 https://p5js.org/reference/#group-Events 找到。\n\n### keyPressed\n\
    \n另一个值得了解的事件函数是 **keyPressed** 函数。顾名思义，**keyPressed** 函数会在每次按键时触发。让我们在一个全新的草图中快速测试一下它的工作原理。\n\
    \n```javascript\nfunction setup() {\n    createCanvas(800, 300);\n}\n\nfunction\
    \ draw() {\n    background(220);\n}\n\nfunction keyPressed() {\n    console.log('pressed');\n\
    }\n```\n\n在这个例子中，每次我们按下一个键，都会在控制台看到一条“pressed”消息。让我们看一个更复杂的例子，其中每次按键都会在画布上创建一个形状。\n\
    \n```javascript\nvar pressed;\n\nfunction setup() {\n    createCanvas(800, 300);\n\
    \    background(220);\n}\n\nfunction draw() {\n    if (pressed === true) {\n \
    \       ellipse(\n            random(width),\n            random(height),\n  \
    \          50,\n            50\n        );\n    }\n    pressed = false;\n}\n\n\
    function keyPressed() {\n    pressed = true;\n}\n```\n\n按下键后，形状被创建。\n\n![](img/41e582902bed374827550eb87c185e8d_98_0.png)\n\
    \n注意几点。首先，我们将 **background** 函数移到了 **setup** 函数下面。这是为了确保我们绘制的形状保留在屏幕上。如果我们在 **draw**\
    \ 函数内部调用 **background** 函数，那么它会在每一帧重绘一切，这对于这个用例是不希望的。此外，我们再次将 **ellipse** 函数调用分布在多行中以提高可读性。\n\
    \n我们有一个名为 **pressed** 的全局变量。每次按键时，我们都会将此全局变量的值设置为 **true**。当这种情况发生时，**draw** 函数会向屏幕渲染一个\
    \ **ellipse**，因为条件语句被执行了。然后 draw 函数立即将 **pressed** 的值设置回 **false**，这样我们只会得到一个椭圆。\n\
    \n我们将稍改进这个例子，使其更赏心悦目。目前，圆圈看起来有点太统一，颜色也有点太单调。我们将使每次创建圆时，它都使用 0 到 200 之间的随机大小，以及从预定义随机颜色列表中选取的随机颜色。\n\
    \n```javascript\nvar pressed;\nvar colors = [];\n\nfunction setup() {\n    createCanvas(800,\
    \ 300);\n    background(0);\n    colors = [\n        [245, 3, 155],\n        [13,\
    \ 159, 215],\n        [148, 177, 191],\n        [100, 189, 167],\n        [242,\
    \ 226, 133],\n        [176, 230, 110],\n        [123, 90, 240]\n    ];\n}\n\n\
    function draw() {\n    noStroke();\n    if (pressed === true) {\n        var randomIndex\
    \ = parseInt(random(colors.length), 10);\n        var randomSize = random(200);\n\
    \n        fill(colors[randomIndex]);\n        ellipse(\n            random(width),\n\
    \            random(height),\n            randomSize,\n            randomSize\n\
    \        );\n    }\n    pressed = false;\n}\n\nfunction keyPressed() {\n    pressed\
    \ = true;\n}\n```\n\n![](img/41e582902bed374827550eb87c185e8d_99_0.png)\n\n11-02\n\
    \n为了在每次按键时选择一个随机颜色，我们需要生成一个介于 0 和 colors 数组长度减 1 之间的随机**整数**。减 1 是因为数组索引从 0 开始计数。\n\
    \n要生成任何介于 0 和数组长度减 1 之间的随机数，我们可以简单地将 random 函数写为 `random(colors.length)`。这最终会生成一个介于\
    \ 0 到 **colors** 数组元素数量（不包括该数字）之间的数字。但问题在于生成的数字是浮点数，意味着它有小数位。而我们需要一个整数才能访问数组中的元素。因此，我们需要将小数转换为整数。有几种解决方法。一种方法是使用\
    \ p5.js 的 **floor** 函数，它将给定的浮点数向下舍入到最近的整数。另一种解决方案是使用名为 **parseInt** 的原生 JavaScript\
    \ 函数，该函数将给定值转换为整数——前提是该值可以被转换。我们不能期望扔给它一个名字就能得到一个整数。\n\n我们需要向 **parseInt** 函数传递第二个参数来设置计算将使用的数字进制。这个进制几乎总是\
    \ 10。在浮点数上使用 **parseInt** 函数看起来像这样。\n\n```javascript\nvar num = parseInt(0.5,\
    \ 10);\nconsole.log(num); // 结果为 0。\n```\n\n不过，识别按下的键只是问题的一部分。另一件我们应该能够做的事情是识别用户按下的具体按钮。在\
    \ **keyPressed** 函数内部，理论上我们可以使用 **keyCode** 变量来识别按下的任何键。**keyCode** 变量以编码方式保存用户最后按下的键。例如，如果用户按下键\
    \ 'a'，它会返回值 '65'；按下 'b' 则返回 '66'，以此类推...\n\np5.js 作为一个有用的库，通过提供以下选项的变量使识别某些键变得更容易：**BACKSPACE,\
    \ DELETE, ENTER, RETURN, TAB, ESCAPE, SHIFT, CONTROL, OPTION, ALT, UP_ARROW, DOWN_ARROW,\
    \ LEFT_ARROW, RIGHT_ARROW.**\n\n例如，下面是一个小的代码片段，每当按下“Enter”键时就执行一条 **console.log**\
    \ 语句。\n\n```javascript\nfunction setup() {\n    createCanvas(800, 300);\n}\n\n\
    function draw() {\n    background(220);\n}\n\nfunction keyPressed() {\n    if\
    \ (keyCode === ENTER) {\n        console.log('Enter Pressed');\n    }\n}\n```\n"
