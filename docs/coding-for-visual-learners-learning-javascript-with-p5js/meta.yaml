- md: "These two function declarations need to be made for pretty much every p5.js\
    \ program that we would write. p5.js finds these function definitions in our code\
    \ and executes whatever is written inside them. But there is a difference in between\
    \ how these functions are executed.\n\nThe block inside the **setup** function,\
    \ the area in between the curly brackets, is the place where we will be writing\
    \ the code that is to be executed for the initialization of our program. Code\
    \ written inside the **setup** function is executed only once before the draw\
    \ function.\n\n```javascript\nfunction setup() {\n    // write your code for setup\
    \ function inside these curly brackets\n}\n```\n\nThe **draw** function is where\
    \ the real magic happens. Any code that is written inside the **draw** function\
    \ repeatedly executed by p5.js. This allows us to create all sorts of animated\
    \ and interactive works.\n\np5.js makes sure to execute the **setup** function\
    \ before the **draw** function. And to reiterate, p5.js executes the **setup**\
    \ function only once but the **draw** function over and over again (actually close\
    \ to 60 times a second). And this is how we can create interactive and animated\
    \ content using p5.js.\n\nWe can actually see this in action by placing **console.log**\
    \ statements at different places in our code. Place a **console.log()** statement\
    \ inside the **setup** function, inside the **draw** function and outside both\
    \ of these functions using different values.\n\n```javascript\nfunction setup()\
    \ {\n    console.log('setup');\n}\n\nfunction draw() {\n    console.log('draw');\n\
    }\n\nconsole.log('hello');\n```\n\nLet's execute this code and immediately try\
    \ to stop it. We would notice that the message `hello` is displayed as the very\
    \ first thing. This is an expected behaviour. A function call that we have should\
    \ be executed by JavaScript. What is rather unexpected is that **setup** and **draw**\
    \ functions get executed as well. This is unexpected because these are only function\
    \ declarations, they define the behaviour of a function, but we still need to\
    \ execute these functions to be able to use it.\n\nThis means that if we were\
    \ just using JavaScript we would need to call the **setup** and **draw** functions\
    \ explicitly in order to have the console.log messages inside them to be displayed:\n\
    \n```javascript\nsetup();\ndraw();\nconsole.log('hello');\n```\n\nBut we don’t\
    \ need to do this using the p5.js library. Because of how the p5.js library is\
    \ architected, it looks for function declarations with the name **setup** and\
    \ **draw**, and executes these functions for us. The reason why p5.js takes control\
    \ of the execution of these functions is that it executes them in a very specific\
    \ manner.\n\np5.js executes the **setup** function only once and then goes on\
    \ to execute the draw function in a repeated manner such that if we don’t stop\
    \ the process it will just keep working forever. This is a very standard behaviour\
    \ with any graphical interface - think of the web browser, the games you play,\
    \ or the operating system you interface with. These are just programs that continuously\
    \ work - and display to the screen - until we explicitly close them. This is why\
    \ p5.js creates an execution loop for the **draw** function so that things will\
    \ persist on the screen instead of appearing for a second and then disappearing.\n\
    \n## More About Functions\n\nLet’s talk more about functions because they will\
    \ be the building blocks of the programs that we will be writing.\n\nFunction\
    \ names are usually verbs. They represent the specific action that can be performed\
    \ by executing that function. Hypothetically speaking, we might have a function\
    \ called **drawCat** which when called can draw a cat to the screen.\n\n```javascript\n\
    drawCat();\n```\n\nThough this is not hypothetical at all as I actually created\
    \ a cat drawing function that is called **drawCat** for this chapter. We are free\
    \ to create whatever functions we want to create in JavaScript, and that gives\
    \ us immense power when programming applications.\n\n![](img/41e582902bed374827550eb87c185e8d_24_0.png)\n\
    \nOK, to be fair, this function doesn't do a great job in drawing a cat.\n\nTo\
    \ use a function, we call it by its name and then put brackets next to it to have\
    \ the function executed. Sometimes functions, depending on how they are created\
    \ or defined, are parameterized. This means they can accept input values which\
    \ would effect the outcome of a function. For example a **drawCat** function might\
    \ get a number input, which would determine the size of the cat that is drawn.\
    \ Or maybe the number input determines the amount of cats that would be drawn\
    \ to the screen. It really depends on how this function is constructed.\n\nIn\
    \ our example, this function that I created can get an input which allows us to\
    \ change the size of the cat head that gets drawn on the screen.\n\n```javascript\n\
    drawCat(2);\n```\n\n![](img/41e582902bed374827550eb87c185e8d_25_0.png)\n\n**02-04**\n\
    \nUnfortunately, p5.js doesn't come with a **drawCat** function - I had to create\
    \ my own - but it has lots of other useful functions that allow us to perform\
    \ complicated tasks in an easy manner. To be able to do anything using the p5.js\
    \ library, we will be using the functions that come with it, that are coded by\
    \ the smart people who created this library.\n\nHere is a function from p5.js\
    \ library that probably all the sketches we will be writing will require: **createCanvas**\
    \ function. What **createCanvas** function does is that it creates a drawing area,\
    \ canvas, inside the web page for us to work. But for this function to work, we\
    \ need to provide it with two comma separated values: a width and height for the\
    \ drawing area. We should be calling the **createCanvas** function inside the\
    \ **setup** function because it only needs to get executed once and it needs to\
    \ be executed before we can do any drawing.\n\nLet's provide this function with\
    \ the values **800** and **300** and execute our sketch to see what's happening.\
    \ It seems like not much have changed, but the size of the browser window that\
    \ gets launched seems to have increased. It is now using the dimensions that we\
    \ have provided. Let's change the dimensions again to see the window size updating.\n\
    \n```javascript\nfunction setup() {\n    createCanvas(800, 300);\n}\n\nfunction\
    \ draw() {\n}\n```\n\nThere is another function that we will frequently be using\
    \ which is called **background**. **background** function sets the color of the\
    \ canvas using the given value. We will look at how color values are represented\
    \ in p5.js in another chapter, but for now, we can just provide this function\
    \ with the value (220,220,220) to see the background become light gray.\n\n```javascript\n\
    function setup() {\n    createCanvas(800, 300);\n    background(220,220,220);\n\
    }\n\nfunction draw() {\n}\n```\n\nAs we can see again, the code is executed from\
    \ top to bottom. p5.js first creates the canvas for us and then sets the background\
    \ to be gray.\n\nIt is worth emphasizing this once more: the **setup** and **draw**\
    \ are function definitions that we need for p5.js to work correctly. Our job when\
    \ we are using p5.js is to determine what is placed inside these functions that\
    \ are executed by p5.js. This is due to how p5.js is architected. The creators\
    \ of p5.js wanted to make sure some of the code we will be writing will only be\
    \ executed once for initialization and setup purposes, while some will be executed\
    \ all the time for drawing, animation and interactivity purposes.\n\nWe used functions\
    \ that come with p5.js library such as **createCanvas** and **background** inside\
    \ these function definitions. These functions are already defined by someone else\
    \ so we don't actually know what code is contained inside them. But we don't really\
    \ need to have this knowledge anyway since all we care about is knowing what they\
    \ do and how to use them.\n\nFunctions allow us to perform complicated tasks in\
    \ an easy manner. By using the **createCanvas** function we don't need to know\
    \ what kind of work goes into creating a canvas element in a page. These details\
    \ are hidden away, abstracted, from us. We just need to know how to call this\
    \ function to make it work for us.\n\nFinally, we will be calling one more function,\
    \ this time inside the **draw** function definition, to draw a rectangle on the\
    \ page.\n\nTo draw a rectangle we will be utilizing a function called **rect**.\
    \ **rect** function requires us to provide it with four input values: the x and\
    \ y position of the rectangle inside the canvas drawing area, and the width and\
    \ height values for the rectangle."
  mdcn: "\n对于几乎所有我们编写的 p5.js 程序，都需要声明这两个函数。p5.js 会在我们的代码中寻找这两个函数的定义，并执行其中编写的内容。但这两个函数的执行方式存在差异。\n\
    \n**setup** 函数内部的代码块，即花括号之间的区域，是我们编写程序初始化代码的地方。**setup** 函数内的代码仅在 draw 函数之前执行一次。\n\
    \n```javascript\nfunction setup() {\n    // 在这对花括号内编写你的 setup 函数代码\n}\n```\n\n\
    **draw** 函数是真正发生神奇效果的地方。任何写在 **draw** 函数内的代码都会被 p5.js 重复执行。这使我们能够创作各种动画和交互式作品。\n\
    \np5.js 确保 **setup** 函数在 **draw** 函数之前执行。并且需要重申的是，p5.js 只执行 **setup** 函数一次，但会反复执行\
    \ **draw** 函数（实际上大约每秒执行 60 次）。我们就是这样使用 p5.js 来创建交互式和动画内容的。\n\n实际上，我们可以通过在代码的不同位置放置\
    \ **console.log** 语句来观察这一过程。在 **setup** 函数内、**draw** 函数内以及这两个函数之外，分别使用不同的值放置一个\
    \ **console.log()** 语句。\n\n```javascript\nfunction setup() {\n    console.log('setup');\n\
    }\n\nfunction draw() {\n    console.log('draw');\n}\n\nconsole.log('hello');\n\
    ```\n\n让我们执行这段代码并立即尝试停止它。我们会注意到消息 `hello` 最先显示出来。这是预期中的行为。这是一个我们编写的、将由 JavaScript\
    \ 执行的函数调用。而有些出乎意料的是，**setup** 和 **draw** 函数也被执行了。这之所以意外，是因为它们仅仅是函数声明，定义了函数的行为，但我们仍然需要执行这些函数才能使用它们。\n\
    \n这意味着如果我们只使用 JavaScript，我们需要显式地调用 **setup** 和 **draw** 函数，才能让它们内部的 console.log\
    \ 消息显示出来：\n\n```javascript\nsetup();\ndraw();\nconsole.log('hello');\n```\n\n\
    但使用 p5.js 库时，我们不需要这样做。由于 p5.js 库的架构设计，它会查找名为 **setup** 和 **draw** 的函数声明，并为我们执行这些函数。p5.js\
    \ 接管这些函数执行的原因在于，它以一种非常特定的方式执行它们。\n\np5.js 只执行 **setup** 函数一次，然后继续重复执行 draw 函数，如果我们不停止这个进程，它将永远运行下去。这是任何图形界面的标准行为——想想网络浏览器、你玩的游戏，或者你使用的操作系统。这些都是持续运行并显示在屏幕上的程序——直到我们明确关闭它们。这就是为什么\
    \ p5.js 为 **draw** 函数创建了一个执行循环，这样内容就会在屏幕上持续显示，而不是出现一秒后就消失。\n\n## 关于函数的更多内容\n\n\
    让我们更多地谈谈函数，因为它们将是我们编写程序的构建块。\n\n函数名通常是动词。它们代表执行该函数时可以执行的特定动作。假设，我们可能有一个名为 **drawCat**\
    \ 的函数，调用时可以在屏幕上画一只猫。\n\n```javascript\ndrawCat();\n```\n\n虽然这并非假设，因为我确实为这一章创建了一个名为\
    \ **drawCat** 的画猫函数。在 JavaScript 中，我们可以自由地创建任何想要的函数，这为编程应用程序提供了巨大的力量。\n\n![](img/41e582902bed374827550eb87c185e8d_24_0.png)\n\
    \n好吧，公平地说，这个函数画猫的水平不太行。\n\n要使用一个函数，我们通过其名称调用它，然后在其旁边放置括号来执行该函数。有时，函数根据其创建或定义方式的不同，可以是参数化的。这意味着它们可以接受影响函数结果的输入值。例如，一个\
    \ **drawCat** 函数可能接受一个数字输入，该输入决定绘制猫的大小。或者数字输入决定屏幕上绘制猫的数量。这完全取决于该函数是如何构建的。\n\n\
    在我们的例子中，我创建的这个函数可以接受一个输入，允许我们更改屏幕上绘制的猫头大小。\n\n```javascript\ndrawCat(2);\n```\n\
    \n![](img/41e582902bed374827550eb87c185e8d_25_0.png)\n\n**02-04**\n\n遗憾的是，p5.js\
    \ 并不包含 **drawCat** 函数——我必须自己创建——但它有许多其他有用的函数，使我们能够以简单的方式执行复杂的任务。为了能够使用 p5.js 库做任何事情，我们将使用它附带的函数，这些函数由创建这个库的聪明人编写。\n\
    \n这里有一个来自 p5.js 库的函数，可能我们编写的大多数草稿都需要它：**createCanvas** 函数。**createCanvas** 函数的作用是在网页内为我们创建一个绘图区域（画布）。但要使此函数工作，我们需要提供两个逗号分隔的值：绘图区域的宽度和高度。我们应该在\
    \ **setup** 函数内调用 **createCanvas** 函数，因为它只需要执行一次，并且需要在我们进行任何绘图之前执行。\n\n让我们为这个函数提供值\
    \ **800** 和 **300**，并执行我们的草稿来看看发生了什么。看起来变化不大，但启动的浏览器窗口大小似乎增大了。它现在使用了我们提供的尺寸。让我们再次更改尺寸，看看窗口大小的更新。\n\
    \n```javascript\nfunction setup() {\n    createCanvas(800, 300);\n}\n\nfunction\
    \ draw() {\n}\n```\n\n我们还会经常使用另一个函数，叫做 **background**。**background** 函数使用给定的值设置画布的颜色。我们将在另一章讨论\
    \ p5.js 中颜色值的表示方式，但现在，我们可以只提供值 (220,220,220) 来使背景变成浅灰色。\n\n```javascript\nfunction\
    \ setup() {\n    createCanvas(800, 300);\n    background(220,220,220);\n}\n\n\
    function draw() {\n}\n```\n\n正如我们再次看到的，代码是从上到下执行的。p5.js 首先为我们创建画布，然后将背景设置为灰色。\n\
    \n值得再次强调：**setup** 和 **draw** 是 p5.js 正常工作所需的函数定义。当我们使用 p5.js 时，我们的工作是确定在这些由 p5.js\
    \ 执行的函数内部放置什么内容。这是由于 p5.js 的架构设计决定的。p5.js 的创建者希望确保我们编写的一些代码仅执行一次，用于初始化和设置目的，而另一些代码则会一直执行，用于绘图、动画和交互目的。\n\
    \n我们在这些函数定义中使用了 p5.js 库附带的函数，如 **createCanvas** 和 **background**。这些函数已经由其他人定义，因此我们实际上不知道它们内部包含什么代码。但我们实际上不需要具备这些知识，因为我们只关心知道它们的功能以及如何使用它们。\n\
    \n函数使我们能够以简单的方式执行复杂的任务。通过使用 **createCanvas** 函数，我们不需要知道在页面中创建一个 canvas 元素需要做哪些工作。这些细节被隐藏（抽象）起来了。我们只需要知道如何调用这个函数来让它为我们工作。\n\
    \n最后，我们将在 **draw** 函数定义内部调用另一个函数，以在页面上绘制一个矩形。\n\n为了绘制矩形，我们将使用一个名为 **rect** 的函数。**rect**\
    \ 函数要求我们提供四个输入值：矩形在画布绘图区域内的 x 和 y 位置，以及矩形的宽度和高度值。\n"
