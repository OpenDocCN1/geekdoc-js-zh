    \n如果你不希望出现这种行为，我们可以调用另一个名为 **rectMode** 的 p5.js 函数，并为其提供 **CENTER** 值，以改变程序中矩形的绘制方式。由于这个函数更像是一个设置和初始化相关的函数，我们将把它放在\
