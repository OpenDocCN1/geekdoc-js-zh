    \ our p5.js code.\n\n# Getting Started With p5.js\n\nWhat we see when we start\
    \ a new project in the p5.js code editor are two function declarations with the\
    \ names: **setup** and **draw**.\n\n```\nfunction setup() {\n  \n}\n\nfunction\
