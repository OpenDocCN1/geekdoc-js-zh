    ## Where to Go Next?\n\nAs mentioned at the beginning of the book, learning JavaScript\
    \ will open a world of opportunities in front of you as there are a lot of domains\
    \ that you can apply your knowledge. Where to go next, surely depends on where\
    \ you would like to grow your skill-set in.\n\nIf you want to move beyond p5.js\
    \ and create user-facing web applications, you will surely need to learn the basics\
    \ of **HTML** and **CSS** to build graphical interfaces for your projects. After\
    \ that, learning some **DOM API** would be useful to be able to hook up the interface\
    \ elements on the page to execute JavaScript commands. If you wanted to build\
    \ slightly more complicated interfaces, then **jQuery** might help as it makes\
    \ working with JavaScript slightly easier when working with web pages. If you\
    \ are looking to build more advanced interfaces where there are lots of interactions\
    \ and state dependencies in between page elements, then a front-end framework\
    \ such as **AngularJS** or a library like **React** can be very useful. I would\
    \ suggest not to rush to learn these tools even though they are all the hype nowadays.\
    \ Starting out with pure JavaScript and then moving to jQuery to build slightly\
    \ more challenging interfaces will help you appreciate the problems that these\
    \ more complicated tools are built to solve.\n\nMaybe you might want to do some\
    \ server-side programming. Then **Node.js** is the tool that you should pick up.\
    \ Server-side programming might involve any back-end calculations that doesn't\
    \ need to happen on the client-side, on the browser, and might involve building\
    \ scripts that interface with the operating system of the host computer to do\
    \ things like: creating files and folders, deleting them, etc. A **Node.js** script\
    \ doesn't necessarily need to be in service of a web application backend. The\
    \ prime advantage of **Node.js** is that it provides you with an environment on\
    \ your machine, rather than on the browser, to run JavaScript in. Node.js sets\
    \ the JavaScript free from the constraints of the browser environment. For example,\
    \ **Electron**. It is a **Node.js** based framework that allows you to build native\
    \ desktop applications using web technologies. You can use **Electron** to build\
    \ a web browser using JavaScript rather than to build something on the browser\
    \ using JavaScript!\n\nAutomating web pages, programmatically connecting to the\
    \ internet and scraping online data might be your thing. For that, there is **Phantom.js**\
    \ and **Casper.js**. If you wanted to do advanced data visualizations, then you\
    \ should check out the **D3** library. Maybe you want to get into robotics, or\
    \ program IOT devices using JavaScript. How about giving **Johnny-Five** a try\
    \ then? You can build native mobile apps (**React Native**), HTML5 games (**Phaser**),\
    \ databases (**mongoDB**) 3D visuals and animations (**Three.js**) or even cognitive\
    \ applications that makes use of Artificial Intelligence (**IBM Watson**) all\
    \ by using JavaScript.\n\nWhen learning a new programming language it is best\
    \ to have a plan: a vision for something that you would like to build. Ideally,\
    \ the minimum viable project that you can lift off the ground without encumbering\
    \ yourself with too much work or too many technicalities. Getting to that point\
    \ and then building the next thing. Always getting better, always learning something\
