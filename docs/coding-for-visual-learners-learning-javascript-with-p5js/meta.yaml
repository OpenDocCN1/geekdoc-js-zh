    \ Whereas, we need an integer number to be able to access items in an array. So\
    \ we need to convert the decimal number into a whole number. There are a couple\
    \ of ways to solve this. One way could be to use the p5.js **floor** function,\
    \ which rounds down the given floating point number to the nearest integer. Another\
    \ solution could be to use the native JavaScript function called **parseInt**\
