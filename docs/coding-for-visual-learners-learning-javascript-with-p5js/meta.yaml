    # ## Summary


    In this chapter we made a quick start with using p5.js and actually drew shapes
    on the screen.


    We have seen that we need to write our code into two function definition blocks
    that go with the name `setup` and `draw`. Anything that only needs to be executed
    once is placed under the `setup` function, and anything that we might like to
    animate or interact with goes into the `draw` function. Writing our code into
    these two functions is something that p5.js requires us to do. It is not a general
    programming principle, convention or anything like that. We could have been using
    a different library that doesn''t require this kind of a structuring to our code.
    This requirement has to do with how p5.js is architected as a library. We will
    need to start all of our p5.js sketches with these two function definitions.


    Code like this which needs to be written repetitively with little or no alteration
    is called `boilerplate` code. Having lots of boilerplate is never a good thing
    since we would find ourselves having to repeat our work a lot but in this case
    the amount of boilerplate is very manageable.


    Inside these function definitions we made use of functions that come with p5.js
    library such as `createCanvas`, `background` and some shape functions such as
    `rect`. As mentioned earlier, functions are general programming structures that
    allow us to bundle code together for reusability purposes. Functions also abstract
    away a great deal of complexity from us. We don''t need to know how a function
    works; we just need to know'
