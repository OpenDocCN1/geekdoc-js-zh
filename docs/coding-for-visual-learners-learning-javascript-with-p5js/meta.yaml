    ```


    One takeaway should be that code executes from top to bottom. There are some programming
    structures that alter this flow, but we will see them later on. Another takeaway
    should be that computers don’t mind working with large numbers. We can throw hard
    operations at them that would take days for a human to perform.


    In the last **console.log** statement we have two ridiculously large numbers.
    What if we wanted to use the resulting number from that operation and subtract
    10 from it on the next line. Right now to be able to do this we have to type that
    number again.


    ```

    1 console.log(321314543265 + 34251646315526623 - 10)

    ```


    This is obviously very wasteful. But luckily another thing that computers are
    great at is storing and remembering values. Therefore we can create something
    called a **variable** to hold on to that value. In programming languages, a variable
    is a name that refers to a value. So we can use a variable name to refer to that
    value instead of typing the value again. Here is how that works:


    ```

    1 var bigNumber = 321314543265 + 34251646315526623

    2 console.log(bigNumber)

    3 console.log(bigNumber - 10)

    ```


    We are creating a variable called **bigNumber** by using the **var** keyword.
    **var** is the keyword that we need to use whenever we are creating a variable.
    After the **var** keyword, we are giving this variable a name, which in this case
    is **bigNumber**.


    It is important to choose a variable name that makes sense for the current context.
    In this example, this might not matter too much, but as our programs get more
    complex, meaningful variable names can help us understand what’s going when reading
    our code. So naming this kind of a variable that holds a large number as **cat**
    wouldn’t make much sense and can confuse other people that might read our code.
    It might even confuse us if we are to come back to our code couple of months later.
    Programmers always strive to make their code as readable as possible.


    Once this variable is declared, we can assign a value to it by using the equal
    operator. This might seem unusual at first. In Math, the equal operator is used
    to signify equality in between two values. Here we are using it to do a value
    assignment to a variable. It takes the value on the right-hand side of the operation
    and assigns it to the variable on the left-hand side. This is a pretty common
    procedure that exists in many programming languages.'
