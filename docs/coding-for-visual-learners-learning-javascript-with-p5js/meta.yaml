    \ one second.\n\nIf we didn’t want any animation, then we can call a function\
    \ called **noLoop** inside the **setup** function. This function call will cause\
    \ the draw function to be called only once.\n\nTo summarize, **frameCount** is\
    \ the number of times the **draw** function is executed throughout the lifetime\
    \ of a program. **frameRate** is the number of times the **draw** function is\
    \ executed in a second. If the **frameRate** for a program were 60, the **frameCount**\
    \ after 3 seconds would be around `60*3=180`.\n\nAs mentioned earlier we can see\
    \ what the current frame rate is by calling the **frameRate** function with no\
