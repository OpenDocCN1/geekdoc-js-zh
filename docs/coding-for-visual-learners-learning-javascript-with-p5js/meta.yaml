    \ to write something like this:\n\n```\n10 + 2 * 4\n```\n\nBut in this operation\
    \ multiplication will happen before addition. 2 will get multiplied with 4 before\
    \ being added to 10, so this above operation will yield 18 instead of the expected\
    \ value 48.\n\nTo be able to control the order of operations we can use parentheses.\
    \ For example, we can write the top equation like this:\n\n```\n(10 + 2) * 4.\n\
    ```\n\nAnything inside parentheses will be evaluated before other operations.\
    \ In the order of operations, parentheses come first, then the multiplication\
    \ and division, and then addition and subtraction."
