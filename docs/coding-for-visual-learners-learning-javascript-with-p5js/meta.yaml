  - '[PAGE 103]


    Currently, we are drawing two rectangles that are diagonal to each other. Let’s
    make use of the **rotate** function to see what’s going to happen.


    ```

    1 function setup() {

    2     createCanvas(800, 300);

    3     rectMode(CENTER);

    4     noStroke();

    5 }


    7 function draw() {

    8     background(220);

    9     fill(237, 34, 93);

    10    rotate(5);

    11    rect(width/2, height/2, 50, 50);

    12    rect(width/2+50, height/2+50, 50, 50);

    13 }

    ```


    You will notice that both of the shapes disappeared from the screen. If you were
    expecting the shapes to move by only 5 degrees, this must be a confusing result.
    This happens because the default units that **rotate** function works within p5.js
    is radians. We can make this function work using degrees instead by using the
    **angleMode** function with the **DEGREES** p5.js variable. Make this declaration
    inside the **setup** function.


    ```

    1 angleMode(DEGREES);

    ```


    Now things work in a way that is more or less expected. We can now observe that
    when we call the **rotate** function, we end up rotating every shape that comes
    after the function call.


    ```

    1 function setup() {

    2     createCanvas(800, 300);

    3     rectMode(CENTER);

    4     noStroke();

    5     angleMode(DEGREES);

    6 }


    8 function draw() {

    9     background(220);

    10    fill(237, 34, 93);

    11    rotate(5);

    12    rect(width/2, height/2, 50, 50);

    13    rect(width/2+50, height/2+50, 50, 50);

    14 }

    ```'
