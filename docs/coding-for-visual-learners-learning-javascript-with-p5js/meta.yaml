    }\n\nfunction draw() {\n    background(1, 186, 240);\n    fill(237, 34, 93);\n\
    \    noStroke();\n\n    var x = width / 2;\n    var y = height / 2;\n\n    ellipse(x,\
    \ y, 200, 200);\n    fill(255);\n    rect(x, y, 150, 30);\n}\n```\n\nYou should\
    \ note that **width** and **height** are p5.js variables which mean that they\
