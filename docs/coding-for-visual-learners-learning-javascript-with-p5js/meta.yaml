    \ magic happens. Any code that is written inside the **draw** function repeatedly\
    \ executed by p5.js. This allows us to create all sorts of animated and interactive\
    \ works.\n\np5.js makes sure to execute the **setup** function before the **draw**\
    \ function. And to reiterate, p5.js executes the **setup** function only once\
    \ but the **draw** function over and over again (actually close to 60 times a\
    \ second). And this is how we can create interactive and animated content using\
    \ p5.js.\n\nWe can actually see this in action by placing **console.log** statements\
    \ at different places in our code. Place a **console.log()** statement inside\
