    \ the constructor function. Basically, the **new** keyword allows us to create\
    \ a new instance of an object from a Constructor function. We can think of the\
    \ **Circle** constructor function as a blueprint and the **myCircle** as an actual\
    \ circle built from that blueprint. Now we can draw this newly created circle\
