    \ these same variables inside the **draw** function as well so that even if we\
    \ are to change the size of the canvas, the relative position of the shapes will\
    \ remain the same. So let's put these variables into use in the **draw** function.\
    \ We will be dividing them by 2 so that we can get the half point of width and\
