    # ## About This Book


    The emphasis of this book will be primarily on learning programming using JavaScript
    and p5.js and secondarily in creating visuals. I am hoping that the examples that
    we would be going through would be engaging for you and would motivate you to
    build your skill set in the highly rewarding field of programming. The primary
    aim is to teach you how to program so that you can choose to pursue whatever field
    that you would like with your newly established skill set. The skills that you
