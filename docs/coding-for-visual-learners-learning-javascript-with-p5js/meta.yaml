    \ 作为库的架构方式有关。我们所有的 p5.js 绘图（sketches）都需要从这两个函数定义开始。\n\n像这样需要重复编写且几乎没有改动的代码被称为`样板`（boilerplate）代码。拥有大量的样板代码绝不是一件好事，因为我们会发现自己不得不重复很多工作，但在这个例子中，样板代码的数量是非常可控的。\n\
    \n在这些函数定义内部，我们使用了 p5.js 库自带的函数，如 `createCanvas`、`background` 以及一些形状函数如 `rect`。如前所述，函数是通用的编程结构，允许我们将代码捆绑在一起以实现重复利用。函数还为我们屏蔽了大量复杂性。我们不需要知道函数是如何工作的；我们只需要知道如何使用它。我们完全可以不知道\
    \ **createCanvas** 实际上是如何在网页中创建 canvas 元素的。只要我们知道如何使用这个函数，这就无关紧要。想象一下开车；我们不一定需要知道内燃机如何工作才能开车。我们只需要知道如何通过方向盘、踏板等与汽车交互。同样的理念也适用于函数。\n\
    \n稍后，我们也将创建自己的函数，以管理程序的复杂性并创建可重用的代码片段。\n\n## 练习\n\n尝试重新创建下面的图像。\n\n![](img/41e582902bed374827550eb87c185e8d_31_0.png)\n\
    \n# 03 - p5.js 中的颜色\n\n## p5.js 中的颜色函数\n\n既然我们已经在 p5.js 中绘制了形状，现在让我们来看看如何在绘图中控制颜色。我们已经通过向\
    \ **background** 函数传递 220, 220, 220 这三个值，为背景分配了浅灰色。\n\np5.js 默认使用 *RGB* 颜色值，其中\
    \ R 代表红色（red），G 代表绿色（green），B 代表蓝色（blue）。这意味着我们*通常*需要向一个接受颜色的函数传递这三个颜色分量来设置所需的颜色。每个颜色分量的值可以在\
    \ 0 到 255 之间。这意味着，如果我们向 **background** 函数传递 0, 0, 0，背景将变成黑色；如果我们传递 255, 255, 255，则会得到白色。p5.js\
    \ 作为一个便捷的库，允许我们在希望这三个值相等时仅传递一个值。也就是说，我们可以直接传递一个 0，而不是传递 0, 0, 0。\n\n每当我们这三个颜色分量的数值相等时，结果将是白色、黑色或某种灰色。因此，如果我们想要一个灰度色，向颜色设置函数传递单个值是非常有用的。但如果我们想要颜色具有色调，那么我们需要传递所有这三个值，以便为每个分量指定所需的量。255\
    \ 是颜色分量能接受的最大值；所以如果我们向 **background** 函数传递 255, 0, 0，我们将得到纯红色。如果传递 0, 255, 0，我们将得到纯绿色，以此类推。\n\
    \nRGB 颜色模型是一种加色模型，这意味着将这些颜色以全强度叠加在一起会产生白色；而与之相对的是减色模型（如油漆颜色），将它们全部混合在一起会产生深褐色。如果你不熟悉加色\
