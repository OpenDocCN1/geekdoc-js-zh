    Let’s create a variable called **words** outside the **draw** and **setup** functions.
    Since the variable is initialized outside of both **setup** and **draw** functions,
    it would be accessible from both of them.


    ```

    var words = [''I'', ''love'', ''programming'', ''with'', ''JavaScript''];

    ```


    Next, we need to devise a way that would continuously generate value in between
    0 and the length of this array to be able to refer to the individual items in
    an array. To do so, we can use the **remainder (%)** operator.


    The remainder operator is a bit different than all the operators we have seen
    previously such as plus or minus so it might be beneficial to see how it works.
    Given two values, the **remainder** operator returns the remainder left over when
    the first value is divided by the second value. The **%** operator symbolizes
    it.


    As we can see in this example, given an incrementally increasing first value,
    the **remainder** operator allows us to cycle through second value minus one.


    ```

    console.log(1 % 6) // returns 1.

    console.log(2 % 6) // returns 2.

    console.log(3 % 6) // returns 3.

    console.log(4 % 6) // returns 4.

    console.log(5 % 6) // returns 5.

    console.log(6 % 6) // returns 0.

    console.log(7 % 6) // returns 1.

    // etc..

    ```'
