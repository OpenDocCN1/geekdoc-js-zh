- img_proc: true
  md: 'Think of frames as sheets in a flip book animation. More sheets viewed per
    second will mean smoother animation. That’s why high frame rates are desirable.
    The animation might look jaggy if the frame rate is low. We can set the frame
    rate explicitly in p5.js by passing an integer value to the **frameRate** function.
    A **frameRate** of 1 will have our **draw** function called every one second.


    If we didn’t want any animation, then we can call a function called **noLoop**
    inside the **setup** function. This function call will cause the draw function
    to be called only once.


    To summarize, **frameCount** is the number of times the **draw** function is executed
    throughout the lifetime of a program. **frameRate** is the number of times the
    **draw** function is executed in a second. If the **frameRate** for a program
    were 60, the **frameCount** after 3 seconds would be around `60*3=180`.


    As mentioned earlier we can see what the current frame rate is by calling the
    **frameRate** function with no arguments. But instead of **console.log**`ing the
    result, we can actually do much better and display it on screen.


    In p5.js, we can use the **text** function to display a value to the screen. **text**
    function displays the value that is given as the first argument at the x and y
    positions that are provided as the second and third arguments. With this, we can
    more easily visualize the frame rate in our program. Please note that the actual
    result is going to be hard to read at a high frame rate as it fluctuates a lot
    from one frame to another.


    ```

    1 function setup() {

    2     createCanvas(800, 300);

    3     textAlign(CENTER, CENTER);

    4     fill(237, 34, 93);

    5 }

    6

    7 function draw() {

    8     var fps = parseInt(frameRate(), 10);

    9     textSize(36);

    10    background(220);

    11    text("frameRate: " + fps, width/2, height/2);

    12 }

    ```'
