    6 function draw() {

    7     background(1, 75, 100);

    8     fill(237, 34, 93, 100);

    9     noStroke();

    10

    11    for (var i=0; i<10; i=i+1) {

    12        ellipse(0, 0, 50, 50);

    13    }

    14 }

    ```


    ![](img/41e582902bed374827550eb87c185e8d_62_0.png)


    In our example, we are drawing ten circles to the screen, but there is no way
    of visually making that distinction since all the circles are being drawn on top
    of each other. This is where making use of the loop counter variable can make
    sense. I can basically use this variable to offset the position of circles each
    time the loop is called.'
