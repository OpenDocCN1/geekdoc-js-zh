- md: " But if we wanted to use this resulting number in another calculation, we might\
    \ hit a roadblock. This function is not *returning* the number to us; it is just\
    \ displaying it on the screen. Calling this function affects the environment that\
    \ we are in, but doesn't *return* a value for it to be used in further calculations.\
    \ Some of the functions we have seen so far, like **ellipse**, **rect**, etc...,\
    \ behaved in a similar fashion where they do something but don't actually return\
    \ a value as a result of that calculation. Whereas, the **random** function when\
    \ executed doesn't display anything on the screen but returns a value which we\
    \ can capture in a variable.\n\nTo be able to return values from a function, we\
    \ can use the **return** keyword. Let's alter the **squared** function to both,\
    \ display the results on the screen and also to return a value.\n\n```\nfunction\
    \ setup() {\n    createCanvas(800, 300);\n}\n\nfunction draw() {\n    background(1,\
    \ 75, 100);\n    fill(237, 34, 93);\n    var x = squared(10);\n    console.log(x);\n\
    }\n\nfunction squared(num) {\n    textSize(60);\n    textAlign(CENTER, CENTER);\n\
    \    var result = num * num;\n    text(result, width/2, height/2);\n    return\
    \ result;\n}\n```\n\nNow, this function returns a value which we are using in\
    \ a **console.log** function. Whenever the program comes across the keyword **return**,\
    \ the program terminates the execution of the function and returns the value that\
    \ is declared next to it to the caller of the function. This means that if we\
    \ had any other lines below the **return** keyword, they wouldn't get executed\
    \ since **return** terminates the execution of the current function. The **return**\
    \ keyword is only available inside functions, trying to use it from outside a\
    \ function will result in an error. As outside of a function, there is nothing\
    \ to be returned.\n\n## Revisiting Setup & Draw Functions\n\nNow that we learned\
    \ about creating our functions, it is important to emphasize the difference in\
    \ between creating a function vs. calling a function one more time. Notice how\
    \ when we created our functions, we had to call them in order for them to be executed.\
    \ For example, in this code example, we are only creating, or declaring a function:\n\
    \n```\nfunction myFunction() {\n}\n```\n\nTo be able to make use of this function,\
    \ we need to execute it, by calling it with its name and using parentheses next\
    \ to that name.\n\n```\nmyFunction();\n```\n\nNotice one thing that is slightly\
    \ strange when working in p5.js. We never really call the **setup** and **draw**\
    \ functions and yet they get executed anyway! This is due to how p5.js is architected.\
    \ p5.js handles the execution of the **setup** and **draw** functions for us as\
    \ their execution follows some simple rules which are:\n- **setup** function gets\
    \ executed before the **draw** function.\n- **setup** function is only executed\
    \ one time, whereas **draw** function is executed continuously.\n\n## Summary\n\
    \nWe have been making use of functions from the moment we started to use p5.js.\
    \ Its very own architecture depends on the existence of two functions inside our\
    \ programs that has to have the name: **setup** and **draw**. Moreover, we have\
    \ been using functions that are available to use that comes with the p5.js library\
    \ such as **ellipse**, **rect**, etc.\n\nWe have seen that functions can be built\
    \ to work with external user input or not. We can also build functions that either\
    \ returns a value using the **return** keyword or not.\n\nFunctions are a way\
    \ to create modular blocks of code that can be reused throughout our code to make\
    \ our programs more maintainable and scalable by decreasing the amount of code\
    \ we need to write. Whenever we find ourselves repeating a block code in multiple\
    \ places, that's likely a good candidate to create a function from.\n\n## Practice\n\
    \nCreate a function called **grid** that would work with three parameters; a **numX**\
    \ and a **numY** parameter that would create **numX** amount of shapes (say rectangles)\
    \ on the x-axis and **numY** amount of shapes on the y-axis and a **size** parameter\
    \ that would set the size of the shapes.\n\nFor example:\n\n```\ngrid(10, 30,\
    \ 20); // Would create 10 x 30 rectangles of size 20px.\n```\n\n## 09 - Objects\n\
    \n### Introduction to Objects\n\nJavaScript uses a data structure called **Object**\
    \ that helps to organize data together. There are a couple of ways of creating\
    \ an **object** in JavaScript, one way of doing it would be by using the curly\
    \ brackets.\n\n```\nvar colors = {};\n```\n\nThese curly brackets are called *Object\
    \ Initializer*. They create an empty object. We hold a reference to the object\
    \ by using the variable **colors**.\n\nNow, we can add properties to this **colors**\
    \ object by providing the desired property names after a dot. This is called *dot\
    \ notation*. We will also assign values to these newly created properties.\n\n\
    ```\nvar colors = {};\ncolors.black = 0;\ncolors.darkGray = 55;\ncolors.gray =\
    \ 125;\ncolors.lightGray = 175;\ncolors.white = 255;\n```\n\nIf we are to look\
    \ at the object at this point by using **console.log**, we would see it looks\
    \ something like this.\n\n```\n{\"black\":0,\"darkGray\":55,\"gray\":125,\"lightGray\"\
    :175,\"white\":255}\n```\n\nWe could also have created an object with the same\
    \ properties from get go, by providing these properties inside curly brackets.\n\
    \n```\nvar colors = {\n    black: 0,\n    darkGray: 55,\n    gray: 125,\n    lightGray:\
    \ 175,\n    white: 255,\n};\n```\n\nObjects are basically *key-value* pairs. Each\
    \ key stores a *value* and each *key-value* pair make up a *property* on an object.\n\
    \nTo be able to access a value on an object, we can again use the dot notation.\n\
    \n```\nconsole.log(colors.gray);\n```\n\nFor some situations, the dot notation\
    \ doesn't work. An example is when we use numbers as our key values in an object.\
    \ In that case, we can use square brackets to access values instead. Like:\n\n\
    ```\ncolors[1]; // Assuming you were using numbers instead of color names as key\
    \ values.\n```\n\nWhat do you think this above expression will return if we were\
    \ to **console.log** it? We would get the value **undefined** as the key 1 doesn't\
    \ exist in our current **colors** object.\n\nWe can also define functions as values\
    \ for keys in an object. In that case, the resulting property would be referred\
    \ to as a *method*.\n\nContinuing from our **colors** object, let's define a method\
    \ inside that object called **paintItBlack** which would make the background color\
    \ to be black.\n\n```\nvar colors = {\n    black: 0,\n    darkGray: 55,\n    gray:\
    \ 125,\n    lightGray: 175,\n    white: 255,\n    paintItBlack: function() {\n\
    \        background(this.black);\n    }\n};\n```\n\nHere is a p5.js code that\
    \ makes use of this object\n\n```\nvar colors;\n\nfunction setup() {\n    createCanvas(800,\
    \ 300);\n    colors = {\n        black: 0,\n        darkGray: 55,\n        gray:\
    \ 125,\n        lightGray: 175,\n        white: 255,\n        paintItBlack: function()\
    \ {\n            background(this.black);\n        }\n    };\n}\n\nfunction draw()\
    \ {\n    background(220);\n    if (frameCount > 120) {\n        colors.paintItBlack();\n\
    \    }\n}\n```\n\nIn this example, we are initializing the **colors** variable\
    \ outside the scope of **setup** and **draw** functions and then create its content\
    \ inside the **setup** function. After all, we only need the content to be created\
    \ once. And then we call its **paintItBlack** method if the **frameCount** is\
    \ bigger than 120 which would happen after two seconds with default settings.\
    \ (Remember the default value for the **frameRate** is 60, which means that, approximately,\
    \ 60 frames are rendered per second.)\n\nTo be able to use a key that is defined\
    \ inside the object from within, we need to be able to refer to the object itself.\
    \ In JavaScript, there is a keyword called **this** which allows us to do so.\
    \ Using the **this** keyword we can refer to the keys that are defined on the\
    \ object itself.\n\n```\npaintItBlack: function() {\n    background(this.black);\n\
    }\n```\n\nOnce we defined a method on the object, we can call the method by accessing\
    \ it using the dot notation. Since we are executing a function in this instance,\
    \ we need to have brackets after the function name.\n\n```\ncolors.paintItBlack();\n\
    ```\n\nThe concept of objects in JavaScript (or in other languages that implement\
    \ objects) exists so that we can model after real world objects or concepts. Just\
    \ like how real world objects have properties and sometimes a behaviour, programming\
    \ language objects can have properties that describe what they are and methods\
    \ that specify how they behave.\n\nLet me give you an example of a programming\
    \ language object that models after a real world concept. We will create an object\
    \ called **circle**. This circle object will have several properties defining\
    \ how it looks and also it will have several methods that describe how it behaves.\n\
    \n```\nvar circle = {\n    x: width/2,\n    y: height/2,\n    size: 50,\n};\n\
    ```\n\nThis **circle** object has an **x** and **y** property that defines its\
    \ coordinates and a **size** property that defines its size. We will also create\
    \ method on it, a property that is a function, which defines a certain behaviour.\
    \ In this case, the defined behaviour will be to draw the circle to the screen.\n\
    \n```\nvar circle = {\n    x: width/2,\n    y: height/2,```"
  mdcn: "\n但如果我们想把这个计算结果用到另一个计算中，可能会遇到障碍。这个函数并没有将数字*返回*给我们，它只是在屏幕上显示出来。调用这个函数会影响我们当前的环境，但不会*返回*一个可供后续计算使用的值。到目前为止，我们见过的一些函数，如\
    \ **ellipse**、**rect** 等，表现也类似——它们执行了一些操作，但实际上并没有返回计算结果。而 **random** 函数在执行时不会在屏幕上显示任何内容，而是返回一个值，我们可以将这个值捕获到变量中。\n\
    \n要从函数中返回值，我们可以使用 **return** 关键字。让我们修改 **squared** 函数，使其既在屏幕上显示结果，又返回一个值。\n\n\
    ```\nfunction setup() {\n    createCanvas(800, 300);\n}\n\nfunction draw() {\n\
    \    background(1, 75, 100);\n    fill(237, 34, 93);\n    var x = squared(10);\n\
    \    console.log(x);\n}\n\nfunction squared(num) {\n    textSize(60);\n    textAlign(CENTER,\
    \ CENTER);\n    var result = num * num;\n    text(result, width/2, height/2);\n\
    \    return result;\n}\n```\n\n现在，这个函数返回了一个值，我们将其用在 **console.log** 函数中。当程序遇到\
    \ **return** 关键字时，程序会终止函数的执行，并将紧随其后的值返回给函数的调用者。这意味着，如果在 **return** 关键字之后还有其他代码行，它们将不会被执行，因为\
    \ **return** 会终止当前函数的执行。**return** 关键字只能在函数内部使用，尝试在函数外部使用它会导致错误。因为在函数外部，没有需要返回的东西。\n\
    \n## 重新审视 Setup 和 Draw 函数\n\n既然我们已经学会了创建自己的函数，有必要再次强调创建函数与调用函数之间的区别。注意，当我们创建函数时，必须调用它们才能使其被执行。例如，在下面的代码示例中，我们只是创建或声明了一个函数：\n\
    \n```\nfunction myFunction() {\n}\n```\n\n要使用这个函数，我们需要通过函数名加括号的方式来调用并执行它。\n\n\
    ```\nmyFunction();\n```\n\n注意在 p5.js 中有一个稍显奇怪的现象：我们从未真正调用过 **setup** 和 **draw**\
    \ 函数，但它们却照样被执行了！这源于 p5.js 的架构设计。p5.js 为我们处理了 **setup** 和 **draw** 函数的执行，因为它们的执行遵循一些简单的规则：\n\
    - **setup** 函数在 **draw** 函数之前执行。\n- **setup** 函数只执行一次，而 **draw** 函数会持续不断地执行。\n\
    \n## 总结\n\n从我们开始使用 p5.js 的那一刻起，我们就在使用函数了。它自身的架构就依赖于我们程序中必须存在的两个函数，其名称为：**setup**\
    \ 和 **draw**。此外，我们一直在使用 p5.js 库自带的函数，如 **ellipse**、**rect** 等。\n\n我们已经了解到，函数可以设计为处理外部用户输入，也可以不处理。我们还可以构建使用\
    \ **return** 关键字返回值的函数，或者不返回值的函数。\n\n函数是一种创建模块化代码块的方式，可以在整个代码中重复使用，从而通过减少需要编写的代码量来使我们的程序更易维护和扩展。每当我们发现自己在多个地方重复同一段代码时，那很可能就是创建函数的好候选。\n\
    \n## 练习\n\n创建一个名为 **grid** 的函数，接受三个参数：一个 **numX** 参数和一个 **numY** 参数，用于在 x 轴上创建\
    \ **numX** 个形状（比如矩形），在 y 轴上创建 **numY** 个形状；还有一个 **size** 参数，用于设置形状的大小。\n\n例如：\n\
    \n```\ngrid(10, 30, 20); // Would create 10 x 30 rectangles of size 20px.\n```\n\
    \n## 09 - 对象\n\n### 对象简介\n\nJavaScript 使用一种称为**对象**的数据结构来帮助组织数据。在 JavaScript 中创建对象有几种方式，其中一种是使用花括号。\n\
    \n```\nvar colors = {};\n```\n\n这些花括号称为*对象初始化器*。它们创建一个空对象。我们通过变量 **colors** 来持有对该对象的引用。\n\
    \n现在，我们可以通过在点号后面提供所需的属性名来向这个 **colors** 对象添加属性。这称为*点号表示法*。我们还将为这些新创建的属性赋值。\n\n\
    ```\nvar colors = {};\ncolors.black = 0;\ncolors.darkGray = 55;\ncolors.gray =\
    \ 125;\ncolors.lightGray = 175;\ncolors.white = 255;\n```\n\n如果此时我们使用 **console.log**\
    \ 查看这个对象，会看到类似这样的内容。\n\n```\n{\"black\":0,\"darkGray\":55,\"gray\":125,\"lightGray\"\
    :175,\"white\":255}\n```\n\n我们也可以从一开始就通过在花括号内提供属性来创建具有相同属性的对象。\n\n```\nvar colors\
    \ = {\n    black: 0,\n    darkGray: 55,\n    gray: 125,\n    lightGray: 175,\n\
    \    white: 255,\n};\n```\n\n对象本质上是*键值*对。每个键存储一个*值*，每个*键值*对构成对象上的一个*属性*。\n\n要访问对象上的值，我们可以再次使用点号表示法。\n\
    \n```\nconsole.log(colors.gray);\n```\n\n在某些情况下，点号表示法不适用。例如当我们使用数字作为对象的键值时。在这种情况下，我们可以使用方括号来访问值。例如：\n\
    \n```\ncolors[1]; // Assuming you were using numbers instead of color names as\
    \ key values.\n```\n\n你认为上面的表达式如果用 **console.log** 输出会返回什么？我们会得到 **undefined**，因为键\
    \ 1 在当前的 **colors** 对象中不存在。\n\n我们还可以将函数定义为对象中键的值。在这种情况下，生成的属性将被称为*方法*。\n\n在我们的\
    \ **colors** 对象基础上，让我们在该对象中定义一个名为 **paintItBlack** 的方法，它将背景颜色设置为黑色。\n\n```\nvar\
    \ colors = {\n    black: 0,\n    darkGray: 55,\n    gray: 125,\n    lightGray:\
    \ 175,\n    white: 255,\n    paintItBlack: function() {\n        background(this.black);\n\
    \    }\n};\n```\n\n以下是一个使用该对象的 p5.js 代码\n\n```\nvar colors;\n\nfunction setup()\
    \ {\n    createCanvas(800, 300);\n    colors = {\n        black: 0,\n        darkGray:\
    \ 55,\n        gray: 125,\n        lightGray: 175,\n        white: 255,\n    \
    \    paintItBlack: function() {\n            background(this.black);\n       \
    \ }\n    };\n}\n\nfunction draw() {\n    background(220);\n    if (frameCount\
    \ > 120) {\n        colors.paintItBlack();\n    }\n}\n```\n\n在这个示例中，我们在 **setup**\
    \ 和 **draw** 函数的作用域之外初始化了 **colors** 变量，然后在 **setup** 函数内部创建其内容。毕竟，我们只需要创建一次内容。然后，如果\
    \ **frameCount** 大于 120，我们就调用它的 **paintItBlack** 方法，这在默认设置下会在两秒后发生。（记住 **frameRate**\
    \ 的默认值是 60，这意味着大约每秒渲染 60 帧。）\n\n要在对象内部使用对象中定义的键，我们需要能够引用对象本身。在 JavaScript 中，有一个名为\
    \ **this** 的关键字可以让我们做到这一点。使用 **this** 关键字，我们可以引用对象本身上定义的键。\n\n```\npaintItBlack:\
    \ function() {\n    background(this.black);\n}\n```\n\n一旦我们在对象上定义了方法，就可以通过点号表示法来调用该方法。由于我们在执行一个函数，所以需要在函数名后面加上括号。\n\
    \n```\ncolors.paintItBlack();\n```\n\nJavaScript 中（或其他实现了对象的语言中）对象的概念之所以存在，是为了让我们能够对现实世界的对象或概念进行建模。就像现实世界的对象具有属性和行为一样，编程语言中的对象也可以拥有描述其特征的属性和描述其行为的方法。\n\
    \n让我给你举一个对现实世界概念进行建模的编程语言对象的例子。我们将创建一个名为 **circle** 的对象。这个 circle 对象将有几个属性来定义它的外观，还有几个方法来描述它的行为。\n\
