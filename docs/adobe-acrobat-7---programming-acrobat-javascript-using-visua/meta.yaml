  md: '# Programming Acrobat JavaScript Using Visual Basic


    # Working with Annotations


    features operate at the document level. There are some application-level features
    in JavaScript (and therefore in JSObject), but they are of secondary interest.
    In practice, a JSObject is always associated with a particular document. When
    working with a large number of documents, you must structure your code such that
    a new JSObject is acquired for each document, rather than creating a single JSObject
    to work on every document.


    # Working with Annotations


    The next example is more interesting: a program that allows the user to select
    a PDF, add a pre-defined annotation, and save the file back to disk.


    +   1. Create a new Visual Basic.NET project as you did in the first example;
    be sure to add the Adobe Acrobat 7.0 Type Library to this project as well.

    2. For this example you use the Windows **File > Open** dialog, so select **Project
    > Add Component** from the UI. This allows you to open the **Toolbox** on the
    left side of the development environment. Select **Windows Forms** from the **Toolbox**
    and scroll down to and select the **OpenFileDialog**. Drag it to your form.

    3. Use the same technique to add a **Button** to your form.'
