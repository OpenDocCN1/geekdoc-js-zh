  md: '# Programming Acrobat JavaScript Using Visual Basic


    Acrobat 7.0 provides a rich set of JavaScript programming interfaces that are
    designed to be used from within the Acrobat environment. It also provides a mechanism
    (known as *JSObject*) that allows external clients to access the same functionality
    from environments such as Visual Basic.


    This document gives you the information you need to get started using the extended
    functionality of JavaScript from a Visual Basic programming environment. It provides
    a set of examples to illustrate the key concepts.


    # What is JSObject?


    In precise terms, JSObject is an interpretation layer between an OLE Automation
    client such as a Visual Basic application and the JavaScript functionality provided
    by Acrobat. From a programmer''s point of view, the end result is that programming
    JSObject from a Visual Basic environment is quite similar to programming in JavaScript
    using the Acrobat console.


    # Getting Started


    The following steps get you set up to run the examples:


    +   1. Install Acrobat 7.0 and Visual Basic .NET, since both are required for
    the examples in this document.

    2. Open a new Visual Basic.NET project. That gets you started with a blank form
    and project workspace.

    3. To access the Acrobat Automation APIs, including JSObject, you need to add
    a reference to Acrobat''s type library. From the UI, select **Project > Add Reference**,
    then the **COM** tab, and from the list of available references, click on the
    item labeled "Adobe Acrobat 7.0 Type Library." Click **Select**. Click **OK**.'
  merge: -1
  pgno: 2
