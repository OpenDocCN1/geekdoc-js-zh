    \    Dim count As Integer\n    Dim i As Integer, j As Integer\n    Dim word As\
    \ Variant\n    Dim result As Variant\n    Dim foundErr As Boolean\n\n    OpenFileDialog1.ShowDialog()\n\
    \    path = OpenFileDialog1.FileName\n    foundErr = False\n    Set pdDoc = CreateObject(\"\
    AcroExch.PDDoc\")\n\n    If pdDoc.Open(path) Then\n        Set jso = pdDoc.GetJSObject\n\
    \        If Not jso Is Nothing Then\n            count = jso.getPageNumWords(0)\n\
    \            For i = 0 To count - 1\n                word = jso.getPageNthWord(0,\
    \ i)\n                If VarType(word) = vbString Then\n                    result\
    \ = jso.spell.checkWord(word)\n                    If IsArray(result) Then\n \
    \                       foundErr = True\n                        ListView1.Items.Add\
    \ (word & \" is misspelled.\")\n                        ListView1.Items.Add (\"\
    Suggestions:\")\n                        For j = LBound(result) To UBound(result)\n\
    \                            ListView1.Items.Add (result(j))\n               \
    \         Next j\n                        ListView1.Items.Add (\"\")\n       \
    \             End If\n                End If\n            Next i\n           \
    \ Set jso = Nothing\n            pdDoc.Close\n\n            If Not foundErr Then\n\
    \                ListView1.Items.Add (\"No spelling errors found in \" & path)\n\
    \            End If\n        End If\n    Else\n        MsgBox \"Failed to open\
    \ \" & path\n    End If\n\n    Set pdDoc = Nothing\nEnd Sub\n```\n\n在本示例中，请注意\
    \ Spell 对象 **check** 方法的使用。根据 *Acrobat JavaScript Scripting Reference*，此方法接受一个单词作为输入，如果在字典中找到该单词，则返回\
    \ null 对象；如果未找到，则返回建议单词的数组。与以往一样，存储 JSObject 方法调用返回值时最安全的方法是使用 Variant。你可以使用 **IsArray**\
    \ 函数来确定 Variant 是否为数组，并相应地采取操作。在这个简单的示例中，如果程序看到一组建议单词，它会将它们输出到 **ListView** 控件中。\n\
    \n## 将 JavaScript 转换为 JSObject 的技巧\n\n涵盖 JSObject 可用的每种方法超出了本文档的范围。但是，*Acrobat\
    \ JavaScript Scripting Reference* 详细介绍了该主题，并且记住一些基本事实可以推断出很多信息：\n\n- 参考资料中的大多数对象和方法在\
    \ Visual Basic 中可用，但并非全部。特别是，任何需要 `new` 运算符构造的 JavaScript 对象都无法在 Visual Basic\
    \ 中创建。这包括 `Report` 对象。\n- `Annots` 对象不同寻常，它需要 JSObject 通过 `getProps` 和 `setProps`\
    \ 方法使用单独的对象来设置和获取其属性。\n- 如果不确定使用什么类型来声明变量，请将其声明为 Variant。这为 Visual Basic 提供了更灵活的类型转换，并有助于防止运行时错误。\n\
    - JSObject 无法向 JavaScript 添加新的属性、方法或对象。由于此限制，`global.setPersistent` 属性没有意义。\n\
    - JSObject 不区分大小写。Visual Basic 通常将标识符的首字符大写，并阻止你更改其大小写。不必担心这一点，因为 JSObject 在将标识符与其\
    \ JavaScript 等效项匹配时不区分大小写。\n- JSObject 总是将值作为 Variants 返回。这包括属性获取以及方法调用的返回值。当预期返回值为\
    \ null 时，使用空的 Variant。当 JSObject 返回数组时，数组中的每个元素都是 Variant。要确定 Variant 的实际数据类型，请使用\
    \ VBA 库 Information 模块中的实用程序函数 `IsArray`、`IsNumeric`、`IsEmpty`、`IsObject` 和 `VarType`。\n\
    - JSObject 可以处理大多数基本的 Visual Basic 类型，用于属性放置和方法调用的输入参数，包括 Variant、Array、Boolean、String、Date、Double、Long、Integer\
    \ 和 Byte。JSObject 可以接受 Object 参数，但仅当该 Object 是属性获取或对 JSObject 的方法调用的结果时。JSObject\
    \ 无法接受 Error 和 Currency 类型的值。\n"
