  md: '# Programming Acrobat JavaScript Using Visual Basic


    A Simple Example


    ![](img/5df42d34636aad17a1b31a4ab6630e9b_3_0.png)


    # A Simple Example


    This example describes the bare minimum required to display “Hello, Acrobat!”
    in Acrobat''s JavaScript console.


    +   1. Bring up the source code window for this form by selecting **View > Code**
    from the UI.

    2. Select (**Form1 Events**) from the selection box in the upper left corner of
    that window. The selection box in the upper right shows all the functions available
    to the Form object.

    3. Select **Load** from that box, which creates an empty function stub. The Form''s
    **Load** function is called when the Form is first displayed, so it''s a good
    place to add the initialization code.


    This program uses some global variables for data that are required for its lifetime,
    and initializes them in the **Form1_Load** routine.'
  merge: -1
