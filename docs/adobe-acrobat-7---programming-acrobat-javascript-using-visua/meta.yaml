    \ Systems Incorporated and not to devices or items that purport to be merely compatible\
    \ with the PostScript language.\n\nAdobe, the Adobe logo, Acrobat, the Acrobat\
    \ logo, Acrobat Capture, Distiller, PostScript, the PostScript logo and Reader\
    \ are either registered trademarks or trademarks of Adobe Systems Incorporated\
    \ in the United States and/or other countries.\n\nApple, Macintosh, and Power\
    \ Macintosh are trademarks of Apple Computer, Inc., registered in the United States\
    \ and other countries. PowerPC is a registered trademark of IBM Corporation in\
    \ the United States. ActiveX, Microsoft, Windows, and Windows NT are either registered\
    \ trademarks or trademarks of Microsoft Corporation in the United States and/or\
    \ other countries. Verity is a registered trademark of Verity, Incorporated. UNIX\
    \ is a registered trademark of The Open Group. Verity is a trademark of Verity,\
    \ Inc. Lextek is a trademark of Lextek International. All other trademarks are\
    \ the property of their respective owners.\n\nThis publication and the information\
    \ herein is furnished AS IS, is subject to change without notice, and should not\
    \ be construed as a commitment by Adobe Systems Incorporated. Adobe Systems Incorporated\
    \ assumes no responsibility or liability for any errors or inaccuracies, makes\
    \ no warranty of any kind (express, implied, or statutory) with respect to this\
    \ publication, and expressly disclaims any and all warranties of merchantability,\
    \ fitness for particular purposes, and noninfringement of third party rights.\n\
    \n# Programming Acrobat JavaScript Using Visual Basic\n\nAcrobat 7.0 provides\
    \ a rich set of JavaScript programming interfaces that are designed to be used\
    \ from within the Acrobat environment. It also provides a mechanism (known as\
    \ *JSObject*) that allows external clients to access the same functionality from\
    \ environments such as Visual Basic.\n\nThis document gives you the information\
    \ you need to get started using the extended functionality of JavaScript from\
    \ a Visual Basic programming environment. It provides a set of examples to illustrate\
    \ the key concepts.\n\n## What is JSObject?\n\nIn precise terms, JSObject is an\
    \ interpretation layer between an OLE Automation client such as a Visual Basic\
    \ application and the JavaScript functionality provided by Acrobat. From a programmer's\
    \ point of view, the end result is that programming JSObject from a Visual Basic\
    \ environment is quite similar to programming in JavaScript using the Acrobat\
    \ console.\n\n## Getting Started\n\nThe following steps get you set up to run\
    \ the examples:\n\n- 1. Install Acrobat 7.0 and Visual Basic .NET, since both\
    \ are required for the examples in this document.\n- 2. Open a new Visual Basic.NET\
    \ project. That gets you started with a blank form and project workspace.\n- 3.\
    \ To access the Acrobat Automation APIs, including JSObject, you need to add a\
    \ reference to Acrobat's type library. From the UI, select **Project > Add Reference**,\
    \ then the **COM** tab, and from the list of available references, click on the\
    \ item labeled \"Adobe Acrobat 7.0 Type Library.\" Click **Select**. Click **OK**.\n\
    \n# A Simple Example\n\n![图片](img/5df42d34636aad17a1b31a4ab6630e9b_3_0.png)\n\n\
    ## A Simple Example\n\nThis example describes the bare minimum required to display\
    \ “Hello, Acrobat!” in Acrobat's JavaScript console.\n\n- 1. Bring up the source\
    \ code window for this form by selecting **View > Code** from the UI.\n- 2. Select\
    \ (**Form1 Events**) from the selection box in the upper left corner of that window.\
    \ The selection box in the upper right shows all the functions available to the\
    \ Form object.\n- 3. Select **Load** from that box, which creates an empty function\
    \ stub. The Form's **Load** function is called when the Form is first displayed,\
    \ so it's a good place to add the initialization code.\n\nThis program uses some\
    \ global variables for data that are required for its lifetime, and initializes\
    \ them in the **Form1_Load** routine.\n\n**EXAMPLE 1  *“Hello, Acrobat!”***\n\n\
    ```\nDim gApp As Acrobat.CAcroApp\nDim gPDDoc As Acrobat.CAcroPDDoc\nDim jso As\
    \ Object\n\nPrivate Sub Form1_Load(ByVal sender As Object, ByVal e As System.EventArgs)\
    \ Handles MyBase.Load\n    Set gApp = CreateObject(\"AcroExch.App\")\n    Set\
    \ gPDDoc = CreateObject(\"AcroExch.PDDoc\")\n    If gPDDoc.Open(\"c:\\adobe.pdf\"\
    ) Then\n        Set jso = gPDDoc.GetJSObject\n        jso.console.Show\n     \
    \   jso.console.Clear\n        jso.console.println (\"Hello, Acrobat!\")\n   \
    \     gApp.Show\n    End If\nEnd Sub\n```\n\nNote that you need a file called\
    \ `adobe.pdf` at the root level of your C: drive.\n\nWith this code in place,\
    \ the Visual Basic program attaches to Acrobat's Automation interface using the\
    \ `CreateObject` call, then shows the main window using the App object's `Show`\
    \ command.\n\nYou may have a few questions after studying the code fragment. For\
    \ example, why is `jso` declared as an Object, while `gApp` and `gPDDoc` are declared\
    \ as types found in the Acrobat type library? Is there a real type for JSObject?\n\
    \nThe answer is no, JSObject does not appear in the type library, except in the\
    \ context of the `CAcroPDDoc.GetJSObject` call. The COM interface used to export\
    \ JavaScript functionality through JSObject is known as an IDispatch interface,\
    \ which in Visual Basic is more commonly known simply as an “Object” type. The\
    \ upshot of this is that the methods available to the programmer are not as well-defined\
    \ as we would like. For example, you might be surprised to learn that if you replace\
    \ the call to\n\n```\njso.console.clear\n```\n\nwith\n\n```\njso.ThisCantPossiblyCompileCanIt(\"\
    Yes it can!\")\n```\n\nthe compiler happily compiles the code, but fails rudely\
    \ at run time. Since Visual Basic has no type information for JSObject, Visual\
    \ Basic does not know if a particular call is even syntactically valid until runtime,\
    \ and will compile any function call to a JSObject. For that reason, the programmer\
    \ must rely on documentation to know what functionality is available through the\
    \ JSObject interface. The *Acrobat JavaScript Scripting Reference*, which is available\
    \ from http://partners.adobe.com/links/acrobat, is indispensable as you delve\
    \ deeper into the mysteries of JSObject.\n\nYou may also wonder why it is necessary\
    \ to open a PDDoc before creating a JSObject. Running the program shows that no\
    \ document appeared onscreen, and showing the JavaScript console should be possible\
    \ without a PDDoc in hand. The answer is that JSObject is designed to work closely\
    \ with a particular document, since most of the available features operate at\
    \ the document level. There are some application-level features in JavaScript\
    \ (and therefore in JSObject), but they are of secondary interest. In practice,\
    \ a JSObject is always associated with a particular document. When working with\
    \ a large number of documents, you must structure your code such that a new JSObject\
    \ is acquired for each document, rather than creating a single JSObject to work\
    \ on every document.\n\n# Working with Annotations\n\nThe next example is more\
    \ interesting: a program that allows the user to select a PDF, add a pre-defined\
    \ annotation, and save the file back to disk.\n\n- 1. Create a new Visual Basic.NET\
    \ project as you did in the first example; be sure to add the Adobe Acrobat 7.0\
    \ Type Library to this project as well.\n- 2. For this example you use the Windows\
    \ **File > Open** dialog, so select **Project > Add Component** from the UI. This\
    \ allows you to open the **Toolbox** on the left side of the development environment.\
    \ Select **Windows Forms** from the **Toolbox** and scroll down to and select\
    \ the **OpenFileDialog**. Drag it to your form.\n- 3. Use the same technique to\
    \ add a **Button** to your form."
