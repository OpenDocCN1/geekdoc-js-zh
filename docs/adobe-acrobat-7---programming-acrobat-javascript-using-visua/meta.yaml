  md: "**EXAMPLE 1  *“Hello, Acrobat!”***\n\n```\nDim gApp As Acrobat.CAcroApp\nDim\
    \ gPDDoc As Acrobat.CAcroPDDoc\nDim jso As Object\n\nPrivate Sub Form1_Load(ByVal\
    \ sender As Object, ByVal e As System.EventArgs) Handles MyBase.Load\n    Set\
    \ gApp = CreateObject(\"AcroExch.App\")\n    Set gPDDoc = CreateObject(\"AcroExch.PDDoc\"\
    )\n    If gPDDoc.Open(\"c:\\adobe.pdf\") Then\n        Set jso = gPDDoc.GetJSObject\n\
    \        jso.console.Show\n        jso.console.Clear\n        jso.console.println\
    \ (\"Hello, Acrobat!\")\n        gApp.Show\n    End If\nEnd Sub\n```\n\nNote that\
    \ you need a file called `adobe.pdf` at the root level of your C: drive.\n\nWith\
    \ this code in place, the Visual Basic program attaches to Acrobat's Automation\
    \ interface using the `CreateObject` call, then shows the main window using the\
    \ App object's `Show` command.\n\nYou may have a few questions after studying\
    \ the code fragment. For example, why is `jso` declared as an Object, while `gApp`\
    \ and `gPDDoc` are declared as types found in the Acrobat type library? Is there\
    \ a real type for JSObject?\n\nThe answer is no, JSObject does not appear in the\
    \ type library, except in the context of the `CAcroPDDoc.GetJSObject` call. The\
    \ COM interface used to export JavaScript functionality through JSObject is known\
    \ as an IDispatch interface, which in Visual Basic is more commonly known simply\
    \ as an “Object” type. The upshot of this is that the methods available to the\
    \ programmer are not as well-defined as we would like. For example, you might\
    \ be surprised to learn that if you replace the call to\n\n```\njso.console.clear\n\
    ```\n\nwith\n\n```\njso.ThisCantPossiblyCompileCanIt(\"Yes it can!\")\n```\n\n\
    the compiler happily compiles the code, but fails rudely at run time. Since Visual\
    \ Basic has no type information for JSObject, Visual Basic does not know if a\
    \ particular call is even syntactically valid until runtime, and will compile\
    \ any function call to a JSObject. For that reason, the programmer must rely on\
    \ documentation to know what functionality is available through the JSObject interface.\
    \ The *Acrobat JavaScript Scripting Reference*, which is available from http://partners.adobe.com/links/acrobat,\
    \ is indispensable as you delve deeper into the mysteries of JSObject.\n\nYou\
    \ may also wonder why it is necessary to open a PDDoc before creating a JSObject.\
    \ Running the program shows that no document appeared onscreen, and showing the\
    \ JavaScript console should be possible without a PDDoc in hand. The answer is\
    \ that JSObject is designed to work closely with a particular document, since\
    \ most of the available"
