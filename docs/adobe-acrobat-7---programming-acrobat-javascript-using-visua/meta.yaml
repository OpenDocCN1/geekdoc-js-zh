    # Programming Acrobat JavaScript Using Visual Basic


    # Working with Annotations


    features operate at the document level. There are some application-level features
    in JavaScript (and therefore in JSObject), but they are of secondary interest.
    In practice, a JSObject is always associated with a particular document. When
    working with a large number of documents, you must structure your code such that
    a new JSObject is acquired for each document, rather than creating a single JSObject
    to work on every document.


    # Working with Annotations


    The next example is more interesting: a program that allows the user to select
    a PDF, add a pre-defined annotation, and save the file back to disk.


    +   1. Create a new Visual Basic.NET project as you did in the first example;
    be sure to add the Adobe Acrobat 7.0 Type Library to this project as well.

    2. For this example you use the Windows **File > Open** dialog, so select **Project
    > Add Component** from the UI. This allows you to open the **Toolbox** on the
    left side of the development environment. Select **Windows Forms** from the **Toolbox**
    and scroll down to and select the **OpenFileDialog**. Drag it to your form.

    3. Use the same technique to add a **Button** to your form.'
- md: "# Programming Acrobat JavaScript Using Visual Basic\n\nWorking with Annotations\n\
    \n![](img/5df42d34636aad17a1b31a4ab6630e9b_6_0.png)\n\n4. Now that a minimal user\
    \ interface is set up, select **View > Code** from the main menu, and add the\
    \ following source code:\n\n*EXAMPLE 2* **Working with annotations**\n\n```vb\n\
    Dim gApp As Acrobat.CAcroApp\n\nPrivate Sub Form_Load()\n    Set gApp = CreateObject(\"\
    AcroExch.App\")\nEnd Sub\n\nPrivate Sub Form_Unload(Cancel As Integer)\n    If\
    \ Not gApp Is Nothing Then\n        gApp.Exit\n    End If\n    Set gApp = Nothing\n\
    End Sub\n\nPrivate Sub Command1_Click()\n    Dim pdDoc As Acrobat.CAcroPDDoc\n\
    \    Dim page As Acrobat.CAcroPDPage\n    Dim jso As Object\n    Dim path As String\n\
    \    Dim point(1) As Integer\n    Dim popupRect(3) As Integer\n    Dim pageRect\
    \ As Object\n    Dim annot As Object\n    Dim props As Object\n\n    OpenFileDialog1.ShowDialog()\n\
    \    path = OpenFileDialog1.FileName\n\n    Set pdDoc = CreateObject(\"AcroExch.PDDoc\"\
    )\n    If pdDoc.Open(path) Then\n        Set jso = pdDoc.GetJSObject\n       \
    \ If Not jso Is Nothing Then\n\n            ' Get size for page 0 and setup arrays\n\
    \            Set page = pdDoc.AcquirePage(0)\n            Set pageRect = page.GetSize\n\
    \            point(0) = 0\n            point(1) = pageRect.y\n            popupRect(0)\
    \ = 0\n            popupRect(1) = pageRect.y - 100\n            popupRect(2) =\
    \ 200\n            popupRect(3) = pageRect.y\n\n            ' Create a new text\
    \ annot\n            Set annot = jso.AddAnnot\n            Set props = annot.getProps\n\
    \            props.Type = \"Text\"\n            annot.setProps props\n\n     \
    \       ' Fill in a few fields\n            Set props = annot.getProps\n     \
    \       props.page = 0\n            props.point = point\n            props.popupRect\
    \ = popupRect\n            props.author = \"Rob McAfee\"\n            props.noteIcon\
    \ = \"Comment\"\n            props.strokeColor = jso.Color.red\n            props.Contents\
    \ = \"I added this comment from Visual Basic!\"\n            annot.setProps props\n\
    \        End If\n        pdDoc.Close\n        MsgBox \"Annotation added to \"\
    \ & path\n    Else\n        MsgBox \"Failed to open \" & path\n    End If\n\n\
    \    Set pdDoc = Nothing\nEnd Sub\n```\n\nThe code in the **Form_Load** and **Form_Unload**\
    \ routines simply initializes and shuts down the main Acrobat Automation interface.\
    \ All the interesting work happens in the Command button's click routine. The\
    \ first few lines declare local variables and show the Windows **Open** dialog,\
    \ which allows the user to select a file to annotate. At that point, the code\
    \ opens the PDF's **PDDoc** object, and obtains a JSObject interface to that document.\n\
    \nSome standard Acrobat Automation methods are used to determine the size of the\
    \ first page in the document. These numbers are critical to achieving the correct\
    \ layout, because the PDF coordinate system is based in the lower-left corner\
    \ of the page, but the annotation will be anchored at the upper left corner of\
    \ the page.\n\nThe lines following the \"**Create a new text annot**\" comment\
    \ do exactly that, but this block of code bears additional explanation. First\
    \ of all, **addAnnot** looks as if it were a method of JSObject, but the JavaScript\
    \ reference shows that the method is associated with the **doc** object. In that\
    \ case, you might expect the syntax to be **jso.doc.addAnnot** — however, **jso**\
    \ is the **Doc** object, so **jso.addAnnot** is correct. All of the properties\
    \ and methods in the **Doc** object are used in this manner.\n\nThe second item\
    \ of note is the use of **annot.getProps** and **annot.setProps**. The Annot object\
    \ is implemented with a separate properties object, meaning that you cannot set\
    \ the properties directly. For example, you cannot do the following:\n\n```vb\n\
    Set annot = jso.AddAnnot\nannot.Type = \"Text\"\nannot.page = 0\n...\n```\n\n\
    Instead, you must obtain the Annot's properties object using **annot.getProps**,\
    \ and use that object for read or write access. To save changes back to the original\
    \ **Annot**, call **annot.setProps** with the modified properties object, as in\
    \ the original example.\n\nFinally, note the use of JSObject's color property.\
    \ This object defines several simple colors such as red, green, and blue. In working\
    \ with colors, you may need a greater range of colors than is available through\
    \ this object. Also, there is a performance hit associated with every call to\
    \ JSObject. To set colors more efficiently, you can use code such as the following,\
    \ which sets the annot's **strokeColor** to red directly, bypassing the color\
    \ object.\n\n```vb\ndim color(0 to 3) as Variant\ncolor(0) = \"RGB\"\ncolor(1)\
    \ = 1#\ncolor(2) = 0#\ncolor(3) = 0#\nannot.strokeColor = color\n```\n\nYou can\
    \ use this technique anywhere a color array is needed as a parameter to a JSObject\
    \ routine. The example sets the colorspace to RGB, and specifies floating point\
    \ values ranging from 0 to 1 for red, green, and blue. Note the use of the # character\
    \ following the color values. These are required, since they tell Visual Basic\
    \ that the array element should be set to a floating point value, rather than\
    \ an integer. It is also important to declare the array as containing Variants,\
    \ since it contains both strings and floating point values. The other color spaces\
    \ (\"T\", \"G\", \"CMYK\") have varying requirements for array length. Refer to\
    \ the **Color** object in the *Acrobat JavaScript Scripting Reference* for more\
    \ details.\n\n## Spell-Checking a Document\n\nAcrobat 7.0 includes a plug-in that\
    \ can scan a document for spelling errors. This plug-in also provides JavaScript\
    \ methods that can be accessed using a JSObject. In this example, you'll start\
    \ with the source code from [Example 2], and make the following changes:\n\n-\
    \ Add a List View control to the main form. Keep the default name **List1** for\
    \ the control.\n- Replace the code in the existing **Command1_Click** routine\
    \ with the following:\n\n*EXAMPLE 3* **Spell-checking a document**\n\n```vb\n\
    Private Sub Command1_Click()\n    Dim pdDoc As Acrobat.CAcroPDDoc\n    Dim jso\
    \ As Object\n    Dim path As String\n    Dim count As Integer\n    Dim i As Integer,\
    \ j As Integer\n    Dim word As Variant\n    Dim result As Variant\n    Dim foundErr\
    \ As Boolean\n\n    OpenFileDialog1.ShowDialog()\n    path = OpenFileDialog1.FileName\n\
    \    foundErr = False\n    Set pdDoc = CreateObject(\"AcroExch.PDDoc\")\n\n  \
    \  If pdDoc.Open(path) Then\n        Set jso = pdDoc.GetJSObject\n        If Not\
    \ jso Is Nothing Then\n            count = jso.getPageNumWords(0)\n          \
    \  For i = 0 To count - 1\n                word = jso.getPageNthWord(0, i)\n \
    \               If VarType(word) = vbString Then\n                    result =\
    \ jso.spell.checkWord(word)\n                    If IsArray(result) Then\n   \
    \                     foundErr = True\n                        ListView1.Items.Add\
    \ (word & \" is misspelled.\")\n                        ListView1.Items.Add (\"\
    Suggestions:\")\n                        For j = LBound(result) To UBound(result)\n\
    \                            ListView1.Items.Add (result(j))\n               \
    \         Next j\n                        ListView1.Items.Add (\"\")\n       \
    \             End If\n                End If\n            Next i\n           \
    \ Set jso = Nothing\n            pdDoc.Close\n\n            If Not foundErr Then\n\
    \                ListView1.Items.Add (\"No spelling errors found in \" & path)\n\
    \            End If\n        End If\n    Else\n        MsgBox \"Failed to open\
    \ \" & path\n    End If\n\n    Set pdDoc = Nothing\nEnd Sub\n```\n\nIn this example,\
    \ note the use of the Spell object's **check** method. According to the *Acrobat\
    \ JavaScript Scripting Reference*, this method takes a word as input, and returns\
    \ a null object if the word is found in the dictionary, or an array of suggested\
    \ words if the word is not found. As always, the safest approach when storing\
    \ the return value of a JSObject method call is to use a Variant. You can use\
    \ the **IsArray** function to determine if the Variant is an array, and act accordingly.\
    \ In this simple example, if the program sees an array of suggested words, it\
    \ dumps them out to the **ListView** control.\n\n## Tips on Translating JavaScript\
    \ to JSObject\n\nCovering every method available to JSObject is beyond the scope\
    \ of this document. However, the *Acrobat JavaScript Scripting Reference* covers\
    \ the subject in detail, and much can be inferred from the reference by keeping\
    \ a few basic facts in mind:\n\n- Most of the objects and methods in the reference\
    \ are available in Visual Basic, but not all. In particular, any JavaScript object\
    \ that requires the `new` operator for construction cannot be created in Visual\
    \ Basic. This includes the `Report` object.\n- The `Annots` object is unusual\
    \ in that it requires JSObject to set and get its properties as a separate object\
    \ using the `getProps` and `setProps` methods.\n- If you are unsure what type\
    \ to use to declare a variable, declare it as a Variant. This gives Visual Basic\
    \ more flexibility for type conversion, and helps prevent runtime errors.\n- JSObject\
    \ cannot add new properties, methods, or objects to JavaScript. Due to this limitation,\
    \ the `global.setPersistent` property is not meaningful.\n- JSObject is case-insensitive.\
    \ Visual Basic often capitalizes leading characters of an identifier and prevents\
    \ you from changing its case. Don't be concerned about this, since JSObject ignores\
    \ case when matching the identifier to its JavaScript equivalent.\n- JSObject\
    \ always returns values as Variants. This includes property gets as well as return\
    \ values from method calls. An empty Variant is used when a null return value\
    \ is expected. When JSObject returns an array, each element in the array is a\
    \ Variant. To determine the actual data type of a Variant, use the utility functions\
    \ `IsArray`, `IsNumeric`, `IsEmpty`, `IsObject`, and `VarType` from the Information\
    \ module of the VBA library.\n- JSObject can process most elemental Visual Basic\
    \ types for property puts and input parameters to method calls, including Variant,\
    \ Array, Boolean, String, Date, Double, Long, Integer, and Byte. JSObject can\
    \ accept Object parameters, but only when the Object was the result of a property\
    \ get or method call to a JSObject. JSObject fails to accept values of type Error\
    \ and Currency."
