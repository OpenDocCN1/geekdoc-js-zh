    \ Visual Basic 数组元素应设置为浮点值，而不是整数。将数组声明为包含 Variants 也很重要，因为它同时包含字符串和浮点值。其他颜色空间（“T”、“G”、“CMYK”）对数组长度有不同的要求。有关更多详细信息，请参阅\
