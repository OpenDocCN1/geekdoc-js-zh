    \ Adobe Systems Incorporated 创建或授权的 PostScript 技术的打印设备、显示设备或物品（分别），而非指仅声称与 PostScript\
    \ 语言兼容的设备或物品。\n\nAdobe、Adobe 徽标、Acrobat、Acrobat 徽标、Acrobat Capture、Distiller、PostScript、PostScript\
    \ 徽标和 Reader 是 Adobe Systems Incorporated 在美国和/或其他国家的注册商标或商标。\n\nApple、Macintosh\
    \ 和 Power Macintosh 是 Apple Computer, Inc. 的商标，在美国和其他国家注册。PowerPC 是 IBM Corporation\
    \ 在美国的注册商标。ActiveX、Microsoft、Windows 和 Windows NT 是 Microsoft Corporation 在美国和/或其他国家的注册商标或商标。Verity\
    \ 是 Verity, Incorporated 的注册商标。UNIX 是 The Open Group 的注册商标。Verity 是 Verity, Inc.\
    \ 的商标。Lextek 是 Lextek International 的商标。所有其他商标为其各自所有者的财产。\n\n本出版物及其中的信息按“原样”提供，如有更改恕不另行通知，且不应被解释为\
    \ Adobe Systems Incorporated 的承诺。Adobe Systems Incorporated 对任何错误或不准确之处不承担任何责任或义务，不对本出版物提供任何类型的保证（明示、暗示或法定），并明确排除所有关于适销性、特定用途适用性和不侵犯第三方权利的保证。\n\
    \n# 使用 Visual Basic 编程 Acrobat JavaScript\n\nAcrobat 7.0 提供了一套丰富的 JavaScript 编程接口，旨在从\
    \ Acrobat 环境中使用。它还提供了一种机制（称为 *JSObject*），允许外部客户端从 Visual Basic 等环境中访问相同的功能。\n\n\
    本文档提供了您需要的信息，以便开始从 Visual Basic 编程环境中使用 JavaScript 的扩展功能。它提供了一组示例来说明关键概念。\n\n\
    ## 什么是 JSObject？\n\n准确地说，JSObject 是在 OLE 自动化客户端（如 Visual Basic 应用程序）与 Acrobat\
    \ 提供的 JavaScript 功能之间的一个解释层。从程序员的角度来看，最终结果是从 Visual Basic 环境中对 JSObject 进行编程，与使用\
    \ Acrobat 控制台在 JavaScript 中编程非常相似。\n\n## 入门\n\n以下步骤将帮助您设置运行示例：\n\n- 1. 安装 Acrobat\
    \ 7.0 和 Visual Basic .NET，因为本文档中的示例需要两者。\n- 2. 打开一个新的 Visual Basic .NET 项目。这将使您从一个空白窗体和项目工作区开始。\n\
    - 3. 要访问 Acrobat 自动化 API（包括 JSObject），您需要添加对 Acrobat 类型库的引用。在用户界面中，选择 **项目 > 添加引用**，然后选择\
    \ **COM** 选项卡，从可用引用列表中，单击标记为“Adobe Acrobat 7.0 Type Library”的项目。单击 **选择**。单击 **确定**。\n\
    \n# 一个简单的示例\n\n![图片](img/5df42d34636aad17a1b31a4ab6630e9b_3_0.png)\n\n## 一个简单的示例\n\
    \n此示例描述了在 Acrobat 的 JavaScript 控制台中显示“Hello, Acrobat!”所需的最低要求。\n\n- 1. 通过从用户界面选择\
    \ **视图 > 代码** 来打开此窗体的源代码窗口。\n- 2. 从该窗口左上角的下拉框中选择 **(Form1 Events)**。右上角的下拉框显示了\
    \ Form 对象可用的所有函数。\n- 3. 从该框中选择 **Load**，这将创建一个空的函数存根。当窗体首次显示时，会调用窗体的 **Load**\
    \ 函数，因此它是添加初始化代码的好地方。\n\n此程序使用一些全局变量来存储其生命周期所需的数据，并在 **Form1_Load** 例程中初始化它们。\n\
    \n**示例 1 *“Hello, Acrobat!”***\n\n```\nDim gApp As Acrobat.CAcroApp\nDim gPDDoc\
    \ As Acrobat.CAcroPDDoc\nDim jso As Object\n\nPrivate Sub Form1_Load(ByVal sender\
    \ As Object, ByVal e As System.EventArgs) Handles MyBase.Load\n    Set gApp =\
    \ CreateObject(\"AcroExch.App\")\n    Set gPDDoc = CreateObject(\"AcroExch.PDDoc\"\
    )\n    If gPDDoc.Open(\"c:\\adobe.pdf\") Then\n        Set jso = gPDDoc.GetJSObject\n\
    \        jso.console.Show\n        jso.console.Clear\n        jso.console.println\
    \ (\"Hello, Acrobat!\")\n        gApp.Show\n    End If\nEnd Sub\n```\n\n请注意，您需要在\
    \ C: 驱动器的根目录下有一个名为 `adobe.pdf` 的文件。\n\n有了这段代码，Visual Basic 程序使用 `CreateObject`\
    \ 调用连接到 Acrobat 的自动化接口，然后使用 App 对象的 `Show` 命令显示主窗口。\n\n研究完代码片段后，您可能有几个问题。例如，为什么\
    \ `jso` 声明为 Object，而 `gApp` 和 `gPDDoc` 声明为在 Acrobat 类型库中找到的类型？JSObject 是否有真正的类型？\n\
    \n答案是否定的，除了在 `CAcroPDDoc.GetJSObject` 调用的上下文中，JSObject 不会出现在类型库中。用于通过 JSObject\
    \ 导出 JavaScript 功能的 COM 接口称为 IDispatch 接口，在 Visual Basic 中通常简称为“对象”类型。由此得出的结果是，程序员可用的方法并不像我们希望的那样定义良好。例如，您可能会惊讶地发现，如果将对\n\
    \n```\njso.console.clear\n```\n\n的调用替换为\n\n```\njso.ThisCantPossiblyCompileCanIt(\"\
    Yes it can!\")\n```\n\n编译器会愉快地编译代码，但在运行时会粗暴地失败。由于 Visual Basic 没有 JSObject 的类型信息，Visual\
    \ Basic 不知道特定的调用在语法上是否有效，直到运行时才会知道，并且会编译对 JSObject 的任何函数调用。因此，程序员必须依赖文档来了解通过 JSObject\
    \ 接口可用哪些功能。当您深入研究 JSObject 的奥秘时，可从 http://partners.adobe.com/links/acrobat 获取的\
    \ *Acrobat JavaScript Scripting Reference* 是不可或缺的。\n\n您可能还会想知道为什么在创建 JSObject\
    \ 之前需要打开一个 PDDoc。运行程序后，屏幕上没有出现任何文档，并且在没有 PDDoc 的情况下显示 JavaScript 控制台应该是可能的。答案是\
    \ JSObject 被设计为与特定文档紧密工作，因为大多数可用功能都在文档级别操作。JavaScript（因此在 JSObject 中）中有一些应用程序级别的功能，但它们是次要的。在实践中，JSObject\
    \ 始终与特定文档相关联。当处理大量文档时，您必须构建代码，以便为每个文档获取一个新的 JSObject，而不是创建一个单一的 JSObject 来处理每个文档。\n\
    \n# 使用注释\n\n下一个示例更有趣：一个允许用户选择 PDF、添加预定义注释并将文件保存回磁盘的程序。\n\n- 1. 像在第一个示例中那样创建一个新的\
    \ Visual Basic .NET 项目；确保也将 Adobe Acrobat 7.0 Type Library 添加到此项目中。\n- 2. 对于此示例，您使用\
    \ Windows **文件 > 打开** 对话框，因此从用户界面选择 **项目 > 添加组件**。这允许您在开发环境的左侧打开 **工具箱**。从 **工具箱**\
    \ 中选择 **Windows 窗体**，向下滚动并选择 **OpenFileDialog**。将其拖到您的窗体上。\n- 3. 使用相同的技术将 **Button**\
    \ 添加到您的窗体。\n"
