    \n# 使用 Visual Basic 编程 Acrobat JavaScript\n\n2004年10月19日\n\n![图片](img/5df42d34636aad17a1b31a4ab6630e9b_0_1.png)\n\
    \n![图片](img/5df42d34636aad17a1b31a4ab6630e9b_1_0.png)\n\n版权所有 2004 Adobe Systems\
    \ Incorporated。保留所有权利。\n\n注意：本文档中包含的所有信息均为 Adobe Systems Incorporated 的财产。未经 Adobe\
    \ Systems Incorporated 事先书面同意，不得以任何形式或任何方式（电子、机械、影印、录制或其他方式）复制或传播本出版物的任何部分（无论硬拷贝还是电子形式）。\n\
    \nPostScript 是 Adobe Systems Incorporated 的注册商标。文本中所有出现的 PostScript 名称均指由 Adobe\
    \ Systems Incorporated 定义的 PostScript 语言，除非另有说明。PostScript 名称也用作 Adobe Systems\
