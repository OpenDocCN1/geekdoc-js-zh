- md: "# Adobe Acrobat 7.0\n\n![图片](img/5df42d34636aad17a1b31a4ab6630e9b_0_0.png)\n\
    \n# Programming Acrobat JavaScript Using Visual Basic\n\nOctober 19, 2004\n\n\
    ![图片](img/5df42d34636aad17a1b31a4ab6630e9b_0_1.png)\n\n![图片](img/5df42d34636aad17a1b31a4ab6630e9b_1_0.png)\n\
