  \n1. 对分数 {50, 65, 99, 87, 74, 63, 76, 100} 进行归并排序\n\n![](img/Image00091.jpg)\n\n\
  使用记事本创建 `TestMergeSort.html`\n\n```html\n<script type = \"text/javascript\" >\n\
  \    class MergeSort {\n        sort ( array ) {\n            var temp = new Array\
  \ ( array.length );\n            this.mergeSort ( array , temp , 0 , array.length\
  \ - 1 );\n        }\n        mergeSort ( array , temp , left , right ) {\n     \
  \       if ( left < right ) {\n                var center = parseInt (( left + right\
  \ ) / 2 );\n                this.mergeSort ( array , temp , left , center ); //\
  \ 左半部分归并排序\n                this.mergeSort ( array , temp , center + 1 , right );\
  \ // 右半部分归并排序\n                this.merge ( array , temp , left , center + 1 , right\
  \ ); // 合并两个有序数组\n            }\n        }\n        /**\n         将两个有序列表合并成一个有序列表\n\
  \         temp : 临时数组\n         left :    左侧起始下标\n         right :  右侧起始下标\n   \
  \      rightEndIndex : 右侧结束下标\n         */\n        merge ( array , temp , left\
  \ , right , rightEndIndex ) {\n            var leftEndIndex = right - 1 ; // 左侧结束下标\n\
  \            var tempIndex = left ; // 从左侧开始计数\n            var elementNumber =\
  \ rightEndIndex - left + 1 ;\n            while ( left <= leftEndIndex && right\
  \ <= rightEndIndex ) {\n                if ( array [ left ] <= array [ right ])\n\
  \                    temp [ tempIndex ++] = array [ left ++];\n                else\n\
  \                    temp [ tempIndex ++] = array [ right ++];\n            }\n\
  \            while ( left <= leftEndIndex ) { // 如果左侧还有元素\n                temp\
  \ [ tempIndex ++] = array [ left ++];\n            }\n            while ( right\
  \ <= rightEndIndex ) { // 如果右侧还有元素\n                temp [ tempIndex ++] = array\
  \ [ right ++];\n            }\n            // 将 temp 复制回 array\n            for\
  \ ( var i = 0 ; i < elementNumber ; i ++) {\n                array [ rightEndIndex\
  \ ] = temp [ rightEndIndex ];\n                rightEndIndex --;\n            }\n\
  \        }\n    }\n    //////////////////////测试////////////////////\n    var scores\
  \ = [ 50 , 65 , 99 , 87 , 74 , 63 , 76 , 100 , 92 ];\n    var mergeSort = new MergeSort\
  \ ();\n    mergeSort.sort ( scores );\n    for ( var i = 0 ; i < scores.length ;\
  \ i ++) {\n        document.write ( scores [ i ] + \",\" );\n    }\n</script>\n\
  ```\n\n结果：\n\n![](img/Image00092.jpg)\n\n## 快速排序算法\n\n快速排序算法：\n\n将数组分成两个子数组，然后递归调用自身，对子数组进行快速排序，直至结束。\n\
  \n1. 对分数 {90, 60, 50, 80, 70, 100} 进行快速排序\n\n![](img/Image00093.jpg)\n\n![](img/Image00094.jpg)\n\
  \n![](img/Image00095.jpg)\n\n![](img/Image00096.jpg)\n\n使用记事本创建 `TestQuickSort.html`\n\
  \n```html\n<script type = \"text/javascript\" >\n    class QuickSort {\n       \
  \ sort ( array ) {\n            if ( array.length > 0 ) {\n                this.quickSort\
  \ ( array , 0 , array.length - 1 );\n            }\n        }\n        quickSort\
  \ ( array , low , high ) {\n            if ( low > high ) {\n                return\
  \ ;\n            }\n            var i = low ;\n            var j = high ;\n    \
  \        var threshold = array [ low ];\n            // 从列表两端交替扫描\n            while\
  \ ( i < j ) {\n                // 从右向左找到第一个小于阈值的位置\n                while ( i <\
  \ j && array [ j ] > threshold ) {\n                    j --;\n                }\n\
  \                // 将比阈值小的数替换到低位\n                if ( i < j )\n               \
  \     array [ i ++] = array [ j ];\n                // 从左向右找到第一个大于阈值的位置\n      \
  \          while ( i < j && array [ i ] <= threshold ) {\n                    i\
  \ ++;\n                }\n                // 将比阈值大的数替换到高位\n                if (\
  \ i < j )\n                    array [ j --] = array [ i ];\n            }\n   \
  \         array [ i ] = threshold ;\n            // 左侧快速排序\n            this.quickSort\
  \ ( array , low , i - 1 );\n            // 右侧快速排序\n            this.quickSort (\
  \ array , i + 1 , high );\n        }\n    }\n    //////////////////////测试////////////////////\n\
  \    var scores = [ 90 , 60 , 50 , 80 , 70 , 100 ];\n    var quickSort = new QuickSort\
  \ ();\n    quickSort.sort ( scores );\n    for ( var i = 0 ; i < scores.length ;\
  \ i ++) {\n        document.write ( scores [ i ] + \",\" );\n    }\n</script>\n\
