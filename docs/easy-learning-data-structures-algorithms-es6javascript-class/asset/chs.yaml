  \n结果：\n\n![](img/Image00041.jpg)\n\n## 双向链表\n\n双向链表：\n\n它是线性表的一种链式存储结构，由节点在两个方向上连接而成。每个节点由数据、指向前一个节点的指针和指向后一个节点的指针组成。\n\
  \n![](img/Image00042.jpg)\n\n### UML 图\n\n![](img/Image00043.jpg)\n\n```javascript\n\
  \    class Node {\n\n        constructor ( data , prev , next ){\n\n           \
  \ this.data = data ;\n\n            this.prev = prev ;\n\n            this.next\
  \ = next ;\n\n        }\n\n        getData (){\n\n            return this.data ;\n\
  \n        }\n\n    }\n```\n\n### 1. 双向链表初始化\n\n示例：构建一个旧金山地铁双向链表\n\n![](img/Image00044.jpg)\n\
  \n### 2. 用记事本创建 `TestDoubleLink.html`\n\n```javascript\n<script type = \"text/javascript\"\
  \ >\n\n    class Node {\n\n        constructor ( data , prev , next ){\n\n     \
  \       this.data = data ;\n\n            this.prev = prev ;\n\n            this.next\
  \ = next ;\n\n        }\n\n        getData (){\n\n            return this.data ;\n\
  \n        }\n\n    }\n\n    class DoubleLinkList {\n\n        init () {\n\n    \
  \        this.head = new Node ( \"San Francisco\" );\n\n            this.head.prev\
  \ = null ;\n\n            this.head.next = null ;\n\n            var nodeOakland\
  \ = new Node ( \"Oakland\" );\n\n            nodeOakland.prev = this.head ;\n\n\
  \            nodeOakland.next = null ;\n\n            this.head.next = nodeOakland\
  \ ;\n\n            var nodeBerkeley = new Node ( \"Berkeley\" );\n\n           \
  \ nodeBerkeley.prev = nodeOakland ;\n\n            nodeBerkeley.next = null ;\n\n\
  \            nodeOakland.next = nodeBerkeley ;\n\n            this.tail = new Node\
  \ ( \"Fremont\" );\n\n            this.tail.prev = nodeBerkeley ;\n\n          \
  \  this.tail.next = null ;\n\n            nodeBerkeley.next = this.tail ;\n\n  \
  \          return this.head ;\n\n        }\n\n        print ( node ) {\n\n     \
  \       var p = node ;\n\n            var end = null ;\n\n            while ( p\
  \ != null )\n\n            {\n\n                var data = p.getData ();\n\n   \
  \             document.write ( data + \" -> \" );\n\n                end = p ;\n\
  \n                p = p.next ;\n\n            }\n\n            document.write (\
  \ \"End <br><br>\" );\n\n            p = end ;\n\n            while ( p != null\
  \ )\n\n            {\n\n                var data = p.getData ();\n\n           \
  \     document.write ( data + \" -> \" );\n\n                p = p.prev ;\n\n  \
  \          }\n\n            document.write ( \"Start<br><br>\" );\n\n        }\n\
  \n    }\n\n    //////////////////////testing////////////////////\n\n    var doubleLinkList\
  \ = new DoubleLinkList ();\n\n    var head = doubleLinkList.init ();\n\n    doubleLinkList.print\
  \ ( head );\n\n</script>\n```\n\n结果：\n\n![](img/Image00045.jpg)\n\n### 3. 在 Fremont\
  \ 末尾添加一个节点 Walnut。\n\n![](img/Image00046.jpg)\n\n用记事本创建 `TestDoubleLinkAdd.html`\n\
