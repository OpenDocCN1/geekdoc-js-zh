  \n```javascript\n<script type = \"text/javascript\" >\n\n    class HeapSort {\n\n\
          constructor (){\n\n            this.array = [];\n\n        }\n\n       \
  \ //Initialize the heap\n\n        createHeap ( array ) {\n\n            this.array\
  \ = array ;\n\n            // Build a heap, (array.length - 1) / 2 scan half of\
  \ the nodes with child nodes\n\n            for ( var i = ( array.length - 1 ) /\
  \ 2 ; i >= 0 ; i --) {\n\n                this.adjustHeap ( i , array.length - 1\
  \ );\n\n            }\n\n        }\n\n        //Adjustment heap\n\n        adjustHeap\
  \ ( currentIndex , maxLength ) {\n\n            var noLeafValue = this.array [ currentIndex\
  \ ]; // Current non-leaf node\n\n            //2 * currentIndex + 1  Current left\
  \ subtree subscript\n\n            for ( var j = 2 * currentIndex + 1 ; j <= maxLength\
  \ ; j = currentIndex * 2 + 1 ) {\n\n                if ( j < maxLength && this.array\
  \ [ j ] < this.array [ j + 1 ]) {\n\n                    j ++; // j Large subscript\n\
  \n                }\n\n                if ( noLeafValue >= this.array [ j ]) {\n\
  \n                    break ;\n\n                }\n\n                this.array\
  \ [ currentIndex ] = this.array [ j ]; // Move up to the parent node\n\n               \
  \ currentIndex = j ;\n\n            }\n\n            this.array [ currentIndex ]\
  \ = noLeafValue ; // To put in the position\n\n        }\n\n        heapSort ()\
  \ {\n\n            for ( var i = this.array.length - 1 ; i > 0 ; i --) {\n\n               \
  \ var temp = this.array [ 0 ];\n\n                this.array [ 0 ] = this.array\
  \ [ i ];\n\n                this.array [ i ] = temp ;\n\n                this.adjustHeap\
  \ ( 0 , i - 1 );\n\n            }\n\n        }\n\n    }\n\n    //////////////////////testing////////////////////\n\
  \n    var heapSort = new HeapSort ();\n\n    var scores = [ 10 , 90 , 20 , 80 ,\
