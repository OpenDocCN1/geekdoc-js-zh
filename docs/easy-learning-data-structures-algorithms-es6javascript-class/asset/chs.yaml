  小顶堆：`ki <= k2i` 且 `ki <= k2i+1`\n\n大顶堆：`ki >= k2i` 且 `ki >= k2i+1`\n\n父节点下标 = `(i-1)/2`\n\
  \n左子节点下标 = `2*i+1`\n\n\n\n\n右子节点下标 = `2*i+2`\n\n## 堆排序过程\n\n1. 构建堆\n2. 输出堆顶元素后，从上到下调整，将堆顶元素与其左右子树的根节点比较，将最小的元素交换到堆顶；然后不断调整直到叶子节点，得到新堆。\n\
