  \n*   电子书搜索下载\n*   电子书打包资源分享\n*   学习资源分享\n\n## 冒泡排序算法\n\n冒泡排序算法：比较前两个元素，如果前一个元素大于后一个元素，则交换位置。重复此过程，直到排序完成。\n\
  \n将以下数字从小到大排序\n\n![](img/Image00001.jpg)\n\n说明：\n\n![](img/Image00002.jpg) 未排序，![](img/Image00003.jpg)\
  \ 比较中，![](img/Image00004.jpg) 已排序\n\n1. 第一次排序：\n\n![](img/Image00005.jpg)\n\n2.\
  \ 第二次排序：\n\n![](img/Image00006.jpg)\n\n3. 第三次排序：\n\n![](img/Image00007.jpg)\n\n\
  4、5 以此类推：我们可以得到最终从小到大的排序数字\n\n![](img/Image00008.jpg)\n\n1. 使用记事本创建一个 `TestBubbleSort.html`\
  \ 文件，并在浏览器中打开它。\n\n```javascript\n<script type = \"text/javascript\" >\n    class\
  \ BubbleSort {\n        static sort ( arrays ) {\n            for ( var i = 0 ;\
  \ i < arrays.length - 1 ; i ++) {\n                for ( var j = 0 ; j < arrays.length\
  \ - 1 ; j ++) {\n                    //swap\n                    if ( arrays [ j\
  \ ] > arrays [ j + 1 ]) {\n                        var flag = arrays [ j ];\n  \
  \                      arrays [ j ] = arrays [ j + 1 ];\n                      \
  \  arrays [ j + 1 ] = flag ;\n                    }\n                }\n       \
  \     }\n        }\n    }\n    //////////////////////testing////////////////////\n\
  \    var scores = [ 90 , 70 , 50 , 80 , 60 , 85 ];\n    BubbleSort.sort ( scores\
  \ );\n    for ( var i = 0 ; i < scores.length ; i ++) {\n        document.write\
  \ ( scores [ i ] + \",\" );\n    }\n</script>\n```\n\n结果：\n\n![](img/Image00009.jpg)\n\
  \n## 选择排序算法\n\n选择排序算法：从数组中剩余的无序元素中选择最小的一个，插入到已排序序列的前面。\n\n将以下数字从小到大排序\n\n![](img/Image00010.jpg)\n\
  \n说明：\n\n![](img/Image00002.jpg) 未排序，![](img/Image00003.jpg) 比较中，![](img/Image00004.jpg)\
  \ 已排序\n\n1. 第一次排序：\n\n![](img/Image00011.jpg)\n\n![](img/Image00012.jpg)\n\n2. 第二次排序：\n\
  \n![](img/Image00013.jpg)\n\n![](img/Image00014.jpg)\n\n3. 第三次排序：\n\n![](img/Image00015.jpg)\n\
  \n![](img/Image00016.jpg)\n\n4. 第四次排序：\n\n![](img/Image00017.jpg)\n\n5. 第五次排序：\n\
  \n![](img/Image00018.jpg)\n\n1. 使用记事本创建一个 `TestSelectSort.html` 文件，并在浏览器中打开它。\n\n\
  ```javascript\n<script type = \"text/javascript\" >\n    class SelectSort {\n  \
  \      static sort ( arrays ) {\n            var len = arrays.length - 1 ;\n   \
  \         var minIndex ; // Save the index of the selected minimum\n           \
  \ for ( var i = 0 ; i < len ; i ++) {\n                minIndex = i ;\n        \
  \        //Save the minimum value of each loop as the first element\n          \
  \      var minValue = arrays [ minIndex ];\n                for ( var j = i ; j\
  \ < len ; j ++) {\n                    // Compare with each element if it is less\
  \ than the minimum value, exchange the minIndex\n                    if ( minValue\
  \ > arrays [ j + 1 ]) {\n                        minValue = arrays [ j + 1 ];\n\
  \                        minIndex = j + 1 ;\n                    }\n           \
  \     }\n                //if the minimum index changes, the current minimum is\
  \ exchanged with the minIndex\n                if ( i != minIndex ){\n         \
  \           var temp = arrays [ i ];\n                    arrays [ i ] = arrays\
  \ [ minIndex ];\n                    arrays [ minIndex ] = temp ;\n            \
  \    }\n            }\n        }\n    }\n    //////////////////////testing////////////////////\n\
  \    var scores = [ 90 , 70 , 50 , 80 , 60 , 85 ];\n    SelectSort.sort ( scores\
  \ );\n    for ( var i = 0 ; i < scores.length ; i ++) {\n        document.write\
  \ ( scores [ i ] + \",\" );\n    }\n</script>\n```\n\n结果：\n\n![](img/Image00019.jpg)\n\
  \n## 插入排序算法\n\n插入排序算法：从数组中取出一个未排序的新元素，与前面已排序的元素进行比较，如果新元素小于已排序元素，则将新元素插入到其右侧。\n\n\
  将以下数字从小到大排序\n\n![](img/Image00010.jpg)\n\n说明：\n\n\n\n\n\n![](img/Image00002.jpg)\
  \ 未排序的元素，![](img/Image00003.jpg) 插入元素，![](img/Image00004.jpg) 已排序的元素\n\n1. 第一次排序：\n\
  \n![](img/Image00020.jpg)\n\n2. 第二次排序：\n\n![](img/Image00021.jpg)\n\n3. 第三次排序：\n\
  \n![](img/Image00022.jpg)\n\n4. 第四次排序：\n\n![](img/Image00023.jpg)\n\n5. 第五次排序：\n\
  \n![](img/Image00024.jpg)\n\n1. 使用记事本创建一个 `TestInsertSort.html` 文件，并在浏览器中打开。\n\n\
  ```javascript\n<script type = \"text/javascript\" >\n\n    class InsertSort {\n\n\
          static sort ( arrays ) {\n\n            for ( var i = 0 ; i < arrays.length\
  \ ; i ++) {\n\n                var insertElement = arrays [ i ]; //取未排序的新元素\n\n\
                  var insertPosition = i ; //插入位置\n\n                for ( var j =\
  \ insertPosition - 1 ; j >= 0 ; j --) {\n\n                    //如果新元素小于已排序元素，则右移\n\
  \n                    if ( insertElement < arrays [ j ]) {\n\n                       \
  \ arrays [ j + 1 ] = arrays [ j ];\n\n                        insertPosition --;\n\
  \n                    }\n\n                }\n\n                arrays [ insertPosition\
  \ ] = insertElement ; //插入新元素\n\n            }\n\n        }\n\n    }\n\n    //////////////////////测试////////////////////\n\
  \n    var scores = [ 90 , 70 , 50 , 80 , 60 , 85 ];\n\n    InsertSort.sort ( scores\
  \ );\n\n    for ( var i = 0 ; i < scores.length ; i ++) {\n\n        document.write\
  \ ( scores [ i ] + \",\" );\n\n    }\n\n</script>\n```\n\n结果：\n\n![](img/Image00025.jpg)\n\
  \n## 二分查找\n\n从已排序的数组中查找给定值的索引位置。\n\n1. 初始化最低索引 `low=0`，最高索引 `high=scores.length-1`\n\
  2. 找到中间索引 `mid=(low+high)/2` 对应的值 `scores[mid]`\n3. 将中间值 `scores[mid]` 与 `searchValue`\
  \ 比较\n   - 如果 `scores[mid]==searchValue`，则输出当前 mid 索引\n   - 如果 `scores[mid]>searchValue`，说明要查找的\
  \ `searchValue` 位于 `low` 和 `mid-1` 之间\n4. 依此类推。重复步骤 3，直到找到 `searchValue` 或 `low>=high`\
  \ 时终止循环。\n\n示例 1：在下面已排序的数组中查找 `searchValue=40` 的索引。\n\n![](img/Image00026.jpg)\n\
  \n![](img/Image00027.jpg)\n\n示例 2：在下面已排序的数组中查找 `searchValue=90` 的索引。\n\n![](img/Image00028.jpg)\
  \ ![](img/Image00029.jpg)\n\n1. 使用记事本创建一个 `TestBinarySearch.html` 文件，并在浏览器中打开。\n\
  \n```javascript\n<script type = \"text/javascript\" >\n\n    class BinarySearch\
  \ {\n\n        static search ( arrays , searchValue ) {\n\n            var low =\
  \ 0 ;\n\n            var high = arrays.length - 1 ;\n\n            var mid = 0 ;\n\
  \n            while ( low <= high ) {\n\n                mid = ( low + high ) /\
  \ 2 ;\n\n                if ( arrays [ mid ] == searchValue ) {\n\n                   \
  \ return mid ;\n\n                } else if ( arrays [ mid ] < searchValue ) {\n\
  \n                    low = mid + 1 ;\n\n                } else if ( arrays [ mid\
  \ ] > searchValue ) {\n\n                    high = mid - 1 ;\n\n               \
  \ }\n\n            }\n\n            return - 1 ;\n\n        }\n\n    }\n\n    //////////////////////测试////////////////////\n\
  \n    var scores = [ 30 , 40 , 50 , 70 , 85 , 90 , 100 ];\n\n    var searchValue\
  \ = 40 ;\n\n    var position = BinarySearch.search ( scores , searchValue );\n\n\
      document.write ( searchValue + \" 的位置:\" + position );\n\n    document.write\
  \ ( \"<br>-----------------------------<br>\" );\n\n    searchValue = 90 ;\n\n   \
  \ position = BinarySearch.search ( scores , searchValue );\n\n    document.write\
  \ ( searchValue + \" 的位置:\" + position );\n\n</script>\n```\n\n结果：\n\n![](img/Image00030.jpg)\n\
  \n## 单向链表\n\n是线性表的链式存储结构，由节点连接而成。每个节点由 `data` 和指向下一个节点的 `next` 指针组成。\n\n![](img/Image00031.jpg)\n\
  \n### UML 图\n\n```javascript\n    class Node {\n\n        constructor ( data , next\
  \ ){\n\n            this.data = data ;\n\n            this.next = next ;\n\n       \
  \ }\n\n        getData (){\n\n            return this.data ;\n\n        }\n\n   \
  \ }\n```\n\n1. 单向链表初始化。\n\n示例：构建一个旧金山地铁单向链表\n\n![](img/Image00033.jpg)\n\n2. 遍历输出。\n\
  \n![](img/Image00034.jpg)\n\n1. 使用记事本创建一个 `TestUnidirectionalLinkedList.html` 文件，并在浏览器中打开。\n\
  \n```javascript\n<script type = \"text/javascript\" >\n\n    class Node {\n\n       \
  \ constructor ( data , next ){\n\n            this.data = data ;\n\n           \
  \ this.next = next ;\n\n        }\n\n        getData (){\n\n            return this.data\
  \ ;\n\n        }\n\n    }\n\n    class LinkedList {\n\n        init () {\n\n           \
  \ // 第一个节点称为头节点\n\n            this.head = new Node ( \"San Francisco\" , null );\n\
  \n            var nodeOakland = new Node ( \"Oakland\" , null );\n\n           \
  \ this.head.next = nodeOakland ;\n\n            var nodeBerkeley = new Node ( \"\
  Berkeley\" , null );\n\n            nodeOakland.next = nodeBerkeley ;\n\n           \
  \ // 最后一个节点称为尾节点\n\n            this.tail = new Node ( \"Fremont\" , null );\n\n\
              nodeBerkeley.next = this.tail ;\n\n            return this.head ;\n\n\
          }\n\n        print ( node ) {\n\n            var p = node ;\n\n           \
  \ while ( p != null ) // 从头到尾\n\n            {\n\n                var data = p.getData\
  \ ();\n\n                document.write ( data + \" -> \" );\n\n               \
  \ p = p.next ;\n\n            }\n\n            document.write ( \"End<br><br>\"\
  \ );\n\n        }\n\n    }\n\n    //////////////////////测试////////////////////\n\
  \n    var linkedList = new LinkedList ();\n\n    var head = linkedList.init ();\n\
  \n    linkedList.print ( head );\n\n</script>\n```\n\n结果：\n\n![](img/Image00035.jpg)\n\
