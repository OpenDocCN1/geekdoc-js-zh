  \ );\n\n    for ( var i = 0 ; i < scores.length ; i ++) {\n\n        document.write\
  \ ( scores [ i ] + \", \" );\n\n    }\n\n    document.write ( \"<br><br>\" );\n\n\
      ////////////////////////////////////////////////////////////\n\n    document.write\
  \ ( \"After building a heap : <br>\" );\n\n    heapSort.createHeap ( scores );\n\
  \n    for ( var i = 0 ; i < scores.length ; i ++) {\n\n        document.write (\
