    ## Heap sorting process


    1. Build a heap

    2. After outputting the top element of the heap, adjust from top to bottom, compare
    the top element with the root node of its left and right subtrees, and swap the
    smallest element to the top of the heap; then adjust continuously until the leaf
    nodes to get new heap.


