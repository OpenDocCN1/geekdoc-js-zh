    Quick Sort Algorithm


    Quick Sort Algorithm:


    Divide the array into 2 subarrays, then call yourself recursively, sort the subarrays
    quickly, and continue to the end.


    1\. The scores {90, 60, 50, 80, 70, 100} by quick sort


