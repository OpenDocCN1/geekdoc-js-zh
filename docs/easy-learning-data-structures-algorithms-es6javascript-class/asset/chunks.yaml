- fmt: "\nThe program function itself calls its own layer to progress until it reaches\
    \ a certain condition and step by step returns to the end.\n\n1. Factorial of\
    \ n : `n*(n-1)*(n-2) ...... *2*1`\n\nCreate a `TestRecursive.html` with Notepad\n\
    \n```html\n<script type = \"text/javascript\" >\n    function factorial ( n )\
    \ {\n        if ( n == 1 ) {\n            return 1 ;\n        } else {\n     \
    \       //Recursively call yourself until the end of the return\n            return\
    \ factorial ( n - 1 ) * n ;\n        }\n    }\n    //////////////////////testing////////////////////\n\
    \    var n = 5 ;\n    var fac = factorial ( n );\n    document.write ( \"The factorial\
    \ of 5 is :\" + fac );\n</script>\n```\n\nResult:\n\n![](Image00088.jpg)\n\nGraphical\
    \ analysis:\n\n![](Image00089.jpg)\n\n![](Image00090.jpg)\n\n## Two-way Merge\
    \ Algorithm\n\nTwo-way Merge Algorithm:\n\nThe data of the first half and the\
    \ second half are sorted, and the two ordered sub-list are merged into one ordered\
    \ list, which continue to recursive to the end.\n\n1. The scores {50, 65, 99,\
    \ 87, 74, 63, 76, 100} by merge sort\n\n![](Image00091.jpg)\n\nCreate a `TestMergeSort.html`\
    \ with Notepad\n\n```html\n<script type = \"text/javascript\" >\n    class MergeSort\
    \ {\n        sort ( array ) {\n            var temp = new Array ( array.length\
    \ );\n            this.mergeSort ( array , temp , 0 , array.length - 1 );\n  \
    \      }\n        mergeSort ( array , temp , left , right ) {\n            if\
    \ ( left < right ) {\n                var center = parseInt (( left + right )\
    \ / 2 );\n                this.mergeSort ( array , temp , left , center ); //\
    \ Left merge sort\n                this.mergeSort ( array , temp , center + 1\
    \ , right ); // Right merge sort\n                this.merge ( array , temp ,\
    \ left , center + 1 , right ); // Merge two ordered arrays\n            }\n  \
    \      }\n        /**\n         Combine two ordered list into an ordered list\n\
    \         temp : Temporary array\n         left :    Start the subscript on the\
    \ left\n         right :  Start the subscript on the right\n         rightEndIndex\
    \ : End subscript on the right\n         */\n        merge ( array , temp , left\
    \ , right , rightEndIndex ) {\n            var leftEndIndex = right - 1 ; // End\
    \ subscript on the left\n            var tempIndex = left ; // Starting from the\
    \ left count\n            var elementNumber = rightEndIndex - left + 1 ;\n   \
    \         while ( left <= leftEndIndex && right <= rightEndIndex ) {\n       \
    \         if ( array [ left ] <= array [ right ])\n                    temp [\
    \ tempIndex ++] = array [ left ++];\n                else\n                  \
    \  temp [ tempIndex ++] = array [ right ++];\n            }\n            while\
    \ ( left <= leftEndIndex ) { // If there is element on the left\n            \
    \    temp [ tempIndex ++] = array [ left ++];\n            }\n            while\
    \ ( right <= rightEndIndex ) { // If there is element on the right\n         \
    \       temp [ tempIndex ++] = array [ right ++];\n            }\n           \
    \ // Copy temp to array\n            for ( var i = 0 ; i < elementNumber ; i ++)\
    \ {\n                array [ rightEndIndex ] = temp [ rightEndIndex ];\n     \
    \           rightEndIndex --;\n            }\n        }\n    }\n    //////////////////////testing////////////////////\n\
    \    var scores = [ 50 , 65 , 99 , 87 , 74 , 63 , 76 , 100 , 92 ];\n    var mergeSort\
    \ = new MergeSort ();\n    mergeSort.sort ( scores );\n    for ( var i = 0 ; i\
    \ < scores.length ; i ++) {\n        document.write ( scores [ i ] + \",\" );\n\
    \    }\n</script>\n```\n\nResult:\n\n![](Image00092.jpg)\n\n## Quick Sort Algorithm\n\
    \nQuick Sort Algorithm:\n\nDivide the array into 2 subarrays, then call yourself\
    \ recursively, sort the subarrays quickly, and continue to the end.\n\n1. The\
    \ scores {90, 60, 50, 80, 70, 100} by quick sort\n\n![](Image00093.jpg)\n\n![](Image00094.jpg)\n\
    \n![](Image00095.jpg)\n\n![](Image00096.jpg)\n\nCreate a `TestQuickSort.html`\
    \ with Notepad\n\n```html\n<script type = \"text/javascript\" >\n    class QuickSort\
    \ {\n        sort ( array ) {\n            if ( array.length > 0 ) {\n       \
    \         this.quickSort ( array , 0 , array.length - 1 );\n            }\n  \
    \      }\n        quickSort ( array , low , high ) {\n            if ( low > high\
    \ ) {\n                return ;\n            }\n            var i = low ;\n  \
    \          var j = high ;\n            var threshold = array [ low ];\n      \
    \      // Alternately scanned from both ends of the list\n            while (\
    \ i < j ) {\n                // Find the first position less than threshold from\
    \ right to left\n                while ( i < j && array [ j ] > threshold ) {\n\
    \                    j --;\n                }\n                //Replace the low\
    \ with a smaller number than the threshold\n                if ( i < j )\n   \
    \                 array [ i ++] = array [ j ];\n                // Find the first\
    \ position greater than threshold from left to right\n                while (\
    \ i < j && array [ i ] <= threshold ) {\n                    i ++;\n         \
    \       }\n                //Replace the high with a number larger than the threshold\n\
    \                if ( i < j )\n                    array [ j --] = array [ i ];\n\
    \            }\n            array [ i ] = threshold ;\n            // left quickSort\n\
    \            this.quickSort ( array , low , i - 1 );\n            // right quickSort\n\
    \            this.quickSort ( array , i + 1 , high );\n        }\n    }\n    //////////////////////testing////////////////////\n\
    \    var scores = [ 90 , 60 , 50 , 80 , 70 , 100 ];\n    var quickSort = new QuickSort\
    \ ();\n    quickSort.sort ( scores );\n    for ( var i = 0 ; i < scores.length\
    \ ; i ++) {\n        document.write ( scores [ i ] + \",\" );\n    }\n</script>\n\
    ```\n\nResult:\n\n![](Image00097.jpg)\n\n## Binary Search Tree\n\nBinary Search\
    \ Tree:\n\n1. If the left subtree of any node is not empty, the value of all nodes\
    \ on the left subtree is less than the value of its root node;\n2. If the right\
    \ subtree of any node is not empty, the value of all nodes on the right subtree\
    \ is greater than the value of its root node;\n3. The left subtree and the right\
    \ subtree of any node are also binary search trees.\n\n![](Image00098.jpg)\n\n\
    Node UML Diagram\n\n![](Image00099.jpg)\n\n```javascript\nclass Node {\n    constructor\
    \ ( data , left , right ){\n        this.data = data ;\n        this.left = left\
