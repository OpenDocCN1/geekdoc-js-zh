  trans: "\n程序函数自身调用自身，层层递进，直到满足某个条件，再逐步返回至结束。\n\n1. n 的阶乘：`n*(n-1)*(n-2) ...... *2*1`\n\
    \n使用记事本创建 `TestRecursive.html`\n\n```html\n<script type = \"text/javascript\"\
    \ >\n    function factorial ( n ) {\n        if ( n == 1 ) {\n            return\
    \ 1 ;\n        } else {\n            // 递归调用自身，直到返回结束\n            return factorial\
    \ ( n - 1 ) * n ;\n        }\n    }\n    //////////////////////测试////////////////////\n\
    \    var n = 5 ;\n    var fac = factorial ( n );\n    document.write ( \"5 的阶乘是：\"\
    \ + fac );\n</script>\n```\n\n结果：\n\n![](img/Image00088.jpg)\n\n图解分析：\n\n![](img/Image00089.jpg)\n\
    \n![](img/Image00090.jpg)\n\n## 二路归并算法\n\n二路归并算法：\n\n将前半部分和后半部分的数据分别排序，再将两个有序子列表合并成一个有序列表，如此递归直至结束。\n\
    \n1. 对分数 {50, 65, 99, 87, 74, 63, 76, 100} 进行归并排序\n\n![](img/Image00091.jpg)\n\
    \n使用记事本创建 `TestMergeSort.html`\n\n```html\n<script type = \"text/javascript\"\
    \ >\n    class MergeSort {\n        sort ( array ) {\n            var temp = new\
    \ Array ( array.length );\n            this.mergeSort ( array , temp , 0 , array.length\
    \ - 1 );\n        }\n        mergeSort ( array , temp , left , right ) {\n   \
    \         if ( left < right ) {\n                var center = parseInt (( left\
    \ + right ) / 2 );\n                this.mergeSort ( array , temp , left , center\
    \ ); // 左半部分归并排序\n                this.mergeSort ( array , temp , center + 1 ,\
    \ right ); // 右半部分归并排序\n                this.merge ( array , temp , left , center\
    \ + 1 , right ); // 合并两个有序数组\n            }\n        }\n        /**\n        \
    \ 将两个有序列表合并成一个有序列表\n         temp : 临时数组\n         left :    左侧起始下标\n        \
    \ right :  右侧起始下标\n         rightEndIndex : 右侧结束下标\n         */\n        merge\
    \ ( array , temp , left , right , rightEndIndex ) {\n            var leftEndIndex\
    \ = right - 1 ; // 左侧结束下标\n            var tempIndex = left ; // 从左侧开始计数\n   \
    \         var elementNumber = rightEndIndex - left + 1 ;\n            while (\
    \ left <= leftEndIndex && right <= rightEndIndex ) {\n                if ( array\
    \ [ left ] <= array [ right ])\n                    temp [ tempIndex ++] = array\
    \ [ left ++];\n                else\n                    temp [ tempIndex ++]\
    \ = array [ right ++];\n            }\n            while ( left <= leftEndIndex\
    \ ) { // 如果左侧还有元素\n                temp [ tempIndex ++] = array [ left ++];\n\
    \            }\n            while ( right <= rightEndIndex ) { // 如果右侧还有元素\n \
    \               temp [ tempIndex ++] = array [ right ++];\n            }\n   \
    \         // 将 temp 复制回 array\n            for ( var i = 0 ; i < elementNumber\
    \ ; i ++) {\n                array [ rightEndIndex ] = temp [ rightEndIndex ];\n\
    \                rightEndIndex --;\n            }\n        }\n    }\n    //////////////////////测试////////////////////\n\
    \    var scores = [ 50 , 65 , 99 , 87 , 74 , 63 , 76 , 100 , 92 ];\n    var mergeSort\
    \ = new MergeSort ();\n    mergeSort.sort ( scores );\n    for ( var i = 0 ; i\
    \ < scores.length ; i ++) {\n        document.write ( scores [ i ] + \",\" );\n\
    \    }\n</script>\n```\n\n结果：\n\n![](img/Image00092.jpg)\n\n## 快速排序算法\n\n快速排序算法：\n\
    \n将数组分成两个子数组，然后递归调用自身，对子数组进行快速排序，直至结束。\n\n1. 对分数 {90, 60, 50, 80, 70, 100} 进行快速排序\n\
    \n![](img/Image00093.jpg)\n\n![](img/Image00094.jpg)\n\n![](img/Image00095.jpg)\n\
    \n![](img/Image00096.jpg)\n\n使用记事本创建 `TestQuickSort.html`\n\n```html\n<script\
    \ type = \"text/javascript\" >\n    class QuickSort {\n        sort ( array )\
    \ {\n            if ( array.length > 0 ) {\n                this.quickSort ( array\
    \ , 0 , array.length - 1 );\n            }\n        }\n        quickSort ( array\
    \ , low , high ) {\n            if ( low > high ) {\n                return ;\n\
    \            }\n            var i = low ;\n            var j = high ;\n      \
    \      var threshold = array [ low ];\n            // 从列表两端交替扫描\n            while\
    \ ( i < j ) {\n                // 从右向左找到第一个小于阈值的位置\n                while ( i\
    \ < j && array [ j ] > threshold ) {\n                    j --;\n            \
    \    }\n                // 将比阈值小的数替换到低位\n                if ( i < j )\n      \
    \              array [ i ++] = array [ j ];\n                // 从左向右找到第一个大于阈值的位置\n\
    \                while ( i < j && array [ i ] <= threshold ) {\n             \
    \       i ++;\n                }\n                // 将比阈值大的数替换到高位\n          \
    \      if ( i < j )\n                    array [ j --] = array [ i ];\n      \
    \      }\n            array [ i ] = threshold ;\n            // 左侧快速排序\n     \
    \       this.quickSort ( array , low , i - 1 );\n            // 右侧快速排序\n     \
    \       this.quickSort ( array , i + 1 , high );\n        }\n    }\n    //////////////////////测试////////////////////\n\
    \    var scores = [ 90 , 60 , 50 , 80 , 70 , 100 ];\n    var quickSort = new QuickSort\
    \ ();\n    quickSort.sort ( scores );\n    for ( var i = 0 ; i < scores.length\
    \ ; i ++) {\n        document.write ( scores [ i ] + \",\" );\n    }\n</script>\n\
    ```\n\n结果：\n\n![](img/Image00097.jpg)\n\n## 二叉搜索树\n\n二叉搜索树：\n\n1. 若任意节点的左子树不为空，则左子树上所有节点的值均小于其根节点的值；\n\
    2. 若任意节点的右子树不为空，则右子树上所有节点的值均大于其根节点的值；\n3. 任意节点的左、右子树也分别为二叉搜索树。\n\n![](img/Image00098.jpg)\n\
    \n节点 UML 图\n\n![](img/Image00099.jpg)\n\n```javascript\nclass Node {\n    constructor\
    \ ( data , left , right ){\n        this.data = data ;\n        this.left = left\
    \ ;\n        this.right = right ;\n    }\n    getData (){\n        return this.data\
    \ ;\n    }\n}\n```\n\n1. 构建二叉搜索树，插入节点\n\n插入的节点从根节点开始比较，若小于根节点则与根节点的左子树比较，否则与右子树比较，直到左子树为空或右子树为空，然后插入。\n\
    \n插入 60\n\n![](img/Image00100.jpg)\n\n插入 40\n\n![](img/Image00101.jpg)\n\n插入 20\n\
    \n![](img/Image00102.jpg)\n\n插入 10\n\n![](img/Image00103.jpg)\n\n插入 30\n\n![](img/Image00104.jpg)\n\
    \n插入 50\n\n![](img/Image00105.jpg)\n\n插入 80\n\n![](img/Image00106.jpg)\n\n插入 70\n\
    \n![](img/Image00107.jpg)\n\n插入 90\n\n![](img/Image00108.jpg)\n\n2. 二叉搜索树的中序遍历\n\
    \n中序遍历：左子树 -> 根节点 -> 右子树\n\n![](img/Image00109.jpg)\n\n结果：\n\n![](img/Image00110.jpg)\n\
    \n使用记事本创建 `TestBinarySearchTreeInOrder.html`\n\n```html\n<script type = \"text/javascript\"\
    \ >\n    class BinaryTree {\n        getRoot () {\n            return this.root\
    \ ;\n        }\n        // 中序遍历二叉搜索树\n        inOrder ( root ) {\n           \
    \ if ( root == null ) {\n                return ;\n            }\n           \
    \ this.inOrder ( root.left ); // 遍历左子树\n            document.write ( root.getData\
    \ () + \", \" );\n            this.inOrder ( root.right ); // 遍历右子树\n        }\n\
    \        insert ( node , newData ) {\n            if ( this.root == null ) {\n\
    \                this.root = new Node ( newData , null , null );\n           \
    \     return ;\n            }\n            var compareValue = newData - node.getData\
    \ ();\n            // 递归左子树，继续查找插入位置\n</script>\n```\n\n"
