- img_proc: true
  md: "Language models use text as input. That text is called a prompt. It's not just\
    \ a fixed string, though. Usually, it's a mix of a template, examples, and what\
    \ the user adds.\n\nWith templates, we can streamline the prompting process, making\
    \ sure that users don't have to repetitively type the same prefix for each request.\n\
    \nFor our particular use case, the prompt template will look like so:\n\n```\n\
    `Tell me a story title about {subject}`\n```\n\nAll the chances we need to make\
    \ are in the backend:\n\n```\n//code/story-generator/src/app/api/route.js\n\n\
    import { ChatOpenAI } from \"@langchain/openai\"\n//\U0001F534 we will use the\
    \ PromptTemplate to avoid repetition\nimport { PromptTemplate } from \"@langchain/core/prompts\"\
    \n\nconst model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \  temperature: 0.9\n})\n//\U0001F534 establishing the general format of the template\n\
    const prompt = new PromptTemplate({\n  inputVariables: [ \"subject\"],\n  template:\
    \ \"Tell me a story title about {subject}\"\n})\n\nexport async function POST(req)\
    \ {\n    const { subject } = await req.json()\n    //\U0001F534 passing down the\
    \ { subject } parameter\n    const formattedPrompt = await prompt.format({\n \
    \       subject\n    })\n    const gptResponse = await model.invoke(formattedPrompt)\n\
    \    return Response.json({data: gptResponse.content})\n}\n```"
  merge: -1
  pgno: 25
- img_proc: true
  md: "![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_26_0.png)\n\nThe default format of\
    \ writing prompt templates is the F-String format, popular in Python. If you want\
    \ to use the more familiar double curly braces JavaScript Mustache format you\
    \ can have:\n\n```\nconst prompt = PromptTemplate.fromTemplate(\n  inputVariables:\
    \ [ \"subject\"],\n  template: \"Tell me a story title about {{subject}}\",\n\
    \  {\n    templateFormat: \"mustache\"\n  }\n)\n```\n\nIf you want to read more\
    \ you can take a look at the quick start guide from the documentation."
