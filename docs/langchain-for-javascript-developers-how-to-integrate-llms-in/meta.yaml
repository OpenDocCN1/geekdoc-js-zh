    \n每个点都是一个具有以下格式的向量：\n\n```javascript\n[\n    x, // how big is the object\n   \
    \ y  // how fast is the object\n]\n```\n\n嵌入空间的每个轴也称为一个维度或特征。\n\n请记住，此表示非常简化。通常，每个条目具有更多维度，范围从几十到几千，具体取决于数据的复杂性和粒度。\n\
    \n给定一组维度，相似的对象被分组在一起，使我们能够在任何其他数据类型中映射单词或类似特征的语义含义。\n\n使用这些嵌入，我们可以做诸如推荐系统、搜索引擎，甚至像\
    \ ChatGPT 中那样的文本生成之类的事情。\n"
