    Note that a chain made with `createStuffDocumentsChain()` expects to receive a
    `context` variable when you are calling its `invoke()` method.


    Failing to do so will result in the following error:


    ```

    Error: Prompt must include a context variable

    ```


    The `createStuffDocumentsChain()` takes a list of documents and formats them all
    into a prompt, then passes that prompt to an LLM. It passes ALL documents, so
    you should make sure it fits within the context length of the LLM you are using.


    Context length refers to the maximum number of words a model can handle at once.
    Think of it as the model''s memory or attention span. This is a predetermined
    feature in transformer-based models such as ChatGPT and Llama.


    Below are the default context lengths of some popular LLMs:


    | Model | Context Size | Number of pages* |

    | :--- | :--- | :--- |

    | 🤖 GPT 3.5 | 4,096 | 6 |

    | 🤖 GPT 4 | 8,192 | 12 |

    | 🤖 GPT 4-32k | 32,768 | 49 |

    | 🦙 Llama 1 | 2,048 | 3 |

    | 🦙 Llama 2 | 4,096 | 6 |

    | 🦙 Llama 3 | 8,192 | 12 |

    | * 500 words per page | | |


    Expanding the context does not retrain the model; the weights remain unchanged
    in this process.


    The frontend will remain the same. We simply pass in the question and display
    the answer.'
