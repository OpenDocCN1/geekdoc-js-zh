  md: '# # 1.5. Overview of this book


    In this book, we email on a fun, hands-on, and pragmatic journey to learning LangChain.
    Every main chapter has an associated example application that gradually evolves
    during that chapter. Each step introduces a few new LangChain core concepts in
    a manageable way without overwhelming you.


    The book is purposefully broken down into short chapters, each focusing on different
    topics.


    Here is how the main chapters and example applications are structured:


    +   - **Chapter 1:** We will use a Story Generator for Kids app to introduce the
    basics of LangChain. We will connect to the first LLM, and use prompt templates
    and chains. We will delve deeper into partial templates, template composition,
    and more.

    - **Chapter 2:** After the basic setup in Chapter 1, this chapter will introduce
    the concept of streaming. Using the same app, Story Generator for Kids, we will
    stream long responses from the LLMs to improve the user experience.

    - **Chapter 3:** One challenge with LLMs is that they give responses in an unstructured
    format, as they were trained on human-intelligible text. In this chapter, we will
    study output parsers by making a full Trivia Game from scratch using ChatGPT.

    - **Chapter 4:** The memory module enables LLM memory for LangChain apps. We can
    remember past conversations and responses in the current session similar to how
    ChatGPT does it. In this chapter, we will build a Tea Facts Wiki application.

    - **Chapter 5:** One of the key features of LangChain is its support for RAG -
    Retrieval Augmented Generation. In this chapter, we will build a Chat Bot app
    that answers questions based on external context. We will see how to provide data
    from sources like PDFs or online documents, what embeddings are, and how vector
    data stores work.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '+   - **Chapter 6:** More flexible and versatile compared to chains, AI agents
    help you build complex solutions and enable access to third-party tools such as
    Google search and math calculators. They can make decisions on the appropriate
    tool to use in a given situation.


    From building a Story Generator to creating a Trivia Game and a real Chat Bot
    application, each chapter gradually expands your understanding. By the end, we
    will have explored streaming, output parsing, memory modules, AI agents, and RAG
    capabilities, empowering you to develop complex solutions.


    Get ready to embark on an enriching journey into the world of LangChain development.'
  merge: -1
