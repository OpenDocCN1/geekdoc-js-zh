    \    讲一个关于我最爱饮料的事实\n    </button>\n    <div>{answer}</div>\n    </>\n  )\n}\n\
    ```\n\n而后端，我们返回 GPT 模型对提示词 `告诉我一个关于我最爱饮料的事实：` 给出的答案：\n\n```javascript\n// code/tea-wiki/src/app/api/route.js\n\
