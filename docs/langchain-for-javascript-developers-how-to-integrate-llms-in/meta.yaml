  md: "# 4.6. StructuredOutputParser\n\nLarge Language Models like to have structure!\
    \ Their output is much more accurate when we define a clear expected structure\
    \ for both the input and the output. More info about this [here](https://docs.smith.langchain.com/configuration/structured_output).\n\
    \nWhile `CommaSeparatedListOutputParser` or `StringOutputParser` are great tools\
    \ for simpler direct responses, when we have to deal with more complex outputs,\
    \ we will need other types of parsers such as [`StructuredOutputParser`](https://api.js.langchain.com/classes/langchain.output_parsers.StructuredOutputParser.html)\
    \ or [`JsonOutputParser`](https://api.js.langchain.com/classes/langchain.output_parsers.JsonOutputParser.html).\n\
    \nFor our small trivia app, a big improvement will be to receive the output in\
    \ the following format:\n\n```\n{\n  question: 'question text here',\n  answers:\
    \ [\n    'foo',\n    'bar',\n    'qux',\n    'baz',\n  ],\n  correct: 2 // 'qux'\
    \ is correct\n}\n```\n\nTo achieve this, we will use a `StructuredOutputParser`\
    \ with a Zod schema. The reason for this is that `StructuredOutputParser` is more\
    \ versatile and covers more use cases than the `JsonOutputParser`.\n\n[Zod](https://zod.dev/)\
    \ is a schema validation library for defining complex data structures.\n\nLet's\
    \ see how adding a `StructuredOutputParser` will change our backend code:\n\n\
    ```\n// code/trivia-game/src/app/api/route.js\n\nimport { ChatOpenAI } from \"\
    @langchain/openai\"\nimport { PromptTemplate } from \"@langchain/core/prompts\"\
    \n```"
