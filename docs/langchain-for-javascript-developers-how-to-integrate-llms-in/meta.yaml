- md: "我们使用两个输出解析器：\n\n- `StringOutputParser` 用于主问题\n- `CommaSeparatedListOutputParser`\
    \ 用于解析可能的答案列表\n\n在前端，我们将读取可能的答案并将其显示为按钮：\n\n```\n// code/trivia-game/src/app/page.js\n\
    \n'use client'\nimport { useState } from \"react\"\n\nexport default function\
    \ Home() {\n  const [question, setQuestion] = useState()\n  // \U0001F7E1 添加一个空数组状态变量来存储答案\n\
    \  const [answers, setAnswers] = useState([])\n\n  const getTriviaQuestion = async\
    \ ()=> {\n    const response = await fetch('api')\n    const data = await response.json()\n\
    \    console.log(data)\n    setQuestion(data.question)\n    // \U0001F7E1 一旦有了答案就更新状态\n\
    \    setAnswers(data.answers)\n  }\n\n  return (<> \n    <h1>\U0001F30D Geography\
    \ trivia</h1>\n    <button onClick={getTriviaQuestion}>\n      Ask me a geography\
    \ question\n    </button>\n    <p>{question}</p>\n    {/* \U0001F7E1 循环显示每个答案为一个按钮\
    \ */}\n    {answers.map((answ, i) =>\n      <button key={i}>\n        {answ}\n\
    \      </button>\n    )}\n  </>)\n}\n```\n\n此阶段应用的界面将如下所示：\n\n![img](img/8ed289cfe69587a9e6e4a3dd9ba079ed_57_0.png)\n\
    \n顺便说一下，如果列表不是用逗号分隔的，你可以使用 `CustomListOutputParser`。\n\n一个有趣的额外项目是为这个应用添加记忆功能，使其不会重复提问。我们将在接下来的章节中了解如何使用\
    \ LangChain 的聊天记忆功能。\n\n下一步将是确定用户是否点击了正确答案。\n\n## 4.5. getFormatInstructions()\
    \ 方法与自定义解析器\n\n在我们继续之前，先简短地讨论一下 `getFormatInstructions()` 方法以及输出解析器在底层是如何工作的。\n\
    \nLangChain 中有许多输出解析器。文档提供了[这个表格](this table)来总结主要类型：\n\n| 名称 | 支持流式传输 | 有格式说明\
    \ | 调用 LLM | 输入类型 | 输出类型 | 描述 |\n|---|---|---|---|---|---|---|\n| String | ✅ |\
    \ | | string 或 Message | string | 获取语言模型输出（无论是整个响应还是流）并将其转换为字符串。这对于标准化聊天模型和 LLM\
    \ 输出非常有用，使处理聊天模型输出更加方便。 |\n| HTTPResponse | ✅ | | | string 或 Message | binary\
    \ | 允许你将 LLM 输出正确格式化为字节流，通过 web HTTP 响应传输多种内容类型。 |\n| OpenAIFunctions | ✅ | (传递函数给模型)\
    \ | | Message (带 function_call) | JSON object | 允许你使用 OpenAI 函数调用来构建返回输出。如果你使用的模型支持函数调用，这通常是最可靠的方法。\
