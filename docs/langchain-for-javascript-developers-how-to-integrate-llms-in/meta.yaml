    # 7.1. Introduction and project setup


    Up until now, we have looked at creating chains. Chains follow a predetermined
    sequence specified by us.


    Agents are different in the sense that we can simply give them a goal, and they
    will dynamically figure out the best course of actions to take and the order of
    those actions to reach that final goal.


    We will assign tools to an agent, and the agent will try to figure out when to
    use a tool to complete the task.


    Until this moment, we have used the LLM primarily as an NLP (Natural Language
    Processing) tool. AI agents are closer to what we imagine "real AI" to be.


    Having objectives, trying different approaches, interacting with the environment,
    and making decisions are more aligned with what we consider real intelligence.


    We were tasked with building a tool to help journalists in their research for
    new articles. The tool needs to be able to search on Wikipedia and perform precise
    math calculations.


    By the end of this chapter, we will build an app that will do the following:


    +   - read a question from the user

    - use an agent to answer the question

    - the output will contain the answer to the question, and the tools used by the
    agent to find that answer.'
