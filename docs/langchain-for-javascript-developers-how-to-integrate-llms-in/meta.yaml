    \ \U0001F7E0 making the toolbox for the agent\n// \U0001F7E0 remember to run 'npm\
    \ install @langchain/community'\nconst wikipediaQuery = new WikipediaQueryRun({topKResults:\
    \ 1})\nconst calculator = new Calculator()\nconst tools = [wikipediaQuery, calculator]\n\
    \n// \U0001F7E0 getting the agent rule set\nconst prompt = await pull(\"hwchase17/react\"\
    )\n```"
  - "[PAGE 111]\n\n```\n// \U0001F7E0 define the Agent and the AgentExecutor\nconst\
    \ agent = await createReactAgent({\n  llm: model,\n  tools,\n  prompt\n})\n\n\
    const agentExecutor = new AgentExecutor({\n  agent,\n  tools\n})\n\nexport async\
    \ function POST(req) {\n  const { question } = await req.json()\n  const response\
    \ = await agentExecutor.invoke({\n    input: question\n  })\n  return Response.json({data:\
    \ response, prompt})\n}\n```\n\nAnd this is the frontend code:\n\n```\n// code/agents/src/app/page.js\n\
    'use client'\nimport { useState } from \"react\"\n\nexport default function Home()\
    \ {\n  const [data, setData] = useState();\n\n  const onSubmitHandler = async\
    \ (e) => {\n    e.preventDefault();\n    const question = e.target.question.value;\n\
    \    if (question) {\n      const response = await fetch(\"api\", {\n        method:\
    \ \"POST\",\n        body: JSON.stringify({\n          question,\n        }),\n\
    \      });\n      const result = await response.json();\n      setData(result.data);\n\
    \    }\n  };\n\n  return (\n    <main>\n      <form onSubmit={onSubmitHandler}>\n\
    \        <input name=\"question\" />\n        <button type=\"submit\">Submit</button>\n\
    \      </form>\n      {data && <p>{data}</p>}\n    </main>\n  );\n}\n```"
  - "[PAGE 112]\n\n```\n}),\n    });\n    const { data } = await response.json();\n\
    \    setData(data);\n  }\n};\n\nreturn (\n    <>\n      <h1>\U0001F575️‍♂️ Article\
    \ research agent</h1>\n      <form onSubmit={onSubmitHandler}>\n        <input\
    \ name=\"question\" />\n        <button>Ask question</button>\n      </form>\n\
    \      {data && (\n        <div>\n          <p>\n            <b>❓ question:</b>\
    \ {data.input}{\" \"}\n          </p>\n          <p>\n            <b>\U0001F916\
    \ answer:</b> {data.output}{\" \"}\n          </p>\n        </div>\n      )}\n\
    \    </>\n  );\n}\n```\n\nAt this moment, if we ask the model again `Who won the\
    \ Super Bowl in 2024?` it will be able to use the Wikipedia tool to search for\
    \ an answer.\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_112_0.png)\n\nOh boy,\
    \ Taylor Swift must be happy!"
- md: "## 7.3. Monitoring agents and performance considerations\n\nAgents are fantastic,\
    \ but they come at a cost. They can be:\n\n* \U0001F422 slow to respond\n* ⚡️\
    \ have high computational costs\n* \U0001F3B2 sometimes can give random results\n\
    \nLuckily, we have a few ways to control the autonomous behavior of the agents.\n\
    \nLet's update the backend code with some monitoring and performance enhancements.\n\
    \nAdd the following lines in the constructor of the `AgentExecutor`:\n\n```javascript\n\
    // code/agents/src/app/api/route.js\n\nconst agentExecutor = new AgentExecutor({\n\
    \  agent,\n  tools,\n  verbose: true,\n  returnIntermediateSteps: true,\n  maxIterations:\
    \ 4,\n})\n```\n\nAnd this code in the returned HTML of the frontend:\n\n```javascript\n\
    // code/agents/src/app/page.js\ndata && (<div>\n  <p><b>❓ question:</b> {data.input}</p>\n\
    \  <p><b>\U0001F916 answer:</b> {data.output}</p>\n  <p><b>\U0001F9F0 tools used:</b>\
    \ {\n    data.intermediateSteps.map(step => step.action.tool)\n  }</p>\n</div>)\n\
    ```\n\nAt this point, if we ask the agent, \"How many years have passed since\
    \ Brazil won the World Cup?\" we will get the following result:\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_114_0.png)\n\
    \nLet's talk a bit about the added options.\n\nFirst, the `maxIterations` option\
    \ limits the number of attempts an agent has to find the solution. This is a good\
    \ option to speed up the response and to ensure we do not run into an infinite\
    \ loop.\n\nAs in the previous use case, the `verbose` option prints - in the backend\
    \ console - the reasoning that leads to a given result. For example, when asked,\
    \ \"What is the double of PI?\" it will print something like this:\n\n```\n[chain/start]\
    \ [1:chain:AgentExecutor > 18:chain:ReactAgent > 22:prompt:PromptTemplate] Entering\
    \ Chain run with input: {\n  \"input\": \"What is the double of PI?\",\n  \"steps\"\
    : [\n    {\n      \"action\": {\n        \"tool\": \"wikipedia-api\",\n      \
    \  \"toolInput\": \"PI\",\n        \"log\": \"PI is a mathematical constant that\
    \ can be found on Wikipedia\\nAction: wikipedia-api\\nAction Input: PI\"\n   \
    \   },\n      {\n        \"action\": {\n          \"tool\": \"calculator\",\n\
    \          \"toolInput\": \"2*3.14159\",\n          \"log\": \"I know that PI\
    \ is approximately equal to 3.14159, so I can calculate the double of it\\nAction:\
    \ calculator\\nAction Input: 2*3.14159\"\n        },\n      ],\n      \"content\"\
    : \"I now know the final answer\\nFinal Answer: 6.28318\"\n}\n```\n\nThis is quite\
    \ cool, isn't it?\n\nAnd the third option, the `returnIntermediateSteps` (documentation\
    \ [link here](https://docs.python.langchain.com)) prints the tools used by the\
    \ agent and their order. Agents are autonomous and can decide their own set of\
    \ actions.\n\nFor example, the Wikipedia tool was enough to respond to the question,\
    \ \"Who won the Super Bowl in 2024?\" On the other hand, the question, \"How many\
    \ years have passed since Brazil won the World Cup?\" required the use of both\
    \ Wikipedia and the Calculator tools. With this option, we can monitor if the\
    \ agent is using the correct tools for the job.\n\n## 7.4. Recap\n\nAgents and\
    \ tool use in general, are key concepts of LangChain.\n\nAt a high level agents\
    \ involve using a LLM and asking it to reason about which actions to take and\
    \ then executing those actions. Often this is done in a loop that repeats until\
    \ the LLM decides it has reached the objectives, or there are no other actions\
    \ it can take.\n\nThe tools are representations of actions a language model can\
    \ take, along with the functions that implement those actions.\n\nAgents and tools\
    \ are combined with an agent executor. This agent executor is essentially a loop\
    \ that runs to call an LLM to figure out what tool the agent should try to use\
    \ next unless it has reached its objective.\n\nAgents are constructed based on\
    \ prompts, as you may have noticed from the code:\n\n```javascript\nconst prompt\
    \ = await pull(\"hwchase17/react\")\n\nconst agent = await createReactAgent({\n\
    \  llm: model,\n  tools,\n  prompt\n})\n```\n\nThere are many different agent\
    \ types. You can see the five main types of agents available at this moment on\
    \ [this page](https://python.langchain.com/docs/modules/agents/agent_types/).\n\
    \n### When to Use\n\nOur commentary on when you should consider using this agent\
    \ type.\n\n| Agent Type | Intended Model Type | Supports Chat History | Supports\
    \ Multi-Input Tools | Supports Parallel Function Calling | Required Model Params\
    \ |\n|---|---|---|---|---|---|\n| OpenAI Tools | Chat | ✅ | ✅ | ✅ | `tools` |\n\
    \nSome are good for local models, some are good for the newest OpenAI models,\
    \ some support parallel function calling, and some support conversational history.\
    \ Others are great for using simple tools and single inputs because of their general\
    \ prompting strategies.\n\nWhen discussing AI agents, please note that there are\
    \ many other topics, concepts, techniques, prompts, and features. What we have\
    \ discussed in this chapter is just a very brief introduction to the subject.\n\
    \n## 7.5. Final Words\n\nHopefully, you have enjoyed this book!\n\nI would love\
    \ to get your feedback. Let me know what you liked and didn't like so I can improve\
    \ this book.\n\nI would love to get your feedback, and learn what you liked and\
    \ didn't so I can improve this book.\n\nFeel free to email me at [daniel@js-craft.io](mailto:daniel@js-craft.io)\
    \ to get updated versions of this book. If you think I should have covered more\
    \ topics, please email me. I'd love to hear from you!\n\nIf you like the book,\
    \ I would appreciate it if you could leave a review too.\n\nThanks, friend and\
    \ keep coding!"
  mdcn: "\n## 7.3. 监控代理与性能考量\n\n代理非常强大，但它们也存在一些代价。它们可能：\n\n* \U0001F422 响应速度慢\n* ⚡️\
    \ 计算成本高\n* \U0001F3B2 有时可能给出随机结果\n\n幸运的是，我们有一些方法来控制代理的自主行为。\n\n让我们更新后端代码，添加一些监控和性能增强功能。\n\
    \n在 `AgentExecutor` 的构造函数中添加以下代码行：\n\n```javascript\n// code/agents/src/app/api/route.js\n\
    \nconst agentExecutor = new AgentExecutor({\n  agent,\n  tools,\n  verbose: true,\n\
    \  returnIntermediateSteps: true,\n  maxIterations: 4,\n})\n```\n\n并在前端返回的 HTML\
    \ 中添加这段代码：\n\n```javascript\n// code/agents/src/app/page.js\ndata && (<div>\n\
    \  <p><b>❓ 问题：</b> {data.input}</p>\n  <p><b>\U0001F916 回答：</b> {data.output}</p>\n\
    \  <p><b>\U0001F9F0 使用的工具：</b> {\n    data.intermediateSteps.map(step => step.action.tool)\n\
    \  }</p>\n</div>)\n```\n\n此时，如果我们问代理：“巴西赢得世界杯后过去了多少年？”我们会得到以下结果：\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_114_0.png)\n\
    \n我们来稍微谈谈新增的选项。\n\n首先，`maxIterations` 选项限制了代理尝试寻找解决方案的次数。这是一个很好的选项，可以加快响应速度并确保我们不会陷入无限循环。\n\
    \n与之前的用例一样，`verbose` 选项会在后端控制台中打印导致给定结果的推理过程。例如，当被问到“圆周率 PI 的两倍是多少？”时，它会打印类似这样的内容：\n\
    \n```\n[chain/start] [1:chain:AgentExecutor > 18:chain:ReactAgent > 22:prompt:PromptTemplate]\
    \ Entering Chain run with input: {\n  \"input\": \"What is the double of PI?\"\
    ,\n  \"steps\": [\n    {\n      \"action\": {\n        \"tool\": \"wikipedia-api\"\
    ,\n        \"toolInput\": \"PI\",\n        \"log\": \"PI is a mathematical constant\
    \ that can be found on Wikipedia\\nAction: wikipedia-api\\nAction Input: PI\"\n\
    \      },\n      {\n        \"action\": {\n          \"tool\": \"calculator\"\
    ,\n          \"toolInput\": \"2*3.14159\",\n          \"log\": \"I know that PI\
    \ is approximately equal to 3.14159, so I can calculate the double of it\\nAction:\
    \ calculator\\nAction Input: 2*3.14159\"\n        },\n      ],\n      \"content\"\
    : \"I now know the final answer\\nFinal Answer: 6.28318\"\n}\n```\n\n这相当酷，不是吗？\n\
    \n第三个选项 `returnIntermediateSteps`（[文档链接在此](https://docs.python.langchain.com)）会打印代理使用的工具及其顺序。代理是自主的，可以决定自己的行动集。\n\
    \n例如，维基百科工具足以回答“谁赢得了2024年超级碗？”这个问题。另一方面，“巴西赢得世界杯后过去了多少年？”这个问题则需要同时使用维基百科和计算器工具。通过这个选项，我们可以监控代理是否在为任务使用正确的工具。\n\
    \n## 7.4. 回顾\n\n代理和工具使用，通常是 LangChain 的关键概念。\n\n从高层次上讲，代理涉及使用一个大语言模型（LLM），并要求它推理应该采取哪些行动，然后执行这些行动。这通常在一个循环中完成，循环重复进行，直到\
    \ LLM 决定已达到目标，或者没有其他可采取的行动。\n\n工具代表语言模型可以采取的行动，以及实现这些行动的函数。\n\n代理与代理执行器结合在一起。这个代理执行器本质上是一个循环，运行以调用\
    \ LLM 来确定代理接下来应该尝试使用哪个工具，除非它已达到目标。\n\n代理是基于提示构建的，正如您可能从代码中注意到的：\n\n```javascript\n\
    const prompt = await pull(\"hwchase17/react\")\n\nconst agent = await createReactAgent({\n\
    \  llm: model,\n  tools,\n  prompt\n})\n```\n\n存在许多不同类型的代理。您可以在[此页面](https://python.langchain.com/docs/modules/agents/agent_types/)上看到目前可用的五种主要代理类型。\n\
    \n### 何时使用\n\n我们关于您何时应考虑使用此代理类型的评论。\n\n| 代理类型 | 预期模型类型 | 支持聊天历史 | 支持多输入工具 | 支持并行函数调用\
    \ | 所需模型参数 |\n|---|---|---|---|---|---|\n| OpenAI Tools | Chat | ✅ | ✅ | ✅ | `tools`\
    \ |\n\n有些适合本地模型，有些适合最新的 OpenAI 模型，有些支持并行函数调用，有些支持对话历史。另一些则非常适合使用简单工具和单一输入，因为它们具有通用的提示策略。\n\
    \n在讨论 AI 代理时，请注意还有许多其他主题、概念、技术、提示和功能。我们在本章中讨论的只是对该主题非常简要的介绍。\n\n## 7.5. 结语\n\n\
    希望您喜欢这本书！\n\n我很想得到您的反馈。请告诉我您喜欢什么，不喜欢什么，以便我能改进这本书。\n\n我很想得到您的反馈，并了解您喜欢什么，不喜欢什么，以便我能改进这本书。\n\
    \n请随时通过 [daniel@js-craft.io](mailto:daniel@js-craft.io) 向我发送电子邮件，以获取本书的更新版本。如果您认为我应该涵盖更多主题，请给我发邮件。我很乐意听到您的声音！\n\
    \n如果您喜欢这本书，如果您能留下评论，我将不胜感激。\n\n谢谢，朋友，继续编码吧！\n"
