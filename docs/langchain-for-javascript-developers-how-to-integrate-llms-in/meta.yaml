    ```\n\nOr:\n\n```\n\"Tell me a bedside story title about cats.\"\n```\n\nGive\
    \ it a shot and see how it goes.\n\n## 2.5. Prompt templates\n\nYou'll soon notice\
    \ that the prompt requires repetitive input, such as `Tell me a bedside story\
