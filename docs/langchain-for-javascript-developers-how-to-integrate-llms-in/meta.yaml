    \ parsers.\n\nHowever, if we use another type of model, such as Llama (made by\
    \ Meta) or Claude (made by Anthropic), the structure can be different. Each model\
    \ may provide the answer wrapped in a different structure.\n\nThis means the line\
    \ that extracts the final string response may fail because the `text` property\
    \ might not exist:"
