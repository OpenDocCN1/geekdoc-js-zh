  - "[PAGE 31]\n\n# 2.7. LCEL - LangChain Expression Language\n\nThe LangChain Expression\
    \ Language, or LCEL, provides a simpler way to chain multiple custom components.\n\
    \nIn short, using LCEL, we can replace other classes, such as `LLMChain`, with\
    \ the `.pipe()` method to form a chain.\n\nLet's take another look at the chain\
    \ for the above example:\n\n```\nconst model = new ChatOpenAI({\n  openAIApiKey:\
    \ process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n\nconst prompt = new PromptTemplate({\n\
    \  inputVariables: [\"subject\"],\n  template: \"Tell me a story title about {subject}\"\
    \n})\n\nconst chain = new LLMChain({\n  llm: model,\n  prompt,\n})\n\nawait chain.invoke({subject})\n\
    ```\n\nWe can replace the `LLMChain` wrapper by using the `.pipe()` method. The\
    \ rest of the code remains the same:"
  - "[PAGE 32]\n\n```\n// BEFORE\nconst chain = new LLMChain({\n    llm: model,\n\
    \    prompt,\n})\nawait chain.invoke({subject})\n\n// AFTER\nconst chain = prompt.pipe(model)\n\
    await chain.invoke({subject})\n```\n\nLater, we will see that we can build more\
    \ complex chains by adding other types of nodes, such as output parsers.\n\nThe\
    \ output of a node in the chain becomes the input of the next node. The key element\
    \ of LCEL is the [RunnableInterface](RunnableInterface). It ensures that the nodes\
    \ in a chain have a common communication pattern.\n\nLCEL standardizes communication\
    \ and enables easy swapping of components within the LangChain framework. All\
    \ the components are modular. If something needs to be changed, only that part\
    \ of the code has to be replaced rather than the entire pipeline.\n\nIt also makes\
    \ the code cleaner.\n\nMany of the examples in this book will be made using LCEL\
    \ chains.\n\nIf you want to explore more on this topic, be sure to check out the\
    \ [official LCEL docs](official LCEL docs) and I've also written a few articles\
    \ on my blog:\n\n+   - [Nested Chains in LangChain JS – Passing the Output from\
    \ One Chain to Another](Nested Chains in LangChain JS – Passing the Output from\
    \ One Chain to Another)\n- [Custom Functions with RunnableLambda in LangChain\
    \ JS](Custom Functions with RunnableLambda in LangChain JS)\n- [RunnableMap and\
    \ RunnableParallel in LangChain JS](RunnableMap and RunnableParallel in LangChain\
    \ JS)\n- [Routing in LangChain JS – Use LLM Classifiers to Call Different Prompts](Routing\
    \ in LangChain JS – Use LLM Classifiers to Call Different Prompts)\n- [Using RunnableBranch\
