  md: '# 3.3. Streaming the response


    In some cases, AI models can take several seconds to generate a complete response
    to a prompt. This is slower than the ~200-300 ms threshold at which an app feels
    responsive to the end user.


    To make the app feel more responsive we need to show intermediate progress and
    stream the final output in chunks, yielding each chunk as soon as it is available.


    Not all models support streaming, so be sure to check if the model you use supports
    this feature.


    It''s time to add the streaming feature to our story generator app.


    Note that this will not be a single request-response interaction. It will be more
    like an ongoing chat. The frontend will keep requesting new LLM response chunks
    and update the ongoing result, while the backend sends back response chunks or
    indicates when the stream is finished.


    ![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_41_0.png)


    We will start with the backend. All the changes will be made in the `streamStory()`
    method we have defined during the previous step:


    ```

    // code/streaming/src/app/api/route.js


    // the rest remains the same

    ```'
  merge: -1
