  - "[PAGE 93]\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_93_0.png)\n\nEach point\
    \ is a vector with the following format:\n\n```\n[\n    x, // how big is the object\n\
    \    y  // how fast is the object\n]\n```\n\nEach axis of an embedding space is\
    \ also known as a dimension or a feature.\n\nKeep in mind that this representation\
    \ is very simplified. In general, each entry has many more dimensions, ranging\
    \ from tens to thousands, depending on the complexity and granularity of the data.\n\
    \nGiven a set of dimensions, similar objects are grouped together, allowing us\
    \ to map the semantic meaning of words or similar features in virtually any other\
    \ data type.\n\nUsing these embeddings we can do stuff such as recommendation\
    \ systems, search engines and even text generation like the one in Chat GPT."
- md: "## 6.6. Using CheerioWebBaseLoader and MemoryVectorStore\n\nBut once we have\
    \ our vector entries mapped to the dimensions of the embeddings, where do we store\
    \ them? And how can we query them quickly?\n\nWell, that's where vector databases\
    \ come in. In a classic relational database, we have rows and columns; in a vector\
    \ database, we have arrays of numbers (vectors) grouped together based on similarity.\n\
    \nOrganizing data this way allows us to make similar queries with ultra-low latency.\n\
    \nWe can easily retrieve the distance between these entries. This makes semantic\
    \ search faster as we can easily relate between different concepts based on one\
    \ or multiple dimensions.\n\nSome of the main vector databases we can use today:\n\
    \n- [Chroma](https://chroma.com)\n- [Pinecone](https://www.pinecone.io)\n- [Weaviate](https://weaviate.io)\n\
    - [Redis Vector Database](https://redis.io)\n\nIn the previous example, we used\
    \ just the document loaders and the retriever. Now, it's time to expand our example\
    \ and put the other RAG components to work.\n\nWe want to add the following features\
    \ to the app:\n\n- read a given URL provided by the user\n- load the content of\
    \ the page from the URL\n- create embeddings and store the results in the local\
    \ vector database\n- retrieve and answer questions from the new data\n\nThis is\
    \ how the final example will look like:\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_95_0.png)\n\
    \nWe'll start with the frontend. We will add a new button that asks for a URL\
    \ and sends it to the backend:\n\n```\n// code/rag/src/app/page.js\n\n'use client'\n\
    import { useState } from \"react\"\n\nexport default function Home() {\n  const\
    \ [answer, setAnswer] = useState()\n  // \U0001F535 add a new state variable\n\
    \  const [docStatus, setDocStatus] = useState(false)\n\n  const askQuestion =\
    \ async (e)=> {\n    e.preventDefault()\n    const question = e.target.question.value\n\
    \    const response = await fetch('api', {\n      method: \"POST\",\n      body:\
    \ JSON.stringify({question})\n    })\n    const {data} = await response.json()\n\
    \    setAnswer(data)\n  }\n\n  // \U0001F535 ask for the URL, pass it to the backend,\
    \ update the docStatus\n  const loadUrl = async (e)=> {\n    const url = prompt(\"\
    Please enter the URL for the document context:\")\n    const response = await\
    \ fetch('api', {\n      method: \"POST\",\n      body: JSON.stringify({url})\n\
    \    })\n    const { loaded } = await response.json()\n    setDocStatus(loaded\
    \ ? `✅ Loaded: ${url}` : false)\n  }\n\n  return (<>\n    <h1>\U0001F4C4 Documents\
    \ chatbot</h1>\n    {/* \U0001F535 ask for the URL and show the docStatus */}\n\
    \    <p>\n      <button onClick={loadUrl}>Load URL</button>\n      {docStatus}\n\
    \    </p>\n    <form onSubmit={askQuestion} >\n      <input name=\"question\"\
    \ />\n      {/* \U0001F34A disabled until we have a doc status*/}\n      <button\
    \ disabled={!docStatus}>\n        Ask chatbot\n      </button>\n    </form>\n\
    \    <p>{answer}</p>\n  </>)\n}\n```\n\nBy default, the ask-question form will\
    \ be disabled. Once the backend finishes loading the data from the URL it will\
    \ enable the question form:\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_97_0.png)\n\
    \nThe main difference is in the backend, where the model answers the question.\n\
    \nFirst, we will need to install the `CheerioWebBaseLoader`:\n\n```\nnpm install\
    \ --save cheerio\n```\n\nNow, let's first see the complete code, and we'll delve\
    \ into further explanations afterward:\n\n```\nimport { ChatOpenAI } from \"@langchain/openai\"\
    \nimport { ChatPromptTemplate } from \"@langchain/core/prompts\"\nimport { createStuffDocumentsChain\
    \ } from\n\"langchain/chains/combine_documents\"\n// document loader that can\
    \ retrieve the content of a web page\nimport { CheerioWebBaseLoader } from\n\"\
    langchain/document_loaders/web/cheerio\"\n// tool for making the vectors and embeddings\n\
    import { RecursiveCharacterTextSplitter } from\n\"langchain/text_splitter\"\n\
    import { OpenAIEmbeddings } from \"@langchain/openai\"\nimport { MemoryVectorStore\
    \ } from\n\"langchain/vectorstores/memory\"\n// retrieval tool\nimport { createRetrievalChain\
    \ } from\n\"langchain/chains/retrieval\"\n\nconst model = new ChatOpenAI({\n \
    \   openAIApiKey: process.env.OPENAI_API_KEY,\n    temperature: 0\n})\n\nconst\
    \ prompt = ChatPromptTemplate.fromTemplate(\n    `Answer the user's question from\
    \ the following context:\n    {context}\n    Question: {input}`\n)\n\nlet retrievalChain,\
    \ splitDocs\n\n// the RAG process\nasync function loadDocumentsFromUrl(url) {\n\
    \    // document loaders\n    const loader = new CheerioWebBaseLoader(url)\n \
    \   const docs = await loader.load()\n\n    // document transformers\n    const\
    \ splitter = new RecursiveCharacterTextSplitter({\n        chunkSize: 100,\n \
    \       chunkOverlap: 20,\n    })\n\n    splitDocs = await splitter.splitDocuments(docs)\n\
    \n    // \U0001F535 setting up the embeddings\n    const embeddings = new OpenAIEmbeddings()\n\
    \n    // \U0001F535 making a local vector DB\n    const vectorstore = await MemoryVectorStore.fromDocuments(\n\
    \        splitDocs,\n        embeddings\n    )\n\n    // \U0001F535 what we use\
    \ to fetch data from the vector DB\n    const retriever = vectorstore.asRetriever()\n\
    \n    const chain = await createStuffDocumentsChain({\n        llm: model,\n \
    \       prompt\n    })\n\n    retrievalChain = await createRetrievalChain({\n\
    \        combineDocsChain: chain,\n        retriever\n    })\n}\n\nexport async\
    \ function POST(req) {\n    const { question, url } = await req.json()\n    //\
    \ \U0001F535 if the user sends an url setup RAG and return\n    if (url) {\n \
    \       await loadDocumentsFromUrl(url);\n        return Response.json({ loaded:\
    \ true });\n    }\n    const data = await retrievalChain.invoke({\n        input:\
    \ question,\n        context: splitDocs\n    })\n    return Response.json({data:\
    \ data.answer})\n}\n```\n\nIn this code, we see in action the RAG components described\
    \ in the previous chapter.\n\nFirst, we load the raw text from the URL provided\
    \ by the user:\n\n```\nconst loader = new CheerioWebBaseLoader(url)\nconst docs\
    \ = await loader.load()\n```\n\nThis is just one type of loader LangChain provides.\
    \ You can see the full [list of loaders here](https://example.com).\n\nWe have\
    \ access to two types of loaders:\n\n- file loaders, such as CSVs, PDFs, EPUBs\
    \ etc\n- and web loaders, such as Figma, Amazon S3, Youtube transcripts etc\n\n\
    Once the raw text is loaded we start the process of transforming the text (understandable\
    \ by humans) into number vectors (understandable by AI):\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_100_0.png)\n\
    \nThis splitter is tailored for processing general text. It attempts to segment\
    \ the text at these characters sequentially until the resulting chunks reach an\
    \ optimal size.\n\nBy default, it employs a list comprising [\"\\n\\n\", \"\\\
    n\", \" \", \"\"]. This configuration aims to maintain the integrity of paragraphs\
    \ first, then sentences, and finally words, as these segments typically exhibit\
    \ the highest semantic cohesion.\n\nThe text is split by the list of characters,\
    \ and the chunk size is measured by the number of characters:\n\n```\nconst splitter\
    \ = new RecursiveCharacterTextSplitter({\n    chunkSize: 100,\n    chunkOverlap:\
    \ 20,\n})\nsplitDocs = await splitter.splitDocuments(docs)\nconst embeddings =\
    \ new OpenAIEmbeddings()\n```\n\nNext, we store all of these embeddings in a vector\
    \ database. For this small example, we used a local database. For production,\
    \ we can use a real vector DB service such as Chroma or Pinecone.\n\n```\nconst\
    \ vectorstore = await MemoryVectorStore.fromDocuments(\n    splitDocs,\n    embeddings\n\
    )\n```\n\nDo we have to recreate embeddings each time we run a RAG query? This\
    \ might work for small files, but for larger ones, the embedding creation process\
    \ could be very time-consuming.\n\nFor example, we can set a parameter during\
    \ the creation of a Chroma DB object, like `persist_directory`, specifying a valid\
    \ local path. This way, when you create your Vector DB using a file, it will be\
    \ stored in the specified location. Subsequently, it will be loaded from that\
    \ location the next time, significantly reducing processing time.\n\nThe `createRetrievalChain()`\
    \ takes a user inquiry, which is then passed to the retriever to fetch relevant\
    \ documents. Those documents (and original inputs) are then passed to an LLM to\
    \ generate a response.\n\nFinally, we will build a retriever that can be used\
    \ by a chain to fetch information from the vector database.\n\n```\nconst retriever\
    \ = vectorstore.asRetriever()\nconst chain = await createStuffDocumentsChain({\n\
    \    llm: model,\n    prompt\n})\nretrievalChain = await createRetrievalChain({\n\
    \    combineDocsChain: chain,\n    retriever\n})\n```\n\nAs a side note, Google's\
    \ Gemini 1.5 model has a million token contexts and is researching 10 million\
    \ tokens. It's so large that you can include an entire knowledge base, books,\
    \ or films without worrying about context limits. Some people think this will\
    \ make RAG obsolete. However, this is unlikely due to:\n\n1. \U0001F4B8 Costs\
    \ - you still pay per token. Google is like perfectly happy to let you pay a million\
    \ tokens every single time you make an API call. So, good luck having a $100 API\
    \ call.\n2. \U0001F40C Slow - the API call will be huuuuge, and the response will\
    \ be slow as well.\n3. \U0001F50D Troubleshooting - a very big context is not\
    \ debuggable. If something goes wrong, you can't do the RAG's decomposition to\
    \ see the source of the error.\n\nOne fun experiment could be to take a book like\
    \ this use one, and using RAG feed the content to an LLM model. A user can later\
    \ come and interact with that LLM to learn about LangChain using the approach\
    \ from this book. Or just ask the model for recap questions.\n\nMaybe this will\
    \ be the future of future of how we consume technical books."
  mdcn: "\n## 6.6. 使用 CheerioWebBaseLoader 和 MemoryVectorStore\n\n但是，一旦我们将向量条目映射到嵌入的维度，它们要存储在哪里？又如何快速查询它们呢？\n\
    \n这就要用到向量数据库了。在经典的关系型数据库中，我们有行和列；而在向量数据库中，我们有基于相似性分组的数字数组（向量）。\n\n以这种方式组织数据，使我们能够以超低延迟进行相似性查询。\n\
    \n我们可以轻松检索这些条目之间的距离。这使得语义搜索更快，因为我们能够基于一个或多个维度轻松关联不同的概念。\n\n目前我们可以使用的一些主要向量数据库包括：\n\
    \n- [Chroma](https://chroma.com)\n- [Pinecone](https://www.pinecone.io)\n- [Weaviate](https://weaviate.io)\n\
    - [Redis Vector Database](https://redis.io)\n\n在前面的例子中，我们只使用了文档加载器和检索器。现在，是时候扩展我们的示例，并让其他\
    \ RAG 组件发挥作用了。\n\n我们希望为应用添加以下功能：\n\n- 读取用户提供的给定 URL\n- 从该 URL 加载页面内容\n- 创建嵌入并将结果存储在本地向量数据库中\n\
    - 从新数据中检索并回答问题\n\n最终示例将如下所示：\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_95_0.png)\n\
    \n我们将从前端开始。我们将添加一个新按钮，用于请求 URL 并将其发送到后端：\n\n```\n// code/rag/src/app/page.js\n\
    \n'use client'\nimport { useState } from \"react\"\n\nexport default function\
    \ Home() {\n  const [answer, setAnswer] = useState()\n  // \U0001F535 添加一个新的状态变量\n\
    \  const [docStatus, setDocStatus] = useState(false)\n\n  const askQuestion =\
    \ async (e)=> {\n    e.preventDefault()\n    const question = e.target.question.value\n\
    \    const response = await fetch('api', {\n      method: \"POST\",\n      body:\
    \ JSON.stringify({question})\n    })\n    const {data} = await response.json()\n\
    \    setAnswer(data)\n  }\n\n  // \U0001F535 请求 URL，将其传递给后端，并更新 docStatus\n  const\
    \ loadUrl = async (e)=> {\n    const url = prompt(\"Please enter the URL for the\
    \ document context:\")\n    const response = await fetch('api', {\n      method:\
    \ \"POST\",\n      body: JSON.stringify({url})\n    })\n    const { loaded } =\
    \ await response.json()\n    setDocStatus(loaded ? `✅ Loaded: ${url}` : false)\n\
    \  }\n\n  return (<>\n    <h1>\U0001F4C4 Documents chatbot</h1>\n    {/* \U0001F535\
    \ 请求 URL 并显示 docStatus */}\n    <p>\n      <button onClick={loadUrl}>Load URL</button>\n\
    \      {docStatus}\n    </p>\n    <form onSubmit={askQuestion} >\n      <input\
    \ name=\"question\" />\n      {/* \U0001F34A 在有文档状态之前禁用 */}\n      <button disabled={!docStatus}>\n\
    \        Ask chatbot\n      </button>\n    </form>\n    <p>{answer}</p>\n  </>)\n\
    }\n```\n\n默认情况下，提问表单将被禁用。一旦后端完成从 URL 加载数据，它将启用提问表单：\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_97_0.png)\n\
    \n主要区别在于后端，即模型回答问题的地方。\n\n首先，我们需要安装 `CheerioWebBaseLoader`：\n\n```\nnpm install\
    \ --save cheerio\n```\n\n现在，让我们先看完整的代码，稍后再深入解释：\n\n```\nimport { ChatOpenAI }\
    \ from \"@langchain/openai\"\nimport { ChatPromptTemplate } from \"@langchain/core/prompts\"\
    \nimport { createStuffDocumentsChain } from\n\"langchain/chains/combine_documents\"\
    \n// 可以检索网页内容的文档加载器\nimport { CheerioWebBaseLoader } from\n\"langchain/document_loaders/web/cheerio\"\
    \n// 用于创建向量和嵌入的工具\nimport { RecursiveCharacterTextSplitter } from\n\"langchain/text_splitter\"\
    \nimport { OpenAIEmbeddings } from \"@langchain/openai\"\nimport { MemoryVectorStore\
    \ } from\n\"langchain/vectorstores/memory\"\n// 检索工具\nimport { createRetrievalChain\
    \ } from\n\"langchain/chains/retrieval\"\n\nconst model = new ChatOpenAI({\n \
    \   openAIApiKey: process.env.OPENAI_API_KEY,\n    temperature: 0\n})\n\nconst\
    \ prompt = ChatPromptTemplate.fromTemplate(\n    `Answer the user's question from\
    \ the following context:\n    {context}\n    Question: {input}`\n)\n\nlet retrievalChain,\
    \ splitDocs\n\n// RAG 过程\nasync function loadDocumentsFromUrl(url) {\n    // 文档加载器\n\
    \    const loader = new CheerioWebBaseLoader(url)\n    const docs = await loader.load()\n\
    \n    // 文档转换器\n    const splitter = new RecursiveCharacterTextSplitter({\n  \
    \      chunkSize: 100,\n        chunkOverlap: 20,\n    })\n\n    splitDocs = await\
    \ splitter.splitDocuments(docs)\n\n    // \U0001F535 设置嵌入\n    const embeddings\
    \ = new OpenAIEmbeddings()\n\n    // \U0001F535 创建一个本地向量数据库\n    const vectorstore\
    \ = await MemoryVectorStore.fromDocuments(\n        splitDocs,\n        embeddings\n\
    \    )\n\n    // \U0001F535 我们用于从向量数据库获取数据的工具\n    const retriever = vectorstore.asRetriever()\n\
    \n    const chain = await createStuffDocumentsChain({\n        llm: model,\n \
    \       prompt\n    })\n\n    retrievalChain = await createRetrievalChain({\n\
    \        combineDocsChain: chain,\n        retriever\n    })\n}\n\nexport async\
    \ function POST(req) {\n    const { question, url } = await req.json()\n    //\
    \ \U0001F535 如果用户发送了 URL，则设置 RAG 并返回\n    if (url) {\n        await loadDocumentsFromUrl(url);\n\
    \        return Response.json({ loaded: true });\n    }\n    const data = await\
    \ retrievalChain.invoke({\n        input: question,\n        context: splitDocs\n\
    \    })\n    return Response.json({data: data.answer})\n}\n```\n\n在这段代码中，我们看到了上一章描述的\
    \ RAG 组件在实际运行。\n\n首先，我们从用户提供的 URL 加载原始文本：\n\n```\nconst loader = new CheerioWebBaseLoader(url)\n\
    const docs = await loader.load()\n```\n\n这只是 LangChain 提供的一种加载器类型。你可以在此处查看完整的[加载器列表](https://example.com)。\n\
    \n我们有两类加载器可用：\n\n- 文件加载器，例如 CSV、PDF、EPUB 等\n- 以及网络加载器，例如 Figma、Amazon S3、Youtube\
    \ 字幕等\n\n一旦原始文本加载完成，我们就开始将文本（人类可理解）转换为数字向量（AI 可理解）的过程：\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_100_0.png)\n\
    \n这个分割器是为处理通用文本而设计的。它尝试按顺序在这些字符处分割文本，直到生成的文本块达到最佳大小。\n\n默认情况下，它使用包含 [\"\\n\\n\"\
    , \"\\n\", \" \", \"\"] 的列表。此配置旨在首先保持段落的完整性，然后是句子，最后是单词，因为这些片段通常表现出最高的语义连贯性。\n\
    \n文本按字符列表进行分割，块大小通过字符数来衡量：\n\n```\nconst splitter = new RecursiveCharacterTextSplitter({\n\
    \    chunkSize: 100,\n    chunkOverlap: 20,\n})\nsplitDocs = await splitter.splitDocuments(docs)\n\
    const embeddings = new OpenAIEmbeddings()\n```\n\n接下来，我们将所有这些嵌入存储在向量数据库中。在这个小例子中，我们使用了本地数据库。对于生产环境，我们可以使用真实的向量数据库服务，例如\
    \ Chroma 或 Pinecone。\n\n```\nconst vectorstore = await MemoryVectorStore.fromDocuments(\n\
    \    splitDocs,\n    embeddings\n)\n```\n\n我们每次运行 RAG 查询时都必须重新创建嵌入吗？这对于小文件可能适用，但对于较大的文件，创建嵌入的过程可能非常耗时。\n\
    \n例如，我们可以在创建 Chroma 数据库对象时设置一个参数，比如 `persist_directory`，指定一个有效的本地路径。这样，当你使用文件创建向量数据库时，它将被存储在指定的位置。之后，它将从该位置加载，从而显著减少处理时间。\n\
    \n`createRetrievalChain()` 接收用户的查询，然后将其传递给检索器以获取相关文档。这些文档（以及原始输入）随后被传递给大语言模型以生成响应。\n\
    \n最后，我们将构建一个检索器，供链用于从向量数据库中获取信息。\n\n```\nconst retriever = vectorstore.asRetriever()\n\
    const chain = await createStuffDocumentsChain({\n    llm: model,\n    prompt\n\
    })\nretrievalChain = await createRetrievalChain({\n    combineDocsChain: chain,\n\
    \    retriever\n})\n```\n\n顺便提一下，谷歌的 Gemini 1.5 模型拥有百万级令牌的上下文窗口，并且正在研究千万级令牌的上下文。它如此之大，以至于你可以包含整个知识库、书籍或电影，而无需担心上下文限制。有些人认为这会使\
    \ RAG 过时。然而，这不太可能，原因如下：\n\n1. \U0001F4B8 成本 - 你仍然需要为每个令牌付费。谷歌很可能很乐意让你每次 API 调用都支付一百万个令牌的费用。所以，祝你拥有一次\
    \ 100 美元的 API 调用好运。\n2. \U0001F40C 缓慢 - API 调用将非常巨大，响应也会很慢。\n3. \U0001F50D 故障排除\
    \ - 超大的上下文是不可调试的。如果出现问题，你无法像 RAG 那样分解它来查看错误来源。\n\n一个有趣的实验可以是拿一本像这样的书，使用 RAG 将其内容馈送给一个大语言模型。用户之后可以与那个大语言模型互动，使用这本书中的方法学习\
    \ LangChain。或者只是让模型提供复习问题。\n\n也许这将是我们未来消费技术书籍的方式。\n"
