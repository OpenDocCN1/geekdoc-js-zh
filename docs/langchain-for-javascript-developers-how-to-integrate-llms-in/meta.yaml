    # 6.4. Components of the RAG process


    Let''s take a look at the different component types involved in the RAG process:


    +   1. Document Loaders - think of these as your data gatherers. They pull in
    external info and load it up, whether it''s plain old .txt files, web page text,
    or even YouTube video transcripts.

    2. Transformers - you''ve got your docs loaded, but sometimes they need a little
    makeover to fit your app just right. LangChain''s pre-made transformers help you
    tweak the docs. A basic example can be to use a transformer to break down a big
    document into smaller segments that fit within your model''s contextual window.

    3. Embeddings - this is all about turning data into vectors. The Embeddings class
    is your go-to for working with embedding models like the ones from OpenAI, Meta,
    or those on Hugging Face. Think of text embeddings as a way to represent text
    or data in a vector space, making stuff like semantic search faster.

    4. Vector Databases - time to stash the text embeddings we have generated in the
    previous step. These specialized databases are built to store and fetch vector
    data efficiently. They make semantic searches easy and quick. We can pull up the
    most relevant text in a snap. We''ll dive deeper into vector databases later on.

    5. Retrievers - last but not least, meet your info-fetching sidekick: the retrievers.
    Unlike vector stores that just hold onto data, a retriever goes out and fetches
    the docs you need. While some retrievers might use vector stores, there are all
    kinds of retrievers tailored for specific tasks.'
  - '[PAGE 92]


    # 6.5. Vectors, Embeddings and Vector databases


    Before we continue, we need to make a short detour and discuss some fundamental
    concepts involved in the RAG process.


    We will start with vectors. A vector is simply an array of numbers.


    ```

    // this is how a vector looks like

    let vec = [2.5, 1.3, 7.0, 9.2]

    ```


    What''s cool about vectors is that they can represent more complex objects like
    words, sentences, audio files, or even images in a high-dimensional space called
    an embedding.


    For example, let''s take the following entries: `snail`, `plane`, `speed train`
    and `turtle`.


    We can store these entries in a two-dimensional embedding space based on:


    +   - how big they are

    - how fast they are


