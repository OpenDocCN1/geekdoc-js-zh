- img_proc: true
  md: "# # 7.3. Monitoring agents and performance considerations\n\nAgents are fantastic,\
    \ but they come at a cost. They can be:\n\n+   * \U0001F422 slow to respond\n\
    * ⚡️ have high computational costs\n* \U0001F3B2 sometimes can give random results\n\
    \nLuckily, we have a few ways to control the autonomous behavior of the agents.\n\
    \nLet's update the backend code with some monitoring and performance enhancements.\n\
    \nAdd the following lines in the constructor of the `AgentExecutor`:\n\n```\n\
    // code/agents/src/app/api/route.js\n\nconst agentExecutor = new AgentExecutor({\n\
    \  agent,\n  tools,\n  verbose: true,\n  returnIntermediateSteps:true,\n  maxIterations:\
    \ 4,\n})\n```\n\nAnd this code in the returned HTML of the frontend:"
  merge: -1
  pgno: 113
- img_proc: true
  md: "```\n// code/agents/src/app/page.js\ndata && (<div>\n  <p><b>❓ question:</b>\
    \ {data.input}</p>\n  <p><b>\U0001F916 answer:</b> {data.output}</p>\n  <p><b>\U0001F9F0\
    \ tools used:</b> {\n    data.intermediateSteps.map(step => step.action.tool)\n\
    \  }</p>\n</div>)\n```\n\nAt this point, if we ask the agent, \"How many years\
    \ have passed since Brazil won the World Cup?\" we will get the following result:\n\
    \n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_114_0.png)\n\nLet's talk a bit about\
    \ the added chances.\n\nFirst, the `maxIterations` option limits the number of\
    \ attempts an agent has to find the solution. This is a good option to speed up\
    \ the response and to ensure we do not run into an infinite loop."
  merge: -1
  pgno: 114
- img_proc: true
  md: "As in the previous use case, the `verbose` option prints - in the backend console\
    \ - the reasoning that leads to a given result. For example, when asked, \"What\
    \ is the double of PI?\" it will print something like this:\n\n```\n[chain/start]\
    \ [1:chain:AgentExecutor > 18:chain:ReactAgent > 22:prompt:PromptTemplate] Entering\
    \ Chain run with input: {\n  \"input\": \"What is the double of PI?\",\n  \"steps\"\
    : [\n    {\n      \"action\": {\n        \"tool\": \"wikipedia-api\",\n      \
    \  \"toolInput\": \"PI\",\n        \"log\": \"PI is a mathematical constant that\
    \ can be found on Wikipedia\\nAction: wikipedia-api\\nAction Input: PI\"\n   \
    \   },\n      {\n        \"action\": {\n          \"tool\": \"calculator\",\n\
    \          \"toolInput\": \"2*3.14159\",\n          \"log\": \"I know that PI\
    \ is approximately equal to 3.14159, so I can calculate the double of it\\nAction:\
    \ calculator\\nAction Input: 2*3.14159\"\n        },\n      ],\n      \"content\"\
    : \"I now know the final answer\\nFinal Answer: 6.28318\"\n}\n```\n\nThis is quite\
    \ cool, isn't it?\n\nAnd the third option, the `returnIntermediateSteps` (documentation\
    \ [link here](https://docs.python.langchain.com)) prints the tools used by the\
    \ agent and their order. Agents are autonomous and can decide their own set of\
    \ actions.\n\nFor example, the Wikipedia tool was enough to respond to the question,\
    \ \"Who won the Super Bowl in 2024?\" On the other hand, the question, \"How many\
    \ years have passed since Brazil won the World Cup?\" required the use of both\
    \ Wikipedia and the Calculator tools. With this option, we can monitor"
  merge: -1
  pgno: 115
- img_proc: true
  md: if the agent is using the correct tools for the job.
  merge: -1
  pgno: 116
- img_proc: true
  md: "# 7.4. Recap\n\nAgents and tool use in general, are key concepts of LangChain.\n\
    \nAt a high level agents involve using a LLM and asking it to reason about which\
    \ actions to take and then executing those actions. Often this is done in a loop\
    \ that repeats until the LLM decides it has reached the objectives, or there are\
    \ no other actions it can take.\n\nThe tools are representations of actions a\
    \ language model can take, along with the functions that implement those actions.\n\
    \nAgents and tools are combined with an agent executor. This agent executor is\
    \ essentially a loop that runs to call an LLM to figure out what tool the agent\
    \ should try to use next unless it has reached its objective.\n\nAgents are constructed\
    \ based on prompts, as you may have noticed from the code:\n\n```\nconst prompt\
    \ = await pull(\"hwchase17/react\")\n\nconst agent = await createReactAgent({\n\
    \  llm: model,\n  tools,\n  prompt\n})\n```\n\nThere are many different agent\
    \ types. You can see the five main types of agents available at this moment on\
    \ [this page](https://python.langchain.com/docs/modules/agents/agent_types/)."
  merge: -1
  pgno: 117
- img_proc: true
  md: '# When to Use


    Our commentary on when you should consider using this agent type.


    | Agent Type | Intended Model Type | Supports Chat History | Supports Multi-Input
    Tools | Supports Parallel Function Calling | Required Model Params |

    |---|---|---|---|---|---|

    | OpenAI Tools | Chat | ✅ | ✅ | ✅ | `tools` |


    Some are good for local models, some are good for the newest OpenAI models, some
    support parallel function calling, and some support conversational history. Others
    are great for using simple tools and single inputs because of their general prompting
    strategies.


    When discussing AI agents, please note that there are many other topics, concepts,
    techniques, prompts, and features. What we have discussed in this chapter is just
    a very brief introduction to the subject.'
  merge: -1
  pgno: 118
