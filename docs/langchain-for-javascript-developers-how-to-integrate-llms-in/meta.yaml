  md: '# 1.4. What is LangChain


    LangChain is a framework designed to simplify the creation of applications that
    integrate Large Language Models (LLMs).


    LangChain provides all the AI integration building blocks in one framework. It
    offers a modular, flexible, and scalable architecture that is easy to maintain.


    You can see LangChain as the glue layer for almost everything in the AI ecosystem.


    By learning LangChain, you will gain a deep understanding of the structure, workflows,
    and practices of AI Engineering.


    Some use cases for LangChain include:


    +   * LLMs are trained on human-written unstructured text. While this works well
    for human interactions, it may not work well for sending unformatted text to an
    API. APIs instead of structured data like JSON. LangChain can format the input
    and output in LLM interactions.

    * LLMs are stateless. They don''t remember who you are or what you said a few
    seconds ago. LangChain provides support for both long-term and short-term memory.

    * LLMs can be slow. LangChain can stream responses as they are generated, providing
    fast feedback to the user.

    * LLMs have knowledge cutoff dates. For example, GPT 3.5 does not have training
    data after 2021. And GPT-4o does not know anything after Oct 2023. With LangChain,
    we can create and manage AI Agents that go online, search for information, and
    use tools to parse that information.

    * We can chain multiple LLMs together. For example, we can generate an article
    with Google''s Gemini model and then pass the text to Midjourney to generate images
    for that article.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '+   - LLMs lack access to internal organization documents. We can use Retrieval-Augmented
    Generation (RAG) to provide extra context to a model, allowing it to interact
    with users based on an organization''s rules and knowledge. LangChain has a great
    toolset for RAG operations.


    LangChain standardizes operations like the ones above, making it easy to swap
    components as needed. Want to use a different LLM because it''s better or cheaper?
    Want to change the vector database to store the RAG embeddings? No problem, LangChain
    has you covered.


    LangChain abstracts and standardizes common patterns when working with LLMs. Remember
    the old days with browser incompatibilities? Then jQuery appeared. This is what
    LangChain aims to do for LLM integration.


    While it is possible to create any app without LangChain, it simplifies the process
    to a great extent and is much better than manual prompting.


    If you want to delve deeper into the subject, I recommend listening to the [episode
    with Harrison Chase, the founder of LangChain](https://latent.space/) from the
    excellent Latent Space podcast.'
  merge: -1
