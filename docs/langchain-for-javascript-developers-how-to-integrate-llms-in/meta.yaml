    \ to the classic way of programming, an LLM can give a different output to the\
    \ same input. LLMs work by estimating stuff, it's all probabilistic.\n\nAnother\
    \ test could involve requesting story a title such as:\n\n```\n\"Tell me a bedside\
    \ story title about unicorns.\"\n```\n\nOr:\n\n```\n\"Tell me a bedside story\
    \ title about cats.\"\n```\n\nGive it a shot and see how it goes."
  - "[PAGE 23]\n\n# 2.5. Prompt templates\n\nYou'll soon notice that the prompt requires\
    \ repetitive input, such as `Tell me a bedside story title about ...` followed\
    \ by the main subject.\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_23_0.png)\n\
    \nThis redundancy can be addressed using prompt templates, which we'll explore\
    \ next.\n\nBefore we move to the next chapter let's add a small tweak to our app.\
    \ Will display the story title given by the LLM in the UI using a React state\
    \ variable.\n\nThis is the full code with the highlighted additions:\n\n```\n\
    //code/story-generator/src/app/page.js\n\n'use client'\nimport { useState } from\
    \ \"react\"\n\nexport default function Home() {\n  //\U0001F7E0 adding the React\
    \ state variable\n  const [storyTitle, setStoryTitle] = useState()\n\n  const\
    \ onSubmitHandler = async (e)=> {\n    e.preventDefault()\n    const subject =\
    \ e.target.subject.value\n    const response = await fetch('api', {\n      method:\
    \ \"POST\",\n      body: JSON.stringify({ subject })\n    })\n    const { data\
    \ } = await response.json()\n    //\U0001F7E0 update the React state when we have\
    \ the LLM's answer\n    setStoryTitle(data)\n  }\n}\n```"
