- md: "## \U0001F5A5️ Documents chatbot\n\nThis is how the initial setup of the app\
    \ looks:\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_85_0.png)\n\nWhile this works\
    \ as expected for simple questions, the limits of the model become visible when\
    \ we ask about topics outside its training data.\n\nFor example, if we ask about\
    \ LangSmith, a platform for deploying and monitoring LLM applications, it will\
    \ give general answers like the one below:\n\nWhat is LangSmith ?\n\nAsk chatbot\n\
    \nLangSmith is a language learning platform that offers courses and resources\
    \ for individuals looking to improve their language skills. It provides a variety\
    \ of lessons, exercises, and interactive tools to help users learn and practice\
    \ languages effectively.\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_86_0.png)\n\
    \n✋ not the answer we are searching for!\n\nYou may say that we could try to use\
    \ a newer model. For example, we could try to use a gpt-4o model, which has its\
    \ training data up to October 2023. Most likely, it will know something about\
    \ LangSmith. However, the core problem will remain: we will always play catch-up\
    \ with the cutoff date of the models.\n\nTherefore, it's time to bring in the\
    \ Retrieval Augmented Generation!\n\nWe can use RAG to add new information to\
    \ the model and overcome its limitations. This information can be:\n\n-   after\
    \ the cut-off date of the model training\n-   outside the domain of the initial\
    \ training data\n\nSo, let's explain to our model what LangSmith is.\n\n### 6.3.\
    \ Using local documents\n\nOne of the easiest ways to expand the context of an\
    \ LLM with LangChain is by using local documents.\n\nWe can create small pieces\
    \ of information and feed them to the LLM:\n\n```javascript\n// manualy create\
    \ static documents\nconst documentA = new Document({\n  pageContent:\n    `LangSmith\
    \ is a unified DevOps platform for developing,\n    collaborating, testing, deploying,\
    \ and monitoring\n    LLM applications.`\n})\n\nconst documentB = new Document({\n\
    \  pageContent: `LangSmith was first launched in closed beta in\n  July 2023`\n\
    })\n```\n\nIn this example, we have used simple text pieces, but we can also have\
    \ locally stored PDFs, CSVs, and other types of files. We can even include videos\
    \ and audio, which can contain a larger quantity of information.\n\nLet's see\
    \ how all of this comes together in backend code:\n\n```javascript\n// code/rag/src/app/api/route.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { ChatPromptTemplate\
    \ } from \"@langchain/core/prompts\"\n// we need the this one to create local\
    \ documents\nimport { Document } from \"@langchain/core/documents\"\n// createStuffDocumentsChain\
    \ replaces LLMChain\nimport { createStuffDocumentsChain } from\n\"langchain/chains/combine_documents\"\
    \n\nconst model = new ChatOpenAI({\n    openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \    // \U0001F7E0 zero temperature, no extra creativity\n    temperature: 0\n\
    })\n\n// \U0001F7E0 adding the extra context to the prompt\nconst prompt = ChatPromptTemplate.fromTemplate(\n\
    \  `Answer the user's question from the following context:\n  {context}\n  Question:\
    \ {input}`\n)\n\n// \U0001F7E0 manually create static documents\nconst documentA\
    \ = new Document({\n  pageContent:\n  `LangSmith is a unified DevOps platform\
    \ for developing,\n  collaborating, testing, deploying, and monitoring\n  LLM\
    \ applications.`\n})\n\nconst documentB = new Document({\n  pageContent: `LangSmith\
    \ was first launched in closed beta in\n  July 2023`\n})\n\n// \U0001F7E0 updating\
    \ the chain type\nconst chain = await createStuffDocumentsChain({\n  llm: model,\n\
    \  prompt,\n})\n\nexport async function POST(req) {\n  const { question } = await\
    \ req.json()\n  // \U0001F7E0 pass the documents array as the context\n  const\
    \ data = await chain.invoke({\n    input: question,\n    context: [documentA,\
    \ documentB]\n  })\n  return Response.json({data})\n}\n```\n\nNote that a chain\
    \ made with `createStuffDocumentsChain()` expects to receive a `context` variable\
    \ when you are calling its `invoke()` method.\n\nFailing to do so will result\
    \ in the following error:\n\n```\nError: Prompt must include a context variable\n\
    ```\n\nThe `createStuffDocumentsChain()` takes a list of documents and formats\
    \ them all into a prompt, then passes that prompt to an LLM. It passes ALL documents,\
    \ so you should make sure it fits within the context length of the LLM you are\
    \ using.\n\nContext length refers to the maximum number of words a model can handle\
    \ at once. Think of it as the model's memory or attention span. This is a predetermined\
    \ feature in transformer-based models such as ChatGPT and Llama.\n\nBelow are\
    \ the default context lengths of some popular LLMs:\n\n| Model | Context Size\
    \ | Number of pages* |\n| :--- | :--- | :--- |\n| \U0001F916 GPT 3.5 | 4,096 |\
    \ 6 |\n| \U0001F916 GPT 4 | 8,192 | 12 |\n| \U0001F916 GPT 4-32k | 32,768 | 49\
    \ |\n| \U0001F999 Llama 1 | 2,048 | 3 |\n| \U0001F999 Llama 2 | 4,096 | 6 |\n\
    | \U0001F999 Llama 3 | 8,192 | 12 |\n| * 500 words per page | | |\n\nExpanding\
    \ the context does not retrain the model; the weights remain unchanged in this\
    \ process.\n\nThe frontend will remain the same. We simply pass in the question\
    \ and display the answer.\n\nLet's test it out. Will ask it again `what is LangSmith?`\
    \ and will now get an answer from the local documents we have just created:\n\n\
    ```javascript\nconst documentA = new Document({\n  pageContent:\n    `LangSmith\
    \ is a unified DevOps platform for developing,\n    collaborating, testing, deploying,\
    \ and monitoring\n    LLM applications.`\n})\n```\n\n### 6.4. Components of the\
    \ RAG process\n\nLet's take a look at the different component types involved in\
    \ the RAG process:\n\n1.  **Document Loaders** - think of these as your data gatherers.\
    \ They pull in external info and load it up, whether it's plain old .txt files,\
    \ web page text, or even YouTube video transcripts.\n2.  **Transformers** - you've\
    \ got your docs loaded, but sometimes they need a little makeover to fit your\
    \ app just right. LangChain's pre-made transformers help you tweak the docs. A\
    \ basic example can be to use a transformer to break down a big document into\
    \ smaller segments that fit within your model's contextual window.\n3.  **Embeddings**\
    \ - this is all about turning data into vectors. The Embeddings class is your\
    \ go-to for working with embedding models like the ones from OpenAI, Meta, or\
    \ those on Hugging Face. Think of text embeddings as a way to represent text or\
    \ data in a vector space, making stuff like semantic search faster.\n4.  **Vector\
    \ Databases** - time to stash the text embeddings we have generated in the previous\
    \ step. These specialized databases are built to store and fetch vector data efficiently.\
    \ They make semantic searches easy and quick. We can pull up the most relevant\
    \ text in a snap. We'll dive deeper into vector databases later on.\n5.  **Retrievers**\
    \ - last but not least, meet your info-fetching sidekick: the retrievers. Unlike\
    \ vector stores that just hold onto data, a retriever goes out and fetches the\
    \ docs you need. While some retrievers might use vector stores, there are all\
    \ kinds of retrievers tailored for specific tasks.\n\n### 6.5. Vectors, Embeddings\
    \ and Vector databases\n\nBefore we continue, we need to make a short detour and\
    \ discuss some fundamental concepts involved in the RAG process.\n\nWe will start\
    \ with vectors. A vector is simply an array of numbers.\n\n```javascript\n// this\
    \ is how a vector looks like\nlet vec = [2.5, 1.3, 7.0, 9.2]\n```\n\nWhat's cool\
    \ about vectors is that they can represent more complex objects like words, sentences,\
    \ audio files, or even images in a high-dimensional space called an embedding.\n\
    \nFor example, let's take the following entries: `snail`, `plane`, `speed train`\
    \ and `turtle`.\n\nWe can store these entries in a two-dimensional embedding space\
    \ based on:\n\n-   how big they are\n-   how fast they are\n\nA visual representation\
    \ might look like this:\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_93_0.png)\n\
    \nEach point is a vector with the following format:\n\n```javascript\n[\n    x,\
    \ // how big is the object\n    y  // how fast is the object\n]\n```\n\nEach axis\
    \ of an embedding space is also known as a dimension or a feature.\n\nKeep in\
    \ mind that this representation is very simplified. In general, each entry has\
    \ many more dimensions, ranging from tens to thousands, depending on the complexity\
    \ and granularity of the data.\n\nGiven a set of dimensions, similar objects are\
    \ grouped together, allowing us to map the semantic meaning of words or similar\
    \ features in virtually any other data type.\n\nUsing these embeddings we can\
    \ do stuff such as recommendation systems, search engines and even text generation\
    \ like the one in Chat GPT."
