  - "[PAGE 25]\n\nLanguage models use text as input. That text is called a prompt.\
    \ It's not just a fixed string, though. Usually, it's a mix of a template, examples,\
    \ and what the user adds.\n\nWith templates, we can streamline the prompting process,\
    \ making sure that users don't have to repetitively type the same prefix for each\
    \ request.\n\nFor our particular use case, the prompt template will look like\
    \ so:\n\n```\n`Tell me a story title about {subject}`\n```\n\nAll the chances\
    \ we need to make are in the backend:\n\n```\n//code/story-generator/src/app/api/route.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\n//\U0001F534 we will use the\
    \ PromptTemplate to avoid repetition\nimport { PromptTemplate } from \"@langchain/core/prompts\"\
    \n\nconst model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \  temperature: 0.9\n})\n//\U0001F534 establishing the general format of the template\n\
    const prompt = new PromptTemplate({\n  inputVariables: [ \"subject\"],\n  template:\
    \ \"Tell me a story title about {subject}\"\n})\n\nexport async function POST(req)\
    \ {\n    const { subject } = await req.json()\n    //\U0001F534 passing down the\
    \ { subject } parameter\n    const formattedPrompt = await prompt.format({\n \
    \       subject\n    })\n    const gptResponse = await model.invoke(formattedPrompt)\n\
    \    return Response.json({data: gptResponse.content})\n}\n```"
  - "[PAGE 26]\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_26_0.png)\n\nThe default\
    \ format of writing prompt templates is the F-String format, popular in Python.\
    \ If you want to use the more familiar double curly braces JavaScript Mustache\
    \ format you can have:\n\n```\nconst prompt = PromptTemplate.fromTemplate(\n \
    \ inputVariables: [ \"subject\"],\n  template: \"Tell me a story title about {{subject}}\"\
    ,\n  {\n    templateFormat: \"mustache\"\n  }\n)\n```\n\nIf you want to read more\
    \ you can take a look at the quick start guide from the documentation."
- md: "## 2.6. Chains\n\nChains refer to sequences of calls - whether to an LLM, a\
    \ tool, or a data preprocessing step.\n\nThey are a vital core concept of LangChain\
    \ and can be seen as short programs written around LLMs to execute complex tasks.\n\
    \nSpeaking of chains, here's a fun fact about LangChain's logo: The parrot and\
    \ a chain link were inspired by people calling LLMs \"stochastic parrots\". These\
    \ models can mimic human writing but don't truly understand what they're saying.\
    \ This library aims to \"chain\" these \"parrots\" together to produce more meaningful\
    \ and useful outputs.\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_27_0.png)\n\n\
    The output of one link from the chain becomes the input for the next link.\n\n\
    Let's say we need to create an article for a magazine. We will follow these steps:\n\
    \n1. Use ChatGPT to generate the article title.\n2. Pass this title to a local\
    \ LLM to compose the actual article, utilizing internal documents.\n3. Pass the\
    \ article to Midjourney, another LLM, to generate images for the article.\n\n\
    Let's see how to add a chain to our backend code:\n\n```javascript\nimport { ChatOpenAI\
    \ } from \"@langchain/openai\"\nimport { PromptTemplate } from \"@langchain/core/prompts\"\
    \n//\U0001F534 using the LLMChain; maybe the most straightforward chain\nimport\
    \ { LLMChain } from \"langchain/chains\"\n\nconst model = new ChatOpenAI({\n \
    \ openAIApiKey: process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n\nconst prompt\
    \ = new PromptTemplate({\n  inputVariables: [ \"subject\"],\n  template: \"Tell\
    \ me a story title about {subject}\"\n})\n\n//\U0001F534 a chain that links the\
    \ model, the prompt and the verbose option\nconst chain = new LLMChain({\n  llm:\
    \ model,\n  prompt,\n  //\U0001F534 use verbose to debug the chain\n  verbose:\
    \ true\n})\n\nexport async function POST(req) {\n  const { subject } = await req.json()\n\
    \  //\U0001F534 invoking the chain\n  const gptResponse = await chain.invoke({subject})\n\
    \  return Response.json({data: gptResponse.text})\n}\n```\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_29_0.png)\n\
    \nYou may encounter some examples online that utilize the `chain.call()` method\
    \ instead of `chain.invoke()`. Please note that `.call()` is deprecated and will\
    \ be removed.\n\nThe `verbose: true` option is optional. If enabled, it will provide\
    \ additional details about the chain in the backend console. This information\
    \ includes:\n\n- the input and output for each step of the chain\n- how long each\
    \ step took\n- the `tokenUsage` variable\n\nThis last point is important because\
    \ we pay to use the LLM's API with tokens. On average, 100 words are roughly 130\
    \ tokens. A helpful tool for managing tokens is the [OpenAI Tokenizer](https://platform.openai.com/tokenizer).\
    \ The `tokenUsage` is divided into how much the input prompt used and how much\
    \ the actual response used:\n\n```json\n\"llmOutput\": {\n  \"tokenUsage\": {\n\
    \    \"completionTokens\": 14,\n    \"promptTokens\": 14,\n    \"totalTokens\"\
    : 28\n  }\n}\n```\n\nIn the frontend code, we will simply replace the text input\
    \ with a select box to facilitate data entry:\n\n```javascript\nexport default\
    \ function Home() {\n  // the rest remains the same\n  // ...\n\n  return (\n\
    \    <>\n      <h1>\U0001F984 The Story Maker</h1>\n      <em>This app uses a\
    \ GPT Model to generate a story for kids.</em>\n      {/* \U0001F34A adding a\
    \ select box to make the data entry faster */}\n      <form onSubmit={onSubmitHandler}>\n\
    \        Main subject of the story:\n        <select name=\"subject\">\n     \
    \     <option value=\"cats\">\U0001F431 Cats</option>\n          <option value=\"\
    unicorns\">\U0001F984 Unicorns</option>\n          <option value=\"elfs\">\U0001F9DD\
    ‍♀️ Elfs</option>\n        </select>\n        <button>\U0001F916 Ask AI Model</button>\n\
    \      </form>\n      <p>{ storyTitle }</p>\n    </>\n  )\n}\n```\n\n## 2.7. LCEL\
    \ - LangChain Expression Language\n\nThe LangChain Expression Language, or LCEL,\
    \ provides a simpler way to chain multiple custom components.\n\nIn short, using\
    \ LCEL, we can replace other classes, such as `LLMChain`, with the `.pipe()` method\
    \ to form a chain.\n\nLet's take another look at the chain for the above example:\n\
    \n```javascript\nconst model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \  temperature: 0.9\n})\n\nconst prompt = new PromptTemplate({\n  inputVariables:\
    \ [\"subject\"],\n  template: \"Tell me a story title about {subject}\"\n})\n\n\
    const chain = new LLMChain({\n  llm: model,\n  prompt,\n})\n\nawait chain.invoke({subject})\n\
    ```\n\nWe can replace the `LLMChain` wrapper by using the `.pipe()` method. The\
    \ rest of the code remains the same:\n\n```javascript\n// BEFORE\nconst chain\
    \ = new LLMChain({\n    llm: model,\n    prompt,\n})\nawait chain.invoke({subject})\n\
    \n// AFTER\nconst chain = prompt.pipe(model)\nawait chain.invoke({subject})\n\
    ```\n\nLater, we will see that we can build more complex chains by adding other\
    \ types of nodes, such as output parsers.\n\nThe output of a node in the chain\
    \ becomes the input of the next node. The key element of LCEL is the [RunnableInterface](RunnableInterface).\
    \ It ensures that the nodes in a chain have a common communication pattern.\n\n\
    LCEL standardizes communication and enables easy swapping of components within\
    \ the LangChain framework. All the components are modular. If something needs\
    \ to be changed, only that part of the code has to be replaced rather than the\
    \ entire pipeline.\n\nIt also makes the code cleaner.\n\nMany of the examples\
    \ in this book will be made using LCEL chains.\n\nIf you want to explore more\
    \ on this topic, be sure to check out the [official LCEL docs](official LCEL docs)\
    \ and I've also written a few articles on my blog:\n\n- [Nested Chains in LangChain\
    \ JS – Passing the Output from One Chain to Another](Nested Chains in LangChain\
    \ JS – Passing the Output from One Chain to Another)\n- [Custom Functions with\
    \ RunnableLambda in LangChain JS](Custom Functions with RunnableLambda in LangChain\
    \ JS)\n- [RunnableMap and RunnableParallel in LangChain JS](RunnableMap and RunnableParallel\
    \ in LangChain JS)\n- [Routing in LangChain JS – Use LLM Classifiers to Call Different\
    \ Prompts](Routing in LangChain JS – Use LLM Classifiers to Call Different Prompts)\n\
    - [Using RunnableBranch to Route Execution to Different Prompts in LangChain.js](Using\
    \ RunnableBranch to Route Execution to Different Prompts in LangChain.js)\n\n\
    ![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_33_0.png)\n\nThis concludes our first\
    \ small app with JavaScript, LangChain, and ChatGPT. We have learned how to:\n\
    \n- bootstrap and connect a web app app to an LLM.\n- utilize LangChain's prompt\
    \ templates to prevent repetition\n- and create our first chain.\n\nIn the next\
    \ chapter, we will expand this application to generate the actual story body and\
    \ integrate data streams.\n\n# 3. Streams in LangChain\n\n## 3.1. Introduction\
    \ and project setup\n\nSome answers may take a lot of time to be generated by\
    \ an LLM. For instance, if you request the model to craft a complex response like\
    \ a poem or summarize a document.\n\nGiven the way LLMs work, we don't have to\
    \ wait for the full answer to be complete. Have you noticed that when you ask\
    \ ChatGPT something you will see that typewriter effect, wherein each word appears\
    \ gradually on the screen?\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_35_0.png)\n\
    \nA Large Language Model does not reason like a human. It does not first build\
    \ the full response and then explain it. Nor does it map the answer to a knowledge\
    \ graph or something similar. It just adds one token at a time to the answer.\n\
    \nThis is great because we can use this streaming behavior to update the UI as\
    \ soon as we have new info to show to the user.\n\nReturning to the story generator\
    \ example, let's say we want to make a story named `The Secret of the Silver Elves`.\
    \ Instead of waiting for the full story to be generated, we can stream the story\
    \ while it is written:\n\n```\nOnce upon a time\n...\n...\nOnce upon a time, in\
    \ a mystical forest\n...\n...\nOnce upon a time, in a mystical forest hidden deep\
    \ within the mountains\n...\n...\nOnce upon a time, in a mystical forest hidden\
    \ deep within the mountains, there lived a clan of silver elves.\n```\n\nIn this\
    \ chapter, we will implement the streaming feature. This is how the UI of the\
    \ app will look like at the end:\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_36_0.png)"
  mdcn: "\n## 2.6. 链\n\n链指的是调用序列——无论是调用大语言模型、工具还是数据预处理步骤。\n\n它们是LangChain至关重要的核心概念，可以看作是围绕大语言模型编写的、用于执行复杂任务的简短程序。\n\
    \n说到链，这里有个关于LangChain标志的趣闻：鹦鹉和链条的灵感来源于人们称大语言模型为“随机鹦鹉”。这些模型能模仿人类写作，但并不真正理解它们在说什么。这个库旨在将这些“鹦鹉”“链接”在一起，以产生更有意义和有用的输出。\n\
    \n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_27_0.png)\n\n链中一个环节的输出成为下一个环节的输入。\n\
    \n假设我们需要为一本杂志创建一篇文章。我们将遵循以下步骤：\n\n1. 使用ChatGPT生成文章标题。\n2. 将此标题传递给一个本地大语言模型，利用内部文档来撰写实际文章。\n\
    3. 将文章传递给Midjourney（另一个大语言模型），为文章生成图片。\n\n让我们看看如何将链添加到我们的后端代码中：\n\n```javascript\n\
    import { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate } from\
    \ \"@langchain/core/prompts\"\n//\U0001F534 使用 LLMChain；可能是最直接的链\nimport { LLMChain\
    \ } from \"langchain/chains\"\n\nconst model = new ChatOpenAI({\n  openAIApiKey:\
    \ process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n\nconst prompt = new PromptTemplate({\n\
    \  inputVariables: [ \"subject\"],\n  template: \"Tell me a story title about\
    \ {subject}\"\n})\n\n//\U0001F534 一个将模型、提示词模板和详细日志选项链接起来的链\nconst chain = new\
    \ LLMChain({\n  llm: model,\n  prompt,\n  //\U0001F534 使用 verbose 来调试链\n  verbose:\
    \ true\n})\n\nexport async function POST(req) {\n  const { subject } = await req.json()\n\
    \  //\U0001F534 调用链\n  const gptResponse = await chain.invoke({subject})\n  return\
    \ Response.json({data: gptResponse.text})\n}\n```\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_29_0.png)\n\
    \n你可能会在网上遇到一些使用 `chain.call()` 方法而不是 `chain.invoke()` 的示例。请注意，`.call()` 已弃用，将来会被移除。\n\
    \n`verbose: true` 选项是可选的。如果启用，它将在后端控制台中提供关于链的额外详细信息。这些信息包括：\n\n- 链中每一步的输入和输出\n\
    - 每一步花费的时间\n- `tokenUsage` 变量\n\n最后一点很重要，因为我们使用大语言模型的API时需要按token付费。平均而言，100个英文单词大约相当于130个token。一个用于管理token的有用工具是\
    \ [OpenAI Tokenizer](https://platform.openai.com/tokenizer)。`tokenUsage` 被分为输入提示词使用了多少token和实际响应使用了多少token：\n\
    \n```json\n\"llmOutput\": {\n  \"tokenUsage\": {\n    \"completionTokens\": 14,\n\
    \    \"promptTokens\": 14,\n    \"totalTokens\": 28\n  }\n}\n```\n\n在前端代码中，我们将简单地用一个选择框替换文本输入，以方便数据输入：\n\
    \n```javascript\nexport default function Home() {\n  // 其余部分保持不变\n  // ...\n\n\
    \  return (\n    <>\n      <h1>\U0001F984 The Story Maker</h1>\n      <em>This\
    \ app uses a GPT Model to generate a story for kids.</em>\n      {/* \U0001F34A\
    \ 添加一个选择框以加快数据输入速度 */}\n      <form onSubmit={onSubmitHandler}>\n        Main\
    \ subject of the story:\n        <select name=\"subject\">\n          <option\
    \ value=\"cats\">\U0001F431 Cats</option>\n          <option value=\"unicorns\"\
    >\U0001F984 Unicorns</option>\n          <option value=\"elfs\">\U0001F9DD‍♀️\
    \ Elfs</option>\n        </select>\n        <button>\U0001F916 Ask AI Model</button>\n\
    \      </form>\n      <p>{ storyTitle }</p>\n    </>\n  )\n}\n```\n\n## 2.7. LCEL\
    \ - LangChain 表达式语言\n\nLangChain表达式语言，或LCEL，提供了一种更简单的方式来链接多个自定义组件。\n\n简而言之，使用LCEL，我们可以使用\
    \ `.pipe()` 方法来替换其他类（如 `LLMChain`），从而形成一个链。\n\n让我们再看一下上面示例的链：\n\n```javascript\n\
    const model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \  temperature: 0.9\n})\n\nconst prompt = new PromptTemplate({\n  inputVariables:\
    \ [\"subject\"],\n  template: \"Tell me a story title about {subject}\"\n})\n\n\
    const chain = new LLMChain({\n  llm: model,\n  prompt,\n})\n\nawait chain.invoke({subject})\n\
    ```\n\n我们可以使用 `.pipe()` 方法来替换 `LLMChain` 包装器。其余代码保持不变：\n\n```javascript\n// 之前\n\
    const chain = new LLMChain({\n    llm: model,\n    prompt,\n})\nawait chain.invoke({subject})\n\
    \n// 之后\nconst chain = prompt.pipe(model)\nawait chain.invoke({subject})\n```\n\
    \n稍后，我们将看到通过添加其他类型的节点（如输出解析器），我们可以构建更复杂的链。\n\n链中一个节点的输出成为下一个节点的输入。LCEL的关键元素是 [RunnableInterface](RunnableInterface)。它确保链中的节点具有通用的通信模式。\n\
    \nLCEL标准化了通信，并使得在LangChain框架内轻松交换组件成为可能。所有组件都是模块化的。如果需要更改某些内容，只需替换代码的那一部分，而不是整个管道。\n\
    \n它还使代码更简洁。\n\n本书中的许多示例将使用LCEL链来构建。\n\n如果你想深入探索这个主题，一定要查看 [LCEL官方文档](官方LCEL文档)，我也在我的博客上写了几篇文章：\n\
    \n- [LangChain JS 中的嵌套链 - 将一个链的输出传递给另一个链](LangChain JS 中的嵌套链 - 将一个链的输出传递给另一个链)\n\
    - [在 LangChain JS 中使用 RunnableLambda 定义自定义函数](在 LangChain JS 中使用 RunnableLambda\
    \ 定义自定义函数)\n- [LangChain JS 中的 RunnableMap 和 RunnableParallel](LangChain JS 中的\
    \ RunnableMap 和 RunnableParallel)\n- [LangChain JS 中的路由 - 使用 LLM 分类器调用不同的提示词](LangChain\
    \ JS 中的路由 - 使用 LLM 分类器调用不同的提示词)\n- [在 LangChain.js 中使用 RunnableBranch 将执行路由到不同的提示词](在\
    \ LangChain.js 中使用 RunnableBranch 将执行路由到不同的提示词)\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_33_0.png)\n\
    \n至此，我们完成了第一个使用JavaScript、LangChain和ChatGPT的小型应用程序。我们已经学习了如何：\n\n- 引导并将一个Web应用连接到大语言模型。\n\
    - 利用LangChain的提示词模板来避免重复。\n- 创建我们的第一个链。\n\n在下一章中，我们将扩展这个应用程序，以生成实际的故事正文并集成数据流。\n\
    \n# 3. LangChain 中的流\n\n## 3.1. 介绍与项目设置\n\n某些答案可能需要大语言模型花费很长时间来生成。例如，如果你要求模型撰写一个复杂的回复，如一首诗或总结一篇文档。\n\
    \n鉴于大语言模型的工作方式，我们不必等待完整的答案生成完毕。你是否注意到，当你向ChatGPT提问时，你会看到那种打字机效果，即每个单词逐渐出现在屏幕上？\n\
    \n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_35_0.png)\n\n大语言模型并不像人类那样进行推理。它并非先构建完整的回复然后再进行解释。它也不会将答案映射到知识图谱或类似的东西上。它只是逐个token地向答案中添加内容。\n\
    \n这很棒，因为我们可以利用这种流式行为，在有了新信息要展示给用户时立即更新界面。\n\n回到故事生成器的例子，假设我们想创建一个名为《银精灵的秘密》的故事。我们不必等待整个故事生成完毕，而可以在故事被书写时进行流式传输：\n\
    \n```\n很久以前\n...\n...\n很久以前，在一片神秘的森林里\n...\n...\n很久以前，在一片深藏于群山之中的神秘森林里\n...\n\
    ...\n很久以前，在一片深藏于群山之中的神秘森林里，生活着一个银精灵部落。\n```\n\n在本章中，我们将实现流式功能。这就是应用程序最终的用户界面：\n\
    \n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_36_0.png)\n"
