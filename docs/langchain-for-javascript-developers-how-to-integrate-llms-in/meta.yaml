    use tools to parse that information.

    * We can chain multiple LLMs together. For example, we can generate an article
    with Google''s Gemini model and then pass the text to Midjourney to generate images
    for that article.'
- md: "-   LLMs lack access to internal organization documents. We can use Retrieval-Augmented\
    \ Generation (RAG) to provide extra context to a model, allowing it to interact\
    \ with users based on an organization's rules and knowledge. LangChain has a great\
    \ toolset for RAG operations.\n\nLangChain standardizes operations like the ones\
    \ above, making it easy to swap components as needed. Want to use a different\
    \ LLM because it's better or cheaper? Want to change the vector database to store\
    \ the RAG embeddings? No problem, LangChain has you covered.\n\nLangChain abstracts\
    \ and standardizes common patterns when working with LLMs. Remember the old days\
    \ with browser incompatibilities? Then jQuery appeared. This is what LangChain\
    \ aims to do for LLM integration.\n\nWhile it is possible to create any app without\
    \ LangChain, it simplifies the process to a great extent and is much better than\
    \ manual prompting.\n\nIf you want to delve deeper into the subject, I recommend\
    \ listening to the [episode with Harrison Chase, the founder of LangChain](https://latent.space/)\
    \ from the excellent Latent Space podcast.\n\n## 1.5. Overview of this book\n\n\
    In this book, we embark on a fun, hands-on, and pragmatic journey to learning\
    \ LangChain. Every main chapter has an associated example application that gradually\
    \ evolves during that chapter. Each step introduces a few new LangChain core concepts\
    \ in a manageable way without overwhelming you.\n\nThe book is purposefully broken\
    \ down into short chapters, each focusing on different topics.\n\nHere is how\
    \ the main chapters and example applications are structured:\n\n- **Chapter 1:**\
    \ We will use a Story Generator for Kids app to introduce the basics of LangChain.\
    \ We will connect to the first LLM, and use prompt templates and chains. We will\
    \ delve deeper into partial templates, template composition, and more.\n- **Chapter\
    \ 2:** After the basic setup in Chapter 1, this chapter will introduce the concept\
    \ of streaming. Using the same app, Story Generator for Kids, we will stream long\
    \ responses from the LLMs to improve the user experience.\n- **Chapter 3:** One\
    \ challenge with LLMs is that they give responses in an unstructured format, as\
    \ they were trained on human-intelligible text. In this chapter, we will study\
    \ output parsers by making a full Trivia Game from scratch using ChatGPT.\n- **Chapter\
    \ 4:** The memory module enables LLM memory for LangChain apps. We can remember\
    \ past conversations and responses in the current session similar to how ChatGPT\
    \ does it. In this chapter, we will build a Tea Facts Wiki application.\n- **Chapter\
    \ 5:** One of the key features of LangChain is its support for RAG - Retrieval\
    \ Augmented Generation. In this chapter, we will build a Chat Bot app that answers\
    \ questions based on external context. We will see how to provide data from sources\
    \ like PDFs or online documents, what embeddings are, and how vector data stores\
    \ work.\n- **Chapter 6:** More flexible and versatile compared to chains, AI agents\
    \ help you build complex solutions and enable access to third-party tools such\
    \ as Google search and math calculators. They can make decisions on the appropriate\
    \ tool to use in a given situation.\n\nFrom building a Story Generator to creating\
    \ a Trivia Game and a real Chat Bot application, each chapter gradually expands\
    \ your understanding. By the end, we will have explored streaming, output parsing,\
    \ memory modules, AI agents, and RAG capabilities, empowering you to develop complex\
    \ solutions.\n\nGet ready to embark on an enriching journey into the world of\
    \ LangChain development.\n\n## 1.6. Requirements and how to use this book\n\n\
    LangChain offers implementations in both JavaScript and Python. Throughout this\
    \ book, our focus will be on JavaScript.\n\nYou'll find that you learn best by\
