  md: '# 2.6. Chains


    Chains refer to sequences of calls - whether to an LLM, a tool, or a data preprocessing
    step.


    They are a vital core concept of LangChain and can be seen as short programs written
    around LLMs to execute complex tasks.


    Speaking of chains, here''s a fun fact about LangChain''s logo: The parrot and
    a chain link were inspired by people calling LLMs "stochastic parrots". These
    models can mimic human writing but don''t truly understand what they''re saying.
    This library aims to "chain" these "parrots" together to produce more meaningful
    and useful outputs.


    ![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_27_0.png)


    The output of one link from the chain becomes the input for the next link.


    Let''s say we need to create an article for a magazine. We will follow these steps:


    +   1. Use ChatGPT to generate the article title.

    2. Pass this title to a local LLM to compose the actual article, utilizing internal
    documents.'
  merge: -1
  pgno: 27
- img_proc: true
  md: "3. Pass the article to Midjourney, another LLM, to generate images for the\
    \ article.\nLet's see how to add a chain to our backend code:\n\n```\nimport {\
    \ ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate } from \"@langchain/core/prompts\"\
    \n//\U0001F534 using the LLMChain; maybe the most straightforward chain\nimport\
    \ { LLMChain } from \"langchain/chains\"\n\nconst model = new ChatOpenAI({\n \
    \ openAIApiKey: process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n\nconst prompt\
    \ = new PromptTemplate({\n  inputVariables: [ \"subject\"],\n  template: \"Tell\
    \ me a story title about {subject}\"\n})\n\n//\U0001F534 a chain that links the\
    \ model, the prompt and the verbose option\nconst chain = new LLMChain({\n  llm:\
    \ model,\n  prompt,\n  //\U0001F534 use verbose to debug the chain\n  verbose:\
    \ true\n})\n\nexport async function POST(req) {\n  const { subject } = await req.json()\n\
    \  //\U0001F534 invoking the chain\n  const gptResponse = await chain.invoke({subject})\n\
    \  return Response.json({data: gptResponse.text})\n}\n```"
