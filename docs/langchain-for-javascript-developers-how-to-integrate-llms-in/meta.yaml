  md: '# 2.3. The API key for the OpenAI ChatGPT model


    To use OpenAI''s ChatGPT model, you will need an API key. The API is subscription-based
    and the key can be generated from the following URL:


    ```

    https://platform.openai.com/api-keys

    ```


    You can top up your account with the minimum value. For example, writing all the
    examples in this book cost me under 2 USD.


    Once you''ve generated your API key, return to the Next.js project and paste it
    into the `.env` file:


    ```

    // code/story-generator/.env


    OPENAI_API_KEY=''sk-1234567890B2tT4HT3BlbkFJXkATN1arB9DXABkRQ1uj''

    ```


    This key will be used only in the backend part of our app. To access the API key
    in the `code/story-generator/src/app/api/route.js` file we can write the following:


    ```

    // code/story-generator/src/app/api/route.js


    console.log( process.env.OPENAI_API_KEY )

    ```


    The key will be later passed to the LangChain model object constructor.


    This step will be the default procedure for each of the code examples in the following
    chapters of this book.


    If you don''t wish to use an API key, you can check out [this list](https://js.langchain.com/docs/modules/model_io/models/)
    with the LLMs supported by LangChain and pick up a free model. You can even use
    a free HuggingFace token to avoid the OpenAI API.'
