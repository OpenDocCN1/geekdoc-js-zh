    # 4. Output parsers'
  - '[PAGE 46]


    # 4.1. Introduction


    Alright, let''s dive into the nitty-gritty of output parsers in LangChain.


    Why do we need them? Well, when working with LLMs, you will realize the response
    may not be the same if you ask the same question twice. Also, the format of the
    output can vary as well.


    For example, if we ask for the recipe for a dish, sometimes the LLM will return
    Ingredients as the first step, sometimes Preparations. This is normal as LLMs
    are generative, not deterministic. This variability may be fine for a human reader,
    but it becomes problematic if we want an API endpoint to process those responses.


    And when you change the type of underlying LLM model it will only get worse.


    Think of output parsers as your formatting sidekicks. They can:


    +   1. tweak your prompt by adding things such as prefixes or suffixes to steer
    the output in a certain direction. Want a JavaScript array? Want a simple string
    or JSON nested structure? LangChain''s output parsers got you covered;

    2. after the output is ready, a JavaScript function may step in to tidy things
    up. This function might even use other LLMs to polish the output into the perfect
    format.'
- md: "## 4.2. Example setup\n\nLangChain has several pre-defined output parsers that\
    \ can be used directly. We will use some of them in the following example.\n\n\
    You were tasked with making a trivia game using ChatGPT. The user will ask for\
    \ a trivia question with four possible answers. Only one of these answers is correct.\
    \ Once a possible answer is clicked, a popup indicating whether the answer is\
    \ correct or incorrect will be displayed. At any time, the user will be able to\
    \ ask for a new question.\n\nThis is how the final version of the app will look:\n\
    \n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_47_0.png)\n\nWe will start from a very\
    \ simple state.\n\nOn the backend, we will make an OpenAI model and ask it for\
    \ a trivia question:\n\n```javascript\n// code/trivia-game/src/app/api/route.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate }\
    \ from \"@langchain/core/prompts\"\n\nconst model = new ChatOpenAI({\n    openAIApiKey:\
    \ process.env.OPENAI_API_KEY,\n})\n\nconst prompt = PromptTemplate.fromTemplate(\n\
    \    `Ask me a trivia question about geography.`\n)\n\nconst chain = prompt.pipe(model)\n\
    \nexport async function GET() {\n    const gptResponse = await chain.invoke()\n\
    \    return Response.json({question: gptResponse.text})\n}\n```\n\nNotice that\
    \ this time we are using a GET request since we don't need to send any request\
    \ body. We just need to get a question back.\n\nOn the frontend, we have a simple\
    \ button that makes the call to the backend. Using a React state variable, the\
    \ question is displayed once we get the response:\n\n```javascript\n// code/trivia-game/src/app/page.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate }\
    \ from \"@langchain/core/prompts\"\n\nconst model = new ChatOpenAI({\n    openAIApiKey:\
    \ process.env.OPENAI_API_KEY\n})\n\nconst prompt = PromptTemplate.fromTemplate(\n\
    \    `Ask me a trivia question about geography.`\n)\n\nconst chain = new prompt.pipe(model)\n\
    \nexport async function GET() {\n    const gptResponse = await chain.invoke()\n\
    \    return Response.json({question: gptResponse.text})\n}\n```\n\nThis is how\
    \ the project will look in its first phase.\n\n\U0001F30D **Geography trivia**\n\
    \nAsk me a geography question\n\nWhat is the capital city of Australia?\n\n##\
    \ 4.3. StringOutputParser\n\nThe output parsers from LangChain.js are meant to\
    \ convert the AI responses into common structures, like JSON, Arrays, String,\
    \ and more.\n\nThe [StringOutputParser](https://example.com) takes the model's\
    \ output and converts it into a simple string. This one is maybe the easiest-to-use\
    \ parser.\n\nLet's take a look at what an actual response from a ChatGPT call\
    \ looks like:\n\n```javascript\nconst prompt = PromptTemplate.fromTemplate(\n\
    \    `Ask me a trivia question about geography.`\n)\n\nconst chain = prompt.pipe(model)\n\
    \nconst gptResponse = await chain.invoke()\n\nconsole.log(gptResponse)\n```\n\n\
    If we print the `gptResponse` constant, it will look like this:\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_50_0.png)\n\
    \nThis is the structure that comes from a ChatGPT model without any added output\
    \ parsers.\n\nHowever, if we use another type of model, such as Llama (made by\
    \ Meta) or Claude (made by Anthropic), the structure can be different. Each model\
    \ may provide the answer wrapped in a different structure.\n\nThis means the line\
    \ that extracts the final string response may fail because the `text` property\
    \ might not exist:\n\n```javascript\nquestion: gptResponse.text\n```\n\nIn the\
    \ end, we need just a simple string containing the question.\n\nThis is where\
    \ the `StringOutputParser` comes into play. You can add the parser to the chain,\
    \ and it will ensure the various response types from different LLMs are transformed\
    \ into a simple string.\n\nLet's see how this looks in the code:\n\n```javascript\n\
    // code/trivia-game/src/app/api/route.js\n\nimport { ChatOpenAI } from \"@langchain/openai\"\
    \nimport { PromptTemplate } from \"@langchain/core/prompts\"\n// \U0001F7E1 importing\
    \ the parser\nimport { StringOutputParser} from\n\"@langchain/core/output_parsers\"\
    \n\nconst model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY\n\
    })\n\n// \U0001F7E1 making the prompt and invoking the chain\nconst makeQuestion\
    \ = async ()=> {\n  const prompt = PromptTemplate.fromTemplate(\n    `Ask me a\
    \ trivia question about geography.`\n  )\n  // \U0001F7E1 adding the parser to\
    \ the LCEL chain so that we get\n  // \U0001F7E1 just a simple string output instead\
    \ of an object\n  const chain = prompt\n    .pipe(model)\n    .pipe(new StringOutputParser())\n\
    \  return await chain.invoke()\n}\n\nexport async function GET() {\n  // \U0001F7E1\
    \ extracted the make question part into its method\n  const question = await makeQuestion()\n\
    \  return Response.json({question})\n}\n```\n\nRemember that in a chain, we can\
    \ set up multiple consecutive operations, including output parsers.\n\nNotice\
    \ that after we add an output parser to the chain, we don't need to manually parse\
    \ the .text property:\n\n```javascript\n// before using the parser\nreturn Response.json({question:\
    \ gptResponse.text})\n\n// after adding the output parser to the chain\nreturn\
    \ Response.json({question})\n```\n\nThis will work even if we change the model\
    \ type.\n\nNext, let's see how we can use another type of parser to create an\
    \ array of responses.\n\n## 4.4. CommaSeparatedListOutputParser\n\nThere are cases\
    \ where we need to get multiple items from the response of an LLM.\n\nLet's ask\
    \ ChatGPT to also help us with some possible answers for the trivia question.\
    \ This is how the prompt will look:\n\n```\n`Give 4 possible answers for {question},\
    \ separated by commas, 3 false and 1 correct, in a random order.`\n```\n\nWithout\
    \ any output parsers, the standard response from ChatGPT will look like this:\n\
    \n```javascript\nAIMessage {\n  lc_serializable: true,\n  lc_kwargs: {\n    content:\
    \ 'North America, Africa, Australia, Asia',\n    additional_kwargs: { function_call:\
    \ undefined, tool_calls: undefined },\n    response_metadata: {}\n  },\n  lc_namespace:\
    \ [ 'langchain_core', 'messages' ],\n  content: 'North America, Africa, Australia,\
    \ Asia',\n  name: undefined,\n  additional_kwargs: { function_call: undefined,\
    \ tool_calls: undefined },\n  response_metadata: {\n    tokenUsage: { completionTokens:\
    \ 8, promptTokens: 47, totalTokens: 55 },\n    finish_reason: 'stop'\n  }\n}\n\
    ```\n\nA long, complex JavaScript object that we will need to manually parse.\n\
    \nBy the way, we will go into more detail about the `AIMessage` class during the\
    \ chat memory chapter.\n\nFor situations like these, LangChain can help us with\
    \ the [CommaSeparatedListOutputParser](https://js.langchain.com/docs/modules/model_io/output_parsers/types/list).\n\
    \nThe `CommaSeparatedListOutputParser` takes a complex answer given by an LLM\
    \ and reformats it as a standard array of strings. For example, the `AIMessage`\
    \ from the above example will become:\n\n```javascript\n[\n  'North America',\n\
    \  'Africa',\n  'Australia',\n  'Asia'\n]\n```\n\nMuch, much cleaner!\n\nLet's\
    \ see how our backend code will look after we add this `CommaSeparatedListOutputParser`\
    \ to handle the possible answers for the question:\n\n```javascript\n// code/trivia-game/src/app/api/route.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate }\
    \ from \"@langchain/core/prompts\"\nimport { StringOutputParser } from \"@langchain/core/output_parsers\"\
    \n// \U0001F7E0 import the CommaSeparatedListOutputParser\nimport { CommaSeparatedListOutputParser\
    \ } from \"@langchain/core/output_parsers\"\n\nconst model = new ChatOpenAI({\n\
    \    openAIApiKey: process.env.OPENAI_API_KEY,\n    // \U0001F7E0 increase the\
    \ model temperature\n    temperature: 0.9\n})\n\n// \U0001F7E0 ask the model for\
    \ possible answers\nconst makePossibileAnswers = async (question) => {\n    const\
    \ prompt = PromptTemplate.fromTemplate(\n        `Give 4 possible answers for\
    \ {question}, separated by commas,\n            3 false and 1 correct, in a random\
    \ order.`\n    )\n    // \U0001F7E0 apply the CommaSeparatedListOutputParser to\
    \ the chain\n    const chain = prompt\n        .pipe(model)\n        .pipe(new\
    \ CommaSeparatedListOutputParser())\n    return await chain.invoke({question:\
    \ question})\n}\n\nconst makeQuestion = async () => {\n    const prompt = PromptTemplate.fromTemplate(\n\
    \        `Ask me a trivia question about geography.`\n    )\n    const chain =\
    \ prompt\n        .pipe(model)\n        .pipe(new StringOutputParser())\n    return\
    \ await chain.invoke()\n}\n\nexport async function GET() {\n    const question\
    \ = await makeQuestion()\n    // \U0001F7E0 once we have the question fetch some\
    \ possible answers\n    const answers = await makePossibileAnswers(question)\n\
    \    return Response.json({question, answers})\n}\n```\n\nNote that we have increased\
    \ the temperature of the model, given that it will need to be creative when generating\
    \ the possible answers.\n\nWhile you may be tempted to use the JavaScript string\
    \ split() method, think again! What will happen if we change the LLM and the structure\
    \ of the response changes? This is why LangChain is so powerful! It standardizes\
    \ the way we interact with AI models."
  mdcn: "\n## 4.2. 示例设置\n\nLangChain 预定义了多种输出解析器，可直接使用。在接下来的示例中，我们将使用其中一些。\n\n假设你被要求使用\
    \ ChatGPT 制作一个知识问答游戏。用户将请求一个包含四个可能答案的知识问答题。其中只有一个答案是正确的。一旦点击某个可能的答案，就会显示一个弹窗，指示该答案是正确还是错误。在任何时候，用户都可以请求一个新问题。\n\
    \n应用最终版本的效果如下所示：\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_47_0.png)\n\n我们将从一个非常简单的状态开始。\n\
    \n在后端，我们将创建一个 OpenAI 模型，并让它提供一个知识问答题：\n\n```javascript\n// code/trivia-game/src/app/api/route.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate }\
    \ from \"@langchain/core/prompts\"\n\nconst model = new ChatOpenAI({\n    openAIApiKey:\
    \ process.env.OPENAI_API_KEY,\n})\n\nconst prompt = PromptTemplate.fromTemplate(\n\
    \    `Ask me a trivia question about geography.`\n)\n\nconst chain = prompt.pipe(model)\n\
    \nexport async function GET() {\n    const gptResponse = await chain.invoke()\n\
    \    return Response.json({question: gptResponse.text})\n}\n```\n\n注意，这次我们使用 GET\
    \ 请求，因为我们不需要发送任何请求体。我们只需要获取一个问题。\n\n在前端，我们有一个简单的按钮来调用后端。使用 React 状态变量，一旦收到响应就会显示问题：\n\
    \n```javascript\n// code/trivia-game/src/app/page.js\n\nimport { ChatOpenAI }\
    \ from \"@langchain/openai\"\nimport { PromptTemplate } from \"@langchain/core/prompts\"\
    \n\nconst model = new ChatOpenAI({\n    openAIApiKey: process.env.OPENAI_API_KEY\n\
    })\n\nconst prompt = PromptTemplate.fromTemplate(\n    `Ask me a trivia question\
    \ about geography.`\n)\n\nconst chain = new prompt.pipe(model)\n\nexport async\
    \ function GET() {\n    const gptResponse = await chain.invoke()\n    return Response.json({question:\
    \ gptResponse.text})\n}\n```\n\n这就是项目第一阶段的样子。\n\n\U0001F30D **地理知识问答**\n\n问我一个地理问题\n\
    \n澳大利亚的首都是哪里？\n\n## 4.3. StringOutputParser\n\nLangChain.js 的输出解析器旨在将 AI 响应转换为常见结构，如\
    \ JSON、数组、字符串等。\n\n[StringOutputParser](https://example.com) 获取模型的输出并将其转换为简单的字符串。这可能是最易于使用的解析器。\n\
    \n让我们看看 ChatGPT 调用的实际响应是什么样子：\n\n```javascript\nconst prompt = PromptTemplate.fromTemplate(\n\
    \    `Ask me a trivia question about geography.`\n)\n\nconst chain = prompt.pipe(model)\n\
    \nconst gptResponse = await chain.invoke()\n\nconsole.log(gptResponse)\n```\n\n\
    如果我们打印 `gptResponse` 常量，它看起来会是这样：\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_50_0.png)\n\
    \n这是来自 ChatGPT 模型的结构，没有添加任何输出解析器。\n\n然而，如果我们使用另一种类型的模型，例如 Llama（由 Meta 制作）或 Claude（由\
    \ Anthropic 制作），结构可能不同。每个模型可能以不同的结构包装答案。\n\n这意味着提取最终字符串响应的行可能会失败，因为 `text` 属性可能不存在：\n\
    \n```javascript\nquestion: gptResponse.text\n```\n\n最终，我们只需要一个包含问题的简单字符串。\n\n\
    这就是 `StringOutputParser` 发挥作用的地方。你可以将解析器添加到链中，它将确保来自不同 LLM 的各种响应类型都被转换为简单的字符串。\n\
    \n让我们看看这在代码中是如何实现的：\n\n```javascript\n// code/trivia-game/src/app/api/route.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate }\
    \ from \"@langchain/core/prompts\"\n// \U0001F7E1 导入解析器\nimport { StringOutputParser}\
    \ from\n\"@langchain/core/output_parsers\"\n\nconst model = new ChatOpenAI({\n\
    \  openAIApiKey: process.env.OPENAI_API_KEY\n})\n\n// \U0001F7E1 创建提示词并调用链\nconst\
    \ makeQuestion = async ()=> {\n  const prompt = PromptTemplate.fromTemplate(\n\
    \    `Ask me a trivia question about geography.`\n  )\n  // \U0001F7E1 将解析器添加到\
    \ LCEL 链中，这样我们就能获得\n  // \U0001F7E1 简单的字符串输出，而不是一个对象\n  const chain = prompt\n\
    \    .pipe(model)\n    .pipe(new StringOutputParser())\n  return await chain.invoke()\n\
    }\n\nexport async function GET() {\n  // \U0001F7E1 将创建问题的部分提取到其方法中\n  const question\
    \ = await makeQuestion()\n  return Response.json({question})\n}\n```\n\n请记住，在一个链中，我们可以设置多个连续的操作，包括输出解析器。\n\
    \n请注意，在我们将输出解析器添加到链中之后，我们不需要手动解析 .text 属性：\n\n```javascript\n// 使用解析器之前\nreturn\
    \ Response.json({question: gptResponse.text})\n\n// 将输出解析器添加到链中之后\nreturn Response.json({question})\n\
    ```\n\n即使我们更改了模型类型，这也会有效。\n\n接下来，让我们看看如何使用另一种类型的解析器来创建响应数组。\n\n## 4.4. CommaSeparatedListOutputParser\n\
    \n在某些情况下，我们需要从 LLM 的响应中获取多个项目。\n\n让我们请求 ChatGPT 帮助我们提供一些知识问答题的可能答案。提示词将如下所示：\n\
    \n```\n`Give 4 possible answers for {question}, separated by commas, 3 false and\
    \ 1 correct, in a random order.`\n```\n\n没有任何输出解析器时，ChatGPT 的标准响应将如下所示：\n\n```javascript\n\
    AIMessage {\n  lc_serializable: true,\n  lc_kwargs: {\n    content: 'North America,\
    \ Africa, Australia, Asia',\n    additional_kwargs: { function_call: undefined,\
    \ tool_calls: undefined },\n    response_metadata: {}\n  },\n  lc_namespace: [\
    \ 'langchain_core', 'messages' ],\n  content: 'North America, Africa, Australia,\
    \ Asia',\n  name: undefined,\n  additional_kwargs: { function_call: undefined,\
    \ tool_calls: undefined },\n  response_metadata: {\n    tokenUsage: { completionTokens:\
    \ 8, promptTokens: 47, totalTokens: 55 },\n    finish_reason: 'stop'\n  }\n}\n\
    ```\n\n一个冗长且复杂的 JavaScript 对象，我们需要手动解析它。\n\n顺便说一下，我们将在聊天记忆章节中更详细地介绍 `AIMessage`\
    \ 类。\n\n对于这样的情况，LangChain 可以通过 [CommaSeparatedListOutputParser](https://js.langchain.com/docs/modules/model_io/output_parsers/types/list)\
    \ 来帮助我们。\n\n`CommaSeparatedListOutputParser` 接收 LLM 给出的复杂答案，并将其重新格式化为标准的字符串数组。例如，上例中的\
    \ `AIMessage` 将变为：\n\n```javascript\n[\n  'North America',\n  'Africa',\n  'Australia',\n\
    \  'Asia'\n]\n```\n\n干净、简洁多了！\n\n让我们看看在我们添加这个 `CommaSeparatedListOutputParser`\
    \ 来处理问题的可能答案之后，后端代码会是什么样子：\n\n```javascript\n// code/trivia-game/src/app/api/route.js\n\
    \nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate }\
    \ from \"@langchain/core/prompts\"\nimport { StringOutputParser } from \"@langchain/core/output_parsers\"\
    \n// \U0001F7E0 导入 CommaSeparatedListOutputParser\nimport { CommaSeparatedListOutputParser\
    \ } from \"@langchain/core/output_parsers\"\n\nconst model = new ChatOpenAI({\n\
    \    openAIApiKey: process.env.OPENAI_API_KEY,\n    // \U0001F7E0 提高模型的温度\n  \
    \  temperature: 0.9\n})\n\n// \U0001F7E0 请求模型提供可能的答案\nconst makePossibileAnswers\
    \ = async (question) => {\n    const prompt = PromptTemplate.fromTemplate(\n \
    \       `Give 4 possible answers for {question}, separated by commas,\n      \
    \      3 false and 1 correct, in a random order.`\n    )\n    // \U0001F7E0 将\
    \ CommaSeparatedListOutputParser 应用到链中\n    const chain = prompt\n        .pipe(model)\n\
    \        .pipe(new CommaSeparatedListOutputParser())\n    return await chain.invoke({question:\
    \ question})\n}\n\nconst makeQuestion = async () => {\n    const prompt = PromptTemplate.fromTemplate(\n\
    \        `Ask me a trivia question about geography.`\n    )\n    const chain =\
    \ prompt\n        .pipe(model)\n        .pipe(new StringOutputParser())\n    return\
    \ await chain.invoke()\n}\n\nexport async function GET() {\n    const question\
    \ = await makeQuestion()\n    // \U0001F7E0 一旦我们有了问题，就获取一些可能的答案\n    const answers\
    \ = await makePossibileAnswers(question)\n    return Response.json({question,\
    \ answers})\n}\n```\n\n请注意，我们已经提高了模型的温度，因为它需要在生成可能的答案时更具创造性。\n\n虽然你可能很想使用 JavaScript\
    \ 字符串的 split() 方法，但请再想想！如果我们更换 LLM 并且响应结构发生变化会怎么样？这就是 LangChain 如此强大的原因！它标准化了我们与\
    \ AI 模型交互的方式。\n"
