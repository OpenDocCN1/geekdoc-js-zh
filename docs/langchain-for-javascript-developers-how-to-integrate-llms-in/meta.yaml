  md: '# # 1.6. Requirements and how to use this book


    LangChain offers implementations in both JavaScript and Python. Throughout this
    book, our focus will be on JavaScript.


    You''ll find that you learn best by coding along with the examples provided in
    the book. My suggestion is to initially go through each chapter, absorbing the
    content to grasp the concepts. Then, during a second pass, code along as you progress.


    We''ll utilize a combination of LangChain, React, and Next.js. While a basic understanding
    of React is expected, you need not be an expert.


    For setting up Next.js, the simplest approach is to utilize the [create-next-app](create-next-app)
    utility.


    In most instances, our work will be confined to just 2 files:


    +   - `src/app/page.js` - handling the frontend; its primary function is to display
    information and data.

    - `src/app/api/route.js` - managing the backend; this file will handle the API
    interactions with the LLM.


    The examples will progress in a step-by-step iterative manner. Each modification
    will be denoted by the 🔴 sign, with the path of the modified file provided for
    reference.


    For instance:'
