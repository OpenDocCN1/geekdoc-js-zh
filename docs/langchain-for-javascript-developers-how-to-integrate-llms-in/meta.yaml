    \    embeddings\n)\n```\n\nDo we have to recreate embeddings each time we run\
    \ a RAG query? This might work for small files, but for larger ones, the embedding\
    \ creation process could be very time-consuming.\n\nFor example, we can set a\
    \ parameter during the creation of a Chroma DB object, like `persist_directory`,\
    \ specifying a valid local path. This way, when you create your Vector DB using\
    \ a file, it will be stored in the specified location. Subsequently, it will be\
    \ loaded from that location the next time, significantly reducing processing time.\n\
    \nThe `createRetrievalChain()` takes a user inquiry, which is then passed to the\
    \ retriever to fetch relevant documents. Those documents (and original inputs)\
    \ are then passed to an LLM to generate a response."
  merge: -1
  pgno: 101
- img_proc: true
  md: "Finally, we will build a retriever that can be used by a chain to fetch information\
    \ from the vector database.\n\n```\nconst retriever = vectorstore.asRetriever()\n\
    const chain = await createStuffDocumentsChain({\n    llm: model,\n    prompt\n\
    })\nretrievalChain = await createRetrievalChain({\n    combineDocsChain: chain,\n\
    \    retriever\n})\n```\n\nAs a side note, Google's Gemini 1.5 model has a million\
    \ token contexts and is researching 10 million tokens. It's so large that you\
    \ can include an entire knowledge base, books, or films without worrying about\
    \ context limits. Some people think this will make RAG obsolete. However, this\
    \ is unlikely due to:\n\n+   1. \U0001F4B8 Costs - you still pay per token. Google\
    \ is like perfectly happy to let you pay a million tokens every single time you\
    \ make an API call. So, good luck having a $100 API call.\n2. \U0001F40C Slow\
    \ - the API call will be huuuuge, and the response will be slow as well.\n3. \U0001F50D\
    \ Troubleshooting - a very big context is not debuggable. If something goes wrong,\
    \ you can't do the RAG's decomposition to see the source of the error.\n\nOne\
    \ fun experiment could be to take a book like this use one, and using RAG feed\
    \ the content to an LLM model. A user can later come and interact with that LLM\
    \ to learn about LangChain using the approach from this book. Or just ask the\
    \ model for recap questions.\n\nMaybe this will be the future of future of how\
    \ we consume technical books."
  merge: -1
  pgno: 102
