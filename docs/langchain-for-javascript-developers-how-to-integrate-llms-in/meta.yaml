  md: "# 2.4. Using the ChatOpenAI LangChain model\n\nLet's move forward by establishing\
    \ a connection to OpenAI's LLM. Add the following code to the backend of the app,\
    \ in the `src/app/api/route.js` file:\n\n```\n// code/story-generator/src/app/api/route.js\n\
    import { ChatOpenAI } from \"@langchain/openai\"\n\nconst model = new ChatOpenAI({\n\
    \  openAIApiKey: process.env.OPENAI_API_KEY,\n  temperature: 0.9\n})\n\nexport\
    \ async function POST(req) {\n  const { subject } = await req.json()\n  const\
    \ gptResponse = await model.invoke(subject)\n  return Response.json({data: gptResponse})\n\
    }\n```\n\nTo initiate a connection with OpenAI, we create a new instance of the\
    \ ChatOpenAI object. Within its constructor, we define the following:\n\n+   -\
    \ a temperature parameter, set to 0.9\n- the API key obtained from the preceding\
    \ subchapter\n\nYou might be curious about this temperature parameter, right?\n\
    \nThe temperature parameter affects how imaginative our model gets. Increasing\
    \ it results in more creative outputs while lowering it keeps responses more grounded\
    \ and factual. Sticking to facts reduces potential inaccuracies or hallucinations\
    \ from the model.\n\nChoosing the right temperature depends on the task. For brainstorming\
    \ catchy story titles, a higher temperature is preferable. For tasks where accuracy\
    \ is key like summarizing a legal document, a lower temperature is better."
  merge: -1
