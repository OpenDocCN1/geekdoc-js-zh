    \n```\nnpm run dev\n```\n\nThis will generate the following output:"
  mdcn: "\n-   大型语言模型无法访问内部组织文档。我们可以使用检索增强生成（RAG）来为模型提供额外的上下文，使其能够基于组织的规则和知识与用户交互。LangChain\
