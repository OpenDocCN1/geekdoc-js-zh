    # # 4.5. The getFormatInstructions() method and custom parsers


    Before we continue, let''s make a short detour to talk about the `getFormatInstructions()`
    method and how output parsers work under the hood.


    There are many output parsers in LangChain. The documentation provides [this table](this
    table) to summarize the main types:


    | Name | Supports Streaming | Has Format Instructions | Calls LLM | Input Type
    | Output Type | Description |

    |---|---|---|---|---|---|---|

    | String | ✅ | | | string or Message | string | Takes language model output (either
    an entire response or as a stream) and converts it into a string. This is useful
    for standardizing chat model and LLM output and makes working with chat model
    outputs much more convenient. |

    | HTTPResponse | ✅ | | | string or Message | binary | Allows you to stream LLM
    output properly formatted bytes a web HTTP response for a variety of content types.
    |

    | OpenAIFunctions | ✅ | (Passes functions to model) | | Message (with function_call)
    | JSON object | Allows you to use OpenAI function calling to structure the return
    output. If you are using a model that supports function calling, this is generally
    the most reliable method. |

    | CSV | | ✅ | | string or Message | string[] | Returns a list of comma separated
    values. |

    | OutputFixing | | | ✅ | string or Message | | Wraps another output parser. If
    that output parser errors, then this will pass the error message and the bad output
    to an LLM and ask it to fix the output. |

    | Structured | | ✅ | | string or Message | Record<string, string> | An output
    parser that returns structured information. It is less powerful than other output
    parsers since it only allows for fields to be strings. This can be useful when
    you are working with smaller LLMs. |

    | Datetime | | ✅ | | string or Message | Date | Parses response into a JavaScript
    date. |


    All of these parsers have the `getFormatInstructions()` method in common.


    Let''s create a `CommaSeparatedListOutputParser` and call this method:


    ```

    const parser = new CommaSeparatedListOutputParser()

    console.log(parser.getFormatInstructions())


    // PRINTS:

    // the result will be just a simple string:

    // Your response should be a list of comma separated values, eg:

    `foo, bar, baz`

    ```


    Basically, this is just an extra part we can add to the prompt.'
