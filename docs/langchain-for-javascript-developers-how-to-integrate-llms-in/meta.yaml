    \ on this information\n\nThis will be the data flow of the app:\n\n![image](img/8ed289cfe69587a9e6e4a3dd9ba079ed_83_0.png)\n\
    \nBelow is the initial frontend setup. We send a question and print out the response:\n\
    \n```javascript\n// code/rag/src/app/page.js\n\n'use client'\nimport { useState\
    \ } from \"react\"\n\nexport default function Home() {\n  const [answer, setAnswer]\
    \ = useState()\n\n  const askQuestion = async (e)=> {\n    e.preventDefault()\n\
    \    const question = e.target.question.value\n    const response = await fetch('api',\
    \ {\n      method: \"POST\",\n      body: JSON.stringify({question})\n    })\n\
    \    const {data} = await response.json()\n    setAnswer(data)\n  }\n\n  return\
    \ (<>\n    <h1>\U0001F4C4 Documents chatbot</h1>\n    <form onSubmit={askQuestion}\
    \ >\n      <input name=\"question\" />\n      <button>Ask chatbot</button>\n \
    \   </form>\n    <p>{answer}</p>\n  </>)\n}\n```\n\nWhile on the backend we use\
    \ a GPT model to answer the question:\n\n```javascript\n// code/rag/src/app/api/route.js\n\
    import { ChatOpenAI } from \"@langchain/openai\"\nimport { ChatPromptTemplate\
    \ } from \"@langchain/core/prompts\"\nimport { LLMChain } from \"langchain/chains\"\
    \n\nconst model = new ChatOpenAI({\n    openAIApiKey: process.env.OPENAI_API_KEY\n\
    })\n\nconst prompt = ChatPromptTemplate.fromTemplate(\n    `Answer the user's\
    \ question:\n    Question: {input}`\n)\n\nconst chain = new LLMChain({\n    llm:\
    \ model,\n    prompt\n})\n\nexport async function POST(req) {\n    const { question\
    \ } = await req.json()\n    const data = await chain.invoke({\n```"
