    \ is a unified DevOps platform for developing,\n    collaborating, testing, deploying,\
    \ and monitoring\n    LLM applications.`\n})\n```\n\n### 6.4. RAG 过程的组成部分\n\n\
    让我们来看一下 RAG 过程中涉及的不同组件类型：\n\n1.  **文档加载器** - 可以将这些视为你的数据收集者。它们拉取外部信息并加载，无论是纯 `.txt`\
    \ 文件、网页文本，甚至是 YouTube 视频转录稿。\n2.  **转换器** - 你已经加载了文档，但有时它们需要一点改造才能完美适配你的应用程序。LangChain\
