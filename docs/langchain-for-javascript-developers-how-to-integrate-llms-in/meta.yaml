    # # 3.1. Introduction and project setup


    Some answers may take a lot of time to be generated by an LLM. For instance, if
    you request the model to craft a complex response like a poem or summarize a document.


    Given the way LLMs work, we don''t have to wait for the full answer to be complete.
    Have you noticed that when you ask ChatGPT something you will see that typewriter
    effect, wherein each word appears gradually on the screen?


    ![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_35_0.png)


    A Large Language Model does not reason like a human. It does not first build the
    full response and then explain it. Nor does it map the answer to a knowledge graph
    or something similar. It just adds one token at a time to the answer.


    This is great because we can use this streaming behavior to update the UI as soon
    as we have new info to show to the user.


    Returning to the story generator example, let''s say we want to make a story named
    `The Secret of the Silver Elves`. Instead of waiting for the full story to be
    generated, we can stream the story while it is written:'
  - '[PAGE 36]


    ```

    Once upon a time

    ...

    ...

    Once upon a time, in a mystical forest

    ...

    ...

    Once upon a time, in a mystical forest hidden deep within the mountains

    ...

    ...

    Once upon a time, in a mystical forest hidden deep within the mountains, there
    lived a clan of silver elves.

    ```


    In this chapter, we will implement the streaming feature. This is how the UI of
    the app will look like at the end:


    ![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_36_0.png)'
- md: "## 3.2. Project refactor\n\nBefore we move forward, we first need to do a bit\
    \ of refactoring to our project.\n\nOn the frontend, we will do the following:\n\
    \n- 1. Once we have a title for the story, we will display it as a button with\
    \ the text `Tell me the story of <<story name here>>`.\n- 2. When this button\
    \ is pressed, we will make a call to the backend, pass in the story name and print\
    \ the response.\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_37_0.png)\n\nThis\
    \ is how the code will look like:\n\n```\n// code/streaming/src/app/page.js\n\n\
    'use client'\nimport { useState } from \"react\"\nexport default function Home()\
    \ {\n  const [storyTitle, setStoryTitle] = useState()\n  // \U0001F7E0 a new state\
    \ variable for the storyBody\n  const [storyBody, setStoryBody] = useState()\n\
    \n  const onSubmitHandler = async (e)=> {\n    e.preventDefault()\n    const subject\
    \ = e.target.subject.value\n    const response = await fetch('api', {\n      method:\
    \ \"POST\",\n      body: JSON.stringify({ subject })\n    })\n    const { data\
    \ } = await response.json()\n    setStoryTitle(data)\n  }\n\n  //\U0001F7E0 call\
    \ this method when the start story button is pressed\n  const startStoryStream\
    \ = async ()=> {\n    //\U0001F7E0 reset the story body, call the backend\n  \
    \  // and display the response in the story body\n    setStoryBody('')\n    const\
    \ response = await fetch('api', {\n      method: \"POST\",\n      body: JSON.stringify({\
    \ storyTitle })\n    })\n    const { data } = await response.json()\n    setStoryBody(data)\n\
    \  }\n\n  return (\n    <>\n      <h1>\U0001F984 The Story Maker</h1>\n      <em>This\
    \ app uses a GPT Model to generate a story for kids.</em>\n      <form onSubmit={onSubmitHandler}>\n\
    \        Main subject of the story:\n        <select name=\"subject\">\n     \
    \     <option value=\"cats\">\U0001F63A Cats</option>\n          <option value=\"\
    unicorns\">\U0001F984 Unicorns</option>\n          <option value=\"elfs\">\U0001F9D1\
    ‍\U0001F384 Elfs</option>\n        </select>\n        <button>\U0001F916 Ask AI\
    \ Model</button>\n      </form>\n      {/* \U0001F7E0 if we have the story title\
    \ show\n      the start story button and the story body */}\n      {storyTitle\
    \ && <div>\n        <button onClick={startStoryStream}>\n          Tell me the\
    \ story of {storyTitle}\n        </button>\n        <p>{storyBody}</p>\n     \
    \ </div>\n    </>\n  )\n}\n```\n\nOn the backend, we will add these changes:\n\
    \n- Add a `makeStoryTitle()` method that will contain all the previous logic.\n\
    - Add a `streamStory()` method. We will later use this method to implement the\
    \ streaming mechanism. For the time being, it will return some static text.\n\
    - Check if the request from the frontend is asking for a story title or for the\
    \ story body. Call one of the above methods.\n\nHere is how the backend code will\
    \ look:\n\n```\nimport { ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate\
    \ } from \"@langchain/core/prompts\"\n// \U0001F7E1 we will use the NextResponse\
    \ to send the story body\nimport { NextResponse } from \"next/server\"\n\n// \U0001F7E1\
    \ all the previous logic goes in here\nconst makeStoryTitle = async (subject)=>\
    \ {\n    const model = new ChatOpenAI({\n        openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \        temperature: 0.9\n    })\n    const prompt = new PromptTemplate({\n \
    \       inputVariables: [ \"subject\"],\n        template: \"Tell me a story title\
    \ about {subject}\",\n    })\n    const chain = prompt.pipe(model)\n    return\
    \ await chain.invoke({subject})\n}\n\n// \U0001F7E1 we will later update this\
    \ to add the streaming\nconst streamStory = async (storyTitle)=> {\n    return\
    \ new NextResponse(\n        JSON.stringify( { data: \"And here the story begins...\"\
    \ }\n    ),\n        { headers: { 'content-type': 'application/json' },\n    \
    \    })\n}\n\nexport async function POST(req) {\n    const { subject, storyTitle\
    \ } = await req.json()\n    // \U0001F7E0 if the request has a storyTitle then\
    \ return the\n    // streamStory()\n    if (storyTitle) {\n        return streamStory(storyTitle)\n\
    \    }\n    // \U0001F7E0 if we don't have a storyTitle then return one\n    const\
    \ gptResponse = await makeStoryTitle(subject)\n    return Response.json({data:\
    \ gptResponse.text})\n}\n```\n\nAnd this is how the app will look like at this\
    \ stage:\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_40_0.png)\n\nPressing this\
    \ button will send the story title to the backend and show the response.\n\n##\
    \ 3.3. Streaming the response\n\nIn some cases, AI models can take several seconds\
    \ to generate a complete response to a prompt. This is slower than the ~200-300\
    \ ms threshold at which an app feels responsive to the end user.\n\nTo make the\
    \ app feel more responsive we need to show intermediate progress and stream the\
    \ final output in chunks, yielding each chunk as soon as it is available.\n\n\
    Not all models support streaming, so be sure to check if the model you use supports\
    \ this feature.\n\nIt's time to add the streaming feature to our story generator\
    \ app.\n\nNote that this will not be a single request-response interaction. It\
    \ will be more like an ongoing chat. The frontend will keep requesting new LLM\
    \ response chunks and update the ongoing result, while the backend sends back\
    \ response chunks or indicates when the stream is finished.\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_41_0.png)\n\
    \nWe will start with the backend. All the changes will be made in the `streamStory()`\
    \ method we have defined during the previous step:\n\n```\n// code/streaming/src/app/api/route.js\n\
    \n// the rest remains the same\n// ...\n\nconst streamStory = async (storyTitle)=>\
    \ {\n    const encoder = new TextEncoder()\n    const stream = new TransformStream()\n\
    \    const writer = stream.writable.getWriter()\n    const model = new ChatOpenAI({\n\
    \        openAIApiKey: process.env.OPENAI_API_KEY,\n        temperature: 0.9,\n\
    \        streaming: true,\n        callbacks: [{\n            handleLLMNewToken:\
    \ async (token) => {\n              await writer.ready\n              await writer.write(encoder.encode(`${token}`))\n\
    \            },\n            handleLLMEnd: async () => {\n              await\
    \ writer.ready\n              await writer.close()\n            }\n        }]\n\
    \    })\n    const prompt = new PromptTemplate({\n        inputVariables: [ \"\
    storyTitle\" ],\n        template: \"Tell me story titled {storyTitle}\"\n   \
    \ })\n    const chain = prompt.pipe(model)\n    chain.invoke({storyTitle})\n \
    \   return new NextResponse(stream.readable, {\n        headers: { \"Content-Type\"\
    : \"text/event-stream\" }\n    })\n}\n\n// the rest remains the same\n// ...\n\
    ```\n\nFirst, we will need to create a new chain that generates the story body.\n\
    \nThe model instance passed to this chain has two updates:\n\n- The `streaming`\
    \ flag is enabled.\n- The `handleLLMNewToken()` and `handleLLMEnd()` callbacks\
    \ are implemented.\n\nTo keep the communication channel open after the initial\
    \ request, the returned response content type is set to `text/event-stream` instead\
    \ of the standard `application/json`.\n\nAdditionally, on the frontend, we will\
    \ modify a single method: `startStoryStream()`:\n\n```\n// code/streaming/src/app/page.js\n\
    \n// the rest remains the same\n// ...\n\nconst startStoryStream = async ()=>\
    \ {\n    setStoryBody('')\n    const response = await fetch('api', {\n      method:\
    \ \"POST\",\n      body: JSON.stringify({ storyTitle })\n    })\n    // \U0001F535\
    \ the reader will act as a data communication \"pipe\"\n    const reader = response.body.getReader()\n\
    \    const decoder = new TextDecoder()\n    // \U0001F535 keep the connection\
    \ while we keep receiving new response chunks\n    while (true) {\n        const\
    \ { value, done } = await reader.read()\n        if (done) break\n        const\
    \ chunkValue = decoder.decode(value)\n        // \U0001F535 the way to append\
    \ text to a React state string value\n        setStoryBody(prev => prev + chunkValue)\n\
    \    }\n}\n\n// the rest remains the same\n// ...\n```\n\nWith these final UI\
    \ changes, we can watch the story unfold as it's generated by the LLM:\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_44_0.png)\n\
    \nIf you want to take a more in-depth look at this topic the LangChain documentation\
    \ has a nice [guide about streaming](https://example.com), including this part\
    \ on [how to stop the streaming](https://example.com) process if the response\
    \ is not as you intended.\n\n## 4. Output parsers\n\n## 4.1. Introduction\n\n\
    Alright, let's dive into the nitty-gritty of output parsers in LangChain.\n\n\
    Why do we need them? Well, when working with LLMs, you will realize the response\
    \ may not be the same if you ask the same question twice. Also, the format of\
    \ the output can vary as well.\n\nFor example, if we ask for the recipe for a\
    \ dish, sometimes the LLM will return Ingredients as the first step, sometimes\
    \ Preparations. This is normal as LLMs are generative, not deterministic. This\
    \ variability may be fine for a human reader, but it becomes problematic if we\
    \ want an API endpoint to process those responses.\n\nAnd when you change the\
    \ type of underlying LLM model it will only get worse.\n\nThink of output parsers\
    \ as your formatting sidekicks. They can:\n\n- 1. Tweak your prompt by adding\
    \ things such as prefixes or suffixes to steer the output in a certain direction.\
    \ Want a JavaScript array? Want a simple string or JSON nested structure? LangChain's\
    \ output parsers got you covered;\n- 2. After the output is ready, a JavaScript\
    \ function may step in to tidy things up. This function might even use other LLMs\
    \ to polish the output into the perfect format."
  mdcn: "\n## 3.2. 项目重构\n\n在继续之前，我们需要对项目进行一些重构。\n\n在前端，我们将进行以下操作：\n\n- 1. 一旦我们有了故事的标题，我们会将其显示为一个按钮，按钮文本为\
