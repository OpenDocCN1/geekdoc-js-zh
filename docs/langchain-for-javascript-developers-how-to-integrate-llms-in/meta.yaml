- md: "# 7. AI Agents\n\nUp until now, we have looked at creating chains. Chains follow\
    \ a predetermined sequence specified by us.\n\nAgents are different in the sense\
    \ that we can simply give them a goal, and they will dynamically figure out the\
    \ best course of actions to take and the order of those actions to reach that\
    \ final goal.\n\nWe will assign tools to an agent, and the agent will try to figure\
    \ out when to use a tool to complete the task.\n\nUntil this moment, we have used\
    \ the LLM primarily as an NLP (Natural Language Processing) tool. AI agents are\
    \ closer to what we imagine \"real AI\" to be.\n\nHaving objectives, trying different\
    \ approaches, interacting with the environment, and making decisions are more\
    \ aligned with what we consider real intelligence.\n\nWe were tasked with building\
    \ a tool to help journalists in their research for new articles. The tool needs\
    \ to be able to search on Wikipedia and perform precise math calculations.\n\n\
    By the end of this chapter, we will build an app that will do the following:\n\
    \n- read a question from the user\n- use an agent to answer the question\n- the\
    \ output will contain the answer to the question, and the tools used by the agent\
    \ to find that answer.\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_106_0.png)\n\
    \nWe will start from the following state: on the frontend, we will let the user\
    \ type a question and submit that question to the server. When the response arrives,\
    \ we will display its text.\n\n```\n// code/agents/src/app/page.js\n\n\"use client\"\
    ;\nimport { useState } from \"react\";\n\nexport default function Home() {\n \
    \ const [data, setData] = useState();\n  const onSubmitHandler = async (e) =>\
    \ {\n    e.preventDefault();\n    const question = e.target.question.value;\n\
    \    if (question) {\n      const response = await fetch(\"api\", {\n        method:\
    \ \"POST\",\n        body: JSON.stringify({\n          question,\n        }),\n\
    \      });\n      const { data } = await response.json();\n      setData(data);\n\
    \    }\n  };\n  return (\n```\n\n```\n<>\n    <h1>\U0001F575️‍♂️ Article research\
    \ agent</h1>\n    <form onSubmit={onSubmitHandler}>\n      <input name=\"question\"\
    \ />\n      <button>Ask question</button>\n    </form>\n    <p>{data?.text}</p>\n\
    \  </>\n  );\n}\n```\n\nOn the backend, we will ask a GPT-4 Omni model the question\
    \ inputted by the user.\n\n```\n// code/agents/src/app/api/route.js\nimport {\
    \ ChatOpenAI } from \"@langchain/openai\"\nimport { PromptTemplate } from \"@langchain/core/prompts\"\
    \nimport { StringOutputParser } from \"@langchain/core/output_parsers\"\n\nconst\
    \ model = new ChatOpenAI({\n    modelName: \"gpt-4o\",\n    openAIApiKey: process.env.OPENAI_API_KEY,\n\
    })\n\nconst prompt = new PromptTemplate({\n    inputVariables: [\"question\"],\n\
    \    template: \"Answer the user {question}\",\n})\n\nconst chain = prompt\n \
    \                   .pipe(model)\n                    .pipe(new StringOutputParser())\n\
    \nexport async function POST(req) {\n    const { question } = await req.json()\n\
    ```\n\n```\nconst data = await chain.invoke({\n    question\n})\nreturn Response.json({data})\n\
    }\n```\n\nThe initial version of our app seems to work quite nicely. For example,\
    \ if we ask it to tell us a joke, everything works as expected.\n\n![](img/agents-joke.png)\n\
    \nBut what if we ask `Who won the Super Bowl in 2024?` the limitations of the\
    \ training data set start to emerge. Given that the model has been trained on\
    \ data up to Oct 2023, it does not know the answer.\n\n![](img/agents-limit-2023.png)\n\
    \n# 7.2. Making an agent\n\nIt's time to make our first agent. To overcome the\
    \ limitations imposed by the training dataset, we will give the chatbot the option\
    \ to conduct its own research online.\n\nTo do their job, agents require access\
    \ to specific tools, such as Google or Wikipedia search capabilities. By combining\
    \ the GPT models with these tools, agents determine the actions needed to achieve\
    \ their goals.\n\nIf we check the Tools documentation we will see the full list\
    \ of available options [https://js.langchain.com/docs/integrations/tools/](https://js.langchain.com/docs/integrations/tools/).\n\
    \n![](img/agents-docs-tools.png)\n\nWhile it might be tempting to load all available\
    \ tools, it's essential to equip the agent only with the necessary ones. Providing\
    \ too many options may lead to one or more of the following:\n\n- the agent selected\
    \ an inappropriate tool\n- higher cost per API call; the agent will use more tokens\n\
    - increased network latency\n\nFor our use case, we will equip the agent with\
    \ only 2 tools. A Wikipedia search tool and a math calculator.\n\n```\nconst wikipediaQuery\
    \ = new WikipediaQueryRun({topKResults: 1})\nconst calculator = new Calculator()\n\
    const tools = [wikipediaQuery, calculator]\n```\n\nPlease note that for the `Calculator`\
    \ tool, you will need to install the `@langchain/community` package:\n\n```\n\
    npm install @langchain/community\n```\n\nWait, what!? A math calculator for an\
    \ AI model? Well, because neural networks work by estimating stuff, they are not\
    \ great at math. There is a very small chance they will mess up a basic math operation.\
    \ Therefore, it's safer and faster to use a basic math tool for these operations.\n\
    \nThis toolset will be passed to an AI agent. Each agent type serves a unique\
    \ purpose, as seen from the documentation:\nhttps://js.langchain.com/docs/modules/agents/agent_types/.\
    \ For instance, a Structured Chat is optimized for multiple back-and-forth interactions.\n\
    \nWe'll employ the ReAct Agent, the most versatile action agent. As a side note,\
    \ the ReAct Agent has nothing to do with the JavaScript React framework.\n\nThis\
    \ is how the full code of the backend will look like:\n\n```\n// code/agents/src/app/page.js\n\
    import { ChatOpenAI } from \"@langchain/openai\"\nimport { WikipediaQueryRun }\
    \ from\n\"@langchain/community/tools/wikipedia_query_run\"\nimport { createReactAgent,\
    \ AgentExecutor } from\n\"langchain/agents\"\nimport { Calculator } from\n\"@langchain/community/tools/calculator\"\
    \nimport { pull } from \"langchain/hub\"\n\nconst model = new ChatOpenAI({\n \
    \ modelName: \"gpt-4o\",\n  openAIApiKey: process.env.OPENAI_API_KEY\n})\n\n//\
    \ \U0001F7E0 making the toolbox for the agent\n// \U0001F7E0 remember to run 'npm\
    \ install @langchain/community'\nconst wikipediaQuery = new WikipediaQueryRun({topKResults:\
    \ 1})\nconst calculator = new Calculator()\nconst tools = [wikipediaQuery, calculator]\n\
    \n// \U0001F7E0 getting the agent rule set\nconst prompt = await pull(\"hwchase17/react\"\
    )\n```\n\n```\n// \U0001F7E0 define the Agent and the AgentExecutor\nconst agent\
    \ = await createReactAgent({\n  llm: model,\n  tools,\n  prompt\n})\n\nconst agentExecutor\
    \ = new AgentExecutor({\n  agent,\n  tools\n})\n\nexport async function POST(req)\
    \ {\n  const { question } = await req.json()\n  const response = await agentExecutor.invoke({\n\
    \    input: question\n  })\n  return Response.json({data: response, prompt})\n\
    }\n```\n\nAnd this is the frontend code:\n\n```\n// code/agents/src/app/page.js\n\
    'use client'\nimport { useState } from \"react\"\n\nexport default function Home()\
    \ {\n  const [data, setData] = useState();\n\n  const onSubmitHandler = async\
    \ (e) => {\n    e.preventDefault();\n    const question = e.target.question.value;\n\
    \    if (question) {\n      const response = await fetch(\"api\", {\n        method:\
    \ \"POST\",\n        body: JSON.stringify({\n          question,\n        }),\n\
    \      });\n      const result = await response.json();\n      setData(result.data);\n\
    \    }\n  };\n\n  return (\n    <main>\n      <form onSubmit={onSubmitHandler}>\n\
    \        <input name=\"question\" />\n        <button type=\"submit\">Submit</button>\n\
    \      </form>\n      {data && <p>{data}</p>}\n    </main>\n  );\n}\n```\n\n```\n\
    }),\n    });\n    const { data } = await response.json();\n    setData(data);\n\
    \  }\n};\n\nreturn (\n    <>\n      <h1>\U0001F575️‍♂️ Article research agent</h1>\n\
    \      <form onSubmit={onSubmitHandler}>\n        <input name=\"question\" />\n\
