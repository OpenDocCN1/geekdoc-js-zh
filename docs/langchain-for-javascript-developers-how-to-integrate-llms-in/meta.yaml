    # # 6. RAG / Chatting with documents'
  - '[PAGE 80]


    # 6.1. Introduction


    Let''s talk about a very important topic in working with LLMs: RAG, which stands
    for Retrieval Augmented Generation.


    RAG is the process of optimizing the output of an LLM by referencing a knowledge
    base outside of its training data sources.


    For example, the knowledge cutoff date for ChatGPT 3.5 Turbo is September 2021.
    This means that, without external help, the model will not know what happened
    after this date.


    But what if we need to work with information about LangSmith, a tool developed
    by the same company as LangChain? This new tool was released in 2023, after the
    knowledge cutoff date.


    Or what if we need to make a chatbot that references some internal documents of
    an organization to provide customer support?


    This is where RAG comes in. Using RAG you can connect external data sources like
    CSV files, videos, PDFs, etc. to an LLM and provide external context.


    A few considerations about RAG:


    +   - RAG does not retrain the model. It does not update the weights of the neuronal
    network. It just provides more information for the model to reference.

    - in the next chapter, we will talk about AI Agents. Although AI Agents can search
    for external info, they are slower, more expensive, and can provide unreliable
    outputs. AI Agents are good for complex situations and if-then-else nonlinear
    cases that can be solved using various tools. With RAG, you can perform the knowledge
    retrieval process upfront and deliver fast solutions for scenarios such as Q&A.


    But why is RAG so important?'
  - '[PAGE 81]


    LLM training costs a lot. Like a LOT! For example, the Llama 2 model from Meta,
    was trained using 6000 GPUs, running for 12 days. The training had a cost of about
    2 million USD. In the vast majority of cases, you don''t want to train your model
    from scratch.


    However, with every passing minute, there is some information/knowledge that is
    getting generated. Keeping a model updated with new information is a constant
    race.


    Even fine-tuning takes a lot of time.


    What''s the other option? Use RAG to provide just the slice of knowledge we need
    for our LLM.


    RAG saves both time and money, as no training is required.'
