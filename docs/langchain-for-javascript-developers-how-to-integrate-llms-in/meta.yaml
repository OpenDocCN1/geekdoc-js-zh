    \ an endless stream of questions. Plus, it's super flexible and a breeze to tweak.\
    \ One more testament to how much power the new capabilities of LLMs provide us\
    \ as web developers. Cool stuff \U0001F60E!\n\n## 5. Chat memory\n\n## 5.1. Introduction\
    \ and project setup\n\nThe chat memory feature allows a Large Language Model (LLM)\
    \ to remember previous interactions with the user.\n\nConversational memory is\
    \ how a chatbot can respond to multiple queries in a chat-like manner. Without\
    \ it, every query would be treated as a single independent input without considering\
    \ past interactions.\n\nFollow-up questions only make sense when they reference\
    \ the previous questions and answers. For example, if I just say to an LLM `Explain\
    \ in detail` it will ask for more context. But if I first tell the same LLM `How\
    \ the speed of light was calculated` followed by `Explain in detail` I will get\
    \ a coherent answer.\n\nBy default, LLMs are stateless. Each incoming query is\
    \ processed independently of other interactions. The only thing that exists for\
    \ a stateless entity is the current input and nothing else.\n\nYou are working\
    \ with a tea shop and have been tasked to make a GPT-powered app that provides\
    \ users with interesting facts about tea. Below is a picture of what the final\
    \ version of the app should look like:\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_68_0.png)\n\
    \nWe will start with the following setup.\n\nOn the frontend, we have a button\
    \ that makes a POST request to the API and prints out the answer:\n\n```javascript\n\
    // code/tea-wiki/src/app/page.js\n'use client'\nimport { useState } from \"react\"\
    \n\nexport default function Home() {\n  const [answer, setAnswer] = useState()\n\
    \  const tellFact = async ()=> {\n    const response = await fetch('api', {\n\
    \      method: \"POST\"\n    })\n    const { data } = await response.json()\n\
    \    setAnswer(data)\n  }\n\n  return (\n    <>\n    <h1>\U0001F375 Tea Facts</h1>\n\
    \    <button onClick={tellFact}>\n      Tell a fact about my favourite drink\n\
    \    </button>\n    <div>{answer}</div>\n    </>\n  )\n}\n```\n\nWhile on the\
    \ backend, we return the answer given by a GPT model to the prompt `Tell me a\
    \ fact about my favorite drink:`\n\n```javascript\n// code/tea-wiki/src/app/api/route.js\n\
    import { ChatOpenAI } from \"@langchain/openai\"\nimport { ChatPromptTemplate\
    \ } from \"@langchain/core/prompts\"\nimport { StringOutputParser } from \"@langchain/core/output_parsers\"\
    \n\nconst model = new ChatOpenAI({\n  openAIApiKey: process.env.OPENAI_API_KEY,\n\
    \  temperature: 0.9,\n})\n\nconst prompt = ChatPromptTemplate.fromMessages([\n\
    \  [\"human\", \"{input}\"]\n])\n\nconst outputParser = new StringOutputParser()\n\
    \nconst chain = prompt.pipe(model).pipe(outputParser)\n\nexport async function\
    \ POST() {\n  const question = `Tell me a fact about my favorite drink.`\n  const\
    \ fact = await chain.invoke({\n    input: question,\n  })\n  return Response.json({data:\
    \ fact})\n}\n```\n\n## 5.2. Injecting messages into the conversation memory\n\n\
    Right from the start it's clear that we have a problem:\n\n![](img/8ed289cfe69587a9e6e4a3dd9ba079ed_70_0.png)\n\
    \nWhen invoking a chain we can use the `chat_history` property to set up a memory\
    \ context for the conversation at hand.\n\nLet's see how we can do this!\n\nBelow\
    \ is the updated code for the backend:\n\n```javascript\n// code/tea-wiki/src/app/api/route.js\n\
    import { ChatOpenAI } from \"@langchain/openai\"\nimport { ChatPromptTemplate\
    \ } from \"@langchain/core/prompts\"\nimport { StringOutputParser } from \"@langchain/core/output_parsers\"\
    \n// \U0001F7E0 add the HumanMessage, and MessagesPlaceholder imports\nimport\
    \ { HumanMessage } from \"@langchain/core/messages\"\nimport { MessagesPlaceholder\
    \ } from \"@langchain/core/prompts\"\n\nconst model = new ChatOpenAI({\n  openAIApiKey:\
    \ process.env.OPENAI_API_KEY,\n  temperature: 0.9,\n})\n\n//\U0001F7E2 the initial\
    \ conversation memory context\nconst chatHistory = [\n    new HumanMessage(`My\
