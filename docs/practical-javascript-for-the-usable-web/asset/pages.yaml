    # Use Descriptive Names


    Using descriptive names for variable names, function names and parameters is vital
    for making code easier to read. If we scan through some code and see a function
    called doStuff(), then we''t have a clue what it does and need to spend a lot
    of time reading through it, running through the code in our mind to work out what
    it''s trying to achieve. If it was called calculateSalesTax(), then we would have
    a pretty good idea what it does and only need to examine it if it''s something
    we are interested in. Our aim should be variable and function names that are as
    specific as possible but also give us good idea of what the variable or function
    is all about, without being overly long.


    Function names usually start with a verb (for example, calculate, write, or create)
    then end with a descriptive word or two telling us what the action is operating
    on.


    Variable and parameter names need to give an idea of what data they hold. For
    example, cid doesn''t give many clues about the data, customerID does. user is
    a poor name, whereas userFullName makes it explicit to what the variable contains.
    It''s also worth to indicate what kind of data the variable or parameter contains.
    So isUserIDValid hints at the variable contains a true or false value.


    Although optional, we may find using a naming scheme useful. For example, notice
    that all the function and variable names in our examples start with a lower case
    letter, then each word is made clear by starting it with a capital letter. This
    is a naming scheme known as camel case:


    ```

    isInvalidUserID

    totalCostOfBasket

    ```


    It helps with consistency if we stick with a naming scheme and consistency is
    another factor that takes the guesswork out of reading code.


