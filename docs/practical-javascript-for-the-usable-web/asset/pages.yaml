  md: '# Windows and Frames


    Windows in the real world provide viewing ports that allow us to look out of buildings
    and view the outside world, or inside to view the contents. In the same way windows
    in programming provide view ports so content can be displayed, or viewed, by the
    user. or independently in sub-windows. Similarly, the browser window allows us
    to see the contents of an HTML document.


    Traditionally when you click on a hyperlink to open, retrieve, and view a new
    document it will be displayed within the same window. However, documents can be
    presented in multiple views: HTML allows different documents to be presented in
    the same window (by replacing a previous document). Multiple views offer designers
    a way to keep certain information visible, while other views are scrolled or replaced.
    For example, within the same window, one frame might display a static banner,
    a second navigation menu, and the third main document that can be scrolled through
    by navigating in the second frame.


    In this chapter, we''ll start by looking at all the built-in mechanisms for displaying
    information. We''ll look at how we can present documents in other windows, commonly
    known as the pop-up window, and how to write JavaScript to communicate between
    different windows. Finally we''ll look at frames, which are sub-windows within
    a window, and allow multiple documents to be viewed adjacent to one another simultaneously.


    # Basic Built-in Dialog Windows


    The browser provides JavaScript with three different built-in popup windows, which
    are the alert, confirm, and prompt dialog windows. Modal dialog windows are windows
    that open on top of a parent window and remain above the parent window until closed;
    the user cannot interact with the parent window until the dialog is closed.


    These three built-in dialog windows do not have any available properties for you
    to change the appearance of the dialogs. So you''re stuck with the way they look
    and function, or are you? Well, yes, if you want to use the built-in dialogs;
    however, these dialog windows are useful for many situations. As we''ll see shortly,
    there are ways that you can create your own alternatives. First, though, let''s
    take a closer look at the built-in dialog.'
  merge: -1
  pgno: 138
- img_proc: true
  md: "# The Alert Dialog\n\nThe alert dialog is the simplest and most often used\
    \ of the common built-in dialogs. Its intended use is to provide warning information,\
    \ or hints, to a user, often informing them that something is not quite right\
    \ and an error is possibly to occur or an intended action can not be completed.\n\
    \nIts use is very straightforward:\n\n```\nwindow.alert(\"Hello World!!\");\n\n\
    // Alternative shorter form\nalert(\"Hello World!!\");\n```\n\nThe example shows\
    \ two ways in which you can create an alert box. The alert() method is a method\
    \ of the window object and can be called as such. However, the window object is\
    \ the toplevel object within a browser window and methods and properties of the\
    \ window object do not always need the window reference when calling them, as\
    \ the browser automatically infers it. The second alternative, which is more commonly\
    \ used to create pop-up windows.\n\nWhen creating the alert dialog we simply call\
    \ the alert() method and pass a single parameter that is a string to be displayed.\
    \ The figure below shows an example of an alert dialog created using either of\
    \ the statements above.\n\n![](img/e58f0457390096aadd869f36b1b05e3c_139_0.png)\n\
    \nThe alert dialog is very useful when it comes to debugging your JavaScript.\
    \ Instead of passing an actual string of characters as the parameter, it is equally\
    \ valid to pass a variable. JavaScript will attempt to convert the variable to\
    \ a value and display that string. In the following section of sample code, each\
    \ iteration of the loop calls the alert() method and passes i as the argument.\n\
    \n```\nfor (var i = 0; i < 5; i++)\n{\n  alert(i);\n}\n```\n\nEach time the alert()\
    \ method is called, JavaScript converts the value of i to a string and displays\
    \ a string representation of that. As soon as the alert() method is reached within\
    \ a section of code, the alert dialog is displayed with its message, and processing\
    \ of the script halts. In this example, the for loop stops at the point where\
    \ the alert() method is called and any lines that follow the alert() method will\
    \ not be executed.\n\nThe alert dialog remains on screen, and script processing\
    \ halted, until a user clicks the OK button. When the user clicks the button,\
    \ the alert dialog disappears and the remaining JavaScript continues to be processed.\
    \ In this example it means the alert dialog is closed the for loop continues to\
    \ execute immediately after the line containing alert() method."
  merge: -1
  pgno: 139
- img_proc: true
  md: "If the alert dialog didn't halt the script when it was created, then the example\
    \ would create and display 5 alert boxes in rapid succession. In this case, that\
    \ wouldn't be too much of a problem, but you could imagine in loops that consist\
    \ of 15 iterations, let alone several 10s or 100s of iterations, this could be\
    \ a problem as they would appear quicker than the user could them. Placing `alert()`\
    \ statements strategically in your code while developing allows you to check the\
    \ values of variables and hopefully identify any rogue values that are causing\
    \ your script problems. One point to note, though, is if you use this method to\
    \ aid debugging scripts, watch when you place alerts inside loops.\n\nIf a loop\
    \ iterates more than 15 times it can be very tedious at the variable's value time.\
    \ In these cases, \"wrap\" the `alert()` statement in an if statement that will\
