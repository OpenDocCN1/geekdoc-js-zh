  md: "# Chapter 2\n\n# Repeating Things: Loops\n\nIn this section we look at how\
    \ we can repeat a block of code for long as a set condition is true. For example\
    \ we might want to loop through each input element on an HTML form, or through\
    \ each item in an array.\n\n# Repeating a Set Number of Times: the for Loop\n\n\
    The for loop is designed to loop through a code block a number of times, and looks\
    \ like this:\n\n```\nfor ( initialize statements; loop condition; increment statements)\n\
    {\n  //\n  // code to be repeatedly executed\n  //\n}\n// after loop complete\
    \ execution of code continues here\n```\n\nYou can pass three parameters into\
    \ a for loop using the parentheses, each separated by a semicolon.\n\nThe first\
    \ is the initialization: the code it contains will only run the first time the\
    \ statement is run. It's frequently used to initialize new variables to help the\
    \ loop run. If, for example, we wanted the loop to run 10 times then we might\
    \ begin by creating a new variable and initializing it to 1:\n\n```\nfor ( loopCounter\
    \ = 1; loop condition; increment statements)\n```\n\nThen we increment loopCounter\
    \ on each iteration of the loop, using the increment statement, and make the loop\
    \ condition that the loop keeps running for as long as loopCounter is less than\
    \ 10:\n\n```\nfor ( loopCounter = 1; loopCounter <= 10; loopCounter++)\n```\n\n\
    The loop keeps executing as long as the loop condition evaluates to true – as\
    \ long as loopCounter is less than or equal to 10. Once it hits 11 the loop stops\
    \ and execution of the code continues at the next statement after the loop's closing\
    \ parenthesis.\n\nYou can initialize more than one variable and increment statement\
    \ by separating them with a comma:\n\n```\nfor ( loopCounter = 1, var1 = 10, var2\
    \ = 5; loop condition; increment statements)\n```\n\nYou don't have to initialize\
    \ variables if you don't need them, but you do need to include the semicolon:\n\
    \n```\nfor ( ; loop condition; increment statements)\n```\n\n```\nfor ( variable,\
    \ anotherVariable; loopCounter <= 10; variable++, anotherVariable-- )\n```"
  merge: -1
  pgno: 65
