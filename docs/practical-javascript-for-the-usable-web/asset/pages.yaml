  md: '# DHTML IE4 and NN4


    | Version | | |

    | --- | --- |

    | IE4, IE5, IE6 | document.all.<element id> works<br>Can modify CSS style attributes
    and have immediate re-rendering<br>Dynamically animated movement of HTML elements
    is possible by changing its CSS positioning<br>HTML of page can be modified and
    re-rendered using innerHTML property<br>Onmouseover and mouseout attributes can
    be used to configure mouse over event handlers |

    | NN4 | Need to traverse the hierarchy of the element to access it<br>Can only
    modify very few CSS attributes using DHTML<br>Animated movement of HTML element
    is supported via layer tag, and dynamic positioning of layers<br>Modification
    of HTML can only be performed on layer, by opening the layer''s document and re-writing
    its HTML<br>JavaScript can be used to assign mouseover and mouseout handler for
    maximum compatibility |

    | NN6, IE6 | Supports W3C DOM access for uniform HTML<br>Supports most CSS1 for
    consistent CSS behavior |


    Due to the very large number of bugs in all versions of browsers relating to DHTML
    and CSS rendering, it''s impossible to give an exhaustive list of incompatibilities
    that you might face when you''re creating cross-browser DHTML code. For more information
    on creating cross-browser DHTML code, you may want to visit Netscape''s DHTML
    developer''s site at the following URL:


    http://developer.netscape.com/tech/dhtml/dhtml.html


    Whatever you''re working with, you''ll need to test diligently against all the
    versions of the browsers that you intend to support.


    # The difficulties with Cross–Browser DHTML


    Given all the differences you''ve looked at, the minimum cross-browser DHTML page
    often requires two distinct flows of DHTML logic for the NN4 and IE4 series of
    browsers. When you''re tackling the problem using this you''ll need to be tolerant
    of slight differences between layout and interaction of the two browsers – this
    is what web professionals typically deal with the issues. The goal should be to
    attain a similar effect, and not an exact replica. We need to strike this compromise
    because the mechanism to support DHTML is totally different on the legacy series
    of browsers.


    Once you''ve resigned yourself writing DHTML for each browser, the only remaining
    problem is how to determine the browser that is currently accessing the page.
    There are quite a few solutions to this problem.'
  merge: -1
  pgno: 188
- img_proc: true
  md: "# Chapter 6\n\nWe'll begin by modifying the DHTML page we have already worked\
    \ with to make it cross-browser compatible. This is xbdhtml.html:\n\n```\n<html>\n\
    <head>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"dhtmlpages.css\">\n\
    <script language=\"JavaScript\">\nvar formHTML = <div class=\"changeFormStyle\"\
    >Name: <input type='text'><br> + \n  Address: <input type='text'><br> + \n  <input\
    \ type='submit' value='submit'></form>\nvar changed=false;\nfunction changeIt()\
    \ {\n  if (document.all) {\n    document.all.changeRegion.innerHTML = formHTML;\n\
    \    changed = true;\n  } else {\n    if (document.layers) {\n      var tp = document.changeRegion.document;\n\
    \      tp.open();\n      tp.write(formHTML);\n      tp.close();\n      changed\
    \ = true;\n    }\n  }\n}\n</script>\n</head>\n<body>\n<div id=\"magicRegion\"\
    \ \\>Apply Today!</div>\n<div id=\"changeRegion\">\nFree membership!\n</div>\n\
    <script>\nif (document.all) {\n  document.all.magicRegion.onmouseover = changeIt;\n\
    } else {\n  document.changeRegion.onmouseover = changeIt;\n}\n</script>\n</body>\n\
    </html>\n```\n\nInside the changeIt() function, we check for the existence of\
    \ the document.all collection to determine if the browser being used is IE4. If\
    \ we detected IE4, we can go ahead and use the simple document.all.element name\
    \ indexing in the code to address the changeRegion div, and we also use the innerHTML\
    \ property to perform dynamic changes.\n\nOtherwise, we check if the document.layers\
    \ collection exists because this will tell us if the browser is NN4.x. If it is,\
    \ we must address the element through its hierarchy and rewrite the content of\
    \ the layer (absolutely positioned)."
  merge: -1
  pgno: 189
- img_proc: true
  md: 'In fact, xbdhtml.html is essentially a merge of iedhtml.html and ns4dhtml.html.
    If you load it using NN4, it looks like this:


    ![](img/e58f0457390096aadd869f36b1b05e3c_190_0.png)


    If you pass the mouse over the Apply Today! text, an application form will appear:


    ![](img/e58f0457390096aadd869f36b1b05e3c_190_1.png)


    When you access the same xbdhtml.html using IE4, and passing the mouse over the
    Apply Today! text, you will see the page change like this:


    ![](img/e58f0457390096aadd869f36b1b05e3c_190_2.png)


    The two resulting screens do not look exactly the same. Different spacing, fonts,
    bugs in style inheritance for the various elements, and more contribute to the
    slightly different output.


    > When you''re creating cross-browser HTML pages, you''ll need to settle for similar
    looking output that work across the target browsers. Attempts to create results
    that are exactly identical are often futile, and can consume a lot of resources,
    energy, and time for very little return.


    In the above example, we have used two different techniques to determine the browser
    that is being used: the document.all collection test (which tests for the object''s
    existence), and the document.layers collection test. We''ll recap these techniques
    here, and demonstrate a third technique for achieving browser identification.'
