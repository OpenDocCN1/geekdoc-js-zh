  md: "# Chapter 7\n\nYou should be aware that all functions within JavaScript exist\
    \ as objects and, as such, can be referenced by their name as you would any other\
    \ object. The DHTML technique of object binding allows a function object to be\
    \ attached to event handlers directly through statements within a script, can\
    \ be seen as follows:\n\n```\nfunction evtHandler(evt)\n  // Do something\n}\n\
    \nvarElement = document.getElementById(\"myElementId\");\nElement.onclick = evtHandler;\n\
    ```\n\nNote that DOM Levels 1 and 2 do not define binding of functions to event\
    \ handlers. IE and NN browsers have implemented this technique, DOM is silent\
    \ on this issue.\n\nWith Netscape browsers, a reference to an event object is\
    \ passed automatically as a parameter to the event-handling function; hence we\
    \ have supplied a single parameter evt for the function. Binding function objects\
    \ to event handlers in this fashion does not allow parameters to be passed to\
    \ the function. However, there is a trick to getting around this problem by wrapping\
    \ the event handler within an anonymous function:\n\n```\nElement.onclick = evtHandler(evt)\n\
    \  //some code here to handle the event object and perform some work if necessary.\n\
    spEventHandler(arg1, arg2);\n```\n\nNote, when using object binding, the name\
    \ of the event handler is sensitive and you should always use lowercase names\
    \ for maximum compatibility across different browsers.\n\nThe inline and object\
    \ binding methods for attaching event-handling functions to event handlers were\
    \ both extensively covered in Chapter 4. Here, we come to a parting of the ways\
    \ and with it added complication. Internet Explorer 5+ and Netscape 6+ have implemented\
    \ two additional types of event binding. Internet Explorer 5+ browsers use a non-standard\
    \ technique that was implemented before the W3C DOM Events standard was completed.\
    \ Netscape 6+ browsers, however, use the technique defined by the DOM events models.\n\
    \nWith Internet Explorer 5+ browsers, every HTML element and document object possesses\
    \ an attachEvent() method, as the example shows:\n\n```\nfunction evtHandler()\n\
    \  // Do something\n}\n\nvarElement = document.getElementById(\"myElementId\"\
    );\nElement.attachEvent(\"onclick\", evtHandler);\n```\n\nThe attachEvent() method\
    \ accepts two parameters. The first is string name of the event handler and the\
    \ second is an object reference to the event-handling function.\n\n222"
