    has disappeared.


    With the mouse and mouseout event handlers complete, the user will be provided
    with a changing border color when they roll mouse and off the images. This visual
    cue will indicate that clicking on the image will allow a full version to be displayed
    in Area 3. What now remains is to complete the onclick event handler function
    document_onclick(), which can be seen below:


    ```

    function document_onclick(eventObject)

    {

    var eventSourceElement = getSourceElement(eventObject);

    if (eventSourceElement != null &&

    eventSourceElement.tagName.toLowerCase() == "img"

    {

    var imgSrc = eventSourceElement.src;

    imgSrc = imgSrc.replace("thumbnail","");


    parent.loadNewMainImage(imgSrc);

