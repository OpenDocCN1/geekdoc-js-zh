  md: '# Introduction


    If you want to learn client-side JavaScript fast, but effectively, then you''re
    reading the right book. We''ll move swiftly through the technology over the next
    ten chapters, dealing only with the aspects of JavaScript that you need to use
    in your day-to-day web development tasks.


    JavaScript can be tricky to implement: browser compatibility and usability issues
    are part of the web professional''s working world. This book is written around
    exactly those issues. It''s about ''intelligent'' JavaScript, the JavaScript that
    improves the functionality of your web site without throwing error messages in
    the older browsers, or making the jump through unnecessary hoops to accomplish
    what they came to your site to do.


    We don''t cover every angle of JavaScript here. For example, we won''t be working
    with PDFs, or server-side JavaScript in this book. We''ll be covering many other
    things though, including:


    +   - Dealing with different browsers

    - Implementing scripts that improve the look, feel, and functionality of your
    web site

    - Advanced data validation techniques

    - Writing JavaScript, from small pieces of add-in functionality to a full application
    with shopping cart functionality.


    # Who''s this Book?


    This book will suit you if you''ve already been building HTML pages for some time
    and need to learn JavaScript fast.


    It''ll also suit you if you''ve dabbled with scripts. Maybe you''ve implemented
    some of those freely available on the web, but you want a thorough understanding
    of how the technology works in order to build your own.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Introduction


    You don''t need any previous programming experience to understand the concepts
    and code that are presented here.


    Whoever you are, and whatever your previous knowledge, we hope this book lives
    up to your expectations.


    # What do I Need to Begin?


    All you need is a text editor (Notepad, Dreamweaver, or whatever you usually use)
    and a browser. Chapter 6 deals with HTML for IE4 and NN4, so you''ll need the
    relevant browsers to test this code if you want to check out the differences between
    them. Other than that, all you need is access to the code download at http://www.glasshaus.com
    and somewhere to run your code. We''ve used Personal Web Manager, but other server
    will just do as well.


    # Style Conventions


    We''ve used a number of styles in the book to help you understand what''s going
    on.

    We''ve used the **important words** style to flag up new or important subjects.

    *Screen Text* is used to indicate anything you''d see on the screen, including
    URLs.

    New blocks of code are in this foreground style:


    ```

    <html>

    <body>

    <script language="JavaScript">


    varCalc = 1 + 2;

    document.write("The calculated number is " + myCalc");


    </script>

    </body>

    </html>

    ```


    If we''re amending a script, perhaps adding in a new line or making changes to
    an existing one, then we use the code background style for the code that you''ve
    already seen together with the foreground style to highlight the new code:


    ```

    <html>

    <body>

    <script language="JavaScript">


    var userEnteredNumber = prompt("Please enter a number,");

    var myCalc = 1 + userEnteredNumber;

    var myResponse = "The number you entered + 1 = " + myCalc;

    document.write(myResponse);


    </script>

    </body>

    </html>

    ```


    To talk about code within text we use this code in text style, which is also used
    for filenames like myFirstJavaScript.htm'
  merge: -1
