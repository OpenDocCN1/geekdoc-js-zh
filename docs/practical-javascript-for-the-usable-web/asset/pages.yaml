  md: "# Windows and Frames\n\n```\niframe#mainImageFrame ( left:310px; width:455px;\
    \ border:5px ridge #c0c0c0; );\n\nimg#scrollUpImg ( left:140px; top:10px );\n\
    img#scrollDownImg ( left:140px; top:425px );\nim#imageLoadingAnimation ( left:310px;\
    \ top:10px; visibility:hidden; )\n<style>\n```\n\nIf you carefully and compare\
    \ this stylesheet with the previous one, you will only notice the differences\
    \ exist for the location properties (left and top) and the dimension properties\
    \ (width and height).\n\nCreate a copy of the ImageView.htm file created previously\
    \ and rename this file ImageView_smallscreen.htm. Then replace the stylesheet\
    \ with this new file and copy the stylesheet over in place. You now have two files:\
    \ for users with small screens and one for users with large screens.\n\nSo far\
    \ so, but it would be better if the application was intelligent, capable of calculating\
    \ the user's screen size and automatically redirecting them to the page that suits\
    \ their needs.\n\nJavaScript is capable of performing this easily. The following\
    \ section of code uses an if statement that tests the height of the browser window,\
    \ which is the height of the browser window available to display content, without\
    \ the extra decorations as menus, toolbars, and status bar.\n\nIf the screen height\
    \ is less than 700 pixels the browser is redirected to the ImageView_smallscreen.htm\
    \ file by replacing the name of the file to the replace() method of the window's\
    \ location object. After calling the replace() method loads the specified URL\
    \ over the current history entry. After calling replace() method, the user cannot\
    \ navigate to the previous URL by using Back button.\n\n```\n// code with 800\
    \ * 600 or less\nif (screen.availHeight < 700)\n{\n  window.location.replace(\"\
    ImageView_smallscreen.htm\");\n}\n```\n\nIf you copy and paste this code into\
    \ the script block of the ImageView.htm file, the JavaScript interpreter will\
    \ execute this code as the page loads and automatically redirect the browser to\
    \ the page suited to users with the smaller screen size.\n\n# Navigation System\n\
