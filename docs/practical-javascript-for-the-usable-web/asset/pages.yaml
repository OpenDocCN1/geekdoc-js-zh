  md: "# Chapter 6\n\n```\n<div OnMouseEnter=\"OnMouseOver(this);\"\n    OnMouseOut=\"\
    OnMouseOver(this);\"\n    onclick=\"loadNewImageCategory(this, 'associated thumbnail\
    \ page')\"\n    class=\"SubHeading\">Category of thumbnails</</div>\n```\n\nThe\
    \ OnMouseEnter and OnMouseOut handlers provide the mouse-over highlighting effect\
    \ for the list item, the onclick handler is the one that will load a new associated\
    \ thumbnail page into the Area 2, the user can click on the Category of thumbnails\
    \ description, and the loadNewImageCategory() function will be called to load\
    \ the required thumbnail into Area 2.\n\nSo that how the collapsible list is created,\
    \ and how the appropriate thumbnail page is loaded into Area 2 depending on user\
    \ selection. We can now proceed back to the main ImageViewer.htm page and fill\
    \ in those empty JavaScript functions that we have left in the last chapter.\n\
    \n# Back to the Main Page\n\nLook into ImageViewer.htm, right after the inline\
    \ CSS stylesheets, and you'll find the following lines that read in process the\
    \ JavaScript code in the ImageViewerMain.js:\n\n```\n<script language=\"JavaScript\"\
    \ src=\"ImageViewerMainCode.js\">\n</script>\n```\n\nTo keep tidy and modular,\
    \ all of the JavaScript coding has been contained in this externally .js file.\n\
    \nLet's take a look at the CategoryIndex.htm page and see how it handles the various\
    \ user interactions with JavaScript and DHTML. Here, we can fill in the logic\
    \ of some of the JavaScript functions.\n\nIn our examination of the CategoryIndex.htm\
    \ page and its collapsible list, we saw that it depended on a loadNewCategoryThumbnails()\
    \ function in its parent frame to update the thumbnail in Area 2. It is in the\
    \ ImageViewerMainCode.js where we find this function.\n\nThe loadNewCategoryThumbnails()\
    \ function is called whenever a leaf <div> of the collapsible list is clicked.\
    \ The URL of the thumbnail page to load is supplied as an argument. This function\
    \ simply locates the Area 2 iframe, and changes its href property to the argument\
