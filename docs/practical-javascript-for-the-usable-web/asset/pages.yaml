    }\n```\n\nIf we were using IE5+ NN6+, only then could we use just the getElementById()\
    \ method of the document object, since it's supported by DOM level1 compliant\
    \ browsers. However, by creating this function we can make our calendar control\
    \ compatible with IE4 as well - given that it's only a little extra effort, it\
    \ seems worth it. The function does the same as getElementById(), except that\
    \ it also works with IE4 by using the document.all property supported by all IE\
    \ browsers.\n\nIn the statement, we check if document.all returns a value. If\
    \ it does, the selectedTag variable is set to object representing the element\
    \ with id value using the document.all.item() method. If document.all is not supported,\
    \ then we use the getElementById() method supported by DOM level1 compliant browsers.\
    \ This assumes that this page will only be visited by IE4 or NN6; we would need\
    \ to use browser checking to ensure browsers like NN4 are directed to a page that\
