  md: '# The DOM: HTML5 for the Latest Browsers


    # DOM Interfaces


    As we saw in Chapter 3, within the world of object-oriented programming, objects
    are constructed from instructional sets of data called classes. A class is very
    much akin to the architect''s design blueprints for constructing a building, defining
    the properties and methods an object will possess when created from the class.


    Classes can extend other classes, building upon the properties and methods already
    present in a base class. Again if we look at the building analogy, it''s similar
    to starting with plans for a two-bedroom house, and extending the plans to give
    a three-bedroom house. This form of extending is known as *inheritance*; the extended
    class contains the methods and properties of the base class as well as its own
    specific properties and methods.


    Classes implement abstract data types known as interfaces. Interface define methods
    and properties that a class must define. For example, imagine an interface Biped
    that defines left and right properties, and the methods walk, run, and jump. All
    classes that implement this interface must contain the interface properties and
    methods. A Human class could implement the Biped and so the Bird class – two different
    classes that are used to create two different types of objects, both containing
    the same properties and methods. Without needing to know anything about the Human
    or Bird class, we could refer to both objects as if they were the same type of
    object, as is Biped object.


    Just as classes can extend each other so interfaces can. A class that implements
    an extended interface must implement all the methods of the extended interface,
    as well as the base interfaces from which the extended interface is derived. With
    our Biped analogy, we could create a Primitive interface that extends the Biped.
    The Primitive interface could define the properties body, left arm, right arm,
    hair, and head, and the methods turnBody and bendOver. A Human class implementing
    the Primitive interface would have to contain all these properties and methods,
    as well as defined by the Biped interface that Primitive extends.


    Interfaces do not define how a method actually functions – only that it must exist.
    Creating interfaces and extending them in this way creates a framework of how
    objects within a system are related to one another and the properties and methods
    these objects possess. This is in essence how the DOM interfaces work. The DOM
    define properties and methods that objects within a program (the browser in this
    case) must implement to represent and manipulate the document structure. The DOM
    defines many interfaces and this chapter will concentrate on a few of the key
    interfaces from the DOM Core module.


    # Core DOM Interfaces


    The most fundamental DOM interface is the Node interface – this is the primary
    (or base) datatype for the entire document object tree, defined within the DOM
    Core module. It represents a single node in the document tree, and is implemented
    by all node objects within the document.


    The Node interface defines many methods and properties


    197'
