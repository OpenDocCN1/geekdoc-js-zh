  md: "# Chapter 9\n\n# Writing a Multi-Value Cookie\n\nA multi-value cookie is a\
    \ simple cookie that takes more than one value. It's useful when the 20 cookie\
    \ per server limit is just too restrictive for our needs. We store multiple values\
    \ within the value part of the cookie, using an equals sign to associate their\
    \ names and values, and delimiting them from each other using ampersands;\n\n\
    ```\nFirstMultiValue=Value1&SecondMultiValue=Value2&FinalMultiValue=FinalValue\n\
    ```\n\nThe only limit on multi-value cookies is a little more complex than writing\
    \ a normal cookie, because we need to take into account situations where there\
    \ are already multi-values inside the cookie we're adding to, when we need to\
    \ be careful not to remove the existing values. Here's the code:\n\n```\nfunction\
    \ writeMultiValue(cookieName,\n                multiValueName,\n             \
    \   value,\n                domain,\n                path,\n                secureFlag)\n\
    {\n  var cookieValue = readUnescapapedCookie(cookieName);\n\n  if (cookieValue)\n\
    \    var stripAttributeExp = new RegExp(\"^|&|\" + multiValueName + \"=[^&]**\"\
    );\n    cookieValue = cookieValue.replace(stripAttributeExp, \"$1\");\n    if\
    \ (cookieValue.length != 0)\n      cookieValue += \"&\";\n  else\n    cookieValue\
    \ = \"\";\n\n  cookieValue += multiValueName + \"=\" + escape(value);\n  var cookieDetails\
    \ = cookieName + \"=\" + cookieValue;\n  cookieDetails += (expires ? \" expires=\"\
    \ + expires.toGMTString() : \"\");\n  cookieDetails += (domain ? \" domain=\"\
    \ + domain : \"\");\n  cookieDetails += (path ? \" path=\" + path : \"\");\n \
    \ cookieDetails += (secureFlag ? \" secure=\" : \"\");\n  document.cookie = cookieDetails;\n\
    }\n```\n\nThe function's parameters are identical to those of writeCookie() except\
    \ that we need to pass the name of the multi-value as well as the name of the\
    \ cookie to write it to. The first task is to obtain the cookie with that cookie\
    \ name:\n\n292"
  merge: -1
