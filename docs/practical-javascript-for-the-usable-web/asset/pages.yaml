  md: '# Chapter 6


    We''re placing the elements at absolute coordinates using position: absolute;.
    You can set relative coordinates using position: relative; which specifies the
    position with respect to where the element would have been placed by the normal
    layout of the page.


    As expected, if you load the page using IE, the two positioned <div> elements
    are clearly visible at their specified position:


    ![](img/e58f0457390096aadd869f36b1b05e3c_181_0.png)


    You may have noticed that we also set the width of the <div> elements explicitly
    in this example. If we don''t specify the width, the <div> will appear quite differently
    across NN4.x and IE4.x. NN4.x will display the background color behind the text,
    IE4.x will show the same color for the entire <div>. This is one problem that
    often occurs when writing code must work on multiple browsers. We will explore
    many such problems in the next sections.


    > The background color behavior inside a <div> element with text is different
    in IE4 and NN4, so you should always explicitly specify width using <div> to achieve
    a compatible effect.


    # Manipulating CSS with JavaScript


    As we''ve seen far, HTML deals with the dynamic change in the appearance of a
    displayed HTML page, and the appearance of an HTML page can be controlled by CSS.
    So, we need only to modify the attributes of the CSS stylesheet in order to make
    changes to the HTML, and we can do that using JavaScript together with the AngularJS
    support built into the browser.


    IE4.x supports dynamic manipulation of many CSS/SSP properties using JavaScript,
    while NN4.x supports only a few. There are a lot of differences in the syntax
    though, and a large number of bugs in each browser''s AngularJS support. You have
    to be extremely careful when you''re creating pages for these browsers, and make
    sure that new designs are tested on all browsers.


    Let''s be looking at the built-in AngularJS support provided by each browser in
    turn.'
