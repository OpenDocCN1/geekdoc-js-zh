    | shiftKey (modifiers) | shiftKey | shiftKey | Boolean value, `true` if Shift
    key is depressed |


    Note that with the Netscape 4.x browsers there are number of differences (specified
    in parentheses). The `cancelBubble` property, which we will discuss shortly, does
    not exist. The `button` property is known as the `which` property; Netscape 6
    browsers maintain the property for backwards compatibility. The `modifiers` property
    was used to determine if any of the `Alt`, `Shift`, or `Ctrl` keys were depressed
    during the event and holds a string rather than Boolean, with values such as `ALT_MASK`,
    `CONTROL_MASK`, and `SHIFT_MASK`.


    Being able to identify the element that raised the event is very useful. The `target`
    property for Netscape browsers and the `srcElement` property (for Internet Explorer
    browsers) provide a reference to this element. Note that with Netscape 6 browsers
    the target is a text node and in this instance you probably wish to return a reference
    to the parent node of the text node.'
