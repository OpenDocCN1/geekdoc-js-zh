    \ they want to purchase. It helps reassure the customer that they have entered\
    \ their order correctly, and gives them a chance to go back and change things\
    \ if they spot a mistake.\nStarting at the top of the page, after the necessary\
    \ heading tags, we have the first script block.\n\n```\n<html>\n<head>\n<script>\n\
    if (parent.myBasket.isEmpty()) {\n  window.location.href = \"emptybasket.htm\"\
    ;\n}\n</script>\n```\n\nIf the basket is empty, then there is no order to submit,\
    \ so we take the user to the emptybasket.htm page. This is to prevent the situation\
    \ where the user manages to navigate to this page using a different method than\
