    \ the functions will do nothing and without raising an error.\n\nThe JavaScript\
    \ that's causing the error when the first loads is to a nonexistent hideImageLoadingImage()\
    \ function. We need to create an empty function for this and also include functions\
    \ for the onclick event handlers of the image elements that will be used to cause\
    \ the document in the thumbnail iframe to scroll up and down.\n\n```\n<script\
    \ language=\"JavaScript\">\nfunction hideImageLoadingImage() {\n  // add code\
    \ here\n}\n\nfunction scrollThumbnailUp_onclick() {\n  // add code here\n}\n\n\
    function scrollThumbnailDown_onclick() {\n  // add code here\n}\n</script>\n```\n\
    \nIf you now copy this script block and add it to the header section of the page,\
    \ the JavaScript error will not be raised anymore. In addition, clicking the arrowheads\
    \ at the top and bottom of the thumbnail iframe will silently execute and not\
    \ raise a JavaScript error.\n\n# Allowing for Smaller Screens\n\nIf you look carefully\
    \ at the style properties for the mainFrame iframe, which is used to display the\
    \ full image, you will be able to calculate that the right-hand side of the iframe\
    \ is located 960 pixels (left + width = 320+460 = 960) from the left-hand side\
