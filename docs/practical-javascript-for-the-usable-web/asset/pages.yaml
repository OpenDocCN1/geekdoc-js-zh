  md: "# Chapter 7\n\n# The Event Object\n\nThe event objects expose a number of properties\
    \ that describe the event that occurred, such as the type of event, where on screen,\
    \ and over which element it occurred. As mentioned earlier, event-handling functions\
    \ with Netscape browsers are automatically passed a reference to an event object,\
    \ whereas Internet Explorer creates a global event object. The first task, therefore,\
    \ when creating an eventhandling function is to obtain a reference to the event\
    \ object for the correct browser in use. The following functions show one way\
    \ of obtaining a reference to the event object:\n\n```\nfunction document_mouseover(evt)\
    \ {\n  var eventObj = null;\n  if (evt) {\n    // try to use NN event object\n\
    \    eventObj = evt;\n  } else if (window.event) {\n    // try to use IE event\
    \ object\n    eventObj = window.event;\n  } else {\n    // Event not found handling\
    \ code\n  }\n  // other event-handling code\n}\n```\n\nIn this example, the function\
    \ has been named as if it were to be used to handle a mouseover event on the document.\
    \ A single parameter to the function is defined for Netscape browsers. The first\
    \ line may be a bit confusing at first, but really it's quite simple. A variable\
    \ eventObj is declared and an if...else statement block is used to try and obtain\
    \ the correct reference to the event object raised. First we try to set the variable\
    \ to the evt parameter for NN browsers. If it does not, we try using the window.event\
