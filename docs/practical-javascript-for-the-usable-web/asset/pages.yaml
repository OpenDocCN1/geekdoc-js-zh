  md: '# The DOM: DHTML for the Latest Browsers


    In Chapter 4 we met some of the objects that most browsers make available to JavaScript.
    These include the window navigator objects, which can be used to identify the
    browser environment an HTML page exists in and navigate the Internet using JavaScript.
    The chapter also looked at the simple document object model (DOM) that exists
    in the IE4 and NN4 browsers and how it can be used to access parts of the document,
    such as images and form elements.


    In Chapter 6 we went on to look at how we can use DHTML to effect changes within
    the document. The ability to cause these changes can vary greatly between IE4
    and NN4 browsers and the chapter explored the ways in which the object support
    of IE4 and NN4 differs. Here, we complete our investigation of browser objects
    by looking at the W3C DOM, which defines objects that it is hoped and future browsers
    will all support, making browser compatibility problems much less of an issue.


    The Document Object Model (DOM) developed by the W3C defines a platform- and language-neutral
    programming interface (API) that allows programs and scripts to dynamically access
    and update the content, structure, and style of HTML and XML documents.


    Browsers that support the ECMAScript binding of DOM methods and properties to
    allow JavaScript to use these DOM methods and properties rather than a browser-specific
    API. This increases the cross-browser/platform compatibility of the JavaScript
    code. The aim, therefore, is to allow code coded using the DOM API to be written
    once and work across different browsers with no, or a limited number of, modifications.


    In reality, the level of support for the DOM APIs is mixed. The two main browsers
    Internet Explorer 5+ and Netscape 6+ have the highest level of support for the
    DOM. However, they have only implemented parts of the DOM, and not necessarily
    the same parts. This chapter will focus only on the important parts of the DOM
    that have been implemented and are similar in both browsers.'
  merge: -1
