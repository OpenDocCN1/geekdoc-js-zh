    # Hierarchical Relationship


    When created and opened a new window there was no direct relationship between
    the window. The pop-up window has the opener property that allows JavaScript to
    obtain a reference back to the window that opened it. Itrames are to the window
    in which they are contained, but do not have the opener property. Instead, a direct
    hierarchical relationship exists between the containing window and the iframe
    located inside it; closing the window also closes the iframe window. The containing
    window is known as the parent window, and the iframe is known as a child window
    of the parent window.


    To access the from the child iframe, the iframe object has a property, called
    parent, which stores a reference to the parent window in which it is contained.


    ```

    // Access the properties and methods within the iframe''s parent window

    var myVar = parent.someVariable

    parent.someFunction()


    // Obtain a reference to the document within the iframe''s parent window

    var parentDoc = parent.document

    parentDoc.bgColor = "red";

    ```


    Here we see how to call up the parent window and change the background colour
    of the page to red.


    # Multiple Windows within Window


    As we have seen throughout this chapter, a browser is able to have more than one
    window open at any time. Each window can contain either an HTML document within
    a <body> tag or a <frameset> tag. A frames comprises of 1 or more frames within
    a single browser window, and hence you can have multiple windows existing within
    a single window.'
