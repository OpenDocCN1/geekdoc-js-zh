  md: "# Chapter 7\n\n```\n<span>\n<form>\n<input type=\"button\" value=\"Highlight\"\
    \nonclick=\"highlightElement('firstname')\">\n</form>\n<body>\n</html>\n```\n\n\
    Clicking on the button in this example will simply highlight the word **Bilbo**,\
    \ which is found in the first <b>-element, by setting the font color to red and\
    \ the font size to 14pt.\n\n# Traversing the Document Structure\n\nAs we saw earlier,\
    \ the document structure is represented within a tree structure comprising many\
    \ different nodes. The two DOM methods discussed in the previous section provide\
    \ high-level functionality to search the document structure, find particular HTML\
    \ elements within the structure, and return references to them. The DOM also provides\
    \ low-level properties to traverse the document structure and access the nodal\
    \ elements within. By using these lower-level properties you can 'walk' through\
    \ the tree structure by node, either vertically or horizontally depending on your\
    \ needs.\n\nOften, using the low-level node traversal properties, you will first\
    \ obtain a reference to a parent node. For any parent node, there may be zero\
    \ or more child nodes. (Note, however, not all nodes have children; for example\
    \ text nodes are the branches of the tree structure and therefore have no child\
    \ nodes. In these instances the traversal properties have a `null value`.) Node\
    \ objects have three properties that provide access to the children of a parent.\
    \ The first of these is the `childNodes` property, which stores a list of the\
    \ child nodes. The elements of the list can be accessed in a similar way to an\
    \ array. Loops can be used to iterate through each of the nodes in sequence and\
    \ perform some operation on or with them.\n\n```\nvar children = node.childNodes;\n\
    for (var i = 0; i < children.length; i++) {\n  var child = children[i];\n  //\
    \ something with the child node\n}\n```\n\nNote that there is a major inconsistency\
    \ here — the NN6 and IE5+ browsers for the same document build different `childNodes`\
    \ collections, they treat white space characters as line breaks, carriage returns\
    \ and tabs. For example, consider the following page `childNodesProblem.html`:\n\
    \n```\n<html>\n<head>\n<title>childNodes problem</title>\n</head>\n<body onload=\"\
    alert(document.body.childNodes.length);\">\n<p id=\"p0\">a paragraph</p>\n<p id=\"\
    p1\">a paragraph</p>\n</body>\n</html>\n```"
