  md: "There is one small but significant difference between the while loop and the\
    \ do...while: the while loop tests the condition before the code is executed,\
    \ and only executes the code block if the condition is true, while the do...while\
    \ loop executes the code block before testing the condition, by doing another\
    \ iteration if the condition is true. In short, the do...while loop is useful\
    \ when you know you want the loop to execute at least once before the condition\
    \ is tested. We could write our previous example with a do...while loop like this:\n\
    \n```\n<html>\n<body>\n<script language=\"JavaScript\">\nvar userNumbers = new\
    \ Array();\n\n//declare the userInput but don't initialize it\nvar userInput;\n\
    var arrayIndex = 0;\n\ndo {\n  userInput = prompt(\"Enter a number, or 99 to exit\"\
    , \"99\");\n  userNumbers[arrayIndex] = userInput;\n  arrayIndex++;\n} while (userInput\
    \ != 99)\n\n</script>\n</body>\n</html>\n```\n\nIn this example we don't need\
    \ to initialize the userInput variable because the loop code executes before testing\
    \ the value of userInput variable.\n\n# Continuing the Loop\n\nAs we've already\
    \ seen, the break statement is great for breaking out of any kind of loop once\
    \ a certain event has occurred. The continue keyword works very like break, except\
    \ it stops and re-tests the condition without dropping out of the statement altogether.\
    \ Like the break statement, you can use continue with any of the loops we've worked\
    \ with in this chapter.\n\nLet's first alter the previous example so that if the\
    \ user enters something other than a number, the value is not recorded and the\
    \ loop finishes, using break:\n\n```\n<html>\n<body>\n<script language=\"JavaScript\"\
    >\nvar userNumbers = new Array();\nvar userInput;\nvar arrayIndex = 0;\n\ndo {\n\
    \  userInput = Number(prompt(\"Enter a number, or 99 to exit\", \"99\"));\n  //check\
    \ that user input is a valid number, and if not, break with error msg\n  if (isNaN(userInput))\n\
    ```"
