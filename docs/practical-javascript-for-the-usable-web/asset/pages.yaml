  md: "# Functions and Code Design\n\nFinally linked the code that function we will\
    \ contain be enclosed in curly braces, (), beneath the function header. The curly\
    \ braces enclose the \"body\" of the function:\n\n```\nfunction myFunctionName(firstParameter,\
    \ secondParameter, anotherParameter)\n  /\n  // Function Code\n  /\n}\n```\n\n\
    # Variable Scope and Lifetime\n\nIn JavaScript, variables have something called\
    \ scope. Scope dictates how much of the rest of the script, or even pages of an\
    \ application, can access the variable. This is known as the visibility of the\
    \ variable. Variables can be visible within certain code blocks in a page, to\
    \ the complete page, or even to an application composed of many pages.\n\nClosely\
    \ linked to the concept of scope is the concept of a variable having a certain\
    \ lifetime. Let us look at an example:\n\n```\n<html>\n<body>\n<script language=\"\
    JavaScript\">\n  var myGlobalVariable = \"GLOBAL\";\n\nfunction myFunction() {\n\
    \  var myLocalVariable = \"LOCAL\";n}\n</script>\n</body>\n</html>\n```\n\nWe\
    \ have two variables; the first is called myGlobalVariable and is inside the script\
    \ but outside the function myFunction, while the second variable is called myLocalVariable,\
    \ and lives inside the function myFunction().\n\nThe scope of myGlobalVariable\
    \ is the whole page. In other words, it can be accessed from anywhere where even\
    \ code functions can access this variable. Its lifetime is the duration the page\
    \ remains loaded: as soon as the user navigates to another page or even refreshes\
    \ this page then the variable's value is lost and the variable can no longer be\
    \ accessed.\n\nThe scope of myLocalVariable, on the other hand, is limited to\
    \ the function itself. It cannot be accessed by code outside of the function,\
    \ and its lifetime is limited so that it exists when the function is called. Once\
    \ the function finishes, the variable ceases to exist.\n\nSo, why not declare\
    \ every variable as global if local variables seemingly limited? Well, there are\
    \ several good reasons for using local variables. Firstly, JavaScript variables\
    \ take up memory, and by using local variables we can ensure that those resources\
    \ are only used when necessary, because as a variable goes \"out of scope\", the\
    \ memory is released and reassigned to other variables.\n\n61"
