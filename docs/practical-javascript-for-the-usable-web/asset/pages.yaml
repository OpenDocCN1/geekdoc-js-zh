    used to specify different versions of JavaScript:


    | Attribute Value | Example | Effect |

    |---|---|--|

    | JavaScript1.2 | <SCRIPT language="JavaScript1.2"> | Code will be executed only
    by IE4+ and NN4+. Incompatible with this version will ignore it. |

    | JavaScript1.3 | <SCRIPT language="JavaScript1.3"> | Only Netscape 4.06+ and
    IE5+ will execute the code. Incompatible browsers will ignore it. |

    | JavaScript1.5 | <SCRIPT language="JavaScript1.5"> | Only NN6+ will execute the
    code. Incompatible browsers will ignore it. |

    | JavaScript | <SCRIPT language="JavaScript"> | Only IE4+ will execute the code.
    Incompatible browsers will ignore it. |


    Although we''ll be specifying the language in the examples in this book, we won''t
    specify a specific version of JavaScript, but use browser-checking code in the
    examples where the Internet Explorer and Netscape code is the same for a few subtle
    differences. You''ll find most examples in the book work same in IE4 and Netscape
    browsers.


    # JavaScript Syntax


    Before we go any further we should discuss some JavaScript syntax essentials:


    +   - // Indicates what follows is a comment and not code to be executed, so the
    interpreter doesn''t try to convert it to machine code and run it. Comments are
    a handy way of putting notes in the code to remind us what the code is intended
    to do, or to help anyone else reading the code see what''s going on.'
