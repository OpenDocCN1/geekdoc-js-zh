  md: "# Chapter 9\n\n# getCookieValue() Method\n\nThis method, which is used by the\
    \ loadBasket() method, extracts a specific cookie from the document.cookie property.\
    \ It should look familiar - it's based on the cookie methods we built earlier\
    \ in the chapter.\n\n```\nShoppingBasket.prototype.getCookieValue = function(cookieName)\
    \ {\n  var cookieValue = document.cookie;\n  var cookieRegExp = new RegExp(\\\
    b\" + cookieName + \"=([^;]+)\\)\");\n  cookieValue = cookieRegExp.exec(cookieValue);\n\
    \n  if (cookieValue != null) {\n    cookieValue = cookieValue[1];\n    cookieValue\
    \ = unescape(cookieValue);\n  }\n\n  return cookieValue;\n}\n```\n\nFirst we obtain\
    \ the document.cookie value. Then we create a regular expression that matches\
    \ the cookie. The regular expression will look for a word boundary, followed by\
    \ the cookie name, followed by an equals sign, and then followed by a group of\
    \ one or more characters that are not a semicolon (remember a semicolon indicates\
    \ the end of the cookie). As in the earlier example, the group of characters contains\
    \ the cookie value.\n\nThe exec() method of RegExp object will try and match our\
    \ pattern. If successful, it returns an array containing details of the match.\
    \ If the match is not found then it returns null.\n\nWe check to see if the cookie\
    \ is found, that null was not returned. If it wasn't null, then we extract the\
    \ value of the group inside the regular expression, then unescape its value.\n\
    \nFinally, the cookie's value or null (if it wasn't found) is returned.\n\n# loadBasket()\
    \ Method\n\nAs the name suggests, it loads the basket if the user returns to the\
    \ web site after an absence:\n\n```\nShoppingBasket.prototype.loadBasket = function()\
    \ {\n  var basketItems;\n  var basketItemNum;\n  var itemDetail;\n  var itemRefId\
    \ = \"\";\n  var itemImgSrc = \"\";\n  var itemPrice = \"\";\n  var itemQty =\
    \ \"\";\n\n  var basketDetails = this.getCookieValue(\"ImageShopBasket\");\n \
    \ if (basketDetails != null) {\n    basketItems = basketDetails.split('\\;');\n\
    \  }\n```\n\n314"
