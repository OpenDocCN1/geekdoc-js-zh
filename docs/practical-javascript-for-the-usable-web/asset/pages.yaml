    argument, be aware that the user will not be able to navigate back to a previous
    page in the pop-up window because the history no longer has a reference to it
    – users can find this irritating.


    # Creating Dependent Pop-up Windows


    Earlier I mentioned that pop-up windows are created independently of the opener.
    This need not necessarily be true; it is possible to create pop-up windows that
    are dependent on the opener. In this instance, closing the opener window will
    automatically close the pop-up window too.


    With Netscape 4+ browsers you can include a proprietary feature name, called dependent,
    that will create a pop-up window and is dependent on the opener. In this case,
    closing the opener window will cause the pop-up window to close. In Netscape 6+
    browsers you can also add a second proprietary feature name, called modal, when
    the pop-up window is displayed, which prevents the user from interacting with
    it, or by switching, to the opener until the pop-up window is closed.


    ```

    var helloWin = window.open("hello.html", "helloWin",

    "width=200,height=200,dependent=yes,modal=yes");

    ```


