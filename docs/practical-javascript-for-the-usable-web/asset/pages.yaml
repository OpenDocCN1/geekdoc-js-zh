    for dynamically changing the list of options inside a select control. We''ll also
    see that, using the HTML techniques we saw in Chapters 6 and 7, we can create
    our own form controls. The advantages of this are that we can make them look more
    exciting than the usual rather dull grey controls, and we can create controls
    that don''t exist by default, allowing us to obtain information from the user
    in a more friendly and intuitive way.


    In the previous three chapters, we have built an image viewer, one step at a time.
    In the second half of the chapter, we''ll start converting this image viewer into
    an e-commerce based application that allows users to view images online, add to
    a shopping basket, and order paper print versions. The e-commerce image viewer
    will be completed in Chapters 9 and 10.


    # Advanced Forms


    As mentioned above, we''ll first see how we can add new options to a select control
    that has already been loaded into the page. Then we''ll create our own HTML form
    controls that allow us to go beyond boring buttons and input boxes and create
    more helpful user interfaces.


    # Adding Elements to a Select Control


    It''s often useful to dynamically change the options available to a user in a
    select control after the page has loaded. For example, a site collecting the user''s
    personal information may have two select boxes, one allowing the user to select
    their country, the other state. It would be nice to dynamically change the states
    in the state box when the user changes the country. There are many browser-specific
    techniques for adding select control options, but here we''ll cover just one way,
    cross-browser technique that works with IE4+ and NN4.


    > Note that, while useful in moderation, over-use of this technique may confuse
    the user.'
