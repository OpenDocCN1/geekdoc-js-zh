    The Array object provides a number of methods for manipulating Arrays, including
    methods for cutting a number of elements from an Array, or joining two Arrays
    together. We''ll look at the methods for concatenating, slicing and sorting next.


    # Cutting a Slice of an array


    The slice() method is to an Array object what the substring() method is to a String
    object. Simply tell the method which elements you want to slice. This would be
    useful, for example, if you wanted to slice information passed using a URL.


    The slice() method takes two parameters: the first element of the slice, which
    will be included in the slice, and the final element, which won''t be. Access
    the second, third, and fourth values from an array holding 5 values in all, we
    use the indexes 1 and 4:


    ```

    <html>

