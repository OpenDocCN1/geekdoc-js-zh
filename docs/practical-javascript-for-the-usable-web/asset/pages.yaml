  md: '# Chapter 2


    All operators have an order of precedence. Multiplication, division, and modulus
    have equal precedence, so where they all appear in an equation sum will be calculated
    from left to right. Try this:


    ```

    2 * 10 / 5%3

    ```


    The result is 1, because the calculation simply reads from left to right:


    ```

    2 * 10 = 20

    20 / 5 = 4

    4%3 = 1

    ```


    Addition and subtraction also have equal precedence.


    You can use parentheses to give part of a calculation higher precedence. For example,
    you could add 1 to 1 and then multiply by 5 like this:


    ```

    (1 + 1) * 5

    ```


    The result will then be 10, but without the parentheses it would have been 6.
    In fact it''s a good idea to use parentheses even when they''re not essential
    because they make the order of execution clear.


    If use more than one set of parentheses JavaScript will simply work from left
    to right:


    ```

    document.write( 1 + 1 ) * 5 * ( 2 + 3 ) );

    ```


    This is how the sum is calculated:


    ```

    (1 + 1) = 2

    (2 + 3) = 5

    2 * 5 = 10

    10 * 5 = 50

    ```


    As we''ve seen, JavaScript''s addition operator adds the value on the left-hand
    side of the operator to the value on the right-hand side depends on the data type
    you''re using. For example, if you''re working with two numbers that have been
    stored as the number data type, then the + operator will add them together. However,
    if one of the types you''re working with is a string (as indicated by the delimiters),
    then the two values will be concatenated. Try this:


    ```

    <html>

    <body>

    <script language="JavaScript">

    document.write(''Java'' + '' Script'');

    document.write( 1 + 1 );

    document.write( 1 + ''1'');

    </script>

    </body>

    </html>

    ```'
