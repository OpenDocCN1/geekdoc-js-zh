    \ value stored in isCompulsoryElement.\n\n```\nValidate.prototype.isTextElementValid\
    \ = function(theElement,\n  validDataTypeRegExp,\n  isCompulsoryElement)\n{\n\
    \  var isValid = true;\n  var validDataType;\n\n  if (isCompulsoryElement && theElement.value\
    \ == \"\") {\n    isValid = false;\n  }\n  else {\n    validDataType = validDataTypeRegExp.exec(theElement.name)[0];\n\
    \    validDataType = validDataType.toLowerCase();\n    if (validDataType == \"\
    _compulsory\") {\n      isValid = this.isElementDataValid(theElement.value, validDataType);\n\
    \    }\n  }\n  return isValid;\n}\n```\n\nInside the method, we first check whether\
    \ the element is compulsory and contains no value. If this is the case, isValid\
