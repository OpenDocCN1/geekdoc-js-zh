  md: "# Functions and Code Design\n\n**A constructor** is a method called every one\
    \ of our objects on this class is created. It is useful for where we initialize\
    \ properties or the object in some way. We need to create a constructor if we\
    \ don't use it. As with functions, a constructor can have zero or more parameters.\n\
    \nWe're familiar with the methods of JavaScript's built-in objects, but now we\
    \ get the chance to define our own methods for performing specific tasks. Our\
    \ class will specify what methods we have and the code they execute. We can also\
    \ define our own properties. However, unlike other programming languages, we can\
    \ declare our class's properties, we don't need to - we can simply go ahead and\
    \ use properties without letting JavaScript know in advance.\n\nIt's a good idea\
    \ to put the code for a class definition inside a .js file. If we include classes\
    \ with the same purpose, for example classes for converting exchange rates, in\
    \ one file it can make it easier to work out which classes are defined in which\
    \ files.\n\nLet's create a simple class based on the real-world example of an\
    \ item in a user's shopping basket. We'll put this in a .js file ShoppingClasses.js.\n\
    \n# Defining a Class\n\nLet's start by creating a class for a shopping item. Our\
    \ class will be called the ShoppingItem class. The first thing we need to create\
    \ the class constructor:\n\n```\nfunction ShoppingItem(itemDesc, itemPrice, itemQty)\n\
    {\n  this.itemDesc = itemDesc;\n  this.itemPrice = itemPrice;\n  this.itemQty\
    \ = itemQty;\n}\n```\n\nThe first thought might be what we have here is simply\
    \ a function, and you'd be right. It's not until we start defining the ShoppingItem\
    \ class's properties and methods that it becomes a class. This is in contrast\
    \ to other programming languages, which have a more formal way of defining classes.\n\
    \nLooking at the code, the important thing to note is that the constructor's name\
    \ must match that of the class we are defining, in this case the ShoppingItem\
    \ class. That when a new instance of our class as an object, an object instance,\
    \ is created this function will be called automatically. We have three parameters\
    \ for our class and these are used inside the class itself, not when we use the\
    \ this keyword, for example:\n\n```\nthis.itemDesc = itemDesc;\n```\n\nInside\
    \ any class method, this keyword will refer to that object instance of our class.\
    \ Here we refer to the itemDesc property of this class object and set it to the\
    \ itemDesc parameter. If we have other object-oriented programming languages you\
    \ might wonder where we defined the itemDesc property. The answer is that we don't;\
    \ it creates for us. When we access the property JavaScript creates it as it needs\
    \ to. The same is true if we use the object with a property not mentioned in our\
    \ class. All this free property creation might sound great, but it has drawbacks,\
    \ the main one being that if we accidentally misspell a property name then can\
    \ make it difficult to track bugs. One way to avoid this problem is to create\
    \ methods that get a property value and others that allow us to set a property\
    \ value. This may sound like hard work, but it can reduce bugs, or at least make\
    \ them easier to spot. Let's create a few property get/set methods for our ShoppingItem\
    \ class:"
