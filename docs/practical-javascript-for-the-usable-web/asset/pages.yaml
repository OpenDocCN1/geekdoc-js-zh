    \ There are many people who have monitors that are capable of 800 pixels or less.\
    \ It would be good to create an interface that these users can use the application,\
    \ and see the navigation panels and whole image at the same time.\n\nThe amount\
    \ of work involved to do this is remarkably small. Only a few properties in the\
    \ stylesheet need change as you can see in the alternative stylesheet below:\n\
    \n```\n<style>\nbody { background-color: black; }\nimg, iframe { position:absolute;\
    \ }\niframe { top:50px; height:360px; margin:0px; border-style:none; }\n\n#categoryFrame\
    \ { left:0px; width:210px; }\n#thumbnailFrame { left:120px; width:190px; background-color:\
    \ black; }\n```"
