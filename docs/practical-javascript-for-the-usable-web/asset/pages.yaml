  md: '# Chapter 6


    Using <layer>, or an absolutely positioned <div> element (which is treated identically
    to a <layer> object), it is possible to create similar effects to browser enabled
    by the innerHTML and the dynamic rendering engine of the IE4+ series of browser.
    NN4''s HTML model, although slightly different, is still very capable of creating
    a dynamic web experience for the user.


    The real irony, is that the layer tag is no longer supported by NN6. Instead,
    the NN6 browser supports HTML through something called the W3C DOM (Document Object
    Model). More about this in Chapter 7.


    So we''ve could looking at distinct HTML for NN4 and IE4, but we haven''t yet
    seen how to put these two together in a page that works for both. We''ll look
    at that next.


    # Writing-Browser HTML


    Because of the incompatibility of HTML across the IE4.x and NN4.x series of browser,
    and even further incompatibility with the IE5.x, IE6.x and NN6.x series of browsers,
    writing HTML code that is cross-browser can be a pretty convoluted process.


    If we restrict our HTML code to simply accessing and manipulating CSS attributes,
    and confine our dynamic changes to the common set of attributes between the two
    series of browser, then we can write HTML code that works on both IE4 and NN4.
    However, this approach won''t give us much to work with, since the HTML support
    in the two browsers have very little in common. Even our goal is the most minor
    dynamic interaction, there are still significant differences between the two browser
    series that we must be very careful about.


    You need to be careful how you try to access the CSS property of an element that
    you want to change using JavaScript. This is how you''d access CSS properties
    in IE4+:


    ```

    document.all<element id>.style.<attribute>

    ```


    Note that, in IE4, all access to CSS properties of an element must go through
    the style object associated with the element. In NN4, however, we need to use
    the precise hierarchy to locate an element and its attribute:


    ```

    document.<element hierarchy>.id.<attribute>

    ```


    The document.all collection does not exist in NN4. We have to navigate through
    the element relationship hierarchy to locate a specific element. NN4 does, though,
    using JavaScript property syntax, which means we can access a CSS property without
    referring to an associated style object (as is required in IE4).


    So as we''ve already seen, you can write HTML code that moving elements dynamically,
    or modify the HTML that is displayed dynamically, using the layer tag in NN4 (or
    absolutely positioned <div>, <span>, <p>, etc). IE4, on the other hand, is able
    to re-render dynamically – so you can use the innerHTML property to replace any
    HTML fragment for dynamic changes. Here are some more crucial differences:


    174'
