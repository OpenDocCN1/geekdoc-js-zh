  md: "# Chapter 10\n\nBefore we start looking at the individual data-checking methods,\
    \ we need to create our class constructor, and add it to the currently empty Validate.js\
    \ file we created in Chapter 8 for our-commerce application:\n\n```\nfunction\
    \ Validate() { }\n```\n\nAlthough it doesn't do much, we need it for our class\
    \ to work.\n\nWe'll go on in the following sections to look at many methods that\
    \ we'll add to the class using the prototype property we have used in earlier\
    \ classes - if the class doesn't contain the validation method you want, it will\
    \ be very easy to create and add it to the Validate.js file yourself.\n\nMost\
    \ of our checking will involve regular expressions – these checking for patterns\
    \ of characters very easy. All of the methods take at least one parameter, which\
    \ is the data to be validated. They also return a Boolean value, which is either\
    \ true if the data was valid or false if invalid.\n\n# Validating Characters\n\
    \nOur first set of methods looks at the validation of sequences of letters, numbers,\
    \ and spaces.\n\n# Letters of the Alphabet, Numbers, and Spaces Only\n\nAs with\
    \ all the methods we give here, add this to the Validate.js file:\n\n```\nValidate.prototype.isAlphaNumeric\
    \ = function(string) {\n  var invalidCharactersRegex = /[^a-z\\d]/;\n  var isValid\
    \ = !(invalidCharactersRegex.test(string));\n\n  return isValid;\n}\n```\n\nOn\
    \ the first line, we create a new regular expression object containing the regular\
    \ expression:\n\n```\n/[^a-z\\d]/\n```\n\nThis regular expression specifies the\
    \ characters that are invalid in our string. The ^ character says \"not one of\
    \ the characters in the square brackets], that is not a letter of the alphabet\
    \ (a-z) or a digit (d) or space (note the space just before the closing bracket).\
    \ We have set the insensitive flag, i, at the end, so that neither uppercase nor\
    \ lowercase letters of the alphabet are matched by the expression.\n\nWe then\
    \ test to see if any invalid characters are found in our string:\n\n```\nvar isValid\
    \ = !(invalidCharactersRegex.test(string));\n```\n\nIf the string parameter's\
    \ value contains one of the invalid characters specified by the regular expression,\
    \ then invalidCharactersRegex.test(string) returns true (since one of the invalid\
    \ characters has been found). However, we want the isValid variable to contain\
    \ true if the string was valid, so if no invalid characters were found, we reverse\
    \ the result of invalidCharactersRegex.test(string) using the ! character. Now,\
    \ if invalid characters are found, invalidCharactersRegex.test(string) returns\
    \ true, which ! reverses, so that isValid contains false.\n\n# 340"
