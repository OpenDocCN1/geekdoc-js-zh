- img_proc: true
  md: '# Chapter 8


    | Special Character | Meaning | Example |

    | --- | --- | --- |

    | (n,m) | Match at least n and at most m of the preceding item | x(2,4) matches
    xx, xxx xxxxx, but not x or x |

    | ? | Match the previous item zero or one times (essentially making it optional)
    | x? matches x or no x |

    | + | Match the previous item one or more times | x+ matches x, or xx, or any
    number of x |

    | * | Match the previous item zero or more times | x* matches no x or x xx or
    any number of x |

    | | | Match the previous or the following item | x|y matches x or y |


    Finally we have special characters that specify where something should be matched,
    for example whether the match should be at the start of a word boundary:


    | Position Character | Description |

    | --- | --- |

    | ^ | The pattern must be at the start of the string, or if it''s a multi-line
    string, then at the beginning of a line |

    | $ | The pattern must be at the end of the string, or if multi-line string then
    at the end of a line |

    | \b | This matches a word boundary, essentially the point between a character
    and a non word character, for example the start of a word |

    | \B | Matches a position that is not a word boundary, for example not the start
    of a word. |


    That was a very brief introduction to regular expressions – more details can be
    found on the Web.


    Although we have looked at the syntax of regular expressions, we''ve still not
    seen how JavaScript allows us to built-in regular expression object, which allows
    us to create them. We can create a regular expression in a number of ways, but
    the easiest is using the method shown below:


    ```

    var myRegularExpression = /\b[a-z]+[nm]\b/;

    ```


    The / character marks the start and end of the regular expression syntax. We can
    then use the regular expression object itself or we can pass it to methods of
    objects as the String object, which uses regular expressions for its split(),
    replace(), search(), and slice() methods. We can also specify special attributes
    for the regular expression object that change how it works. For example, i specifies
    that the match be case insensitive, and g specifies that all matching patterns
    should be looked for, not just the first one.


    270'
