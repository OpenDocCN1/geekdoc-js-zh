  md: "# Chapter 9\n\nAlthough this is a great solution to the problem, you need to\
    \ be careful about storing user information. Information like credit card numbers\
    \ and names and addresses, for example, particularly if the user is on a public\
    \ access computer rather than their home PC, really shouldn't be stored unless\
    \ the user specifies that they are happy for you to do so.\n\nIn this example,\
    \ we're saving the values in the form using a multi-value cookie when the page\
    \ is unloaded – whether the user is browsing to another page, or web site, or\
    \ just closes the browser. When the user reloads the page we simply repeat the\
    \ textboxes.\n\nWe're only saving the cookie for the duration of the session rather\
    \ than long term – if the user has gone away and come back a week later, they\
    \ probably don't plan to enter the same information again. This functionality\
    \ would need to be changed according to the information collected. We'd also want\
    \ to incorporate a reset or clear button so that the user can wipe the details\
    \ completely and start again if we are using in this example.\n\nHere's the code,\
    \ `CookieExample.htm`:\n\n```\n<html>\n<head>\n<script src=\"CookieFunctions.js\"\
    ></script>\n<script>\nfunction window_onload() {\n  var customerName = readMultiValueCookie(\"\
    Customer\", \"Name\");\n  document.frmCookie.txtName.value = (customerName ? customerName\
    \ : \"\");\n\n  var customerAge = readMultiValueCookie(\"Customer\", \"Age\");\n\
    \  document.frmCookie.txtAge.value = (customerAge ? customerAge : \"\");\n\n \
    \ var customerAddress = readMultiValueCookie(\"Customer\", \"Address\");\n  document.frmCookie.txtAddress.value\
    \ = (customerAddress ? customerAddress : \"\");\n}\n\nfunction window_onunload()\
    \ {\n  writeMultiValueCookie(\"Customer\", \"Name\", document.frmCookie.txtName.value)\n\
    \  writeMultiValueCookie(\"Customer\", \"Age\", document.frmCookie.txtAge.value)\n\
    \nwriteMultiValueCookie(\"Customer\", \"Address\",document.frmCookie.txtAddress.value)\n\
    }\n</script>\n<title>Cookie Tester</title>\n</head>\n<body onload=\"window_onload()\"\
    \ onload=\"window_onunload()\">\n<form name=\"frmCookie\">\n  Please enter your\
    \ details:\n<p>\nName: <input type=\"text\" name=\"txtName\">\n<br>\n```\n\n298"
