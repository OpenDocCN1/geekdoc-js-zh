  md: '# Chapter 3


    # Summary


    In this chapter we started by looking at functions. We saw that functions allow
    us to wrap up frequently used code and put it into a single place that we can
    call again and again in our pages. As an example, we converted the currency conversion
    example from the last chapter into a function. We saw that we should give the
    function any information it might need by using parameters, which we can pass
    to the function when calling it. Functions can also return a value or we may choose
    to return nothing at all. If we want to return multiple values we can use an array,
    and this is only a good idea when the data is related. We also saw how we could
    make our parameters optional by checking whether they have been passed or not.


    We then looked at ways of making our code easier to debug and amend later if we
    need to. We saw that one of keys to creating easy maintain code was readability.
    If code is easy to read then it''s easier to spot bugs and change. By making code
    layout logical, indenting code blocks like those associated with loops and if
    statements, we make life much easier for ourselves. We also saw that using descriptive
    names for variables can help greatly.


    Our next topic was how to organize and reuse code. We found that the need for
    certain functionality, for example a math function or shopping basket functionality,
    appears in many of our web sites. We saw that by using .js files, we could put
    useful and related routines into one file and use them in different pages, even
    different web sites. It saves time because we don''t need to reinvent the wheel
    every time, and because if we spot a bug in a routine we fix it in one place and
    all the web pages and sites that use it also benefit. We saw that to include one
    of our .js files in a web page we needed to use the <script> tag and its src property.


    Finally, we looked at how we can create our own types of objects with JavaScript.
    We saw how these could be used to model real-world entities in a programming language.
    We gave as an example a shopping basket and items inside a shopping basket. We
    created classes that objectified these real-world things so we could create a
    shopping item object and a shopping basket object.


    We have now covered most of the essential JavaScript language so in the next chapter
    we can start applying it to the web browser and seeing how JavaScript and the
    web browser interact.'
