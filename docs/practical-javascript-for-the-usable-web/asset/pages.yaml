    You will notice that the function is similar to the two mouse event handlers,
    first obtaining the source element over which the event was raised. Since the
    source object is an <img> element, it possesses a src property containing the
    URL of the image as a string. This property is obtained and stored in the imgSrc
    variable and is used to calculate the URL of the full sized image.


