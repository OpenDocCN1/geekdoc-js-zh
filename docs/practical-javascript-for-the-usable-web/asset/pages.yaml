  md: '# Chapter 7


    One last point to note – importing XML documents into Macromedia Flash is very
    similar to importing XML into an HTML page. Flash uses a scripting language called
    ActionScript, which is based on JavaScript. Similar properties exist within Flash
    to extract and manipulate the XML data. It presents an interesting scenario: both
    a Flash- and an HTML-based web site could be designed to co-exist, the Flash and
    HTML pages acting as presentations, both delivering content from the same XML
    documents.


    I think you''ll agree that the ability to import XML data directly into a web
    page and using the DOM to manipulate it offers a powerful tool for creating web
    functionality, but as yet the potential has been little realized. In the future,
    as more people using the web have DOM-compliant browsers, you can expect to see
    XML-based web pages becoming more and more widespread.


    # DOM Event Model


    Events have been around since the earliest browsers started using JavaScript,
    although scripts to be executed in response to an action. Actions that can raise
    events are generated from a variety of sources, including the mouse, keyboard,
    and HTML elements.


    Here, we''ll look at events in a bit more detail, and see how they are handled
    in the latest browsers.


    # Event Flow Systems


    The NN4 and IE4+ browsers implemented two different event models that allowed
    the event to flow up or down the document structure.


    The event flow systems were introduced because of the way that information is
    represented in a web browser page. You know that within a document can be encapsulated
    by a variety of elements – for example, a piece of text can be located within
    a bold element, that is located within a paragraph. If you click on the text,
    what receives the mouse click event? Is it the text node, the bold element, the
    paragraph element, two of them, or all three? The answer is it could be any of
    these options. Using an event flow system, the event is passed from one element
    (or node) to the next along an ancestral chain until it encounters an object that
    is capable of handling the event.


    There are main event flow systems: event capturing and bubbling.


    # Event Capturing


    The event capturing system operates by an event being raised from the top of the
    document model and flowing down through the structure until it reaches the intended
    target. On its way through the document structure, every ancestor nodes that are
    registered to receive the same type of event as the target are able to capture
    the event before the target receives it.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# The DOM: HTML for the Latest Browsers


    Event capturing was introduced with NN version 4 browsers, but is not true event
    capturing as described above. Not all objects in the ancestral hierarchy are exploited
    when an event flows through the structure. In NN4 browsers, top-level objects,
    such as windows, documents, and layers, get a chance to handle the event before
    the intended target. In general, the event is directed directly to the target.
    Each time an event is raised, a new event is created and passed automatically
    to the event handler functions.


    # Event Bubbling


    The IE4+ browser adopted the event bubbling system. In these browsers, a single
    global event object is created, so that only one event object exists at any time.
    As new events are raised, they are held in a queue until the event currently processed
    has been completely handled. As the event exists as a global object, the event
    handler functions when triggered must obtain a reference to the event object from
    the window.


    Event bubbling is the symmetrical opposite of event capturing. When an event is
    raised, it is dispatched to the intended target, triggering the event handlers
    of the target if it exist. Once dispatched to the target, the event bubbles up
    to the parent chain to the top of the document structure, triggering event handlers
    attached to the parental ancestor nodes that are registered to handle.


    # The DOM Dual Approach to Event Handling


    The DOM Level 2 events provide a common subset of both the capturing and bubbling
    events systems in use and attempt to provide interoperability with existing scripts.
    The DOM events module has been designed to produce an event model system that
    allows:


    +   - The event binding to all nodes, not only HTML elements, as in NN4 and IE4.x/5
    browsers.

    - Event flow through the document structure that can either flow up or down the
    ancestral chain.

    - Contextual information for each event, for example where on the page the event
    occurred and the type of event that occurred.


    Currently only Netscape 6+ browsers use the DOM events model. Like the Netscape
    4 browsers, for each new event raised a new event object is created and it is
    automatically passed as the event handler functions.


    # Event Binding


    Event binding is the process of registering a function as responsible for handling
    an event of a particular type for a particular HTML element. When the element
    receives an event, the bound function handles the event (if it is of the correct
    type), and once the event is dealt with, it propagates through the document structure
    depending on the event flow system by the browser.


    Event handling via functions attached to an element by the event attribute of
    HTML is known as inline binding. This has the advantage of allowing you to pass
    parameters to the event handler''s functions easily. It is one of the simplest,
    most common, and backward-compatible methods for event binding. Indeed, we have
    already seen several examples in this chapter, as the onload attribute added to
    the <body> element in the Importing XML Documents example and as the onclick attribute
    added to the <ac> HTML element in the Modifying Attributes section.'
