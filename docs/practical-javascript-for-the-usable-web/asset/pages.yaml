    The fifth cookie attribute is the secure attribute. If it is set to true, the
    cookie will only be sent to the web server if it is a secure connection, as HTTPS.
    By default secure is false and cookies will be sent insecurely over any connection.


    Now we''ve discussed cookies and their main attributes, we''ll create some simple
    cookies. After we''ve done we''ll create a .js file that contains a number of
    useful functions to make cookie handling very easy.


    # Reading and Writing Cookies


    Reading and writing cookies centers round the document object''s cookie property.
    At it''s most basic, a cookie has a name and value:


    ```

    document.cookie = "MyCookieName=MyCookiesValue";

    ```


    Reading the cookie is unfortunately not as simple as, because document.cookie
    will return all the cookies saved on the client machine associated with the web
    server, so we need to extract the cookie holding the information we''re looking
    for. If we read back the above cookie like this:


    ```

    document.write(document.cookie);

    ```


    then this is what would be written to the page:


    MyCookieName=MyCookiesValue


    If we write two cookies and read them back, as in the short example CookieDisplay.htm
    below:


    ```

    <html>

    <head>

    </head>

    <body>

    <script language=''JavaScript">

    document.cookie = "FirstName=Cathleen";

    document.cookie = "LastName=Newman";

    document.write(document.cookie);

    </script>

    </body>

    </html>

    ```


    then this will be displayed:


    FirstName=Cathleen; LastName=Newman


    Cookies are separated using a semicolon and a space. We can use this syntax to
    extract the cookies using the String object like this (SimpleCookieRead.htm):


    ```

    <html>

    <head>

    </head>

    <body>

    <script language="JavaScript"

    ```'
