    X\">\n  <input type=\"radio\" name=\"group2\" value=\"Y\">\n</form>\n```\n\nEach\
    \ radio button group is accessible via the group name group1 and group2 in the\
    \ example above. The object this references is an array; each member of the array\
    \ is an individual radio button from the group. With any array, these can be accessed\
    \ using the index value. In the line below, the variable radioVal is set to the\
    \ value (A) of the first radio button in group1:\n\n```\nvar radioVal = document.form.group1[0].value;\n\
    ```\n\nHowever, what we're really interested in is usually the value of the particular\
    \ radio button that the user has selected. To get this, we need to loop through\
    \ the radio button's group array, look at each radio button to see if it's checked,\
    \ and then obtain its value. This is what the function below does:\n\n```\nfunction\
    \ getSelectedRadioValue(radioGroup) {\n  var selectedRadioButtonValue = \"\";n\
    \  var radIndex;\n\n  for (radIndex = 0; radIndex < radioGroup.length; radIndex++)\
    \ {\n    if (radioGroup[radIndex].checked) {\n      selectedRadioButtonValue =\
    \ radioGroup[radIndex].value;\n      break;\n    }\n  }\n  return selectedRadioButtonValue;\n\
    }\n```\n\nThis function takes one parameter, the radio button group whose selected\
    \ radio button we want to obtain.\n\nIn the first line, the selectedRadioButtonValue\
    \ is initialized to an empty string. If no radio button is selected, then this\
    \ empty string will be returned by the function.\n\nThe for statement, which follows,\
    \ iterates through each radio button by looping through the radioGroup array.\
    \ The number of buttons in the group can be determined using the radioGroup array's\
    \ property. In each iteration of the loop, the if statement checks to see whether\
    \ the radio button has been checked by the user. If it has, selectedRadioButtonValue\
    \ is set to the selected radio button's value. If a selected radio value was found,\
    \ we break out of the loop with the break statement - as there can only be one\
    \ selected, there is no need to look for more."
