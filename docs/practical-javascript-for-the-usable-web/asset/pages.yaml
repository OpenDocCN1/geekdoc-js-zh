    \ sure only pages inside that frame change. The frames don't have to be visible,\
    \ so the user doesn't even have to know about them. As we saw in Chapter 5, it's\
    \ easy to access code in other frames: all you need to do is manage theIPSET.\n\
    \nLet's look at a simple example consisting of three pages – first a frames-defining\
