  md: '# # Chapter 5


    Each frame is a window that contains a document and has a window object associated
    with it. These all exist within a top-level window that constructs the frame set.
    Therefore each time a frameset is used there are n+1 windows open, where n is
    the number of frames.


    Frames, iframes, are containers for documents and don''t have the same properties
    as a whole window – that is, they have no menus or toolbars. A number of properties
    can be specified, though, as a name, size, and position.


    # # Framesets


    Framesets have been available since Netscape 2 and Internet Explorer 3 browsers.
    They enable multiple documents to be viewed at the same time, independently of
    each other. A common usage of framesets is to define a frame that contains an
    offset-static page with a list of links, in the form of a menu, and another frame
    that is updated to view different documents. The following code (SimpleFrames.html)
    shows an example of the HTML code that could be used to create a two-pane frameset.


    ```

    <html>

    <frameset cols="30%,70%">

    <frame src="left.html" name="frLeft">

    <frame src="right.html" name="frRight">

    </frameset>

    </html>

    ```


    The frameset defines 2 frames, laid out in columns, with the left-hand side occupying
    30% of the browser width and the right-hand side occupying 70% of the browser
    width. The rows and cols attribute of the <frameset> element divides the screen
    into rows and columns. Both of these attributes take a comma-delimited list of
    values, where numbers are interpreted in percentages or pixels (if no percent
    symbol is used) and are based on available space within the browser window. Ideally,
    instead of calculating the size of each frame you can use a * symbol for one of
    the frame sizes, which means to take up any remaining space. So the <frameset>
    tag could have been defined using:


    ```

    <frameset cols="30%,*">

    ```


    or:


    ```

    <frameset cols="*,70%">

    ```


    For each frame to be included within the frameset a <frame> tag is used to define
    the frame, and the src property of this frame informs the browser as to which
    document to display within the frame. In our example, the HTML documents to be
    displayed in each frame are located within the same directory as the frames document.
    The name attribute is optional and provides a destination for any navigational
    targeting by links. That is, links in other frames can be instructed to open files
    in a named frame, rather obeying their default behavior (which generally means
    opening in the frame where the link is located)


    In this example the source for the left-hand frame (left.html) is:


    ```

    <html>

    <body>

    <h3>This is the left frame.</h3>

    </body>

    </html>

    ```'
