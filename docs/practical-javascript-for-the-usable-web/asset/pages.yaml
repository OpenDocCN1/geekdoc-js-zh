  md: '# Chapter 5


    Consider a page that contained an <iframe> and used the following HTML code:


    ```

    <iframe src="hello.html" name="hello" width="200" height="200"></iframe>

    ```


    A page loaded with this code will produce an iframe that is 200 pixels wide by
    200 pixels high. The src attribute dictates which HTML document will be loaded
    into the iframe. The name attribute is used to allow us to write JavaScript can
    easily access the iframe from the parent page. Remember this example will only
    work with Internet Explorer 3+, Netscape 6+, and HTML 4 compliant browsers. It
    will not work with Netscape 4 or earlier browsers, as they do not support the
    <iframe> tag.


    ![](img/e58f0457390096aadd869f36b1b05e3c_157_0.png)


    To access the properties and variables of the iframe, we need to create a reference
    to it. The iframe is an inline frame existing within the document, but is not
    a property of the document as one might initially think. Instead, it is a property
    of the window that contains the document. Note that windows can contain other
    windows and documents, whereas documents only contain content. The window object
    has a frames property, which is an array of references to the frames that exist
    within the window and by using this property we can obtain a reference to the
    iframe. There are three different ways that a reference to an iframe can be achieved:


    ```

    var ifHello = window.frames[0]

    var ifHello = window.frames[''hello'']

    var ifHello = window.hello

    ```


    The first example obtains the reference by its index within the page. As it is
    an array the first frame will have an index of 0. Alternatively, we can use the
    iframe''s name, instead of its index number. In the final example, we''ve simply
    used the name of the iframe itself without using the frames property.


    Having obtained a reference to the iframe, we can now communicate with it as we
    would with any other type of window, calling methods and properties of the iframe
    itself, custom variables and functions, or the document inside the iframe.'
