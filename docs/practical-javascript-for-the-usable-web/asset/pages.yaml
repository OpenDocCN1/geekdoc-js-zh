  md: 'Assuming it''s the first form in the page, it can be accessed in any one of
    the following three ways:


    ```

    document.forms[0]

    document.forms[''myForm'']

    document.myForm

    ```


    The first way is useful if there are are of forms in the page and we wanted to
    loop through each of in turn. However, generally, the third way is the easiest
    to use if no looping is needed.


    Accessing the form itself is just the start of JavaScript''s form functionality.
    More useful in client-side processing is being able to access the form elements
    (such as textboxes, radio buttons, and checkboxes) inside the form. The form object
    has elements array, which contains the objects corresponding to each form element
    within the form. We can use this to access each element, using either an index
    or the element name. For, However, it is also possible to access the element directly,
    just using its name. For example, we imagine we had an HTML form and form element
    (a textbox) as defined below:


    ```

    <form name="myForm">

    <input type="text" name="myTextBox">

    </form>

    ```


    We can access the form in any one of the three ways shown:


    ```

    document.myForm.elements[0]

    document.myForm.elements[''myTextBox'']

    document.myForm.myTextBox

    ```


    As expected, if we want to loop through the elements in a form, then the first
    way is the option we need. If we just to access a specific form by name, then
    the third method is generally easiest.


    Accessing the value of a form is generally a matter of accessing the form object''s
    value property. However, for some form elements, it is more complex than that.
    Below, we''ll look at each form element type in turn. The radio buttons and select
    control elements are more complex than the other elements – we''ll look in detail
    at each.


    # Button Elements


    The value of a button element corresponds to the text displayed on the button
    face. For a button myButton in my, the following code will change the button''s
    displayed text to somevalue.


    ```

    document.myForm.myButton.value = ''somevalue'';

    ```


    # Reset Button


    Accessing the value of a reset button again allows us to change what is displayed
    on the button face.


    ```

    document.myForm.myResetButton.value = ''somevalue'';

    ```


    Note that the form object has a reset() method that has the same effect as clicking
    this button – it resets all values in the form back to their default values.'
