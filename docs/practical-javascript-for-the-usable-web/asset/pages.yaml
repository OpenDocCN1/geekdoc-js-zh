  md: "# Interacting with the Web Browser\n\nThe order of the <img> elements in the\
    \ page's code determines their order in the images array. The first <img> in the\
    \ page is the first in the array and has an index value of 0; the second would\
    \ have an index of 1, the third and so on. As it's the first <img> element in\
    \ the page (in fact, here it is the only <img> element in the page), its index\
    \ is 0.\n\nAccessing via the index rather than name is useful when you want to\
    \ loop through all Image objects in the images array.\n\nBack to our code, we\
    \ could actually accessed the images array using the name of the <img> element\
    \ directly without using the squares. So:\n\n```\ndocument.images.SwapImg.src\
    \ = img;\n```\n\nis exactly the same as:\n\n```\ndocument.images['SwapImg'].src\
    \ = img;\n```\n\n# Image Rollovers and Caching\n\nA trick that's been available\
    \ since NN3 and IE4 is image rollovers. This happens when the user's mouse rolls\
    \ over an image, changing it to a different image. When mouse moves over the image,\
    \ it changes back to the original image. There are a few variations on this theme,\
    \ for example using image rollovers for menus, but the principles are the same.\n\
    \n> Note that we should be careful when using image rollovers not to hide information\
    \ that users might want to see without searching for it. Expandable menus, for\
    \ example, might not be perfectly helpful if the user has to rollover various\
    \ sites before finding what they are looking for.\n\nOne problem image rollovers\
    \ (and image swaps, as in the previous) suffer from is the time taken to load\
    \ the images from the server when they are first loaded. The resulting pause may\
    \ leave the page looking less smooth and professional. To ensure the images come\
    \ right away, we need to have them preloaded in the browser's cache. We do this\
    \ by loading all the necessary images into the browser as the page loads, even\
    \ if only some of them are initially shown. We can do this by:\n\n+   - Using\
    \ <img> elements with the width and height attributes set to 1 so they are not\
    \ visible.\n- Creating a new Image object for each image we want to load, and\
    \ setting the object's property to the file we cached.\n\nLet's look at an example\
    \ of the latter technique. This page is called ImageRollover.htm. (As usual, the\
    \ images are available within the code download)\n\n```\n<html>\n<head>\n  <script\
    \ language=\"JavaScript\">\n    var imgLinksOver = new Image();\n    imgLinksOver.src\
    \ = 'LinksButton_Over.jpg';\n  </script>\n\n  var imgLinksOut = new Image();\n\
    ```\n\n97"
