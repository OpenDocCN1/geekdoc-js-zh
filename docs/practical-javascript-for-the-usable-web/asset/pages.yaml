  md: '# Chapter 1


    Object-Oriented Programming OOP tries to make programming easier by modeling real-world
    objects. Let''s say we were creating a car simulator. First, we would create a
    car object, giving it properties like color and current speed. Then we''d need
    to create methods: perhaps a turn key method to start the car, and a press brakes
    method to slow the car, into we''d need to pass information about how the brakes
    were pressed so that we can determine the slowing effect. Finally we would want
    some events, for example gasoline to remind us to fill up the car.


    Object-Oriented Programming works with these concepts. This design of software
    is very commonplace and influences many areas of programming – but most importantly
    to us, it''s central to JavaScript and web browser programming.


    Some of the objects we''ll be using are part of the language specification: the
    String, the Date object, and the Math object. The same objects would be available
    to JavaScript in a PDF file and on a web server. These objects provide lots of
    functionality. The Date object, for example, allows you to obtain the current
    date and time from the PC. It stores the data and provides lots of useful related
    functions, for example converting the date/time from one zone to another.


    As we''ve already seen, the browser makes itself available for programming through
    these objects. These objects allow us to find out about the browser and to change
    the look and feel of the application. For example, the browser makes the document
    that represents a web page available to JavaScript. We can use this from JavaScript
    to add new HTML into the web page viewed by the web browser. If you were to use
    JavaScript with a different host, you''d find that the server hosting JavaScript
    exposes a very different set of objects, their functionality relates to things
    you want to do on a web server.


    We''ll also see in Chapter 3 JavaScript allows us to create our own objects. This
    is a powerful feature that allows us to model real-world problems using JavaScript.
    To create a new object we need to specify the properties and methods it should
    have using a template called a class. A class is like an architect''s drawing
    in that it specifies what should go and what to do, but it doesn''t actually create
    the object.


    > There is some debate about whether JavaScript is an object-based language or
    an object-oriented language. The difference is that an object-based language uses
    objects for programming but not allow the coder to use object-oriented programming
    in their code. An object-oriented programming language not only uses objects but
    makes it easy to develop and design code in line with oriented design methodology.
    JavaScript allows us to create our own objects but its syntax is not OO friendly
    as Java or C#, which have language constructs and features to enable OOP. However,
    we''ll be concentrating not on debates about what is isnt object oriented here,
    but on how objects are used in practical terms in this book, and we''ll look at
    some basic object-oriented coding which makes life easier for us.


    As we progress through the book we''ll learn in more depth about objects: the
    JavaScript language, the objects that the browser makes available for access and
    manipulation using JavaScript, and creating our own custom objects. For now, all
    we need to know is that objects in JavaScript are ''entities'' we can use to add
    functionality to web pages, and that they have properties, methods, and events
    – although not all of them do: the Math object, for example, has only properties
    (like the value of Pi) and methods (one such method generates a random number).'
  merge: -1
