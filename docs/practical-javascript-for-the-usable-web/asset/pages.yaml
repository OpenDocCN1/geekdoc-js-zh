  md: '# Summary


    We''ve covered a lot of ground in this chapter: most of the essentials of the
    JavaScript language in fact.


    We''ve looked at how JavaScript handles data and seen that there are a number
    of data types: string, number, Boolean, and object as well as some special types
    of data like NaN. We saw that JavaScript supplies a number of operators that perform
    operations on the data, for example numerical calculations or joining strings.


    We then looked at how JavaScript allows us to keep a temporary note of data using
    variables. Variables last for the lifetime of the page, or the lifetime of the
    function if they are inside a user created function. We also looked at how to
    convert one type of data to another.


    Next we worked with three of JavaScript''s object: the String, Date, and Math
    objects. We saw that each of these provided useful functionality for manipulating
    strings, dates, and mathematical functions. We also looked at the Array object
    which allows a number of items of data to be stored in one variable.


    We finished the chapter by looking at decision-making, the logic or intelligence
    of a programming language. We used if and switch statements to make decisions,
    for example using conditions to test the validity of data and act upon the findings.
    Loops also use us to repeat a block of code for a certain number of times or while
    a condition is true.


    In the next chapter, we''ll be finishing off our discussion of language essentials
    by creating and using our own functions, and seeing how this can help us create
    much more powerful code. We''ll also check out some good coding practices that''ll
    save you time and debugging effort if you implement them when you''re writing
    code. Finally, we''ll be looking at ways of storing useful libraries of code that
    you can use them as and when you need them.'
