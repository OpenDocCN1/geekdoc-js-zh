  md: '# Getting Started with JavaScript


    JavaScript has grown steadily in both popularity and capability since its inception
    and is now the number one browser scripting language. The technology has two key
    strengths: cross-browser support, and the ease with which it can be programmed.
    So successful has the JavaScript technology become that it''s no longer used for
    browser-based programming alone, but also for programming PDF files and web server
    programming.


    While the JavaScript language has been growing in capability, browsers themselves
    have also become much more programmable, enabling developers to access more of
    the page and its HTML elements. So JavaScript browser programming can now be extremely
    sophisticated and functional.


    Consequently, a book about JavaScript might cover all sorts of things, so we''ve
    narrowed down the field of exploration to concentrate on using JavaScript to develop
    user interfaces for web pages and applications that are both usable and functional.
    In the first few chapters we will look at the essentials of the JavaScript language,
    and then on to implementing it: using HTML to dynamically change pages after they
    have loaded, validating data entered by the user, and building more interaction
    into applications than is possible with HTML.


    We''ll be creating lot of short scripts in the chapters that follow, and we will
    tie everything together into a large application that we build upon the home:
    we will start constructing a web page that enables visitors to view large libraries
    of images, which would work well for sites with large numbers of images on them
    like a fansite. This part of the application will show you how to create effective
    user interfaces with JavaScript, and demonstrate how the usability of the web
    site can be improved with such an interface.


    As we progress through the book we will add e-commerce functionality to the site
    so that visitors can buy the images as well as view them. We''ll look at how JavaScript
    can be used to create shopping baskets, to obtain the information needed to place
    an order, and to validate that information. We''ll be concentrating our efforts
    on the front-end development process, leaving the server-side for another book.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Chapter 1


    Of course, it all begins here with this chapter, and this is where we''ll set
    up the rest of the book looking at:


    +   1. What JavaScript is and what it can do for us

    2. The advantages and disadvantages of JavaScript; the problems you are likely
    to encounter during JavaScript development, and the solutions to those problems.

    3. JavaScript in a web page and essential syntax

    4. Object Oriented Programming (OOP) – sometimes also termed Oriented Development
    (OOD) – in relation to JavaScript the web browser.

    5. Writing and running a simple JavaScript program


    Many of you will already have come across JavaScript, and already have an idea
    of what it is and what it can do, so we''ll move quite swiftly through the language
    and its capabilities first.


    # What is JavaScript?


    JavaScript started as LiveScript, but Netscape changed the name, possibly because
    of the excitement generated by Java, to JavaScript. The name confuses people,
    though they expect there to be a closer relationship between Java and JavaScript
    than actually exists. In fact there''s little in common between the languages,
    although some of the syntax looks similar.


    The JavaScript language was created by Netscape in 1996 and included in their
    Netscape Navigator (NN) 2.0 browser via an interpreter that reads and executes
    JavaScript included in .html pages. The language has steadily grown in popularity
    since, is now supported by the most popular browsers: those produced by Netscape
    and Microsoft as well as widely used browsers like Opera. The good news is that
    this JavaScript can be used in web pages for all major modern browsers. The not
    so good news is there are differences in the way the different browsers implement
    JavaScript, although the core JavaScript language is the same.


    The great thing about JavaScript is once you''ve learned how to use it for browser
    programming, you can move on to it in other areas. Microsoft''s IIS uses JavaScript
    to program server-side web pages, PDF files now use JavaScript, and even Windows
    admin tasks can be automated with JavaScript code.


    # What Can JavaScript Do for Us?


    The rollers and HTML tricks with JavaScript came along relatively recently in
    the history of technology. In the early days JavaScript was primarily used for
    manipulating data before posting it to the server, saving the contents of a form
    as the user moves from one page of an application to another, and client-side
    form validation – in fact, much of the functionality that it''s widely used to
    implement now.


    Validating the user''s data simply means checking that the data entered is appropriate
    before proceeding with the form. For example, if you want to enter a date in the
    format dd/mm/yy, then you can check numbers and not letters have been entered,
    and that the numbers make sense: the number representing the day is not higher
    than 31, and the number representing the month is not higher than 12.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Getting Started with JavaScript


    There are very good reasons for validating data on the client''s machine:


    +   User experience: the user doesn''t have to wait for the form to be sent to
    the server, checked for validity, and then possibly sent with error messages.
    Validating data on the client makes for a much smoother user experience.


    +   Server processing power: you''re generating far less work for the computer
    hosting the web site by checking forms before they are sent to the server. The
    hosting machine won''t have to handle the workload of validating the data and
    resending pages with errors in them to the user. Data checking on the server,
    sometimes necessary, uses up bandwidth and will ultimately reduce the maximum
    number of visitors you can accommodate on your web site at any time.


    Since Netscape Navigator 2 and the first implementation of JavaScript, things
    have moved on quite a bit. As browsers become more programmable, developers have
    been able to create more functional and interactive pages. A simple example of
    browser programmability in action is the image rollover, where one image is swapped
    for another when the user rolls her pointer over it. A more sophisticated example
    is a JavaScript powered shopping cart, which we''ll be creating later in the book.


    As JavaScript has developed in its own right, developers and designers have been
    able to create much impressive visual effects and interaction with the user. For
    example, JavaScript can be used to create a tree menu for web site navigation,
    like that one shown below which is Microsoft''s web site (http://msdn.microsoft.com):


    | Home |

    | Overview |

    | Product Information |

    | Technology Innovations |

    | Academic Features |

    | ADO.NET |

    | ATL Server |

    | Enterprise Features |

    | Language Enhancements |

    | .NET Framework |

    | Productivity |

    | RAD for the Server |

    | Web & Windows Forms |

    | XML Web Services |

    | Device Development |

    | News & Announcements |

    | Visual Studio Products |

    | Visual Basic |

    | Visual C++ |

    | Visual J++ |

    | Visual InterDev |

    | Visual FoxPro |

    | Visual SourceSafe |

    | VBA |


    This particular example only works in Internet Explorer 4 and above, but it''s
    perfectly possible to create a tree navigation structure that works for Netscape
    6+, and we''ll be doing that later on in the book.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Chapter 1


    > Special effects and inventive interaction can really enhance the user''s experience,
    but they can also really get in the user''s way if they are overused or inappropriately
    placed. The usability enhancements that you can make to your web site using JavaScript
    will encourage users to come back again and again.


    # The Advantages and Disadvantages of JavaScript


    We''ve already seen some of the advantages of JavaScript, like cross-browser support,
    validating data on the client, and being able to create more sophisticated user
    interfaces.


    JavaScript effects are much faster to download than some other front-end technologies
    like Flash and Java applets. In fact, unless you''re writing a massive JavaScript
    application, it''s quite likely that no significant download time will be added
    to a page using JavaScript on it. No users need to download a plugin before they
    can view your JavaScript, as they would with Flash for example, they simply need
    a browser that supports it - and, of course, most browsers differ.


    Other advantages include the fact that you don''t need any extra tools to write
    JavaScript, any plain text or HTML editor will do, so there''s no expensive development
    software to buy. It''s also an easy language to learn, and there''s a thriving
    and supportive community of JavaScript developers and information resources.


    The disadvantages of JavaScript, as most web development, are almost entirely
    related to browser compatibility.


    While the advantages in browser programming we''ve seen over recent years are,
    generally speaking, a good thing is, if you don''t implement them with care you
    can create a lot of inconsistencies and broken pages unintentionally with JavaScript.
    Code that works great on IE4 might not work at all on Netscape 4, what works in
    NN6 doesn''t always work in NN 4, and so on.


    In essence, there are two main problems with JavaScript and browsers:


    +   - The different JavaScript versions in different browsers.

    - Browser programming: the HTML elements and features of the browser that can
    be accessed through any scripting language. (IE4, for example, makes most of the
    page and HTML accessibility to scripts, Navigator 4 limits what can be accessed
    and manipulated.)


    # JavaScript Version Differences between Browsers


    The JavaScript language has gone through a number of versions, right from the
    first release, JavaScript 1.0, to the latest, JavaScript 1.5 (supported by Netscape
    browsers, currently 6.2). Microsoft calls its own version of JavaScript, which
    began with JavaScript 1.0, and is currently at 5.6, (supported by IE 6).


    While the names and numbers of the versions of JavaScript supported by Netscape
    and Microsoft may differ, the languages are broadly, but not entirely, the same.
    therein lies the problem: there are a significant number of small and sometimes
    subtle differences that can catch you out.


    This table lists the different versions and indicates where IE and Navigator versions
    of JavaScript are roughly compatible:'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Getting Started with JavaScript


    | Browser | NN3.0 | NN4.0 - 4.05 | NN4.06 - 4.76 | NN6.0+ |

    |---|---|---|---|--|

    | IE3.0 | JavaScript 1.1<br>Script 1.0 | | | |

    | IE4.0 | | JavaScript 1.2<br>Script 3.0 | JavaScript 1.3<br>Script 3.0 | | |

    | IE5.0 | | | | JavaScript 1.5<br>Script 5.0 |

    | IE5.5 | | | | JavaScript 1.5<br>Script 5.5 |

    | IE6.0 | | | | JavaScript 1.5<br>Script 5.6 |


    The table only gives a very rough approximation, and in those terms JavaScript
    IE3 = NN3, IE4 = NN4 and IE5+ = NN6. An example of the small differences is the
    `try..catch` clause, which is supported in JavaScript by IE5+ and NN6, but not
    in IE4 or NN4.


    Although there are plenty of references you can use to look up such differences,
    the only way of being sure that a page will work on different browsers is to test
    it as widely as possible. Programs such as VirtualPC from www.connectix.com allows
    you to install and run multiple operating systems with different browsers from
    one host operating system.


    # Browser Programmability


    While the language syntax and features of different versions of JavaScript are
    important, even more so is the browser being to view your web pages. Let''s go
    back to the basics to explain what this means in terms of JavaScript development.


    JavaScript isn''t able to do much without an environment, and in this book we
    are working with JavaScript in the browser. In this sense we could say that the
    browser is essentially the host. JavaScript''s uselessness lies in its ability
    to manipulate the host environment, whether that''s a web page, a PDF file, a
    web server, or Windows itself.


    Each of these host environments makes itself available for programming. It does
    this by providing objects that allow JavaScript to learn about, and manipulate,
    the host environment. This enables us to use JavaScript to add new HTML into a
    web page even when the user is viewing it. If we were using JavaScript in a Windows
    server then we''d find that the server exposes a very different set of objects
    with functionality related to the server.


    So browsers themselves also have different levels of programmability: the collection
    of browser elements and features that can be accessed through a programming language.
    Just as the HTML supported by different browser versions, so do the things we
    can access in the browser. A simple example would be the ability to change the
    image loaded in an IMG tag; this was supported by Netscape 3 but not by Internet
    Explorer 3, so attempting to access an IMG tag and change its source image will
    work great in one browser but fail completely in the others.'
