    advance exactly what data you''re going to be working with. Here Variables come
    in. Variables are placeholders for data in your script, and they''re central to
    JavaScript programming.


    # JavaScript Variables


    You have to declare a variable before you can do anything with it, and JavaScript
    will throw a syntax error if you try to use a variable without declaring it.


    We declare a variable by giving it a unique name and using the var keyword. Variable
    names have to start with a letter of the alphabet or an underscore, while the
    rest of the name can be made up of numbers, letters, and underscores, but can''t
    include punctuation marks.


    > Most things in JavaScript, variable names are case-sensitive: thisVariable and
    ThisVariable are different. Be very careful about naming your variables; you can
    run into all sorts of trouble if you don''t name them consistently.


    Always give your variables meaningful names. In the next example we''ll build,
    for example, we''re going to write an exchange rate conversion program, so we''ll
    use variable names like euroDollarRate and dollarToP. There are two advantages
    to naming variables descriptively: it''s easier to remember what the code is if
    you come back to it at a later date, and it''s easier for someone to use the code
    to see what''s going on. As we''ll see in the next chapter, code readability and
    layout are very important to the development of web pages. It makes quicker and
    easier to spot errors and debug them, and to amend the code as you want to.


    So, with all that said, let''s start declaring variables. We can declare a variable
    without initializing it, (giving it a value):


    ```

    var myFunction;

    ```


    Then it''s ready and waiting for we have a value. This is useful for variables
    that will hold user input.


    We can also declare and initialize a variable at the same time:


    ```

    var myFunction = "A String"

    var anotherVariable = 123;

    ```


    Or we can declare and initialize by assigning the return value of the prompt()
    function, or the sum of a calculation:


    ```

    var eurosToConvert = prompt("How many Euros do you wish to convert,\*\*");

    var dollars = eurosToConvert * euroDollarRate;

    ```'
