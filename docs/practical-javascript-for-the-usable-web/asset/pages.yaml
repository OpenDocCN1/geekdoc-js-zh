  md: "# The DOM: HTML for the Latest Browsers\n\nThe W3 DOM Events approach deployed\
    \ by Netscape 6 is similar to Internet Explorer's attachEvent() method. The DOM\
    \ approach uses a method called addEventListener(), which can be used with any\
    \ node within the document structure. That means all nodes can use this method,\
    \ as well as all HTML element nodes. The addEventListener method uses the following\
    \ syntax:\n\n```\nnodeRef.addEventListener(eventType, listenerReference, captureFlag);\n\
    ```\n\nThe first parameter is the name of the event, well without the preposition\
    \ (for example, click or load). The second parameter is the object reference to\
    \ the event-handling function. The third parameter is a Boolean value that determines\
    \ at which point in the event handler is triggered. As mentioned previously, DOM\
    \ events have produced a system that uses common elements from both the capture\
    \ and bubbling event systems.\n\nSetting the captureFlag to true will indicate\
    \ that the function wishes to initiate capture. After initializing capture, the\
    \ event will be dispatched to the event-listener function before passing the document\
    \ structure to any descendants registered to receive events. A value of false\
    \ for the captureFlag indicates that the event handler should only be triggered\
    \ during the bubbling event system. Bubbling up the document structure will not\
    \ trigger event listeners designated to use capture. In Netscape 6+ browsers,\
    \ our example will now look like this:\n\n```\nfunction eventHandler(evt)\n{\n\
    \  // something\n}\n```\n\n```\nvar myElement = document.getElementById(\"myElementId\"\
    );\nmyElement.addEventListener(\"click\", eventHandler, false);\n```\n\nWith object\
    \ binding, adding a new function to an event handler will remove the previous\
    \ function from handling the event. An advantage of event binding using the attachEvent()\
    \ or addEventListener() is that multiple event-handler functions can be registered\
    \ with an element to the same event.\n\n# Choosing an Event Binding Method\n\n\
    With so many techniques for event binding, you are probably a bit confused as\
    \ to which binding method to use. The answer is simply \"it's up to you\".\n\n\
    If you have support Internet Explorer, the W3C addEventListener() method is out\
    \ of the question. Furthermore, if you support Internet Explorer 5 on Mac, then\
    \ you can get about the attachEvent() method too - it is not supported on this\
    \ platform. Similarly, if you have to support the Netscape 4 browser, you can\
    \ forget both of these methods.\n\nIf you have to be compatible with the above\
    \ browsers, your choice becomes limited to inline binding or object binding. These\
    \ provide the best support across multiple platforms, with old and new versions\
    \ of the same browser.However, there is a problem with these forms of binding\
    \ too. Like IE4+, NN4 will allow event handlers to be added to all elements, but\
    \ not IE4+. NN4 does not support event handling on all elements. This means that\
    \ no event-handler function will be triggered for most elements, even though they\
    \ are bound to events in the HTML structure. Worse still, object binding of functions\
    \ to event handlers will work only on links, form elements, or positioned elements."
