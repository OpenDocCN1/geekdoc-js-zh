    # Permanently Storing Information: Cookies


    We''ve looked at two techniques for storing data for the duration of the user''s
    visit to our web site. There will be times, though, when you want to make a more
    permanent record of the data, and this is where cookies come in.


    Cookies can be used for all sorts of things. We''ll be using them in our e-commerce
    example to store the details of the customer''s shopping basket even if they close
    the browser and return later. Cookies can also be used for storing user preferences.
    If we had a site in a number of international languages, then we''d want the user
    to select their preferred language on their first visit, and then store that preference
    for every subsequent visit. If their preferred language is English then we could
    store Eng in a cookie for the English language version, if it''s French, and so
    on. When, the user returns, we simply check the value and then direct them to
    the correct pages.


    Cookies are simply text files that store data in strings on the user''s computer.
    Although they only hold strings, we can still use numeric or Boolean values by
    converting them to strings.


    > Some browsers don''t support cookies, and some users are uncomfortable with
    the idea of them and switch off cookie support. We should avoid using cookies
    for essential functionality, and restrict them to additional functionality for
    users who have them enabled. And, of course, if we absolutely cannot do without
    them, then we need to check whether cookies will work with the user''s browser,
    either by using code that works with or without cookies, or by notifying the user
    that the web site needs cookies to function correctly.


    There are some default restrictions on who can read a cookie. Cookies can only
    be read by the page that set the cookie, or by pages in the same directory or
    subdirectories. You can write a cookie that specifies which pages can read it
    using path attribute. For example, if path was set to /MyPages, then all the pages
    in the directory MyPages and its subdirectories could read and write to the cookie.


    Further, pages from a server other than the that set the cookie can''t read it,
    so a page on the domain someOtherDomain.com can''t read cookie on myDomain.com.
    Again this behavior can be changed using the domain attribute. We will see this
    in the next section.


    Cookies have a lifespan, just like variables. They expire as soon as the browser
    is closed, cookies used this way are transient cookies. While this is for storing
    session information, if we want a more permanent record of our data we need to
    set the cookie expires attribute.


    We can have more than one cookie per server; in fact we can anywhere up to twenty,
    identifying each one using its name attribute. The maximum size of a single cookie
    is 4000 characters, including the cookie''s name and value. If we needed to store
    more than twenty pieces of information then we can set a single cookie to store
    multiple values so long as it doesn''t take a cookie over its maximum size.


    284'
