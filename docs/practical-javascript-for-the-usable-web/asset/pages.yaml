  md: '# The DOM: HTMLML for the Latest Browsers


    The DOM methods we''ve met so far can be used in combination, providing an even
    more powerful mechanism for accessing elements within the document structure.
    The getTagName() method is available to both Document and Element type objects.
    Therefore, when you obtain a reference to an element using the getElementById()
    method, the returned element from the getElementsByTagName() method is a root
    node to a substructure, then the getElementsByTagName() method can be used to
    create a collection of elements within that substructure. For example, a collection
    of <b> elements can be obtained from a specific paragraph using the following
    coding example:


    ```

    // Obtain a reference to a paragraph

    var paraEl = document.getElementsByById("myParagraph");


    // Obtain a collection of bold elements within the paragraph

    var paraBolds = paraEl.getElementsByTagName("b");

    ```


    The converse of this task is to obtain a reference to an element from a collection
    of elements. This is possible by treating the collection of elements as an array
    that is indexed by the id values of its elements:


    ```

    // Obtain a collection of bold elements

    var collBolds = document.getElementsByTagName("b");


    // Obtain a reference to an element from within the collection

    var theElement = collBolds[myElementIDName];

    ```


    In this example a collection is created. We then use the string name of the id
    attribute to directly obtain a reference to the element with the same id as the
    collBolds collection.


    The following example, collection.htm, alters our previous example to show a simple
    web page that uses a collection to obtain a reference to an element from its id
    name.


    ```

    <html>

    <head>

    <title>Obtain an Element By ID from a Collection</title>

    <script>

    function highlightElement(id) {

    var collBolds = document.getElementsByTagName("b");

    var theElement = collBolds[id];


    if (theElement != null) {

    theElement.style.color = "#ff0000";

    theElement.style.fontSize = "14pt";

    }

    </script>

    </head>

    <body>

    <span id="username">*

    <b id="firstname">Bilbo</b> <b id="surname">Baggins</b>

    ```'
