  md: "# Data Validation Techniques\n\nThis is similar to our password-validating\
    \ function in that we not only check that the characters are valid, but also that\
    \ the data is within a certain range. \n\nFirst we use the isInteger() method\
    \ to check that we have integer data:\n\n```\nif (this.isInteger(age))\n```\n\n\
    If it does, then use the statement we check that the age is within the range 0\
    \ to 140. If some medical miracle changes human life expectancy, then we would\
    \ need to update our code, but otherwise it seems a reasonable range.\n\nFinally\
    \ we return isValid, which returns true if the passed age parameter is a valid\
    \ age.\n\n# Validating a Telephone Number\n\nSo far the data being checked has\
    \ fairly simple. However, telephone numbers are much more of a challenge to validate.\
    \ The problems are:\n\n+   * Phone numbers differ from country to country\n* There\
    \ are different ways of entering a valid number, for example adding the international\
    \ code or not\n\nOne way to make clear what we expect in terms of the format of\
    \ the telephone number is to split the telephone number into separate boxes, for\
    \ example one box labeled for the international dialing code, one for the area\
    \ code, one for the number itself and finally one for the extension number, applicable.\n\
    \nAnother alternative, which we look at here, is to use regular expressions to\
    \ match variations of international phone numbers. For example, any of the following\
    \ are valid:\n\n+   * +1 (123) 123 4567\n* 02312 345 5467 56\n* +44 (123) 123\
    \ 4567\n* +44 (123) 123 4567 ext 123\n* +44 (20) 789 4567\n\nYou can find out\
    \ information on world telephone numbering systems at http://phonebooth.interocator.net/wtng/\n\
    \nThe variations our regular expression needs to deal with (optionally separated\
    \ by spaces) are:\n\n+   * The international number – a followed by 1 to 3 digits\
    \ (optional)\n* The local area code – 2 to 5 digits, sometimes in parentheses\
    \ (compulsory)\n* The actual subscriber number – 3 to 10 digits, sometimes with\
    \ a space after the first 3 (compulsory)\n\n345"
