  md: 'The changes here are the addition of two icons: *ADD to basket* and *View basket*.
    When the *ADD to basket* button is clicked, the currently selected image is added
    to the shopping basket. The *View basket* button, rather obviously, displays the
    basket''s current contents in the large image window, as shown below:


    ![](img/e58f0457390096aadd869f36b1b05e3c_270_0.png)


    The details of the basket are shown inside the frame where the images are viewed.
    Another alternative would be for the details of the basket to be shown as a new
    page and then have a *Back* button to return to the image viewer. Note also that
    the *ADD to basket* icon has switched to *Update basket*. This, along with the
    *Update Quantity* button, can update the quantities of each image that are wanted.
    If the user clicks on another thumbnail image to view it in the main image view,
    then the *Update basket* icon will swap back to *ADD to basket*.


    If the user leaves the site or closes the browser, then code is used to ensure
    that the basket''s contents are saved and can be re-accessed if they return within
    a 3-month period. Users often add items to their basket, but then go and think
    about it before buying. There''s nothing more annoying than to come back, having
    decided to buy, and find it''s necessary to start over and find your basket. By
    making life easier for the user, they are much more likely to buy, rather than
    think "I can''t be bothered to start again."


    At the top of the *View basket* page is the *Proceed to checkout* button. This
    takes the user to the first stage of the actual purchasing of the image prints:'
  merge: -1
