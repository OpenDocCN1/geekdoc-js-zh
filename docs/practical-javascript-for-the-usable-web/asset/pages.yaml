- img_proc: true
  md: "# Advanced Form Techniques\n\nThe first three variables, mSelectedDay, mSelectedMonth,\
    \ and mSelectedYear, will hold the date selected by the user. mHighlightedDay\
    \ will hold the day that has been highlighted in the calendar, and mCurrentMonth\
    \ and mCurrentYear will hold the current month and year that is being viewed in\
    \ the calendar. mHideFunction will hold the callback function we saw above, which\
    \ should be called when the user chooses a date from the calendar, hiding it from\
    \ view.\n\nRecall that the HTML file contains three functions from the .js file:\
    \ setSelectedDates(), generateCalendar() and showCalendar(). We'll look at these\
    \ in turn now, generateCalendar() actually calls several other functions, which\
    \ I'll explain at the same time.\n\n# setSelectedDates()\n\nThe purpose of this\
    \ function is to take a date string and set it to the global variables that the\
    \ calendar control uses to hold the date. The date string supplied to the function\
    \ can be any valid date, for example '31 Jan 2002', or '31/12/2002'. However,\
    \ if we have international visitors, for example the UK where date format is dd/mm/yyyy,\
    \ as well as from the US where it is mm/dd/yyyy, we are better off using the month\
    \ name to avoid confusion. In our example, the dateString parameter comes from\
    \ the contents of the HTML page. These values are set by either the user (in which\
    \ case you may wish to tell the user which date format to use) or by the script\
    \ code (which, as you will see, use the shortened month name).\n\nThe setSelectedDates()\
    \ function is shown below:\n\n```\nfunction setSelectedDates(dateString)\n{\n\
    \  var currentSelectedDate = new Date(dateString);\n\n  if (isNaN(currentSelectedDate))\
    \ {\n    currentSelectedDate = new Date();\n  }\n\nmSelectedDay = currentSelectedDate.getDate();\n\
    mSelectedMonth = currentSelectedDate.getMonth();\nmSelectedYear = currentSelectedDate.getFullYear();\n\
    \nmCurrentMonth = mSelectedMonth;\nCurrentCurrentYear = mSelectedYear;\n```\n\n\
    We create a Date object, with the dateString parameter passed to its constructor.\
    \ If dateString does not contain a valid date, then isNaN(currentSelectedDate)\
    \ will be true and the statement will set currentSelectedDate to a new Date object\
    \ without using constructor – it will consequently be set to the current system\
    \ date and time.\n\nOn the final lines, the global variables are set to the date\
    \ extracted from the Date object. Note that mCurrentMonth and mCurrentYear are\
    \ set so that, when the calendar is opened, the month for the current selected\
    \ date will be shown.\n\n247"
  merge: -1
  pgno: 260
- img_proc: true
  md: "# Chapter 8\n\ngenerateCalendar() and Associated Functions\nThe largest function\
    \ in the CalendarScript.js file is that which generates the table containing the\
    \ calendar, namely the generateCalendar() function. We will step through it, describing\
    \ the other functions it calls as we, though we won't look into the code for these\
    \ until we complete the generateCalendar() function so not to disrupt the flow.\n\
    \nThe generateCalendar function takes three parameters: the month and year of\
    \ the calendar to be displayed, and the id of the <div> element where the calendar\
    \ will be written. Note that the month is given as the same year that the Date\
    \ object's getMonth() method would return for that month, if month 0 is January,\
    \ month 1 is February, and so on.\n\n```\nfunction generateCalendar(month, year,\
