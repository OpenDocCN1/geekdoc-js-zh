  md: '# Chapter 8


    These are the three items in the string names that match our regular expression
    – remember that Williams doesn''t match the defined regular expression, since
    it doesn''t end with an n or m. Notice that we set the g flag in the regular expression:


    ```

    /\bwil[a-z]+[nm]\b/g

    ```


    This will ensure that the array will contain all matches in the string. Otherwise
    just the first match made, Wilson in this case, will be returned and no other
    matches looked for.


    It''s useful to note that we don''t create a specific regular expression object,
    then pass that to the match() method. Instead we create inside the match() method''s
    parameter. The reason it has been done this way in the example is because we have
    no use for the regular expression, except for use with the match() method. An
    alternative way would have been the following, if we planned to use the regular
    expression again:


    ```

    var regularExpression = /\bwil[a-z]+[nm]\b/g;

    var matchesMade = names.match(regularExpression);

    ```


    This works just the same as the earlier way.'
