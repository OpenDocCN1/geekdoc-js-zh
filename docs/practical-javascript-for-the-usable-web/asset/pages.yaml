    }\n\n</style>\n```\n\n# Positioning iframes and imgs with CSS\n\nLet us analyze\
    \ this CSS Styles selector-by-selector. First, we define the presentation of the\
    \ standard <body> element. Recall that CSS Styles help us to separate the presentation\
    \ from the structure.\n\n```\nbody { background-color:black; }\n```\n\nThis CSS\
    \ rule sets the background color black, which is exactly what we see when we load\
    \ ImageViewer.htm.\n\nNext, we define the presentation of the iframe tag. Remember\
    \ that this iframe tag is used of three times in our application, each of the\
