- img_proc: true
  md: "# Interacting with the Web Browser\n\nX indicates that the event handler is\
    \ available with that element. If the X has a number after it, the number indicates\
    \ the browser version it is supported (by default, the event handlers are available\
    \ with version 3 onwards).\n\nAs with the events we have looked previously, this\
    \ can be captured by adding an event handler attribute to the element. For example,\
    \ to capture the onclick event of a button, we would write:\n\n```\n<input type=\"\
    button\" value=\"Click Me\" onclick=\"someFunction()\">\n```\n\nWe will look at\
    \ the keydown, keypress and onkeyup events in Chapters 6 and 7 (covering browser-specific\
    \ code) because they are more of use when we want to obtain the key that was pressed.\
    \ Now, we'll look at the slightly less obvious events, starting with the form's\
    \ submit event.\n\n# Submit Event\n\nThe submit event is the most important event\
    \ for an HTML form. This event fires when a form is submitted by the user, either\
    \ by clicking a button or by pressing Enter in a textbox. However, this event\
    \ doesn't fire if the form is submitted using the form object's submit( ) method\
    \ in your code.\n\nThe submit event is a great place to perform final check code\
    \ before a form is sent to the server, because the form's submission can be cancelled\
    \ if necessary. It can be cancelled simply by having the event handler (or a function\
    \ calls) return the value false.\n\nIn the example below, FormSubmitEvent.htm,\
    \ the user is asked to enter a number between 1 and 10 in the textbox. If they\
    \ do not, then we can cancel the form submission:\n\n```\n<html>\n<head>\n<script\
    \ language=\"JavaScript\">\nfunction isFormValid() {\n  var numberEntered = document.form1.txtNumber.value;\n\
    \n  var isNumber = !isNaN(numberEntered);\n  var isWithinRange = numberEntered\
    \ >= 1 && numberEntered <= 10;\n  var isFormOk = isNumber && isWithinRange;\n\n\
    \  if (!isFormOk) {\n    alert(\"Please ensure you enter a valid number between\
    \ 1 and 10\");\n  }\n  return isFormOk;\n}\n</script>\n<body>\n<form action=\"\
    somePage.htm\" method=\"POST\" name=\"form1\"\nonsubmit=\"return isFormValid()\"\
    >\nEnter a number between 1 and 10:<br>\n<input type=\"text\" name=\"txtNumber\"\
    >\n<input type=\"submit\" value=\"Submit\">\n</form>\n</body>\n</html>\n```\n\n\
    ![](img/e58f0457390096aadd869f36b1b05e3c_130_0.png)"
  merge: -1
  pgno: 130
- img_proc: true
  md: "# Chapter 4\n\nLet's start with the &lt;form&gt; element definition:\n\n```\n\
    <form action=\"somePage.htm\"\nmethod=\"POST\" name=\"form1\"\nonsubmit=\"return\
    \ isFormValid()\">\n```\n\nThe action attribute is set to somePage.htm, which\
    \ you should create a plain HTML page (or download the page with the code download).\
    \ Usually, of course, this would be a page with server-side processing, such as\
    \ an .asp page, since we don't deal with server-side processing in this book,\
    \ we've stuck with an HTML page.\n\nThe onSubmit event handler has been added\
    \ and returns a value from the function isFormValid(), which is created at the\
    \ top of the page. This function returns true if the form is valid or false otherwise.\
    \ If it's false the form submission is cancelled to give the user opportunity\
    \ to correct the form. This is good because it reduces the load on the server\
    \ and it is also quicker for the user. If the form was only checked on the server,\
    \ then the user would have to wait until the page was submitted, and then be redirected\
    \ to a page telling them they have made an error.\n\nWe'll now turn to the function\
    \ that does checking when called by the onSubmit event handler:\n\n```\nfunction\
    \ isFormValid()\n{\n  var numberEntered = document.form1.txtNumber.value;\n\n\
    \  var isValidNumber = !isNaN(numberEntered);\n  var isWithinRange = numberEntered\
    \ >= 1 && numberEntered <= 10;\n  var isFormOk = isValidNumber && isWithinRange;\n\
    \n  if (!isFormOk)\n{\n    alert(\"Please you enter a valid number between 1 and\
    \ 10\");\n  }\n\n  return isFormOk;\n}\n```\n\nThe variable numberEntered is set\
    \ to the value in the textbox txtNumber - this is the value we are checking. When\
    \ the variables isValidNumber and isWithinRange are set to the results of two\
    \ expressions, these expressions check that the user's input is a number and that\
    \ it's within range. Using variables like this rather than if statements, which\
    \ is another way of doing the same thing, makes the code much more readable. The\
    \ final result of whether the input is valid is placed in the isFormOk variable,\
    \ which will contain true only if the number is valid and the number is within\
    \ range.\n\nIn the statement, we check if the form is OK, and let the user know\
    \ if data was invalid. On the final line we return isFormOk - if it contains true,\
    \ the post will continue.\n\n# Focus and Blur Events\n\nThese events occur when\
    \ a form element gets the focus of a user's input and when the focus is moved\
    \ off an element to another part of the page."
  merge: -1
  pgno: 131
- img_proc: true
  md: "# Interacting with the Web Browser\n\nSaved as Focus_BlurEvents.htm, demonstrates\
    \ when these events fire.\n\n```\n<html>\n<body>\n  <form name=\"form\">\n   \
    \ <input type=\"text\"\n      onfocus=\"this.value = 'focus fired';\"\n      onblur=\"\
    this.value = 'onblur fired';\">\n    <input type=\"text\"\n      onfocus=\"this.value\
    \ = 'focus fired';\"\n      onblur=\"this.value = 'onblur fired';\">\n    <input\
    \ type=\"button\" value=\"Button\">\n  </form>\n</body>\n</html>\n```\n\nIf you\
    \ click (or tab on) either of the two textboxes, the textbox's focus event fires\
    \ and **focus fired** is displayed in the text. If you remove the focus from that\
    \ textbox (by clicking on, or tabbing to the other textbox), the blur event fires\
    \ and onblur fired displays that.\n\n![](img/e58f0457390096aadd869f36b1b05e3c_132_0.png)\n\
    \nNote the use of the **this** keyword in the code. Inside an event handler it\
    \ always references the object corresponding to the element handler is an attribute\
    \ of.\n\nThe focus can be removed from a textbox by clicking elsewhere in the\
    \ page, for example on another form element or the page itself. The focus is also\
    \ lost if the user switches from the browser window to another window or running\
    \ program. The blur event can be useful for checking data when the user leaves\
    \ a form element, but it's important to be careful. Firstly, users often like\
    \ to fill in forms in the order information they know, not in the order the elements\
    \ appear. For example, on an e-commerce form, they may fill in their name and\
    \ address and skip the credit card details until they have the card to hand. If\
    \ they tab through each form element and try to go past the card details, a blur\
    \ event will occur for these textboxes. If the blur event stops them from continuing\
    \ until a valid card is entered, then this will be inconvenient for them. Generally,\
    \ it's much better to check the form before it's being submitted.\n\nNote that\
    \ unlike the event we looked at above, the focus and blur events fire when the\
    \ focusing is blurring or due to the use of JavaScript and the element's `focus()`\
    \ or `blur()` methods.\n\n# Change Event\n\nThe change event fires when the focus\
    \ is moved away from a form element, if the entered or selected value has changed\
    \ since the last time it lost focus.\n\n119"
  merge: -1
  pgno: 132
