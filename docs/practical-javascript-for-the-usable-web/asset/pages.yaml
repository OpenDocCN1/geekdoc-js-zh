  md: '# When the application is finished it should look like the following screenshot:


    ![](img/e58f0457390096aadd869f36b1b05e3c_166_0.png)


    # Application Outline


    The application consists of three areas. On the left-hand side is a navigation
    menu (Area 1), which can be used to select which set of images a user would like
    to view. When a user selects a set of images, thumbnails of each image in the
    collection are displayed, in a scrollable area, in the center of the window.


    The thumbnails in the central strip (Area 2) are flanked at the top and bottom
    by two arrowhead images. JavaScript captures mouse click events on these images
    and the thumbnail images can be scrolled up and down if the total height of the
    images is greater than the height of the iframe.


    When users move their mouse over the thumbnail images, the style properties of
    images will change to allow a highlighted border to appear, providing a visual
    cue to the user that they can click on the image. When the user clicks on a thumbnail,
    the image to be displayed full size in a viewing area on the right-hand side of
    the screen (Area 3). The diagram below depicts the three main areas created by
    the iframes within the application.


    | Area 1 | Area 2 | Area 3 |

    | --- | --- | --- |

    | Menu Navigation | Image Thumbnails | Image Display |

    | IFRAM | IFRAM | IFRAM |

    | id = categoryFrame | id = thumbnailFrame | id = mainImageFrame |'
  merge: -1
