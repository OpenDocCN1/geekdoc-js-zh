  md: "# Chapter 9\n\nRecall the expiry date parameter needs to be a Date object,\
    \ so we created a new Date object and set its month property to the current month\
    \ + 3. Then the cookie will expire in 3 months. Or we could pass the path argument\
    \ instead of the domain argument by passing null as the value for the domain argument:\n\
    \n```\nwriteCookie(\"MyCookiesName \"CookiesValue\", expiryDate,\nnull, \"/myPath\"\
    );\n```\n\n# Reading a Cookie\n\nWe're going to create two functions to read cookies.\
    \ This is because the readMultiValueCookie() function we will later need to read\
    \ a cookie's escaped value. It makes sense to create a generic function here that\
    \ reads a cookie to its escaped form, together with another function that unescapes\
    \ this value.\n\n```\nfunction readUnescapedCookie(cookieName)\n{\n  var cookieValue\
    \ = document.cookie;\n  var cookieRegExp = new RegExp(\"\\b\" + cookieName + \"\
    =([^;]*)\");\n  cookieValue = cookieRegExp.exp(cookieValue);\n}\n\nif (cookieValue\
    \ != null)\n{\n  cookieValue = cookieValue[1];\n}\n\nreturn cookieValue;\n\nfunction\
    \ readCookie(cookieName)\n{\n  cookieValue = readUnescapedCookie(cookieName)\n\
    \n  if (cookieValue != null)\n{\n    cookieValue = unescape(cookieValue);\n  }\n\
    \  return cookieValue;\n}\n```\n\nLook at readUnescapedCookie(). Its single parameter\
    \ is a string containing the cookie's name. The next three lines deal with obtaining\
    \ the cookies, creating a regular expression to extract the cookie we want, extracting\
    \ it:\n\n```\nvar cookieValue = document.cookie;\nvar cookieRegExp = new RegExp(\"\
    \\b\" + cookieName + \"=([^;]*)\");\ncookieValue = cookieRegExp.exec(cookieValue);\n\
    ```\n\nIf you remember this regular expression at the end of Chapter 8, then you\
    \ can probably translate this expression again. It's looking for a word boundary,\
    \ followed by the cookie name, followed by an equals sign, followed by a group\
    \ of zero or more characters that are not a semicolon (indicating the end of a\
    \ cookie). This group of characters is is the interesting part, because it is\
    \ the cookie's value."
