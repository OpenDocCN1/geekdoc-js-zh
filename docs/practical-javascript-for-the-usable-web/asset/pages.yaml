  md: "# Chapter 3\n\n# An Array of Items\n\nSo far we have a class for items we can\
    \ put in a shopping basket, but no class representing a shopping basket. A shopping\
    \ basket can have zero or more items inside it. How can we create a shopping basket\
    \ class that supports the storage of zero or more items? The answer is by using\
    \ arrays, which we discussed in Chapter 2.\n\nLet's start by defining our class,\
    \ which we'll call the ShoppingBasket class. We'll add the code to the ShoppingBasketClasses.js\
    \ file:\n\n```\nfunction ShoppingBasket() {\n  this.items = new Array();\n}\n\
    ```\n\nHere we define the constructor. Inside the constructor we initialize the\
    \ items property that will hold all the ShoppingItem class objects.\n\nNext we\
    \ need to add a way of putting items into the shopping basket; for this we create\
    \ the addItem(item) method:\n\n```\nShoppingBasket.prototype.addItem = function(itemDesc,\
    \ itemPrice, itemQty) {\n  this.items[itemDesc] = new ShoppingItem(itemDesc, itemPrice,\
    \ itemQty);\n}\n```\n\nThe method takes 3 parameters, which are the details needed\
    \ to create a new shopping basket item. Then inside the method we create a new\
    \ object of type ShoppingItem. A reference to this object is stored inside our\
    \ items array, using the itemDesc to place the new object.\n\nSo let's look at\
    \ how we can access the items in the array. In the method below called getTotal()\
    \ we go through each item in the shopping basket and calculate the total cost\
    \ of the basket:\n\n```\nShoppingBasket.prototype.getTotalCost = function() {\n\
    \  var basketItem;\n  var basketTotalCost = 0;\n\n  for (basketItem in this.items)\
    \ {\n    basketTotalCost = basketTotalCost +\n      this.items[basketItem].getItemQty()\n\
    \n      this.items[basketItem].getItemPrice();\n  }\n\n  return basketTotalCost;\n\
    }\n```\n\nWe can access each item by its description but what we want to do is\
    \ simply loop through the for...in loop that loops through the whole basket, so\
    \ we use the items array. Each time the loop executes, basketItem will be set\
    \ by JavaScript to contain the itemDesc of the next item; it doesn't contain the\
    \ item itself but its associated keyword."
