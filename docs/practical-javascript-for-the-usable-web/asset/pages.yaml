  md: "# Passing Information Between Web Pages and Data Storage\n\nThe event handler\
    \ calls a function in the top frame, resetShoppingApp(). This clears the shopping\
    \ basket and resets the values holding customer and credit card objects to new\
    \ objects. We need to add this function to the file ecode.js:\n\n```\nfunction\
    \ resetShoppingApp() {\n  myBasket.clearBasket();\n  thisCustomer = new Customer();\n\
    \  customerCreditCard = new CreditCard();\n}\n```\n\nThis completes all of the\
    \ code changes to the e-commerce image viewer for this. In the next chapter we'll\
    \ take the final step of looking at form validation and applying that to our application.\n\
    \n# Summary\n\nIn this chapter, we've looked at how we can store data temporarily\
    \ and pass it from page to page clientside. We saw two techniques for this: first\
    \ placing the data in the URL, and second using JavaScript global variables in\
    \ a top frame page that doesn't get unloaded.\n\nWe then looked at how we could\
    \ permanently store data on the user's computer. JavaScript doesn't allow unlimited\
    \ access to the user's hard drive, but it does allow us to store character data\
    \ using cookies. We saw how to use cookies, and then looked at various functions\
    \ that made using them easy.\n\nFinally, we made major changes to the image viewer\
    \ application. We created the shopping basket and also the checkout aspects of\
    \ the application using JavaScript classes, instances of which represent realworld\
    \ items. In particular, a ShoppingBasket class models the shopping basket of the\
    \ real world, and a Customer class represents a customer, and a CreditCard class\
    \ represents the customer's credit card.\n\nIn the next and final chapter, we'll\
    \ be looking at advanced form validation techniques and applying those to the\
    \ checkout of the image viewer application."
