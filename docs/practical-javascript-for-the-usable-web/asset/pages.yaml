  md: "Note that there is space before the first ? – this space and question mark\
    \ mean \"match zero or space\". This is followed by three digits (\\d{3}), another\
    \ \"zero or one space\", and finally between zero and seven digits (\\d{7}).\n\
    \nWe finally add the part to cope with an optional extension number:\n\n```\n\
    (?|xtn|ext|extn|extension)?\\.? \\d(1,5))\n```\n\nThis group is optional, followed\
    \ by a question mark. The group itself checks for an optional space, followed\
    \ optionally by one of x, ext, xtn, and extension followed by zero or one dots\
    \ (the \\. , since . is a special character in regular expression syntax), followed\
    \ by zero or one space, between one and five digits.\n\nPutting these patterns\
    \ together, we have the whole regular expression, apart from the surrounding syntax:\
    \ recall that the regular expression starts with / and ends with /i. The flag\
    \ indicates that the regular expression is case insensitive. The characters that\
    \ the contained code is a regular expression. So, that leaves the / & as we have\
    \ seen previously, this mean that the string we test the regular expression against\
    \ can contain no other characters before or after the pattern.\n\nOK, that's the\
    \ scary expression out of the way. The method that uses it would be fairly by\
