  md: '# Data and Decisions


    Try entering the value 23.50. You should get this output:


    ```

    string

    23.5

    23

    23.5

    number

    ```


    The data entered is read as a string in the first line. Then parseFloat() converts
    23.50 from a string to a floating point number, and in the next line parseInt()
    sends back only the fractional part, (without rounding up or down). The variable
    is converted to a number using the Number() function, stored in the userEnteredNumber
    variable itself (overwriting the string held there) and on the final line we see
    that userEnteredNumber''s data type is indeed Number.


    Try entering 23.50abc at the user prompt:


    ```

    string

    23.5

    23

    NaN

    number

    ```


    The results are similar, but this time Number() has returned NaN. (NaN stands
    for ''Not a Number.'') The parseFloat() and parseInt() functions still return
    a number because they work from left to right converting each of the string to
    a number as they can and then stop when they hit a non-numeric value. The Number()
    function will reject any string that contains non-numeric characters (anything
    other than digits, a valid decimal place, and + and - signs are allowed but nothing
    else)


    If you try entering abc you''ll just get:


    ```

    string

    NaN

    NaN

    NaN

    number

    ```


    None of the functions can find a valid number and so they all return NaN, which
    we can see is a number data type, but not a valid number. This is a good way of
    checking user input for validity, and we''ll be using it to do exactly later on.


    So let''s get back to the problem we started with: using prompt() to retrieve
    a number. All we need to do is to interpret the data entered by the user be converted
    to a number data type, using the Number() function with the prompt() function:


    ```

    <html>

    <body>

    <script language="JavaScript">

    var userEnteredNumber = Number(prompt("Please enter a number,","));

    var myCalc = 1 + userEnteredNumber;

    var myResponse = "The number you entered + 1 = " + myCalc;

    document.write(myResponse);

    </script>

    </body>

