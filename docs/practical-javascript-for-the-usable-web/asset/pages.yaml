  md: "# Functions and Code Design\n\nOur function is called convertEuroDollar().\
    \ The function takes just one parameter, amountEuros. In the body of the function\
    \ we use this parameter as the amount of Euros to be converted to dollars; we\
    \ use this parameter as if it was a variable we had declared. Parameters go out\
    \ of scope when the function ends; we cannot access them with JavaScript.\n\n\
    On the last line, we return the result of the calculation to the code that we\
    \ are using by the return keyword and the data to be passed back. We have passed\
    \ the data contained in a local variable but it could have been literal data:\
    \ \"some string\", 123. Note I use the word local variable; we declare inside\
    \ the function so it is accessible and retains its value inside the function when\
    \ the code executes. Just to prove a point we have declared global variables outside\
    \ the function with the same names as the parameter and local variable, something\
    \ we would avoid. The global variables bear no relation to the variables in the\
    \ function and altering one will not affect the other.\n\nLet's take a look at\
    \ a more complex function (number.htm) in which we convert a number to a fixed\
    \ number of decimal places. This is useful if, for example, we want to display\
