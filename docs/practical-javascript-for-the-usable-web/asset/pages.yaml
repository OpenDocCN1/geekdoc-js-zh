    # Windows within Windows


    So far in this chapter we have looked at windows that exist outside other windows.
    However, a window can also exist inside another window. These types of windows
    are known as frames. Frames have been available since Netscape Navigator version
    2 and Internet Explorer version 3 and allow multiple documents to be viewed at
    the same time, independently of each other, within a single browser window. Each
    document can load or modify the contents in other frames and this allows you to
    overcome the limitations of a single page. For example, once a page has been loaded,
    many parts of the page cannot be modified without reloading the page or getting
    heavily in the document object model (DOM, Chapter 7), which is not only disturbing
    but it can cause the loss of existing information, as data stored in memory JavaScript
    variables. Loading only a portion of the page in a different frame can provide
    the flexibility that is needed for many applications.


    Matters complicated somewhat with the advent of the version 4 browsers when both
    browsers introduced their additional proprietary mechanisms for incorporating
    a document viewing system within another document. Netscape introduced the `<layer>`
    and `<ilayer>` tags, which were buggy and, therefore, difficult to script. Internet
    Explorer introduced the `<iframe>` tag (an inline frame), which was much friendlier
    and easier to script. Of course, with both techniques available and newer browsers
    supporting the other''s tags, JavaScript coders were given a lot of headaches
    to support both systems.


    Thankfully, the release of the HTML 4 standard includes support for the `<iframe>`
    element, which Netscape 6 supports. As the `<layer>` and ilayer tags are now deprecated
    (which means they are no longer supported in the HTML standard) I won''t discuss
    them and instead concentrate on the `<iframe>`.


    In the remaining half of this chapter we will look first at the `<iframe>`, and
    then discuss frames and how JavaScript can be used to control them.


    # Documents within Documents


    The `<iframe>` is particularly handy, defining a frame within a document, and
    acts very similar to having a window within the document. We can expect all modern
    web browsers to support it, as is part of the HTML 4 specification. By using stylesheet
    information different documents can be loaded into it via linked links or using
    JavaScript to change the window''s `location` property.'
