    # Creating New Browser Windows


    In the previous chapter, we saw that the window object is the top-level object
    for each HTML document, which represents a browser engine within the browser the
    JavaScript runtime engine creates a new window object for each document opened.
    You can open a new pop-up window by calling the open() method of the window. Each
    new window opened is capable of being sized, positioned on screen, and a number
    of decorative features enabled or disabled. A pop-up window is independent of
    the window that opened it, the opener window (we will talk about the opener later
    in the chapter.) As each new window opened is a child window it exists beside
    and therefore the window cannot be closed without automatically closing the newly
    opened window. Therefore you should be aware that if a user closes the opener
    window, the pop-up window could remain open. This can be a problem, especially
    if the pop-up window attempts to communicate with the browser window as it could
    JavaScript errors. As we will see later in the chapter there are ways to prevent
    the errors from being raised.


    The open method accepts three optional arguments, in its simplest form a new window
    can be opened by calling the following line of code:


    ```

    window.open();

    ```


    and because open() is a method of the window object the reference to the window
    object can be left off,, simplifying further to give:


    ```

    open();

    ```


    In this instance, a call to the window object creates a new empty window. In its
    own right this piece of code is pretty useless – blank empty window being created.
    No page is loaded, its size and appearance is dependent on the default values
    of the browser being used, and its properties cannot be altered. As we will shortly
    we can add a number of items to this code to make the window more useful.


    Note that the ability to use the shorter form to open a window (that is without
    specifying the reference to the window object) can help to make your code smaller
    and simpler, if someone else wants to make changes to a page that you have coded,
    it can make your code difficult to read. So it''s usually better to use the fully
    qualified form.


    As I mentioned above, the open() method allows three optional arguments to be
    specified. These arguments determine the location of newly opened windows, their
    target name, and the features that will be displayed within them. We will look
    at setting windows'' features in the next section.


    The first argument provided is a string specifying the URL to open in the new
    window, and the second argument is a string specifying the window name to use
    in the target attribute of a <form or <a> tag. Like JavaScript variables, the
    window''s name must only contain alphanumeric or underscore (_) characters.


    129'
