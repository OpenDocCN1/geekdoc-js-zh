  md: "# Chapter 2\n\n# Data, Data Types, and Data Operators\n\nData is used to store\
    \ information, and in order to do that more effectively, JavaScript gives each\
    \ piece of data a **type**. This type stipulates what can or cannot be done with\
    \ the data. For example, one of the JavaScript types is **Number**, which allows\
    \ you to perform calculations on the data that it holds. The simplest data types\
    \ in JavaScript are primitive data types. Primitive in this sense just means the\
    \ data is stored directly. There are three primitive data types that store data\
    \ in JavaScript:\n\n+   - String: a series of characters: \"some characters\"\
    , for example\n- Number: a floating point number, like 42 or 3.1415\n- Boolean:\
    \ can contain a true or false value\n\nThere are two slightly different primitive\
    \ data types as well. These don't store information, but instead warn us about\
    \ a particular situation:\n\n+   - Null: indicates that there is no valid data\n\
    - Undefined: indicates that something has not been defined and given a value.\
    \ This is important when you're working with variables.\n\nWe'll be working extensively\
    \ with these data types throughout the chapter.\n\n# The String Data Type\n\n\
    The JavaScript interpreter expects data types to be enclosed within single or\
    \ double quotation marks (known as delimiters). This script, for example, will\
    \ write *some characters* onto the page:\n\n```\n<html>\n<body>\n  <script language=\"\
    JavaScript\">\n    document.write(\"some characters\");\n  </script>\n</body>\n\
    </html>\n```\n\nThe quotation marks won't be written out to the page because they\
    \ are not part of the string, they simply tell JavaScript where the string starts\
    \ and ends. We could just as easily have used single quotation marks:\n\n```\n\
    <html>\n<body>\n  <script language=\"JavaScript\">\n    document.write('some characters');\n\
    \  </script>\n</body>\n</html>\n```"
  merge: -1
