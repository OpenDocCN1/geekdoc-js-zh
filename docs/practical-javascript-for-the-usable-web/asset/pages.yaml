- img_proc: true
  md: "If you are unfamiliar with tree structures in computer programming. It is useful\
    \ to draw analogies with family trees, as this is where they borrow their terminology.\
    \ A node directly above another node in the tree is a parent node. The nodes one\
    \ level beneath another node are the children of that node. Nodes at the same\
    \ level, and with the same parent, are siblings (brothers and sisters). Let's\
    \ have a look at a simple HTML document, which we'll use as an example of these\
    \ concepts.\n\n```\n<html>\n<head>\n  <title>DOM Structure</title>\n</head>\n\
    <body>\n  <h3>Hello World!</h3>\n  <p>This is a <b>simple</b> example of a <i>DOM\
    \ model.</i></p>\n</body>\n</html>\n```\n\nA document such as this can be represented\
    \ using a tree structure model as depicted in the following diagram:\n\n![](img/e58f0457390096aadd869f36b1b05e3c_209_0.png)\n\
    \nAt the top of the tree structure is the document object, being the root to the\
    \ whole tree. Beneath it is the <html> element, which is the root element of the\
    \ document. The elements and text contained within the document spread out under\
    \ the <html> element within the tree. The rounded boxes represent terminal \"\
    leaf nodes\" that contain textual content (known as text nodes). The square boxes\
    \ represent \"branch nodes\" that may contain zero or more child nodes (known\
    \ as element nodes). These child nodes may themselves be branch nodes or leaf\
    \ nodes.\n\nHere we have seen examples of text and element nodes, but there are\
    \ many others, for example comment nodes. It will be no surprise that the DOM\
    \ represents each type of node with a different object, and these objects have\
    \ different properties and methods. These derive from the interfaces the object\
    \ implements, a topic that we'll look at next."
