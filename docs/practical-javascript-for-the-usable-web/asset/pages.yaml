  md: "```\n<html>\n<body>\n<script language=\"JavaScript\">\n  if (document.all)\
    \ {\n    // Code using document.all goes here\n  } else if (document.layers) {\n\
    \    // Code using document.layers goes here\n  }\n</script>\n</body>\n</html>\n\
    ```\n\nNote that this page will not execute any code for some Opera browsers an\
    \ NN6, which don't support document.layers or document.all. (Opera 5.0+ browsers\
    \ whose appName property returns Microsoft Internet Explorer support document.all.)\n\
    \nWe'll see more of this technique in Chapter 6.\n\n# # Summary\n\nIn this chapter\
    \ we've covered the basics of how JavaScript can access various parts of the browser\
    \ and various HTML elements within the page. Most of what has been covered in\
    \ this chapter will work even on older browsers, like NN3 and IE3, though it still\
    \ proves useful with modern browsers too.\n\nWe saw that the browser makes itself\
    \ accessible to the web programmer via various objects, which can be used in JavaScript.\
    \ The hierarchy and order of these objects is determined by the Document Object\
    \ Model (DOM) of the browser version in question. We looked at the basic DOM that\
    \ is supported by both older and newer browsers. This DOM is simple, and quite\
    \ limited compared to the sophisticated DOMs supported by IE4+ and NN6+. We saw\
    \ that the browser is represented by the window object, and the page inside the\
    \ window by the document object. It via via we can access a limited number of\
    \ HTML elements including forms, form elements (such as textboxes), images, and\
    \ links.\n\nIn the second half of the chapter, we looked at how means of interaction\
    \ with the user via browser events. Many of the browser objects we encountered\
    \ in the first half of the chapter have events we can connect code to. This allows\
    \ us to react when a user clicks a button, loads a page, and so on.\n\nWe concluded\
    \ the chapter by looking at some basic browser checking techniques.\n\nIn the\
    \ next chapter, we'll be looking at how to open new browser windows and manipulate\
    \ them with JavaScript. We'll also see how we can code across frames in a browser."
