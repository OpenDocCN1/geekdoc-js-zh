  md: '# Chapter 6


    As so you can see in these simple examples, IE 4''s HTML enables us to create
    all sorts of interactions and transformations on a web page. You can use it to
    dynamically modify many of the CSS attributes of an HTML element, and replace
    any HTML fragment on the displayed page using the innerHTML property. For more
    extensive information on the innerHTML property, you may want to consult the following
    URL:


    http://msdn.microsoft.com/workshop/author/html/reference/properties/innerHTML.asp?frame=true


    Unfortunately, Netscape Navigator 4.x does things quite differently.


    # HTML in NN4


    The NN4 series of browsers cannot dynamically re-render an HTML page incrementally,
    IE 4 so you can''t change an area of a page and see the result immediately. Instead,
    HTML interactions rely on a completely different mechanism: positioning, visibility
    control, and document rewrite, using a new layer in NN4.


    Because of the display engine limitation, it is not possible to have an innerHTML
    property to dynamically affect the web page. What''s more, most of the accessible
    CSS style in NN4 are read only; you can''t modify them because the browser displays
    the changes immediately.


    Instead of CSS property changes, or innerHTML property, most of the dynamic features
    in NN4 are enabled through the introduction of the layer. A layer is an overlay
    HTML page: it can be positioned dynamically over the page being displayed. And
    since it is an independent HTML page, you can also "open" its document and re-write
    the content. In fact, NN4 treats any positionable element that uses position:absolute
    as a layer.


    Theoretically, multiple layers can be visible or invisible at any time, but we
    can''t use the visibility toggle for most versions of NN4 only allow a layer to
    be visible once.


    When you''re writing JavaScript with NN4, you can access the document.layers collection.
    This collection contains all the layers defined within the document. This will
    include any <div>(or other position elements such as <span>, <p>, etc.) that has
    position:absolute specified as a style - because NN4 treats them as layers.


    |4 and IE4 difference: IE4 uses innerHTML to dynamically re-render portions of
    an HTML page. NN4 uses a new layer that displays an HTML page over the existing
    page, the content of this page can be rewritten using JavaScript runtime.


    Let''s look how we can achieve an effect like the dynamically changing HTML page
    we created earlier in NN4.


    Note that we need to use JavaScript to assign the onmouseover event handler. Assigning
    this handler inline, with the <div> element as we have done in the IE4 version,
    does not work in versions of NN4. Here''s the code for the NN4 compatible page
    (nn4d.html):'
