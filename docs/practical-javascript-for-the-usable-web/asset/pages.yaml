  md: '# Chapter 8


    +   * A word starting with Wil

    * One or more characters follow the Wil

    * Finishing with either an n or an m


    These rules would match words such as:


    Wilton

    Williamson

    Wilson

    William


    As we''ll see in Chapter 10, regular expressions can be particularly useful in
    data validation. They make it easier to test data entered by the user matches
    what we expected. For example, we asked for an e-mail address, the string entered
    look like it could be valid? me_and_you@someServer.com could be valid, but XXX@XXX
    is not because it lacks the part after the dot, such as .co.uk or .com.


    Regular expressions have their own syntax and special characters that allow us
    to specify what we want to match. Let''s take the example above where we have
    a partial name we want to match on. The regular expression for this is:


    ```

    \bWil[a-z]+[nm]\b

    ```


    At first it looks like nonsense, but if we split it up it makes sense. First we
    have:


    ```

    \b

    ```


    This is a special character in regular expression syntax that matches the boundary
    between characters that don''t form a part of a word. This ensures that words
    like "swilton" don''t match. Next in our regular expression we have:


    ```

    Wil

    ```


    This is at least nice and easy - it matches the characters Wil. Next comes:


    ```

    [a-z]+

    ```


    We specify that we want to match any of the characters inside the square brackets.
    This can be individual characters or, in this case, a range of characters. Here
    we specify any lowercase character between a and z. Outside the square brackets
    we have a +, another special character that specifies we should match the previous
    item one or more times.


    Next we have:


    ```

    [nm]

    ```


    We are saying we want to match any of the characters in the square brackets, in
    this case either an n or an m. Finally, we have another word boundary character:'
  merge: -1
