  md: "# Passing Information Between Web Pages and Data Storage\n\nThe exec method\
    \ of the RegExp object will try and match our pattern. If successful, it returns\
    \ an array containing details of the match, if it's not then it returns null.\
    \ So if the if statement checks that null was returned, it checks the cookie and\
    \ its value were found:\n\n```\nif (cookieValue != null) {\n  cookieValue = cookieValue[1];\n\
    }\n```\n\nThe cookie's value is in the first regular expression group, which we\
    \ access in array element 1 of cookieValue.\n\nOn the final line we return the\
    \ cookie value. This is unescaped value, so we'll need to decode it before we\
    \ can do anything with it.\n\nThe second function, readCookie(), uses the readUnescapedCookie()\
    \ to do most of the work. The main difference is that readCookie() unescapes the\
    \ value returned. As we can't be sure the cookie will exist, the function checks\
    \ for a null value returned, only attempting to unescape the value if it's a valid\
    \ one:\n\n```\ncookieValue = readUnescapedCookie(cookieName);\nif (cookieValue\
    \ != null) {\n  cookieValue = unescape(cookieValue);\n}\n```\n\nUsing the for\
    \ function is very simple as shown below. We simply pass the name of our cookie\
    \ and store the returned value:\n\n```\nvar cookieValue = readCookie(\"MyCookiesName\"\
    );\nvar unescapedCookieValue = readUnescapedCookie(\"MyCookiesName\");\n```\n\n\
    # Deleting a Cookie\n\nYou simply delete cookie by giving it an expiry date that\
    \ has already expired.\n\n```\nfunction deleteCookie(cookieName) {\n  var expiredDate\
    \ = new Date();\n  expiredDate.setMonth(-1);\n  writeCookie(cookieName, \"\",\
    \ expiredDate);\n}\n```\n\nThe function creates a new Date object, initializes\
    \ it to the current date and time, and sets the month of the date to -1. This\
    \ sets the date to the last month of the previous year, so the previous December.\
    \ Then we write the cookie using the writeCookie() function we already created,\
    \ passing the Date object to ensure that the cookie is removed.\n\nWe can call\
    \ the function by passing the name of the cookie we want deleted:\n\n```\ndeleteCookie(\"\
    MyCookiesName\");\n```"
