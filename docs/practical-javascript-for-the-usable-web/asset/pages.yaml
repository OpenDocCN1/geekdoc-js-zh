  md: '# Window Chrome


    Browser windows come with a variety of features, as menus, toolbars and scrollbars;
    features are sometimes known as decoration or chrome. We can specify which of
    these features are displayed in the window using the third argument of the open()
    method. This third argument is a string of comma-delimited name-value pairs (in
    other words name=value, name=value), where the name is the name of the feature
    that is to be set.


    It is important to note that this string does not contain any spaces. If spaces
    in the newly opened window may not display as expected; features listed after
    the space may not be applied. Some of the latest browsers, notably IE5+ and Netscape
    6+, are a bit more lenient on the matter – older browsers not.


    The example below shows how we made earlier to open a new window displaying the
    hello.html document. This time, though, we have added the third argument to specify
    the width and height on the new pop-up window:


    ```

    window.open("hello.html", "helloWin", "width=200,height=200");

    ```


    Executing this statement produces a small browser, which is 200 pixels wide and
    200 pixels high:


    ![](img/e58f0457390096aadd869f36b1b05e3c_144_0.png)


    Now that when the third argument is supplied to the open() method all other features
    and properties are removed, except for those explicitly specified in the open()
    method''s parameters. You do not have to explicitly turn features off, only turn
    them on.


    In addition to setting the width and height features shown above there are a number
    of other features that can be included in the make-up of the third argument string.
    whereas others are more generic and can be used in most browsers. The table below
    details the main features that can be set in both Internet Explorer and Netscape
    version 4+ browsers.


    | Window Feature | Description |

    |---|---|

    | directories | If yes, creates the standard browser bookmark directory button
    bar (such as What''s New and What''s Cool? with Netscape browsers and Channel
    Guide with Internet Explorer). |

    | height | Specifies the height of the window in pixels.


    Table continued on following page'
