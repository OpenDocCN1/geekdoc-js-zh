    \ elements we can access using a string rather than an index number. We'll be\
    \ storing the ShoppingItem class objects inside, each object representing an item\
    \ of shopping in our basket, and using the itemRefId of the ShoppingItem object\
    \ as its index in the array.\n\nNext we set the numItems property to 0 and the\
    \ deliveryCost property to \"2.50\". Having a global variable like that for the\
    \ delivery cost means that if we decide to change the code we only need to change\
    \ the code in one place.\n\nNote that we won't access any of the properties from\
    \ the class itself - all access to the class is strictly via its methods only.\
    \ This makes it easier to keep track of where the class variables are being changed\
    \ and prevents typo errors going unnoticed.\n\n# addItem() Method\n\nAs the name\
    \ suggests, the addItem() method adds a new shopping item to the shopping basket.\n\
    \n```\nShoppingBasket.prototype.addItem = function(itemRefId,\n  itemImgSrc,\n\
    \  itemPrice,\n  itemQty);\n{\n  if (typeof(this.items[itemRefId]) == \"undefined\"\
    ) {\n    this.items[itemRefId] = new\n      ShoppingItem(itemRefId,itemImgSrc,itemPrice,itemQty);\n\
    \    this.numItems++;\n  } else {\n    this.items[itemRefId].setItemQty(itemQty);\n\
    \  }\n}\n```\n\nThe method's parameters are required to create a new ShoppingItem\
    \ class object: a unique reference id for the item, the source for the item's\
    \ thumbnail, its price, and the quantity to be ordered.\n\nOn the first line we\
    \ check if an item of this reference id is already in the shopping basket:\n\n\
    ```\nif (typeof(this.items[itemRefId]) == \"undefined\")\n```\n\nIf this.items[itemRefId]\
    \ returns a type of undefined, no match has been found so we need to create a\
    \ new ShoppingItem class object and add it to the basket. It is added as an element\
