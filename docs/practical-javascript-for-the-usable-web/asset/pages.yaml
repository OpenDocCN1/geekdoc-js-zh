  md: '# Chapter 6


    Please note that the focus of this chapter will be on two older legacy browsers
    – Netscape Navigator 4.x and Internet Explorer 4.x. (Although these browsers are
    no longer in mainstream circulation, the user base of both browsers remains significant,
    and webmasters and designers still need to create pages that are compatible with
    them.) Due to the quirks of these older browsers, the web pages in this chapter
    may or may not be compatible with newer browsers. While every effort has been
    made to ensure the pages, while not compatible, will not create errors in the
    latest browser version, we will be accomplishing the same Dynamic HTML effects
    (and more) with the latest browsers in later chapters.


    One of the early features common to both IE and NN versions of HTML is CSS (Cascading
    Style Sheets). We will see what problem CSS attempts to solve, and how to work
    with the NN4.x and IE4.x implementation next.


    # The Need for Cascading Style Sheets (CSS)


    Anyone who creates and maintains a web site containing more than a couple of pages
    will testify to the difficulty in maintaining the consistency of appearance across
    the web pages. While you can get around some of these problems using frames, changes
    to the appearance of your pages will still require some painstaking editing on
    every one of the affected pages.


    This problem exists because HTML does two things at once: it controls both the
    structure and appearance of a document. HTML''s structural control, for example,
    is implemented through the elements that control paragraphs <p>, lists <ul>, different
    heading levels <h1>, images <img>, tables <table>, and more:


    ```

    <html>

    <head></head>

    <body>

    <h1>Main Heading</h1>

    <p>This is the first paragraph.</p>

    <p>This is the second paragraph.</p>


    <table>

    <tr><th>Cell 1</th></tr>

    <tr><td>Value 1</td><td></td></tr>

    </table>

    </body>

    </html>

    ```


    This HTML document contains one heading, two paragraphs, and a table with two
    cells. Note that even though the document will take on the default appearance
    as defined by the browser, we have not tried to control how it will appear in
    any way. The structure of the document can only be seen through the default formatting
    applied by the browser. If you load this page (called structure.html in the code
    distribution) it should look something like this:'
