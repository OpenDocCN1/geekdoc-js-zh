  md: '# DHTML for IE4 and NN4


    DHTML (Dynamic HTML) is a marketing term that describes the ability to dynamically
    change the appearance of an HTML page after it has been loaded and displayed.
    Throughout the evolution of the Internet Explorer and Netscape browsers, DHTML
    has been used (and sometimes misused) to refer to many specific competitive features
    of different level browsers. As the era of the browser war approaches its end,
    browser features with respect to Dynamic HTML are finally converging (as we will
    see in the later chapters with 6.x version browsers), making the variety of browsers
    more compatible, and the life of a web designer considerably easier.


    In this chapter, we revisit the early days of DHTML, the height of the browser
    war era. The two browsers that we are focusing on, Internet Explorer 4.x and Netscape
    Navigator 4.x, (both still in use by a sizable base) are as incompatible as browsers
    have ever been. In the days when they were the principal browsers, DHTML loosely
    meant creating an HTML document while it''s being viewed in the browser, in response
    to user interactions or by using preprogrammed JavaScript code.


    While the browser vendors battled it out, implementing different approaches to
    achieve the same dynamic behavior, webmasters and designers had to accommodate
    a large number of incompatible browsers, and have to even today. In this chapter,
    we will explore this formative stage of DHTML development, focusing on the following
    topics:


    +   - Cascading Style Sheets (CSS) and their relationship with DHTML


    +   - Manipulating CSS with JavaScript to create dynamic changes


    +   - IE4.x specific DHTML features


    +   - NS4.x specific DHTML features


    +   - Cross-browser DHTML code


    We''ll put some of these new concepts into practice, and see how they fit into
    the ImageViewer application.'
