    \ For example, look at the code below:\n\n```\nvar myArray = new Object();\nmyObject.someProperty\
    \ = \"123\"\nalert(myObject.someProp);\n```\n\nThis code will fail, without throwing\
    \ any errors. This is because I've tried to add a someProperty to \"123\", and\
    \ then read the property back, I've got a typo in the property's name, which will\
