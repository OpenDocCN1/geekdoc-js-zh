    This type of control has many uses. For example, in an e-commerce site making
    hotel reservations, rather than simply asking the user to enter the data, they
    can click a button to make the pop-up calendar appear, and then easily select
    the date they want.


    Our example consists of two pages for the control, and also the example HTML pages
    that use the control. The control consists of a code file called Calendar.js and
    a stylesheet called CalendarStyleDefinitions.css. The example page is called PopupCalendar.htm.
    We will look at each of these files in the upcoming sections. Note that all three
    files must be placed in the same directory, unless you use the src attribute of
    the <script> tag and the href attribute at the top of PopupCalendar.htm.


    Before we look at the code files in detail, it''s worth taking an overview of
    how the control works. The calendar is actually a table, with each table containing
    a day. The table is created dynamically using JavaScript and then written into
    a <div> element. This <div> element is by default hidden - that is, it positioned
    absolutely with off-screen coordinates. When we want to show the pop-up calendar,
    we create the table, write it into the <div> and then move the <div> element onto
    the screen to the button''s click event that called the calendar.


    > This example only works on IE4 and NN6+, it doesn''t work with NN4 because its
    use of layers as technique for DHTML is difficult to merge with techniques for
    the other browsers.


    # The CSS Stylesheet


    ```

    .calendarTable { cell-spacing: border-width:0px; }

    .dayHeadTR { }

    dayHeadTD (font-family: verdana; font-weight:bold;font-size:10pt;

    cell-spacing: 0px; padding: 0px; border: none white 0px;

    border-bottom: solid black 1px)

    dayTD (font-family: verdana; font-weight:normal; font-size:10pt; padding: 4px;

    cursor: pointer; cursor: hand;)

    emptyTD (font-family: verdana; font-weight:normal; font-size:10pt; padding: 4px;

    cursor: default;

    calendarDiv (position: absolute; left:-100px; top:-1200px; width: 180px;

    border: solid black 2px; background-color: white)

    changeMonthTD (background-color: gray; width: 20px; border: solid black 1px;

    cursor: pointer; cursor: hand)

    ```


