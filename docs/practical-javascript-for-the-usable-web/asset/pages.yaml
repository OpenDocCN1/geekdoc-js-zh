  md: '# # Passing Information Between Web Pages and Data Storage


    This chapter is all about storing and passing data on the client. We''ll begin
    looking at storing information that is needed by a number of pages on a web site
    for the duration of a user''s visit. This is useful for things like storing details
    of a shopping basket


    We can permanently store simple data on the user''s computer using something called
    cookies – so we''ll create functions that make cookie management easy. This allows
    us to store things for when the user returns to our web site, for example site
    preferences like language.


    Finally, we''ll be making more changes to the image viewer, continuing the translation
    of the application to an e-commerce application started in the previous chapter.
    By the end of this chapter, it''ll have a working shopping basket and checkout.


    # # Keeping Information Alive


    One of the problems with web pages is they are essentially stateless, in that
    once you leave the page any information in variables or changes made to the page
    with HTML are lost. There are many times when we want to store information for
    the duration of the user''s visit to the site. The duration of a user''s visit
    is called a session, storing information throughout the visit is called maintaining
    session state. We''ll need to maintain the details of items in our shopping cart
    application regardless of which pages on the web site the user brows. In this
    section, we''ll be looking at two techniques for temporarily storing information
    during a session, giving the impression of state.


    One technique for keeping information alive is to pass it from page to page through
    the URL. This is the first technique we''ll work with, before we move on to storing
    information in cookies.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Chapter 9


    # Passing Information with URLs


    The easiest and most browser compatible client-side technique for passing information
    to another page is to put information inside the URL. You''ve probably done this
    when you run a search at a site like Google. You''ll see something like

    this://www.google.co.uk/search?q=JavaScript&btnG=Google+Search&meta=

    The first part of the URL,google.co.uk/search, specifies the server and directory.
    The question mark specifies the data that will be passed to the page. In this
    example (query) is set to equal JavaScript, because this is the search term being
    used. The remaining parameters specify things like default language and other
    information needed by the server.

    The good news is that not only servers read this information; the browser on the
    client-side can as well. On the other hand, although of course, you can pass a
    bit of information using URLs, they are in fact limited to around 2000 characters.
    And, the user gets to see the information, which may or not matter depending on
    sort of information being passed.


    > Note that none of the examples in this section of the chapter will work with
    IE if we load the page directly from the hard drive IE4 does not recognizes data
    using the file:// protocol. We must load them from a web server for this purpose.
    This is only a problem during testing, but is something to watch out for if you
    use IE4 or earlier. It''s not issue for Netscape and IE5+.


    Data attached to a URL must be placed after a question mark after the end of the
    page name, like this:

    http://myURL/MyDirectory/somePage.htm?MyData


    In this example MyData is the value of the data being passed. We could pass more
    information, like first name, second and age like this:

    http://myURL/MyDirectory/somePage.htm?Paul&Wilton&33


    Sending multiple pieces of data is easy – we simply use an ampersand, &, each
    item of data to delete it. When we receive the data, we can split it and remove
    the ampersands.


    We read the data using the location.search property:


    ```

    var receivedString = location.search;

    ```


    In this example, the receivedString will contain ?Paul&Wilton&33.


    One the problems associated with this method to send data is that only certain
    characters are allowed in URLs. For example, standard alphabetical characters
    and numbers are allowed, but characters such as punctuation are not allowed.


    We can convert the characters that aren''t allowed to their code equivalents using
    JavaScript. This is called escaping. The easiest methods for escaping and its
    reverse, unescaping, are the JavaScript escape() and unescape() functions.


    > The later browsers, IE5.5+ and NN+, also support the encodeURI() and decodeURI()
    methods, which do essentially the same thing.


    276'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Passing Information Between Web Pages and Data Storage


    For example, if our data string is Bob Bobkins, then we can escape it like this:


    ```

    var sendString = escape("Bob Bobkins");

    ```


    Then we could decode the data into a new page:


    ```

    var receiveString = unescape(location.search);

    ```


    We don''t have to escape the data if it is passed as part of a hyperlink''s href
    attribute because the browser does that for us.


    So that''s the behavior behind sending data in the URL. There are three ways to
    get data into the URL:


    +   - Add to the href of an <a> hyperlink element

    - Using JavaScript to navigate to a new page, specifying the data with the page
    name

    - Using a <form> and set its method attribute to get


    This next example, SendInfo.htm, demonstrates each of these ways of sending data:


    ```

    <html>

    <head>

    </head>

    <body>

    <!-- Sending data using a hyperlink --

    <a href="ReceiveInfo.htm?Bob Bobkins&32">Send Data</a>


    <!-- Sending data using JavaScript to create the URL --

    <form>

