    \ window, and is stored in the rightFrame variable. This variable is used to access\
    \ the location property on the frame's window object, and change it to the URL\
    \ that was built dynamically and stored in the url variable. Finally, the currPage\
    \ variable is incremented so the next time the function is called, the next slide\
    \ in the series will be displayed.\n\nSo the code above shows how JavaScript can\
    \ traverse the frame structure and change the document currently displaying in\
    \ the right-hand frame.\n\n# # Complex Framesets\n\nThe last example, updating\
    \ a frame with a new document from a different location, presents a potential\
    \ problem for communicating between frames. If the right-hand frame displays a\
    \ new document itself contains a frameset, this can cause problems if the frames\
    \ within this frameset need to access the top-level window that contains the left-hand\
    \ and right-hand frames.\n\nConsider that the right-hand frame is updated with\
    \ the following HTML file (RightFrameset.html):\n\n```\n```html\n<frameset rows=\"\
    40%,*\"\">\n  <frame src=\"TopRight.html\" name=\"frTopRight\">\n  <frame src=\"\
    BottomRight.html\" name=\"frBottomRight\">\n</frameset>\n</html>\n```\n```\n\n\
    This frameset creates two frames positioned vertically in rows. The TopRight.html\
    \ file has the following code:\n\n```\n```html\n<body>\n  <h3>This is the top\
    \ right frame.</h3>\n</body>\n</html>\n```\n```\n\nand the BottomRight.html file\
    \ has this code:\n\n```\n```html\n<body>\n  <h3>This is the bottom right frame.</h3>\n\
    </body>\n</html>\n```\n```\n\nThe screenshot below shows how this example would\
    \ look when loading this frameset within the right-hand frame:"
