  md: '# Windows and Frames


    ![](img/e58f0457390096aadd869f36b1b05e3c_164_0.png)


    In this scenario, the parent properties of the top-right frame and the bottom-right
    frame no longer reference back to the same top-level window as in the simpler
    frameset of the previous example. If you take a look at the new hierarchical relationships
    between each of the windows you will be able to see the problem more clearly.


    ![](img/e58f0457390096aadd869f36b1b05e3c_164_1.png)


    We can see here that the top part of the hierarchy structure is the same as in
    the previous example. The top level of the structure contains two child windows.
    The difference this is that the second child window is now itself a parent of
    two further child windows.


    The parent property of the window object only refers to the direct parent window
    that contains the child windows. So the parent property of either of the right-hand
    frame''s children is the second child window of the topmost window in the hierarchy.
    For the right-hand frame''s child windows to access the topmost window, you first
    need to reference the parent frameset of these child frames:


    151'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# Chapter 5


    ```

    var rightWindow = parent

    ```


    Next we can reference the topmost window by accessing the parent property of this
    window.


    ```

    var topWindow = rightWindow.parent

    ```


    Or simply combining these two calls will give:


    ```

    var topWindow = parent.parent

    ```


    You can imagine that quite quickly these calls can become long and awkward to
    understand when trying to traverse up down the hierarchical structure. It can
    become even more complicated, for example, one of the right-hand frame''s children
    itself contains an iframe. To access the top most frame from inside the iframe
    will require extending the chain another level (for parent.parent!) To minimize
    these problems and to make your code clearer, it is often useful to store a reference
    to object reference chains in another variable, like the topWindow variable above,
    and then use the reference in the variable in subsequent code:


    ```

    // Change the colour of the left frame background to red

    // from the bottom right frame

    var topWindow = parent.parent

    var leftFrame = topWindow.frRightTopRight

    leftFrame.document.backgroundColor = "red"

    ```


    In the code above, from the bottom right-hand frame a reference to the top-level
    window (the frameset) is obtained. From this window object reference to the first
    child of the frameset, which is the left-hand frame. Finally to the left-hand
    frame window object is used to change the document background color to red.


    The window object contains another property called top. This is a synonym for
    the topmost window in any frame-based hierarchical structure, and acts like a
    shortcut to the top-level window, making our code much easier to write.


    ```

    var topWindow = top

    ```


    From any of the ''Frame Content'' windows you can use the top property to gain
    access to the topmost window. Unfortunately, communication between frames in the
    opposite direction is not simple. You have to extend the object reference chains
    further using the frames property of the right child window, or frame names, to
    reach the bottommost child windows in the hierarchy from the topmost window.


    ```

    var topRightWindow = top.frRight.frTopRight

    var rightBottomWindow = top.frRight.frBottomRight

    ```


    # Image Viewer Application – Part 1


    Over the next three we will use the knowledge presented in each chapter to build
    an Image Viewer application. The purpose of this application is to allow different
    sets of images, such as a photo-album or gallery, to be viewed. The application
    will draw mainly on knowledge discussed in this and the following two chapters
    and require some of the fundamentals of JavaScript language that are presented
    in the earlier chapters of this book.


    152'
