  md: "# Data and Decisions\n\nJavaScript evaluates switch (expression), and then\
    \ compares it to each case. As soon as a match is found, the code starts executing\
    \ and continues through all the case statements. We're using break to stop executing\
    \ the current statement and move on to the next one. It is often useful to find\
    \ a default case that will execute if none of the case statements match. This\
    \ is a helpful tool for picking up on errors, for example, we expected a match\
    \ to occur but a bug has prevented that from happening.\n\nThe values of the case\
    \ can be any data type, numbers or strings for example. We can have just one or\
    \ many cases as we need. Let's look at a simple example:\n\n```\n<html>\n<body>\n\
    <script language=\"JavaScript\">\n// store user entered number between 1 and 4\
    \ in userName\nvar userName = Number(prompt(\"Enter a number between 1 and 4\"\
    ,\"));\n\nswitch (userNumber) {\n // if userName is 1 write out and carry on executing\
    \ after case statement\n case: 1:\ndocument.write(\"Number 1\");\nbreak;\n case:\
    \ 2:\ndocument.write(\"Number 2\");\nbreak;\n case: 3:\ndocument.write(\"Number\
    \ 3\");\nbreak;\n case: 4:\ndocument.write(\"Number 4\");\nbreak;\n default:\n\
    document.write(\"Please enter a numeric value between 1 and 4.\");\nbreak;\n}\n\
    \n// code continues executing here\n</script>\n</body>\n</html>\n```\n\nTry it.\
    \ You should just get the number that you've entered out, or the sentence Please\
    \ enter a numeric value between 1 and 4.\n\nThis example also illustrates the\
    \ importance of the break statement. If we hadn't included break after each case\
    \ execution would have carried on within the block until the end of the switch.\
    \ Try removing the breaks and then enter 2. Everything after the match will execute,\
    \ giving you output:\n\nNumber 2Number 3Number 4ple enter a numeric value between\
    \ 1 and 4\n\nYou can use any expression inside the switch statement - a calculation\
    \ for example:\n\n```\nswitch (userNumber * 100 + someOtherVariable)\n```\n\n\
    You can also have one or more statements in between the case statements.\n\n51"
