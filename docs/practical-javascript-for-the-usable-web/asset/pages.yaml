    </head>\n<body>\n<p>Document Click Example - Click Anywhere</p>\n</body>\n</html>\n\
    ```\n\nWe create the function that will be executed when the document is clicked,\
    \ the document_onclick() function. Ive chosen this name to give away its purpose,\
    \ but it doesn't have to be called this. Then we tell the browser that the document\
    \ is clicked the document_onclick() function should be executed by setting the\
    \ document object's onclick property to reference the function we just created.\
    \ Note that it's important that the function should exist before the line that\
    \ sets this property. However, in the case of document, we don't have to worry\
    \ about where we put the event handler code as we did when setting event handlers\
    \ for page elements that were yet loaded.\n\nIn Chapters 6 and 7 we look at browser\
    \ specific event handling we'll see how we can access details such as the position\
    \ of the mouse when the user clicked.\n\n# HTML Elements and Events\n\nIn older\
    \ browsers, such as NN4 and IE3, the number of HTML elements that have associated\
    \ objects and events is quite limited. In Chapters 6 and 7 we'll see that with\
    \ modern browsers, such as IE4+ and NN6+, most elements have associated objects\
    \ and events.\n\nApart from form elements, we'll be looking shortly, the element\
    \ with the most associated events is the <a>-element. Its events include:\n\n\
    +   - click (not available in IE3)\n- dbclick (not available in IE3 or NN3)\n\
    - mouseover\n- mouseout (not available in IE3)\n- mousedown (not available in\
    \ IE3 or NN3)\n- mouseup (not available in IE3 or NN3)\n\n114"
