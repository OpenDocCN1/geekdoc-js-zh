  md: '# Chapter 1


    Not only different browsers enable us to different things in JavaScript, the way
    certain pieces of functionality are implemented can vary between browsers as well.
    For example, if we''re creating pages accessible to IE4+ and NN4+ browsers, then
    we need to cope with three different ways of accessing HTML tags through JavaScript:


    +   - The IE4+ way that works exclusively with IE4+

    - The NN4 way that works exclusively with NN4

    - The DOM Interface that works with IE5+ and NN6 in depth in this book.


    We''re covering each of these ways in this book.


    # Coping with Different Browsers


    You might be wondering how you can deal effectively with the panoply of JavaScript
    versions and browsers'' programmability. There''s no denying that it is frustrating,
    but there are strategies that you can adopt for dealing with browser issues that
    will make life that bit easier.


    One option, and the one I prefer if possible, is to do two versions of a web site.
    The first version features maximum functionality and works on IE4+ and NN6.(As
    you''ll see in later chapters, pages can be made to work with both IE4+ and NN6
    with a little modification. Making IE4+ pages work with NN4 is not much of a challenge
    because of the limited programmability of NN4 compared with IE4, and the different
    ways that these browsers allow programmatic.)


    The second version is a more basic site, that uses simple HTML and JavaScript,
    if any at all, but still allows access to most of the site''s content. As long
    as you pay careful attention to the design of this second version of the site
    then I can expect it to work with 99% of browsers currently in use out. Then when
    a visitor arrives at any of the pages in the web site I can use browser detection
    scripts, (which we''ll be using later on), to redirect them to the version of
    our web site that works with their browser.


    > If you use this approach to development then you should ensure that the information
    for both versions comes from the same source; for example, a server-side database
    could be used to generate the HTML for both versions.


    There will be times when this approach isn''t going to work through. Sometimes
    the only way to make a web site function in NN4 or with IE4+ is to dump down the
    original site specification. You''ll also have to decide, on a site-by-site,audience-by-audience
    basis, whether you want to support older or less common modern browsers like Opera.


    Three questions will help clarify browsers your site needs to work with:


    +   1. Who will design the web site? If you''re creating a web site dedicated
    to programming the Opera then it''s going to have to work with Opera. Similarly,
    if you''re developing for an Intranet where the browser and version is controlled
    then the question is answered for you.

    2. What does the client want? If they demand it with IE2.0 and remain oblivious
    to your raised eyebrows and sotto voce "you have got to be kidding", then that''s
    what you''re going to have to do.


    10'
