    \ code that we specify in iframe and img selectors will be absolute positioning.\n\
    \n```\nimg, iframe { position:absolute; }\n```\n\nThe next selector sets the default\
    \ appearance of our iframe(s). It is positioned 50 pixels from the top of the\
    \ page, and has a height of 480 pixels. We also make the iframe margin and border\
    \ invisible by setting them to 0 and style='none' respectively."
