- img_proc: true
  md: '# Building the Application


    So to create this application, where do we start? From the graphic above we know
    that we need three areas within our main page. Two users will be able to interact
    with (navigation and thumbnail selection) and a third area to simply display content.
    For this we will create a single page with three <iframe> elements, each area
    being contained within an <iframe>. JavaScript will capture the user''s mouse
    actions and communicate the user''s intentions between the frames.


    The HTML source code for the imageViewer.htm page is detailed below:


    ```

    <html>

    <head>

    <title>Image Viewer</title>

    </head>

    <body>

    <iframe name="categoryFrame" id="categoryFrame" src="CategoryIndex.htm"

    scrolling="auto" frameborder="none">

    </iframe>

    <img src="ScrollUp copy.gif" id="ScrollUpImg" width="142" height="38"

    onclick="scrollUp()"

    alt="Thumbnails Up">

    <iframe name="thumbnailFrame" id="thumbnailFrame" src="DefaultThumbnailImage.gif"

    scrolling="no" frameborder="none" marginwidth="0">

    </iframe>

    <img src="ScrollDown copy.gif" id="ScrollDownImg" width="142" height="38"

    onclick="scrollDown()"

    alt="Thumbnails Down">

    <img src="ImageLoadingLoadingAnimation.gif" id="imageLoadingAnimation"

    width="150" height="40"

    alt="Loading...please wait">

    <iframe name="mainImageFrame" id="mainImageFrame" src="DefaultMainImage.gif"

    scrolling="auto" frameborder="none" marginheight="0" marginwidth="0"

    onload="hideLoadingImage()"

    </iframe>

    </body>

    </html>

    ```


    Each HTML tag has an attribute so that we reference each element within the page
    easily with JavaScript. The iframe categoryFrame and mainImageFrame have their
    scrolling attribute set to auto so that if the contents are larger than the dimensions
    of the iframe browser will scroll automatically.


    Conversely the image for displaying the thumbnails, thumbnailFrame, has its scrolling
    attribute set to no so that the browser will not display scrolls. In this instance
    we are going to use JavaScript to create the scrolling effect. This two <img>
    tags are added, the arrows in the earlier screenshot, and below this second image.
    These images have onclick event handlers, which will capture the user''s mouse
    click action and call a function that will perform the scrolling action within
    the iframe. We must remember to create two functions for the onclick event handlers;
    we will come back to this later.


    A third <img> tag has been added, with the id attribute of imageLoadingAnimation.
    This image is an animated gif file that will be displayed when the user clicks
    on a thumbnail to view an image and is hidden after the image has loaded.'
