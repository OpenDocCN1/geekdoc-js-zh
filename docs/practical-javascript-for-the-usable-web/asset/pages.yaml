    # Updating a Window''s Content


    Once the pop-up window has been opened you at some point, want to change the content
    of that window. With JavaScript there are two ways that you can do: by changing
    the location to view a different HTML document, or by writing the document dynamically.


    Window objects possess a location property that can be used to point the window
    to a new document location. Setting this property to a new URL will cause the
    browser to retrieve a new document and display it in the window, or you can see.


    ```

    helloWin = open("hello.html", "helloWin", "width=200,height=200");

    helloWin.location = "goodbye.html";

    ```


    In the previous chapter we used the document object and the write() method for
    changing the contents of a page as the page is downloading. Every window possesses
    a document object and the write() method can be used to write new content to the
    window. When the write() method is used in this situation a completely new document
    is created, replacing the document that was present.


    There are at least two good reasons why you would want to write a new HTML document
    with JavaScript.


    +   - The HTML is small and web connections can be slow

    - The HTML depends on some other data currently stored within the browser


    So, let''s look at how you would write a new document within a window.'
