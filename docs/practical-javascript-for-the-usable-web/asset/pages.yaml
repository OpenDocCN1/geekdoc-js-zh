    \ does the same thing as the earlier piece, but uses an else statement instead\
    \ of a nested if, and is lines shorter.\n\n# Breaking Out of a Loop\n\nOne thing\
    \ before we move on: you can break a conditional statement or loop using the break\
    \ statement. This simply terminates the block of code running and drops the processing\
    \ through to the next statement. We'll be using this in the next example.\n\n\
    We can have as many if, else, and else ifs as we like, although they can make\
    \ your code terribly complicated if you use too many. If there are a lot of possible\
    \ conditions to check a value in a piece of code then the switch statement, which\
    \ we'll look at next, can be helpful.\n\n# Checking a Number of Conditions: The\
    \ switch statement\n\nThe switch statement allows us to \"switch\" between sections\
    \ of code based on the value of a variable or expression. This is the outline\
    \ of a switch statement:\n\n```\nswitch (expression)\n{\n  case someValue:\n \
    \   // code to execute expression == someValue;\n    break; // end execution\n\
    \  case someIntegerValue:\n    // code to execute expression == someOtherValue;\n\
    \    break; // end execution\n  case yesAnotherValue:\n    // code to execute\
    \ expression == yetAnotherValue;\n    break; // end execution\n  default:\n  \
    \  // code to execute if no values matched\n}\n```"
