  md: '# Summary: The Early Days of HTML


    In this chapter, we had a look at the beginnings of Dynamic HTML (HTML): the ability
    to cause dynamic changes to a web page after it is displayed. We explored the
    fascinating world of Cascading Style Sheets, discovered that CSS can help to secure
    the appearances of a web page from the structure of the page – enabling easy maintenance
    and modifications of a large body of web pages. Furthermore, combining the programming
    power of JavaScript with the appearance control of CSS gives us a great way to
    dynamically change in the resulting HTML document.


    Using the HTML support of IE4+ browsers, we learned that its display engine is
    capable of dynamically re-rendering a web page incrementally. Also most CSS attributes
    to be changed via JavaScript and redisplayed immediately. We also experimented
    with the highly versatile innerHTML property that enables segments of HTML to
    be changed completely and displayed without reloading the HTML page.


    NN4''s support for HTML is different than IE4. While supporting CSS, the CSS properties
    for programmatic access via JavaScript are read only. Instead, NN4 relies on a
    new tag <layer> that enables layers of HTML content to be positioned, made visible/invisible,
    and dynamically rewritten under programmatic control. Creating a <div> (or other
    elements that can be positioned) absolute positioning is equivalent to creating
    a layer.


    The different HTML support provided by NN4 and IE4 creates major problems when
    writing cross-browser HTML code. While it is possible, true cross-browser HTML
    code is very restrictive in terms of expressiveness and capability. Instead, it
    is very common to test for the browser being used, and then execute browser specific
    HTML code. We examined three different techniques for browser detection, and discuss
    the pros and cons of using each one.


    Finally, we continued our analysis of the ImageViewer application, and applied
    our knowledge of CSS, HTML, and cross-browser HTML programming to explain the
    various elements of the application – a collapsible list created using HTML coding.


    The widespread complaint from the web design community about the terrible incompatibilities
    between the 4.x browsers did not fall on deaf ears. By the next generation, IE
    6.x, 6.x, compatibility of HTML support has reached an all time high – thanks
    to a large part to a new object model standard from W3C, known as the W3C Document
    Object Model (DOM). We will look at the DOM in the next chapter.'
