  md: "# Checking that Cookies are Enabled\n\nThe newer browsers, IE4+ and NN6+, support\
    \ the cookieEnabled property of the navigator object, which returns true if cookies\
    \ are enabled. The only way to find out if cookies are enabled on the older browsers,\
    \ though, is to write a cookie and read it back. If what's read back empty, then\
    \ we know cookies don't work on this user's browser. Here's the cookiesEnabled()\
    \ function:\n\n```\nfunction cookiesEnabled() {\n  var cookiesEnabled = window.navigator.cookieEnabled;\n\
    \n  if (!cookiesEnabled) {\n    document.cookie = \"cookiesEnabled=True\";\n \
    \   cookiesEnabled = new Boolean(document.cookie).valueOf();\n  }\n\n  return\
    \ cookiesEnabled;\n}\n```\n\nWe first obtain the value of window.navigator.cookieEnabled,\
    \ which will tell us whether cookies are enabled in IE4+ and NN6+ browsers:\n\n\
    ```\nvar cookiesEnabled = window.navigator.cookieEnabled;\n```\n\nIf it's false\
    \ then were either dealing with an older browser like NN4, or a newer browser\
    \ that has cookies disabled. We write a simple cookie called cookiesEnabled and\
    \ set it to the value true. We then read it back and convert the result to a Boolean:\n\
    \n```\nif (!cookiesEnabled) {\n  document.cookie = \"cookiesEnabled=True\";\n\
    \  cookiesEnabled = new Boolean(document.cookie).valueOf();\n}\n```\n\nOn the\
    \ final line we return whether cookies were enabled:\n\n```\nreturn cookiesEnabled;\n\
    ```\n\nThat's the last of the cookie functions that we're going to be building\
    \ here. Next we'll put them to use.\n\n# Working with the Cookie Functions\n\n\
    In this section, we'll create a simple example to demonstrate using the CookieFunction.js\
    \ file and the functions we've stored in it.\n\nThe script tasks tackle one of\
    \ the most irritating factors of online forms: not saving the values that you've\
    \ entered. Suppose you're running a search for a book. You enter the author's\
    \ last name, the year of publication, and the publishing house, but hit the search\
    \ button. Your initial search returns more results than you really want, so you\
    \ hit the back button in order to refine it, and find that the form is completely\
    \ empty. Even though you just want to add extra information, you have to fill\
    \ out all the other information again too, which is a waste of time, and definitely\
    \ not user-friendly."
