    item value is John\n\nindexKey is SingerLeadGuitar2\nitem value is Paul\n\nindexKey\
    \ is Bass\nitem value is George\n\n# Repeating Actions According to a Decision:\
    \ The While Loop\n\nThe loops we have been working with so far take the instruction\
    \ to stop looping inside the script itself. There are likely be times when you'll\
    \ want to use the order to determine when the loop should stop, or for the loop\
    \ to stop when a user-led condition is met. The while and dowhile loops are intended\
    \ for just this sort of situation.\n\nIn its simplest form a while loop looks\
    \ like this:\n\n```\nwhile (some condition true)\n{\n    // loop code\n}\n```\n\
    \nThe condition inside the curly braces can be anything you might use in an if\
    \ statement. We could use some code like this to elicit numbers from a user until\
    \ they enter the number 99, for example:\n\n```\n<html>\n<body>\n<script language=\"\
    JavaScript\">\n  var usersRouter = new Array();\n  var userInput = 0;\n  var arrayIndex\
    \ = 0;\n\n  //loop for as long as the user doesn't input 99\n  while (userInput\
    \ != 99) {\n    userInput = prompt(\"Enter a number, or 99 to exit\", \"99\");\n\
    \    numbers[arrayIndex] = userInput;\n    arrayIndex++;\n  }\n</script>\n</body>\n\
    </html>\n```\n\nHere we loop's condition is that userInput is not equal to 99,\
    \ so the loop will continue so long as the condition is true. When the user enters\
    \ 99 and the condition is tested it will evaluate to false and the loop will end.\
    \ Note the loop doesn't end as soon as the user enters 99 but only when the condition\
    \ is tested again at the start of another iteration of the loop."
