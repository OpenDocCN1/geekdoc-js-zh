  md: '# Data Validation Techniques


    If we want a form element to be compulsory and specify the data type, then we
    just add them after the other, as in the example: _Compulsory_alphabetic. We need
    to make sure we get the order correct, that is first specify if the element is
    compulsory and then specify the type of data: _alphabetic_Compulsory is not valid.


    If we don''t need a form element to be compulsory, but any data entered must be
    of a valid alphabetic type, we write _NotCompulsory_alphabetic. Note this won''t
    work with data types where the format is not as the characters entered, so it
    will work with an alphabetic character, but not a post code check. This is because
    the non-format checking validation methods allow empty strings to be valid. The
    format specific methods don''t allow an empty string to be valid, and so are always
    compulsory.


    If we don''t want a form element to be part of the automatic validation process,
    then we simply leave off the compulsory and data type parts of the name string
    so that it will be ignored.


    We can add _Compulsory to radio button groups where we want to ensure that the
    user has selected one of the buttons. However, as we set their value ourselves,
    we don''t check radio button groups for data type validity.


    The variations are summarized below:


    | Action | Postfix For Name Value | Example |

    |---|---|---||

    | Don''t validate all | nothing | name="MyElementsName" |

    | Check the element has been filled in, but don''t check the data type | _Compulsory
    | name="MyElementsName_Compulsory" |

    | Check the type of the data, if any, but the data is not compulsory | _NotCompulsory_datatype
    | name="MyElementsName_NotCompulsory_alphabetic" |

    | Check that the element has been filled in and check the type of the data | _Compulsory_datatype
    | name="MyElementsName_Compulsory_alphabetic" |


    The range of data types that can be checked is determined by the data validation
