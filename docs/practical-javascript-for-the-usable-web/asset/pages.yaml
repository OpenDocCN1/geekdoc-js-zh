  md: "Note that all the attributes except secure are set to a value. This is because\
    \ secure is a flag. If it's present then the cookie data will only be sent over\
    \ a secure connection, and if it's not then the cookie data is sent over any connection.\
    \ In this case, because of the secure attribute the cookie information will only\
    \ be passed if server communications are over a secure connection, for example\
    \ the page has been loaded from https://www.mydomain.com/mypage.htm.\n\nIn the\
    \ next section, among other things we'll create a function that makes setting\
    \ the various cookie attributes easy.\n\n# Making Cookies Easy: Cookie Functions\n\
    \nIn this section we'll create a number of functions that make working with cookies\
    \ quick and easy. We'll create functions that:\n\n+   - Read and write cookies\n\
    - Read and write multi-value cookies\n- Delete a cookie\n- Detect if cookies have\
    \ been enabled\n\nWe'll finish off with an example demonstrating the functions.\n\
    \n# Writing a Cookie\n\nHere's the code. To make it easy to reuse the functions,\
    \ simply create a file, CookieFunctions.js and place all the function code in\
    \ it.\n\n```\nfunction writeCookie(cookieName,\n                  cookieValue,\n\
    \                  expires,\n                  domain,\n                  path,\n\
    \                  secureFlag)\n{\n  if (cookieName)\n{\n    var cookieDetails\
    \ = cookieName + \" =\" + escape(cookieValue);\n    cookieDetails += (expires\
    \ ? \" expires=\" + expires.toGMTString() + \";\" : \"\");\n    cookieDetails\
    \ += (domain ? \" domain=\" + domain : \"\");\n    cookieDetails += (path ? \"\
    \ path=\" + path : \"\");\n    cookieDetails += (secureFlag ? \" secure=\" : \"\
    \");\n    document.cookie = cookieDetails;\n  }\n}\n```\n\nThe function takes\
    \ 6 parameters that match the attributes of a cookie (all of which are optional\
    \ except the first two). The expires parameter must contain a Date object with\
    \ a valid date and the secureFlag parameter a Boolean value, true or false. The\
    \ remaining parameters are strings."
