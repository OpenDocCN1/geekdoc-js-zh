    # Making Decisions in JavaScript


    Decision-making is what gives programs their apparent intelligence. You can''t
    write a good program without it, whether you''re creating a game, checking a password,
    giving the user a set of choices based on previous decisions they have made, or
    something else.


    Decisions are based on conditional statements, which are simply statements that
    evaluate to true or false. This is where the primitive Boolean data type comes
    in useful. Loops are the other essential tool of decision-making, enabling you
    to loop through user input, or an array for example, and make decisions accordingly.


    # The Logical and Comparison Operators


    There are two main groups of operators we''ll look at:


    +   - Data comparison operators: compare operands and return Boolean values

