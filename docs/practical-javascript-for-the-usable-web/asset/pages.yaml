  md: "# # An Aside about Functions\n\nWe'll be talking about functions in much more\
    \ depth in Chapter 3, but we should introduce them here because you can't get\
    \ far in JavaScript without an understanding of functions. Functions are blocks\
    \ of code, surrounded by curly braces, which you create to perform a helpful task.\
    \ JavaScript contains functions that are available for us to use and perform tasks\
    \ like displaying a message to the user.\n\nWe can also create our own functions,\
    \ which is what we did in the previous code block. Let's say we create some code\
    \ that works out what the browser user has. We'd probably want to use it again\
    \ and in different situations. While we could cut and paste code blocks wherever\
    \ we wanted to move them, this approach can make the code excessively long; for\
    \ if you want the same piece of code three or four times within one page it'll\
    \ get pretty hard to decipher and debug. So instead we can wrap the browser-checking\
    \ functionality into a function and then provide any information that the function\
    \ needs in order to work using parameters. A function can also return a value\
    \ to the code that called the function into action originally.\n\nTo call a function\
    \ simply write its name, but you cannot do that, as you might expect, until the\
    \ script has created it. We can call it in this script by adding it to the third\
    \ script block like this:\n\n```\n<script language=\"JavaScript\">\nalert(\"Third\
    \ script Block\");\n\nfunction doSomething() {\n  alert(\"Function in Third script\
    \ Block\");\n}\n\n//call the function doSomething\ndoSomething();\n</script>\n\
    <body>\n</html>\n```\n\nSo in this chapter we've covered the pros and cons of\
    \ the JavaScript language, some of the syntax rules, learned about some of the\
    \ main components of the language, albeit briefly, and run a few JavaScript scripts.\
    \ We've covered a lot of distance. Before we move on to a more detailed examination\
    \ of the JavaScript language in the next chapter, however, we should talk something\
    \ key to successful JavaScript development: objects.\n\n# # Objects\n\nObjects\
    \ are central to the way we use JavaScript in a web page. Objects in JavaScript\
    \ are in many ways like objects in programming (it does exist, just I had a look).\
    \ In the real world, an object is just a 'thing': a car, a table, a chair, and\
    \ the keyboard I'm typing on. Objects have:\n\n+   - **Properties**: the red car\n\
    - **Methods**: the method for starting the car might be *turn ignition key*\n\
    - **Events**: turning the ignition key results in the *car starting*"
