  md: "# Chapter 1\n\nSome of the code may not make sense yet, depending on your previous\
    \ JavaScript experience. That matters for now is it's clear how comments are used,\
    \ what a code block is, and why semicolons are at the end of the statements. You\
    \ can run this script if you - just copy it into an HTML page and run it through\
    \ your browser.\n\nAlthough statements like if and else span more than one line\
    \ and contain other statements, are considered single statements and don't need\
    \ a semicolon after them. The JavaScript interpreter knows that the lines linked\
    \ with an if statement should be treated as one block because of the curly braces.\
    \ We will be looking at variables and conditional statements (if and else) in\
    \ the next chapter.\n\n# Code Execution\n\nThe browser reads the page from top\
    \ to bottom, the order in which code executes depends on the order of the script\
    \ blocks. (Note that it's not just the browser that can read our code, the user\
    \ of our sites can view our code so it's not a good idea to put anything secret\
    \ or sensitive in we.) There are three script blocks in this next example:\n\n\
    ```\n<head>\n<script language=\"JavaScript\">\n  alert(\"First script Block\"\
    );\n  alert(\"First script Block - Second Line\");\n</script>\n<body>\n<h1>Test\
    \ Page</h1>\n<script language=\"JavaScript\">\n  alert(\"Second script Block\"\
    );\n</script>\n<p>Some more HTML</p>\n<script language=\"JavaScript\">\n\n  alert(\"\
    Third script Block\");\n\n  function doSomething() {\n    alert(\"Function in\
    \ Third script Block\");\n  }\n</script>\n</body>\n</html>\n```\n\nIf you try\
    \ it out, you'll see that the alert in the first script block appears first displaying\
    \ the message First script Block, followed by the next alert command in the second\
    \ line displaying the message First script Block - Second Line.\n\nThe interpreter\
    \ continues the page and comes to the second script block, where the alert function\
    \ displays Second script block, following it with the alert statement that displays\
    \ Third script block. Although there's another alert command inside the function\
    \ below, it doesn't execute and display the message. This is because it's inside\
    \ a function (function doSomething) and code inside functions will only execute\
    \ when they're called.\n\n# 14"
