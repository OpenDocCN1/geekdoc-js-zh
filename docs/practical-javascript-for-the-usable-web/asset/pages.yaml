  md: '# Advanced Form Techniques


    This is so words such as "Williams" do not match – our word must end at the m
    or n.


    In the table below, some of the special characters that match specific classes
    of characters are listed. For example, \w matches any letter or an underscore.


    | Character Class | Characters it Matches | Example |

    | --- | --- | --- |

    | \d | Any digit, 0-9 | \d matches 72, but not aa or 7a |

    | \D | Any character not a digit | \D\D matches abc, but not 123 |

    | \w | Any word character, such as A-Z, a-z, 0-9, and the underscore character
    | \w\w\w matches Ab_2, but not F$%* or Ab_ |

    | \W | Any non-word character | \w matches @, but not the letter a |

    | \s | Any whitespace character, includes tab, newline, carriage return, formfeed,
    and vertical tab | |

    | \S | Any non-whitespace character | |

    | [...] | Any one of the characters between the square brackets | [abc] will match
    a or b or c, but nothing else |

    | [^...] | Any character, except inside the square brackets | [a-z] will match
    any character in the range a to z

    [abc...] will match any character except a or b or C could be matched by this
    pattern

    [^a-z] will match any character which is not in the range a to z, but all uppercase
    letters could be matched by this pattern |


    The next table details the repetition characters. For example, + specifies that
    the last item should be matched or more times:


    | Special Character | Meaning | Example |

    | --- | --- | --- |

    | {n} | Match n of the previous item | x{2} matches xx, but not x xxx |

    | {n, } | Match n or more of the previous item | x{2, } matches two or more x''s,
    that is xx, xxx, xxxx, xxxxx, ... |


    Table continued on following page


    269'
  merge: -1
