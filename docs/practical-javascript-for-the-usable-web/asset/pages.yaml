  md: '# About the Authors


    # Paul Wilton


    ![](img/e58f0457390096aadd869f36b1b05e3c_5_0.png)


    After an initial stint as a Visual Basic applications programmer at the Ministry
    of Defence in the UK, Paul Wilton found himself pulled into the Net. He is currently
    working freelance and is busy trying to piece together the Microsoft .Net jigsaw.
    Paul''s main skills are in developing web front ends using DHTML, JavaScript,
    VBScript, and Visual Basic, and back-end solutions with ASP, Visual Basic, and
    SQL Server. He would like to thank his fiancée, Catherine, for all his patience
    and caring.


    # Stephen Williams


    ![](img/e58f0457390096aadd869f36b1b05e3c_5_1.png)


    Steve recently co-founded Chimera Digital Ltd, a company that brings together
    expertise in the fields of education, video production and technologies, and produces
    content packages suitable for business in training, promotion, marketing, and
    more. Prior to this he worked for Edison Interactive, where he was the lead Vignette
    developer for their Switch2 entertainment portal web site.


    His interests in artificial life lead him from his PhD in Molecular Microbiology
    at the University of Birmingham, into object-oriented programming and the Internet.


    # Sing Li


    ![](img/e58f0457390096aadd869f36b1b05e3c_5_2.png)


    Sing Li is an active author, consultant, and entrepreneur. He has written for
    popular technical journals and is the creator of the "Internet Global Phone",
    one of the very first Internet phones available. His wide-ranging consulting expertise
    spans Internet and Intranet systems, distributed architectures, web services,
    embedded systems, real-time technologies, and cross-platform software design.
    He also participates in the Jini and Jxta communities.'
