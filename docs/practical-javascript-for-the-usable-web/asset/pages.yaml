    # Code Changes


    That covers the interface changes, so it''s now time to take an overview of the
    code changes.

    Although the e-commerce image viewer looks virtually identical to the previous
    version, this may be in fact a frames-based application. The top frametransfer-defining
    page enables us to use JavaScript code that stores the shopping basket information
    for the duration of the customer''s visit. This may seem odd, but one way of maintaining
    state (that is, keeping information "alive") is to store variables in a top framet
    page that is never unloaded. We will discuss this and other maintaining state
    techniques in Chapter 9.


    The frametransfer page only defines one frame, namely a frame that holds the ImageView.htm
    of our previous incarnation of the image viewer. In addition, the frametransfer
    page holds a lot of JavaScript code that is imported from .js files.


    As well as our new frametransfer, we also have new pages for the shopping basket
    and each stage of the checkout. However most of these pages contain very little
    or no code – almost all the code is in .js files, of which there are new ones:


    | CreditCard.js | Defines a CreditCard class to store user''s credit card details
    |

    | Customer.js | Defines a Customer class to store customer details |

    | ecomCode.js | General e-commerce related code |

    | ShoppingBasket.js | Defines a ShoppingBasket and ShoppingItem class for creating
    a shopping basket |

    | Validate.js | Defines a Validate class to validate data |


    We are creating the code for the CreditCard.js, Customer.js and ShoppingBasket.js
    files in the next chapter, and the code for Validate.js in Chapter 10.


    262'
