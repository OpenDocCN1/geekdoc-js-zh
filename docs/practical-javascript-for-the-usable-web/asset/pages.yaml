  md: 'Being able to use the addition operator with strings is handy, but it can also
    generate unexpected results if one of the values you''re working with happens
    to be of a different data type to the one you''re expecting. We''ll be looking
    at some example like this, and resolving them later.


    It''s less of a problem if you''re working with literal values as we have been
    doing so far. However, much of the data you''ll be working with your programs
